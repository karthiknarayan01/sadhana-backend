id: shankaracaryashtottarashatanamastotram
category: stotram
name:
  english: shankaracaryashtottarashatanamastotram
  devanagari: शङ्कराचार्याष्टोत्तरशतनामस्तोत्रम्
content:
  english: shishyahrittapaharakah || 3|| parivrajashramoddharta sarvatantrasvatantradhih | advaitasthapanacaryassakshacchankararupabhrit
    || 4|| shanmatasthapanacaryastrayimarga prakashakah | vedavedantatattvajno durvadimatakhandanah ||
    5|| vairagyaniratashshantassamsararnavatarakah | prasannavadanambhojah paramarthaprakashakah || 6||
    puranasmritisarajno nityatripto mahanchucih | nityanando niratamko nissamgo nirmalatmakah || 7|| nirmamo
    nirahankaro vishvavandyapadambujah | sattvapradhanassadbhavassankhyatitagunojjvalah || 8|| anaghassarahridayassudhisarasvatapradah
    | satyatma punyashilashca sankhyayogavilakshanah || 9|| taporashir mahatejo gunatrayavibhagavit |
    kalighnah kalakarmajnastamogunanivarakah || 10|| bhagavanbharatijeta sharadahvanapanditah | dharmadharmavibhavajno
    lakshyabhedapradarshakah || 11|| nadabindukalabhijno yogihritpadmabhaskarah | atindriyajnananidhirnityanityavivekavan
    || 12|| cidanandashcinmayatma parkayapraveshakrit | amanushacaritradhyah kshemadayi kshamakarah ||
    13|| bhavyo bhadraprado bhuri mahima vishvaranjakah | svaprakashassadadharo vishvabandhushshubhodayah
    || 14|| vishalakirtirvagishassarvalokahitotsukah | kailasayatrasamprapta candramauliprapujakah ||
    15|| kamcyam shricakra rajakhya yantra sthapana dikshitah | shricakratmaka tatanka toshitamba manorathah
    || 16|| brahmasutropanishadbhashyadigranthakalpakah | caturdikcaturamnayapratishthata mahamatih ||
    17|| dvisaptati matocchetta sarvadigvijayaprabhuh | kashayavasanopeto bhasmoddhuḻitavigrahah || 18||
    jnanatmakaikadandadhyah kamandalulasatkarah | gurubhumandalacaryo bhagavatpadasamjnakah || 19|| vyasasamdarshanapritah
    rishyashringapureshvarah | saundaryalahari mukhya bahustotra vidhayakah || 20|| catushshashtikalabhijno
    brahmarakshasaposhakah | shrimanmandanamishrakhyasvambhujayasannutah || 21|| totakacaryasampujya padmapadarcitanghrikah
    | hastamalayogindra brahmajnanapradayakah || 22|| sureshvarakhya sacchishya sanyasashrama dayakah
    | nrisimhabhaktassadratnagarbhaherambapujakah || 23|| vyakhyasimhasanadhisho jagatpujyo jagadguruh
    | iti shrimacchankaracaryasarvalokaguroh param || 24|| namnamashtottarashatam bhuktimuktiphalapradam
    | trisandhyam yah pathedbhaktya sarvankamanavapnuyat || || iti shrimacchankaracaryashtottarashatanamastotram
    |
  devanagari: शिष्यहृत्तापहारकः ।। ३।। परिव्राजाश्रमोद्धर्ता सर्वतन्त्रस्वतन्त्रधीः । अद्वैतस्थापनाचार्यस्साक्षाच्छङ्कररूपभृत्
    ।। ४।। षन्मतस्थापनाचार्यस्त्रयीमार्ग प्रकाशकः । वेदवेदान्ततत्त्वज्ञो दुर्वादिमतखण्डनः ।। ५।। वैराग्यनिरतश्शान्तस्संसारार्णवतारकः
    । प्रसन्नवदनाम्भोजः परमार्थप्रकाशकः ।। ६।। पुराणस्मृतिसारज्ञो नित्यतृप्तो महाञ्छुचिः । नित्यानन्दो
    निरातंको निस्संगो निर्मलात्मकः ।। ७।। निर्ममो निरहङ्कारो विश्ववन्द्यपदाम्बुजः । सत्त्वप्रधानस्सद्भावस्सङ्ख्यातीतगुणोज्ज्वलः
    ।। ८।। अनघस्सारहृदयस्सुधीसारस्वतप्रदः । सत्यात्मा पुण्यशीलश्च साङ्ख्ययोगविलक्षणः ।। ९।। तपोराशिर्
    महातेजो गुणत्रयविभागवित् । कलिघ्नः कालकर्मज्ञस्तमोगुणनिवारकः ।। १०।। भगवान्भारतीजेता शारदाह्वानपण्दितः
    । धर्माधर्मविभावज्ञो लक्ष्यभेदप्रदर्शकः ।। ११।। नादबिन्दुकलाभिज्ञो योगिहृत्पद्मभास्करः । अतीन्द्रियज्ञाननिधिर्नित्यानित्यविवेकवान्
    ।। १२।। चिदानन्दश्चिन्मयात्मा पर्कायप्रवेशकृत् । अमानुषचरित्राढ्यः क्षेमदायी क्षमाकरः ।। १३।। भव्यो
    भद्रप्रदो भूरि महिमा विश्वरञ्जकः । स्वप्रकाशस्सदाधारो विश्वबन्धुश्शुभोदयः ।। १४।। विशालकीर्तिर्वागीशस्सर्वलोकहितोत्सुकः
    । कैलासयात्रसंप्राप्त चन्द्रमौलिप्रपूजकः ।। १५।। कांच्यां श्रीचक्र राजख्य यन्त्र स्थापन दीक्षितः ।
    श्रीचक्रात्मक ताटङ्क तोषिताम्बा मनोरथः ।। १६।। ब्रह्मसूत्रोपनिषद्भाष्यादिग्रन्थकल्पकः । चतुर्दिक्चतुराम्नायप्रतिष्ठाता
    महामतिः ।। १७।। द्विसप्तति मतोच्छेत्ता सर्वदिग्विजयप्रभुः । काषायवसनोपेतो भस्मोद्धूळितविग्रहः ।। १८।।
    ज्ञानत्मकैकदण्डाढ्यः कमण्डलुलसत्करः । गुरुभूमण्डलाचार्यो भगवत्पादसंज्ञकः ।। १९।। व्याससंदर्शनप्रीतः
    ऋष्यशृङ्गपुरेश्वरः । सौन्दर्यलहरी मुख्य बहुस्तोत्र विधायकः ।। २०।। चतुष्षष्टिकलाभिज्ञो ब्रह्मराक्षसपोषकः
    । श्रीमन्मण्डनमिश्राख्यस्वंभूजयसन्नुतः ।। २१।। तोटकाचार्यसम्पूज्य पद्मपादर्चिताङ्घ्रिकः । हस्तामलयोगिन्द्र
    ब्रह्मज्ञानप्रदायकः ।। २२।। सुरेश्वराख्य सच्छिष्य सन्यासाश्रम दायकः । नृसिंहभक्तस्सद्रत्नगर्भहेरम्बपूजकः
    ।। २३।। व्याख्यसिंहासनाधीशो जगत्पूज्यो जगद्गुरुः । इति श्रीमच्छङ्कराचार्यसर्वलोकगुरोः परम् ।। २४।।
    नाम्नामष्टोत्तरशतं भुक्तिमुक्तिफलप्रदं । त्रिसन्ध्यं यः पठेद्भक्त्या सर्वान्कामानवाप्नुयात् ।। ।।
    इति श्रीमच्छङ्कराचार्याष्टोत्तरशतनामस्तोत्रम् ।
