    नमः । १०१६ स्तोत्रफलश्रुतिः । दुर्गानामसहस्राख्यं स्तोत्रं तन्त्रोत्तमोत्तमम् । पठनात् श्रवणात्सद्यो
    नरो मुच्येत सङ्कटात् ॥ १॥ अश्वमेधसहस्राणां वाजपेयस्य कोटयः । सकृत्पाठेन जायन्ते महामायाप्रसादतः ॥
    २॥ य इदं पठति नित्यं देव्यागारे कृताञ्जलिः । किं तस्य दुर्लभं देवि दिवि भुवि रसातले ॥ ३॥ स दीर्घायुः
    सुखी वाग्मी निश्चितं पर्वतात्मजे । श्रद्धयाऽश्रद्धया वापि दुर्गानामप्रसादतः ॥ ४॥ य इदं पठते नित्यं
    देवीभक्तो मुदान्वितः । तस्य शत्रुक्षयं याति तथा शक्रसमो भवेत् ॥ ५॥ प्रतिनाम समुच्चार्य स्रोतसि यः
    प्रपूजयेत् । षण्मासाभ्यन्तरे देवि निर्धनी धनवान् भवेत् ॥ ६॥ वन्ध्या वा काकवन्ध्या वा मृतवत्सा च याऽङ्गना
    । अस्य प्रयोगमात्रेण बहुपुत्रवती भवेत् ॥ ७॥ आरोग्यार्थे शतावृत्तिः पुत्रार्थे ह्येकवत्सरम् । दीप्ताग्निसन्निधौ
    पाठात् अपापो भवति ध्रुवम् ॥ ८॥ अष्टोत्तरशतेनास्य पुरश्चर्या विधीयते । कलौ चतुर्गुणं प्रोक्तं पुरश्चरणसिद्धये
    ॥ ९॥ जपाकमलपुष्पं च चम्पकं नागकेशरम् । कदम्बं कुसुमं चापि प्रतिनाम्ना समर्चयेत् ॥ १०॥ प्रणवादिनमोऽन्तेन
    चतुर्थ्यन्तेन मन्त्रवित् । स्रोतसि पूजयित्वा तु उपहारं समर्पयेत् ॥ ११॥ इच्छाज्ञानक्रियासिद्धिर्निश्चतं
    गिरिनन्दिनि । देहान्ते परमं स्थानं यत्सुरैरपि दुर्लभम् ॥ १२॥ स यास्यति न सन्देहो श्रीदुर्गानामकीर्तनात्
    । भजेद्दुर्गां स्मरेद्दुर्गां जपेद्दुर्गां शिवप्रियाम् । तत्क्षणात् शिवमाप्नोति सत्यं सत्यं वरानने
    ॥ १३॥ ॥ इति तन्त्रराजतन्त्रान्तर्गता स्तोत्रमुद्धृता श्रीदुर्गासहस्रनामावलिः समाप्ता ॥
