id: garbharakshastotra-2
category: raksha
name:
  english: garbharakshastotra
  devanagari: गर्भरक्शास्तोत्र
content:
  english: garbharakshanastotram ehyahi bhagavan brahman prajakartah prajapate | pragrihnishva balim saimam
    sapatyam raksha garbhinim || 1|| ashvinau devadeveshau pragrihnidhan balim tvimam | sapatyam garbhinim
    saimam sa rakshatam pujayanaya || 2|| rudresha ekadasha proktah pragrihnantu balim tvimam | yakshagamapritaye
    vrittam nityam rakshantu garbhinim || 3|| aditya dvadasha proktah pragrihnidhvam balim tvimam | asmakam
    tejasam vriddhyai nityam rakshatu garbhinim || 4|| vinayaka ganadhyaksha shivaputra mahabala | pragrihnishva
    balim saimam sapatyam raksha garbhinim || 5 || skanda shanmukha devesha putrapritivivardhana | pragrihnishva
    balim saimam sapatyam raksha garbhinim || 6|| prabhasah prabhavashyamah pratyasau maruto'nalah | dhruvadhara
    dharashaiva vasaveshtau prakirtitah | pragrihnishva balim saimam nityam rakshatu garbhinim || 7||
    pitridevi pitrishreshthe bahuputri mahabale | budhashreshthe nishavase nivritte shaunakapriye | pragrihnishva
    balim saimam sapatyam raksha garbhinim || 8|| raksha raksha mahadeva bhaktanugrahakaraka | pakshivahana
    govinda sapatyam raksha garbhinim || 9|| iti garbharakshanastotram sampurnam |
  devanagari: गर्भरक्षणस्तोत्रम् एह्यहि भगवन् ब्रह्मन् प्रजाकर्तः प्रजापते । प्रगृह्णीष्व बलिं सैमं सापत्यं
    रक्ष गर्भिणीम् ॥ १॥ अश्विनौ देवदेवेशौ प्रगृह्णीधन् बलिं त्विमम् । सापत्यं गर्भिणीं सैमं स रक्षतां
    पूजयानया ॥ २॥ रुद्रेशा एकादश प्रोक्ताः प्रगृह्णन्तु बलिं त्विमम् । यक्षागमप्रीतये वृत्तं नित्यं रक्षन्तु
    गर्भिणीम् ॥ ३॥ आदित्या द्वादश प्रोक्ताः प्रगृह्णीध्वं बलिं त्विमाम् । अस्माकं तेजसां वृद्ध्यै नित्यं
    रक्षतु गर्भिणीम् ॥ ४॥ विनायक गणाध्यक्ष शिवपुत्र महाबल । प्रगृह्णीष्व बलिं सैमं सापत्यं रक्ष गर्भिणीम्
    ॥ ५ ॥ स्कन्द षण्मुख देवेश पुत्रप्रीतिविवर्धन । प्रगृह्णीष्व बलिं सैमं सापत्यं रक्ष गर्भिणीम् ॥ ६॥
    प्रभासः प्रभवश्यामः प्रत्यासौ मारुतोऽनलः । ध्रुवाधर धराशैव वसवेष्टौ प्रकीर्तितः । प्रगृह्णीष्व बलिं
    सैमं नित्यं रक्षतु गर्भिणीम् ॥ ७॥ पितृदेवि पितृश्रेष्ठे बहुपुत्रि महाबले । बुधश्रेष्ठे निशावासे निवृत्ते
    शौनकप्रिये । प्रगृह्णीष्व बलिं सैमं सापत्यं रक्ष गर्भिणीम् ॥ ८॥ रक्ष रक्ष महादेव भक्तानुग्रहकारक ।
    पक्षिवाहन गोविन्द सापत्यं रक्ष गर्भिणीम् ॥ ९॥ इति गर्भरक्षणस्तोत्रं सम्पूर्णम् ।
