id: navaratna-malika-stotram
category: stotram
name:
  english: Navaratna Malika Stotram
content:
  english: haranupurakiritakundalavibhushitavayavashobhinim karaneshavaramaulikotiparikalpyamanapadapithikam
    | kalakalaphanipashabanadhanurankushamarunamekhalam phalabhutilakalocanam manasi bhavayami paradevatam
    || || gandhasaraghanasaracarunavanagavallirasavasinim sandhyaragamadhuradharabharanasundarananashucismitam
    | mandharayatavilocanamamalabalacandrakritashekharim indiraramanasodarim manasi bhavayami paradevatam
    || || smeracarumukhamandalam vimalagandalambimanimandalam haradamaparishobhamanakucabharabhirutanumadhyamam
    | viragarvaharanupuram vividhakaraneshavarapithikam maravairisahacarinim manasi bhavayami paradevatam
    || || bhuribharadharakundalindramanibaddhabhuvalayapithikam varirashimanimekhalavalayavahnimandalasharirinim
    | varisaravahakundalam gaganashekharim ca paramatmikam carucandravilocanam manasi bhavayami paradevatam
    || || kundalatrividhakonamandalaviharashaddalasamullasa tpundarikamukhabhedinim ca pracandabhanubhasamujjvalam
    | mandalenduparivahitamritataranginimarunarupinim mandalantamanidipikam manasi bhavayami paradevatam
    || || varanananamayuravahamukhadahavaranapayodharam caranadisurasundaricikurashekarikritapadambujam
    | karanadhipatipancakaprakritikaranaprathamamatrikam varanantamukhaparanam manasi bhavayami paradevatam
    || || padmakantipadapanipallavapayodharananasaroruham padmaragamanimekhalavalayanivishobhitanitambinim
    | padmasambhavasadashivantamayapancaratnapadapithikam padminim pranavarupinim manasi bhavayami paradevatam
    || || agamapranavapithikamamalavarnamangalasharirinim agamavayavashobhinimakhilavedasarakritashekharim
    | mulamantramukhamandalam muditanadabindunavayauvanam matrikam tripurasundarim manasi bhavayami paradevatam
    || || kalikatimirakuntalantaghanabhringamangalavirajinim culikashikharamalikavalayamallikasurabhisaurabham
    | valikamadhuragandamandalamanoharananasaroruham kalikamakhilanayikam manasi bhavayami paradevatam
    || || nityameva niyamena jalpatam bhuktimuktiphaladamabhishtadam | shankarena racitam sada japennamaratnanavaratnamalikam
    ||
  devanagari: हारनूपुरकिरीटकुण्डलविभूषितावयवशोभिनीं कारणेशवरमौलिकोटिपरिकल्प्यमानपदपीठिकाम् । कालकालफणिपाशबाणधनुरङ्कुशामरुणमेखलां
    फालभूतिलकलोचनां मनसि भावयामि परदेवताम् ॥ ॥ गन्धसारघनसारचारुनवनागवल्लिरसवासिनीं सान्ध्यरागमधुराधराभरणसुन्दराननशुचिस्मिताम्
    । मन्धरायतविलोचनाममलबालचन्द्रकृतशेखरीं इन्दिरारमणसोदरीं मनसि भावयामि परदेवताम् ॥ ॥ स्मेरचारुमुखमण्डलां
    विमलगण्डलम्बिमणिमण्डलां हारदामपरिशोभमानकुचभारभीरुतनुमध्यमाम् । वीरगर्वहरनूपुरां विविधकारणेशवरपीठिकां
    मारवैरिसहचारिणीं मनसि भावयामि परदेवताम् ॥ ॥ भूरिभारधरकुण्डलीन्द्रमणिबद्धभूवलयपीठिकां वारिराशिमणिमेखलावलयवह्निमण्डलशरीरिणीम्
    । वारिसारवहकुण्डलां गगनशेखरीं च परमात्मिकां चारुचन्द्रविलोचनां मनसि भावयामि परदेवताम् ॥ ॥ कुण्डलत्रिविधकोणमण्डलविहारषड्दलसमुल्लस
    त्पुण्डरीकमुखभेदिनीं च प्रचण्डभानुभासमुज्ज्वलाम् । मण्डलेन्दुपरिवाहितामृततरङ्गिणीमरुणरूपिणीं मण्डलान्तमणिदीपिकां
    मनसि भावयामि परदेवताम् ॥ ॥ वारणाननमयूरवाहमुखदाहवारणपयोधरां चारणादिसुरसुन्दरीचिकुरशेकरीकृतपदाम्बुजाम्
    । कारणाधिपतिपञ्चकप्रकृतिकारणप्रथममातृकां वारणान्तमुखपारणां मनसि भावयामि परदेवताम् ॥ ॥ पद्मकान्तिपदपाणिपल्लवपयोधराननसरोरुहां
    पद्मरागमणिमेखलावलयनीविशोभितनितम्बिनीम् । पद्मसम्भवसदाशिवान्तमयपञ्चरत्नपदपीठिकां पद्मिनीं प्रणवरूपिणीं
    मनसि भावयामि परदेवताम् ॥ ॥ आगमप्रणवपीठिकाममलवर्णमङ्गलशरीरिणीं आगमावयवशोभिनीमखिलवेदसारकृतशेखरीम् ।
    मूलमन्त्रमुखमण्डलां मुदितनादबिन्दुनवयौवनां मातृकां त्रिपुरसुन्दरीं मनसि भावयामि परदेवताम् ॥ ॥ कालिकातिमिरकुन्तलान्तघनभृङ्गमङ्गलविराजिनीं
    चूलिकाशिखरमालिकावलयमल्लिकासुरभिसौरभाम् । वालिकामधुरगण्डमण्डलमनोहराननसरोरुहां कालिकामखिलनायिकां मनसि
    भावयामि परदेवताम् ॥ ॥ नित्यमेव नियमेन जल्पतां भुक्तिमुक्तिफलदामभीष्टदाम् । शङ्करेण रचितां सदा जपेन्नामरत्ननवरत्नमालिकाम्
    ॥
