id: agastikritamskandastotram
category: stotram
name:
  english: agastikritamskandastotram
  devanagari: अगस्तिकृतंस्कन्दस्तोत्रम्
content:
  english: agastikritam skandastotram agastiruvaca | namo'stu vrindarakavrindavandya padaravindaya sudhakaraya
    | shadananayamitavikramaya gaurihridanandasamudbhavaya || 1|| namo'stu tubhyam pranatartihantre kartre
    samastasya manorathanam | datre rathanam paratarakasya hantre pracandasuratarakasya || 2|| amurtamurtaya
    sahasramurtaye gunaya gunyaya paratparaya | aparaparaya paraparaya namo'stu tubhyam shikhivahanaya
    || 3|| namo'stu te brahmavidamvaraya digambarayambarasamsthitaya | hiranyavarnaya hiranyabahave namo
    hiranyaya hiranyaretase || 4|| tapahsvarupaya tapodhanaya tapahphalanam pratipadakaya | sada kumaraya
    himaramarine trinikritaishvaryaviragine namah || 5|| namo'stu tubhyam sharajanmane vibho prabhatasuryarunadantapanktaye
    | balaya cabalaparakramaya shanmaturayalamanaturaya || 6|| midhushtamayottaramidhushe namo namo gananam
    pataye ganaya | namo'stu te janmajaratigaya namo vishakhaya sushaktipanaye || 7|| sarvasya nathasya
    kumarakaya krauncaraye tarakamarakaya | svaheya gangeya ca kartikeya shaiveya tubhyam satatam namo'stu
    || 8|| ittham parishtutya sa kartikeyam namo namastvityabhibhashamanah | dvistrihparikramya puro vivesha
    sthito munishopavisheti coktah || 9|| iti shriskadapurane kashikhande purvarddhe pancavimshadhyayantargatam
    agastikritam skandastotram samaptam | skandapurana | kashikhanda | purvakhanda 1 | adhyaya 25
  devanagari: अगस्तिकृतं स्कन्दस्तोत्रम् अगस्तिरुवाच । नमोऽस्तु वृन्दारकवृन्दवन्द्य पादारविन्दाय सुधाकराय
    । षडाननायामितविक्रमाय गौरीहृदानन्दसमुद्भवाय ॥ १॥ नमोऽस्तु तुभ्यं प्रणतार्तिहन्त्रे कर्त्रे समस्तस्य
    मनोरथानाम् । दात्रे रथानां परतारकस्य हन्त्रे प्रचण्डासुरतारकस्य ॥ २॥ अमूर्तमूर्ताय सहस्रमूर्तये गुणाय
    गुण्याय परात्पराय । अपारपाराय परापराय नमोऽस्तु तुभ्यं शिखिवाहनाय ॥ ३॥ नमोऽस्तु ते ब्रह्मविदांवराय
    दिगम्बरायाम्बरसंस्थिताय । हिरण्यवर्णाय हिरण्यबाहवे नमो हिरण्याय हिरण्यरेतसे ॥ ४॥ तपःस्वरूपाय तपोधनाय
    तपःफलानां प्रतिपादकाय । सदा कुमाराय हिमारमारिणे तृणीकृतैश्वर्यविरागिणे नमः ॥ ५॥ नमोऽस्तु तुभ्यं शरजन्मने
    विभो प्रभातसूर्यारुणदन्तपङ्क्तये । बालाय चाबालपराक्रमाय षाण्मातुरायालमनातुराय ॥ ६॥ मीढुष्टमायोत्तरमीढुषे
    नमो नमो गणानां पतये गणाय । नमोऽस्तु ते जन्मजरातिगाय नमो विशाखाय सुशक्तिपाणये ॥ ७॥ सर्वस्य नाथस्य कुमारकाय
    क्रौञ्चारये तारकमारकाय । स्वाहेय गाङ्गेय च कार्तिकेय शैवेय तुभ्यं सततं नमोऽस्तु ॥ ८॥ इत्थं परिष्टुत्य
    स कार्तिकेयं नमो नमस्त्वित्यभिभाषमाणः । द्विस्त्रिःपरिक्रम्य पुरो विवेश स्थितो मुनीशोपविशेति चोक्तः
    ॥ ९॥ इति श्रीस्कादपुराणे काशीखण्डे पूर्वार्द्धे पञ्चविंशाध्यायान्तर्गतं अगस्तिकृतं स्कन्दस्तोत्रं
    समाप्तम् । स्कन्दपुराण । काशीखण्ड । पूर्वखण्ड १ । अध्याय २५
