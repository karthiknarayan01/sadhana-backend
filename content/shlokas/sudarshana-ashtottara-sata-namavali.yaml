    । ॐ क्रियास्पदाय नमः । ॐ शुद्धाय नमः । ॐ आधाराय नमः । ॐ चक्र-रूपकाय नमः । ८५। ॐ निरायुधाय नमः । ॐ
    असंरम्भाय नमः । ॐ सर्वायुध-समन्विताय नमः । ॐ ओंकार-रूपिणे नमः । ॐ पूर्णात्मने नमः । ९०। ॐ आंकारस्साध्य-बन्धनाय
    नमः । ॐ ऐंकाराय नमः । ॐ वाक्प्रदाय नमः । ॐ वाग्मिने नमः । ॐ श्रींकारैश्वर्य-वर्धनाय नमः । ९५। ॐ क्लींकार-मोहनाकाराय
    नमः । ॐ हुंफट्क्षोभणाकृतये नमः । ॐ इन्द्रार्चित-मनोवेगाय नमः । ॐ धरणीभार-नाशकाय नमः । ॐ वीराराध्याय
    नमः । १००। ॐ विश्वरूपाय नमः । ॐ वैष्णवाय नमः । ॐ विष्णु-रूपकाय नमः । ॐ सत्यव्रताय नमः । ॐ सत्यपराय
    नमः । १०५। ॐ सत्यधर्मानुषङ्गकाय नमः । ॐ नारायणकृपाव्यूहतेजश्चक्राय नमः । ॐ सुदर्शनाय नमः । १०८। श्रीविजयलक्ष्मी-समेत
