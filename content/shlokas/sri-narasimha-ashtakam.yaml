id: sri-narasimha-ashtakam
category: stotram
name:
  english: Sri Narasimha Ashtakam
content:
  english: shrimadakalanka paripurna shashikoti shridhara manohara satapatala kanta| palaya kripalaya
    bhavambudhi nimagnam daityavarakala narasimha narasimha || jananam patakadavanala patatrivara keto|
    bhavana parayana bhavartiharaya mam pahi kripayaiva narasimha narasimha || kamalalaya namaste pankajanishanna
    narasimha narasimha || || maulishu vibhushanamivamara varanam yogihridayeshu ca shirassunigamanam
    | rajadaravinda ruciram padayugam te dehi mama murdhni narasimha narasimha || || varijavilocana madantima
    karanayam | ehi ramaya saha sharanya vihaganam nathamadhiruhya narasimha narasimha || manindraih |
    bhushitamashesha nilayam tava vapurme cetasi cakastu narasimha narasimha || || indu ravi pavaka vilocana
    ramayah mandira mahabhuja rathanga| sundara ciraya ramatam tvayi mano me nandita suresha narasimha
    narasimha || || madhava mukunda madhusudana murare vamana nrisimha sharanam bhava natanam | kamada
    ghrinin nikhilakarana nayeyam kalamamaresha narasimha narasimha || ripughnam | yah pathati santatamashesha
    nilayam te gacchati padam sa narasimha narasimha ||
  devanagari: श्रीमदकलङ्क परिपूर्ण शशिकोटि श्रीधर मनोहर सटापटल कान्त। पालय कृपालय भवाम्बुधि निमग्नं दैत्यवरकाल
    नरसिंह नरसिंह ॥ जनानां पातकदवानल पतत्रिवर केतो। भावन परायण भवार्तिहरया मां पाहि कृपयैव नरसिंह नरसिंह
    ॥ कमलालय नमस्ते पङ्कजनिषण्ण नरसिंह नरसिंह ॥ ॥ मौलिषु विभूषणमिवामर वराणां योगिहृदयेषु च शिरस्सुनिगमानाम्
    । राजदरविन्द रुचिरं पदयुगं ते देहि मम मूर्ध्नि नरसिंह नरसिंह ॥ ॥ वारिजविलोचन मदन्तिम करणायाम् । एहि
    रमया सह शरण्य विहगानां नाथमधिरुह्य नरसिंह नरसिंह ॥ मणीन्द्रैः । भूषितमशेष निलयं तव वपुर्मे चेतसि चकास्तु
    नरसिंह नरसिंह ॥ ॥ इन्दु रवि पावक विलोचन रमायाः मन्दिर महाभुज रथाङ्ग। सुन्दर चिराय रमतां त्वयि मनो
    मे नन्दित सुरेश नरसिंह नरसिंह ॥ ॥ माधव मुकुन्द मधुसूदन मुरारे वामन नृसिंह शरणं भव नतानाम् । कामद घृणिन्
    निखिलकारण नयेयं कालममरेश नरसिंह नरसिंह ॥ रिपुघ्नम् । यः पठति सन्ततमशेष निलयं ते गच्छति पदं स नरसिंह
    नरसिंह ॥
