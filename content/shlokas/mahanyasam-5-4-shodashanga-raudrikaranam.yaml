id: mahanyasam-5-4-shodashanga-raudrikaranam
category: stotram
name:
  english: Mahanyasam - 5.4. Shodashanga Raudrikaranam
content:
  english: mbhurbhuvassuvah | om am | namah shambhave ca mayobhave ca namah shankaraya ca mayaskaraya
    ca namah shivaya ca shivataraya ca || vibhurasi pravahano raudrenanikena pahi ma 'gne piprihi ma ma
    ma higmsih || namah shambhave ca mayobhave ca namah shankaraya ca mayaskaraya ca namah shivaya ca
    shivataraya ca || o nnamo bhagavate rudraya | am om | shikhasthane rudraya namah || mbhurbhuvassuvah
    | om am | namah shambhave ca mayobhave ca namah shankaraya ca mayaskaraya ca namah shivaya ca shivataraya
    ca || vahnirasi havyavahano raudrenanikena pahi ma 'gne piprihi ma ma ma higmsih || namah shambhave
    ca mayobhave ca namah shankaraya ca mayaskaraya ca namah shivaya ca shivataraya ca || o nnamo bhagavate
    rudraya | am om | shirasthane rudraya namah || mbhurbhuvassuvah | om im | namah shambhave ca mayobhave
    ca namah shankaraya ca mayaskaraya ca namah shivaya ca shivataraya ca || shvatrosi praceta raudrenanikena
    pahi ma 'gne piprihi ma ma ma higmsih || namah shambhave ca mayobhave ca namah shankaraya ca mayaskaraya
    ca namah shivaya ca shivataraya ca || o nnamo bhagavate rudraya | im om | murdhnisthane rudraya namah
    || mbhurbhuvassuvah | om im | namah shambhave ca mayobhave ca namah shankaraya ca mayaskaraya ca namah
    shivaya ca shivataraya ca || tuthosi vishvaveda raudrenanikena pahi ma 'gne piprihi ma ma ma higmsih
    || namah shambhave ca mayobhave ca namah shankaraya ca mayaskaraya ca namah shivaya ca shivataraya
    ca || o nnamo bhagavate rudraya | im om | lalatasthane rudraya namah || mbhurbhuvassuvah | om um |
    namah shambhave ca mayobhave ca namah shankaraya ca mayaskaraya ca namah shivaya ca shivataraya ca
    || ushigasikavi raudrenanikena pahi ma 'gne piprihi ma ma ma higmsih || namah shambhave ca mayobhave
    ca namah shankaraya ca mayaskaraya ca namah shivaya ca shivataraya ca || o nnamo bhagavate rudraya
    | um om | netrayosthane rudraya namah || mbhurbhuvassuvah | om um | namah shambhave ca mayobhave ca
    namah shankaraya ca mayaskaraya ca namah shivaya ca shivataraya ca || angharirasi bambhari raudrenanikena
    pahi ma 'gne piprihi ma ma ma higmsih || namah shambhave ca mayobhave ca namah shankaraya ca mayaskaraya
    ca namah shivaya ca shivataraya ca || o nnamo bhagavate rudraya | um om | karnayosthane rudraya namah
    || mbhurbhuvassuvah | om rim | namah shambhave ca mayobhave ca namah shankaraya ca mayaskaraya ca
    namah shivaya ca shivataraya ca || avasyurasi duvasva nraudrenanikena pahi ma 'gne piprihi ma ma ma
    higmsih || namah shambhave ca mayobhave ca namah shankaraya ca mayaskaraya ca namah shivaya ca shivataraya
    ca || o nnamo bhagavate rudraya | rim om | mukhasthane rudraya namah || mbhurbhuvassuvah | om rim
    | namah shambhave ca mayobhave ca namah shankaraya ca mayaskaraya ca namah shivaya ca shivataraya
    ca || shundhyurasi marjaliyo raudrenanikena pahi ma 'gne piprihi ma ma ma higmsih || namah shambhave
    ca mayobhave ca namah shankaraya ca mayaskaraya ca namah shivaya ca shivataraya ca || o nnamo bhagavate
    rudraya | rim om | kanthasthane rudraya namah || mbhurbhuvassuvah | om lim | namah shambhave ca mayobhave
    ca namah shankaraya ca mayaskaraya ca namah shivaya ca shivataraya ca || samradasi krishanu raudrenanikena
    pahi ma 'gne piprihi ma ma ma higmsih || namah shambhave ca mayobhave ca namah shankaraya ca mayaskaraya
    ca namah shivaya ca shivataraya ca || o nnamo bhagavate rudraya | lim om | bahvosthane rudraya namah
    || mbhurbhuvassuvah | om lim | namah shambhave ca mayobhave ca namah shankaraya ca mayaskaraya ca
    namah shivaya ca shivataraya ca || parishadyosi pavamano raudrenanikena pahi ma 'gne piprihi ma ma
    ma higmsih || namah shambhave ca mayobhave ca namah shankaraya ca mayaskaraya ca namah shivaya ca
    shivataraya ca || o nnamo bhagavate rudraya | lim om | hridisthane rudraya namah || mbhurbhuvassuvah
    | om em | namah shambhave ca mayobhave ca namah shankaraya ca mayaskaraya ca namah shivaya ca shivataraya
    ca || pratakva nraudrenanikena pahi ma 'gne piprihi ma ma ma higmsih || namah shambhave ca mayobhave
    ca namah shankaraya ca mayaskaraya ca namah shivaya ca shivataraya ca || o nnamo bhagavate rudraya
    | em om | nabhisthane rudraya namah || mbhurbhuvassuvah | om aim | namah shambhave ca mayobhave ca
    namah shankaraya ca mayaskaraya ca namah shivaya ca shivataraya ca || asammrishtosi havyasudo raudrenanikena
    pahi ma 'gne piprihi ma ma ma higmsih || namah shambhave ca mayobhave ca namah shankaraya ca mayaskaraya
    ca namah shivaya ca shivataraya ca || o nnamo bhagavate rudraya | aim om | katisthane rudraya namah
    || mbhurbhuvassuvah | om om | namah shambhave ca mayobhave ca namah shankaraya ca mayaskaraya ca namah
    shivaya ca shivataraya ca || ritadhama 'si suvarjyoti raudrenanikena pahi ma 'gne piprihi ma ma ma
    higmsih || namah shambhave ca mayobhave ca namah shankaraya ca mayaskaraya ca namah shivaya ca shivataraya
    ca || o nnamo bhagavate rudraya | om om | urusthane rudraya namah || mbhurbhuvassuvah | om aum | namah
    shambhave ca mayobhave ca namah shankaraya ca mayaskaraya ca namah shivaya ca shivataraya ca || brahmajyotirasi
    suvardhama raudrenanikena pahi ma 'gne piprihi ma ma ma higmsih || namah shambhave ca mayobhave ca
    namah shankaraya ca mayaskaraya ca namah shivaya ca shivataraya ca || o nnamo bhagavate rudraya |
    aum om | janusthane rudraya namah || mbhurbhuvassuvah | om am | namah shambhave ca mayobhave ca namah
    shankaraya ca mayaskaraya ca namah shivaya ca shivataraya ca || ajo 'syekapat raudrenanikena pahi
    ma 'gne piprihi ma ma ma higmsih || namah shambhave ca mayobhave ca namah shankaraya ca mayaskaraya
    ca namah shivaya ca shivataraya ca || o nnamo bhagavate rudraya | am om | janghasthane rudraya namah
    || mbhurbhuvassuvah | om ah | namah shambhave ca mayobhave ca namah shankaraya ca mayaskaraya ca namah
    shivaya ca shivataraya ca || ahirasi budhniyo raudrenanikena pahi ma 'gne piprihi ma ma ma higmsih
    || namah shambhave ca mayobhave ca namah shankaraya ca mayaskaraya ca namah shivaya ca shivataraya
    ca || o nnamo bhagavate rudraya | ah om | padayo ssthane rudraya namah || ssarvapapaih pramucyate
    | sarvabhuteshvaparajito bhavati | tato bhutapreta pishaca baddha brahmarakshasa yaksha yamaduta shakini
    dakini hakini shatru sarpa shvapada taskara jvaradyupadravajopaghata
  devanagari: म्भूर्भुव॒स्सुवः॑ । ॐ अम् । नमः॑ श॒म्भवे॑ च मयो॒भवे॑ च॒ नमः॑ शङ्क॒राय॑ च मयस्क॒राय॑ च॒ नमः॑
    शि॒वाय॑ च शि॒वत॑राय च॒ ॥ वि॒भूर॑सि प्र॒वाह॑णो॒ रौद्रे॒णानी॑केन पा॒हि मा ऽग्ने पिपृ॒हि मा॒ मा मा॑ हिग्ंसीः
    ॥ नमः॑ श॒म्भवे॑ च मयो॒भवे॑ च॒ नमः॑ शङ्क॒राय॑ च मयस्क॒राय॑ च॒ नमः॑ शि॒वाय॑ च शि॒वत॑राय च॒ ॥ ओ न्नमो
    भगवते॑ रुद्रा॒य । अं ओम् । शिखास्थाने रुद्राय नमः ॥ म्भूर्भुव॒स्सुवः॑ । ॐ आम् । नमः॑ श॒म्भवे॑ च मयो॒भवे॑
    च॒ नमः॑ शङ्क॒राय॑ च मयस्क॒राय॑ च॒ नमः॑ शि॒वाय॑ च शि॒वत॑राय च॒ ॥ वह्नि॑रसि हव्य॒वाह॑नो॒ रौद्रे॒णानी॑केन
    पा॒हि मा ऽग्ने पिपृ॒हि मा॒ मा मा॑ हिग्ंसीः ॥ नमः॑ श॒म्भवे॑ च मयो॒भवे॑ च॒ नमः॑ शङ्क॒राय॑ च मयस्क॒राय॑
    च॒ नमः॑ शि॒वाय॑ च शि॒वत॑राय च॒ ॥ ओ न्नमो भगवते॑ रुद्रा॒य । आं ओम् । शिरस्थाने रुद्राय नमः ॥ म्भूर्भुव॒स्सुवः॑
    । ॐ इम् । नमः॑ श॒म्भवे॑ च मयो॒भवे॑ च॒ नमः॑ शङ्क॒राय॑ च मयस्क॒राय॑ च॒ नमः॑ शि॒वाय॑ च शि॒वत॑राय च॒ ॥
    श्वा॒त्रो॑सि॒ प्रचे॑ता॒ रौद्रे॒णानी॑केन पा॒हि मा ऽग्ने पिपृ॒हि मा॒ मा मा॑ हिग्ंसीः ॥ नमः॑ श॒म्भवे॑
    च मयो॒भवे॑ च॒ नमः॑ शङ्क॒राय॑ च मयस्क॒राय॑ च॒ नमः॑ शि॒वाय॑ च शि॒वत॑राय च॒ ॥ ओ न्नमो भगवते॑ रुद्रा॒य
    । इं ओम् । मूर्ध्निस्थाने रुद्राय नमः ॥ म्भूर्भुव॒स्सुवः॑ । ॐ ईम् । नमः॑ श॒म्भवे॑ च मयो॒भवे॑ च॒ नमः॑
    शङ्क॒राय॑ च मयस्क॒राय॑ च॒ नमः॑ शि॒वाय॑ च शि॒वत॑राय च॒ ॥ तु॒थो॑सि वि॒श्ववे॑दा॒ रौद्रे॒णानी॑केन पा॒हि
    मा ऽग्ने पिपृ॒हि मा॒ मा मा॑ हिग्ंसीः ॥ नमः॑ श॒म्भवे॑ च मयो॒भवे॑ च॒ नमः॑ शङ्क॒राय॑ च मयस्क॒राय॑ च॒
    नमः॑ शि॒वाय॑ च शि॒वत॑राय च॒ ॥ ओ न्नमो भगवते॑ रुद्रा॒य । ईं ओम् । ललाटस्थाने रुद्राय नमः ॥ म्भूर्भुव॒स्सुवः॑
    । ॐ उम् । नमः॑ श॒म्भवे॑ च मयो॒भवे॑ च॒ नमः॑ शङ्क॒राय॑ च मयस्क॒राय॑ च॒ नमः॑ शि॒वाय॑ च शि॒वत॑राय च॒ ॥
    उ॒शिग॑सिक॒वी रौद्रे॒णानी॑केन पा॒हि मा ऽग्ने पिपृ॒हि मा॒ मा मा॑ हिग्ंसीः ॥ नमः॑ श॒म्भवे॑ च मयो॒भवे॑
    च॒ नमः॑ शङ्क॒राय॑ च मयस्क॒राय॑ च॒ नमः॑ शि॒वाय॑ च शि॒वत॑राय च॒ ॥ ओ न्नमो भगवते॑ रुद्रा॒य । उं ओम् ।
    नेत्रयोस्थाने रुद्राय नमः ॥ म्भूर्भुव॒स्सुवः॑ । ॐ ऊम् । नमः॑ श॒म्भवे॑ च मयो॒भवे॑ च॒ नमः॑ शङ्क॒राय॑
    च मयस्क॒राय॑ च॒ नमः॑ शि॒वाय॑ च शि॒वत॑राय च॒ ॥ अङ्घा॑रिरसि॒ बम्भा॑री॒ रौद्रे॒णानी॑केन पा॒हि मा ऽग्ने
    पिपृ॒हि मा॒ मा मा॑ हिग्ंसीः ॥ नमः॑ श॒म्भवे॑ च मयो॒भवे॑ च॒ नमः॑ शङ्क॒राय॑ च मयस्क॒राय॑ च॒ नमः॑ शि॒वाय॑
    च शि॒वत॑राय च॒ ॥ ओ न्नमो भगवते॑ रुद्रा॒य । ऊं ओम् । कर्णयोस्थाने रुद्राय नमः ॥ म्भूर्भुव॒स्सुवः॑ ।
    ॐ ऋम् । नमः॑ श॒म्भवे॑ च मयो॒भवे॑ च॒ नमः॑ शङ्क॒राय॑ च मयस्क॒राय॑ च॒ नमः॑ शि॒वाय॑ च शि॒वत॑राय च॒ ॥ अ॒व॒स्युर॑सि॒
    दुव॑स्वा॒ न्रौद्रे॒णानी॑केन पा॒हि मा ऽग्ने पिपृ॒हि मा॒ मा मा॑ हिग्ंसीः ॥ नमः॑ श॒म्भवे॑ च मयो॒भवे॑
    च॒ नमः॑ शङ्क॒राय॑ च मयस्क॒राय॑ च॒ नमः॑ शि॒वाय॑ च शि॒वत॑राय च॒ ॥ ओ न्नमो भगवते॑ रुद्रा॒य । ऋं ओम् ।
    मुखस्थाने रुद्राय नमः ॥ म्भूर्भुव॒स्सुवः॑ । ॐ ॠम् । नमः॑ श॒म्भवे॑ च मयो॒भवे॑ च॒ नमः॑ शङ्क॒राय॑ च मयस्क॒राय॑
    च॒ नमः॑ शि॒वाय॑ च शि॒वत॑राय च॒ ॥ शु॒न्ध्यूर॑सि मार्जा॒लीयो॒ रौद्रे॒णानी॑केन पा॒हि मा ऽग्ने पिपृ॒हि
    मा॒ मा मा॑ हिग्ंसीः ॥ नमः॑ श॒म्भवे॑ च मयो॒भवे॑ च॒ नमः॑ शङ्क॒राय॑ च मयस्क॒राय॑ च॒ नमः॑ शि॒वाय॑ च शि॒वत॑राय
    च॒ ॥ ओ न्नमो भगवते॑ रुद्रा॒य । ॠं ओम् । कण्ठस्थाने रुद्राय नमः ॥ म्भूर्भुव॒स्सुवः॑ । ॐ ऌम् । नमः॑
    श॒म्भवे॑ च मयो॒भवे॑ च॒ नमः॑ शङ्क॒राय॑ च मयस्क॒राय॑ च॒ नमः॑ शि॒वाय॑ च शि॒वत॑राय च॒ ॥ स॒म्राड॑सि कृ॒शानू॒
    रौद्रे॒णानी॑केन पा॒हि मा ऽग्ने पिपृ॒हि मा॒ मा मा॑ हिग्ंसीः ॥ नमः॑ श॒म्भवे॑ च मयो॒भवे॑ च॒ नमः॑ शङ्क॒राय॑
    च मयस्क॒राय॑ च॒ नमः॑ शि॒वाय॑ च शि॒वत॑राय च॒ ॥ ओ न्नमो भगवते॑ रुद्रा॒य । ऌं ओम् । बाह्वोस्थाने रुद्राय
    नमः ॥ म्भूर्भुव॒स्सुवः॑ । ॐ ॡम् । नमः॑ श॒म्भवे॑ च मयो॒भवे॑ च॒ नमः॑ शङ्क॒राय॑ च मयस्क॒राय॑ च॒ नमः॑
    शि॒वाय॑ च शि॒वत॑राय च॒ ॥ प॒रि॒षद्यो॑सि॒ पव॑मानो॒ रौद्रे॒णानी॑केन पा॒हि मा ऽग्ने पिपृ॒हि मा॒ मा मा॑
    हिग्ंसीः ॥ नमः॑ श॒म्भवे॑ च मयो॒भवे॑ च॒ नमः॑ शङ्क॒राय॑ च मयस्क॒राय॑ च॒ नमः॑ शि॒वाय॑ च शि॒वत॑राय च॒
    ॥ ओ न्नमो भगवते॑ रुद्रा॒य । ॡं ओम् । हृदिस्थाने रुद्राय नमः ॥ म्भूर्भुव॒स्सुवः॑ । ॐ एम् । नमः॑ श॒म्भवे॑
    च मयो॒भवे॑ च॒ नमः॑ शङ्क॒राय॑ च मयस्क॒राय॑ च॒ नमः॑ शि॒वाय॑ च शि॒वत॑राय च॒ ॥ प्र॒तक्वा॑ न्रौद्रे॒णानी॑केन
    पा॒हि मा ऽग्ने पिपृ॒हि मा॒ मा मा॑ हिग्ंसीः ॥ नमः॑ श॒म्भवे॑ च मयो॒भवे॑ च॒ नमः॑ शङ्क॒राय॑ च मयस्क॒राय॑
    च॒ नमः॑ शि॒वाय॑ च शि॒वत॑राय च॒ ॥ ओ न्नमो भगवते॑ रुद्रा॒य । एं ओम् । नाभिस्थाने रुद्राय नमः ॥ म्भूर्भुव॒स्सुवः॑
    । ॐ ऐम् । नमः॑ श॒म्भवे॑ च मयो॒भवे॑ च॒ नमः॑ शङ्क॒राय॑ च मयस्क॒राय॑ च॒ नमः॑ शि॒वाय॑ च शि॒वत॑राय च॒ ॥
    अस॑म्मृष्टोसि हव्य॒सूदो॒ रौद्रे॒णानी॑केन पा॒हि मा ऽग्ने पिपृ॒हि मा॒ मा मा॑ हिग्ंसीः ॥ नमः॑ श॒म्भवे॑
    च मयो॒भवे॑ च॒ नमः॑ शङ्क॒राय॑ च मयस्क॒राय॑ च॒ नमः॑ शि॒वाय॑ च शि॒वत॑राय च॒ ॥ ओ न्नमो भगवते॑ रुद्रा॒य
    । ऐं ओम् । कटिस्थाने रुद्राय नमः ॥ म्भूर्भुव॒स्सुवः॑ । ॐ ओम् । नमः॑ श॒म्भवे॑ च मयो॒भवे॑ च॒ नमः॑ शङ्क॒राय॑
    च मयस्क॒राय॑ च॒ नमः॑ शि॒वाय॑ च शि॒वत॑राय च॒ ॥ ऋ॒तधा॑मा ऽसि॒ सुव॑र्ज्योती॒ रौद्रे॒णानी॑केन पा॒हि मा
