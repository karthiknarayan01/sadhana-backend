id: taittiriya-upanishad-ananda-valli
category: stotram
name:
  english: Taittiriya Upanishad - Ananda Valli
content:
  english: om saha navavatu | saha nau bhunaktu | saha virya nkaravavahai | tejasvinavadhitamastu ma vidvishavahai
    shshantih || brahmavida mbrahma | yo veda nihita mparame vyomann | so 'shnute sarvankama thsaha |
    brahmana vipashciteti || tasmadva etasmadatmana akashassambhutah | akashadvayuh | vayoragnih | agnerapah
    | adbhyah prithivi | prithivya oshadhayah | oshadhibhyo | annatpurushah | sa va esha purusho 'nnarasamayah
    | tasyedameva shirah | aya ndakshinah pakshah | ayamuttarah pakshah | ayamatma mpratishtha | tadapyesha
    shloko bhavati || 'nuvakah || annadvai prajah prajayante | yah kashca prithivig shritah | atho annenaiva
    jivanti | athainadapi yantyantatah | annagm hi bhutana thsarvaushadhamucyate | sarvam 'nnamapnuvanti
    | ye mbrahmopasate | annagm hi bhutana thsarvaushadhamucyate | anna dbhutani jayante | jatanyannena
    vardhante | adyate 'tti ca bhutani | tasmadanna ntaducyata iti | tasmadva etasmadannarasamayat | anyo
    pranamayah | tenaisha purnah | sa va esha purushavidha eva | tasya purushavidhatam | anvaya mpurushavidhah
    | tasya prana eva shirah | vyano dakshinah pakshah | apana uttarah pakshah | akasha atma | prithivi
    puccha mpratishtha | tadapyesha shloko bhavati || ndeva anuprananti | manushyah pashavashca ye | prano
    hi bhutanamayuh | tasma thsarvayushamucyate | sarvameva ta ayuryanti | ye prana mbrahmopasate | prano
    hi bhutanamayuh | tasmathsarvayushamucyata iti | tasyaisha eva sharira atma | yah purvasya | tasmadva
    etasma tpranamayat | anyo 'ntara atma manomayah | tenaisha purnah | sa va esha purushavidha eva |
    tasya purushavidhatam | anvaya mpurushavidhah | tasya yajureva shirah | rigdakshinah pakshah | samottarah
    pakshah | adesha atma | atharvangirasah puccha mpratishtha | tadapyesha shloko bhavati || 'nuvakah
    || yato vaco nivartante | apra pya manasa saha | ananda mbrahmano vidvan | na bibheti kadacaneti |
    tasyaisha eva sharira atma | yah purvasya | tasmadva etasma 'ntara atma vijnanamayah | tenaisha purnah
    | sa va esha purushavidha eva | tasya purushavidhatam | anvaya mpurushavidhah | tasya shraddhaiva
    shirah | rita ndakshinah pakshah | satyamuttarah pakshah | yoga atma | mahah puccha mpratishtha |
    tadapyesha shloko bhavati || 'nuvakah || vijnanam ntanute | karmani tanute | brahma jyeshthamupasate
    | vijnana mbrahma cedveda | tasmaccenna pramadyati | sharire papmano hitva | sarvankaman thsamashnuta
    iti | tasyaisha eva sharira atma | yah purvasya | tasmadva etasmadvijnanamayat | anyo ''nandamayah
    | tenaisha purnah | sa va esha purushavidha eva | tasya purushavidhatam | anvaya mpurushavidhah |
    tasya priyameva shirah | modo dakshinah pakshah | pramoda uttarah pakshah | ananda atma | brahma puccha
    mpratishtha | tadapyesha shloko bhavati || 'nuvakah || asanneva sa bhavati | asadbrahmeti veda cet
    | asti brahmeti cedveda | santamena ntato viduriti | tasyaisha eva sharira atma | yah purvasya | athato
    'nuprashnah | utavidvanamum mpretya | kashcana gacchati mpretya | kashcithsamashnuta mprajayeyeti
    | sa tapo 'tapyata | sa tapastaptva | idagm sarvamasrijata | yadida nkinca | tathsrishtva | tadevanupravishat
    | tadanu pravishya | sacca tyaccabhavat | nirukta nca satyamabhavat | yadida nkinca | tatsatyamityacakshate
    | tadapyesha shloko bhavati || 'nuvakah || asadva idamagra asit | tato vai sadajayata | tadatmanagg
    svayamakuruta | tasmattathsukritamucyata iti | yadvai tathsukritam | raso vai sah | rasagg hyevayam
    ''nandi bhavati | ko hyevanya tkah pranyat | yadesha akasha anando na syat | esha hyeva ''nandayati
    | yada hyevaisha etasminnadrishye ngato bhavati | yada hyevaisha etasminnudaramantara nkurute | atha
    tasya bhaya mbhavati | tattveva bhayam 'manvanasya | tadapyesha shloko bhavati || 'smadvatah pavate
    | bhishodeti suryah | bhisha 'smadagnishcendrashca | mrityurdhavati pancama iti | saisha ''nandasya
    mimagmsa bhavati | yuva syathsadhuyuva 'dhyayakah | ashishtho dridhishtho balishthah | tasyeya mprithivi
    sarva vittasya purna syat | sa eko manusha anandah | te ye shata mmanusha anandah || || sa eko manushyagandharvanamanandah
    | shrotriyasya cakamahatasya | te ye shata mmanushyagandharvanamanandah | sa eko devagandharvanamanandah
    | shrotriyasya cakamahatasya | te ye shata ndevagandharvanamanandah | sa ekah pitrina nciralokalokanamanandah
    | shrotriyasya cakamahatasya | te ye shata nciralokalokanamanandah | sa eka ajanajana || shrotriyasya
    cakamahatasya | te ye shatamajanajana ndevanamanandah | sa ekah karmadevana ndevanamanandah | ye karmana
    devanapiyanti | shrotriyasya cakamahatasya | te ye shata ndevanamanandah | sa eko devanamanandah |
    shrotriyasya cakamahatasya | te ye shata ndevanamanandah | sa eka indrasya || shrotriyasya cakamahatasya
    | te ye shatamindrasya ''nandah | sa eko brihaspateranandah | shrotriyasya cakamahatasya | te ye shata
    mbrihaspateranandah | sa ekah prajapateranandah | shrotriyasya cakamahatasya | te ye shata mprajapateranandah
    | sa eko brahmana anandah | shrotriyasya cakamahatasya || mpurushe | yashcasavaditye | sa ekah | sa
    ya evam vi~t | asmallokatpretya | etamannamayamatmanamupasankramati | eta mpranamayamatmanamupasankramati
    | eta mmanomayamatmanamupasankramati | etam vi~jnanamayamatmanamupasankramati | etamanandamayamatmanamupasankramati
    | tadapyesha shloko bhavati || 'nuvakah || yato vaco nivartante | apra pya manasa saha | ananda mbrahmano
    vidvan | na bibheti kutashcaneti | etagm ha vava na tapati | kimahagm sadhu nakaravam | kimaha mpapamakaravamiti
    | sa ya evam vi~dvanete atmanagg sprinute | ubhe hyevaisha ete atmanagg sprinute | ya evam ve~da |
    ityupanishat || 'nuvakah || om saha navavatu | saha nau bhunaktu | saha virya nkaravavahai | tejasvinavadhitamastu
    ma vidvishavahai shshantih || || harih om || || shri krishnarpanamastu ||
  devanagari: ॐ स॒ह ना॑ववतु । स॒ह नौ॑ भुनक्तु । स॒ह वी॒र्य॑ ङ्करवावहै । ते॒ज॒स्विना॒वधी॑तमस्तु॒ मा वि॑द्विषा॒वहै
    श्शान्तिः॑ ॥ ब्र॒ह्म॒विदा म्ब्रह्म॑ । यो वेद॒ निहि॑त॒ म्पर॒मे व्यो॑मन्न् । सो ऽश्नु॒ते सर्वा॒न्कामा
    थ्स॒ह । ब्रह्म॑णा विप॒श्चितेति॑ ॥ तस्मा॒द्वा ए॒तस्मा॑दा॒त्मन॑ आका॒शस्सम्भू॑तः । आ॒का॒शाद्वा॒युः ।
    वा॒योर॒ग्निः । अ॒ग्नेरापः॑ । अ॒द्भ्यः पृ॑थि॒वी । पृ॒थि॒व्या ओष॑धयः । ओष॑धी॒भ्यो । अन्ना॒त्पुरु॑षः
    । स वा एष पुरुषो ऽन्न॑रस॒मयः । तस्येद॑मेव॒ शिरः । अय न्दक्षि॑णः प॒क्षः । अयमुत्त॑रः प॒क्षः । अयमात्मा
    म्प्रति॒ष्ठा । तदप्येष श्लो॑को भ॒वति ॥ ऽनुवाकः ॥ अन्ना॒द्वै प्र॒जाः प्र॒जाय॑न्ते । याः काश्च॑ पृथि॒वीग्
    श्रि॒ताः । अथो॒ अन्ने॑नै॒व जी॑वन्ति । अथै॑न॒दपि॑ यन्त्यन्त॒तः । अन्न॒ग्ं॒ हि भू॒ताना॒ थ्सर्वौष॒धमु॑च्यते
    । सर्वं॒ ऽन्न॑माप्नुवन्ति । ये म्ब्रह्मो॒पास॑ते । अन्न॒ग्ं॒ हि भू॒ताना॒ थ्सर्वौष॒धमु॑च्यते । अन्ना
    द्भू॒तानि॒ जाय॑न्ते । जाता॒न्यन्ने॑न वर्धन्ते । अद्यते ऽत्ति च॑ भूता॒नि । तस्मादन्न न्तदुच्य॑त इ॒ति
    । तस्माद्वा एतस्मादन्न॑रस॒मयात् । अन्यो प्राण॒मयः । तेनै॑ष पू॒र्णः । स वा एष पुरुषवि॑ध ए॒व । तस्य
    पुरु॑षवि॒धताम् । अन्वय॑ म्पुरुष॒विधः । तस्य प्राण॑ एव॒ शिरः । व्यानो दक्षि॑णः प॒क्षः । अपान उत्त॑रः
    प॒क्षः । आका॑श आ॒त्मा । पृथिवी पुच्छ॑ म्प्रति॒ष्ठा । तदप्येष श्लो॑को भ॒वति ॥ न्दे॒वा अनु॒प्राण॑न्ति
    । म॒नु॒ष्याः प॒शव॑श्च॒ ये । प्रा॒णो हि भू॒ताना॒मायुः॑ । तस्मा थ्सर्वायु॒षमु॑च्यते । सर्व॑मे॒व त॒ आयु॑र्यन्ति
    । ये प्रा॒ण म्ब्रह्मो॒पास॑ते । प्राणो हि भूता॑नामा॒युः । तस्माथ्सर्वायुषमुच्य॑त इ॒ति । तस्यैष एव शारी॑र
    आ॒त्मा । यः॑ पूर्व॒स्य । तस्माद्वा एतस्मा त्प्राण॒मयात् । अन्यो ऽन्तर आत्मा॑ मनो॒मयः । तेनै॑ष पू॒र्णः
    । स वा एष पुरुषवि॑ध ए॒व । तस्य पुरु॑षवि॒धताम् । अन्वय॑ म्पुरुष॒विधः । तस्य यजु॑रेव॒ शिरः । ऋग्दक्षि॑णः
    प॒क्षः । सामोत्त॑रः प॒क्षः । आदे॑श आ॒त्मा । अथर्वाङ्गिरसः पुच्छ॑ म्प्रति॒ष्ठा । तदप्येष श्लो॑को भ॒वति
    ॥ ऽनुवाकः ॥ यतो॒ वाचो॒ निव॑र्तन्ते । अप्रा प्य॒ मन॑सा स॒ह । आनन्द म्ब्रह्म॑णो वि॒द्वान् । न बिभेति
    कदा॑चने॒ति । तस्यैष एव शारी॑र आ॒त्मा । यः॑ पूर्व॒स्य । तस्माद्वा एतस्मा ऽन्तर आत्मा वि॑ज्ञान॒मयः ।
    तेनै॑ष पू॒र्णः । स वा एष पुरुषवि॑ध ए॒व । तस्य पुरु॑षवि॒धताम् । अन्वय॑ म्पुरुष॒विधः । तस्य श्र॑द्धैव॒
    शिरः । ऋत न्दक्षि॑णः प॒क्षः । सत्यमुत्त॑रः प॒क्षः । यो॑ग आ॒त्मा । महः पुच्छ॑ म्प्रति॒ष्ठा । तदप्येष
    श्लो॑को भ॒वति ॥ ऽनुवाकः ॥ वि॒ज्ञानं॑ न्त॑नुते । कर्मा॑णि तनु॒ते । ब्रह्म॒ ज्येष्ठ॒मुपा॑सते । वि॒ज्ञान॒
    म्ब्रह्म॒ चेद्वेद॑ । तस्मा॒च्चेन्न प्र॒माद्य॑ति । श॒रीरे॑ पाप्म॑नो हि॒त्वा । सर्वान्कामान् थ्समश्नु॑त
    इ॒ति । तस्यैष एव शारी॑र आ॒त्मा । यः॑ पूर्व॒स्य । तस्माद्वा एतस्माद्वि॑ज्ञान॒मयात् । अन्यो ऽऽनन्द॒मयः
    । तेनै॑ष पू॒र्णः । स वा एष पुरुषवि॑ध ए॒व । तस्य पुरु॑षवि॒धताम् । अन्वय॑ म्पुरुष॒विधः । तस्य प्रिय॑मेव॒
    शिरः । मोदो दक्षि॑णः प॒क्षः । प्रमोद उत्त॑रः प॒क्षः । आन॑न्द आ॒त्मा । ब्रह्म पुच्छ॑ म्प्रति॒ष्ठा ।
    तदप्येष श्लो॑को भ॒वति ॥ ऽनुवाकः ॥ अस॑न्ने॒व स॑ भवति । अस॒द्ब्रह्मेति॒ वेद॒ चेत् । अस्ति ब्रह्मेति॑
    चेद्वे॒द । सन्तमेन न्ततो वि॑दुरि॒ति । तस्यैष एव शारी॑र आ॒त्मा । यः॑ पूर्व॒स्य । अथातो॑ ऽनुप्र॒श्नाः
    । उ॒तावि॒द्वान॒मुं म्प्रेत्य॑ । कश्च॒न ग॑च्छ॒ती म्प्रेत्य॑ । कश्चि॒थ्सम॑श्नु॒ता म्प्रजा॑ये॒येति॑ ।
    स तपो॑ ऽतप्यत । स तप॑स्त॒प्त्वा । इ॒दग्ं सर्व॑मसृजत । यदि॒द ङ्किञ्च॑ । तथ्सृ॒ष्ट्वा । तदे॒वानु॒प्रावि॑शत्
    । तद॑नु प्र॒विश्य॑ । सच्च॒ त्यच्चा॑भवत् । नि॒रुक्त॒ ञ्च स॑त्यम॒भवत् । यदि॑द ङ्कि॒ञ्च । तत्सत्यमि॑त्याच॒क्षते
    । तदप्येष श्लो॑को भ॒वति ॥ ऽनुवाकः ॥ अस॒द्वा इ॒दमग्र॑ आसीत् । ततो॒ वै सद॑जायत । तदात्मानग्ग् स्वय॑मकु॒रुत
    । तस्मात्तथ्सुकृतमुच्य॑त इ॒ति । यद्वै॑ तथ्सु॒कृतम् । र॑सो वै॒ सः । रसग्ग् ह्येवायं ऽऽन॑न्दी भ॒वति
    । को ह्येवान्या त्कः प्रा॒ण्यात् । यदेष आकाश आन॑न्दो न॒ स्यात् । एष ह्येवा ऽऽन॑न्दया॒ति । य॒दा ह्ये॑वैष॒
    एतस्मिन्नदृश्ये ङ्ग॑तो भ॒वति । य॒दा ह्ये॑वैष॒ एतस्मिन्नुदरमन्त॑र ङ्कु॒रुते । अथ तस्य भ॑य म्भ॒वति ।
    तत्त्वेव भयं ऽम॑न्वान॒स्य । तदप्येष श्लो॑को भ॒वति ॥ ऽस्मा॒द्वातः॑ पवते । भी॒षोदे॑ति॒ सूर्यः॑ । भीषा
    ऽस्मादग्नि॑श्चेन्द्र॒श्च । मृत्युर्धावति पञ्च॑म इ॒ति । सैषा ऽऽनन्दस्य मीमाग्ं॑सा भ॒वति । युवा स्याथ्साधुयु॑वा
    ऽध्या॒यकः । आशिष्ठो दृढिष्ठो॑ बलि॒ष्ठः । तस्येय म्पृथिवी सर्वा वित्तस्य॑ पूर्णा॒ स्यात् । स एको मानुष॑
    आन॒न्दः । ते ये शत म्मानुषा॑ आन॒न्दाः ॥ ॥ स एको मनुष्यगन्धर्वाणा॑मान॒न्दः । श्रोत्रियस्य चाकाम॑हत॒स्य
    । ते ये शत म्मनुष्यगन्धर्वाणा॑मान॒न्दाः । स एको देवगन्धर्वाणा॑मान॒न्दः । श्रोत्रियस्य चाकाम॑हत॒स्य
    । ते ये शत न्देवगन्धर्वाणा॑मान॒न्दाः । स एकः पितृणा ञ्चिरलोकलोकाना॑मान॒न्दः । श्रोत्रियस्य चाकाम॑हत॒स्य
    । ते ये शत ञ्चिरलोकलोकाना॑मान॒न्दाः । स एक आजानजाना ॥ श्रोत्रियस्य चाकाम॑हत॒स्य । ते ये शतमाजानजाना
    न्देवाना॑मान॒न्दाः । स एकः कर्मदेवाना न्देवाना॑मान॒न्दः । ये कर्मणा देवान॑पिय॒न्ति । श्रोत्रियस्य
    चाकाम॑हत॒स्य । ते ये शत न्देवाना॑मान॒न्दाः । स एको देवाना॑मान॒न्दः । श्रोत्रियस्य चाकाम॑हत॒स्य । ते
    ये शत न्देवाना॑मान॒न्दाः । स एक इन्द्र॑स्या ॥ श्रोत्रियस्य चाकाम॑हत॒स्य । ते ये शतमिन्द्र॑स्या ऽऽन॒न्दाः
    । स एको बृहस्पते॑रान॒न्दः । श्रोत्रियस्य चाकाम॑हत॒स्य । ते ये शत म्बृहस्पते॑रान॒न्दाः । स एकः प्रजापते॑रान॒न्दः
    । श्रोत्रियस्य चाकाम॑हत॒स्य । ते ये शत म्प्रजापते॑रान॒न्दाः । स एको ब्रह्मण॑ आन॒न्दः । श्रोत्रियस्य
    चाकाम॑हत॒स्य ॥ म्पु॒रुषे । यश्चासा॑वादि॒त्ये । स एकः॑ । स य॑ एवं॒ विँत् । अस्माल्लो॑कात्प्रे॒त्य ।
    एतमन्नमयमात्मानमुप॑सङ्क्रा॒मति । एत म्प्राणमयमात्मानमुप॑सङ्क्रा॒मति । एत म्मनोमयमात्मानमुप॑सङ्क्रा॒मति
    । एतं विँज्ञानमयमात्मानमुप॑सङ्क्रा॒मति । एतमानन्दमयमात्मानमुप॑सङ्क्रा॒मति । तदप्येष श्लो॑को भ॒वति
    ॥ ऽनुवाकः ॥ यतो॒ वाचो॒ निव॑र्तन्ते । अप्रा प्य॒ मन॑सा स॒ह । आनन्द म्ब्रह्म॑णो वि॒द्वान् । न बिभेति
    कुत॑श्चने॒ति । एतग्ं ह वाव॑ न त॒पति । किमहग्ं साधु॑ नाक॒रवम् । किमह म्पापमकर॑वमि॒ति । स य एवं विँद्वानेते
    आत्मा॑नग्ग् स्पृ॒णुते । उ॒भे ह्ये॑वैष॒ एते आत्मा॑नग्ग् स्पृ॒णुते । य ए॒वं वेँद॑ । इत्यु॑प॒निष॑त् ॥
    ऽनुवाकः ॥ ॐ स॒ह ना॑ववतु । स॒ह नौ॑ भुनक्तु । स॒ह वी॒र्य॑ ङ्करवावहै । ते॒ज॒स्विना॒वधी॑तमस्तु॒ मा वि॑द्विषा॒वहै
    श्शान्तिः॑ ॥ ॥ हरिः॑ ओम् ॥ ॥ श्री कृष्णार्पणमस्तु ॥
