id: manjuvajrastotram
category: stotram
name:
  english: manjuvajrastotram
  devanagari: मन्जुवज्रस्तोत्रम्
content:
  english: manjuvajrastotram manjugarbhakritam namah shrimanjuvajraya | shashadharamiva shubhram khadgapustakapanim
    suruciramalishantam pancaciram kumaram | prithutaravaramoksham padmapatrayataksham kumatidahanadaksham
    manjughosham namami || 1|| kritamrigaripuyanam dattabhaktapradanam suradanujanriyanam bodhisattvapradhanam
    | akhilagunanidhanam sarvavidyavitanam karasarasijabanam manjughosham namami || 2|| vibhritasakalakosham
    kshalitajnanadosham smaranabhajanatosham duraragadidosham | vihitasasuraposham siddhidakhyanayosham
    kritajadaparishosham manjughosham namami || 3|| ganapatisharajanmashrimahakalasimhaih parivritamiva
    candrabhabhamindivaraksham | asisharajapamalapustakam samvahantam urasi lalitamalam manjughosham namami
    || 4|| surapatishamanayapyesha mitragnirakshah
  devanagari: मञ्जुवज्रस्तोत्रम् मञ्जुगर्भकृतं नमः श्रीमञ्जुवज्राय । शशधरमिव शुभ्रं खड्गपुस्ताकपाणिं सुरुचिरमलिशान्तं
    पञ्चचीरं कुमारम् । पृथुतरवरमोक्षं पद्मपत्रायताक्षं कुमतिदहनदक्षं मञ्जुघोषं नमामि ॥ १॥ कृतमृगरिपुयानं
    दत्तभक्तप्रदानं सुरदनुजनृयानं बोधिसत्त्वप्रधानम् । अखिलगुणनिधानं सर्वविद्यावितानं करसरसिजबाणं मञ्जुघोषं
    नमामि ॥ २॥ विभृतसकलकोषं क्षालिताज्ञानदोषं स्मरणभजनतोषं दूररागादिदोषम् । विहितससुरपोषं सिद्धिदाख्यानयोषं
    कृतजडपरिशोषं मञ्जुघोषं नमामि ॥ ३॥ गणपतिशरजन्मश्रीमहाकालसिंहैः परिवृतमिव चन्द्राभाभमिन्दीवराक्षम् ।
    असिशरजपमालापुस्तकं संवहन्तं उरसि ललितमालं मञ्जुघोषं नमामि ॥ ४॥ सुरपतिशमनायाप्येष मित्राग्निरक्षः
