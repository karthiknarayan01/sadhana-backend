id: kamakalakalisahasranamastotram-mahakalasamhitayam
category: sahasranama
name:
  english: kamakalakalisahasranamastotram (mahakalasamhitayam)
  devanagari: कामकलाकालीसहस्रनामस्तोत्रम् (महाकालसंहितायां)
content:
  english: devyuvaca | tvattah shrutam maya natha deva deva jagatpate | devyah kamakalakalya vidhanam
    siddhidayakam || 1|| trailokyavijayasyapi visheshena shruto maya | tatprasangena canyasam mantradhyane
    tatha shrute || 2|| idanim jayate natha shushrusha mama bhuyasi | namnam sahasre trividhamahapapaughaharini
    || 3|| shrutena yena devesha dhanya syam bhagyavatyapi | shrimahakala uvaca | bhagyavatyasi dhanyasi
    sandeho natra bhavini || 4|| sahasranamashravane yasmatte nishcitam manah | tasya namnantu lakshani
    vidyante catha kotayah || 5|| tanyalpayurmatitvena nribhirddharayitum sada | ashakyani vararohe pathitum
    ca dine dine || 6|| tebhyo namasahasrani saranyuddhritya shambhuna | amritaniva dugdhavdherbhudevebhyah
    samarpitam || 7|| kanicittatra gaunani gaditani shucismite | rudhanyakarahinatvad gaunani gunayogatah
    || 8|| rahityadrudhigunayostani sanketakanyapi | trividhanyapi namani pathitani dine dine || 9|| radhayannikshitanarthandadatyamritamatyayam
    | kshapayatyapamrityum ca marayanti dvipo'khilan || 10|| ghnanti roganathotpatanmangalam kurvatenvaham
    | kimutanyat sada sannidhapayatya'rthikamapi || 11|| tripuraghno'pyadonamasahasram pathati priye |
    tadajnayapyahamapi kirtayami dinedine | 12|| bhavatyapidamasmattah shikshitva tu pathishyati | bhavishyati
    ca nirnitam caturvargasya bhajanam || 13|| manonyato nirakritya savadhana nishamaya | namnam kamakalakalyah
    sahasram muktidayakam || 14|| om asya kamakalakalisahasranamastotrasya shritripuraghnarishih | anushtup
    chandah | trijaganmayarupini bhagavati shrikamakalakali devata | klim bijam | sphrom shaktih | hum
    kilakam | kshraum tattvam | shrikamakalakalisahasranamastotrapathe jape viniyogah | om tatsat || om
    klim kamakalakali kalaratrih kapalini | katyayani ca kalyani kalakara karalini || 15|| ugramurtirmahabhima
    ghorarava bhayankara | bhutidamayahantri ca bhavabandhavimocani || 16|| bhavya bhavani bhogadhya bhujangapatibhushana
    | mahamaya jagaddhatri pavani parameshvari || 17|| yogamata yogagamya yogini yogipujita | gauri durga
    kalika ca mahakalpantanartaki || 18|| avyaya jagadadishca vidhatri kalamarddini | nitya varenya vimala
    devaradhyamitaprabha || 19|| bharunda kotari shuddha cancala caruhasini | agrahyatindriyagotra carcarorddhvashiroruha
    || 20|| kamuki kamaniya ca shrikanthamahishi shiva | manohara mananiya matida manibhushana || 21||
    shmashananilaya raudra muktakeshyattahasini | camunda candika candi carvangi caritojjvala || 22||
    ghoranana dhumrashikha kampana kampitanana | vepamanatanurbhida nirbhaya bahushalini || 23|| ulmukakshi
    sarpakarni vishoka girinandini | jyotsnamukhi hasyapara lingalingadhara sati || 24|| avikara mahacitra
    candravaktra manojava | adarshana papahara shyamala mundamekhala || 25|| mundavatamsini nila prapannanandadayini
    | laghustani lamvakuca dhurnamana harangana || 26|| vishvavasa shantikari dirghakeshyarikhandini |
    rucira sundari kamra madonmatta madotkata || 27|| ayomukhi vahnimukhi krodhana'bhayadeshvari | kudambika
    sahasini khadgaki raktalehini || 28|| vidarini panarata rudrani mundamalini | anadinidhana devi durnnirikshya
    digambara || 29|| vidyujjihva mahadamshtra vajratikshna mahasvana | udayarkasamanakshi vindhyashailasamakritih
    || 30|| nilotpaladalashyama nagendrashtakabhushita | agnijvalakritavasa phetkarinyahikundala || 31||
    papaghni palini padma punya punyaprada para | kalpantambhodanirghosha sahasrarkasamaprabha || 32||
    sahasrapretarat krodha sahasreshaparakrama | sahasradhanadaishvarya sahasranghrikarambika || 33||
    sahasrakaladushprekshya sahasrendriyasancaya | sahasrabhumisadana sahasrakashavigraha || 34|| sahasracandrapratima
    sahasragrahacarini | sahasrarudratejaska sahasrabrahmasrishtikrit || 35|| sahasravayuvega ca sahasraphanakundala
    | sahasrayatramathini sahasrodadhisusthira || 36|| sahasrabuddhakaruna mahabhaga tapasvini | trailokyamohini
    sarvabhutadevavashankari || 37|| susnigdhahridaya ghantakarna ca vyomacarini | shankhini citrinishani
    kalasamkarpini jaya || 38|| aparajita ca vijaya kamala kamalaprada | janayitri jagadyonirheturupa
    cidatmika || 39|| aprameya duradharsha dhyeya svacchandacarini | shatodari shambhavini pujya manonnata'mala
    || 40|| omkararupini tamra balarkasamataraka | calajjihva ca bhimakshi mahabhairavanadini || 41||
    satviki rajasi caiva tamasi gharghara'cala | maheshvari tatha brahmi kaumari maninishvara || 42||
    sauparni vayavi caindri savitri nairriti kala | varuni shivaduti ca sauri saumya prabhavati || 43||
    varahi narasimhi ca vaishnavi lalita svara | maitryaryamni ca paushni ca tvashtrivasavyumaratih ||
    44|| rakshasi pavani raudri dasri rodasyudumbari | subhaga durbhaga dina cancurika yashasvini || 45||
    mahananda bhagananda pichila bhagamalini | aruna revati rakta shakuni shyenatundika || 46|| surabhi
    nandini bhadra vala cativalamala | ulupi lambika kheta lelihanantramalini || 47|| vainayiki ca vetali
    trijata bhrikuti mati | kumari yuvati praudha vidagdha ghasmara tatha || 48|| jarati rocana bhima
    dolamala picindila | alambakshi kumbhakarni kalakarni mahasuri || 49|| ghantaravatha gokarna kakajangha
    ca mushika | mahahanurmahagriva lohita lohitashani || 50| kirtih sarasvati lakshmih shraddha buddhih
    kriya sthitih | cetana vishnumaya ca gunatita niranjana || 51|| nidra tandra smita chaya jrimbha kshudashanayita
    | trishna kshudha pipasa ca lalasa kshantireva ca || 52|| vidya praja smriti kantiriccha medha prabha
    citih | dharitri dharani dhanya dhorani dharmasantatih || 53|| halapriya hararatirharini harinekshana
    | candayogeshvari siddhi karali paridamari || 54|| jagadanya janananda nityanandamayi sthira | hiranyagarbha
    kundalini jnanam dhairyanca khecari || 55|| nagatmaja nagahara jatabharayatarddini | khadgini shulini
    cakravati vanavati kshitih || 56|| ghrinidhartri nalika ca karttri matyakshamalini | pashini pashuhasta
    ca nagahasta dhanurdhara || 57|| mahamudgarahasta ca shivapotadharapi ca | narakhapparrini lambatkacamundapradharini
    || 58|| padmavatyannapurnaca mahalakshmih sarasvati | durga ca vijaya ghora tatha mahishamarddini
    || 59|| dhanalakshmi jayapradashcashvarudha jayabhairavi | shulini rajamatagi rajarajeshvari tatha
    || 60|| triputocchishtacandali aghora tvaritapi ca | rajyalakshmirjayamahacandayogeshvari tatha ||
    61|| guhya mahabhairavi ca vishvalakshmirarundhati | yantrapramathini candayogeshvaryapyalambusha
    || 62|| kirati mahacandabhairavi kalpavallari | trailokyavijaya sampatprada manthanabhairavi || 63||
    mahamantreshvari vajraprastarinyangacarpata | jayalakshmishcandarupa jaleshvari kamadayini || 64||
    svarnakuteshvari runda marmari buddhivarddhini | varttali candavarttali jayavarttalika tatha || 65||
    ugracanda smashanogra canda vai rudracandika | aticanda candavati pracanda candanayika || 66|| caitanyabhairavi
    krishna mandali tumbureshvari | vagvadini mundamadhyamatyanardhya pishacini || 67|| manjira rohini
    kulya tunga purneshvari vara | vishala raktacamunda aghora candavaruni || 68|| dhanada tripura vagishvari
    jayamangala | daigambari kunjika ca kudukka kalabhairavi || 69|| kukkuti sankata vira karpata bhramarambika
    | maharnaveshvari bhogavati sankeshvari tatha || 70|| pulindi shavari mlecchi pingala shavareshvari
    | mohini siddhilakshmishca bala tripurasundari || 71|| ugratara caikajata mahanilasarasvati | trikantaki
    chinnamasta mahishaghni jayavaha || 72|| harasiddhanangamala phetkari lavaneshvari | candeshvari nakulica
    hayagriveshvari tatha || 73|| kalindi vajravarahi mahanilapatakika | hamseshvari mokshalakshmirbhutini
    jataretasa || 74|| shatakarna mahanila vama guhyeshvari bhramih | ekanamsha'bhaya tarkshi vabhravi
    damari tatha || 75|| korangi carcika vinna samsika brahmavadini | trikalavedini nilalohita raktadantika
    || 76|| kshemankari vishvarupa kamakhya kulakuttani | kamankusha veshini ca mayuri ca kuleshvari ||
    77|| ibhrakshi dyonaki sharngi bhima devi varaprada | dhumavati mahamari mangala hatakeshvari || 78||
    kirati shaktisauparni bandhavi candakhecari | nistandra bhavabhutishca jvalaghantagnimarddini || 79||
    suranga kaulini ramya nati carayani dhritih | ananta punjika jihva dharmadharmapravartika || 80||
    vandini vandaniya ca vela'haskarini sudha | arani madhavi gotra pataka vagmayi shrutih || 81|| gudha
    trigudha vispashta mriganka ca nirindriya | menanandakari vodhri trinetra vedavahana || 82|| kalasvana
    tarini ca satyamatyapriya'jada | ekavaktra mahavaktra bahuvaktra ghananana || 83|| indira kashyapi
    jyotsna shavarudha tanudari | mahashankhadhara nagopavitinyakshatashaya || 84|| nirindhana dharadhara
    vyadhighni kalpakarini | vishveshvari vishvadhatri vishveshi vishvavandita || 85|| vishva vishvatmika
    vishvavyapika vishvatarini | vishvasamharini vishvahasta vishvopakarika || 86|| vishvamata vishvagata
    vishvatita virodhita | trailokyatranakartri ca kutakara katankata || 87|| kshamodari ca kshetrajna
    kshayahina ksharavarjita | kshapa kshobhakari kshemya'kshobhya kshemadugha kshiya || 88|| sukhada
    sumukhi saumya svanga surapara sudhih | sarvantaryamini sarva sarvaradhya samahita || 89|| tapini
    tapini tivra tapaniya tu nabhiga | haimi haimavati riddhirvriddhirjnanaprada nara || 90|| mahajata
    mahapada mahahasta mahahanuh | mahabala maharopa mahadhairya mahaghrina || 91|| mahakshama punyapapadhvajini
    ghurghurarava | dakini shakini ramya shaktih shaktisvarupini || 92|| tamisra gandharashanta danta
    kshanta jitendriya | mahodaya jnaniniccha viraga sukhitakritih || 93|| vasana vasanahina nivrittirnnirvritih
    kritih | acala heturunmukta jayini samsmritih cyuta || 94|| kaparddini mukutini matta prakritirurjita
    | sadasatsakshini sphita mudita karunamayi || 95|| purvottara pashcima ca dakshinavidigu hata | atmarama
    shivarama ramani shankarapriya || 96|| varenya varada veni stambhinyakarpini tatha | uccatani marani
    ca dveshini vashini mahi || 97|| bhramani bharati bhama vishoka shokaharini | sinivali kuhu rakanumati
    padminitihrit || 98|| savitri vedajanani gayatryahutisadhika | candattahasa taruni bhurbhuvahsvahkalevara
    || 99|| atanuratanupranadatri matangagamini | nigamaddhimanih prithvi janmamrityujaraushadhi || 100||
    pratarini kalalapa vedyachedya vasundhara | prakshunna vasita kamadhenurvanchitadayini || 101|| saudamini
    meghamala sharvari sarvagocara | damarurdamaruka ca nihsvara parinadini || 102|| ahatatma hata capi
    nadatita vileshaya | para'para ca pashyanti madhyama vaikhari tatha || 103|| prathama ca jaghanya
    ca madhyasthantavikashini | prishthastha ca purahstha ca parshvasthordhvatalasthita || 104|| nedishtha
    ca davishtha ca varhishtha ca guhashaya | aprapya vrimhita purna punyairnavidanamaya || 105||
  devanagari: देव्युवाच । त्वत्तः श्रुतं मया नाथ देव देव जगत्पते । देव्याः कामकलाकाल्या विधानं सिद्धिदायकम्
    ॥ १॥ त्रैलोक्यविजयस्यापि विशेषेण श्रुतो मया । तत्प्रसङ्गेन चान्यासां मन्त्रध्याने तथा श्रुते ॥ २॥
    इदानीं जायते नाथ शुश्रुषा मम भूयसी । नाम्नां सहस्रे त्रिविधमहापापौघहारिणि ॥ ३॥ श्रुतेन येन देवेश धन्या
    स्यां भाग्यवत्यपि । श्रीमहाकाल उवाच । भाग्यवत्यसि धन्यासि सन्देहो नात्र भाविनि ॥ ४॥ सहस्रनामश्रवणे
    यस्मात्ते निश्चितं मनः । तस्या नाम्नान्तु लक्षाणि विद्यन्ते चाथ कोटयः ॥ ५॥ तान्यल्पायुर्मतित्वेन नृभिर्द्धारयितुं
    सदा । अशक्यानि वरारोहे पठितुं च दिने दिने ॥ ६॥ तेभ्यो नामसहस्राणि साराण्युद्धृत्य शम्भुना । अमृतानीव
    दुग्धाव्धेर्भूदेवेभ्यः समर्पितम् ॥ ७॥ कानिचित्तत्र गौणानि गदितानि शुचिस्मिते । रूढाण्याकारहीनत्वाद्
    गौणानि गुणयोगतः ॥ ८॥ राहित्याद्रूढिगुणयोस्तानि साङ्केतकान्यपि । त्रिविधान्यपि नामानि पठितानि दिने
    दिने ॥ ९॥ राधयन्नीक्षितानर्थान्ददत्यमृतमत्ययम् । क्षपयत्यपमृत्युं च मारयन्ति द्विपोऽखिलान् ॥ १०॥ घ्नन्ति
    रोगानथोत्पातान्मङ्गलं कुर्वतेन्वहम् । किमुतान्यत् सदा सन्निधापयत्यऽर्थिकामपि ॥ ११॥ त्रिपुरघ्नोऽप्यदोनामसहस्रं
    पठति प्रिये । तदाज्ञयाप्यहमपि कीर्तयामि दिनेदिने । १२॥ भवत्यपीदमस्मत्तः शिक्षित्वा तु पठिष्यति । भविष्यति
    च निर्णीतं चतुर्वर्गस्य भाजनम् ॥ १३॥ मनोन्यतो निराकृत्य सावधाना निशामय । नाम्नां कामकलाकाल्याः सहस्रं
    मुक्तिदायकम् ॥ १४॥ ॐ अस्य कामकलाकालीसहस्रनामस्तोत्रस्य श्रीत्रिपुरघ्नऋषिः । अनुष्टुप् छन्दः । त्रिजगन्मयरूपिणी
    भगवती श्रीकामकलाकाली देवता । क्लीं बीजम् । स्फ्रों शक्तिः । हुं कीलकं । क्ष्रौं तत्त्वं । श्रीकामकलाकालीसहस्रनामस्तोत्रपाठे
    जपे विनियोगः । ॐ तत्सत् ॥ ॐ क्लीं कामकलाकाली कालरात्रिः कपालिनी । कात्यायनी च कल्याणी कालाकारा करालिनी
    ॥ १५॥ उग्रमूर्तिर्महाभीमा घोररावा भयङ्करा । भूतिदामयहन्त्री च भवबन्धविमोचनी ॥ १६॥ भव्या भवानी भोगाढ्या
    भुजङ्गपतिभूषणा । महामाया जगद्धात्री पावनी परमेश्वरी ॥ १७॥ योगमाता योगगम्या योगिनी योगिपूजिता । गौरी
    दुर्गा कालिका च महाकल्पान्तनर्तकी ॥ १८॥ अव्यया जगदादिश्च विधात्री कालमर्द्दिनी । नित्या वरेण्या विमला
    देवाराध्यामितप्रभा ॥ १९॥ भारुण्डा कोटरी शुद्धा चञ्चला चारुहासिनी । अग्राह्यातीन्द्रियागोत्रा चर्चरोर्द्ध्वशिरोरुहा
    ॥ २०॥ कामुकी कमनीया च श्रीकण्ठमहिषी शिवा । मनोहरा माननीया मतिदा मणिभूषणा ॥ २१॥ श्मशाननिलया रौद्रा
    मुक्तकेश्यट्टहासिनी । चामुण्डा चण्डिका चण्डी चार्वङ्गी चरितोज्ज्वला ॥ २२॥ घोरानना धूम्रशिखा कंपना
    कंपितानना । वेपमानतनुर्भीदा निर्भया बाहुशालिनी ॥ २३॥ उल्मुकाक्षी सर्पकर्णी विशोका गिरिनन्दिनी । ज्योत्स्नामुखी
    हास्यपरा लिङ्गालिङ्गधरा सती ॥ २४॥ अविकारा महाचित्रा चन्द्रवक्त्रा मनोजवा । अदर्शना पापहरा श्यामला
    मुण्डमेखला ॥ २५॥ मुण्डावतंसिनी नीला प्रपन्नानन्ददायिनी । लघुस्तनी लम्वकुचा धूर्णमाना हराङ्गना ॥ २६॥
    विश्वावासा शान्तिकरी दीर्घकेश्यरिखण्डिनी । रुचिरा सुन्दरी कम्रा मदोन्मत्ता मदोत्कटा ॥ २७॥ अयोमुखी
    वह्निमुखी क्रोधनाऽभयदेश्वरी । कुडम्बिका साहसिनी खड्गकी रक्तलेहिनी ॥ २८॥ विदारिणी पानरता रुद्राणी मुण्डमालिनी
    । अनादिनिधना देवी दुर्न्निरीक्ष्या दिगम्बरा ॥ २९॥ विद्युज्जिह्वा महादंष्ट्रा वज्रतीक्ष्णा महास्वना
    । उदयार्कसमानाक्षी विन्ध्यशैलसमाकृतिः ॥ ३०॥ नीलोत्पलदलश्यामा नागेन्द्राष्टकभूषिता । अग्निज्वालकृतावासा
    फेत्कारिण्यहिकुण्डला ॥ ३१॥ पापघ्नी पालिनी पद्मा पूण्या पुण्यप्रदा परा । कल्पान्ताम्भोदनिर्घोषा सहस्रार्कसमप्रभा
    ॥ ३२॥ सहस्रप्रेतराट् क्रोधा सहस्रेशपराक्रमा । सहस्रधनदैश्वर्या सहस्राङ्घ्रिकराम्बिका ॥ ३३॥ सहस्रकालदुष्प्रेक्ष्या
    सहस्रेन्द्रियसञ्चया । सहस्रभूमिसदना सहस्राकाशविग्रहा ॥ ३४॥ सहस्रचन्द्रप्रतिमा सहस्रग्रहचारिणी । सहस्ररुद्रतेजस्का
    सहस्रब्रह्मसृष्टिकृत् ॥ ३५॥ सहस्रवायुवेगा च सहस्रफणकुण्डला । सहस्रयत्रमथिनी सहस्रोदधिसुस्थिरा ॥ ३६॥
    सहस्रबुद्धकरुणा महाभागा तपस्विनी । त्रैलोक्यमोहिनी सर्वभूतदेववशङ्करी ॥ ३७॥ सुस्निग्धहृदया घण्टाकर्णा
    च व्योमचारिणी । शङ्खिनी चित्रिणीशानी कालसंकर्पिणी जया ॥ ३८॥ अपराजिता च विजया कमला कमलाप्रदा । जनयित्री
    जगद्योनिर्हेतुरूपा चिदात्मिका ॥ ३९॥ अप्रमेया दुराधर्षा ध्येया स्वच्छन्दचारिणी । शातोदरी शाम्भविनी
    पूज्या मानोन्नताऽमला ॥ ४०॥ ओंकाररूपिणी ताम्रा बालार्कसमतारका । चलज्जिह्वा च भीमाक्षी महाभैरवनादिनी
    ॥ ४१॥ सात्विकी राजसी चैव तामसी घर्घराऽचला । माहेश्वरी तथा ब्राह्मी कौमारी मानिनीश्वरा ॥ ४२॥ सौपर्णी
    वायवी चैन्द्री सावित्री नैरृती कला । वारुणी शिवदूती च सौरी सौम्या प्रभावती ॥ ४३॥ वाराही नारसिंही च
    वैष्णवी ललिता स्वरा । मैत्र्यार्यम्नी च पौष्णी च त्वाष्ट्रीवासव्युमारतिः ॥ ४४॥ राक्षसी पावनी रौद्री
    दास्री रोदस्युदुम्बरी । सुभगा दुर्भगा दीना चञ्चुरीका यशस्विनी ॥ ४५॥ महानन्दा भगानन्दा पिछिला भगमालिनी
    । अरुणा रेवती रक्ता शकुनी श्येनतुण्डिका ॥ ४६॥ सुरभी नन्दिनी भद्रा वला चातिवलामला । उलुपी लम्बिका खेटा
    लेलिहानान्त्रमालिनी ॥ ४७॥ वैनायिकी च वेताली त्रिजटा भृकुटी मती । कुमारी युवती प्रौढा विदग्धा घस्मरा
    तथा ॥ ४८॥ जरती रोचना भीमा दोलमाला पिचिण्डिला । अलम्बाक्षी कुम्भकर्णी कालकर्णी महासुरी ॥ ४९॥ घण्टारवाथ
    गोकर्णा काकजङ्घा च मूषिका । महाहनुर्महाग्रीवा लोहिता लोहिताशनी ॥ ५०। कीर्तिः सरस्वती लक्ष्मीः श्रद्धा
    बुद्धिः क्रिया स्थितिः । चेतना विष्णुमाया च गुणातीता निरञ्जना ॥ ५१॥ निद्रा तन्द्रा स्मिता छाया जृम्भा
    क्षुदशनायिता । तृष्णा क्षुधा पिपासा च लालसा क्षान्तिरेव च ॥ ५२॥ विद्या प्रजा स्मृति कान्तिरिच्छा मेधा
    प्रभा चितिः । धरित्री धरणी धन्या धोरणी धर्मसन्ततिः ॥ ५३॥ हालाप्रिया हाररतिर्हारिणी हरिणेक्षणा । चण्डयोगेश्वरी
    सिद्धि कराली परिडामरी ॥ ५४॥ जगदान्या जनानन्दा नित्यानन्दमयी स्थिरा । हिरण्यगर्भा कुण्डलिनी ज्ञानं
    धैर्यञ्च खेचरी ॥ ५५॥ नगात्मजा नागहारा जटाभारायतर्द्दिनी । खड्गिनी शूलिनी चक्रवती वाणवती क्षितिः ॥
    ५६॥ घृणिधर्त्री नालिका च कर्त्त्री मत्यक्षमालिनी । पाशिनी पशुहस्ता च नागहस्ता धनुर्धरा ॥ ५७॥ महामुद्गरहस्ता
    च शिवापोतधरापि च । नारखप्पर्रिणी लम्बत्कचमुण्डप्रधारिणी ॥ ५८॥ पद्मावत्यन्नपूर्णाच महालक्ष्मीः सरस्वती
    । दुर्गा च विजया घोरा तथा महिषमर्द्दिनी ॥ ५९॥ धनलक्ष्मी जयप्रदाश्चाश्वारूढा जयभैरवी । शूलिनी राजमातगी
    राजराजेश्वरी तथा ॥ ६०॥ त्रिपुटोच्छिष्टचाण्डाली अघोरा त्वरितापि च । राज्यलक्ष्मीर्जयमहाचण्डयोगेश्वरी
    तथा ॥ ६१॥ गुह्या महाभैरवी च विश्वलक्ष्मीररुन्धती । यन्त्रप्रमथिनी चण्डयोगेश्वर्यप्यलम्बुषा ॥ ६२॥ किराती
    महाचण्डभैरवी कल्पवल्लरी । त्रैलोक्यविजया संपत्प्रदा मन्थानभैरवी ॥ ६३॥ महामन्त्रेश्वरी वज्रप्रस्तारिण्यङ्गचर्पटा
    । जयलक्ष्मीश्चण्डरूपा जलेश्वरी कामदायिनी ॥ ६४॥ स्वर्णकूटेश्वरी रुण्डा मर्मरी बुद्धिवर्द्धिनी । वार्त्ताली
    चण्डवार्त्ताली जयवार्त्तालिका तथा ॥ ६५॥ उग्रचण्डा स्मशानोग्रा चण्डा वै रुद्रचण्डिका । अतिचण्डा चण्डवती
    प्रचण्डा चण्डनायिका ॥ ६६॥ चैतन्यभैरवी कृष्णा मण्डली तुम्बुरेश्वरी । वाग्वादिनी मुण्डमध्यमत्यनर्ध्या
    पिशाचिनी ॥ ६७॥ मञ्जीरा रोहिणी कुल्या तुङ्गा पूर्णेश्वरी वरा । विशाला रक्तचामुण्डा अघोरा चण्डवारुणी
    ॥ ६८॥ धनदा त्रिपुरा वागीश्वरी जयमङ्गला । दैगम्बरी कुञ्जिका च कुडुक्का कालभैरवी ॥ ६९॥ कुक्कुटी सङ्कटा
    वीरा कर्पटा भ्रमराम्बिका । महार्णवेश्वरी भोगवती सङ्केश्वरी तथा ॥ ७०॥ पुलिन्दी शवरी म्लेच्छी पिङ्गला
    शवरेश्वरी । मोहिनी सिद्धिलक्ष्मीश्च बाला त्रिपुरसुन्दरी ॥ ७१॥ उग्रतारा चैकजटा महानीलसरस्वती । त्रिकण्टकी
    छिन्नमस्ता महिषघ्नी जयावहा ॥ ७२॥ हरसिद्धानङ्गमाला फेत्कारी लवणेश्वरी । चण्डेश्वरी नाकुलीच हयग्रीवेश्वरी
    तथा ॥ ७३॥ कालिन्दी वज्रवाराही महानीलपताकिका । हंसेश्वरी मोक्षलक्ष्मीर्भूतिनी जातरेतसा ॥ ७४॥ शातकर्णा
    महानीला वामा गुह्येश्वरी भ्रमिः । एकानंशाऽभया तार्क्षी वाभ्रवी डामरी तथा ॥ ७५॥ कोरङ्गी चर्चिका विन्ना
    संसिका ब्रह्मवादिनी । त्रिकालवेदिनी नीललोहिता रक्तदन्तिका ॥ ७६॥ क्षेमङ्करी विश्वरूपा कामाख्या कुलकुट्टनी
    । कामाङ्कुशा वेशिनी च मायूरी च कुलेश्वरी ॥ ७७॥ इभ्राक्षी द्योनकी शार्ङ्गी भीमा देवी वरप्रदा । धूमावती
    महामारी मङ्गला हाटकेश्वरी ॥ ७८॥ किराती शक्तिसौपर्णी बान्धवी चण्डखेचरी । निस्तन्द्रा भवभूतिश्च ज्वालाघण्टाग्निमर्द्दिनी
    ॥ ७९॥ सुरङ्गा कौलिनी रम्या नटी चारायणी धृतिः । अनन्ता पुञ्जिका जिह्वा धर्माधर्मप्रवर्तिका ॥ ८०॥ वन्दिनी
    वन्दनीया च वेलाऽहस्करिणी सुधा । अरणी माधवी गोत्रा पताका वाग्मयी श्रुतिः ॥ ८१॥ गूढा त्रिगूढा विस्पष्टा
    मृगाङ्का च निरिन्द्रिया । मेनानन्दकरी वोध्री त्रिनेत्रा वेदवाहना ॥ ८२॥ कलस्वना तारिणी च सत्यामत्यप्रियाऽजडा
    । एकवक्त्रा महावक्त्रा बहुवक्त्रा घनानना ॥ ८३॥ इन्दिरा काश्यपी ज्योत्स्ना शवारूढा तनूदरी । महाशङ्खधरा
    नागोपवीतिन्यक्षताशया ॥ ८४॥ निरिन्धना धराधारा व्याधिघ्नी कल्पकारिणी । विश्वेश्वरी विश्वधात्री विश्वेशी
    विश्ववन्दिता ॥ ८५॥ विश्वा विश्वात्मिका विश्वव्यापिका विश्वतारिणी । विश्वसंहारिणी विश्वहस्ता विश्वोपकारिका
    ॥ ८६॥ विश्वमाता विश्वगता विश्वातीता विरोधिता । त्रैलोक्यत्राणकर्त्री च कूटाकारा कटङ्कटा ॥ ८७॥ क्षामोदरी
    च क्षेत्रज्ञा क्षयहीना क्षरवर्जिता । क्षपा क्षोभकरी क्षेम्याऽक्षोभ्या क्षेमदुघा क्षिया ॥ ८८॥ सुखदा
    सुमुखी सौम्या स्वङ्गा सुरपरा सुधीः । सर्वान्तर्यामिनी सर्वा सर्वाराध्या समाहिता ॥ ८९॥ तपिनी तापिनी
    तीव्रा तपनीया तु नाभिगा । हैमी हैमवती ऋद्धिर्वृद्धिर्ज्ञानप्रदा नरा ॥ ९०॥ महाजटा महापादा महाहस्ता
    महाहनुः । महाबला महारोपा महाधैर्या महाघृणा ॥ ९१॥ महाक्षमा पुण्यपापध्वजिनी घुर्घुरारवा । डाकिनी शाकिनी
    रम्या शक्तिः शक्तिस्वरूपिणी ॥ ९२॥ तमिस्रा गन्धराशान्ता दान्ता क्षान्ता जितेन्द्रिया । महोदया ज्ञानिनीच्छा
    विरागा सुखिताकृतिः ॥ ९३॥ वासना वासनाहीना निवृत्तिर्न्निर्वृतिः कृतिः । अचला हेतुरुन्मुक्ता जयिनी संस्मृतिः
    च्युता ॥ ९४॥ कपर्द्दिनी मुकुटिनी मत्ता प्रकृतिरूर्जिता । सदसत्साक्षिणी स्फीता मुदिता करुणामयी ॥ ९५॥
    पूर्वोत्तरा पश्चिमा च दक्षिणाविदिगू हता । आत्मारामा शिवारामा रमणी शङ्करप्रिया ॥ ९६॥ वरेण्या वरदा वेणी
    स्तम्भिण्याकर्पिणी तथा । उच्चाटनी मारणी च द्वेषिणी वशिनी मही ॥ ९७॥ भ्रमणी भारती भामा विशोका शोकहारिणी
    । सिनीवाली कुहू राकानुमति पद्मिनीतिहृत् ॥ ९८॥ सावित्री वेदजननी गायत्र्याहुतिसाधिका । चण्डाट्टहासा
    तरुणी भूर्भुवःस्वःकलेवरा ॥ ९९॥ अतनुरतनुप्राणदात्री मातङ्गगामिनी । निगमाद्धिमणिः पृथ्वी जन्ममृत्युजरौषधी
    ॥ १००॥ प्रतारिणी कलालापा वेद्याछेद्या वसुन्धरा । प्रक्षुन्ना वासिता कामधेनुर्वाञ्छितदायिनी ॥ १०१॥
    सौदामिनी मेघमाला शर्वरी सर्वगोचरा । डमरुर्डमरुका च निःस्वरा परिनादिनी ॥ १०२॥ आहतात्मा हता चापि नादातीता
    विलेशया । पराऽपारा च पश्यन्ती मध्यमा वैखरी तथा ॥ १०३॥ प्रथमा च जघन्या च मध्यस्थान्तविकाशिनी । पृष्ठस्था
    च पुरःस्था च पार्श्वस्थोर्ध्वतलस्थिता ॥ १०४॥ नेदिष्ठा च दविष्ठा च वर्हिष्ठा च गुहाशया । अप्राप्या
    वृंहिता पूर्णा पुण्यैर्नविदनामया ॥ १०५॥
