id: agastya-kruta-sri-lakshmi-stotram
category: stotram
name:
  english: Agastya Kruta Sri Lakshmi Stotram
content:
  english: jaya padmapalashakshi jaya tvam shripatipriye | jaya matarmahalakshmi samsararnavatarini ||
    || mahalakshmi namastubhyam namastubhyam sureshvari | haripriye namastubhyam namastubhyam dayanidhe
    || || padmalaye namastubhyam namastubhyam ca sarvade | sarvabhutahitarthaya vasuvrishtim sada kuru
    || || jaganmatarnamastubhyam namastubhyam dayanidhe | dayavati namastubhyam vishveshvari namo'stu
    te || || namah kshirarnavasute namastrailokyadharini | vasuvrishte namastubhyam raksha mam sharanagatam
    || || raksha tvam devadeveshi devadevasya vallabhe | daridryattrahi mam lakshmi kripam kuru mamopari
    || || namastrailokyajanani namastrailokyapavani | brahmadayo namanti tvam jagadanandadayini || ||
    vishnupriye namastubhyam namastubhyam jagaddhite | artihantri namastubhyam samriddhim kuru me sada
    || || abjavase namastubhyam capalayai namo namah | cancalayai namastubhyam lalitayai namo namah ||
    || namah pradyumnajanani matastubhyam namo namah | paripalaya mam matah mam tubhyam sharanagatam ||
    || sharanye tvam prapanno'smi kamale kamalalaye | trahi trahi mahalakshmi paritranaparayane || ||
    pandityam shobhate naiva na shobhante guna nare | shilatvam naiva shobheta mahalakshmi tvaya vina
    || || tavadvirajate rupam tavacchilam virajate | tavadguna naranam ca yavallakshmih prasidati || ||
    lakshmi tvaya'lankritamanava ye papairvimukta nripalokamanyah | gunairvihina gunino bhavanti dushshilinah
    shilavatam varishthah || || lakshmirbhushayate rupam lakshmirbhushayate kulam | lakshmirbhushayate
    vidyam sarva lakshmirvishishyate || || lakshmi tvadgunakirtanena kamala bhuryatyalam jihmatam rudradya
    ravicandradevapatayo vaktum ca naiva kshamah | asmabhistava rupalakshanagunanvaktum katham shakyate
    matarmam paripahi vishvajanani kritva mameshtam dhruvam || || dinartibhitam bhavatapapiditam dhanairvihinam
    tava parshvamagatam | kripanidhitvanmama lakshmi satvaram dhanapradanaddhananayakam kuru || || mam
    vilokya janani haripriye nirdhanam tava samipamagatam | dehi me jhatiti lakshmi karagram vastrakancanavarannamadbhutam
    || || tvameva janani lakshmih pita lakshmistvameva ca | bhrata tvam ca sakha lakshmirvidya lakshmistvameva
    ca || || trahi trahi mahalakshmi trahi trahi sureshvari | trahi trahi jaganmatah daridryattrahi vegatah
    || || namastubhyam jagaddhatri namastubhyam namo namah | dharmadhare namastubhyam namah sampattidayini
    || || daridryarnavamagno'ham nimagno'ham rasatale | majjantam mam kare dhritva tuddhara tvam rame
    drutam || || kim lakshmi bahunoktena jalpitena punah punah | anyanme sharanam nasti satyam satyam
    haripriye || || etacchrutva'gastyavakyam hrishyamana haripriya | uvaca madhuram vanim tushta'ham tava
    sarvada || || shrilakshmiruvaca | yattvayoktamidam stotram yah pathishyati manavah | shrinoti ca mahabhagastasyaham
    vashavartini || || nityam pathati yo bhaktya tvalakshmistasya nashyati | rinam ca nashyate tivram
    viyogam naiva pashyati || || yah pathetpratarutthaya shraddhabhaktisamanvitah | grihe tasya sada tishtennityam
    shrih patina saha || || sukhasaubhagyasampanno manasvi buddhimanbhavet | putravan gunavan shreshtho
    bhogabhokta ca manavah || || idam stotram mahapunyam lakshmyagastyaprakirtitam | vishnuprasadajananam
    caturvargaphalapradam || || rajadvare jayashcaiva shatroshcaiva parajayah | bhutapretapishacanam vyaghranam
    na bhayam tatha || || na shastranalatoyaughadbhayam tasya prajayate | durvrittanam ca papanam bahuhanikaram
    param || || mandurakarishalasu gavam goshthe samahitah | pathettaddoshashantyartham mahapatakanashanam
    || || sarvasaukhyakaram nrinamayurarogyadam tatha | agastyamunina proktam prajanam hitakamyaya ||
    || ityagastyaviracitam shri lakshmi stotram |
  devanagari: जय पद्मपलाशाक्षि जय त्वं श्रीपतिप्रिये । जय मातर्महालक्ष्मि संसारार्णवतारिणि ॥ ॥ महालक्ष्मि
    नमस्तुभ्यं नमस्तुभ्यं सुरेश्वरि । हरिप्रिये नमस्तुभ्यं नमस्तुभ्यं दयानिधे ॥ ॥ पद्मालये नमस्तुभ्यं
    नमस्तुभ्यं च सर्वदे । सर्वभूतहितार्थाय वसुवृष्टिं सदा कुरु ॥ ॥ जगन्मातर्नमस्तुभ्यं नमस्तुभ्यं दयानिधे
    । दयावति नमस्तुभ्यं विश्वेश्वरि नमोऽस्तु ते ॥ ॥ नमः क्षीरार्णवसुते नमस्त्रैलोक्यधारिणि । वसुवृष्टे
    नमस्तुभ्यं रक्ष मां शरणागतम् ॥ ॥ रक्ष त्वं देवदेवेशि देवदेवस्य वल्लभे । दारिद्र्यात्त्राहि मां लक्ष्मि
    कृपां कुरु ममोपरि ॥ ॥ नमस्त्रैलोक्यजननि नमस्त्रैलोक्यपावनि । ब्रह्मादयो नमन्ति त्वां जगदानन्ददायिनि
    ॥ ॥ विष्णुप्रिये नमस्तुभ्यं नमस्तुभ्यं जगद्धिते । आर्तिहन्त्रि नमस्तुभ्यं समृद्धिं कुरु मे सदा ॥ ॥
    अब्जवासे नमस्तुभ्यं चपलायै नमो नमः । चञ्चलायै नमस्तुभ्यं ललितायै नमो नमः ॥ ॥ नमः प्रद्युम्नजननि मातस्तुभ्यं
    नमो नमः । परिपालय मां मातः मां तुभ्यं शरणागतम् ॥ ॥ शरण्ये त्वां प्रपन्नोऽस्मि कमले कमलालये । त्राहि
    त्राहि महालक्ष्मि परित्राणपरायणे ॥ ॥ पाण्डित्यं शोभते नैव न शोभन्ते गुणा नरे । शीलत्वं नैव शोभेत महालक्ष्मि
    त्वया विना ॥ ॥ तावद्विराजते रूपं तावच्छीलं विराजते । तावद्गुणा नराणां च यावल्लक्ष्मीः प्रसीदति ॥ ॥
    लक्ष्मि त्वयाऽलङ्कृतमानवा ये पापैर्विमुक्ता नृपलोकमान्याः । गुणैर्विहीना गुणिनो भवन्ति दुश्शीलिनः
    शीलवतां वरिष्ठाः ॥ ॥ लक्ष्मीर्भूषयते रूपं लक्ष्मीर्भूषयते कुलम् । लक्ष्मीर्भूषयते विद्यां सर्वा लक्ष्मीर्विशिष्यते
    ॥ ॥ लक्ष्मी त्वद्गुणकीर्तनेन कमला भूर्यात्यलं जिह्मताम् रुद्राद्या रविचन्द्रदेवपतयो वक्तुं च नैव क्षमाः
    । अस्माभिस्तव रूपलक्षणगुणान्वक्तुं कथं शक्यते मातर्मां परिपाहि विश्वजननी कृत्वा ममेष्टं ध्रुवम् ॥
    ॥ दीनार्तिभीतं भवतापपीडितं धनैर्विहीनं तव पार्श्वमागतम् । कृपानिधित्वान्मम लक्ष्मि सत्वरं धनप्रदानाद्धननायकं
    कुरु ॥ ॥ मां विलोक्य जननी हरिप्रिये निर्धनं तव समीपमागतम् । देहि मे झटिति लक्ष्मि कराग्रं वस्त्रकाञ्चनवरान्नमद्भुतम्
    ॥ ॥ त्वमेव जननी लक्ष्मीः पिता लक्ष्मीस्त्वमेव च । भ्राता त्वं च सखा लक्ष्मीर्विद्या लक्ष्मीस्त्वमेव
    च ॥ ॥ त्राहि त्राहि महालक्ष्मि त्राहि त्राहि सुरेश्वरि । त्राहि त्राहि जगन्मातः दारिद्र्यात्त्राहि
    वेगतः ॥ ॥ नमस्तुभ्यं जगद्धात्रि नमस्तुभ्यं नमो नमः । धर्माधारे नमस्तुभ्यं नमः सम्पत्तिदायिनी ॥ ॥ दारिद्र्यार्णवमग्नोऽहं
    निमग्नोऽहं रसातले । मज्जन्तं मां करे धृत्वा तूद्धर त्वं रमे द्रुतम् ॥ ॥ किं लक्ष्मि बहुनोक्तेन जल्पितेन
    पुनः पुनः । अन्यन्मे शरणं नास्ति सत्यं सत्यं हरिप्रिये ॥ ॥ एतच्छ्रुत्वाऽगस्त्यवाक्यं हृष्यमाणा हरिप्रिया
    । उवाच मधुरां वाणीं तुष्टाऽहं तव सर्वदा ॥ ॥ श्रीलक्ष्मीरुवाच । यत्त्वयोक्तमिदं स्तोत्रं यः पठिष्यति
    मानवः । शृणोति च महाभागस्तस्याहं वशवर्तिनी ॥ ॥ नित्यं पठति यो भक्त्या त्वलक्ष्मीस्तस्य नश्यति । ऋणं
    च नश्यते तीव्रं वियोगं नैव पश्यति ॥ ॥ यः पठेत्प्रातरुत्थाय श्रद्धाभक्तिसमन्वितः । गृहे तस्य सदा तिष्टेन्नित्यं
    श्रीः पतिना सह ॥ ॥ सुखसौभाग्यसम्पन्नो मनस्वी बुद्धिमान्भवेत् । पुत्रवान् गुणवान् श्रेष्ठो भोगभोक्ता
    च मानवः ॥ ॥ इदं स्तोत्रं महापुण्यं लक्ष्म्यागस्त्यप्रकीर्तितम् । विष्णुप्रसादजननं चतुर्वर्गफलप्रदम्
    ॥ ॥ राजद्वारे जयश्चैव शत्रोश्चैव पराजयः । भूतप्रेतपिशाचानां व्याघ्राणां न भयं तथा ॥ ॥ न शस्त्रानलतोयौघाद्भयं
    तस्य प्रजायते । दुर्वृत्तानां च पापानां बहुहानिकरं परम् ॥ ॥ मन्दुराकरिशालासु गवां गोष्ठे समाहितः ।
    पठेत्तद्दोषशान्त्यर्थं महापातकनाशनम् ॥ ॥ सर्वसौख्यकरं नॄणामायुरारोग्यदं तथा । अगस्त्यमुनिना प्रोक्तं
    प्रजानां हितकाम्यया ॥ ॥ इत्यगस्त्यविरचितं श्री लक्ष्मी स्तोत्रम् ।
