id: karavalamba
category: stotram
name:
  english: karavalamba
  devanagari: करावलम्ब
content:
  english: ringara ranga ramaniya kalakalapa angara varna manikantha mahatpratapa shri bhutanatha mama
    dehi karavalambam || 1 nakshatracarunakharaprada nishkaḻanka nakshatranathamukha nirmala cittaranga
    kukshisthala sthiracaracara bhutasamgha shri bhutanatha mama dehi karavalambam || 2 mantrartha tattvanigamartha
    mahavarishu yantradi tantra vara varnita pushkaleshta santrasitarikula padmasukhopavishta shri bhutanatha
    mama dehi karavalambam || 3 shikshaparayana shivatmajasarvabhuta rakshaparayana caracarahetubhuta
    akshayya mangaḻa varaprada citprabodha shri bhutanatha mama dehi karavalambam || 4 vagisha varnita
    vishishta vacovilasa yogisha yogakara yagaphalaprakasha yogeshayogi paramatmahitopadesha shri bhutanatha
    mama dehi karavalambam || 5 yaksheshapujya nidhisancaya nityapala yakshisha kamkshita sulakshana lakshyamula
    akshina punyanija bhaktajananukula shri bhutanatha mama dehi karavalambam || 6 svamin prabharamana
    candanaliptadeha camikarabharana caruturangavaha shrimadsurabharana shasvatasamatsamuha shri bhutanatha
    mama dehi karavalambam || 7 atamrahoruciranjitanjugatra vedantavedya vidhivarnita viryavetra padaravinda
    paripavanabhaktamitra shri bhutanatha mama dehi karavalambam || 8 balamritamshu parishobhita phalapatta
    nilaḻipaḻighanakuntaḻa divyasutra lilavinoda mrigayapara sacaritra shri bhutanatha mama dehi karavalambam
    || 9 bhutipradayaka jagat prathitapratapa bhitipramocaka vishalakalakalapa bodhapradipa bhavatapahara
    svarupa shri bhutanatha mama dehi karavalambam || 10 vetaḻabhutaparivaravinodashila pataḻabhumi suraloka
    sukhanukula nadantaranga natakalpaka dharmapala shri bhutanatha mama dehi karavalambam || 11 sharduladugdhahara
    sarvarujapahara shastranusaraparasatvika hridvihara shastrastra shaktidhara mauktikamugdhahara shri
    bhutanatha mama dehi karavalambam || 12 adityakotiruciranjita vedasara adharabhuta bhuvanaika hitavatara
    adhipramathi padasarasa papadura shri bhutanatha mama dehi karavalambam || 13 pancadrivasa paramadbhutabhavaniya
    panchavatamsamakutojvala pujaniya vanchanukula varadayaka satsahaya shri bhutanatha mama dehi karavalambam
    || 14 himsavihina sharanagataparijata samsarasagara samuttaranaikapota hamsadisevitavibho paramatmabodha
    shri bhutanatha mama dehi karavalambam || 15 kumbhindrakesariturangavaha tunga
  devanagari: ृङ्गार रङ्ग रमणीय कलाकलाप अङ्गार वर्ण मणिकण्ठ महत्प्रताप श्री भूतनाथ मम देहि करावलम्बम्
    ॥ १ नक्षत्रचारुनखरप्रद निष्कळङ्क नक्षत्रनाथमुख निर्मल चित्तरङ्ग कुक्षिस्थल स्थिरचराचर भूतसंघ श्री
    भूतनाथ मम देहि करावलम्बम् ॥ २ मन्त्रार्थ तत्त्वनिगमार्थ महावरिषु यन्त्रादि तन्त्र वर वर्णित पुष्कलेष्ट
    सन्त्रासितारिकुल पद्मसुखोपविष्ट श्री भूतनाथ मम देहि करावलम्बम् ॥ ३ शिक्षापरायण शिवात्मजसर्वभूत रक्षापरायण
    चराचरहेतुभूत अक्षय्य मङ्गळ वरप्रद चित्प्रबोध श्री भूतनाथ मम देहि करावलम्बम् ॥ ४ वागीश वर्णित विशिष्ट
    वचोविलास योगीश योगकर यागफलप्रकाश योगेशयोगि परमात्महितोपदेश श्री भूतनाथ मम देहि करावलम्बम् ॥ ५ यक्षेशपूज्य
    निधिसञ्चय नित्यपाल यक्षीश कांक्षित सुलक्षण लक्ष्यमूल अक्षीण पुण्यनिज भक्तजनानुकूल श्री भूतनाथ मम देहि
    करावलम्बम् ॥ ६ स्वामिन् प्रभारमण चन्दनलिप्तदेह चामीकराभरण चारुतुरङ्गवाह श्रीमद्सुराभरण शास्वतसमत्समूह
    श्री भूतनाथ मम देहि करावलम्बम् ॥ ७ आताम्रहोरुचिरञ्जिताञ्जुगात्र वेदान्तवेद्य विधिवर्णित वीर्यवेत्र
    पादारविन्द परिपावनभक्तमित्र श्री भूतनाथ मम देहि करावलम्बम् ॥ ८ बालामृतांशु परिशोभित फालपट्ट नीलाळिपाळिघनकुन्तळ
    दिव्यसूत्र लीलाविनोद मृगयापर सचरित्र श्री भूतनाथ मम देहि करावलम्बम् ॥ ९ भूतिप्रदायक जगत् प्रथितप्रताप
    भीतिप्रमोचक विशालकलाकलाप बोधप्रदीप भवतापहर स्वरूप श्री भूतनाथ मम देहि करावलम्बम् ॥ १० वेताळभूतपरिवारविनोदशील
    पाताळभूमि सुरलोक सुखानुकूल नादान्तरङ्ग नतकल्पक धर्मपाल श्री भूतनाथ मम देहि करावलम्बम् ॥ ११ शार्दूलदुग्धहर
    सर्वरुजापहार शास्त्रानुसारपरसात्विक हृद्विहार शस्त्रास्त्र शक्तिधर मौक्तिकमुग्धहार श्री भूतनाथ मम
    देहि करावलम्बम् ॥ १२ आदित्यकोटिरुचिरञ्जित वेदसार आधारभूत भुवनैक हितावतार आधिप्रमाथि पदसारस पापदूर
    श्री भूतनाथ मम देहि करावलम्बम् ॥ १३ पञ्चाद्रिवास परमाद्भुतभावनीय पञ्छावतंसमकुटोज्वल पूजनीय वाञ्छानुकूल
    वरदायक सत्सहाय श्री भूतनाथ मम देहि करावलम्बम् ॥ १४ हिंसाविहीन शरणागतपारिजात संसारसागर समुत्तरणैकपोत
    हंसादिसेवितविभो परमात्मबोध श्री भूतनाथ मम देहि करावलम्बम् ॥ १५ कुम्भीन्द्रकेसरितुरङ्गावाह तुङ्ग
