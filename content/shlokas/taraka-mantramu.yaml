id: taraka-mantramu
category: stotram
name:
  english: Taraka Mantramu
content:
  english: adi taraka mantramu korina dòrikènu dhanyudanaitini oranna || pallavi || mirina kaluni dutalapaliti
    mrityuvuyani madinammuka yunna || anupallavi || taraka mantramu || maccikato nitarantarammula mayalalo
    padabokanna hèccuga nutayènimidi tirupatulèlami tirugapaniledanna muccataga ta punyanadulalo munuguta
    paniyemitikanna vaccèdi paruvapu dinamulalo sudipadutalu manakayu || || taraka mantramu || ènnijanmamulanundi
    cucinanu ekonarayanudanna anni rupulai yunna naparatparu namahatmuni katha vinna ènni janmamulajesina
    papamuli janmamuto vidunanna annitikidi kadasari janmamu satyambika puttuta sunna || || taraka mantramu
    || nirmala mantarlakshyabhavamuna nityanandamutonunna karmambuluvidi mokshapaddhatini kannula ne jucucununna
    dharmamu tappaka bhadradrishuni tana madilo nammukayunna marmamu dèlisina ramadasuni hrinmandiramunane
    yunna ||
  devanagari: आदि तारक मन्त्रमु कोरिन दॊरिकॆनु धन्युडनैतिनि ओरन्ना ॥ पल्लवि ॥ मीरिन कालुनि दूतलपालिटि
    मृत्युवुयनि मदिनम्मुक युन्न ॥ अनुपल्लवि ॥ तारक मन्त्रमु ॥ मच्चिकतो नितरान्तरम्मुल मायललो पडबोकन्ना
    हॆच्चुग नूटयॆनिमिदि तिरुपतुलॆलमि तिरुगपनिलेदन्ना मुच्चटगा ता पुण्यनदुललो मुनुगुट पनियेमिटिकन्ना वच्चॆडि
    परुवपु दिनमुललो सुडिपडुटलु मानकयु ॥ ॥ तारक मन्त्रमु ॥ ऎन्निजन्ममुलनुण्डि चूचिननु एकोनारायणुडन्न अन्नि
    रूपुलै युन्न नापरात्परु नामहात्मुनि कथ विन्ना ऎन्नि जन्ममुलजेसिन पापमुली जन्ममुतो विडुनन्ना अन्निटिकिदि
    कडसारि जन्ममु सत्यम्बिक पुट्टुट सुन्ना ॥ ॥ तारक मन्त्रमु ॥ निर्मल मन्तर्लक्ष्यभावमुन नित्यानन्दमुतोनुन्न
    कर्मम्बुलुविडि मोक्षपद्धतिनि कन्नुल ने जूचुचुनुन्न धर्ममु तप्पक भद्राद्रीशुनि तन मदिलो नम्मुकयुन्न
    मर्ममु दॆलिसिन रामदासुनि हृन्मन्दिरमुनने युन्न ॥
