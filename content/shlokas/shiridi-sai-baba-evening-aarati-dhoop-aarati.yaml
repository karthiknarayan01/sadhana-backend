id: shiridi-sai-baba-evening-aarati-dhoop-aarati
category: stotram
name:
  english: Shiridi Sai Baba Evening Aarati - Dhoop Aarati
content:
  english: shri saccidananda sadguru sa ibaba saukhya datara jiva carana rajatali dyava dasa visava bhakta
    visava arati sa ibaba jaluniya ananga sasvarupi rahedanga mumuksha janadavi nijadola shriranga dola
    shriranga arati sa ibaba jayamani jaisabhava taya taisa anubhava davisi dayaghana aisi tujhihimava
    tujhihimava aratisa ibaba tumacenama dyata hare samskriti vyadha agadhatavakarani marga davisi anadha
    davisi anadha arati sa ibaba kaliyugi avatara sadguna parabrahma sacara avatirna jhulase svami datta
    digambara datta digambara arati sa ibaba athadivasa guruvari bhakta karitivari prabhupada pahavaya
    bhavabhaya nivari bhayanivari arati sa ibaba majhanija dravyatheva tava caranarajaseva magane heci
    ata tuhma devadideva devadideva arati sa ibaba icchita dinacataka nirmala toyanijasukha pajave madhavaya
    sambhala apulibaka apulibaka aratisa ibaba saukhyadatara jiva carana rajatali dyavadasa visava bhaktavisava
    arati sa abhang shiridi majhe pandaripura sa ibabaramavara babaramavara ibabaramavara shuddabhakti
    candrabhaga bhavapundalikajaga pundalika jaga bhavapundalikajaga yaho yaho avaghejana| karubabansi
    vandana sa isi vandana| karubabansi vandana|| ganuhmane babasa i| davapava majhe ayi pavamajhe ayi
    davapava majheya vandina carana dolyani pahina rupatujhe| preme alingana anande pujina bhave ovalina
    hmane nama|| tvameva mata ca pita tvameva tvameva bandhushca sakha tvameva tvameva vidya dravinam
    tvameva tvameva sarvam mamadevadeva kayena vaca manasendriyairva buddhyatmanava prakrite svabhavat
    karomi yadyatsakalam parasmai narayanayeti samarpayami acyutankeshavam ramanarayanam krishnadamodaram
    vasudevam harim shridharam madhavam gopikavallabham janakinayakam ramacandram bhaje nama smaranam
    harerama harerama ramarama hare hare harekrishna harekrishna krishna krishna hare hare ||shri gurudevadatta
    namaskarashtakam ananta tulate kasere stavave ananta tulate kasere namave anantamukhaca shine shesha
    gata namaskara sashtanga shrisa inadha smaravemanitvatpada nityabhave uravetari bhaktisathi svabhave
    tarave jaga tarunimaya tata namaskara sashtanga shrisa inadha vase josada davaya santalila dise ajna
    loka pari jojanala pari antari jnanakaivalya data namaskara sashtanga shrisa inadha bharaladhala janmaha
    mana vaca narasardhaka sadhanibhuta saca dharusa i prema galaya ahanta namaskara sashtanga shrisa
    inadha dharave karisana alpajna bala karave ahmadhanyacumbho nigala mukhighala premekharagrasa ata
    namaskara sashtanga shrisa inadha sura dika jyancya padavanditati shukadika jate samanatvadeti prayagadi
    tirdhe padinamrahota namaskara sashtanga shrisa inadha tujhyajyapada pahata gopabali sadarangali citsvarupi
    milali karirasakrida save krishnanadha namaskara sashtanga shrisa inadha tulamagato magane ekadhyave
    karajodito dina atyanta bhave bhavimoha niraja hatari ata namaskara sashtanga shrisa i digambara akshayarupa
    avatara | sarvahi vyapaka tu shrutisara anasuyatrikumara babaye iba kashisnana japa pratidivasi kòlhapura
    bhikshesi nirmala nadi tunga jalaprasi nidramahuradeshi aisa ye yiba jholilombatase vamakari trishula
    dhamarudhari bhaktavaradasada sukhakari deshila mukticari aisa ye yiba payipaduka japamala kamandalumrigachala
    dharana karishiba nagajata mukuta shobhatomatha aisa ye yiba tatpara tujhyaya jedhyani akshayatvancesadani
    lakshmivasakari dinarajani rakshasisankata varuni aisa ye yiba yaparidhyana tujhe gururaya drishyakari
    nayanaya purnananda sukhe hikaya lavisihari gunagaya aisa ye yiba sa i digambara akshaya rupa avatara
    sarvahivyapaka tu shrutisara anasuyatri kumara babaye i mahima stotram sadasatsvarupam cidanandakandam
    jagatsambhavasdhana samhara hetum svabhaktecchaya manusham darshayantam namamishvaram sadgurum sa
    inatham bhavadhvanta vidhvamsa martandamidyam manovagatitam munir dhyana gamyam jagadvyapakam nirmalam
    nirgunam tvam namamishvaram sadgurum sa inatham bhavambhodi magnardhitanam jananam svapadashritanam
    svabhakti priyanam samuddaranardham kalau sambhavantam namamishvaram sadgurum sa inatham sadanimba
    vrikshasyamuladhi vasat sudhasravinam tikta mapya priyantam tarum kalpa vrikshadhikam sadhayantam
    namamishvaram sadgurum sa inatham sadakalpa vrikshasya tasyadhimule bhavadbhavabuddhya saparyadisevam
    nrinam kurvatam bhukti mukti pradantam namamishvaram sadgurum sa inatham aneka shrita tarkya lila
    vilasai sama vishkriteshana bhasvatrpabhavam ahambhavahinam prasannatmabhavam namamishvaram sadgurum
    sa inatham satam vishramarama mevabhiramam sadasajjanai samstutam sannamadbhi janamodadam bhakta bhadra
    pradantam namamishvaram sadgurum sa inatham ajanmadyamekam parambrahma sakshat svayam sambhavam ramamevavatirnam
    bhavaddarshanatsampunita prabhoham namamishvaram sadgurum sa isha kripanidhe khilanrinam sarvardhasiddiprada
    yushmatpadaraja prabhavamatulam dhatapivaktakshama sadbhaktyashsharanam kritanjaliputa sampraptitosmin
    prabho shrimatsa iparesha pada kamalan nanyaccaranyammama sa irupadhara raghavottamam bhaktakama vibudha
    drumam prabhum mayayopahata citta shuddhaye cintayamyaha maharnisham muda sharatsudhamsham pratimam
    prakasham kripatapatram tavasa inatha tvadiyapadabja samashritanam svacchayayatapa mapakarotu upasanadaivata
    sa inatha smavairma yopasani nastutastvam ramenmanome tavapadayugme bhrungo yadabje makarandalubdha
    anekajanmarjita papasankshayo bhavedbhavatpada saroja darshanat kshamasva sarvanaparadha punjakan
    prasida sa isha sadguro dayanidhe shrisa inatha caranamrita purnacitta tatpada sevanarata ssata tanca
    bhaktya samsarajanya duritaugha vinirga taste kaivalya dhama paramam samavapnuvanti stotrame tatpathedbhaktya
    yonnarastanmanasada sadguro inathasya kripapatram bhavedbhavam guru prasada yacanadashakam rusomamapriyambika
    majavaripitahiruso rusomamapriyangana priyasutatmajahiruso rusobhaginabandhu hi svashura sasubayi
    ruso nadatta gurusa ima majhavari kadhihi ruso pusona sunabhayitya majana bhratrijaya puso pusona
    priyasoyare priyasagenajnati puso puso suhridanasakha svajananapta bandhu puso parina gurusa ima majhavari
    kadhihi ruso pusona abalamule taruna vriddahi napuso pusona guruthakute majana dorasane puso pusonacabale
    bure sujanasaduhina puso parina gurusa ima majhavari kadhihi ruso dusocaturattvavit vibudha prajnajnaniruso
    ruso hi vidu striya kushala panditahiruso rusomahipatiyati bhajakatapasihi ruso nadatta gurusa ima
    majhavari kadhihi ruso rusokavi rishi muni anaghasiddayogiruso rusohi grihadevata tikula gramadevi
    ruso ruso khalapishaccahi malinadakini hiruso nadatta gurusa ima majhavari kadhihi ruso rusomrigakhagakrimi
    akhilajivajanturuso ruso vitapaprastara acala apagabdhiruso rusokhapavanagnivar avanipancatattveruso
    nadatta gurusa ima majhavari kadhihi ruso ruso vimalakinnara amalayakshinihiruso rusoshashikhagadihi
    gagani tarakahiruso ruso amararajahi adaya dharmaraja ruso nadatta gurusa ima majhavari kadhihi ruso
    ruso mana sarasvati capalacitta tihiruso ruso vapudi shakhila kathina kalato hiruso rusosakala vishvahimayitu
    brahmagolamruso nadatta gurusa ima majhavari kadhihi ruso vimuda hmanuni haso majanamatsarahi ruso
    padabhiruci ulaso jananakardhaminaphaso nadurga dritica dhaso ashiva bhava magekhaso prapanci manaheruso
    dridavi rakticitti thaso kunaci ghrinana sonaca sprihaka shaci aso sadaiva hridaya vaso manasidyani
    sa ivaso padipranayavoraso nikhila drishya babadiso nadatta gurusa ima upariyacanela ruso mantra pushpam
    hari om yajnena yajnamayajantadeva stanidharmani pradhamanyasan | tehanakam mahimana ssacanta yatrapurve
    sadhya ssanti deva | om rajadhirajaya pasahyasahine namovayam vai shravanaya kurmahe samekaman kamakamaya
    mahyam kameshvaro vaishravano dadatu kuberaya vaishravanaya maharajayanama om svasti samrajyam bhojyam
    svarajyam vairajyam parameshtyamrajyam maharajya madhipatyamayam samantaparya ishya ssarvabhauma ssarva
    yushan tadapadardat prudhivyaisamudra paryantaya ekaralliti tadapyesha shlokobigito maruta pariveshtoro
    marutta syavasan gruhe avikshitasyakama prer vishvedevasabhasada iti shri narayanavasudeva saccidananda
    sadguru sa inadh maharaj ki jai karacarana kritam vakkaya jankarmajamva shravananayanajam vamanasamva
    paradham vidita maviditam va sarvametat kshamasva jayajaya karunabdhe shriprabhosa inadha shri saccidananda
    sadguru sa inadh maharaj ki jai rajadhiraja yogiraja parabrahma shrisa inadhamaharaj shri saccidananda
    sadguru sa
  devanagari: श्री सच्चिदानन्द सद्गुरु सा इबाबा सौख्य दातार जीव चरण रजताली द्यावा दासा विसावा भक्ता विसावा
    आरति सा इबाबा जालुनिय अनङ्ग सस्वरूपि राहेदङ्ग मुमूक्ष जनदावि निजडोला श्रीरङ्ग डोला श्रीरङ्ग आरति सा
    इबाबा जयमनि जैसाभाव तय तैसा अनुभव दाविसि दयाघना ऐसि तुझीहिमाव तुझीहिमावा आरतिसा इबाबा तुमचेनाम द्याता
    हरे संस्कृति व्यधा अगाधतवकरणि मार्ग दाविसि अनाधा दाविसि अनाधा आरति सा इबाबा कलियुगि अवतारा सद्गुण
    परब्रह्मा साचार अवतीर्ण झूलासे स्वामी दत्त दिगम्बर दत्त दिगम्बर आरति सा इबाबा आठादिवसा गुरुवारी भक्त
    करीतिवारी प्रभुपद पहावया भवभय निवारी भयनिवारी आरति सा इबाबा माझानिज द्रव्यठेव तव चरणरजसेवा मागणे हेचि
    आता तुह्मा देवादिदेवा देवादिदेव आरति सा इबाबा इच्छिता दीनचातक निर्मल तोयनिजसूख पाजवे माधवाया सम्भाल
    अपूलिबाक अपूलिबाक आरतिसा इबाबा सौख्यदातार जीवा चरण रजताली द्यावादासा विसावा भक्ताविसावा आरति सा अभङ्ग्
    शिरिडि माझे पण्डरीपुर सा इबाबारमावर बाबारमावर इबाबारमावर शुद्दभक्ति चन्द्रभागा भावपुण्डलीकजागा पुण्डलीक
    जागा भावपुण्डलीकजागा याहो याहो अवघेजन। करूबाबान्सी वन्दन सा इसी वन्दन। करूबाबान्सी वन्दन॥ गणूह्मणे
    बाबासा इ। दावपाव माझे आयी पावमाझे आयी दावपाव माझेया वन्दीन चरण डोल्यानी पाहीन रूपतुझे। प्रेमे आलिङ्गन
    आनन्दे पूजिन भावे ओवालीन ह्मणे नामा॥ त्वमेव माता च पिता त्वमेव त्वमेव बन्धुश्च सखा त्वमेव त्वमेव विद्या
    द्रविणं त्वमेव त्वमेव सर्वं ममदेवदेव कायेन वाचा मनसेन्द्रियैर्वा बुद्ध्यात्मनावा प्रकृते स्वभावात्
    करोमि यद्यत्सकलं परस्मै नारायणायेति समर्पयामी अच्युतङ्केशवं रामनारायणं कृष्णदामोदरं वासुदेवं हरिं
    श्रीधरं माधवं गोपिकावल्लभं जानकीनायकं रामचन्द्रं भजे नाम स्मरणं हरेराम हरेराम रामराम हरे हरे हरेकृष्ण
    हरेकृष्ण कृष्ण कृष्ण हरे हरे ॥श्री गुरुदेवदत्त नमस्काराष्टकं अनन्ता तुलाते कसेरे स्तवावे अनन्ता तुलाते
    कसेरे नमावे अनन्तामुखाचा शिणे शेष गात नमस्कार साष्टाङ्ग श्रीसा इनाधा स्मरावेमनीत्वत्पदा नित्यभावे
    उरावेतरी भक्तिसाठी स्वभावे तरावे जगा तारुनीमाया ताता नमस्कार साष्टाङ्ग श्रीसा इनाधा वसे जोसदा दावया
    सन्तलीला दिसे आज्ञ लोका परी जोजनाला परी अन्तरी ज्ञानकैवल्य दाता नमस्कार साष्टाङ्ग श्रीसा इनाधा भरालधला
    जन्महा मान वाचा नरासार्धका साधनीभूत साचा धरूसा इ प्रेमा गलाया अहन्ता नमस्कार साष्टाङ्ग श्रीसा इनाधा
    धरावे करीसान अल्पज्ञ बाला करावे अह्माधन्यचुम्भो निगाला मुखीघाल प्रेमेखराग्रास अता नमस्कार साष्टाङ्ग
    श्रीसा इनाधा सुरा दीक ज्याञ्च्या पदावन्दिताति शुकादीक जाते समानत्वदेती प्रयागादि तीर्धे पदीनम्रहोता
    नमस्कार साष्टाङ्ग श्रीसा इनाधा तुझ्याज्यापदा पाहता गोपबाली सदारङ्गली चित्स्वरूपी मिलाली करीरासक्रीडा
    सवे कृष्णनाधा नमस्कार साष्टाङ्ग श्रीसा इनाधा तुलामागतो मागणे एकध्यावे कराजोडितो दीन अत्यन्त भावे भवीमोह
    नीराज हातारि आता नमस्कार साष्टाङ्ग श्रीसा इ दिगम्बरा अक्षयरूप अवतारा । सर्वहि व्यापक तू श्रुतिसारा
    अनसूयात्रिकुमारा बाबाये ईबा काशीस्नान जप प्रतिदिवसी कॊल्हापुर भिक्षेसी निर्मल नदि तुङ्गा जलप्रासी
    निद्रामाहुरदेशी ऐसा ये यीबा झोलीलोम्बतसे वामकरी त्रिशूल ढमरूधारि भक्तावरदसदा सुखकारी देशील मुक्तीचारी
    ऐसा ये यीबा पायिपादुका जपमाला कमण्डलूमृगछाला धारण करिशीबा नागजटा मुकुट शोभतोमाथा ऐसा ये यीबा तत्पर
    तुझ्याया जेध्यानी अक्षयत्वाञ्चेसदनी लक्ष्मीवासकरी दिनरजनी रक्षसिसङ्कट वारुनि ऐसा ये यीबा यापरिध्यान
    तुझे गुरुराया दृश्यकरी नयनाया पूर्णानन्द सुखे हीकाया लाविसिहरि गुणगाया ऐसा ये यीबा सा इ दिगम्बर अक्षय
    रूप अवतारा सर्वहिव्यापक तू श्रुतिसारा अनसूयात्रि कुमारा बाबाये इ महिमा स्तोत्रं सदासत्स्वरूपं चिदानन्दकन्दं
    जगत्सम्भवस्धान संहार हेतुं स्वभक्तेच्छया मानुषं दर्शयन्तं नमामीश्वरं सद्गुरुं सा इनाथं भवध्वान्त विध्वंस
    मार्ताण्डमीड्यं मनोवागतीतं मुनिर् ध्यान गम्यं जगद्व्यापकं निर्मलं निर्गुणं त्वां नमामीश्वरं सद्गुरुं
    सा इनाथं भवाम्भोदि मग्नार्धितानां जनानां स्वपादाश्रितानां स्वभक्ति प्रियाणां समुद्दारणार्धं कलौ सम्भवन्तं
    नमामीश्वरं सद्गुरुं सा इनाथं सदानिम्ब वृक्षस्यमुलाधि वासात् सुधास्राविणं तिक्त मप्य प्रियन्तं तरुं
    कल्प वृक्षाधिकं साधयन्तं नमामीश्वरं सद्गुरुं सा इनाथं सदाकल्प वृक्षस्य तस्याधिमूले भवद्भावबुद्ध्या
    सपर्यादिसेवां नृणां कुर्वतां भुक्ति मुक्ति प्रदन्तं नमामीश्वरं सद्गुरुं सा इनाथं अनेका शृता तर्क्य
    लीला विलासै समा विष्कृतेशान भास्वत्र्पभावं अहम्भावहीनं प्रसन्नात्मभावं नमामीश्वरं सद्गुरुं सा इनाथं
    सतां विश्रमाराम मेवाभिरामं सदासज्जनै संस्तुतं सन्नमद्भि जनामोददं भक्त भद्र प्रदन्तं नमामीश्वरं सद्गुरुं
    सा इनाथं अजन्माद्यमेकं परम्ब्रह्म साक्षात् स्वयं सम्भवं राममेवावतीर्णं भवद्दर्शनात्सम्पुनीत प्रभोहं
    नमामीश्वरं सद्गुरुं सा इश कृपानिधे खिलनृणां सर्वार्धसिद्दिप्रद युष्मत्पादरज प्रभावमतुलं धातापिवक्ताक्षम
    सद्भक्त्याश्शरणं कृताञ्जलिपुट सम्प्राप्तितोस्मिन् प्रभो श्रीमत्सा इपरेश पाद कमलान् नान्यच्चरण्यम्मम
    सा इरूपधर राघवोत्तमं भक्तकाम विबुध द्रुमं प्रभुं माययोपहत चित्त शुद्धये चिन्तयाम्यह महर्निशं मुदा
    शरत्सुधांशं प्रतिमं प्रकाशं कृपातपत्रं तवसा इनाथ त्वदीयपादाब्ज समाश्रितानां स्वच्छाययाताप मपाकरोतु
    उपासनादैवत सा इनाथ स्मवैर्म योपासनि नास्तुतस्त्वं रमेन्मनोमे तवपादयुग्मे भ्रुङ्गो यदाब्जे मकरन्दलुब्ध
    अनेकजन्मार्जित पापसङ्क्षयो भवेद्भवत्पाद सरोज दर्शनात् क्षमस्व सर्वानपराध पुञ्जकान् प्रसीद सा इश सद्गुरो
    दयानिधे श्रीसा इनाथ चरणामृत पूर्णचित्ता तत्पाद सेवनरता स्सत तञ्च भक्त्या संसारजन्य दुरितौघ विनिर्ग
    तास्ते कैवल्य धाम परमं समवाप्नुवन्ति स्तोत्रमे तत्पठेद्भक्त्या योन्नरस्तन्मनासदा सद्गुरो इनाथस्य कृपापात्रं
    भवेद्भवं गुरु प्रसाद याचनादशकं रुसोममप्रियाम्बिका मजवरीपिताहीरुसो रुसोममप्रियाङ्गना प्रियसुतात्मजाहीरुसो
    रुसोभगिनबन्धु ही स्वशुर सासुबायि रुसो नदत्त गुरुसा इमा मझवरी कधीही रुसो पुसोन सुनभायित्या मजन भ्रातॄजाया
    पुसो पुसोन प्रियसोयरे प्रियसगेनज्ञाती पुसो पुसो सुहृदनासख स्वजननाप्त बन्धू पुसो परीन गुरुसा इमा मझवरी
    कधीही रुसो पुसोन अबलामुले तरुण वृद्दही नापुसो पुसोन गुरुथाकुटे मजन दोरसाने पुसो पुसोनचबले बुरे सुजनसादुहीना
    पुसो परीन गुरुसा इमा मझवरी कधीही रुसो दुसोचतुरत्त्ववित् विबुध प्राज्ञज्ञानीरुसो रुसो हि विदु स्त्रीया
    कुशल पण्डिताहीरुसो रुसोमहिपतीयती भजकतापसीही रुसो नदत्त गुरुसा इमा मझवरी कधीही रुसो रुसोकवि ऋषि मुनी
    अनघसिद्दयोगीरुसो रुसोहि गृहदेवता तिकुल ग्रामदेवी रुसो रुसो खलपिशाच्चही मलीनडाकिनी हीरुसो नदत्त गुरुसा
    इमा मझवरी कधीही रुसो रुसोमृगखगकृमी अखिलजीवजन्तूरुसो रुसो विटपप्रस्तरा अचल आपगाब्धीरुसो रुसोखपवनाग्निवार्
    अवनिपञ्चतत्त्वेरुसो नदत्त गुरुसा इमा मझवरी कधीही रुसो रुसो विमलकिन्नरा अमलयक्षिणीहीरुसो रुसोशशिखगादिही
    गगनि तारकाहीरुसो रुसो अमरराजही अदय धर्मराजा रुसो नदत्त गुरुसा इमा मझवरी कधीही रुसो रुसो मन सरस्वती
    चपलचित्त तीहीरुसो रुसो वपुदि शाखिला कठिन कालतो हीरुसो रुसोसकल विश्वहीमयितु ब्रह्मगोलंरुसो नदत्त गुरुसा
    इमा मझवरी कधीही रुसो विमूड ह्मणुनि हसो मजनमत्सराही रुसो पदाभिरुचि उलसो जननकर्धमीनाफसो नदुर्ग दृतिचा
    धसो अशिव भाव मागेखसो प्रपञ्चि मनहेरुसो दृडवि रक्तिचित्ती ठसो कुणाचि घृणान सोनच स्पृहक शाची असो सदैव
    हृदया वसो मनसिद्यानि सा इवसो पदीप्रणयवोरसो निखिल दृश्य बाबादिसो नदत्त गुरुसा इमा उपरियाचनेला रुसो
    मन्त्र पुष्पं हरि ॐ यज्ञेन यज्ञमयजन्तदेवा स्तानिधर्माणि प्रधमान्यासन् । तेहनाकं महिमान स्सचन्त यत्रपूर्वे
    साध्या स्सन्ति देवा । ॐ राजाधिराजाय पसह्यसाहिने नमोवयं वै श्रवणाय कुर्महे समेकामान् कामकामाय मह्यं
    कामेश्वरो वैश्रवणो ददातु कुबेराय वैश्रवणाया महाराजायनम ॐ स्वस्ती साम्राज्यं भोज्यं स्वाराज्यं वैराज्यं
    पारमेष्ट्यंराज्यं महाराज्य माधिपत्यमयं समन्तपर्या ईश्या स्सार्वभौम स्सार्वा युषान् तादापदार्दात् प्रुधिव्यैसमुद्र
    पर्यान्ताया एकराल्लिति तदप्येष श्लोकोबिगीतो मरुत परिवेष्टोरो मरुत्त स्यावसन् ग्रुहे आविक्षितस्यकाम
    प्रेर् विश्वेदेवासभासद इति श्री नारायणवासुदेव सच्चिदानन्द सद्गुरु सा इनाध् महाराज् कि जै करचरण कृतं
    वाक्काय जङ्कर्मजंवा श्रवणनयनजं वामानसंवा पराधं विदित मविदितं वा सर्वमेतत् क्षमस्व जयजय करुणाब्धे श्रीप्रभोसा
    इनाध श्री सच्चिदानन्द सद्गुरु सा इनाध् महराज् कि जै राजाधिराज योगिराज परब्रह्म श्रीसा इनाधामहराज्
    श्री सच्चिदानन्द सद्गुरु सा
