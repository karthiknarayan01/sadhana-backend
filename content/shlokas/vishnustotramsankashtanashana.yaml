id: vishnustotramsankashtanashana
category: stotram
name:
  english: vishnustotramsankashtanashana
  devanagari: विष्णुस्तोत्रम्सन्कष्टनाशन
content:
  english: namo matsyakurmadinanasvarupaih sada bhaktakaryodyatayartihantre | vidhatradi sargasthitidhvamsakartre
    gadashamkhapadmarihastaya te'stu || 2|| ramavallabhaya'suranam nihantre bhujamgariyanaya pitambaraya
    | makhadikriyapakakartre vikartre sharanyaya tasmai natah smo natah smah || 3|| namo daityasantapitamartyaduhkhacaladhvamsadambholaye
    vishnave te | bhujamgeshatalpeshayanaya'rkacandradvinetraya tasmai natah smo natah smah || 4|| narada
    uvaca | samkashtanashanam nama stotrametatpathennarah | sa kadacinna samkashtaih pidyate kripaya hareh
    || 5|| || iti padmapurane prithunaradasamvade sankashtanashanam nama vishnustotram sampurnam ||
  devanagari: नमो मत्स्यकूर्मादिनानास्वरूपैः सदा भक्तकार्योद्यतायार्तिहन्त्रे । विधात्रादि सर्गस्थितिध्वंसकर्त्रे
    गदाशंखपद्मारिहस्ताय तेऽस्तु ॥ २॥ रमावल्लभायाऽसुराणां निहन्त्रे भुजंगारियानाय पीताम्बराय । मखादिक्रियापाककर्त्रे
    विकर्त्रे शरण्याय तस्मै नताः स्मो नताः स्मः ॥ ३॥ नमो दैत्यसन्तापितामर्त्यदुःखाचलध्वंसदंभोलये विष्णवे
    ते । भुजंगेशतल्पेशयानायाऽर्कचन्द्रद्विनेत्राय तस्मै नताः स्मो नताः स्मः ॥ ४॥ नारद उवाच । संकष्टनाशनं
    नाम स्तोत्रमेतत्पठेन्नरः । स कदाचिन्न संकष्टैः पीड्यते कृपया हरेः ॥ ५॥ ॥ इति पद्मपुराणे पृथुनारदसंवादे
    सङ्कष्टनाशनं नाम विष्णुस्तोत्रं सम्पूर्णम् ॥
meaning: {}
