    ॥ ९७॥ ॐ ऐं सौः अच्युतेष्टा च ॐ श्रीं क्लीं सः च्युतालका । ॐ श्रीं ऐं चर्मवस्त्रा च ॐ श्रीं चण्यकराजिता
