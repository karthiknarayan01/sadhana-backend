    हृदयँ हरष अति पावा ॥ पुनि चरननि मेले सुत चारी। राम देखि मुनि देह बिसारी ॥ भे मगन देखत मुख सोभा। जनु
    चकोर पूरन ससि लोभा ॥ तब मन हरषि बचन कह र् । मुनि अस कृपा न कीन्हिहु क् ॥ केहि कारन आगमन तुम्हारा।
    कहहु सो करत न लावुँ बारा ॥ असुर समूह सतावहिं मोही। मै जाचन आयुँ नृप तोही ॥ अनुज समेत देहु रघुनाथा।
    निसिचर बध मैं होब सनाथा ॥ दो देहु भूप मन हरषित तजहु मोह अग्यान। धर्म सुजस प्रभु तुम्ह कौं इन्ह कहँ
    अति कल्यान ॥ ॥ सुनि राजा अति अप्रिय बानी। हृदय कम्प मुख दुति कुमुलानी ॥ चौथेम्पन पायुँ सुत चारी। बिप्र
    बचन नहिं कहेहु बिचारी ॥ मागहु भूमि धेनु धन कोसा। सर्बस देउँ आजु सहरोसा ॥ देह प्रान तें प्रिय कछु नाही।
    सौ मुनि देउँ निमिष एक माही ॥ सब सुत प्रिय मोहि प्रान कि नाईं। राम देत नहिं बनि गोसाई ॥ कहँ निसिचर
    अति घोर कठोरा। कहँ सुन्दर सुत परम किसोरा ॥ सुनि नृप गिरा प्रेम रस सानी। हृदयँ हरष माना मुनि ग्यानी
    ॥ तब बसिष्ट बहु निधि समुझावा। नृप सन्देह नास कहँ पावा ॥ अति आदर दौ तनय बोलाए। हृदयँ लाइ बहु भाँति
    सिखाए ॥ मेरे प्रान नाथ सुत दोऊ। तुम्ह मुनि पिता आन नहिं कोऊ ॥ दो सौम्पे भूप रिषिहि सुत बहु बिधि देइ
    असीस। जननी भवन गे प्रभु चले नाइ पद सीस ॥ पुरुषसिंह दौ बीर हरषि चले मुनि भय हरन ॥ कृपासिन्धु मतिधीर
    अखिल बिस्व कारन करन ॥ अरुन नयन उर बाहु बिसाला। नील जलज तनु स्याम तमाला ॥ कटि पट पीत कसें बर भाथा।
    रुचिर चाप सायक दुहुँ हाथा ॥ स्याम गौर सुन्दर दौ भाई। बिस्बामित्र महानिधि पाई ॥ प्रभु ब्रह्मन्यदेव
    मै जाना। मोहि निति पिता तजेहु भगवाना ॥ चले जात मुनि दीन्हि दिखाई। सुनि ताड़का क्रोध करि धाई ॥ एकहिं
    बान प्रान हरि लीन्हा। दीन जानि तेहि निज पद दीन्हा ॥ तब रिषि निज नाथहि जियँ चीन्ही। बिद्यानिधि कहुँ
    बिद्या दीन्ही ॥ जाते लाग न छुधा पिपासा। अतुलित बल तनु तेज प्रकासा ॥ दो आयुष सब समर्पि कै प्रभु निज
    आश्रम आनि। कन्द मूल फल भोजन दीन्ह भगति हित जानि ॥ ॥ प्रात कहा मुनि सन रघुराई। निर्भय जग्य करहु तुम्ह
    जाई ॥ होम करन लागे मुनि झारी। आपु रहे मख कीं रखवारी ॥ सुनि मारीच निसाचर क्रोही। लै सहाय धावा मुनिद्रोही
    ॥ बिनु फर बान राम तेहि मारा। सत जोजन गा सागर पारा ॥ पावक सर सुबाहु पुनि मारा। अनुज निसाचर कटकु सँघारा
    ॥ मारि असुर द्विज निर्मयकारी। अस्तुति करहिं देव मुनि झारी ॥ तहँ पुनि कछुक दिवस रघुराया। रहे कीन्हि
    बिप्रन्ह पर दाया ॥ भगति हेतु बहु कथा पुराना। कहे बिप्र जद्यपि प्रभु जाना ॥ तब मुनि सादर कहा बुझाई।
    चरित एक प्रभु देखिअ जाई ॥ धनुषजग्य मुनि रघुकुल नाथा। हरषि चले मुनिबर के साथा ॥ आश्रम एक दीख मग माहीं।
    खग मृग जीव जन्तु तहँ नाहीम् ॥ पूछा मुनिहि सिला प्रभु देखी। सकल कथा मुनि कहा बिसेषी ॥ दो गौतम नारि
    श्राप बस उपल देह धरि धीर। चरन कमल रज चाहति कृपा करहु रघुबीर ॥ परसत पद पावन सोक नसावन प्रगट भी तपपुञ्ज
    सही। देखत रघुनायक जन सुख दायक सनमुख होइ कर जोरि रही ॥ अति प्रेम अधीरा पुलक सरीरा मुख नहिं आवि बचन
    कही। अतिसय बड़भागी चरनन्हि लागी जुगल नयन जलधार बही ॥ धीरजु मन कीन्हा प्रभु कहुँ चीन्हा रघुपति कृपाँ
    भगति पाई। अति निर्मल बानीं अस्तुति ठानी ग्यानगम्य जय रघुराई ॥ मै नारि अपावन प्रभु जग पावन रावन रिपु
    जन सुखदाई। राजीव बिलोचन भव भय मोचन पाहि पाहि सरनहिं आई ॥ मुनि श्राप जो दीन्हा अति भल कीन्हा परम अनुग्रह
    मैं माना। देखेउँ भरि लोचन हरि भवमोचन इहि लाभ सङ्कर जाना ॥ बिनती प्रभु मोरी मैं मति भोरी नाथ न मागुँ
    बर आना। पद कमल परागा रस अनुरागा मम मन मधुप करै पाना ॥ जेहिं पद सुरसरिता परम पुनीता प्रगट भी सिव सीस
    धरी। सोइ पद पङ्कज जेहि पूजत अज मम सिर धरेउ कृपाल हरी ॥ एहि भाँति सिधारी गौतम नारी बार बार हरि चरन
    परी। जो अति मन भावा सो बरु पावा गै पतिलोक अनन्द भरी ॥ दो अस प्रभु दीनबन्धु हरि कारन रहित दयाल। तुलसिदास
    सठ तेहि भजु छाड़इ कपट जञ्जाल ॥ सातवाँ विश्राम चले राम लछिमन मुनि सङ्गा। गे जहाँ जग पावनि गङ्गा ॥ गाधिसूनु
    सब कथा सुनाई। जेहि प्रकार सुरसरि महि आई ॥ तब प्रभु रिषिन्ह समेत नहाए। बिबिध दान महिदेवन्हि पाए ॥ हरषि
    चले मुनि बृन्द सहाया। बेगि बिदेह नगर निअराया ॥ पुर रम्यता राम जब देखी। हरषे अनुज समेत बिसेषी ॥ बापीं
    कूप सरित सर नाना। सलिल सुधासम मनि सोपाना ॥ गुञ्जत मञ्जु मत्त रस भृङ्गा। कूजत कल बहुबरन बिहङ्गा ॥ बरन
    बरन बिकसे बन जाता। त्रिबिध समीर सदा सुखदाता ॥ दो सुमन बाटिका बाग बन बिपुल बिहङ्ग निवास। फूलत फलत सुपल्लवत
    सोहत पुर चहुँ पास ॥ ॥ बनि न बरनत नगर निकाई। जहाँ जाइ मन तहँइँ लोभाई ॥ चारु बजारु बिचित्र अँबारी। मनिमय
    बिधि जनु स्वकर सँवारी ॥ धनिक बनिक बर धनद समाना। बैठ सकल बस्तु लै नाना ॥ चौहट सुन्दर गलीं सुहाई। सन्तत
    रहहिं सुगन्ध सिञ्चाई ॥ मङ्गलमय मन्दिर सब केरें। चित्रित जनु रतिनाथ चितेरेम् ॥ पुर नर नारि सुभग सुचि
    सन्ता। धरमसील ग्यानी गुनवन्ता ॥ अति अनूप जहँ जनक निवासू। बिथकहिं बिबुध बिलोकि बिलासू ॥ होत चकित चित
    कोट बिलोकी। सकल भुवन सोभा जनु रोकी ॥ दो धवल धाम मनि पुरट पट सुघटित नाना भाँति। सिय निवास सुन्दर सदन
    सोभा किमि कहि जाति ॥ ॥ सुभग द्वार सब कुलिस कपाटा। भूप भीर नट मागध भाटा ॥ बनी बिसाल बाजि गज साला। हय
    गय रथ सङ्कुल सब काला ॥ सूर सचिव सेनप बहुतेरे। नृपगृह सरिस सदन सब केरे ॥ पुर बाहेर सर सारित समीपा।
    उतरे जहँ तहँ बिपुल महीपा ॥ देखि अनूप एक अँवराई। सब सुपास सब भाँति सुहाई ॥ कौसिक कहेउ मोर मनु माना।
    इहाँ रहिअ रघुबीर सुजाना ॥ भलेहिं नाथ कहि कृपानिकेता। उतरे तहँ मुनिबृन्द समेता ॥ बिस्वामित्र महामुनि
    आए। समाचार मिथिलापति पाए ॥ दो सङ्ग सचिव सुचि भूरि भट भूसुर बर गुर ग्याति। चले मिलन मुनिनायकहि मुदित
    राउ एहि भाँति ॥ ॥ कीन्ह प्रनामु चरन धरि माथा। दीन्हि असीस मुदित मुनिनाथा ॥ बिप्रबृन्द सब सादर बन्दे।
    जानि भाग्य बड़ राउ अनन्दे ॥ कुसल प्रस्न कहि बारहिं बारा। बिस्वामित्र नृपहि बैठारा ॥ तेहि अवसर आए दौ
    भाई। गे रहे देखन फुलवाई ॥ स्याम गौर मृदु बयस किसोरा। लोचन सुखद बिस्व चित चोरा ॥ उठे सकल जब रघुपति
    आए। बिस्वामित्र निकट बैठाए ॥ भे सब सुखी देखि दौ भ्राता। बारि बिलोचन पुलकित गाता ॥ मूरति मधुर मनोहर
    देखी। भयु बिदेहु बिदेहु बिसेषी ॥ दो प्रेम मगन मनु जानि नृपु करि बिबेकु धरि धीर। बोलेउ मुनि पद नाइ
    सिरु गदगद गिरा गभीर ॥ ॥ कहहु नाथ सुन्दर दौ बालक। मुनिकुल तिलक कि नृपकुल पालक ॥ ब्रह्म जो निगम नेति
    कहि गावा। उभय बेष धरि की सोइ आवा ॥ सहज बिरागरुप मनु मोरा। थकित होत जिमि चन्द चकोरा ॥ ताते प्रभु पूछुँ
    सतिभ् । कहहु नाथ जनि करहु दुर् ॥ इन्हहि बिलोकत अति अनुरागा। बरबस ब्रह्मसुखहि मन त्यागा ॥ कह मुनि बिहसि
    कहेहु नृप नीका। बचन तुम्हार न होइ अलीका ॥ ए प्रिय सबहि जहाँ लगि प्रानी। मन मुसुकाहिं रामु सुनि बानी
    ॥ रघुकुल मनि दसरथ के जाए। मम हित लागि नरेस पठाए ॥ दो रामु लखनु दौ बन्धुबर रूप सील बल धाम। मख राखेउ
    सबु साखि जगु जिते असुर सङ्ग्राम ॥ ॥ मुनि तव चरन देखि कह र् । कहि न सकुँ निज पुन्य प्राभ् ॥ सुन्दर
    स्याम गौर दौ भ्राता। आनँदहू के आनँद दाता ॥ इन्ह कै प्रीति परसपर पावनि। कहि न जाइ मन भाव सुहावनि ॥
    सुनहु नाथ कह मुदित बिदेहू। ब्रह्म जीव इव सहज सनेहू ॥ पुनि पुनि प्रभुहि चितव नरनाहू। पुलक गात उर अधिक
    उछाहू ॥ म्रुनिहि प्रसंसि नाइ पद सीसू। चलेउ लवाइ नगर अवनीसू ॥ सुन्दर सदनु सुखद सब काला। तहाँ बासु लै
    दीन्ह भुआला ॥ करि पूजा सब बिधि सेवकाई। गयु राउ गृह बिदा कराई ॥ दो रिषय सङ्ग रघुबंस मनि करि भोजनु बिश्रामु।
    बैठे प्रभु भ्राता सहित दिवसु रहा भरि जामु ॥ ॥ लखन हृदयँ लालसा बिसेषी। जाइ जनकपुर आइअ देखी ॥ प्रभु
    भय बहुरि मुनिहि सकुचाहीं। प्रगट न कहहिं मनहिं मुसुकाहीम् ॥ राम अनुज मन की गति जानी। भगत बछलता हिंयँ
    हुलसानी ॥ परम बिनीत सकुचि मुसुकाई। बोले गुर अनुसासन पाई ॥ नाथ लखनु पुरु देखन चहहीं। प्रभु सकोच डर
    प्रगट न कहहीम् ॥ जौं राउर आयसु मैं पावौं। नगर देखाइ तुरत लै आवौ ॥ सुनि मुनीसु कह बचन सप्रीती। कस न
    राम तुम्ह राखहु नीती ॥ धरम सेतु पालक तुम्ह ताता। प्रेम बिबस सेवक सुखदाता ॥ दो जाइ देखी आवहु नगरु सुख
    निधान दौ भाइ। करहु सुफल सब के नयन सुन्दर बदन देखाइ ॥ आठवाँ विश्राम नवान्हपारायण दूसरा विश्राम मुनि
    पद कमल बन्दि दौ भ्राता। चले लोक लोचन सुख दाता ॥ बालक बृन्दि देखि अति सोभा। लगे सङ्ग लोचन मनु लोभा
    ॥ पीत बसन परिकर कटि भाथा। चारु चाप सर सोहत हाथा ॥ तन अनुहरत सुचन्दन खोरी। स्यामल गौर मनोहर जोरी ॥
    केहरि कन्धर बाहु बिसाला। उर अति रुचिर नागमनि माला ॥ सुभग सोन सरसीरुह लोचन। बदन मयङ्क तापत्रय मोचन
    ॥ कानन्हि कनक फूल छबि देहीं। चितवत चितहि चोरि जनु लेहीम् ॥ चितवनि चारु भृकुटि बर बाँकी। तिलक रेखा
    सोभा जनु चाँकी ॥ दो रुचिर चौतनीं सुभग सिर मेचक कुञ्चित केस। नख सिख सुन्दर बन्धु दौ सोभा सकल सुदेस
    ॥ ॥ देखन नगरु भूपसुत आए। समाचार पुरबासिंह पाए ॥ धाए धाम काम सब त्यागी। मनहु रङ्क निधि लूटन लागी ॥
    निरखि सहज सुन्दर दौ भाई। होहिं सुखी लोचन फल पाई ॥ जुबतीं भवन झरोखन्हि लागीं। निरखहिं राम रूप अनुरागीम्
    ॥ कहहिं परसपर बचन सप्रीती। सखि इन्ह कोटि काम छबि जीती ॥ सुर नर असुर नाग मुनि माहीं। सोभा असि कहुँ
    सुनिअति नाहीम् ॥ बिष्नु चारि भुज बिघि मुख चारी। बिकट बेष मुख पञ्च पुरारी ॥ अपर देउ अस कौ न आही। यह
    छबि सखि पटतरिअ जाही ॥ दो बय किसोर सुषमा सदन स्याम गौर सुख धाम । अङ्ग अङ्ग पर वारिअहिं कोटि कोटि सत
    काम ॥ ॥ कहहु सखी अस को तनुधारी। जो न मोह यह रूप निहारी ॥ कौ सप्रेम बोली मृदु बानी। जो मैं सुना सो
    सुनहु सयानी ॥ ए दोऊ दसरथ के ढोटा। बाल मरालन्हि के कल जोटा ॥ मुनि कौसिक मख के रखवारे। जिन्ह रन अजिर
    निसाचर मारे ॥ स्याम गात कल कञ्ज बिलोचन। जो मारीच सुभुज मदु मोचन ॥ कौसल्या सुत सो सुख खानी। नामु रामु
    धनु सायक पानी ॥ गौर किसोर बेषु बर काछें। कर सर चाप राम के पाछेम् ॥ लछिमनु नामु राम लघु भ्राता। सुनु
    सखि तासु सुमित्रा माता ॥ दो बिप्रकाजु करि बन्धु दौ मग मुनिबधू उधारि। आए देखन चापमख सुनि हरषीं सब नारि
    ॥ ॥ देखि राम छबि कौ एक कही। जोगु जानकिहि यह बरु अही ॥ जौ सखि इन्हहि देख नरनाहू। पन परिहरि हठि करि
    बिबाहू ॥ कौ कह ए भूपति पहिचाने। मुनि समेत सादर सनमाने ॥ सखि परन्तु पनु राउ न तजी। बिधि बस हठि अबिबेकहि
    भजी ॥ कौ कह जौं भल अहि बिधाता। सब कहँ सुनिअ उचित फलदाता ॥ तौ जानकिहि मिलिहि बरु एहू। नाहिन आलि इहाँ
    सन्देहू ॥ जौ बिधि बस अस बनै सँजोगू। तौ कृतकृत्य होइ सब लोगू ॥ सखि हमरें आरति अति तातें। कबहुँक ए आवहिं
    एहि नातेम् ॥ दो नाहिं त हम कहुँ सुनहु सखि इन्ह कर दरसनु दूरि। यह सङ्घटु तब होइ जब पुन्य पुराकृत भूरि
