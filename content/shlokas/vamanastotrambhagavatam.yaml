id: vamanastotrambhagavatam
category: stotram
name:
  english: vamanastotrambhagavatam
  devanagari: वामनस्तोत्रम्भागवतम्
content:
  english: vamanastotram shri ganeshaya namah | shriaditiruvaca | yajnesha yajnapurushacyuta tirthapada
    tirthashravah shravanamangalanamadheya | apannalokavrijinopashamodaya''dya sham nah kridhisha bhagavannasi
    dinanathah || 1|| vishvaya vishvabhavanasthitisamyamaya svairam grihitapurushaktigunaya bhumne | svasthaya
    shashvadupabrimhitapurnabodha
  devanagari: वामनस्तोत्रम् श्री गणेशाय नमः । श्रीअदितिरुवाच । यज्ञेश यज्ञपुरुषाच्युत तीर्थपाद तीर्थश्रवः
    श्रवणमङ्गलनामधेय । आपन्नलोकवृजिनोपशमोदयाऽऽद्य शं नः कृधीश भगवन्नसि दीननाथः ॥ १॥ विश्वाय विश्वभवनस्थितिसंयमाय
    स्वैरं गृहीतपुरुशक्तिगुणाय भूम्ने । स्वस्थाय शश्वदुपबृंहितपूर्णबोध
meaning: {}
