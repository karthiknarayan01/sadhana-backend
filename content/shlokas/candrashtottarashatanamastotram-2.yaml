id: candrashtottarashatanamastotram-2
category: stotram
name:
  english: candrashtottarashatanamastotram 2
  devanagari: चन्द्राष्टोत्तरशतनामस्तोत्रम् २
content:
  english: ringarabhavakarshanah | muktidvaram shivatma ca tithikarta kalanidhih || 7|| oshadhipatirabjashca
    somo jaivatrikah shucih | mriganko glauh punyanama citrakarma surarcitah || 8|| rohinisho budhapita
    atreyah punyakirtakah | niramayo mantrarupah satyo raja dhanapradah || 9|| saundaryadayako data rahugrasaparanmukhah
    | sharanyah parvatibhalabhushanam bhagavanapi || 10|| punyaranyapriyah purnah purnamandalamanditah
    | hasyarupo hasyakarta shuddhah shuddhasvarupakah|| 11|| sharatkalaparipritah sharadah kumudapriyah
    | dyumanirdakshajamata yakshmarih papamocanah || 12|| induh kalankanashi ca suryasangamapanditah |
    suryodbhutah suryagatah suryapriyaparahparah || 13|| snigdharupah prasannashca muktakarpurasundarah
    | jagadahladasandarsho jyotih shastrapramanakah || 14 || suryabhavaduhkhaharta vanaspatigatah kriti
    | yajnarupo yajnabhagi vaidyo vidyavisharadah || 15|| rashmikotirdiptikari gaurabhanuriti dvija |
    namnamashtottarashatam candrasya papanashanam || 16|| candrodaye pathedyastu sa tu saundaryavan bhavet
    | paurnamasyam pathedetam stavam divyam visheshatah || 17|| stavasyasya prasadena trisandhyapathitasya
    ca | sadaprasadastishthanti brahmanashca dvijottama || 18|| shraddhe capi pathedetam stavam piyusharupinam
    | tattu shraddhamanantanca kalanathaprasadatah || 19|| duhsvapnanashanam punyam dahajvaravinashanam
    | brahmanadyah patheyustu strishudrah sha
  devanagari: ृङ्गारभावकर्षणः । मुक्तिद्वारं शिवात्मा च तिथिकर्ता कलानिधिः ॥ ७॥ ओषधीपतिरब्जश्च सोमो जैवातृकः
    शुचिः । मृगाङ्को ग्लौः पुण्यनामा चित्रकर्मा सुरार्चितः ॥ ८॥ रोहिणीशो बुधपिता आत्रेयः पुण्यकीर्तकः
    । निरामयो मन्त्ररूपः सत्यो राजा धनप्रदः ॥ ९॥ सौन्दर्यदायको दाता राहुग्रासपराङ्मुखः । शरण्यः पार्वतीभालभूषणं
    भगवानपि ॥ १०॥ पुण्यारण्यप्रियः पूर्णः पूर्णमण्डलमण्डितः । हास्यरूपो हास्यकर्ता शुद्धः शुद्धस्वरूपकः॥
    ११॥ शरत्कालपरिप्रीतः शारदः कुमुदप्रियः । द्युमणिर्दक्षजामाता यक्ष्मारिः पापमोचनः ॥ १२॥ इन्दुः कलङ्कनाशी
    च सूर्यसङ्गमपण्डितः । सूर्योद्भूतः सूर्यगतः सूर्यप्रियपरःपरः ॥ १३॥ स्निग्धरूपः प्रसन्नश्च मुक्ताकर्पूरसुन्दरः
    । जगदाह्लादसन्दर्शो ज्योतिः शास्त्रप्रमाणकः ॥ १४ ॥ सूर्याभावदुःखहर्ता वनस्पतिगतः कृती । यज्ञरूपो यज्ञभागी
    वैद्यो विद्याविशारदः ॥ १५॥ रश्मिकोटिर्दीप्तिकारी गौरभानुरिति द्विज । नाम्नामष्टोत्तरशतं चन्द्रस्य
    पापनाशनम् ॥ १६॥ चन्द्रोदये पठेद्यस्तु स तु सौन्दर्यवान् भवेत् । पौर्णमास्यां पठेदेतं स्तवं दिव्यं
    विशेषतः ॥ १७॥ स्तवस्यास्य प्रसादेन त्रिसन्ध्यापठितस्य च । सदाप्रसादास्तिष्ठन्ति ब्राह्मणाश्च द्विजोत्तम
    ॥ १८॥ श्राद्धे चापि पठेदेतं स्तवं पीयूषरूपिणम् । तत्तु श्राद्धमनन्तञ्च कलानाथप्रसादतः ॥ १९॥ दुःस्वप्ननाशनं
    पुण्यं दाहज्वरविनाशनम् । ब्राह्मणाद्याः पठेयुस्तु स्त्रीशूद्राः श
