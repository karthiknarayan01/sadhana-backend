id: cakravartishvarastotram
category: stotram
name:
  english: cakravartishvarastotram
  devanagari: चक्रवर्तीश्वरस्तोत्रम्
content:
  english: bhaktanam vibhavaprado bhavaharo vijnanado duhkhaha bhakte pritikaro hyasheshavishayavyamohabhicchankarah
    | nityanandapade nije niravadhau samsthapako nirmalah sarveshamiha sham tanotu bhagavan shricakravartishvarah
    || 1|| dharmaglaniraho yada sukritinam kashtam ca dushtairmahat kamakrodhamadadikashca nitaram sampidayanti
    kshitau | tasminyah sa hi bhaktahridgatavibhurdharmaya cavatarat sarveshamiha sham tanotu bhagavan
    shricakravartishvarah || 2|| yo mayarahitashcakasti satatam brahmeti vedastutah yasmin karyamidam
    vibhati sakalam rajjau yatha'herbhramah | sarvasyahamitiha ca smritiriyam vibhrajate'harnisham sarveshamiha
    sham tanotu bhagavan shricakravartishvarah || 3|| iti shrimat paramahamsaparivrajakacarya sadguru
    bhagavan shridharasvamimaharajaviracitam shricakravartishvarastotram sampurnam | ashvayuja shuddha
    12
  devanagari: भक्तानां विभवप्रदो भवहरो विज्ञानदो दुःखहा भक्ते प्रीतिकरो ह्यशेषविषयव्यामोहभिच्छङ्करः ।
    नित्यानन्दपदे निजे निरवधौ संस्थापको निर्मलः सर्वेषामिह शं तनोतु भगवान् श्रीचक्रवर्तीश्वरः ॥ १॥ धर्मग्लानिरहो
    यदा सुकृतिनां कष्टं च दुष्टैर्महत् कामक्रोधमदादिकाश्च नितरां सम्पीडयन्ति क्षितौ । तस्मिन्यः स हि भक्तहृद्गतविभुर्धर्माय
    चावातरत् सर्वेषामिह शं तनोतु भगवान् श्रीचक्रवर्तीश्वरः ॥ २॥ यो मायारहितश्चकास्ति सततं ब्रह्मेति वेदस्तुतः
    यस्मिन् कार्यमिदं विभाति सकलं रज्जौ यथाऽहेर्भ्रमः । सर्वस्याहमितीह च स्मृतिरियं विभ्राजतेऽहर्निशं
    सर्वेषामिह शं तनोतु भगवान् श्रीचक्रवर्तीश्वरः ॥ ३॥ इति श्रीमत् परमहंसपरिव्राजकाचार्य सद्गुरु भगवान्
    श्रीधरस्वामीमहाराजविरचितं श्रीचक्रवर्तीश्वरस्तोत्रं सम्पूर्णम् । आश्वयुज शुद्ध १२
