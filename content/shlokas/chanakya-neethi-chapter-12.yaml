id: chanakya-neethi-chapter-12
category: stotram
name:
  english: Chanakya Neethi - Chapter 12
content:
  english: sanandam sadanam sutastu sudhiyah kanta priyalapini icchapurtidhanam svayoshiti ratih svajnaparah
    sevakah | atithyam shivapujanam pratidinam mishtannapanam grihe sadhoh sangamupasate ca satatam dhanyo
    grihasthashramah || || arteshu vipreshu dayanvitashca yacchraddhaya svalpamupaiti danam | anantaparamupaiti
    rajan yaddiyate tanna labheddvijebhyah || || dakshinyam svajane daya parajane shathyam sada durjane
    pritih sadhujane smayah khalajane vidvajjane carjavam | shauryam shatrujane kshama gurujane narijane
    dhurtata ittham ye purusha kalasu kushalasteshveva lokasthitih || || hastau danavivarjitau shrutiputau
    sarasvatadrohinau netre sadhuvilokanena rahite padau na tirtham gatau | anyayarjitavittapurnamudaram
    garvena tungam shiro re re jambuka munca munca sahasa nicam sunindyam vapuh || || yesham shrimadyashodasutapadakamale
    nasti bhaktirnaranam yeshamabhirakanyapriyagunakathane nanurakta rasajna | yesham shrikrishnalilalalitarasakathasadarau
    naiva karnau dhik tan dhik tan dhigetan kathayati satatam kirtanastho mridangah || || patram naiva
    yada karilavitape dosho vasantasya kim noluko'pyavalokate yadi diva suryasya kim dushanam | varsha
    naiva patanti catakamukhe meghasya kim dushanam yatpurvam vidhina lalatalikhitam tanmarjitum kah kshamah
    || || satsangadbhavati hi sadhuna khalanam sadhunam na hi khalasangatah khalatvam | amodam kusumabhavam
    mrideva dhatte mridgandham nahi kusumani dharayanti || || sadhunam darshanam punyam tirthabhuta hi
    sadhavah | kalena phalate tirtham sadyah sadhusamagamah || || viprasminnagare mahankathaya kastaladrumanam
    ganah ko data rajako dadati vasanam pratargrihitva nishi | ko dakshah paravittadaraharane sarvo'pi
    daksho janah kasmajjivasi he sakhe vishakriminyayena jivamyaham || || na viprapadodakakardamani na
    vedashastradhvanigarjitani | svahasvadhakaravivarjitani shmashanatulyani grihani tani || || satyam
    mata pita jnanam dharmo bhrata daya sakha | shantih patni kshama putrah shadete mama bandhavah ||
    || anityani sharirani vibhavo naiva shashvatah | nityam sannihito mrityuh kartavyo dharmasangrahah
    || || nimantrotsava vipra gavo navatrinotsavah | patyutsahayuta bharya aham krishnacaranotsavah ||
    || matrivatparadareshu paradravyeshu loshtravat | atmavatsarvabhuteshu yah pashyati sa panditah ||
    || dharme tatparata mukhe madhurata dane samutsahata mitre'vancakata gurau vinayata citte'timabhirata
    | acare shucita gune rasikata shastreshu vijnanata rupe sundarata shive bhajanata tvayyasti bho raghava
    || || kashtham kalpataruh sumerucalashcintamanih prastarah suryastivrakarah shashi kshayakarah ksharo
    hi varam nidhih | kamo nashtatanurvalirditisuto nityam pashuh kamagau rnaitamste tulayami bho raghupate
    kasyopama diyate || || vidya mitram pravase ca bharya mitram griheshu ca | vyadhitasyaushadham mitram
    dharmo mitram mritasya ca || || vinayam rajaputrebhyah panditebhyah subhashitam | anritam dyutakarebhyah
    stribhyah shiksheta kaitavam || || analokya vyayam karta anathah kalahapriyah | aturah sarvakshetreshu
    narah shighram vinashyati || || naharam cintayetprajno dharmamekam hi cintayet | aharo hi manushyanam
    janmana saha jayate || || dhanadhanyaprayogeshu vidyasangrahane tatha | ahare vyavahare ca tyaktalajjah
    sukhi bhavet || || jalabindunipatena kramashah puryate ghatah | sa hetuh sarvavidyanam dharmasya ca
    dhanasya ca || || vayasah pariname'pi yah khalah khala eva sah | sampakvamapi madhuryam nopayatindravarunam
    ||
  devanagari: सानन्दं सदनं सुतास्तु सुधियः कान्ता प्रियालापिनी इच्छापूर्तिधनं स्वयोषिति रतिः स्वाज्ञापराः
    सेवकाः । आतिथ्यं शिवपूजनं प्रतिदिनं मिष्टान्नपानं गृहे साधोः सङ्गमुपासते च सततं धन्यो गृहस्थाश्रमः
    ॥ ॥ आर्तेषु विप्रेषु दयान्वितश्च यच्छ्रद्धया स्वल्पमुपैति दानम् । अनन्तपारमुपैति राजन् यद्दीयते तन्न
    लभेद्द्विजेभ्यः ॥ ॥ दाक्षिण्यं स्वजने दया परजने शाठ्यं सदा दुर्जने प्रीतिः साधुजने स्मयः खलजने विद्वज्जने
    चार्जवम् । शौर्यं शत्रुजने क्षमा गुरुजने नारीजने धूर्तता इत्थं ये पुरुषा कलासु कुशलास्तेष्वेव लोकस्थितिः
    ॥ ॥ हस्तौ दानविवर्जितौ श्रुतिपुटौ सारस्वतद्रोहिणौ नेत्रे साधुविलोकनेन रहिते पादौ न तीर्थं गतौ । अन्यायार्जितवित्तपूर्णमुदरं
    गर्वेण तुङ्गं शिरो रे रे जम्बुक मुञ्च मुञ्च सहसा नीचं सुनिन्द्यं वपुः ॥ ॥ येषां श्रीमद्यशोदासुतपदकमले
    नास्ति भक्तिर्नराणां येषामाभीरकन्याप्रियगुणकथने नानुरक्ता रसज्ञा । येषां श्रीकृष्णलीलाललितरसकथासादरौ
    नैव कर्णौ धिक् तान् धिक् तान् धिगेतान् कथयति सततं कीर्तनस्थो मृदङ्गः ॥ ॥ पत्रं नैव यदा करीलविटपे दोषो
    वसन्तस्य किं नोलूकोऽप्यवलोकते यदि दिवा सूर्यस्य किं दूषणम् । वर्षा नैव पतन्ति चातकमुखे मेघस्य किं
    दूषणं यत्पूर्वं विधिना ललाटलिखितं तन्मार्जितुं कः क्षमः ॥ ॥ सत्सङ्गाद्भवति हि साधुना खलानां साधूनां
    न हि खलसङ्गतः खलत्वम् । आमोदं कुसुमभवं मृदेव धत्ते मृद्गन्धं नहि कुसुमानि धारयन्ति ॥ ॥ साधूनां दर्शनं
    पुण्यं तीर्थभूता हि साधवः । कालेन फलते तीर्थं सद्यः साधुसमागमः ॥ ॥ विप्रास्मिन्नगरे महान्कथय कस्तालद्रुमाणां
    गणः को दाता रजको ददाति वसनं प्रातर्गृहीत्वा निशि । को दक्षः परवित्तदारहरणे सर्वोऽपि दक्षो जनः कस्माज्जीवसि
    हे सखे विषकृमिन्यायेन जीवाम्यहम् ॥ ॥ न विप्रपादोदककर्दमाणि न वेदशास्त्रध्वनिगर्जितानि । स्वाहास्वधाकारविवर्जितानि
    श्मशानतुल्यानि गृहाणि तानि ॥ ॥ सत्यं माता पिता ज्ञानं धर्मो भ्राता दया सखा । शान्तिः पत्नी क्षमा पुत्रः
    षडेते मम बान्धवाः ॥ ॥ अनित्यानि शरीराणि विभवो नैव शाश्वतः । नित्यं सन्निहितो मृत्युः कर्तव्यो धर्मसङ्ग्रहः
    ॥ ॥ निमन्त्रोत्सवा विप्रा गावो नवतृणोत्सवाः । पत्युत्साहयुता भार्या अहं कृष्णचरणोत्सवः ॥ ॥ मातृवत्परदारेषु
    परद्रव्येषु लोष्ट्रवत् । आत्मवत्सर्वभूतेषु यः पश्यति स पण्डितः ॥ ॥ धर्मे तत्परता मुखे मधुरता दाने
    समुत्साहता मित्रेऽवञ्चकता गुरौ विनयता चित्तेऽतिमभीरता । आचारे शुचिता गुणे रसिकता शास्त्रेषु विज्ञानता
    रूपे सुन्दरता शिवे भजनता त्वय्यस्ति भो राघव ॥ ॥ काष्ठं कल्पतरुः सुमेरुचलश्चिन्तामणिः प्रस्तरः सूर्यास्तीव्रकरः
    शशी क्षयकरः क्षारो हि वारां निधिः । कामो नष्टतनुर्वलिर्दितिसुतो नित्यं पशुः कामगौ र्नैतांस्ते तुलयामि
    भो रघुपते कस्योपमा दीयते ॥ ॥ विद्या मित्रं प्रवासे च भार्या मित्रं गृहेषु च । व्याधितस्यौषधं मित्रं
    धर्मो मित्रं मृतस्य च ॥ ॥ विनयं राजपुत्रेभ्यः पण्डितेभ्यः सुभाषितम् । अनृतं द्यूतकारेभ्यः स्त्रीभ्यः
    शिक्षेत कैतवम् ॥ ॥ अनालोक्य व्ययं कर्ता अनाथः कलहप्रियः । आतुरः सर्वक्षेत्रेषु नरः शीघ्रं विनश्यति
    ॥ ॥ नाहारं चिन्तयेत्प्राज्ञो धर्ममेकं हि चिन्तयेत् । आहारो हि मनुष्याणां जन्मना सह जायते ॥ ॥ धनधान्यप्रयोगेषु
    विद्यासङ्ग्रहणे तथा । आहारे व्यवहारे च त्यक्तलज्जः सुखी भवेत् ॥ ॥ जलबिन्दुनिपातेन क्रमशः पूर्यते घटः
    । स हेतुः सर्वविद्यानां धर्मस्य च धनस्य च ॥ ॥ वयसः परिणामेऽपि यः खलः खल एव सः । सम्पक्वमपि माधुर्यं
    नोपयातीन्द्रवारुणम् ॥
