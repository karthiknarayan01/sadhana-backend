id: stotram-15
category: sahasranama
name:
  english: stotram
  devanagari: स्तोत्रम्
content:
  english: '|| namo bhairavarupaya bhairavaya namo namah | namo''shtacakrarupaya brahmarupaya te namah
    || 102|| namo bhairavarupaya bhairavaya namo namah | namah srishtisvarupaya srishtikartre mahatmane
    || 103|| namah palyasvarupaya bhairavaya namo namah | sanatanaya nityaya nirgunaya gunaya te || 104||
    namah siddhaya shantaya bhairavaya namo namah | namo dharasvarupaya khadgahastaya te namah || 105||
    namastrishulahastaya bhairavaya namo namah | namah kundalavarnaya shavamundavibhushine || 106|| mahakuddhaya
    candaya bhairavaya namo namah | namo vasukibhushaya sarpabhushaya te namah || 107|| namah kapalahastaya
    bhairavaya namo namah | panapatrapramattaya mattarupaya te namah || 108|| namo bhairavarupaya bhairavaya
    namo namah | namo madhavarupaya madhavaya namo namah || 109|| namo mangalyarupaya bhairavaya namo
    namah | namah kumararupaya strirupaya namo namah || 110|| namo gandhasvarupaya bhairavaya namo namah
    | namo durgandharupaya sugandhaya namo namah || 111|| namah pushpasvarupaya pushpabhushana te namah
    | namah pushpaprakashaya bhairavaya namo namah || 112|| namah pushpavinodaya pushpapujaya te namah
    | namo bhaktinivasaya bhaktaduhkhanivarine || 113|| bhaktapriyaya shantaya bhairavaya namo namah |
    namo bhaktasvarupaya rupadaya namo namah || 114|| namo bhairavarupaya bhairavaya namo namah | namo
    vasaya bhadraya virabhadraya te namah || 115|| namah sangramasaraya bhairavaya namo namah | namah
    khatvangahastaya kalahastaya te namah || 116|| nama''ghoraya ghoraya ghoraghorasvarupine | ghoragharmaya
    ghoraya bhairavaya namo namah || 117|| ghoratrishulahastaya ghorapanaya te namah | ghorarupaya nilaya
    bhairavaya namo namah || 118|| ghoravahanagamyaya agamyaya namo namah | ghorabrahmasvarupaya bhairavaya
    namo namah || 119|| ghorashabdaya ghoraya ghoradehaya te namah | ghoradravyaya ghoraya bhairavaya
    namo namah || 120|| ghorasangaya simhaya siddhasimhaya te namah | namah pracandasimhaya simharupaya
    te namah || 121|| namah simhaprakashaya suprakashaya te namah | namo viyajarupaya jagadadya namo namah
    || 122|| namo bhargava rupaya garbharupaya te namah | namo bhairavarupaya bhairavaya namo namah ||
    123|| namo medhyaya shuddhaya mayadhishaya te namah | namo meghaprakashaya bhairavaya namo namah ||
    124|| durjneyaya durantaya durlabhaya duratmane | bhaktilabhyaya bhavyaya bhavitaya namo namah ||
    125|| namo gauravarupaya gauravaya namo namah namo bhairavarupaya bhairavaya namo namah || 126|| namo
    vighnanivaraya vighnarashinnamo''stute | namo vighnavidaraya bhairavaya namo namah || 127|| namah
    kimshukarupaya rajorupaya te namah | namo nilasvarupaya bhairavaya namo namah || 128|| namo ganasvarupaya
    gananathaya te namah | namo vishvaprakashaya bhairavaya namo namah || 129|| namo yogiprakashaya yogigamyaya
    te namah | namo herambarupaya bhairavaya namo namah || 130|| namastridhasvarupaya rupadaya namo namah
    | namah svarasvarupaya bhairavaya namo namah || 131|| namah sarasvatirupa buddhirupaya te namah |
    namah vandyasvarupaya bhairavaya namo namah || 132|| namastrivikramarupaya trisvarupaya te namah |
    namah shashankarupaya bhairavaya namo namah || 133|| namo vyapakarupaya vyapyarupaya te namah | namo
    bhairavarupaya bhairavaya namo namah || 134|| namo vishadarupaya bhairavaya namo namah | namah sattvasvarupaya
    bhairavaya namo namah || 135|| namah suktasvarupaya shivadaya namo namah | namo gangasvarupaya yamunarupine
    namah || 136|| namo gaurisvarupaya bhairavaya namo namah | namo duhkhavinashaya duhkhamokshasvarupine
    || 137|| mahacalaya vandyaya bhairavaya namo namah | namo nandasvarupaya bhairavaya namo namah ||
    138|| namo nandisvarupaya sthirarupaya te namah | namah kelisvarupaya bhairavaya namo namah || 139||
    namah kshetranivasaya vasine brahmavadine | namah shantaya shuddhaya bhairavaya namo namah || 140||
    namo narmadarupaya jalarupaya te namah | namo vishvavinodaya jayadaya namo namah || 141|| namo mahendrarupaya
    mahaniyaya te namah | namah samsritirupaya sharaniyaya te namah || 142|| namastribandhuvasaya balakaya
    namo namah | namah samsarasaraya sarasam pataye namah || 143|| namaste jalarupaya bhairavaya namo
    namah | namah kavyasvarupaya bhairavaya namo namah || 144|| namo gokarnarupaya brahmavarnaya te namah
    | namah shankaravarnaya hastikarnaya te namah || 145|| namo vishtakarnaya yajnakarnaya te namah |
    namah shambukakarnaya bhairavaya namo namah || 146|| namo divyasukarnaya kalakarnaya te namah | namo
    bhayadakarnaya bhairavaya namo namah || 147|| namo akashavarnaya kalakarnaya te namah | namo digrupakarnaya
    bhairavaya namo namah || 148|| namo vishuddhakarnaya vimalaya namo namah | namah sahasrakarnaya bhairavaya
    namo namah || 149|| namo netraprakashaya sunetraya namo namah | namo varadanetraya jayanetraya te
    namah || 150|| namo vimalanetraya yoginetraya te namah | namah sahasranetraya bhairavaya namo namah
    || 151|| namah kalindarupaya kalindaya namo namah | namo jyotisvarupaya jyotishaya namo namah || 152||
    namastaraprakashaya tararupinnamo''stute | namo nakshatranetraya bhairavaya namo namah || 153|| namashcandraprakashaya
    candrarupa namo''stu te | namo rashmisvarupaya bhairavaya namo namah || 154|| namah anandarupaya jayanandasvarupine
    | namo dravidarupaya bhairavaya namo namah || 155|| namah shankhanivasaya shankaraya namo namah |
    namo mudraprakashaya bhairavaya namo namah || 156|| namo nyasasvarupaya nyasarupa namo''stute | namo
    bindusvarupaya bhairavaya namo namah || 157|| namo visargarupaya pranavarupa te namah | namo mantraprakashaya
    bhairavaya namo namah || 158|| namo jambukarupayaya jangamaya namo namah | namo garudarupaya bhairavaya
    namo namah || 159|| namo lambukarupaya lambikaya namo namah | namo lakshmisvarupaya bhairavaya namo
    namah || 160|| namo virasvarupaya viranaya namo namah | namah pracandarupaya bhairavaya namo namah
    || 161|| namo dambhasvarupaya damarudharinnamo''stu te | namah kalankanashaya kalanathaya te namah
    || 162|| namah siddhiprakashaya siddhidaya namo namah | namah siddhasvarupaya bhairavaya namo namah
    || 163|| namo dharmaprakashaya dharmanathaya te namah | dharmaya dharmarajaya bhairavaya namo namah
    || 164|| namo dharmadhipataye dharmadhyeyaya te namah | namo dharmarthasiddhaya bhairavaya namo namah
    || 165|| namo nirjararupaya ruparupaprakashine | namo rajaprakashaya bhairavaya namo namah || 166||
    namah pratapasimhaya pratapaya namo namah | namah kotipratapaya bhairavaya namo namah || 167|| namah
    sahasrarupaya kotirupaya te namah | namah anandarupaya bhairavaya namo namah || 168|| namah samharabandhaya
    bandhakaya namo namah | namo vimoksharupaya mokshadaya namo namah || 169|| namo vishnusvarupaya vyapakaya
    namo namah | namo mangalyanathaya shivanathaya te namah || 170|| namo vyalaya vyaghraya vyaghrarupa
    namo''stu te | namo vyalavibhushaya bhairavaya namo namah || 171|| namo vidyaprakashaya vidyanam pataye
    namah | namo yogisvarupaya krurarupaya te namah || 172|| namah samhararupaya shatrunashaya te namah
    | namo palakarupaya bhairavaya namo namah || 173|| namah karunyadevaya devadevaya te namah | namo
    vishvavilasaya bhairavaya namo namah || 174|| namo namah prakashaya kashivasinnamo''stute | namo bhairavakshetraya
    kshetrapalaya te namah || 175|| namo bhadrasvarupaya bhadrakaya namo namah | namo bhadradhipataye
    bhayahantre namo''stu te || 176|| namo mayavinodaya mayine madarupine | namo mattaya shantaya bhairavaya
    namo namah || 177|| namo malayavasaya kailasaya namo namah | namah kailasavasaya kalikatanayaya te
    || 178|| namah samsarasaraya bhairavaya namo namah | namo matrivinodaya vimalaya namo namah || 179||
    namo yamaprakashaya niyamaya namo namah | namah pranaprakashaya dhyanadhipataye namah || 180|| namah
    samadhirupaya nirgunaya namo namah | namo mantraprakashaya mantrarupaya te namah || 181|| namo vrindavinodaya
    vrindakaya namo namah | namo brimhitarupaya bhairavaya namo namah || 182|| namo manyasvarupaya manadaya
    namo namah | namo vishvaprakashaya bhairavaya namo namah || 183|| namo naimishapithaya siddhapithaya
    te namah | namo mandalapithaya bhaktapithaya te namah || 184|| namo yashodanathaya kamanathaya te
    namah | namo vinodanathaya siddhanathaya te namah || 185|| namo nathaya nathaya jnananathaya te namah
    | namah shankaranathaya jayanathaya te namah || 186|| namo mudgalanathaya nilanathaya te namah | namo
    balakanathaya dharmanathaya te namah || 187|| vishvanathaya nathaya karyanathaya te namah | namo bhairavanathaya
    mahanathaya te namah || 188|| namo brahmasanathaya yoganathaya te namah | namo vishvaviharaya vishvamaryaya
    te namah || 189|| namo rangasanathaya ranganathaya te namah | namo mokshasanathaya bhairavaya namo
    namah || 190|| namo gorakshanathaya nandanathaya te namah | namo mandaranathaya nandanathaya te namah
    || 191|| namo mangalanathaya campanathaya te namah | namah santoshanathaya bhairavaya namo namah ||
    192|| namo nirdhananathaya sukhanathaya te namah | namah karunyanathaya bhairavaya namo namah || 193||
    namo dravidanathaya darinathaya te namah | namah samsaranathaya jagannathaya te namah || 194|| namo
    madhvikanathaya mantranathaya te namah | namo nyasasanathaya dhyananathaya te namah || 195|| namo
    gokarnanathaya mahanathaya te namah | namah shubhrasanathaya bhairavaya namo namah || 196|| namo vimalanathaya
    mandalanathaya te namah | namah sarojanathaya satya'
  devanagari: ॥ नमो भैरवरूपाय भैरवाय नमो नमः । नमोऽष्टचक्ररूपाय ब्रह्मरूपाय ते नमः ॥ १०२॥ नमो भैरवरूपाय
    भैरवाय नमो नमः । नमः सृष्टिस्वरूपाय सृष्टिकर्त्रे महात्मने ॥ १०३॥ नमः पाल्यस्वरूपाय भैरवाय नमो नमः
    । सनातनाय नित्याय निर्गुणाय गुणाय ते ॥ १०४॥ नमः सिद्धाय शान्ताय भैरवाय नमो नमः । नमो धारास्वरूपाय
    खड्गहस्ताय ते नमः ॥ १०५॥ नमस्त्रिशूलहस्ताय भैरवाय नमो नमः । नमः कुण्डलवर्णाय शवमुण्डविभूषिणे ॥ १०६॥
    महाकुद्धाय चण्डाय भैरवाय नमो नमः । नमो वासुकिभूषाय सर्पभूषाय ते नमः ॥ १०७॥ नमः कपालहस्ताय भैरवाय नमो
    नमः । पानपात्रप्रमत्ताय मत्तरूपाय ते नमः ॥ १०८॥ नमो भैरवरूपाय भैरवाय नमो नमः । नमो माधवरूपाय माधवाय
    नमो नमः ॥ १०९॥ नमो माङ्गल्यरूपाय भैरवाय नमो नमः । नमः कुमाररूपाय स्त्रीरूपाय नमो नमः ॥ ११०॥ नमो गन्धस्वरूपाय
    भैरवाय नमो नमः । नमो दुर्गन्धरूपाय सुगन्धाय नमो नमः ॥ १११॥ नमः पुष्पस्वरूपाय पुष्पभूषण ते नमः । नमः
    पुष्पप्रकाशाय भैरवाय नमो नमः ॥ ११२॥ नमः पुष्पविनोदाय पुष्पपूजाय ते नमः । नमो भक्तिनिवासाय भक्तदुःखनिवारिणे
    ॥ ११३॥ भक्तप्रियाय शान्ताय भैरवाय नमो नमः । नमो भक्तस्वरूपाय रूपदाय नमो नमः ॥ ११४॥ नमो भैरवरूपाय भैरवाय
    नमो नमः । नमो वासाय भद्राय वीरभद्राय ते नमः ॥ ११५॥ नमः सङ्ग्रामसाराय भैरवाय नमो नमः । नमः खट्वाङ्गहस्ताय
    कालहस्ताय ते नमः ॥ ११६॥ नमऽघोराय घोराय घोराघोरस्वरूपिणे । घोरघर्माय घोराय भैरवाय नमो नमः ॥ ११७॥ घोरत्रिशूलहस्ताय
    घोरपानाय ते नमः । घोररूपाय नीलाय भैरवाय नमो नमः ॥ ११८॥ घोरवाहनगम्याय अगम्याय नमो नमः । घोरब्रह्मस्वरूपाय
    भैरवाय नमो नमः ॥ ११९॥ घोरशब्दाय घोराय घोरदेहाय ते नमः । घोरद्रव्याय घोराय भैरवाय नमो नमः ॥ १२०॥ घोरसङ्गाय
    सिंहाय सिद्धसिंहाय ते नमः । नमः प्रचण्डसिंहाय सिंहरूपाय ते नमः ॥ १२१॥ नमः सिंहप्रकाशाय सुप्रकाशाय
    ते नमः । नमो वियजरूपाय जगदाद्य नमो नमः ॥ १२२॥ नमो भार्गव रूपाय गर्भरूपाय ते नमः । नमो भैरवरूपाय भैरवाय
    नमो नमः ॥ १२३॥ नमो मेध्याय शुद्धाय मायाधीशाय ते नमः । नमो मेघप्रकाशाय भैरवाय नमो नमः ॥ १२४॥ दुर्ज्ञेयाय
    दुरन्ताय दुर्लभाय दुरात्मने । भक्तिलभ्याय भव्याय भविताय नमो नमः ॥ १२५॥ नमो गौरवरूपाय गौरवाय नमो नमः
    नमो भैरवरूपाय भैरवाय नमो नमः ॥ १२६॥ नमो विघ्ननिवाराय विघ्नराशिन्नमोऽस्तुते । नमो विघ्नविदाराय भैरवाय
    नमो नमः ॥ १२७॥ नमः किंशुकरूपाय रजोरूपाय ते नमः । नमो नीलस्वरूपाय भैरवाय नमो नमः ॥ १२८॥ नमो गणस्वरूपाय
    गणनाथाय ते नमः । नमो विश्वप्रकाशाय भैरवाय नमो नमः ॥ १२९॥ नमो योगिप्रकाशाय योगिगम्याय ते नमः । नमो
    हेरम्बरूपाय भैरवाय नमो नमः ॥ १३०॥ नमस्त्रिधास्वरूपाय रूपदाय नमो नमः । नमः स्वरस्वरूपाय भैरवाय नमो
    नमः ॥ १३१॥ नमः सरस्वतीरूप बुद्धिरूपाय ते नमः । नमः वन्द्यस्वरूपाय भैरवाय नमो नमः ॥ १३२॥ नमस्त्रिविक्रमरूपाय
    त्रिस्वरूपाय ते नमः । नमः शशाङ्करूपाय भैरवाय नमो नमः ॥ १३३॥ नमो व्यापकरूपाय व्याप्यरूपाय ते नमः ।
    नमो भैरवरूपाय भैरवाय नमो नमः ॥ १३४॥ नमो विशदरूपाय भैरवाय नमो नमः । नमः सत्त्वस्वरूपाय भैरवाय नमो नमः
    ॥ १३५॥ नमः सूक्तस्वरूपाय शिवदाय नमो नमः । नमो गङ्गास्वरूपाय यमुनारूपिणे नमः ॥ १३६॥ नमो गौरीस्वरूपाय
    भैरवाय नमो नमः । नमो दुःखविनाशाय दुःखमोक्षस्वरूपिणे ॥ १३७॥ महाचलाय वन्द्याय भैरवाय नमो नमः । नमो नन्दस्वरूपाय
    भैरवाय नमो नमः ॥ १३८॥ नमो नन्दिस्वरूपाय स्थिररूपाय ते नमः । नमः केलिस्वरूपाय भैरवाय नमो नमः ॥ १३९॥
    नमः क्षेत्रनिवासाय वासिने ब्रह्मवादिने । नमः शान्ताय शुद्धाय भैरवाय नमो नमः ॥ १४०॥ नमो नर्मदरूपाय
    जलरूपाय ते नमः । नमो विश्वविनोदाय जयदाय नमो नमः ॥ १४१॥ नमो महेन्द्ररूपाय महनीयाय ते नमः । नमः संसृतिरूपाय
    शरणीयाय ते नमः ॥ १४२॥ नमस्त्रिबन्धुवासाय बालकाय नमो नमः । नमः संसारसाराय सरसां पतये नमः ॥ १४३॥ नमस्ते
    जलरूपाय भैरवाय नमो नमः । नमः काव्यस्वरूपाय भैरवाय नमो नमः ॥ १४४॥ नमो गोकर्णरूपाय ब्रह्मवर्णाय ते नमः
    । नमः शङ्करवर्णाय हस्तिकर्णाय ते नमः ॥ १४५॥ नमो विष्टकर्णाय यज्ञकर्णाय ते नमः । नमः शम्बुककर्णाय भैरवाय
    नमो नमः ॥ १४६॥ नमो दिव्यसुकर्णाय कालकर्णाय ते नमः । नमो भयदकर्णाय भैरवाय नमो नमः ॥ १४७॥ नमो आकाशवर्णाय
    कालकर्णाय ते नमः । नमो दिग्रूपकर्णाय भैरवाय नमो नमः ॥ १४८॥ नमो विशुद्धकर्णाय विमलाय नमो नमः । नमः
    सहस्रकर्णाय भैरवाय नमो नमः ॥ १४९॥ नमो नेत्रप्रकाशाय सुनेत्राय नमो नमः । नमो वरदनेत्राय जयनेत्राय ते
    नमः ॥ १५०॥ नमो विमलनेत्राय योगिनेत्राय ते नमः । नमः सहस्रनेत्राय भैरवाय नमो नमः ॥ १५१॥ नमः कलिन्दरूपाय
    कलिन्दाय नमो नमः । नमो ज्योतिस्वरूपाय ज्योतिषाय नमो नमः ॥ १५२॥ नमस्तारप्रकाशाय ताररूपिन्नमोऽस्तुते
    । नमो नक्षत्रनेत्राय भैरवाय नमो नमः ॥ १५३॥ नमश्चन्द्रप्रकाशाय चन्द्ररूप नमोऽस्तु ते । नमो रश्मिस्वरूपाय
    भैरवाय नमो नमः ॥ १५४॥ नमः आनन्दरूपाय जयानन्दस्वरूपिणे । नमो द्रविडरूपाय भैरवाय नमो नमः ॥ १५५॥ नमः
    शङ्खनिवासाय शङ्कराय नमो नमः । नमो मुद्राप्रकाशाय भैरवाय नमो नमः ॥ १५६॥ नमो न्यासस्वरूपाय न्यासरूप
    नमोऽस्तुते । नमो बिन्दुस्वरूपाय भैरवाय नमो नमः ॥ १५७॥ नमो विसर्गरूपाय प्रणवरूप ते नमः । नमो मन्त्रप्रकाशाय
    भैरवाय नमो नमः ॥ १५८॥ नमो जम्बुकरूपायाय जङ्गमाय नमो नमः । नमो गरुडरूपाय भैरवाय नमो नमः ॥ १५९॥ नमो
    लम्बुकरूपाय लम्बिकाय नमो नमः । नमो लक्ष्मीस्वरूपाय भैरवाय नमो नमः ॥ १६०॥ नमो वीरस्वरूपाय वीरणाय नमो
    नमः । नमः प्रचण्डरूपाय भैरवाय नमो नमः ॥ १६१॥ नमो दम्भस्वरूपाय डमरुधारिन्नमोऽस्तु ते । नमः कलङ्कनाशाय
    कालनाथाय ते नमः ॥ १६२॥ नमः सिद्धिप्रकाशाय सिद्धिदाय नमो नमः । नमः सिद्धस्वरूपाय भैरवाय नमो नमः ॥ १६३॥
    नमो धर्मप्रकाशाय धर्मनाथाय ते नमः । धर्माय धर्मराजाय भैरवाय नमो नमः ॥ १६४॥ नमो धर्माधिपतये धर्मध्येयाय
    ते नमः । नमो धर्मार्थसिद्धाय भैरवाय नमो नमः ॥ १६५॥ नमो निर्जररूपाय रूपारूपप्रकाशिने । नमो राजप्रकाशाय
    भैरवाय नमो नमः ॥ १६६॥ नमः प्रतापसिंहाय प्रतापाय नमो नमः । नमः कोटिप्रतापाय भैरवाय नमो नमः ॥ १६७॥ नमः
    सहस्ररूपाय कोटिरूपाय ते नमः । नमः आनन्दरूपाय भैरवाय नमो नमः ॥ १६८॥ नमः संहारबन्धाय बन्धकाय नमो नमः
    । नमो विमोक्षरूपाय मोक्षदाय नमो नमः ॥ १६९॥ नमो विष्णुस्वरूपाय व्यापकाय नमो नमः । नमो माङ्गल्यनाथाय
    शिवनाथाय ते नमः ॥ १७०॥ नमो व्यालाय व्याघ्राय व्याघ्ररूप नमोऽस्तु ते । नमो व्यालविभूषाय भैरवाय नमो
    नमः ॥ १७१॥ नमो विद्याप्रकाशाय विद्यानां पतये नमः । नमो योगिस्वरूपाय क्रूररूपाय ते नमः ॥ १७२॥ नमः संहाररूपाय
    शत्रुनाशाय ते नमः । नमो पालकरूपाय भैरवाय नमो नमः ॥ १७३॥ नमः कारुण्यदेवाय देवदेवाय ते नमः । नमो विश्वविलासाय
    भैरवाय नमो नमः ॥ १७४॥ नमो नमः प्रकाशाय काशीवासिन्नमोऽस्तुते । नमो भैरवक्षेत्राय क्षेत्रपालाय ते नमः
    ॥ १७५॥ नमो भद्रस्वरूपाय भद्रकाय नमो नमः । नमो भद्राधिपतये भयहन्त्रे नमोऽस्तु ते ॥ १७६॥ नमो मायाविनोदाय
    मायिने मदरूपिणे । नमो मत्ताय शान्ताय भैरवाय नमो नमः ॥ १७७॥ नमो मलयवासाय कैलासाय नमो नमः । नमः कैलासवासाय
    कालिकातनयाय ते ॥ १७८॥ नमः संसारसाराय भैरवाय नमो नमः । नमो मातृविनोदाय विमलाय नमो नमः ॥ १७९॥ नमो यमप्रकाशाय
    नियमाय नमो नमः । नमः प्राणप्रकाशाय ध्यानाधिपतये नमः ॥ १८०॥ नमः समाधिरूपाय निर्गुणाय नमो नमः । नमो
    मन्त्रप्रकाशाय मन्त्ररूपाय ते नमः ॥ १८१॥ नमो वृन्दविनोदाय वृन्दकाय नमो नमः । नमो बृंहितरूपाय भैरवाय
    नमो नमः ॥ १८२॥ नमो मान्यस्वरूपाय मानदाय नमो नमः । नमो विश्वप्रकाशाय भैरवाय नमो नमः ॥ १८३॥ नमो नैमिषपीठाय
    सिद्धपीठाय ते नमः । नमो मण्डलपीठाय भक्तपीठाय ते नमः ॥ १८४॥ नमो यशोदानाथाय कामनाथाय ते नमः । नमो विनोदनाथाय
    सिद्धनाथाय ते नमः ॥ १८५॥ नमो नाथाय नाथाय ज्ञाननाथाय ते नमः । नमः शङ्करनाथाय जयनाथाय ते नमः ॥ १८६॥
    नमो मुद्गलनाथाय नीलनाथाय ते नमः । नमो बालकनाथाय धर्मनाथाय ते नमः ॥ १८७॥ विश्वनाथाय नाथाय कार्यनाथाय
    ते नमः । नमो भैरवनाथाय महानाथाय ते नमः ॥ १८८॥ नमो ब्रह्मसनाथाय योगनाथाय ते नमः । नमो विश्वविहाराय
    विश्वमार्याय ते नमः ॥ १८९॥ नमो रङ्गसनाथाय रङ्गनाथाय ते नमः । नमो मोक्षसनाथाय भैरवाय नमो नमः ॥ १९०॥
    नमो गोरक्षनाथाय नन्दनाथाय ते नमः । नमो मन्दारनाथाय नन्दनाथाय ते नमः ॥ १९१॥ नमो मङ्गलनाथाय चम्पानाथाय
    ते नमः । नमः सन्तोषनाथाय भैरवाय नमो नमः ॥ १९२॥ नमो निर्धननाथाय सुखनाथाय ते नमः । नमः कारुण्यनाथाय
    भैरवाय नमो नमः ॥ १९३॥ नमो द्रविडनाथाय दरिनाथाय ते नमः । नमः संसारनाथाय जगन्नाथाय ते नमः ॥ १९४॥ नमो
    माध्वीकनाथाय मन्त्रनाथाय ते नमः । नमो न्याससनाथाय ध्याननाथाय ते नमः ॥ १९५॥ नमो गोकर्णनाथाय महानाथाय
    ते नमः । नमः शुभ्रसनाथाय भैरवाय नमो नमः ॥ १९६॥ नमो विमलनाथाय मण्डलनाथाय ते नमः । नमः सरोजनाथाय सत्य
