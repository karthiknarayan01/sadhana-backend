id: venkateshastotra
category: stotram
name:
  english: venkateshastotra
  devanagari: वेन्कटेशस्तोत्र
content:
  english: shrivenkateshvarastotram caturashcaturah sakritpumarthan caturodatum ivodvahan bhujan yah |
    karunavarunalayah samindhe phanishaite sharanantamashrayamah || 1|| namaskarmikurmos natajana manobhishta
    ghatana patiyamsam sheshakshitidharashirobhushana manim | trilokinirmanasthitiharanalilasurashikam
    shriyahkantamdevam sugunanidhim asmatkulagurum || 2|| shrimad venkatashailashekharatate sancaramatanvati
    nishkampam tatitam sadaiva dadhati bhuyo amritam varshati | sauhardam ca dhananjaye vidhadati dhyatum
    tamodhunvati pushyadvonitaram pramodalatikam ya kapi kadambinim || 3|| jayanti shrikantapranayarasadhara
    madhuripoh katakshah karunyamritajaladhikallolanikarah | triloki kalyanapranayanamahakalpavitapah
    shritasvantadhvantaprashamakaranadityakiranah || 4|| ahinashailastham ahinavaibhavam maho yada bhati
    mahotsavah satam nirantaram tam nigamantagocaram cirantanam cetasi cintayamaham || 5|| || iti shri
    vattepalle narakanthirava shastri viracitam shri venkateshvarastotram samaptam ||
  devanagari: श्रीवेङ्कटेश्वरस्तोत्रम् चतुरश्चतुरः सकृत्पुमर्थान् चतुरोदातुं इवोद्वहन् भुजान् यः । करुणावरुणालयः
    समिन्धे फणिशैते शरणन्तमाश्रयामः ॥ १॥ नमस्कर्मीकुर्मोस् नटजन मनोभीष्ट घटना पटियांसं शेषक्षितिधरशिरोभूषण
    मणिम् । त्रिलोकीनिर्माणस्थितिहरणलीलासुरषिकम् श्रियःकान्तंदेवं सुगुणनिधिं अस्मत्कुलगुरुम् ॥ २॥ श्रीमद्
    वेङ्कटशैलशेखरतटे सञ्चारमातन्वती निष्कम्पां तटितं सदैव दधति भूयो अमृतं वर्षति । सौहार्दं च धनञ्जये
    विधदती ध्यातुं तमोधुन्वति पुष्याद्वोनितरां प्रमोदलतिकां या कापि कादम्बिनीम् ॥ ३॥ जयन्ति श्रीकान्तप्रणयरसधारा
    मधुरिपोः कटाक्षः कारुण्यामृतजलधिकल्लोलनिकराः । त्रिलोकी कल्याणप्रणयनमहाकल्पविटपाः श्रितस्वान्तध्वान्तप्रषमकरणादित्यकिरणः
    ॥ ४॥ अहीनशैलस्थं अहीनवैभवं महो यदा भाति महोत्सवः सताम् निरन्तरं तं निगमान्तगोचरं चिरन्तनं चेतसि चिन्तयामहम्
    ॥ ५॥ ॥ इति श्री वट्टेपल्ले नरकण्ठीरव शास्त्रि विरचितम् श्री वेङ्कटेश्वरस्तोत्रं समाप्तम् ॥
