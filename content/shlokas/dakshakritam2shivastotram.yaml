id: dakshakritam2shivastotram
category: stotram
name:
  english: dakshakritam2shivastotram
  devanagari: दक्षकृतं२शिवस्तोत्रम्
content:
  english: dakshakritam 2 shivastotram daksha uvaca | jaya shankara somesha jaya sarvajna shambhave |
    jaya kalyanabhricchambho jaya kalatmane namah || 30|| adikartarnamaste'stu nilakantha namo'stu te
    | brahmapriya namaste'stu brahmarupa namo'stu te || 31|| trimurtaye namo deva tridhama parameshvara
    | sarvamurte namaste'stu trailokyadhara kamada || 32|| namo vedantavedyaya namaste paramatmane | yajnarupa
    namaste'stu yajnadhama namo'stu te || 33|| yajnadana namaste'stu havyavaha namo'stu te | yajnahartre
    namaste'stu phaladaya namo'stu te || 34|| trahi trahi jagannatha sharanagatavatsala | bhaktanamapyabhaktanam
    tvameva sharanam prabho || 35|| iti brahmapurane navadhikashatatamadhyayantargatam dakshakritam shivastotram
    samaptam | brahmapurana | adhyaya 109
  devanagari: दक्षकृतं २ शिवस्तोत्रम् दक्ष उवाच । जय शङ्कर सोमेश जय सर्वज्ञ शम्भवे । जय कल्याणभृच्छम्भो
    जय कालात्मने नमः ॥ ३०॥ आदिकर्तर्नमस्तेऽस्तु नीलकण्ठ नमोऽस्तु ते । ब्रह्मप्रिय नमस्तेऽस्तु ब्रह्मरूप
    नमोऽस्तु ते ॥ ३१॥ त्रिमूर्तये नमो देव त्रिधाम परमेश्वर । सर्वमूर्ते नमस्तेऽस्तु त्रैलोक्याधार कामद
    ॥ ३२॥ नमो वेदान्तवेद्याय नमस्ते परमात्मने । यज्ञरूप नमस्तेऽस्तु यज्ञधाम नमोऽस्तु ते ॥ ३३॥ यज्ञदान
    नमस्तेऽस्तु हव्यवाह नमोऽस्तु ते । यज्ञहर्त्रे नमस्तेऽस्तु फलदाय नमोऽस्तु ते ॥ ३४॥ त्राहि त्राहि जगन्नाथ
    शरणागतवत्सल । भक्तानामप्यभक्तानां त्वमेव शरणं प्रभो ॥ ३५॥ इति ब्रह्मपुराणे नवाधिकशततमाध्यायान्तर्गतं
    दक्षकृतं शिवस्तोत्रं समाप्तम् । ब्रह्मपुराण । अध्याय १०९
