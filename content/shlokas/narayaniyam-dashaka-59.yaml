id: narayaniyam-dashaka-59
category: stotram
name:
  english: Narayaniyam Dashaka 59
content:
  english: tvadvapurnavakalayakomalam premadohanamasheshamohanam | brahma tattvaparacinmudatmakam vikshya
    sammumuhuranvaham striyah || || manmathonmathitamanasah kramattvadvilokanaratastatastatah | gopikastava
    na sehire hare kananopagatimapyaharmukhe || || nirgate bhavati dattadrishtayastvadgatena manasa mrigekshanah
    | venunadamupakarnya duratastvadvilasakathaya'bhiremire || || kananantamitavan bhavanapi snigdhapadapatale
    manorame | vyatyayakalitapadamasthitah pratyapurayata venunalikam || || marabanadhutakhecarikulam
    nirvikarapashupakshimandalam | dravanam ca drishadamapi prabho tavakam vyajani venukujitam || || venurandhrataralangulidalam
    talasancalitapadapallavam | tat sthitam tava parokshamapyaho samvicintya mumuhurvrajanganah || ||
    nirvishankabhavadangadarshinih khecarih khagamrigan pashunapi | tvatpadapranayi kananam ca tah dhanyadhanyamiti
    nanvamanayan || || apibeyamadharamritam kada venubhuktarasasheshamekada | durato bata kritam durashayetyakula
    muhurimah samamuhan || || pratyaham ca punaritthamanganashcittayonijanitadanugrahat | baddharagavivashastvayi
    prabho nityamapuriha krityamudhatam || || ragastavajjayate hi svabhava nmokshopayo yatnatah syanna
    va syat | tasam tvekam taddvayam labdhamasit bhagyam bhagyam pahi mam marutesha ||
  devanagari: त्वद्वपुर्नवकलायकोमलं प्रेमदोहनमशेषमोहनम् । ब्रह्म तत्त्वपरचिन्मुदात्मकं वीक्ष्य सम्मुमुहुरन्वहं
    स्त्रियः ॥ ॥ मन्मथोन्मथितमानसाः क्रमात्त्वद्विलोकनरतास्ततस्ततः । गोपिकास्तव न सेहिरे हरे काननोपगतिमप्यहर्मुखे
    ॥ ॥ निर्गते भवति दत्तदृष्टयस्त्वद्गतेन मनसा मृगेक्षणाः । वेणुनादमुपकर्ण्य दूरतस्त्वद्विलासकथयाऽभिरेमिरे
    ॥ ॥ काननान्तमितवान् भवानपि स्निग्धपादपतले मनोरमे । व्यत्ययाकलितपादमास्थितः प्रत्यपूरयत वेणुनालिकाम्
    ॥ ॥ मारबाणधुतखेचरीकुलं निर्विकारपशुपक्षिमण्डलम् । द्रावणं च दृषदामपि प्रभो तावकं व्यजनि वेणुकूजितम्
    ॥ ॥ वेणुरन्ध्रतरलाङ्गुलीदलं तालसञ्चलितपादपल्लवम् । तत् स्थितं तव परोक्षमप्यहो संविचिन्त्य मुमुहुर्व्रजाङ्गनाः
    ॥ ॥ निर्विशङ्कभवदङ्गदर्शिनीः खेचरीः खगमृगान् पशूनपि । त्वत्पदप्रणयि काननं च ताः धन्यधन्यमिति नन्वमानयन्
    ॥ ॥ आपिबेयमधरामृतं कदा वेणुभुक्तरसशेषमेकदा । दूरतो बत कृतं दुराशयेत्याकुला मुहुरिमाः समामुहन् ॥ ॥
    प्रत्यहं च पुनरित्थमङ्गनाश्चित्तयोनिजनितादनुग्रहात् । बद्धरागविवशास्त्वयि प्रभो नित्यमापुरिह कृत्यमूढताम्
    ॥ ॥ रागस्तावज्जायते हि स्वभावा न्मोक्षोपायो यत्नतः स्यान्न वा स्यात् । तासां त्वेकं तद्द्वयं लब्धमासीत्
    भाग्यं भाग्यं पाहि मां मारुतेश ॥
