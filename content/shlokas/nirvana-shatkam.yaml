id: nirvana-shatkam
category: stotram
name:
  english: Nirvana Shatkam
content:
  english: om om om shivo'ham shivo'ham shivo'ham shivo'ham mano buddhyahankara cittani naham na ca shrotra
    jihve na ca ghrananetre | na ca vyoma bhumirna tejo na vayuh cidananda rupah shivo'ham shivo'ham ||
    shivo'ham shivo'ham na ca prana sanjno na vaipancavayuh na va saptadhaturna va pancakoshah | navakpani
    padau na copastha payu cidananda rupah shivo'ham shivo'ham || shivo'ham shivo'ham na me dvesharagau
    na me lobhamohau mado naiva me naiva matsaryabhavah | na dharmo na cartho na kamo na mokshah cidananda
    rupah shivo'ham shivo'ham || shivo'ham shivo'ham na punyam na papam na saukhyam na duhkham na mantro
    na tirtham na veda na yajnah | aham bhojanam naiva bhojyam na bhokta cidananda rupah shivo'ham shivo'ham
    || shivo'ham shivo'ham na mrityurna shanka na me jati bhedah pita naiva me naiva mata na janma | na
    bandhurna mitram gururnaiva shishyah cidanandarupah shivo'ham shivo'ham || shivo'ham shivo'ham aham
    nirvikalpo nirakara rupo vibhutvacca sarvatra sarvendriyanam | na casangatam naiva muktirna meyah
    na va bandhanam naiva muktirna bandhah cidanandarupah shivo'ham shivo'ham ||
  devanagari: ॐ ॐ ओम् शिवोऽहं शिवोऽहं शिवोऽहं शिवोऽहं मनो बुद्ध्यहङ्कार चित्तानि नाहं न च श्रोत्र जिह्वे
    न च घ्राणनेत्रे । न च व्योम भूमिर्न तेजो न वायुः चिदानन्द रूपः शिवोऽहं शिवोऽहम् ॥ शिवोऽहं शिवोऽहं
    न च प्राण सञ्ज्ञो न वैपञ्चवायुः न वा सप्तधातुर्न वा पञ्चकोशाः । नवाक्पाणि पादौ न चोपस्थ पायू चिदानन्द
    रूपः शिवोऽहं शिवोऽहम् ॥ शिवोऽहं शिवोऽहं न मे द्वेषरागौ न मे लोभमोहौ मदो नैव मे नैव मात्सर्यभावः ।
    न धर्मो न चार्थो न कामो न मोक्षः चिदानन्द रूपः शिवोऽहं शिवोऽहम् ॥ शिवोऽहं शिवोऽहं न पुण्यं न पापं
    न सौख्यं न दुःखं न मन्त्रो न तीर्थं न वेदा न यज्ञः । अहं भोजनं नैव भोज्यं न भोक्ता चिदानन्द रूपः शिवोऽहं
    शिवोऽहम् ॥ शिवोऽहं शिवोऽहं न मृत्युर्न शङ्का न मे जाति भेदः पिता नैव मे नैव माता न जन्म । न बन्धुर्न
    मित्रं गुरुर्नैव शिष्यः चिदानन्दरूपः शिवोऽहं शिवोऽहम् ॥ शिवोऽहं शिवोऽहं अहं निर्विकल्पो निराकार रूपो
    विभुत्वाच्च सर्वत्र सर्वेन्द्रियाणाम् । न चासङ्गतं नैव मुक्तिर्न मेयः न वा बन्धनं नैव मुक्तिर्न बन्धः
    चिदानन्दरूपः शिवोऽहं शिवोऽहम् ॥
