id: purushottamaproktamshrimahalakshmimantrastotram-2
category: mantra
name:
  english: purushottamaproktamshrimahalakshmimantrastotram
  devanagari: पुरुषोत्तमप्रोक्तंश्रीमहालक्ष्मीमन्त्रस्तोत्रम्
content:
  english: '|| 2|| pancashadaksharam divyam mahamantram japet sada | rishirnarayanashca''ham mahalakshmirhi
    devata || 3|| svarnacampakarupabham sarvabhushanabhushitam | kripahasyaprasannasyam bhaktanugrahatatparam
    || 4|| sarvaishvaryadisampurnam sarvambaravirajitam | kotisuryendukantam ca ratnaharadi bibhratim
    || 5|| kambharashrimahalakshmim shrimadgopalarupinim | mahavishnumahashaktim dhyayecchrimataram ramam
    || 6|| japenmantrayutam mantralaksham va''tha dashamshatah | payasena havanam ca kuryacchricandanarcanam
    || 7|| sthapanam pujanam kuryadarartrikam nivedanam | jalam tambulakam dadyat kshamapanam visarjanam
    || 8|| navashaktih pujayecca mahalakshmyah svarupini | vibhutimunnatim kantim srishtim kirti ca sannatim
    || 9|| vyushtimutkrishtimriddhim ca dakshine tu gajananam | vame kusumadhanvanam pujayeccandanadibhih
    || 10|| umam shrim bharatim durgam dharanim vedamataram | devimusham cashtadikshu gangam yamim ca
    pujayet || 11|| padapadmakshalanaya''''nita apah prapujayet | shankhapadmanidhi ca''rcet parshvayordhritacamarau
    || 12|| dhritatapatram varunam pujayet pashcime tatha | rashinnavagraha~shcapi diggajanarcayettatha
    || 13|| lokapala~stadastrani pujayettvanale tatha | durvabhirajyasiktabhirjuhuyadayushe narah || 14||
    guducimajyasamsiktam juhuyat saptavasaran | ashtottarasahasram yah sa jivet purnameva ha || 15|| hutva
    tilan ghritabhyaktan dirghamayushyamapnuyat | shalibhirjuhvato nityamashtottarasahasrakam || 16||
    aciradeva mahati lakshmih sanjayate dhruva | narikelaghritadyairjuhuyatkuberavadbhavet || 17|| gudaghritabhyam
    havanadannavan samprajayate | evam yo bhajate lakshmim kambharam lalitam shriyam || 18|| sampadastasya
    janante mahalakshmih prasidati | dehante vaishnavam dhama labhate parameshvaram || 19|| shripure divyaloke
    sa mata lakshmih pareshvari | vividhan svavataran hi trailokyam kurute sada || 20|| mahalakshmirmahamaya
    mulaprakritirishvari | parabrahmi ca''kshari ca pareshi purushottami || 21|| radhalakshmishca ganga
    ca viraja ca sarasvati | savitri catha gayatri kamala padmini rama || 22|| tulasi madhavi padma cetyevam
    khyayate hi sa | vishnukancyam mahalakshmirlalita vartate sati || 23|| shivakancyam saiva devi kameshvari
    shivapriya | vartate parama pujya naikarupa hi kambhara || 24|| iti shrilakshminarayaniyasamhitayah
    dvaparayugasantanatmakasya tritiyakhande 120'
  devanagari: ॥ २॥ पञ्चाशदक्षरं दिव्यं महामन्त्रं जपेत् सदा । ऋषिर्नारायणश्चाऽहं महालक्ष्मीर्हि देवता
    ॥ ३॥ स्वर्णचम्पकरूपाभां सर्वभूषणभूषिताम् । कृपाहास्यप्रसन्नास्यां भक्तानुग्रहतत्पराम् ॥ ४॥ सर्वैश्वर्यादिसम्पूर्णां
    सर्वाम्बरविराजिताम् । कोटिसूर्येन्दुकान्तां च रत्नहारादि बिभ्रतीम् ॥ ५॥ कम्भराश्रीमहालक्ष्मीं श्रीमद्गोपालरूपिणीम्
    । महाविष्णुमहाशक्तिं ध्यायेच्छ्रीमातरं रमाम् ॥ ६॥ जपेन्मन्त्रायुतं मन्त्रलक्षं वाऽथ दशांशतः । पायसेन
    हवनं च कुर्याच्छ्रीचन्दनार्चनम् ॥ ७॥ स्थापनं पूजनं कुर्यादारार्त्रिकं निवेदनम् । जलं ताम्बूलकं दद्यात्
    क्षमापनं विसर्जनम् ॥ ८॥ नवशक्तीः पूजयेच्च महालक्ष्म्याः स्वरूपिणी । विभूतिमुन्नतिं कान्तिं सृष्टिं
    कीर्ति च सन्नतिम् ॥ ९॥ व्युष्टिमुत्कृष्टिमृद्धिं च दक्षिणे तु गजाननम् । वामे कुसुमधन्वानं पूजयेच्चन्दनादिभिः
    ॥ १०॥ उमां श्रीं भारतीं दुर्गां धरणिं वेदमातरम् । देवीमुषां चाष्टदिक्षु गङ्गां यमीं च पूजयेत् ॥ ११॥
    पादपद्मक्षालनायाऽऽनीता अपः प्रपूजयेत् । शङ्खपद्मनिधी चाऽर्चेत् पार्श्वयोर्धृतचामरौ ॥ १२॥ धृतातपत्रं
    वरुणं पूजयेत् पश्चिमे तथा । राशीन्नवग्रहाँश्चापि दिग्गजानर्चयेत्तथा ॥ १३॥ लोकपालाँस्तदस्त्राणि पूजयेत्त्वनले
    तथा । दूर्वाभिराज्यसिक्ताभिर्जुहुयादायुषे नरः ॥ १४॥ गुडूचीमाज्यसंसिक्तां जुहुयात् सप्तवासरान् । अष्टोत्तरसहस्रं
    यः स जीवेत् पूर्णमेव ह ॥ १५॥ हुत्वा तिलान् घृताभ्यक्तान् दीर्घमायुष्यमाप्नुयात् । शालिभिर्जुह्वतो
    नित्यमष्टोत्तरसहस्रकम् ॥ १६॥ अचिरादेव महती लक्ष्मीः सञ्जायते ध्रुवा । नारीकेलघृताद्यैर्जुहुयात्कुबेरवद्भवेत्
    ॥ १७॥ गुडघृताभ्यां हवनादन्नवान् सम्प्रजायते । एवं यो भजते लक्ष्मीं कम्भरां ललितां श्रियम् ॥ १८॥ सम्पदस्तस्य
    जानन्ते महालक्ष्मीः प्रसीदति । देहान्ते वैष्णवं धाम लभते पारमेश्वरम् ॥ १९॥ श्रीपुरे दिव्यलोके सा माता
    लक्ष्मीः परेश्वरी । विविधान् स्वावतारान् हि त्रैलोक्यां कुरुते सदा ॥ २०॥ महालक्ष्मीर्महामाया मूलप्रकृतिरीश्वरी
    । पारब्राह्मी चाऽक्षरी च परेशी पुरुषोत्तमी ॥ २१॥ राधालक्ष्मीश्च गङ्गा च विरजा च सरस्वती । सावित्री
    चाथ गायत्री कमला पद्मिनी रमा ॥ २२॥ तुलसी माधवी पद्मा चेत्येवं ख्यायते हि सा । विष्णुकाञ्च्यां महालक्ष्मीर्ललिता
    वर्तते सती ॥ २३॥ शिवकाञ्च्यां सैव देवी कामेश्वरी शिवप्रिया । वर्तते परमा पूज्या नैकरूपा हि कम्भरा
    ॥ २४॥ इति श्रीलक्ष्मीनारायणीयसंहितायाः द्वापरयुगसन्तानात्मकस्य तृतीयखण्डे १२०
