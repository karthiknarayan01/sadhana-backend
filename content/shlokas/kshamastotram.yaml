id: kshamastotram
category: shataka
name:
  english: kshamastotram
  devanagari: क्षमास्तोत्रम्
content:
  english: rinu janani sarvasahapade sthitah shambhurdevya saha vrishabhamaruhya puratah | prasanno'ham
    vatsa tvamapi varayabhishtamiti mam kada kshante bruyaditi taditaram nasti manasi || 35|| yaje'ham
    budhye'ham bahutapasi tishthamyahamiti bhramadatmapraptim hyabhidadhati nishreyasamami | katha ka
    va tasya tvamiha vimukha cedalamalam mahadevakshante smaratu bhavati taniva na mam || 36|| tapasyatmadrohah
    savanavishaye jivahananam vritha tishtheyam cedahaha sutaram karmavirahah | tatah sarvatrapi sphuritamaparadham
    gamayitum vina tvam he kshante kushalamavalambam na manavai || 37|| vina cet tvamekam sakalamapi lokaprayatanam
    bhavenmatah satyam karakritamakuparataranam | aham daivat tvayyakalitanijabharo'smi parato bhavakshante
    cittam tava mama tu bhagyam kathamiva || 38|| prasadam vanchanti prabalamaparadham tirayitum na manyante
    kim te nipunamatayah shastrakushalah | imam tam dhimantam janani manavai yastava pade prannah shrikshante
    sakridapi bhayavishtamanasa || 39|| mahadevasyaiva shrutimatamanugrahanipunam shivam murtim prahuh
    katicidapare hanta karunam | aham manye kshante tvamiti sakalanamupari te prakasho mantunam sahanasamaye
    jagrati muhuh || 40|| dayanamni kshante tava nijasakhi kkapyanutaram na vaimukhyam kartrim smarati
    hridi patyurvimukhatam | na vaiyatyam tasya nanu sakalakale'pi bhavati
  devanagari: ृणु जननि सर्वसहपदे स्थितः शम्भुर्देव्या सह वृषभमारुह्य पुरतः । प्रसन्नोऽहं वत्स त्वमपि वरयाभीष्टमिति
    मां कदा क्षान्ते ब्रूयादिति तदितरं नास्ति मनसि ॥ ३५॥ यजेऽहं बुध्येऽहं बहुतपसि तिष्ठाम्यहमिति भ्रमादात्मप्राप्तिं
    ह्यभिदधति निश्रेयसममी । कथा का वा तस्य त्वमिह विमुखा चेदलमलं महादेवक्षान्ते स्मरतु भवती तानिव न माम्
    ॥ ३६॥ तपस्यात्मद्रोहः सवनविषये जीवहननं वृथा तिष्ठेयं चेदहह सुतरां कर्मविरहः । ततः सर्वत्रापि स्फुरितमपराधं
    गमयितुं विना त्वां हे क्षान्ते कुशलमवलम्बं न मनवै ॥ ३७॥ विना चेत् त्वामेकां सकलमपि लोकप्रयतनं भवेन्मातः
    सत्यं करकृतमकूपारतरणम् । अहं दैवात् त्वय्याकलितनिजभारोऽस्मि परतो भवक्षान्ते चित्तं तव मम तु भाग्यं
    कथमिव ॥ ३८॥ प्रसादं वाञ्छन्ति प्रबलमपराधं तिरयितुं न मन्यन्ते किं ते निपुणमतयः शास्त्रकुशलाः । इमं
    तं धीमन्तं जननि मनवै यस्तव पदे प्रान्नः श्रीक्षान्ते सकृदपि भयाविष्टमनसा ॥ ३९॥ महादेवस्यैव श्रुतिमतमनुग्राहनिपुणं
    शिवां मूर्तिं प्राहुः कतिचिदपरे हन्त करुणाम् । अहं मन्ये क्षान्ते त्वमिति सकलानामुपरि ते प्रकाशो मन्तूनां
    सहनसमये जाग्रति मुहुः ॥ ४०॥ दयानाम्नी क्षान्ते तव निजसखी क्काप्यणुतरं न वैमुख्यं कर्त्रीं स्मरति हृदि
    पत्युर्विमुखताम् । न वैयात्यं तस्या ननु सकलकालेऽपि भवती
