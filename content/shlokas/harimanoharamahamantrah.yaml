id: harimanoharamahamantrah
category: mantra
name:
  english: harimanoharamahamantrah
  devanagari: हरिमनोहरमहामन्त्रः
content:
  english: caturvargaphalapraptyartham ca jape viniyogah || || rishyadinyasah || vasudevarishaye namah
    shirasi | gayatrichandase namah mukhe | shritripuradevatayai namah hridi | hare bijaya namah guhye
    | krishnashaktaye namah nabhau | ramakilakaya namah padayoh | viniyogaya namah sarvange || || karanyasah
    || hare krishna angushthabhyam namah | hare krishna tarjanibhyam svaha | krishna krishna madhyamabhyam
    vashat | hare hare anamikabhyam hum | hare rama kanishthikabhyam vaushat | hare rama rama rama hare
    hare karatalakaraprishthabhyam phat || || shadanganyasah || hare krishna hridayaya namah | hare krishna
    shirase svaha | krishna krishna shikhayai vashat | hare hare kavacaya hum | hare rama netratrayaya
    vaushat | hare rama rama rama hare hare astraya phat || || dhyanam || vrindavane ramyanikunjamadhye
    venum vahantam navanilamegham | barhavatamsam vanamalyashobham vande mukundam madhuradhinatham ||
    radhasamalingitavamabhagam mandasmitam kundaladiptagandam | premamritabdhim paramam dayalum dhyayeccitte
    harimanoharam tam || mantrah
  devanagari: चतुर्वर्गफलप्राप्त्यर्थं च जपे विनियोगः ॥ ॥ ऋष्यादिन्यासः ॥ वासुदेवऋषये नमः शिरसि । गायत्रीछन्दसे
    नमः मुखे । श्रीत्रिपुरादेवतायै नमः हृदि । हरे बीजाय नमः गुह्ये । कृष्णशक्तये नमः नाभौ । रामकीलकाय
    नमः पादयोः । विनियोगाय नमः सर्वाङ्गे ॥ ॥ करन्यासः ॥ हरे कृष्ण अङ्गुष्ठाभ्यां नमः । हरे कृष्ण तर्जनीभ्यां
    स्वाहा । कृष्ण कृष्ण मध्यमाभ्यां वषट् । हरे हरे अनामिकाभ्यां हुं । हरे राम कनिष्ठिकाभ्यां वौषट् ।
    हरे राम राम राम हरे हरे करतलकरपृष्ठाभ्यां फट् ॥ ॥ षडङ्गन्यासः ॥ हरे कृष्ण हृदयाय नमः । हरे कृष्ण शिरसे
    स्वाहा । कृष्ण कृष्ण शिखायै वषट् । हरे हरे कवचाय हुं । हरे राम नेत्रत्रयाय वौषट् । हरे राम राम राम
    हरे हरे अस्त्राय फट् ॥ ॥ ध्यानम् ॥ वृन्दावने रम्यनिकुञ्जमध्ये वेणुं वहन्तं नवनीलमेघम् । बर्हावतंसं
    वनमाल्यशोभं वन्दे मुकुन्दं मधुराधिनाथम् ॥ राधासमालिङ्गितवामभागं मन्दस्मितं कुण्डलदीप्तगण्डम् । प्रेमामृताब्धिं
    परमं दयालुं ध्यायेच्चित्ते हरिमनोहरं तम् ॥ मन्त्रः
