id: akrurakritamshrikrishnastotram-1
category: stotram
name:
  english: akrurakritamshrikrishnastotram 1
  devanagari: अक्रूरकृतंश्रीकृष्णस्तोत्रम् १
content:
  english: akrurakritam 1 shrikrishnastotram akrura uvaca | tanmatrarupine'cintyamahimne paramatmane |
    vyapine naikarupaikasvarupaya namo namah || 48|| shabdarupaya te'cintyahavirbhutaya te namah | namo
    vijnanarupaya paraya prakriteh prabho || 49|| bhutatma cendriyatma ca pradhanatma tatha bhavan | atma
    ca paramatma ca tvamekah pancadha sthitah || 50|| prasida sarvadharmatman ksharakshara maheshvara
    | brahmavishnushivadyabhih kalpanabhirudiritah || 51|| anakhyeyasvarupatmannanakhyeyaprayojana | anakhyeyabhidhana
    tvam nato'smi parameshvaram || 52|| na yatra natha vidyante namajatyadikalpanah | tadbrahma paramam
    nityamavikari bhavanajah || 53|| na kalpanamrite'rthasya sarvasyadhigamo yatah | tatah krishnacyutananta
    vishnusamjnabhiridyase || 54|| sarvatmamstvamaja vikalpanabhiretai
  devanagari: अक्रूरकृतं १ श्रीकृष्णस्तोत्रम् अक्रूर उवाच । तन्मात्ररूपिणेऽचिन्त्यमहिम्ने परमात्मने ।
    व्यापिने नैकरूपैकस्वरूपाय नमो नमः ॥ ४८॥ शब्दरूपाय तेऽचिन्त्यहविर्भूताय ते नमः । नमो विज्ञानरूपाय पराय
    प्रकृतेः प्रभो ॥ ४९॥ भूतात्मा चेन्द्रियात्मा च प्रधानात्मा तथा भवान् । आत्मा च परमात्मा च त्वमेकः
    पञ्चधा स्थितः ॥ ५०॥ प्रसीद सर्वधर्मात्मन् क्षराक्षर महेश्वर । ब्रह्मविष्णुशिवाद्याभिः कल्पनाभिरुदीरितः
    ॥ ५१॥ अनाख्येयस्वरूपात्मन्ननाख्येयप्रयोजन । अनाख्येयाभिधान त्वां नतोऽस्मि परमेश्वरम् ॥ ५२॥ न यत्र
    नाथ विद्यन्ते नामजात्यादिकल्पनाः । तद्ब्रह्म परमं नित्यमविकारि भवानजः ॥ ५३॥ न कल्पनामृतेऽर्थस्य सर्वस्याधिगमो
    यतः । ततः कृष्णाच्युतानन्त विष्णुसंज्ञाभिरीड्यसे ॥ ५४॥ सर्वात्मंस्त्वमज विकल्पनाभिरेतै
