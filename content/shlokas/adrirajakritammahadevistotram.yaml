id: adrirajakritammahadevistotram
category: stotram
name:
  english: adrirajakritammahadevistotram
  devanagari: अद्रिराजकृतंमहादेवीस्तोत्रम्
content:
  english: adrirajakritam mahadevistotram saundaryasindhusambhutacandrarekhamiva sthitam | upasritya mahadevim
    bhitabhita ivadrirat || 46|| pranamya shirasa bhumau bhuyo bhuyah prasadayan | tushtavasheshajananim
    visheshavidushimimam || 47|| amba vishvambhare matah prasida parameshvari | prasida karunapangasamrakshitacaracare
    || 48|| brahmopendrarudradyaih stuyamanamahodaye | samastabhuvanapayavyapohanakritodyame || 49|| namastubhyam
    mahadevi mayamohitadanave | papabhanjanapandityapadambujarajahkane || 50|| sargadau jagatam sakshatkathyate
    prakritih para | vaikhariti tato bhasi vaci vacaspaterapi || 51|| vaikharikanindraya tvaya drishtani
    catmanah | tvaya''dau vihito brahma rajasa sargasiddhaye || 52|| tvam vadanti punarvedah sthityai
    narayanatmikam | vishvavidhvamsanavidhau maharudrakalatmikam || 53|| kalakashthamuhurtashca rashinakshatrapanktayah
    | tvadamshavihita vedah tattvavakyapramanatah || 54|| bhoginam bhogajanani mumukshanam ca mokshada
    | karmakalagunatita maryadavyaktarupini || 55|| tvayi sarvamidam vishvam tvadajnagauravashrayam |
    yajanti tvam surassarve dhyayanti hridi yoginah || 56|| aradhayanti karmishthah dravyaih tattvasamudbhavaih
    | anvishyamana nigamaih agamairmantragarbhitaih || 57|| labdhaiva bhasi durlabhya sulabhya parameshituh
    | evam tvamadhuna bhasi madrisham drishtigocara || 58|| ashcaryamiva pashyami hyandhalabdho maniryatha
    | amba bhito'smi nitaram tvadrupalokanadaham || 59|| tvamaham darikam labdhva vanchami sukhamasitum
    | tatha prasida matastvam esha eva varo mama || 60|| iti tamraparnimahatmye prathamadhyayantargatam
    adrirajakritam mahadevistotram sampurnam | tamraparnimahatmya | adhyaya 1
  devanagari: अद्रिराजकृतं महादेवीस्तोत्रम् सौन्दर्यसिन्धुसम्भूतचन्द्ररेखामिव स्थिताम् । उपसृत्य महादेवीं
    भीतभीत इवाद्रिराट् ॥ ४६॥ प्रणम्य शिरसा भूमौ भूयो भूयः प्रसादयन् । तुष्टावाशेषजननीं विशेषविदुषीमिमाम्
    ॥ ४७॥ अम्ब विश्वम्भरे मातः प्रसीद परमेश्वरि । प्रसीद करुणापाङ्गसंरक्षितचराचरे ॥ ४८॥ ब्रह्मोपेन्द्ररुद्राद्यैः
    स्तूयमानमहोदये । समस्तभुवनापायव्यपोहनकृतोद्यमे ॥ ४९॥ नमस्तुभ्यं महादेवि मायामोहितदानवे । पापभञ्जनपाण्डित्यपादाम्बुजरजःकणे
    ॥ ५०॥ सर्गादौ जगतां साक्षात्कथ्यते प्रकृतिः परा । वैखरीति ततो भासि वाचि वाचस्पतेरपि ॥ ५१॥ वैखारिकाणीन्द्राय
    त्वया दृष्टानि चात्मनः । त्वयाऽऽदौ विहितो ब्रह्मा रजसा सर्गसिद्धये ॥ ५२॥ त्वां वदन्ति पुनर्वेदाः स्थित्यै
    नारायणात्मिकाम् । विश्वविध्वंसनविधौ महारुद्रकलात्मिकाम् ॥ ५३॥ कलाकाष्ठमुहूर्ताश्च राशिनक्षत्रपङ्क्तयः
    । त्वदंशविहिता वेदाः तत्त्ववाक्यप्रमाणतः ॥ ५४॥ भोगीनां भोगजननी मुमूक्षाणां च मोक्षदा । कर्मकालगुणातीता
    मर्यादाव्यक्तरूपिणी ॥ ५५॥ त्वयि सर्वमिदं विश्वं त्वदाज्ञागौरवाश्रयम् । यजन्ति त्वां सुरास्सर्वे ध्यायन्ति
    हृदि योगिनः ॥ ५६॥ आराधयन्ति कर्मिष्ठाः द्रव्यैः तत्त्वसमुद्भवैः । अन्विष्यमाणा निगमैः आगमैर्मन्त्रगर्भितैः
    ॥ ५७॥ लब्धैव भासि दुर्लभ्या सुलभ्या परमेशितुः । एवं त्वमधुना भासि मादृशां दृष्टिगोचरा ॥ ५८॥ आश्चर्यमिव
    पश्यामि ह्यन्धलब्धो मणिर्यथा । अम्ब भीतोऽस्मि नितरां त्वद्रूपालोकनादहम् ॥ ५९॥ त्वामहं दारिकां लब्ध्वा
    वाञ्छामि सुखमासितुम् । तथा प्रसीद मातस्त्वं एष एव वरो मम ॥ ६०॥ इति ताम्रपर्णीमाहात्म्ये प्रथमाध्यायान्तर्गतं
    अद्रिराजकृतं महादेवीस्तोत्रं सम्पूर्णम् । ताम्रपर्णीमाहात्म्य । अध्याय १
