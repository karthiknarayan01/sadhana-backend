id: manikyavacakashtottarashatanamastotram
category: stotram
name:
  english: manikyavacakashtottarashatanamastotram
  devanagari: माणिक्यवाचकाष्टोत्तरशतनामस्तोत्रम्
content:
  english: manikyavacakashtottarashatanamastotram akshasrakpustakodbhasihastam manikyavacakam | kashyapam
    samayacaryam dakshinatyam upasmahe || 1|| om | martandateja manikyavacako mananirbharah | mahendravarado
    mantri mayavirahitatmavan || 2|| marabadhavinirmukto maratunirajanghikah | marutashaphanabhusho maheshvarajaneshvarah
    || 3|| matrikanyasanirato matripadabjapujakah | mayapayavinirmukto manado margadarshakah || 4|| maravairikripapatrayamanottamavagjharah
    | mayavadavinirjeta mahatirthakritadarah || 5|| nirantaro nityatapa nityatripto nidhishvarah | nishkalanko
    nirihashca niyato nirahankritih || 6|| nimittajno niradharo nirmamo nityaranjanah | nityotsaho niratanko
    niyatijno niyamakah || 7|| niyanta nigamarthabdhivardhanotthanishapatih | karmanyah karunapurnah karanajnah
    kavishvarah || 8|| kalajnah kulakritkalyah kalanathamukhojjvalah | kambukanthah kalajnanah kaivalyapadabodhakah
    || 9|| karapadmadhritakshasrakpustakah kanakambarah | katitatilasatsutrah kaupinavaradharakah || 10||
    kirtimankamaribhaktah kamapashavivarjitah | vatagramadhipo vagmi vatulagamaparagah || 11|| vayvahareshavacano
    vacaspati samanadhih | varanasivasarato vanmadhuryajitamritah || 12|| vatapitapanasakho vayurogavivarjitah
    | vacalako vahinisho vacyavacakasundarah || 13|| vanmanotitavibhavo vasudevapadapriyah | varahimantraradjapta
    vamadevastutipriyah || 14|| vamangasundaratanurvanyaradhanatatparah | caturashcandaviryashca candajnashcandrashitalah
    || 15|| candamshusadrishajyotishcaturvedabdhiparagah | cancalyabhiccamatkari caturvarnyanupalakah
    || 16|| candrashekharabhaktashca candrarkagnisamaprabhah | caracarajaganmitram cinmurtishcancaladyutih
    || 17|| caturvaktramukhotpannashcaranashritabhupatih | candracudanibhaujashca candeshvarasamanadhih
    || 18|| kanjadrikkalyanashilah kashaya vasanojjvalah | kavatakathinoraskah kandarpasamakantiman ||
    19|| karpasayajnopaviti kalidoshanikrintanah | karindramandagamanah karunarasashevadhih || 20|| kalushaghnah
    kalalapah kavaci kashyapastatha | kanakangadadhari ca karmagranthivimocakah || 21|| kamaladvitpadadvandvah
    kamaniyah kuleshvarah | ashtottaramidam namnam shatam vatapurishituh || 22|| trisandhyam yah pathennityam
    vatarogadvimucyate | yogambikasanathasya kripapatram bhavecca sah || 23|| iti shrimanikyavacakashtottarashatanamastotram
    sampurnam |
  devanagari: माणिक्यवाचकाष्टोत्तरशतनामस्तोत्रम् अक्षस्रक्पुस्तकोद्भासिहस्तं माणिक्यवाचकम् । काश्यपं समयाचार्यं
    दाक्षिणात्यं उपास्महे ॥ १॥ ॐ । मार्ताण्डतेजा माणिक्यवाचको माननिर्भरः । महेन्द्रवरदो मन्त्री मायाविरहितात्मवान्
    ॥ २॥ मारबाधाविनिर्मुक्तो मारतूणीरजङ्घिकः । मारुताशफणाभूषो महेश्वरजनेश्वरः ॥ ३॥ मातृकान्यासनिरतो मातृपादाब्जपूजकः
    । मायापायविनिर्मुक्तो मानदो मार्गदर्शकः ॥ ४॥ मारवैरिकृपापात्रायमानोत्तमवाग्झरः । मायावादविनिर्जेता
    महातीर्थकृतादरः ॥ ५॥ निरन्तरो नित्यतपा नित्यतृप्तो निधीश्वरः । निष्कलङ्को निरीहश्च नियतो निरहङ्कृतिः
    ॥ ६॥ निमित्तज्ञो निराधारो निर्ममो नित्यरञ्जनः । नित्योत्साहो निरातङ्को नियतिज्ञो नियामकः ॥ ७॥ नियन्ता
    निगमार्थाब्धिवर्धनोत्थनिशापतिः । कर्मण्यः करुणापूर्णः कारणज्ञः कवीश्वरः ॥ ८॥ कालज्ञः कुलकृत्कल्यः
    कलानाथमुखोज्ज्वलः । कम्बुकण्ठः कलाज्ञानः कैवल्यपदबोधकः ॥ ९॥ करपद्मधृताक्षस्रक्पुस्तकः कनकाम्बरः ।
    कटीतटीलसत्सूत्रः कौपीनवरधारकः ॥ १०॥ कीर्तिमान्कामारिभक्तः कामपाशविवर्जितः । वातग्रामाधिपो वाग्मी वातूलागमपारगः
    ॥ ११॥ वाय्वाहारेशवचनो वाचस्पति समानधीः । वाराणसीवासरतो वाङ्माधुर्यजितामृतः ॥ १२॥ वातापितापनसखो वायुरोगविवर्जितः
    । वाचालको वाहिनीशो वाच्यवाचकसुन्दरः ॥ १३॥ वाङ्मनोतीतविभवो वासुदेवपदप्रियः । वाराहीमन्त्रराड्जप्ता
    वामदेवस्तुतिप्रियः ॥ १४॥ वामाङ्गसुन्दरतनुर्वाण्याराधनतत्परः । चतुरश्चण्डवीर्यश्च चण्डाज्ञश्चन्द्रशीतलः
    ॥ १५॥ चण्डांशुसदृशज्योतिश्चतुर्वेदाब्धिपारगः । चाञ्चल्यभिच्चमत्कारी चातुर्वर्ण्यानुपालकः ॥ १६॥ चन्द्रशेखरभक्तश्च
    चन्द्रार्काग्निसमप्रभः । चराचरजगन्मित्रं चिन्मूर्तिश्चञ्चलाद्युतिः ॥ १७॥ चतुर्वक्त्रमुखोत्पन्नश्चरणाश्रितभूपतिः
    । चन्द्रचूडनिभौजाश्च चण्डेश्वरसमानधीः ॥ १८॥ कञ्जदृक्कल्याणशीलः काषाय वसनोज्ज्वलः । कवाटकठिनोरस्कः
    कन्दर्पसमकान्तिमान् ॥ १९॥ कार्पासयज्ञोपवीती कलिदोषनिकृन्तनः । करीन्द्रमन्दगमनः करुणारसशेवधिः ॥ २०॥
    कलुषघ्नः कलालापः कवची काश्यपस्तथा । कनकाङ्गदधारी च कर्मग्रन्थिविमोचकः ॥ २१॥ कमलद्विट्पदद्वन्द्वः कमनीयः
    कुलेश्वरः । अष्टोत्तरमिदं नाम्नां शतं वातपुरीशितुः ॥ २२॥ त्रिसन्ध्यं यः पठेन्नित्यं वातरोगाद्विमुच्यते
    । योगाम्बिकासनाथस्य कृपापात्रं भवेच्च सः ॥ २३॥ इति श्रीमाणिक्यवाचकाष्टोत्तरशतनामस्तोत्रं सम्पूर्णम्
    ।
