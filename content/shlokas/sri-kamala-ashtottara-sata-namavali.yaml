    नमः । ॐ पद्माक्षधारिण्यै नमः । ॐ अम्बायै नमः । ॐ महाविष्णुप्रियङ्कर्यै नमः । ॐ गोलोकनाथरमण्यै नमः
    । ॐ गोलोकेश्वरपूजितायै नमः । ॐ गयायै नमः । ॐ गङ्गायै नमः । ॐ यमुनायै नमः । । ॐ गोमत्यै नमः । ॐ गरुडासनायै
