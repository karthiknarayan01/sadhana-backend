id: maha-saura-mantram
category: stotram
name:
  english: Maha Saura Mantram
content:
  english: va~hanti ketavah | drishe vishvaya suryam || apa tye tayavo yatha nakshatra yantyaktubhih |
    suraya vishvacakshase || adrishramasya ketavo vi rashmayo janan anu | bhrajanto agnayo yatha || shato
    jyotishkridasi surya | vishvama bhasi rocanam || pratyan devanam vishah pratyannudeshi manushan |
    pratyanvishvam svardrishe || yena pavaka cakshasa bhuranyantam jana~ anu | tvam vi dyameshi rajasprithvaha
    mimano aktubhih | pashyanjanmani surya || sapta tva harito rathe vahanti deva surya | shocishkesham
    ayukta sapta shundhyuva ssuro rathasya naptyah | tabhiryati svayuktibhih || ntamasaspari jyotishpashyanta
    uttaram | deva ndevatra suryamaganma jyotiruttamam || udyannadya mitramaha arohannuttaram divam |
    hridroga mmama surya harimanam ca nashaya || shukeshu me harimanam ropanakasu dadhmasi | atho haridraveshu
    me harimanam ni dadhmasi || udagadayamadityo vishvena sahasa saha | dvishantam mahyam randhayanmo
    aha ndevanamudagadanikam cakshurmitrasya varunasyagneh | apra dyavaprithivi antariksham surya atma
    jagatastasthushashca || suryo devimushasam rocamanam maryo na yoshamabhyeti pashcat | yatra naro devayanto
    yugani vitanvate prati bhadraya bhadram || bhadra ashva harita ssuryasya citra etagva anumadyasah
    | namasyanto diva a prishthamasthuh pari dyavaprithivi yanti sadyah || tatsuryasya devatva mmadhya
    kartorvitatam sa njabhara | yadedayukta haritah sadhasthadadratri vasastanute simasmai || tanmitrasya
    varunasyabhicakshe suryo rupa nkrinute dyorupasthe | anantamanyadrushadasya pajah krishnamanyaddharita
    adya deva udita suryasya niramhasah piprita niravadyat | tanno mitro varuno mamahantamaditi ssindhuh
    prithivi uta dyauh || va~runamagnimahuratho divya ssa suparno garutman | ekam sadvipra bahudha vadantyagnim
    mmatarishvanamahuh || ssuparna apo vasana divamutpatanti | ta avavritrantsadanadritasyadidghritena
    prithivi vyudyate || shshucishadvasurantarikshasaddhota vedishadatithirduronasat | nrishadvarasadritasadvyomasadabja
    goja ritaja adrija ritam || yattva surya svarbhanustamasavidhyadasurah | akshetravidyatha mugdho bhuvananyadidhayuh
    || yadadya surya bravo 'naga udyanmitraya varunaya satyam | vaya ndevatradite syama tava priyaso aryamangrinantah
    || utsuryo brihadarcimshyashretpuru vishva janima manushanam | samo diva dadrishe rocamanah kratva
    krita ssukritah kartribhirbhut || sa surya prati puro na udga ebhi sstomebhiretashebhirevaih | pra
    no mitraya varunaya voco 'nagaso aryamne agnaye ca || vi nah sahasram shurudho radantvritavano varuno
    mitro agnih | yacchantu candra upama nno arkama nah kamam pupurantu stavanah || udveti subhago vishvacaksha
    ssuryo manushanam | cakshurmitrasya varunasya devashcarmeva ya ssamavivyaktamamsi || udveti prasavita
    janana mmahanketurarnava ssuryasya | samana mparyavivritsanyadetasho vahati dhur vibhrajamana ushasamupasthadrebhairudetyanumadyamanah
    | esha me deva ssavita cacchanda ya nna praminati dhama || divo rukma urucaksha udeti dure arthastaranirbhrajamanah
    | nuna ssuryena prasuta ayannarthani krinavannapamsi || yatra cakruramrita gatumasmai shyeno na diyannanveti
    pathah || va~purdiva eti pratihvare | yadimashurvahati deva etasho vishvasmai cakshase aram || shno
    jagatastasthushaspatim samaya vishvama rajah | sapta svasara ssuvitaya suryam vahanti harito rathe
    || taccakshurdevahitam shukramuccarat | pashyema sharadah shata njivema sharadah shatam || banmaha~
    asi surya baladitya maha~ asi | mahaste sato mahima panasyate 'ddha deva maha~ asi || bat surya shravasa
    maha~ asi satra deva maha~ asi | mahna devanamasuryah purohito vibhu jyotiradabhyam || namo mitrasya
    varunasya cakshase maho devaya tadritam saparyata | duredrishe devajataya ketave divasputraya suryaya
    shamsata || sa ma satyoktih pari patu vishvato dyava ca yatra tatanannahani ca | vishvamanyanni vishate
    yadejati vishvahapo vishvahodeti suryah || na te adevah pradivo ni vasate yadetashebhih patarai ratharyasi
    | pracinamanyadanu vartate raja udanyena jyotisha yasi surya || yena surya jyotisha badhase tamo jagacca
    vishvamudiyar shi bhanuna | tenasmadvishvamaniramanahutimapamivamapa dushvapnyam suva || vishvasya
    hi preshito rakshasi vratamahelayannuccarasi svadha anu | yadadya tva suryopabravamahai ta nno deva
    anu mamsirata kratum || nno dyavaprithivi tanna apa indrah shrinvantu maruto havam vacah | ma shune
    bhuma suryasya sandrishi bhadra njivanto jaranamashimahi || vishvaha tva sumanasa ssucakshasah prajavanto
    anamiva anagasah | udyantam tva mitramaho divedive jyogjivah prati pashyema surya || mahi jyotirbibhrata
    ntva vicakshana bhasvantam cakshushe cakshushe mayah | arohanta mbrihatah pajasaspari vaya njivah
    prati pashyema surya || yasya te vishva bhuvanani ketuna pra cerate ni ca vishante aktubhih | anagastvena
    harikesha suryahnahna no vasyasavasyasodihi || nno bhava cakshasa sha mbhanuna sham hima sha nghrinena
    | yatha shamadhvanchamasaddurone tatsurya dravina asmakam deva ubhayaya janmane sharma yacchata dvipade
    catushpade | adatpibadurjayamanamashitam tadasme sham yadvo devashcakrima jihvaya guru manaso va prayuti
    devahelanam | arava yo no abhi ducchunayate tasmintadeno vasavo ni dhetana || suryo no divaspatu vato
    antarikshat | agnirnah parthivebhyah || josha savitaryasya te harah shatam sava~ ar hati | pahi no
    didyutah patantyah || ssavita cakshurna uta parvatah | cakshurdhata dadhatu nah || cakshurno dhehi
    cakshushe cakshurvikhyai tanubhyah | sa susandrisham tva vaya mprati pashyema surya | vi pashyema
    nricakshasah || vibhradbrihatpibatu somya mmadhvayurdadhadyajnapatavavihrutam | vatajuto yo abhirakshati
    tmana prajah puposha purudha vi rajati || vibhradbrihatsubhritam va~jasatamam dharmandivo dharune
    satyamarpitam | amitraha vritraha dasyuhantamam jyotirjajne asuraha sapatnaha || idam shreshtham jyotisham
    jyotiruttamam vi~shvajiddhanajiducyate brihat | vishvabhradbhrajo mahi suryo drisha uru paprathe saha
    ojo acyutam || vibhrajanjyotisha sva ndivah | yenema vishva bhuvananyabhrita vishvakarmana vishvadevyavata
    || ngauh prishnirakramidasadanmataram purah | pitaram ca prayantsvah || antashcarati rocanasya pranadapanati
    | vyakhyanmahisho divam || trimshaddhama vi rajati vakpatangaya dhiyate | prati vastoraha dyubhih
    || ncabhiddhattapaso 'dhyajayata | tato ratryajayata tatah samudro arnavah || samudradarnavadadhi
    sam va~tsaro ajayata | ahoratrani vidadhadvishvasya mishato vashi || suryacandramasau dhata yathapurvamakalpayat
    | divam ca prithivi ncantarikshamatho svah || savita pashcatatsavita purastatsavitottarattatsavitadharattat
    | savita nah suvatu sarvatatim savita no rasata
  devanagari: वँ॑हन्ति के॒तवः॑ । दृ॒शे विश्वा॑य॒ सूर्य॑म् ॥ अप॒ त्ये ता॒यवो॑ यथा॒ नक्ष॑त्रा यन्त्य॒क्तुभिः॑
    । सूरा॑य वि॒श्वच॑क्षसे ॥ अदृ॑श्रमस्य के॒तवो॒ वि र॒श्मयो॒ जना॒ङ् अनु॑ । भ्राज॑न्तो अ॒ग्नयो॑ यथा ॥ शतो
    ज्योति॒ष्कृद॑सि सूर्य । विश्व॒मा भा॑सि रोच॒नम् ॥ प्र॒त्यङ् दे॒वानां॒ विशः॑ प्र॒त्यङ्ङुदे॑षि॒ मानु॑षान्
    । प्र॒त्यङ्विश्वं॒ स्व॑र्दृ॒शे ॥ येना॑ पावक॒ चक्ष॑सा भुर॒ण्यन्तं॒ जना॒ँ अनु॑ । त्वं वि द्यामे॑षि॒
    रज॑स्पृ॒थ्वहा॒ मिमा॑नो अ॒क्तुभिः॑ । पश्य॒ञ्जन्मा॑नि सूर्य ॥ स॒प्त त्वा॑ ह॒रितो॒ रथे॒ वह॑न्ति देव सूर्य
    । शो॒चिष्के॑शं अयु॑क्त स॒प्त शु॒न्ध्युव॒ स्सूरो॒ रथ॑स्य न॒प्त्यः॑ । ताभि॑र्याति॒ स्वयु॑क्तिभिः ॥ न्तम॑स॒स्परि॒
    ज्योति॒ष्पश्य॑न्त॒ उत्त॑रम् । दे॒व न्दे॑व॒त्रा सूर्य॒मग॑न्म॒ ज्योति॑रुत्त॒मम् ॥ उ॒द्यन्न॒द्य मि॑त्रमह
    आ॒रोह॒न्नुत्त॑रां॒ दिव॑म् । हृ॒द्रो॒ग म्मम॑ सूर्य हरि॒माणं॑ च नाशय ॥ शुके॑षु मे हरि॒माणं॑ रोप॒णाका॑सु
    दध्मसि । अथो॑ हारिद्र॒वेषु॑ मे हरि॒माणं॒ नि द॑ध्मसि ॥ उद॑गाद॒यमा॑दि॒त्यो विश्वे॑न॒ सह॑सा स॒ह । द्वि॒षन्तं॒
    मह्यं॑ र॒न्धय॒न्मो अ॒ह न्दे॒वाना॒मुद॑गा॒दनी॑कं॒ चक्षु॑र्मि॒त्रस्य॒ वरु॑णस्या॒ग्नेः । आप्रा॒ द्यावा॑पृथि॒वी
    अ॒न्तरि॑क्षं॒ सूर्य॑ आ॒त्मा जग॑तस्त॒स्थुष॑श्च ॥ सूर्यो॑ दे॒वीमु॒षसं॒ रोच॑मानां॒ मर्यो॒ न योषा॑म॒भ्ये॑ति
    प॒श्चात् । यत्रा॒ नरो॑ देव॒यन्तो॑ यु॒गानि॑ वितन्व॒ते प्रति॑ भ॒द्राय॑ भ॒द्रम् ॥ भ॒द्रा अश्वा॑ ह॒रित॒
    स्सूर्य॑स्य चि॒त्रा एत॑ग्वा अनु॒माद्या॑सः । न॒म॒स्यन्तो॑ दि॒व आ पृ॒ष्ठम॑स्थुः॒ परि॒ द्यावा॑पृथि॒वी
    य॑न्ति स॒द्यः ॥ तत्सूर्य॑स्य देव॒त्व म्म॒ध्या कर्तो॒र्वित॑तं॒ स ञ्ज॑भार । य॒देदयु॑क्त ह॒रितः॑ स॒धस्था॒दाद्रात्री॒
    वास॑स्तनुते सि॒मस्मै॑ ॥ तन्मि॒त्रस्य॒ वरु॑णस्याभि॒चक्षे॒ सूर्यो॑ रू॒प ङ्कृ॑णुते॒ द्योरु॒पस्थे॑ । अ॒न॒न्तम॒न्यद्रुश॑दस्य॒
    पाजः॑ कृ॒ष्णम॒न्यद्ध॒रित॒ अ॒द्या दे॑वा॒ उदि॑ता॒ सूर्य॑स्य॒ निरंह॑सः पिपृ॒ता निर॑व॒द्यात् । तन्नो॑
    मि॒त्रो वरु॑णो मामहन्ता॒मदि॑ति॒ स्सिन्धुः॑ पृथि॒वी उ॒त द्यौः ॥ वँरु॑णम॒ग्निमा॑हु॒रथो॑ दि॒व्य स्स सु॑प॒र्णो
    ग॒रुत्मा॑न् । एकं॒ सद्विप्रा॑ बहु॒धा व॑दन्त्य॒ग्निं म्मा॑त॒रिश्वा॑नमाहुः ॥ स्सुप॒र्णा अ॒पो वसा॑ना॒
    दिव॒मुत्प॑तन्ति । त आव॑वृत्र॒न्त्सद॑नादृ॒तस्यादिद्घृ॒तेन॑ पृथि॒वी व्यु॑द्यते ॥ श्शु॑चि॒षद्वसु॑रन्तरिक्ष॒सद्धोता॑
    वेदि॒षदति॑थिर्दुरोण॒सत् । नृ॒षद्व॑र॒सदृ॑त॒सद्व्यो॑म॒सद॒ब्जा गो॒जा ऋ॑त॒जा अ॑द्रि॒जा ऋ॒तम् ॥ यत्त्वा॑
    सूर्य॒ स्व॑र्भानु॒स्तम॒सावि॑ध्यदासु॒रः । अक्षे॑त्रवि॒द्यथा॑ मु॒ग्धो भुव॑नान्यदीधयुः ॥ यद॒द्य सू॑र्य॒
    ब्रवो ऽना॑गा उ॒द्यन्मि॒त्राय॒ वरु॑णाय स॒त्यम् । व॒य न्दे॑व॒त्रादि॑ते स्याम॒ तव॑ प्रि॒यासो॑ अर्यमन्गृ॒णन्तः॑
    ॥ उत्सूर्यो॑ बृ॒हद॒र्चींष्य॑श्रेत्पु॒रु विश्वा॒ जनि॑म॒ मानु॑षाणाम् । स॒मो दि॒वा द॑दृशे॒ रोच॑मानः॒
    क्रत्वा॑ कृ॒त स्सुकृ॑तः क॒र्तृभि॑र्भूत् ॥ स सू॑र्य॒ प्रति॑ पु॒रो न॒ उद्गा॑ ए॒भि स्स्तोमे॑भिरेत॒शेभि॒रेवैः॑
    । प्र नो॑ मि॒त्राय॒ वरु॑णाय वो॒चो ऽना॑गसो अर्य॒म्णे अ॒ग्नये॑ च ॥ वि नः॑ स॒हस्रं॑ शु॒रुधो॑ रदन्त्वृ॒तावा॑नो॒
    वरु॑णो मि॒त्रो अ॒ग्निः । यच्छ॑न्तु च॒न्द्रा उ॑प॒म न्नो॑ अ॒र्कमा नः॒ कामं॑ पूपुरन्तु॒ स्तवा॑नाः ॥ उद्वे॑ति
    सु॒भगो॑ वि॒श्वच॑क्षा॒ स्सूर्यो॒ मानु॑षाणाम् । चक्षु॑र्मि॒त्रस्य॒ वरु॑णस्य दे॒वश्चर्मे॑व॒ य स्स॒मवि॑व्य॒क्तमां॑सि
    ॥ उद्वे॑ति प्रसवी॒ता जना॑ना म्म॒हान्के॒तुर॑र्ण॒व स्सूर्य॑स्य । स॒मा॒न म्प॑र्या॒विवृ॑त्स॒न्यदे॑त॒शो
    वह॑ति धू॒र् वि॒भ्राज॑मान उ॒षसा॑मु॒पस्था॑द्रे॒भैरुदे॑त्यनुम॒द्यमा॑नः । ए॒ष मे॑ दे॒व स्स॑वि॒ता च॑च्छन्द॒
    य न्न प्र॑मि॒नाति॒ धाम॑ ॥ दि॒वो रु॒क्म उ॑रु॒चक्षा॒ उदे॑ति दू॒रे अ॑र्थस्त॒रणि॒र्भ्राज॑मानः । नू॒न स्सूर्ये॑ण॒
    प्रसू॑ता॒ अय॒न्नर्था॑नि कृ॒णव॒न्नपां॑सि ॥ यत्रा॑ च॒क्रुर॒मृता॑ गा॒तुम॑स्मै श्ये॒नो न दीय॒न्नन्वे॑ति॒
    पाथः॑ ॥ वँपु॑र्दि॒व ए॑ति प्रतिह्व॒रे । यदी॑मा॒शुर्वह॑ति दे॒व एत॑शो॒ विश्व॑स्मै॒ चक्ष॑से॒ अर॑म् ॥ ष्णो॒
    जग॑तस्त॒स्थुष॒स्पतिं॑ स॒मया॒ विश्व॒मा रजः॑ । स॒प्त स्वसा॑र स्सुवि॒ताय॒ सूर्यं॒ वह॑न्ति ह॒रितो॒ रथे॑
    ॥ तच्चक्षु॑र्दे॒वहि॑तं शु॒क्रमु॒च्चर॑त् । पश्ये॑म श॒रदः॑ श॒त ञ्जीवे॑म श॒रदः॑ श॒तम् ॥ बण्म॒हाँ अ॑सि
    सूर्य॒ बला॑दित्य म॒हाँ अ॑सि । म॒हस्ते॑ स॒तो म॑हि॒मा प॑नस्यते॒ ऽद्धा दे॑व म॒हाँ अ॑सि ॥ बट् सू॑र्य॒
    श्रव॑सा म॒हाँ अ॑सि स॒त्रा दे॑व म॒हाँ अ॑सि । म॒ह्ना दे॒वाना॑मसु॒र्यः॑ पु॒रोहि॑तो वि॒भु ज्योति॒रदा॑भ्यम्
    ॥ नमो॑ मि॒त्रस्य॒ वरु॑णस्य॒ चक्ष॑से म॒हो दे॒वाय॒ तदृ॒तं स॑पर्यत । दू॒रे॒दृशे॑ दे॒वजा॑ताय के॒तवे॑ दि॒वस्पु॒त्राय॒
    सूर्या॑य शंसत ॥ सा मा॑ स॒त्योक्तिः॒ परि॑ पातु वि॒श्वतो॒ द्यावा॑ च॒ यत्र॑ त॒तन॒न्नहा॑नि च । विश्व॑म॒न्यन्नि
    वि॑शते॒ यदेज॑ति वि॒श्वाहापो॑ वि॒श्वाहोदे॑ति॒ सूर्यः॑ ॥ न ते॒ अदे॑वः प्र॒दिवो॒ नि वा॑सते॒ यदे॑त॒शेभिः॑
    पत॒रै र॑थ॒र्यसि॑ । प्रा॒चीन॑म॒न्यदनु॑ वर्तते॒ रज॒ उद॒न्येन॒ ज्योति॑षा यासि सूर्य ॥ येन॑ सूर्य॒ ज्योति॑षा॒
    बाध॑से॒ तमो॒ जग॑च्च॒ विश्व॑मुदि॒यर् षि॑ भा॒नुना॑ । तेना॒स्मद्विश्वा॒मनि॑रा॒मना॑हुति॒मपामी॑वा॒मप॑ दु॒ष्वप्न्यं॑
