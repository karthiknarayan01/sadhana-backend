id: guru108namastotra
category: stotram
name:
  english: guru108namastotra
  devanagari: गुरु१०८नामस्तोत्र
content:
  english: rigvedaparago riksharashimargapracarakah | sadanandah satyasandhah satyasamkalpamanasah ||
    13|| sarvagamajnah sarvajnah sarvavedantavidvarah | brahmaputro brahmanesho brahmavidyavisharadah
    || 14|| samanadhikanirmuktah sarvalokavashamvadah | sasurasuragandharvavanditah satyabhashanah ||
    15|| namah surendravandyaya devacaryaya te namah | namaste'nantasamarthya vedasiddhantaparagah ||
    16|| sadananda namaste'stu namah pidaharaya ca | namo vacaspate tubhyam namaste pitavasase || 17||
    namo'dvitiyarupaya lambakurcaya te namah | namah prakrishtanetraya vipranampataye namah || 18|| namo
    bhargavashishyaya vipannahitakarine | namaste surasainyanamvipatchidranaketave || 19|| brihaspatih
    suracaryo dayavan shubhalakshanah | lokatrayaguruh shriman sarvagah sarvatovibhuh || 20|| sarveshah
    sarvadatushtah sarvadah sarvapujitah | akrodhano munishreshtho diptikarta jagatpita || 21|| vishvatma
    vishvakarta ca vishvayonirayonijah | bhurbhuvodhanadasajabhaktajivo mahabalah || 22|| brihaspatih
    kashyapeyo dayavan shubhalakshanah | abhishtaphaladah shriman subhadgara namo'stu te || 23|| brihaspatissuracaryo
    devasurasupujitah | acaryodanavarishta suramantri purohitah || 24|| kalajnah kalarigvetta cittadashca
    prajapatih | vishnuh krishnah sadasukshmah pratidevojjvalagrahah || 25|| || iti gurvashtottarashatanamastotram
    sampurnam ||
  devanagari: ऋग्वेदपारगो ऋक्षराशिमार्गप्रचारकः । सदानन्दः सत्यसन्धः सत्यसंकल्पमानसः ॥ १३॥ सर्वागमज्ञः
    सर्वज्ञः सर्ववेदान्तविद्वरः । ब्रह्मपुत्रो ब्राह्मणेशो ब्रह्मविद्याविशारदः ॥ १४॥ समानाधिकनिर्मुक्तः
    सर्वलोकवशंवदः । ससुरासुरगन्धर्ववन्दितः सत्यभाषणः ॥ १५॥ नमः सुरेन्द्रवन्द्याय देवाचार्याय ते नमः ।
    नमस्तेऽनन्तसामर्थ्य वेदसिद्धान्तपारगः ॥ १६॥ सदानन्द नमस्तेऽस्तु नमः पीडाहराय च । नमो वाचस्पते तुभ्यं
    नमस्ते पीतवाससे ॥ १७॥ नमोऽद्वितीयरूपाय लम्बकूर्चाय ते नमः । नमः प्रकृष्टनेत्राय विप्राणाम्पतये नमः
    ॥ १८॥ नमो भार्गवषिष्याय विपन्नहितकारिणे । नमस्ते सुरसैन्यानांविपत्छिद्रानकेतवे ॥ १९॥ बृहस्पतिः सुराचार्यो
    दयावान् शुभलक्षणः । लोकत्रयगुरुः श्रीमान् सर्वगः सर्वतोविभुः ॥ २०॥ सर्वेशः सर्वदातुष्टः सर्वदः सर्वपूजितः
    । अक्रोधनो मुनिश्रेष्ठो दीप्तिकर्ता जगत्पिता ॥ २१॥ विश्वात्मा विश्वकर्ता च विश्वयोनिरयोनिजः । भूर्भुवोधनदासाजभक्ताजीवो
    महाबलः ॥ २२॥ बृहस्पतिः काष्यपेयो दयावान् षुभलक्षणः । अभीष्टफलदः श्रीमान् सुभद्गर नमोऽस्तु ते ॥ २३॥
    बृहस्पतिस्सुराचार्यो देवासुरसुपूजितः । आचार्योदानवारिष्ट सुरमन्त्री पुरोहितः ॥ २४॥ कालज्ञः कालऋग्वेत्ता
    चित्तदश्च प्रजापतिः । विष्णुः कृष्णः सदासूक्ष्मः प्रतिदेवोज्ज्वलग्रहः ॥ २५॥ ॥ इति गुर्वाष्टोत्तरशतनामस्तोत्रं
    सम्पूर्णम् ॥
