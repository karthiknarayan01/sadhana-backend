id: ganapatistotram-5-samantrakam-vasudevanandasarasvativiracitam
category: mantra
name:
  english: ganapatistotram 5 samantrakam (vasudevanandasarasvativiracitam)
  devanagari: गणपतिस्तोत्रम् ५ समन्त्रकम् (वासुदेवानन्दसरस्वतीविरचितम्)
content:
  english: ri nvarbhakoktivat | satka vi nam madhya eva naika nvam sha kavim kuru || 8|| shrivi na yaka
    te drishtya ko'pi nu nam bhavetkavih | tam tva mu masutam naumi sanma ti prada kamada || 9|| mama
    pa radhah kshantavyo nati bhih samprasida me | na na ma syavidhim jane tvam pra si dadya kevalam ||
    10|| na me shra ddha na me bhaktirna tva da rcanapaddhatih | jnata va danya te smiti bruve sa dhanavarjitah
    || 11|| kartum sta vam ca te'nishah prasi da kripayoddhara | prana mam kurve'to'nena sada nam da prasida
    me || 12|| iti shrivasudevanandasarasvativiracitam samantrakam shriganapatistotram sampurnam |
  devanagari: ृ ण्वर्भकोक्तिवत् । सत्क वी नां मध्य एव नैका ण्वं श कविं कुरु ॥ ८॥ श्रीवि ना यक ते दृष्ट्या
    कोऽपि नू नं भवेत्कविः । तं त्वा मु मासुतं नौमि सन्म ति प्रद कामद ॥ ९॥ ममा प राधः क्षन्तव्यो नति भिः
    सम्प्रसीद मे । न न म स्यविधिं जाने त्वं प्र सी दाद्य केवलम् ॥ १०॥ न मे श्र द्धा न मे भक्तिर्न त्व
    द र्चनपद्धतिः । ज्ञाता व दान्य ते स्मीति ब्रुवे सा धनवर्जितः ॥ ११॥ कर्तुं स्त वं च तेऽनीशः प्रसी द
    कृपयोद्धर । प्रणा मं कुर्वेऽतोऽनेन सदा नं द प्रसीद मे ॥ १२॥ इति श्रीवासुदेवानन्दसरस्वतीविरचितं समन्त्रकं
    श्रीगणपतिस्तोत्रं सम्पूर्णम् ।
meaning: {}
