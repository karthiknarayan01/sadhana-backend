id: kalabhairavashtakam
category: stotram
name:
  english: kalabhairavashtakam
  devanagari: कालभैरवाष्टकम्
content:
  english: attahasabhinnapadmajandkoshasamtatim drishtipatanashtapapajalamugrashasanam ashtasiddhidayakam
    kapalamalikadharam kashikapuradhinatha kalabhairavam bhaje
  devanagari: अट्टहासभिन्नपद्मजाण्ड्कोशसंततिं दृष्टिपातनष्टपापजालमुग्रशासनं अष्टसिद्धिदायकं कपालमालिकाधरं
    काशिकापुराधिनाथ कालभैरवम् भजे
meaning: {}
