id: jvarakrishnastotra
category: stotram
name:
  english: jvarakrishnastotra
  devanagari: ज्वरक्रिश्नस्तोत्र
content:
  english: jvarakritakrishnastotram shriganeshaya namah || vidravite bhutagane jvarastu trishirastripat
    | abhyapadyata dasharham dahanniva disho dasha | atha narayano devastam drishtva vyasrijajjvaram ||
    1|| maheshvaro vaishnavashca yuyudhate jvaravubhau | maheshvarah samakrandanvaishnavena balarditah
    || 2|| alabdhva'bhayamanyatra bhito maheshvarojvarah | sharanarthi hrishikesham tushtava prayatanjalih
    || 3|| jvara uvaca || namami tva'nantashaktim paresham sarvatmanam kevalam jnaptimatram | vishvotpattisthanasamrodhahetum
    yattadbrahma brahmalingam prashantam || 4|| kalo daivam karma jivahsvabhavo dravyam kshetram prana
    atma vikarah | tatsanghato bijarohapravahastvanmayaisha tannishedham prapadye || 5|| nanabhavairlilayaivopapannairdevansadhu~llokasetun
    bibharshi | hamsyunmarganhimsaya vartamanan janmaitatte bharaharaya bhumeh || 6|| tapto'ham te tejasa
    duhsahena shitogrenatyulbanena jvarena | tavattapo dehinam te'nghrimulam no severanyavadashanubaddhah
    || 7|| shribhagavanuvaca | trishiraste prasanno'smi vyetu te majjvaradbhayam | yo nau smarati samvadam
    tasya tvanna bhavedbhayam || 8|| ityukto'cyutamanamya gato maheshvaro jvarah || banastu rathamarudhah
    pragadyotsyan janardanam || 9|| iti shrimadbhagavate mahapurane paramahamsyam samhitayam dashamaskandhe
    uttarardhe trishashtitamoadhyaye shrijvarakritakrishnastotra sampurnam |
  devanagari: ज्वरकृतकृष्णस्तोत्रम् श्रीगणेशाय नमः ॥ विद्राविते भूतगणे ज्वरस्तु त्रिशिरास्त्रिपात् । अभ्यपद्यत
    दाशार्हं दहन्निव दिशो दश । अथ नारायणो देवस्तं दृष्ट्वा व्यसृजज्ज्वरम् ॥ १॥ माहेश्वरो वैष्णवश्च युयुधाते
    ज्वरावुभौ । माहेश्वरः समाक्रन्दन्वैष्णवेन बलार्दितः ॥ २॥ अलब्ध्वाऽभयमन्यत्र भीतो माहेश्वरोज्वरः ।
    शरणार्थी हृषीकेशं तुष्टाव प्रयताञ्जलिः ॥ ३॥ ज्वर उवाच ॥ नमामि त्वाऽनन्तशक्तिं परेशं सर्वात्मानं केवलं
    ज्ञप्तिमात्रम् । विश्वोत्पत्तिस्थानसंरोधहेतुं यत्तद्ब्रह्म ब्रह्मलिङ्गं प्रशान्तम् ॥ ४॥ कालो दैवं
    कर्म जीवःस्वभावो द्रव्यं क्षेत्रं प्राण आत्मा विकारः । तत्सङ्घातो बीजरोहप्रवाहस्त्वन्मायैषा तन्निषेधं
    प्रपद्ये ॥ ५॥ नानाभावैर्लीलयैवोपपन्नैर्देवान्साधूँल्लोकसेतून् बिभर्षि । हंस्युन्मार्गान्हिंसया वर्तमानान्
    जन्मैतत्ते भारहाराय भूमेः ॥ ६॥ तप्तोऽहं ते तेजसा दुःसहेन शीतोग्रेणात्युल्बणेन ज्वरेण । तावत्तापो देहिनां
    तेऽङ्घ्रिमूलं नो सेवेरन्यावदाशानुबद्धाः ॥ ७॥ श्रीभगवानुवाच । त्रिशिरस्ते प्रसन्नोऽस्मि व्येतु ते मज्ज्वराद्भयम्
    । यो नौ स्मरति संवादं तस्य त्वन्न भवेद्भयम् ॥ ८॥ इत्युक्तोऽच्युतमानम्य गतो माहेश्वरो ज्वरः ॥ बाणास्तु
    रथमारूढः प्रागाद्योत्स्यन् जनार्दनम् ॥ ९॥ इति श्रीमद्भागवते महापुराणे पारमहंस्यां संहितायां दशमस्कन्धे
    उत्तरर्धे त्रिषष्टितमोअध्याये श्रीज्वरकृतकृष्णस्तोत्र संपूर्णम् ।
