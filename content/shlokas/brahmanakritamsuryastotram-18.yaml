id: brahmanakritamsuryastotram-18
category: stotram
name:
  english: brahmanakritamsuryastotram 18
  devanagari: ब्रह्मणाकृतंसूर्यस्तोत्रम् १८
content:
  english: brahmana kritam suryastotram 18 brahmovaca | namasye yanmayam sarvametatsarvamayashca yah |
    vishvamurtih param jyotiryattaddhyayanti yoginah || 5|| ya rinmayo yo yajusham nidhanam samnam ca
    yo yoniracintyashaktih | trayimayah sthulatayardhamatra parasvarupo gunaparayogyah || 6|| tvam sarvahetum
    paramam ca vedyamadyam param jyotiravedyarupam | sthulam ca devatmataya namaste bhasvantamadyam paramam
    parebhyah || 7|| srishtim karomi yadaham tava shaktiradya tatprerito jalamahipavanagnirupam | taddevata''divishayam
    pranavadyashesham natmecchaya sthitilayavapi tadvadeva || 8|| vahnistvameva jalashoshanatah prithivyah
    srishtim karoshi jagatam ca tathadya pakam | vyapi tvameva bhagavangaganasvarupam tvam pancadha jagadidam
    paripasi vishvam || 9|| yajnairyajanti paramatmavido bhavantam vishnusvarupamakhileshtimayam vivasvan
    | dhyayanti capi yatayo niyatatmacittah sarveshvaram paramamatmavimuktikamah || 10|| namaste devarupaya
    yajnarupaya te namah | parabrahmasvarupaya cintyamanaya yogibhih || 11|| upasamhara tejo yattejasah
    samhatistava | srishtervighataya vibho srishtau caham samudyatah || 12|| iti markandeyapurane shatatamadhyayanatargatam
    brahmana kritam suryastotram samaptam | markandeyapurana | adhyaya 100
  devanagari: ब्रह्मणा कृतं सूर्यस्तोत्रम् १८ ब्रह्मोवाच । नमस्ये यन्मयं सर्वमेतत्सर्वमयश्च यः । विश्वमूर्तिः
    परं ज्योतिर्यत्तद्ध्यायन्ति योगिनः ॥ ५॥ य ऋङ्मयो यो यजुषां निधानं साम्नां च यो योनिरचिन्त्यशक्तिः
    । त्रयीमयः स्थूलतयार्धमात्रा परस्वरूपो गुणपारयोग्यः ॥ ६॥ त्वां सर्वहेतुं परमं च वेद्यमाद्यं परं ज्योतिरवेद्यरूपम्
    । स्थूलं च देवात्मतया नमस्ते भास्वन्तमाद्यं परमं परेभ्यः ॥ ७॥ सृष्टिं करोमि यदहं तव शक्तिराद्या तत्प्रेरितो
    जलमहीपवनाग्निरूपाम् । तद्देवताऽऽदिविषयां प्रणवाद्यशेषां नात्मेच्छया स्थितिलयावपि तद्वदेव ॥ ८॥ वह्निस्त्वमेव
    जलशोषणतः पृथिव्याः सृष्टिं करोषि जगतां च तथाद्य पाकम् । व्यापी त्वमेव भगवन्गगनस्वरूपं त्वं पञ्चधा
    जगदिदं परिपासि विश्वम् ॥ ९॥ यज्ञैर्यजन्ति परमात्मविदो भवन्तं विष्णुस्वरूपमखिलेष्टिमयं विवस्वन् । ध्यायन्ति
    चापि यतयो नियतात्मचित्ताः सर्वेश्वरं परममात्मविमुक्तिकामाः ॥ १०॥ नमस्ते देवरूपाय यज्ञरूपाय ते नमः
    । परब्रह्मस्वरूपाय चिन्त्यमानाय योगिभिः ॥ ११॥ उपसंहर तेजो यत्तेजसः संहतिस्तव । सृष्टेर्विघाताय विभो
    सृष्टौ चाहं समुद्यतः ॥ १२॥ इति मार्कण्डेयपुराणे शततमाध्यायानतर्गतं ब्रह्मणा कृतं सूर्यस्तोत्रं समाप्तम्
    । मार्कण्डेयपुराण । अध्याय १००
