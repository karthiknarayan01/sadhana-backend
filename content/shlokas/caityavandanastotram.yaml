id: caityavandanastotram
category: stotram
name:
  english: caityavandanastotram
  devanagari: चैत्यवन्दनास्तोत्रम्
content:
  english: ringe patale vaijayante dhanapatinilaye siddhagandharvaloke brahmande vishnubhumyam pashupatinagare
    candrasuryatireke ye canye dhatucaitya dashabalavalita tan namasyami buddhan || 3|| kashmire cinadeshe
    khasatavarapure balkale simhale va ratadye simhapote satatamaviratam vallakhe kapilakhye | nepale
    kamarupe kuvasavarapure kantishobhasarate ye canye dhatucaitya dashabalavalita tan namasyami buddhan
    || 4|| ye ca syurdhatugarbha dashabalatanujah kumbhasamjnashca caityah angarah ksharasthane himarajatanumastuparatnaprakasham
    | patale ye ca bhumyam girishikharagata ye ca vittah samantad buddhanam ye ca vimbah pratidinasukritastan
    namasyami buddhan || 5|| iti shri caityavandana samapta ||
  devanagari: ृङ्गे पाताले वैजयन्ते धनपतिनिलये सिद्धगन्धर्वलोके ब्रह्माण्डे विष्णुभूम्यां पशुपतिनगरे चन्द्रसूर्यातिरेके
    ये चान्ये धातुचैत्या दशबलवलिता तान् नमस्यामि बुद्धान् ॥ ३॥ काश्मीरे चीनदेशे खसतवरपुरे बल्कले सिंहले
    वा राताद्ये सिंहपोटे सततमविरतं वल्लखे कापिलाख्ये । नेपाले कामरूपे कुवसवरपुरे कान्तिशोभासराते ये चान्ये
    धातुचैत्या दशबलवलिता तान् नमस्यामि बुद्धान् ॥ ४॥ ये च स्युर्धातुगर्भा दशबलतनुजाः कुम्भसंज्ञाश्च चैत्याः
    अङ्गाराः क्षारस्थाने हिमरजतनुमास्तूपरत्नप्रकाशम् । पाताले ये च भूम्यां गिरिशिखरगता ये च वित्ताः समन्ताद्
    बुद्धानां ये च विम्बाः प्रतिदिनसुकृतस्तान् नमस्यामि बुद्धान् ॥ ५॥ इति श्री चैत्यवन्दना समाप्ता ॥
