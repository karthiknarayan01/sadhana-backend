id: brahmakritamharistotram
category: stotram
name:
  english: brahmakritamharistotram
  devanagari: ब्रह्मकृतंहरिस्तोत्रम्
content:
  english: brahmakritam haristotram brahmovaca | raksha raksha hare mam ca nimagnam kamasagare | dushkirtijalapurne
    ca dushpare bahusankate || 73|| bhaktivismritibije ca vipatsopanadustare | ativa nirmalajnanacakshuhprachannakarane
    || 74|| janmormisanghasahite yoshinnakraughasankule | ratisrotahsamayukte gambhire ghora eva ca ||
    75|| prathamamritarupe ca parinamavishalaye | yamalayapradeshaya muktidvarativismrite || 76|| buddhya
    taranya vijnanairuddharasmanatah svayam | svayam ca tvam karnadharah prasida madhusudana || 77|| madvidhah
    katicinnatha niyojya bhavakarmani | santi vishvesha vidhayo he vishveshvara madhava || 78|| na karmakshetramevedam
    brahmaloko'yamipsitah | tathapi nah spriha kame tvadbhaktivyavadhayake || 79|| he natha karunasindho
    dinabandho kripam kuru | tvam mahesha mahajnata duhsvapnam mam na darshaya || 80|| ityuktva jagatam
    dhata virarama sanatanah | dhyayam dhyayam matpadabjam shashvatsasmara mamiti || 81|| brahmana ca
    kritam stotram bhaktiyuktashca yah pathet | sa caivakarnya vishaye na nimagno bhaveddhruvam || 82||
    mama mayam vinirjitya samjnanam labhate dhruvam | iha loke bhaktiyukto madbhaktapravaro bhavet ||
    83|| iti shribrahmavaivartapurane shrikrishnajanmakhande purve dvatrimshadhyayantargatam brahmakritam
    haristotram samaptam | brahmavaivartapurana | shrikrishnajanma
  devanagari: ब्रह्मकृतं हरिस्तोत्रम् ब्रह्मोवाच । रक्ष रक्ष हरे मां च निमग्नं कामसागरे । दुष्कीर्तिजलपूर्णे
    च दुष्पारे बहुसङ्कटे ॥ ७३॥ भक्तिविस्मृतिबीजे च विपत्सोपानदुस्तरे । अतीव निर्मलज्ञानचक्षुःप्रछन्नकारणे
    ॥ ७४॥ जन्मोर्मिसङ्घसहिते योषिन्नक्रौघसङ्कुले । रतिस्रोतःसमायुक्ते गम्भीरे घोर एव च ॥ ७५॥ प्रथमामृतरूपे
    च परिणामविषालये । यमालयप्रदेशाय मुक्तिद्वारातिविस्मृते ॥ ७६॥ बुद्ध्या तरण्या विज्ञानैरुद्धरास्मानतः
    स्वयम् । स्वयं च त्वं कर्णधारः प्रसीद मधुसूदन ॥ ७७॥ मद्विधाः कतिचिन्नाथ नियोज्या भवकर्मणि । सन्ति
    विश्वेश विधयो हे विश्वेश्वर माधव ॥ ७८॥ न कर्मक्षेत्रमेवेदं ब्रह्मलोकोऽयमीप्सितः । तथापि नः स्पृहा
    कामे त्वद्भक्तिव्यवधायके ॥ ७९॥ हे नाथ करुणासिन्धो दीनबन्धो कृपां कुरु । त्वं महेश महाज्ञाता दुःस्वप्नं
    मां न दर्शय ॥ ८०॥ इत्युक्त्वा जगतां धाता विरराम सनातनः । ध्यायं ध्यायं मत्पदाब्जं शश्वत्सस्मार मामिति
    ॥ ८१॥ ब्रह्मणा च कृतं स्तोत्रं भक्तियुक्तश्च यः पठेत् । स चैवाकर्ण्य विषये न निमग्नो भवेद्ध्रुवम्
    ॥ ८२॥ मम मायां विनिर्जित्य संज्ञानं लभते ध्रुवम् । इह लोके भक्तियुक्तो मद्भक्तप्रवरो भवेत् ॥ ८३॥ इति
    श्रीब्रह्मवैवर्तपुराणे श्रीकृष्णजन्मखण्डे पूर्वे द्वात्रिंशाध्यायान्तर्गतं ब्रह्मकृतं हरिस्तोत्रं
    समाप्तम् । ब्रह्मवैवर्तपुराण । श्रीकृष्णजन्म
