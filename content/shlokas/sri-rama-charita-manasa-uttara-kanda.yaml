    हरिजान नारि बिष्नु माया प्रगट ॥ ॥ इहाँ न पच्छपात कछु राखुँ। बेद पुरान सन्त मत भाषुँ ॥ मोह न नारि नारि
    कें रूपा। पन्नगारि यह रीति अनूपा ॥ माया भगति सुनहु तुम्ह दोऊ। नारि बर्ग जानि सब कोऊ ॥ पुनि रघुबीरहि
    भगति पिआरी। माया खलु नर्तकी बिचारी ॥ भगतिहि सानुकूल रघुराया। ताते तेहि डरपति अति माया ॥ राम भगति निरुपम
    निरुपाधी। बसि जासु उर सदा अबाधी ॥ तेहि बिलोकि माया सकुचाई। करि न सकि कछु निज प्रभुताई ॥ अस बिचारि
    जे मुनि बिग्यानी। जाचहीं भगति सकल सुख खानी ॥ दो यह रहस्य रघुनाथ कर बेगि न जानि कोइ। जो जानि रघुपति
    कृपाँ सपनेहुँ मोह न होइ ॥ ॥ औरु ग्यान भगति कर भेद सुनहु सुप्रबीन। जो सुनि होइ राम पद प्रीति सदा अबिछीन
    ॥ ॥ सुनहु तात यह अकथ कहानी। समुझत बनि न जाइ बखानी ॥ ईस्वर अंस जीव अबिनासी। चेतन अमल सहज सुख रासी ॥
    सो मायाबस भयु गोसाईं। बँध्यो कीर मरकट की नाई ॥ जड़ चेतनहि ग्रन्थि परि गी। जदपि मृषा छूटत कठिनी ॥ तब
    ते जीव भयु संसारी। छूट न ग्रन्थि न होइ सुखारी ॥ श्रुति पुरान बहु कहेउ उपाई। छूट न अधिक अधिक अरुझाई
    ॥ जीव हृदयँ तम मोह बिसेषी। ग्रन्थि छूट किमि परि न देखी ॥ अस सञ्जोग ईस जब करी। तबहुँ कदाचित सो निरुअरी
    ॥ सात्त्विक श्रद्धा धेनु सुहाई। जौं हरि कृपाँ हृदयँ बस आई ॥ जप तप ब्रत जम नियम अपारा। जे श्रुति कह
    सुभ धर्म अचारा ॥ तेइ तृन हरित चरै जब गाई। भाव बच्छ सिसु पाइ पेन्हाई ॥ नोइ निबृत्ति पात्र बिस्वासा।
    निर्मल मन अहीर निज दासा ॥ परम धर्ममय पय दुहि भाई। अवटै अनल अकाम बिहाई ॥ तोष मरुत तब छमाँ जुड़आवै।
    धृति सम जावनु देइ जमावै ॥ मुदिताँ मथैं बिचार मथानी। दम अधार रजु सत्य सुबानी ॥ तब मथि काढ़इ लेइ नवनीता।
    बिमल बिराग सुभग सुपुनीता ॥ दो जोग अगिनि करि प्रगट तब कर्म सुभासुभ लाइ। बुद्धि सिरावैं ग्यान घृत ममता
    मल जरि जाइ ॥ ॥ तब बिग्यानरूपिनि बुद्धि बिसद घृत पाइ। चित्त दिआ भरि धरै दृढ़ समता दिअटि बनाइ ॥ ॥ तीनि
    अवस्था तीनि गुन तेहि कपास तें काढ़इ। तूल तुरीय सँवारि पुनि बाती करै सुगाढ़इ ॥ एहि बिधि लेसै दीप तेज
    रासि बिग्यानमय ॥ जातहिं जासु समीप जरहिं मदादिक सलभ सब ॥ ॥ सोहमस्मि इति बृत्ति अखण्डा। दीप सिखा सोइ
    परम प्रचण्डा ॥ आतम अनुभव सुख सुप्रकासा। तब भव मूल भेद भ्रम नासा ॥ प्रबल अबिद्या कर परिवारा। मोह आदि
    तम मिटि अपारा ॥ तब सोइ बुद्धि पाइ उँजिआरा। उर गृहँ बैठि ग्रन्थि निरुआरा ॥ छोरन ग्रन्थि पाव जौं सोई।
    तब यह जीव कृतारथ होई ॥ छोरत ग्रन्थि जानि खगराया। बिघ्न अनेक करि तब माया ॥ रिद्धि सिद्धि प्रेरि बहु
    भाई। बुद्धहि लोभ दिखावहिं आई ॥ कल बल छल करि जाहिं समीपा। अञ्चल बात बुझावहिं दीपा ॥ होइ बुद्धि जौं
    परम सयानी। तिन्ह तन चितव न अनहित जानी ॥ जौं तेहि बिघ्न बुद्धि नहिं बाधी। तौ बहोरि सुर करहिं उपाधी
    ॥ इन्द्रीं द्वार झरोखा नाना। तहँ तहँ सुर बैठे करि थाना ॥ आवत देखहिं बिषय बयारी। ते हठि देही कपाट उघारी
    ॥ जब सो प्रभञ्जन उर गृहँ जाई। तबहिं दीप बिग्यान बुझाई ॥ ग्रन्थि न छूटि मिटा सो प्रकासा। बुद्धि बिकल
    भि बिषय बतासा ॥ इन्द्रिन्ह सुरन्ह न ग्यान सोहाई। बिषय भोग पर प्रीति सदाई ॥ बिषय समीर बुद्धि कृत भोरी।
    तेहि बिधि दीप को बार बहोरी ॥ दो तब फिरि जीव बिबिध बिधि पावि संसृति क्लेस। हरि माया अति दुस्तर तरि
    न जाइ बिहगेस ॥ ॥ कहत कठिन समुझत कठिन साधन कठिन बिबेक। होइ घुनाच्छर न्याय जौं पुनि प्रत्यूह अनेक ॥
    ॥ ग्यान पन्थ कृपान कै धारा। परत खगेस होइ नहिं बारा ॥ जो निर्बिघ्न पन्थ निर्बही। सो कैवल्य परम पद लही
    ॥ अति दुर्लभ कैवल्य परम पद। सन्त पुरान निगम आगम बद ॥ राम भजत सोइ मुकुति गोसाई। अनिच्छित आवि बरिआई
    ॥ जिमि थल बिनु जल रहि न सकाई। कोटि भाँति कौ करै उपाई ॥ तथा मोच्छ सुख सुनु खगराई। रहि न सकि हरि भगति
    बिहाई ॥ अस बिचारि हरि भगत सयाने। मुक्ति निरादर भगति लुभाने ॥ भगति करत बिनु जतन प्रयासा। संसृति मूल
    अबिद्या नासा ॥ भोजन करिअ तृपिति हित लागी। जिमि सो असन पचवै जठरागी ॥ असि हरिभगति सुगम सुखदाई। को अस
    मूढ़ न जाहि सोहाई ॥ दो सेवक सेब्य भाव बिनु भव न तरिअ उरगारि ॥ भजहु राम पद पङ्कज अस सिद्धान्त बिचारि
    ॥ ॥ जो चेतन कहँ ज़ड़ करि ज़ड़हि करि चैतन्य। अस समर्थ रघुनायकहिं भजहिं जीव ते धन्य ॥ ॥ कहेउँ ग्यान
    सिद्धान्त बुझाई। सुनहु भगति मनि कै प्रभुताई ॥ राम भगति चिन्तामनि सुन्दर। बसि गरुड़ जाके उर अन्तर ॥
    परम प्रकास रूप दिन राती। नहिं कछु चहिअ दिआ घृत बाती ॥ मोह दरिद्र निकट नहिं आवा। लोभ बात नहिं ताहि
    बुझावा ॥ प्रबल अबिद्या तम मिटि जाई। हारहिं सकल सलभ समुदाई ॥ खल कामादि निकट नहिं जाहीं। बसि भगति जाके
    उर माहीम् ॥ गरल सुधासम अरि हित होई। तेहि मनि बिनु सुख पाव न कोई ॥ ब्यापहिं मानस रोग न भारी। जिन्ह
    के बस सब जीव दुखारी ॥ राम भगति मनि उर बस जाकें। दुख लवलेस न सपनेहुँ ताकेम् ॥ चतुर सिरोमनि तेइ जग माहीं।
    जे मनि लागि सुजतन कराहीम् ॥ सो मनि जदपि प्रगट जग अही। राम कृपा बिनु नहिं कौ लही ॥ सुगम उपाय पाइबे
    केरे। नर हतभाग्य देहिं भटमेरे ॥ पावन पर्बत बेद पुराना। राम कथा रुचिराकर नाना ॥ मर्मी सज्जन सुमति कुदारी।
    ग्यान बिराग नयन उरगारी ॥ भाव सहित खोजि जो प्रानी। पाव भगति मनि सब सुख खानी ॥ मोरें मन प्रभु अस बिस्वासा।
    राम ते अधिक राम कर दासा ॥ राम सिन्धु घन सज्जन धीरा। चन्दन तरु हरि सन्त समीरा ॥ सब कर फल हरि भगति सुहाई।
    सो बिनु सन्त न काहूँ पाई ॥ अस बिचारि जोइ कर सतसङ्गा। राम भगति तेहि सुलभ बिहङ्गा ॥ दो ब्रह्म पयोनिधि
    मन्दर ग्यान सन्त सुर आहिं। कथा सुधा मथि काढ़हिं भगति मधुरता जाहिम् ॥ ॥ बिरति चर्म असि ग्यान मद लोभ
    मोह रिपु मारि। जय पाइअ सो हरि भगति देखु खगेस बिचारि ॥ ॥ पुनि सप्रेम बोलेउ खगर् । जौं कृपाल मोहि ऊपर
    भ् ॥ नाथ मोहि निज सेवक जानी। सप्त प्रस्न कहहु बखानी ॥ प्रथमहिं कहहु नाथ मतिधीरा। सब ते दुर्लभ कवन
    सरीरा ॥ बड़ दुख कवन कवन सुख भारी। सौ सञ्छेपहिं कहहु बिचारी ॥ सन्त असन्त मरम तुम्ह जानहु। तिन्ह कर
    सहज सुभाव बखानहु ॥ कवन पुन्य श्रुति बिदित बिसाला। कहहु कवन अघ परम कराला ॥ मानस रोग कहहु समुझाई। तुम्ह
    सर्बग्य कृपा अधिकाई ॥ तात सुनहु सादर अति प्रीती। मैं सञ्छेप कहुँ यह नीती ॥ नर तन सम नहिं कवनिउ देही।
    जीव चराचर जाचत तेही ॥ नरक स्वर्ग अपबर्ग निसेनी। ग्यान बिराग भगति सुभ देनी ॥ सो तनु धरि हरि भजहिं न
    जे नर। होहिं बिषय रत मन्द मन्द तर ॥ काँच किरिच बदलें ते लेही। कर ते डारि परस मनि देहीम् ॥ नहिं दरिद्र
    सम दुख जग माहीं। सन्त मिलन सम सुख जग नाहीम् ॥ पर उपकार बचन मन काया। सन्त सहज सुभाउ खगराया ॥ सन्त सहहिं
    दुख परहित लागी। परदुख हेतु असन्त अभागी ॥ भूर्ज तरू सम सन्त कृपाला। परहित निति सह बिपति बिसाला ॥ सन
    इव खल पर बन्धन करी। खाल कढ़आइ बिपति सहि मरी ॥ खल बिनु स्वारथ पर अपकारी। अहि मूषक इव सुनु उरगारी ॥
    पर सम्पदा बिनासि नसाहीं। जिमि ससि हति हिम उपल बिलाहीम् ॥ दुष्ट उदय जग आरति हेतू। जथा प्रसिद्ध अधम
    ग्रह केतू ॥ सन्त उदय सन्तत सुखकारी। बिस्व सुखद जिमि इन्दु तमारी ॥ परम धर्म श्रुति बिदित अहिंसा। पर
    निन्दा सम अघ न गरीसा ॥ हर गुर निन्दक दादुर होई। जन्म सहस्र पाव तन सोई ॥ द्विज निन्दक बहु नरक भोगकरि।
    जग जनमि बायस सरीर धरि ॥ सुर श्रुति निन्दक जे अभिमानी। रौरव नरक परहिं ते प्रानी ॥ होहिं उलूक सन्त निन्दा
    रत। मोह निसा प्रिय ग्यान भानु गत ॥ सब के निन्दा जे जड़ करहीं। ते चमगादुर होइ अवतरहीम् ॥ सुनहु तात
    अब मानस रोगा। जिन्ह ते दुख पावहिं सब लोगा ॥ मोह सकल ब्याधिन्ह कर मूला। तिन्ह ते पुनि उपजहिं बहु सूला
    ॥ काम बात कफ लोभ अपारा। क्रोध पित्त नित छाती जारा ॥ प्रीति करहिं जौं तीनिउ भाई। उपजि सन्यपात दुखदाई
    ॥ बिषय मनोरथ दुर्गम नाना। ते सब सूल नाम को जाना ॥ ममता दादु कण्डु इरषाई। हरष बिषाद गरह बहुताई ॥ पर
    सुख देखि जरनि सोइ छी। कुष्ट दुष्टता मन कुटिली ॥ अहङ्कार अति दुखद डमरुआ। दम्भ कपट मद मान नेहरुआ ॥ तृस्ना
    उदरबृद्धि अति भारी। त्रिबिध ईषना तरुन तिजारी ॥ जुग बिधि ज्वर मत्सर अबिबेका। कहँ लागि कहौं कुरोग अनेका
    ॥ दो एक ब्याधि बस नर मरहिं ए असाधि बहु ब्याधि। पीड़हिं सन्तत जीव कहुँ सो किमि लहै समाधि ॥ ॥ नेम धर्म
    आचार तप ग्यान जग्य जप दान। भेषज पुनि कोटिन्ह नहिं रोग जाहिं हरिजान ॥ ॥ एहि बिधि सकल जीव जग रोगी। सोक
    हरष भय प्रीति बियोगी ॥ मानक रोग कछुक मैं गाए। हहिं सब कें लखि बिरलेन्ह पाए ॥ जाने ते छीजहिं कछु पापी।
    नास न पावहिं जन परितापी ॥ बिषय कुपथ्य पाइ अङ्कुरे। मुनिहु हृदयँ का नर बापुरे ॥ राम कृपाँ नासहि सब
    रोगा। जौं एहि भाँति बनै संयोगा ॥ सदगुर बैद बचन बिस्वासा। सञ्जम यह न बिषय कै आसा ॥ रघुपति भगति सजीवन
    मूरी। अनूपान श्रद्धा मति पूरी ॥ एहि बिधि भलेहिं सो रोग नसाहीं। नाहिं त जतन कोटि नहिं जाहीम् ॥ जानिअ
    तब मन बिरुज गोसाँई। जब उर बल बिराग अधिकाई ॥ सुमति छुधा बाढ़इ नित नी। बिषय आस दुर्बलता गी ॥ बिमल ग्यान
    जल जब सो नहाई। तब रह राम भगति उर छाई ॥ सिव अज सुक सनकादिक नारद। जे मुनि ब्रह्म बिचार बिसारद ॥ सब कर
    मत खगनायक एहा। करिअ राम पद पङ्कज नेहा ॥ श्रुति पुरान सब ग्रन्थ कहाहीं। रघुपति भगति बिना सुख नाहीम्
    ॥ कमठ पीठ जामहिं बरु बारा। बन्ध्या सुत बरु काहुहि मारा ॥ फूलहिं नभ बरु बहुबिधि फूला। जीव न लह सुख
    हरि प्रतिकूला ॥ तृषा जाइ बरु मृगजल पाना। बरु जामहिं सस सीस बिषाना ॥ अन्धकारु बरु रबिहि नसावै। राम
    बिमुख न जीव सुख पावै ॥ हिम ते अनल प्रगट बरु होई। बिमुख राम सुख पाव न कोई ॥ दो बारि मथें घृत होइ बरु
    सिकता ते बरु तेल। बिनु हरि भजन न भव तरिअ यह सिद्धान्त अपेल ॥ ॥ मसकहि करि बिंरञ्चि प्रभु अजहि मसक ते
    हीन। अस बिचारि तजि संसय रामहि भजहिं प्रबीन ॥ विनिच्श्रितं वदामि ते न अन्यथा वचांसि मे। हरिं नरा भजन्ति
    येऽतिदुस्तरं तरन्ति ते ॥ ॥ कहेउँ नाथ हरि चरित अनूपा। ब्यास समास स्वमति अनुरुपा ॥ श्रुति सिद्धान्त
    इहि उरगारी। राम भजिअ सब काज बिसारी ॥ प्रभु रघुपति तजि सेइअ काही। मोहि से सठ पर ममता जाही ॥ तुम्ह बिग्यानरूप
    नहिं मोहा। नाथ कीन्हि मो पर अति छोहा ॥ पूछिहुँ राम कथा अति पावनि। सुक सनकादि सम्भु मन भावनि ॥ सत सङ्गति
    दुर्लभ संसारा। निमिष दण्ड भरि एकु बारा ॥ देखु गरुड़ निज हृदयँ बिचारी। मैं रघुबीर भजन अधिकारी ॥ सकुनाधम
    सब भाँति अपावन। प्रभु मोहि कीन्ह बिदित जग पावन ॥ दो आजु धन्य मैं धन्य अति जद्यपि सब बिधि हीन। निज
    जन जानि राम मोहि सन्त समागम दीन ॥ ॥ नाथ जथामति भाषेउँ राखेउँ नहिं कछु गोइ। चरित सिन्धु रघुनायक थाह
    कि पावि कोइ ॥ ॥ सुमिरि राम के गुन गन नाना। पुनि पुनि हरष भुसुण्डि सुजाना ॥ महिमा निगम नेति करि गाई।
    अतुलित बल प्रताप प्रभुताई ॥ सिव अज पूज्य चरन रघुराई। मो पर कृपा परम मृदुलाई ॥ अस सुभाउ कहुँ सुनुँ
    न देखुँ। केहि खगेस रघुपति सम लेखुँ ॥ साधक सिद्ध बिमुक्त उदासी। कबि कोबिद कृतग्य सन्न्यासी ॥ जोगी सूर
    सुतापस ग्यानी। धर्म निरत पण्डित बिग्यानी ॥ तरहिं न बिनु सीँ मम स्वामी। राम नमामि नमामि नमामी ॥ सरन
    गेँ मो से अघ रासी। होहिं सुद्ध नमामि अबिनासी ॥ दो जासु नाम भव भेषज हरन घोर त्रय सूल। सो कृपालु मोहि
    तो पर सदा रहु अनुकूल ॥ ॥ सुनि भुसुण्डि के बचन सुभ देखि राम पद नेह। बोलेउ प्रेम सहित गिरा गरुड़ बिगत
    सन्देह ॥ ॥ मै कृत्कृत्य भयुँ तव बानी। सुनि रघुबीर भगति रस सानी ॥ राम चरन नूतन रति भी। माया जनित बिपति
    सब गी ॥ मोह जलधि बोहित तुम्ह भे। मो कहँ नाथ बिबिध सुख दे ॥ मो पहिं होइ न प्रति उपकारा। बन्दुँ तव पद
    बारहिं बारा ॥ पूरन काम राम अनुरागी। तुम्ह सम तात न कौ बड़भागी ॥ सन्त बिटप सरिता गिरि धरनी। पर हित
    हेतु सबन्ह कै करनी ॥ सन्त हृदय नवनीत समाना। कहा कबिन्ह परि कहै न जाना ॥ निज परिताप द्रवि नवनीता। पर
    दुख द्रवहिं सन्त सुपुनीता ॥ जीवन जन्म सुफल मम भयू। तव प्रसाद संसय सब गयू ॥ जानेहु सदा मोहि निज किङ्कर।
    पुनि पुनि उमा कहि बिहङ्गबर ॥ दो तासु चरन सिरु नाइ करि प्रेम सहित मतिधीर। गयु गरुड़ बैकुण्ठ तब हृदयँ
    राखि रघुबीर ॥ ॥ गिरिजा सन्त समागम सम न लाभ कछु आन। बिनु हरि कृपा न होइ सो गावहिं बेद पुरान ॥ ॥ कहेउँ
    परम पुनीत इतिहासा। सुनत श्रवन छूटहिं भव पासा ॥ प्रनत कल्पतरु करुना पुञ्जा। उपजि प्रीति राम पद कञ्जा
    ॥ मन क्रम बचन जनित अघ जाई। सुनहिं जे कथा श्रवन मन लाई ॥ तीर्थाटन साधन समुदाई। जोग बिराग ग्यान निपुनाई
    ॥ नाना कर्म धर्म ब्रत दाना। सञ्जम दम जप तप मख नाना ॥ भूत दया द्विज गुर सेवकाई। बिद्या बिनय बिबेक बड़आई
    ॥ जहँ लगि साधन बेद बखानी। सब कर फल हरि भगति भवानी ॥ सो रघुनाथ भगति श्रुति गाई। राम कृपाँ काहूँ एक
    पाई ॥ दो मुनि दुर्लभ हरि भगति नर पावहिं बिनहिं प्रयास। जे यह कथा निरन्तर सुनहिं मानि बिस्वास ॥ ॥ सोइ
    सर्बग्य गुनी सोइ ग्याता। सोइ महि मण्डित पण्डित दाता ॥ धर्म परायन सोइ कुल त्राता। राम चरन जा कर मन
    राता ॥ नीति निपुन सोइ परम सयाना। श्रुति सिद्धान्त नीक तेहिं जाना ॥ सोइ कबि कोबिद सोइ रनधीरा। जो छल
    छाड़इ भजि रघुबीरा ॥ धन्य देस सो जहँ सुरसरी। धन्य नारि पतिब्रत अनुसरी ॥ धन्य सो भूपु नीति जो करी। धन्य
    सो द्विज निज धर्म न टरी ॥ सो धन धन्य प्रथम गति जाकी। धन्य पुन्य रत मति सोइ पाकी ॥ धन्य घरी सोइ जब
    सतसङ्गा। धन्य जन्म द्विज भगति अभङ्गा ॥ दो सो कुल धन्य उमा सुनु जगत पूज्य सुपुनीत। श्रीरघुबीर परायन
    जेहिं नर उपज बिनीत ॥ ॥ मति अनुरूप कथा मैं भाषी। जद्यपि प्रथम गुप्त करि राखी ॥ तव मन प्रीति देखि अधिकाई।
    तब मैं रघुपति कथा सुनाई ॥ यह न कहिअ सठही हठसीलहि। जो मन लाइ न सुन हरि लीलहि ॥ कहिअ न लोभिहि क्रोधहि
    कामिहि। जो न भजि सचराचर स्वामिहि ॥ द्विज द्रोहिहि न सुनाइअ कबहूँ। सुरपति सरिस होइ नृप जबहूँ ॥ राम
    कथा के तेइ अधिकारी। जिन्ह कें सतसङ्गति अति प्यारी ॥ गुर पद प्रीति नीति रत जेई। द्विज सेवक अधिकारी
    तेई ॥ ता कहँ यह बिसेष सुखदाई। जाहि प्रानप्रिय श्रीरघुराई ॥ दो राम चरन रति जो चह अथवा पद निर्बान। भाव
    सहित सो यह कथा करु श्रवन पुट पान ॥ ॥ राम कथा गिरिजा मैं बरनी। कलि मल समनि मनोमल हरनी ॥ संसृति रोग
    सजीवन मूरी। राम कथा गावहिं श्रुति सूरी ॥ एहि महँ रुचिर सप्त सोपाना। रघुपति भगति केर पन्थाना ॥ अति
    हरि कृपा जाहि पर होई। पाउँ देइ एहिं मारग सोई ॥ मन कामना सिद्धि नर पावा। जे यह कथा कपट तजि गावा ॥ कहहिं
    सुनहिं अनुमोदन करहीं। ते गोपद इव भवनिधि तरहीम् ॥ सुनि सब कथा हृदयँ अति भाई। गिरिजा बोली गिरा सुहाई
    ॥ नाथ कृपाँ मम गत सन्देहा। राम चरन उपजेउ नव नेहा ॥ दो मैं कृतकृत्य भिउँ अब तव प्रसाद बिस्वेस। उपजी
    राम भगति दृढ़ बीते सकल कलेस ॥ ॥ यह सुभ सम्भु उमा सम्बादा। सुख सम्पादन समन बिषादा ॥ भव भञ्जन गञ्जन
    सन्देहा। जन रञ्जन सज्जन प्रिय एहा ॥ राम उपासक जे जग माहीं। एहि सम प्रिय तिन्ह के कछु नाहीम् ॥ रघुपति
    कृपाँ जथामति गावा। मैं यह पावन चरित सुहावा ॥ एहिं कलिकाल न साधन दूजा। जोग जग्य जप तप ब्रत पूजा ॥ रामहि
    सुमिरिअ गाइअ रामहि। सन्तत सुनिअ राम गुन ग्रामहि ॥ जासु पतित पावन बड़ बाना। गावहिं कबि श्रुति सन्त
    पुराना ॥ ताहि भजहि मन तजि कुटिलाई। राम भजें गति केहिं नहिं पाई ॥ छं पाई न केहिं गति पतित पावन राम
    भजि सुनु सठ मना। गनिका अजामिल ब्याध गीध गजादि खल तारे घना ॥ आभीर जमन किरात खस स्वपचादि अति अघरूप जे।
    कहि नाम बारक तेपि पावन होहिं राम नमामि ते ॥ ॥ रघुबंस भूषन चरित यह नर कहहिं सुनहिं जे गावहीं। कलि मल
    मनोमल धोइ बिनु श्रम राम धाम सिधावहीम् ॥ सत पञ्च चौपाईं मनोहर जानि जो नर उर धरै। दारुन अबिद्या पञ्च
    जनित बिकार श्रीरघुबर हरै ॥ ॥ सुन्दर सुजान कृपा निधान अनाथ पर कर प्रीति जो। सो एक राम अकाम हित निर्बानप्रद
    सम आन को ॥ जाकी कृपा लवलेस ते मतिमन्द तुलसीदासहूँ। पायो परम बिश्रामु राम समान प्रभु नाहीं कहूँ ॥ मो
    सम दीन न दीन हित तुम्ह समान रघुबीर। अस बिचारि रघुबंस मनि हरहु बिषम भव भीर ॥ ॥ कामिहि नारि पिआरि जिमि
    लोभहि प्रिय जिमि दाम। तिमि रघुनाथ निरन्तर प्रिय लागहु मोहि राम ॥ यत्पूर्व प्रभुणा कृतं सुकविना श्रीशम्भुना
    दुर्गमं श्रीमद्रामपदाब्जभक्तिमनिशं प्राप्त्यै तु रामायणम्। मत्वा तद्रघुनाथमनिरतं स्वान्तस्तमःशान्तये
    भाषाबद्धमिदं चकार तुलसीदासस्तथा मानसम् ॥ ॥ पुण्यं पापहरं सदा शिवकरं विज्ञानभक्तिप्रदं मायामोहमलापहं
    सुविमलं प्रेमाम्बुपूरं शुभम्। श्रीमद्रामचरित्रमानसमिदं भक्त्यावगाहन्ति ये ते संसारपतङ्गघोरकिरणैर्दह्यन्ति
    नो मानवाः ॥ तीसवाँ विश्राम नवान्हपारायण इति श्रीमद्रामचरितमानसे सकलकलिकलुषविध्वंसने सप्तमः सोपानः
    समाप्तः। आरति श्रीरामायनजी की। कीरति कलित ललित सिय पी की ॥ गावत ब्रह्मादिक मुनि नारद। बालमीक बिग्यान
    बिसारद। सुक सनकादि सेष अरु सारद। बरनि पवनसुत कीरति नीकी ॥ ॥ गावत बेद पुरान अष्टदस। छो सास्त्र सब ग्रन्थन
    को रस। मुनि जन धन सन्तन को सरबस। सार अंस सम्मत सबही की ॥ ॥ गावत सन्तत सम्भु भवानी। अरु घटसम्भव मुनि
    बिग्यानी। ब्यास आदि कबिबर्ज बखानी। कागभुसुण्डि गरुड के ही की ॥ ॥ कलिमल हरनि बिषय रस फीकी। सुभग सिङ्गार
    मुक्ति जुबती की। दलन रोग भव मूरि अमी की। तात मात सब बिधि तुलसी की ॥
