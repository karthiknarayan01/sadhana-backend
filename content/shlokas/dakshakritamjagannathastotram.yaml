id: dakshakritamjagannathastotram
category: stotram
name:
  english: dakshakritamjagannathastotram
  devanagari: दक्षकृतंजगन्नाथस्तोत्रम्
content:
  english: dakshakritam jagannathastotram daksha uvaca | devadeva jagannatha sahajanandanirmala | samsararnavasammagnamstrahi
    nah parameshvara || 24|| nanavidhaishca santapaih santaptanmanavaniman | mamanukroshabuddhya vai shubhadrishtya'mritena
    ca || 25|| santarpaya trinanchushkankrishnamegha namo'stute | kalikalmashasammudhanuddhartum jagatam
    pate || 26|| avataro'yametasminnilacalaguhantare | cirakalaprarudhanam dustyajanam mahamhasam || 27||
    rashim dagdhum tvamevesho dinanathakripakara | tvaddarshanamahayoge yamadyashtangavarjite || 28||
    yesham matih samutpanna caturvargaikasadhane | na te shocanti dushpare bhavaranye mahabhaye || 29||
    karmanapeksham devesha natmajnanam vimocakam | idam te darshanam natha vina karmapi mocayet || 2
  devanagari: दक्षकृतं जगन्नाथस्तोत्रम् दक्ष उवाच । देवदेव जगन्नाथ सहजानन्दनिर्मल । संसारार्णवसम्मग्नांस्त्राहि
    नः परमेश्वर ॥ २४॥ नानाविधैश्च सन्तापैः सन्तप्तान्मानवानिमान् । ममानुक्रोशबुद्ध्या वै शुभदृष्ट्याऽमृतेन
    च ॥ २५॥ सन्तर्पय तृणाञ्छुष्कान्कृष्णमेघ नमोऽस्तुते । कलिकल्मषसम्मूढानुद्धर्तुं जगतां पते ॥ २६॥ अवतारोऽयमेतस्मिन्नीलाचलगुहान्तरे
    । चिरकालप्ररूढानां दुस्त्यजानां महांहसाम् ॥ २७॥ राशिं दग्धुं त्वमेवेशो दीनानाथकृपाकर । त्वद्दर्शनमहायोगे
    यमाद्यष्टाङ्गवर्जिते ॥ २८॥ येषां मतिः समुत्पन्ना चतुर्वर्गैकसाधने । न ते शोचन्ति दुष्पारे भवारण्ये
    महाभये ॥ २९॥ कर्मानपेक्षं देवेश नात्मज्ञानं विमोचकम् । इदं ते दर्शनं नाथ विना कर्मापि मोचयेत् ॥ २
