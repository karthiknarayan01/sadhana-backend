id: gorakshashatakam-2
category: shataka
name:
  english: gorakshashatakam 2
  devanagari: गोरक्षशतकम् २
content:
  english: gorakshashatakam 2 shrigurum paramanandam vande svanandavigraham | yasya sannidhyamatrena cidanandayate
    tanuh || 1|| antarnishcalitatmadipakalikasvadharabandhadibhih yo yogi yugakalpakalakalanat tvam jajegiyate
    | jnanamodamahodadhih samabhavadyatradinathah svayam vyaktavyaktagunadhikam tamanisham shriminanatham
    bhaje || 2|| namaskritya gurum bhaktya goraksho jnanamuttamam | abhishtam yoginam brute paramanandakarakam
    || 3|| gorakshah shatakam vakti yoginam hitakamyaya | dhruvam yasyavabodhena jayate paramam padam
    || 4|| etadvimuktisopanametat kalasya vancanam | yadvyavrittam mano mohad asaktam paramatmani || 5||
    dvijasevitashakhasya shrutikalpataroh phalam | shamanam bhavatapasya yogam bhajati sajjanah || 6||
    asanam pranasamyamah pratyaharo'tha dharana | dhyanam samadhiretani yogangani bhavanti shat || 7||
    asanani tu tavanti yavatyo jivajatayah | eteshamakhilanbhedanvijanati maheshvarah || 8|| caturashitilakshanam
    ekamekamudahritam | tatah shivena pithanam shodeshanam shatam kritam || 9|| asanebhyah samastebhyo
    dvayameva vishishyate | ekam siddhasanam proktam dvitiyam kamalasanam || 10|| yonisthanakamanghrimulaghatitam
    kritva dridham vinyase nmedhre padamathaikameva niyatam kritva samam vigraham | sthanuh samyamitendriyo'caladrisha
    pashyan bhruvorantaram etan mokshakavatabhedajanakam siddhasanam procyate || 11|| vamorupari dakshinam
    hi caranam samsthapya vamam tatha dakshorupari pashcimena vidhina dhritva karabhyam dridham | angushthau
    hridaye nidhaya cibukam nasagramalokaye detadvyadhivikarahari yaminam padmasanam procyate || 12||
    shatcakram shodashadharam trilaksham vyomapancakam | svadehe ye na jananti katham sidhyanti yoginah
    || 13|| ekastambham navadvaram griham pancadhidaivatam | svadeham ye na jananti katham sidhyanti yoginah
    || 14|| caturdalam syadadharah svadhishthanam ca shatdalam | nabhau dashadalam padmam suryasankhyadalam
    hridi || 15|| kanthe syat shodashadalam bhrumadhye dvidalam tatha | sahasradalamakhyatam brahmarandhre
    mahapathe || 16|| adharah prathamam cakram svadhishthanam dvitiyakam | yonisthanam dvayormadhye kamarupam
    nigadyate || 17|| adharakhyam gudasthanam pankajam ca caturdalam | tanmadhye procyate yonih kamaksha
    siddhavandita || 18|| yonimadhye mahalingam pashcimabhimukham sthitam | mastake manivadbimbam yo janati
    sa yogavit || 19|| taptacamikarabhasam tadillekheva visphurat | trikonam tatpuram vahneradhomedhrat
    pratishthitam || 20|| yatsamadhau param jyotiranantam vishvatomukham | tasmin drishte mahayoge yatayatam
    na vidyate || 21|| svashabdena bhavet pranah svadhishthanam tadashrayah | svadhishthanat padadasmanmedhramevabhidhiyate
    || 22|| tantuna manivat proto yatra kandah sushumnaya | tannabhimandalam cakram procyate manipurakam
    || 23|| dvadashare mahacakre punyapapavivarjite | tavaj jivo bhramatyeva yavat tattvam na vindati
    || 24|| urdhvam medhrad adho nabheh kandayonih khagandavat | tatra nadyah samutpannah sahasranam dvisaptatih
    || 25|| teshu nadisahasreshu dvisaptatirudahritah | pradhanam pranavahinyo bhuyastatra dasha smritah
    || 26|| ida ca pingala caiva sushumna ca tritiyaka | gandhari hastijihva ca pusha caiva yashasvini
    || 27|| alambusha kuhush caiva shankhini dashami smrita | etan nadimayam cakram jnatavyam yogibhih
    sada || 28|| ida vame sthita bhage pingala dakshine tatha | sushumna madhyadeshe tu gandhari vamacakshushi
    || 29|| dakshine hastijihva ca pusha karne ca dakshine | yashasvini vamakarne casane vapyalambusha
    || 30|| kuhushca lingadeshe tu mulasthane ca shankhini | evam dvaramupashritya tishthanti dashanadikah
    || 31|| idapingalasushumna ca tisro nadyudahritah | satatam pranavahinyah somasuryagnidevatah || 32||
    prano'panah samanash codano vyanau ca vayavah | nagah kurmo'tha krikaro devadatto dhananjayah || 33||
    hridi prano vasen nityam apano gudamandale | samano nabhideshe syadudanah kanthamadhyagah || 34||
    udgare nagakhyatah kurma unmilane smritah | krikarah kshutakrijjneyo devadatto vijrimbhane || 35||
    na jahati mritam capi sarvavyapi dhananjayah | ete sarvasu nadishu bhramante jivarupinah || 36|| akshipto
    bhujadandena yathoccalati kandukah | pranapanasamakshiptastatha jivo na tishthati || 38|| pranapanavasho
    jivo hyadhash cordhvam ca dhavati | vamadakshinamargena cancalatvan na drishyate || 39|| rajjubaddho
    yatha shyeno gato'pyakrishyate | gunabaddhastatha jivah pranapanena krishyate || 40|| apanah karshati
    pranah prano'panam ca karshati | urdhvadhah samsthitavetau samyojayati yogavit || 41|| hakarena bahiryati
    sakarena vishetpunah | hamsahamsetyamuma mantram jivo japati sarvada || 42|| shatshatanitvahoratre
    sahasranyekavimshatih | etatsankhyanvitam mantra jivo japati sarvada || 43|| ajapa nama gayatri yoginam
    mokshadayini | asyah sankalpamatrena sarvapapaih pramucyate || 44|| anaya sadrishi vidya anaya sadrisho
    japah | anaya sadrisham jnanam na bhutam na bhavishyati || 45|| kundalinyah samudbhuta gayatri pranadharini
    | pranavidya mahavidya yastam vetti sa yogavit || 46|| kandordhvam kundali shaktirashtadha kundalakriti
    | brahmadvaramukham nityam mukhenacchadya tishthati || 47|| yena dvarena gantavyam brahmasthanamanamayam
    | mukhenacchadya taddvaram prasupta parameshvari || 48|| prabuddha vahniyogena manasa maruta hata
    | sucivad gunamadaya vrajatyurdhvam sushumnaya || 49|| prasphuradbhujagakara padmatantunibha shubha
    | prabuddha vahniyogena vrajati urdhvam sushumnaya || 50|| udghatayetkapatam tu yatha kuncikaya hathat
    | kundalinya tatha yogi mokshadvaram prabhedayet || 51|| kritva samputitau karau dridhataram baddhavatu
    padmasanam gadham vakshasi sannidhaya cibukam dhyatva tatprekshitam | varam varamapanamurdhvamanilam
    proccarayetpuritam muncanpranamupaiti bodhamatulam shaktiprabodhannarah || 52|| anganam mardanam kuryacchramajatena
    varina | katvamlalavanatyagi kshirabhojanamacaret || 53|| brahmacari mitahari tyagi yogaparayanah
    | abdadurdhvam bhavetsiddho natra karya vicarana || 54|| susnigdham madhuraharam caturthamshavivarjitam
    | bhujyate surasamprityai mitaharah sa ucyate || 55|| kandordhvam kundali shaktirashtadha kundalakritih
    | bandhanaya ca mudhanam yoginam mokshada smrita || 56|| mahamudram namomudramuddiyanam jalandharam
    | mulabandham ca yo vetti sa yogi siddhibhajanam || 57|| shodhanam nadijalasya calanam candrasuryayoh
    | rasanam shoshanam caiva mahamudrabhidhiyate || 58|| vakshonyastahanurnipidya suciram yonim ca vamanghrina
    hastabhyamavadharitam prasaritam padam tatha dakshinam | apurya shvasanena kukshiyugalam baddhva shanai
    recayed esha patakanashini sumahati mudra nrinam procyate || 59|| candrangena samabhyasya suryangenabhyaset
    punah | yavat tulya bhavetsankhya tato mudram visarjayet || 60|| na hi pathyamapathyam va rasah sarve'pi
    nirasah | api muktam visham ghoram piyushamapi jiryate || 61|| kshayakushthagudavartagulmajirnapurogamah
    | rogastasya kshayam yanti mahamudram tu yo'bhyaset || 62|| kathiteyam mahamudra mahasiddhikara nrinam
    | gopaniya prayatnena na deya yasya kasyacit || 63|| kapalakuhare jihva pravishta viparitaga | bhruvorantargata
    drishtirmudra bhavati khecari || 64|| na rogo maranam tandra na nidra na kshudha trisha | na ca murccha
    bhavettasya yo mudram vetti khecarim || 65|| pidyate na sa rogena lipyate na ca karmana | badhyate
    na sa kalena yo mudram vetti khecarim || 66|| cittam carati khe yasmajjihva carati khe gata | tenaisha
    khecari nama mudra siddhairnirupita || 67|| bindumulam shariram tu shirastatra pratishthitah | bhavayanti
    shariram ya apadatalamastakam || 68|| khecarya mudritam yena vivaram lambikordhvatah | na tasya ksharate
    binduh kaminyalingitasya ca || 69|| yavadbinduh sthito dehe tavatkalabhayam kutah | yavadbaddha nabhomudra
    tavadbindurna gacchati || 70|| calito'pi yada binduh sampraptashca hutashanam | vrajatyurdhvam hritah
    shaktya niruddho yonimudraya || 71|| sa punardvividho binduh panduro lohitastatha | panduram shukramityahurlohitam
    tu maharajah || 72|| sinduradravasankasham ravisthane sthitam rajah | shashisthane sthito bindustayoraikyam
    sudurlabham || 73|| binduh shivo rajah shaktirbindumindu rajo ravih | ubhayoh sangamadeva prapyate
    paramam padam || 74|| vayuna shakticarena preritam tu maharajah | bindunaiti sahaikatvam bhaveddivyam
    vapustada || 75|| shukram candrena samyuktam rajah suryena samyutam | tayoh samarasaikatvam yojanati
    sa yogavit || 76|| uddinam kurute yasmadavishrantam mahakhagah | uddiyanam tadeva syattava bandho'bhidhiyate
    || 77|| udaratpashcime bhage hyadho nabhernigadyate | uddiyanasya bandho'yam tatra bandho vidhiyate
    || 78|| badhnati hi sirajalamadhogami shirojalam | tato jalandharo bandhah kanthaduhkhaughanashanah
    || 79|| jalandhare krite bandhe kanthasamkocalakshane | piyusham na patatyagnau na ca vayuh prakupyati
    || 80|| parshnibhagena sampidya yonimakuncayedgudam | apanamurdhvamakrishya mulabandho'bhidhiyate
    || 81|| apanapranayoraikyat kshayanmutrapurishayoh | yuva bhavati vriddho'pi satatam mulabandhanat
    || 82|| padmasanam samaruhya samakayashirodharah | nasagradrishtirekante japedonkaramavyayam || 83||
    bhurbhuvah svarime lokah somasuryagnidevatah | yasya matrasu tishthanti tatparam jyotiromiti || 84||
    trayahkalastrayo vedastrayo lokastrayah sverah | trayodevah sthita yatra tatparam jyotiromiti || 85||
    kriya ceccha tatha jnanabrahmiraudrishca vaishnavi | tridhashaktih sthita yatra tatparam jyotiromiti
    || 86|| akarashca tathokaromakaro bindusamjnakah | tisromatrah sthita yatra tatparam jyotiromiti ||
    87|| vacasa tajjayedbijam vapusha tatsamabhyaset | manasa tatsmarennityam tatparam jyotiromiti ||
    88|| shucirvapyashucirvapi yo japetpranavam sada | lipyate na sa papena padmapatramivambhasa || 89||
    cale vate calo bindurnishcale nishcalo bhavet | yogi sthanutvamapnoti tato vayum nirodhayet || 90||
    yavadvayuh sthito dehe tavajjivanamucyate | maranam tasya nishkrantistato vayum nirodhayet || 91||
    yavadbaddho maruddehe yavaccittam nirakulam | yavaddrishtirbhruvormadhye tavatkalabhayam kutah ||
    92|| atah kalabhayad brahma pranayamaparayanah | yogino munayashcaiva tato vayum nirodhayet || 93||
    shattrimshadangulohamsah prayanam kurute bahih | vamadakshinamargena tatah prano'bhidhiyate || 94||
    shuddhimeti yada sarvam nadicakram malakulam | tadaiva jayate yogi pranasamgrahane kshamah || 95||
    baddhapadmasano yogi pranam candrena purayet | dharayitva yathashakti bhuyah suryena recayet || 96||
    amritam dadhisankasham gokshirarajatopamam | dhyatva candramaso bimbam pranayami sukhi bhavet || 97||
    dakshino shvasamakrishya purayedudaram shanaih | kumbhayitva vidhanena purashcandrena recayet || 98||
    prajvalajjvalanajvalapunjamadityamandalam | dhyatva nabhisthitam yogi pranayame sukhi bhavet || 99||
    pranam codidaya pibenparimitam bhuyo'nyaya recayet pitva pingalaya samiranamatho baddhva tyajedvamaya
    | suryacandramasoranena vidhina bimbadvayam dhyayatah shuddha nadigana bhavanti yamino masatrayadurdhvatah
    || 100|| yatheshtham dharanam vayoranalasya pradipanam | nadabhivyaktirarogyam jayate nadishodhanat
    || 101|| || iti shri gorakshanathapranitah gorakshashatakam sampurnam ||
  devanagari: गोरक्षशतकम् २ श्रीगुरुं परमानन्दं वन्दे स्वानन्दविग्रहम् । यस्य सन्निध्यमात्रेण चिदानन्दायते
    तनुः ॥ १॥ अन्तर्निश्चलितात्मदीपकलिकास्वाधारबन्धादिभिः यो योगी युगकल्पकालकलनात् त्वं जजेगीयते । ज्ञानामोदमहोदधिः
    समभवद्यत्रादिनाथः स्वयं व्यक्ताव्यक्तगुणाधिकं तमनिशं श्रीमीननाथं भजे ॥ २॥ नमस्कृत्य गुरुं भक्त्या
    गोरक्षो ज्ञानमुत्तमम् । अभीष्टं योगिनां ब्रूते परमानन्दकारकम् ॥ ३॥ गोरक्षः शतकं वक्ति योगिनां हितकाम्यया
    । ध्रुवं यस्यावबोधेन जायते परमं पदम् ॥ ४॥ एतद्विमुक्तिसोपानमेतत् कालस्य वञ्चनम् । यद्व्यावृत्तं मनो
    मोहाद् आसक्तं परमात्मनि ॥ ५॥ द्विजसेवितशाखस्य श्रुतिकल्पतरोः फलम् । शमनं भवतापस्य योगं भजति सज्जनः
    ॥ ६॥ आसनं प्राणसंयामः प्रत्याहारोऽथ धारणा । ध्यानं समाधिरेतानि योगाङ्गानि भवन्ति षट् ॥ ७॥ आसनानि तु
    तावन्ति यावत्यो जीवजातयः । एतेषामखिलान्भेदान्विजानाति महेश्वरः ॥ ८॥ चतुराशीतिलक्षाणां एकमेकमुदाहृतम्
    । ततः शिवेन पीठानां षोडेशानं शतं कृतम् ॥ ९॥ आसनेभ्यः समस्तेभ्यो द्वयमेव विशिष्यते । एकं सिद्धासनं
    प्रोक्तं द्वितीयं कमलासनम् ॥ १०॥ योनिस्थानकमङ्घ्रिमूलघटितं कृत्वा दृढं विन्यसे न्मेढ्रे पादमथैकमेव
    नियतं कृत्वा समं विग्रहम् । स्थाणुः संयमितेन्द्रियोऽचलदृशा पश्यन् भ्रुवोरन्तरम् एतन् मोक्षकवाटभेदजनकं
    सिद्धासनं प्रोच्यते ॥ ११॥ वामोरूपरि दक्षिणं हि चरणं संस्थाप्य वामं तथा दक्षोरूपरि पश्चिमेन विधिना
    धृत्वा कराभ्यां दृढम् । अङ्गुष्ठौ हृदये निधाय चिबुकं नासाग्रमालोकये देतद्व्याधिविकारहारि यमिनां पद्मासनं
    प्रोच्यते ॥ १२॥ षट्चक्रं षोडशाधारं त्रिलक्षं व्योमपञ्चकम् । स्वदेहे ये न जानन्ति कथं सिध्यन्ति योगिनः
    ॥ १३॥ एकस्तम्भं नवद्वारं गृहं पञ्चाधिदैवतम् । स्वदेहं ये न जानन्ति कथं सिध्यन्ति योगिनः ॥ १४॥ चतुर्दलं
    स्यादाधारः स्वाधिष्ठानं च षट्दलम् । नाभौ दशदलं पद्मं सूर्यसङ्ख्यदलं हृदि ॥ १५॥ कण्ठे स्यात् षोडशदलं
    भ्रूमध्ये द्विदलं तथा । सहस्रदलमाख्यातं ब्रह्मरन्ध्रे महापथे ॥ १६॥ आधारः प्रथमं चक्रं स्वाधिष्ठानं
    द्वितीयकम् । योनिस्थानं द्वयोर्मध्ये कामरूपं निगद्यते ॥ १७॥ आधाराख्यं गुदस्थानं पङ्कजं च चतुर्दलम्
    । तन्मध्ये प्रोच्यते योनिः कामाक्षा सिद्धवन्दिता ॥ १८॥ योनिमध्ये महालिङ्गं पश्चिमाभिमुखं स्थितम् ।
    मस्तके मणिवद्बिम्बं यो जानाति स योगवित् ॥ १९॥ तप्तचामीकराभासं तडिल्लेखेव विस्फुरत् । त्रिकोणं तत्पुरं
    वह्नेरधोमेढ्रात् प्रतिष्ठितम् ॥ २०॥ यत्समाधौ परं ज्योतिरनन्तं विश्वतोमुखम् । तस्मिन् दृष्टे महायोगे
    यातायातं न विद्यते ॥ २१॥ स्वशब्देन भवेत् प्राणः स्वाधिष्ठानं तदाश्रयः । स्वाधिष्ठानात् पदादस्मान्मेढ्रमेवाभिधीयते
    ॥ २२॥ तन्तुना मणिवत् प्रोतो यत्र कन्दः सुषुम्णया । तन्नाभिमण्डलं चक्रं प्रोच्यते मणिपूरकम् ॥ २३॥ द्वादशारे
    महाचक्रे पुण्यपापविवर्जिते । तावज् जीवो भ्रमत्येव यावत् तत्त्वं न विन्दति ॥ २४॥ ऊर्ध्वं मेढ्राद् अधो
    नाभेः कन्दयोनिः खगाण्डवत् । तत्र नाड्यः समुत्पन्नाः सहस्राणां द्विसप्ततिः ॥ २५॥ तेषु नाडिसहस्रेषु
    द्विसप्ततिरुदाहृताः । प्रधानं प्राणवाहिन्यो भूयस्तत्र दश स्मृताः ॥ २६॥ इडा च पिङ्गला चैव सुषुम्णा
    च तृतीयका । गान्धारी हस्तिजिह्वा च पूषा चैव यशस्विनी ॥ २७॥ अलम्बुषा कुहूश् चैव शङ्खिनी दशमी स्मृता
    । एतन् नाडिमयं चक्रं ज्ञातव्यं योगिभिः सदा ॥ २८॥ इडा वामे स्थिता भागे पिङ्गला दक्षिणे तथा । सुषुम्णा
    मध्यदेशे तु गान्धारी वामचक्षुषि ॥ २९॥ दक्षिणे हस्तिजिह्वा च पूषा कर्णे च दक्षिणे । यशस्विनी वामकर्णे
    चासने वाप्यलम्बुषा ॥ ३०॥ कुहूश्च लिङ्गदेशे तु मूलस्थाने च शङ्खिनी । एवं द्वारमुपाश्रित्य तिष्ठन्ति
    दशनाडिकाः ॥ ३१॥ इडापिङ्गलासुषुम्णा च तिस्रो नाड्युदाहृताः । सततं प्राणवाहिन्यः सोमसूर्याग्निदेवताः
    ॥ ३२॥ प्राणोऽपानः समानश् चोदानो व्यानौ च वायवः । नागः कूर्मोऽथ कृकरो देवदत्तो धनञ्जयः ॥ ३३॥ हृदि प्राणो
    वसेन् नित्यं अपानो गुदमण्डले । समानो नाभिदेशे स्यादुदानः कण्ठमध्यगः ॥ ३४॥ उद्गारे नागाख्यातः कूर्म
    उन्मीलने स्मृतः । कृकरः क्षुतकृज्ज्ञेयो देवदत्तो विजृम्भणे ॥ ३५॥ न जहाति मृतं चापि सर्वव्यापि धनञ्जयः
    । एते सर्वासु नाडीषु भ्रमन्ते जीवरूपिणः ॥ ३६॥ आक्षिप्तो भुजदण्डेन यथोच्चलति कन्दुकः । प्राणापानसमाक्षिप्तस्तथा
    जीवो न तिष्ठति ॥ ३८॥ प्राणापानवशो जीवो ह्यधश् चोर्ध्वं च धावति । वामदक्षिणमार्गेण चञ्चलत्वान् न दृश्यते
    ॥ ३९॥ रज्जुबद्धो यथा श्येनो गतोऽप्याकृष्यते । गुणबद्धस्तथा जीवः प्राणापानेन कृष्यते ॥ ४०॥ अपानः कर्षति
    प्राणः प्राणोऽपानं च कर्षति । ऊर्ध्वाधः संस्थितावेतौ संयोजयति योगवित् ॥ ४१॥ हकारेण बहिर्याति सकारेण
    विशेत्पुनः । हंसहंसेत्यमुम मन्त्रं जीवो जपति सर्वदा ॥ ४२॥ षट्शतानित्वहोरात्रे सहस्राण्येकविंशतिः ।
    एतत्सङ्ख्यान्वितं मन्त्र जीवो जपति सर्वदा ॥ ४३॥ अजपा नाम गायत्री योगिनां मोक्षदायिनी । अस्याः सङ्कल्पमात्रेण
    सर्वपापैः प्रमुच्यते ॥ ४४॥ अनया सदृशी विद्या अनया सदृशो जपः । अनया सदृशं ज्ञानं न भूतं न भविष्यति
    ॥ ४५॥ कुन्दलिन्याः समुद्भूता गायत्री प्राणधारिणी । प्राणविद्या महाविद्या यस्तां वेत्ति स योगवित् ॥
    ४६॥ कन्दोर्ध्वं कुण्डली शक्तिरष्टधा कुण्डलाकृति । ब्रह्मद्वारमुखं नित्यं मुखेनाच्छाद्य तिष्ठति ॥ ४७॥
    येन द्वारेण गन्तव्यं ब्रह्मस्थानमनामयम् । मुखेनाच्छाद्य तद्द्वारं प्रसुप्ता परमेश्वरी ॥ ४८॥ प्रबुद्धा
    वह्नियोगेन मनसा मारुता हता । सूचीवद् गुणमादाय व्रजत्यूर्ध्वं सुषुम्णया ॥ ४९॥ प्रस्फुरद्भुजगाकारा पद्मतन्तुनिभा
    शुभा । प्रबुद्धा वह्नियोगेन व्रजति ऊर्ध्वं सुषुम्णया ॥ ५०॥ उद्घटयेत्कपातं तु यथा कुञ्चिकया हठात् ।
    कुण्डलिन्या तथा योगी मोक्षद्वारं प्रभेदयेत् ॥ ५१॥ कृत्वा सम्पुटितौ करौ दृढतरं बद्धवातु पद्मासनं गाढं
    वक्षसि सन्निधाय चिबुकं ध्यात्वा तत्प्रेक्षितम् । वारं वारमपानमूर्ध्वमनिलं प्रोच्चारयेत्पूरितं मुञ्चन्प्राणमुपैति
    बोधमतुलं शक्तिप्रबोधान्नरः ॥ ५२॥ अङ्गानां मर्दनं कुर्याच्छ्रमजातेन वारिणा । कट्वाम्ललवणत्यागी क्षीरभोजनमाचरेत्
    ॥ ५३॥ ब्रह्मचारी मिताहारी त्यागी योगपरायणः । अब्दादूर्ध्वं भवेत्सिद्धो नात्र कार्या विचारणा ॥ ५४॥
    सुस्निग्धं मधुराहारं चतुर्थांशविवर्जितम् । भुज्यते सुरसम्प्रीत्यै मिताहारः स उच्यते ॥ ५५॥ कन्दोर्ध्वं
    कुण्डली शक्तिरष्टधा कुण्डलाकृतिः । बन्धनाय च मूढानां योगिनां मोक्षदा स्मृता ॥ ५६॥ महामुद्रां नमोमुद्रामुड्डियानं
    जलन्धरम् । मूलबन्धं च यो वेत्ति स योगी सिद्धिभाजनम् ॥ ५७॥ शोधनं नाडिजालस्य चालनं चन्द्रसूर्ययोः ।
    रसानां शोषणं चैव महामुद्राभिधीयते ॥ ५८॥ वक्षोन्यस्तहनुर्निपीड्य सुचिरं योनिं च वामाङ्घ्रिणा हस्ताभ्यामवधारितं
    प्रसरितं पादं तथा दक्षिणम् । आपूर्य श्वसनेन कुक्षियुगलं बद्ध्वा शनै रेचयेद् एषा पातकनाशिनी सुमहती
    मुद्रा नॄणां प्रोच्यते ॥ ५९॥ चन्द्राङ्गेन समभ्यस्य सूर्याङ्गेनाभ्यसेत् पुनः । यावत् तुल्या भवेत्सङ्ख्या
    ततो मुद्रां विसर्जयेत् ॥ ६०॥ न हि पथ्यमपथ्यं वा रसाः सर्वेऽपि नीरसाः । अपि मुक्तं विषं घोरं पीयूषमपि
    जीर्यते ॥ ६१॥ क्षयकुष्ठगुदावर्तगुल्माजीर्णपुरोगमाः । रोगास्तस्य क्षयं यान्ति महामुद्रां तु योऽभ्यसेत्
    ॥ ६२॥ कथितेयं महामुद्रा महासिद्धिकरा नॄणाम् । गोपनीया प्रयत्नेन न देया यस्य कस्यचित् ॥ ६३॥ कपालकुहरे
    जिह्वा प्रविष्टा विपरीतगा । भ्रुवोरन्तर्गता दृष्टिर्मुद्रा भवति खेचरी ॥ ६४॥ न रोगो मरणं तन्द्रा न
    निद्रा न क्षुधा तृषा । न च मूर्च्छा भवेत्तस्य यो मुद्रां वेत्ति खेचरीम् ॥ ६५॥ पीड्यते न स रोगेण लिप्यते
    न च कर्मणा । बाध्यते न स कालेन यो मुद्रां वेत्ति खेचरीम् ॥ ६६॥ चित्तं चरति खे यस्माज्जिह्वा चरति खे
    गता । तेनैषा खेचरी नाम मुद्रा सिद्धैर्निरूपिता ॥ ६७॥ बिन्दुमूलं शरीरं तु शिरास्तत्र प्रतिष्ठिताः ।
    भावयन्ति शरीरं या आपादतलमस्तकम् ॥ ६८॥ खेचर्या मुद्रितं येन विवरं लम्बिकोर्ध्वतः । न तस्य क्षरते बिन्दुः
    कामिन्यालिङ्गितस्य च ॥ ६९॥ यावद्बिन्दुः स्थितो देहे तावत्कालभयं कुतः । यावद्बद्धा नभोमुद्रा तावद्बिन्दुर्न
    गच्छति ॥ ७०॥ चलितोऽपि यदा बिन्दुः सम्प्राप्तश्च हुताशनम् । व्रजत्यूर्ध्वं हृतः शक्त्या निरुद्धो योनिमुद्रया
    ॥ ७१॥ स पुनर्द्विविधो बिन्दुः पण्डुरो लोहितस्तथा । पाण्डुरं शुक्रमित्याहुर्लोहितं तु महाराजः ॥ ७२॥
    सिन्दूरद्रवसङ्काशं रविस्थाने स्थितं रजः । शशिस्थाने स्थितो बिन्दुस्तयोरैक्यं सुदुर्लभम् ॥ ७३॥ बिन्दुः
    शिवो रजः शक्तिर्बिन्दुमिन्दू रजो रविः । उभयोः सङ्गमादेव प्राप्यते परमं पदम् ॥ ७४॥ वायुना शक्तिचारेण
    प्रेरितं तु महारजः । बिन्दुनैति सहैकत्वं भवेद्दिव्यं वपुस्तदा ॥ ७५॥ शुक्रं चन्द्रेण संयुक्तं रजः सूर्येण
    संयुतम् । तयोः समरसैकत्वं योजानाति स योगवित् ॥ ७६॥ उड्डीनं कुरुते यस्मादविश्रान्तं महाखगः । उड्डीयानं
    तदेव स्यात्तव बन्धोऽभिधीयते ॥ ७७॥ उदरात्पश्चिमे भागे ह्यधो नाभेर्निगद्यते । उड्डीयानस्य बन्धोऽयं तत्र
    बन्धो विधीयते ॥ ७८॥ बध्नाति हि सिराजालमधोगामि शिरोजलम् । ततो जालन्धरो बन्धः कण्ठदुःखौघनाशनः ॥ ७९॥
    जालन्धरे कृते बन्धे कण्ठसंकोचलक्षणे । पीयूषं न पतत्यग्नौ न च वायुः प्रकुप्यति ॥ ८०॥ पार्ष्णिभागेन
    सम्पीड्य योनिमाकुञ्चयेद्गुदम् । अपानमूर्ध्वमाकृष्य मूलबन्धोऽभिधीयते ॥ ८१॥ अपानप्राणयोरैक्यात् क्षयान्मूत्रपुरीषयोः
    । युवा भवति वृद्धोऽपि सततं मूलबन्धनात् ॥ ८२॥ पद्मासनं समारुह्य समकायशिरोधरः । नासाग्रदृष्टिरेकान्ते
    जपेदोङ्कारमव्ययम् ॥ ८३॥ भूर्भुवः स्वरिमे लोकाः सोमसूर्याग्निदेवताः । यस्या मात्रासु तिष्ठन्ति तत्परं
    ज्योतिरोमिति ॥ ८४॥ त्रयःकालास्त्रयो वेदास्त्रयो लोकास्त्रयः स्वेराः । त्रयोदेवाः स्थिता यत्र तत्परं
    ज्योतिरोमिति ॥ ८५॥ क्रिया चेच्छा तथा ज्ञानाब्राह्मीरौद्रीश्च वैष्णवी । त्रिधाशक्तिः स्थिता यत्र तत्परं
    ज्योतिरोमिति ॥ ८६॥ आकाराश्च तथोकारोमकारो बिन्दुसंज्ञकः । तिस्रोमात्राः स्थिता यत्र तत्परं ज्योतिरोमिति
    ॥ ८७॥ वचसा तज्जयेद्बीजं वपुषा तत्समभ्यसेत् । मनसा तत्स्मरेन्नित्यं तत्परं ज्योतिरोमिति ॥ ८८॥ शुचिर्वाप्यशुचिर्वापि
    यो जपेत्प्रणवं सदा । लिप्यते न स पापेन पद्मपत्रमिवाम्भसा ॥ ८९॥ चले वाते चलो बिन्दुर्निश्चले निश्चलो
    भवेत् । योगी स्थाणुत्वमाप्नोति ततो वायुं निरोधयेत् ॥ ९०॥ यावद्वायुः स्थितो देहे तावज्जीवनमुच्यते ।
    मरणं तस्य निष्क्रान्तिस्ततो वायुं निरोधयेत् ॥ ९१॥ यावद्बद्धो मरुद्देहे यावच्चित्तं निराकुलम् । यावद्दृष्टिर्भ्रुवोर्मध्ये
    तावत्कालभयं कुतः ॥ ९२॥ अतः कालभयाद् ब्रह्मा प्राणायामपरायणः । योगिनो मुनयश्चैव ततो वायुं निरोधयेत्
    ॥ ९३॥ षट्त्रिंशदङ्गुलोहंसः प्रयाणं कुरुते बहिः । वामदक्षिणमार्गेण ततः प्राणोऽभिधीयते ॥ ९४॥ शुद्धिमेति
    यदा सर्वं नाडीचक्रं मलाकुलम् । तदैव जायते योगी प्राणसंग्रहणे क्षमः ॥ ९५॥ बद्धपद्मासनो योगी प्राणं
    चन्द्रेण पूरयेत् । धारयित्वा यथाशक्ति भूयः सूर्येण रेचयेत् ॥ ९६॥ अमृतं दधिसङ्काशं गोक्षीररजतोपमम्
    । ध्यात्वा चन्द्रमसो बिम्बं प्राणायामी सुखी भवेत् ॥ ९७॥ दक्षिणो श्वासमाकृष्य पूरयेदुदरं शनैः । कुम्भयित्वा
    विधानेन पुरश्चन्द्रेण रेचयेत् ॥ ९८॥ प्रज्वलज्ज्वलनज्वालापुञ्जमादित्यमण्डलम् । ध्यात्वा नाभिस्थितं
    योगी प्राणायामे सुखी भवेत् ॥ ९९॥ प्राणं चोदिडया पिबेन्परिमितं भूयोऽन्यया रेचयेत् पीत्वा पिङ्गलया समीरणमथो
    बद्ध्वा त्यजेद्वामया । सूर्यचन्द्रमसोरनेन विधिना बिम्बद्वयं ध्यायतः शुद्धा नाडिगणा भवन्ति यमिनो मासत्रयादूर्ध्वतः
    ॥ १००॥ यथेष्ठं धारणं वायोरनलस्य प्रदीपनम् । नादाभिव्यक्तिरारोग्यं जायते नाडिशोधनात् ॥ १०१॥ ॥ इति श्री
    गोरक्षनाथप्रणीतः गोरक्षशतकं सम्पूर्णम् ॥
