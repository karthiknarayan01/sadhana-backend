id: ashtavakra-gita-chapter-14
category: stotram
name:
  english: Ashtavakra Gita Chapter 14
content:
  english: janaka uvaca || prakritya shunyacitto yah pramadad bhavabhavanah | nidrito bodhita iva kshinasamsmarano
    hi sah || || kva dhanani kva mitrani kva me vishayadasyavah | kva shastram kva ca vijnanam yada me
    galita spriha || || vijnate sakshipurushe paramatmani ceshvare | nairashye bandhamokshe ca na cinta
    muktaye mama || || antarvikalpashunyasya bahih svacchandacarinah | bhrantasyeva dashastastastadrisha
    eva janate ||
  devanagari: जनक उवाच ॥ प्रकृत्या शून्यचित्तो यः प्रमादाद् भावभावनः । निद्रितो बोधित इव क्षीणसंस्मरणो
    हि सः ॥ ॥ क्व धनानि क्व मित्राणि क्व मे विषयदस्यवः । क्व शास्त्रं क्व च विज्ञानं यदा मे गलिता स्पृहा
    ॥ ॥ विज्ञाते साक्षिपुरुषे परमात्मनि चेश्वरे । नैराश्ये बन्धमोक्षे च न चिन्ता मुक्तये मम ॥ ॥ अन्तर्विकल्पशून्यस्य
    बहिः स्वच्छन्दचारिणः । भ्रान्तस्येव दशास्तास्तास्तादृशा एव जानते ॥
