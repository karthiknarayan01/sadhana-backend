id: sharabhahridayam
category: hridaya
name:
  english: sharabhahridayam
  devanagari: शरभहृदयम्
content:
  english: proktam caturtham lokanayakam | pancamam renukanatham shashtham kalagnirudrakam || 16|| saptamam
    narasimharimashtamam vishvamohanam | shrim hrim klim navamam caiva hum hum hum dashamam tatha || 17||
    klim hrim klamekadasham ca dvadasham sarvamantravit | trayodasham tu yantresham caturdasham mahabalah
    || 18|| pancadasham papanasham shodasham ca karalakam | saptadasham maharaudram bhimamashtadasham
    tatha || 19|| ekonavimsham sambam ca vimsham ca shankaram tatha | vimshottaraikam sarvesham dvavimsham
    parvatipatim || 20|| trayovimsham ca hrum hrum hrum caturvimshamanantakam | pancavimsham vrisharudham
    shadavimsham vishvalocanam || 21|| trilocanam saptavimshamashtavimsham khagendrakam | pam pam pam
    navavimsham ca trimsham bhujagabhushanam || 22|| ekatrimsham ca lam lam lam dvatrimsham pancavaktrakam
    trayastrimsham ca anandam catustrimsham paratparam || 23|| pancatrimsham ca bham bham bham shatatrimsham
    shatrunashanam | saptatrimsham svayambhujam vishveshamashtatrimshakam
  devanagari: प्रोक्तं चतुर्थं लोकनायकम् । पञ्चमं रेणुकानाथं षष्ठं कालाग्निरुद्रकम् ॥ १६॥ सप्तमं नारसिंहारिमष्टमं
    विश्वमोहनम् । श्रीं ह्रीं क्लीं नवमं चैव हुं हुं हुं दशमं तथा ॥ १७॥ क्लीं ह्रीं क्लामेकादशं च द्वादशं
    सर्वमन्त्रवित् । त्रयोदशं तु यन्त्रेशं चतुर्दशं महाबलः ॥ १८॥ पञ्चदशं पापनाशं षोडशं च करालकम् । सप्तदशं
    महारौद्रं भीममष्टादशं तथा ॥ १९॥ एकोनविंशं साम्बं च विंशं च शङ्करं तथा । विंशोत्तरैकं सर्वेशं द्वाविंशं
    पार्वतीपतिम् ॥ २०॥ त्रयोविंशं च ह्रूं ह्रूं ह्रूं चतुर्विंशमनन्तकम् । पञ्चविंशं वृषारूढं षडविंशं विश्वलोचनम्
    ॥ २१॥ त्रिलोचनं सप्तविंशमष्टाविंशं खगेन्द्रकम् । पं पं पं नवविंशं च त्रिंशं भुजगभूषणम् ॥ २२॥ एकत्रिंशं
    च लं लं लं द्वात्रिंशं पञ्चवक्त्रकम् त्रयस्त्रिंशं च आनन्दं चतुस्त्रिंशं परात्परम् ॥ २३॥ पञ्चत्रिंशं
    च भं भं भं षटत्रिंशं शत्रुनाशनम् । सप्तत्रिंशं स्वयम्भूजं विश्वेशमष्टत्रिंशकम्
