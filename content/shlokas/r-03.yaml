id: r-03
category: veda
name:
  english: r 03
  devanagari: र् ०३
content:
  english: 11 pi̱tre ci̭ccakru̱h sada̭na̱m sama̭smai̱ mahi̱ tvishi̭matsu̱krito̱ vi hi khyan | vi̱shka̱bhnanta̱h
    skambha̭nena̱ jani̭tri̱ asi̭na u̱rdhvam ra̭bha̱sam vi mi̭nvan || 3
  devanagari: ११ पि॒त्रे चि॑च्चक्रुः॒ सद॑नं॒ सम॑स्मै॒ महि॒ त्विषी॑मत्सु॒कृतो॒ वि हि ख्यन् । वि॒ष्क॒भ्नन्तः॒
    स्कम्भ॑नेना॒ जनि॑त्री॒ आसी॑ना ऊ॒र्ध्वं र॑भ॒सं वि मि॑न्वन् ॥ ३
