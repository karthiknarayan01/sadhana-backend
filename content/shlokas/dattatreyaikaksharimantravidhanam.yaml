id: dattatreyaikaksharimantravidhanam
category: mantra
name:
  english: dattatreyaikaksharimantravidhanam
  devanagari: दत्तात्रेयैकाक्षरीमन्त्रविधानम्
content:
  english: om asya shridattatreyaikaksharimantrasya bhagavan sadashiva rishih | gayatri chandah | caturbhuja
    shridattatreya devata | jape viniyogah || rishyadinyasah | bhagavate sadashivarishaye namah shirasi
    | gayatrichandase namah mukhe | caturbhujashridattatreyadevatayai namah hridi | jape viniyogaya namah
    sarvange || karanyasah | om dram angushthabhyam namah | om drim tarjanibhyam svaha | om drum madhyamabhyam
    vashat | om draim anamikabhyam hum | om draum kanishthikabhyam vaushat | om drah karatalakaraprishthabhyam
    phat || shadanganyasah | om dram hridayaya namah | om drim shirase svaha | om drum shikhayai vashat
    | om draim kavacaya hum | om draum netratrayaya vaushat | om drah astraya phat || dhyanam
  devanagari: ॐ अस्य श्रीदत्तात्रेयैकाक्षरीमन्त्रस्य भगवान् सदाशिव ऋषिः । गायत्री छन्दः । चतुर्भुज श्रीदत्तात्रेय
    देवता । जपे विनियोगः ॥ ऋष्यादिन्यासः । भगवते सदाशिवऋषये नमः शिरसि । गायत्रीछन्दसे नमः मुखे । चतुर्भुजश्रीदत्तात्रेयदेवतायै
    नमः हृदि । जपे विनियोगाय नमः सर्वाङ्गे ॥ करन्यासः । ॐ द्रां अङ्गुष्ठाभ्यां नमः । ॐ द्रीं तर्जनीभ्यां
    स्वाहा । ॐ द्रूं मध्यमाभ्यां वषट् । ॐ द्रैं अनामिकाभ्यां हुं । ॐ द्रौं कनिष्ठिकाभ्यां वौषट् । ॐ द्रः
    करतलकरपृष्ठाभ्यां फट् ॥ षडङ्गन्यासः । ॐ द्रां हृदयाय नमः । ॐ द्रीं शिरसे स्वाहा । ॐ द्रूं शिखायै वषट्
    । ॐ द्रैं कवचाय हुं । ॐ द्रौं नेत्रत्रयाय वौषट् । ॐ द्रः अस्त्राय फट् ॥ ध्यानम्
