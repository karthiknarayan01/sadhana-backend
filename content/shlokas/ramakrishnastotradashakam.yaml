id: ramakrishnastotradashakam
category: stotram
name:
  english: ramakrishnastotradashakam
  devanagari: रामकृष्णस्तोत्रदशकम्
content:
  english: ramakrishnamishvaram || 9|| dharmahanaharakam tvadharmakarmavarakam lokadharmacaranam ca sarvadharmakovidam
    | tyagi gehi sevya nitya pavananghri pankajam tam namami deva
  devanagari: रामकृष्णमीश्वरम् ॥ ९॥ धर्महानहारकं त्वधर्मकर्मवारकं लोकधर्मचारणं च सर्वधर्मकोविदम् । त्यागि
    गेहि सेव्य नित्य पावनाङ्घ्रि पङ्कजं तं नमामि देव
meaning: {}
