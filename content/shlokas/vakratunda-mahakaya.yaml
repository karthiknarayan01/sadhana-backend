id: vakratunda-mahakaya
category: stotra
name:
  english: Vakratunda Mahakaya
  devanagari: वक्रतुण्ड महाकाय
content:
  english: >-
    vakratunda mahakaya surya-koti-sama-prabha, nirvighnam kuru me
    deva sarva-karyeshu sarvada
  devanagari: >-
    वक्रतुण्ड महाकाय सूर्यकोटिसमप्रभ । निर्विघ्नं कुरु मे देव
    सर्वकार्येषु सर्वदा ॥
meaning:
  english: >-
    O curved-trunk, mighty-bodied one, radiant as a million suns —
    remove all obstacles from my endeavors, always.
source_attribution:
  text_source: Traditional Ganesha invocation verse, widely recited before undertakings
  translation_source: Original paraphrase written for Sadhana
  license: original_translation
