id: cakrarajamangalam
category: stotram
name:
  english: cakrarajamangalam
  devanagari: चक्रराजमन्गलम्
content:
  english: shricakraraja mangaḻam mangaḻam cakrarajaya mahaniya gunabdhaye padmanabha karambhoja parishkaraya
    mangaḻam || 1|| kashi viploshakaraya kalyanaguna shaline | mali pramathanayastu mahadhiraya mangaḻam
    || 2|| gajemdrarti harayasthu graha dvedhadvakarine | dinadhisha tirodhana kartre diptaya mangaḻam
    || 3|| citrakara svacaraya citta nirvriti karine | narakasura samhartre nanarupaya mangaḻam || 4||
    candastrancita dordanda khanditamarashatrave | camikara nibhangaya carunetraya mangaḻam || 5|| caityasura
    shirohartre candrahḻada karaya te | shrimate cakrarajaya shritartighnaya mangaḻam || 6|| || shri cakraraja
    mangaḻam samaptam || || shrimate sudarshanaya namah ||
  devanagari: श्रीचक्रराज मङ्गळम् मङ्गळं चक्रराजाय महनीय गुणाब्धये पद्मनाभ करांभोज परिष्काराय मङ्गळम्
    ॥ १॥ काशी विप्लोषकाराय कल्याणगुण शालिने । मालि प्रमथनायास्तु महाधीराय मङ्गळम् ॥ २॥ गजेंद्रार्ति हरायास्थु
    ग्राह द्वेधाद्वकारिणे । दिनाधीश तिरोधान कर्त्रे दीप्ताय मङ्गळम् ॥ ३॥ चित्राकार स्वचाराय चित्त निर्वृति
    कारिणे । नरकासुर संहर्त्रे नानारूपाय मङ्गळम् ॥ ४॥ चण्डास्त्राञ्चित दोर्दण्ड खण्डितामरशत्रवे । चामीकर
    निभाङ्गाय चारुनेत्राय मङ्गळम् ॥ ५॥ चैत्यासुर शिरोहर्त्रे चन्द्राह्ळाद कराय ते । श्रीमते चक्रराजाय
    श्रितार्तिघ्नाय मङ्गळम् ॥ ६॥ ॥ श्री चक्रराज मङ्गळम् समाप्तम् ॥ ॥ श्रीमते सुदर्शनाय नमः ॥
