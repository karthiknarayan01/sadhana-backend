id: munibhihkritamrudrastotram
category: stotram
name:
  english: munibhihkritamrudrastotram
  devanagari: मुनिभिःकृतंरुद्रस्तोत्रम्
content:
  english: munibhih kritam rudrastotram munaya ucuh | tvamekamisham purusham puranam praneshvaram rudramanantayogam
    | namama sarve hridi sannivishtam pracetasam brahmamayam pavitram || 1|| tvam pashyanti munayo brahmayonim
    dantah shanta vimalam rukmavarnam | dhyatva''tmasthamacalam sve sharire kavim parebhyah paramam param
    ca || 2|| tvattah prasuta jagatah prasutih sarvatmabhustvam paramanubhutah | anoraniyan mahato mahiyamstvameva
    sarvam pravadanti santah || 3|| hiranyagarbho jagadantaratma tvatto'dhijatah purushah puranah | sanjayamano
    bhavata visrishto yathavidhanam sakalam sasarja || 4|| tvatto vedah sakalah samprasutastvayyevante
    samsthitim te labhante | pashyamastvam jagato hetubhutam nrityantam sve hridaye sannivishtam || 5||
    tvayaivedam bhramyate brahmacakram mayavi tvam jagatamekanathah | namamastvam sharanam samprapanna
    yogatmanam citpatim divyanrityam || 6|| pashyamasttvam paramakashamadhye nrityantam te mahimanam smaramah
    | sarvatmanam bahudha sannivishtam brahmanandamanubhuyanubhuya || 8|| onkaraste vacako muktibijam
    tvamaksharam prakritau gudharupam | tattvam satyam pravadantiha santah svayamprabham bhavato yatprabhavam
    || 8|| stuvanti tvam satatam sarvavedah namanti tvamrishayah kshinadoshah | shantatmanah satyasandham
    varishtham vishanti tvam yatayo brahmanishthah || 9|| eko vedo bahushakho hyanantastvamevaikam bodhayatyekarupam
    | vandyam tvam ye sharanam samprapannastesham shantih shashvati netaresham || 10|| bhavanisho'nadimamstejorashirbrahma
    vishvam parameshthi varishtah | svatmanandamanubhuya vishante svayam jyotiracalo nityamuktah || 11||
    eko rudrastvam karoshiha vishvam tvam palayasyakhilam vishvarupam | tvamevante nilayam vindatidam
    namamastvam sharanam samprapannah || 12|| tvamekamahuh kavimekarudram brahmam brihantam harimagnimisham
    | indram mrityumanilam cekitanam dhataramadityamanekarupam || 13|| tvamaksharam paramam veditavyam
    tvamasya vishvasya param nidhanam | tvamavyayah shashvatadharmagopta sanatanastvam purushottamo'si
    || 14|| tvameva vishnushcaturananastvam tvameva rudro bhagavanapishah | tvam vishvanathah prakritih
    pratishtha sarveshvarastvam parameshvaro'si || 15|| tvamekamahuh purusham purana
  devanagari: मुनिभिः कृतं रुद्रस्तोत्रम् मुनय ऊचुः । त्वामेकमीशं पुरुषं पुराणं प्राणेश्वरं रुद्रमनन्तयोगम्
    । नमाम सर्वे हृदि सन्निविष्टं प्रचेतसं ब्रह्ममयं पवित्रम् ॥ १॥ त्वां पश्यन्ति मुनयो ब्रह्मयोनिं दान्ताः
    शान्ता विमलं रुक्मवर्णम् । ध्यात्वाऽऽत्मस्थमचलं स्वे शरीरे कविं परेभ्यः परमं परं च ॥ २॥ त्वत्तः प्रसूता
    जगतः प्रसूतिः सर्वात्मभूस्त्वं परमाणुभूतः । अणोरणीयान् महतो महीयांस्त्वामेव सर्वं प्रवदन्ति सन्तः
    ॥ ३॥ हिरण्यगर्भो जगदन्तरात्मा त्वत्तोऽधिजातः पुरुषः पुराणः । सञ्जायमानो भवता विसृष्टो यथाविधानं सकलं
    ससर्ज ॥ ४॥ त्वत्तो वेदाः सकलाः सम्प्रसूतास्त्वय्येवान्ते संस्थितिं ते लभन्ते । पश्यामस्त्वां जगतो
    हेतुभूतं नृत्यन्तं स्वे हृदये सन्निविष्टम् ॥ ५॥ त्वयैवेदं भ्राम्यते ब्रह्मचक्रं मायावी त्वं जगतामेकनाथः
    । नमामस्त्वां शरणं सम्प्रपन्ना योगात्मानं चित्पतिं दिव्यनृत्यम् ॥ ६॥ पश्यामस्त्त्वां परमाकाशमध्ये
    नृत्यन्तं ते महिमानं स्मरामः । सर्वात्मानं बहुधा सन्निविष्टं ब्रह्मानन्दमनुभूयानुभूय ॥ ८॥ ओङ्कारस्ते
    वाचको मुक्तिबीजं त्वमक्षरं प्रकृतौ गूढरूपम् । तत्त्वां सत्यं प्रवदन्तीह सन्तः स्वयम्प्रभं भवतो यत्प्रभावम्
    ॥ ८॥ स्तुवन्ति त्वां सततं सर्ववेदाः नमन्ति त्वामृषयः क्षीणदोषाः । शान्तात्मानः सत्यसन्धं वरिष्ठं विशन्ति
    त्वां यतयो ब्रह्मनिष्ठाः ॥ ९॥ एको वेदो बहुशाखो ह्यनन्तस्त्वामेवैकं बोधयत्येकरूपम् । वन्द्यं त्वां
    ये शरणं सम्प्रपन्नास्तेषां शान्तिः शाश्वती नेतरेषाम् ॥ १०॥ भवानीशोऽनादिमांस्तेजोराशिर्ब्रह्मा विश्वं
    परमेष्ठी वरिष्टः । स्वात्मानन्दमनुभूय विशन्ते स्वयं ज्योतिरचलो नित्यमुक्ताः ॥ ११॥ एको रुद्रस्त्वं
    करोषीह विश्वं त्वं पालयस्यखिलं विश्वरूपम् । त्वामेवान्ते निलयं विन्दतीदं नमामस्त्वां शरणं सम्प्रपन्नाः
    ॥ १२॥ त्वामेकमाहुः कविमेकरुद्रं ब्रह्मं बृहन्तं हरिमग्निमीशम् । इन्द्रं मृत्युमनिलं चेकितानं धातारमादित्यमनेकरूपम्
    ॥ १३॥ त्वमक्षरं परमं वेदितव्यं त्वमस्य विश्वस्य परं निधानम् । त्वमव्ययः शाश्वतधर्मगोप्ता सनातनस्त्वं
    पुरुषोत्तमोऽसि ॥ १४॥ त्वमेव विष्णुश्चतुराननस्त्वं त्वमेव रुद्रो भगवानपीशः । त्वं विश्वनाथः प्रकृतिः
    प्रतिष्ठा सर्वेश्वरस्त्वं परमेश्वरोऽसि ॥ १५॥ त्वामेकमाहुः पुरुषं पुराण
