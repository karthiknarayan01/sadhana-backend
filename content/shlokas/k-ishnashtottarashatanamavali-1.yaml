id: k-ishnashtottarashatanamavali-1
category: stotram
name:
  english: kṟishnashtottarashatanamavali 1
  devanagari: क्ऱिष्णाष्टोत्तरशतनामावली १
content:
  english: navanitanavaharine om mucukundaprasadakaya namah | om shodashastrisahasreshaya namah | om tribhangine
    namah | om madhurakritaye namah | om shukavagamritabdhindave namah | om govindaya namah | 30 om govidampataye
    namah | om vatsavaticaraya namah | om anantaya namah | om dhenukasurabhanjanaya namah | om trinikritatrinavartaya
    namah | om yamalarjunabhanjanaya namah | om uttalatalabhetre namah | om tamalashyamalakritaye namah
    | om gopagopishvaraya namah | om yogine namah | 40 om kotisuryasamaprabhaya namah | om ilapataye namah
    | om paranjyotishe namah | om yadavendraya namah | om yadudvahaya namah | om vanamaline namah | om
    pitavasase namah | om parijatapaharakaya namah | om govardhanacaloddhartre namah | om gopalaya namah
    | 50 om sarvapalakaya namah | om ajaya namah | om niranjanaya namah | om kamajanakaya namah | om kanjalocanaya
    namah | om madhughne namah | om mathuranathaya namah | om dvarakanayakaya namah | om baline namah
    | om vrindavanantasancarine namah | 60 om tulasidamabhushanaya namah | om syamantakamanerhartre namah
    | om naranarayanatmakaya namah | om kubjakrishtambaradharaya namah | om mayine namah | om paramapurushaya
    namah | om mushtikasuracanuramallayuddhavisharadaya namah | om samsaravairine namah | om kamsaraye
    namah | om muraraye namah | 70 om narakantakaya namah | om anadibrahmacarine namah | om krishnavyasanakarshakaya
    namah | om shishupalashirashchetre namah | om duryodhanakulantakaya namah | om vidurakruravaradaya
    namah | om vishvarupapradarshakaya namah | om satyavace namah | om satyasankalpaya namah | om satyabhamarataya
    namah | 80 om jayine namah | om subhadrapurvajaya namah | om jishnave namah | om bhishmamuktipradayakaya
    namah | om jagadgurave namah | om jagannathaya namah | om venunadavisharadaya namah | om vrishabhasuravidhvamsine
    namah | om banasurakarantakaya namah | banasurabalantakaya
  devanagari: नवनीतनवाहारिणे ॐ मुचुकुन्दप्रसादकाय नमः । ॐ षोडशस्त्रीसहस्रेशाय नमः । ॐ त्रिभङ्गिने नमः
    । ॐ मधुराकृतये नमः । ॐ शुकवागमृताब्धिन्दवे नमः । ॐ गोविन्दाय नमः । ३० ॐ गोविदाम्पतये नमः । ॐ वत्सवाटीचराय
    नमः । ॐ अनन्ताय नमः । ॐ धेनुकासुरभञ्जनाय नमः । ॐ तृणीकृततृणावर्ताय नमः । ॐ यमलार्जुनभञ्जनाय नमः ।
    ॐ उत्तालतालभेत्रे नमः । ॐ तमालश्यामलाकृतये नमः । ॐ गोपगोपीश्वराय नमः । ॐ योगिने नमः । ४० ॐ कोटिसूर्यसमप्रभाय
    नमः । ॐ इलापतये नमः । ॐ परञ्ज्योतिषे नमः । ॐ यादवेन्द्राय नमः । ॐ यदूद्वहाय नमः । ॐ वनमालिने नमः ।
    ॐ पीतवाससे नमः । ॐ पारिजातापहारकाय नमः । ॐ गोवर्धनाचलोद्धर्त्रे नमः । ॐ गोपालाय नमः । ५० ॐ सर्वपालकाय
    नमः । ॐ अजाय नमः । ॐ निरञ्जनाय नमः । ॐ कामजनकाय नमः । ॐ कञ्जलोचनाय नमः । ॐ मधुघ्ने नमः । ॐ मथुरानाथाय
