id: brahmakritam08shivastotram
category: stotram
name:
  english: brahmakritam08shivastotram
  devanagari: ब्रह्मकृतं०८शिवस्तोत्रम्
content:
  english: brahmakritam 8 shivastotram brahmovaca | namah shivayamalasattvacetase gunatrayatitavisaritejase
    | shadangavedasya mamapi vedhase parasvarupanubhavaya cakshushe || 13|| namo' stu te srishtividhau
    rajojushe jagatsthitau sattvamadhishthitaya te | vinashahetau tamasa mahiyase shivaya nirvanasukhapradayine
    || 14|| asheshabhutaprakriteh paraya vai paratmarupaya namah shivaya vai | nribuddhyahankaramanovidhayine
    bhartre ca shadvimshakarupakaya vai || 15|| bhutoyavahnyambaravayucandrasuryatmarupabhiridam tanubhih
    | vyaptam jagadyasya namo'stu tasmai bhutam bhavishyamatha vartamanam || 16|| yaniha tejamsi jaganti
    yani bhutani bhavyanyatha karanani | bhavanti srishtau vilayam vinashe vrajanti yasyatmani tam namami
    || 17|| iti shriskandapurane avantyakhande avantikshetramahatmye dvitiyadhyayantargatam brahmakritam
    shivastotram samaptam | skandapurana | avantyakhanda | avantyakhanda | adhyaya 2
  devanagari: ब्रह्मकृतं ८ शिवस्तोत्रम् ब्रह्मोवाच । नमः शिवायामलसत्त्वचेतसे गुणत्रयातीतविसारितेजसे ।
    षडङ्गवेदस्य ममापि वेधसे परस्वरूपानुभवाय चक्षुषे ॥ १३॥ नमोऽ स्तु ते सृष्टिविधौ रजोजुषे जगत्स्थितौ सत्त्वमधिष्ठिताय
    ते । विनाशहेतौ तमसा महीयसे शिवाय निर्वाणसुखप्रदायिने ॥ १४॥ अशेषभूतप्रकृतेः पराय वै परात्मरूपाय नमः
    शिवाय वै । नृबुद्ध्यहङ्कारमनोविधायिने भर्त्रे च षड्विंशकरूपकाय वै ॥ १५॥ भूतोयवह्न्यम्बरवायुचन्द्रसूर्यात्मरूपाभिरिदं
    तनूभिः । व्याप्तं जगद्यस्य नमोऽस्तु तस्मै भूतं भविष्यमथ वर्तमानम् ॥ १६॥ यानीह तेजांसि जगन्ति यानि
    भूतानि भव्यान्यथ कारणानि । भवन्ति सृष्टौ विलयं विनाशे व्रजन्ति यस्यात्मनि तं नमामि ॥ १७॥ इति श्रीस्कन्दपुराणे
    आवन्त्यखण्डे अवन्तीक्षेत्रमाहात्म्ये द्वितीयाध्यायान्तर्गतं ब्रह्मकृतं शिवस्तोत्रं समाप्तम् । स्कन्दपुराण
    । आवन्त्यखण्ड । आवन्त्यखण्ड । अध्याय २
meaning: {}
