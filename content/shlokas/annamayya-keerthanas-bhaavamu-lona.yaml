id: annamayya-keerthanas-bhaavamu-lona
category: stotram
name:
  english: Annamayya Keerthanas Bhaavamu Lona
content:
  english: adi pallavi bhavamulona bahyamunandunu | govinda govindayani kòluvavo manasa || hari yavataramule
    yakhila devatalu hari lonive brahmandambulu | hari namamule anni mantramulu hari hari hari hari yanavo
    manasa || bhavamulona bahyamunandunu vishnuni mahimale vihita karmamulu vishnuni pògadèdi vedambulu
    | vishnudòkkade vishvantaratmudu vishnuvu vishnuvani vèdakavo manasa || bhavamulona bahyamunandunu
    acyutuditade adiyu nantyamu acyutude yasurantakudu | acyutudu shrivenkatadri midanidè acyuta yacyuta
    sharananavo manasa || bhavamulona bahyamunandunu govinda govindayani kòluvavo manasa ||
  devanagari: आदि पल्लवि भावमुलोना बाह्यमुनन्दुनु । गोविन्द गोविन्दयनि कॊलुववो मनसा ॥ हरि यवतारमुले यखिल
    देवतलु हरि लोनिवे ब्रह्माण्डम्बुलु । हरि नाममुले अन्नि मन्त्रमुलु हरि हरि हरि हरि यनवो मनसा ॥ भावमुलोना
    बाह्यमुनन्दुनु विष्णुनि महिमले विहित कर्ममुलु विष्णुनि पॊगडॆडि वेदम्बुलु । विष्णुडॊक्कडे विश्वान्तरात्मुडु
    विष्णुवु विष्णुवनि वॆदकवो मनसा ॥ भावमुलोना बाह्यमुनन्दुनु अच्युतुडितडे आदियु नन्त्यमु अच्युतुडे यसुरान्तकुडु
    । अच्युतुडु श्रीवेङ्कटाद्रि मीदनिदॆ अच्युत यच्युत शरणनवो मनसा ॥ भावमुलोना बाह्यमुनन्दुनु गोविन्द गोविन्दयनि
    कॊलुववो मनसा ॥
