id: mallarikavacam
category: kavacha
name:
  english: mallarikavacam
  devanagari: मल्लारीकवचम्
content:
  english: shrimallarikavacam malharikavacam shriganeshaya namah | asya shrimallarikavacamantrasya skandarishih
    | anushthupchandah | shrimallaridevata | shrimallarikavacajape viniyogah || atha dhyanam | dhyayenmallaridevam
    kanakagirinibham mhalasabhushitankam shvetashvam khadgahastam vibudhabudhaganaissevyamanam kritarthe
    | yuktanghri daityamurghni damaruvilasitam naishacurnabhiramam nityambhakteshu tushtam shvaganaparivritam
    nityamomkararupam || atha kavacam | sanatkumara uvaca | muninam saptakotinam varadam bhaktavatsalam
    | dushtamardanadevesham vande'ham mhalasapatim || 1|| anugrahaya devanam maniratnagiri sthitam | prasannavadanam
    nityam vande'ham mallavairinam || 2|| sarvadevamayam shantam kaumaram karunakaram | adirudram maharudram
    vande'ham satvikapriyam || 3|| bhuktimuktipradam devam sarvabharanabhushitam | kotisuryapratikasham
    vande'hamasurantakam || 4|| adidevam mahadevam mallariparameshvaram | virasattvam virupaksham vande'ham
    bhaktavatsalam || 5|| bhogarupaparamjyotih shiromalavibhushitam | trishuladidharam devam vande'ham
    lokarakshakam || 6|| idam pathati yo bhaktya mallaripritikarakam | bhaktanam varadam nityam pranato'smi
    maheshvaram || 7|| phalashrutih
  devanagari: श्रीमल्लारिकवचम् मल्हारिकवचम् श्रीगणेशाय नमः । अस्य श्रीमल्लारिकवचमन्त्रस्य स्कन्दऋषिः ।
    अनुष्ठुप्छन्दः । श्रीमल्लारिदेवता । श्रीमल्लारिकवचजपे विनियोगः ॥ अथ ध्यानम् । ध्यायेन्मल्लारिदेवं
    कनकगिरीनिभं म्हालसाभूषिताङ्कं श्वेताश्वं खड्गहस्तं विबुधबुधगणैस्सेव्यमानं कृतार्थे । युक्ताङ्घ्रि
    दैत्यमूर्घ्नी डमरुविलसितं नैशचूर्णाभिरामं नित्यंभक्तेषु तुष्टं श्वगणपरिवृतं नित्यमोंकाररूपम् ॥ अथ
    कवचम् । सनत्कुमार उवाच । मुनीनां सप्तकोटीनां वरदं भक्तवत्सलम् । दुष्टमर्दनदेवेशं वन्देऽहं म्हालसापतिम्
    ॥ १॥ अनुग्रहाय देवानां मणिरत्नगिरी स्थितम् । प्रसन्नवदनं नित्यं वन्देऽहं मल्लवैरिणम् ॥ २॥ सर्वदेवमयं
    शान्तं कौमारं करुणाकरम् । आदिरुद्रं महारुद्रं वन्देऽहं सात्विकप्रियम् ॥ ३॥ भुक्तिमुक्तिप्रदं देवं
    सर्वाभरणभूषितम् । कोटिसूर्यप्रतीकाशं वन्देऽहमसुरान्तकम् ॥ ४॥ आदिदेवं महादेवं मल्लारिपरमेश्वरम् । वीरसत्त्वं
    विरूपाक्षं वन्देऽहं भक्तवत्सलम् ॥ ५॥ भोगरूपपरंज्योतिः शिरोमालाविभूषितम् । त्रिशूलादिधरं देवं वन्देऽहं
    लोकरक्षकम् ॥ ६॥ इदं पठति यो भक्त्या मल्लारिप्रीतिकारकम् । भक्तानां वरदं नित्यं प्रणतोऽस्मि महेश्वरम्
    ॥ ७॥ फलश्रुतिः
