id: annamayya-keerthanas-viduva-viduvaninka
category: stotram
name:
  english: Annamayya Keerthanas Viduva Viduvaninka
content:
  english: suryakantam viduvaviduvaninka vishnuda nipadamulu kadagi samsaravarthi kadumuncukònina || paramatma
    nivèndo parakaiyunnanu paraga nannindriyalu paracinanu | dharanipai cèlaregi tanuvu vesarinanu duritalu
    naluvanka ma dòdiki tisinanu || puttugu littè rani bhuvi leka manani vatti mudimaina rani vayase rani
    | cuttukònnabandhamulu cudani vidani nèttukònnayantaratma niku nakubodu || yidehame yayina ika nòkatainanu
    kadu gudadani mukti kadakegina | shridevudavaina shrivenkatesha niku sodinci nisharaname còcciti nenikanu
    ||
  devanagari: सूर्यकान्तं विडुवविडुवनिङ्क विष्णुड नीपादमुलु कडगि संसारवार्थि कडुमुञ्चुकॊनिन ॥ परमात्म
    नीवॆन्दो पराकैयुन्नानु परग नन्निन्द्रियालु परचिनानु । धरणिपै चॆलरेगि तनुवु वेसरिनानु दुरितालु नलुवङ्क
    म दॊडिकि तीसिननु ॥ पुट्टुगु लिट्टॆ रानी भुवि लेक माननी वट्टि मुदिमैन रानी वयसे रानी । चुट्टुकॊन्नबन्धमुलु
    चूडनी वीडनी नॆट्टुकॊन्नयन्तरात्म नीकु नाकुबोदु ॥ यीदेहमे ययिन इक नॊकटैनानु कादु गूडदनि मुक्ति कडकेगिना
    । श्रीदेवुडवैन श्रीवेङ्कटेश नीकु सोदिञ्चि नीशरणमे चॊच्चिति नेनिकनु ॥
