id: devi-aparajita-stotram
category: stotram
name:
  english: Devi Aparajita Stotram
content:
  english: namo devyai mahadevyai shivayai satatam namah | namah prakrityai bhadrayai niyatah pranatah
    smatam || || raudrayai namo nityayai gauryai dhatryai namo namah | jyotsnayai cendurupinyai sukhayai
    satatam namah || || kalyanyai pranata vriddhyai siddhyai kurmo namo namah | nairrityai bhubhritam
    lakshmyai sharvanyai te namo namah || || durgayai durgaparayai sarayai sarvakarinyai | khyatyai tathaiva
    krishnayai dhumrayai satatam namah || || atisaumyatiraudrayai natastasyai namo namah | namo jagatpratishthayai
    devyai krityai namo namah || || ya devi sarvabhuteshu vishnumayeti shabdita | namastasyai namastasyai
    namastasyai namo namah || || ya devi sarvabhuteshu cetanetyabhidhiyate | namastasyai namastasyai namastasyai
    namo namah || || ya devi sarvabhuteshu buddhirupena samsthita | namastasyai namastasyai namastasyai
    namo namah || || ya devi sarvabhuteshu nidrarupena samsthita | namastasyai namastasyai namastasyai
    namo namah || || ya devi sarvabhuteshu kshudharupena samsthita | namastasyai namastasyai namastasyai
    namo namah || || ya devi sarvabhuteshu chayarupena samsthita | namastasyai namastasyai namastasyai
    namo namah || || ya devi sarvabhuteshu shaktirupena samsthita | namastasyai namastasyai namastasyai
    namo namah || || ya devi sarvabhuteshu trishnarupena samsthita | namastasyai namastasyai namastasyai
    namo namah || || ya devi sarvabhuteshu kshantirupena samsthita | namastasyai namastasyai namastasyai
    namo namah || || ya devi sarvabhuteshu jatirupena samsthita | namastasyai namastasyai namastasyai
    namo namah || || ya devi sarvabhuteshu lajjarupena samsthita | namastasyai namastasyai namastasyai
    namo namah || || ya devi sarvabhuteshu shantirupena samsthita | namastasyai namastasyai namastasyai
    namo namah || || ya devi sarvabhuteshu shraddharupena samsthita | namastasyai namastasyai namastasyai
    namo namah || || ya devi sarvabhuteshu kantirupena samsthita | namastasyai namastasyai namastasyai
    namo namah || || ya devi sarvabhuteshu lakshmirupena samsthita | namastasyai namastasyai namastasyai
    namo namah || || ya devi sarvabhuteshu vrittirupena samsthita | namastasyai namastasyai namastasyai
    namo namah || || ya devi sarvabhuteshu smritirupena samsthita | namastasyai namastasyai namastasyai
    namo namah || || ya devi sarvabhuteshu dayarupena samsthita | namastasyai namastasyai namastasyai
    namo namah || || ya devi sarvabhuteshu tushtirupena samsthita | namastasyai namastasyai namastasyai
    namo namah || || ya devi sarvabhuteshu matrirupena samsthita | namastasyai namastasyai namastasyai
    namo namah || || ya devi sarvabhuteshu bhrantirupena samsthita | namastasyai namastasyai namastasyai
    namo namah || || indriyanamadhishthatri bhutanam cakhileshu ya | bhuteshu satatam tasyai vyaptyai
    devyai namo namah || || citirupena ya kritsnametad vyapya sthita jagat | namastasyai namastasyai namastasyai
    namo namah ||
  devanagari: नमो देव्यै महादेव्यै शिवायै सततं नमः । नमः प्रकृत्यै भद्रायै नियताः प्रणताः स्मताम् ॥ ॥
    रौद्रायै नमो नित्यायै गौर्यै धात्र्यै नमो नमः । ज्योत्स्नायै चेन्दुरूपिण्यै सुखायै सततं नमः ॥ ॥ कल्याण्यै
    प्रणता वृद्ध्यै सिद्ध्यै कुर्मो नमो नमः । नैरृत्यै भूभृतां लक्ष्म्यै शर्वाण्यै ते नमो नमः ॥ ॥ दुर्गायै
    दुर्गपारायै सारायै सर्वकारिण्यै । ख्यात्यै तथैव कृष्णायै धूम्रायै सततं नमः ॥ ॥ अतिसौम्यातिरौद्रायै
    नतास्तस्यै नमो नमः । नमो जगत्प्रतिष्ठायै देव्यै कृत्यै नमो नमः ॥ ॥ या देवी सर्वभूतेषु विष्णुमायेति
    शब्दिता । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ॥ ॥ या देवी सर्वभूतेषु चेतनेत्यभिधीयते । नमस्तस्यै
    नमस्तस्यै नमस्तस्यै नमो नमः ॥ ॥ या देवी सर्वभूतेषु बुद्धिरूपेण संस्थिता । नमस्तस्यै नमस्तस्यै नमस्तस्यै
    नमो नमः ॥ ॥ या देवी सर्वभूतेषु निद्रारूपेण संस्थिता । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ॥ ॥ या
    देवी सर्वभूतेषु क्षुधारूपेण संस्थिता । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ॥ ॥ या देवी सर्वभूतेषु
    छायारूपेण संस्थिता । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ॥ ॥ या देवी सर्वभूतेषु शक्तिरूपेण संस्थिता
    । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ॥ ॥ या देवी सर्वभूतेषु तृष्णारूपेण संस्थिता । नमस्तस्यै नमस्तस्यै
    नमस्तस्यै नमो नमः ॥ ॥ या देवी सर्वभूतेषु क्षान्तिरूपेण संस्थिता । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो
    नमः ॥ ॥ या देवी सर्वभूतेषु जातिरूपेण संस्थिता । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ॥ ॥ या देवी
    सर्वभूतेषु लज्जारूपेण संस्थिता । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ॥ ॥ या देवी सर्वभूतेषु शान्तिरूपेण
    संस्थिता । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ॥ ॥ या देवी सर्वभूतेषु श्रद्धारूपेण संस्थिता । नमस्तस्यै
    नमस्तस्यै नमस्तस्यै नमो नमः ॥ ॥ या देवी सर्वभूतेषु कान्तिरूपेण संस्थिता । नमस्तस्यै नमस्तस्यै नमस्तस्यै
    नमो नमः ॥ ॥ या देवी सर्वभूतेषु लक्ष्मीरूपेण संस्थिता । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ॥ ॥ या
    देवी सर्वभूतेषु वृत्तिरूपेण संस्थिता । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ॥ ॥ या देवी सर्वभूतेषु
    स्मृतिरूपेण संस्थिता । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ॥ ॥ या देवी सर्वभूतेषु दयारूपेण संस्थिता
    । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ॥ ॥ या देवी सर्वभूतेषु तुष्टिरूपेण संस्थिता । नमस्तस्यै नमस्तस्यै
    नमस्तस्यै नमो नमः ॥ ॥ या देवी सर्वभूतेषु मातृरूपेण संस्थिता । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः
    ॥ ॥ या देवी सर्वभूतेषु भ्रान्तिरूपेण संस्थिता । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ॥ ॥ इन्द्रियाणामधिष्ठात्री
    भूतानां चाखिलेषु या । भूतेषु सततं तस्यै व्याप्त्यै देव्यै नमो नमः ॥ ॥ चितिरूपेण या कृत्स्नमेतद् व्याप्य
    स्थिता जगत् । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ॥
