id: nikhileshvaranandakavacam
category: kavacha
name:
  english: nikhileshvaranandakavacam
  devanagari: निखिलेश्वरानन्दकवचम्
content:
  english: om shirah siddheshvarah patu lalatam ca paratparah | netre nikhileshvaranandah nasika narakantakah
    || 1|| karnau kalatmakah patu mukham mantreshvarastatha | kantham rakshatu vagishah bhujau ca bhuvaneshvarah
    || 2|| skandhau kameshvarah patu hridayam brahmavarcasah | nabhim narayano rakshet urum urjasvalo'pi
    vai || 3|| januni saccidanandah patu padau shivatmakah | guhyam layatmakah payat cittam cintapaharakah
    || 4|| madaneshah manah patu prishtham purnapradayakah | purvam rakshatu tantreshah yantreshah varunim
    tatha || 5|| uttaram shridharah rakshet dakshinam dakshineshvarah | patalam patu sarvajnah urdhvam
    me pranasamjnakah || 6|| kavacenavrito yastu yatra kutrapi gacchati | tatra sarvatra labhah syat kincidatra
    na samshayah || 7|| phalashrutih | yam yam cintayate kamam tam tam prapnoti nishcitam | dhanavan balavan
    loke jayate samupasakah || 8|| grahabhutapishacashca yakshagandharvarakshasah | nashyanti sarvavighnani
    darshanat kavacenavritam || 9|| ya idam kavacam punyam pratah pathati nityashah | siddhashramah padarudhah
    brahmabhavena bhuyate || 10|| || harih om tatsat shrinikhilabrahmarpanamastu || iti shrinikhileshvaranandakavacam
    sampurnam |
  devanagari: ॐ शिरः सिद्धेश्वरः पातु ललाटं च परात्परः । नेत्रे निखिलेश्वरानन्दः नासिका नरकान्तकः ॥ १॥
    कर्णौ कालात्मकः पातु मुखं मन्त्रेश्वरस्तथा । कण्ठं रक्षतु वागीशः भुजौ च भुवनेश्वरः ॥ २॥ स्कन्धौ कामेश्वरः
    पातु हृदयं ब्रह्मवर्चसः । नाभिं नारायणो रक्षेत् ऊरुं ऊर्जस्वलोऽपि वै ॥ ३॥ जानुनि सच्चिदानन्दः पातु
    पादौ शिवात्मकः । गुह्यं लयात्मकः पायात् चित्तं चिन्तापहारकः ॥ ४॥ मदनेशः मनः पातु पृष्ठं पूर्णप्रदायकः
    । पूर्वं रक्षतु तन्त्रेशः यन्त्रेशः वारुणीं तथा ॥ ५॥ उत्तरं श्रीधरः रक्षेत् दक्षिणं दक्षिणेश्वरः ।
    पातालं पातु सर्वज्ञः ऊर्ध्वं मे प्राणसंज्ञकः ॥ ६॥ कवचेनावृतो यस्तु यत्र कुत्रापि गच्छति । तत्र सर्वत्र
    लाभः स्यात् किञ्चिदत्र न संशयः ॥ ७॥ फलश्रुतिः । यं यं चिन्तयते कामं तं तं प्राप्नोति निश्चितम् । धनवान्
    बलवान् लोके जायते समुपासकः ॥ ८॥ ग्रहभूतपिशाचाश्च यक्षगन्धर्वराक्षसाः । नश्यन्ति सर्वविघ्नानि दर्शनात्
    कवचेनावृतम् ॥ ९॥ य इदं कवचं पुण्यं प्रातः पठति नित्यशः । सिद्धाश्रमः पदारूढः ब्रह्मभावेन भूयते ॥ १०॥
    ॥ हरिः ॐ तत्सत् श्रीनिखिलब्रह्मार्पणमस्तु ॥ इति श्रीनिखिलेश्वरानन्दकवचं सम्पूर्णम् ।
