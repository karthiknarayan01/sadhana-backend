id: shaktistotrammadakritam
category: stotram
name:
  english: shaktistotrammadakritam
  devanagari: शक्तिस्तोत्रम्मदकृतां
content:
  english: madakritam shaktistotram || shriganeshaya namah || mada uvaca | namami tvam mahamaye sarvashaktisamanvitam
    | tvadadharamidam sarvam shaktiyuktam pravartate || 20|| anadimaprameyam tvam na jananti maharshayah
    | vedantavedyarupam vai namami parameshvarim || 21|| nanabhedakarim devim nanabhedavivarjitam | bhedabhedamayim
    tva'ham namami sakaleshvarim || 22|| parvatim dakshaputrim ca himacalasutam tatha | samudratanayam
    lakshmim savitrim tvam namamyaham || 23|| tvam svaham tvam svadham caiva vashatkaratmikam shivam |
    buddhirupam devamayim jnanarupam namamyaham || 24|| siddhidam sarvakaryeshu siddhirupam tapasvinim
    | yoginim yogadatrim vai yogeshim tvam namamyaham || 25|| tvam stotum na samartha ye munayo vedavadinah
    | devah skandashca sheshashca tatra'ham staumi kim param || 26|| dhanyau me pitarau jnanam tapo vidyadikam
    ca yat | yattavanghriyugam drishtam sarvaduhkhavimocanam || 27|| ityuktva samsthitastushnim bhavena
    sa madasurah | tamuvaca mahashaktirbhaktibhavena yantrita || 28||
  devanagari: मदकृतां शक्तिस्तोत्रम् ॥ श्रीगणेशाय नमः ॥ मद उवाच । नमामि त्वां महामाये सर्वशक्तिसमन्विताम्
    । त्वदाधारमिदं सर्वं शक्तियुक्तं प्रवर्तते ॥ २०॥ अनादिमप्रमेयां त्वां न जानन्ति महर्षयः । वेदान्तवेद्यरूपां
    वै नमामि परमेश्वरीम् ॥ २१॥ नानाभेदकरीं देवीं नानाभेदविवर्जिताम् । भेदाभेदमयीं त्वाऽहं नमामि सकलेश्वरीम्
    ॥ २२॥ पार्वतीं दक्षपुत्रीं च हिमाचलसुतां तथा । समुद्रतनयां लक्ष्मीं सावित्रीं त्वां नमाम्यहम् ॥ २३॥
    त्वां स्वाहां त्वां स्वधां चैव वषट्कारात्मिकां शिवाम् । बुद्धिरूपां देवमयीं ज्ञानरूपां नमाम्यहम् ॥
    २४॥ सिद्धिदां सर्वकार्येषु सिद्धिरूपां तपस्विनीम् । योगिनीं योगदात्रीं वै योगेशीं त्वां नमाम्यहम्
    ॥ २५॥ त्वां स्तोतुं न समर्था ये मुनयो वेदवादिनः । देवाः स्कन्दश्च शेषश्च तत्राऽहं स्तौमि किं पराम्
    ॥ २६॥ धन्यौ मे पितरौ ज्ञानं तपो विद्यादिकं च यत् । यत्तवाङ्घ्रियुगं दृष्टं सर्वदुःखविमोचनम् ॥ २७॥
    इत्युक्त्वा संस्थितस्तूष्णीं भावेन स मदासुरः । तमुवाच महाशक्तिर्भक्तिभावेन यन्त्रिता ॥ २८॥
