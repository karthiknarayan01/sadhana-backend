id: ekadantaganeshastotra
category: stotram
name:
  english: ekadantaganeshastotra
  devanagari: एकदन्तगणेशस्तोत्र
content:
  english: sattadharamekadantam ganeshamekam trayabodhitaram | sevanta apustamajam trisamsthastamekadantam
    sharanam vrajamah || 8|| tatastvaya prerita eva nadastenedamevam racitam jagadvai | anandarupam samabhavasamstham
    tamekadantam sharanam vrajamah || 9|| tadeva vishvam kripaya tavaiva sambhutamadyam tamasa vibhatam
    | anekarupam hyajamekabhutam tamekadantam sharanam vrajamah || 10|| tatastvaya preritameva tena srishtam
    susukshmam jagadekasamstham | sattvatmakam shvetamanantamadyam tamekadantam sharanam vrajamah || 11||
    tadeva svapnam tapasa ganesham samsiddhirupam vividham vabhuva | sadekarupam kripaya tava'pi tamekadantam
    sharanam vrajamah || 12|| sampreritam tacca tvaya hridistham tatha susrishtam jagadamsharupam | tenaiva
    jagranmayamaprameyam tamekadantam sharanam vrajamah || 13|| jagratsvarupam rajasa vibhatam vilokitam
    tatkripaya yadaiva | tada vibhinnam bhavadekarupam tamekadantam sharanam vrajamah || 14|| evam ca
    srishtva prakritisvabhavattadantare tvam ca vibhasi nityam | buddhipradata gananatha ekastamekadantam
    sharanam vrajamah || 15|| tvadajnaya bhanti grahashca sarve nakshatrarupani vibhanti khe vai | adharahinani
    tvaya dhritani tamekadantam sharanam vrajamah || 16|| tvadajnaya srishtikaro vidhata tvadajnaya palaka
    eva vishnuh | tvadajnaya samharako haro'pi tamekadantam sharanam vrajamah || 17|| yadajnaya bhurjalamadhyasamstha
    yadajnaya'pah pravahanti nadyah | simam sada rakshati vai samudrastamekadantam sharanam vrajamah ||
    18|| yadajnaya devagano divistho dadati vai karmaphalani nityam | yadajnaya shailagano'calo vai tamekadantam
    sharanam vrajamah || 19|| yadajnaya shesha iladharo vai yadajnaya mohapradashca kamah | yadajnaya
    kaladharo'ryama ca tamekadantam sharanam vrajamah || 20|| yadajnaya vati vibhati vayuryadajnaya'gnirjatharadisamsthah
    | yadajnaya vai sacara'caram ca tamekadantam sharanam vrajamah || 21|| sarvantare samsthitamekagudham
    yadajnaya sarvamidam vibhati | anantarupam hridi bodhakam vai tamekadantam sharanam vrajamah || 22||
    yam yogino yogabalena sadhyam kurvanti tam kah stavanena stauti | atah pranamena susiddhido'stu tamekadantam
    sharanam vrajamah || 23|| gritsamada uvaca evam stutva ca prahlada devah samunayashca vai | tushnim
    bhavam prapadyaiva nanriturharshasamyutah || 24|| sa tanuvaca pritatma hyekadantah stavena vai | jagada
    tan mahabhagan devarshin bhaktavatsalah || 25|| ekadanta uvaca prasanno'smi ca stotrena surah sarshiganah
    kila | vrinudhvam varado'ham vo dasyami manasipsitam || 26|| bhavatkritam madiyam vai stotram pritipradam
    mama | bhavishyati na sandehah sarvasiddhipradayakam || 27|| yam yamicchati tam tam vai dasyami stotrapathatah
    | putra
  devanagari: सत्ताधरमेकदन्तं गणेशमेकं त्रयबोधितारम् । सेवन्त आपुस्तमजं त्रिसंस्थास्तमेकदन्तं शरणं व्रजामः
    ॥ ८॥ ततस्त्वया प्रेरित एव नादस्तेनेदमेवं रचितं जगद्वै । आनन्दरूपं समभावसंस्थं तमेकदन्तं शरणं व्रजामः
    ॥ ९॥ तदेव विश्वं कृपया तवैव सम्भूतमाद्यं तमसा विभातम् । अनेकरूपं ह्यजमेकभूतं तमेकदन्तं शरणं व्रजामः
    ॥ १०॥ ततस्त्वया प्रेरितमेव तेन सृष्टं सुसूक्ष्मं जगदेकसंस्थम् । सत्त्वात्मकं श्वेतमनन्तमाद्यं तमेकदन्तं
    शरणं व्रजामः ॥ ११॥ तदेव स्वप्नं तपसा गणेशं संसिद्धिरूपं विविधं वभूव । सदेकरूपं कृपया तवाऽपि तमेकदन्तं
    शरणं व्रजामः ॥ १२॥ सम्प्रेरितं तच्च त्वया हृदिस्थं तथा सुसृष्टं जगदंशरूपम् । तेनैव जाग्रन्मयमप्रमेयं
    तमेकदन्तं शरणं व्रजामः ॥ १३॥ जाग्रत्स्वरूपं रजसा विभातं विलोकितं तत्कृपया यदैव । तदा विभिन्नं भवदेकरूपं
    तमेकदन्तं शरणं व्रजामः ॥ १४॥ एवं च सृष्ट्वा प्रकृतिस्वभावात्तदन्तरे त्वं च विभासि नित्यम् । बुद्धिप्रदाता
    गणनाथ एकस्तमेकदन्तं शरणं व्रजामः ॥ १५॥ त्वदाज्ञया भान्ति ग्रहाश्च सर्वे नक्षत्ररूपाणि विभान्ति खे
    वै । आधारहीनानि त्वया धृतानि तमेकदन्तं शरणं व्रजामः ॥ १६॥ त्वदाज्ञया सृष्टिकरो विधाता त्वदाज्ञया पालक
    एव विष्णुः । त्वदाज्ञया संहरको हरोऽपि तमेकदन्तं शरणं व्रजामः ॥ १७॥ यदाज्ञया भूर्जलमध्यसंस्था यदाज्ञयाऽपः
    प्रवहन्ति नद्यः । सीमां सदा रक्षति वै समुद्रस्तमेकदन्तं शरणं व्रजामः ॥ १८॥ यदाज्ञया देवगणो दिविस्थो
    ददाति वै कर्मफलानि नित्यम् । यदाज्ञया शैलगणोऽचलो वै तमेकदन्तं शरणं व्रजामः ॥ १९॥ यदाज्ञया शेष इलाधरो
    वै यदाज्ञया मोहप्रदश्च कामः । यदाज्ञया कालधरोऽर्यमा च तमेकदन्तं शरणं व्रजामः ॥ २०॥ यदाज्ञया वाति विभाति
    वायुर्यदाज्ञयाऽग्निर्जठरादिसंस्थः । यदाज्ञया वै सचराऽचरं च तमेकदन्तं शरणं व्रजामः ॥ २१॥ सर्वान्तरे
    संस्थितमेकगूढं यदाज्ञया सर्वमिदं विभाति । अनन्तरूपं हृदि बोधकं वै तमेकदन्तं शरणं व्रजामः ॥ २२॥ यं
    योगिनो योगबलेन साध्यं कुर्वन्ति तं कः स्तवनेन स्तौति । अतः प्रणामेन सुसिद्धिदोऽस्तु तमेकदन्तं शरणं
    व्रजामः ॥ २३॥ गृत्समद उवाच एवं स्तुत्वा च प्रह्लाद देवाः समुनयश्च वै । तूष्णीं भावं प्रपद्यैव ननृतुर्हर्षसंयुताः
    ॥ २४॥ स तानुवाच प्रीतात्मा ह्येकदन्तः स्तवेन वै । जगाद तान् महाभागान् देवर्षीन् भक्तवत्सलः ॥ २५॥ एकदन्त
    उवाच प्रसन्नोऽस्मि च स्तोत्रेण सुराः सर्षिगणाः किल । वृणुध्वं वरदोऽहं वो दास्यामि मनसीप्सितम् ॥ २६॥
    भवत्कृतं मदीयं वै स्तोत्रं प्रीतिप्रदं मम । भविष्यति न सन्देहः सर्वसिद्धिप्रदायकम् ॥ २७॥ यं यमिच्छति
    तं तं वै दास्यामि स्तोत्रपाठतः । पुत्र
