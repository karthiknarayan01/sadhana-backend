id: bahuroopa-ganapathi-dwatrimshat-ganapati-dhyanam
category: stotram
name:
  english: Bahuroopa Ganapathi (Dwatrimshat Ganapati) Dhyanam
content:
  english: shri bala ganapatih karastha kadalicutapanasekshukamodakam | balasuryanibham vande devam balaganadhipam
    || shri taruna ganapatih pashankushapupakapitthajambu svadantashalikshumapi svahastaih | dhatte sada
    yastarunarunabhah payat sa yushmamstaruno ganeshah || shri bhakta ganapatih narikelamrakadaligudapayasadharinam
    | sharaccandrabhavapusham bhaje bhaktaganadhipam || shri vira ganapatih vetalashaktisharakarmukacakrakhadga
    khatvangamudgaragadankushanagapashan | shulam ca kuntaparashum dhvajamudvahantam viram ganeshamarunam
    satatam smarami || shri shakti ganapatih alingya devim haritangayashtim parasparashlishtakatipradesham
    | sandhyarunam pashasrini vahantam bhayapaham shaktiganeshamide || shri dvija ganapatih yam pustakaksha
    gunadandakamandalu shri vidyotamanakarabhushanaminduvarnam | stamberamananacatushtayashobhamanam tvam
    yah smaret dvijaganadhipate sa dhanyah || shri siddha ganapatih pakvacutaphalapushpamanjari rikshudandatilamodakaih
    saha | udvahan parashumastu te namah shrisamriddhiyuta hemapingala || shri ucchishta ganapatih nilabjadadimivinashaligunjakshasutrakam
    | dadhaducchishtanamayam ganeshah patu mecakah || shri vighna ganapatih shankhekshucapakusumeshukutharapasha
    cakrasvadantasrinimanjarikasharadyaih | panishritaih parisamihitabhushanashri vighneshvaro vijayate
    tapaniyagaurah || shri kshipra ganapatih dantakalpalatapasharatnakumbhankushojjvalam | bandhukakamaniyabham
    dhyayet kshipraganadhipam || shri heramba ganapatih abhayavaradahastah pashadantakshamala sriniparashu
    dadhano mudgaram modakam ca | phalamadhigatasimhah pancamatangavaktro ganapatiratigaurah patu herambanama
    || shri lakshmi ganapatih bibhranah shukabijapurakamilanmanikyakumbhakushan pasham kalpalatam ca khadgavilasajjyotih
    sudhanirjharah | shyamenattasaroruhena sahitam devidvayam cantike gaurango varadanahastasahito lakshmiganesho'vatat
    || shri maha ganapatih hastindrananaminducudamarunacchayam trinetram rasa dashlishtam priyaya sapadmakaraya
    svankasthaya santatam | bijapuragadekshukarmukalasaccakrabjapashotpala vrihyagrasvavishanaratnakalashan
    hastairvahantam bhaje || shri vijaya ganapatih pashankushasvadantamraphalavanakhuvahanah | vighnam
    nihantu nah sarvam raktavarno vinayakah || shri nritta ganapatih pashankushapupakutharadanta cancatkarakluptavarangulikam
    | pitaprabham kalpataroradhastham bhajami nrittopapadam ganesham || shri urdhva ganapatih kalharashalikamalekshukacapabana
    dantaprarohakagadi kanakojjvalangah | alinganodyatakaro haritangayashtya devya karotu shubhamurdhvaganadhipo
    me || shri ekakshara ganapatih rakto raktangaragankushakusumayutastundilashcandramaulih netrairyuktastribhirvamanakaracarano
    bijapuram dadhanah | hastagraklupta pashankusharadavarado nagavaktro'hibhusho devah padmasanastho
    bhavatu sukhakaro bhutaye vighnarajah || shri vara ganapatih sindurabhamibhananam trinayanam haste
    ca pashankushau bibhranam madhumatkapalamanisham sadhvindumaulim bhaje | pushtyashlishtatanum dhvajagrakaraya
    padmollasaddhastaya tadyonyahita panimattavasumatpatrollasatpushkaram || shri tryakshara ganapatih
    gajendravadanam sakshaccalatkarnasucamaram hemavarnam caturbahum pashankushadharam varam | svadantam
    dakshine haste savye tvamrapalam tatha pushkarairmodakam caiva dharayantamanusmaret || shri kshipraprasada
    ganapatih dhritapashankushakalpalata svaradashca bijapurayutah shashishakalakalitamaulistrilocano'runashca
    gajavadanah | bhasurabhushanadipto brihadudarah padmavishtarollasitah vighnapayodharapavanah karadhritakamalah
    sadastu me bhutyai || shri haridra ganapatih haridrabham caturbahum karindravadanam prabhum | pashankushadharam
    devam modakam dantameva ca | bhaktabhayapradataram vande vighnavinashanam || shri ekadanta ganapatih
    lambodaram shyamatanum ganesham kutharamakshasrajamurdhvagatram | saladdukam dantamadhah karabhyam
    vametarabhyam ca dadhanamide || shri srishti ganapatih pashankushasvadantamraphalavanakhuvahanah |
    vighnam nihantu nah shonah srishtidaksho vinayakah || shri uddanda ganapatih kalharambujabijapurakagadadantekshucapam
    sumam bibhrano manikumbhashalikalashau pasham srinim cabjakam | gaurangya ruciraravindakaraya devya
    samalingatah shonangah shubhamatanotu bhajatamuddandavighneshvarah || shri rinamocaka ganapatih pashankushau
    dantajambu dadhanah sphatikaprabhah | raktamshuko ganapatirmude syadrinamocakah || shri dhundhi ganapatih
    akshamalam kutharam ca ratnapatram svadantakam | dhatte karairvighnarajo dhundhinama mude'stu nah
    || shri dvimukha ganapatih svadantapashankusharatnapatram karairdadhano harinilagatrah | raktamshuko
    ratnakiritamali bhutyai sada me dvimukho ganeshah || shri trimukha ganapatih shrimattikshnashikhankushakshavaradan
    dakshe dadhanah karaih pasham camritapurnakumbhamabhayam vame dadhano muda | pithe svarnamayaravindavilasatsatkarnikabhasure
    svasinastrimukhah palasharuciro nagananah patu nah || shri simha ganapatih vinam kalpalatamarim ca
    varadam dakshe vidatte karai rvame tamarasam ca ratnakalasham sanmanjarim cabhayam | shundadandalasanmrigendravadanah
    shankhendugaurah shubho divyadratnanibhamshuko ganapatih payadapayat sa nah || shri yoga ganapatih
    yogarudho yogapattabhiramo balarkabhashcendranilamshukadhyah | pashekshvakshan yogadandam dadhano
    payannityam yogavighneshvaro nah || shri durga ganapatih taptakancanasankashashcashtahasto mahattanuh
    diptankusham sharam caksham dantu dakshe vahan karaih | vame pasham karmukam ca latam jambu dadhatkaraih
    raktamshukah sada bhuyaddurgaganapatirmude || shri sankashtahara ganapatih balarkarunakantirvame balam
    vahannanke lasadindivarahastam gaurangim ratnashobhadhyam | dakshe'nkushavaradanam vame pasham ca
    payasam patram nilamshukalasamanah pithe padmarune tishthan || || sankataharanah payat sankatapugadgajanano
    nityam | shri vallabha ganapati bijapura gadekshukarmukabhujacakrabja pashotpala vrihyagrasvavishana
    ratnakalasha prodyatkarambhoruhah | dhyeyo vallabhaya ca padmakarayashlishto jvaladbhushaya vishvotpattivinashasamsthitikaro
    vighno vishishtarthadah || shri siddhidevi pitavarnam dvinetram tamekavaktrambujadvayam navaratnakiritam
    ca pitambarasudharinim | vamahaste mahapadmam dakshe lambakaranvitam jajicampakamalam ca tribhangim
    lalitangikam || ganeshadakshine bhage guruh siddhim tu bhavayet || shri buddhidevi dvihastam ca dvinetram
    tamekavaktram tribhangikam muktamanikiritam ca dakshe haste mahotpalam | vame pralambahastam ca divyambarasudharinim
    shyamavarnanibham bhasvatsarvabharanabhushitam || parijatotpalamalyam ganesho vamaparshvake dhyatva
    buddhim surupam samarcayeddeshikottamah ||
  devanagari: श्री बाल गणपतिः करस्थ कदलीचूतपनसेक्षुकमोदकम् । बालसूर्यनिभं वन्दे देवं बालगणाधिपम् ॥ श्री
    तरुण गणपतिः पाशाङ्कुशापूपकपित्थजम्बू स्वदन्तशालीक्षुमपि स्वहस्तैः । धत्ते सदा यस्तरुणारुणाभः पायात्
    स युष्मांस्तरुणो गणेशः ॥ श्री भक्त गणपतिः नारिकेलाम्रकदलीगुडपायसधारिणम् । शरच्चन्द्राभवपुषं भजे भक्तगणाधिपम्
    ॥ श्री वीर गणपतिः वेतालशक्तिशरकार्मुकचक्रखड्ग खट्वाङ्गमुद्गरगदाङ्कुशनागपाशान् । शूलं च कुन्तपरशुं
    ध्वजमुद्वहन्तं वीरं गणेशमरुणं सततं स्मरामि ॥ श्री शक्ति गणपतिः आलिङ्ग्य देवीं हरिताङ्गयष्टिं परस्पराश्लिष्टकटिप्रदेशम्
    । सन्ध्यारुणं पाशसृणी वहन्तं भयापहं शक्तिगणेशमीडे ॥ श्री द्विज गणपतिः यं पुस्तकाक्ष गुणदण्डकमण्डलु
    श्री विद्योतमानकरभूषणमिन्दुवर्णम् । स्तम्बेरमाननचतुष्टयशोभमानं त्वां यः स्मरेत् द्विजगणाधिपते स धन्यः
    ॥ श्री सिद्ध गणपतिः पक्वचूतफलपुष्पमञ्जरी रिक्षुदण्डतिलमोदकैः सह । उद्वहन् परशुमस्तु ते नमः श्रीसमृद्धियुत
    हेमपिङ्गल ॥ श्री उच्छिष्ट गणपतिः नीलाब्जदाडिमीवीणाशालीगुञ्जाक्षसूत्रकम् । दधदुच्छिष्टनामायं गणेशः
    पातु मेचकः ॥ श्री विघ्न गणपतिः शङ्खेक्षुचापकुसुमेषुकुठारपाश चक्रस्वदन्तसृणिमञ्जरिकाशराद्यैः । पाणिश्रितैः
    परिसमीहितभूषणश्री विघ्नेश्वरो विजयते तपनीयगौरः ॥ श्री क्षिप्र गणपतिः दन्तकल्पलतापाशरत्नकुम्भाङ्कुशोज्ज्वलम्
    । बन्धूककमनीयाभं ध्यायेत् क्षिप्रगणाधिपम् ॥ श्री हेरम्ब गणपतिः अभयवरदहस्तः पाशदन्ताक्षमाला सृणिपरशु
    दधानो मुद्गरं मोदकं च । फलमधिगतसिंहः पञ्चमातङ्गवक्त्रो गणपतिरतिगौरः पातु हेरम्बनामा ॥ श्री लक्ष्मी
    गणपतिः बिभ्राणः शुकबीजपूरकमिलन्माणिक्यकुम्भाकुशान् पाशं कल्पलतां च खड्गविलसज्ज्योतिः सुधानिर्झरः ।
    श्यामेनात्तसरोरुहेण सहितं देवीद्वयं चान्तिके गौराङ्गो वरदानहस्तसहितो लक्ष्मीगणेशोऽवतात् ॥ श्री महा
    गणपतिः हस्तीन्द्राननमिन्दुचूडमरुणच्छायं त्रिनेत्रं रसा दाश्लिष्टं प्रियया सपद्मकरया स्वाङ्कस्थया सन्ततम्
    । बीजापूरगदेक्षुकार्मुकलसच्चक्राब्जपाशोत्पल व्रीह्यग्रस्वविषाणरत्नकलशान् हस्तैर्वहन्तं भजे ॥ श्री
    विजय गणपतिः पाशाङ्कुशस्वदन्ताम्रफलवानाखुवाहनः । विघ्नं निहन्तु नः सर्वं रक्तवर्णो विनायकः ॥ श्री नृत्त
    गणपतिः पाशाङ्कुशापूपकुठारदन्त चञ्चत्कराक्लुप्तवराङ्गुलीकम् । पीतप्रभं कल्पतरोरधस्थं भजामि नृत्तोपपदं
    गणेशम् ॥ श्री ऊर्ध्व गणपतिः कल्हारशालिकमलेक्षुकचापबाण दन्तप्ररोहकगदी कनकोज्ज्वलाङ्गः । आलिङ्गनोद्यतकरो
    हरिताङ्गयष्ट्या देव्या करोतु शुभमूर्ध्वगणाधिपो मे ॥ श्री एकाक्षर गणपतिः रक्तो रक्ताङ्गरागाङ्कुशकुसुमयुतस्तुन्दिलश्चन्द्रमौलिः
    नेत्रैर्युक्तस्त्रिभिर्वामनकरचरणो बीजपूरं दधानः । हस्ताग्राक्लुप्त पाशाङ्कुशरदवरदो नागवक्त्रोऽहिभूषो
    देवः पद्मासनस्थो भवतु सुखकरो भूतये विघ्नराजः ॥ श्री वर गणपतिः सिन्दूराभमिभाननं त्रिनयनं हस्ते च पाशाङ्कुशौ
    बिभ्राणं मधुमत्कपालमनिशं साध्विन्दुमौलिं भजे । पुष्ट्याश्लिष्टतनुं ध्वजाग्रकरया पद्मोल्लसद्धस्तया
    तद्योन्याहित पाणिमात्तवसुमत्पात्रोल्लसत्पुष्करम् ॥ श्री त्र्यक्षर गणपतिः गजेन्द्रवदनं साक्षाच्चलत्कर्णसुचामरं
    हेमवर्णं चतुर्बाहुं पाशाङ्कुशधरं वरम् । स्वदन्तं दक्षिणे हस्ते सव्ये त्वाम्रपलं तथा पुष्करैर्मोदकं
    चैव धारयन्तमनुस्मरेत् ॥ श्री क्षिप्रप्रसाद गणपतिः धृतपाशाङ्कुशकल्पलता स्वरदश्च बीजपूरयुतः शशिशकलकलितमौलिस्त्रिलोचनोऽरुणश्च
    गजवदनः । भासुरभूषणदीप्तो बृहदुदरः पद्मविष्टरोल्लसितः विघ्नपयोधरपवनः करधृतकमलः सदास्तु मे भूत्यै ॥
    श्री हरिद्रा गणपतिः हरिद्राभं चतुर्बाहुं करीन्द्रवदनं प्रभुम् । पाशाङ्कुशधरं देवं मोदकं दन्तमेव च
    । भक्ताभयप्रदातारं वन्दे विघ्नविनाशनम् ॥ श्री एकदन्त गणपतिः लम्बोदरं श्यामतनुं गणेशं कुठारमक्षस्रजमूर्ध्वगात्रम्
    । सलड्डुकं दन्तमधः कराभ्यां वामेतराभ्यां च दधानमीडे ॥ श्री सृष्टि गणपतिः पाशाङ्कुशस्वदन्ताम्रफलवानाखुवाहनः
    । विघ्नं निहन्तु नः शोणः सृष्टिदक्षो विनायकः ॥ श्री उद्दण्ड गणपतिः कल्हाराम्बुजबीजपूरकगदादन्तेक्षुचापं
    सुमं बिभ्राणो मणिकुम्भशालिकलशौ पाशं सृणिं चाब्जकम् । गौराङ्ग्या रुचिरारविन्दकरया देव्या समालिङ्गतः
    शोणाङ्गः शुभमातनोतु भजतामुद्दण्डविघ्नेश्वरः ॥ श्री ऋणमोचक गणपतिः पाशाङ्कुशौ दन्तजम्बु दधानः स्फाटिकप्रभः
    । रक्तांशुको गणपतिर्मुदे स्यादृणमोचकः ॥ श्री ढुण्ढि गणपतिः अक्षमालां कुठारं च रत्नपात्रं स्वदन्तकम्
    । धत्ते करैर्विघ्नराजो ढुण्ढिनामा मुदेऽस्तु नः ॥ श्री द्विमुख गणपतिः स्वदन्तपाशाङ्कुशरत्नपात्रं करैर्दधानो
    हरिनीलगात्रः । रक्तांशुको रत्नकिरीटमाली भूत्यै सदा मे द्विमुखो गणेशः ॥ श्री त्रिमुख गणपतिः श्रीमत्तीक्ष्णशिखाङ्कुशाक्षवरदान्
    दक्षे दधानः करैः पाशं चामृतपूर्णकुम्भमभयं वामे दधानो मुदा । पीठे स्वर्णमयारविन्दविलसत्सत्कर्णिकाभासुरे
    स्वासीनस्त्रिमुखः पलाशरुचिरो नागाननः पातु नः ॥ श्री सिंह गणपतिः वीणां कल्पलतामरिं च वरदं दक्षे विदत्ते
    करै र्वामे तामरसं च रत्नकलशं सन्मञ्जरीं चाभयम् । शुण्डादण्डलसन्मृगेन्द्रवदनः शङ्खेन्दुगौरः शुभो दीव्यद्रत्ननिभांशुको
    गणपतिः पायादपायत् स नः ॥ श्री योग गणपतिः योगारूढो योगपट्टाभिरामो बालार्काभश्चेन्द्रनीलांशुकाढ्यः ।
    पाशेक्ष्वक्षान् योगदण्डं दधानो पायान्नित्यं योगविघ्नेश्वरो नः ॥ श्री दुर्गा गणपतिः तप्तकाञ्चनसङ्काशश्चाष्टहस्तो
    महत्तनुः दीप्ताङ्कुशं शरं चाक्षं दन्तु दक्षे वहन् करैः । वामे पाशं कार्मुकं च लतां जम्बु दधत्करैः
    रक्तांशुकः सदा भूयाद्दुर्गागणपतिर्मुदे ॥ श्री सङ्कष्टहर गणपतिः बालार्कारुणकान्तिर्वामे बालां वहन्नङ्के
    लसदिन्दीवरहस्तां गौराङ्गीं रत्नशोभाढ्याम् । दक्षेऽङ्कुशवरदानं वामे पाशं च पायसं पात्रं नीलांशुकलसमानः
    पीठे पद्मारुणे तिष्ठन् ॥ ॥ सङ्कटहरणः पायात् सङ्कटपूगाद्गजाननो नित्यम् । श्री वल्लभ गणपति बीजापूर गदेक्षुकार्मुकभुजाचक्राब्ज
    पाशोत्पल व्रीह्यग्रस्वविषाण रत्नकलश प्रोद्यत्कराम्भोरुहः । ध्येयो वल्लभया च पद्मकरयाश्लिष्टो ज्वलद्भूषया
    विश्वोत्पत्तिविनाशसंस्थितिकरो विघ्नो विशिष्टार्थदः ॥ श्री सिद्धिदेवी पीतवर्णां द्विनेत्रां तामेकवक्त्राम्बुजद्वयां
    नवरत्नकिरीटां च पीताम्बरसुधारिणीम् । वामहस्ते महापद्मं दक्षे लम्बकरान्वितां जाजीचम्पकमालां च त्रिभङ्गीं
    ललिताङ्गिकाम् ॥ गणेशदक्षिणे भागे गुरुः सिद्धिं तु भावयेत् ॥ श्री बुद्धिदेवी द्विहस्तां च द्विनेत्रां
    तामेकवक्त्रां त्रिभङ्गिकां मुक्तामणिकिरीटां च दक्षे हस्ते महोत्पलम् । वामे प्रलम्बहस्तां च दिव्याम्बरसुधारिणीं
    श्यामवर्णनिभां भास्वत्सर्वाभरणभूषिताम् ॥ पारिजातोत्पलामाल्यां गणेशो वामपार्श्वके ध्यात्वा बुद्धिं
    सुरूपां समर्चयेद्देशिकोत्तमः ॥
