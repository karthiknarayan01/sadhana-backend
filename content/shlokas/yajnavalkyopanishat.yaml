id: yajnavalkyopanishat
category: upanishad
name:
  english: yajnavalkyopanishat
  devanagari: याज्ञवल्क्योपनिषत्
content:
  english: kulalashalagnihotrashalanadipulinagirikuharakotarakandaranirjharasthandileshvaniketanivasyaprayatnah
    shubhashubhakarmanirmulanaparah samnyasena dehatyagam karoti sa paramahamso nameti || 8 || ashambaro
    na namaskaro na daraputrabhilashi lakshyalakshyanirvartakah parivrat parameshvaro bhavati | atraite
    shloka bhavanti || 9 || yo bhavetpurvasamnyasi tulyo vai dharmato yadi | tasmai pranamah kartavyo
    netaraya kadacana || 10 || pramadino bahishcittah pishunah kalahotsukah | samnyasino'pi drishyante
    devasamdushitashayah || 11 || namadibhyah pare bhumni svarajye cetsthito'dvathe | pranametkam tadatmajno
    na karyam karmana tada || 12 || ishvaro jivakalaya pravishto bhagavaniti | pranameddandavadbhumavashvacandalagokharam
    || 13 || mamsapancalikayastu yantraloke'ngapanjare | snayvasthigranthishalinyah striyah kimiva shobhanam
    || 14 || tvanmamsaraktabashpambu prithakkritva vilocane | samalokaya ramyam cetkim mudha parimuhyasi
    || 15 || merushringatatollasi gangajalasyopama | drishta yasminmune muktaharasyollasashalita || 16
    || shmananeshu diganteshu sa eva lalanastanah | shvabhirasvadyate kale laghupinda ivandhasah || 17
    || keshakajjaladharinyo duhsparsha locanapriyah | dushkritagnishikha naryo dahanti trinavannaram ||
    18 || jvalana atidure'pi sarasa api nirasah | striyo hi narakagninamindhanam caru darunam || 19 ||
    kamanamna kiratena vikirna mugdhacetasah | naryo naravihanganamangabandhanavagurah || 20 || janmapalvalamatsyanam
    cittakardamacarinam | pumsam durvasanarajjurnaribadishapindika || 21 || sarvesham dosharatnanam susamudgikayanaya
    | duhkhashrinkhalaya nityamalamastu mama striya || 22 || yasya stri tasya bhogeccha nistrikasya kva
    bhogabhuh | striyam tyaktva jagattyaktam jagattyaktva sukhi bhavet || 23 || alabhyamanastanayah pitarau
    kleshayecciram | labdho hi garbhapatena prasavena ca badhate || 24 || jatasya graharogadi kumarasya
    ca dhurtata | upanite'pyavidyatvamanudvahashca pandite || 25 || yunashca paradaradi daridryam ca kutumbinah
    | putraduhkhasya nastyanto dhani cenmriyate tada || 26 || na panipadacapalo na netracapalo yatih |
    na ca vakcapalashcaiva brahmabhuto jitendriyah || 27 || ripau baddhe svadehe ca samaikatmyam prapashyatah
    | vivekinah kutah kopah svadehavayaveshviva || 28 || apakarini kopashcetkope kopah katham na te |
    dharmarthakamamokshanam prasahya paripanthini || 29 || namo'stu mama kopaya svashrayajvaline bhrisham
    | kopasya mama vairagyadayine doshabodhine || 30 || yatra supta jana nityam prabuddhastatra samyami
    | prabuddha yatra te vidvansushuptim yati yogirat || 31 || cidihastiti cinmatramidam cinmayameva ca
    | cittvam cidahamete ca lokashciditi bhavaya || 32 || yatinam tadupadeyam parahamsyam param padam
    | natah parataram kincidvidyate munipungavah ityupanishat || 33 || om purnamadah purnamidam purnatpurnamudacyate
    | purnasya purnamadaya purnamevavashishyate || om shantih shantih shantih || || iti yajnavalkyopanishatsamapta
    || adhikadhyayanaya
  devanagari: कुलालशालाग्निहोत्रशालानदीपुलिनगिरिकुहरकोटरकन्दरनिर्झरस्थण्डिलेष्वनिकेतनिवास्यप्रयत्नः शुभाशुभकर्मनिर्मूलनपरः
    संन्यासेन देहत्यागं करोति स परमहंसो नामेति ॥ ८ ॥ आशाम्बरो न नमस्कारो न दारपुत्राभिलाषी लक्ष्यालक्ष्यनिर्वर्तकः
    परिव्राट् परमेश्वरो भवति । अत्रैते श्लोका भवन्ति ॥ ९ ॥ यो भवेत्पूर्वसंन्यासी तुल्यो वै धर्मतो यदि
    । तस्मै प्रणामः कर्तव्यो नेतराय कदाचन ॥ १० ॥ प्रमादिनो बहिश्चित्ताः पिशुनाः कलहोत्सुकाः । संन्यासिनोऽपि
    दृश्यन्ते देवसंदूषिताशयाः ॥ ११ ॥ नामादिभ्यः परे भूम्नि स्वाराज्ये चेत्स्थितोऽद्वथे । प्रणमेत्कं तदात्मज्ञो
    न कार्यं कर्मणा तदा ॥ १२ ॥ ईश्वरो जीवकलया प्रविष्टो भगवानिति । प्रणमेद्दण्डवद्भूमावाश्वचण्डालगोखरम्
    ॥ १३ ॥ मांसपाञ्चालिकायास्तु यन्त्रलोकेऽङ्गपञ्जरे । स्नाय्वस्थिग्रन्थिशालिन्यः स्त्रियः किमिव शोभनम्
    ॥ १४ ॥ त्वङ्मांसरक्तबाष्पाम्बु पृथक्कृत्वा विलोचने । समालोकय रम्यं चेत्किं मुधा परिमुह्यसि ॥ १५ ॥
    मेरुशृङ्गतटोल्लासि गङ्गाजलस्योपमा । दृष्टा यस्मिन्मुने मुक्ताहारस्योल्लसशालिता ॥ १६ ॥ श्मनानेषु दिगन्तेषु
    स एव ललनास्तनः । श्वभिरास्वाद्यते काले लघुपिण्ड इवान्धसः ॥ १७ ॥ केशकज्जलधारिण्यो दुःस्पर्शा लोचनप्रियाः
    । दुष्कृताग्निशिखा नार्यो दहन्ति तृणवन्नरम् ॥ १८ ॥ ज्वलना अतिदूरेऽपि सरसा अपि नीरसाः । स्त्रियो हि
    नरकाग्नीनामिन्धनं चारु दारुणम् ॥ १९ ॥ कामनाम्ना किरातेन विकीर्णा मुग्धचेतसः । नार्यो नरविहङ्गानामङ्गबन्धनवागुराः
    ॥ २० ॥ जन्मपल्वलमत्स्यानां चित्तकर्दमचारिणाम् । पुंसां दुर्वासनारज्जुर्नारीबडिशपिण्डिका ॥ २१ ॥ सर्वेषां
    दोषरत्नानां सुसमुद्गिकयानया । दुःखशृङ्खलया नित्यमलमस्तु मम स्त्रिया ॥ २२ ॥ यस्य स्त्री तस्य भोगेच्छा
    निस्त्रीकस्य क्व भोगभूः । स्त्रियं त्यक्त्वा जगत्त्यक्तं जगत्त्यक्त्वा सुखी भवेत् ॥ २३ ॥ अलभ्यमानस्तनयः
    पितरौ क्लेशयेच्चिरम् । लब्धो हि गर्भपातेन प्रसवेन च बाधते ॥ २४ ॥ जातस्य ग्रहरोगादि कुमारस्य च धूर्तता
    । उपनीतेऽप्यविद्यत्वमनुद्वाहश्च पण्डिते ॥ २५ ॥ यूनश्च परदारादि दारिद्र्यं च कुटुम्बिनः । पुत्रदुःखस्य
    नास्त्यन्तो धनी चेन्म्रियते तदा ॥ २६ ॥ न पाणिपादचपलो न नेत्रचपलो यतिः । न च वाक्चपलश्चैव ब्रह्मभूतो
    जितेन्द्रियः ॥ २७ ॥ रिपौ बद्धे स्वदेहे च समैकात्म्यं प्रपश्यतः । विवेकिनः कुतः कोपः स्वदेहावयवेष्विव
    ॥ २८ ॥ अपकारिणि कोपश्चेत्कोपे कोपः कथं न ते । धर्मार्थकाममोक्षाणां प्रसह्य परिपन्थिनि ॥ २९ ॥ नमोऽस्तु
    मम कोपाय स्वाश्रयज्वालिने भृशम् । कोपस्य मम वैराग्यदायिने दोषबोधिने ॥ ३० ॥ यत्र सुप्ता जना नित्यं
    प्रबुद्धस्तत्र संयमी । प्रबुद्धा यत्र ते विद्वान्सुषुप्तिं याति योगिराट् ॥ ३१ ॥ चिदिहास्तीति चिन्मात्रमिदं
    चिन्मयमेव च । चित्त्वं चिदहमेते च लोकाश्चिदिति भावय ॥ ३२ ॥ यतीनां तदुपादेयं पारहंस्यं परं पदम् । नातः
    परतरं किञ्चिद्विद्यते मुनिपुङ्गवः इत्युपनिषत् ॥ ३३ ॥ ॐ पूर्णमदः पूर्णमिदं पूर्णात्पूर्णमुदच्यते ।
    पूर्णस्य पूर्णमादाय पूर्णमेवावशिष्यते ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ ॥ इति याज्ञवल्क्योपनिषत्समाप्ता
    ॥ अधिकाध्ययनाय
