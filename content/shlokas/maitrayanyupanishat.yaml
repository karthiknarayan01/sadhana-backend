id: maitrayanyupanishat
category: upanishad
name:
  english: maitrayanyupanishat
  devanagari: मैत्रायण्युपनिषत्
content:
  english: upanishad maitrayanyupanishat || atha maitrayanyupanishat || samavediya samanya upanishat ||
    vairagyotthabhaktiyuktabrahmamatraprabodhatah | yatpadam munayo yanti tattraipadamaham mahah || om
    apyayantu mamangani vakpranashcakshuh shrotamatho balamindriyani ca | sarvani sarvam brahmopanishadam
    maham brahma nirakuryam ma ma brahma nirakarodanirakaranamastvanirakaranam mestu tadatmani nirate
    ya upanishatsu dharmaste mayi santu te mayi santu || om shantih shantih shantih || maitrayani kaushitaki
    brihajjabalatapani | kalagnirudramaitreyi subalakshuramantrika | om brihadratho ha vai nama raja rajye
    jyeshtham putram nidhapayitvedamashashvatam manyamanah shariram vairagyamupeto'ranyam nirjagama sa
    tatra paramam tapa asthayadityamikshamana urdhvabahustishthatyante sahasrasya munirantikamajagamagnirivadhumakastejasa
    nirdahannivatmavidbhagavanchakayanya uttishthottishtha varam vrinishveti rajanamabravitsa tasmai namaskrityovaca
    bhagavannahamatmavittvam tattvavicchrinumo vayam sa tvam no bruhityetadvritam purastadashakyam ma
    priccha prashnamaikshvakanyankamanvrinishveti shakayanyasya caranavabhimrishyamano rajemam gatham
    jagada || 1|| bhagavannasthicarmasnayumajjamamsashukrashonitashleshmashrudu shite vinmutravatapittakaphasanghate
    durgandhe nihsare'smincharire kim kamopabhogaih || 2|| kamakrodhalobhabhayavishadershyeshtaviyoganishtasamprayogakshu
    tpipasajaramrityurogashokadyairabhihate'smincharire kim kamopabhogaih || 3|| sarvam cedam kshayishnu
    pashyamo yatheme damshamashakadayastrinavannashyatayodbhutapradhvamsinah || 4|| atha kimetairva pare'nye
    mahadhanurdharashcakravartinah kecitsudyumnabhuridyumnendradyumnakuvalayashvayauvanashvavaddhiya shvashvapatih
    shashabindurharishcandro'mbarisho nanuktasvayatiryayatinaranyokshasenotthamaruttabharataprabhritayo
    rajano mishato bandhuvargasya mahatim shriyam tyaktvasmallokadamum lokam prayanti || 5|| atha kimetairva
    pare'nye gandharvasurayaksharakshasabhutaganapishacoragagrahadinam nirodhanam pashyamah || 6|| atha
    kimetairvanyanam shoshanam maharnavanam shikharinam prapatanam dhruvasya pracalanam sthanam va tarunam
    nimajjanam prithivyah sthanadapasaranam suranam so'hamityetadvidhe'sminsamsare kim kamopabhogairyairevashritasyasakridihavartanam
    drishyata ityuddhartumarhasityandhodapanastho bheka ivahamasminsamsare bhagavamstvam no gatistvam
    no gatih || 7|| iti prathamah prapathakah || atha bhagavanchakayanyah suprito'bravidrajanam maharaja
    brihadrathekshvakuvamshadhvajashirshatmajah kritakrityastvam marunnamno vishruto'sityayam va va khalvatma
    te katamo bhagavanvarnya iti tam hovaca iti || 1|| ya esho bahyavashtambhanenordhvamutkranto vyathamano'vyathamanastamah
    pranudatyesha atmetyaha bhagavanatha ya esha samprasado'smanchariratsamutthaya param jyotirupasampadya
    svena rupenabhinishpadyata esha atmeti hovacaitadamritamabhayametadbrahmeti || 2|| atha khalviyam
    brahmavidya sarvopanishadvidya va rajannasmakam bhagavata maitreyena vyakhyataham te kathayishyamityathapahatapapmanastigmatejasa
    urdhvaretaso valakhilya iti shruyante'thaite prajapatimabruvanbhagavanshakatamivacetanamidam shariram
    kasyaisha khalvidrisho mahimatindriyabhutasya yenaitadvidhamidam cetanavatpratishthapitam pracodayitasya
    ko bhagavannetadasmakam bruhiti tanhovaca || 3|| yo ha khalu vacoparisthah shruyate sa eva va esha
    shuddhah putah shunyah shanto prano'nishatma'nanto'kshayyah sthirah shashvato'jah svatantrah sve mahimni
    tishthatyanenedam shariram cetanavatpratishthapitam pracodayita caisho'syeti te hocurbhagavankathamanenedrishenanicchenaitadvidhamidam
    cetanavatpratishthapitam pracodayita caisho'syeti kathamiti tanhovaca || 4|| sa va esha sukshmo'grahyo'drishyah
    purushasanjnako buddhipurvamihaivavartatem'shena sushuptasyaiva buddhipurvam nibodhayatyatha yoha
    khalu vavaitasyamsho'yam yashcetanamatrah pratipurusham kshetrajnah sankalpadhyavasayabhimanalingah
    prajapatirvishvakshastena cetanenedam shariram cetanavatpratishthapitam pracodayita caisho'syeti te
    hocurbhagavannidrishasya kathamamshena vartanamiti tanhovaca || 5|| prajapatirva esho'gre'tishthatsa
    naramataikah sa atmanamabhidhyayadbavhih praja asrijatta asyaivatmaprabuddha aprana sthanuriva tishthamana
    apashyatsa naramata so'manyataitasam pratibodhanayabhyantaram pravishanityatha sa vayumivatmanam kritvabhyantaram
    pravishatsa eko navishatsa pancadhatmanam pravibhajyocyate yah prano'panah samana udano vyana iti
    || 6|| atha yo'yamurdhvamutkramatityesha vava sa prano'tha yoyamavancam sankramatvesha vava so'pano'tha
    yoyam sthavishthamannadhatumapane sthapayatyanishtham cange'nge samam nayatyesha vava sa samano'tha
    yo'yam pitashitamudgirati nigiratiti caisha vava sa udano'tha yenaitah shira anuvyapta esha vava sa
    vyanah || 7|| athopamshurantaryamyamibhavatyantaryamamupamshumetayorantarale caushnyam masavadaushnyam
    sa purusho'tha yah purushah so'gnirvaishvanaro'pyanyatrapyuktamayamagnirvaishvanaro yo'yamanantah
    purusho yenedamannam pacyate yadidamadyate tasyaisha ghosho bhavati yadetatkarnavapidhaya shrinoti
    sa yadotkramishyanbhavati nainam ghosham shrinoti || 8|| sa va esha pancadhatmanam pravibhajya nihito
    guhayam manomayah pranashariro bahurupah satyasam kalpa atmeti sa va esho'sya hridantare tishthannakritartho'manyatarthanasani
    tatsvanimani bhittvoditah pancabhi rashmibhirvishayanattiti buddhindriyani yanimanyetanyasya rashmayah
    karmendriyanyasya haya rathah shariram mano niyanta prakritimayosya pratodanena khalviritam paribhramatidam
    shariram cakramiva mrite ca nedam shariram cetanavatpratishthapitam pracodayita caisho'syeti || 9||
    sa va esha atmetyado vasham nita iva sitasitaih karmaphalairabhibhuyamana iva pratisharireshu caratyavyaktatvatsukshmatvadadrishyatvadagrahyatvannirmamatva
    ccanavastho'karta kartevavasthitah || 10|| sa va esha shuddhah sthiro'calashcalepo'vyagro nihsprihah
    prekshakavadavasthitah svasya caritabhuggunamayena patenatmanamantardhiyavasthita ityavasthita iti
    || 11|| iti dvitiyah prapathakah || tritiyah prapathakah || te hocurbhagavanyadyevamasyatmano mahimanam
    sucayasityanyo va parah ko'yamatma sitasitaih karmaphalairabhibhuyamanah sadasadyonimapadyata ityavacim
    vordhvam va gatam dvandvairabhibhuyamanah paribhramatiti katama esha iti tanhovaca || 1|| asti khalvanyo'paro
    bhutatma yo'yam sitasitaih karmaphalairabhibhuyamanah sadasadayonimapadyata ityavacim vordhvam gatim
    dvandvairabhibhuyamanah paribhramatityasyopavyakhyanam panca tanmatrani bhutashabdenocyante panca
    mahabhutani bhutashabdenocyante'tha tesham yah samudayah shariramityuktamatha yo ha khalu vava shariramityuktam
    sa bhutatmetyuktamathasti tasyatma binduriva pushkara iti sa va esho'bhibhutah prakrityairgunairityato'bhibhutatvatsammudhatvam
    prayatyasammudhastvadatmastham prabhum bhagavantam karayitaram napashyadgunaughaistripyamanah kalushikritasthirashcancalo
    lolupyamanah saspriho vyagrashcabhimanatvam prayata ityaham so mamedamityevam manyamano nibadhnatyatmanatmanam
    jalenaiva khacarah kritasyanuphalairabhibhuyamanah paribhramatiti || 2|| athanyatrapyuktam yah karta
    so'yam vai bhutatma karanaih karayitantahpurusho'tha yathagninayahpindo vabhibhutah kartribhirhanyamano
    nanatvamupaityevam vava khalvasau bhutatmantahpurushenabhibhuto gunairhanyamano nanatvamupaityatha
    yattrigunam caturashitilakshayoniparinatam bhutatrigunametadvai nanatvasya rupam tani ha va imani
    gunani purusheneritani cakramiva cakrinetyatha yathayahpinde hanyamane nagnirabhibhuyatyevam nabhibhuyatyasau
    purusho'bhibhuyatyayam bhutatmopasamshlishtatvaditi || 3|| athanyatrapyuktam shariramidam maithunadevodbhutam
    samvidapetam niraya eva mutradvarena nishkramantamasthibhishcitam mamsenanuliptam carmanavabaddham
    vinmutrapittakaphamajjamedovasabhiranyaishca malairbahubhih paripurnam kosha ivavasanneti || 4|| athanyatrapyuktam
    sammoho bhayam vishado nidra tandri vrano jara shokah kshutpipasa karpanyam krodho nastikyamajnanam
    matsaryam vaikarunyam mudhatvam nirvridatvam nikritatvamuddhatatvamasamatvamiti tamasanvitastrishna
    sneho rago lobho himsa ratirdrishtivyapritatvamirshya kamamavasthitatvam cancalatvam jihirsharthoparjanam
    mitranugrahanam parigrahavalambo'nishteshvindriyartheshu dvishtirishteshvabhishanga iti rajasanvitaih
    paripurna etairabhibhuta ityayam bhutatma tasmannanarupanyapnotityapnotiti || 5|| caturthah prapathakah
    || te ha khalvathordhvaretaso'tivismita atisametyocurbhagavannamaste tvam nah shadhi tvamasmakam gatiranya
    na vidyata ityasya ko'tithirbhutatmano yenedam hitvamanyeva sayujyamupaiti tanhovaca || 1|| athanyatrapyuktam
    mahanadishurmaya iva nivartakamasya yatpurakritam samudraveleva durnivaryamasya mrityoragamanam sadasatphalamayairhi
    pashaih pashuriva baddham bandhanasthasyevasvatantryam yamavishayasthasyaiva bahubhayavastham madironmatta
    ivamodamamadironmattam papmana grihita iva bhramyamanam mahoragadashta iva vipadrishtam mahandhakara
    iva ragandhamindrajalamiva mayamayam svapnamiva mithyadarshanam kadaligarbha ivasaram nata iva kshanavesham
    citrabhittiriva mithyamanoramamityathoktam || shabdasparshadayo ye'rtha anartha iva te sthitah | yeshvasaktastu
    bhutatma na smarecca param padam || 2|| ayam va va khalvasya pratividhirbhutatmano yadyeva vidyadhigamasya
    dharmasyanucaranam svashrameshvanukramanam svadharma eva sarvam dhatte stambhashakhevetaranyanenordhvabhagbhavatyanyathadhah
    patatyesha svadharmabhibhuto yo vedeshu na svadharmatikramenashrami bhavatyashrameshvevavasthitastapasvi
    cetyucyata etadapyuktam natapaskasyatmadhyane'dhigamah karmashuddhirvetyevam hyaha || tapasa prapyate
    sattvam sattvatsamprapyate manah | manasa prapyate tvatma hyatmapattya nivartata iti || 3|| atraite
    shloka bhavanti || yatha nirindhano vahnih svayonavupashamyati | tatha vrittikshayaccittam svayonavupashamyati
    || 1|| svayonavupashantasya manasah satyagaminah | indriyarthavimudhasyanritah karmavashanugah ||
    2|| cittameva hi samsarastatprayatnena shodhayet | yaccittastanmayo bhavati guhyametatsanatanam ||
    3|| cittasya hi prasadena hanti karma shubhashubham | prasannatmatmani sthitva sukhamavyayamashnute||
    4|| samasaktam yada cittam jantorvishayagocare | yadyevam brahmani syattatko na mucyeta bandhanat
    || 5|| mano hi dvividham proktam shuddham cashuddhameva ca | ashuddham kamasankalpam shuddham kamavivarjitam
    || 6|| layaviksheparahitam manah kritva sunishcalam | yada yatyamanibhavam tada tatparamam padam ||
    7|| tavadeva niroddhavyam hridi yavatkshayam gatam | etajjnanam ca moksham ca sheshastu granthavistarah
    || 8|| samadhinirdhutamalasya cetaso niveshitasyatmani yatsukham labhet | na shakyate varnayitum gira
    tada svayam tadantahkaranena grihyate || 9|| apamapo'gniragnau va vyomni vyoma na lakshayet | evamantargatam
    cittam purushah pratimucyate || 10|| mana eva manushyanam karanam bandhamokshayoh | bandhaya vishayasaktam
    muktyai nirvishayam smritamiti || 11|| pancamah prapathakah || atha yatheyam kautsayanistutih || tvam
    brahma tvam ca vai vishnustvam rudrastvam prajapatih | tvamagnirvaruno vayustvamindrastvam nishakarah
    || 12|| tvam manustvam yamashca tvam prithivi tvamathacyutah | svarthe svabhavike'rthe ca bahudha
    tishthase divi || 13|| vishveshvara namastubhyam vishvatma vishvakarmakrit | vishvabhugvishvamayastvam
    vishvakridaratih prabhuh || 14|| namah shantatmane tubhyam namo guhyatamaya ca | acintyayaprameyaya
    anadinidhanaya ceti || 15|| || 4|| tamo va idamekamasa tatpashcatpareneritam vishayatvam prayatyetadvai
    rajaso rupam tadrajah khalviritam vishamatvam prayatyetadvai tamaso rupam tattamah khalviritam tamasah
    samprasravatyetadvai sattvasya rupam tatsattvameveritam tatsattvatsamprasravatsom'sho'yam yashcetanamatrah
    pratipurusham kshetrajnah sankalpadhyavasayabhimanalingah prajapatistasya prokta agryastanavo brahma
    rudro vishnurityatha yo ha khalu vavasya rajasom'sho'sau sa yo'yam brahmatha yo ha khalu vavasya tamasom'sho'sau
    sa yo'yam rudro'tha yo ha khalu vavasya satvikom'sho'sau sa evam vishnuh sa va esha ekastridhabhuto'shtadhaikadashadha
    dvadashadhaparimitadha codbhuta udbhutatvadbhuteshu carati pratishtha sarvabhutanamadhipatirbabhuvetyasavatmantarbahishcantarbahishca
    || 5|| shashthah prapathakah || dvidha va esha atmanam bibhartyayam yah prano yashcasa adityo'tha
    dvau va eta asya panthana antarbahishcahoratrenaitau vyavartete asau va adityo bahiratmantaratma prano'to
    bahiratmakya gatyantaratmano'numiyate gatirityevam hi ahatha yah kashcidvidvanapahatapapma'kshadhyaksho'vadatamanastannishtha
    avrittacakshuh so antaratmakya gatya bahiratmano'numiyate gatirityevam ha aha atha ya esho'ntaraditye
    hiranmayah purusho yah pashyatimam hiranyavasthat sa esho'ntare hritpushkara evashrito'nnamatti ||
    1|| atha ya esho'ntare hritpushkara evashrito'nnamatti sa esho'gnirdivi shritah saurah kalakhyo'drishyah
    sarvabhutanyannamattiti kah pushkarah kimmayo veti iadam va va tatpushkaram yo'yamakasho'syemah catasro
    dishashcatasra upadisho dalasamstha asamarvagvicarata etau pranaditya eta upasitomityetadaksharena
    vyahritibhih savitrya ceti || 2|| dve vava brahmano rupe murtam camurtam ca | atha yanmurtam tadasatyam
    yadamurtam tatsatyam tadbrahma tajjyotih yajjyotih sa adityah sa va esha omityetadatmabhavat sa tredhatmanam
    vyakuruta omiti tisro matra etabhih sarvamidamotam protam caivasmiti evam hyahaitadva aditya omityevam
    dhyayata atmanam yunjiteti || 3|| athanyatrapi uktamatha khalu ya udgithah sa pranavo yah pranavah
    sa udgitha iti asau va aditya udgitha esha pranava iti | evam hyahodgitham pranavakhyam pranetaram
    bharupam vigatanidram vijaram vimrityum tripadam tryaksharam punah pancadha jneyam nihitam guhayamityevam
    hyahordhvamulam tripadbrahma shakha akasha vayvagnyudakabhumyadaya eko'shvatthanamaitadbrahmaitasyaitattejo
    yadasa adityah omityetadaksharasya caitattasmadomityanenaitadupasitajasramityeko'sya sambodhayitetyevam
    hyaha
  devanagari: उपनिषद् मैत्रायण्युपनिषत् ॥ अथ मैत्रायण्युपनिषत् ॥ सामवेदीय सामान्य उपनिषत् ॥ वैराग्योत्थभक्तियुक्तब्रह्ममात्रप्रबोधतः
    । यत्पदं मुनयो यान्ति तत्त्रैपदमहं महः ॥ ॐ आप्यायन्तु ममाङ्गानि वाक्प्राणश्चक्षुः श्रोतमथो बलमिन्द्रियाणि
    च । सर्वाणि सर्वं ब्रह्मोपनिषदं माहं ब्रह्म निराकुर्यां मा मा ब्रह्म निराकरोदनिराकरणमस्त्वनिराकरणं
    मेस्तु तदात्मनि निरते य उपनिषत्सु धर्मास्ते मयि सन्तु ते मयि सन्तु ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ मैत्रायणी
    कौषितकी बृहज्जाबालतापनी । कालाग्निरुद्रमैत्रेयी सुबालक्षुरमन्त्रिका । ॐ बृहद्रथो ह वै नाम राजा राज्ये
    ज्येष्ठं पुत्रं निधापयित्वेदमशाश्वतं मन्यमानः शारीरं वैराग्यमुपेतोऽरण्यं निर्जगाम स तत्र परमं तप आस्थायादित्यमीक्षमाण
    ऊर्ध्वबाहुस्तिष्ठत्यन्ते सहस्रस्य मुनिरन्तिकमाजगामाग्निरिवाधूमकस्तेजसा निर्दहन्निवात्मविद्भगवाञ्छाकायन्य
    उत्तिष्ठोत्तिष्ठ वरं वृणीश्वेति राजानमब्रवीत्स तस्मै नमस्कृत्योवाच भगवन्नाहमात्मवित्त्वं तत्त्वविच्छृणुमो
    वयं स त्वं नो ब्रूहीत्येतद्वृतं पुरस्तादशक्यं मा पृच्छ प्रश्नमैक्ष्वाकान्यान्कामान्वृणीश्वेति शाकायन्यस्य
    चरणवभिमृश्यमानो राजेमां गाथां जगाद ॥ १॥ भगवन्नस्थिचर्मस्नायुमज्जामांसशुक्रशोणितश्लेष्माश्रुदू षिते
    विण्मूत्रवातपित्तकफसङ्घाते दुर्गन्धे निःसारेऽस्मिञ्छरीरे किं कामोपभोगैः ॥ २॥ कामक्रोधलोभभयविषादेर्ष्येष्टवियोगानिष्टसम्प्रयोगक्षु
    त्पिपासाजरामृत्युरोगशोकाद्यैरभिहतेऽस्मिञ्छरीरे किं कामोपभोगैः ॥ ३॥ सर्वं चेदं क्षयिष्णु पश्यामो यथेमे
    दंशमशकादयस्तृणवन्नश्यतयोद्भूतप्रध्वंसिनः ॥ ४॥ अथ किमेतैर्वा परेऽन्ये महाधनुर्धराश्चक्रवर्तिनः केचित्सुद्युम्नभूरिद्युम्नेन्द्रद्युम्नकुवलयाश्वयौवनाश्ववद्धिया
    श्वाश्वपतिः शशबिन्दुर्हारिश्चन्द्रोऽम्बरीषो ननूक्तस्वयातिर्ययातिनरण्योक्षसेनोत्थमरुत्तभरतप्रभृतयो
    राजानो मिषतो बन्धुवर्गस्य महतीं श्रियं त्यक्त्वास्माल्लोकादमुं लोकं प्रयान्ति ॥ ५॥ अथ किमेतैर्वा परेऽन्ये
    गन्धर्वासुरयक्षराक्षसभूतगणपिशाचोरगग्रहादीनां निरोधनं पश्यामः ॥ ६॥ अथ किमेतैर्वान्यानां शोषणं महार्णवानां
    शिखरिणां प्रपतनं ध्रुवस्य प्रचलनं स्थानं वा तरूणां निमज्जनं पृथिव्याः स्थानादपसरणं सुराणं सोऽहमित्येतद्विधेऽस्मिन्संसारे
    किं कामोपभोगैर्यैरेवाश्रितस्यासकृदिहावर्तनं दृश्यत इत्युद्धर्तुमर्हसीत्यन्धोदपानस्थो भेक इवाहमस्मिन्संसारे
    भगवंस्त्वं नो गतिस्त्वं नो गतिः ॥ ७॥ इति प्रथमः प्रपाठकः ॥ अथ भगवाञ्छाकायन्यः सुप्रीतोऽब्रवीद्राजानं
    महाराज बृहद्रथेक्ष्वाकुवंशध्वजशीर्षात्मजः कृतकृत्यस्त्वं मरुन्नाम्नो विश्रुतोऽसीत्ययं वा व खल्वात्मा
    ते कतमो भगवान्वर्ण्य इति तं होवाच इति ॥ १॥ य एषो बाह्यावष्टम्भनेनोर्ध्वमुत्क्रान्तो व्यथमानोऽव्यथमानस्तमः
    प्रणुदत्येष आत्मेत्याह भगवानथ य एष सम्प्रसादोऽस्माञ्छरीरात्समुत्थाय परं ज्योतिरुपसम्पद्य स्वेन रूपेणाभिनिष्पद्यत
    एष आत्मेति होवाचैतदमृतमभयमेतद्ब्रह्मेति ॥ २॥ अथ खल्वियं ब्रह्मविद्या सर्वोपनिषद्विद्या वा राजन्नस्माकं
    भगवता मैत्रेयेण व्याख्याताहं ते कथयिष्यामीत्यथापहतपाप्मानस्तिग्मतेजस ऊर्ध्वरेतसो वालखिल्या इति श्रुयन्तेऽथैते
    प्रजापतिमब्रुवन्भगवञ्शकटमिवाचेतनमिदं शरीरं कस्यैष खल्वीदृशो महिमातीन्द्रियभूतस्य येनैतद्विधमिदं चेतनवत्प्रतिष्ठापितं
    प्रचोदयितास्य को भगवन्नेतदस्माकं ब्रूहीति तान्होवाच ॥ ३॥ यो ह खलु वाचोपरिस्थः श्रूयते स एव वा एष शुद्धः
    पूतः शून्यः शान्तो प्राणोऽनीशत्माऽनन्तोऽक्षय्यः स्थिरः शाश्वतोऽजः स्वतन्त्रः स्वे महिम्नि तिष्ठत्यनेनेदं
    शरीरं चेतनवत्प्रतिष्ठापितं प्रचोदयिता चैषोऽस्येति ते होचुर्भगवन्कथमनेनेदृशेनानिच्छेनैतद्विधमिदं चेतनवत्प्रतिष्ठापितं
    प्रचोदयिता चैषोऽस्येति कथमिति तान्होवाच ॥ ४॥ स वा एष सूक्ष्मोऽग्राह्योऽदृश्यः पुरुषसञ्ज्ञको बुद्धिपूर्वमिहैवावर्ततेंऽशेन
    सुषुप्तस्यैव बुद्धिपूर्वं निबोधयत्यथ योह खलु वावाइतस्यांशोऽयं यश्चेतनमात्रः प्रतिपूरुषं क्षेत्रज्ञः
    सङ्कल्पाध्यवसायाभिमानलिङ्गः प्रजापतिर्विश्वक्षस्तेन चेतनेनेदं शरीरं चेतनवत्प्रतिष्ठापितं प्रचोदयिता
    चैषोऽस्येति ते होचुर्भगवन्नीदृशस्य कथमंशेन वर्तनमिति तान्होवाच ॥ ५॥ प्रजापतिर्वा एषोऽग्रेऽतिष्ठत्स
    नारमतैकः स आत्मनमभिध्यायद्बव्हीः प्रजा असृजत्त अस्यैवात्मप्रबुद्धा अप्राणा स्थाणुरिव तिष्ठमाना अपश्यत्स
    नारमत सोऽमन्यतैतासं प्रतिबोधनायाभ्यन्तरं प्राविशानीत्यथ स वायुमिवात्मानं कृत्वाभ्यन्तरं प्राविशत्स
    एको नाविशत्स पञ्चधात्मानं प्रविभज्योच्यते यः प्राणोऽपानः समान उदानो व्यान इति ॥ ६॥ अथ योऽयमूर्ध्वमुत्क्रामतीत्येष
    वाव स प्राणोऽथ योयमावञ्चं सङ्क्रामत्वेष वाव सोऽपानोऽथ योयं स्थविष्ठमन्नधातुमपाने स्थापयत्यणिष्ठं चाङ्गेऽङ्गे
    समं नयत्येष वाव स समानोऽथ योऽयं पीताशितमुद्गिरति निगिरतीति चैष वाव स उदानोऽथ येनैताः शिरा अनुव्याप्ता
    एष वाव स व्यानः ॥ ७॥ अथोपांशुरन्तर्याम्यमिभवत्यन्तर्याममुपांशुमेतयोरन्तराले चौष्ण्यं मासवदौष्ण्यं
    स पुरुषोऽथ यः पुरुषः सोऽग्निर्वैश्वानरोऽप्यन्यत्राप्युक्तमयमग्निर्वैश्वानरो योऽयमनन्तः पुरुषो येनेदमन्नं
    पच्यते यदिदमद्यते तस्यैष घोषो भवति यदेतत्कर्णावपिधाय शृणोति स यदोत्क्रमिष्यन्भवति नैनं घोषं शृणोति
    ॥ ८॥ स वा एष पञ्चधात्मानं प्रविभज्य निहितो गुहायां मनोमयः प्राणशरीरो बहुरूपः सत्यसं कल्प आत्मेति स
    वा एषोऽस्य हृदन्तरे तिष्ठन्नकृतार्थोऽमन्यतार्थानसानि तत्स्वानीमानि भित्त्वोदितः पञ्चभी रश्मिभिर्विषयानत्तीति
    बुद्धीन्द्रियाणि यानीमान्येतान्यस्य रश्मयः कर्मेन्द्रियाण्यस्य हया रथः शरीरं मनो नियन्ता प्रकृतिमयोस्य
    प्रतोदनेन खल्वीरितं परिभ्रमतीदं शरीरं चक्रमिव मृते च नेदं शरीरं चेतनवत्प्रतिष्ठापितं प्रचोदयिता चैषोऽस्येति
    ॥ ९॥ स वा एष आत्मेत्यदो वशं नीत इव सितासितैः कर्मफलैरभिभूयमान इव प्रतिशरीरेषु चरत्यव्यक्तत्वात्सूक्ष्मत्वाददृश्यत्वादग्राह्यत्वान्निर्ममत्वा
    च्चानवस्थोऽकर्ता कर्तेवावस्थितः ॥ १०॥ स वा एष शुद्धः स्थिरोऽचलश्चालेपोऽव्यग्रो निःस्पृहः प्रेक्षकवदवस्थितः
    स्वस्य चरितभुग्गुणमयेन पटेनात्मानमन्तर्धीयावस्थित इत्यवस्थित इति ॥ ११॥ इति द्वितीयः प्रपाठकः ॥ तृतीयः
    प्रपाठकः ॥ ते होचुर्भगवन्यद्येवमस्यात्मनो महिमानं सूचयसीत्यन्यो वा परः कोऽयमात्मा सितासितैः कर्मफलैरभिभूयमानः
    सदसद्योनिमापद्यत इत्यवाचीं वोर्ध्वां वा गतं द्वन्द्वैरभिभूयमानः परिभ्रमतीति कतम एष इति तान्होवाच ॥
    १॥ अस्ति खल्वन्योऽपरो भूतात्मा योऽयं सितासितैः कर्मफलैरभिभूयमानः सदसदयोनिमापद्यत इत्यवाचीं वोर्ध्वां
    गतिं द्वन्द्वैरभिभूयमानः परिभ्रमतीत्यस्योपव्याख्यानं पञ्च तन्मात्राणि भूतशब्देनोच्यन्ते पञ्च महाभूतानि
    भूतशब्देनोच्यन्तेऽथ तेषां यः समुदायः शरीरमित्युक्तमथ यो ह खलु वाव शरीरमित्युक्तं स भूतात्मेत्युक्तमथास्ति
    तस्यात्मा बिन्दुरिव पुष्कर इति स वा एषोऽभिभूतः प्राकृत्यैर्गुणैरित्यतोऽभिभूतत्वात्सम्मूढत्वं प्रयात्यसम्मूढस्त्वादात्मस्थं
    प्रभुं भगवन्तं कारयितारं नापश्यद्गुणौघैस्तृप्यमानः कलुषीकृतास्थिरश्चञ्चलो लोलुप्यमानः सस्पृहो व्यग्रश्चाभिमानत्वं
    प्रयात इत्यहं सो ममेदमित्येवं मन्यमानो निबध्नात्यात्मनात्मानं जालेनैव खचरः कृतस्यानुफलैरभिभूयमानः
    परिभ्रमतीति ॥ २॥ अथान्यत्राप्युक्तं यः कर्ता सोऽयं वै भूतात्मा करणैः कारयितान्तःपुरुषोऽथ यथाग्निनायःपिण्डो
    वाभिभूतः कर्तृभिर्हन्यमानो नानात्वमुपैत्येवं वाव खल्वसौ भूतात्मान्तःपुरुषेणाभिभूतो गुणैर्हन्यमानो
    नानात्वमुपैत्यथ यत्त्रिगुणं चतुरशीतिलक्षयोनिपरिणतं भूतत्रिगुणमेतद्वै नानात्वस्य रूपं तानि ह वा इमानि
    गुणानि पुरुषेणेरितानि चक्रमिव चक्रिणेत्यथ यथायःपिण्डे हन्यमाने नाग्निरभिभूयत्येवं नाभिभूयत्यसौ पुरुषोऽभिभूयत्ययं
    भूतात्मोपसंश्लिष्टत्वादिति ॥ ३॥ अथान्यत्राप्युक्तं शरीरमिदं मैथुनादेवोद्भूतं संविदपेतं निरय एव मूत्रद्वारेण
    निष्क्रामन्तमस्थिभिश्चितं मांसेनानुलिप्तं चर्मणावबद्धं विण्मूत्रपित्तकफमज्जामेदोवसाभिरन्यैश्च मलैर्बहुभिः
    परिपूर्णं कोश इवावसन्नेति ॥ ४॥ अथान्यत्राप्युक्तं सम्मोहो भयं विषादो निद्रा तन्द्री व्रणो जरा शोकः
    क्षुत्पिपासा कार्पण्यं क्रोधो नास्तिक्यमज्ञानं मात्सर्यं वैकारुण्यं मूढत्वं निर्व्रीडत्वं निकृतत्वमुद्धातत्वमसमत्वमिति
    तामसान्वितस्तृष्णा स्नेहो रागो लोभो हिंसा रतिर्दृष्टिव्यापृतत्वमीर्ष्या काममवस्थितत्वं चञ्चलत्वं जिहीर्षार्थोपार्जनं
    मित्रानुग्रहणं परिग्रहावलम्बोऽनिष्टेष्विन्द्रियार्थेषु द्विष्टिरिष्टेश्वभिषङ्ग इति राजसान्वितैः परिपूर्ण
    एतैरभिभूत इत्ययं भूतात्मा तस्मान्नानारूपाण्याप्नोतीत्याप्नोतीति ॥ ५॥ चतुर्थः प्रपाठकः ॥ ते ह खल्वथोर्ध्वरेतसोऽतिविस्मिता
    अतिसमेत्योचुर्भगवन्नमस्ते त्वं नः शाधि त्वमस्माकं गतिरन्या न विद्यत इत्यस्य कोऽतिथिर्भूतात्मनो येनेदं
    हित्वामन्येव सायुज्यमुपैति तान्होवाच ॥ १॥ अथान्यत्राप्युक्तं महानदीषूर्मय इव निवर्तकमस्य यत्पुराकृतं
    समुद्रवेलेव दुर्निवार्यमस्य मृत्योरागमनं सदसत्फलमयैर्हि पाशैः पशुरिव बद्धं बन्धनस्थस्येवास्वातन्त्र्यं
    यमविषयस्थस्यैव बहुभयावस्थं मदिरोन्मत्त इवामोदममदिरोन्मत्तं पाप्मना गृहीत इव भ्राम्यमाणं महोरगदष्ट
    इव विपदृष्टं महान्धकार इव रागान्धमिन्द्रजालमिव मायामयं स्वप्नमिव मिथ्यादर्शनं कदलीगर्भ इवासारं नट
    इव क्षणवेषं चित्रभित्तिरिव मिथ्यामनोरममित्यथोक्तम् ॥ शब्दस्पर्शादयो येऽर्था अनर्था इव ते स्थिताः ।
    येष्वासक्तस्तु भूतात्मा न स्मरेच्च परं पदम् ॥ २॥ अयं वा व खल्वस्य प्रतिविधिर्भूतात्मनो यद्येव विद्याधिगमस्य
    धर्मस्यानुचरणं स्वाश्रमेष्वानुक्रमणं स्वधर्म एव सर्वं धत्ते स्तम्भशाखेवेतराण्यनेनोर्ध्वभाग्भवत्यन्यथधः
    पतत्येष स्वधर्माभिभूतो यो वेदेषु न स्वधर्मातिक्रमेणाश्रमी भवत्याश्रमेष्वेवावस्थितस्तपस्वी चेत्युच्यत
    एतदप्युक्तं नातपस्कस्यात्मध्यानेऽधिगमः कर्मशुद्धिर्वेत्येवं ह्याह ॥ तपसा प्राप्यते सत्त्वं सत्त्वात्सम्प्राप्यते
    मनः । मनसा प्राप्यते त्वात्मा ह्यात्मापत्त्या निवर्तत इति ॥ ३॥ अत्रैते श्लोका भवन्ति ॥ यथा निरिन्धनो
    वह्निः स्वयोनावुपशाम्यति । तथा वृत्तिक्षयाच्चित्तं स्वयोनावुपशाम्यति ॥ १॥ स्वयोनावुपशान्तस्य मनसः
    सत्यगामिनः । इन्द्रियार्थाविमूढस्यानृताः कर्मवशानुगाः ॥ २॥ चित्तमेव हि संसारस्तत्प्रयत्नेन शोधयेत्
    । यच्चित्तस्तन्मयो भवति गुह्यमेतत्सनातनम् ॥ ३॥ चित्तस्य हि प्रसादेन हन्ति कर्म शुभाशुभम् । प्रसन्नात्मात्मनि
    स्थित्वा सुखमव्ययमश्नुते॥ ४॥ समासक्तं यदा चित्तं जन्तोर्विषयगोचरे । यद्येवं ब्रह्मणि स्यात्तत्को न
    मुच्येत बन्धनात् ॥ ५॥ मनो हि द्विविधं प्रोक्तं शुद्धं चाशुद्धमेव च । अशुद्धं कामसङ्कल्पं शुद्धं कामविवर्जितम्
    ॥ ६॥ लयविक्षेपरहितं मनः कृत्वा सुनिश्चलम् । यदा यात्यमनीभावं तदा तत्परमं पदम् ॥ ७॥ तावदेव निरोद्धव्यं
    हृदि यावत्क्षयं गतम् । एतज्ज्ञानं च मोक्षं च शेषास्तु ग्रन्थविस्तराः ॥ ८॥ समाधिनिर्धूतमलस्य चेतसो
    निवेशितस्यात्मनि यत्सुखं लभेत् । न शक्यते वर्णयितुं गिरा तदा स्वयं तदन्तःकरणेन गृह्यते ॥ ९॥ अपामपोऽग्निरग्नौ
    वा व्योम्नि व्योम न लक्षयेत् । एवमन्तर्गतं चित्तं पुरुषः प्रतिमुच्यते ॥ १०॥ मन एव मनुष्याणां कारणं
    बन्धमोक्षयोः । बन्धाय विषयासक्तं मुक्त्यै निर्विषयं स्मृतमिति ॥ ११॥ पञ्चमः प्रपाठकः ॥ अथ यथेयं कौत्सायनिस्तुतिः
    ॥ त्वं ब्रह्मा त्वं च वै विष्णुस्त्वं रुद्रस्त्वं प्रजापतिः । त्वमग्निर्वरुणो वायुस्त्वमिन्द्रस्त्वं
    निशाकरः ॥ १२॥ त्वं मनुस्त्वं यमश्च त्वं पृथिवी त्वमथाच्युतः । स्वार्थे स्वाभाविकेऽर्थे च बहुधा तिष्ठसे
    दिवि ॥ १३॥ विश्वेश्वर नमस्तुभ्यं विश्वात्मा विश्वकर्मकृत् । विश्वभुग्विश्वमायस्त्वं विश्वक्रीडारतिः
    प्रभुः ॥ १४॥ नमः शान्तात्मने तुभ्यं नमो गुह्यतमाय च । अचिन्त्यायाप्रमेयाय अनादिनिधनाय चेति ॥ १५॥ ॥
    ४॥ तमो वा इदमेकमास तत्पश्चात्परेणेरितं विषयत्वं प्रयात्येतद्वै रजसो रूपं तद्रजः खल्वीरितं विषमत्वं
    प्रयात्येतद्वै तमसो रूपं तत्तमः खल्वीरितं तमसः सम्प्रास्रवत्येतद्वै सत्त्वस्य रूपं तत्सत्त्वमेवेरितं
    तत्सत्त्वात्सम्प्रास्रवत्सोंऽशोऽयं यश्चेतनमात्रः प्रतिपुरुषं क्षेत्रज्ञः सङ्कल्पाध्यवसायाभिमानलिङ्गः
    प्रजापतिस्तस्य प्रोक्ता अग्र्यास्तनवो ब्रह्मा रुद्रो विष्णुरित्यथ यो ह खलु वावास्य राजसोंऽशोऽसौ स
    योऽयं ब्रह्माथ यो ह खलु वावास्य तामसोंऽशोऽसौ स योऽयं रुद्रोऽथ यो ह खलु वावास्य सात्विकोंऽशोऽसौ स एवं
    विष्णुः स वा एष एकस्त्रिधाभूतोऽष्टधैकादशधा द्वादशधापरिमितधा चोद्भूत उद्भूतत्वाद्भूतेषु चरति प्रतिष्ठा
    सर्वभूतानामधिपतिर्बभूवेत्यसावात्मान्तर्बहिश्चान्तर्बहिश्च ॥ ५॥ षष्ठः प्रपाठकः ॥ द्विधा वा एष आत्मानं
    बिभर्त्ययं यः प्राणो यश्चासा आदित्योऽथ द्वौ वा एता अस्य पन्थाना अन्तर्बहिश्चाहोरात्रेणैतौ व्यावर्तेते
    असौ वा आदित्यो बहिरात्मान्तरात्मा प्राणोऽतो बहिरात्मक्या गत्यान्तरात्मनोऽनुमीयते गतिरित्येवं हि आहाथ
    यः कश्चिद्विद्वानपहतपाप्माऽक्षाध्यक्षोऽवदातमनास्तन्निष्ठ आवृत्तचक्षुः सो अन्तरात्मक्या गत्या बहिरात्मनोऽनुमीयते
    गतिरित्येवं ह आह अथ य एषोऽन्तरादित्ये हिरण्मयः पुरुषो यः पश्यतीमां हिरण्यवस्थात् स एषोऽन्तरे हृत्पुष्कर
    एवाश्रितोऽन्नमत्ति ॥ १॥ अथ य एषोऽन्तरे हृत्पुष्कर एवाश्रितोऽन्नमत्ति स एषोऽग्निर्दिवि श्रितः सौरः
    कालाख्योऽदृश्यः सर्वभूतान्यन्नमत्तीति कः पुष्करः किम्मयो वेति इअदं वा व तत्पुष्करं योऽयमाकाशोऽस्येमाः
    चतस्रो दिशश्चतस्र उपदिशो दलसंस्था आसमर्वाग्विचरत एतौ प्राणादित्या एता उपासितोमित्येतदक्षरेण व्याहृतिभिः
    सावित्र्या चेति ॥ २॥ द्वे वाव ब्रह्मणो रूपे मूर्तं चामूर्तं च । अथ यन्मूर्तं तदसत्यम् यदमूर्तं तत्सत्यम्
    तद्ब्रह्म तज्ज्योतिः यज्ज्योतिः स आदित्यः स वा एष ओमित्येतदात्माभवत् स त्रेधात्मानं व्याकुरुत ओमिति
    तिस्रो मात्रा एताभिः सर्वमिदमोतं प्रोतं चैवास्मीति एवं ह्याहैतद्वा आदित्य ओमित्येवं ध्यायत आत्मानं
    युञ्जीतेति ॥ ३॥ अथान्यत्रापि उक्तमथ खलु य उद्गीथः स प्रणवो यः प्रणवः स उद्गीथ इति असौ वा आदित्य उद्गीथ
    एष प्रणवा इति । एवं ह्याहोद्गीथं प्रणवाख्यं प्रणेतारं भारूपं विगतनिद्रं विजरं विमृत्युं त्रिपदं त्र्यक्षरं
    पुनः पञ्चधा ज्ञेयं निहितं गुहायामित्येवं ह्याहोर्ध्वमूलं त्रिपाद्ब्रह्म शाखा आकाश वाय्वग्न्युदकभूम्यादय
    एकोऽश्वत्थनामैतद्ब्रह्मैतस्यैतत्तेजो यदसा आदित्यः ओमित्येतदक्षरस्य चैतत्तस्मादोमित्यनेनैतदुपासीताजस्रमित्येकोऽस्य
    सम्बोधयितेत्येवं ह्याह
