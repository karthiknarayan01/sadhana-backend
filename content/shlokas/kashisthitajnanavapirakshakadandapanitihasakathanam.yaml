id: kashisthitajnanavapirakshakadandapanitihasakathanam
category: raksha
name:
  english: kashisthitajnanavapirakshakadandapanitihasakathanam
  devanagari: काशीस्थितज्नानवापीरक्षकदण्डपाणीतिहासकथनम्
content:
  english: tapo ghoram bhuyo bhuyashcakara sah || 36|| tatah kashimam prapya tapashcakre sa balakah |
    vighnaih samvighnito'pyatra bhaktya bhrishamanuttamam || 37|| tenaiva lajjitah sarve munayo brahmavadinah
    | ashcaryam munayashcakrurdrishtva balakamuttamam || 38|| dridhavratam shivaratam nimilitavilocanam
    | tam drishtva munayah sarvem pranamanti punah punah || 39|| asthimatravashishtanga lingabhyarcanatatparam
    | drishtvaiva bhutah sarve'pi namantyanudinam muhuh || 40|| kritanjaliputa deva nivasanti pranamyatam
    | siddhagandharva yakshadyah pujayanti muhurmuhuh || 41|| vighnananekan samhritya lingapujanatatparah
    | tapastivrataram cakre harikesha vane shubhe || 42|| evam nivasatastasya punah pritya gatam maya
    | tatah samagatam drishtva mamastaushi sa tu balakah || 43|| stutvaivam bahudha balah pranamya ca
    muhurmuhuh | kritanjaliputo bhutva tasthau santushtamanasah || 74|| tasyasthimatravashishtamangam
    sprishtam maya tatah | ganapatyamapi pritya dattam tasmai manorame || 75|| jnanavapirakshanartham
    tattate sthapito maya | varo'nyo'pi maya dattah santushtena tatah param || 76|| tvatkritam stotramamalam
    yah pathetsatatam shucih | kashivaso'nisham tasya bhavatiti varanane || 77|| tadaprabhriti tattire
    dandam kancanamudvahan | tishthatyatyantansatushtah purnabhadrasutah shishuh || 78|| tenaiva tadyate
    lokah shivadveshakarah sada | brahmadayo'pi tam purvamarcayantyadhuna shubhe || 79|| kashiviyogam
    tanute sa eva kupitah sada | muninam manavanam ca devanamapi shikshakah || 80|| dandapanikripa yasmin
    na bhavishyati sarvatha | sa vihaya tada kashim yati deshantaram prati || 81|| pujaniyah prayatnena
    dandapanirmama priyah | kashivasaratairnityamapramattairyathocitam || 82|| dandapaniprasadena snanam
    bhavati dhimatam | jnanavapijale ramye sarvapapapanodane || 83|| shivapriyo dandapanih purnabhadrasuto'naghah
    | yaksheshah karunasindhurdhutapapo ganeshvarah || 84|| etannamashtakenaiva pratyaham shivatatparaih
    | pujaniyah prayatnena kashivasibhiradarat || 85|| dandapaniprasadartham kashivasaratairnaraih | bhojaniyastrayodashyam
    shaivah kshiradisadhanaih || 86|| namanti munayassarve pujayanti ca tam dvijah | tasyaivanugrahatsarve
    kashyam tishthantyanakulah || 87|| ayam yakshakulotpanno balo'pi madanugrahat | samarthyamidrisham
    prapya tishthatyatibalanvitah || 88|| purvapurvabhaveshvevamanenogram tapah kritam | mamuddishyanisham
    samyaktatphalam jatamidrisham || 89|| yah kashcidasti subhage madbhakto matparayanah | sa sarvavandyah
    shreshtha bhavishyati na samshayah || 90|| idam matvaivam munayi deva yaksha narottamah | lingarupinamekam
    mamarcayanti dridhavratah || 91|| dhritatripundrajitamanasartha manushyadevarshicara nirohah | mamekamisham
    sharanam prapannastishthanti lingarcana saktacittah || 92|| || iti shivarahasyantargate kashisthitajnanavapirakshakah
    dandapanitihasakathanam sampurnam ||
  devanagari: तपो घोरं भूयो भूयश्चकार सः ॥ ३६॥ ततः काशीमां प्राप्य तपश्चक्रे स बालकः । विघ्नैः संविघ्नितोऽप्यत्र
    भक्त्या भृशमनुत्तमम् ॥ ३७॥ तेनैव लज्जिताः सर्वे मुनयो ब्रह्मवादिनः । आश्चर्यं मुनयश्चक्रुर्दृष्ट्वा
    बालकमुत्तमम् ॥ ३८॥ दृढव्रतं शिवरतं निमीलितविलोचनम् । तं दृष्ट्वा मुनयः सर्वें प्रणमन्ति पुनः पुनः
    ॥ ३९॥ अस्थिमात्रावशिष्टाङ्ग लिङ्गाभ्यर्चनतत्परम् । दृष्ट्वैव भूताः सर्वेऽपि नमन्त्यनुदिनं मुहुः ॥
    ४०॥ कृताञ्जलिपुटा देवा निवसन्ति प्रणम्यतम् । सिद्धगन्धर्व यक्षाद्याः पूजयन्ति मुहुर्मुहुः ॥ ४१॥ विघ्नाननेकान्
    संहृत्य लिङ्गपूजनतत्परः । तपस्तीव्रतरं चक्रे हरिकेश वने शुभे ॥ ४२॥ एवं निवसतस्तस्य पुनः प्रीत्या गतं
    मया । ततः समागतं दृष्ट्वा मामस्तौषी स तु बालकः ॥ ४३॥ स्तुत्वैवं बहुधा बालः प्रणम्य च मुहुर्मुहुः ।
    कृताञ्जलिपुटो भूत्वा तस्थौ सन्तुष्टमानसः ॥ ७४॥ तस्यास्थिमात्रावशिष्टमङ्गं स्पृष्टं मया ततः । गाणापत्यमपि
    प्रीत्या दत्तं तस्मै मनोरमे ॥ ७५॥ ज्ञानवापीरक्षणार्थं तत्तटे स्थापितो मया । वरोऽन्योऽपि मया दत्तः
    सन्तुष्टेन ततः परम् ॥ ७६॥ त्वत्कृतं स्तोत्रममलं यः पठेत्सततं शुचिः । काशीवासोऽनिशं तस्य भवतीति वरानने
    ॥ ७७॥ तदाप्रभृति तत्तीरे दण्डं काञ्चनमुद्वहन् । तिष्ठत्यत्यन्तन्सतुष्टः पूर्णभद्रसुतः शिशुः ॥ ७८॥
    तेनैव ताड्यते लोकः शिवद्वेषकरः सदा । ब्रह्मादयोऽपि तं पूर्वमर्चयन्त्यधुना शुभे ॥ ७९॥ काशीवियोगं तनुते
    स एव कुपितः सदा । मुनीनां मानवानां च देवानामपि शिक्षकः ॥ ८०॥ दण्डपाणिकृपा यस्मिन् न भविष्यति सर्वथा
    । स विहाय तदा काशीं याति देशान्तरं प्रति ॥ ८१॥ पूजनीयः प्रयत्नेन दण्डपाणिर्मम प्रियः । काशीवासरतैर्नित्यमप्रमत्तैर्यथोचितम्
    ॥ ८२॥ दण्डपाणिप्रसादेन स्नानं भवति धीमताम् । ज्ञानवापीजले रम्ये सर्वपापापनोदने ॥ ८३॥ शिवप्रियो दण्डपाणिः
    पूर्णभद्रसुतोऽनघः । यक्षेशः करुणासिन्धुर्धूतपापो गणेश्वरः ॥ ८४॥ एतन्नामाष्टकेनैव प्रत्यहं शिवतत्परैः
    । पूजनीयः प्रयत्नेन काशीवासिभिरादरात् ॥ ८५॥ दण्डपाणिप्रसादार्थं काशीवासरतैर्नरैः । भोजनीयस्त्रयोदश्यां
    शैवः क्षीरादिसाधनैः ॥ ८६॥ नमन्ति मुनयस्सर्वे पूजयन्ति च तं द्विजाः । तस्यैवानुग्रहात्सर्वे काश्यां
    तिष्ठन्त्यनाकुलाः ॥ ८७॥ अयं यक्षकुलोत्पन्नो बालोऽपि मदनुग्रहात् । सामर्थ्यमीदृशं प्राप्य तिष्ठत्यतिबलान्वितः
    ॥ ८८॥ पूर्वपूर्वभवेष्वेवमनेनोग्रं तपः कृतम् । मामुद्दिश्यानिशं सम्यक्तत्फलं जातमीदृशम् ॥ ८९॥ यः कश्चिदस्ति
    सुभगे मद्भक्तो मत्परायणः । स सर्ववन्द्यः श्रेष्ठ भविष्यति न संशयः ॥ ९०॥ इदं मत्वैवं मुनयी देवा यक्षा
    नरोत्तमाः । लिङ्गरूपिणमेकं मामर्चयन्ति दृढव्रताः ॥ ९१॥ धृतत्रिपुण्ड्राजितमानसार्था मनुष्यदेवर्षिचरा
    निरोहाः । मामेकमीशं शरणं प्रपन्नास्तिष्ठन्ति लिङ्गार्चन सक्तचित्ताः ॥ ९२॥ ॥ इति शिवरहस्यान्तर्गते
    काशीस्थितज्ञानवापीरक्षकः दण्डपाणीतिहासकथनं सम्पूर्णम् ॥
