    न्निर्व॑पति । जा॒ता ए॒व प्र॒जा रु॒द्रान्नि॒रव॑दयते । एक॒मति॑रिक्तम् । ज॒नि॒ष्यमा॑णा ए॒व प्र॒जा रु॒द्रान्नि॒रव॑दयते
    । एक॑कपाला भवन्ति । ए॒क॒धैव रु॒द्र न्नि॒रव॑दयते । नाभिघा॑रयति । यद॑भिघा॒रये त् । अ॒न्त॒र॒व॒चा॒रिणग्ं॑
    रु॒द्र ङ्कु॑र्यात् । ए॒को॒ल्मु॒केन॑ यन्ति ॥ ॥ तद्धि रु॒द्रस्य॑ भाग॒धेय यँन्ति । ए॒षा वै रु॒द्रस्य॒
    दिक् । स्वाया॑मे॒व दि॒शि रु॒द्र न्नि॒रव॑दयते । रु॒द्रो वा अ॑प॒शुका॑या॒ आहु॑त्यै॒ नाति॑ष्ठत । अ॒सौ
    ते॑ प॒शुरिति॒ निर्दि॑शे॒द्य न्द्वि॒ष्यात् । यमे॒व द्वेष्टि॑ । तम॑स्मै प॒शु न्निर्दि॑शति । यदि॒ न द्वि॒ष्यात्
    । आ॒खुस्ते॑ प॒शुरिति॑ ब्रूयात् ॥ हि॒नस्ति॑ । नार॒ण्यान् । च॒तु॒ष्प॒थे जु॑होति । ए॒ष वा अ॑ग्नी॒ना म्पड्बी॑शो॒
    नाम॑ । अ॒ग्नि॒वत्ये॒व जु॑होति । म॒द्ध्य॒मेन॑ प॒र्णेन॑ जुहोति । स्रुग्घ्ये॑षा । अथो॒ खलु॑ । अ॒न्त॒मेनै॒व
    हो॑त॒व्य म् । अ॒न्त॒त ए॒व रु॒द्र ॥ ए॒ष ते॑ रुद्र भा॒ग ऽम्बि॑क॒येत्या॑ह । श॒रद्वा अ॒स्याम्बि॑का॒ स्वसा
    । तया॒ वा ए॒ष हि॑नस्ति । यग्ं हि॒नस्ति॑ । तयै॒वैनग्ं॑ स॒ह श॑मयति । भे॒ष॒ज ङ्गव॒ इत्या॑ह । याव॑न्त
    ए॒व ग्रा॒म्याः प॒शवः॑ । तेभ्यो॑ भेष॒ज म्ब रु॒द्रम॑दिम॒हीत्या॑ह । आ॒शिष॑मे॒वैतामाशा यँजामह॒ इत्या॑ह
    । मृ॒त्यो र्मु॑क्षीय॒ मा ऽमृता॒दिति॒ वावैतदा॑ह । उत्कि॑रन्ति । भग॑स्य लीफ्सन्ते । मूते॑ कृ॒त्वा ऽऽस॑जन्ति
    । यथा॒ जनं॑ ङ्क॒रोति॑ । ता॒दृगे॒वतत् । ए॒ष ते॑ रुद्र भा॒ग इत्या॑ह नि॒रव॑त्त्यै । अप्र॑तीक्ष॒माय॑न्ति
    । अ॒पः परि॑षिञ्चति । रु॒द्रस्या॒न्तर् हि॑त्यै । प्र वा ए॒ते ल्लो॒काच्च्य॑वन्ते । ये त्र्य॑म्बकै॒श्चर॑न्ति
    । आ॒दि॒त्य म्पुन॒रेत्य॒ निर्व॑पति । इ॒यं वाँ अदि॑तिः । अ॒स्यामे॒व प्रति॑ तिष्ठन्ति ॥ वैश्वदे॒वेन॒
    ता व॑रुणप्रघा॒सै ऋ॒तूने॒व षट्थ्स॑प्ततिः ॥ हरिः॑ ओम् ॥ ॥ कृष्ण यजुर्वेदीय तैत्तिरीय ब्राह्मणे प्रथमाष्टके
