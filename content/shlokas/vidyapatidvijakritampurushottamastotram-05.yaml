id: vidyapatidvijakritampurushottamastotram-05
category: stotram
name:
  english: vidyapatidvijakritampurushottamastotram 05
  devanagari: विद्यापतिद्विजकृतंपुरुषोत्तमस्तोत्रम् ०५
content:
  english: vidyapatidvijakritam purushottamastotram 5 sa tu viprastatra kunde snatva sarvatmana harim
    | pranamya duratashcaikamanastushtava cantare || 63|| aksharatitabhagavatkrishnanarayanaprabho | mukteshajivahridayaparatpara
    namo'stu te || 64|| sarvakarmasamaradhya yogasadhya namo'stu te | premapashavishayatma~stirthatma~ste
    namonamah || 65|| namastejahsvarupaya pavanaya namo namah | hutashanaya devaya hricchrayaya ca te
    namah || 66|| mantrasthaya jivanaya nirvanaya ca te namah | sarvanandapradatre te brahmeshaya namo
    namah || 67|| mayine tattvine murtimate vishvasasakshine | jishnave bahushirase kamaleshaya te namah
    || 68|| mamuddhara kripasindho trahi vasanaya'nvitam | indradyumnanripasyapi kuru sankalpapuranam
    || 69|| iti vidyapatih stutva omityevam jajapa ha | iti shrilakshminarayaniyasamhitayam prathame kritayugasantane
    584
  devanagari: विद्यापतिद्विजकृतं पुरुषोत्तमस्तोत्रम् ५ स तु विप्रस्तत्र कुण्डे स्नात्वा सर्वात्मना हरिम्
    । प्रणम्य दूरतश्चैकमनास्तुष्टाव चान्तरे ॥ ६३॥ अक्षरातीतभगवत्कृष्णनारायणप्रभो । मुक्तेशजीवहृदयपरात्पर
    नमोऽस्तु ते ॥ ६४॥ सर्वकर्मसमाराध्य योगसाध्य नमोऽस्तु ते । प्रेमपाशविषयात्मँस्तीर्थात्मँस्ते नमोनमः
    ॥ ६५॥ नमस्तेजःस्वरूपाय पावनाय नमो नमः । हुताशनाय देवाय हृच्छ्रयाय च ते नमः ॥ ६६॥ मन्त्रस्थाय जीवनाय
    निर्वाणाय च ते नमः । सर्वानन्दप्रदात्रे ते ब्रह्मेशाय नमो नमः ॥ ६७॥ मायिने तत्त्विने मूर्तिमते विश्वाससाक्षिणे
    । जिष्णवे बहुशिरसे कमलेशाय ते नमः ॥ ६८॥ मामुद्धर कृपासिन्धो त्राहि वासनयाऽन्वितम् । इन्द्रद्युम्ननृपस्यापि
    कुरु सङ्कल्पपूरणम् ॥ ६९॥ इति विद्यापतिः स्तुत्वा ओमित्येवं जजाप ह । इति श्रीलक्ष्मीनारायणीयसंहितायां
    प्रथमे कृतयुगसन्ताने ५८४
meaning: {}
