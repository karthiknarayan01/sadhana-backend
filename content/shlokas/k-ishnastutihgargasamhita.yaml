id: k-ishnastutihgargasamhita
category: stotram
name:
  english: kṟishnastutihgargasamhita
  devanagari: क्ऱिष्णस्तुतिःगर्गसम्हिता
content:
  english: krishnaya purnapurushaya paratparaya yajneshvaraya parakaranakaranaya | radhavaraya paripurnatamaya
    sakshadgolokadhamadhishanaya namah parasmai || 1|| yogeshvarah kila vadanti mahah param tvam tatraiva
    satvatamanah kritavigraham ca | asmabhiradya viditam yadado'dvayam te tasmai namo'stu mahasam pataye
    parasmai || 2|| vyangyena va na na hi lakshanaya kadapi sphotena yacca kavayo na vishanti mukhyah
    | nirdeshyabhavarahitah prakriteh param ca tvam brahma nirgunamalam sharanam vrajamah || 3|| tvam
    brahma kecidavayanti pare ca kalam kecitprashantamapare bhuvi karmarupam | purve ca yogamapare kila
    kartribhava
  devanagari: कृष्णाय पूर्णपुरुषाय परात्पराय यज्ञेश्वराय परकारणकारणाय । राधावराय परिपूर्णतमाय साक्षाद्गोलोकधामधिषणाय
    नमः परस्मै ॥ १॥ योगेश्वराः किल वदन्ति महः परं त्वां तत्रैव सात्वतमनाः कृतविग्रहं च । अस्माभिरद्य विदितं
    यददोऽद्वयं ते तस्मै नमोऽस्तु महसां पतये परस्मै ॥ २॥ व्यङ्ग्येन वा न न हि लक्षणया कदापि स्फोटेन यच्च
    कवयो न विशन्ति मुख्याः । निर्देश्यभावरहितः प्रकृतेः परं च त्वां ब्रह्म निर्गुणमलं शरणं व्रजामः ॥ ३॥
    त्वां ब्रह्म केचिदवयन्ति परे च कालं केचित्प्रशान्तमपरे भुवि कर्मरूपम् । पूर्वे च योगमपरे किल कर्तृभाव
meaning: {}
