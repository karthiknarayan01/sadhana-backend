id: kumarasubrahmanyamurtisahasranamastotra
category: sahasranama
name:
  english: kumarasubrahmanyamurtisahasranamastotra
  devanagari: कुमारसुब्रह्मण्यमूर्तिसहस्रनामस्तोत्र
content:
  english: divakarah ranarangaramaproktajayashravanakautukah | ahankritamanoduro daityatuladhananjayakh
