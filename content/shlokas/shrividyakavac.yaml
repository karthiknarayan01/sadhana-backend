id: shrividyakavac
category: kavacha
name:
  english: shrividyakavac
  devanagari: श्रीविद्याकवच्
content:
  english: shrividyakavacam athava shrishodashividyakavacam shriganeshaya namah | devyuvaca | devadeva
    mahadeva bhaktanam pritivardhanam | sucitam yanmahadevyah kavacam kathayasva me || 1|| mahadeva uvaca
    | shrunu devi pravakshyami kavacam devadurlabham | na prakashyam param guhyam sadhakabhishtasiddhidam
    || 2|| kavacasya rishirdevi dakshinamurtiravyayah | chandah panktih samuddishtam devi tripurasundari
    || 3|| dharmarthakamamokshanam viniyogastu sadhane | vagbhavah kamarajashca shaktirbijam sureshvari
    || 4|| aim vagbhavah patu shirshe mam klim kamarajastatha hridi | sauh shaktibijam sada patu nabhau
    guhye ca padayoh || 5|| aim shrim sauh vadane patu bala mam sarvasiddhaye | hsaum hasakalahrim hsauh
    patu bhairavi kanthadeshatah || 6|| sundari nabhideshe ca shirshe kamakala sada | bhrunasayorantarale
    mahatripurasundari || 7|| lalate subhaga patu bhaga mam kanthadeshatah | bhagodaya ca hridaye udare
    bhagasarpini || 8|| bhagamala nabhideshe linge patu manobhava | guhye patu mahadevi rajarajeshvari
    shiva || 9|| caitanyarupini patu padayorjagadambika | narayani sarvagatre sarvakarye shubhankari ||
    10|| brahmani patu mam purve dakshine vaishnavi tatha | pashcime patu varahi uttare tu maheshvari
    || 11|| agneyam patu kaumari mahalakshmistu nairrite | vayavyam patu camunda indrani patu ishake ||
    12|| jale patu mahamaya prithivyam sarvamangala | akashe patu varada sarvatra bhuvaneshvari || 13||
    idam tu kavacam devya devanamapi durlabham | pathetpratah samutthaya shucih prayatamanasah || 14||
    nadhayo vyadhayastasya na bhayam ca kvacidbhavet | na ca mari bhayam tasya patakanam bhayam tatha
    || 15|| na daridryavasham gacchettishthenmrityuvashe na ca | gacchecchivapuram devi satyam satyam
    vadamyaham || 16|| idam kavacamajnatva shrividyam yo japetsada | sa napnoti phalam tasya prapnuyacchastraghatanam
    || 17|| || iti shrisiddhayamale shrishodashividyakavacam sampurnam ||
  devanagari: श्रीविद्याकवचम् अथवा श्रीषोडशीविद्याकवचम् श्रीगणेशाय नमः । देव्युवाच । देवदेव महादेव भक्तानां
    प्रीतिवर्धनम् । सूचितं यन्महादेव्याः कवचं कथयस्व मे ॥ १॥ महादेव उवाच । श्रुणु देवि प्रवक्ष्यामि कवचं
    देवदुर्लभम् । न प्रकाश्यं परं गुह्यं साधकाभीष्टसिद्धिदम् ॥ २॥ कवचस्य ऋषिर्देवि दक्षिणामूर्तिरव्ययः
    । छन्दः पङ्क्तिः समुद्दिष्टं देवी त्रिपुरसुन्दरी ॥ ३॥ धर्मार्थकाममोक्षाणां विनियोगस्तु साधने । वाग्भवः
    कामराजश्च शक्तिर्बीजं सुरेश्वरि ॥ ४॥ ऐं वाग्भवः पातु शीर्षे मां क्लीं कामराजस्तथा हृदि । सौः शक्तिबीजं
    सदा पातु नाभौ गुह्ये च पादयोः ॥ ५॥ ऐं श्रीं सौः वदने पातु बाला मां सर्वसिद्धये । ह्सौं हसकलह्रीं ह्सौः
    पातु भैरवी कण्ठदेशतः ॥ ६॥ सुन्दरी नाभिदेशे च शीर्षे कामकला सदा । भ्रूनासयोरन्तराले महात्रिपुरसुन्दरी
    ॥ ७॥ ललाटे सुभगा पातु भगा मां कण्ठदेशतः । भगोदया च हृदये उदरे भगसर्पिणी ॥ ८॥ भगमाला नाभिदेशे लिङ्गे
    पातु मनोभवा । गुह्ये पातु महादेवी राजराजेश्वरी शिवा ॥ ९॥ चैतन्यरूपिणी पातु पादयोर्जगदम्बिका । नारायणी
    सर्वगात्रे सर्वकार्ये शुभङ्करी ॥ १०॥ ब्रह्माणी पातु मां पूर्वे दक्षिणे वैष्णवी तथा । पश्चिमे पातु
    वाराही उत्तरे तु महेश्वरी ॥ ११॥ आग्नेयां पातु कौमारी महालक्ष्मीस्तु नैरृते । वायव्यां पातु चामुण्डा
    इन्द्राणी पातु ईशके ॥ १२॥ जले पातु महामाया पृथिव्यां सर्वमङ्गला । आकाशे पातु वरदा सर्वत्र भुवनेश्वरी
    ॥ १३॥ इदं तु कवचं देव्या देवानामपि दुर्लभम् । पठेत्प्रातः समुत्थाय शुचिः प्रयतमानसः ॥ १४॥ नाधयो व्याधयस्तस्य
    न भयं च क्वचिद्भवेत् । न च मारी भयं तस्य पातकानां भयं तथा ॥ १५॥ न दारिद्र्यवशं गच्छेत्तिष्ठेन्मृत्युवशे
    न च । गच्छेच्छिवपुरं देवि सत्यं सत्यं वदाम्यहम् ॥ १६॥ इदं कवचमज्ञात्वा श्रीविद्यां यो जपेत्सदा । स
    नाप्नोति फलं तस्य प्राप्नुयाच्छस्त्रघातनम् ॥ १७॥ ॥ इति श्रीसिद्धयामले श्रीषोडशीविद्याकवचं सम्पूर्णम्
    ॥
