id: shriramanandavedantasarahsaketanivasacarya
category: shataka
name:
  english: shriramanandavedantasarahsaketanivasacarya
  devanagari: श्रीरामानन्दवेदान्तसारःसाकेतनिवासाचार्य
content:
  english: pranamya bhashyakrid ramanandam gurum ca raghavam | aushriramanandavedantasaram vakshye yathamati
    || 1|| tattvajnanam ca mokshe hi mumukshorhitakarakam | tadvijnanartha mityetacchruterarjyam ca tad
    guroh || 2|| pramanapratipanno'rtha budhaistattvam prakirttitam | tattvam ca dvividham proktam dravyadravyavibhedatah
    || 3|| tatra dravyamupadanamadrarvya tadvilakshanam | jajadavibhedacca dravyam dvidha matam budhaih
    || 4|| svayamprakashamajadam jadam tasmadvilakshanam | prakritikalabhedacca jadam tatra dvidha matam
    || 5|| vijneya prakritistatra samagunatrayashrayah | caturvimshatidha sa hi savayava mata budhaih
    || 6|| vikarotpadakatvat sa prakritiriti kathyate | avidya kathyate sa hi yato jnanavirodhini || 7||
    maya'bhidhiyate sa yat vicitrasrishtikarini | avyaktam seshvarecchatah karyonmukhi yada bhavet ||
    8|| mahadutpadyate'vyaktat tridha tad gunabhedatah | ahankarastridha tasmat satvikadivibhedatah ||
    9|| ekadashendriyani syuh satvikahankriteh kila | jnanakarmendriyatvabhyam dvidha tani matani hi ||
    10|| jnanaprasarane heturadimam shadvidham ca tat | manahshravanacakshustvagrasanaghranabhedatah ||
    11|| jnanendriyam sukhadeshca shabdadegrahakam matam | karmanyuccaranadau tu shaktam karmendriyam
    khalu || 12|| vakpanipadapayupasthabhedat pancadha ca tat | tamasahankriterjatam tanmatram shabdasamjnakam
    || 13|| tasmannabhastatah sparshatanmatram ca tato marud | tato rupam tatashcanirjalahetustato rasah
    || 14|| jalad gandhastato bhutam jayate kshitisamjnakam | etaih pancikritairbhutairandotpattirmata
    budhaih || 15|| tribhih sattvadibhirhino jadah kalataya matah | dvividhah sammatah kalashcakhandakhandabhedatah
    || 16|| tatrakhando vibhunityo bhutadibuddhikarakah | anityastu muhurttadya bhedah khandasya kirttitah
    || 17|| ajadam tu dvidha bodhyam parakpratyagvibhedatah | bhasamanam parasmai hi paraktattvam dvidha
    matam || 18|| tatra nityavibhutirhi shuddhasattvamayi mata | dharmabhutam ca yajjnanam tanmatashcaparah
    parak || 19|| acetanam matam jnanam shuddhasattvam ca panditah | pramanam tu shrutishcadye tripadasyamritam
    divi || 20|| mata nityavibhutih sa muktanam brahmanastaya | bhogyabhogopakaranabhogasthanamayi khalu
    || 21|| urdhvadeshe'paricchinna sa'dhastanna mata tatha | nitya caitanyahina ca sa''nandadipaderita
    || 22|| jnaturjneyavabhaso hi jnanatvena prakirttitah | dharmadharmivibhedaddhi jnanam dvidheti vakshyate
    || 23|| atmadharmataya bhati prabhavat tatra cadimam | satyam jnanami tishrutya jnanasya dravyata
    mata || 24|| na vijnaturi tishrutyam shruta jnanasya nityata | ishvare nityajiveshu jnanam nityam
    matam vibhu || 25|| karmavritam hi baddheshu mukteshu prak tadavritam | nashtotpannapratitistu sankocacca
    vikasatah || 26|| svape jnanatirodhanam tamovisheshasannidheh | jnane dravyatvasattve'pi prabheva
    gunata mata || 27|| vishayasatyatahetorjnane svatah pramanata | svanyanirvahakatvena suryavat svaprakashata
    || 28|| jivo'nushcetano vyapto jnanenakhilavarshmana | jhatiti tena janati sarvadehasukhadikam ||
    29|| dadhati yugapad yogi sharirani bahuni ca | yati lokantaram jiva ayatyatra tatah punah || 30||
    tato jivavibhutvam na manyate jnanibhirjanaih | jivatmanastato'nutvam doshahinam matam budhaih ||
    31|| adrishtam raghaveccheva sarvatra vyapakam hi tat | tatastat tat padarthastu tatra tatrodbhavanti
    ca || 32|| jivasya madhyame mane tvanityatvam ghatadivat | akritasya ca sampraptirnashastatha kritasya
    ca || 33|| atmanityatvavaktrinam shrutinam ca virodhita | anyadehe ca samprapte shaithilyamatmanashca
    hi || 34|| janamiti pratitya ca jivo jnanashrayo matah | shrutau jnanasvarupatvam varnitam pratyagatmanah
    || 35|| jnanadvayam matam tasmad dharmadharmiprabhedatah | ubhayorjnanayorvede varnita nityata'pi
    ca || 36|| ekanashe hi nashta syadindriyasanghajivata | ekaikasya tu jivatve tattannashe vinashita
    || 37|| mate dehasya jivatve vyabhicaro mrite bhavet | anityatvam bhavejjive dehena sadrisham tatha
    || 38|| mamandriyam tanuh prano buddhishcetipratititah | manyate natmanah prajnairindriyadisvarupata
    || 39|| shrutismrityo rajonitya mityevam nityata mata | pratyagatma'jadastasmaj jneyo jnata ca sammatah
    || 40|| sukhamasvaptamityetatpratitya sukharupakah | yatheshtaviniyogah shesho ramasya sheshinah ||
    41|| dharyatvacca niyamyatvadatma dehah paratmanah | bhinno jivo vibhoh svasya catmanah paramatmanah
    || 42|| tattvatpadoktayoraikyam parantaryaminoh khalu | tattvamasitivakye hi naikyam jiveshayormatam
    || 43|| prabhavatah prabhatulyo vishishtasya visheshavat | brahmanem'sho mato jivo jivasya brahmata
    na tat || 44|| pratibimbastvavidyayam jivashca brahmano nanu | maivam sidhyati navidya hyashrayanupapatitah
    || 45|| pratibimbe hi duhkhaderabhavajjivata na ca | maivam yat pratibimbo'sau vidvadbhirbimbavanmatah
    || 46|| iti vaktum na shakyam hi kutashceducyate yatah | sarvairlokairvilokyante jiva duhkhadisamyutah
    || 47|| na ca duhkhadayo bimbe nirvisheshe tu brahmani | pratibimbe na jivatvam tasmat sambhavenna
    hi || 48|| kim ca rupavihinasya pratibimbo na jayate | drishyate pratibimbo nu rupahinavihayasah ||
    49|| maivam yat pratibimbo'sau prakashadermato budhaih | kuto nirupavayoshca pratibimbo na drishyate
    || 50|| paricchinnavidhoreva pratibimbo jale khalu | pratibimbah katham jivo'paricchinnasya brahmanah
    || 51|| pratibimbo'sti jivashcedekadeshasya brahmanah | hanta tada hyanityatvam samshatvad brahmano
    bhavet || 52|| avidyaya'dvitiyatvam nashyati brahmano yatah | nato'vacchedika'vidya jivabhave tu brahmanah
    || 53|| brahmano bhedashunyatvajjivasya na vivarttata | sarpabhramo na sarpe hi kintu rajjau budhairmatah
    || 54|| acaryasarvabhaumena ramanandena dhimata | vedantadarshananandabhashye jivastridha matah ||
    55|| baddha muktastatha nitya baddha baddhashca karmana | ramabrahmanukampatah punyat satamanugrahad
    || 56|| mumuksha jayate bhavya jivasya hridaye shucau | tada satsangatim kurvan gurum casau prapadyate
    || 57|| ramapadaprapanno'sau tato gurumukhad bhavet | shrimadramaprapattya ca chinnamayanvayastatah
    || 58|| tato'rciradimargam ca yati hardanukampaya | tatashca virajasnanad divyadeho bhaveddhi sah
    || 59|| sakete ca samapnoti ramam brahma paratparam | svam rupam tatra samprapya ramam canubhavatyapi
    || 60|| bhogasamyamavapnoti ramasya brahmanastada | tato navarttate mukto mrityuloke'tha karhicit
    || 61|| mamupetya tu kaunteya punarjanma na vidyate | ityetad bhagavadvakyam pramanam tatra casti
    hi || 62|| sarvalokagatau shakto muktah srishtyadivarjitah | samsaritam ca na prapta nitya hanumadadayah
    || 63|| ishvaro brahma ramashca shabda hyekarthabodhakah | tatra vedantibhishcoktam brahma hi vibhu
    cetanam || 64|| mahantam vibhumi tyevam vibhutvam brahmanah shrutau | vibhu brahma svarupena svabhavacca
    matam budhaih || 65|| jnah kalakala ityevam shrutam brahma hi cetanam | vedaham samatitani ityuktavapi
    tadrisham || 66|| kalasya vibhutayam cacetanatvanna brahmata | jivasya cetanatve'pi brahmata navibhutvatah
    || 67|| sada doshavihinashca svata eva hi raghavah | svatah so'tha mato nityam kalyanagunasagarah
    || 68|| rame'pahatapapme ti heya guna hi varjitah | shrutastu satyakamashce tyevam divya gunah khalu
    || 69|| ete canye ca bhagavan nitya yatra mahagunah | ityevam ramacandrasya gunanam nityata mata ||
    70|| svabhaviki tivedokteh svabhavika harergunah | brahmasvabhavo navidya te'vidyopadhika na tat ||
    71|| tadyatha rathasyareshu ityadishrutimanatah | sarvadharo mato ramah pranakhyah parameshvarah ||
    72|| sa bhagava kasminne tacchrutivakyapramanatah | sve mahimni sthitvaddhi ramadharo na kashcana
    || 73|| cidacidam ca sarvesham niyantritvam nirankusham | antarabahyabhedabhyam dvidha tat paramatmanah
    || 74|| antaryamitaya cadyam shrutya smritya'ntimam matam | esha sarveshvarah esho'ntaryami ti shruteshca
    hi || 75|| pradhanakshetrajnapatih ityetacchrutimanatah | ramashesha matah sarve sarvasheshi ca raghavah
    || 76|| sarvandehakata rame sarvatme ti shrutau shruta | jagat sarvam shariram te itivakye ca brahmanah
    || 77|| taccaitanyaprithaksiddhadravyam hi tattanuh kila | ramam prati tatha bhutah sarve ramatanurmatah
    || 78|| sarvakarmasamaradhyah sarvakarmaphalapradah | sarvadehashca sarvastho rama eva na caparah
    || 79|| yato ve yadirupena brahmani nikhilatmani | bhriguvallyam shruta rame jagajjanmadihetuta ||
    80|| upadanam nimittam ca jagato rama eva hi | nimittantarasadbhave kupyedadvayatashrutih || 81||
    vaidikam sammatam prajnai rame ca hetutadvayam | srishtyadau hi shrutavuktamurnanabhinidarshanam ||
    82|| upadanam yatha hyatma nimittam ca sukham prati | tathopadanata rame jagatashca nimittata || 83||
    sukshmaciccidvishishto hi ramo vishvasya karanam | sthulaciccidvishishtashca shriramo jagadatmakah
    || 84|| abhedashcanayoryasmat karyakaranabrahmanoh | vishishtadvaita siddhantah sammato vaidikaistatah
    || 85|| bhedasya vadikashcathabhedasya vadikah khalu | sangatah shrutayashcatra siddhante yuktayastatha
    || 86|| sadvarakamupadanam jagato raghavo yatah | tato vikaradoshasya shrirame sambhavo na hi || 87||
    ramo vishvasya hetutvannirvishesho na sammatah | samadhikanishedhat sa na mayopadhiko matah || 88||
    tameva viditva cetadvedavakyapramanatah | mumukshunamupasyashca shriramah sakaleshvarah || 89|| rukmavarnamitishrutya
    ramo'laukika vigrahah | divyarupadivaishishtyam
  devanagari: प्रणम्य भाष्यकृद् रामानन्दं गुरुं च राघवम् । औश्रीरामानन्दवेदान्तसारं वक्ष्ये यथामति ॥ १॥
    तत्त्वज्ञानं च मोक्षे हि मुमुक्षोर्हितकारकम् । तद्विज्ञानर्था मित्येतच्छ्रुतेरर्ज्यं च तद् गुरोः ॥
    २॥ प्रमाणप्रतिपन्नोऽर्थ बुधैस्तत्त्वं प्रकीर्त्तितम् । तत्त्वं च द्विविधं प्रोक्तं द्रव्याद्रव्यविभेदतः
    ॥ ३॥ तत्र द्रव्यमुपादानमद्रर्व्य तद्विलक्षणम् । जाजडविभेदाच्च द्रव्यं द्विधा मतं बुधैः ॥ ४॥ स्वयम्प्रकाशमजडं
    जडं तस्माद्विलक्षणम् । प्रकृतिकालभेदाच्च जडं तत्र द्विधा मतम् ॥ ५॥ विज्ञेया प्रकृतिस्तत्र समगुणत्रयाश्रयः
    । चतुर्विंशतिधा सा हि सावयवा मता बुधैः ॥ ६॥ विकारोत्पादकत्वात् सा प्रकृतिरिति कथ्यते । अविद्या कथ्यते
    सा हि यतो ज्ञानविरोधिनी ॥ ७॥ मायाऽभिधीयते सा यत् विचित्रसृष्टिकारिणी । अव्यक्तं सेश्वरेच्छातः कार्योन्मुखी
    यदा भवेत् ॥ ८॥ महदुत्पद्यतेऽव्यक्तात् त्रिधा तद् गुणभेदतः । अहङ्कारस्त्रिधा तस्मात् सात्विकादिविभेदतः
    ॥ ९॥ एकादशेन्द्रियाणि स्युः सात्विकाहङ्कृतेः किल । ज्ञानकर्मेन्द्रियत्वाभ्यां द्विधा तानि मतानि हि
    ॥ १०॥ ज्ञानप्रसरणे हेतुरादिमं षड्विधं च तत् । मनःश्रवणचक्षुस्त्वग्रसनघ्राणभेदतः ॥ ११॥ ज्ञानेन्द्रियं
    सुखादेश्च शब्दादेग्रहकं मतम् । कर्मण्युच्चारणादौ तु शक्तं कर्मेन्द्रियं खलु ॥ १२॥ वाक्पाणिपादपायूपस्थभेदात्
    पञ्चधा च तत् । तामसाहङ्कृतेर्जातं तन्मात्रं शब्दसंज्ञकम् ॥ १३॥ तस्मान्नभस्ततः स्पर्शतन्मात्रं च ततो
    मरुद् । ततो रूपं ततश्चानिर्जलहेतुस्ततो रसः ॥ १४॥ जलाद् गन्धस्ततो भूतं जायते क्षितिसंज्ञकम् । एतैः
    पञ्चीकृतैर्भूतैरण्डोत्पत्तिर्मता बुधैः ॥ १५॥ त्रिभिः सत्त्वादिभिर्हीनो जडः कालतया मतः । द्विविधः सम्मतः
    कालश्चाखण्डाखण्डभेदतः ॥ १६॥ तत्राखण्डो विभुनित्यो भूतादिबुद्धिकारकः । अनित्यास्तु मुहूर्त्ताद्या भेदाः
    खण्डस्य कीर्त्तिताः ॥ १७॥ अजडं तु द्विधा बोध्यं पराक्प्रत्यग्विभेदतः । भासमानं परस्मै हि पराक्तत्त्वं
    द्विधा मतम् ॥ १८॥ तत्र नित्यविभूतिर्हि शुद्धसत्त्वमयी मता । धर्मभूतं च यज्ज्ञानं तन्मतश्चापरः पराक्
    ॥ १९॥ अचेतनं मतं ज्ञानं शुद्धसत्त्वं च पण्डितः । प्रमाणं तु श्रुतिश्चाद्ये त्रिपादस्यामृतं दिवि ॥
    २०॥ मता नित्यविभूतिः सा मुक्तानां ब्रह्मणस्तया । भोग्यभोगोपकरणभोगस्थानमयी खलु ॥ २१॥ ऊर्ध्वदेशेऽपरिच्छिन्ना
    साऽधस्तान्न मता तथा । नित्या चैतन्यहीना च साऽऽनन्दादिपदेरिता ॥ २२॥ ज्ञातुर्ज्ञेयावभासो हि ज्ञानत्वेन
    प्रकीर्त्तितः । धर्मधर्मिविभेदाद्धि ज्ञानं द्विधेति वक्ष्यते ॥ २३॥ आत्मधर्मतया भाति प्रभावत् तत्र
    चादिमम् । सत्यं ज्ञानमि तिश्रुत्या ज्ञानस्य द्रव्यता मता ॥ २४॥ न विज्ञातुरि तिश्रुत्यां श्रुता ज्ञानस्य
    नित्यता । ईश्वरे नित्यजीवेषु ज्ञानं नित्यं मतं विभु ॥ २५॥ कर्मावृतं हि बद्धेषु मुक्तेषु प्राक् तदावृतम्
    । नष्टोत्पन्नप्रतीतिस्तु सङ्कोचाच्च विकासतः ॥ २६॥ स्वापे ज्ञानतिरोधानं तमोविशेषसन्निधेः । ज्ञाने द्रव्यत्वसत्त्वेऽपि
    प्रभेव गुणता मता ॥ २७॥ विषयसत्यताहेतोर्ज्ञाने स्वतः प्रमाणता । स्वान्यनिर्वाहकत्वेन सूर्यवत् स्वप्रकाशता
    ॥ २८॥ जीवोऽणुश्चेतनो व्याप्तो ज्ञानेनाखिलवर्ष्मण । झटिति तेन जानाति सर्वदेहसुखादिकम् ॥ २९॥ दधाति युगपद्
    योगी शरीराणि बहूनि च । याति लोकान्तरं जीव आयात्यत्र ततः पुनः ॥ ३०॥ ततो जीवविभुत्वं न मन्यते ज्ञानिभिर्जनैः
    । जीवात्मनस्ततोऽणुत्वं दोषहीनं मतं बुधैः ॥ ३१॥ अदृष्टं राघवेच्छेव सर्वत्र व्यापकं हि तत् । ततस्तत्
    तत् पदार्थास्तु तत्र तत्रोद्भवन्ति च ॥ ३२॥ जीवस्य मध्यमे माने त्वनित्यत्वं घटादिवत् । अकृतस्य च सम्प्राप्तिर्नाशस्तथा
    कृतस्य च ॥ ३३॥ आत्मनित्यत्ववक्त्रीणां श्रुतीनां च विरोधिता । अन्यदेहे च सम्प्राप्ते शैथिल्यमात्मनश्च
    हि ॥ ३४॥ जानामीति प्रतीत्या च जीवो ज्ञानाश्रयो मतः । श्रुतौ ज्ञानस्वरूपत्वं वर्णितं प्रत्यगात्मनः
    ॥ ३५॥ ज्ञानद्वयं मतं तस्माद् धर्मधर्मिप्रभेदतः । उभयोर्ज्ञानयोर्वेदे वर्णिता नित्यताऽपि च ॥ ३६॥ एकनाशे
    हि नष्टा स्यादिन्द्रियसङ्घजीवता । एकैकस्य तु जीवत्वे तत्तन्नाशे विनाशिता ॥ ३७॥ मते देहस्य जीवत्वे
    व्यभिचारो मृते भवेत् । अनित्यत्वं भवेज्जीवे देहेन सदृशं तथा ॥ ३८॥ ममन्द्रियं तनुः प्राणो बुद्धिश्चेतिप्रतीतितः
    । मन्यते नात्मनः प्राज्ञैरिन्द्रियादिस्वरूपता ॥ ३९॥ श्रुतिस्मृत्यो रजोनित्य मित्येवं नित्यता मता ।
    प्रत्यगात्माऽजडस्तस्माज् ज्ञेयो ज्ञाता च सम्मतः ॥ ४०॥ सुखमस्वाप्तमित्येतत्प्रतीत्या सुखरूपकः । यथेष्टविनियोगः
    शेषो रामस्य शेषिणः ॥ ४१॥ धार्यत्वाच्च नियाम्यत्वादात्मा देहः परात्मनः । भिन्नो जीवो विभोः स्वस्य चात्मनः
    परमात्मनः ॥ ४२॥ तत्त्वत्पदोक्तयोरैक्यं परान्तर्यामिणोः खलु । तत्त्वमसीतिवाक्ये हि नैक्यं जीवेशयोर्मतम्
    ॥ ४३॥ प्रभावतः प्रभातुल्यो विशिष्टस्य विशेषवत् । ब्रह्मणेंऽशो मतो जीवो जीवस्य ब्रह्मता न तत् ॥ ४४॥
    प्रतिबिम्बस्त्वविद्यायां जीवश्च ब्रह्मणो ननु । मैवं सिध्यति नाविद्या ह्याश्रयानुपपतितः ॥ ४५॥ प्रतिबिम्बे
    हि दुःखादेरभावाज्जीवता न च । मैवं यत् प्रतिबिम्बोऽसौ विद्वद्भिर्बिम्बवन्मतः ॥ ४६॥ इति वक्तुं न शक्यं
    हि कुतश्चेदुच्यते यतः । सर्वैर्लोकैर्विलोक्यन्ते जीवा दुःखादिसंयुताः ॥ ४७॥ न च दुःखादयो बिम्बे निर्विशेषे
    तु ब्रह्मणि । प्रतिबिम्बे न जीवत्वं तस्मात् सम्भवेन्न हि ॥ ४८॥ किं च रूपविहीनस्य प्रतिबिम्बो न जायते
    । दृश्यते प्रतिबिम्बो नु रूपहीनविहायसः ॥ ४९॥ मैवं यत् प्रतिबिम्बोऽसौ प्रकाशादेर्मतो बुधैः । कुतो नीरूपवायोश्च
    प्रतिबिम्बो न दृश्यते ॥ ५०॥ परिच्छिन्नविधोरेव प्रतिबिम्बो जले खलु । प्रतिबिम्बः कथं जीवोऽपरिच्छिन्नस्य
    ब्रह्मणः ॥ ५१॥ प्रतिबिम्बोऽस्ति जीवश्चेदेकदेशस्य ब्रह्मणः । हन्त तदा ह्यनित्यत्वं सांशत्वाद् ब्रह्मणो
    भवेत् ॥ ५२॥ अविद्ययाऽद्वितीयत्वं नश्यति ब्रह्मणो यतः । नातोऽवच्छेदिकाऽविद्या जीवभावे तु ब्रह्मणः ॥
    ५३॥ ब्रह्मणो भेदशून्यत्वाज्जीवस्य न विवर्त्तता । सर्पभ्रमो न सर्पे हि किन्तु रज्जौ बुधैर्मतः ॥ ५४॥
    आचार्यसार्वभौमेन रामानन्देन धीमता । वेदान्तदर्शनानन्दभाष्ये जीवास्त्रिधा मताः ॥ ५५॥ बद्धा मुक्तास्तथा
    नित्या बद्धा बद्धाश्च कर्मणा । रामब्रह्मानुकम्पातः पुण्यात् सतामनुग्रहाद् ॥ ५६॥ मुमुक्षा जायते भव्या
    जीवस्य हृदये शुचौ । तदा सत्सङ्गतिं कुर्वन् गुरुं चासौ प्रपद्यते ॥ ५७॥ रामपादप्रपन्नोऽसौ ततो गुरुमुखाद्
    भवेत् । श्रीमद्रामप्रपत्त्या च छिन्नमायान्वयस्ततः ॥ ५८॥ ततोऽर्चिरादिमार्गं च याति हार्दानुकम्पया ।
    ततश्च विरजास्नानाद् दिव्यदेहो भवेद्धि सः ॥ ५९॥ साकेते च समाप्नोति रामं ब्रह्म परात्परम् । स्वं रूपं
    तत्र सम्प्राप्य रामं चानुभवत्यपि ॥ ६०॥ भोगसाम्यमवाप्नोति रामस्य ब्रह्मणस्तदा । ततो नावर्त्तते मुक्तो
    मृत्युलोकेऽथ कर्हिचित् ॥ ६१॥ मामुपेत्य तु कौन्तेय पुनर्जन्म न विद्यते । इत्येतद् भगवद्वाक्यं प्रमाणं
    तत्र चास्ति हि ॥ ६२॥ सर्वलोकगतौ शक्तो मुक्तः सृष्ट्यादिवर्जितः । संसारितां च न प्राप्ता नित्या हनुमादादयः
    ॥ ६३॥ ईश्वरो ब्रह्म रामश्च शब्दा ह्येकार्थबोधकाः । तत्र वेदान्तिभिश्चोक्तं ब्रह्म हि विभु चेतनम् ॥
    ६४॥ महान्तं विभुमि त्येवं विभुत्वं ब्रह्मणः श्रुतौ । विभु ब्रह्म स्वरूपेण स्वभावाच्च मतं बुधैः ॥ ६५॥
    ज्ञः कालकाल इत्येवं श्रुतं ब्रह्म हि चेतनम् । वेदाहं समतीतानि इत्युक्तावपि तादृशम् ॥ ६६॥ कालस्य विभुतायां
    चाचेतनत्वान्न ब्रह्मता । जीवस्य चेतनत्वेऽपि ब्रह्मता नाविभुत्वतः ॥ ६७॥ सदा दोषविहीनश्च स्वत एव हि
    राघवः । स्वतः सोऽथ मतो नित्यं कल्याणगुणसागरः ॥ ६८॥ रामेऽपहतपाप्मे ति हेया गुणा हि वर्जिताः । श्रुतास्तु
    सत्यकामश्चे त्येवं दिव्या गुणाः खलु ॥ ६९॥ एते चान्ये च भगवन् नित्या यत्र महागुणाः । इत्येवं रामचन्द्रस्य
    गुणानां नित्यता मता ॥ ७०॥ स्वाभाविकी तिवेदोक्तेः स्वाभाविका हरेर्गुणाः । ब्रह्मस्वभावो नाविद्या तेऽविद्योपाधिका
    न तत् ॥ ७१॥ तद्यथा रथस्यारेषु इत्यादिश्रुतिमानतः । सर्वाधारो मतो रामः प्राणाख्यः परमेश्वरः ॥ ७२॥ स
    भगव कस्मिन्ने तच्छ्रुतिवाक्यप्रमाणतः । स्वे महिम्नि स्थित्वाद्धि रामाधारो न कश्चन ॥ ७३॥ चिदचिदां च
    सर्वेषां नियन्तृत्वं निरङ्कुशम् । आन्तरबाह्यभेदाभ्यां द्विधा तत् परमात्मनः ॥ ७४॥ अन्तर्यामितया चाद्यं
    श्रुत्या स्मृत्याऽन्तिमं मतम् । एष सर्वेश्वरः एषोऽन्तर्यामी ति श्रुतेश्च हि ॥ ७५॥ प्रधानक्षेत्रज्ञपतिः
    इत्येतच्छ्रुतिमानतः । रामशेषा मताः सर्वे सर्वशेषी च राघवः ॥ ७६॥ सर्वन्देहकता रामे सर्वात्मे ति श्रुतौ
    श्रुता । जगत् सर्वं शरीरं ते इतिवाक्ये च ब्रह्मणः ॥ ७७॥ तच्चैतन्यापृथक्सिद्धद्रव्यं हि तत्तनुः किल
    । रामं प्रति तथा भूताः सर्वे रामतनुर्मताः ॥ ७८॥ सर्वकर्मसमाराध्यः सर्वकर्मफलप्रदः । सर्वदेहश्च सर्वस्थो
    राम एव न चापरः ॥ ७९॥ यतो वे यादिरूपेण ब्रह्मणि निखिलात्मनि । भृगुवल्ल्यां श्रुता रामे जगज्जन्मादिहेतुता
    ॥ ८०॥ उपादानं निमित्तं च जगतो राम एव हि । निमित्तान्तरसद्भावे कुप्येदद्वयताश्रुतिः ॥ ८१॥ वैदिकं सम्मतं
    प्राज्ञै रामे च हेतुताद्वयम् । सृष्ट्यादौ हि श्रुतावुक्तमूर्णनाभिनिदर्शनम् ॥ ८२॥ उपादानं यथा ह्यात्मा
    निमित्तं च सुखं प्रति । तथोपादानता रामे जगतश्च निमित्तता ॥ ८३॥ सूक्ष्माचिच्चिद्विशिष्टो हि रामो विश्वस्य
    कारणम् । स्थूलाचिच्चिद्विशिष्टश्च श्रीरामो जगदात्मकः ॥ ८४॥ अभेदश्चानयोर्यस्मात् कार्यकारणब्रह्मणोः
    । विशिष्टाद्वैत सिद्धान्तः सम्मतो वैदिकैस्ततः ॥ ८५॥ भेदस्य वादिकाश्चाथाभेदस्य वादिकाः खलु । सङ्गताः
    श्रुतयश्चात्र सिद्धान्ते युक्तयस्तथा ॥ ८६॥ सद्वारकमुपादानं जगतो राघवो यतः । ततो विकारदोषस्य श्रीरामे
    सम्भवो न हि ॥ ८७॥ रामो विश्वस्य हेतुत्वान्निर्विशेषो न सम्मतः । समाधिकनिषेधात् स न मायोपाधिको मतः
    ॥ ८८॥ तमेव विदित्वा चेतद्वेदवाक्यप्रमाणतः । मुमुक्षूणामुपास्यश्च श्रीरामः सकलेश्वरः ॥ ८९॥ रुक्मवर्णमितिश्रुत्या
    रामोऽलौकिक विग्रहः । दिव्यरूपादिवैशिष्ट्यं
