id: prahladakritamdevistotram
category: stotram
name:
  english: prahladakritamdevistotram
  devanagari: प्रह्लादकृतंदेवीस्तोत्रम्
content:
  english: prahladakritam devistotram prahlada uvaca | staumi devim mahamayam srishtisthityantakarinim
    | sarvesham jananim shaktim bhaktanamabhayankarim || 32|| vyasa uvaca | ityuktva vishnubhaktastu prahladah
    paramarthavit | tushtava jagatam dhatrim kritanjaliputastada || 33|| malasarpavadabhati yasyam sarvam
    caracaram | sarvadhishthanarupayai tasyai hrimmurtaye namah || 34|| tvattah sarvamidam vishvam sthavaram
    jangamam tatha | anye nimittamatraste kartarastava nirmitah || 35|| namo devi mahamaye sarvesham janani
    smrita | ko bhedastava deveshu daityeshu svakriteshu ca || 36|| matuh putreshu ko bhedo'pyashubheshu
    shubheshu ca | tathaiva deveshvasmasu na kartavyastvayadhuna || 37|| yadrishastadrisha matah sutaste
    danavah kila | yatastvam vishvajanani puraneshu prakirtita || 38|| te'pi svarthapara nunam yathaiva
    vayamapyuta | nantaram daityasurayorbhedo'yam mohasambhavah || 39|| dhanadaradibhogeshu vayam sakta
    divanisham | tathaiva deva deveshi ko bhedo'suradevayoh || 40|| te'pi kashyapadayada vayam tatsambhavah
    kila | kuto virodhasambhutirjata matastavadhuna || 41|| na tatha vihitam matastvayi sarvasamudbhave
    | samyataiva tvaya sthapya deveshvasmasu caiva hi || 42|| gunavyatikaratsarve samutpannah surasurah
    | gunanvita bhaveyuste katham dehabhrito'marah || 43|| kamah krodhashca lobhashca sarvadeheshu samsthitah
    | vartante sarvada tasmat ko'virodhi bhavencanah || 44|| tvaya mitho virodho'yam kalpitah kila kautukat
    | manyamahe vibhedena nunam yuddhadidrikshaya || 45|| anyatha khalu bhratrinam virodhah kidrisho'naghe
    | tvam cennecchasi camunde vikshitum kalaham kila || 46|| janami dharmam dharmajne vedmi caham shatakratum
    | tathapi kalaho'smakam bhogartham devi sarvada || 47|| ekah ko'pi na shastasti samsare tvam vinambike
    | sprihavatastu kah kartum kshamate vacanam budhah || 48|| devasurairayam sindhurmathitah samaye kvacit
    | vishnuna vihito bhedah sudharatnacchalena vai || 49|| tvayasau kalpitah shaurih palakatve jagadguruh
    | tena lakshmih svayam lobhadgrihitamarasundari || 50|| airavatastathendrena parijato'tha kamadhuk
    | uccaihshravah suraih sarvam grihitam vaishnavecchaya || 51|| anayam tadrisham kritva jata devastu
    sadhavah |
  devanagari: प्रह्लादकृतं देवीस्तोत्रम् प्रह्लाद उवाच । स्तौमि देवीं महामायां सृष्टिस्थित्यन्तकारिणीम्
    । सर्वेषां जननीं शक्तिं भक्तानामभयङ्करीम् ॥ ३२॥ व्यास उवाच । इत्युक्त्वा विष्णुभक्तस्तु प्रह्लादः
    परमार्थवित् । तुष्टाव जगतां धात्रीं कृताञ्जलिपुटस्तदा ॥ ३३॥ मालासर्पवदाभाति यस्यां सर्वं चराचरम् ।
    सर्वाधिष्ठानरूपायै तस्यै ह्रीम्मूर्तये नमः ॥ ३४॥ त्वत्तः सर्वमिदं विश्वं स्थावरं जङ्गमं तथा । अन्ये
    निमित्तमात्रास्ते कर्तारस्तव निर्मिताः ॥ ३५॥ नमो देवि महामाये सर्वेषां जननी स्मृता । को भेदस्तव देवेषु
    दैत्येषु स्वकृतेषु च ॥ ३६॥ मातुः पुत्रेषु को भेदोऽप्यशुभेषु शुभेषु च । तथैव देवेष्वस्मासु न कर्तव्यस्त्वयाधुना
    ॥ ३७॥ यादृशास्तादृशा मातः सुतास्ते दानवाः किल । यतस्त्वं विश्वजननी पुराणेषु प्रकीर्तिता ॥ ३८॥ तेऽपि
    स्वार्थपरा नूनं यथैव वयमप्युत । नान्तरं दैत्यसुरयोर्भेदोऽयं मोहसम्भवः ॥ ३९॥ धनदारादिभोगेषु वयं सक्ता
    दिवानिशम् । तथैव देवा देवेशि को भेदोऽसुरदेवयोः ॥ ४०॥ तेऽपि कश्यपदायादा वयं तत्सम्भवाः किल । कुतो विरोधसम्भूतिर्जाता
    मातस्तवाधुना ॥ ४१॥ न तथा विहितं मातस्त्वयि सर्वसमुद्भवे । साम्यतैव त्वया स्थाप्या देवेष्वस्मासु चैव
    हि ॥ ४२॥ गुणव्यतिकरात्सर्वे समुत्पन्नाः सुरासुराः । गुणान्विता भवेयुस्ते कथं देहभृतोऽमराः ॥ ४३॥ कामः
    क्रोधश्च लोभश्च सर्वदेहेषु संस्थिताः । वर्तन्ते सर्वदा तस्मात् कोऽविरोधी भवेञ्चनः ॥ ४४॥ त्वया मिथो
    विरोधोऽयं कल्पितः किल कौतुकात् । मन्यामहे विभेदेन नूनं युद्धदिदृक्षया ॥ ४५॥ अन्यथा खलु भ्रातॄणां विरोधः
    कीदृशोऽनघे । त्वं चेन्नेच्छसि चामुण्डे वीक्षितुं कलहं किल ॥ ४६॥ जानामि धर्मं धर्मज्ञे वेद्मि चाहं
    शतक्रतुम् । तथापि कलहोऽस्माकं भोगार्थं देवि सर्वदा ॥ ४७॥ एकः कोऽपि न शास्तास्ति संसारे त्वां विनाम्बिके
    । स्पृहावतस्तु कः कर्तुं क्षमते वचनं बुधः ॥ ४८॥ देवासुरैरयं सिन्धुर्मथितः समये क्वचित् । विष्णुना
    विहितो भेदः सुधारत्नच्छलेन वै ॥ ४९॥ त्वयासौ कल्पितः शौरिः पालकत्वे जगद्गुरुः । तेन लक्ष्मीः स्वयं
    लोभाद्गृहीतामरसुन्दरी ॥ ५०॥ ऐरावतस्तथेन्द्रेण पारिजातोऽथ कामधुक् । उच्चैःश्रवाः सुरैः सर्वं गृहीतं
    वैष्णवेच्छया ॥ ५१॥ अनयं तादृशं कृत्वा जाता देवास्तु साधवः ।
