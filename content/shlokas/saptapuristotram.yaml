id: saptapuristotram
category: stotram
name:
  english: saptapuristotram
  devanagari: सप्तपुरीस्तोत्रम्
content:
  english: 76 sya ayodhye ramapadasupunite'mritatvada | bhuyo mastu mamavritti purishu sarayuvate || 1||
    adhyananmathure te me sadvaso'stu nirantaram | ramakrishnanghrisampute varade yamunavate || 2|| prithumargaprada
    maye bhava bhagirathivrite | varasi tvam haridvaram sutirtham pravadanti hi || 3|| mamagham hara kashi
    tvamuccaissamanikarnike | bhuyanna me punarjanma bhavapadancite bhave || 4|| sa kancinagari mahyatrasaha
    shivavishnupuh | ashihpradadya mam kritva luptainasamavatviyam || 5|| lokantaranapeksham mam mata
    kaleshvaradrita | nacirnatapasam patu mam mohatkshiprayadrita || 6|| syaanantashraye me'dya mokshada
    sindhutirage | tvam vandyasyakhilaih sarvaprada dvaravatishvari || 7|| ya tiradrajadhanyadyam naya
    krishnatatasthite | lokatmakhyamahustvam loka nrisimhavatikam || 8|| karmabhirnrityanti narastatsi
    mayakhyabandhanam | hanti yastadvatikeyam sarvesham hitada sada || 9|| sya a yodhye ramapada su pu
    nite'mritatvada | bhu yo mastu mamavritti pu ri shu sarayuvrite || 1|| a dhya nanmathure te me sa
    dva so'stu nirantaram | ra ma krishnanghrisampate va ra de yamunavrite || 2|| pri thu margaprada maye
    bha va bhagirathivrite | va ra si tvam haridvaram su ti rtham pravadanti hi || 3|| ma ma gham hara
    kashi tva muc cai ssamanikarnike | bhu ya nna me punarjanma bha va padancite bhave || 4|| sa ka ncinagari
    mahya tra sa ha shivavishnupuh | a shih pradadya mam kritva lu ptai nasamavatviyam || 5|| lo kam taranapeksham
    mam ma ta kaleshvaradrita || na ci rnatapasam patu mam mo hatkshiprayadrita || 6|| sya a nantashraye
    me'dya mo ksha da sindhutirage | tvam vam dyasyakhilaih sarvapra da dvaravatishvari || 7|| ya ti radrajadhanyadyam
    na ya krishnatatasthite | lo ka tmakhyamahustvam lo ka nrisimhavatikam || 8|| karmabhirnrityanti narastatsi
    mayakhyabandhanam | hanti yastadvatikeyam sarvesham hitada sada || 9|| iti shrivasudevanandasarasvativiracitam
    nrisimhavatikanvitasaptapuristotram sampurnam |
  devanagari: ७६ स्या अयोध्ये रामपादसुपुनीतेऽमृतत्वदा । भूयो मास्तु ममावृत्ति पुरीषु सरयूवते ॥ १॥ आध्यानान्मथुरे
    ते मे सद्वासोऽस्तु निरन्तरम् । रामकृष्णाङ्घ्रिसम्पूते वरदे यमुनावते ॥ २॥ पृथुमार्गप्रदा माये भव भागीरथीवृते
    । वरासि त्वां हरिद्वारं सुतीर्थं प्रवदन्ति हि ॥ ३॥ ममाघं हर काशि त्वमुच्चैस्समणिकर्णिके । भूयान्न
    मे पुनर्जन्म भवपादाञ्चिते भवे ॥ ४॥ सा काञ्चीनगरी मह्यत्रासहा शिवविष्णुपूः । आशीःप्रदाद्य मां कृत्वा
    लुप्तैनसमवत्वियम् ॥ ५॥ लोकान्तरानपेक्षं मां मता कालेश्वरादृता । नाचीर्णतपसं पातु मां मोहात्क्षिप्रयादृता
    ॥ ६॥ स्याअनन्ताश्रये मेऽद्य मोक्षदा सिन्धुतीरगे । त्वं वन्द्यास्यखिलैः सर्वप्रदा द्वारवतीश्वरी ॥ ७॥
    य तिराड्राजधान्याद्यं नय कृष्णातटस्थिते । लोकात्माख्यमाहुस्त्वां लोका नृसिंहवाटिकाम् ॥ ८॥ कर्मभिर्नृत्यन्ति
    नरस्तत्सि मायाख्यबन्धनम् । हन्ति यस्तद्वाटिकेयं सर्वेषां हितदा सदा ॥ ९॥ स्या अ योध्ये रामपाद सु पु
    नीतेऽमृतत्वदा । भू यो मास्तु ममावृत्ति पु री षु सरयूवृते ॥ १॥ आ ध्या नान्मथुरे ते मे स द्वा सोऽस्तु
    निरन्तरम् । रा म कृष्णाङ्घ्रिसम्पते व र दे यमुनावृते ॥ २॥ पृ थु मार्गप्रदा माये भ व भागीरथीवृते ।
    व रा सि त्वां हरिद्वारं सु ती र्थं प्रवदन्ति हि ॥ ३॥ म मा घं हर काशि त्व मुच् चै स्समणिकर्णिके । भू
    या न्न मे पुनर्जन्म भ व पादाञ्चिते भवे ॥ ४॥ सा का ञ्चीनगरी मह्य त्रा स हा शिवविष्णुपूः । आ शीः प्रदाद्य
    मां कृत्वा लु प्तै नसमवत्वियम् ॥ ५॥ लो कां तरानपेक्षं मां म ता कालेश्वरादृता ॥ ना ची र्णतपसं पातु
    मां मो हात्क्षिप्रयादृता ॥ ६॥ स्या अ नन्ताश्रये मेऽद्य मो क्ष दा सिन्धुतीरगे । त्वं वं द्यास्यखिलैः
    सर्वप्र दा द्वारवतीश्वरी ॥ ७॥ य ति राड्राजधान्याद्यं न य कृष्णातटस्थिते । लो का त्माख्यमाहुस्त्वां
    लो का नृसिंहवाटिकाम् ॥ ८॥ कर्मभिर्नृत्यन्ति नरस्तत्सि मायाख्यबन्धनम् । हन्ति यस्तद्वाटिकेयं सर्वेषां
    हितदा सदा ॥ ९॥ इति श्रीवासुदेवानन्दसरस्वतीविरचितं नृसिंहवाटिकान्वितसप्तपुरीस्तोत्रं सम्पूर्णम् ।
