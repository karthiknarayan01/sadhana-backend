id: bhagya-suktam
category: stotram
name:
  english: Bhagya Suktam
  devanagari: भाग्यसूक्तम्
content:
  english: taittiriya brahmanam ashtakam prataragnim pratarindra havamahe pratarmitra varuna pratarashvina
    pratarbhagam pushanam brahmanaspatim pratah somamuta rudra pratarjitam bhagamugra huvema vayam putramaditeryo
    vidharta ardhrashcidyam manyamanasturashcidraja cidyam bhagam bhakshityaha bhaga pranetarbhaga satyaradho
    bhagemam dhiyamudava dadannah bhaga pra no janaya gobhirashvairbhaga pra nribhirnrivantah syama utedanim
    bhagavantah syamota prapitva uta madhye ahna utodita maghavanthsuryasya vayam devana astu devastena
    vayam bhagavantah syama tam tva bhaga sarva ijjohavimi sa no bhaga pura eta bhaveha samadhvarayoshaso'namanta
    dadhikraveva shucaye padaya arvacinam vasuvidam bhagam no rathamivashvavajina avahantu ashvavatirgomatirna
    ushaso viravatih sadamucchantu bhadrah ghritam duhana vishvatah prapina yuyam pata svastibhih sada
    nah santamathabhagam cikir abhagamagne tam kuru mamagne bhaginam kuru
  devanagari: तैत्तिरीय ब्राह्मणम् अष्टकम् प्रा॒तर॒ग्निं प्रा॒तरिन्द्र ॑ हवामहे प्रा॒तर्मि॒त्रा वरु॑णा
    प्रा॒तर॒श्विना प्रा॒तर्भगं॑ पू॒षणं॒ ब्रह्म॑ण॒स्पतिं॑ प्रा॒तः सोम॑मु॒त रु॒द्र प्रा॒त॒र्जितं॒ भग॑मु॒ग्र
    हु॑वेम व॒यं पु॒त्रमदि॑ते॒र्यो वि॑ध॒र्ता आ॒र्ध्रश्चि॒द्यं मन्य॑मानस्तु॒रश्चि॒द्राजा॑ चि॒द्यं भगं॑ भ॒क्षीत्याह॑
    भग॒ प्रणे॑त॒र्भग॒ सत्य॑राधो॒ भगे॒मां धिय॒मुद॑व॒ दद॑न्नः भग॒ प्र णो॑ जनय॒ गोभि॒रश्वै॒र्भग॒ प्र नृभि॑र्नृ॒वन्तः॑
    स्याम उ॒तेदानीं॒ भग॑वन्तः स्यामो॒त प्रपि॒त्व उ॒त मध्ये॒ अह्ना उ॒तोदि॑ता मघव॒न्थ्सूर्य॑स्य व॒यं दे॒वाना
    अस्तु देवा॒स्तेन॑ व॒यं भग॑वन्तः स्याम तं त्वा॑ भग॒ सर्व॒ इज्जो॑हवीमि॒ स नो॑ भग पुर ए॒ता भ॑वे॒ह सम॑ध्व॒रायो॒षसो॑ऽनमन्त
    दधि॒क्रावे॑व॒ शुच॑ये प॒दाय॑ अ॒र्वा॒ची॒नं व॑सु॒विदं॒ भगं॑ नो॒ रथ॑मि॒वाश्वा॑वा॒जिन॒ आव॑हन्तु अश्वा॑वती॒र्गोम॑तीर्न
    उ॒षासो॑ वी॒रव॑तीः॒ सद॑मुच्छन्तु भ॒द्राः घृ॒तं दुहा॑ना वि॒श्वतः॒ प्रपी॑ना यू॒यं पा॑त स्व॒स्तिभिः॒ सदा॑
    नः ॑ स॒न्तमथा॑भा॒गं चिकी॑र् अ॒भा॒गम॑ग्ने॒ तं कु॑रु॒ माम॑ग्ने भा॒गिनं॑ कुरु
