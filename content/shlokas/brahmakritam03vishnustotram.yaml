id: brahmakritam03vishnustotram
category: stotram
name:
  english: brahmakritam03vishnustotram
  devanagari: ब्रह्मकृतं०३विष्णुस्तोत्रम्
content:
  english: brahmakritam 3 vishnustotram brahmovaca | namah kamalanabhaya namaste kamalashraya | namaste
    kamalavasavishalavanamaline || 15|| namo vijnanamatraya guhavasa nivasine | hrishikeshaya shantaya
    tubhyam bhagavate namah || 16|| svabhaktarakshanakrite dhritadehaya sharngine | anantakleshanashaya
    gadine brahmane namah || 17|| samsaravividhasaranivrittikritakarmane | rakshitre sarvajantunam vishnave
    jishnave namah || 18|| namo vishvambharasheshanivrittagunavrittaye | surasuravarastambhanivrittisthitikirtaye
    || 19|| iti shriskandapurane vaishnavakhande badarikashramamahatmye caturthadhyayantargatam brahmakritam
    vishnustotram samaptam | skandapurana | vaishnavakhanda | badarikakhanda | adhyaya 6
  devanagari: ब्रह्मकृतं ३ विष्णुस्तोत्रम् ब्रह्मोवाच । नमः कमलनाभाय नमस्ते कमलाश्रय । नमस्ते कमलावासविशालवनमालिने
    ॥ १५॥ नमो विज्ञानमात्राय गुहावास निवासिने । हृषीकेशाय शान्ताय तुभ्यं भगवते नमः ॥ १६॥ स्वभक्तरक्षणकृते
    धृतदेहाय शार्ङ्गिणे । अनन्तक्लेशनाशाय गदिने ब्रह्मणे नमः ॥ १७॥ संसारविविधासारनिवृत्तिकृतकर्मणे । रक्षित्रे
    सर्वजन्तूनां विष्णवे जिष्णवे नमः ॥ १८॥ नमो विश्वम्भराशेषनिवृत्तगुणवृत्तये । सुरासुरवरस्तम्भनिवृत्तिस्थितिकीर्तये
    ॥ १९॥ इति श्रीस्कन्दपुराणे वैष्णवखण्डे बदरिकाश्रममाहात्म्ये चतुर्थाध्यायान्तर्गतं ब्रह्मकृतं विष्णुस्तोत्रं
    समाप्तम् । स्कन्दपुराण । वैष्णवखण्ड । बदरिकाखण्ड । अध्याय ६
