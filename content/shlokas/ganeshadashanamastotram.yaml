id: ganeshadashanamastotram
category: stotram
name:
  english: ganeshadashanamastotram
  devanagari: गणेशदशनामस्तोत्रम्
content:
  english: shriganeshadashanamastotram ganadhipa namaste'stu umaputraghanashana | ekadantebhavaktresha
    deva mushakavahana || vinayakeshaputrava sarvasiddhipradayaka | iti ganeshadashanamastotram sampurnam
    |
  devanagari: श्रीगणेशदशनामस्तोत्रम् गणाधिप नमस्तेऽस्तु उमापुत्राघनाशन । एकदन्तेभवक्त्रेश देव मूषकवाहन
    ॥ विनायकेशपुत्राव सर्वसिद्धिप्रदायक । इति गणेशदशनामस्तोत्रं सम्पूर्णम् ।
meaning: {}
