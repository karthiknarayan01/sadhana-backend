id: annamayya-keerthanas-kolani-dopariki
category: stotram
name:
  english: Annamayya Keerthanas Kolani Dopariki
content:
  english: adi pallavi kòlani dopariki gòbbillo yadu | kula svamikini gòbbillo || kònda gòduguga govula
    gacina | kòndòka shishuvunaku gòbbillo | dandagampu daityula kèllanu tala | gundu gandaniki gòbbillo
    || kòlani dopariki gòbbillo yadu papa vidhula shishupaluni tittula | kopaganikini gòbbillo | yepuna
    kamsuni yidumala bèttina | gopa baluniki gòbbillo || kòlani dopariki gòbbillo yadu dandivairulanu
    tarimina danujula | gundè digulunaku gòbbillo | vèndipaidi yagu venkata giripai | kòndalayyakunu gòbbillo
    || kòlani dopariki gòbbillo yadu
  devanagari: आदि पल्लवि कॊलनि दोपरिकि गॊब्बिल्लो यदु । कुल स्वामिकिनि गॊब्बिल्लो ॥ कॊण्ड गॊडुगुगा गोवुल
    गाचिन । कॊण्डॊक शिशुवुनकु गॊब्बिल्लो । दण्डगम्पु दैत्युल कॆल्लनु तल । गुण्डु गण्डनिकि गॊब्बिल्लो ॥
    कॊलनि दोपरिकि गॊब्बिल्लो यदु पाप विधुल शिशुपालुनि तिट्टुल । कोपगानिकिनि गॊब्बिल्लो । येपुन कंसुनि
    यिडुमल बॆट्टिन । गोप बालुनिकि गॊब्बिल्लो ॥ कॊलनि दोपरिकि गॊब्बिल्लो यदु दण्डिवैरुलनु तरिमिन दनुजुल
    । गुण्डॆ दिगुलुनकु गॊब्बिल्लो । वॆण्डिपैडि यगु वेङ्कट गिरिपै । कॊण्डलय्यकुनु गॊब्बिल्लो ॥ कॊलनि दोपरिकि
    गॊब्बिल्लो यदु
