id: kalishatanamastotrambrihannila
category: stotram
name:
  english: kalishatanamastotrambrihannila
  devanagari: कालीशतनामस्तोत्रम्बृहन्नील
content:
  english: kalishatanamastotram brihannilatantrargatam shridevyuvaca | pura pratishrutam deva kridasakto
    yada bhavan | namnam shatam mahakalyah kathayasva mayi prabho || 23
  devanagari: कालीशतनामस्तोत्रम् बृहन्नीलतन्त्रार्गतम् श्रीदेव्युवाच । पुरा प्रतिश्रुतं देव क्रीडासक्तो
    यदा भवान् । नाम्नां शतं महाकाल्याः कथयस्व मयि प्रभो ॥ २३
meaning: {}
