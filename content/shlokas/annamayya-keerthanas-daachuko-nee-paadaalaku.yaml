id: annamayya-keerthanas-daachuko-nee-paadaalaku
category: stotram
name:
  english: Annamayya Keerthanas Daachuko Nee Paadaalaku
content:
  english: arabhi dacuko nipadalakudaga ne jesinapuja livi | puci nikiritirupapushpamu livi yayya || vòkka
    sankirtanè calu vòddikai mammu rakshincaga | takkinavi bhandarana daci vundani | vèkkasamaguni namamu
    vèla sulabhamu phala madhikamu | dikkai nanneliti vika navi tirani na dhanamayya || nanalikapainundi
    nanasankirtanalu | puni nace ninnu bògadincitivi | venamala vènnuda vinutinca nèntavada | kanimmani
    na kipunyamu gattiti vinteyayya || yimata garvamu gadu ni mahime kòniyaditigani | cemunci nasvatantryamu
    cèppinavadaganu | nemana badevadanu neramu lèncakumi | shrimadhava ne nidasuda shrivenkateshudavayya
    ||
  devanagari: आरभि दाचुको नीपादालकुदग ने जेसिनपूज लिवि । पूचि नीकीरीतिरूपपुष्पमु लिवि यय्या ॥ वॊक्क सङ्कीर्तनॆ
    चालु वॊद्दिकै मम्मु रक्षिञ्चग । तक्किनवि भाण्डारान दाचि वुण्डनी । वॆक्कसमगुनी नाममु वॆल सुलभमु फल
    मधिकमु । दिक्कै नन्नेलिति विक नवि तीरनि ना धनमय्या ॥ नानालिकपैनुण्डि नानासङ्कीर्तनलु । पूनि नाचे निन्नु
    बॊगडिञ्चितिवि । वेनामाल वॆन्नुडा विनुतिञ्च नॆन्तवाड । कानिम्मनि ना कीपुण्यमु गट्टिति विन्तेयय्या ॥
    यीमाट गर्वमु गादु नी महिमे कॊनियाडितिगानि । चेमुञ्चि नास्वातन्त्र्यमु चॆप्पिनवाडगानु । नेमान बाडेवाडनु
    नेरमु लॆञ्चकुमी । श्रीमाधवा ने नीदासुड श्रीवेङ्कटेशुडवय्या ॥
