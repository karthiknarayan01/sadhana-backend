id: mahanyasam-7-8-ashtanga-pranamam
category: stotram
name:
  english: Mahanyasam - 7.8. Ashtanga Pranamam
content:
  english: tagre bhutasya jatah patireka asit | sadadhara prithivi nkasmai devaya havisha vidhema || urasa
    namah || yah pranato nimishato mahitvaika idraja jagato babhuva | ya ishe asya dvipada shcatushpadah
    kasmai devaya havisha vidhema || shirasa namah || ssuruco vena avah | sa budhniya upama asya vishtha
    mahi dyauh prithivi ca na imam mmimikshatam | pipritanno bharimabhih | manasa namah || mpurutra te
    manutam njagat | sa dundubhe sajurindrena devai rduraddaviyo apasedha shatrun | vacasa namah || agne
    naya supatha raye asman vishvani deva vayunani vidvan | yuyoddhyasma meno bhuyishthante nama uktim
    ya te agne rudriya tanustaya nah pahi tasya 'yashaya rajashaya harashaya tanurvar shishtha gahvareshthogram
    va~co apavadhigm svaha ya~maprastaramahi sidangirobhih pitribhih sam vi~danah | atva mantrah kavishasta
    vahantvena rajan havisha madayasva || karnabhya urasa shirasa drishtya manasa vacasa tatha | padbhya
    'shtanga ucyate || umamaheshvarabhya
  devanagari: ताग्रे॑ भू॒तस्य॑ जा॒तः पति॒रेक॑ आसीत् । सदा॑धार पृथि॒वी ङ्कस्मै॑ दे॒वाय॑ ह॒विषा॑ विधेम ॥
    उरसा नमः ॥ यः प्रा॑ण॒तो नि॑मिष॒तो म॑हि॒त्वैक॒ इद्राजा॒ जग॑तो ब॒भूव॑ । य ईशे॑ अ॒स्य द्वि॒पद॒ श्चतु॑ष्पदः॒
    कस्मै॑ दे॒वाय॑ ह॒विषा॑ विधेम ॥ शिरसा नमः ॥ स्सु॒रुचो॑ वे॒न आ॑वः । स बु॒ध्निया॑ उप॒मा अ॑स्य वि॒ष्ठा
    म॒ही द्यौः पृ॑थि॒वी च॑ न इ॒मं म्मि॑मिक्षताम् । पि॒पृ॒तान्नो॒ भरी॑मभिः । मनसा नमः ॥ म्पु॑रु॒त्रा ते॑
    मनुतां॒ ञ्जग॑त् । स दु॑न्दुभे स॒जूरिन्द्रे॑ण दे॒वै र्दू॒राद्दवी॑यो॒ अप॑सेध॒ शत्रून्॑ । वचसा नमः ॥
    अग्ने॒ नय॑ सु॒पथा॑ रा॒ये अ॒स्मान् विश्वा॑नि देव व॒युना॑नि वि॒द्वान् । यु॒यो॒द्ध्य॑स्म मेनो॒ भूयि॑ष्ठान्ते॒
    नम॑ उक्तिं या ते॑ अग्ने॒ रुद्रि॑या त॒नूस्तया॑ नः पाहि॒ तस्या ऽयाश॒या र॑जाश॒या ह॑राश॒या त॒नूर्वर् षि॑ष्ठा
    गह्वरे॒ष्ठोग्रं वँचो॒ अपा॑वधी॒ग्ं॒ स्वाहा यँ॑मप्रस्त॒रमाहि सीदाङ्गि॑रोभिः पि॒तृभिः॑ सं विँदा॒नः ।
    आत्वा॒ मन्त्राः॑ कविश॒स्ता व॑हन्त्वे॒ना रा॑जन् ह॒विषा॑ मादयस्व ॥ कर्णाभ्या उरसा शिरसा दृष्ट्या मन॑सा
    वचसा त॒था । पद्भ्या ऽष्टाङ्ग॑ उच्यते ॥ उमामहेश्वराभ्या
