id: tariniparijatah-vidvadupadhyayapanditaviracitah
category: mantra
name:
  english: tariniparijatah (vidvadupadhyayapanditaviracitah)
  devanagari: तारिणीपारिजातः (विद्वदुपाध्यायपण्डितविरचितः)
content:
  english: ityatra rudrapadam sviyashaktinamupalakshanam manvana rudran sashaktikan prayunjante | tatha
    ca tesham mate hri~ trim hu~ am shrikantheshaya purnodaryai nama ityadayah prayoga bodhyah | purnodaryadishaktayastu
    sharadatilakadau drashtavyah | vistarabhiya'nupayogaccatra na likhitah || atha grahanyasah hridaye
    hri~ tri~ hu~ am am im im um um rim rim lim lim em aim om aum am ah raktavarnaya suryaya namah | bhrumadhye
    hri~ tri~ hu~ yam ram lam vam shuklavarnaya somaya namah | netratraye hri~ tri~ hu~ kam kham gam gham
    nam lohitavarnaya mangalaya namah | hridayavritte hri~ tri~ hu~ cam cham jam jham nam shyamavarnaya
    budhaya namah | kanthakupe hri~ tri~ hu~ tam tham dam dham nam pitavarnaya brihaspataye namah | galapradeshe
    hri~ tri~ hu~ tam tham dam dham nam pandaravarnaya shukraya namah | nabhau hri~ tri~ hu~ pam pham
    bam bham mam nilavarnaya shanaishcaraya namah | vaktre hri~ tri~ hu~ sham sham sam ham dhumravarnaya
    rahave namah | padayoh hri~ tri~ hu~ ḻam ksham dhumravarnebhyah ketubhyo namah | iti grahanyasah ||
    atha lokapalanyasah madhyalalate hri~ tri~ hu~ am im rim lim em om am indraya namah | dakshanetropari
    hri~ tri~ hu~ am im um rim lim aim aum ah agnaye namah | dakshakarnopari hri~ tri~ hu~ kam kham gam
    gham nam yamaya namah | dakshakarnagre hri~ tri~ hu~ cam cham jam jham nam nirritaye namah | cudadhahkupe
    hri~ tri~ hu~ tam tham dam dham nam varunaya namah | vamakarnagre tam tham dam dham nam vayave namah
    | vamakarnopari hri~ tri~ hu~ pam pham bam bham mam kuberaya namah | vamanetropari hri~ tri~ hu~ yam
    ram lam vam ishanaya namah | cibukasyadhobhage hri~ tri~ hu~ sham sham sam ham anantaya namah | brahmarandhre
    hri~ tri~ hu~ ḻam ksham brahmane namah | iti lokapalanyasah || atha shivashaktinyasah muladhare hri~
    tri~ hu~ vam sham sham sam dakinisahitaya brahmane namah | svadhishthane hri~ tri~ hu~ bam bham mam
    yam ram lam rakinisahitaya vishnave namah | manipure hri~ tri~ hu~ dam dham nam tam tham dam dham
    nam pam pham lakinisahitaya rudraya namah | anahate hri~ tri~ hu~ kam kham gam gham nam cam cham jam
    jham nam tam tham kakinisahitaya ishvaraya namah | vishuddhicakre hri~ tri~ hu~ am am im im um um
    rim rim lim lim em aim om aum am ah sakinisahitaya sadashivaya namah | ajnacakre hri~ tri~ hu~ ham
    ksham hakinisahitaya paramashivaya namah | iti shivashaktinyasah || atha taranyasah brahmarandhre
    hri~ tri~ hu~ am am kam kham gam gham nam o~ tarayai namah | lalate hri~ tri~ hu~ im im cam cham jam
    jham nam o~ uprayai namah | bhrumadhye hri~ tri~ hu~ um um tam tham dam dham nam o~ mahograyai namah
    | kanthakupe hri~ tri~ hu~ rim rim tam tham dam dham nam o~ vajrayai namah | hridaye hri~ tri~ hu~
    lim lim pam pham bam bham mam o~ kalyai namah | nabhau hri~ tri~ hu~ em aim yam ram lam vam o~ sarasvatyai
    namah | linge hri~ tri~ hu~ om aum sham sham sam ham o~ kameshvarye namah | muladhare hri~ tri~ hu~
    am ah ḻam ksham camundayai namah | iti taranyasah || atha pithanyasah muladhare hri~ tri~ hu~ am im
    um rim lim em om am kamarupapithaya namah | hridaye hri~ tri~ hu~ am im um rim lim aim aum ah jalandharapithaya
    namah | lalate hri~ tri~ hu~ kam kham gam gham nam purnagiripithaya namah | keshante hri~ tri~ hu~
    cam cham jam jham nam uddiyanapithaya namah | bhrumadhye hri~ tri~ hu~ tam tham dam dham nam varanasipithaya
    namah | netradvaye hri~ tri~ hu~ tam tham dam dham nam avantipithaya namah | mukhavritte hri~ tri~
    hu~ pam pham bam bham mam mayavatipithaya namah | kanthe hri~ tri~ hu~ yam ram lam vam madhupuripithaya
    namah | nabhau hri~ tri~ hu~ sham sham sam ham ayodhyapithaya namah | katyam hri~ tri~ hu~ ḻam ksham
    kancipithaya namah | iti pithanyasah | iti tantracudamanyuktamahashodhanyasah || atha nilatantroktashodhanyasah
    keshante mulam am namah
  devanagari: इत्यत्र रुद्रपदं स्वीयशक्तीनामुपलक्षणं मन्वाना रुद्रान् सशक्तिकान् प्रयुञ्जन्ते । तथा च
    तेषां मते ह्रीँ त्रीं हूँ अं श्रीकण्ठेशाय पूर्णोदर्यै नम इत्यादयः प्रयोगा बोध्याः । पूर्णोदर्यादिशक्तयस्तु
    शारदातिलकादौ द्रष्टव्याः । विस्तरभियाऽनुपयोगाच्चात्र न लिखिताः ॥ अथ ग्रहन्यासः हृदये ह्रीँ त्रीँ हूँ
    अं आं इं ईं उं ऊं ऋं ॠं ऌं ॡं एं ऐं ओं औं अं अः रक्तवर्णाय सूर्याय नमः । भ्रूमध्ये ह्रीँ त्रीँ हूँ
    यं रं लं वं शुक्लवर्णाय सोमाय नमः । नेत्रत्रये ह्रीँ त्रीँ हूँ कं खं गं घं ङं लोहितवर्णाय मङ्गलाय
    नमः । हृदयवृत्ते ह्रीँ त्रीँ हूँ चं छं जं झं ञं श्यामवर्णाय बुधाय नमः । कण्ठकूपे ह्रीँ त्रीँ हूँ टं
    ठं डं ढं णं पीतवर्णाय बृहस्पतये नमः । गलप्रदेशे ह्रीँ त्रीँ हूँ तं थं दं धं नं पाण्डरवर्णाय शुक्राय
    नमः । नाभौ ह्रीँ त्रीँ हूँ पं फं बं भं मं नीलवर्णाय शनैश्चराय नमः । वक्त्रे ह्रीँ त्रीँ हूँ शं षं
    सं हं धूम्रवर्णाय राहवे नमः । पादयोः ह्रीँ त्रीँ हूँ ळं क्षं धूम्रवर्णेभ्यः केतुभ्यो नमः । इति ग्रहन्यासः
    ॥ अथ लोकपालन्यासः मध्यललाटे ह्रीँ त्रीँ हूँ अं इं ऋं ऌं एं ओं अं इन्द्राय नमः । दक्षनेत्रोपरि ह्रीँ
    त्रीँ हूँ आं ईं ऊं ॠं ॡं ऐं औं अः अग्नये नमः । दक्षकर्णोपरि ह्रीँ त्रीँ हूँ कं खं गं घं ङं यमाय नमः
    । दक्षकर्णाग्रे ह्रीँ त्रीँ हूँ चं छं जं झं ञं निरृतये नमः । चूडाधःकूपे ह्रीँ त्रीँ हूँ टं ठं डं ढं
    णं वरुणाय नमः । वामकर्णाग्रे तं थं दं धं नं वायवे नमः । वामकर्णोपरि ह्रीँ त्रीँ हूँ पं फं बं भं मं
    कुबेराय नमः । वामनेत्रोपरि ह्रीँ त्रीँ हूँ यं रं लं वं ईशानाय नमः । चिबुकस्याधोभागे ह्रीँ त्रीँ हूँ
    शं षं सं हं अनन्ताय नमः । ब्रह्मरन्ध्रे ह्रीँ त्रीँ हूँ ळं क्षं ब्रह्मणे नमः । इति लोकपालन्यासः ॥
    अथ शिवशक्तिन्यासः मूलाधारे ह्रीँ त्रीँ हूँ वं शं षं सं डाकिनीसहिताय ब्रह्मणे नमः । स्वाधिष्ठाने ह्रीँ
    त्रीँ हूँ बं भं मं यं रं लं राकिनीसहिताय विष्णवे नमः । मणिपूरे ह्रीँ त्रीँ हूँ डं ढं णं तं थं दं धं
    नं पं फं लाकिनीसहिताय रुद्राय नमः । अनाहते ह्रीँ त्रीँ हूँ कं खं गं घं ङं चं छं जं झं ञं टं ठं काकिनीसहिताय
    ईश्वराय नमः । विशुद्धिचक्रे ह्रीँ त्रीँ हूँ अं आं इं ईं उं ऊं ऋं ॠं ऌं ॡं एं ऐं ओं औं अं अः साकिनीसहिताय
    सदाशिवाय नमः । आज्ञाचक्रे ह्रीँ त्रीँ हूँ हं क्षं हाकिनीसहिताय परमशिवाय नमः । इति शिवशक्तिन्यासः ॥
    अथ तारान्यासः ब्रह्मरन्ध्रे ह्रीँ त्रीँ हूँ अं आं कं खं गं घं ङं ओँ तारायै नमः । ललाटे ह्रीँ त्रीँ
    हूँ इं ईं चं छं जं झं ञं ओँ उप्रायै नमः । भ्रूमध्ये ह्रीँ त्रीँ हूँ उं ऊं टं ठं डं ढं णं ओँ महोग्रायै
    नमः । कण्ठकूपे ह्रीँ त्रीँ हूँ ऋं ॠं तं थं दं धं नं ओँ वज्रायै नमः । हृदये ह्रीँ त्रीँ हूँ ऌं ॡं पं
    फं बं भं मं ओँ काल्यै नमः । नाभौ ह्रीँ त्रीँ हूँ एं ऐं यं रं लं वं ओँ सरस्वत्यै नमः । लिङ्गे ह्रीँ
    त्रीँ हूँ ओं औं शं षं सं हं ओँ कामेश्वर्ये नमः । मूलाधारे ह्रीँ त्रीँ हूँ अं अः ळं क्षं चामुण्डायै
    नमः । इति तारान्यासः ॥ अथ पीठन्यासः मूलाधारे ह्रीँ त्रीँ हूँ अं इं उं ऋं ऌं एं ओं अं कामरूपपीठाय नमः
    । हृदये ह्रीँ त्रीँ हूँ आं ईं ऊं ॠं ॡं ऐं औं अः जालन्धरपीठाय नमः । ललाटे ह्रीँ त्रीँ हूँ कं खं गं
    घं ङं पूर्णगिरिपीठाय नमः । केशान्ते ह्रीँ त्रीँ हूँ चं छं जं झं ञं उड्डीयानपीठाय नमः । भ्रूमध्ये ह्रीँ
    त्रीँ हूँ टं ठं डं ढं णं वाराणसीपीठाय नमः । नेत्रद्वये ह्रीँ त्रीँ हूँ तं थं दं धं नं अवन्तीपीठाय
    नमः । मुखवृत्ते ह्रीँ त्रीँ हूँ पं फं बं भं मं मायावतीपीठाय नमः । कण्ठे ह्रीँ त्रीँ हूँ यं रं लं वं
    मधुपुरीपीठाय नमः । नाभौ ह्रीँ त्रीँ हूँ शं षं सं हं अयोध्यापीठाय नमः । कट्यां ह्रीँ त्रीँ हूँ ळं क्षं
    काञ्चीपीठाय नमः । इति पीठन्यासः । इति तन्त्रचूडामण्युक्तमहाषोढान्यासः ॥ अथ नीलतन्त्रोक्तषोढान्यासः
    केशान्ते मूलं अं नमः
