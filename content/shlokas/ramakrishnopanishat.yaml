id: ramakrishnopanishat
category: upanishad
name:
  english: ramakrishnopanishat
  devanagari: रामक्रिश्नोपनिशत्
content:
  english: sarasvatityadi devinamabhirapi nirdishyate || 3|| vyavaharadashayam yatra purusho'jno dvaitamiva
    pashyati tada kalyadi devyah parasyaiva brahmanah shaktaya iti mantavyam | dahikashaktiryathagneh
    | vastutastu tayoratyamtamabhedah eva ||4|| parameshvaradarshanameva manava jivanasya caramoddeshah
    | tathaiva mukteh sadhyatvat | parameshvarastu drashtum sprashtum ca shakyah | tena sahalapo'pi sadhyah
    | sarve dharmah samanastameva gamayamti ca || 5|| api tu mayajavanikacchannah sa sukhena drashtum
    na labhyah | kamakamcana kamanaiva maya | tadapagame sah svayamevavirbhavati meghapayem'shumaniva
    | jnanamishrita bhaktishca mayanashopayah | sa eva sarvamityato dinadaridrarogyajnadinam narayanadrishtya
    seva'pyadyatanakale'
  devanagari: सरस्वतीत्यादि देवीनामभिरपि निर्दिश्यते ॥ ३॥ व्यवहारदशायां यत्र पुरुषोऽज्ञो द्वैतमिव पश्यति
    तदा काल्यादि देव्यः परस्यैव ब्रह्मणः शक्तय इति मन्तव्यम् । दाहिकशक्तिर्यथाग्नेः । वस्तुतस्तु तयोरत्यंतमभेदः
    एव ॥४॥ परमेश्वरदर्शनमेव मानव जीवनस्य चरमोद्देशः । तथैव मुक्तेः साध्यत्वात् । परमेश्वरस्तु द्रष्टुं
    स्प्रष्टुं च शक्यः । तेन सहालापोऽपि साध्यः । सर्वे धर्माः समानास्तमेव गमयंति च ॥ ५॥ अपि तु मायाजवनिकाच्छन्नः
    स सुखेन द्रष्टुं न लभ्यः । कामकांचन कामनैव माया । तदपगमे सः स्वयमेवाविर्भवति मेघापायेंऽशुमानिव । ज्ञानमिश्रित
    भक्तिश्च मायानाशोपायः । स एव सर्वमित्यतो दीनदरिद्ररोग्यज्ञादीनां नारायणदृष्ट्या सेवाऽप्यद्यतनकालेऽ
