id: gauryashtottarashata-namavalih
category: stotram
name:
  english: gauryashtottarashata namavalih
  devanagari: गौर्यष्टोत्तरशत नामावलिः
content:
  english: '|| gauryashtottarashata namavalih || om mahamanonmanishaktyai namah | om shivashaktyai namah
    | om shivamkaryai namah | om icchashakti kriyashakti jnanashakti svarupinyai namah | om shantyatita
    kalanandayai namah | om shivamayayai namah | om shivapriyayai namah | om sarvajnayai namah | om sundaryai
    namah | om saumyayai namah | om saccidanandarupinyai namah | om paraparamayyai namah | om balayai
    namah | om tripurayai namah | om kundalyai namah | om shivayai namah | om rudranyai namah | om vijayayai
    namah | om sarvayai namah | om sharvanyai namah | om bhuvaneshvaryai namah | om kalyanyai namah |
    om shulinyai namah | om kantayai namah | om mahatripurasundaryai namah | om malinyai namah | om maninyai
    namah | om madanollasa mohinyai namah | om maheshvaryai namah | om matangyai namah | om shivakamyai
    namah | om cidatmikayai namah | om kamakshyai namah | om kamalakshyai namah | om minakshyai namah
    | om sarvasakshinyai namah | om umadevyai namah | om mahakalyai namah | om samayai namah | om sarvajanapriyayai
    namah | om citpurayai namah | om cidghananandayai namah | om cinmayyai namah | om citsvarupinyai namah
    | om mahasarasvatyai namah | om durgayai namah | om jvaladurgadimohinyai namah | om nakulyai namah
    | om shuddhavidyayai namah | om saccidanandavigrahayai namah | om suprabhayai namah | om suprabhajvalayai
    namah | om indrakshhyai namah | om sarvamohinyai namah | om mahendrajalamadhyasthayai namah | om mayayai
    namah | om mayavinodinyai namah | om vishveshvaryai namah | om vrisharudhayai namah | om vidyajalavinodinyai
    namah | om mantreshvaryai namah | om mahalakshmyai namah | om mahakaliphalapradayai namah | om caturvedavisheshajnayai
    namah | om savitryai namah | om sarvadevatayai namah | om mahendranyai namah | om ganadhyakshayai
    namah | om mahabhairavapujitayai namah | om mahamayayai namah | om mahaghorayai namah | om mahadevyai
    namah | om malapahayai namah | om mahishasurasamharyai namah | om candamundakulantakayai namah | om
    cakreshvaryai namah | om caturvedyai namah | om sarvadayai namah | om suranayikyai namah | om shatshastranipunayai
    namah | om nityayai namah | om shaddarshanavicakshanayai namah | om kalaratryai namah | om kalatitayai
    namah | om kavirajamanoharayai namah | om sharadatilakakarayai namah | om dhirayai namah | om dhirajanapriyayai
    namah | om ugrabharyai namah | om mahabharyai namah | om kshipramaryai namah | om ranapriyayai namah
    | om annapurneshvaryai namah | om matre namah | om svarnakaratatitprabhayai namah | om svaravyamjanavarnodayayai
    namah | om gadyapadyadikaranayai namah | om padavakyarthanilayayai namah | om bindunadadikaranayai
    namah | om moksheshamahishyai namah | om satyayai namah | om bhuktimuktiphalapradayai namah | om vijnanadayinyai
    namah | om prajnayai namah | om prajnanaphaladayinyai namah | om ahamkarakalatitayai namah | om parashaktyai
    namah | om paratparayai namah | | iti gauryashtottarashata namavalih |'
  devanagari: ॥ गौर्यष्टोत्तरशत नामावलिः ॥ ॐ महामनोन्मणीशक्त्यै नमः । ॐ शिवशक्त्यै नमः । ॐ शिवंकर्यै नमः
    । ॐ इच्छाशक्ति क्रियाशक्ति ज्ञानशक्ति स्वरूपिण्यै नमः । ॐ शान्त्यतीत कलानन्दायै नमः । ॐ शिवमायायै
    नमः । ॐ शिवप्रियायै नमः । ॐ सर्वज्ञायै नमः । ॐ सुन्दर्यै नमः । ॐ सौम्यायै नमः । ॐ सच्चिदानन्दरूपिण्यै
    नमः । ॐ परापरामय्यै नमः । ॐ बालायै नमः । ॐ त्रिपुरायै नमः । ॐ कुण्डल्यै नमः । ॐ शिवायै नमः । ॐ रुद्राण्यै
    नमः । ॐ विजयायै नमः । ॐ सर्वायै नमः । ॐ शर्वाण्यै नमः । ॐ भुवनेश्वर्यै नमः । ॐ कल्याण्यै नमः । ॐ शूलिन्यै
    नमः । ॐ कान्तायै नमः । ॐ महात्रिपुरसुन्दर्यै नमः । ॐ मालिन्यै नमः । ॐ मानिन्यै नमः । ॐ मदनोल्लास मोहिन्यै
    नमः । ॐ महेश्वर्यै नमः । ॐ मातङ्ग्यै नमः । ॐ शिवकाम्यै नमः । ॐ चिदात्मिकायै नमः । ॐ कामाक्ष्यै नमः
    । ॐ कमलाक्ष्यै नमः । ॐ मीनाक्ष्यै नमः । ॐ सर्वसाक्षिण्यै नमः । ॐ उमादेव्यै नमः । ॐ महाकाल्यै नमः ।
    ॐ सामायै नमः । ॐ सर्वजनप्रियायै नमः । ॐ चित्पुरायै नमः । ॐ चिद्घनानन्दायै नमः । ॐ चिन्मय्यै नमः ।
    ॐ चित्स्वरूपिण्यै नमः । ॐ महासरस्वत्यै नमः । ॐ दुर्गायै नमः । ॐ ज्वालादुर्गादिमोहिन्यै नमः । ॐ नकुल्यै
    नमः । ॐ शुद्धविद्यायै नमः । ॐ सच्चिदानन्दविग्रहायै नमः । ॐ सुप्रभायै नमः । ॐ सुप्रभाज्वालायै नमः ।
    ॐ इन्द्राक्ष्ह्यै नमः । ॐ सर्वमोहिन्यै नमः । ॐ महेन्द्रजालमध्यस्थायै नमः । ॐ मायायै नमः । ॐ मायाविनोदिन्यै
    नमः । ॐ विश्वेश्वर्यै नमः । ॐ वृषारूढायै नमः । ॐ विद्याजालविनोदिन्यै नमः । ॐ मन्त्रेश्वर्यै नमः ।
    ॐ महालक्ष्म्यै नमः । ॐ महाकालीफलप्रदायै नमः । ॐ चतुर्वेदविशेषज्ञायै नमः । ॐ सावित्र्यै नमः । ॐ सर्वदेवतायै
    नमः । ॐ महेन्द्राण्यै नमः । ॐ गणाध्यक्षायै नमः । ॐ महाभैरवपूजितायै नमः । ॐ महामायायै नमः । ॐ महाघोरायै
    नमः । ॐ महादेव्यै नमः । ॐ मलापहायै नमः । ॐ महिषासुरसंहार्यै नमः । ॐ चण्डमुण्डकुलान्तकायै नमः । ॐ चक्रेश्वर्यै
    नमः । ॐ चतुर्वेद्यै नमः । ॐ सर्वदायै नमः । ॐ सुरनायिक्यै नमः । ॐ षट्शास्त्रनिपुणायै नमः । ॐ नित्यायै
    नमः । ॐ षड्दर्शनविचक्षणायै नमः । ॐ कालरात्र्यै नमः । ॐ कलातीतायै नमः । ॐ कविराजमनोहरायै नमः । ॐ शारदातिलकाकारायै
    नमः । ॐ धीरायै नमः । ॐ धीरजनप्रियायै नमः । ॐ उग्रभार्यै नमः । ॐ महाभार्यै नमः । ॐ क्षिप्रमार्यै नमः
    । ॐ रणप्रियायै नमः । ॐ अन्नपूर्णेश्वर्यै नमः । ॐ मात्रे नमः । ॐ स्वर्णाकारतटित्प्रभायै नमः । ॐ स्वरव्यंजनवर्णोदयायै
    नमः । ॐ गद्यपद्यादिकारणायै नमः । ॐ पदवाक्यार्थनिलयायै नमः । ॐ बिन्दुनादादिकारणायै नमः । ॐ मोक्षेशमहिष्यै
    नमः । ॐ सत्यायै नमः । ॐ भुक्तिमुक्तिफलप्रदायै नमः । ॐ विज्ञानदायिन्यै नमः । ॐ प्रज्ञायै नमः । ॐ प्रज्ञानफलदायिन्यै
    नमः । ॐ अहंकारकलातीतायै नमः । ॐ पराशक्त्यै नमः । ॐ परात्परायै नमः । । इति गौर्यष्टोत्तरशत नामावलिः
    ।
