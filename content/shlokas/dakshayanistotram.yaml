id: dakshayanistotram
category: stotram
name:
  english: dakshayanistotram
  devanagari: दाक्षायणीस्तोत्रम्
content:
  english: mashtatmata ca phalamashrayinamitiva | mudram vahan ghanadhiyo vatamulavasi modam tanotu mama
    mugdhashashankacudah || 19|| geham nakati garvitah pranamati strisangamo mokshati dveshi mitrati patakam
    sakatati kshamavallabho dasati | mrityurvaidyati dushanam sugunati tvatpadasevanat tvam vande bhavabhitibhanjanakarim
    gaurim girishapriye || 20|| pataya va patale sthapaya va sakalalokasamrajye | matastava padayugalam
    naham muncami naiva muncami || 21|| apadi kim karaniyam smaraniyam caranayugalamambayah | tatsmaranam
    kim kurute brahmadinapi ca kinkarikurute || 22|| matarme madhukaitabhanni mahishapranapaharodyame
    helanirmitadhumralocanavadhe he candamundardini | nishsheshikritaraktabijadanuje nitye nishumbhapahe
    shumbhadhvamsini samharashu duritam durge namaste'mbike || 23|| raktabhamarunamshukambaradharamanandapurnananam
    muktaharavibhushitam kucabharaklantam sakancigunam | devim divyarasannapatrakarakamambhojadarvikaram
    dhyaye shankaravallabham trinayanamanbam sadanapradam || 24|| udyadbhanunibham dukulavasanam kshirodamadhye
    shubhe mule kalpataroh sphuranmanimaye simhasane samsthitam | bibhranam karayoh suvarnacashakam bijam
    ca shalyudbhavam bhaktabhishtavarabhayanjaliputam dhyaye'nnapurneshvarim || 25|| vame payasapurnahemakalasham
    panau vahanti muda canye panitale suvarnaracitam darvi ca bhushojjvalam | amba shuddhadukulacitravasana
    karunyapurnekshana shyama kacana shankarapriyatama shatodari drishyate || 26|| karena cancanmanikankanena
    darvi dadhanam dhavalannapurnam | kadavaloke karunalavalam kashipurikalpalatam bhavanim || 27|| ya
    manikyamanojnaharavibhuna
  devanagari: मष्टात्मता च फलमाश्रयिणामितीव । मुद्रां वहन् घनधियो वटमूलवासी मोदं तनोतु मम मुग्धशशाङ्कचूडः
    ॥ १९॥ गेहं नाकति गर्वितः प्रणमति स्त्रीसङ्गमो मोक्षति द्वेषी मित्रति पातकं सकतति क्षमावल्लभो दासति
    । मृत्युर्वैद्यति दूषणं सुगुणति त्वत्पादसेवनात् त्वां वन्दे भवभीतिभञ्जनकरीं गौरीं गिरीशप्रिये ॥ २०॥
    पातय वा पाताले स्थापय वा सकललोकसाम्राज्ये । मातस्तव पदयुगलं नाहं मुञ्चामि नैव मुञ्चामि ॥ २१॥ आपदि
    किं करणीयं स्मरणीयं चरणयुगलमम्बायाः । तत्स्मरणं किं कुरुते ब्रह्मादीनपि च किङ्करीकुरुते ॥ २२॥ मातर्मे
    मधुकैटभन्नि महिषप्राणापहारोद्यमे हेलानिर्मितधूम्रलोचनवधे हे चण्डमुण्डार्दिनि । निश्शेषीकृतरक्तबीजदनुजे
    नित्ये निशुम्भापहे शुम्भध्वंसिनि संहराशु दुरितं दुर्गे नमस्तेऽम्बिके ॥ २३॥ रक्ताभामरुणांशुकाम्बरधरामानन्दपूर्णाननां
    मुक्ताहारविभूषितां कुचभरक्लान्तां सकाञ्चीगुणाम् । देवीं दिव्यरसान्नपात्रकरकामम्भोजदर्वीकरां ध्याये
    शङ्करवल्लभां त्रिणयनामन्बां सदानप्रदाम् ॥ २४॥ उद्यद्भानुनिभां दुकूलवसनां क्षीरोदमध्ये शुभे मूले कल्पतरोः
    स्फुरन्मणिमये सिंहासने संस्थिताम् । बिभ्राणां करयोः सुवर्णचषकं बीजं च शाल्युद्भवं भक्ताभीष्टवराभयाञ्जलिपुटां
    ध्यायेऽन्नपूर्णेश्वरीम् ॥ २५॥ वामे पायसपूर्णहेमकलशं पाणौ वहन्ती मुदा चान्ये पाणितले सुवर्णरचितां दर्वी
    च भूषोज्ज्वलाम् । अम्बा शुद्धदुकूलचित्रवसना कारुण्यपूर्णेक्षणा श्यामा काचन शङ्करप्रियतमा शातोदरी दृश्यते
    ॥ २६॥ करेण चञ्चन्मणिकङ्कणेन दर्वी दधानां धवलान्नपूर्णाम् । कदावलोके करुणालवालां काशीपुरीकल्पलतां भवानीम्
    ॥ २७॥ या माणिक्यमनोज्ञहारविभुना
