id: annamayya-keerthanas-ippuditu-kalaganti
category: stotram
name:
  english: Annamayya Keerthanas Ippuditu Kalaganti
content:
  english: khandacapu pallavi ippuditu kalaganti nèllalokamulaku | appadagu tiruvenkatadrishu ganti ||
    atishayambaina sheshadrishikharamu ganti | pratileni gopura prabhalu ganti | shatakoti surya tejamulu
    vèlugaga ganti | caturasyu bòdaganti cayyana melkònti || ippuditu kalaganti nèllalokamulaku kanakaratna
    kavata kantu lirugadaganti | ghanamaina dipasanghamulu ganti | anupama manimayammagu kiritamu ganti
    | kanakambaramu ganti grakkana melkònti || ippuditu kalaganti nèllalokamulaku arudaina shankha cakradu
    lirugada ganti | sarileni yabhaya hastamu ganti | tiruvenkatacaladhipuni judaga ganti | hari ganti
    guru ganti nantata melkanti || ippuditu kalaganti nèllalokamulaku | appadagu tiruvenkatadrishu ganti
    ||
  devanagari: खण्डचापु पल्लवि इप्पुडिटु कलगण्टि नॆल्ललोकमुलकु । अप्पडगु तिरुवेङ्कटाद्रीशु गण्टि ॥ अतिशयम्बैन
    शेषाद्रिशिखरमु गण्टि । प्रतिलेनि गोपुर प्रभलु गण्टि । शतकोटि सूर्य तेजमुलु वॆलुगग गण्टि । चतुरास्यु
    बॊडगण्टि चय्यन मेल्कॊण्टि ॥ इप्पुडिटु कलगण्टि नॆल्ललोकमुलकु कनकरत्न कवाट कान्तु लिरुगडगण्टि । घनमैन
    दीपसङ्घमुलु गण्टि । अनुपम मणीमयम्मगु किरीटमु गण्टि । कनकाम्बरमु गण्टि ग्रक्कन मेल्कॊण्टि ॥ इप्पुडिटु
    कलगण्टि नॆल्ललोकमुलकु अरुदैन शङ्ख चक्रादु लिरुगड गण्टि । सरिलेनि यभय हस्तमु गण्टि । तिरुवेङ्कटाचलाधिपुनि
    जूडग गण्टि । हरि गण्टि गुरु गण्टि नन्तट मेल्कण्टि ॥ इप्पुडिटु कलगण्टि नॆल्ललोकमुलकु । अप्पडगु तिरुवेङ्कटाद्रीशु
    गण्टि ॥
