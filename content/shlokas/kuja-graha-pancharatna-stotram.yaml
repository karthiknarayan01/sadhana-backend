id: kuja-graha-pancharatna-stotram
category: stotram
name:
  english: Kuja Graha Pancharatna Stotram
content:
  english: dharanigarbha sambhutam vidyukyantisamaprabham | kumaram shakti hastam tam mangalam pranamamyaham
    || || mahisuta mahabhago mangalo mangalapradah | mahaviro mahashuro mahabala parakramah || || bharadhvaja
    kulodbhuto bhusuto bhavya bhushanah | merum pradakshinam kritva sarvadevatma siddidam || || namaste
    mahashakti pane namaste lasadvajrapane | namaste katinyastapane namaste sadabhishtapane || || caturbhujam
    meshavahanam varadam vasudhapriyam | rattamalyambaradharam tam angarakam pranamamyaham ||
  devanagari: धरणीगर्भ सम्भूतं विद्युक्यान्तिसमप्रभम् । कुमारं शक्ति हस्तं तं मङ्गलं प्रणमाम्यहम् ॥ ॥
    महीसुत महाभागो मङ्गलो मङ्गलप्रदः । महावीरो महाशूरो महाबल पराक्रमः ॥ ॥ भरध्वाज कुलोद्भूतो भूसुतो भव्य
    भूषणः । मेरुं प्रदक्षिणं कृत्वा सर्वदेवात्म सिद्दिदम् ॥ ॥ नमस्ते महाशक्ति पाणे नमस्ते लसद्वज्रपाणे
    । नमस्ते कटिन्यस्तपाणे नमस्ते सदाभीष्टपाणे ॥ ॥ चतुर्भुजां मेषवाहनं वरदां वसुधाप्रियम् । रत्तमाल्याम्बरधरं
    तं अङ्गारकं प्रणमाम्यहम् ॥
