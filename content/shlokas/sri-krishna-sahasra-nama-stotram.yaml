  devanagari: ॐ अस्य श्रीकृष्णसहस्रनामस्तोत्रमन्त्रस्य पराशर ऋषिः श्रीकृष्णः परमात्मा देवता श्रीकृष्णप्रीत्यर्थे
    जपे विनियोगः ॥ न्यासः पराशराय ऋषये नमः इति शिरसि अनुष्टुप् छन्दसे नमः इति मुखे गोपालकृष्णदेवतायै नमः
    इति हृदये श्रीकृष्णाय बीजाय नमः इति गुह्ये श्रीवल्लभाय शक्त्यै नमः इति पादयोः शार्ङ्गधराय कीलकाय नमः
    इति सर्वाङ्गे ॥ करन्यासः श्रीकृष्ण इत्यारभ्य शूरवंशैकधीरित्यन्तानि अङ्गुष्ठाभ्यां नमः । शौरिरित्यारभ्य
    स्वभासोद्भासितव्रज इत्यन्तानि तर्जनीभ्यां नमः । कृतात्मविद्याविन्यास इत्यारभ्य प्रस्थानशकटारूढ इति
    मध्यमाभ्यां नमः बृन्दावनकृतालय इत्यारभ्य मधुराजनवीक्षित इत्यनामिकाभ्यां नमः रजकप्रतिघातक इत्यारभ्य
    द्वारकापुरकल्पन इति कनिष्ठिकाभ्यां नमः द्वारकानिलय इत्यारभ्य पराशर इति करतलकरपृष्ठाभ्यां नमः एवं हृदयादिन्यासः
    ॥ ध्यानम् केषाञ्चित्प्रेमपुंसां विगलितमनसां बाललीलाविलासं केषां गोपाललीलाङ्कितरसिकतनुर्वेणुवाद्येन
    देवम् । केषां वामासमाजे जनितमनसिजो दैत्यदर्पापहैवं ज्ञात्वा भिन्नाभिलाषं स जयति जगतामीश्वरस्तादृशोऽभूत्
    ॥ ॥ क्षीराब्धौ कृतसंस्तवस्सुरगणैर्ब्रह्मादिभिः पण्डितैः प्रोद्भूतो वसुदेवसद्मनि मुदा चिक्रीड यो गोकुले
    । कंसध्वंसकृते जगाम मधुरां सारामसद्वारकां गोपालोऽखिलगोपिकाजनसखः पायादपायात् स नः ॥ ॥ फुल्लेन्दीवरकान्तिमिन्दुवदनं
    बर्हावतंसप्रियं श्रीवत्साङ्कमुदारकौस्तुभधरं पीताम्बरं सुन्दरम् । गोपीनां नयनोत्पलार्चिततनुं गोगोपसङ्घावृतं
    गोविन्दं कलवेणुवादनरतं दिव्याङ्गभूषं भजे ॥ ॥ ओम् । कृष्णः श्रीवल्लभः शार्ङ्गी विष्वक्सेनः स्वसिद्धिदः
    । क्षीरोदधामा व्यूहेशः शेषशायी जगन्मयः ॥ ॥ भक्तिगम्यस्त्रयीमूर्तिर्भारार्तवसुधास्तुतः । देवदेवो दयासिन्धुर्देवदेवशिखामणिः
    ॥ ॥ सुखभावस्सुखाधारो मुकुन्दो मुदिताशयः । अविक्रियः क्रियामूर्तिरध्यात्मस्वस्वरूपवान् ॥ ॥ शिष्टाभिलक्ष्यो
    भूतात्मा धर्मत्राणार्थचेष्टितः । अन्तर्यामी कलारूपः कालावयवसाक्षिकः ॥ ॥ वसुधायासहरणो नारदप्रेरणोन्मुखः
    । प्रभूष्णुर्नारदोद्गीतो लोकरक्षापरायणः ॥ ॥ रौहिणेयकृतानन्दो योगज्ञाननियोजकः । महागुहान्तर्निक्षिप्तः
    पुराणवपुरात्मवान् ॥ ॥ शूरवंशैकधीश्शौरिः कंसशङ्काविषादकृत् । वसुदेवोल्लसच्छक्तिर्देवक्यष्टमगर्भगः ॥
    ॥ वसुदेवसुतः श्रीमान्देवकीनन्दनो हरिः । आश्चर्यबालः श्रीवत्सलक्ष्मवक्षाश्चतुर्भुजः ॥ ॥ स्वभावोत्कृष्टसद्भावः
    कृष्णाष्टम्यन्तसम्भवः । प्राजापत्यर्क्षसम्भूतो निशीथसमयोदितः ॥ ॥ शङ्खचक्रगदापद्मपाणिः पद्मनिभेक्षणः
    । किरीटी कौस्तुभोरस्कः स्फुरन्मकरकुण्डलः ॥ ॥ पीतवासा घनश्यामः कुञ्चिताञ्चितकुन्तलः । सुव्यक्तव्यक्ताभरणः
    सूतिकागृहभूषणः ॥ ॥ कारागारान्धकारघ्नः पितृप्राग्जन्मसूचकः । वसुदेवस्तुतः स्तोत्रं तापत्रयनिवारणः ॥
    ॥ निरवद्यः क्रियामूर्तिर्न्यायवाक्यनियोजकः । अदृष्टचेष्टः कूटस्थो धृतलौकिकविग्रहः ॥ ॥ महर्षिमानसोल्लासो
    महीमङ्गलदायकः । सन्तोषितसुरव्रातः साधुचित्तप्रसादकः ॥ ॥ जनकोपायनिर्देष्टा देवकीनयनोत्सवः । पितृपाणिपरिष्कारो
    मोहितागाररक्षकः ॥ ॥ स्वशक्त्युद्धाटिताशेषकपाटः पितृवाहकः । शेषोरगफणाच्छत्रश्शेषोक्ताख्यासहस्रकः ॥
    ॥ यमुनापूरविध्वंसी स्वभासोद्भासितव्रजः । कृतात्मविद्याविन्यासो योगमायाग्रसम्भवः ॥ ॥ दुर्गानिवेदितोद्भावो
    यशोदातल्पशायकः । नन्दगोपोत्सवस्फूर्तिर्व्रजानन्दकरोदयः ॥ ॥ सुजातजातकर्म श्रीर्गोपीभद्रोक्तिनिर्वृतः
    । अलीकनिद्रोपगमः पूतनास्तनपीडनः ॥ ॥ स्तन्यात्तपूतनाप्राणः पूतनाक्रोशकारकः । विन्यस्तरक्षागोधूलिर्यशोदाकरलालितः
    ॥ ॥ नन्दाघ्रातशिरोमध्यः पूतनासुगतिप्रदः । बालः पर्यङ्कनिद्रालुर्मुखार्पितपदाङ्गुलिः ॥ ॥ अञ्जनस्निग्धनयनः
    पर्यायाङ्कुरितस्मितः । लीलाक्षस्तरलालोकश्शकटासुरभञ्जनः ॥ ॥ द्विजोदितस्वस्त्ययनो मन्त्रपूतजलाप्लुतः
    । यशोदोत्सङ्गपर्यङ्को यशोदामुखवीक्षकः ॥ ॥ यशोदास्तन्यमुदितस्तृणावर्तादिदुस्सहः । तृणावर्तासुरध्वंसी
    मातृविस्मयकारकः ॥ ॥ प्रशस्तनामकरणो जानुचङ्क्रमणोत्सुकः । व्यालम्बिचूलिकारत्नो घोषगोपप्रहर्षणः ॥ ॥
    स्वमुखप्रतिबिम्बार्थी ग्रीवाव्याघ्रनखोज्ज्वलः । पङ्कानुलेपरुचिरो मांसलोरुकटीतटः ॥ ॥ घृष्टजानुकरद्वन्द्वः
    प्रतिबिम्बानुकारकृत् । अव्यक्तवर्णवाग्वृत्तिः स्मितलक्ष्यरदोद्गमः ॥ ॥ धात्रीकरसमालम्बी प्रस्खलच्चित्रचङ्क्रमः
    । अनुरूपवयस्याढ्यश्चारुकौमारचापलः ॥ ॥ वत्सपुच्छसमाकृष्टो वत्सपुच्छविकर्षणः । विस्मारितान्यव्यापारो
    गोपगोपीमुदावहः ॥ ॥ अकालवत्सनिर्मोक्ता व्रजव्याक्रोशसुस्मितः । नवनीतमहाचोरो दारकाहारदायकः ॥ ॥ पीठोलूखलसोपानः
    क्षीरभाण्डविभेदनः । शिक्यभाण्डसमाकर्षी ध्वान्तागारप्रवेशकृत् ॥ ॥ भूषारत्नप्रकाशाढ्यो गोप्युपालम्भभर्त्सितः
    । परागधूसराकारो मृद्भक्षणकृतेक्षणः ॥ ॥ बालोक्तमृत्कथारम्भो मित्रान्तर्गूढविग्रहः । कृतसन्त्रासलोलाक्षो
    जननीप्रत्ययावहः ॥ ॥ मातृदृश्यात्तवदनो वक्त्रलक्ष्यचराचरः । यशोदालालितस्वात्मा स्वयं स्वाच्छन्द्यमोहनः
    ॥ ॥ सवित्रीस्नेहसंश्लिष्टः सवित्रीस्तनलोलुपः । नवनीतार्थनाप्रह्वो नवनीतमहाशनः ॥ ॥ मृषाकोपप्रकम्पोष्ठो
    गोष्ठाङ्गणविलोकनः । दधिमन्थघटीभेत्ता किङ्किणीक्वाणसूचितः ॥ ॥ हैयङ्गवीनरसिको मृषाश्रुश्चौर्यशङ्कितः
    । जननीश्रमविज्ञाता दामबन्धनियन्त्रितः ॥ ॥ दामाकल्पश्चलापाङ्गो गाढोलूखलबन्धनः । आकृष्टोलूखलोऽनन्तः
    कुबेरसुतशापवित् ॥ । ॥ नारदोक्तिपरामर्शी यमलार्जुनभञ्जनः । धनदात्मजसङ्घुष्टो नन्दमोचितबन्धनः ॥ ॥ बालकोद्गीतनिरतो
    बाहुक्षेपोदितप्रियः । आत्मज्ञो मित्रवशगो गोपीगीतगुणोदयः ॥ ॥ प्रस्थानशकटारूढो बृन्दावनकृतालयः । गोवत्सपालनैकाग्रो
    नानाक्रीडापरिच्छदः ॥ ॥ क्षेपणीक्षेपणप्रीतो वेणुवाद्यविशारदः । वृषवत्सानुकरणो वृषध्वानविडम्बनः ॥ ॥
    नियुद्धलीलासंहृष्टः कूजानुकृतकोकिलः । उपात्तहंसगमनस्सर्वजन्तुरुतानुकृत् ॥ ॥ भृङ्गानुकारी दध्यन्नचोरो
    वत्सपुरस्सरः । बली बकासुरग्राही बकतालुप्रदाहकः ॥ ॥ भीतगोपार्भकाहूतो बकचञ्चुविदारणः । बकासुरारिर्गोपालो
    बालो बालाद्भुतावहः ॥ ॥ बलभद्रसमाश्लिष्टः कृतक्रीडानिलायनः । क्रीडासेतुनिधानज्ञः प्लवङ्गोत्प्लवनोऽद्भुतः
    ॥ ॥ कन्दुकक्रीडनो लुप्तनन्दादिभववेदनः । सुमनोऽलङ्कृतशिराः स्वादुस्निग्धान्नशिक्यभृत् ॥ ॥ गुञ्जाप्रालम्बनच्छन्नः
    पिञ्छैरलकवेषकृत् । वन्याशनप्रियः शृङ्गरवाकारितवत्सकः ॥ ॥ मनोज्ञपल्लवोत्तंसपुष्पस्वेच्छात्तषट्पदः ।
    मञ्जुशिञ्जितमञ्जीरचरणः करकङ्कणः ॥ ॥ अन्योन्यशासनः क्रीडापटुः परमकैतवः । प्रतिध्वानप्रमुदितः शाखाचतुरचङ्क्रमः
    ॥ ॥ अघदानवसंहर्ता व्रजविघ्नविनाशनः । व्रजसञ्जीवनः श्रेयोनिधिर्दानवमुक्तिदः ॥ ॥ कालिन्दीपुलिनासीनस्सहभुक्तव्रजार्भकः
    । कक्षाजठरविन्यस्तवेणुर्वल्लवचेष्टितः ॥ ॥ भुजसन्ध्यन्तरन्यस्तशृङ्गवेत्रः शुचिस्मितः । वामपाणिस्थदध्यन्नकबलः
    कलभाषणः ॥ ॥ अङ्गुल्यन्तरविन्यस्तफलः परमपावनः । अदृश्यतर्णकान्वेषी वल्लवार्भकभीतिहा ॥ ॥ अदृष्टवत्सपव्रातो
    ब्रह्मविज्ञातवैभवः । गोवत्सवत्सपान्वेषी विराट् ॥ स्वसङ्कल्पानुरूपार्थो वत्सवत्सपरूपधृक् । यथावत्सक्रियारूपो
    यथास्थाननिवेशनः ॥ ॥ यथाव्रजार्भकाकारो गोगोपीस्तन्यपस्सुखी । चिराद्वलोहितो दान्तो ब्रह्मविज्ञातवैभवः
    ॥ ॥ विचित्रशक्तिर्व्यालीनसृष्टगोवत्सवत्सपः । ब्रह्मत्रपाकरो धातृस्तुतस्सर्वार्थसाधकः ॥ ॥ ब्रह्म ब्रह्ममयोऽव्यक्तस्तेजोरूपस्सुखात्मकः
    । निरुक्तं व्याकृतिर्व्यक्तो निरालम्बनभावनः ॥ ॥ प्रभविष्णुरतन्त्रीको देवपक्षार्थरूपधृक् । अकामस्सर्ववेदादिरणीयस्थूलरूपवान्
    ॥ ॥ व्यापी व्याप्यः कृपाकर्ता विचित्राचारसम्मतः । छन्दोमयः प्रधानात्मा मूर्तामूर्तिद्वयाकृतिः ॥ ॥
    अनेकमूर्तिरक्रोधः परः प्रकृतिरक्रमः । सकलावरणोपेतस्सर्वदेवो महेश्वरः ॥ ॥ महाप्रभावनः पूर्ववत्सवत्सपदर्शकः
    । कृष्णयादवगोपालो गोपालोकनहर्षितः ॥ ॥ स्मितेक्षाहर्षितब्रह्मा भक्तवत्सलवाक्प्रियः । ब्रह्मानन्दाश्रुधौताङ्घ्रिर्लीलावैचित्र्यकोविदः
    ॥ ॥ बलभद्रैकहृदयो नामाकारितगोकुलः । गोपालबालको भव्यो रज्जुयज्ञोपवीतवान् ॥ ॥ वृक्षच्छायाहताशान्तिर्गोपोत्सङ्गोपबर्हणः
    । गोपसंवाहितपदो गोपव्यजनवीजितः ॥ । गोपगानसुखोन्निद्रः श्रीदामार्जितसौहृदः । सुनन्दसुहृदेकात्मा सुबलप्राणरञ्जनः
    ॥ ॥ तालीवनकृतक्रीडो बलपातितधेनुकः । गोपीसौभाग्यसम्भाव्यो गोधूलिच्छुरितालकः ॥ ॥ गोपीविरहसन्तप्तो गोपिकाकृतमज्जनः
    । प्रलम्बबाहुरुत्फुल्लपुण्डरीकावतंसकः ॥ ॥ विलासललितस्मेरगर्भलीलावलोकनः । स्रग्भूषणानुलेपाढ्यो जनन्युपहृतान्नभुक्
    ॥ ॥ वरशय्याशयो राधाप्रेमसल्लापनिर्वृतः । यमुनातटसञ्चारी विषार्तव्रजहर्षदः ॥ ॥ कालियक्रोधजनकः वृद्धाहिकुलवेष्टितः
    । कालियाहिफणारङ्गनटः कालियमर्दनः ॥ ॥ नागपत्नीस्तुतिप्रीतो नानावेषसमृद्धिकृत् । अविष्वक्तदृगात्मेशः
    स्वदृगात्मस्तुतिप्रियः ॥ ॥ सर्वेश्वरस्सर्वगुणः प्रसिद्धस्सर्वसात्वतः । अकुण्ठधामा चन्द्रार्कदृष्टिराकाशनिर्मलः
    ॥ ॥ अनिर्देश्यगतिर्नागवनितापतिभैक्षदः । स्वाङ्घ्रिमुद्राङ्कनागेन्द्रमूर्धा कालियसंस्तुतः ॥ ॥ अभयो
    विश्वतश्चक्षुः स्तुतोत्तमगुणः प्रभुः । अहमात्मा मरुत्प्राणः परमात्मा द्युशीर्षवान् ॥ ॥ नागोपायनहृष्टात्मा
    ह्रदोत्सारितकालियः । बलभद्रसुखालापो गोपालिङ्गननिर्वृतः ॥ ॥ दावाग्निभीतगोपालगोप्ता दावाग्निनाशनः ।
    नयनाच्छादनक्रीडालम्पटो नृपचेष्टितः ॥ ॥ काकपक्षधरस्सौम्यो बलवाहककेलिमान् । बलघातितदुर्धर्षप्रलम्बो
    बलवत्सलः ॥ ॥ मुञ्जाटव्यग्निशमनः प्रावृट्कालविनोदवान् । शिलान्यस्तान्नभृद्दैत्यसंहर्ता शाद्वलासनः ॥
    ॥ सदाप्तगोपिकोद्गीतः कर्णिकारावतंसकः । नटवेषधरः पद्ममालाङ्को गोपिकावृतः ॥ ॥ गोपीमनोहरापाङ्गो वेणुवादनतत्परः
    । विन्यस्तवदनाम्भोजश्चारुशब्दकृताननः ॥ ॥ बिम्बाधरार्पितोदारवेणुर्विश्वविमोहनः । व्रजसंवर्णितश्राव्यवेणुनादः
    श्रुतिप्रियः ॥ ॥ गोगोपगोपीजन्मेप्सुर्ब्रह्मेन्द्राद्यभिवन्दितः । गीतस्नुतिसरित्पूरो नादनर्तितबर्हिणः
    ॥ ॥ रागपल्लवितस्थाणुर्गीतानमितपादपः । विस्मारिततृणग्रासमृगो मृगविलोभितः ॥ ॥ व्याघ्रादिहिंस्रसहजवैरहर्ता
    सुगायनः । गाढोदीरितगोबृन्दप्रेमोत्कर्णिततर्णकः ॥ ॥ निष्पन्दयानब्रह्मादिवीक्षितो विश्ववन्दितः । शाखोत्कर्णशकुन्तौघश्छत्रायितबलाहकः
    ॥ ॥ प्रसन्नः परमानन्दश्चित्रायितचराचरः । गोपिकामदनो गोपीकुचकुङ्कुममुद्रितः ॥ ॥ गोपिकन्याजलक्रीडाहृष्टो
    गोप्यंशुकापहृत् । स्कन्धारोपितगोपस्त्रीवासाः कुन्दनिभस्मितः ॥ ॥ गोपीनेत्रोत्पलशशी गोपिकायाचितांशुकः
    । गोपीनमस्क्रियादेष्टा गोप्येककरवन्दितः ॥ ॥ गोप्यञ्जलिविशेषार्थी गोपक्रीडाविलोभितः । शान्तवासस्फुरद्गोपीकृताञ्जलिरघापहः
    ॥ ॥ गोपीकेलिविलासार्थी गोपीसम्पूर्णकामदः । गोपस्त्रीवस्त्रदो गोपीचित्तचोरः कुतूहली ॥ ॥ बृन्दावनप्रियो
    गोपबन्धुर्यज्वान्नयाचिता । यज्ञेशो यज्ञभावज्ञो यज्ञपत्न्यभिवाञ्छितः ॥ ॥ मुनिपत्नीवितीर्णान्नतृप्तो
    मुनिवधूप्रियः । द्विजपत्न्यभिभावज्ञो द्विजपत्नीवरप्रदः ॥ ॥ प्रतिरुद्धसतीमोक्षप्रदो द्विजविमोहिता ।
    मुनिज्ञानप्रदो यज्वस्तुतो वासवयागवित् ॥ ॥ पितृप्रोक्तक्रियारूपशक्रयागनिवारणः । शक्राऽमर्षकरश्शक्रवृष्टिप्रशमनोन्मुखः
    ॥ ॥ गोवर्धनधरो गोपगोबृन्दत्राणतत्परः । गोवर्धनगिरिच्छत्रचण्डदण्डभुजार्गलः ॥ ॥ सप्ताहविधृताद्रीन्द्रो
    मेघवाहनगर्वहा । भुजाग्रोपरिविन्यस्तक्ष्माधरक्ष्माभृदच्युतः ॥ ॥ स्वस्थानस्थापितगिरिर्गोपीदध्यक्षतार्चितः
    । सुमनस्सुमनोवृष्टिहृष्टो वासववन्दितः ॥ ॥ कामधेनुपयःपूराभिषिक्तस्सुरभिस्तुतः । धराङ्घ्रिरोषधीरोमा
    धर्मगोप्ता मनोमयः ॥ ॥ ज्ञानयज्ञप्रियश्शास्त्रनेत्रस्सर्वार्थसारथिः । ऐरावतकरानीतवियद्गङ्गाप्लुतो विभुः
    ॥ ॥ ब्रह्माभिषिक्तो गोगोप्ता सर्वलोकशुभङ्करः । सर्ववेदमयो मग्ननन्दान्वेषिपितृप्रियः ॥ ॥ वरुणोदीरितात्मेक्षाकौतुको
    वरुणार्चितः । वरुणानीतजनको गोपज्ञातात्मवैभवः ॥ ॥ स्वर्लोकालोकसंहृष्टगोपवर्गत्रिवर्गदः । ब्रह्महृद्गोपितो
    गोपद्रष्टा ब्रह्मपदप्रदः ॥ ॥ शरच्चन्द्रविहारोत्कः श्रीपतिर्वशको क्षमः । भयापहो भर्तृरुद्धगोपिकाध्यानगोचरः
    ॥ ॥ गोपिकानयनास्वाद्यो गोपीनर्मोक्तिनिर्वृतः । गोपिकामानहरणो गोपिकाशतयूथपः ॥ ॥ वैजयन्तीस्रगाकल्पो
    गोपिकामानवर्धनः । गोपकान्तासुनिर्देष्टा कान्तो मन्मथमन्मथः ॥ ॥ स्वात्मास्यदत्तताम्बूलः फलितोत्कृष्टयौवनः
    । वल्लवीस्तनसक्ताक्षो वल्लवीप्रेमचालितः ॥ ॥ गोपीचेलाञ्चलासीनो गोपीनेत्राब्जषट्पदः । रासक्रीडासमासक्तो
    गोपीमण्डलमण्डनः ॥ ॥ गोपीहेममणिश्रेणिमध्येन्द्रमणिरुज्ज्वलः । विद्याधरेन्दुशापघ्नश्शङ्खचूडशिरोहरः ॥
    ॥ शङ्खचूडशिरोरत्नसम्प्रीणितबलोऽनघः । अरिष्टारिष्टकृद्दुष्टकेशिदैत्यनिषूदनः ॥ ॥ सरसस्सस्मितमुखस्सुस्थिरो
    विरहाकुलः । सङ्कर्षणार्पितप्रीतिरक्रूरध्यानगोचरः ॥ ॥ अक्रूरसंस्तुतो गूढो गुणवृत्युपलक्षितः । प्रमाणगम्यस्तन्मात्राऽवयवी
    बुद्धितत्परः ॥ ॥ सर्वप्रमाणप्रमधीस्सर्वप्रत्ययसाधकः । पुरुषश्च प्रधानात्मा विपर्यासविलोचनः ॥ ॥ मधुराजनसंवीक्ष्यो
    रजकप्रतिघातकः । विचित्राम्बरसंवीतो मालाकारवरप्रदः ॥ ॥ कुब्जावक्रत्वनिर्मोक्ता कुब्जायौवनदायकः । कुब्जाङ्गरागसुरभिः
    कंसकोदण्डखण्डनः ॥ ॥ धीरः कुवलयापीडमर्दनः कंसभीतिकृत् । दन्तिदन्तायुधो रङ्गत्रासको मल्लयुद्धवित् ॥
    ॥ चाणूरहन्ता कंसारिर्देवकीहर्षदायकः । वसुदेवपदानम्रः पितृबन्धविमोचनः ॥ ॥ उर्वीभयापहो भूप उग्रसेनाधिपत्यदः
    । आज्ञास्थितशचीनाथस्सुधर्मानयनक्षमः ॥ ॥ आद्यो द्विजातिसत्कर्ता शिष्टाचारप्रदर्शकः । सान्दीपनिकृताभ्यस्तविद्याभ्यासैकधीस्सुधीः
    ॥ ॥ गुर्वभीष्टक्रियादक्षः पश्चिमोदधिपूजितः । हतपञ्चजनप्राप्तपाञ्चजन्यो यमार्चितः ॥ ॥ धर्मराजजयानीतगुरुपुत्र
    उरुक्रमः । गुरुपुत्रप्रदश्शास्ता मधुराजसभासदः ॥ ॥ जामदग्न्यसमभ्यर्च्यो गोमन्तगिरिसञ्चरः । गोमन्तदावशमनो
    गरुडानीतभूषणः ॥ ॥ चक्राद्यायुधसंशोभी जरासन्धमदापहः । सृगालावनिपालघ्नस्सृगालात्मजराज्यदः ॥ ॥ विध्वस्तकालयवनो
    मुचुकुन्दवरप्रदः । आज्ञापितमहाम्भोधिर्द्वारकापुरकल्पनः ॥ ॥ द्वारकानिलयो रुक्मिमानहन्ता यदूद्वहः ।
    रुचिरो रुक्मिणीजानिः प्रद्युम्नजनकः प्रभुः ॥ ॥ अपाकृतत्रिलोकार्तिरनिरुद्धपितामहः । अनिरुद्धपदान्वेषी
    चक्री गरुडवाहनः ॥ ॥ बाणासुरपुरीरोद्धा रक्षाज्वलनयन्त्रजित् । धूतप्रमथसंरम्भो जितमाहेश्वरज्वरः ॥ ॥
    षट्चक्रशक्तिनिर्जेता भूतवेतालमोहकृत् । शम्भुत्रिशूलजिच्छम्भुजृम्भणश्शम्भुसंस्तुतः ॥ ॥ इन्द्रियात्मेन्दुहृदयस्सर्वयोगेश्वरेश्वरः
    । हिरण्यगर्भहृदयो मोहावर्तनिवर्तनः ॥ ॥ आत्मज्ञाननिधिर्मेधा कोशस्तन्मात्ररूपवान् । इन्द्रोऽग्निवदनः
    कालनाभस्सर्वागमाध्वगः ॥ ॥ तुरीयसर्वधीसाक्षी द्वन्द्वारामात्मदूरगः । अज्ञातपारो वश्यश्रीरव्याकृतविहारवान्
    ॥ ॥ आत्मप्रदीपो विज्ञानमात्रात्मा श्रीनिकेतनः । बाणबाहुवनच्छेत्ता महेन्द्रप्रीतिवर्धनः ॥ ॥ अनिरुद्धनिरोधज्ञो
    जलेशाहृतगोकुलः । जलेशविजयी वीरस्सत्राजिद्रत्नयाचकः ॥ ॥ प्रसेनान्वेषणोद्युक्तो जाम्बवद्धृतरत्नदः ।
    जितर्क्षराजतनयाहर्ता जाम्बवतीप्रियः ॥ ॥ सत्यभामाप्रियः कामश्शतधन्वशिरोहरः । कालिन्दीपतिरक्रूरबन्धुरक्रूररत्नदः
    ॥ ॥ कैकेयीरमणो भद्राभर्ता नाग्नजितीधवः । माद्रीमनोहरश्शैब्याप्राणबन्धुरुरुक्रमः ॥ ॥ सुशीलादयितो मित्रविन्दानेत्रमहोत्सवः
    । लक्ष्मणावल्लभो रुद्धप्राग्ज्योतिषमहापुरः ॥ ॥ सुरपाशावृतिच्छेदी मुरारिः क्रूरयुद्धवित् । हयग्रीवशिरोहर्ता
    सर्वात्मा सर्वदर्शनः ॥ ॥ नरकासुरविच्छेत्ता नरकात्मजराज्यदः। पृथ्वीस्तुतः प्रकाशात्मा हृद्यो यज्ञफलप्रदः
    ॥ ॥ गुणग्राही गुणद्रष्टा गूढस्वात्मा विभूतिमान् । कविर्जगदुपद्रष्टा परमाक्षरविग्रहः ॥ ॥ प्रपन्नपालनो
    माली महद्ब्रह्मविवर्धनः । वाच्यवाचकशक्त्यर्थस्सर्वव्याकृतसिद्धिदः ॥ ॥ स्वयम्प्रभुरनिर्वेद्यस्स्वप्रकाशश्चिरन्तनः
    । नादात्मा मन्त्रकोटीशो नानावादनिरोधकः ॥ ॥ कन्दर्पकोटिलावण्यः परार्थैकप्रयोजकः । अमरीकृतदेवौघः कन्यकाबन्धमोचनः
    ॥ ॥ षोडशस्त्रीसहस्रेशः कान्तः कान्तामनोभवः । क्रीडारत्नाचलाहर्ता वरुणच्छत्रशोभितः ॥ ॥ शक्राभिवन्दितश्शक्रजननीकुण्डलप्रदः
    । अदितिप्रस्तुतस्तोत्रो ब्राह्मणोद्घुष्टचेष्टनः ॥ ॥ पुराणस्संयमी जन्मालिप्तः षड्विंशकोऽर्थदः । यशस्यनीतिराद्यन्तरहितस्सत्कथाप्रियः
    ॥ ॥ ब्रह्मबोधः परानन्दः पारिजातापहारकः । पौण्ड्रकप्राणहरणः काशिराजनिषूदनः ॥ ॥ कृत्यागर्वप्रशमनो विचक्रवधदीक्षितः
    । कंसविध्वंसनस्साम्बजनको डिम्भकार्दनः ॥ ॥ मुनिर्गोप्ता पितृवरप्रदस्सवनदीक्षितः । रथी सारथ्यनिर्देष्टा
    फाल्गुनः फाल्गुनिप्रियः ॥ ॥ सप्ताब्धिस्तम्भनोद्भातो हरिस्सप्ताब्धिभेदनः । आत्मप्रकाशः पूर्णश्रीरादिनारायणेक्षितः
    ॥ ॥ विप्रपुत्रप्रदश्चैव सर्वमातृसुतप्रदः । पार्थविस्मयकृत्पार्थप्रणवार्थप्रबोधनः ॥ ॥ कैलासयात्रासुमुखो
    बदर्याश्रमभूषणः । घण्टाकर्णक्रियामौढ्यात्तोषितो भक्तवत्सलः ॥ ॥ मुनिबृन्दादिभिर्ध्येयो घण्टाकर्णवरप्रदः
    । तपश्चर्यापरश्चीरवासाः पिङ्गजटाधरः ॥ ॥ प्रत्यक्षीकृतभूतेशश्शिवस्तोता शिवस्तुतः । कृष्णास्वयंवरालोककौतुकी
    सर्वसम्मतः ॥ ॥ बलसंरम्भशमनो बलदर्शितपाण्डवः । यतिवेषार्जुनाभीष्टदायी सर्वात्मगोचरः ॥ ॥ सुभद्राफाल्गुनोद्वाहकर्ता
    प्रीणितफाल्गुनः । खाण्डवप्रीणितार्चिष्मान्मयदानवमोचनः ॥ ॥ सुलभो राजसूयार्हयुधिष्ठिरनियोजकः । भीमार्दितजरासन्धो
    मागधात्मजराज्यदः ॥ ॥ राजबन्धननिर्मोक्ता राजसूयाग्रपूजनः । चैद्याद्यसहनो भीष्मस्तुतस्सात्वतपूर्वजः
    ॥ ॥ सर्वात्मार्थसमाहर्ता मन्दराचलधारकः । यज्ञावतारः प्रह्लादप्रतिज्ञाप्रतिपालकः ॥ ॥ बलियज्ञसभाध्वंसी
    दृप्तक्षत्रकुलान्तकः । दशग्रीवान्तको जेता रेवतीप्रेमवल्लभः ॥ ॥ सर्वावताराधिष्ठाता वेदबाह्यविमोहनः
    । कलिदोषनिराकर्ता दशनामा दृढव्रतः ॥ ॥ अमेयात्मा जगत्स्वामी वाग्मी चैद्यशिरोहरः । द्रौपदीरचितस्तोत्रः
    केशवः पुरुषोत्तमः ॥ ॥ नारायणो मधुपतिर्माधवो दोषवर्जितः । गोविन्दः पुण्डरीकाक्षो विष्णुश्च मधुसूदनः
    ॥ ॥ त्रिविक्रमस्त्रिलोकेशो वामनः श्रीधरः पुमान् । हृषीकेशो वासुदेवः पद्मनाभो महाह्रदः ॥ ॥ दामोदरश्चतुर्व्यूहः
    पाञ्चालीमानरक्षणः । साल्वघ्नस्समरश्लाघी दन्तवक्त्रनिबर्हणः ॥ ॥ दामोदरप्रियसखा पृथुकास्वादनप्रियः ॥
    घृणी दामोदरः श्रीदो गोपीपुनरवेक्षकः ॥ ॥ गोपिकामुक्तिदो योगी दुर्वासस्तृप्तिकारकः । अविज्ञातव्रजाकीर्णपाण्डवालोकनो
    जयी ॥ ॥ पार्थसारथ्यनिरतः प्राज्ञः पाण्डवदूत्यकृत् । विदुरातिथ्यसन्तुष्टः कुन्तीसन्तोषदायकः ॥ ॥ सुयोधनतिरस्कर्ता
    दुर्योधनविकारवित् । विदुराभिष्ठुतो नित्यो वार्ष्णेयो मङ्गलात्मकः ॥ ॥ पञ्चविंशतितत्त्वेशश्चतुर्विंशतिदेहभाक्
    । सर्वानुग्राहकस्सर्वदाशार्हसततार्चितः ॥ ॥ अचिन्त्यो मधुरालापस्साधुदर्शी दुरासदः । मनुष्यधर्मानुगतः
    कौरवेन्द्रक्षयेक्षिता ॥ ॥ उपेन्द्रो दानवारातिरुरुगीतो महाद्युतिः । ब्रह्मण्यदेवः श्रुतिमान् गोब्राह्मणहिताशयः
    ॥ ॥ वरशीलश्शिवारम्भस्सुविज्ञानविमूर्तिमान् । स्वभावशुद्धस्सन्मित्रस्सुशरण्यस्सुलक्षणः ॥ ॥ धृतराष्ट्रगतौदृष्टिप्रदः
    कर्णविभेदनः । प्रतोदधृग्विश्वरूपविस्मारितधनञ्जयः ॥ ॥ सामगानप्रियो धर्मधेनुर्वर्णोत्तमोऽव्ययः । चतुर्युगक्रियाकर्ता
    विश्वरूपप्रदर्शकः ॥ ॥ ब्रह्मबोधपरित्रातपार्थो भीष्मार्थचक्रभृत् । अर्जुनायासविध्वंसी कालदंष्ट्राविभूषणः
    ॥ ॥ सुजातानन्तमहिमा स्वप्नव्यापारितार्जुनः । अकालसन्ध्याघटनश्चक्रान्तरितभास्करः ॥ ॥ दुष्टप्रमथनः पार्थप्रतिज्ञापरिपालकः
    । सिन्धुराजशिरःपातस्थानवक्ता विवेकदृक् ॥ ॥ सुभद्राशोकहरणो द्रोणोत्सेकादिविस्मितः । पार्थमन्युनिराकर्ता
    पाण्डवोत्सवदायकः ॥ ॥ अङ्गुष्ठाक्रान्तकौन्तेयरथश्शक्तोऽहिशीर्षजित् । कालकोपप्रशमनो भीमसेनजयप्रदः ॥
    ॥ अश्वत्थामवधायासत्रातपाण्डुसुतः कृती । इषीकास्त्रप्रशमनो द्रौणिरक्षाविचक्षणः ॥ ॥ पार्थापहारितद्रौणिचूडामणिरभङ्गुरः
    । धृतराष्ट्रपरामृष्टभीमप्रतिकृतिस्मयः ॥ ॥ भीष्मबुद्धिप्रदश्शान्तश्शरच्चन्द्रनिभाननः । गदाग्रजन्मा
    पाञ्चालीप्रतिज्ञापरिपालकः ॥ ॥ गान्धारीकोपदृग्गुप्तधर्मसूनुरनामयः । प्रपन्नार्तिभयच्छेत्ता भीष्मशल्यव्यधावहः
    ॥ ॥ शान्तश्शान्तनवोदीर्णसर्वधर्मसमाहितः । स्मारितब्रह्मविद्यार्थप्रीतपार्थो महास्त्रवित् ॥ ॥ प्रसादपरमोदारो
    गाङ्गेयसुगतिप्रदः । विपक्षपक्षक्षयकृत्परीक्षित्प्राणरक्षणः ॥ ॥ जगद्गुरुर्धर्मसूनोर्वाजिमेधप्रवर्तकः
    । विहितार्थाप्तसत्कारो मासकात्परिवर्तदः ॥ ॥ उत्तङ्कहर्षदात्मीयदिव्यरूपप्रदर्शकः । जनकावगतस्वोक्तभारतस्सर्वभावनः
    ॥ ॥ असोढयादवोद्रेको विहिताप्तादिपूजनः ॥ समुद्रस्थापिताश्चर्यमुसलो वृष्णिवाहकः ॥ ॥ मुनिशापायुधः पद्मासनादित्रिदशार्थितः
    । वृष्टिप्रत्यवहारोत्कस्स्वधामगमनोत्सुकः ॥ ॥ प्रभासालोकनोद्युक्तो नानाविधनिमित्तकृत् । सर्वयादवसंसेव्यस्सर्वोत्कृष्टपरिच्छदः
    ॥ ॥ वेलाकाननसञ्चारी वेलानिलहृतश्रमः । कालात्मा यादवोऽनन्तस्स्तुतिसन्तुष्टमानसः ॥ ॥ द्विजालोकनसन्तुष्टः
    पुण्यतीर्थमहोत्सवः । सत्काराह्लादिताशेषभूसुरस्सुरवल्लभः ॥ ॥ पुण्यतीर्थाप्लुतः पुण्यः पुण्यदस्तीर्थपावनः
    । विप्रसात्कृतगोकोटिश्शतकोटिसुवर्णदः ॥ ॥ स्वमायामोहिताऽशेषवृष्णिवीरो विशेषवित् । जलजायुधनिर्देष्टा
    स्वात्मावेशितयादवः ॥ ॥ देवताभीष्टवरदः कृतकृत्यः प्रसन्नधीः । स्थिरशेषायुतबलस्सहस्रफणिवीक्षणः ॥ ॥ ब्रह्मवृक्षवरच्छायासीनः
    पद्मासनस्थितः । प्रत्यगात्मा स्वभावार्थः प्रणिधानपरायणः ॥ ॥ व्याधेषुविद्धपूज्याङ्घ्रिर्निषादभयमोचनः
    । पुलिन्दस्तुतिसन्तुष्टः पुलिन्दसुगतिप्रदः ॥ ॥ दारुकार्पितपार्थादिकरणीयोक्तिरीशिता । दिव्यदुन्दुभिसंयुक्तः
    पुष्पवृष्टिप्रपूजितः ॥ ॥ पुराणः परमेशानः पूर्णभूमा परिष्टुतः । पतिराद्यः परं ब्रह्म परमात्मा परात्परः
    ॥ ॥ श्रीपरमात्मा परात्परः ॐ नमः इति । फलश्रुतिः इदं सहस्रं कृष्णस्य नाम्नां सर्वार्थदायकम् । अनन्तरूपी
    भगवान् व्याख्यातादौ स्वयम्भुवे ॥ ॥ तेन प्रोक्तं वसिष्ठाय ततो लब्ध्वा पराशरः । व्यासाय तेन सम्प्रोक्तं
    शुको व्यासादवाप्तवान् ॥ ॥ तच्छिष्यैर्बहुभिर्भूमौ ख्यापितं द्वापरे युगे । कृष्णाज्ञया हरिहरः कलौ प्रख्यापयद्विभुः
    ॥ ॥ इदं पठति भक्त्या यः शृणोति च समाहितः । स्वसिद्ध्यै प्रार्थयन्त्येनं तीर्थक्षेत्रादिदेवताः ॥ ॥
    प्रायश्चित्तान्यशेषाणि नालं यानि व्यपोहितुम् । तानि पापानि नश्यन्ति सकृदस्य प्रशंसनात् ॥ ॥ ऋणत्रयविमुक्तस्य
    श्रौतस्मार्तानुवर्तिनः । ऋषेस्त्रिमूर्तिरूपस्य फलं विन्देदिदं पठन् ॥ ॥ इदं नामसहस्रं यः पठत्येतच्छृणोति
    च । शिवलिङ्गसहस्रस्य स प्रतिष्ठाफलं लभेत् ॥ ॥ इदं किरीटी सञ्जप्य जयी पाशुपतास्त्रभाक् । कृष्णस्य प्राणभूतस्सन्
    कृष्णं सारथिमाप्तवान् ॥ ॥ द्रौपद्या दमयन्त्या च सावित्र्या च सुशीलया । दुरितानि जितान्येतज्जपादाप्तं
    च वाञ्छितम् ॥ ॥ किमिदं बहुना शंसन्मानवो मोदनिर्भरः । ब्रह्मानन्दमवाप्यान्ते कृष्णसायूज्यमाप्नुयात्
    ॥
