    नमः । ॐ दिव्यज्ञानायै नमः । ॐ सर्वमङ्गलरूपिण्यै नमः । ॐ सर्वानुग्रहप्रदायिन्यै नमः । ॐ ओङ्कारस्वरूपिण्यै
    नमः । ॐ ब्रह्मज्ञानसम्भूतायै नमः । ॐ पद्मावत्यै नमः । ॐ सद्योवेदवत्यै नमः । ॐ श्री महालक्ष्मै नमः
    ।
