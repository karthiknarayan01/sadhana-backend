id: haratistotram
category: stotram
name:
  english: haratistotram
  devanagari: हारतीस्तोत्रम्
content:
  english: haratistotram shri haratidevyaih namah | kundaprasunasadrishim rucirangaragam nanavibhushanavibhushitavajradeham
    | savyena hastakamalena bhayartihantrim yaksheshvarim bahusutam pranamami bhaktya || 1|| alingitam
    nijamasavyabhujena putran netraistribhishca parishobhitacarudeham | nanavidhairmaniganai racitam kiritam
    yaksheshvarim bahusutam pranamami bhaktya || 2|| tam vahnimandalagatam vasupatrapadme shriratnapitha
    uparisthitapadapadmam | yakshadibhih parivritam lalitasanastham yaksheshvarim bahusutam pranamami
    bhaktya || 3|| lokatrayartishamanim shishujivadatrim shriharatim karunaya nijabhaktadaksham | duhkhapaham
    janamanoharabhogabhajam yaksheshvarim bahusutam pranamami bhaktya || 4|| santrasinim pishunavrittivatam
    jananam visphotakadirujarashivinashakartrim | bhakteshu dhatrisadrishim ca sushitalangim yaksheshvarim
    bahusutam pranamami bhaktya || 5|| buddhanushasanaratamatisukshmarupam lokatrayarcitapadam karunarcibhutam
    | gandharvakinnaraganaih parisevyamanam yaksheshvarim bahusutam pranamami bhaktya || 6|| keyurakundalasukankananupuradhyam
    nanavicitravasanapradadhanashilam | samrakshanim shishuganan paripalayantim yaksheshvarim bahusutam
    pranamami bhaktya || 7|| svarbhurasatalamavasthitabhuktidana
  devanagari: हारतीस्तोत्रम् श्री हारतीदेव्यैः नमः । कुन्दप्रसूनसदृशीं रुचिराङ्गरागां नानाविभूषणविभूषितवज्रदेहाम्
    । सव्येन हस्तकमलेन भयार्तिहन्त्रीं यक्षेश्वरीं बहुसुतां प्रणमामि भक्त्या ॥ १॥ आलिङ्गितां निजमसव्यभुजेन
    पुत्रान् नेत्रैस्त्रिभिश्च परिशोभितचारुदेहाम् । नानाविधैर्मणिगणै रचितं किरीटं यक्षेश्वरीं बहुसुतां
    प्रणमामि भक्त्या ॥ २॥ तां वह्निमण्डलगतां वसुपत्रपद्मे श्रीरत्नपीठ उपरिस्थितपादपद्माम् । यक्षादिभिः
    परिवृतां ललितासनस्थां यक्षेश्वरीं बहुसुतां प्रणमामि भक्त्या ॥ ३॥ लोकत्रयार्तिशमनीं शिशुजीवदात्रीं
    श्रीहारतीं करुणया निजभक्तदक्षाम् । दुःखापहां जनमनोहरभोगभाजां यक्षेश्वरीं बहुसुतां प्रणमामि भक्त्या
    ॥ ४॥ सन्त्रासिनीं पिशुनवृत्तिवतां जनानां विस्फोटकादिरुजराशिविनाशकर्त्रीम् । भक्तेषु धातृसदृशीं च सुशीतलाङ्गीं
    यक्षेश्वरीं बहुसुतां प्रणमामि भक्त्या ॥ ५॥ बुद्धानुशासनरतामतिसूक्ष्मरूपां लोकत्रयार्चितपदां करुणार्चिभूताम्
    । गन्धर्वकिन्नरगणैः परिसेव्यमानां यक्षेश्वरीं बहुसुतां प्रणमामि भक्त्या ॥ ६॥ केयूरकुण्डलसुकङ्कणनूपुराढ्यां
    नानाविचित्रवसनप्रदधानशीलाम् । संरक्षणीं शिशुगणान् परिपालयन्तीं यक्षेश्वरीं बहुसुतां प्रणमामि भक्त्या
    ॥ ७॥ स्वर्भूरसातलमवस्थितभुक्तिदान
