id: munibhihkritamvishnumayastotram
category: stotram
name:
  english: munibhihkritamvishnumayastotram
  devanagari: मुनिभिःकृतंविष्णुमायास्तोत्रम्
content:
  english: munibhih kritam vishnumayastotram munaya ucuh | namo devyai mahakalyai devakyai ca namo namah
    | mahalakshmyai vishnumatre radha devyai namo namah || 55|| revatyai pushpavatyai ca svarnavatyai
    namo namah | kamakshayai ca mayayai namo matre namo namah || 56|| mahavataprabhavena maha megharavena
    ca | jaladharabhirugrabhirbhayam jatam hi darunam || 57|| tasmadbhayadbhairavi tvamasmansamraksha
    kinkaran | tada prasanna sa devi jalam shantam taya kritam || 58|| iti bhavishyapurane pratisargaparvani
    prathamakhande caturthadhyayantargatam munibhih kritam vishnumayastotram samaptam | bhavishyapurana
    | pratisargaparva | prathamakhanda | adhyaya 4
  devanagari: मुनिभिः कृतं विष्णुमायास्तोत्रम् मुनय ऊचुः । नमो देव्यै महाकाल्यै देवक्यै च नमो नमः । महालक्ष्म्यै
    विष्णुमात्रे राधा देव्यै नमो नमः ॥ ५५॥ रेवत्यै पुष्पवत्यै च स्वर्णवत्यै नमो नमः । कामाक्षायै च मायायै
    नमो मात्रे नमो नमः ॥ ५६॥ महावातप्रभावेन महा मेघरवेण च । जलधाराभिरुग्राभिर्भयं जातं हि दारुणम् ॥ ५७॥
    तस्माद्भयाद्भैरवि त्वमस्मान्संरक्ष किङ्करान् । तदा प्रसन्ना सा देवी जलं शान्तं तया कृतम् ॥ ५८॥ इति
    भविष्यपुराणे प्रतिसर्गपर्वणि प्रथमखण्डे चतुर्थाध्यायान्तर्गतं मुनिभिः कृतं विष्णुमायास्तोत्रं समाप्तम्
    । भविष्यपुराण । प्रतिसर्गपर्व । प्रथमखण्ड । अध्याय ४
meaning: {}
