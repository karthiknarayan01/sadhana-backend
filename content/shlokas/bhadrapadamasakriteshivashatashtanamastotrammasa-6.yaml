id: bhadrapadamasakriteshivashatashtanamastotrammasa-6
category: stotram
name:
  english: bhadrapadamasakriteshivashatashtanamastotrammasa 6
  devanagari: भाद्रपदमासकृतेशिवशताष्टनामस्तोत्रम्मास ६
content:
  english: 48|| bhumipadadadhomurdhni siddharupaya shuline | bhasmabhyaktaya bhadraya bhimaya bhayahetave
    || 49|| vaishantaya ca shantaya shamipushpapriyaya ca | namah katyaya nipyaya paryaya paramatmane
    || 50|| adhishthanaya jyeshthaya kanishthaya prathayishnave | naktancaraya kupyaya kulalapataye namah
    || 51|| sangrahitre prasadaya padmamaladharaya ca | puranaya varenyaya karunaya namo namah || 52||
    taranathadharayatha gajakrittidharaya ca | padukapadmapadaya nagahamsakadharine || 53|| girishaya
    girishaya mahakailasavasine | shvasate grasatecaiva dhavate vasate namah || 54|| namo damshtrakaralaya
    karavalakaraya ca | vyaktavyaktaya muktaya bhuktimuktipradayine || 55|| pashunam pataye caiva vaidyutaya
    balaya ca | balapramathanayaiva balapalaya shuline || 56|| kavyaya bhavyarupaya bhavabhavarataya ca
    | evam namashatashtena pujyo bhadrapade shivah || 57|| || iti shivarahasyantargate ishvaraproktam
    bhadrapadamasakrite shivashatashtanamastotram sampurnam ||
  devanagari: ४८॥ भूमिपादादधोमूर्ध्नि सिद्धरूपाय शूलिने । भस्माभ्यक्ताय भद्राय भीमाय भयहेतवे ॥ ४९॥ वैशन्ताय
    च शान्ताय शमीपुष्पप्रियाय च । नमः काट्याय नीप्याय पार्याय परमात्मने ॥ ५०॥ अधिष्ठानाय ज्येष्ठाय कनिष्ठाय
    प्रथयिष्णवे । नक्तञ्चराय कूप्याय कुलालपतये नमः ॥ ५१॥ सङ्ग्रहीत्रे प्रसादाय पद्ममालाधराय च । पुराणाय
    वरेण्याय करुणाय नमो नमः ॥ ५२॥ तारानाथधरायाथ गजकृत्तिधराय च । पादुकापद्मपादाय नागहंसकधारिणे ॥ ५३॥ गिरिशाय
    गिरीशाय महाकैलासवासिने । श्वसते ग्रसतेचैव धावते वसते नमः ॥ ५४॥ नमो दंष्ट्राकरालाय करवालकराय च । व्यक्ताव्यक्ताय
    मुक्ताय भुक्तिमुक्तिप्रदायिने ॥ ५५॥ पशूनां पतये चैव वैद्युताय बलाय च । बलप्रमथनायैव बालपालाय शूलिने
    ॥ ५६॥ काव्याय भव्यरूपाय भावाभावरताय च । एवं नामशताष्टेन पूज्यो भाद्रपदे शिवः ॥ ५७॥ ॥ इति शिवरहस्यान्तर्गते
    ईश्वरप्रोक्तं भाद्रपदमासकृते शिवशताष्टनामस्तोत्रं सम्पूर्णम् ॥
