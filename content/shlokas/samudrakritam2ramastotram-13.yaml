id: samudrakritam2ramastotram-13
category: stotram
name:
  english: samudrakritam2ramastotram 13
  devanagari: समुद्रकृतं२रामस्तोत्रम् १३
content:
  english: samudrakritam 2 ramastotram 13 na tvam vayam jadadhiyo nu vidama bhuman kutasthamadipurusham
    jagatamadhisham | yatsattvatah suragana rajasah prajesha manyoshca bhutapatayah sa bhavan guneshah
    || 14|| kamam prayahi jahi vishravaso'vameham trailokyaravanamavapnuhi vira patnim | badhnihi setumiha
    te yashaso vitatyai gayanti digvijayino yamupetya bhupah || 15|| iti shrimadbhagavatamahapurane navamaskandhe
    dashamadhyayantargatam samudrakritam shriramastotram samaptam | bhagavatapurana | adhyaya 9
  devanagari: समुद्रकृतं २ रामस्तोत्रम् १३ न त्वां वयं जडधियो नु विदाम भूमन् कूटस्थमादिपुरुषं जगतामधीशम्
    । यत्सत्त्वतः सुरगणा रजसः प्रजेशा मन्योश्च भूतपतयः स भवान् गुणेशः ॥ १४॥ कामं प्रयाहि जहि विश्रवसोऽवमेहं
    त्रैलोक्यरावणमवाप्नुहि वीर पत्नीम् । बध्नीहि सेतुमिह ते यशसो वितत्यै गायन्ति दिग्विजयिनो यमुपेत्य
    भूपाः ॥ १५॥ इति श्रीमद्भागवतमहापुराणे नवमस्कन्धे दशमाध्यायान्तर्गतं समुद्रकृतं श्रीरामस्तोत्रं समाप्तम्
    । भागवतपुराण । अध्याय ९
meaning: {}
