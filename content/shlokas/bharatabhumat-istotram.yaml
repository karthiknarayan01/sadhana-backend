id: bharatabhumat-istotram
category: stotram
name:
  english: bharatabhumatṟistotram
  devanagari: भारतभूमाट्ऱिस्तोत्रम्
content:
  english: bharatabhumatristotram vande mataramavyaktam vyaktam ca jananim param | dino'ham balakah kamkshe
    sevam janmani janmani || 1|| sagaralingitam lakshmim jagajjanakakanyakam | sthitam himanagasyamke
    parvatimaparam bhaje || 2|| shubhram dharmadhvajam matuh kim va rashikritam yashah | raupyam va mukutam
    divyam vande'ham tam himalayam || 3|| jahnaviyamunasimdhubrahmaputrashatadrubhih | bhudevim pancadharabhih
    satatam sa'bhishincati || 4|| nagadhipam dharayamtim mastake ratnamadvayam | kashmiram ca lalate bhrumadhye
    nepalikam shubham || 5|| narmadatapativimdhyasaptapithakamekhalam | purvaparacalorum ca malayam padapithake
    | madhyadeshodare guptanakshayan dhanasancayan || 6|| asuranam puri lamka dasi yaccaranayoh krita
    | tam devim bharatim vande mataramvishvapujitam || 7|| drushta caivopanishadam gitashastrapravartakah
    | shaddarshanapravakta ca bhagavanpaninirmunih || 8|| valmikishca tatha vyasah kalidaso mahakavih
    | aryabhattashca bharatah shamkaro'dvaitakesari || 9|| bhishmaramarjuna vira nripau ramayudhishthirau
    | savitri draupadi sita damayamti ca taraka || 10|| mahadhanyadvitiyani ratnanyetani bhutale | janani
    bharati tesham ratnagarbha katham na sa || 11|| vasundhara ratnagarbha rasa vishvambhara kshama |
    sarvamsaha sthira caiva bharati bhusukanyaka || 12|| ratnakarah svayam bhaktya muktopayanapurvakam
    | caranankshalayatyasya atamdrashca divanisham || 13|| kailasadvarakadhishau rameshvarapurishvarau
    | dvarapala babhuvushca saubhagyam maturadbhutam || 14|| poshyanti sada matuh parvatastanamamdalat
    | nihsritashca payodharah samtatinam paramparah || 15|| putravatsalata maturagadha harina svayam |
    avatiryodare sodham garbhaduhkham punah punah || 16|| marane janmakale ca mumurshurnavabalakah | tvadamke
    caiva samshete aho vatsalata tava || 17|| padmalaya tvamevasi tvameva ca sarasvati | annapurna tvamevasi
    tvameva ca shiva sati || 18|| tvadrikshah kalpavrikshashca cintamanishilah shilah | tvadvanam namdanam
    sakshatsakshattvam svargadevata || 19|| pratijanmani me cittam vittam dehashca samtatih | tvatsevanirata
    bhuyurmata tvam karunamayi || 20|| na me vamcha'sti yashasi vidvattve na ca va sukhe | prabhutvam
    naiva va svarge mokshe'tyanamdadayake || 21|| param ca bharate janma manvasya ca va pashoh | vihamgasya
    ca va jantorvrikshapashanayorapi || 22|| nirantaram bhavatu me matrisevamshabhagyabhak | eshaiva vancha
    hridaye sakshi sarvatmakah prabhuh || 23|| iti shribharatabhumatristotram sampurnam
  devanagari: भारतभूमातृस्तोत्रम् वन्दे मातरमव्यक्तां व्यक्तां च जननीं पराम् । दीनोऽहं बालकः कांक्षे सेवां
    जन्मनि जन्मनि ॥ १॥ सागरालिङ्गितां लक्ष्मीं जगज्जनककन्यकाम् । स्थितां हिमनगस्यांके पार्वतीमपरां भजे
    ॥ २॥ शुभ्रं धर्मध्वजं मातुः किं वा राशीकृतं यशः । रौप्यं वा मुकुटं दिव्यं वन्देऽहं तं हिमालयम् ॥ ३॥
    जाह्नवीयमुनासिंधुब्रह्मपुत्रशतद्रुभिः । भूदेवीं पञ्चधाराभिः सततं साऽभिषिञ्चति ॥ ४॥ नगाधिपं धारयंतीं
    मस्तके रत्नमद्वयम् । काश्मीरं च ललाटे भ्रूमध्ये नेपालिकां शुभाम् ॥ ५॥ नर्मदातापतीविंध्यसप्तपीठकमेखलाम्
    । पूर्वापराचलोरूं च मलयं पादपीठके । मध्यदेशोदरे गुप्तानक्षयान् धनसञ्चयान् ॥ ६॥ असुराणां पुरी लंका
    दासी यच्चरणयोः कृता । तां देवीं भारतीं वन्दे मातरंविश्वपूजिताम् ॥ ७॥ द्रुष्टा चैवोपनिषदां गीतशास्त्रप्रवर्तकः
    । षड्दर्शनप्रवक्ता च भगवान्पाणिनिर्मुनिः ॥ ८॥ वाल्मीकिश्च तथा व्यासः कालिदासो महाकविः । आर्यभट्टश्च
    भरतः शंकरोऽद्वैतकेसरी ॥ ९॥ भीष्मरामार्जुना वीरा नृपौ रामयुधिष्ठिरौ । सावित्री द्रौपदी सीता दमयंती
    च तारका ॥ १०॥ महाधान्यद्वितीयानि रत्नान्येतानि भूतले । जननी भारती तेषां रत्नगर्भा कथं न सा ॥ ११॥ वसुन्धरा
    रत्नगर्भा रसा विश्वंभरा क्षमा । सर्वंसहा स्थिरा चैव भारती भूसुकन्यका ॥ १२॥ रत्नाकरः स्वयं भक्त्या
    मुक्तोपायनपूर्वकम् । चरणान्क्षालयत्यस्या अतंद्रश्च दिवानिशम् ॥ १३॥ कैलासद्वारकाधीशौ रामेश्वरपुरीश्वरौ
    । द्वारपाला बभूवुश्च सौभाग्यं मातुरद्भुतम् ॥ १४॥ पोष्यन्ति सदा मातुः पर्वतस्तनमंडलात् । निःसृताश्च
    पयोधाराः संततीनां परंपराः ॥ १५॥ पुत्रवत्सलता मातुरगाधा हरिणा स्वयम् । अवतीर्योदरे सोढं गर्भदुःखं पुनः
    पुनः ॥ १६॥ मरणे जन्मकाले च मुमूर्षुर्नवबालकः । त्वदंके चैव संशेते अहो वत्सलता तव ॥ १७॥ पद्मालया त्वमेवासि
    त्वमेव च सरस्वती । अन्नपूर्णा त्वमेवासि त्वमेव च शिवा सती ॥ १८॥ त्वदृक्षाः कल्पवृक्षाश्च चिन्तामणिशिलाः
    शिलाः । त्वद्वनं नंदनं साक्षात्साक्षात्त्वं स्वर्गदेवता ॥ १९॥ प्रतिजन्मनि मे चित्तं वित्तं देहश्च
    संततिः । त्वत्सेवानिरता भूयुर्माता त्वं करुणामयी ॥ २०॥ न मे वांछाऽस्ति यशसि विद्वत्त्वे न च वा सुखे
    । प्रभुत्वं नैव वा स्वर्गे मोक्षेऽत्यानंददायके ॥ २१॥ परं च भारते जन्म मान्वस्य च वा पशोः । विहंगस्य
    च वा जन्तोर्वृक्षपाषाणयोरपि ॥ २२॥ निरन्तरं भवतु मे मातृसेवांशभाग्यभाक् । एषैव वाञ्छा हृदये साक्षी
    सर्वात्मकः प्रभुः ॥ २३॥ इति श्रीभारतभूमातृस्तोत्रं सम्पूर्णं
