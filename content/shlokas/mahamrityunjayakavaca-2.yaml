id: mahamrityunjayakavaca-2
category: kavacha
name:
  english: mahamrityunjayakavaca 2
  devanagari: महामृत्युन्जयकवच २
content:
  english: rinu devi pravakshyami kavacam sarvasiddhidam | markandeyo'pi yaddhritva ciranjivi vyajayata
    || tathaiva sarvadikpala amaratvamavapnuyuh | kavacasya rishirbrahma chando'nushtubudahritan || mrityanjayah
    samuddishto devata parvatipatih | deharogyadalayushtve viniyogah prakirtitah | om tryambakam me shirah
    patu lalatam me yajamahe | sugandhim patu hridayam jatharam pushtivardhanam || nabhimurvarukamiva
    patu mam parvatipatih | vandhanaduruyugmam me patu vamangashasanah || mrityorjanuyugam patu dakshayajnavinashanah
    | janghayugmam ca mukshiya patu mam candrashekharah || mamritacca padadvandvam patu sarveshvaro harah
    | prasau me shrishivah patu nilakanthashca parshvayoh || urdhvameva sada patu somasuryagnilocanah
    | adhah patu sada shambhuh sarvapadvinivaranah || varunyamardhanarisho vayavyam patu shankarah | kapardi
    patu kauberyamaishanyamishvaro'vatu || ishanah salile payadaghorah patu kanane | antarikshe vamadevah
    payattatpurusho bhuvi || shrikanthah shayane patu bhojane nilalohitah | gamane tryambakah patu sarvakaryeshu
    bhupatih | sarvatra sarvadeham me sada mrityunjayo'vatu | iti te kathitam divyam kavacam sarvakamadam
    || sarvarakshakaram sarvagrahapida
  devanagari: ृणु देवि प्रवक्ष्यामि कवचं सर्वसिद्धिदम् । मार्कण्डेयोऽपि यद्धृत्वा चिरञ्जीवी व्यजायत ॥
    तथैव सर्वदिक्पाला अमरात्वमवाप्नुयुः । कवचस्य ऋषिर्ब्रह्मा छन्दोऽनुष्टुबुदाहृतन् ॥ मृत्यञ्जयः समुद्दिष्टो
    देवता पार्वतीपतिः । देहारोग्यदलायुष्ट्वे विनियोगः प्रकीर्तितः । ॐ त्र्यम्बकं मे शिरः पातु ललाटं मे
    यजामहे । सुगन्धिं पातु हृदयं जठरं पुष्टिवर्धनम् ॥ नाभिमुर्वारुकमिव पातु मां पार्वतीपतिः । वन्धनादूरुयुग्मं
    मे पातु वामाङ्गशासनः ॥ मृत्योर्जानुयुगं पातु दक्षयज्ञविनाशनः । जङ्घायुग्मं च मुक्षीय पातु मां चन्द्रशेखरः
    ॥ मामृताच्च पदद्वन्द्वं पातु सर्वेश्वरो हरः । प्रसौ मे श्रीशिवः पातु नीलकण्ठश्च पार्श्वयोः ॥ ऊर्ध्वमेव
    सदा पातु सोमसूर्याग्निलोचनः । अधः पातु सदा शम्भुः सर्वापद्विनिवारणः ॥ वारुण्यामर्धनारीशो वायव्यां
    पातु शङ्करः । कपर्दी पातु कौबेर्यामैशान्यामीश्वरोऽवतु ॥ ईशानः सलिले पायदघोरः पातु कानने । अन्तरिक्षे
    वामदेवः पायात्तत्पुरुषो भुवि ॥ श्रीकण्ठः शयने पातु भोजने नीललोहितः । गमने त्र्यम्बकः पातु सर्वकार्येषु
    भुपतिः । सर्वत्र सर्वदेहं मे सदा मृत्युञ्जयोऽवतु । इति ते कथितं दिव्यं कवचं सर्वकामदम् ॥ सर्वरक्षाकरं
    सर्वग्रहपीडा
