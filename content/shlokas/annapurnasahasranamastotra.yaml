id: annapurnasahasranamastotra
category: stotram
name:
  english: annapurnasahasranamastotra
  devanagari: अन्नपूर्णासहस्रनामस्तोत्र
content:
  english: dharmarthakamamoksharthe pathe viniyogah || dhyanam | arkonmuktashashankakotivadanamapinatungastanim
    candrardhankitamastakam madhumadamalolanetratrayim | bibhranamanisham varam japapatim shulam kapalam
    karaih adyam yauvanagarvitam lipitanum vagishvarimashraye || atha annapurnasahasranamastotram | ||
    om annapurnayai namah || annapurna annadatri annarashikritalaya | annada annarupa ca annadanaratotsava
    || 1|| ananta ca anantakshi anantagunashalini | acyuta acyutaprana acyutanandakarini || 2|| avyakta'nantamahima
    anantasya kuleshvari | abdhistha abdhishayana abdhija abdhinandini || 3|| abjastha abjanilaya abjaja
    abjabhushana | abjabha abjahasta ca abjapatrashubhekshana || 4|| abjanana anantatma agristha agnirupini
    | agnijaya agnimukhi agnikundakritalaya || 5|| akara agnimata ca ajaya'ditinandini | adya adityasankasha
    atmajna atmagocara || 6|| atmasuratmadayita adhara atmarupini | asha akashapadmastha avakashasvarupini
    || 7|| ashapuri agadha ca animadisusevita | ambika abala amba anadya ca ayonija || 8|| anisha ishika
    isha ishani ishvarapriya | ishvari ishvaraprana ishvaranandadayini || 9|| indrani indradayita indrasurindrapalini
    | indira indrabhagini indriya indubhushana || 10|| indumata indumukhi indriyanam vashankari | uma
    umapateh prana odyanapithavasini || 11|| uttarajna uttarakhya ukara uttaratmika | rimata ribhava ristha
    rilrikarasvarupini || 12|| rikara ca lrikara ca lritakapritidayini | eka ca ekavira ca ekaraikararupini
    || 13|| okari ogharupa ca oghatrayasupujita | oghastha oghasambhuta oghadhatri ca oghasuh || 14||
    shodashasvarasambhuta shodashasvararupini | varnatma varnanilaya shulini varnamalini || 15|| kalaratrirmaharatrirmoharatrih
    sulocana | kali kapalini kritya kalika simhagamini || 16|| katyayani kaladhara kaladaityanikrintani
    | kamini kamavandya ca kamaniya vinodini || 17|| kamasuh kamavanita kamadhuk kamalavati | kamadatri
    karali ca kamakelivinodini || 18|| kamana kamada kamya kamala kamalarcita | kashmiraliptavakshoja
    kashmiradravacarcita || 19|| kanaka kanakaprana kanakacalavasini | kanakabha kananastha kamakhya kanakaprada
    || 20|| kamapithasthita nitya kamadhamanivasini | kambukanthi karalakshi kishori ca kalapini || 21||
    kala kashtha nimesha ca kalastha kalarupini | kalajna kalamata ca kaladhatri kalavati || 22|| kalada
    kalaha kulya kurukulla kulangana | kirtida kirtiha kirtih kirtistha kirtivardhani || 23|| kirtijna
    kirtitapada krittika keshavapriya | keshiha kelikari ca keshavanandakarini || 24|| kumudabha kumari
    ca karmada kamalekshana | kaumudi kumudananda kaulini ca kumudvati || 25|| kodandadharini krodha kutastha
    kotarashraya | kalakanthi karalangi kalangi kalabhushana || 26|| kankali kamadama ca kankalakritabhushana
    | kapalakartrikakara karavirasvarupini || 27|| kapardini komalangi kripasindhuh kripamayi | kushavati
    kundasamstha kauberi kaushiki tatha || 28|| kashyapi kadrutanaya kalikalmashanashini | kanjastha kanjavadana
    kanjakinjalkacarcita || 29|| kanjabha kanjamadhyastha kanjanetra kacodbhava | kamarupa ca hrimkari
    kashyapanvayavardhini || 30|| kharva ca khanjanadvandvalocana kharvavahini | khadgini khadgahasta
    ca khecari khadgarupini || 31|| khagastha khagarupa ca khagaga khagasambhava | khagadhatri khagananda
    khagayonisvarupini || 32|| khageshi khetakakara khaganandavivardhini | khagamanya khagadhara khagagarvavimocini
    || 33|| ganga godavari gitirgayatri gaganalaya | girvanasundari gaushca gadha girvanapujita || 34||
    girvanacarcitapada gandhari gomati tatha | garvini garvahantri ca garbhastha garbhadharini || 35||
    garbhada garbhahantri ca gandharvakulapujita | gaya gauri ca girija giristha girisambhava || 36||
    girigahvaramadhyastha kunjareshvaragamini | kiritini ca gadini gunjaharavibhushana || 37|| ganapa
    ganaka ganya ganakanandakarini | ganapujya ca girvani ganapananandakarini || 38|| gurumata gururata
    gurubhaktiparayana | gotra gauh krishnabhagini krishnasuh krishnanandini || 39|| govardhani gotradhara
    govardhanakritalaya | govardhanadhara goda gaurangi gautamatmaja || 40|| gharghara ghorarupa ca ghora
    ghargharanadini | shyama ghanarava'ghora ghana ghorartinashini || 41|| ghanastha ca ghanananda daridryaghananashini
    | cittajna cintitapada cittastha cittarupini || 42|| cakrini carucampabha carucampakamalini | candrika
    candrakantishca capini candrashekhara || 43|| candika candadaityaghni candrashekharavallabha | candalini
    ca camunda candamundavadhodyata || 44|| caitanyabhairavi canda caitanyaghanagehini | citsvarupa cidadhara
    candavega cidalaya || 45|| candramandalamadhyastha candrakotisushitala | capala candrabhagini candrakotinibhanana
    || 46|| cintamanigunadhara cintamanivibhushana | bhaktacintamanilata cintamanikritalaya || 47|| carucandanaliptangi
    catura ca caturmukhi | caitanyada cidananda carucamaravijita || 48|| chatrada chatradhari ca chalacchadmavinashini
    | chatraha chatrarupa ca chatracchayakritalaya || 49|| jagajjiva jagaddhatri jagadanandakarini | yajnapriya
    yajnarata japayajnaparayana || 50|| janani janaki yajva yajnaha yajnanandini | yajnada yajnaphalada
    yajnasthanakritalaya || 51|| yajnabhoktri yajnarupa yajnavighnavinashini | japakusumasankasha japakusumashobhita
    || 52|| jalandhari jaya jaitri jimutacayabhashini | jayada jayarupa ca jayastha jayakarini || 53||
    jagadishapriya jiva jalastha jalajekshana | jalarupa jahnukanya yamuna jalajodari || 54|| jalajasya
    jahnavi ca jalajabha jalodari | yaduvamshodbhava jiva yadavanandakarini || 55|| yashoda yashasam rashiryashodanandakarini
    | jvalini jvalini jvala jvalatpavakasannibha || 56|| jvalamukhi jaganmata yamalarjunabhanjani | janmada
    janmaha janya janmabhurjanakatmaja || 57|| janananda jambavati jambudvipakritalaya | jambunadasamanabha
    jambunadavibhushana || 58|| jambhaha jatida jatirjnanada jnanagocara | jnanarupa'jnanaha ca jnanavijnanashalini
    || 59|| jinajaitri jinadhara jinamata jineshvari | jitendriya janadhara ajinambaradharini || 60||
    shambhukotiduradharsha vishnukotivimardini | samudrakotigambhira vayukotimahabala || 61|| suryakotipratikasha
    yamakotidurapaha | kamadhukkotiphalada shakrakotisurajyada || 62|| kandarpakotilavanya padmakotinibhanana
    | prithvikotijanadhara agnikotibhayankari || 63|| anima mahima praptirgarima laghima tatha | prakamyada
    vashakari ishika siddhida tatha || 64|| mahimadigunopeta animadyashtasiddhida | javanadhni janadhina
    jamini ca jarapaha || 65|| tarini tarika tara totala tulasipriya | tantrini tantrarupa ca tantrajna
    tantradharini || 66|| tarahara ca tulaja dakinitantragocara | tripura tridasha tristha tripurasuraghatini
    || 67|| triguna ca trikonastha trimatra tritanusthita | traividya ca trayi trighni turiya tripureshvari
    || 68|| trikodarastha trividha trailokya tripuratmika | tridhamni tridasharadhya tryaksha tripuravasini
    || 69|| trivarni tripadi tara trimurtijanani tvara | tridiva tridivesha''dirdevi trailokyadharini
    || 70|| trimurtishca trijanani tribhustripurasundari | tapasvini taponishtha taruni tararupini ||
    71|| tamasi tapasi caiva tapaghni ca tamopaha | tarunarkapratikasha taptakancanasannibha || 72|| unmadini
    tanturupa trailokyavyapinishvari | tarkiki tarkiki vidya tapatrayavinashini || 73|| tripushkara trikalajna
    trisandhya ca trilocana | trivarga ca trivargastha tapasassiddhidayini || 74|| adhokshaja ayodhya
    ca aparna ca avantika | karika tirtharupa ca tira tirthakari tatha || 75|| daridryaduhkhadalini adina
    dinavatsala | dinanathapriya dirgha dayapurna dayatmika || 76|| devadanavasampujya devanam priyakarini
    | dakshaputri dakshamata dakshayajnavinashini || 77|| devasurdakshina daksha durga durgatinashini
    | devakigarbhasambhuta durgadaityavinashini || 78|| atta'ttahasini dola dolakarmabhinandini | devaki
    devika devi duritaghni tatittatha || 79|| gandaki gallaki kshipra dvara dvaravati tatha | anandodadhimadhyastha
    katisutrairalankrita || 80|| ghoragnidahadamani duhkhadussvapnanashini | shrimayi shrimati shreshtha
    shrikari shrivibhavini || 81|| shrida shrisha shrinivasa shrimati shrirmatirgatih | dhanada damini
    danta dhamado dhanashalini || 82|| dadimipushpasankasha dhanagara dhananjaya | dhumrabha dhumradaittraghni
    dhavala dhavalapriya || 83|| dhumravaktra dhumranetra dhumrakeshi ca dhusara | dharani dharini dhairya
    dhara dhatri ca dhairyada || 84|| damini dharmini dhushca daya dogdhri durasada | narayani narasimhi
    nrisimhahridayalaya || 85|| nagini nagakanya ca nagasurnaganayika | nanaratnavicitrangi nanabharanamandita
    || 86|| durgastha durgarupa ca duhkhadushkritanashini | hinkari caiva shrinkari hunkari kleshanashini
    || 87|| nagatmaja nagari ca navina nutanapriya | nirajasya niradabha navalavanyasundari || 88|| nitijna
    nitida nitirnimanabhirnageshvari | nishtha nitya niratanka nagayajnopavitini || 89|| nidhida nidhirupaca
    nirguna naravahini | naramamsarata nari naramundavibhushana || 90|| niradhara nirvikara nutirnirvanasundari
    | narasrikpanamatta ca nirvaira nagagamini || 91|| parama pramita prajna parvati parvatatmaja | parvapriya
    parvarata parvapavanapavani || 92|| paratparatara purva pashcima papanashini | pashunam patipatni
    ca patibhaktiparayana || 93|| pareshi paraga para paranjyotisvarupini | nishthura krurahridaya parasiddhih
    paragatih || 94|| pashughni pashurupa ca pashuha pashuvahini | pita mata ca yantri ca pashupashavinashini
    || 95|| padmini padmahasta ca padmakinjalkavasini | padmavaktra ca padmakshi padmastha padmasambhava
    || 96|| padmasya pancami purna purnapithanivasini | padmaragapratikasha pancali pancamapriya || 97||
    parabrahmasvarupa ca parabrahmanivasini | paramanandamudita paracakranivasini || 98|| pareshi parama
    prithvi pinatungapayodhara | parapara paravidya paramanandadayini || 99|| pujya prajnavati pushtih
    pinakiparikirtita | pranaghni pranarupa ca pranada ca priyamvada || 100|| phanibhusha phanaveshi phakarakanthamalini
    | phaniradvritasarvangi phalabhaganivasini || 101|| balabhadrasya bhagini bala balapradayini | phalgurupa
    pralambadhni phalgutsava vinodini || 102|| bhavani bhavapatni ca bhavabhitihara bhava | bhaveshvari
    bhavaradhya bhaveshi bhavanayika || 103|| bhavamata bhavagamya bhavakantakanashini | bhavapriya bhavananda
    bhavya ca bhavamocani || 104|| bhavaniya bhagavati bhavabharavinashini | bhutadhatri ca bhuteshi bhutastha
    bhutarupini || 105|| bhutamata ca bhutaghni bhutapancakavasini | bhogopacarakushala bhissadhatri ca
    bhucari || 106|| bhitighni bhaktigamya ca bhaktanamartinashini | bhaktanukampini bhima bhagini bhaganayika
    || 107|| bhagavidya bhagaklinna bhagayonirbhagaprada | bhageshi bhagarupa ca bhagaguhya bhagapaha
    || 108|| bhagodari bhagananda bhagadya bhagamalini | bhogaprada bhogavasa bhogamula ca bhogini ||
    109|| bherunda bhedini bhima bhadrakali bhidojjhita | bhairavi bhuvaneshani bhuvana bhuvaneshvari
    || 110|| bhimakshi bharati caiva bhairavashtakasevita | bhasvara bhasvati bhitirbhasvaduttanashayini
    || 111|| bhagirathi bhogavati bhavaghni bhuvanatmika | bhutida bhutirupa ca bhutastha bhutavardhini
    || 112|| maheshvari mahamaya mahateja mahasuri | mahajihva mahalola mahadamshtra mahabhuja || 113||
    mahamohandhakaraghni mahamokshapradayini | mahadaridryashamani mahashatruvimardini || 114|| mahashaktirmahajyotirmahasuravimardini
    | mahakaya mahavirya mahapatakanashini || 115|| maharava mantramayi manipuranivasini | manasi manada
    manya manashcakshuragocara || 116|| mahendri madhura maya mahishasuramardini | mahakundalini shaktirmahavibhavavardhini
    || 117|| manasi madhavi medha matida matidharini | menakagarbhasambhuta menakabhagini matih || 118||
    mahodari muktakeshi muktikamyarthasiddhida | maheshi mahisharudha madhudaityavimardini || 119|| mahavrata
    mahamurdha mahabhayavinashini | matangi mattamatangi matangakulamandita || 120|| mahaghora mananiya
    mattamatangagamini | muktaharalatopeta madadhurnitalocana || 121|| mahaparadharashighri mahacorabhayapaha
    | mahacintyasvarupa ca manimantramahaushadhi || 122|| manimandapamadhyastha manimalavirajita | mantratmika
    mantragamya mantramata sumantrini || 123|| merumandiramadhyastha makarakritikundala | manthara ca
    mahasukshma mahaduti maheshvari || 124|| malini manavi madhvi madarupa madotkata | madira madhura
    caiva modini ca mahoddhata || 125|| mangalangi madhumayi madhupanaparayana | manorama ramamata rajarajeshvari
    rama || 126|| rajamanya rajapujya raktotpalavibhushana | rajivalocana rama radhika ramavallabha ||
    127|| shakini dakini caiva lavanyambudhivicika | rudrani rudrarupa ca raudra rudrartinashini || 128||
    raktapriya raktavastra raktakshi raktalocana | raktakeshi raktadamshtra raktacandanacarcita || 129||
    raktangi raktabhusha ca raktabijanipatini | ragadidosharahita ratija ratidayini || 130|| vishveshvari
    vishalakshi vindhyapithanivasini | vishvabhurviravidya ca virasurviranandini || 131|| vireshvari vishalakshi
    vishnumaya vimohini | vidyavati vishnurupa vishalanayanojjvala || 132|| vishnumata ca vishvatma vishnujayasvarupini
    | varahi varada vandya vikhyata vilasalkaca || 133|| brahmeshi brahmada brahmi brahmani brahmarupini
    | dvaraka vishvavandya ca vishvapashavimocani | vishvasakarini vishva vishvashaktirvicakshana || 134||
    banacapadhara vira bindustha bindumalini | shatcakrabhedini shodha shodasharanivasini || 135|| shitikanthapriya
    shanta shakini vatarupini | shashvati shambhuvanita shambhavi shivarupini || 136|| shivamata ca shivada
    shiva shivahridasana | shuklambara shitala ca shila shilapradayini || 137|| shishupriya vaidyavidya
    salagramashila shucih | haripriya haramurtirharinetrakritalaya || 138|| harivaktrodbhava hala harivakshahsthalasthita
    | kshemankari kshitih kshetra kshudhitasya prapurani || 139|| vaishya ca kshatriya shudri kshatriyanam
    kuleshvari | harapatni hararadhya harasurhararupini || 140|| sarvanandamayi siddhissarvarakshasvarupini
    | sarvadushtaprashamani sarvepsitaphalaprada || 141|| sarvasiddheshvararadhya sarvamangalamangala
    | phalashrutih | punyam sahasranamedam tava pritya prakashitam || 142|| gopaniyam prayatnena pathaniyam
    prayatnatah | natah parataram punyam natah parataram tapah || 143|| natah parataram stotram natah
    paratara gatih | stotram namasahasrakhyam mama vaktradvinirgatam || 144|| yah pathetparaya bhaktya
    sha
  devanagari: धर्मार्थकाममोक्षार्थे पाठे विनियोगः ॥ ध्यानम् । अर्कोन्मुक्तशशाङ्ककोटिवदनामापीनतुङ्गस्तनीं
    चन्द्रार्धाङ्कितमस्तकां मधुमदामालोलनेत्रत्रयीम् । बिभ्राणामनिशं वरं जपपटीं शूलं कपालं करैः आद्यां
    यौवनगर्वितां लिपितनुं वागीश्वरीमाश्रये ॥ अथ अन्नपूर्णासहस्रनामस्तोत्रम् । ॥ ॐ अन्नपूर्णायै नमः ॥ अन्नपूर्णा
    अन्नदात्री अन्नराशिकृतालया । अन्नदा अन्नरूपा च अन्नदानरतोत्सवा ॥ १॥ अनन्ता च अनन्ताक्षी अनन्तगुणशालिनी
    । अच्युता अच्युतप्राणा अच्युतानन्दकारिणी ॥ २॥ अव्यक्ताऽनन्तमहिमा अनन्तस्य कुलेश्वरी । अब्धिस्था अब्धिशयना
    अब्धिजा अब्धिनन्दिनी ॥ ३॥ अब्जस्था अब्जनिलया अब्जजा अब्जभूषणा । अब्जाभा अब्जहस्ता च अब्जपत्रशुभेक्षणा
    ॥ ४॥ अब्जानना अनन्तात्मा अग्रिस्था अग्निरूपिणी । अग्निजाया अग्निमुखी अग्निकुण्डकृतालया ॥ ५॥ अकारा
    अग्निमाता च अजयाऽदितिनन्दिनी । आद्या आदित्यसङ्काशा आत्मज्ञा आत्मगोचरा ॥ ६॥ आत्मसूरात्मदयिता आधारा
    आत्मरूपिणी । आशा आकाशपद्मस्था अवकाशस्वरूपिणी ॥ ७॥ आशापूरी अगाधा च अणिमादिसुसेविता । अम्बिका अबला अम्बा
    अनाद्या च अयोनिजा ॥ ८॥ अनीशा ईशिका ईशा ईशानी ईश्वरप्रीया । ईश्वरी ईश्वरप्राणा ईश्वरानन्ददायिनी ॥ ९॥
    इन्द्राणी इन्द्रदयिता इन्द्रसूरिन्द्रपालिनी । इन्दिरा इन्द्रभगिनी इन्द्रिया इन्दुभूषणा ॥ १०॥ इन्दुमाता
    इन्दुमुखी इन्द्रियाणां वशङ्करी । उमा उमापतेः प्राणा ओड्याणपीठवासिनी ॥ ११॥ उत्तरज्ञा उत्तराख्या उकारा
    उत्तरात्मिका । ऋमाता ऋभवा ऋस्था ॠलॄकारस्वरूपिणी ॥ १२॥ ऋकारा च लृकारा च लॄतकप्रीतिदायिनी । एका च एकवीरा
    च एकारैकाररूपिणी ॥ १३॥ ओकारी ओघरूपा च ओघत्रयसुपूजिता । ओघस्था ओघसम्भूता ओघधात्री च ओघसूः ॥ १४॥ षोडशस्वरसम्भूता
    षोडशस्वररूपिणी । वर्णात्मा वर्णनिलया शूलिनी वर्णमालिनी ॥ १५॥ कालरात्रिर्महारात्रिर्मोहरात्रिः सुलोचना
    । काली कपालिनी कृत्या कालिका सिंहगामिनी ॥ १६॥ कात्यायनी कलाधारा कालदैत्यनिकृन्तनी । कामिनी कामवन्द्या
    च कमनीया विनोदिनी ॥ १७॥ कामसूः कामवनिता कामधुक् कमलावती । कामदात्री कराली च कामकेलिविनोदिनी ॥ १८॥
    कामना कामदा काम्या कमला कमलार्चिता । काश्मीरलिप्तवक्षोजा काश्मीरद्रवचर्चिता ॥ १९॥ कनका कनकप्राणा कनकाचलवासिनी
    । कनकाभा काननस्था कामाख्या कनकप्रदा ॥ २०॥ कामपीठस्थिता नित्या कामधामनिवासिनी । कम्बुकण्ठी करालाक्षी
    किशोरी च कलापिनी ॥ २१॥ कला काष्ठा निमेषा च कालस्था कालरूपिणी । कालज्ञा कालमाता च कालधात्री कलावती
    ॥ २२॥ कालदा कालहा कुल्या कुरुकुल्ला कुलाङ्गना । कीर्तिदा कीर्तिहा कीर्तिः कीर्तिस्था कीर्तिवर्धनी
    ॥ २३॥ कीर्तिज्ञा कीर्तितपदा कृत्तिका केशवप्रिया । केशिहा केलीकारी च केशवानन्दकारिणी ॥ २४॥ कुमुदाभा
    कुमारी च कर्मदा कमलेक्षणा । कौमुदी कुमुदानन्दा कौलिनी च कुमुद्वती ॥ २५॥ कोदण्डधारिणी क्रोधा कूटस्था
    कोटराश्रया । कालकण्ठी करालाङ्गी कालाङ्गी कालभूषणा ॥ २६॥ कङ्काली कामदामा च कङ्कालकृतभूषणा । कपालकर्त्रिककरा
    करवीरस्वरूपिणी ॥ २७॥ कपर्दिनी कोमलाङ्गी कृपासिन्धुः कृपामयी । कुशावती कुण्डसंस्था कौबेरी कौशिकी तथा
    ॥ २८॥ काश्यपी कद्रुतनया कलिकल्मषनाशिनी । कञ्जस्था कञ्जवदना कञ्जकिञ्जल्कचर्चिता ॥ २९॥ कञ्जाभा कञ्जमध्यस्था
    कञ्जनेत्रा कचोद्भवा । कामरूपा च ह्रींकारी कश्यपान्वयवर्धिनी ॥ ३०॥ खर्वा च खञ्जनद्वन्द्वलोचना खर्ववाहिनी
    । खड्गिनी खड्गहस्ता च खेचरी खड्गरूपिणी ॥ ३१॥ खगस्था खगरूपा च खगगा खगसम्भवा । खगधात्री खगानन्दा खगयोनिस्वरूपिणी
    ॥ ३२॥ खगेशी खेटककरा खगानन्दविवर्धिनी । खगमान्या खगाधारा खगगर्वविमोचिनी ॥ ३३॥ गङ्गा गोदावरी गीतिर्गायत्री
    गगनालया । गीर्वाणसुन्दरी गौश्च गाधा गीर्वाणपूजिता ॥ ३४॥ गीर्वाणचर्चितपदा गान्धारी गोमती तथा । गर्विणी
    गर्वहन्त्री च गर्भस्था गर्भधारिणी ॥ ३५॥ गर्भदा गर्भहन्त्री च गन्धर्वकुलपूजिता । गया गौरी च गिरिजा
    गिरिस्था गिरिसम्भवा ॥ ३६॥ गिरिगह्वरमध्यस्था कुञ्जरेश्वरगामिनी । किरीटिनी च गदिनी गुञ्जाहारविभूषणा
    ॥ ३७॥ गणपा गणका गण्या गणकानन्दकारिणी । गणपूज्या च गीर्वाणी गणपाननन्दकारिणी ॥ ३८॥ गुरुमाता गुरुरता
    गुरुभक्तिपरायणा । गोत्रा गौः कृष्णभगिनी कृष्णसूः कृष्णनन्दिनी ॥ ३९॥ गोवर्धनी गोत्रधरा गोवर्धनकृतालया
    । गोवर्धनधरा गोदा गौराङ्गी गौतमात्मजा ॥ ४०॥ घर्घरा घोररूपा च घोरा घर्घरनादिनी । श्यामा घनरवाऽघोरा
    घना घोरार्तिनाशिनी ॥ ४१॥ घनस्था च घनानन्दा दारिद्र्यघननाशिनी । चित्तज्ञा चिन्तितपदा चित्तस्था चित्तरूपिणी
    ॥ ४२॥ चक्रिणी चारुचम्पाभा चारुचम्पकमालिनी । चन्द्रिका चन्द्रकान्तिश्च चापिनी चन्द्रशेखरा ॥ ४३॥ चण्डिका
    चण्डदैत्यघ्नी चन्द्रशेखरवल्लभा । चाण्डालिनी च चामुण्डा चण्डमुण्डवधोद्यता ॥ ४४॥ चैतन्यभैरवी चण्डा चैतन्यघनगेहिनी
    । चित्स्वरूपा चिदाधारा चण्डवेगा चिदालया ॥ ४५॥ चन्द्रमण्डलमध्यस्था चन्द्रकोटिसुशीतला । चपला चन्द्रभगिनी
    चन्द्रकोटिनिभानना ॥ ४६॥ चिन्तामणिगुणाधारा चिन्तामणिविभूषणा । भक्तचिन्तामणिलता चिन्तामणिकृतालया ॥ ४७॥
    चारुचन्दनलिप्ताङ्गी चतुरा च चतुर्मुखी । चैतन्यदा चिदानन्दा चारुचामरवीजिता ॥ ४८॥ छत्रदा छत्रधारी च
    छलच्छद्मविनाशिनी । छत्रहा छत्ररूपा च छत्रच्छायाकृतालया ॥ ४९॥ जगज्जीवा जगद्धात्री जगदानन्दकारिणी ।
    यज्ञप्रिया यज्ञरता जपयज्ञपरायणा ॥ ५०॥ जननी जानकी यज्वा यज्ञहा यज्ञनन्दिनी । यज्ञदा यज्ञफलदा यज्ञस्थानकृतालया
    ॥ ५१॥ यज्ञभोक्त्री यज्ञरूपा यज्ञविघ्नविनाशिनी । जपाकुसुमसङ्काशा जपाकुसुमशोभिता ॥ ५२॥ जालन्धरी जया
    जैत्री जीमूतचयभाषिणी । जयदा जयरूपा च जयस्था जयकारिणी ॥ ५३॥ जगदीशप्रिया जीवा जलस्था जलजेक्षणा । जलरूपा
    जह्नुकन्या यमुना जलजोदरी ॥ ५४॥ जलजास्या जाह्नवी च जलजाभा जलोदरी । यदुवंशोद्भवा जीवा यादवानन्दकारिणी
    ॥ ५५॥ यशोदा यशसां राशिर्यशोदानन्दकारिणी । ज्वलिनी ज्वालिनी ज्वाला ज्वलत्पावकसन्निभा ॥ ५६॥ ज्वालामुखी
    जगन्माता यमलार्जुनभञ्जनी । जन्मदा जन्महा जन्या जन्मभूर्जनकात्मजा ॥ ५७॥ जनानन्दा जाम्बवती जम्बूद्वीपकृतालया
    । जाम्बूनदसमानाभा जाम्बूनदविभूषणा ॥ ५८॥ जम्भहा जातिदा जातिर्ज्ञानदा ज्ञानगोचरा । ज्ञानरूपाऽज्ञानहा
    च ज्ञानविज्ञानशालिनी ॥ ५९॥ जिनजैत्री जिनाधारा जिनमाता जिनेश्वरी । जितेन्द्रिया जनाधारा अजिनाम्बरधारिणी
    ॥ ६०॥ शम्भुकोटिदुराधर्षा विष्णुकोटिविमर्दिनी । समुद्रकोटिगम्भीरा वायुकोटिमहाबला ॥ ६१॥ सूर्यकोटिप्रतीकाशा
    यमकोटिदुरापहा । कामधुक्कोटिफलदा शक्रकोटिसुराज्यदा ॥ ६२॥ कन्दर्पकोटिलावण्या पद्मकोटिनिभानना । पृथ्वीकोटिजनाधारा
    अग्निकोटिभयङ्करी ॥ ६३॥ अणिमा महिमा प्राप्तिर्गरिमा लघिमा तथा । प्राकाम्यदा वशकरी ईशिका सिद्धिदा तथा
    ॥ ६४॥ महिमादिगुणोपेता अणिमाद्यष्टसिद्धिदा । जवनध्नी जनाधीना जामिनी च जरापहा ॥ ६५॥ तारिणी तारिका तारा
    तोतला तुलसीप्रिया । तन्त्रिणी तन्त्ररूपा च तन्त्रज्ञा तन्त्रधारिणी ॥ ६६॥ तारहारा च तुलजा डाकिनीतन्त्रगोचरा
    । त्रिपुरा त्रिदशा त्रिस्था त्रिपुरासुरघातिनी ॥ ६७॥ त्रिगुणा च त्रिकोणस्था त्रिमात्रा त्रितनुस्थिता
    । त्रैविद्या च त्रयी त्रिघ्नी तुरीया त्रिपुरेश्वरी ॥ ६८॥ त्रिकोदरस्था त्रिविधा त्रैलोक्या त्रिपुरात्मिका
    । त्रिधाम्नी त्रिदशाराध्या त्र्यक्षा त्रिपुरवासिनी ॥ ६९॥ त्रिवर्णी त्रिपदी तारा त्रिमूर्तिजननी त्वरा
    । त्रिदिवा त्रिदिवेशाऽऽदिर्देवी त्रैलोक्यधारिणी ॥ ७०॥ त्रिमूर्तिश्च त्रिजननी त्रीभूस्त्रीपुरसुन्दरी
    । तपस्विनी तपोनिष्ठा तरुणी ताररूपिणी ॥ ७१॥ तामसी तापसी चैव तापघ्नी च तमोपहा । तरुणार्कप्रतीकाशा तप्तकाञ्चनसन्निभा
    ॥ ७२॥ उन्मादिनी तन्तुरूपा त्रैलोक्यव्यापिनीश्वरी । तार्किकी तर्किकी विद्या तापत्रयविनाशिनी ॥ ७३॥ त्रिपुष्करा
    त्रिकालज्ञा त्रिसन्ध्या च त्रिलोचना । त्रिवर्गा च त्रिवर्गस्था तपसस्सिद्धिदायिनी ॥ ७४॥ अधोक्षजा अयोध्या
    च अपर्णा च अवन्तिका । कारिका तीर्थरूपा च तीरा तीर्थकरी तथा ॥ ७५॥ दारिद्र्यदुःखदलिनी अदीना दीनवत्सला
    । दीनानाथप्रिया दीर्घा दयापूर्णा दयात्मिका ॥ ७६॥ देवदानवसम्पूज्या देवानां प्रियकारिणी । दक्षपुत्री
    दक्षमाता दक्षयज्ञविनाशिनी ॥ ७७॥ देवसूर्दक्षीणा दक्षा दुर्गा दुर्गतिनाशिनी । देवकीगर्भसम्भूता दुर्गदैत्यविनाशिनी
    ॥ ७८॥ अट्टाऽट्टहासिनी दोला दोलाकर्माभिनन्दिनी । देवकी देविका देवी दुरितघ्नी तटित्तथा ॥ ७९॥ गण्डकी
    गल्लकी क्षिप्रा द्वारा द्वारवती तथा । आनन्दोदधिमध्यस्था कटिसूत्रैरलङ्कृता ॥ ८०॥ घोराग्निदाहदमनी दुःखदुस्स्वप्ननाशिनी
    । श्रीमयी श्रीमती श्रेष्ठा श्रीकरी श्रीविभाविनी ॥ ८१॥ श्रीदा श्रीशा श्रीनिवासा श्रीमती श्रीर्मतिर्गतिः
    । धनदा दामिनी दान्ता धमदो धनशालिनी ॥ ८२॥ दाडिमीपुष्पसङ्काशा धनागारा धनञ्जया । धूम्राभा धूम्रदैत्त्रघ्नी
    धवला धवलप्रिया ॥ ८३॥ धूम्रवक्त्रा धूम्रनेत्रा धूम्रकेशी च धूसरा । धरणी धरिणी धैर्या धरा धात्री च धैर्यदा
    ॥ ८४॥ दमिनी धर्मिणी धूश्च दया दोग्ध्री दुरासदा । नारायणी नारसिंही नृसिंहहृदयालया ॥ ८५॥ नागिनी नागकन्या
    च नागसूर्नागनायिका । नानारत्नविचित्राङ्गी नानाभरणमण्डिता ॥ ८६॥ दुर्गस्था दुर्गरूपा च दुःखदुष्कृतनाशिनी
    । हीङ्कारी चैव श्रीङ्कारी हुङ्कारी क्लेशनाशिनी ॥ ८७॥ नगात्मजा नागरी च नवीना नूतनप्रिया । नीरजास्या
    नीरदाभा नवलावण्यसुन्दरी ॥ ८८॥ नीतिज्ञा नीतिदा नीतिर्निमनाभिर्नगेश्वरी । निष्ठा नित्या निरातङ्का नागयज्ञोपवीतिनी
    ॥ ८९॥ निधिदा निधिरूपाच निर्गुणा नरवाहिनी । नरमांसरता नारी नरमुण्डविभूषणा ॥ ९०॥ निराधारा निर्विकारा
    नुतिर्निर्वाणसुन्दरी । नरासृक्पानमत्ता च निर्वैरा नागगामिनी ॥ ९१॥ परमा प्रमिता प्राज्ञा पार्वती पर्वतात्मजा
    । पर्वप्रिया पर्वरता पर्वपावनपावनी ॥ ९२॥ परात्परतरा पूर्वा पश्चिमा पापनाशिनी । पशूनां पतिपत्नी च पतिभक्तिपरायणा
    ॥ ९३॥ परेशी पारगा पारा परञ्ज्योतिस्वरूपिणी । निष्ठुरा क्रूरहृदया परासिद्धिः परागतिः ॥ ९४॥ पशुघ्नी
    पशुरूपा च पशुहा पशुवाहिनी । पिता माता च यन्त्री च पशुपाशविनाशिनी ॥ ९५॥ पद्मिनी पद्महस्ता च पद्मकिञ्जल्कवासिनी
    । पद्मवक्त्रा च पद्माक्षी पद्मस्था पद्मसम्भवा ॥ ९६॥ पद्मास्या पञ्चमी पूर्णा पूर्णपीठनिवासिनी । पद्मरागप्रतीकाशा
    पाञ्चाली पञ्चमप्रिया ॥ ९७॥ परब्रह्मस्वरूपा च परब्रह्मनिवासिनी । परमानन्दमुदिता परचक्रनिवासिनी ॥ ९८॥
    परेशी परमा पृथ्वी पीनतुङ्गपयोधरा । परापरा पराविद्या परमानन्ददायिनी ॥ ९९॥ पूज्या प्रज्ञावती पुष्टिः
    पिनाकिपरिकीर्तिता । प्राणघ्नी प्राणरूपा च प्राणदा च प्रियंवदा ॥ १००॥ फणिभूषा फणावेशी फकारकण्ठमालिनी
    । फणिराड्वृतसर्वाङ्गी फलभागनिवासिनी ॥ १०१॥ बलभद्रस्य भगिनी बाला बालप्रदायिनी । फल्गुरुपा प्रलम्बध्नी
    फल्गूत्सव विनोदिनी ॥ १०२॥ भवानी भवपत्नी च भवभीतिहरा भवा । भवेश्वरी भवाराध्या भवेशी भवनायिका ॥ १०३॥
    भवमाता भवागम्या भवकण्टकनाशिनी । भवप्रिया भवानन्दा भव्या च भवमोचनी ॥ १०४॥ भावनीया भगवती भवभारविनाशिनी
    । भूतधात्री च भूतेशी भूतस्था भूतरूपिणी ॥ १०५॥ भूतमाता च भूतघ्नी भूतपञ्चकवासिनी । भोगोपचारकुशला भिस्साधात्री
    च भूचरी ॥ १०६॥ भीतिघ्नी भक्तिगम्या च भक्तानामार्तिनाशिनी । भक्तानुकम्पिनी भीमा भगिनी भगनायिका ॥ १०७॥
    भगविद्या भगक्लिन्ना भगयोनिर्भगप्रदा । भगेशी भगरूपा च भगगुह्या भगापहा ॥ १०८॥ भगोदरी भगानन्दा भगाद्या
    भगमालिनी । भोगप्रदा भोगवासा भोगमूला च भोगिनी ॥ १०९॥ भेरुण्डा भेदिनी भीमा भद्रकाली भिदोज्झिता । भैरवी
    भुवनेशानी भुवना भुवनेश्वरी ॥ ११०॥ भीमाक्षी भारती चैव भैरवाष्टकसेविता । भास्वरा भास्वती भीतिर्भास्वदुत्तानशायिनी
    ॥ १११॥ भागीरथी भोगवती भवघ्नी भुवनात्मिका । भूतिदा भूतिरूपा च भूतस्था भूतवर्धिनी ॥ ११२॥ माहेश्वरी महामाया
    महातेजा महासुरी । महाजिह्वा महालोला महादंष्ट्रा महाभुजा ॥ ११३॥ महामोहान्धकारघ्नी महामोक्षप्रदायिनी
    । महादारिद्र्यशमनी महाशत्रुविमर्दिनी ॥ ११४॥ महाशक्तिर्महाज्योतिर्महासुरविमर्दिनी । महाकाया महावीर्या
    महापातकनाशिनी ॥ ११५॥ महारवा मन्त्रमयी मणिपूरनिवासिनी । मानसी मानदा मान्या मनश्चक्षुरगोचरा ॥ ११६॥ माहेन्द्री
    मधुरा माया महिषासुरमर्दिनी । महाकुण्डलिनी शक्तिर्महाविभववर्धिनी ॥ ११७॥ मानसी माधवी मेधा मतिदा मतिधारिणी
    । मेनकागर्भसम्भूता मेनकाभगिनी मतिः ॥ ११८॥ महोदरी मुक्तकेशी मुक्तिकाम्यार्थसिद्धिदा । माहेशी महिषारूढा
    मधुदैत्यविमर्दिनी ॥ ११९॥ महाव्रता महामूर्धा महाभयविनाशिनी । मातङ्गी मत्तमातङ्गी मातङ्गकुलमण्डिता ॥
    १२०॥ महाघोरा माननीया मत्तमातङ्गगामिनी । मुक्ताहारलतोपेता मदधूर्णितलोचना ॥ १२१॥ महापराधराशिघ्री महाचोरभयापहा
    । महाचिन्त्यस्वरूपा च मणीमन्त्रमहौषधी ॥ १२२॥ मणिमण्डपमध्यस्था मणिमालाविराजिता । मन्त्रात्मिका मन्त्रगम्या
    मन्त्रमाता सुमन्त्रिणी ॥ १२३॥ मेरुमन्दिरमध्यस्था मकराकृतिकुण्डला । मन्थरा च महासूक्ष्मा महादूती महेश्वरी
    ॥ १२४॥ मालिनी मानवी माध्वी मदरूपा मदोत्कटा । मदिरा मधुरा चैव मोदिनी च महोद्धता ॥ १२५॥ मङ्गलाङ्गी मधुमयी
    मधुपानपरायणा । मनोरमा रमामाता राजराजेश्वरी रमा ॥ १२६॥ राजमान्या राजपूज्या रक्तोत्पलविभूषणा । राजीवलोचना
    रामा राधिका रामवल्लभा ॥ १२७॥ शाकिनी डाकिनी चैव लावण्याम्बुधिवीचिका । रुद्राणी रुद्ररूपा च रौद्रा रुद्रार्तिनाशिनी
    ॥ १२८॥ रक्तप्रिया रक्तवस्त्रा रक्ताक्षी रक्तलोचना । रक्तकेशी रक्तदंष्ट्रा रक्तचन्दनचर्चिता ॥ १२९॥
    रक्ताङ्गी रक्तभूषा च रक्तबीजनिपातिनी । रागादिदोषरहिता रतिजा रतिदायिनी ॥ १३०॥ विश्वेश्वरी विशालाक्षी
    विन्ध्यपीठनिवासिनी । विश्वभूर्वीरविद्या च वीरसूर्वीरनन्दिनी ॥ १३१॥ वीरेश्वरी विशालाक्षी विष्णुमाया
    विमोहिनी । विद्यावती विष्णुरूपा विशालनयनोज्ज्वला ॥ १३२॥ विष्णुमाता च विश्वात्मा विष्णुजायास्वरूपिणी
    । वाराही वरदा वन्द्या विख्याता विलसल्कचा ॥ १३३॥ ब्रह्मेशी ब्रह्मदा ब्राह्मी ब्रह्माणी ब्रह्मरूपिणी
    । द्वारका विश्ववन्द्या च विश्वपाशविमोचनी । विश्वासकारिणी विश्वा विश्वशक्तिर्विचक्षणा ॥ १३४॥ बाणचापधरा
    वीरा बिन्दुस्था बिन्दुमालिनी । षट्चक्रभेदिनी षोढा षोडशारनिवासिनी ॥ १३५॥ शितिकण्ठप्रिया शान्ता शाकिनी
    वातरूपिणी । शाश्वती शम्भुवनिता शाम्भवी शिवरूपिणी ॥ १३६॥ शिवमाता च शिवदा शिवा शिवहृदासना । शुक्लाम्बरा
    शीतला च शीला शीलप्रदायिनी ॥ १३७॥ शिशुप्रिया वैद्यविद्या सालग्रामशिला शुचिः । हरिप्रिया हरमूर्तिर्हरिनेत्रकृतालया
    ॥ १३८॥ हरिवक्त्रोद्भवा हाला हरिवक्षःस्थलस्थिता । क्षेमङ्करी क्षितिः क्षेत्रा क्षुधितस्य प्रपूरणी ॥
    १३९॥ वैश्या च क्षत्रिया शूद्री क्षत्रियाणां कुलेश्वरी । हरपत्नी हराराध्या हरसूर्हररूपिणी ॥ १४०॥ सर्वानन्दमयी
    सिद्धिस्सर्वरक्षास्वरूपिणी । सर्वदुष्टप्रशमनी सर्वेप्सितफलप्रदा ॥ १४१॥ सर्वसिद्धेश्वराराध्या सर्वमङ्गलमङ्गला
    । फलश्रुतिः । पुण्यं सहस्रनामेदं तव प्रीत्या प्रकाशितम् ॥ १४२॥ गोपनीयं प्रयत्नेन पठनीयं प्रयत्नतः
    । नातः परतरं पुण्यं नातः परतरं तपः ॥ १४३॥ नातः परतरं स्तोत्रं नातः परतरा गतिः । स्तोत्रं नामसहस्राख्यं
    मम वक्त्राद्विनिर्गतम् ॥ १४४॥ यः पठेत्परया भक्त्या श
