id: navagrahastotravadiraja
category: stotram
name:
  english: navagrahastotravadiraja
  devanagari: नवग्रहस्तोत्रवादिराज
content:
  english: navagrahastotram vadirajayativiracita bhasvanme bhasayet tattvam candrashcahladakridbhavet
    | mangalo mangalam dadyat budhashca budhatam dishet || 1|| gururme gurutam dadyat kavishca kavitam
    dishet | shanishca sham prapayatu ketuh ketum jaye'rpayet || 2|| rahurme rahayedrogam grahah santu
    karagrahah | navam navam mamaishvaryam dishantvete navagrahah || 3|| shane dinamaneh suno hyanekagunasanmane
    | arishtam hara me'bhishtam kuru ma kuru sankatam || 4|| hareranugraharthaya shatrunam nigrahaya ca
    | vadirajayatiproktam grahastotram sada pathet || 5|| || iti shrivadirajayativiracitam navagrahastotram
    ||
  devanagari: नवग्रहस्तोत्रं वादिराजयतिविरचित भास्वान्मे भासयेत् तत्त्वं चन्द्रश्चाह्लादकृद्भवेत् । मङ्गलो
    मङ्गलं दद्यात् बुधश्च बुधतां दिशेत् ॥ १॥ गुरुर्मे गुरुतां दद्यात् कविश्च कवितां दिशेत् । शनिश्च शं
    प्रापयतु केतुः केतुं जयेऽर्पयेत् ॥ २॥ राहुर्मे राहयेद्रोगं ग्रहाः सन्तु करग्रहाः । नवं नवं ममैश्वर्यं
    दिशन्त्वेते नवग्रहाः ॥ ३॥ शने दिनमणेः सूनो ह्यनेकगुणसन्मणे । अरिष्टं हर मेऽभीष्टं कुरु मा कुरु सङ्कटम्
    ॥ ४॥ हरेरनुग्रहार्थाय शत्रुणां निग्रहाय च । वादिराजयतिप्रोक्तं ग्रहस्तोत्रं सदा पठेत् ॥ ५॥ ॥ इति श्रीवादिराजयतिविरचितं
    नवग्रहस्तोत्रम् ॥
meaning: {}
