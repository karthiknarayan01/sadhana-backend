id: vinayaka
category: stotram
name:
  english: vinayaka
  devanagari: विनायक
content:
  english: shrivinayakastotram om mushikavahana modakahasta camarakarna vilambitasutra | vamanarupa maheshvaraputra
    vighnavinayaka pada namaste || devadevasutam devam jagadvighnavinayakam | hastirupam mahakayam suryakotisamaprabham
    || 1|| vamanam jatilam kantam hrasvagrivam mahodaram | dhumrasindurayudgandam vikatam prakatotkatam
    || 2|| ekadantam pralamboshtham nagayajnopavitinam | tryaksham gajamukham krishnam sukritam raktavasasam
    || 3|| dantapanim ca varadam brahmanyam brahmacarinam | punyam ganapatim divyam vighnarajam namamyaham
    || 4|| devam ganapatim natham vishvasyagre tu gaminam | devanamadhikam shreshtham nayakam suvinayakam
    || 5|| namami bhagavam devam adbhutam gananayakam | vakratunda pracandaya ugratundaya te namah ||
    6|| candaya gurucandaya candacandaya te namah | mattonmattapramattaya nityamattaya te namah || 7||
    umasutam namasyami gangaputraya te namah | onkaraya vashatkara svahakaraya te namah || 8|| mantramurte
    mahayogin jatavede namo namah | parashupashakahastaya gajahastaya te namah || 9|| meghaya meghavarnaya
    megheshvara namo namah | ghoraya ghorarupaya ghoraghoraya te namah || 10|| puranapurvapujyaya purushaya
    namo namah | madotkata namaste'stu namaste candavikrama || 11|| vinayaka namaste'stu namaste bhaktavatsala
    | bhaktapriyaya shantaya mahatejasvine namah || 12|| yajnaya yajnahotre ca yajneshaya namo namah |
    namaste shuklabhasmanga shuklamaladharaya ca || 13|| madaklinnakapolaya ganadhipataye namah | raktapushpa
    priyaya ca raktacandana bhushita || 14|| agnihotraya shantaya aparajayya te namah | akhuvahana devesha
    ekadantaya te namah || 15|| shurpakarnaya shuraya dirghadantaya te namah | vighnam haratu devesha
    shivaputro vinayakah || 16|| phalashruti japadasyaiva homacca sandhyopasanasastatha | vipro bhavati
    vedadhyah kshatriyo vijayi bhavet || vaishyo dhanasamriddhah syat shudrah papaih pramucyate | garbhini
    janayetputram kanya bhartaramapnuyat || pravasi labhate sthanam baddho bandhat pramucyate | ishtasiddhimavapnoti
    punatyasattamam kulam || sarvamangalamangalyam sarvapapapranashanam | sarvakamapradam pumsam pathatam
    shrunutamapi || || iti shribrahmandapurane skandaprokta vinayakastotram sampurnam ||
  devanagari: श्रीविनायकस्तोत्रम् ॐ मूषिकवाहन मोदकहस्त चामरकर्ण विलम्बितसूत्र । वामनरूप महेश्वरपुत्र विघ्नविनायक
    पाद नमस्ते ॥ देवदेवसुतं देवं जगद्विघ्नविनायकम् । हस्तिरूपं महाकायं सूर्यकोटिसमप्रभम् ॥ १॥ वामनं जटिलं
    कान्तं ह्रस्वग्रीवं महोदरम् । धूम्रसिन्दूरयुद्गण्डं विकटं प्रकटोत्कटम् ॥ २॥ एकदन्तं प्रलम्बोष्ठं नागयज्ञोपवीतिनम्
    । त्र्यक्षं गजमुखं कृष्णं सुकृतं रक्तवाससम् ॥ ३॥ दन्तपाणिं च वरदं ब्रह्मण्यं ब्रह्मचारिणम् । पुण्यं
    गणपतिं दिव्यं विघ्नराजं नमाम्यहम् ॥ ४॥ देवं गणपतिं नाथं विश्वस्याग्रे तु गामिनम् । देवानामधिकं श्रेष्ठं
    नायकं सुविनायकम् ॥ ५॥ नमामि भगवं देवं अद्भुतं गणनायकम् । वक्रतुण्ड प्रचण्डाय उग्रतुण्डाय ते नमः ॥
    ६॥ चण्डाय गुरुचण्डाय चण्डचण्डाय ते नमः । मत्तोन्मत्तप्रमत्ताय नित्यमत्ताय ते नमः ॥ ७॥ उमासुतं नमस्यामि
    गङ्गापुत्राय ते नमः । ओङ्काराय वषट्कार स्वाहाकाराय ते नमः ॥ ८॥ मन्त्रमूर्ते महायोगिन् जातवेदे नमो
    नमः । परशुपाशकहस्ताय गजहस्ताय ते नमः ॥ ९॥ मेघाय मेघवर्णाय मेघेश्वर नमो नमः । घोराय घोररूपाय घोरघोराय
    ते नमः ॥ १०॥ पुराणपूर्वपूज्याय पुरुषाय नमो नमः । मदोत्कट नमस्तेऽस्तु नमस्ते चण्डविक्रम ॥ ११॥ विनायक
    नमस्तेऽस्तु नमस्ते भक्तवत्सल । भक्तप्रियाय शान्ताय महातेजस्विने नमः ॥ १२॥ यज्ञाय यज्ञहोत्रे च यज्ञेशाय
    नमो नमः । नमस्ते शुक्लभस्माङ्ग शुक्लमालाधराय च ॥ १३॥ मदक्लिन्नकपोलाय गणाधिपतये नमः । रक्तपुष्प प्रियाय
    च रक्तचन्दन भूषित ॥ १४॥ अग्निहोत्राय शान्ताय अपराजय्य ते नमः । आखुवाहन देवेश एकदन्ताय ते नमः ॥ १५॥
    शूर्पकर्णाय शूराय दीर्घदन्ताय ते नमः । विघ्नं हरतु देवेश शिवपुत्रो विनायकः ॥ १६॥ फलश्रुति जपादस्यैव
    होमाच्च सन्ध्योपासनसस्तथा । विप्रो भवति वेदाढ्यः क्षत्रियो विजयी भवेत् ॥ वैश्यो धनसमृद्धः स्यात् शूद्रः
    पापैः प्रमुच्यते । गर्भिणी जनयेत्पुत्रं कन्या भर्तारमाप्नुयात् ॥ प्रवासी लभते स्थानं बद्धो बन्धात्
    प्रमुच्यते । इष्टसिद्धिमवाप्नोति पुनात्यासत्तमं कुलं ॥ सर्वमङ्गलमाङ्गल्यं सर्वपापप्रणाशनम् । सर्वकामप्रदं
    पुंसां पठतां श्रुणुतामपि ॥ ॥ इति श्रीब्रह्माण्डपुराणे स्कन्दप्रोक्त विनायकस्तोत्रं सम्पूर्णम् ॥
