id: gangasahasranaamastotram-3-2
category: sahasranama
name:
  english: gangasahasranaamastotram 3
  devanagari: गन्गासहस्रनआमस्तोत्रम् ३
content:
  english: sadhu sadhu mahadevi prishtam namamritam tvaya | guhyadguhyataram stotram pravakshyami samasatah
    || 3|| yasya smaranamatrena naro vai shivatam vrajet | pathanallikhanaccaiva pujanat kim na jayate
    || 4|| shlokamekam pathitvapi gangayah shatayojane | gangasnanaphalam sadyah prapnuyannatra samshayah
    || 5|| sahasranamastotrasya bhagiratharishirmatah | chando'nushtup tatha khyatam ganga vai devata
    mata || 6|| sarvatah papanashartham sarvakamarthasiddhaye | akshayasvargakamaya viniyogah prakirtitah
    || 7|| om ganga saridvara vishnupadambujajanih para | shivashekharasamvasa brahmanah kalashasthita
    || 8|| akashagamini bhadra caturatma pravahini | brahmarandhrasamudbhuta brahmarandhranivasini ||
    9|| brahmarandhradhara devi sarvakamarthadayini | brahmandojhedanapara parabrahmadhara para || 10||
    dravarupadhara caiva shivasangamadayini | muktida bhuktidananga shatrudavanalatmika || 11|| anangangi
    trimurtishca brahmani kamala sthita | sarasvati ca savitri jayasena jayatmika || 12|| jayabhadra vaishnavi
    ca cicchaktih parameshvari | trayi vedavadanya ca medini bhedini dhara || 13|| vedamurtistrimurtishca
    devamutirdayapara | damini daminivasa kulisha kulishapriya || 14|| kulishangi kulangi ca kulanathakutumbini
    | kulina subhaga bhagya bhagyagamya yashomati || 15|| kala kaladharadhara kaladharashatapriya | shodashi
    shodasharadhya shodhanyasasahayini || 16|| shodha samasavilaya shodhangi kalarupini | kalika mundamala
    ca kalanam shatanashini || 17|| kalangi kalanilaya kala kaleshvari vara | shaivi maya shiva runda
    candamunda vinashini || 18|| candattahasa durgamya candanam pritivarddhina | candeshvari mahaprajna
    prasadhih siddhidayini || 19|| lakshalabhasya janani shatalabha sureshvari | kaumari shaktiruddishta
    kraucadaityavinashini || 20|| tarakasurahantri ca tarakamayagamini | tarakasya parashaktistarakanam
    patipriya || 21|| tarakeshapara jyotsna tareshashatarupini | narayani dayasindhuh sindhuttaranivasini
    || 22|| sindhushreshthatama bharya ratnada ratnaharini | jalandharasya janani jalandharavirupini ||
    23|| kamamata ca kamaghni ratirupa shatapriya | bhishmamata mahabhishma bhishmanam pritivarddhini
    || 24|| jvala karali tungeshi tungashekharavasini | tungeshvarasahaya vadaryashramavasini || 25||
    shrikshetranilaya caiva dvarastha dvarapalini | jahnavi jahnatanaya nagalayanivasini || 26|| naganam
    janani caiva nagapritivirddhini | nageshvarasahaya ca kailasanilaya tatha || 27|| mahaprabha varenya
    ca vedamata vilasini | harasangarata caiva haripadavinihsrita || 28|| aditishca ditishcaiva kadru
    ca vinata tatha | surasa cagnibharya ca ratnagarbha vibhavari || 29|| sharadi vai candrakala nalakubarasevita
    | arishtanemiduhita nahushanganavasini || 30| shantanorguhini bhavya vasumata krishodari | matsyodari
    suraradhya suranam pritidayini || 31|| yamuna candrabhaga ca shatadruh sarayustatha | sarasvati shubhamoda
    nandanadrinivasini || 32|| nandapriyanganilaya devatirthanivasini | rudrani rudrasavitri mahabhairavanadini
    || 33|| bhairavi bhashanavara bhrigutunganivasini | kedarashikharavasa mahavalayavasini || 34|| tungabhadra
    sushena ca mandhatrijayadayini | bhutabhavyapara sharvakharvavarga nripeshvari || 35|| bhavishyajnanada
    bhutajnanada vartamanada | shukrasya janani saumya vyasamata sureshvari || 36|| dharapanadhara dhira
    dhairyada shubhadayini | kankana kankanaprakhya shubhakankanadayini || 37|| kankanaih patakahara prabala
    shatrunashini | smaratam muktida bhuktirupa rupavirjita || 38|| devanika devasevya sevarupaphalamala
    | krittika kartikavasa kartikasnanadayini || 39|| pushkara pushkaravasa pushpapracayasundari | munisevya
    munirmena manavakaradharini || 40|| mainakashikharavasa kashipuranivasini | mahaprayaganilaya tirtharajaprasadhini
    || 41|| akshaya kshayarupa samsarakshayakarini | mrigashirshadhara margashirshasnanaphalaprada ||
    42|| punyanakshatrarupa ca paushe'tivaphalaprada | maghi maghayuta madhya maghasnananivasini || 43||
    shri pancami shriyorupa shashticaranyasamjnita | acala nishcala jamburjambudvipasahayini || 44|| bhishmashtami
    bhishmagarbha bhishmapancakasevita | ekadashi dvadashi ca punyapunyasahayini || 45|| punyada punyanilaya
    punyangi caruvahini | phalguni phalgune sevya holika gandharupini || 46|| hutashani maha devi santushta
    bhasmadharini | vasantartususevya ca vasantotsavadayini || 47|| caitri citra pushpaganarupa ganeshvari
    | makarandasvarupa ca makarandanivasini || 48|| caitrashuklapratipada varsharambhakara shubha | madhavi
    madhavagara madhavapritidayini || 49|| vishakha venupapaghni vaishakhi bhanusaptami | vaishakhasnanashubhada
    pindakaranivasini || 50|| tathakshayatritiya ca saktudanashubhaprada | prapapunyaprada caiva nityasnanavashikrita
    || 51|| jyeshtha jyeshthasya mahata dashapapapranashini | nirjjala rupini caiva tathanalashaya mata
    || 52|| ashar̤hai carusarvangi tatha harishayasthita | shravani shravanananda sarvasaukhyapradayini
    || 53|| bhadra bhadrapade sevya janma janmashtami tatha | durvapujanasantushta bijankuranivasini ||
    54|| ashvine sutaram sevya pitribhaktipradayini | navami krishnapakshasya shuklapakshasya purnima
    || 55|| navaratrasahayam ca kalaratrirmahashtami | ashvini bhaumavarasya shatarupa hyayonija || 56||
    harasevya harangi ca haramandiragamini | pramoda modasankalpa nanarupa mahodari || 57|| mahanandapradatri
    ca nanalankaradharini | alankarapriya caiva nanatithisamashraya || 58|| timingiladhara svaccha nanagravavidarini
    | gandashailavaha caiva kamadevadharambara || 59|| sarvatirthamayi sarvadevadanavarupini | kashiprantavaha
    tucchapravaha bharanashini || 60|| bharani bharanangi ca tathyatathyapriya sati | satinam prathamam
    ganya ganya sarvamayi prabhuh || 61|| dhirddharanavati sarvajanasya hridi samsthita | sthitirupa sthitidhara
    sthirangi kamalapriya || 62|| kushocchinnatara caiva durvankuravirajita | tarangini shaivalini tarangashatasankula
    || 63|| mahakacchapanilaya kacchapaprishthasamsthita | nanajantudhara prokta nanajantuvinashini ||
    64|| varshakalatara saumya vatakallolakarini | tirasthashavasancchanna dhanyanam shavavahini || 65||
    tarangashatashobhadhya tarangashatamalini | svarnarikucakumbhasya kunkumarunasundari || 66|| nanapushpopahara
    ca sukhasampattidayini | mandakini saricchreshtha sarvadevavigahini || 67|| sarvalokamayi tandra tantrashastravinodini
    | tantri tantrasthita vidya mahadevakutumbini || 68|| sarvashastramayi nanda vasaveshvarapalini |
    shaci pulomaja tunga kashyapashya priya mata || 69|| srishtih srishtikridaradhya pralaye kalarupini
    | dvadashadityasadrishi prabha trailokyadipika || 70|| trilokanilaya vedya edarupaghamadin |
  devanagari: साधु साधु महादेवि पृष्टं नामामृतं त्वया । गुह्याद्गुह्यतरं स्तोत्रं प्रवक्ष्यामि समासतः
    ॥ ३॥ यस्य स्मरणमात्रेण नरो वै शिवतां व्रजेत् । पठनाल्लिखनाच्चैव पूजनात् किं न जायते ॥ ४॥ श्लोकमेकं
    पठित्वापि गङ्गायाः शतयोजने । गङ्गास्नानफलं सद्यः प्राप्नुयान्नात्र संशयः ॥ ५॥ सहस्रनामस्तोत्रस्य भगीरथऋषिर्मतः
    । छन्दोऽनुष्टुप् तथा ख्यातं गङ्गा वै देवता मता ॥ ६॥ सर्वतः पापनाशार्थं सर्वकामार्थसिद्धये । अक्षयस्वर्गकामाय
    विनियोगः प्रकीर्तितः ॥ ७॥ ॐ गङ्गा सरिद्वरा विष्णुपादाम्बुजजनिः परा । शिवशेखरसंवासा ब्रह्मणः कलशस्थिता
    ॥ ८॥ आकाशगामिनी भद्रा चतुरात्मा प्रवाहिनी । ब्रह्मरन्ध्रसमुद्भूता ब्रह्मरन्ध्रनिवासिनी ॥ ९॥ ब्रह्मरन्ध्रधरा
    देवी सर्वकामार्थदायिनी । ब्रह्माण्डोझेदनपरा परब्रह्मधरा परा ॥ १०॥ द्रवरूपधरा चैव शिवसङ्गमदायिनी ।
    मुक्तिदा भुक्तिदानङ्गा शत्रुदावानलात्मिका ॥ ११॥ अनङ्गाङ्गी त्रिमूर्तिश्च ब्रह्माणी कमला स्थिता । सरस्वती
    च सावित्री जयसेना जयात्मिका ॥ १२॥ जयभद्रा वैष्णवी च चिच्छक्तिः परमेश्वरी । त्रयी वेदवदान्या च मेदिनी
    भेदिनी धरा ॥ १३॥ वेदमूर्तिस्त्रिमूर्तिश्च देवमूतिर्दयापरा । दामिनी दामिनीवासा कुलिशा कुलिशप्रिया ॥
    १४॥ कुलिशाङ्गी कुलाङ्गी च कुलनाथकुटुम्बिनी । कुलीना सुभगा भाग्या भाग्यगम्या यशोमती ॥ १५॥ कला कलाधरधरा
    कलाधरशतप्रिया । षोडशी षोडशाराध्या षोढान्याससहायिनी ॥ १६॥ षोढा समासविलया षोढाङ्गी कालरूपिणी । कालिका
    मुण्डमाला च कालानां शतनाशिनी ॥ १७॥ कालाङ्गी कालनिलया काला कालेश्वरी वरा । शैवी माया शिवा रुण्डा चण्डमुण्ड
    विनाशिनी ॥ १८॥ चण्डाट्टहासा दुर्गम्या चण्डानां प्रीतिवर्द्धिना । चण्डेश्वरी महाप्राज्ञा प्रसाधीः सिद्धिदायिनी
    ॥ १९॥ लक्षलाभस्य जननी शतलाभा सुरेश्वरी । कौमारी शक्तिरुद्दिष्टा क्रौचदैत्यविनाशिनी ॥ २०॥ तारकासुरहन्त्री
    च तारकामयगामिनी । तारकस्य पराशक्तिस्तारकाणां पतिप्रिया ॥ २१॥ तारकेशपरा ज्योत्स्ना तारेशशतरूपिणी ।
    नारायणी दयासिन्धुः सिन्धूत्तरनिवासिनी ॥ २२॥ सिन्धुश्रेष्ठतमा भार्या रत्नदा रत्नहारिणी । जलन्धरस्य
    जननी जलन्धरविरूपिणी ॥ २३॥ काममाता च कामघ्नी रतिरूपा शतप्रिया । भीष्ममाता महाभीष्मा भीष्माणां प्रीतिवर्द्धिनी
    ॥ २४॥ ज्वाला कराली तुङ्गेशी तुङ्गशेखरवासिनी । तुङ्गेश्वरसहाया वदर्याश्रमवासिनी ॥ २५॥ श्रीक्षेत्रनिलया
    चैव द्वारस्था द्वारपालिनी । जाह्नवी जह्नतनया नागालयनिवासिनी ॥ २६॥ नागानां जननी चैव नागप्रीतिविर्द्धिनी
    । नागेश्वरसहाया च कैलासनिलया तथा ॥ २७॥ महाप्रभा वरेण्या च वेदमाता विलासिनी । हरसङ्गरता चैव हरिपादविनिःसृता
    ॥ २८॥ अदितिश्च दितिश्चैव कद्रू च विनता तथा । सुरसा चाग्निभार्या च रत्नगर्भा विभावरी ॥ २९॥ शारदी वै
    चन्द्रकला नलकूबरसेविता । अरिष्टनेमिदुहिता नहुषाङ्गणवासिनी ॥ ३०। शन्तनोर्गुहिणी भव्या वसुमाता कृशोदरी
    । मत्स्योदरी सुराराध्या सुराणां प्रीतिदायिनी ॥ ३१॥ यमुना चन्द्रभागा च शतद्रूः सरयूस्तथा । सरस्वती
    शुभामोदा नन्दनाद्रिनिवासिनी ॥ ३२॥ नन्दप्रियाङ्गनिलया देवतीर्थनिवासिनी । रुद्राणी रुद्रसावित्री महाभैरवनादिनी
    ॥ ३३॥ भैरवी भाषणवरा भृगुतुङ्गनिवासिनी । केदारशिखरावासा महावलयवासिनी ॥ ३४॥ तुङ्गभद्रा सुषेणा च मान्धातृजयदायिनी
    । भूतभव्यपरा शर्वाखर्ववर्गा नृपेश्वरी ॥ ३५॥ भविष्यज्ञानदा भूतज्ञानदा वर्तमानदा । शुक्रस्य जननी सौम्या
    व्यासमाता सुरेश्वरी ॥ ३६॥ धारापानधरा धीरा धैर्यदा शुभदायिनी । कङ्कणा कङ्कणप्रख्या शुभकङ्कणदायिनी ॥
    ३७॥ कङ्कणैः पातकहरा प्रबला शत्रुनाशिनी । स्मरतां मुक्तिदा भुक्तिरूपा रूपविर्जिता ॥ ३८॥ देवानीका देवसेव्या
    सेवारूपफलामला । कृत्तिका कार्तिकावासा कार्तिकस्नानदायिनी ॥ ३९॥ पुष्करा पुष्करावासा पुष्पप्रचयसुन्दरी
    । मुनिसेव्या मुनिर्मेना मानवाकारधारिणी ॥ ४०॥ मैनाकशिखरावासा काशीपुरनिवासिनी । महाप्रयागनिलया तीर्थराजप्रसाधिनी
    ॥ ४१॥ अक्षया क्षयरूपा संसारक्षयकारिणी । मृगशीर्षधरा मार्गशीर्षस्नानफलप्रदा ॥ ४२॥ पुण्यनक्षत्ररूपा
    च पौषेऽतीवफलप्रदा । माघी मघायुता माध्या माघस्नाननिवासिनी ॥ ४३॥ श्री पञ्चमी श्रियोरूपा षष्टिचारण्यसंज्ञिता
    । अचला निश्चला जम्बूर्जम्बूद्वीपसहायिनी ॥ ४४॥ भीष्माष्टमी भीष्मगर्भा भीष्मपञ्चकसेविता । एकादशी द्वादशी
    च पुण्यापुण्यसहायिनी ॥ ४५॥ पुण्यदा पुण्यनिलया पुण्याङ्गी चारुवाहिनी । फाल्गुनी फाल्गुने सेव्या होलिका
    गन्धरूपिणी ॥ ४६॥ हुताशनी मह देवी सन्तुष्टा भस्मधारिणी । वसन्तर्तुसुसेव्या च वसन्तोत्सवदायिनी ॥ ४७॥
    चैत्री चित्रा पुष्पगणरूपा गणेश्वरी । मकरन्दस्वरूपा च मकरन्दनिवासिनी ॥ ४८॥ चैत्रशुक्लप्रतिपदा वर्षारम्भकरा
    शुभा । माधवी माधवागारा माधवप्रीतिदायिनी ॥ ४९॥ विशाखा वेणुपापघ्नी वैशाखी भानुसप्तमी । वैशाखस्नानशुभदा
    पिण्डाकरनिवासिनी ॥ ५०॥ तथाक्षयतृतीया च सक्तुदानशुभप्रदा । प्रपापुण्यप्रदा चैव नित्यस्नानवशीकृता ॥
    ५१॥ ज्येष्ठा ज्येष्ठस्य महता दशपापप्रणाशिनी । निर्ज्जला रूपिणी चैव तथानलशया मता ॥ ५२॥ आषाढ़ई चारुसर्वाङ्गी
    तथा हरिशयस्थिता । श्रावणी श्रवणानन्दा सर्वसौख्यप्रदायिनी ॥ ५३॥ भद्रा भाद्रपदे सेव्या जन्मा जन्माष्टमी
    तथा । दूर्वापूजनसन्तुष्टा बीजाङ्कुरनिवासिनी ॥ ५४॥ आश्विने सुतरां सेव्या पितृभक्तिप्रदायिनी । नवमी
    कृष्णपक्षस्य शुक्लपक्षस्य पूर्णिमा ॥ ५५॥ नवरात्रसहायां च कालरात्रिर्महाष्टमी । अश्विनी भौमवारस्य शतरूपा
    ह्ययोनिजा ॥ ५६॥ हरसेव्या हराङ्गी च हरमन्दिरगामिनी । प्रमोदा मोदसङ्कल्पा नानारूपा महोदरी ॥ ५७॥ महानन्दप्रदात्री
    च नानालङ्कारधारिणी । अलङ्कारप्रिया चैव नानातिथिसमाश्रया ॥ ५८॥ तिमिङ्गिलधरा स्वच्छा नानाग्रावविदारिणी
    । गण्डशैलवहा चैव कामदेवधराम्बरा ॥ ५९॥ सर्वतीर्थमयी सर्वदेवदानवरूपिणी । काशीप्रान्तवहा तुच्छप्रवाहा
    भारनाशिनी ॥ ६०॥ भरणी भारणाङ्गी च तथ्यातथ्यप्रिया सती । सतीनां प्रथमं गण्या गण्या सर्वमयी प्रभुः ॥
    ६१॥ धीर्द्धारणावती सर्वजनस्य हृदि संस्थिता । स्थितिरूपा स्थितिधरा स्थिराङ्गी कमलप्रिया ॥ ६२॥ कुशोच्छिन्नतरा
    चैव दुर्वाङ्कुरविराजिता । तरङ्गिणी शैवलिनी तरङ्गशतसङ्कुला ॥ ६३॥ महाकच्छपनिलया कच्छपपृष्ठसंस्थिता ।
    नानाजन्तुधरा प्रोक्ता नानाजन्तुविनाशिनी ॥ ६४॥ वर्षाकालतरा सौम्या वातकल्लोलकारिणी । तीरस्थशवसञ्च्छन्ना
    धन्यानां शववाहिनी ॥ ६५॥ तरङ्गशतशोभाढ्या तरङ्गशतमालिनी । स्वर्नारीकुचकुम्भस्य कुङ्कुमारुणसुन्दरी ॥
    ६६॥ नानापुष्पोपहारा च सुखसम्पत्तिदायिनी । मन्दाकिनी सरिच्छ्रेष्ठा सर्वदेवविगाहिनी ॥ ६७॥ सर्वलोकमयी
    तन्द्रा तन्त्रशास्त्रविनोदिनी । तन्त्री तन्त्रस्थिता विद्या महादेवकुटुम्बिनी ॥ ६८॥ सर्वशास्त्रमयी
    नन्दा वासवेश्वरपालिनी । शची पुलोमजा तुङ्गा कश्यपश्य प्रिया मता ॥ ६९॥ सृष्टिः सृष्टिकृदाराध्या प्रलये
    कालरूपिणी । द्वादशादित्यसदृशी प्रभा त्रैलोक्यदीपिका ॥ ७०॥ त्रिलोकनिलया वेद्या एदरूपाघमदिन् ।
