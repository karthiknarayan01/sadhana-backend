id: naradakritamharistotram
category: stotram
name:
  english: naradakritamharistotram
  devanagari: नारदकृतंहरिस्तोत्रम्
content:
  english: '| kotikandarpalavanyavilasah kamavarjitah || 29|| brahmacaryasi devesha prasida satyavagvibho
    | ashritanam kalpavriksho dinanam duhkhaharakah || 30|| jnanena bandhaha brahmasukhadata prasidatam
    | jivantarindriyasukshmabhuta''ntaryaminishvara || 31|| brahmasukhanubhute tvam prasida cidacinmaya
    | yadashritah sura duhkhambudhim taranti gopadam || 32|| namaste sarvada parabrahmane brahmane tatha
    | vasudevaya krishnaya bhumne narayanaya ca || 33|| mahavishnusvarupaya vairajaya ca te namah | namo
    hiranyakoshaya tridevebhyo namo namah || 34|| adya me saphalam janma cadya me saphalam tapah | adya
    me saphalam jnanam shrihare tava darshanat || 35|| iti shrilakshminarayaniyasamhitayam prathame kritayugasantane
    206'
  devanagari: । कोटिकन्दर्पलावण्यविलासः कामवर्जितः ॥ २९॥ ब्रह्मचार्यसि देवेश प्रसीद सत्यवाग्विभो । आश्रितानां
    कल्पवृक्षो दीनानां दुःखहारकः ॥ ३०॥ ज्ञानेन बन्धहा ब्रह्मसुखदाता प्रसीदताम् । जीवान्तरिन्द्रियसूक्ष्मभूताऽन्तर्यामिनीश्वर
    ॥ ३१॥ ब्रह्मसुखानुभूते त्वं प्रसीद चिदचिन्मय । यदाश्रिताः सुरा दुःखाम्बुधिं तरन्ति गोपदम् ॥ ३२॥ नमस्ते
    सर्वदा परब्रह्मणे ब्रह्मणे तथा । वासुदेवाय कृष्णाय भूम्ने नारायणाय च ॥ ३३॥ महाविष्णुस्वरूपाय वैराजाय
    च ते नमः । नमो हिरण्यकोशाय त्रिदेवेभ्यो नमो नमः ॥ ३४॥ अद्य मे सफलं जन्म चाद्य मे सफलं तपः । अद्य मे
    सफलं ज्ञानं श्रीहरे तव दर्शनात् ॥ ३५॥ इति श्रीलक्ष्मीनारायणीयसंहितायां प्रथमे कृतयुगसन्ताने २०६
