id: devaihkritam02durgastotram-11
category: stotram
name:
  english: devaihkritam02durgastotram 11
  devanagari: देवैःकृतं०२दुर्गास्तोत्रम् ११
content:
  english: devaih kritam 2 durgastotram 11 deva ucuh | devya yaya tatamidam jagadatmashaktya nihsheshadevaganashaktisamuhamurtya
    | tamambikamakhiladevamarshipujyam bhaktya natah sma vidadhatu shubhani sa nah || 3|| yasyah prabhavamatulam
    bhagavanananto brahma harashca nahi vaktumalam balam ca | sa candikakhilajagatparipalanaya nashaya
    cashubhayasya matim karotu || 4|| ya shrih svayam sukritinam bhavaneshvalakshmih papatmanam kritadhiyam
    hridayeshu buddhih | shraddham satam kulajanaprabhavasya lajja tam tvam natah sma paripalaya devi
    vishvam || 5|| kim varnayama tava rupamacintyametat kim cativiryamasurakshayakari bhuri | kim cahaveshu
    caritani tavadbhutani sarveshu devyasuradevaganadikeshu || 6|| hetuh samastajagatam trigunapi doshaih
    na jnayase hariharadibhirapyapara | sarvashrayakhilamidam jagadamshabhutam avyakrita hi parama prakritistvamadya
    || 7|| yasyah samastasurata samudiranena triptim prayanti sakaleshu makheshu devi | svahasi vai pitriganasya
    ca triptihetuh uccaryase tvamata eva janaih svadha ca || 8|| ya muktiheturavicintyamahavrata tvam
    abhyasyase suniyatendriyatattvasaraih | moksharthibhirmunibhirastasamastadoshaih vidyasi sa bhagavati
    parama hi devi || 9|| shabdatmika suvimalargyajusham nidhanam udgitharamyapadapathavatam ca samnam
    | devi trayi bhagavati bhavabhavanaya varta ca sarvajagatam paramartihantri || 10|| medhasi devi viditakhilashastrasara
    durgasi durgabhavasagaranaurasanga | shrih kaitabharihridayaikakritadhivasa gauri tvameva shashimaulikritapratishtha
    || 11|| ishatsahasamamalam paripurnacandra
  devanagari: देवैः कृतं २ दुर्गास्तोत्रम् ११ देवा ऊचुः । देव्या यया ततमिदं जगदात्मशक्त्या निःशेषदेवगणशक्तिसमूहमूर्त्या
    । तामम्बिकामखिलदेवमर्षिपूज्यां भक्त्या नताः स्म विदधातु शुभानि सा नः ॥ ३॥ यस्याः प्रभावमतुलं भगवाननन्तो
    ब्रह्मा हरश्च नहि वक्तुमलं बलं च । सा चण्डिकाखिलजगत्परिपालनाय नाशाय चाशुभयस्य मतिं करोतु ॥ ४॥ या श्रीः
    स्वयं सुकृतिनां भवनेष्वलक्ष्मीः पापात्मनां कृतधियां हृदयेषु बुद्धिः । श्रद्धां सतां कुलजनप्रभवस्य
    लज्जा तां त्वां नताः स्म परिपालय देवि विश्वम् ॥ ५॥ किं वर्णयाम तव रूपमचिन्त्यमेतत् किं चातिवीर्यमसुरक्षयकारि
    भूरि । किं चाहवेषु चरितानि तवाद्भुतानि सर्वेषु देव्यसुरदेवगणादिकेषु ॥ ६॥ हेतुः समस्तजगतां त्रिगुणापि
    दोषैः न ज्ञायसे हरिहरादिभिरप्यपारा । सर्वाश्रयाखिलमिदं जगदंशभूतं अव्याकृता हि परमा प्रकृतिस्त्वमाद्या
    ॥ ७॥ यस्याः समस्तसुरता समुदीरणेन तृप्तिं प्रयान्ति सकलेषु मखेषु देवि । स्वाहासि वै पितृगणस्य च तृप्तिहेतुः
    उच्चार्यसे त्वमत एव जनैः स्वधा च ॥ ८॥ या मुक्तिहेतुरविचिन्त्यमहाव्रता त्वं अभ्यस्यसे सुनियतेन्द्रियतत्त्वसारैः
    । मोक्षार्थिभिर्मुनिभिरस्तसमस्तदोषैः विद्यासि सा भगवती परमा हि देवि ॥ ९॥ शब्दात्मिका सुविमलर्ग्यजुषां
    निधानं उद्गीथरम्यपदपाठवतां च साम्नाम् । देवी त्रयी भगवती भवभावनाय वार्ता च सर्वजगतां परमार्तिहन्त्री
    ॥ १०॥ मेधासि देवि विदिताखिलशास्त्रसारा दुर्गासि दुर्गभवसागरनौरसङ्गा । श्रीः कैटभारिहृदयैककृताधिवासा
    गौरी त्वमेव शशिमौलिकृतप्रतिष्ठा ॥ ११॥ ईषत्सहासममलं परिपूर्णचन्द्र
