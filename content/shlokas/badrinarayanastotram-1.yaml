id: badrinarayanastotram-1
category: stotram
name:
  english: badrinarayanastotram 1
  devanagari: बद्रीनारायणस्तोत्रम् १
content:
  english: na bhuyatsvashankavrito bhaktavrindah | tadartham ya aste kuberam grihitva trilokigurum naumi
    narayanam tam || 4|| nije'sminnamayeti sandarshanaya nalakshmya yuto yo'tra bhaktartihanta | svarupam
    dishantam param brahmashantam trilokigurum naumi narayanam tam || 5|| gurunarayanastotram yah pathedbhaktisamyutah
    | kamajitstotra muktashca narayanakripavashat || 6|| iti shrimat paramahamsaparivrajakacarya sadguru
    bhagavana shridharasvamimaharajaviracitam shribadrinarayanastotram sampurnam |
  devanagari: न भूयात्स्वशङ्कावृतो भक्तवृन्दः । तदार्थं य आस्ते कुबेरं गृहित्वा त्रिलोकीगुरुं नौमि नारायणं
    तम् ॥ ४॥ निजेऽस्मिन्नमायेति सन्दर्शनाय नलक्ष्म्या युतो योऽत्र भक्तार्तिहन्ता । स्वरूपं दिशन्तं परं
    ब्रह्मशान्तं त्रिलोकीगुरुं नौमि नारायणं तम् ॥ ५॥ गुरुनारायणस्तोत्रं यः पठेद्भक्तिसंयुतः । कामजित्स्तोत्र
    मुक्तश्च नारायणकृपावशात् ॥ ६॥ इति श्रीमत् परमहंसपरिव्राजकाचार्य सद्गुरू भगवान श्रीधरस्वामीमहाराजविरचितं
    श्रीबद्रीनारायणस्तोत्रं सम्पूर्णम् ।
meaning: {}
