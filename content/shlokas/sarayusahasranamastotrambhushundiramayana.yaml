id: sarayusahasranamastotrambhushundiramayana
category: sahasranama
name:
  english: sarayusahasranamastotrambhushundiramayana
  devanagari: सरयूसहस्रनामस्तोत्रम्भुशुण्डीरामायण
content:
  english: prabhavandhya purusharthaprada puta paktipavanakarini || 104|| phaladhya phaladatri ca phanindravaradayini
    | phalini phalapushpanka phalgunasphitakirtida || 105|| balipujya balihita baladevaprapujita | bala
    balaraviprakhya balaramagunaprada || 106|| balakini bahulaga bahula bahulabhada | bahukridamahormishca
    bahvibahulamasaga || 107|| bhavita bhabukakari bharmada bhargapujita | bhavahatrim bhavaprita bhavani
    bhuvanoddhata || 108|| bhutikartri bhutihatrim bhutini bhutasevita | bhudhara bhudharodbheda bhutanatharcitodaka
    || 109|| bhuritoya bhucari ca bhupatipriyakarini | manorama mahotsaha mahaniya mahatmika || 110||
    mahatmyavarddhini moha modini mohanashini | mugdha mugdhagatirmadhya madhyalokapriyavaha || 111||
    madhura madhuralapa madhurapativallabha | madhuryavaridhirmadhvi madhvikakusumotkata || 112|| madhukapushpamudita
    madirarasaghurnita | madini malatomalamallimalyaprapujita || 113|| mandarapushpapujya ca manda mandakinipriya
    | mandaracalasamsthana mandirantaramodini || 114|| yavasavalisambhinna yamunajalakelini | yamabhitiprashamini
    yaminiyaminam hita || 115|| yogamargaprada yogya yogacarya prapujita | yoktri yogabalaprita yogikarthaprakashino
    || 116|| yadayettadramanoramya yadovaravibhushita | yattatpadartharupa ca yaskacaryahitaprada || 117||
    yasya yashahprada yamya yajna yajnavivarddhini | rama rama rata ramya ramani ramaniyabhuh || 118||
    ramaniyakarashishca rashisharucidayini | ramapriya ramarata ramarama ramarucih || 119|| rucya ruciprada
    rociprada rocitavigraha | rupini rupanirata rupakarthasukhavaha || 120|| ranjini rajanirupa rajatacalasundari
    | rajogunavati raksha rakshodhni rajasi ratih || 121|| lavanyakrillavanaha lakshmirlakshyanubandhini
    | lakshmanasya pritikari lakshmana lakshmanashraya || 122|| lalama locanabhava lola lolormimalika
    | lilavati labhakari lobhaniyagunavaha || 123|| lajjavati lokavati lokalokaparasthita | lokaniya lokahita
    lokeshavaradayini || 124|| lalityakarini lila lopamudrasukhaprada | vanaja vanaramya ca vaniravanagamini
    || 125|| vanareshvarasuprita vagvati vindhyavasini | varanasipunyakari variga varivahini || 126||
    varivahaganashyama varanendrasukhaprada | vataramha vatagatirvamarajyasukhaprada || 127|| valita vanita
    vani vanillabhavavallabha | vahini vahanauddhatya vadavadavivadabhuh || 128|| shamini shamini shyama
    shyamayamaprabodhini | shamikamunisamsevya shamivrikshodbhava shama || 129|| shanaishcara shanihara
    shanigrahabhayapaha | shamanartihara shampa shatahradahavilasini || 130|| sheshasheshagatih shoshya
    sheshaputri shashiprabha | shmashanacarini shunya shunyakashanivasini || 131|| sharartiha sharirartiharini
    sharabheshvari | shalyapaha shalabhaha shaladanavanashini || 132|| shanmukhi shanmukhihata shadakshina
    shadangabhuh | shashthishanathasamsevya shashtipujanakarini || 133|| shadvargajayini shatka shad vashatkaprapujita
    | sita sita suta suta satam pujya satam gatih || 134|| sadahasyakriya satya sati satyarthadayini |
    saranih sarayuh sira salilaughapravahini || 135|| saddharmacarino surmih supasya supapadita | sulabha
    sukhada supta sangramabhayaharini || 136|| suttara sutara soma somanathaprapujita | samidheni samitprita
    samidha ca samedhini || 137|| sama samana samaga sammatta sumata subha | sumarcya sushumadhara sarojabalipujita
    || 138|| haripriya himavaha himani himatoyaga | haridashtakasankirtya haridashvaprapujita || 139||
    hambharavekasuprita hindolakelikarini | himsadoshaprashamini himsramuktipradayini || 140|| harini
    harasamstutya hakaraksharasamstuta | hatyahara hatharipurharacapaprabhanjini || 141|| kshemya kshemakari
    kshema kshudhakshobhavinashini | kshunna kshoda kshiranidhih kshirasagaravasini || 142|| kshiva kshutikshuraprakhya
    kshipra kshiprarthakarino | kshonih kshonihita kshama kshapakaranibhodaka || 143|| kshara ksharambunidhiga
    kshapasancarakarini | amala amlasalila adahshabdartharupini || 144|| akarakshararupa ca hyakarakshararupini
    | ardrambara amajala ashadhi ashvinatmika || 145|| agrahayanarupa ca aturatvavinashini | asuri asurisuta
    ashutushtha ileshvari || 146|| indriya indrasampujya ishusamharakarini | itvari inasamsevya ira inavarendira
    || 147|| ishvaro itihantri ca irini isvarupini | udakaughapravahini uttankamunipujita || 148|| uttaradrisuta
    unna uttirna uttaraprada | uttaptakancananibha uhini uhakarini || 149|| ushara usharakshetra utirupo
    ribhustuta | ritapravartini riksha rikshendrakulapujita || 150|| rikarakshararupa ca rikari risvarupini
    | litaka litakacarya likaraksharavasini || 151|| esha eshitavedartha evamevartharupada | evakararthagamya
    ca etacchabdartharupini || 152|| eta aita aikritishca aindri aimkararupini | ota okararupa ca aushadhishaprapujita
    || 153|| aunnatyakarini amba ambika ankavarjita | antakapreyasi ankya antaka atavarjita || 154|| ahkaramudita
    caiva sarvavarnasvarupini | sarvashastrartharupa ca sarvakalyanakarini || 155|| idam shrisarayudevya
    namasahasramuttamam | maya nigaditam shrutva sarvapapairvimucyate || 156|| bahuni tava namani anantanyeva
    sarvashah | tva ganga yamuna caiva goda caiva sarasvati || 157|| narmada caiva kaveri bhima krishna
    ca parvati | sindhuh sindhusuta caiva sarvadevasvarupini || 158|| yastvam smarati vai nityam manujo
    ramasevakah | sarvavighnahara tasya bhavishyasi na samshayah || 159|| pratarutthaya ca naro yau'vagaheta
    vai tvayi | tasya sarvaghahantro tvam ramabhaktim pravartayeh || 160|| darshanatsparshanaccaiva smaranannamakirtanat
    | ramapremaprada nityam tvam sarvashubhakarini || 161|| iti shrimadadiramayane brahmabhushundasamvade
    pashcimakhande sitajanmotsave pramodavanavarnane sarayunamasahasrakam nama shattrimsho'dhyayah ||
    36||
  devanagari: प्रभावन्ध्या पुरुषार्थप्रदा पूता पक्तिपावनकारिणी ॥ १०४॥ फलाढ्या फलदात्री च फणीन्द्रवरदायिनी
    । फालिनी फलपुष्पाङ्का फाल्गुनस्फीतकीर्तिदा ॥ १०५॥ बलिपूज्या बलिहिता बलदेवप्रपूजिता । बाला बालरविप्रख्या
    बालरामगुणप्रदा ॥ १०६॥ बलाकिनी बहुलगा बहुला बहुलाभदा । बाहुक्रीडामहोर्मिश्च बह्वीबाहुलमासगा ॥ १०७॥
    भाविता भाबुककरी भर्मदा भर्गपूजिता । भवहत्रीं भवप्रीता भवानी भुवनोद्धता ॥ १०८॥ भूतिकर्त्री भूतिहत्रीं
    भूतिनी भूतसेविता । भूधरा भूधरोद्भेदा भूतनाथार्चितोदका ॥ १०९॥ भूरितोया भूचरी च भूपतिप्रियकारिणी । मनोरमा
    महोत्साहा महनीया महात्मिका ॥ ११०॥ माहात्म्यवर्द्धिनी मोहा मोदिनी मोहनाशिनी । मुग्धा मुग्धगतिर्मध्या
    मध्यलोकप्रियावहा ॥ १११॥ मधुरा मधुरालापा मधुरापतिवल्लभा । माधुर्यवारिधिर्माध्वी माध्वीककुसुमोत्कटा
    ॥ ११२॥ मधूकपुष्पमुदिता मदिरारसघूर्णिता । मादिनी मालतोमालामल्लीमाल्यप्रपूजिता ॥ ११३॥ मन्दारपुष्पपूज्या
    च मन्दा मन्दाकिनीप्रिया । मन्दराचलसंस्थाना मन्दिरान्तरमोदिनी ॥ ११४॥ यवसावलिसम्भिन्ना यमुनाजलकेलिनी
    । यमभीतिप्रशमिनी यमिनीयमिनां हिता ॥ ११५॥ योगमार्गप्रदा योग्या योगाचार्य प्रपूजिता । योक्त्री योगबलप्रीता
    योगिकार्थप्रकाशिनो ॥ ११६॥ यादयेत्तद्रमनोरम्या यादोवरविभूषिता । यत्तत्पदार्थरूपा च यास्काचार्यहितप्रदा
    ॥ ११७॥ यस्या यशःप्रदा यम्या यज्ञा यज्ञविवर्द्धिनी । रमा रामा रता रम्या रमणी रमणीयभूः ॥ ११८॥ रामणीयकराशिश्च
    राशीशरुचिदायिनी । रामप्रिया रामरता रामरामा रमारुचिः ॥ ११९॥ रुच्या रुचिप्रदा रोचिप्रदा रोचितविग्रहा
    । रूपिणी रूपनिरता रूपकार्थसुखावहा ॥ १२०॥ रञ्जिनी रजनीरूपा रजताचलसुन्दरी । रजोगुणवती रक्षा रक्षोध्नी
    राजसी रतिः ॥ १२१॥ लावण्यकृल्लवणहा लक्ष्मीर्लक्ष्यानुबन्धिनी । लक्ष्मणस्य प्रीतिकरी लक्ष्मणा लक्ष्मणाश्रया
    ॥ १२२॥ ललामा लोचनभवा लोला लोलोर्मिमालिका । लीलावती लाभकरी लोभनीयगुणावहा ॥ १२३॥ लज्जावती लोकवती लोकालोकपरस्थिता
    । लोकनीया लोकहिता लोकेशवरदायिनी ॥ १२४॥ लालित्यकारिणी लीला लोपामुद्रासुखप्रदा । वनजा वनरम्या च वानीरवनगामिनी
    ॥ १२५॥ वानरेश्वरसुप्रीता वाग्वती विन्ध्यवासिनी । वाराणसीपुण्यकरी वारिगा वारिवहिनी ॥ १२६॥ वारिवाहगणश्यामा
    वारणेन्द्रसुखप्रदा । वातरंहा वातगतिर्वामाराज्यसुखप्रदा ॥ १२७॥ वलिता वनिता वाणी वाणील्लभववल्लभा । वाहिनी
    वहनौद्धत्या वदावदविवादभूः ॥ १२८॥ शमिनी शामिनी श्यामा श्यामायामप्रबोधिनी । शमीकमुनिसंसेव्या शमीवृक्षोद्भवा
    शमा ॥ १२९॥ शनैश्चरा शनिहरा शनिग्रहभयापहा । शमनार्तिहरा शम्पा शतह्रदहविलासिनी ॥ १३०॥ शेषाशेषगतिः शोष्या
    शेषपुत्री शशिप्रभा । श्मशानचारिणी शून्या शून्याकाशनिवासिनी ॥ १३१॥ शरार्तिहा शरीरार्तिहारिणी शरभेश्वरी
    । शल्यापहा शलभहा शलदानवनाशिनी ॥ १३२॥ षण्मुखी षण्मुखीहता षडक्षीणा षडङ्गभूः । षष्ठीशनाथसंसेव्या षष्टीपूजनकारिणी
    ॥ १३३॥ षड्वर्गजायिनी षट्का षड् वषट्कप्रपूजिता । सिता सीता सुता सूता सतां पूज्या सतां गतिः ॥ १३४॥ सदाहास्यक्रिया
    सत्या सती सत्यार्थदायिनी । सरणिः सरयूः सीरा सलिलौघप्रवाहिनी ॥ १३५॥ सद्धर्मचारिणो सूर्मिः सूपास्या
    सूपपादिता । सुलभा सुखदा सुप्ता सङ्ग्रामभयहारिणी ॥ १३६॥ सूत्तरा सुतरा सोमा सोमनाथप्रपूजिता । सामिधेनी
    समित्प्रीता समिधा च समेधिनी ॥ १३७॥ समा समाना समगा सम्मत्ता सुमता सुभा । सुमार्च्या सुषुमाधारा सरोजाबलिपूजिता
    ॥ १३८॥ हरिप्रिया हिमवहा हिमानी हिमतोयगा । हरिदष्टकसङ्कीर्त्या हरिदश्वप्रपूजिता ॥ १३९॥ हम्भारवेकसुप्रीता
    हिन्दोलाकेलिकारिणी । हिंसादोषप्रशमिनी हिंस्रमुक्तिप्रदायिनी ॥ १४०॥ हारिणी हरसंस्तुत्या हकाराक्षरसंस्तुता
    । हत्याहरा हठरिपुर्हरचापप्रभञ्जिनी ॥ १४१॥ क्षेम्या क्षेमकरी क्षेमा क्षुधाक्षोभविनाशिनी । क्षुण्णा
    क्षोदा क्षीरनिधिः क्षीरसागरवासिनी ॥ १४२॥ क्षीवा क्षुतिक्षुरप्रख्या क्षिप्रा क्षिप्रार्थकारिणो । क्षोणिः
    क्षोणिहिता क्षामा क्षपाकरनिभोदका ॥ १४३॥ क्षारा क्षाराम्बुनिधिगा क्षपासञ्चारकारिणी । अमला अम्लसलिला
    अदःशब्दार्थरूपिणी ॥ १४४॥ अकाराक्षररूपा च ह्याकाराक्षररूपिणी । आर्द्राम्बरा आमजला आषाढी आश्विनात्मिका
    ॥ १४५॥ आग्रहायणरूपा च आतुरत्वविनाशिनी । आसुरी आसुरिसुता आशुतुष्ठा इलेश्वरी ॥ १४६॥ इन्द्रिया इन्द्रसम्पूज्या
    इषुसंहारकारिणी । इत्वरी इनसंसेव्या इरा इनवरेन्दिरा ॥ १४७॥ ईश्वरो ईतिहन्त्री च ईरिणी ईस्वरूपिणी । उदकौघप्रवहिणी
    उत्तङ्कमुनिपूजिता ॥ १४८॥ उत्तराद्रिसुता उन्ना उत्तीर्णा उत्तरप्रदा । उत्तप्तकाञ्चननिभा ऊहिनी ऊहकारिणी
    ॥ १४९॥ ऊषरा ऊषरक्षेत्रा ऊतिरूपो ऋभूस्तुता । ऋतप्रवर्तिनी ऋक्षा ऋक्षेन्द्रकुलपूजिता ॥ १५०॥ ॠकाराक्षररूपा
    च ॠकारी ॠस्वरूपिणी । ऌतका ऌतकाचार्या ऌकाराक्षरवासिनी ॥ १५१॥ एषा एषितवेदार्था एवमेवार्थरूपदा । एवकारार्थगम्या
    च एतच्छब्दार्थरूपिणी ॥ १५२॥ एता ऐता ऐकृतिश्च ऐन्द्री ऐंकाररूपिणी । ओता ओकाररूपा च औषधीशप्रपूजिता ॥
    १५३॥ औन्नत्यकारिणी अम्बा अम्बिका अङ्कवर्जिता । अन्तकप्रेयसी अङ्क्या अन्तका अतवार्जिता ॥ १५४॥ अःकारमुदिता
    चैव सर्ववर्णस्वरूपिणी । सर्वशास्त्रार्थरूपा च सर्वकल्याणकारिणी ॥ १५५॥ इदं श्रीसरयूदेव्या नामसाहस्रमुत्तमम्
    । मया निगदितं श्रुत्वा सर्वपापैर्विमुच्यते ॥ १५६॥ बहूनि तव नामानि अनन्तान्येव सर्वशः । त्व गङ्गा यमुना
    चैव गोदा चैव सरस्वती ॥ १५७॥ नर्मदा चैव कावेरी भीमा कृष्णा च पार्वती । सिन्धुः सिन्धुसुता चैव सर्वदेवस्वरूपिणी
    ॥ १५८॥ यस्त्वां स्मरति वै नित्यं मनुजो रामसेवकः । सर्वविघ्नहरा तस्य भविष्यसि न संशयः ॥ १५९॥ प्रातरुत्थाय
    च नरो यौऽवगाहेत वै त्वयि । तस्य सर्वाघहन्त्रो त्वं रामभक्तिं प्रवर्तयेः ॥ १६०॥ दर्शनात्स्पर्शनाच्चैव
    स्मरणान्नामकीर्तनात् । रामप्रेमप्रदा नित्यं त्वं सर्वशुभकारिणी ॥ १६१॥ इति श्रीमदादिरामायणे ब्रह्मभुशुण्डसंवादे
    पश्चिमखण्डे सीताजन्मोत्सवे प्रमोदवनवर्णने सरयूनामसहस्रकं नाम षट्त्रिंशोऽध्यायः ॥ ३६॥
