id: ramahriday
category: hridaya
name:
  english: ramahriday
  devanagari: रामह्रिदय्
content:
  english: rinu yatvam pravakshyami hyatmanatmaparatmanam || 1|| akashasya yatha bhedastrividho drishyate
    mahan | jalashaye mahakashastadavacchinna eva hi | pratibimbakhyamaparam drishyate trividham nabhah
    || 2|| buddhyavacchinnacaitanyamekam purnamathaparam | abhasastvaparam bimbabhutamevam tridha citih
    || 3|| sabhasabuddheh kartritvamavicchinne'vikarini | sakshinyaropyate bhrantya jivatvam ca tatha'budhaih
    || 4|| abhasastu mrishabuddhiravidyakaryamucyate | avicchinnam tu tadbrahma vicchedastu vikalpitah
    || 5|| avicchinnasya purnena ekatvam pratipadyate | tattvamasyadivakyaishca sabhasasyahamastatha ||
    6|| aikyajnanam yadotpannam mahavakyena catmanoh | tada'vidya svakaryaishca nashyatyeva na samshayah
    || 7|| etadvijnaya madbhakto madbhavayopapadyate madbhaktivimukhanam hi shastragarteshu muhyatam |
    na jnanam na ca mokshah syattesham janmashatairapi || 8|| idam rahasyam hridayam mamatmano mayaiva
    sakshatkathitam tavanagha | madbhaktihinaya shathaya na tvaya datavyamaindradapi rajyato'dhikam ||
    9|| || shrimadadhyatmaramayane balakande shriramahridayam sampurnam ||
  devanagari: ृणु यत्वं प्रवक्ष्यामि ह्यात्मानात्मपरात्मनाम् ॥ १॥ आकाशस्य यथा भेदस्त्रिविधो दृश्यते महान्
    । जलाशये महाकाशस्तदवच्छिन्न एव हि । प्रतिबिम्बाख्यमपरं दृश्यते त्रिविधं नभः ॥ २॥ बुद्ध्यवच्छिन्नचैतन्यमेकं
    पूर्णमथापरम् । आभासस्त्वपरं बिम्बभूतमेवं त्रिधा चितिः ॥ ३॥ साभासबुद्धेः कर्तृत्वमविच्छिन्नेऽविकारिणि
    । साक्षिण्यारोप्यते भ्रान्त्या जीवत्वं च तथाऽबुधैः ॥ ४॥ आभासस्तु मृषाबुद्धिरविद्याकार्यमुच्यते । अविच्छिन्नं
    तु तद्ब्रह्म विच्छेदस्तु विकल्पितः ॥ ५॥ अविच्छिन्नस्य पूर्णेन एकत्वं प्रतिपद्यते । तत्त्वमस्यादिवाक्यैश्च
    साभासस्याहमस्तथा ॥ ६॥ ऐक्यज्ञानं यदोत्पन्नं महावाक्येन चात्मनोः । तदाऽविद्या स्वकार्यैश्च नश्यत्येव
    न संशयः ॥ ७॥ एतद्विज्ञाय मद्भक्तो मद्भावायोपपद्यते मद्भक्तिविमुखानां हि शास्त्रगर्तेषु मुह्यताम् ।
    न ज्ञानं न च मोक्षः स्यात्तेषां जन्मशतैरपि ॥ ८॥ इदं रहस्यं हृदयं ममात्मनो मयैव साक्षात्कथितं तवानघ
    । मद्भक्तिहीनाय शठाय न त्वया दातव्यमैन्द्रादपि राज्यतोऽधिकम् ॥ ९॥ ॥ श्रीमदध्यात्मरामायणे बालकाण्डे
    श्रीरामहृदयं सम्पूर्णम् ॥
