id: shrutigita
category: stotram
name:
  english: shrutigita
  devanagari: श्रुतिगीता
content:
  english: jaya jaya jahyajamajita doshagribhitagunam tvamasi yadatmana samavaruddhasamastabhagah| agajagadokasamakhilashaktyavabodhaka
    te kvacidajayatmana ca carato'nucarennigamah||14|| brihadupalabdhametadavayantyavasheshataya yata
    udayastamayau vikritermridi va'vikritat| ata rishayo dadhustvayi manovacanacaritam kathamayatha bhavanti
    bhuvi dattapadani nrinam||15|| iti tava surayastryadhipate'khilalokamalakshanapanakathamritabdhimavagahya
    tapamsi jahuh| kimuta punah svadhamavidhutashayakalagunah parama bhajanti ye padamajasrasukhanubhavam||16||
    dritaya iva shvasantyasubhrito yadi te'nuvidha mahadamayo'ndamasrijanyadanugrahatah| purushavidho'nvayo'tra
    caramo'nnamayadishu yah sadasatah param tvamatha yadeshvavasheshamritam||17|| udaramupasate ya rishivartmasu
    kurpadrishah parisarapaddhatim hridayamarunayo daharam| tata udagadananta tava dhama shirah paramam
    punariha yatsametya na patanti kritantamukhe||18|| svakritavicitrayonishu vishanniva hetutaya taratamatashcakassyanalavatsvakritanukritih|
    atha vitathasvamushvavitatham tava dhama samam virajadhiyo'nvayantyabhivipanyava ekarasam||19|| svakritapureshvamishvabahirantarasamvaranam
    tava purusham vadantyakhilashaktidhritom'shakritam| iti nrigatim vivicya kavayo nigamapavanam bhavata
    upasate'nghrimabhavam bhuvi vishvasitah||20|| duravagamatmatattvanigamaya tavattatanoshcaritamahamritabdhiparivartaparishramanah|
    na parilashanti kecidapavargamapishvara te caranasarojahamsakulasangavisrishtagrihah||21|| tvadanupatham
    kulayamidamatmasuhritpriyavaccarati tathonmukhe tvayi hite priya atmani ca| na bata ramantyaho asadupasanayatmahano
    yadanushaya bhramantyurubhaye kusharirabhritah||22|| nibhritamarunmanokshadridhayogayujo hridi yanmunaya
    upasate tadarayo'pi yayuh smaranat| striya uragendrabhogabhujadandavishaktadhiyo vayamapi te samam
    samadridho'nghrisarojasudhah||23|| ka iha nu veda batavarajanmalayo'grasaram yata udagadrishiryamanu
    devagana ubhaye| tarhi na sanna casadubhayam na ca kalajavah kimapi na tatra shastramavakrishya shayita
    yada||24|| janimasatah sato mritimutatmani ye veda ca bhidam vipanamritam smarantyupadishanti ta arupataih|
    trigunamayah pumaniti bhida yadabodhakrita tvayi na tatah paratra sa bhavedavabodharase||25|| sadiva
    manastrivrittvayi vibhatyasadamanujatsadabhimrishantyasheshamidamatmatyatmavidah| na hi vikritim tyajanti
    kanakasya tadatmataya svakritamanupravishtamidamatmataya'vasitam||26|| tava pari ye carantyakhilasattvaniketataya
    ta uta padakramantyaviganayya shiro nirriteh| parivayase pashuniva gira vibudhanapi tamstvayi kritasauhridah
    khalu punanti na ye vimukhah||27|| tvamakaranah svaradakhilakarakashaktidharastava balimudvahanti
    samadantyajaya'nimishah| varshabhujo'khilakshitipateriva vishvasrijo vidadhati yatra ye tvadadhikrita
    bhavatashcakitah||28|| sthiracarajatayah syurajayothanimittayujo vihara udikshaya yadi parasya vimukta
    tatah| na hi paramasya kashcidaparo na parashca bhavedviyata ivapadasya tava shunyatulam dadhatah||29||
    aparamita dhruvastanubhrito yadi sarvagatastarhi na shasyateti niyamo dhruva netaratha| ajani ca yanmayam
    tadvimucya niyantri bhavetsamamanujanatam yadamatam matadrishtataya||30|| na ghatata udbhavah prakritipurushayorjayorubhayayuja
    bhavantyasubhrito jalabudbudavat| tvayi ta ime tato vividhanamagunaih parame sarita ivarnave madhuni
    lilyurushesharasah||31|| nrishu tava mayaya bhramamamishvavagatya bhrisham tvayi sudhiyo'bhave dadhati
    bhavamanuprabhavam| kathamanuvartatam bhavabhayam tava yadbhrukutih srijati muhustrinemirabhavaccharaneshu
    bhayam||32|| vijitahrishikavayubhiradantamanasturagam ya iha yatanti yantumatilolamupayakhidah| vyasanashatanvitah
    samavahaya guroshcaranam vanija ivaja santyakritakarnadhara jaladhau||33|| svajanasutatmadaradhanadhamadharasurathaistvayi
    sati kim nrinam shrayata atmani sarvarase| iti sadajanatam mithunato rataye caratam sukhayati ko nviha
    svavihate svanirastabhage||34|| bhuvi purupunyatirthasadananyrishayo vimadasta uta bhavatpadambujahrido'ghabhidanghrijalah|
    dadhati sukrinmanastvayi ya atmani nityasukhe na punarupasate purushasaraharavasathan||35|| sata idamutthitam
    saditi cennanu tarkahatam vyabhicarati kva ca kva ca mrisha na tathobhayayuk| vyavahritaye vikalpa
    ishito'ndhaparamparaya bhramayati bharati ta uruvrittibhirukthajadan||36|| na yadidamagra asa na bhavishyadato
    nidhanadanumitamantara tvayi vibhati mrishaikarase| ata upamiyate dravinajativikalpapathairvitathamanovilasamritamityavayantyabudhah||37||
    sa yadajaya tvajamanushayita gunamshca jushanbhajati svarupatam tadanu mrityumapetabhagah| tvamuta
    jahasi tamahiriva tvacamattabhago mahasi mahiyase'shtagunite'parimeyabhagah||38|| yadi na samuddharanti
    yatayo hridi kamajata duradhigamo'satam hridi gato'smritakanthamanih| asutripayoginamubhayato'pyasukham
    bhagavannanapagatantakadanadhirudhapadadbhavatah||39|| tvadavagami na vetti bhavadutthashubhayorgunavigunanvayamstarhi
    dehabhritam ca girah| anuyugamanvaham saguna gitaparamparaya shravanabhrito yatastvamapavargagatirmanujaih||40||
    dyupataya eva te na yayurantamanantataya tvamapi yadanta'ndanicaya nanu savaranah| kha iva rajamsi
    vanti vayasa saha yacchrutayastvayi hi phalantyatannirasanena bhavanidhanah||41|| agreji mem anuvada
  devanagari: जय जय जह्यजामजित दोषगृभीतगुणां त्वमसि यदात्मना समवरुद्धसमस्तभगः। अगजगदोकसामखिलशक्त्यवबोधक
    ते क्वचिदजयात्मना च चरतोऽनुचरेन्निगमः॥१४॥ बृहदुपलब्धमेतदवयन्त्यवशेषतया यत उदयास्तमयौ विकृतेर्मृदि
    वाऽविकृतात्। अत ऋषयो दधुस्त्वयि मनोवचनाचरितं कथमयथा भवन्ति भुवि दत्तपदानि नृणाम्॥१५॥ इति तव सूरयस्त्र्यधिपतेऽखिललोकमलक्षणपणकथामृताब्धिमवगाह्य
    तपांसि जहुः। किमुत पुनः स्वधामविधुताशयकालगुणाः परम भजन्ति ये पदमजस्रसुखानुभवम्॥१६॥ दृतय इव श्वसन्त्यसुभृतो
    यदि तेऽनुविधा महदमायोऽण्डमसृजन्यदनुग्रहतः। पुरुषविधोऽन्वयोऽत्र चरमोऽन्नमयादिषु यः सदसतः परं त्वमथ
    यदेष्ववशेषमृतम्॥१७॥ उदरमुपासते य ऋषिवर्त्मसु कूर्पदृशः परिसरपद्धतिं हृदयमारुणयो दहरम्। तत उदगादनन्त
    तव धाम शिरः परमं पुनरिह यत्समेत्य न पतन्ति कृतान्तमुखे॥१८॥ स्वकृतविचित्रयोनिषु विशन्निव हेतुतया तरतमतश्चकास्स्यनलवत्स्वकृतानुकृतिः।
    अथ वितथास्वमूष्ववितथं तव धाम समं विरजधियोऽन्वयन्त्यभिविपण्यव एकरसम्॥१९॥ स्वकृतपुरेष्वमिष्वबहिरन्तरसंवरणं
    तव पुरुषं वदन्त्यखिलशक्तिधृतोंऽशकृतम्। इति नृगतिं विविच्य कवयो निगमापवनं भवत उपासतेऽङ्घ्रिमभवं भुवि
    विश्वसिताः॥२०॥ दुरवगमात्मतत्त्वनिगमाय तवात्ततनोश्चरितमहामृताब्धिपरिवर्तपरिश्रमणाः। न परिलषन्ति केचिदपवर्गमपीश्वर
    ते चरणसरोजहंसकुलसङ्गविसृष्टगृहाः॥२१॥ त्वदनुपथं कुलायमिदमात्मसुहृत्प्रियवच्चरति तथोन्मुखे त्वयि हिते
    प्रिय आत्मनि च। न बत रमन्त्यहो असदुपासनयात्महनो यदनुशया भ्रमन्त्युरुभये कुशरीरभृतः॥२२॥ निभृतमरुन्मनोक्षदृढयोगयुजो
    हृदि यन्मुनय उपासते तदरयोऽपि ययुः स्मरणात्। स्त्रिय उरगेन्द्रभोगभुजदण्डविषक्तधियो वयमपि ते समां समदृधोऽङ्घ्रिसरोजसुधाः॥२३॥
    क इह नु वेद बतवरजन्मलयोऽग्रसरं यत उदगादृषिर्यमनु देवगणा उभये। तर्हि न सन्न चासदुभयं न च कालजवः किमपि
    न तत्र शास्त्रमवकृष्य शयीत यदा॥२४॥ जनिमसतः सतो मृतिमुतात्मनि ये वेद च भिदां विपणमृतं स्मरन्त्युपदिशन्ति
    त आरुपतैः। त्रिगुणमयः पुमानिति भिदा यदबोधकृता त्वयि न ततः परत्र स भवेदवबोधरसे॥२५॥ सदिव मनस्त्रिवृत्त्वयि
    विभात्यसदामनुजात्सदभिमृशन्त्यशेषमिदमात्मत्यात्मविदः। न हि विकृतिं त्यजन्ति कनकस्य तदात्मतया स्वकृतमनुप्रविष्टमिदमात्मतयाऽवसितम्॥२६॥
    तव परि ये चरन्त्यखिलसत्त्वनिकेततया त उत पदाक्रमन्त्यविगणय्य शिरो निरृतेः। परिवयसे पशूनिव गिरा विबुधानपि
    तांस्त्वयि कृतसौहृदाः खलु पुनन्ति न ये विमुखाः॥२७॥ त्वमकरणः स्वराडखिलकारकशक्तिधरस्तव बलिमुद्वहन्ति
    समदन्त्यजयाऽनिमिषाः। वर्षभुजोऽखिलक्षितिपतेरिव विश्वसृजो विदधति यत्र ये त्वदधिकृता भवतश्चकिताः॥२८॥
    स्थिरचरजातयः स्युरजयोथनिमित्तयुजो विहर उदीक्षया यदि परस्य विमुक्त ततः। न हि परमस्य कश्चिदपरो न परश्च
    भवेद्वियत इवापदस्य तव शून्यतुलां दधतः॥२९॥ अपरमिता ध्रुवास्तनुभृतो यदि सर्वगतास्तर्हि न शास्यतेति नियमो
    ध्रुव नेतरथा। अजनि च यन्मयं तद्विमुच्य नियन्तृ भवेत्सममनुजानतां यदमतं मतदृष्टतया॥३०॥ न घटत उद्भवः
    प्रकृतिपूरुषयोर्जयोरुभययुजा भवन्त्यसुभृतो जलबुद्बुदवत्। त्वयि त इमे ततो विविधनामगुणैः परमे सरित इवार्णवे
    मधुनि लिल्युरुशेषरसाः॥३१॥ नृषु तव मायया भ्रमममीष्ववगत्य भृशं त्वयि सुधियोऽभवे दधति भावमनुप्रभवम्।
    कथमनुवर्ततां भवभयं तव यद्भ्रुकुटिः सृजति मुहुस्त्रिणेमिरभवच्छरणेषु भयम्॥३२॥ विजितहृषीकवायुभिरदान्तमनस्तुरगं
    य इह यतन्ति यन्तुमतिलोलमुपायखिदः। व्यसनशतान्विताः समवहाय गुरोश्चरणं वणिज इवाज सन्त्यकृतकर्णधरा जलधौ॥३३॥
    स्वजनसुतात्मदारधनधामधरासुरथैस्त्वयि सति किं नृणां श्रयत आत्मनि सर्वरसे। इति सदजानतां मिथुनतो रतये
    चरतां सुखयति को न्विह स्वविहते स्वनिरस्तभगे॥३४॥ भुवि पुरुपुण्यतीर्थसदनान्यृषयो विमदास्त उत भवत्पदाम्बुजहृदोऽघभिदङ्घ्रिजलाः।
    दधति सुकृन्मनस्त्वयि य आत्मनि नित्यसुखे न पुनरुपासते पुरुषसारहरावसथान्॥३५॥ सत इदमुत्थितं सदिति चेन्ननु
    तर्कहतं व्यभिचरति क्व च क्व च मृषा न तथोभययुक्। व्यवहृतये विकल्प इषितोऽन्धपरम्परया भ्रमयति भारति त
    उरुवृत्तिभिरुक्थजडान्॥३६॥ न यदिदमग्र आस न भविष्यदतो निधनादनुमितमन्तरा त्वयि विभाति मृषैकरसे। अत उपमीयते
    द्रविणजातिविकल्पपथैर्वितथमनोविलासमृतमित्यवयन्त्यबुधाः॥३७॥ स यदजया त्वजामनुशयित गुणांश्च जुषन्भजति
    स्वरूपतां तदनु मृत्युमपेतभगः। त्वमुत जहासि तामहिरिव त्वचमात्तभगो महसि महीयसेऽष्टगुणितेऽपरिमेयभगः॥३८॥
    यदि न समुद्धरन्ति यतयो हृदि कामजटा दुरधिगमोऽसतां हृदि गतोऽस्मृतकण्ठमणिः। असुतृपयोगिनामुभयतोऽप्यसुखं
    भगवन्ननपगतान्तकादनधिरूढपदाद्भवतः॥३९॥ त्वदवगमी न वेत्ति भवदुत्थशुभयोर्गुणविगुणान्वयांस्तर्हि देहभृतां
    च गिरः। अनुयुगमन्वहं सगुण गीतपरम्परया श्रवणभृतो यतस्त्वमपवर्गगतिर्मनुजैः॥४०॥ द्युपतय एव ते न ययुरन्तमनन्ततया
    त्वमपि यदन्ताऽण्डनिचया ननु सावरणाः। ख इव रजांसि वान्ति वयसा सह यच्छ्रुतयस्त्वयि हि फलन्त्यतान्निरसनेन
    भवनिधनाः॥४१॥ अग्रेजी में अनुवाद
