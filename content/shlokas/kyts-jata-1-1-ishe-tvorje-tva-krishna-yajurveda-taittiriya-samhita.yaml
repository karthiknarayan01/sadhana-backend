id: kyts-jata-1-1-ishe-tvorje-tva-krishna-yajurveda-taittiriya-samhita
category: stotram
name:
  english: KYTS Jata 1.1 Ishe Tvorje Tva - Krishna Yajurveda Taittiriya Samhita
content:
  english: tvorja urje tva tvorja urje tva tva vayavo vayavastva tva vayavah | vayavah stha stha vayavo
    vayavah stha | sthopayava upayavah stha sthopayavah | upayavah stha sthopayava upayavah stha | devo
    vo vo devo devo vah | ssavita savita vo va savita pra pra savita savita pra | prarpayatvarpayatu pra
    prarpayatu | arpayatu shreshthatamaya shreshthatamayarpayatvarpayatu shreshthatamaya | shreshthatamaya
    karmane karmane shreshthatamaya shreshthatamaya karmane | shreshthatamayeti shreshtha karmana a karmane
    karmana a | mpyayaddhva ma pyayaddhvam | pyayaddhva maghniya aghniyah pyayaddhva mpyayaddhva maghniyah
    | aghniya devabhaga ndevabhaga maghniya aghniya devabhagam | devabhaga murjasvati rurjasvati ndevabhaga
    murjasvatih | urjasvatih payasvatih payasvati rurjasvati rurjasvatih payasvatih | payasvatih prajavatih
    prajavatih payasvatih payasvatih prajavatih | prajavatiranamiva anamivah prajavatih prajavatiranamivah
    | prajavatiriti praja anamiva ayakshma ayakshma anamiva anamiva ayakshmah | ayakshma ma ma 'yakshma
    ayakshma ma | ma vo vo ma ma vah | stena ishateshata stena ishata ma meshateshata ma | ma 'ghashagmso
    'ghashagmso ma ma 'ghashagmsah | aghashagmso rudrasya rudrasya ghashagmso 'ghashagmso rudrasya | heti
    rudrasya rudrasya hetih | hetih pari pari hetir pari vo vah pari pari vah | vo vrinaktu vrinaktu vo
    vo vrinaktu | vrinaktu dhruva dhruva vrinaktu vrinaktu dhruvah | ndhruva dhruva asminn | ngopatau
    gopata vasmi gopatau syata syata gopatau gopatau syata | ssyata syata bahvih | bahviryajamanasya yajamanasya
    bahvi rbahviryajamanasya | yajamanasya yajamanasya pashun | dyajnasya yajnasya ghoshat | mpratyushta
    masyasi pratyushtam | pratyushtagm raksho rakshah pratyushta mpratyushtagm rakshah | pratyushtamiti
    prati rakshah pratyushtah pratyushta raksho rakshah pratyushtah | pratyushta aratayo 'ratayah pratyushtah
    pratyushta aratayah | pratyushta iti prati aratayah pra praratayo 'ratayah pra | iya magadagadiya
    miya magat | ddhishana dhishana 'gadaga rdhishana dhishana barhih | barhiracchaccha barhi accha manuna
    manuna 'cchaccha manuna | manuna krita krita manuna manuna krita | svadhaya krita krita svadhaya svadhaya
    vitashta vitashta svadhaya vitashta te te vitashta vitashta te | a vahanti vahantya vahanti | vahanti
    kavayah kavayo vahanti vahanti kavayah | tkavayah kavayah purasta ddevebhyo devebhyah purasta ndevebhyo
    devebhyo jushta jushta mihe ha jushta rbarhirihe ha barhih | barhirasada asade barhi ndevana masada
    asade devana parishuta masyasi parishuta va~rshavriddha masyasi varshavriddham | varshavriddha masyasi
    varshavriddham varshavriddhamiti varsha kparva parva tirya parva te te parva parva te | te raddhyasagm
    raddhyasa nte te raddhyasam | raddhyasa macchetta ''cchetta ra ddhyasagm raddhyasa macchetta | acchetta
    te ta acchetta ''cchetta te te ma ma te te ma | vi roha roha vi vi roha | sha roha roha sahasraval
    sha vi vi sahasraval vayagm ruhema ruhema vayam ruhema prithivyah prithivya ruhema ruhema prithivyah
    | ssampricah sampricah prithivyah prithivya sampricah pahi pahi sampricah sampricah pahi | pahi susambhrita
    susambhrita pahi pahi susambhrita tva tva susambhrita susambhrita mbharami bharami sagm sa bharamyaditya
    adityai bharami bharamyadityai | adityai rasna rasna 'ditya adityai rasna 'syasi rasna rasna 'si |
    asindranya indranya asyasindranyai | indranyai sannahanagm sannahana mindranya indranyai sannahanam
    | mpusha pusha sannahanagm sannahana pusha te te pusha pusha te nte te granthim | ngrathnatu grathnatu
    granthi grathnatu sa sa grathnatu grathnatu sah | te ma ma te te ma | thsthada ma ma ''stha sthadindrasye
    ndrasya stha thsthadindrasya | indrasya tva tvendrasye ndrasya tva | ntva tva bahubhya bahubhyamiti
    bahu ryacche yacche brihaspateh rmurdhna murdhna brihaspate murdhna harami harami murdhna murdhna
    harami | hara myururu harami hara myuru | urvantariksha mantariksha muru antariksha manvanvantariksha
    mantariksha manu | anvihihyanvanvihi | ndevangama mihihi devangamam | devangama masyasi devangama
    devangamamiti devam ndaivyaya daivyaya shundhaddhvagm shundhaddhva daivyaya karmane karmane daivyaya
    daivyaya karmane | karmane devayajyayai devayajyayai karmane karmane devayajyayai devayajyayai matarishvano
    matarishvano devayajyayai devayajyayai matarishvanah | devayajyaya iti deva matarishvano gharmo gharmo
    matarishvano matarishvano gharmah | 'syasi gharmo gharmo 'si | rdyaurasyasi dyauh | asi prithivi prithivyasyasi
    prithivi | prithivyasyasi prithivi prithivyasi | asi vishvadhaya vishvadhaya asyasi vishvadhayah |
    vishvadhaya asyasi vishvadhaya vishvadhaya asi | vishvadhaya iti vishva asi paramena paramena paramena
    dhamna dhamna paramena paramena dhamna dhamna drigmhasva drigmhasva dhamna dhamna drigmhasva | drigmhasva
    ma ma drigmhasva drigmhasva ma | pavitra masyasi pavitra asi shatadharagm shatadhara masyasi shatadharam
    | va~sunagm shatadharagm shatadharam pavitra masyasi pavitra asi sahasradharagm sahasradhara masyasi
    sahasradharam | sahasradharagm huto huta ssahasradharagm sahasradharagm hutah | sahasradharamiti sahasra
    sstoko huto huta huto draphso draphso huto huto draphsah | agnaye brihate brihate 'gnaye 'gnaye brihate
    | brihate nakaya nakaya brihate brihate nakaya | nakaya svaha svaha nakaya nakaya svaha svaha dyavaprithivibhya
    ndyavaprithivibhyag svaha svaha dyavaprithivibhya dyavaprithivibhyagm sa sa dyavaprithivibhya ndyavaprithivibhyagm
    sa | dyavaprithivibhyamiti dyava ssa sa vishvayuh | vishvayuriti vishva sa vishvavyaca vishvavyaca
    ssa sa vishvavyacah | ssa sa vishvavyaca vishvavyaca vishvavyaca iti vishva sa vishvakarma vishvakarma
    sa sa vishvakarma | vishvakarma sagm sam vi~shvakarma vishvakarma sam | vishvakarmeti vishva mpricyaddhvagm
    sagm sa pricyaddhva mritavarir ritavarih pricyaddhva mpricyaddhva mritavarih | ritavari rurmini rurminir
    rmadhumattama madhumattama urmini rurmini madhumattama mandra mandra madhumattama madhumattama mandrah
    | madhumattama iti madhumat mandra dhanasya dhanasya mandra mandra dhanasya | dhanasya sataye sataye
    dhanasya dhanasya sataye sataye somena somena sataye sataye somena | somena tva tva somena somena
    tva | a tanacmi tanacmya tanacmi | tanacmindraye ndraya tanacmi tanacmindraya | indraya dadhi dadhindraye
    ndraya dadhi | dadhi vishno vishno dadhi dadhi vishno vishno havyagm havyam vi~shno vishno havyam
    | havyagm rakshasva rakshasva havyagm havyagm rakshasva | rakshasveti rakshasva | || nkarmane karmane
    vam | ndevebhyo devebhyo vam devebhyah shakeyagm shakeya ndevebhyo devebhyah shakeyam | ve~shaya veshaya
    shakeyagm shakeyam veshaya tva tva veshaya veshaya tva | ntva tva pratyushtam | pratyushtagm raksho
    rakshah pratyushta mpratyushtagm rakshah | pratyushtamiti prati rakshah pratyushtah pratyushta raksho
    rakshah pratyushtah | pratyushta aratayo 'ratayah pratyushtah pratyushta aratayah | pratyushta iti
    prati rdhuraratayo 'ratayo dhuh | ndhurva dhurva dhurvantam | ndhurva dhurva dhurvanta ndhurva dhurva
    tam | ndhurvati dhurvatyasma nasma ndhurvati dhurvati tam | ndhurvamo dhurvamo vayam ndhurvamo dhurvamastvam
    | devana masyasi devana asi sasnitamagm sasnitama masyasi sasnitamam | mpapritamagm sasnitamagm sasnitama
    sasnitamamiti sasni papritamamiti papri jushtatamamiti jushta vahnitamamiti vahni devahutama mahruta
    mahruta ndevahutama mahrutam | devahutamamiti deva ahruta masyasyahruta mahruta masi | asi havirdhanagm
    havirdhana masyasi havirdhana ndrigmhasva drigmhasva havirdhanagm havirdhana havirdhanamiti havih
    drigmhasva ma ma drigmhasva drigmhasva ma | rmitrasya mitrasya hvar mitrasya tva tva mitrasya mitrasya
    tva | tva cakshusha cakshusha tva tva cakshusha | cakshusha pra pra cakshusha cakshusha pra | preksha
    ikshe pra prekshe ikshe ma meksha ikshe ma | viktha ma ma viktha viktha ma | tva higmsishagmhigmsisha
    ntva tva higmsisham | || higmsisha mururu higmsishagm higmsisha muru | uru vataya vatayoruru vataya
    | vataya devasya devasya vataya vataya devasya | devasya tva tva devasya devasya tva | savituh prasave
    prasave savitu ssavituh prasave | mbahubhya mashvinorashvino mpushnah pushno bahubhya bahubhyamiti
    bahu mpushnah pushno hasta bhya magnaye 'gnaye hasta njushta magnaye 'gnaye jushta va~pami vapamyagnishoma
    bhya mida mida magnishoma ndevana mida mida ida mu vu vida mida mu | u no na u vu nah | saha sphatyai
    sphatyai saha saha sphatyai | tva sphatyai sphatyai tva ndurya durya drigmhanta durya dyavaprithivyo
    rdurya durya dyavaprithivyoh | dyavaprithivyorururu dyavaprithivyo rdyavaprithivyoruru | dyavaprithivyoriti
    dyava urvantariksha mantariksha muru antariksha manvanvantariksha mantariksha manu | anvihihyanvanvihi
    | ihyaditya aditya ihihyadityah | adityastva tva 'ditya adityastva | upasthe sadayami sadaya myupastha
    upasthe sadayami | sadayamyagne 'gne sadayami sadayamyagne agne havyagm havya magne 'gne havyam |
    havyagm rakshasva rakshasva havyagm havyagm rakshasva | rakshasveti rakshasva | || devo vo vo devo
    devo vah | ssavita savita vo va thsavita savitot | punatvacchidrenacchidrena punatu punatvacchidrena
    | acchidrena pavitrena pavitrenacchidrenacchidrena pavitrena | pavitrena pavitrena vasoh ssuryasya
    suryasya vaso suryasya rashmibhi rashmibhi ssuryasya suryasya rashmibhih | rashmibhirapa apo rashmibhi
    rashmibhirapah | rashmibhiriti rashmi rdevirapa apo devih | deviragrepuvo agrepuvo devi rdeviragrepuvah
    | agrepuvo agreguvo 'greguvo 'grepuvo agrepuvo agreguvah | agrepuva ityagre agreguvo 'gre 'gre 'greguvo
    'greguvo 'gre agreguva ityagre agra ima mima magre 'gra imam | yajnannayata nayata yajnam nayatagre
    'gre nayata nayatagre ya~jnapati magre 'gre yajnapatim | ndhatta dhatta yajnapatim yajnapatimiti yajna
    ndhatta dhatta yushman | yushma nindra indro yushman indro 'vrinitavrinite ndra indro 'vrinita | avrinita
    vritraturye vritraturye 'vrinitavrinita vritraturye vritraturye yuyam vri~traturye vritraturye yuyam
    | vritraturya iti vritra yuya mindra mindram indra mavriniddhva mavriniddhva mindra mindra mavriniddhvam
    | vri~traturye vritraturye 'vriniddhva mavriniddhvam vritraturye prokshitah prokshita vritraturye
    vritraturye prokshitah | vritraturya iti vritra sstha stha prokshitah prokshita prokshita iti pra
    agnaye vo vo 'gnaye 'gnaye vah | myukshami pra prokshami | bhya muksha myukshamyagnishoma bhyagm shundhaddhvagm
    shundhaddhva magnishoma bhyagm shundhaddhvam | ndaivyaya daivyaya shundhaddhvagm shundhaddhva daivyaya
    karmane karmane daivyaya daivyaya karmane | karmane devayajyayai devayajyayai karmane karmane devayajyayai
    devayajyaya avadhuta mavadhuta ndevayajyayai devayajyaya avadhutam | devayajyaya iti deva avadhutagm
    raksho raksho 'vadhuta mavadhutagm rakshah | raksho 'vadhuta avadhuta raksho raksho 'vadhutah | avadhuta
    aratayo 'ratayo 'vadhuta avadhuta aratayah | aratayo 'ditya aditya aratayo 'ratayo 'dityah | ktvagaditya
    adityastvak | asi prati pratyasyasi prati | prati tva tva prati prati tva | tva prithivi prithivi
    tva ttu vettu prithivi prithivi ve vettvadhishavana madhishavanam ve~ttu vettvadhishavanam | adhishavana
    masyasyadhishavana madhishavana masi | va~naspatya masyasi vanaspatyam | mprati prati vanaspatyam
    prati tva tva prati prati tva | tva 'ditya adityastva tva 'dityah | ktvagaditya adityastvak | ttu
    vettvagneh | agne stanu stanu ragne ragne stanuh | tanurasyasi tanustanurasi | va~co vaco visarjanam
    | ndevavitaye devavitaye visarjanam devavitaye tva tva devavitaye devavitaye tva | devavitaya iti
    deva tva grihnami grihnami tva tva grihnami | grihnamyadriradri rgrihnami grihnamyadrih | adrirasyasyadriradrirasi
    | asi vanaspatyo vanaspatyo 'syasi vanaspatyah | ssa sa vanaspatyo vanaspatya sa ida midagm sa sa
    idam | ndevebhyo devebhya ida mida devebhyo havyagm havya ndevebhyo devebhyo havyam | havyagm sushami
    sushami havyagm havyagm sushami | sushami shamishva shamishva sushami sushami shamishva | shamishve
    sha mishagm shamishva shamishve sha urja morja murja ma | vayagm sanghatagm sanghatam va~yagm sanghatam
    | shma jeshma sanghatagm sanghata jeshma varshavriddham njeshma jeshma varshavriddham | varshavriddha
    masyasi varshavriddham varshavriddhamiti varsha asi prati pratyasyasi prati | prati tva tva prati
    prati tva | ntva tva varshavriddham | ve~ttu vettu varshavriddham varshavriddhamiti varsha ve~ttu
    vettu paraputam | paraputagm raksho rakshah paraputa mparaputagm rakshah | rakshah paraputah paraputa
    raksho rakshah paraputah | paraputa aratayo 'ratayah paraputah paraputa aratayah | aratayo rakshasagm
    rakshasa maratayo 'ratayo rakshasam | mbhago bhago rakshasagm rakshasa 'syasi bhago bhago 'si | rvayurasyasi
    vayuh | vo vi vi vo vo vi | vi vinaktu vinaktu vi vi vinaktu | vinaktu devo devo vinaktu vinaktu devah
    | devo vo vo devo devo vah | ssavita savita vo va savita hiranyapanir hiranyapani ssavita savita hiranyapanih
    | hiranyapanih prati prati hiranyapanir hiranyapanih prati | hiranyapaniriti hiranya prati grihnatu
    grihnatu prati prati grihnatu | grihnatviti grihnatu | || avadhutagm raksho raksho 'vadhuta mavadhutagm
    rakshah | raksho 'vadhuta avadhuta raksho raksho 'vadhutah | avadhuta aratayo 'ratayo 'vadhuta avadhuta
    aratayah | aratayo 'ditya aditya aratayo 'ratayo 'dityah | ktvagaditya adityastvak | asi prati pratyasyasi
    prati | prati tva tva prati prati tva | tva prithivi prithivi tva ttu vettu prithivi prithivi ve vettu
    divo divo ve skambhanirasyasi skambhani asi prati pratyasyasi prati | prati tva tva prati prati tva
    | tva 'ditya adityastva tva 'dityah | ktvagaditya adityastvak | vettu dhishana dhishana vettu vettu
    dhishana 'syasi dhishana dhishana 'si | asi parvatya parvatya 'syasi parvatya | parvatya prati prati
    parvatya parvatya prati | prati tva tva prati prati tva | tva divo divastva ttu vettu skambhani vettu
    dhishana dhishana vettu vettu dhishana 'syasi dhishana dhishana 'si | asi parvateyi pa rvateyyasyasi
    parvateyi | parvateyi prati prati parvateyi pa prati tva tva prati prati tva | tva parvatih parvatistva
    ttu vettu parvatih parvati vettu devasya devasya vettu vettu devasya | devasya tva tva devasya devasya
    tva | savituh prasave prasave savitu ssavituh prasave | mbahubhya mashvinorashvino mpushnah pushno
    bahubhya bahubhyamiti bahu mpushnah pushno hasta adhi vapami vapamyadhyadhi vapami | dhanya masyasi
    dhanya asi dhinuhi dhinuhyasyasi dhinuhi | ndhinuhi dhinuhi devan | npranaya pranaya deva pranaya
    tva tva pranaya pranaya tva | tva 'panayapanaya tva tva 'panaya | apanaya tva tva 'panayapanaya tva
    | tva vyanaya vyanaya tva tva vyanaya | vyanaya tva tva vyanaya vyanaya tva | dirgha manvanu dirgha
    mprasiti manvanu prasitim | prasiti mayusha ayushe prasiti mprasiti mayushe | ndha mayusha ayushe
    dham | devo vo vo devo devo vah | ssavita savita vo va savita hiranyapanir hiranyapani ssavita savita
    hiranyapanih | hiranyapanih prati prati hiranyapanir hiranyapanih prati | hiranyapaniriti hiranya
    prati grihnatu grihnatu prati prati grihnatu | grihnatviti grihnatu | || dhrishtirasyasi dhrishti
    asi brahma brahma brahma yaccha yaccha brahma brahma yaccha | yacchapapa yaccha yacchapa | agne 'gni
    magni magne 'gne 'gnim | agni mamada mamada magni magni mamada njahi jahyamada mamada kravyadagm sedha
    sedha kravyada nkravyadagm sedha | kravyadamiti kravya ndevayaja ma devayaja vaha nirdagdhannirdagdham
    va~ha vaha nirdagdham | nirdagdhagm raksho raksho nirdagdhannirdagdhagm rakshah | raksho nirdagdha
    nirdagdha raksho raksho nirdagdhah | nirdagdha aratayo 'ratayo nirdagdha nirdagdha aratayah | nirdagdha
    iti nih ndhruva maratayo 'ratayo dhruvam | dhruva masyasi dhruva mprithivi masyasi prithivim | ndrigmha
    drigmha prithivi rdrigmha drigmhayuh | rdrigmha drigmhayurayu ndrigmha drigmha prajam | ndrigmha drigmha
    praja ndrigmha drigmha sajatan | sajata nasma asmai sajata nthsajata nasmai | asmai yajamanaya yajamanayasma
    asmai yajamanaya | yajamanaya pari pari yajamanaya yajamanaya pari | paryuhoha pari paryuha | ndhartra
    muhoha dhartram | dhartra masyasi dhartra asyantariksha mantariksha masyasyantariksham | ndrigmha
    drigmhantariksha mantariksha ndrigmha drigmha pranam | ndrigmha drigmha prana drigmhapana mapana ndrigmha
    drigmhapanam | ndrigmha drigmhapana mapana ndrigmha drigmha sajatan | sajata nasma asmai sajata nthsajata
    nasmai | asmai yajamanaya yajamanayasma asmai yajamanaya | yajamanaya pari pari yajamanaya yajamanaya
    pari | paryuhoha pari paryuha | ndharuna muhoha dharuna dharuna masyasi dharuna ndrigmha drigmha diva
    drigmha cakshushcakshu rdrigmha drigmha cakshuh | rdrigmha drigmha cakshushcakshu drigmha shrotragg
    shrotra ndrigmha drigmha shrotra ndrigmha drigmha shrotragg shrotra ndrigmha drigmha sajatan | sajata
    nasma asmai sajata nthsajata nasmai | asmai yajamanaya yajamanayasma asmai yajamanaya | yajamanaya
    pari pari yajamanaya yajamanaya pari | paryuhoha pari paryuha | uha dharma dharmohoha dharma | syasi
    dharma dharmasi | disho drigmha drigmha disho disho drigmha | ndrigmha drigmha yoni ndrigmha drigmha
    yonim ndrigmha drigmha prajam | ndrigmha drigmha praja ndrigmha drigmha sajatan | sajata nasma asmai
    sajata nthsajata nasmai | asmai yajamanaya yajamanayasma asmai yajamanaya | yajamanaya pari pari yajamanaya
    yajamanaya pari | paryuhoha pari paryuha | uha citashcita uhoha citah | citah stha stha citashcitah
    stha | praja masma asmai praja asmai rayigm rayi masma asmai rayim | rayi masma asmai rayigm rayi
    masmai | nthsajata nasma asmai sajatan | sajata nasma asmai sajata nthsajata nasmai | asmai yajamanaya
    yajamanayasma asmai yajamanaya | yajamanaya pari pari yajamanaya yajamanaya pari | paryuhoha pari
    paryuha | mbhriguna muhoha bhrigunam | bhriguna mangirasa mangirasa mbhriguna mangirasam | ntapasa
    tapasa 'ngirasa mangirasa ntapasa tapasa tapyaddhvam | ya~ni yani tapyaddhva yani gharme gharme yani
    yani gharme | gharme kapalani kapalani gharme gharme kapalani | n yupacinvant yupacinvanti kapalani
    kapala upacinvanti vedhasovedhasa upacinvant yupacinvanti vedhasah | upacinvantityupa vedhasa iti
    vedhasah | pushnastani tani pushnah pushnastani | tanyapyapi tani tanyapi | api vrate vrate 'pyapi
    vrate | vrata indravayu indravayu vrate vrata indravayu | indravayu vi vindravayu indravayu vi | muncatamiti
    muncatam | || va~pami vapami sagm sam va~pami vapami sam | apo adbhiradbhirapa apo adbhih | adbhi
    ragmatagmatadbhi radbhiragmata | agmata sagm sa magmatagmata sam | oshadhayo rasena rasenaushadhaya
    oshadhayo rasena | rasena sagm sagm rasena rasena sam | sagm revati revati rjagatibhi revati revati
    ssrijyaddhvagm srijyaddhva madhumatibhiriti madhu srijyaddhva madbhyo ssrijyaddhvagm srijyaddhva madbhyah
    | adbhyah pari paryadbhyo pari prajatah prajatah pari pari prajatah | sstha stha prajatah prajata
    mpricyaddhva madbhiradbhih pricyaddhvam | njanayatyai janayatyai pricyaddhva janayatyai tva tva janayatyai
