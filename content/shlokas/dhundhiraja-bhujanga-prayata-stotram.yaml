id: dhundhiraja-bhujanga-prayata-stotram
category: stotram
name:
  english: Dhundhiraja Bhujanga Prayata Stotram
  devanagari: ढुण्ढिराजभुजङ्गप्रयातस्तोत्रम्
content:
  english: umangodbhavam dantivaktram ganesham bhaje kankanaih shobhitam dhumraketum | gale haramuktavalishobhitam
    tam namo jnanarupam ganesham namaste || 1|| ganeshaikadantam shubham sarvakarye smaran manmukham jnanadam
    sarvasiddhim | manashcintitam karyasiddhirbhavettam namo buddhikalpam ganesham namaste || 2|| kutharam
    dharantam kritam vighnarajam caturbhirmakhairekadantaikavarnam | idam devarupam ganam siddhinatham
    namo bhalacandram ganesham namaste || 3|| shirahsinduram kunkumam dehavarnam shubhaibhadikam priyate
    vighnarajam | mahasankatacchedane dhumraketum namo gauriputram ganesham namaste || 4|| tatha patakam
    cheditum vishnunamam tatha dhyayatam shamkaram papanasham | yatha pujitam shanmukham shokanasham namo
    vighnanasham ganesham namaste || 5|| sada sarvada dhyayatamekadantam sada pujitam sinduraraktapushpaih
    | sada carcitam candanaih kunkumaktam namo jnanarupam ganesham namaste || 6|| namo gaurideha-malotpanna
    tubhyam namo jnanarupam namah siddhipam tam | namo dhyayatamarcatam buddhidam tam namo gauryapatyam
    ganesham namaste || 7|| bhujangaprayatam pathed yastu bhaktya prabhate narastanmayaikagracittah |
    kshayam yanti vighna dishah shobhayantam namo jnanarupam ganesham namaste || 8|| || iti shridhundhirajabhujangaprayatastotram
    sampurnam || dhundhirajabhujangam
  devanagari: उमाङ्गोद्भवं दन्तिवक्त्रं गणेशं भजे कङ्कणैः शोभितं धूम्रकेतुम् । गले हारमुक्तावलीशोभितं
    तं नमो ज्ञानरूपं गणेशं नमस्ते ॥ १॥ गणेशैकदन्तं शुभं सर्वकार्ये स्मरन् मन्मुखं ज्ञानदं सर्वसिद्धिम्
    । मनश्चिन्तितं कार्यसिद्धिर्भवेत्तं नमो बुद्धिकल्पं गणेशं नमस्ते ॥ २॥ कुठारं धरन्तं कृतं विघ्नराजं
    चतुर्भिर्मखैरेकदन्तैकवर्णम् । इदं देवरूपं गणं सिद्धिनाथं नमो भालचन्द्रं गणेशं नमस्ते ॥ ३॥ शिरःसिन्दुरं
    कुङ्कुमं देहवर्णं शुभैभादिकं प्रीयते विघ्नराजम् । महासङ्कटच्छेदने धूम्रकेतुं नमो गौरिपुत्रं गणेशं
    नमस्ते ॥ ४॥ तथा पातकं छेदितुं विष्णुनामं तथा ध्यायतां शंकरं पापनाशम् । यथा पूजितं षण्मुखं शोकनाशं
    नमो विघ्ननाशं गणेशं नमस्ते ॥ ५॥ सदा सर्वदा ध्यायतामेकदन्तं सदा पूजितं सिन्दुरारक्तपुष्पैः । सदा चर्चितं
    चन्दनैः कुङ्कुमाक्तं नमो ज्ञानरूपं गणेशं नमस्ते ॥ ६॥ नमो गौरिदेह-मलोत्पन्न तुभ्यं नमो ज्ञानरूपं नमः
    सिद्धिपं तम् । नमो ध्यायतामर्चतां बुद्धिदं तं नमो गौर्यपत्यं गणेशं नमस्ते ॥ ७॥ भुजङ्गप्रयातं पठेद्
    यस्तु भक्त्या प्रभाते नरस्तन्मयैकाग्रचित्तः । क्षयं यान्ति विघ्ना दिशः शोभयन्तं नमो ज्ञानरूपं गणेशं
    नमस्ते ॥ ८॥ ॥ इति श्रीढुण्ढिराजभुजङ्गप्रयातस्तोत्रं सम्पूर्णम् ॥ ढुण्ढिराजभुजङ्गम्
