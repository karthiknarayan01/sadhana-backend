id: kyts-2-5-visvaroopo-vai-tvaashtrah-krishna-taittiriya-yajurveda-samhita-patha
category: stotram
name:
  english: KYTS 2.5 Visvaroopo Vai Tvaashtrah - Krishna Taittiriya Yajurveda Samhita Patha
content:
  english: krishna yajurvediya taittiriya samhitaya ndvitiyakande pancamah prashnah shri gurubhyo namah
    | harih om || vishvarupo vai tvashtrah purohito devanamasi ntasya trini shirshanyasan thsomapanagm
    surapana mannadanagm sa pratyaksha ndevebhyo bhagamavada tparokshamasurebhya ssarvasmai vai pratyaksha
    va~danti yasma eva paroksham va~danti tasya bhaga uditastasmadindro 'bibhedidrim vi~ paryavartayatiti
    tasya vajramadaya shirshanyacchinadya masithsa kapinjalo 'bhava thsurapanagm sa kalavinko yadannadanagm
    sa tittiristasya brahmahatyamupagrihna mbhutanyabhyakrosha nbrahmahanniti sa prithivimupasidadasyai
    brahmahatyayai tritiya mprati grihaneti sa tparabhavishyanti manye tato ma para bhuvamitipura te va~thsaradapi
    rohadityabravi tprithivyai khatamapi rohati varevritagg hyasyai tritiya mbrahmahatyayai pratyagrihna
    thsvakritamirinamabhava ssvakrita irine nava sye dbrahmahatyayai hyesha varna ssa vanaspatinupasidadasyai
    brahmahatyayai tritiya mprati grihniteti te tparabhavishyanto manyamahe tato ma para bhumetyavrashcanadvo
    bhuyagmsa uttishthanityabravi ttasmadavrashcana mbhuyagmsa uttishthanti varevritagg hyesha mbrahmahatyayai
    pratyagrihnan thsa niryaso 'bhava mbrahmahatyayai hyesha varno 'tho khalu ya eva lohito yo va ''vrashcananniryeshati
    tasya na nkamamanyasya sastrishagmsada mupasidadasyai brahmahatyayai tritiya mprati grihniteti ta
    abruvan varam vi~ndamahai kamama vijanito mbhavameti tasmadritviya thstriyah prajam ~vindante kamama
    vijanito ssambhavanti varevritagg hyasa mbrahmahatyayai pratyagrihnan thsa malavadvasa abhava ''sita
    nasya annamadya dbrahmahatyayai hyesha varna mpratimucya ''ste 'tho khalvahurabhyanjanam va~va striya
    annamabhyanjanameva na pratigrihya va~nti yastato jayate so 'bhishasto yamaranye tasyai hritamukhyapagalbho
    ya snati tasya aphsu maruko ya 'bhyankte tasyai dushcarma ya pralikhate tasyai khalatirapamari ya
    ''nkte tasyai kano ya dato dhavate tasyai ya nakhani nikrintate tasyai kunakhi ya krinatti tasyai
    klibo ya rajjugm srijati tasya u dbandhuko ya parnena pibati tasya unmaduko ya kharvena pibati tasyai
    kharvastisro ratri ncaredanjalina va pibedakharvena va patrena prajayai gopithaya || tvashta hataputro
    vindragm somama ttasminnindra upahavamai 'vadhiriti sa yajnaveshasa nkritva prasaha somamapiba ttasya
    yadatyashishyata ta ''havaniyamupa pravartaya rvardhasveti yadavartaya dvritrasya vritratvam rvardhasveti
    tasmadasye shshatrurabhavathsa sabham va~nnagnishomavabhi samabhava thsa ishumatramishumatram vi~shvannavardhata
    sa imam lo~kanavrinodyadimam dvritrasya vritratva thsa prajapatimupadhava ' janiti tasmai vajragm
    siktva prayacchadetena jahiti tenabhyayata tavabrutamagnishomau ma ssva iti mama vai yuvagg nmamabhyetamiti
    tau bhagadheyamaiccheta mpurnamase prayaccha ttavabrutamabhi sandashtau vai svo na shaknuva aitumiti
    sa indra atmanah shitaruravajanaya ttacchitarurayorjanma ya evagm shitarurayorjanma veda nainagm shitarurau
    hatastabhyamenamabhyanaya jjanjabhyamanadagnishomau nirakramata mpranapanau va ena 'panah kratustasma
    jjanjabhyamano bruyanmayi dakshakratu iti pranapanaveva ndhatte sarvamayureti sa devata vritrannirhuya
    vartraghnagm havih purnamase niravapa mpyayayanti tasma dvartraghni purnamase 'nu cyete vridhanvati
    amavasyaya thsaggsthapya vartraghnagm havirvajramadaya punarabhyayata te abruta ndyavaprithivi ma
    pra haravayorvai shrita iti te abrutam vri~navahai nakshatravihita 'hamasanityasavabravi ntasmannakshatravihita
    va~ro gacchati sa abhyameva prasuta indro vritramaha nte deva vritragm hatva nno vahatamiti tavabrutamapatejasau
    vai tyau vritre vai tyayosteja iti te 'bruvan ka idamacchaititi gaurityabruva ngaurvava sarvasya mitramiti
    sa 'bhayena bhunajaddhva iti ta dgavi satobhayena bhunjata etadva agnestejo ya tpayo ya evamagnishomayo
    stejo veda tejasvyeva bhavati brahmavadino vadanti kindevatya mpaurnamasamiti prajapatyamiti bruya
    nniravasayayaditi tasma ndhanena niravasayayanti || 'bhi pravepanta sa etam 'nunirvapyamapashya 'pahata
    yadvaimridhah purnamase 'nunirvapyo bhavati mridha eva tena yajamano 'pa hata indro vritragm hatva
    devatabhishcendriyena ca vya mamavasyayamapashyadaindra 'shtakapalo 'mavasyaya 'va rundha indrasya
    vritra njaghnusha indriyam thsa prajapatimupadhava mme jaghnusha indriyam mprithivimanu vyara 'bhuvanniti
    sa prajapatih pashunabravidetadasmai sa tpashava oshadhibhyo 'dhyatman nnayyasya sannayyatvam tpratidhushah
    pratidhuktvagm samanaishuh pratyadhuksha nna tu mayi shrayata ityabravidetadasmai nkurutetyabravi
    makurvannindriyam va~vasmin virya ntacchritasya shritatvagm samanaishuh pratyadhukshanchritamakra
    nna tu ma dhinotityabravidetadasmai dadhi kurutetyabravi ttadasmai daddhyakurva ttaddaddhno dadhitva
    mbrahmavadino vadanti daddhnah purvasyavadeya nkriyata ityanadritya tacchritasyaiva purvasyava dyedindriyamevasmin
    viryagg shritva daddhno parishtaddhinoti yathapurvamupaiti ya rva parnavalkairva ''tancya ntadyadatancanena
    manusha ndaddhna ''tanakti 'gnihotroccheshanamabhya tanakti yajnasya santatya indro vritragm hatva
    para daparadhamiti manyamanasta ndevatah praishamaicchan tprajapatiryah prathamo 'nuvindati tasya
    prathama tpitribhyah purvedyuh kriyate so ndeva abhi samagacchantama vai no 'dya vasu vasatitindro
    hi devanam va~su tadamavasyaya amavasyatva mbrahmavadino vadanti kindevatyagm sannayyamiti vaishvadevamiti
    bruya dvishve hi taddeva bhagadheyamabhi samagacchantetyatho khalvaindramityeva bruyadindram 'bhi
    samagacchanteti || me jaghnusha indriyam mityabravidetadasma brahmavadino vadanti sa tvai dar shapurnamasau
    yajeta ya enau sendrau yajeteti vaimridhah purnamase 'nunirvapyo bhavati tena purnamasa ndaddhyamavasyaya
    ntenamavasya sendra ya evam shapurnamasau yajate sendravevainau yajate shva 'sma ijanaya vasiyo bhavati
    deva vai ya dyajne 'kurvatatadasura akurvata te deva eta mekadashakapalagm sarasvatyai carugm sarasvate
    caru rnamasagm saggsthapyanu niravapa 'sura yo bhratrivyavan rnamasagm saggsthapyaitamishtimanu nirvape
    tpaurnamasenaiva vajra mbhratrivyaya prahritya ''gnavaishnavena devata nca bhratrivyasya vrinkte mithuna
    ya~vadevasyasti ta yavadevasyasti tat vri~nkte paurnamasimeva yajeta bhratrivyavannamavasyagm hatva
    bhratrivya ''pyayayati sakamprasthayiyena yajeta pashukamoyasmai va alpena ''tmana tripyati nanyasmai
    dadati yasmai mahata tripyatyatmana dada tyanyasmai mahata purnagm hotavya ntripta evainamindrah prajaya
    pashubhistarpayati darupatrena juhoti na hi mrinmayamahutimanasha audumbara mbhavatyurgva udumbara
    ur kpashava urjaivasma urja mpashunava rundhe nagatashrirmahendram ya~jeta trayo vai gatashriya ngramani
    rajanyastesha mmahendro devata yo vai sva ndevatamati yajate prasvayai devatayaicyavate na para mprapnoti
    papiya ndevatejyamana bhutya indhe vasiya va~thsarasya parastadagnaye vratapataye purodashamashtakapala
    njaghnivagm samagni rvratama lambhayati tato 'somayaji yadasomayaji sa nkarotyatho paraiva sicyate
    somayajyeva sa tpayo vai somah payah sannayya mprajaya pashubhirardhayati vardhayatyasya bhratrivyam
    ya~sya havirnirupta abhyudeti tredha tandulan vi bhajedye maddhyama ssyustanagnaye datre purodashamashtakapala
    nkuryadye sthavishthastanindraya pradatre dadhagg vishnave shipivishtaya shrite carumagnirevasmai
    mprajanayati vriddhamindrah prayacchati yajno vai vishnuh pashava shshipiryajna eva pashushu pratitishthati
    na dve tpurvaya samprati yajetottaraya chambatkuryadyaduttaraya samprati yajeta purvaya chambatkuryanneshtirbhavati
    na yajnastadanu hritamukhyapagalbho jayata ekameva yajeta pragalbho 'sya jayate 'nadritya ta ddve
    eva yajeta yajna mukhameva purvaya ''labhate yajata uttaraya devata eva purvaya 'varundha indriya
    muttaraya devalokameva 'bhijayati manushyalokamuttaraya bhuyaso yajnakratunupai tyesha vai sumana
    nameshtiryamadyejana mpashcaccandrama abhyudetyasminnevasmai loke mbhavati dakshayana yajnena suvargakamo
    yajeta purnamase sa nmaitravarunya ''mikshaya 'mavasyayam ya~jeta purnamase vai devanagm sutasteshametamardhamasa
    purvedyu ryajate rvedyu ryajate vedimeva ta napakaroti sadohavirdhane eva sa mminoti yadyajate devaireva
    sutyagm sa mpadayati sa etamardhamasagm sadhamada travarunya ''mikshaya 'mavasyayam ya~jate yaivasau
    devanam 'nubandhya so evaishaitasya sakshadva esha devanabhyarohati ya esham mabhyarohati yatha khaluvai
    shreyanabhyarudhah kamayate tatha karoti yadyavaviddhyati papiya nbhavati yadi navaviddhyati sadrim
    vya~vritkama etena yajnena yajeta kshurapavir kpunyo va bhavati pra va miyate tasyaitadvrata va~denna
    magm samashniyanna striyamupeyannasya palpulanena vasah palpulayeyu shapurnamasavishtva somena yajate
    rathaspashta evavasane vare devanamava syatyetani va angaparugmshi sam 'ngaparugshyeva sam va~thsarasya
    prati dadhatye te vai sam va~thsarasya cakshushi ya shapurnamasau yajate tabhyameva suvargam tyesha
    vai devanam shapurnamasau yajate devanameva vikra ntimanu vikramata esha vai devayanah pantha ya shapurnamasau
    yajate ya eva devayanah panthastagm samarohatyetau vai devanagm hari ya shapurnamasau yajate yaveva
    devanagm hari tabhya va~hatyetadvai devanamasyam shapurnamasau yajate sakshadeva devanamasye juhotyesha
    vai havirdhani yo dar shapurnamasayaji sayamprataragnihotra njuhoti yajate dar havirdhaninagm suto
    ya evam shapurnamasau yajate havirdhanyasmiti sarvamevasya bar ntau va etau putau meddhyau ya shapurnamasau
    yajate putavevainau meddhyau yajate namavasyaya dupeyannirindriya thsomasya vai rajno 'rdhamasasya
    ratrayah patnaya asa tte enamabhi samanahyeta drajayakshmasya janma ya tpapayakshmasya yajjayabhyamavinda
    ttajjayenyasya ya evametesham njanma veda nainamete yakshmavindanti sa ete eva namasyannupadhava 'vadadhi
    deva ijyanta iti tasma thsadrishinagm ratrina nca deva ijyanta ete hi devana mbhagadhe bhagadha asmai
    manushya bhavanti ya evam ve~da bhutani kshudhamaghnan thsadyo manushya ardhamase deva masi pitarah
    sam rmanushya ashanamicchante 'rdhamase deva ijyante masi pitribhyah kriyate sam va~thsare vanaspatayah
    phala deva vai narci na yajushyashrayanta te samanneva nkaroti yatraiva deva ashrayanta tata evaina
    nkaroti vaca evaisha yogo hi nkaroti praja eva ta ssrijate trih prathamamanvaha triruttamam ya~jnasyaiva
    tadbarsa nahyatyaprasragmsaya nnahyatyaprasragmsaya santatamanvaha prananamannadyasya santatya atho
    rakshasamapahatyai rathatamri mprathamamanvaha rathatamro va ayam lo~ka imameva lokamabhi jayati trirvi
    grihnati traya ime loka imaneva lokanabhi jayati bar hato va asau loko 'mumeva lokamabhi jayati pra
    vo mprajapatyamanvaha yajno vai prajapatiryajnameva prajapatima rabhate pravo vaja ityanvahannam 'nnamevava
    rundhe pravo vaja ityanvaha tasma tpracinagm reto dhiyate 'gna a yahi vitaya ityaha tasma praja jayante
    pravo vaja ityanvaha masa vai vaja ardhamasa abhidyavo deva havishmanto gaurghritaci yajno devanjigati
    yajamana masityeva yajnasya priya diti pra vo vaja iti tasyanucyagna a yahi vitaya iti santata ndadhara
    sarvamayureti yo va aratnigm samidheninam ve~daratnaveva bhratrivya ndadhatyesha va aratni ve~daratnaveva
    bhratrivya risherva eta nirmita ya thsamidhenyasta yadasam ssyuh prajaya pashubhi ryajamanasya vi
    tishtherannardharcau sa ndadhati sam ~yunaktyevainasta asmai sam yu~kta avaruddha jayante pravo vaja
    'gna a yahi vitaya ityaha rathantarasyaisha varnasta ntva samidbhirangira ityaha vamadevyasyaisha
    varno brihadagne suviryamityaha brihata esha varno yadeta ntricamanvaha yajnameva ta nkarotyagniramushmin
    ~loka asidadityo nte deva abruvannetemau vi paryuhametyagna a yahi vitaya ityasmin ~loke 'gnimadadhu
    rbrihadagne suviryamityamushmin ~loka aditya ntato va imau lokavashamyatam shshantyai shamyato 'sma
    imau lokau ya evam ve~da pancadasha samidheniranvaha pancadasha va ardhamasasya ratrayo ntrini ca
    shatani shashtishcaksharani tavati va~thsarasya ratrayo pnoti nrimedhashca parucchepashca brahmavadyamavadetamasmi
    njanayava yataro nau brahmiyaniti nrimedho tparucchepo 'bhyavada 'gnimajanayadrisha ityabravi dyathsamavadvidva
    katha tvamagnimajijano nahamiti samidheninamevaham tpadamanucyate sa asam ntva samidbhirangira ityaha
    samidhenishveva tajjyoti rjanayati striyastena yadrica thsamidhenyo vrishanvati svatistena sendrastena
    mithuna agnirdevana nduta asidushana kavyo mprashnamaitagm sa prajapatiragni vri~nimaha ityabhi paryavartata
    tato deva abhava vri~nimaha ityanvaha bhavatyatmana para 'sya bhratrivyo bhavatyaddhvaravatimanvaha
    bhratrivyamevaitaya dhvarati shocishkeshastamimaha dhvarati shocishkeshastamimaha ityaha pavitramevaita
    dyajamanamevaitaya pavayati samiddho agna ahutetyaha paridhimevaita mpari dadhatyaskandaya yadata
    urdhvamabhyadaddhyadyatha bahih paridhi skandati tadrigeva ta ttrayo va agnayo havyavahano devana
    nkavyavahanah pitrinagm saharaksha asurana hya shagmsante mam miti vriniddhvagm havyavahanamityaha
    ya eva devana vri~nite bandhoreva naityatho santatyai parastadarvaco vrinite tasma tparastadarvanco
    manushya mekannatrigmshacca agne mahagm asityaha mahan hyesha yadagni rbra hmanetyaha brahmano hyesha
    bharatetyahaisha hi devebhyo havya mbharati deveddha ityaha deva hyetamaindhata manviddha ityaha manur
    hyetamuttaro devebhya aindhar shayo hyetamastuvan vipranumadita ityaha vipra hyete yacchushruvagmsah
    kavishasta ityaha kavayo hyete yacchushruvagmso brahmasagmshita ityaha brahmasagmshito hyesha ghritahavana
    ityaha ghritahutir hyasya priyatama praniryajnanamityaha pranir hyesha yajnanagm rathiraddhvaranamityahaisha
    hi devaratho 'turto hotetyaha na hyeta havyavadityaha sarvagghyesha taratyaspatra njuhurdevanamityaha
    juhur ncamaso devapana ityaha camaso hyesha devapano 'ragm ivagne nemirdevag mparibhurasityaha devan
    hyesha paribhurya dbruyada vaha deva ndevayate yajamanayeti bhratrivyamasmai yajamanayetyaha yajamanamevaitena
    vardhayatyagnimagna a vaha somama vahetyaha devata eva ta dyathapurvamupa hvayata a ca vaha suyaja
    ca yaja jataveda ityahagnimeva ta 'sya sagmshito devebhyo havyam 'gnirvai devanagm hota ya eva devanagm
    hota tam vri~nitesmo vayamityaha ''tmanameva sattva ngamayati sadhu te yajamana devatetyaha 'gnigm
    hotaramavritha ityagninobhayato yajamana dyajamanadevatya vai juhurbhratrivya devatyopabhri dyaddve
    iva bruya dbhratrivyamasmai janaye dghritavatimaddhvaryo srucama 'syasvetyaha yajamana mevaitena vardhayati
    devayuvamityaha devan 'vati vishvavaramityaha vishvagg hyesha 'vatidamahai devagm idenya nnamasyama
    namasyan yajama yajniyanityahamanushya va idenyah pitaro namasya deva yajniya devata eva ta vipranumadita
    ityaha drajanyasya trayo va anye rajanya tpurusha brahmano vaishyah shudrastanevasma anukan karoti
    pancadashanu bruya drajanyasya pancadasho vai rajanyah sva evainagg stome pratishthapayati trishtubha
    pari daddhyadindriyam vai~ trishtugindriyakamah khalu vai rajanyo yajate trishtubhaivasma indriya
    mpari grihnati yadi kamayeta brahmavarcasamastviti brahmavarcasamastviti gayatriya pari daddhya vai~
    gayatri brahmavarcasameva bhavati saptadashanu bruya dvaishyasya saptadasho vai vaishya ssva evainagg
    stome prati shthapayatijagatya pari daddhyajjagata vai pashavah pashukamah khalu vai vaishyo yajate
    jagatyaivasmai pashu npari grihnatye kavigm shatimanu bruya tpratishthakamasyai kavigmsha mpratishtha
    pratishthityai caturvigmshatimanu bruya kamasya caturvigmshatyakshara gayatri gayatri brahmavarcasa
    brahmavarcasamava rundhe trigmshatamanu bruyadannakamasya trigmshadakshara viradannam dvirajaivasma
    annadyamava rundhe dvatrigmshatamanu bruya tpratishthakamasya dvatrigmshadakshara 'nushtuganushtu
    mpratishtha pratishthityai shattrigmshatamanu bruya tpashukamasya shattrigmshadakshara brihati bar
    hatah pashavo brihatyaivasmai pashu nava rundhe catushcatvarigmshatamanu bruyadindriyakamasya catushcatvarigmshadakshara
    trishtugindriya ptrishtubhaivasma indriyamava rundhe 'shtacatvarigm shatamanu bruya tpashukamasyashtacatvarigmshadakshara
    jagati jagatah pashavojagatyaivasmai pashunava rundhe sarvani chandag syanu bruya ssarvani va etasya
    chandagsya varuddhani yo bahuyajyaparimitamanu bruyadaparimitasya varudhyai || saptacatvarigmshacca
    ndevanamupa vyayate devalakshmameva ta tkurute tishthannanvaha tishthann va~dati tishthannanvaha suvargasya
    lokasyabhijitya asino yajatyasminneva loke pratitishthati ya 'nucyagm sadevatvaya vidvagmso vai dvidhrita
    addhvano ssamarukshannantarvedyanyah pado bhavati bahirvedyanyo 'thanvahaddhvanam vi~dhrityai pathamasagm
    rohayatho bhutancaiva bhavishyaccava rundhe shcaiva pashunaranyag ncabhi jayati deva vai samidheniranucya
    yajna thsa prajapatistushni ttato vai deva yajnamanvapashyan magharayati yajnasyanukhyatya atho samidhenirevabhya
    ve~datho tarpayatyevaina stripyati prajaya pashubhi ve~da yadekaya ''gharayedeka ndve priniyadya dtisribhirati
    tadrecayetmanasa ''gharayati manasa hyana ptamapyate tiryancama gharayatyachambatkaram va~kca manashca
    ''rtiyetamaha va~hamiti vagabravidaha ndevebhya iti manastau prajapati mprashnamaitagm so prajapatirdutireva
    tprajapatirdutireva tva 'si yaddhi manasa dhyayati tadvaca vadatiti ta nna vaca juhavannityabravi
    ttasmanmanasa prajapataye juhvatimana iva hi prajapatih prajapateraptyai paridhin shti punatyevainan
    ntrayo vai pranah prananevabhi jayati trirdakshinardhyam traya ime loka imaneva lokanabhi jayati triruttarardhya
    ntrayo vai devayanah panthanastanevabhi jayati trirupa vajayati trayo vai devaloka devalokanevabhi
    jayati dvadasha sa mpadyante dvadasha masa va~thsarameva prinatyatho sam va~thsaramevasma upa dadhati
    suvargasya lokasya samashtya agharama gharayati tira iva ssuvargamevasmai loka mprarocayatyrijuma
    gharayatyrijuriva hi prana ssantatama gharayati prananamannadyasya santatya atho rakshasamapahatyai
    ya nkamayeta pramayuka kpramiyateshiro va eta dyajnasya yadaghara atma dhruva ''gharamagharya dhruvagm
    samanaktyatmanneva yajnasya shirah prati dadhatyagni maitagm sa prajapati rbrahmana detadvi bruhitya
    shravayetida shshrinuteti vava tadabravi dagni rdevo hoteti ya eva devana ntamavrinita tato deva mpravrinate
    bhavatyatmana para 'sya bhratrivyo bhavati yadbra mbrahmanayadhi bruya dbrahmano na parocyah || dakshinardhyam
    traya shcatvarigmshacca ayushta ayurda agna a pyayasva sa nte 'va te heda uduttama mprano devya no
    divo 'gna vishnu agnavishnu ima tattva ya myu dutya murdhvo vidyutam va~sanah | tasya jyeshtha va~hantir
    hiranyavarnah pari yanti yahvih || sa manya yantyupa yantyanya nnadyah prinanti | tamu shucigm shucayo
    didivagm samapa mparitasthurapah | tamasmera yuvatayo yuvana mmarmrijyamanah pari yantyapah || sa
    shukrena shikvana revadagnirdidayaniddhmo ghritanirnigaphsu || indravarunayorahagmsamrajorava a vrine
    | ta no mridata idrishe || indravaruna yuvamaddhvaraya no vishe janaya mahi sharma yacchatam | dirghaprayajyumati
    yo vanushyati vaya njayema pritanasu dudhyah || a nomitravaruna nno agne varunasya vidva 'va yasi
    sishthah | yajishtho vahni tama shshoshucano vishva dveshagmsi pramumugdhyasmat || sa tvanno agne
