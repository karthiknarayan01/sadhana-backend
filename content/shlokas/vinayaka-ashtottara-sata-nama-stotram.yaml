id: vinayaka-ashtottara-sata-nama-stotram
category: stotram
name:
  english: Vinayaka Ashtottara Sata Nama Stotram
content:
  english: vinayako vighnarajo gauriputro ganeshvarah | skandagrajo'vyayah puto daksho'dhyaksho dvijapriyah
    || || agnigarvacchidindrashriprado vanipradayakah | sarvasiddhipradah sharvatanayah sharvaripriyah
    || || sarvatmakah srishtikarta devanikarcitah shivah | siddhibuddhipradah shanto brahmacari gajananah
    || || dvaimaturo munistutyo bhaktavighnavinashanah | ekadantashcaturbahushcaturah shaktisamyutah ||
    || lambodarah shurpakarno harirbrahmaviduttamah | kavyo grahapatih kami somasuryagnilocanah || ||
    pashankushadharashcando gunatito niranjanah | akalmashah svayam siddhah siddharcitapadambujah || ||
    bijapuraphalasakto varadah shashvatah kriti | dvijapriyo vitabhayo gadi cakrikshucapadhrit || || shrido'ja
    utpalakarah shripatistutiharshitah | kuladribhetta jatilashcandracudo'mareshvarah || || nagayajnopaviti
    ca kalikalmashanashanah | sthulakanthah svayankarta samaghoshapriyah parah || || sthulatundo'granirdhiro
    vagishah siddhidayakah | durvabilvapriyah kantah papahari samahitah || || ashritashrikarah saumyo
    bhaktavanchitadayakah | shanto'cyutarcyah kaivalyo saccidanandavigrahah || || jnani dayayuto danto
    brahmadveshavivarjitah | pramattadaityabhayado vyaktamurtiramurtiman || || shailendratanujotsangakhelanotsukamanasah
    | svalavanyasudhasarajitamanmathavigrahah || || samastajagadadharo mayi mushakavahanah | ramarcito
    vidhishcaiva shrikantho vibudheshvarah || || cintamanidvipapatih paramatma gajananah | hrishtastushtah
    prasannatma sarvasiddhipradayakah || || ashtottarashatenaivam namnam vighneshvaram vibhum | yah pujayedanenaiva
    bhaktya siddhivinayakam || || durvadalaih bilvapatraih pushpairva candanakshataih | sarvankamanavapnoti
    sarvavighnaih pramucyate || || iti bhavishyottarapurane vinayakashtottarashatanama stotram |
  devanagari: विनायको विघ्नराजो गौरीपुत्रो गणेश्वरः । स्कन्दाग्रजोऽव्ययः पूतो दक्षोऽध्यक्षो द्विजप्रियः
    ॥ ॥ अग्निगर्वच्छिदिन्द्रश्रीप्रदो वाणीप्रदायकः । सर्वसिद्धिप्रदः शर्वतनयः शर्वरीप्रियः ॥ ॥ सर्वात्मकः
    सृष्टिकर्ता देवानीकार्चितः शिवः । सिद्धिबुद्धिप्रदः शान्तो ब्रह्मचारी गजाननः ॥ ॥ द्वैमातुरो मुनिस्तुत्यो
    भक्तविघ्नविनाशनः । एकदन्तश्चतुर्बाहुश्चतुरः शक्तिसंयुतः ॥ ॥ लम्बोदरः शूर्पकर्णो हरिर्ब्रह्मविदुत्तमः
    । काव्यो ग्रहपतिः कामी सोमसूर्याग्निलोचनः ॥ ॥ पाशाङ्कुशधरश्चण्डो गुणातीतो निरञ्जनः । अकल्मषः स्वयं
    सिद्धः सिद्धार्चितपदाम्बुजः ॥ ॥ बीजापूरफलासक्तो वरदः शाश्वतः कृती । द्विजप्रियो वीतभयो गदी चक्रीक्षुचापधृत्
    ॥ ॥ श्रीदोऽज उत्पलकरः श्रीपतिस्तुतिहर्षितः । कुलाद्रिभेत्ता जटिलश्चन्द्रचूडोऽमरेश्वरः ॥ ॥ नागयज्ञोपवीती
    च कलिकल्मषनाशनः । स्थूलकण्ठः स्वयङ्कर्ता सामघोषप्रियः परः ॥ ॥ स्थूलतुण्डोऽग्रणीर्धीरो वागीशः सिद्धिदायकः
    । दूर्वाबिल्वप्रियः कान्तः पापहारी समाहितः ॥ ॥ आश्रितश्रीकरः सौम्यो भक्तवाञ्छितदायकः । शान्तोऽच्युतार्च्यः
    कैवल्यो सच्चिदानन्दविग्रहः ॥ ॥ ज्ञानी दयायुतो दान्तो ब्रह्मद्वेषविवर्जितः । प्रमत्तदैत्यभयदो व्यक्तमूर्तिरमूर्तिमान्
    ॥ ॥ शैलेन्द्रतनुजोत्सङ्गखेलनोत्सुकमानसः । स्वलावण्यसुधासारजितमन्मथविग्रहः ॥ ॥ समस्तजगदाधारो मायी मूषकवाहनः
    । रमार्चितो विधिश्चैव श्रीकण्ठो विबुधेश्वरः ॥ ॥ चिन्तामणिद्वीपपतिः परमात्मा गजाननः । हृष्टस्तुष्टः
    प्रसन्नात्मा सर्वसिद्धिप्रदायकः ॥ ॥ अष्टोत्तरशतेनैवं नाम्नां विघ्नेश्वरं विभुम् । यः पूजयेदनेनैव भक्त्या
    सिद्धिविनायकम् ॥ ॥ दूर्वादलैः बिल्वपत्रैः पुष्पैर्वा चन्दनाक्षतैः । सर्वान्कामानवाप्नोति सर्वविघ्नैः
    प्रमुच्यते ॥ ॥ इति भविष्योत्तरपुराणे विनायकाष्टोत्तरशतनाम स्तोत्रम् ।
