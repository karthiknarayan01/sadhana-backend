id: paramahamsopanishad
category: upanishad
name:
  english: paramahamsopanishad
  devanagari: परमहंसोपनिषद्
content:
  english: upanishad om purnamadah purnamidam purnat purnamudacyate | purnasya purnamadaya purnamevavashishyate
    || om shantih shantih shantih || atha yoginam paramahamsanam ko'yam marnastesham ka sthitiriti narado
    bhagavantamupagatyovaca | tam bhagavanaha | yo'yam paramahamsamargo loke durlabhataro na tu bahulyo
    yadyeko bhavati sa eva nityaputasthah sa eva vedapurusha iti vidusho manyante mahapurusho yaccittam
    tatsarvada mayyevavatishthate tasmadaham ca tasminnevavasthiyate | asau svaputramitrakalatrabandhvadinchikhayajnòpavitam
    svadhyayam ca sarvakarmani samnyasyayam brahmandam ca hitva kaupinam dandamacchadanam ca svashariropabhogarthaya
    ca lokasyopakararthaya ca parigrahet | tacca na mukhyo'sti ko'yam mukhya iti cedayam mukhyah || 1
    || na dandam na shikham na yajnòpavitam na cacchadanam carati paramahamsah | na shitam na coshnam
    na sukham na duhkham na manavamane ca shadurmivarjam nindagarvamatsaradammadarpecachadveshasukhaduhkhakamakodhalobhamohaharshasuyahankaradimshca
    hitva svavapuh kunapamiva drishyate yatastadvapurapadhvastam samshayaviparitamithyajnananam yo hetustena
    nityanivrittastannityabodhastatsvayamevavasthitistam shantamacalamadvayanandavidghana evasmi | tadeva
    mama paramdhama tadeva shikha ca tadevopavita ca | paramatmatmanorekatvajnanena tayorbheda eva vibhagnah
    sa sandhya || 2 || sarvankamanparityajya advaite paramasthitih | jnanadando dhrito yena ekadandi sa
    ucyate | kashthadando dhrito yena sarvashi jnanavarjitah | titikshajnanavairagyashamadigunavarjitah
    | sa yati narakandhoranmaharauravasamjnakan | idamantaram nẏatva sa paramahamsah || 3 || ashambaro
    na namaskarò na svahakaro na svadhakarò na ninda na stutiryadricachiko bhavedbhikshuh | navahanam
    na visarjanam na mantram na dhyanam nopasanam ca | na lakshyam nakakshyam na prithagnaprithagaham
    na na tvam na sarvam caniketasthiramatireva sa bhikshuh sauvarnadinam naiva parigrahenna lokam navalokam
    na ca''badhakam ka iti cedbadhako'styeva | yasmadbhikshurhiranyam rasena drishtam cetsa brahmaha bhavet
    | yasmadbhikshurhiranyam rasena sprishtam cetsa paulkasò bhavedyasmadbhikshurhiranyam rasena grahyam
    cetsa atmaha bhavet | tasmadbhikshurhiranyam rasena na drishtam ca na sprishtam ca na grahyam ca |
    sarve kama manogata vyavartante | duhkhe nodvignah sukhe na spriha tyago rage sarvatra shubhashubhayoranabhisneho
    na dveshti na modam ca | sarveshamindriyanam gatiruparamate ya atmanyevavasthiyate yatpurnanandaikabodhastadbrahmaivahamasmiti
    kritakrityo bhavati kritakrityo bhavati || 4 || om purnamadah purnamidam purnat purnamudacyate | purnasya
    purnamadaya purnamevavashishyate || om shantih shantih shantih || || iti shriparamahamsopanishatsamapta
    || adhikadhyayanaya
  devanagari: उपनिषद् ॐ पूर्णमदः पूर्णमिदं पूर्णात् पूर्णमुदच्यते । पूर्णस्य पूर्णमादाय पूर्णमेवावशिष्यते
    ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ अथ योगिनां परमहंसानां कोऽयं मार्नस्तेषं का स्थितिरिति नारदो भगवन्तमुपगत्योवाच
    । तं भगवानाह । योऽयं परमहंसमार्गो लोके दुर्लभतरो न तु बाहुल्यो यद्येको भवति स एव नित्यपूतस्थः स एव
    वेदपुरुष इति विदुषो मन्यन्ते महापुरुषो यच्चित्तं तत्सर्वदा मय्येवावतिष्ठते तस्मादहं च तस्मिन्नेवावस्थीयते
    । असौ स्वपुत्रमित्रकलत्रबन्ध्वादीञ्छिखायज्ञॊपवीतं स्वाध्यायं च सर्वकर्माणि संन्यस्यायं ब्रह्माण्डं
    च हित्वा कौपीनं दण्डमाच्छादनं च स्वशरीरोपभोगार्थाय च लोकस्योपकारार्थाय च परिग्रहेत् । तच्च न मुख्योऽस्ति
    कोऽयं मुख्य इति चेदयं मुख्यः ॥ १ ॥ न दण्डं न शिखां न यज्ञॊपवीतं न चाच्छादनं चरति परमहंसः । न शितं
    न चोष्णं न सुखं न दुःखं न मानावमाने च षडूर्मिवर्जं निन्दागर्वमत्सरदम्मदर्पेचछाद्वेषसुखदुःखकामकोधलोभमोहहर्षासूयाहङ्कारादींश्च
    हित्वा स्ववपुः कुणपमिव दृश्यते यतस्तद्वपुरपध्वस्तं संशयविपरीतमिथ्याज्ञानानां यो हेतुस्तेन नित्यनिवृत्तस्तन्नित्यबोधस्तत्स्वयमेवावस्थितिस्तं
    शान्तमचलमद्वयानन्दविद्घन एवास्मि । तदेव मम परम्धाम तदेव शिखा च तदेवोपवीत च । परमात्मात्मनोरेकत्वज्ञानेन
    तयोर्भेद एव विभग्नः सा सन्ध्या ॥ २ ॥ सर्वान्कामान्परित्यज्य अद्वैते परमस्थितिः । ज्ञानदण्डो धृतो येन
    एकदण्डी स उच्यते । काष्ठदण्डो धृतो येन सर्वाशी ज्ञानवर्जितः । तितिक्षाज्ञानवैराग्यशमदिगुणवर्जितः ।
    स याति नरकान्धोरान्महारौरवसंज्ञकान् । इदमन्तरं ङ्य़ात्वा स परमहंसः ॥ ३ ॥ आशाम्बरो न नमस्करॊ न स्वाहाकारो
    न स्वाधाकारॊ न निन्दा न स्तुतिर्यादृचछिको भवेद्भिक्षुः । नावाहनं न विसर्जनं न मन्त्रं न ध्यानं नोपासनं
    च । न लक्ष्यं नाकक्ष्यं न पृथग्नापृथगहं न न त्वं न सर्वं चानिकेतस्थिरमतिरेव स भिक्षुः सौवर्णादीनां
    नैव परिग्रहेन्न लोकं नावलोकं न चाऽऽबाधकं क इति चेद्बाधकोऽस्त्येव । यस्माद्भिक्षुर्हिरण्यं रसेन दृष्टं
    चेत्स ब्रह्महा भवेत् । यस्माद्भिक्षुर्हिरण्यं रसेन स्पृष्टं चेत्स पौल्कसॊ भवेद्यस्माद्भिक्षुर्हिरण्यं
    रसेन ग्राह्यं चेत्स आत्महा भवेत् । तस्माद्भिक्षुर्हिरण्यं रसेन न दृष्टं च न स्पृष्टं च न ग्राह्यं
    च । सर्वे कामा मनोगता व्यावर्तन्ते । दुःखे नोद्विग्नः सुखे न स्पृहा त्यागो रागे सर्वत्र शुभाशुभयोरनभिस्नेहो
    न द्वेष्टि न मोदं च । सर्वेषामिन्द्रियाणां गतिरुपरमते य आत्मन्येवावस्थीयते यत्पूर्णानन्दैकबोधस्तद्ब्रह्मैवाहमस्मीति
    कृतकृत्यो भवति कृतकृत्यो भवति ॥ ४ ॥ ॐ पूर्णमदः पूर्णमिदं पूर्णात् पूर्णमुदच्यते । पूर्णस्य पूर्णमादाय
    पूर्णमेवावशिष्यते ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ ॥ इति श्रीपरमहंसोपनिषत्समाप्ता ॥ अधिकाध्ययनाय
