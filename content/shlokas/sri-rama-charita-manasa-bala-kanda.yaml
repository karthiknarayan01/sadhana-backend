    होनिहारा ॥ कह मुनि तात भयु अँधियारा। जोजन सत्तरि नगरु तुम्हारा ॥ दो निसा घोर गम्भीर बन पन्थ न सुनहु
    सुजान। बसहु आजु अस जानि तुम्ह जाएहु होत बिहान ॥ ॥ तुलसी जसि भवतब्यता तैसी मिलि सहाइ। आपुनु आवि ताहि
    पहिं ताहि तहाँ लै जाइ ॥ ॥ भलेहिं नाथ आयसु धरि सीसा। बाँधि तुरग तरु बैठ महीसा ॥ नृप बहु भाति प्रसंसेउ
    ताही। चरन बन्दि निज भाग्य सराही ॥ पुनि बोले मृदु गिरा सुहाई। जानि पिता प्रभु करुँ ढिठाई ॥ मोहि मुनिस
    सुत सेवक जानी। नाथ नाम निज कहहु बखानी ॥ तेहि न जान नृप नृपहि सो जाना। भूप सुह्रद सो कपट सयाना ॥ बैरी
    पुनि छत्री पुनि राजा। छल बल कीन्ह चहि निज काजा ॥ समुझि राजसुख दुखित अराती। अवाँ अनल इव सुलगि छाती
    ॥ सरल बचन नृप के सुनि काना। बयर सँभारि हृदयँ हरषाना ॥ दो कपट बोरि बानी मृदुल बोलेउ जुगुति समेत। नाम
    हमार भिखारि अब निर्धन रहित निकेति ॥ ॥ कह नृप जे बिग्यान निधाना। तुम्ह सारिखे गलित अभिमाना ॥ सदा रहहि
    अपनपौ दुराएँ। सब बिधि कुसल कुबेष बनाएँ ॥ तेहि तें कहहि सन्त श्रुति टेरें। परम अकिञ्चन प्रिय हरि केरेम्
    ॥ तुम्ह सम अधन भिखारि अगेहा। होत बिरञ्चि सिवहि सन्देहा ॥ जोसि सोसि तव चरन नमामी। मो पर कृपा करिअ अब
    स्वामी ॥ सहज प्रीति भूपति कै देखी। आपु बिषय बिस्वास बिसेषी ॥ सब प्रकार राजहि अपनाई। बोलेउ अधिक सनेह
    जनाई ॥ सुनु सतिभाउ कहुँ महिपाला। इहाँ बसत बीते बहु काला ॥ दो अब लगि मोहि न मिलेउ कौ मैं न जनावुँ काहु।
    लोकमान्यता अनल सम कर तप कानन दाहु ॥ तुलसी देखि सुबेषु भूलहिं मूढ़ न चतुर नर। सुन्दर केकिहि पेखु बचन
    सुधा सम असन अहि ॥ तातें गुपुत रहुँ जग माहीं। हरि तजि किमपि प्रयोजन नाहीम् ॥ प्रभु जानत सब बिनहिं जनाएँ।
    कहहु कवनि सिधि लोक रिझाएँ ॥ तुम्ह सुचि सुमति परम प्रिय मोरें। प्रीति प्रतीति मोहि पर तोरेम् ॥ अब जौं
    तात दुरावुँ तोही। दारुन दोष घटि अति मोही ॥ जिमि जिमि तापसु कथि उदासा। तिमि तिमि नृपहि उपज बिस्वासा
    ॥ देखा स्वबस कर्म मन बानी। तब बोला तापस बगध्यानी ॥ नाम हमार एकतनु भाई। सुनि नृप बोले पुनि सिरु नाई
    ॥ कहहु नाम कर अरथ बखानी। मोहि सेवक अति आपन जानी ॥ दो आदिसृष्टि उपजी जबहिं तब उतपति भै मोरि। नाम एकतनु
    हेतु तेहि देह न धरी बहोरि ॥ ॥ जनि आचरुज करहु मन माहीं। सुत तप तें दुर्लभ कछु नाहीम् ॥ तपबल तें जग
    सृजि बिधाता। तपबल बिष्नु भे परित्राता ॥ तपबल सम्भु करहिं सङ्घारा। तप तें अगम न कछु संसारा ॥ भयु नृपहि
    सुनि अति अनुरागा। कथा पुरातन कहै सो लागा ॥ करम धरम इतिहास अनेका। करि निरूपन बिरति बिबेका ॥ उदभव पालन
    प्रलय कहानी। कहेसि अमित आचरज बखानी ॥ सुनि महिप तापस बस भयू। आपन नाम कहत तब लयू ॥ कह तापस नृप जानुँ
    तोही। कीन्हेहु कपट लाग भल मोही ॥ सो सुनु महीस असि नीति जहँ तहँ नाम न कहहिं नृप। मोहि तोहि पर अति प्रीति
    सोइ चतुरता बिचारि तव ॥ ॥ नाम तुम्हार प्रताप दिनेसा। सत्यकेतु तव पिता नरेसा ॥ गुर प्रसाद सब जानिअ राजा।
    कहिअ न आपन जानि अकाजा ॥ देखि तात तव सहज सुधाई। प्रीति प्रतीति नीति निपुनाई ॥ उपजि परि ममता मन मोरें।
    कहुँ कथा निज पूछे तोरेम् ॥ अब प्रसन्न मैं संसय नाहीं। मागु जो भूप भाव मन माहीम् ॥ सुनि सुबचन भूपति
    हरषाना। गहि पद बिनय कीन्हि बिधि नाना ॥ कृपासिन्धु मुनि दरसन तोरें। चारि पदारथ करतल मोरेम् ॥ प्रभुहि
    तथापि प्रसन्न बिलोकी। मागि अगम बर हौँ असोकी ॥ दो जरा मरन दुख रहित तनु समर जितै जनि कौ। एकछत्र रिपुहीन
    महि राज कलप सत हौ ॥ ॥ कह तापस नृप ऐसेइ होऊ। कारन एक कठिन सुनु सोऊ ॥ कालु तुअ पद नाइहि सीसा। एक बिप्रकुल
    छाड़इ महीसा ॥ तपबल बिप्र सदा बरिआरा। तिन्ह के कोप न कौ रखवारा ॥ जौं बिप्रन्ह सब करहु नरेसा। तौ तुअ
    बस बिधि बिष्नु महेसा ॥ चल न ब्रह्मकुल सन बरिआई। सत्य कहुँ दौ भुजा उठाई ॥ बिप्र श्राप बिनु सुनु महिपाला।
    तोर नास नहि कवनेहुँ काला ॥ हरषेउ राउ बचन सुनि तासू। नाथ न होइ मोर अब नासू ॥ तव प्रसाद प्रभु कृपानिधाना।
    मो कहुँ सर्ब काल कल्याना ॥ दो एवमस्तु कहि कपटमुनि बोला कुटिल बहोरि। मिलब हमार भुलाब निज कहहु त हमहि
    न खोरि ॥ ॥ तातें मै तोहि बरजुँ राजा। कहें कथा तव परम अकाजा ॥ छठें श्रवन यह परत कहानी। नास तुम्हार
    सत्य मम बानी ॥ यह प्रगटें अथवा द्विजश्रापा। नास तोर सुनु भानुप्रतापा ॥ आन उपायँ निधन तव नाहीं। जौं
    हरि हर कोपहिं मन माहीम् ॥ सत्य नाथ पद गहि नृप भाषा। द्विज गुर कोप कहहु को राखा ॥ राखि गुर जौं कोप
    बिधाता। गुर बिरोध नहिं कौ जग त्राता ॥ जौं न चलब हम कहे तुम्हारें। हौ नास नहिं सोच हमारेम् ॥ एकहिं
    डर डरपत मन मोरा। प्रभु महिदेव श्राप अति घोरा ॥ दो होहिं बिप्र बस कवन बिधि कहहु कृपा करि सौ। तुम्ह
    तजि दीनदयाल निज हितू न देखुँ कौँ ॥ ॥ सुनु नृप बिबिध जतन जग माहीं। कष्टसाध्य पुनि होहिं कि नाहीम् ॥
    अहि एक अति सुगम उपाई। तहाँ परन्तु एक कठिनाई ॥ मम आधीन जुगुति नृप सोई। मोर जाब तव नगर न होई ॥ आजु लगें
    अरु जब तें भयूँ। काहू के गृह ग्राम न गयूँ ॥ जौं न जाउँ तव होइ अकाजू। बना आइ असमञ्जस आजू ॥ सुनि महीस
    बोलेउ मृदु बानी। नाथ निगम असि नीति बखानी ॥ बड़ए सनेह लघुन्ह पर करहीं। गिरि निज सिरनि सदा तृन धरहीम्
    ॥ जलधि अगाध मौलि बह फेनू। सन्तत धरनि धरत सिर रेनू ॥ दो अस कहि गहे नरेस पद स्वामी होहु कृपाल। मोहि
    लागि दुख सहिअ प्रभु सज्जन दीनदयाल ॥ ॥ जानि नृपहि आपन आधीना। बोला तापस कपट प्रबीना ॥ सत्य कहुँ भूपति
    सुनु तोही। जग नाहिन दुर्लभ कछु मोही ॥ अवसि काज मैं करिहुँ तोरा। मन तन बचन भगत तैं मोरा ॥ जोग जुगुति
    तप मन्त्र प्रभ् । फलि तबहिं जब करिअ दुर् ॥ जौं नरेस मैं करौं रसोई। तुम्ह परुसहु मोहि जान न कोई ॥ अन्न
    सो जोइ जोइ भोजन करी। सोइ सोइ तव आयसु अनुसरी ॥ पुनि तिन्ह के गृह जेवँइ जोऊ। तव बस होइ भूप सुनु सोऊ
    ॥ जाइ उपाय रचहु नृप एहू। सम्बत भरि सङ्कलप करेहू ॥ दो नित नूतन द्विज सहस सत बरेहु सहित परिवार। मैं
    तुम्हरे सङ्कलप लगि दिनहिं ॥ एहि बिधि भूप कष्ट अति थोरें। होइहहिं सकल बिप्र बस तोरेम् ॥ करिहहिं बिप्र
    होम मख सेवा। तेहिं प्रसङ्ग सहजेहिं बस देवा ॥ और एक तोहि कहूँ लख् । मैं एहि बेष न आउब क् ॥ तुम्हरे
    उपरोहित कहुँ राया। हरि आनब मैं करि निज माया ॥ तपबल तेहि करि आपु समाना। रखिहुँ इहाँ बरष परवाना ॥ मैं
