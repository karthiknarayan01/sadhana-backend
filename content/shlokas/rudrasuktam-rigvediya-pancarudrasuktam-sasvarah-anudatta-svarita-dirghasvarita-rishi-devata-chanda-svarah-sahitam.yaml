id: rudrasuktam-rigvediya-pancarudrasuktam-sasvarah-anudatta-svarita-dirghasvarita-rishi-devata-chanda-svarah-sahitam
category: sukta
name:
  english: rudrasuktam rigvediya pancarudrasuktam (sasvarah anudatta, svarita, dirghasvarita, rishi-devata-chanda-svarah
    sahitam)
  devanagari: रुद्रसूक्तम् ऋग्वेदीय पञ्चरुद्रसूक्तम् (सस्वरः अनुदात्त, स्वरित, दीर्घस्वरित, ऋषि-देवता-छन्द-स्वरः
    सहितम्)
content:
  english: 6|| ma no mahantamuta ma no arbhakam ma na ukshantamuta ma na ukshitam | ma no vadhih pitaram
    mota mataram ma nah priyastanvo rudra ririshah || 1
  devanagari: ६॥ मा नो महान्तमुत मा नो अर्भकं मा न उक्षन्तमुत मा न उक्षितम् । मा नो वधीः पितरं मोत मातरं
    मा नः प्रियास्तन्वो रुद्र रीरिषः ॥ १
meaning: {}
