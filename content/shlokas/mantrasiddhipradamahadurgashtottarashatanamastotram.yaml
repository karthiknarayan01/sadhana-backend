id: mantrasiddhipradamahadurgashtottarashatanamastotram
category: mantra
name:
  english: mantrasiddhipradamahadurgashtottarashatanamastotram
  devanagari: मन्त्रसिद्धिप्रदमहादुर्गाष्टोत्तरशतनामस्तोत्रम्
content:
  english: mantrasiddhipradamahadurgashatanamastotram om durga bhavani deveshi vishvanathapriya shiva
    | ghoradamshtrakaralasya mundamalavibhushita || 1|| rudrani tarini tara maheshi bhavavallabha | narayani
    jagaddhatri mahadevapriya jaya || 2|| vijaya ca jayaradhya sharvani haravallabha | asita canimadevi
    laghima garima tatha || 3|| maheshashaktirvishveshi gauri parvatanandini | nitya ca nishkalanka ca
    niriha nityanutana || 4|| rakta raktamukhi vani vastuyuktasamaprabha | yashoda radhika candi draupadi
    rukmini tatha || 5|| guhapriya guharata guhavamshavilasini | ganeshajanani mata vishvarupa ca jahnavi
    || 6|| ganga kali ca kashi ca bhairavi bhuvaneshvari | nirmala ca sugandha ca devaki devapujita ||
    7|| dakshaja dakshina daksha dakshayajnavinashini | sushila sundari saumya matangi kamalatmika ||
    8|| nishumbhanashini shumbhanashini candanashini | dhumralocanasamhari mahishasuramardini || 9|| uma
    gauri karala ca kamini vishvamohini | jagadishapriya janmanashini bhavanashini || 10|| ghoravaktra
    lalajjihva attahasa digambara | bharati svaragata devi bhogada mokshadayini || 11|| ityevam shatanamani
    kathitani varanane | namasmaranamatrena jivanmukto na samshayah | pathitva shatanamani mantrasiddhim
    labhet dhrivam || 12|| iti mantrasiddhipradamahadurgashatanamastotram sampurnam | mundamalatantrantargatam
    caturthe patale shlokah 10
  devanagari: मन्त्रसिद्धिप्रदमहादुर्गाशतनामस्तोत्रम् ॐ दुर्गा भवानी देवेशी विश्वनाथप्रिया शिवा । घोरदंष्ट्राकरालास्या
    मुण्डमालाविभूषिता ॥ १॥ रुद्राणी तारिणी तारा माहेशी भववल्लभा । नारायणी जगद्धात्री महादेवप्रिया जया
    ॥ २॥ विजया च जयाराध्या शर्वाणी हरवल्लभा । असिता चाणिमादेवी लघिमा गरिमा तथा ॥ ३॥ महेशशक्तिर्विश्वेशी
    गौरी पर्वतनन्दिनी । नित्या च निष्कलङ्का च निरीहा नित्यनूतना ॥ ४॥ रक्ता रक्तमुखी वाणी वस्तुयुक्तासमप्रभा
    । यशोदा राधिका चण्डी द्रौपदी रुक्मिणी तथा ॥ ५॥ गुहप्रिया गुहरता गुहवंशविलासिनी । गणेशजननी माता विश्वरूपा
    च जाह्नवी ॥ ६॥ गङ्गा काली च काशी च भैरवी भुवनेश्वरी । निर्मला च सुगन्धा च देवकी देवपूजिता ॥ ७॥ दक्षजा
    दक्षिणा दक्षा दक्षयज्ञविनाशिनी । सुशीला सुन्दरी सौम्या मातङ्गी कमलात्मिका ॥ ८॥ निशुम्भनाशिनी शुम्भनाशिनी
    चण्डनाशिनी । धूम्रलोचनसंहारी महिषासुरमर्दिनी ॥ ९॥ उमा गौरी कराला च कामिनी विश्वमोहिनी । जगदीशप्रिया
    जन्मनाशिनी भवनाशिनी ॥ १०॥ घोरवक्त्रा ललज्जिह्वा अट्टहासा दिगम्बरा । भारती स्वरगता देवी भोगदा मोक्षदायिनी
    ॥ ११॥ इत्येवं शतनामानि कथितानि वरानने । नामस्मरणमात्रेण जीवन्मुक्तो न संशयः । पठित्वा शतनामानि मन्त्रसिद्धिं
    लभेत् धृवम् ॥ १२॥ इति मन्त्रसिद्धिप्रदमहादुर्गाशतनामस्तोत्रं सम्पूर्णम् । मुण्डमालातन्त्रान्तर्गतम्
    चतुर्थे पटले श्लोकाः १०
