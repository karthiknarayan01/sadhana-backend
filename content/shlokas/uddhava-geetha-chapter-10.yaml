id: uddhava-geetha-chapter-10
category: stotram
name:
  english: Uddhava Geetha - Chapter 10
content:
  english: atha dashamo'dhyayah | shribhagavan uvaca | maya uditeshu avahitah svadharmeshu madashrayah
    | varnashramakula acaram akamatma samacaret || || anviksheta vishuddhatma dehinam vishayatmanam |
    guneshu tattvadhyanena sarvarambhaviparyayam || || suptasya vishayalokah dhyayatah va manorathah |
    nanamakatvat viphalah tatha bhedatmadih gunaih || || nivrittam karma seveta pravrittam matparah tyajet
    | jijnasayam sampravrittah na adriyet karma codanam || || yamanabhikshnam seveta niyaman matparah
    kvacit | madabhijnam guram shantam upasita madatmakam || || amanyamatsarah dakshah nirmamah dridhasauhridah
    | asatvarah arthajijnasuh anasuyauh amoghavak || || jayapatyagrihakshetrasvajanadravina adishu | udasinah
    samam pashyan sarveshu artham iva atmanah || || vilakshanah sthulasukshmat dehat atmekshita svadrik
    | yathagnih darunah dahyat dahakah anyah prakashakah || || nirodha utpatti anu brihan nanatvam tatkritan
    gunan | antah pravishtah adhattah evam dehagunan parah || || yah asau gunaih viracitah dehah ayam
    purushasya hi | samsarah tat nibandhah ayam pumsah vidyat chidatmanah || || tasmat jijnasaya atmanam
    atmastham param | sangamya niraset etat vastubuddhim yathakramam || || acaryah aranih adyah syat antevasi
    uttara aranih | tat sandhanam pravacanam vidya sandhih sukhavahah || || vaisharadi sa ativishuddhabuddhih
    dhunoti mayam gunasamprasutam | gunan ca sandahya yat atmam etat svayam ca shamyati asamid yatha agnih
    || || atha esham karmakartrinam bhoktrinam sukhaduhkhayoh | nanatvam atha nityatvam lokakalagama atmanam
    || || manyase sarvabhavanam samstha hi autpattiki yatha | tat tat akritibhedena jayate bhidyate ca
    dhih || || evam api anga sarvesham dehinam dehayogatah | kala avayavatah santi bhava janmadayoh asakrit
    || || atra api karmanam kartuh asvatantryam ca lakshyate | bhoktuh ca duhkhasukhayoh kah anvarthah
    vivasham bhajet || || na dehinam sukham kincit vidyate vidusham api | tatha ca duhkham mudhanam vritha
    ahankaranam param || || yadi praptim vighatam ca jananti sukhaduhkhayoh | te api addha na viduh yogam
    mrityuh na prabhavet yatha || || kah anvarthah sukhayati enam kamah va mrityuh antike | aghatam niyamanasya
    vadhyasi eva na tushtidah || || shrutam ca drishtavat dushtam spardha asuya atyayavyayaih | bahu antaraya
    kamatvat krishivat ca api nishphalam || || antarayaih avihatah yadi dharmah svanushthitah | tenapi
    nirjitam sthanam yatha gacchati tat shrunu || || ishtva iha devatah yajnaih svarlokam yati yajnikah
    | bhunjita devavat tatra bhogan divyan nija arjitan || || svapunya upacite shubhre vimanah upagiyate
    | gandharvaih viharanmadhye devinam hridyaveshadhrik || || stribhih kamagayanena kinkinijalamalina
    | kridan na veda atmapatam surakrideshu nirvritah || || tavat pramodate svarge yavat punyam samapyate
    | kshinapunyah patati arvak anicchan kalacalitah || || yadi adharmaratah sangat asatam va ajitendriyah
    | kamatma kripanah lubdhah strainah bhutavihimsakah || || pashun avidhina alabhya pretabhutaganan
    yajan | narakan avashah jantuh gatva yati ulbanam tamah || || karmani duhkha udarkani kurvan dehena
    taih punah | deham abhajate tatra kim sukham martyadharminah || || lokanam loka palanam madbhayam
    kalpajivinam | brahmanah api bhayam mattah dviparadhapara ayushah || || gunah srijanti karmani gunah
    anusrijate gunan | jivah tu gunasamyuktah bhunkte karmaphalani asau || || yavat syat gunavaishamyam
    tavat nanatvam atmanah | nanatvam atmanah yavat paratantryam tada eva hi || || yavat asya asvatantratvam
    tavat ishvaratah bhayam | yah etat samupasiran te muhyanti shucarpitah || || kalah atma agamah lokah
    svabhavah dharmah eva ca | iti mam bahudha prahuh gunavyatikare sati || || uddhavah uvaca | guneshu
    vartamanah api dehajeshu anapavritah | gunaih na badhyate dehi badhyate va katham vibho || || katham
    varteta viharet kaih va jnayeta lakshanaih | kim bhunjita uta visrijet shayita asita yati va || ||
    etat acyuta me bruhi prashnam prashnavidam vara | nityamuktah nityabaddhah ekah eva iti me bhramah
    || || iti shrimadbhagavate mahapurane paramahamsyam samhitayamekadashaskandhe bhagavaduddhavasamvade
    dashamo'dhyayah ||
  devanagari: अथ दशमोऽध्यायः । श्रीभगवान् उवाच । मया उदितेषु अवहितः स्वधर्मेषु मदाश्रयः । वर्णाश्रमकुल
    आचारं अकामात्मा समाचरेत् ॥ ॥ अन्वीक्षेत विशुद्धात्मा देहिनां विषयात्मनाम् । गुणेषु तत्त्वध्यानेन सर्वारम्भविपर्ययम्
    ॥ ॥ सुप्तस्य विषयालोकः ध्यायतः वा मनोरथः । नानामकत्वात् विफलः तथा भेदात्मदीः गुणैः ॥ ॥ निवृत्तं कर्म
    सेवेत प्रवृत्तं मत्परः त्यजेत् । जिज्ञासायां सम्प्रवृत्तः न अद्रियेत् कर्म चोदनाम् ॥ ॥ यमानभीक्ष्णं
    सेवेत नियमान् मत्परः क्वचित् । मदभिज्ञं गुरं शान्तं उपासीत मदात्मकम् ॥ ॥ अमान्यमत्सरः दक्षः निर्ममः
    दृढसौहृदः । असत्वरः अर्थजिज्ञासुः अनसूयौः अमोघवाक् ॥ ॥ जायापत्यगृहक्षेत्रस्वजनद्रविण आदिषु । उदासीनः
    समं पश्यन् सर्वेषु अर्थं इव आत्मनः ॥ ॥ विलक्षणः स्थूलसूक्ष्मात् देहात् आत्मेक्षिता स्वदृक् । यथाग्निः
    दारुणः दाह्यात् दाहकः अन्यः प्रकाशकः ॥ ॥ निरोध उत्पत्ति अणु बृहन् नानात्वं तत्कृतान् गुणान् । अन्तः
    प्रविष्टः आधत्तः एवं देहगुणान् परः ॥ ॥ यः असौ गुणैः विरचितः देहः अयं पुरुषस्य हि । संसारः तत् निबन्धः
    अयं पुंसः विद्यात् छिदात्मनः ॥ ॥ तस्मात् जिज्ञासया आत्मानं आत्मस्थं परम् । सङ्गम्य निरसेत् एतत् वस्तुबुद्धिं
    यथाक्रमम् ॥ ॥ आचार्यः अरणिः आद्यः स्यात् अन्तेवासि उत्तर अरणिः । तत् सन्धानं प्रवचनं विद्या सन्धिः
    सुखावहः ॥ ॥ वैशारदी सा अतिविशुद्धबुद्धिः धुनोति मायां गुणसम्प्रसूताम् । गुणान् च सन्दह्य यत् आत्मं
    एतत् स्वयं च शाम्यति असमिद् यथा अग्निः ॥ ॥ अथ एषां कर्मकर्तॄणां भोक्तॄणां सुखदुःखयोः । नानात्वं अथ
    नित्यत्वं लोककालागम आत्मनाम् ॥ ॥ मन्यसे सर्वभावानां संस्था हि औत्पत्तिकी यथा । तत् तत् आकृतिभेदेन
    जायते भिद्यते च धीः ॥ ॥ एवं अपि अङ्ग सर्वेषां देहिनां देहयोगतः । काल अवयवतः सन्ति भावा जन्मादयोः असकृत्
    ॥ ॥ अत्र अपि कर्मणां कर्तुः अस्वातन्त्र्यं च लक्ष्यते । भोक्तुः च दुःखसुखयोः कः अन्वर्थः विवशं भजेत्
    ॥ ॥ न देहिनां सुखं किञ्चित् विद्यते विदुषां अपि । तथा च दुःखं मूढानां वृथा अहङ्करणं परम् ॥ ॥ यदि प्राप्तिं
    विघातं च जानन्ति सुखदुःखयोः । ते अपि अद्धा न विदुः योगं मृत्युः न प्रभवेत् यथा ॥ ॥ कः अन्वर्थः सुखयति
    एनं कामः वा मृत्युः अन्तिके । आघातं नीयमानस्य वध्यसि एव न तुष्टिदः ॥ ॥ श्रुतं च दृष्टवत् दुष्टं स्पर्धा
    असूया अत्ययव्ययैः । बहु अन्तराय कामत्वात् कृषिवत् च अपि निष्फलम् ॥ ॥ अन्तरायैः अविहतः यदि धर्मः स्वनुष्ठितः
    । तेनापि निर्जितं स्थानं यथा गच्छति तत् श्रुणु ॥ ॥ इष्त्वा इह देवताः यज्ञैः स्वर्लोकं याति याज्ञिकः
    । भुञ्जीत देववत् तत्र भोगान् दिव्यान् निज अर्जितान् ॥ ॥ स्वपुण्य उपचिते शुभ्रे विमानः उपगीयते । गन्धर्वैः
    विहरन्मध्ये देवीनां हृद्यवेषधृक् ॥ ॥ स्त्रीभिः कामगयानेन किङ्किणीजालमालिना । क्रीडन् न वेद आत्मपातं
    सुराक्रीडेषु निर्वृतः ॥ ॥ तावत् प्रमोदते स्वर्गे यावत् पुण्यं समाप्यते । क्षीणपुण्यः पतति अर्वाक्
    अनिच्छन् कालचालितः ॥ ॥ यदि अधर्मरतः सङ्गात् असतां वा अजितेन्द्रियः । कामात्मा कृपणः लुब्धः स्त्रैणः
    भूतविहिंसकः ॥ ॥ पशून् अविधिना आलभ्य प्रेतभूतगणान् यजन् । नरकान् अवशः जन्तुः गत्वा याति उल्बणं तमः
    ॥ ॥ कर्माणि दुःख उदर्काणि कुर्वन् देहेन तैः पुनः । देहं आभजते तत्र किं सुखं मर्त्यधर्मिणः ॥ ॥ लोकानां
    लोक पालानां मद्भयं कल्पजीविनाम् । ब्रह्मणः अपि भयं मत्तः द्विपराधपर आयुषः ॥ ॥ गुणाः सृजन्ति कर्माणि
    गुणः अनुसृजते गुणान् । जीवः तु गुणसंयुक्तः भुङ्क्ते कर्मफलानि असौ ॥ ॥ यावत् स्यात् गुणवैषम्यं तावत्
    नानात्वं आत्मनः । नानात्वं आत्मनः यावत् पारतन्त्र्यं तदा एव हि ॥ ॥ यावत् अस्य अस्वतन्त्रत्वं तावत्
    ईश्वरतः भयम् । यः एतत् समुपासीरन् ते मुह्यन्ति शुचार्पिताः ॥ ॥ कालः आत्मा आगमः लोकः स्वभावः धर्मः
    एव च । इति मां बहुधा प्राहुः गुणव्यतिकरे सति ॥ ॥ उद्धवः उवाच । गुणेषु वर्तमानः अपि देहजेषु अनपावृताः
    । गुणैः न बध्यते देही बध्यते वा कथं विभो ॥ ॥ कथं वर्तेत विहरेत् कैः वा ज्ञायेत लक्षणैः । किं भुञ्जीत
    उत विसृजेत् शयीत आसीत याति वा ॥ ॥ एतत् अच्युत मे ब्रूहि प्रश्नं प्रश्नविदां वर । नित्यमुक्तः नित्यबद्धः
    एकः एव इति मे भ्रमः ॥ ॥ इति श्रीमद्भागवते महापुराणे पारमहंस्यां संहितायामेकादशस्कन्धे भगवदुद्धवसंवादे
    दशमोऽध्यायः ॥
