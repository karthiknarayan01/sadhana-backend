id: kausalyanandanastotram
category: stotram
name:
  english: kausalyanandanastotram
  devanagari: कौसल्यानन्दनस्तोत्रम्
content:
  english: vicitrakausheya'mbarashobhitamishvaram | avyayamakhilatmanam bhaje'ham raghavam priyam || 21||
    vanyaphala'shana'bhyastam mandakinya mahatate | sitaya shobhitam ramam lakshmanasamyutam bhaje ||
    22|| nila'runotpala''channe bhramaravaligunjite | sarastate samasinam ramam rajnam smarami tam ||
    23|| kausalyanandanam ramamayodhyadhamni pujitam | bhavaye vividhairbhaktairbhaktamanorathapradam
    || 24|| sugrivarajyadataram samastajagadashrayam asimakarunashilam namami raghavam muda || 25|| vrindamalyadharam
    ramam kalpavrikshamabhishtadam | tanca pradayakam naumi purusharthacatushtayam || 26|| kusumavatikamadhye
    pushpartham pathi raghavam | viharantam mahodaram lakshmanena samam bhaje || 27|| kridantam sarayutire
    bhratribhih saha pavane | hasantam hasayantanca ramacandram vibhavaye || 28|| raghavam parame ramye
    prasade hemanirmite | simhasanasamasinam bhajami saha sitaya || 29|| ashvasinam maharanye sviyaparikaraih
    saha | shribharatapriyam ramam pranamami tamishvaram || 30|| darshaniyam mahagamyam sakete dhamni
    shobhitam | amandanandasandoham shriramam madhuram bhaje || 31|| kausalyanandanastotram bhukti
  devanagari: विचित्रकौशेयाऽम्बरशोभितमीश्वरम् । अव्ययमखिलात्मानं भजेऽहं राघवं प्रियम् ॥ २१॥ वन्यफलाऽशनाऽभ्यस्तं
    मन्दाकिन्या महातटे । सीतया शोभितं रामं लक्ष्मणसंयुतं भजे ॥ २२॥ नीलाऽरुणोत्पलाऽऽछन्ने भ्रमरावलिगुञ्जिते
    । सरस्तटे समासीनं रामं राज्ञं स्मरामि तम् ॥ २३॥ कौसल्यानन्दनं राममयोध्याधाम्नि पूजितम् । भावये विविधैर्भक्तैर्भक्तमनोरथप्रदम्
    ॥ २४॥ सुग्रीवराज्यदातारं समस्तजगदाश्रयं असीमकरुणाशीलं नमामि राघवं मुदा ॥ २५॥ वृन्दामाल्यधरं रामं कल्पवृक्षमभीष्टदम्
    । तञ्च प्रदायकं नौमि पुरुषार्थचतुष्टयम् ॥ २६॥ कुसुमवाटिकामध्ये पुष्पार्थं पथि राघवम् । विहरन्तं महोदरं
    लक्ष्मणेन समं भजे ॥ २७॥ क्रीडन्तं सरयूतीरे भ्रातृभिः सह पावने । हसन्तं हासयन्तञ्च रामचन्द्रं विभावये
    ॥ २८॥ राघवं परमे रम्ये प्रासादे हेमनिर्मिते । सिंहासनसमासीनं भजामि सह सीतया ॥ २९॥ अश्वासीनं महारण्ये
    स्वीयपरिकरैः सह । श्रीभरतप्रियं रामं प्रणमामि तमीश्वरम् ॥ ३०॥ दर्शनीयं महागम्यं साकेते धाम्नि शोभितम्
    । अमन्दानन्दसन्दोहं श्रीरामं मधुरं भजे ॥ ३१॥ कौसल्यानन्दनस्तोत्रं भुक्ति
