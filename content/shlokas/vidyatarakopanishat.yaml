id: vidyatarakopanishat
category: upanishad
name:
  english: vidyatarakopanishat
  devanagari: विद्यातारकोपनिषत्
content:
  english: iti shantih || prathamah padah | athainamagastyah papraccha hayagrivam kim tarakam kim tarati
    | sa hovaca hayagrivah | taradirghanulambipurvakam prathamam khandam tato dvitiyam khandam tatastritiyam
    khandam tatashcaturtham khandam brahmatmasaccidanandatmakamantramityupasitavyam | akarah prathamakutaksharo
    bhavati | ukaro dvitiyakutaksharo bhavati | makarastritiyakutaksharo bhavati | ardhamatrika caturthakutaksharo
    bhavati | binduh pancamakutaksharo bhavati | nadah shashthakutaksharo bhavati | tarakatvattarako bhavati
    | tadeva mantratarakam bhavati | tadeva mantratarakabrahma tvam viddhi | tadevopasitavyam | garbhajanmamaranasamsaramahadbhayattam
    tarayati | tarakamityetattarakam brahmano nityam mahiyate | sa papmanam tarati | sa mrityum tarati
    | sa brahmahatyam tarati | sa bhrunahatyam tarati | sa virahatyam tarati | sa sarvam tarati | sa samsaram
    tarati | so'vimuktamashrito bhavati || akaraksharasambhuta vagbhava vishvabhavita | ukaraksharasambhuta
    tejasah kamarajaka || prajno makarasambhuta tartiya ca tritiyaka | ardhamatra shodashi ca brahmanandaikavigraha
    || tasyah sannidhyavashato jagadarandadayini | utpattisthitisamharakarini sarvadehinam || trikuta
    bhavati jneya mulaprakritisangata | prakritih pranavatvacca sa trikutatrayatmika || evam yaccanyat
    trikalatitam | catushkutatmikaiva sarvakutatmika brahmamayi | turyatmabrahma so'yamatma catushpajjagatah
    sthanam na bahihprajnam nobhayatahprajnam saptanga ekonavimshatimukhah | sthulabhugvaishvanaratmikam
    kamapithalayam mitreshanathatmikam jagraddashadhishthayinimicchashaktyatmikam kameshvarim prathamakutam
    manyante || iti prathamah padah | dvitiyah padah | svapnasthane'nantah samjnasaptanga ekonavimshatimukhah
    pravibhakto'bhut | taijasatmikam jalandharapithalayam shashthishanathatmikam vajreshvarim vishnvatmikam
    kriyarupam svapnavasthanasthitirupamicchashaktisvarupinim dvitiyakutam manyante || iti dvitiyah padah
    | tritiyah padah | yatra supto na kancana kamam kamayate tatsushuptam | pashyanti yat sushuptisthana
    ekibhutaprajnanaghana evanande'bhut | icchashaktirupam svapnavasthanasushuptidashadhishthayinim sanandakalam
    tritiyakutam manyante || iti tritiyah padah | caturthah padah | esha sarveshvaryesha sarvottamaishantaryamyesha
    yonih sarvesham prabhavapyayau hi bhutanam | nobhayatahprajna prajnanaghanam na prajnam naprajnamadrishtamavyavaharyamagrahyamalakshanamacintyamavyapadeshyamekatma
  devanagari: इति शान्तिः ॥ प्रथमः पादः । अथैनमगस्त्यः पप्रच्छ हयग्रीवं किं तारकं किं तरति । स होवाच हयग्रीवः
    । तारदीर्घानुलम्बिपूर्वकं प्रथमं खण्डं ततो द्वितीयं खण्डं ततस्तृतीयं खण्डं ततश्चतुर्थं खण्डं ब्रह्मात्मसच्चिदानन्दात्मकमन्त्रमित्युपासितव्यम्
    । अकारः प्रथमकूटाक्षरो भवति । उकारो द्वितीयकूटाक्षरो भवति । मकारस्तृतीयकूटाक्षरो भवति । अर्धमातृका
    चतुर्थकूटाक्षरो भवति । बिन्दुः पञ्चमकूटाक्षरो भवति । नादः षष्ठकूटाक्षरो भवति । तारकत्वात्तारको भवति
    । तदेव मन्त्रतारकं भवति । तदेव मन्त्रतारकब्रह्म त्वं विद्धि । तदेवोपासितव्यम् । गर्भजन्ममरणसंसारमहद्भयात्तं
    तारयति । तारकमित्येतत्तारकं ब्राह्मणो नित्यं महीयते । स पाप्मानं तरति । स मृत्युं तरति । स ब्रह्महत्यां
    तरति । स भ्रूणहत्यां तरति । स वीरहत्यां तरति । स सर्वं तरति । स संसारं तरति । सोऽविमुक्तमाश्रितो भवति
    ॥ अकाराक्षरसम्भूता वाग्भवा विश्वभाविता । उकाराक्षरसम्भूता तेजसः कामराजका ॥ प्राज्ञो मकारसम्भूता तार्तीया
    च तृतीयका । अर्धमात्रा षोडशी च ब्रह्मानन्दैकविग्रहा ॥ तस्याः सान्निध्यवशतो जगदारन्ददायिनी । उत्पत्तिस्थितिसंहारकारिणी
    सर्वदेहिनाम् ॥ त्रिकूटा भवति ज्ञेया मूलप्रकृतिसङ्गता । प्रकृतिः प्रणवत्वाच्च सा त्रिकूटत्रयात्मिका
    ॥ एवं यच्चान्यत् त्रिकालातीतम् । चतुष्कूटात्मिकैव सर्वकूटात्मिका ब्रह्ममयी । तुर्यात्मब्रह्मा सोऽयमात्मा
    चतुष्पाज्जगतः स्थानं न बहिःप्रज्ञं नोभयतःप्रज्ञं सप्ताङ्ग एकोनविंशतिमुखः । स्थूलभुग्वैश्वानरात्मिकां
    कामपीठालयां मित्रेशनाथात्मिकां जाग्रद्दशाधिष्ठायिनीमिच्छाशक्त्यात्मिकां कामेश्वरीं प्रथमकूटां मन्यन्ते
    ॥ इति प्रथमः पादः । द्वितीयः पादः । स्वप्नस्थानेऽनन्तः संज्ञासप्ताङ्ग एकोनविंशतिमुखः प्रविभक्तोऽभूत्
    । तैजसात्मिकां जालन्धरपीठालयां षष्ठीशनाथात्मिकां वज्रेश्वरीं विष्ण्वात्मिकां क्रियारूपां स्वप्नावस्थानस्थितिरूपामिच्छाशक्तिस्वरूपिणीं
    द्वितीयकूटां मन्यन्ते ॥ इति द्वितीयः पादः । तृतीयः पादः । यत्र सुप्तो न कञ्चन कामं कामयते तत्सुषुप्तम्
    । पश्यन्ति यत् सुषुप्तिस्थान एकीभूतप्रज्ञानघन एवानन्देऽभूत् । इच्छाशक्तिरूपां स्वप्नावस्थानसुषुप्तिदशाधिष्ठायिनीं
    सानन्दकलां तृतीयकूटां मन्यन्ते ॥ इति तृतीयः पादः । चतुर्थः पादः । एषा सर्वेश्वर्येषा सर्वोत्तमैषान्तर्याम्येषा
    योनिः सर्वेषां प्रभवाप्ययौ हि भूतानाम् । नोभयतःप्रज्ञा प्रज्ञानघनां न प्रज्ञां नाप्रज्ञामदृष्टामव्यवहार्यामग्राह्यामलक्षणामचिन्त्यामव्यपदेश्यामेकात्म
