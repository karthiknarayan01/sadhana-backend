id: taittiriyanamoshadhisuktam-2
category: veda
name:
  english: taittiriyanamoshadhisuktam
  devanagari: तैत्तिरीयाणामोषधिसूक्तम्
content:
  english: si vighna̱tiri̭ta̱ rapa̭shca̱taya̭manah || 4|| a̱shva̱tthe vo̭ ni̱shada̭nam pa̱rnne vo̭ vasa̱tih
    kri̱ta | go̱bhaja̱ it kila̭satha̱ yat sa̱nava̭tha̱ purṷsham || 5|| yada̱ham va̱jaya̭nni̱ma osha̭dhi̱rhasta̭
    ada̱dhe | a̱tma yakhshma̭sya nashyati pu̱ra ji̭va̱gribho̭ yatha || 6|| yadosha̭dhayah sa̱ngaccha̭nte̱
    raja̭na̱h sami̭taviva | vipra̱h sa ṷcyate bhi̱shag ra̭khsho̱hami̭va̱cata̭nah || 7|| nishkri̭ti̱rnnama̭
    vo ma̱ta'tha̭ yu̱ya
  devanagari: सि विघ्न॒तीरि॑त॒ रप॑श्चा॒तय॑मानाः ॥ ४॥ अ॒श्व॒त्थे वो॑ नि॒षद॑नं प॒र्ण्णे वो॑ वस॒तिः कृ॒ता
    । गो॒भाज॒ इत् किला॑सथ॒ यत् स॒नव॑थ॒ पूरु॑षम् ॥ ५॥ यद॒हं वा॒जय॑न्नि॒मा ओष॑धी॒र्हस्त॑ आद॒धे । आ॒त्मा
    यख्ष्म॑स्य नश्यति पु॒रा जी॑व॒गृभो॑ यथा ॥ ६॥ यदोष॑धयः स॒ङ्गच्छ॑न्ते॒ राजा॑नः॒ समि॑ताविव । विप्रः॒ स
    उ॑च्यते भि॒षग् र॑ख्षो॒हामी॑व॒चात॑नः ॥ ७॥ निष्कृ॑ति॒र्न्नाम॑ वो मा॒ताऽथा॑ यू॒य
meaning: {}
