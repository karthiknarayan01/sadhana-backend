id: pandurangastotram-1
category: stotram
name:
  english: pandurangastotram 1
  devanagari: पाण्डुरन्गस्तोत्रम् १
content:
  english: atidurlabha ya muktirjadebhyo'pi diyate sa na tvaya kintu tava yashasa yashoganenetyanvayah
    | 12| atratyamanase vartamano mohah pandurangapuram vadati | hanteti khede | svayotyadhyaharyam |
    tvayi tate sati sarvatra prathitayashasi sati aham te tava vijaye katham tishthami | tvam vijedhye
    ityarthah | 13| radati vidirno bhavati | dravibhavatityarthah | 14| papanam | 15| satrapo devah |
    devaloka ityarthah | 16| lajjanvitah | 17| bhavah samsaro'stvasva tena | samsarinetyarthah | 18| pacanabhina
    padmanabhena vishnuneti yavat | 19| atirasatpremno'tishayena | 20| muktashca yoginashca tan | 21|
    asimamamaryadam | 22| accha nirmalaiva dhistam
  devanagari: अतिदुर्लभा या मुक्तिर्जडेभ्योऽपि दीयते सा न त्वया किन्तु तव यशसा यशोगानेनेत्यन्वयः । १२।
    अत्रत्यमानसे वर्तमानो मोहः पाण्डुरङ्गपुरं वदति । हन्तेति खेदे । स्वयोत्यध्याहार्यम् । त्वयि तते सति
    सर्वत्र प्रथितयशसि सति अहं ते तव विजये कथं तिष्ठामि । त्वां विजेध्ये इत्यर्थः । १३। रदति विदीर्णो
    भवति । द्रवीभवतीत्यर्थः । १४। पापानाम् । १५। सत्रपो देवः । देवलोक इत्यर्थः । १६। लज्जान्वितः । १७।
    भवः संसारोऽस्त्वस्व तेन । संसारिणेत्यर्थः । १८। पचनाभिना पद्मनाभेन विष्णुनेति यावत् । १९। अतिरसात्प्रेम्णोऽतिशयेन
    । २०। मुक्ताश्च योगिनश्च तान् । २१। असीमाममर्यादाम् । २२। अच्छा निर्मलैव धीस्तां
meaning: {}
