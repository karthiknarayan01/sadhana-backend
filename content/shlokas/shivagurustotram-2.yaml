id: shivagurustotram-2
category: stotram
name:
  english: shivagurustotram 2
  devanagari: शिवगुरुस्तोत्रम् २
content:
  english: ahamasmi sada bhami kadacinnahamapriyah | yadevam prasphutam svena tam shivam pranato'smyaham
    || 1|| amadartham na hi preyo madartham sama deva hi | parapremaspadam yaddhi tam shivam pranato'smyaham
    || 2|| parapremaspadatvadva yo'vinashah svabhavatah | anandam brahma catmeti tam shivam pranato'smyaham
    || 3|| jagratsvapnasushuptinam sakshyato yadataddasham | avasthatrayanirmuktam tam shivam pranato'smyaham
    || 4|| yasmatparataram nasti neti neti shrutirjagau | bhasa yasya jagadbhati tam shivam pranato'smyaham
    || 5|| abharupasya vishvasya bhanam bhasam nidhervina | naiva kalpeta bharupam tam shivam pranato'smyaham
    || 6|| cidvivartam shrutirbrute karanam jagato'sya yat | cidrupam brahma catreti tam shivam pranato'smyaham
    || 7|| yasminnabhati sarvam yajjagadgandharvapattanam | cidakasham tamatmanam shrishivam pranato'smyaham
    || 8|| yatashcemani bhutani jayante paramatmanah | sthitva yasmin layam yanti tam shivam pranato'smyaham
    || 9|| jagatah sthitinashabhyam yacca kincinna hiyate | sadrupam brahma catmeti tam shivam pranato'smyaham
    || 10|| mayamegho jaganniram varshatvesha yatha tatha | saccidamshasvarupam tam shrishivam pranato'smyaham
    || 11|| yatkripaleshatah sarva daivi sampatprajayate | brahmabhumadinamanam tam shivam pranato'smyaham
    || 12|| namastvaikyam shrutirvakti yatah svatmaprasiddhaye | so'ham buddhya tamatmanam shrishivam
    pranato'smyaham || 13|| manasa vacasa grahyam caparokshatsvamatrakam | ahamsphurteh param bhantam
    tam shivam pranato'smyaham || 14|| yatra nasannasadrupe nahankaro na samsritih | kevalam citsukham
    yacca tam shivam pranato'smyaham || 15|| salambam hi parityajya niralambam samashrayet | adrityemam
    shruteh paksham tam shivam pranato'smyaham || 16|| parokshataparicchedashabalya'pohyanirmalam | tadasiti
    gira lakshyam tam shivam pranato'smyaham || 17||
  devanagari: अहमस्मि सदा भामि कदाचिन्नाहमप्रियः । यदेवं प्रस्फुटं स्वेन तं शिवं प्रणतोऽस्म्यहम् ॥ १॥
    अमदर्थं न हि प्रेयो मदर्थं सम देव हि । परप्रेमास्पदं यद्धि तं शिवं प्रणतोऽस्म्यहम् ॥ २॥ परप्रेमास्पदत्वाद्वा
    योऽविनाशः स्वभावतः । आनन्दं ब्रह्म चात्मेति तं शिवं प्रणतोऽस्म्यहम् ॥ ३॥ जाग्रत्स्वप्नसुषुप्तीनां
    साक्ष्यतो यदतद्दशम् । अवस्थात्रयनिर्मुक्तं तं शिवं प्रणतोऽस्म्यहम् ॥ ४॥ यस्मात्परतरं नास्ति नेति नेति
    श्रुतिर्जगौ । भासा यस्य जगद्भाति तं शिवं प्रणतोऽस्म्यहम् ॥ ५॥ आभारूपस्य विश्वस्य भानं भासां निधेर्विना
    । नैव कल्पेत भारूपं तं शिवं प्रणतोऽस्म्यहम् ॥ ६॥ चिद्विवर्तं श्रुतिर्ब्रूते कारणं जगतोऽस्य यत् । चिद्रूपं
    ब्रह्म चात्रेति तं शिवं प्रणतोऽस्म्यहम् ॥ ७॥ यस्मिन्नाभाति सर्वं यज्जगद्गन्धर्वपत्तनम् । चिदाकाशं
    तमात्मानं श्रीशिवं प्रणतोऽस्म्यहम् ॥ ८॥ यतश्चेमानि भूतानि जायन्ते परमात्मनः । स्थित्वा यस्मिन् लयं
    यान्ति तं शिवं प्रणतोऽस्म्यहम् ॥ ९॥ जगतः स्थितिनाशाभ्यां यच्च किञ्चिन्न हीयते । सद्रूपं ब्रह्म चात्मेति
    तं शिवं प्रणतोऽस्म्यहम् ॥ १०॥ मायामेघो जगन्नीरं वर्षत्वेष यथा तथा । सच्चिदंशस्वरूपं तं श्रीशिवं प्रणतोऽस्म्यहम्
    ॥ ११॥ यत्कृपालेशतः सर्वा दैवी सम्पत्प्रजायते । ब्रह्मभूमादिनामानं तं शिवं प्रणतोऽस्म्यहम् ॥ १२॥ नमस्त्वैक्यं
    श्रुतिर्वक्ति यतः स्वात्मप्रसिद्धये । सोऽहं बुद्ध्या तमात्मानं श्रीशिवं प्रणतोऽस्म्यहम् ॥ १३॥ मनसा
    वचसा ग्राह्यं चापरोक्षात्स्वमात्रकम् । अहंस्फूर्तेः परं भान्तं तं शिवं प्रणतोऽस्म्यहम् ॥ १४॥ यत्र
    नासन्नसद्रूपे नाहङ्कारो न संसृतिः । केवलं चित्सुखं यच्च तं शिवं प्रणतोऽस्म्यहम् ॥ १५॥ सालम्बं हि परित्यज्य
    निरालम्बं समाश्रयेत् । आदृत्येमं श्रुतेः पक्षं तं शिवं प्रणतोऽस्म्यहम् ॥ १६॥ परोक्षतापरिच्छेदशाबल्याऽपोह्यनिर्मलम्
    । तदसीति गिरा लक्ष्यं तं शिवं प्रणतोऽस्म्यहम् ॥ १७॥
