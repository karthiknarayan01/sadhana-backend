id: navagrahamantrajapaprayogahvedoktasabija-2
category: veda
name:
  english: navagrahamantrajapaprayogahvedoktasabija
  devanagari: नवग्रहमन्त्रजपप्रयोगःवेदोक्तसबीज
content:
  english: kaya nah angushthabhyam namah | citra a tarjjanibhyam namah | bhuvaduti madhyamabhyam namah
    | sadavridhah sakha anamikabhyam namah | kaya kanishthikabhyam namah || shacishtaya vrita karatalakaraprishthabhyam
    namah | evam hridayadi nyasah | kaya nah hridayaya namah | citra a shirase svaha | bhavaduti shikhayai
    vashat | sadavridhah sakha kavacaya hu~ | kaya netratrayaya vaushat | shacishthaya vrita astraya phat
    || atha dhyanam
  devanagari: कया नः अङ्गुष्ठाभ्यां नमः । चित्र आ तर्ज्जनीभ्यां नमः । भुवदूती मध्यमाभ्यां नमः । सदावृधः
    सखा अनामिकाभ्यां नमः । कया कनिष्ठिकाभ्यां नमः ॥ शचिष्टया वृता करतलकरपृष्ठाभ्यां नमः । एवं हृदयादि
    न्यासः । कया नः हृदयाय नमः । चित्र आ शीरसे स्वाहा । भवदूती शिखायै वषट् । सदावृधः सखा कवचाय हुँ । कया
    नेत्रत्रयाय वौषट् । शचिष्ठया वृता अस्त्राय फट् ॥ अथ ध्यानं
meaning: {}
