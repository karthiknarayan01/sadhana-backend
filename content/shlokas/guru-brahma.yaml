id: guru-brahma
category: stotra
name:
  english: Guru Brahma
  devanagari: गुरुर्ब्रह्मा
content:
  english: >-
    gurur brahma gurur vishnuh gurur devo maheshvarah, guruh sakshat
    param brahma tasmai shri-gurave namah
  devanagari: >-
    गुरुर्ब्रह्मा गुरुर्विष्णुः गुरुर्देवो महेश्वरः । गुरुः साक्षात्
    परं ब्रह्म तस्मै श्रीगुरवे नमः ॥
meaning:
  english: >-
    The Guru is Brahma, the Guru is Vishnu, the Guru is Lord
    Maheshwara; the Guru is truly the supreme reality itself —
    salutations to that revered Guru.
source_attribution:
  text_source: Traditional Guru Stotram verse, widely recited in reverence to teachers
  translation_source: Original paraphrase written for Sadhana
  license: original_translation
