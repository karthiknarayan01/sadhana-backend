id: sri-maruthi-stotram
category: stotram
name:
  english: Sri Maruthi Stotram
content:
  english: '|| om namo bhagavate vicitravirahanumate pralayakalanalaprabhaprajvalanaya | pratapavajradehaya
    | anjanigarbhasambhutaya | prakatavikramaviradaityadanavayaksharakshoganagrahabandhanaya | bhutagrahabandhanaya
    | pretagrahabandhanaya | pishacagrahabandhanaya | shakinidakinigrahabandhanaya | kakinikaminigrahabandhanaya
    | brahmagrahabandhanaya | brahmarakshasagrahabandhanaya | coragrahabandhanaya | marigrahabandhanaya
    | ehi ehi | agaccha agaccha | aveshaya aveshaya | mama hridaye praveshaya praveshaya | sphura sphura
    | prasphura prasphura | satyam kathaya | vyaghramukhabandhana sarpamukhabandhana rajamukhabandhana
    narimukhabandhana sabhamukhabandhana shatrumukhabandhana sarvamukhabandhana lankaprasadabhanjana |
    amukam me vashamanaya | klim klim klim hruim shrim shrim rajanam vashamanaya | shrim hriim klim striya
    akarshaya akarshaya shatrunmardaya mardaya maraya maraya curnaya curnaya khe khe shriramacandrajnaya
    mama karyasiddhim kuru kuru om hriam hriim hrum hraim hraum hrah phat svaha vicitravira hanumat mama
    sarvashatrun bhasmikuru kuru | hana hana hum phat svaha || ekadashashatavaram japitva sarvashatrun
    vashamanayati nanyatha iti || iti shrimarutistotram sampurnam ||'
  devanagari: ॥ ॐ नमो भगवते विचित्रवीरहनुमते प्रलयकालानलप्रभाप्रज्वलनाय । प्रतापवज्रदेहाय । अञ्जनीगर्भसम्भूताय
    । प्रकटविक्रमवीरदैत्यदानवयक्षरक्षोगणग्रहबन्धनाय । भूतग्रहबन्धनाय । प्रेतग्रहबन्धनाय । पिशाचग्रहबन्धनाय
    । शाकिनीडाकिनीग्रहबन्धनाय । काकिनीकामिनीग्रहबन्धनाय । ब्रह्मग्रहबन्धनाय । ब्रह्मराक्षसग्रहबन्धनाय
    । चोरग्रहबन्धनाय । मारीग्रहबन्धनाय । एहि एहि । आगच्छ आगच्छ । आवेशय आवेशय । मम हृदये प्रवेशय प्रवेशय
    । स्फुर स्फुर । प्रस्फुर प्रस्फुर । सत्यं कथय । व्याघ्रमुखबन्धन सर्पमुखबन्धन राजमुखबन्धन नारीमुखबन्धन
    सभामुखबन्धन शत्रुमुखबन्धन सर्वमुखबन्धन लङ्काप्रासादभञ्जन । अमुकं मे वशमानय । क्लीं क्लीं क्लीं ह्रुईं
    श्रीं श्रीं राजानं वशमानय । श्रीं हॄइं क्लीं स्त्रिय आकर्षय आकर्षय शत्रुन्मर्दय मर्दय मारय मारय चूर्णय
    चूर्णय खे खे श्रीरामचन्द्राज्ञया मम कार्यसिद्धिं कुरु कुरु ॐ हृआं हॄइं ह्रूं ह्रैं ह्रौं ह्रः फट्
    स्वाहा विचित्रवीर हनुमत् मम सर्वशत्रून् भस्मीकुरु कुरु । हन हन हुं फट् स्वाहा ॥ एकादशशतवारं जपित्वा
    सर्वशत्रून् वशमानयति नान्यथा इति ॥ इति श्रीमारुतिस्तोत्रं सम्पूर्णम् ॥
