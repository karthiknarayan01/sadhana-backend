id: dharmikastotram
category: stotram
name:
  english: dharmikastotram
  devanagari: धार्मिकस्तोत्रम्
content:
  english: koka nijeshtavishayeshu yathaiva lagnah | murtau tatha bhagavato'tra mudatilagnam tvam bhaktidharmatanayam
    sharanam prapadye || 8|| snehaturastvatha bhayatura amayavi yadvat kshudhaturajanashca vihaya manam
    | dainyam bhajeyuriha satsu tatha carantam tvam bhaktidharmatanayam sharanam prapadye || 9|| dharmasthitai
  devanagari: कोका निजेष्टविषयेषु यथैव लग्नाः । मूर्तौ तथा भगवतोऽत्र मुदातिलग्नं त्वां भक्तिधर्मतनयं शरणं
    प्रपद्ये ॥ ८॥ स्नेहातुरस्त्वथ भयातुर आमयावी यद्वत् क्षुधातुरजनश्च विहाय मानम् । दैन्यं भजेयुरिह सत्सु
    तथा चरन्तं त्वां भक्तिधर्मतनयं शरणं प्रपद्ये ॥ ९॥ धर्मस्थितै
meaning: {}
