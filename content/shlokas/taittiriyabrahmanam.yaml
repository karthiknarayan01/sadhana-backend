id: taittiriyabrahmanam
category: veda
name:
  english: taittiriyabrahmanam
  devanagari: तैत्तिरीयब्राह्मणम्
content:
  english: m | yaja̭manah prasta̱rah | yaja̭maname̱va teja̭sa'nakti | vi̱yantu̱ vaya̱ itya̭ha | vaya̭
    e̱vaina̭m kri̱tva | su̱va̱rgam lo̱kam ga̭mayati || 63 pra̱jam yoni̱m ma nirmri̭ksha̱mitya̭ha | pra̱jayai̭
    gopi̱thaya̭ | apya̭yanta̱mapa̱ osha̭dhaya̱ itya̭ha | apa̭ e̱vausha̭dhi̱rapya̭yayati ma̱ruta̱m prisha̭taya̱h
    sthetya̭ha | ma̱ruto̱ vai vrishtya̭ ishate | vrishti̭me̱vava̭rundhe | diva̭m gaccha̱ tato̭ no̱ vrishti̱mera̱yetya̭ha
    | vrishti̱rvai dyauh | vrishti̭me̱vava̭rundhe || 3| 3| 9| 4|| 64 yava̱dva a̭dhva̱ryuh pra̭sta̱ram
    pra̱hara̭ti | tava̭da̱syayṷrmiyate | a̱yu̱shpa a̭gne̱'syayṷrme pa̱hitya̭ha | ayṷre̱va''tmandha̭tte
    | yava̱dva a̭dhva̱ryuh pra̭sta̱ram pra̱hara̭ti | tava̭dasya̱ cakshṷrmiyate | ca̱kshu̱shpa a̭gne'si̱
    cakshṷrme pa̱hitya̭ha | cakshṷre̱vatmandha̭tte | dhru̱va'sitya̭ha̱ prati̭shthityai | yam pa̭ri̱dhim
    pa̱ryadha̭ttha̱ itya̭ha || 3| 3| 9| 5|| 65 ya̱tha̱ya̱jure̱vaitat | agnḙ devapa̱nibhi̭rvi̱ryama̭na̱
    itya̭ha | a̱gnaya̭ e̱vaina̱m jushta̭m karoti | tam ta̭ e̱tamanu̱josha̭m bhara̱mitya̭ha | sa̱ja̱tane̱vasma̱
    anṷkankaroti | nede̱sha tvada̭pace̱taya̭ ta̱ itya̱hanṷkhyatyai | ya̱jnasya̱ patha̱ upa̱sami̭ta̱mitya̭ha
    | bhu̱mana̭me̱vopai̭ti | pa̱ri̱dhinpraha̭rati | ya̱jnasya̱ sami̭shtyai || 3| 3| 9| 6|| 66 srucau̱
    samprasra̭vayati | yade̱va tatra̭ kru̱ram | tattena̭ shamayati | ju̱hvamṷpa̱bhrita
  devanagari: म् । यज॑मानः प्रस्त॒रः । यज॑मानमे॒व तेज॑साऽनक्ति । वि॒यन्तु॒ वय॒ इत्या॑ह । वय॑ ए॒वैनं॑ कृ॒त्वा
    । सु॒व॒र्गं लो॒कं ग॑मयति ॥ ६३ प्र॒जां योनिं॒ मा निर्मृ॑क्ष॒मित्या॑ह । प्र॒जायै॑ गोपी॒थाय॑ । आप्या॑यन्ता॒माप॒
    ओष॑धय॒ इत्या॑ह । आप॑ ए॒वौष॑धी॒राप्या॑ययति म॒रुतां॒ पृष॑तयः॒ स्थेत्या॑ह । म॒रुतो॒ वै वृष्ट्या॑ ईशते
    । वृष्टि॑मे॒वाव॑रुन्धे । दिवं॑ गच्छ॒ ततो॑ नो॒ वृष्टि॒मेर॒येत्या॑ह । वृष्टि॒र्वै द्यौः । वृष्टि॑मे॒वाव॑रुन्धे
    ॥ ३। ३। ९। ४॥ ६४ याव॒द्वा अ॑ध्व॒र्युः प्र॑स्त॒रं प्र॒हर॑ति । ताव॑द॒स्यायु॑र्मीयते । आ॒यु॒ष्पा अ॑ग्ने॒ऽस्यायु॑र्मे
    पा॒हीत्या॑ह । आयु॑रे॒वाऽऽत्मन्ध॑त्ते । याव॒द्वा अ॑ध्व॒र्युः प्र॑स्त॒रं प्र॒हर॑ति । ताव॑दस्य॒ चक्षु॑र्मीयते
    । च॒क्षु॒ष्पा अ॑ग्नेऽसि॒ चक्षु॑र्मे पा॒हीत्या॑ह । चक्षु॑रे॒वात्मन्ध॑त्ते । ध्रु॒वाऽसीत्या॑ह॒ प्रति॑ष्ठित्यै
    । यं प॑रि॒धिं प॒र्यध॑त्था॒ इत्या॑ह ॥ ३। ३। ९। ५॥ ६५ य॒था॒य॒जुरे॒वैतत् । अग्ने॑ देवप॒णिभि॑र्वी॒र्यमा॑ण॒
    इत्या॑ह । अ॒ग्नय॑ ए॒वैनं॒ जुष्टं॑ करोति । तं त॑ ए॒तमनु॒जोषं॑ भरा॒मीत्या॑ह । स॒जा॒ताने॒वास्मा॒ अनु॑कान्करोति
    । नेदे॒ष त्वद॑पचे॒तया॑ ता॒ इत्या॒हानु॑ख्यात्यै । य॒ज्ञस्य॒ पाथ॒ उप॒समि॑त॒मित्या॑ह । भू॒मान॑मे॒वोपै॑ति
    । प॒रि॒धीन्प्रह॑रति । य॒ज्ञस्य॒ समि॑ष्ट्यै ॥ ३। ३। ९। ६॥ ६६ स्रुचौ॒ संप्रस्रा॑वयति । यदे॒व तत्र॑ क्रू॒रम्
    । तत्तेन॑ शमयति । जु॒ह्वामु॑प॒भृत
