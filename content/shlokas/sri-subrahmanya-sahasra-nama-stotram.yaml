id: sri-subrahmanya-sahasra-nama-stotram
category: stotram
name:
  english: Sri Subrahmanya Sahasra Nama Stotram
content:
  english: rishaya ucuh | sarvashastrarthatattvajna sarvalokopakaraka | vayam catithayah prapta atitheyo'si
    suvrata || || jnanadanena samsarasagarattarayasva nah | kalau kalushacitta ye narah paparatah sada
    || || kena stotrena mucyante sarvapatakabandhanat | ishtasiddhikaram punyam duhkhadaridryanashanam
    || || sarvarogaharam stotram suta no vaktumarhasi | shrisuta uvaca | shrinudhvam rishayah sarve naimisharanyavasinah
    || || tattvajnanataponishthah sarvashastravisharadah | svayambhuva pura proktam naradaya mahatmane
    || || tadaham sampravakshyami shrotum kautuhalam yadi | rishaya ucuh | kimaha bhagavanbrahma naradaya
    mahatmane || || sutaputra mahabhaga vaktumarhasi sampratam | shrisuta uvaca | divyasimhasanasinam
    sarvadevairabhishtutam || || sashtangam pranipatyainam brahmanam bhuvaneshvaram | naradah paripapraccha
    kritanjalirupasthitah || || narada uvaca | lokanatha surashreshtha sarvajna karunakara | shanmukhasya
    param stotram pavanam papanashanam || || he dhatah putravatsalyattadvada pranataya me | upadishya
    tu mamevam raksha raksha kripanidhe || || brahmovaca | shrinu vakshyami devarshe stavarajamidam param
    | matrikamalikayuktam jnanamokshasukhapradam || || sahasrani ca namani shanmukhasya mahatmanah | yani
    namani divyani duhkharogaharani ca || || tani namani vakshyami kripaya tvayi narada | japamatrena
    siddhyanti manasa cintitanyapi || || ihamutra param bhogam labhate natra samshayah | idam stotram
    param punyam kotiyajnaphalapradam | sandeho natra kartavyah shrinu me nishcitam vacah || || om asya
    shrisubrahmanyasahasranamastotra mahamantrasya brahma rishih anushtupchandah subrahmanyo devata sharajanmakshaya
    iti bijam shaktidharo'kshaya kartikeya iti shaktih krauncadhara iti kilakam shikhivahana iti kavacam
    shanmukhaya iti dhyanam shrisubrahmanya prasadasiddhyarthe jape viniyogah | karanyasah om sham onkarasvarupaya
    ojodharaya ojasvine suhridayaya hrishtacittatmane bhasvararupaya angushthabhyam namah | om ram shatkonamadhyanilayaya
    shatkiritadharaya shrimate shadadharaya tarjanibhyam namah | om vam shanmukhaya sharajanmane shubhalakshanaya
    shikhivahanaya madhyamabhyam namah | om nam krishanusambhavaya kavacine kukkutadhvajaya anamikabhyam
    namah | om bham kandarpakotidipyamanaya dvishadbahave dvadashakshaya kanishthikabhyam namah | om vam
    khetadharaya khadgine shaktihastaya karatalakaraprishthabhyam namah | hridayadinyasah om sham onkarasvarupaya
    ojodharaya ojasvine suhridayaya hrishtacittatmane bhasvararupaya hridayaya namah | om ram shatkonamadhyanilayaya
    shatkiritadharaya shrimate shadadharaya shirase svaha | om vam shanmukhaya sharajanmane shubhalakshanaya
    shikhivahanaya shikhayai vashat | om nam krishanusambhavaya kavacine kukkutadhvajaya kavacaya hum
    | om bham kandarpakotidipyamanaya dvishadbahave dvadashakshaya netratrayaya vaushat | om vam khetadharaya
    khadgine shaktihastaya astraya phat | bhurbhuvassuvaromiti digbandhah | dhyanam | dhyayetshanmukhamindukotisadrisham
    ratnaprabhashobhitam balarkadyutishatkiritavilasatkeyuraharanvitam | karnalambitakundalapravilasadgandasthalashobhitam
    kancikankanakinkiniravayutam shringarasarodayam || || dhyayedipsitasiddhidam shivasutam shridvadashaksham
    guham khetam kukkutamankusham ca varadam pasham dhanushcakrakam | vajram shaktimasim ca shulamabhayam
    dorbhirdhritam shanmukham devam citramayuravahanagatam citrambaralankritam || || stotram | acintyashaktiranaghastvakshobhyastvaparajitah
    | anathavatsalo'moghastvashoko'pyajaro'bhayah || || atyudaro hyaghaharastvagraganyo'drijasutah | anantamahima'paro'nantasaukhyaprado'vyayah
    || || anantamokshado'nadiraprameyo'ksharo'cyutah | akalmasho'bhiramo'gradhuryashcamitavikramah ||
    atulashcamrito'ghoro hyananto'nantavikramah anathanatho hyamalo hyapramatto'maraprabhuh | arindamo'khiladharastvanimadiguno'granih
    || || acancalo'marastutyo hyakalanko'mitashanah | agnibhuranavadyango hyadbhuto'bhishtadayakah ||
    || atindriyo'prameyatma hyadrishyo'vyaktalakshanah | apadvinashakastvarya adhya agamasamstutah ||
    || artasamrakshanastvadya anandastvaryasevitah | ashriteshtarthavarada anandyartaphalapradah || ||
    ashcaryarupa ananda apannartivinashanah | ibhavaktranujastvishta ibhasuraharatmajah || || itihasashrutistutya
    indrabhogaphalapradah | ishtapurtaphalapraptirishteshtavaradayakah || || ihamutreshtaphalada ishtadastvindravanditah
    | idaniyastvishaputra ipsitarthapradayakah || || itibhitiharashcedya ishanatrayavarjitah | udarakirtirudyogi
    cotkrishtoruparakramah || || utkrishtashaktirutsaha udarashcotsavapriyah | ujjrimbha udbhavashcogra
    udagrashcogralocanah || || unmatta ugrashamana udvegaghnorageshvarah | uruprabhavashcodirna umaputra
    udaradhih || || urdhvaretahsutasturdhvagatidasturjapalakah | urjitasturdhvagasturdhva urdhvalokaikanayakah
    || || urjavanurjitodara urjitorjitashasanah | rishidevaganastutya rinatrayavimocanah || || rijurupo
    hyrijukara rijumargapradarshanah | ritambharo hyrijuprita rishabhastvriddhidastvritah || || lulitoddharako
    lutabhavapashaprabhanjanah | enankadharasatputra eka enovinashanah || || aishvaryadashcaindrabhogi
    caitihyashcaindravanditah | ojasvi caushadhisthanamojodashcaudanapradah || || audaryashila aumeya
    augra aunnatyadayakah | audarya aushadhakara aushadham caushadhakarah || || amshumanamshumalidya ambikatanayo'nnadah
    | andhakarisuto'ndhatvahari cambujalocanah || || astamayo'maradhisho hyaspashto'stokapunyadah | astamitro'starupashcaskhalatsugatidayakah
    || || kartikeyah kamarupah kumarah krauncadaranah | kamadah karanam kamyah kamaniyah kripakarah ||
    || kancanabhah kantiyuktah kami kamapradah kavih | kirtikritkukkutadharah kutasthah kuvalekshanah
    || || kunkumangah klamaharah kushalah kukkutadhvajah | kushanusambhavah krurah kruraghnah kalitapahrit
    || || kamarupah kalpataruh kantah kamitadayakah | kalyanakritkleshanashah kripaluh karunakarah ||
    || kalushaghnah kriyashaktih kathorah kavaci kriti | komalangah kushapritah kutsitaghnah kaladharah
    || || khyatah khetadharah khadgi khatvangi khalanigrahah | khyatipradah khecareshah khyatehah khecarastutah
    || || kharatapaharah svasthah khecarah khecarashrayah | khandendumaulitanayah khelah khecarapalakah
    || || khasthalah khanditarkashca khecarijanapujitah | gangeyo girijaputro gananathanujo guhah || ||
    gopta girvanasamsevyo gunatito guhashrayah | gatiprado gunanidhih gambhiro girijatmajah || || gudharupo
    gadaharo gunadhisho gunagranih | godharo gahano gupto garvaghno gunavardhanah || || guhyo gunajno
    gitijno gatatanko gunashrayah | gadyapadyapriyo gunyo gostuto gaganecarah || || gananiyacaritrashca
    gataklesho gunarnavah | ghurnitaksho ghrininidhih ghanagambhiraghoshanah || || ghantanadapriyo ghosho
    ghoraghaughavinashanah | ghananando gharmahanta ghrinavan ghrishtipatakah || || ghrini ghrinakaro
    ghoro ghoradaityapraharakah | ghatitaishvaryasandoho ghanartho ghanasankramah || || citrakriccitravarnashca
    cancalashcapaladyutih | cinmayashcitsvarupashca ciranandashcirantanah || || citrakelishcitratarashcintaniyashcamatkritih
    | coraghnashcaturashcarushcamikaravibhushanah || || candrarkakotisadrishashcandramaulitanubhavah |
    chaditangashchadmahanta cheditakhilapatakah || || chedikritatamahkleshashchatrikritamahayashah | chaditasheshasantapashchuritamritasagarah
    || || channatraigunyarupashca chatehashchinnasamshayah | chandomayashchandagami chinnapashashchavishchadah
    || || jagaddhito jagatpujyo jagajjyeshtho jaganmayah | janako jahnavisunurjitamitro jagadguruh ||
    || jayi jitendriyo jaitro jaramaranavarjitah | jyotirmayo jagannatho jagajjivo janashrayah || || jagatsevyo
    jagatkarta jagatsakshi jagatpriyah | jambharivandyo jayado jagajjanamanoharah || || jagadanandajanako
    janajadyapaharakah | japakusumasankasho janalocanashobhanah || || janeshvaro jitakrodho janajanmanibarhanah
    | jayado jantutapaghno jitadaityamahavrajah || || jitamayo jitakrodho jitasango janapriyah | jhanjhanilamahavego
    jharitasheshapatakah || || jharjharikritadaityaugho jhallarivadyasampriyah | jnanamurtirjnanagamyo
    jnani jnanamahanidhih || || tankaranrittavibhavah tankavajradhvajankitah | tankitakhilalokashca tankitainastamoravih
    || || dambaraprabhavo dambho dambo damarukapriyah | damarotkatasannado dimbharupasvarupakah || ||
    dhakkanadapritikaro dhalitasurasankulah | dhaukitamarasandoho dhundhivighneshvaranujah || || tattvajnastatvagastivrastaporupastapomayah
    | trayimayastrikalajnastrimurtistrigunatmakah || || tridasheshastarakaristapaghnastapasapriyah | tushtidastushtikrittikshnastaporupastrikalavit
    || || stota stavyah stavapritah stutih stotram stutipriyah | sthitah sthayi sthapakashca sthulasukshmapradarshakah
    || || sthavishthah sthavirah sthulah sthanadah sthairyadah sthirah | danto dayaparo data duritaghno
    durasadah || || darshaniyo dayasaro devadevo dayanidhih | duradharsho durvigahyo daksho darpanashobhitah
    || || durdharo danashilashca dvadashaksho dvishadbhujah | dvishatkarno dvishadbahurdinasantapanashanah
    || || dandashukeshvaro devo divyo divyakritirdamah | dirghavritto dirghabahurdirghadrishtirdivaspatih
    || || dando damayita darpo devasimho dridhavratah | durlabho durgamo dipto dushprekshyo divyamandanah
    || || durodaraghno duhkhaghno durarighno disham patih | durjayo devasenesho durjneyo duratikramah
    || || dambho driptashca devarshirdaivajno daivacintakah | dhurandharo dharmaparo dhanado dhritivardhanah
    || || dharmesho dharmashastrajno dhanvi dharmaparayanah | dhanadhyaksho dhanapatirdhritimandhutakilbishah
    || || dharmaheturdharmashuro dharmakriddharmaviddhruvah | dhata dhimandharmacari dhanyo dhuryo dhritavratah
    || || nityotsavo nityatripto nirlepo nishcalatmakah | niravadyo niradharo nishkalanko niranjanah ||
    || nirmamo nirahankaro nirmoho nirupadravah | nityanando niratanko nishprapanco niramayah || || niravadyo
    nirihashca nirdarsho nirmalatmakah | nityanando nirjaresho nihsango nigamastutah || || nishkantako
    niralambo nishpratyuho nirudbhavah | nityo niyatakalyano nirvikalpo nirashrayah || || neta nidhirnaikarupo
    nirakaro nadisutah | pulindakanyaramanah purujitparamapriyah || || pratyakshamurtih pratyakshah pareshah
    purnapunyadah | punyakarah punyarupah punyah punyaparayanah || || punyodayah param jyotih punyakritpunyavardhanah
    | paranandah paratarah punyakirtih puratanah || || prasannarupah praneshah pannagah papanashanah |
    pranatartiharah purnah parvatinandanah prabhuh || || putatma purushah pranah prabhavah purushottamah
    | prasannah paramaspashtah parah paribridhah parah || || paramatma parabrahma pararthah priyadarshanah
    | pavitrah pushtidah purtih pingalah pushtivardhanah || || papahari pashadharah pramattasurashikshakah
    | pavanah pavakah pujyah purnanandah paratparah || || pushkalah pravarah purvah pitribhaktah purogamah
    | pranadah pranijanakah pradishtah pavakodbhavah || || parabrahmasvarupashca paramaishvaryakaranam
    | parardhidah pushtikarah prakashatma pratapavan || || prajnaparah prakrishtarthah prithuh prithuparakramah
    | phanishvarah phanivarah phanamanivibhushanah || || phaladah phalahastashca phullambujavilocanah
    | phaduccatitapapaughah phanilokavibhushanah || || bahuleyo brihadrupo balishtho balavan bali | brahmeshavishnurupashca
    buddho buddhimatam varah || || balarupo brahmagarbho brahmacari budhapriyah | bahushruto bahumato
    brahmanyo brahmanapriyah || || balapramathano brahma bahurupo bahupradah | brihadbhanutanudbhuto brihatseno
    bileshayah || || bahubahurbalashriman bahudaityavinashakah | biladvarantaralastho brihacchaktidhanurdharah
    || || balarkadyutiman balo brihadvaksha brihaddhanuh | bhavyo bhogishvaro bhavyo bhavanasho bhavapriyah
    || || bhaktigamyo bhayaharo bhavajno bhaktasupriyah | bhuktimuktiprado bhogi bhagavan bhagyavardhanah
    || || bhrajishnurbhavano bharta bhimo bhimaparakramah | bhutido bhutikridbhokta bhutatma bhuvaneshvarah
    || || bhavako bhikaro bhishmo bhavakeshto bhavodbhavah | bhavatapaprashamano bhogavan bhutabhavanah
    || || bhojyaprado bhrantinasho bhanuman bhuvanashrayah | bhuribhogaprado bhadro bhajaniyo bhishagvarah
    || || mahaseno mahodaro mahashaktirmahadyutih | mahabuddhirmahaviryo mahotsaho mahabalah || || mahabhogi
    mahamayi medhavi mekhali mahan | munistuto mahamanyo mahanando mahayashah || || mahorjito mananidhirmanorathaphalapradah
    | mahodayo mahapunyo mahabalaparakramah || || manado matido mali muktamalavibhushanah | manoharo mahamukhyo
    mahardhirmurtimanmunih || || mahottamo mahopayo mokshado mangalapradah | mudakaro muktidata mahabhogo
    mahoragah || || yashaskaro yogayoniryogishtho yaminam varah | yashasvi yogapurusho yogyo yoganidhiryami
    || || yatisevyo yogayukto yogavidyogasiddhidah | yantro yantri ca yantrajno yantravanyantravahakah
    || || yatanarahito yogi yogisho yoginam varah | ramaniyo ramyarupo rasajno rasabhavanah || || ranjano
    ranjito ragi ruciro rudrasambhavah | ranapriyo ranodaro ragadveshavinashanah || || ratnarci ruciro
    ramyo rupalavanyavigrahah | ratnangadadharo ratnabhushano ramaniyakah || || rucikridrocamanashca ranjito
    roganashanah | rajivaksho rajarajo raktamalyanulepanah || || rajadvedagamastutyo rajahsattvagunanvitah
    | rajanishakalaramyo ratnakundalamanditah || || ratnasanmaulishobhadhyo rananmanjirabhushanah | lokaikanatho
    lokesho lalito lokanayakah || || lokaraksho lokashiksho lokalocanaranjitah | lokabandhurlokadhata
    lokatrayamahahitah || || lokacudamanirlokavandyo lavanyavigrahah | lokadhyakshastu lilavanlokottaragunanvitah
    || || varishtho varado vaidyo vishishto vikramo vibhuh | vibudhagracaro vashyo vikalpaparivarjitah
    || || vipasho vigatatanko vicitrango virocanah | vidyadharo vishuddhatma vedango vibudhapriyah ||
    || vacaskaro vyapakashca vijnani vinayanvitah | vidvattamo virodhighno viro vigataragavan || || vitabhavo
    vinitatma vedagarbho vasupradah | vishvadiptirvishalaksho vijitatma vibhavanah || || vedavedyo vidheyatma
    vitadoshashca vedavit | vishvakarma vitabhayo vagisho vasavarcitah || || viradhvamso vishvamurtirvishvarupo
    varasanah | vishakho vimalo vagmi vidvanvedadharo vatuh || || viracudamanirviro vidyesho vibudhashrayah
    | vijayi vinayi vetta variyanviraja vasuh || || viraghno vijvaro vedyo vegavanviryavanvashi | varashilo
    varaguno vishoko vajradharakah || || sharajanma shaktidharah shatrughnah shikhivahanah | shriman shishtah
    shucih shuddhah shashvatah shrutisagarah || || sharanyah shubhadah sharma shishteshtah shubhalakshanah
    | shantah shuladharah shreshthah shuddhatma shankarah shivah || || shitikanthatmajah shurah shantidah
    shokanashanah | shanmaturah shanmukhashca shadgunaishvaryasamyutah || || shatcakrasthah shadurmighnah
    shadangashrutiparagah | shadbhavarahitah shatkah shatchastrasmritiparagah || || shadvargadata shadgrivah
    shadarighnah shadashrayah | shatkiritadharah shriman shadadharashca shatkramah || || shatkonamadhyanilayah
    shandatvapariharakah | senanih subhagah skandah suranandah satam gatih || || subrahmanyah suradhyakshah
    sarvajnah sarvadah sukhi | sulabhah siddhidah saumyah siddheshah siddhisadhanah || || siddharthah
    siddhasankalpah siddhasadhuh sureshvarah | subhujah sarvadriksakshi suprasadah sanatanah || || sudhapatih
    svayanjyotih svayambhuh sarvatomukhah | samarthah satkritih sukshmah sughoshah sukhadah suhrit ||
    || suprasannah surashreshthah sushilah satyasadhakah | sambhavyah sumanah sevyah sakalagamaparagah
    || || suvyaktah saccidanandah suvirah sujanashrayah | sarvalakshanasampannah satyadharmaparayanah
    || || sarvadevamayah satyah sada mrishtannadayakah | sudhapi sumatih satyah sarvavighnavinashanah
    || || sarvaduhkhaprashamanah sukumarah sulocanah | sugrivah sudhritih sarah suraradhyah suvikramah
    || || surarighnah svarnavarnah sarparajah sada shucih | saptarcirbhuh suravarah sarvayudhavisharadah
    || || hasticarmambarasuto hastivahanasevitah | hastacitrayudhadharo hritagho hasitananah || || hemabhusho
    haridvarno hrishtido hrishtivardhanah | hemadribhiddhamsarupo hunkarahatakilbishah || || himadrijatatanujo
    harikesho hiranmayah | hridyo hrishto harisakho hamso hamsagatirhavih || || hiranyavarno hitakriddharshado
    hemabhushanah | harapriyo hitakaro hatapapo harodbhavah || || kshemadah kshemakritkshemyah kshetrajnah
    kshamavarjitah | kshetrapalah kshamadharah kshemakshetrah kshamakarah || || kshudraghnah kshantidah
    kshemah kshitibhushah kshamashrayah | kshalitaghah kshitidharah kshinasamrakshanakshamah || || kshanabhangurasannaddhaghanashobhikapardakah
    | kshitibhrinnathatanayamukhapankajabhaskarah || || kshatahitah ksharah kshanta kshatadoshah kshamanidhih
    | kshapitakhilasantapah kshapanathasamananah || || uttara nyasah | karanyasah om sham onkarasvarupaya
    ojodharaya ojasvine suhridayaya hrishtacittatmane bhasvararupaya angushthabhyam namah | om ram shatkonamadhyanilayaya
    shatkiritadharaya shrimate shadadharaya tarjanibhyam namah | om vam shanmukhaya sharajanmane shubhalakshanaya
    shikhivahanaya madhyamabhyam namah | om nam krishanusambhavaya kavacine kukkutadhvajaya anamikabhyam
    namah | om bham kandarpakotidipyamanaya dvishadbahave dvadashakshaya kanishthikabhyam namah | om vam
    khetadharaya khadgine shaktihastaya karatalakaraprishthabhyam namah | hridayadinyasah om sham onkarasvarupaya
    ojodharaya ojasvine suhridayaya hrishtacittatmane bhasvararupaya hridayaya namah | om ram shatkonamadhyanilayaya
    shatkiritadharaya shrimate shadadharaya shirase svaha | om vam shanmukhaya sharajanmane shubhalakshanaya
    shikhivahanaya shikhayai vashat | om nam krishanusambhavaya kavacine kukkutadhvajaya kavacaya hum
    | om bham kandarpakotidipyamanaya dvishadbahave dvadashakshaya netratrayaya vaushat | om vam khetadharaya
    khadgine shaktihastaya astraya phat | bhurbhuvassuvaromiti digvimokah | phalashruti | iti namnam sahasrani
    shanmukhasya ca narada | yah pathecchrinuyadvapi bhaktiyuktena cetasa || || sa sadyo mucyate papairmanovakkayasambhavaih
    | ayurvriddhikaram pumsam sthairyaviryavivardhanam || || vakyenaikena vakshyami vanchitartham prayacchati
    | tasmatsarvatmana brahmanniyamena japetsudhih || || iti skandapurane ishvaraprokte brahmanaradasamvade
    shri subrahmanya sahasranama stotram |
  devanagari: ऋषय ऊचुः । सर्वशास्त्रार्थतत्त्वज्ञ सर्वलोकोपकारक । वयं चातिथयः प्राप्ता आतिथेयोऽसि सुव्रत
    ॥ ॥ ज्ञानदानेन संसारसागरात्तारयस्व नः । कलौ कलुषचित्ता ये नराः पापरताः सदा ॥ ॥ केन स्तोत्रेण मुच्यन्ते
    सर्वपातकबन्धनात् । इष्टसिद्धिकरं पुण्यं दुःखदारिद्र्यनाशनम् ॥ ॥ सर्वरोगहरं स्तोत्रं सूत नो वक्तुमर्हसि
    । श्रीसूत उवाच । शृणुध्वं ऋषयः सर्वे नैमिशारण्यवासिनः ॥ ॥ तत्त्वज्ञानतपोनिष्ठाः सर्वशास्त्रविशारदाः
    । स्वयम्भुवा पुरा प्रोक्तं नारदाय महात्मने ॥ ॥ तदहं सम्प्रवक्ष्यामि श्रोतुं कौतूहलं यदि । ऋषय ऊचुः
    । किमाह भगवान्ब्रह्मा नारदाय महात्मने ॥ ॥ सूतपुत्र महाभाग वक्तुमर्हसि साम्प्रतम् । श्रीसूत उवाच ।
    दिव्यसिंहासनासीनं सर्वदेवैरभिष्टुतम् ॥ ॥ साष्टाङ्गं प्रणिपत्यैनं ब्रह्माणं भुवनेश्वरम् । नारदः परिपप्रच्छ
    कृताञ्जलिरुपस्थितः ॥ ॥ नारद उवाच । लोकनाथ सुरश्रेष्ठ सर्वज्ञ करुणाकर । षण्मुखस्य परं स्तोत्रं पावनं
    पापनाशनम् ॥ ॥ हे धातः पुत्रवात्सल्यात्तद्वद प्रणताय मे । उपदिश्य तु मामेवं रक्ष रक्ष कृपानिधे ॥ ॥
    ब्रह्मोवाच । शृणु वक्ष्यामि देवर्षे स्तवराजमिदं परम् । मातृकामालिकायुक्तं ज्ञानमोक्षसुखप्रदम् ॥ ॥
    सहस्राणि च नामानि षण्मुखस्य महात्मनः । यानि नामानि दिव्यानि दुःखरोगहराणि च ॥ ॥ तानि नामानि वक्ष्यामि
    कृपया त्वयि नारद । जपमात्रेण सिद्ध्यन्ति मनसा चिन्तितान्यपि ॥ ॥ इहामुत्र परं भोगं लभते नात्र संशयः
    । इदं स्तोत्रं परं पुण्यं कोटियज्ञफलप्रदम् । सन्देहो नात्र कर्तव्यः शृणु मे निश्चितं वचः ॥ ॥ ॐ अस्य
    श्रीसुब्रह्मण्यसहस्रनामस्तोत्र महामन्त्रस्य ब्रह्मा ऋषिः अनुष्टुप्छन्दः सुब्रह्मण्यो देवता शरजन्माक्षय
    इति बीजं शक्तिधरोऽक्षय कार्तिकेय इति शक्तिः क्रौञ्चधर इति कीलकं शिखिवाहन इति कवचं षण्मुखाय इति ध्यानं
    श्रीसुब्रह्मण्य प्रसादसिद्ध्यर्थे जपे विनियोगः । करन्यासः ॐ शं ओङ्कारस्वरूपाय ओजोधराय ओजस्विने सुहृदयाय
    हृष्टचित्तात्मने भास्वररूपाय अङ्गुष्ठाभ्यां नमः । ॐ रं षट्कोणमध्यनिलयाय षट्किरीटधराय श्रीमते षडाधाराय
    तर्जनीभ्यां नमः । ॐ वं षण्मुखाय शरजन्मने शुभलक्षणाय शिखिवाहनाय मध्यमाभ्यां नमः । ॐ णं कृशानुसम्भवाय
    कवचिने कुक्कुटध्वजाय अनामिकाभ्यां नमः । ॐ भं कन्दर्पकोटिदीप्यमानाय द्विषड्बाहवे द्वादशाक्षाय कनिष्ठिकाभ्यां
    नमः । ॐ वं खेटधराय खड्गिने शक्तिहस्ताय करतलकरपृष्ठाभ्यां नमः । हृदयादिन्यासः ॐ शं ओङ्कारस्वरूपाय ओजोधराय
    ओजस्विने सुहृदयाय हृष्टचित्तात्मने भास्वररूपाय हृदयाय नमः । ॐ रं षट्कोणमध्यनिलयाय षट्किरीटधराय श्रीमते
    षडाधाराय शिरसे स्वाहा । ॐ वं षण्मुखाय शरजन्मने शुभलक्षणाय शिखिवाहनाय शिखायै वषट् । ॐ णं कृशानुसम्भवाय
    कवचिने कुक्कुटध्वजाय कवचाय हुम् । ॐ भं कन्दर्पकोटिदीप्यमानाय द्विषड्बाहवे द्वादशाक्षाय नेत्रत्रयाय
    वौषट् । ॐ वं खेटधराय खड्गिने शक्तिहस्ताय अस्त्राय फट् । भूर्भुवस्सुवरोमिति दिग्बन्धः । ध्यानम् । ध्यायेत्षण्मुखमिन्दुकोटिसदृशं
    रत्नप्रभाशोभितं बालार्कद्युतिषट्किरीटविलसत्केयूरहारान्वितम् । कर्णालम्बितकुण्डलप्रविलसद्गण्डस्थलाशोभितं
    काञ्चीकङ्कणकिङ्किणीरवयुतं शृङ्गारसारोदयम् ॥ ॥ ध्यायेदीप्सितसिद्धिदं शिवसुतं श्रीद्वादशाक्षं गुहं खेटं
    कुक्कुटमङ्कुशं च वरदं पाशं धनुश्चक्रकम् । वज्रं शक्तिमसिं च शूलमभयं दोर्भिर्धृतं षण्मुखं देवं चित्रमयूरवाहनगतं
    चित्राम्बरालङ्कृतम् ॥ ॥ स्तोत्रम् । अचिन्त्यशक्तिरनघस्त्वक्षोभ्यस्त्वपराजितः । अनाथवत्सलोऽमोघस्त्वशोकोऽप्यजरोऽभयः
    ॥ ॥ अत्युदारो ह्यघहरस्त्वग्रगण्योऽद्रिजासुतः । अनन्तमहिमाऽपारोऽनन्तसौख्यप्रदोऽव्ययः ॥ ॥ अनन्तमोक्षदोऽनादिरप्रमेयोऽक्षरोऽच्युतः
    । अकल्मषोऽभिरामोऽग्रधुर्यश्चामितविक्रमः ॥ अतुलश्चामृतोऽघोरो ह्यनन्तोऽनन्तविक्रमः अनाथनाथो ह्यमलो ह्यप्रमत्तोऽमरप्रभुः
    । अरिन्दमोऽखिलाधारस्त्वणिमादिगुणोऽग्रणीः ॥ ॥ अचञ्चलोऽमरस्तुत्यो ह्यकलङ्कोऽमिताशनः । अग्निभूरनवद्याङ्गो
    ह्यद्भुतोऽभीष्टदायकः ॥ ॥ अतीन्द्रियोऽप्रमेयात्मा ह्यदृश्योऽव्यक्तलक्षणः । आपद्विनाशकस्त्वार्य आढ्य
    आगमसंस्तुतः ॥ ॥ आर्तसंरक्षणस्त्वाद्य आनन्दस्त्वार्यसेवितः । आश्रितेष्टार्थवरद आनन्द्यार्तफलप्रदः ॥
    ॥ आश्चर्यरूप आनन्द आपन्नार्तिविनाशनः । इभवक्त्रानुजस्त्विष्ट इभासुरहरात्मजः ॥ ॥ इतिहासश्रुतिस्तुत्य
    इन्द्रभोगफलप्रदः । इष्टापूर्तफलप्राप्तिरिष्टेष्टवरदायकः ॥ ॥ इहामुत्रेष्टफलद इष्टदस्त्विन्द्रवन्दितः
    । ईडनीयस्त्वीशपुत्र ईप्सितार्थप्रदायकः ॥ ॥ ईतिभीतिहरश्चेड्य ईषणात्रयवर्जितः । उदारकीर्तिरुद्योगी चोत्कृष्टोरुपराक्रमः
    ॥ ॥ उत्कृष्टशक्तिरुत्साह उदारश्चोत्सवप्रियः । उज्जृम्भ उद्भवश्चोग्र उदग्रश्चोग्रलोचनः ॥ ॥ उन्मत्त
    उग्रशमन उद्वेगघ्नोरगेश्वरः । उरुप्रभावश्चोदीर्ण उमापुत्र उदारधीः ॥ ॥ ऊर्ध्वरेतःसुतस्तूर्ध्वगतिदस्तूर्जपालकः
    । ऊर्जितस्तूर्ध्वगस्तूर्ध्व ऊर्ध्वलोकैकनायकः ॥ ॥ ऊर्जावानूर्जितोदार ऊर्जितोर्जितशासनः । ऋषिदेवगणस्तुत्य
    ऋणत्रयविमोचनः ॥ ॥ ऋजुरूपो ह्यृजुकर ऋजुमार्गप्रदर्शनः । ऋतम्भरो ह्यृजुप्रीत ऋषभस्त्वृद्धिदस्त्वृतः
    ॥ ॥ लुलितोद्धारको लूतभवपाशप्रभञ्जनः । एणाङ्कधरसत्पुत्र एक एनोविनाशनः ॥ ॥ ऐश्वर्यदश्चैन्द्रभोगी चैतिह्यश्चैन्द्रवन्दितः
    । ओजस्वी चौषधिस्थानमोजोदश्चौदनप्रदः ॥ ॥ औदार्यशील औमेय औग्र औन्नत्यदायकः । औदार्य औषधकर औषधं चौषधाकरः
    ॥ ॥ अंशुमानंशुमालीड्य अम्बिकातनयोऽन्नदः । अन्धकारिसुतोऽन्धत्वहारी चाम्बुजलोचनः ॥ ॥ अस्तमायोऽमराधीशो
    ह्यस्पष्टोऽस्तोकपुण्यदः । अस्तामित्रोऽस्तरूपश्चास्खलत्सुगतिदायकः ॥ ॥ कार्तिकेयः कामरूपः कुमारः क्रौञ्चदारणः
    । कामदः कारणं काम्यः कमनीयः कृपाकरः ॥ ॥ काञ्चनाभः कान्तियुक्तः कामी कामप्रदः कविः । कीर्तिकृत्कुक्कुटधरः
    कूटस्थः कुवलेक्षणः ॥ ॥ कुङ्कुमाङ्गः क्लमहरः कुशलः कुक्कुटध्वजः । कुशानुसम्भवः क्रूरः क्रूरघ्नः कलितापहृत्
    ॥ ॥ कामरूपः कल्पतरुः कान्तः कामितदायकः । कल्याणकृत्क्लेशनाशः कृपालुः करुणाकरः ॥ ॥ कलुषघ्नः क्रियाशक्तिः
    कठोरः कवची कृती । कोमलाङ्गः कुशप्रीतः कुत्सितघ्नः कलाधरः ॥ ॥ ख्यातः खेटधरः खड्गी खट्वाङ्गी खलनिग्रहः
    । ख्यातिप्रदः खेचरेशः ख्यातेहः खेचरस्तुतः ॥ ॥ खरतापहरः स्वस्थः खेचरः खेचराश्रयः । खण्डेन्दुमौलितनयः
    खेलः खेचरपालकः ॥ ॥ खस्थलः खण्डितार्कश्च खेचरीजनपूजितः । गाङ्गेयो गिरिजापुत्रो गणनाथानुजो गुहः ॥ ॥
    गोप्ता गीर्वाणसंसेव्यो गुणातीतो गुहाश्रयः । गतिप्रदो गुणनिधिः गम्भीरो गिरिजात्मजः ॥ ॥ गूढरूपो गदहरो
    गुणाधीशो गुणाग्रणीः । गोधरो गहनो गुप्तो गर्वघ्नो गुणवर्धनः ॥ ॥ गुह्यो गुणज्ञो गीतिज्ञो गतातङ्को गुणाश्रयः
    । गद्यपद्यप्रियो गुण्यो गोस्तुतो गगनेचरः ॥ ॥ गणनीयचरित्रश्च गतक्लेशो गुणार्णवः । घूर्णिताक्षो घृणिनिधिः
    घनगम्भीरघोषणः ॥ ॥ घण्टानादप्रियो घोषो घोराघौघविनाशनः । घनानन्दो घर्महन्ता घृणावान् घृष्टिपातकः ॥ ॥
    घृणी घृणाकरो घोरो घोरदैत्यप्रहारकः । घटितैश्वर्यसन्दोहो घनार्थो घनसङ्क्रमः ॥ ॥ चित्रकृच्चित्रवर्णश्च
    चञ्चलश्चपलद्युतिः । चिन्मयश्चित्स्वरूपश्च चिरानन्दश्चिरन्तनः ॥ ॥ चित्रकेलिश्चित्रतरश्चिन्तनीयश्चमत्कृतिः
    । चोरघ्नश्चतुरश्चारुश्चामीकरविभूषणः ॥ ॥ चन्द्रार्ककोटिसदृशश्चन्द्रमौलितनूभवः । छादिताङ्गश्छद्महन्ता
    छेदिताखिलपातकः ॥ ॥ छेदीकृततमःक्लेशश्छत्रीकृतमहायशाः । छादिताशेषसन्तापश्छुरितामृतसागरः ॥ ॥ छन्नत्रैगुण्यरूपश्च
    छातेहश्छिन्नसंशयः । छन्दोमयश्छन्दगामी छिन्नपाशश्छविश्छदः ॥ ॥ जगद्धितो जगत्पूज्यो जगज्ज्येष्ठो जगन्मयः
    । जनको जाह्नवीसूनुर्जितामित्रो जगद्गुरुः ॥ ॥ जयी जितेन्द्रियो जैत्रो जरामरणवर्जितः । ज्योतिर्मयो जगन्नाथो
    जगज्जीवो जनाश्रयः ॥ ॥ जगत्सेव्यो जगत्कर्ता जगत्साक्षी जगत्प्रियः । जम्भारिवन्द्यो जयदो जगज्जनमनोहरः
    ॥ ॥ जगदानन्दजनको जनजाड्यापहारकः । जपाकुसुमसङ्काशो जनलोचनशोभनः ॥ ॥ जनेश्वरो जितक्रोधो जनजन्मनिबर्हणः
    । जयदो जन्तुतापघ्नो जितदैत्यमहाव्रजः ॥ ॥ जितमायो जितक्रोधो जितसङ्गो जनप्रियः । झञ्झानिलमहावेगो झरिताशेषपातकः
    ॥ ॥ झर्झरीकृतदैत्यौघो झल्लरीवाद्यसम्प्रियः । ज्ञानमूर्तिर्ज्ञानगम्यो ज्ञानी ज्ञानमहानिधिः ॥ ॥ टङ्कारनृत्तविभवः
    टङ्कवज्रध्वजाङ्कितः । टङ्किताखिललोकश्च टङ्कितैनस्तमोरविः ॥ ॥ डम्बरप्रभवो डम्भो डम्बो डमरुकप्रियः ।
    डमरोत्कटसन्नादो डिम्भरूपस्वरूपकः ॥ ॥ ढक्कानादप्रीतिकरो ढालितासुरसङ्कुलः । ढौकितामरसन्दोहो ढुण्ढिविघ्नेश्वरानुजः
    ॥ ॥ तत्त्वज्ञस्तत्वगस्तीव्रस्तपोरूपस्तपोमयः । त्रयीमयस्त्रिकालज्ञस्त्रिमूर्तिस्त्रिगुणात्मकः ॥ ॥ त्रिदशेशस्तारकारिस्तापघ्नस्तापसप्रियः
    । तुष्टिदस्तुष्टिकृत्तीक्ष्णस्तपोरूपस्त्रिकालवित् ॥ ॥ स्तोता स्तव्यः स्तवप्रीतः स्तुतिः स्तोत्रं स्तुतिप्रियः
    । स्थितः स्थायी स्थापकश्च स्थूलसूक्ष्मप्रदर्शकः ॥ ॥ स्थविष्ठः स्थविरः स्थूलः स्थानदः स्थैर्यदः स्थिरः
    । दान्तो दयापरो दाता दुरितघ्नो दुरासदः ॥ ॥ दर्शनीयो दयासारो देवदेवो दयानिधिः । दुराधर्षो दुर्विगाह्यो
    दक्षो दर्पणशोभितः ॥ ॥ दुर्धरो दानशीलश्च द्वादशाक्षो द्विषड्भुजः । द्विषट्कर्णो द्विषड्बाहुर्दीनसन्तापनाशनः
    ॥ ॥ दन्दशूकेश्वरो देवो दिव्यो दिव्याकृतिर्दमः । दीर्घवृत्तो दीर्घबाहुर्दीर्घदृष्टिर्दिवस्पतिः ॥ ॥
    दण्डो दमयिता दर्पो देवसिंहो दृढव्रतः । दुर्लभो दुर्गमो दीप्तो दुष्प्रेक्ष्यो दिव्यमण्डनः ॥ ॥ दुरोदरघ्नो
    दुःखघ्नो दुरारिघ्नो दिशां पतिः । दुर्जयो देवसेनेशो दुर्ज्ञेयो दुरतिक्रमः ॥ ॥ दम्भो दृप्तश्च देवर्षिर्दैवज्ञो
    दैवचिन्तकः । धुरन्धरो धर्मपरो धनदो धृतिवर्धनः ॥ ॥ धर्मेशो धर्मशास्त्रज्ञो धन्वी धर्मपरायणः । धनाध्यक्षो
    धनपतिर्धृतिमान्धूतकिल्बिषः ॥ ॥ धर्महेतुर्धर्मशूरो धर्मकृद्धर्मविद्ध्रुवः । धाता धीमान्धर्मचारी धन्यो
    धुर्यो धृतव्रतः ॥ ॥ नित्योत्सवो नित्यतृप्तो निर्लेपो निश्चलात्मकः । निरवद्यो निराधारो निष्कलङ्को निरञ्जनः
    ॥ ॥ निर्ममो निरहङ्कारो निर्मोहो निरुपद्रवः । नित्यानन्दो निरातङ्को निष्प्रपञ्चो निरामयः ॥ ॥ निरवद्यो
    निरीहश्च निर्दर्शो निर्मलात्मकः । नित्यानन्दो निर्जरेशो निःसङ्गो निगमस्तुतः ॥ ॥ निष्कण्टको निरालम्बो
    निष्प्रत्यूहो निरुद्भवः । नित्यो नियतकल्याणो निर्विकल्पो निराश्रयः ॥ ॥ नेता निधिर्नैकरूपो निराकारो
    नदीसुतः । पुलिन्दकन्यारमणः पुरुजित्परमप्रियः ॥ ॥ प्रत्यक्षमूर्तिः प्रत्यक्षः परेशः पूर्णपुण्यदः ।
    पुण्याकरः पुण्यरूपः पुण्यः पुण्यपरायणः ॥ ॥ पुण्योदयः परं ज्योतिः पुण्यकृत्पुण्यवर्धनः । परानन्दः परतरः
    पुण्यकीर्तिः पुरातनः ॥ ॥ प्रसन्नरूपः प्राणेशः पन्नगः पापनाशनः । प्रणतार्तिहरः पूर्णः पार्वतीनन्दनः
    प्रभुः ॥ ॥ पूतात्मा पुरुषः प्राणः प्रभवः पुरुषोत्तमः । प्रसन्नः परमस्पष्टः परः परिबृढः परः ॥ ॥ परमात्मा
    परब्रह्म परार्थः प्रियदर्शनः । पवित्रः पुष्टिदः पूर्तिः पिङ्गलः पुष्टिवर्धनः ॥ ॥ पापहारी पाशधरः प्रमत्तासुरशिक्षकः
    । पावनः पावकः पूज्यः पूर्णानन्दः परात्परः ॥ ॥ पुष्कलः प्रवरः पूर्वः पितृभक्तः पुरोगमः । प्राणदः प्राणिजनकः
    प्रदिष्टः पावकोद्भवः ॥ ॥ परब्रह्मस्वरूपश्च परमैश्वर्यकारणम् । परर्धिदः पुष्टिकरः प्रकाशात्मा प्रतापवान्
    ॥ ॥ प्रज्ञापरः प्रकृष्टार्थः पृथुः पृथुपराक्रमः । फणीश्वरः फणिवरः फणामणिविभूषणः ॥ ॥ फलदः फलहस्तश्च
    फुल्लाम्बुजविलोचनः । फडुच्चाटितपापौघः फणिलोकविभूषणः ॥ ॥ बाहुलेयो बृहद्रूपो बलिष्ठो बलवान् बली । ब्रह्मेशविष्णुरूपश्च
    बुद्धो बुद्धिमतां वरः ॥ ॥ बालरूपो ब्रह्मगर्भो ब्रह्मचारी बुधप्रियः । बहुश्रुतो बहुमतो ब्रह्मण्यो ब्राह्मणप्रियः
    ॥ ॥ बलप्रमथनो ब्रह्मा बहुरूपो बहुप्रदः । बृहद्भानुतनूद्भूतो बृहत्सेनो बिलेशयः ॥ ॥ बहुबाहुर्बलश्रीमान्
    बहुदैत्यविनाशकः । बिलद्वारान्तरालस्थो बृहच्छक्तिधनुर्धरः ॥ ॥ बालार्कद्युतिमान् बालो बृहद्वक्षा बृहद्धनुः
    । भव्यो भोगीश्वरो भाव्यो भवनाशो भवप्रियः ॥ ॥ भक्तिगम्यो भयहरो भावज्ञो भक्तसुप्रियः । भुक्तिमुक्तिप्रदो
    भोगी भगवान् भाग्यवर्धनः ॥ ॥ भ्राजिष्णुर्भावनो भर्ता भीमो भीमपराक्रमः । भूतिदो भूतिकृद्भोक्ता भूतात्मा
    भुवनेश्वरः ॥ ॥ भावको भीकरो भीष्मो भावकेष्टो भवोद्भवः । भवतापप्रशमनो भोगवान् भूतभावनः ॥ ॥ भोज्यप्रदो
    भ्रान्तिनाशो भानुमान् भुवनाश्रयः । भूरिभोगप्रदो भद्रो भजनीयो भिषग्वरः ॥ ॥ महासेनो महोदारो महाशक्तिर्महाद्युतिः
    । महाबुद्धिर्महावीर्यो महोत्साहो महाबलः ॥ ॥ महाभोगी महामायी मेधावी मेखली महान् । मुनिस्तुतो महामान्यो
    महानन्दो महायशाः ॥ ॥ महोर्जितो माननिधिर्मनोरथफलप्रदः । महोदयो महापुण्यो महाबलपराक्रमः ॥ ॥ मानदो मतिदो
    माली मुक्तामालाविभूषणः । मनोहरो महामुख्यो महर्धिर्मूर्तिमान्मुनिः ॥ ॥ महोत्तमो महोपायो मोक्षदो मङ्गलप्रदः
    । मुदाकरो मुक्तिदाता महाभोगो महोरगः ॥ ॥ यशस्करो योगयोनिर्योगिष्ठो यमिनां वरः । यशस्वी योगपुरुषो योग्यो
    योगनिधिर्यमी ॥ ॥ यतिसेव्यो योगयुक्तो योगविद्योगसिद्धिदः । यन्त्रो यन्त्री च यन्त्रज्ञो यन्त्रवान्यन्त्रवाहकः
    ॥ ॥ यातनारहितो योगी योगीशो योगिनां वरः । रमणीयो रम्यरूपो रसज्ञो रसभावनः ॥ ॥ रञ्जनो रञ्जितो रागी रुचिरो
    रुद्रसम्भवः । रणप्रियो रणोदारो रागद्वेषविनाशनः ॥ ॥ रत्नार्ची रुचिरो रम्यो रूपलावण्यविग्रहः । रत्नाङ्गदधरो
    रत्नभूषणो रमणीयकः ॥ ॥ रुचिकृद्रोचमानश्च रञ्जितो रोगनाशनः । राजीवाक्षो राजराजो रक्तमाल्यानुलेपनः ॥
    ॥ राजद्वेदागमस्तुत्यो रजःसत्त्वगुणान्वितः । रजनीशकलारम्यो रत्नकुण्डलमण्डितः ॥ ॥ रत्नसन्मौलिशोभाढ्यो
    रणन्मञ्जीरभूषणः । लोकैकनाथो लोकेशो ललितो लोकनायकः ॥ ॥ लोकरक्षो लोकशिक्षो लोकलोचनरञ्जितः । लोकबन्धुर्लोकधाता
    लोकत्रयमहाहितः ॥ ॥ लोकचूडामणिर्लोकवन्द्यो लावण्यविग्रहः । लोकाध्यक्षस्तु लीलावान्लोकोत्तरगुणान्वितः
    ॥ ॥ वरिष्ठो वरदो वैद्यो विशिष्टो विक्रमो विभुः । विबुधाग्रचरो वश्यो विकल्पपरिवर्जितः ॥ ॥ विपाशो विगतातङ्को
    विचित्राङ्गो विरोचनः । विद्याधरो विशुद्धात्मा वेदाङ्गो विबुधप्रियः ॥ ॥ वचस्करो व्यापकश्च विज्ञानी
    विनयान्वितः । विद्वत्तमो विरोधिघ्नो वीरो विगतरागवान् ॥ ॥ वीतभावो विनीतात्मा वेदगर्भो वसुप्रदः । विश्वदीप्तिर्विशालाक्षो
    विजितात्मा विभावनः ॥ ॥ वेदवेद्यो विधेयात्मा वीतदोषश्च वेदवित् । विश्वकर्मा वीतभयो वागीशो वासवार्चितः
    ॥ ॥ वीरध्वंसो विश्वमूर्तिर्विश्वरूपो वरासनः । विशाखो विमलो वाग्मी विद्वान्वेदधरो वटुः ॥ ॥ वीरचूडामणिर्वीरो
    विद्येशो विबुधाश्रयः । विजयी विनयी वेत्ता वरीयान्विरजा वसुः ॥ ॥ वीरघ्नो विज्वरो वेद्यो वेगवान्वीर्यवान्वशी
    । वरशीलो वरगुणो विशोको वज्रधारकः ॥ ॥ शरजन्मा शक्तिधरः शत्रुघ्नः शिखिवाहनः । श्रीमान् शिष्टः शुचिः
    शुद्धः शाश्वतः श्रुतिसागरः ॥ ॥ शरण्यः शुभदः शर्म शिष्टेष्टः शुभलक्षणः । शान्तः शूलधरः श्रेष्ठः शुद्धात्मा
    शङ्करः शिवः ॥ ॥ शितिकण्ठात्मजः शूरः शान्तिदः शोकनाशनः । षाण्मातुरः षण्मुखश्च षड्गुणैश्वर्यसंयुतः ॥
    ॥ षट्चक्रस्थः षडूर्मिघ्नः षडङ्गश्रुतिपारगः । षड्भावरहितः षट्कः षट्छास्त्रस्मृतिपारगः ॥ ॥ षड्वर्गदाता
    षड्ग्रीवः षडरिघ्नः षडाश्रयः । षट्किरीटधरः श्रीमान् षडाधारश्च षट्क्रमः ॥ ॥ षट्कोणमध्यनिलयः षण्डत्वपरिहारकः
    । सेनानीः सुभगः स्कन्दः सुरानन्दः सतां गतिः ॥ ॥ सुब्रह्मण्यः सुराध्यक्षः सर्वज्ञः सर्वदः सुखी । सुलभः
    सिद्धिदः सौम्यः सिद्धेशः सिद्धिसाधनः ॥ ॥ सिद्धार्थः सिद्धसङ्कल्पः सिद्धसाधुः सुरेश्वरः । सुभुजः सर्वदृक्साक्षी
    सुप्रसादः सनातनः ॥ ॥ सुधापतिः स्वयञ्ज्योतिः स्वयम्भूः सर्वतोमुखः । समर्थः सत्कृतिः सूक्ष्मः सुघोषः
    सुखदः सुहृत् ॥ ॥ सुप्रसन्नः सुरश्रेष्ठः सुशीलः सत्यसाधकः । सम्भाव्यः सुमनाः सेव्यः सकलागमपारगः ॥ ॥
    सुव्यक्तः सच्चिदानन्दः सुवीरः सुजनाश्रयः । सर्वलक्षणसम्पन्नः सत्यधर्मपरायणः ॥ ॥ सर्वदेवमयः सत्यः सदा
    मृष्टान्नदायकः । सुधापी सुमतिः सत्यः सर्वविघ्नविनाशनः ॥ ॥ सर्वदुःखप्रशमनः सुकुमारः सुलोचनः । सुग्रीवः
    सुधृतिः सारः सुराराध्यः सुविक्रमः ॥ ॥ सुरारिघ्नः स्वर्णवर्णः सर्पराजः सदा शुचिः । सप्तार्चिर्भूः सुरवरः
    सर्वायुधविशारदः ॥ ॥ हस्तिचर्माम्बरसुतो हस्तिवाहनसेवितः । हस्तचित्रायुधधरो हृताघो हसिताननः ॥ ॥ हेमभूषो
    हरिद्वर्णो हृष्टिदो हृष्टिवर्धनः । हेमाद्रिभिद्धंसरूपो हुङ्कारहतकिल्बिषः ॥ ॥ हिमाद्रिजातातनुजो हरिकेशो
    हिरण्मयः । हृद्यो हृष्टो हरिसखो हंसो हंसगतिर्हविः ॥ ॥ हिरण्यवर्णो हितकृद्धर्षदो हेमभूषणः । हरप्रियो
    हितकरो हतपापो हरोद्भवः ॥ ॥ क्षेमदः क्षेमकृत्क्षेम्यः क्षेत्रज्ञः क्षामवर्जितः । क्षेत्रपालः क्षमाधारः
    क्षेमक्षेत्रः क्षमाकरः ॥ ॥ क्षुद्रघ्नः क्षान्तिदः क्षेमः क्षितिभूषः क्षमाश्रयः । क्षालिताघः क्षितिधरः
    क्षीणसंरक्षणक्षमः ॥ ॥ क्षणभङ्गुरसन्नद्धघनशोभिकपर्दकः । क्षितिभृन्नाथतनयामुखपङ्कजभास्करः ॥ ॥ क्षताहितः
    क्षरः क्षन्ता क्षतदोषः क्षमानिधिः । क्षपिताखिलसन्तापः क्षपानाथसमाननः ॥ ॥ उत्तर न्यासः । करन्यासः ॐ
    शं ओङ्कारस्वरूपाय ओजोधराय ओजस्विने सुहृदयाय हृष्टचित्तात्मने भास्वररूपाय अङ्गुष्ठाभ्यां नमः । ॐ रं
    षट्कोणमध्यनिलयाय षट्किरीटधराय श्रीमते षडाधाराय तर्जनीभ्यां नमः । ॐ वं षण्मुखाय शरजन्मने शुभलक्षणाय
    शिखिवाहनाय मध्यमाभ्यां नमः । ॐ णं कृशानुसम्भवाय कवचिने कुक्कुटध्वजाय अनामिकाभ्यां नमः । ॐ भं कन्दर्पकोटिदीप्यमानाय
    द्विषड्बाहवे द्वादशाक्षाय कनिष्ठिकाभ्यां नमः । ॐ वं खेटधराय खड्गिने शक्तिहस्ताय करतलकरपृष्ठाभ्यां
    नमः । हृदयादिन्यासः ॐ शं ओङ्कारस्वरूपाय ओजोधराय ओजस्विने सुहृदयाय हृष्टचित्तात्मने भास्वररूपाय हृदयाय
    नमः । ॐ रं षट्कोणमध्यनिलयाय षट्किरीटधराय श्रीमते षडाधाराय शिरसे स्वाहा । ॐ वं षण्मुखाय शरजन्मने शुभलक्षणाय
    शिखिवाहनाय शिखायै वषट् । ॐ णं कृशानुसम्भवाय कवचिने कुक्कुटध्वजाय कवचाय हुम् । ॐ भं कन्दर्पकोटिदीप्यमानाय
    द्विषड्बाहवे द्वादशाक्षाय नेत्रत्रयाय वौषट् । ॐ वं खेटधराय खड्गिने शक्तिहस्ताय अस्त्राय फट् । भूर्भुवस्सुवरोमिति
    दिग्विमोकः । फलश्रुति । इति नाम्नां सहस्राणि षण्मुखस्य च नारद । यः पठेच्छृणुयाद्वापि भक्तियुक्तेन
    चेतसा ॥ ॥ स सद्यो मुच्यते पापैर्मनोवाक्कायसम्भवैः । आयुर्वृद्धिकरं पुंसां स्थैर्यवीर्यविवर्धनम् ॥
    ॥ वाक्येनैकेन वक्ष्यामि वाञ्छितार्थं प्रयच्छति । तस्मात्सर्वात्मना ब्रह्मन्नियमेन जपेत्सुधीः ॥ ॥ इति
    स्कन्दपुराणे ईश्वरप्रोक्ते ब्रह्मनारदसंवादे श्री सुब्रह्मण्य सहस्रनाम स्तोत्रम् ।
