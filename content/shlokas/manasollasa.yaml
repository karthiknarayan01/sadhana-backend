id: manasollasa
category: stotram
name:
  english: manasollasa
  devanagari: मनसोल्लस
content:
  english: '|| shri shivamastu || ayi bhratashcetah paramamupadesham shrunu mama smararerarcayam patushukaraneshu
    smara phalam | tavaisham preshyanamuparatikritishranti mahati tvayaikena shvasaprashamasamaye kinnu
    sukaram || 1|| atisthemasphitanapi shikharinah pashya calitan kiyamtam va kalam kisalayamridu sthasyati
    vapuh | asare''sminpujamayi hridaya shambhorna kurushe kadedrik te labhyam kathaya jada tamtropakaranam
    || 2|| idanimatyalpeshvayi hridaya karyeshvati mahan iyan vyasamgaste na kalayasi yena smararipum
    || atikramdadbamdhuvyasanajaladhavarti samaye kiyanagamta te shiva shiva hatosmyeva bhavata || 3||
    aye cetashshastranyadhikamavagudhannyapi mudha na yadyasajjethah pashupatipadambhojabhajane | tadittham
    bhoktavyam khalu punarapi pretya bhuvane mahadduhkham varnagrahanasamayopakramamidam || 4|| kiyamto
    na bhuvan hridayaparamapremavishayah purajanmasvadya kva gatamiti janasi kimu tan | vridha moham bmdhushvahitaparinamam
    tyaja sakhe yadasevadoshat smarasi na kada''pi smararipum || 5|| ami cet putradya'
  devanagari: ॥ श्री शिवमस्तु ॥ अयि भ्रातश्चेतः परममुपदेशं श्रुणु मम स्मरारेरर्चायां पटुषुकरणेषु स्मर
    फलम् । तवैषां प्रेष्याणामुपरतिकृतिश्रान्ति महति त्वायैकेन श्वासप्रशमसमये किन्नु सुकरम् ॥ १॥ अतिस्थेमस्फीतानपि
    शिखरिणः पश्य चलितान् कियंतं वा कालं किसलयमृदु स्थास्यति वपुः । असारेऽस्मिन्पूजांअयि हृदय शंभोर्न कुरुषे
    कदेदृक् ते लभ्यं कथय जड तंत्रोपकरणम् ॥ २॥ इदानीमत्यल्पेष्वयि हृदय कार्येष्वति महान् इयान् व्यासंगस्ते
    न कलयसि येन स्मररिपुम् ॥ अतिक्रंदद्बंधुव्यसनजलधावर्ति समये कियानागंता ते शिव शिव हतोस्म्येव भवता ॥
    ३॥ अये चेतश्शास्त्राण्यधिकमवगूढान्न्यपि मुधा न यद्यासज्जेथाः पशुपतिपदांभोजभजने । तदित्थं भोक्तव्यं
    खलु पुनरपि प्रेत्य भुवने महद्दुःखं वर्णग्रहणसमयोपक्रममिदम् ॥ ४॥ कियंतो ना भूवन् हृदयपरमप्रेमविषयाः
    पुराजन्मस्वद्य क्व गतमिति जानासि किमु तान् । वृधा मोहं ब्ंधुष्वहितपरिणामं त्यज सखे यदासेवादोषात् स्मरसि
    न कदाऽपि स्मररिपुम् ॥ ५॥ अमी चेत् पुत्राद्या
