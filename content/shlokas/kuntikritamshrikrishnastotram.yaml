id: kuntikritamshrikrishnastotram
category: stotram
name:
  english: kuntikritamshrikrishnastotram
  devanagari: कुन्तिकृतंश्रीकृष्णस्तोत्रम्
content:
  english: kuntikritam shrikrishnastotram kuntyuvaca | namasye purusham tvadyamishvaram prakriteh param
    | alakshyam sarvabhutanamantarbahiravasthitam || 18|| mayajavanikacchannamajnadhokshajamavyayam |
    na lakshyase mudhadrisha nato natyadharo yatha || 19|| tatha paramahamsanam muninamamalatmanam | bhaktiyogavidhanartham
    katham pashyema hi striyah || 20|| krishnaya vasudevaya devakinandanaya ca | nandagopakumaraya govindaya
    namo namah || 21|| namah pankajanabhaya namah pankajamaline | namah pankajanetraya namaste pankajanghraye
    || 22|| yatha hrishikesha khalena devaki kamsena ruddhaticiram shucarpita | vimocitaham ca sahatmaja
    vibho tvayaiva nathena muhurvipadganat || 23|| vishanmahagneh purushadadarshana
  devanagari: कुन्तिकृतं श्रीकृष्णस्तोत्रम् कुन्त्युवाच । नमस्ये पुरुषं त्वाद्यमीश्वरं प्रकृतेः परम् ।
    अलक्ष्यं सर्वभूतानामन्तर्बहिरवस्थितम् ॥ १८॥ मायाजवनिकाच्छन्नमज्ञाधोक्षजमव्ययम् । न लक्ष्यसे मूढदृशा
    नटो नाट्यधरो यथा ॥ १९॥ तथा परमहंसानां मुनीनाममलात्मनाम् । भक्तियोगविधानार्थं कथं पश्येम हि स्त्रियः
    ॥ २०॥ कृष्णाय वासुदेवाय देवकीनन्दनाय च । नन्दगोपकुमाराय गोविन्दाय नमो नमः ॥ २१॥ नमः पङ्कजनाभाय नमः
    पङ्कजमालिने । नमः पङ्कजनेत्राय नमस्ते पङ्कजाङ्घ्रये ॥ २२॥ यथा हृषीकेश खलेन देवकी कंसेन रुद्धातिचिरं
    शुचार्पिता । विमोचिताहं च सहात्मजा विभो त्वयैव नाथेन मुहुर्विपद्गणात् ॥ २३॥ विषान्महाग्नेः पुरुषाददर्शना
