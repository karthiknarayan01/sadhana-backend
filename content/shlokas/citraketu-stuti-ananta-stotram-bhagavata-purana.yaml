id: citraketu-stuti-ananta-stotram-bhagavata-purana
category: stotram
name:
  english: Citraketu Stuti (Ananta Stotram Bhagavata Purana)
content:
  english: citraketuruvaca | ajita jitah samamatibhih sadhubhi rbhavan jitatmabhirbhavata | vijitaste'pi
    ca bhajatamakamatmanam ya atmado'tikarunah || || tava vibhavah khalu bhagavan jagadudayasthitilayadini
    | vishvasrijastem'shamshastatra mrisha spardhante prithagabhimatya || || paramanuparamamahatostva
    madyantantaravarti trayavidhurah | adavante'pi ca sattvanam yaddhruvam tadevantarale'pi || || kshityadibhiresha
    kilavritah saptabhirdashagunottarairandakoshah | yatra patatyanukalpah sahandakotikotibhistadanantah
    || || vishayatrisho narapashavo ya upasate vibhutirna param tvam | teshamashisha isha tadanu vinashyanti
    yatha rajakulam || || kamadhiyastvayi racita na parama rohanti yatha karambhabijani | jnanatmanyagunamaye
    gunaganato'sya dvandvajalani || || jitamajita tada bhavata yadaha bhagavatam dharmamanavadyam | nishkincana
    ye munaya atmarama yamupasate'pavargaya || || vishamamatirna yatra nrinam tvamahamiti mama taveti
    ca yadanyatra | vishamadhiya racito yah sa hyavishuddhah kshayishnuradharmabahulah || || kah kshemo
    nijaparayoh kiyanarthah svaparadruha dharmena | svadrohattava kopah parasampidaya ca tathadharmah
    || || na vyabhicarati taveksha yaya hyabhihito bhagavato dharmah | sthiracarasattvakadambeshvaprithagdhiyo
    yamupasate tvaryah || || na hi bhagavannaghatitamidam tvaddarshanannrinamakhilapapakshayah | yannama
    sakricchravanatpulkasako'pi vimucyate samsarat || || atha bhagavan vayamadhuna tvadavalokaparimrishtashayamalah
    | surarishina yaduditam tavakena kathamanyatha bhavati || || viditamananta samastam tava jagadatmano
    janairihacaritam | vijnapyam paramaguroh kiyadiva savituriva khadyotaih || || namastubhyam bhagavate
    sakalajaga tsthitilayodayeshaya | duravasitatmagataye kuyoginam bhida paramahamsaya || || yam vai
    shvasantamanu vishvasrijah shvasanti yam cekitanamanu cittaya uccakanti | bhumandalam sarshapayati
    yasya murdhni tasmai namo bhagavate'stu sahasramurdhne || || || iti shrimadbhagavatamahapurane shashthaskandhe
    shodashadhyayantargatam citraketukritam anantastotram ||
  devanagari: चित्रकेतुरुवाच । अजित जितः सममतिभिः साधुभि र्भवान् जितात्मभिर्भवता । विजितास्तेऽपि च भजतामकामात्मनां
    य आत्मदोऽतिकरुणः ॥ ॥ तव विभवः खलु भगवन् जगदुदयस्थितिलयादीनि । विश्वसृजस्तेंऽशांशास्तत्र मृषा स्पर्धन्ते
    पृथगभिमत्या ॥ ॥ परमाणुपरममहतोस्त्व माद्यन्तान्तरवर्ती त्रयविधुरः । आदावन्तेऽपि च सत्त्वानां यद्ध्रुवं
    तदेवान्तरालेऽपि ॥ ॥ क्षित्यादिभिरेष किलावृतः सप्तभिर्दशगुणोत्तरैरण्डकोशः । यत्र पतत्यणुकल्पः सहाण्डकोटिकोटिभिस्तदनन्तः
    ॥ ॥ विषयतृषो नरपशवो य उपासते विभूतीर्न परं त्वाम् । तेषामाशिष ईश तदनु विनश्यन्ति यथा राजकुलम् ॥ ॥
    कामधियस्त्वयि रचिता न परम रोहन्ति यथा करम्भबीजानि । ज्ञानात्मन्यगुणमये गुणगणतोऽस्य द्वन्द्वजालानि
    ॥ ॥ जितमजित तदा भवता यदाह भागवतं धर्ममनवद्यम् । निष्किञ्चना ये मुनय आत्मारामा यमुपासतेऽपवर्गाय ॥ ॥
    विषममतिर्न यत्र नृणां त्वमहमिति मम तवेति च यदन्यत्र । विषमधिया रचितो यः स ह्यविशुद्धः क्षयिष्णुरधर्मबहुलः
    ॥ ॥ कः क्षेमो निजपरयोः कियानर्थः स्वपरद्रुहा धर्मेण । स्वद्रोहात्तव कोपः परसम्पीडया च तथाधर्मः ॥ ॥
    न व्यभिचरति तवेक्षा यया ह्यभिहितो भागवतो धर्मः । स्थिरचरसत्त्वकदम्बेष्वपृथग्धियो यमुपासते त्वार्याः
    ॥ ॥ न हि भगवन्नघटितमिदं त्वद्दर्शनान्नृणामखिलपापक्षयः । यन्नाम सकृच्छ्रवणात्पुल्कसकोऽपि विमुच्यते
    संसारात् ॥ ॥ अथ भगवन् वयमधुना त्वदवलोकपरिमृष्टाशयमलाः । सुरऋषिणा यदुदितं तावकेन कथमन्यथा भवति ॥ ॥
    विदितमनन्त समस्तं तव जगदात्मनो जनैरिहाचरितम् । विज्ञाप्यं परमगुरोः कियदिव सवितुरिव खद्योतैः ॥ ॥ नमस्तुभ्यं
    भगवते सकलजग त्स्थितिलयोदयेशाय । दुरवसितात्मगतये कुयोगिनां भिदा परमहंसाय ॥ ॥ यं वै श्वसन्तमनु विश्वसृजः
    श्वसन्ति यं चेकितानमनु चित्तय उच्चकन्ति । भूमण्डलं सर्षपायति यस्य मूर्ध्नि तस्मै नमो भगवतेऽस्तु सहस्रमूर्ध्ने
    ॥ ॥ ॥ इति श्रीमद्भागवतमहापुराणे षष्ठस्कन्धे षोडशाध्यायान्तर्गतं चित्रकेतुकृतं अनन्तस्तोत्रम् ॥
