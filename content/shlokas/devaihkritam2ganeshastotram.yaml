id: devaihkritam2ganeshastotram
category: stotram
name:
  english: devaihkritam2ganeshastotram
  devanagari: देवैःकृतं२गणेशस्तोत्रम्
content:
  english: 30|| bhaktipriyaya devaya ganadhyaksha namo'stu te || iti skandapurane brahmakhande dharmaranyakhande
    dvadashadhyayantargatam devaih kritam ganeshastotram samaptam | skandapurana | brahmakhanda | dharmakhanda
    | adhyaya 12
  devanagari: ३०॥ भक्तिप्रियाय देवाय गणाध्यक्ष नमोऽस्तु ते ॥ इति स्कन्दपुराणे ब्रह्मखण्डे धर्मारण्यखण्डे
    द्वादशाध्यायान्तर्गतं देवैः कृतं गणेशस्तोत्रं समाप्तम् । स्कन्दपुराण । ब्राह्मखण्ड । धर्मखण्ड । अध्याय
    १२
meaning: {}
