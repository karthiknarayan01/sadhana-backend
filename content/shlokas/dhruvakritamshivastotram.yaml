id: dhruvakritamshivastotram
category: stotram
name:
  english: dhruvakritamshivastotram
  devanagari: ध्रुवकृतंशिवस्तोत्रम्
content:
  english: stam shankaram sharanadam sharanam vrajami || 11|| yah pathetstavamidam rucirartham manavo
    dhruvakritam niyatatma | viprasamsadi sada shucisiddhah sa prayati shivalokamanadim || 12|| iti shriskandapurane
    prabhasakhande prabhasakshetramahatmye ekatrimshadhikashatatamadhyayantargatam dhruvakritam shivastotram
    samaptam | skandapurana | prabhasakhanda | adhyaya 131
  devanagari: स्तं शङ्करं शरणदं शरणं व्रजामि ॥ ११॥ यः पठेत्स्तवमिदं रुचिरार्थं मानवो ध्रुवकृतं नियतात्मा
    । विप्रसंसदि सदा शुचिसिद्धः स प्रयाति शिवलोकमनादिम् ॥ १२॥ इति श्रीस्कन्दपुराणे प्रभासखण्डे प्रभासक्षेत्रमाहात्म्ये
    एकत्रिंशाधिकशततमाध्यायान्तर्गतं ध्रुवकृतं शिवस्तोत्रं समाप्तम् । स्कन्दपुराण । प्रभासखण्ड । अध्याय
    १३१
meaning: {}
