id: annamayya-keerthanas-radha-madhava-rati-charitamiti
category: stotram
name:
  english: Annamayya Keerthanas Radha Madhava Rati Charitamiti
content:
  english: radhamadhavaraticaritamiti bodhavaham shrutibhushanam || gahane dvavapi gatva gatva rahasi
    ratim prerayati sati | viharatastada vilasantau vihatagrihashau vivashau tau || lajjashabhala vilasalilaya
    kajjalanayana vikarena | hrijjavyavanahita hridaya rati ssajja sambhramacapala jata || purato yantam
    purusham vakulaih kurantakairva kutajairva | paramam praharati pashcallagna giram vinasi vikirati
    mudam || hari surabhuruha marohativa caranena katim samveshtya | parirancana sampaditapulakai ssurucirjata
    sumalatikeva || vidhumukhadarshana vikalitalajja tvadharabimbaphalamasvadya | madhuropayanamargena
    kucau nidhivada tva nityasukhamita || suruciraketaka sumadala nakharai rvaracibukam sa parivritya
    | tarunimasindhau tadiyadrigjala carayugalam samsaktam cakara || vacana vilasairvashikrita tam niculakunja
    manitadeshe | pracurasaikate pallavashayane racitaratikala ragenasa || abhinavakalyanancitarupa vabhinivesha
    samyatacittau | babhuvatu statparau venkata vibhuna sa tadvidhina sataya || saca lajjavikshano bhavati
    tam kacabharam gandham ghrapayati | nacalaticenmanavati tathapi kucasangadanukulayati || avanatashirasapyati
    subhagam vividhalapairvivashayati | pravimala kararuharacana vilasai rbhuvanapati tam bhushayati ||
    latagrihamelanam navasai katavaibhava saukhyam drishtva | tatastatashcarasau keli vratacaryam tam
    vanchantau | vanakusuma vishadavaravasanaya ghanasararajogandhaishca | janayati pavane sapadi vikaram
    vanita purushau janitashau || evam vicaran hela vimukha shrivenkatagiri devoyam | pavanaradhaparirambhasukha
    shri vaibhavasusthiro bhavati ||
  devanagari: राधामाधवरतिचरितमिति बोधावहं श्रुतिभूषणं ॥ गहने द्वावपि गत्वा गत्वा रहसि रतिं प्रेरयति सति
    । विहरतस्तदा विलसन्तौ विहतगृहाशौ विवशौ तौ ॥ लज्जाशभल विलासलीलया कज्जलनयन विकारेण । हृज्जाव्यवनहित
    हृदया रति स्सज्जा सम्भ्रमचपला जाता ॥ पुरतो यान्तं पुरुषं वकुलैः कुरण्टकैर्वा कुटजैर्वा । परमं प्रहरति
    पश्चाल्लग्ना गिरं विनासि विकिरति मुदं ॥ हरि सुरभूरुह मारोहतीव चरणेन कटिं संवेष्ट्य । परिरञ्चण सम्पादितपुलकै
    स्सुरुचिर्जाता सुमलतिकेव ॥ विधुमुखदर्शन विकलितलज्जा त्वधरबिम्बफलमास्वाद्य । मधुरोपायनमार्गेण कुचौ
    निधिवद त्वा नित्यसुखमिता ॥ सुरुचिरकेतक सुमदल नखरै र्वरचिबुकं सा परिवृत्य । तरुणिमसिन्धौ तदीयदृग्जल
    चरयुगलं संसक्तं चकार ॥ वचन विलासैर्वशीकृत तं निचुलकुञ्ज मानितदेशे । प्रचुरसैकते पल्लवशयने रचितरतिकला
    रागेणास ॥ अभिनवकल्याणाञ्चितरूपा वभिनिवेश संयतचित्तौ । बभूवतु स्तत्परौ वेङ्कट विभुना सा तद्विधिना सतया
    ॥ सच लज्जावीक्षणो भवति तं कचभरां गन्धं घ्रापयति । नचलतिचेन्मानवती तथापि कुचसङ्गादनुकूलयति ॥ अवनतशिरसाप्यति
    सुभगं विविधालापैर्विवशयति । प्रविमल कररुहरचन विलासै र्भुवनपति तं भूषयति ॥ लतागृहमेलनं नवसै कतवैभव
    सौख्यं दृष्ट्वा । ततस्ततश्चरसौ केली व्रतचर्यां तां वाञ्छन्तौ । वनकुसुम विशदवरवासनया घनसाररजोगन्धैश्च
    । जनयति पवने सपदि विकारं वनिता पुरुषौ जनिताशौ ॥ एवं विचरन् हेला विमुख श्रीवेङ्कटगिरि देवोयं । पावनराधापरिरम्भसुख
    श्री वैभवसुस्थिरो भवति ॥
