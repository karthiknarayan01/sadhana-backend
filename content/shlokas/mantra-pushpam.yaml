id: mantra-pushpam
category: stotram
name:
  english: Mantra Pushpam
content:
  english: shshrinuyama devah | bhadra mpashyemakshabhiryajatrah | sthirairangai stushtuvagmsastanubhih
    | vyashema devahitam ya~dayuh || svasti na indro vriddhashravah | svasti nah pusha vishvavedah | svastinastarkshyo
    arishtanemih | svasti no brihaspatirdadhatu || om shanti nbhavati | candrama va apa nbhavati || agnirva
    apamayatanam | ayatanava nbhavati | apova agnerayatanam | ayatanava nbhavati || vayurva apamayatanam
    | ayatanava nbhavati | yo vayorayatanam nbhavati | apo vai vayorayatanam | ayatanava nbhavati || asau
    vai tapannapamayatanam | ayatanava 'mushyatapata ayatanam nbhavati | apo va amushyatapata ayatanam
    | ayatanava nbhavati || candrama va apamayatanam | ayatanava nbhavati | yashcandramasa ayatanam nbhavati
    | apo vai candramasa ayatanam | ayatanava nbhavati || nakshatrani va apamayatanam | ayatanava nbhavati
    | yo nakshatranamayatanam nbhavati | apo vai nakshatranamayatanam | ayatanava nbhavati || parjanyo
    va apamayatanam | ayatanava nbhavati | yah parjanyasyayatanam nbhavati | apo vai parjanyasyayatanam
    | ayatanava va~tsaro va apamayatanam | ayatanava nbhavati | apo vai sam va~tsarasyayatanam | ayatanava
    ve~da | pratyeva tishthati || om rajadhirajaya prasahya sahine shravanaya kurmahe | sa me kaman kama
    kamaya mahyam shravano dadatu | kuberaya vaishravanaya | maharajaya namah || o ntatpurornamah || antashcarati
    bhuteshu guhayam vi~shvamurtishu | tvam mindrastvagm rudrastvam ntadapa apo jyotiraso mbrahma bhurbhuvassuvarom
    | ishanassarva vidyanamishvarassarvabhutanam brahmadhipati rbrahma shivo me astu sadashivom | tadvishnoh
    mpadagm sada pashyanti surayah | diviva cakshuratatam | tadvipraso vipanyavo jagrivagm sassamindhate
    | vishnoryatparama mpadam | ritagm satya nkrishnapingalam | urdhvaretam vi~shvarupaya vai namo namah
    || o nnarayanaya vidmahe vasudevaya dhimahi | tanno vishnuh pracodaya
  devanagari: श्शृणु॒याम॑ देवाः । भ॒द्र म्प॑श्येमा॒क्षभि॒र्यज॑त्राः । स्थि॒रैरङ्गै स्तुष्टु॒वाग्ंस॑स्त॒नूभिः॑
    । व्यशे॑म दे॒वहि॑तं॒ यँदायुः॑ ॥ स्व॒स्ति न॒ इन्द्रो॑ वृ॒द्धश्र॑वाः । स्व॑स्ति नः॑ पू॒षा वि॒श्ववे॑दाः
    । स्व॒॒स्तिन॒स्तार्क्ष्यो॒ अरि॑ष्टनेमिः । स्व॒स्ति नो॒ बृह॒स्पति॑र्दधातु ॥ ॐ शान्ति॒ न्भ॑वति । च॒न्द्रमा॒
    वा अ॒पा न्भवति ॥ अ॒ग्निर्वा अ॒पामा॒यत॑नम् । आ॒यत॑नवा न्भवति । आपो॒वा अ॒ग्नेरा॒यत॑नम् । आ॒यत॑नवा न्भवति
    ॥ वा॒युर्वा अ॒पामा॒यत॑नम् । आ॒यत॑नवा न्भवति । यो वा॒योरा॒यत॑नं॒ न्भवति । आपो॒ वै वा॒योरा॒यत॑नम् ।
    आ॒यत॑नवा न्भवति ॥ अ॒सौ वै तप॑न्न॒पामा॒यत॑नम् । आ॒यत॑नवा ऽमुष्य॒तप॑त आ॒यत॑नं॒ न्भवति । आपो॒ वा अ॒मुष्य॒तप॑त
    आ॒यत॑नम् । आ॒यत॑नवा न्भवति ॥ च॒न्द्रमा॒ वा अ॒पामा॒यत॑नम् । आ॒यत॑नवा न्भवति । यश्च॒न्द्रम॑स आ॒यत॑नं॒
    न्भवति । आपो॒ वै च॒न्द्रम॑स आ॒यत॑नम् । आ॒यत॑नवा न्भवति ॥ नक्ष॑त्राणि॒ वा अ॒पामा॒यत॑नम् । आ॒यत॑नवा
    न्भवति । यो नक्ष॑त्राणामा॒यत॑नं॒ न्भवति । आपो॒ वै नक्ष॑त्राणामा॒यत॑नम् । आ॒यत॑नवा न्भवति ॥ प॒र्जन्यो॒
    वा अ॒पामा॒यत॑नम् । आ॒यत॑नवा न्भवति । यः प॒र्जन्य॑स्या॒यत॑नं॒ न्भवति । आपो॒ वै प॒र्जन्य॑स्या॒यत॑नम्
    । आ॒यत॑नवा वँ॒त्स॒रो वा अ॒पामा॒यत॑न॒म् । आ॒यत॑नवा न्भवति । आपो॒ वै सं॑ वँत्स॒रस्या॒यत॑नम् । आ॒यत॑नवा
    वेँद॑ । प्रत्ये॒व ति॑ष्ठति ॥ ॐ रा॒जा॒धि॒रा॒जाय॑ प्रसह्य सा॒हिने श्रव॒णाय॑ कुर्महे । स मे॒ कामा॒न्
    काम॒ कामा॑य॒ मह्यम् श्रव॒णो द॑दातु । कु॒बे॒राय॑ वैश्रव॒णाय॑ । म॒हा॒राजाय॒ नमः॑ ॥ ओ न्तत्पुरो॒र्नमः
    ॥ अन्तश्चरति॑ भूते॒षु गुहायां विँ॑श्वमू॒र्तिषु । त्वं मिन्द्रस्त्वग्ं रुद्रस्त्वं न्त॑दाप॒ आपो॒ ज्योती॒रसो॒
    म्ब्रह्म॒ भूर्भुव॒स्सुव॒रोम् । ईशानस्सर्व॑ विद्या॒नामीश्वरस्सर्व॑भूता॒नां ब्रह्माधि॑पति॒ र्ब्रह्मा॑
    शि॒वो मे॑ अस्तु सदाशि॒वोम् । तद्विष्णोः म्प॒दग्ं सदा॑ पश्यन्ति सू॒रयः॑ । दि॒वीव॒ चक्षु॒रात॑तम् । तद्विप्रा॑सो
    विप॒न्यवो॑ जागृ॒वाग्ं सस्समि॑न्धते । विष्णो॒र्यत्प॑र॒म म्प॒दम् । ऋतग्ं स॒त्य ङ्कृष्ण॒पिङ्ग॑लम् । ऊ॒र्ध्वरे॑तं
    विँ॒श्वरू॑पाय॒ वै नमो॒ नमः॑ ॥ ओ न्ना॒रा॒य॒णाय॑ वि॒द्महे॑ वासुदे॒वाय॑ धीमहि । तन्नो॑ विष्णुः प्रचो॒दया
