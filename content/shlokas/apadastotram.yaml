id: apadastotram
category: stotram
name:
  english: apadastotram
  devanagari: आपादस्तोत्रम्
content:
  english: lakshyambaropamamaparagunamburasheh || 6|| ratnaughacancuphanapancakabhogibhogam svaspardhijetumiva
    dandasupashadhari | satkankanangadasushobhashubhanguliyam hastadvayam mama tanotvabhayam murareh ||
    7|| vakralakam varanasojjvalakundalabhyam yuktam trirekhigalamunnatamaulibandham | vaktram vibhormadhupamauktikamatsyasangha
  devanagari: लक्ष्याम्बरोपममपारगुणाम्बुराशेः ॥ ६॥ रत्नौघचञ्चुफणपञ्चकभोगिभोगं स्वस्पर्धिजेतुमिव दण्डसुपाशधारी
    । सत्कङ्कणाङ्गदसुशोभशुभाङ्गुलीयं हस्तद्वयं मम तनोत्वभयं मुरारेः ॥ ७॥ वक्रालकं वरनसोज्ज्वलकुण्डलाभ्यां
    युक्तं त्रिरेखिगलमुन्नतमौलिबन्धम् । वक्त्रं विभोर्मधुपमौक्तिकमत्स्यसङ्घ
meaning: {}
