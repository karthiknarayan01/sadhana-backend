id: devaihkritam24shivastotram
category: stotram
name:
  english: devaihkritam24shivastotram
  devanagari: देवैःकृतं२४शिवस्तोत्रम्
content:
  english: devaih kritam 24 shivastotram iti samhatya devadya jagmurdrashtum satitapah | pranemustam jagaddhatrim
    tato jagmurharam prati || 69|| dadrishuh sukhamasinam prasannam bhaktavatsalam | yogapattasthitam
    natva tushtuvuh shankaram ca te || 70|| namo'stu tapanashaya shantidaya namonamah | parvatitapasam
    samyak phaladatre namonamah || 71|| yadi tvam ragahinah sanparvatim na grahishyasi | tarhi sa tapasa
    sarvam dhakshyatyetaccaracaram || 72|| kim ca panigrahe tasya devakaryam bhavishyati | tasmattasyai
    vaco datva taporodham kuru drutam || 73|| iti shrilakshminarayaniyasamhitayam prathame kritayugasantane
    186
  devanagari: देवैः कृतं २४ शिवस्तोत्रम् इति संहत्य देवाद्या जग्मुर्द्रष्टुं सतीतपः । प्रणेमुस्तां जगद्धात्रीं
    ततो जग्मुर्हरं प्रति ॥ ६९॥ ददृशुः सुखमासीनं प्रसन्नं भक्तवत्सलम् । योगपट्टस्थितं नत्वा तुष्टुवुः शङ्करं
    च ते ॥ ७०॥ नमोऽस्तु तापनाशाय शान्तिदाय नमोनमः । पार्वतीतपसां सम्यक् फलदात्रे नमोनमः ॥ ७१॥ यदि त्वं
    रागहीनः सन्पार्वतीं न ग्रहीष्यसि । तर्हि सा तपसा सर्वं धक्ष्यत्येतच्चराचरम् ॥ ७२॥ किं च पाणिग्रहे
    तस्या देवकार्यं भविष्यति । तस्मात्तस्यै वचो दत्वा तपोरोधं कुरु द्रुतम् ॥ ७३॥ इति श्रीलक्ष्मीनारायणीयसंहितायां
    प्रथमे कृतयुगसन्ताने १८६
meaning: {}
