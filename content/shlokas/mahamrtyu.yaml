id: mahamrtyu
category: stotram
name:
  english: mahamrtyu
  devanagari: महाम्र्त्यु
content:
  english: mama sarvarishtasamastamrityushantyartham sakalaishvaryapraptyartham jape vinoyogah | atha
    dhyanam | candrarkagnivilocanam smitamukham padmadvayantasthitam mudrapashamrigakshasatravilasatpanim
    himamshuprabham | kotindupragalatsudhaplutatamum haradibhushojjvalam kantam vishvavimohanam pashupatim
    mrityunjayam bhavayet || atha stotram | om rudram pashupatim sthanum nilakanthamumapatim | namami
    shirasa devam kim no mrityuh karishyati || 1|| nilakantham kalamurttim kalajnam kalanashanam | namami
    shirasa devam kim no mrityuh karishyati || 2|| nilakantham virupaksham nirmalam nilayapradam | namami
    shirasa devam kim no mrityuh karishyati || 3|| vamadevam mahadevam lokanatham jagadgurum | namami
    shirasa devam kim no mrityuh karishyati || 4|| devadevam jagannatham devesham vrishabhadhvajam | namami
    shirasa devam kim no mrityuh karishyati || 5|| tryaksham caturbhujam shantam jatamakutadharinam |
    namami shirasa devam kim no mrityuh karishyati || 6|| bhasmoddhulitasarvangam nagabharanabhushitam
    | namami shirasa devam kim no mrityuh karishyati || 7|| anantamavyayam shantam akshamaladharam haram
    | namami shirasa devam kim no mrityuh karishyati || 8|| anandam paramam nityam kaivalyapadadayinam
    | namami shirasa devam kim no mrityuh karishyati || 9|| arddhanarishvaram devam parvatiprananayakam
    | namami shirasa devam kim no mrityuh karishyati || 10|| pralayasthitikarttaramadikarttaramishvaram
    | namami shirasa devam kim no mrityuh karishyati || 11|| vyomakesham virupaksham candrarddhakritashekharam
    | namami shirasa devam kim no mrityuh karishyati || 12|| gangadharam shashidharam shankaram shulapaninam
    | namami shirasa devam kim no mrityuh karishyati || 13||
  devanagari: मम सर्वारिष्टसमस्तमृत्युशान्त्यर्थं सकलैश्वर्यप्राप्त्यर्थं जपे विनोयोगः । अथ ध्यानम् ।
    चन्द्रार्काग्निविलोचनं स्मितमुखं पद्मद्वयान्तस्थितं मुद्रापाशमृगाक्षसत्रविलसत्पाणिं हिमांशुप्रभम्
    । कोटीन्दुप्रगलत्सुधाप्लुततमुं हारादिभूषोज्ज्वलं कान्तं विश्वविमोहनं पशुपतिं मृत्युञ्जयं भावयेत् ॥
    अथ स्तोत्रम् । ॐ रुद्रं पशुपतिं स्थाणुं नीलकण्ठमुमापतिम् । नमामि शिरसा देवं किं नो मृत्युः करिष्यति
    ॥ १॥ नीलकण्ठं कालमूर्त्तिं कालज्ञं कालनाशनम् । नमामि शिरसा देवं किं नो मृत्युः करिष्यति ॥ २॥ नीलकण्ठं
    विरूपाक्षं निर्मलं निलयप्रदम् । नमामि शिरसा देवं किं नो मृत्युः करिष्यति ॥ ३॥ वामदेवं महादेवं लोकनाथं
    जगद्गुरुम् । नमामि शिरसा देवं किं नो मृत्युः करिष्यति ॥ ४॥ देवदेवं जगन्नाथं देवेशं वृषभध्वजम् । नमामि
    शिरसा देवं किं नो मृत्युः करिष्यति ॥ ५॥ त्र्यक्षं चतुर्भुजं शान्तं जटामकुटधारिणम् । नमामि शिरसा देवं
    किं नो मृत्युः करिष्यति ॥ ६॥ भस्मोद्धूलितसर्वाङ्गं नागाभरणभूषितम् । नमामि शिरसा देवं किं नो मृत्युः
    करिष्यति ॥ ७॥ अनन्तमव्ययं शान्तं अक्षमालाधरं हरम् । नमामि शिरसा देवं किं नो मृत्युः करिष्यति ॥ ८॥
    आनन्दं परमं नित्यं कैवल्यपददायिनम् । नमामि शिरसा देवं किं नो मृत्युः करिष्यति ॥ ९॥ अर्द्धनारीश्वरं
    देवं पार्वतीप्राणनायकम् । नमामि शिरसा देवं किं नो मृत्युः करिष्यति ॥ १०॥ प्रलयस्थितिकर्त्तारमादिकर्त्तारमीश्वरम्
    । नमामि शिरसा देवं किं नो मृत्युः करिष्यति ॥ ११॥ व्योमकेशं विरूपाक्षं चन्द्रार्द्धकृतशेखरम् । नमामि
    शिरसा देवं किं नो मृत्युः करिष्यति ॥ १२॥ गङ्गाधरं शशिधरं शङ्करं शूलपाणिनम् । नमामि शिरसा देवं किं
    नो मृत्युः करिष्यति ॥ १३॥
