id: mrtyusanjivana-2
category: kavacha
name:
  english: mrtyusanjivana
  devanagari: म्र्त्युसन्जीवन
content:
  english: rabhayakaro yajva sarvadevanishevitah | mrityunjayo mahadevah pracyam mam patu sarvada || 4||
    dadhanah shaktimabhayam trimukham shadbhujah prabhuh | sadashivo'gnirupi mamagneyyam patu sarvada
    || 5|| ashtadashabhujopeto dandabhayakaro vibhuh | yamarupi mahadevo dakshinasyam sada'vatu || 6||
    khadgabhayakaro dhiro rakshogananishevitah | rakshorupi mahesho mam nairrityam sarvada'vatu || 7||
    pashabhayabhujah sarvaratnakaranishevitah | varunatma mahadevah pashcime mam sada'vatu || 8|| gadabhayakarah
    prananayakah sarvadagatih | vayavyam marutatma mam shankarah patu sarvada || 9|| shankhabhayakarastho
    mam nayakah parameshvarah | sarvatmantaradigbhage patu mam shankarah prabhuh || 10|| shulabhayakarah
    sarvavidyanamadhinayakah | ishanatma tathaishanyam patu mam parameshvarah || 11|| urdhvabhage brahmarupi
    vishvatma'dhah sada'vatu | shiro me shankarah patu lalatam candrashekharah || 12|| bhrumadhyam sarvalokeshastrinetro
    locane'vatu | bhruyugmam girishah patu karnau patu maheshvarah || 13|| nasikam me mahadeva oshthau
    patu vrishadhvajah | jihvam me dakshinamurtirdantanme girisho'vatu || 14|| mrituynjayo mukham patu
    kantham me nagabhushanah | pinaki matkarau patu trishuli hridayam mama || 15|| pancavaktrah stanau
    patu udaram jagadishvarah | nabhim patu virupakshah parshvau me parvatipatih || 16|| katidvayam girisho
    me prishtham me pramathadhipah | guhyam maheshvarah patu mamoru patu bhairavah || 17|| januni me jagaddharta
    janghe me jagadambika | padau me satatam patu lokavandyah sadashivah || 18|| girishah patu me bharyam
    bhavah patu sutanmama | mrityunjayo mamayushyam cittam me gananayakah || 19|| sarvangam me sada patu
    kalakalah sadashivah | etatte kavacam punyam devatanam ca durlabham || 20|| mritasanjivanam namna
    mahadevena kirtitam | sahasravartanam casya purashcaranamiritam || 21|| yah pathecchrinuyannityam
    shravayetsusamahitah | sa kalamrityum nirjitya sadayushyam samashnute || 22|| hastena va yada sprishtva
    mritam sanjivayatyasau | adhayo vyadhayastasya na bhavanti kadacana || 23|| kalamrityumapi praptamasau
    jayati sarvada | animadigunaishvaryam labhate manavottamah || 24|| yuddharambhe pathitvedamashtavimshativarakam
    | yuddhamadhye sthitah shatruh sadyah sarvairna drishyate || 25|| na brahmadini castrani kshayam kurvanti
    tasya vai | vijayam labhate devayuddhamadhye'pi sarvada || 26|| pratarutthaya satatam yah pathetkavacam
    shubham | akshayyam labhate saukhyamiha loke paratra ca || 27|| sarvavyadhivinirmriktah sarvarogavivarjitah
    | ajaramarano bhutva sada shodashavarshikah || 28|| vicaratyakhila~lokanprapya bhogamshca durlabhan
    | tasmadidam mahagopyam kavacam samudahritam || 29|| mritasanjivanam namna devatairapi durlabham ||
    30|| || iti shrivasishthapranitam mritasanjivana stotram sampurnam ||
  devanagari: राभयकरो यज्वा सर्वदेवनिषेवितः । मृत्युञ्जयो महादेवः प्राच्यां मां पातु सर्वदा ॥ ४॥ दधानः
    शक्तिमभयां त्रिमुखं षड्भुजः प्रभुः । सदाशिवोऽग्निरूपी मामाग्नेय्यां पातु सर्वदा ॥ ५॥ अष्टादशभुजोपेतो
    दण्डाभयकरो विभुः । यमरूपी महादेवो दक्षिणस्यां सदाऽवतु ॥ ६॥ खड्गाभयकरो धीरो रक्षोगणनिषेवितः । रक्षोरूपी
    महेशो मां नैरृत्यां सर्वदाऽवतु ॥ ७॥ पाशाभयभुजः सर्वरत्नाकरनिषेवितः । वरुणात्मा महादेवः पश्चिमे मां
    सदाऽवतु ॥ ८॥ गदाभयकरः प्राणनायकः सर्वदागतिः । वायव्यां मारुतात्मा मां शङ्करः पातु सर्वदा ॥ ९॥ शङ्खाभयकरस्थो
    मां नायकः परमेश्वरः । सर्वात्मान्तरदिग्भागे पातु मां शङ्करः प्रभुः ॥ १०॥ शूलाभयकरः सर्वविद्यानमधिनायकः
    । ईशानात्मा तथैशान्यां पातु मां परमेश्वरः ॥ ११॥ ऊर्ध्वभागे ब्रह्मरूपी विश्वात्माऽधः सदाऽवतु । शिरो
    मे शङ्करः पातु ललाटं चन्द्रशेखरः ॥ १२॥ भ्रूमध्यं सर्वलोकेशस्त्रिनेत्रो लोचनेऽवतु । भ्रूयुग्मं गिरिशः
    पातु कर्णौ पातु महेश्वरः ॥ १३॥ नासिकां मे महादेव ओष्ठौ पातु वृषध्वजः । जिह्वां मे दक्षिणामूर्तिर्दन्तान्मे
    गिरिशोऽवतु ॥ १४॥ मृतुय्ञ्जयो मुखं पातु कण्ठं मे नागभूषणः । पिनाकी मत्करौ पातु त्रिशूली हृदयं मम ॥
    १५॥ पञ्चवक्त्रः स्तनौ पातु उदरं जगदीश्वरः । नाभिं पातु विरूपाक्षः पार्श्वौ मे पार्वतीपतिः ॥ १६॥ कटिद्वयं
    गिरीशो मे पृष्ठं मे प्रमथाधिपः । गुह्यं महेश्वरः पातु ममोरू पातु भैरवः ॥ १७॥ जानुनी मे जगद्धर्ता जङ्घे
    मे जगदम्बिका । पादौ मे सततं पातु लोकवन्द्यः सदाशिवः ॥ १८॥ गिरिशः पातु मे भार्यां भवः पातु सुतान्मम
    । मृत्युञ्जयो ममायुष्यं चित्तं मे गणनायकः ॥ १९॥ सर्वाङ्गं मे सदा पातु कालकालः सदाशिवः । एतत्ते कवचं
    पुण्यं देवतानां च दुर्लभम् ॥ २०॥ मृतसञ्जीवनं नाम्ना महादेवेन कीर्तितम् । सहस्रावर्तनं चास्य पुरश्चरणमीरितम्
    ॥ २१॥ यः पठेच्छृणुयान्नित्यं श्रावयेत्सुसमाहितः । स कालमृत्युं निर्जित्य सदायुष्यं समश्नुते ॥ २२॥
    हस्तेन वा यदा स्पृष्ट्वा मृतं सञ्जीवयत्यसौ । आधयो व्याधयस्तस्य न भवन्ति कदाचन ॥ २३॥ कालमृत्युमपि प्राप्तमसौ
    जयति सर्वदा । अणिमादिगुणैश्वर्यं लभते मानवोत्तमः ॥ २४॥ युद्धारम्भे पठित्वेदमष्टाविंशतिवारकम् । युद्धमध्ये
    स्थितः शत्रुः सद्यः सर्वैर्न दृश्यते ॥ २५॥ न ब्रह्मादीनि चास्त्राणि क्षयं कुर्वन्ति तस्य वै । विजयं
    लभते देवयुद्धमध्येऽपि सर्वदा ॥ २६॥ प्रातरुत्थाय सततं यः पठेत्कवचं शुभम् । अक्षय्यं लभते सौख्यमिह लोके
    परत्र च ॥ २७॥ सर्वव्याधिविनिर्मृक्तः सर्वरोगविवर्जितः । अजरामरणो भूत्वा सदा षोडशवार्षिकः ॥ २८॥ विचरत्यखिलाँलोकान्प्राप्य
    भोगांश्च दुर्लभान् । तस्मादिदं महागोप्यं कवचं समुदाहृतम् ॥ २९॥ मृतसञ्जीवनं नाम्ना देवतैरपि दुर्लभम्
    ॥ ३०॥ ॥ इति श्रीवसिष्ठप्रणीतं मृतसञ्जीवन स्तोत्रं सम्पूर्णम् ॥
