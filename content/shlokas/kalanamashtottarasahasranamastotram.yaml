id: kalanamashtottarasahasranamastotram
category: sahasranama
name:
  english: kalanamashtottarasahasranamastotram
  devanagari: कालनामाष्टोत्तरसहस्रनामस्तोत्रम्
content:
  english: om kalo'ham kalakalo'ham kalarupah kalatmakah | kalanatmakakalajnah kevalah kalanayakah ||
    1|| cidanandakriyajnanamicchashaktisvarupakah | ekaneko'dvayo nityo buddhya'parimito'mitah || 2||
    anadyanantakutasthah puranah purushottamah | shashvatah shashvatanandah kaivalyo'kevalo'kulah || 3||
    jagadishvara sutratma vedatma shrutiparagah | karta'bhokta sadasakshi vidhata parameshvarah || 4||
    trikalasthularupajnastrikalabhramakarakah | prathamah prathamashabdah svaprakashah prakashaman ||
    5|| caracaramayo'mayi satatam municintitah | ekarupo brihadrupah sarupo rupavarjitah || 6|| sarvashaktimayadevah
    sarvatma sarvatomukhah | paramah paramanandah sarveshah sarvabhavanah || 7|| gopastho gocaro gupto
    gopaniyo guhashayah | sarvatra sarvagah sarvah sugamo durgamo'gamah || 8|| shristutah shridharah shridah
    sharanagatavatsalah | sarvasiddhipradah shakto vishishtanavasiddhidah || 9|| adhivyadhiharaishastapatrayanivarakah
    | bhaktanam paramopayah sukhanandah sukharnavah || 10|| hemavarnashcaturbahustrinetra vishadaprabhah
    | pitambarah shvetavasa kasturikunkumapriyah || 11|| jnaneshvaro jnanagamyo jnanavijnanacetanah |
    jnanakaro jnanamurti jnanajnanaparo'parah || 12|| yogendro yogirat yogi yoginam shashvatalayah | komalah
    kuntalah kantah kamadah kamakarakah || 13|| nirmamo nishkriyo'nanto nirvikaro vikarakrit | nishkalo
    nispriho medhyo nishprapanco niraspadah || 14|| sarvarthah sarvatobhadrah sarvakaranakaranam | akhilo
    nikhilanando buddhido buddhisattamah || 15|| sarvashreshthagunopetah kamacarah samantatah | pravinah
    kovidah prajnah sarvamangalamangalah || 16|| niralambo niravaso nirabhaso nirashrayah | niratanko
    nirakamo niradharo nirakulah || 17|| jagatkarta jagadbharta jagaddharta jagatpatih | jagat trata jagacchasta
    jagadbandhurjagatpita || 18|| jitendriyo jitapranah sarvagryah sarvanayakah | sarvakamapradah kamah
    purnakamah parantapah || 19|| shvasocchvasagatiryanta pranayami puratanah | pancapranapatipranah pranadah
    pranavallabhah || 20|| amurtomurtimanmurtisturiyastamasahparah | ajeyah sarvajijjeta aksharatma kshayo'kshayah
    || 21|| svaravyanjanavarnatma shabdo vakyam rasamritam | vakpaturmukavacalo nipunah kushalo'kshamah
    || 22|| ajaro nirjaro'martyah sadasthayi sanatanah | amaro vijaro bhaumo nityayukto niranjanah ||
    23|| bhishmarupadharo ghorah sarvavighnavinashanah | samukho durmukho dhirah shokasankataharakah ||
    24|| mantrajno yantratantrajnah sarvashastravidamvarah | shrutivedanganirmata nigamagamadarshanam
    || 25|| aloko lokapalesho laukiko lokanandanah | niyanta'sankhyalokanam saloko lokavarjitah || 26||
    vishveshvaro vishvajivo vishvanetro vishampatih | putatma putakritpunyah punyashilah paravarah ||
    27|| bhudharo bhupati bhuma bharato bharateshvarah | alpo himalayo vindhyo jalasthalavibhajakah ||
    28|| antananto vishishteshto jivajantunamaskritah | sadatushtah sadashantah sadatriptah sadarcitah
    || 29|| mahaviro maheshvaso mahapurushapurvajah | mahadeho mahabahurmahajjyotirmahadyashah || 30||
    mahasino mahacitto mahasattvo mahatapah | mahanando mahakayo mahadyonirmahadbalam || 31|| satyasankalpamarupah
    satyakamo vibhushakah | satyadevah satyashilah satyarupah sudarshanah || 32|| bhutasthah sarvabhutatma
    pratyaksho'vyaktitah prithak | dhimayo'sadhyasambhavyah satyasandho mahajanah || 33|| parantatattvam
    paramjnanam paramshreyah paramprabhah | paramsatyam parandhama paramshantih parampadam || 34|| anuratma
    viratatma sarvyavyapi prabodhakah | antasthah paramakashashcidakashanivasthitah || 35|| svayanjivah
    svayambijam svayamatma svayamratah | svayamstrashta svayambharta svayamviparinamakah || 36|| trutih
    kashtha lavo yamah palam praharo dinam nisha | paksho maso riturvarsham kalpo velantaram yugam ||
    37|| svatantro'nayattah svairi atmatantro'parayatah | sakalam sakalanandah paranandah parodayah ||
    38|| kameshah karmatho'karta purnagarbhah krishivalah | svayankarma svayambhokta svayandrashta svayammayah
    || 39|| bhuteshvaro bhutayonirguhacaro guhasthitah | sarvashcaryamayashcaryam sarvalokapriyankarah
    || 40|| sulabho durlabho'labhyah sabalo durbalo bali | abala balika bala prabalah purushah puman ||
    41|| yacako dhanavan dino nirdhano vasumanrini | prarthakah prarthana bhiksha bhikshustyagi bahupradah
    || 42|| kathorah karkasho ruksho duravaso durasadah | samastamlecchadushtaghnah kritaghnahitadhvamsakah
    || 43|| nissango nishpado'padah prapyo'prapyashcalo'calah | shaktidah kirtido'dhisho'lakshyo lakshyah
    sulakshanah || 44|| karanam karanam karma karmakarmapravartakah | bibudhagracaro jnata karmo manasagocarah
    || 45|| shabdashabdamayonadah shabdatito ravatmakah | prakasho diptirbhatejah prabhatitah pradiptiman
    || 46|| amoghavacano vyoma lokamandalayojakah | trapishto lalito'saktah svacchando vishvamohanah ||
    47|| bhaktanamsulabhavaptih shraddhastikyavivardhakah | mohako lobhanam lubhyah snigdhamugdho'tisundarah
    || 48|| sadanavah sadalolah shucih shreshtho viduttamah | divyabhogaprado bhogi bhogendro bhagavan
    bhagah || 49|| artaduhkhaharastrano madamohamalapahah | akhandaishvaryasampannah sarvashreyaspatipatih
    || 50|| sunatho'nathadinanam sukamahkamabhoginam | sumantram sarvamantranam sutantram sarvatantrinam
    || 51|| shaktibijamayahshunyah pancatattvaparatparah | navarupamayojyotirajyotirdyotako dyutih ||
    52|| bijarupo mahadgarbhah sthavaro jangamo'ndajah | shrimayo hrimayah saukhyamadomaya idammayah ||
    53|| kshemanandah kshamabharta kshamashilah kshama'kshama | adhyatmavidya vidyagryah puranachandasam
    varah || 54|| bhedabhedah paramsutram patipashapashutrikam | prakashatma vimarshatma shaivanampurnamilanam
    || 55|| vedantinannetineti sankhyayogavidanguruh | adidevo'nyadharmanam jadamanatmavadinam || 56||
    anantyavyapi sarvajno dhiya dushprapakirtitah | shitalah shammayah shantah shantabhadrah prasannabhah
    || 57|| durjayo dhurjayanando nitijno nitikrit nayah | jayashri jitvaro jishnurjayado jayavardhanah
    || 58|| kshiprakshemakarah shubhrah shivadah shantidah shamah | aishvaryashali nirlepah kalyanam mangalam
    shubham || 59|| sthulatsthulatarasthulo vistaro'vyapakah prasuh | sukshmatsukshmatarassukshmo nityanityavivasthitah
    || 60|| tadagastatini sindhuh kupo nadanadipatih | udadhyarnavakamrupah shunyasagaramanthakah || 61||
    svayamsiddhih svayamsadhyah svayamsiddhah svayankarah | svayankarma svayankarta svayamishtam svayamphalam
    || 62|| dravyatmako dravyashilo dravyatitah khamatparah | achadanam sutattvanam pancabhutavagunthanam
    || 63|| kallolarahito'kshubdho nihsroto nishcalah sthirah | buddhijnanaparavadi suvivado vivecanam
    || 64|| sardhatrivalayam cakram muladharashcaturdalah | svadhishthano vishuddhajna'nahato manipurakah
    || 65|| ayurbalam yasho varcah susthah svasthyavardhanah | nirudhah sharmadah sharmo'vyakulo hridayangamah
    || 66|| ramapriyo ramanatha ipsitartham phalapradah | palakah palanam gopo rakshitakrimikitakah ||
    67|| kauleshah kaulasampujyah kauleshtah kaulavanditah | kaulanugaminantatah kaulacaranirupakah ||
    68|| purohitah purobhagi padmakshah padmabhuh patuh | akshamaladharo ramyah pakshapakshavivarjitah
    || 69|| yashodharo yashomurtih kamaniyah kaladharah | yashasvi prashasyo dakshah sanuragah priyo'priyah
    || 70|| varishtho virako viro viresho viranandanah | nihshastrah shastrasampanno nirastrah sannadah
    sadah || 71|| vasantah shishiro dharmah sharaddhemantavarshanam | rituharta ritukarta rituparyayakarakah
    || 72|| adyamadhyantarahita adharadheyavarjitah | sudhakarah sudhaharastridivatalapujitah || 73||
    anvikshakitrayivartadandanitinivahakah | shasanam shasako'lipto dharmadhyaksho'dhinayakah || 74||
    ratijno ratinitijno ratishastravicakshanah | ratishilo ratiparah surato virato ratih || 75|| nareshvaro
    nararadhyo narapujyo nararthadah | narottamo narasevyo naravandyo naro'narah || 76|| nityavishvamayodevo
    vishvottirnah suvishvabhrit | nityacinmayasamantashcintyo'cintyah sucintitah || 77|| uttamottama ishanah
    sumado nirmado madah | sarvadhyakshah sarvakalpah sarveshah sarvatarakah || 78|| ekamantramayo mantri
    kalamantraprakashakah | mantramulam mantravakyam mantrajno mantrasadhakah || 79|| adahseturidam setuh
    seturdharmasudurgamah | adyantarahitahsetuh seturkhandravyakalinam || 80|| agraganyah pratyutpannah
    subhago bhagyavardhanah | anukamah priyakamo bhamo modo briddhipradah || 81|| ham bijam prithivyalambah
    anjalam praudhirupakah | lam agnirvayubijam am kam akashastatah param || 82|| sankalpo vanchitamishtam
    dharmadharmo nritanritam | mahashayo mahajjyotih svagakarah parivridhah || 83|| yajneshvaro yajnamurtirnityam
    yajnapratishthitah | adhvaryo hotri udgata yajako yajanam havih || 84|| kosheshah koshadah kosho nidhanam
    nidhinampatih | ardharatrijapam japyo yatheshtaphaladovibhuh || 85|| alingo'vacano dhata svayambhurjanako
    bhavah | nanarupadharo'rupo'nantabahuranantadrik || 86|| shunyadharo'shunyashilah shunyagarbhah shamatmakah
    | shunyarudhah shunyarupah shunyashunyapratishthitah || 87|| digambaro divyadeho dharmatma dharmikavratah
    | antahsakshi bahihsakshi sarvasakshi anuttarah || 88|| subodhah satyapratijnah shripradah putrapautradah
    | ashapurayita data kulasantativardhanah || 89|| agamyo'gocaro'bhedyah siddharthah sukalah svabhuh
    | apakshiya udasino duro'durah samo'samah || 90|| atirupakarah sugrah shatrughno ripusudanah | shitatapaharo'papo
    darunah katuh kikasah || 91|| acaryah shikshakah shishyah pitridevo gurorguruh | matridevah suvishvasyo
    bhakto bhaktajano'rcakah || 92|| navamo navaminatho navamsho navadho navah | anango hemavarnangah
    suvarno'varnavarnakah || 93|| agadhah sudridhah shriman vayurupo dravo jalam | analastattvasamyukto
    vimukto'simito'laghuh || 94|| medhadastushtidastushtah santushto vishrutah shucih | acchedyo'lolupo
    nyayyah suspriho vimrityurvashi || 95|| vishuddhalocano darshi vanmanogocaratigah | sarvasvam sarvacaitanyah
    svakritah svadhritah svadah || 96|| pita putrah svasa putri mata bhrata pitamahah | bandhurmitram
    patih patni susevyah karmakarakah || 97|| samajo nivaho vrindam prajatantram prajapatih | bhupatirvishayo
    rashtram deshabhaktah svadeshabhrit || 98|| animadigunopeto gunatito gunatmakah | sahajah sahanah
    satyam sukhaduhkhaviparyayah || 99|| manishi matiman vijno varenyo'kalmasho'naghah | garbhado garbhadoshaghno
    bijastho bijavardhanah || 100|| shubhashubhaparityagi ashubhashubhakarakah | tejorashistamohanta sarvabhutamanoharah
    || 101|| muktahasto'rthashastrajnah savadhanoh nirikshakah | navadvaramayodeho dehi dehabhritamvarah
    || 102|| kotisuryapratikashah koticandramshunirmalah | kotitarakanirmata kotilokaprayojakah || 103||
    akhando'lavashah kalyah shravanam shravakah shrutih | pramanam pratyayah patramagrahyo grahanam grahah
    || 104|| dayakaro dayarupo dayamurtirdayaparah | sarvapapaprashantatma sarvadurgatiharakah || 105||
    manojavo marudvego bhaktanam pathanayakah | ranajno ranakshetrajno yuddham yoddha bhato'bhatah ||
    106|| saumyananah saumyabhavo bhaktido bhaktavatsalah | sarvavashyakaro'vashyah susampannah samayakah
    || 107|| nityatripto lasadbhavo vishvapurnah sadakshami | ashashrayonirashanam kripaluh karunakarah
    || 108|| asamprajnatasamprajno nishnato'nashvaro'vyayah | sarajnah sarvadharmanam lokadharmapravartakah
    || 109|| sudhamayah sadaramah shrighano drishtimohanah | sutradharo jagatsutram tryaksharo vagadhishvarah
    || 110|| kshayapasmarakushtaghno rogarishtanivarakah | svasthyarogyapradah svasthah sarvamayapraharakah
    || 111|| karta'karta'nyathakartaishvarah sarvashaktiman | yugakarta yugaharta ahoratrashcaturyugam
    || 112|| hantapadam vipaddharta sadbhoganilayo'cyutah | svabhavah sadgatirbhavo nirdvandvo dvandvarupakah
    || 113|| anekarupavarnangah purvah purvatarottamah | pavanah pavanah putah putanama shucivratah ||
    114|| ashugo'nashugo'drishyah pavitram vimalo'malah | supathah pathikah pantha bhaktimargopadeshakah
    || 115|| aranyako vanasthayi brahmacari upasakah | grihasthah pujakah puja thakurah kuladevata ||
    116|| matsyastimingilo grahah shukah shari vihangamah | gayakashcitrako gatha shilpam shilpi nato'natah
    || 117|| vibhramo bhramamohaghnah kalpavriksho'shvatthastaruh | vitapi vallari pushpam panktirvargo
    bahubhujah || 118|| atalo vitalavyapi sutalastalavarjitah | ashvah kurangamo dhenuh sharabhah sastanah
    shikhi || 119|| vijnanam grahajijnasa anantanantyamarganam | jivajivo drisho'vyaktah paroksho'vyaktasankulah
    || 120|| advitiyatapomurtih svamayanityagopitah | sarvatirthamayastirthamatmatirthanivasthitah ||
    121|| atmajna atmanirdishta atmacidatmadhih sudhih | atmajidatmasantushta atmasvatmapravartakah ||
    122|| vishvashlaghyo vishvapujyo vishvavandyo munishvarah | vishvaradhyo vishvashreshtho vishvesho
    vishvarad rishih || 123|| akayah kayasampannah paraparamayo mahan | vishoko'shokakaumarah sureshah
    suprabhah prabhuh || 124|| iti shri jalali kaula jiyalalena viracitam shribhagavan kalasahasranamastotram
    sampurnam || purvavatpranayamo nyasashca | atha tarpanam || tatsatkala adyatavat tithavadya amukamasasya
    amuka pakshe amuka vare shrikalah kalakalah anantah ajarah amarah abhayavarapradah sarvaduhkhaghnah
    sarvamayaharta sarvasiddhikarta sarvakamanabhilashapurakah pritah prito'stu || kalo'ham || kalakendraprakashanam
  devanagari: ॐ कालोऽहं कालकालोऽहं कालरूपः कलात्मकः । कलनात्मककालज्ञः केवलः कालनायकः ॥ १॥ चिदानन्दक्रियाज्ञानमिच्छाशक्तिस्वरूपकः
    । एकानेकोऽद्वयो नित्यो बुद्ध्याऽपरिमितोऽमितः ॥ २॥ अनाद्यानन्तकूटस्थः पुराणः पुरुषोत्तमः । शाश्वतः
    शाश्वतानन्दः कैवल्योऽकेवलोऽकुलः ॥ ३॥ जगदीश्वर सूत्रात्मा वेदात्मा श्रुतिपारगः । कर्ताऽभोक्ता सदासाक्षी
    विधाता परमेश्वरः ॥ ४॥ त्रिकालस्थूलरूपज्ञस्त्रिकालभ्रमकारकः । प्रथमः प्रथमशब्दः स्वप्रकाशः प्रकाशमान्
    ॥ ५॥ चराचरमयोऽमायी सततं मुनिचिन्तितः । एकरूपो बृहद्रूपः सरूपो रूपवर्जितः ॥ ६॥ सर्वशक्तिमयदेवः सर्वात्मा
    सर्वतोमुखः । परमः परमानन्दः सर्वेशः सर्वभावनः ॥ ७॥ गोपस्थो गोचरो गुप्तो गोपनीयो गुहाशयः । सर्वत्र
    सर्वगः सर्वः सुगमो दुर्गमोऽगमः ॥ ८॥ श्रीस्तुतः श्रीधरः श्रीदः शरणागतवत्सलः । सर्वसिद्धिप्रदः शक्तो
    विशिष्टनवसिद्धिदः ॥ ९॥ आधिव्याधिहरईशस्तापत्रयनिवारकः । भक्तानां परमोपायः सुखानन्दः सुखार्णवः ॥ १०॥
    हेमवर्णश्चतुर्बाहुस्त्रिनेत्रा विशदप्रभः । पीताम्बरः श्वेतवासा कस्तूरीकुङ्कुमप्रियः ॥ ११॥ ज्ञानेश्वरो
    ज्ञानगम्यो ज्ञानविज्ञानचेतनः । ज्ञानाकारो ज्ञानमूर्ति ज्ञानाज्ञानपरोऽपरः ॥ १२॥ योगेन्द्रो योगिराट्
    योगी योगिनां शाश्वतालयः । कोमलः कुन्तलः कान्तः कामदः कामकारकः ॥ १३॥ निर्ममो निष्क्रियोऽनन्तो निर्विकारो
    विकारकृत् । निष्कलो निस्पृहो मेध्यो निष्प्रपञ्चो निरास्पदः ॥ १४॥ सर्वार्थः सर्वतोभद्रः सर्वकारणकारणम्
    । अखिलो निखिलानन्दो बुद्धिदो बुद्धिसत्तमः ॥ १५॥ सर्वश्रेष्ठगुणोपेतः कामाचारः समन्ततः । प्रवीणः कोविदः
    प्राज्ञः सर्वमङ्गलमङ्गलः ॥ १६॥ निरालम्बो निरावासो निराभासो निराश्रयः । निरातङ्को निराकामो निराधारो
    निराकुलः ॥ १७॥ जगत्कर्ता जगद्भर्ता जगद्धर्ता जगत्पतिः । जगत् त्राता जगच्छास्ता जगद्बन्धुर्जगत्पिता
    ॥ १८॥ जितेन्द्रियो जितप्राणः सर्वाग्र्यः सर्वनायकः । सर्वकामप्रदः कामः पूर्णकामः परन्तपः ॥ १९॥ श्वासोच्छ्वासगतिर्यन्ता
    प्राणायामी पुरातनः । पञ्चप्राणपतिप्राणः प्राणदः प्राणवल्लभः ॥ २०॥ अमूर्तोमूर्तिमान्मूर्तिस्तुरीयस्तमसःपरः
    । अजेयः सर्वजिज्जेता अक्षरात्मा क्षयोऽक्षयः ॥ २१॥ स्वरव्यञ्जनवर्णात्मा शब्दो वाक्यं रसामृतम् । वाक्पटुर्मूकवाचालो
    निपुणः कुशलोऽक्षमः ॥ २२॥ अजरो निर्जरोऽमर्त्यः सदास्थायी सनातनः । अमरो विजरो भौमो नित्ययुक्तो निरञ्जनः
    ॥ २३॥ भीष्मरूपधरो घोरः सर्वविघ्नविनाशनः । समुखो दुर्मुखो धीरः शोकसङ्कटहारकः ॥ २४॥ मन्त्रज्ञो यन्त्रतन्त्रज्ञः
    सर्वशास्त्रविदांवरः । श्रुतिवेदाङ्गनिर्माता निगमागमदर्शनम् ॥ २५॥ अलोको लोकपालेशो लौकिको लोकनन्दनः
    । नियन्ताऽसङ्ख्यलोकानां सलोको लोकवर्जितः ॥ २६॥ विश्वेश्वरो विश्वजीवो विश्वनेत्रो विशाम्पतिः । पूतात्मा
    पूतकृत्पुण्यः पुण्यशीलः परावरः ॥ २७॥ भूधरो भूपति भूमा भरतो भारतेश्वरः । अल्पो हिमालयो विन्ध्यो जलस्थलविभाजकः
    ॥ २८॥ अन्तानन्तो विशिष्टेष्टो जीवजन्तुनमस्कृतः । सदातुष्टः सदाशान्तः सदातृप्तः सदार्चितः ॥ २९॥ महावीरो
    महेष्वासो महापूरुषपूर्वजः । महादेहो महाबाहुर्महज्ज्योतिर्महद्यशः ॥ ३०॥ महासीनो महाचित्तो महासत्त्वो
    महातपः । महानन्दो महाकायो महद्योनिर्महद्बलम् ॥ ३१॥ सत्यसङ्कल्पमारूपः सत्यकामो विभूषकः । सत्यदेवः सत्यशीलः
    सत्यरूपः सुदर्शनः ॥ ३२॥ भूतस्थः सर्वभूतात्मा प्रत्यक्षोऽव्यक्तितः पृथक् । धीमयोऽसाध्यसम्भाव्यः सत्यसन्धो
    महाजनः ॥ ३३॥ परन्ततत्त्वं परंज्ञानं परंश्रेयः परम्प्रभः । परंसत्यं परन्धाम परंशान्तिः परम्पदम् ॥ ३४॥
    अणुरात्मा विराटात्मा सर्व्यव्यापी प्रबोधकः । अन्तस्थः परमाकाशश्चिदाकाशनिवस्थितः ॥ ३५॥ स्वयञ्जीवः स्वयम्बीजं
    स्वयमात्मा स्वयंरतः । स्वयंस्त्रष्टा स्वयम्भर्ता स्वयंविपरिणामकः ॥ ३६॥ त्रुटिः काष्ठा लवो यामः पलं
    प्रहरो दिनं निशा । पक्षो मासो ऋतुर्वर्षं कल्पो वेलान्तरं युगम् ॥ ३७॥ स्वतन्त्रोऽनायत्तः स्वैरी आत्मतन्त्रोऽपरायतः
    । सकलं सकलानन्दः परानन्दः परोदयः ॥ ३८॥ कामेशः कर्मठोऽकर्ता पूर्णगर्भः कृषीवलः । स्वयङ्कर्मा स्वयम्भोक्ता
    स्वयन्द्रष्टा स्वयम्मयः ॥ ३९॥ भूतेश्वरो भूतयोनिर्गुहाचारो गुहास्थितः । सर्वाश्चर्यमयाश्चर्यं सर्वलोकप्रियङ्करः
    ॥ ४०॥ सुलभो दुर्लभोऽलभ्यः सबलो दुर्बलो बली । अबला बालिका बाला प्रबलः पुरुषः पुमान् ॥ ४१॥ याचको धनवान्
    दीनो निर्धनो वसुमानृणी । प्रार्थकः प्रार्थना भिक्षा भिक्षुस्त्यागी बहुप्रदः ॥ ४२॥ कठोरः कर्कशो रूक्षो
    दुरावासो दुरासदः । समस्तम्लेच्छदुष्टघ्नः कृतघ्नाहितध्वंसकः ॥ ४३॥ निस्सङ्गो निष्पदोऽपादः प्राप्योऽप्राप्यश्चलोऽचलः
    । शक्तिदः कीर्तिदोऽधीशोऽलक्ष्यो लक्ष्यः सुलक्षणः ॥ ४४॥ करणं कारणं कर्म कर्माकर्मप्रवर्तकः । बिबुधाग्रचरो
    ज्ञाता कार्मो मानसगोचरः ॥ ४५॥ शब्दाशब्दमयोनादः शब्दातीतो रवात्मकः । प्रकाशो दीप्तिर्भातेजः प्रभातीतः
    प्रदीप्तिमान् ॥ ४६॥ अमोघवचनो व्योम लोकमण्डलयोजकः । त्रपिष्टो ललितोऽसक्तः स्वच्छन्दो विश्वमोहनः ॥ ४७॥
    भक्तानांसुलभावाप्तिः श्रद्धास्तिक्यविवर्धकः । मोहको लोभनं लुभ्यः स्निग्धमुग्धोऽतिसुन्दरः ॥ ४८॥ सदानवः
    सदालोलः शुचिः श्रेष्ठो विदुत्तमः । दिव्यभोगप्रदो भोगी भोगेन्द्रो भगवान् भगः ॥ ४९॥ आर्तदुःखहरस्त्राणो
    मदमोहमलापहः । अखण्डैश्वर्यसम्पन्नः सर्वश्रेयस्पतिपतिः ॥ ५०॥ सुनाथोऽनाथदीनानां सुकामःकामभोगिनाम् ।
    सुमन्त्रं सर्वमन्त्राणां सुतन्त्रं सर्वतन्त्रिणाम् ॥ ५१॥ शक्तिबीजमयःशून्यः पञ्चतत्त्वपरात्परः । नवरूपमयोज्योतिरज्योतिर्द्योतको
    द्युतिः ॥ ५२॥ बीजरूपो महद्गर्भः स्थावरो जङ्गमोऽण्डजः । श्रीमयो ह्रीमयः सौख्यमदोमय इदम्मयः ॥ ५३॥ क्षेमानन्दः
    क्षमाभर्ता क्षमाशीलः क्षमाऽक्षमा । अध्यात्मविद्या विद्याग्र्यः पुराणछन्दसां वरः ॥ ५४॥ भेदाभेदः परंसूत्रं
    पतिपाशपशुत्रिकम् । प्रकाशात्मा विमर्शात्मा शैवानाम्पूर्णमीलनम् ॥ ५५॥ वेदान्तिनान्नेतिनेति साङ्ख्ययोगविदाङ्गुरुः
    । आदिदेवोऽन्यधर्माणां जडमनात्मवादिनाम् ॥ ५६॥ आनन्त्यव्यापी सर्वज्ञो धिया दुष्प्रापकीर्तितः । शीतलः
    शम्मयः शान्तः शान्तभद्रः प्रसन्नभः ॥ ५७॥ दुर्जयो धूर्जयानन्दो नीतिज्ञो नीतिकृत् नयः । जयश्री जित्वरो
    जिष्णुर्जयदो जयवर्धनः ॥ ५८॥ क्षिप्रक्षेमकरः शुभ्रः शिवदः शान्तिदः शमः । ऐश्वर्यशाली निर्लेपः कल्याणं
    मङ्गलं शुभम् ॥ ५९॥ स्थूलात्स्थूलतरस्थूलो विस्तरोऽव्यापकः प्रसूः । सूक्ष्मात्सूक्ष्मतरस्सूक्ष्मो नित्यानित्यविवस्थितः
    ॥ ६०॥ तडागस्तटिनी सिन्धुः कूपो नदनदीपतिः । उदध्यर्णवकंरूपः शून्यसागरमन्थकः ॥ ६१॥ स्वयंसिद्धिः स्वयंसाध्यः
    स्वयंसिद्धः स्वयङ्करः । स्वयङ्कर्म स्वयङ्कर्ता स्वयमिष्टं स्वयम्फलम् ॥ ६२॥ द्रव्यात्मको द्रव्यशीलो
    द्रव्यातीतः खमात्परः । आछादनं सुतत्त्वानां पञ्चभूतावगुण्ठनम् ॥ ६३॥ कल्लोलरहितोऽक्षुब्धो निःस्रोतो
    निश्चलः स्थिरः । बुद्धिज्ञानपरवादी सुविवादो विवेचनम् ॥ ६४॥ सार्धत्रिवलयं चक्रं मूलाधारश्चतुर्दलः ।
    स्वाधिष्ठानो विशुद्धाज्ञाऽनाहतो मणिपूरकः ॥ ६५॥ आयुर्बलं यशो वर्चः सुस्थः स्वास्थ्यवर्धनः । नीरूढः
    शर्मदः शर्मोऽव्याकुलो हृदयङ्गमः ॥ ६६॥ रमाप्रियो रमानाथ ईप्सितार्थं फलप्रदः । पालकः पालनं गोपो रक्षिताकृमिकीटकः
    ॥ ६७॥ कौलेशः कौलसम्पूज्यः कौलेष्टः कौलवन्दितः । कौलानुगामिनान्तातः कौलाचारनिरूपकः ॥ ६८॥ पुरोहितः पुरोभागी
    पद्माक्षः पद्मभूः पटुः । अक्षमालाधरो रम्यः पक्षापक्षविवर्जितः ॥ ६९॥ यशोधरो यशोमूर्तिः कामनीयः कलाधरः
    । यशस्वी प्रशस्यो दक्षः सानुरागः प्रियोऽप्रियः ॥ ७०॥ वरिष्ठो वीरको वीरो वीरेशो वीरनन्दनः । निःशस्त्रः
    शस्त्रसम्पन्नो निरस्त्रः सन्नदः सदः ॥ ७१॥ वसन्तः शिशिरो धर्मः शरद्धेमन्तवर्षणम् । ऋतुहर्ता ऋतुकर्ता
    ऋतुपर्ययकारकः ॥ ७२॥ आद्यमध्यान्तरहित आधाराधेयवर्जितः । सुधाकरः सुधाहारस्त्रिदिवातलपूजितः ॥ ७३॥ आन्वीक्षकीत्रयीवार्तादण्डनीतिनिवाहकः
    । शासनं शासकोऽलिप्तो धर्माध्यक्षोऽधिनायकः ॥ ७४॥ रतिज्ञो रतिनीतिज्ञो रतिशास्त्रविचक्षणः । रतिशीलो रतिपरः
    सुरतो विरतो रतिः ॥ ७५॥ नरेश्वरो नराराध्यो नरपूज्यो नरार्थदः । नरोत्तमो नरसेव्यो नरवन्द्यो नरोऽनरः
    ॥ ७६॥ नित्यविश्वमयोदेवो विश्वोत्तीर्णः सुविश्वभृत् । नित्यचिन्मयसामन्तश्चिन्त्योऽचिन्त्यः सुचिन्तितः
    ॥ ७७॥ उत्तमोत्तम ईशानः सुमदो निर्मदो मदः । सर्वाध्यक्षः सर्वकल्पः सर्वेशः सर्वतारकः ॥ ७८॥ एकमन्त्रमयो
    मन्त्री कालमन्त्रप्रकाशकः । मन्त्रमूलं मन्त्रवाक्यं मन्त्रज्ञो मन्त्रसाधकः ॥ ७९॥ अदःसेतुरिदं सेतुः
    सेतुर्धर्मसुदुर्गमः । आद्यन्तरहितःसेतुः सेतुर्खन्द्रव्यकालिनाम् ॥ ८०॥ अग्रगण्यः प्रत्युत्पन्नः सुभगो
    भाग्यवर्धनः । अनुकामः प्रियकामो भामो मोदो बृद्धिप्रदः ॥ ८१॥ हं बीजं पृथिव्यालम्बः अञ्जलं प्रौढिरूपकः
    । लं अग्निर्वायुबीजं आं कं आकाशस्ततः परम् ॥ ८२॥ सङ्कल्पो वाञ्छितमिष्टं धर्माधर्मो नृतानृतम् । महाशयो
    महज्ज्योतिः स्वगाकारः परिवृढः ॥ ८३॥ यज्ञेश्वरो यज्ञमूर्तिर्नित्यं यज्ञप्रतिष्ठितः । अध्वर्यो होतृ
    उद्गाता याजको यजनं हविः ॥ ८४॥ कोषेशः कोषदः कोषो निधानं निधिनाम्पतिः । अर्धरात्रिजपं जाप्यो यथेष्टफलदोविभुः
    ॥ ८५॥ अलिङ्गोऽवचनो धाता स्वयम्भूर्जनको भवः । नानारूपधरोऽरूपोऽनन्तबाहुरनन्तदृक् ॥ ८६॥ शून्याधारोऽशून्यशीलः
    शून्यगर्भः शमात्मकः । शून्यारूढः शून्यरूपः शून्याशून्यप्रतिष्ठितः ॥ ८७॥ दिगम्बरो दिव्यदेहो धर्मात्मा
    धार्मिकव्रतः । अन्तःसाक्षी बहिःसाक्षी सर्वसाक्षी अनुत्तरः ॥ ८८॥ सुबोधः सत्यप्रतिज्ञः श्रीप्रदः पुत्रपौत्रदः
    । आशापूरयिता दाता कुलसन्ततिवर्धनः ॥ ८९॥ अगम्योऽगोचरोऽभेद्यः सिद्धार्थः सुकलः स्वभूः । अपक्षीय उदासीनो
    दूरोऽदूरः समोऽसमः ॥ ९०॥ अतिरूपकरः सूग्रः शत्रुघ्नो रिपुसूदनः । शीततापहरोऽपापो दारूणः कटुः कीकसः ॥
    ९१॥ आचार्यः शिक्षकः शिष्यः पितृदेवो गुरोर्गुरुः । मातृदेवः सुविश्वास्यो भक्तो भक्तजनोऽर्चकः ॥ ९२॥
    नवमो नवमीनाथो नवांशो नवधो नवः । अनङ्गो हेमवर्णाङ्गः सुवर्णोऽवर्णवर्णकः ॥ ९३॥ अगाधः सुदृढः श्रीमान्
    वायुरूपो द्रवो जलम् । अनलस्तत्त्वसंयुक्तो विमुक्तोऽसीमितोऽलघुः ॥ ९४॥ मेधादस्तुष्टिदस्तुष्टः सन्तुष्टो
    विश्रुतः शुचिः । अच्छेद्योऽलोलुपो न्याय्यः सुस्पृहो विमृत्युर्वशी ॥ ९५॥ विशुद्धलोचनो दर्शी वाङ्मनोगोचरातिगः
    । सर्वस्वं सर्वचैतन्यः स्वकृतः स्वधृतः स्वदः ॥ ९६॥ पिता पुत्रः स्वसा पुत्री माता भ्राता पितामहः ।
    बन्धुर्मित्रं पतिः पत्नी सुसेव्यः कर्मकारकः ॥ ९७॥ समाजो निवहो वृन्दं प्रजातन्त्रं प्रजापतिः । भूपतिर्विषयो
    राष्ट्रं देशभक्तः स्वदेशभृत् ॥ ९८॥ अणिमादिगुणोपेतो गुणातीतो गुणात्मकः । सहजः सहनः सत्यं सुखदुःखविपर्ययः
    ॥ ९९॥ मनीषी मतिमान् विज्ञो वरेण्योऽकल्मषोऽनघः । गर्भदो गर्भदोषघ्नो बीजस्थो बीजवर्धनः ॥ १००॥ शुभाशुभपरित्यागी
    अशुभशुभकारकः । तेजोराशिस्तमोहन्ता सर्वभूतमनोहरः ॥ १०१॥ मुक्तहस्तोऽर्थशास्त्रज्ञः सावधानोः निरीक्षकः
    । नवद्वारमयोदेहो देही देहभृतांवरः ॥ १०२॥ कोटिसूर्यप्रतीकाशः कोटिचन्द्रांशुनिर्मलः । कोटितारकनिर्माता
    कोटिलोकप्रयोजकः ॥ १०३॥ अखण्डोऽलवशः कल्यः श्रवणं श्रावकः श्रुतिः । प्रमाणं प्रत्ययः पात्रमग्राह्यो
    ग्रहणं ग्रहः ॥ १०४॥ दयाकरो दयारूपो दयामूर्तिर्दयापरः । सर्वपापप्रशान्तात्मा सर्वदुर्गतिहारकः ॥ १०५॥
    मनोजवो मरुद्वेगो भक्तानां पथनायकः । रणज्ञो रणक्षेत्रज्ञो युद्धं योद्धा भटोऽभटः ॥ १०६॥ सौम्याननः सौम्यभावो
    भक्तिदो भक्तवत्सलः । सर्ववश्यकरोऽवश्यः सुसम्पन्नः समायकः ॥ १०७॥ नित्यतृप्तो लसद्भावो विश्वपूर्णः सदाक्षमी
    । आशाश्रयोनिराशानां कृपालुः करुणाकरः ॥ १०८॥ असंप्रज्ञातसंप्रज्ञो निष्णातोऽनश्वरोऽव्ययः । सारज्ञः सर्वधर्माणां
    लोकधर्मप्रवर्तकः ॥ १०९॥ सुधामयः सदारामः श्रीघनो दृष्टिमोहनः । सूत्रधारो जगत्सूत्रं त्र्यक्षरो वागधीश्वरः
    ॥ ११०॥ क्षयापस्मारकुष्टघ्नो रोगारिष्टनिवारकः । स्वास्थ्यारोग्यप्रदः स्वस्थः सर्वामयप्रहारकः ॥ १११॥
    कर्ताऽकर्ताऽन्यथाकर्ताईश्वरः सर्वशक्तिमान् । युगकर्ता युगहर्ता अहोरात्रश्चतुर्युगम् ॥ ११२॥ हन्तापदां
    विपद्धर्ता सद्भोगनिलयोऽच्युतः । स्वभावः सद्गतिर्भावो निर्द्वन्द्वो द्वन्द्वरूपकः ॥ ११३॥ अनेकरूपवर्णाङ्गः
    पूर्वः पूर्वतरोत्तमः । पावनः पवनः पूतः पूतनामा शुचिव्रतः ॥ ११४॥ आशुगोऽनाशुगोऽदृश्यः पवित्रं विमलोऽमलः
    । सुपथः पथिकः पन्था भक्तिमार्गोपदेशकः ॥ ११५॥ आरण्यको वनस्थायी ब्रह्मचारी उपासकः । गृहस्थः पूजकः पूजा
    ठाकुरः कुलदेवता ॥ ११६॥ मत्स्यस्तिमिङ्गिलो ग्राहः शुकः शारी विहङ्गमः । गायकश्चित्रको गाथा शिल्पं शिल्पी
    नटोऽनटः ॥ ११७॥ विभ्रमो भ्रममोहघ्नः कल्पवृक्षोऽश्वत्थस्तरुः । विटपी वल्लरी पुष्पं पङ्क्तिर्वर्गो बहुभुजः
    ॥ ११८॥ अतलो वितलव्यापी सुतलस्तलवर्जितः । अश्वः कुरङ्गमो धेनुः शरभः सस्तनः शिखी ॥ ११९॥ विज्ञानं ग्रहजिज्ञासा
    अनन्तानन्त्यमार्गणम् । जीवाजीवो दृशोऽव्यक्तः परोक्षोऽव्यक्तसङ्कुलः ॥ १२०॥ अद्वितीयतपोमूर्तिः स्वमायानित्यगोपितः
    । सर्वतीर्थमयस्तीर्थमात्मतीर्थनिवस्थितः ॥ १२१॥ आत्मज्ञ आत्मनिर्दिष्टा आत्मचिदात्मधीः सुधीः । आत्मजिदात्मसन्तुष्ट
    आत्मास्वात्मप्रवर्तकः ॥ १२२॥ विश्वश्लाघ्यो विश्वपूज्यो विश्ववन्द्यो मुनीश्वरः । विश्वाराध्यो विश्वश्रेष्ठो
    विश्वेशो विश्वराड् ऋषिः ॥ १२३॥ अकायः कायसम्पन्नः परापरमयो महान् । विशोकोऽशोककौमारः सुरेशः सुप्रभः
    प्रभुः ॥ १२४॥ इति श्री जलाली कौल जियालालेण विरचितं श्रीभगवान् कालसहस्रनामस्तोत्रं सम्पूर्णम् ॥ पूर्ववत्प्राणायामो
    न्यासश्च । अथ तर्पणम् ॥ तत्सत्काल अद्यतावत् तिथावद्य अमुकमासस्य अमुक पक्षे अमुक वारे श्रीकालः कालकालः
    अनन्तः अजरः अमरः अभयवरप्रदः सर्वदुःखघ्नः सर्वामयहर्ता सर्वसिद्धिकर्ता सर्वकामनाभिलाषपूरकः प्रीतः प्रीतोऽस्तु
    ॥ कालोऽहम् ॥ कालकेन्द्रप्रकाशनम्
