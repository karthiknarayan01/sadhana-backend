    om pundarikaya namah om paranandaya namah | om paramatmane namah | om paratparaya namah | om parashudharine
    namah | om vishvatmane namah | om krishnaya namah | om kalimalapaharine namah | om kaustubhodbhasitoraskaya
    namah | om naraya namah | om narayanaya namah om haraye namah | om haraya namah | om harapriyaya namah
    | om svamine namah | om vaikunthaya namah | om vishvatomukhaya namah | om hrishikeshaya namah | om
    aprameyatmane namah | om varahaya namah | om dharanidharaya namah om vamanaya namah | om vedavaktaya
    namah | om vasudevaya namah | om sanatanaya namah | om ramaya namah | om viramaya namah | om virajaya
    namah | om ravanaraye namah | om ramapataye namah | om vaikunthavasine namah om vasumate namah | om
    dhanadaya namah | om dharanidharaya namah | om dharmeshaya namah | om dharaninathaya namah | om dhyeyaya
    namah | om dharmabhritamvaraya namah | om sahasrashirshaya namah | om purushaya namah | om sahasrakshaya
    namah om sahasrapade namah | om sarvagaya namah | om sarvavide namah | om sarvaya namah | om sharanyaya
    namah | om sadhuvallabhaya namah | om kausalyanandanaya namah | om shrimate namah | om rakshasahkulanashakaya
    namah | om jagatkartaya namah om jagaddhartaya namah | om jagajjetaya namah | om janartiharaya namah
    | om janakivallabhaya namah | om devaya namah | om jayarupaya namah | om jaleshvaraya namah | om kshirabdhivasine
    namah | om kshirabdhitanayavallabhaya namah | om sheshashayine namah om pannagarivahanaya namah |
    om vishtarashravase namah | om madhavaya namah | om mathuranathaya namah | om mukundaya namah | om
    mohanashanaya namah | om daityarine namah | om pundarikakshaya namah | om acyutaya namah | om madhusudanaya
    namah om somasuryagninayanaya namah | om nrisimhaya namah | om bhaktavatsalaya namah | om nityaya
    namah | om niramayaya namah | om shuddhaya namah | om varadevaya namah | om jagatprabhave namah |
    om hayagrivaya namah | om jitaripave namah om upendraya namah | om rukminipataye namah | om sarvadevamayaya
    namah | om shrishaya namah | om sarvadharaya namah | om sanatanaya namah | om saumyaya namah | om
    saumyapradaya namah | om srashte namah | om vishvaksenaya namah om janardanaya namah | om yashodatanayaya
    namah | om yogine namah | om yogashastraparayanaya namah | om rudratmakaya namah | om rudramurtaye
    namah | om raghavaya namah | om madhusudanaya namah
