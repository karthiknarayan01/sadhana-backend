id: ramayana-chaupayee
category: stotram
name:
  english: Ramayana Chaupayee
content:
  english: mangala bhavana amangala hari dravahu sudasaratha acara bihari rama siya rama siya rama jaya
    jaya rama rama siya rama siya rama jaya jaya rama ho dhiraja dharama mitra aru nari apada kala parakhiye
    cari rama siya rama siya rama jaya jaya rama rama siya rama siya rama jaya jaya rama ho jina hari
    katha suni nahim kana shravana randhra ahi bhavana samana rama siya rama siya rama jaya jaya rama
    rama siya rama siya rama jaya jaya rama ho jaki rahi bhavana jaisi raghu murati dekhi tina taisi rama
    siya rama siya rama jaya jaya rama rama siya rama siya rama jaya jaya rama ho sitarama carita ati
    pavana madhura sarasa aru ati manabhavana rama siya rama siya rama jaya jaya rama rama siya rama siya
    rama jaya jaya rama ho raghukula rita sada cali ai prana jae para vacana na jai rama siya rama siya
    rama jaya jaya rama rama siya rama siya rama jaya jaya rama ho hoihai vahi jo rama raci rakha ko kare
    tarapha~ badha~ae sakha rama siya rama siya rama jaya jaya rama rama siya rama siya rama jaya jaya
    rama ho bhida~ pada~i bhaktom ne pukare ao haro prabhu kashta hamare rama siya rama siya rama jaya
    jaya rama rama siya rama siya rama jaya jaya rama ho jehike jehi para satya sanehu so tehi milaya
    na kachu sandehu rama siya rama siya rama jaya jaya rama rama siya rama siya rama jaya jaya rama ho
    binu satsanga viveka na hoi| rama kripa binu sulabha na soi rama siya rama siya rama jaya jaya rama
    rama siya rama siya rama jaya jaya rama ho hradaya bicarati barahim bara kavana bha~ti lankapati mara
    rama siya rama siya rama jaya jaya rama rama siya rama siya rama jaya jaya rama ho hari ananta hari
    katha ananta kahahi sunahi bahuvidhi saba santa rama siya rama siya rama jaya jaya rama rama siya
    rama siya rama jaya jaya rama
  devanagari: ंअङ्गल भवन अमङ्गल हारी द्रवहु सुदसरथ अचर बिहारी राम सिया राम सिया राम जय जय राम राम सिया
    राम सिया राम जय जय राम हो धीरज धरम मित्र अरु नारी आपद काल परखिये चारी राम सिया राम सिया राम जय जय
    राम राम सिया राम सिया राम जय जय राम हो जिन हरि कथा सुनी नहीं काना श्रवण रन्ध्र अहि भवन समाना राम सिया
    राम सिया राम जय जय राम राम सिया राम सिया राम जय जय राम हो जाकी रही भावना जैसी रघु मूरति देखी तिन तैसी
    राम सिया राम सिया राम जय जय राम राम सिया राम सिया राम जय जय राम हो सीताराम चरित अति पावन मधुर सरस
    अरु अति मनभावन राम सिया राम सिया राम जय जय राम राम सिया राम सिया राम जय जय राम हो रघुकुल रीत सदा चली
    आई प्राण जाए पर वचन न जाई राम सिया राम सिया राम जय जय राम राम सिया राम सिया राम जय जय राम हो होइहै
    वही जो राम रचि राखा को करे तरफँ बढँआए साखा राम सिया राम सिया राम जय जय राम राम सिया राम सिया राम जय
    जय राम हो भीडँ पडँई भक्तों ने पुकारे आओ हरो प्रभु कष्ट हमारे राम सिया राम सिया राम जय जय राम राम सिया
    राम सिया राम जय जय राम हो जेहिके जेहि पर सत्य सनेहू सो तेहि मिलय न कछु सन्देहू राम सिया राम सिया राम
    जय जय राम राम सिया राम सिया राम जय जय राम हो बिनु सत्सङ्ग विवेक न होई। राम कृपा बिनु सुलभ न सोई राम
    सिया राम सिया राम जय जय राम राम सिया राम सिया राम जय जय राम हो ःरदय बिचारति बारहिं बारा कवन भाँति
    लङ्कापति मारा राम सिया राम सिया राम जय जय राम राम सिया राम सिया राम जय जय राम हो हरि अनन्त हरि कथा
    अनन्ता कहहि सुनहि बहुविधि सब सन्ता राम सिया राम सिया राम जय जय राम राम सिया राम सिया राम जय जय राम
