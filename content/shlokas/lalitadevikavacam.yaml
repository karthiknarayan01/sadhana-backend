id: lalitadevikavacam
category: kavacha
name:
  english: lalitadevikavacam
  devanagari: ललितादेवीकवचम्
content:
  english: 30|| papanmam sarvatah shokatsankshayatsarvatah sada | asatyatkruracintato himsatashcauratastatha
    | staimityacca sada pantu prerayantyah shubham prati || 89
  devanagari: ३०॥ पापान्मां सर्वतः शोकात्सङ्क्षयात्सर्वतः सदा । असत्यात्क्रूरचिन्तातो हिंसातश्चौरतस्तथा
    । स्तैमित्याच्च सदा पान्तु प्रेरयन्त्यः शुभं प्रति ॥ ८९
meaning: {}
