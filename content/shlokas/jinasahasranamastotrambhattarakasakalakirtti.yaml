id: jinasahasranamastotrambhattarakasakalakirtti
category: sahasranama
name:
  english: jinasahasranamastotrambhattarakasakalakirtti
  devanagari: जिनसहस्रनामस्तोत्रम्भट्टारकसकलकीर्त्ति
content:
  english: svamadau deva canamya stoshye tvannama labdhaye | ashtottarasahasrena namna sarthena bhaktibhih
    || 1|| om jinendro jinadhaureyo jinasvami jinapranih | jinesho jinashardulo jinadhisho jinottamah
    || 2|| jinarajo jinajyeshtho jineshi jinapalakah | jinanatho jinashreshtho jinamallo jinonnatah ||
    3|| jinaneta jinasrashta jinet jinapatirjinah | jinadevo jinadityo jineshita jineshvarah || 4|| jinavaryo
    jinaradhyo jinarcyo jinapungavah | jinadhipo jinadhyeyo jinamukhyo jineditah || 5|| jinasimho jinapreksho
    jinavriddho jinottarah | jinamanyo jinastutyo jinaprabhurjinodvahah || 6|| jinapujyo jinakankshi jinendurjinasattamah
    | jinakaro jinottungo jinapo jinakunjarah || 7|| jinabhartta jinaprastho jinabhrijjinacakrabhak |
    jinacakri jinadyadyo jinasevyo jinadhipah || 8|| jinakanto jinaprito jinadhirat jinapriyah | jinadhuryo
    jinarcahrirjinagrimo jinastutah || 9|| jinahamso jinatrata jinarshabho jinagragah | jinadhrijjinacakresho
    jinadata jinatmakah || 10|| jinadhiko jinalato jinashanksho jinotkritah | jinashrito jinalhadi jinatarkyo
    jinanvitah || 11|| jaino jainavaro jainasvami jainapitamahah | jainedyo jainasangharcya jainabhrijjainapalakah
    || 12|| jainakrijjainadhaureyo jainesho jainabhupatih | jained jainagrimo jainapita jainahitankarah
    || 13|| jainaneta'tha jainadhyo jainadhrijjainadevarat | jainadhipo hi jainatma jainecayo jainacakrabhrit
    || 14|| jitaksho jitakandarpo jitakamo jitashayah | jitaina jitakarmarirjitendriyo jitakhilah || 15||
    jitashatrurjitashaudho jitajeyo jitatmabhak | jitalobho jitakrodho jitamano jitantakah || 16|| jitarago
    jitadvasho jitamoho jineshvarah | jita'jayyo jitashesho jitesho jitadurmatah || 17|| jitavadi jitaklesho
    jitamundo jitavratah | jitadevo jinashantirjitakhedo jitaratih || 18|| yatidito yatisharcyo yatisho
    yatinayakah | yatimukho yatiprekshyo yatisvami yatishvarah || 19|| yatiryativaro yatyaradhyo yatigunastutah
    | yatishreshtho yatijyeshtho yatibhartta yatohitah || 20|| yatidhuryo yatisrishta yatinatho yatiprabhuh
    | yatyakaro yatitrata yatibandhuryatipriyah || 21|| yogindro yogarad yogipatiryogivinayakah | yogishvaro'tha
    yogisho yogi yogaparayanah || 22|| yogapujyo hi yogango yogavan yogaparagah | yogashtadyogarupatma
    yogabhagyogabhushitah || 23|| yogyanto yogikalpango yogikridyogiveshtitah | yogibhridyogimukhyarcyo
    yogibhuryogibhupatih || 24|| sarvajnah sarvalokajnah sarvadrik sarvatattvavit | sarvakreshasahah sarvah
    sarvacakshushca sarvarat || 25|| sarvagrimo'tha sarvatma sarveshah sarvadarshanah | sarvejyah sarvadharmangah
    sarvajivadayavahah || 26|| sarvajyeshtho hi sarvadhikah sarvatrijagaddhitah | sarvadharmamayah sarvasvami
    sarvagunashritah || 27|| vishvavidvishvanatharcyo vishvedyo vishvabandhavah | vishvanatho'tha vishvarho
    vishvatma vishvakarakah || 28|| vishved vishvapita vishvadharo vishvabhayankarah | vishvavyapi hi
    vishveshi vishvadhridvishva bhumipah || 29|| vishvadhirvishvakalyano vishvakridvishvaparagah | vishvavriddho'pi
    vishvangirakshako vishvaposhakah || 30|| jagakartta jagadbhartta jagatrata jagajayi | jaganmanyo jagajjyeshtho
    jagacchreshtho jagatpatih || 31|| jagadghrito jagannatho jagaddhyeyo jagatstutah | jagatpata jagaddhata
    jagatsevyo jagachritih || 32|| jagatsvami jagatpujyo jagatsartho jagaddhitah | jagadvetta jagaccakshurjagaddarshi
    jagatpita || 33|| jagatkanto jagaddanto jagadjnata jagajjitah | jagadviro jagadviro jagatpranto jagatpriyah
    || 34|| mahajnani mahadhyani mahakriti mahavrati | maharajo maharthajno mahatejo mahatapah || 35||
    mahajeta mahajayyo mahakshanto mahadamah | mahadanto mahashanto mahakanto mahabali || 36|| mahadevo
    mahaputo mahayogi mahadhani | mahakami mahashuro mahabhato mahayashah || 37|| mahanado mahastutyo
    mahamahapatirmahan | mahadhiro mahaviro mahabandhurmahashramah || 38|| mahadharo mahakaro mahasharma
    mahashrayah | mahayogi mahabhogi mahabrahma mahidharah || 39|| mahadhuryo mahaviryo mahadarshi maharthavit
    | mahabhartta mahakartta mahashilo mahaguni || 40|| mahadharma mahamauni mahabharo mahagrimah | mahasrashta
    mahatirtho mahakhyato mahahitah || 41|| mahadhanyo mahadhisho maharupi mahamunih | mahavibhurmahakirttirmahadata
    maharatah || 42|| mahakripo maharadhyo mahashreshtho mahayatih | mahakshantirmahaloko mahanetro maharghakrit
    || 43|| mahashrami mahayogyo mahashami mahadami | maheshesho maheshatma mahesharcyo mahesharat ||
    44|| mahananto mahatripto mahaharo mahavarah | maharshisho mahabhago mahasthano mahantakah || 45||
    mahodaryo mahakaryo mahakevalalabdhibhak | mahashishto mahanishto mahadaso mahabalah || 46|| mahalaksho
    maharthajno mahavidvan mahatmakah | mahejyarho mahanatho mahaneta mahapita || 47|| mahamana mahacintyo
    mahasaro mahayami | mahendrarcyo mahavandyo mahavadi mahanutah || 48|| paramatma paratmajnah paranjyotih
    pararthakrit | parabrahma parabrahmarupo paratarah parah || 49|| parameshah parejyah pararthi parakaryashtat
    | parasvami parajnani paradhishah parehakah || 50|| satyavadi hi satyatma satyangah satyashasanah
    | satyarthah satyavagishah satyadharo'tisatyavak || 51|| satyayah satyavidyeshah satyadharmi hi satyabhak
    | satyashayo'tisatyoktamatah satyahitankarah || 52|| satyatirtho'tisatyadhyah satyattah satyatirthakrit
    | satya simadharah satyadharmatirthapravattakah || 53|| lokesho lokanatharcyo lokalokavilokanah |
    lokavillokamurddhastho lokanatho hyalokavit || 54|| lokadrik lokakaryarthi lokajno lokapalakah | lokedyo
    lokamangalyo lokottamo hi lokarat || 55|| tirthakrittirthabhutatma tirtheshastirthakarakah | tirthabhrittirthakartta
    tirthapraneta sutirthabhak || 56|| tirthadhisho hi tirthama tirthajnastirthanayakah | tirthadhyastirthasadraja
    tirthadhrittirthavarttakah || 57|| tirthankaro hi tirtheshatirthodyastirthapalakah | tirthasrishta''tirthaddhistirthagrastirthadeshakah
    || 58|| nihkarma nirmalo nityo nirabadho niramayah | nistamasko niraupamyo nishkalanko nirayudhah
    || 59|| nirlepo nishkalo'tyantanirdosho nirjaragranih | nisvapno nirbhayo'tivanihpramado nirashrayah
    || 60|| nirambaro niratanko nirbhusho nirmalashayah | nirmado niratocaro nirmoho nirupadravah || 61||
    nirvikaro niradharo niriho nirmalangabhak | nirjaro nirajasko'tha nirasho nirvisheshavit || 62|| nirnimesho
    nirakaro nirato niratikramah | nirvedo nishkashayatma nirbanndho nisprihapragah || 63|| viraja vimalatmajno
    vimalo vimalantarah | viratorviratadhisho virago vitamatsarah || 64|| vibhavo vibhavantastho vitarago
    vicarakrit | vishvasi vigatabadho vicarajno visharadah || 65|| viveki vigatagrantho vivikto'vyaktasamsthitih
    | vijayi vijitaratirvinashtarirviyacchritah || 66|| triratneshastripithasthastrilokajnastrikalavit
    | tridandaghnastrilokeshastrichatrankastribhumipah || 67|| trishalyaristrilorcyastrilokapatisevitah
    | triyogi trikasamvegastrailokyadyastrilokarat || 68|| ananto'nantasaukhyakshiranantakevalekshanah
    | anantavikramo'nantaviryo'nantagunakarah || 69|| ananta vikramo'nantasvavetta'nantashaktiman | anantamahimarudho'nantajno'nantasharmadah
    || 70|| siddho buddhah prasiddhatma svayambuddho'tibuddhiman | siddhidah siddhamargasthah siddharthah
    siddhasadhanah || 71|| siddhasadhyo'tishuddhatma siddhikritsiddhishasanah | susiddhantavishuddhadhyah
    siddhagami budhadhipah || 72|| acyuto'cyutanathesho'calacitto'calasthitih | atiprabho'tisaumyatma
    somarupo'tikantiman || 73|| varishthah sthaviro jyeshtho garishtho'nishtaduragah | drashta pushto
    vishishtatma srashta dhata prajapatih || 74|| padmasanah sapadmankah padmayanashcaturmukhah | shripatih
    shrinivaso hi vijeta purushottamah || 75|| dharmacakradharo dharmi dharmatirthapravarttakah | dharmarajo'tidharmatma
    dharmadharah sudharmadah || 76|| dharmamurttiradharmaghno dharmacakri sudharmadhih | dharmakriddharmabhridharmashilo
    dhamadhinayakah || 77|| mantramurttih sumantrajno mantri mantramayo'dbhutah | tejasvi vikrami svami
    tapasvi samyami yami || 78|| kriti vrati kritarthatma kritakritah kritavidhih | prabhurvibhurgururyogi
    gariyan gurukaryakrit || 79|| vrishabho vrishabhadhisho vrishacinho vrishashrayah | vrishaketurvrishadharo
    vrishabhendro vrishapradah || 80|| brahmatma brahmanishthatma brahma brahmapadeshvarah | brahmajno
    brahmabhutatma brahma ca brahmapalakah || 81|| pujyo'rhan bhagavan stutyah stavanarhah stutishvarah
    | vandyo namaskrito'tyantapranamayogya urjitah || 82|| guni gunakaro'nantagunabdhih gunabhushanah
    | gunadari gunagramo gunarthi gunaparagah || 83|| gunarupo gunatito gunado gunaveshtitah | gunashrayo
    gunatmakto gunasakto'gunantakrit || 84|| gunadhipo gunantahstho gunabhridgunaposhakah | gunaradhyo
    gunajyeshtho gunadharo gunagragah || 85|| pavitrah putasarvangah putavak putashasanah | putakama'tiputatma
    shucih shaucatmako'malah || 86|| karmarih karmashatrughnah kamamrati nikandanah | karmavidhvamsakah
    karmocchedi karmaganashakah || 87|| susamvrittastriguptatma nirashravastriguptivan | vidyamayo'tividyatma
    sarvavidyesha atmavan || 88|| muniryatiranagarah puranapurusho'vyayah | pita pitamaho bhartta kartta
    dantah kshamah shivah || 89|| ishvarah shankaro dhiman bhrityunjayah sanatanah | daksho jnano shami
    dhyani sushilah shilasagarah || 90|| rishih kavih kavindradyah rishindrah rishinayakah | vedango vedavidvedyah
    svasamvedyo'malasthitih || 91|| digambaro hi digvasa jatarupo vidamvarah | nirgrantho granthadurastho
    nihsango nihparigrahah || 92|| dhiro virah prashantatma dhairyashali sulakshanah | shanto gambhira
    atmajnah kalamurttih kaladharah || 93|| yugadipurusho'vyakto vyaktavag vyaktashasanah | anadinidhano
    divyo divyango divyadhidhanah || 94|| tapodhano viyadgami jagaruko'pyatindriyah | anantarddhiracintyarddhirameyarddhih
    pararddhyabhak || 95|| mauni dhuryo bhatah shurah sarthavahah shivadhvagah | sadhurgani sutadharah
    pathako'tindriyarthadrik || 96|| adisha adibhubhartta adima adijineshvarah | aditirthankarashcadisrishtikriccadideshakah
    || 97|| adibrahma''dinatho'rcya adishatkarmadeshakah | adidharmavidhata''didharmarajo'grajo'grimah
    || 98|| shreyan shreyaskarah shreyo'pranih shreyah sukhavahah | shreyodah shreyavarashih shreyavan
    shreyasambhavah || 99|| ajito jitasamsarah sanmatih sanmatipriyah | samskritah prakritah prajno jnanamurttishcyutopamah
    || 100|| nabheya adiyogindra uttamah suvrato manuh | shatrunjayah sumedhavi natho'pyadyo'khilarthavit
    || 101|| kshemi kulakarah kamo devadevo nirutsukah | kshemah kshemankaro'grahyo jnanagamyo niruttarah
    || 102|| stheyamstriptah sadacari sughoshah sanmukhah sukhi | vagmi vagishvaro vacaspatih sadbuddhirunnatah
    || 103|| udaro mokshagami ca mukto muktiprarupakah | bhavyasarthadhipo devo manishi suhitah suhrit
    || 104|| muktibhartta'pratarkyatma divyadehah prabhasvarah | manahpriyo manohari manojnango manoharah
    || 105|| svastho bhutapatih purvah puranapurusho'kshayah | sharanyah pancakalyanapujarho'bandhubandhavah
    || 106|| kalyanatma sukalyanah kalyanah prakritih priyah | subhagah kantiman dipro gudhatma gudhagocarah
    || 107|| jagaccudamanistungo divyabhamandalah sudhih | mahauja'tisphuratkantih suryakotyadhikaprabhah
    || 108|| nishtaptakanakacchayo hemavarnah sphuradyutih | pratapi prabalah purnastejorashirgatopamah
    || 109|| shanteshah shantakarmarih shantikricchantikarakah | bhuktido muktido data jnanabdhih shilasagarah
    || 110|| spashtavak pushtidah pushtah shishteshtah shishtasevitah | spashtaksharo vishishtangah spashtavritto
    vishudvitah || 111|| nishkincano niralambo nipuno nipunashritah | nirmamo nirahankarah prashasto jainavatsalah
    || 112|| tejomayo'mitajyotih shubhramurttistamopahah | punyadah punyahetvatma punyavan punyakarmakrit
    || 113|| punyamurttirmahapunyah punyavak punyashasanah | punyabhokta'tipunyatma punyashali shubhashayah
    || 114|| anidraluratandralurmumukshurmuktivallabhah | muktipriyah prajabandhuh prajakarah prajahitah
    || 115|| shrishah shrishritapadabjah shrivirago viraktadhih | jnanavan bandhamokshajno bandhaghno
    bandhaduragah || 116|| vanavasi jatadhari kleshatito'tisaukhyavan | apto'murtah kanatkayah shaktah
    shaktiprado budhah || 117|| hataksho hatakarmarirhatamoho hitashritah | hatamithyatva atmasthah surupo
    hatadurnayah || 118|| syadvadi ca nayaprokta hitavadi hitadhvanih | bhavyacudamanirbhavyo'samo'samagunashrayah
    || 119|| nirvighno nishcalo lokavatsalo lokalocanah | adeyadima adeyo heyadeyaprarupakah || 120||
    bhadro bhadrashayo bhadrashasano bhadravak kriti | bhadrakridbhadrabhavyadhyo bhadrabandhuranamayah
    || 121|| kevali kevalah lokah kevalajnanalocanah | kevalesho maharddhisho'cchedyo'bhedyo'tisukshmavan
    || 122|| sukshmadarshi kripamurttih kripalushca kripavahah | kripambudhih kripavakyah kripopadeshatatparah
    || 123|| dayanidhirdayadarshityamuni sarthakanyapi | sahasrashtakanamanyarhato jneyani kovidaih ||
    124|| devanena mahanamarashistavaphalena me | vandyastvam dehi sarvani tvannamani gunaih samam ||
    125|| idam namavalidribdhastotram punyam pathetsudhih | nityam yo'rhadgunan prapyaciratso'rhan bhaved
    drisham || 126|| iti bhattarakasakalakirtti
  devanagari: स्वामादौ देव चानम्य स्तोष्ये त्वन्नाम लब्धये । अष्टोत्तरसहस्रेण नाम्ना सार्थेन भक्तिभिः
    ॥ १॥ ॐ जिनेन्द्रो जिनधौरेयो जिनस्वामी जिनाप्रणीः । जिनेशो जिनशार्दूलो जिनाधीशो जिनोत्तमः ॥ २॥ जिनराजो
    जिनज्येष्ठो जिनेशी जिनपालकः । जिननाथो जिनश्रेष्ठो जिनमल्लो जिनोन्नतः ॥ ३॥ जिननेता जिनस्रष्टा जिनेट्
    जिनपतिर्जिनः । जिनदेवो जिनादित्यो जिनेशिता जिनेश्वरः ॥ ४॥ जिनवर्यो जिनाराध्यो जिनार्च्यो जिनपुङ्गवः
    । जिनाधिपो जिनध्येयो जिनमुख्यो जिनेडितः ॥ ५॥ जिनसिंहो जिनप्रेक्षो जिनवृद्धो जिनोत्तरः । जिनमान्यो
    जिनस्तुत्यो जिनप्रभुर्जिनोद्वहः ॥ ६॥ जिनपूज्यो जिनाकाङ्क्षी जिनेन्दुर्जिनसत्तमः । जिनाकारो जिनोत्तुङ्गो
    जिनपो जिनकुञ्जरः ॥ ७॥ जिनभर्त्ता जिनाप्रस्थो जिनभृज्जिनचक्रभाक् । जिनचक्री जिनाद्याद्यो जिनसेव्यो
    जिनाधिपः ॥ ८॥ जिनकान्तो जिनप्रीतो जिनाधिराट् जिनप्रियः । जिनधुर्यो जिनार्चाह्रिर्जिनाग्रिमो जिनस्तुतः
    ॥ ९॥ जिनहंसो जिनत्राता जिनर्षभो जिनाग्रगः । जिनधृज्जिनचक्रेशो जिनदाता जिनात्मकः ॥ १०॥ जिनाधिको जिनालतो
    जिनशान्क्षो जिनोत्कृटः । जिनाश्रितो जिनाल्हादी जिनातर्क्यो जिनान्वितः ॥ ११॥ जैनो जैनवरो जैनस्वामी
    जैनपितामहः । जैनेड्यो जैनसङ्घार्च्य जैनभृज्जैनपालकः ॥ १२॥ जैनकृज्जैनधौरेयो जैनेशो जैनभूपतिः । जैनेड्
    जैनाग्रिमो जैनपिता जैनहितङ्करः ॥ १३॥ जैननेताऽथ जैनाढ्यो जैनधृज्जैनदेवराट् । जैनाधिपो हि जैनात्मा जैनेचयो
    जैनचक्रभृत् ॥ १४॥ जिताक्षो जितकन्दर्पो जितकामो जिताशयः । जितैना जितकर्मारिर्जितेन्द्रियो जिताखिलः
    ॥ १५॥ जितशत्रुर्जिताशौधो जितजेयो जितात्मभाक् । जितलोभो जितक्रोधो जितमानो जितान्तकः ॥ १६॥ जितरागो जितद्वषो
    जितमोहो जिनेश्वरः । जिताऽजय्यो जिताशेषो जितेशो जितदुर्मतः ॥ १७॥ जितवादी जितक्लेशो जितमुण्डो जिताव्रतः
    । जितदेवो जिनशान्तिर्जितखेदो जितारतिः ॥ १८॥ यतीडितो यतीशार्च्यो यतीशो यतिनायकः । यतिमुखो यतिप्रेक्ष्यो
    यतिस्वामी यतीश्वरः ॥ १९॥ यतिर्यतिवरो यत्याराध्यो यतिगुणस्तुतः । यतिश्रेष्ठो यतिज्येष्ठो यतिभर्त्ता
    यतोहितः ॥ २०॥ यतिधुर्यो यतिसृष्टा यतिनाथो यतिप्रभुः । यत्याकरो यतित्राता यतिबन्धुर्यतिप्रियः ॥ २१॥
    योगीन्द्रो योगराड् योगिपतिर्योगिविनायकः । योगीश्वरोऽथ योगीशो योगी योगपरायणः ॥ २२॥ योगपूज्यो हि योगाङ्गो
    योगवान् योगपारगः । योगष्टद्योगरूपात्मा योगभाग्योगभूषितः ॥ २३॥ योग्यान्तो योगिकल्पाङ्गो योगिकृद्योगिवेष्टितः
    । योगिभृद्योगिमुख्यार्च्यो योगिभूर्योगिभूपतिः ॥ २४॥ सर्वज्ञः सर्वलोकज्ञः सर्वदृक् सर्वतत्त्ववित् ।
    सर्वक्रेशसहः सार्वः सर्वचक्षुश्च सर्वराट् ॥ २५॥ सर्वाग्रिमोऽथ सर्वात्मा सर्वेशः सर्वदर्शनः । सर्वेज्यः
    सर्वधर्माङ्गः सर्वजीवदयावहः ॥ २६॥ सर्वज्येष्ठो हि सर्वाधिकः सर्वत्रिजगद्धितः । सर्वधर्ममयः सर्वस्वामी
    सर्वगुणाश्रितः ॥ २७॥ विश्वविद्विश्वनाथार्च्यो विश्वेड्यो विश्वबान्धवः । विश्वनाथोऽथ विश्वार्हो विश्वात्मा
    विश्वकारकः ॥ २८॥ विश्वेड् विश्वपिता विश्वधरो विश्वाभयङ्करः । विश्वव्यापी हि विश्वेशी विश्वधृद्विश्व
    भूमिपः ॥ २९॥ विश्वधीर्विश्वकल्याणो विश्वकृद्विश्वपारगः । विश्ववृद्धोऽपि विश्वाङ्गिराक्षको विश्वपोषकः
    ॥ ३०॥ जगकर्त्ता जगद्भर्त्ता जगत्राता जगजयी । जगन्मान्यो जगज्ज्येष्ठो जगच्छ्रेष्ठो जगत्पतिः ॥ ३१॥ जगद्घृतो
    जगन्नाथो जगद्ध्येयो जगत्स्तुतः । जगत्पाता जगद्धाता जगत्सेव्यो जगछ्रितिः ॥ ३२॥ जगत्स्वामी जगत्पूज्यो
    जगत्सार्थो जगद्धितः । जगद्वेत्ता जगच्चक्षुर्जगद्दर्शी जगत्पिता ॥ ३३॥ जगत्कान्तो जगद्दान्तो जगद्ज्ञाता
    जगज्जितः । जगद्वीरो जगद्वीरो जगत्प्रान्तो जगत्प्रियः ॥ ३४॥ महाज्ञानी महाध्यानी महाकृती महाव्रती ।
    महाराजो महार्थज्ञो महातेजो महातपाः ॥ ३५॥ महाजेता महाजय्यो महाक्षान्तो महादमः । महादान्तो महाशान्तो
    महाकान्तो महाबली ॥ ३६॥ महादेवो महापूतो महायोगी महाधनी । महाकामी महाशूरो महाभटो महायशः ॥ ३७॥ महानादो
    महास्तुत्यो महामहपतिर्महान् । महाधीरो महावीरो महाबन्धुर्महाश्रमः ॥ ३८॥ महाधारो महाकारो महाशर्मा महाश्रयः
    । महायोगी महाभोगी महाब्रह्मा महीधरः ॥ ३९॥ महाधुर्यो महावीर्यो महादर्शी महार्थवित् । महाभर्त्ता महाकर्त्ता
    महाशीलो महागुणी ॥ ४०॥ महाधर्मा महामौनी महाभरो महाग्रिमः । महास्रष्टा महातीर्थो महाख्यातो महाहितः ॥
    ४१॥ महाधन्यो महाधीशो महारूपी महामुनिः । महाविभुर्महाकीर्त्तिर्महादाता महारतः ॥ ४२॥ महाकृपो महाराध्यो
    महाश्रेष्ठो महायतिः । महाक्षान्तिर्महालोको महानेत्रो महार्घकृत् ॥ ४३॥ महाश्रमी महायोग्यो महाशमी महादमी
    । महेशेशो महेशात्मा महेशार्च्यो महेशराट् ॥ ४४॥ महानन्तो महातृप्तो महाहरो महावरः । महर्षीशो महाभागो
    महास्थानो महान्तकः ॥ ४५॥ महोदर्यो महाकार्यो महाकेवललब्धिभाक् । महाशिष्टो महानिष्टो महादसो महाबलः ॥
    ४६॥ महालक्षो महार्थज्ञो महाविद्वान् महात्मकः । महेज्यार्हो महानाथो महानेता महापिता ॥ ४७॥ महामना महाचिन्त्यो
    महासारो महायमी । महेन्द्रार्च्यो महावन्द्यो महावादी महानुतः ॥ ४८॥ परमात्मा परात्मज्ञः परञ्ज्योतिः
    परार्थकृत् । परब्रह्म परब्रह्मरूपो परतरः परः ॥ ४९॥ परमेशः परेज्याः परार्थी परकार्यष्टत् । परस्वामी
    परज्ञानी पराधीशः परेहकः ॥ ५०॥ सत्यवादी हि सत्यात्मा सत्याङ्गः सत्यशासनः । सत्यार्थः सत्यवागीशः सत्याधारोऽतिसत्यवाक्
    ॥ ५१॥ सत्यायः सत्यविद्येशः सत्यधर्मी हि सत्यभाक् । सत्याशयोऽतिसत्योक्तमतः सत्यहितङ्करः ॥ ५२॥ सत्यतिर्थोऽतिसत्याढ्यः
    सत्यात्तः सत्यतीर्थकृत् । सत्य सीमाधरः सत्यधर्मतीर्थप्रवत्तकः ॥ ५३॥ लोकेशो लोकनाथार्च्यो लोकालोकविलोकनः
    । लोकविल्लोकमूर्द्धस्थो लोकनाथो ह्यलोकवित् ॥ ५४॥ लोकदृक् लोककार्यार्थी लोकज्ञो लोकपालकः । लोकेड्यो
    लोकमाङ्गल्यो लोकोत्तमो हि लोकराट् ॥ ५५॥ तीर्थकृत्तीर्थभूतात्मा तीर्थेशस्तीर्थकारकः । तीर्थभृत्तीर्थकर्त्ता
    तीर्थप्रणेता सुतीर्थभाक् ॥ ५६॥ तीर्थाधीशो हि तीर्थामा तीर्थज्ञस्तीर्थनायकः । तीर्थाढ्यस्तीर्थसद्राजा
    तीर्थधृत्तीर्थवर्त्तकः ॥ ५७॥ तीर्थङ्करो हि तीर्थेशतीर्थोद्यस्तीर्थपालकः । तीर्थसृष्टाऽऽतीर्थद्धिस्तीर्थाग्रस्तीर्थदेशकः
    ॥ ५८॥ निःकर्मा निर्मलो नित्यो निराबाधो निरामयः । निस्तमस्को निरौपम्यो निष्कलङ्को निरायुधः ॥ ५९॥ निर्लेपो
    निष्कलोऽत्यन्तनिर्दोषो निर्जराग्रणीः । निस्वप्नो निर्भयोऽतीवनिःप्रमादो निराश्रयः ॥ ६०॥ निरम्बरो निरातङ्को
    निर्भूषो निर्मलाशयः । निर्मदो निरतोचारो निर्मोहो निरुपद्रवः ॥ ६१॥ निर्विकारो निराधारो निरीहो निर्मलाङ्गभाक्
    । निर्जरो निरजस्कोऽथ निराशो निर्विशेषवित् ॥ ६२॥ निर्निमेषो निराकारो निरतो निरतिक्रमः । निर्वेदो निष्कषायात्मा
    निर्बन्न्धो निस्पृहाप्रगः ॥ ६३॥ विरजा विमलात्मज्ञो विमलो विमलान्तरः । विरतोर्विरताधीशो विरागो वीतमत्सरः
    ॥ ६४॥ विभवो विभवान्तस्थो वीतरागो विचारकृत् । विश्वासी विगताबाधो विचारज्ञो विशारदः ॥ ६५॥ विवेकी विगतग्रन्थो
    विविक्तोऽव्यक्तसंस्थितिः । विजयी विजितारातिर्विनष्टारिर्वियच्छ्रितः ॥ ६६॥ त्रिरत्नेशस्त्रिपीठस्थस्त्रिलोकज्ञस्त्रिकालवित्
    । त्रिदण्डघ्नस्त्रिलोकेशस्त्रिछत्राङ्कस्त्रिभूमिपः ॥ ६७॥ त्रिशल्यारिस्त्रिलोर्च्यस्त्रिलोकपतिसेवितः
    । त्रियोगी त्रिकसंवेगस्त्रैलोक्याड्यस्त्रिलोकराट् ॥ ६८॥ अनन्तोऽनन्तसौख्याक्षिरनन्तकेवलेक्षणः । अनन्तविक्रमोऽनन्तवीर्योऽनन्तगुणाकरः
    ॥ ६९॥ अनन्त विक्रमोऽनन्तस्ववेत्ताऽनन्तशक्तिमान् । अनन्तमहिमारुढोऽनन्तज्ञोऽनन्तशर्मदः ॥ ७०॥ सिद्धो
    बुद्धः प्रसिद्धात्मा स्वयम्बुद्धोऽतिबुद्धिमान् । सिद्धिदः सिद्धमार्गस्थः सिद्धार्थः सिद्धसाधनः ॥ ७१॥
    सिद्धसाध्योऽतिशुद्धात्मा सिद्धिकृत्सिद्धिशासनः । सुसिद्धान्तविशुद्धाढ्यः सिद्धगामी बुधाधिपः ॥ ७२॥
    अच्युतोऽच्युतनाथेशोऽचलचित्तोऽचलस्थितिः । अतिप्रभोऽतिसौम्यात्मा सोमरूपोऽतिकान्तिमान् ॥ ७३॥ वरिष्ठः
    स्थविरो ज्येष्ठो गरिष्ठोऽनिष्टदूरगः । द्रष्टा पुष्टो विशिष्टात्मा स्रष्टा धाता प्रजापतिः ॥ ७४॥ पद्मासनः
    सपद्माङ्कः पद्मयानश्चतुर्मुखः । श्रीपतिः श्रीनिवासो हि विजेता पुरुषोत्तमः ॥ ७५॥ धर्मचक्रधरो धर्मी
    धर्मतीर्थप्रवर्त्तकः । धर्मराजोऽतिधर्मात्मा धर्माधारः सुधर्मदः ॥ ७६॥ धर्ममूर्त्तिरधर्मघ्नो धर्मचक्री
    सुधर्मधीः । धर्मकृद्धर्मभृधर्मशीलो धमधिनायकः ॥ ७७॥ मन्त्रमूर्त्तिः सुमन्त्रज्ञो मन्त्री मन्त्रमयोऽद्भुतः
    । तेजस्वी विक्रमी स्वामी तपस्वी संयमी यमी ॥ ७८॥ कृती व्रती कृतार्थात्मा कृतकृतः कृताविधिः । प्रभुर्विभुर्गुरुर्योगी
    गरीयान् गुरुकार्यकृत् ॥ ७९॥ वृषभो वृषभाधीशो वृषचिन्हो वृषाश्रयः । वृषकेतुर्वृषाधारो वृषभेन्द्रो वृषप्रदः
    ॥ ८०॥ ब्रह्मात्मा ब्रह्मनिष्ठात्मा ब्रह्मा ब्रह्मपदेश्वरः । ब्रह्मज्ञो ब्रह्मभूतात्मा ब्रह्मा च ब्रह्मपालकः
    ॥ ८१॥ पूज्योऽर्हन् भगवान् स्तुत्यः स्तवनार्हः स्तुतीश्वरः । वन्द्यो नमस्कृतोऽत्यन्तप्रणामयोग्य ऊर्जितः
    ॥ ८२॥ गुणी गुणाकरोऽनन्तगुणाब्धिः गुणभूषणः । गुणादरी गुणग्रामो गुणार्थी गुणपारगः ॥ ८३॥ गुणरूपो गुणातीतो
    गुणदो गुणवेष्टितः । गुणाश्रयो गुणात्माक्तो गुणसक्तोऽगुणान्तकृत् ॥ ८४॥ गुणाधिपो गुणान्तःस्थो गुणभृद्गुणपोषकः
    । गुणाराध्यो गुणज्येष्ठो गुणाधारो गुणाग्रगः ॥ ८५॥ पवित्रः पूतसर्वाङ्गः पूतवाक् पूतशासनः । पूतकमाऽतिपूतात्मा
    शुचिः शौचात्मकोऽमलः ॥ ८६॥ कर्मारिः कर्मशत्रुघ्नः कमांराति निकन्दनः । कर्मविध्वंसकः कर्मोच्छेदी कर्मागनाशकः
    ॥ ८७॥ सुसंवृत्तस्त्रिगुप्तात्मा निराश्रवस्त्रिगुप्तिवान् । विद्यामयोऽतिविद्यात्मा सर्वविद्येश आत्मवान्
    ॥ ८८॥ मुनिर्यतिरनागारः पुराणपुरुषोऽव्ययः । पिता पितामहो भर्त्ता कर्त्ता दान्तः क्षमः शिवः ॥ ८९॥ ईश्वरः
    शङ्करो धीमान् भृत्युञ्जयः सनातनः । दक्षो ज्ञानो शमी ध्यानी सुशीलः शीलसागरः ॥ ९०॥ ऋषिः कविः कवीन्द्राद्यः
    ऋषीन्द्रः ऋषिनायकः । वेदाङ्गो वेदविद्वेद्यः स्वसंवेद्योऽमलस्थितिः ॥ ९१॥ दिगम्बरो हि दिग्वासा जातरूपो
    विदांवरः । निर्ग्रन्थो ग्रन्थदूरस्थो निःसङ्गो निःपरिग्रहः ॥ ९२॥ धीरो वीरः प्रशान्तात्मा धैर्यशाली
    सुलक्षणः । शान्तो गम्भीर आत्मज्ञः कलमूर्त्तिः कलाधरः ॥ ९३॥ युगादिपुरुषोऽव्यक्तो व्यक्तवाग् व्यक्तशासनः
    । अनादिनिधनो दिव्यो दिव्याङ्गो दिव्यधीधनः ॥ ९४॥ तपोधनो वियद्गामी जागरूकोऽप्यतीन्द्रियः । अनन्तर्द्धिरचिन्त्यर्द्धिरमेयर्द्धिः
    परार्द्ध्यभाक् ॥ ९५॥ मौनी धुर्यो भटः शूरः सार्थवाहः शिवाध्वगः । साधुर्गणी सुताधारः पाठकोऽतीन्द्रियार्थदृक्
    ॥ ९६॥ आदीश अदिभूभर्त्ता आदिम आदिजिनेश्वरः । आदितीर्थङ्करश्चादिसृष्टिकृच्चादिदेशकः ॥ ९७॥ आदिब्रह्माऽऽदिनाथोऽर्च्य
    आदिषट्कर्मदेशकः । अदिधर्मविधाताऽऽदिधर्मराजोऽग्रजोऽग्रिमः ॥ ९८॥ श्रेयान् श्रेयस्करः श्रेयोऽप्रणीः श्रेयः
    सुखावहः । श्रेयोदः श्रेयवाराशिः श्रेयवान् श्रेयसम्भवः ॥ ९९॥ अजितो जितसंसारः सन्मतिः सन्मतिप्रियः ।
    संस्कृतः प्राकृतः प्राज्ञो ज्ञानमूर्त्तिश्च्युतोपमः ॥ १००॥ नाभेय आदियोगीन्द्र उत्तमः सुव्रतो मनुः
    । शत्रुञ्जयः सुमेधावी नाथोऽप्याद्योऽखिलार्थवित् ॥ १०१॥ क्षेमी कुलकरः कामो देवदेवो निरुत्सुकः । क्षेमः
    क्षेमङ्करोऽग्रह्यो ज्ञानगम्यो निरुत्तरः ॥ १०२॥ स्थेयांस्तृप्तः सदाचारी सुघोषः सन्मुखः सुखी । वाग्मी
    वागीश्वरो वाचस्पतिः सद्बुद्धिरुन्नतः ॥ १०३॥ उदारो मोक्षगामी च मुक्तो मुक्तिप्ररूपकः । भव्यसार्थाधिपो
    देवो मनीषी सुहितः सुहृत् ॥ १०४॥ मुक्तिभर्त्ताऽप्रतर्क्यात्मा दिव्यदेहः प्रभास्वरः । मनःप्रियो मनोहारी
    मनोज्ञाङ्गो मनोहरः ॥ १०५॥ स्वस्थो भूतपतिः पूर्वः पुराणपुरुषोऽक्षयः । शरण्यः पञ्चकल्याणपूजार्होऽबन्धुबान्धवः
    ॥ १०६॥ कल्याणात्मा सुकल्याणः कल्याणः प्रकृतिः प्रियः । सुभगः कान्तिमान् दीप्रो गूढात्मा गूढगोचरः ॥
    १०७॥ जगच्चूडामणिस्तुङ्गो दिव्यभामण्डलः सुधीः । महौजाऽतिस्फुरत्कान्तिः सूर्यकोट्यधिकप्रभः ॥ १०८॥ निष्टप्तकनकच्छायो
    हेमवर्णः स्फुरद्युतिः । प्रतापी प्रबलः पूर्णस्तेजोराशिर्गतोपमः ॥ १०९॥ शान्तेशः शान्तकर्मारिः शान्तिकृच्छान्तिकारकः
    । भुक्तिदो मुक्तिदो दाता ज्ञानाब्धिः शीलसागरः ॥ ११०॥ स्पष्टवाक् पुष्टिदः पुष्टः शिष्टेष्टः शिष्टसेवितः
    । स्पष्टाक्षरो विशिष्टाङ्गः स्पष्टवृत्तो विशुद्वितः ॥ १११॥ निष्किञ्चनो निरालम्बो निपुणो निपुणाश्रितः
    । निर्ममो निरहङ्कारः प्रशस्तो जैनवत्सलः ॥ ११२॥ तेजोमयोऽमितज्योतिः शुभ्रमूर्त्तिस्तमोपहः । पुण्यदः
    पुण्यहेत्वात्मा पुण्यवान् पुण्यकर्मकृत् ॥ ११३॥ पुण्यमूर्त्तिर्महापुण्यः पुण्यवाक् पुण्यशासनः । पुण्यभोक्ताऽतिपुण्यात्मा
    पुण्यशाली शुभाशयः ॥ ११४॥ अनिद्रालुरतन्द्रालुर्मुमुक्षुर्मुक्तिवल्लभः । मुक्तिप्रियः प्रजाबन्धुः प्रजाकरः
    प्रजाहितः ॥ ११५॥ श्रीशः श्रीश्रितपादाब्जः श्रीविरागो विरक्तधीः । ज्ञानवान् बन्धमोक्षज्ञो बन्धघ्नो
    बन्धदूरगः ॥ ११६॥ वनवासी जटाधारी क्लेशातीतोऽतिसौख्यवान् । आप्तोऽमूर्तः कनत्कायः शक्तः शक्तिप्रदो बुधः
    ॥ ११७॥ हताक्षो हतकर्मारिर्हतमोहो हिताश्रितः । हतमिथ्यात्व आत्मस्थः सुरूपो हतदुर्नयः ॥ ११८॥ स्याद्वादी
    च नयप्रोक्ता हितवादी हितध्वनिः । भव्यचूडामणिर्भव्योऽसमोऽसमगुणाश्रयः ॥ ११९॥ निर्विघ्नो निश्चलो लोकवत्सलो
    लोकलोचनः । आदेयादिम आदेयो हेयादेयप्ररूपकः ॥ १२०॥ भद्रो भद्राशयो भद्रशासनो भद्रवाक् कृती । भद्रकृद्भद्रभव्याढ्यो
    भद्रबन्धुरनामयः ॥ १२१॥ केवली केवलः लोकः केवलज्ञानलोचनः । केवलेशो महर्द्धीशोऽच्छेद्योऽभेद्योऽतिसूक्ष्मवान्
    ॥ १२२॥ सूक्ष्मदर्शी कृपामूर्त्तिः कृपालुश्च कृपावहः । कृपाम्बुधिः कृपावाक्यः कृपोपदेशतत्परः ॥ १२३॥
    दयानिधिर्दयादर्शीत्यमूनि सार्थकान्यपि । सहस्राष्टकनामान्यर्हतो ज्ञेयानि कोविदैः ॥ १२४॥ देवानेन महानामराशिस्तवफलेन
    मे । वन्द्यस्त्वं देहि सर्वाणि त्वन्नामानि गुणैः समम् ॥ १२५॥ इदं नामावलीदृब्धस्तोत्रं पुण्यं पठेत्सुधीः
    । नित्यं योऽर्हद्गुणान् प्राप्याचिरात्सोऽर्हन् भवेद् दृशाम् ॥ १२६॥ इति भट्टारकसकलकीर्त्ति
