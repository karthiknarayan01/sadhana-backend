id: raghavendrahridrogaharanastotram
category: stotram
name:
  english: raghavendrahridrogaharanastotram
  devanagari: राघवेन्द्रहृद्रोगहरणस्तोत्रम्
content:
  english: shriraghavendrahridrogaharanastotram shrirame gunadhamani vinihita cittaprabho dayapurna |
    gururadudarabhava tvam hara hridrogamatiturnam || 1|| rajivakshikankshapurana santapasantatabhyastam
    | ceto me gururaja tvam hara hridrogamatiturnam || 2|| ghorashabhidhabhutavishtam bhrishamasthiram
    sada bhramati | ceto me gururaja tvam hara hridrogamataturnam || 3|| vedapuranasumarganujjhitva dushtanicamargacaram
    | ceto me gururaja tvam hara hridrogamatiturnam || 4|| dragishtarthadamishamalabdhvanyanupasya bahukhinnam
    | ceto me gururaja tvam hara hridrogamatiturnam || 5|| yatnat kapurushadhikasevavidhinapi napa kamyartham
    | ceto me gururaja tvam hara hridrogamatiturnam || 6|| nartetvadbhuvi kancana janite'nyam kalau suradrusamam
    | ceto me gururaja tvam hara hridrogamatiturnam || 7|| mahimanam tava bhuyah shrutva tvatpadapankajam
    praptam | ceto me gururaja tvam hara hridrogamatiturnam || 8|| krishnavadhutaracitam pathyopetam manorogaharam
    | stotram me pathatam tvam samhara hridrogamatiturnam || 9|| iti shrikrishnavadhutaviracite shriraghavendratantre
    navamapatale hridrogaharanastotram nama shashtho'dhyayah sampurnah |
  devanagari: श्रीराघवेन्द्रहृद्रोगहरणस्तोत्रम् श्रीरामे गुणधामनि विनिहित चित्तप्रभो दयापूर्ण । गुरुराडुदारभाव
    त्वं हर हृद्रोगमतितूर्णम् ॥ १॥ राजीवाक्षीकाङ्क्षापूरण सन्तापसन्तताभ्यस्तम् । चेतो मे गुरुराज त्वं
    हर हृद्रोगमतितूर्णम् ॥ २॥ घोराशाभिधभूताविष्टं भृशमस्थिरं सदा भ्रमति । चेतो मे गुरुराज त्वं हर हृद्रोगमततूर्णम्
    ॥ ३॥ वेदपुराणसुमार्गानुज्झित्वा दुष्टनीचमार्गचरम् । चेतो मे गुरुराज त्वं हर हृद्रोगमतितूर्णम् ॥ ४॥
    द्रागिष्टार्थदमीशमलब्ध्वान्यानुपास्य बहुखिन्नम् । चेतो मे गुरुराज त्वं हर हृद्रोगमतितूर्णम् ॥ ५॥ यत्नात्
    कापुरुषाधिकसेवाविधिनापि नाप काम्यार्थम् । चेतो मे गुरुराज त्वं हर हृद्रोगमतितूर्णम् ॥ ६॥ नर्तेत्वद्भुवि
    कञ्चन जानीतेऽन्यं कलौ सुरद्रुसमम् । चेतो मे गुरुराज त्वं हर हृद्रोगमतितूर्णम् ॥ ७॥ महिमानं तव भूयः
    श्रुत्वा त्वत्पादपङ्कजं प्राप्तम् । चेतो मे गुरुराज त्वं हर हृद्रोगमतितूर्णम् ॥ ८॥ कृष्णावधूतरचितं
    पथ्योपेतं मनोरोगहरम् । स्तोत्रं मे पठतां त्वं संहर हृद्रोगमतितूर्णम् ॥ ९॥ इति श्रीकृष्णावधूतविरचिते
    श्रीराघवेन्द्रतन्त्रे नवमपटले हृद्रोगहरणस्तोत्रं नाम षष्ठोऽध्यायः सम्पूर्णः ।
