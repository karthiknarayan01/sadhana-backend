id: vilapakusumanjalih
category: shataka
name:
  english: vilapakusumanjalih
  devanagari: विलापकुसुमान्जलिः
content:
  english: dgatyatopaih shramavilulitam devi padabjayugmam | snehatsamvahayitumapi hripunjamurte'pyalajjam
    namagraham nijajanamimam ha kada notsyasi tvam || 82|| ha naptri radhe tava suryabhakteh kalah samutpanna
    itah kuto'si | itiva roshanmukhara lapanti sudheva kim mam sukhayishyatiha || 83|| devi bhashitapiyusham
    smitakarpuravasitam | shrotrabhyam nayanabhyam te kim nu sevishyate maya || 84|| kusumacayanakhelam
    kurvati tvam parita rasakutilasakhibhih prananathena sardham | kapatakalahakelya kvapi roshena bhinna
    mama mudamatibelam dhasyase suvrate kim || 85|| nanavidhaih prithulakakubharairasahyaih samprarthitah
    priyataya bata madhavena | tvanmanabhangavidhaye sadaye jano'yam vyagrah patishyati kada lalitapadante
    || 86|| pritya mangalagitanrityavilasadvinadivadyotsavaih shuddhanam payasam ghatairbahuvidhaih samvasitanam
    bhrisham | vrindaranyamahadhipatyavidhaye yah paurnamasya svayam dhire samvihitah sa kim tava mahaseko
    maya drakshyate || 87|| bhratra goyutamatra manjuvadane snehena dattvalayam shridamna kripanam pratoshya
    jatilam rakshakhyarakakshane | nitayah sukhashokarodanabharaiste sandravantyah param vatsalyajjanakau
    vidhasyata itah kim lalanam me'gratah || 88|| lajjayalipuratah parato mam gahvaram giripaterbata nitva
    | divyaganamapi tatsvarabhedam shikshyayishyasi kada sadaye tvam || 89|| yacita lalitaya kila devya
    lajjaya natamukhim ganato mam | devi divyarasakavyakadambam pathayishyasi kada pranayena || 90|| nijakundatatikunje
    gunjadbhramarasankule | devi tvam kacchapishiksham kada mam karayishyasi || 91|| viharaistrutitam
    haram gumphitum dayitam kada | sakhinam lajjaya devi samjnaya mam nidekshyasi || 92|| svamukhanmanmukhe
    devi kada tambulacarvitam | snehatsarvadishe vikshya samaye tvam pradasyasi || 93|| nividamadanayuddhe
    prananathena sardham dayitamadhurakanci ya madadvismritasit | shashimukhi samaye tam hanta sambhalya
    bhangya tvaritamiha tadartham kim tvayaham praheya || 94|| kenapi doshalavamatralavena devi santadyamana
    iha dhiramate tvayoccaih | roshena tallalitaya kila niyamanah sandrakshyate kimu manaksadaram jano'yam
    || 95|| tavaivasmi tavaivasmi na jivami tvaya vina | iti vijnaya devi tvam naya mam caranantike ||
    96|| svakundam tava lolakshi sapriyayah sadaspadam | atraiva mama samvasa ihaiva mama samsthitih ||
    97|| he shrisarovara sada tvayi sa madisha preshthena sardhamiha khelati kamarangaih | tvam cetpriyatpriyamativa
    tayoritimam ha darshayadya kripaya mama jivitam tam || 98|| kshanamapi tava sangam na tyajedeva devi
    tvamasi samavayastvannarmabhumiryadasyah | iti sumukhi vishakhe darshayitva madisham mama virahahatayah
    pranaraksham kurushva || 99|| ha natha gokulasudhakara suprasanna vaktraravinda madhurasmita he kripardra
    | yatra tvaya viharate pranayaih priyara
  devanagari: द्गत्याटोपैः श्रमविलुलितं देवि पादाब्जयुग्मम् । स्नेहात्संवाहयितुमपि ह्रीपुञ्जमूर्तेऽप्यलज्जं
    नामग्राहं निजजनमिमं हा कदा नोत्स्यसि त्वम् ॥ ८२॥ हा नप्त्रि राधे तव सूर्यभक्तेः कालः समुत्पन्न इतः
    कुतोऽसि । इतीव रोषान्मुखरा लपन्ती सुधेव किं मां सुखयिष्यतीह ॥ ८३॥ देवि भाषितपीयूषं स्मितकर्पूरवासितम्
    । श्रोत्राभ्यां नयनाभ्यां ते किं नु सेविष्यते मया ॥ ८४॥ कुसुमचयनखेलां कुर्वती त्वं परीता रसकुटिलसखीभिः
    प्राणनाथेन सार्धम् । कपटकलहकेल्या क्वापि रोषेण भिन्ना मम मुदमतिबेलं धास्यसे सुव्रते किम् ॥ ८५॥ नानाविधैः
    पृथुलकाकुभरैरसह्यैः संप्रार्थितः प्रियतया बत माधवेन । त्वन्मानभङ्गविधये सदये जनोऽयं व्यग्रः पतिष्यति
    कदा ललितापदान्ते ॥ ८६॥ प्रीत्या मङ्गलगीतनृत्यविलसद्वीणादिवाद्योत्सवैः शुद्धानां पयसां घटैर्बहुविधैः
    संवासितानां भृशम् । वृन्दारण्यमहाधिपत्यविधये यः पौर्णमास्या स्वयं धीरे संविहितः स किं तव महासेको मया
    द्रक्ष्यते ॥ ८७॥ भ्रात्रा गोयुतमत्र मञ्जुवदने स्नेहेन दत्त्वालयं श्रीदाम्ना कृपणां प्रतोष्य जटिलां
    रक्षाख्यराकाक्षणे । नीतायाः सुखशोकरोदनभरैस्ते सन्द्रवन्त्याः परं वात्सल्याज्जनकौ विधास्यत इतः किं
    लालनां मेऽग्रतः ॥ ८८॥ लज्जयालिपुरतः परतो मां गह्वरं गिरिपतेर्बत नीत्वा । दिव्यगानमपि तत्स्वरभेदं शिक्ष्ययिष्यसि
    कदा सदये त्वम् ॥ ८९॥ याचिता ललितया किल देव्या लज्जया नतमुखीं गणतो माम् । देवि दिव्यरसकाव्यकदम्बं पाठयिष्यसि
    कदा प्रणयेन ॥ ९०॥ निजकुण्डतटिकुञ्जे गुञ्जद्भ्रमरसङ्कुले । देवि त्वं कच्छपिशिक्षां कदा मां कारयिष्यसि
    ॥ ९१॥ विहारैस्त्रुटितं हारं गुम्फितुं दयितं कदा । सखीनां लज्जया देवि संज्ञया मां निदेक्ष्यसि ॥ ९२॥
    स्वमुखान्मन्मुखे देवि कदा ताम्बूलचर्वितम् । स्नेहात्सर्वदिशे वीक्ष्य समये त्वं प्रदास्यसि ॥ ९३॥ निविडमदनयुद्धे
    प्राणनाथेन सार्धं दयितमधुरकाञ्ची या मदाद्विस्मृतासीत् । शशिमुखि समये तां हन्त सम्भाल्य भङ्ग्या त्वरितमिह
    तदर्थं किं त्वयाहं प्रहेया ॥ ९४॥ केनापि दोषलवमात्रलवेन देवि सन्ताड्यमान इह धीरमते त्वयोच्चैः । रोषेण
    तल्ललितया किल नीयमानः सन्द्रक्ष्यते किमु मनाक्सदरं जनोऽयम् ॥ ९५॥ तवैवास्मि तवैवास्मि न जीवामि त्वया
    विना । इति विज्ञाय देवि त्वं नय मां चरणान्तिके ॥ ९६॥ स्वकुण्डं तव लोलाक्षि सप्रियायाः सदास्पदम् ।
    अत्रैव मम संवास इहैव मम संस्थितिः ॥ ९७॥ हे श्रीसरोवर सदा त्वयि सा मदीशा प्रेष्ठेन सार्धमिह खेलति कामरङ्गैः
    । त्वं चेत्प्रियात्प्रियमतीव तयोरितीमां हा दर्शयाद्य कृपया मम जीवितं ताम् ॥ ९८॥ क्षणमपि तव सङ्गं न
    त्यजेदेव देवी त्वमसि समवयस्त्वान्नर्मभूमिर्यदस्याः । इति सुमुखि विशाखे दर्शयित्वा मदीशां मम विरहहतायाः
    प्राणरक्षां कुरुष्व ॥ ९९॥ हा नाथ गोकुलसुधाकर सुप्रसन्न वक्त्रारविन्द मधुरस्मित हे कृपार्द्र । यत्र
    त्वया विहरते प्रणयैः प्रियारा
