id: trailokyamohanasitakavacam
category: kavacha
name:
  english: trailokyamohanasitakavacam
  devanagari: त्रैलोक्यमोहनसीताकवचम्
content:
  english: nilambhojadalabhiramanayanam nilambaralankritam gaurangim sharadindusundaramukhim vismerabimbadharam
    | karunyamritavarshinim hariharabrahmadibhirvanditam dhyayedbhaktajanepsitarthaphaladam ramapriyam
    janakim || om shiro me bhubhava patu lalate janakatmaja | netre patu kuja caiva vaidehi shrutirakshini
    || 1|| jihvam me janaki patu grivam janakanandini | skandhau patu mahamaya bhujau patu sulocana ||
    2|| karau patu sada sita hridayam ramaparshvaga | madhyam patu ca padmakshi nabhim me vanavasini ||
    3|| katim yogeshvari patu sakthinim mrigadhvamsini | uru me patu vaidehi januni bhillamokshini ||
    4|| janghe balipramathini catushpadi daityanashini | sarvangam patu svacchangi sada patu prabodhini
    || 5|| vibhishanashrida patu sadyashcaiva disho dasha | sitayah kavacam hyetaddevanamapi durlabham
    || 6|| trailokyamohanam nama trailokyadhanadayakam | mucyate sarvapapebhyo nirvanamadhigacchati ||
    7|| ashvamedhayutaphalam pathanallabhate narah | nityam pathati bhaktya yah tasya sita prasidati ||
    8|| rajyalabho bhavettasya mama bhaktishca pushkala | yah pathettu mamagre vai pujakale prayatnatah
    | saumitre ca sha
  devanagari: नीलाम्भोजदलाभिरामनयनां नीलाम्बरालङ्कृतां गौराङ्गीं शरदिन्दुसुन्दरमुखीं विस्मेरबिम्बाधराम्
    । कारुण्यामृतवर्षिणीं हरिहरब्रह्मादिभिर्वन्दितां ध्यायेद्भक्तजनेप्सितार्थफलदां रामप्रियां जानकीम्
    ॥ ॐ शिरो मे भूभवा पातु ललाटे जनकात्मजा । नेत्रे पातु कुजा चैव वैदेही श्रुतिरक्षिणी ॥ १॥ जिह्वां मे
    जानकी पातु ग्रीवां जनकनन्दिनी । स्कन्धौ पातु महामाया भुजौ पातु सुलोचना ॥ २॥ करौ पातु सदा सीता हृदयं
    रामपार्श्वगा । मध्यं पातु च पद्माक्षी नाभिं मे वनवासिनी ॥ ३॥ कटिं योगेश्वरी पातु सक्थिनीं मृगध्वंसिनी
    । उरू मे पातु वैदेही जानुनी भिल्लमोक्षिणी ॥ ४॥ जङ्घे बालिप्रमाथिनी चतुष्पदी दैत्यनाशिनी । सर्वाङ्गं
    पातु स्वच्छाङ्गी सदा पातु प्रबोधिनी ॥ ५॥ विभीषणश्रीदा पातु सद्यश्चैव दिशो दश । सीतायाः कवचं ह्येतद्देवानामपि
    दुर्लभम् ॥ ६॥ त्रैलोक्यमोहनं नाम त्रैलोक्यधनदायकम् । मुच्यते सर्वपापेभ्यो निर्वाणमधिगच्छति ॥ ७॥ अश्वमेधायुतफलं
    पठनाल्लभते नरः । नित्यं पठति भक्त्या यः तस्य सीता प्रसीदति ॥ ८॥ राज्यलाभो भवेत्तस्य मम भक्तिश्च पुष्कला
    । यः पठेत्तु ममाग्रे वै पूजाकाले प्रयत्नतः । सौमित्रे च श
