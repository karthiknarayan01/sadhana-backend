id: narayaniyam-dashaka-98
category: stotram
name:
  english: Narayaniyam Dashaka 98
content:
  english: yasminnetadvibhatam yata idamabhavadyena cedam ya eta dyo'smaduttirnarupah khalu sakalamidam
    bhasitam yasya bhasa | yo vacam duradure punarapi manasam yasya deva munindrah no vidyustattvarupam
    kimu punarapare krishna tasmai namaste || || janmatho karma nama sphutamiha gunadoshadikam va na yasmin
    lokanamutaye yah svayamanubhajate tani mayanusari | vibhracchaktirarupo'pi ca bahutararupo'vabhatyadbhutatma
    tasmai kaivalyadhamne pararasaparipurnaya vishno namaste || || no tiryancanna martyam na ca suramasuram
    na striyam no pummamsam na dravyam karma jatim gunamapi sadasadvapi te rupamahuh | shishtam yat syannishedhe
    sati nigamashatairlakshanavrittitastat kricchrenavedyamanam paramasukhamayam bhati tasmai namaste
    || || mayayam bimbitastvam srijasi mahadahankaratanmatrabhedai rbhutagramendriyadyairapi sakalajagatsvapnasankalpakalpam
    | bhuyah samhritya sarvam kamatha iva padanyatmana kalashaktya gambhire jayamane tamasi vitimiro bhasi
    tasmai namaste || || shabdabrahmeti karmetyanuriti bhagavan kala ityalapanti tvamekam vishvahetum
    sakalamayataya sarvatha kalpyamanam | vedantairyattu gitam purushaparacidatmabhidham tattu tattvam
    prekshamatrena mulaprakritivikritikrit krishna tasmai namaste || || sattvenasattaya va na ca khalu
    sadasattvena nirvacyarupa dhatte yasavavidya gunaphanimativadvishvadrishyavabhasam | vidyatvam saiva
    yata shrutivacanalavairyatkripasyandalabhe samsararanyasadyastrutanaparashutameti tasmai namaste ||
    || bhushasu svarnavadva jagati ghatasharavadike mrittikava ttattve sancintyamane sphurati tadadhunapyadvitiyam
    vapuste | svapnadrashtuh prabodhe timiralayavidhau jirnarajjoshca yadva dvidyalabhe tathaiva sphutamapi
    vikaset krishna tasmai namaste || || yadbhityodeti suryo dahati ca dahano vati vayustathanye yadbhitah
    padmajadyah punarucitabalinaharante'nukalam | yenaivaropitah prannijapadamapi te cyavitarashca pashcat
    tasmai vishvam niyantre vayamapi bhavate krishna kurmah pranamam || || trailokyam bhavayantam trigunamayamidam
    tryaksharasyaikavacyam trishanamaikyarupam tribhirapi nigamairgiyamanasvarupam | tisrovastha vidantam
    triyugajanijusham trikramakrantavishvam traikalye bhedahinam tribhirahamanisham yogabhedairbhaje tvam
    || || satyam shuddham vibuddham jayati tava vapurnityamuktam niriham nirdvandvam nirvikaram nikhilagunaganavyanjanadharabhutam
    | nirmulam nirmalam tanniravadhimahimollasi nirlinamanta rnissanganam muninam nirupamaparamanandasandraprakasham
    || || durvaram dvadasharam trishataparimilatshashtiparvabhivitam sambhramyat kruravegam kshanamanu
    jagadacchidya sandhavamanam | cakram te kalarupam vyathayatu na tu mam tvatpadaikavalambam vishno
    karunyasindho pavanapurapate pahi sarvamayaughat ||
  devanagari: यस्मिन्नेतद्विभातं यत इदमभवद्येन चेदं य एत द्योऽस्मादुत्तीर्णरूपः खलु सकलमिदं भासितं यस्य
    भासा । यो वाचां दूरदूरे पुनरपि मनसां यस्य देवा मुनीन्द्राः नो विद्युस्तत्त्वरूपं किमु पुनरपरे कृष्ण
    तस्मै नमस्ते ॥ ॥ जन्माथो कर्म नाम स्फुटमिह गुणदोषादिकं वा न यस्मिन् लोकानामूतये यः स्वयमनुभजते तानि
    मायानुसारी । विभ्रच्छक्तीररूपोऽपि च बहुतररूपोऽवभात्यद्भुतात्मा तस्मै कैवल्यधाम्ने पररसपरिपूर्णाय विष्णो
    नमस्ते ॥ ॥ नो तिर्यञ्चन्न मर्त्यं न च सुरमसुरं न स्त्रियं नो पुम्मांसं न द्रव्यं कर्म जातिं गुणमपि
    सदसद्वापि ते रूपमाहुः । शिष्टं यत् स्यान्निषेधे सति निगमशतैर्लक्षणावृत्तितस्तत् कृच्छ्रेणावेद्यमानं
    परमसुखमयं भाति तस्मै नमस्ते ॥ ॥ मायायां बिम्बितस्त्वं सृजसि महदहङ्कारतन्मात्रभेदै र्भूतग्रामेन्द्रियाद्यैरपि
    सकलजगत्स्वप्नसङ्कल्पकल्पम् । भूयः संहृत्य सर्वं कमठ इव पदान्यात्मना कालशक्त्या गम्भीरे जायमाने तमसि
    वितिमिरो भासि तस्मै नमस्ते ॥ ॥ शब्दब्रह्मेति कर्मेत्यणुरिति भगवन् काल इत्यालपन्ति त्वामेकं विश्वहेतुं
    सकलमयतया सर्वथा कल्प्यमानम् । वेदान्तैर्यत्तु गीतं पुरुषपरचिदात्माभिधं तत्तु तत्त्वं प्रेक्षामात्रेण
    मूलप्रकृतिविकृतिकृत् कृष्ण तस्मै नमस्ते ॥ ॥ सत्त्वेनासत्तया वा न च खलु सदसत्त्वेन निर्वाच्यरूपा धत्ते
    यासावविद्या गुणफणिमतिवद्विश्वदृश्यावभासम् । विद्यात्वं सैव याता श्रुतिवचनलवैर्यत्कृपास्यन्दलाभे संसारारण्यसद्यस्त्रुटनपरशुतामेति
    तस्मै नमस्ते ॥ ॥ भूषासु स्वर्णवद्वा जगति घटशरावादिके मृत्तिकाव त्तत्त्वे सञ्चिन्त्यमाने स्फुरति तदधुनाप्यद्वितीयं
    वपुस्ते । स्वप्नद्रष्टुः प्रबोधे तिमिरलयविधौ जीर्णरज्जोश्च यद्व द्विद्यालाभे तथैव स्फुटमपि विकसेत्
    कृष्ण तस्मै नमस्ते ॥ ॥ यद्भीत्योदेति सूर्यो दहति च दहनो वाति वायुस्तथान्ये यद्भीताः पद्मजाद्याः पुनरुचितबलीनाहरन्तेऽनुकालम्
    । येनैवारोपिताः प्राङ्निजपदमपि ते च्यावितारश्च पश्चात् तस्मै विश्वं नियन्त्रे वयमपि भवते कृष्ण कुर्मः
    प्रणामम् ॥ ॥ त्रैलोक्यं भावयन्तं त्रिगुणमयमिदं त्र्यक्षरस्यैकवाच्यं त्रीशानामैक्यरूपं त्रिभिरपि निगमैर्गीयमानस्वरूपम्
    । तिस्रोवस्था विदन्तं त्रियुगजनिजुषं त्रिक्रमाक्रान्तविश्वं त्रैकाल्ये भेदहीनं त्रिभिरहमनिशं योगभेदैर्भजे
    त्वाम् ॥ ॥ सत्यं शुद्धं विबुद्धं जयति तव वपुर्नित्यमुक्तं निरीहं निर्द्वन्द्वं निर्विकारं निखिलगुणगणव्यञ्जनाधारभूतम्
    । निर्मूलं निर्मलं तन्निरवधिमहिमोल्लासि निर्लीनमन्त र्निस्सङ्गानां मुनीनां निरुपमपरमानन्दसान्द्रप्रकाशम्
    ॥ ॥ दुर्वारं द्वादशारं त्रिशतपरिमिलत्षष्टिपर्वाभिवीतं सम्भ्राम्यत् क्रूरवेगं क्षणमनु जगदाच्छिद्य सन्धावमानम्
    । चक्रं ते कालरूपं व्यथयतु न तु मां त्वत्पदैकावलम्बं विष्णो कारुण्यसिन्धो पवनपुरपते पाहि सर्वामयौघात्
    ॥
