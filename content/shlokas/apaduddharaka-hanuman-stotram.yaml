id: apaduddharaka-hanuman-stotram
category: stotram
name:
  english: Apaduddharaka Hanuman Stotram
content:
  english: om asya shri apaduddharaka hanumat stotra mahamantra kavacasya sarvapaduddharaka shrihanumatprasadena
    mama sarvapannivrittyarthe sarvakaryanukulya siddhyarthe jape viniyogah | dhyanam | vame kare vairibhidam
    vahantam shailam pare shrinkhalaharitankam | dadhanamacchacchaviyajnasutram bhaje jvalatkundalamanjaneyam
    || || samvitakaupina mudancitangulim samujjvalanmaunjimathopavitinam | sakundalam lambishikhasamavritam
    tamanjaneyam sharanam prapadye || || apannakhilalokartiharine shrihanumate | akasmadagatotpata nashanaya
    namo namah || || sitaviyuktashriramashokaduhkhabhayapaha | tapatritayasamharin anjaneya namo'stu te
    || || adhivyadhi mahamari grahapidapaharine | pranapahartredaityanam ramapranatmane namah || || samsarasagaravarta
    kartavyabhrantacetasam | sharanagatamartyanam sharanyaya namo'stu te || || vajradehaya kalagnirudraya'mitatejase
    | brahmastrastambhanayasmai namah shrirudramurtaye || || rameshtam karunapurnam hanumantam bhayapaham
    | shatrunashakaram bhimam sarvabhishtapradayakam || || karagrihe prayane va sangrame shatrusankate
    | jale sthale tatha''kashe vahaneshu catushpathe || || gajasimha mahavyaghra cora bhishana kanane
    | ye smaranti hanumantam tesham nasti vipat kvacit || || sarvavanaramukhyanam pranabhutatmane namah
    | sharanyaya varenyaya vayuputraya te namah || || pradoshe va prabhate va ye smarantyanjanasutam |
    arthasiddhim jayam kirtim prapnuvanti na samshayah || || japtva stotramidam mantram prativaram pathennarah
    | rajasthane sabhasthane prapte vade labhejjayam || || vibhishanakritam stotram yah pathet prayato
    narah | sarvapadbhyo vimucyeta na'tra karya vicarana || || mantrah | markatesha mahotsaha sarvashokanivaraka
    | shatrun samhara mam raksha shriyam dapaya bho hare || iti vibhishanakritam sarvapaduddharaka shrihanumat
    stotram ||
  devanagari: ॐ अस्य श्री आपदुद्धारक हनुमत् स्तोत्र महामन्त्र कवचस्य सर्वापदुद्धारक श्रीहनुमत्प्रसादेन
    मम सर्वापन्निवृत्त्यर्थे सर्वकार्यानुकूल्य सिद्ध्यर्थे जपे विनियोगः । ध्यानम् । वामे करे वैरिभिदं
    वहन्तं शैलं परे शृङ्खलहारिटङ्कम् । दधानमच्छच्छवियज्ञसूत्रं भजे ज्वलत्कुण्डलमाञ्जनेयम् ॥ ॥ संवीतकौपीन
    मुदञ्चिताङ्गुलिं समुज्ज्वलन्मौञ्जिमथोपवीतिनम् । सकुण्डलं लम्बिशिखासमावृतं तमाञ्जनेयं शरणं प्रपद्ये
    ॥ ॥ आपन्नाखिललोकार्तिहारिणे श्रीहनूमते । अकस्मादागतोत्पात नाशनाय नमो नमः ॥ ॥ सीतावियुक्तश्रीरामशोकदुःखभयापह
    । तापत्रितयसंहारिन् आञ्जनेय नमोऽस्तु ते ॥ ॥ आधिव्याधि महामारी ग्रहपीडापहारिणे । प्राणापहर्त्रेदैत्यानां
    रामप्राणात्मने नमः ॥ ॥ संसारसागरावर्त कर्तव्यभ्रान्तचेतसाम् । शरणागतमर्त्यानां शरण्याय नमोऽस्तु ते
    ॥ ॥ वज्रदेहाय कालाग्निरुद्रायाऽमिततेजसे । ब्रह्मास्त्रस्तम्भनायास्मै नमः श्रीरुद्रमूर्तये ॥ ॥ रामेष्टं
    करुणापूर्णं हनूमन्तं भयापहम् । शत्रुनाशकरं भीमं सर्वाभीष्टप्रदायकम् ॥ ॥ कारागृहे प्रयाणे वा सङ्ग्रामे
    शत्रुसङ्कटे । जले स्थले तथाऽऽकाशे वाहनेषु चतुष्पथे ॥ ॥ गजसिंह महाव्याघ्र चोर भीषण कानने । ये स्मरन्ति
    हनूमन्तं तेषां नास्ति विपत् क्वचित् ॥ ॥ सर्ववानरमुख्यानां प्राणभूतात्मने नमः । शरण्याय वरेण्याय वायुपुत्राय
    ते नमः ॥ ॥ प्रदोषे वा प्रभाते वा ये स्मरन्त्यञ्जनासुतम् । अर्थसिद्धिं जयं कीर्तिं प्राप्नुवन्ति न
    संशयः ॥ ॥ जप्त्वा स्तोत्रमिदं मन्त्रं प्रतिवारं पठेन्नरः । राजस्थाने सभास्थाने प्राप्ते वादे लभेज्जयम्
    ॥ ॥ विभीषणकृतं स्तोत्रं यः पठेत् प्रयतो नरः । सर्वापद्भ्यो विमुच्येत नाऽत्र कार्या विचारणा ॥ ॥ मन्त्रः
    । मर्कटेश महोत्साह सर्वशोकनिवारक । शत्रून् संहर मां रक्ष श्रियं दापय भो हरे ॥ इति विभीषणकृतं सर्वापदुद्धारक
    श्रीहनुमत् स्तोत्रम् ॥
