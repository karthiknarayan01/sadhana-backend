id: kuberakritamsomanathastotram
category: stotram
name:
  english: kuberakritamsomanathastotram
  devanagari: कुबेरकृतंसोमनाथस्तोत्रम्
content:
  english: kuberakritam somanathastotram kubera iti dharmatma shrutashilasamanvitah | lingam pratishthayamasa
    nyankumatyashca purvatah || 21|| kauberatpashcime bhage somanatheti vishrutam | sampujya ca yatheshanam
    nyankumatyastate shubhe | stotrenanena castaushidbhaktya tam sarvakamadam || 22|| murtih kvapi maheshvarasya
    mahati yajnasya mulodaya tumbi tungaphalavati ca shatasho brahmandakotistatha | yanmanam na pitamaho
    na ca harirbrahmandamadhyasthito janatyanyasureshu ka ca ganana sa santatam vo'vatat || 23|| namamyaham
    devamajam puranamupendramindravararajajushtam | shashankasuryagnisamananetram vrishendracihnam pralayadihetum
    || 24|| sarveshvaraikatribalaikabandhum yogadhigamyam jagato'dhivasam | tam vismayadharamanantashaktim
    jnanodbhavam dhairyagunadhikam ca || 25|| pinakapashankushashulahastam kapardinam meghasamanaghosham
    | sakalakantham sphatikavabhasam namami shambhum bhuvanaikanatham || 26|| kapalinam malinamadidevam
    jatadharam bhimabhujangaharam | prabhasitaram ca sahasramurtim sahasrashirsham purusham vishishtam
    || 27|| yadaksharam nirgunamaprameyam sajyotirekam pravadanti santah | durangamam vedyamanindyavandyam
    sarveshu hritstham paramam pavitram || 28|| tejonibham balamrigankamaulim namami rudram sphuradugravaktram
    | kalendhanam kamadamastasangam dharmasanastham prakritidvayastham || 29|| atindriyam vishvabhujam
    jitarim gunatrayatitamajam niriham | tamomayam vedamayam cidamsham prajapatisham puruhutamindram |
    anagataikadhvanirupamadyam dhyayanti yam yogavido yatindrah || 1
  devanagari: कुबेरकृतं सोमनाथस्तोत्रम् कुबेर इति धर्मात्मा श्रुतशीलसमन्वितः । लिङ्गं प्रतिष्ठयामास न्यङ्कुमत्याश्च
    पूर्वतः ॥ २१॥ कौबेरात्पश्चिमे भागे सोमनाथेति विश्रुतम् । सम्पूज्य च यथेशानं न्यङ्कुमत्यास्तटे शुभे
    । स्तोत्रेणानेन चास्तौषीद्भक्त्या तं सर्वकामदम् ॥ २२॥ मूर्तिः क्वापि महेश्वरस्य महती यज्ञस्य मूलोदया
    तुम्बी तुङ्गफलावती च शतशो ब्रह्माण्डकोटिस्तथा । यन्मानं न पितामहो न च हरिर्ब्रह्माण्डमध्यस्थितो जानात्यन्यसुरेषु
    का च गणना सा सन्ततं वोऽवतात् ॥ २३॥ नमाम्यहं देवमजं पुराणमुपेन्द्रमिन्द्रावरराजजुष्टम् । शशाङ्कसूर्याग्निसमाननेत्रं
    वृषेन्द्रचिह्नं प्रलयादिहेतुम् ॥ २४॥ सर्वेश्वरैकत्रिबलैकबन्धुं योगाधिगम्यं जगतोऽधिवासम् । तं विस्मयाधारमनन्तशक्तिं
    ज्ञानोद्भवं धैर्यगुणाधिकं च ॥ २५॥ पिनाकपाशाङ्कुशशूलहस्तं कपर्दिनं मेघसमानघोषम् । सकालकण्ठं स्फटिकावभासं
    नमामि शम्भुं भुवनैकनाथम् ॥ २६॥ कपालिनं मालिनमादिदेवं जटाधरं भीमभुजङ्गहारम् । प्रभासितारं च सहस्रमूर्तिं
    सहस्रशीर्षं पुरुषं विशिष्टम् ॥ २७॥ यदक्षरं निर्गुणमप्रमेयं सज्योतिरेकं प्रवदन्ति सन्तः । दूरङ्गमं
    वेद्यमनिन्द्यवन्द्यं सर्वेषु हृत्स्थं परमं पवित्रम् ॥ २८॥ तेजोनिभं बालमृगाङ्कमौलिं नमामि रुद्रं स्फुरदुग्रवक्त्रम्
    । कालेन्धनं कामदमस्तसङ्गं धर्मासनस्थं प्रकृतिद्वयस्थम् ॥ २९॥ अतीन्द्रियं विश्वभुजं जितारिं गुणत्रयातीतमजं
    निरीहम् । तमोमयं वेदमयं चिदंशं प्रजापतीशं पुरुहूतमिन्द्रम् । अनागतैकध्वनिरूपमाद्यं ध्यायन्ति यं योगविदो
    यतीन्द्राः ॥ १
