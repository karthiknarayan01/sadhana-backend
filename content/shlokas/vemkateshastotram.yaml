id: vemkateshastotram
category: stotram
name:
  english: vemkateshastotram
  devanagari: वेंकटेशस्तोत्रम्
content:
  english: kundalirajagiristhah khanditasakalantaraya esha harih | kalyanam kalayatu nah kalashakuparakanyakanilayah
    || 136|| vrishagirishikharavihari vrishamukhavibudhabhivandyapadapadmah | vrishamasmasu vidhattam
    vikshavalitairvishishtakarunyaih || 137|| pushnasi bhogamakhilam klishnati na kincidashrita iha tvam
    | tamimam mukunda vande devam tvam vrishagirishanam || 138|| anjanacalavibhushanam bhaje kanjalocanamasheshadaivatam
    | adarena nigamantadeshiko yo babhuva jagaduddidhirshaya || 139|| shrinidhanamanapayi vatsalam tannidhanamadhisheshabhudharam
    | savadhanamanubhoktumadaratsamvidhanaparamastu me manah || 140|| ashraye shritajanavane sthitam dhama
    divyamanagham dayanidhim | venkatacalavihari varidashyamasundaramaghapanuttaye || 141|| kamaye kamalakomalam
    tava kshantisagara padam parayanam | kama esha mama kapathe bata prasthitim na punaretu kincana ||
    142|| khedavarshakarakabhirahate modaheturiha no managapi | kapathe punaridam pravartate kashtamishvara
    mano runatsi no || 143|| ishtametaditi venkateshvara svalpamapyamala naiva cintaye | paratantryaparikarmitasya
    me tanna yujyata iti sthitah punah || 144|| anjanesha bhuvi ranjayanshritan bhanjanam na kurushe mamainasah
    | kanjalocana kripanidhe katham kalmashakshapananamakirtana || 145|| papamacyuta kritam punahpunardhiharam
    khalu maya'nubhuyate | punyamasti yadi me yadricchaya padmavasarasikesha pahi mam || 146|| dushkritasya
    karane dridham manah duyate punaratho managiva | pratyaham yadidamidrisham hare kidrishi gatiraho
    bhavishyati || 147|| nasti me gatirananyavatsala shrinidhe sakalalokarakshaka | dehi divyajaladopamadyute
    tapashantimabhayankaro bhava || 148|| yavadacyuta pavitramanasaprajnasadarasubhashitaspadam | jivitam
    sakalalokamanitam tavadastu na tu cet mritim kuru || 149|| deshikairanaghadivyamanasairadrite pathi
    bhavanmanohare | shrinivasa kripaya managgatam parshvagartapatanacca pahi mam || 150|| ambujasanamukhaissuraisstutam
    tumburuprabhritigitamapyaham | shambararivivashocyutam shraye tvam balena tava raksha madhava || 151||
    kamaleshahatacetano na yo mananiyavibhavassa samsritau | sarvasheshishubhadivyadampatipritimatramapi
    kinna kamyate || 152|| sarvakamaparipurnasevaya ghorakamavashata vinashyati | adbhutam tamimamancanacaladyotamashraya
    manah param gatim || 153|| indriyani na vashe managapi shrinivasa tamasa vritto'smyaham | jatu hanta
    bhavata bhavatpriyaishcekshitam sapadi mamupekshase || 154|| raksha samprati ramanivasa mam ragasambhritaparagapamsulam
    | kalamegha karunarasaishshubhaishshodhayan vihitashuddhajivanah || 155|| vedaparvatashirassthitam
    padam veda yattava ramanidhe janah | vedanabhiranupaplutassukham veda so'tra ca paratra cakhilam ||
    156|| itthamashritajanavanapriyam devadevamanagham dayanidhim | shrinivasamiha viraraghavo dushkritodyamahatipsaya''shritah
    || 157|| upanishadbhirudiritamadaradudayatamupabrimhanavarnitam | suramaharshimukhastutamadbhutam
    manasi simhamahidharanam mahah || 158|| kimiha nah kathaya bhavitanyaya tvanayakalpitaya kathayanaya
    | avahitam bhava venkatabhudhare tava hitam nihitam mahitam manah || 159|| pranatalokaparayanamanasam
    pranamata pranayena parayanam | nikhilavedagaveshitamadbhutam vrishamahidharadiptamidam mahah || 160||
    nikhilatapanibarhanacuncuna niyamitasvakayugmavibhutina | shritaramah karunasahacarina dishati vikshitakena
    sa nassukham || 161|| sakalahamsasamashrayaniyatam sakalahamsamidam maninupuraih | sapadi nah pratipadayativa
    te kamalakanti padam kamalapate || 162|| hitakrite kripayeha mahitale mahitamanjanashailamadhishritam
    | anaghamadbhutamangalavigraham kamapi yami gatim kamalanidhim || 163|| ashcaryabhutanirapayadayamayibhi
  devanagari: कुण्डलिराजगिरिस्थः खण्डितसकलान्तराय एष हरिः । कल्याणं कलयतु नः कलशाकूपारकन्यकानिलयः ॥ १३६॥
    वृषगिरिशिखरविहारी वृषमुखविबुधाभिवन्द्यपदपद्मः । वृषमस्मासु विधत्तां वीक्षावलितैर्विशिष्टकारुण्यैः
    ॥ १३७॥ पुष्णासि भोगमखिलं क्लिश्नाति न किञ्चिदाश्रित इह त्वाम् । तमिमं मुकुन्द वन्दे देवं त्वां वृषगिरीशानम्
    ॥ १३८॥ अञ्जनाचलविभूषणं भजे कञ्जलोचनमशेषदैवतम् । आदरेण निगमान्तदेशिको यो बभूव जगदुद्दिधीर्षया ॥ १३९॥
    श्रीनिधानमनपायि वत्सलं तन्निधानमधिशेषभूधरम् । सावधानमनुभोक्तुमादरात्संविधानपरमस्तु मे मनः ॥ १४०॥ आश्रये
    श्रितजनावने स्थितं धाम दिव्यमनघं दयानिधिम् । वेङ्कटाचलविहारि वारिदश्यामसुन्दरमघापनुत्तये ॥ १४१॥ कामये
    कमलकोमलं तव क्षान्तिसागर पदं परायणम् । काम एष मम कापथे बत प्रस्थितिं न पुनरेतु किञ्चन ॥ १४२॥ खेदवर्षकरकाभिराहते
    मोदहेतुरिह नो मनागपि । कापथे पुनरिदं प्रवर्तते कष्टमीश्वर मनो रुणत्सि नो ॥ १४३॥ इष्टमेतदिति वेङ्कटेश्वर
    स्वल्पमप्यमल नैव चिन्तये । पारतन्त्र्यपरिकर्मितस्य मे तन्न युज्यत इति स्थितः पुनः ॥ १४४॥ अञ्जनेश भुवि
    रञ्जयन्श्रितान् भञ्जनं न कुरुषे ममैनसः । कञ्जलोचन कृपानिधे कथं कल्मषक्षपणनामकीर्तन ॥ १४५॥ पापमच्युत
    कृतं पुनःपुनर्धीहरं खलु मयाऽनुभूयते । पुण्यमस्ति यदि मे यदृच्छया पद्मवासरसिकेश पाहि माम् ॥ १४६॥ दुष्कृतस्य
    करणे दृढं मनः दूयते पुनरथो मनागिव । प्रत्यहं यदिदमीदृशं हरे कीदृशी गतिरहो भविष्यति ॥ १४७॥ नास्ति मे
    गतिरनन्यवत्सल श्रीनिधे सकललोकरक्षक । देहि दिव्यजलदोपमद्युते तापशान्तिमभयङ्करो भव ॥ १४८॥ यावदच्युत
    पवित्रमानसप्राज्ञसादरसुभाषितास्पदम् । जीवितं सकललोकमानितं तावदस्तु न तु चेत् मृतिं कुरु ॥ १४९॥ देशिकैरनघदिव्यमानसैरादृते
    पथि भवन्मनोहरे । श्रीनिवास कृपया मनाग्गतं पार्श्वगर्तपतनाच्च पाहि माम् ॥ १५०॥ अम्बुजासनमुखैस्सुरैस्स्तुतं
    तुम्बुरुप्रभृतिगीतमप्यहम् । शम्बरारिविवशोच्युतं श्रये त्वं बलेन तव रक्ष माधव ॥ १५१॥ कामलेशहतचेतनो
    न यो माननीयविभवस्स संसृतौ । सर्वशेषिशुभदिव्यदम्पतिप्रीतिमात्रमपि किन्न काम्यते ॥ १५२॥ सर्वकामपरिपूर्णसेवया
    घोरकामवशता विनश्यति । अद्भुतं तमिममञ्चनाचलद्योतमाश्रय मनः परां गतिम् ॥ १५३॥ इन्द्रियाणि न वशे मनागपि
    श्रीनिवास तमसा वृत्तोऽस्म्यहम् । जातु हन्त भवता भवत्प्रियैश्चेक्षितं सपदि मामुपेक्षसे ॥ १५४॥ रक्ष
    सम्प्रति रमानिवास मां रागसम्भृतपरागपांसुलम् । कालमेघ करुणारसैश्शुभैश्शोधयन् विहितशुद्धजीवनः ॥ १५५॥
    वेदपर्वतशिरस्स्थितं पदं वेद यत्तव रमानिधे जनः । वेदनाभिरनुपप्लुतस्सुखं वेद सोऽत्र च परत्र चाखिलम्
    ॥ १५६॥ इत्थमाश्रितजनावनप्रियं देवदेवमनघं दयानिधिम् । श्रीनिवासमिह वीरराघवो दुष्कृतोद्यमहतीप्सयाऽऽश्रितः
    ॥ १५७॥ उपनिषद्भिरुदीरितमादरादुदयतामुपबृंहणवर्णितम् । सुरमहर्षिमुखस्तुतमद्भुतं मनसि सिंहमहीधरणं महः
    ॥ १५८॥ किमिह नः कथया भवितान्यया त्वनयकल्पितया कथयानया । अवहितं भव वेङ्कटभूधरे तव हितं निहितं महितं
    मनः ॥ १५९॥ प्रणतलोकपरायणमानसं प्रणमत प्रणयेन परायणम् । निखिलवेदगवेषितमद्भुतं वृषमहीधरदीप्तमिदं महः
    ॥ १६०॥ निखिलतापनिबर्हणचुञ्चुना नियमितस्वकयुग्मविभूतिना । श्रितरमः करुणासहचारिणा दिशति वीक्षितकेन स
    नस्सुखम् ॥ १६१॥ सकलहंससमाश्रयणीयतां सकलहंसमिदं मणिनूपुरैः । सपदि नः प्रतिपादयतीव ते कमलकान्ति पदं
    कमलापते ॥ १६२॥ हितकृते कृपयेह महीतले महितमञ्जनशैलमधिश्रितम् । अनघमद्भुतमङ्गलविग्रहं कमपि यामि गतिं
    कमलानिधिम् ॥ १६३॥ आश्चर्यभूतनिरपायदयामयीभि
