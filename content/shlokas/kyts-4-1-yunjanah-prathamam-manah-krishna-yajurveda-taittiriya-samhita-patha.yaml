id: kyts-4-1-yunjanah-prathamam-manah-krishna-yajurveda-taittiriya-samhita-patha
category: stotram
name:
  english: KYTS 4.1 Yunjanah Prathamam Manah - Krishna Yajurveda Taittiriya Samhita Patha
content:
  english: krishna yajurvediya taittiriya samhitaya ncaturthakande prathamah prashnah agnicityanga mantrapathabhidhanam
    o shri gurubhyo namah | harih om || yunjanah prathama mmanastatvaya savita dhiyah | agni njyotirnicayya
    prithivya addhya 'bharat || yuktvaya manasa devan thsuvaryato dhiya diva m | brihajjyotih karishyata
    ssavita prasuvati tan || yuktena manasa vaya ssave | suvargeyaya shaktyai || yunjate mana uta yunjate
    dhiyo vipra viprasya brihato vipashcitah | vi hotra dadhe vayuna videka i nmahi devasya savituh parishtutih
    || yuje va nnamobhirvi shloka yanti pathyeva surah | shrinvanti vishve amritasya putra a ye dhamani
    divyani tasthuh || yasya prayanamanvanya idyayurdeva devasya mahimanamarcatah | yah parthivani vimame
    sa etasho rajagmsi deva ssavita mahitvana || deva savitah prasuva yajna mbhagaya divyo gandharvah
    | ketapuh ketannah punatu vacaspatirvacamadya svadati nah || ima nno deva savitaryajna mprasuva devayuvagm
    sakhividagm satrajita ndhanajitagm suvarjita m || rica stomagm samardhaya gayatrena rathantaram |
    briha dgayatravartani || devasya tva savituh prasave ngayatrena chandasa ''dade 'ngirasvadabhrirasi
    nari mpurishyamangirasvada bhara traishtubhena tva chandasa ''dade dbabhrirasi narirasi tvaya vayagm
    sadhastha agnigm shakema khanitu njagatena tva chandasa ''dade 'ngirasvaddhasta adhaya savita bibhradabhrigm
    hiranyayi m | taya jyotirajasra nkhatvi na a bharanushtubhena tva chandasa ''dade ranushtubhena tva
    chandasa nrashanamritasya purva ayushi vidatheshu kavya | taya deva thsaramarapanti || pratu va~jinna
    drava varishthamanu sam m | divi te janma paramamantarikshe nabhih prithivyamadhi yonih || yunjathagm
    rasabham yame vrishanvasu | agni mbharantamasmayum || yogeyoge tavastaram va~jevaje havamahe | sakhaya
    indramataye ehyavakramannashasti nnehyavakramannashasti rudrasya ganapatya nmayobhurehi | urvantarikshamanvihi
    svasti gavyutirabhayani krinvann || pushna sayuja saha | prithivya dbharamah || anvagnirushasa danvahani
    prathamo jatavedah | anu suryasya purutra ca rashminanu dyavaprithivi a tatana || agatya vajyaddhvana
    ssarva mridho vidhunute | agnigm sadhasthe mahati cakshusha ni cikishate || akramya vaji nprithivimagnimiccha
    ruca tvam | bhumya vritvaya no bruhi yatah khanama tam va~yam || dyauste prishtha mprithivi sadhasthamatma
    'ntarikshagm samudraste yonih | vikhyaya cakshusha tvamabhi tishtha pritanyatah || utkrama mahate
    saubhagaya ddravinoda vajinn | vayagg syama sumatau prithivya agni nkhanishyanta upasthe asyah ||
    udakrami ddravinoda vajyarva mprithivyah | tatah khanema supratikamagnigm suvo ruhana adhi naka uttame
    || apo devirupa srija madhumatirayakshmaya prajabhyah | tasag sthanadujjihata ssupippalah || jigha
    mmanasa ghritena pratikshyanta ntirashca vayasa brihantam vya~cishthamannagm rabhasam vi~danam ||
    a tva jigharmi vacasa ghritena 'rakshasa manasa tajjushasva | maryashri 'bhimrishe tanuva jar hrishanah
    || pari vajapatih kaviragnir havyanyakramit | dadha vi~pragm sahasya dhimahi | dhrisha ndivedive bhettara
    mbhanguravatah || tvamagne dyubhistva mashmanaspari | tvam bhya stvamoshadhibhya stva nnripate jayase
    shucih || devasya tva savituh prasave tkhanami || jyotishmanta 'gne supratikamajasrena bhanuna didyanam
    | shiva mprishthamasi sapratha urvagni mbharishyadaparavapishtham | vardhamana ndivo matraya varina
    prathasva || sharma ca stho varma ca stho acchidre bahule ubhe | vyacasvati sam va~sathagm suvarvida
    samici urasa tmana | agnimanta rbharishyanti jyotishmanta majasramit || purishyo 'si vishvabharah
    | atharva tva prathamo niramanthadagne || tvamagne pushkaradaddhyatharva niramanthata | murdhno vishvasya
    vaghatah || tamu tva daddhyannrishih putra idhe atharvanah | vritrahana mpurandaram || tamu tva pathyo
    vrisha samidhe dasyuhantamam | dhananjayagm ranerane || sida hota ssva u loke cikitvan thsadaya yajnagm
    sukritasya yonau havisha yajasyagne briha dyajamane vayo dhah || ni hota hotrishadane vidanastvesho
    didivagm asada thsudakshah | adabdhavrata pramatirvasishtha shshucijihvo agnih || sagm sidasva mahagm
    asi shocasva devavitamah | vi dhumamagne arusha mmiyeddhya srija prashasta dar shatam || janishva
    hi jenyo agre ahnagm hito hiteshvarusho vaneshu | damedame sapta ratna dadhano hota ni shasada yajiyan
    || nte vayurmatarishva dadhatuttanayai hridayam ya~dvilishtam | devanam ya~shcarati pranathena tasmai
    ca devi vashadastu tubhya m || sujato jyotisha saha sharma varuthama ssuvah | vaso agne vishvarupagm
    sam vya~yasva vibhavaso || udu tishtha svaddhvarava no devya kripa | drishe ca bhasa brihata sushukvanira
    'gne yahi sushastibhih || || urdhva u shu na utaye tishtha devo na savita | urdhvo vajasya sanita
    yadanjibhi rvihvayamahe || sa jato garbho asi rodasyoragne carurvibhrita oshadhishu | citra shshishuh
    pari tamagsyaktah pra matribhyo adhi kanikradadgah || sthiro bhava vidvanga ashurbhava vajyarvann
    | prithurbhava sushadastvamagneh purishavahanah || shivo bhava prajabhyo manushibhyastvamangirah |
    ma dyavaprithivi abhi shushuco ma mma vanaspatin || praitu vaji kanikrada mma padyayushah pura ||
    rasabho va thsuyukto vrishana rathe mpurishyamashurduto vahaditah || vrisha ngarbhagm samudriya vitaya
    ritagm satyam || oshadhayah prati grihnita 'gnimetagm shivamayantamabhyatra yushman | vyasyan vishva
    amatirarati rnishidanno apa durmatigm hanat || oshadhayah prati modaddhvamena ssupippalah | ayam vo~
    garbha ritviyah pratnagm sadhasthama 'sadat || vi pajasa prithuna shoshucano badhasva dvisho rakshaso
    amivah | susharmano brihata shsharmani syamagnerahagm suhavasya pranitau || apo hi shtha mayobhuvasta
    na urje dadhatana | mahe ranaya cakshase || yo vah shivatamo rasastasya bhajayateha nah | ushatiriva
    matarah || tasma ara ngamama vo yasya kshayaya jinvatha | apo janayatha ca nah || mitra ssagmsrijya
    prithivi nca jyotisha saha | sujata vi~bhum || ayakshmaya tva sagm srijami prajabhyah | vishve 'ngirasvat
    || rudra ssabhrintya prithivi mbhanurajasra icchukro deveshu rocate || sagm srishtam va~subhi rudrairdhiraih
    nkritva sinivali karotu tam || sinivali sukaparda sukurira svaupasha | sa tubhyamadite maha okha ndadhatu
    hastayoh || ukha nkarotu shaktya bahubhya maditirdhiya | mata putram mbibhartu garbha a || makhasya
    shiro 'si yajnasya pade sthah | vasavastva krinvantu gayatrena chandasa 'ngirasva tprithivyasi rudrastva
    krinvantu traishtubhena chandasa 'ngirasvadantarikshama 'ngirasvadantarikshamasi syadityastva krinvantu
    jagatena chandasa shvanarah krinvantvanushtubhena chandasa 'si dharaya mayi prajagm rayasposha ngaupatyagm
    suviryagm sajatan 'sya ditiste bila ngrihnatu panktena chandasa 'ngirasvat || kritvaya sa mahimukha
    vasavastva dhupayantu gayatrena chandasa drudrastva dhupayantu traishtubhena chandasa dadityastva
    dhupayantu jagatena chandasa shvanara dhupayantvanushtubhena chandasa dindrastva dhupayatvangirasva
    dvishnustva dhupayatvangirasva dvarunastva dhupayatvangirasva daditistva devi vishvade stva devirvishvade
    dabhindhatamukhe gnastva devirvishvade trayo janayastva devirvishvade tpacantukhe | mitraitamukha
    mpacaisha ma bhedi | eta nte pari dadamyabhittyai || abhima mmitro babhuva saprathah | uta shravasa
    prithivim || mitrasya car shshravo devasya sanasim | dyumna ncitrashravastamam || devastva savitodvapatu
    supani ssvangurih | subahuruta shaktya || apadyamana prithivyasha disha a prina | uttishtha brihati
    bhavordhva tishtha dhruva tvam || vasavastva ''cchrindantu gayatrena chandasa '' cchrindantu traishtubhena
    chandasa dadityastva ''cchrindantu jagatena chandasa shvanara a cchrindantvanushtubhena chandasa kanna
    vigmshatishca 'gna ritavo vardhayantu sam va~thsara rishayo yani satya | sa ndivyena didihi rocanena
    vishva a bhahi pradishah prithivyah || sa 'gne pra ca bodhayainamucca tishtha mahate saubhagaya |
    ma ca rishadupasatta te agne brahmanaste yashasah santu ma 'nye || tvamagne vrinate brahmana ime shivo
    agne va~rane bhava nah | sapatnaha no abhimatijicca sve gaye jagrihya prayucchann || ihaivagne adhi
    dharaya rayi npurvacito nikarinah | kshatramagne suyamamastu tubhyamupasatta vardhata nte anishtritah
    || kshatrena ssagm rabhasva mitrena 'gne mitradheye yatasva | sajatana mmaddhyamastha edhi rajnamagne
    vihavyo didihiha || ati niho ati sridho 'tyacitti matyaratimagne | vishva hyagne durita sahasvathasmabhyagm
    sahaviragm rayindah || anadhrishyo jatavada anishtrito viradagne kshatrabhri ddidihiha | vishva ashah
    shshivabhiradya pari pahi no vridhe || brihaspate savitarbodhayainagm sagmshita ntaragm sagm shishadhi
    | vardhayaina vishva enamanu madantu devah | vishva enamanu madantu devah || amutrabhuyadadha yadyamasya
    brihaspate abhishastera muncah | pratyauhata mashvina mrityumasma magne bhishaja shacibhih || udvaya
    ntamasaspari pashyanto jyotiruttaram | deva ndevatra suryamaganma jyotiruttamam || urdhva asya samidho
    bhavantyurdhva shukra shocig shyagneh | dyumattama supratikasya sunoh || tanunapadasuro vishvaveda
    devo deveshu devah | patha a 'nakti maddhva ghritena || maddhva yajna nnakshase prinano narashagmso
    agne | sukriddeva ssavita vishvavarah || acchayameti shavasa ghritenedano vahnirnamasa | agnigg sruco
    addhvareshu prayathsu || sa yakshadasya mahimanamagne i mandrasu prayasah | i mandrasu prayasah |
    vasushcetishtho vasudhatamashca || dvaro deviranvasya vishve vrata dadante agneh | uruvyacaso dhamna
    patyamanah || te asya yoshane divye na yonavushasanakta ya~jnamavata maddhvara nnah || daivya hotaravurdhva
    'gnerjihvamabhi grinitam | krinuta ssvishtim || tisro devirbarhiredagm sadantvida sarasvati bharati
    | mahi grinana || tannasturipamadbhuta mpurukshu tvashta suvira vi~ shyatu nabhimasme || vanaspate
    'va srija raranastmana deveshu | agnir havyagm shamita sudayati || agne svaha krinuhi jataveda indraya
    havyam | vishve deva havirida njushantam || hiranyagarbha ssamavartatagre bhutasya jatah patireka
    asit | sa dadhara prithivi nkasmai devaya havisha vidhema || yah pranato nimishato mahitvaika idraja
    jagato babhuva | ya ishe asya dvipadashcatushpadah kasmai devaya havisha vidhema || ya a tmada balada
    yasya vishva upasate prashisham ya~sya devah | yasya chaya ya~sya mrityuh kasmai devaya havisha vidhema
    || yasyeme himavanto mahitva yasya samudragm rasaya saha ''huh | yasyemah pradisho yasya bahu kasmai
    devaya havisha vidhema || ya nkrandasi avasa tastabhane abhyaiksheta mmanasa rejamane | yatradhi sura
    uditau vyeti kasmai devaya havisha vidhema || yena dyaurugra prithivi ca dridhe yena suvah stabhitam
    ye~na nakah | yo antarikshe rajaso vimana hkasmai devaya havisha vidhema || apo ha yanmahati rvishva
    ndadhana janayantiragnim | tato devana nniravartatasurekah kasmai devaya havisha vidhema || yashcidapo
    mahina paryapashya ndadhana janayantiragnim | yo deveshvadhi deva eka asi tkasmai devaya havisha vidhema
    || mprayujagg svaha mano medhamagni mprayujagg svaha cittam mprayujagg svaha vaco vidhritimagni mprayujagg
    svaha prajapataye manave svaha 'gnaye vaishvanaraya svaha vishve devasya neturmarto vrinita sakhyam
    vi~shve raya ishuddhyasi dyumnam vri~nita pushyase svaha ma su bhittha ma su risho drigmhasva vidayasva
    su | amba dhrishnu virayasva nkarishyathah || drigmhasva devi prithivi svastaya asuri maya svadhaya
    krita ndevanamidamastu havyamarishta tvamudihi yajne asminn || mitraitamukha ntapaisha ma bhedi |
    eta nte pari dadamyabhittyai || druvanna ssarpirasutih pratno hota vare nyah | sahasasputro adbhutah
    || parasya adhi sam tara | yatrahamasmi tagm ava || paramasyah paravato rohidashva iha 'gahi | purishyah
    purupriyo ntara mridhah || sida tva mmaturasya upasthe vishva nyagne vayunani vidvan | mainamarcisha
    ma tapasa 'ntarasyagm shukra jyotirvi bhahi || antaragne ruca tvamukhayai sadane sve | tasyastvagm
    harasa tapan jataveda shshivo bhava || shivo bhutva mahyamagne 'tho sida shivastvam | shivah kritva
    disha yadagne yani kani ca ''te daruni daddhmasi | tadastu tubhyami ntajjushasva yavishthya || yadattyupajihvika
    yadvamro atisarpati | sarva ntajjushasva yavishthya || ratrigm ratrimaprayava 'shvayeva tishthate
    ghasamasmai | rayasposhena samisha madanto 'gne ma te prativesha rishama || nabha magnigm rayasposhaya
    brihate havamahe | irammada mpritanasu sasahim || ya ssena abhitvarira rugana uta | ye stena ye ca
    taskarastag mmalimlun jambhyai staskaragm uta | hanu nkhada sukhaditan || ye janeshu malimlava ste
    dadhami jambhayoh || yo asmabhyamaratiya dyashca no dveshate janah | nindadyo asma mmasmasa kuru ||
    sagmshita mme brahma sagmshitam 'hamasmi purohitah || udesha mbahu atiramudvarca udu bala m | kshinomi
    brahmana svagm aham || drishano rukma urvya vyadyauddurmar shamayuh shriye rucanah | agniramrito abhavadvayo
    || vishva rupani prati muncate kavih pra ndvipade catushpade | vi nakamakhya 'nu prayanamushaso vi
    rajati || naktoshasa samanasa virupe dhapayete shishumekagm samici | dyava kshama rukmo antarvi bhati
    deva agni ndravinodah || suparno ntrivritte shiro gayatra sstoma atma sama te tanurvamadevya drathantare
    pakshau yajnayajniya nchandagsyangani dhishniya shshapha yajugmshi nama || suparno vi~shvatah paribhurasi
    | sa iddeveshu gacchati || soma yaste mayobhuva utaya 'vita bhava || agnirmurdha bhuvah || tvannah
    soma mbhargo devasya dhimahi | dhiyo yo nah pracodaya t || acitti yaccakrima daivye jane dinairdakshaih
    prabhuti purushatvata deveshu ca savitarmanusheshu ca tvanno atra suvatadanagasah || codayitri sunritana
    ncetanti sumatinam | yajna ndadhe sarasvati || paviravi kanya citrayu ssarasvati virapatni dhiya ndhat
    | gnabhiracchidragm sharanagm sajosha duradhar ngrinate sharma yagmsat || pusha ga anvetu nah pusha
    rakshatvarvatah | pusha vajagm sanotu nah || shukra vishurupe ahani dyaurivasi | dvishurupe ahani
    dyaurivasi | vishva hi maya avasi svadhavo bhadra te pushanniha ratirastu || te 'vardhanta svatavaso
    mahitvana ''naka ntasthururu cakrire sadah | vishnu ryaddha va~yo na sidannadhi barhishi priye ||
    pracitramarka ngrinate turaya marutaya svatavase bharaddhvam | ye sahagmsi sahasa sahante rejate agne
    prithivi makhebhyah | rejate agne prithivi makhebhyah || vishve deva vishve devah || dyava nah prithivi
    imagm siddhramadya divisprisha ndeveshu yacchatam || pra pu rvaje pitara navyasibhirgirbhih krinuddhvagm
    sadane ritasya | a no dyavaprithivi daivyena janena yata va~rutham || agnigg stomena bodhaya samidhano
    amartyam | havya deveshu no dadhat || sa havyavadamartya ushigdutashcanohitah | agnirdhiya samrinvati
    || shanno bhavantu || harih om || || krishna yajurvediya taittiriya samhitaya ncaturtha kande prathamah
    prashna
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय संहिताया ञ्चतुर्थकाण्डे प्रथमः प्रश्नः अग्निचित्यङ्ग मन्त्रपाठाभिधानं
    ओ श्री गुरुभ्यो नमः । ह॒रिः॒ ओम् ॥ यु॒ञ्जा॒नः प्र॑थ॒म म्मन॑स्त॒त्वाय॑ सवि॒ता धियः॑ । अ॒ग्नि ञ्ज्योति॑र्नि॒चाय्य॑
    पृथि॒व्या अद्ध्या ऽभ॑रत् ॥ यु॒क्त्वाय॒ मन॑सा दे॒वान् थ्सुव॑र्य॒तो धि॒या दिव म् । बृ॒हज्ज्योतिः॑ करिष्य॒त
    स्स॑वि॒ता प्रसु॑वाति॒ तान् ॥ यु॒क्तेन॒ मन॑सा व॒य स्स॒वे । सु॒व॒र्गेया॑य॒ शक्त्यै ॥ यु॒ञ्जते॒ मन॑ उ॒त
    यु॑ञ्जते॒ धियो॒ विप्रा॒ विप्र॑स्य बृह॒तो वि॑प॒श्चितः॑ । वि होत्रा॑ दधे वयुना॒ विदेक॒ इ न्म॒ही दे॒वस्य॑
    सवि॒तुः परि॑ष्टुतिः ॥ यु॒जे वा॒ न्नमो॑भि॒र्वि श्लोका॑ यन्ति प॒थ्ये॑व॒ सूराः । शृ॒ण्वन्ति॒ विश्वे॑
    अ॒मृत॑स्य पु॒त्रा आ ये धामा॑नि दि॒व्यानि॑ त॒स्थुः ॥ यस्य॑ प्र॒याण॒मन्व॒न्य इद्य॒युर्दे॒वा दे॒वस्य॑
    महि॒मान॒मर्च॑तः । यः पार्थि॑वानि विम॒मे स एत॑शो॒ रजाग्ं॑सि दे॒व स्स॑वि॒ता म॑हित्व॒ना ॥ देव॑ सवितः॒
    प्रसु॑व य॒ज्ञ म्भगा॑य दि॒व्यो ग॑न्ध॒र्वः । के॒त॒पूः केत॑न्नः पुनातु वा॒चस्पति॒र्वाच॑म॒द्य स्व॑दाति
    नः ॥ इ॒म न्नो॑ देव सवितर्य॒ज्ञ म्प्रसु॑व देवा॒युवग्ं॑ सखि॒विदग्ं॑ सत्रा॒जित॑ न्धन॒जितग्ं॑ सुव॒र्जित
    म् ॥ ऋ॒चा स्तोम॒ग्ं॒ सम॑र्धय गाय॒त्रेण॑ रथन्त॒रम् । बृ॒ह द्गा॑य॒त्रव॑र्तनि ॥ दे॒वस्य॑ त्वा सवि॒तुः
    प्र॑स॒वे ङ्गाय॒त्रेण॒ छन्द॒सा ऽऽद॑दे ऽङ्गिर॒स्वदभ्रि॑रसि॒ नारि॑ म्पु॑री॒ष्य॑मङ्गिर॒स्वदा भ॑र॒ त्रैष्टु॑भेन
    त्वा॒ छन्द॒सा ऽऽद॑दे द्बभ्रि॑रसि॒ नारि॑रसि॒ त्वया॑ व॒यग्ं स॒धस्थ॒ आग्निग्ं श॑केम॒ खनि॑तु ञ्जाग॑तेन
    त्वा॒ छन्द॒सा ऽऽद॑दे ऽङ्गिर॒स्वद्धस्त॑ आ॒धाय॑ सवि॒ता बिभ्र॒दभ्रिग्ं॑ हिर॒ण्ययी म् । तया॒ ज्योति॒रज॑स्र॒
    ङ्खा॒त्वी न॒ आ भ॒रानु॑ष्टुभेन त्वा॒ छन्द॒सा ऽऽद॑दे रानु॑ष्टुभेन त्वा॒ छन्द॑सा॒ न्रश॒नामृ॒तस्य॒ पूर्व॒
