id: rahu108namastotra
category: stotram
name:
  english: rahu108namastotra
  devanagari: राहु१०८नामस्तोत्र
content:
  english: rinu namani rahoshca saimhikeyo vidhuntudah | surashatrustamashcaiva phani gargyayanastatha
    || 1|| phanirgargyayanastatha suragurnilajimutasankashashca caturbhujah | surarirnila khadgakhetakadhari
    ca varadayakahastakah || 2|| shulayudho meghavarnah krishnadhvajapatakavan | varno patakavan dakshinashamukharatah
    tikshnadamshtradharaya ca || 3|| damshtrakaralakah shurpakarasanasthashca gomedabharanapriyah | mashapriyah
    kashyaparshinandano bhujageshvarah || 4|| kashyapa ulkapatayitashuli nidhipah krishnasarparat | ulkapatajanih
    shuli vishajvalavritasyo'rdhashariro jadyasampradah || 5|| shatravapradah ravindubhikarashchayasvarupi
    kathinangakah | dvishaccakracchedako'tha karalasyo bhayankarah || 6|| krurakarma tamorupah shyamatma
    nilalohitah | kiriti nilavasanah shanisamantavartmagah || 7|| candalavarno'thashvyarkshabhavo meshabhavastatha
    | shanivatphaladah shuro'pasavyagatireva ca || 8|| uparagakarassuryahimamshucchaviharakah |
  devanagari: ृणु नामानि राहोश्च सैंहिकेयो विधुन्तुदः । सुरशत्रुस्तमश्चैव फणी गार्ग्यायणस्तथा ॥ १॥ फणिर्गार्ग्यायनस्तथा
    सुरागुर्नीलजीमूतसङ्काशश्च चतुर्भुजः । सुरारिर्नील खड्गखेटकधारी च वरदायकहस्तकः ॥ २॥ शूलायुधो मेघवर्णः
    कृष्णध्वजपताकावान् । वर्णो पताकवान् दक्षिणाशामुखरतः तीक्ष्णदंष्ट्रधराय च ॥ ३॥ दंष्ट्राकरालकः शूर्पाकारासनस्थश्च
    गोमेदाभरणप्रियः । माषप्रियः कश्यपर्षिनन्दनो भुजगेश्वरः ॥ ४॥ काश्यप उल्कापातयिताशुली निधिपः कृष्णसर्पराट्
    । उल्कापातजनिः शूली विषज्वलावृतास्योऽर्धशरीरो जाद्यसम्प्रदः ॥ ५॥ शात्रवप्रदः रवीन्दुभीकरश्छायास्वरूपी
    कठिनाङ्गकः । द्विषच्चक्रच्छेदकोऽथ करालास्यो भयङ्करः ॥ ६॥ क्रूरकर्मा तमोरूपः श्यामात्मा नीललोहितः ।
    किरीटी नीलवसनः शनिसामन्तवर्त्मगः ॥ ७॥ चाण्डालवर्णोऽथाश्व्यर्क्षभवो मेषभवस्तथा । शनिवत्फलदः शूरोऽपसव्यगतिरेव
    च ॥ ८॥ उपरागकरस्सूर्यहिमांषुच्छविहारकः ।
