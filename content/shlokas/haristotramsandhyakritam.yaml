id: haristotramsandhyakritam
category: stotram
name:
  english: haristotramsandhyakritam
  devanagari: हरिस्तोत्रम्सन्ध्याकृतं
content:
  english: param yatam yoginastam namaste || 55|| yatsakaram shuddharupam manojnam garutmastham nilameghaprakasham
    | shankham cakram padmagade dadhanam tasmai namo yogayuktaya tubhyam || 56|| gaganam bhurdishashcaiva
    salilam jyotireva ca | vayuh kalashca rupani tasya tasmai namo'stu te || 57|| pradhanapurushau yasya
    karyangattve nivatsyatah | tasmadavyaktarupaya govindaya namo'stu te || 58|| yah svayam pancabhutani
    yah svayam tadgunah parah | yah svayam jagadadharastasmai tubhyam namo namah || 59|| parah puranah
    purushah paramatma jaganmayah | akshayo yo'vyayo devastasmai tubhyam namo namah || 60|| yo brahma
    kurute srishtim yo vishnuh kurute sthitim | samharishyati yo rudrastasmai tubhyam namo namah || 61||
    namo namah karanakaranaya divyamritajnanavibhutidaya | samastalokantaramohadaya prakasharupaya paratparaya
    || 62|| yasya prapanco jagaducyate mahan kshitirdishah surya indurmanojavah | vahnirmukhannabhitashcantariksham
    tasmai tubhyam haraye te namo'stu || 63|| tvam parah paramatma ca tvam vidya vividha hare | shabdabrahma
    parambrahma vicaranaparatparah || 64|| yasya nadirnamadhyanca nantamasti jagatpateh | katham stoshyami
    tam devam vamano gocaradbahih || 65|| yasya brahmadayo deva munayashca tapodhanah | na vivrinvanti
    rupani varnaniyah katham sa me || 66|| striya maya te kim jneya nirgunasya gunah prabhoh | naiva jananti
    yadrupam sendra api surasurah || 67|| namastubhyam jagannatha namastubhyam tapomaya | prasida bhagavamstubhyam
    bhuyo bhuyo namo namah || 68|| iti kalikapurane dvavimsho'adhyayantargatam sandhyakritam haristotram
    sampurnam |
  devanagari: परं यातां योगिनस्तं नमस्ते ॥ ५५॥ यत्साकारं शुद्धरूपं मनोज्ञं गरुत्मस्थं नीलमेघप्रकाशम् ।
    शङ्खं चक्रं पद्मगदे दधानं तस्मै नमो योगयुक्ताय तुभ्यम् ॥ ५६॥ गगनं भूर्दिशश्चैव सलिलं ज्योतिरेव च ।
    वायुः कालश्च रूपाणि तस्य तस्मै नमोऽस्तु ते ॥ ५७॥ प्रधानपुरुषौ यस्य कार्याङ्गत्त्वे निवत्स्यतः । तस्मादव्यक्तरूपाय
    गोविन्दाय नमोऽस्तु ते ॥ ५८॥ यः स्वयं पञ्चभूतानि यः स्वयं तद्गुणः परः । यः स्वयं जगदाधारस्तस्मै तुभ्यं
    नमो नमः ॥ ५९॥ परः पुराणः पुरुषः परमात्मा जगन्मयः । अक्षयो योऽव्ययो देवस्तस्मै तुभ्यं नमो नमः ॥ ६०॥
    यो ब्रह्मा कुरुते सृष्टिं यो विष्णुः कुरुते स्थितिम् । संहरिष्यति यो रुद्रस्तस्मै तुभ्यं नमो नमः ॥
    ६१॥ नमो नमः कारणकारणाय दिव्यामृतज्ञानविभूतिदाय । समस्तलोकान्तरमोहदाय प्रकाशरूपाय परात्पराय ॥ ६२॥ यस्य
    प्रपञ्चो जगदुच्यते महान् क्षितिर्दिशः सूर्य इन्दुर्मनोजवः । वह्निर्मुखान्नाभितश्चान्तरीक्षं तस्मै
    तुभ्यं हरये ते नमोऽस्तु ॥ ६३॥ त्वं परः परमात्मा च त्वं विद्या विविधा हरे । शब्दब्रह्म परम्ब्रह्म विचारणपरात्परः
    ॥ ६४॥ यस्य नादिर्नमध्यञ्च नान्तमस्ति जगत्पतेः । कथं स्तोष्यामि तं देवं वामनो गोचराद्बहिः ॥ ६५॥ यस्य
    ब्रह्मादयो देवा मुनयश्च तपोधनाः । न विवृण्वन्ति रूपाणि वर्णनीयः कथं स मे ॥ ६६॥ स्त्रिया मया ते किं
    ज्ञेया निर्गुणस्य गुणाः प्रभोः । नैव जानन्ति यद्रूपं सेन्द्रा अपि सुरासुराः ॥ ६७॥ नमस्तुभ्यं जगन्नाथ
    नमस्तुभ्यं तपोमय । प्रसीद भगवंस्तुभ्यं भूयो भूयो नमो नमः ॥ ६८॥ इति कालिकापुराणे द्वाविंशोऽअध्यायान्तर्गतं
    सन्ध्याकृतं हरिस्तोत्रं सम्पूर्णम् ।
