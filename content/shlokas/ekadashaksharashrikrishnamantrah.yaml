id: ekadashaksharashrikrishnamantrah
category: mantra
name:
  english: ekadashaksharashrikrishnamantrah
  devanagari: एकादशाक्षरश्रीकृष्णमन्त्रः
content:
  english: ekadashaksharashrikrishnamantrah || viniyogah || om asya shriekadashaksharashrikrishnamantrasya
    bhagavan narada rishih | gayatri chandah | shrikrishnaparamatma devata | om shaktih | klim bijam |
    glaum kilakam | bhagavan shrikrishnaparamatmaprityarthe jape viniyogah || || rishyadinyasah || shrinaradarishaye
    namah shirasi | gayatrichandase namah mukhe | shrikrishnaparamatmadevatayai namah hridi | om shaktaye
    namah nabhau | klim bijaya namah guhye | glaum kilakaya namah padayoh | bhagavat shrikrishnaparamatmaprityarthe
    jape viniyogaya namah sarvange || || karanyasah || om klim angushthabhyam namah | glaum klim tarjanibhyam
    svaha | krishnaya madhyamabhyam vashat | klim glaum anamikabhyam hum | klim om kanishthikabhyam vaushat
    | om klim glaum klim krishnaya klim glaum klim om karatalakaraprishthabhyam phat || || anganyasah
    || om klim hridayaya namah | glaum klim shirase svaha | krishnaya shikhayai vashat | klim glaum kavacaya
    hum | klim om netratrayaya vaushat | om klim glaum klim krishnaya klim glaum klim om astraya phat
    || || dhyanam || kasturitilakam lalatapatale vakshahsthale kaustubham | nasagre varamauktikam karatale
    venum kare kankanam || sarvange haricandanam sulalitam kanthe ca muktavalim | gopastripariveshtito
    vijayate gopalacudamanih || || mantrah || om klim glaum klim krishnaya klim glaum klim om || iti ekadashaksharashrikrishnamantrah
    sampurnah |
  devanagari: एकादशाक्षरश्रीकृष्णमन्त्रः ॥ विनियोगः ॥ ॐ अस्य श्रीएकादशाक्षरश्रीकृष्णमन्त्रस्य भगवान् नारद
    ऋषिः । गायत्री छन्दः । श्रीकृष्णपरमात्मा देवता । ॐ शक्तिः । क्लीं बीजम् । ग्लौं कीलकम् । भगवान् श्रीकृष्णपरमात्मप्रीत्यर्थे
    जपे विनियोगः ॥ ॥ ऋष्यादिन्यासः ॥ श्रीनारदऋषये नमः शिरसि । गायत्रीछन्दसे नमः मुखे । श्रीकृष्णपरमात्मदेवतायै
    नमः हृदि । ॐ शक्तये नमः नाभौ । क्लीं बीजाय नमः गुह्ये । ग्लौं कीलकाय नमः पादयोः । भगवत् श्रीकृष्णपरमात्मप्रीत्यर्थे
    जपे विनियोगाय नमः सर्वाङ्गे ॥ ॥ करन्यासः ॥ ॐ क्लीं अङ्गुष्ठाभ्यां नमः । ग्लौं क्लीं तर्जनीभ्यां स्वाहा
    । कृष्णाय मध्यमाभ्यां वषट् । क्लीं ग्लौं अनामिकाभ्यां हुं । क्लीं ॐ कनिष्ठिकाभ्यां वौषट् । ॐ क्लीं
    ग्लौं क्लीं कृष्णाय क्लीं ग्लौं क्लीं ॐ करतलकरपृष्ठाभ्यां फट् ॥ ॥ अङ्गन्यासः ॥ ॐ क्लीं हृदयाय नमः
    । ग्लौं क्लीं शिरसे स्वाहा । कृष्णाय शिखायै वषट् । क्लीं ग्लौं कवचाय हुं । क्लीं ॐ नेत्रत्रयाय वौषट्
    । ॐ क्लीं ग्लौं क्लीं कृष्णाय क्लीं ग्लौं क्लीं ॐ अस्त्राय फट् ॥ ॥ ध्यानम् ॥ कस्तूरीतिलकं ललाटपटले
    वक्षःस्थले कौस्तुभम् । नासाग्रे वरमौक्तिकं करतले वेणुं करे कङ्कणम् ॥ सर्वाङ्गे हरिचन्दनं सुललितं कण्ठे
    च मुक्तावलिम् । गोपस्त्रीपरिवेष्टितो विजयते गोपालचूडामणिः ॥ ॥ मन्त्रः ॥ ॐ क्लीं ग्लौं क्लीं कृष्णाय
    क्लीं ग्लौं क्लीं ॐ ॥ इति एकादशाक्षरश्रीकृष्णमन्त्रः सम्पूर्णः ।
