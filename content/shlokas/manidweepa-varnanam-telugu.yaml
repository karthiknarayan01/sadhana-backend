id: manidweepa-varnanam-telugu
category: stotram
name:
  english: Manidweepa Varnanam (Telugu)
content:
  english: mahashakti manidvipa nivasini mullokalaku mulaprakashini | manidvipamulo mantrarupini mana
    manasulalo kòluvaiyundi || || sugandha pushpalènno velu ananta sundara suvarna pulu | acancalambagu
    mano sukhalu manidvipaniki mahanidhulu || || lakshala lakshala lavanyalu akshara lakshala vaksampadalu
    | lakshala lakshala lakshmipatulu manidvipaniki mahanidhulu || || parijatavana saugandhalu suradhinadhula
    satsangalu | gandharvadula ganasvaralu manidvipaniki mahanidhulu || || bhuvaneshvari sankalpame janiyince
    manidvipamu | devadevula nivasamu adiye manaku kaivalyamu || padmaragamulu suvarnamanulu padi amadala
    pòdavuna galavu | madhura madhuramagu candanasudhalu manidvipaniki mahanidhulu || || aruvadi nalugu
    kalamatallulu varalanòsage padaru shaktulu | parivaramuto pancabrahmalu manidvipaniki mahanidhulu
    || || ashtasiddhulu navanavanidhulu ashtadikkulu dikpalakulu | srishtikartalu suralokalu manidvipaniki
    mahanidhulu || || kotisuryula pracanda kantulu koticandrula callani vèlugulu | kotitarakala vèlugu
    jilugulu manidvipaniki mahanidhulu || || bhuvaneshvari sankalpame janiyince manidvipamu | devadevula
    nivasamu adiye manaku kaivalyamu || kancu godala prakaralu ragi godala caturasralu | edamadala ratnarashulu
    manidvipaniki mahanidhulu || || pancamritamaya sarovaralu pancalohamaya prakaralu | prapancamele prajadhipatulu
    manidvipaniki mahanidhulu || || indranilamani abharanalu vajrapukotalu vaidhuryalu | pushyaragamani
    prakaralu manidvipaniki mahanidhulu || || saptakotighana mantravidyalu sarvashubhaprada icchashaktulu
    | shri gayatri jnanashaktulu manidvipaniki mahanidhulu || || bhuvaneshvari sankalpame janiyince manidvipamu
    | devadevula nivasamu adiye manaku kaivalyamu || milamilalade mutyapu rashulu talatalalade candrakantamulu
    | vidyullatalu marakatamanulu manidvipaniki mahanidhulu || || kubera indra varuna devulu shubhala
    nòsage agnivayuvulu | bhumi ganapati parivaramulu manidvipaniki mahanidhulu || || bhakti jnana vairagya
    siddhulu pancabhutamulu pancashaktulu | saptrishulu navagrahalu manidvipaniki mahanidhulu || || kasturi
    mallika kundavanalu suryakanti shila mahagrahalu | aru rituvulu caturvedalu manidvipaniki mahanidhulu
    || || bhuvaneshvari sankalpame janiyince manidvipamu | devadevula nivasamu adiye manaku kaivalyamu
    || mantrini dandini shaktisenalu kali karali senapatulu | muppadirèndu mahashaktulu manidvipaniki
    mahanidhulu || || suvarna rajita sundaragirulu anangadevi paricarikalu | gomedhikamani nirmitaguhalu
    manidvipaniki mahanidhulu || || saptasamudramulananta nidhulu yaksha kinnèra kimpurushadulu | nanajagamulu
    nadinadamulu manidvipaniki mahanidhulu || || manava madhava devaganamulu kamadhenuvu kalpataruvulu
    | srishti sthiti laya karanamurtulu manidvipaniki mahanidhulu || || bhuvaneshvari sankalpame janiyince
    manidvipamu | devadevula nivasamu adiye manaku kaivalyamu || koti prakritula saundaryalu sakala vedamulu
    upanishattulu | padarurekula padmashaktulu manidvipaniki mahanidhulu || || divyaphalamulu divyastramulu
    divyapurushulu dhiramatalu | divyajagamulu divyashaktulu manidvipaniki mahanidhulu || || shri vighneshvara
    kumarasvamulu jnanamukti ekanta bhavanamulu | maninirmitamagu mandapalu manidvipaniki mahanidhulu
    || || pancabhutamulu yajamanyalu pravalasalam aneka shaktulu | santanavriksha samudayalu manidvipaniki
    mahanidhulu || || bhuvaneshvari sankalpame janiyince manidvipamu | devadevula nivasamu adiye manaku
    kaivalyamu || cintamanulu navaratnalu nuramadala vajrapurashulu | vasantavanamulu garudapaccalu manidvipaniki
    mahanidhulu || || duhkhamu tèliyani devisenalu natanatyalu sangitalu | dhanakanakalu purushardhalu
    manidvipaniki mahanidhulu || || padunalugu lokalanniti paina sarvalokamanu lokamu kaladu | sarvalokame
    i manidvipamu sarveshvarikadi shashvata sthanam || || cintamanula mandiramandu pancabrahmala mancamupaina
    | mahadevudu bhuvaneshvarito nivasistadu manidvipamulo || || bhuvaneshvari sankalpame janiyince manidvipamu
    | devadevula nivasamu adiye manaku kaivalyamu || maniganakhacita abharanalu cintamani parameshvaridalci
    | saundaryaniki saundaryamuga agupadutundi manidvipamulo || || paradevatanu nityamukòlaci manasarpinci
    arcincinaco | aparadhanamu sampadalicci manidvipeshvari divistundi || || nutana grihamulu kattinavaru
    manidvipavarnana tòmmidisarlu | cadivina calu anta shubhame ashtasampadala tulatugeru || || shivakaviteshvari
    shricakreshvari manidvipa varnana cadivina cota | tishtavesukuni kurcònunanta kotishubhalanu samakurcutakai
    || || bhuvaneshvari sankalpame janiyince manidvipamu | devadevula nivasamu adiye manaku kaivalyamu
    ||
  devanagari: महाशक्ति मणिद्वीप निवासिनी मुल्लोकालकु मूलप्रकाशिनी । मणिद्वीपमुलो मन्त्ररूपिणी मन मनसुललो
    कॊलुवैयुन्दि ॥ ॥ सुगन्ध पुष्पालॆन्नो वेलु अनन्त सुन्दर सुवर्ण पूलु । अचञ्चलम्बगु मनो सुखालु मणिद्वीपानिकि
    महानिधुलु ॥ ॥ लक्षल लक्षल लावण्यालु अक्षर लक्षल वाक्सम्पदलु । लक्षल लक्षल लक्ष्मीपतुलु मणिद्वीपानिकि
    महानिधुलु ॥ ॥ पारिजातवन सौगन्धालु सूराधिनाधुल सत्सङ्गालु । गन्धर्वादुल गानस्वरालु मणिद्वीपानिकि महानिधुलु
    ॥ ॥ भुवनेश्वरि सङ्कल्पमे जनियिञ्चे मणिद्वीपमु । देवदेवुल निवासमु अदिये मनकु कैवल्यमु ॥ पद्मरागमुलु
    सुवर्णमणुलु पदि आमडल पॊडवुन गलवु । मधुर मधुरमगु चन्दनसुधलु मणिद्वीपानिकि महानिधुलु ॥ ॥ अरुवदि नालुगु
    कलामतल्लुलु वरालनॊसगे पदारु शक्तुलु । परिवारमुतो पञ्चब्रह्मलु मणिद्वीपानिकि महानिधुलु ॥ ॥ अष्टसिद्धुलु
    नवनवनिधुलु अष्टदिक्कुलु दिक्पालकुलु । सृष्टिकर्तलु सुरलोकालु मणिद्वीपानिकि महानिधुलु ॥ ॥ कोटिसूर्युल
    प्रचण्ड कान्तुलु कोटिचन्द्रुल चल्लनि वॆलुगुलु । कोटितारकल वॆलुगु जिलुगुलु मणिद्वीपानिकि महानिधुलु
    ॥ ॥ भुवनेश्वरि सङ्कल्पमे जनियिञ्चे मणिद्वीपमु । देवदेवुल निवासमु अदिये मनकु कैवल्यमु ॥ कञ्चु गोडल
    प्राकारालु रागि गोडल चतुरस्रालु । एडामडल रत्नराशुलु मणिद्वीपानिकि महानिधुलु ॥ ॥ पञ्चामृतमय सरोवरालु
    पञ्चलोहमय प्राकारालु । प्रपञ्चमेले प्रजाधिपतुलु मणिद्वीपानिकि महानिधुलु ॥ ॥ इन्द्रनीलमणि आभरणालु वज्रपुकोटलु
    वैढूर्यालु । पुष्यरागमणि प्राकारालु मणिद्वीपानिकि महानिधुलु ॥ ॥ सप्तकोटिघन मन्त्रविद्यलु सर्वशुभप्रद
    इच्छाशक्तुलु । श्री गायत्री ज्ञानशक्तुलु मणिद्वीपानिकि महानिधुलु ॥ ॥ भुवनेश्वरि सङ्कल्पमे जनियिञ्चे
    मणिद्वीपमु । देवदेवुल निवासमु अदिये मनकु कैवल्यमु ॥ मिलमिललाडे मुत्यपु राशुलु तलतललाडे चन्द्रकान्तमुलु
    । विद्युल्लतलु मरकतमणुलु मणिद्वीपानिकि महानिधुलु ॥ ॥ कुबेर इन्द्र वरुण देवुलु शुभाल नॊसगे अग्निवायुवुलु
    । भूमि गणपति परिवारमुलु मणिद्वीपानिकि महानिधुलु ॥ ॥ भक्ति ज्ञान वैराग्य सिद्धुलु पञ्चभूतमुलु पञ्चशक्तुलु
    । सप्तृषुलु नवग्रहालु मणिद्वीपानिकि महानिधुलु ॥ ॥ कस्तूरि मल्लिक कुन्दवनालु सूर्यकान्ति शिल महाग्रहालु
    । आरु ऋतुवुलु चतुर्वेदालु मणिद्वीपानिकि महानिधुलु ॥ ॥ भुवनेश्वरि सङ्कल्पमे जनियिञ्चे मणिद्वीपमु ।
    देवदेवुल निवासमु अदिये मनकु कैवल्यमु ॥ मन्त्रिणि दण्डिनि शक्तिसेनलु कालि कराली सेनापतुलु । मुप्पदिरॆण्डु
    महाशक्तुलु मणिद्वीपानिकि महानिधुलु ॥ ॥ सुवर्ण रजित सुन्दरगिरुलु अनङ्गदेवि परिचारिकलु । गोमेधिकमणि
    निर्मितगुहलु मणिद्वीपानिकि महानिधुलु ॥ ॥ सप्तसमुद्रमुलनन्त निधुलु यक्ष किन्नॆर किम्पुरुषादुलु । नानाजगमुलु
    नदीनदमुलु मणिद्वीपानिकि महानिधुलु ॥ ॥ मानव माधव देवगणमुलु कामधेनुवु कल्पतरुवुलु । सृष्टि स्थिति लय
    कारणमूर्तुलु मणिद्वीपानिकि महानिधुलु ॥ ॥ भुवनेश्वरि सङ्कल्पमे जनियिञ्चे मणिद्वीपमु । देवदेवुल निवासमु
    अदिये मनकु कैवल्यमु ॥ कोटि प्रकृतुल सौन्दर्यालु सकल वेदमुलु उपनिषत्तुलु । पदारुरेकुल पद्मशक्तुलु मणिद्वीपानिकि
    महानिधुलु ॥ ॥ दिव्यफलमुलु दिव्यास्त्रमुलु दिव्यपुरुषुलु धीरमातलु । दिव्यजगमुलु दिव्यशक्तुलु मणिद्वीपानिकि
    महानिधुलु ॥ ॥ श्री विघ्नेश्वर कुमारस्वामुलु ज्ञानमुक्ति एकान्त भवनमुलु । मणिनिर्मितमगु मण्डपालु मणिद्वीपानिकि
    महानिधुलु ॥ ॥ पञ्चभूतमुलु याजमान्यालु प्रवालसालं अनेक शक्तुलु । सन्तानवृक्ष समुदायालु मणिद्वीपानिकि
    महानिधुलु ॥ ॥ भुवनेश्वरि सङ्कल्पमे जनियिञ्चे मणिद्वीपमु । देवदेवुल निवासमु अदिये मनकु कैवल्यमु ॥ चिन्तामणुलु
    नवरत्नालु नूरामडल वज्रपुराशुलु । वसन्तवनमुलु गरुडपच्चलु मणिद्वीपानिकि महानिधुलु ॥ ॥ दुःखमु तॆलियनि
    देवीसेनलु नटनाट्यालु सङ्गीतालु । धनकनकालु पुरुषार्धालु मणिद्वीपानिकि महानिधुलु ॥ ॥ पदुनालुगु लोकालन्निटि
    पैन सर्वलोकमनु लोकमु कलदु । सर्वलोकमे ई मणिद्वीपमु सर्वेश्वरिकदि शाश्वत स्थानम् ॥ ॥ चिन्तामणुल मन्दिरमन्दु
    पञ्चब्रह्मल मञ्चमुपैन । महादेवुडु भुवनेश्वरितो निवसिस्ताडु मणिद्वीपमुलो ॥ ॥ भुवनेश्वरि सङ्कल्पमे जनियिञ्चे
    मणिद्वीपमु । देवदेवुल निवासमु अदिये मनकु कैवल्यमु ॥ मणिगणखचित आभरणालु चिन्तामणि परमेश्वरिदाल्चि ।
    सौन्दर्यानिकि सौन्दर्यमुगा अगुपडुतुन्दि मणिद्वीपमुलो ॥ ॥ परदेवतनु नित्यमुकॊलचि मनसर्पिञ्चि अर्चिञ्चिनचो
    । अपारधनमु सम्पदलिच्चि मणिद्वीपेश्वरि दीविस्तुन्दि ॥ ॥ नूतन गृहमुलु कट्टिनवारु मणिद्वीपवर्णन तॊम्मिदिसार्लु
    । चदिविन चालु अन्ता शुभमे अष्टसम्पदल तुलतूगेरु ॥ ॥ शिवकवितेश्वरि श्रीचक्रेश्वरि मणिद्वीप वर्णन चदिविन
    चोट । तिष्टवेसुकुनि कूर्चॊनुनण्ट कोटिशुभालनु समकूर्चुटकै ॥ ॥ भुवनेश्वरि सङ्कल्पमे जनियिञ्चे मणिद्वीपमु
    । देवदेवुल निवासमु अदिये मनकु कैवल्यमु ॥
