id: gajendramokshanah-vishnudharma
category: stotram
name:
  english: gajendramokshanah vishnudharma
  devanagari: गजेन्द्रमोक्षणः विष्णुधर्म
content:
  english: gajendramokshanastavah | shatanika uvaca | maya hi devadevasya vishnoramitatejasah | shrutah
    sambhutayah sarva gadatastava suvrata || 1|| yadi prasanno bhagavan anugrahyo'smi va yadi | tadaham
    shrotumicchami nrinam duhsvapnanashanam || 2|| svapna hi sumahabhaga drishyante ye shubhashubhah |
    phalani te prayacchanti tadgunanyeva bhargava || 3|| yadyatpunyam pavitram ca nrinamatishubhapradam
    | duhsvapnopashamayalam tanme vistarato vada || 4|| shaunaka uvaca | idameva maharaja prishtavamste
    pitamahah | bhishmam dharmabhritam shreshtham dharmaputro yudhishthirah || 5|| jitante pundarikaksha
    namaste vishvabhavana | namastestu rishikesha mahapurushapurvija || 6|| adyam purusham ishanam puruhutam
    prarushtutam | ritamekaksharam brahma vyaktavyaktam sanatanam || 7|| asacvacvaiva ca yadvishvam sadasat
    tatah param | paravaranam srashtaram puranam paramavyayam || 8|| mangalyam mangalam vishnum varenyam
    anagham shucim | namaskritya hrishikesham caracaraguram harim || 9|| nasti narayanasamam nabhutam
    na bhavishyati | pitena satyavakyena sarvarthan sadhayamyaham || 10|| kimanyairbahubhirmantraih shastrairva
    bahuvistrutaih | namo narayanayeti mantrah sarvarthasadhakah || 11|| padmasanam padmasamananashca
    padmasvayonim caturananam ca | shangavaidaishca vibhushitangam pitamaham tam pranato'smi nityam ||
    12|| munim snigdhambudabhasam vedavyasamakalmasham | sarastvatyavasam vedavyasam namamyaham || 13||
    maharshessarvalokeshu pujitasya mahatmanah | pravakshyami matam kritsnam vyasasyamitatejasah || 14||
    jajne mahayajna param hyudaram yadvipamadhye suvamatmavattah | parasharatgandhavati maharshim tasmai
    namo'jnanatamaunudaya || 15|| namo bhagavate tasmai vyasaya'mitatejase | yasyaprasadat vakshyami narayanakathamimam
    || 16|| janamejaya uvaca | kim japan mucyate brahman kim japan sukhamashrute | dusvapranashanam punyam
    shrotumicchami manada || 17|| vaishampayana uvaca | devavratam mahaprajnam sarvashastravisharadam
    | vinayenopasangamya paryapricchadyudhishthirah || 18|| yudhishthira uvaca | duhsvapnadarshanam ghoramavekshya
    bharatarshabha | prayatah kim japejjapyam vibuddhah kimanusmaret || 19|| pitamaha mahabuddhe buddherbhedo
    mahan ayam | pitamaha prasadena yajjnatam nripasattama tadaham shrotumicchami bruhi me vadatam vara
    || 20|| bhishma uvaca | sha
  devanagari: गजेन्द्रमोक्षणस्तवः । शतानीक उवाच । मया हि देवदेवस्य विष्णोरमिततेजसः । श्रुताः सम्भूतयः
    सर्वा गदतस्तव सुव्रत ॥ १॥ यदि प्रसन्नो भगवान् अनुग्राह्योऽस्मि वा यदि । तदहं श्रोतुमिच्छामि नॄणां
    दुःस्वप्ननाशनम् ॥ २॥ स्वप्ना हि सुमहाभाग दृश्यन्ते ये शुभाशुभाः । फलानि ते प्रयच्छन्ति तद्गुणान्येव
    भार्गव ॥ ३॥ यद्यत्पुण्यं पवित्रं च नॄणामतिशुभप्रदम् । दुःस्वप्नोपशमायालं तन्मे विस्तरतो वद ॥ ४॥ शौनक
    उवाच । इदमेव महाराज पृष्टवाम्स्ते पितामहः । भीष्मं धर्मभृतां श्रेष्ठं धर्मपुत्रो युधिष्ठिरः ॥ ५॥ जितन्ते
    पुण्डरीकाक्ष नमस्ते विश्वभावना । नमस्तेस्तु ऋषीकेश महापुरुषपूर्वीज ॥ ६॥ आद्यं पुरुषं ईशानं पुरुहूतं
    प्ररुष्टुतम् । ऋतमेकाक्षरं ब्रह्म व्यक्ताव्यक्तं सनातनम् ॥ ७॥ असच्वच्वैव च यद्विश्वं सदसत् ततः परम्
    । परावराणां स्रष्टारं पुराणं परमव्ययम् ॥ ८॥ मङ्गल्यं मङ्गलं विष्णुं वरेण्यं अनघं शुचिम् । नमस्कृत्य
    हृषीकेशं चरचरगुरं हरिम् ॥ ९॥ नास्ति नारायणसमं नभूतं न भविष्यति । पितेन सत्यवाक्येन सर्वार्थान् साधयाम्यहम्
    ॥ १०॥ किमन्यैर्बहुभिर्मन्त्रैः शास्त्रैर्वा बहुविस्त्रुतैः । नमो नारायणायेति मन्त्रः सर्वार्थसाधकः
    ॥ ११॥ पद्मासनं पद्मसमाननश्च पद्मस्वयोनिं चतुराननं च । षङ्गवैदैश्च विभूषिताङ्गं पितामहं तं प्रणतोऽस्मि
    नित्यम् ॥ १२॥ मुनिं स्निग्धाम्बुदाभासं वेदव्यासमकल्मषम् । सरस्त्वत्यावासं वेदव्यासं नमाम्यहम् ॥ १३॥
    महर्षेस्सर्वलोकेषु पूजितस्य महात्मनः । प्रवक्ष्यामि मतं कृत्स्नं व्यासस्यामिततेजसः ॥ १४॥ जज्ञे महायज्ञ
    परं ह्युदारं यद्वीपमध्ये सुवमात्मवत्तः । पराशरात्गन्धवती महर्षीं तस्मै नमोऽज्ञानतमौनुदाय ॥ १५॥ नमो
    भगवते तस्मै व्यासायाऽमिततेजसे । यस्यप्रसादात् वक्ष्यामि नारायणकथामिमाम् ॥ १६॥ जनमेजय उवाच । किं जपन्
    मुच्यते ब्रह्मन् किं जपन् सुखमश्रुते । दुस्वप्रनाशनं पुण्यं श्रोतुमिच्छामि मानद ॥ १७॥ वैशम्पायन उवाच
    । देवव्रतं महाप्राज्ञं सर्वशास्त्रविशारदम् । विनयेनोपसङ्गम्य पर्यपृच्छद्युधिष्ठिरः ॥ १८॥ युधिष्ठिर
    उवाच । दुःस्वप्नदर्शनं घोरमवेक्ष्य भरतर्षभ । प्रयतः किं जपेज्जप्यं विबुद्धः किमनुस्मरेत् ॥ १९॥ पितामह
    महाबुद्धे बुद्धेर्भेदो महान् अयम् । पितामह प्रसादेन यज्ज्ञातं नृपसत्तम तदहं श्रोतुमिच्छामि ब्रूहि
    मे वदतां वर ॥ २०॥ भीष्म उवाच । श
