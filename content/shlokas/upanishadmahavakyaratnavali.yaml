id: upanishadmahavakyaratnavali
category: upanishad
name:
  english: upanishadmahavakyaratnavali
  devanagari: उपनिशद्महावाक्यरत्नावली
content:
  english: nityah shuddho buddhamuktasvabhavah satyah sukshmah sanvibhushcadvitiyah || 19|| maitreyi 1|11
    anandabdhiryatparah so'hamasmi pratyagdhaturnatra samshitirasti || 20|| maitreyi 1|11 so'hamarkah
    param jyotirarkajyotiraham shivah || 21|| mahavakya atmajyotiraham shukrah sarvajyotirasavahom ||
