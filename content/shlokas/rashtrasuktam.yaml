id: rashtrasuktam
category: sukta
name:
  english: rashtrasuktam
  devanagari: राष्ट्रसूक्तम्
content:
  english: rashtrasuktam om a brahma̭nbrahma̱no bra̭hmavarca̱si ja̭yata̱ma rashtre ra̭ja̱nya̱h shura̭
    isha̱vyo̱'tivya̱dhi ma̭hara̱tho ja̭yata̱m dogdhr̭ dẖenurvodha̭na̱dvana̱shuh sapta̱ih pura̭ndhi̱ryosha̭
    ji̱shnu ra̭the̱shthah sa̱bheyo̱ yuva'sya̱ yaja̭manasya vi̱ro ja̭yatam nika̱me ni̭kame nah pa̱rjanyo̭
    varshatu̱ phala̭vatyo na̱ osha̭dhayah pacyantam yogakshe̱mo na̭h kalpatam |
  devanagari: राष्ट्रसूक्तम् ॐ आ ब्रह्म॑न्ब्राह्म॒णो ब्र॑ह्मवर्च॒सी जा॑यता॒मा राष्ट्रे रा॑ज॒न्यः॒ शूर॑
    इष॒व्यो॒ऽतिव्या॒धी म॑हार॒थो जा॑यतां॒ दोग्ध्र्॑ ध्॒एनुर्वोढा॑न॒ड्वाना॒शुः सप्त॒इः पुर॑न्धि॒र्योषा॑
    जि॒ष्णू र॑थे॒ष्ठाः स॒भेयो॒ युवाऽस्य॒ यज॑मानस्य वी॒रो जा॑यतां निका॒मे नि॑कामे नः प॒र्जन्यो॑ वर्षतु॒
    फल॑वत्यो न॒ ओष॑धयः पच्यन्तां योगक्षे॒मो नः॑ कल्पताम् ।
meaning: {}
