id: raghavendragurukarunasampadanastotram
category: stotram
name:
  english: raghavendragurukarunasampadanastotram
  devanagari: राघवेन्द्रगुरुकरुणासम्पादनस्तोत्रम्
content:
  english: vedante na kimapi sahasam maya''ttam samsarturmama dhishanabhavacchilabha | shrilanam dvijakaka
    ityanadrito va pashcadva purata utanugadiko'ham || 4|| dara me tilakatu kalpayanti cittam vratino
    dhanikatayapi napamartham | tasmanmamanupadhikam suputrakam te tateshtaprada kuru raghavendratirtha
    || 5|| yam yam va janamahamashraye sukhaya prarabdhanmama sa sa karmano jahati | hridrogah prapacati
    rupamadya tatya
  devanagari: वेदान्ते न किमपि साहसं मयाऽऽत्तं संसर्तुर्मम धिषणाभवच्छिलाभा । श्रीलानां द्विजकक इत्यनादृतो
    वा पश्चाद्वा पुरत उतानुगादिकोऽहम् ॥ ४॥ दारा मे तिलकटु कल्पयन्ति चित्तं व्रातीनो धनिकतयापि नापमर्थम्
    । तस्मान्मामनुपधिकं सुपुत्रकं ते तातेष्टप्रद कुरु राघवेन्द्रतीर्थ ॥ ५॥ यं यं वा जनमहमाश्रये सुखाय
    प्रारब्धान्मम स स कर्मणो जहाति । हृद्रोगः प्रपचति रूपमद्य तत्य
meaning: {}
