id: udaka-shanti-punyaha-vachanam
category: stotram
name:
  english: Udaka Shanti (Punyaha Vachanam)
content:
  english: kalasha pratishthapana prayoga mantrah brahmajajnana ssuruco vena avah | sa budhniya upama
    asya vishtha masatashca vivah | nake suparna mupaya tpatantagm hrida venanto abhyacaksha tatva | hiranyapaksham
    ya~masya yonau shakuna mbhuranyum | apyayasva sametu te vishvatah soma vrishniyam | bhava vajasya
    sangathe | yo rudro agnau yo aphsu ya oshadhishu yo rudro vishva bhuvana ''vivesha tasmai rudraya
    namo astu | vi~shnu rvicakrame tredha nidadhe padam | samudhamasya pagm sure | indram ngirah | rathitamagm
    rathinam va~janagm satpati m | apo va idamgm sarvam vi~shva bhutanyapah prana va apah pashava apo
    ssamradapo viradapa shchandagshyapo jyotigshyapo yajugshyapa ssarva devata apo bhurbhuvassuvarapa
    om | apah pranayati | shraddha va apah | shraddhamevarabhya praniya pracarati | apah pranayati | yajno
    va apah | yajnamevarabhya praniya pracarati | apah pranayati | vajro va apah | vajrameva bhratrivyebhyah
    prahritya praniya pracarati | apah pranayati | apo vai rakshoghnih | rakshasamapahatyai | apah pranayati
    | apo vai devana ndhama | devanameva priya ndhama praniya pracarati | apah pranayati | apo vai sarva
    devatah | devata evarabhya praniya pracarati | apah pranayati | apo vai shantah | shantabhirevasya
    shucagm shamayati | devo vah savito cchidrena pavitrena vasossuryasya rashmibhih || vedarambhe sarvasadharanyena
    japyah mantrah o mbhuvah bhargo devasya dhimahi | ogm suvah dhiyo yonah pracodaya nyam | bhargo devasya
    dhimahi | o mbhuvah dhiyo yonah pracodaya t | ogm suvah tathsavitu nyam bhargo devasya dhimahi | dhiyo
    yonah pracodaya yajnasya devamritvija ram ratna dhatamam | ishe tvorjetva vayavasstho payavastha devo
    vassavita prarpayatu shreshthatamaya karmane | agna ayahi vitaye grinano havyadataye | nihota sathsi
    barhishi | shanno devirabhishtaya apo bhavantu pitaye yo~rabhisravantu nah || rakshoghnam krinushva
    pajah prasitinna prithvim ya~hi raje vamavagm ibhena | trishvimanu prasitim 'si viddhya rakshasa stapishthaih
    | tava bhramasa ashuya patam tyanusprisha dhrishata shoshucanah | tapugshyagne juhva patam ganasandito
    visrija vishva gulkah | pratispasho visrija turnitamo bhava payurvisho asya adabdhah || || yono dure
    aghashagmsoyo antyagne makishte vyathira dadhar shit | udagne tishtha pratya tanushvanyamitragm oshata
    ttigmahete | yo no aratigm samidhana cakre nica tandhakshyata sanna shushka m | urdhvo bhava prati
    vidhya dhyasmada vishkrinushva daivya nyagne | avasthira tanuhi yatu juna njamimajamim pramrinihi
    shatrun || || sate janati sumatim ya~ vishthaya ivate brahmane gatumairat | vishva nyasmai sudinani
    rayo dyumnanyaryo viduro abhidyau t | sedagne astu subhaga ssudanu ryastva nityena havisha ya ukthaih
    | piprishati sva ayushi durone vishvedasmai sudina 'sadishtih | arcamite sumati sante va vata jarata
    miyangih || stva suratha marjaye masme kshatrani dharayera nudyun | iha tva bhurya caredupatma rdidivagm
    samanudyun | kridantastva sumanasa ssapemabhi dyumna tasthivagmso jananam | yastva svashvassuhiranyo
    agna upayati vasumata rathena | tasya trata bhavasi tasya sakha yasta atithya manushag jujoshat ||
    || mahorujami bandhuta vaco bhistanma piturgotamada nviyaya | tvanno asya vacasa shcikiddhi hotaryavishtha
    sukrato damunah | asvapna jastaranaya ssusheva atandraso 'vrika ashramishthah | te payavah sadhriyanco
    nishadyagne tava nah pantvamura | ye payavo mamateya nte agne pashyanto andha nduritada rakshann |
    raraksha tan thsukrito vishvaveda diphsanta idripavo naha debhuh || || tvaya vayagm sadhanya stvota
    stava prani tya shyama vajan | ubhashagm sa sudaya satyata te hrayana | aya te agne samidha vidhema
    pratistomagm shasyamana ngribhaya | dahashaso rakshasah pahyasma ndruho nido mitramaho avadyat | rakshohanam
    ~vajinamaji gharmi mitra mprathishtha mupayami sharma | shishano agnih kratubhi ssamiddha ssano diva
    sa rishah patu nakta || vijyotisha brihata bha rvishvani krinute mahitva | pradevirmaya ssahate dureva
    shshishite shringe rakshase vinikshe | utasvanaso divishantvagne stigmayudha rakshase hanta va u |
    made cidasya prarujanti bhama navarante paribadho adevih || indra suktam indram ~vo vishvataspari
    havamahe jane bhyah | asmakamastu kevalah | indra nnaro nemadhita havante yatparya yunajate dhiyastah
    | shuro nrishata shavasashcaka na a gomati vraje bhaja tvannah | indriyani shatakrato ya te janeshu
    pancasu | indra tani ta a vrine | anute dayi maha indriyaya satrate vishvamanu vritrahatye || anu
    kshatramanu saho yajatrendra devebhiranu te nrishahye thsaptavasava stishthanti svaruho yatha | rishir
    ha dirgha shruttama indrasya gharmo atithih | amasu pakvamairaya a suryagm rohayo divi | gharmanna
    samantapata suvriktibhi rjushtam girvana segirah | indrami dgathino brihadindra markebhi rarkinah
    | indram ~vaniranushata || || gayantitva gayatrinorcam tyarka markinah | brahmanastva shatakrata vudvagm
    shamiva ye mire | agmhomuce prabharema manisha moshishtha ngrinanah | idamindra prati havya ngribhaya
    satyassantu yajamanasya kamah | viveshayanma dhishana jajana stavai pura paryadindra mahnah | agmhaso
    yatra piparadyatha no naveva yanta mubhaye havante || ranamagm ho mucam ~vrishabham ya~jniyanam |
    apanna patamashvina hayanta masminnara indriya ndhattamojah | vina indra mridho jahi ni ca yaccha
    pritanyatah | adhaspada nkridhi yo asmagm abhidasati | indrakshatramabhi vamamojo 'jayatha vrishabha
    cara shaninam | apanudo janamamitra yanta muru ndevebhyo akrinoru lokam | mrigo na bhimah kucaro girishthah
    paravata ajagama || srikagm sagm shaya pavimindra tigmam ntadi vimridho nudasva | vishatrun vimridhonuda
    vivritrasya hanu ruja | vimanyumindra bhamito 'mitrasyabhi dasatah | trataramindra mavitara mindragm
    have have suhavagm shuramindra mpuruhuta mindragg svasti no maghava dhatvindrah || || ma te asyagm
    sahasava nparishta vaghaya bhuma harivah paradai | trayasvano 'vrikebhi rvaruthai stava priyasa ssurishu
    syama | anavaste rathamashvaya takshan tvashta vajram puruhuta dyumanta m | brahmana indram mahayanto
    arkairavardhaya nnahaye hanta va u | vrishne yatte vrishano arkamarca nindra gravano aditi | anashvaso
    ye pavayo 'ratha indreshita abhyavarta yata indra bhayamahe tato no abhaya nkridhi | maghavan cchagdhi
    tava tanna utaye vidvisho vimridho jahi | svastida vishaspati rvritraha vimridho vashi | vrishendrah
    pura etu na ssvastida abhaya a || mahagm indro vajra bahu shshodashi sharma yacchatu | svasti no maghava
    karotu hantu papmanam yo ndveshti | sajosha indra sagano marudbhi ssomam piba vritrahan cchura vidvan
    | jahi shatrugm rapamridho nkrinuhi vishvato nah || ye devah ye devah purassado pashcathsada ssavitri
    ne uttarasado varunanetra uparishado brihaspati netra rakshohanaste nah pantu te no 'vantu tebhyo
    namastebhya ssvaha 'gnaye rakshoghne svaha varunaya brihaspataye duvasvate rakshoghne svaha ye devah
    purassado tra rakshohanastenah pantu te no 'vantu tebhyo namastebhya ssvaha | ye deva dakshinasado
    yama ne tra rakshohanastenah pantu te no 'vantu tebhyo namastebhya ssvaha | ye devah pashcathsada
    ssavitri ne tra rakshohanastenah pantu te no 'vantu tebhyo namastebhya ssvaha | ye deva uttarasado
    varunanetra rakshohanastenah pantu te no 'vantu tebhyo namastebhya ssvaha | ye deva uparishado brihaspati
    netra rakshohanastenah pantu te no 'vantu tebhyo namastebhya ssvaha | agnaye rakshoghne svaha | yamaya
    rakshoghne svaha | savitre rakshoghne svaha | varunaya rakshoghne svaha | brihaspataye duvasvate rakshoghne
    svaha ayushkameshti mantrah agnirayushman deva ayushmantaste 'mritena yushmantastenatva ayushkameshti
    mantrah thsa vanaspatibhi rayushma nkaromi | soma ayushman thsa oshadhibhirayushma nkaromi | yajna
    ayushman thsa dakshinabhirayushma nkaromi | brahmayushmatta ''yushmantam karomi | deva ayushmantaste
    'mrite nayushmantastenatva agmhomuca mantrah ya vamindra varuna yatavya tanustaye mamagmhaso muncatam
    ~ya vamindra varuna sahasya tanustaye mamagmhaso muncatam ~yo vamindra varuna vagnau sramastam yo
    vamindra varuna dvipathsu pashushu va~ metena vayaje || ya vamindra varuna yatavya tanustaye mamagmhaso
    muncatam | ya vamindra varuna sahasya tanustaye mamagmhaso muncatam | ya vamindra varuna rakshasya
    tanustaye mamagmhaso muncatam | ya vamindra varuna tejasya tanustaye mamagmhaso muncatam | yo vamindra
    varuna vagnau sramastam va~me tena vayaje | yo vamindra varuna dvipathsu pashushu sramastam va~me
    tena vayaje | yo vamindra varuna catushpathsu pashushu sramastam va~me tena vayaje | yo vamindra varuna
    goshthe sramastam va~me tena vayaje | yo vamindra varuna griheshu sramastam va~me tena vayaje | yo
    vamindra varuna va~me tena vayaje | yo vamindra varunaushadhishu sramastam va~me tena vayaje | yo
    vamindra varuna vanaspatishu sramastam va~me tena vayaje || yashase mamarpayendravati mapaciti mihavaha
    | aya mmurdha parameshthi suvarca ssamanana muttama shloko astu | bhadra mpashyanta upaseduragre tapo
    diksha mrishaya ssuvarvidah | tatah kshatra ntadasmai deva abhisanna mantu | dhata vidhata paramota
    sandri kprajapatih parameshthi viraja shcandagmsi nividoma ahuretasmai rashtramabhi sannamama | abhyavartaddhva
    mupameta sakamayagm shasta 'dhipatirvo astu | asya vijnanamanusagm mpashcadanu jivatha sarve 'phsarasa
    urjo nama sa ida ntu tasmai svaha tabhya ssvaha sagmhito vishvasama suryo gandharva ssushumna ssurya
    rashmi shcandrama gandharva stasya nakshatranya bhujyussuparno yajno gandharva stasya dakshina aphsarasa
    stavah rvishvakarma mano gandharvastasya ishiro vishva vyaca vato gandharva bhuvanasya pate yasyata
    upari griha iha ca | sa no rasvajyanigm rayasposhagm suviryagm sam va~thsarinag svastim | parameshthyadhipati
    stasya vishvamaphsaraso bhuva nparjanyo gandharva stasya praja aphsaraso bhiruvah caruh kripana kashi
    kamo gandharva 'phsarasa shshocayantir ntu tasmai svaha tabhya ssvaha sa no bhuvanasya pate yasyata
    upari griha iha ca | uru brahmane 'smai kshatraya mahi sharma yaccha || mpatu tasmai svaha 'phsarasa
    urjo nama ta ida ntu tabhya ssvaha || sagmhito vishvasama suryo gandharvassa ida mpatu tasmai svaha
    'phsarasa ayuvo nama ta ida ntu tabhya ssvaha rashmishcandrama gandharvassa ida mpatu tasmai svaha
    | tasya nakshatranya 'phsaraso bekurayo nama ta ida ntu tabhya ssvaha || bhujyussuparno yajno gandharvassa
    ida mpatu tasmai svaha | tasya dakshina aphsarasa stava nama ta ida ntu tabhya ssvaha rvishvakarma
    mano gandharvassa ida mpatu tasmai svaha 'phsaraso vahnayo nama ta ida ntu tabhya ssvaha || ishiro
    vishvavyaca vato gandharvassa ida mpatu tasmai svaha 'phsaraso muda nama ta ida ntu tabhya ssvaha
    || bhuvanasya pate yasyata upari griha iha ca | sa no rasvajyanigm rayasposhagm suviryagm sam va~thsarinag
    svastigg || parameshthyadhipati mpatu tasmai svaha | tasya vishvamaphsaraso bhuvo nama ta ida ntu
    tabhya ssvaha nparjanyo gandharvassa ida mpatu tasmai svaha 'phsaraso ruco nama ta ida ntu tabhya
    ssvaha || dure hetira mridayo mrityu mpatu tasmai svaha | tasya praja aphsaraso bhiruvo nama ta ida
    ntu tabhya ssvaha || caruh kripana kashi kamo gandharvassa ida mpatu tasmai svaha 'phsarasa shshocayanti
    ntu tabhya ssvaha || sa no bhuvanasyapate yasyata upari griha iha ca |uru brahmane 'smai kshatraya
    mahi sharma yaccha svaha sarpa suktam namo astu sarpebhyo ye ke ca prithivi manu | ye antarikshe ye
    divi tebhya ssarpebhyo namah | ye 'do rocane divo ye va suryasya rashmishu | yeshamaphsu sadah krita
    ntebhya ssarpebhyo namah | ya ishavo yatu dhananam ~ye va vanaspatigm ranu | ye va 'vateshu sherate
    tebhya ssarpebhyo namah || mpuro harikesha ssuryarashmi stasya rathagrithsashca rathaujashca senani
    gramanyau punjikasthala ca kritasthala ca phsarasau yatu dhana heti rakshagmsi praheti ndakshina vishva
    karma tasya ratha svanashca rathe citrashca senani gramanyau menaka ca sahajanya ca 'phsarasau damshnavah
    pashavo hetih paurusheyo vadhah praheti vyaca stasya ratha protashca samarathashca senani gramanyau
    pramlocanti ca numlocanti 'phsarasau sarpa heti r vyaghrah praheti ya~dvasustasya senajicca sushenashca
    senani gramanyau vishvacica ghritaci ca phsarasa vapo heti sustasya tarkshya nemishca senani gramanya
    vurvashi ca purvacittishca phsarasau vidyuddheti stebhyo namaste no mridayantu te ya ndvishmo yashca
    no dveshti tam mpuro harikesha ssuryarashmi stasya rathagrithsashca rathaujashca senani gramanyau
    punjikasthala ca kritasthala ca phsarasau yatudhana heti rakshagmsi prahetistebhyo namaste no mridayantute
    ya ndvishmo yashca no dveshti tam vo~ jambhe dadhami || aya ndakshina vishvakarma tasya rathasvanashca
    rathe citrashca senani gramanyau menaka ca sahajanya ca phsarasau damshnavah pashavo hetih paurusheyo
    vadhah prahetistebhyo namaste no mridayantu te ya ndvishmo yashca no dveshti tam vo~ jambhe dadhami
    || aya stasya rathaprotashca samarathashca senani gramanyau pramlocantica numlocanti caphsarasau sarpa
    heti rvyaghrah prahetistebhyo namaste no mridayantu teya ndvishmo yashca no dveshti tam vo~ jambhe
    dadhami || aya ya~dvasustasya senajicca sushenashca senani gramanyau vishvacica ghritacica phsarasa
    vapo heti rvatah prahetistebhyo namaste no mridayantu te ya ndvishmo yashca no dveshti tam vo~ jambhe
    dadhami || ayamuparya rvagvasustasya tarkshya nemishca senani gramanya vurvashi ca purvacitti shcaphsarasau
    vidyuddhetira nprahetistebhyo namaste no mridayantu te ya ndvishmo yashca no dveshti tam shshishano
    vrishabho na yudhmo ghanaghanah shaninam | sankrandano 'nimisha eka virashshatagm sena ajayathsakamindrah
    | sankrandanena nimishena jishnuna yutkarena dushcyavanena dhrishnuna | tadindrena jayata ta thsahadhvam
    ~yudho nara ishu hastena vrishna ssa nishangibhirvashi sagg srashta sa yudha indro ganena | sagmsrishtaji
    thsomapa bahu shardhyu rdhva dhanva pratihitabhirasta | brihaspate paridiya rathena rakshoha 'mitragm
    apa badhamanah || pramrino yudha jayannasmaka medhyavita rathanam | gotrabhidam govidam ~vajrabahum
    jayantamajma pramrinanta mojasa | imagm sajata anuvira yadhva mindragm sakhayo 'nu sagm rabhadhvam
    | balavijnaya ssthavirah pravira vaji sahamana ugrah | abhiviro abhisatva sahoja jaitramindra rathamatishtha
    govit || || abhigotrani sahasa gahamano 'dayo virashshatamanyurindrah | dushcyavanah pritanashada
    yudhyo smakagm sena avatu prayuthsu | indra asam rdakshina yajnah pura etu somah | devasenana mmaruto
    yantvagre | indrasya vrishno varunasya rajna adityana mmarutagm shardha ugram | mahamanasa mbhuvanacyavanam
    ghosho devanam jayata mudasthat | asmaka ssamriteshu dhvajeshvasmakam ~ya ishavasta jayantu || ||
    asmakam ~vira uttare bhavantvasmanu deva avata haveshu | uddhar mmamakanam mahagmsi | udvritrahan
    vajinam ~vajinanyudrathanam jayatametu ghoshah | upapreta jayata narassthira vassantu bahavah | indro
    va dhrishya yathasatha | avasrishta parapata sharavye brahma sagmshita || npravisha maisham kancanocchishah
    | marmani te varmabhishchadayami somastva raja 'mritenabhi vastam | urorvariyo varivaste astu jayantam
    tvamanu madantu devah | yatra bana ssampatanti kumara vishikha iva | indro nastatra vritraha vishvaha
    sharma yacchatu || nca me mayashca me priya 'nukamashca me kamashca me saumanasashca me bhadra nca
    me shreyashca me vasyashca me yashashca me bhagashca me dravina nca me yanta ca me dharta ca me kshemashca
    me dhritishca me vishvam ca me mahashca me vi~cca me jnatra nca me sushca me prasushca me sira nca
    me layashca ma rita 'mritam ca me 'yakshma 'namayacca me jivatushca me dirghayutva nca me susha ca
    me sudina gne varco vihaveshvastu vaya ntvendhana stanuva mpradishashcatasra stvaya 'ddhyakshena pritana
    jayema | mama deva vihave santu sarva indravanto maruto vishnuragnih | mamantariksha muru gopamastu
    mahyam ~vatah pavata nkame asminn | mayi deva dravina mayajanta mmayya shirastu mayi devahutih ||
    || daivya hotara vanishanta purve 'rishta ssyama tanuva suvirah | mahyam ~yajantu mama yani havya
    ''kuti ssatya manaso me astu | eno maniga vi~shve devaso adhivoca ta me | devi rvirurunah krinota
    vishve devasa iha virayaddhvam | maha smahi prajaya ma tanubhi rmaradhama dvishate somarajann | agnirmanyu
    dadabdho gopah paripahi nastvam || || pratyanco yantu nigutah punaste 'maisha mprabudha vineshat |
    dhata dhatrina rdevagm savitaramabhi matishaha ya~jna mashvinobha brihaspati nnyarthat | uruvyaca
    no mahisha shsharmayagm sadasmin have puruhutah purukshu | sa nah prajayai haryashva mridayendra ma
    no ririsho ma paradah || || ye na ssapatna apate bhavantvindra gnibhya mava badhamahe tan | vasavo
    rudra aditya upari sprisham mogram cettaramadhi rajamakrann | arvanca mindra mamuto havamahe yo goji
    jidyah | imanno yajnam vi~have jushasvasya kurmo harivo medinam tva || rmanve prathamasya pracetasoya
    vi~shi pravivishivagm samimahe sa no muncatvagm hasah | yasyeda dyadejati yasya jata nca kevalam |
    staumyagni nnathito johavimi sa no muncatvagm hasah | indrasya manye prathamasya pracetaso vritraghna
    sstoma upama mupaguh | yo dashushah sukrito havamupa ganta sa no muncatvagm hasah || va~shi yudhe
    yah pushtani sagmsrijati trayani | staumindra nnathito johavimi sa no muncatvagm hasah | manvevam
    mitravaruna tasya vittagm satyaujasa drigmhana ya | ya rajanagm saratham ~yatha ugra ta no muncata
    magasah | yo vagm ratha rijurashmi ssatyadharma mithu mupayati dushayann || || staumi mitravaruna
    nathito johavimi tau no muncata magasah | vayo rvidathani manmahe yava vadbibhrito yau ca rakshatah
    | yau vishvasya paribhu babhuvatustau no muncata magasah | upashreshthana ashisho devayordharme asthirann
    | staumi vayugm savitara nnathito johavimi tau no muncata magasah | rathitamau rathina mahva utaye
    shubhangamishthau suyame nishita mojastau no muncata magasah | yadayatam stricakrena sagm sadamicchamanau
    | staumi deva vashvinau nathito johavimi tau no muncata magasah | marutam manve adhino bruvantu premam
    va~cam ~vishvamavantu vishve huve suyamanutaye te no muncantvenasah | tigmamayudham vi~ditagm sahasvada
    divyagm shardhah pritanasu jishnu || nmaruto nathito johavimi te no muncantvenasah | devana mmanve
    adhi no bruvantu premam va~cam ~vishvamavantu vishve huve suyamanutaye te no muncantvenasah | yadida
    'bhishocati paurusheyena daivyena | staumi vishva nnathito johavimi te no muncantvenasah | anuno 'dyanumatiranvidanu
    mate tvam shvanaro na utya prishto divi || ndeveshu manyatam | agnishca havya vahano bhavata ndashushe
    mayah | anvidanumate tva mmanyasai shanca nah kridhi | kratve dakshaya no hinu prana ayugmshi tarishah
    || a || vaishvanaro na utya ''prayatu paravatah | agnirukthena vahasa | prishto divi prishto agnih
    prithivya mprishto vishva oshadhira vivesha | vaishvanara ssahasa prishto agnissano diva sarishah
    patu nakta b || ye apratheta mamitebhi rojobhi rye pratishthe abhavatam va~sunam | staumi dyavaprithivi
    nathito johavimi te no muncatamagm hasah | urvi rodasi varivah krinota nkshetrasya patni adhino bruyatam
    | staumi dyavaprithivi nathito johavimi te no muncatamagm hasah | yatte vaya mpurushatraya vishtha
    vidvagm sashca krima kacca nagah || || kridhi svasmagm aditeranaga vyenagmsi shishratho vishvagagne
    | yatha ha ta tpadishita mamuncata yajatrah | eva tvamasma tpramunca vyagmhah prata ryagne prataranna
    ayuh || sarpahuti mantrah samici namasi praci diktasya ste 'gniradhipati rasito rakshita yashcadhipati
    ryashca gopta tabhyam namastauno mridayatam te ya ndvishmo yashca no dveshti tam jasvini namasi dakshina
    diktasya praci namasi pratici diktasya syudici diktasya radhipatni namasi brihati diktasya 'dhipatih
