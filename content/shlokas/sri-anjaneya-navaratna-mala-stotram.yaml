id: sri-anjaneya-navaratna-mala-stotram
category: stotram
name:
  english: Sri Anjaneya Navaratna Mala Stotram
content:
  english: tato ravananitayah sitayah shatrukarshanah | iyesha padamanveshtum caranacarite pathi || yasya
    tvetani catvari vanarendra yatha tava | smritirmatirdhritirdakshyam sa karmasu na sidati || anirvedah
    shriyo mulam anirvedah param sukham | anirvedo hi satatam sarvartheshu pravartakah || namo'stu ramaya
    salakshmanaya devyai ca tasyai janakatmajayai | namo'stu rudrendrayamanilebhyah namo'stu candrarkamarudganebhyah
    || priyanna sambhavedduhkham apriyadadhikam bhayam | tabhyam hi ye viyujyante namastesham mahatmanam
    || ramah kamalapatrakshah sarvasattvamanoharah | rupadakshinyasampannah prasuto janakatmaje || jayatyatibalo
    ramo lakshmanashca mahabalah | raja jayati sugrivo raghavenabhipalitah | daso'ham kosalendrasya ramasyaklishtakarmanah
    | hanuman shatrusainyanam nihanta marutatmajah || yadyasti patishushrusha yadyasti caritam tapah |
    yadi vastyekapatnitvam shito bhava hanumatah || nivrittavanavasam tam tvaya sardhamarindamam | abhishiktamayodhyayam
    kshipram drakshyasi raghavam || || iti shri anjaneya navaratnamala stotram |
  devanagari: ततो रावणनीतायाः सीतायाः शत्रुकर्शनः । इयेष पदमन्वेष्टुं चारणाचरिते पथि ॥ यस्य त्वेतानि चत्वारि
    वानरेन्द्र यथा तव । स्मृतिर्मतिर्धृतिर्दाक्ष्यं स कर्मसु न सीदति ॥ अनिर्वेदः श्रियो मूलं अनिर्वेदः
    परं सुखम् । अनिर्वेदो हि सततं सर्वार्थेषु प्रवर्तकः ॥ नमोऽस्तु रामाय सलक्ष्मणाय देव्यै च तस्यै जनकात्मजायै
    । नमोऽस्तु रुद्रेन्द्रयमानिलेभ्यः नमोऽस्तु चन्द्रार्कमरुद्गणेभ्यः ॥ प्रियान्न सम्भवेद्दुःखं अप्रियादधिकं
    भयम् । ताभ्यां हि ये वियुज्यन्ते नमस्तेषां महात्मनाम् ॥ रामः कमलपत्राक्षः सर्वसत्त्वमनोहरः । रूपदाक्षिण्यसम्पन्नः
    प्रसूतो जनकात्मजे ॥ जयत्यतिबलो रामो लक्ष्मणश्च महाबलः । राजा जयति सुग्रीवो राघवेणाभिपालितः । दासोऽहं
    कोसलेन्द्रस्य रामस्याक्लिष्टकर्मणः । हनुमान् शत्रुसैन्यानां निहन्ता मारुतात्मजः ॥ यद्यस्ति पतिशुश्रूषा
    यद्यस्ति चरितं तपः । यदि वास्त्येकपत्नीत्वं शीतो भव हनूमतः ॥ निवृत्तवनवासं तं त्वया सार्धमरिन्दमम्
    । अभिषिक्तमयोध्यायां क्षिप्रं द्रक्ष्यसि राघवम् ॥ ॥ इति श्री आञ्जनेय नवरत्नमाला स्तोत्रम् ।
