id: satyavratoktadamodarastotram
category: stotram
name:
  english: satyavratoktadamodarastotram
  devanagari: सत्यव्रतोक्तदामोदरस्तोत्रम्
content:
  english: satyavratoktadamodarastotram shriganeshaya namah || sindhudeshodbhavo vipro namna satyavratah
    sudhih | virakta indriyarthebhyastyaktva putragrihadikam || 1|| vrindavane sthitah krishnamariradha
    divanisham | nihsvah satyavrato vipro nirjane'vyagramanasah || 2|| kartike pujayamasa pritya damodaram
    nripa | tritiye'hni sakridbhunkte patram mulam phalam tatha || 3|| pujayitva harim stauti pritya damodarabhidham
    || 4|| satyavrata uvaca | namamishvaram saccidanandarupam lasatkundalam gokule bhrajamanam | yashodabhiyolukhale
    dhavamanam paramrishtamatyantato dutagopya || 5|| rudantam muhurnetrayugmam mrijantam karambhojayugmena
    satankanetram | muhuhshvasakam patrirekhankakantham sthitam naumi damodaram bhaktavandyam || 6|| varam
    deva dehisha mokshavadhim va na canyam vrine'ham vareshadapiha | idam te vapurnatha gopalabalam sada
    me manasyavirastam kimanyaih || 7|| idam te mukhambhojamatyantanilairvritam kuntalaih snigdhavaktraishca
    gopya | muhushcumbitam bimbaraktadharam me manasyavirastamalam lakshalabhaih || 8|| namo deva damodarananta
    vishno prasida prabho duhkhajalabdhimagnam | kripadrishtivrishtya'tidinam ca raksha grihanesha mamajnamevakshidrishyam
    || 9|| kuberatmajau vrikshamurti ca yadvatvaya mocitau bhaktibhajau kritau ca | tatha premabhaktim
    svakam me prayaccha na mokshe''graho me'sti damodareha || 10|| namaste sudamne sphuraddiptadhamne
    tathorasthavishvasya dhamne namaste | namo radhikayai tvadiyapriyayai namo'nantalilaya devaya tubhyam
    || 11|| narada uvaca | satyavratadvijastotram shrutva damodaro harih | vidyullilacamatkaro hridaye
    shanakairabhut || 12|| iti shrisatyavratakritadamodarastotram sampurnam || iti shripadmapurane rukmangada
  devanagari: सत्यव्रतोक्तदामोदरस्तोत्रम् श्रीगणेशाय नमः ॥ सिन्धुदेशोद्भवो विप्रो नाम्ना सत्यव्रतः सुधीः
    । विरक्त इन्द्रियार्थेभ्यस्त्यक्त्वा पुत्रगृहादिकम् ॥ १॥ वृन्दावने स्थितः कृष्णमारिराध दिवानिशम् ।
    निःस्वः सत्यव्रतो विप्रो निर्जनेऽव्यग्रमानसः ॥ २॥ कार्तिके पूजयामास प्रीत्या दामोदरं नृप । तृतीयेऽह्नि
    सकृद्भुङ्क्ते पत्रं मूलं फलं तथा ॥ ३॥ पूजयित्वा हरिं स्तौति प्रीत्या दामोदराभिधम् ॥ ४॥ सत्यव्रत उवाच
    । नमामीश्वरं सच्चिदानन्दरूपं लसत्कुण्डलं गोकुले भ्राजमानम् । यशोदाभियोलूखले धावमानं परामृष्टमत्यन्ततो
    दूतगोप्या ॥ ५॥ रुदन्तं मुहुर्नेत्रयुग्मं मृजन्तं कराम्भोजयुग्मेन सातङ्कनेत्रम् । मुहुःश्वासकं पत्रिरेखाङ्ककण्ठं
    स्थितं नौमि दामोदरं भक्तवन्द्यम् ॥ ६॥ वरं देव देहीश मोक्षावधिं वा न चान्यं वृणेऽहं वरेशादपीह । इदं
    ते वपुर्नाथ गोपालबालं सदा मे मनस्याविरास्तां किमन्यैः ॥ ७॥ इदं ते मुखाम्भोजमत्यन्तनीलैर्वृतं कुन्तलैः
    स्निग्धवक्त्रैश्च गोप्या । मुहुश्चुम्बितं बिम्बरक्ताधरं मे मनस्याविरास्तामलं लक्षलाभैः ॥ ८॥ नमो देव
    दामोदरानन्त विष्णो प्रसीद प्रभो दुःखजालाब्धिमग्नम् । कृपादृष्टिवृष्ट्याऽतिदीनं च रक्ष गृहाणेश मामज्ञमेवाक्षिदृश्यम्
    ॥ ९॥ कुबेरात्मजौ वृक्षमूर्ती च यद्वत्वया मोचितौ भक्तिभाजौ कृतौ च । तथा प्रेमभक्तिं स्वकां मे प्रयच्छ
    न मोक्षेऽऽग्रहो मेऽस्ति दामोदरेह ॥ १०॥ नमस्ते सुदाम्ने स्फुरद्दीप्तधाम्ने तथोरस्थविश्वस्य धाम्ने नमस्ते
    । नमो राधिकायै त्वदीयप्रियायै नमोऽनन्तलीलाय देवाय तुभ्यम् ॥ ११॥ नारद उवाच । सत्यव्रतद्विजस्तोत्रं
    श्रुत्वा दामोदरो हरिः । विद्युल्लीलाचमत्कारो हृदये शनकैरभूत् ॥ १२॥ इति श्रीसत्यव्रतकृतदामोदरस्तोत्रं
    सम्पूर्णम् ॥ इति श्रीपद्मपुराणे रुक्माङ्गद
