id: devaihkritam12shivastotram
category: stotram
name:
  english: devaihkritam12shivastotram
  devanagari: देवैःकृतं१२शिवस्तोत्रम्
content:
  english: 30|| evam mudhadhiyashcajnah pujayam te sanatanam | avahanam na janimo gatim naiva prabho'dbhutam
    || 31|| gangasaliladharaya hyadharaya gunatmane | namaste tridasheshaya shankaraya namo namah || 32||
    vrishankaya maheshaya gananam pataye namah | sarveshvaraya devaya trilokapataye namah || 33|| samhartre
    jagatam natha sarvesham te namo namah | bhartre kartre ca devesha triguneshaya shashvate || 34|| visangaya
    pareshaya shivaya paramatmane | nishprapancaya shuddhaya paramayavyayaya ca || 35|| dandahastaya kalaya
    pashahastaya te namah | vedamantrapradhanaya shatajihvaya te namah || 36|| bhutam bhavyam bhavishyacca
    sthavaram jangamam ca yat | tava dehatsamutpannam sarvatha parameshvara || 37|| pahi nassarvada svaminprasida
    bhagavanprabho | vayam te sharanapannah sarvatha parameshvara || 38|| shitikanthaya rudraya svahakaraya
    te namah | arupaya sarupaya vishvarupaya te namah || 39|| shivaya nilakanthaya citabhasmangadharine
    | nityam nilashikhandaya shrikanthaya namo namah || 4
  devanagari: ३०॥ एवं मूढधियश्चाज्ञाः पूजायां ते सनातनम् । आवाहनं न जानीमो गतिं नैव प्रभोऽद्भुताम् ॥ ३१॥
    गङ्गासलिलधाराय ह्याधाराय गुणात्मने । नमस्ते त्रिदशेशाय शङ्कराय नमो नमः ॥ ३२॥ वृषाङ्काय महेशाय गणानां
    पतये नमः । सर्वेश्वराय देवाय त्रिलोकपतये नमः ॥ ३३॥ संहर्त्रे जगतां नाथ सर्वेषां ते नमो नमः । भर्त्रे
    कर्त्रे च देवेश त्रिगुणेशाय शाश्वते ॥ ३४॥ विसङ्गाय परेशाय शिवाय परमात्मने । निष्प्रपञ्चाय शुद्धाय
    परमायाव्ययाय च ॥ ३५॥ दण्डहस्ताय कालाय पाशहस्ताय ते नमः । वेदमन्त्रप्रधानाय शतजिह्वाय ते नमः ॥ ३६॥
    भूतं भव्यं भविष्यच्च स्थावरं जङ्गमं च यत् । तव देहात्समुत्पन्नं सर्वथा परमेश्वर ॥ ३७॥ पाहि नस्सर्वदा
    स्वामिन्प्रसीद भगवन्प्रभो । वयं ते शरणापन्नाः सर्वथा परमेश्वर ॥ ३८॥ शितिकण्ठाय रुद्राय स्वाहाकाराय
    ते नमः । अरूपाय सरूपाय विश्वरूपाय ते नमः ॥ ३९॥ शिवाय नीलकण्ठाय चिताभस्माङ्गधारिणे । नित्यं नीलशिखण्डाय
    श्रीकण्ठाय नमो नमः ॥ ४
