id: vasudeva
category: upanishad
name:
  english: vasudeva
  devanagari: वसुदेव
content:
  english: brahmananam tu sarvesham vaidikanamanuttamam | gopicandanavaribhyamurdhvapundram vidhiyate
    | yo gopicandanabhave tulasimulamrittikam | mumukshurdharayennityamaparokshatmasiddhaye | atiratragnihotrabhasmanagnerbhasitamidamvishnustrini
    padeti mantrairvaishnavagayatrya pranavenoddhulanam kuryat | evam vidhina gopicandanam ca dharayet
    | yastvadhite va sa sarvapatakebhyah puto bhavati | papabuddhistasya na jayate | sa sarveshu tirtheshu
    snato bhavati | sa sarvairyajnairyajito bhavati | sa sarvairdevaih pujyo bhavati | shrimannarayane
    mayyacancala bhaktishca bhavati | sa samyagjnanam ca labdhva vishnusayujyamavapnoti | na ca punaravartate
    na ca punaravartate ityaha bhagavanvasudevah | yastvetadvadhite so'pyevameva bhavatityom satyamityupanishat
    || om apyayantu mamangani vakpranashcakshuh shrotramatho balamidriyani ca || sarvani sarvam brahmopanishadam
    maham brahma nirakuryam ma ma brahma nirakarodanirakaranamastvanirakanam mestu tadatmani nirate ya
    upanishatsu dharmaste mayi santu te mayi santu || om shantih shantih shantih || iti vasudevopanishatsamapta
    ||
  devanagari: ब्राह्माणानां तु सर्वेषां वैदिकानामनुत्तमम् । गोपीचन्दनवारिभ्यामूर्ध्वपुण्ड्रं विधीयते ।
    यो गोपीचन्दनाभावे तुलसीमूलमृत्तिकाम् । मुमुक्षुर्धारयेन्नित्यमपरोक्षात्मसिद्धये । अतिरात्राग्निहोत्रभस्मनाग्नेर्भसितमिदंविष्णुस्त्रीणि
    पदेति मन्त्रैर्वैष्णवगायत्र्या प्रणवेनोद्धूलनं कुर्यात् । एवं विधिना गोपीचन्दनं च धारयेत् । यस्त्वधीते
    वा स सर्वपातकेभ्यः पूतो भवति । पापबुद्धिस्तस्य न जायते । स सर्वेषु तीर्थेषु स्नातो भवति । स सर्वैर्यज्ञैर्याजितो
    भवति । स सर्वैर्देवैः पूज्यो भवति । श्रीमन्नारायणे मय्यचञ्चला भक्तिश्च भवति । स सम्यग्ज्ञानं च लब्ध्वा
    विष्णुसायुज्यमवाप्नोति । न च पुनरावर्तते न च पुनरावर्तते इत्याह भगवान्वासुदेवः । यस्त्वेतद्वाधीते
    सोऽप्येवमेव भवतीत्यों सत्यमित्युपनिषत् ॥ ॐ आप्यायन्तु ममाङ्गानि वाक्प्राणश्चक्षुः श्रोत्रमथो बलमिद्रियाणि
    च ॥ सर्वाणि सर्वं ब्रह्मोपनिषदं माहं ब्रह्म निराकुर्यां मा मा ब्रह्म निराकरोदनिराकरणमस्त्वनिराकणं
    मेस्तु तदात्मनि निरते य उपनिषत्सु धर्मास्ते मयि सन्तु ते मयि सन्तु ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ इति
    वासुदेवोपनिषत्समाप्ता ॥
