id: hiranya-garbha-suktam
category: stotram
name:
  english: Hiranya Garbha Suktam
content:
  english: ssamavartatagre bhutasya jatah patireka asit | sa dadhara prithivi nkasmai devaya havisha vidhema
    || ya atmada balada yasya vishva upasate prashisham ya~sya devah | yasya chayamritam ya~sya mrityuh
    kasmai devaya havisha vidhema || yah pranato nimishato mahitvaika idraja jagato babhuva | ya ishe
    asya dvipadashcatushpadah kasmai devaya havisha vidhema || yasyeme himavanto mahitva yasya samudram
    rasaya sahahuh | yasyemah pradisho yasya bahu kasmai devaya havisha vidhema || yena dyaurugra prithivi
    ca dril ha yena svah stabhitam ye~na nakah | yo antarikshe rajaso vimanah kasmai devaya havisha vidhema
    || nkrandasi avasa tastabhane abhyaiksheta mmanasa rejamane | yatradhi sura udito vibhati kasmai devaya
    havisha vidhema || apo ha yadbrihatirvishvamaya ndadhana janayantiragnim | tato devanam samavartatasurekah
    kasmai devaya havisha vidhema || yashcidapo mahina paryapashyaddaksha ndadhana janayantiryajnam |
    yo deveshvidhi deva eka asitkasmai devaya havisha vidhema || ma no himsijjanita yah prithivya yo va
    divam satyadharma jajana | yashcapashcandra brihatirjajana kasmai devaya havisha vidhema || prajapate
    na tvadetanyanyo vishva jatani pari ta babhuva | yatkamaste juhumastanno astu vayam syama patayo rayinam
    ||
  devanagari: स्सम॑वर्त॒ताग्रे॑ भू॒तस्य॑ जा॒तः पति॒रेक॑ आसीत् । स दा॑धार पृथि॒वी ङ्कस्मै॑ दे॒वाय॑ ह॒विषा॑
    विधेम ॥ य आ॑त्म॒दा ब॑ल॒दा यस्य॒ विश्व॑ उ॒पास॑ते प्र॒शिषं॒ यँस्य॑ दे॒वाः । यस्य॑ छा॒यामृतं॒ यँस्य॑
    मृ॒त्युः कस्मै॑ दे॒वाय॑ ह॒विषा॑ विधेम ॥ यः प्रा॑ण॒तो नि॑मिष॒तो म॑हि॒त्वैक॒ इद्राजा॒ जग॑तो ब॒भूव॑ ।
    य ईशे॑ अ॒स्य द्वि॒पद॒श्चतु॑ष्पदः॒ कस्मै॑ दे॒वाय॑ ह॒विषा॑ विधेम ॥ यस्ये॒मे हि॒मव॑न्तो महि॒त्वा यस्य॑
    समु॒द्रं र॒सया॑ स॒हाहुः । यस्ये॒माः प्र॒दिशो॒ यस्य॑ बा॒हू कस्मै॑ दे॒वाय॑ ह॒विषा॑ विधेम ॥ येन॒ द्यौरु॒ग्रा
    पृ॑थि॒वी च॑ दृ॒ल् हा येन॒ स्वः॑ स्तभि॒तं येँन॒ नाकः॑ । यो अ॒न्तरि॑क्षे॒ रज॑सो वि॒मानः॒ कस्मै॑ दे॒वाय॑
    ह॒विषा॑ विधेम ॥ ङ्क्रन्द॑सी॒ अव॑सा तस्तभा॒ने अ॒भ्यैक्षे॑ता॒ म्मन॑सा॒ रेज॑माने । यत्राधि॒ सूर॒ उदि॑तो
    वि॒भाति॒ कस्मै॑ दे॒वाय॑ ह॒विषा॑ विधेम ॥ आपो॑ ह॒ यद्बृ॑ह॒तीर्विश्व॒माय॒ न्दधा॑ना ज॒नय॑न्तीर॒ग्निम्
    । ततो॑ दे॒वानां॒ सम॑वर्त॒तासु॒रेकः॒ कस्मै॑ दे॒वाय॑ ह॒विषा॑ विधेम ॥ यश्चि॒दापो॑ महि॒ना प॒र्यप॑श्य॒द्दक्ष॒
    न्दधा॑ना ज॒नय॑न्तीर्य॒ज्ञम् । यो दे॒वेष्विधि॑ दे॒व एक॒ आसी॒त्कस्मै॑ दे॒वाय॑ ह॒विषा॑ विधेम ॥ मा नो॑
    हिंसीज्जनि॒ता यः पृ॑थि॒व्या यो वा॒ दिवं॑ स॒त्यध॑र्मा ज॒जान॑ । यश्चा॒पश्च॒न्द्रा बृ॑ह॒तीर्ज॒जान॒ कस्मै॑
    दे॒वाय॑ ह॒विषा॑ विधेम ॥ प्रजा॑पते॒ न त्वदे॒तान्य॒न्यो विश्वा॑ जा॒तानि॒ परि॒ ता ब॑भूव । यत्का॑मास्ते
    जुहु॒मस्तन्नो॑ अस्तु व॒यं स्या॑म॒ पत॑यो रयी॒णाम् ॥
