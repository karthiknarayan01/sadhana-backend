id: chedanagarakshetramdevapancakastotram
category: raksha
name:
  english: chedanagarakshetramdevapancakastotram
  devanagari: छेदानगरक्षेत्रंदेवपन्चकस्तोत्रम्
content:
  english: chedanagarakshetram devapancakastotram subrahmanyakshetram navyam nanopadevasanjushtham | bahutalasaudhasyopari
    kalpitamabhati shilpasarvasvam || 1|| ashtottarashatasankhyaih sopanena yatra sannidhemrmargah | parshvadvaye'pi
    yasya prakashate'nalpashilpasaundaryam || 2|| arohanavarohanamargo'yam bhaktasankhasankirnah | suvyaktam
    nagarikashraddhabhaktisphutam prakashayati || 3|| vrityartham yatamanah bhautikavishayeshu santatam
    saktah | manasamurjam shantim cinvanti jana dine dine yatra || 4|| sayam pratashcaitat kshetram savisheshapavanam
    bhavati | abhishekairaratibhirvaidikaghoshaistathaiva pujabhih || 5|| pravahati bhaktagalebhyo nirgalita
    namavaikhariganga | yatra snatva shrotram nrinanca cittam pavitam bhavati || 6|| narayaniyagitabhagavatadini
    suktiratnani | parayanaprabhashanagocaratam yanti bhurisho yatra || 7|| kshetrankane vishale pradakshinyam
    vidhaya bhaktajanah | nanopadevadarshanapunyam sampadayanti sanandam || 8|| ramaniyacandrashalakalpe'tra
    samagataihrmadayavadbhih | parito nagari lakshmidrdashya kshetrasya mauktikimala || 9|| chedanagaridevyah
    phalatale bhasamanamamalataram | sundarasinduramayam tilakamidam devamandiram jayati || 10|| tadidam
    pancakantarvikasadbhaktyadaradhridayena | samstuyate maya
  devanagari: छेदानगरक्षेत्रं देवपञ्चकस्तोत्रम् सुब्रह्मण्यक्षेत्रं नव्यं नानोपदेवसञ्जुष्ठम् । बहुतलसौधस्योपरि
    कल्पितमाभाति शिल्पसर्वस्वम् ॥ १॥ अष्टोत्तरशतसङ्ख्यैः सोपानेन यत्र सन्निधेम्र्मार्गः । पार्श्वद्वयेऽपि
    यस्य प्रकाशतेऽनल्पशिल्पसौन्दर्यम् ॥ २॥ आरोहणावरोहणमार्गोऽयं भक्तसङ्खसङ्कीर्णः । सुव्यक्तं नागरिकश्रद्धाभक्तीस्फुटं
    प्रकाशयति ॥ ३॥ वृत्यर्थं यतमानाः भौतिकविषयेषु सन्ततं सक्तः । मानसमूर्जं शान्तिं चिन्वन्ति जना दिने
    दिने यत्र ॥ ४॥ सायं प्रातश्चैतत् क्षेत्रं सविशेषपावनं भवति । अभिषेकैरारतिभिर्वैदिकघोषैस्तथैव पूजाभिः
    ॥ ५॥ प्रवहति भक्तगलेभ्यो निर्गलिता नामवैखरीगङ्गा । यत्र स्नात्वा श्रोत्रं नृणाञ्च चित्तं पावितं भवति
    ॥ ६॥ नारायणीयगीताभागवतादीनि सूक्तिरत्नानि । पारायणप्रभाषणगोचरतां यान्ति भूरिशो यत्र ॥ ७॥ क्षेत्राङ्कणे
    विशाले प्रादक्षिण्यं विधाय भक्तजनाः । नानोपदेवदर्शनपुण्यं सम्पादयन्ति सानन्दम् ॥ ८॥ रमणीयचन्द्रशालाकल्पेऽत्र
    समागतैह्र्मदयवद्भिः । परितो नगरी लक्ष्मीद्र्दश्या क्षेत्रस्य मौक्तिकीमाला ॥ ९॥ छेदानगरीदेव्याः फालतले
    भासमानममलतरम् । सुन्दरसिन्दूरमयं तिलकमिदं देवमन्दिरं जयति ॥ १०॥ तदिदं पञ्चकन्तर्विकसद्भक्त्यादरधृदयेन
    । संस्तूयते मया
