id: kyta-5-pravargya-brahmanam-krishna-yajurveda-taittiriya-aranyaka-patha-deva-vai-satramasata
category: stotram
name:
  english: KYTA 5 Pravargya Brahmanam - Krishna Yajurveda Taittiriya Aranyaka Patha - Deva Vai Satramasata
content:
  english: krishna yajurvediya taittiriya aranyake pancamah prapathakah pravargya brahmanam o shri gurubhyo
    namah | harih om || anuvakam deva vai satramasata | riddhiparimitam ~yashaskamah | te 'bruvann | yannah
    prathamam ya~sha ricchat | sarvesha thsahasaditi | tesha ve~dirasit | tasyai khandavo dakshinardha
    asit | turghnamuttarardhah | parinajjaghanardhah | marava utkarah || ya~sha arcchat | tannyakamayata
    | tenapa ndeva anvayann | yasho 'varuruthsamanah | tasyanvagatasya | savyaddhanurajayata | dakshinadishavah
    | tasmadishudhanva mpunyajanma | yajnajanma hi || m | bahavo nabhyadhrishnuvann | tasmadekamishudhanvina
    'nishudhanva nabhidhrishnuvanti | so shishuriti | tasya sishmiyanasya tejo ddeva oshadhishu nyamrijuh
    | te shyamaka abhavann | smayaka vai namaite || smayakatvam | tasma ddikshitenapigrihya smetavya |
    sa dhanuh pratishkabhyatishthat | ta upadika abruvan varam ~vrinamahai | atha va imagm randhayama
    | yatra kva ca khanama | tadapo 'bhitrinadameti | tasmadupadika yatra kva ca khananti | tadapo ||
    varevritagg hyasam | tasya jyamapyadann | tasya dhanurvipravamanagm shira udavartayat | ta ddyavaprithivi
    anupravartata | ya tpravargyasya pravargyatvam | yadghra~ ityapatat | taddharmasya gharmatvam | mahato
    viryamapaptaditi | ta nmahavirasya mahaviratvam || thsamrajnah samrattvam | tagg stredha vyagrihnata
    | agnih pratassavanam | indro maddhyandinagm savanam | vishve devastritiyasavanam | tenapashir shna
    yajnena yajamanah | nashisho 'varundhata | na suvargam lo~kamabhyajayann | te deva ashvinavabruvann
    || || bhishajau vai sthah | idam ya~jnasya shirah pratidhattamiti | tavabrutam va~ram ~vrinavahai
    | graha eva navatrapi grihyatamiti | tabhya magrihnann | taveta dyajnasya shirah pratyadhattam | ya
    tpravargyah | tena sashi shna yajnena yajamanah | avashisho 'rundhata | abhi suvargam mpravrinakti
    | yajnasyaiva tacchirah pratidadhati | tena sashi shna yajnena yajamanah | avashisho rundhe | abhi
    suvargam njayati | tasmadesha a shvinapravaya iva | ya tyai | caturgrihitena juhoti | catushpadah
    pashavah | pashunevavarundhe | catasro dishah | dikshveva pratitishthati | chandagmsi devebhyo va~kshyama
    iti | tebhya eta madharayann | puronuvakyayai yajyayai || || devatayai vashatkaraya | yaccaturgrihita
    njuhoti | chandagsyeva ta tprinati | tanyasya pritani devebhyo havyam va~hanti | brahmavadino vadanti
    | hotavya ndikshitasya griha kshitah | yajjuhuyat | havishkritam ya~jamanamagnau pradaddhyat | yanna
    juhuyat || || yajnaparurantariyat | yajureva vadet | na havishkritam ya~jamanamagnau pradadhati |
    na yajnaparurantareti | gayatri chandagsyatyamanyata | tasyai vashatkaro 'patat | prithivimardhah
    pravishat | pashunardhah | yah prithivi 'bhavat | yah pashun | so 'jam | yatkhadiryabhri rbhavati
    | chandasameva rasena yajnasya shira ssambharati | yadaudumbari | urgva udumbarah | urjaiva yajnasya
    shira dvainavi | tejo vai venuh || || tejasaiva yajnasya shira dvaikankati | bha evavarundhe | devasya
    tva savituh prasava ityabhrimadatte prasu rbahubhyamityaha | ashvinau hi devanamaddhvaryu asta | vajra
    iva va esha | yadabhrih | abhrirasi narirasityaha shantyai ddevebhya ityaha | yajno va addhvarah |
    yajnakri ddevebhya iti vavaitadaha | uttishtha brahmanaspata ityaha | brahmanaiva yajnasya shiro 'cchaiti
    | praitu brahmanaspatirityaha | pretyaiva yajnasya shiro 'cchaiti | pra devyetu sunritetyaha | yajno
    vai sunrita | accha virannarya mpanktiradhasamityaha || || pankto hi yajnah | deva yajnannayantu na
    ityaha | devaneva yajnaniyah kurute | devi dyavaprithivi anu me magmsathamityaha | abhyamevanumato
    yajnasya shira ssambharati | riddhyasamadya makhasya shira ityaha | yajno vai makhah | riddhyasamadya
    yajnasya shira iti vavaitadaha | makhaya tva makhasya tva shir shna ityaha | nirdishyaivainaddharati
    || harati | traya ime lokah | ebhya eva lokebhyo yajnasya shira ssambharati | tushni ncaturthagm harati
    | aparimitadeva yajnasya shira ssambharati | mritkhanadagre harati | tasma nmritkhanah karunyatamah
    | iyatyagra asirityaha | asyamevachambatkaram ssambharati | urjam ~va etagm rasa mprithivya upadika
    uddihanti || dvalmikavapa sambharo bhavati | urjameva rasa mprithivya avarundhe | atho shrotrameva
    | shrotragg hyeta dvalmikah | abadhiro bhavati | ya evam ve~da | indro vritraya vajramudayacchat |
    sa yatrayatra parakramata || || tannaddhriyata | sa putikastambe para vai~ me dha iti | tadutikana
    mutikatvam | yadutika bhavanti | yajnayaivoti ndadhati | agnija asi prajapate reta ityaha | ya eva
    rasah pashu || tamevavarundhe | pancaite sambhara bhavanti | pankto yajnah | yavaneva yajnah | tasya
    shira ssambharati | yadgramyana mpashunancarmana sambhare 'rpayet | krishnajinena sambharati | aranyaneva
    pashunchuca mprajayamananam || || aranyah pashavah kaniyagmsah | shuca hyritah | lomata ssambharati
    | ato hyasya meddhya m | parigrihya yanti | rakshasamapahatyai | bahavo haranti | apacitimevasmi ndadhati
    | uddhate sikatopopte parishrite nidadhati shantyai | madantibhirupa srijati || ndadhati | madhu tva
    madhula karotvityaha | brahmanaivasmin tejo dadhati | yadgramyana ssagmsrijet | gramyani patrani shuca
    'rpayet | armakapalai ssagmsrijati | etani va anupajivaniyani | tanyeva shuca 'rpayati | sharkarabhi
    ssagmsrijati dhrityai | atho shantvaya | ajalomai ssagmsrijati | esha va agneh priya tanuh | yadaja
    | priyayaivaina ntanuva sagmsrijati | atho tejasa | krishnajinasya lomabhi ssagmsrijati | yajno vai
    krishnajinam | yajnenaiva yajnagm sagmsrijati || panktiradhasamityaha parishrite karoti | brahmavarcasasya
    parigrihityai | na kurvannabhi pra tkurvannabhi pranyat | prananchuca 'rpayet | apahaya praniti |
    pranana ngopithaya | na pravargyam cantareyat | yadantareyat | dushcarma || tasmannantarayya m | atmano
    gopithaya | venuna karoti | tejo vai venuh | tejah pravargyah | tejasaiva teja ssamardhayati | makhasya
    shiro 'sityaha | yajno vai makhah | tasyaitacchirah | ya || tasmadevamaha | yajnasya pade stha ityaha
    | yajnasya hyete pade | atho pratishthityai | gayatrena tva chandasa karomityaha | chandobhirevaina
    nkaroti | tryuddhi nkaroti | traya ime lokah | esham ~lokanamaptyai || viryam ~vai chandagmsi | viryenaivaina
    nkaroti | yajusha bila nkaroti vyavriyai | iyanta nkaroti | prajapatina yajnamukhena sammitam | iyanta
    nkaroti | yajnaparusha sammitam | iyanta nkaroti | etavadvai purushe virya m | viryasammitam || nkaroti
    | aparimitasyavaruddhyai | parigriva | suryasya harasa shrayetyaha | yathayajurevaitat | ashvashakena
    dhupayati | prajapatyo va ashvah sayonitvaya | vrishno ashvasya nishpadasityaha | asau va adityo vrisha
    'shvah | tasya chandagmsi nishpat || tva shocishe tvetyaha | teja evasmi 'bhiddhah | maitriyopaiti
    shantyai | siddhyai tvetyaha | yathayajurevaitat | devastva savitodvapatvityaha | savitriprasuta evaina
    mbrahmana devatabhirudvapati | apadyamanah prithivyamasha disha aprinetyaha || 'nu vibhati | uttishtha
    brihan bhavordhvastishtha dhruvastvamityaha pratishthityai | ishvaro va esho 'ndho bhavitoh | yah
    pravargyamanvikshate | suryasya tva cakshusha ksha ityaha | cakshusho gopithaya | rijave tva sukshityai
    tva bhutyai tvetyaha | iyam va~ rijuh | antarikshagm sadhu | asau sukshitih || || disho bhutih | imanevasmai
    lokan kalpayati | atho pratishthityai | ida mamumamushyayanam ~visha pashubhi rbrahmavarcasena paryuhamityaha
    | vishaivaina rbrahmavarcasena paryuhati | visheti rajanyasya bruyat | vishaivaina mparyuhati | pashubhiriti
    vaishyasya | pashubhirevaina mparyuhati | asurya || acchrinatti | devatra 'kah | ajakshirenacchrinatti
    | paramam tpayah | yadajakshiram | paramenaivaina ''cchrinatti | yajusha vyavrittyai | chandobhiracchrinatti
    | chandobhirva esha kriyate | chandobhireva chandagsyacchrinatti | chrindhi vacamityaha | vacamevavarundhe
    | chrindhyurjamityaha | urjamevavarundhe | chrindhi havirityaha | havirevakah | deva purashcara saghyasantvetyaha
    | yathayajurevaitat || chandagmsi nishpat chandagsyacchrina ttyashtau ca npracarishyamo hota rgharmamabhishtuhityaha
    | esha va etar hi brihaspatih | yadbrahma | tasma eva pratiprocya pracarati | atmano rtyai | yamaya
    tva makhaya tvetyaha | eta va etasya devatah | tabhirevainagm samardhayati | madantibhih prokshati
    | teja evasmi mprokshati | abhipurva tejo dadhati | trih prokshati | tryavriddhi yajnah | atho meddhyatvaya
    | hota 'nvaha | rakshasamapahatyai | anavanam | prananagm santatyai | trishtubhah sati rgayatririvanvaha
    || || gayatro hi pranah | pranameva yajamane dadhati | santatamanvaha | prananamannadyasya santatyai
    | atho rakshasamapahatyai | ya tparimita anubruyat | parimitamavarundhita | aparimita anvaha | aparimitasyavaruddhyai
    | shiro va eta tpravargyah | umrmunjah nmaunjo vedo bhavati | urjaiva yajnasya shira ssamardhayati
    | pranahuti rjuhoti | prananeva yajamane dadhati | sapta juhoti | sapta vai shir pranah | prananevasmi
    ndadhati | devastva savita maddhva || tejasaivainamanakti | prithivi ntapasastrayasveti hiranyamupa
    syati | asya anatidahaya | shiro va eta tpravargyah | agni | pralavanadipyopa sveva yajnasya shirah
    pratidadhati | apratishirnagra || arcirasi shocirasityaha | teja evasmi ndadhati | sagmsidasva mahagm
    asityaha | mahan hyeshah | brahmavadino vadanti | ete vava ta ritvijah | ye dar | atha katha hota
    yajamanayashisho nasha sta iti | purastadashih khalu va anyo yajnah | uparishtadashiranyah || || anadhrishya
    purastaditi yadetani yajugshyaha | shirshata eva yajnasya yajamana ashisho 'varundhe | ayuh purastadaha
    | praja ndakshinatah | prana mpashcat | shrotramuttaratah | vidhritimuparishtat | prananevasmai samico
    dadhati | ishvaro va esha disho 'nunmaditoh | yandisho 'nu vyasthapayanti || 'si bhuriputretima vai~
    manorashva bhuriputra | asyameva pratitishthatyanunmadaya | supasada me bhuya ma ma higmsirityahahigmsayai
    | citah stha paricita ityaha | apacitimevasmi ndadhati | shiro va eta tpravargyah | asau khalu va
    adityah pravargyah | tasya maruto rashmayah || || svaha marudbhih parishrayasvetyaha | amumevadityagm
    rashmibhih paryuhati | tasma 'mushmin ~loke rashmibhih paryudhah | tasma draja visha paryudhah | tasma
    ssajataih paryudhah | agne ssrishtasya yatah | vikankata dvaikankatah paridhayo bhavanti | bha evavarundhe
    | dvadasha bhavanti || va~thsaramevavarundhe | asti trayodasho masa ityahuh | ya ttrayodashah paridhirbhavati
    | tenaiva trayodasha mmasamavarundhe | antarikshasyanta rdhirasityaha vyavrittyai | diva ddhiranyamadhi
    nidadhati | amushya anatidahaya | atho abhyamevainamubhayatah parigrihnati | ar shi sayakani dhanvetyaha
    || || stautyevainametat | gayatramasi traishtubhamasi jagatamasiti dhavitranyadatte | chandobhirevainanyadatte
    | madhu maddhviti dhunoti | prano vai madhu | pranameva yajamane dadhati | trih pariyanti | trivriddhi
    pranah | trih pariyanti | tryavriddhi yajnah || || atho rakshasamapahatyai | trih punah pariyanti
    | shat thsampadyante | shadva ritavah | ritushveva pratitishthanti | yo vai gharmasya priyan tanuvamakramati
    | dushcarma vai sa bhavati | esha ha va asya priya ntanuvamakramati | ya strih paritya caturtha mparyeti
    | etagm ha va asyogradevo rajaniracakrama || || tato vai sa dushcarma ttrih paritya na caturtha mpariyat
    | atmano gopithaya | prana vai dhavitrani | avyatishanga ndhunvanti | pranana mavyatishangaya klriptyai
    | vinishadya dhunvanti | dikshveva pratitishthanti | urdhvandhu nvanti | suvargasya lokasya samashtyai
    | sarvato dhunvanti | tasmadayagm sarvatah pavate || uparishtadashiranyo agnishtva vasubhih purasta
    drocayatu gayatrena chandasetyaha | agnirevainam drocayati gayatrena chandasa | sa ma rucito rocayetyaha
    | ashishamevaitamasha ste | indrastva rudrai rdakshinato rocayatu traishtubhena chandasetyaha | indra
    evainagm rudrai rdakshinato rocayati traishtubhena chandasa | sa ma rucito rocayetyaha | ashishamevaitamasha
    drocayatu jagatena chandasetyaha | varuna evainamadityaih pashca drocayati jagatena chandasa || ||
    sa ma rucito rocayetyaha | ashishamevaitamasha ste | dyutanastva maruto marudbhiruttarato rocayatvanushtubhena
    chandasetyaha | dyutana evaina mmaruto marudbhiruttarato rocayatyanushtubhena chandasa | sa ma rucito
    rocayetyaha | ashishamevaitamasha ste | brihaspatistva vishvai drocayatu panktena chandasetyaha |
    brihaspatirevainam ~vishvai drocayati panktena chandasa | sa ma rucito rocayetyaha | ashishamevaitamasha
    ndeva gharma deveshvasityaha | rocito hyesha deveshu | rocishiyaha shvityaha | rocata evaisha manushyeshu
    | samra ndeveshvayushmag stejasvi brahmavarcasyasityaha | rucito hyesha deveshvayushmag stejasvi brahmavarcasi
    | rucito stejasvi brahmavarcasi bhuyasamityaha | rucita evaisha manushye stejasvi brahmavarcasi bhavati
    | rugasi ruca mmayi dhehi mayi rugityaha | ashishamevaitamasha ryajurbhirarocayitva | rucito gharma
    iti prabruyat | arocuko ssyat | arocuko yajamanah | atha yadenametairyajurbhi rocayitva | rucito gharma
    iti praha | rocuko rbhavati | rocuko yajamanah || drocayati jagatena chandasa panktena chandasa sa
    ma rucito rocayetyahashishamevaitamasha tpravargyah | griva upasadah | purastadupasada mpravrinakti
    | grivasveva yajnasya shirah pratidadhati | trih pravrinakti | traya ime lokah | ebhya eva lokebhyo
    yajnasya shiro thsampadyante | shadva ritavah || || ritubhya eva yajnasya shiro 'varundhe | dvadasha
    kritvah pravrinakti | dvadasha masa va~thsaradeva yajnasya shiro 'varundhe | caturvigmshati ssampadyante
    | caturvigmshatirardhamasah | ardhamasebhya eva yajnasya shiro 'varundhe | atho khalu | sakrideva
    pravrijyah | ekagm hi shirah || || agnishtome pravrinakti | etavan vai yajnah | yavanagnishtomah |
    yavaneva yajnah | tasya shirah pratidadhati | nokthye pravrinjyat | praja vai pashava ukthani | yadukthye
    pravrinjyat | praja mpashunasya nirdahet | vishvajiti sarvaprishthe pravrinakti || || prishthani va
    acyutancyavayanti | prishthairevasma acyutancyavayitva ngopamityaha | prano vai gopah | pranameva
    prajasu viyatayati | apashya ngopamityaha | asau va adityo gopah | sa himah praja gopayati | tameva
    prajana nkurute | anipadyamanamityaha || || na hyesha nipadyate | a ca para ca pathibhishcarantamityaha
    | a ca hyesha para ca pathibhishcarati | sa saddhrici ssa vishucirvasana ityaha | saddhrici shca hyesha
    vishucishca vasanah praja abhi vipashyati | a varivarti bhuvaneshvantarityaha | a hyesha varivarti
    bhuvaneshvantah | atra pravirmadhu maddhvi mmadhu madhucibhyamityaha | vasantikavevasma ritu kalpayati
    | samagniragnina gatetyaha || || graishmavevasma ritu kalpayati | samagniragnina gatetyaha | agnir
    'gnina sangacchate | svaha samagnistapasa gatetyaha | purvamevoditam | uttarenabhigrinati | dharta
    divo vibhasi rajasah prithivya ityaha | var shikavevasma ritu kalpayati | hride tva manase tvetyaha
    | sharadavevasma ritu kalpayati || || divi deveshu hotra yacchetyaha | hotrabhireveman ~lokan ndadhati
    | vishvasa mpata ityaha | haimantikavevasma ritu kalpayati | devashrustva npahityaha | shaishiravevasma
    ritu kalpayati | tapojam va~camasme niyaccha devayuvamityaha | ya vai meddhya vak | sa tapojah | tamevavarundhe
    || || garbho devanamityaha | garbho hyesha devana m | pita matinamityaha | praja vai matayah | tasamesha
    eva pita | ya tpravargyah | tasmadevamaha | patih prajanamityaha | patir m | matih kavinamityaha ||
    hyesha kavinam | sa ndevo devena savitra 'yatishta sagm suryenaruktetyaha | amuncaivaditya mpravargyanca
    sagmsha sti | ayurdastvamasmabhya ngharma varcoda asityaha | ashishamevaitamasha 'si pita no bodhetyaha
    | bodhayatyevaina 'vakasha bhavanti | patniyai dashamah | nava vai purushe pranah || || nabhirdashami
    | prananeva yajamane dadhati | atho dasha kshara virat | annam vi~rat | virajaivannadyamavarundhe
    | yajnasya shiro ddeva hotrabhih pratyadadhuh | ritvijo kshante | eta vai hotrah | hotrabhireva yajnasya
    shirah pratidadhati || kshante | rucitadvai prajapatih praja asrijata | prajanagm srishtyai kshante
    | rucitadvai parjanyo var shukah parjanyo bhavati | sa mpraja edhante | rucitamave kshante | rucitam
    ~vai brahmavarcasam | brahmavarcasino bhavanti || kshante | sarvamayuryanti | na patnyave tpantyaveksheta
    | prajayeta | prajantvasyai nirdahet | yannaveksheta | na prajayeta | nasyai prajannirdahet | tiraskritya
    yaju rvacayati | prajayate | nasyai prajannirdahati | tvashtimati te sapeyetyaha | sapaddhi prajah
    prajayante || sarvaprishthe pravrina ktyanipadyamanamityaha sharadavevasma ritu kalpayati devasya
    tva savituh prasava iti rashanamadatte prasu rbahubhyamityaha | ashvinau hi devanamaddhvaryu asta
    bhyamityaha yatyai 'sityaha yajushkrityai | ida ehyadita ehi sarasvatyehityaha | etani va asyai devanamani
    | devanamairevaina mahvayati | asavehya savehityaha | etani va asyai manushyanamani || || manushyanamairevainamahvayati
    | shat thsampadyante | shadva ritavah | ritubhirevainamahvayati | aditya ushnishamasityaha | yathayajurevaitat
    | vayurasyaida ityaha | vayudevatyo vai vathsah | pusha tvopavasrijatvityaha | paushna vai devataya
    pashavah || ndevatayopavasrijati | ashvibhya mpradapayetyaha | ashvinau vai devana | tabhyamevasmai
    bheshaja nkaroti | yaste stanah shashaya ityaha | stautyevaina m | usra gharmagm shigmshosra gharma
    mpahi gharmaya shigmshetyaha | yatha bruyadamushmai dehiti | tadrigeva tat | brihaspatistvopasidatvityaha
    || || brahma vai devana mbrihaspatih | brahmanaivainamupasidati | danava sstha perava ityaha | meddhyanevaina
    nkaroti | vishvagvrito lohitenetyaha vyavrittyai | ashvibhya mpinvasva sarasvatyai pinvasva pushne
    pinvasva brihaspataye pinvasvetyaha | etabhyo hyesha devata bhyah pinvate | indraya pinvasvendraya
    pinvasvetyaha | indrameva bhagadheyena samardhayati | dvirindrayetyaha || || tasmadindro devatana
    mbhuyishthabhaktamah | gayatro 'si jagatamasiti shaphopayamanadatte | chandobhirevainanadatte | sahorjo
    bhagenopamehityaha | urja evaina mbhagamakah | ashvinau va eta dyajnasya shirah pratidadhatavabrutam
    | avabhyameva purva va~shatkriyata iti | indra ssaraghasyetyaha | ashvibhyameva purva va~shatkaroti
    | atho ashvinaveva bhagadheyena samardhayati || mpata vasavo yajata vadityaha | vasuneva bhagadheyena
    samardhayati | ya dvashatkuryat | yatayama t | yanna vashatkuryat | rakshagmsi yajnagm hanyuh | vadityaha
    | parokshameva vashatkaroti | nasya yatayama vashatkaro bhavati | na yajnagm rakshagmsi ghnanti ||
    tva suryasya rashmaye vrishtivanaye juhomityaha | yo va asya punyo rashmih | sa vrishtivanih | tasma
    evaina njuhoti | madhu havirasityaha | svadayatyevaina m | suryasya tapastapetyaha | yathayajurevaitat
    | dyavaprithivibhya ntva parigrihnamityaha | dyavaprithivibhya || antarikshena tvopayacchamityaha
    | antarikshenaivaina mupayacchati | na va eta mmanushyo bhartumar ntva pitrinamanumato bhartugm shakeyamityaha
    | devairevaina mpitribhiranumata adatte | vi va enametadardhayanti | ya tpravrijya puro juhvati |
    tejo 'nu prehityaha | teja evasmi ndadhati | divisprimma ma higmsi rantarikshasprimma ma higmsih prithivisprimma
