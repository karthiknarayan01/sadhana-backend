id: om-dyauh-shanti
category: shanti_mantra
name:
  english: Om Dyauh Shanti
  devanagari: ॐ द्यौः शान्तिः
content:
  english: >-
    om dyauh shantir antariksham shantih, prithivi shantir apah shantir
    oshadhayah shantih, vanaspatayah shantir vishvedevah shantir brahma
    shantih, sarvam shantih shantir eva shantih sa ma shantiredhi, om
    shantih shantih shantih
  devanagari: >-
    ॐ द्यौः शान्तिरन्तरिक्षं शान्तिः पृथिवी शान्तिरापः
    शान्तिरोषधयः शान्तिः । वनस्पतयः शान्तिर्विश्वेदेवाः
    शान्तिर्ब्रह्म शान्तिः सर्वं शान्तिः शान्तिरेव शान्तिः सा मा
    शान्तिरेधि ॥ ॐ शान्तिः शान्तिः शान्तिः ॥
meaning:
  english: >-
    Peace in the sky, peace in the atmosphere, peace on earth, peace in
    the waters, in plants, in the trees, in all the gods, in the
    absolute — may that peace come to me. A comprehensive invocation of
    peace across every part of creation.
source_attribution:
  text_source: Traditional Vedic shanti mantra, Yajur Veda tradition
  translation_source: Original paraphrase written for Sadhana
  license: original_translation
