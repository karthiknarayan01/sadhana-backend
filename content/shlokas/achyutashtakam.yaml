id: achyutashtakam
category: stotram
name:
  english: Achyutashtakam
content:
  english: acyutam keshavam ramanarayanam krishnadamodaram vasudevam harim | shridharam madhavam gopika
    vallabham janakinayakam ramacandram bhaje || || acyutam keshavam satyabhamadhavam madhavam shridharam
    radhika radhitam | indiramandiram cetasa sundaram devakinandanam nandajam sandadhe || vishnave jishnave
    shankane cakrine rukmini ragine janaki janaye | vallavi vallabhayarcita yatmane kamsa vidhvamsine
    vamshine te namah || || krishna govinda he rama narayana shripate vasudevajita shrinidhe | acyutananta
    he madhavadhokshaja dvarakanayaka draupadirakshaka || || rakshasa kshobhitah sitaya shobhito dandakaranyabhu
    punyatakaranah | lakshmanonanvito vanaraih sevito agastya sampujito raghavah patu mam || dhenukarishtako'nishtakriddveshinam
    keshiha kamsahridvanshikavadakah | putanakopakah surajakhelano balagopalakah patu mam sarvada || ||
    vidyududyotavatprasphuradvasasam pravridambhodavatprollasadvigraham | vanyaya malaya shobhitorahsthalam
    lohitanghridvayam varijaksham bhaje || || kuncitaih kuntalai bhrajamanananam ratnamaulim lasat kundalam
    gandayoh | harakeyurakam kankana projjvalam kinkini manjulam shyamalam tam bhaje || acyutasyashtakam
    yah pathedishtadam prematah pratyaham purushah saspriham | vrittatah sundaram kartri vishvambharah
    tasya vashyo hari rjayate satvaram || acyutam keshavam ramanarayanam krishnadamodaram vasudevam harim
    | shridharam madhavam gopika vallabham janakinayakam ramacandram bhaje || | || iti shrishankaracaryaviracitamacyutashtakam
    sampurnam ||
  devanagari: अच्युतं केशवं रामनारायणं कृष्णदामोदरं वासुदेवं हरिम् । श्रीधरं माधवं गोपिका वल्लभं जानकीनायकं
    रामचन्द्रं भजे ॥ ॥ अच्युतं केशवं सत्यभामाधवं माधवं श्रीधरं राधिका राधितम् । इन्दिरामन्दिरं चेतसा सुन्दरं
    देवकीनन्दनं नन्दजं सन्दधे ॥ विष्णवे जिष्णवे शङ्कने चक्रिणे रुक्मिणी रागिणे जानकी जानये । वल्लवी वल्लभायार्चिता
    यात्मने कंस विध्वंसिने वंशिने ते नमः ॥ ॥ कृष्ण गोविन्द हे राम नारायण श्रीपते वासुदेवाजित श्रीनिधे
    । अच्युतानन्त हे माधवाधोक्षज द्वारकानायक द्रौपदीरक्षक ॥ ॥ राक्षस क्षोभितः सीतया शोभितो दण्डकारण्यभू
    पुण्यताकारणः । लक्ष्मणोनान्वितो वानरैः सेवितो अगस्त्य सम्पूजितो राघवः पातु माम् ॥ धेनुकारिष्टकोऽनिष्टकृद्द्वेषिणां
    केशिहा कंसहृद्वण्शिकावादकः । पूतनाकोपकः सूरजाखेलनो बालगोपालकः पातु मां सर्वदा ॥ ॥ विद्युदुद्योतवत्प्रस्फुरद्वाससं
    प्रावृडम्भोदवत्प्रोल्लसद्विग्रहम् । वन्यया मालया शोभितोरःस्थलं लोहिताङ्घ्रिद्वयं वारिजाक्षं भजे ॥
    ॥ कुञ्चितैः कुन्तलै भ्राजमानाननं रत्नमौलिं लसत् कुण्डलं गण्डयोः । हारकेयूरकं कङ्कण प्रोज्ज्वलं किङ्किणी
    मञ्जुलं श्यामलं तं भजे ॥ अच्युतस्याष्टकं यः पठेदिष्टदं प्रेमतः प्रत्यहं पूरुषः सस्पृहम् । वृत्ततः
    सुन्दरं कर्तृ विश्वम्भरः तस्य वश्यो हरि र्जायते सत्वरम् ॥ अच्युतं केशवं रामनारायणं कृष्णदामोदरं वासुदेवं
    हरिम् । श्रीधरं माधवं गोपिका वल्लभं जानकीनायकं रामचन्द्रं भजे ॥ । ॥ इति श्रीशङ्कराचार्यविरचितमच्युताष्टकं
    सम्पूर्णम् ॥
