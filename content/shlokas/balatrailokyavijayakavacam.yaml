id: balatrailokyavijayakavacam
category: kavacha
name:
  english: balatrailokyavijayakavacam
  devanagari: बालात्रैलोक्यविजयकवचम्
content:
  english: 13|| rishih syaddakshinamurtih panktishchanda udahritah | bala sarasvati devi devata tryakshari
    smrita || 14|| bijam tu vagbhavam proktam shaktih shaktirudahrita | kilakam kamarajam tu phadashabandhanam
    tatha | bhogapavargasiddhyartham viniyogah prakirtitah || 15|| akulakulamayanti cakramadhye sphuranti
    madhuramadhu pibanti kantakan bhakshayanti | duratimapaharanti sadhakan poshayanti jayatu jayatu bala
    sundari kridayanti || aim bijam me shirah patu klim bijam bhrukutim mama | sauh bhalam patu me bala
    aim klim sauh nayane mama || 1|| am am im im shruti patu bala pancakshari mama | um um rim rim sada
    patu mama nasaputadvayam || 2|| lim lim em aim patu gandau aim klim sauh tripurambika | om aum am
    ah mukham patu sauh klim aim tripureshvari || 3|| kam kham gam gham dam karau me sauh klim aim bhagamalini
    | cam cham ja jham nam me patu bahu sauh sarvasiddhida || 4|| tam tham dam dham nam me patu vakshah
    klim viranayika | tam tham dam dham nam me patu aim kukshau kulanayika || 5|| pam pham bam bham mam
    me patu parshvau paramasundari | yam ram lam vam patu prishtham sauh klim aim vishvamatrika || 6||
    sham sham sam ham patu nabhim sauh sauh sauh trigunatmika | lam ksham katim sada patu klim klim klim
    matrikeshvari || 7|| aim aim aim patu lingam me bhagalingamritshvari | aim klim guhyam sada patu bhagalingasvarupini
    || 8|| sauh aim uru sada patu vedamata'shtasiddhida | sauh aim janu sada patu mahamudrabhimudrita
    || 9|| sauh aim klim patu me janghe bala tribhuvaneshvari | aim aim sauh sauh patu gulphau trailokyavijayaprada
    || 10|| aim aim klim klim patu padau bala tryakshararupini | shirasah padaparyantam sarvavayavasamyutam
    || 11|| payatpadadi shirshantam aim klim sauh sakalam vapuh | brahmi mam purvatah patu vahnau narayani
    tatha || 12|| maheshvari dakshine'vyannairritye candika'vatu | pashcime patu kaumari vayavye caparajita
    || 13|| varahi tuttare payadishanyam narasimhaka | prabhate bhairavi patu madhyahne yogini kramat
    || 14|| sayam mam vatukah payadardharatre shivo'vatu | nishante sarvaga patu sarvada cakranayika ||
    15|| rane rajakule dyute vivade shatrusankate | sarvatra sarvatah patu aim klau sauh bijabhushita
    || 16|| itidam kavacam divyam balayah saramuttamam | mantravidyamayam tattvam matrikaksharabhushitam
    || 17|| brahmavidyamayam brahmasadhanam mantrasadhanam | yah pathetsatatam bhaktya dharayedva maheshvari
    || 18|| tasya sarvarthasiddhih syat sadhakasya na samshayah | ravau bhurje likhitvedam arcayeddharayettatah
    || 19|| vandhyapi kakavandhyapi mritavatsapi parvati | labhetputran mahaviran markandeyasamayushah
    || 20|| vittam daridro labhate matimanayashahstriyah | ya etaddharayedvarma sangrame sa ripun jayet
    || 21|| jitva vairikulam ghoram kalyanam grihamavishet | bahau kanthe tatha devi dharayenmurdhni santatam
    || 22|| iha loke dhanarogyam paramayuryashah shriyam | prapya bhaktya naro bhoganante yati param padam
    || 23|| idam rahasyam paramam sarvatattveshu hyuttamam | guhyadguhyamimam nityam gopaniyam svayonivat
    || 24||
  devanagari: १३॥ ऋषिः स्याद्दक्षिणामूर्तिः पङ्क्तिश्छन्द उदाहृतः । बाला सरस्वती देवि देवता त्र्यक्षरी
    स्मृता ॥ १४॥ बीजं तु वाग्भवं प्रोक्तं शक्तिः शक्तिरुदाहृता । कीलकं कामराजं तु फडाशाबन्धनं तथा । भोगापवर्गसिद्ध्यर्थं
    विनियोगः प्रकीर्तितः ॥ १५॥ अकुलकुलमयन्ती चक्रमध्ये स्फुरन्ती मधुरमधु पिबन्ती कण्टकान् भक्षयन्ती ।
    दुरतिमपहरन्ती साधकान् पोषयन्ती जयतु जयतु बाला सुन्दरी क्रीडयन्ती ॥ ऐं बीजं मे शिरः पातु क्लीं बीजं
    भ्रुकुटीं मम । सौः भालं पातु मे बाला ऐं क्लीं सौः नयने मम ॥ १॥ अं आं इं ईं श्रुती पातु बाला पञ्चाक्षरी
    मम । उं ऊं ऋं ॠं सदा पातु मम नासापुटद्वयम् ॥ २॥ ऌं ॡं एं ऐं पातु गण्डौ ऐं क्लीं सौः त्रिपुराम्बिका
    । ॐ औं अं अः मुखं पातु सौः क्लीं ऐं त्रिपुरेश्वरी ॥ ३॥ कं खं गं घं डं करौ मे सौः क्लीं ऐं भगमालिनी
    । चं छं ज झं ञं मे पातु बाहू सौः सर्वसिद्धिदा ॥ ४॥ टं ठं डं ढं णं मे पातु वक्षः क्लीं वीरनायिका ।
    तं थं दं धं नं मे पातु ऐं कुक्षौ कुलनायिका ॥ ५॥ पं फं बं भं मं मे पातु पार्श्वौ परमसुन्दरी । यं रं
    लं वं पातु पृष्ठं सौः क्लीं ऐं विश्वमातृका ॥ ६॥ शं षं सं हं पातु नाभिं सौः सौः सौः त्रिगुणात्मिका
    । लं क्षं कटिं सदा पातु क्लीं क्लीं क्लीं मातृकेश्वरी ॥ ७॥ ऐं ऐं ऐं पातु लिङ्गं मे भगलिङ्गामृत्श्वरी
    । ऐं क्लीं गुह्यं सदा पातु भगलिङ्गस्वरूपिणी ॥ ८॥ सौः ऐं ऊरू सदा पातु वेदमाताऽष्टसिद्धिदा । सौः ऐं
    जानु सदा पातु महामुद्राभिमुद्रिता ॥ ९॥ सौः ऐं क्लीं पातु मे जङ्घे बाला त्रिभुवनेश्वरी । ऐं ऐं सौः
    सौः पातु गुल्फौ त्रैलोक्यविजयप्रदा ॥ १०॥ ऐं ऐं क्लीं क्लीं पातु पादौ बाला त्र्यक्षररूपिणी । शिरसः
    पादपर्यन्तं सर्वावयवसंयुतम् ॥ ११॥ पायात्पादादि शीर्षान्तं ऐं क्लीं सौः सकलं वपुः । ब्राह्मी मां पूर्वतः
    पातु वह्नौ नारायणी तथा ॥ १२॥ माहेश्वरी दक्षिणेऽव्यान्नैरृत्ये चण्डिकाऽवतु । पश्चिमे पातु कौमारी वायव्ये
    चापराजिता ॥ १३॥ वाराही तूत्तरे पायादीशान्यां नारसिंहका । प्रभाते भैरवी पातु मध्याह्ने योगिनी क्रमात्
    ॥ १४॥ सायं मां वटुकः पायादर्धरात्रे शिवोऽवतु । निशान्ते सर्वगा पातु सर्वदा चक्रनायिका ॥ १५॥ रणे राजकुले
    द्यूते विवादे शत्रुसङ्कटे । सर्वत्र सर्वतः पातु ऐं क्लौ सौः बीजभूषिता ॥ १६॥ इतीदं कवचं दिव्यं बालायाः
    सारमुत्तमम् । मन्त्रविद्यामयं तत्त्वं मातृकाक्षरभूषितम् ॥ १७॥ ब्रह्मविद्यामयं ब्रह्मसाधनं मन्त्रसाधनम्
    । यः पठेत्सततं भक्त्या धारयेद्वा महेश्वरि ॥ १८॥ तस्य सर्वार्थसिद्धिः स्यात् साधकस्य न संशयः । रवौ
    भूर्जे लिखित्वेदं अर्चयेद्धारयेत्ततः ॥ १९॥ वन्ध्यापि काकवन्ध्यापि मृतवत्सापि पार्वति । लभेत्पुत्रान्
    महावीरान् मार्कण्डेयसमायुषः ॥ २०॥ वित्तं दरिद्रो लभते मतिमानयशःस्त्रियः । य एतद्धारयेद्वर्म सङ्ग्रामे
    स रिपून् जयेत् ॥ २१॥ जित्वा वैरिकुलं घोरं कल्याणं गृहमाविशेत् । बाहौ कण्ठे तथा देवि धारयेन्मूर्ध्नि
    सन्ततम् ॥ २२॥ इह लोके धनारोग्यं परमायुर्यशः श्रियम् । प्राप्य भक्त्या नरो भोगानन्ते याति परं पदम्
    ॥ २३॥ इदं रहस्यं परमं सर्वतत्त्वेषु ह्युत्तमम् । गुह्याद्गुह्यमिमं नित्यं गोपनीयं स्वयोनिवत् ॥ २४॥
