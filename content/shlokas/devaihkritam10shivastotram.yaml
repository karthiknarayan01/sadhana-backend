id: devaihkritam10shivastotram
category: stotram
name:
  english: devaihkritam10shivastotram
  devanagari: देवैःकृतं१०शिवस्तोत्रम्
content:
  english: devaih kritam 10 shivastotram deva ucuh | devadeva jagadvyapinparamesha sadashiva | jagadisha
    jagannatha samprasida jaganmaya || 12|| sarveshamapi bhavanam tvamatma heturishvarah | nirvikaro'vyayo
    nityo nirvikalpo'ksharah parah || 13|| adyantavasya yanmadhyamidamanyadahambahih | yato'vyayah sanaitani
    tatsatyambrahma cidbhavan || 14|| tavaiva caranambhojam muktikama dridhavratah | visrijyobhayatassangam
    munayassamupasate || 15|| tvambrahma purnamamritam vishokam nirgunam param | anandamatramavyagramavikaramanatmakam
    || 16|| vishvasya heturudayasthitisamyamanasya hi | tadapekshataya''tmesho'napekshassarvada vibhuh
    || 17|| ekastvameva sadasaddvayamadvayameva ca | svarnam kritakritamiva vastubhedo na caiva hi ||
    16|| ajnanatastvayi janairvikalpo vidito yatah | tasmadbhramapratikaro nirupadherna hi svatah || 19||
    dhanya vayam maheshana tava darshanamatratah | dridhabhaktajananandapradashshambho dayam kuru || 20||
    tvamadistvamanadishca prakritestvam parah puman | vishveshvaro jagannatho nirvikarah paratparah ||
    21|| yo'yam brahmasti rajasa vishvamurtih pitamahah | tvatprasadatprabho vishnussattvena purushottamah
    || 22|| kalagnirudrastamasa paramatma gunah parah | sadashivo maheshanassarvavyapi maheshvarah ||
    23|| vyaktam mahacca bhutadistanmatranindriyani ca | tvayaivadhishthitanyeva vishvamurte maheshvara
    || 24|| mahadeva pareshana karunakara shankara | prasida devadevesha prasida purushottama || 25||
    vasamsi sagarassapta dishashcaiva mahabhujah | dyaurmurddha te vibhornabhih kham vayurnasika tatah
    || 26|| cakshumshyagni ravissomah kesha meghastava prabho | nakshatratarakadyashca grahashcaiva vibhushanam
    || 27|| katham stoshyami devesha tvam vibho parameshvara | vacamagocaro'si tvam manasa capi shankara
    || 28|| pancasyaya ca rudraya pancashatkotimurtaye | tryadhipaya varishthaya vidyatattvaya te namah
    || 29|| anirdeshyaya nityaya vidyujjvalaya rupine | agnivarnaya devaya shankaraya namo namah || 30||
    vidyutkotipratikashamashtakonam sushobhanam | rupamasthaya loke'sminsamsthitaya namo namah || 31||
    iti shivapurane rudrasamhitayam parvatikhande ekonapancashattamadhyayantargatam devaih kritam shivastotram
    samaptam | shivapurana | rudrasamhita 3 | parvatikhanda | adhyaya 49
  devanagari: देवैः कृतं १० शिवस्तोत्रम् देवा ऊचुः । देवदेव जगद्व्यापिन्परमेश सदाशिव । जगदीश जगन्नाथ सम्प्रसीद
    जगन्मय ॥ १२॥ सर्वेषामपि भावानां त्वमात्मा हेतुरीश्वरः । निर्विकारोऽव्ययो नित्यो निर्विकल्पोऽक्षरः
    परः ॥ १३॥ आद्यन्तावस्य यन्मध्यमिदमन्यदहम्बहिः । यतोऽव्ययः सनैतानि तत्सत्यम्ब्रह्म चिद्भवान् ॥ १४॥
    तवैव चरणाम्भोजं मुक्तिकामा दृढव्रताः । विसृज्योभयतस्सङ्गं मुनयस्समुपासते ॥ १५॥ त्वम्ब्रह्म पूर्णममृतं
    विशोकं निर्गुणं परम् । आनन्दमात्रमव्यग्रमविकारमनात्मकम् ॥ १६॥ विश्वस्य हेतुरुदयस्थितिसंयमनस्य हि ।
    तदपेक्षतयाऽऽत्मेशोऽनपेक्षस्सर्वदा विभुः ॥ १७॥ एकस्त्वमेव सदसद्द्वयमद्वयमेव च । स्वर्णं कृताकृतमिव
    वस्तुभेदो न चैव हि ॥ १६॥ अज्ञानतस्त्वयि जनैर्विकल्पो विदितो यतः । तस्माद्भ्रमप्रतीकारो निरुपाधेर्न
    हि स्वतः ॥ १९॥ धन्या वयं महेशान तव दर्शनमात्रतः । दृढभक्तजनानन्दप्रदश्शम्भो दयां कुरु ॥ २०॥ त्वमादिस्त्वमनादिश्च
    प्रकृतेस्त्वं परः पुमान् । विश्वेश्वरो जगन्नाथो निर्विकारः परात्परः ॥ २१॥ योऽयं ब्रह्मास्ति रजसा विश्वमूर्तिः
    पितामहः । त्वत्प्रसादात्प्रभो विष्णुस्सत्त्वेन पुरुषोत्तमः ॥ २२॥ कालाग्निरुद्रस्तमसा परमात्मा गुणः
    परः । सदाशिवो महेशानस्सर्वव्यापी महेश्वरः ॥ २३॥ व्यक्तं महच्च भूतादिस्तन्मात्राणीन्द्रियाणि च । त्वयैवाधिष्ठितान्येव
    विश्वमूर्ते महेश्वर ॥ २४॥ महादेव परेशान करुणाकर शङ्कर । प्रसीद देवदेवेश प्रसीद पुरुषोत्तम ॥ २५॥ वासांसि
    सागरास्सप्त दिशश्चैव महाभुजाः । द्यौर्मूर्द्धा ते विभोर्नाभिः खं वायुर्नासिका ततः ॥ २६॥ चक्षूंष्यग्नी
    रविस्सोमः केशा मेघास्तव प्रभो । नक्षत्रतारकाद्याश्च ग्रहाश्चैव विभूषणम् ॥ २७॥ कथं स्तोष्यामि देवेश
    त्वां विभो परमेश्वर । वाचामगोचरोऽसि त्वं मनसा चापि शङ्कर ॥ २८॥ पञ्चास्याय च रुद्राय पञ्चाशत्कोटिमूर्तये
    । त्र्यधिपाय वरिष्ठाय विद्यातत्त्वाय ते नमः ॥ २९॥ अनिर्देश्याय नित्याय विद्युज्ज्वालाय रूपिणे । अग्निवर्णाय
    देवाय शङ्कराय नमो नमः ॥ ३०॥ विद्युत्कोटिप्रतीकाशमष्टकोणं सुशोभनम् । रूपमास्थाय लोकेऽस्मिन्संस्थिताय
    नमो नमः ॥ ३१॥ इति शिवपुराणे रुद्रसंहितायां पार्वतीखण्डे एकोनपञ्चाशत्तमाध्यायान्तर्गतं देवैः कृतं शिवस्तोत्रं
    समाप्तम् । शिवपुराण । रुद्रसंहिता ३ । पार्वतीखण्ड । अध्याय ४९
