id: shivaproktamvriddhacaleshvarakshetreshivopasakanvarnanam
category: raksha
name:
  english: shivaproktamvriddhacaleshvarakshetreshivopasakanvarnanam
  devanagari: शिवप्रोक्तंवृद्धाचलेश्वरक्षेत्रेशिवोपासकान्वर्णनम्
content:
  english: pura kashyapakanvadyah shivatirthatanotsukah | shrimadvriddhacalam prapurdarshanadeva mokshadam
    || 7|| manimuktanadim drishtva kashyapadya munishvarah | tattire bilvavrikshamshca dadrishurnavapallavan
    || 8|| tatra shaivavaramshcanyanapashyanchivapujakan | bhasmoddhulitasarvangan tripundrankitamastakan
    || 9|| rudrakshamalabharananjatamandalamanditan | shankareti mahesheti shivanamajapotsukan || 10||
    nityamavyabhicarena mallingakarcanapriyan | advaitam paramam brahma shiva eveti vadinah || 11|| shrimadrudrajapasaktanpancaksharaparayanan
    | manimuktanadim prapustataste munipungavah || 12|| tatra te cakrire snanam manimuktanadijale | uddhulya
    bhasmanangani tataste munipungavah || 13|| tripundradharanam cakrustataste kashyapadayah | atha sampujayamasuh
    shivam mam lingarupinam || 14|| tatah sarvairmunivarairjaptam pancaksharam shive | tataste bilvapatrani
    manimuktajalani ca || 15|| grihitva maunamasadya jagmurvriddhacaleshvaram | tato drishtva munindraste
    shrimadvriddhacaleshvaram || 16|| santosham paramam jagmurandabharita bhrisham | tatah sampujayamasuh
    shrimaddriddhacaleshvaram || 17|| rudrasuktairlingarupamabhishitrya yathakramam | pradakshinanamaskaramstatashcakrurmunishvarah
    || 18|| tatah stutvatibhaktya te shivanamajapotsukah | pancaksharajapam kritva shrautanyasapurahsaram
    || 19|| shrimadrudrajapam kritva tatra tasthuracancalah | tadanimagato devi gautamo'pyarunacalat ||
    20|| agastyah pujayamasa shrimadvriddhacaleshvaram | tatastushtavam shuddhatma gautamo mamumapatim
    || 21|| shaivavaryeshu sha
  devanagari: पुरा कश्यपकण्वाद्याः शिवतीर्थाटनोत्सुकाः । श्रीमद्वृद्धाचलं प्रापुर्दर्शनादेव मोक्षदम् ॥
    ७॥ मणिमुक्तानदीं दृष्ट्वा कश्यपाद्या मुनीश्वराः । तत्तीरे बिल्ववृक्षांश्च ददृशुर्नवपल्लवान् ॥ ८॥ तत्र
    शैववरांश्चान्यानपश्यञ्छिवपूजकान् । भस्मोद्धूलितसर्वाङ्गान् त्रिपुण्ड्राङ्कितमस्तकान् ॥ ९॥ रुद्राक्षमालाभरणाञ्जटामण्डलमण्डितान्
    । शङ्करेति महेशेति शिवनामजपोत्सुकान् ॥ १०॥ नित्यमव्यभिचारेण मल्लिङ्गाकार्चनप्रियान् । अद्वैतं परमं
    ब्रह्म शिव एवेति वादिनः ॥ ११॥ श्रीमद्रुद्रजपासक्तान्पञ्चाक्षरपरायणान् । मणिमुक्तानदीं प्रापुस्ततस्ते
    मुनिपुङ्गवाः ॥ १२॥ तत्र ते चक्रिरे स्नानं मणिमुक्तानदीजले । उद्धूल्य भस्मनाङ्गानि ततस्ते मुनिपुङ्गवाः
    ॥ १३॥ त्रिपुण्ड्रधारणं चक्रुस्ततस्ते कश्यपादयः । अथ सम्पूजयामासुः शिवं मां लिङ्गरूपिणम् ॥ १४॥ ततः
    सर्वैर्मुनिवरैर्जप्तं पञ्चाक्षरं शिवे । ततस्ते बिल्वपत्राणि मणिमुक्ताजलानि च ॥ १५॥ गृहीत्वा मौनमासाद्य
    जग्मुर्वृद्धाचलेश्वरम् । ततो दृष्ट्वा मुनीन्द्रास्ते श्रीमद्वृद्धाचलेश्वरम् ॥ १६॥ सन्तोषं परमं जग्मुरान्दभरिता
    भृशम् । ततः सम्पूजयामासुः श्रीमद्दृद्धाचलेश्वरम् ॥ १७॥ रुद्रसूक्तैर्लिङ्गरूपमभिषित्र्य यथाक्रमम् ।
    प्रदक्षिणनमस्कारांस्ततश्चक्रुर्मुनीश्वराः ॥ १८॥ ततः स्तुत्वातिभक्त्या ते शिवनामजपोत्सुकाः । पञ्चाक्षरजपं
    कृत्वा श्रौतन्यासपुरःसरम् ॥ १९॥ श्रीमद्रुद्रजपं कृत्वा तत्र तस्थुरचञ्चलाः । तदानीमागतो देवि गौतमोऽप्यरुणाचलात्
    ॥ २०॥ अगस्त्यः पूजयामास श्रीमद्वृद्धाचलेश्वरम् । ततस्तुष्टावं शुद्धात्मा गौतमो मामुमापतिम् ॥ २१॥ शैववर्येषु
    श
