id: krishnopan
category: upanishad
name:
  english: krishnopan
  devanagari: क्रिश्नोपन्
content:
  english: ringamindrah sagosurah || 8|| gokulam vanavaikuntham tapasastatra te drumah | lobhakrodhadayo
    daityah kalikalastiraskritah || 9|| goparupo harih sakshanmayavigrahadharanah | durbodham kuhakam
    tasya mayaya mohitam jagat || 10|| durjaya sa suraih sarvairdhrishtirupo bhaveddvijah | rudro yena
    krito vamshastasya maya jagatkatham || 11|| balam jnanam suranam vai tesham jnanam hritam kshanat
    | sheshanago bhavedramah krishno brahmaiva shashvatam || 12|| ashtavashtasahasre dve shatadhikyah
    striyastatha | ricopanishadasta vai brahmarupa ricah striyah || 13|| dveshashcanuramallo'yam matsaro
    mushtiko jayah | darpah kuvalayapido garvo rakshah khago bakah || 14|| daya sa rohini mata satyabhama
    dhareti vai | aghasuro mahavyadhih kalih kamsah sa bhupatih || 15|| shamo mitrah sudama ca satyakruroddhavo
    damah | yah shankhah sa svayam vishnurlakshmirupo vyavasthitah || 16|| dugdhasindhau samutpanno meghaghoshastu
    samsmritah | dugdhodadhih kritastena bhagnabhando dadhigrihe || 17|| kridate balako bhutva purvavatsumahodadhau
    | samharartham ca shatrunam rakshanaya ca samsthitah || 18|| kriparthe sarvabhutanam goptaram dharmamatmajam
    | yatsrashtumishvarenasittaccakram brahmarupadrik || 19|| jayantisambhavo vayushcamaro dharmasamjnitah
    | yasyasau jvalanabhasah khadgarupo maheshvarah || 20|| kashyapolukhalah khyato rajjurmata'ditistatha
    | cakram shankham ca samsiddhim bindum ca sarvamurdhani || 21|| yavanti devarupani vadanti vibhudha
    janah | namanti devarupebhya evamadi na samshayah || 22|| gada ca kaḻika sakshatsarvashatrunibarhini
    | dhanuh sharngam svamaya ca sharatkalah subhojanah || 23|| abjakandam jagatbijam dhritam panau svalilaya
    | garudo vatabhandirah sudama narado munih || 24|| vrinda bhaktih kriya buddhih sarvajantuprakashini
    | tasmanna bhinnam nabhinnamabhirbhinno na vai vibhuh | bhumavuttaritam sarvam vaikuntham svargavasinam
    || 25|| sarvatirthaphalam labhate ya evam veda | dehabandhadvimucyate itypanishat | om bhadram karnebhih
    sha
  devanagari: ृङ्गमिन्द्रः सगोसुरः ॥ ८॥ गोकुलं वनवैकुण्ठं तापसास्तत्र ते द्रुमाः । लोभक्रोधादयो दैत्याः
    कलिकालस्तिरस्कृतः ॥ ९॥ गोपरूपो हरिः साक्षान्मायाविग्रहधारणः । दुर्बोधं कुहकं तस्य मायया मोहितं जगत्
    ॥ १०॥ दुर्जया सा सुरैः सर्वैर्धृष्टिरूपो भवेद्द्विजः । रुद्रो येन कृतो वंशस्तस्य माया जगत्कथम् ॥ ११॥
    बलं ज्ङानं सुराणां वै तेषां ज्ङानं हृतं क्षणात् । शेषनागो भवेद्रामः कृष्णो ब्रह्मैव शाश्वतम् ॥ १२॥
    अष्टावष्टसहस्रे द्वे शताधिक्यः स्त्रियस्तथा । ऋचोपनिषदस्ता वै ब्रह्मरूपा ऋचः स्त्रियाः ॥ १३॥ द्वेषश्चाणूरमल्लोऽयं
    मत्सरो मुष्टिको जयः । दर्पः कुवलयापीडो गर्वो रक्षः खगो बकः ॥ १४॥ दया सा रोहिणी माता सत्यभामा धरेति
    वै । अघासुरो महाव्याधिः कलिः कंसः स भूपतिः ॥ १५॥ शमो मित्रः सुदामा च सत्याक्रूरोद्धवो दमः । यः शङ्खः
    स स्वयं विष्णुर्लक्ष्मीरूपो व्यवस्थितः ॥ १६॥ दुग्धसिन्धौ समुत्पन्नो मेघघोषस्तु संस्मृतः । दुग्धोदधिः
    कृतस्तेन भग्नभाण्डो दधिगृहे ॥ १७॥ क्रीडते बालको भूत्वा पूर्ववत्सुमहोदधौ । संहारार्थं च शत्रूणां रक्षणाय
    च संस्थितः ॥ १८॥ कृपार्थे सर्वभूतानां गोप्तारं धर्ममात्मजम् । यत्स्रष्टुमीश्वरेणासीत्तच्चक्रं ब्रह्मरूपदृक्
    ॥ १९॥ जयन्तीसंभवो वायुश्चमरो धर्मसंज्ङितः । यस्यासौ ज्वलनाभासः खड्गरूपो महेश्वरः ॥ २०॥ कश्यपोलूखलः
    ख्यातो रज्जुर्माताऽदितिस्तथा । चक्रं शङ्खं च संसिद्धिं बिन्दुं च सर्वमूर्धनि ॥ २१॥ यावन्ति देवरूपाणि
    वदन्ति विभुधा जनाः । नमन्ति देवरूपेभ्य एवमादि न संशयः ॥ २२॥ गदा च काळिका साक्षात्सर्वशत्रुनिबर्हिणी
    । धनुः शार्ङ्गं स्वमाया च शरत्कालः सुभोजनः ॥ २३॥ अब्जकाण्डं जगत्बीजं धृतं पाणौ स्वलीलया । गरुडो वटभाण्डीरः
    सुदामा नारदो मुनिः ॥ २४॥ वृन्दा भक्तिः क्रिया बुद्धिः सर्वजन्तुप्रकाशिनी । तस्मान्न भिन्नं नाभिन्नमाभिर्भिन्नो
    न वै विभुः । भूमावुत्तारितं सर्वं वैकुण्ठं स्वर्गवासिनाम् ॥ २५॥ सर्वतीर्थफलं लभते य एवं वेद । देहबन्धाद्विमुच्यते
    इत्य्पनिषत् । ॐ भद्रं कर्णेभिः श
