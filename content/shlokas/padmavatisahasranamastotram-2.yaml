id: padmavatisahasranamastotram-2
category: sahasranama
name:
  english: padmavatisahasranamastotram 2
  devanagari: पद्मावतीसहस्रनामस्तोत्रम् २
content:
  english: maraktambaradharinim shashikalacudam trinetrojjvalam | malapadmakapalakumbhakakaram padmasanam
    shidhupam | devim muktakacam surasavarasam raktokshanam cintaye || iti dhyanam || om hrim shrim klim
    blum nagi nagarajopasevita | nagendratanaya nari nagarajasutanagha || 1|| nagari nagari nutya naganayakanandani
    | nilambaradharananta nila nilapatakini || 2|| nilakrameshvari nunna niladrumalatashraya | nisha nishakarakala
    komala ca kalavati || 3|| jayashraya jayakari vijaya vijayaprada | vilasini vishvamata vishveshi vishvasudini
    || 4|| vishvaprasurvishvadhatri dhatri dhatrivaraprada | amriti mrityushamani mari mrityurmanonmayi
    || 5|| manasvini manavati manojna madiravati | indrani dahani diptirdharmada dharmanayaki || 6|| rakshodhatri
    rakshaseshi raksholokopasevita | varuni madira moda varunimadavihvala || 7|| yatyali vayusurvani vayupujya
    vibhavari | shrida shrideshvari shrila shrishobha shankari shiva || 8|| ishvari shambhavi murtirbrahmasurbrahmavallabha
    | narayani sheshamurtirgurumurtirgariyasi || 9|| krisarakesharavati kamala kamalavati | vimala nirmala
    mala malakshirakshapakula || 10|| kapalishvarasevya ca kapalishi kapalini | malyambaradhara sadhvi
    malini harini harit || 11|| halahalavati helalila lilavati tati | valika kalikakali kurukullaca komala
    || 12|| dakini dakkika yogya yogini khecari cari | brahmani brahmarudrani vaishnavi candika jaya ||
    13|| daityadarpahari dhyeya darpavatyaparajita | kaumari kulikakuhya varahi varadayini || 14|| narasimhi
    virasimhi nripasimhasamarcita | asitangi natangi ca rurubhairavapujita || 15|| kapalabhairaveshani
    bhishana bhishaneshvari | samharabhairavi bhima bhimavamangavasini || 16|| ganeshvari gunatita nirguna
    nishkala kala | sakala sakaladhara dharadharasutaprasuh || 17|| prajavati premavati vinata vinayaprada
    | vishvambhara varagatih sugatih sugatarcita || 18|| svargatih samatih sadhvi sukhadaca sukhavati
    | trinetra tripureshani mahatripurasundari || 19|| trikula tripuradhyaksha trivarna triputeshvari
    | tryakshari tripura bala mahatripurabhairavi || 20|| viragini viragatiradhvini casvavahini | ashvaplutih
    sadhugatirbharani bharini bhaga || 21|| bhagamala bhageshani bhagabimbabhamalini | krittika krittivastra
    ca krittivasakutumbini || 22|| kartikeyaprasuh kirtih kirtida kirtivardhini | rohini rohinimurtih
    rauhiniyavaraprada || 23|| mrigavati mriginetri mrigalanchanashekhara | mrigarajagatirmrigya mrigi
    mrigashirodhara || 24|| ardrardravasana sandra punarbhutih punarvasuh | punarjaya purnardina punarvara
    punarvadhuh || 25|| tithya tithipriya tithyapushpa pushpavati puri | ashleshashlesha rasika magha
    moghavati suhrit || 26|| purva purvamukhi paurva purvaphalgunika tadit | saudamini sudama ca sudhapanaparayana
    || 27|| uttara cottarasha ca sottarottaraphalguni | hasta hastajanitri ca khanitri khaniruttama ||
    28|| citra citrambaradhara svatih svadusuhvisuri | vishakha shakhini shakha vishakhajanani jadi ||
    29|| aragini para ragyanuradhanurupujita | jyeshtha shreshtha jyeshthakala mulam muladharagatih ||
    30|| purvashadha ca ya shandi cottarashadhavallabha | shravani shravanimurtih shravaneshi shrutismritih
    || 31|| vishrava sashrava shravya shranta vaishravanishvari | dhaneshvari dhanishtha ca dhanilokavaraprada
    || 32|| shatam shama shatabhishak kalikalmashanashini | purvabhadrapada bhadrabhadrada bhadrakalika
    || 33|| shmashanakalika ghora kalika virakalika | uttarotarabhadra ca padacottarakalika || 34|| revati
    devaki devi shyama dakshinakalika | suryamshusadrishi shuri candrika candravallabha || 35|| mangali
    mangalavati yoddhada buddhivardhini | buddhopasevita bodha jivada jivasevita || 36|| jivanto gurudeha
    ca vagvilasapradayini | shukrah shukraprasuh shukro shukralipta ca shukrala || 37|| shukratmika shukrapujya
    shukranitivivardhini | shukrapriya shukrajaya shukracandanacarcita || 38|| shrukrangaragaliptangi
    shrukraikatilakapriya | shaniprastha mandagatirmandamata madalasa || 39|| mandakini ca madira madirarunalocana
    | raktabahurhariketuh kaitavi ketumalini || 40|| dhruva dhruvajanitri ca dhruvamargapravarttini |
    anusuyanuloma ca loapamudra ca lopini || 41|| agastyopasita vidya navagrahasamarcita | pratipadvikalatithya
    dvitiya saiva shaktika || 42|| tritiya karinimurtishcaturtha vedanayaki | pancami shoma pancesi shashthi
    shadrasalolupa || 43|| saptami saptashakha ca saptarshijanasevita | ashtami vasupujya ca navami navaratrika
    || 44|| navadurgashraya murtih shridurga kalaratrika | dashami dashamipujya dashadikpalavandita ||
    45|| ekadashi rudramurti dvadashi suryavallabha | trayodashi shivaprita bhuteshi ca caturdashi ||
    46|| amavasya pitrikala purnima candravandita | vidyadhari menakaca citralekhapyalambusha || 47||
    tilottamakshara rambha rambhoru lambhakundala | urvashi shitalangi ca shulini kuntakeshvari || 48||
    sundopasundashamani mahishasurasudini | raktabijahara raktacandamundanishudini || 49|| nishumbhashumbhahartri
    ca madhukaitabhanashini | hiranyakshahari dhurti ravanantakari dhritih || 50|| sita sadhvi shilavati
    shambharantakari sati | shambararisahaya ca shambarariripupriya || 51|| yaksheshvari yakshavadhuryakshini
    yakshanayaki | rakshomata rakshasi ca gandhari kinnarishvari || 52|| pishaci sumukhi devi matangi
    rajavallabha | ucchishtamukhacandali rajamatangini turi || 53|| mahapishacini devi shankini shankhini
    shata | guhya guhyatama goptri yakshini guhyakeshvari || 54|| sulocana sugotra ca suvastra svarnakankana
    | siddhesvari siddhamata siddhalokanivasini || 55|| anima mahima siddhirgarima laghima tatha | ishatvasiddhih
    satsiddhih saptasiddhih sadashraya || 56|| sakamyasiddhih siddhecha mantrasiddhih susiddhida | bhuteshvari
    maharajni bhuteshvaravilasini || 57|| bhutadhatri bhutavidya bhutavetalasevita | tapasvini tapasya
    ca yashsya ca yasakhini || 58|| stambhini mukhamudra ca mahastambheshvareshvari | gatistambhakari
    treta bagala bagalamukhi || 59|| mohini kamamoha ca moha tripuramohini | maranimurtirishani mrityurupa
    karalini || 60|| kenashavarada kela jagadakarshinishvari | vashikaranamurtishca rajalokavashankari
    || 61|| uccatanakari mudra shantika shantidayini | paushtiki pushtida pushtih santanakatakasthita
    || 62|| vandhya ca kakavandhya ca mritavatsa ca vatsala | vandhyaputraprada pautri pautriputrapriyankari
    || 63|| mauktiki muktida muktirmuktaharavibhushana | sarasvati bharati ca jadabhavavinashini || 64||
    ugratarabhatara ca tithitarottarottara | nili surarcita nivi nila nilasarasvati || 65|| eka caikajatajuta
    mahatara jatalini | shailadurga shailaputri brahmeshi brahmacarini || 66|| candaghanta candadurga
    pracanda candika cyuta | kushmandi skandamata ca guhadurga sudurjaya || 67|| katyayani putadurga kaladurga
    krikatiki | kalaratri ratnadurga mahagauri gunapriya || 68|| devaduti shivaduti dutadurga parambika
    | vanadurgeti durga ca padmadurga pilampila || 69|| shrividyavasini durga himacalakritalaya | nishadhadrinivasa
    ca malyavadgirivasini || 70|| parijatagiristha ca gandhamadanavasini | sahyaparvatasamstha ca kailasacalavasini
    || 71|| malayastha layatita saptasagaravasini | saptadvipashraya prithvi saptapatalavasini || 72||
    saptagraheshvari saptabhuvanantaravasini | shivatattvamayi shaktih sadashivavilasini || 73|| ishvarashrayini
    kamya shuddhavidya sadalasa | maya mayavati yamya kalatattvaprakashini || 74|| vidyavagvadini vani
    ragatattvapramodini | kalatattvanuraga ca niyatiryativallabha || 75|| purushakrititattva ca purusharthapradayini
    | prakritih prakritistulpa sakritadeshadakshina || 76|| ahankritirahantattva mahatattvabharalasa |
    buddhirmanovegavati tvak cakshur jyotirammayi || 77|| shrotratattva ca rasana rasala rasapayini |
    ghrani mohakula madri vamishi panipankaja || 78|| padashritadhara||kasha payutattvavicarini | tapastarasikalingya
    lingamritasutarpita || 79|| bhagalingamayimrirtirbhagalingasukhashraya | shabdarupa shabdasukha nadabindusvarupini
    || 80|| sparshapriya sparshatattva rasatattva rasalasa | gandhini ca sugandha ca paramakararupini
    || 81|| shunyarupa shunyamatih shunyayonih parakritih | vahnijvala mahajvala jvalalinganivasini ||
    82|| jvalamukhi kotarakshi jvalajatilarupini | salileshi jalesha ca hayorupa payasvini || 83|| prithivipancatatveshi
    shattrimshattattvarupini | vasantakusumashrishca vasantartusukhashraya || 84|| grishmajvala raviprita
    varshavrishtividhayini | sharatkusumasampashca sharada simhavishtara || 85|| hemantashrirhaimavati
    harikanta hareshvari | shikharashrih shashimukhi sharikashukasevita || 86|| yamuna yamini yamya narmada
    shatarudrika | sarasvati vetravati reva raivatakashraya || 87|| vipasha parahantri ca bhagyada bhagamalini
    | airavati saritsindhuh shatadruh shatarudrika || 88|| vitasta sindhuraindri ca vishoka papanashini
    | candravati madhumati sarayu camaravati || 89|| tapi haimavati shisa campa campavati kuru | karmanasha
    ca kaveri kaushiki kaushikeshvari || 90|| shucirhaimavati haimi gandaki devika ditih | aditirvinata
    kadruh sabhaga virabhagika || 91|| sudhavati carmavati carmavatyapi venuka | ratnavati manimukha nadirupa
    cidishvari || 92|| varanasi shivapuri mayapuri gudi tatha | kanci cojjayini preyya mathuraya ca durllabha
    || 93|| ayodhyayam ca sevya ca dvarika durgavasini | uddiyanavanih kudya kamarupanivasini || 94||
    hingulapithvasa ca sharadapithavasini | kubjika pashcimamnayavirapithanivasini || 95|| shyamavidya
    mahakali dakshinamnayanayaki | ugracandyuttarakali uttaramnayanayaki || 96|| shrimahashodashi devi
    parordhvamnayanayaki | padmavati nagavidya cadharamnayanayaki || 97|| shadamnayeshvari devi parashaktih
    samatrika | akaranayaki camba canantanandavigraha || 98|| ambikambalikananda cadrijadrinishevita |
    alopakalitanalpa cajitajasamarcita || 99|| alimamsasvarupa ca avarnakritivarnini | adyatmarupini cajna
    anandarasatarpita || 100|| akarajitasarvasha apayitapadashraya | acarapancakaprita akaraksharamatrika
    || 101|| indrastutya mahendrakshi indirendivaraprada | idamangalasambhranta cetihasakathasmritih ||
    102|| ityapujaparastriptih ikaraksharamatrika | ishvarapreyasi isha iikaraksharashraya || 103|| uma
    colka caruhasa cogravamangavasini | ullasanavarupoksha viksharaksharavigraha || 104|| ushma uti urumati
    usvaroha svarottama | ribhu riksheshvari ritya rimatra lrikritistitha || 105|| lrimatrika vibhushadhya
    yonthasvaravinayaki | enamshumukuta ceni cainanetra savarnika || 106|| ainkarabijabhushadhya aihikamushmikaprada
    | omkararupini aurva amsvarupa svarotthita || 107|| ahsvarupaparambrahmarupini svaranayaki | kanakangadabhusha
    ca kanaki kanakavati || 108|| kathorangi kripakara mokshada ca kripavati | kashmiri kashyapakara karika
    kalikavati || 109|| kadambari kashmala ca kujastha kashmalavati | kameshvari kancanabha kamuki kamukavati
    || 110|| kancuki kudmala kantha ketaki kanakavati | kapeshvari kopavati kapila kapilavati || 111||
    karanjakunjasamstha ca kampila kampilavati | keyuraharashobhadhya kimshuki kimshukavati || 112|| kokilalaparasika
    kokili komalavati | kalankarahita keshya kalavinkakulavati || 113|| kulakulapadeshani kurukulladhidevata
    | kakaramatrikadevi kakaramatrikavati || 114|| khadgahasta kharparashi khatila khatilavati | kheteshvari
    khagagatih khadgini khetakavati || 115|| khancanakshi khanjarithi khamrupa khancanavati | goptri gopalavanita
    godatita gayavati || 116|| ganeshajanani gurvi gunagamya gunavati | garunmanirmaricishca ganana ganakeshvari
    || 117|| ghurghura gharata ghari ghatika ghatikavati | ghaneshvari ghaneha ca ghanavaha ghanavati
    || 118|| nanta navarnasamstha ca vargini ca namatrika | camikaraprabha candri catula catulavati ||
    119|| camatkritishcandrahasa candramoda calavati | cancashcakoranayana cakori korakavati || 120||
    calatpavanavega ca calita culukavati | chatreshvari chatradhara chatreksha chatrikavati || 121|| chinnamasta
    chinnabhusha chatila chatilavati | japya jeya jayakari jivanta jivanavati || 122|| jagajjaitra jagadraksha
    jagati jayikavati | jatila jangameshani jambhali jambhalavati || 123|| jhankarirjalada chaya jhinjhini
    jhinjhinavati | nanurupa navarneshi nakara naninavati || 124|| tankayudha tintinika tankari tankanavati
    | thakuri thakureshani thakshara thaksharavati || 125|| dindiravallabha dina dakara dindimavati |
    dhatkritirdhundhupidhakshi dhakaramatrikavati || 126|| ninivama navarneshi navarnaksharamatrika |
    tapani tapani tryakshi tapaniyasamaprabha || 127|| totula tilakadyotistotika tilakavati | tautilparahita
    tami tamika tutilavati || 128|| tamari tomarakara tautili tulasi turi | tatakadharani tutyastutistumburunihsvana
    || 129|| tandaviparamaprita tundaghona tulavati | tari tamarasadyotistarani tarunavati || 130|| trutanmala
    trutihara trapala capalavati | sthalika sthandila sthanuh sthavira sthaviravati || 131|| damani damada
    dara dambholibhridvaraprada | dandahasta dayardra ca dolarudha duravati || 132|| dunduni dundushamani
    dambhiki dambhikavati | dinaikajanani danta dindini dandakavati || 133|| drohini drohada hartri druhika
    druhikavati | draksharasapriya drota dakaraksharamatrika || 134|| dhanya dhanadasevya ca dharmila
    dharmilavati | narmakarmakari nali nalini nalinavati || 135|| naranarijanastutya naranarayanapriya
    | nateshvari natyakari natini natikavati || 136|| nagarajendradrayita nagari nagaravati | paramparapivarangi
    pathaki pithikavati || 137|| patha padambaradhara padini paddinavati | padodakapriya patri patraja
    patrikavati || 138|| paratmika parambrahmi parameshvaravallabha | phuntika phantaja phanta phatvarnaksharamatrika
    || 139|| balandhura balakari balidanavanashini | balottara bandhakari bandhaki bandhakavati || 140||
    bandhuja bandhavaprita barbari barbaravati | bagola bandhamukta ca balaki bagalavati || 141|| bhagarupa
    bhagollasa bhagaja ca bhagavati | bhagalingarasasvada bhagalingamritatmika || 142|| bhagaruparataprita
    bhagila bhagalavati | mudrika mohamudra ca navamudraprakashini || 143|| madyakshidurasakshiva mandura
    modakavati | manjushika manjurava madhuyashtirmadavati || 144|| madhumatta madoddhasa modaki modakavati
    | modakaharavarada modira madrikavati || 145|| manovati manasiki methika manthikavati | mainakavarada
    medha meruja minakavati || 146|| yajneshvaripriya yajnaphalada yajnakavati | yajamanapriya yajnayajaki
    yajnakavati || 147|| yashtihasta yantrakari yashtiki yashtikavati | yadaspatistuta yogajanani janakavati
    || 148|| ratrincarakshayakari ratreshvaranishevita | rogakeharini ravi rolamba madhurasvana || 149||
    rajapuja ratala ca rajasi rajilavati | rajasvala rajorupa retija retilavati || 150|| lakshmirlalakari
    lola langalishi lulavati | lakshrasaprabhaluta langalayudhasevita || 151|| lalajjihva ca lolakshi
    lasyahasya vicakshana | lambakeshavali lambarasana lambikavati || 152|| vashini vamshaja vamshi vasatirvashikavati
    | shardulacarmavasana shambukakalikavati || 152|| shirdulamadhya sareshi shamada shamikavati | shauryaprada
    suramata shauriki shaurikavati || 153|| shodashi shodashakala shadanga shodashakshari | satimata satrasala
    sarasi sarasavati || 154|| surasangharcita sabhya sabhasevya sabhavati | samastasukha saubhagya samasta
    duritapaha || 155|| samastasadhakastutya sarvamangaladayini | sarojinidhavadyotih sagaraikasutasura
    || 156|| surapanarasala ca sarala saralavati | huhupriya ca hum bija harini nayanahutih || 157|| hotripriya
    havyabhakshya havisha havishavati | halahalapriya hola halini hatilavati || 158|| homamala hariprita
    hakaraksharamatrika | hayusha hatakadyotirhemakantirhalavati || 159|| lakshahsvarupa sadasaccidanandeshvareshvari
    | dayavati satyavati yashovatyamaravati || 160|| prabhavati dhanavati kriyavatyakalavati | mohavati
    mahavati stuvanti mallikavati || 161|| parvati pavanavati devata shridharavati | om hrim shrim blum
    ca phat svaha padma padmavatishvari || 162|| iti namnam sahastram te kathitam viravandite | samastamatrikapurnasarvakshatu
    manohare || 163|| samastatithisampurnam mulamantraikasadhanam | devi guhyatamam guhyam bhavasagarataranam
    || 164|| papapaham mahapunyam punyadam punyavardhanam | brahmahatyadipapanam prayashcittaphalapradam
    || 165|| yahpathetpathayedvapi shravayedva sha
  devanagari: मारक्ताम्बरधारिणीं शशिकलाचूडां त्रिनेत्रोज्ज्वलाम् । मालापद्मकपालकुम्भककरां पद्मासनां शीधुपाम्
    । देवीं मुक्तकचां सुरासवरसां रक्तोक्षणां चिन्तये ॥ इति ध्यानम् ॥ ॐ ह्रीं श्रीं क्लीं ब्लूं नागी नागराजोपसेविता
    । नागेन्द्रतनया नारी नगराजसुतानघा ॥ १॥ नगरी नागरी नुत्या नगनायकनन्दनी । नीलम्बरधरानन्ता नीला नीलपताकिनी
    ॥ २॥ नीलक्रमेश्वरी नुन्ना नीलद्रुमलताश्रया । निशा निशाकरकला कोमला च कलावती ॥ ३॥ जयाश्रया जयकरी विजया
    विजयप्रदा । विलासिनी विश्वमाता विश्वेशी विश्वसूदिनी ॥ ४॥ विश्वप्रसूर्विश्वधात्री धात्री धातृवरप्रदा
    । अमृती मृत्युशमनी मारी मृत्युर्मनोन्मयी ॥ ५॥ मनस्विनी मानवती मनोज्ञा मदिरावती । इन्द्राणी दाहनी दीप्तिर्धर्मदा
    धर्मनायकी ॥ ६॥ रक्षोधात्री राक्षसेशी रक्षोलोकोपसेविता । वारुणी मदिरा मोदा वारुणीमदविह्वला ॥ ७॥ यात्याली
    वायुसूर्वाणी वयुपूज्या विभावरी । श्रीदा श्रीदेश्वरी श्रीला श्रीशोभा शङ्करी शिवा ॥ ८॥ ईश्वरी शाम्भवी
    मूर्तिर्ब्रह्मसूर्ब्रह्मवल्लभा । नारायणी शेषमूर्तीर्गुरुमूर्तिर्गरीयसी ॥ ९॥ कृसराकेशरवती कमला कमलावती
    । विमला निर्मला माला मालाक्षीरक्षपाकुला ॥ १०॥ कपालीश्वरसेव्या च कपालीशी कपालिनि । माल्याम्बरधरा साध्वी
    मालिनी हारिणी हरित् ॥ ११॥ हालाहालावती हेलालीला लीलावती तटी । वालिका कलिकाकाली कुरुकुल्लाच कोमला ॥
    १२॥ डाकिनी डक्किका योग्या योगिनी खेचरी चरी । ब्रह्माणी ब्रह्मरुद्राणी वैष्णवी चण्डिका जया ॥ १३॥ दैत्यदर्पहरी
    ध्येया दर्पवत्यपराजिता । कौमारी कुलिकाकुह्या वाराही वरदायिनी ॥ १४॥ नारसिंही वीरसिंही नृपसिंहसमर्चिता
    । असिताङ्गी नताङ्गी च रुरुभैरवपूजिता ॥ १५॥ कपालभैरवेशानी भीषणा भीषणेश्वरी । संहारभैरवी भीमा भीमावामाङ्गवासिनी
    ॥ १६॥ गणेश्वरी गुणातीता निर्गुणा निष्कला कला । सकला सकलाधारा धराधरसुताप्रसूः ॥ १७॥ प्रजावती प्रेमवती
    विनता विनयप्रदा । विश्वम्भरा वरगतिः सुगतिः सुगतार्चिता ॥ १८॥ स्वर्गतिः समतिः साध्वी सुखदाच सुखावती
    । त्रिनेत्रा त्रिपुरेशानी महात्रिपुरसुन्दरी ॥ १९॥ त्रिकुला त्रिपुराध्याक्षा त्रिवर्णा त्रिपुटेश्वरी
    । त्र्यक्षरी त्रिपुरा बाला महात्रिपुरभैरवी ॥ २०॥ वीरागिणी वीरगतिरध्विनी चास्ववाहिनी । अश्वप्लुतिः
    साधुगतिर्भरणी भारिणी भगा ॥ २१॥ भगमाला भगेशानी भगबिम्बाभमालिनी । कृत्तिका कृत्तिवस्त्रा च कृत्तिवासकुटुम्बिनी
    ॥ २२॥ कार्तिकेयप्रसूः कीर्तिः कीर्तिदा कीर्तिवर्धिनी । रोहिणि रोहिणिमूर्तिः रौहिणीयवरप्रदा ॥ २३॥ मृगावती
    मृगीनेत्री मृगलाञ्छनशेखरा । मृगराजगतिर्मृग्या मृगी मृगशिरोधरा ॥ २४॥ आर्द्रार्द्रवासना सान्द्रा पुनर्भूतिः
    पुनर्वसुः । पुनर्जया पुर्नर्दीना पुनर्वारा पुनर्वधूः ॥ २५॥ तिथ्या तिथिप्रिया तिथ्यापुष्पा पुष्पवती
    पुरी । अश्लेषाश्लेष रसिका मघा मोघावती सुहॄत् ॥ २६॥ पूर्वा पुर्वमुखी पौर्वा पुर्वाफाल्गुणिका तडित्
    । सौदामिनी सुदामा च सुधापानपरायणा ॥ २७॥ उत्तरा चोत्तराषा च सोत्तरोत्तरफाल्गुणी । हस्ता हस्तजनीत्री
    च खनित्री खनिरुत्तमा ॥ २८॥ चित्रा चित्राम्बरधरा स्वातिः स्वादुसुह्वीसुरी । विशाखा शाखिनी शाखा विशाखाजननी
    जडी ॥ २९॥ अरागिणी परा राग्यानुराधानुरुपूजिता । ज्येष्ठा श्रेष्ठा ज्येष्ठकला मूलं मूलधरागतिः ॥ ३०॥
    पूर्वाषाढा च या षण्डी चोत्तराषाढवल्लभा । श्रावणी श्रावणीमुर्तिः श्रवणेशी श्रुतिस्मृतिः ॥ ३१॥ विश्रवा
    सश्रवा श्रव्या श्रान्ता वैश्रवणीश्वरी । धनेश्वरी धनिष्ठा च धनिलोकवरप्रदा ॥ ३२॥ शतं शमा शतभिषक् कलिकल्मषनाशिनी
    । पूर्वाभाद्रपदा भाद्रभाद्रदा भाद्रकालिका ॥ ३३॥ श्मशानकालिका घोरा कालिका वीरकालिका । उत्तरोतरभद्रा
    च पदचोत्तरकालिका ॥ ३४॥ रेवती देवकी देवी श्यामा दक्षिणकालिका । सूर्यांशुसदृशी शूरी चन्द्रिका चन्द्रवल्लभा
    ॥ ३५॥ मङ्गली मङ्गलवती योद्धदा बुद्धिवर्धिनी । बुद्धोपसेविता बोधा जीवदा जीवसेविता ॥ ३६॥ जीवन्तो गुरुदेहा
    च वाग्विलासप्रदायिनी । शुक्रः शुक्रप्रसूः शुक्रो शुक्रलिप्ता च शुक्रला ॥ ३७॥ शुक्रात्मिका शुक्रपूज्या
    शुक्रनीतिविवर्धिनी । शुक्रप्रिया शुक्रजया शुक्रचन्दनचर्चिता ॥ ३८॥ श्रुक्राङ्गरागलिप्ताङ्गी श्रुक्रैकतिलकप्रिया
    । शनिप्रस्था मन्दगतिर्मन्दमाता मदालसा ॥ ३९॥ मन्दाकिनी च मदिरा मदिरारुणलोचना । रक्तबाहुर्हरीकेतुः कैतवी
    केतुमालिनी ॥ ४०॥ ध्रुवा ध्रुवजनित्री च ध्रुवमार्गप्रवर्त्तिनी । अनुसुयानुलोमा च लोआपमुद्रा च लोपिनी
    ॥ ४१॥ अगस्त्योपासिता विद्या नवग्रहसमर्चिता । प्रतिपद्विकलातिथ्या द्वितीया सैव शक्तिका ॥ ४२॥ तृतीया
    कारिणीमुर्तिश्चतुर्था वेदनायकी । पञ्चमी षोम पञ्चेसी षष्ठी षड्रसलोलुपा ॥ ४३॥ सप्तमी सप्तशाखा च सप्तर्षिजनसेविता
    । अष्टमी वसुपूज्या च नवमी नवरात्रिका ॥ ४४॥ नवदुर्गाश्रया मूर्तिः श्रीदुर्गा कालरात्रिका । दशमी दशमीपुज्या
    दशदिक्पालवन्दिता ॥ ४५॥ एकादशी रुद्रमूर्ति द्वादशी सूर्यवल्लभा । त्रयोदशी शिवप्रीता भुतेशी च चतुर्दशी
    ॥ ४६॥ अमावास्य पितृकला पूर्णिमा चन्द्रवन्दिता । विद्याधरी मेनकाच चित्रलेखाप्यलम्बुषा ॥ ४७॥ तिलोत्तमाक्षरा
    रम्भा रम्भोरू लम्भकुन्दला । ऊर्वशी शीतलाङ्गी च शूलिनी कुन्तकेश्वरी ॥ ४८॥ सुन्दोपसुन्दशमनी महिषसुरसूदिनी
    । रक्तबीजहरा रक्तचण्डमुण्डनिषूदिनी ॥ ४९॥ निशुम्भशुम्भहर्त्री च मधुकैटभनाशिनी । हिरण्याक्षहरी धूर्ती
    रावणान्तकरी धृतिः ॥ ५०॥ सीता साध्वी शीलवती शम्भरान्तकरी सती । शम्बरारिसहाया च शम्बरारिरिपुप्रिया ॥
    ५१॥ यक्षेश्वरी यक्षवधूर्यक्षिणी यक्षनायकी । रक्षोमाता राक्षसी च गान्धारी किन्नरीश्वरी ॥ ५२॥ पिशाची
    सुमुखी देवी मातङ्गी राजवल्लभा । उच्छिष्टमुखचाण्डाली राजमातङ्गिनी तुरी ॥ ५३॥ महापिशाचिनी देवी शङ्किनी
    शङ्खिनी शता । गुह्या गुह्यतमा गोप्त्री यक्षिणी गुह्यकेश्वरी ॥ ५४॥ सुलोचना सुगोत्रा च सुवस्त्रा स्वर्णकङ्कणा
    । सिद्धेस्वरी सिद्धमाता सिद्धलोकनिवासिनी ॥ ५५॥ अणिमा महिमा सिद्धिर्गरिमा लघिमा तथा । ईशत्वसिद्धिः
    सत्सिद्धिः सप्तसिद्धिः सदाश्रया ॥ ५६॥ सकाम्यसिद्धिः सिद्धेछा मन्त्रसिद्धिः सुसिद्धिदा । भूतेश्वरी
    महाराज्ञी भुतेश्वरविलासिनी ॥ ५७॥ भूतधात्रि भूतविद्या भूतवेतालसेविता । तपस्विनी तपस्या च यश्स्या च
    यसखिनी ॥ ५८॥ स्तम्भिनी मुखमुद्रा च महास्तम्भेश्वरेश्वरी । गतिस्तम्भकरी त्रेता बगला बगलामुखी ॥ ५९॥
    मोहिनी काममोहा च मोहा त्रिपुरमोहिनी । मारणीमुर्तिरीशानी मृत्युरूपा करालिनी ॥ ६०॥ केनाशवरदा केला जगदाकर्षिणीश्वरी
    । वशीकरणमूर्तिश्च राजलोकवशङ्करी ॥ ६१॥ उच्चाटनकरी मुद्रा शान्तिका शान्तिदायिनी । पौष्टिकी पुष्टिदा
    पुष्टिः सन्तानकतकस्थिता ॥ ६२॥ वन्ध्या च काकवन्ध्या च मृतवत्सा च वत्सला । वन्ध्यापुत्रप्रदा पौत्री
    पौत्रीपुत्रप्रियङ्करी ॥ ६३॥ मौक्तिकी मुक्तिदा मुक्तिर्मुक्ताहारविभूषणा । सरस्वती भारती च जडभावविनाशिनी
    ॥ ६४॥ उग्रताराभतारा च तिथितारोत्तरोत्तरा । नीली सुरार्चिता नीवी नीला नीलसरस्वती ॥ ६५॥ एका चैकजटजूटा
    महातारा जटालिनी । शैलदुर्गा शैलपुत्री ब्रह्मेशी ब्रह्मचारिणी ॥ ६६॥ चण्डघण्टा चण्डदुर्गा प्रचण्डा चण्डिका
    च्युता । कूष्माण्डी स्कन्दमाता च गुहदुर्गा सुदुर्जया ॥ ६७॥ कात्यायनी पुटदुर्गा कालदुर्गा कृकाटिकी
    । कालरात्री रत्नदुर्गा महागौरी गुणप्रिया ॥ ६८॥ देवदूती शिवादूती दूतदुर्गा पराम्बिका । वनदुर्गेति दुर्गा
    च पद्मदुर्गा पिलम्पिला ॥ ६९॥ श्रीविद्यावासिनी दुर्गा हिमाचलकृतालया । निषधाद्रिनिवासा च माल्यवद्गिरिवासिनी
    ॥ ७०॥ पारिजातगिरिस्था च गन्धमादनवासिनी । सह्यपर्वतसंस्था च कैलासाचलवासिनी ॥ ७१॥ मलयस्था लयातीता सप्तसागरवासिनी
    । सप्तद्वीपाश्रया पृथ्वी सप्तपातालवासिनी ॥ ७२॥ सप्तग्रहेश्वरी सप्तभुवनान्तरवासिनी । शिवतत्त्वमयी शक्तिः
    सदाशिवविलासिनी ॥ ७३॥ ईश्वराश्रयिणी काम्या शुद्धविद्या सदालसा । माया मायवती याम्या कलातत्त्वप्रकाशिनी
    ॥ ७४॥ विद्यावाग्वादिनी वाणी रागतत्त्वप्रमोदिनी । कालतत्त्वानुरागा च नियतिर्यतिवल्लभा ॥ ७५॥ पुरुषाकृतितत्त्वा
    च पुरुषार्थप्रदायिनी । प्रकृतिः प्रकृतिस्तुल्पा सकृतादेशदक्षिणा ॥ ७६॥ अहङ्कृतिरहन्तत्त्वा महतत्त्वभरालसा
    । बुद्धिर्मनोवेगवती त्वक् चक्षुर् ज्योतिरम्मयी ॥ ७७॥ श्रोत्रतत्त्वा च रसना रसाला रसपायिनी । घ्राणी
    मोहाकुला माद्री वामीशी पाणिपङ्कजा ॥ ७८॥ पादाश्रितधरा॥काशा पायुतत्त्वविचारिणी । तपस्तरसिकालिङ्ग्या
    लिङ्गामृतसुतर्पिता ॥ ७९॥ भगलिङ्गमयीमृर्तिर्भगलिङ्गसुखाश्रया । शब्दरूपा शब्दसुखा नादबिन्दुस्वरूपिणी
    ॥ ८०॥ स्पर्शप्रिया स्पर्शतत्त्वा रसतत्त्वा रसालसा । गन्धिनी च सुगन्धा च परमाकाररूपिणी ॥ ८१॥ शून्यरूपा
    शून्यमतिः शून्ययोनिः पराकृतिः । वह्निज्वाला महाज्वाला ज्वाललिङ्गनिवासिनी ॥ ८२॥ ज्वालामुखी कोटराक्षी
    ज्वालाजटिलरूपिणी । सलिलेशी जलेशा च हयोरूपा पयस्विनी ॥ ८३॥ पृथिवीपञ्चतत्वेशी षट्त्रिंशत्तत्त्वरूपिणी
    । वसन्तकुसुमश्रीश्च वसन्तर्तुसुखाश्रया ॥ ८४॥ ग्रीष्मज्वाला रविप्रीता वर्षावृष्टिविधायिनी । शरत्कुसुमसम्पश्च
    शारदा सिंहविष्टरा ॥ ८५॥ हेमन्तश्रीर्हैमवती हरिकान्ता हरेश्वरी । शिखरश्रीः शशिमुखी शरिकाशुकसेविता ॥
    ८६॥ यमुना यमिनी याम्या नर्मदा शतरुद्रिका । सरस्वती वेत्रवती रेवा रैवतकाश्रया ॥ ८७॥ विपाशा पराहन्त्री
    च भाग्यदा भगमालिनी । ऐरावती सरित्सिन्धुः शतद्रुः शतरुद्रिका ॥ ८८॥ वितस्ता सिन्धुरैन्द्री च विशोका
    पापनाशिनी । चन्द्रवती मधुमती सरयू चामरावती ॥ ८९॥ तापी हैमवती शीस चम्पा चम्पावती कुरू । कर्मनाशा च
    कावेरी कौशिकी कौशिकेश्वरी ॥ ९०॥ शुचिर्हैमवती हैमी गण्डकी देविका दितिः । अदितिर्विनता कद्रूः सभागा
    वीरभागिका ॥ ९१॥ सुधावती चर्मवती चर्मवत्यपि वेणुका । रत्नावती मणिमुखा नदीरूपा चिदीश्वरी ॥ ९२॥ वाराणसी
    शिवपुरी मयापुरी गुडी तथा । काञ्ची चोज्जयिनी प्रेय्या मथुराय च दुर्ल्लभा ॥ ९३॥ अयोध्यायां च सेव्या
    च द्वारिका दुर्गावासिनी । उड्डीयानावनिः कुड्या कामरूपनिवासिनी ॥ ९४॥ हिङ्गुलापीठ्वासा च शारदापीठवासिनी
    । कुब्जिका पाश्चिमाम्नायवीरपीठनिवासिनि ॥ ९५॥ श्यामाविद्या महाकाली दक्षिणाम्नायनायकी । उग्रचण्ड्युत्तराकाली
    उत्तराम्नायनायकी ॥ ९६॥ श्रीमहाषोडशी देवी परोर्ध्वाम्नायनायकी । पद्मावती नगविद्या चाधराम्नायनायकी ॥
    ९७॥ षडाम्नायेश्वरी देवी पराशक्तिः समातृका । अकारनायकी चाम्बा चानन्तानन्दविग्रहा ॥ ९८॥ अम्बिकाम्बालिकानन्दा
    चाद्रिजाद्रिनिषेविता । अलोपाकालितानल्पा चाजिताजसमर्चिता ॥ ९९॥ अलिमाम्सस्वरूपा च अवर्णाकृतिवर्णिनी
    । आद्यात्मरूपिणी चाज्ञा आनन्दरसतर्पिता ॥ १००॥ आकारजितसर्वाशा आपायितपदाश्रया । आचारपञ्चकप्रीता आकाराक्षरमतृका
    ॥ १०१॥ इन्द्रस्तुत्या महेन्द्राक्षी इन्दिरेन्दीवरप्रदा । इडामङ्गलसम्भ्रान्त चेतिहासकथास्मृतिः ॥ १०२॥
    इत्यपूजापरस्तृप्तिः इकाराक्षरमातृका । ईश्वरप्रेयसी इशा ईईकाराक्षराश्रया ॥ १०३॥ उमा चोल्का चारुहासा
    चोग्रवामाङ्गवासिनी । उल्लासनवरूपोक्षा विक्षाराक्षरविग्रहा ॥ १०४॥ ऊष्मा ऊती उरुमति ऊस्वरोहा स्वरोत्तमा
    । ऋभु ऋक्षेश्वरी ऋत्या ऋमात्रा लृकृतिस्तिथा ॥ १०५॥ लृमातृका विभूषाढ्या योण्ठस्वरविनायकी । एणांशुमुकुटा
    चेणि चैणनेत्रा सवर्णिका ॥ १०६॥ ऐङ्कारबीजभूषाढ्या ऐहिकामुष्मिकप्रदा । ॐकाररूपिणी और्वा अंस्वरूपा स्वरोत्थिता
    ॥ १०७॥ अःस्वरुपपरम्ब्रह्मरूपीणी स्वरनायकी । कनकाङ्गदभूषा च कनकी कनकावती ॥ १०८॥ कठोराङ्गी कृपाकारा
    मोक्षदा च कृपावती । काश्मीरी काश्यपाकारा कारीका कलिकावती ॥ १०९॥ कादम्बरी कश्मला च कुजस्था कश्मलावती
    । कामेश्वरी काञ्चनाभा कामुकी कामुकावती ॥ ११०॥ काञ्चुकी कुड्मला कन्था केतकी कनकावती । कपेश्वरी कोपवती
    कपिला कपिलावती ॥ १११॥ करञ्जकुञ्जसंस्था च कम्पिला कम्पिलावती । केयूरहारशोभाढ्या किंशुकी किंशुकावती
    ॥ ११२॥ कोकिलालापरसिका कोकिली कोमलावती । कलङ्करहिता केश्या कलविङ्ककुलावती ॥ ११३॥ कुलाकुलपदेशानी कुरुकुल्लाधिदेवता
    । ककारमातृकादेवी ककारमातृकावती ॥ ११४॥ खड्गहस्ता खर्पराशी खटिला खटिलावती । खेटेश्वरी खगगतिः खड्गिनी
    खेटकावती ॥ ११५॥ खञ्चनाक्षी खञ्जरीठी खंरूपा खञ्चनावती । गोप्त्री गोपालवनिता गोदातीत गयावती ॥ ११६॥ गणेशजननी
    गुर्वी गुणगम्या गुणावती । गरुन्मणिर्मरीचिश्च गणना गणकेश्वरी ॥ ११७॥ घुर्घुरा घरटा घारी घटिका घटिकावती
    । घनेश्वरी घनेहा च घनवाहा घनावती ॥ ११८॥ ङान्ता ङवर्णासंस्था च वर्गिणी च ङमातृका । चामीकरप्रभा चान्द्री
    चटुला चटुलावती ॥ ११९॥ चमत्कृतिश्चन्द्रहासा चन्द्रामोदा चलावती । चञ्चश्चकोरनयना चकोरी कोरकावती ॥ १२०॥
    चलत्पवनवेगा च चलिता चुलुकावती । छत्रेश्वरी छत्रधारा छात्रेक्षा छत्रिकावती ॥ १२१॥ छिन्नमस्ता छिन्नभूषा
    छटिला छटिलावती । जप्या जेया जयकरी जीवान्ता जीवनावती ॥ १२२॥ जगज्जैत्रा जगद्रक्षा जगती जयिकावती । जटिला
    जङ्गमेशानी जम्भाली जम्भलावती ॥ १२३॥ झङ्कारीर्जलदा छाया झिञ्झिणी झिञ्झिणावती । ञणुरूपा ञवर्णेशी ञकारा
    ञणिणावती ॥ १२४॥ टङ्कायुधा टिण्टिणिका टाङ्कारी टङ्कणावती । ठाकुरी ठकुरेशानी ठाक्षरा ठाक्षरावती ॥ १२५॥
    डिण्डीरवल्लभा डीणा डकारा डिण्डिमावती । ढत्कृतिर्ढुण्ढुपीढाक्षी ढकारमातृकावती ॥ १२६॥ णिणीवामा णवर्णेशी
    णवर्णाक्षरमातृका । तपनी तापनी त्र्यक्षी तपनीयसमप्रभा ॥ १२७॥ तोतुला तिलकद्योतिस्तोटिका तिलकावती । तौटिल्पराहिता
    तामी तमिका तुटिलावती ॥ १२८॥ तामरी तोमरकरा तौतिली तुलसी तुरी । तटाकधरणी तुट्यास्तुटिस्तुम्बुरुनिःस्वना
    ॥ १२९॥ ताण्डवीपरमप्रीता तुण्डघोणा तुलावती । तरी तामरसद्योतिस्तरणी तरुणावती ॥ १३०॥ त्रुटन्माला त्रुटिहारा
    त्रपाला चपलावती । स्थालिका स्थाण्डिला स्थाणुः स्थविरा स्थविरावती ॥ १३१॥ दमनी दमदा दारा दम्भोलीभृद्वरप्रदा
    । दण्डहस्ता दयार्द्रा च दोलारूढा दुरावती ॥ १३२॥ दुन्दुनी दुन्दुशमनी दाम्भिकी दाम्भिकावती । दीनैकजननी
    दान्ता दिण्डिनी दण्डकावती ॥ १३३॥ द्रोहिणी द्रोहदा हर्त्री द्रुहिका द्रुहिकावती । द्राक्षारसप्रिया
    द्रोता दकाराक्षरमातृका ॥ १३४॥ धन्या धनदसेव्या च धर्मिला धर्मिलावती । नर्मकर्मकरी नाली नलिनी नलिनावती
    ॥ १३५॥ नरनारीजनस्तुत्या नरनारायणप्रिया । नटेश्वरी नाट्यकरी नटिनी नटिकावती ॥ १३६॥ नागरजेन्द्रद्रयिता
    नागरी नागरावती । परम्परापीवराङ्गी पाठकी पीठिकावती ॥ १३७॥ पाठा पदाम्बरधरा पदिनी पद्दिनावती । पदोदकाप्रिया
    पात्री पात्रजा पात्रिकावती ॥ १३८॥ परात्मिका परम्ब्राह्मी परमेश्वरवल्लभा । फुण्टिका फाण्टजा फान्ता
    फट्वर्णाक्षरमातृका ॥ १३९॥ बलन्धुरा बलकरी बलिदानवनाशिनी । बलोत्तरा बन्धकरी बन्धकी बन्धकावती ॥ १४०॥
    बन्धुजा बान्धवप्रीता बर्बरी बर्बरावती । बगोला बन्धमुक्ता च बालकी बगलावती ॥ १४१॥ भगरूपा भगोल्लासा भागजा
    च भगावती । भगलिङ्गरसास्वादा भगलिङ्गामृतात्मिका ॥ १४२॥ भगरूपारतप्रीता भगिला भगलावती । मुद्रिका मोहमुद्रा
    च नवमुद्राप्रकाशिनी ॥ १४३॥ माद्यक्षीदुरसाक्षीवा मन्दुरा मोदकावती । मञ्जूषिका मञ्जुरवा मधुयष्टिर्मदावती
    ॥ १४४॥ मधुमत्ता मदोद्धसा मोदकी मोदकावती । मोदकाहारवरदा मोदिरा मद्रिकावती ॥ १४५॥ मनोवती मानसिकी मेठिका
    मण्ठिकावती । मैनाकवरदा मेधा मेरुजा मीनकावती ॥ १४६॥ यज्ञेश्वरीप्रिया यज्ञफलदा यज्ञकावती । यजमानप्रिया
    याज्ञयाजकी यज्ञकावती ॥ १४७॥ यष्टिहस्ता यन्त्रकरी याष्टिकी याष्टिकावती । यादस्पतिस्तुता योगजननी जनकावती
    ॥ १४८॥ रात्रिञ्चरक्षयकरी रात्रेश्वरनिषेविता । रोगकेहारिणी रावी रोलम्बा मधुरस्वना ॥ १४९॥ राजपूजा रटाला
    च रजसी राजिलावती । रजस्वला रजोरूपा रेतिजा रेतिलावती ॥ १५०॥ लक्ष्मिर्लालाकरी लोला लाङ्गलिशी लुलावती
    । लाक्ष्रसप्रभालुता लाङ्गलायुधसेविता ॥ १५१॥ ललज्जिह्वा च लोलाक्षी लास्यहास्य विचक्षणा । लम्बकेशावली
    लम्बरसना लम्बिकावती ॥ १५२॥ वशिनी वंशजा वंशी वसतिर्वशिकावती । शार्दूलचर्मवसना शम्बूककलिकावती ॥ १५२॥
    शिर्दूलमध्या सारेशी शमदा शमिकावती । शौर्यप्रदा सूरमाता शौरिकी शौरिकावती ॥ १५३॥ षोडशी षोडशकला षडङ्गा
    षोडशाक्षरी । सतीमाता सत्रसाला सारसी सरसावती ॥ १५४॥ सुरसङ्घार्चिता सभ्या सभासेव्या सभावती । समस्तसुख
    सौभाग्या समस्त दुरितापहा ॥ १५५॥ समस्तसाधकस्तुत्या सर्वमङ्गलदायिनी । सरोजिनीधवद्योतिः सागरैकसुतासुरा
    ॥ १५६॥ सुरापानरसाला च सरला सरलावती । हूहूप्रिया च हुं बीजा हरिणी नयनाहुतिः ॥ १५७॥ होतृप्रिया हव्यभक्ष्या
    हविषा हविषावती । हालाहलप्रिया होला हलिनी हटिलावती ॥ १५८॥ होममाला हरिप्रीता हकाराक्षरमातृका । हयुषा
    हाटकद्योतिर्हेमकान्तिर्हलावती ॥ १५९॥ लक्षःस्वरूपा सदसच्चिदानन्देश्वरेश्वरी । दयावती सत्यवती यशोवत्यमरावती
    ॥ १६०॥ प्रभावती धनवती क्रियावत्यकलावती । मोहवती महवती स्तुवन्ती मल्लिकावती ॥ १६१॥ पार्वती पावनवती
    देवता श्रीधरावती । ॐ ह्रीं श्रीं ब्लूं च फट् स्वाहा पद्मा पद्मावतीश्वरी ॥ १६२॥ इति नाम्नां सहस्त्रं
    ते कथितं वीरवन्दिते । समस्तमतृकापूर्णसर्वक्षतु मनोहरे ॥ १६३॥ समस्ततिथिसम्पूर्णं मूलमन्त्रैकसाधनम्
    । देवि गुह्यतमं गुह्यं भवसागरतारणम् ॥ १६४॥ पापापहं महापुण्यं पुण्यदं पुण्यवर्धनम् । ब्रह्महत्यादिपापानां
    प्रायश्चित्तफलप्रदम् ॥ १६५॥ यःपठेत्पाठयेद्वापि श्रावयेद्वा श
