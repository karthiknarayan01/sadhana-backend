id: katyayanyashtakam
category: stotram
name:
  english: katyayanyashtakam
  devanagari: कात्यायन्यष्टकम्
content:
  english: shriganeshaya namah | avarshisanjnam puramasti loke katyayani tatra virajate ya | prasadada
    ya pratibha tadiya sa chatrapuryam jayatiha geya || 1|| tvamasya bhinnaiva vibhasi tasyastejasvini
    dipajadipakalpa | katyayani svashritaduhkhahartri pavitragatri matimanadatri || 2|| brahmoruvetalakasimhadadhosubhairavairagniganabhidhena
    | samsevyamana ganapatyabhikhya yuja ca devi svaganairihasi || 3|| gotreshu jatairjamadagnibharadvaja'trisatkashyapakaushikanam
    | kaundinyavatsanvayajaishca viprairnijairnishevye varade namaste || 4|| bhajami gokshirakritabhisheke
    rak
  devanagari: श्रीगणेशाय नमः । अवर्षिसञ्ज्ञं पुरमस्ति लोके कात्यायनी तत्र विराजते या । प्रसाददा या प्रतिभा
    तदीया सा छत्रपुर्यां जयतीह गेया ॥ १॥ त्वमस्य भिन्नैव विभासि तस्यास्तेजस्विनी दीपजदीपकल्पा । कात्यायनी
    स्वाश्रितदुःखहर्त्री पवित्रगात्री मतिमानदात्री ॥ २॥ ब्रह्मोरुवेतालकसिंहदाढोसुभैरवैरग्निगणाभिधेन ।
    संसेव्यमाना गणपत्यभिख्या युजा च देवि स्वगणैरिहासि ॥ ३॥ गोत्रेषु जातैर्जमदग्निभारद्वाजाऽत्रिसत्काश्यपकौशिकानाम्
    । कौण्डिन्यवत्सान्वयजैश्च विप्रैर्निजैर्निषेव्ये वरदे नमस्ते ॥ ४॥ भजामि गोक्षीरकृताभिषेके रक्
