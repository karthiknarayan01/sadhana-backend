id: hanumatpanjarastotram
category: stotram
name:
  english: hanumatpanjarastotram
  devanagari: हनुमत्पन्जरस्तोत्रम्
content:
  english: vayunandana tatha nrisimhamukhapurvakam anjanasunuh paranca | garudamukha ca tatha harimarkata
    padam param | krodamukham padancantam ramakaryadhurandharah | tato ashvamukhancantam | sarvarakshasanashanah
    | sarvemukhashabdantah sarvam caturghyam tam gatah | shadange karangadayo hram shatkadibhissamyutam
    | nyasetsarva mananyadhih | tato dhyanam pathitvatu purvoktamargato vapi panjaramarabhettatah || 2||
    adau pranavamuccaryam vande haripadam tatah | uccarya markatapadam markatayeti coccaret || 3|| agnijayam
    samuccarya dvadasharno mahamanuh || 4|| shirah patu mama sada sarvasaukhyapradayakah || 5|| adau pranavamuccarya
    kapibijam tatoccaret | nrisimhabijamuccarya garudanca samuccaret || 6|| varahabijamuccarya hayagrivam
    tatoccaren | namah padam tatoccarya sa pancasya mahakapeh | caturdasharnamantro'yam mukham payatsada
    mama || 7|| adau pranavamuccarya namo bhagavate padam | pancavadanaya coccarya purvamukheti coccaret
    || 8|| vanaram bijamuccarya kapimukhaya coccaret | sarvashatruharayeti mahabalaya coccaret || 9||
    agnijayam tatoccarya saptatrimshaksharabhidhah | kantham mama sada patu sarvashatruvinashakah || 10||
    uccaryam pranavam cadau namo bhagavatetica | narasimha mahabija karalapadamuccaret || 11|| nrisimhaya
    padam coktya sakalabhutapretaca | pishaccabrahmarakshasa pramathanaya padam vadet || 12|| agnijayam
    tatoccarya vasu vedarnako manuh | hridayam me sada patu sarvashatruvinashakah || 13|| om namo bhagavateti
    pancavadanaya tatah | pashcimamukheti coccarya garudam bijamuccaret || 14|| viragarudaya mahabalayeti
    padam tatah | sarvanaga pramathana yante sakalavisheti || 15|| haraya svaha tvam tatah vedabhyaksharasamyutah
    | hanumanmamodaram patu sarvaroganibarhanah || 16|| om namo bhagavateti pancavadanaya tatah | uttaramukhe
    cojcaryam krodavagbijamuccaret || 17|| adivaraha sarvasampatpradaya nidhi bhumica | pradaya pashcajjvareti
    roga nikrintana svaha || 18|| nabhim patu mama sada sukhasaubhagya hetukah | netra banarnako manoh
    pashcatpranavamuccaret || 19|| om namo bhagavate pancavadanaya padam tatah | urdhvamukhetyante hayabijam
    tatah param || 20|| hayagrivaya sakalapradaya sakaletica | janavashikaranaya sakala danavantakaya
    || 21|| pashcatprajnaya svaheti shatpancashadvarnako manuh | mama janudvayam patu sarva rakshasanashakah
    || 22|| om ca hrimityayam coktva namo bhagavate tatah | brahmastrasamharakaya rakshasakulanashayeti
    || 23|| pataka hanumateti mayabijatrayam tatah | krodastra vahnijayam tam manuh padadvayam mama ||
    24|| hram namah pancavaktraya nabhidesham sada mama | hrim namah pancavaktraya patu janghadvayam mama
    | hrum namah pancavaktraya patu janudvayam mama | hraim namah pancavaktraya padadvandvam sadavatu
    | hraum namah pancavaktraya katidesham sadavatu | hrah namah pancavaktraya codaram patu sarvada |
    aim namah pancavaktraya hridayam patu sarvada | klam namah pancavaktraya bahuyugmam sadavatu | klim
    namah pancavaktraya karayugmam sada mama | klum namah pancavaktraya kanthadesham sadavatu | klaim
    namah pancavaktraya cubukam me sadavatu | klaum namah pancavaktraya patu coshthadvayam mama | klah
    namah pancavaktraya netrayugmam sadavatu | ram namah pancavaktraya shotrayugmam sadavatu | rim namah
    pancavaktraya phalam patu mahabalah | rum namah pancavaktraya shirah payatsada mama | raim namah pancavaktraya
    shikham mama sadavatu | raum namah pancavaktraya murdhanam patu sarvada | rah namah pancavaktraya
    mukham patu sada mama | kshram namah pancavaktraya shrotrayugmam sadavatu | kshrim namah pancavaktraya
    netrayugmam sada mama | kshrum namah pancavaktraya patu coshthadvayam mama | kshraim namah pancavaktraya
    bhriyugmam patu sarvada | kshraum namah pancavaktraya nasikam patu sarvada | kshah namah pancavaktraya
    kantham patu kapishvarah | glam namah pancavaktraya patu vakshasthalam mama | glim namah pancavaktraya
    bahuyugmam sada mama | glum namah pancavaktraya karayugmam sadavatu | glaim namah pancavaktraya mama
    patu valitraya | glaum namah pancavaktraya coradam patu sarvada | glah namah pancavaktraya nabhim
    patu sada mama | am namah pancavaktraya vanaraya katim mama | im namah pancavaktraya uruyugmam sadavatu
    | um namah pancavaktraya janudvandvam sada mama | aim namah pancavaktraya gulphadvandvam sadavatu
    | aum namah pancavaktraya padadvandvam sadavatu | ah namah pancavaktraya sarvangani sadavatu || 25||
    vanarah purvatah patu dakshine narakesarih | praticyam patu garuda uttare patu sukarah | urdhvam hayananah
    patu sarvatah patu mrityuha || 26|| vanarah purvatah patu agneyyam vayunandanah | dakshine patu hanuman
    nirrite kesaripriyah || 27|| praticyam patu daityarih vayavyam patu mangalah | uttare ramadasastu
    nimnam yuddhavisharadah || 28|| urdhve ramasakhah patu patale ca kapishvarah | sarvatah patu pancasyah
    sarvarogavikrintanah || 29|| hanumana purvatah patu dakshine pavanatmajah | patu pratici makshaghno
    udicyam sagaratarakah || 30|| urdhvam kesarinandanah patvadhastadvishnubhaktah | patu madhyapradeshetu
    sarvalanka vidahakah || 31|| evam sarvato mam patu pancavaktrah sada kapih || 32|| sugrivasacivah
    patu mastakam mama sarvada | vayunandanah phalam me mahavirah bhrumadhyamam || 33|| netre chayapaharica
    patu shrotre plavangamah | kapolau karnamuleca patu shriramakinkarah || 34|| nasagramanjanasunuh patu
    vaktrah harishvarah | patu kanthaca daityarih skandhau patusurarcitah || 35|| janau patu mahatejah
    kurparau caranayudhah | nakhan nakhayudhah patu kaksham patu kapishvarah || 36|| sitashokapaharitu
    stanau patu nirantaram | lakshmanapranadata'sau kukshi patvanisham mama || 37|| vakshau mudrapaharica
    patu bhujayudhah | lakhinibhanjanah patu prishthadeshe nirantaram || 38|| nabhinca ramadasastu katim
    patvanilatmajah | guhyam patu mahaprajnah sandhau patu shivapriyah || 39|| uruca januni patu lankaprasadabhanjanah
    | janghau patu kapishreshthah gulpho patu mahabalah || 40|| acaloddharakah patu padau bhaskarasannibhah
    | anganyamitasatvadhyah patu padangulissada || 41|| sarvangani mahashurah patu mam romavan sada |
    bharyam patu mahatejah putran patu nakhayudhah || 42|| pashun pancananah patu kshetram patu kapishvarah
    | bandhun patu raghushreshthah dasah pavanasambhavah || 43|| sita shokapahari sah grihan mama sadavatu
    || 44|| hanumatpanjaram yastu pathedvidvan vicakshanah | sa esha purushashreshtho bhakti muktinca
    vindati || 45|| kalatraye'pyekakale pathenmasatrayam narah | sarvashatrun kshane jitva svayanca vijayi
    bhavet || 46|| ardharatrau jale sthitva saptavaram pathedyadi | kshayapasmarakushthadi tapajvaranivaranam
    || 47|| arkavare'shvatthamule sthitva pathati yah puman | sa puman shriyamapnoti sangrame vijayi bhavet
    || 48|| anena mantritam capi yah pibet rogapiditah | sa naro roganirmuktah sukhi bhavati nishcayah
    || 49|| yo nityam dhyayedyastu sarvamantravinirmitam | tam drishtva devatassarve namasyanti kapishvaram
    || 50|| rakshasastu palayante bhuta dhavanti sarvatah || 51|| idam panjaramajnatva yo japanmantranayakam
    | na shighram phalamapnoti satyam satyam mayoditam || 52|| trikalamekakalam va panjaram dharayecchubham
    | panjaram vidhivajjaptva stotraih vedantasammitaih | toshayedanjanasunum sarvarakshasamardanam ||
    53|| itidam panjaram yastu pancavaktrahanumatah | dharayet shravayedvapi kritakrityo bhavennarah ||
    54|| iti shriparasharasamhitayam shriparasharamaitreyasamvade shripancamukhahanumatpanjaram nama catussaptatitamah
    patalah |
  devanagari: वायुनन्दन तथा नृसिंहमुखपूर्वकं अञ्जनासूनुः परञ्च । गरुडमुख च तथा हरिमर्कट पदं परम् । क्रोडमुखं
    पदञ्चान्तं रामकार्यधुरन्धरः । ततो अश्वमुखञ्चान्तम् । सर्वराक्षसनाशनः । सर्वेमुखशब्दान्ताः सर्वं चतुर्घ्यं
    तं गताः । षडङ्गे कराङ्गादयो ह्रां षट्कादिभिस्संयुतम् । न्यसेत्सर्व मनन्यधीः । ततो ध्यानं पठित्वातु
    पूर्वोक्तमार्गतो वापि पञ्जरमारभेत्ततः ॥ २॥ आदौ प्रणवमुच्चार्यं वन्दे हरिपदं ततः । उच्चार्य मर्कटपदं
    मर्कटायेति चोच्चरेत् ॥ ३॥ अग्निजायां समुच्चार्य द्वादशार्णो महामनुः ॥ ४॥ शिरः पातु मम सदा सर्वसौख्यप्रदायकः
    ॥ ५॥ आदौ प्रणवमुच्चार्य कपिबीजं ततोच्चरेत् । नृसिंहबीजमुच्चार्य गारुडञ्च समुच्चरेत् ॥ ६॥ वराहबीजमुच्चार्य
    हयग्रीवं ततोच्चरेन् । नमः पदं ततोच्चार्य स पञ्चास्य महाकपेः । चतुर्दशार्णमन्त्रोऽयं मुखं पायात्सदा
    मम ॥ ७॥ आदौ प्रणवमुच्चार्य नमो भगवते पदं । पञ्चवदनाय चोच्चार्य पूर्वमुखेति चोच्चरेत् ॥ ८॥ वानरं बीजमुच्चार्य
    कपिमुखाय चोच्चरेत् । सर्वशत्रुहरायेति महाबलाय चोच्चरेत् ॥ ९॥ अग्निजायां ततोच्चार्य सप्तत्रिंशाक्षराभिधः
    । कण्ठं मम सदा पातु सर्वशत्रुविनाशकः ॥ १०॥ उच्चार्यं प्रणवं चादौ नमो भगवतेतिच । नारसिंह महाबीज करालपदमुच्चरेत्
    ॥ ११॥ नृसिंहाय पदं चोक्त्या सकलभूतप्रेतच । पिशाच्चब्रह्मराक्षस प्रमथनाय पदं वदेत् ॥ १२॥ अग्निजायां
    ततोच्चार्य वसु वेदार्णको मनुः । हृदयं मे सदा पातु सर्वशत्रुविनाशकः ॥ १३॥ ॐ नमो भगवतेति पञ्चवदनाय ततः
    । पश्चिममुखेति चोच्चार्य गारुडं बीजमुच्चरेत् ॥ १४॥ वीरगरुडाय महाबलायेति पदं ततः । सर्वनाग प्रमथना
    यान्ते सकलविषेति ॥ १५॥ हराय स्वाहा त्वं ततः वेदाभ्यक्षरसंयुतः । हनुमन्ममोदरं पातु सर्वरोगनिबर्हणः
    ॥ १६॥ ॐ नमो भगवतेति पञ्चवदनाय ततः । उत्तरमुखे चोज्चार्यं क्रोडवाग्बीजमुच्चरेत् ॥ १७॥ आदिवाराह सर्वसम्पत्प्रदाय
    निधि भूमिच । प्रदाय पश्चाज्ज्वरेति रोग निकृन्तन स्वाहा ॥ १८॥ नाभिं पातु मम सदा सुखसौभाग्य हेतुकः ।
    नेत्र बाणार्णको मनोः पश्चात्प्रणवमुच्चरेत् ॥ १९॥ ॐ नमो भगवते पञ्चवदनाय पदं ततः । ऊर्ध्वमुखेत्यन्ते
    हयबीजं ततः परम् ॥ २०॥ हयग्रीवाय सकलप्रदाय सकलेतिच । जनवशीकरणाय सकल दानवान्तकाय ॥ २१॥ पश्चात्प्राज्ञाय
    स्वाहेति षट्पञ्चाशद्वर्णको मनुः । मम जानुद्वयं पातु सर्व राक्षसनाशकः ॥ २२॥ ॐ च ह्रीमित्ययं चोक्त्वा
    नमो भगवते ततः । ब्रह्मास्त्रसंहारकाय राक्षसकुलनाशयेति ॥ २३॥ पताक हनुमतेति मायाबीजत्रयं ततः । क्रोडास्त्र
    वह्निजायां तं मनुः पादद्वयं मम ॥ २४॥ ह्रां नमः पञ्चवक्त्राय नाभिदेशं सदा मम । ह्रीं नमः पञ्चवक्त्राय
    पातु जङ्घद्वयं मम । ह्रूं नमः पञ्चवक्त्राय पातु जानुद्वयं मम । ह्रैं नमः पञ्चवक्त्राय पादद्वन्द्वं
    सदावतु । ह्रौं नमः पञ्चवक्त्राय कटिदेशं सदावतु । ह्रः नमः पञ्चवक्त्राय चोदरं पातु सर्वदा । ऐं नमः
    पञ्चवक्त्राय हृदयं पातु सर्वदा । क्लां नमः पञ्चवक्त्राय बाहुयुग्मं सदावतु । क्लीं नमः पञ्चवक्त्राय
    करयुग्मं सदा मम । क्लूं नमः पञ्चवक्त्राय कण्ठदेशं सदावतु । क्लैं नमः पञ्चवक्त्राय चुबुकं मे सदावतु
    । क्लौं नमः पञ्चवक्त्राय पातु चोष्ठद्वयं मम । क्लः नमः पञ्चवक्त्राय नेत्रयुग्मं सदावतु । रां नमः पञ्चवक्त्राय
    शोत्रयुग्मं सदावतु । रीं नमः पञ्चवक्त्राय फालं पातु महाबलः । रूं नमः पञ्चवक्त्राय शिरः पायात्सदा मम
    । रैं नमः पञ्चवक्त्राय शिखां मम सदावतु । रौं नमः पञ्चवक्त्राय मूर्धानं पातु सर्वदा । रः नमः पञ्चवक्त्राय
    मुखं पातु सदा मम । क्ष्रां नमः पञ्चवक्त्राय श्रोत्रयुग्मं सदावतु । क्ष्रीं नमः पञ्चवक्त्राय नेत्रयुग्मं
    सदा मम । क्ष्रूं नमः पञ्चवक्त्राय पातु चोष्ठद्वयं मम । क्ष्रैं नमः पञ्चवक्त्राय भॄयुग्मं पातु सर्वदा
    । क्ष्रौं नमः पञ्चवक्त्राय नासिकां पातु सर्वदा । क्षः नमः पञ्चवक्त्राय कण्ठं पातु कपीश्वरः । ग्लां
    नमः पञ्चवक्त्राय पातु वक्षस्थलं मम । ग्लीं नमः पञ्चवक्त्राय बाहुयुग्मं सदा मम । ग्लूं नमः पञ्चवक्त्राय
    करयुग्मं सदावतु । ग्लैं नमः पञ्चवक्त्राय मम पातु वलित्रय । ग्लौं नमः पञ्चवक्त्राय चोरदं पातु सर्वदा
    । ग्लः नमः पञ्चवक्त्राय नाभिं पातु सदा मम । आं नमः पञ्चवक्त्राय वानराय कटिं मम । ईं नमः पञ्चवक्त्राय
    ऊरुयुग्मं सदावतु । ऊं नमः पञ्चवक्त्राय जानुद्वन्द्वं सदा मम । ऐं नमः पञ्चवक्त्राय गुल्फद्वन्द्वं सदावतु
    । औं नमः पञ्चवक्त्राय पादद्वन्द्वं सदावतु । अः नमः पञ्चवक्त्राय सर्वाङ्गानि सदावतु ॥ २५॥ वानरः पूर्वतः
    पातु दक्षिणे नरकेसरिः । प्रतीच्यां पातु गरुड उत्तरे पातु सूकरः । ऊर्ध्वं हयाननः पातु सर्वतः पातु मृत्युहा
    ॥ २६॥ वानरः पूर्वतः पातु आग्नेय्यां वायुनन्दनः । दक्षिणे पातु हनुमान् निरृते केसरीप्रियः ॥ २७॥ प्रतीच्यां
    पातु दैत्यारिः वायव्यां पातु मङ्गलः । उत्तरे रामदासस्तु निम्नं युद्धविशारदः ॥ २८॥ ऊर्ध्वे रामसखः पातु
    पाताले च कपीश्वरः । सर्वतः पातु पञ्चास्यः सर्वरोगविकृन्तनः ॥ २९॥ हनुमान पूर्वतः पातु दक्षिणे पवनात्मजः
    । पातु प्रतीचि मक्षघ्नो उदीच्यां सागरतारकः ॥ ३०॥ ऊर्ध्वं केसरीनन्दनः पात्वधस्ताद्विष्णुभक्तः । पातु
    मध्यप्रदेशेतु सर्वलङ्का विदाहकः ॥ ३१॥ एवं सर्वतो मां पातु पञ्चवक्त्रः सदा कपिः ॥ ३२॥ सुग्रीवसचिवः
    पातु मस्तकं मम सर्वदा । वायुनन्दनः फालं मे महावीरः भ्रूमध्यमम् ॥ ३३॥ नेत्रे छायापहारीच पातु श्रोत्रे
    प्लवङ्गमः । कपोलौ कर्णमूलेच पातु श्रीरामकिङ्करः ॥ ३४॥ नासाग्रमञ्जनासूनुः पातु वक्त्रः हरीश्वरः । पातु
    कण्ठच दैत्यारिः स्कन्धौ पातुसुरार्चितः ॥ ३५॥ जानौ पातु महातेजः कूर्परौ चरणायुधः । नखान् नखायुधः पातु
    कक्षं पातु कपीश्वरः ॥ ३६॥ सीताशोकापहारीतु स्तनौ पातु निरन्तरम् । लक्ष्मणप्राणदाताऽसौ कुक्षि पात्वनिशं
    मम ॥ ३७॥ वक्षौ मुद्रापहारीच पातु भुजायुधः । लखिणीभञ्जनः पातु पृष्ठदेशे निरन्तरम् ॥ ३८॥ नाभिञ्च रामदासस्तु
    कटिं पात्वनिलात्मजः । गुह्यं पातु महाप्राज्ञः सन्धौ पातु शिवप्रियः ॥ ३९॥ ऊरूच जानुनी पातु लङ्काप्रासादभञ्जनः
    । जङ्घौ पातु कपिश्रेष्ठः गुल्फो पातु महाबलः ॥ ४०॥ अचलोद्धारकः पातु पादौ भास्करसन्निभः । अङ्गान्यमितसत्वाढ्यः
    पातु पादाङ्गुलिस्सदा ॥ ४१॥ सर्वाङ्गानि महाशूरः पातु मां रोमवान् सदा । भार्यां पातु महातेजः पुत्रान्
    पातु नखायुधः ॥ ४२॥ पशून् पञ्चाननः पातु क्षेत्रं पातु कपीश्वरः । बन्धून् पातु रघुश्रेष्ठः दासः पवनसम्भवः
    ॥ ४३॥ सीता शोकापहारी सः गृहान् मम सदावतु ॥ ४४॥ हनूमत्पञ्जरं यस्तु पठेद्विद्वान् विचक्षणः । स एष पुरुषश्रेष्ठो
    भक्ति मुक्तिञ्च विन्दति ॥ ४५॥ कालत्रयेऽप्येककाले पठेन्मासत्रयं नरः । सर्वशत्रून् क्षणे जित्वा स्वयञ्च
    विजयी भवेत् ॥ ४६॥ अर्धरात्रौ जले स्थित्वा सप्तवारं पठेद्यदि । क्षयापस्मारकुष्ठादि तापज्वरनिवारणम्
    ॥ ४७॥ अर्कवारेऽश्वत्थमूले स्थित्वा पठति यः पुमान् । स पुमान् श्रियमाप्नोति सङ्ग्रामे विजयी भवेत् ॥
    ४८॥ अनेन मन्त्रितं चापि यः पिबेत् रोगपीडितः । स नरो रोगनिर्मुक्तः सुखी भवति निश्चयः ॥ ४९॥ यो नित्यं
    ध्यायेद्यस्तु सर्वमन्त्रविनिर्मितम् । तं दृष्ट्वा देवतास्सर्वे नमस्यन्ति कपीश्वरम् ॥ ५०॥ राक्षसास्तु
    पलायन्ते भूता धावन्ति सर्वतः ॥ ५१॥ इदं पञ्जरमज्ञात्वा यो जपन्मन्त्रनायकम् । न शीघ्रं फलमाप्नोति सत्यं
    सत्यं मयोदितम् ॥ ५२॥ त्रिकालमेककालं वा पञ्जरं धारयेच्छुभम् । पञ्जरं विधिवज्जप्त्वा स्तोत्रैः वेदान्तसम्मितैः
    । तोषयेदञ्जनासूनुं सर्वराक्षसमर्दनम् ॥ ५३॥ इतीदं पञ्जरं यस्तु पञ्चवक्त्रहनूमतः । धारयेत् श्रावयेद्वापि
    कृतकृत्यो भवेन्नरः ॥ ५४॥ इति श्रीपराशरसंहितायां श्रीपराशरमैत्रेयसंवादे श्रीपञ्चमुखहनुमत्पञ्जरं नाम
    चतुस्सप्ततितमः पटलः ।
