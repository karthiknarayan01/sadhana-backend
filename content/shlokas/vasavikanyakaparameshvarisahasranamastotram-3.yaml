id: vasavikanyakaparameshvarisahasranamastotram-3
category: sahasranama
name:
  english: vasavikanyakaparameshvarisahasranamastotram 3
  devanagari: वासवीकन्यकापरमेश्वरीसहस्रनामस्तोत्रम् ३
content:
  english: indimprathamalaka | kripalinta kripavartinirmaninupuramandita || 11|| trimurtipadavidatri trijagatrakshanakadara
    | sarvabhadrasvarupa ca sarvabhadrapradayini || 12|| manikancanamanjira arunanghrisaroruha | shunyamadhya
    sarvamanya dhanya'nanya samadbhuta || 13|| vishnuvardhanasammohakarini papavarini | sarvasampatkari
    sarvarogashokanivarini || 14|| atmagauravasaujanyabodhini manadayini | manusharakshakari bhuktimuktidatri
    shivaprada || 15|| nissama niradhika caiva yogamaya hyanuttama | mahamaya mahashaktirharivargapaharini
    || 16|| bhanukotisahasrabha mallicampakagandhika | ratnakancanakotiracandrakanthayudalaka || 17||
    candrabimbasamasyanga mriganapi visheshaka | ragasvarupa pashadya agnipujya caturbhuja || 18|| nasacampeyapushpa
    ca nasamauktikasujjvala | guruvindakapola ca indurocismitancita || 19|| vina nishvanasallabha agnisuttam
    shukancita | gudhakulpa jaganmaya manisimhasanasthita || 20|| aprameya svaprakasha shishteshta shishtapujita
    | citshakticetanakara manovacamagocara || 21|| caturdashavidyarupa caturdashakalamayi | mahacatushshashtikotiyogini
    ganasevita || 22|| cinmayi paramananda vijnanaganarupini | dhyanarupa dhyeyakara dharmadharmavidayini
    || 23|| carurupa caruhasa carucandrakaladhara | caracarajagannetri cakrarajaniketana || 24|| brahmadikasrishtikartri
    goptri tejasvarupini | bhanumandalamadhyastha bhagavati sadashiva || 25|| abrahmakotijanani purusharthapradambika
    | adimadhyantarahita harirbrahmeshvararcita || 26|| narayani nadarupa sampurna bhuvaneshvari | rajarajarcita
    ramya rancani munirancini || 27|| kalyani lokavarada karunarasamanjula | varada vamanayana maharajni
    nirishvari || 28|| rakshakari rakshasaghni tushtarajamadapaha | vidhatri vedajanani ragacandrasamanana
    || 29|| tantrarupa tantrini ca tantravedya tantrika | shastrarupa shastradhara sarvashastrasvarupini
    || 30|| ragabhasha manashcabha pancabhutamayi tatha | pancatanmatrasayaka krodhakara kushancita ||
    31|| nijakantiparacandamandala akhandalarcita | kadambamayatatanka padmacampeyakandila || 32|| sarvavidyankurashankyadantapanktitvayancita
    | sarasallabhamadhuryajitavanivipancika || 33|| kraiveyamanicintakakurmaprishthapadatvaya | nakhakantiparicchinna
    samatravatatamoguna || 34|| manikinkinika divyatrishna damabhushita | rambhastambhamanojnati manojnarutyancita
    || 35|| padashobha jitambhoja mahagiripurishvari | devaratnagrihantastha sarvabrahmasamasthita ||
    36|| mahapadmavanasthana kadambavanavasini | nijamshabhagasarollasi lakshmi gauri sarasvati || 37||
    manjukunjanamanimanjira alankritapadambuja | hamsika mandagamana mahasaudaryavaradhi || 38|| anavadyarunakanya
    ca akanya gunaturaga | sampaddatra vishvaneyaukadevavratasusevita || 39|| geyacakraratharudha mantrinyamba
    samarcita | kamada anavatyangi devarshistutavaibhava || 40|| vighnyantrasamubhetri karotyanaikamadava
    | sankalpamatranirdhuta vishnuvardhanavaibhava || 41|| murtitraya sadasevya samayastha niramaya |
    muladharabhavabrahmagranthisambhedini para || 42|| manipurantaravasa vishnugranthivibhedini | ajnacakragatamaya
    rudragranthivimokshada || 43|| sahasrarasamarudha sudhasarapravarshini | dashatrekasamabhasa shatcakroparivasini
    || 44|| bhaktivasya bhaktigamya bhaktarakshanakadara | bhaktipriya bhadramurti bhaktasantoshadayini
    || 45|| sarvadakundalinyamba saradevya ca sharmada | sadhvi shrikariyutara ca shrikari shambhumodita
    || 46|| sharaccandramukhi shishta nirakara nirakula | nirlepa nistula caiva niravadya nirantara ||
    47|| nishkarana nishkalanka nityabuddha nirishvari | niraga ragamadana nirmada madanashini || 48||
    nirmama samaya canya ananya jagadishvari | niroga nirupadhishca nirananda nirashraya || 49|| nityamukta
    nigamama nityashuddha niruttama | nirvyadhi ca vyadhimadana nishkriya nirupaplava || 50|| nirahankara
    ca nishcinta nirmoha mohanashini | nirpada mamatahantri nishpapa papanashini || 51|| abheda ca sakshirupa
    nirbheda bhedanashini | nirnasha nashamathani nishpapapapaharini || 52|| nilaveni niralamba nirapaya
    bhavapaha | nihsandeha samshayajni nirlopa lopaharini || 53|| shukaprada dushtadura nirvikalpa niradyaya
    | sarvajnana duhkhahantri samanadhikavarjita || 54|| sarvashaktimayi sarvamangala sadgatiprada | sarveshvari
    sarvamayi sarvatvasvarupini || 55|| mahamaya mahashaktih mahasatva mahabala | mahavirya mahabuddhirmaheshvaryamahagatih
    || 56|| manonmanimahadevi mahapatakanashini | mahapujya mahasiddhih mahayogishvareshvari || 57|| mahatantra
    mahamantra mahayantra mahasana | mahayagakramaradhya mahayogasamarcita || 58|| prakritirvikritirvidya
    sarvabhutahitaprada | sucisvaha ca dhanya ca svadha sudha hiranmayi || 59|| manya shraddha vibhutishca
    brahmavishnushivatmika | dipta kanta ca kamakshi nityapushta vibhavari || 60|| anugrahaprada rama
    anaka lokavallabha | amrita ca shokamurtirlokaduhkhavinashini || 61|| karunadharmanilaya padmini padmakandini
    | hladajanani pushta padmamaladharadbhuta || 62|| padmakshi padmamukhi ca lokamatendushitala | suprasanna
    punyakanta prasadapi mukhiprabha || 63|| ardhacandrasudala ca cara vaishyasahodari | vaishyasaukhyapradatushtih
    shiva daridryanashini || 64|| shivadatri ca vimala svamini pritipushkala | aryavyamasati saumya shrida
    mangaladayini || 65|| bhaktakehaparananda siddhirupa vasuprada | bhaskari jnananilaya lalitangi yashasvini
    || 66|| trikalajno'rusampanna sarvakalasvarupini | daridryadhvamsini kanti sarvo'bhadranivarini ||
    67|| annada annadatri ca acyutanandakarini | anantacyuta vyupta vyaktavyaktasvarupini || 68|| sharadambhoja
    pratyakshi sharaccandrarucisthita | jaya jayapakasha avakashasvarupini || 69|| akashamayapadmastha
    anadya satyo nija | apalam candika agadha atmajna ca atmagocara || 70|| adyanadyadidevi ca adityacayabhasvara
    | kartasvaramanojnangi kalakanthanibhasvara || 71|| atmano atmadayita adharacatmarupini | anishakashyabhaishani
    ishvaraishvaryadayini || 72|| indrasurindumata ca indriya indumandita | indubimbasamashriya indriyanam
    vashankari || 73|| eka caika vira ca ekakaraikavaibhava | ekatrayasupujya ca ekanurekadayini || 74||
    varnatma varnanilaya shodashasvararupini | kanya kritva maharatrirmoharatri sulocana || 75|| kamaniya
    kaladhara kamadhu varnamalini | kashmiratravaliptangi kamya ca kamalarcita || 76|| manikyabhasvalankara
    kanaga kanagaprada | kambugriva kripayukta kishori ca lalatini || 77|| kalastha ca nimesha ca kaladatri
    kalavati | kalajna kalamata ca kalavetri kalavani || 78|| kalada kalaha kirtih kirtistha kirtivardhini
    | kirtijna kirtitaguna keshavanandakarini || 79|| kumari kumudabha ca karmada karmabhanjani | kaumudi
    kumudananda kalangi kalabhushana || 80|| kapardini komalangi kripasindhuh kripamayi | kanjastha kanjavadana
    kutasthorugirishvari || 81|| kundacustha ca kauveri kalikalmashanashini | kashyapi kamarupa ca kanjakanjalkacarcita
    || 82|| kanhanadhvantva netri ca khesari katkayukkari | siddhajna siddhitapada cintastha cintasvarupini
    || 83|| cancakabhamanoyangi carucampakamalini | candi ca candarupa ca caitanyakanagehini || 84|| cidananda
    cidahatara cidakara cidalaya | capalambangalatika candrakotishubhakara || 85|| cintamanigunadhara
    cintamanivibhushita | bhaktacintamanilata cintamanisumantira || 86|| carucandanaliptangi catura caturanana
    | cakrada cakradhari ca carucamaravijita || 87|| bhaktanam chatrarupa ca chatracchayakritalaya | jagajiva
    jagaddatri jagadanandakarini || 88|| janani ca yajnarata jayanti japayajnaparayana | yajnada yajnaphalada
    yajnasthapakritalaya || 89|| yajnabhotri yajnarupa yajnavighnavinashini | karmayoga karmarupa karmavighnavinashini
    || 90|| karmada karmaphalada karmasthanakritalaya | kalushya bhedasaridra sarvakarmasamancita || 91||
    jayastha jayada jaitri jivita jayakarini | yashodayakasamrajyani yashodanandakarini || 92|| jvalini
    jvalini jvala jvalatbhavagasannibha | jvalamukhi janananda jambudvipakritalaya || 93|| janmada janmaha
    janma janmapurjanmaranjini | jambunathasamanangi jambunathavibhushana || 94|| jnatita jatita jati
    jnanada jnaṟnagocara | jnanaha jnanarupa ca jnanavijnanashalini || 95|| japapushpasamanoshtya japakusumashobhita
    | jinajaitri jinatara jinmata jineshvari || 96|| tirthankari niradhara amalambaradharini | shambhukotiduradharsha
    vishnuvardhanamardini || 97|| samudrakotigambhira vayukotimahabala | suryakotipratikasa yamakotiparakrama
    || 98|| kamadhukkotiphalada cakrakotisurajyuta | ratikotisulavanya padmakotinibhanana || 99|| prithvikotijanadhara
    agnikotibhayankari | ishanadi satshaktirdhanadaughadhanaprada || 100|| animamahimapraptirgarimalakima
    tatha | prakamyatavashakari ishika siddhida tatha || 101|| mahimadigunairyukta animatyashtasiddhida
    | yavanankan janadina ajara ca jarapaha || 102|| dharini dharakakara triguna tulasinada | trividya
    ca trayi trigmi turiya triguneshvari || 103|| trividhatri dasharadhya trimurtirjananitvara | trivarna
    ca trailokya ca tritva ca trailokyadharini || 104|| trimurtishca trijanani tripustara tapasvini |
    taruni ca taponishta taptakancanasannnibha || 105|| taruna triveshani tapasi tararupini | tarunarkapratikasha
    tapaghni ca tamopaha || 106|| tartika tarkavidya ca trailokyavyapinishvari | tripushkara trikalajna
    tapatrayavinashini || 107|| gunadhya ca gunatita tapassiddhipradayini | karika tirtharupa ca tirtha
    tirthakari tatha || 108|| daridryaduhkhanashini adina dinavatsala | dinanathapriya dirgha dayapurna
    dayatmika || 109|| devadanavasampujya devanam modakarini | devasu dakshina daksha devi durgatinashini
    || 110|| anandodhati madhyastha aghora attahasini | ghoragnitakadamani duhkhaduhsvapnanivarini ||
    111|| shrimati shrimayi shresha shrikari shrivibhavani | shrida shrisha shrinivasa shriyuta shrimatikati
    || 112|| dhanada damini danta dharmada dhanashalini | dadimibijaradana dhanakara dhananjaya || 113||
    dharini dharini dhairya dhara datri ca dhairyata | daya doktri dharmini ca damani ca durasada || 114||
    nanaratnavicitrangi nanabharanamandita | nirajasya niradanka navalavanyasundari || 115|| pramita prajna
    ca purva pavanapavani | sarvapriya sarvavarada pavana papanashini || 116|| vasavyamshapaka ca paranjyotisvarupini
    | pareshi paragapara parasiddhirparagatih || 117|| pita mata ca pashuta pashubhagavinashini | padmagandha
    ca padmakshi padmakesharamandira || 118|| parabrahmasvarupa ca parabrahmanivasini | paramanandamudita
    purnapithanivasini || 119|| parameshi ca prithvi ca paracakravinashini | parapara paravidya paramanandadayini
    || 120|| vagrupa vanmayi vakda vajnetri vakvisharadah | dhirupa dhimayi dhira dhidhatri dhivisharada
    || 121|| vrindaraka vrindavandya vaishyavrindasahodari | paramashri vratavinuta pinaki parikirtita
    || 122|| phanibhusha phala pujya pranarupa priyamvada | bhavaradya bhaveshi ca bhava caiva bhaveshvari
    || 123|| bhavamata bhavagamya bhavakhandakanashini | bhavananda bhavaniya bhutapancakavasini || 124||
    bhagavati bhutadatri bhuteshi bhutarupini | bhutastha bhutamata ca bhutajni bhavamocini || 125|| bhaktashokatamohartri
    bhavapashavinashini | bhavabharavinashini bhugopacarakushala bhisadatri ca bhucari || 126|| bhitiha
    ca bhaktiramya bhaktanamishtadayini | bhaktanukampini bhima bhaktanamarttinashini || 127|| bhasvara
    bhasvati bhitih bhasvaduttanashalini | bhutida bhutirupa ca bhutika bhuvaneshvari || 128|| mahajihva
    mahadamshtra manipuranivasini | manasa manadabhimanya manashcakshuragocara || 129|| mahakundalini
    madhura mahavighnavinashini | mahamohandhakarajni mahamokshapradayini || 130|| mahashaktirmahavirya
    mahasuravimardini | shaktirmedha ca matida mahavaibhavavardhini || 131|| mahapatakasamhartri muktikamyarthasiddhida
    | mahavrata mahamurti mahabhayavinashini || 132|| mahaniya mananiya mattamatangakamini | muktaharalatopeta
    mahacorabhayapaha || 133|| mahaghora mantramata makarakritikuntala | malini manini madhvi mahasushma
    mahaprabha || 134|| mahacintya maharupa mahamantra mahosati | manimandapamadhyastha manimalavirajita
    || 135|| manorama ramamata rajni rajivalocana | vidyani vishnurupa ca vishalanayanotpala || 136||
    vireshvari ca varada virasu viranandini | vishvabhu viravidya ca vishnumayavimohini || 137|| vishveshvari
    vishalakshi vikhyata vilacatkasha | brahmeshi ca brahmavidya brahmani brahmarupini || 138|| vishva
    ca vishvavandya ca vishvashaktirvicakshana | vira ca bindustha caiva vishvabhagavimocini || 139||
    shishusupriya vaidyavidya shilashilapradayini | kshetra kshemankari vaishya aryavaishyakuleshvari
    || 140|| kusumashreshthi satputri kusumamba kumarika | bhalanagara sampujya virupakshasahodari ||
    141|| sarvasiddheshvararadhya sarveshvaraphalaprada | sarvadushtaprashamani sarvarakshasvarupini ||
    142|| vibhuda vishnusankalpa vijnanaghanarupini | vicitrini vishnupujya vishvamayavilasini || 143||
    vaishyadhatri vaishyagotra vaishyagotravivardhini | vaishyabhojanasantushta vishnurupavinodini ||
    144|| sankalparupini sandhya satyajnanaprabodhini | vihararahita vedya vijaya vishalakshini || 145||
    tattvajna ca tatkara ca tattvarthasvarupini | tapasvadhyayanirata tapasvijanasannuta || 146|| vindhyavasinyarcita
    ca nagareshvaramanita | kamaladevisampujya janardanasupujita || 147|| vandita vararupa ca vara ca
    varavardhini | varitakarasukasha vaishyalokavashankari || 148|| satkirtigunasampanna tadyavaca tapobala
    | tarunadityasankasha tapolokanivasini || 149|| tantrasara tantramata tantramargapradarshini | tattva
    tantravidanajna tantrastha tantrasakshini || 150|| sarvasampattijanani satpada sakaleshtada | anumana
    samadevi samarha sakalastuta || 151|| sanakadimunidhyeya sarvashastrarthagocara | sadashivasamuttirna
    sahasradalapadmaga || 152|| sarvavedantanilaya samaya sarvatomukhi | sattvika sambhrama caiva sarvacaitanyarupini
    || 153|| sarvopatavinirmukta saccidanandarupini | sarvavishvambhara vandya sarvajnanavisharada ||
    154|| vidya vidyakarividya vidyavidyaprabodhini | vimala vibhava vedya vishvastha vividhojjvalah ||
    155|| virahadyaprashamani vinamrajanapalini | viramadhya viratrupa vitantra vishvanayika || 156||
    vishvambarasamaradhya vikrama vishvamangala | vinayaki vinodastha vishvavibhramakarini || 157|| vivaharahita''vela
    viragoshthivivardhini | tumburatistutiprita mahagiripurishvari || 158|| dushta ca dushti janani dushtalokavinashini
    | tuladhara tulamadhya tulastha tulyaduraga || 159|| dhuriyatva sugambhira turiyaravasvarupini | turiyavidya
    nrityatushta turiyavidyarthavadini || 160|| turiyashastratattvajna turiyavadavinodini | turiyanadantanilaya
    turiyanandasvarupini || 161|| turiyabhaktajanani turiyamargapradarshini | varenyavarishtha caiva vedashastrapradarshini
    || 162|| vikalpasamani vani vanchitarthaphalaprada | vandini vadini vashya vayovasthativivarjita ||
    163|| vasishthavamadevadivandya vandyasvarupini | vasuprada vasudevi vashatkari vasundhara || 164||
    vasavarcitapadashrirvasavarivinashini | vashini vakyahasta ca vahisvararyarcitaprabha || 165|| ravimandalamadhyastha
    ramani ravilocana | rambhatishayilavanya rangamandalamadhyaga || 166|| varnita vaishyajanani varnyaparvendumadhyaga
    | ravini rakini ranjya rajarajeshvararcita || 167|| rajasvati rajanitirvaishyanitirvaraprada | apanga
    bhangabhanga ca bhangaduratvabhangura || 168|| raghavarcitapadashri ratnadvipanivasini | ratnaprakaramadhyastha
    ratnamandapamadhyaga || 169|| ratnabhishekasantushta ratnangi ratnadayini | nivarasukhavaddhanvi pitapa
    svatvanupama || 170|| nilato yatamadhyasthat vidyullekhevabhasvara | kavayintri nirjari ca vishvarcirvishvatomukhi
    || 171|| sarvanandamayi navya sarvarakshasvarupini | sarvasiddheshvarairvandya sarvamangalamangala
    || 172|| nityotsava nityapujya nityanandasvarupini | nirgunastha nishcinta ca nityamangalarupini ||
    173|| niroha nimisho nari nikhilagamavedini | nissamshaya nirlopa ca nityakarmaphalaprada || 174||
    sarvamangalamangalya bhaktasarvarthasadhaka | vaishyapaccamuhartri ca vaishyasampatpradayini || 175||
    mahashailapuri geha sarvavaishyashubhaprada | tvayattashatagotrarya vaishyasaukhyapradyayini || 176||
    sarvamangalamangalye shive sarvarthasadhike | sharanye tryambake gauri narayani namo'stute || iti
    shrivasavikanyakaparameshvarisahasranamastotram sampurnam |
  devanagari: इन्दीम्प्रथमालका । कृपलिन्ता कृपावर्तिनिर्मणिनूपुरमण्डिता ॥ ११॥ त्रिमूर्तिपदवीदात्री त्रिजगत्रक्षणकादरा
    । सर्वभद्रस्वरूपा च सर्वभद्रप्रदायिनी ॥ १२॥ मणिकाञ्चनमञ्जीरा अरुणाङ्घ्रिसरोरुहा । शून्यमध्या सर्वमान्या
    धन्याऽनन्या समाद्भुता ॥ १३॥ विष्णुवर्धनसम्मोहकारिणी पापवारिणी । सर्वसम्पत्करी सर्वरोगशोकनिवारिणी ॥
    १४॥ आत्मगौरवसौजन्यबोधिनी मानदायिनी । मानुषरक्षाकरी भुक्तिमुक्तिदात्री शिवप्रदा ॥ १५॥ निस्समा निराधिका
    चैव योगमाया ह्यनुत्तमा । महामाया महाशक्तिर्हरिवर्गापहारिणी ॥ १६॥ भानुकोटिसहस्राभा मल्लिचम्पकगन्धिका
    । रत्नकाञ्चनकोटीरचन्द्रकण्ठयुदालका ॥ १७॥ चन्द्रबिम्बसमास्याङ्गा मृगनापि विशेषका । रागस्वरूपा पाषाद्या
    अग्निपूज्या चतुर्भुजा ॥ १८॥ नासचाम्पेयपुष्पा च नासामौक्तिकसूज्ज्वला । गुरुविन्दकपोला च इन्दुरोचिस्मिताञ्चिता
    ॥ १९॥ वीणा निश्वनसल्लाभा अग्निसुत्तां शुकाञ्चिता । गूढकुल्पा जगन्माया मणिसिंहासनस्थिता ॥ २०॥ अप्रमेया
    स्वप्रकाशा शिष्टेष्टा शिष्टपूजिता । चित्शक्तिचेतनाकारा मनोवाचामगोचरा ॥ २१॥ चतुर्दशविद्यारूपा चतुर्दशकलामयी
    । महाचतुष्षष्टिकोटियोगिनी गणसेविता ॥ २२॥ चिन्मयी परमानन्दा विज्ञानगणरूपिणी । ध्यानरूपा ध्येयाकारा
    धर्माधर्मविदायिनी ॥ २३॥ चारुरूपा चारुहासा चारुचन्द्रकलाधरा । चराचरजगन्नेत्री चक्रराजनिकेतना ॥ २४॥
    ब्रह्मादिकसृष्टिकर्त्री गोप्त्री तेजस्वरूपिणी । भानुमण्डलमध्यस्था भगवती सदाशिवा ॥ २५॥ आब्रह्मकोटिजननी
    पुरुषार्थप्रदाम्बिका । आदिमध्यान्तरहिता हरिर्ब्रह्मेश्वरार्चिता ॥ २६॥ नारायणी नादरूपा सम्पूर्णा भुवनेश्वरी
    । राजराजार्चिता रम्या रञ्चनी मुनिरञ्चिनी ॥ २७॥ कल्याणी लोकवरदा करुणारसमञ्जुला । वरदा वामनयना महाराज्ञी
    निरीश्वरी ॥ २८॥ रक्षाकरी राक्षसघ्नी तुष्टराजामदापहा । विधात्री वेदजननी रागचन्द्रसमानना ॥ २९॥ तन्त्ररूपा
    तन्त्रिणी च तन्त्रवेद्या तन्त्रिका । शास्त्ररूपा शास्त्रधारा सर्वशास्त्रस्वरूपिणी ॥ ३०॥ रागभाषा मनश्चाभा
    पञ्चभूतमयी तथा । पञ्चतन्मात्रसायका क्रोधाकारा कुशाञ्चिता ॥ ३१॥ निजकान्तिपराचाण्डमण्डला अखण्डलार्चिता
    । कदम्बमयताटङ्का पद्मचाम्पेयकन्दिला ॥ ३२॥ सर्वविद्याङ्कुराशङ्क्यदन्तपङ्क्तीत्वयाञ्चिता । सरसल्लाभमाधुर्यजितवाणीविपञ्चिका
    ॥ ३३॥ क्रैवेयमणिचिन्ताककूर्मपृष्ठपदत्वया । नखकान्तिपरिच्छिन्ना समत्रावाततमोगुणा ॥ ३४॥ मणिकिङ्किणिका
    दिव्यतृष्णा दामभूषिता । रम्भास्तम्भमनोज्ञाती मनोज्ञारुत्याञ्चिता ॥ ३५॥ पदशोभा जिताम्भोजा महागिरिपुरीश्वरी
    । देवरत्नगृहान्तस्था सर्वब्रह्मासमस्थिता ॥ ३६॥ महापद्मवनस्थाना कदम्बवनवासिनी । निजांषभागसरोल्लसी लक्ष्मी
    गौरी सरस्वती ॥ ३७॥ मञ्जुकुञ्जनमणिमञ्जिरा अलङ्कृतपदाम्बुजा । हंसिका मन्दगमना महासौदर्यवारधी ॥ ३८॥ अनवद्यारुणकन्या
    च अकन्या गुणतूरगा । सम्पद्दात्रा विश्वनेयौकदेवव्रातासुसेविता ॥ ३९॥ गेयचक्ररथारूढा मन्त्रिन्यम्बा समर्चिता
    । कामदा अनवत्याङ्गी देवर्षिस्तुतवैभवा ॥ ४०॥ विघ्न्यन्त्रसमूभेत्री करोत्यनैकमादवा । सङ्कल्पमात्रनिर्धूता
    विष्णुवर्धनवैभवा ॥ ४१॥ मूर्तित्रया सदासेव्या समयस्था निरामया । मूलाधारभवाब्रह्मग्रन्थिसम्भेदिनी परा
    ॥ ४२॥ मणिपूरान्तरावासा विष्णुग्रन्थिविभेदिनी । अज्ञाचक्रागतामाया रुद्रग्रन्थिविमोक्षदा ॥ ४३॥ सहस्रारसमारूढा
    सुधासारप्रवर्षिणी । दशत्रेकासमाभासा षट्चक्रोपरिवासिनी ॥ ४४॥ भक्तिवस्या भक्तिगम्या भक्तरक्षणकादरा ।
    भक्तिप्रिया भद्रमूर्ती भक्तसन्तोषदायिनी ॥ ४५॥ सर्वदाकुण्डलिन्यम्बा सारदेव्या च शर्मदा । साध्वी श्रीकरीयुतारा
    च श्रीकरी शम्भुमोदिता ॥ ४६॥ शरच्चन्द्रमुखी शिष्टा निराकारा निराकुला । निर्लेपा निस्तुला चैव निरवद्या
    निरन्तरा ॥ ४७॥ निष्कारणा निष्कलङ्का नित्यबुद्धा निरीश्वरी । नीरागा रागमदना निर्मदा मदनाशिनी ॥ ४८॥
    निर्ममा समया चान्य अनन्या जगदीश्वरी । नीरोगा निरूपाधिश्च निरानन्दा निराष्रया ॥ ४९॥ नित्यमुक्ता निगममा
    नित्यशुद्धा निरुत्तमा । निर्व्याधी च व्याधिमदना निष्क्रीया निरुपप्लवा ॥ ५०॥ निरहङ्कारा च निश्चिन्ता
    निर्मोहा मोहनाशिनी । निर्पादा ममताहन्त्री निष्पापा पापानाशिनी ॥ ५१॥ अभेदा च साक्षिरूपा निर्भेदा भेदनाशिनी
    । निर्नाशा नाशमथनी निष्पापापापहारिणी ॥ ५२॥ नीलवेणी निरालम्बा निरपाया भवापहा । निःसन्देहा संशयज्ञी
    निर्लोपा लोपहारिणी ॥ ५३॥ शुकप्रदा दुष्टदूरा निर्विकल्पा निरद्यया । सर्वज्ञाना दुःखहन्त्री समानाधिकवर्जिता
    ॥ ५४॥ सर्वशक्तिमयी सर्वमङ्गला सद्गतिप्रदा । सर्वेश्वरी सर्वमयी सर्वत्वस्वरूपिणी ॥ ५५॥ महामाया महाशक्तिः
    महासत्वा महाबला । महावीर्या महाबुद्धिर्महेश्वर्यमहागतिः ॥ ५६॥ मनोन्मणिमहादेवी महापातकनाशिनी । महापूज्या
    महासिद्धिः महायोगीश्वरेश्वरी ॥ ५७॥ महातन्त्रा महामन्त्रा महायन्त्रा महासना । महायागक्रमाराध्या महायोगसमर्चिता
    ॥ ५८॥ प्रकृतिर्विकृतिर्विद्या सर्वभूतहितप्रदा । सुचिस्वाहा च धन्या च स्वधा सुधा हिरण्मयी ॥ ५९॥ मान्या
    श्रद्धा विभूतिश्च ब्रह्मविष्णुशिवात्मिका । दीप्ता कान्ता च कामाक्षी नित्यपुष्टा विभावरी ॥ ६०॥ अनुग्रहप्रदा
    रामा अनका लोकवल्लभा । अमृता च शोकमूर्तिर्लोकदुःखविनाशिनी ॥ ६१॥ करुणाधर्मनिलया पद्मिनी पद्मकन्दिनी
    । ह्लादजननी पुष्टा पद्ममालाधराद्भुता ॥ ६२॥ पद्माक्षी पद्ममुखी च लोकमातेन्दुशीतला । सुप्रसन्ना पुण्यकन्ता
    प्रसादापि मुखिप्रभा ॥ ६३॥ अर्धचन्द्रसूडाला च चारा वैश्यसहोदरी । वैश्यसौख्यप्रदातुष्टिः शिवा दारिद्र्यनाशिनी
    ॥ ६४॥ शिवादात्री च विमला स्वामिनी प्रीतिपुष्कला । आर्याव्यामासती सौम्या श्रीदा मङ्गलदायिनी ॥ ६५॥ भक्तकेहपरानन्दा
    सिद्धिरूपा वसुप्रदा । भास्करी ज्ञाननिलया ललिताङ्गी यशस्विनी ॥ ६६॥ त्रिकालज्ञोऽरुसम्पन्ना सर्वकालस्वरूपिणी
    । दारिद्र्यध्वंसिनी कान्ती सर्वोऽभद्रनिवारिणी ॥ ६७॥ अन्नदा अन्नदात्री च अच्युतानन्दकारिणी । अनन्ताच्युता
    व्युप्ता व्यक्ताव्यक्तस्वरूपिणी ॥ ६८॥ शारदाम्भोज प्रत्यक्षी शरच्चन्द्ररुचिस्थिता । जया जयापकाशा अवकाशस्वरूपिणी
    ॥ ६९॥ आकाशमयपद्मस्था अनाद्या सत्यो निजा । अपलां चण्डिका अगाधा आत्मज्ञा च आत्मगोचरा ॥ ७०॥ आद्यानद्यादिदेवी
    च आदित्याचयभास्वरा । कर्तस्वरमनोज्ञाङ्गी कालकण्ठनिभास्वरा ॥ ७१॥ आत्मनो आत्मदयिता आधाराचात्मरूपिणी
    । आनीशाकाष्यभैशानी ईश्वरैश्वर्यदायिनी ॥ ७२॥ इन्द्रसूरिन्दुमाता च इन्द्रिया इन्दुमण्डिता । इन्दुबिम्बसमाश्रिया
    इन्द्रियाणां वशङ्करी ॥ ७३॥ एका चैक वीरा च एकाकारैकवैभवा । एकत्रयसुपूज्या च एकनूरेकदायिनी ॥ ७४॥ वर्णात्मा
    वर्णनिलया षोडषस्वररूपिणी । कन्या कृत्वा महारात्रीर्मोहरात्री सुलोचना ॥ ७५॥ कमनीया कलाधारा कामधू वर्णमालिनी
    । काश्मीरत्रवलिप्ताङ्गी काम्या च कमलार्चिता ॥ ७६॥ माणिक्यभास्वलङ्कारा कणगा कणगप्रदा । कम्बूग्रीवा
    कृपायुक्ता किशोरी च ललाटिनी ॥ ७७॥ कालस्था च निमेषा च कालदात्री कलावती । कालज्ञा कालमाता च कालवेत्री
    कलावनी ॥ ७८॥ कालदा कालहा कीर्तिः कीर्तिस्था कीर्तिवर्धिनी । कीर्तिज्ञा कीर्तितगुणा केशवानन्दकारिणी
    ॥ ७९॥ कुमारी कुमुदाभा च कर्मदा कर्मभञ्जनी । कौमुदी कुमुदानन्दा कालाङ्गी कालभूषणा ॥ ८०॥ कपर्दिनी कोमलाङ्गी
    कृपासिन्धुः कृपामयी । कञ्जस्था कञ्जवदना कूटस्थोरुगिरीश्वरी ॥ ८१॥ कुण्डचुस्था च कौवेरी कलिकल्मषनाशिनी
    । काष्यपी कामरूपा च कञ्जकञ्जल्कचर्चिता ॥ ८२॥ कञ्हनध्वन्त्व नेत्री च खेसरी कट्कयुक्करी । सिद्धज्ञा
    सिद्धितपदा चिन्तस्था चिन्तस्वरूपिणी ॥ ८३॥ चञ्चकाभमनोयाङ्गी चारुचम्पकमालिनी । चण्डी च चण्डरूपा च चैतन्यकणगेहिनी
    ॥ ८४॥ चिदानन्दा चिदाहातारा चिदाकारा चिदालया । चपलाम्बाङ्गलतिका चन्द्रकोटिशुभाकरा ॥ ८५॥ चिन्तामणिगुणाधारा
    चिन्तामणिविभूषिता । भक्तचिन्तामणिलता चिन्तामणिसुमन्तिरा ॥ ८६॥ चारुचन्दनलिप्ताङ्गी चतुरा चतुरानना ।
    चक्रदा चक्रधारी च चारुचामरविजिता ॥ ८७॥ भक्तानां छत्ररूपा च छत्रच्छायाकृतालया । जगजीवा जगद्दात्री जगदानन्दकारिणी
    ॥ ८८॥ जननी च यज्ञरता जयन्ती जपयज्ञपरायणा । यज्ञदा यज्ञफलदा यज्ञस्थापकृतालया ॥ ८९॥ यज्ञभोत्री यज्ञरूपा
    यज्ञविघ्नविनाशिनी । कर्मयोगा कर्मरुपा कर्मविघ्नविनाशिनी ॥ ९०॥ कर्मदा कर्मफलदा कर्मस्थानकृतालया । कालुश्या
    भेदसारिद्रा सर्वकर्मसमञ्चिता ॥ ९१॥ जयस्था जयदा जैत्री जीविता जयकारिणी । यशोदायकसाम्राज्यनी यशोदानन्दकारिणी
    ॥ ९२॥ ज्वलिनी ज्वालिनी ज्वाला ज्वलत्भावगसन्निभा । ज्वालामुखी जनानन्दा जम्बूद्वीपकृतालया ॥ ९३॥ जन्मदा
    जन्महा जन्मा जन्मपूर्जन्मरञ्जिनी । जम्बूनाथसमानङ्गी जम्बूनाथविभूषणा ॥ ९४॥ ज्ञातिता जातिता जाती ज्ञानदा
    ज्ञाऱ्नगोचरा । ज्ञानहा ज्ञानरूपा च ज्ञानविज्ञानशालिनी ॥ ९५॥ जपापुष्पसमानोष्ट्या जपाकुसुमशोभिता । जिनजैत्री
    जिनातारा जिन्माता जिनेश्वरी ॥ ९६॥ तीर्थङ्करी निराधारा अमलाम्बरधारिणी । शम्भुकोटिदुराधर्शा विष्णुवर्धनमर्दिनी
    ॥ ९७॥ समुद्रकोटिगम्भीरा वायुकोटिमहाबला । सूर्यकोटिप्रतीकासा यमकोटिपराक्रमा ॥ ९८॥ कामधुक्कोटिफलदा चक्रकोटिसुराज्युता
    । रतिकोटिसुलावण्या पद्मकोटिनिभानना ॥ ९९॥ पृथ्वीकोटिजनाधारा अग्निकोटिभयङ्करी । ईशनादी सत्शक्तिर्धनदौघधनप्रदा
    ॥ १००॥ अणिमामहिमाप्राप्तिर्गरिमालकिमा तथा । प्रकाम्यातावशकरी ईशिका सिद्धिदा तथा ॥ १०१॥ महिमादिगुणैर्युक्ता
    अणिमात्यष्टसिद्धिदा । यवनङ्कन् जनादीना अजरा च जरापहा ॥ १०२॥ धारिणी धारकाकारा त्रिगुणा तुलसीनदा । त्रिविद्या
    च त्रयी त्रिग्मी तुरिया त्रिगुणेश्वरी ॥ १०३॥ त्रिविधात्री दशाराध्या त्रिमूर्तिर्जननीत्वरा । त्रिवर्णा
    च त्रैलोक्या च त्रित्वा च त्रैलोक्यधारिणी ॥ १०४॥ त्रिमूर्तिश्च त्रिजननी त्रिपूस्तारा तपस्विनी । तरुणी
    च तपोनिष्टा तप्तकाञ्चनसन्न्निभा ॥ १०५॥ तरुणा त्रिवेशानी तपसी तररूपिणी । तरुणार्कप्रतिकाश तापघ्नी च
    तमोपहा ॥ १०६॥ तार्तिका तर्कविद्या च त्रैलोक्यव्यापिनीश्वरी । त्रिपुष्करा त्रिकालाज्ञा तापत्रयविनाशिनी
    ॥ १०७॥ गुणाढ्या च गुणातीता तपस्सिद्धिप्रदायिनी । कारिका तीर्थरूपा च तीर्थ तीर्थकरी तथा ॥ १०८॥ दारिद्र्यदुःखनाशिनी
    अदीना दीनवत्सला । दीननाथप्रिया दीर्घा दयापूर्णा दयात्मिका ॥ १०९॥ देवदानवसम्पूज्या देवानां मोदकारिणी
    । देवसू दक्षिणा दक्षा देवी दुर्गतिनाशिनी ॥ ११०॥ आनन्दोधती मध्यस्था अघोरा अट्टहासिनी । घोराग्निताकदमनी
    दुःखदुःस्वप्ननिवारिणी ॥ १११॥ श्रीमती श्रीमयी श्रेषा श्रीकरी श्रीविभावनी । श्रीदा श्रीशा श्रीनिवासा
    श्रीयुता श्रीमतिकती ॥ ११२॥ धनदा दामिनी दान्ता धर्मदा धनशालिनी । दाडिमीबीजरदना धनकारा धनञ्जया ॥ ११३॥
    धरिणी धारिणी धैर्या धरा दात्री च धैर्यता । दया दोक्त्री धर्मिणी च दमनी च दुरासदा ॥ ११४॥ नानारत्नविचित्राङ्गी
    नानाभरणमण्डिता । नीरजास्या निरादङ्का नवलावण्यसुन्दरी ॥ ११५॥ प्रमिता प्राज्ञा च पूर्वा पावनपावनी ।
    सर्वप्रिया सर्ववरदा पावना पापनाशिनी ॥ ११६॥ वासव्यंशपाका च परञ्ज्योतिस्वरूपिणी । परेशी पारगापारा परासिद्धिर्परागतिः
    ॥ ११७॥ पिता माता च पशुता पशुभागविनाशिनी । पद्मगन्धा च पद्माक्षी पद्मकेशरमन्दिरा ॥ ११८॥ परब्रह्मस्वरूपा
    च परब्रह्मनिवासिनी । परमानन्दमुदिता पूर्णपीठनिवासिनी ॥ ११९॥ परमेशी च पृथ्वी च परचक्रविनाशिनी । परापरा
    पराविद्या परमानन्ददायिनी ॥ १२०॥ वाग्रूपा वाङ्मयी वाक्दा वाज्ञेत्री वाक्विशारदाः । धीरूपा धीमयी धीरा
    धीधात्री धीविशारदा ॥ १२१॥ वृन्दारका वृन्दवन्द्या वैश्यवृन्दसहोदरी । परमश्री व्रातविनुता पिनाकी परिकीर्तिता
    ॥ १२२॥ फणिभूषा फाला पूज्या प्राणरूपा प्रियंवदा । भवाराद्या भवेशी च भवा चैव भवेश्वरी ॥ १२३॥ भवमाता
    भवागम्या भवखण्डकनाशिनी । भवानन्दा भावनीया भूतपञ्चकवासिनी ॥ १२४॥ भगवती भूतदात्री भूतेशी भूतरूपिणी ।
    भूतस्था भूतमाता च भूतज्ञी भवमोचिनी ॥ १२५॥ भक्तशोकतमोहर्त्री भवपाशविनाशिनी । भवभारविनाशिनी भूगोपचारकुशला
    भिसादात्री च भूचरी ॥ १२६॥ भीतिहा च भक्तिरम्या भक्तानामिष्टदायिनी । भक्तानुकम्पिनी भीमा भक्तानामार्त्तिनाशिनी
    ॥ १२७॥ भास्वरा भास्वती भीतिः भास्वदुत्तानशालिनी । भूतिदा भूतिरूपा च भूतिका भुवनेश्वरी ॥ १२८॥ महाजिह्वा
    महादंष्ट्रा मणिपुरनिवासिनी । माञसा मानदाभीमान्या मनश्चक्षूरगोचरा ॥ १२९॥ महाकुण्डलिनी मधुरा महाविघ्नविनाशिनी
    । महामोहान्धकाराज्ञी महामोक्षप्रदायिनी ॥ १३०॥ महाशक्तिर्महावीर्या महासुरविमर्दिनी । शक्तिर्मेधा च
    मतिदा महावैभववर्धिनी ॥ १३१॥ महापातकसंहर्त्री मुक्तिकाम्यार्थसिद्धिदा । महाव्रता महामूर्ती महाभयविनाशिनी
    ॥ १३२॥ महानीया माननीया मत्तमातङ्गकामिनी । मुक्तहारलतोपेता महाचोरभयापहा ॥ १३३॥ महाघोरा मन्त्रमाता मकराकृतिकुण्टला
    । मालिनी मानिनी माध्वी महासुष्मा महाप्रभा ॥ १३४॥ महाचिन्त्य महारूपा महामन्त्र महोसती । मणिमण्डपमध्यस्था
    मणिमालाविराजिता ॥ १३५॥ मनोरमा रमामाता राज्ञी राजीवलोचना । विद्यानी विष्णुरूपा च विशालनयनोत्पला ॥ १३६॥
    वीरेश्वरी च वरदा वीरसू वीरनन्दिनी । विश्वभू वीरविद्या च विष्णुमायाविमोहिनी ॥ १३७॥ विश्वेश्वरी विशालाक्षी
    विख्याता विलचत्कशा । ब्रह्मेशी च ब्रह्मविद्या ब्रह्माणी ब्रह्मरूपिणी ॥ १३८॥ विश्वा च विश्ववन्द्या
    च विश्वशक्तिर्विचक्षणा । वीरा च बिन्दुस्था चैव विश्वभागविमोचिनी ॥ १३९॥ शिशुसुप्रिया वैद्यविद्या शीलाशीलप्रदायिनी
    । क्षेत्रा क्षेमङ्करी वैश्या आर्यवैश्यकुलेश्वरी ॥ १४०॥ कुसुमश्रेष्ठी सत्पुत्री कुसुमाम्बा कुमारिका
    । भालनगर सम्पूज्या विरूपाक्षसहोदरी ॥ १४१॥ सर्वसिद्धेश्वराराध्या सर्वेश्वरफलप्रदा । सर्वदुष्टप्रशमनी
    सर्वरक्षास्वरूपिणी ॥ १४२॥ विभुदा विष्णुसङ्कल्पा विज्ञानघनरूपिणी । विचित्रिणी विष्णुपूज्या विश्वमायाविलासिनी
    ॥ १४३॥ वैश्यधात्री वैश्यगोत्रा वैश्यगोत्रविवर्धिनी । वैश्यभोजनसन्तुष्टा विष्णुरूपविनोदिनी ॥ १४४॥ सङ्कल्परूपिणी
    सन्ध्या सत्यज्ञानप्रबोधिनी । विहाररहिता वेद्या विजया विशालाक्षिणी ॥ १४५॥ तत्त्वज्ञा च तत्कारा च तत्त्वार्थस्वरूपिणी
    । तपस्वाध्यायनिरता तपस्वीजनसन्नुता ॥ १४६॥ विन्ध्यवासिन्यर्चिता च नगरेश्वरमानिता । कमलादेविसम्पूज्या
    जनार्दनसुपूजिता ॥ १४७॥ वन्दिता वररूपा च वरा च वरवर्धिनी । वारिताकारसुकशा वैश्यलोकवशङ्करी ॥ १४८॥ सत्कीर्तीगुणसम्पन्ना
    तद्यवाचा तपोबला । तरुणादित्यसङ्काशा तपोलोकनिवासिनी ॥ १४९॥ तन्त्रसारा तन्त्रमाता तन्त्रमार्गप्रदर्शिनी
    । तत्त्वा तन्त्रविदानज्ञा तन्त्रस्था तन्त्रसाक्षिणी ॥ १५०॥ सर्वसम्पत्तिजननी सत्पदा सकलेष्टदा । अनुमाना
    सामदेवी समर्हा सकलस्तुता ॥ १५१॥ सनकादिमुनिध्येया सर्वशास्त्रार्थगोचरा । सदाशिवासमुत्तीर्णा सहस्रदलपद्मगा
    ॥ १५२॥ सर्ववेदान्तनिलया समया सर्वतोमुखी । सात्त्विका सम्भ्रमा चैव सर्वचैतन्यरूपिणी ॥ १५३॥ सर्वोपातविनिर्मुक्ता
    सच्चिदानन्दरूपिणी । सर्वविश्वाम्भरा वन्द्या सर्वज्ञानविशारदा ॥ १५४॥ विद्या विद्याकरिविद्या विद्याविद्यप्रबोधिनी
    । विमला विभवा वेद्या विश्वस्था विविधोज्ज्वलाः ॥ १५५॥ वीरहद्याप्रशमनी विनम्रजनपालिनी । वीरमध्या विराट्रूपा
    वितन्त्रा विश्वनायिका ॥ १५६॥ विश्वाम्बरासमाराध्या विक्रमा विश्वमङ्गला । विनायकी विनोदस्था विश्वविभ्रमकारिणी
    ॥ १५७॥ विवाहरहिताऽऽवेला वीरगोष्ठिविवर्धिनी । तुम्बुरातिस्तुतिप्रीता महागिरिपुरीश्वरी ॥ १५८॥ दुष्टा
    च दुष्टी जननी दुष्टलोकविनाशिनी । तुलाधारा तुलमध्या तुलस्था तुल्यदूरगा ॥ १५९॥ धुरीयत्वा सुगम्भीरा तुरियारावस्वरूपिणी
    । तुरियविद्या नृत्यतुष्टा तुरियविद्यार्थवादिनी ॥ १६०॥ तुरियशास्त्रतत्त्वज्ञा तुरियवादविनोदिनी । तुरियनादान्तनिलया
    तुरियानन्दस्वरूपिणी ॥ १६१॥ तुरियभक्तजननी तुरियमार्गप्रदर्शिनी । वरेण्यवरिष्ठा चैव वेदशास्त्रप्रदर्शिनी
    ॥ १६२॥ विकल्पसमनी वाणी वाञ्छितार्थफलप्रदा । वन्दिनी वादिनी वश्या वयोवस्थातिविवर्जिता ॥ १६३॥ वसिष्ठवामदेवादिवन्द्या
    वन्द्यस्वरूपिणी । वसुप्रदा वासुदेवी वषट्कारी वसुन्धरा ॥ १६४॥ वासवार्चितपादश्रीर्वासवारिविनाशिनी ।
    वशिनी वाक्यहस्ता च वाहीस्वरर्यर्चितप्रभा ॥ १६५॥ रविमण्डलमध्यस्था रमणी रविलोचना । रम्भातिशायिलावण्या
    रङ्गमण्डलमध्यगा ॥ १६६॥ वर्णिता वैश्यजननी वर्ण्यापर्वेन्दुमध्यगा । राविणी राकिणी रञ्ज्या राजराजेश्वरार्चिता
    ॥ १६७॥ राजस्वती राजनीतीर्वैश्यनीतीर्वरप्रदा । अपाङ्गा भङ्गभङ्गा च भङ्गदूरात्वभङ्गुरा ॥ १६८॥ राघवार्चितपादश्री
    रत्नद्वीपनिवासिनी । रत्नप्रकारमध्यस्था रत्नमण्डपमध्यगा ॥ १६९॥ रत्नाभिषेकसन्तुष्टा रत्नाङ्गी रत्नदायिनी
    । नीवारसुखवद्धन्वी पीतापा स्वत्वनूपमा ॥ १७०॥ नीलतो यतमध्यस्थात् विद्युल्लेखेवभास्वरा । कवयिन्त्री
    निर्जरी च विश्वार्चीर्विश्वतोमुखी ॥ १७१॥ सर्वानन्दमयी नव्या सर्वरक्षास्वरूपिणी । सर्वसिद्धेश्वरैर्वन्द्या
    सर्वमङ्गलमङ्गला ॥ १७२॥ नित्योत्सवा नित्यपूज्या नित्यानन्दस्वरूपिणी । निर्गुणास्था निष्चिन्ता च नित्यमङ्गलरूपिणी
    ॥ १७३॥ निरोहा निमिषो नारी निखिलागमवेदिनी । निस्संशया निर्लोपा च नित्यकर्मफलप्रदा ॥ १७४॥ सर्वमङ्गलमाङ्गल्या
    भक्तसर्वार्थसाधका । वैश्यापच्चमुहर्त्री च वैश्यसम्पत्प्रदायिनी ॥ १७५॥ महाशैलपुरी गेहा सर्ववैश्यशुभप्रदा
    । त्वयत्तशतगोत्रार्या वैश्यसौख्यप्रद्यायिनी ॥ १७६॥ सर्वमङ्गलमाङ्गल्ये शिवे सर्वार्थसाधिके । शरण्ये
    त्र्यम्बके गौरि नारायणि नमोऽस्तुते ॥ इति श्रीवासवीकन्यकापरमेश्वरीसहस्रनामस्तोत्रं सम्पूर्णम् ।
