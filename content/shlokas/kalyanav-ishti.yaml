id: kalyanav-ishti
category: stotram
name:
  english: kalyanavṟishti
  devanagari: कल्याणव्ऱिष्टि
content:
  english: rlakshmisvayamvaranamangaladipikabhih | sevabhiramba tava padasarojamule nakari kim manasi
    bhagyavatam jananam || 1|| etavadeva janani sprihaniyamaste tvadvandaneshu salilasthagite ca netre
    | sannidhyamudyadarunayutasodarasya tvadvigrahasya paraya sudhayaplutasya || 2|| ishatvanamakalushah
    kati va na santi brahmadayah pratibhavam pralayabhibhutah | ekah sa eva janani sthirasiddhiraste yah
    padayostava sakritpranatim karoti || 3|| labdhva sakrittripurasundari tavakinam karunyakandalitakantibharam
    kataksham | kandarpakotisubhagastvayi bhaktibhajah sammohayanti tarunirbhuvanatraye'pi || 4|| hrimkarameva
    tava nama grinanti veda matastrikonanilaye tripure trinetre | tvatsamsmritau yamabhatabhibhavam vihaya
    divyanti nandanavane saha lokapalaih || 5|| hantuh puramadhigalam paripiyamanah krurah katham na bhavita
    garalasyavegah | nashvasanaya yadi mataridam tavardham dehasya shashvadamritaplutashitalasya || 6||
    sarvajnatam sadasi vakpatutam prasute devi tvadanghrisarasiruhayoh pranamah | kim ca sphuranmukutamujjvalamatapatram
    dve camare ca mahatim vasudham dadati || 7|| kalpadrumairabhimatapratipadaneshu karunyavaridhibhiramba
    bhavatkatakshaih | alokaya tripurasundari mamanatham tvayyeva bhaktibharitam tvayi baddhatrishnam
    || 8|| hantetareshvapi manamsi nidhaya canye bhaktim vahanti kila pamaradaivateshu | tvameva devi
    manasa samanusmarami tvameva naumi sharanam janani tvameva || 9|| lakshyeshu satsvapi katakshanirikshanana
  devanagari: र्लक्ष्मीस्वयंवरणमङ्गलदीपिकाभिः । सेवाभिरम्ब तव पादसरोजमूले नाकारि किं मनसि भाग्यवतां जनानाम्
    ॥ १॥ एतावदेव जननि स्पृहणीयमास्ते त्वद्वन्दनेषु सलिलस्थगिते च नेत्रे । सान्निध्यमुद्यदरुणायुतसोदरस्य
    त्वद्विग्रहस्य परया सुधयाप्लुतस्य ॥ २॥ ईशात्वनामकलुषाः कति वा न सन्ति ब्रह्मादयः प्रतिभवं प्रलयाभिभूताः
    । एकः स एव जननि स्थिरसिद्धिरास्ते यः पादयोस्तव सकृत्प्रणतिं करोति ॥ ३॥ लब्ध्वा सकृत्त्रिपुरसुन्दरि
    तावकीनं कारुण्यकन्दलितकान्तिभरं कटाक्षम् । कन्दर्पकोटिसुभगास्त्वयि भक्तिभाजः संमोहयन्ति तरुणीर्भुवनत्रयेऽपि
    ॥ ४॥ ह्रींकारमेव तव नाम गृणन्ति वेदा मातस्त्रिकोणनिलये त्रिपुरे त्रिनेत्रे । त्वत्संस्मृतौ यमभटाभिभवं
    विहाय दीव्यन्ति नन्दनवने सह लोकपालैः ॥ ५॥ हन्तुः पुरामधिगलं परिपीयमानः क्रूरः कथं न भविता गरलस्यवेगः
    । नाश्वासनाय यदि मातरिदं तवार्धं देहस्य शश्वदमृताप्लुतशीतलस्य ॥ ६॥ सर्वज्ञतां सदसि वाक्पटुतां प्रसूते
    देवि त्वदङ्घ्रिसरसीरुहयोः प्रणामः । किं च स्फुरन्मुकुटमुज्ज्वलमातपत्रं द्वे चामरे च महतीं वसुधां ददाति
    ॥ ७॥ कल्पद्रुमैरभिमतप्रतिपादनेषु कारुण्यवारिधिभिरम्ब भवत्कटाक्षैः । आलोकय त्रिपुरसुन्दरि मामनाथं त्वय्येव
    भक्तिभरितं त्वयि बद्धतृष्णम् ॥ ८॥ हन्तेतरेष्वपि मनांसि निधाय चान्ये भक्तिं वहन्ति किल पामरदैवतेषु
    । त्वामेव देवि मनसा समनुस्मरामि त्वामेव नौमि शरणं जननि त्वमेव ॥ ९॥ लक्ष्येषु सत्स्वपि कटाक्षनिरीक्षणाना
