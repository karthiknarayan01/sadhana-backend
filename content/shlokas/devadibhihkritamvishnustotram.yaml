id: devadibhihkritamvishnustotram
category: stotram
name:
  english: devadibhihkritamvishnustotram
  devanagari: देवादिभिःकृतंविष्णुस्तोत्रम्
content:
  english: devadibhih kritam vishnustotram tushtuvuste harim lakshminarayanam prajeshvarah | surarakshaka
    shantatman daityanashaka te namah || 73|| matsyatmane ca te vishno vedannitavate namah | amritamanthane'drim
    bibhrate kurmaya te namah || 74|| prithvim dante bibhrate te varahaya namo namah | balim chalayate
    vipravamanaya ca te namah || 75|| namah parashuramaya kapathakshatranashine | ravanantakaraya''shu
    ramacandraya te namah || 76|| krishnanarayanaradharamashripataye namah | namo buddhasvarupaya daityamohakaraya
    te || 77|| namah kapilarupaya tattvajnanapradaya te | namo hamsasvarupaya vidhatre jnanadaya te ||
    78|| vedavyasasvarupaya vidyashravaya te namah | kalidoshavinashakritkalkirupaya te namah || 79||
    parvatyashca prabhayashca manikyah pataye namah | kambharayah suputraya gopalasunave namah || 80||
    sharanyaya surarakshakartre vidyavate namah | sadhurupaya krishnaya vallabhaya ca te namah || 81||
    jnanacaryaya daivaya dasatratre ca te namah | daityaduhkhitabhaktadirakshakaya namo namah || 82||
    sarvanetraya hritsthaya ramanathaya te namah | dhvajapadmankushavajrayavacihnavate namah || 83|| svastikajambvashtakonordhvarekhadharine
    namah | dhanustrikonakalasha'rdhacandradharine namah || 84|| goshpadavyomamatsyadidharine pattale
    namah | dakshapanau dhvajacakradhanustrishulasvastikah || 85|| minadandayavarekha yasya tasmai namo
    namah | bahu netre januni ca nasika ca stanantaram || 86|| dirghani santi te panca tasmai krishnaya
    te namah | suhrisvajaghanaprishthagrivajanghavate namah || 87|| sukshmakesha'nguliparvarada'sthidharine
    namah | kaksha kukshishca vakshashca ghranam skandho lalatakam || 88|| yasyonnatani shat santi tasmai
    shriharaye namah | netraprantau nakhastalu jihvoshthau padayostale || 89|| panitale ca raktani yasya
    santi ca te namah | urah shiro lalatam ca yasya tatani te namah || 90|| svarah sattvam ca nabhishca
    gambhiram yasya te namah | vamasakthni ramacihnam yasyasti te namo namah || 91|| hridaye dakshinavartavate
    krishnaya te namah | satrivalayashobhadhyanabhiyuktaya te namah || 92|| shitabhasvararupaya'mritapradaya
    te namah | aksharaya'vyakritanamne golokaya te namah || 93|| vaikunthaya badrishaya shvetadvipaya
    te namah | kshirasthanaya jivaya jivatave ca te namah || 94|| atmane ca tadatmane sarvatmane namo
    namah | vahnisthaya ravisthaya hiranyasthaya te namah || 95|| sura'suranivasaya bhaktartiharine namah
    | apakshaya vipakshaya bhaktapakshaya te namah || 96|| bhagava~ste kathadhamne vartadhamne ca te namah
    | sarvavidyanivasaya brahmane te namo namah || 97|| bhagavan devadevesha pahi nah sharanagatan | jalandharena
    vai svargam nirakritya sura~statah || 98|| svayattikritameveti katham tvam sahase prabho | suryashcandrashca
    vahnishca shesho dharmo nirakritah || 99|| sharanam te vayam prapta vadhastasya vicintyatam | vayam
    kshudra iva natha vicaramo'tavisthalam || 100|| iti shrilakshminarayaniyasamhitayam prathame kritayugasantane
    325
  devanagari: देवादिभिः कृतं विष्णुस्तोत्रम् तुष्टुवुस्ते हरिं लक्ष्मीनारायणं प्रजेश्वराः । सुररक्षक शान्तात्मन्
    दैत्यनाशक ते नमः ॥ ७३॥ मत्स्यात्मने च ते विष्णो वेदान्नीतवते नमः । अमृतमन्थनेऽद्रिं बिभ्रते कूर्माय
    ते नमः ॥ ७४॥ पृथ्वीं दन्ते बिभ्रते ते वराहाय नमो नमः । बलिं छलायते विप्रवामनाय च ते नमः ॥ ७५॥ नमः
    परशुरामाय कापथक्षत्रनाशिने । रावणान्तकरायाऽऽशु रामचन्द्राय ते नमः ॥ ७६॥ कृष्णनारायणराधारमाश्रीपतये
    नमः । नमो बुद्धस्वरूपाय दैत्यमोहकराय ते ॥ ७७॥ नमः कपिलरूपाय तत्त्वज्ञानप्रदाय ते । नमो हंसस्वरूपाय
    विधात्रे ज्ञानदाय ते ॥ ७८॥ वेदव्यासस्वरूपाय विद्याश्रवाय ते नमः । कलिदोषविनाशकृत्कल्किरूपाय ते नमः
    ॥ ७९॥ पार्वत्याश्च प्रभायाश्च माणिक्याः पतये नमः । कम्भरायाः सुपुत्राय गोपालसूनवे नमः ॥ ८०॥ शरण्याय
    सुररक्षाकर्त्रे विद्यावते नमः । साधुरूपाय कृष्णाय वल्लभाय च ते नमः ॥ ८१॥ ज्ञानाचार्याय दैवाय दासत्रात्रे
    च ते नमः । दैत्यदुःखितभक्तादिरक्षकाय नमो नमः ॥ ८२॥ सर्वनेत्राय हृत्स्थाय रमानाथाय ते नमः । ध्वजपद्माङ्कुशवज्रयवचिह्नवते
    नमः ॥ ८३॥ स्वस्तिकजाम्ब्वष्टकोणोर्ध्वरेखाधारिणे नमः । धनुस्त्रिकोणकलशाऽर्धचन्द्रधारिणे नमः ॥ ८४॥ गोष्पदव्योममत्स्यादिधारिणे
    पत्तले नमः । दक्षपाणौ ध्वजचक्रधनुस्त्रिशूलस्वस्तिकाः ॥ ८५॥ मीनदण्डयवरेखा यस्य तस्मै नमो नमः । बाहू
    नेत्रे जानुनी च नासिका च स्तनान्तरम् ॥ ८६॥ दीर्घाणि सन्ति ते पञ्च तस्मै कृष्णाय ते नमः । सुहृस्वजघनपृष्ठग्रीवाजङ्घावते
    नमः ॥ ८७॥ सूक्ष्मकेशाऽङ्गुलिपर्वरदाऽस्थिधारिणे नमः । कक्षा कुक्षिश्च वक्षश्च घ्राणं स्कन्धो ललाटकम्
    ॥ ८८॥ यस्योन्नतानि षट् सन्ति तस्मै श्रीहरये नमः । नेत्रप्रान्तौ नखास्तालु जिह्वोष्ठौ पादयोस्तले ॥
    ८९॥ पाणितले च रक्तानि यस्य सन्ति च ते नमः । उरः शिरो ललाटं च यस्य ततानि ते नमः ॥ ९०॥ स्वरः सत्त्वं
    च नाभिश्च गम्भीरं यस्य ते नमः । वामसक्थ्नि रमाचिह्नं यस्यास्ति ते नमो नमः ॥ ९१॥ हृदये दक्षिणावर्तवते
    कृष्णाय ते नमः । सत्रिवलयशोभाढ्यनाभियुक्ताय ते नमः ॥ ९२॥ शीतभास्वररूपायाऽमृतप्रदाय ते नमः । अक्षरायाऽव्याकृतनाम्ने
    गोलोकाय ते नमः ॥ ९३॥ वैकुण्ठाय बद्रीशाय श्वेतद्वीपाय ते नमः । क्षीरस्थानाय जीवाय जीवातवे च ते नमः
    ॥ ९४॥ आत्मने च तदात्मने सर्वात्मने नमो नमः । वह्निस्थाय रविस्थाय हिरण्यस्थाय ते नमः ॥ ९५॥ सुराऽसुरनिवासाय
    भक्तार्तिहारिणे नमः । अपक्षाय विपक्षाय भक्तपक्षाय ते नमः ॥ ९६॥ भगवँस्ते कथाधाम्ने वार्ताधाम्ने च ते
    नमः । सर्वविद्यानिवासाय ब्रह्मणे ते नमो नमः ॥ ९७॥ भगवन् देवदेवेश पाहि नः शरणागतान् । जलन्धरेण वै स्वर्गं
    निराकृत्य सुराँस्ततः ॥ ९८॥ स्वायत्तीकृतमेवेति कथं त्वं सहसे प्रभो । सूर्यश्चन्द्रश्च वह्निश्च शेषो
    धर्मो निराकृताः ॥ ९९॥ शरणं ते वयं प्राप्ता वधस्तस्य विचिन्त्यताम् । वयं क्षुद्रा इव नाथ विचरामोऽटवीस्थलम्
    ॥ १००॥ इति श्रीलक्ष्मीनारायणीयसंहितायां प्रथमे कृतयुगसन्ताने ३२५
