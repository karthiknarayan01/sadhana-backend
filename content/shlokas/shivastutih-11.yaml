id: shivastutih-11
category: stotram
name:
  english: shivastutih
  devanagari: शिवस्तुतिः
content:
  english: ittham stutva'tha mam maghe paurnamyam homamacaret | purvoktakramayogena shambhavaih saha sadaram
    || 50|| dadyadgomithunam devi kapilam ca savatsakam | paurnamyam ca prakurvita maheshaghritakambalam
    || 51|| lingam trivediparyantam gavyena sughritena ca | samsnapya mam vidhih prokto mahesha ghritakambale
    || 52|| vidhina tena kurvita maheshi ghritakambalam | sarvapapavinirmuktah shivasayujyamapnuyat ||
    53|| shivaratrivratam vakshye shivapritikaram param | ahoratram maghamasi ghritadharam prakalpayet
    || 54|| dhararupani papani vinashtani na samshayah | darshanam sparshanam linge ghritasnanam visheshatah
    || 55|| evamekagunam jneyam grihe kshetreshvathadhikam | sarvaghaughaharo maso maso'yam punyavardhanah
    || 56|| snanadanarcanavidhau vishishto bhavatushtidah | prayage tu visheshena makarasthe divakare
    || 57|| gangayamunayormadhye shrishailacala vindhyayoh | snanadanarcanam devi shraddhenanantyamashnute
    || 58|| || iti shivarahasyantargate ishvaraproktam maghamasakrite shivastutih sampurna ||
  devanagari: इत्थं स्तुत्वाऽथ मां माघे पौर्णम्यां होममाचरेत् । पूर्वोक्तक्रमयोगेन शाम्भवैः सह सादरम्
    ॥ ५०॥ दद्याद्गोमिथुनं देवि कपिलं च सवत्सकम् । पौर्णम्यां च प्रकुर्वीत महेशघृतकम्बलम् ॥ ५१॥ लिङ्गं
    त्रिवेदिपर्यन्तं गव्येन सुघृतेन च । संस्नाप्य मां विधिः प्रोक्तो महेश घृतकम्बले ॥ ५२॥ विधिना तेन कुर्वीत
    महेशि घृतकम्बलम् । सर्वपापविनिर्मुक्तः शिवसायुज्यमाप्नुयात् ॥ ५३॥ शिवरात्रिव्रतं वक्ष्ये शिवप्रीतिकरं
    परम् । अहोरात्रं माघमासि घृतधारां प्रकल्पयेत् ॥ ५४॥ धारारूपाणि पापानि विनष्टानि न संशयः । दर्शनं स्पर्शनं
    लिङ्गे घृतस्नानं विशेषतः ॥ ५५॥ एवमेकगुणं ज्ञेयं गृहे क्षेत्रेष्वथाधिकम् । सर्वाघौघहरो मासो मासोऽयं
    पुण्यवर्धनः ॥ ५६॥ स्नानदानार्चनविधौ विशिष्टो भवतुष्टिदः । प्रयागे तु विशेषेण मकरस्थे दिवाकरे ॥ ५७॥
    गङ्गायमुनयोर्मध्ये श्रीशैलाचल विन्ध्ययोः । स्नानदानार्चनं देवि श्राद्धेनानन्त्यमश्नुते ॥ ५८॥ ॥ इति
    शिवरहस्यान्तर्गते ईश्वरप्रोक्तं माघमासकृते शिवस्तुतिः सम्पूर्णा ॥
