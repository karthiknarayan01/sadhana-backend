id: namavali-52
category: stotram
name:
  english: namavali
  devanagari: नामावली
content:
  english: ringaya namah | om vrishabhaya namah | om kakudmate namah | om bilmine namah | om bilvapujyaya
    namah | om vishakhasupriyaya namah | 30 || om ugraya namah | om rudrarupaya namah | om dhanvane namah
    | om dhavate namah | om jyotirgananam pataye namah | om grahadharaya namah | om atitaya namah | om
    bhavishyaya namah | om vartamanaya namah | om ajaraya namah | 40 || om tapase namah | om varadaya
    namah | om suvarcase namah | om suviryaya namah | om smaragarvaharaya namah | om varadaya namah |
    om varenyaya namah | om svarnavarnaya namah | om arnavantarnivasaya namah | om diptashuladharaya namah
    | 50 || om purushaya namah | om aprameyaya namah | om aghoraya namah | om urdhvakeshine namah | om
    jvalamalavritangaya namah | om bhujangabharanaya namah | om vahyaya namah | om guhyaya namah | om
    svargaya namah | om narakaya namah | 60 || om haraya namah | om parameshaya namah | om skandaya namah
    | om goptre namah | om ishudhanvane namah | om kanishthaya namah | om jyeshthaya namah | om gahvareshthaya
    namah | om varnine namah | om mundaya namah | 70 || om shitikanthaya namah | om jatilaya namah | om
    bhagaya namah | om bandhave namah | om nagakarnaya namah | om balanyankudharaya namah | om bhudharaya
    namah | om adimadhyaya namah | om jnanajneyaya namah | om agamaya namah | 80 || om nigamantaikavedyaya
    namah | om abhedyaya namah | om vapushmate namah | om bhadradaya namah | om sharanyaya namah | om
    varenyaya namah | om aranyanam pataye namah | om bhutadhipataye namah | om yakshadhipataye namah |
    om rakshakaya namah | 90 || om kapardine namah | || iti shivarahasyavyutpannam vaishakhamasakrite
    shivashatashtanamavalih sampurna ||
  devanagari: ृङ्गाय नमः । ॐ वृषभाय नमः । ॐ ककुद्मते नमः । ॐ बिल्मिने नमः । ॐ बिल्वपूज्याय नमः । ॐ विशाखासुप्रियाय
    नमः । ३० ॥ ॐ उग्राय नमः । ॐ रुद्ररूपाय नमः । ॐ धन्वने नमः । ॐ धावते नमः । ॐ ज्योतिर्गणानां पतये नमः
    । ॐ ग्रहाधाराय नमः । ॐ अतीताय नमः । ॐ भविष्याय नमः । ॐ वर्तमानाय नमः । ॐ अजराय नमः । ४० ॥ ॐ तपसे नमः
    । ॐ वरदाय नमः । ॐ सुवर्चसे नमः । ॐ सुवीर्याय नमः । ॐ स्मरगर्वहराय नमः । ॐ वरदाय नमः । ॐ वरेण्याय नमः
    । ॐ स्वर्णवर्णाय नमः । ॐ अर्णवान्तर्निवासाय नमः । ॐ दीप्तशूलधराय नमः । ५० ॥ ॐ पुरुषाय नमः । ॐ अप्रमेयाय
    नमः । ॐ अघोराय नमः । ॐ ऊर्ध्वकेशिने नमः । ॐ ज्वालामालावृताङ्गाय नमः । ॐ भुजङ्गाभरणाय नमः । ॐ वाह्याय
    नमः । ॐ गुह्याय नमः । ॐ स्वर्गाय नमः । ॐ नरकाय नमः । ६० ॥ ॐ हराय नमः । ॐ परमेशाय नमः । ॐ स्कन्दाय
    नमः । ॐ गोप्त्रे नमः । ॐ इषुधन्वने नमः । ॐ कनिष्ठाय नमः । ॐ ज्येष्ठाय नमः । ॐ गह्वरेष्ठाय नमः । ॐ
    वर्णिने नमः । ॐ मुण्डाय नमः । ७० ॥ ॐ शितिकण्ठाय नमः । ॐ जटिलाय नमः । ॐ भगाय नमः । ॐ बन्धवे नमः । ॐ
    नागकर्णाय नमः । ॐ बालन्यङ्कुधराय नमः । ॐ भूधराय नमः । ॐ आदिमध्याय नमः । ॐ ज्ञानज्ञेयाय नमः । ॐ अगमाय
    नमः । ८० ॥ ॐ निगमान्तैकवेद्याय नमः । ॐ अभेद्याय नमः । ॐ वपुष्मते नमः । ॐ भद्रदाय नमः । ॐ शरण्याय नमः
    । ॐ वरेण्याय नमः । ॐ अरण्यानां पतये नमः । ॐ भूताधिपतये नमः । ॐ यक्षाधिपतये नमः । ॐ रक्षकाय नमः । ९०
    ॥ ॐ कपर्दिने नमः । ॥ इति शिवरहस्यव्युत्पन्नं वैशाखमासकृते शिवशताष्टनामावलिः सम्पूर्णा ॥
