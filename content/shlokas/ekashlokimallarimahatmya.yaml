id: ekashlokimallarimahatmya
category: ekashloki
name:
  english: ekashlokimallarimahatmya
  devanagari: एकश्लोकीमल्लारीमाहात्म्य
content:
  english: ekashloki mallarimahatmyam purvam dharmasutastapovanagata mallena santarjita jishnumvishnumatitya
    shambhumabhajan tenavatirya kshitau | tatrolka mukhamukhya daitya nivaham hatvamanim mallakam devah
    premapure'rthito'vatu vasan lingam dvayatma'rthadah ||
  devanagari: एकश्लोकी मल्लारीमाहात्म्यम् पूर्वं धर्मसुतास्तपोवनगता मल्लेन सन्तर्जिता जिष्णुंविष्णुमतीत्य
    शम्भुमभजन् तेनावतीर्य क्षितौ । तत्रोल्का मुखमुख्य दैत्य निवहं हत्वामणिं मल्लकं देवः प्रेमपुरेऽर्थीतोऽवतु
    वसन् लिङ्गं द्वयात्माऽर्थदः ॥
meaning: {}
