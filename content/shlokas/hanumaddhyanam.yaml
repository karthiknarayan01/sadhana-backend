id: hanumaddhyanam
category: stotram
name:
  english: hanumaddhyanam
  devanagari: हनुमद्ध्यानम्
content:
  english: nnikhilagurucaritranyasyapadmadvadantam | sphatikamaninikashe kundale dharayantam gajakara
    iva bahum ramasevarthajatam || 2|| ashanisamadradhimnam dirghavakshahsthalam ca navakamalasupadam
    mardayantam ripumshca | haridayitavarishtham pranasunum baladhyam nikhilagunasametam cintaye vanaresham
    || 3|| iti markandeyapuranatah shrihanumaddhyanam |
  devanagari: न्निखिलगुरुचरित्राण्यास्यपद्माद्वदन्तम् । स्फटिकमणिनिकाशे कुण्डले धारयन्तं गजकर इव बाहुं
    रामसेवार्थजातम् ॥ २॥ अशनिसमद्रढिम्नं दीर्घवक्षःस्थलं च नवकमलसुपादं मर्दयन्तं रिपूंश्च । हरिदयितवरिष्ठं
    प्राणसूनुं बलाढ्यं निखिलगुणसमेतं चिन्तये वानरेशम् ॥ ३॥ इति मार्कण्डेयपुराणतः श्रीहनुमद्ध्यानम् ।
meaning: {}
