id: kyts-jata-4-4-rasmirasi-kshayaaya-tvaa-krishna-yajurveda-taittiriya-samhita
category: stotram
name:
  english: KYTS Jata 4.4 Rasmirasi Kshayaaya Tvaa - Krishna Yajurveda Taittiriya Samhita
content:
  english: rashmi rasyasi rashmi rashmi rasi | asi kshayaya kshayaya syasi kshayaya | kshayaya tva tva
    kshayaya kshayaya tva | njinva jinva kshaya jinva pretih preti rjinva jinva pretih | preti rasyasi
    pretih preti rasi | asi dharmaya dharmaya syasi dharmaya | dharmaya tva tva dharmaya dharmaya tva
    | njinva jinva dharma jinvanviti ranviti rjinva jinvanvitih | anviti rasyasya nviti ranviti rasi |
    tva dive dive tva rjinva jinva sandhih | sandhi rasyasi sandhi asya ntarikshaya ntarikshaya syasya
    ntarikshaya | antarikshaya tva tva 'ntarikshaya ntarikshaya tva | tva 'ntariksha mantariksha ntva
    tva 'ntariksham | njinva jinva ntariksha mantariksha jinva pratidhih pratidhi rjinva jinva pratidhih
    | pratidhi rasyasi pratidhih pratidhi rasi | pratidhiriti prati asi prithivyai prithivya asyasi prithivyai
    | tva prithivyai prithivyai tva njinva jinva prithivi jinva vishtambho vishtambho jinva jinva vishtambhah
    | 'syasi vishtambho vishtambho 'si | asi vrishtyai vrishtya asyasi vrishtyai tva tva vrishtyai vrishtyai
    njinva jinva vrishtim jinva prava prava jinva jinva prava | prava 'syasi prava prava 'si | tva tva
    'hne 'hne tva 'ha raha stva tva 'hah | rjinva jinvaha raha jinva nuva 'nuva jinva jinva nuva | anuva
    'syasya nuva 'nuva 'si | asi ratriyai ratriya asyasi ratriyai | ratriyai tva tva ratriyai ratriyai
    tva | tva ratrigm ratri njinva jinva ratrigm ratri jinvoshi gushig jinva jinvoshik | ushi gasya syushi
    gushi gasi | asi vasubhyo vasubhyo 'syasi vasubhyah | || vasubhya stva tva vasubhyo vasubhya stva
    | ntva tva vasun | n jinva jinva vasun jinva praketah praketo jinva jinva praketah | 'syasi praketah
    praketo 'si | asi rudrebhyo rudrebhyo 'syasi rudrebhyah | rudrebhya stva tva rudrebhyo rudrebhya stva
    | rudran jinva jinva rudra nrudran jinva | rjinva jinva suditih | suditi rasyasi suditi asya dityebhya
    adityebhyo 'syasya dityebhyah | adityebhya stva tva ''dityebhya adityebhya stva | adityan jinva jinvaditya
    nadityan jinva | jinvauja ojo jinva jinvaujah | 'sya syoja ojo 'si | asi pitribhyah pitribhyo pitribhya
    stva tva pitribhyah pitribhya stva | pitribhya iti pitri pitrin jinva jinva pitri jinva tantu stantu
    rjinva jinva tantuh | tantura syasi tantu stantu rasi | asi prajabhyah prajabhyo 'syasi prajabhyah
    | prajabhya stva tva prajabhyah prajabhya stva | tva prajah praja stva praja jinva jinva prajah praja
    jinva | jinva pritanashat pritanasha djinva jinva pritanashat | pritanasha dasyasi pritanashat pritanasha
    dasi | asi pashubhyah pashubhyo pashubhya stva tva pashubhyah pashubhya stva | pashun jinva jinva
    pashu drevaj jinva jinva revat | asyoshadhibhya oshadhibhyo 'sya syoshadhibhyah | oshadhibhya stva
    tvaushadhibhya oshadhibhya stva | tvaushadhi roshadhi stva tvaushadhih | rjinva jinvau shadhi roshadhi
    jinva bhiji dabhijij jinva jinva bhijit | abhiji dasyasya bhijida bhijidasi | asi yuktagrava yuktagrava
    'syasi yuktagrava | yuktagra vendra yendraya yuktagrava yuktagra vendraya | yuktagraveti yukta indraya
    tva tvendra yendraya tva | njinva jinvendra mindra jinva dhipati radhipati rjinva jinva dhipatih |
    adhipati rasyasya dhipati radhipati rasi | asi pranaya pranaya pranaya tva tva pranaya pranaya tva
    | njinva jinva prana jinva yanta yanta jinva jinva yanta | yanta 'syasi yanta yanta 'si | asya panaya
    panaya apanaya tva tva 'panaya panaya tva | njinva jinva pana mapana jinva sagmsarpah sagmsarpo jinva
    jinva sagmsarpah | 'syasi sagmsarpah sagmsarpo 'si | asi cakshushe cakshushe 'syasi cakshushe | cakshushe
    tva tva cakshushe cakshushe tva | tva cakshu shcakshu stva tva cakshuh | rjinva jinva cakshu shcakshu
    jinva vayodha vayodha jinva jinva vayodhah | vayodha asyasi vayodha vayodha asi | asi shrotraya shrotraya
    syasi shrotraya | shrotraya tva tva shrotraya shrotraya tva | tva shrotragg shrotra ntva tva shrotra
    njinva jinva shrotragg shrotra ttrivrij jinva jinva trivrit | trivri dasyasi trivri tpravri dasyasi
    pravrit | pravri dasyasi pravri dvivri dasyasi vivrit | asi niroho niroho 'syasi niroho niroho 'si
    | asi prarohah praroho 'syasi prarohah praroho 'si | asyanuroho 'nuroho nuroho 'nuroho 'si | asi vasuko
    vasuko 'syasi vasuko vasuko 'si | rveshashri rasyasi veshashrih | veshashri rasyasi veshashri rvasyashti
    rasyasi vasyashtih | vasyashti rasyasi vasyashti rajnya syasi rajni rajnyasi | asi praci pracya syasi
    praci kpraci praci dik | dig vasavo vasavo dig dig vasavah | vasava ste te vasavo vasava ste | te
    deva deva ste te devah | deva adhipatayo 'dhipatayo deva deva adhipatayah | adhipatayo 'gni ragni
    radhipatayo 'dhipatayo 'gnih | hetinagm hetina magni ragnir mpratidharta pratidharta hetinagm hetina
    pratidharta trivri tpratidharta pratidharta trivrit | pratidharteti prati sstoma stva tva stomah |
    sstomah prithivyam | shrayatu shrayatu prithivya shrayatvajya majyagg shrayatu shrayatvajya ajya muktha
    muktha majya majya muktham | uktha mavyathayada vyathaya duktha muktha mavyathayat | thstabhnatu stabhna
    tvavyathaya davyathaya stabhnatu rathantaragm rathantaragg stabhnatu stabhnatu rathantaram | rathantaragm
    sama sama rathantaragm rathantaragm sama | sama pratishthityai pratishthityai sama sama pratishthityai
    | pratishthityai vira dvirat pratishthityai pratishthityai virat | pratishthitya iti prati asi dakshina
    dakshina 'syasi dakshina | dakshina dig dig dakshina dakshina dik | dig rudra rudra dig dig rudrah
    | rudra ste te rudra rudra ste te deva deva ste te devah | deva adhipatayo 'dhipatayo deva deva adhipatayah
    | adhipataya indra indro 'dhipatayo 'dhipataya indrah | indro hetinagm hetina mindra indro hetinam
    | mpratidharta pratidharta hetinagm hetina pratidharta pancadashah pancadashah pratidharta pratidharta
    pancadashah | pratidharteti prati tva pancadashah pancadasha stva sstoma stva tva stomah | sstomah
    prithivyam | shrayatu shrayatu prithivya uktha mavyathaya davyathaya duktha muktha mavyathayat | thstabhnatu
    stabhna tvavyathaya davyathaya thstabhnatu stabhnatu brihat | sama pratishthityai pratishthityai sama
    sama pratishthityai | pratishthityai samra tthsamrat pratishthityai pratishthityai samrat | pratishthitya
    iti prati samra dasyasi samra praticya syasi pratici digaditya aditya dig digadityah | || aditya ste
    ta aditya aditya ste te deva deva ste te devah | deva adhipatayo 'dhipatayo deva deva adhipatayah
    | ssomo 'dhipatayo 'dhipataya somo hetinagm hetinagm soma mpratidharta pratidharta hetinagm hetina
    pratidharta saptadasha ssaptadashah pratidharta pratidharta saptadashah | pratidharteti prati sstoma
    stva tva stomah | sstomah prithivyam | shrayatu shrayatu prithivya shrayatu marutvatiya mmarutvatiyagg
    shrayatu shrayatu marutvatiya marutvatiya muktha muktha mmarutvatiya muktham | uktha mavyathaya davyathaya
    duktha muktha mavyathayat | thstabhnatu stabhna tvavyathaya davyathaya stabhnatu vairupam stabhnatu
    stabhnatu vairupam | vairupagm sama sama vairupam sama pratishthityai pratishthityai sama sama pratishthityai
    | pratishthityai svara tthsvarat pratishthityai pratishthityai svarat | pratishthitya iti prati svara
    dasyasi svara cya sya syudici | udici dig digudi cyudici dik | dig vishve vishve dig dig vishve vishve
    te te vishve vishve te | te deva deva ste te devah | deva adhipatayo 'dhipatayo deva deva adhipatayah
    | adhipatayo varuno varuno 'dhipatayo 'dhipatayo varunah | varuno hetinagm hetinam va~runo varuno
    hetinam | mpratidharta pratidharta hetinagm hetina pratidhartai kavigmsha ekavigmshah pratidharta
    pratidhartai kavigmshah | pratidharteti prati tvaikavigmsha ekavigmsha stva ekavigmsha ityeka sstoma
    stva tva stomah | sstomah prithivyam | shrayatu shrayatu prithivya shrayatu nishkevalya shrayatu shrayatu
    nishkevalyam | nishkevalya muktha muktha nnishkevalya muktham | uktha mavyathaya davyathaya duktha
    muktha mavyathayat | thstabhnatu stabhna tvavyathaya davyathaya stabhnatu vairajam stabhnatu stabhnatu
    vairajam | vairajagm sama sama vairajam sama pratishthityai pratishthityai sama sama pratishthityai
    | pratishthitya adhipatnya dhipatni pratishthityai pratishthitya adhipatni | pratishthitya iti prati
    adhipat nyasya syadhipa tnyadhipatnyasi | asi brihati briha tyasyasi brihati | brihati dig dig brihati
    brihati dik | mmaruto maruto dig di maruta ste te maruto maruta ste | te deva deva ste te devah |
    deva adhipatayo 'dhipatayo deva deva adhipatayah | adhipatayo brihaspati rbrihaspati radhipatayo 'dhipatayo
    brihaspatih | mpratidharta pratidharta hetinagm hetina pratidharta trinavatrayastrigmshau trinavatrayastrigmshau
    pratidharta pratidharta trinavatrayastrigmshau | pratidharteti prati trinavatrayastrigmshau tva tva
    trinavatrayastrigmshau trinavatrayastrigmshau tva trinavatrayastrigmshaviti trinava trayastrigmshau
    | tva stomau stomau stomau stomau prithivyam | vai~shvadevagnimarute vai shvadevagnimarute shrayatag
    vai~shvadevagnimarute | vaishvadevagnimarute ukthe ukthe vai shvadevagnimarute vai shvadevagnimarute
    ukthe | vaishvadevagnimarute iti vaishvadeva ukthe avyathayanti avyathayanti ukthe ukthe avyathayanti
    | avyathayanti stabhnitag stabhnita mavyathayanti avyathayanti stabhnitam | avyathayanti itiyavyathayanti
    | stabhnitagm shakvararaivate sha kvararaivate stabhnitag stabhnitagm shakvararaivate | shakvararaivate
    samani samani shakvararaivate sha shakvararaivate iti shakvara samani pratishthityai pratishthityai
    samani samani pratishthityai | samani iti samani | pratishthitya antarikshaya ntarikshaya pratishthityai
    pratishthitya antarikshaya | pratishthitya iti prati shaya rishayo 'ntarikshaya ntarikshaya r tva
    prathamajah prathamaja stva prathamaja deveshu deveshu prathamajah prathamaja deveshu | prathamaja
    iti prathama deveshu divo divo deveshu deveshu divah | divo matraya matraya divo divo matraya | matraya
    varina varina matraya matraya varina | varina prathantu pratha ntvarina varina prathantu | prathantu
    vidharta vidharta prathantu prathantu vidharta | vidharta ca ca vidharta vidharta ca | aya madhipati
    radhipati raya maya madhipatih | adhipatishca cadhipati radhipatishca | vi~dana nakasya nakasya sam
    nakasya prishthe prishthe nakasya nakasya prishthe | prishthe suvarge suvarge prishthe prishthe suvarge
    | suvarge loke loke suvarge suvarge loke | ya~jamanam ~loke loke yajamanam | ca sadayantu sadayantu
    ca ca sadayantu | sadayantviti sadayantu | || mpurah puro 'ya maya puro harikesho harikeshah purah
    puro harikeshah | ssuryarashmir harikesho harikesha suryarashmi stasya tasya suryarashmi ssuryarashmi
    stasya | suryarashmiriti surya tasya rathagrithso rathagrithsa stasya tasya rathagrithsah | rathagrithsashca
    ca rathagrithso rathagrithsashca | ca rathauja rathaujashca ca rathaujah | rathaujashca ca rathauja
    rathaujashca | ca senanigramanyau senanigramanyau ca ca senanigramanyau senanigramanyau punjikasthala
    punjikasthala senanigramanyau senanigramanyau punjikasthala | senanigramanyaviti senani punjikasthala
    ca ca punjikasthala punjikasthala ca | punjikasthaleti punjika ca kritasthala kritasthala ca ca kritasthala
    | kritasthala ca ca kritasthala kritasthala ca | caphsarasa vaphsarasau ca caphsarasau aphsarasau
    yatudhana yatudhana aphsarasa vaphsarasau yatudhanah ryatudhana yatudhana hetih | yatudhana iti yatu
    heti rakshagmsi rakshagmsi hetir rakshagmsi prahetih praheti rakshagmsi rakshagmsi prahetih | mprahetih
    praheti rayam | ndakshina dakshina 'ya maya dakshina vishvakarma vishvakarma dakshina dakshina vishvakarma
    | vishvakarma tasya tasya vishvakarma vishvakarma tasya | vishvakarmeti vishva tasya rathasvano rathasvana
    stasya tasya rathasvanah | rathasvanashca ca rathasvano rathasvanashca | ca rathecitro rathecitrashca
    ca rathecitrah | rathecitrashca ca rathecitro rathecitrashca | ca senanigramanyau senanigramanyau
    ca ca senanigramanyau senanigramanyau menaka menaka senanigramanyau senanigramanyau menaka | senanigramanyaviti
    senani menaka ca ca menaka menaka ca | ca sahajanya sahajanya ca ca sahajanya | sahajanya ca ca sahajanya
    sahajanya ca | caphsarasa vaphsarasau ca caphsarasau aphsarasau dankshnavo dankshnavo 'phsarasa vaphsarasau
    dankshnavah | dankshnavah pashavah pashavo dankshnavo dankshnavah pashavah | hetih pashavah pashavo
    hetih | hetih paurusheyah paurusheyo hetir paurusheyo vadho vadhah paurusheyah paurusheyo vadhah |
    vadhah prahetih praheti rvadho vadhah prahetih | mprahetih praheti rayam | dvishvavyaca vishvavyacah
    pashca vishvavyaca stasya tasya vishvavyaca vishvavyaca stasya | vishvavyaca iti vishva tasya rathaproto
    rathaprota stasya tasya rathaprotah | rathaprotashca ca rathaproto rathaprotashca | casamaratho 'samarathashca
    casamarathah | asamarathashca casamaratho 'samarathashca | ca senanigramanyau senanigramanyau ca ca
    senanigramanyau senanigramanyau pramlocanti pramlocanti senanigramanyau senanigramanyau senanigramanyaviti
    senani pramlocanti ca ca pramlocanti pramlocanti ca | pramlocantiti pra canumlocantya numlocanti ca
    canumlocanti | || anumlocanti ca canumloca ntyanumlocanti ca | anumlocantityanu caphsarasa vaphsarasau
    ca caphsarasau ssarpa aphsarasa vaphsarasau sarpah | rvyaghra vyaghra hetir vyaghrah prahetih praheti
    rvyaghra vyaghrah prahetih | mprahetih praheti rayam | aya muttara duttara daya maya muttarat | ya~dvasu
    ruttara duttara ya~dvasu stasya tasya sam ttasya tasya senajit | senajic ca ca senaji ca sushenah
    sushenashca ca sushenah | sushenashca ca sushenah sushenashca | ca senanigramanyau senanigramanyau
    ca ca senanigramanyau senanigramanyau vishvaci vishvaci senanigramanyau senanigramanyau vishvaci senanigramanyaviti
    senani vishvaci ca ca vishvaci vishvaci ca | ca ghritaci ghritaci ca ca ghritaci ghritaci ca ca ghritaci
    ghritaci ca | caphsarasa vaphsarasau ca caphsarasau 'phsarasa vaphsarasa vapah | heti rapa apo hetih
    | heti rvato vato hetir vatah prahetih praheti rvato vatah prahetih | mprahetih praheti rayam | rvagvasu
    rarvagvasu rupa arvagvasu stasya tasya rvagvasu rarvagvasu stasya | arvagvasurityarvak tasya tarkshya
    starkshya stasya tasya tarkshyah | tarkshyashca ca tarkshya starkshyashca | carishtanemi rarishtanemishca
    carishtanemih | arishtanemishca carishtanemi rarishtanemishca | arishtanemirityarishta ca senanigramanyau
    senanigramanyau ca ca senanigramanyau senanigramanya vurva shyurvashi senanigramanyau senanigramanya
    vurvashi senanigramanyaviti senani urvashi ca corva shyurvashi ca | ca purvacittih purvacittishca
    ca purvacittih | purvacittishca ca purvacittih purvacittishca | purvacittiriti purva caphsarasa vaphsarasau
    ca caphsarasau dvidyu daphsarasa vaphsarasau vidyut | dvidyu ddhetih | heti ravasphurjann | nprahetih
    praheti ravasphurja avasphurjannityava praheti stebhya stebhyah prahetih praheti stebhyah | tebhyo
    namo nama stebhya stebhyo namah | nama ste te namo nama ste | te no na ste te nah | no mridayantu
    mridayantu no no mridayantu | mridayantu te te mridayantu mridayantu te | ndvishmo dvishmo yam dvishmo
    yo yo dvishmo dvishmo yah | ca no nashca ca nah | no dveshti dveshti no no dveshti | ndveshti dveshti
    tam | vo jambhe jambhe vo vo jambhe jambhe dadhami dadhami jambhe jambhe dadhami | rdadhami dadha
    myayoh | tva ''yo rayo stva tva sadane sadane tva tva sadane | sadane sadayami sadayami sadane sadane
    sadayami | sadaya myavato 'vata ssadayami sadaya myavatah | nchayaya mavato 'vata shchayaya nnamo
    nama shchayaya namah samudraya samudraya namo namah samudraya | samudraya namo namah samudraya samudraya
    namah | namah samudrasya samudrasya namo namah samudrasya | samudrasya cakshase cakshase samudrasya
    samudrasya cakshase | cakshase parameshthi parameshthi cakshase cakshase parameshthi | tva parameshthi
    parameshthi tva tva sadayatu sadayatu tva tva sadayatu | sadayatu divo diva ssadayatu sadayatu divah
    | divah prishthe prishthe divo divah prishthe | prishthe vyacasvatim mprishthe prishthe vyacasvatim
    | prabhumatimiti pra paribhumatimiti pari ndrigmha drigmha diva ndrigmha drigmha diva rvishvasmai
    vishvasmai higmsir vishvasmai pranaya pranaya vishvasmai vishvasmai pranaya | pranaya panaya panaya
    pranaya pranaya panaya | apanaya vyanaya vyanaya panaya panaya vyanaya | vyana yodana yodanaya vyanaya
    vyana yodanaya | udanaya pratishthayai pratishthaya udana yodanaya pratishthayai pratishthayai caritraya
    caritraya pratishthayai pratishthayai caritraya | pratishthaya iti prati ssurya shcaritraya caritraya
    suryah | surya stva tva surya abhi patu patvabhyabhi patu | patu mahya mahya patu patu mahya | mahya
    svastya svastya mahya mahya svastya | svastya chardisha chardisha svastya svastya chardisha chardisha
    shantamena shantamena chardisha chardisha shantamena | shantamena taya taya shantamena shantamena
    taya taya devataya devataya taya taya devataya | devataya 'ngirasva dangirasva ddevataya devataya
    'ngirasvat | ddhruva dhruva 'ngirasva dangirasva dhruva sida sida dhruva dhruva sida | protha dashvo
    'shvah protha ashvo na nashvo 'shvo na | na yavase yavase na na yavase | yavase yavase avishyann |
    yada maho maho yada yada mahah | adasya syada dasya | vato anvanu vato vato anu anu vati vatyan vanu
    vati | rvati vati shocih | adha sma sma dhadha sma | sma te te sma sma te | krishna mastyasti krishna
    rmurdha murdha 'gni ragni murdha divo divo murdha murdha divah | ddivo divah kakut | patih prithivyah
    prithivya spatish patih prithivyah | mprithivyah prithivya ayam | apagm retagmsi retag syapa mapagm
    retagmsi | retagmsi jinvati jinvati retagmsi retagmsi jinvati | jinvatiti jinvati | tva magne agne
    tva tpushkara dagne agne pushkarat | pushkara dadhyadhi pushkara adhya tharva 'tharva 'dhyadhya tharva
    | rni ratharva 'tharva nih | niramanthata manthata ni amanthatetyamanthata | murdhno vishvasya vishvasya
    murdhno murdhno vishvasya | vishvasya vaghato vaghato vishvasya vishvasya vaghatah | vaghata iti vaghatah
    | aya magni ragni raya maya magnih | ssahasrinah sahasrino agni ragni sahasrino vajasya vajasya sahasrinah
    sahasrino vajasya | vajasya shatinah shatino vajasya vajasya shatinah | shatina spatish patih shatinah
    shatina spatih | rmurdha murdha kavih | kavi rayinagm rayina nkavih kavi rayinam | rayinamiti rayinam
    | bhuvo yajnasya yajnasya bhuvo bhuvo yajnasya | yajnasya rajaso rajaso yajnasya yajnasya rajasah
    | rajasashca ca rajaso rajasashca | ca neta neta ca ca neta | neta yatra yatra neta neta yatra | ryatra
    yatra niyudbhih | ssacase sacase niyudbhi niyudbhiriti niyut sacase shivabhih shivabhi ssacase sacase
    shivabhih | shivabhiriti shivabhih | ndivi divi murdhana ndadhishe dadhishe murdhana dadhishe suvarshagm
    suvarsha ndadhishe dadhishe suvarsham | njihvagm suvarshagm suvarsha suvarshamiti suvah jihva magne
    agne jihva agne cakrishe cakrishe agne agne cakrishe | cakrishe havyavahagm havyavaha ncakrishe cakrishe
    havyavaha havyavahamiti havya dhya gni ragni rabodhya bo ssamidha samidha 'gni ragni njananagm samidha
