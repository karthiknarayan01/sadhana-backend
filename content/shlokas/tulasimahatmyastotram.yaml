id: tulasimahatmyastotram
category: stotram
name:
  english: tulasimahatmyastotram
  devanagari: तुलसीमाहात्म्यस्तोत्रम्
content:
  english: tulasimahatmyastotram vanyuvaca | tulasi ropita yena grihasthena mahaphala | grihe tasya na
    daridryam jayate natra samshayah || 1|| tulasya darshanadeva paparashirnivartate | shriye'mritakanotpanna
    tulasi harivallabha || 2|| pibantya ruciram panam praninam papaharini | yasya rupe vasellakshmih skandhe
    sagarasambhava || 3|| patreshu satatam shrishca shakhasu kamala svayam | indira pushpaga nityam phale
    kshirabdhisambhava || 4|| tulasi shushkakashtheshu ya rupa vishvavyapini | majjayam padmavasa ca tvacasu
    ca haripriya || 5|| sarvarupa ca sarvesha paramanandadayini | tulasiprashako martyo yamalokam na gacchati
    || 6|| shirastha tulasi yasya na yamyairanubhuyate | mukhastha tulasi yasya nirvanapadadayini || 7||
    hastasthatulasiyasya sa tapatrayavarjitah | tulasi hridayastha ca praninam sarvakamada || 8|| skandhastha
    tulasi yasya sa papairna ca lipyate | kanthaga tulasi yasya jivanmuktah sada hi sah || 9|| tulasisambhavam
    patram sada vahati yo narah | manasa cintitam siddhim samprapnoti na samshayah || 10|| tulasim sarvakayarthasadhinim
    dushtavarinim | yo narah pratyaham sincenna sa yati yamalayam || 11|| caturmasye visheshena vanditapi
    vimuktida | narayanam jalagatam jnatva vrikshagatam tatha || 12|| praninam kripaya lakshmistulasivrikshamashrita
    | caturmasye samayate tulasi sevita yadi || 13|| tesham papasahasrani yanti nityam sahasradha | govindasmaranam
    nityam tulasivanasevanam || 14|| tulasisecanam dugdhaishcaturmasye'tidurlabham | tulasim varddhayedyastu
    manavo yadi shraddhaya || 15|| alavalambudanaishca pavitam sakalam kulam | yatha shristulasisamstha
    nityameva hi varddhate || 16|| tatha tatha grihasthasya kamavriddhih prajayate | brahmacari grihasthashca
    vanaprastho yatistatha || 17|| tatha prakritayah sarvastulasisevane ratah | shraddhaya yadi jayante
    na tasam duhkhado harih || 18|| eko harih sakalavrikshagato vibhati nanarasaistu paribhavitamurtireva
    | vrikshadhivasamagamatkamala ca devi duhkhadinashanakari satatam smrita'pi || 19|| iti shriskandapurane
    nagarakhande saptacatvarimshadhikadvishatatamadhyayantargatam tulasimahimastotram samaptam | skandapurana
    | nagarakhanda | adhyaya 249
  devanagari: तुलसीमाहात्म्यस्तोत्रम् वाण्युवाच । तुलसी रोपिता येन गृहस्थेन महाफला । गृहे तस्य न दारिद्र्यं
    जायते नात्र संशयः ॥ १॥ तुलस्या दर्शनादेव पापराशिर्निवर्तते । श्रियेऽमृतकणोत्पन्ना तुलसी हरिवल्लभा
    ॥ २॥ पिबन्त्या रुचिरं पानं प्राणिनां पापहारिणी । यस्या रूपे वसेल्लक्ष्मीः स्कन्धे सागरसम्भवा ॥ ३॥
    पत्रेषु सततं श्रीश्च शाखासु कमला स्वयम् । इन्दिरा पुष्पगा नित्यं फले क्षीराब्धिसम्भवा ॥ ४॥ तुलसी शुष्ककाष्ठेषु
    या रूपा विश्वव्यापिनी । मज्जायां पद्मवासा च त्वचासु च हरिप्रिया ॥ ५॥ सर्वरूपा च सर्वेशा परमानन्ददायिनी
    । तुलसीप्राशको मर्त्यो यमलोकं न गच्छति ॥ ६॥ शिरस्था तुलसी यस्य न याम्यैरनुभूयते । मुखस्था तुलसी यस्य
    निर्वाणपददायिनी ॥ ७॥ हस्तस्थातुलसीयस्य स तापत्रयवर्जितः । तुलसी हृदयस्था च प्राणिनां सर्वकामदा ॥ ८॥
    स्कन्धस्था तुलसी यस्य स पापैर्न च लिप्यते । कण्ठगा तुलसी यस्य जीवन्मुक्तः सदा हि सः ॥ ९॥ तुलसीसम्भवं
    पत्रं सदा वहति यो नरः । मनसा चिन्तितां सिद्धिं सम्प्राप्नोति न संशयः ॥ १०॥ तुलसीं सर्वकायार्थसाधिनीं
    दुष्टवारिणीम् । यो नरः प्रत्यहं सिञ्चेन्न स याति यमालयम् ॥ ११॥ चातुर्मास्ये विशेषेण वन्दितापि विमुक्तिदा
    । नारायणं जलगतं ज्ञात्वा वृक्षगतं तथा ॥ १२॥ प्राणिनां कृपया लक्ष्मीस्तुलसीवृक्षमाश्रिता । चातुर्मास्ये
    समायाते तुलसी सेविता यदि ॥ १३॥ तेषां पापसहस्राणि यान्ति नित्यं सहस्रधा । गोविन्दस्मरणं नित्यं तुलसीवनसेवनम्
    ॥ १४॥ तुलसीसेचनं दुग्धैश्चातुर्मास्येऽतिदुर्लभम् । तुलसीं वर्द्धयेद्यस्तु मानवो यदि श्रद्धया ॥ १५॥
    आलवालाम्बुदानैश्च पावितं सकलं कुलम् । यथा श्रीस्तुलसीसंस्था नित्यमेव हि वर्द्धते ॥ १६॥ तथा तथा गृहस्थस्य
    कामवृद्धिः प्रजायते । ब्रह्मचारी गृहस्थश्च वानप्रस्थो यतिस्तथा ॥ १७॥ तथा प्रकृतयः सर्वास्तुलसीसेवने
    रताः । श्रद्धया यदि जायन्ते न तासां दुःखदो हरिः ॥ १८॥ एको हरिः सकलवृक्षगतो विभाति नानारसैस्तु परिभावितमूर्तिरेव
    । वृक्षाधिवासमगमत्कमला च देवी दुःखादिनाशनकरी सततं स्मृताऽपि ॥ १९॥ इति श्रीस्कन्दपुराणे नागरखण्डे सप्तचत्वारिंशाधिकद्विशततमाध्यायान्तर्गतं
    तुलसीमहिमास्तोत्रं समाप्तम् । स्कन्दपुराण । नागरखण्ड । अध्याय २४९
