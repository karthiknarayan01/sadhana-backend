id: kanaka
category: stotram
name:
  english: kanaka
  devanagari: कनक
content:
  english: lokadhinathagrihinimamritabdhiputrim || 16|| kamale kamalakshavallabhe tvam karunapuratarangitairapangaih
    | avalokaya mamakincananam prathamam patramakritrimam dayayah || 17|| stuvanti ye stutibhiramibhiranvaham
    trayimayim tribhuvanamataram ramam | gunadhika gurutarabhagyabhagino bhavanti te bhuvi budhabhavitashayah
    || 18|| || iti shrimacchankaracaryakrita shri kanakadharastotram sampurnam || namo'stu hemambujapithikayai
    namo'stu bhumandalanayikayai | namo'stu devadidayaparayai namo'stu sharngayudhavallabhayai || 19||
    namo'stu devyai bhrigunandanayai namo'stu vishnorurasi sthitayai | namo'stu lakshmyai kamalalayayai
    namo'stu damodaravallabhayai || 20|| namo'stu kantyai kamalekshanayai namo'stu bhutyai bhuvanaprasutyai
    | namo'stu devadibhirarcitayai namo'stu nandatmajavallabhayai || 21|| devi prasida jagadishvari lokamatah
    kalyanagatri kamalekshanajivanathe | daridryabhitihridayam sharanagatam mam alokaya pratidinam sadayairapangaih
    || 22|| bilvatavimadhyalasatsaroje sahasrapatre sukhasannivishtam | ashtapadambhoruhapanipadmam suvarnavarnam
    pranamami lakshmim || 23|| kamalasanapanina lalate likhitamaksharapanktimasya jantoh | parimarjaya
    mataranghrina te dhanikadvaranivasa duhkhadogdhrim || 24|| ambhoruham janmagriham bhavatya vakshahsthalam
    bhartrigriham murareh | karunyatah kalpaya padmavase lilagriham me hridayaravindam || 25|| suvarnadharastotram
    yacchankaracaryanirmitam | trisandhyam yah pathennityam sa kubera samo bhavet || ayam stavah svamina
    shankarabhagavatpadena brahmavratasthena kalatinamni svagrama evakincanyaparikhinnaya dvijagrihinya
    nirdhanatvamarjanaya niramayi | tena stavena prita lakshmirvipram vipuladhanadanenaprinayaditi shankaravijayatah
    samadhigamyate
  devanagari: लोकाधिनाथगृहिणीममृताब्धिपुत्रीम् ॥ १६॥ कमले कमलाक्षवल्लभे त्वं करुणापूरतरङ्गितैरपाङ्गैः
    । अवलोकय मामकिञ्चनानां प्रथमं पात्रमकृत्रिमं दयायाः ॥ १७॥ स्तुवन्ति ये स्तुतिभिरमीभिरन्वहं त्रयीमयीं
    त्रिभुवनमातरं रमाम् । गुणाधिका गुरुतरभाग्यभागिनो भवन्ति ते भुवि बुधभाविताशयाः ॥ १८॥ ॥ इति श्रीमच्छङ्कराचार्यकृत
    श्री कनकधारास्तोत्रं सम्पूर्णम् ॥ नमोऽस्तु हेमाम्बुजपीठिकायै नमोऽस्तु भूमण्डलनायिकायै । नमोऽस्तु देवादिदयापरायै
    नमोऽस्तु शार्ङ्गायुधवल्लभायै ॥ १९॥ नमोऽस्तु देव्यै भृगुनन्दनायै नमोऽस्तु विष्णोरुरसि स्थितायै । नमोऽस्तु
    लक्ष्म्यै कमलालयायै नमोऽस्तु दामोदरवल्लभायै ॥ २०॥ नमोऽस्तु कान्त्यै कमलेक्षणायै नमोऽस्तु भूत्यै भुवनप्रसूत्यै
    । नमोऽस्तु देवादिभिरर्चितायै नमोऽस्तु नन्दात्मजवल्लभायै ॥ २१॥ देवि प्रसीद जगदीश्वरि लोकमातः कल्याणगात्रि
    कमलेक्षणजीवनाथे । दारिद्र्यभीतिहृदयं शरणागतं माम् आलोकय प्रतिदिनं सदयैरपाङ्गैः ॥ २२॥ बिल्वाटवीमध्यलसत्सरोजे
    सहस्रपत्रे सुखसन्निविष्टाम् । अष्टापदाम्भोरुहपाणिपद्मां सुवर्णवर्णां प्रणमामि लक्ष्मीम् ॥ २३॥ कमलासनपाणिना
    ललाटे लिखितमक्षरपङ्क्तिमस्य जन्तोः । परिमार्जय मातरङ्घ्रिणा ते धनिकद्वारनिवास दुःखदोग्ध्रीम् ॥ २४॥
    अम्भोरुहं जन्मगृहं भवत्या वक्षःस्थलं भर्तृगृहं मुरारेः । कारुण्यतः कल्पय पद्मवासे लीलागृहं मे हृदयारविन्दम्
    ॥ २५॥ सुवर्णधारास्तोत्रं यच्छङ्कराचार्यनिर्मितम् । त्रिसन्ध्यं यः पठेन्नित्यं स कुबेर समो भवेत् ॥
    अयं स्तवः स्वामिना शङ्करभगवत्पादेन ब्रह्मव्रतस्थेन कालटिनाम्नि स्वग्राम एवाकिञ्चन्यपरिखिन्नाया द्विजगृहिण्या
    निर्धनत्वमार्जनाय निरमायि । तेन स्तवेन प्रीता लक्ष्मीर्विप्रं विपुलधनदानेनाप्रीणयदिति शङ्करविजयतः
    समाधिगम्यते
