id: bhagavaccharanastotram
category: stotram
name:
  english: bhagavaccharanastotram
  devanagari: भगवच्छरणस्तोत्रम्
content:
  english: roga haranti satatam prabalah shariram kamadayo'pyanudinam pradahanti cittam | mrityushca nrityati
    sada kalayan dinani tasmattvamadyasharanam mama dinabandho || 2|| deho vinashyati sada parinamashilashcittam
    ca khidyati sada vishayanuragi | buddhih sada hi ramate vishayeshu nantastasmattvamadyasharanam mama
    dinabandho || 3|| ayurvinashyati yathamaghatasthatoyam vidyutprabheva capala bata yauvanashrih | vriddha
    pradhavati yatha mrigarajapatni tasmattvamadya sharanam mama dinabandho || 4|| ayavdyayo mama bhavatyadhiko
    vinite kamadayo hi balino nibalah shamadyah | mrityuryada tudati mam bata kim vadeyam tasmattvamadyasharanam
    mama dinabandho || 5|| taptam tapo na hi kadapi mayeha tanva vanya tatha na hi kadapi tapashca taptam
    | mithyabhibhashanaparena na manasam hi tasmattvamadyasharanam mama dinabandho || 6|| stabdham mano
    mama sada na hi yati saumyam cakshushca me na tava pashyati vishvarupam | vaca tathaiva na vadenmama
    saumyavanim tasmattvamadyasharanam mama dinabandho || 7|| sattvam na me manasi yati rajastamobhyam
    viddhe tada kathamaho shubhakarmavarta | sakshatparamparataya sukhasadhanam tattasmattvamadyasharanam
    mama dinabandho || 8|| puja krita na hi kada'pi maya tvadiya mantram tvadiyamapi me na japedrasajna
    | cittam na me smarati te caranau hyavapya tasmattvamadyasharanam mama dinabandho || 9|| yajno na
    me'sti hutidanadayadi yukto jnanasya sadhanagano na vivekamukhyah | jnanam kva sadhanaganena vina
    kva mokshastasmattvamadyasharanam mama dinabandho || 10|| satsamgatirhi vidita tava bhaktihetuh sa'pyadya
    nasti bata pamditamanino me | tamantarena na hi sa kva ca bodhavarta tasmattvamadyasharanam mama dinabandho
    || 11|| drishtirna bhutavishaya samatabhidhana vaishamyameva tadiyam vishayikaroti | shantih kuto
    mama bhavetsamata na cetsyattasmattvamadyasharanam mama dinabandho || 12|| maitri sameshu na ca me'sti
    kadapi natha dine tatha na karuna mudita ca punye | pape'nupekshanavato mama mutkatham syattasmattvamadyasharanam
    mama dinabandho || 13|| netradikam mama bahirvishayeshu saktam nantarmukham bhavati tamavihaya tasya
    | kvantarmukhatvamapahaya sukhasya varta tasmattvamadyasharanam mama dinabandho || 14|| tyaktam grihadyapi
    maya bhavatapashantyai nasidasau hritahrido mama mayaya te | sa cadhuna kimu vidhasyati neti jane
    tasmattvamadyasharanam mama dinabandho || 15|| prapta dhanam grihakutumbagajashvadara rajyam yadaihikamathendrapurashca
    natha | sarvam vinashvaramidam na phalaya kasmai tasmattvamadyasharanam mama dinabandho || 16|| pranannirudhya
    vidhina na krito hi yogo yogam vina'sti manasah sthirata kuto me | tam vai vina mama na cetasi shantivarta
    tasmattvamadyasharanam mama dinabandho || 17|| jnanam yatha mama bhavetkripaya gurunam sevam tatha
    na vidhina'karavam hi tesham | seva'pi sadhanataya viditasti citte tasmattvamadyasharanam mama dinabandho
    || 18|| tirthadisevanamahavidhina hi natha nakari yena manaso mama shodhanam syat | shuddhim vina
    na manaso'vagamapavargau tasmattvamadyasharanam mama dinabandho || 19|| vedantashilanamapi pramitim
    karoti brahmatmanah pramitisadhanasamyutasya | naiva'sti sadhanalavo mayi natha tasyastasmattvamadyasharanam
    mama dinabandho || 20|| govinda shamkara hare girijesha mesha shambho janardana girisha mukunda samba
    | nanya gatirmama kathamcana vam vihaya tasmatprabho mama gatih kripaya vidheya || 21|| etatstavam
    bhagavadashrayanabhidhanam ye manavah pratidinam pranatah pathanti | te manava bhavaratim paribhuya
    shantim gacchanti kim ca paramatmani bhaktimaddha || 22|| iti shrimanmauktikaramodasinashishyabrahmanandaviracitam
    bhagavaccharanastotram sampurnam||
  devanagari: रोगा हरन्ति सततं प्रबलाः शरीरं कामादयोऽप्यनुदिनं प्रदहन्ति चित्तम् । मृत्युश्च नृत्यति सदा
    कलयन् दिनानि तस्मात्त्वमद्यशरणं मम दीनबन्धो ॥ २॥ देहो विनश्यति सदा परिणामशीलश्चित्तं च खिद्यति सदा
    विषयानुरागि । बुद्धिः सदा हि रमते विषयेषु नान्तस्तस्मात्त्वमद्यशरणं मम दीनबन्धो ॥ ३॥ आयुर्विनश्यति
    यथामघटस्थतोयं विद्युत्प्रभेव चपला बत यौवनश्रीः । वृद्धा प्रधावति यथा मृगराजपत्नी तस्मात्त्वमद्य शरणं
    मम दीनबन्धो ॥ ४॥ आयाव्द्ययो मम भवत्यधिको विनीते कामादयो हि बलिनो निबलाः शमाद्याः । मृत्युर्यदा तुदति
    मां बत किं वदेयं तस्मात्त्वमद्यशरणं मम दीनबन्धो ॥ ५॥ तप्तं तपो न हि कदापि मयेह तन्वा वाण्या तथा न
    हि कदापि तपश्च तप्तम् । मिथ्याभिभाषणपरेण न मानसं हि तस्मात्त्वमद्यशरणं मम दीनबन्धो ॥ ६॥ स्तब्धं मनो
    मम सदा न हि याति सौम्यं चक्षुश्च मे न तव पश्यति विश्वरूपम् । वाचा तथैव न वदेन्मम सौम्यवाणीं तस्मात्त्वमद्यशरणं
    मम दीनबन्धो ॥ ७॥ सत्त्वं न मे मनसि याति रजस्तमोभ्यां विद्धे तदा कथमहो शुभकर्मवार्ता । साक्षात्परंपरतया
    सुखसाधनं तत्तस्मात्त्वमद्यशरणं मम दीनबन्धो ॥ ८॥ पूजा कृता न हि कदाऽपि मया त्वदीया मन्त्रं त्वदीयमपि
    मे न जपेद्रसज्ञा । चित्तं न मे स्मरति ते चरणौ ह्यवाप्य तस्मात्त्वमद्यशरणं मम दीनबन्धो ॥ ९॥ यज्ञो न
    मेऽस्ति हुतिदानदयादि युक्तो ज्ञानस्य साधनगणो न विवेकमुख्यः । ज्ञानं क्व साधनगणेन विना क्व मोक्षस्तस्मात्त्वमद्यशरणं
    मम दीनबन्धो ॥ १०॥ सत्संगतिर्हि विदिता तव भक्तिहेतुः साऽप्यद्य नास्ति बत पंडितमानिनो मे । तामन्तरेण
    न हि सा क्व च बोधवार्ता तस्मात्त्वमद्यशरणं मम दीनबन्धो ॥ ११॥ दृष्टिर्न भूतविषया समताभिधाना वैषम्यमेव
    तदियं विषयीकरोति । शान्तिः कुतो मम भवेत्समता न चेत्स्यात्तस्मात्त्वमद्यशरणं मम दीनबन्धो ॥ १२॥ मैत्री
    समेषु न च मेऽस्ति कदापि नाथ दीने तथा न करुणा मुदिता च पुण्ये । पापेऽनुपेक्षणवतो मम मुत्कथं स्यात्तस्मात्त्वमद्यशरणं
    मम दीनबन्धो ॥ १३॥ नेत्रादिकं मम बहिर्विषयेषु सक्तं नान्तर्मुखं भवति तामविहाय तस्य । क्वान्तर्मुखत्वमपहाय
    सुखस्य वार्ता तस्मात्त्वमद्यशरणं मम दीनबन्धो ॥ १४॥ त्यक्तं गृहाद्यपि मया भवतापशान्त्यै नासीदसौ हृतहृदो
    मम मायया ते । सा चाधुना किमु विधास्यति नेति जाने तस्मात्त्वमद्यशरणं मम दीनबन्धो ॥ १५॥ प्राप्ता धनं
    गृहकुटुम्बगजाश्वदारा राज्यं यदैहिकमथेन्द्रपुरश्च नाथ । सर्वं विनश्वरमिदं न फलाय कस्मै तस्मात्त्वमद्यशरणं
    मम दीनबन्धो ॥ १६॥ प्राणान्निरुध्य विधिना न कृतो हि योगो योगं विनाऽस्ति मनसः स्थिरता कुतो मे । तां
    वै विना मम न चेतसि शान्तिवार्ता तस्मात्त्वमद्यशरणं मम दीनबन्धो ॥ १७॥ ज्ञानं यथा मम भवेत्कृपया गुरूणां
    सेवां तथा न विधिनाऽकरवं हि तेषाम् । सेवाऽपि साधनतया विदितास्ति चित्ते तस्मात्त्वमद्यशरणं मम दीनबन्धो
    ॥ १८॥ तीर्थादिसेवनमहाविधिना हि नाथ नाकारि येन मनसो मम शोधनं स्यात् । शुद्धिं विना न मनसोऽवगमापवर्गौ
    तस्मात्त्वमद्यशरणं मम दीनबन्धो ॥ १९॥ वेदान्तशीलनमपि प्रमितिं करोति ब्रह्मात्मनः प्रमितिसाधनसंयुतस्य
    । नैवाऽस्ति साधनलवो मयि नाथ तस्यास्तस्मात्त्वमद्यशरणं मम दीनबन्धो ॥ २०॥ गोविन्द शंकर हरे गिरिजेश मेश
    शम्भो जनार्दन गिरीश मुकुन्द साम्ब । नान्या गतिर्मम कथंचन वां विहाय तस्मात्प्रभो मम गतिः कृपया विधेया
    ॥ २१॥ एतत्स्तवं भगवदाश्रयणाभिधानं ये मानवाः प्रतिदिनं प्रणताः पठन्ति । ते मानवा भवरतिं परिभूय शान्तिं
    गच्छन्ति किं च परमात्मनि भक्तिमद्धा ॥ २२॥ इति श्रीमन्मौक्तिकरामोदासीनशिष्यब्रह्मानन्दविरचितं भगवच्छरणस्तोत्रं
    सम्पूर्णम्॥
