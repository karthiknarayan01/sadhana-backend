id: yatirajastotram-2
category: stotram
name:
  english: yatirajastotram 2
  devanagari: यतिराजस्तोत्रम् २
content:
  english: stathaivagatassaugata bhattasankhyah || bhaje bhashya0|| 22|| shathah kapilah ko'pi lakshyo
    na mokshe vinashtasvaro'bhutsa maheshvaro'pi | kanadah pramanapranado'pi shantah pramanam bruvanashca
    ganapateyah || bhaje bhashya0|| 23|| svayambrahmasutrayabhave'pi buddhya katham brahmasutradibhashyam
    vidadhyat | katham tasya shishya babhuvurmanushyah kuto nasti roshah kaleresha doshah || bhaje bhashya0||
    24|| puradarshitam colabhritkitakantham samaruhya sahyacalendropakantham | akunthaprabhavo'tra vaikunthakalpah
    sakanthiravam prapya sollunthamaste || bhaje bhashya0|| 25|| namah punyakaundinyagotrodbhavebhyo namassalasadgramasadvamshajebhyah
    | namo vaishnavebhyo mahadbhyo'rbhakebhyo namah sheshabhavadacidbhyashca cidbhyah | bhaje bhashyakaram
    bhaje lakshmanaryam bhaje salasadgramaramanujaryam || 26|| iti shrisalagramasthalacaryapurushanarapatirajasamsthanaguruddandavedanta
  devanagari: स्तथैवागतास्सौगता भाट्टसाङ्ख्याः ॥ भजे भाष्य०॥ २२॥ शठः कापिलः कोऽपि लक्ष्यो न मोक्षे विनष्टस्वरोऽभूत्स
    माहेश्वरोऽपि । कणादः प्रमाणप्रणादोऽपि शान्तः प्रमाणं ब्रुवाणश्च गाणापतेयः ॥ भजे भाष्य०॥ २३॥ स्वयम्ब्रह्मसूत्रायभावेऽपि
    बुद्ध्या कथं ब्रह्मसूत्रादिभाष्यं विदध्यात् । कथं तस्य शिष्या बभूवुर्मनुष्याः कुतो नास्ति रोषः कलेरेष
    दोषः ॥ भजे भाष्य०॥ २४॥ पुरादर्शितं चोलभृत्कीटकण्ठं समारुह्य सह्याचलेन्द्रोपकण्ठम् । अकुण्ठप्रभावोऽत्र
    वैकुण्ठकल्पः सकण्ठीरवं प्राप्य सोल्लुण्ठमास्ते ॥ भजे भाष्य०॥ २५॥ नमः पुण्यकौण्डिन्यगोत्रोद्भवेभ्यो
    नमस्सालसद्ग्रामसद्वंशजेभ्यः । नमो वैष्णवेभ्यो महद्भ्योऽर्भकेभ्यो नमः शेषभावादचिद्भ्यश्च चिद्भ्यः ।
    भजे भाष्यकारं भजे लक्ष्मणार्यं भजे सालसद्ग्रामरामानुजार्यम् ॥ २६॥ इति श्रीसालग्रामस्थलाचार्यपुरुषनरपतिराजसंस्थानगुरूद्दण्डवेदान्त
meaning: {}
