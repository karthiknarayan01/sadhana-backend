id: nrisimhastotramshridharasvami
category: stotram
name:
  english: nrisimhastotramshridharasvami
  devanagari: नृसिंहस्तोत्रम्श्रीधरस्वामी
content:
  english: bhavanashanaikasamudyamam karunakaram sugunalayam nijabhaktataranarakshanaya hiranyakashyapughatinam
    | bhavamohadaranakamanashanaduhkhavaranahetukam bhajapavanam sukhasagaram narasimhamadvayarupinam
    || 1|| guru sarvabhaumamarghatakam munisamstutam surasevitam atishantivaridhimaprameyamanamayam shritarakshanam
    | bhavamokshadam bahushobhanam mukhapankajam nijashantidam bhajapavanam sukhasagaram narasimhamadvayarupinam
    || 2|| nijarupakam vitatam shivam suvidarshanayahitatkshanam atibhaktavatsalarupinam kila darutah
    susamagatam | avinashinam nijatejasam shubhakarakam balarupinam bhajapavanam sukhasagaram narasimhamadvayarupinam
    || 3|| avikarinam madhubhashinam bhavatapaharanakovinda sujanaihsukamitadayinam nijabhaktahritsuvirajitam
    | ativiradhiraparakramotkatarupinam parameshvaram bhajapavanam sukhasagaram narasimhamadvayarupinam
    || 4|| jagato'sya karanameva saccidanantasaukhyamakhanditam suvidhayimangalavigraham tamasahparam
    sumahojvalam | nijarupamityatisundaram khalusamvibhavya hridisthitam bhajapavanam sukhasagaram narasimhamadvayarupinam
    || 5|| pancaratnatmakam stotram shrinrisimhasya pavanam | ye pathanti mudabhaktya jivanmukta bhavantite
    || 6|| || iti shrimat paramahamsaparivrajakacarya sadguru bhagavana shridharasvamimaharajaviracitam
    shrinrisimhastotram sampurnam | racanakaḻah shrinrisimhajanmotsavah racanasthaḻah varadapurama
  devanagari: भवनाशनैकसमुद्यमं करुणाकरं सुगुणालयं निजभक्ततारणरक्षणाय हिरण्यकश्यपुघातिनम् । भवमोहदारणकामनाशनदुःखवारणहेतुकं
    भजपावनं सुखसागरं नरसिंहमद्वयरूपिणम् ॥ १॥ गुरू सार्वभौममर्घातकं मुनिसंस्तुतं सुरसेवितं अतिशान्तिवारिधिमप्रमेयमनामयं
    श्रितरक्षणम् । भवमोक्षदं बहुशोभनं मुखपङ्कजं निजशान्तिदं भजपावनं सुखसागरं नरसिंहमद्वयरूपिणम् ॥ २॥ निजरूपकं
    विततं शिवं सुविदर्शनायहितत्क्षणं अतिभक्तवत्सलरूपिणं किल दारुतः सुसमागतम् । अविनाशिनं निजतेजसं शुभकारकं
    बलरूपिणं भजपावनं सुखसागरं नरसिंहमद्वयरूपिणम् ॥ ३॥ अविकारिणं मधुभाषिणं भवतापहारणकोविन्द सुजनैःसुकामितदायिनं
    निजभक्तहृत्सुविराजितम् । अतिवीरधीरपराक्रमोत्कटरूपिणं परमेश्वरं भजपावनं सुखसागरं नरसिंहमद्वयरूपिणम्
    ॥ ४॥ जगतोऽस्य कारणमेव सच्चिदनन्तसौख्यमखण्डितं सुविधायिमङ्गलविग्रहं तमसःपरं सुमहोज्वलम् । निजरूपमित्यतिसुन्दरं
    खलुसंविभाव्य हृदिस्थितं भजपावनं सुखसागरं नरसिंहमद्वयरूपिणम् ॥ ५॥ पञ्चरत्नात्मकं स्तोत्रं श्रीनृसिंहस्य
    पावनम् । ये पठन्ति मुदाभक्त्या जीवन्मुक्ता भवन्तिते ॥ ६॥ ॥ इति श्रीमत् परमहंसपरिव्राजकाचार्य सद्गुरू
    भगवान श्रीधरस्वामीमहाराजविरचितं श्रीनृसिंहस्तोत्रं सम्पूर्णम् । रचनाकाळः श्रीनृसिंहजन्मोत्सवः रचनास्थळः
    वरदपुरम
