id: annamayya-keerthanas-paluku-tenela-talli
category: stotram
name:
  english: Annamayya Keerthanas Paluku Tenela Talli
content:
  english: khanda capu pallavi paluku denèla talli pavalincènu | kaliki tanamula vibhuni galasinadi gana
    || niganigani momupai nèṟulu gèlakula jèdara pagalaina daka jèli pavalincènu | tègani parinatulato
    tèllavarinadaka jagadeka pati manasu jatti gònè gana || paluku denèla talli pavalincènu kòngu jarina
    mèṟugu gubba lòlayaga daruni bangaru medapai bavalincènu | cèngaluva kanugònala singaramulu dòlaka
    angaja gurunitoda nalasinadigana || paluku denèla talli pavalincènu natanato mutyala malagupai paravashambuna
    daruni pavalincènu | tiru venkatacala dhipuni kaugita galasi aravirai nunu jèmalu nantinadigana ||
    paluku denèla talli pavalincènu | kaliki tanamula vibhuni galasinadi gana ||
  devanagari: खण्ड चापु पल्लवि पलुकु देनॆल तल्लि पवलिञ्चॆनु । कलिकि तनमुल विभुनि गलसिनदि गान ॥ निगनिगनि
    मोमुपै नॆऱुलु गॆलकुल जॆदर पगलैन दाक जॆलि पवलिञ्चॆनु । तॆगनि परिणतुलतो तॆल्लवारिनदाक जगदेक पति मनसु
    जट्टि गॊनॆ गान ॥ पलुकु देनॆल तल्लि पवलिञ्चॆनु कॊङ्गु जारिन मॆऱुगु गुब्ब लॊलयग दरुणि बङ्गारु मेडपै
    बवलिञ्चॆनु । चॆङ्गलुव कनुगॊनल सिङ्गारमुलु दॊलक अङ्गज गुरुनितोड नलसिनदिगान ॥ पलुकु देनॆल तल्लि पवलिञ्चॆनु
    नटनतो मुत्याल मलगुपै परवशम्बुन दरुणि पवलिञ्चॆनु । तिरु वेङ्कटाचला धिपुनि कौगिट गलसि अरविरै नुनु जॆमलु
    नण्टिनदिगान ॥ पलुकु देनॆल तल्लि पवलिञ्चॆनु । कलिकि तनमुल विभुनि गलसिनदि गान ॥
