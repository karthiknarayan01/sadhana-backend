id: candishatakam
category: shataka
name:
  english: candishatakam
  devanagari: चण्डीशतकम्
content:
  english: madyendordvau kalankau tyajati patirapam dhairyamalokya candram | vayo kampyastvayanyo naya
    yama mahishadatmayugyam yayarau pishte nashtam jahasa dyujanamiti jaya sastu devi shriye vah || 15||
    shulaprotadupattaplutamahi mahishadutpatantya sravantya vartmanyarajyamane sapadi makhabhujam jatasandhyapramohah
    | nrityanhasena matva vijayamahamaham manayamitivadi yamashlishya pranrittah punarapi purabhitparvati
    patu sa vah || 16|| nakaukonayakadyairdyuvasatibhirasishyamadhama dharitrim rundhanvardhishnuvindhyacalacakitamanovrittibhirvikshito
    yah | padotpishtah sa yasya mahishasuraripurnupurantavalambi lebhe lolendranilopalashakalatulam staduma
    sa shriye vah || 17|| durvarasya dyudhamnam mahishitavapusho vidvishah patu yushma
  devanagari: मद्येन्दोर्द्वौ कलङ्कौ त्यजति पतिरपां धैर्यमालोक्य चन्द्रम् । वायो कम्प्यस्त्वयान्यो नय
    यम महिषादात्मयुग्यं ययारौ पिष्टे नष्टं जहास द्युजनमिति जया सास्तु देवी श्रिये वः ॥ १५॥ शूलप्रोतादुपात्तप्लुतमहि
    महिषादुत्पतन्त्या स्रवन्त्या वर्त्मन्यारज्यमाने सपदि मखभुजां जातसन्ध्याप्रमोहः । नृत्यन्हासेन मत्वा
    विजयमहमहं मानयामीतिवादी यामाश्लिष्य प्रनृत्तः पुनरपि पुरभित्पार्वती पातु सा वः ॥ १६॥ नाकौकोनायकाद्यैर्द्युवसतिभिरसिश्यामधामा
    धरित्रीं रुन्धन्वर्धिष्णुविन्ध्याचलचकितमनोवृत्तिभिर्वीक्षितो यः । पादोत्पिष्टः स यस्या महिषसुररिपुर्नूपुरान्तावलम्बी
    लेभे लोलेन्द्रनीलोपलशकलतुलां स्तादुमा सा श्रिये वः ॥ १७॥ दुर्वारस्य द्युधाम्नां महिषितवपुषो विद्विषः
    पातु युष्मा
