id: batukabhairavakhadgamalastotram
category: stotram
name:
  english: batukabhairavakhadgamalastotram
  devanagari: बटुकभैरवखड्गमालास्तोत्रम्
content:
  english: batukabhairavakhadgamalastotram om hrim namah shri batuka hridayadeva shirodeva shikhadeva
    kavacadeva netradevastradeva ishana tatpurusha aghora vamadeva sadyojata pancavaktra asitangabhairava
    rurubhairava candabhairava krodhabhairava unmattabhairava kapalabhairava bhishanabhairava samharabhairava
    bhutanatha adinatha anandanatha siddha shabaranatha sahajanandanatha nihsimanandanatha paratparaguru
    parameshthiguru guru dakiniputra rakiniputra lakiniputra kakiniputra shakiniputra hakiniputra maliniputra
    deviputra umaputra rudraputra matriputra urdhvamukhiputra adhomukhiputra brahmiputrabatuka maheshvariputrabatuka
    vaishnaviputrabatuka kaumariputrabatuka indraniputrabatuka mahalakshmiputrabatuka mahalakshmiputrabatuka
    varahiputrabatuka camundaputrabatuka hetuka tripurantaka vetala agnijihva kalantaka karala ekapada
    bhimarupa acala hatakesha shrikanthesha anantesha sukshmesha trimurttisha amaresha ardhisha bharabhutisha
    atishisha sthanvisha haresha jhintisha bhaukitakesha sadyojatesha anugrahesha akruresha mahasenesha
    krodhisha candesha pancantakesha shivottamesha ekarudresha kurmesha ekanetresha caturananesha ajesha
    sharvesha somesha langalisha darukesha ardhanarishvara umakantesha ashadhisha dandisha anrisha minesha
    lohitesha shikhisha chagalesha dvirandesha mahakalesha va
  devanagari: बटुकभैरवखड्गमालास्तोत्रम् ॐ ह्रीं नमः श्री बटुक हृदयदेव शिरोदेव शिखादेव कवचदेव नेत्रदेवास्त्रदेव
    ईशान तत्पुरुष अघोर वामदेव सद्योजात पञ्चवक्त्र असिताङ्गभैरव रुरुभैरव चण्डभैरव क्रोधभैरव उन्मत्तभैरव
    कपालभैरव भीषणभैरव संहारभैरव भूतनाथ आदिनाथ आनन्दनाथ सिद्ध शाबरनाथ सहजानन्दनाथ निःसीमानन्दनाथ परात्परगुरु
    परमेष्ठिगुरु गुरु डाकिनीपुत्र राकिनीपुत्र लाकिनीपुत्र काकिनीपुत्र शाकिनीपुत्र हाकिनीपुत्र मालिनीपुत्र
    देवीपुत्र उमापुत्र रुद्रपुत्र मातृपुत्र ऊर्ध्वमुखीपुत्र अधोमुखीपुत्र ब्राह्मीपुत्रबटुक माहेश्वरीपुत्रबटुक
    वैष्णवीपुत्रबटुक कौमारीपुत्रबटुक इन्द्राणीपुत्रबटुक महालक्ष्मीपुत्रबटुक महालक्ष्मीपुत्रबटुक वाराहीपुत्रबटुक
    चामुण्डापुत्रबटुक हेतुक त्रिपुरान्तक वेताल अग्निजिह्व कालान्तक कराल एकपाद भीमरूप अचल हाटकेश श्रीकण्ठेश
    अनन्तेश सूक्ष्मेश त्रिमूर्त्तिश अमरेश अर्धीश भारभूतीश अतिशीश स्थाण्वीश हरेश झिण्टीश भौकितकेश सद्योजातेश
    अनुग्रहेश अक्रूरेश महासेनेश क्रोधीश चण्डेश पञ्चान्तकेश शिवोत्तमेश एकरुद्रेश कूर्मेश एकनेत्रेश चतुराननेश
    अजेश शर्वेश सोमेश लाङ्गलीश दारुकेश अर्धनारीश्वर उमाकान्तेश आषाढीश दण्डीश अन्रीश मीनेश लोहितेश शिखीश
    छागलेश द्विरण्डेश महाकालेश वा
meaning: {}
