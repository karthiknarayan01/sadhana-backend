id: sarpasuktam
category: sukta
name:
  english: sarpasuktam
  devanagari: सर्पसूक्तम्
content:
  english: svapnassvapnadhikarane sarvam nishvapaya janam | a suryamanyamstvapayavyusham jagriyamaham
    || 4|| ajagaronama sarpah sarpiravisho mahan | tasminhi sarpassudhitastenatva svapayamasi || 5|| sarpassarpo
    ajagarasarpiravisho mahan | tasya sarpatsindhavastasya gadhamashimahi || 6|| kaliko nama sarpo navanagasahasrabalah
    | yamunahradehaso jato yo narayana vahanah || 7|| yadi kalikadutasya yadi kah kalikat bhayat | janmabhumimatikranto
    nirvisho yati kalikah || 8|| ayahindra pathibhirilitebhiryajnamimanno bhagadeyanjushasva | triptam
    juhurmatulasye vayosha bhagasthe paitrishvaseyivapamiva || 9|| yashaskaram balavantam prabhutvam tameva
    rajadhipatirbabhuva | sankirnanagashvapatirnaranam sumangalyam satatam dirghamayuh || 10|| karkotako
    nama sarpo yodvashti visha ucyate | tasya sarpasya sarpatvam tasmai sarpa namo'stute || 11|| sarpagayatri
  devanagari: स्वप्नस्स्वप्नाधिकरणे सर्वं निष्वापया जनम् । आ सूर्यमन्यांस्त्वापयाव्युषं जाग्रियामहम् ॥
    ४॥ अजगरोनाम सर्पः सर्पिरविषो महान् । तस्मिन्हि सर्पस्सुधितस्तेनत्वा स्वापयामसि ॥ ५॥ सर्पस्सर्पो अजगरसर्पिरविषो
    महान् । तस्य सर्पात्सिन्धवस्तस्य गाधमशीमहि ॥ ६॥ कालिको नाम सर्पो नवनागसहस्रबलः । यमुनाह्रदेहसो जातो
    यो नारायण वाहनः ॥ ७॥ यदि कालिकदूतस्य यदि काः कालिकात् भयात् । जन्मभूमिमतिक्रान्तो निर्विषो याति कालिकः
    ॥ ८॥ आयाहीन्द्र पथिभिरीलितेभिर्यज्ञमिमन्नो भागदेयञ्जुषस्व । तृप्तां जुहुर्मातुलस्ये वयोषा भागस्थे
    पैतृष्वसेयीवपामिव ॥ ९॥ यशस्करं बलवन्तं प्रभुत्वं तमेव राजाधिपतिर्बभूव । सङ्कीर्णनागाश्वपतिर्नराणां
    सुमङ्गल्यं सततं दीर्घमायुः ॥ १०॥ कर्कोटको नाम सर्पो योद्वष्टी विष उच्यते । तस्य सर्पस्य सर्पत्वं तस्मै
    सर्प नमोऽस्तुते ॥ ११॥ सर्पगायत्री
