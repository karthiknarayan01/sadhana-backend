    ॥ अङ्गा॑रा भवन्ति । तेभ्यो ऽर्चिरुदे॑ति । प्र॒जाप॑ति॒स्तर् ह्य॒ग्निः । तस्मि॒न्॒ यस्य॒ तथा॑विधे॒ जुह्व॑ति
    । प्र॒जाप॑तावे॒वास्या ऽङ्गा॑रा॒ अद्ध्यू॑हन्ते । ब्रह्म॒ ह्य॒ग्निः । तस्मि॒न् ॒ यस्य॒ तथा॑विधे॒ जुह्व॑ति
    । ब्रह्म॑न्ने॒वास्या म्भ॑वति ॥ वसु॑षु रु॒द्रेष्वा॑दि॒त्येषु॒ विश्वे॑षु दे॒वेषु॑ । इन्द्रे प्र॒जाप॑तौ॒
    ब्रह्मन्न्॑ । अप॑रिवर्गमे॒वास्यै॒तासु॑ दे॒वता॑सु हु॒त ञ्जुह्व॑ति । य उ॑ चैन दे॒वं दे॒वेषु॑ च॒त्वारि॑
    च न्निहि॑तः प्रथ॒मग्ं सर्व॑ ए॒व नि॑त॒रामङ्गा॑रा॒ ऽङ्गा॑रा॒ ब्रह्म॒वसु॑ष्व॒ष्टौ न्त्वा॑ स॒त्येन॒ परि॑षिञ्चा॒मीति॑
    सा॒य म्परि॑षिञ्चति । स॒त्य न्त्व॒र्तेन॒ परि॑षिञ्चा॒मीति॑ प्रा॒तः । अ॒ग्निर्वा ऋ॒तम् । अ॒सावा॑दि॒त्य
    स्स॒त्यम् । अ॒ग्निमे॒व तदा॑दि॒त्येन॑ सा॒य म्परि॑षिञ्चति । अ॒ग्निना॑ ऽऽदि॒त्य म्प्रा॒तस्सः । याव॑दहोरा॒त्रे
    भव॑तः । ताव॑दस्य लो॒कस्य॑ । नार्ति॒र्न रिष्टिः॑ । नान्तो॒ न प॑र्य॒न्तो ञ्जुह्व॑ति । य उ॑ चैन दे॒वं
    ऽग्निहो॒त्रप्रा॑यणा य॒ज्ञाः प्र॒जाप॑तिरकामयतात्म॒न्व न्त्वा॑ स॒त्येनैका॑दश यो वा अ॑ग्निहो॒त्रस्यो॑प॒सदो॑
    ॥ हरिः॑ ओम् ॥ ॥ कृष्ण यजुर्वेदीय तैत्तिरीय ब्राह्मणे द्वितीयाष्टके प्रथमः प्रपाठक
