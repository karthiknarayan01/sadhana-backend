id: paranathakavacam
category: kavacha
name:
  english: paranathakavacam
  devanagari: परनाथकवचम्
content:
  english: 5|| asya shriparanathamahakavacasya sadashiva rishih paramatma devata hsauh bijam jnanashaktiranandam
    kilakam sarvabhishtasiddhyarthe viniyogah | omnkaram vedabijam me sada patu shirodhanam | hsauh mahapretarajah
    kapalam patu sarvada || 85
  devanagari: ५॥ अस्य श्रीपरनाथमहाकवचस्य सदाशिव ऋषिः परमात्मा देवता ह्सौः बीजं ज्ञानशक्तिरानन्दं कीलकं
    सर्वाभीष्टसिद्ध्यर्थे विनियोगः । ॐङ्कारं वेदबीजं मे सदा पातु शिरोधनम् । ह्सौः महाप्रेतराजः कपालं पातु
    सर्वदा ॥ ८५
meaning: {}
