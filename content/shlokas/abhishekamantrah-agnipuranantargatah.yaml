id: abhishekamantrah-agnipuranantargatah
category: mantra
name:
  english: abhishekamantrah (agnipuranantargatah)
  devanagari: अभिषेकमन्त्राः (अग्निपुराणान्तर्गताः)
content:
  english: ringavanmerurmalyavan gandhamadanah | mahendro malayah sahyah shaktimanrikshavan girih || 57||
    vindhyashca paripatrashca girayah shantidastu te | rigvedadyah shadangani itihasapuranakam || 58||
    ayurvedashca gandharvadhanurvedopavedakah | shiksha kalpo vyakaranam niruktam jyotishangatih || 59||
    chando'ngani ca vedashca mimamsa nyayavistarah | dharmashastram purananca vidya hyetashcaturdasha
    || 60|| sankhyam yogah pashupatam veda vai pancaratrakam | kritantapancakam hyetadgayatri ca shiva
    tatha || 61|| durga vidya ca gandhari pantu tvam shantidashca te | lavanekshusurasarpidadhidugdhajalabdhayah
    || 62|| catvarah sagarah pantu tirthani vividhani ca | pushkarashca prayagashca prabhaso naimishah
    parah || 63|| gayashirsho brahmashirastirthamuttaramanasam | kalodako nandikundastirtham pancanadastatha
    || 64|| bhrigutirtham prabhasanca tatha camarakantakam | jambumargashca vimalah kapilasya tatha''shramah
    || 65|| gangadvarakushavartau vindhyako nilaparvatah | varahaparvatashcaiva tirthankanakhalam tatha
    || 66|| kalanjarashca kedaro rudrakotistathaiva ca | varanasi mahatirtham badaryashrama eva ca ||
    67|| dvaraka shrigiristirtham tirthanca purushottamah | shalagramo'tha varahah sindhusagarasangamah
    || 68|| phalgutirtham bindusarah karavirashramastatha | nadyo gangasarasvatyah shatadrurgandaki tatha
    || 69|| acchoda ca vipasha ca vitasta devika nadi | kaveri varuna caiva nishcara gomati nadi || 70||
    para carmanvati rupa mandakini mahanadi | tapi payoshni vena ca gauri vaitarani tatha || 71|| godavari
    bhimarathi tungabhadra'rani tatha | candrabhaga shiva gauri abhishincantu pantu vah
  devanagari: ृङ्गवान्मेरुर्माल्यवान् गन्धमादनः । महेन्द्रो मलयः सह्यः शक्तिमानृक्षवान् गिरिः ॥ ५७॥ विन्ध्यश्च
    पारिपात्रश्च गिरयः शान्तिदास्तु ते । ऋग्वेदाद्याः षडङ्गानि इतिहासपुराणकम् ॥ ५८॥ आयुर्वेदश्च गन्धर्वधनुर्वेदोपवेदकाः
    । शिक्षा कल्पो व्याकरणं निरुक्तं ज्योतिषाङ्गतिः ॥ ५९॥ छन्दोऽङ्गानि च वेदाश्च मीमांसा न्यायविस्तरः
    । धर्मशास्त्रं पुराणञ्च विद्या ह्येताश्चतुर्दश ॥ ६०॥ साङ्ख्यं योगः पाशुपतं वेदा वै पञ्चरात्रकम् ।
    कृतान्तपञ्चकं ह्येतद्गायत्री च शिवा तथा ॥ ६१॥ दुर्गा विद्या च गान्धारी पान्तु त्वां शान्तिदाश्च ते
    । लवणेक्षुसुरासर्पिदधिदुग्धजलाब्धयः ॥ ६२॥ चत्वारः सागराः पान्तु तीर्थानि विविधानि च । पुष्करश्च प्रयागश्च
    प्रभासो नैमिषः परः ॥ ६३॥ गयाशीर्षो ब्रह्मशिरस्तीर्थमुत्तरमानसम् । कालोदको नन्दिकुण्डस्तीर्थं पञ्चनदस्तथा
    ॥ ६४॥ भृगुतीर्थं प्रभासञ्च तथा चामरकण्टकम् । जम्बूमार्गश्च विमलः कपिलस्य तथाऽऽश्रमः ॥ ६५॥ गङ्गाद्वारकुशावर्तौ
    विन्ध्यको नीलपर्वतः । वराहपर्वतश्चैव तीर्थङ्कणखलं तथा ॥ ६६॥ कालञ्जरश्च केदारो रुद्रकोटिस्तथैव च ।
    वाराणसी महातीर्थं बदर्याश्रम एव च ॥ ६७॥ द्वारका श्रीगिरिस्तीर्थं तीर्थञ्च पुरुषोत्तमः । शालग्रामोऽथ
    वाराहः सिन्धुसागरसङ्गमः ॥ ६८॥ फल्गुतीर्थं बिन्दुसरः करवीराश्रमस्तथा । नद्यो गङ्गासरस्वत्यः शतद्रुर्गण्डकी
    तथा ॥ ६९॥ अच्छोदा च विपाशा च वितस्ता देविका नदी । कावेरी वरुणा चैव निश्चरा गोमती नदी ॥ ७०॥ पारा चर्मण्वती
    रूपा मन्दाकिनी महानदी । तापी पयोष्णी वेणा च गौरी वैतरणी तथा ॥ ७१॥ गोदावरी भीमरथी तुङ्गभद्राऽरणी तथा
    । चन्द्रभागा शिवा गौरी अभिषिञ्चन्तु पान्तु वः
