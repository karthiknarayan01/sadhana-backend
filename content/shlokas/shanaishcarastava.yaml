id: shanaishcarastava
category: stotram
name:
  english: shanaishcarastava
  devanagari: शनैश्चरस्तव
content:
  english: tithyatmakastithigano yogarashirmuhurtatma karta dinapatih prabhuh || 17|| shamipushpapriyah
    shyamastrailokyabhayadayakah | nilavasah kriyasindhurnilanjanacayacchavih || 18|| sarvarogaharo devah
    siddho devaganastutah | ashtottarashatam namnam saureshchayasutasya yah || 19|| pathennityam tasya
    pida samasta nashyati dhruvam | kritva pujam pathenmartyo bhaktimanyah stavam sada || 20|| visheshatah
    shanidine pida tasya vinashyati | janmalagne sthitirvapi gocare krurarashige || 21|| dashasu ca gate
    saurau tada stavamimam pathet | pujayedyah shanim bhaktya shamipushpakshatambaraih || 22|| vidhaya
    lohapratimam naro duhkhadvimucyate | badha ya'nyagrahanam ca yah pathettasya nashyati || 23|| bhito
    bhayadvimucyeta baddho mucyeta bandhanat | rogi rogadvimucyeta narah stavamimam pathet || 24|| putravandhanavan
    shriman jayate natra samshayah || 25|| narada uvaca || stavam nishamya parthasya pratyaksho'bhut shanaishcarah
    | dattva rajne varah kamam shanishcantardadhe tada || 26|| || iti shri bhavishyapurane shanaishcarastavarajah
    sampurnah ||
  devanagari: तिथ्यात्मकस्तिथिगणो योगराशिर्मुहूर्तात्मा कर्ता दिनपतिः प्रभुः ॥ १७॥ शमीपुष्पप्रियः श्यामस्त्रैलोक्याभयदायकः
    । नीलवासाः क्रियासिन्धुर्नीलाञ्जनचयच्छविः ॥ १८॥ सर्वरोगहरो देवः सिद्धो देवगणस्तुतः । अष्टोत्तरशतं
    नाम्नां सौरेश्छायासुतस्य यः ॥ १९॥ पठेन्नित्यं तस्य पीडा समस्ता नश्यति ध्रुवम् । कृत्वा पूजां पठेन्मर्त्यो
    भक्तिमान्यः स्तवं सदा ॥ २०॥ विशेषतः शनिदिने पीडा तस्य विनश्यति । जन्मलग्ने स्थितिर्वापि गोचरे क्रूरराशिगे
    ॥ २१॥ दशासु च गते सौरौ तदा स्तवमिमं पठेत् । पूजयेद्यः शनिं भक्त्या शमीपुष्पाक्षताम्बरैः ॥ २२॥ विधाय
    लोहप्रतिमां नरो दुःखाद्विमुच्यते । बाधा याऽन्यग्रहाणां च यः पठेत्तस्य नश्यति ॥ २३॥ भीतो भयाद्विमुच्येत
    बद्धो मुच्येत बन्धनात् । रोगी रोगाद्विमुच्येत नरः स्तवमिमं पठेत् ॥ २४॥ पुत्रवान्धनवान् श्रीमान् जायते
    नात्र संशयः ॥ २५॥ नारद उवाच ॥ स्तवं निशम्य पार्थस्य प्रत्यक्षोऽभूत् शनैश्चरः । दत्त्वा राज्ञे वरः
    कामं शनिश्चान्तर्दधे तदा ॥ २६॥ ॥ इति श्री भविष्यपुराणे शनैश्चरस्तवराजः सम्पूर्णः ॥
