id: turajabhavanikavacam
category: kavacha
name:
  english: turajabhavanikavacam
  devanagari: तुरजाभवानीकवचम्
content:
  english: turaja me shirah patu bhale tu parameshvari | netre narayani rakshetkarnamule tu shankari ||
    1|| mukhampatu mahamaya kantham bhuvanasundari | bahudvayam vishvamata hridayam shivavallabha || 2||
    nabhim kundalini patu januni jahnavi tatha | padayoh papanashinca padagram sarvatirthavat || 3|| indrayani
    patu purve agneyyamagnidevata | dakshine narasimhi ca nairrityam khadgadharini || 4|| pashcime varuni
    patu vayavyam vayurupini | udicya pashahasta ca ishanye ishvari tatha || 5|| urdhvam brahmani me rakshedadhasya
    vaishnavi tatha | evam dashadisho rakshet sarvange bhuvaneshvari || 6|| idam tu kathitam divyam kavacam
    sarvadehikam | bhutagrahaharam nityam grahapida tathaiva ca || 7|| sarvapapahare devi ante sayujyam
    prapnuyat | yatra tatra na vaktavyam yadicchedatmano hitam || 8|| shathaya bhaktihinaya vishnudveshaya
    vai tatha | shishyaya bhaktiyuktaya sadhakaya prakashayet || 9|| dadhyat kavacamityuktam tatpunyam
    sha
  devanagari: तुरजा मे शिरः पातु भाले तु परमेश्वरी । नेत्रे नारायणी रक्षेत्कर्णमूले तु शाङ्करी ॥ १॥ मुखम्पातु
    महामाया कण्ठं भुवनसुन्दरी । बाहुद्वयं विश्वमाता हृदयं शिववल्लभा ॥ २॥ नाभिं कुण्डलिनी पातु जानुनी जाह्नवी
    तथा । पादयोः पापनाशीञ्च पादाग्रं सर्वतीर्थवत् ॥ ३॥ इन्द्रायणी पातु पूर्वे आग्नेय्यामग्निदेवता । दक्षिणे
    नारसिंही च नैरृत्यां खड्गधारिणी ॥ ४॥ पश्चिमे वारुणी पातु वायव्यां वायुरूपिणी । उदीच्या पाशहस्ता च
    ईशान्ये ईश्वरी तथा ॥ ५॥ ऊर्ध्वं ब्रह्मणि मे रक्षेदधास्या वैष्णवी तथा । एवं दशदिशो रक्षेत् सर्वाङ्गे
    भुवनेश्वरी ॥ ६॥ इदं तु कथितं दिव्यं कवचं सर्वदेहिकम् । भूतग्रहहरं नित्यं ग्रहपीडा तथैव च ॥ ७॥ सर्वपापहरे
    देवि अन्ते सायुज्यं प्राप्नुयात् । यत्र तत्र न वक्तव्यं यदिच्छेदात्मनो हितम् ॥ ८॥ शठाय भक्तिहीनाय
    विष्णुद्वेषाय वै तथा । शिष्याय भक्तियुक्ताय साधकाय प्रकाशयेत् ॥ ९॥ दध्यात् कवचमित्युक्तं तत्पुण्यं
    श
