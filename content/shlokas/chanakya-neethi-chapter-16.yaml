id: chanakya-neethi-chapter-16
category: stotram
name:
  english: Chanakya Neethi - Chapter 16
content:
  english: na dhyatam padamishvarasya vidhivatsamsaravicchittaye svargadvarakapatapatanapaturdharmo'pi
    noparjitah | naripinapayodharoruyugala svapne'pi nalingitam matuh kevalameva yauvanavanacchede kuthara
    vayam || || jalpanti sardhamanyena pashyantyanyam savibhramah | hridaye cintayantyanyam na strinamekato
    ratih || || yo mohanmanyate mudho rakteyam mayi kamini | sa tasya vashago bhutva nrityet kridashakuntavat
    || || ko'rthanprapya na garvito vishayinah kasyapado'stam gatah stribhih kasya na khanditam bhuvi
    manah ko nama rajapriyah | kah kalasya na gocaratvamagamat ko'rthi gato gauravam ko va durjanadurgameshu
    patitah kshemena yatah pathi || || na nirmito na caiva na drishtapurvo na shruyate hemamayah kurangah
    | tatha'pi trishna raghunandanasya vinashakale viparitabuddhih || || gunairuttamatam yati noccairasanasamsthitah
    | prasadashikharastho'pi kakah kim garudayate || || gunah sarvatra pujyante na mahatyo'pi sampadah
    | purnenduh kim tatha vandyo nishkalanko yatha krishah || || parairuktaguno yastu nirguno'pi guni
    bhavet | indro'pi laghutam yati svayam prakhyapitairgunaih || || vivekinamanuprapta guna yanti manojnatam
    | sutaram ratnamabhati camikaraniyojitam || || gunaih sarvajnatulyo'pi sidatyeko nirashrayah | anarghyamapi
    manikyam hemashrayamapekshate || || atikleshena yaddravyamatilobhena yatsukham | shatrunam pranipatena
    te hyartha ma bhavantu me || || kim taya kriyate lakshmya ya vadhuriva kevala | ya tu veshyeva samanya
    pathikairapi bhujyate || || dhaneshu jivitavyeshu strishu caharakarmasu | atriptah praninah sarve
    yata yasyanti yanti ca || || kshiyante sarvadanani yajnahomabalikriyah | na kshiyate patradanamabhayam
    sarvadehinam || || trinam laghu trinattulam tuladapi ca yacakah | vayuna kim na nito'sau mamayam yacayishyati
    || || varam pranaparityago manabhangena jivanat | pranatyage kshanam duhkham manabhange dine dine
    || || priyavakyapradanena sarve tushyanti jantavah | tasmattadeva vaktavyam vacane ka daridrata ||
    || samsarakatuvrikshasya dve phale'mritopame | subhashitam ca susvadu sangatih sajjane jane || ||
    janma janma yadabhyastam danamadhyayanam tapah | tenaiva'bhyasayogena dehi cabhyasyate punah || ||
    pustakastha tu ya vidya parahastagatam dhanam | karyakale samutpanne na sa vidya na taddhanam ||
  devanagari: न ध्यातं पदमीश्वरस्य विधिवत्संसारविच्छित्तये स्वर्गद्वारकपाटपाटनपटुर्धर्मोऽपि नोपार्जितः
    । नारीपीनपयोधरोरुयुगला स्वप्नेऽपि नालिङ्गितं मातुः केवलमेव यौवनवनच्छेदे कुठारा वयम् ॥ ॥ जल्पन्ति सार्धमन्येन
    पश्यन्त्यन्यं सविभ्रमाः । हृदये चिन्तयन्त्यन्यं न स्त्रीणामेकतो रतिः ॥ ॥ यो मोहान्मन्यते मूढो रक्तेयं
    मयि कामिनी । स तस्या वशगो भूत्वा नृत्येत् क्रीडाशकुन्तवत् ॥ ॥ कोऽर्थान्प्राप्य न गर्वितो विषयिणः कस्यापदोऽस्तं
    गताः स्त्रीभिः कस्य न खण्डितं भुवि मनः को नाम राजप्रियः । कः कालस्य न गोचरत्वमगमत् कोऽर्थी गतो गौरवं
    को वा दुर्जनदुर्गमेषु पतितः क्षेमेण यातः पथि ॥ ॥ न निर्मितो न चैव न दृष्टपूर्वो न श्रूयते हेममयः कुरङ्गः
    । तथाऽपि तृष्णा रघुनन्दनस्य विनाशकाले विपरीतबुद्धिः ॥ ॥ गुणैरुत्तमतां याति नोच्चैरासनसंस्थिताः । प्रासादशिखरस्थोऽपि
    काकः किं गरुडायते ॥ ॥ गुणाः सर्वत्र पूज्यन्ते न महत्योऽपि सम्पदः । पूर्णेन्दुः किं तथा वन्द्यो निष्कलङ्को
    यथा कृशः ॥ ॥ परैरुक्तगुणो यस्तु निर्गुणोऽपि गुणी भवेत् । इन्द्रोऽपि लघुतां याति स्वयं प्रख्यापितैर्गुणैः
    ॥ ॥ विवेकिनमनुप्राप्ता गुणा यान्ति मनोज्ञताम् । सुतरां रत्नमाभाति चामीकरनियोजितम् ॥ ॥ गुणैः सर्वज्ञतुल्योऽपि
    सीदत्येको निराश्रयः । अनर्घ्यमपि माणिक्यं हेमाश्रयमपेक्षते ॥ ॥ अतिक्लेशेन यद्द्रव्यमतिलोभेन यत्सुखम्
    । शत्रूणां प्रणिपातेन ते ह्यर्था मा भवन्तु मे ॥ ॥ किं तया क्रियते लक्ष्म्या या वधूरिव केवला । या तु
    वेश्येव सामान्या पथिकैरपि भुज्यते ॥ ॥ धनेषु जीवितव्येषु स्त्रीषु चाहारकर्मसु । अतृप्ताः प्राणिनः सर्वे
    याता यास्यन्ति यान्ति च ॥ ॥ क्षीयन्ते सर्वदानानि यज्ञहोमबलिक्रियाः । न क्षीयते पात्रदानमभयं सर्वदेहिनाम्
    ॥ ॥ तृणं लघु तृणात्तूलं तूलादपि च याचकः । वायुना किं न नीतोऽसौ मामयं याचयिष्यति ॥ ॥ वरं प्राणपरित्यागो
    मानभङ्गेन जीवनात् । प्राणत्यागे क्षणं दुःखं मानभङ्गे दिने दिने ॥ ॥ प्रियवाक्यप्रदानेन सर्वे तुष्यन्ति
    जन्तवः । तस्मात्तदेव वक्तव्यं वचने का दरिद्रता ॥ ॥ संसारकटुवृक्षस्य द्वे फलेऽमृतोपमे । सुभाषितं च
    सुस्वादु सङ्गतिः सज्जने जने ॥ ॥ जन्म जन्म यदभ्यस्तं दानमध्ययनं तपः । तेनैवाऽभ्यासयोगेन देही चाभ्यस्यते
    पुनः ॥ ॥ पुस्तकस्था तु या विद्या परहस्तगतं धनम् । कार्यकाले समुत्पन्ने न सा विद्या न तद्धनम् ॥
