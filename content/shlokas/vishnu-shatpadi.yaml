id: vishnu-shatpadi
category: stotram
name:
  english: Vishnu Shatpadi
  devanagari: विष्णुषट्पदी (शङ्कराचार्यविरचिता)
content:
  english: avinayamapanaya vishno damaya manah shamaya vishayamrigatrishnam | bhutadayam vistaraya taraya
    samsarasagaratah || 1|| divyadhunimakarande parimalaparibhogasaccidanande | shripatipadaravinde bhavabhayakhedacchide
    vande || 2|| satyapi bhedapagame natha tavaham na mamakinastvam | samudro hi tarangah kvacana samudro
    na tarangah || 3|| uddhritanaga nagabhidanuja danujakulamitra mitrashashidrishte | drishte bhavati
    prabhavati na bhavati kim bhavatiraskarah || 4|| matsyadibhiravatarairavataravata'vata sada vasudham
    | parameshvara paripalyo bhavata bhavatapabhito'ham || 5|| damodara gunamandira sundaravadanaravinda
    govinda | bhavajaladhimathanamandara paramam daramapanaya tvam me || 6|| narayana karunamaya sharanam
    karavani tavakau caranau | iti shatpadi madiye vadanasaroje sada vasatu || 7|| || iti shrimad shankaracaryaviracitam
    vishnushatpadistotram sampurnam ||
  devanagari: अविनयमपनय विष्णो दमय मनः शमय विषयमृगतृष्णाम् । भूतदयां विस्तारय तारय संसारसागरतः ॥ १॥ दिव्यधुनीमकरन्दे
    परिमलपरिभोगसच्चिदानन्दे । श्रीपतिपदारविन्दे भवभयखेदच्छिदे वन्दे ॥ २॥ सत्यपि भेदापगमे नाथ तवाहं न मामकीनस्त्वम्
    । सामुद्रो हि तरङ्गः क्वचन समुद्रो न तारङ्गः ॥ ३॥ उद्धृतनग नगभिदनुज दनुजकुलामित्र मित्रशशिदृष्टे ।
    दृष्टे भवति प्रभवति न भवति किं भवतिरस्कारः ॥ ४॥ मत्स्यादिभिरवतारैरवतारवताऽवता सदा वसुधाम् । परमेश्वर
    परिपाल्यो भवता भवतापभीतोऽहम् ॥ ५॥ दामोदर गुणमन्दिर सुन्दरवदनारविन्द गोविन्द । भवजलधिमथनमन्दर परमं
    दरमपनय त्वं मे ॥ ६॥ नारायण करुणामय शरणं करवाणि तावकौ चरणौ । इति षट्पदी मदीये वदनसरोजे सदा वसतु ॥ ७॥
    ॥ इति श्रीमद् शङ्कराचार्यविरचितं विष्णुषट्पदीस्तोत्रं सम्पूर्णम् ॥
