id: jagadishashatakam
category: shataka
name:
  english: jagadishashatakam
  devanagari: जगदीशशतकम्
content:
  english: muccaranena khalu patakinam mukhaishca | sadyah punati shabaranyavananadharman vande prabhum
    patitapavananamadheyam || 13|| yasyaikavaramamalam smaranam hi pumsam sadyah kshinoti sakalam duritam
    ca duhkham | yah svam karoti nayati pranatam svadhama vande prabhum patitapavananamadheyam || 14||
    yajjanmakotisukritena yada kadapi tiryannridevagana santatibhuti bhajah | tvatpadasevanamabhut sa
    puman vimukto vande prabhum patitapavananamadheyam || 15|| yadvarshamasadinayamamuhurtamatre yaih
    kaih prayatnavidhibhistava pujanam syat | sarvam babhuva sukritam purushasya tasya vande prabhum patitapavananamadheyam
    || 16|| dhanyah puman dharanidharmadharo dhruvo'sau tvam sharmadam namati yah shirasaikadapi | param
    prayati duravapajagannadishat vande prabhum patitapavananamadheyam || 17|| sanketyahelanavimanyugate
    ca hasye duhkhadyanantasamaye patito'pi yastvam | dasastaveti vadate tvabhayam dadasi vade prabhum
    patitapavananamadheyam || 18|| brahmendrashambhusanakadisurarshayo yam na prapnuvanti tapasa niyamadiyogaih
    | sakhyam vidhaya purusho ramate hi tena vande prabhum patitapavananamadheyam || 19|| atmarpanam hi
    kurute purushastu yaste svatmarpanam tvamapi dena karoshi tasmai | shreshtham tu tam tvamanugacchasi
    sarvadaiva vande prabhum patitapavananamadheyam || 20|| straino dhanandhamadiravashasampramattah papi
    tvajamilashathah kathanattu yasya | namno jagama padavim munibhirdurapam vande prabhum patitapavananamadheyam
    || 21|| vipramisham tvayi samarpitavan parena premna pishacakulajah shrutibaddhaghantah | alingya
    tam nijajanam kritavan sudorbhyam | vande prabhum patitapavananamadheyam || 22|| dino'tijirnavasanah
    kshudhaya krisho'pi sandattatandula udaramatih sudama | utpapavismritaramah parishasvaje yo vande
    prabhum patitapavananamadheyam || 23|| bhojendudasyanirata malinatinica kubja tu ya madhupure pathi
    tam vilokya | gatva griham kamalaya sadrishim vyadhadyah vande prabhum patitapavananamadheyam || 24||
    jatya tu vayakavaram hatadharmalesham gatva tadiyabhavane kritavan sakampah | vastrani tadviracitani
    dadhara dehe vande prabhum patitatapavananamadheyam || 25|| nico nishadakulajo jalajivabhokta jagraha
    tatkarasamarpitakandamulam | kritva sakhayamatulam parishasvaje yo vande prabhum patitapavananamadheyam
    || 26|| mamsadakam vanacaram duritaughayuktam gridhram jatayushamalam parirabhya dorbhyam | tasmai
    dadau paragatim patidurlabham yo vande prabhum patitapavananamadheyam || 27|| vijnanabhaktiviratishtasudharmahina
    nica mahavanacari shabari hi tasyai | bhuktva tadarpitaphalam pradadau gatim yo vande prabhum patitapavananamadheyam
    || 28|| svapne'pi darshanamamangaladam vadanti yesham budhah smaranato hyashubhani loke | tairvanaraih
    saha cakara sumitratayai vande prabhum patitapavananamadheyam || 29|| dushtanujam rajanikacaravamshajatam
    padantike nipatitam bharatena tulyam | utthapya tam svabhujatah parishasvaje yo vande prabhum patitapavananamadheyam
    || 30|| jatya tu gopakulajah paradharmahina gopashca gopavanitastulasivane taih | cikrida rasaparimandalamandito
    yo | vande prabhum patitapavananamadheyam || 31|| vapi mahavishadharah kila kaliyena samplutya bhaskarasutahradaniramadhye
    | samskritya tatphanaganeshvabhayam dadau yo vande prabhum patitapavananamadheyam || 32|| kim kim
    bravimi patitoddharanam hi loke yadyattvaya kritamanantacaturmukheshu | tasmat tvadiyacaranam sharanam
    gato'ham mamuddharasva kripaya jagadishakritya || 33|| na tvatsamah patitapavanakaryakari nasmadrisho
    jagati sampatito'vanishah | dishtya kritam vishadamityanavekshya yogam mamuddhararava kripaya jagadishakritya
    || 34|| anveshitam bhuvanametadativa buddhya svoddharakaranakrite bhavato vina me | drishto na kopi
    patitoddharane samartho mamuddharasva kripaya jagadishakritya || 35|| kamasya pashavalitam capalam
    mano me sanghavatishtavishayeshu vadami satyam | prapsyami kena vidhina gatimuttamam te mamuddharasva
    kripaya jagadishakritya || 36|| tvam sarvadivyagunavrindasamanvito'si taih sarvagarhitagunairvalitastathaham
    | lajjavanam tava kare mama sarvathasti mamuddharasva kripaya jagadishakritya || 37|| suryo yatha
    svakiranaih sprishatishtaneshtam | samshoshayanna hi karoti kadapi bhedam | vismritya tadvadagunam
    mama naijaritya mamuddharasva kripaya jagadishakritya || 38|| shocami tannijagunanavalokya dushthan
    papam karomi khalu yadvashago'hamadya | hrishyami te gunagananavalokya bhavyan mamuddharasva kripaya
    jagadishakritya || 39|| jnani na yoganirato na hi bhaktinishtho vairagyaleshasahito na ca dharmadhari
    | prapsyamyaham kathamaho tava padapadmam mamuddharasva kripaya jagadishakritya || 40|| svabhaviki
    bhavati dahanashaktiragre
  devanagari: मुच्चारणेन खलु पातकिनां मुखैश्च । सद्यः पुनाति शबरान्यवनानधर्मान् वन्दे प्रभुं पतितपावननामधेयम्
    ॥ १३॥ यस्यैकवारममलं स्मरणं हि पुंसां सद्यः क्षिणोति सकलं दुरितं च दुःखम् । यः स्वं करोति नयति प्रणतं
    स्वधाम वन्दे प्रभुं पतितपावननामधेयम् ॥ १४॥ यज्जन्मकोटिसुकृतेन यदा कदापि तिर्यङ्नृदेवगण सन्ततिभूति
    भाजः । त्वत्पादसेवनमभूत् स पुमान् विमुक्तो वन्दे प्रभुं पतितपावननामधेयम् ॥ १५॥ यद्वर्षमासदिनयाममुहूर्तमात्रे
    यैः कैः प्रयत्नविधिभिस्तव पूजनं स्यात् । सर्वं बभूव सुकृतं पुरुषस्य तस्य वन्दे प्रभुं पतितपावननामधेयम्
    ॥ १६॥ धन्यः पुमान् धरणिधर्मधरो ध्रुवोऽसौ त्वां शर्मदं नमति यः शिरसैकदापि । पारं प्रयाति दुरवापजगन्नदीशात्
    वन्दे प्रभुं पतितपावननामधेयम् ॥ १७॥ साङ्केत्यहेलनविमन्युगते च हास्ये दुःखाद्यनन्तसमये पतितोऽपि यस्त्वम्
    । दासस्तवेति वदते त्वभयं ददासि वदे प्रभुं पतितपावननामधेयम् ॥ १८॥ ब्रह्मेन्द्रशम्भुसनकादिसुरर्षयो यं
    न प्राप्नुवन्ति तपसा नियमादियोगैः । सख्यं विधाय पुरुषो रमते हि तेन वन्दे प्रभुं पतितपावननामधेयम् ॥
    १९॥ आत्मार्पणां हि कुरुते पुरुषस्तु यस्ते स्वात्मार्पणं त्वमपि देन करोषि तस्मै । श्रेष्ठं तु तं त्वमनुगच्छसि
    सर्वदैव वन्दे प्रभुं पतितपावननामधेयम् ॥ २०॥ स्त्रैणो धनान्धमदिरावशसम्प्रमत्तः पापी त्वजामिलशठः कथनात्तु
    यस्य । नाम्नो जगाम पदवीं मुनिभिर्दुरापां वन्दे प्रभुं पतितपावननामधेयम् ॥ २१॥ विप्रामिषं त्वयि समर्पितवान्
    परेण प्रेम्णा पिशाचकुलजः श्रुतिबद्धघण्टः । आलिङ्ग्य तं निजजनं कृतवान् सुदोर्भ्याम् । वन्दे प्रभुं
    पतितपावननामधेयम् ॥ २२॥ दीनोऽतिजीर्णवसनः क्षुधया कृशोऽपि सन्दत्ततण्डुल उदारमतिः सुदामा । उत्पापविस्मृतरमः
    परिषस्वजे यो वन्दे प्रभुं पतितपावननामधेयम् ॥ २३॥ भोजेन्दुदास्यनिरता मलिनातिनीचा कुब्जा तु या मधुपुरे
    पथि तां विलोक्य । गत्वा गृहं कमलया सदृशीं व्यधाद्यः वन्दे प्रभुं पतितपावननामधेयम् ॥ २४॥ जात्या तु
    वायकवरं हतधर्मलेशं गत्वा तदीयभवने कृतवान् सकम्पः । वस्त्राणि तद्विरचितानि दधार देहे वन्दे प्रभुं पतिततपावननामधेयम्
    ॥ २५॥ नीचो निषादकुलजो जलजीवभोक्ता जग्राह तत्करसमर्पितकन्दमूलम् । कृत्वा सखायमतुलं परिषस्वजे यो वन्दे
    प्रभुं पतितपावननामधेयम् ॥ २६॥ मांसादकं वनचरं दुरितौघयुक्तं गृध्रं जटायुषमलं परिरभ्य दोर्भ्याम् । तस्मै
    ददौ परगतिं पतिदुर्लभां यो वन्दे प्रभुं पतितपावननामधेयम् ॥ २७॥ विज्ञानभक्तिविरतीष्टसुधर्महीना नीचा
    महावनचरी शबरी हि तस्यै । भुक्त्वा तदर्पितफलं प्रददौ गतिं यो वन्दे प्रभुं पतितपावननामधेयम् ॥ २८॥ स्वप्नेऽपि
    दर्शनममङ्गलदं वदन्ति येषां बुधाः स्मरणतो ह्यशुभानि लोके । तैर्वानरैः सह चकार सुमित्रतायै वन्दे प्रभुं
    पतितपावननामधेयम् ॥ २९॥ दुष्टानुजं रजनिकाचरवंशजातं पादान्तिके निपतितं भरतेन तुल्यम् । उत्थाप्य तं स्वभुजतः
    परिषस्वजे यो वन्दे प्रभुं पतितपावननामधेयम् ॥ ३०॥ जात्या तु गोपकुलजाः परधर्महीना गोपाश्च गोपवनितास्तुलसीवने
    तैः । चिक्रीड रासपरिमण्डलमण्डितो यो । वन्दे प्रभुं पतितपावननामधेयम् ॥ ३१॥ वापी महाविषधरः किल कालियेन
    सम्प्लुत्य भास्करसुताह्रदनीरमध्ये । संस्कृत्य तत्फणगणेष्वभयं ददौ यो वन्दे प्रभुं पतितपावननामधेयम्
    ॥ ३२॥ किं किं ब्रवीमि पतितोद्धरणं हि लोके यद्यत्त्वया कृतमनन्तचतुर्मुखेषु । तस्मात् त्वदीयचरणं शरणं
    गतोऽहं मामुद्धरस्व कृपया जगदीशकृत्य ॥ ३३॥ न त्वत्समः पतितपावनकार्यकारी नास्मादृशो जगति सम्पतितोऽवनीशः
    । दिष्ट्या कृतं विशदमित्यनवेक्ष्य योगं मामुद्धररव कृपया जगदीशकृत्य ॥ ३४॥ अन्वेषितं भुवनमेतदतीव बुद्ध्या
    स्वोद्धारकारणकृते भवतो विना मे । दृष्टो न कोपि पतितोद्धरणे समर्थो मामुद्धरस्व कृपया जगदीशकृत्य ॥ ३५॥
    कामस्य पाशवलितं चपलं मनो मे सङ्घावतीष्टविषयेषु वदामि सत्यम् । प्राप्स्यामि केन विधिना गतिमुत्तमां
    ते मामुद्धरस्व कृपया जगदीशकृत्य ॥ ३६॥ त्वं सर्वदिव्यगुणवृन्दसमन्वितोऽसि तैः सर्वगर्हितगुणैर्वलितस्तथाहम्
    । लज्जावनं तव करे मम सर्वथास्ति मामुद्धरस्व कृपया जगदीशकृत्य ॥ ३७॥ सूर्यो यथा स्वकिरणैः स्पृशतीष्टनेष्टम्
    । संशोषयन्न हि करोति कदापि भेदम् । विस्मृत्य तद्वदगुणं मम नैजरीत्या मामुद्धरस्व कृपया जगदीशकृत्य ॥
    ३८॥ शोचामि तन्निजगुणानवलोक्य दुष्ठान् पापं करोमि खलु यद्वशगोऽहमद्य । हृष्यामि ते गुणगणानवलोक्य भव्यान्
    मामुद्धरस्व कृपया जगदीशकृत्य ॥ ३९॥ ज्ञानी न योगनिरतो न हि भक्तिनिष्ठो वैराग्यलेशसहितो न च धर्मधारी
    । प्राप्स्याम्यहं कथमहो तव पादपद्मं मामुद्धरस्व कृपया जगदीशकृत्य ॥ ४०॥ स्वाभाविकी भवति दाहनशक्तिरग्रे
