id: narayaniyam-dashaka-87
category: stotram
name:
  english: Narayaniyam Dashaka 87
content:
  english: kucelanama bhavatah satirthyatam gatah sa sandipanimandire dvijah | tvadekaragena dhanadinisspriho
    dinani ninye prashami grihashrami || || samanashila'pi tadiyavallabha tathaiva no cittajayam sameyushi
    | kadaciduce bata vrittilabdhaye ramapatih kim na sakha nishevyate || || itirito'yam priyaya kshudhartaya
    jugupsamano'pi dhane madavahe | tada tvadalokanakautukadyayau vahan patante prithukanupayanam || ||
    gato'yamashcaryamayim bhavatpurim griheshu shaibyabhavanam sameyivan | pravishya vaikunthamivapa nirvritim
    tavatisambhavanaya tu kim punah || || prapujitam tam priyaya ca vijitam kare grihitva'kathayah purakritam
    | yadindhanartham gurudaracoditairapartuvarsha tadamarshi kanane || || trapajusho'smat prithukam baladatha
    pragrihya mushtau sakridashite tvaya | kritam kritam nanviyateti sambhramadrama kilopetya karam rurodha
    te || || bhakteshu bhaktena sa manitastvaya purim vasannekanisham mahasukham | bataparedyurdravinam
    vina yayau vicitrarupastava khalvanugrahah || || yadi hyayacishyamadasyadacyuto vadami bharyam kimiti
    vrajannasau | tvaduktililasmitamagnadhih punah kramadapashyanmanidipramalayam || || kim margavibhramsha
    iti bhramman kshanam griham pravishtah sa dadarsha vallabham | sakhiparitam manihemabhushitam bubodha
    ca tvatkarunam mahadbhutam || || sa ratnashalasu vasannapi svayam samunnamadbhaktibharo'mritam yayau
    | tvamevamapuritabhaktavanchito marutpuradhisha harasva me gadan ||
  devanagari: कुचेलनामा भवतः सतीर्थ्यतां गतः स सान्दीपनिमन्दिरे द्विजः । त्वदेकरागेण धनादिनिस्स्पृहो दिनानि
    निन्ये प्रशमी गृहाश्रमी ॥ ॥ समानशीलाऽपि तदीयवल्लभा तथैव नो चित्तजयं समेयुषी । कदाचिदूचे बत वृत्तिलब्धये
    रमापतिः किं न सखा निषेव्यते ॥ ॥ इतीरितोऽयं प्रियया क्षुधार्तया जुगुप्समानोऽपि धने मदावहे । तदा त्वदालोकनकौतुकाद्ययौ
    वहन् पटान्ते पृथुकानुपायनम् ॥ ॥ गतोऽयमाश्चर्यमयीं भवत्पुरीं गृहेषु शैब्याभवनं समेयिवान् । प्रविश्य
    वैकुण्ठमिवाप निर्वृतिं तवातिसम्भावनया तु किं पुनः ॥ ॥ प्रपूजितं तं प्रियया च वीजितं करे गृहीत्वाऽकथयः
    पुराकृतम् । यदिन्धनार्थं गुरुदारचोदितैरपर्तुवर्ष तदमर्षि कानने ॥ ॥ त्रपाजुषोऽस्मात् पृथुकं बलादथ प्रगृह्य
    मुष्टौ सकृदाशिते त्वया । कृतं कृतं नन्वियतेति सम्भ्रमाद्रमा किलोपेत्य करं रुरोध ते ॥ ॥ भक्तेषु भक्तेन
    स मानितस्त्वया पुरीं वसन्नेकनिशां महासुखम् । बतापरेद्युर्द्रविणं विना ययौ विचित्ररूपस्तव खल्वनुग्रहः
    ॥ ॥ यदि ह्ययाचिष्यमदास्यदच्युतो वदामि भार्यां किमिति व्रजन्नसौ । त्वदुक्तिलीलास्मितमग्नधीः पुनः क्रमादपश्यन्मणिदीप्रमालयम्
    ॥ ॥ किं मार्गविभ्रंश इति भ्रम्मन् क्षणं गृहं प्रविष्टः स ददर्श वल्लभाम् । सखीपरीतां मणिहेमभूषितां
    बुबोध च त्वत्करुणां महाद्भुताम् ॥ ॥ स रत्नशालासु वसन्नपि स्वयं समुन्नमद्भक्तिभरोऽमृतं ययौ । त्वमेवमापूरितभक्तवाञ्छितो
    मरुत्पुराधीश हरस्व मे गदान् ॥
