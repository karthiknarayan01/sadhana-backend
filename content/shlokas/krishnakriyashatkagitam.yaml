id: krishnakriyashatkagitam
category: stotram
name:
  english: krishnakriyashatkagitam
  devanagari: कृष्णक्रियाषट्कगीतम्
content:
  english: krishnakriyashatkagitam vinidra jivo'ham gahana trasam samsara anale vidhura vasam anantapurasha
    jagannivasa atragaccha svami atragaccha || 1|| ekaki viharam ca sarva kriya ekaki karmo dharmashca
    sakalam anantapurasha jagannivasa atragaccha svami atragaccha || 2|| pacami pakoham yatha samardhyam
    phala jalena saha vrinda natha anantapurusha jagannivasa atragaccha svami atragaccha || 3|| karomi
    deva te shayyaracitam anandadayani priyasahitam anantapurusha jagannivasa atragaccha svami atragaccha
    || 4|| nandanandanastvam gopikakanta bhaktanam pranastvam ca jagannatha anantapurusha jagannivasa
    atragaccha svami atragaccha || 5|| tvaya vina natha sthale matsyaham yatha pranahina nirdehi deham
    avahvati tvam nitya krishnadasah atragaccha svami atragaccha || 6|| racayita
  devanagari: कृष्णक्रियाषट्कगीतम् विनिद्र जिवोऽहं गहन त्रासं संसार अनले विधुर वासं अनन्तपुरष जगन्निवास
    अत्रागच्छ स्वामी अत्रागच्छ ॥ १॥ एकाकी विहारं च सर्व क्रिया एकाकी कर्मो धर्मश्च सकलं अनन्तपुरष जगन्निवास
    अत्रागच्छ स्वामी अत्रागच्छ ॥ २॥ पचामी पाकोहं यथा सामर्ध्यं फल जलेन सह वृन्दा नाथ अनन्तपुरुष जगन्निवास
    अत्रागच्छ स्वामी अत्रागच्छ ॥ ३॥ करोमि देव ते शय्यारचितं आनन्ददायनी प्रियासहितं अनन्तपुरुष जगन्निवास
    अत्रागच्छ स्वामी अत्रागच्छ ॥ ४॥ नन्दनन्दनस्त्वं गोपिकाकान्त भक्तानां प्राणस्त्वं च जगन्नाथ अनन्तपुरुष
    जगन्निवास अत्रागच्छ स्वामी अत्रागच्छ ॥ ५॥ त्वया विना नाथ स्थले मत्स्याहं यथा प्राणहीना निर्देहि देहं
    आवाह्वती त्वं नित्य कृष्णदासः अत्रागच्छ स्वामी अत्रागच्छ ॥ ६॥ रचयिता
