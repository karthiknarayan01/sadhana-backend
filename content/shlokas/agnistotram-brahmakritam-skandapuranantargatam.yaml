id: agnistotram-brahmakritam-skandapuranantargatam
category: stotram
name:
  english: agnistotram (brahmakritam skandapuranantargatam)
  devanagari: अग्निस्तोत्रम् (ब्रह्मकृतं स्कन्दपुराणान्तर्गतम्)
content:
  english: brahmakritam agnistotram brahmovaca | saptatejo namaste'stu parasya paramatmane | adbhutanam
    pratishrotre tejasam nidhaye namah || 61|| bijam yo vishvabhavanam sammohanavimohanam | andhakaro
    yugavartakale kale ca duhsahah || 62|| urdhvavaktra namaste'stu sattvatmaka dharatmaka | jvalajjvalotpannajala
    jalajesha jalecara || 63|| jalajotphullapatraksha jaladeva hutashana | krishnakantah krishnamargah
    svargamargapradayaka || 64|| yajnahutisamacara yajnarupa namo namah | svarnagarbha shamigarbha jaya
    deva sanatana || 65|| tamohara mahahara svahapriya tamohara | pradiptarocirdevesha citrabhano namo'stu
    te || 66|| vaishvanaranalodagra urdhvapavaka sarvaga | vibhavaso mahabhaga krishnavartmannamonamah
    || 67|| iti shriskandapurane avantyakhande avantikshetramahatmye caturthadhyayantargatam brahmakritam
    agnistotram samaptam | skandapurana | avantyakhanda | avantyakhanda | adhyaya 4
  devanagari: ब्रह्मकृतं अग्निस्तोत्रम् ब्रह्मोवाच । सप्ततेजो नमस्तेऽस्तु परस्य परमात्मने । अद्भुतानां
    प्रतिश्रोत्रे तेजसां निधये नमः ॥ ६१॥ बीजं यो विश्वभावानां सम्मोहनविमोहनम् । अन्धकारो युगावर्तकाले
    काले च दुःसहः ॥ ६२॥ ऊर्ध्ववक्त्र नमस्तेऽस्तु सत्त्वात्मक धरात्मक । ज्वलज्ज्वालोत्पन्नजल जलजेश जलेचर
    ॥ ६३॥ जलजोत्फुल्लपत्राक्ष जलदेव हुताशन । कृष्णकान्तः कृष्णमार्गः स्वर्गमार्गप्रदायक ॥ ६४॥ यज्ञाहुतिसमाचार
    यज्ञरूप नमो नमः । स्वर्णगर्भ शमीगर्भ जय देव सनातन ॥ ६५॥ तमोहार महाहार स्वाहाप्रिय तमोहर । प्रदीप्तरोचिर्देवेश
    चित्रभानो नमोऽस्तु ते ॥ ६६॥ वैश्वानरानलोदग्र ऊर्ध्वपावक सर्वग । विभावसो महाभाग कृष्णवर्त्मन्नमोनमः
    ॥ ६७॥ इति श्रीस्कन्दपुराणे आवन्त्यखण्डे अवन्तीक्षेत्रमाहात्म्ये चतुर्थाध्यायान्तर्गतं ब्रह्मकृतं अग्निस्तोत्रं
    समाप्तम् । स्कन्दपुराण । आवन्त्यखण्ड । आवन्त्यखण्ड । अध्याय ४
meaning: {}
