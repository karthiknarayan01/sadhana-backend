id: yonistotram
category: stotram
name:
  english: yonistotram
  devanagari: योनिस्तोत्रम्
content:
  english: sannidhau | shaktirupa mahadevi tasya gehe sada sthita || 15|| tirtha paryatanam nasti nasti
    pujadi tarpanam | purashcaranam nastyeva tasya muktirakhandita || 16|| kevalam maithunenaiva shiva
  devanagari: सन्निधौ । शक्तिरूपा महादेवी तस्य गेहे सदा स्थिता ॥ १५॥ तीर्थ पर्यटनं नास्ति नास्ति पूजादि
    तर्पणम् । पुरश्चरणं नास्त्येव तस्य मुक्तिरखण्डिता ॥ १६॥ केवलं मैथुनेनैव शिव
meaning: {}
