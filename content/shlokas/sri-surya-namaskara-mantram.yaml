id: sri-surya-namaskara-mantram
category: stotram
name:
  english: Sri Surya Namaskara Mantram
content:
  english: dhyanam om dhyayessada savitrimandalamadhyavarti narayanassarasijasana sannivishtah | keyuravan
    makarakundalavan kiriti hari hiranmayavapuh dhritashankhacakrah || suryam sundaralokanathamamritam
    vedantasaram shivam jnanabrahmamayam sureshamamalam lokaikacitrasvayam | indradityanaradhipasuragurum
    trailokacudamanim brahmavishnushivasvarupahridayam vande sada bhaskaram || dvadashaditya namani om
    mitraya namah | om ravaye namah | om suryaya namah | om bhanave namah | om khagaya namah | om pushne
    namah | om hiranyagarbhaya namah | om maricaye namah | om adityaya namah | om savitre namah | om arkaya
    namah | om bhaskaraya namah | om shrisavitrisuryanarayanaya namah || phalashritih adityasya namaskaran
    ye kurvanti dine dine | ayuh prajnam balam viryam tejastesham ca jayate ||
  devanagari: ध्यानं ॐ ध्यायेस्सदा सवितृमण्डलमध्यवर्ती नारायणस्सरसिजासन सन्निविष्टः । केयूरवान् मकरकुण्डलवान्
    किरीटी हारी हिरण्मयवपुः धृतशङ्खचक्रः ॥ सूर्यं सुन्दरलोकनाथममृतं वेदान्तसारम् शिवं ज्ञानब्रह्ममयं सुरेशममलं
    लोकैकचित्रस्वयम् । इन्द्रादित्यनराधिपसुरगुरुं त्रैलोकचूडामणिम् ब्रह्मविष्णुशिवस्वरूपहृदयं वन्दे सदा
    भास्करम् ॥ द्वादशादित्य नामानि ॐ मित्राय नमः । ॐ रवये नमः । ॐ सूर्याय नमः । ॐ भानवे नमः । ॐ खगाय नमः
    । ॐ पूष्णे नमः । ॐ हिरण्यगर्भाय नमः । ॐ मरीचये नमः । ॐ आदित्याय नमः । ॐ सवित्रे नमः । ॐ अर्काय नमः
    । ॐ भास्कराय नमः । ॐ श्रीसवितृसूर्यनारायणाय नमः ॥ फलशृतिः आदित्यस्य नमस्कारान् ये कुर्वन्ति दिने दिने
    । आयुः प्रज्ञां बलं वीर्यं तेजस्तेषां च जायते ॥
