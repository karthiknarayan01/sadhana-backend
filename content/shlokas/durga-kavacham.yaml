id: durga-kavacham
category: stotram
name:
  english: Durga Kavacham
content:
  english: ishvara uvaca | shrinu devi pravakshyami kavacam sarvasiddhidam | pathitva pathayitva ca naro
    mucyeta sankatat || || ajnatva kavacam devi durgamantram ca yo japet | na capnoti phalam tasya param
    ca narakam vrajet || || umadevi shirah patu lalate shuladharini | cakshushi khecari patu karnau catvaravasini
    || || sugandha nasikam patu vadanam sarvadharini | jihvam ca candikadevi grivam saubhadrika tatha
    || || ashokavasini ceto dvau bahu vajradharini | hridayam lalitadevi udaram simhavahini || || katim
    bhagavati devi dvavuru vindhyavasini | mahabala ca janghe dve padau bhutalavasini || || evam sthita'si
    devi tvam trailokye rakshanatmika | raksha mam sarvagatreshu durge devi namo'stu te || || iti kubjikatantroktam
    shri durga kavacam |
  devanagari: ईश्वर उवाच । शृणु देवि प्रवक्ष्यामि कवचं सर्वसिद्धिदम् । पठित्वा पाठयित्वा च नरो मुच्येत
    सङ्कटात् ॥ ॥ अज्ञात्वा कवचं देवि दुर्गामन्त्रं च यो जपेत् । न चाप्नोति फलं तस्य परं च नरकं व्रजेत्
    ॥ ॥ उमादेवी शिरः पातु ललाटे शूलधारिणी । चक्षुषी खेचरी पातु कर्णौ चत्वरवासिनी ॥ ॥ सुगन्धा नासिकं पातु
    वदनं सर्वधारिणी । जिह्वां च चण्डिकादेवी ग्रीवां सौभद्रिका तथा ॥ ॥ अशोकवासिनी चेतो द्वौ बाहू वज्रधारिणी
    । हृदयं ललितादेवी उदरं सिंहवाहिनी ॥ ॥ कटिं भगवती देवी द्वावूरू विन्ध्यवासिनी । महाबला च जङ्घे द्वे
    पादौ भूतलवासिनी ॥ ॥ एवं स्थिताऽसि देवि त्वं त्रैलोक्ये रक्षणात्मिका । रक्ष मां सर्वगात्रेषु दुर्गे
    देवि नमोऽस्तु ते ॥ ॥ इति कुब्जिकातन्त्रोक्तं श्री दुर्गा कवचम् ।
