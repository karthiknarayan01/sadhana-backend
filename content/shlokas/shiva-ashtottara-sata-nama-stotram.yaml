id: shiva-ashtottara-sata-nama-stotram
category: stotram
name:
  english: Shiva Ashtottara Sata Nama Stotram
content:
  english: shshambhuh pinaki shashishekharah vamadevo virupakshah kapardi nilalohitah || shshulapanishca
    khatvangi vishnuvallabhah shipivishto'mbikanathah shrikantho bhaktavatsalah || strilokeshah shitikanthah
    shivapriyah ugrah kapali kamari randhakasurasudanah || || gangadharo lalatakshah kalakalah kripanidhih
    bhimah parashuhastashca mrigapani || kailasavasi kavaci kathora stripurantakah vrishanko vrishabharudho
    bhasmoddhulitavigrahah || ranishvarah sarvajnah paramatma ca somasuryagnilocanah || ssadashivah vishveshvaro
    virabhadro gananathah prajapatih || || hiranyareta durdharsho girisho girisho'naghah bhujangabhushano
    bhargo giridhanva giripriyah || || krittivasah purarati rbhagavan pramathadhipah mrityunjaya rjagadvyapi
    jagadguruh || || vyomakesho mahasenajanaka shcaruvikramah rudro bhutapatih sthanu rahirbhudhnyo digambarah
    || shshuddhavigrahah shashvatah khandaparashu rdevo mahadevo'vyayo harih pushadantabhi davyagro dakshadhvaraharo
    harah || ssahasrapat apavargaprado'nanta || evam shri shambhudevasya namnamashtottaram shatam || iti
    shri shivashtottarashatanamastotraratnam samaptam |
  devanagari: श्शम्भुः पिनाकी शशिशेखरः वामदेवो विरूपाक्षः कपर्दी नीललोहितः ॥ श्शूलपाणिश्च खट्वाङ्गी विष्णुवल्लभः
    शिपिविष्टोऽम्बिकानाथः श्रीकण्ठो भक्तवत्सलः ॥ स्त्रिलोकेशः शितिकण्ठः शिवाप्रियः उग्रः कपाली कामारि
    रन्धकासुरसूदनः ॥ ॥ गङ्गाधरो ललाटाक्षः कालकालः कृपानिधिः भीमः परशुहस्तश्च मृगपाणि ॥ कैलासवासी कवची
    कठोर स्त्रिपुरान्तकः वृषाङ्को वृषभारूढो भस्मोद्धूलितविग्रहः ॥ रनीश्वरः सर्वज्ञः परमात्मा च सोमसूर्याग्निलोचनः
    ॥ स्सदाशिवः विश्वेश्वरो वीरभद्रो गणनाथः प्रजापतिः ॥ ॥ हिरण्यरेता दुर्धर्षो गिरीशो गिरिशोऽनघः भुजङ्गभूषणो
    भर्गो गिरिधन्वा गिरिप्रियः ॥ ॥ कृत्तिवासाः पुराराति र्भगवान् प्रमथाधिपः मृत्युञ्जय र्जगद्व्यापी जगद्गुरुः
    ॥ ॥ व्योमकेशो महासेनजनक श्चारुविक्रमः रुद्रो भूतपतिः स्थाणु रहिर्भुध्न्यो दिगम्बरः ॥ श्शुद्धविग्रहः
    शाश्वतः खण्डपरशु र्देवो महादेवोऽव्ययो हरिः पूषदन्तभि दव्यग्रो दक्षाध्वरहरो हरः ॥ स्सहस्रपात् अपवर्गप्रदोऽनन्त
    ॥ एवं श्री शम्भुदेवस्य नाम्नामष्टोत्तरं शतम् ॥ इति श्री शिवाष्टोत्तरशतनामस्तोत्ररत्नं समाप्तम् ।
