id: markandeyaproktam4vishnustotram
category: stotram
name:
  english: markandeyaproktam4vishnustotram
  devanagari: मार्कण्डेयप्रोक्तं४विष्णुस्तोत्रम्
content:
  english: markandeyaproktam 4 vishnustotram yah sa devo maya drishtah pura padmanibhekshanah sa esha
    purushavyaghra sambandhi te janardanah || 50|| asyaiva varadanaddhi smritirna prajahati mam | dirghamayushca
    kaunteya svacchandamaranam tatha || 51|| sa esha krishno varshneyah puranapurusho vibhuh | aste hariracintyatma
    kridanniva mahabhujah || 52|| esha dhata vidhata ca samharta caiva satvatah | shrivatsavaksha govindah
    prajapatipatih prabhuh || 53|| drishtvemam vrishnishardulam smritirmamiyamagata | adidevamajam vishnum
    purusham pitavasasam || 54|| sarveshameva bhutanam pita mata ca madhavah | gacchadhvamenam sharanam
    sharanyam kauravarshabhah || 55|| iti mahabharate aranyaparvani 187 adhyayantargatam markandeyaproktam
    vishnustotram sampurnam | mahabharata | aranyakaparva | adhyaya 187
  devanagari: मार्कण्डेयप्रोक्तं ४ विष्णुस्तोत्रम् यः स देवो मया दृष्टः पुरा पद्मनिभेक्षणः स एष पुरुषव्याघ्र
    सम्बन्धी ते जनार्दनः ॥ ५०॥ अस्यैव वरदानाद्धि स्मृतिर्न प्रजहाति माम् । दीर्घमायुश्च कौन्तेय स्वच्छन्दमरणं
    तथा ॥ ५१॥ स एष कृष्णो वार्ष्णेयः पुराणपुरुषो विभुः । आस्ते हरिरचिन्त्यात्मा क्रीडन्निव महाभुजः ॥ ५२॥
    एष धाता विधाता च संहर्ता चैव सात्वतः । श्रीवत्सवक्षा गोविन्दः प्रजापतिपतिः प्रभुः ॥ ५३॥ दृष्ट्वेमं
    वृष्णिशार्दूलं स्मृतिर्मामियमागता । आदिदेवमजं विष्णुं पुरुषं पीतवाससम् ॥ ५४॥ सर्वेषामेव भूतानां पिता
    माता च माधवः । गच्छध्वमेनं शरणं शरण्यं कौरवर्षभाः ॥ ५५॥ इति महाभारते आरण्यपर्वणि १८७ अध्यायान्तर्गतं
    मार्कण्डेयप्रोक्तं विष्णुस्तोत्रं सम्पूर्णम् । महाभारत । आरण्यकपर्व । अध्याय १८७
