id: hariharaputramalamantra
category: mantra
name:
  english: hariharaputramalamantra
  devanagari: हरिहरपुत्रमालामन्त्र
content:
  english: simhasanadhishthitaya vaiduryamanimandapakridagrihaya lakshakunkumajapavidyuttulyaprabhaya
    prasannavadanaya unmattacudakalitalolamalyavritavakshahstambhamanipadukamandapaya prasphumran animanditopakarnaya
    purnalankarabandhuradantinirikshitaya kadacit kotivadyatishayinirantarajayashabdamukharanaradadi devarshi
  devanagari: सिंहासनाधिष्ठिताय वैडूर्यमणिमण्डपक्रीडागृहाय लाक्षाकुङ्कुमजपाविद्युत्तुल्यप्रभाय प्रसन्नवदनाय
    उन्मत्तचूडाकलितलोलमाल्यवृतवक्षःस्तम्भमणिपादुकामण्डपाय प्रस्फुंरन् अनिमण्डितोपकर्णाय पूर्णालङ्कारबन्धुरदन्तिनिरीक्षिताय
    कदाचित् कोटिवाद्यातिशायिनिरन्तरजयशब्दमुखरनारदादि देवर्षि
meaning: {}
