id: kytb-3-9-ashtadashinam-pashunam-prayogah-krishna-yajurveda-taittiriya-brahmana-patha-prajapati-ashvamedham
category: stotram
name:
  english: KYTB 3.9 Ashtadashinam Pashunam Prayogah - Krishna Yajurveda Taittiriya Brahmana Patha - Prajapati
    Ashvamedham
content:
  english: krishna yajurvediya taittiriya brahmane tritiyashtake navamah prapathakah shri gurubhyo namah
    | harih om || ngrabhyanam aranyana mprayogah prajapati kramat | tamashtadashibhiranu prayunkta | tama
    pnot | tamaptva 'shtadashibhiravarundha | yadashtadashina alabhyante | yajnameva tairaptva yajamano
    va~thsarasya va esha pratima | yadashtadashinah | dvadasha masah pancartavah || 'shtadashah | yadashtadashina
    alabhyante | sam va~thsarameva tairaptva yajamano 'varundhe || agnishthe karoti | itareshu yupe 'jamitvaya
    || nava navalabhyante saviryatvaya || yadaranyai mpita putrau | vyaddhvanah krameyuh | vidura ngramayo
    rgramantau syatam || purushavyaghrah parimoshina avyadhini staskara aranyeshva jayerann || tadahuh
    | apashavo va ete | yadaranyah | yadaranyai ta | kshipre yajamana mmritagm hareyuh | aranyayatana
    hyaranyah pashava iti | yatpashunnalabheta | anavaruddha asya pashavah syuh | yatparyagni nkuryat
    || yatpashunalabhate | tenaiva pashunavarundhe | yatparyagni yajnaveshasaya | avaruddha asya pashavo
    bhavanti | na yajnavesha sambhavati | na yajamana mmritagm haranti || gramyai sthapayati | ete vai
    pashavah mpita putrava vasyatah | samaddhvanah kramanti | samantika rgramantau bhavatah | narkshikah
    purushavyaghrah parimoshina avyadhini staskara aranyeshva jayante || mprayogah prajapatira varundhiyeti
    | sa etanubhaya npashuna pashyat | gramyag shca | tanalabhata | tairvai sa ubhau lokava varundha |
    gramyaireva pashubhirimam lo~kama varundha | aranyairamum | yadgramya npashunalabhate | imameva tairlokamavarundhe
    | yadaranyan || ntaih || anavaruddho va etasya sam va~thsara ityahuh | ya ita itashcaturmasyani sam
    mprayunkta iti | etavan va~thsarah | yaccaturmasyani | yadete caturmasyah pashava alabhyante | pratyakshameva
    tai 'varundhe | || vi va esha prajaya pashubhir mprayunkte | sam nnaparaddhnoti | praja vai pashava
    ekadashini | yadeta aikadashinah pashava alabhyante | sakshadeva praja 'varundhe || prajapati rvirajamasrijata
    | sa srishta ndashibhiranu prayunkta | tama pnot | tamaptva dashibhiravarundha | yaddashina alabhyante
    || virajameva tairaptva yajamano 'varundhe || ekadasha dashata alabhyante | ekadashakshara trishtup
    | traishtubhah pashavah | pashunevavarundhe || vaishvadevo va ashvah| nanadevatyah pashavo bhavanti
    | ashvasya sarvatvaya | nanarupa bhavanti | tasmannanarupah pashavah | bahurupa bhavanti | tasma nanarupah
    pashavo dve ca va~pahomasahityam asmai vai lokaya gramyah pashava alabhyante | amushma aranyah | yadgramya
    npashunalabhate | imameva tairlokamavarundhe | yadaranyan | amu npashunalabhate | gramyag rlokayora
    varuddhyai | ubhaya npashunalabhate | gramyag mpashunamavaruddhyai || trayastrayo bhavanti | traya
    ime lokah | esham || brahmavadino vadanti | kasma || asmin ~loke bahavah kama iti | yathsamanibhyo
    devata 'nye pashava alabhyante | asminneva talloke kama ndadhati | tasmadasmin ntrayanagm saha vapa
    juhoti | tryavrito vai devah | tryavrita ime lokah | esham nuthsrijantyahigmsayai || ashvasya rathayojanalankaradayah
    yunjanti braddhnamityaha | asau va adityo braddhnah | aditya mevasmai yunakti | arushamityaha | agnirva
    arushah | agnimevasmai yunakti | carantamityaha | vayurvai carann | vayumevasmai yunakti | paritasthusha
    ityaha || || ime vai lokah paritasthushah | imanevasmai lokan yunakti || rocante rocana divityaha
    | nakshatrani vai rocana divi | nakshatranyevasmai rocayati || yunjantyasya kamyetyaha | kamanevasmai
    yunakti || hari vipakshasetyaha | ime vai hari vipakshasa | ime evasmai yunakti || || shona dhrishnu
    nrivahasetyaha | ahoratre vai nrivahasa | ahoratre evasmai yunakti || eta evasmai devata yunakti |
    suvargasya lokasya samashtyai || ketu mpratimuncati | yasha evainagm rajna ngamayati || jimutasyeva
    bhavati pratikamityaha | yatha yajurevaitat || ye te panthana ssavitah purvyasa ityaddhvaryu ryajamanam
    ~vacayatyabhijityai || || para va etasya yajna eti | yasya pashurupa 'nyatra vedya eti | etagg stotaretena
    patha punarashva mavartayasi na ityaha | vayurvai stota | vayumevasya parasta ddadhatyavrittyai ||
    yatha vai havisho grihitasya skandati | evam va~ etadashvasya skandati | yadasyopakritasya lomani
    shiyante | yadvaleshu kacanavayanti | loma nyevasya tathsambharanti || || bhurbhuvassuvariti prajapatya
    bhiravayanti | prajapatyo va ashvah | svayaivaina ndevataya samadrdhayanti || bhuriti mahishi | bhuva
    iti vavata | suvariti parivrikti | esham mabhijityai || hiranyayah kaca bhavanti | jyotirvai hiranyam
    | rashtramashvamedhah || || jyotishcaivasmai rashtra nca samici dadhati || sahasra mbhavanti | sahasra
    sammita ssuvargo lokah | suvargasya lokasya bhijityai || apa va etasmatteja indriya shshrih kramanti
    | yo 'shvamedhena yajate | vasavastva 'njantu gayatrena chandaseti mahishyabhyanakti | tejo va ajya
    m | tejo gayatri | tejasaivasmai tejo 'njantu traishtubhena chandaseti vavata ntrishtup | tejasaivasma
    indriyamavarundhe | aditya 'njantu jagatena chandaseti parivrikti | tejo va ajya m | pashavo jagati
    | tejasaivasmai pashunavarundhe || patnayo 'bhyanjanti | shriya va eta || yatpatnayah | shriya ntaddadhati
    | nasmatteja indriya shshrirapakramanti || laji mannamashvayo paharanti | prajamevannadi nkurvate
    || etaddeva annamattaita dannamaddhi prajapata ityaha | prajayamevannadya ndadhate || yadi navajighra
    t | agnih pashurasidityava ghrapayet | ava haiva jighrati || akrana kramidvaji dyauste prishtha mprithivi
    sadhasthamityashva manumantrayate | esham mabhijityai || samiddho anjankridara mityashvasya priyo
    bhavanti sarupatvaya || paritasthusha ityahe me evasmai yunaktya brahmodyanamakah hotribrahmanossam
    va~dah tejasa va esha brahmavarcasena vyriddhyate | yo 'shvamedhena yajate | hota ca brahma ca brahmodyam
    va~datah | tejasa caivaina mbrahmavarcasena ca samadrdhayatah || dakshinato brahma bhavati | dakshinata
    ayatano vai brahma | barhaspatyo vai brahma | brahmavarcasamevasya dakshinato brahmavarcasitarah ||
    uttarato hota bhavati || || uttarata ayatano vai hota | tejo va agnih | teja evasyo ttarato dadhati
    | tasmaduttaro stejasvitarah || yupamabhito vadatah | yajamanadevatyo vai yupah | yajamanameva tejasa
    ca brahmavarcasena ca samadrdhayatah || kigg rityaha | dyaurvai vrishtih purvacittih || || divameva
    vrishtimavarundhe || kigg dbrihadvaya ityaha | ashvo vai brihadvayah | ashvamevavarundhe || kigg pishangiletyaha
    | ratrirvai pishangila | ratrimevavarundhe || kigg pilippiletyaha | shrirvai pilippila | annadyamevavarundhe
    || ssvidekaki caratityaha | asau va aditya ekaki carati | teja evavarundhe || ka u svijjayate punarityaha
    | candrama vai jayate punah | ayurevavarundhe || kigg sviddhimasya bheshajamityaha | agnirvai himasya
    bheshajam | brahmavarcasamevavarundhe || kigg mmahat | asminneva loke pratitishthati || pricchami
    tva paramanta mprithivya ityaha | vedirvai paro 'ntah prithivyah | vedimevavarundhe || pricchami tva
    bhuvanasya nabhimityaha | yajno vai bhuvanasya nabhih | yajnamevavarundhe || pricchami tva vrishno
    ashvasya reta ityaha | somo vai vrishno ashvasya retah | somapitha mevavarundhe || pricchami vacah
    paramam vyo~metyaha | brahma vai vacah paramam vyo~ma | brahmavarcasa vai vrishtih purvacitti rannadyamevavarundhe
    somo vai vrishno ashvasya retashcatvari ca ssanjnapanaprakarah apa va etasma tpranah kramanti | yo
    'shvamedhena yajate | pranaya svaha vyanaya svaheti sanjnapyamana ahuti rjuhoti | prananevasmindadhati
    | nasma tprana apakramanti || avantih shishthamapyanam | nidhina ntva nidhipatigm havamahe vasoma
    metyaha | apaivasmai taddhnuvate || || atho dhuvantyevaina m | atho nyevasmai hnuvate || trih pariyanti
    | traya ime lokah | ebhya evainam lo~kebhyo dhuvate || trih punah pariyanti | shat thsampadyante |
    shadva ritavah | ritubhirevaina ndhuvate || apa va etebhyah pranah kramanti || | navakritvah pariyanti
    | nava vai purushe pranah | prananevatmandadhate | naibhyah prana apakramanti || ambe ambalyambika
    iti patnimudanayati | ahvataivaina m || subhage kampila vasinityaha | tapa evaina mupanayati || suvarge
    loke samprornvatha 'hamajani garbhadhama tvamajasi garbhadhamityaha | praja vai pashavo garbhah |
    prajameva pashunatmandhatte || deva va ashvamedhe pavamane | suvargam nna prajanann | tamashvah prajanat
    | yathsucibhi nkalpayanti | suvargasya lokasya prajna tyai || gayatri trishtubjagatityaha || || yatha
    yajurevaitat || trayya ssucyo bhavanti | ayasmayyo rajata harinyah | asya vai lokasya rupamayasmayyah
    | antarikshasya rajatah | divo harinyah | disho va ayasmayyah | avantaradisha rajatah | udrdhva harinyah
    | disha evasmai kalpayati || kastva chyati kastva vishasti tyaha higmsayai || ntyurnvathamityaha tatra
    mantrah apa va etasmacchri rashtra 'shvamedhena yajate | udrdhvamena dityaha | shrirvai rashtramashvamedhah
    | shriyamevasma rashtramudrdhva mucchrayati || venubhara vetyaha | rashtram vai~ bharah | rashtramevasmai
    paryuhati || atha mityaha | shrirvai rashtrasya maddhya varundhe || shite vate punanni vetyaha | kshemo
    vai rashtrasya shito vatah | kshemameva varundhe || yaddharini yavamattityaha | vidvai harini | rashtram
    ncaivasmai rashtra nca samici dadhati || na pushta mpashu manyata ityaha | tasma draja pashunna pushyati
    || || shudra yadaryajara na poshaya dhanayatityaha | tasma nnabhishincante || iyam ya~ka shakuntiketyaha
    | vidvai shakuntika | rashtramashvamedhah | visha ncaivasmai rashtra nca samici dadhati || ahalamiti
    sarpatityaha | tasma drashtraya vishah sarpanti || ahata ngabhe pasa ityaha | vidvai gabhah || mpasah
    | rashtramava vishyahanti | tasma nghatukam || mata ca te pita ca ta ityaha | iyam vai~ mata | asau
    pita | abhyamevaina mparidadati || agram vri~kshasya rohata ityaha | shrirvai vakshasyagra m | shriyamevavarundhe
    || || prasulamiti te pita gabhe mushtimatagmsaya dityaha | vidvai gabhah | rashtra mmushtih | rashtrameva
    vishyahanti | tasma nghatukam || apa va etebhyah pranah kramanti | ye yajne va~danti | dadhikrav nno
    akarishamiti surabhi va~danti | prana vai surabhayah | prananevatmandadhate | naibhyah prana apakramanti
    || apo hishtha mayobhuva ityadbhirma rjayante | apo vai sarva devatah rashtrasya maddhyam nca prashamsa
    prajapatih praja 'nu pravishat | tabhyah puna 'bravit | riddhnavadithsah | yo metah punah sabhamraditi
    | ta ndeva ashvamedhenaiva samabharann | tato vai ta a 'shvamedhena yajate | prajapatimeva sambharatyriddhnoti
    || purushamalabhate || || vairajo vai purushah | viraja mevalabhate | atho annam vai~ virat | annamevavarundhe
    || ashvamalabhate | prajapatyo va ashvah | prajapati mevalabhate | atho shrirva ekashapham | shriya
    mevavarundhe || gamalabhate || || yajno vai gauh | yajnamevalabhate | atho annam vai~ gauh | annamevavarundhe
    || ajavi alabhate bhumne | atho pushtirvai bhuma | pushtimevavarundhe || paryagnikrita thsrijantyahigmsayai
    || ubhau va etau pashu alabhyete | yashcavamo yashca paramah | te 'syobhaye yajne baddhah | abhishta
    abhipritah | abhijita abhihuta bhavanti || naina ndankshnavah pashavo yajne baddhah | abhishta abhipritah
    | abhijita abhihuta higmsanti | yo 'shvamedhena yajate | ya u cainamevam 'hani prashavah prathamena
    va esha stomana raddhva | catushtomena kritenayana 'hann | ekavigmshe pratishthaya mpratitishthati
    || ekavigmsha tpratishthaya ritunanvarohati | ritavo vai prishthani | ritavah sam va~thsarah | ritushveva
    sam va~thsare pratishthaya | devata abhyarohati | shakvarayah prishtha 'nye va ete pashava alabhyante
    || || uteva gramyah | utevaranyah | ahareva rupena samadrdhayati | atho ahna evaisha balir hriyate
    || tadahuh | apashavo va ete | yadaja vayashcaranyashca | ete vai sarve pashavah | yadgavya iti |
    gavya npashunavarundhe || prajapatya bhavanti | anabhijitasya bhijityai || saurirnava shvetavasha
    anubandhya bhavanti | antata eva bahmavarcasamavarundhe || somaya svarajne vanadvahaviti dvandvinah
    pashunalabhate | ahoratrana mabhijityai || pashubhirva esha vyriddhyate | yo 'shvamedhena yajate |
    chagala vi~digayamiti tvashtra npashunalabhate | pashubhirevatmanagm samadrdhayati || ritubhirva esha
    vyriddhyate | yo 'shvamedhena yajate | pishanga strayo vasanta ityritu pashunalabhate | ritubhire
    vatmanagm samadrdhayati || a va esha pashubhyo vrishcyate | yo 'shvamedhena yajate | paryagnikrita
    uthsrijantyana mahimabhidhanau prahau prajapati ssyamiti | sa etavashvamedhe mahimanavapashyat | tavagrihnita
    | tato vai sa mahanannado 'bhavat | yah kamayeta mahanannada ssyamiti | sa etavashvamedhe mahimanau
    grihnita | mahanevannado bhavati || yajamanadevatya vai vapa | raja mahima | yadvapa mmahimnobhayatah
    pariyajati | yajamanameva rajyenobhayatah parigrihnati || purasta thsvahakara va anye devah | uparishta
    thsvahakara anye | te va ete 'shva eva meddhya ubhaye 'varuddhyante | yadvapa mmahimnobhayatah pariyajati
    | tanevobhaya ssvishtakridadayashca vaishvadevo va ashvah | tam nkuryat | ya devata apibhagah | ta
    bhagadheyena vyadrdhayet | devata ndaddhyat | stegan nkritva pratisankhyaya rjuhoti | ya eva devata
    apibhagah | ta bhagadheyena samadrdhayati | na devata nanuvakanjuhotya nantarityai || prayasaya svaheti
    pancadasham | pancadasha va adrdhamasasya ratrayah | adrdhamasasha ya~ntta asann | te 'bruvannagnayah
    svishtakritah | ashvasya meddhyasya vayamuddhara muddharamahai | athaitanabhi bhavameti | te lohita
    mudaharanta | tato deva abhavann || 'surah | yathsvishtakridbhyo lohita njuhoti bhratrivyabhibhutyai
    | bhavatyatmana 'sya bhratrivyo bhavati || gomrigakanthena prathama njuhoti | pashavo vai gomrigah
    | rudro ssvishtakrit | rudradeva pashunantardadhati | atho yatraisha | na tatra rudrah pashunabhimanyate
    || || ashvashaphena dvitiya njuhoti | pashavo va ekashapham | rudro ssvishtakrit | rudradeva pashunantardadhati
    | atho yatraisha | na tatra rudrah pashunabhimanyate || ayasmayena kamandaluna tritiya yasyo vai prajah
    | rudro ssvishtakrit | rudradeva praja antardadhati | atho yatraisha | na tatra rudrah praja abhimanyate
    || tadubhayahomamadhyavartyashcastomiyahomah ashvasya va alabdhasya medha udakramat | tadashvastomiya
    mabhavat | yadashvastomiya njuhoti | samedhamevaina malabhate || ajyena juhoti | medho va ajya m |
    medhenaivasmi ndadhati || shatatragmshata njuhoti | shatatragmshadakshara brihati || hatah pashavah
    | sa pashuna | pashuneva matraya samadrdhayati || ta yadbhuyasirva kaniyasirva juhuyat | pashunmatraya
    vyadrdhayet | shatatragmshata njuhoti | shatatragmshadakshara brihati | bar hatah pashavah | sa pashuna
    | pashuneva matraya samadrdhayati || || ashvastomiyagm hutva dvipada juhoti | dvipadvai purusho dvipratishthah
    | tadena mpratishthaya samadrdhayati || tadahuh | ashvastomiya mpurvagm hotavya iti | ashvo va ashvastomiya
    m | purusho dvipadah | ashvastomiyagm hutva dvipada juhoti | tasma ddvipaccatushpadamatti | atho dvipadyeva
    catushpadah pratishthapayati || dvipada hutva | nanyamuttara njuhuyat | yadanyamuttara njuhuyat |
    pra pratishthaya shcyaveta | dvipada antato jahoti pratishthityai || va~thsaranushthanamishtinam prajapati
    rnanvavindat | tamishtibhi ranvavindat | tadishtina mishtitvam | yathsam ryajate | ashvameva tadanvicchati
    || savitriyo bhavanti || vai~ savita | yo va asya nnashyati yo nilayate | asyam vi~ndanti | na va
    ima nkashcanetyahuh | tiryannodrdhvo hatiti | yathsavitriyo bhavanti | savitri prasuta evainamicchati
    || ishvaro va ashvah pramuktah para rjuhoti | ashvasya yatyai dhrityai || yatpratarishtibhi ryajate
    | ashvameva tadanvicchati | yathsaya rjuhoti | ashvasyaiva yatyai dhrityai kshemya bhavanti || yatprata
    ryajate | ashvameva tadanvicchati | tasmaddiva nashtaisha eti || yatpratarishtibhi rjuhoti | ahoratrabhya
    manvicchati | atho ahoratrabhya mevasmai yogakshema ena manvicchatyeka tasvishtishu brahmanarajanyayorganam
    apa va etasmacchri rashtra 'shvamedhena yajate | brahmanau vinagathinau gayatah | shriya va eta ntaddhattah
    | yada khalu vai purusha shshriyamashnute | vina 'smai vadyate || tadahuh | yadubhau bra hmane shri
    ramata iti | brahmano 'nyah | brahma vai bra hmanah | kshatragm rajanyah | tatha hasya brahmana ca
    kshatrena cobhayata shshrih parigrihita bhavati || tadahuh | yadubhau diva gayetam | apa hmane rashtragm
    ramata iti | yada khalu vai raja kamayate | atha brahmana brahmano gayet | naktagm rajanyah | brahmano
    vai rupamahah | kshatrasya ratrih | tatha hasya brahmana ca kshatrena cobhayato rashtra mbhavati ||
    ityadada ityayajatha ityapaca iti brahmano gaye naivainagm sa samadrdhayati || ityajina ityayuddhyatha
    ityamugm sagramma mahanniti rajanyah | yuddham vai~ rajanyasya | yuddhenaivainagm sa samadrdhayati
    || aklripta va etasyartava ityahuh | yo 'shvamedhena yajata iti | tisro 'nyo gayati tisro 'nyah |
    shatthsampadyante | shadva ritavah | ritunevasmai kalpayatah || tabhyagm saggsthaya m | anoyukte ca
    shate ca dadati | shatayuh purusha shshatendriyah | ayushyevendriye pratitishthati || avabhrithahomavisheshah
    sarveshu va eshu lokeshu mrityavo 'nvayattah | tebhyo yadahutirna juhuyat | loke loka ena mmrityurvindet
    | mrityave svaha mrityave svahetyabhi purvamahuti rjuhoti | lokallokadeva mrityumavayajate | nainam
    lo~ke lake mrityurvindati || yadamushmai svaha 'mushmai svaheti juhvathsa nkurvita | mrityave svahetyekasma
    evaika njuhuyat | eko va amushmin ~lake mrityuh || || ashanaya mrityureva | tamevamushmin ~loke 'vayajate
    || bhrunahatyayai svahetyavabhritha ahuti njuhoti | bhrunahatyame va vayajate || tadahuh | yadbhrunahatya
    'patrya 'pi kriyata iti || amrityurva anyo bhrunahatyaya ityahuh | bhrunahatya vava mrityuriti | yadbhrunahatyayai
    svahetyavabhritha ahuti || mrityume va hutya tarpayitva paripana nkritva | bhrunaghne bheshaja nkaroti
    || etagm ha vai mundibha audanyavah | bhrunahatyayai prayashcittim vi~dancakara | yo hasyapi prajaya
    mbrahmanagm hanti | sarvasmai tasmai bheshaja nkaroti || jumbakaya svahetyavabhritha uttamamahuti
    njuhoti | varuno vai jumbakah | antata eva varuna mavayajate || khalaterviklidhasya shuklasya pingakshasya
    mudrdhanjuhoti | etadvai varunasya rupam | rupenaiva varunamavayajate || mudrdhanjuhoti dve ca upakaranamantravyakhyanadih
    varuno va ashvah | ta ndevataya vyadrdhayati | yatprajapatya nkaroti | namo rajne namo varunayetyaha
    | varuno va ashvah | svayaivaina ndevataya samadrdhayati || namo 'shvaya namah prajapataya ityaha
    | prajapatyo va ashvah | svayaivaina ndevataya samadrdhayati || namo || dharmo va adhipatih | dharmameva
    mma kurvadhipatiraha ndhahi mayi dhahityaha | ashishamevaitamasha ste || upakritaya svahetyupakrite
    juhoti | alabdhaya svaheti niyukte juhoti | hutaya svaheti hute juhoti | esham || pra va esha ebhyo
    lokebhyashcyavate | yo 'shvamedhena yajate | agneya npashunalabhate pratishthityai || yada 'gneyo
    bhavati | agni | devata evavarundhe || brahma va agnih | kshatramindrah | yadai || brahmakshatre evavarundhe
    || yada 'shvino bhavati | ashishamavaruddhyai || trayo bhavanti | traya ime lokah | eshveva lokeshu
    pratitishthati || agnaye 'shtakapala iti dashahavishamishti kshara virat | annam mavarundhe || agnermanve
    prathamasya pracetasa iti yajyanuvakya bhavanti sarvatvaya || ashvasya rogadinimitta mprayashcittam
    yadyashvamupatapadvindet | agneya nnirvapet | saumya ncarum | savitra gneyo bhavati | agni mbhishajyati
    || yathsaumyo bhavati | somo va oshadhinagm raja mbhishajyati || yathsavitro bhavati | savitriprasuta
    evaina mbhishajyati || etabhirevaina rbhishajyati | agado haiva bhavati || paushna nnirvapet | yadi
    shlona ssyat | pusha vai shlaunyasya bhishak | sa evaina mbhishajyati | ashlono haiva bhavati || nnirvapet
    | yadi mahati devata 'bhimanyeta | etaddevatyo va ashvah | svayaivaina ndevataya bhishajyati | agado
    haiva bhavati || vaishvanara nnirvapenmrigakhare yadi nagacche shvanarah | iyamevaina mparirodhamanayati
    | a haiva sutyamaha rgacchati || yadyadhiyat || 'shtakapalah | saurya mpayah | vayavya ajyabhagah
    || yajamano va ashvah | agmhasa va esha grihitah | yasyashvo medhaya prokshito 'ddhyeti | yadagmhomuce
    nirvapati | agmhasa eva tena mucyate || yajamano va ashvah | retasa va esha vyriddhyate || || yasyashvo
    medhaya prokshito 'ddhyeti | sauryagm retah | yathsaurya mpayo bhavati | retasaivainagm sa samadrdhayati
    || yajamano va ashvah | garbhairva esha vyriddhyate | yasyashvo medhaya prokshito 'ddhyeti | vayavya
    garbhah | yadvayavya ajyabhago bhavati | garbhairevainagm sa samadrdhayati || atho yasyaisha 'shvamedhe
    prayashcittah kriyate garbhairevainagm sa samadrdhayati dve ca brahmaudana ucyante tadahuh | dvadasha
    brahmaudana sthita nirvapet | dvadashabhirveshtibhi ryajeteti || yadishti bhiryajeta | upanamuka enam
    t | papiyagstu sya t | aptani va etasya chandagmsi | ya ijanah | tani ka etavadashu punah prayunjiteti
    | sarva vai sagg mni | krurikriteva hi bhavatyarushkrita | sa na punah prayujyetyahuh || dvadashaiva
    brahmaudana sthite nirvapet | prajapatirva odanah | yajnah prajapatih | upanamuka enam ya~jno bhavati
    | na papiya nbhavati || dvadasha bhavanti | dvadasha masa va~thsara eva pratitishthati || vibhutvadibhih
    dvadashabhirgunaurashvamedhaprashamsa esha vai vibhurnama yajnah | sarvagm ha vai tatra vibhu bhavati
    | yatraitena yajnena yajante || esha vai prabhurnama yajnah | sarvagm ha vai tatra prabhu bhavati
    | yatraitena yajnena yajante || esha va urjasvannama yajnah | sarvagm ha vai tatrorjasva dbhavati
    | yatraitena yajnena yajante || esha vai payasvannama yajnah || || sarvagm ha vai tatra payasva dbhavati
    | yatraitena yajnena yajante || esha vai vidhrito nama yajnah | sarvagm ha vai tatra vidhrita mbhavati
    | yatraitena yajnena yajante || esha vai vyavritto nama yajnah | sarvagm ha vai tatra vyavritta mbhavati
    | yatraitena yajnena yajante || esha vai pratishthito nama yajnah | sarvagm ha vai tatra pratishthita
    || yatraitena yajnena yajante || esha vai tejasvi nama yajnah | sarvagm ha vai tatra tejasvi bhavati
    | yatraitena yajnena yajante || esha vai brahmavarcasi nama yajnah | a ha vai tatra brahmano brahmavarcasi
    jayate | yatraitena yajnena yajante || esha va ativyadhi nama yajnah | a ha vai tatra rajanyo 'tivyadhi
    jayate | yatraitena yajnena yajante || esha vai dirgho nama yajnah | dirghayusho ha vai tatra manushya
    bhavanti | yatraitena yajnena yajante || esha vai klripto nama yajnah | kalpate ha vai tatra prajabhyo
    yogakshemah | yatraitena yajnena yajante || payasvannama yajnah yatraitena yajnena yajante shatca
    esha vai vibhuh prabhururjasva vidhrito vyavrittah pratishthitastejasvi brahmavarcasyativyadhi dirghah
    klupto dvadasha ashvasanjnapanaprakarah tarpyenashvagm sanjnapayanti | yajno vai tarpyam | yajnenaivainagm
    samadrdhayanti || yamena samna 'nupatishthate | yamaloka ngamayati || tarpye ca krittyadhivase cashvagm
    sanjnapayanti | etadvai pashunagm rupam | rupenaiva pashunavarundhe || hiranyakashipu bhavati | tejaso
    || rukmo bhavati | suvargasya lokasya nukhyatyai || ashvo bhavati | prajapate || asya vai lokasya
    rupa ntarpyam | antarikshasya krittyadhivasah | divo hiranyakashipu | adityasya rukmah | prajapaterashvah
    | imameva loka nkrityadhivasena | divagm hiranyakashipuna | adityagm rukmena | ashvenaiva meddhyena
    prajapate ssayujyagm salokata mapnoti || etasameva devatanagm sayujyam | sar shtitagm samana lokatamapnoti
    | yo 'shvamedhena yajate | ya u cainamevam uttaravedyupavapah adityashcangirasashca suvarge loke 'ngirasa
    adityebhyah | amumaditya 'bhuditi | tasmadashvagm savaryetya dyajne varo diyate || yatprajapati 'bhavat
    | tasmadashvo nama || t | tasmadarva nama || yathsadyo vaja nthsamajayat | tasma dvaji nama || yadasuranam
    lo~kanadatta | tasmadadityo nama || agnirva ashvamedhasya yonirayatanam | suryo rayatanam | yadashvamedhe
    'gnau citya uttaravedi ve~da || pranapanau va etau devana m | yadarkashvamedhau | pranapanavevavarundhe
    || ojo balam m | yadarkashvamedhau | ojo balamevavarundhe || agnirva ashvamedhasya yoni rayatanam
    | yadashvamedhe 'gnau citya uttaravedi ncinoti | tavarkashvamedhau | arkashvamedhaveva varundhe |
    atho arkashva medhayoreva pratitishthati || rishabhalambhah prajapatim mmedhayalabhanta | tamalabhyopavasann
    | prataryashta va~ etaddevanamahah | yathsam va~thsarah | tasmadashvah purasta va~thsara alabhyate
    || yatprajapati 'bhavat | tasmadashvah | yathsadyo medho || tasmadashvamedhah || veduko ve~da || yadvai
    tatprajapati 'bhavat | tasmadashvah prajapateh pashuna 'sya putrah pratirupo jayate | ya evam ve~da
    || sarvani bhutani sabhrintyalabhate | samena stejase brahmavarcasaya bharanti | yo ve~da || etadvai
    taddeva eta mmedhayalabhanta | yajnamava | yajnena yajnamayajanta devah | kamapram ya~jnama kurvata
    | te 'mritatvamakamayanta | ta 'shvamedhena yajate | devanameva || prajapatyenaiva yajnena yajate
    kamaprena | apunarmarameva gacchati || etasya vai rupena purasta bhyah | sarvasyaptyai 'shvamedhena
    yajate | ya u cainamevam ashvavayaveshupasanam yo va ashvasya meddhyasya lomani veda | ashvasyaiva
    meddhyasya lomam lo~manjuhoti | ahoratre va ashvasya meddhyasya lomani | yathsaya mpratarjuhoti |
    ashvasyaiva meddhyasya lomam lo~manjuhoti | etadanukriti hasma vai pura | ashvasya meddhyasya lomam
    lo~manjuhvati || yo va ashvasya meddhyasya pade veda | ashvasyaiva meddhyasya pade pade juhoti | darshapurnamasau
    va ashvasya meddhyasya pade || shapurnamasau yajate | ashvasyaiva meddhyasya pade pade juhoti | etadanukriti
    ha sma vai pura | ashvasya meddhyasya pade pade juhvati || yo va ashvasya meddhyasya vivartanam ve~da
    | ashvasyaiva meddhyasya vivartane vivartane juhoti | asau va adityo 'shvah | sa ahavaniya magacchati
    | tadvivartate | yadagnihotra njuhoti | ashvasyaiva meddhyasya vivartane vivartane juhoti | etadanukriti
    ha sma vai pura | ashvasya meddhyasya vivartane vivartane juhvati || njuhoti trini ca prajapatistamashtadashibhih
    prajapatirakamayatobha apa shrirudrdhvam prajapatirakamayata mahan ~yo va ashvasya meddhyasya lomani
    trayovigmshatih prajapatirakamayata mahan pra va esha ebhyo lokebhyah sarvagm ha vai tatra payasvadya
    ve~da catvaryashitih || harih om || || krishna yajurvediya taittiriya brahmane tritiyashtake navamah
    prapathaka
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय ब्राह्मणे तृतीयाष्टके नवमः प्रपाठकः श्री गुरुभ्यो नमः । ह॒रिः॒
    ओम् ॥ ङ्ग्राभ्याणां आरण्याना म्प्रयोगः प्र॒जाप॑ति क्रामत् । तम॑ष्टाद॒शिभि॒रनु॒ प्रायु॑ङ्क्त । तमा
    प्नोत् । तमा॒प्त्वा ऽष्टा॑द॒शिभि॒रवा॑रुन्ध । यद॑ष्टाद॒शिन॑ आल॒भ्यन्ते । य॒ज्ञमे॒व तैरा॒प्त्वा यज॑मा॒नो
    वँ॒थ्स॒रस्य॒ वा ए॒षा प्र॑ति॒मा । यद॑ष्टाद॒शिनः॑ । द्वाद॑श॒ मासाः॒ पञ्च॒र्तवः॑ ॥ ऽष्टाद॒शः । यद॑ष्टाद॒शिन॑
    आल॒भ्यन्ते॑ । सं॒ वँ॒थ्स॒रमे॒व तैरा॒प्त्वा यजमा॒नो ऽव॑रुन्धे ॥ अ॒ग्नि॒ष्ठे क॒रोति॑ । इत॑रेषु॒ यूपे
    ऽजा॑मित्वाय ॥ नव॑ न॒वाल॑भ्यन्ते सवीर्य॒त्वाय॑ ॥ यदा॑र॒ण्यै म्पिता पु॒त्रौ । व्यद्ध्वा॑नः क्रामेयुः
    । विदू॑र॒ ङ्ग्राम॑यो र्ग्रामा॒न्तौ स्या॑ताम् ॥ पुरुषव्या॒घ्राः प॑रिमो॒षिण॑ आव्या॒धिनी॒ स्तस्क॑रा॒
    अर॑ण्ये॒ष्वा जा॑येरन्न् ॥ तदा॑हुः । अप॑शवो॒ वा ए॒ते । यदा॑र॒ण्याः । यदा॑र॒ण्यै त । क्षि॒प्रे यज॑मान॒
    म्मृ॒तग्ं ह॑रेयुः । अर॑ण्यायतना॒ ह्या॑र॒ण्याः प॒शव॒ इति॑ । यत्प॒शून्नालभे॑त । अन॑वरुद्धा अस्य प॒शवः॑
    स्युः । यत्पर्य॑ग्नि ङ्कु॑र्यात् ॥ यत्प॒शूना॒लभ॑ते । तेनै॒व प॒शूनव॑रुन्धे । यत्पर्य॑ग्नि य॑ज्ञवेशसाय
    । अव॑रुद्धा अस्य प॒शवो॒ भव॑न्ति । न य॑ज्ञवेश॒ सम्भ॑वति । न यज॑मान॒ म्मृ॒तग्ं ह॑रन्ति ॥ ग्रा॒म्यै स्था॑पयति
    । ए॒ते वै प॒शवः॒ म्पि॑ता पु॒त्राव व॑स्यतः । समद्ध्वा॑नः क्रामन्ति । स॒म॒न्ति॒क र्ग्रामा॒न्तौ भ॑वतः
    । नर्क्षीकाः पुरुषव्या॒घ्राः प॑रिमो॒षिण॑ आव्या॒धिनी॒ स्तस्क॑रा॒ अर॑ण्ये॒ष्वा जा॑यन्ते ॥ म्प्रयोगः
