id: satiranikakritamkrishnanarayanastotram
category: stotram
name:
  english: satiranikakritamkrishnanarayanastotram
  devanagari: सतीराणिकाकृतंकृष्णनारायणस्तोत्रम्
content:
  english: sati ranikakritam krishnanarayanastotram satim satyam pratushtava tada krishnanarayanam | satyah
    satyam nityasatyam narayanam namamyaham || 52|| om namo brahmasavitre satyanathaya te namah | pativratyasvarupaya
    pancagnaye ca te namah || 53|| tretagnaye bijasvarupaya ca te namah | garbharupaya balyaya yuvarupaya
    te namah || 54|| kantayai capi kantaya savamshaya ca te namah | yugalaya sthaviraya tryatmakaya ca
    te namah || 55|| namo bhagavate krishna bhagavatyai ca te namah | shilarupaya dharmaya dharmalabhaya
    ca te namah || 56|| namashcitasvarupaya patirupaya te namah | namah panthasya sarthaya'tivahikayai
    te namah || 57|| namah suryaya meghaya vidyute shashine namah | namo divasvarupaya nisharupaya te
    namah || 58|| ayanadvayarupaya namo yugapravartine | namo divaya satyaya namo vaikunthavasine || 59||
    satinam pataye krishna satilokeshine namah | namo golokakantaya namo'ksharanivasine || 60|| namo muktaprapujyaya
    satam ca pataye namah | mukteshvareshaya brahmapriyesha te namah || 61|| namo manikyamuktanam ramayah
    pataye namah | padmavatisatilakshmiradhashripataye namah || 62|| sarveshaya pareshaya namah shriparamatmane
    | lakshmishaya namah shripurushottamaya te namah || 63|| anadishrikrishnanarayanaya svamine namah
    | antaryamisvarupaya sayuje te namo namah || 64|| gopalanandanayesha kambharajaya te namah | ashvapattasya
    candraya mayasuryaya te namah || 65|| smriddhidaya viragaya sarvahartre ca te namah | esha'hangrihasamjna'smi
    griham satyam bhavanmama || 66|| rakshangarakanama tvam tvatpara gishca yavati | tvam sahayam param
    prapya juhomyenam grihana mam || 67|| viditva ca'viditva'pi sarvam juhvati cantatah | ubhayena vidhana'tra
    homo bhavami vai tvayi || 68|| tvam yajnastvam yajnakunde cahavaniyarupavan | garhapatyasvarupastvam
    cavasathyasvarupavan || 69|| yajnakundagnireva'si sarvakundagnireva ca | naya mam satyadharmena satiloke
    kripam kuru || 70|| satidharmo hi narinam jagaduddharakarakah | sati dakshi pura jata vahnina tvadahadvapuh
    || 71|| renuka ca sati jata shabari capi vai pura | kritadharmashrita naryah satitvamupayanti ca ||
    72|| tatha'ham shrihare krishna satitvamupayami ca | ityevam bhupate sa tu komalangi hi ranika ||
    73|| citamaruhya yavaccendhitum vahnim samicchati | tavacchrilomasho devashceshanashca suradayah ||
    74|| anadishrikrishnanarayano lakshmishca gocarah | abhavan sannidhau tatra sati neme samantatah ||
    75|| sati tvam jayamapnuhi satilokam pragacchasi | patya samam sukham bhunkshva yavat svargam pravidyate
    || 76|| ityuktva pradadurashirvadan pushnani candanam | sati vishnum namaskritva sasmara ca punah
    patim || 77|| iti shrilakshminarayaniyasamhita | khanda 2| adhyaya 267
  devanagari: सती राणिकाकृतं कृष्णनारायणस्तोत्रम् सतीं सत्यं प्रतुष्टाव तदा कृष्णनरायणम् । सत्याः सत्यं
    नित्यसत्यं नारायणं नमाम्यहम् ॥ ५२॥ ॐ नमो ब्रह्मसवित्रे सत्यानाथाय ते नमः । पातिव्रत्यस्वरूपाय पञ्चाग्नये
    च ते नमः ॥ ५३॥ त्रेताग्नये बीजस्वरूपाय च ते नमः । गर्भरूपाय बाल्याय युवरूपाय ते नमः ॥ ५४॥ कान्तायै
    चापि कान्ताय सवंशाय च ते नमः । युगलाय स्थविराय त्र्यात्मकाय च ते नमः ॥ ५५॥ नमो भगवते कृष्ण भगवत्यै
    च ते नमः । शीलरूपाय धर्माय धर्मलाभाय च ते नमः ॥ ५६॥ नमश्चितास्वरूपाय पतिरूपाय ते नमः । नमः पान्थस्य
    सार्थायाऽतिवाहिकायै ते नमः ॥ ५७॥ नमः सूर्याय मेघाय विद्युते शशिने नमः । नमो दिवास्वरूपाय निशारूपाय
    ते नमः ॥ ५८॥ अयनद्वयरूपाय नमो युगप्रवर्तिने । नमो दिवाय सत्याय नमो वैकुण्ठवासिने ॥ ५९॥ सतीनां पतये
    कृष्ण सतीलोकेशिने नमः । नमो गोलोककान्ताय नमोऽक्षरनिवासिने ॥ ६०॥ नमो मुक्तप्रपूज्याय सतां च पतये नमः
    । मुक्तेश्वरेशाय ब्रह्मप्रियेश ते नमः ॥ ६१॥ नमो माणिक्यमुक्तानां रमायाः पतये नमः । पद्मावतीसतीलक्ष्मीराधाश्रीपतये
    नमः ॥ ६२॥ सर्वेशाय परेशाय नमः श्रीपरमात्मने । लक्ष्मीशाय नमः श्रीपुरुषोत्तमाय ते नमः ॥ ६३॥ अनादिश्रीकृष्णनारायणाय
    स्वामिने नमः । अन्तर्यामिस्वरूपाय सयुजे ते नमो नमः ॥ ६४॥ गोपालनन्दनायेश कम्भराजाय ते नमः । अश्वपट्टस्य
    चन्द्राय मायासूर्याय ते नमः ॥ ६५॥ स्मृद्धिदाय विरागाय सर्वहर्त्रे च ते नमः । एषाऽहङ्गृहसंज्ञाऽस्मि
    गृहं सत्यं भवान्मम ॥ ६६॥ रक्षाङ्गारकनामा त्वं त्वत्परा गीश्च यावती । त्वां सहायं परं प्राप्य जुहोम्येनां
    गृहाण माम् ॥ ६७॥ विदित्वा चाऽविदित्वाऽपि सर्वं जुह्वति चान्ततः । उभयेन विधानाऽत्र होमो भवामि वै त्वयि
    ॥ ६८॥ त्वं यज्ञस्त्वं यज्ञकुण्डे चाहवनीयरूपवान् । गार्हपत्यस्वरूपस्त्वं चावसथ्यस्वरूपवान् ॥ ६९॥ यज्ञकुण्डाग्निरेवाऽसि
    सर्वकुण्डाग्निरेव च । नय मां सत्यधर्मेण सतीलोके कृपां कुरु ॥ ७०॥ सतीधर्मो हि नारीणां जगदुद्धारकारकः
    । सती दाक्षी पुरा जाता वह्निना त्वदहद्वपुः ॥ ७१॥ रेणुका च सती जाता शबरी चापि वै पुरा । कृतधर्माश्रिता
    नार्यः सतीत्वमुपयान्ति च ॥ ७२॥ तथाऽहं श्रीहरे कृष्ण सतीत्वमुपयामि च । इत्येवं भूपते सा तु कोमलाङ्गी
    हि राणिका ॥ ७३॥ चितामारुह्य यावच्चेन्धितुं वह्निं समिच्छति । तावच्छ्रीलोमशो देवश्चेशानश्च सुरादयः
    ॥ ७४॥ अनादिश्रीकृष्णनारायणो लक्ष्मीश्च गोचराः । अभवन् सन्निधौ तत्र सती नेमे समन्ततः ॥ ७५॥ सती त्वं
    जयमाप्नुहि सतीलोकं प्रगच्छसि । पत्या समं सुखं भुङ्क्ष्व यावत् स्वर्गं प्रविद्यते ॥ ७६॥ इत्युक्त्वा
    प्रददुराशीर्वादान् पुष्णाणि चन्दनम् । सती विष्णुं नमस्कृत्वा सस्मार च पुनः पतिम् ॥ ७७॥ इति श्रीलक्ष्मीनारायणीयसंहिता
    । खण्ड २। अध्याय २६७
