id: devakritopanishatsarashivastavah
category: upanishad
name:
  english: devakritopanishatsarashivastavah
  devanagari: देवकृतोपनिषत्सारशिवस्तवः
content:
  english: devakritopanishatsara shivastavah brahmaiva tvam tridhordhvastvam gatih pushtirmaheshvarah
    | vishvanca vishvatitastvam hutam prahutameva ca || 22|| kritam cakritamete ca paramam ca parayanam
    | narayanadijanako hyaryamno varunasya hi || 23|| janita tvam tatha vayordyavabhusyormaheshvarah |
    sarveshassarvasakshi ca sarva evam tvameva hi || 24|| agrahyassarvabhuteshu sarvendriyagunatigah |
    alingosyasharirastvam vyapakashca sanatanah || 25|| vamanam tvam mahadevam sarvedeva upasate | tvatto
    jatam jagacchambho sthitam tvayyeva liyate || 26|| tvatto nasti prithakkincinna bhinnam paramarthatah
    || 27|| ajam mayam lohitashuklakrishnam bahunasmanjanayantim sarupam | ajastvameko jushamano'nusheshe
    jahatyenam bhuktabhogamajastvam || 28|| mayam tu prakritim vidyanmayinam tu maheshvaram | tavavayavasambhutairvyaptam
    sarvamidam jagat || 29|| neha nanasti kincidvai tvadadhishthitameva hi | tvamavajnaya durmedhah kritakrityo'bhimanyate
    || 30|| na samparayam pravidama bala mudha vayam kevalam tvadvihinah | kincittrinam calayitum ca neshastvam
    no gatih paramam casi shambho || 31|| tvayavritam lokamidam samagram ko va hinam cetate tvadvihinah
    | eko rudrastvam hi sarvasya karta vishvatitah paramashcetako'si || 32|| sarvabhutatigashcatma koshatitah
    paratparah | mahagrasastvamevesha mrityustvadupasecanah || 33|| odanam tava bhutesha brahmakshatram
    jagattatha | brahmapuccham pratishtha tvam shantiraksharameva ca || 34|| hridistha devatassarva hridi
    prane pratishthitah | hridayam purusho'si tvam tisro matrah parashca sah || 35|| onkarah pranavo vyapi
    hyananto'nantavikramah | taram sukshmam vaidyutastvam shuklam sarvashariragam || 36|| ishano bhagavan
    rudro mahadevastvamishvarah | param brahma param dhama parah parah parayanah || 37|| shuro virah purusho
    bhutasamstho vishvo vishveshah pranadashcavyayatma | cakshushashcakshushshrotra eva tvamisha manaso
    mano buddherboddha tvameva || 38|| patih patinam pashavo vayam capyasmanaho pasi tathatsi deva | tvadudbhavam
    sarvamishastvameko naneva bhasi purushasya mayaya || 39|| tileshu tailam dadhiniva sarpirapastrotasvaranishu
    vahnih | evam protam tvayyadvitiye mahesha tvajjam tvallam tvadanam caitadeva || 40|| na vidyate gunakarmadi
    namarupadishaktirjnanashaktya vibhinnah | hridayastvam bhutabhavyah purano hyeko viro vedagunaikavedyah
    || 41|| onkaradisvararupo mahesha vidhama tvam varaniyastathanuh | mahan jeta jigyashcaparajito hyabhravakashah
    khanca kanca tvameva || 42|| vibhrat samrat bhumadhama tvameva pitasi mata bhratrikashcadivedyah |
    rujam harastvam bhishakpapahino hyapanipado nirvikarastvamatma || 43|| svayam bhanah para eko jyotireva
    tvatto na ojastvishtatamo'sti devah | tvam na diva naiva ratristvamishastvam sima vishvatashcakshurishah
    || 44|| na vedanta napi vedashca te vai tava jnanam manasaivadya vrittam | akashah prithivi salilam
    ca vayustejashcasi prathitam te jagacca || 45|| vishvasya neta vishvabharta tvamishastava jnanatsarvameveha
    vindet | tavajnananmohitassarva eva tava prasadadambaya bodhitassmah || 46|| avasthatitah para atma
    tvameva brahmaiva tvam samsarasyadirupah | vishoko vimrityurajighritso'pipasashsharirahino'pyajarah
    puranah || 47|| ritam satyam namarupatigastvam tavameyarupam ko hi vededameva | rico akshare paramastvam
    mahesha nanyatvatto yadbhavededamartam || 48|| nanyadrikpashyati pashyakastvam drishterdrishta vacyavacadihinah
    | vidyadhishassvara eko maheshastvameva tvam veda yo'sisha eva || 49|| namaste harase shocishe te
    namaste astvarcishe devadevavishvadhishashankaro vedavedyah | anyattapantu hetayo ghorarupa bhakteshu
    tvam shivo bhava shatrunasmakam jahi shulena shambho || 50|| ya imam vishvam bhuvanam yasi juhvaddashtih
    prathamo vo manahpadmasamsthah | tvamashisham dravinam dhehi shambho vishvakarta manasa sampradrishyo
    dhata vidhata paramepyasandrik || 51|| teshamishtani tava padapujaya sarvam labhatyeva na hi samshayo'tra
    | tvam no mata tvam pita copaneta mata bandhuh paramovai gurustvam || 52|| tvam deveshu prathito namatastveka
    evedam rudrastva manakpurvasurah | vettum ca tvam nutanashcapi shambho hyaputapurtam jagadekam tvayartam
    || 53|| yadbhutajalam nikhilam vai visrishtametadrisham tvam na vidanti kecidddrishtyantarena paripashyanti
    mudhah | mayaniharapravritashastrajanyah asustripya bhogabhajo bhuvah ke || 54|| yajnairdanaih kamakamaishca
    bala divah parah prithivyastvam parashca | devasuraistvam puro mudhagarbho bhutanam tvam mahima garbharupah
    || 55|| kastvam veda bhutavargairvihinam vedairvishvam yatva linam tvayishe | aja tvannabhau jagadetadvicitram
    madhye'pitam yasmin vishvam bhuvanam ca tvameva || 56|| tato gandharva oshadhisho'pi shambho sarvendriyani
    manasa tvam namamah | hrida pashyanti manasa manishino ye brahmamanvana upasate tvam || 57|| tvamidrisham
    gudhamanupravishtam sahaiva santam na vijananti devah | vishvasya cakshurvishvavaktrorubahurvishvaspatirbhuvanasyasya
    gopta || 58|| dyavabhumi tvatta eveddharashmissuryo bhrajati khe somatarairgrihaishca | nanye jananti
    tava bhaktya vihina hyajatam tvamisham sharanam prapannah || 59|| || iti shivarahasyantargate maheshvarakhye
    devakritopanishatsara shivastavah ||
  devanagari: देवकृतोपनिषत्सार शिवस्तवः ब्रह्मैव त्वं त्रिधोर्ध्वस्त्वं गतिः पुष्टिर्महेश्वरः । विश्वञ्च
    विश्वातीतस्त्वं हुतं प्रहुतमेव च ॥ २२॥ कृतं चाकृतमेते च परमं च परायणम् । नारायणादिजनको ह्यर्यम्णो
    वरुणस्य हि ॥ २३॥ जनिता त्वं तथा वायोर्द्यावाभूस्योर्महेश्वरः । सर्वेशस्सर्वसाक्षी च सर्व एवं त्वमेव
    हि ॥ २४॥ अग्राह्यस्सर्वभूतेषु सर्वेन्द्रियगुणातिगः । अलिङ्गोस्यशरीरस्त्वं व्यापकश्च सनातनः ॥ २५॥ वामनं
    त्वां महादेवं सर्वेदेवा उपासते । त्वत्तो जातं जगच्छम्भो स्थितं त्वय्येव लीयते ॥ २६॥ त्वत्तो नास्ति
    पृथक्किञ्चिन्न भिन्नं परमार्थतः ॥ २७॥ अजां मायां लोहितशुक्लकृष्णां बहूनस्माञ्जनयन्तीं सरूपाम् । अजस्त्वमेको
    जुषमाणोऽनुशेषे जहात्येनां भुक्तभोगामजस्त्वम् ॥ २८॥ मायां तु प्रकृतिं विद्यान्मायिनं तु महेश्वरम् ।
    तवावयवसम्भूतैर्व्याप्तं सर्वमिदं जगत् ॥ २९॥ नेह नानास्ति किञ्चिद्वै त्वदधिष्ठितमेव हि । त्वामवज्ञाय
    दुर्मेधाः कृतकृत्योऽभिमन्यते ॥ ३०॥ न साम्परायं प्रविदाम बाला मूढा वयं केवलं त्वद्विहीनाः । किञ्चित्तृणं
    चालयितुं च नेशास्त्वं नो गतिः परमं चासि शम्भो ॥ ३१॥ त्वयावृतं लोकमिदं समग्रं को वा हीनं चेतते त्वद्विहीनः
    । एको रुद्रस्त्वं हि सर्वस्य कर्ता विश्वातीतः परमश्चेतकोऽसि ॥ ३२॥ सर्वभूतातिगश्चात्मा कोशातीतः परात्परः
    । महाग्रासस्त्वमेवेश मृत्युस्त्वदुपसेचनः ॥ ३३॥ ओदनं तव भूतेश ब्रह्मक्षत्रं जगत्तथा । ब्रह्मपुच्छं
    प्रतिष्ठा त्वं शान्तिरक्षरमेव च ॥ ३४॥ हृदिस्था देवतास्सर्वा हृदि प्राणे प्रतिष्ठिताः । हृदयं पुरुषोऽसि
    त्वं तिस्रो मात्राः परश्च सः ॥ ३५॥ ओङ्कारः प्रणवो व्यापी ह्यनन्तोऽनन्तविक्रमः । तारं सूक्ष्मं वैद्युतस्त्वं
    शुक्लं सर्वशरीरगम् ॥ ३६॥ ईशानो भगवान् रुद्रो महादेवस्त्वमीश्वरः । परं ब्रह्म परं धाम परः पारः परायणः
    ॥ ३७॥ शूरो वीरः पुरुषो भूतसंस्थो विश्वो विश्वेशः प्राणदश्चाव्ययात्मा । चक्षुषश्चक्षुश्श्रोत्र एव त्वमीश
    मनसो मनो बुद्धेर्बोद्धा त्वमेव ॥ ३८॥ पतिः पतीनां पशवो वयं चाप्यस्मानहो पासि तथात्सि देव । त्वदुद्भवं
    सर्वमीशस्त्वमेको नानेव भासि पुरुषस्य मायया ॥ ३९॥ तिलेषु तैलं दधिनीव सर्पिरापस्त्रोतस्वरणीषु वह्निः
    । एवं प्रोतं त्वय्यद्वितीये महेश त्वज्जं त्वल्लं त्वदनं चैतदेव ॥ ४०॥ न विद्यते गुणकर्मादि नामरूपादिशक्तिर्ज्ञानशक्त्या
    विभिन्नः । हृदयस्त्वं भूतभव्यः पुराणो ह्येको वीरो वेदगुणैकवेद्यः ॥ ४१॥ ओङ्कारादिस्वररूपो महेश विधामा
    त्वं वरणीयस्तथाणुः । महान् जेता जिग्यश्चापराजितो ह्यभ्रावकाशः खञ्च कञ्च त्वमेव ॥ ४२॥ विभ्राट् संराट्
    भूमधामा त्वमेव पितासि माता भ्रातृकश्चादिवेद्यः । रुजां हरस्त्वं भिषक्पापहीनो ह्यपाणिपादो निर्विकारस्त्वमात्मा
    ॥ ४३॥ स्वयं भानः पर एको ज्योतिरेव त्वत्तो न ओजस्त्विष्टतमोऽस्ति देवः । त्वं न दिवा नैव रात्रिस्त्वमीशस्त्वं
    सीमा विश्वतश्चक्षुरीशः ॥ ४४॥ न वेदान्ता नापि वेदाश्च ते वै तव ज्ञानं मनसैवाद्य वृत्तम् । आकाशः पृथिवी
    सलिलं च वायुस्तेजश्चासि प्रथितं ते जगच्च ॥ ४५॥ विश्वस्य नेता विश्वभर्ता त्वमीशस्तव ज्ञानात्सर्वमेवेह
    विन्देत् । तवाज्ञानान्मोहितास्सर्व एव तव प्रसादादम्बया बोधितास्स्मः ॥ ४६॥ अवस्थातीतः पर आत्मा त्वमेव
    ब्रह्मैव त्वं संसरस्यादिरूपः । विशोको विमृत्युरजिघृत्सोऽपिपासश्शरीरहीनोऽप्यजरः पुराणः ॥ ४७॥ ऋतं सत्यं
    नामरूपातिगस्त्वं तवामेयरूपं को हि वेदेदमेव । ऋचो अक्षरे परमस्त्वं महेश नान्यत्वत्तो यद्भवेदेदमार्तम्
    ॥ ४८॥ नान्यदृक्पश्यति पश्यकस्त्वं दृष्टेर्दृष्टा वाच्यवाचादिहीनः । विद्याधीशस्स्वर एको महेशस्त्वमेव
    त्वं वेद योऽसीश एव ॥ ४९॥ नमस्ते हरसे शोचिषे ते नमस्ते अस्त्वर्चिषे देवदेवविश्वाधीशशङ्करो वेदवेद्यः
    । अन्यत्तपन्तु हेतयो घोररूपा भक्तेषु त्वं शिवो भव शत्रूनस्माकं जहि शूलेन शम्भो ॥ ५०॥ य इमं विश्वं
    भुवनं यासि जुह्वद्दष्टिः प्रथमो वो मनःपद्मसंस्थः । त्वमाशिषं द्रविणं धेहि शम्भो विश्वकर्ता मनसा सम्प्रदृश्यो
    धाता विधाता परमेप्यसन्दृक् ॥ ५१॥ तेषामिष्टानि तव पादपूजया सर्वं लभत्येव न हि संशयोऽत्र । त्वं नो माता
    त्वं पिता चोपनेता माता बन्धुः परमोवै गुरुस्त्वम् ॥ ५२॥ त्वं देवेषु प्रथितो नामतस्त्वेक एवेदं रुद्रस्त्वा
    मनाक्पूर्वसूराः । वेत्तुं च त्वां नूतनाश्चापि शम्भो ह्यपूतपूर्तं जगदेकं त्वयार्तम् ॥ ५३॥ यद्भूतजालं
    निखिलं वै विसृष्टमेतादृशं त्वां न विदन्ति केचिद्द्दृष्ट्यान्तरेण परिपश्यन्ति मूढाः । मायानीहारप्रावृताशास्त्रजन्याः
    असूस्तृप्या भोगभाजो भुवः के ॥ ५४॥ यज्ञैर्दानैः कामकामैश्च बाला दिवः परः पृथिव्यास्त्वं परश्च । देवासुरैस्त्वं
    पुरो मूढगर्भो भूतानां त्वं महिमा गर्भरूपः ॥ ५५॥ कस्त्वां वेद भूतवर्गैर्विहीनं वेदैर्विश्वं यत्व लीनं
    त्वयीशे । अज त्वन्नाभौ जगदेतद्विचित्रं मध्येऽपितं यस्मिन् विश्वं भुवनं च त्वमेव ॥ ५६॥ ततो गन्धर्वा
    ओषधीशोऽपि शम्भो सर्वेन्द्रियाणि मनसा त्वां नमामः । हृदा पश्यन्ति मनसा मनीषिणो ये ब्रह्ममन्वान उपासते
    त्वाम् ॥ ५७॥ त्वामीदृशं गूढमनुप्रविष्टं सहैव सन्तं न विजानन्ति देवाः । विश्वस्य चक्षुर्विश्ववक्त्रोरुबाहुर्विश्वस्पतिर्भुवनस्यास्य
    गोप्ता ॥ ५८॥ द्यावाभूमी त्वत्त एवेद्धरश्मिस्सूर्यो भ्राजति खे सोमतारैर्गृहैश्च । नान्ये जानन्ति तव
    भक्त्या विहीना ह्यजातं त्वामीशं शरणं प्रपन्नाः ॥ ५९॥ ॥ इति शिवरहस्यान्तर्गते माहेश्वराख्ये देवकृतोपनिषत्सार
    शिवस्तवः ॥
