id: shakyasimhastotram-7
category: stotram
name:
  english: shakyasimhastotram 7
  devanagari: शाक्यसिंहस्तोत्रम् ७
content:
  english: shakyasimhastotram 7 om namah sarvajnaya | name shrighana tvam sadabhavabhakto bhavambhodhisetum
    lasanmokshahetum | tridhatum vidhatum suraksham viraksham sudaksham sukaksham sujatam sudantam ||
    1 name danashilakshamadhyanaviryam mahajjnanaparangatam saugatatvam | caturbrahmavaiharalokoddharantam
    catuhsatyadharmopadesham suvesham || 2|| name bodhirajam sugamye virajamsuramye vane devarajadigamyam
    | caturthasanastham hitartham dishantam kritanekasustham jagadrakshanastham || 3|| caturmaralokam
    mahadviryavantam jayantam hasantam trijalam ca kalam | kshamanaddhadeham name muktageham trilokyaikanatham
    tatha shakyanatham || 4|| name marasainyam jitam yena sarvam nirastrena sahayyamuktena nunam | kshamavarma
    maitridhanurdharina ca jagatpalitum bodhivrikshasthitena || 5|| name shitavyanjairlasaddehageham jane
    snehavantam vane gehavantam | yutam dvadhikaistrimshakairlakshanakhyairmahadurlabham traibhave lokapujyam
    || 6|| name dharmameghasthitam supratishtham kalau nathahine bhaveyam sanathah | tatha palitum svam
    pratijnam cakara janim shakyavamshe mahipavatamse || 7|| name bhagyato labhyate darshanam te tatha
    bhagyabhajo svayameti buddhih | sthito dharmameghe katham darshanam syad vihina na tatrabhigantum
    prashaktah || 8|| idanim bhavatpadapadmotthitena rajahpunjakena trilokam pavitram | tathasmacchiramsi
    pavitrani satyam carishyami bodhim bhavacchasanena || 9|| bhujangaprayatam kritam madhavena pathed
    yo jinasyagratastho hi nityam | sada mangalam tasya gehe sudehe prasannashca raksham karishyanti buddhah
    || 10|| trijalam ca chitva sukhani prabhuktva tatha danashiladiparangatashca | mahabodhilabdha jagatpalakshodam
    gamishyanti cante sukhavatyupakhyam || 11|| iti shrishakyasimhasya vishnukritam bhujangaprayatastotram
    sampurnam ||
  devanagari: शाक्यसिंहस्तोत्रम् ७ ॐ नमः सर्वज्ञाय । नमे श्रीघन त्वां सदाभावभक्तो भवाम्भोधिसेतुं लसन्मोक्षहेतुम्
    । त्रिधातुं विधातुं सुरक्षां विरक्षां सुदक्षं सुकक्षां सुजातं सुदान्तम् ॥ १ नमे दानशीलक्षमाध्यानवीर्यं
    महज्ज्ञानपारङ्गतं सौगतत्वम् । चतुर्ब्रह्मवैहारलोकोद्धरन्तं चतुःसत्यधर्मोपदेशं सुवेशम् ॥ २॥ नमे बोधिराजं
    सुगम्ये विराजंसुरम्ये वने देवराजादिगम्यम् । चतुर्थासनस्थं हितार्थं दिशन्तं कृतानेकसुस्थं जगद्रक्षणस्थम्
    ॥ ३॥ चतुर्मारलोकं महद्वीर्यवन्तं जयन्तं हसन्तं त्रिजालं च कालम् । क्षमानद्धदेहं नमे मुक्तगेहं त्रिलोक्यैकनाथं
    तथा शाक्यनाथम् ॥ ४॥ नमे मारसैन्यं जितं येन सर्वं निरस्त्रेण साहाय्यमुक्तेन नूनम् । क्षमावर्म मैत्रीधनुर्धारिणा
    च जगत्पालितुं बोधिवृक्षस्थितेन ॥ ५॥ नमे शीतव्यञ्जैर्लसद्देहगेहं जने स्नेहवन्तं वने गेहवन्तम् । युतं
    द्वाधिकैस्त्रिंशकैर्लक्षणाख्यैर्महादुर्लभं त्रैभवे लोकपूज्यम् ॥ ६॥ नमे धर्ममेघास्थितं सुप्रतिष्ठं
    कलौ नाथहीने भवेयं सनाथः । तथा पालितुं स्वां प्रतिज्ञां चकार जनिं शाक्यवंशे महीपावतंसे ॥ ७॥ नमे भाग्यतो
    लभ्यते दर्शनं ते तथा भाग्यभाजो स्वयमेति बुद्धिः । स्थितो धर्ममेघे कथं दर्शनं स्याद् विहीना न तत्राभिगन्तुं
    प्रशक्ताः ॥ ८॥ इदानीं भवत्पादपद्मोत्थितेन रजःपुञ्जकेन त्रिलोकं पवित्रम् । तथास्माच्छिरांसि पवित्राणि
    सत्यं चरिष्यामि बोधिं भवच्छासनेन ॥ ९॥ भुजङ्गप्रयातं कृतं माधवेन पठेद् यो जिनस्याग्रतस्थो हि नित्यम्
    । सदा मङ्गलं तस्य गेहे सुदेहे प्रसन्नाश्च रक्षां करिष्यन्ति बुद्धाः ॥ १०॥ त्रिजालं च छित्वा सुखानि
    प्रभुक्त्वा तथा दानशीलादिपारङ्गताश्च । महाबोधिलब्धा जगत्पालक्षोदं गमिष्यन्ति चान्ते सुखावत्युपाख्याम्
    ॥ ११॥ इति श्रीशाक्यसिंहस्य विष्णुकृतं भुजङ्गप्रयातस्तोत्रं सम्पूर्णम् ॥
