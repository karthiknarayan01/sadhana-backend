id: mrikandukritamvishnustotram
category: stotram
name:
  english: mrikandukritamvishnustotram
  devanagari: मृकण्डुकृतंविष्णुस्तोत्रम्
content:
  english: mrikandukritam vishnustotram mrikanduruvaca | namah pareshaya paratmarupine paratparasmatparatah
    paraya | aparaparaya paranukartre namah parebhyah paraparanaya || 83|| yo namajatyadivikalpahinah
    shabdadidoshavyatirekarupah | bahusvarupo'pi niranjano yastamishamidyam paramam bhajami || 84|| vedantavedyam
    purusham puranam hiranyagarbhadijagatsvarupam | anupamam bhaktijananukampinam bhajami sarveshvaramadimidyam
    || 85|| pashyanti yam vitasamastadosha dhyanaikanishtha vigatasprihashca | nivrittamohah paramam pavitram
    nato'smi samsaranivarttakam tam || 86|| smritartinashanam vishnum sharanagatapalakam | jagatsevyam
    jagaddhama paresham karunakaram || 87|| iti naradapurane purvabhage caturthadhyayantargatam mrikandukritam
    vishnustotram samaptam | brihannaradiyapurana | purvabhaga | adhyaya 4
  devanagari: मृकण्डुकृतं विष्णुस्तोत्रम् मृकण्डुरुवाच । नमः परेशाय परात्मरूपिणे परात्परस्मात्परतः पराय
    । अपारपाराय परानुकर्त्रे नमः परेभ्यः परपारणाय ॥ ८३॥ यो नामजात्यादिविकल्पहीनः शब्दादिदोषव्यतिरेकरूपः
    । बहुस्वरूपोऽपि निरञ्जनो यस्तमीशमीड्यं परमं भजामि ॥ ८४॥ वेदान्तवेद्यं पुरुषं पुराणं हिरण्यगर्भादिजगत्स्वरूपम्
    । अनूपमं भक्तिजनानुकम्पिनं भजामि सर्वेश्वरमादिमीड्यम् ॥ ८५॥ पश्यन्ति यं वीतसमस्तदोषा ध्यानैकनिष्ठा
    विगतस्पृहाश्च । निवृत्तमोहाः परमं पवित्रं नतोऽस्मि संसारनिवर्त्तकं तम् ॥ ८६॥ स्मृतार्तिनाशनं विष्णुं
    शरणागतपालकम् । जगत्सेव्यं जगद्धाम परेशं करुणाकरम् ॥ ८७॥ इति नारदपुराणे पूर्वभागे चतुर्थाध्यायान्तर्गतं
    मृकण्डुकृतं विष्णुस्तोत्रं समाप्तम् । बृहन्नारदीयपुराण । पूर्वभाग । अध्याय ४
