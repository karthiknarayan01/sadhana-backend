id: ashtaadasa-shaktipeetha-stotram
category: stotram
name:
  english: Ashtaadasa Shaktipeetha Stotram
content:
  english: lankayam shankaridevi kamakshi kancikapure | pradyumne shrinkhaladevi camundi krauncapattane
    || || alampure jogulamba shrishaile bhramarambika | kòlhapure mahalakshmi muhurye ekavira || || ujjayinyam
    mahakali pithikayam puruhutika | odhyayam girijadevi manikya dakshavatike || || harikshetre kamarupi
    prayage madhaveshvari | jvalayam vaishnavidevi gaya mangalyagaurika || || varanashyam vishalakshi
    kashmiretu sarasvati | ashtadasha supithani yoginamapi durlabham || || sayankale pathennityam sarvashatruvinashanam
    | sarvarogaharam divyam sarvasampatkaram shubham ||
  devanagari: लङ्कायां शाङ्करीदेवी कामाक्षी काञ्चिकापुरे । प्रद्युम्ने शृङ्खलादेवी चामुण्डी क्रौञ्चपट्टणे
    ॥ ॥ अलम्पुरे जोगुलाम्बा श्रीशैले भ्रमराम्बिका । कॊल्हापुरे महालक्ष्मी मुहुर्ये एकवीरा ॥ ॥ उज्जयिन्यां
    महाकाली पीठिकायां पुरुहूतिका । ओढ्यायां गिरिजादेवी माणिक्या दक्षवाटिके ॥ ॥ हरिक्षेत्रे कामरूपी प्रयागे
    माधवेश्वरी । ज्वालायां वैष्णवीदेवी गया माङ्गल्यगौरिका ॥ ॥ वारणाश्यां विशालाक्षी काश्मीरेतु सरस्वती
    । अष्टादश सुपीठानि योगिनामपि दुर्लभम् ॥ ॥ सायङ्काले पठेन्नित्यं सर्वशत्रुविनाशनम् । सर्वरोगहरं दिव्यं
    सर्वसम्पत्करं शुभम् ॥
