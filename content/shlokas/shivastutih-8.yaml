id: shivastutih-8
category: stotram
name:
  english: shivastutih
  devanagari: शिवस्तुतिः
content:
  english: iti stavena mam stutva natva devam maheshvaram | kartikyam purnimayam tu homah karyo dvijottamah
    || 64|| kapilagodvayam deyam savatsam ca sadakshinam | masam naktashano bhuyatsomavare uposhitah ||
    65|| kartike somavare tu pujyeta parameshvarah | caturshu ratriyameshu payasam ca nivedayet || 66||
    dronadhutturabilvaishca pujayetsomavasare | ekam vapi ca dhutturam mayi datva viliyate || 67|| sarveshvapi
    ca maseshu somavaro varo varah | tatrapi shravanah punyah kartikastacchatottarah || 68|| visheshatkartike
    masi tasminpuja matottara | somardrapatayukto yah somavarah shive tada || 74|| sahasrarkagrahaistulyah
    sarvapapapranashakrit | tasminnabhyarcanam punyam prashastam pritikrinmama || 75|| || iti shivarahasyantargate
    ishvaraproktam kartikamasakrite shivastutih sampurna ||
  devanagari: इति स्तवेन मां स्तुत्वा नत्वा देवं महेश्वरम् । कार्तिक्यां पूर्णिमायां तु होमः कार्यो द्विजोत्तमः
    ॥ ६४॥ कपिलागोद्वयं देयं सवत्सं च सदक्षिणम् । मासं नक्ताशनो भूयात्सोमवारे उपोषितः ॥ ६५॥ कार्तिके सोमवारे
    तु पूज्येत परमेश्वरः । चतुर्षु रात्रियामेषु पायसं च निवेदयेत् ॥ ६६॥ द्रोणधुत्तूरबिल्वैश्च पूजयेत्सोमवासरे
    । एकं वापि च धुत्तूरं मयि दत्वा विलीयते ॥ ६७॥ सर्वेष्वापि च मासेषु सोमवारो वरो वरः । तत्रापि श्रावणः
    पुण्यः कार्तिकस्तच्छतोत्तरः ॥ ६८॥ विशेषात्कार्तिके मासि तस्मिन्पूजा मतोत्तरा । सोमार्द्रापातयुक्तो
    यः सोमवारः शिवे तदा ॥ ७४॥ सहस्रार्कग्रहैस्तुल्यः सर्वपापप्रणाशकृत् । तस्मिन्नभ्यर्चनं पुण्यं प्रशस्तं
    प्रीतिकृन्मम ॥ ७५॥ ॥ इति शिवरहस्यान्तर्गते ईश्वरप्रोक्तं कार्तिकमासकृते शिवस्तुतिः सम्पूर्णा ॥
