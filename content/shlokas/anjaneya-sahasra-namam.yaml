id: anjaneya-sahasra-namam
category: stotram
name:
  english: Anjaneya Sahasra Namam
content:
  english: om asya shrihanumatsahasranamastotra mantrasya shriramacandrrishih anushtupchandah shrihanumanmaharudro
    devata hrim shrim hraum hram bijam shrim iti shaktih kilikila bubu karena iti kilakam lankavidhvamsaneti
    kavacam mama sarvopadravashantyarthe mama sarvakaryasiddhyarthe jape viniyogah | dhyanam prataptasvarnavarnabham
    samraktarunalocanam | sugrivadiyutam dhyayet pitambarasamavritam || goshpadikritavarashim pucchamastakamishvaram
    | jnanamudram ca bibhranam sarvalankarabhushitam || vamahastasamakrishtadashasyananamandalam | udyaddakshinadordandam
    hanumantam vicintayet || stotram hanuman shriprado vayuputro rudro nayo'jarah | amrityurviravirashca
    gramavaso janashrayah || || dhanado nirgunakaro viro nidhipatirmunih | pingaksho varado vagmi sitashokavinashanah
    || || shivah sharvah paro'vyakto vyaktavyakto dharadharah | pingakeshah pingaroma shrutigamyah sanatanah
    || || anadirbhagavan divyo vishvaheturnarashrayah | arogyakarta vishvesho vishvanatho harishvarah
    || || bhargo ramo ramabhaktah kalyanaprakritishvarah | vishvambharo vishvamurtirvishvakaro'tha vishvapah
    || || vishvatma vishvasevyo'tha vishvo vishvadharo ravih | vishvaceshto vishvagamyo vishvadhyeyah
    kaladharah || || plavangamah kapishreshtho jyeshtho vedyo vanecarah | balo vriddho yuva tattvam tattvagamyah
    sakha hyajah || || anjanasunuravyagro gramasyanto dharadharah | bhurbhuvahsvarmaharloko janolokastapo'vyayah
    || || satyamonkaragamyashca pranavo vyapako'malah | shivadharmapratishthata rameshtah phalgunapriyah
    || || goshpadikritavarishah purnakamo dharapatih | rakshoghnah pundarikakshah sharanagatavatsalah
    || || janakipranadata ca rakshahpranapaharakah | purnah satyah pitavasa divakarasamaprabhah || ||
    dronaharta shaktineta shaktirakshasamarakah | akshaghno ramadutashca shakinijivitaharah || || bubhukarahataratirgarvaparvatamardanah
    | hetustvahetuh pramshushca vishvakarta jagadguruh || || jagannatho jaganneta jagadisho janeshvarah
    | jagatshrito harih shrisho garudasmayabhanjakah || || parthadhvajo vayuputrah sitapuccho'mitaprabhah
    | brahmapucchah parabrahmapuccho rameshtakarakah || || sugrivadiyuto jnani vanaro vanareshvarah |
    kalpasthayi ciranjivi prasannashca sadashivah || || sanmatih sadgatirbhuktimuktidah kirtidayakah |
    kirtih kirtipradashcaiva samudrah shripradah shivah || || udadhikramano devah samsarabhayanashanah
    | valibandhanakridvishvajeta vishvapratishthitah || || lankarih kalapurusho lankeshagrihabhanjanah
    | bhutavaso vasudevo vasustribhuvaneshvarah || shriramarupah krishnastu lankaprasadabhanjanah | krishnah
    krishnastutah shantah shantido vishvabhavanah || || vishvabhokta'tha maraghno brahmacari jitendriyah
    | urdhvago languli mali langulahatarakshasah || || samiratanujo viro viramaro jayapradah | jaganmangaladah
    punyah punyashravanakirtanah || || punyakirtih punyagitirjagatpavanapavanah | devesho'mitaroma'tha
    ramabhaktavidhayakah || || dhyata dhyeyo jagatsakshi ceta caitanyavigrahah | jnanadah pranadah prano
    jagatpranah samiranah || || vibhishanapriyah shurah pippalashrayasiddhidah | siddhah siddhashrayah
    kalah kalabhakshakapujitah || || lankeshanidhanasthayi lankadahaka ishvarah | candrasuryagninetrashca
    kalagnih pralayantakah || || kapilah kapishah punyaratirdvadasharashigah | sarvashrayo'prameyatma
    revatyadinivarakah || || lakshmanapranadata ca sitajivanahetukah | ramadhyayi hrishikesho vishnubhakto
    jati bali || || devaridarpaha hota dhata karta jagatprabhuh | nagaragramapalashca shuddho buddho nirantarah
    || || niranjano nirvikalpo gunatito bhayankarah | hanumamshca duraradhyastapahsadhyo maheshvarah ||
    || janakighanashokotthatapaharta parasharah | vanmayah sadasadrupah karanam prakriteh parah || ||
    bhagyado nirmalo neta pucchalankavidahakah | pucchabaddho yatudhano yatudhanaripupriyah || || chayapahari
    bhutesho lokeshah sadgatipradah | plavangameshvarah krodhah krodhasamraktalocanah || || krodhaharta
    tapaharta bhaktabhayavarapradah | bhaktanukampi vishveshah puruhutah purandarah || || agnirvibhavasurbhasvan
    yamo nirritireva ca | varuno vayugatiman vayuh kubera ishvarah || || ravishcandrah kujah saumyo guruh
    kavyah shanaishcarah | rahuh keturmaruddata dhata harta samirajah || || mashakikritadevarirdaityarirmadhusudanah
    | kamah kapih kamapalah kapilo vishvajivanah || || bhagirathipadambhojah setubandhavisharadah | svaha
    svadha havih kavyam havyavahah prakashakah || || svaprakasho mahaviro madhuro'mitavikramah | uddinoddinagatiman
    sadgatih purushottamah || || jagadatma jagadyonirjagadanto hyanantarah | vipapma nishkalanko'tha mahan
    mahadahankritih || || kham vayuh prithivi capo vahnirdik kala ekalah | kshetrajnah kshetrapalashca
    palvalikritasagarah || || hiranmayah puranashca khecaro bhucaro manuh | hiranyagarbhah sutratma rajarajo
    visham patih || || vedantavedya udgitho vedango vedaparagah | pratigramasthitah sadyah sphurtidata
    gunakarah || || nakshatramali bhutatma surabhih kalpapadapah | cintamanirgunanidhih prajadvaramanuttamah
    || || punyashlokah puraratih matiman sharvaripatih | kilkilaravasantrastabhutapretapishacakah || ||
    rinatrayaharah sukshmah sthulah sarvagatih puman | apasmaraharah smarta shrutirgatha smritirmanuh
    || || svargadvaram prajadvaram mokshadvaram yatishvarah | nadarupam param brahma brahma brahmapuratanah
    || || eko'neko janah shuklah svayanjyotiranakulah | jyotirjyotiranadishca sattviko rajasastamah ||
    || tamoharta niralambo nirakaro gunakarah | gunashrayo gunamayo brihatkayo brihadyashah || brihaddhanurbrihatpado
    brihanmurdha brihatsvanah | brihatkarno brihannaso brihadbahurbrihattanuh || || brihadgalo brihatkayo
    brihatpuccho brihatkarah | brihadgatirbrihatsevo brihallokaphalapradah || || brihadbhaktirbrihadvanchaphalado
    brihadishvarah | brihallokanuto drashta vidyadata jagadguruh || || devacaryah satyavadi brahmavadi
    kaladharah | saptapatalagami ca malayacalasamshrayah || || uttarashasthitah shrisho divyaushadhivashah
    khagah | shakhamrigah kapindro'tha puranah pranacancurah || || caturo brahmano yogi yogigamyah paro'varah
    | anadinidhano vyaso vaikunthah prithivipatih || || aparajito jitaratih sadanandada ishita | gopalo
    gopatiryoddha kalih sphalah paratparah || || manovegi sadayogi samsarabhayanashanah | tattvadata'tha
    tattvajnastattvam tattvaprakashakah || || shuddho buddho nityayukto bhaktakaro jagadrathah | pralayo'mitamayashca
    mayatito vimatsarah || || mayanirjitarakshashca mayanirmitavishtapah | mayashrayashca nirlepo mayanirvartakah
    sukhi || sukhi sukhaprado nago maheshakritasamstavah | maheshvarah satyasandhah sharabhah kalipavanah
    || || raso rasajnah sanmano rupam cakshuh shruti ravah | ghranam gandhah sparshanam ca sparsho hinkaramanagah
    || || neti netiti gamyashca vaikunthabhajanapriyah | girisho girijakanto durvasah kavirangirah ||
    || bhrigurvasishthashcyavano naradastumbururharah | vishvakshetram vishvabijam vishvanetram ca vishvapah
    || || yajako yajamanashca pavakah pitarastatha | shraddha buddhih kshama tandra mantro mantrayita
    surah || || rajendro bhupati rudho mali samsarasarathih | nityah sampurnakamashca bhaktakamadhuguttamah
    || || ganapah keshavo bhrata pita mata'tha marutih | sahasramurdha sahasrasyah sahasrakshah sahasrapat
    || || kamajit kamadahanah kamah kamyaphalapradah | mudropahari rakshoghnah kshitibharaharo balah ||
    || nakhadamshtrayudho vishnubhakto bhaktabhayapradah | darpaha darpado damshtrashatamurtiramurtiman
    || || mahanidhirmahabhago mahabhargo mahardhidah | mahakaro mahayogi mahateja mahadyutih || mahakarma
    mahanado mahamantro mahamatih | mahashamo mahodaro mahadevatmako vibhuh || || rudrakarma krurakarma
    ratnanabhah kritagamah | ambhodhilanghanah siddhah satyadharma pramodanah || || jitamitro jayah somo
    vijayo vayuvahanah | jivo dhata sahasramshurmukundo bhuridakshinah || || siddharthah siddhidah siddhah
    sankalpah siddhihetukah | saptapatalacaranah saptarshiganavanditah || || saptabdhilanghano virah saptadviporumandalah
    | saptangarajyasukhadah saptamatrinishevitah || || saptalokaikamakutah saptahotrah svarashrayah |
    saptasamopagitashca saptapatalasamshrayah || || saptacchandonidhih saptacchandah saptajanashrayah
    | medhadah kirtidah shokahari daurbhagyanashanah || || sarvavashyakaro garbhadoshaha putrapautradah
    | prativadimukhastambho rushtacittaprasadanah || || parabhicarashamano duhkhaha bandhamokshadah |
    navadvarapuradharo navadvaraniketanah || || naranarayanastutyo navanathamaheshvarah | mekhali kavaci
    khadgi bhrajishnurjishnusarathih || bahuyojanavistirnapucchah pucchahatasurah | dushtahanta niyamita
    pishacagrahashatanah || || balagrahavinashi ca dharmaneta kripakarah | ugrakrityashcogravega ugranetrah
    shatakratuh || || shatamanyustutah stutyah stutih stota mahabalah | samagragunashali ca vyagro rakshovinashanah
    || || raksho'gnidavo brahmeshah shridharo bhaktavatsalah | meghanado megharupo meghavrishtinivaranah
    || || meghajivanahetushca meghashyamah paratmakah | samiratanayo dhata tattvavidyavisharadah || ||
    amogho'moghavrishtishcabhishtado'nishtanashanah | artho'narthapahari ca samartho ramasevakah || ||
    arthi dhanyo'suraratih pundarikaksha atmabhuh | sankarshano vishuddhatma vidyarashih sureshvarah ||
    || acaloddharako nityah setukridramasarathih | anandah paramanando matsyah kurmo nidhih shayah ||
    || varaho narasimhashca vamano jamadagnijah | ramah krishnah shivo buddhah kalki ramashrayo harih
    || || nandi bhringi ca candi ca ganesho ganasevitah | karmadhyakshah suraramo vishramo jagatipatih
    || jagannathah kapishashca sarvavasah sadashrayah | sugrivadistuto dantah sarvakarma plavangamah ||
    || nakhadaritarakshashca nakhayuddhavisharadah | kushalah sudhanah shesho vasukistakshakastatha ||
    || svarnavarno baladhyashca purujeta'ghanashanah | kaivalyadipah kaivalyo garudah pannago guruh ||
    || klikliravahataratigarvah parvatabhedanah | vajrango vajravaktrashca bhaktavajranivarakah || ||
    nakhayudho manigrivo jvalamali ca bhaskarah | praudhapratapastapano bhaktatapanivarakah || || sharanam
    jivanam bhokta nanaceshto'tha cancalah | svasthastvasvasthyaha duhkhashatanah pavanatmajah || || pavanah
    pavanah kanto bhaktangah sahano balah | meghanadaripurmeghanadasamhritarakshasah || || ksharo'ksharo
    vinitatma vanareshah satangatih | shrikanthah shitikanthashca sahayah sahanayakah || || asthulastvananurbhargo
    devasamsritinashanah | adhyatmavidyasarashcapyadhyatmakushalah sudhih || || akalmashah satyahetuh
    satyadah satyagocarah | satyagarbhah satyarupah satyah satyaparakramah || || anjanapranalingam ca
    vayuvamshodbhavah shrutih | bhadrarupo rudrarupah surupashcitrarupadhrik || || mainakavanditah sukshmadarshano
    vijayo jayah | krantadinmandalo rudrah prakatikritavikramah || || kambukanthah prasannatma hrasvanaso
    vrikodarah | lamboshthah kundali citramali yogavidam varah || || vipashcit kaviranandavigraho'nalpanashanah
    | phalgunisunuravyagro yogatma yogatatparah || || yogavidyogakarta ca yogayonirdigambarah | akaradikshakarantavarnanirmitavigrahah
    || || ulukhalamukhah siddhasamstutah parameshvarah | shlishtajanghah shlishtajanuh shlishtapanih shikhadharah
    || || susharma'mitadharma ca narayanaparayanah | jishnurbhavishnu rocishnurgrasishnuh sthanureva ca
    || || hari rudranukridvrikshakampano bhumikampanah | gunapravahah sutratma vitaragah stutipriyah ||
    || nagakanyabhayadhvamsi kritapurnah kapalabhrit | anukulo'kshayo'payo'napayo vedaparagah || || aksharah
    purusho lokanathastryakshah prabhurdridhah | ashtangayogaphalabhuh satyasandhah purushtutah || ||
    shmashanasthananilayah pretavidravanakshamah | pancaksharaparah pancamatriko ranjano dhvajah || ||
    yoginivrindavandyashrih shatrughno'nantavikramah | brahmacarindriyavapurdhritadando dashatmakah ||
    || aprapancah sadacarah shuraseno vidarakah | buddhah pramoda anandah saptajihvapatirdharah || ||
    navadvarapuradharah pratyagrah samagayanah | shatcakradhama svarlokabhayahrinmanado madah || || sarvavashyakarah
    shaktirananto'nantamangalah | ashtamurtidharo neta virupah svarasundarah || || dhumaketurmahaketuh
    satyaketurmaharathah | nandipriyah svatantrashca mekhali damarupriyah || || lohitangah samidvahnih
    shadrituh sharva ishvarah | phalabhuk phalahastashca sarvakarmaphalapradah || || dharmadhyaksho dharmaphalo
    dharmo dharmaprado'rthadah | pancavimshatitattvajnastarako brahmatatparah || || trimargavasatirbhimah
    sarvadushtanibarhanah | urjahsvami jalasvami shuli mali nishakarah || || raktambaradharo rakto raktamalyavibhushanah
    | vanamali shubhangashca shvetah shvetambaro yuva || || jayo'jeyaparivarah sahasravadanah kavih |
    shakinidakiniyaksharakshobhutaprabhanjanah || || sadyojatah kamagatirjnanamurtiryashaskarah | shambhutejah
    sarvabhaumo vishnubhaktah plavangamah || || caturnavatimantrajnah paulastyabaladarpaha | sarvalakshmipradah
    shrimanangadapriyavardhanah || || smritibijam sureshanah samsarabhayanashanah | uttamah shriparivarah
    shribhurugrashca kamadhuk || || sadagatirmatarishva ramapadabjashatpadah | nilapriyo nilavarno nilavarnapriyah
    suhrit || || ramaduto lokabandhurantaratma manoramah | shriramadhyanakridvirah sada kimpurushastutah
    || || ramakaryantarangashca shuddhirgatiranamayah | punyashlokah paranandah pareshapriyasarathih ||
    || lokasvami muktidata sarvakaranakaranah | mahabalo mahavirah paravaragatirguruh || || tarako bhagavamstrata
    svastidata sumangalah | samastalokasakshi ca samastasuravanditah | sitasametashriramapadasevadhurandharah
    || || idam namasahasram tu yo'dhite pratyaham narah | duhkhaugho nashyate kshipram sampattirvardhate
    ciram | vashyam caturvidham tasya bhavatyeva na samshayah || || rajano rajaputrashca rajakiyashca
    mantrinah | trikalam pathanadasya drishyante ca tripakshatah || || ashvatthamule japatam nasti vairikritam
    bhayam | trikalapathanadasya siddhih syat karasamsthita || || brahme muhurte cotthaya pratyaham yah
    pathennarah | aihikamushmikan so'pi labhate natra samshayah || || sangrame sannivishtanam vairividravanam
    bhavet | jvarapasmarashamanam gulmadivyadhivaranam || || samrajyasukhasampattidayakam japatam nrinam
    | ya idam pathate nityam pathayedva samahitah | sarvan kamanavapnoti vayuputraprasadatah || || iti
    shrianjaneya sahasranama stotram |
  devanagari: ॐ अस्य श्रीहनुमत्सहस्रनामस्तोत्र मन्त्रस्य श्रीरामचन्द्रृषिः अनुष्टुप्छन्दः श्रीहनुमान्महारुद्रो
    देवता ह्रीं श्रीं ह्रौं ह्रां बीजं श्रीं इति शक्तिः किलिकिल बुबु कारेण इति कीलकं लङ्काविध्वंसनेति
    कवचं मम सर्वोपद्रवशान्त्यर्थे मम सर्वकार्यसिद्ध्यर्थे जपे विनियोगः । ध्यानम् प्रतप्तस्वर्णवर्णाभं
    संरक्तारुणलोचनम् । सुग्रीवादियुतं ध्यायेत् पीताम्बरसमावृतम् ॥ गोष्पदीकृतवाराशिं पुच्छमस्तकमीश्वरम्
    । ज्ञानमुद्रां च बिभ्राणं सर्वालङ्कारभूषितम् ॥ वामहस्तसमाकृष्टदशास्याननमण्डलम् । उद्यद्दक्षिणदोर्दण्डं
    हनूमन्तं विचिन्तयेत् ॥ स्तोत्रम् हनूमान् श्रीप्रदो वायुपुत्रो रुद्रो नयोऽजरः । अमृत्युर्वीरवीरश्च
    ग्रामवासो जनाश्रयः ॥ ॥ धनदो निर्गुणाकारो वीरो निधिपतिर्मुनिः । पिङ्गाक्षो वरदो वाग्मी सीताशोकविनाशनः
    ॥ ॥ शिवः शर्वः परोऽव्यक्तो व्यक्ताव्यक्तो धराधरः । पिङ्गकेशः पिङ्गरोमा श्रुतिगम्यः सनातनः ॥ ॥ अनादिर्भगवान्
    दिव्यो विश्वहेतुर्नराश्रयः । आरोग्यकर्ता विश्वेशो विश्वनाथो हरीश्वरः ॥ ॥ भर्गो रामो रामभक्तः कल्याणप्रकृतीश्वरः
    । विश्वम्भरो विश्वमूर्तिर्विश्वाकारोऽथ विश्वपः ॥ ॥ विश्वात्मा विश्वसेव्योऽथ विश्वो विश्वधरो रविः ।
    विश्वचेष्टो विश्वगम्यो विश्वध्येयः कलाधरः ॥ ॥ प्लवङ्गमः कपिश्रेष्ठो ज्येष्ठो वेद्यो वनेचरः । बालो
    वृद्धो युवा तत्त्वं तत्त्वगम्यः सखा ह्यजः ॥ ॥ अञ्जनासूनुरव्यग्रो ग्रामस्यान्तो धराधरः । भूर्भुवःस्वर्महर्लोको
    जनोलोकस्तपोऽव्ययः ॥ ॥ सत्यमोङ्कारगम्यश्च प्रणवो व्यापकोऽमलः । शिवधर्मप्रतिष्ठाता रामेष्टः फल्गुनप्रियः
    ॥ ॥ गोष्पदीकृतवारीशः पूर्णकामो धरापतिः । रक्षोघ्नः पुण्डरीकाक्षः शरणागतवत्सलः ॥ ॥ जानकीप्राणदाता च
    रक्षःप्राणापहारकः । पूर्णः सत्यः पीतवासा दिवाकरसमप्रभः ॥ ॥ द्रोणहर्ता शक्तिनेता शक्तिराक्षसमारकः ।
    अक्षघ्नो रामदूतश्च शाकिनीजीविताहरः ॥ ॥ बुभूकारहतारातिर्गर्वपर्वतमर्दनः । हेतुस्त्वहेतुः प्रांशुश्च
    विश्वकर्ता जगद्गुरुः ॥ ॥ जगन्नाथो जगन्नेता जगदीशो जनेश्वरः । जगत्श्रितो हरिः श्रीशो गरुडस्मयभञ्जकः
    ॥ ॥ पार्थध्वजो वायुपुत्रः सितपुच्छोऽमितप्रभः । ब्रह्मपुच्छः परब्रह्मपुच्छो रामेष्टकारकः ॥ ॥ सुग्रीवादियुतो
    ज्ञानी वानरो वानरेश्वरः । कल्पस्थायी चिरञ्जीवी प्रसन्नश्च सदाशिवः ॥ ॥ सन्मतिः सद्गतिर्भुक्तिमुक्तिदः
    कीर्तिदायकः । कीर्तिः कीर्तिप्रदश्चैव समुद्रः श्रीप्रदः शिवः ॥ ॥ उदधिक्रमणो देवः संसारभयनाशनः । वालिबन्धनकृद्विश्वजेता
    विश्वप्रतिष्ठितः ॥ ॥ लङ्कारिः कालपुरुषो लङ्केशगृहभञ्जनः । भूतावासो वासुदेवो वसुस्त्रिभुवनेश्वरः ॥
    श्रीरामरूपः कृष्णस्तु लङ्काप्रासादभञ्जनः । कृष्णः कृष्णस्तुतः शान्तः शान्तिदो विश्वभावनः ॥ ॥ विश्वभोक्ताऽथ
    मारघ्नो ब्रह्मचारी जितेन्द्रियः । ऊर्ध्वगो लाङ्गुली माली लाङ्गूलाहतराक्षसः ॥ ॥ समीरतनुजो वीरो वीरमारो
    जयप्रदः । जगन्मङ्गलदः पुण्यः पुण्यश्रवणकीर्तनः ॥ ॥ पुण्यकीर्तिः पुण्यगीतिर्जगत्पावनपावनः । देवेशोऽमितरोमाऽथ
    रामभक्तविधायकः ॥ ॥ ध्याता ध्येयो जगत्साक्षी चेता चैतन्यविग्रहः । ज्ञानदः प्राणदः प्राणो जगत्प्राणः
    समीरणः ॥ ॥ विभीषणप्रियः शूरः पिप्पलाश्रयसिद्धिदः । सिद्धः सिद्धाश्रयः कालः कालभक्षकपूजितः ॥ ॥ लङ्केशनिधनस्थायी
    लङ्कादाहक ईश्वरः । चन्द्रसूर्याग्निनेत्रश्च कालाग्निः प्रलयान्तकः ॥ ॥ कपिलः कपिशः पुण्यरातिर्द्वादशराशिगः
    । सर्वाश्रयोऽप्रमेयात्मा रेवत्यादिनिवारकः ॥ ॥ लक्ष्मणप्राणदाता च सीताजीवनहेतुकः । रामध्यायी हृषीकेशो
    विष्णुभक्तो जटी बली ॥ ॥ देवारिदर्पहा होता धाता कर्ता जगत्प्रभुः । नगरग्रामपालश्च शुद्धो बुद्धो निरन्तरः
    ॥ ॥ निरञ्जनो निर्विकल्पो गुणातीतो भयङ्करः । हनुमांश्च दुराराध्यस्तपःसाध्यो महेश्वरः ॥ ॥ जानकीघनशोकोत्थतापहर्ता
    पराशरः । वाङ्मयः सदसद्रूपः कारणं प्रकृतेः परः ॥ ॥ भाग्यदो निर्मलो नेता पुच्छलङ्काविदाहकः । पुच्छबद्धो
    यातुधानो यातुधानरिपुप्रियः ॥ ॥ छायापहारी भूतेशो लोकेशः सद्गतिप्रदः । प्लवङ्गमेश्वरः क्रोधः क्रोधसंरक्तलोचनः
    ॥ ॥ क्रोधहर्ता तापहर्ता भक्ताभयवरप्रदः । भक्तानुकम्पी विश्वेशः पुरुहूतः पुरन्दरः ॥ ॥ अग्निर्विभावसुर्भास्वान्
    यमो निरृतिरेव च । वरुणो वायुगतिमान् वायुः कुबेर ईश्वरः ॥ ॥ रविश्चन्द्रः कुजः सौम्यो गुरुः काव्यः शनैश्चरः
    । राहुः केतुर्मरुद्दाता धाता हर्ता समीरजः ॥ ॥ मशकीकृतदेवारिर्दैत्यारिर्मधुसूदनः । कामः कपिः कामपालः
    कपिलो विश्वजीवनः ॥ ॥ भागीरथीपदाम्भोजः सेतुबन्धविशारदः । स्वाहा स्वधा हविः कव्यं हव्यवाहः प्रकाशकः
    ॥ ॥ स्वप्रकाशो महावीरो मधुरोऽमितविक्रमः । उड्डीनोड्डीनगतिमान् सद्गतिः पुरुषोत्तमः ॥ ॥ जगदात्मा जगद्योनिर्जगदन्तो
    ह्यनन्तरः । विपाप्मा निष्कलङ्कोऽथ महान् महदहङ्कृतिः ॥ ॥ खं वायुः पृथिवी चापो वह्निर्दिक् काल एकलः
    । क्षेत्रज्ञः क्षेत्रपालश्च पल्वलीकृतसागरः ॥ ॥ हिरण्मयः पुराणश्च खेचरो भूचरो मनुः । हिरण्यगर्भः सूत्रात्मा
    राजराजो विशां पतिः ॥ ॥ वेदान्तवेद्य उद्गीथो वेदाङ्गो वेदपारगः । प्रतिग्रामस्थितः सद्यः स्फूर्तिदाता
    गुणाकरः ॥ ॥ नक्षत्रमाली भूतात्मा सुरभिः कल्पपादपः । चिन्तामणिर्गुणनिधिः प्रजाद्वारमनुत्तमः ॥ ॥ पुण्यश्लोकः
    पुरारातिः मतिमान् शर्वरीपतिः । किल्किलारावसन्त्रस्तभूतप्रेतपिशाचकः ॥ ॥ ऋणत्रयहरः सूक्ष्मः स्थूलः सर्वगतिः
    पुमान् । अपस्मारहरः स्मर्ता श्रुतिर्गाथा स्मृतिर्मनुः ॥ ॥ स्वर्गद्वारं प्रजाद्वारं मोक्षद्वारं यतीश्वरः
    । नादरूपं परं ब्रह्म ब्रह्म ब्रह्मपुरातनः ॥ ॥ एकोऽनेको जनः शुक्लः स्वयञ्ज्योतिरनाकुलः । ज्योतिर्ज्योतिरनादिश्च
    सात्त्विको राजसस्तमः ॥ ॥ तमोहर्ता निरालम्बो निराकारो गुणाकरः । गुणाश्रयो गुणमयो बृहत्कायो बृहद्यशाः
    ॥ बृहद्धनुर्बृहत्पादो बृहन्मूर्धा बृहत्स्वनः । बृहत्कर्णो बृहन्नासो बृहद्बाहुर्बृहत्तनुः ॥ ॥ बृहद्गलो
    बृहत्कायो बृहत्पुच्छो बृहत्करः । बृहद्गतिर्बृहत्सेवो बृहल्लोकफलप्रदः ॥ ॥ बृहद्भक्तिर्बृहद्वाञ्छाफलदो
    बृहदीश्वरः । बृहल्लोकनुतो द्रष्टा विद्यादाता जगद्गुरुः ॥ ॥ देवाचार्यः सत्यवादी ब्रह्मवादी कलाधरः ।
    सप्तपातालगामी च मलयाचलसंश्रयः ॥ ॥ उत्तराशास्थितः श्रीशो दिव्यौषधिवशः खगः । शाखामृगः कपीन्द्रोऽथ पुराणः
    प्राणचञ्चुरः ॥ ॥ चतुरो ब्राह्मणो योगी योगिगम्यः परोऽवरः । अनादिनिधनो व्यासो वैकुण्ठः पृथिवीपतिः ॥
    ॥ अपराजितो जितारातिः सदानन्दद ईशिता । गोपालो गोपतिर्योद्धा कलिः स्फालः परात्परः ॥ ॥ मनोवेगी सदायोगी
    संसारभयनाशनः । तत्त्वदाताऽथ तत्त्वज्ञस्तत्त्वं तत्त्वप्रकाशकः ॥ ॥ शुद्धो बुद्धो नित्ययुक्तो भक्ताकारो
    जगद्रथः । प्रलयोऽमितमायश्च मायातीतो विमत्सरः ॥ ॥ मायानिर्जितरक्षाश्च मायानिर्मितविष्टपः । मायाश्रयश्च
    निर्लेपो मायानिर्वर्तकः सुखी ॥ सुखी सुखप्रदो नागो महेशकृतसंस्तवः । महेश्वरः सत्यसन्धः शरभः कलिपावनः
    ॥ ॥ रसो रसज्ञः सन्मानो रूपं चक्षुः श्रुती रवः । घ्राणं गन्धः स्पर्शनं च स्पर्शो हिङ्कारमानगः ॥ ॥ नेति
    नेतीति गम्यश्च वैकुण्ठभजनप्रियः । गिरिशो गिरिजाकान्तो दुर्वासाः कविरङ्गिराः ॥ ॥ भृगुर्वसिष्ठश्च्यवनो
    नारदस्तुम्बुरुर्हरः । विश्वक्षेत्रं विश्वबीजं विश्वनेत्रं च विश्वपः ॥ ॥ याजको यजमानश्च पावकः पितरस्तथा
    । श्रद्धा बुद्धिः क्षमा तन्द्रा मन्त्रो मन्त्रयिता सुरः ॥ ॥ राजेन्द्रो भूपती रूढो माली संसारसारथिः
    । नित्यः सम्पूर्णकामश्च भक्तकामधुगुत्तमः ॥ ॥ गणपः केशवो भ्राता पिता माताऽथ मारुतिः । सहस्रमूर्धा सहस्रास्यः
    सहस्राक्षः सहस्रपात् ॥ ॥ कामजित् कामदहनः कामः काम्यफलप्रदः । मुद्रोपहारी रक्षोघ्नः क्षितिभारहरो बलः
    ॥ ॥ नखदंष्ट्रायुधो विष्णुभक्तो भक्ताभयप्रदः । दर्पहा दर्पदो दंष्ट्राशतमूर्तिरमूर्तिमान् ॥ ॥ महानिधिर्महाभागो
    महाभर्गो महर्धिदः । महाकारो महायोगी महातेजा महाद्युतिः ॥ महाकर्मा महानादो महामन्त्रो महामतिः । महाशमो
    महोदारो महादेवात्मको विभुः ॥ ॥ रुद्रकर्मा क्रूरकर्मा रत्ननाभः कृतागमः । अम्भोधिलङ्घनः सिद्धः सत्यधर्मा
    प्रमोदनः ॥ ॥ जितामित्रो जयः सोमो विजयो वायुवाहनः । जीवो धाता सहस्रांशुर्मुकुन्दो भूरिदक्षिणः ॥ ॥ सिद्धार्थः
    सिद्धिदः सिद्धः सङ्कल्पः सिद्धिहेतुकः । सप्तपातालचरणः सप्तर्षिगणवन्दितः ॥ ॥ सप्ताब्धिलङ्घनो वीरः सप्तद्वीपोरुमण्डलः
    । सप्ताङ्गराज्यसुखदः सप्तमातृनिषेवितः ॥ ॥ सप्तलोकैकमकुटः सप्तहोत्रः स्वराश्रयः । सप्तसामोपगीतश्च सप्तपातालसंश्रयः
    ॥ ॥ सप्तच्छन्दोनिधिः सप्तच्छन्दः सप्तजनाश्रयः । मेधादः कीर्तिदः शोकहारी दौर्भाग्यनाशनः ॥ ॥ सर्ववश्यकरो
    गर्भदोषहा पुत्रपौत्रदः । प्रतिवादिमुखस्तम्भो रुष्टचित्तप्रसादनः ॥ ॥ पराभिचारशमनो दुःखहा बन्धमोक्षदः
    । नवद्वारपुराधारो नवद्वारनिकेतनः ॥ ॥ नरनारायणस्तुत्यो नवनाथमहेश्वरः । मेखली कवची खड्गी भ्राजिष्णुर्जिष्णुसारथिः
    ॥ बहुयोजनविस्तीर्णपुच्छः पुच्छहतासुरः । दुष्टहन्ता नियमिता पिशाचग्रहशातनः ॥ ॥ बालग्रहविनाशी च धर्मनेता
    कृपाकरः । उग्रकृत्यश्चोग्रवेग उग्रनेत्रः शतक्रतुः ॥ ॥ शतमन्युस्तुतः स्तुत्यः स्तुतिः स्तोता महाबलः
    । समग्रगुणशाली च व्यग्रो रक्षोविनाशनः ॥ ॥ रक्षोऽग्निदावो ब्रह्मेशः श्रीधरो भक्तवत्सलः । मेघनादो मेघरूपो
    मेघवृष्टिनिवारणः ॥ ॥ मेघजीवनहेतुश्च मेघश्यामः परात्मकः । समीरतनयो धाता तत्त्वविद्याविशारदः ॥ ॥ अमोघोऽमोघवृष्टिश्चाभीष्टदोऽनिष्टनाशनः
    । अर्थोऽनर्थापहारी च समर्थो रामसेवकः ॥ ॥ अर्थी धन्योऽसुरारातिः पुण्डरीकाक्ष आत्मभूः । सङ्कर्षणो विशुद्धात्मा
    विद्याराशिः सुरेश्वरः ॥ ॥ अचलोद्धारको नित्यः सेतुकृद्रामसारथिः । आनन्दः परमानन्दो मत्स्यः कूर्मो निधिः
    शयः ॥ ॥ वराहो नारसिंहश्च वामनो जमदग्निजः । रामः कृष्णः शिवो बुद्धः कल्की रामाश्रयो हरिः ॥ ॥ नन्दी
    भृङ्गी च चण्डी च गणेशो गणसेवितः । कर्माध्यक्षः सुरारामो विश्रामो जगतीपतिः ॥ जगन्नाथः कपीशश्च सर्वावासः
    सदाश्रयः । सुग्रीवादिस्तुतो दान्तः सर्वकर्मा प्लवङ्गमः ॥ ॥ नखदारितरक्षश्च नखयुद्धविशारदः । कुशलः सुधनः
    शेषो वासुकिस्तक्षकस्तथा ॥ ॥ स्वर्णवर्णो बलाढ्यश्च पुरुजेताऽघनाशनः । कैवल्यदीपः कैवल्यो गरुडः पन्नगो
    गुरुः ॥ ॥ क्लीक्लीरावहतारातिगर्वः पर्वतभेदनः । वज्राङ्गो वज्रवक्त्रश्च भक्तवज्रनिवारकः ॥ ॥ नखायुधो
    मणिग्रीवो ज्वालामाली च भास्करः । प्रौढप्रतापस्तपनो भक्ततापनिवारकः ॥ ॥ शरणं जीवनं भोक्ता नानाचेष्टोऽथ
    चञ्चलः । स्वस्थस्त्वस्वास्थ्यहा दुःखशातनः पवनात्मजः ॥ ॥ पवनः पावनः कान्तो भक्ताङ्गः सहनो बलः । मेघनादरिपुर्मेघनादसंहृतराक्षसः
    ॥ ॥ क्षरोऽक्षरो विनीतात्मा वानरेशः सताङ्गतिः । श्रीकण्ठः शितिकण्ठश्च सहायः सहनायकः ॥ ॥ अस्थूलस्त्वनणुर्भर्गो
    देवसंसृतिनाशनः । अध्यात्मविद्यासारश्चाप्यध्यात्मकुशलः सुधीः ॥ ॥ अकल्मषः सत्यहेतुः सत्यदः सत्यगोचरः
    । सत्यगर्भः सत्यरूपः सत्यः सत्यपराक्रमः ॥ ॥ अञ्जनाप्राणलिङ्गं च वायुवंशोद्भवः श्रुतिः । भद्ररूपो रुद्ररूपः
    सुरूपश्चित्ररूपधृक् ॥ ॥ मैनाकवन्दितः सूक्ष्मदर्शनो विजयो जयः । क्रान्तदिङ्मण्डलो रुद्रः प्रकटीकृतविक्रमः
    ॥ ॥ कम्बुकण्ठः प्रसन्नात्मा ह्रस्वनासो वृकोदरः । लम्बोष्ठः कुण्डली चित्रमाली योगविदां वरः ॥ ॥ विपश्चित्
    कविरानन्दविग्रहोऽनल्पनाशनः । फाल्गुनीसूनुरव्यग्रो योगात्मा योगतत्परः ॥ ॥ योगविद्योगकर्ता च योगयोनिर्दिगम्बरः
    । अकारादिक्षकारान्तवर्णनिर्मितविग्रहः ॥ ॥ उलूखलमुखः सिद्धसंस्तुतः परमेश्वरः । श्लिष्टजङ्घः श्लिष्टजानुः
    श्लिष्टपाणिः शिखाधरः ॥ ॥ सुशर्माऽमितधर्मा च नारायणपरायणः । जिष्णुर्भविष्णू रोचिष्णुर्ग्रसिष्णुः स्थाणुरेव
    च ॥ ॥ हरी रुद्रानुकृद्वृक्षकम्पनो भूमिकम्पनः । गुणप्रवाहः सूत्रात्मा वीतरागः स्तुतिप्रियः ॥ ॥ नागकन्याभयध्वंसी
    कृतपूर्णः कपालभृत् । अनुकूलोऽक्षयोऽपायोऽनपायो वेदपारगः ॥ ॥ अक्षरः पुरुषो लोकनाथस्त्र्यक्षः प्रभुर्दृढः
    । अष्टाङ्गयोगफलभूः सत्यसन्धः पुरुष्टुतः ॥ ॥ श्मशानस्थाननिलयः प्रेतविद्रावणक्षमः । पञ्चाक्षरपरः पञ्चमातृको
    रञ्जनो ध्वजः ॥ ॥ योगिनीवृन्दवन्द्यश्रीः शत्रुघ्नोऽनन्तविक्रमः । ब्रह्मचारीन्द्रियवपुर्धृतदण्डो दशात्मकः
    ॥ ॥ अप्रपञ्चः सदाचारः शूरसेनो विदारकः । बुद्धः प्रमोद आनन्दः सप्तजिह्वपतिर्धरः ॥ ॥ नवद्वारपुराधारः
    प्रत्यग्रः सामगायनः । षट्चक्रधामा स्वर्लोकभयहृन्मानदो मदः ॥ ॥ सर्ववश्यकरः शक्तिरनन्तोऽनन्तमङ्गलः ।
    अष्टमूर्तिधरो नेता विरूपः स्वरसुन्दरः ॥ ॥ धूमकेतुर्महाकेतुः सत्यकेतुर्महारथः । नन्दीप्रियः स्वतन्त्रश्च
    मेखली डमरुप्रियः ॥ ॥ लोहिताङ्गः समिद्वह्निः षडृतुः शर्व ईश्वरः । फलभुक् फलहस्तश्च सर्वकर्मफलप्रदः
    ॥ ॥ धर्माध्यक्षो धर्मफलो धर्मो धर्मप्रदोऽर्थदः । पञ्चविंशतितत्त्वज्ञस्तारको ब्रह्मतत्परः ॥ ॥ त्रिमार्गवसतिर्भीमः
    सर्वदुष्टनिबर्हणः । ऊर्जःस्वामी जलस्वामी शूली माली निशाकरः ॥ ॥ रक्ताम्बरधरो रक्तो रक्तमाल्यविभूषणः
    । वनमाली शुभाङ्गश्च श्वेतः श्वेताम्बरो युवा ॥ ॥ जयोऽजेयपरीवारः सहस्रवदनः कविः । शाकिनीडाकिनीयक्षरक्षोभूतप्रभञ्जनः
    ॥ ॥ सद्योजातः कामगतिर्ज्ञानमूर्तिर्यशस्करः । शम्भुतेजाः सार्वभौमो विष्णुभक्तः प्लवङ्गमः ॥ ॥ चतुर्णवतिमन्त्रज्ञः
    पौलस्त्यबलदर्पहा । सर्वलक्ष्मीप्रदः श्रीमानङ्गदप्रियवर्धनः ॥ ॥ स्मृतिबीजं सुरेशानः संसारभयनाशनः ।
    उत्तमः श्रीपरीवारः श्रीभूरुग्रश्च कामधुक् ॥ ॥ सदागतिर्मातरिश्वा रामपादाब्जषट्पदः । नीलप्रियो नीलवर्णो
    नीलवर्णप्रियः सुहृत् ॥ ॥ रामदूतो लोकबन्धुरन्तरात्मा मनोरमः । श्रीरामध्यानकृद्वीरः सदा किम्पुरुषस्तुतः
    ॥ ॥ रामकार्यान्तरङ्गश्च शुद्धिर्गतिरनामयः । पुण्यश्लोकः परानन्दः परेशप्रियसारथिः ॥ ॥ लोकस्वामी मुक्तिदाता
    सर्वकारणकारणः । महाबलो महावीरः पारावारगतिर्गुरुः ॥ ॥ तारको भगवांस्त्राता स्वस्तिदाता सुमङ्गलः । समस्तलोकसाक्षी
    च समस्तसुरवन्दितः । सीतासमेतश्रीरामपादसेवाधुरन्धरः ॥ ॥ इदं नामसहस्रं तु योऽधीते प्रत्यहं नरः । दुःखौघो
    नश्यते क्षिप्रं सम्पत्तिर्वर्धते चिरम् । वश्यं चतुर्विधं तस्य भवत्येव न संशयः ॥ ॥ राजानो राजपुत्राश्च
    राजकीयाश्च मन्त्रिणः । त्रिकालं पठनादस्य दृश्यन्ते च त्रिपक्षतः ॥ ॥ अश्वत्थमूले जपतां नास्ति वैरिकृतं
    भयम् । त्रिकालपठनादस्य सिद्धिः स्यात् करसंस्थिता ॥ ॥ ब्राह्मे मुहूर्ते चोत्थाय प्रत्यहं यः पठेन्नरः
    । ऐहिकामुष्मिकान् सोऽपि लभते नात्र संशयः ॥ ॥ सङ्ग्रामे सन्निविष्टानां वैरिविद्रावणं भवेत् । ज्वरापस्मारशमनं
    गुल्मादिव्याधिवारणम् ॥ ॥ साम्राज्यसुखसम्पत्तिदायकं जपतां नृणाम् । य इदं पठते नित्यं पाठयेद्वा समाहितः
    । सर्वान् कामानवाप्नोति वायुपुत्रप्रसादतः ॥ ॥ इति श्रीआञ्जनेय सहस्रनाम स्तोत्रम् ।
