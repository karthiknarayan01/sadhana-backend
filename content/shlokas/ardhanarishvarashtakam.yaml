id: ardhanarishvarashtakam
category: stotram
name:
  english: ardhanarishvarashtakam
  devanagari: अर्धनारीश्वराष्टकम्
content:
  english: ambhodharashyamalakuntalayai tatitprabhatamrajatadharaya | nirishvarayai nikhileshvaraya namah
    shivayai ca namah shivaya || 1|| pradiptaratnojvalakundalayai sphuranmahapannagabhushanaya | shivapriyayai
    ca shivapriyaya namah shivayai ca namah shivaya || 2|| mandaramalakalitalakayai kapalamalankitakandharayai
    | divyambarayai ca digambaraya namah shivayai ca namah shivaya || 3|| kasturikakunkumalepanayai shmashanabhasmattavilepanaya
    | kritasmarayai vikritasmaraya namah shivayai ca namah shivaya || 4|| padaravindarpitahamsakayai padabjarajatphaninupuraya
    | kalamayayai vikalamayaya namah shivayai ca namah shivaya || 5|| prapancasrishtyunmukhalasyakayai
    samastasamharakatandavaya | samekshanayai vishamekshanaya namah shivayai ca namah shivaya || 6|| praphullanilotpalalocanayai
    vikasapankeruhalocanaya | jagajjananyai jagadekapitre namah shivayai ca namah shivaya || 7|| antarbahishcordhvamadhashca
    madhye purashca pashcacca vidikshu dikshu | sarvam gatayai sakalam gataya namah shivayai ca namah
    shivaya || 8|| ardhanarishvarastotram upamanyukritam tvidam | yah pathecchrinuyadvapi shivaloke mahiyate
    || 9|| || iti upamanyukritam ardhanarishvarashtakam ||
  devanagari: अंभोधरश्यामलकुन्तलायै तटित्प्रभाताम्रजटाधराय । निरीश्वरायै निखिलेश्वराय नमः शिवायै च नमः
    शिवाय ।। १।। प्रदीप्तरत्नोज्वलकुण्डलायै स्फुरन्महापन्नगभूषणाय । शिवप्रियायै च शिवप्रियाय नमः शिवायै
    च नमः शिवाय ।। २।। मन्दारमालाकलितालकायै कपालमालाङ्कितकन्धरायै । दिव्याम्बरायै च दिगम्बराय नमः शिवायै
    च नमः शिवाय ।। ३।। कस्तूरिकाकुङ्कुमलेपनायै श्मशानभस्मात्तविलेपनाय । कृतस्मरायै विकृतस्मराय नमः शिवायै
    च नमः शिवाय ।। ४।। पादारविन्दार्पितहंसकायै पादाब्जराजत्फणिनूपुराय । कलामयायै विकलामयाय नमः शिवायै
    च नमः शिवाय ।। ५।। प्रपञ्चसृष्ट्युन्मुखलास्यकायै समस्तसंहारकताण्डवाय । समेक्षणायै विषमेक्षणाय नमः
    शिवायै च नमः शिवाय ।। ६।। प्रफुल्लनीलोत्पललोचनायै विकासपङ्केरुहलोचनाय । जगज्जनन्यै जगदेकपित्रे नमः
    शिवायै च नमः शिवाय ।। ७।। अन्तर्बहिश्चोर्ध्वमधश्च मध्ये पुरश्च पश्चाच्च विदिक्षु दिक्षु । सर्वं गतायै
    सकलं गताय नमः शिवायै च नमः शिवाय ।। ८।। अर्धनारीश्वरस्तोत्रं उपमन्युकृतं त्विदम् । यः पठेच्छृणुयाद्वापि
    शिवलोके महीयते ।। ९।। ।। इति उपमन्युकृतं अर्धनारीश्वराष्टकम् ।।
