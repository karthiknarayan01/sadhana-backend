id: mahanarayanopanishatsasvara
category: upanishad
name:
  english: mahanarayanopanishatsasvara
  devanagari: महानारायणोपनिषत्सस्वरा
content:
  english: hri̱de | sarvo̱hyḙsha ru̱drastasmai̭ ru̱draya̱ namo̭ astu || 1|| shadvimsho'nuvakah | yasya̱
    vaika̭nkatyagnihotra̱hava̭ni bhavati̱ pratye̱vasyahṷtayastishtha̱tyatho̱ prati̭shthityai || 1|| saptavimsho'nuvakah
    | kri̱nu̱shva paja̱ iti̱ panca̭ | kri̱nu̱shva paja̱h prasi̭tim na pri̱thvim ya̱hi raje̱vama̭va̱~ ibhḙna
    | tri̱shvimanu̱ prasi̭tim druna̱no'sta̭si̱ vidhya̭ ra̱kshasa̱stapi̭shthaih || 1|| tava̭ bhra̱masa̭
    ashu̱ya pa̭ta̱ntyanṷ sprisha dhrisha̱ta shoshṷcanah | tapṷmshyagne ju̱hva̭ pata̱nganasa̭ndito̱
    vi sri̭ja̱ vishva̭gu̱lkah || 2|| prati̱ spasho̱ visri̭ja̱ turni̭tamo̱ bhava̭ pa̱yurvi̱sho a̱sya ada̭bdhah
    | yo no̭ du̱re a̱ghasha̭m so̱ yo antyagne̱ maki̭shte̱ vyathi̱rada̭dharshit || 3|| uda̭gne tishtha̱
    pratya ta̭nushva̱ nya̭mitra̭~ oshatattigmahete | yo no̱ ara̭tim samidhana ca̱kre ni̱catam dha̭kshyata̱sam
    na shushka̭m || 4|| u̱rdhvo bha̭va̱ prati̭m vi̱dyadhya̱smada̱vishkri̭nushva̱ daivya̭nyagne | ava̭sthi̱ra
    ta̭nuhi yatu̱juna̭m ja̱mimaja̭mim pramri̭nihi̱ shatrṷn || 5|| ashtavimsho'nuvakah | adi̭tirde̱va
    ga̭ndha̱rva ma̭nu̱shya̱h pi̱taro'sṷra̱stesha
  devanagari: हृ॒दे । सर्वो॒ह्ये॑ष रु॒द्रस्तस्मै॑ रु॒द्राय॒ नमो॑ अस्तु ॥ १॥ षड्विंशोऽनुवाकः । यस्य॒ वैक॑ङ्कत्यग्निहोत्र॒हव॑णी
    भवति॒ प्रत्ये॒वास्याहु॑तयस्तिष्ठ॒त्यथो॒ प्रति॑ष्ठित्यै ॥ १॥ सप्तविंशोऽनुवाकः । कृ॒णु॒ष्व पाज॒ इति॒
    पञ्च॑ । कृ॒णु॒ष्व पाजः॒ प्रसि॑तिं न पृ॒थ्वीं या॒हि राजे॒वाम॑वाँ॒ इभे॑न । तृ॒ष्वीमनु॒ प्रसि॑तिं द्रूणा॒नोऽस्ता॑सि॒
    विध्य॑ र॒क्षस॒स्तपि॑ष्ठैः ॥ १॥ तव॑ भ्र॒मास॑ आशु॒या प॑त॒न्त्यनु॑ स्पृश धृष॒ता शोशु॑चानः । तपूं॑ष्यग्ने
    जु॒ह्वा॑ पत॒ङ्गानस॑न्दितो॒ वि सृ॑ज॒ विश्व॑गु॒ल्काः ॥ २॥ प्रति॒ स्पशो॒ विसृ॑ज॒ तूर्णि॑तमो॒ भवा॑ पा॒युर्वि॒शो
    अ॒स्या अद॑ब्धः । यो नो॑ दू॒रे अ॒घशं॑ सो॒ यो अन्त्यग्ने॒ माकि॑ष्टे॒ व्यथि॒राद॑धर्षीत् ॥ ३॥ उद॑ग्ने
    तिष्ठ॒ प्रत्या त॑नुष्व॒ न्य॑मित्राँ॑ ओषतात्तिग्महेते । यो नो॒ अरा॑तिं समिधान च॒क्रे नी॒चातं ध॑क्ष्यत॒सं
    न शुष्क॑म् ॥ ४॥ ऊ॒र्ध्वो भ॑व॒ प्रतिं॑ वि॒द्याध्य॒स्मदा॒विष्कृ॑णुष्व॒ दैव्या॑न्यग्ने । अव॑स्थि॒रा त॑नुहि
    यातु॒जूनां॑ जा॒मिमजा॑मिं प्रमृ॑णीहि॒ शत्रू॑न् ॥ ५॥ अष्टाविंशोऽनुवाकः । अदि॑तिर्दे॒वा ग॑न्ध॒र्वा म॑नु॒ष्याः॒
    पि॒तरोऽसु॑रा॒स्तेषा
meaning: {}
