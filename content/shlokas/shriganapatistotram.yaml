id: shriganapatistotram
category: stotram
name:
  english: shriganapatistotram
  devanagari: श्रीगणपतिस्तोत्रम्
content:
  english: bjasambhavah sakalanjetumaho manobhavah||4|| mahishasuranigrahe shiva bhavamuktyai munayo dhutashivah||
    yamapujayadishtasiddhaye varado me bhava ceshtasiddhaye||5|| gajakarnaka mushakasthite varade tvayyabhaye
    hridi sthite|| jayalabharameshtasampadah khalu sarvatra kuto vadapadah||6|| samkalpitam karyamavighnamisha
    draksiddhimayatu mamakhilesha|| papatrayam me hara sanmatisha tapatrayam me hara shamtyadhisha||7||
    ganadhisho dhisho hariharavidhisho
  devanagari: ब्जसंभवः सकलान्जेतुमहो मनोभवः।।४।। महिषासुरनिग्रहे शिवा भवमुक्त्यै मुनयो धुताशिवाः।। यमपूजयदिष्टसिद्धये
    वरदो मे भव चेष्टसिद्धये।।५।। गजकर्णक मूषकस्थिते वरदे त्वय्यभये हृदि स्थिते।। जयलाभरमेष्टसंपदाः खलु
    सर्वत्र कुतो वदापदाः।।६।। संकल्पितं कार्यमविघ्नमीश द्राक्सिद्धिमायातु ममाखिलेश।। पापत्रयं मे हर सन्मतीश
    तापत्रयं मे हर शांत्यधीश।।७।। गणाधीशो धीशो हरिहरविधीशो
meaning: {}
