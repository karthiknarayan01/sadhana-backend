id: candrakritam2shivastotram
category: stotram
name:
  english: candrakritam2shivastotram
  devanagari: चन्द्रकृतं२शिवस्तोत्रम्
content:
  english: candrakritam 2 shivastotram candra uvaca | nasti sharvasamo devo nasti sharvasama gatih | nasti
    sharvasamo devo nasti sharvasama gatih || 1|| yam pathanti sada sankhyashcitayanti ca yoginah | param
    pradhanam purusham tasmai jneyatmane namah || 2|| utpattau ca vinashe ca karanam yam vidurbudhah |
    devasuramanushyanam tasmai jnanatmane namah || 3|| yamavyayamanadyantam yam nityam shashvatam dhruvam
    | nishkalam paramam brahma tasmai yogatmane namah || 4|| yah pavitram pavitranamadidevo maheshvarah
    | punati darshanadeva tasmai tirthatmane namah || 5|| yatah pravarttate sarvam yasminsarvam viliyate
    | palayedyo jagatsarvam tasmai sarvatmane namah || 6|| anishtomadibhiryajnairyam yajanti dvijatayah
    | sampurnadakshinaireva tasmai yajnatmane namah || 7|| iti shriskandapurane prabhasakhande prabhasakshetramahatmye
    caturvimshadhyayantargatam candrakritam shivastotram samaptam | skandapurana | prabhasakhanda | adhyaya
    24
  devanagari: चन्द्रकृतं २ शिवस्तोत्रम् चन्द्र उवाच । नास्ति शर्वसमो देवो नास्ति शर्वसमा गतिः । नास्ति
    शर्वसमो देवो नास्ति शर्वसमा गतिः ॥ १॥ यं पठन्ति सदा साङ्ख्याश्चितयन्ति च योगिनः । परं प्रधानं पुरुषं
    तस्मै ज्ञेयात्मने नमः ॥ २॥ उत्पत्तौ च विनाशे च कारणं यं विदुर्बुधाः । देवासुरमनुष्याणां तस्मै ज्ञानात्मने
    नमः ॥ ३॥ यमव्ययमनाद्यन्तं यं नित्यं शाश्वतं ध्रुवम् । निष्कलं परमं ब्रह्म तस्मै योगात्मने नमः ॥ ४॥
    यः पवित्रं पवित्राणामादिदेवो महेश्वरः । पुनाति दर्शनादेव तस्मै तीर्थात्मने नमः ॥ ५॥ यतः प्रवर्त्तते
    सर्वं यस्मिन्सर्वं विलीयते । पालयेद्यो जगत्सर्वं तस्मै सर्वात्मने नमः ॥ ६॥ अनिष्टोमादिभिर्यज्ञैर्यं
    यजन्ति द्विजातयः । सम्पूर्णदक्षिणैरेव तस्मै यज्ञात्मने नमः ॥ ७॥ इति श्रीस्कन्दपुराणे प्रभासखण्डे प्रभासक्षेत्रमाहात्म्ये
    चतुर्विंशाध्यायान्तर्गतं चन्द्रकृतं शिवस्तोत्रं समाप्तम् । स्कन्दपुराण । प्रभासखण्ड । अध्याय २४
