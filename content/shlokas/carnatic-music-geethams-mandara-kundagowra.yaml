name:
  english: Carnatic Music Geethams - Mandara (Kundagowra)
content:
  english: mayamalava gaula janyaraga catusra jati rupaka talam angah kannada sahityam pallavi mandara
    kusumakara makarandam vasituva caranam kundagaura gòvrivara mandiraya manamakuta hemakuta simhasana
    virupaksha karunakara candamama mandakini mandiraya manamakuta da pa | ma ga ri sa || ri ma | pa da
    ma pa || kum da | gau da pa || da pa | ma ga ri sa || mam di | ra | na ma ku ta || pallavi sa || da
    pa | ma ga ri sa || mam ga ri || sa ri | ga ri sa da pa | ma ga ri sa || ri ma | pa da ma pa || he
    da pa || da pa | ma ga ri sa || vi ru | pa da pa | ma ga ri sa || ri ma | pa da ma pa || cam da |
    ma da pa || da pa | ma ga ri sa || mam di | ra
  devanagari: मायामालव गौल जन्यराग चतुस्र जाति रूपक तालम् अङ्गाः कन्नड साहित्यम् पल्लवि मन्दर कुसुमाकर
    मकरन्दं वासितुवा चरणं कुन्दगौर गॊव्रिवर मन्दिराय मानमकुट हेमकूट सिंहासन विरूपाक्श करुणाकर चन्दमाम
    मन्दाकिनि मन्दिराय मानमकुट द प । म ग रि स ॥ रि म । प द म प ॥ कुं द । गौ द प ॥ द प । म ग रि स ॥ मं
    दि । रा । न म कु ट ॥ पल्लवि स ॥ द प । म ग रि स ॥ मं ग रि ॥ स रि । ग रि स द प । म ग रि स ॥ रि म । प
    द म प ॥ हे द प ॥ द प । म ग रि स ॥ वि रू । पा द प । म ग रि स ॥ रि म । प द म प ॥ चं ड । मा द प ॥ द प
    । म ग रि स ॥ मं डि । रा
