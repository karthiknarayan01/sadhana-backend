id: sabharanjanashatakam
category: shataka
name:
  english: sabharanjanashatakam
  devanagari: सभारन्जनशतकम्
content:
  english: sabharanjanashatakam || shrih || shaddarshaniparijnanamanditairiva panditaih | stambhaishcitrairvitanaishca
    sabha kimavabhasate || 1|| santi sarvavidha martya na santyeke vipashcitah | asuryeneva lokena kim
    tena vishayena nah || 2|| udyantu shatamaditya udyantu shatamindavah | na vina vidusham vakyairnashyatyabhyantaram
    tamah || 3|| bahubhyo bahu boddhavyam bahudha bahuvasaran | bahukalpashatasthayi labdham bahuvidham
    yashah || 4|| pashanah sarva evaite padmarageshu ko gunah | prakashah kashcidatraste paratra sa na
    vidyate || 5|| jatyandha jatibadhira jatimukashca te janah | samyagaradhita yairna santo vijnanasindhavah
    || 6|| api manushyakam labdhva bhavanti jnanino na ye | pashutaiva varam tesham pratyavayapravartanat
    || 7|| kim paroksham kimadhyaksham kim labhyam kim nu durlabham | sarvamaindriyikam vastu sarve karagatam
    satam || 8|| sthavara jangama martya brahmana munayah surah | shiva ityapyami bhedashcidutkarshanibandhanah
    || 9|| vidyujjaladharo vrishtishcandrarkau sagara iti | sarvamadbhutamajnanam janatam tu na kincana
    || 10|| tatra tatra sthitairjnanakaranairiva vigrahah | vidvadbhih shobhate deshastairvihinastvamangalah
    || 11|| amalimasamacchidramakeyamatisundaram | adeyamapratigrahyamaho jnanam mahadhanam || 12|| sandarbhashaktihinanam
    shabdabhyaso vrithashramah mugdhani labdhva pushpani munditah kim karishyati || 13|| shastreshu durgraho'pyarthah
    svadate kavisuktishu | drishyam karagatam ratnam darunam phanimurdhani || 14|| anjasyam vyavaharanamarjavam
    paramam dhiyam | svatantryamapi tantreshu sute kavyaparishramah || 15|| sahityavidyahinanam sarvashastravidamapi
    | samajam paripashyanti samajam buddhishalinah || 16|| ashikshitanam kavyeshu shastrabhyaso nirarthakah
    | kimastyanupanitasya vajapeyadibhirmakhaih || 17|| andha vidvajja nairhina muka kavibhirujjhita |
    badhira garakairhina sabha bhavati bhubhritam || 18|| sahityadapi shastrani vishishtaniti cenmatih
    | tato'pi vedadhyayanam tato'pi shivakirtanam || 19|| santvashvah santu matangah santu yodhah sahasrashah
    | narendranam visheshena na vina kavina yashah || 20|| kanah kamalapatrakshah kadaryah kalpashakhinah
    | katara vikramadityah kavidriggocaram gatah || 21|| paradeshyam vrithadasyam pancanamekadarata |
    pandavanamabhutkirtyai parasharyakavergira || 22|| janate yanna candrarko janate yanna yoginah | janite
    yanna bhargo'pi tajjanati kavih svayam || 23|| sarvasamapi vidyanam sahityam hi kaveh padam | sadharanye'pi
    yatraiva sarasvatapadam dhruvam || 24|| nadatavyam na datavyam na kartavyam ca kincana | santvamekam
    prayoktavyam sarve tasya vashe jagat || 25|| namarupatmakam vishvam drishyate yadidam dvidha | tatradyasya
    kavirvedha dvitiyasya caturmukhah || 26|| agnishtome kimukthye kim kimajye kim rathantare | stutirityeva
    hrishyanti sarvajna api devatah || 27|| na jatirupakarmani drishyante mridubhashini | pakshino malinastatra
    parapushta nidarshanam || 28|| arthahino'pi madhurah shabdo lokapriyankarah | vinavenumridangadinyatrodaharanani
    nah || 29|| jighamsanto'pi pashavo rudanto'pi stanandhayah | ghnanto'pi ripavo yuddhe vashamayanti
    santvatah || 30|| datuh pratigrahitushca yau hastavuttaradharau | tayorapyauttaradharye tabhyamevopapadyate
    || 31|| amartyah santu martya va cetanah santvacetanah | danameva puraskritya stuyante bhuvanaistribhih
    || 32|| deyadravyamiyatta va danotkarshe na karanam | kim tvavacchedarahityam dhanadambudayoriva ||
    33|| dadatiradadatishca dvavetau paramadbhutau | yayoh svasyam ca dasyam ca lilamatravijrimbhitam
    || dosha api gunayante dataram samupashritah | kalimanam kilalambya kalamegha iti stutih || 35|| kim
    daturakhilairdoshaih kim lubdhasyakhilairgunaih | na lobhadadhiko dosho na danadadhiko gunah || 36||
    arthah sadharana eva viyujyante svabhavatah | mamatam tyajatam teshu mahadutpadyate yashah || 37||
    mrito'pyarthe na mokshyami baddhva neshyami murdhani | iti cetsudridho lobhah patre deyamashankitam
    || 38|| shashtirdeshantare labhya shatam dattvatra naigame patre tvekamihotsrijya paratranantamapyate
    || 39|| ko datte ka ivadatte svadrishtam svena bhujyate | dhibhedamatre datritve klishyante kripanah
    kiyat || 40|| svatantryam yadi coreshu bhoktritvam yadi bandhushu | nishkarshe tu bhramah svamyam
    tattyaktva labhyatam yashah || na dhairyena vina lakshmirna shauryena vina jayah | na jnanena vina
    moksho na danena vina yashah || 42|| svakiyanbhunjate matsyah svapatyani phanadharah || balabalavyavastheyam
    balinastvakutobhayah || 43|| gurum hatva divam yati trinam chittva patatyadhah | balinam durbalanam
    ca shrutayo'pi dvidha sthitah || 44|| balino balinah snihyantyabalam tu nigrihnate | davam dipayate
    cando dipam vyahanti marutah || 45|| badhaka api lokanam balino bibhyati svayam | sarva balavatam
    pathyam bhishagbhirabhidhiyate || 46|| shubhaprarabdhalabdhapi lakshmih shauryavivarjita | shokena
    dahyamanaste shande kulavadhuriva || 47|| sarvatra lalyate shuro bhiruh sarvatra hanyate | pacyante
    kevala meshah pujyante yuddhadurmadah || 48|| bharyayah sundarah snigdho veshyayah sundaro dhani |
    shridevyah sundarah shuro bharatyah sundarah sudhih || 49|| na shaurye shauryamityeva stuyate buddhishalibhih
    | kim tu nitya samashlishtam vagmitvamiva medhaya || 50|| shauryena lokasevyatvam shauryena kshitipalata
    | shauryena labhyah svargo'pi shauryam kasya na sadhanam || 51|| samareshu narendranam savaneshu dvijanmanam
    | pratikarmasu narinam shauryam bhavati bhushanam || 52|| shaurye tulye katham vrittam svami dasa
    iti dvidha | anvayavyatirekabhyam nitirityavadharyatam || 53|| na jayaya svatah shauryam kim tu nityopabrimhitam
    || prayuktam hi jayatyatram prayoktra na svatah kvacit || 54|| idameva param shauryamupayaistribhiranvitam
    | idameva param mauryamupayaistribhirujjhitam || 55|| parakramante yuddheshu samamevobhaye bhatah
    | vijayante'pyupayajna vijiyante tadujjhitah || 56|| kim shastrairbahudhabhyastaih kim caturyena kim
    dhiya | kim shauryenanivaryena lalate cenna likhyate || 57|| ghatamanah kutumbeshu dadatiti vipashcitah
    | mudheshu ramate lakshmiraho dishtasya ceshtitam || 58|| tulyam karshanti prithivim tulyam shastranyadhiyate
    | unmajjanti nimajjanti devasyaikasya ceshtaya || 59|| lubhyanti vitaranto'pi kupyanti sarala api
    | muhyanti matimanto'pi bhokturbhagyaviparyayat || 60|| adhiyate vijananti virajyanti muhurmuhuh |
    natyantaya nivartante nara vaishamyato vidheh || 61|| dohadairalavalaishca kiyadvrikshanupasmahe |
    te tu kalam pratikshante phalapushpasamagame || 62|| kah prasute purovatam kah prerayati varidam |
    prapte tu shravane masi bhavatyekarnavam jagat || 63|| kalah karoti karyani kala eva vihanti ca |
    karomiti vihanmiti murkho muhyati kevalam || 64|| api kalasya yah kalah so'pi kalamapekshate | kartum
    jaganti hartum va kalastena jagatprabhuh || 65|| kalah sadagatirapi sthayiva pariceshtate | candamarutavadvishvamadharottarayankshanat
    || 66|| kalashcalayati prayah panditanpamaranapi | tam cencikirshasi vashe titikshaiva mahaushadham
    || 67|| randhreshu praharishyantah kati kamadayo'rayah | kshanannashyati loko'yam kshama cenna niyacchati
    || 68|| apakaraparanamapyupakurvanti sadhavah | chindantamapi vrikshah svacchayaya kim na rakshati
    || 69|| sravatyeva sada jnanam sravatyeva sada tapah | chidram chidramanuprapya na cecchadayati kshama
    || 70|| kshamam rakshanti ye yatnatakshamam rakshanti te ciram | kshamaste nibhrita yeshu kshamaste
    sarvakarmasu || 71|| murkhah shamayitum duhkham samrabhante tatastatah | kshamayaiva nigrihnanti dhirah
    samrambhavarjitah || 72|| a kalyada nishithanca kukshyartham vyapriyamahe | na ca nirvrinumo jatu
    shantastu sukhamasate || 73|| nayasyanti sharirani na dainyamavabudhyate | sambhavatyapi canandah
    shantimabhyasyatam satam || 74|| prasidatyaparispandi payah kalushitam yatha | tatha shantamapi svantam
    prasidati shanaih shanaih || 75|| yatnena mahata labhya dasa dvitrah sukhaya nah | shantasya kaladrishtadyah
    shatam bhritya avetanah || 76|| api mridvatha gira labhyah sada jagartyatandritah | nasti dharmasamo
    bhrityah kinciduktastu dhavati || 77|| arthenoparjyate dharmo dharmenartha upayate | anyonyashrayanam
    hyetadubhayotpattisadhanam || 78|| vipanih punyatirthani vikretarastvakincanah | trinenapyantato dharmah
    parvasu kriyate mahan || 79|| culukodakamatrena dhanyamushtivyayena ca | marubhumishu durbhikshe dharmasasyam
    mahaphalam || 80|| dharmo narmasakhah kame gurustattvopadeshane | bhatah sangararangeshu sacivo'rthasamarjane
    || 81|| bhuvi vriksha divi cchaya bhuvi kupo jalam divi | bhuvi yadgrihyate viprairdivi taddiyate
    suraih || 82|| kadalikandavaddharmo na rohati bahirgatah | chaditastu phalam caru sute panasamulavat
    || 83|| duhkhenoparjyate dharmah sukhena tu vinashyati | kricchralabdhamamum tratum necchanti munayah
    sukham || 84|| sampadyatam va yatnena yadva vikriyatamayam | sarvada bhujyatam vanyairdharmo bhavati
    nanyatha || 85|| arthavantah prashasyante nindyante tadvinakritah | agameshvapi cedevamadbhutam kim
    sharirishu || 86|| artho'pyarthena cetsadhyah ka varta dharmakamayoh | arthah sarvajaganmulamanartho'rthaviparyayah
    || 87|| karma jnanam ca mokshaya karmanyartho'dhikarita | ato'rthenaiva kaivalyam na kaivalyena labhyate
    || 88|| kathamartham nishedhantu shrutayah smritayo'pi va | yasamekam padamapi na calatyarthato vina
    || 89|| lakshmisha iti govindo merudhanveti shankarah | hiranyagarbha ityeva brahmapi bahumanyate
    || 10|| urdhvam gacchanti yam tyaktva yam grihitva patantyadhah | tasya gauravamarthasya tavataivanumiyatam
    || 91|| grihina yadi labhyeta grihini hridayangama | samsara iti ko bharastam saramanupashyatah ||
    92|| ahatya cinumah svargamapavargamapi kramat | anukule hi dampatye pratikule na kincana || 93||
    grihinivrittadoshena gautamo'tyantatapitah | atasthe duhkhavidhvamsam kaivalyam paramam munih || 94||
    api yatparamam tattvamardhendukritashekharam | tasyapi tavananandah kimasmajjananim vina || 95|| nindanti
    ca prashamsanti nigama yadgrihashramam | dampatyasamyavaishamyabhedadetadvayavasthitih || 96|| indriyanyanupakleshya
    labhyam shreyo grihashrame | atasturyashramam prahurabadhanyayabadhitam || 97|| bhujyate yatsukham
    dhirairapramattairgrihashrame | svargastasyangasampurtirapavargo'sya nityata || 98|| drishtadoshe'pi
    garhasthye duradarshitaya svayam | garhasthyameva paramam mene naiyayiko munih || 99|| uccavacam jagaddauhsthyamekadaiva
    nishedhati | pravishtamatro nripatih prapancamiva na shrutih || 10|| na rajanam vina rajyam balavatsvapi
    mantrishu | praneshvasatsu kim dehashcandavatena dharyate || 101|| matuh kincitpituh kincidacaryatkicidapyate
    | samyagvinitacchastreshu sarvam rajnastu labhyate || 102|| calanti sarvamaryadashcalite sati parthive
    | parvata api kampante prasakte kampane bhuvah || 103|| patnya mangalyayogena patyurayuh pravardhate
    | prakritinam tu bhagyena parthivah sukhamedhate || 104|| nirmitam shatakam sagram nilakanthena yajvana
    | sabharanjanametena sadhayantu manishinah || 105|| iti shrinilakanthadikshitaviracitam sabharanjanashatakam
    sampurnam ||
  devanagari: सभारञ्जनशतकम् ॥ श्रीः ॥ षड्दर्शनीपरिज्ञानमण्डितैरिव पण्डितैः । स्तम्भैश्चित्रैर्वितानैश्च
    सभा किमवभासते ॥ १॥ सन्ति सर्वविधा मर्त्या न सन्त्येके विपश्चितः । असूर्येणेव लोकेन किं तेन विषयेण
    नः ॥ २॥ उद्यन्तु शतमादित्या उद्यन्तु शतमिन्दवः । न विना विदुषां वाक्यैर्नश्यत्याभ्यन्तरं तमः ॥ ३॥
    बहुभ्यो बहु बोद्धव्यं बहुधा बहुवासरान् । बहुकल्पशतस्थायि लब्धं बहुविधं यशः ॥ ४॥ पाषाणाः सर्व एवैते
    पद्मरागेषु को गुणः । प्रकाशः कश्चिदत्रास्ते परत्र स न विद्यते ॥ ५॥ जात्यन्धा जातिबधिरा जातिमूकाश्च
    ते जनाः । सम्यगाराधिता यैर्न सन्तो विज्ञानसिन्धवः ॥ ६॥ अपि मानुष्यकं लब्ध्वा भवन्ति ज्ञानिनो न ये
    । पशुतैव वरं तेषां प्रत्यवायाप्रवर्तनात् ॥ ७॥ किं परोक्षं किमध्यक्षं किं लभ्यं किं नु दुर्लभम् । सर्वमैन्द्रियिकं
    वस्तु सर्वे करगतं सताम् ॥ ८॥ स्थावरा जङ्गमा मर्त्या ब्राह्मणा मुनयः सुराः । शिव इत्यप्यमी भेदाश्चिदुत्कर्षनिबन्धनाः
    ॥ ९॥ विद्युज्जलधरो वृष्टिश्चन्द्रार्कौ सागरा इति । सर्वमद्भुतमज्ञानां जानतां तु न किञ्चन ॥ १०॥ तत्र
    तत्र स्थितैर्ज्ञानकरणैरिव विग्रहः । विद्वद्भिः शोभते देशस्तैर्विहीनस्त्वमङ्गलः ॥ ११॥ अमलीमसमच्छिद्रमकेयमतिसुन्दरम्
    । अदेयमप्रतिग्राह्यमहो ज्ञानं महाधनम् ॥ १२॥ सन्दर्भशक्तिहीनानां शब्दाभ्यासो वृथाश्रमः मुग्धानि लब्ध्वा
    पुष्पाणि मुण्डितः किं करिष्यति ॥ १३॥ शास्त्रेषु दुर्ग्रहोऽप्यर्थः स्वदते कविसूक्तिषु । दृश्यं करगतं
    रत्नं दारुणं फणिमूर्धनि ॥ १४॥ आञ्जस्यं व्यवहाराणामार्जवं परमं धियाम् । स्वातन्त्र्यमपि तन्त्रेषु सूते
    काव्यपरिश्रमः ॥ १५॥ साहित्यविद्याहीनानां सर्वशास्त्रविदामपि । समाजं परिपश्यन्ति समजं बुद्धिशालिनः
    ॥ १६॥ अशिक्षितानां काव्येषु शास्त्राभ्यासो निरर्थकः । किमस्त्यनुपनीतस्य वाजपेयादिभिर्मखैः ॥ १७॥ अन्धा
    विद्वज्ज नैर्हीना मूका कविभिरुज्झिता । बधिरा गाराकैर्हीना सभा भवति भूभृताम् ॥ १८॥ साहित्यादपि शास्त्राणि
    विशिष्टानीति चेन्मतिः । ततोऽपि वेदाध्ययनं ततोऽपि शिवकीर्तनम् ॥ १९॥ सन्त्वश्वाः सन्तु मातङ्गाः सन्तु
    योधाः सहस्रशः । नरेन्द्राणां विशेषेण न विना कविना यशः ॥ २०॥ काणाः कमलपत्राक्षाः कदर्याः कल्पशाखिनः
    । कातरा विक्रमादित्याः कविदृग्गोचरं गताः ॥ २१॥ पारदेश्यं वृथादास्यं पञ्चानामेकदारता । पाण्डवानामभूत्कीर्त्यै
    पाराशर्यकवेर्गिरा ॥ २२॥ जानाते यन्न चन्द्रार्को जानते यन्न योगिनः । जानीते यन्न भर्गोऽपि तज्जानाति
    कविः स्वयम् ॥ २३॥ सर्वासामपि विद्यानां साहित्यं हि कवेः पदम् । साधारण्येऽपि यत्रैव सारस्वतपदं ध्रुवम्
    ॥ २४॥ नादातव्यं न दातव्यं न कर्तव्यं च किञ्चन । सान्त्वमेकं प्रयोक्तव्यं सर्वे तस्य वशे जगत् ॥ २५॥
    नामरूपात्मकं विश्वं दृश्यते यदिदं द्विधा । तत्राद्यस्य कविर्वेधा द्वितीयस्य चतुर्मुखः ॥ २६॥ अग्निष्टोमे
    किमुक्थ्ये किं किमाज्ये किं रथन्तरे । स्तुतिरित्येव हृष्यन्ति सर्वज्ञा अपि देवताः ॥ २७॥ न जातिरूपकर्माणि
    दृश्यन्ते मृदुभाषिणि । पक्षिणो मलिनास्तत्र परपुष्टा निदर्शनम् ॥ २८॥ अर्थहीनोऽपि मधुरः शब्दो लोकप्रियङ्करः
    । वीणावेणुमृदङ्गादीन्यत्रोदाहरणानि नः ॥ २९॥ जिघांसन्तोऽपि पशवो रुदन्तोऽपि स्तनन्धयाः । घ्नन्तोऽपि
    रिपवो युद्धे वशमायान्ति सान्त्वतः ॥ ३०॥ दातुः प्रतिग्रहीतुश्च यौ हस्तावुत्तराधरौ । तयोरप्यौत्तराधर्ये
    ताभ्यामेवोपपद्यते ॥ ३१॥ अमर्त्याः सन्तु मर्त्या वा चेतनाः सन्त्वचेतनाः । दानमेव पुरस्कृत्य स्तूयन्ते
    भुवनैस्त्रिभिः ॥ ३२॥ देयद्रव्यमियत्ता वा दानोत्कर्षे न कारणम् । किं त्ववच्छेदराहित्यं धनदाम्बुदयोरिव
    ॥ ३३॥ ददातिराददातिश्च द्वावेतौ परमाद्भुतौ । ययोः स्वास्यं च दास्यं च लीलामात्रविजृम्भितम् ॥ दोषा अपि
    गुणायन्ते दातारं समुपाश्रिताः । कालिमानं किलालम्ब्य कालमेघ इति स्तुतिः ॥ ३५॥ किं दातुरखिलैर्दोषैः
    किं लुब्धस्याखिलैर्गुणैः । न लोभादधिको दोषो न दानादधिको गुणः ॥ ३६॥ अर्थाः साधारणा एव वियुज्यन्ते स्वभावतः
    । ममतां त्यजतां तेषु महदुत्पद्यते यशः ॥ ३७॥ मृतोऽप्यर्थे न मोक्ष्यामि बद्ध्वा नेष्यामि मूर्धनि । इति
    चेत्सुदृढो लोभः पात्रे देयमशङ्कितम् ॥ ३८॥ षष्टिर्देशान्तरे लभ्या शतं दत्त्वात्र नैगमे पात्रे त्वेकमिहोत्सृज्य
    परत्रानन्तमाप्यते ॥ ३९॥ को दत्ते क इवादत्ते स्वादृष्टं स्वेन भुज्यते । धीभेदमात्रे दातृत्वे क्लिश्यन्ते
    कृपणाः कियत् ॥ ४०॥ स्वातन्त्र्यं यदि चोरेषु भोक्तृत्वं यदि बन्धुषु । निष्कर्षे तु भ्रमः स्वाम्यं तत्त्यक्त्वा
    लभ्यतां यशः ॥ न धैर्येण विना लक्ष्मीर्न शौर्येण विना जयः । न ज्ञानेन विना मोक्षो न दानेन विना यशः
    ॥ ४२॥ स्वकीयान्भुञ्जते मत्स्याः स्वापत्यानि फणाधराः ॥ बलाबलव्यवस्थेयं बलिनस्त्वकुतोभयाः ॥ ४३॥ गुरुं
    हत्वा दिवं याति तृणं छित्त्वा पतत्यधः । बलिनां दुर्बलानां च श्रुतयोऽपि द्विधा स्थिताः ॥ ४४॥ बलिनो
    बलिनः स्निह्यन्त्यबलं तु निगृह्णते । दावं दीपयते चण्डो दीपं व्याहन्ति मारुतः ॥ ४५॥ बाधका अपि लोकानां
    बलिनो बिभ्यति स्वयम् । सर्व बलवतां पथ्यं भिषग्भिरभिधीयते ॥ ४६॥ शुभप्रारब्धलब्धापि लक्ष्मीः शौर्यविवर्जिता
    । शोकेन दह्यमानास्ते षण्डे कुलवधूरिव ॥ ४७॥ सर्वत्र लाल्यते शूरो भीरुः सर्वत्र हन्यते । पच्यन्ते केवला
    मेषाः पूज्यन्ते युद्धदुर्मदाः ॥ ४८॥ भार्यायाः सुन्दरः स्निग्धो वेश्यायाः सुन्दरो धनी । श्रीदेव्याः
    सुन्दरः शूरो भारत्याः सुन्दरः सुधीः ॥ ४९॥ न शौर्ये शौर्यमित्येव स्तूयते बुद्धिशालिभिः । किं तु नीत्या
    समाश्लिष्टं वाग्मित्वमिव मेधया ॥ ५०॥ शौर्येण लोकसेव्यत्वं शौर्येण क्षितिपालता । शौर्येण लभ्यः स्वर्गोऽपि
    शौर्यं कस्य न साधनम् ॥ ५१॥ समरेषु नरेन्द्राणां सवनेषु द्विजन्मनाम् । प्रतिकर्मसु नारीणां शौर्यं भवति
    भूषणम् ॥ ५२॥ शौर्ये तुल्ये कथं वृत्तं स्वामी दास इति द्विधा । अन्वयव्यतिरेकाभ्यां नीतिरित्यवधार्यताम्
    ॥ ५३॥ न जयाय स्वतः शौर्यं किं तु नित्योपबृंहितम् ॥ प्रयुक्तं हि जयत्यत्रं प्रयोक्त्रा न स्वतः क्वचित्
    ॥ ५४॥ इदमेव परं शौर्यमुपायैस्त्रिभिरन्वितम् । इदमेव परं मौर्यमुपायैस्त्रिभिरुज्झितम् ॥ ५५॥ पराक्रमन्ते
    युद्धेषु सममेवोभये भटाः । विजयन्तेऽप्युपायज्ञा विजीयन्ते तदुज्झिताः ॥ ५६॥ किं शास्त्रैर्बहुधाभ्यस्तैः
    किं चातुर्येण किं धिया । किं शौर्येणानिवार्येण ललाटे चेन्न लिख्यते ॥ ५७॥ घटमानाः कुटुम्बेषु ददतीति
    विपश्चितः । मूढेषु रमते लक्ष्मीरहो दिष्टस्य चेष्टितम् ॥ ५८॥ तुल्यं कर्षन्ति पृथिवीं तुल्यं शास्त्राण्यधीयते
    । उन्मज्जन्ति निमज्जन्ति देवस्यैकस्य चेष्टया ॥ ५९॥ लुभ्यन्ति वितरन्तोऽपि कुप्यन्ति सरला अपि । मुह्यन्ति
    मतिमन्तोऽपि भोक्तुर्भाग्यविपर्ययात् ॥ ६०॥ अधीयते विजानन्ति विरज्यन्ति मुहुर्मुहुः । नात्यन्ताय निवर्तन्ते
    नरा वैषम्यतो विधेः ॥ ६१॥ दोहदैरालवालैश्च कियद्वृक्षानुपास्महे । ते तु कालं प्रतीक्षन्ते फलपुष्पसमागमे
    ॥ ६२॥ कः प्रसूते पुरोवातं कः प्रेरयति वारिदम् । प्राप्ते तु श्रावणे मासि भवत्येकार्णवं जगत् ॥ ६३॥
    कालः करोति कार्याणि काल एव विहन्ति च । करोमीति विहन्मीति मूर्खो मुह्यति केवलम् ॥ ६४॥ अपि कालस्य यः
    कालः सोऽपि कालमपेक्षते । कर्तुं जगन्ति हर्तुं वा कालस्तेन जगत्प्रभुः ॥ ६५॥ कालः सदागतिरपि स्थायीव
    परिचेष्टते । चण्डमारुतवद्विश्वमधरोत्तरयन्क्षणात् ॥ ६६॥ कालश्चालयति प्रायः पण्डितान्पामरानपि । तं चेञ्चिकीर्षसि
    वशे तितिक्षैव महौषधम् ॥ ६७॥ रन्ध्रेषु प्रहरिष्यन्तः कति कामादयोऽरयः । क्षणान्नश्यति लोकोऽयं क्षमा
    चेन्न नियच्छति ॥ ६८॥ अपकारपराणामप्युपकुर्वन्ति साधवः । छिन्दन्तमपि वृक्षः स्वच्छायया किं न रक्षति
    ॥ ६९॥ स्रवत्येव सदा ज्ञानं स्रवत्येव सदा तपः । छिद्रं छिद्रमनुप्राप्य न चेच्छादयति क्षमा ॥ ७०॥ क्षमां
    रक्षन्ति ये यत्नातक्षमां रक्षन्ति ते चिरम् । क्षमास्ते निभृता येषु क्षमास्ते सर्वकर्मसु ॥ ७१॥ मूर्खाः
    शमयितुं दुःखं संरभन्ते ततस्ततः । क्षमयैव निगृह्णन्ति धीराः संरम्भवर्जिताः ॥ ७२॥ आ काल्यादा निशीथाञ्च
    कुक्ष्यर्थं व्याप्रियामहे । न च निर्वृणुमो जातु शान्तास्तु सुखमासते ॥ ७३॥ नायस्यन्ति शरीराणि न दैन्यमवबुध्यते
    । सम्भवत्यपि चानन्दः शान्तिमभ्यस्यतां सताम् ॥ ७४॥ प्रसीदत्यपरिस्पन्दि पयः कलुषितं यथा । तथा शान्तमपि
    स्वान्तं प्रसीदति शनैः शनैः ॥ ७५॥ यत्नेन महता लभ्या दासा द्वित्राः सुखाय नः । शान्तस्य कालादृष्टाद्याः
    शतं भृत्या अवेतनाः ॥ ७६॥ अपि मृद्वथा गिरा लभ्यः सदा जागर्त्यतन्द्रितः । नास्ति धर्मसमो भृत्यः किञ्चिदुक्तस्तु
    धावति ॥ ७७॥ अर्थेनोपार्ज्यते धर्मो धर्मेणार्थ उपायते । अन्योन्याश्रयणं ह्येतदुभयोत्पत्तिसाधनम् ॥ ७८॥
    विपणिः पुण्यतीर्थानि विक्रेतारस्त्वकिञ्चनाः । तृणेनाप्यन्ततो धर्मः पर्वसु क्रीयते महान् ॥ ७९॥ चुलुकोदकमात्रेण
    धान्यमुष्टिव्ययेन च । मरुभूमिषु दुर्भिक्षे धर्मसस्यं महाफलम् ॥ ८०॥ धर्मो नर्मसखः कामे गुरुस्तत्त्वोपदेशने
    । भटः सङ्गररङ्गेषु सचिवोऽर्थसमार्जने ॥ ८१॥ भुवि वृक्षा दिवि च्छाया भुवि कूपो जलं दिवि । भुवि यद्गृह्यते
    विप्रैर्दिवि तद्दीयते सुरैः ॥ ८२॥ कदलीकन्दवद्धर्मो न रोहति बहिर्गतः । छादितस्तु फलं चारु सूते पनसमूलवत्
    ॥ ८३॥ दुःखेनोपार्ज्यते धर्मः सुखेन तु विनश्यति । कृच्छ्रलब्धममुं त्रातुं नेच्छन्ति मुनयः सुखम् ॥ ८४॥
    सम्पाद्यतां वा यत्नेन यद्वा विक्रीयतामयम् । सर्वदा भुज्यतां वान्यैर्धर्मो भवति नान्यथा ॥ ८५॥ अर्थवन्तः
    प्रशस्यन्ते निन्द्यन्ते तद्विनाकृताः । आगमेष्वपि चेदेवमद्भुतं किं शरीरिषु ॥ ८६॥ अर्थोऽप्यर्थेन चेत्साध्यः
    का वार्ता धर्मकामयोः । अर्थः सर्वजगन्मूलमनर्थोऽर्थविपर्ययः ॥ ८७॥ कर्म ज्ञानं च मोक्षाय कर्मण्यर्थोऽधिकारिता
    । अतोऽर्थेनैव कैवल्यं न कैवल्येन लभ्यते ॥ ८८॥ कथमर्थं निषेधन्तु श्रुतयः स्मृतयोऽपि वा । यासामेकं पदमपि
    न चलत्यर्थतो विना ॥ ८९॥ लक्ष्मीश इति गोविन्दो मेरुधन्वेति शङ्करः । हिरण्यगर्भ इत्येव ब्रह्मापि बहुमन्यते
    ॥ १०॥ ऊर्ध्वं गच्छन्ति यं त्यक्त्वा यं गृहीत्वा पतन्त्यधः । तस्य गौरवमर्थस्य तावतैवानुमीयताम् ॥ ९१॥
    गृहिणा यदि लभ्येत गृहिणी हृदयङ्गमा । संसार इति को भारस्तं सारमनुपश्यतः ॥ ९२॥ आहत्य चिनुमः स्वर्गमपवर्गमपि
    क्रमात् । अनुकूले हि दाम्पत्ये प्रतिकूले न किञ्चन ॥ ९३॥ गृहिणीवृत्तदोषेण गौतमोऽत्यन्ततापितः । आतस्थे
    दुःखविध्वंसं कैवल्यं परमं मुनिः ॥ ९४॥ अपि यत्परमं तत्त्वमर्धेन्दुकृतशेखरम् । तस्यापि तावानानन्दः किमस्मज्जननीं
    विना ॥ ९५॥ निन्दन्ति च प्रशंसन्ति निगमा यद्गृहाश्रमम् । दाम्पत्यसाम्यवैषम्यभेदादेतद्वयवस्थितिः ॥ ९६॥
    इन्द्रियाण्यनुपक्लेश्य लभ्यं श्रेयो गृहाश्रमे । अतस्तुर्याश्रमं प्राहुरबाधन्यायबाधितम् ॥ ९७॥ भुज्यते
    यत्सुखं धीरैरप्रमत्तैर्गृहाश्रमे । स्वर्गस्तस्याङ्गसम्पूर्तिरपवर्गोऽस्य नित्यता ॥ ९८॥ दृष्टदोषेऽपि
    गार्हस्थ्ये दूरदर्शितया स्वयम् । गार्हस्थ्यमेव परमं मेने नैयायिको मुनिः ॥ ९९॥ उच्चावचं जगद्दौःस्थ्यमेकदैव
    निषेधति । प्रविष्टमात्रो नृपतिः प्रपञ्चमिव न श्रुतिः ॥ १०॥ न राजानं विना राज्यं बलवत्स्वपि मन्त्रिषु
    । प्राणेष्वसत्सु किं देहश्चण्डवातेन धार्यते ॥ १०१॥ मातुः किञ्चित्पितुः किञ्चिदाचार्यात्किचिदाप्यते
    । सम्यग्विनीताच्छास्त्रेषु सर्वं राज्ञस्तु लभ्यते ॥ १०२॥ चलन्ति सर्वमर्यादाश्चलिते सति पार्थिवे ।
    पर्वता अपि कम्पन्ते प्रसक्ते कम्पने भुवः ॥ १०३॥ पत्न्या माङ्गल्ययोगेन पत्युरायुः प्रवर्धते । प्रकृतीनां
    तु भाग्येन पार्थिवः सुखमेधते ॥ १०४॥ निर्मितं शतकं साग्रं नीलकण्ठेन यज्वना । सभारञ्जनमेतेन साधयन्तु
    मनीषिणः ॥ १०५॥ इति श्रीनीलकण्ठदीक्षितविरचितं सभारञ्जनशतकं सम्पूर्णम् ॥
