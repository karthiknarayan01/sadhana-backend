id: rishidadhiciproktamshivastotram
category: stotram
name:
  english: rishidadhiciproktamshivastotram
  devanagari: ऋषिदधीचिप्रोक्तंशिवस्तोत्रम्
content:
  english: '|| mandarakusumakaravandaru vrindaraka pujita jitamanmatha nandanandikulakulacala | rasatala
    talatala sutala vitaladi nanabhuvana nayaka nayakaratna ratnanapuravilasatpadapankaja || 14'
  devanagari: ॥ मन्दारकुसुमकरवन्दारु वृन्दारक पूजित जितमन्मथ नन्दानन्दिकुलकुलाचल । रसातल तलातल सुतल वितलादि
    नानाभुवन नायक नायकरत्न रत्ननपुरविलसत्पादपङ्कज ॥ १४
meaning: {}
