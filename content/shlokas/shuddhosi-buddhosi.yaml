id: shuddhosi-buddhosi
category: stotram
name:
  english: Shuddhosi Buddhosi
content:
  english: shuddhosi buddhosi niranjano'si samsaramaya parivarjito'si | samsarasvapnam tyaja mohanidram
    madalasollapamuvaca putram || || shuddho'si re tata na te'sti nama kritam hi tatkalpanayadhunaiva
    | pancatmakam deha midam na te'sti naivasya tvam rodishi kasya heto || || na vai bhavan roditi vikshvajanma
    shabdhoyamayadhya mahisha sunum | vikalpyamano vividhairgunaiste gunashca bhautah sakalendiyeshu ||
    || bhutani bhutaih paridurbalani vriddhim samayanti yatheha pumsah | annambupanadibhireva tasmat na
    testi vriddhir na ca testi hanih || || tvam kancuke shiryamane nijosmin tasmin dehe mudhatam ma vrajethah
    | shubhashubhauh karmabhirdehametat mridadibhih kancukaste pinaddhah || || tateti kincit tanayeti
    kincit ambeti kinciddhayiteti kincit | mameti kincinna mameti kincit tvam bhutasangham bahu ma nayethah
    || || sukhani duhkhopashamaya bhogan sukhaya janati vimudhacetah | tanyeva duhkhani punah sukhani
    janati viddhana vimudha cetah || || yanam cittau tatra gatashca deho deho'picanyah purusho nivishthah
    | mamatvamuroya na yatha tathasmin deheti matram bata mudharausha ||
  devanagari: शुद्धोसि बुद्धोसि निरञ्जनोऽसि संसारमाया परिवर्जितोऽसि । संसारस्वप्नं त्यज मोहनिद्रां मदालसोल्लापमुवाच
    पुत्रम् ॥ ॥ शुद्धोऽसि रे तात न तेऽस्ति नाम कृतं हि तत्कल्पनयाधुनैव । पञ्चात्मकं देह मिदं न तेऽस्ति
    नैवास्य त्वं रोदिषि कस्य हेतो ॥ ॥ न वै भवान् रोदिति विक्ष्वजन्मा शब्धोयमायाध्य महीश सूनूम् । विकल्प्यमानो
    विविधैर्गुणैस्ते गुणाश्च भौताः सकलेन्दियेषु ॥ ॥ भूतानि भूतैः परिदुर्बलानि वृद्धिं समायान्ति यथेह पुंसः
    । अन्नाम्बुपानादिभिरेव तस्मात् न तेस्ति वृद्धिर् न च तेस्ति हानिः ॥ ॥ त्वं कञ्चुके शीर्यमाणे निजोस्मिन्
    तस्मिन् देहे मूढतां मा व्रजेथाः । शुभाशुभौः कर्मभिर्देहमेतत् मृदादिभिः कञ्चुकस्ते पिनद्धः ॥ ॥ तातेति
    किञ्चित् तनयेति किञ्चित् अम्बेति किञ्चिद्धयितेति किञ्चित् । ममेति किञ्चिन्न ममेति किञ्चित् त्वं भूतसङ्घं
    बहु म नयेथाः ॥ ॥ सुखानि दुःखोपशमाय भोगान् सुखाय जानाति विमूढचेताः । तान्येव दुःखानि पुनः सुखानि जानाति
    विद्धन विमूढ चेताः ॥ ॥ यानं चित्तौ तत्र गतश्च देहो देहोऽपिचान्यः पुरुषो निविष्ठः । ममत्वमुरोया न यथ
    तथास्मिन् देहेति मात्रं बत मूढरौष ॥
