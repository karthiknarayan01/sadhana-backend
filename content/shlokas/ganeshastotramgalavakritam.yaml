id: ganeshastotramgalavakritam
category: stotram
name:
  english: ganeshastotramgalavakritam
  devanagari: गणेशस्तोत्रम्गालवकृतं
content:
  english: galavakritam shriganeshastotram || shriganeshaya namah || galava uvaca | ameyamayamayarupadharine
    mayavihinaya paratparatmane | yogaya yogesha suyogadayine vighneshvarayaiva namo namah priya || 10||
    acintyarupadharaya vighneshaya namo namah | simhagaya caturbahudharakaya surupine || 11|| svanandanagarasthayin
    sada svanandarupine | anantavibhavayaiva herambaya namo namah || 12|| lambodaraya devaya devadevesharupine
    | asuranam nihantre ca asuraya namo namah || 13|| siddhibuddhivilasasya karine brahmarupine | brahmakarasharirayaikadantaya
    namo namah || 14|| sagunaya namastubhyam nirgunaya gunatmane | sada shantipradatre te dhumravarnaya
    te namah || 15|| pashankushadharayaikadantabhayapradharine | nabhisheshaya sarvadau pujyaya te namo
    namah || 16|| kim staumi tvam ganadhyaksha yatra veda visismire | ato namanamatrena prasanno bhava
    vighnapa || 17|| iti galavakritam shriganeshastotram sampurnam ||
  devanagari: गालवकृतं श्रीगणेशस्तोत्रम् ॥ श्रीगणेशाय नमः ॥ गालव उवाच । अमेयमायामयरूपधारिणे मायाविहीनाय
    परात्परात्मने । योगाय योगेश सुयोगदायिने विघ्नेश्वरायैव नमो नमः प्रिय ॥ १०॥ अचिन्त्यरूपधाराय विघ्नेशाय
    नमो नमः । सिंहगाय चतुर्बाहुधारकाय सुरूपिणे ॥ ११॥ स्वानन्दनगरस्थायिन् सदा स्वानन्दरूपिणे । अनन्तविभवायैव
    हेरम्बाय नमो नमः ॥ १२॥ लम्बोदराय देवाय देवदेवेशरूपिणे । असुराणां निहन्त्रे च असुराय नमो नमः ॥ १३॥
    सिद्धिबुद्धिविलासस्य कारिणे ब्रह्मरूपिणे । ब्रह्माकारशरीरायैकदन्ताय नमो नमः ॥ १४॥ सगुणाय नमस्तुभ्यं
    निर्गुणाय गुणात्मने । सदा शान्तिप्रदात्रे ते धूम्रवर्णाय ते नमः ॥ १५॥ पाशाङ्कुशधरायैकदन्ताभयप्रधारिणे
    । नाभिशेषाय सर्वादौ पूज्याय ते नमो नमः ॥ १६॥ किं स्तौमि त्वं गणाध्यक्ष यत्र वेदा विसिस्मिरे । अतो
    नमनमात्रेण प्रसन्नो भव विघ्नप ॥ १७॥ इति गालवकृतं श्रीगणेशस्तोत्रं सम्पूर्णम् ॥
