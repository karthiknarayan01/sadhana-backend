id: annamayya-keerthanas-kim-karishyaami
category: stotram
name:
  english: Annamayya Keerthanas Kim Karishyaami
content:
  english: kim karishyami kim karomi bahula shankasamadhanajadyam vahami || narayanam jagannatham trilokaika
    parayanam bhaktapavanam | durikaromyaham duritadurena sam sarasagaramagnacancalatvena || tiruvenkatacaladhishvaram
    kariraja | varadam sharanagatavatsalam | paramapurusham kripabharanam na bhajami maranabhavadehabhimanam
    vahami||
  devanagari: किं करिष्यामि किं करोमि बहुल शङ्कासमाधानजाड्यं वहामि ॥ नारायाणं जगन्नाथं त्रिलोकैक पारायणं
    भक्तपावनं । दूरीकरोम्यहं दुरितदूरेण सं सारसागरमग्नचञ्चलत्वेन ॥ तिरुवेङ्कटाचलाधीश्वरं करिराज । वरदं
    शरणागतवत्सलं । परमपुरुषं कृपाभरणं न भजामि मरणभवदेहाभिमानं वहामि॥
meaning: {}
