id: sri-krishna-ashtottara-sata-namavali
category: stotram
name:
  english: Sri Krishna Ashtottara Sata Namavali
content:
  english: om krishnaya namah om kamalanathaya namah om vasudevaya namah om sanatanaya namah om vasudevatmajaya
    namah om punyaya namah om lilamanusha vigrahaya namah om shrivatsa kaustubhadharaya namah om yashodavatsalaya
    namah om haraye namah || || om caturbhujatta cakrasigada shankhandyudayudhaya namah om devakinandanaya
    namah om shrishaya namah om nandagopa priyatmajaya namah om yamuna vegasamharine namah om balabhadra
    priyanujaya namah om putana jivitaharaya namah om shakatasura bhanjanaya namah om nandavraja jananandine
    namah om saccidananda vigrahaya namah || || om navanita viliptangaya namah om navanita nataya namah
    om anaghaya namah om navanita navaharaya namah om mucukunda prasadakaya namah om shodashastri sahasreshaya
    namah om tribhangi madhurakritaye namah om shukavaga mritabdhindave namah om govindaya namah om yoginam
    pataye namah || om anantaya namah om denukasura bhanjanaya namah om trinikrita trinavartaya namah
    om yamalarjuna bhanjanaya namah om uttalatalabhetre namah om tamala shyamalakritaye namah om gopagopishvaraya
    namah om yogine namah om kotisurya samaprabhaya namah || || om ilapataye namah om parasmai jyotishe
    namah om yadavendraya namah om yadudvahaya namah om vanamaline namah om pitavasase namah om parijatapaharakaya
    namah om govardhanacaloddhartre namah om gopalaya namah om sarvapalakaya namah || || om ajaya namah
    om niranjanaya namah om kamajanakaya namah om kanjalocanaya namah om madhughne namah om madhuranathaya
    namah om dvarakanayakaya namah om baline namah om vrindavananta sancarine namah om tulasidama bhushanaya
    namah || || om shyamantaka manerhartre namah om naranarayanatmakaya namah om kubjakrishnambaradharaya
    namah om mayine namah om paramapurushaya namah om mushtikasura canura mallayuddha visharadaya namah
    om samsaravairine namah om kamsaraye namah om muraraye namah om narakantakaya namah || || om anadi
    brahmacarine namah om krishnavyasana karshakaya namah om shishupala shirashchetre namah om duryodhana
    kulantakaya namah om vidurakrura varadaya namah om vishvarupa pradarshakaya namah om satyavace namah
    om satya sankalpaya namah om satyabhamarataya namah om jayine namah || || om subhadra purvajaya namah
    om jishnave namah om bhishmamukti pradayakaya namah om jagadgurave namah om jagannathaya namah om
    venunada visharadaya namah om vrishabhasura vidhvamsine namah om banasura karantakaya namah om yudhishthira
    pratishthatre namah om barhibarhavatamsakaya namah || || om parthasarathaye namah om avyaktaya namah
    om gitamrita mahodadhaye namah om kaliya phanimanikya ranjita shripadambujaya namah om damodaraya
    namah om yajnnabhokrte namah om danavendra vinashakaya namah om narayanaya namah om parasmai brahmane
    namah om pannagashana vahanaya namah || || om jalakridasamasakta gopivastrapaharakaya namah om punyashlokaya
    namah om tirthapadaya namah om vedavedyaya namah om dayanidhaye namah om sarvatirthatmakaya namah
    om sarvagraharupine namah om paratparaya namah || || iti shri krishnashtottara shatanamavalissamapta
    ||
  devanagari: ॐ कृष्णाय नमः ॐ कमलानाथाय नमः ॐ वासुदेवाय नमः ॐ सनातनाय नमः ॐ वसुदेवात्मजाय नमः ॐ पुण्याय
    नमः ॐ लीलामानुष विग्रहाय नमः ॐ श्रीवत्स कौस्तुभधराय नमः ॐ यशोदावत्सलाय नमः ॐ हरये नमः ॥ ॥ ॐ चतुर्भुजात्त
    चक्रासिगदा शङ्खान्द्युदायुधाय नमः ॐ देवकीनन्दनाय नमः ॐ श्रीशाय नमः ॐ नन्दगोप प्रियात्मजाय नमः ॐ यमुना
    वेगसंहारिणे नमः ॐ बलभद्र प्रियानुजाय नमः ॐ पूतना जीवितहराय नमः ॐ शकटासुर भञ्जनाय नमः ॐ नन्दव्रज जनानन्दिने
    नमः ॐ सच्चिदानन्द विग्रहाय नमः ॥ ॥ ॐ नवनीत विलिप्ताङ्गाय नमः ॐ नवनीत नटाय नमः ॐ अनघाय नमः ॐ नवनीत
    नवाहाराय नमः ॐ मुचुकुन्द प्रसादकाय नमः ॐ षोडशस्त्री सहस्रेशाय नमः ॐ त्रिभङ्गि मधुराकृतये नमः ॐ शुकवाग
    मृताब्धीन्दवे नमः ॐ गोविन्दाय नमः ॐ योगिनां पतये नमः ॥ ॐ अनन्ताय नमः ॐ देनुकासुर भञ्जनाय नमः ॐ तृणीकृत
    तृणावर्ताय नमः ॐ यमलार्जुन भञ्जनाय नमः ॐ उत्तालतालभेत्रे नमः ॐ तमाल श्यामलाकृतये नमः ॐ गोपगोपीश्वराय
    नमः ॐ योगिने नमः ॐ कोटिसूर्य समप्रभाय नमः ॥ ॥ ॐ इलापतये नमः ॐ परस्मै ज्योतिषे नमः ॐ यादवेन्द्राय नमः
    ॐ यदूद्वहाय नमः ॐ वनमालिने नमः ॐ पीतवाससे नमः ॐ पारिजातापहारकाय नमः ॐ गोवर्धनाचलोद्धर्त्रे नमः ॐ गोपालाय
    नमः ॐ सर्वपालकाय नमः ॥ ॥ ॐ अजाय नमः ॐ निरञ्जनाय नमः ॐ कामजनकाय नमः ॐ कञ्जलोचनाय नमः ॐ मधुघ्ने नमः
    ॐ मधुरानाथाय नमः ॐ द्वारकानायकाय नमः ॐ बलिने नमः ॐ वृन्दावनान्त सञ्चारिणे नमः ॐ तुलसीदाम भूषणाय नमः
    ॥ ॥ ॐ श्यमन्तक मणेर्हर्त्रे नमः ॐ नरनारायणात्मकाय नमः ॐ कुब्जाकृष्णाम्बरधराय नमः ॐ मायिने नमः ॐ परमपूरुषाय
    नमः ॐ मुष्टिकासुर चाणूर मल्लयुद्ध विशारदाय नमः ॐ संसारवैरिणे नमः ॐ कंसारये नमः ॐ मुरारये नमः ॐ नरकान्तकाय
    नमः ॥ ॥ ॐ अनादि ब्रह्मचारिणे नमः ॐ कृष्णाव्यसन कर्शकाय नमः ॐ शिशुपाल शिरश्छेत्रे नमः ॐ दुर्योधन कुलान्तकाय
    नमः ॐ विदुराक्रूर वरदाय नमः ॐ विश्वरूप प्रदर्शकाय नमः ॐ सत्यवाचे नमः ॐ सत्य सङ्कल्पाय नमः ॐ सत्यभामारताय
    नमः ॐ जयिने नमः ॥ ॥ ॐ सुभद्रा पूर्वजाय नमः ॐ जिष्णवे नमः ॐ भीष्ममुक्ति प्रदायकाय नमः ॐ जगद्गुरवे नमः
    ॐ जगन्नाथाय नमः ॐ वेणुनाद विशारदाय नमः ॐ वृषभासुर विध्वंसिने नमः ॐ बाणासुर करान्तकाय नमः ॐ युधिष्ठिर
    प्रतिष्ठात्रे नमः ॐ बर्हिबर्हावतंसकाय नमः ॥ ॥ ॐ पार्थसारथये नमः ॐ अव्यक्ताय नमः ॐ गीतामृत महोदधये
    नमः ॐ कालीय फणिमाणिक्य रञ्जित श्रीपदाम्बुजाय नमः ॐ दामोदराय नमः ॐ यज्ञ्नभोक्र्ते नमः ॐ दानवेन्द्र
    विनाशकाय नमः ॐ नारायणाय नमः ॐ परस्मै ब्रह्मणे नमः ॐ पन्नगाशन वाहनाय नमः ॥ ॥ ॐ जलक्रीडासमासक्त गोपीवस्त्रापहारकाय
    नमः ॐ पुण्यश्लोकाय नमः ॐ तीर्थपादाय नमः ॐ वेदवेद्याय नमः ॐ दयानिधये नमः ॐ सर्वतीर्थात्मकाय नमः ॐ सर्वग्रहरूपिणे
    नमः ॐ परात्पराय नमः ॥ ॥ इति श्री कृष्णाष्टोत्तर शतनामावलीस्समाप्ता ॥
