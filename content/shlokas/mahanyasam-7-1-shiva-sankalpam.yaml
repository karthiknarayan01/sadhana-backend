id: mahanyasam-7-1-shiva-sankalpam
category: stotram
name:
  english: Mahanyasam - 7.1. Shiva Sankalpam
content:
  english: m | yena yajnastayate saptahota tanme manah shivasankalpamastu || yena karmani pracaranti dhira
    yato vaca manasa caruyanti | ya ya~nti praninastanme manah shivasankalpamastu || nyapaso manishino
    yajne krinvanti vidatheshu dhirah ya~kshmamantah prajana ntanme manah shivasankalpamastu || muta ceto
    dhritishca yajjyoti rantaramrita mprajasu | yasmanna rite kincana karma kriyate tanme manah shivasankalpamastu
    || rashvaniva yanmanushya 'bhishubhi rvajina iva | hritpratishtham ntanme manah shivasankalpamastu
    || npratishthita rathanabha vivarah | yasmiggshcittagm sarvamota ntanme manah shivasankalpamastu ||
    ntrishatagm suviram m | dasha panca trigmshatam nca tanme manah shivasankalpamastu || yajjagrato duramudaiti
    daiva ntadu suptasya tathaivaiti | duragamma ntanme manah shivasankalpamastu || njagato babhuva ye
    devapi mahato jatavedah | tadevagni stamaso jyotireka ntanme manah shivasankalpamastu || yena dyauh
    prithivi cantariksha nca ye parvatah pradisho dishashca | yeneda ntanme manah shivasankalpamastu ||
    ye~ ca deva ye divya apo ye suryarashmih | te shrotre cakshushi sancaranta ntanme manah shivasankalpamastu
    || ntanme manah shivasankalpamastu || nca prayutam carbuda nca samudrashca maddhya ncantashca parardhashca
    tanme manah shivasankalpamastu || ye panca panca dasha shatagm sahasra cityeshtakastagm sharira ntanme
    manah shivasankalpamastu || ntamasah parastat | yasya yoni mparipashyanti dhirastanme manah shivasankalpamastu
    || ntanme manah shivasankalpamastu || shcaiva yatparam | yatpara ntanme manah shivasankalpamastu ||
    tparataro brahma tatpara tparato harih | tatpara tparato 'dhishastanme manah shivasankalpamastu ||
    ya vedadishu gayatri sarvavyapi maheshvari | rig yaju tharvaishca tanme manah shivasankalpamastu ||
    ssarve sarva vedaishca tanme manah shivasankalpamastu || prayatah pranavonkara mpurushottamam | okamra
    ntanme manah shivasankalpamastu || 'sau sarveshu vedeshu pathyate hyaja ishvarah | akayo nirguno hyatma
    tanme manah shivasankalpamastu || ndhanena hyayusha ca balena ca | prajaya pashubhih pushkaraksha
    ntanme manah shivasankalpamastu || kailasa shikhare ramye shankarasya shivalaye | devata statra modante
    tanme manah shivasankalpamastu || mpushtivardhanam | urvarukamiva bandhana ttanme manah shivasankalpamastu
    || shcakshuruta vishvato mukho vishvato hasta uta vishvataspat | sambahubhyam namati sampatatrai rdyava
    prithivi janaya ndeva ekastanme manah shivasankalpamastu || caturo vedanadhiyita sarva sha vi~duh
    | itihasa puranana ntanme manah shivasankalpamastu || ma no mahantamuta ma no arbhaka mma na ukshantamuta
    ma na ukshitam | ma no vadhih pitara mpriya ma nastanuvo rudra ririshastanme manah shivasankalpamastu
    || ma nastoke tanaye ma na ayushi ma no goshu ma no ashveshu ririshah | viranmano rudra bhamitovadhi
    r havishmanto namasa vidhema te tanme manah shivasankalpamastu || nkrishnapingalam | urdhvaretam vi~shvarupaya
    vai namo namastanme manah shivasankalpamastu || drudraya pracetase midhushtamaya tavyase | vocema
    shantamagm hride | sarvo hyesha rudrastasmai rudraya namo astu tanme manah shivasankalpamastu || ssuruco
    vena avah | sa budhniya upama asya vishtha masatashca vivastanme manah shivasankalpamastu || yah pranato
    nimishato mahitvaika idraja jagato babhuva | ya ishe asya dvipada shcatushpadah kasmai devaya havisha
    vidhema tanme manah shivasankalpamastu || tmada balada yasya vishva upasate prashisham ya~sya devah
    | yasya chaya ya~sya mrityuh kasmai devaya havisha vidhema tanme manah shivasankalpamastu || yo rudro
    agnau yo aphsu ya oshadhishu yo rudro vishva bhuvana ''vivesha tasmai rudraya namo astu tanme manah
    shivasankalpamastu || m | ishvarigm sarva bhutana ntamihopahvaye shriya ntanme manah shivasankalpamastu
    || ya idagm shivasankalpagm sada dhyayanti brahmanah | te para ngamishyanti tanme manah shivasankalpamastu
    || nnamo bhagavate rudraya || shivasankalpagm hridayaya namah ||
  devanagari: म् । येन॑ य॒ज्ञस्ता॑यते स॒प्तहो॑ता॒ तन्मे॒ मनः॑ शि॒वस॑ङ्क॒ल्पम॑स्तु ॥ येन॒ कर्मा॑णि प्र॒चर॑न्ति॒
    धीरा॒ यतो॑ वा॒चा मन॑सा॒ चारु॒यन्ति॑ । य यँन्ति॑ प्रा॒णिन॒स्तन्मे॒ मनः॑ शि॒वस॑ङ्क॒ल्पम॑स्तु ॥ ण्य॒पसो॑
    मनी॒षिणो॑ य॒ज्ञे कृ॑ण्वन्ति वि॒दथे॑षु॒ धीराः यँ॒क्ष्मम॒न्तः प्र॒जाना॒ न्तन्मे॒ मनः॑ शि॒वस॑ङ्क॒ल्पम॑स्तु
    ॥ मु॒त चेतो॒ धृति॑श्च॒ यज्ज्योति॑ र॒न्तर॒मृत॑ म्प्र॒जासु॑ । यस्मा॒न्न ऋ॒ते किञ्च॒न कर्म॑ क्रि॒यते॒
    तन्मे॒ मनः॑ शि॒वस॑ङ्क॒ल्पम॑स्तु ॥ रश्वा॑निव॒ यन्म॑नु॒ष्या ऽभी॒शु॑भि र्वा॒जिन॑ इव । हृत्प्र॑तिष्ठं॒
    न्तन्मे॒ मनः॑ शि॒वस॑ङ्क॒ल्पम॑स्तु ॥ न्प्रतिष्ठि॒ता र॑थ॒नाभा॑ वि॒वाराः । यस्मिग्ग्॑श्चि॒त्तग्ं सर्व॒मोत॑
    न्तन्मे॒ मनः॑ शि॒वस॑ङ्क॒ल्पम॑स्तु ॥ न्त्रि॒शतग्ं॑ सु॒वीरं॑ म् । दश॒ पञ्च॑ त्रि॒ग्ं॒शतं॒ ञ्च॒ तन्मे॒
    मनः॑ शि॒वस॑ङ्क॒ल्पम॑स्तु ॥ यज्जाग्र॑तो दू॒रमु॒दैति॒ दैव॒ न्तदु॑ सु॒प्तस्य॒ तथै॒वैति॑ । दू॒र॒ग॒म्म
    न्तन्मे॒ मनः॑ शि॒वस॑ङ्क॒ल्पम॑स्तु ॥ ञ्जग॑तो ब॒भूव॒ ये दे॒वापि॑ मह॒तो जा॒तवे॑दाः । तदे॒वाग्नि स्तम॑सो॒
    ज्योति॒रेक॒ न्तन्मे॒ मनः॑ शि॒वस॑ङ्क॒ल्पम॑स्तु ॥ येन॒ द्यौः पृ॑थि॒वी चा॒न्तरि॑क्ष ञ्च॒ ये पर्व॑ताः
    प्र॒दिशो॒ दिश॑श्च । येने॒द न्तन्मे॒ मनः॑ शि॒वस॑ङ्क॒ल्पम॑स्तु ॥ येँ च॑ दे॒वा ये दि॒व्या आपो॒ ये सूर्य॑रश्मिः
    । ते श्रोत्रे॒ चक्षु॑षी स॒ञ्चर॑न्त॒ न्तन्मे॒ मनः॑ शि॒वस॑ङ्क॒ल्पम॑स्तु ॥ न्तन्मे॒ मनः॑ शि॒वस॑ङ्क॒ल्पम॑स्तु
    ॥ ञ्च प्र॒युतं॒ चार्बु॑द ञ्च समु॒द्रश्च॒ मद्ध्य॒ ञ्चान्त॑श्च परा॒र्धश्च॒ तन्मे॒ मनः॑ शि॒वस॑ङ्क॒ल्पम॑स्तु
    ॥ ये प॑ञ्च॒ पञ्च॑ दश श॒तग्ं स॒हस्र॑ चि॒त्येष्ट॑का॒स्तग्ं शरी॑र॒ न्तन्मे॒ मनः॑ शि॒वस॑ङ्क॒ल्पम॑स्तु
    ॥ न्तम॑सः॒ पर॑स्तात् । यस्य॒ योनि॒ म्परि॒पश्य॑न्ति॒ धीरा॒स्तन्मे॒ मनः॑ शि॒वस॑ङ्क॒ल्पम॑स्तु ॥ न्तन्मे॒
    मनः॑ शि॒वस॑ङ्क॒ल्पम॑स्तु ॥ श्चैव॒ यत्प॑रम् । य॒त्परा न्तन्मे॒ मनः॑ शि॒वस॑ङ्क॒ल्पम॑स्तु ॥ त्परत॑रो
    ब्र॒ह्मा॒ त॒त्परा त्पर॒तो ह॑रिः । त॒त्परा त्पर॑तो ऽधी॒श॒स्तन्मे॒ मनः॑ शि॒वस॑ङ्क॒ल्पम॑स्तु ॥ या वे॑दा॒दिषु॑
    गाय॒त्री॒ स॒र्व॒व्यापि॑ महे॒श्वरी । ऋग् य॑जु थर्वै॒श्च॒ तन्मे॒ मनः॑ शि॒वस॑ङ्क॒ल्पम॑स्तु ॥ स्सर्वे॑
    सर्व॑ वेदै॒श्च॒ तन्मे॒ मनः॑ शि॒वस॑ङ्क॒ल्पम॑स्तु ॥ प्रय॑तः॒ प्रण॑वोङ्का॒र॒ म्पुरु॒षोत्त॑मम् । ओकां॑र॒
    न्तन्मे॒ मनः॑ शि॒वस॑ङ्क॒ल्पम॑स्तु ॥ ऽसौ॑ स॒र्वेषु॑ वेदे॒षु॒ प॒ठ्यते ह्यज॒ ईश्व॑रः । अ॒कायो॑ निर्गु॑णो
    ह्या॒त्मा॒ तन्मे॒ मनः॑ शि॒वस॑ङ्क॒ल्पम॑स्तु ॥ न्धने॑न॒ ह्यायु॑षा च॒ बले॑न च । प्र॒जया॑ प॒शुभिः॑ पुष्करा॒क्ष॒
    न्तन्मे॒ मनः॑ शि॒वस॑ङ्क॒ल्पम॑स्तु ॥ कैला॑स॒ शिख॑रे र॒म्ये॒ श॒ङ्कर॑स्य शि॒वाल॑ये । दे॒वता स्तत्र॑ मोद॒न्ते॒
    तन्मे॒ मनः॑ शि॒वस॑ङ्क॒ल्पम॑स्तु ॥ म्पु॑ष्टि॒वर्ध॑नम् । उ॒र्वा॒रु॒कमि॑व॒ बन्ध॑ना त्तन्मे॒ मनः॑ शि॒वस॑ङ्क॒ल्पम॑स्तु
    ॥ श्चक्षुरु॒त वि॒श्वतो॑ मुखो वि॒श्वतो॑ हस्त उ॒त वि॒श्वत॑स्पात् । सम्बा॒हुभ्यां॒ नम॑ति॒ सम्प॑तत्रै॒
    र्द्यावा॑ पृथि॒वी ज॒नय॑ न्दे॒व एक॒स्तन्मे॒ मनः॑ शि॒वस॑ङ्क॒ल्पम॑स्तु ॥ च॒तुरो॑ वे॒दान॑धीयी॒त॒ स॒र्व
    शा विँ॑दुः । इ॒ति॒हा॒स॒ पु॒रा॒णा॒ना॒ न्तन्मे॒ मनः॑ शि॒वस॑ङ्क॒ल्पम॑स्तु ॥ मा नो॑ म॒हान्त॑मु॒त मा नो॑
    अर्भ॒क म्मा न॒ उक्ष॑न्तमु॒त मा न॑ उक्षि॒तम् । मा नो॑ वधीः पि॒तर॒ म्प्रि॒या मा न॑स्त॒नुवो॑ रुद्र रीरिष॒स्तन्मे॒
    मनः॑ शि॒वस॑ङ्क॒ल्पम॑स्तु ॥ मा न॑स्तो॒के तन॑ये॒ मा न॒ आयु॑षि॒ मा नो॒ गोषु॒ मा नो॒ अश्वे॑षु रीरिषः ।
    वी॒रान्मानो॑ रुद्र भामि॒तोव॑धी र् ह॒विष्म॑न्तो॒ नम॑सा विधेम ते॒ तन्मे॒ मनः॑ शि॒वस॑ङ्क॒ल्पम॑स्तु ॥
    ङ्कृष्ण॒पिङ्ग॑लम् । ऊ॒र्ध्वरे॑तं विँ॒श्वरू॑पाय॒ वै नमो॒ नम॒स्तन्मे॒ मनः॑ शि॒वस॑ङ्क॒ल्पम॑स्तु ॥ द्रु॒द्राय॒
    प्रचे॑तसे मी॒ढुष्ट॑माय॒ तव्य॑से । वो॒चेम॒ शन्त॑मग्ं हृ॒दे । सर्वो॒ ह्ये॑ष रु॒द्रस्तस्मै॑ रु॒द्राय॒
    नमो॑ अस्तु॒ तन्मे॒ मनः॑ शि॒वस॑ङ्क॒ल्पम॑स्तु ॥ स्सु॒रुचो॑ वे॒न आ॑वः । स बु॒ध्निया॑ उप॒मा अ॑स्य वि॒ष्ठा
    मस॑तश्च॒ विव॒स्तन्मे॒ मनः॑ शि॒वस॑ङ्क॒ल्पम॑स्तु ॥ यः प्रा॑ण॒तो नि॑मिष॒तो म॑हि॒त्वैक॒ इद्राजा॒ जग॑तो
    ब॒भूव॑ । य ईशे॑ अ॒स्य द्वि॒पद॒ श्चतु॑ष्पदः॒ कस्मै॑ दे॒वाय॑ ह॒विषा॑ विधेम॒ तन्मे॒ मनः॑ शि॒वस॑ङ्क॒ल्पम॑स्तु
    ॥ त्म॒दा ब॑ल॒दा यस्य॒ विश्व॑ उ॒पास॑ते प्र॒शिषं॒ यँस्य॑ दे॒वाः । यस्य॑ छा॒या यँस्य॑ मृ॒त्युः कस्मै॑
    दे॒वाय॑ ह॒विषा॑ विधेम॒ तन्मे॒ मनः॑ शि॒वस॑ङ्क॒ल्पम॑स्तु ॥ यो रु॒द्रो अ॒ग्नौ यो अ॒फ्सु य ओष॑धीषु॒ यो
    रु॒द्रो विश्वा॒ भुव॑ना ऽऽवि॒वेश॒ तस्मै॑ रु॒द्राय॒ नमो॑ अस्तु॒ तन्मे॒ मनः॑ शि॒वस॑ङ्क॒ल्पम॑स्तु ॥ म्
    । ई॒श्वरीग्ं॑ सर्व॑ भूता॒ना॒ न्तामि॒होप॑ह्वये॒ श्रिय॒ न्तन्मे॒ मनः॑ शि॒वस॑ङ्क॒ल्पम॑स्तु ॥ य इदग्ं॑
    शिव॑सङ्क॒ल्प॒ग्ं॒ स॒दा ध्या॑यन्ति॒ ब्राह्म॑णाः । ते प॑र ङ्गमिष्य॒न्ति॒ तन्मे॒ मनः॑ शि॒वस॑ङ्क॒ल्पम॑स्तु
    ॥ न्नमो भगवते॑ रुद्रा॒य ॥ शिवसङ्कल्पग्ं हृदयाय नमः॑ ॥
