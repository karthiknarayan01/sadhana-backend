id: indrasahasranamastotram-2
category: stotram
name:
  english: indrasahasranamastotram
  devanagari: इन्द्रसहस्रनामस्तोत्रम्
content:
  english: rinkshangavrishonapat | shasah shaki shravaskamah shavasavanahamsanah || 47|| surupakritrurishanah
    shushuvanah shacipatih | satinasatva sanita shaktivanamitakratuh || 48|| sahasracetah sumanah shrutyah
    shuddhah shrutamaghah | satradava somapava sukratuh shmashrushu shritah || 49|| codapravriddho vishvasya
    jagatah pranataspatih | cautrah suprakarasrona cakramanah sadavridhah || 50|| svabhishtih satpatih
    satyashcarurviratamashcati | citrashcikitvanajnata pratimanam satah satah || 51|| sthatah sacetah
    sadivah sudamsah sushravastamah | sahodah sushrutah samratsuparah sunvatah sakha || 52|| brahmavahastamo
    brahma vishnurvasvahpatirharih | ranaya samskrito rudro raniteshanakricchivah || 53|| viprajuto vipratamo
    yahvo vajri hiranyayah | vavro viratarovayurmatarishva marutsakha || 54|| gurtashrava vishvagurto
    vandanashrudvicakshanah | vrishnirvasupatirvaji vrishabho vajini vasuh || 55|| || iti pancamam namashatakam
    || vigro vibhishano vahnirvriddhayurvishruto vrisha | vrajabhridvritraha vriddho vishvavaro vritancayah
    || 56|| vrishajutirvrisharatho vrishabhanno vrishakratuh | vrishakarma vrishamanah sudakshah sunvato
    vridhah || 57|| adroghavagasuraha vedhah satrakaro'jarah | aparah suhavo'bhirurabhibhango'ngirastamah
    || 58|| amartyah svayudho'shatrurapratito'bhimatishat | amatri sunurarcatryah samaddishtirabhayankarah
    || 59|| abhineta sparharadhah saptarashmirabhishtikrit | anarvasvarjidishkarta stotrinamavitoparah
    || 60|| ajatashatruh senani rubhayavyubhayankarah | urugayahsatyayonih sahasvanurvarapatih || 61||
    ugro gopa ugrabahurugradhanvokthavardhanah | gathashrava giram raja gambhiro girvanastamah || 62||
    vajrahastacarshaninam vrishabho vajradakshinah | somakamah somapatih somavriddhah sudakshinah || 63||
    subrahma sthavirah surah sahishtah saprathah sarat | harishmasharurharivanharinam patirastritah ||
    64|| hiranyabahururvyutirharikesho hirimashah | harishipro haryamano harijato harimbharah || 65||
    hiranyavarno haryashco harivarpa haripriyah | hanishtho haryakshvo havyo harishtha hariyojanah ||
    66|| || iti shashtham namashatakam || satva sushiprah sukshatrah suvirah sutapa rishih | gathanyo
    gotrabhidgramam vahamano gaveshanah || 67|| jishnustasthusha ishano ishano jagato nrituh | naryani
    vidvannripatih netanrimnasya tutujih || 68|| nimedhamano naryapah sindhunam patiruttarah | naryo niyutvannicito
    nakshaddabhonahushtarah || 69|| navyo nidhata nrimanah sadhricinah sutarenah | nritamano nadanumannaviyannritamonrijit
    || 70|| vicayishtho vajrabahurvritrakhadovalam rujah | jatubharma jyeshthatamo janabhaksho janamsahah
    || 71|| vishvashadvamsagovasyannishpadashanimannrishat | purbhitpurashadabhishat jagatastasthushaspatih
    || 72|| samvriksamatsusandhata susankshadriksavita'runah | svaryah svarocih sutrama stushyeyyah sanajah
    svarih || 73|| krinvannaketave ketuh peshah krinvannapeshase | vajrena hatvi mahino marutstotro marudgahnah
    || 74|| mahaviro mahavrato mahayyah pramatirmahi | mata maghonam mamhishtho manyumirmanyumattamah
    || 75|| mesho mahivrinmanmadano mahinavanmahematih | mrakshomriliko mamhishtho mrakshakritva mahamahah
    || 76|| madacunmarditamadva madanam patiratapah | sushastih svastidah svardrigradhanamakarah patih
    || 77|| || iti saptamam namashatakam || ishuhasta isham data vasudata vidadvasuh | vibhutirvyanashirveno
    variyan vishvajidvibhuh || 78|| nricakshah sahurih svarvitsuyajnah sushthutah svayuh | apih prithivya
    janita suryasya janita shrutah || 79|| shpankshadvivahayah smatputandhirvrishaparva vrishantamah |
    sadharanah sukharathah svashcah satrajidadbhutah || 80|| jyeshtharajo jiradanurjagmirvitvakshano vashi
    | vidhata vishvama ashurmayi vriddhamahavridhah || 81|| varenyo vishvaturvatsyeshano dyaurvicarshanih
    | satinamanyurgodatrah sadyojatovibhanjanuh || 82|| vitantasayyo vajanam vibhakta vasva akarah | virako
    virayurvajram babhrivirenya aghrinih || 83|| vajineyo vajanirvajanam patirajikrit | vastoshpatirvarpanitirvisham
    raja vapodarah || 84|| vibhutadyumna acakriradari dodhato vadhah | akhandalo dasmavarcah sarvaseno
    vimocanah || 85|| vajrasya bharta varyanam patirgojidgavam patih | vishvavyacah sankshancakanah suhardo
    janita divah || 86|| samantunama purudha pratiko brihatah patih | didhyano damano data dirghashravasa
    ribhvasah || 87|| damsanavandivah sammraddetavajuto divavasuh | dashamo devata daksho dudhrodyumni
    dyumantamah || 88|| || ityashtamam namashatakam || mamhinkshashtharaturitthadhirdidyano dadhrishirdudhih
    | dushtariturdushcyavano divomano divovrisha || 89|| dakshayyo dasyuhadhrishnuh dakshinavan dhiyavasuh
    | dhanaspriddhrishito dhata dayamano dhananjayah || 90|| divyo dvibarha sannaryah samaryastrah simah
    sakha | dyukshah samano damsishtho radhasah patiradhriguh || 91|| samrat prithivya ojasvan vayodha
    ritupa ribhuh | eko rajaidhamanadvidekavira urujayah || 92|| lokakrijjanita'shcanam janita gavam |
    jarita janusham raja girvanah sunvato'vita || 93|| atkam vasanah krishtinam rajokthyah shipravanuruh
    | idyodashvaninatamo dhorah sankrandanah svavan || 94|| jagrivirjagato raja gritso goviddhanadhanah
    | jeta'bhibhurakuparo danavanasurorna'vah || 95|| dhrishvirdamunastavasastaviyanantamo'vritah | rayodata
    rayipatih vipashcidvritrahantamah || 96|| aparitah shalapashcad dadhvayutkara aritah | vohlavanishtho
    vrishnyavanvrishanvanvriko'vatah || 97|| garbho'samashtakavyoyugahishushmodadhrishvanih | pratrah
    parirvajadava jyotih karta giram patih || 98|| || iti navamam namashatakam || anavadyah sambhritashco
    vajrivadadrivandyuman | dasmo yajatro yodhiyanakavariryatankarah || 99|| pridakusanurojiyan brahmanashcoditah
    yamah | vandaneshthah puram bheta bandhureshtha brihaddivah || 100|| varuta madhuno raja pranenih
    paprathi yuva | urushamsohavamshrota bhuridava brihacchravah || 101|| mata stiyanam vrishabho mahodata
    mahavadhah | sugmyah suradhah satrashadodatinam nadodhunih || 102|| akamakarshanah svarshah sumrilikah
    sahaskritah | pastyasya hota sindhunam vrishabhojo rathitamah || 103|| sakha muninam janidah svadhavanasamo'pratih
    | manasvanadhvaro maryo bribaduktho'vita bhagah || 104|| ashahlo'rihla adarta viram kartam vishaspatih
    | ekah patirinah pushtih suviryo haripah sudrik || 105|| eko havyah sanadarugokovakasya sakshanih
    | suvriktiramrito'mriktah khajakridvaladah shunah || 106|| amatro mitra akayyah sudamabjin mahomahi
    | rathah subahurushana sunitho bhuridah sudah || 107|| madasya raja somasya pitvijyandivah patih |
    tavishivandhano yudhmo havanashrutsahah svarat || 108|| || iti dashamam namashatakam || || atreme
    bhavantyupasamharashlokah || idam sahasramindrasya namnam paramapavanam | rigvedato ganapatih sangrihya
    vinibaddhavan || 1|| natra namnah paunaruktyam na ca karadi puranam | shlokamadhye na caramya shatakasyopasamhritih
    || 2|| namnamesham chandasatvatsarvesham ca svarupatah | avalokya yatha chandah shabdashuddhirvicakshanaih
    || 3|| anekapadanamani viniyojyani pujane | caturthyantaprayogeshu vyutkramacca yathanvayam || 4||
    asya namasahasrasya veddamulasya sevane | purnam phalam tadvijneyam yatsvadhyayanishevane || 5|| mantrebhyah
    sambhritam sarametannamasahasrakam | endram yo bhajate bhaktya tasya syuh siddhayo vashe || 6|| indro
    vijayate devah sarvasya jagatah patih | vedamulam jayatyetattasya namasahasrakam || 7|| || iti shribhagavanmaharshiramanantevasino
    vasishthasya narasimhasunorganapateh kritih indrasahasranamastotram sampurnam ||
  devanagari: ृङ्क्षङ्गवृषोनपात् । शासः शाकी श्रवस्कामः शवसावानहंसनः ॥ ४७॥ सुरूपकृत्रुरीशानः शूशुवानः
    शचीपतिः । सतीनसत्वा सनिता शक्तीवानमितक्रतुः ॥ ४८॥ सहस्रचेताः सुमनाः श्रुत्यः शुद्धः श्रुतामघः । सत्रादावा
    सोमपावा सुक्रतुः श्मश्रुषु श्रितः ॥ ४९॥ चोदप्रवृद्धो विश्वस्य जगतः प्राणतस्पतिः । चौत्रः सुप्रकरस्रोना
    चक्रमानः सदावृधः ॥ ५०॥ स्वभिष्टिः सत्पतिः सत्यश्चारुर्वीरतमश्चती । चित्रश्चिकित्वानाज्ञाता प्रतिमानं
    सतः सतः ॥ ५१॥ स्थाताः सचेताः सदिवः सुदंसाः सुश्रवस्तमः । सहोदः सुश्रुतः सम्राट्सूपारः सुन्वतः सखा
    ॥ ५२॥ ब्रह्मवाहस्तमो ब्रह्मा विष्णुर्वस्वःपतिर्हरिः । रणाय संस्कृतो रुद्रो रणितेशानकृच्छिवः ॥ ५३॥
    विप्रजूतो विप्रतमो यह्वो वज्री हिरण्ययः । वव्रो वीरतरोवायुर्मातरिश्वा मरुत्सखा ॥ ५४॥ गूर्तश्रवा विश्वगूर्तो
    वन्दनश्रुद्विचक्षणः । वृष्णिर्वसुपतिर्वाजी वृषभो वाजिनी वसुः ॥ ५५॥ ॥ इति पञ्चमं नामशतकम् ॥ विग्रो
    विभीषणो वह्निर्वृद्धायुर्विश्रुतो वृषा । व्रजभृद्वृत्रहा वृद्धो विश्ववारो वृतञ्चयः ॥ ५६॥ वृषजूतिर्वृषरथो
    वृषभान्नो वृषक्रतुः । वृषकर्मा वृषमणाः सुदक्षः सुन्वतो वृधः ॥ ५७॥ अद्रोघवागसुरहा वेधाः सत्राकरोऽजरः
    । अपारः सुहवोऽभीरुरभिभङ्गोऽङ्गिरस्तमः ॥ ५८॥ अमर्त्यः स्वायुधोऽशत्रुरप्रतीतोऽभिमातिषाट् । अमत्री सूनुरर्चत्र्यः
    समद्दिष्टिरभयङ्करः ॥ ५९॥ अभिनेता स्पार्हराधाः सप्तरश्मिरभिष्टिकृत् । अनर्वास्वर्जिदिष्कर्ता स्तोतॄणामवितोपरः
    ॥ ६०॥ अजातशत्रुः सेनानि रुभयाव्युभयङ्करः । उरुगायःसत्ययोनिः सहस्वानुर्वरापतिः ॥ ६१॥ उग्रो गोप उग्रबाहुरुग्रधन्वोक्थवर्धनः
    । गाथश्रवा गिरां राजा गम्भीरो गिर्वणस्तमः ॥ ६२॥ वज्रहस्तचर्षणीनां वृषभो वज्रदक्षिणः । सोमकामः सोमपतिः
    सोमवृद्धः सुदक्षिणः ॥ ६३॥ सुब्रह्मा स्थविरः सूरः सहिष्टः सप्रथाः सराट् । हरिश्मशारुर्हरिवान्हरीणां
    पतिरस्तृतः ॥ ६४॥ हिरण्यबाहुरुर्व्यूतिर्हरिकेशो हिरीमशः । हरिशिप्रो हर्यमाणो हरिजातो हरिम्भरः ॥ ६५॥
    हिरण्यवर्णो हर्यश्चो हरिवर्पा हरिप्रियः । हनिष्ठो हर्यक्ष्वो हव्यो हरिष्ठा हरियोजनः ॥ ६६॥ ॥ इति षष्ठं
    नामशतकम् ॥ सत्वा सुशिप्रः सुक्षत्रः सुवीरः सुतपा ऋषिः । गाथान्यो गोत्रभिद्ग्रामं वहमानो गवेषणः ॥ ६७॥
    जिष्णुस्तस्थुष ईशानो ईशानो जगतो नृतुः । नर्याणि विद्वान्नृपतिः नेतानृम्णस्य तूतुजिः ॥ ६८॥ निमेधमानो
    नर्यापाः सिन्धूनां पतिरुत्तरः । नर्यो नियुत्वान्निचितो नक्षद्दाभोनहुष्टरः ॥ ६९॥ नव्यो निधाता नृमणाः
    सध्रीचीनः सुतरेणः । नृतमानो नदनुमान्नवीयान्नृतमोनृजित् ॥ ७०॥ विचयिष्ठो वज्रबाहुर्वृत्रखादोवलं रुजः
    । जातूभर्मा ज्येष्ठतमो जनभक्षो जनंसहः ॥ ७१॥ विश्वाषाड्वंसगोवस्यान्निष्पाडशनिमान्नृषाट् । पूर्भित्पुराषाडभिषाट्
    जगतस्तस्थुषस्पतिः ॥ ७२॥ संवृक्समत्सुसन्धाता सुसङ्क्षदृक्सविताऽरुणः । स्वर्यः स्वरोचिः सुत्रामा स्तुष्येय्यः
    सनजाः स्वरिः ॥ ७३॥ कृण्वन्नकेतवे केतुः पेशः कृण्वन्नपेशसे । वज्रेण हत्वी महिनो मरुत्स्तोत्रो मरुद्गःणः
    ॥ ७४॥ महावीरो महाव्रातो महाय्यः प्रमतिर्मही । माता मघोनां मंहिष्ठो मन्युमिर्मन्युमत्तमः ॥ ७५॥ मेषो
    महीवृन्मन्मदानो माहिनावान्महेमतिः । म्रक्षोमृलिको मंहिष्ठो म्रक्षकृत्वा महामहः ॥ ७६॥ मदचुन्मर्डितामद्वा
    मदानां पतिरातपः । सुशस्तिः स्वस्तिदाः स्वर्दृग्राधानामाकरः पतिः ॥ ७७॥ ॥ इति सप्तमं नामशतकम् ॥ इषुहस्त
    इषां दाता वसुदाता विदद्वसुः । विभूतिर्व्यानाशिर्वेनो वरीयान् विश्वजिद्विभुः ॥ ७८॥ नृचक्षाः सहुरिः
    स्वर्वित्सुयज्ञः सुष्ठुतः स्वयुः । आपिः पृथिव्या जनिता सूर्यस्य जनिता श्रुतः ॥ ७९॥ ष्पङ्क्षड्विवहायाः
    स्मत्पुतन्धिर्वृषपर्वा वृषन्तमः । साधारणः सुखरथः स्वश्चः सत्राजिदद्भुतः ॥ ८०॥ ज्येष्ठराजो जीरदानुर्जग्मिर्वित्वक्षणो
    वशी । विधाता विश्वमा आशुर्मायी वृद्धमहावृधः ॥ ८१॥ वरेण्यो विश्वतूर्वात्स्येशानो द्यौर्विचर्षणिः ।
    सतीनमन्युर्गोदत्रः सद्योजातोविभञ्जनुः ॥ ८२॥ वितन्तसाय्यो वाजानां विभक्ता वस्व आकरः । वीरको वीरयुर्वज्रं
    बभ्रिवीरेण्य आघृणिः ॥ ८३॥ वाजिनेयो वाजनिर्वाजानां पतिराजिकृत् । वास्तोष्पतिर्वर्पणीतिर्विशां राजा
    वपोदरः ॥ ८४॥ विभूतद्युम्न आचक्रिरादारी दोधतो वधः । आखण्डलो दस्मवर्चाः सर्वसेनो विमोचनः ॥ ८५॥ वज्रस्य
    भर्ता वार्याणां पतिर्गोजिद्गवां पतिः । विश्वव्यचाः सङ्क्षञ्चकानः सुहार्दो जनिता दिवः ॥ ८६॥ समन्तुनामा
    पुरुध प्रतिको बृहतः पतिः । दीध्यानो दामनो दाता दीर्घश्रवस ऋभ्वसः ॥ ८७॥ दंसनावान्दिवः संम्राड्देतवजूतो
    दिवावसुः । दशमो देवता दक्षो दुध्रोद्युम्नी द्युमन्तमः ॥ ८८॥ ॥ इत्यष्टमं नामशतकम् ॥ मंहिङ्क्षष्ठरातुरित्थाधीर्दीद्यानो
    दधृषिर्दुधिः । दुष्टरीतुर्दुश्च्यवनो दिवोमानो दिवोवृषा ॥ ८९॥ दक्षाय्यो दस्युहाधृष्णुः दक्षिणावान्
    धियावसुः । धनस्पृद्धृषितो धाता दयमानो धनञ्जयः ॥ ९०॥ दिव्यो द्विबर्हा सन्नार्यः समर्यस्त्राः सिमः सखा
    । द्युक्षः समानो दंसिष्ठो राधसः पतिरध्रिगुः ॥ ९१॥ सम्राट् पृथिव्या ओजस्वान् वयोधा ऋतुपा ऋभुः । एको
    राजैधमानद्विडेकवीर उरुजयाः ॥ ९२॥ लोककृज्जनिताऽश्चानां जनिता गवाम् । जरिता जनुषां राजा गिर्वणाः सुन्वतोऽविता
    ॥ ९३॥ अत्कं वसानः कृष्टीनां राजोक्थ्यः शिप्रवानुरुः । ईड्योदाश्वानिनतमो धोरः सङ्क्रन्दनः स्ववान् ॥
    ९४॥ जागृविर्जगतो राजा गृत्सो गोविद्धनाधनः । जेताऽभिभूरकूपारो दानवानसुरोर्णऽवः ॥ ९५॥ धृष्विर्दमूनास्तवसस्तवीयानन्तमोऽवृतः
    । रायोदाता रयिपतिः विपश्चिद्वृत्रहन्तमः ॥ ९६॥ अपरीतः षालपश्चाद् दध्वायुत्कार आरितः । वोह्लावनिष्ठो
    वृष्ण्यावान्वृषण्वान्वृकोऽवतः ॥ ९७॥ गर्भोऽसमष्टकाव्योयुगहिशुष्मोदधृष्वणिः । प्रत्रः परिर्वाजदावा ज्योतिः
    कर्ता गिरां पतिः ॥ ९८॥ ॥ इति नवमं नामशतकम् ॥ अनवद्यः सम्भृताश्चो वज्रिवादद्रिवान्द्युमान् । दस्मो
    यजत्रो योधीयानकवारिर्यतङ्करः ॥ ९९॥ पृदाकुसानुरोजीयान् ब्रह्मणश्चोदिताः यमः । वन्दनेष्ठाः पुरां भेता
    बन्धुरेष्ठा बृहद्दिवः ॥ १००॥ वरूता मधुनो राजा प्रणेनीः पप्रथी युवा । उरुशंसोहवंश्रोता भूरिदावा बृहच्छ्रवाः
    ॥ १०१॥ माता स्तियानां वृषभो महोदाता महावधः । सुग्म्यः सुराधाः सत्राषाडोदतीनां नदोधुनिः ॥ १०२॥ अकामकर्शनः
    स्वर्षाः सुमृलीकः सहस्कृतः । पास्त्यस्य होता सिन्धूनां वृषाभोजो रथीतमः ॥ १०३॥ सखा मुनीनां जनिदाः स्वधावानसमोऽप्रतिः
    । मनस्वानध्वरो मर्यो बृबदुक्थोऽविता भगः ॥ १०४॥ अषाह्लोऽरीह्ल आदर्ता वीरं कर्तां विशस्पतिः । एकः पतिरिनः
    पुष्टिः सुवीर्यो हरिपाः सुदॄक् ॥ १०५॥ एको हव्यः सनादारुगोकोवाकस्य सक्षणिः । सुवृक्तिरमृतोऽमृक्तः खजकृद्वलदाः
    शुनः ॥ १०६॥ अमत्रो मित्र आकाय्यः सुदामाब्जिन् महोमही । रथः सुबाहुरुशना सुनीथो भूरिदाः सुदाः ॥ १०७॥
    मदस्य राजा सोमस्य पीत्वीज्यान्दिवः पतिः । तविषीवान्धनो युध्मो हवनश्रुत्सहः स्वराट् ॥ १०८॥ ॥ इति दशमं
    नामशतकम् ॥ ॥ अत्रेमे भवन्त्युपसंहारश्लोकाः ॥ इदं सहस्रमिन्द्रस्य नाम्नां परमपावनम् । ऋग्वेदतो गणपतिः
    सङ्गृह्य विनिबद्धवान् ॥ १॥ नात्र नाम्नः पौनरुक्त्यं न च कारादि पूरणम् । श्लोकमध्ये न चारम्या शतकस्योपसंहृतिः
    ॥ २॥ नाम्नामेषां छान्दसत्वात्सर्वेषां च स्वरूपतः । अवलोक्या यथा छन्दः शब्दशुद्धिर्विचक्षणैः ॥ ३॥ अनेकपदनामानि
    विनियोज्यानि पूजने । चतुर्थ्यन्तप्रयोगेषु व्युत्क्रमाच्च यथान्वयम् ॥ ४॥ अस्य नामसहस्रस्य वेद्दमूलस्य
    सेवने । पूर्णं फलं तद्विज्ञेयं यत्स्वाध्यायनिषेवणे ॥ ५॥ मन्त्रेभ्यः सम्भृतं सारमेतन्नामसहस्रकम् ।
    एन्द्रं यो भजते भक्त्या तस्य स्युः सिद्धयो वशे ॥ ६॥ इन्द्रो विजयते देवः सर्वस्य जगतः पतिः । वेदमूलं
    जयत्येतत्तस्य नामसहस्रकम् ॥ ७॥ ॥ इति श्रीभगवन्महर्षिरमणान्तेवासिनो वासिष्ठस्य नरसिंहसूनोर्गणपतेः कृतिः
    इन्द्रसहस्रनामस्तोत्रं सम्पूर्णम् ॥
