id: raghavendraduhkhaharanastotram
category: stotram
name:
  english: raghavendraduhkhaharanastotram
  devanagari: राघवेन्द्रदुःखहरणस्तोत्रम्
content:
  english: shriraghavendraduhkhaharanastotram shripatibodhavibodhaka badhakasadhitasadhana bhoh | raghavendragururaja
    bhavodbhavaduhkhamidam me parihara bhoh || 1|| rajamukhiratisambhramalolupacittataya vyacaram bahu
    bhoh | raghavendragururaja bhavodbhavaduhkhamidam me parihara bhoh || 2|| ghatatam me kathamasya duracaranam
    carato hitakridbhuvi bhoh | raghavendragururaja bhavodbhavaduhkhamidam me parihara bhoh || 3|| vedapuranaviruddhakrito
    me nanyah tvattah pata bhoh | raghavendragururaja bhavodbhavaduhkhamidam me parihara bhoh || 4|| dragishtam
    dasyasi bhaktebhyastvamiti shrutva tvapam bhoh | raghavendragururaja bhavodbhavaduhkhamidam parihara
    bhoh || 5|| yadyapi dayaluriti vikhyatastarhi driksham mamuddhara bhoh | yadyasi dayaluriti raghavendragururaja
    bhavodbhavaduhkhamidam me parihara bhoh || 6|| na mamoddharta cet tvam bhuvi te divijadruma iti suyashah
    kim bhoh | raghavendragururaja bhavodbhavaduhkhamidam me parihara bhoh || 7|| mayapashavibaddho naham
    jane vivekalavamapi bhoh | raghavendragururaja bhavodbhavaduhkhamidam me parihara bhoh || 8|| krishnavadhutaviracitamashtakametat
    pathatam sakalam bhoh | raghavendragururaja bhavodbhavaduhkhamidam parihara bhoh || 9|| iti shrikrishnavadhutaviracite
    shriraghavendratantre navamapatale duhkhaharanastotram nama tritiyo'dhyayah sampurnah |
  devanagari: श्रीराघवेन्द्रदुःखहरणस्तोत्रम् श्रीपतिबोधविबोधक बाधकसाधितसाधन भोः । राघवेन्द्रगुरुराज भवोद्भवदुःखमिदं
    मे परिहर भोः ॥ १॥ राजमुखीरतिसम्भ्रमलोलुपचित्ततया व्यचरं बहु भोः । राघवेन्द्रगुरुराज भवोद्भवदुःखमिदं
    मे परिहर भोः ॥ २॥ घटतां मे कथमस्य दुराचरणं चरतो हितकृद्भुवि भोः । राघवेन्द्रगुरुराज भवोद्भवदुःखमिदं
    मे परिहर भोः ॥ ३॥ वेदपुराणविरुद्धकृतो मे नान्यः त्वत्तः पाता भोः । राघवेन्द्रगुरुराज भवोद्भवदुःखमिदं
    मे परिहर भोः ॥ ४॥ द्रागिष्टं दास्यसि भक्तेभ्यस्त्वमिति श्रुत्वा त्वापं भोः । राघवेन्द्रगुरुराज भवोद्भवदुःखमिदं
    परिहर भोः ॥ ५॥ यद्यपि दयालुरिति विख्यातस्तर्हि दृक्षं मामुद्धर भोः । यद्यसि दयालुरिति राघवेन्द्रगुरुराज
    भवोद्भवदुःखमिदं मे परिहर भोः ॥ ६॥ न ममोद्धर्ता चेत् त्वं भुवि ते दिविजद्रुम इति सुयशः किं भोः । राघवेन्द्रगुरुराज
    भवोद्भवदुःखमिदं मे परिहर भोः ॥ ७॥ मायापाशविबद्धो नाहं जाने विवेकलवमपि भोः । राघवेन्द्रगुरुराज भवोद्भवदुःखमिदं
    मे परिहर भोः ॥ ८॥ कृष्णावधूतविरचितमष्टकमेतत् पठतां सकलं भोः । राघवेन्द्रगुरुराज भवोद्भवदुःखमिदं परिहर
    भोः ॥ ९॥ इति श्रीकृष्णावधूतविरचिते श्रीराघवेन्द्रतन्त्रे नवमपटले दुःखहरणस्तोत्रं नाम तृतीयोऽध्यायः
    सम्पूर्णः ।
