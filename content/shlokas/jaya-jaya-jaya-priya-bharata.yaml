id: jaya-jaya-jaya-priya-bharata
category: stotram
name:
  english: Jaya Jaya Jaya Priya Bharata
content:
  english: jaya jaya jaya priya bharata janayitri divya dhatri jaya jaya jaya shata sahasra naranari hridaya
    netri jaya jaya sashyamala sushyama calaccelancala jaya vasanta kusuma lata calita lalita curnakuntala
    jaya madiya hridayashaya laksharuna pada yugala jaya jaya jaya priya bharata janayitri divya dhatri
    jaya dishanta gata shakunta divyagana paritoshana jaya gayaka vaitalika gala vishala pada viharana
    jaya madiya madhurageya cumbita sundara carana jaya jaya jaya priya bharata janayitri divya dhatri
    jaya jaya jaya shata sahasra naranari hridaya netri
  devanagari: जय जय जय प्रिय भारत जनयित्री दिव्य धात्रि जय जय जय शत सहस्र नरनारी हृदय नेत्रि जय जय सश्यमल
    सुश्याम चलच्चेलाञ्चल जय वसन्त कुसुम लता चलित ललित चूर्णकुन्तल जय मदीय हृदयाशय लाक्षारुण पद युगला जय
    जय जय प्रिय भारत जनयित्री दिव्य धात्रि जय दिशान्त गत शकुन्त दिव्यगान परितोषण जय गायक वैतालिक गल विशाल
    पद विहरण जय मदीय मधुरगेय चुम्बित सुन्दर चरणा जय जय जय प्रिय भारत जनयित्री दिव्य धात्रि जय जय जय शत
    सहस्र नरनारी हृदय नेत्रि
