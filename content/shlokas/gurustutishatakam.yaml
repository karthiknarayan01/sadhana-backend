id: gurustutishatakam
category: shataka
name:
  english: gurustutishatakam
  devanagari: गुरुस्तुतिशतकम्
content:
  english: ringatapahsthane tapastepe ca yo munih | nanavyakhyanakridyashca tasmai shrigurave namah ||
    44|| yadvagvinihsritanantavishuddhapadajahnavi | pavitrikurute nityam tasmai shrigurave namah || 45||
    durvadinam kavinashca vijeta vagbalena yah | tejomayalasatkayastasmai shrigurave namah || 46|| kashayavastrabhrinnityamekadandamupashritah
    | bhutibhushitasadbhalastasmai shrigurave namah || 47|| sanyasasthapano yashca karmamarganikrintanah
    | brahmavidyaprado yashca tasmai shrigurave namah || 48|| mantrashastrasya karta yah sarvamantravidam
    varah | sarvajnanaikanilayastasmai shrigurave namah || 49|| yogena tapasa caiva brahmacaryena bhaktitah
    | vishuddham jnanamapede tasmai shrigurave namah || 50|| yadyashahkaumudi candram kalankikurute'nisham
    | suprasiddhashca yo loke tasmai shrigurave namah || 51|| yam drishtva vibudhah sarve vidurvidyavisharadam
    | giram pumbhavamapannam tasmai shrigurave namah || 52|| shishyaishcaturbhirgovindashcaturbhiriva
    bahubhih | virajate munishreshthastasmai shrigurave namah || 53|| namah sureshvaracaryaguruvaryaya
    dhimate | suranamishvarayeva surasanghanamaskrite || 54|| namaste padmapadaya padmasampujyakeshava
    | padmasanaparayatha parabrahmatmane tatha || 55|| namaste totakacaryagurave tadrishaya ca | trutimatrena
    samsaramanityam manute tu yah || 56|| anirvacyamanirdeshyam yaddhamamalakikritam | avyaktamapi tadbrahma
    tasmai shrigurave namah || 57|| vishvarupabhidhacaryavaryo yo vishvarupinam | vishnum dhyayati yogindrastasmai
    shrigurave namah || 58|| namo bodhaghanacaryayogine divyacakshushe | jnanado yashca shishyebhyastasmai
    shrigurave namah || 59|| namo jnanaghanacaryamahayogishvaraya ca | mahanubhavaganyaya tasmai shrigurave
    namah || 60|| sakshatkritaparabrahmajnanottamashivaya ca | uttamapratipadyaya tasmai shrigurave namah
    || 61|| namna prajnanagiraye gurave harivedine | namah shrishankaracaryasampradayadhvajaya ca || 62||
    narasimhapadadvandvadhyananirmalacetase | namna simhagirishaya tasmai shrigurave namah || 63|| mandakinipayahsnanatirthabhutatmavigrahah
    | yo'bhudishvaratirthakhyastasmai shrigurave namah || 64|| tirthabhutasvabhaktaughasamarpitanamastatih
    | yo'bhunnrisimhatirthakhyastasmai shrigurave namah || 65|| shrividyashankarayadyavidyatirthabhidhaya
    ca | lambakarnaya shuddhaya tasmai shrigurave namah || 66|| ashtangalakshano dharmo yasyatisulabho'bhavat
    | lambikayogasamsthaya tasmai shrigurave namah || 67|| aparajnanasandohavidhutatamase tada | aparasukhasandhanavidhanapatave
    namah || 68|| ativasumahattejomurtidhyanaparaya ca | atitabhavasangaya tasmai shrigurave namah ||
    69|| sadottungatarangakhyatungabhadratate shubhe | purnabrahmaikanishthaya tasmai shrigurave namah
    || 70|| bharatisampradayasya ratnabhutaya dhimate | bharatikrishnatirthaya tasmai shrigurave namah
    || 71|| vidyaranyamunishaya vidyaranyeshu nityashah | caratkesarine madyadvidvatkunjaravairine ||
    72|| suprasiddhamahagranthakarane karunanvita | vashaga yasya vagisha tasmai shrigurave namah || 73||
    yo'bhudvyakhyatavedarthah prajnaya tapasa tatha | kritasmritipuranaya tasmai shrigurave namah || 74||
    vidyanagaranirmanavidyashatavisharadah | vidyaranyamahayogi tasmai shrigurave namah || 75|| pura hariharabhikhyaprithivimandaleshituh
    | sthapako yashca kalajnastasmai shrigurave namah || 76|| shrimacchringapurasthanasimhasanavidhayine
    | chatracamarabhushaya tasmai shrigurave namah || 77|| yasya candolikadanda ekato manushairdhritah
    | ekato bhutavetalaistasmai shrigurave namah || 78|| namo lakshmivilasaya namaste mantramurtaye |
    vidvajjananivasaya tasmai shrigurave namah || 79|| namo mahanubhavaya jnanavairagyashaline | namo
    vishuddhabhavaya tasmai shrigurave namah || 80|| namo bhavamahadarpadalanaya mahatmane | ashcaryakarmane
    nityam tasmai shrigurave namah || 81|| yo va namnabhavaccandrashekhararanyasadguruh | nrisimhabharatishashca
    tabhyam nityam namo namah || 82|| purushottamapadabjaparayanamanassada | namaskrito'stu namna yah
    purushottamabharati || 83|| shankaracaryasadvamshyo yo'bhucchankarabharati | kinkaribhutabhupalastasmai
    shrigurave namah || 84|| candrashekharabhakto yashcandrashekharabharati | nrisimhabharati bhuyastabhyam
    nityam namo namah || 85|| purushottamatam yatah purushottamabharati | naiva namna tadarthacca tasmai
    shrigurave namah || 86|| ramacandrakripaleshamahabhutivishobhitah | ramacandrayatindro yastasmai shrigurave
    namah || 87|| yo vibhati yatishreshthah samridhya devaradiva | nrisimhabharatishanastasmai shrigurave
    namah || 88|| shricakrasya prakarena vidyashankarasadguroh | devasthanavidhata yastasmai shrigurave
    namah || 89|| shaddarshanarahasyasya jnata tatsthapakashca yah | kritacaruprabandhaya tasmai shrigurave
    namah || 90|| tatpanikanjasanjatah shrinrisimhakhyabharati | tapasa jagati khyatastasmai shrigurave
    namah || 91|| punarudbhutasamsthanah simhasanashubhankarah | sudridhikritasahayyastasmai shrigurave
    namah || 92|| anugrahaparo yashca jagatah paramo guruh | nirvishanko mahatejastasmai shrigurave namah
    || 93|| tadiyakarapankejasamudbhutaya dhimate | nrisimhabharatishaya tasmai shrigurave namah || 94||
    varashrisaccidanandasantoshitahride sada | paramanandarupaya tasmai shrigurave namah || 95|| karunarasapurnantarangasangatamangalah
    | svadharmarasiko yashca tasmai shrigurave namah || 96|| urdhvarekhankitapadah padanirdhutapankajah
    | prakantanayano yashca tasmai shrigurave namah || 97|| dirghabahurvrishaskandhah purnavakshah shubhananah
    | kambugrivah sunaso yastasmai shrigurave namah || 98|| ramaniyasuhemabhajanujanghorushobhitah | shubhanabhihadah
    shriman tasmai shrigurave namah || 99|| vishalaphalavibhrajadgopicandanashobhitah | tripundritavibhutiryastasmai
    shrigurave namah || 100|| vanivijitadurvadi tejonirjitabhaskarah | gambhiryavijitambhodhistasmai shrigurave
    namah || 101|| vade sati mahasimho dane sati mahamanah | vyakhyane ca mahasheshastasmai shrigurave
    namah || 102|| nanavidhasuratnadhyasuvarnamayapadukah | purah shankhamahanadastasmai shrigurave namah
    || 103|| asankhyasvarnadanantasampurnashikharakriyah | vyakhyatashivagito yastasmai shrigurave namah
    || 104|| ranjitanekashishyaya sampurnasvarnadanatah | vyaptaya yashasa loke tasmai shrigurave namah
    || 105|| jyotishtomamukhairyajnaih shishyadvaraiva karitaih | toshita yena devashca tasmai shrigurave
    namah || 106|| rajadhirajapujyaya rajamanaya tejasa | ramacandrasamanaya tasmai shrigurave namah ||
    107|| vedantakshastapashcandrah samsaratamaso ravih | karmendhanamahavahnistasmai shrigurave namah
    || 108|| kotisuryendusankasho yena dhyatah sadashivah | yadiyahridayabhijnastasmai shrigurave namah
    || 109|| yatpadarcanatah sarve narah purnamanorathah | namo'stu gurave nityam tasmai mangaladayine
    || 110|| sumangalashariraya sarvasantoshakarine | dayashantivibhushaya tasmai shrigurave namah ||
    111|| samyagjaptamahamantravidhutakalushaya ca | nirmaladhyanasamsthaya tasmai shrigurave namah ||
    112|| yasya darshanamatrena tapatrayavivarjitah | taranti manuja loke tasmai shrigurave namah || 113||
    vedantamathanodbhutavijnanavimalaya ca | bhavitatmasvarupaya tasmai shrigurave namah || 114|| shrivishnoramshabhutaya
    yogindraya mahatmane | sarvalakshanayuktaya tasmai shrigurave namah || 115|| anekashastrasampannamanadritamanobhavam
    | asheshajagadadharamasmadgurumaham bhaje || 116|| onkarajapasampurnapunyapuritavigraham | omravam
    manasa nityam shrimadgurumupasmahe || 117|| manuja bhaktisamyukta ye pathanti gurustutim | te shriya
    vidyaya loke yukta vriddhimavapnuyuh || 118|| shrikrishnapadasmritidhutapapah shrisaccidanandayatindravaryah
    | shrishankaracaryasusampra
  devanagari: ृङ्गतपःस्थाने तपस्तेपे च यो मुनिः । नानाव्याख्यानकृद्यश्च तस्मै श्रीगुरवे नमः ॥ ४४॥ यद्वाग्विनिःसृतानन्तविशुद्धपदजाह्नवी
    । पवित्रीकुरुते नित्यं तस्मै श्रीगुरवे नमः ॥ ४५॥ दुर्वादिनां कवीनाश्च विजेता वाग्बलेन यः । तेजोमयलसत्कायस्तस्मै
    श्रीगुरवे नमः ॥ ४६॥ काषायवस्त्रभृन्नित्यमेकदण्डमुपाश्रितः । भूतिभूषितसद्भालस्तस्मै श्रीगुरवे नमः ॥
    ४७॥ सन्यासस्थापनो यश्च कर्ममार्गनिकृन्तनः । ब्रह्मविद्याप्रदो यश्च तस्मै श्रीगुरवे नमः ॥ ४८॥ मन्त्रशास्त्रस्य
    कर्ता यः सर्वमन्त्रविदां वरः । सर्वज्ञानैकनिलयस्तस्मै श्रीगुरवे नमः ॥ ४९॥ योगेन तपसा चैव ब्रह्मचर्येण
    भक्तितः । विशुद्धं ज्ञानमापेदे तस्मै श्रीगुरवे नमः ॥ ५०॥ यद्यशःकौमुदी चन्द्रं कलङ्कीकुरुतेऽनिशम् ।
    सुप्रसिद्धश्च यो लोके तस्मै श्रीगुरवे नमः ॥ ५१॥ यं दृष्ट्वा विबुधाः सर्वे विदुर्विद्याविशारदम् । गिरं
    पुम्भावमापन्नां तस्मै श्रीगुरवे नमः ॥ ५२॥ शिष्यैश्चतुर्भिर्गोविन्दश्चतुर्भिरिव बाहुभिः । विराजते मुनिश्रेष्ठस्तस्मै
    श्रीगुरवे नमः ॥ ५३॥ नमः सुरेश्वराचार्यगुरुवर्याय धीमते । सुराणामीश्वरायेव सुरसङ्घनमस्कृते ॥ ५४॥ नमस्ते
    पद्मपादाय पद्मसम्पूज्यकेशव । पद्मासनपरायाथ परब्रह्मात्मने तथा ॥ ५५॥ नमस्ते तोटकाचार्यगुरवे तादृशाय
    च । त्रुटिमात्रेण संसारमनित्यं मनुते तु यः ॥ ५६॥ अनिर्वाच्यमनिर्देश्यं यद्धामामलकीकृतम् । अव्यक्तमपि
    तद्ब्रह्म तस्मै श्रीगुरवे नमः ॥ ५७॥ विश्वरूपाभिधाचार्यवर्यो यो विश्वरूपिणम् । विष्णुं ध्यायति योगीन्द्रस्तस्मै
    श्रीगुरवे नमः ॥ ५८॥ नमो बोधघनाचार्ययोगिने दिव्यचक्षुषे । ज्ञानदो यश्च शिष्येभ्यस्तस्मै श्रीगुरवे नमः
    ॥ ५९॥ नमो ज्ञानघनाचार्यमहायोगीश्वराय च । महानुभावगण्याय तस्मै श्रीगुरवे नमः ॥ ६०॥ साक्षात्कृतपरब्रह्मज्ञानोत्तमशिवाय
    च । उत्तमप्रतिपाद्याय तस्मै श्रीगुरवे नमः ॥ ६१॥ नाम्ना प्रज्ञानगिरये गुरवे हरिवेदिने । नमः श्रीशङ्कराचार्यसंप्रदायध्वजाय
    च ॥ ६२॥ नरसिंहपदद्वन्द्वध्याननिर्मलचेतसे । नाम्ना सिंहगिरीशाय तस्मै श्रीगुरवे नमः ॥ ६३॥ मन्दाकिनीपयःस्नानतीर्थभूतात्मविग्रहः
    । योऽभूदीश्वरतीर्थाख्यस्तस्मै श्रीगुरवे नमः ॥ ६४॥ तीर्थभूतस्वभक्तौघसमर्पितनमस्ततिः । योऽभून्नृसिंहतीर्थाख्यस्तस्मै
    श्रीगुरवे नमः ॥ ६५॥ श्रीविद्याशङ्करायाद्यविद्यातीर्थाभिधाय च । लम्बकर्णाय शुद्धाय तस्मै श्रीगुरवे
    नमः ॥ ६६॥ अष्टाङ्गलक्षणो धर्मो यस्यातिसुलभोऽभवत् । लम्बिकायोगसंस्थाय तस्मै श्रीगुरवे नमः ॥ ६७॥ अपारज्ञानसन्दोहविधूततमसे
    तदा । अपारसुखसन्धानविधानपटवे नमः ॥ ६८॥ अतीवसुमहत्तेजोमूर्तिध्यानपराय च । अतीतभवसङ्गाय तस्मै श्रीगुरवे
    नमः ॥ ६९॥ सदोत्तुङ्गतरङ्गाख्यातुङ्गभद्रातटे शुभे । पूर्णब्रह्मैकनिष्ठाय तस्मै श्रीगुरवे नमः ॥ ७०॥
    भारतीसंप्रदायस्य रत्नभूताय धीमते । भारतीकृष्णतीर्थाय तस्मै श्रीगुरवे नमः ॥ ७१॥ विद्यारण्यमुनीशाय विद्यारण्येषु
    नित्यशः । चरत्केसरिणे माद्यद्विद्वत्कुञ्जरवैरिणे ॥ ७२॥ सुप्रसिद्धमहाग्रन्थकरणे करुणान्विता । वशगा
    यस्य वागीशा तस्मै श्रीगुरवे नमः ॥ ७३॥ योऽभूद्व्याख्यातवेदार्थः प्रज्ञया तपसा तथा । कृतस्मृतिपुराणाय
    तस्मै श्रीगुरवे नमः ॥ ७४॥ विद्यानगरनिर्माणविद्याशतविशारदः । विद्यारण्यमहायोगी तस्मै श्रीगुरवे नमः
    ॥ ७५॥ पुरा हरिहराभिख्यपृथिवीमण्डलेशितुः । स्थापको यश्च कालज्ञस्तस्मै श्रीगुरवे नमः ॥ ७६॥ श्रीमच्छृङ्गपुरस्थानसिंहासनविधायिने
    । छत्रचामरभूषाय तस्मै श्रीगुरवे नमः ॥ ७७॥ यस्य चान्दोलिकादण्ड एकतो मानुषैर्धृतः । एकतो भूतवेतालैस्तस्मै
    श्रीगुरवे नमः ॥ ७८॥ नमो लक्ष्मीविलासाय नमस्ते मन्त्रमूर्तये । विद्वज्जननिवासाय तस्मै श्रीगुरवे नमः
    ॥ ७९॥ नमो महानुभावाय ज्ञानवैराग्यशालिने । नमो विशुद्धभावाय तस्मै श्रीगुरवे नमः ॥ ८०॥ नमो भवमहादर्पदलनाय
    महात्मने । आश्चर्यकर्मणे नित्यं तस्मै श्रीगुरवे नमः ॥ ८१॥ यो वा नाम्नाभवच्चन्द्रशेखरारण्यसद्गुरुः
    । नृसिंहभारतीशश्च ताभ्यां नित्यं नमो नमः ॥ ८२॥ पुरुषोत्तमपादाब्जपरायणमनास्सदा । नमस्कृतोऽस्तु नाम्ना
    यः पुरुषोत्तमभारती ॥ ८३॥ शङ्कराचार्यसद्वंश्यो योऽभूच्छङ्करभारती । किङ्करीभूतभूपालस्तस्मै श्रीगुरवे
    नमः ॥ ८४॥ चन्द्रशेखरभक्तो यश्चन्द्रशेखरभारती । नृसिंहभारती भूयस्ताभ्यां नित्यं नमो नमः ॥ ८५॥ पुरुषोत्तमतां
    यातः पुरुषोत्तमभारती । नैव नाम्ना तदर्थाच्च तस्मै श्रीगुरवे नमः ॥ ८६॥ रामचन्द्रकृपालेशमहाभूतिविशोभितः
    । रामचन्द्रयतीन्द्रो यस्तस्मै श्रीगुरवे नमः ॥ ८७॥ यो विभाति यतिश्रेष्ठः समृध्या देवराडिव । नृसिंहभारतीशानस्तस्मै
    श्रीगुरवे नमः ॥ ८८॥ श्रीचक्रस्य प्रकारेण विद्याशङ्करसद्गुरोः । देवस्थानविधाता यस्तस्मै श्रीगुरवे नमः
    ॥ ८९॥ षड्दर्शनरहस्यस्य ज्ञाता तत्स्थापकश्च यः । कृतचारुप्रबन्धाय तस्मै श्रीगुरवे नमः ॥ ९०॥ तत्पाणिकञ्जसञ्जातः
    श्रीनृसिंहाख्यभारती । तपसा जगति ख्यातस्तस्मै श्रीगुरवे नमः ॥ ९१॥ पुनरुद्भूतसंस्थानः सिंहासनशुभङ्करः
    । सुदृढीकृतसाहाय्यस्तस्मै श्रीगुरवे नमः ॥ ९२॥ अनुग्रहपरो यश्च जगतः परमो गुरुः । निर्विशङ्को महातेजास्तस्मै
    श्रीगुरवे नमः ॥ ९३॥ तदीयकरपङ्केजसमुद्भूताय धीमते । नृसिंहभारतीशाय तस्मै श्रीगुरवे नमः ॥ ९४॥ वरश्रीसच्चिदानन्दसन्तोषितहृदे
    सदा । परमानन्दरूपाय तस्मै श्रीगुरवे नमः ॥ ९५॥ करुणारसपूर्णान्तरङ्गसङ्गतमङ्गलः । स्वधर्मरसिको यश्च
    तस्मै श्रीगुरवे नमः ॥ ९६॥ ऊर्ध्वरेखाङ्कितपदः पदनिर्धूतपङ्कजः । प्रकान्तनयनो यश्च तस्मै श्रीगुरवे नमः
    ॥ ९७॥ दीर्घबाहुर्वृषस्कन्धः पूर्णवक्षाः शुभाननः । कम्बुग्रीवः सुनासो यस्तस्मै श्रीगुरवे नमः ॥ ९८॥
    रमणीयसुहेमाभजानुजङ्घोरुशोभितः । शुभनाभीहदः श्रीमान् तस्मै श्रीगुरवे नमः ॥ ९९॥ विशालफालविभ्राजद्गोपीचन्दनशोभितः
    । त्रिपुण्ड्रितविभूतिर्यस्तस्मै श्रीगुरवे नमः ॥ १००॥ वाणीविजितदुर्वादी तेजोनिर्जितभास्करः । गाम्भीर्यविजिताम्भोधिस्तस्मै
    श्रीगुरवे नमः ॥ १०१॥ वादे सति महासिंहो दाने सति महामनाः । व्याख्याने च महाशेषस्तस्मै श्रीगुरवे नमः
    ॥ १०२॥ नानाविधसुरत्नाढ्यसुवर्णमयपादुकः । पुरः शङ्खमहानादस्तस्मै श्रीगुरवे नमः ॥ १०३॥ असङ्ख्यस्वर्णदानान्तसम्पूर्णशिखरक्रियः
    । व्याख्यातशिवगीतो यस्तस्मै श्रीगुरवे नमः ॥ १०४॥ रञ्जितानेकशिष्याय सम्पूर्णस्वर्णदानतः । व्याप्ताय
    यशसा लोके तस्मै श्रीगुरवे नमः ॥ १०५॥ ज्योतिष्टोममुखैर्यज्ञैः शिष्यद्वारैव कारितैः । तोषिता येन देवाश्च
    तस्मै श्रीगुरवे नमः ॥ १०६॥ राजाधिराजपूज्याय राजमानाय तेजसा । रामचन्द्रसमानाय तस्मै श्रीगुरवे नमः ॥
    १०७॥ वेदान्ताक्षस्तपश्चन्द्रः संसारतमसो रविः । कर्मेन्धनमहावह्निस्तस्मै श्रीगुरवे नमः ॥ १०८॥ कोटिसूर्येन्दुसङ्काशो
    येन ध्यातः सदाशिवः । यदीयहृदयाभिज्ञस्तस्मै श्रीगुरवे नमः ॥ १०९॥ यत्पदार्चनतः सर्वे नराः पूर्णमनोरथाः
    । नमोऽस्तु गुरवे नित्यं तस्मै मङ्गलदायिने ॥ ११०॥ सुमङ्गलशरीराय सर्वसन्तोषकारिणे । दयाशान्तिविभूषाय
    तस्मै श्रीगुरवे नमः ॥ १११॥ सम्यग्जप्तमहामन्त्रविधूतकलुषाय च । निर्मलध्यानसंस्थाय तस्मै श्रीगुरवे नमः
    ॥ ११२॥ यस्य दर्शनमात्रेण तापत्रयविवर्जिताः । तरन्ति मनुजा लोके तस्मै श्रीगुरवे नमः ॥ ११३॥ वेदान्तमथनोद्भूतविज्ञानविमलाय
    च । भावितात्मस्वरूपाय तस्मै श्रीगुरवे नमः ॥ ११४॥ श्रीविष्णोरंशभूताय योगीन्द्राय महात्मने । सर्वलक्षणयुक्ताय
    तस्मै श्रीगुरवे नमः ॥ ११५॥ अनेकशास्त्रसम्पन्नमनादृतमनोभवम् । अशेषजगदाधारमस्मद्गुरुमहं भजे ॥ ११६॥ ओङ्कारजपसम्पूर्णपुण्यपूरितविग्रहम्
    । ओंरवं मनसा नित्यं श्रीमद्गुरुमुपास्महे ॥ ११७॥ मनुजा भक्तिसंयुक्ता ये पठन्ति गुरुस्तुतिम् । ते श्रिया
    विद्यया लोके युक्ता वृद्धिमवाप्नुयुः ॥ ११८॥ श्रीकृष्णपादस्मृतिधूतपापः श्रीसच्चिदानन्दयतीन्द्रवर्यः
    । श्रीशङ्कराचार्यसुसंप्र
