id: mahakalasahasranamastotram-2
category: sahasranama
name:
  english: mahakalasahasranamastotram 2
  devanagari: महाकालसहस्रनामस्तोत्रम् २
content:
  english: ringaprado babhruh rajarajo niramayah | aviramah suragano viramassarvasadhanah || 110|| lalataksho
    vishvadeho harani brahmavarcasi | sthavaranam patishcaiva niyamendriyavardhanah || 111|| siddharthassarvabhutartho
    nityassatyavratashshucih | vratadiparamam brahma muktanam paramagatih || 112|| vimukto diptatejashca
    shriman shrivardhano'grajah | shmashanakalo devesho bhuteshah pramathadhipah || 113|| bhadrarupah
    kaladevo bhutasamharakarakah | kalinatho bhutanathah sharvah pashupatirmridah || 114|| bhadranathashca
    kalinassarvabhakshakabhakshakah | srishtisthitistharupashca bhutabhridbhutabhavanah || 115|| mamsashano
    bahurupah krurarupah kapalabhrit | sarveshvarah sarvarudrah kalikamalamadhyagah || 116|| drim drim
    hum hum kalarupah cintamandalamadhyagah | krim krim hum hum mundadhari mundamaladharashshivah || 117||
    iti namnam sahasram te mahakalasya bhashitam | sarvarogaharam devi paramaishvaryakaranam || 118||
    sarvagamarahasyo'yam stotram paramadurlabham | sarvasiddhipradam sakshatsiddhidam papanashanam ||
    119|| mahabhayaharam devi bhogamokshaikakaranam | samastashokashamanam sarvavidyapradam shive || 120||
    mahapatakakotighnam kalau siddhipradam shive | idam namasahasram tu brahmalokeshu durlabham || 121||
    tava pritya maya''khyatam gopaniyam svayonivat | tava namni shrute devi sarvayajnaphalam labhet |
    sarvapapakshayakaram vanchitam caiva sidhyati || 122|| nashyanti pathanadasya stotramantrasya bhavatah
    | yam yam karoti satatam tam tam prapnoti nityashah || 123|| idam namasahasram tu bhaktishraddhasamanvitah
    | shanivare shmashane tu pujam kuryannarottamah || 124|| tato dashamshato kuryatsuratarpanameva ca
    | payasenajyahomena nakhakeshena parvati || 125|| na deyamanyashishyaya shathaya durjanaya ca | deyam
    shishyaya shantaya kulinaya suputrine || 126|| bhaktiyuktaya deveshagurubhaktiparaya ca | vina danam
    na grihliyanna daya dakshinam vina || 127|| datva grihitva tubhayoh siddhihanirbhaveddhruvam | idam
    namasahasram tu param paramakaranam || 128|| rahasyanam rahasyam ca pavitranam pavitrakam | gopyam
    guhyatamam gopyam gopaniyam mumukshubhih || 129|| iti shrivishvasare kalisarvasve mahakalasahasranama
    stotram sampurnam || shubhamastu
  devanagari: ृङ्गप्रदो बभ्रुः राजराजो निरामयः । अविरामः सुरगणो विरामस्सर्वसाधनः ॥ ११०॥ ललाटाक्षो विश्वदेहो
    हरणी ब्रह्मवर्चसी । स्थावराणां पतिश्चैव नियमेन्द्रियवर्धनः ॥ १११॥ सिद्धार्थस्सर्वभूतार्थो नित्यस्सत्यव्रतश्शुचिः
    । व्रतादिपरमं ब्रह्म मुक्तानां परमागतिः ॥ ११२॥ विमुक्तो दीप्ततेजाश्च श्रीमान् श्रीवर्धनोऽग्रजः । श्मशानकालो
    देवेशो भूतेशः प्रमथाधिपः ॥ ११३॥ भद्ररूपः कालदेवो भूतसंहारकारकः । कालीनाथो भूतनाथः शर्वः पशुपतिर्मृडः
    ॥ ११४॥ भद्रनाथश्च कालीनस्सर्वभक्षकभक्षकः । सृष्टिस्थितिस्थरूपश्च भूतभृद्भूतभावनः ॥ ११५॥ माम्साशनो
    बहुरूपः क्रूररूपः कपालभृत् । सर्वेश्वरः सर्वरुद्रः कालीकमलमध्यगः ॥ ११६॥ द्रीं द्रीं हूं हूं कलरूपः
    चिन्तामण्डलमध्यगः । क्रीं क्रीं हूं हूं मुण्डधारी मुण्डमालाधरश्शिवः ॥ ११७॥ इति नाम्नां सहस्रं ते महाकालस्य
    भाषितम् । सर्वरोगहरं देवि परमैश्वर्यकारणम् ॥ ११८॥ सर्वागमरहस्योऽयं स्तोत्रं परमदुर्लभम् । सर्वसिद्धिप्रदं
    साक्षात्सिद्धिदं पापनाशनम् ॥ ११९॥ महाभयहरं देवि भोगमोक्षैककारणम् । समस्तशोकशमनं सर्वविद्याप्रदं शिवे
    ॥ १२०॥ महापातककोटिघ्नं कलौ सिद्धिप्रदं शिवे । इदं नामसहस्रं तु ब्रह्मलोकेषु दुर्लभम् ॥ १२१॥ तव प्रीत्या
    मयाऽऽख्यातं गोपनीयं स्वयोनिवत् । तव नाम्नि श्रुते देवि सर्वयज्ञफलं लभेत् । सर्वपापक्षयकरं वाञ्छितं
    चैव सिध्यति ॥ १२२॥ नश्यन्ति पठनादस्य स्तोत्रमन्त्रस्य भावतः । यं यं करोति सततं तं तं प्राप्नोति नित्यशः
    ॥ १२३॥ इदं नामसहस्रं तु भक्तिश्रद्धासमन्वितः । शनिवरे श्मशाने तु पूजां कुर्यान्नरोत्तमः ॥ १२४॥ ततो
    दशांशतो कुर्यात्सुरातर्पणमेव च । पायसेनाज्यहोमेन नखकेशेन पार्वति ॥ १२५॥ न देयमन्यशिष्याय शठाय दुर्जनाय
    च । देयं शिष्याय शान्ताय कुलीनाय सुपुत्रिणे ॥ १२६॥ भक्तियुक्ताय देवेशगुरुभक्तिपराय च । विना दानं न
    गृह्लीयान्न दया दक्षिणां विना ॥ १२७॥ दत्वा गृहीत्वा तूभयोः सिद्धिहानिर्भवेद्ध्रुवम् । इदं नामसहस्रं
    तु परं परमकारणम् ॥ १२८॥ रहस्यानां रहस्यं च पवित्राणां पवित्रकम् । गोप्यं गुह्यतमं गोप्यं गोपनीयं मुमुक्षुभिः
    ॥ १२९॥ इति श्रीविश्वसारे कालीसर्वस्वे महाकलसहस्रनाम स्तोत्रं सम्पूर्णम् ॥ शुभमस्तु
