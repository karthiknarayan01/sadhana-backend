id: shivananda-lahari
category: stotram
name:
  english: Shivananda Lahari
  devanagari: शिवानन्दलहरी (शङ्कराचार्यविरचिता)
content:
  english: kalabhyam cudalankritashashikalabhyam nijatapah- phalabhyam bhakteshu prakatitaphalabhyam bhavatu
    me | shivabhyamastokatribhuvanashivabhyam hridi puna- rbhavabhyamanandasphuradanubhavabhyam natiriyam
    || 1|| galanti shambho tvaccaritasaritah kilbisharajo dalanti dhikulyasaranishu patanti vijayatam
    | dishanti samsarabhramanaparitapopashamanam vasanti maccetohradabhuvi shivanandalahari || 2|| trayivedyam
    hridyam tripuraharamadyam trinayanam jatabharodaram caladuragaharam mrigadharam | mahadevam devam
    mayi sadayabhavam pashupatim cidalambam sambam shivamatividambam hridi bhaje || 3|| sahasram vartante
    jagati vibudhah kshudraphalada na manye svapne va tadanusaranam tatkritaphalam | haribrahmadinamapi
    nikatabhajamasulabham ciram yace shambho shiva tava padambhojabhajanam || 4|| smritau shastre vaidye
    shakunakavitaganaphanitau purane mantre va stutinatanahasyeshvacaturah | katham rajnam pritirbhavati
    mayi ko'ham pashupate pashum mam sarvajna prathitakripaya palaya vibho || 5|| ghato va mritpindo'pyanurapi
    ca dhumo'gniracalah pato va tanturva pariharati kim ghorashamanam | vritha kanthakshobham vahasi tarasa
    tarkavacasa padambhojam shambhorbhaja paramasaukhyam vraja sudhih || 6|| manaste padabje nivasatu
    vacah stotraphanitau karau cabhyarcayam shrutirapi kathakarnanavidhau | tava dhyane buddhirnayanayugalam
    murtivibhave paragranthan kairva paramashiva jane paramatah || 7|| yatha buddhih shuktau rajatamiti
    kacashmani mani- rjale paishte kshiram bhavati mrigatrishnasu salilam | tatha devabhrantya bhajati
    bhavadanyam jadajano mahadevesham tvam manasi ca na matva pashupate || 8|| gabhire kasare vishati
    vijane ghoravipine vishale shaile ca bhramati kusumartham jadamatih | samarpyaikam cetah sarasijamumanatha
    bhavate sukhenavasthatum jana iha na janati kimaho || 9|| naratvam devatvam nagavanamrigatvam mashakata
    pashutvam kitatvam bhavatu vihagatvadi jananam | sada tvatpadabjasmaranaparamanandalahari- viharasaktam
    ceddhridayamiha kim tena vapusha || 10|| vaturva gehi va yatirapi jati va taditaro naro va yah kashcidbhavatu
    bhava kim tena bhavati | yadiyam hritpadmam yadi bhavadadhinam pashupate tadiyastvam shambho bhavasi
    bhavabharam ca vahasi || 11|| guhayam gehe va bahirapi vane va'drishikhare jale va vahnau va vasatu
    vasateh kim vada phalam | sada yasyaivantahkaranamapi shambho tava pade sthitam cedyogo'sau sa ca
    paramayogi sa ca sukhi || 12|| asare samsare nijabhajanadure jadadhiya bhramantam mamandham paramakripaya
    patumucitam | madanyah ko dinastava kripanarakshatinipuna- stvadanyah ko va me trijagati sharanyah
    pashupate || 13|| prabhustvam dinanam khalu paramabandhuh pashupate pramukhyo'ham teshamapi kimuta
    bandhutvamanayoh | tvayaiva kshantavyah shiva madaparadhashca sakalah prayatnatkartavyam madavanamiyam
    bandhusaranih || 14|| upeksha no cet kim na harasi bhavad|hdhyanavimukham durashabhuyishtham vidhilipimashakto
    yadi bhavan | shirastadvaidhatram na na khalu suvrittam pashupate katham va niryatnam karanakhamukhenaiva
    lulitam || 15|| virincirdirghayurbhavatu bhavata tatparashira- shcatushkam samrakshyam sa khalu bhuvi
    dainyam likhitavan | vicarah ko va mam vishada kripaya pati shiva te katakshavyaparah svayamapi ca
    dinavanaparah || 16|| phaladva punyanam mayi karunaya va tvayi vibho prasanne'pi svamin bhavadamalapadabjayugalam
    | katham pashyeyam mam sthagayati namassambhramajusham nilimpanam shrenirnijakanakamanikyamakutaih
    || 17|| tvameko lokanam paramaphalado divyapadavim vahantastvanmulam punarapi bhajante harimukhah
    | kiyadva dakshinyam tava shiva madasha ca kiyati kada va madraksham vahasi karunapuritadrisha ||
    18|| durashabhuyishthe duradhipagrihadvaraghatake durante samsare duritanilaye duhkhajanake | madayasam
    kim na vyapanayasi kasyopakritaye vadeyam pritishcettava shiva kritarthah khalu vayam || 19|| sada
    mohatavyam carati yuvatinam kucagirau natatyashashakhasvatati jhatiti svairamabhitah | kapalin bhiksho
    me hridayakapimatyantacapalam dridham bhaktya baddhva shiva bhavadadhinam kuru vibho || 20|| dhritistambhadharam
    dridhagunanibaddham sagamanam vicitram padmadhyam pratidivasasanmargaghatitam | smarare maccetahsphutapatakutim
    prapya vishadam jaya svamin shaktya saha shiva ganaih sevita vibho || 21|| pralobhadyairarthaharanaparatantro
    dhanigrihe praveshodyuktah san bhramati bahudha taskarapate | imam cetashcoram kathamiha sahe shankara
    vibho tavadhinam kritva mayi niraparadhe kuru kripam || 22|| karomi tvatpujam sapadi sukhado me bhava
    vibho vidhitvam vishnutvam dishasi khalu tasyah phalamiti | punashca tvam drashtum divi bhuvi vahan
    pakshimrigata- madrishtva tatkhedam kathamiha sahe shankara vibho || 23|| kada va kailase kanakamanisaudhe
    saha ganai- rvasan shambhoragre sphutaghatitamurdhanjaliputah | vibho samba svamin paramashiva pahiti
    nigadan vidhatrinam kalpan kshanamiva vineshyami sukhatah || 24|| stavairbrahmadinam jayajayavacobhirniyaminam
    gananam kelibhirmadakalamahokshasya kakudi | sthitam nilagrivam trinayanamumashlishtavapusham kada
    tvam pashyeyam karadhritamrigam khandaparashum || 25|| kada va tvam drishtva girisha tava bhavyanghriyugalam
    grihitva hastabhyam shirasi nayane vakshasi vahan | samashlishyaghraya sphutajalajagandhan parimala-
    nalabhyam brahmadyairmudamanubhavishyami hridaye || 26|| karasthe hemadrau girisha nikatasthe dhanapatau
    grihasthe svarbhuja'marasurabhicintamanigane | shirassthe shitamshau caranayugalasthe'khilashubhe
    kamartham dasye'ham bhavatu bhavadartham mama manah || 27|| sarupyam tava pujane shiva mahadeveti
    sankirtane samipyam shivabhaktidhuryajanatasangatyasambhashane | salokyam ca caracaratmakatanudhyane
    bhavanipate sayujyam mama siddhamatra bhavati svamin kritartho'smyaham || 28|| tvatpadambujamarcayami
    paramam tvam cintayamyanvaham tvamisham sharanam vrajami vacasa tvameva yace vibho | viksham me disha
    cakshushim sakarunam divyaishciram prarthitam shambho lokaguro madiyamanasah saukhyopadesham kuru
    || 29|| vastroddhutavidhau sahasrakarata pushparcane vishnuta gandhe gandhavahatmata'nnapacane barhirmukhadhyakshata
    | patre kancanagarbhatasti mayi ced balenducudamane shushrusham karavani te pashupate svamin trilokiguro
    || 30|| nalam va paramopakarakamidam tvekam pashunam pate pashyan kukshigatan caracaraganan bahyasthitan
    rakshitum | sarvamartyapalayanaushadhamatijvalakaram bhikaram nikshiptam garalam gale na gilitam nodgirnameva
    tvaya || 31|| jvalograh sakalamaratibhayadah kshvelah katham va tvaya drishtah kim ca kare dhritah
    karatale kim pakvajambuphalam | jihvayam nihitashca siddhaghutika va kanthadeshe bhritah kim te nilamanirvibhushanamayam
    shambho mahatman vada || 32|| nalam va sakrideva deva bhavatah seva natirva nutih puja va smaranam
    kathashravanamapyalokanam madrisham | svaminnasthiradevatanusaranayasena kim labhyate ka va muktiritah
    kuto bhavati cet kim prarthaniyam tada || 33|| kim brumastava sahasam pashupate kasyasti shambho bhava-
    ddhairyam cedrishamatmanah sthitiriyam canyaih katham labhyate | bhrashyaddevaganam trasanmuniganam
    nashyatprapancam layam pashyannirbhaya eka eva viharatyanandasandro bhavan || 34|| yogakshemadhurandharasya
    sakalashreyahpradodyogino drishtadrishtamatopadeshakritino bahyantaravyapinah | sarvajnasya dayakarasya
    bhavatah kim veditavyam maya shambho tvam paramantaranga iti me citte smaramyanvaham || 35|| bhakto
    bhaktigunavrite mudamritapurne prasanne manah- kumbhe samba tavanghripallavayugam samsthapya samvitphalam
    | sattvam mantramudirayannijashariragarashuddhim vahan punyaham prakatikaromi ruciram kalyanamapadayan
    || 36|| amnayambudhimadarena sumanassanghah samudyanmano- manthanam dridhabhaktirajjusahitam kritva
    mathitva tatah | somam kalpatarum suparvasurabhim cintamanim dhimatam nityanandasudham nirantararamasaubhagyamatanvate
    || 37|| prakpunyacalamargadarshitasudhamurtih prasannah shivah somah sadgunasevito mrigadharah purnastamomocakah
    | cetah pushkaralakshito bhavati cedanandapathonidhih pragalbhyena vijrimbhate sumanasam vrittistada
    jayate || 38|| dharmo me caturanghrikah sucaritah papam vinasham gatam kamakrodhamadadayo vigalitah
    kalah sukhavishkritah | jnananandamahaushadhih suphalita kaivalyanathe sada manye manasapundarikanagare
    rajavatamse sthite || 39|| dhiyantrena vacoghatena kavitakulyopakulyakramai- ranitaishca sadashivasya
    caritambhorashidivyamritaih | hritkedarayutashca bhaktikalamah saphalyamatanvate durbhikshanmama sevakasya
    bhagavan vishvesha bhitih kutah || 40|| papotpatavimocanaya ruciraishvaryaya mrityunjaya stotradhyananatipradakshinasaparyalokanakarnane
    | jihvacittashironghrihastanayanashrotrairaham prarthito mamajnapaya tannirupaya muhurmameva ma me'vacah
    || 41|| gambhiryam parikhapadam ghanadhritih prakara udyadguna- stomashcaptabalam ghanendriyacayo
    dvarani dehe sthitah | vidyavastusamriddhirityakhilasamagrisamete sada durgatipriyadeva mamakamanodurge
    nivasam kuru || 42|| ma gaccha tvamitastato girisha bho mayyeva vasam kuru svaminnadikirata mamakamanahkantarasimantare
    | vartante bahusho mriga madajusho matsaryamohadaya- stan hatva mrigayavinodarucitalabham ca samprapsyasi
    || 43|| karalagnamrigah karindrabhango ghanashardulavikhandano'stajantuh | girisho vishadakritishca
    cetah- kuhare pancamukhosti me kuto bhih || 44|| chandahshakhishikhanvitairdvijavaraih samsevite shashvate
    saukhyapadini khedabhedini sudhasaraih phalairdipite | cetahpakshishikhamane tyaja vrithasancaramanyairalam
    nityam shankarapadapadmayugalinide viharam kuru || 45|| akirne nakharajikantivibhavairudyatsudhavaibhavai-
    radhautepi ca padmaragalalite hamsavrajairashrite | nityam bhaktivadhuganaishca rahasi svecchaviharam
    kuru sthitva manasarajahamsa girijanathanghrisaudhantare || 46|| shambhudhyanavasantasangini hridarame'ghajirnacchadah
    srasta bhaktilatacchata vilasitah punyapravalashritah | dipyante gunakoraka japavacahpushpani sadvasana
    jnananandasudhamarandalahari samvitphalabhyunnatih || 47|| nityanandarasalayam suramunisvantambujatashrayam
    svaccham saddvijasevitam kalushahritsadvasanavishkritam | shambhudhyanasarovaram vraja mano hamsavatamsa
    sthiram kim kshudrashrayapalvalabhramanasanjatashramam prapsyasi || 48|| anandamritapurita harapadambhojalavalodyata
    sthairyopaghnamupetya bhaktilatika shakhopashakhanvita | uccairmanasakayamanapatalimakramya nishkalmasha
    nityabhishtaphalaprada bhavatu me satkarmasamvardhita || 49|| sandhyarambhavijrimbhitam shrutishirahsthanantaradhishthitam
    sapremabhramarabhiramamasakrit sadvasanashobhitam | bhogindrabharanam samastasumanahpujyam gunavishkritam
    seve shrigirimallikarjunamahalingam shivalingitam || 50|| bhringicchanatanotkatah karimadagrahi sphuranmadhava-
    hlado nadayuto mahasitavapuh panceshuna cadritah | satpakshah sumanovaneshu sa punah sakshanmadiye
    mano- rajive bhramaradhipo viharatam shrishailavasi vibhuh || 51|| karunyamritavarshinam ghanavipad-grishmacchidakarmatham
    vidyasasyaphalodayaya sumanahsamsevyamicchakritim | nrityadbhaktamayuramadrinilayam cancajjatamandalam
    shambho vanchati nilakandhara sada tvam me manashcatakah || 52|| akashena shikhi samastaphaninam netra
    kalapi nata- 'nugrahipranavopadeshaninadaih kekiti yo giyate | shyamam shailasamudbhavam ghanarucim
    drishtva natantam muda vedantopavane vihararasikam tam nilakantham bhaje || 53|| sandhya gharmadinatyayo
    harikaraghataprabhutanaka- dhvano varidagarjitam divishadam drishticchata cancala | bhaktanam paritoshabashpavitatirvrishtirmayuri
    shiva yasminnujjvalatandavam vijayate tam nilakantham bhaje || 54|| adyayamitatejase shrutipadairvedyaya
    sadhyaya te vidyanandamayatmane trijagatah samrakshanodyogine | dhyeyayakhilayogibhih suraganairgeyaya
    mayavine samyaktandavasambhramaya jatine seyam natih shambhave || 55|| nityaya trigunatmane purajite
    katyayanishreyase satyayadikutumbine munimanah pratyakshacinmurtaye | mayasrishtajagattrayaya sakalamnayantasancarine
    sayantandavasambhramaya jatine seyam natih shambhave || 56|| nityam svodarapuranaya sakalanuddishya
    vittashaya (svodaraposhanaya) vyartham paryatanam karomi bhavatah sevam na jane vibho | majjanmantarapunyapakabalatastvam
    sharva sarvantara- stishthasyeva hi tena va pashupate te rakshaniyo'smyaham || 57|| eko varijabandhavah
    kshitinabhovyaptam tamomandalam bhittva locanagocaro'pi bhavati tvam kotisuryaprabhah | vedyah kinna
    bhavasyaho ghanataram kidrigbhavenmattama- statsarvam vyapaniya me pashupate sakshat prasanno bhava
    || 58|| hamsah padmavanam samicchati yatha nilambudam catakah kokah kokanadapriyam pratidinam candram
    cakorastatha | ceto vanchati mamakam pashupate cinmargamrigyam vibho gaurinatha bhavatpadabjayugalam
    kaivalyasaukhyapradam || 59|| rodhastoyahritah shramena pathikashchayam tarorvrishtito bhitah svasthagriham
    grihasthamatithirdinah prabhum dharmikam | dipam santamasakulashca shikhinam shitavritastvam tatha
    cetah sarvabhayapaham vraja sukham shambhoh padambhoruham || 60|| ankolam nijabijasantatirayaskantopalam
    sucika sadhvi naijavibhum lata kshitiruham sindhuh saridvallabham | prapnotiha yatha tatha pashupateh
    padaravindadvayam cetovrittirupetya tishthati sada sa bhaktirityucyate || 61|| anandashrubhiratanoti
    pulakam nairmalyatashchadanam vacashankhamukhe sthitaishca jatharapurtim caritramritaih | rudrakshairbhasitena
    deva vapusho raksham bhavadbhavana- paryanke viniveshya bhaktijanani bhaktarbhakam rakshati || 62||
    margavartitapaduka pashupaterangasya kurcayate gandushambunishecanam puraripordivyabhishekayate |
    kincidbhakshitamamsasheshakabalam navyopaharayate bhaktih kim na karotyaho vanacaro bhaktavatamsayate
    || 63|| vakshastadanamantakasya kathinapasmarasammardanam bhubhritparyatanam namatsurashirahkotirasangharshanam
    | karmedam mridulasya tavakapadadvandvasya kim vocitam maccetomanipadukaviharanam shambho sadangikuru
    || 64|| vakshastadanashankaya vicalito vaivasvato nirjarah kotirojjvalaratnadipakalikanirajanam kurvate
    | drishtva muktivadhustanoti nibhritashlesham bhavanipate yaccetastava padapadmabhajanam tasyeha kim
    durlabham || 65|| kridartham srijasi prapancamakhilam kridamrigaste jana yatkarmacaritam maya ca bhavatah
    prityai bhavatyeva tat | shambho svasya kutuhalasya karanam macceshtitam nishcitam tasmanmamakarakshanam
    pashupate kartavyameva tvaya || 66|| bahuvidhaparitoshabashpapura- sphutapulakankitacarubhogabhumim
    | cirapadaphalakankshisevyamanam paramasadashivabhavanam prapadye || 67|| amitamudamritam muhurduhantim
    vimalabhavatpadagoshthamavasantim | sadaya pashupate supunyapakam mama paripalaya bhaktidhenumekam
    || 68|| jadata pashuta kalankita kutilacaratvam ca nasti mayi deva | asti yadi rajamaule bhavadabharanasya
    nasmi kim patram || 69|| arahasi rahasi svatantrabud|hdhya varivasitum sulabhah prasannamurtih | aganitaphaladayakah
    prabhurme jagadadhiko hridi rajashekharo'sti || 70|| arudhabhaktigunakuncitabhavacapa- yuktaih shivasmaranabanaganairamoghaih
    | nirjitya kilbisharipun vijayi sudhindrah sanandamavahati susthirarajalakshmim || 71|| dhyananjanena
    samavekshya tamahpradesham bhittva mahabalibhirishvaranamamantraih | divyashritam bhujagabhushanamudvahanti
    ye padapadmamiha te shiva te kritarthah || 72|| bhudaratamudavahadyadapekshaya shri- bhudara eva kimatah
    sumate labhasva | kedaramakalitamuktimahaushadhinam padaravindabhajanam parameshvarasya || 73|| ashapashakleshadurvasanadi-
    bhedodyuktairdivyagandhairamandaih | ashashatikasya padaravindam cetahpetim vasitam me tanotu || 74||
    kalyaninam sarasacitragatim savegam sarvengitajnamanagham dhruvalakshanadhyam | cetasturangamadhiruhya
    cara smarare netah samastajagatam vrishabhadhirudha || 75|| bhaktirmaheshapadapushkaramavasanti kadambiniva
    kurute paritoshavarsham | sampurito bhavati yasya manasttataka- stajjanmasasyamakhilam saphalam ca
    na'nyat || 76|| buddhih sthira bhavitumishvarapadapadma- sakta vadhurvirahiniva sada smaranti | sadbhavanasmaranadarshanakirtanadi
    sammohiteva shivamantrajapena vinte || 77|| sadupacaravidhishvanubodhitam savinayam suhridam samupashritam
    | mama samuddhara buddhimimam prabho varagunena navodhavadhumiva || 78|| nityam yogimanah sarojadalasancarakshamastvatkramah
    shambho tena katham kathorayamaradvakshahkavatakshatih | atyantam mridulam tvadanghriyugalam ha me
    manashcintaya- tyetallocanagocaram kuru vibho hastena samvahaye || 79|| eshyatyesha janim mano'sya
    kathinam tasminnataniti ma- drakshayai girisimni komalapadanyasah purabhyasitah | no ceddivyagrihantareshu
    sumanastalpeshu vedyadishu prayah satsu shilataleshu natanam shambho kimartham tava || 80|| kancitkalamumamahesha
    bhavatah padaravindarcanaih kancid|hdhyanasamadhibhishca natibhih kancitkathakarnanaih | kancit kancidavekshanaishca
    nutibhih kanciddashamidrishim yah prapnoti muda tvadarpitamana jivan sa muktah khalu || 81|| banatvam
    vrishabhatvamardhavapusha bharyatvamaryapate ghonitvam sakhita mridangavahata cetyadi rupam dadhau
    | tvatpade nayanarpanam ca kritavan tvaddehabhago harih pujyatpujyatarah sa eva hi na cet ko va tadanyo'dhikah
    || 82|| jananamritiyutanam sevaya devatanam na bhavati sukhaleshah samshayo nasti tatra | ajanimamritarupam
    sambamisham bhajante ya iha paramasaukhyam te hi dhanya labhante || 83|| shiva tava paricaryasannidhanaya
    gaurya bhava mama gunadhuryam buddhikanyam pradasye | sakalabhuvanabandho saccidanandasindho sadaya
    hridayagehe sarvada samvasa tvam || 84|| jaladhimathanadaksho naiva patalabhedi na ca vanamrigayayam
    naiva lubdhah pravinah | ashanakusumabhushavastramukhyam saparyam kathaya kathamaham te kalpayanindumaule
    || 85|| pujadravyasamriddhayo viracitah pujam katham kurmahe pakshitvam na ca va kititvamapi na praptam
    maya durlabham | jane mastakamanghripallavamumajane na te'ham vibho na jnatam hi pitamahena harina
    tattvena tadrupina || 86|| ashanam garalam phani kalapo vasanam carma ca vahanam mahokshah | mama
    dasyasi kim kimasti shambho tava padambujabhaktimeva dehi || 87|| yada kritambhonidhisetubandhanah
    karasthaladhahkritaparvatadhipah | bhavani te langhitapadmasambhavah tada shivarcastavabhavanakshamah
    || 88|| natibhirnutibhistvamisha puja- vidhibhirdhyanasamadhibhirna tushtah | dhanusha musalena cashmabhirva
    vada te pritikaram tatha karomi || 89|| vacasa caritam vadami shambho- rahamudyogavidhasu te'prasaktah
    | manasakritimishvarasya seve shirasa caiva sadashivam namami || 90|| adya'vidya hridgata nirgatasi-
    dvidya hridya hridgata tvatprasadat | seve nityam shrikaram tvatpadabjam bhave mukterbhajanam rajamaule
    || 91|| durikritani duritani duraksharani daurbhagyaduhkhadurahankritidurvacamsi | saram tvadiyacaritam
    nitaram pibantam gaurisha mamiha samuddhara satkatakshaih || 92|| somakaladharamaulau komalaghanakandhare
    mahamahasi | svamini girijanathe mamakahridayam nirantaram ramatam || 93|| sa rasana te nayane taveva
    karau sa eva kritakrityah | ya ye yau yo bhargam vadatikshete sadarcatah smarati || 94|| atimridulau
    mama carana- vatikathinam te mano bhavanisha | iti vicikitsam santyaja shiva kathamasidgirau tatha
    veshah (veshmah) || 95|| dhairyankushena nibhritam rabhasadakrishya bhaktishrinkhalaya | purahara
    caranalane hridayamadebham badhana cidyantraih || 96|| pracaratyabhitah pragalbhavrittya madavanesha
    manahkari gariyan | parigrihya nayena bhaktirajjva parama sthanupadam dridham nayamum || 97|| sarvalankarayuktam
    saralapadayutam sadhuvrittam suvarnam sadbhih samstuyamanam sarasagunayutam lakshitam lakshanadhyam
    | udyadbhushavisheshamupagatavinayam dyotamanartharekham kalyanim deva gauripriya mama kavitakanyakam
    tvam grihana || 98|| idam te yuktam va paramashiva karunyajaladhe gatau tiryagrupam tava padashirodarshanadhiya
    | haribrahmanau tau divi bhuvi carantau shramayutau katham shambho svamin kathaya mama vedyo'si puratah
    || 99|| stotrenalamaham pravacmi na mrisha deva virincadayah stutyanam gananaprasangasamaye tvamagraganyam
    viduh | mahatmyagravicaranaprakarane dhanatushastomava- ddhutastvam viduruttamottamaphalam shambho
    bhavatsevakah || 100|| || iti shrimacchankaracaryaviracita shivanandalahari samapta ||
  devanagari: कलाभ्यां चूडालङ्कृतशशिकलाभ्यां निजतपः- फलाभ्यां भक्तेषु प्रकटितफलाभ्यां भवतु मे । शिवाभ्यामस्तोकत्रिभुवनशिवाभ्यां
    हृदि पुन- र्भवाभ्यामानन्दस्फुरदनुभवाभ्यां नतिरियम् ॥ १॥ गलन्ती शम्भो त्वच्चरितसरितः किल्बिषरजो दलन्ती
    धीकुल्यासरणिषु पतन्ती विजयताम् । दिशन्ती संसारभ्रमणपरितापोपशमनं वसन्ती मच्चेतोह्रदभुवि शिवानन्दलहरी
    ॥ २॥ त्रयीवेद्यं हृद्यं त्रिपुरहरमाद्यं त्रिनयनं जटाभारोदारं चलदुरगहारं मृगधरम् । महादेवं देवं मयि
    सदयभावं पशुपतिं चिदालम्बं साम्बं शिवमतिविडम्बं हृदि भजे ॥ ३॥ सहस्रं वर्तन्ते जगति विबुधाः क्षुद्रफलदा
    न मन्ये स्वप्ने वा तदनुसरणं तत्कृतफलम् । हरिब्रह्मादीनामपि निकटभाजामसुलभं चिरं याचे शम्भो शिव तव पदाम्भोजभजनम्
    ॥ ४॥ स्मृतौ शास्त्रे वैद्ये शकुनकवितागानफणितौ पुराणे मन्त्रे वा स्तुतिनटनहास्येष्वचतुरः । कथं राज्ञां
    प्रीतिर्भवति मयि कोऽहं पशुपते पशुं मां सर्वज्ञ प्रथितकृपया पालय विभो ॥ ५॥ घटो वा मृत्पिण्डोऽप्यणुरपि
    च धूमोऽग्निरचलः पटो वा तन्तुर्वा परिहरति किं घोरशमनम् । वृथा कण्ठक्षोभं वहसि तरसा तर्कवचसा पदाम्भोजं
    शम्भोर्भज परमसौख्यं व्रज सुधीः ॥ ६॥ मनस्ते पादाब्जे निवसतु वचः स्तोत्रफणितौ करौ चाभ्यर्चायां श्रुतिरपि
    कथाकर्णनविधौ । तव ध्याने बुद्धिर्नयनयुगलं मूर्तिविभवे परग्रन्थान् कैर्वा परमशिव जाने परमतः ॥ ७॥ यथा
    बुद्धिः शुक्तौ रजतमिति काचाश्मनि मणि- र्जले पैष्टे क्षीरं भवति मृगतृष्णासु सलिलम् । तथा देवभ्रान्त्या
    भजति भवदन्यं जडजनो महादेवेशं त्वां मनसि च न मत्वा पशुपते ॥ ८॥ गभीरे कासारे विशति विजने घोरविपिने विशाले
    शैले च भ्रमति कुसुमार्थं जडमतिः । समर्प्यैकं चेतः सरसिजमुमानाथ भवते सुखेनावस्थातुं जन इह न जानाति
    किमहो ॥ ९॥ नरत्वं देवत्वं नगवनमृगत्वं मशकता पशुत्वं कीटत्वं भवतु विहगत्वादि जननम् । सदा त्वत्पादाब्जस्मरणपरमानन्दलहरी-
    विहारासक्तं चेद्धृदयमिह किं तेन वपुषा ॥ १०॥ वटुर्वा गेही वा यतिरपि जटी वा तदितरो नरो वा यः कश्चिद्भवतु
    भव किं तेन भवति । यदीयं हृत्पद्मं यदि भवदधीनं पशुपते तदीयस्त्वं शम्भो भवसि भवभारं च वहसि ॥ ११॥ गुहायां
    गेहे वा बहिरपि वने वाऽद्रिशिखरे जले वा वह्नौ वा वसतु वसतेः किं वद फलम् । सदा यस्यैवान्तःकरणमपि शम्भो
    तव पदे स्थितं चेद्योगोऽसौ स च परमयोगी स च सुखी ॥ १२॥ असारे संसारे निजभजनदूरे जडधिया भ्रमन्तं मामन्धं
    परमकृपया पातुमुचितम् । मदन्यः को दीनस्तव कृपणरक्षातिनिपुण- स्त्वदन्यः को वा मे त्रिजगति शरण्यः पशुपते
    ॥ १३॥ प्रभुस्त्वं दीनानां खलु परमबन्धुः पशुपते प्रमुख्योऽहं तेषामपि किमुत बन्धुत्वमनयोः । त्वयैव क्षन्तव्याः
    शिव मदपराधाश्च सकलाः प्रयत्नात्कर्तव्यं मदवनमियं बन्धुसरणिः ॥ १४॥ उपेक्षा नो चेत् किं न हरसि भवद्।ह्ध्यानविमुखां
    दुराशाभूयिष्ठां विधिलिपिमशक्तो यदि भवान् । शिरस्तद्वैधात्रं न न खलु सुवृत्तं पशुपते कथं वा निर्यत्नं
    करनखमुखेनैव लुलितम् ॥ १५॥ विरिञ्चिर्दीर्घायुर्भवतु भवता तत्परशिर- श्चतुष्कं संरक्ष्यं स खलु भुवि दैन्यं
    लिखितवान् । विचारः को वा मां विशद कृपया पाति शिव ते कटाक्षव्यापारः स्वयमपि च दीनावनपरः ॥ १६॥ फलाद्वा
    पुण्यानां मयि करुणया वा त्वयि विभो प्रसन्नेऽपि स्वामिन् भवदमलपादाब्जयुगलम् । कथं पश्येयं मां स्थगयति
    नमस्सम्भ्रमजुषां निलिम्पानां श्रेणिर्निजकनकमाणिक्यमकुटैः ॥ १७॥ त्वमेको लोकानां परमफलदो दिव्यपदवीं
    वहन्तस्त्वन्मूलां पुनरपि भजन्ते हरिमुखाः । कियद्वा दाक्षिण्यं तव शिव मदाशा च कियती कदा वा मद्रक्षां
    वहसि करुणापूरितदृशा ॥ १८॥ दुराशाभूयिष्ठे दुरधिपगृहद्वारघटके दुरन्ते संसारे दुरितनिलये दुःखजनके । मदायासं
    किं न व्यपनयसि कस्योपकृतये वदेयं प्रीतिश्चेत्तव शिव कृतार्थाः खलु वयम् ॥ १९॥ सदा मोहाटव्यां चरति युवतीनां
    कुचगिरौ नटत्याशाशाखास्वटति झटिति स्वैरमभितः । कपालिन् भिक्षो मे हृदयकपिमत्यन्तचपलं दृढं भक्त्या बद्ध्वा
    शिव भवदधीनं कुरु विभो ॥ २०॥ धृतिस्तम्भाधारां दृढगुणनिबद्धां सगमनां विचित्रां पद्माढ्यां प्रतिदिवससन्मार्गघटिताम्
    । स्मरारे मच्चेतःस्फुटपटकुटीं प्राप्य विशदां जय स्वामिन् शक्त्या सह शिव गणैः सेवित विभो ॥ २१॥ प्रलोभाद्यैरर्थाहरणपरतन्त्रो
    धनिगृहे प्रवेशोद्युक्तः सन् भ्रमति बहुधा तस्करपते । इमं चेतश्चोरं कथमिह सहे शङ्कर विभो तवाधीनं कृत्वा
    मयि निरपराधे कुरु कृपाम् ॥ २२॥ करोमि त्वत्पूजां सपदि सुखदो मे भव विभो विधित्वं विष्णुत्वं दिशसि खलु
    तस्याः फलमिति । पुनश्च त्वां द्रष्टुं दिवि भुवि वहन् पक्षिमृगता- मदृष्ट्वा तत्खेदं कथमिह सहे शङ्कर
    विभो ॥ २३॥ कदा वा कैलासे कनकमणिसौधे सह गणै- र्वसन् शम्भोरग्रे स्फुटघटितमूर्धाञ्जलिपुटः । विभो साम्ब
    स्वामिन् परमशिव पाहीति निगदन् विधातॄणां कल्पान् क्षणमिव विनेष्यामि सुखतः ॥ २४॥ स्तवैर्ब्रह्मादीनां
    जयजयवचोभिर्नियमिनां गणानां केलीभिर्मदकलमहोक्षस्य ककुदि । स्थितं नीलग्रीवं त्रिनयनमुमाश्लिष्टवपुषं
    कदा त्वां पश्येयं करधृतमृगं खण्डपरशुम् ॥ २५॥ कदा वा त्वां दृष्ट्वा गिरिश तव भव्याङ्घ्रियुगलं गृहीत्वा
    हस्ताभ्यां शिरसि नयने वक्षसि वहन् । समाश्लिष्याघ्राय स्फुटजलजगन्धान् परिमला- नलभ्यां ब्रह्माद्यैर्मुदमनुभविष्यामि
    हृदये ॥ २६॥ करस्थे हेमाद्रौ गिरिश निकटस्थे धनपतौ गृहस्थे स्वर्भूजाऽमरसुरभिचिन्तामणिगणे । शिरस्स्थे
    शीतांशौ चरणयुगलस्थेऽखिलशुभे कमर्थं दास्येऽहं भवतु भवदर्थं मम मनः ॥ २७॥ सारूप्यं तव पूजने शिव महादेवेति
    सङ्कीर्तने सामीप्यं शिवभक्तिधुर्यजनतासाङ्गत्यसम्भाषणे । सालोक्यं च चराचरात्मकतनुध्याने भवानीपते सायुज्यं
    मम सिद्धमत्र भवति स्वामिन् कृतार्थोऽस्म्यहम् ॥ २८॥ त्वत्पादाम्बुजमर्चयामि परमं त्वां चिन्तयाम्यन्वहं
    त्वामीशं शरणं व्रजामि वचसा त्वामेव याचे विभो । वीक्षां मे दिश चाक्षुषीं सकरुणां दिव्यैश्चिरं प्रार्थितां
    शम्भो लोकगुरो मदीयमनसः सौख्योपदेशं कुरु ॥ २९॥ वस्त्रोद्धूतविधौ सहस्रकरता पुष्पार्चने विष्णुता गन्धे
    गन्धवहात्मताऽन्नपचने बर्हिर्मुखाध्यक्षता । पात्रे काञ्चनगर्भतास्ति मयि चेद् बालेन्दुचूडामणे शुश्रूषां
    करवाणि ते पशुपते स्वामिन् त्रिलोकीगुरो ॥ ३०॥ नालं वा परमोपकारकमिदं त्वेकं पशूनां पते पश्यन् कुक्षिगतान्
    चराचरगणान् बाह्यस्थितान् रक्षितुम् । सर्वामर्त्यपलायनौषधमतिज्वालाकरं भीकरं निक्षिप्तं गरलं गले न गिलितं
    नोद्गीर्णमेव त्वया ॥ ३१॥ ज्वालोग्रः सकलामरातिभयदः क्ष्वेलः कथं वा त्वया दृष्टः किं च करे धृतः करतले
    किं पक्वजम्बूफलम् । जिह्वायां निहितश्च सिद्धघुटिका वा कण्ठदेशे भृतः किं ते नीलमणिर्विभूषणमयं शम्भो
    महात्मन् वद ॥ ३२॥ नालं वा सकृदेव देव भवतः सेवा नतिर्वा नुतिः पूजा वा स्मरणं कथाश्रवणमप्यालोकनं मादृशाम्
    । स्वामिन्नस्थिरदेवतानुसरणायासेन किं लभ्यते का वा मुक्तिरितः कुतो भवति चेत् किं प्रार्थनीयं तदा ॥
    ३३॥ किं ब्रूमस्तव साहसं पशुपते कस्यास्ति शम्भो भव- द्धैर्यं चेदृशमात्मनः स्थितिरियं चान्यैः कथं लभ्यते
    । भ्रश्यद्देवगणं त्रसन्मुनिगणं नश्यत्प्रपञ्चं लयं पश्यन्निर्भय एक एव विहरत्यानन्दसान्द्रो भवान् ॥
    ३४॥ योगक्षेमधुरन्धरस्य सकलश्रेयःप्रदोद्योगिनो दृष्टादृष्टमतोपदेशकृतिनो बाह्यान्तरव्यापिनः । सर्वज्ञस्य
    दयाकरस्य भवतः किं वेदितव्यं मया शम्भो त्वं परमान्तरङ्ग इति मे चित्ते स्मराम्यन्वहम् ॥ ३५॥ भक्तो भक्तिगुणावृते
    मुदमृतापूर्णे प्रसन्ने मनः- कुम्भे साम्ब तवाङ्घ्रिपल्लवयुगं संस्थाप्य संवित्फलम् । सत्त्वं मन्त्रमुदीरयन्निजशरीरागारशुद्धिं
    वहन् पुण्याहं प्रकटीकरोमि रुचिरं कल्याणमापादयन् ॥ ३६॥ आम्नायाम्बुधिमादरेण सुमनस्सङ्घाः समुद्यन्मनो-
    मन्थानं दृढभक्तिरज्जुसहितं कृत्वा मथित्वा ततः । सोमं कल्पतरुं सुपर्वसुरभिं चिन्तामणिं धीमतां नित्यानन्दसुधां
    निरन्तररमासौभाग्यमातन्वते ॥ ३७॥ प्राक्पुण्याचलमार्गदर्शितसुधामूर्तिः प्रसन्नः शिवः सोमः सद्गुणसेवितो
    मृगधरः पूर्णस्तमोमोचकः । चेतः पुष्करलक्षितो भवति चेदानन्दपाथोनिधिः प्रागल्भ्येन विजृम्भते सुमनसां
    वृत्तिस्तदा जायते ॥ ३८॥ धर्मो मे चतुरङ्घ्रिकः सुचरितः पापं विनाशं गतं कामक्रोधमदादयो विगलिताः कालाः
    सुखाविष्कृताः । ज्ञानानन्दमहौषधिः सुफलिता कैवल्यनाथे सदा मान्ये मानसपुण्डरीकनगरे राजावतंसे स्थिते
    ॥ ३९॥ धीयन्त्रेण वचोघटेन कविताकुल्योपकुल्याक्रमै- रानीतैश्च सदाशिवस्य चरिताम्भोराशिदिव्यामृतैः । हृत्केदारयुताश्च
    भक्तिकलमाः साफल्यमातन्वते दुर्भिक्षान्मम सेवकस्य भगवन् विश्वेश भीतिः कुतः ॥ ४०॥ पापोत्पातविमोचनाय
    रुचिरैश्वर्याय मृत्युञ्जय स्तोत्रध्याननतिप्रदक्षिणसपर्यालोकनाकर्णने । जिह्वाचित्तशिरोङ्घ्रिहस्तनयनश्रोत्रैरहं
    प्रार्थितो मामाज्ञापय तन्निरूपय मुहुर्मामेव मा मेऽवचः ॥ ४१॥ गाम्भीर्यं परिखापदं घनधृतिः प्राकार उद्यद्गुण-
    स्तोमश्चाप्तबलं घनेन्द्रियचयो द्वाराणि देहे स्थितः । विद्यावस्तुसमृद्धिरित्यखिलसामग्रीसमेते सदा दुर्गातिप्रियदेव
    मामकमनोदुर्गे निवासं कुरु ॥ ४२॥ मा गच्छ त्वमितस्ततो गिरिश भो मय्येव वासं कुरु स्वामिन्नादिकिरात मामकमनःकान्तारसीमान्तरे
    । वर्तन्ते बहुशो मृगा मदजुषो मात्सर्यमोहादय- स्तान् हत्वा मृगयाविनोदरुचितालाभं च सम्प्राप्स्यसि ॥
    ४३॥ करलग्नमृगः करीन्द्रभङ्गो घनशार्दूलविखण्डनोऽस्तजन्तुः । गिरिशो विशदाकृतिश्च चेतः- कुहरे पञ्चमुखोस्ति
    मे कुतो भीः ॥ ४४॥ छन्दःशाखिशिखान्वितैर्द्विजवरैः संसेविते शाश्वते सौख्यापादिनि खेदभेदिनि सुधासारैः
    फलैर्दीपिते । चेतःपक्षिशिखामणे त्यज वृथासञ्चारमन्यैरलं नित्यं शङ्करपादपद्मयुगलीनीडे विहारं कुरु ॥
    ४५॥ आकीर्णे नखराजिकान्तिविभवैरुद्यत्सुधावैभवै- राधौतेपि च पद्मरागललिते हंसव्रजैराश्रिते । नित्यं भक्तिवधूगणैश्च
    रहसि स्वेच्छाविहारं कुरु स्थित्वा मानसराजहंस गिरिजानाथाङ्घ्रिसौधान्तरे ॥ ४६॥ शम्भुध्यानवसन्तसङ्गिनि
    हृदारामेऽघजीर्णच्छदाः स्रस्ता भक्तिलताच्छटा विलसिताः पुण्यप्रवालश्रिताः । दीप्यन्ते गुणकोरका जपवचःपुष्पाणि
    सद्वासना ज्ञानानन्दसुधामरन्दलहरी संवित्फलाभ्युन्नतिः ॥ ४७॥ नित्यानन्दरसालयं सुरमुनिस्वान्ताम्बुजाताश्रयं
    स्वच्छं सद्द्विजसेवितं कलुषहृत्सद्वासनाविष्कृतम् । शम्भुध्यानसरोवरं व्रज मनो हंसावतंस स्थिरं किं क्षुद्राश्रयपल्वलभ्रमणसञ्जातश्रमं
    प्राप्स्यसि ॥ ४८॥ आनन्दामृतपूरिता हरपदाम्भोजालवालोद्यता स्थैर्योपघ्नमुपेत्य भक्तिलतिका शाखोपशाखान्विता
    । उच्चैर्मानसकायमानपटलीमाक्रम्य निष्कल्मषा नित्याभीष्टफलप्रदा भवतु मे सत्कर्मसंवर्धिता ॥ ४९॥ सन्ध्यारम्भविजृम्भितं
    श्रुतिशिरःस्थानान्तराधिष्ठितं सप्रेमभ्रमराभिराममसकृत् सद्वासनाशोभितम् । भोगीन्द्राभरणं समस्तसुमनःपूज्यं
    गुणाविष्कृतं सेवे श्रीगिरिमल्लिकार्जुनमहालिङ्गं शिवालिङ्गितम् ॥ ५०॥ भृङ्गीच्छानटनोत्कटः करिमदग्राही
    स्फुरन्माधवा- ह्लादो नादयुतो महासितवपुः पञ्चेषुणा चादृतः । सत्पक्षः सुमनोवनेषु स पुनः साक्षान्मदीये
    मनो- राजीवे भ्रमराधिपो विहरतां श्रीशैलवासी विभुः ॥ ५१॥ कारुण्यामृतवर्षिणं घनविपद्-ग्रीष्मच्छिदाकर्मठं
    विद्यासस्यफलोदयाय सुमनःसंसेव्यमिच्छाकृतिम् । नृत्यद्भक्तमयूरमद्रिनिलयं चञ्चज्जटामण्डलं शम्भो वाञ्छति
    नीलकन्धर सदा त्वां मे मनश्चातकः ॥ ५२॥ आकाशेन शिखी समस्तफणिनां नेत्रा कलापी नता- ऽनुग्राहिप्रणवोपदेशनिनदैः
    केकीति यो गीयते । श्यामां शैलसमुद्भवां घनरुचिं दृष्ट्वा नटन्तं मुदा वेदान्तोपवने विहाररसिकं तं नीलकण्ठं
    भजे ॥ ५३॥ सन्ध्या घर्मदिनात्ययो हरिकराघातप्रभूतानक- ध्वानो वारिदगर्जितं दिविषदां दृष्टिच्छटा चञ्चला
    । भक्तानां परितोषबाष्पविततिर्वृष्टिर्मयूरी शिवा यस्मिन्नुज्ज्वलताण्डवं विजयते तं नीलकण्ठं भजे ॥ ५४॥
    आद्यायामिततेजसे श्रुतिपदैर्वेद्याय साध्याय ते विद्यानन्दमयात्मने त्रिजगतः संरक्षणोद्योगिने । ध्येयायाखिलयोगिभिः
    सुरगणैर्गेयाय मायाविने सम्यक्ताण्डवसम्भ्रमाय जटिने सेयं नतिः शम्भवे ॥ ५५॥ नित्याय त्रिगुणात्मने पुरजिते
    कात्यायनीश्रेयसे सत्यायादिकुटुम्बिने मुनिमनः प्रत्यक्षचिन्मूर्तये । मायासृष्टजगत्त्रयाय सकलाम्नायान्तसञ्चारिणे
    सायन्ताण्डवसम्भ्रमाय जटिने सेयं नतिः शम्भवे ॥ ५६॥ नित्यं स्वोदरपूरणाय सकलानुद्दिश्य वित्ताशया (स्वोदरपोषणाय)
    व्यर्थं पर्यटनं करोमि भवतः सेवां न जाने विभो । मज्जन्मान्तरपुण्यपाकबलतस्त्वं शर्व सर्वान्तर- स्तिष्ठस्येव
    हि तेन वा पशुपते ते रक्षणीयोऽस्म्यहम् ॥ ५७॥ एको वारिजबान्धवः क्षितिनभोव्याप्तं तमोमण्डलं भित्त्वा
    लोचनगोचरोऽपि भवति त्वं कोटिसूर्यप्रभः । वेद्यः किन्न भवस्यहो घनतरं कीदृग्भवेन्मत्तम- स्तत्सर्वं व्यपनीय
    मे पशुपते साक्षात् प्रसन्नो भव ॥ ५८॥ हंसः पद्मवनं समिच्छति यथा नीलाम्बुदं चातकः कोकः कोकनदप्रियं प्रतिदिनं
    चन्द्रं चकोरस्तथा । चेतो वाञ्छति मामकं पशुपते चिन्मार्गमृग्यं विभो गौरीनाथ भवत्पदाब्जयुगलं कैवल्यसौख्यप्रदम्
    ॥ ५९॥ रोधस्तोयहृतः श्रमेण पथिकश्छायां तरोर्वृष्टितो भीतः स्वस्थगृहं गृहस्थमतिथिर्दीनः प्रभुं धार्मिकम्
    । दीपं सन्तमसाकुलश्च शिखिनं शीतावृतस्त्वं तथा चेतः सर्वभयापहं व्रज सुखं शम्भोः पदाम्भोरुहम् ॥ ६०॥
    अङ्कोलं निजबीजसन्ततिरयस्कान्तोपलं सूचिका साध्वी नैजविभुं लता क्षितिरुहं सिन्धुः सरिद्वल्लभम् । प्राप्नोतीह
    यथा तथा पशुपतेः पादारविन्दद्वयं चेतोवृत्तिरुपेत्य तिष्ठति सदा सा भक्तिरित्युच्यते ॥ ६१॥ आनन्दाश्रुभिरातनोति
    पुलकं नैर्मल्यतश्छादनं वाचाशङ्खमुखे स्थितैश्च जठरापूर्तिं चरित्रामृतैः । रुद्राक्षैर्भसितेन देव वपुषो
    रक्षां भवद्भावना- पर्यङ्के विनिवेश्य भक्तिजननी भक्तार्भकं रक्षति ॥ ६२॥ मार्गावर्तितपादुका पशुपतेरङ्गस्य
    कूर्चायते गण्डूषाम्बुनिषेचनं पुररिपोर्दिव्याभिषेकायते । किञ्चिद्भक्षितमांसशेषकबलं नव्योपहारायते भक्तिः
    किं न करोत्यहो वनचरो भक्तावतंसायते ॥ ६३॥ वक्षस्ताडनमन्तकस्य कठिनापस्मारसम्मर्दनं भूभृत्पर्यटनं नमत्सुरशिरःकोटीरसङ्घर्षणम्
    । कर्मेदं मृदुलस्य तावकपदद्वन्द्वस्य किं वोचितं मच्चेतोमणिपादुकाविहरणं शम्भो सदाङ्गीकुरु ॥ ६४॥ वक्षस्ताडनशङ्कया
    विचलितो वैवस्वतो निर्जराः कोटीरोज्ज्वलरत्नदीपकलिकानीराजनं कुर्वते । दृष्ट्वा मुक्तिवधूस्तनोति निभृताश्लेषं
    भवानीपते यच्चेतस्तव पादपद्मभजनं तस्येह किं दुर्लभम् ॥ ६५॥ क्रीडार्थं सृजसि प्रपञ्चमखिलं क्रीडामृगास्ते
    जना यत्कर्माचरितं मया च भवतः प्रीत्यै भवत्येव तत् । शम्भो स्वस्य कुतूहलस्य करणं मच्चेष्टितं निश्चितं
    तस्मान्मामकरक्षणं पशुपते कर्तव्यमेव त्वया ॥ ६६॥ बहुविधपरितोषबाष्पपूर- स्फुटपुलकाङ्कितचारुभोगभूमिम्
    । चिरपदफलकाङ्क्षिसेव्यमानां परमसदाशिवभावनां प्रपद्ये ॥ ६७॥ अमितमुदमृतं मुहुर्दुहन्तीं विमलभवत्पदगोष्ठमावसन्तीम्
    । सदय पशुपते सुपुण्यपाकां मम परिपालय भक्तिधेनुमेकाम् ॥ ६८॥ जडता पशुता कलङ्किता कुटिलचरत्वं च नास्ति
    मयि देव । अस्ति यदि राजमौले भवदाभरणस्य नास्मि किं पात्रम् ॥ ६९॥ अरहसि रहसि स्वतन्त्रबुद्।ह्ध्या वरिवसितुं
    सुलभः प्रसन्नमूर्तिः । अगणितफलदायकः प्रभुर्मे जगदधिको हृदि राजशेखरोऽस्ति ॥ ७०॥ आरूढभक्तिगुणकुञ्चितभावचाप-
    युक्तैः शिवस्मरणबाणगणैरमोघैः । निर्जित्य किल्बिषरिपून् विजयी सुधीन्द्रः सानन्दमावहति सुस्थिरराजलक्ष्मीम्
    ॥ ७१॥ ध्यानाञ्जनेन समवेक्ष्य तमःप्रदेशं भित्त्वा महाबलिभिरीश्वरनाममन्त्रैः । दिव्याश्रितं भुजगभूषणमुद्वहन्ति
    ये पादपद्ममिह ते शिव ते कृतार्थाः ॥ ७२॥ भूदारतामुदवहद्यदपेक्षया श्री- भूदार एव किमतः सुमते लभस्व ।
    केदारमाकलितमुक्तिमहौषधीनां पादारविन्दभजनं परमेश्वरस्य ॥ ७३॥ आशापाशक्लेशदुर्वासनादि- भेदोद्युक्तैर्दिव्यगन्धैरमन्दैः
    । आशाशाटीकस्य पादारविन्दं चेतःपेटीं वासितां मे तनोतु ॥ ७४॥ कल्याणिनं सरसचित्रगतिं सवेगं सर्वेङ्गितज्ञमनघं
    ध्रुवलक्षणाढ्यम् । चेतस्तुरङ्गमधिरुह्य चर स्मरारे नेतः समस्तजगतां वृषभाधिरूढ ॥ ७५॥ भक्तिर्महेशपदपुष्करमावसन्ती
    कादम्बिनीव कुरुते परितोषवर्षम् । सम्पूरितो भवति यस्य मनस्त्तटाक- स्तज्जन्मसस्यमखिलं सफलं च नाऽन्यत्
    ॥ ७६॥ बुद्धिः स्थिरा भवितुमीश्वरपादपद्म- सक्ता वधूर्विरहिणीव सदा स्मरन्ती । सद्भावनास्मरणदर्शनकीर्तनादि
    सम्मोहितेव शिवमन्त्रजपेन विन्ते ॥ ७७॥ सदुपचारविधिष्वनुबोधितां सविनयां सुहृदं समुपाश्रिताम् । मम समुद्धर
    बुद्धिमिमां प्रभो वरगुणेन नवोढवधूमिव ॥ ७८॥ नित्यं योगिमनः सरोजदलसञ्चारक्षमस्त्वत्क्रमः शम्भो तेन कथं
    कठोरयमराड्वक्षःकवाटक्षतिः । अत्यन्तं मृदुलं त्वदङ्घ्रियुगलं हा मे मनश्चिन्तय- त्येतल्लोचनगोचरं कुरु
    विभो हस्तेन संवाहये ॥ ७९॥ एष्यत्येष जनिं मनोऽस्य कठिनं तस्मिन्नटानीति म- द्रक्षायै गिरिसीम्नि कोमलपदन्यासः
    पुराभ्यासितः । नो चेद्दिव्यगृहान्तरेषु सुमनस्तल्पेषु वेद्यादिषु प्रायः सत्सु शिलातलेषु नटनं शम्भो
    किमर्थं तव ॥ ८०॥ कञ्चित्कालमुमामहेश भवतः पादारविन्दार्चनैः कञ्चिद्।ह्ध्यानसमाधिभिश्च नतिभिः कञ्चित्कथाकर्णनैः
    । कञ्चित् कञ्चिदवेक्षणैश्च नुतिभिः कञ्चिद्दशामीदृशीं यः प्राप्नोति मुदा त्वदर्पितमना जीवन् स मुक्तः
    खलु ॥ ८१॥ बाणत्वं वृषभत्वमर्धवपुषा भार्यात्वमार्यापते घोणित्वं सखिता मृदङ्गवहता चेत्यादि रूपं दधौ
    । त्वत्पादे नयनार्पणं च कृतवान् त्वद्देहभागो हरिः पूज्यात्पूज्यतरः स एव हि न चेत् को वा तदन्योऽधिकः
    ॥ ८२॥ जननमृतियुतानां सेवया देवतानां न भवति सुखलेशः संशयो नास्ति तत्र । अजनिममृतरूपं साम्बमीशं भजन्ते
    य इह परमसौख्यं ते हि धन्या लभन्ते ॥ ८३॥ शिव तव परिचर्यासन्निधानाय गौर्या भव मम गुणधुर्यां बुद्धिकन्यां
    प्रदास्ये । सकलभुवनबन्धो सच्चिदानन्दसिन्धो सदय हृदयगेहे सर्वदा संवस त्वम् ॥ ८४॥ जलधिमथनदक्षो नैव पातालभेदी
    न च वनमृगयायां नैव लुब्धः प्रवीणः । अशनकुसुमभूषावस्त्रमुख्यां सपर्यां कथय कथमहं ते कल्पयानीन्दुमौले
    ॥ ८५॥ पूजाद्रव्यसमृद्धयो विरचिताः पूजां कथं कुर्महे पक्षित्वं न च वा किटित्वमपि न प्राप्तं मया दुर्लभम्
    । जाने मस्तकमङ्घ्रिपल्लवमुमाजाने न तेऽहं विभो न ज्ञातं हि पितामहेन हरिणा तत्त्वेन तद्रूपिणा ॥ ८६॥
    अशनं गरलं फणी कलापो वसनं चर्म च वाहनं महोक्षः । मम दास्यसि किं किमस्ति शम्भो तव पादाम्बुजभक्तिमेव
    देहि ॥ ८७॥ यदा कृताम्भोनिधिसेतुबन्धनः करस्थलाधःकृतपर्वताधिपः । भवानि ते लङ्घितपद्मसम्भवः तदा शिवार्चास्तवभावनक्षमः
    ॥ ८८॥ नतिभिर्नुतिभिस्त्वमीश पूजा- विधिभिर्ध्यानसमाधिभिर्न तुष्टः । धनुषा मुसलेन चाश्मभिर्वा वद ते
    प्रीतिकरं तथा करोमि ॥ ८९॥ वचसा चरितं वदामि शम्भो- रहमुद्योगविधासु तेऽप्रसक्तः । मनसाकृतिमीश्वरस्य
    सेवे शिरसा चैव सदाशिवं नमामि ॥ ९०॥ आद्याऽविद्या हृद्गता निर्गतासी- द्विद्या हृद्या हृद्गता त्वत्प्रसादात्
    । सेवे नित्यं श्रीकरं त्वत्पदाब्जं भावे मुक्तेर्भाजनं राजमौले ॥ ९१॥ दूरीकृतानि दुरितानि दुरक्षराणि
    दौर्भाग्यदुःखदुरहङ्कृतिदुर्वचांसि । सारं त्वदीयचरितं नितरां पिबन्तं गौरीश मामिह समुद्धर सत्कटाक्षैः
    ॥ ९२॥ सोमकलाधरमौलौ कोमलघनकन्धरे महामहसि । स्वामिनि गिरिजानाथे मामकहृदयं निरन्तरं रमताम् ॥ ९३॥ सा रसना
    ते नयने तावेव करौ स एव कृतकृत्यः । या ये यौ यो भर्गं वदतीक्षेते सदार्चतः स्मरति ॥ ९४॥ अतिमृदुलौ मम
    चरणा- वतिकठिनं ते मनो भवानीश । इति विचिकित्सां सन्त्यज शिव कथमासीद्गिरौ तथा वेशः (वेश्मः) ॥ ९५॥ धैर्याङ्कुशेन
    निभृतं रभसादाकृष्य भक्तिशृङ्खलया । पुरहर चरणालाने हृदयमदेभं बधान चिद्यन्त्रैः ॥ ९६॥ प्रचरत्यभितः प्रगल्भवृत्त्या
    मदवानेष मनःकरी गरीयान् । परिगृह्य नयेन भक्तिरज्ज्वा परम स्थाणुपदं दृढं नयामुम् ॥ ९७॥ सर्वालङ्कारयुक्तां
    सरलपदयुतां साधुवृत्तां सुवर्णां सद्भिः संस्तूयमानां सरसगुणयुतां लक्षितां लक्षणाढ्याम् । उद्यद्भूषाविशेषामुपगतविनयां
    द्योतमानार्थरेखां कल्याणीं देव गौरीप्रिय मम कविताकन्यकां त्वं गृहाण ॥ ९८॥ इदं ते युक्तं वा परमशिव
    कारुण्यजलधे गतौ तिर्यग्रूपं तव पदशिरोदर्शनधिया । हरिब्रह्माणौ तौ दिवि भुवि चरन्तौ श्रमयुतौ कथं शम्भो
    स्वामिन् कथय मम वेद्योऽसि पुरतः ॥ ९९॥ स्तोत्रेणालमहं प्रवच्मि न मृषा देवा विरिञ्चादयः स्तुत्यानां
    गणनाप्रसङ्गसमये त्वामग्रगण्यं विदुः । माहात्म्याग्रविचारणप्रकरणे धानातुषस्तोमव- द्धूतास्त्वां विदुरुत्तमोत्तमफलं
    शम्भो भवत्सेवकाः ॥ १००॥ ॥ इति श्रीमच्छङ्कराचार्यविरचित शिवानन्दलहरी समाप्ता ॥
