id: ekashlokidurga
category: stotram
name:
  english: ekashlokidurga
  devanagari: एकश्लोकीदुर्गा
content:
  english: ekashloki durga om durgayai namah | ya amba madhukaitabhapramathini ya mahishonmulini ya dhumrekshana
    candamundamathini ya raktabijashini | shaktih shumbhanishumbhadaityadalini ya siddhalakshmih para
    sa durga navakotivishvasahita mam patu vishveshvari ||
  devanagari: एकश्लोकी दुर्गा ॐ दुर्गायै नमः । या अम्बा मधुकैटभप्रमथिनी या माहिषोन्मूलिनी या धूम्रेक्षण
    चन्डमुण्डमथिनी या रक्तबीजाशिनी । शक्तिः शुम्भनिशुम्भदैत्यदलिनी या सिद्धलक्ष्मीः परा सा दुर्गा नवकोटिविश्वसहिता
    मां पातु विश्वेश्वरी ॥
meaning: {}
