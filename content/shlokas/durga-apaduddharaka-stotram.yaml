id: durga-apaduddharaka-stotram
category: stotram
name:
  english: Durga Apaduddharaka Stotram
content:
  english: namaste sharanye shive sanukampe namaste jagadvyapike vishvarupe | namaste jagadvandyapadaravinde
    namaste jagattarini trahi durge || || namaste jagaccintyamanasvarupe namaste mahayogivijnanarupe |
    namaste namaste sadanandarupe namaste jagattarini trahi durge || || anathasya dinasya trishnaturasya
    bhayartasya bhitasya baddhasya jantoh | tvameka gatirdevi nistarakartri namaste jagattarini trahi
    durge || || aranye rane darune shatrumadhye 'nale sagare prantare rajagehe | tvameka gatirdevi nistaranauka
    namaste jagattarini trahi durge || || apare mahadustare'tyantaghore vipatsagare majjatam dehabhajam
    | tvameka gatirdevi nistarahetu rnamaste jagattarini trahi durge || || namashcandike candadurdandalila
    samutkhandita khandita'sheshashatroh | tvameka gatirdevi nistarabijam namaste jagattarini trahi durge
    || || tvameka sadaradhita satyavadi nyanekakhila krodhana krodhanishtha | ida pingala tvam sushumna
    ca nadi namaste jagattarini trahi durge || || namo devi durge shive bhimanade sadasarvasiddhipradatrisvarupe
    | vibhutih shaci kalaratrih sati tvam namaste jagattarini trahi durge || || sharanamasi suranam siddhavidyadharanam
    munimanujapashunam dasyubhistrasitanam nripatigrihagatanam vyadhibhih piditanam | tvamasi sharanameka
    devi durge prasida || || idam stotram maya proktamapaduddharahetukam | trisandhyamekasandhyam va pathanadghorasankatat
    || || mucyate natra sandeho bhuvi svarge rasatale | sarvam va shlokamekam va yah pathedbhaktimansada
    || || sa sarvam dushkritam tyaktva prapnoti paramam padam | pathanadasya deveshi kim na siddhyati
    bhutale | stavarajamidam devi sankshepatkathitam maya || iti shri siddheshvaritantre paramashivokta
    shri durga apaduddhara stotram |
  devanagari: नमस्ते शरण्ये शिवे सानुकम्पे नमस्ते जगद्व्यापिके विश्वरूपे । नमस्ते जगद्वन्द्यपादारविन्दे
    नमस्ते जगत्तारिणि त्राहि दुर्गे ॥ ॥ नमस्ते जगच्चिन्त्यमानस्वरूपे नमस्ते महायोगिविज्ञानरूपे । नमस्ते
    नमस्ते सदानन्दरूपे नमस्ते जगत्तारिणि त्राहि दुर्गे ॥ ॥ अनाथस्य दीनस्य तृष्णातुरस्य भयार्तस्य भीतस्य
    बद्धस्य जन्तोः । त्वमेका गतिर्देवि निस्तारकर्त्री नमस्ते जगत्तारिणि त्राहि दुर्गे ॥ ॥ अरण्ये रणे दारुणे
    शत्रुमध्ये ऽनले सागरे प्रान्तरे राजगेहे । त्वमेका गतिर्देवि निस्तारनौका नमस्ते जगत्तारिणि त्राहि दुर्गे
    ॥ ॥ अपारे महादुस्तरेऽत्यन्तघोरे विपत्सागरे मज्जतां देहभाजाम् । त्वमेका गतिर्देवि निस्तारहेतु र्नमस्ते
    जगत्तारिणि त्राहि दुर्गे ॥ ॥ नमश्चण्डिके चण्डदुर्दण्डलीला समुत्खण्डिता खण्डिताऽशेषशत्रोः । त्वमेका
    गतिर्देवि निस्तारबीजं नमस्ते जगत्तारिणि त्राहि दुर्गे ॥ ॥ त्वमेका सदाराधिता सत्यवादि न्यनेकाखिला क्रोधना
    क्रोधनिष्ठा । इडा पिङ्गला त्वं सुषुम्ना च नाडी नमस्ते जगत्तारिणि त्राहि दुर्गे ॥ ॥ नमो देवि दुर्गे
    शिवे भीमनादे सदासर्वसिद्धिप्रदातृस्वरूपे । विभूतिः शची कालरात्रिः सती त्वं नमस्ते जगत्तारिणि त्राहि
    दुर्गे ॥ ॥ शरणमसि सुराणां सिद्धविद्याधराणां मुनिमनुजपशूनां दस्युभिस्त्रासितानां नृपतिगृहगतानां व्याधिभिः
    पीडितानाम् । त्वमसि शरणमेका देवि दुर्गे प्रसीद ॥ ॥ इदं स्तोत्रं मया प्रोक्तमापदुद्धारहेतुकम् । त्रिसन्ध्यमेकसन्ध्यं
    वा पठनाद्घोरसङ्कटात् ॥ ॥ मुच्यते नात्र सन्देहो भुवि स्वर्गे रसातले । सर्वं वा श्लोकमेकं वा यः पठेद्भक्तिमान्सदा
    ॥ ॥ स सर्वं दुष्कृतं त्यक्त्वा प्राप्नोति परमं पदम् । पठनादस्य देवेशि किं न सिद्ध्यति भूतले । स्तवराजमिदं
    देवि सङ्क्षेपात्कथितं मया ॥ इति श्री सिद्धेश्वरीतन्त्रे परमशिवोक्त श्री दुर्गा आपदुद्धार स्तोत्रम्
    ।
