id: sri-siddha-lakshmi-stotram
category: stotram
name:
  english: Sri Siddha Lakshmi Stotram
content:
  english: asya shrisiddhalakshmistotramantrasya hiranyagarbha rishih anushtup chandah shrimahakalimahalakshmimahasarasvatyo
    devatah shrim bijam hrim shaktih klim kilakam mama sarvakleshapidapariharartham sarvaduhkhadaridryanashanartham
    sarvakaryasiddhyartham shrisiddhilakshmistotra pathe viniyogah || rishyadinyasah om hiranyagarbha
    rishaye namah shirasi | anushtupchandase namo mukhe | shrimahakalimahalakshmimahasarasvatidevatabhyo
    namo hridih | shrim bijaya namo guhye | hrim shaktaye namah padayoh | klim kilakaya namo nabhau |
    viniyogaya namah sarvangeshu || karanyasah om shrim siddhalakshmyai angushthabhyam namah | om hrim
    vishnutejase tarjanibhyam namah | om klim amritanandayai madhyamabhyam namah | om shrim daityamalinyai
    anamikabhyam namah | om hrim tejah prakashinyai kanishthikabhyam namah | om klim brahmyai vaishnavyai
    rudranyai karatala karaprishthabhyam namah || anganyasah om shrim siddhalakshmyai hridayaya namah
    | om hrim vishnutejase shirase svaha | om klim amritanandayai shikhayai vashat | om shrim daityamalinyai
    kavacaya hum | om hrim tejah prakashinyai netratrayaya vaushat | om klim brahmyai vaishnavyai rudranyai
    astraya phat || om shrim hrim klim shrim siddhalakshmyai namah iti digbandhah || atha dhyanam brahmim
    ca vaishnavim bhadram shadbhujam ca caturmukhim | trinetram khadgatrishulapadmacakragadadharam ||
    || pitambaradharam devim nanalankarabhushitam | tejahpunjadharim shreshtham dhyayedbalakumarikam ||
    || atha stotram onkaram lakshmirupam tu vishnum vagbhavamavyayam | vishnumanandamavyaktam hrinkaram
    bijarupinim || || klim amritanandinim bhadram satyanandadayinim | shrim daityashamanim shaktim malinim
    shatrumardinim || || tejah prakashinim devim varadam shubhakarinim | brahmim ca vaishnavim raudrim
    kalikarupashobhinim || || akare lakshmirupam tu ukare vishnumavyayam | makarah purusho'vyakto devi
    pranava ucyate || || suryakotipratikasham candrakotisamaprabham | tanmadhye nikaram sukshmam brahmarupam
    vyavasthitam || || onkaram paramanandam sadaiva surasundarim | siddhalakshmi mokshalakshmi adyalakshmi
    namo'stu te || || shrinkaram paramam siddham sarvabuddhipradayakam | saubhagya'mrita kamala satyalakshmi
    namo'stu te || || hrinkaram paramam shuddham paramaishvaryadayakam | kamala dhanada lakshmi bhogalakshmi
    namo'stu te || || klinkaram kamarupinyam kamanaparipurtidam | capala cancala lakshmi katyayani namo'stu
    te || || shrinkaram siddhirupinyam sarvasiddhipradayakam | padmananam jaganmatre ashtalakshmim namo'stu
    te || || sarvamangalamangalye shive sarvarthasadhike | sharanye tryambake gauri narayani namo'stu
    te || || prathamam tryambaka gauri dvitiyam vaishnavi tatha | tritiyam kamala prokta caturtham sundari
    tatha || || pancamam vishnushaktishca shashtham katyayani tatha | varahi saptamam caiva hyashtamam
    harivallabha || || navamam khadgini prokta dashamam caiva devika | ekadasham siddhalakshmirdvadasham
    hamsavahini || || uttaranyasah om shrim siddhalakshmyai hridayaya namah | om hrim vishnutejase shirase
    svaha | om klim amritanandayai shikhayai vashat | om shrim daityamalinyai kavacaya hum | om hrim tejah
    prakashinyai netratrayaya vaushat | om klim brahmyai vaishnavyai rudranyai astraya phat || om shrim
    hrim klim shrim siddhalakshmyai namah iti digvimokah || atha phalashritih etat stotravaram devya ye
    pathanti sada narah | sarvapadbhyo vimucyante natra karya vicarana || || ekamasam dvimasam ca trimasam
    ca catusthatha | pancamasam ca shanmasam trikalam yah sada pathet || || brahmanah kleshito duhkhi
    daridryabhayapiditah | janmantara sahasrotthairmucyate sarvakilbashaih || || daridro labhate lakshmimaputrah
    putravan bhavet | dhanyo yashasvi shatrughno vahnicaurabhayeshu ca || || shakini bhuta vetala sarpa
    vyaghra nipatane | rajadvare sabhasthane karagrihanibandhane || || ishvarena kritam stotram praninam
    hitakarakam | stuvantu brahmanah nityam daridryam na ca badhate || || sarvapapahara lakshmih sarvasiddhipradayinim
    | sadhakah labhate sarvam pathet stotram nirantaram || || prarthana ya shrih padmavane kadambashikhare
    rajagrihe kunjare shvete cashvayute vrishe ca yugale yajne ca yupasthite | shankhe daivakule narendrabhavane
    gangatate gokule sa shristishthatu sarvada mama grihe bhuyat sada nishcala || ya sa padmasanastha
    vipulakatitati padmapatrayatakshi gambhiravartanabhih stanabharanamita shuddhavastrottariya | lakshmirdivyairgajendrairmaniganakhacitaih
    snapita hemakumbhaih nityam sa padmahasta mama vasatu grihe sarvamangalyayukta || iti shribrahmapurane
    ishvaravishnusamvade shri siddhalakshmi stotram ||
  devanagari: अस्य श्रीसिद्धलक्ष्मीस्तोत्रमन्त्रस्य हिरण्यगर्भ ऋषिः अनुष्टुप् छन्दः श्रीमहाकालीमहालक्ष्मीमहासरस्वत्यो
    देवताः श्रीं बीजं ह्रीं शक्तिः क्लीं कीलकं मम सर्वक्लेशपीडापरिहारार्थं सर्वदुःखदारिद्र्यनाशनार्थं
    सर्वकार्यसिद्ध्यर्थं श्रीसिद्धिलक्ष्मीस्तोत्र पाठे विनियोगः ॥ ऋष्यादिन्यासः ॐ हिरण्यगर्भ ऋषये नमः
    शिरसि । अनुष्टुप्छन्दसे नमो मुखे । श्रीमहाकालीमहालक्ष्मीमहासरस्वतीदेवताभ्यो नमो हृदिः । श्रीं बीजाय
    नमो गुह्ये । ह्रीं शक्तये नमः पादयोः । क्लीं कीलकाय नमो नाभौ । विनियोगाय नमः सर्वाङ्गेषु ॥ करन्यासः
    ॐ श्रीं सिद्धलक्ष्म्यै अङ्गुष्ठाभ्यां नमः । ॐ ह्रीं विष्णुतेजसे तर्जनीभ्यां नमः । ॐ क्लीं अमृतानन्दायै
    मध्यमाभ्यां नमः । ॐ श्रीं दैत्यमालिन्यै अनामिकाभ्यां नमः । ॐ ह्रीं तेजः प्रकाशिन्यै कनिष्ठिकाभ्यां
    नमः । ॐ क्लीं ब्राह्म्यै वैष्णव्यै रुद्राण्यै करतल करपृष्ठाभ्यां नमः ॥ अङ्गन्यासः ॐ श्रीं सिद्धलक्ष्म्यै
    हृदयाय नमः । ॐ ह्रीं विष्णुतेजसे शिरसे स्वाहा । ॐ क्लीं अमृतानन्दायै शिखायै वषट् । ॐ श्रीं दैत्यमालिन्यै
    कवचाय हुम् । ॐ ह्रीं तेजः प्रकाशिन्यै नेत्रत्रयाय वौषट् । ॐ क्लीं ब्राह्म्यै वैष्णव्यै रुद्राण्यै
    अस्त्राय फट् ॥ ॐ श्रीं ह्रीं क्लीं श्रीं सिद्धलक्ष्म्यै नमः इति दिग्बन्धः ॥ अथ ध्यानम् ब्राह्मीं च
    वैष्णवीं भद्रां षड्भुजां च चतुर्मुखीम् । त्रिनेत्रां खड्गत्रिशूलपद्मचक्रगदाधराम् ॥ ॥ पीताम्बरधरां
    देवीं नानालङ्कारभूषिताम् । तेजःपुञ्जधरीं श्रेष्ठां ध्यायेद्बालकुमारिकाम् ॥ ॥ अथ स्तोत्रम् ओङ्कारं
    लक्ष्मीरूपं तु विष्णुं वाग्भवमव्ययम् । विष्णुमानन्दमव्यक्तं ह्रीङ्कारं बीजरूपिणीम् ॥ ॥ क्लीं अमृतानन्दिनीं
    भद्रां सत्यानन्ददायिनीम् । श्रीं दैत्यशमनीं शक्तिं मालिनीं शत्रुमर्दिनीम् ॥ ॥ तेजः प्रकाशिनीं देवीं
    वरदां शुभकारिणीम् । ब्राह्मीं च वैष्णवीं रौद्रीं कालिकारूपशोभिनीम् ॥ ॥ अकारे लक्ष्मीरूपं तु उकारे
    विष्णुमव्ययम् । मकारः पुरुषोऽव्यक्तो देवी प्रणव उच्यते ॥ ॥ सूर्यकोटिप्रतीकाशं चन्द्रकोटिसमप्रभम् ।
    तन्मध्ये निकरं सूक्ष्मं ब्रह्मरुपं व्यवस्थितम् ॥ ॥ ओङ्कारं परमानन्दं सदैव सुरसुन्दरीम् । सिद्धलक्ष्मी
    मोक्षलक्ष्मी आद्यलक्ष्मी नमोऽस्तु ते ॥ ॥ श्रीङ्कारं परमं सिद्धं सर्वबुद्धिप्रदायकम् । सौभाग्याऽमृता
    कमला सत्यलक्ष्मी नमोऽस्तु ते ॥ ॥ ह्रीङ्कारं परमं शुद्धं परमैश्वर्यदायकम् । कमला धनदा लक्ष्मी भोगलक्ष्मी
    नमोऽस्तु ते ॥ ॥ क्लीङ्कारं कामरूपिण्यं कामनापरिपूर्तिदम् । चपला चञ्चला लक्ष्मी कात्यायनी नमोऽस्तु
    ते ॥ ॥ श्रीङ्कारं सिद्धिरूपिण्यं सर्वसिद्धिप्रदायकम् । पद्माननां जगन्मात्रे अष्टलक्ष्मीं नमोऽस्तु
    ते ॥ ॥ सर्वमङ्गलमाङ्गल्ये शिवे सर्वार्थसाधिके । शरण्ये त्र्यम्बके गौरि नारायणी नमोऽस्तु ते ॥ ॥ प्रथमं
    त्र्यम्बका गौरी द्वितीयं वैष्णवी तथा । तृतीयं कमला प्रोक्ता चतुर्थं सुन्दरी तथा ॥ ॥ पञ्चमं विष्णुशक्तिश्च
    षष्ठं कात्यायनी तथा । वाराही सप्तमं चैव ह्यष्टमं हरिवल्लभा ॥ ॥ नवमं खड्गिनी प्रोक्ता दशमं चैव देविका
    । एकादशं सिद्धलक्ष्मीर्द्वादशं हंसवाहिनी ॥ ॥ उत्तरन्यासः ॐ श्रीं सिद्धलक्ष्म्यै हृदयाय नमः । ॐ ह्रीं
    विष्णुतेजसे शिरसे स्वाहा । ॐ क्लीं अमृतानन्दायै शिखायै वषट् । ॐ श्रीं दैत्यमालिन्यै कवचाय हुम् । ॐ
    ह्रीं तेजः प्रकाशिन्यै नेत्रत्रयाय वौषट् । ॐ क्लीं ब्राह्म्यै वैष्णव्यै रुद्राण्यै अस्त्राय फट् ॥
    ॐ श्रीं ह्रीं क्लीं श्रीं सिद्धलक्ष्म्यै नमः इति दिग्विमोकः ॥ अथ फलशृतिः एतत् स्तोत्रवरं देव्या ये
    पठन्ति सदा नराः । सर्वापद्भ्यो विमुच्यन्ते नात्र कार्या विचारणा ॥ ॥ एकमासं द्विमासं च त्रिमासं च चतुस्थथा
    । पञ्चमासं च षण्मासं त्रिकालं यः सदा पठेत् ॥ ॥ ब्राह्मणः क्लेशितो दुःखी दारिद्र्यभयपीडितः । जन्मान्तर
    सहस्रोत्थैर्मुच्यते सर्वकिल्बषैः ॥ ॥ दरिद्रो लभते लक्ष्मीमपुत्रः पुत्रवान् भवेत् । धन्यो यशस्वी शत्रुघ्नो
    वह्निचौरभयेषु च ॥ ॥ शाकिनी भूत वेताल सर्प व्याघ्र निपातने । राजद्वारे सभास्थाने कारागृहनिबन्धने ॥
    ॥ ईश्वरेण कृतं स्तोत्रं प्राणिनां हितकारकम् । स्तुवन्तु ब्राह्मणाः नित्यं दारिद्र्यं न च बाधते ॥ ॥
    सर्वपापहरा लक्ष्मीः सर्वसिद्धिप्रदायिनीम् । साधकाः लभते सर्वं पठेत् स्तोत्रं निरन्तरम् ॥ ॥ प्रार्थना
    या श्रीः पद्मवने कदम्बशिखरे राजगृहे कुञ्जरे श्वेते चाश्वयुते वृषे च युगले यज्ञे च यूपस्थिते । शङ्खे
    दैवकुले नरेन्द्रभवने गङ्गातटे गोकुले सा श्रीस्तिष्ठतु सर्वदा मम गृहे भूयात् सदा निश्चला ॥ या सा पद्मासनस्था
    विपुलकटितटी पद्मपत्रायताक्षी गम्भीरावर्तनाभिः स्तनभरनमिता शुद्धवस्त्रोत्तरीया । लक्ष्मीर्दिव्यैर्गजेन्द्रैर्मणिगणखचितैः
    स्नापिता हेमकुम्भैः नित्यं सा पद्महस्ता मम वसतु गृहे सर्वमाङ्गल्ययुक्ता ॥ इति श्रीब्रह्मपुराणे ईश्वरविष्णुसंवादे
    श्री सिद्धलक्ष्मी स्तोत्रम् ॥
