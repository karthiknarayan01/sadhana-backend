id: completerraksha-2
category: raksha
name:
  english: completerraksha
  devanagari: चोम्प्लेतेर्रक्श
content:
  english: devyadya skandaputraya ramarakshabhimantranam | kuru tarakaghataya samartho'yam bhavishyati
    || 4|| ityuktva kathayamasa ramaraksham shivah striyai | namaskritya ramacandram shucirbhutva jitendriyah
    || 5|| atha dhyanam | vame kodandadandam nijakarakamale dakshine banamekam pashcadbhage ca nityam
    dadhatamabhimatam sasitunirabharam | vame'vame vasadbhayam saha militatanum janakilakshmanabhyam shyamam
    ramam bhaje'ham pranatajanamanahkhedavicchedadaksham || 6|| om asya shriramarakshastotramantrasya
    budhakaushikarishih | shriramacandro devata rama iti bijam | anushtup chandah | shriramaprityarthe
    jape viniyogah || || om || caritam raghunathasya shatakotipravistaram | ekaikamaksharam pumsam mahapatakanashanam
    || 7|| dhyatva nilotpalashyamam ramam rajivalocanam | janakilakshmanopetam jatamukutamanditam || 8||
    sasitunadhanurbanapanim naktancarantakam | svalilaya jagattratumavirbhutamajam vibhum || 9|| ramaraksham
    pathetprajnah papaghnim sarvakamadam | shiro me raghavah patu bhalam dasharathatmajah || 10|| kausalyeyo
    drishau patu vishvamitrapriyah shruti | ghranam patu makhatrata mukham saumitrivatsalah || 11|| jihvam
    vidyanidhih patu kantham bharatavanditah | skandhau divyayudhah patu bhujau bhagneshakarmukah || 12||
    karau sitapatih patu hridayam jamadagnyajit | parshve raghuvarah patu kukshi ikshvakunandanah || 13
    || madhyam patu kharadhvamsi nabhim jambavadashrayah | sugriveshah katim patu sakthini hanumatprabhuh
    || 14|| uru raghuttamah patu guhyam rakshahkulantakrit | januni setukrit patu janghe dashamukhantakah
    || 15|| padau vibhishanashridah patu ramo'khilam vapuh | etam ramabalopetam raksham yah sukriti pathet
    || sa cirayuh sukhi putri vijayi vinayi bhavet || 16|| patalabhutalavyomacarinashchadmacarinah | na
    drashtumapi shaktaste rakshitam ramanamabhih || 17|| rameti ramabhadreti ramacandreti va smaran |
    naro na lipyate papairbhuktim muktim ca vindati || 18|| jagajjaitraikamantrena ramanamna'bhirakshitam
    | yah kanthe dharayettasya karasthah sarvasiddhayah || 19|| vajrapanjaranamedam yo ramakavacam pathet
    | avyahatajnah sarvatra labhate jayamangalam || 20|| adishtavan yatha svapne ramarakshamimam harah
    | tatha likhitavan pratah prabuddho budhakaushikah || 21|| ramo dasharathih shuro lakshmana'nucaro
    bali || kakutsthah purushah purnah kausalyanandavardhanah || 22|| vedantavedyo yajneshah puranapurushottamah
    | janakivallabhah shrimanaprameyaparakramah || 23|| ityetani japennityam yadbhaktah shraddhaya'nvitah
    | ashvamedhadhikam punyam labhate natrasamshayah || 24||
  devanagari: देव्यद्य स्कन्दपुत्राय रामरक्षाभिमन्त्रणम् । कुरु तारकघाताय समर्थोऽयं भविष्यति ॥ ४॥ इत्युक्त्वा
    कथयामास रामरक्षां शिवः स्त्रियै । नमस्कृत्य रामचन्द्रं शुचिर्भूत्वा जितेन्द्रियः ॥ ५॥ अथ ध्यानम् ।
    वामे कोदण्डदण्डं निजकरकमले दक्षिणे बाणमेकं पश्चाद्भागे च नित्यं दधतमभिमतं सासितूणीरभारम् । वामेऽवामे
    वसद्भयां सह मिलिततनुं जानकीलक्ष्मणाभ्यां श्यामं रामं भजेऽहं प्रणतजनमनःखेदविच्छेददक्षम् ॥ ६॥ ॐ अस्य
    श्रीरामरक्षास्तोत्रमन्त्रस्य बुधकौशिकऋषिः । श्रीरामचन्द्रो देवता राम इति बीजम् । अनुष्टुप् छन्दः ।
    श्रीरामप्रीत्यर्थे जपे विनियोगः ॥ ॥ ॐ ॥ चरितं रघुनाथस्य शतकोटिप्रविस्तरम् । एकैकमक्षरं पुंसां महापातकनाशनम्
    ॥ ७॥ ध्यात्वा नीलोत्पलश्यामं रामं राजीवलोचनम् । जानकीलक्ष्मणोपेतं जटामुकुटमण्डितम् ॥ ८॥ सासितूणधनुर्बाणपाणिं
    नक्तञ्चरान्तकम् । स्वलीलया जगत्त्रातुमाविर्भूतमजं विभुम् ॥ ९॥ रामरक्षां पठेत्प्राज्ञः पापघ्नीं सर्वकामदाम्
    । शिरो मे राघवः पातु भालं दशरथात्मजः ॥ १०॥ कौसल्येयो दृशौ पातु विश्वामित्रप्रियः श्रुती । घ्राणं पातु
    मखत्राता मुखं सौमित्रिवत्सलः ॥ ११॥ जिह्वां विद्यानिधिः पातु कण्ठं भरतवन्दितः । स्कन्धौ दिव्यायुधः
    पातु भुजौ भग्नेशकार्मुकः ॥ १२॥ करौ सीतापतिः पातु हृदयं जामदग्न्यजित् । पार्श्वे रघुवरः पातु कुक्षी
    इक्ष्वाकुनन्दनः ॥ १३ ॥ मध्यं पातु खरध्वंसी नाभिं जाम्बवदाश्रयः । सुग्रीवेशः कटिं पातु सक्थिनी हनुमत्प्रभुः
    ॥ १४॥ ऊरू रघूत्तमः पातु गुह्यं रक्षःकुलान्तकृत् । जानुनी सेतुकृत् पातु जङ्घे दशमुखान्तकः ॥ १५॥ पादौ
    विभीषणश्रीदः पातु रामोऽखिलं वपुः । एतां रामबलोपेतां रक्षां यः सुकृती पठेत् ॥ स चिरायुः सुखी पुत्री
    विजयी विनयी भवेत् ॥ १६॥ पातालभूतलव्योमचारिणश्छद्मचारिणः । न द्रष्टुमपि शक्तास्ते रक्षितं रामनामभिः
    ॥ १७॥ रामेति रामभद्रेति रामचन्द्रेति वा स्मरन् । नरो न लिप्यते पापैर्भुक्तिं मुक्तिं च विन्दति ॥ १८॥
    जगज्जैत्रैकमन्त्रेण रामनाम्नाऽभिरक्षितम् । यः कण्ठे धरयेत्तस्य करस्थाः सर्वसिद्धयः ॥ १९॥ वज्रपञ्जरनामेदं
    यो रामकवचं पठेत् । अव्याहताज्ञः सर्वत्र लभते जयमङ्गलम् ॥ २०॥ आदिष्टवान् यथा स्वप्ने रामरक्षामिमां
    हरः । तथा लिखितवान् प्रातः प्रबुद्धो बुधकौशिकः ॥ २१॥ रामो दशरथिः शूरो लक्ष्मणाऽनुचरो बली ॥ काकुत्स्थः
    पुरुषः पूर्णः कौसल्यानन्दवर्धनः ॥ २२॥ वेदान्तवेद्यो यज्ञेशः पुराणपुरुषोत्तमः । जानकीवल्लभः श्रीमानप्रमेयपराक्रमः
    ॥ २३॥ इत्येतानि जपेन्नित्यं यद्भक्तः श्रद्धयाऽन्वितः । अश्वमेधाधिकं पुण्यं लभते नात्रसंशयः ॥ २४॥
