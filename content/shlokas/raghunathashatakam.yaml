id: raghunathashatakam
category: shataka
name:
  english: raghunathashatakam
  devanagari: रघुनाथशतकम्
content:
  english: ringaram prathitamupaharam mahibhuvo raho rasam rasam rasati raghunatho'dhikudharama || 43||
    kutire vanire vidhuvimalanire susaritah sutire saddhire shishiritasamire trinamaye | virajan rajanyo
    bhuvanakuladhanyo'vanijaya prapanneshu preshtho dravati raghunatho'dhikudharam || 44|| kripadrishtya
    vrishtya kalitasukhasrishtya trijagatam tudamstapam papam bhavabhayakalapam kalapadaih | bhavanijanishto
    vibudhavinateshto nijagira jananandasyandam cyavati raghunatho'dhikudharam || 45|| || pushpitagra
    || abhinavavanamuktatamalanilam nigamamanushvabhigitasaumyashilam | janakanripasutavaram vararham
    sharanamaham raghunathamemi bhaktyai || 46|| manasijashatakotikamyakantim manasijashatrunisrishtashishtashantim
    | manasijatatataptatapatantim manasijakam raghunathamashrayami || 47|| karunamanasamadbhutasvabhavam
    pranatajanavanadikshamartaraksham | raghukulakumudendumishvaresham sharanamaham raghunathamavrajami
    || 48|| bhavadavadahanena dahyamano vipinakariva karalakalakalyah | harinatrishikrishah kulaulyalobhah
    sharanamaye raghunathasattatagam || 49|| vishayavishabhujangadashtasattvo madanamanorathabhutakabhibhutah
    | maranabhayata aturo mumukshuh sharanamaye raghunathagarudikam || 50|| jahi jahi raghunatha vasanahim
    na kuru vilambamanathanatha kekin | tvayi khalu vimukhe subahushatrau harishishumenamashishyatiha
    bhekah || 51|| nahi mama japayagayogashakti rna khalu samadhividhau ca me pratitih | gatadrisha iva
    yashtirartabandho tvamasi sada raghunatha me'valambah || 52|| jagati janimatamavamananadhyah shunaka
    ivasmi kutumbato nirastah | kalikalilagato yatha jaradgau khanamaham raghunathato'pyapekshe || 53||
    gunaganajaladhe kripaikamurte bhuvanapate pranataikakamapurte | raghuvara varaniyashilasindho svajanamimam
    raghunatha pahyanatham || 54|| || upendravajra || tava svabhavo raghunatha idri ggrihitaraga ripavo'pi
    yatra | na baddhavairo'pi dashananastvam kadapi nindaspadamatatana || 55|| na ko'pi mitram nahi ko'pi
    shatru stavattrilokyam raghunatha rama | ato jagau shrikavikokilo'pi muhu ripunamapi vatsalam tvam
    || 56|| vahannakekanpratilomalokam stathapi matuh payasi sprihavan | dhruvam svabhavo raghunatha te'ya
    manoraniyastvamayaprakashah || 57|| samastalokeshvaralokapala yadajnaya svam caritarthayanti | sa
    eva gadheyavashamvado'bhu tsa kassvabhavo raghunatha citram || 58|| tvadiyapadabjarajo'bhimarsha dbabhuva
    puta hyaghavatyahalya | tathapi pashcattapase'bhimrishya padasprishe tvam raghunatha papam || 59||
    niragaso'pyaha vivasanam te pita samatra parinoditah san | tathapi no vivyathishe na nindam cakartha
    rushto raghunatha matuh || 60|| cakara papam jadadhirjayanto bibheda cancva caranau kujayah | tathapi
    no roshavasham jagantha kiyanmridustvam raghunatha shilat || 61|| vihaya rajyam suradurlabham tvam
    suvarnamayamrigamanvadhavah | na veda yatnadapi te svabhavam svabhishtanakam raghunatha vakam || 62||
    babandha paulastyasutavameho bhavantamugraih kila nagapashaih | bhavanapimam prajighaya nakam kiyadvicitram
    raghunathashilam || 63|| || indravajra || ye nama japtva munayo durantam samsarabandham tarasa tudanti
    | sa tvam katham shakrajita nibaddhah kidriksvabhavo raghunatha te'yam || 64|| yatpadapankeruhasevaya
    vai sarvajnatam yanti munindravaryah | mudho yatha shatrumriterupayam pricchasyaho shriraghunatha
    mitram || 65|| sitagatim bho raghunatha priccha syenadikanajnavadartacittah | muktim katham rasi jatayushe
    vai kidrigvirodhiva tava svabhavah || 66|| suryasya suryasya hi saurimitram vishnoshca vishnoh kapayah
    sahayah | lakshmyashca lakshmyah raghunatha kashtam sarvam svabhavasya samanjasam te || 67|| sita
    virajatyatha manase te lankam tathapi prahinoshi vatim | nunam laghunvardhayitum taveshta ceshta vishishta
    raghunathadrishta || 68|| sankalpato yasya virancisargo jagrajjagatyam yasha atanoti | sa tvam katham
    shoshayitum samudram sandhatumaiccho raghunatha banam || 69|| durvaryakalo'sti dhanuryadiyam samvatsaratma
    yadamoghabanah | sa tvam katham rakshasanashanaya nirdeshtumaiksho raghunatha kishan || 70|| nunam
    svabhavo raghunatha te'sau sankridase yallaghubhishca kishaih | mitre ca sugrivavibhishanau te putro
    vayah shrihanumamstvadiyah || 71|| tam te svabhavam parito nishamya shrutva tvadiyanca dayalutambho
    | tvannishthacittah sharanam prapadye tvamaturam mam raghunatha raksha || 72|| || upajatih || yatsaccidanandavapurbibharshi
    svapritaye shriraghunatha ramyam | tadeva drishtva pratibimbabhave mugdho narinartsi kiyadvicitram
    || 73|| na modase tvam padapadmadhulya papamahalyamapi tarayitva | cekhidyase vai raghunatha tatke
    padasprishe kidrigaho svabhavah || 74|| vibhajya capam trinabhanjamaje rna va sma darpam raghunatha
    yasi | svayamvare janakijaitramalam grihnasi namro vinayah kiyamste || 75|| kutharapaneh parushaksharani
    svikritya vakyani yathashishastvam | na roshamagah kritapadapujo lokatigam te raghunatha shilam ||
    76|| guham niguhanbharatanbhujabhyam cakartha mitram nanu mitramitrah | svapadapathojamarandatoyam
    kaivartakebhyo raghunatha rasi || 77|| cakara yadyapyahitam priyayah kakayamano jadadhirjayantah |
    tathapi tasmai dadithasudanam vilakshanam te raghunatha shilam || 78|| pituh kriyayam bharatam niyujya
    jatayushah shraddhamaho cakartha | tasmai hyadah sviyagatim ca bhaktim kidriksvabhavo raghunatha te'sau
    || 79|| ambatraye jagriti vatsaladhye yadbhillabhamam jananimakarshih | idam hi te shriraghunatha
    nunam divyasvabhavanuganam caritram || 80|| svayam samartho'tiratho'pi virah sugrivamukhyamshca vibhishanam
    ca | cakartha mitrani nijansahaya ntadeva te shriraghunatha shilam || 81|| || indravamsha || tam te
    svabhavam parimrishya shatruha nsamsarasindhau patito'tipamarah | papi prapadye tava padapallavam
    dinanukampin raghunatha raksha mam || 82|| yadyapyaham jatu jado'tijalmako mayapishaci paribhutasatvakah
    | kintu tvamapyartiharo hararcita stasmatprapannam raghunatha pahi mam || 83|| naivasti madrigbhuvaneshu
    pataki tvadricca naivasti jagatsvaghapahah | ityavayorbrahmakritam hyananvayam trayasva yatnadraghunatha
    ma tyaja || 84|| janannapi svam duritaikasagaram vatsalyavardhinca bhavantamishvaram | tyaktva trapam
    tvam sharanam samashraye nunam vratam no raghunatha hasyase || 85|| yasyam kripadevasarityanekashah
    krurannrishamsanprapunasi papinah | tasyam katham papashiromanim hi mam putam vidhatum raghunatha
    lajjase || 86|| ekatra garjankalikalakunjaro madbuddhivallim prasabham jighatsati | anyatra mamadhipriyam
    pishacini netum vinasham raghunatha nathate || 87|| yadyapyaham krurakukarmapapa bhugdandyo bhaveyam
    nahi natha vismayah | kintu tvadanghrau patitasya pidaya lokapavado raghunatha te bhavet || 88|| kamam
    vrajeyam narakeshvanekadha papacyamanah katukarmajagnina | kintu tvadanghryambujabhavanasavo ma manasanme
    raghunatha hiyatam || 89|| ma yahi duram patitam punihi bho ma dhehi dhiman janadushanam hridi | ma
    dehi dinam kalaye kadacana ma pahi papam raghunatha pahi mam || 90|| || drutavilambitah || marakatambujavaridasundaram
    samarakarkashakandadhanurdharam | vigatakalmashadivyagunakaram tamadhuna raghunathamaham bhaje ||
    91|| kamalalocanamadhivimocanam jalajarocanarocanarocanam | kudharashocanashocanashocanam tamadhuna
    raghunathamupashraye || 92|| paramakarunikam karunarnavam navalaniradanirajavigraham | dasharathatmajamattadhanushsharam
    sharanadam raghunathaham shraye || 93|| janakajananacandracakorakam bharatamadhiharam bharatagrajam
    | lalitalakshmanalalitalalasam tamanisham raghunathamaham bhaje || 94|| mahitamarutimanjulamanasam
    mahitamarutimanjulamanasam | mahitamarutimanjulamanasam tamanagham raghunathamupabruve || 95|| bhavabhavam
    sharanagatavatsalam bhavabhavam sharanagatavatsalam | bhavabhavam sharanagatavatsalam tamamalam raghunathamaham
    shraye || 96|| janakajamahitam mahitahitam janakajamahitam mahitahitam | janakajamahitam mahitahitam
    sukhakaram raghunathamaham grine || 97|| harimaham raghunathamimam bhaje harimaham raghunathamimam
    bhaje | harimaham raghunathamimam bhaje harimaham raghunathamimam bhaje || 98|| harimayam raghunathamupasmahe
    harimayam raghunathamupasmahe | harimayam raghunathamupasmahe harimayam raghunathamupasmahe || 99||
    || rathoddhata || nilakanjanavakanjasundaram bhimadustarabhavabdhimandaram | sarvasadgunamanojnamandiram
    bhavayami raghunathamadarat || 100|| sharngasayakanishangadharinam satprapannabhavabhitiharinam |
    maithilimahamanoviharinam manayami raghunathamanvaham || 101|| tatakasubhujadarpaharinam kaushikadhvaravikasakarinam
    | aishvarena munidaratarinam tam sadaiva raghunathamashraye || 102|| viramishvarapinakabhanjanam bhargavendramadagarvaganjanam
    | janakijayamashesharanjanam ramameva raghunathamadriye || 103|| citrakutashucishailavasinam janakihridayasadmakasinam
    | tapasam harisutaikashasinam ramamatra raghunathamemyaham || 104|| janakishamavivamshabhushanam bhagnaghorakharamastadushanam
    | enanashanamanarghyapushanam cintayami raghunathamishvaram || 105|| shilatushtashabarijatayusham
    bhavapushtahanumadvanayusham | ravanantakavibhishanayusham ramabhadraraghunathamidmahe || 106|| ramabhadracaranambujam
    shraye ramabhadramanisham samadriye | raghavendrasugunavalim bruve raghavam ca raghunathamahvaye ||
    107|| ramacandracaranabjakinkaram janakicaranacarucaranam | girdharam giridharam girapate darshanena
    raghunatha nathaya || 108|| iti shriraghunathasya shatakam devabhashaya | shriramabhadracaryena gitam
    syattushtaye shriyah || || shrisitaramarpanamastu || iti shritulasipithadhishvarajagadgururamanandacarya
  devanagari: ृङ्गारं प्रथितमुपहारं महिभुवो रहो रासं रासं रसति रघुनाथोऽधिकुधरम ॥ ४३॥ कुटीरे वानीरे विधुविमलनीरे
    सुसरितः सुतीरे सद्धीरे शिशिरितसमीरे तृणमये । विराजन् राजन्यो भुवनकुलधन्योऽवनिजया प्रपन्नेषु प्रेष्ठो
    द्रवति रघुनाथोऽधिकुधरम् ॥ ४४॥ कृपादृष्ट्या वृष्ट्या कलितसुखसृष्ट्या त्रिजगतां तुदंस्तापं पापं भवभयकलापं
    कलपदैः । भवानीजानीष्टो विबुधविनतेष्टो निजगिरा जनानन्दस्यन्दं च्यवति रघुनाथोऽधिकुधरम् ॥ ४५॥ ॥ पुष्पिताग्रा
    ॥ अभिनववनमुक्ततमालनीलं निगममनुष्वभिगीतसौम्यशीलम् । जनकनृपसुतावरं वरार्हं शरणमहं रघुनाथमेमि भक्त्यै
    ॥ ४६॥ मनसिजशतकोटिकाम्यकान्तिं मनसिजशत्रुनिसृष्टशिष्टशान्तिम् । मनसिजतततप्ततापतान्तिं मनसिजकं रघुनाथमाश्रयामि
    ॥ ४७॥ करुणमनसमद्भुतस्वभावं प्रणतजनावनदीक्षमार्तरक्षम् । रघुकुलकुमुदेन्दुमीश्वरेशं शरणमहं रघुनाथमाव्रजामि
    ॥ ४८॥ भवदवदहनेन दह्यमानो विपिनकरीव करालकालकाल्यः । हरिणतृषिकृशः कुलौल्यलोभः शरणमये रघुनाथसत्तटागम्
    ॥ ४९॥ विषयविषभुजङ्गदष्टसत्त्वो मदनमनोरथभूतकाभिभूतः । मरणभयत आतुरो मुमुक्षुः शरणमये रघुनाथगारुडीकम्
    ॥ ५०॥ जहि जहि रघुनाथ वासनाहिं न कुरु विलम्बमनाथनाथ केकिन् । त्वयि खलु विमुखे सुबाहुशत्रौ हरिशिशुमेनमशिष्यतीह
    भेकः ॥ ५१॥ नहि मम जपयागयोगशक्ति र्न खलु समाधिविधौ च मे प्रतीतिः । गतदृश इव यष्टिरार्तबन्धो त्वमसि
    सदा रघुनाथ मेऽवलम्बः ॥ ५२॥ जगति जनिमतामवमाननाढ्यः शुनक इवास्मि कुटुम्बतो निरस्तः । कलिकलिलगतो यथा
    जरद्गौ खनमहं रघुनाथतोऽप्यपेक्षे ॥ ५३॥ गुणगणजलधे कृपैकमूर्ते भुवनपते प्रणतैककामपूर्ते । रघुवर वरणीयशीलसिन्धो
    स्वजनमिमं रघुनाथ पाह्यनाथम् ॥ ५४॥ ॥ उपेन्द्रवज्रा ॥ तव स्वभावो रघुनाथ ईदृ ग्गृहीतरागा रिपवोऽपि यत्र
    । न बद्धवैरोऽपि दशाननस्त्वां कदापि निन्दास्पदमाततान ॥ ५५॥ न कोऽपि मित्रं नहि कोऽपि शत्रु स्तवत्त्रिलोक्यां
    रघुनाथ राम । अतो जगौ श्रीकविकोकिलोऽपि मुहू रिपूणामपि वत्सलं त्वाम् ॥ ५६॥ वहन्नकेकान्प्रतिलोमलोकां
    स्तथापि मातुः पयसि स्पृहावान् । ध्रुवं स्वभावो रघुनाथ तेऽय मणोरणीयस्त्वमयप्रकाशः ॥ ५७॥ समस्तलोकेश्वरलोकपाला
    यदाज्ञया स्वं चरितार्थयन्ति । स एव गाधेयवशंवदोऽभू त्स कस्स्वभावो रघुनाथ चित्रम् ॥ ५८॥ त्वदीयपादाब्जरजोऽभिमर्शा
    द्बभूव पूता ह्यघवत्यहल्या । तथापि पश्चात्तपसेऽभिमृश्य पदस्पृशे त्वं रघुनाथ पापम् ॥ ५९॥ निरागसोऽप्याह
    विवासनं ते पिता समात्रा परिणोदितः सन् । तथापि नो विव्यथिषे न निन्दां चकर्थ रुष्टो रघुनाथ मातुः ॥ ६०॥
    चकार पापं जडधीर्जयन्तो बिभेद चञ्च्वा चरणौ कुजायाः । तथापि नो रोषवशं जगन्थ कियान्मृदुस्त्वं रघुनाथ
    शीलात् ॥ ६१॥ विहाय राज्यं सुरदुर्लभं त्वं सुवर्णमायामृगमन्वधावः । न वेद यत्नादपि ते स्वभावं स्वभीष्टनाकं
    रघुनाथ वाकम् ॥ ६२॥ बबन्ध पौलस्त्यसुतावमेहो भवन्तमुग्रैः किल नागपाशैः । भवानपीमं प्रजिघाय नाकं कियद्विचित्रं
    रघुनाथशीलम् ॥ ६३॥ ॥ इन्द्रवज्रा ॥ ये नाम जप्त्वा मुनयो दुरन्तं संसारबन्धं तरसा तुदन्ति । स त्वं कथं
    शक्रजिता निबद्धः कीदृक्स्वभावो रघुनाथ तेऽयम् ॥ ६४॥ यत्पादपङ्केरुहसेवया वै सर्वज्ञतां यान्ति मुनीन्द्रवर्याः
    । मूढो यथा शत्रुमृतेरुपायं पृच्छस्यहो श्रीरघुनाथ मित्रम् ॥ ६५॥ सीतागतिं भो रघुनाथ पृच्छ स्येणादिकानज्ञवदार्तचित्तः
    । मुक्तिं कथं रासि जटायुषे वै कीदृग्विरोधीव तव स्वभावः ॥ ६६॥ सूर्यस्य सूर्यस्य हि सौरिमित्रं विष्णोश्च
    विष्णोः कपयः सहायाः । लक्ष्म्याश्च लक्ष्म्याः रघुनाथ कष्टं सर्वं स्वभावस्य समञ्जसं ते ॥ ६७॥ सीता विराजत्यथ
    मानसे ते लङ्कां तथापि प्रहिणोषि वातिम् । नूनं लघून्वर्धयितुं तवेष्टा चेष्टा विशिष्टा रघुनाथदृष्टा
    ॥ ६८॥ सङ्कल्पतो यस्य विरञ्चिसर्गो जाग्रज्जगत्यां यश आतनोति । स त्वं कथं शोषयितुं समुद्रं सन्धातुमैच्छो
    रघुनाथ बाणम् ॥ ६९॥ दुर्वार्यकालोऽस्ति धनुर्यदीयं संवत्सरात्मा यदमोघबाणः । स त्वं कथं राक्षसनाशनाय
    निर्देष्टुमैक्षो रघुनाथ कीशान् ॥ ७०॥ नूनं स्वभावो रघुनाथ तेऽसौ सङ्क्रीडसे यल्लघुभिश्च कीशैः । मित्रे
    च सुग्रीवविभीषणौ ते पुत्रो वयः श्रीहनुमांस्त्वदीयः ॥ ७१॥ तं ते स्वभावं परितो निशम्य श्रुत्वा त्वदीयाञ्च
    दयालुताम्भो । त्वन्निष्ठचित्तः शरणं प्रपद्ये त्वमातुरं मां रघुनाथ रक्ष ॥ ७२॥ ॥ उपजातिः ॥ यत्सच्चिदानन्दवपुर्बिभर्षि
    स्वप्रीतये श्रीरघुनाथ रम्यम् । तदेव दृष्ट्वा प्रतिबिम्बभावे मुग्धो नरीनर्त्सि कियद्विचित्रम् ॥ ७३॥
    न मोदसे त्वं पदपद्मधूल्या पापामहल्यामपि तारयित्वा । चेखिद्यसे वै रघुनाथ तत्के पादस्पृशे कीदृगहो स्वभावः
    ॥ ७४॥ विभज्य चापं तृणभञ्जमाजे र्न वा स्म दर्पं रघुनाथ यासि । स्वयंवरे जानकिजैत्रमालां गृह्णासि नम्रो
    विनयः कियांस्ते ॥ ७५॥ कुठारपाणेः परुषाक्षराणि स्वीकृत्य वाक्यानि यथाशिषस्त्वम् । न रोषमागाः कृतपादपूजो
    लोकातिगं ते रघुनाथ शीलम् ॥ ७६॥ गुहं निगूहन्भरतन्भुजाभ्यां चकर्थ मित्रं ननु मित्रमित्रः । स्वपादपाथोजमरन्दतोयं
    कैवर्तकेभ्यो रघुनाथ रासि ॥ ७७॥ चकार यद्यप्यहितं प्रियायाः काकायमानो जडधीर्जयन्तः । तथापि तस्मै ददिथासुदानं
    विलक्षणं ते रघुनाथ शीलम् ॥ ७८॥ पितुः क्रियायां भरतं नियुज्य जटायुषः श्राद्धमहो चकर्थ । तस्मै ह्यदाः
    स्वीयगतिं च भक्तिं कीदृक्स्वभावो रघुनाथ तेऽसौ ॥ ७९॥ अम्बात्रये जागृति वत्सलाढ्ये यद्भिल्लभामां जननीमकार्षीः
    । इदं हि ते श्रीरघुनाथ नूनं दिव्यस्वभावानुगणं चरित्रम् ॥ ८०॥ स्वयं समर्थोऽतिरथोऽपि वीरः सुग्रीवमुख्यांश्च
    विभीषणं च । चकर्थ मित्राणि निजान्सहाया न्तदेव ते श्रीरघुनाथ शीलम् ॥ ८१॥ ॥ इन्द्रवंशा ॥ तं ते स्वभावं
    परिमृश्य शत्रुह न्संसारसिन्धौ पतितोऽतिपामरः । पापी प्रपद्ये तव पादपल्लवं दीनानुकम्पिन् रघुनाथ रक्ष
    माम् ॥ ८२॥ यद्यप्यहं जातु जडोऽतिजाल्मको मायापिशाची परिभूतसत्वकः । किन्तु त्वमप्यार्तिहरो हरार्चित
    स्तस्मात्प्रपन्नं रघुनाथ पाहि माम् ॥ ८३॥ नैवास्ति मादृग्भुवनेषु पातकी त्वादृच्च नैवास्ति जगत्स्वघापहः
    । इत्यावयोर्ब्रह्मकृतं ह्यनन्वयं त्रायस्व यत्नाद्रघुनाथ मा त्यज ॥ ८४॥ जानन्नपि स्वं दुरितैकसागरं वात्सल्यवार्धिञ्च
    भवन्तमीश्वरम् । त्यक्त्वा त्रपां त्वां शरणं समाश्रये नूनं व्रतं नो रघुनाथ हास्यसे ॥ ८५॥ यस्यां कृपादेवसरित्यनेकशः
    क्रूरान्नृशंसान्प्रपुनासि पापिनः । तस्यां कथं पापशिरोमणिं हि मां पूतं विधातुं रघुनाथ लज्जसे ॥ ८६॥
    एकत्र गर्जन्कलिकालकुञ्जरो मद्बुद्धिवल्लीं प्रसभं जिघत्सति । अन्यत्र मामाधिप्रियं पिशाचिनी नेतुं विनाशं
    रघुनाथ नाथते ॥ ८७॥ यद्यप्यहं क्रूरकुकर्मपाप भुग्दण्ड्यो भवेयं नहि नाथ विस्मयः । किन्तु त्वदङ्घ्रौ
    पतितस्य पीडया लोकापवादो रघुनाथ ते भवेत् ॥ ८८॥ कामं व्रजेयं नरकेष्वनेकधा पापच्यमानः कटुकर्मजाग्निना
    । किन्तु त्वदङ्घ्र्यम्बुजभावनासवो मा मानसान्मे रघुनाथ हीयताम् ॥ ८९॥ मा याहि दूरं पतितं पुनीहि भो मा
    धेहि धीमन् जनदूषणं हृदि । मा देहि दीनं कलये कदाचन मा पाहि पापं रघुनाथ पाहि माम् ॥ ९०॥ ॥ द्रुतविलम्बितः
    ॥ मरकताम्बुजवारिदसुन्दरं समरकर्कशकाण्डधनुर्धरम् । विगतकल्मषदिव्यगुणाकरं तमधुना रघुनाथमहं भजे ॥ ९१॥
    कमललोचनमाधिविमोचनं जलजरोचनरोचनरोचनम् । कुधरशोचनशोचनशोचनं तमधुना रघुनाथमुपाश्रये ॥ ९२॥ परमकारुणिकं
    करुणार्णवं नवलनीरदनीरजविग्रहम् । दशरथात्मजमात्तधनुश्शरं शरणदं रघुनाथहं श्रये ॥ ९३॥ जनकजाननचन्द्रचकोरकं
    भरतमाधिहरं भरताग्रजम् । ललितलक्ष्मणलालितलालसं तमनिशं रघुनाथमहं भजे ॥ ९४॥ महितमारुतिमञ्जुलमानसं महितमारुतिमञ्जुलमानसम्
    । महितमारुतिमञ्जुलमानसं तमनघं रघुनाथमुपब्रुवे ॥ ९५॥ भवभवं शरणागतवत्सलं भवभवं शरणागतवत्सलम् । भवभवं
    शरणागतवत्सलं तममलं रघुनाथमहं श्रये ॥ ९६॥ जनकजामहितं महिताहितं जनकजामहितं महिताहितम् । जनकजामहितं महिताहितं
    सुखकरं रघुनाथमहं गृणे ॥ ९७॥ हरिमहं रघुनाथमिमं भजे हरिमहं रघुनाथमिमं भजे । हरिमहं रघुनाथमिमं भजे हरिमहं
    रघुनाथमिमं भजे ॥ ९८॥ हरिमयं रघुनाथमुपास्महे हरिमयं रघुनाथमुपास्महे । हरिमयं रघुनाथमुपास्महे हरिमयं
    रघुनाथमुपास्महे ॥ ९९॥ ॥ रथोद्धता ॥ नीलकञ्जनवकञ्जसुन्दरं भीमदुस्तरभवाब्धिमन्दरम् । सर्वसद्गुणमनोज्ञमन्दिरं
    भावयामि रघुनाथमादरात् ॥ १००॥ शार्ङ्गसायकनिषङ्गधारिणं सत्प्रपन्नभवभीतिहारिणम् । मैथिलीमहमनोविहारिणं
    मानयामि रघुनाथमन्वहम् ॥ १०१॥ ताटकासुभुजदर्पहारिणं कौशिकाध्वरविकासकारिणम् । ऐश्वरेण मुनिदारतारिणं तं
    सदैव रघुनाथमाश्रये ॥ १०२॥ वीरमीश्वरपिनाकभञ्जनं भार्गवेन्द्रमदगर्वगञ्जनम् । जानकीजयमशेषरञ्जनं राममेव
    रघुनाथमाद्रिये ॥ १०३॥ चित्रकूटशुचिशैलवासिनं जानकीहृदयसद्मकासिनम् । तापसं हरिसुतैकशासिनं राममत्र रघुनाथमेम्यहम्
    ॥ १०४॥ जानकीशमविवंशभूषणं भग्नघोरखरमस्तदूषणम् । एणनाशनमनर्घ्यपूषणं चिन्तयामि रघुनाथमीश्वरम् ॥ १०५॥
    शीलतुष्टशबरीजटायुषं भावपुष्टहनुमद्वनायुषम् । रावणान्तकविभीषणायुषं रामभद्ररघुनाथमीड्महे ॥ १०६॥ रामभद्रचरणाम्बुजं
    श्रये रामभद्रमनिशं समाद्रिये । राघवेन्द्रसुगुणावलीं ब्रुवे राघवं च रघुनाथमाह्वये ॥ १०७॥ रामचन्द्रचरणाब्जकिङ्करं
    जानकीचरणचारुचारणम् । गिर्धरं गिरिधरं गिरापते दर्शनेन रघुनाथ नाथय ॥ १०८॥ इति श्रीरघुनाथस्य शतकं देवभाषया
    । श्रीरामभद्राचार्येण गीतं स्यात्तुष्टये श्रियः ॥ ॥ श्रीसीतारामार्पणमस्तु ॥ इति श्रीतुलसीपीठाधीश्वरजगद्गुरुरामानन्दाचार्य
