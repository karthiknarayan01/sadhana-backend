id: vatapi-ganapatim-bhajeham
category: stotram
name:
  english: Vatapi Ganapatim Bhajeham
content:
  english: vatapi ganapatim bhaje'ham varanashyam varapradam shri | bhutadi samsevita caranam bhuta bhautika
    prapanca bharanam | vitaraginam vinuta yoginam vishvakaranam vighnavaranam | pura kumbha sambhava
    munivara prapujitam trikona madhyagatam murari pramukhadyupasitam muladhara kshetrasthitam | paradi
    catvari vagatmakam pranava svarupa vakratundam nirantaram nikhila candrakhandam nijavamakara vidrutekshukhandam
    | karambuja pasha bijapuram kalushaviduram bhutakaram haradi guruguha toshita bimbam hamsadhvani bhushita
    herambam |
  devanagari: वातापि गणपतिं भजेऽहं वारणाश्यं वरप्रदं श्री । भूतादि संसेवित चरणं भूत भौतिक प्रपञ्च भरणम्
    । वीतरागिणं विनुत योगिनं विश्वकारणं विघ्नवारणम् । पुरा कुम्भ सम्भव मुनिवर प्रपूजितं त्रिकोण मध्यगतं
    मुरारि प्रमुखाद्युपासितं मूलाधार क्षेत्रस्थितम् । परादि चत्वारि वागात्मकं प्रणव स्वरूप वक्रतुण्डं
    निरन्तरं निखिल चन्द्रखण्डं निजवामकर विद्रुतेक्षुखण्डम् । कराम्बुज पाश बीजापूरं कलुषविदूरं भूताकारं
    हरादि गुरुगुह तोषित बिम्बं हंसध्वनि भूषित हेरम्बम् ।
