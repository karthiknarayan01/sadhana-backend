id: narayanaproktamsavitristotram
category: stotram
name:
  english: narayanaproktamsavitristotram
  devanagari: नारायणप्रोक्तंसावित्रीस्तोत्रम्
content:
  english: rinu dhyanam ca savitryashcoktam madhyandine ca yat | stotram pujavidhanam ca mantram ca sarvakamadam
    || 46|| taptakancanavarnabham jvalantim brahmatejasa | grishmamadhyahnamarttandasahasrasamasuprabham
    || 47|| ishaddhasyaprasannasyam ratnabhushanabhushitam | vahnishuddhamshukadhanam bhaktanugrahakataram
    || 48|| sukhadam muktidam shantam kantam ca jagatam vidheh | sarvasampatsvarupam ca pradatrim sarvasampadam
    || 49|| vedadhishthatridevim ca vedashastrasvarupinim | vede bijasvarupam ca bhaje tvam vedamataram
    || 50|| dhyatva dhyanena canena dattva pushpam svamurddhani | punardhyatva ghate bhaktya devimavahayedvrati
    || 51|| iti brahmavaivartapurane prakritikhande trayovimshadhyayantargatam narayanaproktam savitristotram
    samaptam | brahmavaivartapurana | prakritikhanda | adhyaya 23
  devanagari: ृणु ध्यानं च सावित्र्याश्चोक्तं माध्यन्दिने च यत् । स्तोत्रं पूजाविधानं च मन्त्रं च सर्वकामदम्
    ॥ ४६॥ तप्तकाञ्चनवर्णाभां ज्वलन्तीं ब्रह्मतेजसा । ग्रीष्ममध्याह्नमार्त्तण्डसहस्रसमसुप्रभाम् ॥ ४७॥ ईषद्धास्यप्रसन्नास्यां
    रत्नभूषणभूषिताम् । वह्निशुद्धांशुकाधानां भक्तानुग्रहकातराम् ॥ ४८॥ सुखदां मुक्तिदां शान्तां कान्तां
    च जगतां विधेः । सर्वसम्पत्स्वरूपां च प्रदात्रीं सर्वसम्पदाम् ॥ ४९॥ वेदाधिष्ठातृदेवीं च वेदशास्त्रस्वरूपिणीम्
    । वेदे बीजस्वरूपां च भजे त्वां वेदमातरम् ॥ ५०॥ ध्यात्वा ध्यानेन चानेन दत्त्वा पुष्पं स्वमूर्द्धनि
    । पुनर्ध्यात्वा घटे भक्त्या देवीमावाहयेद्व्रती ॥ ५१॥ इति ब्रह्मवैवर्तपुराणे प्रकृतिखण्डे त्रयोविंशाध्यायान्तर्गतं
    नारायणप्रोक्तं सावित्रीस्तोत्रं समाप्तम् । ब्रह्मवैवर्तपुराण । प्रकृतिखण्ड । अध्याय २३
