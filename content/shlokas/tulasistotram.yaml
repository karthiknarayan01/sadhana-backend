id: tulasistotram
category: stotram
name:
  english: tulasistotram
  devanagari: तुलसीस्तोत्रम्
content:
  english: namastubhyam vishnoshca priyavallabhe | yato brahmadayo devah srishti sthityantakarinah ||
    1|| namastulasi kalyani namo vishnupriye shubhe | namo mokshaprade devi namah sampatpradayike || 2||
    tulasi patu mam nityam sarvapadbhyo'pi sarvada | kirtitapi smrita vapi pavitrayati manavam || 3||
    namami shirasa devim tulasim vilasattanum | yam drishtva papino martya mucyante sarvakilbishat ||
    4|| tulasya rakshitam sarvam jagadetaccaracaram | ya vinihanti papani drishtva va papibhirnaraih ||
    5|| namastulasyatitaram yasyai baddhanjalim kalau | kalayanti sukham sarvam striyo vaishyastatha'pare
    || 6|| tulasya naparam kinciddaivatam jagatitale | yatha pavitrito loko vishnusangena vaishnavah ||
    7|| tulasyah pallavam vishnoh shirasyaropitam kalau | aropayati sarvani shreyamsi varamastake || 8||
    tulasyam sakala deva vasanti satatam yatah | atastamarcayelloke sarvan devan samarcayan || 9|| namastulasi
    sarvajne purushottamavallabhe | pahi mam sarva papebhyah sarvasampatpradayike || 10|| iti stotram
    pura gitam pundarikena dhimata | vishnumarcayata nityam shobhanaistulasidalaih || 11|| tulasi shrirmahalakshmirvidyavidya
    yashasvini | dharmya dharmanana devi devidevamanahpriya || 12|| lakshmipriyasakhi devi dyaurbhumiracala
    cala | shodashaitani namani tulasyah kirtayannarah || 13|| labhate sutaram bhaktimante vishnupadam
    labhet | tulasi bhurmahalakshmih padmini shrirharipriya || 14|| tulasi shrisakhi shubhe papaharini
    punyade | namaste naradanute narayanamanahpriye || 15|| iti shripundarikakritam tulasistotram sampurnam
    ||
  devanagari: नमस्तुभ्यं विष्णोश्च प्रियवल्लभे । यतो ब्रह्मादयो देवाः सृष्टि स्थित्यन्तकारिणः ॥ १॥ नमस्तुलसि
    कल्याणि नमो विष्णुप्रिये शुभे । नमो मोक्षप्रदे देवि नमः सम्पत्प्रदायिके ॥ २॥ तुलसी पातु मां नित्यं
    सर्वापद्भ्योऽपि सर्वदा । कीर्तितापि स्मृता वापि पवित्रयति मानवम् ॥ ३॥ नमामि शिरसा देवीं तुलसीं विलसत्तनुम्
    । यां दृष्ट्वा पापिनो मर्त्या मुच्यन्ते सर्वकिल्बिषात् ॥ ४॥ तुलस्या रक्षितं सर्वं जगदेतच्चराचरम् ।
    या विनिहन्ति पापानि दृष्ट्वा वा पापिभिर्नरैः ॥ ५॥ नमस्तुलस्यतितरां यस्यै बद्धाञ्जलिं कलौ । कलयन्ति
    सुखं सर्वं स्त्रियो वैश्यास्तथाऽपरे ॥ ६॥ तुलस्या नापरं किञ्चिद्दैवतं जगतीतले । यथा पवित्रितो लोको
    विष्णुसङ्गेन वैष्णवः ॥ ७॥ तुलस्याः पल्लवं विष्णोः शिरस्यारोपितं कलौ । आरोपयति सर्वाणि श्रेयांसि वरमस्तके
    ॥ ८॥ तुलस्यां सकला देवा वसन्ति सततं यतः । अतस्तामर्चयेल्लोके सर्वान् देवान् समर्चयन् ॥ ९॥ नमस्तुलसि
    सर्वज्ञे पुरुषोत्तमवल्लभे । पाहि मां सर्व पापेभ्यः सर्वसम्पत्प्रदायिके ॥ १०॥ इति स्तोत्रं पुरा गीतं
    पुण्डरीकेण धीमता । विष्णुमर्चयता नित्यं शोभनैस्तुलसीदलैः ॥ ११॥ तुलसी श्रीर्महालक्ष्मीर्विद्याविद्या
    यशस्विनी । धर्म्या धर्मानना देवी देवीदेवमनःप्रिया ॥ १२॥ लक्ष्मीप्रियसखी देवी द्यौर्भूमिरचला चला ।
    षोडशैतानि नामानि तुलस्याः कीर्तयन्नरः ॥ १३॥ लभते सुतरां भक्तिमन्ते विष्णुपदं लभेत् । तुलसी भूर्महालक्ष्मीः
    पद्मिनी श्रीर्हरिप्रिया ॥ १४॥ तुलसि श्रीसखि शुभे पापहारिणि पुण्यदे । नमस्ते नारदनुते नारायणमनःप्रिये
    ॥ १५॥ इति श्रीपुण्डरीककृतं तुलसीस्तोत्रं सम्पूर्णम् ॥
