id: vishnustutibrahmoktanp
category: stotram
name:
  english: vishnustutibrahmoktanP
  devanagari: विष्णुस्तुतिब्रह्मोक्तण्P
content:
  english: shrivishnustuti brahmokta narasimhapuṟane brahmovaca | namah kshirabdhivasaya nagaparyankashayine
    | namah shrikarasamsprishtadivyapadaya vishnave || 15|| namaste yoganidraya yogantarbhavitaya ca |
    tarkshyasanaya devaya govindaya namo namah || 16|| namah kshirabdhikallolasprishtamatraya sharngine
    | namo'ravindapadaya padmanabhaya vishnave || 17|| bhaktarcitasupadaya namo yogapriyaya vai | shubhangaya
    sunetraya madhavaya namo namah || 18|| sukeshaya sunetraya sulalataya cakrine | suvaktraya sukarnaya
    shridharaya namo namah || 19|| suvakshase sunabhaya padmanabhaya vai namah | subhruve carudehaya carudantaya
    sharngine || 20|| carujanghaya divyaya keshavaya namo namah | sunakhaya sushantaya suvidyaya gadabhrite
    || 21|| dharmapriyaya devaya vamanaya namo namah | asuraghnaya cograya rakshoghnaya namo namah ||
    22|| devanamartinashaya bhimakarmakrite namah | namaste lokanathaya ravanantakrite namah || 23|| iti
    narasimhapurane 47
  devanagari: श्रीविष्णुस्तुती ब्रह्मोक्त नरसिंहपुऱाने ब्रह्मोवाच । नमः क्षीराब्धिवासाय नागपर्यङ्कशायिने
    । नमः श्रीकरसंस्पृष्टदिव्यपादाय विष्णवे ॥ १५॥ नमस्ते योगनिद्राय योगान्तर्भाविताय च । तार्क्ष्यासनाय
    देवाय गोविन्दाय नमो नमः ॥ १६॥ नमः क्षीराब्धिकल्लोलस्पृष्टमात्राय शार्ङ्गिणे । नमोऽरविन्दपादाय पद्मनाभाय
    विष्णवे ॥ १७॥ भक्तार्चितसुपादाय नमो योगप्रियाय वै । शुभाङ्गाय सुनेत्राय माधवाय नमो नमः ॥ १८॥ सुकेशाय
    सुनेत्राय सुललाटाय चक्रिणे । सुवक्त्राय सुकर्णाय श्रीधराय नमो नमः ॥ १९॥ सुवक्षसे सुनाभाय पद्मनाभाय
    वै नमः । सुभ्रुवे चारुदेहाय चारुदन्ताय शार्ङ्गिणे ॥ २०॥ चारुजङ्घाय दिव्याय केशवाय नमो नमः । सुनखाय
    सुशान्ताय सुविद्याय गदाभृते ॥ २१॥ धर्मप्रियाय देवाय वामनाय नमो नमः । असुरघ्नाय चोग्राय रक्षोघ्नाय
    नमो नमः ॥ २२॥ देवानामार्तिनाशाय भीमकर्मकृते नमः । नमस्ते लोकनाथाय रावणान्तकृते नमः ॥ २३॥ इति नरसिंहपुराणे
    ४७
