id: ganapatisukta
category: sukta
name:
  english: ganapatisukta
  devanagari: गणपतिसूक्त
content:
  english: 10 om shanti̱h shanti̱h shanti̭h || capter|| nihsvarah || om saha navavatu | saha nau bhunaktu
    | saha viryam karavavahai | tejasvinavadhitamastu ma vidvishavahai || om shantih shantih shantih ||
    ekashititamam suktam |
  devanagari: १० ॐ शान्तिः॒ शान्तिः॒ शान्तिः॑ ॥ चप्तेर्॥ निःस्वरः ॥ ॐ सह नाववतु । सह नौ भुनक्तु । सह वीर्यं
    करवावहै । तेजस्विनावधीतमस्तु मा विद्विषावहै ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ एकाशीतितमं सूक्तम् ।
meaning: {}
