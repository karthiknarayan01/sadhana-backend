id: aranyaka
category: veda
name:
  english: aranyaka
  devanagari: अरन्यक
content:
  english: svidatrantara bhutam | yeneme vidhrite ubhe | vishnuna vidhrite bhumi | iti vatsasya vedana
    | iravati dhenumati hi bhutam | suyavasini manushe dashasye || 27 || vyashtabhnadrodasi vishnavete
    | dadhartha prithivimabhito mayukhaih | kintadvishnorbalamahuh | ka diptih kim parayanam | eko yaddharayaddevah
    | rejati rodasi ubhe | vatadvishnorbalamahuh | aksharaddiptirucyate | tripadaddharayaddevah | yadvishnorekamuttamam
    || 28 || agnayo vayavashcaiva | etadasya parayanam | pricchami tva param mrityum | avamam madhyamancatum
    | loknca punyapapanam | etatpricchami samprati | amumahuh param mrityum | pavamanam tu madhyamam |
    agnirevavamo mrityuh | candramashcaturucyate || 29 || anabhogah param mrityum | papassamyanti sarvada
    | abhogastveva samyanti | yatra punyakrito janah | tato madhyamamayanti | catumagnim ca samprati |
    pricchami tva papakritah | yatra yatayate yamah | tvannastadbrahman prabruhi | yadi vettha'sato grihan
    || 30 || kashyapaduditassuryah | papannirghnanti sarvada | rodasyontardesheshu | tatra nyasyante vasavaih
    | te'sharirah prapadyante | yatha'punyasya karmanah | apanyapadakeshasah | tatra teyonija janah |
    mritva punarmrityumapadyante | adyamanassvakarmabhih || 31 || ashatikah krimaya iva | tatah puyante
    vasavaih apaitam mrityum jayati | ya evam veda | sa khalvaivam vidbrahmanah | dirghashruttamo bhavati
    | kashyapasyatithissiddhagamanassiddhagamanah | tasyaisha bhavati | ayasminthsapta vasavah | rohanti
    purvya ruhah || 32 || rishir ha dirghashruttamah | indrasya gharmo atithiriti | kashyapah pashyako
    bhavati | yatsarvam paripashyatiti saukshmyat | athagnerashtapurushasya | tasyaisha bhavati | agne
    naya supatha raye asman | vishvani deva vayunani vidvan | yuyodhyasmajjuhuranamenah | bhuyishthante
    nama uktim vidhemeti || 33 || agnishca jatavedashca | sahoja ajiraprabhuh | vaishvanaro naryapashca
    | panktiradhashca saptamah visarpeva'shtamo'gninam | ete'shtau vasavah kshita iti | yathartvevagnerarcirvarnavisheshah
    | nilarcishca pitakarcishceti | atha vayorekadashapurushasyaikadashastrikasya | prabhrajamana vyavadatah
    || 34 || yashca vasukivaidyutah | rajatah parushah shyamah | kapila atilohitah | urdhva avapatantashca
    | vaidyuta ityekadasha | nainam vaidyuto hinasti | ya evam veda | sa hovaca vyasah parasharyah | vidyudvadhamevaham
    mrityumaicchamiti | na tvakama
  devanagari: स्विदत्रान्तरा भूतम् । येनेमे विधृते उभे । विष्णुना विधृते भूमी । इति वत्सस्य वेदना । इरावती
    धेनुमती हि भूतम् । सूयवसिनी मनुषे दशस्ये ॥ २७ ॥ व्यष्टभ्नाद्रोदसी विष्णवेते । दाधर्थ पृथिवीमभितो मयूखैः
    । किन्तद्विष्णोर्बलमाहुः । का दीप्तिः किं परायणम् । एको यद्धारयद्देवः । रेजती रोदसी उभे । वाताद्विष्णोर्बलमाहुः
    । अक्षराद्दीप्तिरुच्यते । त्रिपदाद्धारयद्देवः । यद्विष्णोरेकमुत्तमम् ॥ २८ ॥ अग्नयो वायवश्चैव । एतदस्य
    परायणम् । पृच्छामि त्वा परं मृत्युम् । अवमं मध्यमञ्चतुम् । लोक्ञ्च पुण्यपापानाम् । एतत्पृच्छामि सम्प्रति
    । अमुमाहुः परं मृत्युम् । पवमानं तु मध्यमम् । अग्निरेवावमो मृत्युः । चन्द्रमाश्चतुरुच्यते ॥ २९ ॥ अनाभोगाः
    परं मृत्युम् । पापास्संयन्ति सर्वदा । आभोगास्त्वेव संयन्ति । यत्र पुण्यकृतो जनाः । ततो मध्यममायन्ति
    । चतुमग्निं च सम्प्रति । पृच्छामि त्वा पापकृतः । यत्र यातयते यमः । त्वन्नस्तद्ब्रह्मन् प्रब्रूहि ।
    यदि वेत्थाऽसतो गृहन् ॥ ३० ॥ कश्यपादुदितास्सूर्याः । पापान्निर्घ्नन्ति सर्वदा । रोदस्योन्तर्देशेषु
    । तत्र न्यस्यन्ते वासवैः । तेऽशरीराः प्रपद्यन्ते । यथाऽपुण्यस्य कर्मणः । अपाण्यपादकेशासः । तत्र तेयोनिजा
    जनाः । मृत्वा पुनर्मृत्युमापद्यन्ते । अद्यमानास्स्वकर्मभिः ॥ ३१ ॥ आशातिकाः क्रिमय इव । ततः पूयन्ते
    वासवैः अपैतं मृत्युं जयति । य एवं वेद । स खल्वैवं विद्ब्राह्मणः । दीर्घश्रुत्तमो भवति । कश्यपस्यातिथिस्सिद्धगमनस्सिद्धगमनः
    । तस्यैषा भवति । आयस्मिन्थ्सप्त वासवाः । रोहन्ति पूर्व्या रुहः ॥ ३२ ॥ ऋषिर् ह दीर्घश्रुत्तमः । इन्द्रस्य
    घर्मो अतिथिरिति । कश्यपः पश्यको भवति । यत्सर्वं परिपश्यतीति सौक्ष्म्यात् । अथाग्नेरष्टपुरुषस्य । तस्यैषा
    भवति । अग्ने नय सुपथा राये अस्मान् । विश्वानि देव वयुनानि विद्वान् । युयोध्यस्मज्जुहुराणमेनः । भूयिष्ठन्ते
    नम उक्तिं विधेमेति ॥ ३३ ॥ अग्निश्च जातवेदाश्च । सहोजा अजिराप्रभुः । वैश्वानरो नर्यापाश्च । पङ्क्तिराधाश्च
    सप्तमः विसर्पेवाऽष्टमोऽग्नीनाम् । एतेऽष्टौ वसवः क्षिता इति । यथर्त्वेवाग्नेरर्चिर्वर्णविशेषाः । नीलार्चिश्च
    पीतकार्चिश्चेति । अथ वायोरेकादशपुरुषस्यैकादशस्त्रीकस्य । प्रभ्राजमाना व्यवदाताः ॥ ३४ ॥ याश्च वासुकिवैद्युताः
    । रजताः परुषाः श्यामाः । कपिला अतिलोहिताः । ऊर्ध्वा अवपतन्ताश्च । वैद्युत इत्येकादश । नैनं वैद्युतो
    हिनस्ति । य एवं वेद । स होवाच व्यासः पाराशर्यः । विद्युद्वधमेवाहं मृत्युमैच्छमिति । न त्वकाम
