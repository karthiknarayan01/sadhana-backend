id: prak-itistotram
category: stotram
name:
  english: prakṟitistotram
  devanagari: प्रक्ऱितिस्तोत्रम्
content:
  english: prakritistotram athava bhagavati bhuvaneshvari stutiratnam prasida prapancasvarupe pradhane
    prakrityatmike praninam pranasamjne | pranotum prabho prarabhe pranjalistvam prakritapratarkye prakamapravritte
    || 1|| stutirvakyabaddha padatmaiva vakyam padam tvaksharatmaksharam tvam maheshi | dhruvam tvam tvamevaksharaistvanmayaistoshyasi
    tvanmayi vakpravrittiryatah syat || 2|| ajadhokshajatrikshanashcapi rupam param nabhijananti mayamayam
    te | stuvantishi tam tvamami sthularupam tadetavadambeha yuktam mamapi || 3|| namaste samasteshi vindusvarupe
    namaste ravatvena tattvabhidhane | namaste mahatvam prapanne pradhane namaste tvahankaratatvasvarupe
    || 4|| namah shabdarupe namo vyomarupe namah sparsharupe namo vayurupe | namo rupatejorasambhah svarupe
    namaste'stu gandhatmike bhusvarupe || 5|| namah shrotracarmakshijihvasthanasasyavakpanipatpayusopastharupe
    | manobuddhyahankaracittasvarupe virupe namaste vibho vishvarupe || 6|| ravitvenabhutvantaratma dadhasi
    prajashcandramastvena pushnasi bhuyah | dahasyagnimurtirvahantyahutim na mahadevi tejastrayam tvatta
    eva || 7|| caturvaktrayukta lasaddhamsavaha rajahsamshrita brahmasamjnam dadhana | jagatsrishtikarya
    jaganmatribhute param tvatpadam dhyayasishi tvameva || 8|| virajatkirita lasaccakrashankha vahanti
    ca narayanakhyam jagatsu | gunam sattvamasthaya vishvasthitim yah karotiha som'sho'pi devi tvameva
    || 9|| jatabaddhacandrahiganga trinetra jagatsamharanti ca kalpavasane | tamah samshrita rudrasamjnam
    dadhana vahanti parashvakshamale vibhasi || 10|| sacintakshamala sudhakumbhalekhadhara trikshanarddhendurajatkaparda
    | sushuklamshukakalpadeha sarasvatyapi tvanmayaiveshi vacamadhisha || 11|| lasacchankhacakra calatkhadgabhima
    nadatsimhavaha jvalattungamaulih | dravaddaityavarga stuvatsiddhasangha tvameveshi durvapi sargadihine
    || 12|| puraratidehardhabhaga bhavani girindratmajatvena yaisha vibhati | mahayogivandya mahesha sunatha
    maheshyambika tattvatastvanmayaiva || 13|| lasakaustubhoddhasite vyomanile vasantim ca vakshahsthale
    kaitabhareh | jagadvallabham sarvalokaikanatham shriyam tamaham devyaham tvamavaimi || 14|| ajadridguhabjakshapotrindrakanam
    mahabhairavasyapi cihnam vahantyah | vibho matarah sapta tadruparupah sphurantyastvadamsha mahadevi
    tashca || 15|| samudyaddivakritsahasrabhabhasa sada santatasheshavishvavakashe | lasanmaulibaddhendulekhe
    sapashankushabhityabhishtattahaste namaste || 16|| prabhakirtikanti divaratrisandhyah kriyasha tamisra
    kshudhabuddhimedhah | dhritirvanmatih santatih shrishca bhaktistvameveshiye'nye ca shaktiprabhedah
    || 17|| hare bindunadaih sashktyakhyashantairnamaste'stu bhedaprabhinnairabhinne | sada saptapatalalokacalabdhigrahadvipadhatusvaradisvarupe
    || 18|| namaste samaste samastasvarupe samasteshu vastushvanusyutashakte | shritasthulasukshmasvarupe
    maheshi smrite bodharupepyabodhasvarupe || 19|| manovrittirastu smritiste samasta tatha vakpravrittih
    stutih syanmaheshi | sharirapravrittih pranamakriya syat prasida kshamasva prabho santatam me || 20||
    hrillekhajapavidhimarcanavisheshanetastam stutimapi nityamadarena | yo'bhyasyetsa khalu param shriyam
    ca gatva shuddham tad vrajati padam parasya dhamnah || 21|| iti hrillekhavihito vidhiruktah samgrahena
    sakalo'yam | yo'sminniyatamana mantri yogi syat sa eva bhogi ca || 22|| iti
  devanagari: प्रकृतिस्तोत्रम् अथवा भगवती भुवनेश्वरी स्तुतिरत्नम् प्रसीद प्रपञ्चस्वरूपे प्रधाने प्रकृत्यात्मिके
    प्राणिनां प्राणसंज्ञे । प्रणोतुं प्रभो प्रारभे प्राञ्जलिस्त्वां प्रकृताप्रतर्क्ये प्रकामप्रवृत्ते
    ॥ १॥ स्तुतिर्वाक्यबद्धा पदात्मैव वाक्यं पदं त्वक्षरात्माक्षरं त्वं महेशि । ध्रुवं त्वां त्वमेवाक्षरैस्त्वन्मयैस्तोष्यसि
    त्वन्मयी वाक्प्रवृत्तिर्यतः स्यात् ॥ २॥ अजाधोक्षजत्रीक्षणाश्चापि रूपं परं नाभिजानन्ति मायामयं ते ।
    स्तुवन्तीशि तां त्वाममी स्थूलरूपां तदेतावदम्बेह युक्तं ममापि ॥ ३॥ नमस्ते समस्तेशि विन्दुस्वरूपे नमस्ते
    रवत्वेन तत्त्वाभिधाने । नमस्ते महत्वं प्रपन्ने प्रधाने नमस्ते त्वहङ्कारतत्वस्वरूपे ॥ ४॥ नमः शब्दरूपे
    नमो व्योमरूपे नमः स्पर्शरूपे नमो वायुरूपे । नमो रूपतेजोरसाम्भः स्वरूपे नमस्तेऽस्तु गन्धात्मिके भूस्वरूपे
    ॥ ५॥ नमः श्रोत्रचर्माक्षिजिह्वास्थनासास्यवाक्पाणिपत्पायुसोपस्थरूपे । मनोबुद्ध्यहङ्कारचित्तस्वरूपे
    विरूपे नमस्ते विभो विश्वरूपे ॥ ६॥ रवित्वेनभूत्वान्तरात्मा दधासि प्रजाश्चन्द्रमस्त्वेन पुष्णासि भूयः
    । दहस्यग्निमूर्तिर्वहन्त्याहुतिं ना महादेवि तेजस्त्रयं त्वत्त एव ॥ ७॥ चतुर्वक्त्रयुक्ता लसद्धंसवाहा
    रजःसंश्रिता ब्रह्मसंज्ञां दधाना । जगत्सृष्टिकार्या जगन्मातृभूते परं त्वत्पदं ध्यायसीशि त्वमेव ॥ ८॥
    विराजत्किरीटा लसच्चक्रशङ्खा वहन्ती च नारायणाख्यां जगत्सु । गुणं सत्त्वमास्थाय विश्वस्थितिं यः करोतीह
    सोंऽशोऽपि देवि त्वमेव ॥ ९॥ जटाबद्धचन्द्राहिगङ्गा त्रिनेत्रा जगत्संहरन्ती च कल्पावसाने । तमः संश्रिता
    रुद्रसंज्ञां दधाना वहन्ती परश्वक्षमाले विभासि ॥ १०॥ सचिन्ताक्षमाला सुधाकुम्भलेखाधरा त्रीक्षणार्द्धेन्दुराजत्कपर्दा
    । सुशुक्लांशुकाकल्पदेहा सरस्वत्यपि त्वन्मयैवेशि वाचामधीशा ॥ ११॥ लसच्छङ्खचक्रा चलत्खड्गभीमा नदत्सिंहवाहा
    ज्वलत्तुङ्गमौलिः । द्रवद्दैत्यवर्गा स्तुवत्सिद्धसङ्घा त्वमेवेशि दुर्वापि सर्गादिहीने ॥ १२॥ पुरारातिदेहार्धभागा
    भवानी गिरीन्द्रात्मजात्वेन यैषा विभाति । महायोगिवन्द्या महेशा सुनाथा महेश्यम्बिका तत्त्वतस्त्वन्मयैव
    ॥ १३॥ लसकौस्तुभोद्धासिते व्योमनीले वसन्तीं च वक्षःस्थले कैटभारेः । जगद्वल्लभां सर्वलोकैकनाथां श्रियं
    तामहं देव्यहं त्वामवैमि ॥ १४॥ अजाद्रीड्गुहाब्जाक्षपोत्रीन्द्रकाणाम् महाभैरवस्यापि चिह्नं वहन्त्यः
    । विभो मातरः सप्त तद्रूपरूपाः स्फुरन्त्यस्त्वदंशा महादेवि ताश्च ॥ १५॥ समुद्यद्दिवाकृत्सहस्राभभासा
    सदा सन्तताशेषविश्वावकाशे । लसन्मौलिबद्धेन्दुलेखे सपाशाङ्कुशाभीत्यभीष्टात्तहस्ते नमस्ते ॥ १६॥ प्रभाकीर्तिकान्ती
    दिवारात्रिसन्ध्याः क्रियाशा तमिस्रा क्षुधाबुद्धिमेधाः । धृतिर्वाङ्मतिः सन्ततिः श्रीश्च भक्तिस्त्वमेवेशियेऽन्ये
    च शक्तिप्रभेदाः ॥ १७॥ हरे बिन्दुनादैः सश्क्त्याख्यशान्तैर्नमस्तेऽस्तु भेदप्रभिन्नैरभिन्ने । सदा सप्तपाताललोकाचलाब्धिग्रहद्वीपधातुस्वरादिस्वरूपे
    ॥ १८॥ नमस्ते समस्ते समस्तस्वरूपे समस्तेषु वस्तुष्वनुस्यूतशक्ते । श्रितस्थूलसूक्ष्मस्वरूपे महेशि स्मृते
    बोधरूपेप्यबोधस्वरूपे ॥ १९॥ मनोवृत्तिरस्तु स्मृतिस्ते समस्ता तथा वाक्प्रवृत्तिः स्तुतिः स्यान्महेशि
    । शरीरप्रवृत्तिः प्रणामक्रिया स्यात् प्रसीद क्षमस्व प्रभो सन्ततं मे ॥ २०॥ हृल्लेखाजपविधिमर्चनाविशेषानेतास्तां
    स्तुतिमपि नित्यमादरेण । योऽभ्यस्येत्स खलु परां श्रियं च गत्वा शुद्धं तद् व्रजति पदं परस्य धाम्नः ॥
    २१॥ इति हृल्लेखाविहितो विधिरुक्तः संग्रहेण सकलोऽयम् । योऽस्मिन्नियतमना मन्त्री योगी स्यात् स एव भोगी
    च ॥ २२॥ इति
