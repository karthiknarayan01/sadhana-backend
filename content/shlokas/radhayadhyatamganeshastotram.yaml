id: radhayadhyatamganeshastotram
category: stotram
name:
  english: radhayadhyatamganeshastotram
  devanagari: राधयाध्यातंगणेशस्तोत्रम्
content:
  english: shriradhaya dhyatam ganeshastotram shrikrishnapritikama'tha susankalpam vidhaya ca | gangodakena
    herambam snapayamasa bhaktitah || 22|| dhyarna ca samavedoktam cakara shuklapushpatah | mata caturnam
    vedanam vasoshca jagatamapi || 23|| buddhirupa bhagavati jnaninam janani para | dhyanatmakam svapusram
    tam param dhyanam cakara sa || 24|| sharvam lambodaram sthulam jvalantam brahmatejasa | gajavaktram
    vahnivarnamekadantamanantakam || 25|| siddhanam yoginameva jnaninam ca gurorgurum | dhyatam munindrairdevendrairbrahmeshasheshasamjnakaih
    || 26|| siddhendrairmunibhih sadbhirbhagavantam sanatanam | brahmasvarupam paramam mangalam mangalalayam
    || 27|| sarvavighnaharam shantam dataram sarvasampadam | bhavabdhimayapotena karnadharam ca karminam
    || 28|| sharanagatadinartaparitranaparayanam | dhyayeddhyanatmakam sadhyam bhaktesham bhaktavatsalam
    || 29|| iti brahmavaivartapurane shrikrishnajanmakhande uttarardhe tryayovimshatyadhikashatatamadhyayantargatam
    radhaya dhyatam ganeshastotram sampurnam | brahmavaivartapurana | uttarabhaga | adhyaya 123
  devanagari: श्रीराधया ध्यातं गणेशस्तोत्रम् श्रीकृष्णप्रीतिकामाऽथ सुसङ्कल्पं विधाय च । गङ्गोदकेन हेरम्बं
    स्नापयामास भक्तितः ॥ २२॥ ध्यार्न च सामवेदोक्तं चकार शुक्लपुष्पतः । माता चतुर्णां वेदानां वसोश्च जगतामपि
    ॥ २३॥ बुद्धिरूपा भगवती ज्ञानिनां जननी परा । ध्यानात्मकं स्वपुस्रं तं परं ध्यानं चकार सा ॥ २४॥ शर्वं
    लम्बोदरं स्थूलं ज्वलन्तं ब्रह्मतेजसा । गजवक्त्रं वह्निवर्णमेकदन्तमनन्तकम् ॥ २५॥ सिद्धानां योगिनामेव
    ज्ञानिनां च गुरोर्गुरुम् । ध्यातं मुनीन्द्रैर्देवेन्द्रैर्ब्रह्मेशशेषसंज्ञकैः ॥ २६॥ सिद्धेन्द्रैर्मुनिभिः
    सद्भिर्भगवन्तं सनातनम् । ब्रह्मस्वरूपं परमं मङ्गलं मङ्गलालयम् ॥ २७॥ सर्वविघ्नहरं शान्तं दातारं सर्वसम्पदाम्
    । भवाब्धिमायापोतेन कर्णधारं च कर्मिणाम् ॥ २८॥ शरणागतदीनार्तपरित्राणपरायणम् । ध्यायेद्ध्यानात्मकं साध्यं
    भक्तेशं भक्तवत्सलम् ॥ २९॥ इति ब्रह्मवैवर्तपुराणे श्रीकृष्णजन्मखण्डे उत्तरार्धे त्र्ययोविंशत्यधिकशततमाध्यायान्तर्गतं
    राधया ध्यातं गणेशस्तोत्रम् सम्पूर्णम् । ब्रह्मवैवर्तपुराण । उत्तरभाग । अध्याय १२३
