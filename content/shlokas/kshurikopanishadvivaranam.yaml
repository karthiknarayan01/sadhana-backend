id: kshurikopanishadvivaranam
category: upanishad
name:
  english: kshurikopanishadvivaranam
  devanagari: क्षुरिकोपनिषद्विवरणम्
content:
  english: ura iti | siddhadyasanasthito yogi urashca mukham ca katishca griva ca uromukhakatigrivamiti
    | pranyangatvat ekavadbhavah | hridayam ca kimcit unnatam vidhaya || 4 || evam yathoktakalam ayataprano
    bhutva shanaih shanaih ucchvasam ucchvaset caturvimshatimatrakalam puritam vayum recayet | idaya vayumapurya
    kumbhayitva pingalaya virecya punah pingalaya apurya kumbhayitva idaya virecayet | evam pratidinam
    catushkalam ashitipranayamam kuryat iti bhavah || 5 || pratyaharah sthiramatmadridham kritva angushthena
    samahitah | dve gulphe tu prakurvita janghe caiva trayastrayah || 6 || dve januni tathoru dve gude
    shishne trayastrayah | payorayatanam tatra nabhideshe samashrayet || 7 || tatra nadi sushumna tu nadibhirdashabhirvrita
    | tatra rakta ca pita ca krishna tamra vilohita || 8 || atisukshma ca tanvi ca shuklam nadim samashrayet
    | tatra samcarayet pranan urnanabhiva tantuna || 9 || p
  devanagari: उर इति । सिद्धाद्यासनस्थितो योगी उरश्च मुखं च कटिश्च ग्रीवा च उरोमुखकटिग्रीवमिति । प्राण्यङ्गत्वात्
    एकवद्भावः । हृदयं च किंचित् उन्नतं विधाय ।। ४ ।। एवं यथोक्तकालम् आयतप्राणो भूत्वा शनैः शनैः उच्छ्वासम्
    उच्छ्वसेत् चतुर्विंशतिमात्राकालं पूरितं वायुं रेचयेत् । इडया वायुमापूर्य कुम्भयित्वा पिङ्गलया विरेच्य
    पुनः पिङ्गलया आपूर्य कुम्भयित्वा इडया विरेचयेत् । एवं प्रतिदिनं चतुष्कालम् अशीतिप्राणायामं कुर्यात्
    इति भावः ।। ५ ।। प्रत्याहारः स्थिरमात्मदृढं कृत्वा अङ्गुष्ठेन समाहितः । द्वे गुल्फे तु प्रकुर्वीत
    जङ्घे चैव त्रयस्त्रयः ।। ६ ।। द्वे जानुनी तथोरू द्वे गुदे शिश्ने त्रयस्त्रयः । पायोरायतनं तत्र नाभिदेशे
    समाश्रयेत् ।। ७ ।। तत्र नाडी सुषुम्ना तु नाडीभिर्दशभिर्वृता । तत्र रक्ता च पीता च कृष्णा ताम्रा विलोहिता
    ।। ८ ।। अतिसूक्ष्मा च तन्वी च शुक्लां नाडीं समाश्रयेत् । तत्र संचारयेत् प्राणान् ऊर्णनाभीव तन्तुना
    ।। ९ ।। प्
