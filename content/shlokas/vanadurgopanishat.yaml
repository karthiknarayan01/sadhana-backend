    सर्वतो मां रक्ष रक्ष । हुं झटि स्वाहा । त्रियम्बकं यजामहे सुगन्धिं पुष्टिवर्धनम् । उर्वारुकमिव बन्धनान्मृत्योर्मुक्षीय
    मामृतात् । इमं मे वरुण श्रुधी हवमद्या च मृडय । त्वामवस्युराचके । तत्त्वा यामि ब्रह्मणा वन्दमानस्तदाशास्ते
    यजमानो हविर्भिः । अहेडमानो वरुणेह बोध्युरुशस मा न आयुः प्र मोषीः । वर्षन्तु ते विभावरि दिवो अभ्रस्य
    विद्युतः । रोहन्तु सर्वबीजान्यव ब्रह्म द्विषो जहि । ॐ नमो भगवते रुद्राय नमः । ॐ नमो भगवते रुद्राय
    । ॐ नमो भगवति नारसिंहि दशननखाग्रैः सर्वतो मां रक्ष रक्ष । हुं झटि स्वाहा । त्रियम्बकं यजामहे सुगन्धिं
    पुष्टिवर्धनम् । उर्वारुकमिव बन्धनान्मृत्योर्मुक्षीय मामृतात् । तव वायवृतस्पते त्वष्टुर्जामातरद्भुत
    । अवां स्या वृणीमहे । वर्षन्तु ते विभावरि दिवो अभ्रस्य विद्युतः । रोहन्तु सर्वबीजान्यव ब्रह्म द्विषो
    जहि । ॐ नमो भगवते रुद्राय नमः । ॐ नमो भगवते रुद्राय । ॐ नमो भगवति बगळामुखि ब्रह्मास्त्रेण सर्वतो मां
    रक्ष रक्ष । हुं झटि स्वाहा । त्रियम्बकं यजामहे सुगन्धिं पुष्टिवर्धनम् । उर्वारुकमिव बन्धनान्मृत्योर्मुक्षीय
    मामृतात् ॥ सोमो धेनुं सोमो अर्वन्तमाशु सोमो वीरं कर्मण्यं ददाति । सादन्यं विदथ्यं सभेयं पितृश्रवणं
    यो ददाशदस्मै । वर्षन्तु ते विभावरि दिवो अभ्रस्य विद्युतः । रोहन्तु सर्वबीजान्यव ब्रह्म द्विषो जहि
    । ॐ नमो भगवते रुद्राय नमः । ॐ नमो भगवते रुद्राय । ॐ नमो भगवत्यन्नपूर्णेश्वरि कनकदर्विहस्तेन सर्वतो
    मां रक्ष रक्ष । हुं झटि स्वाहा । त्रियम्बकं यजामहे सुगन्धिं पुष्टिवर्धनम् । उर्वारुकमिव बन्धनान्मृत्योर्मुक्षीय
    मामृतात् । तमीशानं जगतस्तस्थुषस्पतिं धियं जिन्वमवसे हूमहे वयम् । पूषा नो यथा वेदसामसद्वृधे रक्षिता
    पायुरदब्ध स्वस्तये । वर्षन्तु ते विभावरि दिवो अभ्रस्य विद्युतः । रोहन्तु सर्वबीजान्यव ब्रह्म द्विषो
    जहि । ॐ नमो भगवते रुद्राय नमः । ॐ नमो भगवते रुद्राय । भगवति भवरोगात् पीडितं दुष्कृतौघात् सुतदुहितृकळत्रोपद्रवैर्व्याप्यमानम्
    । विलसदमृतदृष्ट्या वीक्ष्य विभ्रान्तचित्त सकलभुवनमातस्त्राहि मां त्वं नमस्ते ॥ ॐ ह्रीं श्रीं भगवत्यै
    नमः । ॐ नमो भगवति पद्मारूढे पद्महस्ताभ्यां सर्वतो मां रक्ष रक्ष । हुं झटि स्वाहा । लक्ष्मीं क्षीरसमुद्रराजतनयां
    श्रीरङ्गधामेश्वरीं दासीभूतसमस्तदेववनितां लोकैकदीपाङ्कुराम् । श्रीमत्कामकटाक्षलब्धविभवब्रह्मेन्द्रगङ्गाधरां
    तां त्रैलोक्यकुटुम्बिनीं सरसिजां वन्दे मुकुन्दप्रियाम् ॥ ॐ ह्रीं श्रीं क्लीं श्रीं सिद्धलक्ष्म्यै
    स्वाहा । सुवर्णं धर्म परिवेद वेनम् । इन्द्रस्यात्मानं दशधा चरन्तं स्वाहा । ॐ नमो भगवत्यै सर्वतो भूर्भुवः
    स्वरोमिति दिग्बन्धः । ॐ ह्रीं दुर्गे स्वाहा । वन्दे रुद्रप्रियां नित्यमुत्पन्नां कामरूपिणीम् । उल्कामुखीं
    रुद्रजटीं नागपुष्पशिरोरुहाम् ॥ मं महिषमर्दिनि स्वाहा । ॐ ह्रीं दुं हुं फट् स्वाहा । प्रयोगबीजानि ।
    ॐ क्लीं ह्रीं श्रीं ऐं ग्लौं ॐ ह्रीं क्रौं गं ॐ नमो भगवते महागणपतये स्मरणमात्रसन्तुष्टाय सर्वविद्याप्रकाशकाय
