id: carnatic-music-geethams-janaka-sutha
category: stotram
name:
  english: Carnatic Music Geethams - Janaka Sutha
content:
  english: catusra jati rupaka talam angah samskritam sahityam janaka suta kuca kunkuma pankitalancanu
    re re baliharure khaga vahana kancipuri nilaya kari rakshaka bhuja vikrama kamita phala dayaka kari
    varada kalyana perundevi manoharure karigiri nivasure svarah da ri sa || ja na | ka su ta || pa ma
    | ga ri sa ri || ba li | ha ru re ha na || pa ma | ga ri ri ma || ga ri | sa || da pa | da pa pa ma
    || ka ri | va ra da || da pa | pa ma ga ri || ri ma | ga ri sa ri sa || ja na | ka su ta
  devanagari: चतुस्र जाति रूपक तालम् अङ्गाः संस्कृतम् साहित्यम् जनक सुत कुच कुङ्कुम पङ्कितलाञ्चनु रे रे
    बलिहरुरे खग वाहन काञ्चीपुरि निलया करि रक्षक भुज विक्रम कामित फल दायक करि वरदा कल्याण पेरुन्देवी मनोहरुरे
    करिगिरि निवासुरे स्वराः द रि स ॥ ज न । क सु ता ॥ प म । ग रि स रि ॥ ब लि । ह रु रे ह न ॥ प म । ग रि
    रि म ॥ ग रि । स ॥ द प । द प प म ॥ क रि । व र दा ॥ द प । प म ग रि ॥ रि म । ग रि स रि स ॥ ज न । क सु
    ता
