id: markandeyaproktam3vishnustotram
category: stotram
name:
  english: markandeyaproktam3vishnustotram
  devanagari: मार्कण्डेयप्रोक्तं३विष्णुस्तोत्रम्
content:
  english: markandeyaproktam 3 vishnustotram markandeya uvaca | hanta te kathayishyami namaskritva svayambhuve
    purushaya puranaya shashvatayavyayaya ca || 13|| ya esha prithudirghakshah pitavasa janardanah | esha
    karta vikarta ca sarvabhavanabhutakrit || 14|| acintyam mahadashcaryam pavitramapi cottamam | anadinidhanam
    bhutam vishvamakshayamavyayam || 15|| esha karta na kriyate karanam capi paurushe | yo hyenam purusham
    vetti deva api na tam viduh || 16|| iti mahabharate aranyaparvani 186 adhyayantargatam markandeyaproktam
    vishnustotram sampurnam | mahabharata | aranyakaparva | adhyaya 186
  devanagari: मार्कण्डेयप्रोक्तं ३ विष्णुस्तोत्रम् मार्कण्डेय उवाच । हन्त ते कथयिष्यामि नमस्कृत्वा स्वयम्भुवे
    पुरुषाय पुराणाय शाश्वतायाव्ययाय च ॥ १३॥ य एष पृथुदीर्घाक्षः पीतवासा जनार्दनः । एष कर्ता विकर्ता च
    सर्वभावनभूतकृत् ॥ १४॥ अचिन्त्यं महदाश्चर्यं पवित्रमपि चोत्तमम् । अनादिनिधनं भूतं विश्वमक्षयमव्ययम्
    ॥ १५॥ एष कर्ता न क्रियते कारणं चापि पौरुषे । यो ह्येनं पुरुषं वेत्ति देवा अपि न तं विदुः ॥ १६॥ इति
    महाभारते आरण्यपर्वणि १८६ अध्यायान्तर्गतं मार्कण्डेयप्रोक्तं विष्णुस्तोत्रं सम्पूर्णम् । महाभारत ।
    आरण्यकपर्व । अध्याय १८६
meaning: {}
