id: prahladakritashrinrisimhamantrah
category: mantra
name:
  english: prahladakritashrinrisimhamantrah
  devanagari: प्रह्लादकृतश्रीनृसिंहमन्त्रः
content:
  english: prahladakrita shrinrisimhamantrah om asya shri abhayanarasimhamantrasya shukarishih | jagaticchandah
    | raum bijam | atha mantrah | om namo bhagavate narasimhaya namastejastejase aviravirbhava vajranakha
    vajradamshtra karmashayan randhaya randhaya tamo yasa grasa svaha abhayamatmani bhuyishtha om kshraum
    || 1|| iti prahladakrita shrinrisimhamantrah |
  devanagari: प्रह्लादकृत श्रीनृसिंहमन्त्रः ॐ अस्य श्री अभयनरसिंहमन्त्रस्य शुकऋषिः । जगतिच्छन्दः । रौं
    बीजम् । अथ मन्त्रः । ॐ नमो भगवते नरसिंहाय नमस्तेजस्तेजसे आविराविर्भव वज्रनख वज्रदंष्ट्र कर्माशयान्
    रन्धय रन्धय तमो यस ग्रस स्वाहा अभयमात्मनि भूयिष्ठा ॐ क्ष्रौम् ॥ १॥ इति प्रह्लादकृत श्रीनृसिंहमन्त्रः
    ।
meaning: {}
