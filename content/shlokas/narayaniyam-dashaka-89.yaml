id: narayaniyam-dashaka-89
category: stotram
name:
  english: Narayaniyam Dashaka 89
content:
  english: ramajane jane yadiha tava bhakteshu vibhavo na sadyassampadyastadiha madakrittvadashaminam
    | prashantim kritvaiva pradishasi tatah kamamakhilam prashanteshu kshipram na khalu bhavadiye cyutikatha
    || || sadyah prasadarushitan vidhishankaradin kecidvibho nijagunanugunam bhajantah | bhrashta bhavanti
    bata kashtamadirghadrishtya spashtam vrikasura udaharanam kilasmin || || shakunijah sa tu naradamekada
    tvaritatoshamapricchadadhishvaram | sa ca didesha girishamupasitum na tu bhavantamabandhumasadhushu
    || || tapastaptva ghoram sa khalu kupitah saptamadine shirah chitva sadyah puraharamupasthapya puratah
    | atikshudram raudram shirasi karadanena nidhanam jagannathadvavre bhavati vimukhanam kva shubhadhih
    || || moktaram bandhamukto harinapatiriva pradravatso'tha rudram daityat bhitya sma devo dishi dishi
    valate prishthato dattadrishtih | tushnike sarvaloke tava padamadhirokshyantamudvikshya sharvam duradevagratastvam
    patuvatuvapusha tasthishe danavaya || || bhadram te shakuneya bhramasi kimadhuna tvam pishacasya vaca
    sandehashcenmaduktau tava kimu na karoshyangulimangamaulau | ittham tvadvakyamudhah shirasi kritakarah
    so'patacchinnapatam bhramsho hyevam paropasiturapi ca gatih shulino'pi tvameva || || bhrigum kila
    sarasvatinikatavasinastapasa strimurtishu samadishannadhikasattvatam veditum | ayam punaranadaraduditaruddharoshe
    vidhau hare'pi ca jihimsishau girijaya dhrite tvamagat || || suptam ramankabhuvi pankajalocanam tvam
    vipre vinighnati padena mudotthitastvam | sarvam kshamasva munivarya bhavet sada me tvatpadacinhamiha
    bhushanamityavadih || || nishcitya te ca sudridham tvayi baddhabhavah sarasvata munivara dadhire vimoksham
    | tvamevamacyuta punashcyutidoshahinam sattvoccayaikatanumeva vayam bhajamah || || jagatsrishtyadau
    tvam nigamanivahairvandibhiriva stutam vishno saccitparamarasanirdvaitavapusham | paratmanam bhuman
    pashupavanitabhagyanivaham paritapashrantyai pavanapuravasin paribhaje ||
  devanagari: रमाजाने जाने यदिह तव भक्तेषु विभवो न सद्यस्सम्पद्यस्तदिह मदकृत्त्वादशमिनाम् । प्रशान्तिं
    कृत्वैव प्रदिशसि ततः काममखिलं प्रशान्तेषु क्षिप्रं न खलु भवदीये च्युतिकथा ॥ ॥ सद्यः प्रसादरुषितान्
    विधिशङ्करादीन् केचिद्विभो निजगुणानुगुणं भजन्तः । भ्रष्टा भवन्ति बत कष्टमदीर्घदृष्ट्या स्पष्टं वृकासुर
    उदाहरणं किलास्मिन् ॥ ॥ शकुनिजः स तु नारदमेकदा त्वरिततोषमपृच्छदधीश्वरम् । स च दिदेश गिरीशमुपासितुं
    न तु भवन्तमबन्धुमसाधुषु ॥ ॥ तपस्तप्त्वा घोरं स खलु कुपितः सप्तमदिने शिरः छित्वा सद्यः पुरहरमुपस्थाप्य
    पुरतः । अतिक्षुद्रं रौद्रं शिरसि करदानेन निधनं जगन्नाथाद्वव्रे भवति विमुखानां क्व शुभधीः ॥ ॥ मोक्तारं
    बन्धमुक्तो हरिणपतिरिव प्राद्रवत्सोऽथ रुद्रं दैत्यात् भीत्या स्म देवो दिशि दिशि वलते पृष्ठतो दत्तदृष्टिः
    । तूष्णीके सर्वलोके तव पदमधिरोक्ष्यन्तमुद्वीक्ष्य शर्वं दूरादेवाग्रतस्त्वं पटुवटुवपुषा तस्थिषे दानवाय
    ॥ ॥ भद्रं ते शाकुनेय भ्रमसि किमधुना त्वं पिशाचस्य वाचा सन्देहश्चेन्मदुक्तौ तव किमु न करोष्यङ्गुलीमङ्गमौलौ
    । इत्थं त्वद्वाक्यमूढः शिरसि कृतकरः सोऽपतच्छिन्नपातं भ्रंशो ह्येवं परोपासितुरपि च गतिः शूलिनोऽपि त्वमेव
    ॥ ॥ भृगुं किल सरस्वतीनिकटवासिनस्तापसा स्त्रिमूर्तिषु समादिशन्नधिकसत्त्वतां वेदितुम् । अयं पुनरनादरादुदितरुद्धरोषे
    विधौ हरेऽपि च जिहिंसिषौ गिरिजया धृते त्वामगात् ॥ ॥ सुप्तं रमाङ्कभुवि पङ्कजलोचनं त्वां विप्रे विनिघ्नति
    पदेन मुदोत्थितस्त्वम् । सर्वं क्षमस्व मुनिवर्य भवेत् सदा मे त्वत्पादचिन्हमिह भूषणमित्यवादीः ॥ ॥ निश्चित्य
    ते च सुदृढं त्वयि बद्धभावाः सारस्वता मुनिवरा दधिरे विमोक्षम् । त्वामेवमच्युत पुनश्च्युतिदोषहीनं सत्त्वोच्चयैकतनुमेव
    वयं भजामः ॥ ॥ जगत्सृष्ट्यादौ त्वां निगमनिवहैर्वन्दिभिरिव स्तुतं विष्णो सच्चित्परमरसनिर्द्वैतवपुषम्
    । परात्मानं भूमन् पशुपवनिताभाग्यनिवहं परितापश्रान्त्यै पवनपुरवासिन् परिभजे ॥
