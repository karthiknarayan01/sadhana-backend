id: suryashtakam
category: stotram
name:
  english: Suryashtakam
  devanagari: सूर्याष्टकम् १ (आदिदेव नमस्तुभ्यं प्रसीद मम)
content:
  english: '|| shri ganeshaya namah || samba uvaca || adideva namastubhyam prasida mama bhaskara | divakara
    namastubhyam prabhakara namo''stute || 1|| saptashvarathamarudham pracandam kashyapatmajam | shvetapadmadharam
    devam tam suryam pranamamyaham || 2|| lohitam rathamarudham sarvalokapitamaham | mahapapaharam devam
    tam suryam pranamamyaham || 3|| traigunyam ca mahashuram brahmavishnumaheshvaram | mahapapaharam devam
    tam suryam pranamamyaham || 4|| brimhitam tejahpunjam ca vayumakashameva ca | prabhum ca sarvalokanam
    tam suryam pranamamyaham || 5|| bandhukapushpasankasham harakundalabhushitam | ekacakradharam devam
    tam suryam pranamamyaham || 6|| tam suryam jagatkartaram mahatejahpradipanam | mahapapaharam devam
    tam suryam pranamamyaham || 7|| tam suryam jagatam natham jnanavijnanamokshadam | mahapapaharam devam
    tam suryam pranamamyaham || 8|| suryashtakam pathennityam grahapidapranashanam | aputro labhate putram
    daridro dhanavanbhavet || 9|| amisham madhupanam ca yah karoti raverdine | saptajanma bhavedrogi pratijanma
    daridrata || 10|| stritailamadhumamsani yastyajettu raverdine | na vyadhih shokadaridryam suryalokam
    sa gacchati || 11|| iti shrisuryashtakastotram sampurnam ||'
  devanagari: ॥ श्री गणेशाय नमः ॥ साम्ब उवाच ॥ आदिदेव नमस्तुभ्यं प्रसीद मम भास्कर । दिवाकर नमस्तुभ्यं
    प्रभाकर नमोऽस्तुते ॥ १॥ सप्ताश्वरथमारूढं प्रचण्डं कश्यपात्मजम् । श्वेतपद्मधरं देवं तं सूर्यं प्रणमाम्यहम्
    ॥ २॥ लोहितं रथमारूढं सर्वलोकपितामहम् । महापापहरं देवं तं सूर्यं प्रणमाम्यहम् ॥ ३॥ त्रैगुण्यं च महाशूरं
    ब्रह्माविष्णुमहेश्वरम् । महापापहरं देवं तं सूर्यं प्रणमाम्यहम् ॥ ४॥ बृंहितं तेजःपुञ्जं च वायुमाकाशमेव
    च । प्रभुं च सर्वलोकानां तं सूर्यं प्रणमाम्यहम् ॥ ५॥ बन्धूकपुष्पसङ्काशं हारकुण्डलभूषितम् । एकचक्रधरं
    देवं तं सूर्यं प्रणमाम्यहम् ॥ ६॥ तं सूर्यं जगत्कर्तारं महातेजःप्रदीपनम् । महापापहरं देवं तं सूर्यं
    प्रणमाम्यहम् ॥ ७॥ तं सूर्यं जगतां नाथं ज्ञानविज्ञानमोक्षदम् । महापापहरं देवं तं सूर्यं प्रणमाम्यहम्
    ॥ ८॥ सूर्याष्टकं पठेन्नित्यं ग्रहपीडाप्रणाशनम् । अपुत्रो लभते पुत्रं दरिद्रो धनवान्भवेत् ॥ ९॥ आमिशं
    मधुपानं च यः करोति रवेर्दिने । सप्तजन्म भवेद्रोगी प्रतिजन्म दरिद्रता ॥ १०॥ स्त्रीतैलमधुमांसानि यस्त्यजेत्तु
    रवेर्दिने । न व्याधिः शोकदारिद्र्यं सूर्यलोकं स गच्छति ॥ ११॥ इति श्रीसूर्याष्टकस्तोत्रं सम्पूर्णम्
    ॥
