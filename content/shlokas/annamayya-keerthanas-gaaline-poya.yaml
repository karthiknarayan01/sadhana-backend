id: annamayya-keerthanas-gaaline-poya
category: stotram
name:
  english: Annamayya Keerthanas Gaaline Poya
content:
  english: capu pallavi galine poya galakalamu talimiki gòntayu bòdduledu || adusu còrane pattè natunitu
    gallu gudugukònane pattè galakalamu | òdaliki jivuni kòdayadainahari dadavaga gòntayu bòdduledu ||
    kalaci cindane pattè gadavaga nincaga battè kalushadehapubadha galakalamu | talaposi tanapali daivamaina
    hari dalacaga gòntayu bòdduledu | caranam shiramu muduvabattè cikkudiyyaga battè garimala gapatala
    galakalamu | tiruvenkatagiri devudainahari daricera gòntayu bòdduledu || galine poya galakalamu talimiki
    gòntayu bòdduledu ||
  devanagari: चापु पल्लवि गालिने पोय गलकालमु तालिमिकि गॊन्तयु बॊद्दुलेदु ॥ अडुसु चॊरने पट्टॆ नटुनिटु गाल्लु
    गुडुगुकॊनने पट्टॆ गलकालमु । ऒडलिकि जीवुनि कॊडयडैनहरि दडवगा गॊन्तयु बॊद्दुलेदु ॥ कलचि चिन्दने पट्टॆ
    गडवग निञ्चग बट्टॆ कलुषदेहपुबाध गलकालमु । तलपोसि तनपालि दैवमैन हरि दलचगा गॊन्तयु बॊद्दुलेदु । चरणं
    शिरमु मुडुवबट्टॆ चिक्कुदिय्यग बट्टॆ गरिमल गपटाल गलकालमु । तिरुवेङ्कटगिरि देवुडैनहरि दरिचेरा गॊन्तयु
    बॊद्दुलेदु ॥ गालिने पोय गलकालमु तालिमिकि गॊन्तयु बॊद्दुलेदु ॥
