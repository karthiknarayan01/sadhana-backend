id: annamayya-keerthanas-navarasamuladee-nalinaakshi
category: stotram
name:
  english: Annamayya Keerthanas Navarasamuladee Nalinaakshi
content:
  english: adi pallavi navarasamuladi nalinakshi | javakatti niku javi sesini || shringara rasamu cèliya
    mòkambuna | sangati virarasamu golla | rangagu karunarasamu pèdavulanu | angapu gucamula nadbhuta
    rasamu || navarasamuladi nalinakshi cèli hasyarasamu cèlavula nindi | palucani nadumuna bhayarasamu
    | kaliki vadugannula bhibhatsamu | ala bòma jankènala nadè raudrambu || navarasamuladi nalinakshi
    rati marapula shantarasambadè | ati mohamu padiyavarasamu | itvuga shrivenkatesha kuditivi | satamai
    yipèku santosa rasamu || navarasamuladi nalinakshi | javakatti niku javi sesini ||
  devanagari: आदि पल्लवि नवरसमुलदी नलिनाक्षि । जवकट्टि नीकु जवि सेसीनि ॥ शृङ्गार रसमु चॆलिय मॊकम्बुन ।
    सङ्गति वीररसमु गोल्ल । रङ्गगु करुणरसमु पॆदवुलनु । अङ्गपु गुचमुल नद्भुत रसमु ॥ नवरसमुलदी नलिनाक्षि
    चॆलि हास्यरसमु चॆलवुल निण्डी । पलुचनि नडुमुन भयरसमु । कलिकि वाडुगन्नुल भीभत्समु । अल बॊम जङ्कॆनल नदॆ
    रौद्रम्बु ॥ नवरसमुलदी नलिनाक्षि रति मरपुल शान्तरसम्बदॆ । अति मोहमु पदियवरसमु । इत्वुग श्रीवेङ्कटेश
    कूडितिवि । सतमै यीपॆकु सन्तोस रसमु ॥ नवरसमुलदी नलिनाक्षि । जवकट्टि नीकु जवि सेसीनि ॥
