id: bhagavatstutibvp
category: stotram
name:
  english: bhagavatstutiBVP
  devanagari: भगवत्स्तुतिBVP
content:
  english: bhagavatstuti brahmavaivartapurane atha trimsho'dhyayah | shrinarayana uvaca | lambodaro harirumapatiradisheshabrahmadayah
    suragana manavo munindrah | vanishivatripathagakamaladikashca samcintayebhdagavatashcaranaravindam
    || 1|| sansarasagaramativa gabhiraghoram davagnisarpapariveshtiteceshtitangam | samlanghya gantumabhivanchati
    yo hi dasyam samcintayedbhagavatashcaranaravindam || 2|| govardhanoddharanakirtirativakhinna bhurdharita
    ca dashanagrata eva ca''dra | vishvani lomavivareshu bibharturadeh samcintyedbhagavatashcaranaravindam
    || 3|| vedangavedamukhanihsritkirtiramshairvedangvedajanakasya harervidhatuh | janmantakadibhayashokavidirnadehh
    samcintyedbhagavatashcaranaravindam || 4|| gopanganavadanapanjashatpadasya raseshvarasya rasikaramanasya
    pumsh | vrindavane viharato vrajveshavishnoh samcintyedbhagavatashcaranaravindam || 5|| cakshurnimeshapatito
    jagatam vidhata tatkarma vatsa kathitum bhuvi kah samarthah | tvam capi naradamune paramadarena sancintanam
    kuru hareshcaranaravindam || 6|| yuyam vayam tasya kalakalamshah kalakalamshah manavo munindrah |
    kalavishesha bhavapadmamukhya mahanviran yasya kalavisheshah || 7|| sahashrashirsha shirasah pradeshe
    bibharti sidharthasamam ca vishvam | kurme ca shesho mashko gaje yatha kurmashca krishnasya kalakalamshah
    || 8|| golokanathasya vibhoryasho'malam shrutau purane nahi kimcana sphutam | na padmamukhyah kathitum
    samarthah sarveshvaram tam bhaja padmaputra || 9|| vishveshu sarveshu ca vishvadhamnah santyeva shashvadvidhivishnurudrah
    | tesham ca samkhyah shrutayashca devah param na jananti tamishvaram bhaja || 10|| karoti srishtim
    sa vidhervidhata vidhaya nityam prakritim jagatprasum | brahmadayah prakritikashca sarve bhaktipradam
    shrim prakritim bhajanti || 11|| brahmasvarupa prakrritirna bhinna yaya ca srishtim kurute sanatanah
    | striyashca sarvah kalaya jagatsu maya ca sarve ca taya vimohitah || 12|| narayani sa parama sanatani
    shaktishca pumsah paramatmanashca | atmeshvarashcapi yaya ca shaktimamstaya vina srashtumashakta eva
    || 13|| gatva vivaham kuru vatsa sampratam kartu prayuktashca pitunirdeshah | gurornideshapratipalako
    bhaveh sarvatra pujyo vijayi ca samtatam || 14|| svapatnim pujyedho hi vastralamkaracandanaih | prakritisatasya
    samtushta yatha krishno dvijarcane || 15|| sa ca yoshitsvarupa ca prativishveshu mayaya | yoshitamapamanena
    parabhuta ca sa bhavet || 16|| divya stri pujita yena patiputravati sati | prakritih pujita tena sarvamangaladayini
    || 17|| mulaprakritireka sa purnabrahmasvarupini | srishtau pancavidha sa ca vishnumaya sanatani ||
    18|| pranadhishthatridevi ya krishnasya paramatmanah | sarvasam preyasi kanta sa radha parikirita
    || 19|| narayanapriya lakshmih sarvasampatsvarupini | vagadhishthatridevi ya sa ca pujya sarasvati
    || 20|| savitri vedamata ca pujyarupa vidheh priya | shamkarasya priya durga yasyah putro ganeshvarah
    || 21|| iti shribrahmvaivarte mahapurane brahmkhande sautishaunakasamvade bhagavatstutitatsvarupamaẏasvarupavarnanam
    nama trimsho'dhyayah || 30||
  devanagari: भगवत्स्तुती ब्रह्मवैवर्तपुराणे अथ त्रिंशोऽध्ययः । श्रीनारायण उवाच । लम्बोदरो हरिरूमापतिरादिशेषब्रह्मादयः
    सुरगणा मनवो मुनीन्द्राः । वाणीशिवात्रिपथगाकमलादिकाश्च संचिन्तयेभ्दगवतश्चरणारविन्दम् ॥ १॥ सन्सारसागरमतीव
    गभीरघोरं दावाग्निसर्पपरिवेष्टितेचेष्टिताङ्गम् । संलङ्घ्य गन्तुमभिवाञ्छति यो हि दास्यं संचिन्तयेद्भगवतश्चरणारविन्दम्
    ॥ २॥ गोवर्धनोद्धरणकीर्तिरतीवखिन्ना भूर्धारिता च दशनाग्रत एव चाऽऽद्रा । विश्वानि लोमविवरेषु बिभर्तुरादेः
    संचिन्त्येद्भगवतश्चरणारविन्दम् ॥ ३॥ वेदाङ्गवेदमुखनिःसृत्कीर्तिरंशैर्वेदाङ्ग्वेदजनकस्य हरेर्विधातुः
    । जन्मान्तकादिभयशोकविदीर्णदेह्ः संचिन्त्येद्भगवतश्चरणारविन्दम् ॥ ४॥ गोपाङ्गनावदनपङ्जषट्पदस्य रासेश्वरस्य
    रसिकारमणस्य पुंस्ः । वृन्दावने विहरतो व्रज्वेषविष्णोः संचिन्त्येद्भगवतश्चरणारविन्दम् ॥ ५॥ चक्षुर्निमेषपतितो
    जगतां विधाता तत्कर्म वत्स कथितुं भुवि कः समर्थः । त्वं चापि नारदमुने परमादरेण सञ्चिन्तनं कुरु हरेश्चरणारविन्दम्
    ॥ ६॥ यूयं वयं तस्य कलाकलांशाः कलाकलांशाः मनवो मुनीन्द्राः । कलाविशेषा भवपाद्ममुख्या महान्विराङ् यस्य
    कलाविशेषः ॥ ७॥ सहश्रशीर्षा शिरसः प्रदेशे बिभर्ति सिधार्थसमं च विश्वम् । कूर्मे च शेषो मश्को गजे यथा
    कूर्मश्च कृष्णस्य कलाकलांशः ॥ ८॥ गोलोकनाथस्य विभोर्यशोऽमलं श्रुतौ पुराणे नहि किंचन स्फुटम् । न पाद्ममुख्याः
    कथितुं समर्थाः सर्वेश्वरं तं भज पाद्मपुत्र ॥ ९॥ विश्वेषु सर्वेषु च विश्वधाम्नः सन्त्येव शश्वद्विधिविष्णुरुद्राः
    । तेषां च संख्याः श्रुतयश्च देवाः परं न जानन्ति तमीश्वरं भज ॥ १०॥ करोति सृष्टिं स विधेर्विधाता विधाय
    नित्यां प्रकृतिं जगत्प्रसूम् । ब्रह्मादयः प्राकृतिकाश्च सर्वे भक्तिप्रदां श्रीं प्रकृतिं भजन्ति ॥
    ११॥ ब्रह्मस्वरुपा प्रक्रृतिर्न भिन्ना यया च सृष्टिं कुरुते सनातनः । स्त्रियश्च सर्वाः कलया जगत्सु
    माया च सर्वे च तया विमोहिताः ॥ १२॥ नारायणी सा परमा सनातनी शक्तिश्च पुंसः परमात्मनश्च । आत्मेश्वरश्चापि
    यया च शक्तिमांस्तया विना स्रष्टुमशक्त एव ॥ १३॥ गत्वा विवाहं कुरु वत्स सांप्रतं कर्तु प्रयुक्तश्च पितुनिर्देशः
    । गुरोर्निदेशप्रतिपालको भवेः सर्वत्र पूज्यो विजयी च संततम् ॥ १४॥ स्वपत्नीं पूज्येधो हि वस्त्रालंकारचन्दनैः
    । प्रकृतिसतस्य संतुष्टा यथा कृष्णो द्विजार्चने ॥ १५॥ सा च योषित्स्वरुपा च प्रतिविश्वेषु मायया । योषितामपमानेन
    पराभूता च सा भवेत् ॥ १६॥ दिव्या स्त्री पूजिता येन पतिपुत्रवती सती । प्रकृतिः पूजिता तेन सर्वमङ्गलदायिनी
    ॥ १७॥ मूलप्रकृतिरेका सा पूर्णब्रह्मास्वरुपिणी । सृष्टौ पञ्चविधा सा च विष्णुमाया सनातनी ॥ १८॥ प्राणाधिष्ठातॄदेवी
    या कृष्णस्य परमात्मनः । सर्वासां प्रेयसी कान्ता सा राधा परिकीरिता ॥ १९॥ नारायणप्रिया लक्ष्मीः सर्वसम्पत्स्वरुपिणी
    । वागधिष्ठातृदेवी या सा च पूज्या सरस्वती ॥ २०॥ सावित्री वेदमाता च पूज्यरूपा विधेः प्रिया । शंकरस्य
    प्रिया दुर्गा यस्याः पुत्रो गणेश्वरः ॥ २१॥ इति श्रीब्रह्म्वैवर्ते महापुराणे ब्रह्म्खण्डे सौतिशौनकसंवादे
    भगवत्स्तुतितत्स्वरुपमाय़ास्वरूपवर्णनं नाम त्रिंशोऽध्यायः ॥ ३०॥
