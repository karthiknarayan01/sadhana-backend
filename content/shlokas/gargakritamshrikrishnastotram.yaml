id: gargakritamshrikrishnastotram
category: stotram
name:
  english: gargakritamshrikrishnastotram
  devanagari: गर्गकृतंश्रीकृष्णस्तोत्रम्
content:
  english: gargakritam shrikrishnastotram garga uvaca | he krishna jagatam natha bhaktanam bhayabhanjana
    | prasanno bhava mamisha dehi dasyam padambuje || 193|| tvatpitra me dhanam dattam tena me kim prayojanam
    | dehi me nishcalam bhaktim bhaktanamabhayaprada || 194|| animadikasiddhishu yogeshu muktishu prabho
    | jnanatattve'maratve va kincinnasti spriha mama || 195|| indratve va manutve va svargalokaphale ciram
    | nasti me manaso vancha tvatpadasevanam vina || 196|| salokyam sarshtisarupye samipyaikatvamipsitam
    | naham grihnami te brahmamstvatpadasevanam vina || 197|| goloke vapi patale vase nasti manorathah
    | kintu te caranambhoje santatam smritirastu me || 198|| tvanmantram shankaratprapya katijanmaphalodayat
    | sarvajno'ham sarvadarshi sarvatra gatirastu me || 199|| kripam kuru kripasindho dinabandho padambuje
    | raksha mamabhayam dattva mrityurme kim karishyati || 200|| sarveshamishvarah sarvastvatpadambhojasevaya
    | mrityunjayo'ntakalashca babhuva yoginam guruh || 201|| brahma vidhata jagatam tvatpadambhojasevaya
    | yasyaikadivase brahmanpatantindrashcaturdasha || 202|| tvatpadasevaya dharmah sakshi ca sarvakarmanam
    | pata ca phaladata ca jitva kalam sudurjayam || 203|| sahasravadanah shesho yatpadambujasevaya |
    dhatte siddharthavadvishvam shivah kanthe visham yatha || 204|| sarvasampadvidhatri ya devinam ca
    paratpara | karoti satatam lakshmih keshaistvatpadamarjanam || 205|| prakritirbijarupa sa sarvesham
    shaktirupini | smaramsmaram tvatpadabjam babhuva tatparavara || 206|| parvati sarvarupa sa sarvesham
    buddhirupini | tvatpadasevaya kantam lalabha shivamishvaram || 207|| vidyadhishthatri devi ya jnanamata
    sarasvati | pujya babhuva sarvesham sampujya tvatpadambujam || 208|| savitri vedajanani punati bhuvanatrayam
    | brahmano brahmananam ca gatistvatpadasevaya || 209|| kshama jagadvibhartum ca ratnagarbha vasundhara
    | prasutih sarvasasyanam tvatpadapadmasevaya || 210|| radha mamamshasambhuta tava tulya ca tejasa
    | sthitva vakshasi te padam sevate'nyasya ka katha || 211|| yatha sharvadayo deva devyah padmadayo
    yatha | sanatham kuru mamisha ishvarasya sama kripa || 212|| na yasyami griham natha na grihnami dhanam
    tava | kritva mam raksha padabjasevayam sevakam ratam || 213|| iti stutva sashrunetrah papata carane
    hareh | ruroda ca bhrisham bhaktya pulakancitavigrahah || 214|| iti shribrahmavaivartapurane shrikrishnajanmakhande
    purve trayodashadhyayantargatam gargakritam shrikrishnastotram samaptam | brahmavaivartapurana | shrikrishnajanma
  devanagari: गर्गकृतं श्रीकृष्णस्तोत्रम् गर्ग उवाच । हे कृष्ण जगतां नाथ भक्तानां भयभञ्जन । प्रसन्नो भव
    मामीश देहि दास्यं पदाम्बुजे ॥ १९३॥ त्वत्पित्रा मे धनं दत्तं तेन मे किं प्रयोजनम् । देहि मे निश्चलां
    भक्तिं भक्तानामभयप्रद ॥ १९४॥ अणिमादिकसिद्धिषु योगेषु मुक्तिषु प्रभो । ज्ञानतत्त्वेऽमरत्वे वा किञ्चिन्नास्ति
    स्पृहा मम ॥ १९५॥ इन्द्रत्वे वा मनुत्वे वा स्वर्गलोकफले चिरम् । नास्ति मे मनसो वाञ्छा त्वत्पादसेवनं
    विना ॥ १९६॥ सालोक्यं सार्ष्टिसारूप्ये सामीप्यैकत्वमीप्सितम् । नाहं गृह्णामि ते ब्रह्मंस्त्वत्पादसेवनं
    विना ॥ १९७॥ गोलोके वापि पाताले वासे नास्ति मनोरथः । किन्तु ते चरणाम्भोजे सन्ततं स्मृतिरस्तु मे ॥ १९८॥
    त्वन्मन्त्रं शङ्करात्प्राप्य कतिजन्मफलोदयात् । सर्वज्ञोऽहं सर्वदर्शी सर्वत्र गतिरस्तु मे ॥ १९९॥ कृपां
    कुरु कृपासिन्धो दीनबन्धो पदाम्बुजे । रक्ष मामभयं दत्त्वा मृत्युर्मे किं करिष्यति ॥ २००॥ सर्वेषामीश्वरः
    सर्वस्त्वत्पादाम्भोजसेवया । मृत्युञ्जयोऽन्तकालश्च बभूव योगिनां गुरुः ॥ २०१॥ ब्रह्मा विधाता जगतां त्वत्पादाम्भोजसेवया
    । यस्यैकदिवसे ब्रह्मन्पतन्तीन्द्राश्चतुर्दश ॥ २०२॥ त्वत्पादसेवया धर्मः साक्षी च सर्वकर्मणाम् । पाता
    च फलदाता च जित्वा कालं सुदुर्जयम् ॥ २०३॥ सहस्रवदनः शेषो यत्पादाम्बुजसेवया । धत्ते सिद्धार्थवद्विश्वं
    शिवः कण्ठे विषं यथा ॥ २०४॥ सर्वसम्पद्विधात्री या देवीनां च परात्परा । करोति सततं लक्ष्मीः केशैस्त्वत्पादमार्जनम्
    ॥ २०५॥ प्रकृतिर्बीजरूपा सा सर्वेषां शक्तिरूपिणी । स्मारंस्मारं त्वत्पदाब्जं बभूव तत्परावरा ॥ २०६॥
    पार्वती सर्वरूपा सा सर्वेषां बुद्धिरूपिणी । त्वत्पादसेवया कान्तं ललाभ शिवमीश्वरम् ॥ २०७॥ विद्याधिष्ठात्री
    देवी या ज्ञानमाता सरस्वती । पूज्या बभूव सर्वेषां सम्पूज्य त्वत्पदाम्बुजम् ॥ २०८॥ सावित्री वेदजननी
    पुनाति भुवनत्रयम् । ब्रह्मणो ब्राह्मणानां च गतिस्त्वत्पादसेवया ॥ २०९॥ क्षमा जगद्विभर्तुं च रत्नगर्भा
    वसुन्धरा । प्रसूतिः सर्वसस्यानां त्वत्पादपद्मसेवया ॥ २१०॥ राधा ममांशसम्भूता तव तुल्या च तेजसा । स्थित्वा
    वक्षसि ते पादं सेवतेऽन्यस्य का कथा ॥ २११॥ यथा शर्वादयो देवा देव्यः पद्मादयो यथा । सनाथं कुरु मामीश
    ईश्वरस्य समा कृपा ॥ २१२॥ न यास्यामि गृहं नाथ न गृह्णामि धनं तव । कृत्वा मां रक्ष पादाब्जसेवायां सेवकं
    रतम् ॥ २१३॥ इति स्तुत्वा साश्रुनेत्रः पपात चरणे हरेः । रुरोद च भृशं भक्त्या पुलकाञ्चितविग्रहः ॥ २१४॥
    इति श्रीब्रह्मवैवर्तपुराणे श्रीकृष्णजन्मखण्डे पूर्वे त्रयोदशाध्यायान्तर्गतं गर्गकृतं श्रीकृष्णस्तोत्रं
    समाप्तम् । ब्रह्मवैवर्तपुराण । श्रीकृष्णजन्म
