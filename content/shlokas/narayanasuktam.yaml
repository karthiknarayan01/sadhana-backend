id: narayanasuktam
category: sukta
name:
  english: narayanasuktam
  devanagari: नारायणसूक्तम्
content:
  english: n sa̱rvam prati̭shthitam | tasya̱ madhyḙ ma̱hana̭gagnirvi̱shvarci̭rvi̱shvato̭mukhah | so'gra̭bhu̱gvibha̭janti̱shtha̱nnaha̭ramaja̱rah
    ka̱vih | ti̱rya̱gu̱rdhvama̭dhashsha̱yi̱ ra̱shmaya̭stasya̱ santa̭ta | sa̱nta̱paya̭ti svam de̱hamapa̭datala̱masta̭kah
    | tasya̱ madhye̱ vahni̭shikha a̱niyo
  devanagari: न् स॒र्वं प्रति॑ष्ठितम् । तस्य॒ मध्ये॑ म॒हान॑गग्निर्वि॒श्वार्चि॑र्वि॒श्वतो॑मुखः । सोऽग्र॑भु॒ग्विभ॑जन्ति॒ष्ठ॒न्नाहा॑रमज॒रः
    क॒विः । ति॒र्य॒गू॒र्ध्वम॑धश्शा॒यी॒ र॒श्मय॑स्तस्य॒ सन्त॑ता । स॒न्ता॒पय॑ति स्वं दे॒हमापा॑दतल॒मस्त॑कः
    । तस्य॒ मध्ये॒ वह्नि॑शिखा अ॒णीयो
meaning: {}
