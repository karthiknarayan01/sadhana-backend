    दक्किनमाट लेमिटिकि दाशरथी करुणापयोनिधी कलुषम्बुलॆल्ल बयलम्बडद्रोचिन क वाटमै डीकॊनिप्रोवुचुनिक्क मनिधीयुतुलॆन्नँददीय
