id: yogakund
category: upanishad
name:
  english: yogakund
  devanagari: योगकुन्द्
content:
  english: hridaye gale || 49|| shanaih shanairyada pranastundasandhim nigacchati | tundadosham vinirdhuya
    kartavyam satatam shanaih || 50|| purakante tu kartavyo bandho jalandharabhidhah | kanthasankocarupo'sau
    vayumarganirodhakah || 51|| adhastatkuncanenashu kanthasankocane krite | madhye pashcimatanena syatprano
    brahmanadigah || 52|| purvoktena kramenaiva samyagasanamasthitah | calanam tu sarasvatyah kritva pranam
    nirodhayet || 53|| prathame divase karyam kumbhakanam catushtayam | pratyekam dashasankhyakam dvitiye
    pancabhistatha || 54|| vishatyalam tritiye'hni pancavriddhya dine dine | kartavyah kumbhako nityam
    bandhatrayasamanvitah || 55|| diva suptirnishayam tu jagaradatimaithunat | bahusankramanam nityam
    rodhanmutrapurishayoh || 56|| vishamashanadoshacca prayasapranacintanat | shighramutpadyate rogah
    stambhayedyadi samyami || 57|| yogabhyasena me roga utpanna iti kathyate | tato'bhyasam tyajedevam
    prathamam vighna ucyate || 58|| dvitiyam samshayakhyam ca tritiyam ca pramattata | alasyakhyam caturtham
    ca nidrarupam tu pancamam || 59|| shashtham tu viratirbhrantih saptamam parikirtitam | vishamam cashtamam
    caiva anakhyam navamam smritam || 60|| alabdhiryogatattvasya dashamam procyate budhaih | ityetadvighnadashakam
    vicarena tyajedbudhah || 61|| pranabhyasastatah karyo nityam sattvasthaya dhiya | sushumna liyate
    cittam tatha vayuh pradhavati || 62|| shushke male tu yogi ca syadgatishcalita tatah | adhogatimapanam
    vai urdhvagam kurute balat || 63|| akuncanena tam prahurmulabandho'yamucyate | apanashcordhvago bhutva
    vahnina saha gacchati || 64|| pranasthanam tato vahnih pranapanau ca satvaram | militva kundalim yati
    prasupta kundalakritih || 65|| tenagnina ca santapta pavanenaiva calita | prasarya svashariram tu
    sushumna vadanantare || 66|| brahmagranthim tato bhittva rajogunasamudbhavam | sushumna vadane shighram
    vidyullekheva samsphuret || 67|| vishnugranthim prayatyuccaih satvaram hridi samsthita | urdhvam gacchati
    yaccaste rudragranthim tadudbhavam || 68|| bhruvormadhye tu sambhidya yati shitamshumandalam | anahatakhyam
    yaccakram dalaih shodashabhiryutam || 69|| tatra shitamshusanjatam dravam shoshayati svayam | calite
    pranavegena raktam pitam ravergrahat || 70|| yatenducakram yatraste shuddhashleshmadravatmakam | tatra
    siktam grasatyushnam katham shitasvabhavakam || 71|| tathaiva rabhasa shuklam candrarupam hi tapyate
    | urdhvam pravahati kshubdha tadaivam bhramatetaram || 72|| tasyasvadavashaccittam bahishtham vishayeshu
    yat | tadeva paramam bhuktva svasthah svatmarato yuva || 73|| prakrityashtakarupam ca sthanam gacchati
    kundali | krodikritya shivam yati krodikritya viliyate || 74|| ityadhordhvarajah shuklam shive tadanu
    marutah | pranapanau samau yati sada jatau tathaiva ca || 75|| bhute'lpe capyanalpe va vacake tvativardhate
    | dhavayatyakhila vata agnimushahiranyavat || 76|| adhibhautikadeham tu adhidaivikavigrahe | deho'tivimalam
    yati cativahikatamiyat || 77|| jadyabhavavinirmuktamamalam cinmayatmakam | tasyativahikam mukhyam
    sarvesham tu madatmakam || 78|| jayabhavavinirmuktih kalarupasya vibhramah | iti tam svasvarupa hi
    mati rajjubhujangavat || 79|| mrishaivodeti sakalam mrishaiva praviliyate | raupyabuddhih shuktikayam
    stripumsorbhramato yatha || 80|| pindabrahmandayoraikyam lingasutratmanorapi | svapavyakritayoraikyam
    svaprakashacidatmanoh || 81|| shaktih kundalini nama bisatantunibha shubha | mulakandam phanagrena
    drishtva kamalakandavat || 82|| mukhena puccham samgrihya brahmarandhrasamanvita | padmasanagatah
    svastho gudamakuncya sadhakah || 83|| vayumurdhvagatam kurvankumbhakavishtamanasah | vayvaghatavashadagnih
    svadhishthanagato jvalan || 84|| jvalanaghatapavanaghatorunnidrito'hirat | brahmagranthim tato bhittva
    vishnugranthim bhinattyatah || 85|| rudragranthim ca bhittvaiva kamalani bhinatti shat | sahasrakamale
    shaktih shivena saha modate || 86|| saivavastha para jneya saiva nirvritikarini iti || iti prathamo'dhyayah
    || 1|| athaham sampravakshyami vidyam khecarisamjnikam | yatha vijnanavanasya loke'sminnajaro'marah
    || 1|| mrityuvyadhijaragrasto drishtva vidyamimam mune | buddhim dridhataram kritva khecarim tu samabhyaset
    || 2|| jaramrityugadaghno yah khecarim vetti bhutale | granthatashcarthatashcaiva tadabhyasaprayogatah
    || 3|| tam mune sarvabhavena gurum matva samashrayet | durlabha khecari vidya tadabhyaso'pi durlabhah
    || 4|| abhyasam melanam caiva yugapannaiva sidhyati | abhyasamatranirata na vindante ha melanam ||
    5|| abhyasam labhate brahmanjanmajanmantare kvacit | melanam tu janmanam shatante'pi na labhyate ||
    6|| abhyasam bahujanmante kritva tadbhavasadhitam | melanam labhate kashcidyogi janmantare kvacit
    || 7|| yada tu melanam yogi labhate guruvaktratah | tada tatsiddhimapnoti yadukta shastrasantatau
    || 8|| granthatashcarthatashcaiva melanam labhate yada | tada shivatvamapnoti nirmuktah sarvasamsriteh
    || 9|| shastram vinapi samboddhum guravo'pi na shaknuyuh | tasmatsudurlabhataram labhyam shastramidam
    mune || 10|| yavanna labhyate shastram tavadgam paryatedyatih | yada samlabhyate shastram tada siddhih
    kare sthita || 11|| na shastrena vina siddhirdrishta caiva jagattraye | tasmanmelanadataram shastradataramacyutam
    || 12|| tadabhyasapradataram shivam matva samashrayet | labdhva shastramidam mahyamanyesham na prakashayet
    || 13|| tasmatsarvaprayatnena gopaniyam vijanata | yatraste ca gururbrahmandivyayogapradayakah ||
    14|| tatra gatva ca tenoktavidyam samgrihya khecarim | tenoktah samyagabhyasam kuryadadavatandritah
    || 15|| anaya vidyaya yogi khecarisiddhibhagbhavet | khecarya khecarim yunjankhecaribijapuraya ||
    16|| khecaradhipatirbhutva khecareshu sada vaset | khecaravasatham vahnimambumandalabhushitam || 17||
    akhyatam khecaribijam tena yogah prasidhyati | somamshanavakam varnam pratilomena coddharet || 18||
    tasmattryamshakamakhyatamaksharam candrarupakam | tasmadapyashtamam varnam vilomena param mune ||
    19|| tatha tatparamam viddhi tadadirapi pancami | indoshca bahubhinne ca kuto'yam parikirtitah ||
    20|| gurupadeshalabhyam ca sarvayogaprasiddhidam | yattasya dehaja maya niruddhakaranashraya || 21||
    svapne'pi na labhettasya nityam dvadashajapyatah | ya imam panca lakshani japedapi suyantritah ||
    22|| tasya shrikhecarisiddhih svayameva pravartate | nashyanti sarvavighnani prasidanti ca devatah
    || 23|| valipalitanashashca bhavishyati na samshayah | evam labdhva mahavidyamabhyasam karayettatah
    || 24|| anyatha klishyate brahmanna siddhih khecaripathe | yadabhyasavidhau vidyam na labhedyah sudhamayim
    || 25|| tatah sammelakadau ca labdhva vidyam sada japet | nanyatha rahito brahmanna kincitsiddhibhagbhavet
    || 26|| yadidam labhyate shastram tada vidyam samashrayet | tatastadoditam siddhimashu tam labhate
    munih || 27|| talumulam samutkrishya saptavasaramatmavit | svaguruktaprakarena malam sarvam vishodhayet
    || 28|| snuhipatranibham shastram sutikshnam snigdhanirmalam | samadaya tatastena romamatram samucchinet
    || 29|| hitva saindhavapathyabhyam curnitabhyam prakarshayet | punah saptadine prapte romamatram samucchinet
    || 30|| evam kramena shanmasam nityodyuktah samacaret | shanmasadrasanamulam sirabaddham pranashyati
    || 31|| atha vagishvaridhama shiro vastrena veshtayet | shanairutkarshayedyogi kalavelavidhanavit
    || 32|| punah shanmasamatrena nityam sangharshananmune | bhrumadhyavadhi capyeti tiryakkanabilavadhih
    || 33|| adhashca cubukam mulam prayati kramacarita | punah samvatsaranam tu tritiyadeva lilaya ||
    34|| keshantamurdhvam kramati tiryak shakhavadhirmune | adhastatkanthakupantam punarvarshatrayena
    tu || 35|| brahmarandhram samavritya tishthedeva na samshayah | tiryak culitalam yati adhah kanthabilavadhi
    || 36|| shanaih shanairmastakacca mahavajrakapatabhit | purvam bijayuta vidya hyakhyata yatidurlabha
    || 37|| tasyah shadangam kurvita taya shatsvarabhinnaya | kuryadevam karanyasam sarvasiddhyadihetave
    || 38|| shanairevam prakartavyamabhyasam yugapannahi | yugapadvartate yasya shariram vilayam vrajet
    || 39|| tasmacchanaih shanaih karyamabhyasam munipungava | yada ca bahyamargena jihva brahmabilam
    vrajet || 40|| tada brahmargalam brahmandurbhedyam tridashairapi | angulyagrena samghrishya jihvamatram
    niveshayet || 41|| evam varshatrayam kritva brahmadvaram pravishyati | brahmadvare pravishte tu samyanmathanamacaret
    || 42|| mathanena vina kecitsadhayanti vipashcitah | khecarimantrasiddhasya sidhyate mathanam vina
    || 43|| japam ca mathanam caiva kritva shighram phalam labhet | svarnajam raupyajam vapi lohajam va
    shalakikam || 44|| niyojya nasikarandhram dugdhasiktena tantuna | pranannirudhya hridaye sukhamasanamatmanah
    || 45|| shanaih sumathanam kuryadbhrumadhye nyasya cakshushi | shanmasam mathanavastha bhavenaiva
    prajayate || 46|| yatha sushuptirbalanam yatha bhavastatha bhavet | na sada mathanam shastam mase
    mase samacaret || 47|| sada rasanaya yogi margam na parisamkramet | evam dvadashavarshante samsiddhirbhavati
    dhruva || 48|| sharire sakalam vishvam pashyatyatmavibhedatah | brahmando'yam mahamargo rajadantordhvakundali
    || 49|| iti|| iti dvitiyo'dhyayah || 2|| melanamanuh | hrim bham sam pam pham sam ksham | padmaja
    uvaca | amavasya ca pratipatpaurnamasi ca shankara | asyah ka varnyate samjna etadakhyahi tattvatah
    || 1|| pratipaddinato'kale amavasya tathaiva ca | paurnamasyam sthirikuryatsa ca pantha hi nanyatha
    || 2|| kamena vishayakankshi vishayatkamamohitah | dvaveva santyajennityam niranjanamupashrayet ||
    3|| aparam santyajetsarvam yadicchedatmano hitam | shaktimadhye manah kritva manah shakteshca madhyagam
    || 4|| manasa mana alokya tattyajetparamam padam | mana eva hi bindushca utpattisthitikaranam || 5||
    manasotpadyate binduryatha kshiram ghritatmakam | na ca bandhanamadhyastham tadvai karanamanasam ||
    6|| candrarkamadhyama shaktiryatrastha tatra bandhanam | jnatva sushumnam tadbhedam kritva vayum ca
    madhyagam || 7|| sthitvasau baindavasthane ghranarandhre nirodhayet | vayum bindum samakhyatam sattvam
    prakritimeva ca || 8|| shat cakrani parijnatva pravishetsukhamandalam | muladharam svadhishthanam
    manipuram tritiyakam || 9|| anahatam vishuddham ca ajnacakram ca shashthakam | adharam gudamityuktam
    svadhishthanam tu laingikam || 10|| manipuram nabhidesham hridayasthamanahatam | vishuddhih kanthamule
    ca ajnacakram ca mastakam || 11|| shat cakrani parijnatva pravishetsukhamandale | pravishedvayumakrishya
    tayaivordhvam niyojayet || 12|| evam samabhyasedvayum sa brahmandamayo bhavet | vayum bindum tatha
    cakram cittam caiva samabhyaset || 13|| samadhimekena samamamritam yanti yoginah | yathagnirdarumadhyastho
    nottishthenmathanam vina || 14|| vina cabhyasayogena jnanadipastatha na hi | ghatamadhyagato dipo
    bahye naiva prakashate || 15|| bhinne tasminghate caiva dipajvala ca bhasate | svakayam ghatamityuktam
    yatha dipo hi tatpadam || 16|| guruvakyasamabhinne brahmajnanam sphutibhavet | karnadharam gurum prapya
    kritva sukshmam taranti ca || 17|| abhyasavasanashaktya taranti bhavasagaram | parayamankuribhuya
    pashyantam dvidalikrita || 18|| madhyamayam mukulita vaikharyam vikasikrita | purvam yathodita ya
    vagvilomenastaga bhavet || 19|| tasya vacah paro devah kutastho vakprabodhakah | so'hamasmiti nishcitya
    yah sada vartate puman || 20|| shabdairuccavacairnicairbhashito'pi na lipyate | vishvashca taijasashcaiva
    prajnashceti ca te trayah || 21|| viraddhiranyagarbhashca ishvarashceti te trayah | brahmandam caiva
    pindandam loka bhuradayah kramat || 22|| svasvopadhilayadeva liyante pratyagatmani | andam jnanagnina
    taptam liyate karanaih saha || 23|| paramatmani linam tatparam brahmaiva jayate | tatah stimitagambhiram
    na tejo na tamastatam || 24|| anakhyamanabhivyaktam satkincidavashishyate | dhyatva madhyasthamatmanam
    kalashantaradipavat || 25|| angushthamatramatmanamadhumajyotirupakam | prakashayantamantastham dhyayetkutasthamavyayam
    || 26|| vijnanatma tatha dehe jagratsvapnasushuptitah | mayaya mohitah pashcadbahujanmantare punah
    || 27|| satkarmaparipakattu svavikaram cikirshati | ko'ham kathamayam doshah samsarakhya upagatah
    || 28|| jagratsvapne vyavaharantsushuptau kva gatirmama | iti cintaparo bhutva svabhasa ca visheshatah
    || 29|| ajnanattu cidabhaso bahistapena tapitah | dagdham bhavatyeva tada tulapindamivagnina || 30||
    daharasthah pratyagatma nashte jnane tatah param | vitato vyapya vijnanam dahatyeva kshanena tu ||
    31|| manomayajnanamayansamyagdagdhva kramena tu | ghatasthadipavacchashvadantareva prakashate || 32||
    dhyayannaste munishcaivamasupteramritestu yah | jivanmuktah sa vijneyah sa dhanyah kritakrityavan
    || 33|| jivanmuktapadam tyaktva svadehe kalasatkrite | vishatyadehamuktatvam pavano'spandatamiva ||
    34|| ashabdamasparshamarupamavyayam tatharasam nityamagandhavacca yat | anadyanantam mahatah param
    dhruvam tadeva shishyatyamalam niramayam || 35|| ityupanishat || om saha navavatu saha nau bhunaktu
    saha viryam karavavahai | tejasvinavadhitamastu ma vidvishavahai || om shantih shantih shantih ||
    harih om tatsat || iti yogakundalinyupanishatsamapta ||
  devanagari: हृदये गले ॥ ४९॥ शनैः शनैर्यदा प्राणस्तुन्दसन्धिं निगच्छति । तुन्ददोषं विनिर्धूय कर्तव्यं
    सततं शनैः ॥ ५०॥ पूरकान्ते तु कर्तव्यो बन्धो जालन्धराभिधः । कण्ठसङ्कोचरूपोऽसौ वायुमार्गनिरोधकः ॥ ५१॥
    अधस्तात्कुञ्चनेनाशु कण्ठसङ्कोचने कृते । मध्ये पश्चिमतानेन स्यात्प्राणो ब्रह्मनाडिगः ॥ ५२॥ पूर्वोक्तेन
    क्रमेणैव सम्यगासनमास्थितः । चालनं तु सरस्वत्याः कृत्वा प्राणं निरोधयेत् ॥ ५३॥ प्रथमे दिवसे कार्यं
    कुम्भकानां चतुष्टयम् । प्रत्येकं दशसङ्ख्याकं द्वितीये पञ्चभिस्तथा ॥ ५४॥ विशत्यलं तृतीयेऽह्नि पञ्चवृद्ध्या
    दिने दिने । कर्तव्यः कुम्भको नित्यं बन्धत्रयसमन्वितः ॥ ५५॥ दिवा सुप्तिर्निशायां तु जागरादतिमैथुनात्
    । बहुसङ्क्रमणं नित्यं रोधान्मूत्रपुरीषयोः ॥ ५६॥ विषमाशनदोषाच्च प्रयासप्राणचिन्तनात् । शीघ्रमुत्पद्यते
    रोगः स्तम्भयेद्यदि संयमी ॥ ५७॥ योगाभ्यासेन मे रोग उत्पन्न इति कथ्यते । ततोऽभ्यासं त्यजेदेवं प्रथमं
    विघ्न उच्यते ॥ ५८॥ द्वितीयं संशयाख्यं च तृतीयं च प्रमत्तता । आलस्याख्यं चतुर्थं च निद्रारूपं तु पञ्चमम्
    ॥ ५९॥ षष्ठं तु विरतिर्भ्रान्तिः सप्तमं परिकीर्तितम् । विषमं चाष्टमं चैव अनाख्यं नवमं स्मृतम् ॥ ६०॥
    अलब्धिर्योगतत्त्वस्य दशमं प्रोच्यते बुधैः । इत्येतद्विघ्नदशकं विचारेण त्यजेद्बुधः ॥ ६१॥ प्राणाभ्यासस्ततः
    कार्यो नित्यं सत्त्वस्थया धिया । सुषुम्ना लीयते चित्तं तथा वायुः प्रधावति ॥ ६२॥ शुष्के मले तु योगी
    च स्याद्गतिश्चलिता ततः । अधोगतिमपानं वै ऊर्ध्वगं कुरुते बलात् ॥ ६३॥ आकुञ्चनेन तं प्राहुर्मूलबन्धोऽयमुच्यते
    । अपानश्चोर्ध्वगो भूत्वा वह्निना सह गच्छति ॥ ६४॥ प्राणस्थानं ततो वह्निः प्राणापानौ च सत्वरम् । मिलित्वा
    कुण्डलीं याति प्रसुप्ता कुण्डलाकृतिः ॥ ६५॥ तेनाग्निना च सन्तप्ता पवनेनैव चालिता । प्रसार्य स्वशरीरं
    तु सुषुम्ना वदनान्तरे ॥ ६६॥ ब्रह्मग्रन्थिं ततो भित्त्वा रजोगुणसमुद्भवम् । सुषुम्ना वदने शीघ्रं विद्युल्लेखेव
    संस्फुरेत् ॥ ६७॥ विष्णुग्रन्थिं प्रयात्युच्चैः सत्वरं हृदि संस्थिता । ऊर्ध्वं गच्छति यच्चास्ते रुद्रग्रन्थिं
    तदुद्भवम् ॥ ६८॥ भ्रुवोर्मध्ये तु संभिद्य याति शीतांशुमण्डलम् । अनाहताख्यं यच्चक्रं दलैः षोडशभिर्युतम्
    ॥ ६९॥ तत्र शीतांशुसञ्जातं द्रवं शोषयति स्वयम् । चलिते प्राणवेगेन रक्तं पीतं रवेर्ग्रहात् ॥ ७०॥ यातेन्दुचक्रं
    यत्रास्ते शुद्धश्लेष्मद्रवात्मकम् । तत्र सिक्तं ग्रसत्युष्णं कथं शीतस्वभावकम् ॥ ७१॥ तथैव रभसा शुक्लं
    चन्द्ररूपं हि तप्यते । ऊर्ध्वं प्रवहति क्षुब्धा तदैवं भ्रमतेतराम् ॥ ७२॥ तस्यास्वादवशाच्चित्तं बहिष्ठं
    विषयेषु यत् । तदेव परमं भुक्त्वा स्वस्थः स्वात्मरतो युवा ॥ ७३॥ प्रकृत्यष्टकरूपं च स्थानं गच्छति कुण्डली
    । क्रोडीकृत्य शिवं याति क्रोडीकृत्य विलीयते ॥ ७४॥ इत्यधोर्ध्वरजः शुक्लं शिवे तदनु मारुतः । प्राणापानौ
    समौ याति सदा जातौ तथैव च ॥ ७५॥ भूतेऽल्पे चाप्यनल्पे वा वाचके त्वतिवर्धते । धवयत्यखिला वाता अग्निमूषाहिरण्यवत्
    ॥ ७६॥ आधिभौतिकदेहं तु आधिदैविकविग्रहे । देहोऽतिविमलं याति चातिवाहिकतामियात् ॥ ७७॥ जाड्यभावविनिर्मुक्तममलं
    चिन्मयात्मकम् । तस्यातिवाहिकं मुख्यं सर्वेषां तु मदात्मकम् ॥ ७८॥ जायाभवविनिर्मुक्तिः कालरूपस्य विभ्रमः
    । इति तं स्वस्वरूपा हि मती रज्जुभुजङ्गवत् ॥ ७९॥ मृषैवोदेति सकलं मृषैव प्रविलीयते । रौप्यबुद्धिः शुक्तिकायां
    स्त्रीपुंसोर्भ्रमतो यथा ॥ ८०॥ पिण्डब्रह्माण्डयोरैक्यं लिङ्गसूत्रात्मनोरपि । स्वापाव्याकृतयोरैक्यं
    स्वप्रकाशचिदात्मनोः ॥ ८१॥ शक्तिः कुण्डलिनी नाम बिसतन्तुनिभा शुभा । मूलकन्दं फणाग्रेण दृष्ट्वा कमलकन्दवत्
    ॥ ८२॥ मुखेन पुच्छं संगृह्य ब्रह्मरन्ध्रसमन्विता । पद्मासनगतः स्वस्थो गुदमाकुञ्च्य साधकः ॥ ८३॥ वायुमूर्ध्वगतं
    कुर्वन्कुम्भकाविष्टमानसः । वाय्वाघातवशादग्निः स्वाधिष्ठानगतो ज्वलन् ॥ ८४॥ ज्वलनाघातपवनाघातोरून्निद्रितोऽहिराट्
    । ब्रह्मग्रन्थिं ततो भित्त्वा विष्णुग्रन्थिं भिनत्त्यतः ॥ ८५॥ रुद्रग्रन्थिं च भित्त्वैव कमलानि भिनत्ति
    षट् । सहस्रकमले शक्तिः शिवेन सह मोदते ॥ ८६॥ सैवावस्था परा ज्ञेया सैव निर्वृतिकारिणी इति ॥ इति प्रथमोऽध्यायः
    ॥ १॥ अथाहं सम्प्रवक्ष्यामि विद्यां खेचरिसंज्ञिकाम् । यथा विज्ञानवानस्या लोकेऽस्मिन्नजरोऽमरः ॥ १॥ मृत्युव्याधिजराग्रस्तो
    दृष्ट्वा विद्यामिमां मुने । बुद्धिं दृढतरां कृत्वा खेचरीं तु समभ्यसेत् ॥ २॥ जरामृत्युगदघ्नो यः खेचरीं
    वेत्ति भूतले । ग्रन्थतश्चार्थतश्चैव तदभ्यासप्रयोगतः ॥ ३॥ तं मुने सर्वभावेन गुरुं मत्वा समाश्रयेत्
    । दुर्लभा खेचरी विद्या तदभ्यासोऽपि दुर्लभः ॥ ४॥ अभ्यासं मेलनं चैव युगपन्नैव सिध्यति । अभ्यासमात्रनिरता
    न विन्दन्ते ह मेलनम् ॥ ५॥ अभ्यासं लभते ब्रह्मञ्जन्मजन्मान्तरे क्वचित् । मेलनं तु जन्मनां शतान्तेऽपि
    न लभ्यते ॥ ६॥ अभ्यासं बहुजन्मान्ते कृत्वा तद्भावसाधितम् । मेलनं लभते कश्चिद्योगी जन्मान्तरे क्वचित्
    ॥ ७॥ यदा तु मेलनं योगी लभते गुरुवक्त्रतः । तदा तत्सिद्धिमाप्नोति यदुक्ता शास्त्रसन्ततौ ॥ ८॥ ग्रन्थतश्चार्थतश्चैव
    मेलनं लभते यदा । तदा शिवत्वमाप्नोति निर्मुक्तः सर्वसंसृतेः ॥ ९॥ शास्त्रं विनापि संबोद्धुं गुरवोऽपि
    न शक्नुयुः । तस्मात्सुदुर्लभतरं लभ्यं शास्त्रमिदं मुने ॥ १०॥ यावन्न लभ्यते शास्त्रं तावद्गां पर्यटेद्यतिः
    । यदा संलभ्यते शास्त्रं तदा सिद्धिः करे स्थिता ॥ ११॥ न शास्त्रेण विना सिद्धिर्दृष्टा चैव जगत्त्रये
    । तस्मान्मेलनदातारं शास्त्रदातारमच्युतम् ॥ १२॥ तदभ्यासप्रदातारं शिवं मत्वा समाश्रयेत् । लब्ध्वा शास्त्रमिदं
    मह्यमन्येषां न प्रकाशयेत् ॥ १३॥ तस्मात्सर्वप्रयत्नेन गोपनीयं विजानता । यत्रास्ते च गुरुर्ब्रह्मन्दिव्ययोगप्रदायकः
    ॥ १४॥ तत्र गत्वा च तेनोक्तविद्यां संगृह्य खेचरीम् । तेनोक्तः सम्यगभ्यासं कुर्यादादावतन्द्रितः ॥ १५॥
    अनया विद्यया योगी खेचरीसिद्धिभाग्भवेत् । खेचर्या खेचरीं युञ्जन्खेचरीबीजपूरया ॥ १६॥ खेचराधिपतिर्भूत्वा
    खेचरेषु सदा वसेत् । खेचरावसथं वह्निमम्बुमण्डलभूषितम् ॥ १७॥ आख्यातं खेचरीबीजं तेन योगः प्रसिध्यति ।
    सोमांशनवकं वर्णं प्रतिलोमेन चोद्धरेत् ॥ १८॥ तस्मात्त्र्यंशकमाख्यातमक्षरं चन्द्ररूपकम् । तस्मादप्यष्टमं
    वर्णं विलोमेन परं मुने ॥ १९॥ तथा तत्परमं विद्धि तदादिरपि पञ्चमी । इन्दोश्च बहुभिन्ने च कूटोऽयं परिकीर्तितः
    ॥ २०॥ गुरूपदेशलभ्यं च सर्वयोगप्रसिद्धिदम् । यत्तस्य देहजा माया निरुद्धकरणाश्रया ॥ २१॥ स्वप्नेऽपि न
    लभेत्तस्य नित्यं द्वादशजप्यतः । य इमां पञ्च लक्षाणि जपेदपि सुयन्त्रितः ॥ २२॥ तस्य श्रीखेचरीसिद्धिः
    स्वयमेव प्रवर्तते । नश्यन्ति सर्वविघ्नानि प्रसीदन्ति च देवताः ॥ २३॥ वलीपलितनाशश्च भविष्यति न संशयः
    । एवं लब्ध्वा महाविद्यामभ्यासं कारयेत्ततः ॥ २४॥ अन्यथा क्लिश्यते ब्रह्मन्न सिद्धिः खेचरीपथे । यदभ्यासविधौ
    विद्यां न लभेद्यः सुधामयीम् ॥ २५॥ ततः संमेलकादौ च लब्ध्वा विद्यां सदा जपेत् । नान्यथा रहितो ब्रह्मन्न
    किञ्चित्सिद्धिभाग्भवेत् ॥ २६॥ यदिदं लभ्यते शास्त्रं तदा विद्यां समाश्रयेत् । ततस्तदोदितां सिद्धिमाशु
    तां लभते मुनिः ॥ २७॥ तालुमूलं समुत्कृष्य सप्तवासरमात्मवित् । स्वगुरूक्तप्रकारेण मलं सर्वं विशोधयेत्
    ॥ २८॥ स्नुहिपत्रनिभं शस्त्रं सुतीक्ष्णं स्निग्धनिर्मलम् । समादाय ततस्तेन रोममात्रं समुच्छिनेत् ॥ २९॥
    हित्वा सैन्धवपथ्याभ्यां चूर्णिताभ्यां प्रकर्षयेत् । पुनः सप्तदिने प्राप्ते रोममात्रं समुच्छिनेत् ॥
    ३०॥ एवं क्रमेण षण्मासं नित्योद्युक्तः समाचरेत् । षण्मासाद्रसनामूलं सिराबद्धं प्रणश्यति ॥ ३१॥ अथ वागीश्वरीधाम
    शिरो वस्त्रेण वेष्टयेत् । शनैरुत्कर्षयेद्योगी कालवेलाविधानवित् ॥ ३२॥ पुनः षण्मासमात्रेण नित्यं सङ्घर्षणान्मुने
    । भ्रूमध्यावधि चाप्येति तिर्यक्कणबिलावधिः ॥ ३३॥ अधश्च चुबुकं मूलं प्रयाति क्रमचारिता । पुनः संवत्सराणां
    तु तृतीयादेव लीलया ॥ ३४॥ केशान्तमूर्ध्वं क्रमति तिर्यक् शाखावधिर्मुने । अधस्तात्कण्ठकूपान्तं पुनर्वर्षत्रयेण
    तु ॥ ३५॥ ब्रह्मरन्ध्रं समावृत्य तिष्ठेदेव न संशयः । तिर्यक् चूलितलं याति अधः कण्ठबिलावधि ॥ ३६॥ शनैः
    शनैर्मस्तकाच्च महावज्रकपाटभित् । पूर्वं बीजयुता विद्या ह्याख्याता यतिदुर्लभा ॥ ३७॥ तस्याः षडङ्गं कुर्वीत
    तया षट्स्वरभिन्नया । कुर्यादेवं करन्यासं सर्वसिद्ध्यादिहेतवे ॥ ३८॥ शनैरेवं प्रकर्तव्यमभ्यासं युगपन्नहि
    । युगपद्वर्तते यस्य शरीरं विलयं व्रजेत् ॥ ३९॥ तस्माच्छनैः शनैः कार्यमभ्यासं मुनिपुङ्गव । यदा च बाह्यमार्गेण
    जिह्वा ब्रह्मबिलं व्रजेत् ॥ ४०॥ तदा ब्रह्मार्गलं ब्रह्मन्दुर्भेद्यं त्रिदशैरपि । अङ्गुल्यग्रेण संघृष्य
    जिह्वामात्रं निवेशयेत् ॥ ४१॥ एवं वर्षत्रयं कृत्वा ब्रह्मद्वारं प्रविश्यति । ब्रह्मद्वारे प्रविष्टे
    तु सम्यङ्मथनमाचरेत् ॥ ४२॥ मथनेन विना केचित्साधयन्ति विपश्चितः । खेचरीमन्त्रसिद्धस्य सिध्यते मथनं विना
    ॥ ४३॥ जपं च मथनं चैव कृत्वा शीघ्रं फलं लभेत् । स्वर्णजां रौप्यजां वापि लोहजां वा शलाकिकाम् ॥ ४४॥ नियोज्य
    नासिकारन्ध्रं दुग्धसिक्तेन तन्तुना । प्राणान्निरुध्य हृदये सुखमासनमात्मनः ॥ ४५॥ शनैः सुमथनं कुर्याद्भ्रूमध्ये
    न्यस्य चक्षुषी । षण्मासं मथनावस्था भावेनैव प्रजायते ॥ ४६॥ यथा सुषुप्तिर्बालानां यथा भावस्तथा भवेत्
    । न सदा मथनं शस्तं मासे मासे समाचरेत् ॥ ४७॥ सदा रसनया योगी मार्गं न परिसंक्रमेत् । एवं द्वादशवर्षान्ते
    संसिद्धिर्भवति ध्रुवा ॥ ४८॥ शरीरे सकलं विश्वं पश्यत्यात्माविभेदतः । ब्रह्माण्डोऽयं महामार्गो राजदन्तोर्ध्वकुण्डली
    ॥ ४९॥ इति॥ इति द्वितीयोऽध्यायः ॥ २॥ मेलनमनुः । ह्रीं भं सं पं फं सं क्षम् । पद्मज उवाच । अमावास्या
    च प्रतिपत्पौर्णमासी च शङ्कर । अस्याः का वर्ण्यते संज्ञा एतदाख्याहि तत्त्वतः ॥ १॥ प्रतिपद्दिनतोऽकाले
    अमावास्या तथैव च । पौर्णमास्यां स्थिरीकुर्यात्स च पन्था हि नान्यथा ॥ २॥ कामेन विषयाकाङ्क्षी विषयात्काममोहितः
    । द्वावेव सन्त्यजेन्नित्यं निरञ्जनमुपाश्रयेत् ॥ ३॥ अपरं सन्त्यजेत्सर्वं यदिच्छेदात्मनो हितम् । शक्तिमध्ये
    मनः कृत्वा मनः शक्तेश्च मध्यगम् ॥ ४॥ मनसा मन आलोक्य तत्त्यजेत्परमं पदम् । मन एव हि बिन्दुश्च उत्पत्तिस्थितिकारणम्
    ॥ ५॥ मनसोत्पद्यते बिन्दुर्यथा क्षीरं घृतात्मकम् । न च बन्धनमध्यस्थं तद्वै कारणमानसम् ॥ ६॥ चन्द्रार्कमध्यमा
    शक्तिर्यत्रस्था तत्र बन्धनम् । ज्ञात्वा सुषुम्नां तद्भेदं कृत्वा वायुं च मध्यगम् ॥ ७॥ स्थित्वासौ बैन्दवस्थाने
    घ्राणरन्ध्रे निरोधयेत् । वायुं बिन्दुं समाख्यातं सत्त्वं प्रकृतिमेव च ॥ ८॥ षट् चक्राणि परिज्ञात्वा
    प्रविशेत्सुखमण्डलम् । मूलाधारं स्वाधिष्ठानं मणिपूरं तृतीयकम् ॥ ९॥ अनाहतं विशुद्धं च आज्ञाचक्रं च षष्ठकम्
    । आधारं गुदमित्युक्तं स्वाधिष्ठानं तु लैङ्गिकम् ॥ १०॥ मणिपूरं नाभिदेशं हृदयस्थमनाहतम् । विशुद्धिः
    कण्ठमूले च आज्ञाचक्रं च मस्तकम् ॥ ११॥ षट् चक्राणि परिज्ञात्वा प्रविशेत्सुखमण्डले । प्रविशेद्वायुमाकृष्य
    तयैवोर्ध्वं नियोजयेत् ॥ १२॥ एवं समभ्यसेद्वायुं स ब्रह्माण्डमयो भवेत् । वायुं बिन्दुं तथा चक्रं चित्तं
    चैव समभ्यसेत् ॥ १३॥ समाधिमेकेन समममृतं यान्ति योगिनः । यथाग्निर्दारुमध्यस्थो नोत्तिष्ठेन्मथनं विना
    ॥ १४॥ विना चाभ्यासयोगेन ज्ञानदीपस्तथा न हि । घटमध्यगतो दीपो बाह्ये नैव प्रकाशते ॥ १५॥ भिन्ने तस्मिन्घटे
    चैव दीपज्वाला च भासते । स्वकायं घटमित्युक्तं यथा दीपो हि तत्पदम् ॥ १६॥ गुरुवाक्यसमाभिन्ने ब्रह्मज्ञानं
    स्फुटीभवेत् । कर्णधारं गुरुं प्राप्य कृत्वा सूक्ष्मं तरन्ति च ॥ १७॥ अभ्यासवासनाशक्त्या तरन्ति भवसागरम्
    । परायामङ्कुरीभूय पश्यन्तां द्विदलीकृता ॥ १८॥ मध्यमायां मुकुलिता वैखर्यां विकसीकृता । पूर्वं यथोदिता
    या वाग्विलोमेनास्तगा भवेत् ॥ १९॥ तस्या वाचः परो देवः कूटस्थो वाक्प्रबोधकः । सोऽहमस्मीति निश्चित्य
    यः सदा वर्तते पुमान् ॥ २०॥ शब्दैरुच्चावचैर्नीचैर्भाषितोऽपि न लिप्यते । विश्वश्च तैजसश्चैव प्राज्ञश्चेति
    च ते त्रयः ॥ २१॥ विराड्ढिरण्यगर्भश्च ईश्वरश्चेति ते त्रयः । ब्रह्माण्डं चैव पिण्डाण्डं लोका भूरादयः
    क्रमात् ॥ २२॥ स्वस्वोपाधिलयादेव लीयन्ते प्रत्यगात्मनि । अण्डं ज्ञानाग्निना तप्तं लीयते कारणैः सह ॥
    २३॥ परमात्मनि लीनं तत्परं ब्रह्मैव जायते । ततः स्तिमितगम्भीरं न तेजो न तमस्ततम् ॥ २४॥ अनाख्यमनभिव्यक्तं
    सत्किञ्चिदवशिष्यते । ध्यात्वा मध्यस्थमात्मानं कलशान्तरदीपवत् ॥ २५॥ अङ्गुष्ठमात्रमात्मानमधूमज्योतिरूपकम्
    । प्रकाशयन्तमन्तस्थं ध्यायेत्कूटस्थमव्ययम् ॥ २६॥ विज्ञानात्मा तथा देहे जाग्रत्स्वप्नसुषुप्तितः । मायया
    मोहितः पश्चाद्बहुजन्मान्तरे पुनः ॥ २७॥ सत्कर्मपरिपाकात्तु स्वविकारं चिकीर्षति । कोऽहं कथमयं दोषः संसाराख्य
    उपागतः ॥ २८॥ जाग्रत्स्वप्ने व्यवहरन्त्सुषुप्तौ क्व गतिर्मम । इति चिन्तापरो भूत्वा स्वभासा च विशेषतः
    ॥ २९॥ अज्ञानात्तु चिदाभासो बहिस्तापेन तापितः । दग्धं भवत्येव तदा तूलपिण्डमिवाग्निना ॥ ३०॥ दहरस्थः
    प्रत्यगात्मा नष्टे ज्ञाने ततः परम् । विततो व्याप्य विज्ञानं दहत्येव क्षणेन तु ॥ ३१॥ मनोमयज्ञानमयान्सम्यग्दग्ध्वा
    क्रमेण तु । घटस्थदीपवच्छश्वदन्तरेव प्रकाशते ॥ ३२॥ ध्यायन्नास्ते मुनिश्चैवमासुप्तेरामृतेस्तु यः । जीवन्मुक्तः
    स विज्ञेयः स धन्यः कृतकृत्यवान् ॥ ३३॥ जीवन्मुक्तपदं त्यक्त्वा स्वदेहे कालसात्कृते । विशत्यदेहमुक्तत्वं
    पवनोऽस्पन्दतामिव ॥ ३४॥ अशब्दमस्पर्शमरूपमव्ययं तथारसं नित्यमगन्धवच्च यत् । अनाद्यनन्तं महतः परं ध्रुवं
    तदेव शिष्यत्यमलं निरामयम् ॥ ३५॥ इत्युपनिषत् ॥ ॐ सह नाववतु सह नौ भुनक्तु सह वीर्यं करवावहै । तेजस्विनावधीतमस्तु
    मा विद्विषावहै ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ हरिः ॐ तत्सत् ॥ इति योगकुण्डलिन्युपनिषत्समाप्ता ॥
