id: shribilvashtakam
category: stotram
name:
  english: shribilvashtakam
  devanagari: श्रीबिल्वाष्टकम्
content:
  english: tridalam trigunakaram trinetram ca triyayudham | trijanmapapasamharam ekabilvam shivarpanam
    || 1|| trishakairbilvapatraishca acchidraih komalaishshubhaih | tava pujam karishyami ekabilvam shivarpanam
    || 2|| darshanam bilvavrikshasya sparshanam papanashanam | aghorapapasamharam ekabilvam shivarpanam
    || 3|| kashikshetranivasam ca kalabhairavadarshanam | prayage madhavam drishtva ekabilvam shivarpanam
    || 4|| tulasi bilvanirgundi jambiramalakam tatha | pancabilvamiti khyata ekabilvam shivarpanam ||
    5|| tatakam dhananikshepam brahmasthapyam shivalayam | kotikanyamahadanam ekabilvam shivarpanam ||
    6|| dantyashvakotidanani ashvamedhashatani ca | kotikanyamahadanam ekabilvam shivarpanam || 7|| salagramasahasrani
    viprannam shatakotikam | yajnakotisahasrani ekabilvam shivarpanam || 8|| ajnanena kritam papam jnanenapi
    kritam ca yat | tatsarvam nashamayatu ekabilvam shivarpanam || 9|| ekaikabilvapatrena kotiyajnaphalam
    labhet | mahadevasya pujartham ekabilvam shivarpanam || 10|| amritodbhavavrikshasya mahadevapriyasya
    ca | mucyante kantakaghata kantakebhyo hi manavah || 11|| || om tatsat ||
  devanagari: त्रिदलं त्रिगुणाकारं त्रिणेत्रं च त्रियायुधम् । त्रिजन्मपापसंहारम् एकबिल्वं शिवार्पणम् ॥
    १॥ त्रिशाकैर्बिल्वपत्रैश्च अच्छिद्रैः कोमलैश्शुभैः । तव पूजां करिष्यामि एकबिल्वं शिवार्पणम् ॥ २॥ दर्शनं
    बिल्ववृक्षस्य स्पर्शनं पापनाशनम् । अघोरपापसंहारम् एकबिल्वं शिवार्पणम् ॥ ३॥ काशीक्षेत्रनिवासं च कालभैरवदर्शनम्
    । प्रयागे माधवं दृष्ट्वा एकबिल्वं शिवार्पणम् ॥ ४॥ तुलसी बिल्वनिर्गुण्डी जंबीरामलकं तथा । पञ्चबिल्वमिति
    ख्याता एकबिल्वं शिवार्पणम् ॥ ५॥ तटाकं धननिक्षेपं ब्रह्मस्थाप्यं शिवालयम् । कोटिकन्यामहादानम् एकबिल्वं
    शिवार्पणम् ॥ ६॥ दन्त्यश्वकोटिदानानि अश्वमेधशतानि च । कोटिकन्यामहादानम् एकबिल्वं शिवार्पणम् ॥ ७॥ सालग्रामसहस्राणि
    विप्रान्नं शतकोटिकम् । यज्ञकोटिसहस्राणि एकबिल्वं शिवार्पणम् ॥ ८॥ अज्ञानेन कृतं पापं ज्ञानेनापि कृतं
    च यत् । तत्सर्वं नाशमायातु एकबिल्वं शिवार्पणम् ॥ ९॥ एकैकबिल्वपत्रेण कोटियज्ञफलं लभेत् । महादेवस्य
    पूजार्थम् एकबिल्वं शिवार्पणम् ॥ १०॥ अमृतोद्भववृक्षस्य महादेवप्रियस्य च । मुच्यन्ते कण्टकाघाता कण्टकेभ्यो
    हि मानवाः ॥ ११॥ ॥ ॐ तत्सत् ॥
