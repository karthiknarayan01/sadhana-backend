id: vairagyapancakam
category: stotram
name:
  english: vairagyapancakam
  devanagari: वैराग्यपञ्चकम्
content:
  english: devam sevitumeva nishcinumahe yo'sau dayaluh pura dhana mushtimuce kucela munaye datte sma
    vitteshatam
  devanagari: देवं सेवितुमेव निश्चिनुमहे योऽसौ दयालुः पुरा धाना मुष्टिमुचे कुचेल मुनये दत्ते स्म वित्तेशताम्
meaning: {}
