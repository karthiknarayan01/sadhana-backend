id: vajrapanjarakhyakalikavacam
category: kavacha
name:
  english: vajrapanjarakhyakalikavacam
  devanagari: वज्रपन्जराख्यकालीकवचम्
content:
  english: rinu devi pravakshyami tavagre kavacottamam | yasminkrite bhavati shrikalitanayo narah || 2||
    vinamuna na siddhah syaddakshina dakshinanana | atah kavacina bhavyam sadhakendrena siddhaye || 3||
    rishirasya smritah shambhucchandah prakritiruttamam | devata dakshinam dhyatva kalim pratyaksharam
    nyaset || 4|| ambhodashyamalangimativikatadatim lolajihvam jatalam mundam vame dadhanam karakamalatale
    dakshine candrahasam | srikki dvandvasudhadharamukhakamalam pretado vallikancim mardvikonmattanetram
    shavaspadayagatam naumi kalim sakalam || 5||
  devanagari: ृणु देवि प्रवक्ष्यामि तवाग्रे कवचोत्तमम् । यस्मिन्कृते भवति श्रीकालीतनयो नरः ॥ २॥ विनामुना
    न सिद्धः स्याद्दक्षिणा दक्षिणानना । अतः कवचिना भाव्यं साधकेन्द्रेण सिद्धये ॥ ३॥ ऋषिरस्य स्मृतः शम्भुच्छन्दः
    प्राकृतिरुत्तमम् । देवता दक्षिणां ध्यात्वा कलीं प्रत्यक्षरं न्यसेत् ॥ ४॥ अम्भोदश्यामलाङ्गीमतिविकटदतीं
    लोलजिह्वां जटालां मुण्डं वामे दधानां करकमलतले दक्षिणे चन्द्रहासम् । सृक्कि द्वन्द्वसुधाधरमुखकमलां
    प्रेतदो वल्लिकाञ्चीं मार्द्वीकोन्मत्तनेत्रां शवस्पदयगतां नौमि कालीं सकालाम् ॥ ५॥
