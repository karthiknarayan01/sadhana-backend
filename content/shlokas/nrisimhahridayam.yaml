id: nrisimhahridayam
category: hridaya
name:
  english: nrisimhahridayam
  devanagari: नृसिंहहृदयम्
content:
  english: om kshrah sahasrakshaya vigatakalmashamurtaye vikramapavanaya narasimhaya svaha svadhishthaya
    namah | om kshram kshrim kshrum kshraim kshraum kshrah sahasrakshaya jvalamaline sahasranakhavajradamshtrakaralavadanaya
    narasimhaya svaha muladharaya namah | shbhih sudarshanam mantram sahasrakrititejasam | suryakotipratikasham
    agnijvalasamaprabham || 3|| athatah sampravakshyami narasimham smaranbudhah | om shrinarasimhasya
    sakalasurasurapateh sarvamantradharasya | sarva mantranathasya sarva mantrarcitasya sarvamantrapujitasya
    sarvamantrasharirasya | sarvamaravairividaranasya | prapannajanasamyutasadhanasya bhaktavatsalasya
    samsararnavadurgamalastrasanasya sarvartiharasya sarvavighnaharasya | sarvapapaharasya sarvabhibhutavarapradanasya
    | sarvaduhkhanashanasya sarva sukhapraptyasya sarveshvarasya bhagavato mahanarasimhamahanarasimhasya
    || hridayamahastotramantram avartayishyamyavartayishyami | om kshraum om pranavarupaya mastake | om
    kshraum om sattvarupaya lalate | om kshraum om mantrarupaya karnayoh | om kshraum om dhyanarupaya
    netrayoh | om kshraum om bhadrarupaya kanthe | om kshraum om sthularupaya bahvoh | om kshraum om sukshmarupaya
    hridaye | om kshraum om nityarupaya udare | om kshraum om niranjanarupaya nabhau | om kshraum om kartritvarupaya
    parshvayoh | om kshraum om parameshtirupaya linge | om kshraum om karanarupaya muladhare | om kshraum
    om mahakaranarupaya janvoh | om kshraum om karyarupaya janghayoh | om kshraum om samarupaya gulphayoh
    | om kshraum om vishnurupaya padayoh | om kshraum om sarveshvaranrisimharupaya sarvangeshu | patala
    lingebhyah hum phat | akasha asurebhyah hum phat | mantrarupebhyah hum phat | mantrajyotibhyah hum
    phat | asahayamam raksha raksha bhagavan nrisimharupin vishno sarvapapebhyah sarvapapabhayebhyah sarva
    papabhayopasargebhyah om hrim kshraum aim om hum phat svaha | om namo bhagavate hum phat svaha | nrisimha
    bhuvikrida nrisimha bhuvidravaya bhuvidravaya sarvamantrani sarvayantrani hana hana bhanja bhanja
    uccataya uccataya hum phat svaha | om nrisimhaya uttamangabhakshanaya hum phat svaha | rakshamantrasya
    devasya pathitavyam samahitah | shatrunashamavanyoti sarvatra vijayibhavet || 1|| athatah sampravakshyami
    dishabandhanamuttamam | narasimham vapushreshtham devanamapi durlabham || 2|| om kshraum om matsyarupaya
    narasimhaya om kshraum om lam purvadisham bandhayami hum phat svaha | om kshraum om kurmarupaya narasimhaya
    om kshraum om ham agneyindisham bandhayami hum phat svaha | om kshraum om varaharupaya narasimhaya
    om kshraum om sham yamyandisham bandhayami hum phat svaha | om kshraum om nrisimharupaya narasimhaya
    om kshraum om nairitidisham bandhayami hum phat svaha | om kshraum om vamanarupaya narasimhaya om
    kshraum om vam varunidisham bandhayami hum phat svaha | om kshraum om parashuramarupaya narasimhaya
    om kshraum om yam vayavidisham bandhayami hum phat svaha | om kshraum om ramacandrarupaya narasimhaya
    om kshraum om sam kauberidisham bandhayami hum phat svaha | om kshraum om krishnarupaya narasimhaya
    om kshraum om sham ishanidisham bandhayami hum phat svaha | om kshraum om bauddharupaya narasimhaya
    om kshraum om am urdhvadisham bandhayami hum phat svaha | om kshraum om kalkirupaya narasimhaya om
    kshraum om klaum adharayadisham bandhayami hum phat svaha | om lam hram sham ram vam yam sam sham
    am klaum om hum phat svaha | evam dashadisham raksham mantrarajam japetsudhih | sarvan kamanavapnoti
    vishnumayam prasidati | om kshraum om mukhe | om kshraum om hridaye | om shrim om nabhau | om hrim
    om guhye | om klim om muladhare | om klim om padayoh | om hrim om prishthe | om shrim om parshvayoh
    | om aim om karayoh | om kshraum om sarvange vyapakam nyaset iti mantranganyasah | atha hridayamantrah
    | om hayagrivaya namah | om namo bhagavate cakrasanasthaya shrinrisimhaya krodhamurte nrisimha purushapradhanadharmato
    vikatanirmocana nrisimha kalapurusha kalantaka vishveshvara vishvavidambena vishvanishtha vishvacaitanya
    citsadabhasa kaladhvatita nishatita udayastamayarahita paramahamsa paramakarunika nrisimhahridayacaturdalanivishta
    caitanyatman ekatman caturatman pancatman dvadashatman shodashatman carturvimshatyatman pancavimshatyatman
    shadvimshatyatman saptavimshatyatman shatasahasramurte ehi ehi bhagavannarasimha mama hridaye praveshaya
    praveshaya | sarvan akarshaya akarshaya | mama sannidhyam kuru kuru | om raum namah hum phat svaha
    || 1|| om aim hrim klim shrim krim klam dhyaum namah | om khatpat chindhi chindhi bhidhim bhidhim
    han han ripun vishno svaha || 2|| om kshraum namah namastasmai nrisimharupine hrishikesha namonamah
    | om kshraum om mahaghoraya ugranarasimhaya hrim hum phat svaha | madhyaratrevisheshena ripusankatamastake
    | pathitavyam mahamantram devanamapidurlabham || 1|| ekavimshativaram ca pathettaditinishcayah | karagrahagatam
    ghoram bandhadraja vimocayet || 2|| rajadarshanavelayam pathitavyam trivaratah | sarajam vashamanitva
    prakritim ca sabhajayam || 3|| idam nrisimhahridayam devadevadhidaivatam | sarvasvam ca mayakhyatam
    tavabhaktah sadanagha || 4|| brahmanan bhojayennityam dashakam dvadasham tatha | pujayenmantrarajam
    ca kulamargena samyutam || 5|| tat samipam pathennityam nrisimhapritimapnuyat || 6|| iti shri brahmandapurane
    brahmaprahladasamvade uttarakhande shrinrisimhacaritre shrinrisimhahridayam sampurnam | shrikrishnarpanamastu
    | shrimaddivyalakshminrisimharpanamastu |
  devanagari: ॐ क्ष्रः सहस्राक्षाय विगतकल्मषमूर्तये विक्रमपावनाय नारसिंहाय स्वाहा स्वाधिष्ठाय नमः । ॐ
    क्ष्रां क्ष्रीं क्ष्रूं क्ष्रैं क्ष्रौं क्ष्रः सहस्राक्षाय ज्वालामालिने सहस्रनखवज्रदंष्ट्राकरालवदनाय
    नारसिंहाय स्वाहा मूलाधाराय नमः । ष्भिः सुदर्शनं मन्त्रं सहस्राकृतितेजसम् । सूर्यकोटिप्रतीकाशं अग्निज्वालासमप्रभम्
    ॥ ३॥ अथातः सम्प्रवक्ष्यामि नारसिंहं स्मरन्बुधः । ॐ श्रीनारसिंहस्य सकलसुरासुरपतेः सर्वमन्त्राधारस्य
    । सर्व मन्त्रनाथस्य सर्व मन्त्रार्चितस्य सर्वमन्त्रपूजितस्य सर्वमन्त्रशरीरस्य । सर्वामरवैरिविदारणस्य
    । प्रपन्नजनसंयुतसाधनस्य भक्तवत्सलस्य संसारार्णवदुर्गामलस्त्रसनस्य सर्वार्तिहरस्य सर्वविघ्नहरस्य ।
    सर्वपापहरस्य सर्वाभिभूतवरप्रदानस्य । सर्वदुःखनाशनस्य सर्व सुखप्राप्त्यस्य सर्वेश्वरस्य भगवतो महानारसिंहमहानारसिंहस्य
    ॥ हृदयमहास्तोत्रमन्त्रं आवर्तयिष्याम्यावर्तयिष्यामि । ॐ क्ष्रौं ॐ प्रणवरूपाय मस्तके । ॐ क्ष्रौं ॐ
    सत्त्वरूपाय ललाटे । ॐ क्ष्रौं ॐ मन्त्ररूपाय कर्णयोः । ॐ क्ष्रौं ॐ ध्यानरूपाय नेत्रयोः । ॐ क्ष्रौं
    ॐ भद्ररूपाय कण्ठे । ॐ क्ष्रौं ॐ स्थूलरूपाय बाह्वोः । ॐ क्ष्रौं ॐ सूक्ष्मरूपाय हृदये । ॐ क्ष्रौं ॐ
    नित्यरूपाय उदरे । ॐ क्ष्रौं ॐ निरञ्जनरूपाय नाभौ । ॐ क्ष्रौं ॐ कर्तृत्वरूपाय पार्श्वयोः । ॐ क्ष्रौं
    ॐ परमेष्टिरूपाय लिङ्गे । ॐ क्ष्रौं ॐ कारणरूपाय मूलाधारे । ॐ क्ष्रौं ॐ महाकारणरूपाय जान्वोः । ॐ क्ष्रौं
    ॐ कार्यरूपाय जङ्घयोः । ॐ क्ष्रौं ॐ समरूपाय गुल्फयोः । ॐ क्ष्रौं ॐ विष्णुरूपाय पादयोः । ॐ क्ष्रौं ॐ
    सर्वेश्वरनृसिंहरूपाय सर्वाङ्गेषु । पाताल लिङ्गेभ्यः हुं फट् । आकाश आसुरेभ्यः हुं फट् । मन्त्ररूपेभ्यः
    हुं फट् । मन्त्रज्योतिभ्यः हुं फट् । असहायमां रक्ष रक्ष भगवन् नृसिंहरूपिन् विष्णो सर्वपापेभ्यः सर्वपापभयेभ्यः
    सर्व पापभयोपसर्गेभ्यः ॐ ह्रीं क्ष्रौं ऐं ॐ हुं फट् स्वाहा । ॐ नमो भगवते हुं फट् स्वाहा । नृसिंह भुविक्रीड
    नृसिंह भुविद्रावय भुविद्रावय सर्वमन्त्राणि सर्वयन्त्राणि हन हन भञ्ज भञ्ज उच्चाटय उच्चाटय हुं फट् स्वाहा
    । ॐ नृसिंहाय उत्तमाङ्गभक्षणाय हुं फट् स्वाहा । रक्षामन्त्रस्य देवस्य पठितव्यं समाहितः । शत्रुनाशमवान्योति
    सर्वत्र विजयीभवेत् ॥ १॥ अथातः सम्प्रवक्ष्यामि दिशाबन्धनमुत्तमम् । नारसिंहं वपुश्रेष्ठं देवानामपि दुर्लभम्
    ॥ २॥ ॐ क्ष्रौं ॐ मत्स्यरूपाय नारसिंहाय ॐ क्ष्रौं ॐ लां पूर्वदिशं बन्धयामि हुं फट् स्वाहा । ॐ क्ष्रौं
    ॐ कूर्मरूपाय नारसिंहाय ॐ क्ष्रौं ॐ हां आग्नेयीन्दिशं बन्धयामि हुं फट् स्वाहा । ॐ क्ष्रौं ॐ वराहरूपाय
    नारसिंहाय ॐ क्ष्रौं ॐ षां याम्यान्दिशं बन्धयामि हुं फट् स्वाहा । ॐ क्ष्रौं ॐ नृसिंहरूपाय नारसिंहाय
    ॐ क्ष्रौं ॐ नैऋतीदिशं बन्धयामि हुं फट् स्वाहा । ॐ क्ष्रौं ॐ वामनरूपाय नारसिंहाय ॐ क्ष्रौं ॐ वां वारूणीदिशं
    बन्धयामि हुं फट् स्वाहा । ॐ क्ष्रौं ॐ परशुरामरूपाय नारसिंहाय ॐ क्ष्रौं ॐ यां वायवीदिशं बन्धयामि हुं
    फट् स्वाहा । ॐ क्ष्रौं ॐ रामचन्द्ररूपाय नारसिंहाय ॐ क्ष्रौं ॐ सां कौबेरीदिशं बन्धयामि हुं फट् स्वाहा
    । ॐ क्ष्रौं ॐ कृष्णरूपाय नारसिंहाय ॐ क्ष्रौं ॐ शां ईशानीदिशं बन्धयामि हुं फट् स्वाहा । ॐ क्ष्रौं ॐ
    बौद्धरूपाय नारसिंहाय ॐ क्ष्रौं ॐ आं ऊर्ध्वादिशं बन्धयामि हुं फट् स्वाहा । ॐ क्ष्रौं ॐ कल्किरूपाय नारसिंहाय
    ॐ क्ष्रौं ॐ क्लौं अधरायदिशं बन्धयामि हुं फट् स्वाहा । ॐ लां ह्रां षां रां वां यां सां शां आं क्लौं
    ॐ हुं फट् स्वाहा । एवं दशदिशां रक्षां मन्त्रराजं जपेत्सुधीः । सर्वान् कामानवाप्नोति विष्णुमायां प्रसीदति
    । ॐ क्ष्रौं ॐ मुखे । ॐ क्ष्रौं ॐ हृदये । ॐ श्रीं ॐ नाभौ । ॐ ह्रीं ॐ गुह्ये । ॐ क्लीं ॐ मूलाधारे ।
    ॐ क्लीं ॐ पादयोः । ॐ ह्रीं ॐ पृष्ठे । ॐ श्रीं ॐ पार्श्वयोः । ॐ ऐं ॐ करयोः । ॐ क्ष्रौं ॐ सर्वाङ्गे
    व्यापकं न्यसेत् इति मन्त्राङ्गन्यासः । अथ हृदयमन्त्रः । ॐ हयग्रीवाय नमः । ॐ नमो भगवते चक्रासनस्थाय
    श्रीनृसिंहाय क्रोधमूर्ते नृसिंह पुरुषप्रधानधर्मतो विकटनिर्मोचन नृसिंह कालपुरुष कालान्तक विश्वेश्वर
    विश्वविडम्बेन विश्वनिष्ठ विश्वचैतन्य चित्सदाभास कालाध्वातीत निशातीत उदयास्तमयरहित परमहंस परमकारुणिक
    नृसिंहहृदयचतुर्दलनिविष्ट चैतन्यात्मन् एकात्मन् चतुरात्मन् पञ्चात्मन् द्वादशात्मन् षोडषात्मन् चर्तुर्विंशत्यात्मन्
    पञ्चविंशत्यात्मन् षड्विंशत्यात्मन् सप्तविंशत्यात्मन् शतसहस्रमूर्ते एहि एहि भगवन्नारसिंह मम हृदये प्रवेशय
    प्रवेशय । सर्वान् आकर्षय आकर्षय । मम सान्निध्यं कुरु कुरु । ॐ रौं नमः हुं फट् स्वाहा ॥ १॥ ॐ ऐं ह्रीं
    क्लीं श्रीं क्रीं क्लां ध्यौं नमः । ॐ खट्पट् छिन्धि छिन्धि भिधिं भिधिं हन् हन् रिपून् विष्णो स्वाहा
    ॥ २॥ ॐ क्ष्रौं नमः नमस्तस्मै नृसिंहरूपिणे हृषिकेश नमोनमः । ॐ क्ष्रौं ॐ महाघोराय उग्रनारसिंहाय ह्रीं
    हुं फट् स्वाहा । मध्यरात्रेविशेषेण रिपुसङ्कटमस्तके । पठितव्यं महामन्त्रं देवानामपिदुर्लभम् ॥ १॥ एकविंशतिवारं
    च पठेत्तदितिनिश्चयः । काराग्रहगतं घोरं बन्धाद्राजा विमोचयेत् ॥ २॥ राजदर्शनवेलायां पठितव्यं त्रिवारतः
    । सराजं वशमानित्वा प्रकृतिं च सभाजयम् ॥ ३॥ इदं नृसिंहहृदयं देवदेवाधिदैवतम् । सर्वस्वं च मयाख्यातं
    तवभक्तः सदानघ ॥ ४॥ ब्राह्मणान् भोजयेन्नित्यं दशकं द्वादशं तथा । पूजयेन्मन्त्रराजं च कुलमार्गेण संयुतम्
    ॥ ५॥ तत् समीपं पठेन्नित्यं नृसिंहप्रीतिमाप्नुयात् ॥ ६॥ इति श्री ब्रह्माण्डपुराणे ब्रह्माप्रह्लादसंवादे
    उत्तरखण्डे श्रीनृसिंहचरित्रे श्रीनृसिंहहृदयं सम्पूर्णम् । श्रीकृष्णार्पणमस्तु । श्रीमद्दिव्यलक्ष्मीनृसिंहार्पणमस्तु
    ।
