id: santanagopalamantraprayogah
category: mantra
name:
  english: santanagopalamantraprayogah
  devanagari: सन्तानगोपालमन्त्रप्रयोगः
content:
  english: praptyarthe jape viniyogah || om narayanarishaye namah shirasi | om anushtupchandase namah
    mukhe | om putrapradashrigopaladevatayai namah hridi | om klim bijaya namah guhye | om shrim hrim
    shaktaye namah padayoh | om jim kilakaya namah sarvange | iti rishyadinyasah || om davakisuta govinda
    angushthabhyam namah | om vasudeva jagatpate tarjanibhyam namah | om dehi me tanayam krishna madhyamabhyam
    namah | om tvamaham sharanam gatah anamikabhyam namah | om devakisuta govinda vasudeva jagatpate kanishthikabhyam
    namah | om dehi me tanayam krishna tvamaham sharanam gatah karatalakaraprishthabhyam namah | iti karanyasah
    || om devakisuta govinda hridayaya namah | om vasudeva jagatpate shirase svaha | om dehi me tanayam
    krishna shikhayai vashat | om tvamaham sharanam gatah kavacaya hu~ | om devakisuta govinda vasudeva
    jagatpate | dehi me tanayam krishna tvamaham sharanam gatah
  devanagari: प्राप्त्यर्थे जपे विनियोगः ॥ ॐ नारायणऋषये नमः शिरसि । ॐ अनुष्टुप्छन्दसे नमः मुखे । ॐ पुत्रप्रदश्रीगोपालदेवतायै
    नमः हृदि । ॐ क्लीं बीजाय नमः गुह्ये । ॐ श्रीं ह्रीं शक्तये नमः पादयोः । ॐ जीं कीलकाय नमः सर्वाङ्गे
    । इति ऋष्यादिन्यासः ॥ ॐ दवकीसुत गोविन्द अङ्गुष्ठाभ्यां नमः । ॐ वासुदेव जगत्पते तर्जनीभ्यां नमः । ॐ
    देहि मे तनयं कृष्ण मध्यमाभ्यां नमः । ॐ त्वामहं शरणं गतः अनामिकाभ्यां नमः । ॐ देवकीसुत गोविन्द वासुदेव
    जगत्पते कनिष्ठिकाभ्यां नमः । ॐ देहि मे तनयं कृष्ण त्वामहं शरणं गतः करतलकरपृष्ठाभ्यां नमः । इति करन्यासः
    ॥ ॐ देवकीसुत गोविन्द हृदयाय नमः । ॐ वासुदेव जगत्पते शिरसे स्वाहा । ॐ देहि मे तनयं कृष्ण शिखायै वषट्
    । ॐ त्वामहं शरणं गतः कवचाय हुँ । ॐ देवकीसुत गोविन्द वासुदेव जगत्पते । देहि मे तनयं कृष्ण त्वामहं शरणं
    गतः
