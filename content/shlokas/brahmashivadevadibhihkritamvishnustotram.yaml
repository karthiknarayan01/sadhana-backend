id: brahmashivadevadibhihkritamvishnustotram
category: stotram
name:
  english: brahmashivadevadibhihkritamvishnustotram
  devanagari: ब्रह्माशिवदेवादिभिःकृतंविष्णुस्तोत्रम्
content:
  english: mahattama murtimayi tavaja tadasya purvajjanitoha'madau | maya tatam vishvamidam sadaiva yato
    namastatpurushottamaya || 19|| ajasya yamyajjanito'hamadau vishnurmahakalpakaro'dhikari | svakiyanamna
    tu maya tatam tadvishve sadaivam ca namo namaste || 20|| avyaktapashcatyamukhatsujanma shivo'hamadau
    suratattvakari | maya mahakalpakarastritiya tvadajnaya deva namo namaste || 21|| pradhanavaktrottarato'hamadau
    jato ganeshah kila kalpakarta | maya tatam vishvamidam sadaiva tasmai namah karunikottamaya || 22||
    ajarddhavaktrajjanito'hamadau marunmahakalpakaro mahendrah | maya tatam vishvamidam svakalpe yadajnaya
    deva namo namaste || 23|| prathanabhalakshisamudbhavo'ham vahnermahakalpakaro guhakhyah | vinirmitam
    vishvamidam maya tadyadajnaya natha namo namaste || 24|| ajamukhatpurvagatacca jatashcadau mahakalpakaro'hamagnih
    | brahmandametacca maya tatam vai brahmandakalpaya namo namaste || 25|| ajabhujaddakshinato'hamadau
    jato mahakalpakarah sadharmah | maya sadevai racitam samagram lingakhyakalpaya namo namaste || 26||
    ajabhujatpashcimato'hamadau jato mahakalpakarah sa yajnah | maya tatam vishvamidam samagram matsyakhyakalpaya
    namo namaste || 27|| pradhanabahuttarato'hamadau jato mahakalpakarah pracetah | maya tatam natha tavajnayedam
    karmakhyakalpaya namo namaste || 28|| brahmandatamaso jatastvaddaso'ham vibhishanah | maya tatam trilokam
    ca namaste manurupine || 29|| brahmandasadgunajjatashcitto'ham manukarakah | maya tatam ca trailokyam
    svayambhuva namo'stu te || 30|| brahmandarajaso jato vayurmanvantaram tatam | maya svarocisham svaminnamaste
    manurupine || 31|| brahmandamanaso jato dhruvo'ham manukarakah | mayottamam ca racitam namaste'stu
    tavajnaya || 32|| brahmandashravanajjato vishvakarmahamishvarah | maya tatam raivatam ca namo deva
    tavajnaya || 33|| brahmandadehato jatassuryo'ham cakshushapradah | tavajnaya tatam vishvam manurupaya
    te namah || 34|| brahmandanetrato jatah somo'ham tu maya tatam | vaivasvatantaram ramyam namaste manurupine
    || 35|| brahmandarasanajjato moho'ham manukarakah | namaste manurupaya maya savarnikam tatam || 36||
    brahmandaghranato jato budho'ham natha kinkarah | nirmitam brahmasavarnam maya tata namo namah ||
    37|| brahmandavaktrato jato jivo'ham manukarakah | maya vai dakshasavarnam tatam tatte namo namah
    || 38|| brahmandakarato jatah shukroham tava kinkarah | nirmitam rudrasavarnam maya tubhyam namo namah
    || 39|| brahmandapadato jato mando'ham natha te'nugah | tatam vai dharmasavarnam prabhate'smai namo
    namah || 40|| brahmandalingato jato rahushcaham tava priyah | maya bhaumam kritam natha namaste manurupine
    || 41|| brahmandaguhyato jatah ketushcaham tavanugah | bhautam manvataram srishtam tasmai devaya te
    namah || 42|| iti bhavishyapurane pratisgaparve caturthakhande pancavimshadhyayantargatam brahma
  devanagari: महत्तमा मूर्तिमयी तवाजा तदास्य पूर्वाज्जनितोहऽमादौ । मया ततं विश्वमिदं सदैव यतो नमस्तत्पुरुषोत्तमाय
    ॥ १९॥ अजस्य याम्याज्जनितोऽहमादौ विष्णुर्महाकल्पकरोऽधिकारी । स्वकीयनाम्ना तु मया ततं तद्विश्वे सदैवं
    च नमो नमस्ते ॥ २०॥ अव्यक्तपाश्चात्यमुखात्सुजन्मा शिवोऽहमादौ सुरतत्त्वकारी । मया महाकल्पकरस्तृतीया
    त्वदाज्ञया देव नमो नमस्ते ॥ २१॥ प्रधानवक्त्रोत्तरतोऽहमादौ जातो गणेशः किल कल्पकर्ता । मया ततं विश्वमिदं
    सदैव तस्मै नमः कारुणिकोत्तमाय ॥ २२॥ अजार्द्धवक्त्राज्जनितोऽहमादौ मरुन्महाकल्पकरो महेन्द्रः । मया ततं
    विश्वमिदं स्वकल्पे यदाज्ञया देव नमो नमस्ते ॥ २३॥ प्रथानभालाक्षिसमुद्भवोऽहं वह्नेर्महाकल्पकरो गुहाख्यः
    । विनिर्मितं विश्वमिदं मया तद्यदाज्ञया नाथ नमो नमस्ते ॥ २४॥ अजामुखात्पूर्वगताच्च जातश्चादौ महाकल्पकरोऽहमग्निः
    । ब्रह्माण्डमेतच्च मया ततं वै ब्रह्माण्डकल्पाय नमो नमस्ते ॥ २५॥ अजाभुजाद्दक्षिणतोऽहमादौ जातो महाकल्पकरः
    सधर्मः । मया सदेवै रचितं समग्रं लिङ्गाख्यकल्पाय नमो नमस्ते ॥ २६॥ अजाभुजात्पश्चिमतोऽहमादौ जातो महाकल्पकरः
    स यज्ञः । मया ततं विश्वमिदं समग्रं मत्स्याख्यकल्पाय नमो नमस्ते ॥ २७॥ प्रधानबाहूत्तरतोऽहमादौ जातो महाकल्पकरः
    प्रचेताः । मया ततं नाथ तवाज्ञयेदं कर्माख्यकल्पाय नमो नमस्ते ॥ २८॥ ब्रह्माण्डतमसो जातस्त्वद्दासोऽहं
    विभीषणः । मया ततं त्रिलोकं च नमस्ते मनुरूपिणे ॥ २९॥ ब्रह्माण्डसद्गुणाज्जातश्चित्तोऽहं मनुकारकः । मया
    ततं च त्रैलोक्यं स्वायम्भुव नमोऽस्तु ते ॥ ३०॥ ब्रह्माण्डरजसो जातो वायुर्मन्वन्तरं ततम् । मया स्वारोचिषं
    स्वामिन्नमस्ते मनुरूपिणे ॥ ३१॥ ब्रह्माण्डमनसो जातो ध्रुवोऽहं मनुकारकः । मयोत्तमं च रचितं नमस्तेऽस्तु
    तवाज्ञया ॥ ३२॥ ब्रह्माण्डश्रवणाज्जातो विश्वकर्माहमीश्वरः । मया ततं रैवतं च नमो देव तवाज्ञया ॥ ३३॥
    ब्रह्माण्डदेहतो जातस्सूर्योऽहं चाक्षुषप्रदः । तवाज्ञया ततं विश्वं मनुरूपाय ते नमः ॥ ३४॥ ब्रह्माण्डनेत्रतो
    जातः सोमोऽहं तु मया ततम् । वैवस्वतान्तरं रम्यं नमस्ते मनुरूपिणे ॥ ३५॥ ब्रह्माण्डरसनाज्जातो मोहोऽहं
    मनुकारकः । नमस्ते मनुरूपाय मया सावर्णिकं ततम् ॥ ३६॥ ब्रह्माण्डघ्राणतो जातो बुधोऽहं नाथ किङ्करः । निर्मितं
    ब्रह्मसावर्णं मया तात नमो नमः ॥ ३७॥ ब्रह्माण्डवक्त्रतो जातो जीवोऽहं मनुकारकः । मया वै दक्षसावर्णं
    ततं तत्ते नमो नमः ॥ ३८॥ ब्रह्माण्डकरतो जातः शुक्रोहं तव किङ्करः । निर्मितं रुद्रसावर्णं मया तुभ्यं
    नमो नमः ॥ ३९॥ ब्रह्माण्डपदतो जातो मन्दोऽहं नाथ तेऽनुगः । ततं वै धर्मसावर्णं प्रभातेऽस्मै नमो नमः ॥
    ४०॥ ब्रह्माण्डलिङ्गतो जातो राहुश्चाहं तव प्रियः । मया भौमं कृतं नाथ नमस्ते मनुरूपिणे ॥ ४१॥ ब्रह्माण्डगुह्यतो
    जातः केतुश्चाहं तवानुगः । भौतं मन्वतरं सृष्टं तस्मै देवाय ते नमः ॥ ४२॥ इति भविष्यपुराणे प्रतिस्गपर्वे
    चतुर्थखण्डे पञ्चविंशाध्यायान्तर्गतं ब्रह्मा
