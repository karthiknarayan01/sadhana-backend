id: mahaganapatinamastotramnamavalishca
category: stotram
name:
  english: mahaganapatinamastotramnamavalishca
  devanagari: महागणपतिनामस्तोत्रंनामावलिश्च
content:
  english: shrimahaganapatinamastotram namavalishca atha stotram | pancavaktro dashabhujo lalatenduh shashiprabhah
    | mundamalah sarpabhusho mukutangadabhushanah || 1|| agnyarkashashino bhabhistiraskurvan dashayudhah
    | dharmaprado'rthadah kamadata saubhagyavardhanah || 2|| vidyaprado vibhavado bhuktimuktiphalapradah
    | abhirupyakaro virashriprado vijayapradah || 3|| sarvavashyakaro garbhadoshaha putrapautradah | medhadah
    kirtidah shokahari daurbhagyanashanah || 4|| prativadimukhastambho rushtacittaprasadanah | parabhicarashamano
    duhkhabhanjanakarakah | sarvaduhkhaharo devastam dhyayami gajananam || 5|| atha namavalih | om gam
    | pancavaktraya namah | dashabhujaya | lalatendave | shashiprabhaya | mundamalaya | sarpabhushaya
    | mukutangadabhushanaya | agnyarkashashino
  devanagari: श्रीमहागणपतिनामस्तोत्रं नामावलिश्च अथ स्तोत्रम् । पञ्चवक्त्रो दशभुजो ललाटेन्दुः शशिप्रभः
    । मुण्डमालः सर्पभूषो मुकुटाङ्गदभूषणः ॥ १॥ अग्न्यर्कशशिनो भाभिस्तिरस्कुर्वन् दशायुधः । धर्मप्रदोऽर्थदः
    कामदाता सौभाग्यवर्धनः ॥ २॥ विद्याप्रदो विभवदो भुक्तिमुक्तिफलप्रदः । आभिरूप्यकरो वीरश्रीप्रदो विजयप्रदः
    ॥ ३॥ सर्ववश्यकरो गर्भदोषहा पुत्रपौत्रदः । मेधादः कीर्तिदः शोकहारी दौर्भाग्यनाशनः ॥ ४॥ प्रतिवादिमुखस्तम्भो
    रुष्टचित्तप्रसादनः । पराभिचारशमनो दुःखभञ्जनकारकः । सर्वदुःखहरो देवस्तं ध्यायामि गजाननम् ॥ ५॥ अथ नामावलिः
    । ॐ गम् । पञ्चवक्त्राय नमः । दशभुजाय । ललाटेन्दवे । शशिप्रभाय । मुण्डमालाय । सर्पभूषाय । मुकुटाङ्गदभूषणाय
    । अग्न्यर्कशशिनो
