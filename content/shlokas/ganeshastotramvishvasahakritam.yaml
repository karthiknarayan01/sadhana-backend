id: ganeshastotramvishvasahakritam
category: stotram
name:
  english: ganeshastotramvishvasahakritam
  devanagari: गणेशस्तोत्रम्विश्वसहकृतं
content:
  english: rinvatam nityam bhaktivardhanamuttamam || 39|| yam yamicchati tam tam tu dasyami stotrapathatah
    | bhuktimuktipradam brahmadayakam shravanadbhavet || 40|| mayi bhaktirdridha te vai bhavishyati sukhaprada
    | yadyadicchasi tattatte saphalam hyastu sarvada || 41|| evamuktva ganadhishom'tardadhe tasya pashyatah
    | vishvasaho ganeshasya bhajane tatparo'bhavat || 42|| ganapatyagranih so'pi babhuva mudgalopamah
    | sada maghavrate samstho ganeshapancake ratah || 43|| anyacchrinu mahaccitram caritram masasambhavam
    | sarvapapaharam vipra shravanat sukhadam bhavet || 44|| candalah ko'pi nilakhyah shrutva ganapateh
    katham | maghasnanaparo bhutva vyavasayam cakara ha || 45|| snatva pratastatah so'pi vyavasayaparo'bhavat
    | ratrau gitam ganeshasya gayati sma nirantaram || 46|| evam gitam maghamase ganesham devamandire
    | gatva gayan punah so'pi kutumbabharane ratah || 47|| ekada karyasamsthah sa maghamase babhuva ha
    | yamamatragatayam tu yayau ratrau ganeshvaram || 48|| pranamya vighnahartaram gitam gitva svamandiram
    | jagama margamadhyastham pishacah panca tam yayuh || 49|| drishtva krurataramstan sa sasmara gananayakam
    | ganeshasmritimatrena pishacah stambhita babhuh || 50|| tato'tivismitah sarve pishacastamalokayan
    | avalokanapunyena shuddhantara babhuvire || 51|| jagustam nilakam vakyam pishaca duhkhasamyutah |
    tarayasva mahabhaga samsarannah pishacakan || 52|| tava darshanamatrena shuddha jata vayam kila |
    tava ganaphalam dehi tena mukta bhavamahe || 53|| iti vishvasahakritam shriganeshastotram sampurnam
    ||
  devanagari: ृण्वतां नित्यं भक्तिवर्धनमुत्तमम् ॥ ३९॥ यं यमिच्छति तं तं तु दास्यामि स्तोत्रपाठतः । भुक्तिमुक्तिप्रदं
    ब्रह्मदायकं श्रवणाद्भवेत् ॥ ४०॥ मयि भक्तिर्दृढा ते वै भविष्यति सुखप्रदा । यद्यदिच्छसि तत्तत्ते सफलं
    ह्यस्तु सर्वदा ॥ ४१॥ एवमुक्त्वा गणाधीशोंऽतर्दधे तस्य पश्यतः । विश्वसहो गणेशस्य भजने तत्परोऽभवत् ॥
    ४२॥ गाणपत्याग्रणीः सोऽपि बभूव मुद्गलोपमः । सदा माघव्रते संस्थो गाणेशपञ्चके रतः ॥ ४३॥ अन्यच्छृणु महच्चित्रं
    चरित्रं माससम्भवम् । सर्वपापहरं विप्र श्रवणात् सुखदं भवेत् ॥ ४४॥ चाण्डालः कोऽपि नीलाख्यः श्रुत्वा
    गणपतेः कथाम् । माघस्नानपरो भूत्वा व्यवसायं चकार ह ॥ ४५॥ स्नात्वा प्रातस्ततः सोऽपि व्यवसायपरोऽभवत्
    । रात्रौ गीतं गणेशस्य गायति स्म निरन्तरम् ॥ ४६॥ एवं गीतं माघमासे गणेशं देवमन्दिरे । गत्वा गायन् पुनः
    सोऽपि कुटुम्बभरणे रतः ॥ ४७॥ एकदा कार्यसंस्थः स माघमासे बभूव ह । याममात्रगतायां तु ययौ रात्रौ गणेश्वरम्
    ॥ ४८॥ प्रणम्य विघ्नहर्तारं गीतं गीत्वा स्वमन्दिरम् । जगाम मार्गमध्यस्थं पिशाचाः पञ्च तं ययुः ॥ ४९॥
    दृष्ट्वा क्रूरतरांस्तान् स सस्मार गणनायकम् । गणेशस्मृतिमात्रेण पिशाचाः स्तम्भिता बभुः ॥ ५०॥ ततोऽतिविस्मिताः
    सर्वे पिशाचास्तमलोकयन् । अवलोकनपुण्येन शुद्धान्तरा बभूविरे ॥ ५१॥ जगुस्तं नीलकं वाक्यं पिशाचा दुःखसंयुताः
    । तारयस्व महाभाग संसारान्नः पिशाचकान् ॥ ५२॥ तव दर्शनमात्रेण शुद्धा जाता वयं किल । तव गानफलं देहि तेन
    मुक्ता भवामहे ॥ ५३॥ इति विश्वसहकृतं श्रीगणेशस्तोत्रं सम्पूर्णम् ॥
