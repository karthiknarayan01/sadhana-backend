id: mahaganapatimulamantrapadamalastotram
category: mantra
name:
  english: mahaganapatimulamantrapadamalastotram
  devanagari: महागणपतिमूलमन्त्रपदमालास्तोत्रम्
content:
  english: hankarakritidandinipriyamajashrinatharudreshtadam | sarvakarshinidevarajabhuvanarnendvatmakam
    shrikaram citte vighnanivaranaya girijajatapriyam bhavaye || 5|| gangasutam gandhamukhopacarapriyam
    khagarohanabhagineyam | gangasutadyam varagandhatattvamulambujastham hridi bhavaye'ham || 6|| ganapataye
    varagunanidhaye suraganapataye natajanatataye | maniganabhushitacaranayugashritamalaharane cana te
    namah || 7|| varabhaye modakamekadantam karambujataih satatam dharantam | varangacandram parabhaktisandrairjanairbhajantam
    kalaye sada'ntah || 8|| varada natajananam santatam vakratunda svaramayanijagatra svatmabodhaikaheto
    | karalasadamritambhopurnapatradya mahyam garagalasuta shighram dehi madbodhamidyam || 9|| sarvajanam
    paripalaya sharvaja parvasudhakaragarvahara | parvatanathasutasuta palaya kharvam ma kuru dinamimam
    || 10 || medo'sthimamsarudhirantramaye sharire medinyabagnimarudambaralasyamane | me darunam madamukhaghamumaja
    hritva medhahvayasanavare vasa dantivaktra || 11|| vasham kuru tvam shivajata mam te vashikritasheshasamastaloka
    | vasarnasamshobhitamulapadmalasacchriya'lintavaranasya || 12|| anayashupadavarijantikam mam nayadigunavarjitam
    tava | hanihinapadajamritasya te panayogyamibhavaktra mam kuru || 13|| svahasvarupena virajase tvam
    sudhashananam priyakarmanidyam | svadhasvarupena tu pitryakarmanyumasutejyamayavishvamurte || 14||
    ashtavimshativarnapatralasitam haram ganeshapriyam kashta'nishtaharam caturdashapadaih pushpairmanoharakam
    | tushtyadipradasadguruttamapadambhoje cidanandadam shishteshto'hamanantasutrahridaya''baddham subhaktya'rpaye
    || 15|| || iti shrianantanandanathakritam shrigurucidanandanathasamarpitam shrimahaganapatimulamantramalastotram
    || shriganeshamulamantrapadamala
  devanagari: हङ्काराकृतिदण्डिनीप्रियमजश्रीनाथरुद्रेष्टदम् । सर्वाकर्षिणिदेवराजभुवनार्णेन्द्वात्मकं श्रीकरं
    चित्ते विघ्ननिवारणाय गिरिजजातप्रियं भावये ॥ ५॥ गङ्गासुतं गन्धमुखोपचारप्रियं खगारोहणभागिनेयम् । गङ्गासुताद्यं
    वरगन्धतत्त्वमूलाम्बुजस्थं हृदि भावयेऽहम् ॥ ६॥ गणपतये वरगुणनिधये सुरगणपतये नतजनततये । मणिगणभूषितचरणयुगाश्रितमलहरणे
    चण ते नमः ॥ ७॥ वराभये मोदकमेकदन्तं कराम्बुजातैः सततं धरन्तम् । वराङ्गचन्द्रं परभक्तिसान्द्रैर्जनैर्भजन्तं
    कलये सदाऽन्तः ॥ ८॥ वरद नतजनानां सन्ततं वक्रतुण्ड स्वरमयनिजगात्र स्वात्मबोधैकहेतो । करलसदमृताम्भोपूर्णपत्राद्य
    मह्यं गरगलसुत शीघ्रं देहि मद्बोधमीड्यम् ॥ ९॥ सर्वजनं परिपालय शर्वज पर्वसुधाकरगर्वहर । पर्वतनाथसुतासुत
    पालय खर्वं मा कुरु दीनमिमम् ॥ १० ॥ मेदोऽस्थिमांसरुधिरान्त्रमये शरीरे मेदिन्यबग्निमरुदम्बरलास्यमाने
    । मे दारुणं मदमुखाघमुमाज हृत्वा मेधाह्वयासनवरे वस दन्तिवक्त्र ॥ ११॥ वशं कुरु त्वं शिवजात मां ते वशीकृताशेषसमस्तलोक
    । वसार्णसंशोभितमूलपद्मलसच्छ्रियाऽलिङ्तवारणास्य ॥ १२॥ आनयाशुपदवारिजान्तिकं मां नयादिगुणवर्जितं तव ।
    हानिहीनपदजामृतस्य ते पानयोग्यमिभवक्त्र मां कुरु ॥ १३॥ स्वाहास्वरूपेण विराजसे त्वं सुधाशनानां प्रियकर्मणीड्यम्
    । स्वधास्वरूपेण तु पित्र्यकर्मण्युमासुतेज्यामयविश्वमूर्ते ॥ १४॥ अष्टाविंशतिवर्णपत्रलसितं हारं गणेशप्रियं
    कष्टाऽनिष्टहरं चतुर्दशपदैः पुष्पैर्मनोहारकम् । तुष्ट्यादिप्रदसद्गुरुत्तमपदाम्भोजे चिदानन्ददं शिष्टेष्टोऽहमनन्तसूत्रहृदयाऽऽबद्धं
    सुभक्त्याऽर्पये ॥ १५॥ ॥ इति श्रीअनन्तानन्दनाथकृतं श्रीगुरुचिदानन्दनाथसमर्पितं श्रीमहागणपतिमूलमन्त्रमालास्तोत्रम्
    ॥ श्रीगणेशमूलमन्त्रपदमाला
