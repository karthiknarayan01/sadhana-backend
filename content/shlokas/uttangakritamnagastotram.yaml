id: uttangakritamnagastotram
category: stotram
name:
  english: uttangakritamnagastotram
  devanagari: उत्तन्गकृतंनागस्तोत्रम्
content:
  english: uttangakritam nagastotram ya airavatarajanah sarpah samitishobhanah | varshanta iva jimutah
    savidyutpavaneritah || 139|| surupashca virupashca tatha kalmashakundalah | adityavannakaprishthe
    rejurairavatodbhavah || 140|| bahuni nagavartmani gangayastira uttare | icchetko'rkamshusenayam cartumairavatam
    vina || 141|| shatanyashitirashtau ca sahasrani ca vimshatih | sarpanam pragraha yanti dhritarashtro
    yadejati || 142|| ye cainamupasarpanti ye ca duram param gatah | ahamairavatajyeshthabhratribhyo'karavam
    namah || 143|| yasya vasah kurukshetre khandave cabhavatsada | tam kadraveyamastausham kundalarthaya
    takshakam || 144|| takshakashcashvasenashca nityam sahacaravubhau | kurukshetre nivasatam nadimikshumatimanu
    || 145|| jaghanyajastakshakasya shrutaseneti yah shrutah | avasadyo mahaddyumni prarthayannagamukhyatam
    || 146|| karavani sada caham namastasmai mahatmane || 146|| iti mahabharate adiparvani 3 adhyayantargatam
    uttangakritam nagastotram sampurnam | mahabharata | adiparva | adhyaya 3
  devanagari: उत्तङ्गकृतं नागस्तोत्रम् य ऐरावतराजानः सर्पाः समितिशोभनाः । वर्षन्त इव जीमूताः सविद्युत्पवनेरिताः
    ॥ १३९॥ सुरूपाश्च विरूपाश्च तथा कल्माषकुण्डलाः । आदित्यवन्नाकपृष्ठे रेजुरैरावतोद्भवाः ॥ १४०॥ बहूनि
    नागवर्त्मानि गङ्गायास्तीर उत्तरे । इच्छेत्कोऽर्कांशुसेनायां चर्तुमैरावतं विना ॥ १४१॥ शतान्यशीतिरष्टौ
    च सहस्राणि च विंशतिः । सर्पाणां प्रग्रहा यान्ति धृतराष्ट्रो यदेजति ॥ १४२॥ ये चैनमुपसर्पन्ति ये च दूरं
    परं गताः । अहमैरावतज्येष्ठभ्रातृभ्योऽकरवं नमः ॥ १४३॥ यस्य वासः कुरुक्षेत्रे खाण्डवे चाभवत्सदा । तं
    काद्रवेयमस्तौषं कुण्डलार्थाय तक्षकम् ॥ १४४॥ तक्षकश्चाश्वसेनश्च नित्यं सहचरावुभौ । कुरुक्षेत्रे निवसतां
    नदीमिक्षुमतीमनु ॥ १४५॥ जघन्यजस्तक्षकस्य श्रुतसेनेति यः श्रुतः । अवसद्यो महद्द्युम्नि प्रार्थयन्नागमुख्यताम्
    ॥ १४६॥ करवाणि सदा चाहं नमस्तस्मै महात्मने ॥ १४६॥ इति महाभारते आदिपर्वणि ३ अध्यायान्तर्गतं उत्तङ्गकृतं
    नागस्तोत्रं सम्पूर्णम् । महाभारत । आदिपर्व । अध्याय ३
