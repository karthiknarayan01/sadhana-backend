id: gita-govindam-chapter-6-kuntha-vaikuntha
category: stotram
name:
  english: Gita Govindam Chapter 6 - Kuntha Vaikuntha
content:
  english: '|| shashthah sargah || || kunthavaikunthah || atha tam gantumashaktam ciramanuraktam latagrihe
    drishtva | taccaritam govinde manasijamande sakhi praha || || pashyati dishi dishi rahasi bhavantam
    | tadadharamadhuramadhuni pibantam || natha hare jagannatha hare sidati radha vasagrihe || tvadabhisaranarabhasena
    valanti | patati padani kiyanti calanti || || vihitavishadabisakisalayavalaya | jivati paramiha tava
    ratikalaya || || muhuravalokitamandanalila | madhuripurahamiti bhavanashila || || tvaritamupaiti na
    kathamabhisaram | haririti vadati sakhimanuvaram || || shlishyati cumbati jaladharakalpam | harirupagata
    iti timiramanalpam || || bhavati vilambini vigalitalajja | vilapati roditi vasakasajja || || shrijayadevakaveridamuditam
    | rasikajanam tanutamatimuditam || || vipulapulakapalih sphitasitkaramanta rjanitajadimakakuvyakulam
    vyaharanti | tava kitava vidhatte''mandakandarpacintam rasajaladhinimagna dhyanalagna mrigakshi ||
    || angeshvabharanam karoti bahushah patre''pi sancarini praptam tvam parishankate vitanute shayyam
    ciram dhyayati | ityakalpavikalpatalparacanasankalpalilashata vyasaktapi vina tvaya varatanurnaisha
    nisham neshyati || || kim vishramyasi krishnabhogibhavane bhandirabhumiruhi bhrata ryahi nadrishtigocaramitassanandanandaspadam|
    radhayavacanam tadadhvagamukhannandantikegopato govindasyajayanti sayamatithiprashastyagarbhagirah||
    || || iti gitagovinde vasakasajjavarnane kunthavaikuntho nama shashthah sargah ||'
  devanagari: ॥ षष्ठः सर्गः ॥ ॥ कुण्ठवैकुण्ठः ॥ अथ तां गन्तुमशक्तां चिरमनुरक्तां लतागृहे दृष्ट्वा । तच्चरितं
    गोविन्दे मनसिजमन्दे सखी प्राह ॥ ॥ पश्यति दिशि दिशि रहसि भवन्तम् । तदधरमधुरमधूनि पिबन्तम् ॥ नाथ हरे
    जगन्नाथ हरे सीदति राधा वासगृहे ॥ त्वदभिसरणरभसेन वलन्ती । पतति पदानि कियन्ति चलन्ती ॥ ॥ विहितविशदबिसकिसलयवलया
    । जीवति परमिह तव रतिकलया ॥ ॥ मुहुरवलोकितमण्डनलीला । मधुरिपुरहमिति भावनशीला ॥ ॥ त्वरितमुपैति न कथमभिसारम्
    । हरिरिति वदति सखीमनुवारम् ॥ ॥ श्लिष्यति चुम्बति जलधरकल्पम् । हरिरुपगत इति तिमिरमनल्पम् ॥ ॥ भवति विलम्बिनि
    विगलितलज्जा । विलपति रोदिति वासकसज्जा ॥ ॥ श्रीजयदेवकवेरिदमुदितम् । रसिकजनं तनुतामतिमुदितम् ॥ ॥ विपुलपुलकपालिः
    स्फीतसीत्कारमन्त र्जनितजडिमकाकुव्याकुलं व्याहरन्ती । तव कितव विधत्तेऽमन्दकन्दर्पचिन्तां रसजलधिनिमग्ना
    ध्यानलग्ना मृगाक्षी ॥ ॥ अङ्गेष्वाभरणं करोति बहुशः पत्रेऽपि सञ्चारिणि प्राप्तं त्वां परिशङ्कते वितनुते
    शय्यां चिरं ध्यायति । इत्याकल्पविकल्पतल्परचनासङ्कल्पलीलाशत व्यासक्तापि विना त्वया वरतनुर्नैषा निशां
    नेष्यति ॥ ॥ किं विश्राम्यसि कृष्णभोगिभवने भाण्डीरभूमीरुहि भ्रात र्याहि नदृष्टिगोचरमितस्सानन्दनन्दास्पदम्।
    रधायावचनं तदध्वगमुखान्नन्दान्तिकेगोपतो गोविन्दस्यजयन्ति सायमतिथिप्राशस्त्यगर्भागिरः॥ ॥ ॥ इति गीतगोविन्दे
    वासकसज्जावर्णने कुण्ठवैकुण्ठो नाम षष्ठः सर्गः ॥
