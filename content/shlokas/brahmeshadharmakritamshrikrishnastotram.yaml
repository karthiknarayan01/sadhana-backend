id: brahmeshadharmakritamshrikrishnastotram
category: stotram
name:
  english: brahmeshadharmakritamshrikrishnastotram
  devanagari: ब्रह्मेशधर्मकृतंश्रीकृष्णस्तोत्रम्
content:
  english: brahmeshadharmakritam shrikrishnastotram brahmovaca | tava caranasaroje manmanashcancariko
    bhramatu satatamisha premabhaktya saroje | bhuvanavibhavabhogattapashantyaushadhaya sudridhasuparipakvam
    dehibhaktim ca dasyam || 21|| shankara uvaca | bhavajalanidhimagnashcittamino madiyo bhramati satatamasminghorasamsarakupe
    | vishayamativinindyam srishtisamhararupa
  devanagari: ब्रह्मेशधर्मकृतं श्रीकृष्णस्तोत्रम् ब्रह्मोवाच । तव चरणसरोजे मन्मनश्चञ्चरीको भ्रमतु सततमीश
    प्रेमभक्त्या सरोजे । भुवनविभवभोगात्तापशान्त्यौषधाय सुदृढसुपरिपक्वां देहिभक्तिं च दास्यम् ॥ २१॥ शङ्कर
    उवाच । भवजलनिधिमग्नश्चित्तमीनो मदीयो भ्रमति सततमस्मिन्घोरसंसारकूपे । विषयमतिविनिन्द्यं सृष्टिसंहाररूप
meaning: {}
