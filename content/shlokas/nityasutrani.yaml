id: nityasutrani
category: sutra
name:
  english: nityasutrani
  devanagari: नित्यसूत्राणि
content:
  english: iti shrinityanandanityasutreshu atmavedanam nama dvadasho'dhyayah | bhatakhandekulotpannena
    mahadevasununa shriramasharmana viracitani nityasutrani samapti gatani |
  devanagari: इति श्रीनित्यानन्दनित्यसूत्रेषु आत्मवेदनं नाम द्वादशोऽध्यायः । भातखण्डेकुलोत्पन्नेन महादेवसुनूना
    श्रीरामशर्मणा विरचितानि नित्यसूत्राणि समाप्ति गतानि ।
meaning: {}
