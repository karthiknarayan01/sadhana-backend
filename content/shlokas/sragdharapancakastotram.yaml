id: sragdharapancakastotram
category: stotram
name:
  english: sragdharapancakastotram
  devanagari: स्रग्धरापन्चकस्तोत्रम्
content:
  english: sragdharapancakastotram vande'ham tattvarupam tatavitatabhavam bhavyahavyasvabhavam buddhanamadibuddham
    kritavividhahitam tejasam sannidhanam | samyaksambodhimurti trigunavilasitam pancajnanaikahetum nairakaram
    niranjam gaganavadanisham nirmalam cittacaityam || 1|| jyotirupe tvadiye vinilayatapasa danashilakshamasu
    viryadhyanakhyaprajnodadhikritatarano manivrinde sujatau | bodhim prapto'smi casmin sakalapuravare
    cakanishthe mahimni vande tvam vishvarupam sphatikamanirivopattananaprabhedam || 2|| nana vaidhyam
    supujyopakaranamanisham dhaukitam sarvalokaih kim caham dhaukayishye tvadanunayamanastyaktarajyadidravyah
    | jatau jatau ca jatau kritasukritacayam kayavanmanasaistai
  devanagari: स्रग्धरापञ्चकस्तोत्रम् वन्देऽहं तत्त्वरूपं ततविततभवं भव्यहव्यस्वभावं बुद्धानामादिबुद्धं
    कृतविविधहितं तेजसां सन्निधानम् । सम्यक्सम्बोधिमूर्ति त्रिगुणविलसितं पञ्चज्ञानैकहेतुं नैराकारं निरञ्जं
    गगनवदनिशं निर्मलं चित्तचैत्यम् ॥ १॥ ज्योतीरूपे त्वदीये विनिलयतपसा दानशीलक्षमासु वीर्यध्यानाख्यप्रज्ञोदधिकृततरणो
    माणिवृन्दे सुजातौ । बोधिं प्राप्तोऽस्मि चास्मिन् सकलपूरवरे चाकनिष्ठे महिम्नि वन्दे त्वां विश्वरूपं
    स्फटिकमणिरिवोपात्तनानाप्रभेदम् ॥ २॥ नाना वैध्यं सुपूज्योपकरणमनिशं ढौकितं सर्वलोकैः किं चाहं ढौकयिष्ये
    त्वदनुनयमनास्त्यक्तराज्यादिद्रव्यः । जातौ जातौ च जातौ कृतसुकृतचयं कायवाङ्मानसैस्तै
meaning: {}
