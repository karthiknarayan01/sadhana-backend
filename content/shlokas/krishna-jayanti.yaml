id: krishna-jayanti
category: stotram
name:
  english: krishna jayanti
  devanagari: क्रिश्न जयन्ति
content:
  english: shraddhayanvitah || 4|| kritva shaucam yatha nyayam snanam kuryadatamdritah | prabhata kale
    kurvita yugayetyadimantratah || 5|| nityahnikam prakurvita bhagavantamanusmaran | madhyahna kale ca
    puman sayankale tvatandritah || 6|| snayeta purvamantrena vasudevamanusmaran | tatah pujam prakurveta
    vidhivatsusamahitah || 7|| yanayeti ca mantrena shraddhabhaktiyutah puman | krishnam ca balabhadram
    ca vasudevam ca devakim || 8|| nandagopam yashodanca subhadram tatra pujayet |
  devanagari: श्रद्धयान्वितः ॥ ४॥ कृत्वा शौचं यथा न्यायं स्नानं कुर्यादतंद्रितः । प्रभात काले कुर्वीत
    यूगायेत्यादिमन्त्रतः ॥ ५॥ नित्याह्निकं प्रकुर्वीत भगवन्तमनुस्मरन् । मध्याह्न काले च पुमान् सायङ्काले
    त्वतन्द्रितः ॥ ६॥ स्नायेत पूर्वमन्त्रेण वासुदेवमनुस्मरन् । ततः पूजां प्रकुर्वेत विधिवत्सुसमाहितः ॥
    ७॥ यनायेति च मन्त्रेण श्रद्धाभक्तियुतः पुमान् । कृष्णं च बलभद्रं च वसुदेवं च देवकीम् ॥ ८॥ नन्दगोपं
    यशोदाञ्च सुभद्रां तत्र पूजयेत् ।
