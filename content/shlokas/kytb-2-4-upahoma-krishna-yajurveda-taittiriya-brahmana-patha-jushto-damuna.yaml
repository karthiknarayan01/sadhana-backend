id: kytb-2-4-upahoma-krishna-yajurveda-taittiriya-brahmana-patha-jushto-damuna
category: stotram
name:
  english: KYTB 2.4 Upahoma - Krishna Yajurveda Taittiriya Brahmana Patha - Jushto Damuna
content:
  english: krishna yajurvediya taittiriya brahmane dvitiyashtake caturthah prapathakah shri gurubhyo namah
    | harih om || anuvakam upahomah jushto damuna atithirdurone | ima nno yajnamupa yahi vidvan | vishva
    agne 'bhi yujo vihatya | shatruyatamabhara bhojanani || agne shardha mahate saubhagaya | tava dyumnanyuttamani
    santu | sa spatyagm suyamama krinushva | shatruyatamabhitishtha mahagmsi || agne yo no 'bhito janah
    | vriko varo jighagmsati || vri~trahanjahi | vasvasmabhya mabhara || agne yo no 'bhidasati | samano
    yashca nishtyah | iddhmasyeva prakshayatah | ma tasyoccheshi kincana || tvamindrabhibhurasi | devo
    vijnataviryah | vritraha purucetanah || apa praca indra vishvagm amitran || || apapaco abhibhute nudasva
    | apodico apa shuradharaca urau | yatha tava sharmanmadema || tamindram va~jayamasi | mahe vritraya
    hantave | sa vrisha vrishabho bhuvat || yuje ratha ngaveshanagm haribhyam | upa brahmani jujushana
    masthuh | vibadhishtasya rodasi mahitva | indro vritranyaprati jaghanvan || mpritanasu jishnum | jyotishmanta
    mpurandhim | agnigg svishtakritama huvema || svishtamagne abhi ta tprinahi | vishva deva pritana abhishya
    | uru mpradishanvi bhahi | jyotishmaddhehyajara nna ayuh || tvamagne havishmantah | deva tva jatavedasam
    | sa havya vakshya 'nushak || vishvani no durgaha jatavedah | sindhu nmanasa grinanah | asmaka mboddhyavita
    tanuna m || pusha ga anvetu nah | pusha rakshatvarvatah | pusha vajagm sanotu nah || pushema asha
    anuveda sarvah || so asmagm abhayatamena neshat | svastida aghrini ssarvavirah | aprayuccha npura
    etu prajanann || tvamagne sapratha asi | jushto hota vare nyah | tvaya yajnam vi~tanvate || agni rakshagmsi
    sedhati | shukrashociramartyah | shucih pavaka idyah || agne rakshano agmhasah || || pratishma deva
    rishatah | tapishthairajaro daha || agne hagmsi nyatrina nmartyeshva | sve kshaye shucivrata || a
    vata vahi bheshajam | vi vata vahi yadrapah | tvagmhi vishva bheshajah | devana nduta iyase || dvavimau
    vata vatah || || a sindhora paravatah | daksha mme anya avatu | para 'nyo vatu yadrapah || yadado
    vata te grihe | amritasya nidhir hitah | tato no dehi jivase | tato no dhehi bheshajam | tato no maha
    avaha || vata avatu bheshajam | shambhu rmayo bhurno hride || || prana ayugmshi tarishat || tvamagne
    aya 'si | aya sanmanasa hitah | aya sanahavyamuhishe | aya no dhehi bheshajam || ishto agnirahutah
    | svahakritah pipartu nah | svaga devebhya ida nnamah || kamo bhutasya bhavyasya | samradeko virajati
    || mprati paprathe | ritunu thsrijate vashi || kamastadagre samavartatadhi | manaso retah prathamam
    t | sato bandhumasati niravindann | hridi pratishya kavayo manisha || tvaya manyo saratha shamanaso
    dhrishata marutvah | tigmeshava ayudha sagmshishanah | upaprayanti naro agnirupah || || manyurbhago
    manyurevasa devah | manyur hota varuno vishvavedah | manyum vi~sha idate devayantih | pahi no manyo
    tapasa shramena || tvamagne vratabhricchucih | devagm asadaya iha | agne havyaya vodhave || vrata
    nu bibhradvratapa ada bhyah | yaja no devagm ajarah suvirah | dadha dratnani suvidano agne | gopaya
    no jivase jatavedah || suvidano agna eka upahomah cakshusho hete manaso hete | vaco hete brahmano
    hete | yo ma rabhidasati | tamagne menya nkrinu || yo ma cakshusha yo manasa | yo vaca brahmana 'ghayu
    mmenya | amumameni tkincasau manasa yacca vaca | yajnai rjuhoti yajusha havirbhih || ''dishtadahutirasya
    hantu || yatudhana nir ritiradu rakshah | te asyaghna ntvanritena satyam | indreshita ajyamasya mathnantu
    | mata thsamriddhi yadasau karoti || hanmi te nkritagm havih | yo me ghoramaci kritah | apa ncau ta
    ubhau bahu | apanahyamyasya || apanahyami te bahu | apanahyamyasya rdevasya brahmana | sarva nkritam
    || pura 'mushya vashatkarat | yajna ndeveshu naskridhi | svishtamasmaka nnaratayah || anti dure sato
    agne | bhratrivyasya 'bhidasatah || || vashatkarena vajrena | krityagm hanmi kritamaham || yo ma nakta
    ndiva sayam | pratashcahno nipiyati | adya tamindra vajrena | bhratrivya mpadayamasi || indrasya griho
    ssashvah | saha yanme asti tena || ide agnim || gira yajnasya sadhanam | shrushtivana ndhitavanam
    || agne shakema te vayam | yama ndevasya vajinah | ati dveshagmsi tarema || avata mma samanasau samokasau
    | sacetasau saretasau | ubhau mamavata njatavedasau | shivau bhavatamadya nah || svaya || tigmashringo
    vrishabha shshoshucanah | pratnagm sadhastha manupashyamanah | a tantumagni nnastanturuta seturagne
    | tva mpantha bhavasi devayanah | tvaya va~yamaruhema | atha devai mmumugdhi nah | vi pasha ncrita
    | avadhamani jivase || vayagm soma vrate tava | manastanushu bibhratah | praja vanto ashimahi || indrani
    devi subhaga supatni | udagmshena patividye jigaya | trigmshadasya jaghanam yo~janani | upastha indragg
    sthavira mbibharti || sena ha nama prithivi dhananjaya | vishvavyaca aditi ssuryatvak | indrani devi
    prasaha dadana || || sa no devi suhava sharma yacchatu || a tva 'har shamantarabhuh | dhruvastishthavicacalih
    | vishastva sarva vanchantu | ma tva madhibhrashat || dhruva dyau rdhruva prithivi | dhruvam njagat
    | dhruva ha parvata ime | dhruvo raja vishamayam || ihaivaidhi ma vyathishthah || || parvata iva vicacalih
    | indra iveha dhruvastishtha | iha rashtra mudharaya || abhitishtha pritanyatah | adhare santu shatravah
    | indra iva vritrahatishtha | apah ya~nn || indra enamadidharat | dhruva | tasmai deva adhibravann
    | aya nca brahmanaspatih || upahomah jushti naro brahmana vah pitrinam | akshamavyaya nna kila rishatha
    | yacchakvarishu brihata ravena | indre shushmamadadhatha vasishthah || pavaka na ssarasvati | vajebhi
    rvajinivati | yajnam va~shtu dhiya vasuh || sarasvatyabhi no neshi vasyah | ma paspharih payasa ma
    na a dhak | jushasva na ssakhya veshya ca || nyaranani ganma || vrinje havirnamasa barhiragnau | ayami
    srug ghritavati suvriktih | amyakshi sadma sadane prithivyah | ashrayi yajna ssurye na cakshuh ||
    iharvancamatihvaye | indra njaitraya jetave | asmakamastu kevalah || arvancamindramamuto havamahe
    | yo goji vi~have jushasva | asya kurmo harivo medina ntva || asamrimshto jayase matrivo shshucih
    | mandrah kavirudatishtho vivasvatah | ghritena tva 'vardhayannagna ahuta | dhumaste keturabhava ddivi
    shritah || agniragre prathamo devatanam | sam muttamo vishnurasit | yajamanaya parigrihya devan |
    dikshayedagm haviragacchata || agnishca vishno tapa uttama mmahah | dikshapalebhyo vanatagm hi shakra
    | vishvai vi~danau | dikshamasmai yajamanaya dhattam || prata dvishnuh stavate viryaya | mrigo na
    bhimah kucaro girishthah | yasyorushu trishu vikramaneshu | adhikshiyanti bhuvanani vishva || nu marto
    dayate sanishyan yah | vishnava urugayaya dashat || ssatraca manasa yaja tai | etavanta nnaryamavivasat
    || vicakrame prithivimesha etam | kshetraya vishnu rmanushe dashasyann | dhruvaso asya kirayo janasah
    | urukshitigm sujanima cakara || trirdevah prithivimesha etam | vicakrame shatarcasa mmahitva | pra
    vishnu rastu tavasasta viyan | tveshagg hyasya sthavirasya nama || maddhvarasya | yajnasya yajnasya
    ketugm rushantam | pratyardhi ndevasya devasya mahna | shriya tva njananam || a no vishvabhirutibhih
    sajoshah | brahma jushano haryashva yahi | varivrija ssushipra | asme dadha dvrishanagm shushmamindra
    || indrah suvarsha janayannahani | jigayoshigbhih pritana abhishrih || || prarocayanmanave ketumahna
    m | avindajjyoti rbrihate ranaya || ashvinavavase nihvaye vam | a nunam ya~tagm sukritaya vipra |
    prataryuktena suvrita rathena | upagacchatamavasa ''gata ndhishvashvina na asu | prajava ntoke tanaye
    tutujanah | suratnaso devaviti || tvagm soma kratubhi ssukraturbhuh | tva ssudaksho vishvavedah |
    tvam rmahitva | dyumnebhi rdyumnyabhavo nricakshah yu~thsu pritanasu papri vri~janasya gopam | bhareshujagm
    sukshitigm sushravasam | jayanta ntvamanu madema soma || bhava mitro na shevyo ghritasutih | vibhutadyumna
    evaya u saprathah || adha te vishno vidushacidridhyah | stomo yajnasya raddhyo havishmatah || yah
    purvyaya vedhase naviyase | sumajjanaye vishnave dadashati | yo jatamasya mahato mahi brava ncidabhyasat
    || tamu stotarah purvyam ya~tha vida ritasya | garbhagm havisha pipartana | a 'sya jananto nama cidvivaktana
    | brihatte vishno sumati || ima dhana ghritasnuvah | hari ihopavakshatah | indragm sukhatame rathe
    || esha brahma ya ritviyah | indro nama shruto gane || pra te mahe | vidathe shagmsishagm hari | ya
    ritviyah pra te vanve | vanusho haryata m | indro nama ghrita nna yah | haribhishcaru secate | shruto
    gana a tva vishantu || shanipra vrishabho jananam | raja krishtina mpuruhuta indrah | stuta shshravasyannavasopamadrik
    | yuktva hari vrishana ''ya ya~dayann | apah samudragm ratthyeva jagmuh | atashcidindra ssadaso variyan
    | yadigm somah prinati dugdho agmshuh || hvayamasi tvendra yahyarvam || nte somastanuve bhavati |
    shatakrato madayasva suteshu | prasmagm ava pritanasu pra yuthsu || indraya somah pradivo vidanah
    | ribhu vihayah | prayamyamana nprati shugribhaya | indra piba vrishadhutasya vrishnah || ahedamana
    upayahi yajnam | tubhya ssutasah | gavo na vajrin || indragahi prathamo yajniyanam || ya te kaku thsukrita
    ya varishtha | yaya shashvatpibasi maddhva urmim | taya pahi pra te addhvaryurasthat | sa nte vajro
    vartatamindra gavyuh || prataryuja vibodhaya | ashvinaveha gacchatam | asya somasya pitaye || prataryavana
    prathama yajaddhvam | pura griddhradararushah pibathah | pratar hi yajnamashvina dadhate | prashagm
    santi kavayah purvabhajah || prataryajaddhvamashvina hinota | na sayamasti devaya ajushtam | utanyo
    asma dyajate vicayah | purvah purvo yajamano vaniyan || 'syoshadhe | rame krishne asikni ca | idagm
    rajani rajaya | kilasa nca | nirito nashaya prishat | a na shvetani pataya || asita nte nilayanam
    | asthanamasita || asikniyasyoshadhe | nirito nashaya prishat || asthijasya kilasasya | tanujasya
    ca yattvaci | krityaya kritasya brahmana | lakshma shvetamaninasham || sarupa nama te mata | sarupo
    nama te pita | sarupa 'syoshadhe sa | sarupamida || shunagm huvema maghavanamindra m | asminbhare
    nritamam va~jasatau | shrinvanta mugramutaye samathsu | ghnantam vri~trani sajinta ndhananam || dhunutha
    dya mparvatandashushe vasu | ni vo vana jihate yamano bhiya | kopayatha prithivi mprishnimatarah |
    yudhe yadugrah prishati rayugdhvam || pravepayanti parvatan | vivincanti vanaspatin || || provarata
    maruto durmada iva | devasa ssarvaya visha || purutra hi sadrinnasi | visho vishva anu prabhu | samathsu
    tva havamahe || samathsvagni mavase | vajayanto havamahe | vajeshu citraradhasam || sangacchaddhvagm
    sam vo~ managmsi janatam || | sajannana upasata || samano mantra mmanah saha cittamesham | samana
    sagmrabhaddhvam | sajnannena vo havisha yajamah || samani va akutih | samana hridayani vah | samanamastu
    vo manah | yatha va ssvaih | sajnannamaranaih | sajnannamashvina yuvam | ihasmasu niyacchatam || sajnanna
    mme brihaspatih | sajnannagm savita karat | sajnannamashvina yuvam | iha mahya nniyacchatam || upacchayamiva
    ghrineh | aganma sharma te vayam || || agne hiranyasandrishah || adabdhebhi ssavitah payubhishtvam
    | shivebhiradya paripahi no gaya ssuvitaya navyase | rakshamakirno aghashagmsa ishata || mademade
    hi no daduh | yutha gavamrijukratuh | sangribhaya puru shata | ubhaya hastya vasu | shishihi raya
    abhara || mpate | shacivastava dagmsana | a tu na indra bhajaya | goshvashveshu shubhrushu | sahasreshu
    tuvimagha || ya ddeva deva hedanam | devasashcakrima vayam | adityastasma nma yuyam | ritasyartena
    muncata || ritasyarte || yajatra muncateha ma | yajnairvo yajnavahasah | ashikshanto na shekima ||
    medasvata yajamanah | sruca ''jyena juhvatah | akama vo vishve devah | shikshanto nopa shekima ||
    yadi diva yadi nakta || drupadadiva muncatu || drupadadive nmumucanah | svinna ssnatvi maladiva |
    puta mpavitrene vajya m | vishve muncantu mainasah || udvaya ntamasaspari | pashyanto jyotiruttaram
    | deva m | aganma jyotiruttamam || upahomah vrisha so agmshuh pavate havishman thsomah | indrasya
    bhaga ritayu shshatayuh | sa ma vrishanam vi~shagm sarvaviragm suvira m || kasya vrisha sute saca
    n vrishabho ranat | vritraha somapitaye || yaste shringa vrisho napat | pranapa tkundapayyah | nyasmindaddhra
    a manah || || tagm saddhricirutayo vrishniyani | paugg syani niyutah sashcurindra nna sindhava ukthashushmah
    | uruvyacasa ngira avishanti || indraya giro anishitasargah | apah prairayan thsagarasya buddhnat
    | yo aksheneva cakriya shacibhih | vishvaktastambha prithivimuta dyam || akshodayacchavasa kshama
    buddhnam | varnavatastavishibhirindrah || ghnadushamana ojah | avabhinatkakubhah parvatanam || a no
    agne suketuna vi~shvayuposhasam | mardika || tvagm soma mahe bhaga yu~na ritayate | daksha yu~njate
    marutah shubhe sagam | suro na mitravaruna gavishtishu || || rajagmsi citra vi caranti tanyavah |
    diva ssamraja payasa na ukshatam || vacagm su mitravarunaviravatim | parjanyashcitram va~dati tvishimatim
    | abhra vasata maruta m || ayukta sapta shundhyuvah | suro rathasya naptriyah | tabhiryati svayuktibhih
    || vahishthebhirviharan ndeva vasvah | daviddhvato rashmaya ssuryasya | carmevavadhustamo aphsvantah
    || parjanyaya pragayata | divasputraya midhushe | sa no yavasamicchatu || accha vada tavasa ngirbhirabhih
    | stuhi parjanya nnamasa vivasa | kanikrada dvrishabho jiradanuh | reto dadhatvoshadhishu garbha ||
    yo garbhamoshadhinam | gava nkrinotyarvatam | parjanyah purushina m || tasma idasye havih | juhota
    madhumattamam | ida nkarat || tisro yadagne sharadastvamit | shuci ssaparyann | namani ciddadhire
    yajniyani | asudayanta tanuva mmimikshatam | garbha mavivesha | yayoranando nihito mahashca | shunasiravritubhih
    sam vi~danau | indravantau havirida njushetham || a gha ye agnimindhate | strinanti barhiranushak
    | yeshamindro yuva sakha || agna indrashca medina | hatho vritranyaprati | yuvagm hi vritrahantama
    || yabhyagm suvarajayannagra eva | yavatasthatu shani vrishana vajrabahu | agni indra vritrahana huve
    vam || upahomah uta nah priya priyasu | saptasvasa sujushta | sarasvati stomya 'bhut || ima juhvana
    yushmada namobhih | prati stomagm sarasvati jushasva | tava sharma npriyatame dadhanah | upastheyama
    sharana nna vriksham || trini pada vicakrame | vishnurgopa ada bhyah | tato dharmani dharayann ||
    || tadasya priyamabhi patho ashyam | naro yatra devayavo madanti | urukramasya sa hi bandhurittha
    | vishnoh pade parame maddhva uthsah || kratva da asthu shreshthah | adya tva vanvan | marta anasha
    suvriktim || ima brahma brahmavaha | priya ta a barahi ssida | vihi sura purodasha ssunavo girah |
    shrinvantvamritasya ye | sumridika bhavantu nah || adya no deva savitah | prajava ssaubhagam | para
    dusshvapniyagm suva || vishvani deva savitah | duritani parasuva | ya ntanma asuva || shucimarkai
    || addhvareshu namasyata | anamyoja acake || ya dharayanta deva sudaksha dakshapitara | asuryaya pramahasa
    || sa itksheti sudhita okasi sve | tasma ida pinvate vishvadani | tasmai vishah svayamevanamanti |
    yasmi nbrahma rajani purva eti || sakutimindra sacyutim | sacyuti nna abhara | prayaphsyanniva sakthyau
    || vina indra mridho jahi | kanikhunadiva sapayann | abhi na ya~shah | mushkayoradadha m | kamasya
    triptimanandam | tasya || modah pramoda anandah || || mushkayornihita ssapah | sritveva kamasya tripyani
    | dakshinana mpratigrahe || manasashcitta mashimahi | pashunagm rupamannasya | yasha mmayi || yatha
    'hamasya atripagg striyai puman | yatha stri tripyati pugmsi priye priya | eva || yajnasya kamyah
    priyah || dadamityagnirvadati | tatheti vayuraha tat | hanteti satya ssatyamomiti || apasta thsatyamabharann
    | yasho yajnasya dakshinam | asau me kama ssamriddhyatam || na hi spashamavida nnanyamasmat | vaishvanara
    tpura etaramagneh || || athemamanthannamritamamurah | vaishvanara trajityaya devah || yeshamime purve
    armasa asann | ayupa ssadma vibhrita puruni | vaishvanara tvaya te nuttah | prithivi mmahim | antariksha
    mupabruve | brihatimutaye diva vi~paprathe | duhe dyau rbrihati payah || na ta nashanti na dabhati
    taskarah | naina amitro vyathiradadhar ryajate dadati ca | jyogittabhih sacate gopati ssaha || na
    ta arva renukakato ashnute | na sagg skritatra mupayanti ta abhi | urugayamabhaya ntasya ta anu |
    gavo martyasya vicaranti yajvanah || || ratri vyakhyadayati | purutra devyakshabhih | vishva adhi
    shriyo 'dhita || upa te ga ivakaram | vrinishva duhita rdivah | ratri stoma va~camajanayanta devah
    | tam vi~shvarupah pashavo vadanti | sa no mandreshamurja nduhana | dhenurvagasmanupa sushtutaitu
    || vicetanani | rashtri devana nnishasada mandra | catasra urja nduduhe payagmsi | kva svi dasyah
    parama njagama || gauri mimaya salilani takshati | ekapadi dvipadi sa catushpadi | ashtapadi navapadi
    babhuvushi kshara parame vyomann || tasyagm samudra adhi vi ksharanti | tena jivanti pradishashcatasrah
    || mupajivati || indra sura janayan vishvakarma | marutvagm astu ganava thsajatavan | asya snusha
    shvashurasya prashishtim | sapatna vaca mmanasa upasatam || indra drajagmsi | snusha sapatna 'yamastu
    | ayagm shatru njayatu vajasatau || agnih kshatrabhridanibhrishtamojah | sahasriyo dipyata maprayucchann
    | vibhrajamana ssamidhana ugrah | a vajasatau catvari ca rvrishabhaya grihyase | vrisha 'yamugro nricakshase
    | divyah karmanyo hito brihannama | vrishabhasya ya kakut || vishuvan | atho indra iva devebhyah |
    vibravitu jane va~rcasvantam | atho adhipatim || asyah prithivya addhyaksham | imamindra vrishabha
    ssushringah suvrishabhah | kalyano drona ahitah | kar shivalapraganena | vrishabhena yajamahe || vrishabhena
    yajamanah | akrureneva sarpisha | mridhashca sarva indrena | pritanashca jayamasi || || yasyayamrishabho
    havih | indraya pariniyate | jayati shatrumayanta m | atho hanti pritanyatah || nrinamaha pranirasat
    | agra udbhindatamasat || indra shushma ntanuva merayasva | nica vishva abhitishthabhimatih | ni shrinihyabadham
    yo~ no asti | uru || prehyabhiprehi prabhara sahasva | ma viveno vi shrinushva janeshu | udidito vrishabha
    tishtha shushmaih npuro asmaka yuddhya || agne jeta tva thsahasa ojasa | vi shatrun ntuvijata viprah
    | ratha ssvapa ataksham | yadidagne prati tva || suvarvatirapa ena jayema || yo ghritenabhimanitah
    | indra jaitraya jajnishe | sa na ssankasu paraya | pritanasahyeshu ca || indro jigaya prithivim |
    antarikshagm suvarmahat | vritraha purucetanah || indro jigaya sahasa sahagmsi | indro jigaya pritanani
    vishva || indro jato vi puro ruroja | sa nah paraspa varivah krinotu || aya nkritnuragribhitah | vishvaji
    rviprah kavyena || vayuragrega yajnaprih | saka nganmanasa yajnam | shivo niyudbhih shivabhih || vayo
    shukro ayami te | maddhvo agra || aya hi somapitaye | svaruho deva niyutvata || imamindra vardhaya
    kshatriyanam | ayam vi~shpatirastu raja | asma indra mahi varcagmsi dhehi | avarcasa nkrinuhi shatrumasya
    || imamabhaja grame ashveshu goshu | niramu shman kshatrasya kakubhi shrayasva | tato na ugro vibhaja
    vasuni || || asme dyavaprithivi bhuri vamam | sa ngharmadugheva dhenuh | ayagm raja priya indrasya
    bhuyat | priyo gavamoshadhina mutapam || yunajmi ta uttaravanta m | yena jayasi na parajayasai | sa
    tva 'karekavrishabhagg m | atho rajannuttama m || uttarastvamadhare te sapatnah | ekavrisha indrasakha
    jigivan || || vishva ashah pritana ya~njayann | abhitishtha shatruyata mbharanti kshitayo yavishtha
    | balimagne anti ta ota durat | a bhandishthasya sumati ncikiddhi | brihatte agne mahi sharma bhadram
    || yo dehyo anamayadvadhasnaih | yo aryapatni rushasashcakara | sa niruddhya nahusho yahvo agnih |
    vishashcakre balihrita || pra sadyo agne atya shyanyan | aviryasmai carutaro babhutha | idenyo vapushyo
    vibhava | priyo vishamatithi rmanushinam || brahma jyeshtha virya sambhritani | brahmagre jyeshtha
    ndivamatatana | ritasya brahma prathamota jajne | tenar hati brahmana spardhitu nkah || brahma sruco
    ghritavatih | brahmana svaravo mitah || || brahma yajnasya tantavah | ritvijo ye havishkritah || shringanivecchringinagm
    sandadrishrire | cashalavanta ssvaravah prithivyam | te devasa ssvaravastasthivagmsah | nama ssannanma
    'vagata || abhibhuragniratara drajagmsi | spridho vihatya pritana abhishrih | jushano ma ahuti mma
    mahishta | hatva sapatnan varivaskarannah || ishana m | staumyagna urukritagm suvira ssapatnagm abhibhurasi
    | jahi shatrugmrapa mridho nudasva || upahomah sa pratnavannaviyasa | agne shshyenaya jijanam | vasoh
    kuvidvanati nah || svaruha yasya shriyo drishe | rayirviravato yatha | agre yajnasya cetatah || ada
    mmanushinam | turni ratha ssada navah || navagm somaya vajine 'jani | jushtagm shucitamam va~su ||
    navagm soma jushasva nah | piyushasyeha tripnuhi | yaste bhaga ritavayam || navasya soma te vayam
    | a sumatim || sa no rasva sahasrinah || navagm havirjushasva nah | ritubhih soma bhutamam | tadanga
    pratiharya nah | rajana nnavagm havih | indragnibhya nnivedaya | tajjushetagm sacetasa || shuci nnavajatamadya
    | indra gni vritrahana jushetha || ubha hi vagm suhava johavimi | ta vajagm sadya ushate dheshtha
    || agnirindro navasya nah | asya havyasya tripyatam | iha devau sahasrinau nna a hi gacchatam | vasumantagm
    suvarvida m | asya havyasya tripyatam | agnirindro navasya nah || vishva 'sya navasya nah | suvarvido
    hi jajnire || eda ssushtarima navena | ayam ya~jno yajamanasya bhagah | aya mbabhuva bhuvanasya garbhah
    | vishve deva idamadyagamishthah || ime nu dyavaprithivi samici || ime dhenu amritam tyuttarametu
    pushtih | imam njushamane navena | samici dyavaprithivi ghritaci || yavishtho havyavahanah | citrabhanu
    rghritasutih | navajato virocase | agne tatte mahitvanam || tvamagne devata bhyah | bhage deva na
    miyase || yakshyasi | navagg stoma njushasva nah || agnih prathamah prashnatu | sa hi veda yatha havih
    | shiva asmabhya moshadhih | krinotu vishvacar ssamanaishta devah | tvaya 'vasena samashimahi tva
    | sa no mayobhuh pito avishasva | sha syonah || etamu tya m | sarasvatya adhimanavacarkrishuh | indra
    asi shshatakratuh | kinasha asa nmarutah sudanavah || syona shcatvari ca vishva asha ashitih || harih
    om | || krishna yajurvediya taittiriya brahmane dvitiyashtake caturthah prapathaka
