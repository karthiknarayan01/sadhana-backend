id: uttangakritam1vishnustotram
category: stotram
name:
  english: uttangakritam1vishnustotram
  devanagari: उत्तन्गकृतं१विष्णुस्तोत्रम्
content:
  english: uttangakritam 1 vishnustotram uttanka uvaca | vishvakarmannamaste'stu yasya te rupamidrisham
    | padbhyam te prithivi vyapta shirasa cavritam nabhah || 6|| dyavaprithivyoryanmadhyam jatharena tadavritam
    | bhujabhyamavritashcashastvamidam sarvamacyuta || 7|| samharasva punardeva rupamakshayyamuttamam
    | punastvam svena rupena drashtumicchami shashvatam || 8|| iti mahabharate ashvamedhikaparvani 54
    adhyayantargatam arjunakritam shrikrishnastotram sampurnam | mahabharata | ashvaparva | adhyaya 54
  devanagari: उत्तङ्गकृतं १ विष्णुस्तोत्रम् उत्तङ्क उवाच । विश्वकर्मन्नमस्तेऽस्तु यस्य ते रूपमीदृशम् ।
    पद्भ्यां ते पृथिवी व्याप्ता शिरसा चावृतं नभः ॥ ६॥ द्यावापृथिव्योर्यन्मध्यं जठरेण तदावृतम् । भुजाभ्यामावृताश्चाशास्त्वमिदं
    सर्वमच्युत ॥ ७॥ संहरस्व पुनर्देव रूपमक्षय्यमुत्तमम् । पुनस्त्वां स्वेन रूपेण द्रष्टुमिच्छामि शाश्वतम्
    ॥ ८॥ इति महाभारते आश्वमेधिकपर्वणि ५४ अध्यायान्तर्गतं अर्जुनकृतं श्रीकृष्णस्तोत्रं सम्पूर्णम् । महाभारत
    । आश्वपर्व । अध्याय ५४
meaning: {}
