    । ककारादिक्षकारान्तमातृकामयि । पञ्चाशद्वर्णमयि । नादमयि । बिन्दुमयि । कलामयि । व्यापिकामयि । समनामयि
    । उन्मनामयि । महाशून्यमयि । चिदाकाशमयि । परावाक्मयि । पश्यन्तीमयि । मध्यमामयि । वैखरीमयि । सर्वमातृकामयचक्रस्वामिनि
    । श्रीमहेश्वरि । महामहाविद्ये । महामहाशक्ते । महामहाश्रये । महामहाभोगे । महामहायोगे । महामहाकल्याणि
    । महामहामङ्गले । महामहामङ्गलमूर्ते । महामहासौभाग्यदायिनि । महामहासिद्धिदायिनि । महामहावागीश्वरि ।
    महामहालेखेश्वरि । महामहागुह्ये । महामहारहस्ये । महामहापरदेवते । महामहापराशक्ते । महामहापरमेश्वरि ।
    महामहामात्रिके । महामहागायत्रि । महामहात्रिपुरे । महामहाभुवनेश्वरि । महामहाचिदम्बरेश्वरि । महामहाब्रह्मविद्ये
    । महामहापूर्णानन्दे । महामहामुक्तिदायिनि । महामहाकरुणामयि । महामहाज्ञानस्वरूपिणि । महामहाश्रीपरब्रह्मबिन्दो
    । श्रीमन्नगरनिलये । श्रीअनन्तकोटिब्रह्माण्डनायिके महामहाश्रीमहाराज्ञि । नमस्ते नमस्ते नमस्ते नमः ।
    ॐ ऐं ह्रीं श्रीं लीं स्वाहा ॥ इत्येतत् कथितं देवि श्रीलेखिन्याः परं महत् । खड्गमालामयं दिव्यं रहस्यानामपि
    रहः ॥ नैतत् वेदैर्न शास्त्रैश्च न पुराणशतैरपि । लभ्यते तपसा घोरे गुरुभक्त्यैव लभ्यते ॥ गोपनीयं प्रयत्नेन
    स्वयोनिरिव पार्वति । अभक्ताय न दातव्यं निन्दकाय कदाचन ॥ भक्ताय गुरुभक्ताय शान्तचित्ताय योगिने । दद्यात्
    परीक्ष्य विधिना सर्वसिद्धिप्रदं परम् ॥ यः पठेन्नित्यकालं तु श्रद्धाभक्तिसमन्वितः । तस्य भाग्यलिपिर्दिव्या
    स्वयं देवी प्रलिख्यते ॥ दुर्भाग्यरेखाः सर्वास्तु क्षीयन्ते क्षणमात्रतः । सौभाग्यसञ्चयो नित्यं वर्धते
    च दिने दिने ॥ अलिखितं लिखितं चैव दुष्टलेखं विनश्यति । दैवरेखा शुभा भूत्वा प्रसन्ना जायते ध्रुवम् ॥
    दरिद्रो धनवान् भूयादविद्वान् वेदपारगः । मूकः स्याद्वाक्पतिः सद्यो निर्बलः सिंहविक्रमः ॥ अकीर्तिर्विपुलां
    कीर्तिं निर्लक्ष्मीर्लभते श्रियम् । अपुत्रः पुत्रमाप्नोति निर्गृहो मन्दिरं लभेत् ॥ गद्यपद्यप्रबन्धेषु
    स्वतन्त्रं जायते मनः । अलिखितोऽपि ग्रन्थार्थः स्वयमेव प्रकाशते ॥ वाग्देवी तस्य जिह्वाग्रे नित्यवासं
    प्रपद्यते । लेखिनी हस्तपद्मे च नृत्यतीव मुहुर्मुहुः ॥ यत्रैतत्पठ्यते नित्यं पूज्यते वा समाहितैः ।
    तत्र लक्ष्मीर्ध्रुवा नित्यं जयश्रीर्नापसर्पति ॥ भूर्जपत्रे समालिख्य गोरोचनकुङ्कुमैः । धारयेद्यदि भक्त्या
    वै सर्वरक्षाकरं परम् ॥ राजद्वारे सभामध्ये सङ्ग्रामे शत्रुसङ्कटे । वने जले गिरौ दुर्गे न भयं तस्य जायते
    ॥ भूतप्रेतपिशाचाद्या डाकिन्यो योगिनीगणाः । दृष्ट्वैव दूरतो यान्ति खड्गमालाप्रभावतः ॥ यक्षरक्षोग्रहव्याधिदारिद्र्योपद्रवास्तथा
    । नश्यन्ति स्मरणादस्य वह्नौ तूलमिव क्षणात् ॥ अणिमा महिमा चैव गरिमा लघिमा तथा । प्राप्तिः प्राकाम्यमीशित्वं
    वशित्वं च प्रसिद्यति ॥ त्रिकालज्ञानसम्पत्तिर्दूरदृष्टिर्मनोरथः । परचित्तावबोधश्च गुरुपादप्रसादतः ॥
    चतुःषष्टिकलाः सर्वा विद्याश्चाष्टादश स्मृताः । अनायासेन सिद्ध्यन्ति लेखिनीपरितोषतः ॥ न मन्त्रः सदृशोऽस्यास्ति
    न विद्या न च देवता । न तीर्थं न तपो दानं न योगो न च साधनम् ॥ यत्र गायत्र्यधिष्ठानं यत्र श्रीत्रिपुरा
    स्वयम् । यत्र ब्रह्म परं ज्योतिस्तत्र लेखिन्यवस्थितिः ॥ यत्र लेखिन्यधिष्ठानं तत्र वेदाश्चतुर्दश ।
    तत्र सर्वाणि तन्त्राणि तत्र सर्वा महाविद्याः ॥ यत्र सा परमालेखा तत्र श्रीपरब्रह्म तत् । यत्र परब्रह्म
    तत्रैव न पुनर्जन्म विद्यते ॥ इदं स्तोत्रं महागुह्यं खड्गमालामनुत्तमम् । सर्वमन्त्रेषु मन्त्रेन्द्रं
    सर्वतन्त्रेषु तन्त्रराट् ॥ लेखिनीप्रीतिदं नित्यं ब्रह्मसाम्राज्यदायकम् । भुक्तिं मुक्तिं च विज्ञानं
    स्वयमेव प्रयच्छति ॥ ॥ इति श्रीसिद्धाश्रमोक्ते गुप्तयामले श्रीलेखिनीरहस्ये श्रीभैरवभैरवीसंवादे परब्रह्म
    महागायत्री खड्गमाला स्तोत्रं सम्पूर्णम् ॥ गायत्री यन्त्र स्तोत्रं अथवा गायत्री सिद्ध शक्ति मालामन्त्रं
    च
