id: budhakritamshivastotram
category: stotram
name:
  english: budhakritamshivastotram
  devanagari: बुधकृतंशिवस्तोत्रम्
content:
  english: budha uvaca | namah putatmane tubhyam jyotirupa namo'stu te | vishvarupa namastubhyam rupatitaya
    te namah || 1|| namah sarvartinashaya pranatanam shivatmane | sarvajnaya namastubhyam sarvakartre
    namo'stu te || 2|| kripalave namastubhyam bhaktigamyaya te namah | phaladatre ca tapasam taporupaya
    te namah || 3|| shambho shiva shivakanta shanta shrikantha shulabhrit | shashishekharasharvesha shankareshvara
    dhurjate || 4|| pinakapane girisha shitikantha sadashiva | mahadeva namastubhyam devadeva namo'stu
    te || 5|| stutikartum na janami stutipriya maheshvara | tava padambujadvandve nirdvandva bhaktirastu
    me || 6|| ayameva varo natha prasanno'si yadishvara | nanyam varam vrine tvattah karunamritavaridhe
    || 7|| tatah praha maheshanastatstutya paritoshitah | rauhineya mahabhaga saumya saumyavaconidhe ||
    8|| iti shriskadapurane kashikhande purvarddhe pancadasha
  devanagari: बुध उवाच । नमः पूतात्मने तुभ्यं ज्योतीरूप नमोऽस्तु ते । विश्वरूप नमस्तुभ्यं रूपातीताय ते
    नमः ॥ १॥ नमः सर्वार्तिनाशाय प्रणतानां शिवात्मने । सर्वज्ञाय नमस्तुभ्यं सर्वकर्त्रे नमोऽस्तु ते ॥ २॥
    कृपालवे नमस्तुभ्यं भक्तिगम्याय ते नमः । फलदात्रे च तपसां तपोरूपाय ते नमः ॥ ३॥ शम्भो शिव शिवाकान्त
    शान्त श्रीकण्ठ शूलभृत् । शशिशेखरशर्वेश शङ्करेश्वर धूर्जटे ॥ ४॥ पिनाकपाणे गिरिश शितिकण्ठ सदाशिव । महादेव
    नमस्तुभ्यं देवदेव नमोऽस्तु ते ॥ ५॥ स्तुतिकर्तुं न जानामि स्तुतिप्रिय महेश्वर । तव पादाम्बुजद्वन्द्वे
    निर्द्वन्द्वा भक्तिरस्तु मे ॥ ६॥ अयमेव वरो नाथ प्रसन्नोऽसि यदीश्वर । नान्यं वरं वृणे त्वत्तः करुणामृतवारिधे
    ॥ ७॥ ततः प्राह महेशानस्तत्स्तुत्या परितोषितः । रौहिणेय महाभाग सौम्य सौम्यवचोनिधे ॥ ८॥ इति श्रीस्कादपुराणे
    काशीखण्डे पूर्वार्द्धे पञ्चदशा
meaning: {}
