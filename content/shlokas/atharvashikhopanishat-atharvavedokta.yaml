id: atharvashikhopanishat-atharvavedokta
category: upanishad
name:
  english: atharvashikhopanishat (atharvavedokta)
  devanagari: अथर्वशिखोपनिषत् (अथर्ववेदोक्त)
content:
  english: sastanubhirvyashema devahitam yadayuh | svasti na indro vriddhashravah | svasti nah pusha vishvavedah
    | svasti nastarkshyo arishtanemih | svasti no brihaspatirdadhatu || om shantih shantih shantih ||
    om atha hainam paippalado'ngirah sanatkumarashcatharvanamuvaca bhagavan kimadau prayuktam dhyanam
    dhyayitavyam kim taddhyanam ko va dhyata kashca dhyeyah | sa ebhyotharva pratyuvaca | omityetadaksharamadau
    prayuktam dhyanam dhyayitavyamityetadaksharam param brahmasya padashcatvaro vedashcatushpadidamaksharam
    param brahma | purvasya matra prithivyakarah rigbhirrigvedo brahma vasavo gayatri garhapatyah | dvitiyantariksham
    sa ukarah sa yajubhiryajurvedo vishnurudrastrishtubdakshinagnih | tritiyah dyauh sa makarah sa samabhih
    samavedo rudra aditya jagatyahavaniyah | yavasane'sya caturthyardhamatra sa somaloka onkarah satharvanamantrairatharvavedah
    samvartako'gnirmaruto viradekarshirbhasvati smrita | prathama raktapita mahadbrahma daivatya | dvitiya
    vidyumati krishna vishnudaivatya | tritiya shubhashubha shukla rudradaivatya | yavasane'sya caturthyardhamatra
    sa vidyumati sarvavarna purushadaivatya | sa esha hyonkarashcaturaksharashcatushpadashcatuhshirashcaturthamatrah
    sthulametadhrasvadirghapluta iti || om om om iti triruktva caturthah shanta atmaplutapranavaprayogena
    samastamomiti prayukta atmajyotih sakridavartate sakriduccaritamatrah sa esha urdhvamannamayatityonkarah
    | pranansarvanpraliyata iti pralayah | pranansarvanparamatmani pranamayatityetasmatpranavah | caturthavasthita
    iti sarvadevavedayonih sarvavacyavastu pranavatmakam || 1|| devashceti samdhattam sarvebhyo duhkhabhayebhyah
    samtarayatiti taranattarah | sarve devah samvishantiti vishnuh | sarvani brihayatiti brahma | sarvebhyo'ntasthanebhyo
    dhyeyebhyah pradipavatprakashayatiti prakashah | prakashebhyah sadomityantah sharire vidyudvaddyotayati
    muhurmuhuriti vidyudvatpratiyaddisham disham bhittva sarvamllokanvyapnoti vyapayatiti vyapanadvyapi
    mahadevah || 2|| purvasya matra jagarti jagaritam dvitiya svapnam tritiya sushuptishcaturthi turiyam
    matra matrah pratimatragatah samyaksamastanapi padanjayatiti svayamprakashah svayam brahma bhavatityesha
    siddhikara etasmaddhyanadau prayujyate | sarva karanopasamharatvaddharyadharanadbrahma turiyam | sarvakaranani
    manasi sampratishthapya dhyanam vishnuh pranam manasi saha karanaih sampratishthapya dhyata rudrah
    pranam manasi sahakaranairnadante paramatmani sampratishthapya dhyayiteshanam pradhyayitavyam sarvamidam
    brahmavishnurudrendraste samprasuyante sarvani cendriyani saha bhutairna karanam karananam dhyata
    karanam tu dhyeyah sarvaishvaryasampannah shambhurakashamadhye dhruvam stabdhvadhikam kshanamekam
    kratushatasyapi catuhsaptatya yatphalam tadavapnoti kritsnamonkaragatim ca sarvadhyanayogajnananam
    yatphalamonkaro veda para isho va shiva eko dhyeyah shivamkarah sarvamanyatparityajya samastatharvashikhaitamadhitya
    dvijo garbhavasadvimukto vimucyata etamadhitya dvijo garbhavasadvimukto vimucyata ityo
  devanagari: सस्तनूभिर्व्यशेम देवहितं यदायुः । स्वस्ति न इन्द्रो वृद्धश्रवाः । स्वस्ति नः पूषा विश्ववेदाः
    । स्वस्ति नस्तार्क्ष्यो अरिष्टनेमिः । स्वस्ति नो बृहस्पतिर्दधातु ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ ॐ अथ
    हैनं पैप्पलादोऽङ्गिराः सनत्कुमारश्चाथर्वणमुवाच भगवन् किमादौ प्रयुक्तं ध्यानं ध्यायितव्यं किं तद्ध्यानं
    को वा ध्याता कश्च ध्येयः । स एभ्योथर्वा प्रत्युवाच । ओमित्येतदक्षरमादौ प्रयुक्तं ध्यानं ध्यायितव्यमित्येतदक्षरं
    परं ब्रह्मास्य पादाश्चत्वारो वेदाश्चतुष्पादिदमक्षरं परं ब्रह्म । पूर्वास्य मात्रा पृथिव्यकारः ऋग्भिरृग्वेदो
    ब्रह्मा वसवो गायत्री गार्हपत्यः । द्वितीयान्तरिक्षं स उकारः स यजुभिर्यजुर्वेदो विष्णुरुद्रास्त्रिष्टुब्दक्षिणाग्निः
    । तृतीयः द्यौः स मकारः स सामभिः सामवेदो रुद्रा आदित्या जगत्याहवनीयः । यावसानेऽस्य चतुर्थ्यर्धमात्रा
    सा सोमलोक ओङ्कारः साथर्वणमन्त्रैरथर्ववेदः संवर्तकोऽग्निर्मरुतो विराडेकर्षिर्भास्वती स्मृता । प्रथमा
    रक्तपीता महद्ब्रह्म दैवत्या । द्वितीया विद्युमती कृष्णा विष्णुदैवत्या । तृतीया शुभाशुभा शुक्ला रुद्रदैवत्या
    । यावासानेऽस्य चतुर्थ्यर्धमात्रा सा विद्युमती सर्ववर्णा पुरुषदैवत्या । स एष ह्योङ्कारश्चतुरक्षरश्चतुष्पादश्चतुःशिरश्चतुर्थमात्रः
    स्थूलमेतद्ह्रस्वदीर्घप्लुत इति ॥ ॐ ॐ ॐ इति त्रिरुक्त्वा चतुर्थः शान्त आत्माप्लुतप्रणवप्रयोगेण समस्तमोमिति
    प्रयुक्त आत्मज्योतिः सकृदावर्तते सकृदुच्चारितमात्रः स एष ऊर्ध्वमन्नमयतीत्योङ्कारः । प्राणान्सर्वान्प्रलीयत
    इति प्रलयः । प्राणान्सर्वान्परमात्मनि प्रणामयतीत्येतस्मात्प्रणवः । चतुर्थावस्थित इति सर्वदेववेदयोनिः
    सर्ववाच्यवस्तु प्रणवात्मकम् ॥ १॥ देवाश्चेति संधत्तां सर्वेभ्यो दुःखभयेभ्यः संतारयतीति तारणात्तारः
    । सर्वे देवाः संविशन्तीति विष्णुः । सर्वाणि बृहयतीति ब्रह्मा । सर्वेभ्योऽन्तस्थानेभ्यो ध्येयेभ्यः
    प्रदीपवत्प्रकाशयतीति प्रकाशः । प्रकाशेभ्यः सदोमित्यन्तः शरीरे विद्युद्वद्द्योतयति मुहुर्मुहुरिति विद्युद्वत्प्रतीयाद्दिशं
    दिशं भित्त्वा सर्वांल्लोकान्व्याप्नोति व्यापयतीति व्यापनाद्व्यापी महादेवः ॥ २॥ पूर्वास्य मात्रा जागर्ति
    जागरितं द्वितीया स्वप्नं तृतीया सुषुप्तिश्चतुर्थी तुरीयं मात्रा मात्राः प्रतिमात्रागताः सम्यक्समस्तानपि
    पादाञ्जयतीति स्वयंप्रकाशः स्वयं ब्रह्म भवतीत्येष सिद्धिकर एतस्माद्ध्यानादौ प्रयुज्यते । सर्व करणोपसंहारत्वाद्धार्यधारणाद्ब्रह्म
    तुरीयम् । सर्वकरणानि मनसि सम्प्रतिष्ठाप्य ध्यानं विष्णुः प्राणं मनसि सह करणैः सम्प्रतिष्ठाप्य ध्याता
    रुद्रः प्राणं मनसि सहकरणैर्नादान्ते परमात्मनि सम्प्रतिष्ठाप्य ध्यायीतेशानं प्रध्यायितव्यं सर्वमिदं
    ब्रह्मविष्णुरुद्रेन्द्रास्ते सम्प्रसूयन्ते सर्वाणि चेन्द्रियाणि सह भूतैर्न कारणं कारणानां ध्याता कारणं
    तु ध्येयः सर्वैश्वर्यसम्पन्नः शंभुराकाशमध्ये ध्रुवं स्तब्ध्वाधिकं क्षणमेकं क्रतुशतस्यापि चतुःसप्तत्या
    यत्फलं तदवाप्नोति कृत्स्नमोङ्कारगतिं च सर्वध्यानयोगज्ञानानां यत्फलमोङ्कारो वेद पर ईशो वा शिव एको ध्येयः
    शिवंकरः सर्वमन्यत्परित्यज्य समस्ताथर्वशिखैतामधीत्य द्विजो गर्भवासाद्विमुक्तो विमुच्यत एतामधीत्य द्विजो
    गर्भवासाद्विमुक्तो विमुच्यत इत्यो
