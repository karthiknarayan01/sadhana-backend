id: shadvarnamantrashtakam
category: mantra
name:
  english: shadvarnamantrashtakam
  devanagari: षड्वर्णमन्त्राष्टकम्
content:
  english: vande shadaksharisadashivanamamantram || 5|| pancaprasadamahitaksharabijamantram mantragraganyabhuvanastutamantrarajam
    | sarvo'pi mantrajanakapranavatmamantram vande shadaksharisadashivanamamantram || 6|| onkarabindusahitadhikashaktibijam
    pancaksharatritayavarnakamekavarnam | ekadashaksharasamanvitahamsamantram vande shadaksharisadashivanamamantram
    || 7|| shrisajjanatmabahirantaravitkatagra
  devanagari: वन्दे षडक्षरिसदाशिवनाममन्त्रम् ॥ ५॥ पञ्चप्रसादमहिताक्षरबीजमन्त्रं मन्त्राग्रगण्यभुवनस्तुतमन्त्रराजम्
    । सर्वोऽपि मन्त्रजनकप्रणवात्ममन्त्रं वन्दे षडक्षरिसदाशिवनाममन्त्रम् ॥ ६॥ ओङ्कारबिन्दुसहिताधिकशक्तिबीजं
    पञ्चाक्षरत्रितयवर्णकमेकवर्णम् । एकादशाक्षरसमन्वितहंसमन्त्रं वन्दे षडक्षरिसदाशिवनाममन्त्रम् ॥ ७॥ श्रीसज्जनात्मबहिरन्तरवित्कटाग्र
meaning: {}
