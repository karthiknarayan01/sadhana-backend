    | shuramayamratarubhid khanditasuramandalah || 109|| jayadurgatisantushto sarvadevastavankitah | hitah
    kolahalashcitro nanditashca vrishapatih || 110|| 540 nigamagryo mahaghorastranatho gavyamodini | sarveshah
    sugunashcando divyakaustubhasannibhah || 111|| candapracandah samaravijayi nirahankritih | sarvasvami
    candaharta shadvaktrashshambhavah sukhi || 112|| sangah sayujyadah sarah samah samrajyadayakah | siddhah
    shivashcidgunashca cinmayashcitsvarupakah || 113|| sha
  devanagari: दिवाकरः रणरङ्गरमाप्रोक्तजयश्रवणकौतुकः । अहङ्कृतमनोदूरो दैत्यतूलधनञ्जयख् ॥ २८॥ भक्तचित्तामृताम्बोधिः
    मौनानन्तसुखप्रदः । अनेकक्षेत्रनिलयो वाचिकामृतदायकः ॥ २९॥ पराद्रिस्थोऽर्णवक्षेत्रनिलयो देवपूजितः ।
    अनेकशैलनिलयो फलभूधरनायकः ॥ ३०॥ शिवाचलनिवासी च शिवक्षेत्राधिनायकः । मानसीकपुराधीशः श्रीशैलालयसंस्थितः
    ॥ ३१॥ मूलाधाराम्बुजगतो स्वाधिष्ठाननिकेतनः । मणीपूरकपद्मस्थ अनाहतसुमस्थितः ॥ ३२॥ विशुद्धिकमलारूढ आज्ञाचक्रान्तरस्थितः
    । परमाकाशरूपी च नादब्रह्ममयाकृतिः ॥ ३३॥ महाशक्तिर्महोनाथः सर्वलोकात्मविग्रहः । महावल्लीप्रियस्सर्वरूपी
    सर्वान्तरस्थितः ॥ ३४॥ शिवार्थः सर्वसञ्जीवी समस्तभुवनेश्वरः । सर्वसंरक्षकस्सर्वसंहारकरताण्डवः ॥ ३५॥
    चतुर्मुखशिरोदेशमुष्टिताडनविक्रमः । ब्रह्मोपदेष्टा ब्रह्मादिसुरलोकसुखप्रदः ॥ ३६॥ यज्ञदिव्यहविर्भोक्ता
    वरदस्सर्वपालकः । दीनसंरक्षकोऽव्याजकरुणापूरवारिधिः ॥ ३७॥ सर्वलक्षणसम्पन्नस्सच्चिदानन्दविग्रहः । ब्रह्मानन्दाब्धिशीतांशुः
    करुणापूर्णलोचनः ॥ ३८॥ एकाक्षरमयश्चैव एकाक्षरपरार्थदः । एकाक्षरपरञ्ज्योतिरेकान्तमतिबोधकः ॥ ३९॥ एकार्थदायकश्चैकपरश्चैकाम्रनायकः
    । एकान्तमौनफलदो वल्लीमोहनतत्परः ॥ ४०॥ १८० सप्तर्षिवन्दितपदो ब्रह्मातीतो मुनिस्तुतः । वल्लीदर्शनसन्तुष्टो
    भक्ताभीष्टवरप्रदः ॥ ४१॥ उमाशङ्करमध्यस्थो महावृषभसंस्थितः । सम्पूर्णस्सर्वलोकात्मा नीपमाल्यविभूषितः
    ॥ ४२॥ १९० कल्मषघ्नो गिरिशयः पापघ्नो दीनरक्षकः । सर्वाभरणभूषाङ्को वज्रशक्त्यादिधारकः ॥ ४३॥ पञ्चाक्षरस्थः
    पञ्चास्यः कण्ठीरवमुखान्तकः । पञ्चभूतात्मभृत्पञ्चभूतेशः शचिवन्दितः ॥ ४४॥ पञ्चवर्णः पञ्चबाणकरः पञ्चतरुप्रभुः
    । ऐङ्काररूपः क्लीङ्कारः सौःकारकरुणानिधिः ॥ ४५॥ अकारादिक्षकारान्तमयश्चैरावतार्चितः । ऐरावतगजारूढस्सर्वभक्तप्रियङ्करः
    ॥ ४६॥ ऐरावतात्मजावल्लीनायिकाप्राणवल्लभः । चतुष्षष्टिकलानाथो द्वात्रिंशल्लक्षणोज्ज्वलः ॥ ४७॥ मदनातीतसौन्दर्यः
    पाषण्डजनदूरगः । पञ्चेन्द्रियप्रेरकश्च पञ्चकृत्यादिदायकः ॥ ४८॥ २२० पञ्चकृत्येश्वरः पञ्चमूर्तये पञ्चामृतप्रियः
    । एकार्थश्चैव निर्नाशः प्रणवार्थद एव च ॥ ४९॥ सर्वज्योतिप्रकाशी च रहःकेलिकुतूहलः । दिव्यज्योतिर्वेदमयः
    वेदमूलोऽर्थसङ्ग्रहः ॥ ५०॥ एकानेकस्वरूपी च रव्यादिद्युतिदायकः । ऐरावताधिपसुतानयनानन्दसुन्दरः ॥ ५१॥
    चिदाकारः परञ्ज्योतिः लयोत्पत्तिविवर्जितः । सर्वशत्रुहरो मेषवरारूढो विनायकः ॥ ५२॥ एकातपत्रसाम्राज्यदायकः
    सुमुखानुजः । मृगीपरशुचापासिशक्त्याद्यायुधभृत्करः ॥ ५३॥ शरत्कालघनानीकमहोदारद्विषट्करः । श्रीवल्लीवामपार्श्वस्थो
    रव्यादिग्रहदोषभिद् ॥ ५४॥ पादकिङ्किणिकानाददैत्यविभ्रमदायकः । ओङ्कारज्योतिरोङ्कारवाचकातीतवैभवः ॥ ५५॥
    ओङ्कारचित्सभासंस्थ ओङ्काराद्भुतमन्दिरः । ओङ्कारमनुसन्दाता ओङ्कारगिरिसंस्थितः ॥ ५६॥ ओङ्कारनादश्रवण
    ओङ्कारातीतविग्रहः । ओङ्कारनादान्तगतः ओन्नित्यादिषडक्षरः ॥ ५७॥ ओङ्कारपीठकान्तस्थ ओङ्कारमुकुटाग्रगः
    । ओङ्कारमूलसम्भूत ओङ्काराद्यन्तमध्यगः ॥ ५८॥ ओङ्कारमूलबीजार्थ ओङ्कारपरशक्तिमान् । ओङ्कारबिन्दुरोङ्कारचित्त
    ओङ्कारचित्पुरः ॥ ५९॥ २७० ओङ्कारफलसत्सार ओङ्कारज्ञानकोविदः । ओङ्कारसच्चिदानन्द ओङ्कारपरमात्मकः ॥ ६०॥
    ओङ्कारसम्भूतसप्तकोटिमन्त्राधिनायकः । ओङ्कारप्रणवाकार अकारादिकलात्मकः ॥ ६१॥ २८० षडक्षरो द्वादशार्णः
    प्रणवाग्रार्णसंयुतः । महेशस्तुतिसन्तुष्टो शिवशक्त्यक्षरान्वितः ॥ ६२॥ पराक्षरकलोपेतो शिवबीजकलाश्रयः
    । औङ्कारनादकरुण औदासीनजनान्तकः ॥ ६३॥ औदुम्बराश्वत्थनीपबिल्वादिसमिदाहुतः । दुष्टक्रुद्धमनोदूरो शिष्टसङ्घसमाश्रितः
    ॥ ६४॥ अकाराद्यक्षरप्राण अकारद्यक्षरार्थकः । उदारसद्गुणोपेतो भक्तैश्वर्यप्रदायकः ॥ ६५॥ अकारादिक्षकारान्तकलाकल्पितविग्रहः
    । श्रीकुम्भसम्भवादीनां सर्वज्ञानोपदेशकृत् ॥ ६६॥ षडर्णमन्त्रस्मरणभक्ताभीष्टप्रदायकः । स्कन्दमूर्तिश्च
    गाङ्गेयो कलिकल्मषनाशनः ॥ ६७॥ भक्तसन्निहितोऽक्षोभ्यो शङ्खपाणिमुखस्तुतः । ओंश्रींह्रींसौंशरवणभवः शङ्करानन्द
    एव च ॥ ६८॥ शतलक्षेन्दुसङ्काशः शान्तः शशिधरात्मजः । शत्रुनाशकरश्शम्भुः शचीपतिवरप्रदः ॥ ६९॥ शक्तिमान्
    शक्तिहस्तश्च शान्तसर्वप्रकाशकः । शरभः शङ्खचक्रादिधरः शङ्करबोधकः ॥ ७०॥ कृत्तिकातनयः कृष्णो शङ्खपद्मनिधिप्रदः
    । शक्तिवज्रादिसम्पन्नद्विषट्करसरोरुहः ॥ ७१॥ शङ्कुकर्णमहाकर्णघण्टाकर्णादिवन्दितः । मूलादिद्वादशान्तस्थपद्ममध्यनिकेतनः
    ॥ ७२॥ सद्गुणः शङ्करः साक्षी सदानन्दः सदाशिवः । ज्ञानेश्वरः सृष्टिकर्ता सर्ववश्यप्रदायकः ॥ ७३॥ विचित्रवेषः
    समरविजयायुधधारकः । क्रौञ्चासुररिपुः शङ्खपतिः सर्वगणेश्वरः ॥ ७४॥ णकारतुर्यमन्त्रार्णो णकारार्णस्वरूपकः
    । णकारमूलमन्त्राग्रो णकाररवसंस्थितः ॥ ७५॥ णकारशिखरारूढो णकाराक्षरमध्यगः । णद्वितीयो णत्रितीयः णचतुर्थो
    णपञ्चमः ॥ ७६॥ णषष्ठवर्णो णार्णादिमन्त्रषड्भेदभासुरः । णकारपीठनिलयो नलिनोद्भवशिक्षकः ॥ ७७॥ नादान्तकूटस्थश्चैव
    नारदप्रिय एव च । नागाशनरथारूढो नान्दात्मा नागभूषणः ॥ ७८॥ नागाचलपतिर्नागो नवतत्त्वो नटप्रियः । नवग्रहादिदोषघ्नो
    णकारस्तम्भनिष्क्रियः ॥ ७९॥ णकाराक्षो णकारेशः णकारवृषवाहनः । तत्त्वबोद्धा दैवमणिः धनधान्यादिदायकः ॥
    ८०॥ वल्लीपतिः शुद्धान्तरस्तत्त्वातीतो हरिप्रियः । तत्परः कमलारूढो षडाननसरोरुहः ॥ ८१॥ भगवान् भयहन्ता
    च भर्गो भयविमोचकः । भानुकोपादिदैत्यघ्नो भद्रो भागीरथीसुतः ॥ ८२॥ भवाचलमहावज्रो भवारण्यदवानलः । भवतापसुधावृष्टिर्भवरोगमहौषधः
    ॥ ८३॥ भानुचन्द्राग्निनयनो भावनातीतविग्रहः । भक्तचित्ताम्बुजारूढो भरतोक्तक्रियाप्रियः ॥ ८४॥ भक्तदेवो
    भयार्तिघ्नो भकारोच्चाटनक्रियः । भारतीशमुकुन्दादिवाङ्मनोऽतीतवैभवः ॥ ८५॥ विचित्रपक्षाश्वारूढो भुजङ्गेशो
    दयानिधिः । ईशफालाक्षिसम्भूतो वीरः षट्समयाधिपः ॥ ८६॥ महाव्रतो महादेवो भूतेशः शिववल्लभः । महामायी यज्ञभोक्ता
    मन्त्रस्थो यक्षराट्प्रियः ॥ ८७॥ सर्वश्रेष्ठो महामृत्युरूपासुरविनाशकः । रागाब्जमालिकाभूषो रागी रागाम्बरप्रियः
    ॥ ८८॥ रागद्वेषादिदोषघ्नो रागरत्नविभूषणः । रावणस्तुतिसन्तुष्टो रतीनायकवन्दितः ॥ ८९॥ रम्भादिनाट्यसुप्रीतो
    राजीवदललोचनः । रवचापधरो रक्षोवृन्दतूलहुताशनः ॥ ९०॥ रविचन्द्रादिसम्पूज्यो रथारोहकुतूहलः । रवकाञ्चीवरधरो
    रवयुक्ताङ्घ्रिभूषणः ॥ ९१॥ रव्युद्भवसमानेकहारकेयूरभूषितः । रविकोटिसमानाभो रत्नहाटकदायकः ॥ ९२॥ शिखीन्द्रश्चोरगाकारः
    निशादिनविवर्जितः । रमावाण्यादिसम्पूज्यो लक्षवीरभटस्तुतः ॥ ९३॥ वीरभूतगणस्तुत्यो श्रीरामश्चारुणो रविः
    । वरदो वज्रहस्तश्च वामदेवादिवन्दितः ॥ ९४॥ वलारितनयानाथो वरदाभयसत्करः । वल्लीश्वरीपतिर्वाग्मी वल्लीकल्याणसुन्दरः
    ॥ ९५॥ वलारिमुख्यविबुधवृन्ददुःखविमोचकः । वातरोगहरो वर्मरहितो वासवेश्वरः ॥ ९६॥ वाचकस्थो वासुदेववन्दितो
    वकुलप्रियः । वासनाङ्कितताम्बूलपूरिताननपङ्कजः ॥ ९७॥ वचनागमनातीतो वामाङ्गो वन्दिमोहनः । वल्लीमनोहरः
    साधुः देवेन्द्रप्राणदायकः ॥ ९८॥ दिगन्तवल्लभानन्तमदनोज्ज्वलरूपभृत् । सौन्दर्यार्णवपीयूषस्सर्वावयवसुन्दरः
    ॥ ९९॥ शिशुः कृपालुः कादम्बधरः कौबेरनायकः । धर्माधारस्सर्वधर्मस्वरूपो धर्मरक्षकः ॥ १००॥ सर्वधर्मेश्वरो
    बन्धुस्तीक्ष्णोऽनन्तकलान्वितः । अनन्तवेदसंवेद्यः स्वामी कनकसुप्रभः ॥ १०१॥ सर्वसाक्षी सर्वकलाश्रवणः
    करुणालयः । वासवस्सर्वकर्ता च कामः कपिलसंस्तुतः ॥ १०२॥ कामदः कालसंहर्ता कालः कामारिसम्भवः । कामायुधः
    कामधरो श्रीकृष्णः शिखिवाहनः ॥ १०३॥ ४९० कृपानिधिः कृपासिन्धुः गिरिराट् कृत्तिकाप्रियः । कीर्तिप्रदः
    कीर्तिधरो गीतनाट्यादिकप्रियः ॥ १०४॥ नर्क्कीरस्तोत्रसन्तुष्टस्तीर्थेशः कुलविद्गुहः । कौमारस्सर्वगुप्तश्च
    क्रौञ्चासुरविमर्दनः ॥ १०५॥ इन्द्रपुण्यः कुलोत्तुङ्ग अतितीक्ष्णायुधो नटः । कूटस्थः श्रीकरः कूटेशान्तकान्तकसम्भवः
    ॥ १०६॥ वल्लीभाषणसुप्रीतो गम्भीरो भक्तनायकः । सर्वदेवालयान्तस्थो निश्शोको निरुपद्रवः ॥ १०७॥ ५२० केदारो
    मदनाधीशो लयघ्नः श्रवणान्वितः । पद्महस्तो देवनुतः भक्तार्थो द्वादशायुधः ॥ १०८॥ कैवल्यो रजताद्रीशो महाराट्
    गोकर्णाधिपः । शूरमायाम्रतरुभिद् खण्डितासुरमण्डलः ॥ १०९॥ जयदुर्गातिसन्तुष्टो सर्वदेवस्तवाङ्कितः । हितः
    कोलाहलश्चित्रो नन्दितश्च वृषापतिः ॥ ११०॥ ५४० निगमाग्र्यो महाघोरास्त्रनाथो गव्यमोदिनि । सर्वेशः सुगुणश्चण्डो
    दिव्यकौस्तुभसन्निभः ॥ १११॥ चण्डप्रचण्डः समरविजयी निरहङ्कृतिः । सर्वस्वामी चण्डहर्ता षड्वक्त्रश्शाम्भवः
    सुखी ॥ ११२॥ साङ्गः सायुज्यदः सारः सामः साम्राज्यदायकः । सिद्धः शिवश्चिद्गुणश्च चिन्मयश्चित्स्वरूपकः
    ॥ ११३॥ श
