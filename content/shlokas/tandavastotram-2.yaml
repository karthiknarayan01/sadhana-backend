id: tandavastotram-2
category: stotram
name:
  english: tandavastotram 2
  devanagari: ताण्डवस्तोत्रम् २
content:
  english: shritandavastotram 2 citram vatatarormule vriddhah shishya gururyuva | gurostu maunam vyakhyanam
    shishyastu cchinnasamshayah || 1|| padapracurakinkinikinikinidhvanibhrajitam haripramukhadevatadritalasanmridangadikam
    | dhidhindhimitadhaitadhaitadharavanusarikramam sada timiti mangalam dishatu shambhavam tandavam ||
    2|| dhindhimidhimidhimishabdairbandhurapadamandaram natantam | jhanjhanajhanajhanaravaranjitamanimandanam
    shivam seve || 3|| takkatodhikkatotatathataitathai tongadadmangadhinnattashabdanmuhuh | uccaran hasavinyasacancanmukhah
    sannanarta svayam shribhavanipatih || 4|| tapasamstapasanantara devata devata devatashcantara tapasah
    | evamadritya vagishvaradisthitau
  devanagari: श्रीताण्डवस्तोत्रम् २ चित्रं वटतरोर्मूले वृद्धाः शिष्या गुरुर्युवा । गुरोस्तु मौनं व्याख्यानं
    शिष्यास्तु च्छिन्नसंशयाः ॥ १॥ पदप्रचुरकिङ्किणीकिणिकिणिध्वनिभ्राजितं हरिप्रमुखदेवतादृतलसन्मृदङ्गादिकम्
    । धिधिन्धिमितधैतधैतधरवानुसारिक्रमं सदा तिमिति मङ्गलं दिशतु शाम्भवं ताण्डवम् ॥ २॥ धिन्धिमिधिमिधिमिशब्दैर्बन्धुरपदमन्दरं
    नटन्तम् । झञ्झणझणझणरावारञ्जितमणिमण्डनं शिवं सेवे ॥ ३॥ तक्कतोधिक्कतोतातथातैतथै तोङ्गदद्माङ्गधिन्नत्तशब्दान्मुहुः
    । उच्चरन् हासविन्यासचञ्चन्मुखः सन्ननर्त स्वयं श्रीभवानीपतिः ॥ ४॥ तापसांस्तापसानन्तरा देवता देवता देवताश्चान्तरा
    तापसाः । एवमादृत्य वागीश्वरादिस्थितौ
