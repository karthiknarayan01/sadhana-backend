id: minakshistrotram
category: stotram
name:
  english: minakshistrotram
  devanagari: मीनाक्षीस्त्रोत्रम्
content:
  english: udyadbhanusahasrakòtisadrisham kèyuraharòjjvalam bimbòshthim smitadantapamktiruciram pitambaralankritam|
    vishnubrahmasurèndrasèvitapadam tattvasvarupam shivam minakshim pranato'smi samtatamaham karunyavarannidhim||1||
    muktaharalasatkiritaruciram purnènduvaktraprabham shinjannupurakinkinimanidharam padmaprabhabhasuram|
    sarvabhishtaphalapradam girisutam vaniramasèvitam minakshim pranatò'smi samtatamaham karunyavarannidhim||2||
    shrividyam shivavamabhaganilayam hrikaramantròjjvalam shricakrankita bindumadhyavasatim shrimatsabhanayakim|
    shrimatshanmukhavishnurajajananim shrimajjaganmòhinim minakshim pranatò'smi samtatamaham karunyavarannidhim||3||
    shrimatsundaranayakim bhayaharam jnanapradam nirmalam shyamabham kamalasanarcitapadam narayanasyanujam|
    vinavènumridangavadyarasikam nanavidhadambikam minakshim pranato'smi samtatamaham karunyavarannidhim||4||
    nanayògimunindrahrinnivasatim nanarthasiddhapradam nanapushpavirajitanghriyugalam narayanènarcitam|
    nadabrahmamayim paratparataram nanarthatattvatmikam minakshim pranatò'smi samtatamaham karunyavarannidhim||5||
  devanagari: उद्यद्भानुसहस्रकॊटिसदृशां कॆयूरहारॊज्ज्वलां बिम्बॊष्ठीं स्मितदन्तपंक्तिरुचिरां पीताम्बरालङ्कृताम्।
    विष्णुब्रह्मसुरॆन्द्रसॆवितपदां तत्त्वस्वरूपां शिवां मीनाक्षीं प्रणतोऽस्मि संततमहं कारुण्यवारान्निधिम्॥१॥
    मुक्ताहारलसत्किरीटरुचिरां पूर्णॆन्दुवक्त्रप्रभां शिञ्जन्नूपुरकिङ्किणीमणिधरां पद्मप्रभाभासुराम्। सर्वाभीष्टफलप्रदां
    गिरिसुतां वाणीरमासॆवितां मीनाक्षीं प्रणतॊऽस्मि संततमहं कारुण्यवारान्निधिम्॥२॥ श्रीविद्यां शिववामभागनिलयां
    ह्रीकारमन्त्रॊज्ज्वलां श्रीचक्राङ्कित बिन्दुमध्यवसतिं श्रीमत्सभानायकीम्। श्रीमत्षण्मुखविष्णुराजजननीं
    श्रीमज्जगन्मॊहिनीं मीनाक्षीं प्रणतॊऽस्मि संततमहं कारुण्यवारान्निधिम्॥३॥ श्रीमत्सुन्दरनायकीं भयहरां
    ज्ञानप्रदां निर्मलां श्यामाभां कमलासनार्चितपदां नारायणस्यानुजाम्। वीणावॆणुमृदङ्गवाद्यरसिकां नानाविधाडम्बिकां
    मीनाक्षीं प्रणतोऽस्मि संततमहं कारुण्यवारान्निधिम्॥४॥ नानायॊगिमुनीन्द्रहृन्निवसतिं नानार्थसिद्धप्रदां
    नानापुष्पविराजिताङ्घ्रियुगलां नारायणॆनार्चिताम्। नादब्रह्ममयीं परात्परतरां नानार्थतत्त्वात्मिकां मीनाक्षीं
    प्रणतॊऽस्मि संततमहं कारुण्यवारान्निधिम्॥५॥
