id: gajendramokshanah-vamanapurana
category: stotram
name:
  english: gajendramokshanah vamanapurana
  devanagari: गजेन्द्रमोक्षणः वामनपुराण
content:
  english: om namo mulaprakritaye ajitaya mahatmane | anashritaya devaya nihsprihaya namo'stu te || 31||
    nama adyaya bijaya arsheyaya pravartine | antaraya caikaya avyaktaya namo namah || 32|| namo guhyaya
    gudhaya gunaya gunavartine | apratarkyaprameyaya atulaya namo namah || 33|| namah shivaya shantaya
    nishcintaya yashasvine | sanatanaya purvaya puranaya namo namah || 34|| namo devadhidevaya svabhavaya
    namo namah | namo jagatpratishthaya govindaya namo namah || 35|| namo'stu padmanabhaya namo yogodbhavaya
    ca | vishveshvaraya devaya shivaya haraye namah || 36|| namo'stu tasmai devaya nirgunaya gunatmane
    | narayanaya vishvaya devanam paramatmane || 37|| namo namah karanavamanaya narayanayamitavikramaya
    | shrisharngacakrasigadadharaya namo'stu tasmai purushottamaya || 38|| guhyaya vedanilayaya mahodaraya
    simhaya daityanidhanaya caturbhujaya | brahmendrarudramunicaranasamstutaya devottamaya varadaya namo'cyutaya
    || 39|| nagendradehashayanasanasupriyaya gokshirahemashukanilaghanopamaya | pitambaraya madhukaitabhanashanaya
    vishvaya carumukutaya namo'jaraya || 40|| nabhiprajatakramalasthacaturmakhaya shrirodakarnavaniketayashodharaya
    | nanavicitramukutangadabhushanaya sarveshvaraya varadaya namo varaya || 41|| bhaktipriyaya varadiptasudarshanaya
    phullaravindavipulayatalocanaya | devendravighnashamanodyatapaurushaya yogeshvaraya virajaya namo
    varaya || 42|| brahmayanaya tridashayanaya lokadhinathaya bhavapanaya | narayanayatmahitayanaya mahavarahaya
    namaskaromi || 43|| kutasthamavyaktamacintyarupam narayanam karanamadidevam | yugantashesham purusham
    puranam tam devadevam sharanam prapadye || 44|| yogeshvaram caruvicitramolimajneyamagryam prakriteh
    parastham | kshetrajnamatmaprabhavam varenyam tam vasudevam sharanam prapadye || 45|| adrishyamavyaktamacintyamavyayam
    maharshayo brahmamayam sanatanam | vadanti yam vai purusham sanatanam tam devaguhyam sharanam prapadye
    || 46|| yadaksharam brahma vadanti sarvagam nishamya yam mrityumukhat pramucyate | tamishvaram triptamanuttamairgunaih
    parayanam vishnumupaimi shashvatam || 47|| karyam kriya karanamaprameyam hiranyabahum varapadmanabham
    | mahabalam vedanidhim suresham vrajami vishnum sharanam janardanam || 48|| kiritakeyuramaharhanishkairmanyuttamalankritasarvagatram
    | pitambaram kancanabhakticitram maladharam keshavamabhyupaimi || 49|| bhavodbhavam vedavidam varishtham
    yogatmanam sankhyavidam varishtham | adityarudrashvivasuprabhavam prabhum prapadye'cyutamatmavantam
    || 50|| shrivatsankam mahadevam devaguhyamanaupamam | prapadye sukshmamacalam varenyamabhayapradam
    || 51|| prabhavam sarvabhutanam nirgunam parameshvaram | prapadye muktasanganam yatinam paramam gatim
    || 52|| bhagavantam gunadhyakshamaksharam pushkarekshanam | sharanyam sharanam bhaktya prapadye bhaktavatsalam
    || 53|| trivikramam trilokesham sarvesham prapitamaham | yogatmanam mahatmanam prapadye'ham janardanam
    || 54|| adidevamajam shambhum vyaktavyaktam sanatanam | narayanamaniyamsam prapadye brahmanapriyam
    || 55|| namo varaya devaya namah sarvasahaya ca | prapadye devadeveshamaniyamsamanoh sada || 56||
    ekaya lokatatvaya paratah paramatmane | namah sahasrashirase anantaya mahatmane || 57|| tvameva paramam
    devamrishayo vedaparagah | kirtayanti ca yam sarve brahmadinam parayanam || 58|| namaste pundarikaksha
    bhaktanamabhayapradah subrahmanya namaste'stu trahi mam sharanagatam || 59|| pulastya uvaca | bhaktim
    tasyanusancintya nagasyamoghasambhavah | pritimanabhavad vishnuh shankhacakragadadharah || 60|| sannidhyam
    kalpayamasa tasmin sarasi keshavah | garudastho jagatsvami lokadharastapodhanah || 61|| grahagrastam
    gajendram tam tam ca graham jalashayat | ujjaharaprameyatma tarasa madhusudanah || 62|| sthalastham
    darayamasa graham cakrena madhavah | mokshayamasa nagendram pashebhyah sharanagatam || 63|| sa hi
    devalashapena huhurgandharvasattamah | grahatvamagamat krishnad vadham prapya divam gatah || 64||
    gajo'pi vishnuna sprishto jato divyavapuh puman | apadviktau yugapad gajagandharvasattamau || 65||
    pritiman pundarikakshah sharanagatavatsalah | abhavat tvatha deveshastabhyam caiva prapujitah || 66||
    idam ca bhagavan yogi gajendram sharanagatam | provaca munishardula madhuram madhusudanah || 67||
    shribhagavanuvaca | yo mam tvanca sarashcaiva grahasya ca vidaranam | gulmakicakarenunam rupam meroh
    sutasya ca || 68|| ashvattham bhaskaram gangam naimisharanyameva ca | samsmarishyanti manujah prayatah
    sthirabuddhayah || 69|| kirtayishyanti bhaktya ca shroshyanti ca shucivratah | duhsvapno nashyate
    tesham susvapnashca bhavishyati || 70|| matsyam kaurmanca varaham vamanam tarkshyameva ca | narasimham
    ca nagendram srishtipralayakarakam || 71|| etani pratarutthaya samsmarishyanti ye narah | sarvapapaih
    pramucyante punyam lokamavapnuyuh || 72|| pulastya uvaca | evamuktva hrishikesho gajendram garudadhvajah
    | sparshayamasa hastena gajam gandharvameva ca || 73|| tato divyavapurbhutva gajendro madhusudanam
    | jagama sharanam vipra narayanaparayanah || 74|| tato narayanah shriman mokshayitva gajottamam |
    papabandhacca shapacca graham cadbhutakarmakrit || 75|| rishibhih stuyamanashca devaguhyaparayanaih
    | gatah sa bhagavan vishnurdurvijneyagatih prabhuh || 76|| gajendramokshanam drishtva devah shakrapurogamah
    | vavandire mahatmanam prabhum narayanam harim || 77|| maharshayashcaranashca drishtva gajavimokshanam
    | vismayotphullanayanah samstuvanti janardanam || 78|| prajapatipatirbrahma cakrapaniviceshtitam |
    gajendramokshanam drishtva idam vacanamabravit || 79|| ya idam sha
  devanagari: ॐ नमो मूलप्रकृतये अजिताय महात्मने । अनाश्रिताय देवाय निःस्पृहाय नमोऽस्तु ते ॥ ३१॥ नम आद्याय
    बीजाय आर्षेयाय प्रवर्तिने । अन्तराय चैकाय अव्यक्ताय नमो नमः ॥ ३२॥ नमो गुह्याय गूढाय गुणाय गुणवर्तिने
    । अप्रतर्क्याप्रमेयाय अतुलाय नमो नमः ॥ ३३॥ नमः शिवाय शान्ताय निश्चिन्ताय यशस्विने । सनातनाय पूर्वाय
    पुराणाय नमो नमः ॥ ३४॥ नमो देवाधिदेवाय स्वभावाय नमो नमः । नमो जगत्प्रतिष्ठाय गोविन्दाय नमो नमः ॥ ३५॥
    नमोऽस्तु पद्मनाभाय नमो योगोद्भवाय च । विश्वेश्वराय देवाय शिवाय हरये नमः ॥ ३६॥ नमोऽस्तु तस्मै देवाय
    निर्गुणाय गुणात्मने । नारायणाय विश्वाय देवानां परमात्मने ॥ ३७॥ नमो नमः कारणवामनाय नारायणायामितविक्रमाय
    । श्रीशार्ङ्गचक्रासिगदाधराय नमोऽस्तु तस्मै पुरुषोत्तमाय ॥ ३८॥ गुह्याय वेदनिलयाय महोदराय सिंहाय दैत्यनिधनाय
    चतुर्भुजाय । ब्रह्मेन्द्ररुद्रमुनिचारणसंस्तुताय देवोत्तमाय वरदाय नमोऽच्युताय ॥ ३९॥ नागेन्द्रदेहशयनासनसुप्रियाय
    गोक्षीरहेमशुकनीलघनोपमाय । पीताम्बराय मधुकैटभनाशनाय विश्वाय चारुमुकुटाय नमोऽजराय ॥ ४०॥ नाभिप्रजातक्रमलस्थचतुर्मखाय
    श्रीरोदकार्णवनिकेतयशोधराय । नानाविचित्रमुकुटाङ्गदभूषणाय सर्वेश्वराय वरदाय नमो वराय ॥ ४१॥ भक्तिप्रियाय
    वरदीप्तसुदर्शनाय फुल्लारविन्दविपुलायतलोचनाय । देवेन्द्रविघ्नशमनोद्यतपौरुषाय योगेश्वराय विरजाय नमो
    वराय ॥ ४२॥ ब्रह्मायनाय त्रिदशायनाय लोकाधिनाथाय भवापनाय । नारायणायात्महितायनाय महावराहाय नमस्करोमि
    ॥ ४३॥ कूटस्थमव्यक्तमचिन्त्यरूपं नारायणं कारणमादिदेवम् । युगान्तशेषं पुरुषं पुराणं तं देवदेवं शरणं
    प्रपद्ये ॥ ४४॥ योगेश्वरं चारुविचित्रमोलिमज्ञेयमग्र्यं प्रकृतेः परस्थम् । क्षेत्रज्ञमात्मप्रभवं वरेण्यं
    तं वासुदेवं शरणं प्रपद्ये ॥ ४५॥ अदृश्यमव्यक्तमचिन्त्यमव्ययं महर्षयो ब्रह्ममयं सनातनम् । वदन्ति यं
    वै पुरुषं सनातनं तं देवगुह्यं शरणं प्रपद्ये ॥ ४६॥ यदक्षरं ब्रह्म वदन्ति सर्वगं निशम्य यं मृत्युमुखात्
    प्रमुच्यते । तमीश्वरं तृप्तमनुत्तमैर्गुणैः परायणं विष्णुमुपैमि शाश्वतम् ॥ ४७॥ कार्यं क्रिया कारणमप्रमेयं
    हिरण्यबाहुं वरपद्मनाभम् । महाबलं वेदनिधिं सुरेशं व्रजामि विष्णुं शरणं जनार्दनम् ॥ ४८॥ किरीटकेयूरमहार्हनिष्कैर्मण्युत्तमालङ्कृतसर्वगात्रम्
    । पीताम्बरं काञ्चनभक्तिचित्रं मालाधरं केशवमभ्युपैमि ॥ ४९॥ भवोद्भवं वेदविदां वरिष्ठं योगात्मनां साङ्ख्यविदां
    वरिष्ठम् । आदित्यरुद्राश्विवसुप्रभावं प्रभुं प्रपद्येऽच्युतमात्मवन्तम् ॥ ५०॥ श्रीवत्साङ्कं महादेवं
    देवगुह्यमनौपमम् । प्रपद्ये सूक्ष्ममचलं वरेण्यमभयप्रदम् ॥ ५१॥ प्रभवं सर्वभूतानां निर्गुणं परमेश्वरम्
    । प्रपद्ये मुक्तसङ्गानां यतीनां परमां गतिम् ॥ ५२॥ भगवन्तं गुणाध्यक्षमक्षरं पुष्करेक्षणम् । शरण्यं
    शरणं भक्त्या प्रपद्ये भक्तवत्सलम् ॥ ५३॥ त्रिविक्रमं त्रिलोकेशं सर्वेषां प्रपितामहम् । योगात्मानं महात्मानं
    प्रपद्येऽहं जनार्दनम् ॥ ५४॥ आदिदेवमजं शम्भुं व्यक्ताव्यक्तं सनातनम् । नारायणमणीयांसं प्रपद्ये ब्राह्मणप्रियम्
    ॥ ५५॥ नमो वराय देवाय नमः सर्वसहाय च । प्रपद्ये देवदेवेशमणीयांसमणोः सदा ॥ ५६॥ एकाय लोकतत्वाय परतः परमात्मने
    । नमः सहस्रशिरसे अनन्ताय महात्मने ॥ ५७॥ त्वामेव परमं देवमृषयो वेदपारगाः । कीर्तयन्ति च यं सर्वे ब्रह्मादीनां
    परायणम् ॥ ५८॥ नमस्ते पुण्डरीकाक्ष भक्तानामभयप्रदः सुब्रह्मण्य नमस्तेऽस्तु त्राहि मां शरणागतम् ॥ ५९॥
    पुलस्त्य उवाच । भक्तिं तस्यानुसञ्चिन्त्य नागस्यामोघसम्भवः । प्रीतिमानभवद् विष्णुः शङ्खचक्रगदाधरः ॥
    ६०॥ सान्निध्यं कल्पयामास तस्मिन् सरसि केशवः । गरुडस्थो जगत्स्वामी लोकाधारस्तपोधनः ॥ ६१॥ ग्राहग्रस्तं
    गजेन्द्रं तं तं च ग्राहं जलाशयात् । उज्जहाराप्रमेयात्मा तरसा मधुसूदनः ॥ ६२॥ स्थलस्थं दारयामास ग्राहं
    चक्रेण माधवः । मोक्षयामास नागेन्द्रं पाशेभ्यः शरणागतम् ॥ ६३॥ स हि देवलशापेन हूहूर्गन्धर्वसत्तमः ।
    ग्राहत्वमगमत् कृष्णाद् वधं प्राप्य दिवं गतः ॥ ६४॥ गजोऽपि विष्णुना स्पृष्टो जातो दिव्यवपुः पुमान् ।
    आपद्विक्तौ युगपद् गजगन्धर्वसत्तमौ ॥ ६५॥ प्रीतिमान् पुण्डरीकाक्षः शरणागतवत्सलः । अभवत् त्वथ देवेशस्ताभ्यां
    चैव प्रपूजितः ॥ ६६॥ इदं च भगवान् योगी गजेन्द्रं शरणागतम् । प्रोवाच मुनिशार्दूल मधुरं मधुसूदनः ॥ ६७॥
    श्रीभगवानुवाच । यो मां त्वाञ्च सरश्चैव ग्राहस्य च विदारणम् । गुल्मकीचकरेणूनां रूपं मेरोः सुतस्य च
    ॥ ६८॥ अश्वत्थं भास्करं गङ्गं नैमिषारण्यमेव च । संस्मरिष्यन्ति मनुजाः प्रयताः स्थिरबुद्धयः ॥ ६९॥ कीर्तयिष्यन्ति
    भक्त्या च श्रोष्यन्ति च शुचिव्रतः । दुःस्वप्नो नश्यते तेषां सुस्वप्नश्च भविष्यति ॥ ७०॥ मात्स्यं कौर्मञ्च
    वाराहं वामनं तार्क्ष्यमेव च । नारसिंहं च नागेन्द्रं सृष्टिप्रलयकारकम् ॥ ७१॥ एतानि प्रातरुत्थाय संस्मरिष्यन्ति
    ये नराः । सर्वपापैः प्रमुच्यन्ते पुण्यं लोकमवाप्नुयुः ॥ ७२॥ पुलस्त्य उवाच । एवमुक्त्वा हृषीकेशो गजेन्द्रं
    गरुडध्वजः । स्पर्शयामास हस्तेन गजं गन्धर्वमेव च ॥ ७३॥ ततो दिव्यवपुर्भूत्वा गजेन्द्रो मधुसूदनम् । जगाम
    शरणं विप्र नारायणपरायणः ॥ ७४॥ ततो नारायणः श्रीमान् मोक्षयित्वा गजोत्तमम् । पापबन्धाच्च शापाच्च ग्राहं
    चाद्भुतकर्मकृत् ॥ ७५॥ ऋषिभिः स्तूयमानश्च देवगुह्यपरायणैः । गतः स भगवान् विष्णुर्दुर्विज्ञेयगतिः प्रभुः
    ॥ ७६॥ गजेन्द्रमोक्षणं दृष्ट्वा देवाः शक्रपुरोगमाः । ववन्दिरे महात्मानं प्रभुं नारायणं हरिम् ॥ ७७॥
    महर्षयश्चारणाश्च दृष्ट्वा गजविमोक्षणम् । विस्मयोत्फुल्लनयनाः संस्तुवन्ति जनार्दनम् ॥ ७८॥ प्रजापतिपतिर्ब्रह्मा
    चक्रपाणिविचेष्टितम् । गजेन्द्रमोक्षणं दृष्ट्वा इदं वचनमब्रवीत् ॥ ७९॥ य इदं श
