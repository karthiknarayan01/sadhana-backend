id: kalanjarakshetrebhimeshvaramahatmya
category: raksha
name:
  english: kalanjarakshetrebhimeshvaramahatmya
  devanagari: कालन्जरक्षेत्रेभीमेश्वरमाहात्म्य
content:
  english: shambho tvam marutam pita trijagatamaradhya isho hara te somo namasatibhikshmahi vibho rudra
    kshayadvairinam | shambho somamimam piba tvamadhuna gauro yatha tarshitah tvattrishtya jagadetadadya
    bhagavan indradibhistripyate || 7|| indrasyatma paramastvam maheshah yajnasyatma dakshina te'dya patni
    | sahaiva tva santam na vidanti devah sarvatma tvam sarvagatashca nityah || 8|| ittham bhimeshvaram
    stutva vishnurnatva punarhi mam | apacata varam mattastvatsamipe vasamyaham || 9|| surasurairaham
    yuddhe shranto'smi parameshvara | tvaya saha vasamyadya bhimarathyastu dakshine || 10|| kunikumbhat
    praticyam hi snatva kalanjare harih | prabhate sa sada devi mallingam shirasa dadhat || 11|| iti stutva
    tada devi gacchetyabhihito maya | tatravasat sa mallingam dadhanmurdhna haristada || 12|| uvasa dakshine
    tire bhimarathyastadambike | tat pandurangakshetram hi vishnoh priyakaram sada || 13|| devi
  devanagari: शम्भो त्वं मरुतां पिता त्रिजगतामाराध्य ईशो हर ते सोमो नमसातिभिक्ष्महि विभो रुद्र क्षयद्वैरिणम्
    । शम्भो सोममिमं पिब त्वमधुना गौरो यथा तर्षितः त्वत्तृष्त्या जगदेतदद्य भगवन् इन्द्रादिभिस्तृप्यते ॥
    ७॥ इन्द्रस्यात्मा परमस्त्वं महेशः यज्ञस्यात्मा दक्षिणा तेऽद्य पत्नी । सहैव त्वा सन्तं न विदन्ति देवाः
    सर्वात्मा त्वं सर्वगतश्च नित्यः ॥ ८॥ इत्थं भीमेश्वरं स्तुत्वा विष्णुर्नत्वा पुनर्हि माम् । अपाचत वरं
    मत्तस्त्वत्समीपे वसाम्यहम् ॥ ९॥ सुरासुरैरहं युद्धे श्रान्तोऽस्मि परमेश्वर । त्वया सह वसाम्यद्य भीमरथ्यास्तु
    दक्षिणे ॥ १०॥ कुणिकुम्भात् प्रतीच्यां हि स्नात्वा कालञ्जरे हरिः । प्रभाते स सदा देवि मल्लिङ्गं शिरसा
    दधत् ॥ ११॥ इति स्तुत्वा तदा देवि गच्छेत्यभिहितो मया । तत्रावसत् स मल्लिङ्गं दधन्मूर्ध्ना हरिस्तदा
    ॥ १२॥ उवास दक्षिणे तीरे भीमरथ्यास्तदाम्बिके । तत् पाण्डुरङ्गक्षेत्रं हि विष्णोः प्रियकरं सदा ॥ १३॥
    देवी
