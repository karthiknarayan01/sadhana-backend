id: yogashantiganesha
category: stotram
name:
  english: yogashantiganesha
  devanagari: योगशान्तिगणेश
content:
  english: yogashantijnanapradam ganeshastotram shriganeshaya namah | sanakadya ucuh | dhanyo'si nripashardula
    buddhiste paramadbhuta | nirvedam rajabhogebhyah sampraptah prithulashravah || 1|| yogashantimayam
    purnam ganesham viddhi bhumipa | tam bhajasva mahabhaktya taya shantim gamishyasi || 2|| ekada sma
    vayam sarve sangatah shankaralayam | vatamule samasinam pashyamo dhyanasamsthitam || 3|| tam pranamya
    sthitah sarve vayam vinayasamsthitah | stotraistam bodhayantashca bubodha vai shivastatah || 4|| tyaktva
    dhyanam ganeshaya namo vadatamadarat | shrutva bhranta vayam tasmai pricchamah samshayanvitah || 5||
    ko'sau ganadhipah svaminnamasi tvam katham prabho | shivah sahajarupastvam svadhinah satatam matah
    || 6|| asmakam vacanam shrutva shivo harpasamanvitah | jagada jnanamadyam yadganapatyam sa shantidam
    || 7|| shrishiva uvaca | brahma yatkathyate vedaih katham tatra pravartate | svadhinam sahajam vipraparadhinam
    tridhabhavam || 8|| karmayogadibhedena vedeshu vedavadibhih | nanavidham varnitam yad brahma tanmayayanvitam
    || 9|| karmanam sakalanam samyogo brahmani jayate | tena karmatmakam brahma tadajnanadhikam matam
    || 10|| samuhatmakashabdashca gana ityabhidhiyate | bahyantaradhibhedenasamyoge samuho matah || 11||
    annapranadikah shabda brahmano vacaka matah | te sarve ganarupashca tesham svami ganeshvara || 12||
    samyoga'yogakadya ye nana yoga mata budhaih | yoganam yogarupo'yam ganesho natra samshayah || 13||
    gano yogatmakah proktastasamattasya gana vayam | yogarupam visheshena namamo bhaktisamyutah || 14||
    maya vighnatmika prokta bhrantida bimbabhavatah | tam jayanti jana isha vighnarajasya sevaya || 15||
    bhavanti te brahmabhuta yogindra ganapah smritah | aham ganesharupo vai bhinnam mayamayam matam ||
    16|| cittam pancavidham proktam sa buddhirvividhatmika | tatraishcaryam ca yatproktam siddhidah sa
    paramadbhuta || 17|| tatra yad bimbabhavena ganeshah pratitishthati | mayabhyam mohito'tyantam sarvatrasau
    virajate || 18|| bimbabhavam parityajaya ganeshasyaiva sevaya | pancadha cittamutsrijya svayam cintamanirbhavet
    || 19|| ganesho'ham yada viprastada kutra pravartate | samyogo me tatha yogah shantiyogam labhettatah
    || 20|| na bhinno'ham kada tasmadganeshannatra samshayah | yogindrah shantiyogena brahmabhuto bhavishyati
    || 21|| etadeva madiyam yadguhyam dhyanam prakirtitam | ato ganeshadaso'ham tam namami sada dvijah
    || 22|| evamuktva mahayogi virarama sa shankarah | ucchinnasamshaya jatah sanakadya vayam nripa ||
    23|| vicaramo mahimetam svargeshu vivareshu | yogamargena yogisha ganapatyasvabhavatah || 24|| ganeshadarshane
    jata lalasa vayamadarat | tasminkale ganadhishah kashyapasyatmajo'bhavat || 25|| kashirajo mahabhakto
    ganapatyaparayanah | tasya grihe gato devah svakiyacaryasadhanat || 26|| darshanartham vayam tatra
    gatah kashyam mahamate | darshayamo ganesham sma brahmacarisvarupinam || 27|| tam pranamya vayam rajan
    sthita bhaktya samanvitah | balarupadharam devam stumah sma balayuthagam || 28|| sanakadya ucuh |
    namo vinayakayaiva kashyapapriyasunave | aditerjatharotpanna brahmacarinnamo'stu te || 29|| ganeshaya
    sada mayadharaya tadvivarjita | bhaktydhinaya vai tubhyam herambaya namo namah || 30|| tad brahma
    shashvatam deva brahmanam patiranjasa | yoyayogadibhedena kridase natra samshayah || 31|| adimadhyantarupastvam
    prakritih purushastatha | nadanandau ca sukshastvam sthularupo bhavan prabho || 32|| surasuramayah
    sakshannaranagasvarupadhrik | jalasthaladibhedena shobhase tvam gajanana || 33|| sarvebhyo varjitastvam
    vai mayahinah svarupadhrik | mayamayikarupashca ko janati gatim param || 34|| katham stumo ganadhisham
    yogakaramayam sada | deva na shambhumukhyashca shaktah stotum kadacana || 35|| vayam dhanya vayam
    dhanya yena pratyakshatam gatah | asmakam yoginam dhundhe kuladevastvamanjasa || 36|| ityuktva maunamasthaya
    nanama dandavacca tam | uvaca no ganadhisho bhaktibhavaniyantritah || 37|| vinayaka uvaca | bhavadbhiryatkritam
    stotram madiyam yogashantidam | bhavishyati mahabhagah pathatah sha
  devanagari: योगशान्तिज्ञानप्रदं गणेशस्तोत्रम् श्रीगणेशाय नमः । सनकाद्या ऊचुः । धन्योऽसि नृपशार्दूल बुद्धिस्ते
    परमाद्भुता । निर्वेदं राजभोगेभ्यः सम्प्राप्तः पृथुलश्रवाः ॥ १॥ योगशन्तिमयं पूर्णं गणेशं विद्धि भूमिप
    । तं भजस्व महाभक्त्या तया शान्तिं गमिष्यसि ॥ २॥ एकदा स्म वयं सर्वे सङ्गताः शङ्करालयम् । वटमूले समासीनं
    पश्यामो ध्यानसंस्थितम् ॥ ३॥ तम् प्रणम्य स्थिताः सर्वे वयं विनयसंस्थिताः । स्तोत्रैस्तं बोधयन्तश्च
    बुबोध वै शिवस्ततः ॥ ४॥ त्यक्त्वा ध्यानं गणेशाय नमो वदतमादरात् । श्रुत्वा भ्रान्ता वयं तस्मै पृच्छामः
    संशयान्विताः ॥ ५॥ कोऽसौ गणाधिपः स्वामिन्नमसि त्वं कथं प्रभो । शिवः सहजरूपस्त्वं स्वाधीनः सततं मतः
    ॥ ६॥ अस्माकं वचनं श्रुत्वा शिवो हर्पसमन्वितः । जगाद ज्ञानमाद्यं यद्गाणपत्यं स शान्तिदम् ॥ ७॥ श्रीशिव
    उवाच । ब्रह्म यत्कथ्यते वेदैः कथं तत्र प्रवर्तते । स्वाधीनं सहजं विप्रापराधीनं त्रिधाभवम् ॥ ८॥ कर्मयोगादिभेदेन
    वेदेषु वेदवादिभिः । नानाविधं वर्णितं यद् ब्रह्म तन्माययान्वितम् ॥ ९॥ कर्मणां सकलानां संयोगो ब्रह्मणि
    जायते । तेन कर्मात्मकं ब्रह्म तदज्ञानाधिकं मतम् ॥ १०॥ समूहात्मकशब्दश्च गण इत्यभिधीयते । बाह्यान्तराधिभेदेनासंयोगे
    समूहो मतः ॥ ११॥ अन्नप्राणादिकाः शब्दा ब्रह्मणो वाचका मताः । ते सर्वे गणरूपाश्च तेषां स्वामी गणेश्वर
    ॥ १२॥ संयोगाऽयोगकाद्या ये नाना योगा मता बुधैः । योगानां योगरूपोऽयं गणेशो नात्र संशयः ॥ १३॥ गणो योगात्मकः
    प्रोक्तस्तसमात्तस्य गणा वयम् । योगरूपं विशेषेण नमामो भक्तिसंयुताः ॥ १४॥ माया विघ्नात्मिका प्रोक्ता
    भ्रान्तिदा बिम्बभावतः । तां जयन्ति जना ईशा विघ्नराजस्य सेवया ॥ १५॥ भवन्ति ते ब्रह्मभूता योगीन्द्रा
    गाणपाः स्मृताः । अहं गणेशरूपो वै भिन्नं मायामयं मतम् ॥ १६॥ चित्तं पञ्चविधं प्रोक्तं सा बुद्धिर्विविधात्मिका
    । तत्रैश्चर्यं च यत्प्रोक्तं सिद्धिदः सा परमाद्भुता ॥ १७॥ तत्र यद् बिम्बभावेन गणेशः प्रतितिष्ठति ।
    मायाभ्यां मोहितोऽत्यन्तं सर्वत्रासौ विराजते ॥ १८॥ बिम्बभावं परित्यजय गणेशस्यैव सेवया । पञ्चधा चित्तमुत्सृज्य
    स्वयं चिन्तामणिर्भवेत् ॥ १९॥ गणेशोऽहं यदा विप्रास्तदा कुत्र प्रवर्तते । संयोगो मे तथा योगः शान्तियोगं
    लभेत्ततः ॥ २०॥ न भिन्नोऽहं कदा तस्माद्गणेशान्नात्र संशयः । योगीन्द्रः शान्तियोगेन ब्रह्मभूतो भविष्यति
    ॥ २१॥ एतदेव मदीयं यद्गुह्यं ध्यानं प्रकीर्तितम् । अतो गणेशदासोऽहं तं नमामि सदा द्विजाः ॥ २२॥ एवमुक्त्वा
    महायोगी वीरराम स शङ्करः । उच्छिन्नसंशया जाताः सनकाद्या वयं नृप ॥ २३॥ विचरामो महीमेताम् स्वर्गेषु विवरेषु
    । योगमार्गेण योगीशा गाणपत्यस्वभावतः ॥ २४॥ गणेशदर्शने जाता लालसा वयमादरात् । तस्मिन्काले गणाधीशः कश्यपस्यात्मजोऽभवत्
    ॥ २५॥ काशीराजो महाभक्तो गाणपत्यपरायणः । तस्य गृहे गतो देवः स्वकीयाचार्यसाधनात् ॥ २६॥ दर्शनार्थं वयं
    तत्र गताः काश्यां महामते । दर्शयामो गणेशं स्म ब्रह्मचारिस्वरूपिणम् ॥ २७॥ तम् प्रणम्य वयं राजन् स्थिता
    भक्त्या समन्विताः । बालरूपधरं देवं स्तुमः स्म बालयूथगम् ॥ २८॥ सनकाद्या ऊचुः । नमो विनायकायैव कश्यपप्रियसूनवे
    । अदितेर्जठरोत्पन्न ब्रह्मचारिन्नमोऽस्तु ते ॥ २९॥ गणेशाय सदा मायाधाराय तद्विवर्जित । भक्त्य्धीनाय
    वै तुभ्यं हेरम्बाय नमो नमः ॥ ३०॥ तद् ब्रह्म शाश्वतं देव ब्रह्मणां पतिरञ्जसा । योयायोगादिभेदेन क्रीडसे
    नात्र संशयः ॥ ३१॥ आदिमध्यान्तरूपस्त्वं प्रकृतिः पुरुषस्तथा । नादानन्दौ च सूक्षस्त्वं स्थूलरूपो भवान्
    प्रभो ॥ ३२॥ सुरासुरमयः साक्षान्नरनागस्वरूपधृक् । जलस्थलादिभेदेन शोभसे त्वं गजानन ॥ ३३॥ सर्वेभ्यो वर्जितस्त्वं
    वै मायाहीनः स्वरूपधृक् । मायामायिकरूपश्च को जानाति गतिं पराम् ॥ ३४॥ कथं स्तुमो गणाधीशं योगाकारमयं
    सदा । देवा न शंभुमुख्याश्च शक्ताः स्तोतुं कदाचन ॥ ३५॥ वयं धन्या वयं धन्या येन प्रत्यक्षतां गतः । अस्माकं
    योगिनां ढुण्ढे कुलदेवस्त्वमञ्जसा ॥ ३६॥ इत्युक्त्वा मौनमास्थाय ननाम दण्डवच्च तम् । उवाच नो गणाधीशो
    भक्तिभावनियन्त्रितः ॥ ३७॥ विनायक उवाच । भवद्भिर्यत्कृतं स्तोत्रं मदीयं योगशान्तिदम् । भविष्यति महाभागाः
    पठतः श
