id: balamahamalamantrastavah
category: mantra
name:
  english: balamahamalamantrastavah
  devanagari: बालामहामालामन्त्रस्तवः
content:
  english: maholokajanolokatapolokasatyalokabhuvanaikaviramatre | samudyadadityasahasrabhe | somasuryagnilocanatrayarajite
    | candrakalavatamse | raktambaradharini | pustakakshamalavarabhayakaravibhushite | kanakavajravaiduryamuktalankarabhushite
    | aim aim sauh klim klim aim sauh sauh klim navaksharatmake | navakonapuravase | navavarshavayovishishtangi
    | balatripure | brahmyadyashtamatrikaparisevite | animadyashtaishvaryaprade | balambike | ehyehi agacchagaccha
    | mama sharire praveshaya praveshaya | mama sakalakaryani sadhaya sadhaya | durgatim mocaya mocaya
    | shriyam prapaya | prapaya | am aim hrim klim krom sauh am hrim krom aim klim sauh | aim aim namo
    balavagishvari | aim aim karpuradhavalakaraprabhe | aim aim vrajamauktikamuktalankarabhushite | aim
    aim muktakshamalapustakavarabhayakara vibhushite | aim aim shubhrambaradharini | om hrim hsraim hrim
    om aim dhim klim sauh mahasarasvatyatmake | aim aim mahasarasvataprade | aim aim vedavedanganyayamimamsapuranadharmashastratmake
    | mama nikhilabhashasu anavadyagadyapadyaracanacaturyam dapaya dapaya | vividhatarkavigahitasamastashastrasagaragariyahpratibham
    prapaya prapaya | aim aim vada vada vagvadini | aim aim gangatarangakallolavakpatutvaprade mama sakalabhashasu
    mridumadhurarasabhavabhasuravagjalam dehi dehi | am aim hrim klim krom sauh am hrim krom aim klim
    sauh | klim klim namo bhagavati bala kameshvari | icchakamaphalaprade | klim klim raktagandhanulepane
    | klim klim bandhukakusumakarakantibhushana bhushite | klim klim raktalankarabhushite | klim klim
    raktamalyambaradharini | klim klim ikshukodandapushpeshupashankushakarabhushite | klim klim sarvasattvavashankari
    | klim klim sarvalokakarshini | klim klim sakalakamaprapurani | klim klim asadhyasadhini | mama drishtadrishtanam
    sarvesham stripurushanam jananam gatimati
  devanagari: महोलोकजनोलोकतपोलोकसत्यलोकभुवनैकवीरमात्रे । समुद्यदादित्यसहस्राभे । सोमसूर्याग्निलोचनत्रयराजिते
    । चन्द्रकलावतंसे । रक्ताम्बरधारिणि । पुस्तकाक्षमालावराभयकरविभूषिते । कनकवज्रवैडूर्यमुक्तालङ्कारभूषिते
    । ऐं ऐं सौः क्लीं क्लीं ऐं सौः सौः क्लीं नवाक्षरात्मके । नवकोणपुरावासे । नववर्षवयोविशिष्टाङ्गि । बालात्रिपुरे
    । ब्राह्म्याद्यष्टमातृकापरिसेविते । अणिमाद्यष्टैश्वर्यप्रदे । बालाम्बिके । एह्येहि आगच्छागच्छ । मम
    शरीरे प्रवेशय प्रवेशय । मम सकलकार्याणि साधय साधय । दुर्गतिं मोचय मोचय । श्रियं प्रापय । प्रापय । आं
    ऐं ह्रीं क्लीं क्रों सौः आं ह्रीं क्रों ऐं क्लीं सौः । ऐं ऐं नमो बलावागीश्वरि । ऐं ऐं कर्पूरधवलाकारप्रभे
    । ऐं ऐं व्रजमौक्तिकमुक्तालङ्कारभूषिते । ऐं ऐं मुक्ताक्षमालापुस्तकवराभयकर विभूषिते । ऐं ऐं शुभ्राम्बरधारिणि
    । ओं ह्रीं ह्स्रैं ह्रीं ओं ऐं धीं क्लीं सौः महासरस्वत्यात्मके । ऐं ऐं महासारस्वतप्रदे । ऐं ऐं वेदवेदाङ्गन्यायमीमांसापुराणधर्मशास्त्रात्मके
    । मम निखिलभाषासु अनवद्यगद्यपद्यरचनाचातुर्यं दापय दापय । विविधतर्कविगाहितसमस्तशास्त्रसागरगरीयःप्रतिभां
    प्रापय प्रापय । ऐं ऐं वद वद वाग्वादिनि । ऐं ऐं गङ्गातरङ्गकल्लोलवाक्पटुत्वप्रदे मम सकलभाषासु मृदुमधुररसभावभासुरवाग्जालं
    देहि देहि । आं ऐं ह्रीं क्लीं क्रों सौः आं ह्रीं क्रों ऐं क्लीं सौः । क्लीं क्लीं नमो भगवति बाला कामेश्वरि
    । इच्छाकामफलप्रदे । क्लीं क्लीं रक्तगन्धानुलेपने । क्लीं क्लीं बन्धूककुसुमाकारकान्तिभूषण भूषिते ।
    क्लीं क्लीं रक्तालङ्कारभूषिते । क्लीं क्लीं रक्तमाल्याम्बरधारिणि । क्लीं क्लीं इक्षुकोदण्डपुष्पेषुपाशाङ्कुशकरभूषिते
    । क्लीं क्लीं सर्वसत्त्ववशङ्करि । क्लीं क्लीं सर्वलोकाकर्षिणि । क्लीं क्लीं सकलकामप्रपूरणि । क्लीं
    क्लीं असाध्यसाधिनि । मम दृष्टादृष्टानां सर्वेषां स्त्रीपुरुषाणां जनानां गतिमति
