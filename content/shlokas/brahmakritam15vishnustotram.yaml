id: brahmakritam15vishnustotram
category: stotram
name:
  english: brahmakritam15vishnustotram
  devanagari: ब्रह्मकृतं१५विष्णुस्तोत्रम्
content:
  english: brahmakritam 15 vishnustotram brahmankatham tvaya samsmarito'ham dvapure yuge || 20|| brahmovaca
    | tada devam sarvagam bhishajam varam | namaskaromi devesha vande yugalapankajam || 21|| namo hyanusvarupaya
    dvyanukaya namo namah | tryanukaya namashcaturanukaya namo namah || 22|| namah pancanurupaya rajorupaya
    te namah | namo dhulisvarupaya namaste kankaratmane || 23|| namo gravasvarupaya namaste pindanamine
    | namah pindadhyabijaya namo'vyaktankuratmane || 24|| namah patrasvarupaya namah kandadirupine | namah
    shakhaprashakhaya namah stambadihetave || 25|| namo nalaya pushpaya namo rasaphalatmane | namah kanasvarupaya
    namah pishtarasatmane || 26|| namo'pakajarupaya pakvarupaya te namah | namo bhakshyabhojyalehyacoshyarupaya
    te namah || 27|| namo mishrasvarupaya nama oshadhirupine | namah kvathadirupaya namashcurnadirupine
    || 28|| namo recakamatraya namo bhasmadivedine | nama ayuhpradatre te nama oshadhishaktaye || 29||
    namaste parameshana kshemakushalakirtaye | bhoktre bhogyapradanaya sarvantaryamine namah || 30|| devadeva
    shariranam dhata tvam poshako'vita | yuge'sminkalpanasiddhirlayam prayati dehinam || 31|| iti shrilakshminarayaniyasamhitayam
    prathame kritayugasantane 78
  devanagari: ब्रह्मकृतं १५ विष्णुस्तोत्रम् ब्रह्मन्कथं त्वया संस्मारितोऽहं द्वापुरे युगे ॥ २०॥ ब्रह्मोवाच
    । तदा देवं सर्वगं भिषजां वरम् । नमस्करोमि देवेश वन्दे युगलपङ्कजम् ॥ २१॥ नमो ह्यणुस्वरूपाय द्व्यणुकाय
    नमो नमः । त्र्यणुकाय नमश्चतुरणुकाय नमो नमः ॥ २२॥ नमः पञ्चाणुरूपाय रजोरूपाय ते नमः । नमो धूलीस्वरूपाय
    नमस्ते कङ्करात्मने ॥ २३॥ नमो ग्रावस्वरूपाय नमस्ते पिण्डनामिने । नमः पिण्डाढ्यबीजाय नमोऽव्यक्ताङ्कुरात्मने
    ॥ २४॥ नमः पत्रस्वरूपाय नमः काण्डादिरूपिणे । नमः शाखप्रशाखाय नमः स्तम्बादिहेतवे ॥ २५॥ नमो नालाय पुष्पाय
    नमो रसफलात्मने । नमः कणस्वरूपाय नमः पिष्टरसात्मने ॥ २६॥ नमोऽपाकजरूपाय पक्वरूपाय ते नमः । नमो भक्ष्यभोज्यलेह्यचोष्यरूपाय
    ते नमः ॥ २७॥ नमो मिश्रस्वरूपाय नम ओषधिरूपिणे । नमः क्वाथादिरूपाय नमश्चूर्णादिरूपिणे ॥ २८॥ नमो रेचकमात्राय
    नमो भस्मादिवेदिने । नम आयुःप्रदात्रे ते नम ओषधिशक्तये ॥ २९॥ नमस्ते परमेशान क्षेमकुशलकीर्तये । भोक्त्रे
    भोग्यप्रदानाय सर्वान्तर्यामिणे नमः ॥ ३०॥ देवदेव शरीराणां धाता त्वं पोषकोऽविता । युगेऽस्मिन्कल्पनासिद्धिर्लयं
    प्रयाति देहिनाम् ॥ ३१॥ इति श्रीलक्ष्मीनारायणीयसंहितायां प्रथमे कृतयुगसन्ताने ७८
