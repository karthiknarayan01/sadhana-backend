id: renukasahasranamastotra
category: stotram
name:
  english: renukasahasranamastotra
  devanagari: रेणुकासहस्रनामस्तोत्र
content:
  english: ringivadanasurasa gunjaharavibhushana | mayurapicchabharana shyama nilambara shiva || 31||
    kalika renuduhita shivapujya priyamvada | srishtikrit sthitikritkruddha prithvi naradasevita || 32||
    samharakarinindrakshi rakshoghni candrashekhara | hum phat vaushat vashadrupa svadha svaha namo manuh
    || 33|| sushuptirjagratirnidra svapna turya ca cakrini | tara mandodari sita'halya'rundhatikaditih
    || 34|| bhagirathi ca kaveri gautami narmada mahi | sarayurgautami bhima triveni gandaki sari || 35||
    manasam candrabhaga ca reva ganga ca vedika | haridvaram matripuram dattatreyanivasabhuh || 36|| matristhadisamsthana
    matrimandalamandita | matrimandalasampujya matrimandalamadhyaga || 37|| nanasthanavataradya nanasthanacaritrakrit
    | kamala tulaja''treyi kohlapuranivasini || 38|| mandakini bhogavati dattatreyanusuyaka | shatcakradevata
    pinga jamadagnishvararddhahrit || 39|| idakhya ca sushumnakhya candrasuryagatirviyat | candrasuryasamakhyata
    sarvastrinilayadhvanih || 40|| samastavidyatattvajna sarvarupa sukhashraya | punyapapeshvari kirtirbhoktri
    bhogapravartini || 41|| jamadagnyasya janani kavishaktih kavitvada | hrinkaramba tamorupa klinkara
    kamadayini || 42|| vakpradainkararupa ca muktidaunkararupini | shrinkarakhiladanotka sarvabija''tmikatmabhuh
    || 43|| jamadagni shivankastha dharmarthakamamokshada | jamadagnikrodhahara jamadagnivacahkari ||
    44|| jamadagnitamohantri jamadagnisukhaikabhuh | jitavira viramata virabhurvirasevita || 45|| viradikshakari
    shauryadikshita sarvamangala | katyayani parivara kalakala kalanidhih || 46|| ashtasiddhiprada krura
    kruragrahavinashini | sakara ca nirakarahankarakarana kritih || 47|| sammata vishamaghni ca vishahantri
    vishashana | vyalabharanasamhrishta vyalamandanamandita || 48|| anurupa paranushca sadrupa ca kahapara
    | hrasva hrasvapara dirgha paradirgha paratpara || 49|| advayadvayarupa ca prapancarahita prithuh
    | sthulasukshma niriha ca snehanjanavivarjita || 50|| brahmasuta mahanidra yoganidra haristuta | hiranyagarbharupa
    ca parabrahmasvarupini || 51|| brahmashaktirbrahmavidya vishvabija niranjana | atula karmarupa ca
    shyamala parighayudha || 52|| narayani vishnushaktih avanmanasagocara | ghritamari punyakari punyashaktiramambika
    || 53|| raktabijavadhodrikta raktacandanacarcita | suraktapushpabharana raktadamshtrabhayaprada ||
    54|| tikshnaraktanakharakta nishumbhapranakrintini | shumbhaprananihantri ca mahamrityuvinashini ||
    55|| sarvadevamahashaktirmahalakshmi surastuta | ashtadashabhuja jyamsha dashadordandamandita || 56||
    nishkalashtabhuja dhatri kalpatita manohara | kalpanarahitarcyadya daridryavanadahini || 57|| kaustubha
    parijata ca hahadirupadharini | tilottamapsarorupa navanagasvarupini || 58|| nidhirupa samadhistha
    khadgarupa shavasthita | mahishasuradattamghrih simhaga simhagamini || 59|| trishuladharini praudha
    bala mugdha sudharmini | shankhabhriccakrabhritpasha gadabhritpashamandita || 60|| kalashaktih kripasindhurmrigarivaravahana
    | ganarajamahashaktih shivashaktih shivastuta || 61|| haripriya shraddhadevi pradhana guharupini |
    guhaprita ganetprita kamaprita guhasthita || 62|| sarvarthadayini raudri nilagatiralolupa | camunda
    citraghanta ca vishvayonirnirantara || 63|| shravani shramahantri ca samsarabhramanashini | samsaraphalasampanna
    samsaramatiruccaga || 64|| uccasanasamarudha vimanavaragamini | vimanastha vimanaghni pashaghni kalanashini
    || 65|| kalacakrabhramabhranta kalacakrapravartini | cetana capini bhavya bhavyabhavyavinashini ||
    66|| simhasanasukhavishta kshirasagarakanyaka | vanikkanya kshemakari mukuteshavanisthita || 67||
    shrutijna ca puranajna smritijna vedavadini | vedavedarthatattvajna hingula kalashalini || 68|| itihasarthaviddharmya
    dhyeya hantri shishupriya | stanyada stanyadhara ca vanastha parvatishiva || 69|| mena mainakabhagini
    surabhirjalamuktadit | sarvabijantarasthatri sakalagamadevata || 70|| sthalasthala jalastha ca vanastha
    vanadevata | kshayahantri nihantri ca niratankamarapriya || 71||
  devanagari: ृङ्गीवादनसुरसा गुञ्जाहारविभूषणा । मयूरपिच्छाभरणा श्यामा नीलाम्बरा शिवा ॥ ३१॥ कालिका रेणुदुहिता
    शिवपूज्या प्रियंवदा । सृष्टिकृत् स्थितिकृत्क्रुद्धा पृथ्वी नारदसेविता ॥ ३२॥ संहारकारिणीन्द्राक्षी
    रक्षोघ्नी चन्द्रशेखरा । हुं फट् वौषट् वषड्रूपा स्वधा स्वाहा नमो मनुः ॥ ३३॥ सुषुप्तिर्जाग्रतिर्निद्रा
    स्वप्ना तुर्या च चक्रिणी । तारा मन्दोदरी सीताऽहल्याऽरुन्धतिकादितिः ॥ ३४॥ भगीरथी च कावेरी गौतमी नर्मदा
    मही । सरयूर्गौतमी भीमा त्रिवेणी गण्डकी सरी ॥ ३५॥ मानसं चन्द्रभागा च रेवा गङ्गा च वेदिका । हरिद्वारं
    मातृपुरं दत्तात्रेयनिवासभूः ॥ ३६॥ मातृस्थादिसंस्थाना मातृमण्डलमण्डिता । मातृमण्डलसम्पूज्या मातृमण्डलमध्यगा
    ॥ ३७॥ नानास्थानावताराद्या नानास्थानचरित्रकृत् । कमला तुलजाऽऽत्रेयी कोह्लापुरनिवासिनी ॥ ३८॥ मन्दाकिनी
    भोगवती दत्तात्रेयानुसूयका । षट्चक्रदेवता पिङ्गा जमदग्नीश्वरार्द्धहृत् ॥ ३९॥ इडाख्या च सुषुम्नाख्या
    चन्द्रसूर्यगतिर्वियत् । चन्द्रसूर्यसमाख्याता सर्वस्त्रीनिलयाध्वनिः ॥ ४०॥ समस्तविद्यातत्त्वज्ञा सर्वरूपा
    सुखाश्रया । पुण्यपापेश्वरी कीर्तिर्भोक्त्री भोगप्रवर्तिनी ॥ ४१॥ जमदग्न्यस्य जननी कविशक्तिः कवित्वदा
    । ह्रीङ्काराम्बा तमोरूपा क्लीङ्कारा कामदायिनी ॥ ४२॥ वाक्प्रदैङ्काररूपा च मुक्तिदौङ्काररूपिणी । श्रीङ्काराखिलदानोत्का
    सर्वबीजाऽऽत्मिकात्मभूः ॥ ४३॥ जमदग्नि शिवाङ्कस्था धर्मार्थकाममोक्षदा । जमदग्निक्रोधहरा जमदग्निवचःकरी
    ॥ ४४॥ जमदग्नितमोहन्त्री जमदग्निसुखैकभूः । जितवीरा वीरमता वीरभूर्वीरसेविता ॥ ४५॥ वीरदीक्षाकरी शौर्यदीक्षिता
    सर्वमङ्गला । कात्यायनी परीवारा कालकाला कलानिधिः ॥ ४६॥ अष्टसिद्धिप्रदा क्रूरा क्रूरग्रहविनाशिनी । साकारा
    च निराकाराहङ्काराकारणा कृतिः ॥ ४७॥ सम्मता विषमघ्नी च विषहन्त्री विषाशना । व्यालाभरणसंहृष्टा व्यालमण्डनमण्डिता
    ॥ ४८॥ अणुरूपा पराणुश्च सद्रूपा च कहापरा । ह्रस्वा ह्रस्वपरा दीर्घा परदीर्घा परात्परा ॥ ४९॥ अद्वयाद्वयरूपा
    च प्रपञ्चरहिता पृथुः । स्थूलसूक्ष्मा निरीहा च स्नेहाञ्जनविवर्जिता ॥ ५०॥ ब्रह्मसूता महानिद्रा योगनिद्रा
    हरिस्तुता । हिरण्यगर्भरूपा च परब्रह्मस्वरूपिणी ॥ ५१॥ ब्रह्मशक्तिर्ब्रह्मविद्या विश्वबीजा निरञ्जना
    । अतुला कर्मरूपा च श्यामला परिघायुधा ॥ ५२॥ नारायणी विष्णुशक्तिः अवाङ्मनसगोचरा । घृतमारी पुण्यकरी पुण्यशक्तिरमाम्बिका
    ॥ ५३॥ रक्तबीजवधोद्रिक्ता रक्तचन्दनचर्चिता । सुरक्तपुष्पाभरणा रक्तदंष्ट्राभयप्रदा ॥ ५४॥ तीक्ष्णरक्तनखारक्ता
    निशुम्भप्राणकृन्तिनी । शुम्भप्राणनिहन्त्री च महामृत्युविनाशिनी ॥ ५५॥ सर्वदेवमहाशक्तिर्महालक्ष्मी सुरस्तुता
    । अष्टादशभुजा ज्यांशा दशदोर्दण्डमण्डिता ॥ ५६॥ निष्कलाष्टभुजा धात्री कल्पातीता मनोहरा । कल्पनारहितार्च्याद्या
    दारिद्र्यवनदाहिनी ॥ ५७॥ कौस्तुभा पारिजाता च हाहादिरूपधारिणी । तिलोत्तमाप्सरोरूपा नवनागस्वरूपिणी ॥
    ५८॥ निधिरूपा समाधिस्था खड्गरूपा शवस्थिता । महिषासुरदत्तांघ्रिः सिंहगा सिंहगामिनी ॥ ५९॥ त्रिशूलधारिणी
    प्रौढा बाला मुग्धा सुधर्मिणी । शङ्खभृच्चक्रभृत्पाशा गदाभृत्पाशमण्डिता ॥ ६०॥ कालशक्तिः कृपासिन्धुर्मृगारिवरवाहना
    । गणराजमहाशक्तिः शिवशक्तिः शिवस्तुता ॥ ६१॥ हरिप्रिया श्राद्धदेवी प्रधाना गुहरूपिणी । गुहप्रीता गणेट्प्रीता
    कामप्रीता गुहस्थिता ॥ ६२॥ सर्वार्थदायिनी रौद्री नीलागतिरलोलुपा । चामुण्डा चित्रघण्टा च विश्वयोनिर्निरन्तरा
    ॥ ६३॥ श्रावणी श्रमहन्त्री च संसारभ्रमनाशिनी । संसारफलसम्पन्ना संसारमतिरुच्चगा ॥ ६४॥ उच्चासनसमारूढा
    विमानवरगामिनी । विमानस्था विमानघ्नी पाशघ्नी कालनाशिनी ॥ ६५॥ कालचक्रभ्रमभ्रान्ता कालचक्रप्रवर्तिनी
    । चेतना चापिनी भव्या भव्याभव्यविनाशिनी ॥ ६६॥ सिंहासनसुखाविष्टा क्षीरसागरकन्यका । वणिक्कन्या क्षेमकरी
    मुकुटेशावनिस्थिता ॥ ६७॥ श्रुतिज्ञा च पुराणज्ञा स्मृतिज्ञा वेदवादिनी । वेदवेदार्थतत्त्वज्ञा हिङ्गुला
    कालशालिनी ॥ ६८॥ इतिहासार्थविद्धर्म्या ध्येया हन्त्री शिशुप्रिया । स्तन्यदा स्तन्यधारा च वनस्था पार्वतीशिवा
    ॥ ६९॥ मेना मैनाकभगिनी सुरभिर्जलमुक्तडित् । सर्वबीजान्तरस्थात्री सकलागमदेवता ॥ ७०॥ स्थलस्थला जलस्था
    च वनस्था वनदेवता । क्षयहन्त्री निहन्त्री च निरातङ्कामरप्रिया ॥ ७१॥
