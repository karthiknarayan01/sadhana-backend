id: saumyakashishastotram-2
category: upanishad
name:
  english: saumyakashishastotram
  devanagari: सौम्यकाशीशस्तोत्रम्
content:
  english: jagatah sakshadagnirupena yah prabhuh | yatashca karmanam siddhirvishvanathassa me gatih ||
    1|| asti nastiti yaddeve vicikitsantyapanditah nityasiddhastu vidusham vishvanathassa me gatih ||
    2|| devairapi mahaprajnairyasmin samshayitam pura | durvijneyastu sukshmatvadvishvanathassa me gatih
    || 3|| putrapautrasamuhena prajyarajyashriyapi va | praptum na shakyate yah shrivishvanathassa me
    gatih || 4|| yogakshema nishaktanam preyah pathavicarinam | kroshakotividurah shrivishvanathassa me
    gatih || 5|| tyaktva kaman sushthu dhiraih shreyah prarthitaya hridi | pujyate bhavyate yah shrivishvanathassa
    me gatih || 6|| shrrinvanti bahavo yanna shrutvapi na vidanti ca | vaktapi durlabho yasya vishvanathassa
    me gatih || 7|| tarkagamya hi yadbuddhirdeshikoktyaiva gamyate | bahudha cintyamanah shrivishvanathassa
    me gatih || 8||
  devanagari: जगतः साक्षादग्निरूपेण यः प्रभुः । यतश्च कर्मणां सिद्धिर्विश्वनाथस्स मे गतिः ॥ १॥ अस्ति नास्तीति
    यद्देवे विचिकित्सन्त्यपण्डिताः नित्यसिद्धस्तु विदुषां विश्वनाथस्स मे गतिः ॥ २॥ देवैरपि महाप्रज्ञैर्यस्मिन्
    संशयितं पुरा । दुर्विज्ञेयस्तु सूक्ष्मत्वाद्विश्वनाथस्स मे गतिः ॥ ३॥ पुत्रपौत्रसमूहेन प्राज्यराज्यश्रियापि
    वा । प्राप्तुं न शक्यते यः श्रीविश्वनाथस्स मे गतिः ॥ ४॥ योगक्षेम निषक्तानां प्रेयः पथविचारिणाम् ।
    क्रोशकोटिविदूरः श्रीविश्वनाथस्स मे गतिः ॥ ५॥ त्यक्त्वा कामान् सुष्ठु धीरैः श्रेयः प्रार्थितया हृदि
    । पूज्यते भाव्यते यः श्रीविश्वनाथस्स मे गतिः ॥ ६॥ श्रृण्वन्ति बहवो यन्न श्रुत्वापि न विदन्ति च । वक्तापि
    दुर्लभो यस्य विश्वनाथस्स मे गतिः ॥ ७॥ तर्कागम्या हि यद्बुद्धिर्देशिकोक्त्यैव गम्यते । बहुधा चिन्त्यमानः
    श्रीविश्वनाथस्स मे गतिः ॥ ८॥
