id: sri-samba-sadashiva-aksharamala-stotram-matruka-varnamalika-stotram
category: stotram
name:
  english: Sri Samba Sadashiva Aksharamala Stotram (Matruka Varnamalika Stotram)
content:
  english: sambasadashiva sambasadashiva sambasadashiva sambashiva || adbhutavigraha amaradhishvara aganitagunagana
    amritashiva || anandamrita ashritarakshaka atmananda mahesha shiva || indukaladhara indradipriya sundararupa
    suresha shiva || isha suresha mahesha janapriya keshavasevitapada shiva || uragadipriyabhushana shankara
    narakavinasha natesha shiva || urjitadanavanasha paratpara arjitapapavinasha shiva || rigvedashrutimaulivibhushana
    ravicandragni trinetra shiva || ripamanadi prapancavilakshana tapanivarana tattva shiva || lingasvarupa
    sarvabudhapriya mangalamurti mahesha shiva || lutadhishvara rupapriyashiva vedantapriyavedya shiva
    || ekanekasvarupa vishveshvara yogihridipriyavasa shiva || aishvaryashraya cinmaya cidghana acyutananta
    mahesha shiva || onkarapriya uragavibhushana hrinkaradi mahesha shiva || aurasalalita antakanashana
    gaurisameta girisha shiva || ambaravasa cidambaranayaka tumburunaradasevya shiva || aharapriya adigirishvara
    bhogadipriya purna shiva || kamalaksharcita kailasapriya karunasagara kanti shiva || khadgashulamrigadhakkadyayudha
    vikramarupa vishvesha shiva || gangagirisutavallabha gunahita shankara sarvajanesha shiva || ghatakabhanjana
    patakanashana gaurisameta girisha shiva || nanashritashrutimaulivibhushana vedasvarupa vishvesha shiva
    || candavinashana sakalajanapriya mandaladhisha mahesha shiva || chatrakiritasukundalashobhita putrapriya
    bhuvanesha shiva || janmajaramritinashana kalmasharahita tapavinasha shiva || jhankarashraya bhringiritipriya
    onkaresha mahesha shiva || jnanajnanavinashaka nirmala dinajanapriya dipta shiva || tankadyayudhadharana
    satvara hrinkaraidi suresha shiva || thankasvarupa sahakarottama vagishvara varadesha shiva || dambavinashana
    dindimabhushana ambaravasa cidisha shiva || dhandhandamaruka dharaninishcala dhundhivinayakasevya
    shiva || nalinavilocana natanamanohara alikulabhushana amrita shiva || tattvamasityadi vakyasvarupaka
    nityananda mahesha shiva || sthavara jangama bhuvanavilakshana bhavukamunivarasevya shiva || duhkhavinashana
    dalitamanonmana candanalepitacarana shiva || dharanidhara shubha dhavalavibhasvara dhanadadipriyadana
    shiva || nanamaniganabhushana nirguna natanajanasupriyanatya shiva || pannagabhushana parvatinayaka
    paramananda paresha shiva || phalavilocana bhanukotiprabha halahaladhara amrita shiva || bandhavinashana
    brihadishamaraskandadipriya kanaka shiva || bhasmavilepana bhavabhayanashana vismayarupa vishvesha
    shiva || manmathanashana madhupanapriya mandaraparvatavasa shiva || yatijanahridayanivasita ishvara
    vidhivishnvadi suresha shiva || rameshvara ramaniyamukhambuja someshvara sukritesha shiva || lankadhishvara
    suraganasevita lavanyamritalasita shiva || varadabhayakara vasukibhushana vanamaladivibhusha shiva
    || shantisvarupa jagattraya cinmaya kantimatipriya kanaka shiva || shanmukhajanaka surendramunipriya
    shadgunyadisameta shiva || samsararnavanashana shashvatasadhuhridipriyavasa shiva || hara purushottama
    advaitamritapurna murarisusevya shiva || lalitabhaktajanesha nijeshvara kalinateshvara kama shiva
    || kshararupadipriyanvita sundara sakshijagattraya svami shiva || sambasadashiva sambasadashiva sambasadashiva
    sambashiva || iti shrisambasadashiva matrikavarnamalika stotram |
  devanagari: साम्बसदाशिव साम्बसदाशिव साम्बसदाशिव साम्बशिव ॥ अद्भुतविग्रह अमराधीश्वर अगणितगुणगण अमृतशिव
    ॥ आनन्दामृत आश्रितरक्षक आत्मानन्द महेश शिव ॥ इन्दुकलाधर इन्द्रादिप्रिय सुन्दररूप सुरेश शिव ॥ ईश सुरेश
    महेश जनप्रिय केशवसेवितपाद शिव ॥ उरगादिप्रियभूषण शङ्कर नरकविनाश नटेश शिव ॥ ऊर्जितदानवनाश परात्पर आर्जितपापविनाश
    शिव ॥ ऋग्वेदश्रुतिमौलिविभूषण रविचन्द्राग्नि त्रिनेत्र शिव ॥ ॠपमनादि प्रपञ्चविलक्षण तापनिवारण तत्त्व
    शिव ॥ लिङ्गस्वरूप सर्वबुधप्रिय मङ्गलमूर्ति महेश शिव ॥ लूताधीश्वर रूपप्रियशिव वेदान्तप्रियवेद्य शिव
    ॥ एकानेकस्वरूप विश्वेश्वर योगिहृदिप्रियवास शिव ॥ ऐश्वर्याश्रय चिन्मय चिद्घन अच्युतानन्त महेश शिव ॥
    ओङ्कारप्रिय उरगविभूषण ह्रीङ्कारादि महेश शिव ॥ औरसलालित अन्तकनाशन गौरिसमेत गिरीश शिव ॥ अम्बरवास चिदम्बरनायक
    तुम्बुरुनारदसेव्य शिव ॥ आहारप्रिय आदिगिरीश्वर भोगादिप्रिय पूर्ण शिव ॥ कमलाक्षार्चित कैलासप्रिय करुणासागर
    कान्ति शिव ॥ खड्गशूलमृगढक्काद्यायुध विक्रमरूप विश्वेश शिव ॥ गङ्गागिरिसुतवल्लभ गुणहित शङ्कर सर्वजनेश
    शिव ॥ घातकभञ्जन पातकनाशन गौरिसमेत गिरीश शिव ॥ ङङाश्रितश्रुतिमौलिविभूषण वेदस्वरूप विश्वेश शिव ॥ चण्डविनाशन
    सकलजनप्रिय मण्डलाधीश महेश शिव ॥ छत्रकिरीटसुकुण्डलशोभित पुत्रप्रिय भुवनेश शिव ॥ जन्मजरामृतिनाशन कल्मषरहित
    तापविनाश शिव ॥ झङ्काराश्रय भृङ्गिरिटिप्रिय ओङ्कारेश महेश शिव ॥ ज्ञानाज्ञानविनाशक निर्मल दीनजनप्रिय
    दीप्त शिव ॥ टङ्काद्यायुधधारण सत्वर ह्रीङ्कारैदि सुरेश शिव ॥ ठङ्कस्वरूपा सहकारोत्तम वागीश्वर वरदेश
    शिव ॥ डम्बविनाशन डिण्डिमभूषण अम्बरवास चिदीश शिव ॥ ढण्ढण्डमरुक धरणीनिश्चल ढुण्ढिविनायकसेव्य शिव ॥ णलिनविलोचन
    नटनमनोहर अलिकुलभूषण अमृत शिव ॥ तत्त्वमसीत्यादि वाक्यस्वरूपक नित्यानन्द महेश शिव ॥ स्थावर जङ्गम भुवनविलक्षण
    भावुकमुनिवरसेव्य शिव ॥ दुःखविनाशन दलितमनोन्मन चन्दनलेपितचरण शिव ॥ धरणीधर शुभ धवलविभास्वर धनदादिप्रियदान
    शिव ॥ नानामणिगणभूषण निर्गुण नटनजनसुप्रियनाट्य शिव ॥ पन्नगभूषण पार्वतिनायक परमानन्द परेश शिव ॥ फालविलोचन
    भानुकोटिप्रभ हालाहलधर अमृत शिव ॥ बन्धविनाशन बृहदीशामरस्कन्दादिप्रिय कनक शिव ॥ भस्मविलेपन भवभयनाशन
    विस्मयरूप विश्वेश शिव ॥ मन्मथनाशन मधुपानप्रिय मन्दरपर्वतवास शिव ॥ यतिजनहृदयनिवासित ईश्वर विधिविष्ण्वादि
    सुरेश शिव ॥ रामेश्वर रमणीयमुखाम्बुज सोमेश्वर सुकृतेश शिव ॥ लङ्काधीश्वर सुरगणसेवित लावण्यामृतलसित शिव
    ॥ वरदाभयकर वासुकिभूषण वनमालादिविभूष शिव ॥ शान्तिस्वरूप जगत्त्रय चिन्मय कान्तिमतीप्रिय कनक शिव ॥ षण्मुखजनक
    सुरेन्द्रमुनिप्रिय षाड्गुण्यादिसमेत शिव ॥ संसारार्णवनाशन शाश्वतसाधुहृदिप्रियवास शिव ॥ हर पुरुषोत्तम
    अद्वैतामृतपूर्ण मुरारिसुसेव्य शिव ॥ लालितभक्तजनेश निजेश्वर कालिनटेश्वर काम शिव ॥ क्षररूपादिप्रियान्वित
    सुन्दर साक्षिजगत्त्रय स्वामि शिव ॥ साम्बसदाशिव साम्बसदाशिव साम्बसदाशिव साम्बशिव ॥ इति श्रीसाम्बसदाशिव
    मातृकावर्णमालिका स्तोत्रम् ।
