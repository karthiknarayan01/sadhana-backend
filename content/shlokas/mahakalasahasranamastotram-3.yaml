id: mahakalasahasranamastotram-3
category: sahasranama
name:
  english: mahakalasahasranamastotram 3
  devanagari: महाकालसहस्रनामस्तोत्रम् ३
content:
  english: sarvashatrukshayakaram sarvapadvinivaranam | sarvavedagamanam ca saratsara samuddhritam ||
    23|| devadevena yatproktam himacalasutam prati | atyagrahati hinangim karunyatprita cetasa || 24||
    tadevate pravakshyami gurubhaktaya sampratam | atiyatnan mayapraptam dakshina kramayogatah || 25||
    tatte'ham sampravakshyami yacchrutam paramadbhutam | kulinaya ca shantaya bhaktaya bhajubuddhaye ||
    26|| dhanaprana pradatre ca devarcatirataya ca | devatabhava yuktaya dharmashraddhaparaya ca || 27||
    vadanyayatiyogyaya pravinaya dayalave | goshvepradeyamajnaptamiti devyapuramama || 28|| atastubhyam
    pravakshyami karunabdhermahatmanah | mahakalasya devasya madonmattasya shulinah || 29|| stotram sahasranamakhyam
    sahasraguna sampatam | tasyasmaranamatrena shravanena prayatnata || 30|| pathanatpathanadva'pi sarvashreyaskaram
    param | yatra sthitamidam stotram tatra shrih sarvatomukhi || 31|| tatra sarvatra vijayo bhaktyeva
    na samshayah | tatra loko vashetsarvah savaso bhairavasyatu || 32|| upamanyo bahukte kim na vacyam
    yasyakasyacit | gurusantoshya yatnena pathitavyam samahitah || 33|| aim hrim klim mahakalasya hrim
    hrim phat phat phat hu~ namah svaha || 34|| atha shrimahakalabhairavasahasranamastotram | om mahakalo
    mahadevo mahakayo mahatapah | matto maheshvaro mauni mahadevo mahapriyah || 1|| mahayogi mahakarma
    mahabhuto mridoyamah | mayi manomayo manyo mahanitirmahagatih || 2|| marunmaharshimadhyastho mahavyadho
    mahadyutih || 3||
  devanagari: सर्वशत्रुक्षयकरं सर्वापद्विनिवारणम् । सर्ववेदागमानां च सारात्सार समुद्धृतम् ॥ २३॥ देवदेवेन
    यत्प्रोक्तं हिमाचलसुतां प्रति । अत्याग्रहाति हीनाङ्गीं करुण्यात्प्रीत चेतसा ॥ २४॥ तदेवते प्रवक्ष्यामि
    गुरुभक्ताय साम्प्रतम् । अतियत्नान् मयाप्राप्तं दक्षिणा क्रमयोगतः ॥ २५॥ तत्तेऽहं सम्प्रवक्ष्यामि यच्छ्रुतं
    परमाद्भूतम् । कुलीनाय च शान्ताय भक्ताय भजुबुद्धये ॥ २६॥ धनप्राण प्रदात्रे च देवार्चातिरताय च । देवताभाव
    युक्ताय धर्मश्रद्धापराय च ॥ २७॥ वदान्यायातियोग्याय प्रवीणाय दयालवे । गोश्वेप्रदेयमाज्ञप्तमिति देव्यापुरामम
    ॥ २८॥ अतस्तुभ्यं प्रवक्ष्यामि करुणाब्धेर्महात्मनः । महाकालस्य देवस्य मदोन्मत्तस्य शूलिनः ॥ २९॥ स्तोत्रं
    सहस्रनामाख्यं सहस्रगुण सम्पतम् । तस्यस्मरणमात्रेण श्रवणेन प्रयत्नत ॥ ३०॥ पठनात्पाठनाद्वाऽपि सर्वश्रेयस्करं
    परम् । यत्र स्थितमिदं स्तोत्रं तत्र श्रीः सर्वतोमुखी ॥ ३१॥ तत्र सर्वत्र विजयो भक्त्येव न संशयः । तत्र
    लोको वशेत्सर्वः सवासो भैरवस्यतु ॥ ३२॥ उपमन्यो बहुक्ते किं न वाच्यं यस्यकस्यचित् । गुरुसन्तोष्य यत्नेन
    पठितव्यं समाहितः ॥ ३३॥ ऐं ह्रीं क्लीं महाकालस्य ह्रीं ह्रीं फट् फट् फट् हूँ नमः स्वाहा ॥ ३४॥ अथ श्रीमहाकालभैरवसहस्रनामस्तोत्रम्
    । ॐ महाकालो महादेवो महाकायो महातपः । मत्तो महेश्वरो मौनी महादेवो महाप्रियः ॥ १॥ महायोगी महाकर्मा महाभूतो
    मृदोयमः । मायी मनोमयो मान्यो महानीतिर्महागतिः ॥ २॥ मरुन्महर्षिमध्यस्थो महाव्याधो महाद्युतिः ॥ ३॥
