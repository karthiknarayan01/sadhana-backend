id: shiva-panchakshari-stotram
category: stotram
name:
  english: Shiva Panchakshari Stotram
content:
  english: om namah shivaya shivaya namah om om namah shivaya shivaya namah om nagendraharaya trilocanaya
    bhasmangaragaya maheshvaraya | nityaya shuddhaya digambaraya tasmai || mandakini salila candana carcitaya
    nandishvara pramathanatha maheshvaraya | mandara mukhya bahupushpa supujitaya tasmai || shivaya gauri
    vadanabja brinda suryaya dakshadhvara nashakaya | shri nilakanthaya vrishabhadhvajaya tasmai || vasishtha
    kumbhodbhava gautamarya munindra devarcita shekharaya | candrarka vaishvanara locanaya tasmai pinaka
    hastaya sanatanaya | divyaya devaya digambaraya tasmai || pancaksharamidam punyam yah pathecchiva
    sannidhau | shivalokamavapnoti shivena saha modate ||
  devanagari: ॐ नमः शिवाय शिवाय नमः ॐ ॐ नमः शिवाय शिवाय नमः ॐ नागेन्द्रहाराय त्रिलोचनाय भस्माङ्गरागाय
    महेश्वराय । नित्याय शुद्धाय दिगम्बराय तस्मै ॥ मन्दाकिनी सलिल चन्दन चर्चिताय नन्दीश्वर प्रमथनाथ महेश्वराय
    । मन्दार मुख्य बहुपुष्प सुपूजिताय तस्मै ॥ शिवाय गौरी वदनाब्ज बृन्द सूर्याय दक्षाध्वर नाशकाय । श्री
    नीलकण्ठाय वृषभध्वजाय तस्मै ॥ वसिष्ठ कुम्भोद्भव गौतमार्य मुनीन्द्र देवार्चित शेखराय । चन्द्रार्क वैश्वानर
    लोचनाय तस्मै पिनाक हस्ताय सनातनाय । दिव्याय देवाय दिगम्बराय तस्मै ॥ पञ्चाक्षरमिदं पुण्यं यः पठेच्छिव
    सन्निधौ । शिवलोकमवाप्नोति शिवेन सह मोदते ॥
