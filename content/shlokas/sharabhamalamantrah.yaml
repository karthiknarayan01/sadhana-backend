id: sharabhamalamantrah
category: mantra
name:
  english: sharabhamalamantrah
  devanagari: शरभमालामन्त्रः
content:
  english: rogagraham bandhaya bandhaya caturthikagraham bandhaya bandhaya bhimagraham bandhaya bandhaya
    apasmaragraham bandhaya bandhaya unmattahagraham bandhaya bandhaya brahmarakshasagraham bandhaya bandhaya
    bhucaragraham bandhaya bandhaya khecaragraham bandhaya bandhaya vetalagraham bandhaya bandhaya kushmandagraham
    bandhaya bandhaya | strigraham bandhaya bandhaya papagraham bandhaya bandhaya vikramagraham bandhaya
    bandhaya vyutkramagraham bandhaya bandhaya anaveshagraham bandhaya bandhaya kam ham trotaya trotaya
    praim traim haim maraya maraya shighram maraya maraya munca munca daha daha paca paca nashaya nashaya
  devanagari: रोगग्रहं बन्धय बन्धय चातुर्थिकग्रहं बन्धय बन्धय भीमग्रहं बन्धय बन्धय अपस्मारग्रहं बन्धय
    बन्धय उन्मत्ताहग्रहं बन्धय बन्धय ब्रह्मराक्षसग्रहं बन्धय बन्धय भूचरग्रहं बन्धय बन्धय खेचरग्रहं बन्धय
    बन्धय वेतालग्रहं बन्धय बन्धय कूष्माण्डग्रहं बन्धय बन्धय । स्त्रीग्रहं बन्धय बन्धय पापग्रहं बन्धय बन्धय
    विक्रमग्रहं बन्धय बन्धय व्युत्क्रमग्रहं बन्धय बन्धय अनावेशग्रहं बन्धय बन्धय कां हां त्रोटय त्रोटय
    प्रैं त्रैं हैं मारय मारय शीघ्रं मारय मारय मुञ्च मुञ्च दह दह पच पच नाशय नाशय
meaning: {}
