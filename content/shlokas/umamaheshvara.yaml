id: umamaheshvara
category: stotram
name:
  english: umamaheshvara
  devanagari: उममहेश्वर
content:
  english: umamaheshvarastotram namah shivabhyam navayauvanabhyam parasparashlishtavapurdharabhyam | nagendrakanyavrishaketanabhyam
    namo namah shankaraparvatibhyam || 1|| namah shivabhyam sarasotsavabhyam namaskritabhishtavarapradabhyam
    | narayanenarcitapadukabhyam namo namah shankaraparvatibhyam || 2|| namah shivabhyam vrishavahanabhyam
    virincivishnvindrasupujitabhyam | vibhutipatiravilepanabhyam namo namah shankaraparvatibhyam || 3||
    namah shivabhyam jagadishvarabhyam jagatpatibhyam jayavigrahabhyam | jambharimukhyairabhivanditabhyam
    namo namah shankaraparvatibhyam || 4|| namah shivabhyam paramaushadhabhyam pancakshari panjararanjitabhyam
    | prapancasrishtisthiti samhritabhyam namo namah shankaraparvatibhyam || 5|| namah shivabhyamatisundarabhyam
    atyantamasaktahridambujabhyam | asheshalokaikahitankarabhyam namo namah shankaraparvatibhyam || 6||
    namah shivabhyam kalinashanabhyam kankalakalyanavapurdharabhyam | kailasashailasthitadevatabhyam namo
    namah shankaraparvatibhyam || 7|| namah shivabhyamashubhapahabhyam asheshalokaikavisheshitabhyam |
    akunthitabhyam smritisambhritabhyam namo namah shankaraparvatibhyam || 8|| namah shivabhyam rathavahanabhyam
    ravinduvaishvanaralocanabhyam | rakashashankabhamukhambujabhyam namo namah shankaraparvatibhyam ||
    9|| namah shivabhyam jatilandharabhyam jaramritibhyam ca vivarjitabhyam | janardanabjodbhavapujitabhyam
    namo namah shankaraparvatibhyam || 10|| namah shivabhyam vishamekshanabhyam bilvacchadamallikadamabhridbhyam
    | shobhavati shantavatishvarabhyam namo namah shankaraparvatibhyam || 11|| namah shivabhyam pashupalakabhyam
    jagatrayirakshana baddhahridbhyam | samasta devasurapujitabhyam namo namah shankaraparvatibhyam ||
    12|| stotram trisandhyam shivaparvatibhyam bhaktya patheddvadashakam naro yah | sa sarvasaubhagya
    phalani bhunkte shatayurante shivalokameti || 13|| iti shrishankaracaryakritam umamaheshvarastotram
    sampurnam || shrishaileshabhramarambastutih
  devanagari: उमामहेश्वरस्तोत्रम् नमः शिवाभ्यां नवयौवनाभ्याम् परस्पराश्लिष्टवपुर्धराभ्याम् । नगेन्द्रकन्यावृषकेतनाभ्याम्
    नमो नमः शङ्करपार्वतीभ्याम् ॥ १॥ नमः शिवाभ्यां सरसोत्सवाभ्याम् नमस्कृताभीष्टवरप्रदाभ्याम् । नारायणेनार्चितपादुकाभ्यां
    नमो नमः शङ्करपार्वतीभ्याम् ॥ २॥ नमः शिवाभ्यां वृषवाहनाभ्याम् विरिञ्चिविष्ण्विन्द्रसुपूजिताभ्याम् ।
    विभूतिपाटीरविलेपनाभ्याम् नमो नमः शङ्करपार्वतीभ्याम् ॥ ३॥ नमः शिवाभ्यां जगदीश्वराभ्याम् जगत्पतिभ्यां
    जयविग्रहाभ्याम् । जम्भारिमुख्यैरभिवन्दिताभ्याम् नमो नमः शङ्करपार्वतीभ्याम् ॥ ४॥ नमः शिवाभ्यां परमौषधाभ्याम्
    पञ्चाक्षरी पञ्जररञ्जिताभ्याम् । प्रपञ्चसृष्टिस्थिति संहृताभ्याम् नमो नमः शङ्करपार्वतीभ्याम् ॥ ५॥ नमः
    शिवाभ्यामतिसुन्दराभ्याम् अत्यन्तमासक्तहृदम्बुजाभ्याम् । अशेषलोकैकहितङ्कराभ्याम् नमो नमः शङ्करपार्वतीभ्याम्
    ॥ ६॥ नमः शिवाभ्यां कलिनाशनाभ्याम् कङ्कालकल्याणवपुर्धराभ्याम् । कैलासशैलस्थितदेवताभ्याम् नमो नमः शङ्करपार्वतीभ्याम्
    ॥ ७॥ नमः शिवाभ्यामशुभापहाभ्याम् अशेषलोकैकविशेषिताभ्याम् । अकुण्ठिताभ्याम् स्मृतिसम्भृताभ्याम् नमो
    नमः शङ्करपार्वतीभ्याम् ॥ ८॥ नमः शिवाभ्यां रथवाहनाभ्याम् रवीन्दुवैश्वानरलोचनाभ्याम् । राकाशशाङ्काभमुखाम्बुजाभ्याम्
    नमो नमः शङ्करपार्वतीभ्याम् ॥ ९॥ नमः शिवाभ्यां जटिलन्धरभ्याम् जरामृतिभ्यां च विवर्जिताभ्याम् । जनार्दनाब्जोद्भवपूजिताभ्याम्
    नमो नमः शङ्करपार्वतीभ्याम् ॥ १०॥ नमः शिवाभ्यां विषमेक्षणाभ्याम् बिल्वच्छदामल्लिकदामभृद्भ्याम् । शोभावती
    शान्तवतीश्वराभ्याम् नमो नमः शङ्करपार्वतीभ्याम् ॥ ११॥ नमः शिवाभ्यां पशुपालकाभ्याम् जगत्रयीरक्षण बद्धहृद्भ्याम्
    । समस्त देवासुरपूजिताभ्याम् नमो नमः शङ्करपार्वतीभ्याम् ॥ १२॥ स्तोत्रं त्रिसन्ध्यं शिवपार्वतीभ्याम्
    भक्त्या पठेद्द्वादशकं नरो यः । स सर्वसौभाग्य फलानि भुङ्क्ते शतायुरान्ते शिवलोकमेति ॥ १३॥ इति श्रीशङ्कराचार्यकृतम्
    उमामहेश्वरस्तोत्रं सम्पूर्णम् ॥ श्रीशैलेशभ्रमराम्बास्तुतिः
