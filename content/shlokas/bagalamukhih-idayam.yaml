id: bagalamukhih-idayam
category: hridaya
name:
  english: bagalamukhihṟidayam
  devanagari: बगलामुखीह्ऱिदयम्
content:
  english: shribagalamukhihridayam atha hridayam | om asya shribagalamukhihridayasya narada rishih | anushtup
    chandah | shribagalamukhi devata | hlim bijam | klim shaktih | aim kilakam | shribagalamukhiprasadasiddhyarthe
    shribagalamukhihridayam jape viniyogah || rishyadinyasah | om naradarishaye namah shirasi | om anushtup
    chandase namah mukhe | om shribagalamukhi devatayai namah hridaye | om hlim bijaya namah guhye | om
    klim shaktayenamah padayoh | om aim kilakaya namah sarvange | iti rishyadinyasah || atha karanyasah
    | om hlim angushthabhyam namah | om klim tarjanibhyam namah | om aim madhyamabhyam namah | om hlim
    anamikabhyam namah | om klim kanishthikabhyam namah | om aim karatalakaraprishthabhyam namah | iti
    karanyasah || atha hridayadishadanganyasah | om hlim hridayaya namah | om klim shirase svaha | om
    aim shikhayai vashat | om hlim kavacaya hum | om klim netratrayaya vaushat | om aim astraya phat |
    iti hridayadishadanganyasah | om hlim klim aim iti digbandhah || pitambaram pitamalyam pitabharanabhushitam
    | pitakanjapadadvandvam bagalam cintaye'nisham || cintate'nisham iti dhyatva sampujya || pitashankhagadahaste
    pitacandanacarcite | bagale me varam dehi shatrusanghavidarini || iti samprartthya || om hlim klim
    aim bagalamukhyai gadadharinyai pretasanadhyasinyai svaha || iti mantram japitva punah purvavaddhridayadi
    shadanganyasankritva stotrampathet || isa mantraka japa 11 21 51 ya 108 bara karem aura punah nyasa
    karem | atha karanyasah | om hlim angushthabhyam namah | om klim tarjanibhyam namah | om aim madhyamabhyam
    namah | om hlim anamikabhyam namah | om klim kanishthikabhyam namah | om aim karatala karaprishthabhyam
    namah | iti karanyasah || atha hridayadishadanganyasah | om hlim hridayaya namah | om klim shirase
    svaha | om aim shikhayai vashat | om hlim kavacaya hum | om klim netratrayaya vaushat | om aim astraya
    phat | iti hridayadishadanganyasah | om hlim klim aim iti digbandhah || tadyatha || bande'ham bagalam
    devim pitabhushanabhushitam | tejorupamayim devim pitatejassvarupinim || 1|| gadabhramanabhinnabhram
    bhrukutibhishanananam | bhishayantim bhimashatrun bhaje bhaktasya bhavyadam || 2|| purnacandrasamanasyam
    pitagandhanulepanam | pitambaraparidhanam pavitramashrayamyaham || 3|| palayantimanupalam prasamikshyavanitale
    | pitacararatam bhaktam stambhavanim bhajamyaham || 4|| pitapadmapadadvandvam campakaranyarupinim
    | pitavatamsam paramam vande padmajavanditam || 5|| lasaccarusinjatsumanjirapadam calatsvarnakarnavatamsancitasyam
    | valatpitacandrananam candravandyam bhaje padmajadidyasatpadapadmam || 6|| supitabhayamalaya putamantram
    param te japanto jayam sallabhante | rane ragaroshaplutanam ripunam vivade baladvairakriddhatamatah
    || 7|| bharatpitabhasvatprabhahaskarabham gadaganjitamitragarvam garishtham | gariyo gunagaragatram
    gunadhyam ganeshadigamyam shraye nirgunadhyam || 8|| jana ye japantyugrabijam jagatsu param pratyaham
    te smarantah svarupam | bhavedvadinam vanmukhastambha adye jayo jayate jalpatamashu tesham || 9||
    tava dhyananishtha pratishthatmaprajnavatam padapadmarcane premayuktah | prasanna nripah prakritah
    pandita va puranadika dasatulya bhavanti || 10|| namamaste matah kanakakamaniyanghrijalajam baladvidyudvarnam
    ghanatimiravidhvamsakaranam | bhavabdhau magnatmottaranakaranam sarvasharanam prapannanam matarjagati
    bagale duhkhadamanam || 11|| jvalajjyotsnaratnakaramanivishaktankabhavanam smaramaste dhama smaraharaharindrendupramukhaih
    | ahoratram pratah pranayanavaniyam suvishadam param pitakaram paricitamanidvipavasanam || 12|| vadamaste
    matah shrutisukhakaram nama lalitam lasanmatravarnam jagati bagaleti pracaritam | calantastishthanto
    vayamupavishanto'pi shayane bhajamo yacchreyo divi duravalabhyam divishadam || 13|| padarcayam pritih
    pratidinamapurva prabhavatu yatha te prasannyam pratipalamapekshyam pranamatam | analpam tanmatarbhavati
    bhritabhaktya bhavatu no dishatah sadbhaktim bhuvi bhagavatam bhuri bhavadam || 14|| mama sakalaripunam
    vanmukhe stambhayashu bhagavati ripujihvam kilaya prasthatulyam | vyavasitakhalabuddhim nashayashu
    pragalbham mama kuru bahukaryam satkripe'mba prasida || 15|| vrajatu mama ripunam sadmani pretasamstha
    karadhritagadaya tan ghatayitvashu roshat | sadhanavasanadhanyam sadma tesham pradahya punarapi bagala
    svasthanamayatu shighram || 16|| karadhritaripu jihvapidana vyagrahastam punarapi gadaya tamstadayantim
    sutantram | pranatasuragananam palikam pitavastram bahubalabagalantam pitavastram namamah || 17||
    hridayavacanakayaih kurvatam bhaktipunjam prakatita karunardram prinatijalpatiti | dhanamatha bahudhanyam
    putrapautradivriddhih sakalamapi kimebhyo deyamevam tvavashyam || 18|| tava caranasarojam sarvada
    sevyamanam druhinahariharadyairdevavrindaih sharanyam | mridulamapi sharanam te sharmadam surisevyam
    vayamiha karavamo mataretad vidheyam || 19|| bagalahridayastotramidam bhaktisamanvitah | pathed yo
    bagala tasya prasanna pathato bhavet || 20|| pitadhyanaparo bhakto yah sha
  devanagari: श्रीबगलामुखीहृदयम् अथ हृदयम् । ॐ अस्य श्रीबगलामुखीहृदयस्य नारद ऋषिः । अनुष्टुप् छन्दः ।
    श्रीबगलामुखी देवता । ह्लीं बीजम् । क्लीं शक्तिः । ऐं कीलकम् । श्रीबगलामुखीप्रसादसिद्ध्यर्थे श्रीबगलामुखीहृदयम्
    जपे विनियोगः ॥ ऋष्यादिन्यासः । ॐ नारदऋषये नमः शिरसि । ॐ अनुष्टुप् छन्दसे नमः मुखे । ॐ श्रीबगलामुखी
    देवतायै नमः हृदये । ॐ ह्लीं बीजाय नमः गुह्ये । ॐ क्लीं शक्तयेनमः पादयोः । ॐ ऐं कीलकाय नमः सर्वाङ्गे
    । इति ऋष्यादिन्यासः ॥ अथ करन्यासः । ॐ ह्लीं अङ्गुष्ठाभ्यां नमः । ॐ क्लीं तर्जनीभ्यां नमः । ॐ ऐं मध्यमाभ्यां
    नमः । ॐ ह्लीं अनामिकाभ्यां नमः । ॐ क्लीं कनिष्ठिकाभ्यां नमः । ॐ ऐं करतलकरपृष्ठाभ्यां नमः । इति करन्यासः
    ॥ अथ हृदयादिषडङ्गन्यासः । ॐ ह्लीं हृदयाय नमः । ॐ क्लीं शिरसे स्वाहा । ॐ ऐं शिखायै वषट् । ॐ ह्लीं कवचाय
    हुम् । ॐ क्लीं नेत्रत्रयाय वौषट् । ॐ ऐं अस्त्राय फट् । इति हृदयादिषडङ्गन्यासः । ॐ ह्लीं क्लीं ऐं इति
    दिग्बन्धः ॥ पीताम्बरां पीतमाल्यां पीताभरणभूषिताम् । पीतकञ्जपदद्वन्द्वां बगलां चिन्तयेऽनिशम् ॥ चिन्ततेऽनिशम्
    इति ध्यात्वा सम्पूज्य ॥ पीतशङ्खगदाहस्ते पीतचन्दनचर्चिते । बगले मे वरं देहि शत्रुसङ्घविदारिणी ॥ इति
    सम्प्रार्त्थ्य ॥ ॐ ह्लीं क्लीं ऐं बगलामुख्यै गदाधारिण्यै प्रेतासनाध्यासिन्यै स्वाहा ॥ इति मन्त्रं
    जपित्वा पुनः पूर्ववद्धृदयादि षडङ्गन्यासङ्कृत्वा स्तोत्रम्पठेत् ॥ इस मन्त्रका जप ११ २१ ५१ या १०८ बार
    करें और पुनः न्यास करें । अथ करन्यासः । ॐ ह्लीं अङ्गुष्ठाभ्यां नमः । ॐ क्लीं तर्जनीभ्यां नमः । ॐ ऐं
    मध्यमाभ्यां नमः । ॐ ह्लीं अनामिकाभ्यां नमः । ॐ क्लीं कनिष्ठिकाभ्यां नमः । ॐ ऐं करतल करपृष्ठाभ्यां
    नमः । इति करन्यासः ॥ अथ हृदयादिषडङ्गन्यासः । ॐ ह्लीं हृदयाय नमः । ॐ क्लीं शिरसे स्वाहा । ॐ ऐं शिखायै
    वषट् । ॐ ह्लीं कवचाय हुम् । ॐ क्लीं नेत्रत्रयाय वौषट् । ॐ ऐं अस्त्राय फट् । इति हृदयादिषडङ्गन्यासः
    । ॐ ह्लीं क्लीं ऐं इति दिग्बन्धः ॥ तद्यथा ॥ बन्देऽहं बगलां देवीं पीतभूषणभूषिताम् । तेजोरूपमयीं देवीं
    पीततेजस्स्वरूपिणीम् ॥ १॥ गदाभ्रमणाभिन्नाभ्रां भ्रुकुटीभीषणाननाम् । भीषयन्तीं भीमशत्रून् भजे भक्तस्य
    भव्यदाम् ॥ २॥ पूर्णचन्द्रसमानास्यां पीतगन्धानुलेपनाम् । पीताम्बरपरीधानां पवित्रामाश्रयाम्यहम् ॥ ३॥
    पालयन्तीमनुपलं प्रसमीक्ष्यावनीतले । पीताचाररतां भक्तां स्ताम्भवानीं भजाम्यहम् ॥ ४॥ पीतपद्मपदद्वन्द्वां
    चम्पकारण्यरूपिणीम् । पीतावतंसां परमां वन्दे पद्मजवन्दिताम् ॥ ५॥ लसच्चारुसिञ्जत्सुमञ्जीरपादां चलत्स्वर्णकर्णावतंसाञ्चितास्याम्
    । वलत्पीतचन्द्राननां चन्द्रवन्द्यां भजे पद्मजादीड्यसत्पादपद्माम् ॥ ६॥ सुपीताभयामालया पूतमन्त्रं परं
    ते जपन्तो जयं सल्लभन्ते । रणे रागरोषाप्लुतानां रिपूणां विवादे बलाद्वैरकृद्धातमातः ॥ ७॥ भरत्पीतभास्वत्प्रभाहस्कराभां
    गदागञ्जितामित्रगर्वां गरिष्ठाम् । गरीयो गुणागारगात्रां गुणाढ्यां गणेशादिगम्यां श्रये निर्गुणाढ्याम्
    ॥ ८॥ जना ये जपन्त्युग्रबीजं जगत्सु परं प्रत्यहं ते स्मरन्तः स्वरूपम् । भवेद्वादिनां वाङ्मुखस्तम्भ
    आद्ये जयो जायते जल्पतामाशु तेषाम् ॥ ९॥ तव ध्याननिष्ठा प्रतिष्ठात्मप्रज्ञावतां पादपद्मार्चने प्रेमयुक्ताः
    । प्रसन्ना नृपाः प्राकृताः पण्डिता वा पुराणादिका दासतुल्या भवन्ति ॥ १०॥ नमामस्ते मातः कनककमनीयाङ्घ्रिजलजं
    बलद्विद्युद्वर्णां घनतिमिरविध्वंसकरणम् । भवाब्धौ मग्नात्मोत्तरणकरणं सर्वशरणं प्रपन्नानां मातर्जगति
    बगले दुःखदमनम् ॥ ११॥ ज्वलज्ज्योत्स्नारत्नाकरमणिविषक्ताङ्कभवनं स्मरामस्ते धाम स्मरहरहरीन्द्रेन्दुप्रमुखैः
    । अहोरात्रं प्रातः प्रणयनवनीयं सुविशदं परं पीताकारं परिचितमणिद्वीपवसनम् ॥ १२॥ वदामस्ते मातः श्रुतिसुखकरं
    नाम ललितं लसन्मात्रावर्णं जगति बगलेति प्रचरितम् । चलन्तस्तिष्ठन्तो वयमुपविशन्तोऽपि शयने भजामो यच्छ्रेयो
    दिवि दुरवलभ्यं दिविषदाम् ॥ १३॥ पदार्चायां प्रीतिः प्रतिदिनमपूर्वा प्रभवतु यथा ते प्रासन्न्यं प्रतिपलमपेक्ष्यं
    प्रणमताम् । अनल्पं तन्मातर्भवति भृतभक्त्या भवतु नो दिशातः सद्भक्तिं भुवि भगवतां भूरि भवदाम् ॥ १४॥
    मम सकलरिपूणां वाङ्मुखे स्तम्भयाशु भगवति रिपुजिह्वां कीलय प्रस्थतुल्याम् । व्यवसितखलबुद्धिं नाशयाशु
    प्रगल्भां मम कुरु बहुकार्यं सत्कृपेऽम्ब प्रसीद ॥ १५॥ व्रजतु मम रिपूणां सद्मनि प्रेतसंस्था करधृतगदया
    तान् घातयित्वाशु रोषात् । सधनवसनधान्यं सद्म तेषां प्रदह्य पुनरपि बगला स्वस्थानमायातु शीघ्रम् ॥ १६॥
    करधृतरिपु जिह्वापीडन व्यग्रहस्तां पुनरपि गदया तांस्ताडयन्तीं सुतन्त्राम् । प्रणतसुरगणानां पालिकां
    पीतवस्त्रां बहुबलबगलान्तां पीतवस्त्रां नमामः ॥ १७॥ हृदयवचनकायैः कुर्वतां भक्तिपुञ्जं प्रकटित करुणार्द्रां
    प्रीणतीजल्पतीति । धनमथ बहुधान्यं पुत्रपौत्रादिवृद्धिः सकलमपि किमेभ्यो देयमेवं त्ववश्यम् ॥ १८॥ तव चरणसरोजं
    सर्वदा सेव्यमानं द्रुहिणहरिहराद्यैर्देववृन्दैः शरण्यम् । मृदुलमपि शरणं ते शर्मदं सूरिसेव्यं वयमिह
    करवामो मातरेतद् विधेयम् ॥ १९॥ बगलाहृदयस्तोत्रमिदं भक्तिसमन्वितः । पठेद् यो बगला तस्य प्रसन्ना पाठतो
    भवेत् ॥ २०॥ पीताध्यानपरो भक्तो यः श
