id: devibhujangam
category: stotram
name:
  english: devibhujangam
  devanagari: देवीभुजङ्गम्
content:
  english: virincyadibhih pancabhirlokapalaih samudhe mahanandapithe nishannam | dhanurbanapashankushaprotahastam
    mahastraipuram shankaradvaitamavyat||1|| yadannadibhih pancabhih koshajalaih shirahpakshapucchatmakairantarantah
    | nigudhe mahayogapithe nishannam purarerathantahpuram naumi nityam||2|| virincadirupaih prapance
    vihritya svatantra yada svatmavishrantiresha | tada manamatriprameyatiriktam paranandamide bhavani
    tvadiyam||3|| vinodaya caitanyamekam vibhajya dvidha devi jivah shivashceti namna | shivasyapi jivatvamapadayanti
    punarjivamenam shivam va karoshi||4|| samakuncya mulam hridi nyasya vayum mano bhrubilam prapayitva
    nivrittah | tatah saccidanandarupe pade te bhavantyamba jivah shivatvena kecit||5|| sharire'tikashte
    ripau putravarge sadabhitimule kalatre dhane va | na kashcidvirajyatyaho devi citram katham tvatkataksham
    vina tattvabodhah||6|| sharire dhane'patyavarge kalatre viraktasya saddeshikadishtabuddheh | yadakasmikam
    jyotiranandarupam samadhau bhavettattvamasyamba satyam||7|| mrishanyo mrishanyah paro mishramenam
    parah prakritam caparo buddhimatram | prapancam mimite muninam gano'yam tadetattvameveti na tvam jahimah||8||
    nivrittih pratishtha ca vidya ca shanti
  devanagari: विरिञ्च्यादिभिः पञ्चभिर्लोकपालैः समूढे महानन्दपीठे निषण्णम् । धनुर्बाणपाशाङ्कुशप्रोतहस्तं
    महस्त्रैपुरं शङ्कराद्वैतमव्यात्॥१॥ यदन्नादिभिः पञ्चभिः कोशजालैः शिरःपक्षपुच्छात्मकैरन्तरन्तः । निगूढे
    महायोगपीठे निषण्णं पुरारेरथान्तःपुरं नौमि नित्यम्॥२॥ विरिञ्चादिरूपैः प्रपञ्चे विहृत्य स्वतन्त्रा यदा
    स्वात्मविश्रान्तिरेषा । तदा मानमातृप्रमेयातिरिक्तं परानन्दमीडे भवानि त्वदीयम्॥३॥ विनोदाय चैतन्यमेकं
    विभज्य द्विधा देवि जीवः शिवश्चेति नाम्ना । शिवस्यापि जीवत्वमापादयन्ती पुनर्जीवमेनं शिवं वा करोषि॥४॥
    समाकुञ्च्य मूलं हृदि न्यस्य वायुं मनो भ्रूबिलं प्रापयित्वा निवृत्ताः । ततः सच्चिदानन्दरूपे पदे ते
    भवन्त्यंब जीवाः शिवत्वेन केचित्॥५॥ शरीरेऽतिकष्टे रिपौ पुत्रवर्गे सदाभीतिमूले कलत्रे धने वा । न कश्चिद्विरज्यत्यहो
    देवि चित्रं कथं त्वत्कटाक्षं विना तत्त्वबोधः॥६॥ शरीरे धनेऽपत्यवर्गे कलत्रे विरक्तस्य सद्देशिकादिष्टबुद्धेः
    । यदाकस्मिकं ज्योतिरानन्दरूपं समाधौ भवेत्तत्त्वमस्यंब सत्यम्॥७॥ मृषान्यो मृषान्यः परो मिश्रमेनं परः
    प्राकृतं चापरो बुद्धिमात्रम् । प्रपञ्चं मिमीते मुनीनां गणोऽयं तदेतत्त्वमेवेति न त्वां जहीमः॥८॥ निवृत्तिः
    प्रतिष्ठा च विद्या च शान्ति
