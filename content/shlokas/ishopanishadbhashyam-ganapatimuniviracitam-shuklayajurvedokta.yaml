id: ishopanishadbhashyam-ganapatimuniviracitam-shuklayajurvedokta
category: upanishad
name:
  english: ishopanishadbhashyam (ganapatimuniviracitam) (shuklayajurvedokta)
  devanagari: ईशोपनिषद्भाष्यम् (गणपतिमुनिविरचितम्) (शुक्लयजुर्वेदोक्त)
content:
  english: karo'yamityeke | andham tamah pravishanti ye'vidyamupasate | tato bhuya iva te tamo ya u vidyaya~
    ratah || 9|| ye avidyam kevalam nidramityarthah | sa hyavidya kevala | yatastada na kincidvijanati
    | te andham tamah pravishanti jnanashunyatvat | ye vidyayam kevalayam trayyadividyayam lokajnanatmikayam
    caratah saktah | te tatah purvoktattamasah bhuya iva tamah pravishanti | vikaravijnanenasamuccitam
    vijnanam kadacinna brahmajnane | bhedena vikaragrahah | abhedena brahmanubhava iti parasparavirodhat
    | naivam vibhutyupasanocchedah | tatra vikaranam prithaktvenagrahanadavidyaiveti | uh padapuranah
    | anyadevahurvidyayanyadahuravidyaya | iti shushruma dhiranam ye nastadvicacakshire || 10|| vidyaya
    vakshyamanaya anyadeva phalamahuh | avidyaya vakshyamanaya anyatphalamahuh | ye nastat prakaranam
    vicacakshire tesham dhiranam sakashaditi sheshah | iti purvoktaprakarena shushruma shrutavantah smah
    | yadyapyavidyavidye nishphale kevale tathapi te prakarantarena samuccite phalade iti bhavah | vidyam
    cavidyam ca yastadvedobhaya~ saha | avidyaya mrityum tirtva vidyaya'mritamashnute || 11|| vidyam cavidyam
    cobhayam tatsaha samucyayena yo veda yugapadvidvanavidva~shca bhavatityarthah | kasya vidvan kasyavidvaniti
    cet ishvarasya vidvan parthakyena vikaranamavidvaniti vyakhyasyamah | sa cavidyaya parthakyena vikaranamaparijnanena
    nimittena mrityum pramadam tirtva vidyayeshvaranubhutya amritam shashvatam brahmabhavena sthitimashnute
    prapnoti | jagadyah prithagbhavena janannanubhavati sa ishvaram lakshanato janannapi naivanubhavati
    | ata eva kevalam vidyam nyashedhat | ishvarasyavidvan prapancamavijanannapi na samadhisthah | tam
    tu nidritameva pashyamah | atah kevalamavidyam nininda | avidyavidyayoh praguktaritya samuccayah sa
    samadhireva | andham tamah pravishanti ye'sambhutimupasate | tato bhuya iva te tamo ya u sambhutya~
    ratah || 12|| ye asambhutim sambhutipratidvandvinam vinashamupasate kevalam mriyanta iti yavat | te
    andham tamah pravishanti | ye sambhutyam ratah janma prapta iti yavat | te tato bhuya iva tamah pravishanti
    | kevalebhyo mritebhyo jatah kevala adhike tamasi pravishta iti bhavah | anyadevahuh sambhavadanyadahurasambhavat
    | iti shushruma dhiranam ye nastadvicacakshire || 13|| sambhavadanyadeva phalamahurvakshyamanat |
    asambhavadvinashadanyadeva phalamahurvakshyamanat | ye nah
  devanagari: कारोऽयमित्येके । अन्धं तमः प्रविशन्ति येऽविद्यामुपासते । ततो भूय इव ते तमो य उ विद्यायाँ
    रताः ॥ ९॥ ये अविद्यां केवलां निद्रामित्यर्थः । सा ह्यविद्या केवला । यतस्तदा न किञ्चिद्विजानाति । ते
    अन्धं तमः प्रविशन्ति ज्ञानशून्यत्वात् । ये विद्यायां केवलायां त्रय्यादिविद्यायां लोकज्ञानात्मिकायां
    चरताः सक्ताः । ते ततः पूर्वोक्तात्तमसः भूय इव तमः प्रविशन्ति । विकाराविज्ञानेनासमुच्चितं विज्ञानं
    कदाचिन्न ब्रह्मज्ञाने । भेदेन विकारग्रहः । अभेदेन ब्रह्मानुभव इति परस्परविरोधात् । नैवं विभूत्युपासनोच्छेदः
    । तत्र विकाराणां पृथक्त्वेनाग्रहणादविद्यैवेति । उः पादपूरणः । अन्यदेवाहुर्विद्ययान्यदाहुरविद्यया ।
    इति शुश्रुम धीराणां ये नस्तद्विचचक्षिरे ॥ १०॥ विद्यया वक्ष्यमाणया अन्यदेव फलमाहुः । अविद्यया वक्ष्यमाणया
    अन्यत्फलमाहुः । ये नस्तत् प्रकरणं विचचक्षिरे तेषां धीराणां सकाशादिति शेषः । इति पूर्वोक्तप्रकारेण
    शुश्रुम श्रुतवन्तः स्मः । यद्यप्यविद्याविद्ये निष्फले केवले तथापि ते प्रकारान्तरेण समुच्चिते फलदे
    इति भावः । विद्यां चाविद्यां च यस्तद्वेदोभयँ सह । अविद्यया मृत्युं तीर्त्वा विद्ययाऽमृतमश्नुते ॥ ११॥
    विद्यां चाविद्यां चोभयं तत्सह समुच्ययेन यो वेद युगपद्विद्वानविद्वाँश्च भवतीत्यर्थः । कस्य विद्वान्
    कस्याविद्वानिति चेत् ईश्वरस्य विद्वान् पार्थक्येन विकाराणामविद्वानिति व्याख्यास्यामः । स चाविद्यया
    पार्थक्येन विकाराणामपरिज्ञानेन निमित्तेन मृत्युं प्रमादं तीर्त्वा विद्ययेश्वरानुभूत्या अमृतं शाश्वतं
    ब्रह्मभावेन स्थितिमश्नुते प्राप्नोति । जगद्यः पृथग्भावेन जानन्ननुभवति स ईश्वरं लक्षणतो जानन्नपि नैवानुभवति
    । अत एव केवलां विद्यां न्यषेधत् । ईश्वरस्याविद्वान् प्रपञ्चमविजानन्नपि न समाधिस्थः । तं तु निद्रितमेव
    पश्यामः । अतः केवलामविद्यां निनिन्द । अविद्याविद्ययोः प्रागुक्तरीत्या समुच्चयः स समाधिरेव । अन्धं
    तमः प्रविशन्ति येऽसम्भूतिमुपासते । ततो भूय इव ते तमो य उ सम्भूत्याँ रताः ॥ १२॥ ये असम्भूतिं सम्भूतिप्रतिद्वन्द्विनं
    विनाशमुपासते केवलं म्रियन्त इति यावत् । ते अन्धं तमः प्रविशन्ति । ये सम्भूत्यां रताः जन्म प्राप्ता
    इति यावत् । ते ततो भूय इव तमः प्रविशन्ति । केवलेभ्यो मृतेभ्यो जाताः केवला अधिके तमसि प्रविष्टा इति
    भावः । अन्यदेवाहुः सम्भवादन्यदाहुरसम्भवात् । इति शुश्रुम धीराणां ये नस्तद्विचचक्षिरे ॥ १३॥ सम्भवादन्यदेव
    फलमाहुर्वक्ष्यमाणात् । असम्भवाद्विनाशादन्यदेव फलमाहुर्वक्ष्यमाणात् । ये नः
