id: budhakavac
category: kavacha
name:
  english: budhakavac
  devanagari: बुधकवच्
content:
  english: budhaprityartham jape viniyogah || budhastu pustakadharah kunkumasya samadyutih | pitambaradharah
    patu pitamalyanulepanah || 1|| katim ca patu me saumyah shirodesham budhastatha | netre jnanamayah
    patu shrotre patu nishapriyah || 2|| ghranam gandhapriyah patu jihvam vidyaprado mama | kantham patu
    vidhoh putro bhujau pustakabhushanah || 3|| vakshah patu varangashca hridayam rohinisutah | nabhim
    patu suraradhyo madhyam patu khageshvarah || 4|| januni rauhineyashca patu janghe'khilapradah | padau
    me bodhanah patu patu saumyo'khilam vapuh || 5|| etaddhi kavacam divyam sarvapapapranashanam | sarvarogaprashamanam
    sarvaduhkhanivaranam || 6|| ayurarogyashubhadam putrapautrapravardhanam | yah pathecchrinuyadvapi
    sarvatra vijayi bhavet || 7|| || iti shribrahmavaivartapurane budhakavacam sampurnam ||
  devanagari: बुधप्रीत्यर्थं जपे विनियोगः ॥ बुधस्तु पुस्तकधरः कुङ्कुमस्य समद्युतिः । पीताम्बरधरः पातु
    पीतमाल्यानुलेपनः ॥ १॥ कटिं च पातु मे सौम्यः शिरोदेशं बुधस्तथा । नेत्रे ज्ञानमयः पातु श्रोत्रे पातु
    निशाप्रियः ॥ २॥ घ्राणं गन्धप्रियः पातु जिह्वां विद्याप्रदो मम । कण्ठं पातु विधोः पुत्रो भुजौ पुस्तकभूषणः
    ॥ ३॥ वक्षः पातु वराङ्गश्च हृदयं रोहिणीसुतः । नाभिं पातु सुराराध्यो मध्यं पातु खगेश्वरः ॥ ४॥ जानुनी
    रौहिणेयश्च पातु जङ्घेऽखिलप्रदः । पादौ मे बोधनः पातु पातु सौम्योऽखिलं वपुः ॥ ५॥ एतद्धि कवचं दिव्यं
    सर्वपापप्रणाशनम् । सर्वरोगप्रशमनं सर्वदुःखनिवारणम् ॥ ६॥ आयुरारोग्यशुभदं पुत्रपौत्रप्रवर्धनम् । यः
    पठेच्छृणुयाद्वापि सर्वत्र विजयी भवेत् ॥ ७॥ ॥ इति श्रीब्रह्मवैवर्तपुराणे बुधकवचं सम्पूर्णम् ॥
