id: govinda-namaavali
category: stotram
name:
  english: Govinda Namaavali
content:
  english: shri shrinivasa govinda shri venkatesha govinda bhaktavatsala govinda bhagavatapriya govinda
    govinda hari govinda gokulanandana govinda || nityanirmala govinda nilameghashyama govinda puranapurusha
    govinda pundarikaksha govinda govinda hari govinda gokulanandana govinda || nandanandana govinda navanitacora
    govinda pashupalaka shri govinda papavimocana govinda govinda hari govinda gokulanandana govinda ||
    dushtasamhara govinda duritanivarana govinda shishtaparipalaka govinda kashtanivarana govinda govinda
    hari govinda gokulanandana govinda || vajramakutadhara govinda varahamurtivi govinda gopijanapriya
    govinda govardhanoddhara govinda govinda hari govinda gokulanandana govinda || dasharathanandana govinda
    dashamukhamardana govinda pakshivahana govinda pandavapriya govinda govinda hari govinda gokulanandana
    govinda || matsyakurma govinda madhusudhana hari govinda varaha narasimha govinda vamana bhrigurama
    govinda govinda hari govinda gokulanandana govinda || balaramanuja govinda bauddha kalkidhara govinda
    venuganapriya govinda venkataramana govinda govinda hari govinda gokulanandana govinda || sitanayaka
    govinda shritaparipalaka govinda shritajanaposhaka govinda dharmasamsthapaka govinda govinda hari
    govinda gokulanandana govinda || anatharakshaka govinda apadbhandava govinda bhaktavatsala govinda
    karunasagara govinda govinda hari govinda gokulanandana govinda || kamaladalaksha govinda kamitaphaladata
    govinda papavinashaka govinda pahi murare govinda govinda hari govinda gokulanandana govinda || shri
    mudrankita govinda shri vatsankita govinda dharaninayaka govinda dinakarateja govinda govinda hari
    govinda gokulanandana govinda || padmavatipriya govinda prasannamurti govinda abhayahasta govinda
    matsyavatara govinda govinda hari govinda gokulanandana govinda || shankhacakradhara govinda shar
    ngagadadhara govinda virajatirdhastha govinda virodhimardhana govinda govinda hari govinda gokulanandana
    govinda govinda sahasranama govinda lakshmivallabha govinda lakshmanagraja govinda govinda hari govinda
    gokulanandana govinda || kasturitilaka govinda kanakambaradhara govinda garudavahana govinda gajaraja
    rakshaka govinda govinda hari govinda gokulanandana govinda || vanarasevita govinda varadhibandhana
    govinda ekasvarupa govinda ramakrishna govinda govinda hari govinda gokulanandana govinda || bhaktanandana
    govinda pratyakshadeva govinda paramadayakara govinda vajrakavacadhara govinda govinda hari govinda
    gokulanandana govinda || vaijayantimala govinda vaddikasula govinda vasudevasuta govinda shrivasudeva
    govinda govinda hari govinda gokulanandana govinda || nityakalyana govinda nirajanabha govinda niladrivasa
    govinda nilameghashyama govinda govinda hari govinda gokulanandana govinda || svayam prakasha govinda
    anandanilaya govinda shridevinatha govinda devaki nandana govinda govinda hari govinda gokulanandana
    govinda || tirumalavasa govinda ratnakirita govinda ashritapaksha govinda nityashubhaprada govinda
    govinda hari govinda gokulanandana govinda || anandarupa govinda adyantarahita govinda ihapara dayaka
    govinda ibharaja rakshaka govinda govinda hari govinda gokulanandana govinda || padmadalaksha govinda
    tirumalanilya govinda sheshashayini govinda sheshadrinilaya govinda govinda hari govinda gokulanandana
    govinda || varaha ripa govinda shri kurmarupa govinda vamanaripa govinda naraharirupa govinda govinda
    hari govinda gokulanandana govinda || shri parashurama govinda shri balarama govinda raghukula rama
    govinda shri ramakrishna govinda govinda hari govinda gokulanandana govinda || tirumalanayaka govinda
    shritajanaposhaka govinda shridevinatha govinda shrivatsankita govinda govinda hari govinda gokulanandana
    govinda || govindanama govinda venkataramana govinda kshetrapalaka govinda tirumalanatha govinda |
    govinda hari govinda gokulanandana govinda || vanarasevita govinda varadhibandhana govinda edukòndalavada
    govinda ekatvarupa govinda govinda hari govinda gokulanandana govinda || shri ramakrishna govinda
    raghukula nandana govinda pratyakshadeva govinda paramadayakara govinda govinda hari govinda gokulanandana
    govinda || vajrakavacadhara govinda vaijayantimala govinda vaddikasulavada govinda vasudevatanaya
    govinda govinda hari govinda gokulanandana govinda || bilvapatrarcita govinda bhikshuka samstuta govinda
    stripumsarupa govinda shivakeshavamurti govinda brahmandarupa govinda bhaktarakshaka govinda govinda
    hari govinda gokulanandana govinda || nityakalyana govinda nirajanabha govinda hatiramapriya govinda
    hari sarvottama govinda govinda hari govinda gokulanandana govinda || janardhanamurti govinda jagatsakshirupa
    govinda abhishekapriya govinda apannivarana govinda govinda hari govinda gokulanandana govinda ||
    ratnakirita govinda ramanujanuta govinda svayamprakasha govinda ashritapaksha govinda govinda hari
    govinda gokulanandana govinda || nityashubhaprada govinda nikhilalokesha govinda anandarupa govinda
    adyantarahita govinda govinda hari govinda gokulanandana govinda || ihapara dayaka govinda ibharaja
    rakshaka govinda paramadayalo govinda padmanabhahari govinda govinda hari govinda gokulanandana govinda
    || tirumalavasa govinda tulasivanamala govinda sheshadrinilaya govinda sheshasayini govinda shri shrinivasa
    govinda shri venkatesha govinda govinda hari govinda gokulanandana govinda
  devanagari: श्री श्रीनिवासा गोविन्दा श्री वेङ्कटेशा गोविन्दा भक्तवत्सला गोविन्दा भागवतप्रिय गोविन्दा
    गोविन्दा हरि गोविन्दा गोकुलनन्दन गोविन्दा ॥ नित्यनिर्मला गोविन्दा नीलमेघश्याम गोविन्दा पुराणपुरुषा
    गोविन्दा पुण्डरीकाक्ष गोविन्दा गोविन्दा हरि गोविन्दा गोकुलनन्दन गोविन्दा ॥ नन्दनन्दना गोविन्दा नवनीतचोरा
    गोविन्दा पशुपालक श्री गोविन्दा पापविमोचन गोविन्दा गोविन्दा हरि गोविन्दा गोकुलनन्दन गोविन्दा ॥ दुष्टसंहार
    गोविन्दा दुरितनिवारण गोविन्दा शिष्टपरिपालक गोविन्दा कष्टनिवारण गोविन्दा गोविन्दा हरि गोविन्दा गोकुलनन्दन
    गोविन्दा ॥ वज्रमकुटधर गोविन्दा वराहमूर्तिवि गोविन्दा गोपीजनप्रिय गोविन्दा गोवर्धनोद्धार गोविन्दा गोविन्दा
    हरि गोविन्दा गोकुलनन्दन गोविन्दा ॥ दशरथनन्दन गोविन्दा दशमुखमर्दन गोविन्दा पक्षिवाहना गोविन्दा पाण्डवप्रिय
    गोविन्दा गोविन्दा हरि गोविन्दा गोकुलनन्दन गोविन्दा ॥ मत्स्यकूर्म गोविन्दा मधुसूधन हरि गोविन्दा वराह
    नरसिंह गोविन्दा वामन भृगुराम गोविन्दा गोविन्दा हरि गोविन्दा गोकुलनन्दन गोविन्दा ॥ बलरामानुज गोविन्दा
    बौद्ध कल्किधर गोविन्दा वेणुगानप्रिय गोविन्दा वेङ्कटरमणा गोविन्दा गोविन्दा हरि गोविन्दा गोकुलनन्दन
    गोविन्दा ॥ सीतानायक गोविन्दा श्रितपरिपालक गोविन्दा श्रितजनपोषक गोविन्दा धर्मसंस्थापक गोविन्दा गोविन्दा
    हरि गोविन्दा गोकुलनन्दन गोविन्दा ॥ अनाथरक्षक गोविन्दा आपद्भान्दव गोविन्दा भक्तवत्सला गोविन्दा करुणासागर
    गोविन्दा गोविन्दा हरि गोविन्दा गोकुलनन्दन गोविन्दा ॥ कमलदलाक्ष गोविन्दा कामितफलदात गोविन्दा पापविनाशक
    गोविन्दा पाहि मुरारे गोविन्दा गोविन्दा हरि गोविन्दा गोकुलनन्दन गोविन्दा ॥ श्री मुद्राङ्कित गोविन्दा
    श्री वत्साङ्कित गोविन्दा धरणीनायक गोविन्दा दिनकरतेजा गोविन्दा गोविन्दा हरि गोविन्दा गोकुलनन्दन गोविन्दा
    ॥ पद्मावतीप्रिय गोविन्दा प्रसन्नमूर्ती गोविन्दा अभयहस्त गोविन्दा मत्स्यावतार गोविन्दा गोविन्दा हरि
    गोविन्दा गोकुलनन्दन गोविन्दा ॥ शङ्खचक्रधर गोविन्दा शार् ङ्गगदाधर गोविन्दा विराजातीर्धस्थ गोविन्दा
    विरोधिमर्धन गोविन्दा गोविन्दा हरि गोविन्दा गोकुलनन्दन गोविन्दा गोविन्दा सहस्रनामा गोविन्दा लक्ष्मीवल्लभ
    गोविन्दा लक्ष्मणाग्रज गोविन्दा गोविन्दा हरि गोविन्दा गोकुलनन्दन गोविन्दा ॥ कस्तूरितिलक गोविन्दा कनकाम्बरधर
    गोविन्दा गरुडवाहना गोविन्दा गजराज रक्षक गोविन्दा गोविन्दा हरि गोविन्दा गोकुलनन्दन गोविन्दा ॥ वानरसेवित
    गोविन्दा वारधिबन्धन गोविन्दा एकस्वरूप गोविन्दा रामकृष्णा गोविन्दा गोविन्दा हरि गोविन्दा गोकुलनन्दन
    गोविन्दा ॥ भक्तनन्दन गोविन्दा प्रत्यक्षदेवा गोविन्दा परमदयाकर गोविन्दा वज्रकवचधर गोविन्दा गोविन्दा
    हरि गोविन्दा गोकुलनन्दन गोविन्दा ॥ वैजयन्तिमाल गोविन्दा वड्डिकासुल गोविन्दा वसुदेवसुत गोविन्दा श्रीवासुदेव
    गोविन्दा गोविन्दा हरि गोविन्दा गोकुलनन्दन गोविन्दा ॥ नित्यकल्याण गोविन्दा नीरजनाभ गोविन्दा नीलाद्रिवास
    गोविन्दा नीलमेघश्याम गोविन्दा गोविन्दा हरि गोविन्दा गोकुलनन्दन गोविन्दा ॥ स्वयं प्रकाश गोविन्दा आनन्दनिलय
    गोविन्दा श्रीदेविनाथ गोविन्दा देवकि नन्दन गोविन्दा गोविन्दा हरि गोविन्दा गोकुलनन्दन गोविन्दा ॥ तिरुमलवास
    गोविन्दा रत्नकिरीट गोविन्दा आश्रितपक्ष गोविन्दा नित्यशुभप्रद गोविन्दा गोविन्दा हरि गोविन्दा गोकुलनन्दन
    गोविन्दा ॥ आनन्दरूप गोविन्दा आद्यन्तरहित गोविन्दा इहपर दायक गोविन्दा इभराज रक्षक गोविन्दा गोविन्दा
    हरि गोविन्दा गोकुलनन्दन गोविन्दा ॥ पद्मदलाक्ष गोविन्दा तिरुमलनिल्य गोविन्दा शेषशायिनी गोविन्दा शेषाद्रिनिलय
    गोविन्दा गोविन्दा हरि गोविन्दा गोकुलनन्दन गोविन्दा ॥ वराह ॠप गोविन्दा श्री कूर्मरूप गोविन्दा वामनॠप
    गोविन्दा नरहरिरूप गोविन्दा गोविन्दा हरि गोविन्दा गोकुलनन्दन गोविन्दा ॥ श्री परशुराम गोविन्दा श्री
    बलराम गोविन्दा रघुकुल राम गोविन्दा श्री रामकृष्ण गोविन्दा गोविन्दा हरि गोविन्दा गोकुलनन्दन गोविन्दा
    ॥ तिरुमलनायक गोविन्दा श्रितजनपोषक गोविन्दा श्रीदेविनाथ गोविन्दा श्रीवत्साङ्कित गोविन्दा गोविन्दा हरि
    गोविन्दा गोकुलनन्दन गोविन्दा ॥ गोविन्दानाम गोविन्दा वेङ्कटरमणा गोविन्दा क्षेत्रपालक गोविन्दा तिरुमलनाथ
    गोविन्दा । गोविन्दा हरि गोविन्दा गोकुलनन्दन गोविन्दा ॥ वानरसेवित गोविन्दा वारधिबन्धन गोविन्दा एडुकॊण्डलवाड
    गोविन्दा एकत्वरूपा गोविन्दा गोविन्दा हरि गोविन्दा गोकुलनन्दन गोविन्दा ॥ श्री रामकृष्ण गोविन्दा रघुकुल
    नन्दन गोविन्दा प्रत्यक्षदेवा गोविन्दा परमदयाकर गोविन्दा गोविन्दा हरि गोविन्दा गोकुलनन्दन गोविन्दा
    ॥ वज्रकवचधर गोविन्दा वैजयन्तिमाल गोविन्दा वड्डिकासुलवाड गोविन्दा वसुदेवतनया गोविन्दा गोविन्दा हरि
    गोविन्दा गोकुलनन्दन गोविन्दा ॥ बिल्वपत्रार्चित गोविन्दा भिक्षुक संस्तुत गोविन्दा स्त्रीपुंसरूपा गोविन्दा
    शिवकेशवमूर्ति गोविन्दा ब्रह्माण्डरूपा गोविन्दा भक्तरक्षक गोविन्दा गोविन्दा हरि गोविन्दा गोकुलनन्दन
    गोविन्दा ॥ नित्यकल्याण गोविन्दा नीरजनाभ गोविन्दा हातीरामप्रिय गोविन्दा हरि सर्वोत्तम गोविन्दा गोविन्दा
    हरि गोविन्दा गोकुलनन्दन गोविन्दा ॥ जनार्धनमूर्ति गोविन्दा जगत्साक्षिरूपा गोविन्दा अभिषेकप्रिय गोविन्दा
    आपन्निवारण गोविन्दा गोविन्दा हरि गोविन्दा गोकुलनन्दन गोविन्दा ॥ रत्नकिरीटा गोविन्दा रामानुजनुत गोविन्दा
    स्वयम्प्रकाशा गोविन्दा आश्रितपक्ष गोविन्दा गोविन्दा हरि गोविन्दा गोकुलनन्दन गोविन्दा ॥ नित्यशुभप्रद
    गोविन्दा निखिललोकेशा गोविन्दा आनन्दरूपा गोविन्दा आद्यन्तरहिता गोविन्दा गोविन्दा हरि गोविन्दा गोकुलनन्दन
    गोविन्दा ॥ इहपर दायक गोविन्दा इभराज रक्षक गोविन्दा परमदयालो गोविन्दा पद्मनाभहरि गोविन्दा गोविन्दा
    हरि गोविन्दा गोकुलनन्दन गोविन्दा ॥ तिरुमलवासा गोविन्दा तुलसीवनमाल गोविन्दा शेषाद्रिनिलया गोविन्दा
    शेषसायिनी गोविन्दा श्री श्रीनिवासा गोविन्दा श्री वेङ्कटेशा गोविन्दा गोविन्दा हरि गोविन्दा गोकुलनन्दन
    गोविन्दा
