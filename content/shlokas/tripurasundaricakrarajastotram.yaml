id: tripurasundaricakrarajastotram
category: stotram
name:
  english: tripurasundaricakrarajastotram
  devanagari: त्रिपुरसुन्दरीचक्रराजस्तोत्रम्
content:
  english: shritripurasundaricakrarajastotram shritripurasundari mulamantratmakah cakrarajastavah shriganeshaya
    namah | || ka|| kartum devi
  devanagari: श्रीत्रिपुरसुन्दरीचक्रराजस्तोत्रम् श्रीत्रिपुरसुन्दरी मूलमन्त्रात्मकः चक्रराजस्तवः श्रीगणेशाय
    नमः । ॥ क॥ कर्तुं देवि
meaning: {}
