id: balatripurasundaristotram
category: stotram
name:
  english: balatripurasundaristotram
  devanagari: बालात्रिपुरसुन्दरीस्तोत्रम्
content:
  english: sarvange | atha karanyasah || om aim angushthabhyam namah | om klim tarjanibhyam namah | om
    sauh madhyamabhyam namah | om aim anamikabhyam namah | om klim kanishthikabhyam namah | om sauh karatalakaraprishthabhyam
    namah | athanganyasah | om aim hridayaya namah | om klim shirase svaha | om sauh shikhayai vaushat
    | om aim kavacaya hum | om klim netratrayaya vaushatat | om sauh astraya phat | atha dhyanam | arunakiranajalai
    ranjitashavakasha | vidhritajapavatika pustakabhitihasta | itarakaravaradhya phullakahlarasamstha
    | nivasatu hridi bala nityakalyanarupa || || manasa pujana || om lam prithivitattvatmakam gandham
    shribalatripurapritaye samarpayami namah | om ham akashatattvatmakam pushpam shribalatripurapritaye
    samarpayami namah | om yam vayutattvatmakam dhupam shribalatripurapritaye ghrapayami namah | om ram
    agnitattvatmakam dipam shribalatripurapritaye darshayami namah | om vam jalatattvatmakam naivedyam
    shribalatripurapritaye nivedayami namah | om sam sarvatattvatmakam tambulam shribalatripurapritaye
    samarpayami namah | || mula shribalastotram || vanim japed yastripure
  devanagari: सर्वाङ्गे । अथ करन्यासः ॥ ॐ ऐं अङ्गुष्ठाभ्यां नमः । ॐ क्लीं तर्जनीभ्यां नमः । ॐ सौः मध्यमाभ्यां
    नमः । ॐ ऐं अनामिकाभ्यां नमः । ॐ क्लीं कनिष्ठिकाभ्यां नमः । ॐ सौः करतलकरपृष्ठाभ्यां नमः । अथाङ्गन्यासः
    । ॐ ऐं हृदयाय नमः । ॐ क्लीं शिरसे स्वाहा । ॐ सौः शिखायै वौषट् । ॐ ऐं कवचाय हुम् । ॐ क्लीं नेत्रत्रयाय
    वौषतट् । ॐ सौः अस्त्राय फट् । अथ ध्यानम् । अरुणकिरणजालै रञ्जिताशावकाशा । विधृतजपवटीका पुस्तकाभीतिहस्ता
    । इतरकरवराढ्या फुल्लकह्लारसंस्था । निवसतु हृदि बाला नित्यकल्याणरूपा ॥ ॥ मानस पूजन ॥ ॐ लं पृथिवीतत्त्वात्मकं
    गन्धं श्रीबालात्रिपुराप्रीतये समर्पयामि नमः । ॐ हं आकाशतत्त्वात्मकं पुष्पं श्रीबालात्रिपुराप्रीतये
    समर्पयामि नमः । ॐ यं वायुतत्त्वात्मकं धूपं श्रीबालात्रिपुराप्रीतये घ्रापयामि नमः । ॐ रं अग्नितत्त्वात्मकं
    दीपं श्रीबालात्रिपुराप्रीतये दर्शयामि नमः । ॐ वं जलतत्त्वात्मकं नैवेद्यं श्रीबालात्रिपुराप्रीतये निवेदयामि
    नमः । ॐ सं सर्वतत्त्वात्मकं ताम्बूलं श्रीबालात्रिपुराप्रीतये समर्पयामि नमः । ॥ मूल श्रीबालास्तोत्रम्
    ॥ वाणीं जपेद् यस्त्रिपुरे
