id: shridevyatharvashirsham
category: stotram
name:
  english: shridevyatharvashirsham
  devanagari: श्रीदेव्यथर्वशीर्षम्
content:
  english: namo devyai mahadevyai shivayai satatam namah | namah prakrityai bhadrayai niyatah pranatah
    sma tam ||8|| tamagnivarnam tapasa jvalantim vairocanim karmaphaleshu jushtam | durgam devim sharanam
    prapadyamahe'surannashayitryai te namah ||9|| devim vacamajanayanta devastam vishvarupah pashavo vadanti
    | sa no mandreshamurjam duhana dhenurvagasmanupa sushtutaitu ||10|| kalaratrim brahmastutam vaishnavim
    skandamataram | sarasvatimaditim dakshaduhitaram namamah pavanam shivam ||11|| mahalakshmyai ca vidmahe
    sarvashaktyai ca dhimahi | tanno devi pracodayat ||12|| aditirhyajanishta daksha ya duhita tava |
    tam deva anvajayanta bhadra amritabandhavah ||13|| kamo yonih kamala vajrapanirguha hasa matarishvabhramindrah
    | punarguha sakala mayaya ca purucyaisha vishvamatadividyom ||14|| esha''tmashaktih | esha vishvamohini
    | pashankushadhanurbanadhara | esha shrimahavidya | ya evam veda sa shokam tarati ||15|| namaste astu
    bhagavati matarasman pahi sarvatah ||16|| saishashtau vasavah | saishaikadasha rudrah | saisha dvadashadityah
    | saisha vishvedevah somapa asomapashca | saisha yatudhana asura rakshamsi pishaca yakshah siddhah
    | saisha sattvarajastamamsi | saisha brahmavishnurudrarupini | saisha prajapatindramanavah | saisha
    grahanakshatrajyotimsi | kalakashthadikalarupini | tamaham pranaumi nityam || papapaharinim devim
    bhuktimuktipradayinim | anantam vijayam shuddham sharanyam shivadam shivam ||17|| viyadikarasamyuktam
    vitihotrasamanvitam | ardhendulasitam devya bijam sarvarthasadhanam ||18|| evamekaksharam brahma yatayah
    shuddhacetasah | dhyayanti paramanandamaya jnanamburashayah ||19|| vanmaya brahmasustasmat shashtham
    vaktrasamanvitam | suryo'vamashrotrabindusamyuktashtattritiyakah | narayanena sammishro vayushcadharayuk
    tatah | vicce navarnako'rnah syanmahadanandadayakah ||20|| hritpundarikamadhyastham pratah suryasamaprabham
    | pashankushadharam saumyam varadabhayahastakam | trinetram raktavasanam bhaktakamadugham bhaje ||21||
    namami tvam mahadevim mahabhayavinashinim | mahadurgaprashamanim mahakarunyarupinim ||22|| yasyah
    svarupam brahmadayo na jananti tasmaducyate ajneya | yasya anto na labhyate tasmaducyate ananta |
    yasya lakshyam nopalakshyate tasmaducyate alakshya | yasya jananam nopalabhyate tasmaducyate aja |
    ekaiva sarvatra vartate tasmaducyate eka | ekaiva vishvarupini tasmaducyate naika | ataevocyate ajneyanantalakshyajaika
    naiketi ||23|| mantranam matrika devi shabdanam jnanarupini | jnananam cinmayatita shunyanam shunyasakshini
    | yasyah parataram nasti saisha durga prakirtita ||24|| tam durgam durgamam devim duracaravighatinim
    | namami bhavabhito'ham samsararnavatarinim ||25|| idamatharvashirsham yo'dhite sa pancatharvashirshajapaphalamapnoti
    | idamatharvashirshamajnatva yo'rcam sthapayati
  devanagari: नमो देव्यै महादेव्यै शिवायै सततं नमः । नमः प्रकृत्यै भद्रायै नियताः प्रणताः स्म ताम् ।।८।।
    तामग्निवर्णां तपसा ज्वलन्तीं वैरोचनीं कर्मफलेषु जुष्टाम् । दुर्गां देवीं शरणं प्रपद्यामहेऽसुरान्नाशयित्र्यै
    ते नमः ।।९।। देवीं वाचमजनयन्त देवास्तां विश्वरूपाः पशवो वदन्ति । सा नो मन्द्रेषमूर्जं दुहाना धेनुर्वागस्मानुप
    सुष्टुतैतु ।।१०।। कालरात्रीं ब्रह्मस्तुतां वैष्णवीं स्कन्दमातरम् । सरस्वतीमदितिं दक्षदुहितरं नमामः
    पावनां शिवाम् ।।११।। महालक्ष्म्यै च विद्महे सर्वशक्त्यै च धीमहि । तन्नो देवी प्रचोदयात् ।।१२।। अदितिर्ह्यजनिष्ट
    दक्ष या दुहिता तव । तां देवा अन्वजायन्त भद्रा अमृतबन्धवः ।।१३।। कामो योनिः कमला वज्रपाणिर्गुहा हसा
    मातरिश्वाभ्रमिन्द्रः । पुनर्गुहा सकला मायया च पुरूच्यैषा विश्वमातादिविद्योम् ।।१४।। एषाऽऽत्मशक्तिः
    । एषा विश्वमोहिनी । पाशाङ्कुशधनुर्बाणधरा । एषा श्रीमहाविद्या । य एवं वेद स शोकं तरति ।।१५।। नमस्ते
    अस्तु भगवति मातरस्मान् पाहि सर्वतः ।।१६।। सैषाष्टौ वसवः । सैषैकादश रुद्राः । सैषा द्वादशादित्याः ।
    सैषा विश्वेदेवाः सोमपा असोमपाश्च । सैषा यातुधाना असुरा रक्षांसि पिशाचा यक्षाः सिद्धाः । सैषा सत्त्वरजस्तमांसि
    । सैषा ब्रह्मविष्णुरुद्ररूपिणी । सैषा प्रजापतीन्द्रमनवः । सैषा ग्रहनक्षत्रज्योतींसि । कलाकाष्ठादिकालरूपिणी
    । तामहं प्रणौमि नित्यम् ।। पापापहारिणीं देवीं भुक्तिमुक्तिप्रदायिनीम् । अनन्तां विजयां शुद्धां शरण्यां
    शिवदां शिवाम् ।।१७।। वियदीकारसंयुक्तं वीतिहोत्रसमन्वितम् । अर्धेन्दुलसितं देव्या बीजं सर्वार्थसाधनम्
    ।।१८।। एवमेकाक्षरं ब्रह्म यतयः शुद्धचेतसः । ध्यायन्ति परमानन्दमया ज्ञानाम्बुराशयः ।।१९।। वाङ्माया
    ब्रह्मसूस्तस्मात् षष्ठं वक्त्रसमन्वितम् । सूर्योऽवामश्रोत्रबिन्दुसंयुक्तष्टात्तृतीयकः । नारायणेन संमिश्रो
    वायुश्चाधरयुक् ततः । विच्चे नवार्णकोऽर्णः स्यान्महदानन्ददायकः ।।२०।। हृत्पुण्डरीकमध्यस्थां प्रातः
    सूर्यसमप्रभाम् । पाशाङ्कुशधरां सौम्यां वरदाभयहस्तकाम् । त्रिनेत्रां रक्तवसनां भक्तकामदुघां भजे ।।२१।।
    नमामि त्वां महादेवीं महाभयविनाशिनीम् । महादुर्गप्रशमनीं महाकारुण्यरूपिणीम् ।।२२।। यस्याः स्वरूपं ब्रह्मादयो
    न जानन्ति तस्मादुच्यते अज्ञेया । यस्या अन्तो न लभ्यते तस्मादुच्यते अनन्ता । यस्या लक्ष्यं नोपलक्ष्यते
    तस्मादुच्यते अलक्ष्या । यस्या जननं नोपलभ्यते तस्मादुच्यते अजा । एकैव सर्वत्र वर्तते तस्मादुच्यते एका
    । एकैव विश्वरूपिणी तस्मादुच्यते नैका । अतएवोच्यते अज्ञेयानन्तालक्ष्याजैका नैकेति ।।२३।। मन्त्राणां
    मातृका देवी शब्दानां ज्ञानरूपिणी । ज्ञानानां चिन्मयातीता शून्यानां शून्यसाक्षिणी । यस्याः परतरं नास्ति
    सैषा दुर्गा प्रकीर्तिता ।।२४।। तां दुर्गां दुर्गमां देवीं दुराचारविघातिनीम् । नमामि भवभीतोऽहं संसारार्णवतारिणीम्
    ।।२५।। इदमथर्वशीर्षं योऽधीते स पञ्चाथर्वशीर्षजपफलमाप्नोति । इदमथर्वशीर्षमज्ञात्वा योऽर्चां स्थापयति
