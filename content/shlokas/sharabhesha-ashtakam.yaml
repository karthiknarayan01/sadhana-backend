id: sharabhesha-ashtakam
category: stotram
name:
  english: Sharabhesha Ashtakam
content:
  english: shri shiva uvaca shrinu devi mahaguhyam param punyavivardhanam sharabheshashtakam mantram vakshyami
    tava tattvatah || rishinyasadikam yattatsarvapurvavadacaret dhyanabhedam visheshena vakshyamyahamatah
    shive || dhyanam jvalanakutilakesham suryacandragninetram nishitataranakhagroddhutahemabhadeham |
    sharabhamatha munindraih sevyamanam sitangam pranatabhayavinasham bhavayetpakshirajam || atha stotram
    devadidevaya jaganmayaya shivaya nalikanibhananaya | sharvaya bhimaya sharadhipaya namo'stu tubhyam
    sharabheshvaraya || || haraya bhimaya haripriyaya bhavaya shantaya paratparaya | mridaya rudraya vilocanaya
    namo'stu tubhyam sharabheshvaraya || || shitamshucudaya digambaraya srishtisthitidhvamsanakaranaya
    | jatakalapaya jitendriyaya namo'stu tubhyam sharabheshvaraya || || kalankakanthaya bhavantakaya kapalashulattakarambujaya
    | bhujangabhushaya purantakaya namo'stu tubhyam sharabheshvaraya || || shamadishatkaya yamantakaya
    yamadiyogashtakasiddhidaya | umadhinathaya puratanaya namo'stu tubhyam sharabheshvaraya || || ghrinadipashashtakavarjitaya
    khilikritasmatpathi purvagaya | gunadihinaya gunatrayaya namo'stu tubhyam sharabheshvaraya || || kalaya
    vedamritakandalaya kalyanakautuhalakaranaya | sthulaya sukshmaya svarupagaya namo'stu tubhyam sharabheshvaraya
    || || pancananayanilabhaskaraya pancashadarnadyaparakshayaya | pancakshareshaya jagaddhitaya namo'stu
    tubhyam sharabheshvaraya || || iti shri sharabheshashtakam ||
  devanagari: श्री शिव उवाच शृणु देवि महागुह्यं परं पुण्यविवर्धनं शरभेशाष्टकं मन्त्रं वक्ष्यामि तव तत्त्वतः
    ॥ ऋषिन्यासादिकं यत्तत्सर्वपूर्ववदाचरेत् ध्यानभेदं विशेषेण वक्ष्याम्यहमतः शिवे ॥ ध्यानं ज्वलनकुटिलकेशं
    सूर्यचन्द्राग्निनेत्रं निशिततरनखाग्रोद्धूतहेमाभदेहम् । शरभमथ मुनीन्द्रैः सेव्यमानं सिताङ्गं प्रणतभयविनाशं
    भावयेत्पक्षिराजम् ॥ अथ स्तोत्रं देवादिदेवाय जगन्मयाय शिवाय नालीकनिभाननाय । शर्वाय भीमाय शराधिपाय नमोऽस्तु
    तुभ्यं शरभेश्वराय ॥ ॥ हराय भीमाय हरिप्रियाय भवाय शान्ताय परात्पराय । मृडाय रुद्राय विलोचनाय नमोऽस्तु
    तुभ्यं शरभेश्वराय ॥ ॥ शीतांशुचूडाय दिगम्बराय सृष्टिस्थितिध्वंसनकारणाय । जटाकलापाय जितेन्द्रियाय नमोऽस्तु
    तुभ्यं शरभेश्वराय ॥ ॥ कलङ्ककण्ठाय भवान्तकाय कपालशूलात्तकराम्बुजाय । भुजङ्गभूषाय पुरान्तकाय नमोऽस्तु
    तुभ्यं शरभेश्वराय ॥ ॥ शमादिषट्काय यमान्तकाय यमादियोगाष्टकसिद्धिदाय । उमाधिनाथाय पुरातनाय नमोऽस्तु
    तुभ्यं शरभेश्वराय ॥ ॥ घृणादिपाशाष्टकवर्जिताय खिलीकृतास्मत्पथि पूर्वगाय । गुणादिहीनाय गुणत्रयाय नमोऽस्तु
    तुभ्यं शरभेश्वराय ॥ ॥ कालाय वेदामृतकन्दलाय कल्याणकौतूहलकारणाय । स्थूलाय सूक्ष्माय स्वरूपगाय नमोऽस्तु
    तुभ्यं शरभेश्वराय ॥ ॥ पञ्चाननायानिलभास्कराय पञ्चाशदर्णाद्यपराक्षयाय । पञ्चाक्षरेशाय जगद्धिताय नमोऽस्तु
    तुभ्यं शरभेश्वराय ॥ ॥ इति श्री शरभेशाष्टकम् ॥
