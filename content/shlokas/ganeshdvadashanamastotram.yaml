id: ganeshdvadashanamastotram
category: stotram
name:
  english: ganeshdvadashanamastotram
  devanagari: गणेश्द्वादशनामस्तोत्रम्
content:
  english: shriganeshadvadashanamastotram namavalisahitam shriganeshaya namah || shuklambaradharam vishnum
    shashivarnam caturbhujam | prasannavadanam dhyayetsarvavighnopashantayeh || 1|| abhipsitarthasiddhyartham
    pujito yah surasuraih | sarvavighnaharastasmai ganadhipataye namah || 2|| gananamadhipashcando gajavaktrastrilocanah
    | prasanno bhava me nityam varadatarvinayaka || 3|| sumukhashcaikadantashca kapilo gajakarnakah |
    lambodarashca vikato vighnanasho vinayakah || 4|| dhumraketurganadhyaksho bhalacandro gajananah |
    dvadashaitani namani ganeshasya tu yah pathet || 5|| vidyarthi labhate vidyam dhanarthi vipulam dhanam
    | ishtakamam tu kamarthi dharmarthi mokshamakshayam || 6|| vidyarambhe vivahe ca praveshe nirgame
    tatha | sangrame sankate caiva vighnastasya na jayate || 7|| iti mudgalapuranoktam shriganeshadvadashanamastotram
    sampurnam | shri ganesha dvadashanamavalih | om sumukhaya namah | 1| om ekadantaya namah | 2| om kapilaya
    namah | 3| om gajakarnakaya namah | 4| om lambodaraya namah | 5| om vikataya namah | 6| om vighnarajaya
    namah | 7| om vinayakaya namah | 8| om dhumaketave namah | 9| om ganadhyakshaya namah | 10| om bhalacandraya
    namah | 11| om gajananaya namah | 12|
  devanagari: श्रीगणेशद्वादशनामस्तोत्रम् नामावलीसहितम् श्रीगणेशाय नमः ॥ शुक्लाम्बरधरं विश्णुं शशिवर्णं
    चतुर्भुजम् । प्रसन्नवदनं ध्यायेत्सर्वविघ्नोपशान्तयेः ॥ १॥ अभीप्सितार्थसिद्ध्यर्थं पूजितो यः सुरासुरैः
    । सर्वविघ्नहरस्तस्मै गणाधिपतये नमः ॥ २॥ गणानामधिपश्चण्डो गजवक्त्रस्त्रिलोचनः । प्रसन्नो भव मे नित्यं
    वरदातर्विनायक ॥ ३॥ सुमुखश्चैकदन्तश्च कपिलो गजकर्णकः । लम्बोदरश्च विकटो विघ्ननाशो विनायकः ॥ ४॥ धूम्रकेतुर्गणाध्यक्षो
    भालचन्द्रो गजाननः । द्वादशैतानि नामानि गणेशस्य तु यः पठेत् ॥ ५॥ विद्यार्थी लभते विद्यां धनार्थि विपुलं
    धनम् । इष्टकामं तु कामार्थी धर्मार्थी मोक्षमक्षयम् ॥ ६॥ विद्यारंभे विवाहे च प्रवेशे निर्गमे तथा ।
    सङ्ग्रामे सङ्कटे चैव विघ्नस्तस्य न जायते ॥ ७॥ इति मुद्गलपुराणोक्तं श्रीगणेशद्वादशनामस्तोत्रं सम्पूर्णम्
    । श्री गणेश द्वादशनामावलिः । ॐ सुमुखाय नमः । १। ॐ एकदन्ताय नमः । २। ॐ कपिलाय नमः । ३। ॐ गजकर्णकाय
    नमः । ४। ॐ लम्बोदराय नमः । ५। ॐ विकटाय नमः । ६। ॐ विघ्नराजाय नमः । ७। ॐ विनायकाय नमः । ८। ॐ धूमकेतवे
    नमः । ९। ॐ गणाध्यक्षाय नमः । १०। ॐ भालचन्द्राय नमः । ११। ॐ गजाननाय नमः । १२।
