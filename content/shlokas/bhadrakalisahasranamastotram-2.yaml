    ऐं सौः शूर्पकर्णसमर्चिता ॥ ३४॥ ॐ श्रीं शिवा ह्सौः क्लीं क्लीं शिववामाङ्गवासिनी । ॐ श्रीं श्रूं सीधुमत्ता
    च श्रीं क्लीं सः सीधुपायिनी ॥ ३५॥ ॐ जुं सः शीतलाङ्गी च श्रीं हूं क्रीं शीघ्रगामिनी । श्रीं श्रीं श्यामाम्बरा
    स्वाहा श्रीं श्यामा श्रीं शवासना ॥ ३६॥ ॐ क्रीं गीं गोपवत्सा च ॐ क्लीं कौशिकसेविता । ॐ क्लीं कान्तिश्च
    क्रीं कुल्ला क्रौं कान्तारभुजप्रिया ॥ ३७॥ ॐ श्रीं शङ्का ह्सौः शिष्टा ॐ श्रीं शर्मप्रदायिनी । ॐ क्लीं
    श्रीं शङ्खहस्ता च ॐ श्रीं वं वेणूवादिनी ॥ ३८॥ श्रीं श्रीं ऐं ऐं ह्सौः क्लीं सः शम्बरारिमदातुरा । ॐ
    ऐं सौः सुरसेव्या च ऐं क्लीं सीरध्वजाश्रिता ॥ ३९॥ ॐ श्रीं ऐं क्लीं ह्सौः क्रीं हूं सुरापानपरायणा ।
    ॐ श्रीं सर्वसहा स्वाहा ॐ श्रीं सारोत्तमोत्तमा ॥ ४०॥ ॐ श्रीं ॐ उत्तमा ॐ ॐ ओङ्कारप्रणवात्मिका । ॐ प्रीं
    प्रत्यङ्गिरा स्वाहा ॐ श्रीं पर्वतनन्दिनी ॥ ४१॥ ॐ प्रीं पर्वतपक्षघ्नी ॐ प्रीं पीताम्बरप्रिया । ॐ श्रीं
    प्रीं पाशहस्ता च ॐ प्रीं पट्टिसधारिणी ॥ ४२॥ ॐ श्रीं पूतासुगन्धाढ्या ॐ प्रीं पद्मावती पयः । ॐ प्रीं
    पतिव्रता स्वाहा प्रीं श्रीं पानपरायणा ॥ ४३॥ ॐ श्रीं ह्रीं पांसुला ॐ श्रीं ह्रीं प्रीं पवनगामिनी ।
    पवनात्मजसेव्या ॐ क्लीं श्रीं बीजमयी पयः ॥ ४४॥ ॐ ऐं एकाक्षरी स्वाहा ॐ ह्रीं श्रीं क्लीं च पार्वती ।
    ह्रां हूं शम्भुजटाभारा ॐ शरश्चन्द्रलेपिता ॥ ४५॥ ॐ श्रीं ऐं सौः रसानन्दा सुनन्दा श्रीं ह्सौः सुयता
    । ॐ ह्रीं श्रीं क्लीं ह्सौः राज्ञी ॐ श्रीं राज्यप्रदायिनी ॥ ४६॥ ॐ ह्रीं श्रीं रमणी ॐ श्रीं रेवाश्रीमदनातुरा
    । ऐं सौः रम्भोपमोरु च ऐं सौः क्लीं रामवल्लभा ॥ ४७॥ ऐं सौः श्रीं रेवती स्वाहा ऐं क्लीं आरामवासिनी ।
    ॐ श्रीं राज्यप्रदा स्वाहा ॐ श्रीं रावणघातिनी ॥ ४८॥ ॐ रां राघवसेव्या च ॐ ह्रीं श्रीं रोहिणी पयः । ॐ
    श्रीं ऐं सौः ह्सौः क्लीं श्रीं रेवतीरमणप्रिया ॥ ४९॥ ॐ श्रीं इं रां च इन्द्रा ॐ इं इन्द्रसमाश्रिता
    । ॐ ह्रीं श्रीं ऐं च इन्द्राक्षी ऐं श्रीं वृत्रनिसूदिनी ॥ ५०॥ ॐ श्रीं वृत्रारि रोघग्नी ॐ वृत्रासूरपूजिता
