id: sri-venkateswara-saranagati-stotram-saptarshi-krutam
category: stotram
name:
  english: Sri Venkateswara Saranagati Stotram (Saptarshi Krutam)
content:
  english: sheshacalam samasadya kashyapadya maharshayah | venkatesham ramanatham sharanam prapuranjasa
    || || kalisantarakam mukhyam stotrametajjapennarah | saptarshivakprasadena vishnustasmai prasidati
    || kadihrimantavidyayah prapyaiva paradevata | kalau shrivenkateshakhya tamaham sharanam bhaje ||
    akaradikshakarantavarnairyah pratipadyate | kalau sa venkateshakhyah sharanam me ramapatih || bhagavan
    bhargavikanto bhaktabhipsitadayakah | bhaktasya venkateshakhyo bharadvajasya me gatih || viradvishnurvidhata
    ca vishvavijnanavigrahah | vishvamitrasya sharanam venkatesho vibhuh sada || gaurgaurishapriyo nityam
    govindo gopatirvibhuh | sharanam gautamasyastu venkatadrishiromanih || jagatkarta jagadbharta jagaddharta
    jaganmayah | jamadagneh prapannasya jivesho venkateshvarah || vastuvijnanamatram yannirvishesham sukham
    ca sat | tadbrahmaivahamasmiti venkatesham bhaje sada || || saptarshiracitam stotram sarvada yah pathennarah
    | so'bhayam prapnuyatsatyam sarvatra vijayi bhavet || || iti saptarshibhih kritam shri venkateshvara
    sharanagati stotram |
  devanagari: शेषाचलं समासाद्य कश्यपाद्या महर्षयः । वेङ्कटेशं रमानाथं शरणं प्रापुरञ्जसा ॥ ॥ कलिसन्तारकं
    मुख्यं स्तोत्रमेतज्जपेन्नरः । सप्तर्षिवाक्प्रसादेन विष्णुस्तस्मै प्रसीदति ॥ कादिह्रीमन्तविद्यायाः
    प्राप्यैव परदेवता । कलौ श्रीवेङ्कटेशाख्या तामहं शरणं भजे ॥ अकारादिक्षकारान्तवर्णैर्यः प्रतिपाद्यते
    । कलौ स वेङ्कटेशाख्यः शरणं मे रमापतिः ॥ भगवान् भार्गवीकान्तो भक्ताभीप्सितदायकः । भक्तस्य वेङ्कटेशाख्यो
    भरद्वाजस्य मे गतिः ॥ विराड्विष्णुर्विधाता च विश्वविज्ञानविग्रहः । विश्वामित्रस्य शरणं वेङ्कटेशो विभुः
    सदा ॥ गौर्गौरीशप्रियो नित्यं गोविन्दो गोपतिर्विभुः । शरणं गौतमस्यास्तु वेङ्कटाद्रिशिरोमणिः ॥ जगत्कर्ता
    जगद्भर्ता जगद्धर्ता जगन्मयः । जमदग्नेः प्रपन्नस्य जीवेशो वेङ्कटेश्वरः ॥ वस्तुविज्ञानमात्रं यन्निर्विशेषं
    सुखं च सत् । तद्ब्रह्मैवाहमस्मीति वेङ्कटेशं भजे सदा ॥ ॥ सप्तर्षिरचितं स्तोत्रं सर्वदा यः पठेन्नरः
    । सोऽभयं प्राप्नुयात्सत्यं सर्वत्र विजयी भवेत् ॥ ॥ इति सप्तर्षिभिः कृतं श्री वेङ्कटेश्वर शरणागति स्तोत्रम्
    ।
