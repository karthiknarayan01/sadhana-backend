id: subrahmanya-bhujanga-prayata-stotram
category: stotram
name:
  english: Subrahmanya Bhujanga Prayata Stotram
content:
  english: bhaje'ham kumaram bhavanikumaram galollasiharam namatsadviharam | ripustomaparam nrisimhavataram
    sadanirvikaram guham nirvicaram || || namamishaputram japashonagatram suraratishatrum ravindvagninetram
    | mahabarhipatram shivasyabjamitram prabhasvatkalatram puranam pavitram || prabhavajjvalam tam manohari
    manikya bhushojjvalam tam | shritanamabhishtam nishantam nitantam bhaje shanmukham tam sharaccandrakantam
    || || kripavari kallolabhasvatkataksham virajanmanohari shonambujaksham | prayogapradanapravahaikadaksham
    bhaje kantikantam parastomaraksham || || sukasturisindurabhasvallalatam dayapurnacittam mahadevaputram
    | ravindullasadratnarajatkiritam bhaje kriditakasha gangadrikutam || || sukundaprasunavalishobhitangam
    sharatpurnacandraprabhakantikantam | shirishaprasunabhiramam bhavantam bhaje devasenapatim vallabham
    tam || || sulavanyasatsuryakotipratikam prabhum tarakarim dvishadbahumisham | nijankaprabhadivyamanapadisham
    bhaje parvatipranaputram sukesham || || ajam sarvalokapriyam lokanatham guham shurapadmadidambholidharam
    | sucarum sunasaputam saccaritram bhaje kartikeyam sada bahuleyam || || shararanyasambhutamindradivandyam
    dvishadbahusankhyayudhashreniramyam | marutsarathim kukkutesham suketum bhaje yogihritpadmamadhyadhivasam
    || || virincindravallisha deveshamukhyam prashastamarastomasamstuyamanam | disha tvam dayalo shriyam
    nishcalam me vina tvam gatih ka prabho me prasida || || padambhojaseva samayatabrinda rakashrenikotirabhasvallalatam
    | kalatrollasatparshvayugmam varenyam bhaje devamadyantahinaprabhavam || || bhavambhodhimadhye tarange
    patantam prabho mam sada purnadrishtya samikshya | bhavadbhaktinavoddhara tvam dayalo sugatyantaram
    nasti deva prasida || || gale ratnabhusham tanau manjuvesham kare jnanashaktim darasmeramasye | katinyastapanim
    shikhistham kumaram bhaje'ham guhadanyadevam na manye || || dayahinacittam paradrohapatram sada papashilam
    gurorbhaktihinam | ananyavalambam bhavannetrapatram kripashila mam bho pavitram kuru tvam || || mahasena
    gangeya vallisahaya prabho tarakare shadasyamaresha | sada payasannapradatarguheti smarishyami bhaktya
    sadaham vibho tvam || || pratapasya baho namadvirabaho prabho kartikeyeshtakamapradeti | yada ye pathante
    bhavantam tadevam prasannastu tesham bahushrim dadasi || || aparatidaridryavarashimadhye bhramantam
    janagrahapurne nitantam | mahasena mamuddhara tvam kataksha valokena kincitprasida prasida || || sthiram
    dehi bhaktim bhavatpadapadme shriyam nishcalam dehi mahyam kumara | guham candrataram suvamshabhivriddhim
    kuru tvam prabho me manah kalpasalah || || namaste namaste mahashaktipane namaste namaste lasadvajrapane
    | namaste namaste katinyastapane namaste namaste sadabhishtapane || || namaste namaste mahashaktidharin
    namaste suranam mahasaukhyadayin | namaste sada kukkuteshakhyaka tvam samastaparadham vibho me kshamasva
    || || kumaratparam karmayogam na jane kumaratparam karmashilam na jane | ya eko muninam hridabjadhivasah
    shivankam samaruhya satpithakalpam || || virincaya mantropadesham cakara pramodena so'yam tanotu shriyam
    me | yamahuh param veda shureshu mukhyam sada yasya shaktya jagatbhitabhita || || yamashritya devah
    sthiram svargapalah sadonkararupam cidanandamide | guhastotrametat kritam tarakare bhujangaprayatena
    hridyena kantam || || jana ye pathante mahabhaktiyuktah pramodena sayam prabhate visheshah | na janmarkshayoge
    yada te rudanta manovanchitan sarvakaman labhante || || iti shri subrahmanya bhujanga prayata stotram
    |
  devanagari: भजेऽहं कुमारं भवानीकुमारं गलोल्लासिहारं नमत्सद्विहारम् । रिपुस्तोमपारं नृसिंहावतारं सदानिर्विकारं
    गुहं निर्विचारम् ॥ ॥ नमामीशपुत्रं जपाशोणगात्रं सुरारातिशत्रुं रवीन्द्वग्निनेत्रम् । महाबर्हिपत्रं
    शिवास्याब्जमित्रं प्रभास्वत्कलत्रं पुराणं पवित्रम् ॥ प्रभावज्ज्वलं तं मनोहारि माणिक्य भूषोज्ज्वलं
    तम् । श्रितानामभीष्टं निशान्तं नितान्तं भजे षण्मुखं तं शरच्चन्द्रकान्तम् ॥ ॥ कृपावारि कल्लोलभास्वत्कटाक्षं
    विराजन्मनोहारि शोणाम्बुजाक्षम् । प्रयोगप्रदानप्रवाहैकदक्षं भजे कान्तिकान्तं परस्तोमरक्षम् ॥ ॥ सुकस्तूरिसिन्दूरभास्वल्ललाटं
    दयापूर्णचित्तं महादेवपुत्रम् । रवीन्दूल्लसद्रत्नराजत्किरीटं भजे क्रीडिताकाश गङ्गाद्रिकूटम् ॥ ॥ सुकुन्दप्रसूनावलीशोभिताङ्गं
    शरत्पूर्णचन्द्रप्रभाकान्तिकान्तम् । शिरीषप्रसूनाभिरामं भवन्तं भजे देवसेनापतिं वल्लभं तम् ॥ ॥ सुलावण्यसत्सूर्यकोटिप्रतीकं
    प्रभुं तारकारिं द्विषड्बाहुमीशम् । निजाङ्कप्रभादिव्यमानापदीशं भजे पार्वतीप्राणपुत्रं सुकेशम् ॥ ॥ अजं
    सर्वलोकप्रियं लोकनाथं गुहं शूरपद्मादिदम्भोलिधारम् । सुचारुं सुनासापुटं सच्चरित्रं भजे कार्तिकेयं सदा
    बाहुलेयम् ॥ ॥ शरारण्यसम्भूतमिन्द्रादिवन्द्यं द्विषड्बाहुसङ्ख्यायुधश्रेणिरम्यम् । मरुत्सारथिं कुक्कुटेशं
    सुकेतुं भजे योगिहृत्पद्ममध्याधिवासम् ॥ ॥ विरिञ्चीन्द्रवल्लीश देवेशमुख्यं प्रशस्तामरस्तोमसंस्तूयमानम्
    । दिश त्वं दयालो श्रियं निश्चलां मे विना त्वां गतिः का प्रभो मे प्रसीद ॥ ॥ पदाम्भोजसेवा समायातबृन्दा
    रकश्रेणिकोटीरभास्वल्ललाटम् । कलत्रोल्लसत्पार्श्वयुग्मं वरेण्यं भजे देवमाद्यन्तहीनप्रभावम् ॥ ॥ भवाम्भोधिमध्ये
    तरङ्गे पतन्तं प्रभो मां सदा पूर्णदृष्ट्या समीक्ष्य । भवद्भक्तिनावोद्धर त्वं दयालो सुगत्यन्तरं नास्ति
    देव प्रसीद ॥ ॥ गले रत्नभूषं तनौ मञ्जुवेषं करे ज्ञानशक्तिं दरस्मेरमास्ये । कटिन्यस्तपाणिं शिखिस्थं
    कुमारं भजेऽहं गुहादन्यदेवं न मन्ये ॥ ॥ दयाहीनचित्तं परद्रोहपात्रं सदा पापशीलं गुरोर्भक्तिहीनम् । अनन्यावलम्बं
    भवन्नेत्रपात्रं कृपाशील मां भो पवित्रं कुरु त्वम् ॥ ॥ महासेन गाङ्गेय वल्लीसहाय प्रभो तारकारे षडास्यामरेश
    । सदा पायसान्नप्रदातर्गुहेति स्मरिष्यामि भक्त्या सदाहं विभो त्वाम् ॥ ॥ प्रतापस्य बाहो नमद्वीरबाहो
    प्रभो कार्तिकेयेष्टकामप्रदेति । यदा ये पठन्ते भवन्तं तदेवं प्रसन्नस्तु तेषां बहुश्रीं ददासि ॥ ॥ अपारातिदारिद्र्यवाराशिमध्ये
    भ्रमन्तं जनग्राहपूर्णे नितान्तम् । महासेन मामुद्धर त्वं कटाक्षा वलोकेन किञ्चित्प्रसीद प्रसीद ॥ ॥ स्थिरां
    देहि भक्तिं भवत्पादपद्मे श्रियं निश्चलां देहि मह्यं कुमार । गुहं चन्द्रतारं सुवंशाभिवृद्धिं कुरु त्वं
    प्रभो मे मनः कल्पसालः ॥ ॥ नमस्ते नमस्ते महाशक्तिपाणे नमस्ते नमस्ते लसद्वज्रपाणे । नमस्ते नमस्ते कटिन्यस्तपाणे
    नमस्ते नमस्ते सदाभीष्टपाणे ॥ ॥ नमस्ते नमस्ते महाशक्तिधारिन् नमस्ते सुराणां महासौख्यदायिन् । नमस्ते
    सदा कुक्कुटेशाख्यक त्वं समस्तापराधं विभो मे क्षमस्व ॥ ॥ कुमारात्परं कर्मयोगं न जाने कुमारात्परं कर्मशीलं
    न जाने । य एको मुनीनां हृदब्जाधिवासः शिवाङ्कं समारुह्य सत्पीठकल्पम् ॥ ॥ विरिञ्चाय मन्त्रोपदेशं चकार
    प्रमोदेन सोऽयं तनोतु श्रियं मे । यमाहुः परं वेद शूरेषु मुख्यं सदा यस्य शक्त्या जगत्भीतभीता ॥ ॥ यमाश्रित्य
    देवाः स्थिरं स्वर्गपालाः सदोङ्काररूपं चिदानन्दमीडे । गुहस्तोत्रमेतत् कृतं तारकारे भुजङ्गप्रयातेन हृद्येन
    कान्तम् ॥ ॥ जना ये पठन्ते महाभक्तियुक्ताः प्रमोदेन सायं प्रभाते विशेषः । न जन्मर्क्षयोगे यदा ते रुदान्ता
    मनोवाञ्छितान् सर्वकामान् लभन्ते ॥ ॥ इति श्री सुब्रह्मण्य भुजङ्ग प्रयात स्तोत्रम् ।
