id: shrikamalajadayitashtakam
category: stotram
name:
  english: shrikamalajadayitashtakam
  devanagari: श्रीकमलजदयिताष्टकम्
content:
  english: tsampadyastikyabuddhim shrutiguruvacaneshvadaram bhaktidardhyam | devacaryadvijadishvapi manunivahe
    tavakine nitantam vidyam shuddham ca buddhim kamalajadayite satvaram dehi mahyam || 3|| vidyamudrakshamalamritaghatavilasatpanipathojajale
    vidyadanapravine jadabadhiramukhebhyo'pi shighram natebhyah | kamadinantaranmatsahajaripuvarandevi
    nirmulya vegat vidyam shuddham ca buddhim kamalajadayite satvaram dehi mahyam || 4|| karmasvatmociteshu
    sthirataradhishanam dehadardhyam tadartham dirgham cayuryashashca tribhuvanaviditam papamargadviraktim
    | satsangam satkathayah shravanamapi sada devi datva kripabdhe vidyam shuddham ca buddhim kamalajadayite
    satvaram dehi mahyam || 5|| matastvatpadapadmam na vividhakusumaih pujitam jatu bhaktya gatum naivahamishe
    jadamatiralasastvadgunandivyapadyaih | muke sevavihine'pyanupamakarunamarbhake'mbeva kritva vidyam
    shuddham ca buddhim kamalajadayite satvaram dehi mahyam || 6|| shantyadyah sampado vitara shubhakarirnityatadbhinnabodham
    vairagyam mokshavanchamapi laghu kalaya shrishivasevyamane | vidyatirthadiyogipravarakarasarojatasampujitanghre
    vidyam shuddham ca buddhim kamalajadayite satvaram dehi mahyam || 7|| saccidrupatmano me shrutimanananididhyasananyashu
    matah sampadya svantametadruciyutamanisham nirvikalpe samadhau | tungatirankarajadvaragrihavilasaccakrarajasanasthe
    vidyam shuddham ca buddhim kamalajadayite satvaram dehi mahyam || 8|| iti shrishivabhinavanrisimhabharatisvamiviracitam
    shrikamalajadayitashtakam sampurnam |
  devanagari: त्सम्पाद्यास्तिक्यबुद्धिं श्रुतिगुरुवचनेष्वादरं भक्तिदार्ढ्यम् । देवाचार्यद्विजादिष्वपि
    मनुनिवहे तावकीने नितान्तं विद्यां शुद्धां च बुद्धिं कमलजदयिते सत्वरं देहि मह्यम् ॥ ३॥ विद्यामुद्राक्षमालामृतघटविलसत्पाणिपाथोजजाले
    विद्यादानप्रवीणे जडबधिरमुखेभ्योऽपि शीघ्रं नतेभ्यः । कामादीनान्तरान्मत्सहजरिपुवरान्देवि निर्मूल्य वेगात्
    विद्यां शुद्धां च बुद्धिं कमलजदयिते सत्वरं देहि मह्यम् ॥ ४॥ कर्मस्वात्मोचितेषु स्थिरतरधिषणां देहदार्ढ्यं
    तदर्थं दीर्घं चायुर्यशश्च त्रिभुवनविदितं पापमार्गाद्विरक्तिम् । सत्सङ्गं सत्कथायाः श्रवणमपि सदा देवि
    दत्वा कृपाब्धे विद्यां शुद्धां च बुद्धिं कमलजदयिते सत्वरं देहि मह्यम् ॥ ५॥ मातस्त्वत्पादपद्मं न विविधकुसुमैः
    पूजितं जातु भक्त्या गातुं नैवाहमीशे जडमतिरलसस्त्वद्गुणान्दिव्यपद्यैः । मूके सेवाविहीनेऽप्यनुपमकरुणामर्भकेऽम्बेव
    कृत्वा विद्यां शुद्धां च बुद्धिं कमलजदयिते सत्वरं देहि मह्यम् ॥ ६॥ शान्त्याद्याः सम्पदो वितर शुभकरीर्नित्यतद्भिन्नबोधं
    वैराग्यं मोक्षवाञ्छामपि लघु कलय श्रीशिवासेव्यमाने । विद्यातीर्थादियोगिप्रवरकरसरोजातसम्पूजिताङ्घ्रे
    विद्यां शुद्धां च बुद्धिं कमलजदयिते सत्वरं देहि मह्यम् ॥ ७॥ सच्चिद्रूपात्मनो मे श्रुतिमनननिदिध्यासनान्याशु
    मातः सम्पाद्य स्वान्तमेतद्रुचियुतमनिशं निर्विकल्पे समाधौ । तुङ्गातीराङ्कराजद्वरगृहविलसच्चक्रराजासनस्थे
    विद्यां शुद्धां च बुद्धिं कमलजदयिते सत्वरं देहि मह्यम् ॥ ८॥ इति श्रीशिवाभिनवनृसिंहभारतीस्वामिविरचितं
    श्रीकमलजदयिताष्टकं सम्पूर्णम् ।
