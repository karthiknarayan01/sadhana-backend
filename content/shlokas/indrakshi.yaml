id: indrakshi
category: stotram
name:
  english: indrakshi
  devanagari: इन्द्राक्शि
content:
  english: sahasrattu labhate vanchitam phalam || 5|| rajanam ca samapnoti indrakshim natra samshaya |
    nabhimatre jale sthitva sahasraparisamkhyaya || 6|| japet stotramidam mantram vacasiddhirbhaveddhruvam
    | sayam pratah pathennityam shanmasaih siddhirucyate || 7|| samvatsaramupashritya sarvakamarthasiddhaye
    | anena vidhina bhaktya mantrasiddhih prajayate || 8|| santushta ca bhaveddevi pratyaksha samprajayate
    | ashtamyam ca caturdashyamidam stotram pathennarah || 9|| dhavatastasya nashyanti vighnasamkhya na
    samshayah | karagrihe yada baddho madhyaratre tada japet || 10|| divasatrayamatrena mucyate natra
    samshayah | sakamo japate stotram mantrapujavicaratah || 11|| pancadhikairdashadityairiyam siddhistu
    jayate | raktapushpai raktavastrai raktacandanacarcitaih || 12|| dhupadipaishca naivedyaih prasanna
    bhagavati bhavet | evam sampujya indrakshimindrena paramatmana || 13|| varam labdham diteh putra bhagavatyah
    prasadatah | etat stotram mahapunyam japyamayushyavardhanam || 14|| jvaratisara
  devanagari: सहस्रात्तु लभते वाञ्छितं फलम् ॥ ५॥ राजानं च समाप्नोति इन्द्राक्षीं नात्र संशय । नाभिमात्रे
    जले स्थित्वा सहस्रपरिसंख्यया ॥ ६॥ जपेत् स्तोत्रमिदं मन्त्रं वाचासिद्धिर्भवेद्ध्रुवम् । सायं प्रातः
    पठेन्नित्यं षण्मासैः सिद्धिरुच्यते ॥ ७॥ संवत्सरमुपाश्रित्य सर्वकामार्थसिद्धये । अनेन विधिना भक्त्या
    मन्त्रसिद्धिः प्रजायते ॥ ८॥ सन्तुष्टा च भवेद्देवी प्रत्यक्षा सम्प्रजायते । अष्टम्यां च चतुर्दश्यामिदं
    स्तोत्रं पठेन्नरः ॥ ९॥ धावतस्तस्य नश्यन्ति विघ्नसंख्या न संशयः । कारागृहे यदा बद्धो मध्यरात्रे तदा
    जपेत् ॥ १०॥ दिवसत्रयमात्रेण मुच्यते नात्र संशयः । सकामो जपते स्तोत्रं मन्त्रपूजाविचारतः ॥ ११॥ पञ्चाधिकैर्दशादित्यैरियं
    सिद्धिस्तु जायते । रक्तपुष्पै रक्तवस्त्रै रक्तचन्दनचर्चितैः ॥ १२॥ धूपदीपैश्च नैवेद्यैः प्रसन्ना भगवती
    भवेत् । एवं सम्पूज्य इन्द्राक्षीमिन्द्रेण परमात्मना ॥ १३॥ वरं लब्धं दितेः पुत्रा भगवत्याः प्रसादतः
    । एतत् स्तोत्रं महापुण्यं जप्यमायुष्यवर्धनम् ॥ १४॥ ज्वरातिसार
