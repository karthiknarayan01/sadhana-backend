id: suryashtottarashatanamastotram
category: stotram
name:
  english: suryashtottarashatanamastotram
  devanagari: सूर्याष्टोत्तरशतनामस्तोत्रम्
content:
  english: rinushvavahito rajan shucirbhutva samahitah | kshanam ca kuru rajendra guhyam vakshyami te
    hitam || 1|| dhaumyena tu yatha proktam parthaya sumahatmane | namnamashtottaram punyam shatam tacchrinu
    bhupate || 2|| om suryo'ryama bhagastvashta pusharkah savita ravih | gabhastimanajah kalo mrityurdhata
    prabhakarah || 3|| prithivyapashca tejashca kham vayushca parayanam | somo brihaspatih shukro budho'ngaraka
    eva ca || 4|| indro vivasvandiptamshuh shucih shaurih shanaishcarah | brahma vishnushca rudrashca
    skando vaishravano yamah || 5|| vaidyuto jatharashcagniraindhanastejasam patih | dharmadhvajo vedakarta
    vedango vedavahanah || 6|| kritam treta dvaparashca kalih sarvamarashrayah | kala kashtha muhurtashca
    paksha masa ritustatha || 7|| samvatsarakaro'shvatthah kalacakro vibhavasuh | purushah shashvato yogi
    vyaktavyaktah sanatanah || 8|| lokadhyakshah prajadhyaksho vishvakarma tamonudah | kaladhyakshah varunah
    sagarom'shushca jimuto jivano'riha || 9|| bhutashrayo bhutapatih sarvalokanamaskritah | srashta samvartako
    vahnih sarvasyadiralolupah || 10|| anantah kapilo bhanuh kamadah sarvatomukhah | jayo vishalo varadah
    sarvadhatunishecita || 11|| sarvabhutanishevitah manah suparno bhutadih shighragah pranadharanah ||
    dhanvantarirdhumaketuradidevo'diteh sutah || 12|| dvadashatmaravindakshah pita mata pitamahah | svargadvaram
    prajadvaram mokshadvaram trivishtapam || 13|| dehakarta prashantatma vishvatma vishvatomukhah | caracaratma
    sukshmatma maitrena vapushanvitah || 14|| etadvai kirtaniyasya suryasyaiva mahatmanah | suryasyamitatejasah
    namnamashtashatam punyam shakrenoktam mahatmana || 15|| proktametatsvyambhuva shakracca naradah prapto
    dhaumyashca tadanantaram | dhaumyadyudhishthirah prapya sarvankamanavaptavan || 16|| surapitriganayakshasevitam
    hyasuranishacarasiddhavanditam | varakanakahutashanaprabham tvamapi manasyabhidhehi bhaskaram || 17||
    suryodaye yastu samahitah pathetsa putralabham dhanaratnasancayan | labheta jatismaratam sada narah
    smritim ca medham ca sa vindate param || 18|| imam stavam devavarasya yo narah prakirtayecchucisumanah
    samahitah | vimucyate shokadavagnisagarallabheta kamanmanasa yathepsitan || 19|| svarbhuvarbhuromiti
    digvimokah | harih om tatsat | shrisuryanarayanaparabrahmarpanamastu | || iti shrimahabharate yudhishthiradhaumyasamvade
    aranyakaparvani shrisuryashtottarashatanamastotram sampurnam || iti brahmapurane trayastrimshadhyayantargatam
    suryanamashtottarashatastotram samaptam | brahmapurana | adhyaya 33
  devanagari: ृणुष्वावहितो राजन् शुचिर्भूत्वा समाहितः । क्षणं च कुरु राजेन्द्र गुह्यं वक्ष्यामि ते हितम्
    ॥ १॥ धौम्येन तु यथा प्रोक्तं पार्थाय सुमहात्मने । नाम्नामष्टोत्तरं पुण्यं शतं तच्छृणु भूपते ॥ २॥ ॐ
    सूर्योऽर्यमा भगस्त्वष्टा पूषार्कः सविता रविः । गभस्तिमानजः कालो मृत्युर्धाता प्रभाकरः ॥ ३॥ पृथिव्यापश्च
    तेजश्च खं वायुश्च परायणम् । सोमो बृहस्पतिः शुक्रो बुधोऽङ्गारक एव च ॥ ४॥ इन्द्रो विवस्वान्दीप्तांशुः
    शुचिः शौरिः शनैश्चरः । ब्रह्मा विष्णुश्च रुद्रश्च स्कन्दो वैश्रवणो यमः ॥ ५॥ वैद्युतो जाठरश्चाग्निरैन्धनस्तेजसां
    पतिः । धर्मध्वजो वेदकर्ता वेदाङ्गो वेदवाहनः ॥ ६॥ कृतं त्रेता द्वापरश्च कलिः सर्वामराश्रयः । कला काष्ठा
    मुहुर्ताश्च पक्षा मासा ऋतुस्तथा ॥ ७॥ संवत्सरकरोऽश्वत्थः कालचक्रो विभावसुः । पुरुषः शाश्वतो योगी व्यक्ताव्यक्तः
    सनातनः ॥ ८॥ लोकाध्यक्षः प्रजाध्यक्षो विश्वकर्मा तमोनुदः । कालाध्यक्षः वरुणः सागरोंऽशुश्च जीमूतो जीवनोऽरिहा
    ॥ ९॥ भूताश्रयो भूतपतिः सर्वलोकनमस्कृतः । स्रष्टा संवर्तको वह्निः सर्वस्यादिरलोलुपः ॥ १०॥ अनन्तः कपिलो
    भानुः कामदः सर्वतोमुखः । जयो विशालो वरदः सर्वधातुनिषेचिता ॥ ११॥ सर्वभूतनिषेवितः मनः सुपर्णो भूतादिः
    शीघ्रगः प्राणधारणः ॥ धन्वन्तरिर्धूमकेतुरादिदेवोऽदितेः सुतः ॥ १२॥ द्वादशात्मारविन्दाक्षः पिता माता
    पितामहः । स्वर्गद्वारं प्रजाद्वारं मोक्षद्वारं त्रिविष्टपम् ॥ १३॥ देहकर्ता प्रशान्तात्मा विश्वात्मा
    विश्वतोमुखः । चराचरात्मा सूक्ष्मात्मा मैत्रेण वपुषान्वितः ॥ १४॥ एतद्वै कीर्तनीयस्य सूर्यस्यैव महात्मनः
    । सूर्यस्यामिततेजसः नाम्नामष्टशतं पुण्यं शक्रेणोक्तं महात्मना ॥ १५॥ प्रोक्तमेतत्स्व्यम्भुवा शक्राच्च
    नारदः प्राप्तो धौम्यश्च तदनन्तरम् । धौम्याद्युधिष्ठिरः प्राप्य सर्वान्कामानवाप्तवान् ॥ १६॥ सुरपितृगणयक्षसेवितं
    ह्यसुरनिशाचरसिद्धवन्दितम् । वरकनकहुताशनप्रभं त्वमपि मनस्यभिधेहि भास्करम् ॥ १७॥ सूर्योदये यस्तु समाहितः
    पठेत्स पुत्रलाभं धनरत्नसञ्चयान् । लभेत जातिस्मरतां सदा नरः स्मृतिं च मेधां च स विन्दते पराम् ॥ १८॥
    इमं स्तवं देववरस्य यो नरः प्रकीर्तयेच्छुचिसुमनाः समाहितः । विमुच्यते शोकदवाग्निसागराल्लभेत कामान्मनसा
    यथेप्सितान् ॥ १९॥ स्वर्भुवर्भूरोमिति दिग्विमोकः । हरिः ओं तत्सत् । श्रीसूर्यनारायणपरब्रह्मार्पणमस्तु
    । ॥ इति श्रीमहाभारते युधिष्ठिरधौम्यसंवादे आरण्यकपर्वणि श्रीसूर्याष्टोत्तरशतनामस्तोत्रं सम्पूर्णम्
    ॥ इति ब्रह्मपुराणे त्रयस्त्रिंशाध्यायान्तर्गतं सूर्यनामाष्टोत्तरशतस्तोत्रं समाप्तम् । ब्रह्मपुराण
    । अध्याय ३३
