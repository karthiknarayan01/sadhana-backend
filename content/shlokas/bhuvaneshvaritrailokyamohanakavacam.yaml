id: bhuvaneshvaritrailokyamohanakavacam
category: kavacha
name:
  english: bhuvaneshvaritrailokyamohanakavacam
  devanagari: भुवनेश्वरीत्रैलोक्यमोहनकवचम्
content:
  english: dustaram padam taraya taraya pranavadvayam | svaha iti mahavidya januni me sada'vatu || 9||
    aim sauh om aim klim phat svaha janghe'vyad bhuvaneshvari | om hrim shrim klim aim phat payat padau
    me bhuvaneshvari || 10|| om om hrim hrim shrim shrim klim klim aim aim sauh sauh vada vada | vagvadiniti
    ca devi vidya ya vishvavyapini || 11|| sauhsauhsauh aimaimaim klinklinklim shrimshrimshrim hrimhrimhrim
    om | om om caturdashatmika vidya payat bahu tu me || 12|| sakalam sarvabhitibhyah shariram bhuvaneshvari
    | om hrim shrim indradigbhage payanme caparajita || 13|| strim aim hrim vijaya payadindumadagnidiksthale
    | om shrim sauh klim jaya patu yamyam mam kavacanvitam || 14|| hrim hrim aim sauh hasauh payannairritirmam
    tu paratmika | om shrim shrim hrim sada payat pashcime brahmarupini || 15|| om hram sauh mam bhayad
    rakshed vayavyam mantrarupini | aim klim shrim sauh sada'vyanmam kauveryam naganandini || 16|| om
    hrim shrim klim mahadevi aishanyam patu nityashah | om hrim mantramayi vidya payadurdhvam sureshvari
    || 17|| om hrim shrim klim aim mam payadadhastha bhuvaneshvari | evam dashadisho rakshet sarvamantramayo
    shiva || 18|| prabhate patu camunda shrim klim aim sauh svarupini | madhyahne'vyanmamamba shrim hrim
    klim aim sauh svarupini || 19|| sayam payadumadevi aim hrim klim sauh svarupini | nishadau patu rudrani
    om klim krim sauh svarupini || 20|| nishithe patu brahmani krim hrum hrim hrim svarupini | nishante
    vaishnavi payadomai hrim klim svarupini || 21|| sarvakale ca mam payado hrim shrim bhuvaneshvari |
    esha vidya maya gupta tantrebhyashcapi sampratam || 22|| phalashrutih
  devanagari: दुस्तरं पदं तारय तारय प्रणवद्वयम् । स्वाहा इति महाविद्या जानुनि मे सदाऽवतु ॥ ९॥ ऐं सौः ॐ
    ऐं क्लीं फट् स्वाहा जङ्घेऽव्याद् भुवनेश्वरी । ॐ ह्रीं श्रीं क्लीं ऐं फट् पायात् पादौ मे भुवनेश्वरी
    ॥ १०॥ ॐ ॐ ह्रीं ह्रीं श्रीं श्रीं क्लीं क्लीं ऐं ऐं सौः सौः वद वद । वाग्वादिनीति च देवि विद्या या
    विश्वव्यापिनी ॥ ११॥ सौःसौःसौः ऐंऐंऐं क्लीङ्क्लीङ्क्लीं श्रींश्रींश्रीं ह्रींह्रींह्रीं ॐ । ॐ ॐ चतुर्दशात्मिका
    विद्या पायात् बाहू तु मे ॥ १२॥ सकलं सर्वभीतिभ्यः शरीरं भुवनेश्वरी । ॐ ह्रीं श्रीं इन्द्रदिग्भागे पायान्मे
    चापराजिता ॥ १३॥ स्त्रीं ऐं ह्रीं विजया पायादिन्दुमदग्निदिक्स्थले । ॐ श्रीं सौः क्लीं जया पातु याम्यां
    मां कवचान्वितम् ॥ १४॥ ह्रीं ह्रीं ऐं सौः हसौः पायान्नैरृतिर्मां तु परात्मिका । ॐ श्रीं श्रीं ह्रीं
    सदा पायात् पश्चिमे ब्रह्मरूपिणी ॥ १५॥ ॐ ह्रां सौः मां भयाद् रक्षेद् वायव्यां मन्त्ररूपिणी । ऐं क्लीं
    श्रीं सौः सदाऽव्यान्मां कौवेर्यां नगनन्दिनी ॥ १६॥ ॐ ह्रीं श्रीं क्लीं महादेवी ऐशान्यां पातु नित्यशः
    । ॐ ह्रीं मन्त्रमयी विद्या पायादूर्ध्वं सुरेश्वरी ॥ १७॥ ॐ ह्रीं श्रीं क्लीं ऐं मां पायादधस्था भुवनेश्वरी
    । एवं दशदिशो रक्षेत् सर्वमन्त्रमयो शिवा ॥ १८॥ प्रभाते पातु चामुण्डा श्रीं क्लीं ऐं सौः स्वरूपिणी ।
    मध्याह्नेऽव्यान्मामम्बा श्रीं ह्रीं क्लीं ऐं सौः स्वरूपिणी ॥ १९॥ सायं पायादुमादेवी ऐं ह्रीं क्लीं
    सौः स्वरूपिणी । निशादौ पातु रुद्राणी ॐ क्लीं क्रीं सौः स्वरूपिणी ॥ २०॥ निशीथे पातु ब्रह्माणी क्रीं
    ह्रूं ह्रीं ह्रीं स्वरूपिणी । निशान्ते वैष्णवी पायादोमै ह्रीं क्लीं स्वरूपिणी ॥ २१॥ सर्वकाले च मां
    पायादो ह्रीं श्रीं भुवनेश्वरी । एषा विद्या मया गुप्ता तन्त्रेभ्यश्चापि साम्प्रतम् ॥ २२॥ फलश्रुतिः
