id: gopalastotram
category: stotram
name:
  english: gopalastotram
  devanagari: गोपालस्तोत्रम्
content:
  english: shri ganeshaya namah | shrinarada uvaca | navinaniradashyamam nilendivaralocanam | ballavinandanam
    vande krishnam gopalarupinam || 1|| sphuradbarhidalodbaddhanilakuncitamurdhajam | kadambakusumodbaddhavanamalavibhushitam
    || 2|| gandamandalasamsargicalatkuncitakuntalam | sthulam muktaphalodaraharodyotitavakshasam || 3||
    hemangadatulakotikiritojjvalavigraham | mandamarutasamkshobhacalitambarasancayam || 4|| ruciraushthaputanyastavamshimadhuranihsvanaih
    | lasadgopalikaceto mohayantam punah punah || 5|| ballavivadanambhojamadhupanamadhuvratam | kshobhayantam
    manastasam sasmerapangavikshanaih || 6|| yauvanodbhidehabhih samsaktabhih parasparam | vicitrambarabhushabhirgopanaribhiravritam
    || 7|| prabhinnanjanakalindijalakelikalotsukam | yodhayantam kvacidgopan vyaharantam gavam ganam ||
    8|| kalindijalasamsargishitalanilasevite | kadambapadapacchaye sthitam vrindavane kvacit || 9|| ratnabhudharasamlagnaratnasanaparigraham
    | kalpapadapamadhyasthahemamandapikagatam || 10|| vasantakusumamodasurabhikritadinmukhe | govardhanagirau
    ramye sthitam rasarasotsukam || 11|| savyahastatalanyastagirivaryatapatrakam | khanditakhandalonmuktamuktasaraghanaghanam
    || 12|| venuvadyamahollasakritahunkaranihsvanaih | savatsairunmukhaih shashvadgokulairabhivikshitam
    || 13|| krishnamevanugayadbhistacceshtavashavartibhih | dandapashodyatakarairgopalairupashobhitam
    || 14|| naradadyairmunishreshthairvedavedangaparagaih | pritisusnigdhaya vaca stuyamanam paratparam
    || 15|| ya evam cintayeddevam bhaktya samstauti manavah | trisandhyam tasya tushto'sau dadati varamipsitam
    || 16|| rajavallabhatameti bhavetsarvajanapriyah | acalam shriyamapnoti sa vagmi jayate dhruvam ||
    17|| || iti shrinaradapancaratre gopalastotram samaptam ||
  devanagari: श्री गणेशाय नमः । श्रीनारद उवाच । नवीननीरदश्यामं नीलेन्दीवरलोचनम् । बल्लवीनन्दनं वन्दे कृष्णं
    गोपालरूपिणम् ॥ १॥ स्फुरद्बर्हिदलोद्बद्धनीलकुञ्चितमूर्धजम् । कदम्बकुसुमोद्बद्धवनमालाविभूषितम् ॥ २॥
    गण्डमण्डलसंसर्गिचलत्कुञ्चितकुन्तलम् । स्थूलं मुक्ताफलोदारहारोद्योतितवक्षसम् ॥ ३॥ हेमाङ्गदतुलाकोटिकिरीटोज्ज्वलविग्रहम्
    । मन्दमारुतसंक्षोभचलिताम्बरसञ्चयम् ॥ ४॥ रुचिरौष्ठपुटन्यस्तवंशीमधुरनिःस्वनैः । लसद्गोपालिकाचेतो मोहयन्तं
    पुनः पुनः ॥ ५॥ बल्लवीवदनाम्भोजमधुपानमधुव्रतम् । क्षोभयन्तं मनस्तासां सस्मेरापाङ्गवीक्षणैः ॥ ६॥ यौवनोद्भिदेहाभिः
    संसक्ताभिः परस्परम् । विचित्राम्बरभूषाभिर्गोपनारीभिरावृतम् ॥ ७॥ प्रभिन्नाञ्जनकालिन्दीजलकेलिकलोत्सुकम्
    । योधयन्तं क्वचिद्गोपान् व्याहरन्तं गवां गणम् ॥ ८॥ कालिन्दीजलसंसर्गिशीतलानिलसेविते । कदम्बपादपच्छाये
    स्थितं वृन्दावने क्वचित् ॥ ९॥ रत्नभूधरसंलग्नरत्नासनपरिग्रहम् । कल्पपादपमध्यस्थहेममण्डपिकागतम् ॥ १०॥
    वसन्तकुसुमामोदसुरभीकृतदिङ्मुखे । गोवर्धनगिरौ रम्ये स्थितं रासरसोत्सुकम् ॥ ११॥ सव्यहस्ततलन्यस्तगिरिवर्यातपत्रकम्
    । खण्डिताखण्डलोन्मुक्तमुक्तासारघनाघनम् ॥ १२॥ वेणुवाद्यमहोल्लासकृतहुङ्कारनिःस्वनैः । सवत्सैरुन्मुखैः
    शश्वद्गोकुलैरभिवीक्षितम् ॥ १३॥ कृष्णमेवानुगायद्भिस्तच्चेष्टावशवर्तिभिः । दण्डपाशोद्यतकरैर्गोपालैरूपशोभितम्
    ॥ १४॥ नारदाद्यैर्मुनिश्रेष्ठैर्वेदवेदाङ्गपारगैः । प्रीतिसुस्निग्धया वाचा स्तूयमानं परात्परम् ॥ १५॥
    य एवं चिन्तयेद्देवं भक्त्या संस्तौति मानवः । त्रिसन्ध्यं तस्य तुष्टोऽसौ ददाति वरमीप्सितम् ॥ १६॥ राजवल्लभतामेति
    भवेत्सर्वजनप्रियः । अचलां श्रियमाप्नोति स वाग्मी जायते ध्रुवम् ॥ १७॥ ॥ इति श्रीनारदपञ्चरात्रे गोपालस्तोत्रं
    समाप्तम् ॥
