id: vijnanaganarajastotram
category: stotram
name:
  english: vijnanaganarajastotram
  devanagari: विज्ञानगणराजस्तोत्रम्
content:
  english: rinu putra pravakshyami shantiyogam sanatanam | brahmana kathitam hyetadyena shanto'hamanjasa
    || 1|| asmakam kuladevatvam prapto ganapatihprabhuh | sa vai devadhidevanam kuladevah prakirtitah
    || 2|| shantiyogasvarupam tam janihi tvam mahamate | bhajasva suprayatnena tada shantimavapsyasi ||
    3|| ganeshatsarvamutpannam tena samsthapitam suta | tasyaradhanamatrena kritakrityah shivadayah ||
    4|| namarupatmakam sarvam jagad brahma prakathyate | tadeva shaktirupakhyam brahmasadrupakam param
    || 5|| tatramritamayam bhanumatmakarena samsthitam | sadrupam tam vijaniyad brahma vede prakirtitam
    || 6|| tayorabhedato brahma samam sarvatra samsthitam | sadasanmayagam vishnum janihi vedavadatah
    || 7|| tebhyo vilakshanasturya netirupah prakirtitah | nirmohah shivasamjnashca svadhinam brahma tadbudhaih
    || 8|| caturnam brahmasamyoge svanandah kathyate budhaih | sa vai mayamayah sakshadgunesho vedavadibhih
    || 9|| antarbahyah kriyah sarva brahmakarah pradrishyate | karmayogah sa vijneyah samyogah karmanam
    suta || 10|| jnanatmacakshusha jnanam yadyadbhavati yoginam | teshamabhedako yogo jnanayogah prakirtitah
    || 11|| jnananam karmanam caiva bhede yogah samatmakah | anandatmakarupo'yam dvaidhanashe sa prapyate
    || 12|| svecchaya karmayogashca dhrito yena mahatmana | svecchaya jnanayogashca svecchayanandayogakah
    || 13|| svecchaya sa tribhirhinah sahajakhyah prakathyate | sada svadhinarupashca svecchaya kridate
    svayam || 14|| brahmabhutatmako yogah svanandakhyah prakirtitah | tatra svadhinata putra paradhina
    tridha krita || 15|| brahmani brahmabhutasya svatah parata eva ca | utthanam nasti samyogatsvasvarupini
    yoginah || 16|| svanande sutasamyogo jagatam brahmanam bhavet | sarvabhedena yogo'yam tasmanmayasamanvitah
    || 17|| ayogatmakayogashca sada samyogavarjitah | jagatam brahmanam tatra pravesho'to na vidyate ||
    18|| sada nirmayiko yogah svasamvedyavivarjitah | svakiyabhedahinatvannivrittiryogibhirdhrita || 19||
    brahma brahmani samstham yannagatam na gatam punah | svanandanashatastubhyam brahmabhutamayogakam
    || 20|| brahmasvanandavasi sa ganeshah kathyate budhaih | svanandatmatmakah prokto vedeshu vedavadibhih
    || 21|| kridatmako ganeshanah svanandah parikirtitah | samyogatmakarupena svasvarupena tishthati ||
    22|| kridahino ganeshano yogarupah prakirtitah | niranandatmakatvena sada brahmani samsthitah || 23||
    samyogayogayogena tayornashe ganeshvarah | shantiyogatmakah prokto yogibhiryogasevaya || 24|| purnayogatmakastatra
    ganeshah parikirtitah | mayayuktavihinatvam bhrantimatram prakirtitam || 25|| pancacittasvarupam tvam
    buddhim janihi putraka | tatra mohakari siddhirbhrantida moharupini || 26|| dharmarthakamamokshanam
    siddhirbhinna pradrishyate | brahmabhutamayi siddhih kathita yogibhistatha || 27|| pancadha cittavrittirya
    tatra yadbimbitam suta | tadeva ganarajasya rupam bimbatmakam param || 28|| dharmarthakamamoksheshu
    brahmabhuteshu yatsmritam | aishvaryam mohadam janturbhramati yatra lalasah || 29|| pancaishvaryeshu
    yadbimbam tadeva ganapasya ca | jivam janihi putra tvam shantiyogasya sevaya || 30|| pancacittapranashe
    vai pancaishvarye layam gatah | adhuna ganarajastvam bhavita'si na samshayah || 31|| tyajavadhutamargam
    tvam bhavavadhutamukhyakah | avadhuya mahaccittam mahadaishvaryamadarat || 32|| sada shantim bhajasva
    tvam yogena datta satvaram | dadami te mahamantram ganeshasya vidhanatah || 33|| tata ekaksharam mantram
    dadau putraya bhavatah | atriryogavidam shreshthastam pranamya yayavajah|34 | sakshadvishnusvarupashca
    datto yogavidamvarah | gangaya dakshine tire pujayamasa viġhnapam || 35|| tyaktva bhumisvarupam sa
    shantimasthaya yogavit | abhajattam tu bhavena ganapam hridi cintayan || 36|| mahayogi svayam datto
    varshenaikena shaunaka | shantim prapto visheshena ganapatyo babhuva ha || 37|| tam drashtum ganapastatra
    yayau bhaktam nijecchaya | bhaktavatsalyabhavena dattashramasushantidah || 38|| tam drishtva sahasotthaya
    prananama kritamjalih | tushtava susthiro bhutva vighnesham kuladaivatam || 39|| datta uvaca | namo
    ganapate tubhyam namo yogasvarupine | yogibhyo yogadatre ca shantiyogatmane namah || 40|| siddhibuddhipate
    tubhyam pancacittapradharakam | nanaviharashilaya ganeshaya namo namah || 41|| siddhidatre samastebhyo
    nanaishvaryapradharine | mohahantre mohakartre herambaya namo namah || 42|| svanandavasine tubhyam
    samyogabhedadharine | nanamayaviharaya vighneshaya namo namah || 43|| samkhyaya brahmanishthaya bodhahinaya
    dhimate | paratotthanarupaya videhaya namo namah || 44|| bodhaya sarvarupaya dehadehimayaya ca | svata
    utthanarupaya prakriterlaya te namah || 45|| so'hankaraya devaya jagadishaya te namah | mahate bindurupaya
    jagadrupaya te namah || 46|| nadatmakaguneshaya nanaveshapradharine | brahmane srishtikartre ca pitamaha
    namo'stu te || 47|| haraye palakayaiva nanadehadharaya ca | samhartre shankarayaiva karmakaraya bhanave
    || 48|| shaktaye ca kriyamurte devamanavarupine | nagasuramayayaiva dhundhirajaya te namah || 49||
    sthavaraya namastubhyam jangamaya namo namah | jagadrupaya devaya brahmane te namo namah || 50|| kim
    staumi tvam ganadhisha yogakarena samsthitam | vedadayah samartha na tvamatah pranamamyaham || 51||
    dhanyo deho madiyo'dya pitarau kulameva ca | vidya yogastapashcaiva tvadamġhriyugadarshanat || 52||
    ityuktva bhaktibhavena paripluto mahamunih | nanarta hrishtaroma'sau anandashruh srijanmuhuh || 53||
    tatastam svakare dhritva gananathah prasasvaje | uvaca yoginam purnairvacanam paramadbhutam || 54||
    ganesha uvaca | dhanyo'si datta yogindro jato'si madanugrahat | shantim labhasi purnam tvamacalam
    mayi sarvada || 55|| kadapi te na bhedo me bhavishyati mahamune | tvatpritisampravriddhyarthamatra
    sthasyami nishcalah || 56|| ganeshajnanamahatmyam tvaya hyatrermukhacchutam | sakshatkarakritam tasmadidam
    vijnanakshetrakam || 57|| vijnanaganapo dattanamna khyato bhavamyaham | darshanacchantisandata bhavishyamyatra
    manada || 58|| atra vasam prakurvanti madartham bhaktisamyutah | shantiyogam sada tebhyo dasyami te
    svasannidhau || 59|| idam pura shivenaiva jnanam sakshatkritam svayam | vijnaneshvaranama me krito
    maya sa shankarah || 60|| tasyatra sannidhim sthitva tvaya tatha susadhitam | atah shankaramitratvam
    prapto'si madanugrahat || 61|| tvaya kritamidam stotram yogashantipradam bhavet | pathatam sha
  devanagari: ृणु पुत्र प्रवक्ष्यामि शान्तियोगं सनातनम् । ब्रह्मणा कथितं ह्येतद्येन शान्तोऽहमञ्जसा ॥ १॥
    अस्माकं कुलदेवत्वं प्राप्तो गणपतिःप्रभुः । स वै देवाधिदेवानां कुलदेवः प्रकीर्तितः ॥ २॥ शान्तियोगस्वरूपं
    तं जानीहि त्वं महामते । भजस्व सुप्रयत्नेन तदा शान्तिमवाप्स्यसि ॥ ३॥ गणेशात्सर्वमुत्पन्नं तेन संस्थापितं
    सुत । तस्याराधनमात्रेण कृतकृत्याः शिवादयः ॥ ४॥ नामरूपात्मकं सर्वं जगद् ब्रह्म प्रकथ्यते । तदेव शक्तिरूपाख्यं
    ब्रह्मासद्रूपकं परम् ॥ ५॥ तत्रामृतमयं भानुमात्माकारेण संस्थितम् । सद्रूपं तं विजानीयाद् ब्रह्म वेदे
    प्रकीर्तितम् ॥ ६॥ तयोरभेदतो ब्रह्म समं सर्वत्र संस्थितम् । सदसन्मयगं विष्णुं जानीहि वेदवादतः ॥ ७॥
    तेभ्यो विलक्षणस्तुर्या नेतिरूपः प्रकीर्तितः । निर्मोहः शिवसंज्ञश्च स्वाधीनं ब्रह्म तद्बुधैः ॥ ८॥ चतुर्णां
    ब्रह्मसंयोगे स्वानन्दः कथ्यते बुधैः । स वै मायामयः साक्षाद्गुणेशो वेदवादिभिः ॥ ९॥ अन्तर्बाह्याः क्रियाः
    सर्वा ब्रह्माकारः प्रदृश्यते । कर्मयोगः स विज्ञेयः संयोगः कर्मणां सुत ॥ १०॥ ज्ञानात्मचक्षुषा ज्ञानं
    यद्यद्भवति योगिनाम् । तेषामभेदको योगो ज्ञानयोगः प्रकीर्तितः ॥ ११॥ ज्ञानानां कर्मणाम् चैव भेदे योगः
    समात्मकः । आनन्दात्मकरूपोऽयं द्वैधनाशे स प्राप्यते ॥ १२॥ स्वेच्छया कर्मयोगश्च धृतो येन महात्मना ।
    स्वेच्छया ज्ञानयोगश्च स्वेच्छयानन्दयोगकः ॥ १३॥ स्वेच्छया स त्रिभिर्हिनः सहजाख्यः प्रकथ्यते । सदा स्वाधीनरूपश्च
    स्वेच्छया क्रीडते स्वयम् ॥ १४॥ ब्रह्मभूतात्मको योगः स्वानन्दाख्यः प्रकीर्तितः । तत्र स्वाधीनता पुत्र
    पराधीना त्रिधा कृता ॥ १५॥ ब्रह्मणि ब्रह्मभूतस्य स्वतः परत एव च । उत्थानं नास्ति संयोगात्स्वस्वरूपिणि
    योगिनः ॥ १६॥ स्वानन्दे सुतसंयोगो जगतां ब्रह्मणां भवेत् । सर्वाभेदेन योगोऽयं तस्मान्मायासमन्वितः ॥
    १७॥ अयोगात्मकयोगश्च सदा संयोगवर्जितः । जगतां ब्रह्मणां तत्र प्रवेशोऽतो न विद्यते ॥ १८॥ सदा निर्मायिको
    योगः स्वसंवेद्यविवर्जितः । स्वकीयाभेदहीनत्वान्निवृत्तिर्योगिभिर्धृता ॥ १९॥ ब्रह्म ब्रह्माणि संस्थं
    यन्नागतं न गतं पुनः । स्वानन्दनाशतस्तुभ्यं ब्रह्मभूतमयोगकम् ॥ २०॥ ब्रह्मस्वानन्दवासी स गणेशः कथ्यते
    बुधैः । स्वानन्दात्मात्मकः प्रोक्तो वेदेषु वेदवादिभिः ॥ २१॥ क्रीडात्मको गणेशानः स्वानन्दः परिकीर्तितः
    । संयोगात्मकरूपेण स्वस्वरूपेण तिष्ठति ॥ २२॥ क्रीडाहीनो गणेशानो योगरूपः प्रकीर्तितः । निरानन्दात्मकत्वेन
    सदा ब्रह्मणि संस्थितः ॥ २३॥ संयोगायोगयोगेन तयोर्नाशे गणेश्वरः । शान्तियोगात्मकः प्रोक्तो योगिभिर्योगसेवया
    ॥ २४॥ पूर्णयोगात्मकस्तत्र गणेशः परिकीर्तितः । मायायुक्तविहीनत्वं भ्रान्तिमात्रं प्रकीर्तितम् ॥ २५॥
    पञ्चचित्तस्वरूपां त्वं बुद्धिं जानीहि पुत्रक । तत्र मोहकरी सिद्धिर्भ्रान्तिदा मोहरूपिणी ॥ २६॥ धर्मार्थकाममोक्षाणां
    सिद्धिर्भिन्ना प्रदृश्यते । ब्रह्मभूतमयी सिद्धिः कथिता योगिभिस्तथा ॥ २७॥ पञ्चधा चित्तवृत्तिर्या तत्र
    यद्बिम्बितं सुत । तदेव गणराजस्य रूपं बिम्बात्मकं परम् ॥ २८॥ धर्मार्थकाममोक्षेषु ब्रह्मभूतेषु यत्स्मृतम्
    । ऐश्वर्यं मोहदं जन्तुर्भ्रमति यत्र लालसः ॥ २९॥ पञ्चैश्वर्येषु यद्बिम्बं तदेव गणपस्य च । जीवं जानीहि
    पुत्र त्वं शान्तियोगस्य सेवया ॥ ३०॥ पञ्चचित्तप्रणाशे वै पञ्चैश्वर्ये लयं गतः । अधुना गणराजस्त्वं भविताऽसि
    न संशयः ॥ ३१॥ त्यजावधूतमार्गं त्वं भाववधूतमुख्यकः । अवधूय महच्चित्तं महदैश्वर्यमादरात् ॥ ३२॥ सदा शान्तिं
    भजस्व त्वं योगेन दत्त सत्वरम् । ददामि ते महामन्त्रं गणेशस्य विधानतः ॥ ३३॥ तत एकाक्षरं मन्त्रं ददौ
    पुत्राय भावतः । अत्रिर्योगविदां श्रेष्ठस्तं प्रणम्य ययावजः।३४ । साक्षाद्विष्णुस्वरूपश्च दत्तो योगविदांवरः
    । गङ्गाया दक्षिणे तीरे पूजयामास विग़्ह्नपम् ॥ ३५॥ त्यक्त्वा भूमिस्वरूपं स शान्तिमास्थाय योगवित् ।
    अभजत्तं तु भावेन गणपं हृदि चिन्तयन् ॥ ३६॥ महायोगी स्वयं दत्तो वर्षेणैकेन शौनक । शान्तिं प्राप्तो विशेषेण
    गाणपत्यो बभूव ह ॥ ३७॥ तं द्रष्टुं गणपस्तत्र ययौ भक्तं निजेच्छया । भक्तवात्सल्यभावेन दत्ताश्रमसुशान्तिदः
    ॥ ३८॥ तं दृष्ट्वा सहसोत्थाय प्रणनाम कृतांजलिः । तुष्टाव सुस्थिरो भूत्वा विघ्नेशं कुलदैवतम् ॥ ३९॥ दत्त
    उवाच । नमो गणपते तुभ्यं नमो योगस्वरूपिणे । योगिभ्यो योगदात्रे च शान्तियोगात्मने नमः ॥ ४०॥ सिद्धिबुद्धिपते
    तुभ्यं पञ्चचित्तप्रधारकम् । नानाविहारशीलाय गणेशाय नमो नमः ॥ ४१॥ सिद्धिदात्रे समस्तेभ्यो नानैश्वर्यप्रधारिणे
    । मोहहन्त्रे मोहकर्त्रे हेरम्बाय नमो नमः ॥ ४२॥ स्वानन्दवासिने तुभ्यं संयोगाभेदधारिणे । नानामायाविहाराय
    विघ्नेशाय नमो नमः ॥ ४३॥ सांख्याय ब्रह्मनिष्ठाय बोधहीनाय धीमते । परतोत्थानरूपाय विदेहाय नमो नमः ॥ ४४॥
    बोधाय सर्वरूपाय देहदेहिमयाय च । स्वत उत्थानरूपाय प्रकृतेर्लय ते नमः ॥ ४५॥ सोऽहङ्काराय देवाय जगदीशाय
    ते नमः । महते बिन्दुरूपाय जगद्रूपाय ते नमः ॥ ४६॥ नादात्मकगुणेशाय नानावेषप्रधारिणे । ब्रह्मणे सृष्टिकर्त्रे
    च पितामह नमोऽस्तु ते ॥ ४७॥ हरये पालकायैव नानादेहधराय च । संहर्त्रे शङ्करायैव कर्माकाराय भानवे ॥ ४८॥
    शक्तये च क्रियामूर्ते देवमानवरूपिणे । नागासुरमयायैव ढुण्ढिराजाय ते नमः ॥ ४९॥ स्थावराय नमस्तुभ्यं जङ्गमाय
    नमो नमः । जगद्रूपाय देवाय ब्रह्मणे ते नमो नमः ॥ ५०॥ किं स्तौमि त्वां गणाधीश योगाकारेण संस्थितम् ।
    वेदादयः समर्था न त्वामतः प्रणमाम्यहम् ॥ ५१॥ धन्यो देहो मदीयोऽद्य पितरौ कुलमेव च । विद्या योगस्तपश्चैव
    त्वदंग़्ह्रियुगदर्शनात् ॥ ५२॥ इत्युक्त्वा भक्तिभावेन परिप्लुतो महामुनिः । ननर्त हृष्टरोमाऽसौ आनन्दाश्रूः
    सृजन्मुहुः ॥ ५३॥ ततस्तं स्वकरे धृत्वा गणनाथः प्रसस्वजे । उवाच योगिनं पूर्णैर्वचनं परमाद्भुतम् ॥ ५४॥
    गणेश उवाच । धन्योऽसि दत्त योगीन्द्रो जातोऽसि मदनुग्रहात् । शान्तिं लभसि पूर्णां त्वमचलां मयि सर्वदा
    ॥ ५५॥ कदापि ते न भेदो मे भविष्यति महामुने । त्वत्प्रीतिसम्प्रवृद्ध्यर्थमत्र स्थास्यामि निश्चलः ॥ ५६॥
    गणेशज्ञानमाहात्म्यं त्वया ह्यत्रेर्मुखाच्छुतम् । साक्षात्कारकृतं तस्मादिदं विज्ञानक्षेत्रकम् ॥ ५७॥
    विज्ञानगणपो दत्तनाम्ना ख्यातो भवाम्यहम् । दर्शनाच्छान्तिसन्दाता भविष्याम्यत्र मानद ॥ ५८॥ अत्र वासं
    प्रकुर्वन्ति मदर्थं भक्तिसंयुताः । शान्तियोगं सदा तेभ्यो दास्यामि ते स्वसन्निधौ ॥ ५९॥ इदं पुरा शिवेनैव
    ज्ञानं साक्षात्कृतं स्वयम् । विज्ञानेश्वरनामा मे कृतो मया स शङ्करः ॥ ६०॥ तस्यात्र सन्निधिं स्थित्वा
    त्वया तथा सुसाधितम् । अतः शङ्करमित्रत्वं प्राप्तोऽसि मदनुग्रहात् ॥ ६१॥ त्वया कृतमिदं स्तोत्रं योगशान्तिप्रदं
    भवेत् । पठतां श
