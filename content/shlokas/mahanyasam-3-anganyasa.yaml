id: mahanyasam-3-anganyasa
category: stotram
name:
  english: Mahanyasam - 3. Anganyasa
content:
  english: ya te rudra shiva tanuraghora 'papakashini | taya na stanuva shantamaya girishantabhi cakashihi
    | shikhayai namah | 'ntarikshe bhava adhi | teshagm sahasrayojane 'vadhanvani tanmasi | shirase namah
    | sahasrani sahasrasho ye rudra adhi bhumya 'vadhanvani tanmasi | lalataya namah | dvasurantarikshasaddhota
    vedishadatithi rduronasat | nrishadvara sadvyoma sadabja goja ritaja adrija rita mbrihat | bhruvormaddhyaya
    namah | mpushtivardhanam | urvarukamiva bandhanan mrityo ssrutyaya ca pathyaya ca namah katyaya ca
    nipyaya ca | karnabhya ma nastoke tanaye ma na ayushi ma no goshu ma no ashveshu ririshah | viranmano
    rudra bhamito vadhir havishmanto namasa vidhema te | nasikabhya avatatya dhanustvagm sahasraksha shateshudhe
    | nishirya shalyana mmukha shivo nah sumana bhava | mukhaya namah | nilagriva shshitikantha kshamacarah
    | teshagm sahasrayojane ' vadhanvani tanmasi | kanthaya namah | shshitikantha divagm rudra upashritah
    | teshagm sahasrayojane ' vadhanvani tanmasi | upakanthaya namah | namaste astvayudhaya | ubhabhyamuta
    te namo bahubhya ntava dhanvane | bahubhya rmidhushtama haste babhuva te dhanuh | taya 'sman vishvatastva
    mayakshmaya paribbhuja | upabahubhya parino rudrasya heti rvrinaktu paritveshasya durmatiraghayoh
    | ava sthira maghavadbhyah tanushva midhvastokaya tanayaya mridaya | manibandhabhya ye tirthani pracaranti
    srikavanto nishanginah | teshagm sahasrayojane ' vadhanvani tanmasi | hastabhya mprapadyami sadyo
    jataya vai namo namah | bhave bhave nati bhave bhavasva mam | bhavo dbhavaya namah || agumshthabhya
    jyeshthaya namah shreshthaya namo rudraya namah kalaya namah kalavikaranaya namo balavikaranaya namo
    balaya namo balapramathanaya nama ssarvabhutadamanaya namo manonmanaya namah | tarjanibhya bhyo ghoraghoratarebhyah
    | sarve bhyo namaste astu rudra rupebhyah || maddhyamabhya tatpurushaya vidmahe mahadevaya dhimahi
    | tanno rudrah pracodaya ssarvabhutanam rahmadhipati rbrahmano 'dhipati rbrahma shivo me astu sadashivom
    || kanishthikabhya namo vah kirikebhyo devanagm hridayebhyah | hridayaya namah | namo ganebhyo ganapatibhyashca
    vo namah | prishthaya namah | namo hiranyabahave senanye dishanca pataye namah | par ndhanuh kapardino
    vishalyo banavagm uta | aneshannasyeshava abhurasya nishangathih | jatharaya namah | hiranyagarbha
    ssamavartatagre bhutasya jatah patireka asit | sadadhara prithivi nkasmai devaya havisha vidhema |
    nabhyai namah | midhushtama shivatama shivo nassumana bhava | parame vriksha ayudha va~sana acara
    pinaka mbibhradagahi | kathyai namah | madhipatayo vishikhasah kapardinah | teshagm sahasrayojane
    'vadhanvani tanmasi | guhyaya namah | ye anneshu vividdhyanti patreshu pibato janan | teshagm sahasrayojane
    ' vadhanvani tanmasi | andabhya sa shira jataveda akshara mpadam | vedanagm shirasi mata ayushmanta
    nkarotu mam | apanaya namah | ma no mahantamuta ma no arbhaka mma na ukshantamuta ma na ukshitam |
    ma no vadhih pitara mpriya ma nastanuvo rudra ririshah | urubhya stanjushasva tenavasena paro mujavato
    dhanva pinakahastah krittivasah | janubhya sagm srishtajithsomapa bahu rdhva dhanva pratihita | brihaspate
    paridiya rathena rakshoha 'mitragm apabadhamanah | janghabhya nca yat | sarvo hyesha rudra stasmai
    rudraya namo astu || gulphabhya mpathirakshaya ailabrida yavyudhah | teshagm sahasrayojane 'vadhanvani
    tanmasi | padabhya dadhivakta prathamo daivyo bhishak | ahigshca sarva shca yatu dhanyah | kavacaya
    hum | namo bilmine ca kavacine ca namah shrutaya ca shrutasenaya ca | upakavacaya hum | namo astu
    nilagrivaya sahasrakshaya midhushe | atho ye asya satvano 'karannamah | tritiya netraya namah | pramunca
    dhanvanastva rartniyorjyam | yashca te hasta ishavah para ta bhagavo vapa | astraya phat | ya etavantashca
    bhuyagmsashca disho rudra vitasthire | teshagm sahasrayojane 'vadhanvani tanmasi | iti digbandhah
    | shikhadi astraparyantam ekatrimshadanganyasah digbandha sahitah prathamah
  devanagari: या ते॑ रुद्र शि॒वा त॒नूरघो॒रा ऽपा॑पकाशिनी । तया॑ न स्त॒नुवा॒ शन्त॑मया॒ गिरि॑शन्ता॒भि चा॑कशीहि
    । शिखायै नमः । ऽन्तरि॑क्षे भ॒वा अधि॑ । तेषाग्ं॑ सहस्रयोज॒ने ऽव॒धन्वा॑नि तन्मसि । शिरसे नमः । स॒हस्रा॑णि
    सहस्र॒शो ये रु॒द्रा अधि॒ भूम्या ऽव॒धन्वा॑नि तन्मसि । ललाटाय नमः । द्वसु॑रन्तरिक्ष॒सद्धोता॑ वेदि॒षदति॑थि
    र्दुरोण॒सत् । नृ॒षद्व॑र॒ सद्व्यो॑म॒ सद॒ब्जा गो॒जा ऋ॑त॒जा अ॑द्रि॒जा ऋ॒त म्बृ॒हत् । भ्रुवोर्मद्ध्याय
    नमः । म्पु॑ष्टि॒वर्ध॑नम् । उ॒र्वा॒रु॒कमि॑व॒ बन्ध॑नान् मृ॒त्यो स्स्रुत्या॑य च॒ पथ्या॑य च॒ नमः॑ का॒ट्या॑य
    च नी॒प्या॑य च । कर्णाभ्या मा न॑स्तो॒के तन॑ये॒ मा न॒ आयु॑षि॒ मा नो॒ गोषु॒ मा नो॒ अश्वे॑षु रीरिषः ।
    वी॒रान्मानो॑ रुद्र भामि॒तो व॑धीर् ह॒विष्म॑न्तो॒ नम॑सा विधेम ते । नासिकाभ्या अ॒व॒तत्य॒ धनु॒स्त्वग्ं
    सह॑स्राक्ष॒ शते॑षुधे । नि॒शीर्य॑ श॒ल्याना॒ म्मुखा॑ शि॒वो नः॑ सु॒मना॑ भव । मुखाय नमः । नील॑ग्रीवा श्शिति॒कण्ठा
    क्ष॑माच॒राः । तेषाग्ं॑ सहस्रयोज॒ने ऽ व॒धन्वा॑नि तन्मसि । कण्ठाय नमः । श्शिति॒कण्ठा॒ दिवग्ं॑ रु॒द्रा
    उप॑श्रिताः । तेषाग्ं॑ सहस्रयोज॒ने ऽ व॒धन्वा॑नि तन्मसि । उपकण्ठाय नमः । नम॑स्ते अ॒स्त्वायु॑धा॒या ।
    उ॒भाभ्या॑मु॒त ते॒ नमो॑ बा॒हुभ्या॒ न्तव॒ धन्व॑ने । बाहुभ्या र्मी॑ढुष्टम॒ हस्ते॑ ब॒भूव॑ ते॒ धनुः॑ ।
    तया॒ ऽस्मान् वि॒श्वत॒स्त्व म॑य॒क्ष्मया॒ परि॑ब्भुज । उपबाहुभ्या परि॑णो रु॒द्रस्य॑ हे॒ति र्वृ॑णक्तु॒
    परि॑त्वे॒षस्य॑ दुर्म॒तिर॑घा॒योः । अव॑ स्थि॒रा म॒घव॑द्भ्यः तनुष्व॒ मीढ्व॑स्तो॒काय॒ तन॑याय मृडय । मणिबन्धाभ्या
    ये ती॒र्थानि॑ प्र॒चर॑न्ति सृ॒काव॑न्तो निष॒ङ्गिणः॑ । तेषाग्ं॑ सहस्रयोज॒ने ऽ व॒धन्वा॑नि तन्मसि । हस्ताभ्या
    म्प्र॑पद्या॒मि॒ स॒द्यो जा॒ताय॒ वै नमो॒ नमः॑ । भ॒वे भ॑वे॒ नाति॑ भवे भवस्व॒ माम् । भ॒वो द्भ॑वाय॒ नमः॑
    ॥ अगुंष्ठाभ्या ज्ये॒ष्ठाय॒ नमः॑ श्रे॒ष्ठाय॒ नमो॑ रु॒द्राय॒ नमः॒ काला॑य॒ नमः॒ कल॑विकरणाय॒ नमो॒ बल॑विकरणाय॒
    नमो॒ बला॑य॒ नमो॒ बल॑प्रमथनाय॒ नम॒ स्सर्व॑भूतदमनाय॒ नमो॑ म॒नोन्म॑नाय॒ नमः॑ । तर्जनीभ्या भ्यो॒ घोर॒घोर॑तरेभ्यः
    । सर्वे भ्यो॒ नम॑स्ते अस्तु रु॒द्र रू॑पेभ्यः ॥ मद्ध्यमाभ्या तत्पुरु॑षाय वि॒द्महे॑ महादे॒वाय॑ धीमहि
    । तन्नो॑ रुद्रः प्रचो॒दया स्सर्व॑भूता॒नां॒ रह्माधि॑पति॒ र्ब्रह्म॒णो ऽधि॑पति॒ र्ब्रह्मा॑ शि॒वो मे॑
    अस्तु सदाशि॒वोम् ॥ कनिष्ठिकाभ्या नमो॑ वः किरि॒केभ्यो॑ दे॒वाना॒ग्ं॒ हृद॑येभ्यः । हृदयाय नमः । नमो॑
    ग॒णेभ्यो॑ ग॒णप॑तिभ्यश्च वो॒ नमः॑ । पृष्ठाय नमः । नमो॒ हिर॑ण्यबाहवे सेना॒न्ये॑ दि॒शाञ्च॒ पत॑ये॒ नमः॑
    । पार् न्धनुः॑ कप॒र्दिनो॒ विश॑ल्यो॒ बाण॑वाग्ं उ॒त । अने॑शन्न॒स्येष॑व आ॒भुर॑स्य निष॒ङ्गथिः॑ । जठराय
    नमः । हि॒र॒ण्य॒ग॒र्भ स्सम॑वर्त॒ताग्रे॑ भू॒तस्य॑ जा॒तः पति॒रेक॑ आसीत् । सदा॑धार पृथि॒वी ङ्कस्मै॑ दे॒वाय॑
    ह॒विषा॑ विधेम । नाभ्यै नमः । मीढु॑ष्टम॒ शिव॑तम शि॒वो न॑स्सु॒मना॑ भव । प॒र॒मे वृ॒क्ष आयु॑ध वँसा॑न॒
    आच॑र॒ पिना॑क॒ म्बिभ्र॒दाग॑हि । कठ्यै नमः । मधि॑पतयो विशि॒खासः॑ कप॒र्दि॑नः । तेषाग्ं॑ सहस्रयोज॒ने ऽव॒धन्वा॑नि
    तन्मसि । गुह्याय नमः । ये अन्ने॑षु वि॒विद्ध्य॑न्ति॒ पात्रे॑षु॒ पिब॑तो॒ जनान्॑ । तेषाग्ं॑ सहस्रयोज॒ने
    ऽ व॒धन्वा॑नि तन्मसि । अण्डाभ्या स॒ शि॒रा जा॒तवे॑दा अ॒क्षर॑ म्प॒दम् । वेदा॑ना॒ग्ं॒ शिर॑सि मा॒ता॒ आ॒यु॒ष्मन्त॑
    ङ्करोतु॒ माम् । अपानाय नमः । मा नो॑ म॒हान्त॑मु॒त मा नो॑ अर्भ॒क म्मा न॒ उक्ष॑न्तमु॒त मा न॑ उक्षि॒तम्
    । मा नो॑ वधीः पि॒तर॒ म्प्रि॒या मा न॑स्त॒नुवो॑ रुद्र रीरिषः । ऊरुभ्या स्तञ्जु॑षस्व॒ तेना॑व॒सेन॑ प॒रो
    मूज॑व॒तो धन्वा॒ पिना॑कहस्तः॒ कृत्ति॑वासाः । जानुभ्या स॒ग्ं॒ सृ॒ष्ट॒जिथ्सो॑म॒पा बा॑हु र्ध्व ध॑न्वा॒
    प्रति॑हिता । बृह॑स्पते॒ परि॑दीया॒ रथे॑न रक्षो॒हा ऽमित्राग्ं॑ अप॒बाध॑मानः । जङ्घाभ्या ञ्च॒ यत् । सर्वो॒
    ह्ये॑ष रु॒द्र स्तस्मै॑ रु॒द्राय॒ नमो॑ अस्तु ॥ गुल्फाभ्या म्प॑थि॒रक्ष॑य ऐलबृ॒दा य॒व्युधः॑ । तेषाग्ं॑
    सहस्रयोज॒ने ऽव॒धन्वा॑नि तन्मसि । पादाभ्या दधिव॒क्ता प्र॑थ॒मो दैव्यो॑ भि॒षक् । अहीग्॑श्च॒ सर्वा श्च
    यातु धा॒न्यः॑ । कवचाय हुम् । नमो॑ बि॒ल्मिने॑ च कव॒चिने॑ च॒ नमः॑ श्रु॒ताय॑ च श्रुतसे॒नाय॑ च । उपकवचाय
    हुम् । नमो॑ अस्तु॒ नील॑ग्रीवाय सहस्रा॒क्षाय॑ मी॒ढुषे । अथो॒ ये अ॑स्य॒ सत्वा॑नो॒ ऽकर॒न्नमः॑ । तृतीय
    नेत्राय नमः । प्रमु॑ञ्च॒ धन्व॑न॒स्त्व रार्त्नि॑यो॒र्ज्याम् । याश्च॑ ते॒ हस्त॒ इष॑वः॒ परा॒ ता भ॑गवो
    वप । अस्त्राय फट् । य ए॒ताव॑न्तश्च॒ भूयाग्ं॑सश्च॒ दिशो॑ रु॒द्रा वि॑तस्थि॒रे । तेषाग्ं॑॑ सहस्रयोज॒ने
    ऽव॒धन्वा॑नि तन्मसि । इति दिग्बन्धः । शिखादि अस्त्रपर्यन्तं एकत्रिंशदङ्गन्यासः दिग्बन्ध सहितः प्रथमः
