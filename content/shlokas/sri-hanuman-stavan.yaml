id: sri-hanuman-stavan
category: stotram
name:
  english: Sri Hanuman Stavan
content:
  english: pranavu~ pavanakumara khala bana pavaka jnanaghana | jasu hridaya agara basahim rama saracapa
    dhara || || atulitabaladhamam hemashailabhadeham | danujavanakrishanum jnaninamagraganyam || || sakalagunanidhanam
    vanaranamadhisham | raghupatipriyabhaktam vatajatam namami || || goshpadikritavarisham mashakikritarakshasam
    | ramayanamahamalaratnam vande'nilatmajam ||
  devanagari: प्रनवुँ पवनकुमार खल बन पावक ज्ञानघन । जासु हृदय आगार बसहिं राम सरचाप धर ॥ ॥ अतुलितबलधामं
    हेमशैलाभदेहम् । दनुजवनकृशानुं ज्ञानिनामग्रगण्यम् ॥ ॥ सकलगुणनिधानं वानराणामधीशम् । रघुपतिप्रियभक्तं
    वातजातं नमामि ॥ ॥ गोष्पदीकृतवारीशं मशकीकृतराक्षसम् । रामायणमहामालारत्नं वन्देऽनिलात्मजम् ॥
