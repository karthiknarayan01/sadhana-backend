id: vishnukavacastotram
category: kavacha
name:
  english: vishnukavacastotram
  devanagari: विष्णुकवचस्तोत्रम्
content:
  english: namamivishnum shirasacaturbhujam || om purvato mam harih patu pashcat shrih sadakshine | shrikrishna
    uttare patu shri go vishnushca sarvashah || urdhvam me nandani patu adhastat sharngabhrit sada | padau
    patu sarojangi ange patu janardanah || januni me jagannathah uru patu trivikramah | guhyam patu hrishikeshah
    prishtham patu mamavyayah || patu nabhim mamanantah kukshim rakshasamardanah | damodaro me hridayam
    vakshah patu nrikesari || karau me kaliyaratih bhujau bhaktartibhanjanah | kantham kalambudashyamah
    skandhau me kamsamardanah || narayano me'vyannasam karnau me ca prabhanjanah | kapalam patu vaikunthah
    jihvam patu dayanidhih || asyam dashasyahantavyat netre me padmalocanah | bhruvau me patu bhuma ca
    lalatam me sadacyutah || mukham me patu govindah shikham garudavahanah | mam sheshashayi sarvebhyo
    vyadhibhyo bhaktavatsalah || pishacagnijvarebhyo mam apadbhyo'vatu madhavah | sarvebhyo duritebhyashca
    patu mam purushottamah || idam shrivishnukavacam sarvamangaladayakam | sarvarogaprashamanam
  devanagari: नमामिविष्णुं शिरसाचतुर्भुजम् ॥ ॐ पूर्वतो मां हरिः पातु पश्चात् श्रीः सदक्षिणे । श्रीकृष्ण
    उत्तरे पातु श्री गो विष्णुश्च सर्वशः ॥ ऊर्ध्वं मे नन्दनी पातु अधस्तात् शार्ङ्गभृत् सदा । पादौ पातु
    सरोजाङ्गी अङ्गे पातु जनार्दनः ॥ जानुनी मे जगन्नाथः ऊरू पातु त्रिविक्रमः । गुह्यं पातु हृषीकेशः पृष्ठं
    पातु ममाव्ययः ॥ पातु नाभिं ममानन्तः कुक्षिं राक्षसमर्दनः । दामोदरो मे हृदयं वक्षः पातु नृकेसरी ॥ करौ
    मे कालियारातिः भुजौ भक्तार्तिभञ्जनः । कण्ठं कालाम्बुदश्यामः स्कन्धौ मे कंसमर्दनः ॥ नारायणो मेऽव्यान्नासां
    कर्णौ मे च प्रभञ्जनः । कपालं पातु वैकुण्ठः जिह्वां पातु दयानिधिः ॥ आस्यं दशास्यहन्ताव्यात् नेत्रे
    मे पद्मलोचनः । भ्रुवौ मे पातु भूमा च ललाटं मे सदाच्युतः ॥ मुखं मे पातु गोविन्दः शिखां गरुडवाहनः ।
    मां शेषशायी सर्वेभ्यो व्याधिभ्यो भक्तवत्सलः ॥ पिशाचाग्निज्वरेभ्यो मां आपद्भ्योऽवतु माधवः । सर्वेभ्यो
    दुरितेभ्यश्च पातु मां पुरुषोत्तमः ॥ इदं श्रीविष्णुकवचं सर्वमङ्गलदायकम् । सर्वरोगप्रशमनं
