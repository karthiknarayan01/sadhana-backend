id: naradakrishnastotra
category: stotram
name:
  english: naradakrishnastotra
  devanagari: नारदक्रिश्नस्तोत्र
content:
  english: shrikrishnastotram shrinaradaracitam shri ganeshaya namah | vande navaghanashyamam pitakausheyavasasam
    | sanandam sundaram shuddham shrikrishnam prakriteh param || 1|| radhesham radhikapranavallabham ballavisutam
    | radhasevitapadabjam radhavakshahsthalasthitam || 2|| radhanugam radhikeshtam radhapahritamanasam
    | radhadharam bhavadharam sarvadharam namami tam || 3|| radhahritpadmamadhye ca vasantam santatam
    shubham | radhasahacaram shashvadradhajnaparipalakam || 4|| dhyayante yogino yogan siddhah siddheshvarashca
    yam | tam dhyayet satatam shuddham bhagavantam sanatanam || 5|| sevante satatam santo brahmeshasheshasajnakah
    | sevante nirgunam brahma bhagavantam sanatanam || 6|| nirliptam ca niriham ca paramatmanamishvaram
    | nityam satyam ca paramam bhagavantam sanatanam || 7|| yam srishteradibhutam ca sarvabijam paratparam
    | yoginastam prapadyante bhagavantam sanatanam || 8|| bijam nanavataranam sarvakaranakaranam | vedavedyam
    vedabijam vedakaranakaranam || 9|| yoginastam prapadyante bhagavantam sanatanam | ityevamuktva gandharvah
    papata dharanitale || 10|| namama dandavad bhumau devadevam paratparam | iti tena kritam stotram yah
    pathet prayatah shucih || 11|| ihaiva jivanmuktashca param yati param gatim | haribhaktim harerdasyam
    goloke ca niramayah || 12|| parshadapravaratvam ca labhate na'tra samshayah || 13|| || iti naradapancaratre
    krishnastotram sampurnam ||
  devanagari: श्रीकृष्णस्तोत्रं श्रीनारदरचितम् श्री गणेशाय नमः । वन्दे नवघनश्यामं पीतकौशेयवाससम् । सानन्दं
    सुन्दरं शुद्धं श्रीकृष्णं प्रकृतेः परम् ॥ १॥ राधेशं राधिकाप्राणवल्लभं बल्लवीसुतम् । राधासेवितपादाब्जं
    राधावक्षःस्थलस्थितम् ॥ २॥ राधानुगं राधिकेष्टं राधापहृतमानसम् । राधाधारं भवाधारं सर्वाधारं नमामि तम्
    ॥ ३॥ राधाहृत्पद्ममध्ये च वसन्तं सन्ततं शुभम् । राधासहचरं शश्वद्राधाज्ञापरिपालकम् ॥ ४॥ ध्यायन्ते योगिनो
    योगान् सिद्धाः सिद्धेश्वराश्च यम् । तं ध्यायेत् सततं शुद्धं भगवन्तं सनातनम् ॥ ५॥ सेवन्ते सततं सन्तो
    ब्रह्मेशशेषसज्ञकाः । सेवन्ते निर्गुणं ब्रह्म भगवन्तं सनातनम् ॥ ६॥ निर्लिप्तं च निरीहं च परमात्मानमीश्वरम्
    । नित्यं सत्यं च परमं भगवन्तं सनातनम् ॥ ७॥ यं सृष्टेरादिभूतं च सर्वबीजं परात्परम् । योगिनस्तं प्रपद्यन्ते
    भगवन्तं सनातनम् ॥ ८॥ बीजं नानावताराणां सर्वकारणकारणम् । वेदावेद्यं वेदबीजं वेदकारणकारणम् ॥ ९॥ योगिनस्तं
    प्रपद्यन्ते भगवन्तं सनातनम् । इत्येवमुक्त्वा गन्धर्वः पपात धरणीतले ॥ १०॥ नमाम दण्डवद् भूमौ देवदेवं
    परात्परम् । इति तेन कृतं स्तोत्रं यः पठेत् प्रयतः शुचिः ॥ ११॥ इहैव जीवन्मुक्तश्च परं याति परां गतिम्
    । हरिभक्तिं हरेर्दास्यं गोलोके च निरामयः ॥ १२॥ पार्षदप्रवरत्वं च लभते नाऽत्र संशयः ॥ १३॥ ॥ इति नारदपञ्चरात्रे
    कृष्णस्तोत्रं सम्पूर्णम् ॥
