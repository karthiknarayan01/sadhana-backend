id: kyts-jata-1-6-santva-sinchami-yajusha-krishna-yajurveda-taittiriya-samhita
category: stotram
name:
  english: KYTS Jata 1.6 Santva Sinchami Yajusha - Krishna Yajurveda Taittiriya Samhita
content:
  english: tva sincami sincami tva tva sincami | sincami yajusha yajusha sincami sincami yajusha | ya~jusha
    yajusha prajam | praja mayurayuh praja brihaspatiprasuto yajamano yajamano brihaspatiprasuto brihaspatiprasuto
    yajamanah | brihaspatiprasuta iti brihaspati yajamana ihe ha yajamano yajamana iha | ajya masya syajya
    majya masi | asi satyagm satya masyasi satyam | satya masyasi satyagm satya masi | asi satyasya satyasya
    satyasya ddhyaksha maddhyakshagm satyasya satyasya ddhyaksham | ddhyaksha maddhyaksha masi | shvanara
    masyasi vaishvanaram | vaishvadeva mutputashushma mutputashushmam shvadeva mutputashushmam | vaishvadevamiti
    vaishva utputashushmagm satyauja ssatyauja utputashushma mutputashushmagm satyaujah utputashushmamityutputa
    satyauja iti satya sahamana masyasi sahamanam | sahamana masyasi sahamana asi sahasva sahasva syasi
    sahasva | sahasva ratirarati ssahasva sahasvaratih | ssahasva sahasva ratirarati sahasva ratiyato
    'ratiyata ssahasva sahasva ratiyatah | ssahasva sahasva ratiyato 'ratiyata sahasva pritanah pritana
    ssahasva sahasva pritanah | ssahasva sahasva pritanah pritana sahasva pritanyatah pritanyata ssahasva
    sahasva pritanyatah | pritanyata iti pritanyatah | sahasravirya masyasi sahasraviryagm sahasravirya
    masi | sahasraviryamiti sahasra ma jinva jinva ma ma jinva | jinvajya syajyasya jinva jinvajyasya
    | ajyasyajya majya majya syajya syajya ajya masya syajya majya masi | asi satyasya satyasya satyasya
    satyagm satyagm satyasya satyasya satyam | satya masyasi satyagm satya masi | asi satyayuh satyayu
    rasyasi satyayuh | satyayu rasyasi satyayuh satyayurasi | satyayuriti satya asi satyashushmagm satyashushma
    masyasi satyashushmam | satyashushma masyasi satyashushmagm satyashushma masi | satyashushmamiti satya
    asi satyena satyena satyena tva tva satyena satyena tva | abhi gharayami gharaya myabhyabhi gharayami
    | gharayami tasya tasya gharayami gharayami tasya | tasya te te tasya tasya te | te bhakshiya bhakshiya
    te te bhakshiya | mbhakshiya bhakshiya pancanam | ntva tva vatanam | ya~ntraya yantraya vatanam yantraya
    dhartraya dhartraya yantraya yantraya dhartraya | dhartraya grihnami grihnami dhartraya dhartraya
    grihnami | grihnami pancana ngrihnami grihnami pancanam | tvartuna mrituna ya~ntraya yantraya rtuna
    mritunam yantraya dhartraya dhartraya yantraya yantraya dhartraya | dhartraya grihnami grihnami dhartraya
    dhartraya grihnami | grihnami pancana ngrihnami grihnami pancanam | ya~ntraya yantraya disha yantraya
    dhartraya dhartraya yantraya yantraya dhartraya | dhartraya grihnami grihnami dhartraya dhartraya
    grihnami | grihnami pancana ngrihnami grihnami pancanam | ntva tva pancajanana ya~ntraya yantraya
    pancajanana pancajananamiti panca yantraya dhartraya dhartraya yantraya yantraya dhartraya | dhartraya
    grihnami grihnami dhartraya dhartraya grihnami | grihnami caro shcaro rgrihnami grihnami caroh | tva
    caro shcaro stva tva pancabilasya pancabilasya tva tva pancabilasya | pancabilasya yantraya yantraya
    pancabilasya pancabilasya yantraya | pancabilasyeti panca yantraya dhartraya dhartraya yantraya yantraya
    dhartraya | dhartraya grihnami grihnami dhartraya dhartraya grihnami | grihnami brahmano brahmano
    grihnami grihnami brahmanah | brahmana stva tva brahmano brahmana stva | tva tejase tejase tva tva
    tejase | tejase yantraya yantraya tejase tejase yantraya | yantraya dhartraya dhartraya yantraya yantraya
    dhartraya | dhartraya grihnami grihnami dhartraya dhartraya grihnami | grihnami kshatrasya kshatrasya
    grihnami grihnami kshatrasya | kshatrasya tva tva kshatrasya kshatrasya tva | tvaujasa ojase tva tvaujase
    | ojase yantraya yantra yaujasa ojase yantraya | yantraya dhartraya dhartraya yantraya yantraya dhartraya
    | || dhartraya grihnami grihnami dhartraya dhartraya grihnami | grihnami vishe vishe grihnami grihnami
    vishe | tva vishe vishe tva tva yantraya yantraya tva tva yantraya | yantraya dhartraya dhartraya
    yantraya yantraya dhartraya | dhartraya grihnami grihnami dhartraya dhartraya grihnami | grihnami
    suviryaya suviryaya grihnami grihnami suviryaya | suviryaya tva tva suviryaya suviryaya tva | tva
    grihnami grihnami tva tva grihnami | grihnami suprajastvaya suprajastvaya grihnami grihnami suprajastvaya
    | suprajastvaya tva tva suprajastvaya suprajastvaya tva | suprajastvayeti suprajah tva grihnami grihnami
    tva tva grihnami | grihnami rayo rayo grihnami grihnami rayah | raya sposhaya poshaya rayo raya sposhaya
    | poshaya tva tva poshaya poshaya tva | tva grihnami grihnami tva tva grihnami | grihnami brahmavarcasaya
    brahmavarcasaya grihnami grihnami brahmavarcasaya | brahmavarcasaya tva tva brahmavarcasaya brahmavarcasaya
    tva | brahmavarcasayeti brahma tva grihnami grihnami tva tva grihnami | rgrihnami grihnami bhuh |
    bhu rasmaka masmaka havi rasmaka masmaka devana mashisha ashisho devana ndevana mashishah | ashisho
    yajamanasya yajama nasyashisha ashisho yajamanasya | ya~jamanasya yajamanasya devana bhya stva tva
    devata bhyo grihnami grihnami devata grihnami kamaya kamaya grihnami grihnami kamaya | kamaya tva
    tva kamaya kamaya tva | tva grihnami grihnami tva tva grihnami | grihnamiti grihnami | || 'syasi dhruvo
    dhruvo 'si | asi dhruvo dhruvo ndhruvo dhruvo 'ham | ahagm sajateshu sajateshvaha mahagm sajateshu
    | mbhuyasagm sajateshu sajateshu bhuyasam | dhira shcetta cetta dhiro dhira shcetta dvasuvic cetta
    cetta vasuvit | vasuvidugra ugro vasuvi 'syasyugra ugro 'si | ugro 'ha maha mugra ugro 'ham | ahagm
    sajateshu sajate shvaha mahagm sajateshu | mbhuyasagm sajateshu sajateshu bhuyasam | bhuyasa mugra
    ugro bhuyasa ugra shcetta cettogra ugra shcetta dvasuvic cetta cetta vasuvit | vasuvi dabhibhu rabhibhu
    dvasuvi dabhibhuh | abhibhu rasya syabhibhu rabhibhurasi | asyabhibhu rabhibhu rasya syabhibhuh |
    abhibhu raha maha mabhibhu rabhibhuraham | ahagm sajateshu sajateshvaha mahagm sajateshu | mbhuyasagm
    sajateshu sajateshu bhuyasam | bhuyasa mabhibhu rabhibhu abhibhu shcetta cetta 'bhibhu rabhibhu shcetta
    dvasuvic cetta cetta vasuvit | dyunajmi yunajmi vasuvi yunajmi tva tva yunajmi yunajmi tva | tva brahmana
    brahmana tva tva brahmana | brahmana daivyena daivyena brahmana brahmana daivyena | daivyena havyaya
    havyaya daivyena daivyena havyaya | havyayasma asmai havyaya havyayasmai | asmai vodhave vodhave 'sma
    asmai vodhave | vodhave jatavedo jatavedo vodhave vodhave jatavedah | indhana stva tvendhana indhana
    stva | tva suprajasah suprajasa stva tva suprajasah | ssuprajasah suprajasah suvirah suvira jyog jyo
    jyog jivema jivema jyog jyog jivema | jivema balihrito balihrito jivema jivema balihritah | mbalihrito
    balihrito vayam | me agne 'gne me me agne | agne asyasyagne asya yajnasya yajna syasyasya yajnasya
    | dyajnasya yajnasya rishya skanda dajya syajyasya skanda thskanda dajyasya | ajya syoto tajya syajyasyota
    | uta vishno vishno utota vishno | vishno iti vishno | tena hanmi hanmi tena tena hanmi | ndurmarayugm
    sapatna durmarayu ma durmarayu durmarayumiti duh ndadhami dadhamyena mena ritya dadhami dadhami nir
    ritya upastha upasthe nir suva rucchushma ucchushma ssuva rucchushmah | ucchushmo agne 'gna ucchushma
    ucchushmo agne | agne yajamanaya yajamanayagne 'gne yajamanaya | yajamana yaidhyedhi yajamanaya yajamana
    yaidhi | edhi nishushmo nishushma edhyedhi nishushmah | nishushmo abhidasate 'bhidasate nishushmo
    nishushmo abhidasate | ddha deveddhagne 'gne deve ddha manviddha manviddha deve manviddha mandrajihva
    mandrajihva manviddha manviddha mandrajihva | mandrajihva martyasyamartyasya mandrajihva mandrajihva
    martyasya | mandrajihveti mandra amartyasya te te 'martyasya martyasya te | te hotar hotaste te hotah
    | a jigharmi jigharmya jigharmi | jigharmi rayo rayo jigharmi jigharmi rayah | raya sposhaya poshaya
    rayo raya sposhaya | poshaya suprajastvaya suprajastvaya poshaya poshaya suprajastvaya | suprajastvaya
    suviryaya suviryaya suprajastvaya suprajastvaya suviryaya | suprajastvayeti suprajah suviryaya mano
    manah suviryaya suviryaya manah | 'syasi mano mano 'si | mprajapatya masyasi prajapatyam | mmanasa
    manasa prajapatya prajapatyamiti praja manasa ma ma manasa manasa ma | ma bhutena bhutena ma ma bhutena
    | bhutena bhutena bhutena | visha vag vag visha visha vak | vagasyasi vag vagasi | ndryasya syaindri
    | aindri sapatnakshayani sapatnakshayanyaindryai ndri sapatnakshayani | sapatnakshayani vaca vaca
    sapatnakshayani sapatnakshayani vaca | sapatnakshayaniti sapatna vaca ma ma vaca vaca ma ndriyena
    ma mendriyena | indriyenendriyene vi~sha visha vasantam | vasanta mrituna mritunam va~santa mritunam
    | mprinami prinamyrituna mrituna prinami sa sa prinami prinami sah | ma pritah prito ma ma pritah
    | pritah prinatu prinatu pritah pritah prinatu | prinatu grishma mprinatu prinatu grishmam | grishma
    mrituna mrituna ngrishma mritunam | mprinami prina myrituna mrituna prinami sa sa prinami prinami
    sah | ma pritah prito ma ma pritah | pritah prinatu prinatu pritah pritah prinatu | prinatu varsha
    varshah prinatu prinatu varshah | varsha rituna mritunam va~rsha varsha ritunam | mprinami prina myrituna
    mrituna prinami tastah prinami prinami tah | ta ma ma tasta ma ma pritah prita ma ma pritah | pritah
    prinantu prinantu pritah pritah prinantu | mprinantu prinantu sharada sharada mrituna mritunagm sharada
    mprinami prina myrituna mrituna prinami sa sa prinami prinami sa | ma prita prita ma ma prita | prita
    prinatu prinatu prita prita prinatu | prinatu hemantashishirau hemantashishirau prinatu prinatu hemantashishirau
    | hemantashishira vrituna mritunagm hemantashishirau hemantashishira vritunam | hemantashishiraviti
    hemanta mprinami prina myrituna mrituna prinami tau tau prinami prinami tau | ma pritau pritau ma
    ma pritau | mpritau pritau prinitam | prinita magnishomayo ragnishomayoh prinita mprinita magnishomayoh
    | agnishomayo raha maha magnishomayo ragnishomayo raham | agnishomayorityagni ndevayajyaya devayajyaya
    'ha maha devayajyaya cakshushma ndevayajyaya devayajyaya cakshushman | bhuyasa magne ragne agne raha
    maha magne ragne raham | ndevayajyaya devayajyaya 'ha maha 'nnado devayajyaya devayajyaya dabdhi rasyasi
    dabdhi asyadabdho 'dabdho 'syasyadabdhah | mbhuyasa madabdho 'dabdho bhuyasam | dabheya magnishomayo
    ragnishomayo ndabheya magnishomayoh | agnishomayoraha maha magnishomayo ragnishomayoraham | agnishomayorityagni
    ndevayajyaya devayajyaya 'ha maha devayajyaya vritraha vritraha devayajyaya devayajyaya vritraha |
    vri~traha vritraha bhuyasam | bhuyasa mindragniyo rindragniyo mbhuyasa mindragniyoh | indragniyoraha
    maha mindragniyo rindragniyoraham | indragniyoriti ndevayajyaya devayajyaya 'ha maha ndriyavindriyavi
    devayajyaya devayajya ye indriya vyannado 'nnada indriya vindriya vyannadah | bhuyasa mindrasye ndrasya
    bhuyasa mbhuyasa mindrasya | indrasyaha maha mindrasye ndrasyaham | ndevayajyaya devayajyaya 'ha maha
    ndriya vindriyavi devayajyaya devayajya ye indriyavi bhuyasa mbhuyasa mindriya vindriyavi bhuyasam
    | mmahendrasya mahendrasya bhuyasa mahendrasyaha maha mmahendrasya mahendrasyaham | mahendrasyeti
    maha ndevayajyaya devayajyaya 'ha maha devayajyaya jemana ndevayajyaya devayajyaya jemana gameya magne
    ragne ssvishtakritah svishtakrito 'gneragne svishtakrito 'ha mahagg svishtakritah svishtakrito 'ham
    | svishtakrita iti svishta ndevayajyaya devayajyaya 'ha maha devayajyaya ''yushma nayushma ndevayajyaya
    devayajyaya ''yushman | yajnena yajnenayushma nayushman ya~jnena yajnena pratishtham | pratishthamiti
    prati gameyamiti gameyam | || rma ma 'gni ragni nma ma durishtat | tpatu patu durishta patu savita
    savita patu patu savita | thsavita savita 'ghasha me 'ntyanti me me 'nti | anti dure dure 'ntyanti
    dure | dure 'ratiyatya ratiyati dure dure 'ratiyati | nta maratiya tyaratiyati tam | njesha mete naitena
    jesham | ihima nima nihihiman | nbhadra nima nima mma mihihi mam | ma manuvrata 'nuvrata ma anuvrata
    ni nyanuvrata 'nuvrata ni | nyu vu ni nyu | u shirshani shirshanyu vu shirshani | mmridhvagm shirshani
    shirshani mridhvam | mridhva mida ide mridhva ihyadite 'dita ihihyadite | adita a 'dite 'dita a |
    ihi sarasvati sarasvatihihi sarasvati | sarasvatya sarasvati sarasvatya | ihi ranti ranti rihihi rantih
    | ranti rasyasi ranti rantirasi | asi ramati ramati rasyasi ramatih | ramati rasyasi ramati ramatirasi
    | asi sunari sunaryasyasi sunari sunaryasyasi sunari sunaryasi | asi jushte jushte njushte jushte
    jushti te 'shiyashiya te te 'shiya | ashiyopahuta upahute 'shiya shiyopahute | upahuta upahava mupahava
    mupahuta upahuta upahavam | nte ta upahava mupahava te 'shiyashiya te te 'shiya | ashiya sa sa 'shiyashiya
    sa | me satya satya me me satya | ssatya satya ''shih | ashi rasyasya shirashi rasya | asya yajnasya
    yajna syasyasya yajnasya | dyajnasya yajnasya bhuyat | bhuyada redata 'redata bhuya aredata manasa
    manasa 'redata 'redata manasa | nmanasa manasa tat | rohatu yajno yajno rohatu rohatu yajnah | ngacchatu
    gacchatu diva gacchatu yo yo gacchatu gacchatu yah | yo devayano devayano yo yo devayanah | devayanah
    panthah pantha devayano devayanah panthah pantha stena tena panthah pantha stena | tena yajno yajna
    stena tena yajnah | yajno yajno devan | devagm apyapi deva tvetva pyapyetu | etva smasvasma sve asma
    svindra indro 'smasvasma svindrah | indra indriya mindriya mindra indra indriyam | ndadhatu dadhatvindriya
    mindriya dadhatvasma nasma ndadhatu dadhatvasman | nrayo rayo 'sma nasma raya utota rayo raya uta
    | uta yajna yajna utota yajnah | ssacantagm sacantam sacanta masma svasmasu sacantagm sacanta masmasu
    | asmasu santu santva smasvasmasu santu | santvashisha ashishah santu santvashishah | ssa sa ''shisha
    ashisha nah priya priya no nah priya | rtih priya priya supratu rmaghoni maghoni supratu rmaghoni
    maghoni jushtih | jushtirasyasi jushti asi jushasva jushasva jushasva no no jushasva jushasva nah
    | no jushta jushta no no jushta jushta no no jushta jushta nah | no 'syasi no no 'si | || njushti
    masyasi jushti nte te gameyam | rmano mano jyotih | jushata majya majya vi~cchinna majya majyam sa
    mima mimagm sagm sa mimam | ndadhatu dadhatvima mima dadhatviti dadhatu | rbrihaspati stanutam | no
    vishve vishve no no vishve vishve deva deva vishve vishve devah | deva ihe ha deva deva iha | mmadayanta
    mihe ha madayantam | madayantamiti madayantam | braddhna pinvasva pinvasva braddhna braddhna pinvasva
    | pinvasva dadato dadatah pinvasva pinvasva dadatah | dadato me me dadato dadato me | me ma ma me
    me ma | ma kshayi kshayi ma ma kshayi | kshayi kurvatah kurvatah kshayi kshayi kurvatah | kurvato
    me me kurvatah kurvato me me ma ma me me ma | tprajapateh prajapate rbhago bhagah prajapateh prajapate
    prajapateriti praja 'syasi bhago bhago 'si | asyurjasva nurjasva nasya syurjasvan | npayasva nurjasva
    nurjasva npranapanau pranapanau payasva pranapanau me me pranapanau pranapanau me pranapanaviti prana
    me pahi pahi me me pahi | pahi samanavyanau samanavyanau pahi pahi samanavyanau | samanavyanau me
    me samanavyanau samanavyanau me samanavyanaviti samana me pahi pahi me me pahi | pa hyudanavyana vudanavyanau
    pahi pa hyudanavyanau | udanavyanau me ma udanavyana vudanavyanau me udanavyanavityudana me pahi pahi
    me me pahi | pahyakshito 'kshitah pahi pahyakshitah | akshito 'syasyakshito 'kshito 'si | asyakshitya
    akshitya asyasyakshityai | akshityai tva tva 'kshitya akshityai tva | ksheshtha me me ksheshthah |
    ksheshtha amutramutra ksheshthah nnamutra mutramushminn | amushmin ~loke loke 'mushmi nnamushmin ~loke
    | mbarhisho barhisho 'ham | ndevayajyaya devayajyaya 'ha maha ndevayajyaya devayajyaya prajavaniti
    praja nnarashagmsasya narashagmsasya bhuyasa narashagmsasyaha maha nnarashagmsasya narashagmsasyaham
    | ndevayajyaya devayajyaya 'ha maha devayajyaya pashuma ndevayajyaya devayajyaya pashuman | bhuyasa
    magne ragne ssvishtakritah svishtakrito 'gne ragne svishtakrito 'ha mahagg svishtakritah svishtakrito
    'ham | svishtakrita iti svishta ndevayajyaya devayajyaya 'ha maha devayajyaya ''yushma nayushma ndevayajyaya
    devayajyaya ''yushman | yajnena yajnenayushma nayushman ya~jnena yajnena pratishtham | pratishthamiti
    prati gameya magne ragne agne raha maha magne ragneraham | aha mujjiti mujjiti maha maha mujjitim
    | ujjiti manvanujjiti mujjiti manu | njesha muduj jesham | somasya somasya jesha somasyaha mahagm
    somasya somasyaham | aha mujjiti mujjiti maha maha mujjitim | ujjiti manvanujjiti mujjiti manu | njesha
    muduj jesham | agne raha maha magne ragneraham | aha mujjiti mujjiti maha maha mujjitim | ujjiti manvanujjiti
    mujjiti manu | njesha muduj jesham | jesha magnishomayo ragnishomayo njesha magnishomayoh | agnishomayo
    raha maha magnishomayo ragnishomayo raham | agnishomayorityagni aha mujjiti mujjiti maha maha mujjitim
    | ujjiti manvanujjiti mujjiti manu | njesha muduj jesham | jesha mindragniyo rindragniyo njesha mindragniyoh
    | indragniyo raha maha mindragniyo rindragniyo raham | indragniyoriti aha mujjiti mujjiti maha maha
    mujjitim | ujjiti manvanujjiti mujjiti manu | njesha muduj jesham | jesha mindrasye ndrasya jesha
    njesha mindrasya | indrasyaha maha mindrasye ndrasyaham | aha mujjiti mujjiti maha maha mujjitim |
    || ujjiti manvanujjiti mujjiti manu | njesha muduj jesham | mmahendrasya mahendrasya jesha mahendrasyaha
    maha mmahendrasya mahendrasyaham | mahendrasyeti maha aha mujjiti mujjiti maha maha mujjitim | ujjiti
    manvanujjiti mujjiti manu | njesha muduj jesham | ssvishtakritah svishtakrito 'gneragne svishtakrito
    'ha mahagg svishtakritah svishtakrito 'ham | svishtakrita iti svishta aha mujjiti mujjiti maha maha
    mujjitim | ujjiti manvanujjiti mujjiti manu | njesha muduj jesham | va~jasya vajasya jesha vajasya
    ma ma vajasya vajasya ma | ma prasavena prasavena ma ma prasavena | dgrabhena prasavena prasave no
    udgrabhe nodududgrabhe no udgrabhenetyut udagrabhi dagrabhi dudu dagrabhit | agrabhidityagrabhit |
    indra indrah sapatna indro me ma indra indro me | me nigrabhena nigrabhena me me nigrabhena | nnigrabhena
    nigrabhenadharan | adharagm aka raka radha ra nca codgrabha mudgrabha ca brahma brahma ca ca brahma
    | brahma deva deva brahma brahma devah | ndeva deva avivridhann | avivridhannityavivridhann | nthsapatna
    nathatha sapatnan | sapatna nindragni indragni sapatna nthsapatna nindragni | indragni me ma indragni
    indragni me nme me vishucinan | asyatamityasyatam | nnima ima agmann | ashisho dohakama dohakama ashisha
    ashisho dohakamah | dohakama indravanta indravanto dohakama dohakama indravantah | indravanto vanamahe
