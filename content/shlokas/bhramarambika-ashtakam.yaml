id: bhramarambika-ashtakam
category: stotram
name:
  english: Bhramarambika Ashtakam
content:
  english: ravisudhakara vahnilocana ratnakundala bhushini pravimalambuga mammunelina bhaktajana cintamani
    | avani janulaku kòngubangaraina daivashikhamani shivuni pattapurani gunamani shrigiri bhramarambika
    || || kaliyugambuna manavulakunu kalpataruvai yundava vèlayagunu shri shikharamanduna vibhavamai vilasillava
    | alasimpaka bhaktavarulaku ashtasampada liyava jilugu kunkuma kantirekhala shrigiri bhramarambika
    || || anga vanga kalinga kashmirandhra deshamulandunan pòngucunu varahala kònkana punyabhumula yandunan
    | ranguga karnata rata marata deshamulandunan shringini deshamula vèlasina shrigiri bhramarambika
    || || akshayambuga kashilopala annapurna bhavanivai sakshiganapati kanna tallivi sadgunavati shambhavi
    | mokshamosagèdu kanakadurgavu mulakarana shaktivi shikshajetuvu ghorabhavamula shrigiri bhramarambika
    || || ugralocana varavadhumani kòppugalgina bhamini vigrahambula kèlla ghanamai vèlayu shobhanakarini
    | agrapithamunandu vèlasina agamartha vicarini shighramekani varamulittuvu shrigiri bhramarambika
    || || nigamagocara nilakundali nirmalangi niranjani migula cakkani pushpakomali minanetra dayanidhi
    | jagatilona prasiddhikèkkina candramukhi simantini cigurutakulavanti pèdavula shrigiri bhramarambika
    || || somashekhara pallavadhari sundarimani dhimani komalangi kripapayonidhi kutilakuntala yogini
    | na manambuna payakundama nagakuleshuni nandini simalona prasiddhikèkkina shrigiri bhramarambika
    || || bhutanathuni vamabhagamu pònduga cekònduva khyatiganu shrishailamuna vikhyatiga nèlakòntiva
    | patakambula paradrolucu bhaktulanu cekòntiva shvetagiripai nundi vèlasina shrigiri bhramarambika
    || || èllavèlasina nidu bhavamu vishnulokamu nanduna pallavincunu ni prabhavamu brahmalokamu nanduna
    | tèllamuga kailasamanduna mudulokamu landuna cèllunamma trilokavasini shrigiri bhramarambika || ||
    taruni shrigiri mallikarjuna daivarayala bhamini karunato mammelu yèppudu kalpavrikshamu bhangini
    | varusato ni yashtakambunu vrasi cadivina variki sirulaniccèda vèlla kalamu shrigiri bhramarambika
    ||
  devanagari: रविसुधाकर वह्निलोचन रत्नकुण्डल भूषिणी प्रविमलम्बुग मम्मुनेलिन भक्तजन चिन्तामणी । अवनि जनुलकु
    कॊङ्गुबङ्गारैन दैवशिखामणी शिवुनि पट्टपुराणि गुणमणि श्रीगिरि भ्रमराम्बिका ॥ ॥ कलियुगम्बुन मानवुलकुनु
    कल्पतरुवै युण्डवा वॆलयगुनु श्री शिखरमन्दुन विभवमै विलसिल्लवा । आलसिम्पक भक्तवरुलकु अष्टसम्पद लीयवा
    जिलुगु कुङ्कुम कान्तिरेखल श्रीगिरि भ्रमराम्बिका ॥ ॥ अङ्ग वङ्ग कलिङ्ग काश्मीरान्ध्र देशमुलन्दुनन् पॊङ्गुचुनु
    वरहाल कॊङ्कण पुण्यभूमुल यन्दुनन् । रङ्गुगा कर्णाट राट मराट देशमुलन्दुनन् शृङ्गिनी देशमुल वॆलसिन श्रीगिरि
    भ्रमराम्बिका ॥ ॥ अक्षयम्बुग काशिलोपल अन्नपूर्ण भवानिवै साक्षिगणपति कन्न तल्लिवि सद्गुणावति शाम्भवी
    । मोक्षमोसगॆडु कनकदुर्गवु मूलकारण शक्तिवि शिक्षजेतुवु घोरभवमुल श्रीगिरि भ्रमराम्बिका ॥ ॥ उग्रलोचन
    वरवधूमणि कॊप्पुगल्गिन भामिनी विग्रहम्बुल कॆल्ल घनमै वॆलयु शोभनकारिणी । अग्रपीठमुनन्दु वॆलसिन आगमार्थ
    विचारिणी शीघ्रमेकनि वरमुलित्तुवु श्रीगिरि भ्रमराम्बिका ॥ ॥ निगमगोचर नीलकुण्डलि निर्मलाङ्गि निरञ्जनी
    मिगुल चक्कनि पुष्पकोमलि मीननेत्र दयानिधी । जगतिलोन प्रसिद्धिकॆक्किन चन्द्रमुखि सीमन्तिनी चिगुरुटाकुलवण्टि
    पॆदवुल श्रीगिरि भ्रमराम्बिका ॥ ॥ सोमशेखर पल्लवाधरि सुन्दरीमणी धीमणी कोमलाङ्गि कृपापयोनिधि कुटिलकुन्तल
    योगिनी । ना मनम्बुन पायकुण्डम नगकुलेशुनि नन्दिनी सीमलोन प्रसिद्धिकॆक्किन श्रीगिरि भ्रमराम्बिका ॥ ॥
    भूतनाथुनि वामभागमु पॊन्दुगा चेकॊन्दुवा ख्यातिगनु श्रीशैलमुन विख्यातिगा नॆलकॊण्टिवा । पातकम्बुल पारद्रोलुचु
    भक्तुलनु चेकॊण्टिवा श्वेतगिरिपै नुण्डि वॆलसिन श्रीगिरि भ्रमराम्बिका ॥ ॥ ऎल्लवॆलसिन नीदु भावमु विष्णुलोकमु
    नन्दुन पल्लविञ्चुनु नी प्रभावमु ब्रह्मलोकमु नन्दुन । तॆल्लमुग कैलासमन्दुन मूडुलोकमु लन्दुन चॆल्लुनम्म
    त्रिलोकवासिनि श्रीगिरि भ्रमराम्बिका ॥ ॥ तरुणि श्रीगिरि मल्लिकार्जुन दैवरायल भामिनी करुणतो मम्मेलु
    यॆप्पुडु कल्पवृक्षमु भङ्गिनी । वरुसतो नी यष्टकम्बुनु व्रासि चदिविन वारिकि सिरुलनिच्चॆद वॆल्ल कालमु
    श्रीगिरि भ्रमराम्बिका ॥
