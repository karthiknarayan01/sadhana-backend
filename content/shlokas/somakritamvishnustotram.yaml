id: somakritamvishnustotram
category: stotram
name:
  english: somakritamvishnustotram
  devanagari: सोमकृतंविष्णुस्तोत्रम्
content:
  english: somakritam vishnustotram soma uvaca | param param vishnuraparaparah parah parebhyah paramartharupi
    | sa brahmaparah paraparabhutah parah paranamapi paraparah || 55|| sa karanam karanatastato'pi tasyapi
    hetuh parahetuhetuh | karyeshu caivam saha karmakartrirupairasheshairavatiha sarvam || 56|| brahma
    prabhurbrahma sa sarvabhuto brahma prajanam patiracyuto'sau | brahmavyayam nityamajam sa vishnurapakshayadyairakhilairasangi
    || 57|| brahmaksharamajam nityam yatha'sau purushottamah | tatha ragadayo doshah prayantu prashamam
    mama || 58|| iti vishnupurane prathamabhage pancadashadhyayantargatam somakritam vishnustotram samaptam
    | vishnupurana | bhaga 1| adhyaya 15
  devanagari: सोमकृतं विष्णुस्तोत्रम् सोम उवाच । पारं परं विष्णुरपारपारः परः परेभ्यः परमार्थरूपी । स ब्रह्मपारः
    परपारभूतः परः पराणामपि पारपारः ॥ ५५॥ स कारणं कारणतस्ततोऽपि तस्यापि हेतुः परहेतुहेतुः । कार्येषु चैवं
    सह कर्मकर्तृरूपैरशेषैरवतीह सर्वम् ॥ ५६॥ ब्रह्म प्रभुर्ब्रह्म स सर्वभूतो ब्रह्म प्रजानां पतिरच्युतोऽसौ
    । ब्रह्माव्ययं नित्यमजं स विष्णुरपक्षयाद्यैरखिलैरसङ्गि ॥ ५७॥ ब्रह्माक्षरमजं नित्यं यथाऽसौ पुरुषोत्तमः
    । तथा रागादयो दोषाः प्रयान्तु प्रशमं मम ॥ ५८॥ इति विष्णुपुराणे प्रथमभागे पञ्चदशाध्यायान्तर्गतं सोमकृतं
    विष्णुस्तोत्रं समाप्तम् । विष्णुपुराण । भाग १। अध्याय १५
meaning: {}
