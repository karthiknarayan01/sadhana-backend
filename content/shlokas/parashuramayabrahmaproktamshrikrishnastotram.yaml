id: parashuramayabrahmaproktamshrikrishnastotram
category: stotram
name:
  english: parashuramayabrahmaproktamshrikrishnastotram
  devanagari: परशुरामायब्रह्मप्रोक्तंश्रीकृष्णस्तोत्रम्
content:
  english: rinu rama pravakshyami sarvasampatkaram param | kanvashakhoktavacanam satyam vai sarvasammatam
    || 83|| pujyanameva sarveshamishtah pujyatamah parah | janako janmadanacca palanacca pita smritah
    || 84|| gariyanjanmadatushca so'nnadata pita mune | vina'nnam nashvaro deho nityam ca piturudbhavah
    || 89|| tayoh shatagunam mata pujya manya ca vandita | garbhadharanaposhabhyam saiva prokta gariyasi
    || 86|| tebhyah shatagunam pujyo'bhishtadevah shrutau shrutah | jnanavidyamantradata'bhishtadevatparo
    guruh || 87|| guruvadguruputrashca gurupatni tato'dhika | deve rushte guru rakshedgurau rushte na
    kashcana || 88|| gururbrahma gururvishnurgururdevo maheshvarah | gurureva param brahma brahmanebhyah
    priyah parah || 89|| gururjnanam dadatyeva jnanam ca haribhaktidam | haribhaktipradata yah ko va bandhustatah
    param || 90|| ajnanatimiracchanno jnanadipam yato labhet | labdhva ca nirmalam pashyetko va bandhustatah
    parah || 91|| gurudattam sumantram ca japtva jnanam tato labhet | sarvajnatvacca siddhim ca ko va
    bandhustato'dhikah || 92|| sukham jayati sarvatra vidyaya gurudattaya | yaya pujyo'pi jagati ko va
    bandhustato'dhikah || 93|| vidyandho va dhanandho va yo mudho na yajedgurum | brahmahatyadikam papam
    labhate natra samshayah || 94|| daridram patitam kshudram narabuddhya bhajedgurum | tirthasnato'pi
    na shucirnadhikari ca karmasu || 95|| abhishtadevah shrikrishno guruste shankarah svayam | sharanam
    gaccha he putra devapujyatamam gurum || 96|| trissaptakritvo nirbhupa tvaya prithvi krita yatah |
    prapta tvaya harerbhaktistam shivam sharanam vraja || 97|| shivam ca shivarupam ca shivadam shivakaranam
    | shivaradhyam shivam shantam gurum tvam sharanam vraja || 98|| golokanatho bhagavanamshena shivarupadhrik
    | ya ishtadevah sa gurustameva sharanam vraja || 99|| atma krishnah shivo jnanam mano'ham sarvajivishu
    | prana vishnossa prakritissarvashaktiyuta suta || 100|| jnanadam jnanarupam ca jnanabijam sanatanam
    | mrityunjayam kalakalam tam gurum sharanam vraja || 101|| brahmajyotissvarupam tam bhaktanugrahavigraham
    | sharanam vraja sarvajnam bhagavantam sanatanam || 102|| prakritirlakshavarsham ca tapastaptva yamishvaram
    | kantam priyapatim lebhe tam gurum sharanam vraja || 103|| ityuktva munibhih sarddham jagama kamalodbhavah
    | ramashca gantum kailasam manashcakre ca narada || 104|| iti shribrahmavaivarttapurane ganeshakhande
    catvarimshadhyayantargatam parashuramaya brahmaproktam shrikrishnastotram samaptam | brahmavaivartapurana
    | ganapatikhanda | adhyaya 40
  devanagari: ृणु राम प्रवक्ष्यामि सर्वसम्पत्करं परम् । काण्वशाखोक्तवचनं सत्यं वै सर्वसम्मतम् ॥ ८३॥ पूज्यानामेव
    सर्वेषामिष्टः पूज्यतमः परः । जनको जन्मदानाच्च पालनाच्च पिता स्मृतः ॥ ८४॥ गरीयाञ्जन्मदातुश्च सोऽन्नदाता
    पिता मुने । विनाऽन्नं नश्वरो देहो नित्यं च पितुरुद्भवः ॥ ८९॥ तयोः शतगुणं माता पूज्या मान्या च वन्दिता
    । गर्भधारणपोषाभ्यां सैव प्रोक्ता गरीयसी ॥ ८६॥ तेभ्यः शतगुणं पूज्योऽभीष्टदेवः श्रुतौ श्रुतः । ज्ञानविद्यामन्त्रदाताऽभीष्टदेवात्परो
    गुरुः ॥ ८७॥ गुरुवद्गुरुपुत्रश्च गुरुपत्नी ततोऽधिका । देवे रुष्टे गुरू रक्षेद्गुरौ रुष्टे न कश्चन ॥
    ८८॥ गुरुर्ब्रह्मा गुरुर्विष्णुर्गुरुर्देवो महेश्वरः । गुरुरेव परं ब्रह्म ब्राह्मणेभ्यः प्रियः परः
    ॥ ८९॥ गुरुर्ज्ञानं ददात्येव ज्ञानं च हरिभक्तिदम् । हरिभक्तिप्रदाता यः को वा बन्धुस्ततः परम् ॥ ९०॥
    अज्ञानतिमिराच्छन्नो ज्ञानदीपं यतो लभेत् । लब्ध्वा च निर्मलं पश्येत्को वा बन्धुस्ततः परः ॥ ९१॥ गुरुदत्तं
    सुमन्त्रं च जप्त्वा ज्ञानं ततो लभेत् । सर्वज्ञत्वाच्च सिद्धिं च को वा बन्धुस्ततोऽधिकः ॥ ९२॥ सुखं जयति
    सर्वत्र विद्यया गुरुदत्तया । यया पूज्योऽपि जगति को वा बन्धुस्ततोऽधिकः ॥ ९३॥ विद्यान्धो वा धनान्धो
    वा यो मूढो न यजेद्गुरुम् । ब्रह्महत्यादिकं पापं लभते नात्र संशयः ॥ ९४॥ दरिद्रं पतितं क्षुद्रं नरबुद्ध्या
    भजेद्गुरुम् । तीर्थस्नातोऽपि न शुचिर्नाधिकारी च कर्मसु ॥ ९५॥ अभीष्टदेवः श्रीकृष्णो गुरुस्ते शङ्करः
    स्वयम् । शरणं गच्छ हे पुत्र देवपूज्यतमं गुरुम् ॥ ९६॥ त्रिस्सप्तकृत्वो निर्भूपा त्वया पृथ्वी कृता यतः
    । प्राप्ता त्वया हरेर्भक्तिस्तं शिवं शरणं व्रज ॥ ९७॥ शिवां च शिवरूपं च शिवदं शिवकारणम् । शिवाराध्यं
    शिवं शान्तं गुरुं त्वं शरणं व्रज ॥ ९८॥ गोलोकनाथो भगवानंशेन शिवरूपधृक् । य इष्टदेवः स गुरुस्तमेव शरणं
    व्रज ॥ ९९॥ आत्मा कृष्णः शिवो ज्ञानं मनोऽहं सर्वजीविषु । प्राणा विष्णोस्सा प्रकृतिस्सर्वशक्तियुता सुत
    ॥ १००॥ ज्ञानदं ज्ञानरूपं च ज्ञानबीजं सनातनम् । मृत्युञ्जयं कालकालं तं गुरुं शरणं व्रज ॥ १०१॥ ब्रह्मज्योतिस्स्वरूपं
    तं भक्तानुग्रहविग्रहम् । शरणं व्रज सर्वज्ञं भगवन्तं सनातनम् ॥ १०२॥ प्रकृतिर्लक्षवर्षं च तपस्तप्त्वा
    यमीश्वरम् । कान्तं प्रियपतिं लेभे तं गुरुं शरणं व्रज ॥ १०३॥ इत्युक्त्वा मुनिभिः सार्द्धं जगाम कमलोद्भवः
    । रामश्च गन्तुं कैलासं मनश्चक्रे च नारद ॥ १०४॥ इति श्रीब्रह्मवैवर्त्तपुराणे गणेशखण्डे चत्वारिंशाध्यायान्तर्गतं
    परशुरामाय ब्रह्मप्रोक्तं श्रीकृष्णस्तोत्रं समाप्तम् । ब्रह्मवैवर्तपुराण । गणपतिखण्ड । अध्याय ४०
