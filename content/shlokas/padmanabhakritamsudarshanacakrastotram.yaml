id: padmanabhakritamsudarshanacakrastotram
category: stotram
name:
  english: padmanabhakritamsudarshanacakrastotram
  devanagari: पद्मनाभकृतंसुदर्शनचक्रस्तोत्रम्
content:
  english: padmanabhakritam sudarshanacakrastotram padmanabha uvaca | vishnucakra namaste'stu vishvarakshanadikshita
    | narayanakarambhojabhushanaya namo'stu te || 37|| yuddheshvasurasamharakushalaya maharava | sudarshana
    namastubhyam bhaktanamartinashana || 38|| raksha mam bhayasamvignam sarvasmadapi kalmashat | svaminsudarshana
    vibho cakratirthe sada bhavan || 39|| iti shriskandapurane vaishnavakhande venkatacalamahatmye trayovimshadhyayantargatam
    padmanabhakritam sudarshanacakrastotram samaptam | skandapurana | vaishnavakhanda | venkatakhanda
    | adhyaya 23
  devanagari: पद्मनाभकृतं सुदर्शनचक्रस्तोत्रम् पद्मनाभ उवाच । विष्णुचक्र नमस्तेऽस्तु विश्वरक्षणदीक्षित
    । नारायणकराम्भोजभूषणाय नमोऽस्तु ते ॥ ३७॥ युद्धेष्वसुरसंहारकुशलाय महारव । सुदर्शन नमस्तुभ्यं भक्तानामार्तिनाशन
    ॥ ३८॥ रक्ष मां भयसंविग्नं सर्वस्मादपि कल्मषात् । स्वामिन्सुदर्शन विभो चक्रतीर्थे सदा भवान् ॥ ३९॥ इति
    श्रीस्कन्दपुराणे वैष्णवखण्डे वेङ्कटाचलमाहात्म्ये त्रयोविंशाध्यायान्तर्गतं पद्मनाभकृतं सुदर्शनचक्रस्तोत्रं
    समाप्तम् । स्कन्दपुराण । वैष्णवखण्ड । वेङ्कटखण्ड । अध्याय २३
meaning: {}
