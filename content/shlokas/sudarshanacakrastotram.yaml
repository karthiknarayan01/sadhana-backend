id: sudarshanacakrastotram
category: stotram
name:
  english: sudarshanacakrastotram
  devanagari: सुदर्शनचक्रस्तोत्रम्
content:
  english: rinushva ca | sahasraram hum phat namo mantrah pranavapurvakah || 3|| kathitah sarvadushtanam
    nashako mantrabhedakah | dhyayetsudarshanam devam hridi padme'male shubhe || 4|| shankhacakragadapadmadharam
    saumyam kiritinam | avahya mandale devam purvoktavidhina hara || 5|| pujayedgandhapushpadyairupacarairmaheshvara
    | pujayitva japenmantram shatamashtottaram narah || 6|| evam yah kurute rudra cakrasyarcanamuttamam
    | sarvarogavinirmukto vishnulokam samapnuyat || 7|| etatstotram japetpashcatsarvavyadhivinashanam
    | atha stotram | namah sudarshanayaiva sahasradityavarcase || 8|| jvalamalapradiptaya sahasraraya
    cakshushe | sarvadushtavinashaya sarvapatakamardine || 9|| sucakraya vicakraya sarvamantravibhedine
    | prasavitre jagaddhatre jagadvidhvamsine namah || 10|| palanarthaya lokanam dushtasuravinashine |
    ugraya caiva saumyaya candaya ca namo namah || 11|| namashcakshuhsvarupaya samsarabhayabhedine | mayapanjarabhetre
    ca shivaya ca namo namah || 12|| grahatigraharupaya grahanam pateya namah | kalaya mrityave caiva
    bhimaya ca namo namah || 13|| bhaktanugrahadatre ca bhaktagoptre namo namah | vishnurupaya shantaya
    cayudhanam dharaya ca || 14|| vishnushastraya cakraya namo bhuyo namo namah | iti stotram mahapunyam
    cakrasya tava kirtitam || 15|| yah pathetparaya bhaktya vishnulokam sa gacchati | cakrapujavidhim
    yashca pathedrudra jitondriyah | sa papam bhasmasatkritva vishnulokaya kalpate || 16|| iti shrigarude
    mahapurane purvakhande prathamamshakhye acarakande sudarshanapujavidhirnama trayastrimsho'dhyayah
    sampurnah |
  devanagari: ृणुष्व च । सहस्रारं हुं फट् नमो मन्त्रः प्रणवपूर्वकः ॥ ३॥ कथितः सर्वदुष्टानां नाशको मन्त्रभेदकः
    । ध्यायेत्सुदर्शनं देवं हृदि पद्मेऽमले शुभे ॥ ४॥ शङ्खचक्रगदापद्मधरं सौम्यं किरीटिनम् । आवाह्य मण्डले
    देवं पूर्वोक्तविधिना हर ॥ ५॥ पूजयेद्गन्धपुष्पाद्यैरुपचारैर्महेश्वर । पूजयित्वा जपेन्मन्त्रं शतमष्टोत्तरं
    नरः ॥ ६॥ एवं यः कुरुते रुद्र चक्रस्यार्चनमुत्तमम् । सर्वरोगविनिर्मुक्तो विष्णुलोकं समाप्नुयात् ॥ ७॥
    एतत्स्तोत्रं जपेत्पश्चात्सर्वव्याधिविनाशनम् । अथ स्तोत्रम् । नमः सुदर्शनायैव सहस्रादित्यवर्चसे ॥ ८॥
    ज्वालामालाप्रदीप्ताय सहस्राराय चक्षुषे । सर्वदुष्टविनाशाय सर्वपातकमर्दिने ॥ ९॥ सुचक्राय विचक्राय सर्वमन्त्रविभेदिने
    । प्रसवित्रे जगद्धात्रे जगद्विध्वंसिने नमः ॥ १०॥ पालनार्थाय लोकानां दुष्टासुरविनाशिने । उग्राय चैव
    सौम्याय चण्डाय च नमो नमः ॥ ११॥ नमश्चक्षुःस्वरूपाय संसारभयभेदिने । मायापञ्जरभेत्रे च शिवाय च नमो नमः
    ॥ १२॥ ग्रहातिग्रहरूपाय ग्रहाणां पतेय नमः । कालाय मृत्यवे चैव भीमाय च नमो नमः ॥ १३॥ भक्तानुग्रहदात्रे
    च भक्तगोप्त्रे नमो नमः । विष्णुरूपाय शान्ताय चायुधानां धराय च ॥ १४॥ विष्णुशस्त्राय चक्राय नमो भूयो
    नमो नमः । इति स्तोत्रं महापुण्यं चक्रस्य तव कीर्तितम् ॥ १५॥ यः पठेत्परया भक्त्या विष्णुलोकं स गच्छति
    । चक्रपूजाविधिं यश्च पठेद्रुद्र जितोन्द्रियः । स पापं भस्मसात्कृत्वा विष्णुलोकाय कल्पते ॥ १६॥ इति
    श्रीगारुडे महापुराणे पूर्वखण्डे प्रथमांशाख्ये आचारकाण्डे सुदर्शनपूजाविधिर्नाम त्रयस्त्रिंशोऽध्यायः
    सम्पूर्णः ।
