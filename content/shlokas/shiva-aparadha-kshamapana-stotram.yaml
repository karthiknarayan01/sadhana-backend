id: shiva-aparadha-kshamapana-stotram
category: stotram
name:
  english: Shiva Aparadha Kshamapana Stotram
  devanagari: शिवपराधक्षमापणस्तोत्रम्
content:
  english: shivaparadhakshamapanastotram shankaracaryah 1910 shivaparadhakshamapanastotram shankaracaryah
    1910 || shrih|| shivaparadha kshamapanastotram|| adau karma prasangatkalayati kalusham matrikukshau
    sthitam mam vinmutramedhyamadhye kathayati nitaram jatharo jatavedah | yadyadvai tatra du kham vyathayati
    nitaram shakyate kena vaktum kshantavyo me'paradhah shiva shiva shiva bhoh shrimahadeva shambho ||
    balye duhkhatirekanmalalulitavapuh stanyapane pipasu rno shaktashcendriyebhyo bhava malajanita jantavo
    mam tudanti | nanarogatiduhkhadruditaparavashah shamkaram na smarami kshantavyo me'paradhah shiva
    shiva shiva bhoh shrimahadeva shambho || praudho'ham yauvanastho vishayavishadharaih pancabhirmarmasamdhau
    dashto nashto vivekah sutadhanayuvatisvadusaukhye nishannah | shaive cintavihinam mama hridayamaho
    managarvadhirudham kshantavyo me'paradhah shiva shiva shiva bhoh shrimahadeva shambho || vardhakye
    cendriyanam vikalagatimatashcadhidevaditapaih praptai rogairviyogairvyasanakrishatanorjnaptihinam
    ca dinam | mithyamohabhilashairbhramati mama mano dhurjaterdhyanashunyam kshantavyo me'paradhah shiva
    shiva shiva bhoh shrimahadeva shambho || snatva pratyushakale snapanavidhividhau nahritam gangatoyam
    pujartham va kadacidbahutaragahane'khandabilvidalam va | nanita padmamala sarasi vikasita gandhapushpaistvadartham
    kshantavyo me'paradhah shiva shiva shiva bhoh shrimahadeva shambho || dugdhairmadhvajyayuktairdadhigudasahitaih
    snapitam naiva lingam no liptam candanadyaih kanakaviracitaih pujitam na prasunaih | dhupaih karpuradipairvividharasayutairnaiva
    bhakshyopaharaih mantavyo me'paradhah shiva shiva shiva bhoh shrimahadeva shambho || no shakyam smartakarma
    pratipadagahane pratyavayakuladhye shraute varta katham me dvijakulavihite brahmamarganusare | tattve'jnate
    vicare shravanamananayoh kim nididhyasitavyam kshantavyo me'paradhah shiva shiva shiva bhoh shrimahadeva
    shambho || dhyatva citte shivakhyam pracurataradhanam naiva dattam dvijebhyo havyam te lakshasamkhyairhutavahavadane
    narpitam bijamantraih | no taptam gangatire vratajapaniyamai rudrajapyam na japtam kshantavyo me'paradhah
    shiva shiva shiva bhoh shrimahadeva shambho|| nagno nihsamgashuddhatrigunavirahito dhvastamohandhakaro
    nasagranyastadrishtirviditabhavaguno naiva drishtah kadacit | unmanyavasthaya tvam vigatagatimati
    shamkaram na smarami kshantavyo me'paradhah shiva shiva shiva bhoh shrimahadeva shambho || sthitva
    sthane saroje pranavamayamarutkumbhite sukshmamarge shante svante praline prakatitavibhave divyarupe
    shivakhye | lingagre brahmavakye sakalatanugatam shamkaram na smarami kshantavyo me'paradhah shiva
    shiva shiva bhoh shrimahadeva shambho || hridyam vedantavedyam hridayasarasije diptamudyatprakasham
    satyam shantasvarupam sakalamunimanahpadmashandaikavedyam | jagratsvapne sushuptau trigunavirahitam
    shamkaram na smarami kshantavyo me'paradhah shiva shiva shiva bhoh shrimahadeva shambho || 11 || candrodbhasitashekhare
    smarahare gangadhare shamkare sarpairbhushitakanthakarnavivare netrotthavaishvanare | dantitvakkritasundarambaradhare
    trailokyasare hare mokshartham kuru citta vrittimamalamanyaistu kim karmabhih || 12 || kim yanena
    dhanena vajikaribhih praptena rajyena kim kim va putrakalatramitrapashubhirdehena gehena kim | jnatvaitatkshanabhanguram
    sapadi re tyajyam mano duratah svatmartha guruvakyato bhaja bhaja shriparvativallabham ||13 || paurohityam
    rajanicaritam gramanitvam niyogo mathapatyam hyanritavacanam sakshivadah parannam | brahmadveshah
    khalajanarati praninam nirdayatvam ma bhudevam mama pashupate janmajanmantareshu || 14 || ayurnashyati
    pashyatam pratidinam yati kshayam yauvanam pratyayanti gatah punarna divasah kalo jagadbhakshakah
    | lakshmistoyatarangabhangacapala vidyuccalam jivitam tasmanmam sharanagatam karunaya tvam raksha
    rakshadhuna || 15 || iti shrimatparamahamsaparivrajakacaryasya shrigovindabhagavatpujyapadashishyasya
    shrimacchamkarabhagavatah kritau shivaparadhakshamapanastotram sampurnam ||
  devanagari: शिवपराधक्षमापणस्तोत्रम् शङ्कराचार्यः १९१० शिवपराधक्षमापणस्तोत्रम् शङ्कराचार्यः १९१० ॥ श्रीः॥
    शिवापराध क्षमापणस्तोत्रम्॥ आदौ कर्म प्रसङ्गात्कलयति कलुषं मातृकुक्षौ स्थितं मां विण्मूत्रामेध्यमध्ये
    कथयति नितरां जाठरो जातवेदाः । यद्यद्वै तत्र दु खं व्यथयति नितरां शक्यते केन वक्तुं क्षन्तव्यो मेऽपराधः
    शिव शिव शिव भोः श्रीमहादेव शंभो ॥ बाल्ये दुःखातिरेकान्मललुलितवपुः स्तन्यपाने पिपासु र्नो शक्तश्चेन्द्रियेभ्यो
    भव मलजनिता जन्तवो मां तुदन्ति । नानारोगातिदुःखाद्रुदितपरवशः शंकरं न स्मरामि क्षन्तव्यो मेऽपराधः शिव
    शिव शिव भोः श्रीमहादेव शंभो ॥ प्रौढोऽहं यौवनस्थो विषयविषधरैः पञ्चभिर्मर्मसंधौ दष्टो नष्टो विवेकः सुतधनयुवतिस्वादुसौख्ये
    निषण्णः । शैवे चिन्ताविहीनं मम हृदयमहो मानगर्वाधिरूढं क्षन्तव्यो मेऽपराधः शिव शिव शिव भोः श्रीमहादेव
    शंभो ।। वार्धक्ये चेन्द्रियाणां विकलगतिमतश्चाधिदेवादितापैः प्राप्तै रोगैर्वियोगैर्व्यसनकृशतनोर्ज्ञप्तिहीनं
    च दीनम् । मिथ्यामोहाभिलाषैर्भ्रमति मम मनो धूर्जटेर्ध्यानशून्यं क्षन्तव्यो मेऽपराधः शिव शिव शिव भोः
    श्रीमहादेव शंभो ।। स्नात्वा प्रत्यूषकाले स्नपनविधिविधौ नाहृतं गाङ्गतोयं पूजार्थं वा कदाचिद्बहुतरगहनेऽखण्डबिल्वीदलं
    वा । नानीता पद्ममाला सरसि विकसिता गन्धपुष्पैस्त्वदर्थं क्षन्तव्यो मेऽपराधः शिव शिव शिव भोः श्रीमहादेव
    शंभो ॥ दुग्धैर्मध्वाज्ययुक्तैर्दधिगुडसहितैः स्नापितं नैव लिङ्गं नो लिप्तं चन्दनाद्यैः कनकविरचितैः
    पूजितं न प्रसूनैः । धूपैः कर्पूरदीपैर्विविधरसयुतैर्नैव भक्ष्योपहारैः मन्तव्यो मेऽपराधः शिव शिव शिव
    भोः श्रीमहादेव शंभो ॥ नो शक्यं स्मार्तकर्म प्रतिपदगहने प्रत्यवायाकुलाढ्ये श्रौते वार्ता कथं मे द्विजकुलविहिते
    ब्रह्ममार्गानुसारे । तत्त्वेऽज्ञाते विचारे श्रवणमननयोः किं निदिध्यासितव्यं क्षन्तव्यो मेऽपराधः शिव
    शिव शिव भोः श्रीमहादेव शंभो ।। ध्यात्वा चित्ते शिवाख्यं प्रचुरतरधनं नैव दत्तं द्विजेभ्यो हव्यं ते
    लक्षसंख्यैर्हुतवहवदने नार्पितं बीजमन्त्रैः । नो तप्तं गाङ्गतीरे व्रतजपनियमै रुद्रजाप्यं न जप्तं क्षन्तव्यो
    मेऽपराधः शिव शिव शिव भोः श्रीमहादेव शंभो॥ नग्नो निःसंगशुद्धत्रिगुणविरहितो ध्वस्तमोहान्धकारो नासाग्रन्यस्तदृष्टिर्विदितभवगुणो
    नैव दृष्टः कदाचित् । उन्मन्यावस्थया त्वां विगतगतिमति शंकरं न स्मरामि क्षन्तव्यो मेऽपराधः शिव शिव शिव
    भोः श्रीमहादेव शंभो ॥ स्थित्वा स्थाने सरोजे प्रणवमयमरुत्कुम्भिते सूक्ष्ममार्गे शान्ते स्वान्ते प्रलीने
    प्रकटितविभवे दिव्यरूपे शिवाख्ये । लिङ्गाग्रे ब्रह्मवाक्ये सकलतनुगतं शंकरं न स्मरामि क्षन्तव्यो मेऽपराधः
    शिव शिव शिव भोः श्रीमहादेव शंभो ॥ हृद्यं वेदान्तवेद्यं हृदयसरसिजे दीप्तमुद्यत्प्रकाशं सत्यं शान्तस्वरूपं
    सकलमुनिमनःपद्मषण्डैकवेद्यम् । जाग्रत्स्वप्ने सुषुप्तौ त्रिगुणविरहितं शंकरं न स्मरामि क्षन्तव्यो मेऽपराधः
    शिव शिव शिव भोः श्रीमहादेव शंभो ।। ११ ॥ चन्द्रोद्भासितशेखरे स्मरहरे गङ्गाधरे शंकरे सर्पैर्भूषितकण्ठकर्णविवरे
    नेत्रोत्थवैश्वानरे । दन्तित्वक्कृतसुन्दराम्बरधरे त्रैलोक्यसारे हरे मोक्षार्थं कुरु चित्त वृत्तिममलामन्यैस्तु
    किं कर्मभिः ।। १२ ॥ किं यानेन धनेन वाजिकरिभिः प्राप्तेन राज्येन किं किं वा पुत्रकलत्रमित्रपशुभिर्देहेन
    गेहेन किम् । ज्ञात्वैतत्क्षणभङ्गुरं सपदि रे त्याज्यं मनो दूरतः स्वात्मार्थ गुरुवाक्यतो भज भज श्रीपार्वतीवल्लभम्
    ॥१३ ॥ पौरोहित्यं रजनिचरितं ग्रामणीत्वं नियोगो माठापत्यं ह्यनृतवचनं साक्षिवादः परान्नम् । ब्रह्मद्वेषः
    खलजनरति प्राणिनां निर्दयत्वं मा भूदेवं मम पशुपते जन्मजन्मान्तरेषु ।। १४ ।। आयुर्नश्यति पश्यतां प्रतिदिनं
    याति क्षयं यौवनं प्रत्यायान्ति गताः पुनर्न दिवसाः कालो जगद्भक्षकः । लक्ष्मीस्तोयतरङ्गभङ्गचपला विद्युच्चलं
    जीवितं तस्मान्मां शरणागतं करुणया त्वं रक्ष रक्षाधुना ।। १५ ॥ इति श्रीमत्परमहंसपरिव्राजकाचार्यस्य श्रीगोविन्दभगवत्पूज्यपादशिष्यस्य
    श्रीमच्छंकरभगवतः कृतौ शिवापराधक्षमापणस्तोत्रं संपूर्णम् ॥
