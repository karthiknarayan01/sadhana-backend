id: dattatreya-ashtottara-satanama-stotram
category: stotram
name:
  english: Dattatreya Ashtottara Satanama Stotram
  devanagari: दत्तात्रेयाष्टोत्तरशतनामस्तोत्रम् १ (मन्त्रगर्भ वासुदेवानन्दसरस्वतीविरचितम् ओंकारतत्त्वरूपाय
    दिव्यज्ञानात्मने)
content:
  english: omkaratattvarupaya divyajnanatmane namah | nabhotitamahadhamna aimdryridhya ojase namah ||
    1|| nashtamatsaragamyayagamyacaratmavartmane | mocitamedhyakritaye ṟhimbijashranitashriye || 2|| mohadivibhramantaya
    bahukayadharaya ca | bhattadurvaibhavachetre klimbijavarajapine || 3|| bhavahe- tuvinashaya rajacchonadharaya
    ca | gatiprakampitandaya caruvyahatabahave || 4|| gataga- rvapriyayastu yamadiyatacetase | vashitajatavashyaya
    mundine anasuyave || 5|| vadadva- renyavagjala-visprishtavividhatmane | tapodhanaprasannaye-dapatistutakirtaye
    || 6|| tejomanyantarangaya-dmarasadmavihapane | antarasthanasamsthayayaishvaryashrautagitaye || 7||
    vatadibhayayugbhava-hetave hetubetave | jagadatmatmabhutaya vidvishatshatkaghatine || 8|| surava-rgoddhrite
    bhritya asuravasabhedine | netre ca nayanakshne ciccetanaya mahatmane || 9|| devadhidevadevaya vasudhasurapaline
    | yajinamagraganyaya drambijajapatushtaye || 10|| vasanavanadavaya dhuliyugdehamaline | yatisamnyasigataye
    dattatreyeti samvide || 11|| yajanasyabhujejaya tarakavasagamine | mahajavasprigrupaya-ttakaraya virupine
    || 12|| naraya dhipradipaya yashasviyashase namah | harine cojvalangayatrestanujaya sambhave || 13||
    mocitamarasanghaya dhimatam dhirakaya ca | balishthavipralabhyaya yagahomapriyaya ca || 14|| bhajanmahimavikhyatre'mararimahimacchide
    | labhaya mundipujyaya yamine hemamaline || 15|| gatopadhivyadhaye ca hiranyahitakantaye | yatindracaryam
    dadhate narabhavaushadhaya ca || 16|| varishthayogipujyaya tantusantanvate namah | svatmagathasutirthaya
    mahshriye shat|hkaraya ca || 17|| tejomayottamangaya nodananodyakarmane | hanyaptimritivijnatra omkaritasubhaktaye
    || 18|| rukshun|hmanahkhedahrite darshanavishayatmane | ramkavatatavastraya naratattvaprakashine ||
    19|| dravitapranataghaya-ttahsvajishnuhsvarashaye | rajantryasyaikarupaya mahsthayamasubamdhave ||
    20|| yataye codanatita- pracaraprabhave namah | manaroshavihinaya shishyasamsiddhikarine || 21|| gange
    padavihinaya codanacoditatmane | yaviyase'larkaduhkha-varine'khanditatmane || 22|| hrimbijayarjunajyeshthaya
    darshanadarshitatmane | natisantushtacittaya yatine brahmacarine || 23|| ityesha satstavo vrittoyat
    kam deyatprajapine | maskarisho manusyutah parabrahmapadapradah || 24|| || iti shri| pa| pa| shrivasudevananda
    sarasvati viracitam mantragarbha shri dattatreyashtottarashatanama stotram sampurnam||
  devanagari: ओंकारतत्त्वरूपाय दिव्यज्ञानात्मने नमः । नभोतीतमहाधाम्न ऐंद्र्यृध्या ओजसे नमः ॥ १॥ नष्टमत्सरगम्यायागम्याचारात्मवर्त्मने
    । मोचितामेध्यकृतये ऱ्हींबीजश्राणितश्रिये ॥ २॥ मोहादिविभ्रमान्ताय बहुकायधराय च । भत्तदुर्वैभवछेत्रे
    क्लींबीजवरजापिने ॥ ३॥ भवहे- तुविनाशाय राजच्छोणाधराय च । गतिप्रकम्पिताण्डाय चारुव्यहतबाहवे ॥ ४॥ गतग-
    र्वप्रियायास्तु यमादियतचेतसे । वशिताजातवश्याय मुण्डिने अनसूयवे ॥ ५॥ वदद्व- रेण्यवाग्जाला-विस्पृष्टविविधात्मने
    । तपोधनप्रसन्नाये-डापतिस्तुतकीर्तये ॥ ६॥ तेजोमण्यन्तरङ्गाया-द्मरसद्मविहापने । आन्तरस्थानसंस्थायायैश्वर्यश्रौतगीतये
    ॥ ७॥ वातादिभययुग्भाव-हेतवे हेतुबेतवे । जगदात्मात्मभूताय विद्विषत्षट्कघातिने ॥ ८॥ सुरव-र्गोद्धृते भृत्या
    असुरावासभेदिने । नेत्रे च नयनाक्ष्णे चिच्चेतनाय महात्मने ॥ ९॥ देवाधिदेवदेवाय वसुधासुरपालिने । याजिनामग्रगण्याय
    द्रांबीजजपतुष्टये ॥ १०॥ वासनावनदावाय धूलियुग्देहमालिने । यतिसंन्यासिगतये दत्तात्रेयेति संविदे ॥ ११॥
    यजनास्यभुजेजाय तारकावासगामिने । महाजवास्पृग्रूपाया-त्ताकाराय विरूपिणे ॥ १२॥ नराय धीप्रदीपाय यशस्वियशसे
    नमः । हारिणे चोज्वलाङ्गायात्रेस्तनूजाय सम्भवे ॥ १३॥ मोचितामरसङ्घाय धीमतां धीरकाय च । बलिष्ठविप्रलभ्याय
    यागहोमप्रियाय च ॥ १४॥ भजन्महिमविख़्यात्रेऽमरारिमहिमच्छिदे । लाभाय मुण्डिपूज्याय यमिने हेममालिने ॥ १५॥
    गतोपाधिव्याधये च हिरण्याहितकान्तये । यतीन्द्रचर्यां दधते नरभावौषधाय च ॥ १६॥ वरिष्ठयोगिपूज्याय तन्तुसन्तन्वते
    नमः । स्वात्मगाथासुतीर्थाय मःश्रिये षट्।ह्कराय च ॥ १७॥ तेजोमयोत्तमाङ्गाय नोदनानोद्यकर्मणे । हान्याप्तिमृतिविज्ञात्र
    ओंकारितसुभक्तये ॥ १८॥ रुक्षुङ्।ह्मनःखेदहृते दर्शनाविषयात्मने । रांकवाततवस्त्राय नरतत्त्वप्रकाशिने
    ॥ १९॥ द्रावितप्रणताघाया-त्तःस्वजिष्णुःस्वराशये । राजन्त्र्यास्यैकरूपाय मःस्थायमसुबम्धवे ॥ २०॥ यतये
    चोदनातीत- प्रचारप्रभवे नमः । मानरोषविहीनाय शिष्यसंसिद्धिकारिणे ॥ २१॥ गङ्गे पादविहीनाय चोदनाचोदितात्मने
    । यवीयसेऽलर्कदुःख-वारिणेऽखण्डितात्मने ॥ २२॥ ह्रींबीजायार्जुनज्येष्ठाय दर्शनादर्शितात्मने । नतिसन्तुष्टचित्ताय
    यतिने ब्रह्मचारिणे ॥ २३॥ इत्येष सत्स्तवो वृत्तोयात् कं देयात्प्रजापिने । मस्करीशो मनुस्यूतः परब्रह्मपदप्रदः
    ॥ २४॥ ॥ इति श्री। प। प। श्रीवासुदेवानन्द सरस्वती विरचितं मन्त्रगर्भ श्री दत्तात्रेयाष्टोत्तरशतनाम
    स्तोत्रं सम्पूर्णम्॥
