id: kyts-6-3-chaatvaalaad-dhishniyaanupavapati-krishna-yajurveda-taittiriya-samhita-patha
category: stotram
name:
  english: KYTS 6.3 Chaatvaalaad Dhishniyaanupavapati - Krishna Yajurveda Taittiriya Samhita Patha
content:
  english: krishna yajurvediya taittiriya samhitayam shashthakande tritiyah prashnah somamantrabrahmananirupanam
    o shri gurubhyo namah | harih om || catvala ddhishniyanupa vapati yonirvai yajnasya catvalam ya~jnasya
    sayonitvaya deva vai yajna tpunarapajayannetadvai yajnasya ddhraddhishniyan viharati yadeva yajnasya
    mpunastanute parajityeva khalu va ete yanti ye bahishpavamanagm sarpanti bahishpavamane stuta sstrinahi
    purodashagm ala nkurviti yajnamevapajitya punastanvana yantyangarairdve savane vi harati shalakabhi
    stritiyagm sashukratvayatho sa mbharatyevainaddhishniya va amushmin ~loke somamaraksha nte somapithena
    vya rdhyanta te deveshu somapithamai ndvedve namani kuruddhvamatha pra va ''phsyatha na vetyagnayo
    va atha dhishniyastasma 'pnuvannahavaniya agniddhriyo hotriyo marjaliyastasma tteshu juhvatyatihaya
    vasha ''rdhyanta deva vai yah praci rajuhavurye purastadasura asa stabhih pranudanta yah praticirye
    pashcadasura asa rapanudanta praciranya ahutayo huyante pratyannasino dhishniyan vyagharayati pashcaccaiva
    purasta cca yajamano bhratrivya npra nudate tasma tparacih prajah pra viyante pratici jayante prana
    va ete rjayante prana va ete yaddhishniya yadaddhvaryuh pratya ssyannabhirva esha yajnasya yaddhotordhvah
    khalu vai nabhyai 'vamapano yadadhvaryuh pratyam hotaramatisarpedapane prana ssyannaddhvaryurupa gaye
    ryo va addhvaryu ryadaddhvaryurupa dbrahmavadino vadanti nasaggsthite some 'ddhvaryuh pratyan kshinani
    hotumeti yamo hi sa tesha nkasma aha deva yamam 'nu jnasyantityu mparitya juhoti dakshinani na pranan
    shati nyanye dhishniya upyante nanye ya nnanivapati yadanudishati tena tan || suvargaya va etani lokaya
    huyante ya dvaisarjanani dvabhya hapatye juhoti dvipa dyajamanah pratishthitya agni ddhre juhotyantariksha
    eva ''kramata ahavaniye juhoti suvargamevainam ya~to rakshagsya jighagmsante somena rajna rakshag
    vaisarjanani juhoti vaisarjanani juhoti rakshasamapahatyai tvagm soma tanukridbhya ityaha tanukriddhyasha
    dvesho 'nyakritebhya ityahanyakritani hi rakshagsyuru yanta 'si varuthamityahoru naskridhiti vavaitadaha
    jushano apturajyasya vetvityahaptumeva yajamana a gravnna a vayavya tpatnima nayantyanvanagmsi pra
    vartayanti yavadevasyasti tena saha suvargam lo~kameti nayavatyarca ddhre juhoti suvargasya lokasyabhini
    tyai gravnno vayavyani dronakalashamagni ddhra upa vasayati vi hyena dapuvayeta saumyarca pra padayati
    svayai ndevataya pra padayatyaditya ssada a sidetyaha yathayajurevaita dyajamano va etasya pura gopta
    bhavatyesha vo deva savita ssoma ityaha savitriprasuta evaina ttvagm soma devo devanupaga ityaha devo
    hyesha sa mmanushyo manushyanityaha manushyo nmanushyanupaiti yadeta dyajurna bruyadapraja apashuryajamana
    thsaha prajaya saha rayasposhenetyaha prajayaiva pashubhih sahemam lo~kamupavartate namo devebhya
    ityaha namaskaro hi devanag svadha pitribhya ityaha svadhakaro hi nnirvarunasya pashadityaha varunapashadeva
    nirmucyate 'gne vratapata atmanah purva tanuradeyetyahuh ko hi tadveda ya thsve vashe bhute punarva
    dadati na veti gravano vai somasya rajno malimlusena ya evam ddhra upavasayati naina mmalimlusena
    vindati || vaishnavyarca hutva yupamacchaiti vaishnavo vai devataya yupa ndevataya 'cchaityatyanyanaga
    nupagamityahati hyanyaneti nanya nupaityarvaktva parairavida 'varairityaharvaghyena ndevayajyaya ityaha
    devayajyayai hyena njushate devastva savita maddhva 'naktvityaha tejasaivaina manaktyoshadhe trayasvainagg
    svadhite mainagm higmsirityaha vajro vai svadhiti shshantyai svadhitervrikshasya bibhyatah prathamena
    shakalena saha tejah para patati yah prathama mevainama haratime vai loka yupa tprayato bibhyati divamagrena
    ma lekhirantariksha mmaddhyena ma higmsirityahaibhya evainam lo~kebhyah shamayati vanaspate shataval
    sho vi rohetyavrashcane juhoti tasma mbhuyagmsa uttishthanti sahasraval sha vi vayagm ruhemetyaha
    ''shishamevaitama shaste 'nakshasanga shaste 'nakshasangam ya~jamanasya pramayukagg nkamayetapratishthita
    ntasma vrishcedesha vai vanaspatina 'pratishthita eva bhavati ya vri~shcedesha vai vanaspatina thsyaditi
    bahuparna mpashavyah pashumaneva bhavati pratishthitam tpratishthakamasyaisha vai vanaspatina ssame
    bhumyai svadyone rudhah pratyeva tishthati yah pratyannupanatastam thsa hi medhamabhyupanatah pancaratni
    nkamayetopainamuttaro yajno namediti panca kshara panktih pankto yajna upainamuttaro yajno mpratishthakamasya
    shadva ritava ritushveva prati tishthati saptaratni mpashukamasya saptapada shakvari pashava shshakvari
    pashunevava rundhe navaratni ntejaskamasya trivrita stomena sammita ttejasvyeva bhava syaikadashakshara
    trishtugindriya ntrishtugindriyavyeva bhavati pancadasharatni mbhratrivyavatah pancadasho vajro bhratrivyabhibhutyai
    saptadasharatni mprajakamasya saptadashah prajapatih prajapateraptya ekavigmshatyaratni mpratishtha
    pratishthitya ashtashrirbhava tyashtakshara gayatri tejo gayatri gayatri yajnamukha ntejasaiva gayatriya
    yajnamukhena sammitah || yajna upainamuttaro yajna ekannavigmshatishca 'ntarikshaya tva dive tvetyahaibhya
    evainam lo~kebhyah prokshati para mprokshati paraniva hi suvargo lokah kruramiva va eta 'va nayati
    shantyai yavamatirava nayatyurgvai yavo yajamanena yupa ssammito yavaneva yajamana pitrinagm sadanamasiti
    pitrinagm sadanamasiti barhirava strinati pitridevatya dbarhiranavastirya minuya tpitridevatyo nikhata
    dbarhiravastirya minotyasyamevaina syati satejasamevaina mminoti devastva savita maddhva 'naktvityaha
    tejasaivainamanakti supippalabhya stvaushadhibhya iti cashala ngrihnantyanakti tejo va ajyam ssammita
    yadagnishtha mashrimanakti yajamanameva tejasa 'naktyanta manaktyantameva yajamana ntejasanakti sarvatah
    pari mrishatyaparivarga vi~dhrityai vaishnavyarca kalpayati vaishnavo vai kalpayati vaishnavo vai
    devataya yupa ndevataya kalpayati dvabhya dyajamanah pratishthityai ya ndevatabhirindriyena vyardhayeya
    ndevatabhirindriyena vyardhayati ya ndevatabhirindriyena samardhayeyami ntasyashrimahavaniyena sa
    ndevatabhirindriyena samardhayati brahmavani ntva kshatravanimityaha yathayajurevaita tpari vyayatyurgvai
    rashana yajamanena yupa ssammito yajamanamevorja samardhayati nabhidaghne pari vyayati nabhidaghna
    evasma urja nnabhidaghna urja bhunjate ya vya~rdhayati yadi kamayeta var shukah parjanyah syaditya
    dvrishtimeva ni yacchati yadi kamayetavar ssyadityurdhvamuduhe mmanushyanamurdhva nnikhatada rashanaya
    oshadhinagm rashana vishvesha murdhvagm rashanaya a cashaladindrasya cashalagm saddhyanamatiriktagm
    sa va esha sarvadevatyo yadyupo yadyupa mminoti sarva eva devatah prinati yajnena vai deva 'manyanta
    manushya no 'nvabhavishyantiti te yupena yopayitva suvargam ~lokamaya ntamrishayo yupenaivanu prajana
    mminoti suvargasya lokasya prajna nminoti purastaddhi yajnasya prajnayate prajnatagm hi ta dyadatipanna
    ahurida nkaryamasiditi saddhya vai deva yajnamatyamanyanta tan dyajnasyatiriktamasi ttadasprishadatiriktam
    dyajnasya yadagnavagni mmathitva praharatyatiriktameta praharatyatiriktametat dyupasya yadurdhva ntaneva
    tena prinati deva vai sagg sthite some pra sruco nkurma iti te prastaragg sthite some pra prastaragm
    harati juhoti svarumayajnaveshasaya || saddhya vai deva asmi~lloka asa 'gnimevagnaye medhaya 'labhanta
    na hyanyadalabhyam ntato va imah prajah prajayanta yadagnavagni mmathitva praharati prajana mprajananaya
    rudro va esha yadagniryajamanah pashurya ssyadatho khalvahuragni ssarva devata haviretadya mmanthati
    havyayaiva ''sannaya sarva devata janaya tyupakrityaiva manthya vri~shanau stha ityaha vrishanau rasityaha
    mithunatvaya ghritenakte vrishana ndadhathamityaha vrishanagg hyete dadhate ye agni 'nu pra jayasvetyaha
    chandobhirevaina mpra janayatyagnaye mathyamanayanu bruhityaha savitrimricamanvaha savitriprasuta
    evaina mmanthati jatayanu bruhi 'nu bruhityaha kandekanda evaina nkriyamane samardhayati gayatri ssarva
    anvaha gayatrachanda va agni nchandasa samardhayatyagnih pura bhavatyagni mmathitva pra harati tau
    sabham va~ntau yajamanamabhi sa ssamanasavityaha shantyai prahritya juhoti jatayaivasma annamapi dadhatyajyena
    juhotyetadva agneh priya ndhamna samardhayatyatho tejasa || jatayanu bruhya ishe tveti barhira datta
    icchata iva hyesha yo yajata upavirasityahopa hyenanakarotyupo deva ndaivirvishah pragurityaha daivir
    hyeta vishah satirdevanupayanti vahnirushija ityahartvijo vai vahnaya ushija stasmadevamaha brihaspate
    dharaya vasuni tyaha brahma vai devana mbrihaspati rbrahmanaivasmai pashunava rundhe havya te svadantamityaha
    svadayatyevaina ndeva tvashtarvasu ranvetyaha tvashta vai pashuna mmithunanagm rupakri drupameva pashushu
    dadhati revati ramaddhvamityaha pashavo vai revatih pashunevasmai ramayati devasya tva savituh prasava
    iti rashanama datte prasu mityahashvinau hi devanamaddhvaryu asta bhyamityaha yatya ritasya tva devahavih
    pashena '' rabha ityaha satyam va~ ritagm satyenaivainamritena ''rabhate 'kshnaya pari harati vaddhyagm
    hi pratyanca mprati muncanti vyavrittyai dhar sha manushaniti ni yunakti dhritya adbhya stvaushadhibhyah
    prokshamityahadbhyo hyesha oshadhibhya mperurasityahaisha hyapa thsadevagm havyamapo devi ssvadatainamityaha
    svadayatyevaina tprokshatyuparishtadevaina nkaroti payayatyantarata evaina kshati sarvata evaina agnina
    vai hotra deva asura nnagnaye samiddhyamanayanu bruhityaha bhratrivyabhibhutyai saptadasha samidheniranvaha
    saptadashah prajapatih prajapateraptyai saptadashanvaha dvadasha masah pancartava mpraja anu prajayante
    prajana mprajananaya deva vai samidheniranucya yajna ttato vai deva yajnamanvapashyan magharayati
    yajnasyanukhyatya asureshu vai yajna asi shnigm homenavrinjata ya magharayati bhratrivyasyai va ta
    vri~nkte paridhin shti punatyevaina shti tryavriddhi yajno 'tho rakshasamapahatyai dvadasha sa mpadyante
    dvadasha va~thsarameva prinatyatho sam va~thsaramevasma upa dadhati suvargasya lokasya samashtyai
    shiro va eta dyajnasya yadagharo ssarva devata yadaghara shata eva yajnasya yajamana ssarva devata
    ava rundhe shiro va eta dyajnasya yadaghara atma pashuragharamagharya pashugm samanaktyatmanneva yajnasya
    shirah prati dadhati sa prano vayuna gacchatamityaha vayudevatyo vai prano vayavevasya prana ya~jatrairangani
    sam ya~jnapatirashishetyaha yajnapatimevasya ngamayati vishvarupo vai tvashtra uparishta tpashornava
    dyanti yaduparishta tpashugm samanakti meddhyamevai nkarotyritvijo vrinite chandagsyeva vrinite sapta
    vrinite sapta gramyah pashavah sapta ssapta chandagsyubhayasya varuddhya ekadasha prayajan yajati
    dasha vai pashoh prana atmaikadasho yavaneva pashusta mpra yajati vapamekah pari shaya atmaiva mpari
    shaye vajro vai svadhitirvajro yupashakalo ghrita nkhalu vai deva vajra ntrayethamityaha vajrenaivainam
    padyante dvadasha ''tmanneva yajnasya paryagni karoti sarvahutamevaina ddhutasya skandati trih paryagni
    karoti tryavriddhi yajno 'tho rakshasamapahatyai brahmavadino vadantyanvarabhyah pashu iti mrityave
    va esha niyate ya ya~danvarabheta pramayuko yajamana ssyadatho khalvahu ssuvargaya va esha lokaya
    niyate ya tpashuriti yannanvarabheta suvargalloka dyajamano hiyeta vapashrapanibhya manvarabhate tannevanvarabdha
    nnevananvarabdhamupa preshya hotar havya devebhya ityaheshitagm hi karma kriyate revatiryajnapati
    mpriyadha ''vishatetyaha yathayajurevaitadagnina purastadeti rakshasamapahatyai prithivya ssaprincah
    pahiti barhi dbarhishi skandatyatho bar nkaroti parama vartate tpashubhya eva tanni hnuta atmano vraskaya
    gacchati shriya ve~da pashcalloka va esha pracyudaniyate ya tpatni namasta atanetyaha ''dityasya vai
    rashmaya atanastebhya eva namaskarotyanarva prehityaha bhratrivyo va arva bhratrivyapanuttyai ghritasya
    kulyamanu saha prajaya saha rayasposhene tyaha ''shishamevaitama sha shshuddhayuva ityaha yathayajurevaitat
    || pashorva alabdhasya prananchugricchati vakta a pyayata mpranasta a pyayatamityaha pranebhya evasya
    shucagm shamayati sa pranebhyo bhyamiti ni nayatyahoratrabhyameva prithivyai shucagm shamayatyoshadhe
    trayasvainagg svadhite mainagm higmsirityaha vajro vai svadhiti shvata a cchyati maddhyato hi manushya
    a cchyanti tirashcinama cchyatyanucinagm hi manushya acchyanti vyavrittyai rakshasa 'siti sthavimato
    barhiraktva syatyasnaiva rakshagmsi niravadayata idamahagm raksho ndvishma ityaha dvau vava purushau
    ya ndveshti tavubhavadhama ntamo nayatishe tveti vapamutkhidaticchata iva hyesha yo yajate yadupatrindya
    danyayopatrinattyanyaya na dhrityai ghritena dyavaprithivi prornvathamityaha dyavaprithivi eva rasenanaktyacchinno
    rasenanaktyacchinnah rayah suvira ityaha yathayajurevaita tkruramiva va eta manvihityaha shantyai
    pra va esho 'smallokaccyavate yah pashu mmrityave niyamanamanvarabhate vapashrapani punaranvarabhate
    'sminneva loke prati tishthatyagnina purastadeti rakshasamapahatya atho devata eva havyena nveti nantamamangaramati
    hare dyadantamamangaramati hare ddevata ati manyeta vayo vihi stokanamityaha tasma sstoka ava padyante
    mbarhiragrenaivagragm samardhayatyatho oshadhishveva pashu npratishthapayati svahakritibhyah preshyetyaha
    yajnasya samishtyai pranapanau va etau pashunam tprishadajyamatma vapa prishadajyamabhigharya vapamabhi
    gharayatyatmanneva pashuna mpranapanau dadhati svahordhvanabhasa ngacchatamityahordhvanabha ha sma
    vai maruto devanam va~pashrapani pra harati tenaivaine pra harati vishuci pra harati tasma dvishvancau
    pranapanau || pashumalabhya purodasha nnirvapati samedhamevainama labhate vapaya pracarya purodashena
    pra caratyurgvai purodasha urjameva pashuna mmaddhyato dadhatyatho pashoreva chidramapi dadhati prishadajyasyopahatya
    trih pricchati shritagm havi shshamitariti trishatya hi deva yo 'shritagm shritamaha sa enasa pranapanau
    va etau pashunam mpashoh khalu va alabdhasya hridayamatma tprishadajyena hridaya mabhigharayatyatmanneva
    pashuna mpranapanau dadhati pashuna vai deva 'manyanta manushya no 'nvabhavishyantiti tasya shirah
    chittva medha tprakshasya prakshatvam rbhavati samedhasyaiva vai~ hriyamanagm rakshagsyanu sacante
    nca harati rakshasamapahatyai pashorva alabdhasya mano 'pa kramati manotayai havisho 'vadiyamanasyanu
    bruhityaha mana evasyava rundha ekadashavadananyava dyati dasha vai pashoh prana atmaikadasho yavaneva
    pashustasya 'va dyatyatha jihvaya atha vakshaso yadvai hridayenabhigacchati tajjihvaya vadati yajjihvaya
    vadati taduraso 'dhi nirvadatyetadvai pashoryathapurvam ya~syaivamavadaya yathakama muttareshamavadyati
    yatha purvamevasya pashoravatta mbhavati maddhyato gudasyava dyati maddhyato hi prana uttamasyava
    dya tyuttamo hi prano yaditaram mubhayamevajami jayamano vai bra rinava jayate brahmacaryenar shibhyo
    yajnena devebhyah prajaya pitribhya esha va anrino yah putri yajva brahmacarivasi tadavadanai 'va
    dayate tadavadanana nte deva agnimabruva ntvaya virenasuranabhi bhavameti vri~nai pashoruddharamuddhara
    iti sa etamuddharamudaharata doh pu njaghanardhasya tato deva abhava ttryanganagm samavadyati bhratrivyabhibhutyai
    bhavatyatmana para 'sya bhratrivyo bhavatyakshnaya 'va dyati tasmadakshnaya pashavo 'ngani pra haranti
    pratishthityai || medasa srucau prornoti medorupa vai pashavo rupameva pashushu dadhati yushannavadhaya
    prornoti raso va esha pashunam ya~dyu rasameva pashushu dadhati par mprayauti maddhyam shvagm rasa
    esha pashunam mprayauti maddhyata eva pashunagm rasa jnampayantyaindrah khalu vai devataya prana aindro
    'pana aindrah prano angeange ni de ddhyadityaha pranapanaveva pashushu dadhati deva tvashtarbhuri
    te sagm sametvityaha tvashtra hi devataya pashavo vishurupa ya thsalakshmano bhavathetyaha vishurupa
    hyete santa hi bhavanti devatra yanta 'nu tva mata pitaro madantvityaha mmatra pitra suvargam ngamayatyardharce
    vasahoma njuhotyasau va ardharca iyamardharca ime eva rasenanakti disho juhoti disha eva rasenanaktyatho
    digbhya evorjagm rasamava rundhe pranapanau va etau pashunam vai devataya pashavo ya 'nu bruhi vanaspataye
    preshyeti pranapanaveva pashushu dadhatyanyasya nyasya samavattagm samavadyati tasmannanarupah pashavo
    yushnopa sincati raso va esha pashunam ya~dyu rasameva pashushu dadhatidamupa hvayate pashavo va ida
    pashunevopa hvayate caturupa hvayate catushpado hi pashavo ya ssyadityamedaska ntasma a daddhyanmedorupa
    vai pashavo rupenaivaina mpashubhyo nirbhajatyapashureva bhavati ya thsyaditi medasva ttasma a daddhyanmedorupa
    vai pashavo rupenaivasmai pashunava rundhe pashumaneva bhavati prajapatiryajnamasrijata sa ajya mpurastadasrijata
    pashu mmaddhyatah prishadajya ttasmadajyena prayaja ijyante pashuna maddhyatah prishadajyena stasmadetanmishramiva
    pashca yajati dasha vai pashoh prana atmaikadasho yavaneva pashustamanu yajati ghnanti va eta jnapayanti
    va pranapanau khalu va etau pashunam tprishadajyena nuyajan yajati pranapanaveva pashushu dadhati
    || || harih om || || krishna yajurvediya taittiriya samhitayam shashthakande tritiyah prashna
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय संहितायां षष्ठकाण्डे तृतीयः प्रश्नः सोममन्त्रब्राह्मणनिरूपणं
    ओ श्री गुरुभ्यो नमः । ह॒रिः॒ ओम् ॥ चात्वा॑ला॒ द्धिष्णि॑या॒नुप॑ वपति॒ योनि॒र्वै य॒ज्ञस्य॒ चात्वा॑लं
    यँ॒ज्ञस्य॑ सयोनि॒त्वाय॑ दे॒वा वै य॒ज्ञ त्पुन॒रपा॑जयन्ने॒तद्वै य॒ज्ञस्या द्ध्रा॒द्धिष्णि॑यान् वि॒हर॑ति॒
    यदे॒व य॒ज्ञस्या म्पुन॑स्तनुते परा॒जित्ये॑व॒ खलु॒ वा ए॒ते य॑न्ति॒ ये ब॑हिष्पवमा॒नग्ं सर्प॑न्ति बहिष्पवमा॒ने
    स्तु॒त स्स्तृ॑णाहि पुरो॒डाशा॒ग्ं॒ अल॑ ङ्कु॒र्विति॑ य॒ज्ञमे॒वाप॒जित्य॒ पुन॑स्तन्वा॒ना य॒न्त्यङ्गा॑रै॒र्द्वे
    सव॑ने॒ वि ह॑रति श॒लाका॑भि स्तृ॒तीयग्ं॑ सशुक्र॒त्वायाथो॒ स म्भ॑रत्ये॒वैन॒द्धिष्णि॑या॒ वा अ॒मुष्मि॑न्
    ँलो॒के सोम॑मरक्ष॒ न्ते सो॑मपी॒थेन॒ व्या र्ध्यन्त॒ ते दे॒वेषु॑ सोमपी॒थमै न्द्वेद्वे॒ नाम॑नी कुरुद्ध्व॒मथ॒
    प्र वा॒ ऽऽफ्स्यथ॒ न वेत्य॒ग्नयो॒ वा अथ॒ धिष्णि॑या॒स्तस्मा ऽप्नु॑वन्नाहव॒नीय॑ आग्नी॒द्ध्रीयो॑ हो॒त्रीयो॑
