id: sarvakamapradavidyastotram
category: stotram
name:
  english: sarvakamapradavidyastotram
  devanagari: सर्वकामप्रदाविद्यास्तोत्रम्
content:
  english: 5|| om namo bhagavate mahapurashaya mahabhutapataye sakalasattvabhavivridanikarakamalarenutpalanibhadharmakhyavidyaya
    caranaravindayugala parameshthinnamaste | avapa vidyadharatam citraketoshca vidyaya || 1
  devanagari: ५॥ ॐ नमो भगवते महापुराषाय महाभूतपतये सकलसत्त्वभाविव्रीडनिकरकमलरेणूत्पलनिभधर्माख्यविद्यया
    चरणारविन्दयुगल परमेष्ठिन्नमस्ते । अवाप विद्याधरतां चित्रकेतोश्च विद्यया ॥ १
meaning: {}
