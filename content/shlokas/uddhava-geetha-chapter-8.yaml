id: uddhava-geetha-chapter-8
category: stotram
name:
  english: Uddhava Geetha - Chapter 8
content:
  english: athasshtamo'dhyayah | sukham aindriyakam rajan svarge narakah eva ca | dehinah yat yatha duhkham
    tasmat na iccheta tat budhah || || grasam sumrishtam virasam mahantam stokam eva va | yadricchaya
    eva apatitam graset ajagarah akriyah || || shayita ahani bhurini niraharah anupakramah | yadi na upanamet
    grasah mahahih iva dishtabhuk || || ojah sahobalayutam bibhrat deham akarmakam | shayanah vitanidrah
    ca neheta indriyavan api || || munih prasannagambhirah durvigahyah duratyayah | anantaparah hi akshobhyah
    stimita udah iva arnavah || || samriddhakamah hinah va narayanaparah munih | na utsarpeta na shushyeta
    saridbhih iva sagarah || || drishtva striyam devamayam tat bhavaih ajitendriyah | pralobhitah patati
    andhe tamasi agnau patangavat || || yoshit hiranya abharana ambaradi dravyeshu mayaraciteshu mudhah
    | pralobhitatma hi upabhogabuddhya patangavat nashyati nashtadrishtih || || stokam stokam graset grasam
    dehah varteta yavata | grihan ahimsat na atishthet vrittim madhukarim munih || || anubhyah ca mahadbhyah
    ca shastrebhyah kushalah narah | sarvatah saram adadyat pushpebhyah iva shatpadah || || sayantanam
    shvastanam va na sangrihnita bhikshitam | panipatra udaramatrah makshika iva na sangrahi || || sayantanam
    shvastanam va na sangrihnita bhikshukah | makshikah iva sangrihnan saha tena vinashyati || || pada
    api yuvatim bhikshuh na sprishet daravim api | sprishan kariva badhyeta karinya angasangatah || ||
    na adhigacchet striyam prajnah karhicit mrityum atmanah | bala adhikaih sa hanyeta gajaih anyaih gajah
    yatha || || na deyam na upabhogyam ca lubdhaih yat duhkha sancitam | bhunkte tat api tat ca anyah
    madhuheva arthavit madhu || || sukha duhkha uparjitaih vittaih ashasanam griha ashishah | madhuheva
    agratah bhunkte yatih vai grihamedhinam || || gramyagitam na shrunuyat yatih vanacarah kvacit | shikheta
    harinat vaddhat mrigayoh gitamohitat || || nrityavaditragitani jushan gramyani yoshitam | asam kridanakah
    vashyah rishyasha || jihvaya atipramathinya janah rasavimohitah | mrityum ricchati asat buddhih minah
    tu badishaih yatha || || indriyani jayanti ashuh niraharah manishinah | varjayitva tu rasanam tat
    nirannasya vardhate || || tavat jitendriyah na syat vijitani indriyah puman | na jayet rasanam yavat
    jitam sarvam jite rase || || pingala nama veshya asit videhanagare pura | tasya me shikshitam kincit
    nibodha nripanandana || || sa svairinyekada kantam sanketa upaneshyati | abhutkale bahirdvari bibhrati
    rupamuttamam || || marga agacchato vikshya purushanpurusharshabha | tan shulkadanvittavatah kantanmene'rthakamuka
    || || agateshvapayateshu sa sanketopajivani | apyanyo vittavanko'pi mamupaishyati bhuridah || || eavam
    durashaya dhvastanidra dvaryavalambati | nirgacchanti pravishati nishitham samapadyata || || tasya
    vittashaya shushyadvaktraya dinacetasah | nirvedah paramo jajne cintahetuh sukhavahah || || tasya
    nirvinnacittaya gitam shrunu yatha mama | nirveda ashapashanam purushasya yatha hyasih || || na hi
    angajatanirvedah dehabandham jihasati | yatha vijnanarahitah manujah mamatam nripa || || pingala uvaca
    | aho me mohavitatim pashyata avijita atmanah | ya kantat asatah kamam kamaye yena balisha || || santam
    samipe ramanam ratipradam vittapradam nityam imam vihaya | akamadam duhkhabhaya adi shoka mohapradam
    tuccham aham bhaje ajna || || aho mayatma paritapito vritha sanketyavrittya'tivigarhyavartaya | strainannaradya'rthatrisho'nushocya
    tkritena vittam ratimatmanecchati || || yadasthibhirnirmitavamshavamshya sthunam tvaca romanakhaih
    pinaddham | ksharannavadvaramagarametad vinmutrapurnam madupaiti kanya || || videhanam pure hyasminnahamekaiva
    mudhadhih | ya'nyasmicchantyasatyasmadatmadatkamamacyutat || || suhritpreshthatamo natha atma cayam
    sharirinam | tam vikriyatmanaivaham rame'nena yatha rama || || kiyatpriyam te vyabhajankama ye kamada
    narah | adyantavanto bharyaya deva va kalavidrutah || || nunam me bhagavan pritah vishnuh kena api
    karmana | nirvedah ayam durashaya yat me jatah sukhavahah || || maivam syurmandabhagyayah klesha nirvedahetavah
    | yenanubandham nihritya purushah shamamricchati || || tena upakritam adaya shirasa gramyasangatah
    | tyaktva durashah sharanam vrajami tam adhishvaram || || santushta shraddadhatyetadyathalabhena jivati
    | viharamyamunaivahamatmana ramanena vai || || samsarakupe patitam vishayairmushitekshanam | grastam
    kalahina''tmanam ko'nyastratumadhishvarah || || atma eva hi atmanah gopta nirvidyeta yadakhilat |
    apramattah idam pashyat grastam kalahina jagat || || brahmana uvaca | eavam vyavasitamatirdurasham
    kantatarshajam | chitvopashamamasthaya shayyamupavivesha sa || || asha hi paramam duhkham nairashyam
    paramam sukham | yatha sanchidya kantasham sukham sushvapa pingala || || iti shrimadbhagavate mahapurane
    paramahamsyam samhitayamekadashaskandhe pingalopakhya'neshtamo'dhyayah ||
  devanagari: अथास्श्टमोऽध्यायः । सुखं ऐन्द्रियकं राजन् स्वर्गे नरकः एव च । देहिनः यत् यथा दुःखं तस्मात्
    न इच्छेत तत् बुधाः ॥ ॥ ग्रासं सुमृष्टं विरसं महान्तं स्तोकं एव वा । यदृच्छया एव अपतितं ग्रसेत् आजगरः
    अक्रियः ॥ ॥ शयीत अहानि भूरीणि निराहारः अनुपक्रमः । यदि न उपनमेत् ग्रासः महाहिः इव दिष्टभुक् ॥ ॥ ओजः
    सहोबलयुतं बिभ्रत् देहं अकर्मकम् । शयानः वीतनिद्रः च नेहेत इन्द्रियवान् अपि ॥ ॥ मुनिः प्रसन्नगम्भीरः
    दुर्विगाह्यः दुरत्ययः । अनन्तपारः हि अक्षोभ्यः स्तिमित उदः इव अर्णवः ॥ ॥ समृद्धकामः हीनः वा नारायणपरः
    मुनिः । न उत्सर्पेत न शुष्येत सरिद्भिः इव सागरः ॥ ॥ दृष्ट्वा स्त्रियं देवमायां तत् भावैः अजितेन्द्रियः
    । प्रलोभितः पतति अन्धे तमसि अग्नौ पतङ्गवत् ॥ ॥ योषित् हिरण्य आभरण अम्बरादि द्रव्येषु मायारचितेषु मूढः
    । प्रलोभितात्मा हि उपभोगबुद्ध्या पतङ्गवत् नश्यति नष्टदृष्टिः ॥ ॥ स्तोकं स्तोकं ग्रसेत् ग्रासं देहः
    वर्तेत यावता । गृहान् अहिंसत् न आतिष्ठेत् वृत्तिं माधुकरीं मुनिः ॥ ॥ अणुभ्यः च महद्भ्यः च शास्त्रेभ्यः
    कुशलः नरः । सर्वतः सारं आदद्यात् पुष्पेभ्यः इव षट्पदः ॥ ॥ सायन्तनं श्वस्तनं वा न सङ्गृह्णीत भिक्षितम्
    । पाणिपात्र उदरामत्रः मक्षिका इव न सङ्ग्रही ॥ ॥ सायन्तनं श्वस्तनं वा न सङ्गृह्णीत भिक्षुकः । मक्षिकाः
    इव सङ्गृह्णन् सह तेन विनश्यति ॥ ॥ पद अपि युवतीं भिक्षुः न स्पृशेत् दारवीं अपि । स्पृशन् करीव बध्येत
    करिण्या अङ्गसङ्गतः ॥ ॥ न अधिगच्छेत् स्त्रियं प्राज्ञः कर्हिचित् मृत्युं आत्मनः । बल अधिकैः स हन्येत
    गजैः अन्यैः गजः यथा ॥ ॥ न देयं न उपभोग्यं च लुब्धैः यत् दुःख सञ्चितम् । भुङ्क्ते तत् अपि तत् च अन्यः
    मधुहेव अर्थवित् मधु ॥ ॥ सुख दुःख उपार्जितैः वित्तैः आशासानां गृह आशिषः । मधुहेव अग्रतः भुङ्क्ते यतिः
    वै गृहमेधिनाम् ॥ ॥ ग्राम्यगीतं न श्रुणुयात् यतिः वनचरः क्वचित् । शिखेत हरिणात् वद्धात् मृगयोः गीतमोहितात्
    ॥ ॥ नृत्यवादित्रगीतानि जुषन् ग्राम्याणि योषिताम् । आसां क्रीडनकः वश्यः ऋष्यश ॥ जिह्वया अतिप्रमाथिन्या
    जनः रसविमोहितः । मृत्युं ऋच्छति असत् बुद्धिः मीनः तु बडिशैः यथा ॥ ॥ इन्द्रियाणि जयन्ति आशुः निराहाराः
    मनीषिणः । वर्जयित्वा तु रसनं तत् निरन्नस्य वर्धते ॥ ॥ तावत् जितेन्द्रियः न स्यात् विजितानि इन्द्रियः
    पुमान् । न जयेत् रसनं यावत् जितं सर्वं जिते रसे ॥ ॥ पिङ्गला नाम वेश्या आसीत् विदेहनगरे पुरा । तस्या
    मे शिक्षितं किञ्चित् निबोध नृपनन्दन ॥ ॥ सा स्वैरिण्येकदा कान्तं सङ्केत उपनेष्यती । अभूत्काले बहिर्द्वारि
    बिभ्रती रूपमुत्तमम् ॥ ॥ मार्ग आगच्छतो वीक्ष्य पुरुषान्पुरुषर्षभ । तान् शुल्कदान्वित्तवतः कान्तान्मेनेऽर्थकामुका
    ॥ ॥ आगतेष्वपयातेषु सा सङ्केतोपजीवनी । अप्यन्यो वित्तवान्कोऽपि मामुपैष्यति भूरिदः ॥ ॥ एअवं दुराशया
    ध्वस्तनिद्रा द्वार्यवलम्बती । निर्गच्छन्ती प्रविशती निशीथं समपद्यत ॥ ॥ तस्या वित्ताशया शुष्यद्वक्त्राया
    दीनचेतसः । निर्वेदः परमो जज्ञे चिन्ताहेतुः सुखावहः ॥ ॥ तस्या निर्विण्णचित्ताया गीतं श्रुणु यथा मम
    । निर्वेद आशापाशानां पुरुषस्य यथा ह्यसिः ॥ ॥ न हि अङ्गाजातनिर्वेदः देहबन्धं जिहासति । यथा विज्ञानरहितः
    मनुजः ममतां नृप ॥ ॥ पिङ्गला उवाच । अहो मे मोहविततिं पश्यत अविजित आत्मनः । या कान्तात् असतः कामं कामये
    येन बालिशा ॥ ॥ सन्तं समीपे रमणं रतिप्रदं वित्तप्रदं नित्यं इमं विहाय । अकामदं दुःखभय आदि शोक मोहप्रदं
    तुच्छं अहं भजे अज्ञा ॥ ॥ अहो मयात्मा परितापितो वृथा साङ्केत्यवृत्त्याऽतिविगर्ह्यवार्तया । स्त्रैणान्नराद्याऽर्थतृषोऽनुशोच्या
    त्क्रीतेन वित्तं रतिमात्मनेच्छती ॥ ॥ यदस्थिभिर्निर्मितवंशवंश्य स्थूणं त्वचा रोमनखैः पिनद्धम् । क्षरन्नवद्वारमगारमेतद्
    विण्मूत्रपूर्णं मदुपैति कान्या ॥ ॥ विदेहानां पुरे ह्यस्मिन्नहमेकैव मूढधीः । याऽन्यस्मिच्छन्त्यसत्यस्मादात्मदात्काममच्युतात्
    ॥ ॥ सुहृत्प्रेष्ठतमो नाथ आत्मा चायं शरीरिणाम् । तं विक्रीयात्मनैवाहं रमेऽनेन यथा रमा ॥ ॥ कियत्प्रियं
    ते व्यभजन्कामा ये कामदा नराः । आद्यन्तवन्तो भार्याया देवा वा कालविद्रुताः ॥ ॥ नूनं मे भगवान् प्रीतः
    विष्णुः केन अपि कर्मणा । निर्वेदः अयं दुराशाया यत् मे जातः सुखावहः ॥ ॥ मैवं स्युर्मन्दभग्यायाः क्लेशा
    निर्वेदहेतवः । येनानुबन्धं निहृत्य पुरुषः शममृच्छति ॥ ॥ तेन उपकृतं आदाय शिरसा ग्राम्यसङ्गताः । त्यक्त्वा
    दुराशाः शरणं व्रजामि तं अधीश्वरम् ॥ ॥ सन्तुष्टा श्रद्दधत्येतद्यथालाभेन जीवती । विहराम्यमुनैवाहमात्मना
    रमणेन वै ॥ ॥ संसारकूपे पतितं विषयैर्मुषितेक्षणम् । ग्रस्तं कालाहिनाऽऽत्मानं कोऽन्यस्त्रातुमधीश्वरः
    ॥ ॥ आत्मा एव हि आत्मनः गोप्ता निर्विद्येत यदाखिलात् । अप्रमत्तः इदं पश्यत् ग्रस्तं कालाहिना जगत् ॥
    ॥ ब्राह्मण उवाच । एअवं व्यवसितमतिर्दुराशां कान्ततर्षजाम् । छित्वोपशममास्थाय शय्यामुपविवेश सा ॥ ॥ आशा
    हि परमं दुःखं नैराश्यं परमं सुखम् । यथा सञ्छिद्य कान्ताशां सुखं सुष्वाप पिङ्गला ॥ ॥ इति श्रीमद्भागवते
    महापुराणे पारमहंस्यां संहितायामेकादशस्कन्धे पिङ्गलोपाख्याऽनेष्टमोऽध्यायः ॥
