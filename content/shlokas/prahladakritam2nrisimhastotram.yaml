id: prahladakritam2nrisimhastotram
category: stotram
name:
  english: prahladakritam2nrisimhastotram
  devanagari: प्रह्लादकृतं२नृसिंहस्तोत्रम्
content:
  english: shokagnina sakalayonishu dahyamanah | duhkhaushadham tadapi duhkhamataddhiyaham bhuman bhramami
    vada me tava dasyayogam || 17|| so'ham priyasya suhridah paradevataya lilakathastava nrisimha virincagitah
    | anjastitarmyanugrinan gunavipramukto durgani te padayugalayahamsasangah || 18|| balasya neha sharanam
    pitarau nrisimha nartasya cagadamudanvati majjato nauh | taptasya tatpratividhirya ihanjaseshtastavadvibho
    tanubhritam tvadupekshitanam || 19|| yasmin yato yarhi yena ca yasya yasmadyasmai yatha yaduta yastvaparah
    paro va | bhavah karoti vikaroti prithaksvabhavah sancoditastadakhilam bhavatah svarupam || 20|| maya
    manah srijati karmamayam baliyah kalena coditagunanumatena pumsah | chandomayam yadajayarpitashodasharam
    samsaracakramaja ko'titarettvadanyah || 21|| sa tvam hi nityavijitatmagunah svadhamna kalo vashikritavisrijyavisargashaktih
    | cakre visrishtamajayeshvara shodashare nishpidyamanamupakarsha vibho prapannam || 22|| drishta maya
    divi vibho'khiladhishnyapanamayuh shriyo vibhava icchati yan jano'yam | ye'smatpituh kupitahasavijrimbhitabhru
  devanagari: शोकाग्निना सकलयोनिषु दह्यमानः । दुःखौषधं तदपि दुःखमतद्धियाहं भूमन् भ्रमामि वद मे तव दास्ययोगम्
    ॥ १७॥ सोऽहं प्रियस्य सुहृदः परदेवताया लीलाकथास्तव नृसिंह विरिञ्चगीताः । अञ्जस्तितर्म्यनुगृणन् गुणविप्रमुक्तो
    दुर्गाणि ते पदयुगालयहंससङ्गः ॥ १८॥ बालस्य नेह शरणं पितरौ नृसिंह नार्तस्य चागदमुदन्वति मज्जतो नौः ।
    तप्तस्य तत्प्रतिविधिर्य इहाञ्जसेष्टस्तावद्विभो तनुभृतां त्वदुपेक्षितानाम् ॥ १९॥ यस्मिन् यतो यर्हि
    येन च यस्य यस्माद्यस्मै यथा यदुत यस्त्वपरः परो वा । भावः करोति विकरोति पृथक्स्वभावः सञ्चोदितस्तदखिलं
    भवतः स्वरूपम् ॥ २०॥ माया मनः सृजति कर्ममयं बलीयः कालेन चोदितगुणानुमतेन पुंसः । छन्दोमयं यदजयार्पितषोडशारं
    संसारचक्रमज कोऽतितरेत्त्वदन्यः ॥ २१॥ स त्वं हि नित्यविजितात्मगुणः स्वधाम्ना कालो वशीकृतविसृज्यविसर्गशक्तिः
    । चक्रे विसृष्टमजयेश्वर षोडशारे निष्पीड्यमानमुपकर्ष विभो प्रपन्नम् ॥ २२॥ दृष्टा मया दिवि विभोऽखिलधिष्ण्यपानामायुः
    श्रियो विभव इच्छति यान् जनोऽयम् । येऽस्मत्पितुः कुपितहासविजृम्भितभ्रू
