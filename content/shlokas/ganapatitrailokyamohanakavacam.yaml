id: ganapatitrailokyamohanakavacam
category: kavacha
name:
  english: ganapatitrailokyamohanakavacam
  devanagari: गणपतित्रैलोक्यमोहनकवचम्
content:
  english: hastindrananaminducudamarunacchayam trinetram rasa dashlishtam priyaya sapadmakaraya svankasthaya
    santatam | bijapuragadadhanustrishikhayuk cakrabjapashotpala vrihyagrasvavishanaratnakalashan hastairvahantam
    bhaje | atha kavacam | om brahmabijam shirah patu kevalam muktidayakam | shri~ bijamakshini patu sarvasiddhisamarpakam
    || 1|| hrillekha shrotrayoh patu sarvashatruvinashini | kamabijam kapolau ca sarvadushtanivaranam
    || 2|| glau~ ga~ ca ganapataye vacam patu vinayakah | varabijam tatha jihvam varadam hastayostatha
    || 3|| sarvajanam me ca bahudvayam kantham ganeshvarah | vasham me patu hridayam patu siddhishvarastatha
    || 4|| nabhimanaya me patu sarvasiddhivinayakah | janghayorgulphayoh svaha sarvangam vighnanayakah
    || 5|| ganapatistvagratah patu ganeshah prishthatastatha | dakshine siddhidah patu vame vishvartiharakah
    || 6|| durjayo rakshatu pracyamagneyyam ganapastatha | dakshinasyam girijajo nairrityam shambhunandanah
    || 7|| praticyam sthanujah patu vayavyamakhuvahanah | kauberyamishvarah patu ishanyamishvaratmajah
    || 8|| adho ganapatih patu urdham patu vinayakah | etabhyo dashadigbhyastu patu nityam ganeshvarah
    || 9|| idam kavacamahamyam na deyam yasyakasyacit | yasya smaranamatrena mrityormrityubhavetsvayam
    || 10|| itidam kathitam devi brahmavidyakalevaram | trailokyamohanam nama kavacam brahmarupakam ||
    11|| saptakotimahamantrastatradau kathitah priye | mahaganapateryaddivyam kavacam manmukhoditam ||
    12|| gurumabhyarcya vidhivatkavacam yah pathedyatah | trih sakridva yathanyasam so'pi punyayuto narah
    || 13|| deshikah sarvamantreshu hyadhikari japadishu | devamabhyarcya vidhivatpurashcaryam samacareta
    || 14|| ashtottarashatam japtva dashamsham havanadikama | tatastu siddhakavacah purnatamadanopamah
    || 15|| mantrasiddhirbhavettasya purashcaryavidhanatah | gadyapadyamayi vani tasya vaktratprajapate
    || 16|| vaktre tasya vasedvani kamala nishcala grihe | pushpanjalyashtakam datva mule naiva pathetsakrit
    || 17|| api varshasahasrayah pujayah phalamapnuyat | vilikhya bhurjapatre tu svarnastha dharayedyadi
    || 18|| kanthe va dakshine bahau sakuryaddasavat jagat | trailokyam kshobhavatyeva trailokyavijayi
    bhavet || 19|| tadgatram prapya shastrani brahmastradini yati ca | manyani kusumaniva sukhadani bhavanti
    hi || 20|| spardhannirdhuya bhavane lakshmirvani mukhe vaset || 21|| idam kavacamajnatva yo japedgananayakam
    | na sa siddhimavapnoti mudho varshashatairapi || 22|| sarvashatrukshayakaram sarvavighnanivaranam
    | sarvapattyekashamanam sarvamokshasya hetukam || 23|| iti shrirudrayamale ganapateh trailokyamohanakavacam
    sampurnam |
  devanagari: हस्तीन्द्राननमिन्दुचूडमरुणच्छायं त्रिनेत्रं रसा दाश्लिष्टं प्रियया सपद्मकरया स्वाङ्कस्थया
    सन्ततम् । बीजापूरगदाधनुस्त्रिशिखयुक् चक्राब्जपाशोत्पल व्रीह्यग्रस्वविषाणरत्नकलशान् हस्तैर्वहन्तं भजे
    । अथ कवचम् । ॐ ब्रह्मबीजं शिरः पातु केवलं मुक्तिदायकम् । श्रीँ बीजमक्षिणी पातु सर्वसिद्धिसमर्पकम्
    ॥ १॥ हृल्लेखा श्रोत्रयोः पातु सर्वशत्रुविनाशिनी । कामबीजं कपोलौ च सर्वदुष्टनिवारणम् ॥ २॥ ग्लौँ गँ
    च गणपतये वाचं पातु विनायकः । वरबीजं तथा जिह्वां वरदं हस्तयोस्तथा ॥ ३॥ सर्वजनं मे च बाहुद्वयं कण्ठं
    गणेश्वरः । वशं मे पातु हृदयं पातु सिद्धीश्वरस्तथा ॥ ४॥ नाभिमानय मे पातु सर्वसिद्धिविनायकः । जङ्घयोर्गुल्फयोः
    स्वाहा सर्वाङ्गं विघ्ननायकः ॥ ५॥ गणपतिस्त्वग्रतः पातु गणेशः पृष्ठतस्तथा । दक्षिणे सिद्धिदः पातु वामे
    विश्वार्तिहारकः ॥ ६॥ दुर्जयो रक्षतु प्राच्यामाग्नेय्यां गणपस्तथा । दक्षिणस्यां गिरिजजो नैरृत्यां शम्भुनन्दनः
    ॥ ७॥ प्रतीच्यां स्थाणुजः पातु वायव्यामाखुवाहनः । कौबेर्यामीश्वरः पातु ईशान्यामीश्वरात्मजः ॥ ८॥ अधो
    गणपतिः पातु ऊर्धं पातु विनायकः । एताभ्यो दशदिग्भ्यस्तु पातु नित्यं गणेश्वरः ॥ ९॥ इदं कवचमाहाम्यं न
    देयं यस्यकस्यचित् । यस्य स्मरणमात्रेण मृत्योर्मृत्युभवेत्स्वयम् ॥ १०॥ इतीदं कथितं देवि ब्रह्मविद्याकलेवरम्
    । त्रैलोक्यमोहनं नाम कवचं ब्रह्मरूपकम् ॥ ११॥ सप्तकोटिमहामन्त्रास्तत्रादौ कथिताः प्रिये । महागणपतेर्यद्दिव्यं
    कवचं मन्मुखोदितम् ॥ १२॥ गुरुमभ्यर्च्य विधिवत्कवचं यः पठेद्यतः । त्रिः सकृद्वा यथान्यासं सोऽपि पुण्ययुतो
    नरः ॥ १३॥ देशिकः सर्वमन्त्रेषु ह्याधिकारी जपादिषु । देवमभ्यर्च्य विधिवत्पुरश्चर्यां समाचरेत ॥ १४॥
    अष्टोत्तरशतं जप्त्वा दशांशं हवनादिकम । ततस्तु सिद्धकवचः पूर्णतामदनोपमः ॥ १५॥ मन्त्रसिद्धिर्भवेत्तस्य
    पुरश्चर्याविधानतः । गद्यपद्यमयी वाणी तस्य वक्त्रात्प्रजापते ॥ १६॥ वक्त्रे तस्य वसेद्वाणी कमला निश्चला
    गृहे । पुष्पाञ्जल्यष्टकं दत्वा मूले नैव पठेत्सकृत् ॥ १७॥ अपि वर्षसहस्रायाः पूजायाः फलमाप्नुयात् ।
    विलिख्य भूर्जपत्रे तु स्वर्णस्थ धारयेद्यदि ॥ १८॥ कण्ठे वा दक्षिणे बाहौ सकुर्याद्दासवत् जगत् । त्रैलोक्यं
    क्षोभवत्येव त्रैलोक्यविजयी भवेत् ॥ १९॥ तद्गात्रं प्राप्य शस्त्राणि ब्रह्मास्त्रादीनि याति च । मान्यानि
    कुसुमानीव सुखदानि भवन्ति हि ॥ २०॥ स्पर्धान्निर्धूय भवने लक्ष्मीर्वाणी मुखे वसेत् ॥ २१॥ इदं कवचमज्ञात्वा
    यो जपेद्गणनायकम् । न स सिद्धिमवाप्नोति मूढो वर्षशतैरपि ॥ २२॥ सर्वशत्रुक्षयकरं सर्वविघ्ननिवारणम् ।
    सर्वापत्त्येकशमनं सर्वमोक्षस्य हेतुकम् ॥ २३॥ इति श्रीरुद्रयामले गणपतेः त्रैलोक्यमोहनकवचं सम्पूर्णम्
    ।
