id: krishnacaturvimshatistotram
category: stotram
name:
  english: krishnacaturvimshatistotram
  devanagari: कृष्णचतुर्विंशतिस्तोत्रम्
content:
  english: kavim puranapurusham krishnam vande jagadgurum || 7|| vamanam shrimadakaram kamitarthaphalapradam
    | ramanujam samalolam krishnam vande jagadgurum || 8|| shridharam shridharanutam radheyadyairnutam
    harim | radhavidambanasaktam krishnam vande jagadgurum || 9|| hrishikesham vishavasam bhishajam bhavaroginam
    | tusharadrisutavandyam krishnam vande jagadgurum || 10|| padmanabham padmanetram padmahritpadma bambharam
    | adhmatamuralilolam krishnam vande jagadgurum || 11|| damodaram shyamalangam somasuryavilocanam |
    camikarambaradharam krishnam vande jagadgurum || 12|| sankarshanam venkatesham onkarakaramavyayam
    | shankhacakragadapanim krishnam vande jagadgurum || 13|| vasudevam vyasanutam bhasurabharanojjvalam
    | dasaposhanasamsaktam krishnam vande jagadgurum || 14|| pradyumnamamnayamayam khadyotanamayarcitam
    | vaidyanatham prapancasyam krishnam vande jagadgurum || 15|| aniruddham dhruvanutam shuddhasankalpamavyayam
    | shuddhabrahmanandarupam krishnam vande jagadgurum || 16|| narottamam puranesham muradanavavairinam
    | karunavarunavasam krishnam vande jagadgurum || 17|| adhokshajam sudhalapam buvamanasavasinam | adhikanugraham
    raksham krishnam vande jagadgurum || 18|| narasimha darunasyam kshirambudhiniketanam | viragresaramanandam
    krishnam vande jagadgurum || 19|| acyutam kacchapakaramujjvalam kundalojjvalam | saccidanandaviryadhyam
    krishnam vande jagadgurum || 20||
  devanagari: कविं पुराणपुरुषं कृष्णं वन्दे जगद्गुरुम् ॥ ७॥ वामनं श्रीमदाकारं कामितार्थफलप्रदम् । रामानुजं
    सामलोलं कृष्णं वन्दे जगद्गुरुम् ॥ ८॥ श्रीधरं श्रीधरानुतं राधेयाद्यैर्नुतं हरिम् । राधाविडम्बनासक्तं
    कृष्णं वन्दे जगद्गुरुम् ॥ ९॥ हृषीकेशं विषावासं भिषजं भवरोगिणाम् । तुषाराद्रिसुतावन्द्यं कृष्णं वन्दे
    जगद्गुरुम् ॥ १०॥ पद्मनाभं पद्मनेत्रं पद्माहृत्पद्म बम्भरम् । आध्मातमुरलीलोलं कृष्णं वन्दे जगद्गुरुम्
    ॥ ११॥ दामोदरं श्यामलाङ्गं सोमसूर्यविलोचनम् । चामीकराम्बरधरं कृष्णं वन्दे जगद्गुरुम् ॥ १२॥ सङ्कर्षणं
    वेङ्कटेशं ओङ्काराकारमव्ययम् । शङ्खचक्रगदापाणिं कृष्णं वन्दे जगद्गुरुम् ॥ १३॥ वासुदेवं व्यासनुतं भासुराभरणोज्ज्वलम्
    । दासपोषणसंसक्तं कृष्णं वन्दे जगद्गुरुम् ॥ १४॥ प्रद्युम्नमाम्नायमयं खद्योतनमयार्चितम् । वैद्यनाथं
    प्रपञ्चास्यं कृष्णं वन्दे जगद्गुरुम् ॥ १५॥ अनिरुद्धं ध्रुवनुतं शुद्धसङ्कल्पमव्ययम् । शुद्धब्रह्मानन्दरूपं
    कृष्णं वन्दे जगद्गुरुम् ॥ १६॥ नरोत्तमं पुराणेशं मुरदानववैरिणम् । करुणावरुणावासं कृष्णं वन्दे जगद्गुरुम्
    ॥ १७॥ अधोक्षजं सुधालापं बुवमानसवासिनम् । अधिकानुग्रहं रक्षं कृष्णं वन्दे जगद्गुरुम् ॥ १८॥ नारसिंह
    दारुणास्यं क्षीराम्बुधिनिकेतनम् । वीराग्रेसरमानन्दं कृष्णं वन्दे जगद्गुरुम् ॥ १९॥ अच्युतं कच्छपाकारमुज्ज्वलं
    कुण्डलोज्ज्वलम् । सच्चिदानन्दवीर्याढ्यं कृष्णं वन्दे जगद्गुरुम् ॥ २०॥
