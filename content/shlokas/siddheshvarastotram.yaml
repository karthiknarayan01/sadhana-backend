id: siddheshvarastotram
category: stotram
name:
  english: siddheshvarastotram
  devanagari: सिद्धेश्वरस्तोत्रम्
content:
  english: tvadiyavayam lingam staumi surasuroraga ganalingena santaritah | lingayastumaya viracitam lingatparam
    no bhaje lingasyanucaro'smi bhaktiracala linge parabrahmani || 2|| pagadadinni brihanmatha palako
    basavarajasunamaka panditah | varashivagamabodhavisharado vividhashastravicakshana dhiradhih || 3||
    iti shrisiddheshvarastotram sampurnam |
  devanagari: त्वदीयावयम् लिङ्गं स्तौमि सुरासुरोरग गणालिङ्गेन सन्तारिताः । लिङ्गायास्तुमया विरचितं लिङ्गात्परं
    नो भजे लिङ्गस्यानुचरोऽस्मि भक्तिरचला लिङ्गे परब्रह्मणि ॥ २॥ पगडदिन्नि बृहन्मठ पालको बसवराजसुनामक पण्डितः
    । वरशिवागमबोधविशारदो विविधशास्त्रविचक्षण धीरधीः ॥ ३॥ इति श्रीसिद्धेश्वरस्तोत्रं सम्पूर्णम् ।
meaning: {}
