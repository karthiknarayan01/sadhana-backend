id: brahmakritam04vishnustotram
category: stotram
name:
  english: brahmakritam04vishnustotram
  devanagari: ब्रह्मकृतं०४विष्णुस्तोत्रम्
content:
  english: brahmakritam 4 vishnustotram brahmovaca | krishna krishna mahabaho kripalo parameshvara | srashta
    tvam caiva harta tvam tvameva jagatah pita || 53|| namaste vishnave saumya namaste garudadhvaja |
    namaste kamalakanta namaste brahmarupine || 54|| namaste matsyarupaya vishvarupaya vai namah | namaste
    daityanashaya bhaktanamabhayaya ca || 55|| kamsaghnaya namaste'stu baladaityajite namah || iti skandapurane
    brahmakhande dharmaranyakhande ashtamadhyayantargatam brahmakritam vishnustotram samaptam | skandapurana
    | brahmakhanda | dharmaranyakhanda | adhyaya 8
  devanagari: ब्रह्मकृतं ४ विष्णुस्तोत्रम् ब्रह्मोवाच । कृष्ण कृष्ण महाबाहो कृपालो परमेश्वर । स्रष्टा
    त्वं चैव हर्ता त्वं त्वमेव जगतः पिता ॥ ५३॥ नमस्ते विष्णवे सौम्य नमस्ते गरुडध्वज । नमस्ते कमलाकान्त
    नमस्ते ब्रह्मरूपिणे ॥ ५४॥ नमस्ते मत्स्यरूपाय विश्वरूपाय वै नमः । नमस्ते दैत्यनाशाय भक्तानामभयाय च
    ॥ ५५॥ कंसघ्नाय नमस्तेऽस्तु बलदैत्यजिते नमः ॥ इति स्कन्दपुराणे ब्रह्मखण्डे धर्मारण्यखण्डे अष्टमाध्यायान्तर्गतं
    ब्रह्मकृतं विष्णुस्तोत्रं समाप्तम् । स्कन्दपुराण । ब्राह्मखण्ड । धर्मारण्यखण्ड । अध्याय ८
meaning: {}
