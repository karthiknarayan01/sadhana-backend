    । प्रोक्ष॑णी॒रासा॑दयति । आपो॒ वै र॑क्षो॒घ्नीः ॥ ॥ रक्ष॑सा॒मप॑हत्यै । स्फ्यस्य॒ वर्त्मन् थ्सादयति ।
    य॒ज्ञस्य॒ सन्त॑त्यै । उ॒वाच॒ हासि॑तो दैव॒लः । ए॒ताव॑ती॒र्वा अ॒मुष्मि॑न् ँलो॒क आप॑ आसन्न् । याव॑तीः॒
    प्रोक्ष॑णी॒रिति॑ । तस्मा । स्फ्यमु॒दस्यन्न्॑ । य न्ध्या॑येत् । शु॒चैवैन॑ स्सादनम् वज्रो॒ वै स्फ्यः
    । यद॒न्वञ्च॑ क्ष॑ण्वीत । पु॒रस्ता न्धारयति । वज्रो॒ वै स्फ्यः । वज्रे॑णै॒व य॒ज्ञस्य॑ दक्षिण॒तो रक्षा॒ग्॒स्यप॑हन्ति
    । अ॒ग्निभ्या॒ म्प्राच॑श्च प्र॒तीच॑श्च । स्फ्येनोदी॑चश्चा ध॒राच॑श्च । स्फ्येन॒ वा ए॒ष वज्रे॑णा॒स्यै
    पा॒प्मान॒ ॥ यथो॑प॒धाय॑ वृ॒श्चन्त्य॒वम् । हस्ता॒वव॑ नेनिक्ते । आ॒त्मान॑मे॒व प॑वयते । स्फ्य म्प्रक्षा॑लयति
    मेद्ध्य॒त्वाय॑ । अथो॑ पा॒प्मन॑ ए॒व भ्रातृ॑व्यस्य न्य॒ङ्ग ञ्छि॑नत्ति ॥ इ॒द्ध्मा रुप॑सादयति॒ युक्त्यै
    । य॒ज्ञस्य॑ मिथुन॒त्वाय॑ । अथो॑ पुरो॒रुच॑मे॒वैता न्द॑धाति । उत्त॑रस्य॒ कर्म॒णो ऽनु॑ख्यात्यै । न पु॒रस्ता
    त्प्र॒त्यगुप॑सादयेत् ॥ त् । अ॒न्यत्रा॑हुतिप॒थादि॒द्ध्म म्प्रति॑पादयेत् । प्र॒जा वै ब॒र्॒हिः । अप॑राद्ध्नुया
    म्प्र॒जन॑नम् । प॒श्चात् प्रागुप॑सादयति । आ॒हु॒ति॒प॒थेने॒द्ध्म म्प्रति॑पादयति । स॒प्र॒न्त्ये॑व ब॒र्॒हिषा
    म्प्र॒जन॑न॒मुपै॑ति । दक्षि॑णमि॒द्ध्मम् । उत्त॑र म्ब॒र॒ःइः । आ॒त्मा वा इ॒द्ध्मः । प्र॒जा ब॒र्॒हिः ।
    प्र॒जा ह्या त्मन॒ उत्त॑रतरा ती॒र्थे । ततो॒ मेध॑मुप॒नीय॑ । य॒था॒ दे॒व॒तमे॒वैन॒त् प्रति॑ष्ठापयति । प्रति॑तिष्ठति
    प्र॒जया॑ प॒शुभि॒ मिन्द्रो॑ वृ॒त्रम॑ह॒न् र् दे॒वस्येत्या॑ह॒ सं दे॒वस्य॒ स्फ्यमाद॑दे॒ वज्रो॒ वै स्फ्यो
    दश॑ यद॒दश्च॒न्द्रम॑सि॒ मेद्ध्य॒ ॥ हरिः॑ ओम् ॥ ॥ कृष्ण यजुर्वेदीय तैत्तिरीय ब्राह्मणे तृतीयाष्टके द्वितीयः
    प्रपाठक
