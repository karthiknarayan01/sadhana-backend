id: brahmakritamkapilastotram
category: stotram
name:
  english: brahmakritamkapilastotram
  devanagari: ब्रह्मकृतंकपिलास्तोत्रम्
content:
  english: brahmakritam kapilastotram namaste kapile punye sarvalokanamaskrite | mangalye mangale devi
    trishu lokeshvanupame || 10|| tvam lakshmistvam smritirmedha tvam dhritistvam varanane | umadeviti
    vikhyata tvam sati natra samshayah || 11|| vaishnavi tvam mahadevi brahmani tvam varanane | kumari
    tvam mahabhage bhaktih shraddha tathaiva ca || 12|| kalaratristu bhutanam kumari parameshvari | tvam
    lavastvam trutishcaiva muhurtam lakshameva ca || 13|| samvatsarastvam masastvam kalastvam ca kshanastatha
    | nasti kincittvaya hinam trailokye sacaracare || 14|| iti shriskandapurane avantyakhande revakhande
    ekonacatvarimsha
  devanagari: ब्रह्मकृतं कपिलास्तोत्रम् नमस्ते कपिले पुण्ये सर्वलोकनमस्कृते । मङ्गल्ये मङ्गले देवि त्रिषु
    लोकेष्वनूपमे ॥ १०॥ त्वं लक्ष्मीस्त्वं स्मृतिर्मेधा त्वं धृतिस्त्वं वरानने । उमादेवीति विख्याता त्वं
    सती नात्र संशयः ॥ ११॥ वैष्णवी त्वं महादेवी ब्रह्माणी त्वं वरानने । कुमारी त्वं महाभागे भक्तिः श्रद्धा
    तथैव च ॥ १२॥ कालरात्रिस्तु भूतानां कुमारी परमेश्वरी । त्वं लवस्त्वं त्रुटिश्चैव मुहूर्तं लक्षमेव च
    ॥ १३॥ संवत्सरस्त्वं मासस्त्वं कालस्त्वं च क्षणस्तथा । नास्ति किञ्चित्त्वया हीनं त्रैलोक्ये सचराचरे
    ॥ १४॥ इति श्रीस्कन्दपुराणे आवन्त्यखण्डे रेवाखण्डे एकोनचत्वारिंशा
meaning: {}
