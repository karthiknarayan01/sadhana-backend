id: raghavendra-ashtottara-sata-namavali
category: stotram
name:
  english: Raghavendra Ashtottara Sata Namavali
content:
  english: om svavagde va tasari dba ktavimali kartre namah om raghavendraya namah om sakala pradatre
    namah om bha ktaugha sambhe dana drushti vajraya namah om kshama surèndraya namah om hari padakanja
    nisheva nalabdi samaste sampade namah om deva svabhavaya namah om di vijadrumaya namah om ishta pradatre
    namah om bhavya svarupaya namah || || om bha va duhkhatula sanghagnicaryaya namah om sukha dhairya
    shaline namah om samasta dushtagra hanigra heshaya namah om duratya yo papla sindhu setave namah om
    nirasta doshaya namah om nira vadhyadehaya namah om pratyardha mukatvavidhana bhashaya namah om vidvatsari
    jneya maha visheshaya namah om va gvaikhari nirjita bhavya she shaya namah om santana sampatsarishuddabhakti
    vijnana namah || || om vagdè hasupatavadi dhatre namah om sharirotdha samasta dosha hantrè namah om
    shri guru raghavendraya namah om tiraskrita sunnadi jalapado daka mahimavate namah om dusta patraya
    nashanaya namah om mahavandyasuputra dayakaya namah om vyangaya svanga samridda daya namah om grahapapa
    pahayè namah om duritakanadava bhuta svabhakti darsha naya namah || || om sarvatantra svatantraya
    namah om shrimadhvamatavardanaya namah om vijayendra kara bjotda sudondravara putrakaya namah om yatirajaye
    namah om guruve namah om bhaya pahaya namah om jnana bhakti suputrayuryashah shri punyavarda naya
    namah om prativadi bhayasvanta bheda cihnardha raya namah om sarva vidyapravinaya namah om aparokshi
    krita shrishaya namah || || om apekshita pradatre namah om dayadakshinya vairagya vakpatava mukhanki
    taya namah om shapanugra hashaktaya namah om ajnana vismriti branti namah om samshayapasmriti ksha
    yadosha nashakaya namah om ashtakshara japestarda pradatre namah om adhyatmaya samudbhavakayaja dosha
    hantre namah om sarva punyardha pradatre namah om kalatra yaprardha nakartyahikamushmaka sarvasta
    pradatre namah om agamya mahimnenamah || || om mahayashashe namah om madvamata dugdabdi candraya namah
    om anaghaya namah om yadhashakti pradakshina krita sarvayatra phaladatre namah om shirodharana sarvatirdha
    snana phatadatri samava bandavana gata jalaya namah om namah karana sarvabhista dharte namah om sankirtana
    vedadyarda jnana datre namah om samsara magnajanoddara kartre namah om kushtadi roga nivarta kaya
    namah om andha divya drishti dhatre namah || || om eda mukavaksatutva pradatre namah om purna yu pradatre
    namah om purna sampa tsra datre namah om kukshi gata sarvadoshamnanamah om pangu khanja samicanava
    yava namah om bhuta preta pishacadi pidaghnenamah om dipa samyojanajnana putra datre namah om bhavya
    jnana bhaktyadi vardanaya namah om sarvabhishta pradaya namah om rajacora maha vya ghra sarpana kradi
    pidanaghnenamah || || om svastotra paranestardha samriddha daya namah om udya tprudyona dharmakurmasana
    sdaya namah om khadya khadyo tana dyota pratapaya namah om shriramamanasaya namah om drita kashayava
    sanaya namah om tulasihara vaksha namah om dordanda vilasaddanda kamandalu virajitaya namah om abhaya
    jnana samudraksha malashilaka rambujaya namah om yogendra vandya padabjaya namah om papadri patana
    vajraya namah || || om kshama sura ganadhi shaya namah om hari sevalabdi sarva sampade namah om tatva
    pradarshakaya namah om bhavyakrite namah om bahuvadi vijayine namah om punyavardana padabjabhi sheka
    jala sancayaya namah om dyunadi tulyasadgunaya namah om bhaktaghavidvamsakara nijamuri pradarshakaya
    namah || || om jagadgura ve namah kripanidha ye namah om sarvashastra visharadaya namah om nikhilendri
    yadosha ghne namah om ashtakshara manudi taya namah om sarvasaukhyakrite namah om mrita pota pranadatre
    namah om vedi sdhapurushojji vine namah om vahnista malikodda rtre namah om samagra tika vyakhyatre
    namah om bhatta sangra hakrite namah || || om sudhapara milodda rtre namah om apasmara paha rtre namah
    om upanisha tkhandardha krite namah om ri gvyakhyana kridacaryaya namah om mantralaya nivasine namah
    om nyaya mukta valika rtre namah om candri kavyakhyaka rtre namah om suntantra dipika rtre namah om
    gitarda sangrahakrite namah ||
  devanagari: ॐ स्ववाग्दे व तासरि द्ब क्तविमली कर्त्रे नमः ॐ राघवेन्द्राय नमः ॐ सकल प्रदात्रे नमः ॐ भ
    क्तौघ सम्भे दन द्रुष्टि वज्राय नमः ॐ क्षमा सुरॆन्द्राय नमः ॐ हरि पादकञ्ज निषेव णालब्दि समस्ते सम्पदे
    नमः ॐ देव स्वभावाय नमः ॐ दि विजद्रुमाय नमः ॐ इष्ट प्रदात्रे नमः ॐ भव्य स्वरूपाय नमः ॥ ॥ ॐ भ व दुःखतूल
    सङ्घाग्निचर्याय नमः ॐ सुख धैर्य शालिने नमः ॐ समस्त दुष्टग्र हनिग्र हेशाय नमः ॐ दुरत्य यो पप्ल सिन्धु
    सेतवे नमः ॐ निरस्त दोषाय नमः ॐ निर वध्यदेहाय नमः ॐ प्रत्यर्ध मूकत्वविधान भाषाय नमः ॐ विद्वत्सरि ज्ञेय
    महा विशेषाय नमः ॐ वा ग्वैखरी निर्जित भव्य शे षाय नमः ॐ सन्तान सम्पत्सरिशुद्दभक्ती विज्ञान नमः ॥ ॥
    ॐ वाग्दॆ हसुपाटवादि धात्रे नमः ॐ शरिरोत्ध समस्त दोष हन्त्रॆ नमः ॐ श्री गुरु राघवेन्द्राय नमः ॐ तिरस्कृत
    सुन्नदी जलपादो दक महिमावते नमः ॐ दुस्ता पत्रय नाशनाय नमः ॐ महावन्द्यासुपुत्र दायकाय नमः ॐ व्यङ्गय
    स्वङ्ग समृद्द दाय नमः ॐ ग्रहपापा पहयॆ नमः ॐ दुरितकानदाव भुत स्वभक्ति दर्श नाय नमः ॥ ॥ ॐ सर्वतन्त्र
    स्वतन्त्रय नमः ॐ श्रीमध्वमतवर्दनाय नमः ॐ विजयेन्द्र करा ब्जोत्द सुदोन्द्रवर पूत्रकाय नमः ॐ यतिराजये
    नमः ॐ गुरुवे नमः ॐ भया पहाय नमः ॐ ज्ञान भक्ती सुपुत्रायुर्यशः श्री पुण्यवर्द नाय नमः ॐ प्रतिवादि भयस्वन्त
    भेद चिह्नार्ध राय नमः ॐ सर्व विद्याप्रवीणाय नमः ॐ अपरोक्षि कृत श्रीशाय नमः ॥ ॥ ॐ अपेक्षित प्रदात्रे
    नमः ॐ दायादाक्षिण्य वैराग्य वाक्पाटव मुखाङ्कि ताय नमः ॐ शापानुग्र हशाक्तय नमः ॐ अज्ञान विस्मृति ब्रान्ति
    नमः ॐ संशयापस्मृति क्ष यदोष नाशकाय नमः ॐ अष्टाक्षर जपेस्टार्द प्रदात्रे नमः ॐ अध्यात्मय समुद्भवकायज
    दोष हन्त्रे नमः ॐ सर्व पुण्यर्ध प्रदात्रे नमः ॐ कालत्र यप्रार्ध नाकर्त्यहिकामुष्मक सर्वस्टा प्रदात्रे
    नमः ॐ अगम्य महिम्नेनमः ॥ ॥ ॐ महयशशे नमः ॐ मद्वमत दुग्दाब्दि चन्द्राय नमः ॐ अनघाय नमः ॐ यधाशक्ति प्रदक्षिण
    कृत सर्वयात्र फलदात्रे नमः ॐ शिरोधारण सर्वतीर्ध स्नान फतदातृ समव बन्दावन गत जालय नमः ॐ नमः करण सर्वभिस्टा
    धार्ते नमः ॐ सङ्कीर्तन वेदाद्यर्द ज्ञान दात्रे नमः ॐ संसार मग्नजनोद्दार कर्त्रे नमः ॐ कुष्टादि रोग
    निवर्त काय नमः ॐ अन्ध दिव्य दृष्टि धात्रे नमः ॥ ॥ ॐ एड मूकवाक्सतुत्व प्रदात्रे नमः ॐ पूर्णा यु प्रदात्रे
    नमः ॐ पूर्ण सम्प त्स्र दात्रे नमः ॐ कुक्षि गत सर्वदोषम्नानमः ॐ पङ्गु खञ्ज समीचानाव यव नमः ॐ भुत प्रेत
    पिशाचादि पिडाघ्नेनमः ॐ दीप संयोजनज्ञान पुत्रा दात्रे नमः ॐ भव्य ज्ञान भक्त्यदि वर्दनाय नमः ॐ सर्वाभिष्ट
    प्रदाय नमः ॐ राजचोर महा व्या घ्र सर्पन क्रादि पिडनघ्नेनमः ॥ ॥ ॐ स्वस्तोत्र परनेस्टार्ध समृद्ध दय नमः
    ॐ उद्य त्प्रुद्योन धर्मकूर्मासन स्दाय नमः ॐ खद्य खद्यो तन द्योत प्रतापाय नमः ॐ श्रीराममानसाय नमः ॐ
    दृत काषायव सनाय नमः ॐ तुलसिहार वक्ष नमः ॐ दोर्दण्ड विलसद्दण्ड कमण्डलु विराजिताय नमः ॐ अभय ज्ञान समुद्राक्ष
    मालाशीलक राम्बुजाय नमः ॐ योगेन्द्र वन्द्य पादाब्जाय नमः ॐ पापाद्रि पाटन वज्राय नमः ॥ ॥ ॐ क्षमा सुर
    गणाधी शाय नमः ॐ हरि सेवलब्दि सर्व सम्पदे नमः ॐ तत्व प्रदर्शकाय नमः ॐ भव्यकृते नमः ॐ बहुवादि विजयिने
    नमः ॐ पुण्यवर्दन पादाब्जाभि षेक जल सञ्चायाय नमः ॐ द्युनदी तुल्यसद्गुणाय नमः ॐ भक्ताघविद्वंसकर निजमूरि
    प्रदर्शकाय नमः ॥ ॥ ॐ जगद्गुर वे नमः कृपानिध ये नमः ॐ सर्वशास्त्र विशारदाय नमः ॐ निखिलेन्द्रि यदोष
    घ्ने नमः ॐ अष्टाक्षर मनूदि ताय नमः ॐ सर्वसौख्यकृते नमः ॐ मृत पोत प्राणादात्रे नमः ॐ वेदि स्धपुरुषोज्जी
    विने नमः ॐ वह्निस्त मालिकोद्द र्त्रे नमः ॐ समग्र टीक व्याख्यात्रे नमः ॐ भाट्ट सङ्ग्र हकृते नमः ॥ ॥
    ॐ सुधापर मिलोद्द र्त्रे नमः ॐ अपस्मारा पह र्त्रे नमः ॐ उपनिष त्खण्डार्ध कृते नमः ॐ ऋ ग्व्यख्यान कृदाचार्याय
    नमः ॐ मन्त्रालय निवसिने नमः ॐ न्याय मुक्ता वलीक र्त्रे नमः ॐ चन्द्रि काव्याख्याक र्त्रे नमः ॐ सुन्तन्त्र
    दीपिका र्त्रे नमः ॐ गीतार्द सङ्ग्रहकृते नमः ॥
