id: murari-pancha-ratna-stotram
category: stotram
name:
  english: Murari Pancha Ratna Stotram
content:
  english: yatsevanena pitrimatrisahodaranam cittam na mohamahima malinam karoti | ittham samikshya tava
    bhaktajananmurare muko'smi te'nghrikamalam tadativa dhanyam || || ye ye vilagnamanasah sukhamaptukamah
    te te bhavanti jagadudbhavamohashunyah | drishtva vinashtadhanadhanyagrihanmurare muko'smi te'nghrikamalam
    tadativa dhanyam || || vastrani digvalayamavasatih shmashane patram kapalamapi mundavibhushanani |
    rudre prasadamacalam tava vikshya shaure muko'smi te'nghrikamalam tadativa dhanyam || || yatkirtigayanaparasya
    vidhatrisunoh kaupinamainamajinam vipulam vibhutim | svasyartha digbhramanamikshya tu sarvakalam muko'smi
    te'nghrikamalam tadativa dhanyam || || yadvikshane dhritadhiyamashanam phaladi vaso'pi nirjinavane
    girikandarasu | vasamsi valkalamayani vilokya caivam muko'smi te'nghrikamalam tadativa dhanyam ||
    || stotram padambujasyaitacchrishasya vijitendriyah | pathitva tatpadam yati shlokarthajnastu yo narah
    || || iti murari pancaratnam |
  devanagari: यत्सेवनेन पितृमातृसहोदराणां चित्तं न मोहमहिमा मलिनं करोति । इत्थं समीक्ष्य तव भक्तजनान्मुरारे
    मूकोऽस्मि तेऽङ्घ्रिकमलं तदतीव धन्यम् ॥ ॥ ये ये विलग्नमनसः सुखमाप्तुकामाः ते ते भवन्ति जगदुद्भवमोहशून्याः
    । दृष्ट्वा विनष्टधनधान्यगृहान्मुरारे मूकोऽस्मि तेऽङ्घ्रिकमलं तदतीव धन्यम् ॥ ॥ वस्त्राणि दिग्वलयमावसतिः
    श्मशाने पात्रं कपालमपि मुण्डविभूषणानि । रुद्रे प्रसादमचलं तव वीक्ष्य शौरे मूकोऽस्मि तेऽङ्घ्रिकमलं
    तदतीव धन्यम् ॥ ॥ यत्कीर्तिगायनपरस्य विधातृसूनोः कौपीनमैणमजिनं विपुलां विभूतिम् । स्वस्यार्थ दिग्भ्रमणमीक्ष्य
    तु सार्वकालं मूकोऽस्मि तेऽङ्घ्रिकमलं तदतीव धन्यम् ॥ ॥ यद्वीक्षणे धृतधियामशनं फलादि वासोऽपि निर्जिनवने
    गिरिकन्दरासु । वासांसि वल्कलमयानि विलोक्य चैवं मूकोऽस्मि तेऽङ्घ्रिकमलं तदतीव धन्यम् ॥ ॥ स्तोत्रं पादाम्बुजस्यैतच्छ्रीशस्य
    विजितेन्द्रियः । पठित्वा तत्पदं याति श्लोकार्थज्ञस्तु यो नरः ॥ ॥ इति मुरारि पञ्चरत्नम् ।
