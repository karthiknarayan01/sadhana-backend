id: kyts-5-4-devasuraa-samyattaa-aasann-krishna-yajurveda-taittiriya-samhita-patha
category: stotram
name:
  english: KYTS 5.4 Devasuraa Samyattaa Aasann - Krishna Yajurveda Taittiriya Samhita Patha
content:
  english: krishna yajurvediya taittiriya samhitaya mpancamakande caturthah prashnah shri gurubhyo namah
    | harih om || devasura nte na vyajayanta sa eta indrastanurapashya tta upadhatta tabhirvai sa tanuvamindriyam
    vi~ryamatmannadhatta tato deva abhava 'sura yadindratanurupadadhati tanuvameva tabhirindriyam 'tho
    sendramevagnigm satanu ncinute bhavatyatmana para bhavati yajno devebhyo nnashaknuvanta eta yajnatanurapashya
    nta upadadhata tabhirvai te yajnamavarundhata ya dyajnatanurupadadhati yajnameva tabhiryajamano 'va
    rundhe trayastrigm shatamupa dadhati trayastrigmshadvai devata devata evava rundhe 'tho satmanamevagnigm
    satanu ve~da jyotishmatirupa dadhati jyotirevasmi ndadhatyetabhirva agnishcito jvalati tabhirevainagm
    samindha ubhayorasmai lokayorjyotirbhavati nakshatreshtaka upa dadhatyetani vai divo jyotigmshi tanyevava
    rundhe sukritam va~ etani jyotigmshi yannakshatrani tanyeva ''pnotyatho anukasha jyotigmshi kurute
    suvargasya lokasyanukhyatyai ya sprishta upadaddhya dvrishtyai lokamapi daddhyadavar shukah parjanyah
    syadasaggsprishta upa dadhati vrishtya eva loka shukah parjanyo bhavati purastadanyah praticirupa
    dadhati pashcadanyah pracistasma tpracinani ca praticinani ca nakshatranya vartante || ritavya upa
    dadhatyrituna dvadvammupa dadhati tasma ddvandvamritavo 'dhriteva va esha yanmaddhyama citirantarikshamiva
    va esha dvadvammanyasu citishupa dadhati catasro maddhye dhritya antashshleshanam ya~dritavya yadritavya
    upadadhati citinam vi~dhritya avakamanupa dadhatyesha va agneryoni ncinuta uvaca ha vishvamitro 'dadi
    ya~syaita upadhiyantai ya u caina evam mpratishthayai nudate yo ncitva na pratitishthati panca purvashcitayo
    bhavantyatha shashthi ncinute shadva ritavah sam va~thsara ritushveva sam va~thsare pratitishthatye
    ta va pratitishthatye ta va adhipatnirnameshtaka adhipatnirnameshtaka yasyaita upadhiyante 'dhipatireva
    samanana ddhyayedetabhya evaina bhya a vrishcati tajagartimarcchatyangirasa ya~nto ya yajnasya nishkritirasi
    ttamrishibhyah pratyauha ddhiranyashalkaih prokshati yajnasya nishkritya atho bheshajameva atho rupenaivainagm
    tyatho rupenaivainagm samardhayatyatho hiranyajyotishaiva suvargam lo~kameti sahasravata prokshati
    sahasrah prajapatih prajapateraptya ima me agna ishtaka dhenavah santvityaha dhenurevainah nkamadugha
    amutramushmin ~loka upa tishthante || kannacatvarigmshacca rudro va esha yadagni ssa yatha vathso
    jata mprephsati tasmai yadahuti nna juhuyadaddhvaryu nca dhyayecchatarudriya njuhoti bhagadheyenaivainagm
    shamayati na ''rtimarcchatyaddhvaryurna yajamano ya npashunchuca 'rpaye maranyan jartilayavagva va
    juhuya dgavidhukayavagva va na gramya ''ranyanatho khalvahuranahutirvai jartila shca gavidhukashcetya
    jakshirena juhotyagneyi va esha yadaja ''hutyaiva juhoti na gramya rkatvamarkaparnena juhoti sayonitvayoda
    ntishthan juhotyesha vai rudrasya di khsvayameva dishi rudra nniravadayate caramayamishtakaya njuhotyantata
    eva rudra nniravadayate tredhavibhakta njuhoti traya ime loka imaneva lokan thsamavadviryan karotiyatyagre
    juho tyatheyatyatheyati traya ime loka ebhya evainam lo~kebhyah shamayati tisra uttara ahutirjuhoti
    sha dva ritava ritubhirevainagm shamayati yadanuparikrama njuhuyadantaravacarinagm rudra nkuryadatho
    khalvahuh kasyam 'ha dishi rudrah kasyam ve~tyanuparikramameva hotavya maparivargamevainagm shamaya
    ssuvargyaya uttamasta yajamanam va~cayati tabhirevainagm suvargam ttasya sancare pashuna dyah prathamah
    pashurabhitishthati sa artimarcchati || parivargamevainagm shamayati ashmannurjamiti pari shincati
    marjayatyevainamatho tarpayatyeva sa ena ntripto 'kshuddhya nnamushmin ~loka upa tishthate tripyati
    prajaya pashubhirya evam ssagmrarana ityahannam 'nnamevava rundhe 'shmaggste kshudamu ndvishma ityaha
    yameva dveshti tamasya kshudha ca shuca ca rpayati trih parishinca nparyeti trivridva agniryavaneva
    gnistasya shucagm shamayati trih punah paryeti sha dva ritava ritubhirevasya shucagm shamayatyapam
    'vaka vetasashakhaya cavakabhishca vi kar shatyapo vai shanta shshantabhirevasya shucagm shamayati
    yo va agni mprathamah pashuradhikramatishvaro vai tagm shuca pradaho mandukena vikar manupajivaniyo
    na va esha gramyeshu pashushu hito na ''ranyeshu tameva shuca tyashtakshara gayatri gayatro 'gnistasya
    shucagm shamayati pavakavatibhirannam 'nnenaivasya shucagm shamayati mrityurva esha yadagnirbrahmana
    etadrupam shni upanahavupa muncate brahmanaiva mrityorantardhatte 'ntarmrityordhatte 'ntarannadya
    reva mrityordhatte 'va 'nnadyagm rundhe namaste harase shocisha ityaha namaskritya hi vasiyagm samupacarantyanya
    ttapantu hetaya ityaha yameva dveshti tamasya shuca 'rpayati pavako asmabhyagm shivo bhavetyahannam
    'nnamevava rundhe dvabhyamadhi kramati pratishthitya apasyavatibhyagm shantyai rekanna pancashacca
    nrishade vaditi vyagharayati panktya ''hutya yajnamukhama rabhate 'kshnaya vyagharayati tasmadakshnaya
    pashavo 'ngani praharanti pratishthityai yadvashatkurya ssyadyanna vashatkurya drakshagmsi yajnagm
    hanyurvadityaha parokshameva vasha tkaroti nasya yatayama vashatkaro bhavati na yajnagm rakshagmsi
    ghnanti hutado va anye deva 'nye tanagnicidevobhaya nprinati ye deva devanamiti daddhna madhumishrenavo
    kshati hutadashcaiva devanahutadashca yajamanah prinati te yajamana mprinanti daddhnaiva hutadah prinati
    madhusha 'hutado mmadhu yaddadhna madhumishrena 'varuddhyai grumushtina ssayonitvaya dvabhya mpratishthitya
    anuparicara nprinati vi va esha pranaih prajaya pashubhir ncinvannadhikramati pranada apanada ityaha
    prananeva ndhatte varcoda varivoda ityaha praja vai varcah pashavo varivah prajameva pashunatma ndhatta
    indro vritramahantam 'nikavata ahutimapashya ttasyagnirani kavan thsvena bhagadheyena prita shshodashadha
    vritrasya bhoganapyadaha dvaishvakarmanena papmano niramucyata yadagnaye njuhotyagnireva thsvena bhagadheyena
    pritah papmanamapi dahati vaishvakarmanena papmano nirmucyate ya nirmucyetetyekaika nirmucyetetyekaika
    ntasya juhuyaccirameva papmano nirmucyate ya kpapmano nirmucyeteti sarvani tasyanudrutya juhuya ttajageva
    papmano nirmucyate 'tho khalu nanaiva suktabhya njuhoti nanaiva suktayo ndadhatyatho pratishthityai
    || nnayeti samidha a dadhati yatha janam nkaroti tadrigeva ta ttisra a dadhati trivridva agniryavane
    vagnistasmai bhagadheya rbhavantyurgva udumbara urjamevasma api dadhatyudu tva vishve deva ityaha
    prana vai vishve devah pranai mudyacchate 'gne bharantu cittibhirityaha yasma evaina ncittayodyacchate
    tenaivainagm samardhayati panca disho daivi ryajnamavantu devirityaha disho hyesho 'nu pracyavate
    'pamati mbadhamana ityaha rakshasamapahatyai rayasposhe yajnapati mabhajantirityaha pashavo vai rayasposhah
    pashunevava rundhe shadbhir dva ritava ritubhirevainagm harati dve parigrihyavati bhavato rakshasamapahatyai
    suryarashmirharikeshah purastadityaha prasu tyai tatah pavaka ashisho no jushantamityahannam 'nnamevava
    rundhe devasura pratyeva tena yajamano bhratrivyan jayatyatho anabhijitamevabhi jayati dasharca dvirajemau
    lokau vidhrita vanayo rlokayorvidhritya atho dasha dvirajyevannadye pratitishthatyasadiva va antarikshamantarikshamiva
    ''gni nni dadhati sattvaya dvabhya mpratishthityai vimana esha divo maddhya asta ityaha vyevaitaya
    mimite maddhye divo nihitah prishnirashmetyahannam vai~ prishnyannamevava rundhe catasribhira pucchadeti
    catvari chandagmsi chandobhirevendram vi~shva avivridhannityaha vriddhimevopavartate vajanagm satpati
    'nnamevava rundhe sumnahuryajno devagm a ca vakshadityaha praja vai pashavah sumna mprajameva pashunatma
    ndhatte yakshadagnirdevo devagm a ca vakshadityaha svagakrityai vajasya ma prasaveno dgrabhenodagrabhidityahasau
    va aditya udyannudgrabha esha nimroca nnigrabho brahmanaiva dgrihnati brahmana bhratrivya pracimanu
    pradisha mprehi vidvanityaha devaloka mevaitayopavartate kramaddhvamagnina naka mityahemanevaitaya
    lokan kramate prithivya ahamudantarikshama 'ruhamityahemanevaitaya lokan thsamarohati suvaryanto nape
    kshanta ityaha suvargamevaitaya lokametyagne prehi shvevaitaya devamanushyeshu cakshurdadhati pancabhiradhi
    kramati pankto yajno yavaneva yajnastena saha suvargam lo~kameti naktoshaseti puro 'nuvakyamanvaha
    pratya agne sahasrakshetyaha sahasrah prajapatih prajapateraptyai tasmai te vidhema vajaya svahetyahannam
    rundhe daddhnah purnamaudumbarig njuhotyurgvai daddhyurgudumbaro 'sau svayamatrinna 'mushyamevorja
    ndadhati tasmadamuto 'rvacimurjamupa jivamastisribhih sadayati trivridva agniryavanevagnista ngamayati
    preddho agne didihi puro na ityaudumbarima dadhatyesha vai surmi karnakavatyetaya ha sma vai deva
    asuranagm shatatarhag strigmhanti yadetaya samidhamadadhati vajramevaitacchataghnim ya~jamano bhratrivyaya
    praharati stritya achambatkaram vi~dhema te parame janmannagna iti vaikankatima dadhati bha evava
    rundhe tagm saviturvare nyasya citramiti shamimayigm shantya agnirva ha va agnicita nyasya citramityahaisha
    va agnerdohastamasya kanva eva shrayaso ttena ha smainagm sa duhe yadetaya samidha tyagnicideva tadagni
    nduhe sapta te agne samidhah saptajihva ityaha saptaivasya saptani prinati purnaya juhoti purna iva
    hi prajapatih prajapate raptyai nyunaya juhoti nyunaddhi prajapatih praja asrijata prajanagm srishtya
    agnirdevebhyo nilayata sa disho 'vishajjuhvanmanasa disho ddhyaye ddigbhya evainamava rundhe daddhna
    purasta ttejashcaivasma indriya nca samici dadhati dvadashakapalo vaishvanaro bhavati dvadasha masa
    shvanaramava rundhe ya tprayajanuyajan kuryadvikasti ssa yajnasya darvihoma nkaroti yajnasya pratishthityai
    rashtram shvanaro vinmaruto vaishvanaragm hutva marutan juhoti rashtra eva vishamanu baddhnatyuccai
    '' shravayatyupagmshu marutan juhoti tasma vi~shamati vadati maruta bhavanti maruto vai devanam vi~sho
    devavishenaivasmai manushyavisha mava rundhe sapta bhavanti saptagana vai maruto ganasha eva vishamava
    rundhe ganena ganamanudrutya juhoti vishamevasma anuvartmana 'saditi va esha huyate ghritasya va enamesha
    dhara 'mushmin ~loke pinvamanopa tishthata ajyena juhoti tejo va ajya ntejo vasordhara tejasaivasmai
    tejo 'tho kama vai vasordhara kamanevava rundhe ya nkamayeta prananasya cchindyamiti vigraha tprananevasyannadyam
    nkamayeta prananasyannadyagm sa tprananevasyannadyagm sa ntanoti dvadasha dvadashani juhoti dvadasha
    masa va~thsarenai vasma annamava rundhe 'nna 'kshucca ma ityahai ta annasya rupagm rupenaivannamava
    rundhe 'gnishca ma apashca ma ityahaisha va annasya yoni nyevannamava rundhe 'rdhendrani juhoti devata
    evava rundhe ya mardhamindrah prati tasmadindro devatana mbhuyishthabhaktama indramuttaramahe ddadhati
    yajnayudhani juhoti yajno vai yajnayudhani yajnamevava rundhe 'tho etadvai yajnasya rupagm rupenaiva
    yajnamava rundhe 'vabhrithashca me svagakarashca ma ityaha svagakritya agnishca me gharmashca ma ityahaita
    dvai brahmavarcasasya rupagm rupenaiva brahmavarcasamava rundha rikca me sama ca ma ityahai tadvai
    chandasagm rupagm rupenaiva chandagsyava rundhe garbha shca me vathsashca ma ityahaita dvai pashunagm
    rupagm rupenaiva pashunava rundhe kalpa n juhotya kliptasya kliptyai yugmadayuje juhoti mithunatvayo
    ntya eka ca me tisrashca ma ityaha devachandasam va~ eka ca tisrashca ncaiva manushya chandasanca
    'va rundha a trayastrigm shato juhoti trayastrigmshadvai devata devata evava rundha a 'shtacatvarigmshato
    juhotyashtacatvarigm shadakshara jagati jagatah pashavo jagatyaivasmai pashunava rundhe vajashca prasavashceti
    dvadasha njuhoti dvadasha masa va~thsara eva prati tishthati || shcaikanna pancashacca agnirdevebhyo
    'pa dbhagadheyamicchamanasta ndeva abruvannupa na a vartasva havya vri~nai mahyameva vajaprasaviya
    njuhavanniti tasmadagnaye vajaprasaviya njuhotyagnimeva ta dbhagadheyena samardhayatyatho abhisheka
    evasya sa caturdashabhirjuhoti sapta gramya oshadhaya mavaruddhya annasyannasya juhotyannasyannasya
    varuddhya audumbarena sruvena juhotyurgva udumbara urgannamurjaivasma urjamannamava rundhe 'gnirvai
    devana shati na dhavedavaruddhagg hyasya nnamannamiva khalu vai varsham pavartate naktoshaseti krishnayai
    shvetavathsayai payasa juhotyahnaivasmai ratri mpradapayati ratriya 'harahoratre evasmai pratte kamamannadya
    nduhate rashtrabhrito juhoti rashtramevava rundhe shadbhirjuhoti shadva ritava ritushveva pratitishthati
    bhuvanasya pata iti rathamukhe panca ''hutirjuhoti vajro vai ratho vajrenaiva disho abhi jayatyagnicitagm
    'bhi jayatyagnicitagm ha va amushmin ~loke vato 'bhi pavate vatanamani juhotyabhyevaina mamushmin
    ~loke vatah pavate trini juhoti traya ime loka ebhya eva lokebhyo vatamava rundhe samudro 'si nabhasvanityahaitadvai
    vatasya rupagm rupenaiva vatamava rundhe 'njalina juhoti na hyeteshamanyatha ''hutiravakalpate ||
    suvargaya vai lokaya devaratho yujyate yatrakutaya manushyaratha esha khalu vai devaratho yadagniragnim
    yu~najmi shavasa ghritenetyaha yunaktyevainagm sa enam thsarvabhih pancabhi ssyadapratishthita ahutaya
    ssyurapratishthita sstoma apratishthitanyukthani tisribhih pratassavane va agniryavaneva dva agniryavaneva
    'nasi yukta adhiyata evameva ta tpratyahutayastishthanti prati stomah pratyukthani yajnayajniyasya
    stotre dvabhyamabhi mrishatyetavan vai yajno yavanagnishtomo bhuma tva asyata urdhvah kriyate yavaneva
    yajnastamantato 'nvarohati dvabhya mpratishthitya ekaya muttaro yajno namatyatho santatyai pra va
    esho ncinute na va etasyanishtaka ahutirava kalpate yam njuhoti sravati vai sa tag 'nu para bhavati
    yajnam mpratishthityai pratyahutayastishthanti pratyahutayastishthanti na yajnah parabhavati na yajamano
    'shtavupa dadhatyashtakshara gayatri gayatrenaivaina nchandasa cinute yadekadasha traishtubhena ya
    ddvadasha jagatena chandobhirevaina ncinute napatko vainamaisho tpunashcitirya evam ncinuta a tritiya
    tpurushadannamatti yatha vai punaradheya eva rdhnoti sa punaradheyama dhatte yo ncitva nardhnoti sa
    punashciti ncinuta riddhya atho khalvahurna cetavyeti rudro va esha yadagniryatha mbodhayati tadrigeva
    tadatho khalvahushcetavyeti yatha vasiyagmsa mbhagadheyena bodhayati tadrigeva tanmanuragnimacinuta
    tena na mpunashcitimapashya ttamacinuta taya vai sa a ntyagnyadheyena na ncinvita pashukamah pashavo
    vai chandagmsi pashumaneva bhavati shyenacita ncinvita suvargakama shshyena eva bhutva suvargam ncinvita
    yah kamayeta shir shanvanamushmin ~loke syamiti shir 'mushmin ~loke bhavatyalajacita ncinvita catussita
    mpratishthakamashcatasro disho dikshveva prati tishthati praugacita ncinvita bhratrivyava nnudata
    ubhayatah prauga ncinvitayah kamayeta prajata nnudeya prati janishyamananiti praiva jata nnudate prati
    janishyamana ncinvita bhratrivyavan vajro vai ratho vajrameva bhratrivyebhyah praharati dronacita
    ncinvitannakamo drone va anna nyevannamava rundhe samuhya ncinvita pashukamah pashumaneva bhavati
    ncinvita gramakamo gramyeva bhavati shmashanacita ncinvita yah kamayeta pitriloka riddhnuyamiti pitriloka
    evardhnoti vishvamitrajamadagni vasishthena 'spardhetagm sa eta jamadagnirvihavya apashya tta upadhatta
    tabhirvai sa vasishthasyendriyam dvihavya upadadhatindriyameva tabhirviryam ya~jamano bhratrivyasya
    vrinkte hoturdhishniya upa dadhati yajamanayatanam hota sva evasma ayatana indriyam vi~ryamava rundhe
    dvadashopa dadhati dvadashakshara jagati jagatah pashavo jagatyaivasmai pashunava rundhe 'shtavashtavanyeshu
    dhishniyeshupa dadhatyashtashaphah pashavah pashunevava rundhe shanma dva ritava ritavah khalu vai
    devah pitara rituneva deva ashtacatvarigmshacca pavasva vajasataya ityanushtu kpratipadbhavati tir
    'nushtubhashcatasro gayatriyo ya dashvastribhistishthagg stishthati yaccatasro gayatriyastasma thsarvag
    shcaturah padah pratidadha tpalayate parama va esha chandasam mparamastriratro yajnana yasminnashva
    alabhyate dvadasha masah pancartavastraya ime loka asavaditya ekavigmsha esha prajapatih prajapatyo
    'shvastameva sakshadriddhnoti shakvarayah prishtha nye va ete pashava a labhyanta uteva gramya uteva
    ''ranya yacchakvarayah prishtha mbhavantyashvasya sarvatvaya parthurashma mbhavati rashmina va ashvo
    mbhavatyashvasya yatyai dhrityai sankrityacchavakasama mbhavatyuthsannayajno va esha yadashvamedhah
    kastadvedetyahuryadi sarvo va kriyate na va sarva iti ya thsankrityacchavakasama mbhavatyashvasya
    sarvatvaya parya ptya anantarayaya sarvastomo 'tiratra uttamamaharbhavati sarvasya ''ptyai sarvasya
    jityai sarvameva tena suvargaya yatrakutaya prathamo devayatame || harih om || || krishna yajurvediya
    taittiriya samhitaya mpancamakande caturthah prashna
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय संहिताया म्पञ्चमकाण्डे चतुर्थः प्रश्नः श्री गुरुभ्यो नमः । ह॒रिः॒
    ओम् ॥ दे॒वा॒सु॒रा न्ते न व्य॑जयन्त॒ स ए॒ता इन्द्र॑स्त॒नूर॑पश्य॒ त्ता उपा॑धत्त॒ ताभि॒र्वै स त॒नुव॑मिन्द्रि॒यं
    वीँ॒र्य॑मा॒त्मन्न॑धत्त॒ ततो॑ दे॒वा अभ॑व॒ ऽसु॑रा॒ यदि॑न्द्रत॒नूरु॑प॒दधा॑ति त॒नुव॑मे॒व ताभि॑रिन्द्रि॒यं
    ऽथो॒ सेन्द्र॑मे॒वाग्निग्ं सत॑नु ञ्चिनुते॒ भव॑त्या॒त्मना॒ परा भवति य॒ज्ञो दे॒वेभ्यो न्नाश॑क्नुव॒न्त
    ए॒ता य॑ज्ञत॒नूर॑पश्य॒ न्ता उपा॑दधत॒ ताभि॒र्वै ते य॒ज्ञमवा॑रुन्धत॒ य द्य॑ज्ञत॒नूरु॑प॒दधा॑ति य॒ज्ञमे॒व
    ताभि॒र्यज॑मा॒नो ऽव॑ रुन्धे॒ त्रय॑स्त्रिग्ं शत॒मुप॑ दधाति॒ त्रय॑स्त्रिग्ंश॒द्वै दे॒वता॑ दे॒वता॑ ए॒वाव॑
    रु॒न्धे ऽथो॒ सात्मा॑नमे॒वाग्निग्ं सत॑नु वेँद॒ ज्योति॑ष्मती॒रुप॑ दधाति॒ ज्योति॑रे॒वास्मि॑ न्दधात्ये॒ताभि॒र्वा
    अ॒ग्निश्चि॒तो ज्व॑लति॒ ताभि॑रे॒वैन॒ग्ं॒ समि॑न्ध उ॒भयो॑रस्मै लो॒कयो॒र्ज्योति॑र्भवति नक्षत्रेष्ट॒का
