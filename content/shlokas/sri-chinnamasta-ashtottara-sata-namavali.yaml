    namah | om yantreshyai namah | om yantrapujitayai namah | om kirtyayai namah | om kapardinyai namah
    | om kalyai namah | om kankalyai namah | om kalakarinyai namah | om araktayai namah | om raktanayanayai
    namah | | om raktapanaparayanayai namah | om bhavanyai namah | om bhutidayai namah | om bhutyai namah
    | om bhutidatryai namah | om bhairavyai namah | om bhairavacaraniratayai namah | om bhutabhairavasevitayai
    namah | om bhimayai namah | om bhimeshvaryai namah | | om devyai namah | om bhimanadaparayanayai namah
    | om bhavaradhyayai namah | om bhavanutayai namah | om bhavasagaratarinyai namah | om bhadrakalyai
