id: tulasikavacam-1-brahmandapuranantargatam-tulasi-shrimahadevi
category: kavacha
name:
  english: tulasikavacam 1 (brahmandapuranantargatam tulasi shrimahadevi)
  devanagari: तुलसीकवचम् १ (ब्रह्माण्डपुराणान्तर्गतम् तुलसी श्रीमहादेवि)
content:
  english: tulasikavacam 1 shriganeshaya namah | asya shritulasikavacastotramantrasya shrimahadeva rishih
    | anushtupchandah | shritulasi devata | mama ipsitakamanasiddhyartham jape viniyogah | tulasi shrimahadevi
    namah pankajadharini | shiro me tulasi patu bhalam patu yashasvini || 1|| drishau me padmanayana shrisakhi
    shravane mama | ghranam patu sugandha me mukham ca sumukhi mama || 2|| jihvam me patu shubhada kantham
    vidyamayi mama | skandhau kahlarini patu hridayam vishnuvallabha || 3|| punyada me patu madhyam nabhim
    saubhagyadayini | katim kundalinim patu uru naradavandita || 4|| janani januni patu janghe sakalavandita
    | narayanapriya padau sarvangam sarvarakshini || 5|| sankate vishame durge bhaye vade mahahave | nityam
    hi sandhyayoh patu tulasi sarvatah sada || 6|| itidam paramam guhyam tulasyah kavacamritam | martyanamamritarthaya
    bhitanamabhayaya ca || 7|| mokshaya ca mumukshunam dhyayinam dhyanayogakrit | vashaya vashyakamanam
    vidyayai vedavadinam || 8|| dravinaya daridranam papinam papashantaye || 9|| annaya kshudhitanam ca
    svargaya svargamicchitam | pashavyam pashukamanam putradam putrakankshinam || 10|| rajyaya bhrashtarajyanamashantanam
    ca shantaye | bhaktyartham vishnubhaktanam vishnau sarvantaratmani || 11|| japyam trivargasiddhyartham
    grihasthena visheshatah | udyantam candakiranamupasthaya kritanjalih || 12|| tulasikanane tishthannasino
    va japedidam | sarvankamanavapnoti tathaiva mama sannidhim || 13|| mama priyakaram nityam haribhaktivivardhanam
    | ya syanmritapraja nari tasya angam pramarjayet || 14|| sa putram labhate dirghajivinam capyaroginam
    | vandhyaya marjayedangam kushairmantrena sadhakah || 15|| sa'pi samvatsaradeva garbham dhatte manoharam
    | ashvatthe rajavashyarthi japedagneh surupabhak || 16|| palashamule vidyarthi tejo'rthyabhimukho
    raveh | kanyarthi candikagehe shatruhatyai grihe mama || 17|| shrikamo vishnugehe ca udyane strivasha
    bhavet | kimatra bahunoktena sha
  devanagari: तुलसीकवचम् १ श्रीगणेशाय नमः । अस्य श्रीतुलसीकवचस्तोत्रमन्त्रस्य श्रीमहादेव ऋषिः । अनुष्टुप्छन्दः
    । श्रीतुलसी देवता । मम ईप्सितकामनासिद्ध्यर्थं जपे विनियोगः । तुलसी श्रीमहादेवि नमः पङ्कजधारिणि । शिरो
    मे तुलसी पातु भालं पातु यशस्विनी ॥ १॥ दृशौ मे पद्मनयना श्रीसखी श्रवणे मम । घ्राणं पातु सुगन्धा मे
    मुखं च सुमुखी मम ॥ २॥ जिह्वां मे पातु शुभदा कण्ठं विद्यामयी मम । स्कन्धौ कह्लारिणी पातु हृदयं विष्णुवल्लभा
    ॥ ३॥ पुण्यदा मे पातु मध्यं नाभिं सौभाग्यदायिनी । कटिं कुण्डलिनिं पातु ऊरू नारदवन्दिता ॥ ४॥ जननी जानुनी
    पातु जङ्घे सकलवन्दिता । नारायणप्रिया पादौ सर्वाङ्गं सर्वरक्षिणी ॥ ५॥ सङ्कटे विषमे दुर्गे भये वादे
    महाहवे । नित्यं हि सन्ध्ययोः पातु तुलसी सर्वतः सदा ॥ ६॥ इतीदं परमं गुह्यं तुलस्याः कवचामृतम् । मर्त्यानाममृतार्थाय
    भीतानामभयाय च ॥ ७॥ मोक्षाय च मुमुक्षूणां ध्यायिनां ध्यानयोगकृत् । वशाय वश्यकामानां विद्यायै वेदवादिनाम्
    ॥ ८॥ द्रविणाय दरिद्राणां पापिनां पापशान्तये ॥ ९॥ अन्नाय क्षुधितानां च स्वर्गाय स्वर्गमिच्छिताम् ।
    पशव्यं पशुकामानां पुत्रदं पुत्रकाङ्क्षिणाम् ॥ १०॥ राज्याय भ्रष्टराज्यानामशान्तानां च शान्तये । भक्त्यर्थं
    विष्णुभक्तानां विष्णौ सर्वान्तरात्मनि ॥ ११॥ जाप्यं त्रिवर्गसिद्ध्यर्थं गृहस्थेन विशेषतः । उद्यन्तं
    चण्डकिरणमुपस्थाय कृताञ्जलिः ॥ १२॥ तुलसीकानने तिष्ठन्नासीनो वा जपेदिदम् । सर्वान्कामानवाप्नोति तथैव
    मम सन्निधिम् ॥ १३॥ मम प्रियकरं नित्यं हरिभक्तिविवर्धनम् । या स्यान्मृतप्रजा नारी तस्या अङ्गं प्रमार्जयेत्
    ॥ १४॥ सा पुत्रं लभते दीर्घजीविनं चाप्यरोगिणम् । वन्ध्याया मार्जयेदङ्गं कुशैर्मन्त्रेण साधकः ॥ १५॥
    साऽपि संवत्सरादेव गर्भं धत्ते मनोहरम् । अश्वत्थे राजवश्यार्थी जपेदग्नेः सुरूपभाक् ॥ १६॥ पलाशमूले विद्यार्थी
    तेजोऽर्थ्यभिमुखो रवेः । कन्यार्थी चण्डिकागेहे शत्रुहत्यै गृहे मम ॥ १७॥ श्रीकामो विष्णुगेहे च उद्याने
    स्त्रीवशा भवेत् । किमत्र बहुनोक्तेन श
