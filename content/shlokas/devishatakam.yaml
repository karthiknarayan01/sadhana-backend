id: devishatakam
category: shataka
name:
  english: devishatakam
  devanagari: देवीशतकम्
content:
  english: devishatakam shriganeshaya namah | anantamahimavyaptavishvam vedha na veda yam | ya ca mateva
    bhajate pranate manave dayam || 1|| natapanitakleshayah surarijanatapani | na tapani tanuryasyastulya
    nadinatapani || 2|| vaktrapadma vidherbhanti yaya sargalayo daya | ya sakshadya ca janitasthitisargalayodaya
    || 3|| yashrita pavanataya yatanacchidanicaya | yacaniya dhiya mayayamayasam stuta shriya || 4|| namamsi
    dhvamsamayanti asyah stutyadarena vah | tasyah siddhyai dhiyam matuh kalpantam padarenavah || 5||
    rishinam sadayamasa ya tamamsi trayimayi | payadvah sa dayamadhicchidam jagati bibhrati || 6|| smaradvisha
    ya yayace yaya ceyam vidheh kriya | yam cacyuto'pi tushtava tushta vah sa'stu parvati || 7|| ya damavanayagena
    svaratha nayasaraya | harikaitavahasyaya sayama vijita yaya || 8|| yayatajivimaya sa yasya ha bata
    kairiha | ya rasayanadhara sva na geyanavama daya || 9|| sa buddhiruttamalokah satamarya punatu vah
    | yadbhakteruttama lokah prapnotyesha vishuddhatam || 10|| ayuddha sadhutranaya samara ya saharina
    | khadgena dipra devanam samarayasaharina || 11|| caranaghatanihatakasara ca ranajire | raraja ya
    nayajayairarajasajananata || 12|| savatadvo'mbika'bhyarcyanama na na yashobhitah | tanoti pranato
    yasya na mananayashobhitah || 13|| samyatam yacamanena yasyah prapi dvisha vadhah | samyatam ya ca
    manena yunakti pranatam janam || 14|| ya damanavamanandapadamananamanada | danamanakshamanityadhanamanavamanita
    || 15|| sa rakshatadapara te rasakridgaurabadhika | sarakshatadaparaterasakridgauravadhika || 16||
    anuttamoharashayo bhavanti yamanashritah | anuttamo harashayo yaya ciram ca ranjitah || 17|| anantaragatapayastarayitri
    bhavapadah | anantaragatapayah sa vo gauri hiyatkriyah || 18|| yamayasajidasaktashokajalasya patini
    | ya mata sarvada bhaktalokajalasya palani || 19|| samaragamanayasam tyaktva sardham suraribhih |
    samara gamanayasannudyata yudhi yadganah || 20|| samodayajaya shataih shastraih shatrau hate yaya
    | samodaya jayasha tairgirvanairgarvato jahe || 21|| yayayayayyaya yuyam yo yo'yam yeyayaiya yam |
    yayuyayiyayeyaya yaye'yayaya yayayuk || 22|| sa'vyadgauri sada yushmansadayushmansamriddhyati | sharanam
    yam naro gacchanna rogacchandameti ca || 23|| kritaspada yatha sampadaghani suravairishu | hanti ya
    vanmayi duradaghani suravairishuh || 24|| jitanaya ya natajitarasatatasarata | na savana navasanayatanaririna
    taya || 25|| manobhavaratimanobhiramaya jaramayapakaranaikadakshaya | madakshayannirmalatam dadanaya
    sada nayastha kriyatam tavaryaya || 26|| samayayavindrahitaya ya rane samayaya ya na jitarisenaya
    | sa ma yayace haramashritah sphutam sama yaya mugdhataya manojnatah || 27|| sa bhavakshalavarya nutavibhavitanurya
    valakshavabhasa jananasyashayapra navanalinavanaprayashasyananaja | satam varmananastha rahasi rasiharasthananarmavatamsa
    payadakta ranatra matanamanatamatranarakta dayapa || 28|| upasate krishtikritodayam yam jana sadaradhanamihamanah
    | shambhoh prasiddha tanutam vahanti gauri hitam sa bhavatam vidheyat || 29|| yam sadya eva tridashaih
    pumamsah sama namasyanti sadanabhogah | aghani yasya pranata vipakshaih samanamasyanti sada nabhogah
    || 30|| yasyah prabhavo dyusadam vipakshasena vadhanandayitaharasya | manombujasyavahatu shriyai vah
    senavadhanam dayita harasya || 31|| sura jita bhavitadevarajadvipakshama yata ranadabhitam | svapam
    na vo dhama hitam na nama sadaivasena bhavatohitanam || 32|| surajita bhavitadevarajadvipakshamaya
    taranadabhitam | svapannabodhamahitam nanama sadaiva sena bhavato hitanam || 33|| suraniti dveshijanairabhidrutanudaharadya
    svayamahavodyata | shivo'dya tapaprashamastaya tava prashastaya tattvadrisha vidhiyatam || 34|| vakram
    bibhratyupahitacandrayasam ya sammohaprashamanasuryakara | karanitamaramarimacikshepa kshepatyakta
    ranabhuvi sa vah payat || 35|| hite hite'stu te stute jitajitamitamita | jayajaya jano'jano yaya yayavalam
    balam || 36|| saktim vah sukritarjane vidadhati satram yatam trayatam durga durgrahadushitoddhatadhiyamayasada
    ya sada | sadhutsahavidhanasaktamanasam mukhya tato khyatatam samsmrityaiva
  devanagari: देवीशतकम् श्रीगणेशाय नमः । अनन्तमहिमव्याप्तविश्वां वेधा न वेद याम् । या च मातेव भजते प्रणते
    मानवे दयाम् ॥ १॥ नतापनीतक्लेशायाः सुरारिजनतापनी । न तापनी तनुर्यस्यास्तुल्या नादीनतापनी ॥ २॥ वक्त्रपद्मा
    विधेर्भान्ति यया सर्गलयो दया । या साक्षाद्या च जनितस्थितिसर्गलयोदया ॥ ३॥ याश्रिता पावनतया यातनाच्छिदनीचया
    । याचनीया धिया मायायामायासं स्तुता श्रिया ॥ ४॥ नमांसि ध्वंसमायान्ति अस्याः स्तुत्यादरेण वः । तस्याः
    सिद्ध्यै धियां मातुः कल्पन्तां पादरेणवः ॥ ५॥ ऋषीणां सादयामास या तमांसि त्रयीमयी । पायाद्वः सा दयामाधिच्छिदं
    जगति बिभ्रती ॥ ६॥ स्मरद्विषा या ययाचे यया चेयं विधेः क्रिया । यां चाच्युतोऽपि तुष्टाव तुष्टा वः साऽस्तु
    पार्वती ॥ ७॥ या दमावनयागेन स्वाराथा नयसारया । हरिकैतवहास्याय सायामा विजिता यया ॥ ८॥ यायताजिविमया सा
    यस्या हा बत कैरिह । या रसायनधारा स्वा न गेयानवमा दया ॥ ९॥ सा बुद्धिरुत्तमालोकः सतामार्या पुनातु वः
    । यद्भक्तेरुत्तमा लोकः प्राप्नोत्येष विशुद्धताम् ॥ १०॥ अयुद्ध साधुत्राणाय सामरा या सहारिणा । खड्गेन
    दीप्रा देवानां सामरायासहारिणा ॥ ११॥ चरणाघातनिहतकासरा च रणाजिरे । रराज या नयजयैरराजसजनानता ॥ १२॥ सावताद्वोऽम्बिकाऽभ्यर्च्यनामा
    न न यशोभितः । तनोति प्रणतो यस्या ना माननयशोभितः ॥ १३॥ संयतं याचमानेन यस्याः प्रापि द्विषा वधः । संयतं
    या च मानेन युनक्ति प्रणतं जनम् ॥ १४॥ या दमानवमानन्दपदमाननमानदा । दानमानक्षमानित्यधनमानवमानिता ॥ १५॥
    सा रक्षतादपारा ते रसकृद्गौरबाधिका । सारक्षतादपारातेरसकृद्गौरवाधिका ॥ १६॥ अनुत्तमोहराशयो भवन्ति यामनाश्रिताः
    । अनुत्तमो हराशयो यया चिरं च रञ्जितः ॥ १७॥ अनन्तरागतापायास्तारयित्री भवापदः । अनन्तरागतापायाः सा वो
    गौरी हियात्क्रियाः ॥ १८॥ यामायासजिदासक्तशोकजालस्य पातिनी । या माता सर्वदा भक्तलोकजालस्य पालनी ॥ १९॥
    सामरागमनायासं त्यक्त्वा सार्धं सुरारिभिः । सामरा गमनायासन्नुद्यता युधि यद्गणाः ॥ २०॥ सामोदयाजया शातैः
    शस्त्रैः शत्रौ हते यया । सामोदया जयाशा तैर्गीर्वाणैर्गर्वतो जहे ॥ २१॥ ययायायाय्यया यूयं यो योऽयं येययैय
    याम् । ययुयायिययेयाय ययेऽयायाय याययुक् ॥ २२॥ साऽव्याद्गौरी सदा युष्मान्सदायुष्मान्समृद्ध्यति । शरणं
    यां नरो गच्छन्न रोगच्छन्दमेति च ॥ २३॥ कृतास्पदा यथा सम्पदघानि सुरवैरिषु । हन्ति या वाङ्मयी दूरादघानि
    सुरवैरिषुः ॥ २४॥ जितानया या नताजितारसाततसारता । न सावना नावसानयातनारिरिना तया ॥ २५॥ मनोभवारातिमनोभिरामया
    जरामयापाकरणैकदक्षया । मदक्षयान्निर्मलतां ददानया सदा नयास्था क्रियतां तवार्यया ॥ २६॥ समाययाविन्द्रहिताय
    या रणे समायया या न जितारिसेनया । स मा ययाचे हरमाश्रितः स्फुटं समा यया मुग्धतया मनोज्ञताः ॥ २७॥ सा
    भावक्षालवर्या नुतविभवितनुर्या वलक्षावभासा जानानस्याशयप्रा नवनलिनवनप्रायशस्याननाजा । सातं वर्माननस्था
    रहसि रसिहरस्थाननर्मावतंसा पायादक्ता रणत्रा मतनमनतमत्राणरक्ता दयापा ॥ २८॥ उपासते कृष्टिकृतोदयां यां
    जना सदाराधनमीहमानाः । शम्भोः प्रसिद्धा तनुतां वहन्ती गौरी हितं सा भवतां विधेयात् ॥ २९॥ यां सद्य एव
    त्रिदशैः पुमांसः समा नमस्यन्ति सदानभोगाः । अघानि यस्य प्रणता विपक्षैः समानमस्यन्ति सदा नभोगाः ॥ ३०॥
    यस्याः प्रभावो द्युसदां विपक्षसेना वधानन्दयिताहरस्य । मनोम्बुजस्यावहतु श्रियै वः सेनावधानं दयिता हरस्य
    ॥ ३१॥ सुरा जिता भावितदेवराजद्विपक्षमा यात रणादभीतम् । स्वापं न वो धाम हितं न नाम सदैवसेना भवतोहितानाम्
    ॥ ३२॥ सुराजिता भावितदेवराजद्विपक्षमाया तरणादभीतम् । स्वापन्नबोधामहितं ननाम सदैव सेना भवतो हितानाम्
    ॥ ३३॥ सुरानिति द्वेषिजनैरभिद्रुतानुदाहरद्या स्वयमाहवोद्यता । शिवोऽद्य तापप्रशमस्तया तव प्रशस्तया तत्त्वदृशा
    विधीयताम् ॥ ३४॥ वक्रं बिभ्रत्युपहितचन्द्रायासं या संमोहप्रशमनसूर्याकारा । कारानीतामरमरिमाचिक्षेप क्षेपत्यक्ता
    रणभुवि सा वः पायात् ॥ ३५॥ हिते हितेऽस्तु ते स्तुते जिताजितामितामिता । जयाजया जनोऽजनो यया ययावलं बलम्
    ॥ ३६॥ सक्तिं वः सुकृतार्जने विदधती सत्रां यतां त्रायतां दुर्गा दुर्ग्रहदूषितोद्धतधियामायासदा या सदा
    । साधूत्साहविधानसक्तमनसां मुख्या ततो ख्याततां संस्मृत्यैव
