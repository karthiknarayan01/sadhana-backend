id: renukakavacam-2
category: kavacha
name:
  english: renukakavacam 2
  devanagari: रेणुकाकवचम् २
content:
  english: siddhyarthe viniyogo varanane | renuka me shirah patu para shaktisvarupini || bhalam rakshatu
    bhuvaneshi locanam me trilocani | mukham me renuka patu nasikam kalanashini || bhruvau subhrulata
    patu dantanme kundadantika | oshtham bimboshthika patu jimhvam patu sureshvari || grivam rakshatu
    indrani kukshau rakshetkuleshvari | gandam me patu camunda mahalakshmistu kandharam || asau hamsapriya
    patu bahu sayudhavahuka | vanim vakshasthalam patu hridayam hridayeshvari || jaghane ghanavaha me
    guhyam guhyeshvari mama | uru varoruka patu shridevi siddhidevata || sarvangam sarvada patu sarvani
    rupini vara | iti shrirenuka varma dushkarma trasanam sada || stutimatrena bhaktanam samrakshanavicakshanam
    | japtva tu kavacam devyah yatra tatra tu gacchati || tatra tatra jayo labhah karyasiddhishca jayate
    | || iti shri damareshvaratantre renukakavacam nama shashthitamo'dhyayah ||
  devanagari: सिद्ध्यर्थे विनियोगो वरानने । रेणुका मे शिरः पातु परा शक्तिस्वरूपिणी ॥ भालं रक्षतु भुवनेशी
    लोचनं मे त्रिलोचनी । मुखं मे रेणुका पातु नासिकां कालनाशिनी ॥ भ्रुवौ सुभ्रूलता पातु दन्तान्मे कुन्ददन्तिका
    । ओष्ठं बिम्बोष्ठिका पातु जिंह्वां पातु सुरेश्वरी ॥ ग्रीवां रक्षतु इन्द्राणी कुक्षौ रक्षेत्कुलेश्वरी
    । गण्डं मे पातु चामुण्डा महालक्ष्मीस्तु कन्धरम् ॥ असौ हंसप्रिया पातु बाहू सायुधवाहुका । वाणीं वक्षस्थलं
    पातु हृदयं हृदयेश्वरी ॥ जघने घनवाहा मे गुह्यं गुह्येश्वरी मम । ऊरू वरोरुका पातु श्रीदेवी सिद्धिदेवता
    ॥ सर्वाङ्गं सर्वदा पातु सर्वाणी रूपिणी वरा । इति श्रीरेणुका वर्म दुष्कर्म त्रासनं सदा ॥ स्तुतिमात्रेण
    भक्तानां संरक्षणविचक्षणम् । जप्त्वा तु कवचं देव्याः यत्र तत्र तु गच्छति ॥ तत्र तत्र जयो लाभः कार्यसिद्धिश्च
    जायते । ॥ इति श्री डामरेश्वरतन्त्रे रेणुकाकवचं नाम षष्ठितमोऽध्यायः ॥
