id: nrisimhakavacamapamrityuharam
category: kavacha
name:
  english: nrisimhakavacamapamrityuharam
  devanagari: नृसिंहकवचमपमृत्युहरम्
content:
  english: nrisimho me shirah patu patu bhalam nrikesari | bhruvau nrisimho me patu nrisimho nayanadvayam
    || 14|| nrisimho nasike patu karnau patu nrikesari | nrisimho me mukham patu kapolau rakshataddharih
    || 15|| nrisimhashcibukam rakshetkantham patu nrikesari | skandhau patu nrisimho me bhujau patu nrikesari
    || 16|| karadvayam nrisimho'vyannrisimho rakshatadurah | nrisimho hridayam patu nrisimho'vyattathodaram
    || 17|| kukshim naraharih patu nabhim patu nrikesari | bastim ca guhyadesham ca nrisimho'vyatsada
    mama || 18|| nrisimho januni patu janghe patu nrikesari | padau gulphau sada patu nrisimho mama rakshakah
    || 19|| agratah prishthato me'vyattatha parshvadvayam sada | nrisimhah sarvagatrani mama rakshatu
    sarvada || 20|| nrisimho rakshatatpurve vahnikone nrikesari | nairrityam narasimho'vyanrisimhah patu
    pashcime || 21|| nrisimho vayukone'vyaduttare'vyannrikesari | nrisimho'vyattatheshane hyadha urdhvam
    samantatah || 22|| jale sada rakshatu mam nrisimhah sthaleshu mam patu sada nrisimhah | nabhastale
    bhumitale samantanrikesari rakshatu sarvada mam || 23|| durgadhvadurgabhavaneshu ca sankateshu pranaprayanabhayavighnasamuccayeshu
    | shitoshnavataripurogabhayeshu yuddhe sankashtanashanaparo'vatu mam nrisimhah || 24|| chinattu cakrena
    sada'rivargansarvannrisimho mama mrityurupan | asadhyadussadhyasamastaroganbhindyannrisimhah svagadabhighataih
    || 25|| pretanpishacansaganansvanena shankhasya vidravayatannrisimhah | kushmandabalagrahayaksharakshah
    sa dakinih shakinikah samastah || 26|| khadgena me mrityunisargapasham sanchidya mam patu sada nrisimhah
    | sada'pamrityoshca tatha'lpamrityorvimocya mam rakshatunarasimhah || 27|| bhaktasamrakshanarthaya
    vidaryastambhamudgatah | nrisimho rakshakah so'stu mrityuh kim mem karishyati || 28|| attattahasato
    yasya sarve devashcakampire | nrisimho rakshakah so'stu mrityuh kim me karishyati || 29|| hiranyakashiporvaksho
    dadaranishitairnakhaih | nrisimho rakshakah so'stu mrityuh kim me karishyati || 30|| yasya bhrubhangamatrena
    trastamasijjagattrayam | nrisimho rakshakah so'stu mrityuh kim me karishyati || 31|| utkshiptasataya
    vyagra deva daitya vidudruvuh | nrisimho rakshakah so'stu mrityuh kim me karishyati || 32|| yannamasmaranadeva
    dahyante vighnarashayah | nrisimho rakshakah so'stu mrityuh kim me karishyati || 33|| yadanghridhyanatahsadyo
    viliyante'gharashayah | nrisimho rakshakah so'stu mrityuh kim me karishyati || 34|| mata nrisimhashca
    pita nrisimho bhrata nrisimhashca sakha nrisimhah | balam nrisimho dravinam nrisimhah sarvam nrisimho
    mama devadevah || 35|| iti te kathitam putra nrisimhakavacam shubham | asya dharanatah pathadalpamrityuh
    prashamyati || 36|| shatam va'tha tadardham va tadardham va sadakshinam | viprebhyah pustakam dadyadalpamrityuprashantaye
    || 37|| iti shrisuryarunasamvade apamrityuharam nrisimhakavacam samaptam || || om tatsatparamatmanenamah
    ||
  devanagari: नृसिंहो मे शिरः पातु पातु भालं नृकेसरी । भ्रुवौ नृसिंहो मे पातु नृसिंहो नयनद्वयम् ॥ १४॥
    नृसिंहो नासिके पातु कर्णौ पातु नृकेसरी । नृसिंहो मे मुखं पातु कपोलौ रक्षताद्धरिः ॥ १५॥ नृसिंहश्चिबुकं
    रक्षेत्कण्ठं पातु नृकेसरी । स्कन्धौ पातु नृसिंहो मे भुजौ पातु नृकेसरी ॥ १६॥ करद्वयं नृसिंहोऽव्यान्नृसिंहो
    रक्षतादुरः । नृसिंहो हृदयं पातु नृसिंहोऽव्यात्तथोदरम् ॥ १७॥ कुक्षिं नरहरिः पातु नाभिं पातु नृकेसरी
    । बस्तिं च गुह्यदेशं च नृसिंहोऽव्यात्सदा मम ॥ १८॥ नृसिंहो जानुनी पातु जङ्घे पातु नृकेसरी । पादौ गुल्फौ
    सदा पातु नृसिंहो मम रक्षकः ॥ १९॥ अग्रतः पृष्ठतो मेऽव्यात्तथा पार्श्वद्वयं सदा । नृसिंहः सर्वगात्राणि
    मम रक्षतु सर्वदा ॥ २०॥ नृसिंहो रक्षतात्पूर्वे वह्निकोणे नृकेसरी । नैरृत्यां नरसिंहोऽव्यानृसिंहः पातु
    पश्चिमे ॥ २१॥ नृसिंहो वायुकोणेऽव्यादुत्तरेऽव्यान्नृकेसरी । नृसिंहोऽव्यात्तथेशाने ह्यध ऊर्ध्वं समन्ततः
    ॥ २२॥ जले सदा रक्षतु मां नृसिंहः स्थलेषु मां पातु सदा नृसिंहः । नभस्तले भूमितले समन्तानृकेसरी रक्षतु
    सर्वदा माम् ॥ २३॥ दुर्गाध्वदुर्गभवनेषु च सङ्कटेषु प्राणप्रयाणभयविघ्नसमुच्चयेषु । शीतोष्णवातरिपुरोगभयेषु
    युद्धे सङ्कष्टनाशनपरोऽवतु मां नृसिंहः ॥ २४॥ छिनत्तु चक्रेण सदाऽरिवर्गान्सर्वान्नृसिंहो मम मृत्युरूपान्
    । असाध्यदुस्साध्यसमस्तरोगान्भिन्द्यान्नृसिंहः स्वगदाभिघातैः ॥ २५॥ प्रेतान्पिशाचान्सगणान्स्वनेन शङ्खस्य
    विद्रावयतान्नृसिंहः । कूष्माण्डबालग्रहयक्षरक्षः स डाकिनीः शाकिनिकाः समस्ताः ॥ २६॥ खड्गेन मे मृत्युनिसर्गपाशं
    सञ्छिद्य मां पातु सदा नृसिंहः । सदाऽपमृत्योश्च तथाऽल्पमृत्योर्विमोच्य मां रक्षतुनारसिंहः ॥ २७॥ भक्तसंरक्षणार्थाय
    विदार्यस्तम्भमुद्गतः । नृसिंहो रक्षकः सोऽस्तु मृत्युः किं में करिष्यति ॥ २८॥ अट्टाट्टहासतो यस्य सर्वे
    देवाश्चकम्पिरे । नृसिंहो रक्षकः सोऽस्तु मृत्युः किं मे करिष्यति ॥ २९॥ हिरण्यकशिपोर्वक्षो ददारनिशितैर्नखैः
    । नृसिंहो रक्षकः सोऽस्तु मृत्युः किं मे करिष्यति ॥ ३०॥ यस्य भ्रूभङ्गमात्रेण त्रस्तमासीज्जगत्त्रयम्
    । नृसिंहो रक्षकः सोऽस्तु मृत्युः किं मे करिष्यति ॥ ३१॥ उत्क्षिप्तसटया व्यग्रा देवा दैत्या विदुद्रुवुः
    । नृसिंहो रक्षकः सोऽस्तु मृत्युः किं मे करिष्यति ॥ ३२॥ यन्नामस्मरणादेव दह्यन्ते विघ्नराशयः । नृसिंहो
    रक्षकः सोऽस्तु मृत्युः किं मे करिष्यति ॥ ३३॥ यदङ्घ्रिध्यानतःसद्यो विलीयन्तेऽघराशयः । नृसिंहो रक्षकः
    सोऽस्तु मृत्युः किं मे करिष्यति ॥ ३४॥ माता नृसिंहश्च पिता नृसिंहो भ्राता नृसिंहश्च सखा नृसिंहः । बलं
    नृसिंहो द्रविणं नृसिंहः सर्वं नृसिंहो मम देवदेवः ॥ ३५॥ इति ते कथितं पुत्र नृसिंहकवचं शुभम् । अस्य
    धारणतः पाठादल्पमृत्युः प्रशाम्यति ॥ ३६॥ शतं वाऽथ तदर्धं वा तदर्धं वा सदक्षिणम् । विप्रेभ्यः पुस्तकं
    दद्यादल्पमृत्युप्रशान्तये ॥ ३७॥ इति श्रीसूर्यारुणसंवादे अपमृत्युहरं नृसिंहकवचं समाप्तम् ॥ ॥ ॐ तत्सत्परमात्मनेनमः
    ॥
