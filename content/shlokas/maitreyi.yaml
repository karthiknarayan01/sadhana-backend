id: maitreyi
category: upanishad
name:
  english: maitreyi
  devanagari: मैत्रेयि
content:
  english: dbahyarcanam pariharedapunarbhavaya || 26|| antahpurno bahihpurnah purnakumbha ivarnave | antahshunyo
    bahihshunyah shunyakumbha ivambare ||27|| ma bhava grahyabhavatma grahakatma ca ma bhava | bhavanamakhilam
    tyaktva yacchishtam tanmayo bhava || 28|| drashtridarshanadrishyani tyaktva vasanaya saha | darshanaprathamabhasamatmanam
    kevalam bhaja || 29|| samshantasarvasamkalpa ya shilavadavasthitih | jagrannidravinirmukta sa svarupasthitih
    para || 30|| iti dvitiyo'dhyayah || 2|| ahamasmi parashcasmi brahmasmi prabhavo'smyaham | sarvalokagurushcami
    sarvaloke'smi so'smyaham || 1|| ahamevasmi siddho'smi shuddho'smi paramo'smyaham | ahamasmi somo'smi
    nityo'smi vimalo'smyaham || 2|| vijnano'smi vishesho'smi somo'smi sakalo'smyaham | shubho'smi shokahino'smi
    caitanyo'smi samo'smyaham || 3|| manavamanahino'smi nirguno'smi shivo'smyaham | dvaitadvaitavihino'smi
    dvandvahino'smi so'smyaham || 4|| bhavabhavavihino'smi bhasahino'smi bhasmyaham | shunyashunyaprabhavo'smi
    shobhanashobhano'smyaham || 5|| tulyatulyavihino'smi nityah shuddhah sadashivah | sarvasarvavihino'smi
    sattviko'smi sadasmyaham || 6|| ekasankhyavihino'smi dvisankhyavahanam na ca | sadasadbhedahino'smi
    sankalparahito'smyaham || 7|| nanatmabhedahino'smi hyakhandanandavigrahah | nahamasmi na canyo'smi
    dehadirahito'smyaham || 8|| ashrayashrayahino'smi adhararahito'smyaham | bandhamokshadihino'smi shuddhabrahmasmi
    so'smyaham || 9|| cittadisarvahino'smi paramo'smi paratparah | sada vicararupo'smi nirvicaro'smi so'smyaham
    || 10|| akarokararupo'smi makaro'smi sanatanah | dhatridhyanavihino'smi dhyeyahino'smi so'smyaham
    || 11|| sarvapurnasvarupo'smi saccidanandalakshanah | sarvatirthasvarupo'smi paramatmasmyaham shivah
    || 12|| lakshyalakshyavihino'smi layahinaraso'smyaham | matrimanavihino'smi meyahinah shivo'smyaham
    || 13|| na jagatsarvadrashtasmi netradirahito'smyaham | pravriddho'smi prabuddho'smi prasanno'smi
    paro'smyaham || 14|| sarvendriyavihino'smi sarvakarmakridapyaham | sarvavedantatripto'smi sarvada
    sulabho'smyaham || 15|| muditamuditakhyo'smi sarvamaunaphalo'smyaham | nityacinmatrarupo'smi sada
    saccinmayo'smyaham || 16|| yatkincidapi hino'smi svalpamapyati nasmyaham | hridayagranthihino'smi
    hridayambhojamadhyagah || 17|| shadvikaravihino'smi shatkosharahito'smyaham | arishadvargamukto'smi
    antaradantaro'smyaham || 18|| deshakalavimukto'smi digambarasukho'smyaham | nasti nasti vimukto'smi
    nakarahito'smyaham || 19|| akhandakasharupo'smi hyakhandakaramasmyaham | prapancamuktacitto'smi prapancarahito'smyaham
    || 20|| sarvaprakasharupo'smi cinmatrajyotirasmyaham | kalatrayavimukto'smi kamadirahito'smyaham ||
    21|| kayikadivimukto'smi nirgunah kevalo'smyaham | muktihino'smi mukto'smi mokshahino'smyaham sada
    || 22|| satyasatyadihino'smi sanmatrannasmyaham sada | gantavyadeshahino'smi gamanadivivarjitah ||
    23|| sarvada samarupo'smi shanto'smi purushottamah | evam svanubhavo yasya so'hamasmi na samshayah
    || 24|| yah sha
  devanagari: द्बाह्यार्चनं परिहरेदपुनर्भवाय ॥ २६॥ अन्तःपूर्णो बहिःपूर्णः पूर्णकुम्भ इवार्णवे । अन्तःशून्यो
    बहिःशून्यः शून्यकुम्भ इवाम्बरे ॥२७॥ मा भव ग्राह्यभावात्मा ग्राहकात्मा च मा भव । भावनामखिलं त्यक्त्वा
    यच्छिष्टं तन्मयो भव ॥ २८॥ द्रष्टृदर्शनदृश्यानि त्यक्त्वा वासनया सह । दर्शनप्रथमाभासमात्मानं केवलं
    भज ॥ २९॥ संशान्तसर्वसंकल्पा या शिलावदवस्थितिः । जाग्रन्निद्राविनिर्मुक्ता सा स्वरूपस्थितिः परा ॥ ३०॥
    इति द्वितीयोऽध्यायः ॥ २॥ अहमस्मि परश्चास्मि ब्रह्मास्मि प्रभवोऽस्म्यहम् । सर्वलोकगुरुश्चामि सर्वलोकेऽस्मि
    सोऽस्म्यहम् ॥ १॥ अहमेवास्मि सिद्धोऽस्मि शुद्धोऽस्मि परमोऽस्म्यहम् । अहमस्मि सोमोऽस्मि नित्योऽस्मि
    विमलोऽस्म्यहम् ॥ २॥ विज्ञानोऽस्मि विशेषोऽस्मि सोमोऽस्मि सकलोऽस्म्यहम् । शुभोऽस्मि शोकहीनोऽस्मि चैतन्योऽस्मि
    समोऽस्म्यहम् ॥ ३॥ मानावमानहीनोऽस्मि निर्गुणोऽस्मि शिवोऽस्म्यहम् । द्वैताद्वैतविहीनोऽस्मि द्वन्द्वहीनोऽस्मि
    सोऽस्म्यहम् ॥ ४॥ भावाभावविहीनोऽस्मि भासाहीनोऽस्मि भास्म्यहम् । शून्याशून्यप्रभावोऽस्मि शोभनाशोभनोऽस्म्यहम्
    ॥ ५॥ तुल्यातुल्यविहीनोऽस्मि नित्यः शुद्धः सदाशिवः । सर्वासर्वविहीनोऽस्मि सात्त्विकोऽस्मि सदास्म्यहम्
    ॥ ६॥ एकसङ्ख्याविहीनोऽस्मि द्विसङ्ख्यावाहनं न च । सदसद्भेदहीनोऽस्मि सङ्कल्परहितोऽस्म्यहम् ॥ ७॥ नानात्मभेदहीनोऽस्मि
    ह्यखण्डानन्दविग्रहः । नाहमस्मि न चान्योऽस्मि देहादिरहितोऽस्म्यहम् ॥ ८॥ आश्रयाश्रयहीनोऽस्मि आधाररहितोऽस्म्यहम्
    । बन्धमोक्षादिहीनोऽस्मि शुद्धब्रह्मास्मि सोऽस्म्यहम् ॥ ९॥ चित्तादिसर्वहीनोऽस्मि परमोऽस्मि परात्परः
    । सदा विचाररूपोऽस्मि निर्विचारोऽस्मि सोऽस्म्यहम् ॥ १०॥ अकारोकाररूपोऽस्मि मकरोऽस्मि सनातनः । धातृध्यानविहीनोऽस्मि
    ध्येयहीनोऽस्मि सोऽस्म्यहम् ॥ ११॥ सर्वपूर्णस्वरूपोऽस्मि सच्चिदानन्दलक्षणः । सर्वतीर्थस्वरूपोऽस्मि परमात्मास्म्यहं
    शिवः ॥ १२॥ लक्ष्यालक्ष्यविहीनोऽस्मि लयहीनरसोऽस्म्यहम् । मातृमानविहीनोऽस्मि मेयहीनः शिवोऽस्म्यहम् ॥
    १३॥ न जगत्सर्वद्रष्टास्मि नेत्रादिरहितोऽस्म्यहम् । प्रवृद्धोऽस्मि प्रबुद्धोऽस्मि प्रसन्नोऽस्मि परोऽस्म्यहम्
    ॥ १४॥ सर्वेन्द्रियविहीनोऽस्मि सर्वकर्मकृदप्यहम् । सर्ववेदान्ततृप्तोऽस्मि सर्वदा सुलभोऽस्म्यहम् ॥ १५॥
    मुदितामुदिताख्योऽस्मि सर्वमौनफलोऽस्म्यहम् । नित्यचिन्मात्ररूपोऽस्मि सदा सच्चिन्मयोऽस्म्यहम् ॥ १६॥
    यत्किञ्चिदपि हीनोऽस्मि स्वल्पमप्यति नास्म्यहम् । हृदयग्रन्थिहीनोऽस्मि हृदयाम्भोजमध्यगः ॥ १७॥ षड्विकारविहीनोऽस्मि
    षट्कोषरहितोऽस्म्यहम् । अरिषड्वर्गमुक्तोऽस्मि अन्तरादन्तरोऽस्म्यहम् ॥ १८॥ देशकालविमुक्तोऽस्मि दिगम्बरसुखोऽस्म्यहम्
    । नास्ति नास्ति विमुक्तोऽस्मि नकारहितोऽस्म्यहम् ॥ १९॥ अखण्डाकाशरूपोऽस्मि ह्यखण्डाकारमस्म्यहम् । प्रपञ्चमुक्तचित्तोऽस्मि
    प्रपञ्चरहितोऽस्म्यहम् ॥ २०॥ सर्वप्रकाशरूपोऽस्मि चिन्मात्रज्योतिरस्म्यहम् । कालत्रयविमुक्तोऽस्मि कामादिरहितोऽस्म्यहम्
    ॥ २१॥ कायिकादिविमुक्तोऽस्मि निर्गुणः केवलोऽस्म्यहम् । मुक्तिहीनोऽस्मि मुक्तोऽस्मि मोक्षहीनोऽस्म्यहम्
    सदा ॥ २२॥ सत्यासत्यादिहीनोऽस्मि सन्मात्रान्नास्म्यहं सदा । गन्तव्यदेशहीनोऽस्मि गमनादिविवर्जितः ॥ २३॥
    सर्वदा समरूपोऽस्मि शान्तोऽस्मि पुरुषोत्तमः । एवं स्वानुभवो यस्य सोऽहमस्मि न संशयः ॥ २४॥ यः श
