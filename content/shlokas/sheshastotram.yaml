id: sheshastotram
category: stotram
name:
  english: sheshastotram
  devanagari: शेषस्तोत्रम्
content:
  english: shrisheshastotram rasatma paratma purushottamo yo nijottaranayaiva narayanaya | mahamantrarajam
    prapede yato'yam tamisham phanisham gurum sheshamide || 1|| sahasrananairvaksahasradvayena sada kirtayantam
    hareh kirtimeva | grinantam shrutibhyo matam bhaktikandam tamisham phanisham gurum sheshamide || 2||
    virinceh kumaranprati praha purvam nripam citraketum prati pritipurvam | harerbhaktishastram manuryashca
    mahyam tamisham phanisham gurum sheshamide || 3|| sada yogino bhogino yam bhajante yathayogamesham
    dadatyarthasiddhim | samriddhim karoti priyasyaiva vishno
  devanagari: श्रीशेषस्तोत्रम् रसात्मा परात्मा पुरुषोत्तमो यो निजोत्तारणायैव नारायणाय । महामन्त्रराजं
    प्रपेदे यतोऽयं तमीशं फणीशं गुरुं शेषमीडे ॥ १॥ सहस्राननैर्वाक्सहस्रद्वयेन सदा कीर्तयन्तं हरेः कीर्तिमेव
    । गृणन्तं श्रुतिभ्यो मतं भक्तिकाण्डं तमीशं फणीशं गुरुं शेषमीडे ॥ २॥ विरिञ्चेः कुमारान्प्रति प्राह
    पूर्वं नृपं चित्रकेतुं प्रति प्रीतिपूर्वम् । हरेर्भक्तिशास्त्रं मनुर्यश्च मह्यं तमीशं फणीशं गुरुं
    शेषमीडे ॥ ३॥ सदा योगिनो भोगिनो यं भजन्ते यथायोगमेषां ददात्यर्थसिद्धिम् । समृद्धिं करोति प्रियस्यैव
    विष्णो
