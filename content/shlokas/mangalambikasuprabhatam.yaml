id: mangalambikasuprabhatam
category: stotram
name:
  english: mangalambikasuprabhatam
  devanagari: मन्गलाम्बिकासुप्रभातम्
content:
  english: ratnani nama nanu bhantu kiritamadhye vakshahsthale ca vasatad brihad indranilam | kanci tavangam
    abhitah saha kinkinibhih taih kim suvarnacaranau sharanam prapadye || 4||
  devanagari: रत्नानि नाम ननु भान्तु किरीटमध्ये वक्षःस्थले च वसताद् बृहद् इन्द्रनीलम् । काञ्ची तवाङ्गम्
    अभितः सह किङ्किणीभिः तैः किं सुवर्णचरणौ शरणं प्रपद्ये ॥ ४॥
meaning: {}
