id: sree-maha-ganesha-pancharatnam
category: stotram
name:
  english: Sree Maha Ganesha Pancharatnam
content:
  english: mudakaratta modakam sada vimukti sadhakam | kaladharavatamsakam vilasiloka rakshakam | anayakaika
    nayakam vinashitebha daityakam | natashubhashu nashakam namami tam vinayakam || || natetarati bhikaram
    navoditarka bhasvaram | namatsurari nirjaram natadhikapaduddharam | sureshvaram nidhishvaram gajeshvaram
    ganeshvaram | maheshvaram tamashraye paratparam nirantaram || || samasta loka shankaram nirasta daitya
    kunjaram | daretarodaram varam varebha vaktramaksharam | kripakaram kshamakaram mudakaram yashaskaram
    | manaskaram namaskritam namaskaromi bhasvaram || || akincanarti marjanam cirantanokti bhajanam |
    purari purva nandanam surari garva carvanam | prapanca nasha bhishanam dhananjayadi bhushanam | kapola
    danavaranam bhaje purana varanam || || nitanta kanta danta kanti mantakantakatmajam | acintya rupa
    mantaraya krintanam | hridantare nirantaram vasantameva yoginam | tamekadantameva tam vicintayami
    santatam || || mahaganesha pancaratnamadarena yo'nvaham | prajalpati prabhatake hridi smaran ganeshvaram
    | arogatamadoshatam susahitim suputratam | samahitayu mabhyupaiti so'cirat ||
  devanagari: मुदाकरात्त मोदकं सदा विमुक्ति साधकम् । कलाधरावतंसकं विलासिलोक रक्षकम् । अनायकैक नायकं विनाशितेभ
    दैत्यकम् । नताशुभाशु नाशकं नमामि तं विनायकम् ॥ ॥ नतेतराति भीकरं नवोदितार्क भास्वरम् । नमत्सुरारि निर्जरं
    नताधिकापदुद्धरम् । सुरेश्वरं निधीश्वरं गजेश्वरं गणेश्वरम् । महेश्वरं तमाश्रये परात्परं निरन्तरम् ॥
    ॥ समस्त लोक शङ्करं निरस्त दैत्य कुञ्जरम् । दरेतरोदरं वरं वरेभ वक्त्रमक्षरम् । कृपाकरं क्षमाकरं मुदाकरं
    यशस्करम् । मनस्करं नमस्कृतां नमस्करोमि भास्वरम् ॥ ॥ अकिञ्चनार्ति मार्जनं चिरन्तनोक्ति भाजनम् । पुरारि
    पूर्व नन्दनं सुरारि गर्व चर्वणम् । प्रपञ्च नाश भीषणं धनञ्जयादि भूषणम् । कपोल दानवारणं भजे पुराण वारणम्
    ॥ ॥ नितान्त कान्त दन्त कान्ति मन्तकान्तकात्मजम् । अचिन्त्य रूप मन्तराय कृन्तनम् । हृदन्तरे निरन्तरं
    वसन्तमेव योगिनाम् । तमेकदन्तमेव तं विचिन्तयामि सन्ततम् ॥ ॥ महागणेश पञ्चरत्नमादरेण योऽन्वहम् । प्रजल्पति
    प्रभातके हृदि स्मरण् गणेश्वरम् । अरोगतामदोषतां सुसाहितीं सुपुत्रताम् । समाहितायु मभ्युपैति सोऽचिरात्
    ॥
