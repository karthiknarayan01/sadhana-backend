id: vanshav-iddhikaradurgakavaca
category: kavacha
name:
  english: vanshavṟiddhikaradurgakavaca
  devanagari: वन्शव्ऱिद्धिकरदुर्गाकवच
content:
  english: rinu putra pravakshyami vamshakhyam kavacam shubham | santanavriddhiryatpathanadgarbharaksha
    sada nrinam || 2|| vandhyapi labhate putram kaka vandhya sutairyuta | mrita vatsa suputrasyatsravadgarbha
    sthirapraja || 3|| apushpa pushpini yasya dharanashca sukhaprasuh | kanya praja putrini syadetat stotra
    prabhavatah || 4|| bhutapretadija badha ya badha kuladoshaja | graha badha deva badha badha shatru
    krita ca ya || 5|| bhasmi bhavanti sarvastah kavacasya prabhavatah | sarve roga vinashyanti sarve
    balagrahashca ye || 6|| || atha durga kavacam || om purvam rakshatu varahi cagneyyam ambika svayam
    | dakshine candika rakshennairrityam shavavahini || 1|| varahi pashcime rakshedvayavyam ca maheshvari
    | uttare vaishnavim rakshet ishane simha vahini || 2|| urdhvam tu sharada rakshedadho rakshatu parvati
    | shakambhari shiro rakshenmukham rakshatu bhairavi || 3|| kantham rakshatu camunda hridayam rakshatat
    shiva | ishani ca bhujau rakshet kukshim nabhim ca kalika || 4 || aparna hyudaram rakshetkatim bastim
    shivapriya | uru rakshatu kaumari jaya janudvayam tatha || 5|| gulphau padau sada rakshedbrahmani
    parameshvari | sarvangani sada raksheddurga durgartinashani || 6|| namo devyai mahadevyai durgayai
    satatam namah | putrasaukhyam dehi dehi garbharaksham kurushva nah || 7|| om hrim hrim hrim shrim
    shrim shrim aim aim aim mahakali mahalakshmi mahasarasvati rupayai navakotimurtyai durgayai namah
    || 8|| hrim hrim hrim durgartinashini samtanasaukhyam dehi dehi bandhyatvam mritavatsatvam ca hara
    hara garbharaksham kuru kuru sakalam badham kulajam bahyajam kritamakritam ca nashaya nashaya sarvagatrani
    raksha raksha garbham poshaya poshaya sarvopadravam shoshaya shoshaya svaha || 9|| || phala shrutih
    || anena kavacenangam saptavarabhimantritam | ritusnata jalam pitva bhavet garbhavati dhruvam || 1||
    garbha pata bhaye pitva dridhagarbha prajayate | anena kavacenatha marjitaya nishagame || 2|| sarvabadhavinirmukta
    garbhini syanna samshayah | anena kavaceneha granthitam raktadorakam || 3|| kati deshe dharayanti
    suputrasukha bhagini | asuta putramindranam jayantam yatprabhavatah || 4|| gurupadishtam vamshakhyam
    kavacam tadidam sukhe | guhyadguhyataram cedam na prakashyam hi sarvatah || 5|| dharanat pathanadasya
    vamshacchedo na jayate | bala vinashyamti patanti garbhastatrabalah kashtayutashca vandhyah || 6 ||
    bala grahairbhutaganaishca rogairna yatra dharmacaranam grihe syat || || iti shrijnanabhaskare vamshavriddhikaram
    vamshakavacam sampurnam ||
  devanagari: ृणु पुत्र प्रवक्ष्यामि वंशाख्यं कवचं शुभम् । सन्तानवृद्धिर्यत्पठनाद्गर्भरक्षा सदा नृणाम्
    ॥ २॥ वन्ध्यापि लभते पुत्रं काक वन्ध्या सुतैर्युता । मृत वत्सा सुपुत्रस्यात्स्रवद्गर्भ स्थिरप्रजा ॥
    ३॥ अपुष्पा पुष्पिणी यस्य धारणाश्च सुखप्रसूः । कन्या प्रजा पुत्रिणी स्यादेतत् स्तोत्र प्रभावतः ॥ ४॥
    भूतप्रेतादिजा बाधा या बाधा कुलदोषजा । ग्रह बाधा देव बाधा बाधा शत्रु कृता च या ॥ ५॥ भस्मी भवन्ति सर्वास्ताः
    कवचस्य प्रभावतः । सर्वे रोगा विनश्यन्ति सर्वे बालग्रहाश्च ये ॥ ६॥ ॥ अथ दुर्गा कवचम् ॥ ॐ पुर्वं रक्षतु
    वाराही चाग्नेय्यां अम्बिका स्वयम् । दक्षिणे चण्डिका रक्षेन्नैरृत्यां शववाहिनी ॥ १॥ वाराही पश्चिमे
    रक्षेद्वायव्याम् च महेश्वरी । उत्तरे वैष्णवीं रक्षेत् ईशाने सिंह वाहिनी ॥ २॥ ऊर्ध्वां तु शारदा रक्षेदधो
    रक्षतु पार्वती । शाकंभरी शिरो रक्षेन्मुखं रक्षतु भैरवी ॥ ३॥ कण्ठं रक्षतु चामुण्डा हृदयं रक्षतात् शिवा
    । ईशानी च भुजौ रक्षेत् कुक्षिं नाभिं च कालिका ॥ ४ ॥ अपर्णा ह्युदरं रक्षेत्कटिं बस्तिं शिवप्रिया ।
    ऊरू रक्षतु कौमारी जया जानुद्वयं तथा ॥ ५॥ गुल्फौ पादौ सदा रक्षेद्ब्रह्माणी परमेश्वरी । सर्वाङ्गानि
    सदा रक्षेद्दुर्गा दुर्गार्तिनाशनी ॥ ६॥ नमो देव्यै महादेव्यै दुर्गायै सततं नमः । पुत्रसौख्यं देहि देहि
    गर्भरक्षां कुरुष्व नः ॥ ७॥ ॐ ह्रीं ह्रीं ह्रीं श्रीं श्रीं श्रीं ऐं ऐं ऐं महाकाली महालक्ष्मी महासरस्वती
    रुपायै नवकोटिमूर्त्यै दुर्गायै नमः ॥ ८॥ ह्रीं ह्रीं ह्रीं दुर्गार्तिनाशिनी संतानसौख्यम् देहि देहि
    बन्ध्यत्वं मृतवत्सत्वं च हर हर गर्भरक्षां कुरु कुरु सकलां बाधां कुलजां बाह्यजां कृतामकृतां च नाशय
    नाशय सर्वगात्राणि रक्ष रक्ष गर्भं पोषय पोषय सर्वोपद्रवं शोषय शोषय स्वाहा ॥ ९॥ ॥ फल श्रुतिः ॥ अनेन
    कवचेनाङ्गं सप्तवाराभिमन्त्रितम् । ऋतुस्नात जलं पीत्वा भवेत् गर्भवती ध्रुवम् ॥ १॥ गर्भ पात भये पीत्वा
    दृढगर्भा प्रजायते । अनेन कवचेनाथ मार्जिताया निशागमे ॥ २॥ सर्वबाधाविनिर्मुक्ता गर्भिणी स्यान्न संशयः
    । अनेन कवचेनेह ग्रन्थितं रक्तदोरकम् ॥ ३॥ कटि देशे धारयन्ती सुपुत्रसुख भागिनी । असूत पुत्रमिन्द्राणां
    जयन्तं यत्प्रभावतः ॥ ४॥ गुरूपदिष्टं वंशाख्यम् कवचं तदिदं सुखे । गुह्याद्गुह्यतरं चेदं न प्रकाश्यं
    हि सर्वतः ॥ ५॥ धारणात् पठनादस्य वंशच्छेदो न जायते । बाला विनश्यंति पतन्ति गर्भास्तत्राबलाः कष्टयुताश्च
    वन्ध्याः ॥ ६ ॥ बाल ग्रहैर्भूतगणैश्च रोगैर्न यत्र धर्माचरणं गृहे स्यात् ॥ ॥ इति श्रीज्ञानभास्करे वंशवृद्धिकरं
    वंशकवचं सम्पूर्णम् ॥
