id: yogashikhopanishat
category: upanishad
name:
  english: yogashikhopanishat
  devanagari: योगशिखोपनिषत्
content:
  english: 70|| sada nadanusandhanatsamkshina vasana bhavet | niranjane viliyeta marunmanasi padmaja ||
    71|| yo vai nadah sa vai bindustadvai cittam prakirtitam | nado bindushca cittam ca tribhiraikyam
    prasadayet || 72|| mana eva hi bindushca utpattisthitikaranam | manasotpadyate binduryatha kshiram
    ghritatmakam || 73|| shat cakrani parijnatva pravishetsukhamandalam | pravishedvayumakrishya tathaivordhvam
    niyojayet || 74|| vayum bindum tatha cakram cittam caiva samabhyaset | samadhimekena samamamritam
    yanti yoginah || 75|| yathagnirdarumadhyastho nottishthenmathanam vina | vina cabhyasayogena jnanadipastatha
    nahi || 76|| ghatamadhye yatha dipo bahye naiva prakashate | bhinne tasmin ghate caiva dipajvala ca
    bhasate || 77|| svakayam ghatamityuktam yatha jivo hi tatpadam | guruvakyasamabhinne brahmajnanam
    prakashate || 78|| karnadharam gurum prapya tadvakyam plavavadridham | abhyasavasanashaktya taranti
    bhavasagaram || 79|| ityupanishat | iti yogashikhopanishadi shashtho'dhyayah || 6|| om saha navavatu
    saha nau bhunaktu saha viryam karavavahai | tejasvinavadhitamastu ma vidvishavahai || om shantih shantih
    shantih || om tatsat || iti yogashikhopanishatsamapta || adhikadhyayanaya
  devanagari: ७०॥ सदा नादानुसन्धानात्संक्षीणा वासना भवेत् । निरञ्जने विलीयेत मरुन्मनसि पद्मज ॥ ७१॥ यो
    वै नादः स वै बिन्दुस्तद्वै चित्तं प्रकीर्तितम् । नादो बिन्दुश्च चित्तं च त्रिभिरैक्यं प्रसादयेत् ॥
    ७२॥ मन एव हि बिन्दुश्च उत्पत्तिस्थितिकारणम् । मनसोत्पद्यते बिन्दुर्यथा क्षीरं घृतात्मकम् ॥ ७३॥ षट्
    चक्राणि परिज्ञात्वा प्रविशेत्सुखमण्डलम् । प्रविशेद्वायुमाकृष्य तथैवोर्ध्वं नियोजयेत् ॥ ७४॥ वायुं बिन्दुं
    तथा चक्रं चित्तं चैव समभ्यसेत् । समाधिमेकेन समममृतं यान्ति योगिनः ॥ ७५॥ यथाग्निर्दारुमध्यस्थो नोत्तिष्ठेन्मथनं
    विना । विना चाभ्यासयोगेन ज्ञानदीपस्तथा नहि ॥ ७६॥ घटमध्ये यथा दीपो बाह्ये नैव प्रकाशते । भिन्ने तस्मिन्
    घटे चैव दीपज्वाला च भासते ॥ ७७॥ स्वकायं घटमित्युक्तं यथा जीवो हि तत्पदम् । गुरुवाक्यसमाभिन्ने ब्रह्मज्ञानं
    प्रकाशते ॥ ७८॥ कर्णधारं गुरुं प्राप्य तद्वाक्यं प्लववदृढम् । अभ्यासवासनाशक्त्या तरन्ति भवसागरम् ॥
    ७९॥ इत्युपनिषत् । इति योगशिखोपनिषदि षष्ठोऽध्यायः ॥ ६॥ ॐ सह नाववतु सह नौ भुनक्तु सह वीर्यं करवावहै
    । तेजस्विनवधीतमस्तु मा विद्विषावहै ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ ॐ तत्सत् ॥ इति योगशिखोपनिषत्समाप्ता
    ॥ अधिकाध्ययनाय
