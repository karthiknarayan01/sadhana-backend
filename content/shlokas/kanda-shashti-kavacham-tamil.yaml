id: kanda-shashti-kavacham-tamil
category: stotram
name:
  english: Kanda Shashti Kavacham (Tamil)
content:
  english: kku valvinaipom tunbam pom nènjil padipporku sèlvam palittu kadittongum nishtaiyum kaikudum
    nimalararul kandar shashthi kavacan tanai | kuṟal vènba | amarar idartira amaram purinda kumaran adi
    nènje kuṟi | nul shashthiyai nokka sharavana bhavanar shishtarukkudavum shènkadir velon padamirandil
    panmanic cadangai gitam pada kinkini yada maiya nadanam cèyyum mayil vahananar kaiyil velal ènaikkakkavèn
    ri vandu vara vara velayudhanar varuga varuga varuga mayilon varuga indiran mudala èndishai potra
    mandira vadivel varuga varuga vasavan maruga varuga varuga neshak kuṟamagal ninaivon varuga arimugam
    padaitta ayya varuga niṟidum velavan nittam varuga shiragiri velavan sikkiram varuga sharahana bhavanar
    sadudiyil varuga rahana bhavasha rararara rarara rihana bhavasha riririri ririri vinabhava sharahana
    vira namo nama nibhava sharahana niṟa niṟa niṟèna vashara hanabha varuga varuga asurar kudi kèdutta
    ayya varuga ènnai yalum ilaiyon kaiyil pannirandayudham pashankushamum paranda vili viraindènaik kakka
    velon varuga aiyum kiliyum adaivudan sauvum uyyòli sauvum uyiraiyum kiliyum kiliyum sauvum kilaroliyaiyum
    nilai pètrènmun nittamum òlirum shanmugan niyum taniyòli yòvvum kundaliyam shiva guhan dinam varuga
    arimugamum animudi arim niṟidu nètriyum ninda puruvamum panniru kannum pavalac cèvvayum nannèṟi nètriyil
    navamanic cuttiyum irari sèviyil ilagukundalamum aṟiru tinbuyat tali giya marbil palbushanamum padakkamum
    tarittu nanmani punda navaratna malaiyum muppuri nulum muttani marbum shèppala gudaiya tiruvayi rindiyum
    tuvanda marungil shudaròli pattum navaratnam paditta naṟ tiruvadi yadanil shilambòli mula nga sagagana
    sagagana sagagana sagana mògamòga mògamòga mògamòga mògana naganaga naganaga naganaga nagèna diguguna
    digudigu diguguna diguna rararara rararara rararara rarara riririri riririri riririri ririri dudududu
    dudududu dudududu dududu dagudagu digudigu dangu dingugu vindu vindu mayilon vindu mundu mundu murugavel
    mundu èndanai yalum eragac cèlva maindan vendum varamagil ndudavum lala lala lala veshamum lila lila
    lila vinoda nèn ṟiru vadiyai uridiyèn ṟènnum èntalaivaittun inaiyadi kakka ènnuyirk kuyiram iṟaivan
    kakka panniru vili yal balanai kakka adiyen vadanam ala pòdipunai nètriyai punidavel kakka kadirvel
    irandum kanninai kakka vidisèvi irandum velavar kakka nasigal irandum nalvel kakka peshiya vaydanai
    pèruvel kakka muppattirupal munaivel kakka shèppiya navai cèvvel kakka kannam irandum kadirvel kakka
    ènnilam kalu ttai iniyavel kakka marbai rattina vadivel kakka shèrila mulaimar tiruvel kakka vadivel
    irutol valampèṟa kakka pidarigal irandum pèruvel kakka ala gudan mudugai arulvel kakka palu padinarim
    paruvel kakka vètrivel vayitrai vilangave kakka sitridai ala guṟa cèvvel kakka nanam kayitrai nalvel
    kakka an pèn kuṟikalai ayilvel kakka pittam irandum pèruvel kakka vattakkudattai valvel kakka panaittòdai
    irandum paruvel kakka kanaikkal mula ndal kadirvel kakka aiviral adiyinai arulvel kakka kaigal irandum
    karunai vel kakka mun kaiyirandum muranvel kakka pin kaiyirandum pinnaval irukka navil sarasvati natrunaiyaga
    nabikkamalam nalvel kakka muppal nadiyai munaivel kakka dum ènai èdirvel kakka adiyen vashanam ashaivula
    neram kadugave vandu kanakavel kakka varum pagal tannil vajravel kakka araiyirul tannil anaiyavel
    kakka emattil samattil èdirvel kakka tamadam nikki caturvel kakka kakka kakka kanakavel kakka nokka
    nokka nòdiyil nokka takka takka tadaiyaṟa takka parka parka pavam pòdipada pilli shuniyam pèrumpagaiyagala
    valla bhutam valattiga peygal allaṟ paduttum adanga muniyum pillaigal tinnum pula kòllivay peygalum
    kuṟalaip peygalum pèn galaittòdarum brammaraccadarum adiyanaikkandal alaṟikkalangida irishikatteri
    ittunba shenaiyum èllinum iruttilum èdirpadum annarum kanapushai kòllum kaliyodanaivarum vittankararum
    migupala peygalum tandiyakararum candalargalum èn pèyar shòllavum idivilu n dòdida anaiyadiyinil arumpavaigalum
    punai mayirum pillaigal ènbum nagamum mayirum nilmudi mandaiyum pavaigaludane palakalashattudan manaiyiṟ
    pudaitta vanjanai tanaiyum òttiya pavaiyum òttiya shèrukkum kashum panamum kavudan shorim odumanjanamum
    òruvali p pokkum adiyanaikkandal alaindu kulaindida matrar vancagar vandu vanangida kaladudal ènaik
    kandal kalangida anji nadungida arandu purandida vay vittalaṟi madikèttoda padiyinil muttappashakkayitral
    kattudan angam kadaṟidakkattu katti yuruttu kal kaimuṟiya kattu kattu kadaṟidakkattu muttu muttu muli
    gal pidungida cèkku cèkku cèdil cèdilaga còkku còkku shur ppagai còkku kuttu kuttu kurvadi velal patru
    patru pagalavan tanalèri tanalèri tanalèri tanaladuvaga viduvidu velai vèrundadu oda puliyum nariyum
    punnari nayum èliyum karadiyum inittòdar telum pambum shèyyan puran kadivida vishangal kadittuya rangam
    eṟiya vishangal èlidudan iranga òluppum culukkum òrutalai noyum vadam shayittiyam valippuppittam shulai
    sayangunmam shòkkuc ciṟangu kudaiccal shilandi kudalvip pirudi pakkappilavai padartòdai valai kaduvan
    paduvan kaittal shilandi paṟkuttu aranai paru arai yappum ṟanaikkandal nilla doda niyènakkarulvay
    irel ulagamum ènakkuṟa vaga anum pènnum anaivarum ènakka mannalarasharum magil unnait tudikka un tirunamam
    sharavana bavane shailòli bavane tiripura bavane tigalò li bavane paripura bavane pavamòli bavane
    aritiru maruga amarapadiyai kattuddevargal kadunjirai viduttay kanda guhane kadir velavane kartigai
    mainda kadamba kadambanai idumbanai ali tta iniya vel muruga tanikacalane shankaran pudalva kadirkamattuṟai
    kadirvel muruga pala balakumara avinan kudival giya vela sèndin mamalaiyurim cènkalvaraya shamarapurival
    ṟay èn na irukka yanunaippada ènaittòdarndirukkum èndai muruganai padinen adinen paravashamaga adinen
    nadinen avinan budiyai neshamudan yan nètriyilaniya pashavinaigal patradu ningi unpadam pèṟave unnarulaga
    anbudan rakshi annamum cònnamum mèttamèttaga velayudanar siddipètradiyèn shiṟappudan val ga èn varimaigal
    ninga èttanai kuṟaigal èttanai pilai gal èttanai adiyèn èttanai shèyinum pètravan niguru pòrippadunkadan
    pètraval kuṟamagal pètravalame pillai yèn p piriyamalittu maindan èn midu un manamagil shèy kandar
    shashthi kavacam virumbiya ndadai kalaiyil malaiyil karuttudan nalum acarattudan angam tulakki neshamudan
    òru ninaivaduvagi kandar shashthi kavacam idanai cindai kalangadu diyanippavargal òrunal muppattarirukkòndu
    òdiye jèpittu ugandu niṟaniya ashtadikkulloradangalum vashamay dishai mannarènmar shèyaladaruluvar
    matralarèllam vandu vananguvar navakol magil ndu nanmai yalittidum navamada nènavum nallèli l pèrivar
    ènda nalum irèttay val var kandar kaivelam kavacattadiyai yay kana mèyyay vilangum vili yaṟkana vèrundidum
    peygal pòlla davaraippòdipòdiyakkum nallor ninaivil nadanam puriyum sarva satturu sanka rattadi aṟindènadullam
    ashtalakshmigalil viralakshmikku virundunavaga shura padmavaittunittagai yadanal iruvattel kku uvandamudalitta
    guruparan pala ndai shevadi potri ènaittaduttatkòla èn ṟanadullam meviya vadivurim velava potri devargal
    senapatiye potri kuṟamagal manamagil tiṟamigu divviya dega potri idumba yudane idumba potri kadamba
    potri kanda potri vètci punaiyum vele potri uyargiri kanakasabaikkorarashe mayilnadamiduvòy malaradi
    sharanam sharanam sharanam sharavana bhava om sharanam sharanam shanmuga sharanam ||
  devanagari: क्कु वल्विनैपों तुन्बं पों नॆञ्जिल् पदिप्पोर्कु सॆल्वं पलित्तु कदित्तोङ्गुम् निष्टैयुं कैकूडुं
    निमलररुल् कन्दर् षष्ठि कवचन् तनै । कुऱल् वॆण्बा । अमरर् इडर्तीर अमरं पुरिन्द कुमरन् अडि नॆञ्जे कुऱि
    । नूल् षष्ठियै नोक्क शरवण भवनार् शिष्टरुक्कुदवुं शॆङ्कदिर् वेलोन् पादमिरण्डिल् पन्मणिच् चदङ्गै गीतं
    पाड किङ्किणि याड मैय नडनं चॆय्युं मयिल् वाहननार् कैयिल् वेलाल् ऎनैक्काक्कवॆन् ऋ वन्दु वर वर वेलायुधनार्
    वरुग वरुग वरुग मयिलोन् वरुग इन्दिरन् मुदला ऎण्डिशै पोट्र मन्दिर वडिवेल् वरुग वरुग वासवन् मरुगा वरुग
    वरुग नेशक् कुऱमगल् निनैवोन् वरुग आऋमुगं पडैत्त अय्या वरुग नीऱिडुं वेलवन् नित्तं वरुग शिरगिरि वेलवन्
    सीक्किरं वरुग शरहण भवनार् सडुदियिल् वरुग रहण भवश रररर ररर रिहण भवश रिरिरिरि रिरिरि विणभव शरहण वीरा
    नमो नम निभव शरहण निऱ निऱ निऱॆन वशर हणभ वरुग वरुग असुरर् कुडि कॆडुत्त अय्या वरुग ऎन्नै यालुं इलैयोन्
    कैयिल् पन्निरण्डायुधं पाशाङ्कुशमुं परन्द विलि विरैन्दॆनैक् काक्क वेलोन् वरुग ऐयुं किलियुं अडैवुडन्
    सौवुं उय्यॊलि सौवुं उयिरैयुं किलियुं किलियुं सौवुं किलरोलियैयुं निलै पॆट्रॆन्मुन् नित्तमुं ऒलिरुं
    षण्मुगन् नीयुं तनियॊलि यॊव्वुं कुण्डलियां शिव गुहन् दिनं वरुग आऋमुगमुं अणिमुडि आऋं नीऱिडु नॆट्रियुं
    नीण्ड पुरुवमुं पन्निरु कण्णुं पवलच् चॆव्वायुं नन्नॆऱि नॆट्रियिल् नवमणिच् चुट्टियुं ईराऋ सॆवियिल् इलगुकुण्डलमुं
    आऱिरु तिण्बुयत् तलि गिय मार्बिल् पल्बूषणमुं पदक्कमुं तरित्तु नन्मणि पूण्ड नवरत्न मालैयुं मुप्पुरि
    नूलुं मुत्तणि मार्बुं शॆप्पल गुडैय तिरुवयि ऋन्दियुं तुवण्ड मरुङ्गिल् शुडरॊलि पट्टुं नवरत्नं पदित्त
    नऱ् तिरुवडि यदनिल् शिलम्बॊलि मुल ङ्ग सगगण सगगण सगगण सगण मॊगमॊग मॊगमॊग मॊगमॊग मॊगन नगनग नगनग नगनग नगॆन
    डिगुगुण डिगुडिगु डिगुगुण डिगुण रररर रररर रररर ररर रिरिरिरि रिरिरिरि रिरिरिरि रिरिरि डुडुडुडु डुडुडुडु
    डुडुडुडु डुडुडु डगुडगु डिगुडिगु डङ्गु डिङ्गुगु विन्दु विन्दु मयिलोन् विन्दु मुन्दु मुन्दु मुरुगवेल्
    मुन्दु ऎन्दनै यालुं एरगच् चॆल्व मैन्दन् वेण्डुं वरमगिल् न्दुदवुं लाला लाला लाला वेशमुं लीला लीला लीला
    विनोद नॆन् ऱिरु वडियै उऋदियॆण् ऱॆण्णुं ऎन्तलैवैत्तुन् इणैयडि काक्क ऎन्नुयिर्क् कुयिरां इऱैवन् काक्क
    पन्निरु विलि याल् बालनै काक्क अडियेन् वदनं अल पॊडिपुनै नॆट्रियै पुनिदवेल् काक्क कदिर्वेल् इरण्डुं
    कण्णिनै काक्क विदिसॆवि इरण्डुं वेलवर् काक्क नासिगल् इरण्डुं नल्वेल् काक्क पेशिय वाय्दनै पॆरुवेल् काक्क
    मुप्पत्तिरुपल् मुनैवेल् काक्क शॆप्पिय नावै चॆव्वेल् काक्क कन्नं इरण्डुं कदिर्वेल् काक्क ऎन्निलं कलु
    त्तै इनियवेल् काक्क मार्बै रत्तिन वडिवेल् काक्क शॆरिल मुलैमार् तिरुवेल् काक्क वडिवेल् इरुतोल् वलम्पॆऱ
    काक्क पिडरिगल् इरण्डुं पॆरुवेल् काक्क अल गुडन् मुदुगै अरुल्वेल् काक्क पलु पदिनाऋं परुवेल् काक्क वॆट्रिवेल्
    वयिट्रै विलङ्गवे काक्क सिट्रिडै अल गुऱ चॆव्वेल् काक्क नाणां कयिट्रै नल्वेल् काक्क आण् पॆण् कुऱिकलै
    अयिल्वेल् काक्क पिट्टं इरण्डुं पॆरुवेल् काक्क वट्टक्कुदत्तै वल्वेल् काक्क पणैत्तॊडै इरण्डुं परुवेल्
    काक्क कणैक्काल् मुल न्दाल् कदिर्वेल् काक्क ऐविरल् अडियिनै अरुल्वेल् काक्क कैगल् इरण्डुं करुणै वेल्
    काक्क मुन् कैयिरण्डुं मुरण्वेल् काक्क पिन् कैयिरण्डुं पिन्नवल् इरुक्क नाविल् सरस्वति नट्रुणैयाग नाबिक्कमलं
    नल्वेल् काक्क मुप्पाल् नाडियै मुनैवेल् काक्क दुं ऎनै ऎदिर्वेल् काक्क अडियेन् वशनं अशैवुल नेरं कडुगवे
    वन्दु कनकवेल् काक्क वरुं पगल् तन्निल् वज्रवेल् काक्क अरैयिरुल् तन्निल् अनैयवेल् काक्क एमत्तिल् सामत्तिल्
    ऎदिर्वेल् काक्क तामदं नीक्कि चतुर्वेल् काक्क काक्क काक्क कनकवेल् काक्क नोक्क नोक्क नॊडियिल् नोक्क
    ताक्क ताक्क तडैयऱ ताक्क पार्क पार्क पावं पॊडिपड पिल्लि शूनियं पॆरुम्पगैयगल वल्ल भूतं वलाट्टिग पेय्गल्
    अल्लऱ् पडुत्तुं अडङ्ग मुनियुं पिल्लैगल् तिन्नुं पुल कॊल्लिवाय् पेय्गलुं कुऱलैप् पेय्गलुं पॆण् गलैत्तॊडरुं
    ब्रम्मराच्चदरुं अडियनैक्कण्डाल् अलऱिक्कलङ्गिड इरिशिकाट्टेरि इत्तुन्ब शेनैयुं ऎल्लिनुं इरुट्टिलुं ऎदिर्पडुं
    अण्णरुं कनपूशै कॊल्लुं कालियोडनैवरुं विट्टाङ्काररुं मिगुपल पेय्गलुं तण्डियकाररुं चण्डालर्गलुं ऎन्
    पॆयर् शॊल्लवुं इडिविलु न् दॊडिड आनैयडियिनिल् अरुम्पावैगलुं पूनै मयिरुं पिल्लैगल् ऎन्बुं नगमुं मयिरुं
    नील्मुडि मण्डैयुं पावैगलुडने पलकलशत्तुडन् मनैयिऱ् पुदैत्त वञ्जनै तनैयुं ऒट्टिय पावैयुं ऒट्टिय शॆरुक्कुं
    काशुं पणमुं कावुडन् शोऋं ओदुमञ्जनमुं ऒरुवलि प् पोक्कुं अडियनैक्कण्डाल् अलैन्दु कुलैन्दिड माट्रार्
    वञ्चगर् वन्दु वणङ्गिड कालदूदाल् ऎनैक् कण्डाल् कलङ्गिड अञ्जि नडुङ्गिड अरण्डु पुरण्डिड वाय् विट्टलऱि
    मदिकॆट्टोड पडियिनिल् मुट्टप्पाशक्कयिट्राल् कट्टुडन् अङ्गं कदऱिडक्कट्टु कट्टि युरुट्टु काल् कैमुऱिय
    कट्टु कट्टु कदऱिडक्कट्टु मुट्टु मुट्टु मुलि गल् पिदुङ्गिड चॆक्कु चॆक्कु चॆदिल् चॆदिलाग चॊक्कु चॊक्कु
    शूर् प्पगै चॊक्कु कुत्तु कुत्तु कूर्वडि वेलाल् पट्रु पट्रु पगलवन् तणलॆरि तणलॆरि तणलॆरि तणलदुवाग विडुविडु
    वेलै वॆरुण्डदु ओड पुलियुं नरियुं पुन्नरि नायुं ऎलियुं करडियुं इनित्तॊडर् तेलुं पाम्बुं शॆय्यान् पूरान्
    कडिविड विषङ्गल् कडित्तुय रङ्गं एऱिय विषङ्गल् ऎलिदुडन् इरङ्ग ऒलुप्पुं चुलुक्कुं ऒरुतलै नोयुं वादं शयित्तियं
    वलिप्पुप्पित्तं शूलै सयङ्गुन्मं शॊक्कुच् चिऱङ्गु कुडैच्चल् शिलन्दि कुडल्विप् पिरुदि पक्कप्पिलवै पडर्तॊडै
    वालै कडुवन् पडुवन् कैत्ताल् शिलन्दि पऱ्कुत्तु अरणै परु अरै याप्पुं ऱनैक्कण्डाल् निल्ला दोड नीयॆनक्करुल्वाय्
    ईरेल् उलगमुं ऎनक्कुऱ वाग आणुं पॆण्णुं अनैवरुं ऎनक्का मण्णालरशरुं मगिल् उन्नैत् तुदिक्क उन् तिरुनामं
    शरवण बवने शैलॊलि बवने तिरिपुर बवने तिगलॊ लि बवने परिपुर बवने पवमॊलि बवने अरितिरु मरुगा अमरापदियै कात्तुद्देवर्गल्
    कडुञ्जिरै विडुत्ताय् कन्दा गुहने कदिर् वेलवने कार्तिगै मैन्दा कडम्बा कडम्बनै इडुम्बनै अलि त्त इनिय
    वेल् मुरुगा तणिकाचलने शङ्करन् पुदल्वा कदिर्कामत्तुऱै कदिर्वेल् मुरुगा पल बालकुमारा आविनन् कुडिवाल्
    गिय वेला सॆन्दिन् मामलैयुऋं चॆङ्कल्वराया शमरापुरिवाल् ऱाय् ऎन् ना इरुक्क यानुनैप्पाड ऎनैत्तॊडर्न्दिरुक्कुं
    ऎन्दै मुरुगनै पाडिनेन् आडिनेन् परवशमाग आडिनेन् नाडिनेन् आविनन् बूदियै नेशमुडन् यान् नॆट्रियिलणिय पाशविनैगल्
    पट्रदु नीङ्गि उन्पदं पॆऱवे उन्नरुलाग अन्बुडन् रक्षि अन्नमुं चॊन्नमुं मॆत्तमॆत्ताग वेलायुदनार् सिद्दिपॆट्रडियॆन्
    शिऱप्पुडन् वाल् ग ऎन् वऋमैगल् नीङ्ग ऎत्तनै कुऱैगल् ऎत्तनै पिलै गल् ऎत्तनै अडियॆन् ऎत्तनै शॆयिनुं पॆट्रवन्
    नीगुरु पॊऋप्पदुन्कडन् पॆट्रवल् कुऱमगल् पॆट्रवलामे पिल्लै यॆन् प् पिरियमलित्तु मैन्दन् ऎन् मीदु उन्
    मनमगिल् शॆय् कन्दर् षष्ठि कवचं विरुम्बिय न्ददै कालैयिल् मालैयिल् करुत्तुडन् नालुं आचारत्तुडन् अङ्गं
    तुलक्कि नेशमुडन् ऒरु निनैवदुवागि कन्दर् षष्ठि कवचं इदनै चिन्दै कलङ्गादु दियानिप्पवर्गल् ऒरुनाल् मुप्पत्ताऋरुक्कॊण्डु
    ऒदिये जॆपित्तु उगन्दु नीऱणिय अष्टदिक्कुल्लोरडङ्गलुं वशमाय् दिशै मन्नरॆण्मर् शॆयलदरुलुवर् माट्रलरॆल्लां
    वन्दु वणङ्गुवर् नवकोल् मगिल् न्दु नन्मै यलित्तिडुं नवमद नॆनवुं नल्लॆलि ल् पॆऋवर् ऎन्द नालुं ईरॆट्टाय्
    वाल् वर् कन्दर् कैवेलां कवचत्तडियै याय् काण मॆय्याय् विलङ्गुं विलि याऱ्काण वॆरुण्डिडुं पेय्गल् पॊल्ला
    दवरैप्पॊडिपॊडियाक्कुं नल्लोर् निनैविल् नडनं पुरियुं सर्व सत्तुरु सङ्का रत्तडि अऱिन्दॆनदुल्लं अष्टलक्ष्मिगलिल्
    वीरलक्ष्मिक्कु विरुन्दुणवाग शूर पद्मावैत्तुणित्तगै यदनाल् इरुवत्तेल् क्कु उवन्दमुदलित्त गुरुपरन् पल
    न्दै शेवडि पोट्रि ऎनैत्तडुत्ताट्कॊल ऎन् ऱनदुल्लं मेविय वडिवुऋं वेलवा पोट्रि देवर्गल् सेनापतिये पोट्रि
    कुऱमगल् मनमगिल् तिऱमिगु दिव्विय देगा पोट्रि इडुम्बा युदने इडुम्बा पोट्रि कडम्बा पोट्रि कन्दा पोट्रि
    वॆट्चि पुनैयुं वेले पोट्रि उयर्गिरि कनकसबैक्कोररशे मयिल्नडमिडुवॊय् मलरडि शरणं शरणं शरणं शरवण भव ॐ
    शरणं शरणं षण्मुगा शरणम् ॥
