id: shaninamastuti
category: stotram
name:
  english: shaninamastuti
  devanagari: शनिनामस्तुति
content:
  english: shrishaninamastutih krodam nilanjanaprakhyam nilavarnasamasrajam | chayamartandasambhutam namasyami
    shanaishcaram || namo'rkaputraya shanaishcaraya niharavarnanjanamecakaya | shrutva rahasyam bhavakamadashca
    phalaprado me bhava suryaputra || namo'stu pretarajaya krishnadehaya vai namah | shanaishcaraya kruraya
    shuddhabuddhipradayine || || phalshrutih || ya ebhirnamabhih stauti tasya tushto bhavamyaham | madiyam
    tu bhayam tasya svapne'pi na bhavishyati || || shribhavishyapurane shrishaninamastutih sampurna ||
  devanagari: श्रीशनिनामस्तुतिः क्रोडं नीलाञ्जनप्रख्यम् नीलवर्णसमस्रजम् । छायामार्तण्डसम्भूतं नमस्यामि
    शनैश्चरम् ॥ नमोऽर्कपुत्राय शनैश्चराय नीहारवर्णाञ्जनमेचकाय । श्रुत्वा रहस्यं भवकामदश्च फलप्रदो मे भव
    सूर्यपुत्र ॥ नमोऽस्तु प्रेतराजाय कृष्णदेहाय वै नमः । शनैश्चराय क्रूराय शुद्धबुद्धिप्रदायिने ॥ ॥ फल्श्रुतिः
    ॥ य एभिर्नामभिः स्तौति तस्य तुष्टो भवाम्यहम् । मदीयं तु भयं तस्य स्वप्नेऽपि न भविष्यति ॥ ॥ श्रीभविष्यपुराणे
    श्रीशनिनामस्तुतिः सम्पूर्णा ॥
