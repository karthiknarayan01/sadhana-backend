id: kyts-jata-4-1-yunjanah-prathamam-manah-krishna-yajurveda-taittiriya-samhita
category: stotram
name:
  english: KYTS Jata 4.1 Yunjanah Prathamam Manah - Krishna Yajurveda Taittiriya Samhita
content:
  english: yu~njano yunjanah prathamam | mana statvaya tatvaya mano mana statvaya | tatvaya savita savita
    tatvaya tatvaya savita | savita dhiyo dhiyah savita savita dhiyah | rjyoti ragni magni rnicayya nicayya
    jyoti nicayya prithivyah prithivya nicayya nicayya prithivyah | prithivya adhyadhi prithivyah prithivya
    adhi | a 'bhara dabharada 'bharat | yuktvaya manasa manasa yuktvaya yuktvaya manasa | nmanasa manasa
    devan | yato dhiya dhiya yato yato dhiya | jyotih karishyatah karishyato jyoti rjyotih karishyatah
    | ssavita savita karishyatah karishyata savita pra pra savita savita pra | pra suvati suvati pra pra
    suvati | nthsuvati suvati tan | yuktena manasa manasa yuktena yuktena manasa | mmanasa manasa vayam
    | ndevasya devasya vayam rdevasya devasya savituh | suvargeyaya shaktyai shaktyai suvargeyaya suvargeyaya
    shaktyai suvargeyayeti suvah shaktya iti shaktyai yunjate mano mano yunjate yunjate manah | mana utota
    mano mana uta | uta yunjate yunjata utota yunjate | yunjate dhiyo dhiyo yunjate yunjate dhiyah | dhiyo
    vipra vipra dhiyo dhiyo viprah vipra viprasya viprasya vipra vipra viprasya | viprasya brihato brihato
    viprasya viprasya brihatah | brihato vipashcito vipashcito brihato brihato vipashcitah | vipashcita
    iti vipashcitah | vi hotra hotra vi vi hotrah hotra dadhe dadhe hotra hotra dadhe | ddadhe dadhe vayunavit
    | vayunavi deka eko vayuna vidvayunavi dekah | vayunaviditi vayuna eka idi deka eka it | mahi devasya
    devasya mahi mahi devasya | rdevasya devasya savituh | savituh parishtutih parishtuti ssavituh parishtutih
    | parishtutiriti pari mbrahma brahma vam mbrahma brahma purvyam | shshloka vi vi shlokah shloka yanti
    yanti shloka yanti pathya pathya yanti yanti pathya pathyeve va pathya pathyeva | ssura ive va surah
    shrinvanti vishve vishve shrinvanti shrinvanti vishve vishve amritasya mritasya vishve vishve amritasya
    | amritasya putrah putra amritasya mritasya putrah | putra a putrah putra a | ye dhamani dhamani ye
    ye dhamani | dhamani divyani divyani dhamani dhamani divyani | divyani tasthu stasthu rdivyani divyani
    tasthuh | tasthuriti tasthuh | ya~sya yasya prayana prayana manvanu prayana an vanye anye an van vanye
    | anya idi danye anya it | deva devasya devasya deva deva devasya | ndevasya devasya mahimana mahimana
    marcato arcato mahimana mmahimana marcatah | arcata ityarcatah | yah parthivani parthivani yo yah
    parthivani | parthivani vimame vimame parthivani parthivani vimame | vimame sa sa vimame vimame sah
    | etasho rajagmsi rajag syetasha etasho rajagmsi | rajagmsi devo devo rajagmsi rajagmsi devah | ssavita
    savita devo deva savita mahitvana mahitvana savita savita mahitvana | savitah pra pra savita pra suva
    suva pra pra suva | ya~jnagm suva suva yajnam | pra suva suva pra pra suva | ya~jnapatigm suva suva
    yajnapatim | || mbhagaya bhagaya yajnapatim yajnapatimiti yajna bhagaya divyo divyo bhagaya bhagaya
    divyah | divyo gandharvo gandharvo divyo divyo gandharvah | gandharva iti gandharvah | nketapuh ketapuh
    keta nah punatu punatu no nah punatu | punatu vaco vacah punatu punatu vacah | rvaco vaca spatih |
    vaca madyadya vacam adya svadati svada tyadyadya svadati | ssvadati svadati nah | no deva deva no
    no deva | rdeva deva savitah | pra suva suva pra pra suva | ndevayuvagm suva suva devayuva devayuvagm
    sakhividagm sakhivida ndevayuvagm sakhivida sakhividagm satrajitagm satrajitagm sakhividagm sakhividagm
    satrajita ndhanajitagm satrajitagm satrajita satrajitamiti satra dhanajitagm suvarjitagm suvarjita
    ndhanajitagm suvarjita suvarjitamiti suvah rica stomagg stoma mrica r stomagm sagm sagg stomagg stomagm
    sam | sa mardhaya rdhaya sagm sa mardhaya | ardhaya gayatrena gayatrena rdhaya rdhaya gayatrena |
    gayatrena rathantaragm rathantara ngayatrena gayatrena rathantaram | dgayatravartani gayatravartani
    briha gayatravartaniti gayatra devasya tva tva devasya devasya tva | savituh prasave prasave savitu
    ssavituh prasave | mbahubhya mashvino rashvino mpushnah pushno bahubhya bahubhyamiti bahu mpushnah
    pushno hasta ngayatrena gayatrena hasta gayatrena chandasa chandasa gayatrena gayatrena chandasa |
    '' cchandasa chandasa | dade 'ngirasva dangirasva ddade dade 'ngirasvat | angirasva dabhri rabhri
    rangirasva dangirasva dabhrih | abhri rasyasya bhri rabhri rasi | rnari rasyasi narih | asi prithivyah
    prithivya asyasi prithivyah | tprithivyah prithivya sadhastha dagni magnigm sadhastha thsadhastha
    dagnim | mpurishya magni magni purishya mangirasva dangirasva mpurishya mangirasvat | angirasvada
    'ngirasva dangirasvada | bhara traishtubhena traishtubhena bhara bhara traishtubhena | traishtubhena
    tva tva traishtubhena traishtubhena tva | tva chandasa chandasa tva tva chandasa | '' cchandasa chandasa
    | dade 'ngirasva dangirasva ddade dade 'ngirasvat | rbabhri rangirasva dangirasva babhri rasyasi babhri
    rnari rasyasi narih | ntvaya tvaya vayam | vayagm sadhasthe sadhasthe vayam sadhastha a sadhasthe
    sadhastha a | a 'gni magni ma 'gnim | agnigm shakema shake magni magnigm shakema | nkhanitugm shakema
    shakema khanitum | njagatena jagatena purishya jagatena tva tva jagatena jagatena tva | tva chandasa
    chandasa tva tva chandasa | '' cchandasa chandasa | dade 'ngirasva dangirasva ddade dade 'ngirasvat
    | angirasva ddhaste haste 'ngirasva dangirasva ddhaste hasta adhaya dhaya haste hasta adhaya | adhaya
    savita savita ''dhaya dhaya savita | thsavita savita bibhrat | bibhra dabhri mabhri abhrigm hiranyayigm
    hiranyayi mabhri mabhrigm hiranyayi hiranyayimiti hiranyayi rjyoti staya taya jyotih | jyoti rajasra
    majasra rjyoti rajasram | ajasra midi dajasra majasra mit | idagni magni midi dagnim | nkhatvi khatvyagni
    magni khatvi no nah khatvi khatvi nah | bhara nushtubhena nushtubhena bhara bharanushtubhena | anushtubhena
    tva tva ''nushtubhena nushtubhena tva | anushtubhenetyanu tva chandasa chandasa tva tva chandasa |
    '' cchandasa chandasa | dade 'ngirasva dangirasva ddade dade 'ngirasvat | angirasvadityangirasvat
    | || nnima mima magribhnann | nrashanagm rashana magribhna tasya rashanagm rashana mritasya | ritasya
    purve purva ritasya r purva ayu shyayushi purve purva ayushi | ayushi vidatheshu vidathe shvayu shyayushi
    vidatheshu | vidatheshu kavya kavya vidatheshu vidatheshu kavya | taya deva deva staya taya devah
    | suta ma sutagm suta ma | rbabhuvura babhuvuh | babhuvur ritasya r thsaragm saragm sama sara marapa
    ntyarapanti saragm sara marapanti | a drava drava drava | ndrava drava varishtham | varishtha manvanu
    varishtham divi te te divi divi te te janma janma te te janma | njanma janma paramam | parama mantarikshe
    antarikshe parama mparama mantarikshe | rnabhi rantarikshe antarikshe nabhih | rnabhih prithivyam
    | prithivya madhyadhi prithivya ryoni radhyadhi yonih | yunjathagm rasabhagm rasabham yu~njathagm
    rasabham | yu~vagm rasabhagm rasabham yame vrishanvasu vrishanvasu yame yame vrishanvasu | vrishanvasu
    iti vrishan mbharanta magni magni bharanta masmayu masmayu mbharanta masmayum | yo~geyoge yogeyoge
    tavastaram | va~jevaje vajevaje tavastara vajevaje havamahe havamahe vajevaje vajevaje havamahe |
    havamaha iti havamahe | sakhaya indra mindragm sakhaya indra mutaya utaya indra mindra mutaye praturvanniti
    pra nnihi hyavakramann | nnashasti rashasti ravakrama ashasti rudrasya rudrasya shasti rashasti rudrasya
    | rudrasya ganapatya drudrasya rudrasya ganapatyat | ganapatyaditi gana urvantariksha mantariksha
    muru antariksha manvan vantariksha mantariksha manu | anvihi hyan van vihi | ihi svastigavyuti ssvastigavyuti
    rihihi svastigavyutih | svastigavyuti rabhaya nyabhayani svastigavyuti ssvastigavyuti rabhayani |
    svastigavyutiriti svasti abhayani krinvan krinva nnabhaya nyabhayani krinvann | krinvanniti krinvann
    | pushna sayuja sayuja pushna pushna sayuja sayuja saha saha sayuja sayuja saha | tprithivyah prithivya
    sadhastha dagni magnigm sadhastha thsadhastha dagnim | mpurishya magni magni purishya mangirasva dangirasva
    mpurishya mangirasvat | angi rasva daccha ccha ngirasva dangirasva daccha | acche hihya cchacchehi
    | ihyagni magni mihi hyagnim | mpurishya magni magni purishya mangirasva dangirasva mpurishya mangirasvat
    | angirasva daccha ccha ngirasva dangirasva daccha | acche ma imo acchacche mah | imo 'gni magni mima
    imo 'gnim | mpurishya magni magni purishya mangirasva dangirasva mpurishya mangirasvat | dbharishyamo
    bharishyamo 'ngirasva dangirasva bharishyamo 'gni magni mbharishyamo bharishyamo 'gnim | mpurishya
    magni magni purishya mangirasva dangirasva mpurishya mangirasvat | dbharamo bharamo 'ngirasva dangirasva
    bharama iti bharamah | anvagni ragni ranvanvagnih | agni rushasa mushasa magni ragni rushasa ushasa
    magra magra mushasa mushasa magra agra makhya dakhya dagra magra makhyat | akhya dan van vakhya dakhya
    danu | anvahan yahanyanvan vahani | ahani prathamah prathamo 'ha nyahani prathamah | prathamo jataveda
    jatavedah prathamah prathamo jatavedah | jataveda iti jata anu suryasya suryasya nvanu suryasya |
    suryasya purutra purutra suryasya suryasya purutra | || purutra ca ca purutra purutra ca | rashmi
    nanvanu rashmi anu dyavaprithivi dyavaprithivi anvanu dyavaprithivi | dyavaprithivi a dyavaprithivi
    dyavaprithivi a | dyavaprithivi iti dyava a tatana tatana tatana | agatya vaji vajyagatya gatya vaji
    | vajyaddhvano addhvano vaji vajyaddhvanah | ssarva addhvano addhvana mridho vi vi mridho mridho vi
    | vi dhunute dhunute vi vi dhunute | dhunuta iti dhunute | agnigm sadhasthe sadhasthe 'gni magnigm
    sadhasthe sadhasthe mahati mahati sadhasthe sadhasthe mahati | mahati cakshusha cakshusha mahati mahati
    cakshusha | cakshusha ni ni cakshusha cakshusha ni | ni cikishate cikishate ni ni cikishate | cikishata
    iti cikishate | nnakramya kramya vajinn | prithivi magni magni mprithivi magnim | agni micche cchagni
    magni miccha | iccha ruca rucecche ntvagm ruca ruca tvam | bhumya vritvaya vritvaya bhumya bhumya
    vritvaya | vritvaya no no vritvaya vritvaya nah | no bruhi bruhi no no bruhi | bruhi bruhi yatah |
    yatah khanama khanama yato yatah khanama | nkhanama khanama tam | mprithivi prithivi prishtha prithivi
    sadhasthagm sadhastha mprithivi prithivi sadhastha sadhastha matma ''tma sadhasthagm sadhastha matma
    | atma 'ntariksha mantariksha matma ''tma 'ntariksham | antarikshagm samudra ssamudro antariksha mantarikshagm
    samudrah | samudra ste te samudra ryoni ste te yonih | vikhyaya cakshusha cakshusha vikhyaya vikhyaya
    cakshusha | ncakshusha cakshusha tvam | abhi tishtha tishthabhyabhi tishtha | tishtha pritanyatah
    pritanyata stishtha tishtha pritanyatah | || pritanyata iti pritanyatah | krama mahate mahate krama
    krama mahate | mahate saubhagaya saubhagaya mahate mahate saubhagaya | saubhagaya sma dasma thsaubhagaya
    saubhagaya smat | asma dasthana dasthana dasma dasma dasthana ddravinoda dravinoda asthana dasthana
    dravinoda vajin ndravinoda dravinoda vajinn | dravinoda iti dravinah vajinniti vajinn | syama sumatau
    sumatau syama syama sumatau | sumatau prithivyah prithivya ssumatau sumatau prithivyah | prithivya
    agni magni mprithivyah prithivya agnim | nkhanishyantah khanishyanto agni magni khanishyanta upastha
    upasthe khanishyantah khanishyanta upasthe upasthe asya asya upastha upasthe asyah | udakrami dakrami
    dudu dakramit | ddravinoda dravinoda akrami dakrami dravinoda vaji vaji dravinoda dravinoda vaji |
    dravinoda iti dravinah vajyarva 'rva vaji vajyarva arva 'ka raka rarva 'rva 'kah | sa lokam ~lokagm
    sa sa lokam | lokagm sukritagm sukritam ~lokam ~lokagm sukritam | mprithivyah prithivya ssukritagm
    sukrita prithivya iti prithivyah | tatah khanema khanema tata statah khanema | khanema supratikagm
    supratika nkhanema khanema supratikam | supratika magni magnigm supratikagm supratika magnim | ssuva
    ragni magnigm suvah | suvo ruhana ruhana ruhana adhyadhi ruhana ruhana adhi | adhi nake nake adhyadhi
    nake naka uttama uttame nake naka uttame | rdevi rapo apo devih | upa srija srijopopa srija | ssrija
    srija madhumatih | madhumati rayakshma yayakshmaya madhumati rmadhumati rayakshmaya | ayakshmaya prajabhyah
    prajabhyo 'yakshmaya yakshmaya prajabhyah | njihata muduj jihatam | jihata moshadhaya oshadhayo jihata
    ssupippala oshadhaya oshadhaya supippala iti su jigharmyagni magni njigharmi jigharmyagnim | || mmanasa
    manasa 'gni magni manasa ghritena ghritena manasa manasa ghritena | ghritena pratikshyanta nghritena
    ghritena pratikshyanta mbhuvanani bhuvanani pratikshyanta pratikshyantamiti prati bhuvanani vishva
    vishva bhuvanani bhuvanani vishva ntirashca tirashca prithu tirashca vayasa vayasa tirashca tirashca
    vayasa | va~yasa vayasa brihanta vyacishtha manna mannam annagm rabhasagm rabhasa manna mannagm rabhasam
    | vi~danagm rabhasagm rabhasam vidanamiti vidanam | tva jigharmi jigharmi tva tva jigharmi | jigharmi
    vacasa vacasa jigharmi jigharmi vacasa | vacasa ghritena ghritena vacasa vacasa ghritena | ghritena
    rakshasa 'rakshasa ghritena ghritena rakshasa arakshasa manasa manasa 'rakshasa 'rakshasa manasa |
    nmanasa manasa tat | taj jushasva jushasva ta jushasveti jushasva | ssprihayadvarno maryashri maryashririti
    marya sprihayadvarno agniragni ssprihayadvarno agnih | sprihayadvarna iti sprihayat nabhimrishe abhimrishe
    na nabhimrishe abhimrishe tanuva tanuva 'bhimrishe abhimrishe tanuva hrishana stanuva tanuva jar rvajapatih
    pari pari vajapatih | kavi ragni ragnih kavih kavi ragnih | havyani havya nyagni ragnir havya nyakrami
    dakrami ddhavyani havya nyakramit | akramidityakramit | dratnani ratnani dadha ratnani dashushe dashushe
    ratnani ratnani dashushe dashusha iti dashushe pari tva tva pari pari tva | tva 'gne 'gne tva tva
    'gne | mpura magne 'gne pura vipragm sahasya sahasya vipram sahasya dhimahi dhimahi sahasya sahasya
    dhimahi | ndivedive divedive dhrishadvarna dhrishadvarnamiti dhrishat divedive bhettara ndivedive
    divedive bhettara divediva iti dive mbhanguravato bhanguravato bhettara bhanguravata iti bhangura
    tva magne agne tva rdyubhi ragne agne dyubhih | tva mashushukshani rashushukshani stva ntva mashushukshanih
    | ashushukshani stva ntva mashushukshani rashushukshani stvam | tva madbhyo adbhya stva ntva madbhyo
    adbhya stvam | tva mashmano ashmana stva ashmana spari paryashmano ashmana spari | tva moshadhibhya
    oshadhibhya stva ntva moshadhibhya oshadhibhya stvam | nnripate nripate nrina nripate jayase jayase
    nripate nripate jayase | rjayase jayase shucih | shuciriti shucih | || devasya tva tva devasya devasya
    tva | savituh prasave prasave savitu ssavituh prasave | mbahubhya mashvino rashvino mpushnah pushno
    bahubhya bahubhyamiti bahu mpushnah pushno hasta mprithivyah prithivya hasta ssadhasthe sadhasthe
    prithivyah prithivya sadhasthe 'gni magnigm sadhasthe sadhasthe 'gnim | mpurishya magni magni purishya
    mangirasva dangirasva mpurishya mangirasvat | tkhanami khana myangirasva dangirasva ntva tva jyotishmanta
    tva 'gne agne tva tva 'gne | agne supratikagm supratika magne agne supratikam | supratika majasrenajasrena
    supratikagm supratika majasrena | ajasrena bhanuna bhanuna 'jasrena jasrena bhanuna mbhanuna bhanuna
    didyanam | didyanamiti didyanam | mprajabhyah prajabhyah shivagm shiva prajabhyo 'higmsanta mahigmsanta
    mprajabhyah prajabhyo 'higmsantam | mprithivyah prithivya ahigmsanta mahigmsanta ssadhasthe sadhasthe
    prithivyah prithivya sadhasthe 'gni magnigm sadhasthe sadhasthe 'gnim | mpurishya magni magni purishya
    mangirasva dangirasva mpurishya mangirasvat | tkhanami khana myangirasva dangirasva prishtha masyasi
    prishtha ssapratha asyasi saprathah sapratha ururu sapratha urvagni magni muru dbharishya dagni magni
    bharishya daparavapishtha maparavapishtha dbharishya daparavapishtham | aparavapishthamityapara mmaho
    maho vardhamanam ndivo divah pushkara divo matraya matraya divo divo matraya | matraya varina varina
    matraya matraya varina | varina prathasva prathasva varina varina prathasva | prathasveti prathasva
    | sharma ca ca sharma sharma ca | sstha shca ca sthah | stho varma varma stha varma ca ca varma varma
    ca | sstha shca ca sthah | stho acchidre acchidre stha sstho acchidre | acchidre bahule bahule acchidre
    acchidre bahule | acchidre ityacchidre | bahule ubhe ubhe bahule bahule ubhe | bahule iti bahule |
    vya~casvati vyacasvati sam | vyacasvati iti vyacasvati | mpurishya magni magni purishyamiti purishya
    vasathagm suvarvida suvarvida vasatham va~sathagm suvarvida suvarvida samici samici suvarvida suvarvida
    samici samici urasorasa samici samici urasa | urasa tmana tmano rasorasa tmana agni manta ranta ragni
    magni mantah | rbharishyanti bharishyanti anta ranta bharishyanti jyotishmanta mbharishyanti bharishyanti
    jyotishmantam | bharishyanti iti bharishyanti jyotishmanta majasra majasra njyotishmanta majasram
    | ajasra midi dajasra majasra mit | 'syasi purishyah purishyo 'si | asi vishvabhara vishvabhara asyasi
    vishvabharah | vishvabhara iti vishva atharva tva tva 'tharva 'tharva tva | tva prathamah prathama
    stva rnish prathamah prathamo nih | amantha dagne agne 'mantha damantha dagne | tva magne agne tva
    tpushkaradagne agne pushkarat | pushkara dadhyadhi pushkara adhyatharva 'tharva 'dhyadhya tharva |
    rniratharva 'tharva nih | niramanthata manthata ni amanthatetyamanthata | murdhno vishvasya vishvasya
    murdhno murdhno vishvasya | vishvasya vaghato vaghato vishvasya vishvasya vaghatah | vaghata iti vaghatah
    | u tva tva vu tva | daddhyam mrishir rishi rishih putrah putra rishir rishih putrah | putra idha
    idhe putrah putra idhe | idhe atharvano atharvana idha idhe atharvanah | || atharvana ityatharvanah
    | vritrahanamiti vritra purandaramiti puram u tva tva vu tva | tva pathyah pathya stva pathyo vrisha
    vrisha pathyah pathyo vrisha sa midha idhe sagm sa midhe | ndasyuhantama midha idhe dasyuhantamam
    | dasyuhantamamiti dasyu dhananjayagm ranerane ranerane dhananjaya ndhananjayagm ranerane | ssve sve
    hoto hota sva u vu sve sva u | u loke loka u vu loke | shcikitvan ~loke loke cikitvan | nthsadaya
    sadaya cikitvag ya~jnagm sadaya sadaya yajnam | yajnagm sukritasya sukritasya yajnam ya~jnagm sukritasya
    | sukritasya yonau yonau sukritasya sukritasya yonau havisha havisha deva havisha yajasi yajasi havisha
    havisha yajasi | yajasyagne 'gne yajasi yajasyagne dbriha dagne 'gne brihat | dyajamane yajamane briha
    yajamane vayo vayo yajamane yajamane vayah | vayo dha dha vayo vayo dhah | ni hota hota ni ni hota
    hota hotrishadane hotrishadane hota hota hotrishadane | hotrishadane vidano vidano hotrishadane hotrishadane
    vidanah | hotrishadana iti hotri vidana stvesha stvesho vidano vidana stveshah | ntvesha stvesho didivan
    | didivagm asada dasada ndidivagm asadat | thsudakshah sudaksho asada dasada rvasishtho vasishtho
    adabdhavratapramati radabdhavratapramati adabdhavrata pramatirityadabdhavrata ssahasrambharo vasishtho
    vasishtha sahasrambhara iti sahasram shucijihvo agni ragni shshucijihvo agnih | shucijihva iti shuci
