id: kathopanishad-chapter-1-valli-2
category: stotram
name:
  english: Kathopanishad - Chapter 1, Valli 2
content:
  english: '''nyadutaiva preyaste ubhe nanarthe purusham sinitah| tayo shshreya adadanasya sadhurbhavati
    hiyate ''rthadya u preyo vrinite || || shreyashca preyashca manushyametastau samparitya vivinakti
    dhirah| shreyo hi dhiro ''bhi preyaso vrinite preyo mando yogakshemadvrinite || mpriyanpriyarupamshca
    kamanabhidhyayannaciketo ''tyasrakshih| naitam srinkam vi~ttamayimavapto yasya mmajjanti bahavo manushyah
    || || duramete viparite vishuci avidya ya ca vidyeti jnata| vidyabhipsina mmanye na tva kama bahavo
    || avidyayamantare vartamana ndhirah panditammanyamanah| dandramyamanah pariyanti mudha andhenaiva
    niyamana yathandhah || || na samparayah pratibhati bala vi~ttamohena mudham| ayam lo~ko nasti para
    iti mani punah punarvashamapadyate me || || shravanayapi bahubhiryo na labhya nna vidyuh| ashcaryo
    vakta kushalo ''sya labdhashcaryo jnata kushalanushishtah || || na narenavarena prokta esha suvijneyo
    bahudha cintyamanah| ananyaprokte gatiratra nastyaniyan hyatarkyamanupramanat || || naisha tarkena
    matirapaneya proktanyenaiva sujnanaya preshtha| ya ssatyadhritirbatasi tvadrina no bhuyannaciketah
    prashta || || janamyaham shevadhirityanitya nna hyadhruvaih prapyate hi dhruva ntat| tato maya naciketashcito
    ''gniranityairdravyaih praptavanasmi nityam || nkratoranantyamabhayasya param| stomamaha ndrishtva
    dhritya dhiro naciketo mpuranam| adhyatmayogadhigamena deva || etacchrutva samparigrihya martyah pravrihya
    dharmyamanumetamapya| sa modate modaniyam hi labdhva vivritam sadma naciketasa || anyatra dharmadanyatradharmadanyatrasmatkritakritat|
    anyatra bhutacca bhavyacca yattatpashyasi tadvada || || sarve veda yatpadamamananti tapamsi sarvani
    ca yadvadanti| yadicchanto brahmacarya ncaranti tatte padam sangrahena bravimyomityetat || mbrahma
    etaddhyevakshara mparam| etaddhyevakshara njnatva yo yadicchati tasya tat || || etadalambanam shreshthametadalambana
    njnatva brahmaloke mahiyate || || na jayate mriyate va vipashcinnaya nkutashcinna babhuva kashcit|
    ajo nitya mpurano na hanyate hanyamane sharire || || hanta cenmanyate hantum hatashcenmanyate hatam|
    ubhau tau na vijanito nayam hanti na hanyate || || anoraniyanmahato mahiyanatmasya jantornihito guhayam|
    tamakratuh pashyati vitashoko dhatuprasadanmahimanamatmanah || vra~jati shayano yati sarvatah| kasta
    || ashariram sharireshvanavastheshvavasthitam| mahantam mmatva dhiro na shocati || || nayamatma pravacanena
    labhyo na medhaya na bahuna shrutena| yamevaisha vrinute tena labhyastasyaisha atma vivrinute tanum
    svam || || navirato dushcaritannashanto nasamahitah| nashantamanaso vapi prajnanenainamapnuyat ||
    || yasya brahma ca kshatra nca ubhe bhavata odanah| mrityuryasyopasecana nka ittha veda yatra sah
    ||'
  devanagari: ऽन्यदुतैव प्रेयस्ते उभे नानार्थे पुरुषं सिनीतः। तयो श्श्रेय आददानस्य साधुर्भवति हीयते ऽर्थाद्य
    उ प्रेयो वृणीते ॥ ॥ श्रेयश्च प्रेयश्च मनुष्यमेतस्तौ सम्परीत्य विविनक्ति धीरः। श्रेयो हि धीरो ऽभि प्रेयसो
    वृणीते प्रेयो मन्दो योगक्षेमाद्वृणीते ॥ म्प्रियान्प्रियरूपांश्च कामानभिध्यायन्नचिकेतो ऽत्यस्राक्षीः।
    नैतां सृङ्कां विँत्तमयीमवाप्तो यस्या म्मज्जन्ति बहवो मनुष्याः ॥ ॥ दूरमेते विपरीते विषूची अविद्या या
    च विद्येति ज्ञाता। विद्याभीप्सिन म्मन्ये न त्वा कामा बहवो ॥ अविद्यायामन्तरे वर्तमाना न्धीराः पण्डितम्मन्यमानाः।
    दन्द्रम्यमाणाः परियन्ति मूढा अन्धेनैव नीयमाना यथान्धाः ॥ ॥ न साम्परायः प्रतिभाति बाल विँत्तमोहेन मूढम्।
    अयं लोँको नास्ति पर इति मानी पुनः पुनर्वशमापद्यते मे ॥ ॥ श्रवणायापि बहुभिर्यो न लभ्य न्न विद्युः।
    आश्चर्यो वक्ता कुशलो ऽस्य लब्धाश्चर्यो ज्ञाता कुशलानुशिष्टः ॥ ॥ न नरेणावरेण प्रोक्त एष सुविज्ञेयो
    बहुधा चिन्त्यमानः। अनन्यप्रोक्ते गतिरत्र नास्त्यणीयान् ह्यतर्क्यमणुप्रमाणात् ॥ ॥ नैषा तर्केण मतिरापनेया
    प्रोक्तान्येनैव सुज्ञानाय प्रेष्ठ। या स्सत्यधृतिर्बतासि त्वादृङ नो भूयान्नचिकेतः प्रष्टा ॥ ॥ जानाम्यहं
    शेवधिरित्यनित्य न्न ह्यध्रुवैः प्राप्यते हि ध्रुव न्तत्। ततो मया नाचिकेतश्चितो ऽग्निरनित्यैर्द्रव्यैः
    प्राप्तवानस्मि नित्यम् ॥ ङ्क्रतोरानन्त्यमभयस्य पारम्। स्तोममह न्दृष्ट्वा धृत्या धीरो नचिकेतो म्पुराणम्।
    अध्यात्मयोगाधिगमेन देव ॥ एतच्छ्रुत्वा सम्परिगृह्य मर्त्यः प्रवृह्य धर्म्यमणुमेतमाप्य। स मोदते मोदनीयं
    हि लब्ध्वा विवृतं सद्म नचिकेतस ॥ अन्यत्र धर्मादन्यत्राधर्मादन्यत्रास्मात्कृताकृतात्। अन्यत्र भूताच्च
    भव्याच्च यत्तत्पश्यसि तद्वद ॥ ॥ सर्वे वेदा यत्पदमामनन्ति तपांसि सर्वाणि च यद्वदन्ति। यदिच्छन्तो ब्रह्मचर्य
    ञ्चरन्ति तत्ते पदं सङ्ग्रहेण ब्रवीम्योमित्येतत् ॥ म्ब्रह्म एतद्ध्येवाक्षर म्परम्। एतद्ध्येवाक्षर ञ्ज्ञात्वा
    यो यदिच्छति तस्य तत् ॥ ॥ एतदालम्बनं श्रेष्ठमेतदालम्बन ञ्ज्ञात्वा ब्रह्मलोके महीयते ॥ ॥ न जायते म्रियते
    वा विपश्चिन्नाय ङ्कुतश्चिन्न बभूव कश्चित्। अजो नित्य म्पुराणो न हन्यते हन्यमाने शरीरे ॥ ॥ हन्ता चेन्मन्यते
    हन्तुं हतश्चेन्मन्यते हतम्। उभौ तौ न विजानीतो नायं हन्ति न हन्यते ॥ ॥ अणोरणीयान्महतो महीयानात्मास्य
    जन्तोर्निहितो गुहायाम्। तमक्रतुः पश्यति वीतशोको धातुप्रसादान्महिमानमात्मनः ॥ व्रँजति शयानो याति सर्वतः।
    कस्त ॥ अशरीरं शरीरेष्वनवस्थेष्ववस्थितम्। महान्तं म्मत्वा धीरो न शोचति ॥ ॥ नायमात्मा प्रवचनेन लभ्यो
    न मेधया न बहुना श्रुतेन। यमेवैष वृणुते तेन लभ्यस्तस्यैष आत्मा विवृणुते तनूं स्वाम् ॥ ॥ नाविरतो दुश्चरितान्नाशान्तो
    नासमाहितः। नाशान्तमानसो वापि प्रज्ञानेनैनमाप्नुयात् ॥ ॥ यस्य ब्रह्म च क्षत्र ञ्च उभे भवत ओदनः। मृत्युर्यस्योपसेचन
    ङ्क इत्था वेद यत्र सः ॥
