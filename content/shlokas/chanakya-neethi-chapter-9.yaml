id: chanakya-neethi-chapter-9
category: stotram
name:
  english: Chanakya Neethi - Chapter 9
content:
  english: muktimicchasi cettata vishayanvishavattyaja | kshamarjavadayashaucam satyam piyushavatpiba
    || || parasparasya marmani ye bhashante naradhamah | ta eva vilayam yanti valmikodarasarpavat || ||
    gandhah suvarne phalamikshudande nakari pushpam khalu candanasya | vidvandhanadhyashca nripashcirayuh
    dhatuh pura ko'pi na buddhido'bhut || || sarvaushadhinamamrita pradhana sarveshu saukhyeshvashanam
    pradhanam | sarvendriyanam nayanam pradhanam sarveshu gatreshu shirah pradhanam || || duto na sancarati
    khe na calecca varta purvam na jalpitamidam na ca sangamo'sti | vyomni sthitam ravishashigrahanam
    prashastam janati yo dvijavarah sa katham na vidvan || || vidyarthi sevakah panthah kshudharto bhayakatarah
    | bhandari pratihari ca sapta suptanprabodhayet || || ahim nripam ca shardulam vriddham ca balakam
    tatha | parashvanam ca murkham ca sapta suptanna bodhayet || || ardhadhitashca yairvedastatha shudrannabhojanah
    | te dvijah kim karishyanti nirvisha iva pannagah || || yasminrushte bhayam nasti tushte naiva dhanagamah
    | nigraho'nugraho nasti sa rushtah kim karishyati || || nirvishenapi sarpena kartavya mahati phana
    | vishamastu na capyastu ghatatopo bhayankarah || || pratardyutaprasangena madhyahne striprasangatah
    | ratrau cauraprasangena kalo gacchanti dhimatam || || svahastagrathita mala svahastaghrishtacandanam
    | svahastalikhitam stotram shakrasyapi shriyam haret || || ikshudandastilah shudrah kanta hema ca
    medini | candanam dadhi tambulam mardanam gunavardhanam || || dahyamanah sutivrena nicah parayasho'gnina
    ashaktastatpadam gantum tato nindam prakurvate | daridrata dhirataya virajatekuvastrata shubhrataya
    virajate kadannata coshnataya virajate kurupata shilataya virajate ||
  devanagari: मुक्तिमिच्छसि चेत्तात विषयान्विषवत्त्यज । क्षमार्जवदयाशौचं सत्यं पीयूषवत्पिब ॥ ॥ परस्परस्य
    मर्माणि ये भाषन्ते नराधमाः । त एव विलयं यान्ति वल्मीकोदरसर्पवत् ॥ ॥ गन्धः सुवर्णे फलमिक्षुदण्डे नाकरि
    पुष्पं खलु चन्दनस्य । विद्वान्धनाढ्यश्च नृपश्चिरायुः धातुः पुरा कोऽपि न बुद्धिदोऽभूत् ॥ ॥ सर्वौषधीनाममृता
    प्रधाना सर्वेषु सौख्येष्वशनं प्रधानम् । सर्वेन्द्रियाणां नयनं प्रधानं सर्वेषु गात्रेषु शिरः प्रधानम्
    ॥ ॥ दूतो न सञ्चरति खे न चलेच्च वार्ता पूर्वं न जल्पितमिदं न च सङ्गमोऽस्ति । व्योम्नि स्थितं रविशाशिग्रहणं
    प्रशस्तं जानाति यो द्विजवरः स कथं न विद्वान् ॥ ॥ विद्यार्थी सेवकः पान्थः क्षुधार्तो भयकातरः । भाण्डारी
    प्रतिहारी च सप्त सुप्तान्प्रबोधयेत् ॥ ॥ अहिं नृपं च शार्दूलं वृद्धं च बालकं तथा । परश्वानं च मूर्खं
    च सप्त सुप्तान्न बोधयेत् ॥ ॥ अर्धाधीताश्च यैर्वेदास्तथा शूद्रान्नभोजनाः । ते द्विजाः किं करिष्यन्ति
    निर्विषा इव पन्नगाः ॥ ॥ यस्मिन्रुष्टे भयं नास्ति तुष्टे नैव धनागमः । निग्रहोऽनुग्रहो नास्ति स रुष्टः
    किं करिष्यति ॥ ॥ निर्विषेणापि सर्पेण कर्तव्या महती फणा । विषमस्तु न चाप्यस्तु घटाटोपो भयङ्करः ॥ ॥
    प्रातर्द्यूतप्रसङ्गेन मध्याह्ने स्त्रीप्रसङ्गतः । रात्रौ चौरप्रसङ्गेन कालो गच्छन्ति धीमताम् ॥ ॥ स्वहस्तग्रथिता
    माला स्वहस्तघृष्टचन्दनम् । स्वहस्तलिखितं स्तोत्रं शक्रस्यापि श्रियं हरेत् ॥ ॥ इक्षुदण्डास्तिलाः शूद्राः
    कान्ता हेम च मेदिनी । चन्दनं दधि ताम्बूलं मर्दनं गुणवर्धनम् ॥ ॥ दह्यमानाः सुतीव्रेण नीचाः परयशोऽग्निना
    अशक्तास्तत्पदं गन्तुं ततो निन्दां प्रकुर्वते । दरिद्रता धीरतया विराजतेकुवस्त्रता शुभ्रतया विराजते
    कदन्नता चोष्णतया विराजते कुरूपता शीलतया विराजते ॥
