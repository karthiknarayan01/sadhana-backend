id: candipathah
category: stotram
name:
  english: candipathah
  devanagari: चण्डीपाठः
content:
  english: '||shri candipatha || ||om shri devaih namah || ||atha camdipathah || ya devi sarvabhuteshu
    vishnumayeti shabdita | namastasyai namastasyai namastasyai namo namah ||5'
  devanagari: ।।श्री चण्डीपाठ ।। ।।ॐ श्री देवैः नमः ।। ।।अथ चंडीपाठः ।। या देवी सर्वभूतेषु विष्णुमायेति
    शब्दिता । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ।।५
meaning: {}
