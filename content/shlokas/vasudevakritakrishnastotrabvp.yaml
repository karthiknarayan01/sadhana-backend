id: vasudevakritakrishnastotrabvp
category: stotram
name:
  english: vasudevakritakrishnastotraBVP
  devanagari: वसुदेवकृतकृष्णस्तोत्रBVP
content:
  english: tvamatindriyamavyaktamaksharam nirgunam vibhum | dhyanasadhyam ca sarvesham paramatmanamishvaram
    || 1|| svecchamayam sarvarupam sveccharupadharam param | nirliptam paramam brahma bijarupam sanatanam
    || 2|| sthulatsthulataram praptamatisukshmamadarshanam | sthitam sarvasharireshu sakshirupamadrishyakam
    || 3|| shariravantam sagunamashariram gunotkaram | prakritim prakritisham ca prakritam prakriteh param
    || 4|| sarvesham sarvarupam ca sarvantakaramavyayam | sarvadharam niradharam nirvyuham staumi kim
    vibhum || 5|| anantah stavane'shakto'shakta devi sarasvati | yam va stotumashaktashca pancavaktrah
    shadananah || 6|| caturmukho vedakarta yam stotumakshamah sada | ganesho na samarthashca yogindranam
    gurorguruh || 7|| rishayo devatashcaiva munindramanumanavah | svapne teshamadrishyam ca tvamevam kim
    stuvanti te || 8|| shrutayah stavane'shaktah kim stuvanti vipashcitah | vihayaivam shariram ca balo
    bhavitumarhasi || 9|| vasudevakritam stotram trisandhyam yah pathennarah | bhaktim dasyamavapnoti
    shrikrishnacaranambuje || 10|| vishishtam putram labhate haridasam gunanvitam | sankatam nistaretturnam
    shatrubhiteh pramucyate || 11|| || iti shri brahmavaivartamahapurane vasudevakritam shrikrishnastotram
    sampurnam ||
  devanagari: त्वामतीन्द्रियमव्यक्तमक्षरं निर्गुणं विभुम् । ध्यानासाध्यं च सर्वेषां परमात्मानमीश्वरम्
    ॥ १॥ स्वेच्छामयं सर्वरूपं स्वेच्छारूपधरं परम् । निर्लिप्तं परमं ब्रह्म बीजरूपं सनातनम् ॥ २॥ स्थूलात्स्थूलतरं
    प्राप्तमतिसूक्ष्ममदर्शनम् । स्थितं सर्वशरीरेषु साक्षिरूपमदृश्यकम् ॥ ३॥ शरीरवन्तं सगुणमशरीरं गुणोत्करं
    । प्रकृतिं प्रकृतीशं च प्राकृतं प्रकृतेः परम् ॥ ४॥ सर्वेशं सर्वरूपं च सर्वान्तकरमव्ययम् । सर्वाधारं
    निराधारं निर्व्यूहं स्तौमि किं विभुम् ॥ ५॥ अनन्तः स्तवनेऽशक्तोऽशक्ता देवी सरस्वती । यं वा स्तोतुमशक्तश्च
    पञ्चवक्त्रः षडाननः ॥ ६॥ चतुर्मुखो वेदकर्ता यं स्तोतुमक्षमः सदा । गणेशो न समर्थश्च योगीन्द्राणां गुरोर्गुरुः
    ॥ ७॥ ऋषयो देवताश्चैव मुनीन्द्रमनुमानवाः । स्वप्ने तेषामदृश्यं च त्वामेवं किं स्तुवन्ति ते ॥ ८॥ श्रुतयः
    स्तवनेऽशक्ताः किं स्तुवन्ति विपश्चितः । विहायैवं शरीरं च बालो भवितुमर्हसि ॥ ९॥ वसुदेवकृतं स्तोत्रं
    त्रिसन्ध्यं यः पठेन्नरः । भक्तिं दास्यमवाप्नोति श्रीकृष्णचरणाम्बुजे ॥ १०॥ विशिष्टं पुत्रं लभते हरिदासं
    गुणान्वितम् । सङ्कटं निस्तरेत्तूर्णं शत्रुभीतेः प्रमुच्यते ॥ ११॥ ॥ इति श्री ब्रह्मवैवर्तमहापुराणे
    वसुदेवकृतं श्रीकृष्णस्तोत्रं सम्पूर्णम् ॥
