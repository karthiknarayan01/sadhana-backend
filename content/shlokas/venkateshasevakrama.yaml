id: venkateshasevakrama
category: stotram
name:
  english: venkateshasevakrama
  devanagari: वेन्कटेशसेवाक्रम
content:
  english: nandashrubhiraplutan | pulakancitagatramshca putabhavanmahatmanah || 61|| santanadhanarajyashrisampadadivararthinah
    | labdhva varam tatasturnamishtalapaparanapi || 62|| sarvanmahabhagavatan sampashyeyam punahpunah
    | tato venkatanayakyah sthanam drishtva tatahparam || 63|| anamya campakatarum tannamankitavithikam
    | pradakshinaparassarvam pashyeyam ca kritanjalih || 64|| shalimudgatiladinam shalastatra sahasrashah
    | sarvasampatsamriddhashca pakashala manoramah || 65|| svamipushkarinitirtham drishtva''camya tatahparam
    | yamuneyabhidham divyam malyagaram manoharam || 66|| gopinam ramanam tatra venunadavinodinam | suvarnamantapam
    caiva narayanagirim tatha || 67|| balipitham punargatva pratyagdvaram ca campakam | baddhanjalistatah
    pashyanprasadanparamadbhutan || 68|| payasannairgudannaishca shuddhairodanarashibhih | dadhikshirajyasampannairmrishtannairvividhodanaih
    || 69|| apupaih svadubhirhridyaih shalipishtopapaditaih | sugandhairgoghritaih pakvaih prabhutagudasammitaih
    || 70|| prithukairgudasammishraissajirakamaricakaih | kandamulaphalaishcaiva vyanjanairvividhairapi
    || 71|| sampurnam pakashalam ca sampravishyatha sannatah | shriyam tatra sthitam devim shrinivasamanahpriyam
    || 72|| pranameyam tadajnapto bhajeyam yagashalikam | divyam tato ratnamayam shrimahamanimantapam
    || 73|| tatra shayyagriham ramyam tatrastham devamacyutam | shriya devya dharanya ca sevitam parshvayossada
    || 74|| utsavarhamudarangamujjvalayudhabhushanam | pranipatya prasannatma paramanandamapnuyam || 75||
    tatah paritya tam dhanyo vastragaram maharddhimat | vahanani maharhani vimanam canatastatah || 76||
    chatracamarakosham ca shrayeyam sainyanayakam | tato ramanujacaryam prapannakulashekharam || 77||
    aprakritam vimanam ca anandanilayahvayam | pranamya tadanujnatah pranamannriharim tatah || 78|| pradakshinaparo
    bhutva pakshirajam trayimayam | paramanandajanakam pashyeyam pushpamantapam || 79|| pravishya pakshirajam
    ca bhajeyam dvarapalakau | tatastatra vicitrani ratnani vividhani ca || 80|| vahanani maharhani bhushanani
    sahasrashah | divyambaranyanekani kshaumapitambarani ca || 81|| suvarnaraupyakhandani dhanani vividhani
    ca | gajamshca pashusanghamshca chatravyajanacamaraih || 82|| samastadeshajatani vastunyanyanyanekashah
    | shrivenkateshaprityartham sarvadeshanivasibhih || 83|| sarvan samarpitan pashyannupaharamshca sannidhau
    | atmasvarupanugunamapi shrishamanahpriyam || 84|| dravyam vyaktincidtulamupaharam samarpya ca | pranaman
    paraya bhaktya bhajeyam kritakrityatam || 85|| tato ramanujacaryam puraskritya yatishvaram | shrivenkatacaladhisham
    shrinidhim karunanidhim || 86|| asmadbhagyaparipakamakhilabhishtadayinam | natham samastajagatam natham
    nah kuladaivatam || 87|| mataram pitaram bandhum bhrataram suhridam gurum | asmatkuladhanam bhogyamacaryakuladarshitam
    || 88|| sheshacalashiroratnam shrinivasam paratparam | mahaniyam param brahma vandishiya punahpunah
    || 89|| pashyan raman samuttishthamstuvannrityan punahpunah | pulakancitagatrashca bhaveyam pranjalistatah
    || 90|| dvarapalabhyanujnatah kripaya cavalokitah | kathancitpravishan bhito mahamantapamantara ||
    91|| pashyan harim prasannatma prapnuyamardhamantapam | tasmindhanurdharam ramam saumitrimapi janakim
    || 92|| hanumantam ca sugrivamangadam dautyalakshanam | vishvaksenam vihangeshamanantam canatastatah
    || 93|| upasritya ca sopanam kulashekharanama
  devanagari: नन्दाश्रुभिराप्लुतान् । पुलकाञ्चितगात्रांश्च पूतभावान्महात्मनः ॥ ६१॥ सन्तानधनराज्यश्रीसम्पदादिवरार्थिनः
    । लब्ध्वा वरं ततस्तूर्णमिष्टालापपरानपि ॥ ६२॥ सर्वान्महाभागवतान् सम्पश्येयं पुनःपुनः । ततो वेङ्कटनायक्याः
    स्थानं दृष्ट्वा ततःपरम् ॥ ६३॥ आनम्य चम्पकतरुं तन्नामाङ्कितवीथिकाम् । प्रदक्षिणपरस्सर्वं पश्येयं च
    कृताञ्जलिः ॥ ६४॥ शालिमुद्गतिलादीनां शालास्तत्र सहस्रशः । सर्वसम्पत्समृद्धाश्च पाकशाला मनोरमाः ॥ ६५॥
    स्वामिपुष्करिणीतीर्थं दृष्ट्वाऽऽचम्य ततःपरम् । यामुनेयाभिधं दिव्यं माल्यागारं मनोहरम् ॥ ६६॥ गोपीनां
    रमणं तत्र वेणुनादविनोदिनम् । सुवर्णमण्टपं चैव नारायणगिरिं तथा ॥ ६७॥ बलिपीठं पुनर्गत्वा प्रत्यग्द्वारं
    च चाम्पकम् । बद्धाञ्जलिस्ततः पश्यन्प्रासादान्परमाद्भुतान् ॥ ६८॥ पायसान्नैर्गुडान्नैश्च शुद्धैरोदनराशिभिः
    । दधिक्षीराज्यसम्पन्नैर्मृष्टान्नैर्विविधोदनैः ॥ ६९॥ अपूपैः स्वादुभिर्हृद्यैः शालिपिष्टोपपादितैः ।
    सुगन्धैर्गोघृतैः पक्वैः प्रभूतगुडसंमितैः ॥ ७०॥ पृथुकैर्गुडसंमिश्रैस्सजीरकमरीचकैः । कन्दमूलफलैश्चैव
    व्यञ्जनैर्विविधैरपि ॥ ७१॥ सम्पूर्णं पाकशालां च सम्प्रविश्याथ सन्नतः । श्रियं तत्र स्थितां देवीं श्रीनिवासमनःप्रियाम्
    ॥ ७२॥ प्रणमेयं तदाज्ञप्तो भजेयं यागशालिकाम् । दिव्यं ततो रत्नमयं श्रीमहामणिमण्टपम् ॥ ७३॥ तत्र शय्यागृहं
    रम्यं तत्रस्थं देवमच्युतम् । श्रिया देव्या धरण्या च सेवितं पार्श्वयोस्सदा ॥ ७४॥ उत्सवार्हमुदाराङ्गमुज्ज्वलायुधभूषणम्
    । प्रणिपत्य प्रसन्नात्मा परमानन्दमाप्नुयाम् ॥ ७५॥ ततः परीत्य तं धन्यो वस्त्रागारं महर्द्धिमत् । वाहनानि
    महार्हाणि विमानं चानतस्ततः ॥ ७६॥ छत्रचामरकोशं च श्रयेयं सैन्यनायकम् । ततो रामानुजाचार्यं प्रपन्नकुलशेखरम्
    ॥ ७७॥ अप्राकृतं विमानं च आनन्दनिलयाह्वयम् । प्रणम्य तदनुज्ञातः प्रणमन्नृहरिं ततः ॥ ७८॥ प्रदक्षिणपरो
    भूत्वा पक्षिराजं त्रयीमयम् । परमानन्दजनकं पश्येयं पुष्पमण्टपम् ॥ ७९॥ प्रविश्य पक्षिराजं च भजेयं द्वारपालकौ
    । ततस्तत्र विचित्राणि रत्नानि विविधानि च ॥ ८०॥ वाहनानि महार्हाणि भूषणानि सहस्रशः । दिव्याम्बराण्यनेकानि
    क्षौमपीताम्बराणि च ॥ ८१॥ सुवर्णरौप्यखण्डानि धनानि विविधानि च । गजांश्च पशुसङ्घांश्च छत्रव्यजनचामरैः
    ॥ ८२॥ समस्तदेशजातानि वस्तून्यन्यान्यनेकशः । श्रीवेङ्कटेशप्रीत्यर्थं सर्वदेशनिवासिभिः ॥ ८३॥ सर्वान्
    समर्पितान् पश्यन्नुपहारांश्च सन्निधौ । आत्मस्वरूपानुगुणमपि श्रीशमनःप्रियम् ॥ ८४॥ द्रव्यं व्यक्तिञ्चिद्तुलमुपहारं
    समर्प्य च । प्रणमन् परया भक्त्या भजेयं कृतकृत्यताम् ॥ ८५॥ ततो रामानुजाचार्यं पुरस्कृत्य यतीश्वरम्
    । श्रीवेङ्कटाचलाधीशं श्रीनिधिं करुणनिधिम् ॥ ८६॥ अस्मद्भाग्यपरीपाकमखिलाभीष्टदायिनम् । नाथं समस्तजगतां
    नाथं नः कुलदैवतम् ॥ ८७॥ मातरं पितरं बन्धुं भ्रातरं सुहृदं गुरुम् । अस्मत्कुलधनं भोग्यमाचार्यकुलदर्शितम्
    ॥ ८८॥ शेषाचलशिरोरत्नं श्रीनिवासं परात्परम् । महनीयं परं ब्रह्म वन्दिषीय पुनःपुनः ॥ ८९॥ पश्यन् रमन्
    समुत्तिष्ठंस्तुवन्नृत्यन् पुनःपुनः । पुलकाञ्चितगात्रश्च भवेयं प्राञ्जलिस्ततः ॥ ९०॥ द्वारपालाभ्यनुज्ञातः
    कृपया चावलोकितः । कथञ्चित्प्रविशन् भीतो महामण्टपमन्तरा ॥ ९१॥ पश्यन् हरिं प्रसन्नात्मा प्राप्नुयामर्धमण्टपम्
    । तस्मिन्धनुर्धरं रामं सौमित्रिमपि जानकीम् ॥ ९२॥ हनूमन्तं च सुग्रीवमङ्गदं दौत्यलक्षणम् । विष्वक्सेनं
    विहङ्गेशमनन्तं चानतस्ततः ॥ ९३॥ उपसृत्य च सोपानं कुलशेखरनाम
