id: rajabhihkritamshrikrishnastotram
category: stotram
name:
  english: rajabhihkritamshrikrishnastotram
  devanagari: राजभिःकृतंश्रीकृष्णस्तोत्रम्
content:
  english: rajabhih kritam shrikrishnastotram rajana ucuh | namaste devadevesha prapannartiharavyaya |
    prapannan pahi nah krishna nirvinnan ghorasamsriteh || 8|| nainam nathanvasuyamo magadham madhusudana
    | anugraho yadbhavato rajnam rajyacyutirvibho || 9|| rajyaishvaryamadonnaddho na shreyo vindate nripah
    | tvanmayamohito'nitya manyate sampado'calah || 10|| mrigatrishnam yatha bala manyanta udakashayam
    | evam vaikarikim mayamayukta vastu cakshate || 11|| vayam pura shrimadanashtadrishtayo jigishayasya
    itaretaraspridhah | ghnantah prajah sva atinirghrinah prabho mrityum purastvaviganayya durmadah ||
    12|| ta eva krishnadya gabhiraramhasa durantaviryena vicalitah shriyah | kalena tanva bhavato'nukampaya
    vinashtadarpashcaranau smarama te || 13|| atho na rajyam mrigatrishnirupitam dehena shashvatpatata
    rujam bhuva | upasitavyam sprihayamahe vibho kriyaphalam pretya ca karnarocanam || 14|| tam nah samadishopayam
    yena te caranabjayoh | smritiryatha na viramedapi samsaratamiha || 15|| krishnaya vasudevaya haraye
    paramatmane | pranatakleshanashaya govindaya namo namah || 16|| iti shrimadbhagavatamahapurane dashamaskandhe
    uttarardhe trisaptatitamadhyayantargatam jarasandhabandhananmuktaih rajabhih kritam shrikrishnastotram
    samaptam | bhagavatapurana | adhyaya 10
  devanagari: राजभिः कृतं श्रीकृष्णस्तोत्रम् राजान ऊचुः । नमस्ते देवदेवेश प्रपन्नार्तिहराव्यय । प्रपन्नान्
    पाहि नः कृष्ण निर्विण्णान् घोरसंसृतेः ॥ ८॥ नैनं नाथान्वसूयामो मागधं मधुसूदन । अनुग्रहो यद्भवतो राज्ञां
    राज्यच्युतिर्विभो ॥ ९॥ राज्यैश्वर्यमदोन्नद्धो न श्रेयो विन्दते नृपः । त्वन्मायामोहितोऽनित्या मन्यते
    सम्पदोऽचलाः ॥ १०॥ मृगतृष्णां यथा बाला मन्यन्त उदकाशयम् । एवं वैकारिकीं मायामयुक्ता वस्तु चक्षते ॥
    ११॥ वयं पुरा श्रीमदनष्टदृष्टयो जिगीषयास्या इतरेतरस्पृधः । घ्नन्तः प्रजाः स्वा अतिनिर्घृणाः प्रभो मृत्युं
    पुरस्त्वाविगणय्य दुर्मदाः ॥ १२॥ त एव कृष्णाद्य गभीररंहसा दुरन्तवीर्येण विचालिताः श्रियः । कालेन तन्वा
    भवतोऽनुकम्पया विनष्टदर्पाश्चरणौ स्मराम ते ॥ १३॥ अथो न राज्यं मृगतृष्णिरूपितं देहेन शश्वत्पतता रुजां
    भुवा । उपासितव्यं स्पृहयामहे विभो क्रियाफलं प्रेत्य च कर्णरोचनम् ॥ १४॥ तं नः समादिशोपायं येन ते चरणाब्जयोः
    । स्मृतिर्यथा न विरमेदपि संसरतामिह ॥ १५॥ कृष्णाय वासुदेवाय हरये परमात्मने । प्रणतक्लेशनाशाय गोविन्दाय
    नमो नमः ॥ १६॥ इति श्रीमद्भागवतमहापुराणे दशमस्कन्धे उत्तरार्धे त्रिसप्ततितमाध्यायान्तर्गतं जरासन्धबन्धनान्मुक्तैः
    राजभिः कृतं श्रीकृष्णस्तोत्रं समाप्तम् । भागवतपुराण । अध्याय १०
