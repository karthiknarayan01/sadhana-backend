id: devaihkritam1shrilakshmistotram
category: stotram
name:
  english: devaihkritam1shrilakshmistotram
  devanagari: देवैःकृतं१श्रीलक्ष्मीस्तोत्रम्
content:
  english: 100|| vicitrakshaumadharinyai prithushronyai namo namah | pakvabilvaphalapinatungastanyai namo
    namah || 101|| suraktapadmapatrabhakarapadatale shubhe | suratnangadakeyurakancinupurashobhite | yakshakardamasamliptasarvange
    katakojjvale || 102|| mangalyabharanaishcitrairmuktaharairvibhushite | tatankairavatamsaishca shobhamanamukhambuje
    || 103|| padmahaste namastubhyam prasida harivallabhe | rigyajuhsamarupayai vidyayai te namo namah
    || 104|| prasidasmankripadrishtipatairalokayabdhije | ye drishtaste tvaya brahmarudrendratvam samapnuyuh
    || 105|| iti shriskandapurane vaishnavakhande venkatacalamahatmye navamadhyayantargatam devaih kritam
    shrilakshmistotram samaptam | skandapurana | vaishnavakhanda | venkatacalakhanda | adhyaya 9
  devanagari: १००॥ विचित्रक्षौमधारिण्यै पृथुश्रोण्यै नमो नमः । पक्वबिल्वफलापीनतुङ्गस्तन्यै नमो नमः ॥ १०१॥
    सुरक्तपद्मपत्राभकरपादतले शुभे । सुरत्नाङ्गदकेयूरकाञ्चीनूपुरशोभिते । यक्षकर्दमसंलिप्तसर्वाङ्गे कटकोज्ज्वले
    ॥ १०२॥ माङ्गल्याभरणैश्चित्रैर्मुक्ताहारैर्विभूषिते । ताटङ्कैरवतंसैश्च शोभमानमुखाम्बुजे ॥ १०३॥ पद्महस्ते
    नमस्तुभ्यं प्रसीद हरिवल्लभे । ऋग्यजुःसामरूपायै विद्यायै ते नमो नमः ॥ १०४॥ प्रसीदास्मान्कृपादृष्टिपातैरालोकयाब्धिजे
    । ये दृष्टास्ते त्वया ब्रह्मरुद्रेन्द्रत्वं समाप्नुयुः ॥ १०५॥ इति श्रीस्कन्दपुराणे वैष्णवखण्डे वेङ्कटाचलमाहात्म्ये
    नवमाध्यायान्तर्गतं देवैः कृतं श्रीलक्ष्मीस्तोत्रं समाप्तम् । स्कन्दपुराण । वैष्णवखण्ड । वेङ्कटाचलखण्ड
    । अध्याय ९
