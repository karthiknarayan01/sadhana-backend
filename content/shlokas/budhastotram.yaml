id: budhastotram
category: stotram
name:
  english: budhastotram
  devanagari: बुधस्तोत्रम्
content:
  english: budhastotram atha budhastotram | asya shribudhastotramahamantrasya vasishtha rishih | anushtupchandah
    | budho devata | budhaprityarthe jape viniyogah | dhyanam | bhujaishcaturbhirvaradabhayasigadam vahantam
    sumukham prashantam | pitaprabham candrasutam suredhyam simhe nishannam budhamashrayami || pitambarah
    pitavapuh pitadhvajarathasthitah | piyusharashmitanayah patu mam sarvada budhah || 1|| simhavaham
    siddhanutam saumyam saumyagunanvitam | somasunum suraradhyam sarvadam saumyamashraye || 2|| budham
    buddhipradataram banabanasanojjvalam | bhadrapradam bhitiharam bhaktapalanamashraye || 3|| atreyagotrasanjatamashritartinivaranam
    | aditeyakularadhyamashusiddhidamashraye || 4|| kalanidhitanujatam karunarasavaridhim | kalyanadayinam
    nityam kanyarashyadhipam bhaje || 5|| mandasmitamukhambhojam manmathayutasundaram | mithunadhishamanagham
    mrigankatanayam bhaje || 6|| caturbhujam carurupam caracarajagatprabhum | carmakhadgadharam vande
    candragrahatanubhavam || 7|| pancasyavahanagatam pancapatakanashanam | pitagandham pitamalyam budham
    budhanutam bhaje || 8|| budhastotramidam guhyam vasishthenoditam pura | yah pathecchrinuyadvapi sarvabhishtamavapnuyat
    || 9|| iti budhastotram sampurnam |
  devanagari: बुधस्तोत्रम् अथ बुधस्तोत्रम् । अस्य श्रीबुधस्तोत्रमहामन्त्रस्य वसिष्ठ ऋषिः । अनुष्टुप्छन्दः
    । बुधो देवता । बुधप्रीत्यर्थे जपे विनियोगः । ध्यानम् । भुजैश्चतुर्भिर्वरदाभयासिगदं वहन्तं सुमुखं प्रशान्तम्
    । पीतप्रभं चन्द्रसुतं सुरेढ्यं सिम्हे निषण्णं बुधमाश्रयामि ॥ पीताम्बरः पीतवपुः पीतध्वजरथस्थितः । पीयूषरश्मितनयः
    पातु मां सर्वदा बुधः ॥ १॥ सिंहवाहं सिद्धनुतं सौम्यं सौम्यगुणान्वितम् । सोमसूनुं सुराराध्यं सर्वदं
    सौम्यमाश्रये ॥ २॥ बुधं बुद्धिप्रदातारं बाणबाणासनोज्ज्वलम् । भद्रप्रदं भीतिहरं भक्तपालनमाश्रये ॥ ३॥
    आत्रेयगोत्रसञ्जातमाश्रितार्तिनिवारणम् । आदितेयकुलाराध्यमाशुसिद्धिदमाश्रये ॥ ४॥ कलानिधितनूजातं करुणारसवारिधिम्
    । कल्याणदायिनं नित्यं कन्याराश्यधिपं भजे ॥ ५॥ मन्दस्मितमुखाम्भोजं मन्मथायुतसुन्दरम् । मिथुनाधीशमनघं
    मृगाङ्कतनयं भजे ॥ ६॥ चतुर्भुजं चारुरूपं चराचरजगत्प्रभुम् । चर्मखड्गधरं वन्दे चन्द्रग्रहतनूभवम् ॥ ७॥
    पञ्चास्यवाहनगतं पञ्चपातकनाशनम् । पीतगन्धं पीतमाल्यं बुधं बुधनुतं भजे ॥ ८॥ बुधस्तोत्रमिदं गुह्यं वसिष्ठेनोदितं
    पुरा । यः पठेच्छृणूयाद्वापि सर्वाभीष्टमवाप्नुयात् ॥ ९॥ इति बुधस्तोत्रं सम्पूर्णम् ।
