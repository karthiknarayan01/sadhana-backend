id: mahisha
category: stotram
name:
  english: mahisha
  devanagari: महिश
content:
  english: vigataparamabhage sannidhayadarena | tadanucari karomi pritaye bhaktibhajam bhagavati padapadme
    padyapushpanjalim te || 3|| kenaite racitah kuto na nihitah shumbhadayo durmadah kenaite tava palita
    iti hi tat prashne kimacakshmahe | brahmadya api shankitah svavishaye yasyah prasadavadhi prita sa
    mahishasurapramathini cchindyadavadyani me || 4|| patu shristu caturbhuja kimu caturbahormahaujanbhujan
    dhatte'shtadashadha hi karanagunah karye gunarambhakah | satyam dikpatidantisankhyabhujabhricchambhuh
    svaymbhuh svayam dhamaikapratipattaye kimathava patum dashashtau dishah || 5|| pritya'shtadashasammiteshu
    yugapaddvipeshu datum varan tratum va bhayato bibharshi bhagavatyashtadashaitan bhujan | yadva'shtadashadha
    bhujamstu bibhritah kali sarasvatyubhe militvaikamihanayoh prathayitum sa tvam rame raksha mam ||
    6|| chandah || ayi girinandini nanditamedini vishvavinodini nandanute
  devanagari: विगतपरमभागे सन्निधायादरेण । तदनुचरि करोमि प्रीतये भक्तिभाजां भगवति पदपद्मे पद्यपुष्पाञ्जलिं
    ते ॥ ३॥ केनैते रचिताः कुतो न निहिताः शुम्भादयो दुर्मदाः केनैते तव पालिता इति हि तत् प्रश्ने किमाचक्ष्महे
    । ब्रह्माद्या अपि शङ्किताः स्वविषये यस्याः प्रसादावधि प्रीता सा महिषासुरप्रमथिनी च्छिन्द्यादवद्यानि
    मे ॥ ४॥ पातु श्रीस्तु चतुर्भुजा किमु चतुर्बाहोर्महौजान्भुजान् धत्तेऽष्टादशधा हि कारणगुणाः कार्ये गुणारम्भकाः
    । सत्यं दिक्पतिदन्तिसङ्ख्यभुजभृच्छम्भुः स्वय्म्भूः स्वयं धामैकप्रतिपत्तये किमथवा पातुं दशाष्टौ दिशः
    ॥ ५॥ प्रीत्याऽष्टादशसंमितेषु युगपद्द्वीपेषु दातुं वरान् त्रातुं वा भयतो बिभर्षि भगवत्यष्टादशैतान्
    भुजान् । यद्वाऽष्टादशधा भुजांस्तु बिभृतः काली सरस्वत्युभे मीलित्वैकमिहानयोः प्रथयितुं सा त्वं रमे
    रक्ष माम् ॥ ६॥ छन्दः ॥ अयि गिरिनन्दिनि नन्दितमेदिनि विश्वविनोदिनि नन्दनुते
