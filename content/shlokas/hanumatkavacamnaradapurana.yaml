id: hanumatkavacamnaradapurana
category: kavacha
name:
  english: hanumatkavacamnaradapurana
  devanagari: हनुमत्कवचम्नारदपुराण
content:
  english: rinu || 1|| yasya sandharanatsadyah sarve nashyantyupadravah | bhutapretarijam duhkham nashameti
    na samshayah || 2|| ekadaham gato drashtum ramam ramayatam varam | anandavanikasamstham dhyayantam
    svatmanah padam || 3|| tatra ramam ramanatham pujitam tridasheshvaraih | namaskritya tadadishtamasanam
    sthitavan purah || 4|| tatra sarvam maya vrittam ravanasya vadhantakam | prishtam provaca rajendrah
    shriramah svayamadarat || 5|| tatah kathante bhagavanmaruteh kavacam dadau | mahyam tatte pravakshyami
    na prakashyam hi kutracit || 6|| bhavishyadetannirddishtam balabhavena narada | shriramenanjanasunorbhuktimuktipradayakam
    || 7|| atha kavacam | hanuman purvatah patu dakshine pavanatmajah | patu praticyamakshaghnah saumye
    sagaratarakah || 8|| urdhvam patu kapishreshthah kesaripriyanandanah | adhastadvishnubhaktastu patu
    madhye ca pavanih || 9|| lankavidahakah patu sarvapadbhyo nirantaram | sugrivasacivah patu mastakam
    vayunandanah || 10|| bhalam patu mahaviro bhruvormadhye nirantaram | netre chayapahari ca patu nah
    plavageshvarah || 11|| kapolau karnamule ca patu shriramakinkarah | nasagramanjanasunuh patu vaktram
    harishvarah || 12|| patu kanthe tu daityarih skandhau patu surarijit | bhujau patu mahatejah karau
    ca caranayudhah || 13|| nakhannakhayudhah patu kukshau patu kapishvarah | vaksho mudrapahari ca patu
    parshve bhujayudhah || 14|| lankanibharjanah patu prishthadeshe nirantaram | nabhim shriramabhaktastu
    katim patvanilatmajah || 15|| guhyam patu mahaprajnah sakthini atithipriyah | uru ca januni patu lankaprasadabhanjanah
    || 16|| janghe patu kapishreshtho gulphau patu mahabalah | acaloddharakah patu padau bhaskarasannibhah
    || 17|| angani patu sattvadhyah patu padangulih sada | mukhangani mahashurah patu romani catmavan
    || 18|| divaratrau trilokeshu sadagatisuto'vatu | sthitam vrajantamasinam pibantam jakshatam kapih
    || 19|| lokottaragunah shriman patu tryambakasambhavah | pramattamapramattam va shayanam gahane'mbuni
    || 20|| sthale'ntarikshe hyagnau va parvate sagare drume | sangrame sankate ghore viradrupadharo'vatu
    || 21|| dakinishakinimarikalaratrimaricikah | shayanam mam vibhuh patu pishacoragarakshasih || 22||
    divyadehadharo dhimansarvasattvabhayankarah | sadhakendravanah shashvatpatu sarvata eva mam || 23||
    yadrupam bhishanam drishtva palayante bhayanakah | sa sarvarupah sarvajnah srishtisthitikaro'vatu
    || 24|| svayam brahma svayam vishnuh sakshaddevo maheshvarah | suryamandalagah shridah patu kalatraye'pi
    mam || 25|| yasya shabdamupakarnya daityadanavarakshasah | deva manushyastiryancah sthavara jangamastatha
    || 26|| sabhaya bhayanirmukta bhavanti svakritanugah | yasyanekakathah punyah shruyante pratikalpake
    || 27|| so'vatatsadhakashreshtham sada ramaparayanah | vaidhatradhatriprabhriti yatkinciddrishyate'tyalam
    || 28|| viddhi vyaptam yatha kisharupenananjanena tat | yo vibhuh so'hamesho'ham sviyah svayamanurbrihat
    || 29|| rigyajuhsamarupashca pranavastrivridadhvarah | tasmai svasmai ca sarvasmai nato'smyatmasamadhina
    || 30|| anekanantabrahmandadhrite brahmasvarupine | samiranatmane tasmai nato'smyatmasvarupine ||
    31|| namo hanumate tasmai namo marutasunave | namah shriramabhaktaya shyamaya mahate namah || 32||
    namo vanaraviraya sugrivasakhyakarine | lankavidahanayatha mahasagaratarine || 33|| sitashokavinashaya
    ramamudradharaya ca | ravanantanidanaya namah sarvottaratmane || 34|| meghanadamakhadhvamsakaranaya
    namo namah | ashokavanavidhvamsakarine jayadayine || 35|| vayuputraya viraya akashodaragamine | vanapalashirashchetre
    lankaprasadabhanjine || 36|| jvalatkancanavarnaya dirghalanguladharine | saumitrijayadatre ca ramadutaya
    te namah || 37|| akshasya vadhakartre ca brahmashastranivarine | lakshmanangamahashaktijatakshatavinashine
    || 38|| rakshoghnaya ripughnaya bhutaghnaya namo namah | rikshavanaraviraughaprasadaya namo namah
    || 39|| parasainyabalaghnaya shastrastraghnaya te namah | vishaghnaya dvishaghnaya bhayaghnaya namo
    namah || 40|| maharipubhayaghnaya bhaktatranaikakarine | parapreritamantranam mantranam stambhakarine
    || 41||
  devanagari: ृणु ॥ १॥ यस्य सन्धारणात्सद्यः सर्वे नश्यन्त्युपद्रवाः । भूतप्रेतारिजं दुःखं नाशमेति न संशयः
    ॥ २॥ एकदाहं गतो द्रष्टुं रामं रमयतां वरम् । आनन्दवनिकासंस्थं ध्यायन्तं स्वात्मनः पदम् ॥ ३॥ तत्र रामं
    रमानाथं पूजितं त्रिदशेश्वरैः । नमस्कृत्य तदादिष्टमासनं स्थितवान् पुरः ॥ ४॥ तत्र सर्वं मया वृत्तं रावणस्य
    वधान्तकम् । पृष्टं प्रोवाच राजेन्द्रः श्रीरामः स्वयमादरात् ॥ ५॥ ततः कथान्ते भगवान्मारुतेः कवचं ददौ
    । मह्यं तत्ते प्रवक्ष्यामि न प्रकाश्यं हि कुत्रचित् ॥ ६॥ भविष्यदेतन्निर्द्दिष्टं बालभावेन नारद । श्रीरामेणाञ्जनासूनोर्भुक्तिमुक्तिप्रदायकम्
    ॥ ७॥ अथ कवचम् । हनुमान् पूर्वतः पातु दक्षिणे पवनात्मजः । पातु प्रतीच्यामक्षघ्नः सौम्ये सागरतारकः ॥
    ८॥ ऊर्ध्वं पातु कपिश्रेष्ठः केसरिप्रियनन्दनः । अधस्ताद्विष्णुभक्तस्तु पातु मध्ये च पावनिः ॥ ९॥ लङ्काविदाहकः
    पातु सर्वापद्भ्यो निरन्तरम् । सुग्रीवसचिवः पातु मस्तकं वायुनन्दनः ॥ १०॥ भालं पातु महावीरो भ्रुवोर्मध्ये
    निरन्तरम् । नेत्रे छायापहारी च पातु नः प्लवगेश्वरः ॥ ११॥ कपोलौ कर्णमूले च पातु श्रीरामकिङ्करः । नासाग्रमञ्जनासूनुः
    पातु वक्त्रं हरीश्वरः ॥ १२॥ पातु कण्ठे तु दैत्यारिः स्कन्धौ पातु सुरारिजित् । भुजौ पातु महातेजाः करौ
    च चरणायुधः ॥ १३॥ नखान्नखायुधः पातु कुक्षौ पातु कपीश्वरः । वक्षो मुद्रापहारी च पातु पार्श्वे भुजायुधः
    ॥ १४॥ लङ्कानिभर्जनः पातु पृष्ठदेशे निरन्तरम् । नाभिं श्रीरामभक्तस्तु कटिं पात्वनिलात्मजः ॥ १५॥ गुह्यं
    पातु महाप्राज्ञः सक्थिनी अतिथिप्रियः । ऊरू च जानुनी पातु लङ्काप्रासादभञ्जनः ॥ १६॥ जङ्घे पातु कपिश्रेष्ठो
    गुल्फौ पातु महाबलः । अचलोद्धारकः पातु पादौ भास्करसन्निभः ॥ १७॥ अङ्गानि पातु सत्त्वाढ्यः पातु पादाङ्गुलीः
    सदा । मुखाङ्गानि महाशूरः पातु रोमाणि चात्मवान् ॥ १८॥ दिवारात्रौ त्रिलोकेषु सदागतिसुतोऽवतु । स्थितं
    व्रजन्तमासीनं पिबन्तं जक्षतं कपिः ॥ १९॥ लोकोत्तरगुणः श्रीमान् पातु त्र्यम्बकसम्भवः । प्रमत्तमप्रमत्तं
    वा शयानं गहनेऽम्बुनि ॥ २०॥ स्थलेऽन्तरिक्षे ह्यग्नौ वा पर्वते सागरे द्रुमे । सङ्ग्रामे सङ्कटे घोरे
    विराड्रूपधरोऽवतु ॥ २१॥ डाकिनीशाकिनीमारीकालरात्रिमरीचिकाः । शयानं मां विभुः पातु पिशाचोरगराक्षसीः ॥
    २२॥ दिव्यदेहधरो धीमान्सर्वसत्त्वभयङ्करः । साधकेन्द्रावनः शश्वत्पातु सर्वत एव माम् ॥ २३॥ यद्रूपं भीषणं
    दृष्ट्वा पलायन्ते भयानकाः । स सर्वरूपः सर्वज्ञः सृष्टिस्थितिकरोऽवतु ॥ २४॥ स्वयं ब्रह्मा स्वयं विष्णुः
    साक्षाद्देवो महेश्वरः । सूर्यमण्डलगः श्रीदः पातु कालत्रयेऽपि माम् ॥ २५॥ यस्य शब्दमुपाकर्ण्य दैत्यदानवराक्षसाः
    । देवा मनुष्यास्तिर्यञ्चः स्थावरा जङ्गमास्तथा ॥ २६॥ सभया भयनिर्मुक्ता भवन्ति स्वकृतानुगाः । यस्यानेककथाः
    पुण्याः श्रूयन्ते प्रतिकल्पके ॥ २७॥ सोऽवतात्साधकश्रेष्ठं सदा रामपरायणः । वैधात्रधातृप्रभृति यत्किञ्चिद्दृश्यतेऽत्यलम्
    ॥ २८॥ विद्धि व्याप्तं यथा कीशरूपेणानञ्जनेन तत् । यो विभुः सोऽहमेषोऽहं स्वीयः स्वयमणुर्बृहत् ॥ २९॥
    ऋग्यजुःसामरूपश्च प्रणवस्त्रिवृदध्वरः । तस्मै स्वस्मै च सर्वस्मै नतोऽस्म्यात्मसमाधिना ॥ ३०॥ अनेकानन्तब्रह्माण्डधृते
    ब्रह्मस्वरूपिणे । समीरणात्मने तस्मै नतोऽस्म्यात्मस्वरूपिणे ॥ ३१॥ नमो हनुमते तस्मै नमो मारुतसूनवे ।
    नमः श्रीरामभक्ताय श्यामाय महते नमः ॥ ३२॥ नमो वानरवीराय सुग्रीवसख्यकारिणे । लङ्काविदहनायाथ महासागरतारिणे
    ॥ ३३॥ सीताशोकविनाशाय राममुद्राधराय च । रावणान्तनिदानाय नमः सर्वोत्तरात्मने ॥ ३४॥ मेघनादमखध्वंसकारणाय
    नमो नमः । अशोकवनविध्वंसकारिणे जयदायिने ॥ ३५॥ वायुपुत्राय वीराय आकाशोदरगामिने । वनपालशिरश्छेत्रे लङ्काप्रासादभञ्जिने
    ॥ ३६॥ ज्वलत्काञ्चनवर्णाय दीर्घलाङ्गूलधारिणे । सौमित्रिजयदात्रे च रामदूताय ते नमः ॥ ३७॥ अक्षस्य वधकर्त्रे
    च ब्रह्मशस्त्रनिवारिणे । लक्ष्मणाङ्गमहाशक्तिजातक्षतविनाशिने ॥ ३८॥ रक्षोघ्नाय रिपुघ्नाय भूतघ्नाय नमो
    नमः । ऋक्षवानरवीरौघप्रासादाय नमो नमः ॥ ३९॥ परसैन्यबलघ्नाय शस्त्रास्त्रघ्नाय ते नमः । विषघ्नाय द्विषघ्नाय
    भयघ्नाय नमो नमः ॥ ४०॥ महारिपुभयघ्नाय भक्तत्राणैककारिणे । परप्रेरितमन्त्राणां मन्त्राणां स्तम्भकारिणे
    ॥ ४१॥
