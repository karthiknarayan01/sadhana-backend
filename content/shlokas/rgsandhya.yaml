id: rgsandhya
category: veda
name:
  english: rgsandhya
  devanagari: र्ग्सन्ध्य
content:
  english: shri shubhe shobhane muhurte vishnorajnaya pravartamanasya adya brahmanah dvitiye parardhe
    shri shvetavaraha kalpe vaivasvata manvantare ashtavimshatitame kaliyuge prathamapade jambudvipe bharatavarshe
    bharatakhande dandakaranye godavaryah dakshine parshve shalivahanashake bauddhavatare ramakshetre
    asminvartamanena candramanena asya shri amuka samvatsare amuka ayane amuka ritau amuka mase amuka
    pakshe amuka tithau amuka vasare amuka nakshatre shubhayoga shubhakarana evanguna visheshana vishishtayam
    shubhatithau asmadadigurunam shrimanmadhvacaryanam hritkamalamadhyanivasi suryantargata shri bharatiramanamukhyapranantargata
    shri lakshminarayana preranaya shri lakshminarayana prityartham pratah sandhyamupashishye |
  devanagari: श्री शुभे शोभने मुहूर्ते विष्णोराज्ञया प्रवर्तमानस्य आद्य ब्रह्मणः द्वितीये परार्धे श्री
    श्वेतवराह कल्पे वैवस्वत मन्वन्तरे अष्टाविंशतितमे कलियुगे प्रथमपादे जम्बूद्वीपे भरतवर्षे भरतखण्डे दण्डकारण्ये
    गोदावर्याः दक्षिणे पार्श्वे शालीवाहनशके बौद्धावतारे रामक्षेत्रे अस्मिन्वर्तमानेन चान्द्रमानेन अस्य
    श्री अमुक संवत्सरे अमुक आयने अमुक ऋतौ अमुक मासे अमुक पक्षे अमुक तिथौ अमुक वासरे अमुक नक्षत्रे शुभयोग
    शुभकरण एवङ्गुण विशेषण विशिष्टायां शुभतिथौ अस्मदादिगुरूणां श्रीमन्मध्वाचार्याणां हृत्कमलमध्यनिवासी
    सूर्यान्तर्गत श्री भारतीरमणमुख्यप्राणान्तर्गत श्री लक्ष्मीनारायण प्रेरणया श्री लक्ष्मीनारायण प्रीत्यर्थं
    प्रातः सन्ध्यामुपाशिष्ये ।
