    bhavati | ya evam ve~da | rantirnamasi divyo gandharva ityaha | rupamevasyai nmahimanagm ranti vya~cashte
    | samahamayusha sa mpranenetyaha | ashishamevaitamasha ndveshti yanca vaya ndvishma ityaha | abhicara
    evasyaishah | acikrada dvrisha harirityaha | vrisha hyeshah || || vrisha harih | maha shata ityaha
    | stautyevainametat | cidasi samudrayonirityaha | svamevainam yo~ningamayati | namaste astu ma ma
    higmsirityahahigmsayai | vishvavasugm somagandharvamityaha | yadevasya kriyamanasyantaryanti | tadevasyaitena
    pyayayati | vishvavasurabhi tanno grinatvityaha || || purvamevoditam | uttarenabhigrinati | dhiyo
    hinvano dhiya inno avyadityaha | ritunevasmai kalpayati | prasa ngandharvo amritani vocadityaha |
    prana va amritah | prananevasmai kalpayati | etattvandeva gharma devo devanupaga ityaha | devo hyesha
    sandevanupaiti | idamaha mmanushyo manushyanityaha || || manushyo hi | esha sa nmanushyanupaiti |
    ishvaro vai pravargyamudvasayann | praja thsomapithamanudvasa ssomapithanumehi | saha prajaya saha
    rayasposhenetyaha | prajameva pashun ndhatte | sumitra na apa oshadhaya ssantvityaha | ashishamevaitamasha
    ste | durmitrastasmai bhuyasu ndvishma ityaha | abhicara evasyaishah | pra va esho llokaccyavate |
    yah pravargyamudvasayati | udu tya ncitramiti sauribhyamrigbhya hapatye juhoti | ayam ~vai loko gar
    hapatyah | asminneva loke pratitishthati | asau khalu va aditya ssuvargo lokah | ya thsauri bhavatah
    | tenaiva suvarga brahmanastva paraspaya ityaha rakshasvi rakshasamapahatyai bhyo na vyabhavat | tadagnirvyakarot
    | tani shukriyani sama 'tyaksharat | tani shukrayajug shyabhavann | shukriyanam va~ etani shukriyani
    | samapayasam va~ etayoranyat | devanamanyatpayah | yadgoh payah || thsamnah payah | yadajayai payah
    | ta ryajurbhishcaranti | ta tpayasa caranti | prajapatimeva ta 'nnadyena samardhayanti | esha ha
    tvai saksha mbhakshayati | yasyaivam vi~dushah pravargyah pravrijyate tejaskamasya | tejo va uttaravedih
    || || tejah pravargyah | tejasaiva teja ssamardhayati | uttaravedya dannakamasya | shiro va eta tpravargyah
    | mukhamuttaravedih | shir shnaiva mukhagm sandadhatyannadyaya | annada eva bhavati | yatra khalu
    va etamudvasitam va~yagmsi paryasate | pari vai tagm sama mpraja vayagsyasate || mevodvasayet | prajana
    ngopithaya | puro va pashcadvodvasayet | purastadva etajjyotirudeti | ta tpashcannimrocati | svamevainam
    ~yonimanudvasayati | apa mmaddhya udvasayet | apam jjyotirajayata | jyotih pravargyah | sva evainam
    yo~nau pratishthapayati || ndvishyat | yatra sa syat | tasya ndishyudvasayet | esha va agni pravargyah
    | agninaivainam vai~shvanarenabhi pravartayati | audumbaryagm shakhayamudvasayet | urgva udumbarah
    | anna mpranah | shuggharmah || mamushyamushyayanasya shuca pranamapi dahamityaha | shucaivasya pranamapi
    dahati | tajagartimarcchati | yatra darbha upadikasantata ssyuh | tadudvasaye dvrishtikamasya | eta
    va apamanujjhavaryo nama | ya ddarbhah | asau khalu va aditya ito vrishtimudirayati | asavevasma adityo
    vrishtinniyacchati | ta apo niyata dhanvana yanti || ssambhriyamanah | samrat thsambhritah | gharmah
    pravriktah | mahavira udvasitah | asau khalu vavaisha adityah | ya tpravargyah | sa etani nama ve~da
    | vidurenannamna | brahmavadino vadanti || || yo vai vasiyagm sam ya~thanamamupacarati | punya vai~
    sa tasmai kamayate | punya rtimasmai kamayante | ya evam vi~dvan | gharma iti diva ''cakshita | samraditi
    nakta m | ete va etasya priye tanuvau | ete asya priye namani | priyayaivaina || priyena namna samardhayati
    | kirtirasya purva gacchati janatamayatah | gayatri devebhyo kramat | tandevah pravargyenaivanu vyabhavann
    | pravargyenapnuvann | yaccaturvigmshatih kritvah pravargya mpravrinakti | gayatrimeva tadanu vibhavati
    | gayatrima ya~tah kirtirgacchati | vaishvadeva || vasavah pravriktah | somo 'bhikiryamanah | ashvinah
    payasyaniyamane | marutah kvathann | paushna udantah | sarasvato vishyandamanah | maitra shsharo grihitah
    | teja udyato vayuh | hriyamanah prajapatih | huyamano vaghutah || || asau khalu vavaisha adityah
    | ya tpravargyah | sa etani nama ve~da | vidurenannamna | brahmavadino vadanti | yanmrinmaya 'shnuta
    iti | vagesha iti bruyat | vacyeva vaca || tasmadashnute | prajapatirva esha dvadashadha vihitah |
    ya tpragavakashebhyah | tena praja asrijata | avakashai rdevasuranasrijata | yadurdhvamavakashebhyah
    | tenannamasrijata | anna mprajapatih | prajapatirvavaishah || savita bhutva prathame npravrijyate
    | tena kamagm eti | ya rbhutva devaneti | yat rbhutva prananeti | yaccaturthe | adityo bhutva rashmineti
    | ya | candrama bhutva nakshatranyeti || | dhata bhutva shakvarimeti | yadashtame rbhutva gayatrimeti
    | ya | mitro bhutva trivrita iman ~lokaneti | ya | varuno bhutva virajameti || | indro bhutva trishtubhameti
    | ya | somo bhutva sutyameti | yat | tasmaditah paramamum stapanneti | yaduparishta stapanneti | ya
    evam prajapatigm shukram savita bhutva dvadasha r yo vai vasiyagm sam ya~thanama mashtottarashatam
    || harih om || || krishna yajurvediya taittiriya aranyake pancamah prapathaka
