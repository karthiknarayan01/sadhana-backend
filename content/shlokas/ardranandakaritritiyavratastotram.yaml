id: ardranandakaritritiyavratastotram
category: stotram
name:
  english: ardranandakaritritiyavratastotram
  devanagari: आर्द्रानन्दकरीतृतीयाव्रतस्तोत्रम्
content:
  english: ardranandakari tritiyavratastotram vasudevyai namah padau shankaraya namo hareh | janghe shokavinashinyayanandaya
    namah prabho || 5|| rambhayai pujayeduru shivaya ca pinakinah | adityai ca katim pujya shulinah shulapanaye
    || 6|| madhavyai ca tatha nabhimatha shambhorbhavaya vai | stanavanandakarinyai shankarayendudharine
    || 7|| utkanthinyai namah kantham nilakanthaya vai hareh | karavutpaladharinyai rudraya jagatipateh
    || 8|| bahum ca parirambhinyai nrityashilaya vai hareh || 9|| devya mukham vilasinyai vrisheshaya
    punarvibhoh | smitam sasmarashilayai vishvavaktraya vai vibhoh || 10|| netram madanavasinyai vishvadhamne
    trishuline | bhruvau ratipriyayai ca tandaveshaya vai vibhoh || 11|| devyai lalatamindranyai havyavahaya
    vai vibhoh | svahayai mukutam devya vibhoh pancasharaya vai || 12|| vishvakayai vishvamukhyai vishvapadakarau
    shivau | prasannavadanau vande parvatiparameshvarau || 13|| iti bhavishyapurane uttaraparvani saptavimshadhyayantargatam
    ardranandakari tritiyavratastotram samaptam | bhavishyapurana | uttaraparva | adhyaya 27
  devanagari: आर्द्रानन्दकरी तृतीयाव्रतस्तोत्रम् वासुदेव्यै नमः पादौ शङ्कराय नमो हरेः । जङ्घे शोकविनाशिन्यायानन्दाय
    नमः प्रभो ॥ ५॥ रम्भायै पूजयेदूरू शिवाय च पिनाकिनः । आदित्यै च कटिं पूज्या शूलिनः शूलपाणये ॥ ६॥ माधव्यै
    च तथा नाभिमथ शम्भोर्भवाय वै । स्तनावानन्दकारिण्यै शङ्करायेन्दुधारिणे ॥ ७॥ उत्कण्ठिन्यै नमः कण्ठं नीलकण्ठाय
    वै हरेः । करावुत्पलधारिण्यै रुद्राय जगतीपतेः ॥ ८॥ बाहुं च परिरम्भिण्यै नृत्यशीलाय वै हरेः ॥ ९॥ देव्या
    मुखं विलासिन्यै वृषेशाय पुनर्विभोः । स्मितं सस्मरशीलायै विश्ववक्त्राय वै विभोः ॥ १०॥ नेत्रं मदनवासिन्यै
    विश्वधाम्ने त्रिशूलिने । भ्रुवौ रतिप्रियायै च ताण्डवेशाय वै विभोः ॥ ११॥ देव्यै ललाटमिन्द्राण्यै हव्यवाहाय
    वै विभोः । स्वाहायै मुकुटं देव्या विभोः पञ्चशराय वै ॥ १२॥ विश्वकायै विश्वमुख्यै विश्वपादकरौ शिवौ ।
    प्रसन्नवदनौ वन्दे पार्वतीपरमेश्वरौ ॥ १३॥ इति भविष्यपुराणे उत्तरपर्वणि सप्तविंशाध्यायान्तर्गतं आर्द्रानन्दकरी
    तृतीयाव्रतस्तोत्रं समाप्तम् । भविष्यपुराण । उत्तरपर्व । अध्याय २७
