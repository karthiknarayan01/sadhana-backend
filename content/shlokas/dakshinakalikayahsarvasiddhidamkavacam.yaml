id: dakshinakalikayahsarvasiddhidamkavacam
category: kavacha
name:
  english: dakshinakalikayahsarvasiddhidamkavacam
  devanagari: दक्षिणकालिकायाःसर्वसिद्धिदंकवचम्
content:
  english: shriparamashiva uvaca | sarpihsagaravisphuranmanimayaddipe kadambanvite gehe ratnamaye shavasya
    hridaye ratnamriteshanane | vargadyananavamalocanamayim shridakshinam kalikam sadyashchinnashirahkaram
    bhagavatim dhyayanti punyashayah || 1|| madyaghurnitalocanatrayamahashobhamayim yoshitam lakshaih
    sevitapadapadmayugalam shribhairavidyotitam | shrimatkalamukhe mukham nidadhatim candrim kalam vibhratim
    tam dhyayanti susiddhaye bhagavatim tadbhavanananditah || 2|| mamsasrigdugdhakhandacchuritamadhumahapanamattam
    hasantim attattam kalakalam kahakahadamiti prollasantim sakhishu | mrityaproddamahasonmadamuditamahabhairavanandavicim
    matangam khandayantimabhayavarakaram kalikam tam bhajamah || 3|| idantu divyam kavacam manojnam deyam
    kadacidguruve'pi naiva | mahadbhayat sneharasena dattva hanih sharirena ca sadhakeshu || 4|| yasmadidantu
    kavacam labhyate bahupunyatah | tena dattantu sakalam sadgurum paramam priye
  devanagari: श्रीपरमशिव उवाच । सर्पिःसागरविस्फुरन्मणिमयद्दीपे कदम्बान्विते गेहे रत्नमये शवस्य हृदये रत्नामृतेशानने
    । वर्गाद्याननवामलोचनमयीं श्रीदक्षिणां कालिकां सद्यश्छिन्नशिरःकरां भगवतीं ध्यायन्ति पुण्याशयाः ॥ १॥
    मद्याघूर्णितलोचनत्रयमहाशोभामयीं योषितां लक्षैः सेवितपादपद्मयुगलां श्रीभैरवीद्योतिताम् । श्रीमत्कालमुखे
    मुखं निदधतीं चान्द्रीं कलां विभ्रतीं तां ध्यायन्ति सुसिद्धये भगवतीं तद्भावनानन्दिताः ॥ २॥ मांसासृग्दुग्धखण्डच्छुरितमधुमहापानमत्तां
    हसन्तीं अट्टाट्टं कालकालं कहकहडमिति प्रोल्लसन्तीं सखीषु । मृत्यप्रोद्दामहासोन्मदमुदितमहाभैरवानन्दवीचीं
    मातङ्गं खण्डयन्तीमभयवरकरां कालिकां तां भजामः ॥ ३॥ इदन्तु दिव्यं कवचं मनोज्ञं देयं कदाचिद्गुरुवेऽपि
    नैव । महद्भयात् स्नेहरसेन दत्त्वा हानिः शरीरेण च साधकेषु ॥ ४॥ यस्मादिदन्तु कवचं लभ्यते बहुपुण्यतः
    । तेन दत्तन्तु सकलं सद्गुरुं परमं प्रिये
meaning: {}
