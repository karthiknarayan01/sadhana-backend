id: pithastotram-2
category: stotram
name:
  english: pithastotram 2
  devanagari: पीठस्तोत्रम् २
content:
  english: pithastotram deva deveshvaradyashca rishayo rishisattamah | prithagevopadeshtarastesham pitham
    prithak prithak || 1|| manushyeshvaravatara ye acarya muravairinah | paramparyagatam tesham pithamekam
    vishishyate || 2|| yatha mahibhritam pitham jagatam palanaya vai | tathaivadeshikanam ca pitham dharmapravrittaye
    || 3|| pithastha eva bhupalo yatha nyayapravartakah | tatha pithasthitacaryo yogyo dharmapravrittaye
    || 4|| pithasthito yatha raja manyo devairnarairapi | tatha pithasthitacaryah pujyah syanna vina ca
    tam || 5|| yada vilupyate pitham paramparyakramagatam | deshakalapramadadyaistada nutnam vidhiyate
    || 6|| devarshinam ca purvesham mantram va namamantrakam | samyojya pithamantrena pitham samsthapayetsudhih
    || 7|| rajapithangavadrajapithangaih pithamarcayet | athava bhavanamatraih purvoktam va yathepsitam
    || 8|| athava saptadashabhiryantrairmantrairnirupitam | samradacaryapitham syatsamarcyam nityameva
    tat || 9|| tasya dakshinaparshve tu kuryadyantracatushtayam | tattvatattvesharshidevairupadevaistadishyate
    || 10|| vame parshve caturyantri kuryatsadhakasattamah | svarairvarnairmantrabijaih padairmanasya
    sambhavat || 11|| puratah padake tatra punaryantracatushtayam | gayatrya nigamanam ca tatha vai shastramantrayoh
    || 12|| madhye siddhinidhiyantramasanam tatra kalpayet | gopalayantrarajam ca prishthe tasyagrato
    bhavet || 13|| sankhyayantram cankayantram prishthe pithasya prishthatah | adharmacakram cakrasyadhastham
    murdhni gururvishet || 14|| gopalopasakanam ca etatsimhasanam matam | sauvarnam rajatam tamram kashthamashmam
    ca mrinmayam || 15|| asambhave bhavanaiva mantradinam vidhiyate | utsedhah parinahashca shastrato
    vapyabhipsitah || 16|| acaryakulasambhuta acaryagunasamshrayah | sthitvaiva tattvamacarya yogyo vyakhyopadeshayoh
    || 17|| samriddhayo'sya varddhante pratapo'sya yato mahan | acaryato harerbhaktirviraktirapi jayate
    || 18|| etatsimhasanam divyam rajna shishyaishca sammataih | pujitam mananiyam syadacaryah sampradayikah
    || 19|| vyasasimhasanam canyaddiyate rishibhirdvijaih | romaharshanaye yadvacchastravyakhyakrite'rpitam
    || 20|| samshrayed brahmano vidvansuto naiva vilomajah | mantrayoh pratilomyena makhem jatastathocyate
    || 21|| vinandannijakandartham pancaratram sadagamam | vadan svasamhitam garvajjajne sankarshanashca
    tam || 22|| acaryam manayeddhimanmanasa karmana gira | pancakshari mahamantrayantram sthitva svayam
    harih || 23|| ittham pithasya mahatmyam jnatva pitham samashritam | radhikayai dadau purvam lalitayai
    ca sa dadau || 24|| sa mahyamadadad devi vagishaya sadaspatih | sankalpamasya sankalpya caritam ca
    mahatmanam || 25|| pancaksharam cashtavarnam tathaivashtadashaksharam | narayanaya sheshaya sa dadau
    tripuraraye || 26|| dasharnena ca samyuktanso'danmantransurarshaye | dvadasharnena samyuktantan vyasaya
    dadavasau || 27|| namah pithaya mahate acaryaya namo namah | upadeshaya mantrebhyah shishyebhyashca
    namo namah || 28|| chatrayamritavarshaya varanayatapasya ca | namashcamarayugmaya shankhayugmaya vai
    namah || 29|| vaditrebhyo namastasya dararibhyam namo namah | jyotiryugmayandhakaramardanaya namo
    namah || 30|| mayurahastakadvandvasvarnavetrayugam namah | rupyam vetrayugam bhavyam harivaktracatushtayam
    || 31|| aryasimhasanam vande ketudhvajavirajitam | nirajamanam yah pashyetpranametsa harim vrajet
    || 32||
  devanagari: पीठस्तोत्रम् देवा देवेश्वराद्याश्च ऋषयो ऋषिसत्तमाः । पृथगेवोपदेष्टारस्तेषां पीठं पृथक् पृथक्
    ॥ १॥ मनुष्येश्वरावतारा ये आचार्या मुरवैरिणः । पारम्पर्यागतं तेषां पीठमेकं विशिष्यते ॥ २॥ यथा महीभृतां
    पीठं जगतां पालनाय वै । तथैवादेशिकानां च पीठं धर्मप्रवृत्तये ॥ ३॥ पीठस्थ एव भूपालो यथा न्यायप्रवर्तकः
    । तथा पीठस्थिताचार्यो योग्यो धर्मप्रवृत्तये ॥ ४॥ पीठस्थितो यथा राजा मान्यो देवैर्नरैरपि । तथा पीठस्थिताचार्यः
    पूज्यः स्यान्न विना च तम् ॥ ५॥ यदा विलुप्यते पीठं पारम्पर्यक्रमागतम् । देशकालप्रमादाद्यैस्तदा नूत्नं
    विधीयते ॥ ६॥ देवर्षीणां च पूर्वेषां मन्त्रं वा नाममन्त्रकम् । संयोज्य पीठमन्त्रेण पीठं संस्थापयेत्सुधीः
    ॥ ७॥ राजपीठाङ्गवद्राजपीठाङ्गैः पीठमर्चयेत् । अथवा भावनामात्रैः पूर्वोक्तं वा यथेप्सितम् ॥ ८॥ अथवा
    सप्तदशभिर्यन्त्रैर्मन्त्रैर्निरूपितम् । संराडाचार्यपीठं स्यात्समर्च्यं नित्यमेव तत् ॥ ९॥ तस्य दक्षिणपार्श्वे
    तु कुर्याद्यन्त्रचतुष्टयम् । तत्त्वतत्त्वेशर्षिदेवैरुपदेवैस्तदिष्यते ॥ १०॥ वामे पार्श्वे चतुर्यन्त्री
    कुर्यात्साधकसत्तमः । स्वरैर्वर्णैर्मन्त्रबीजैः पदैर्मानस्य सम्भवात् ॥ ११॥ पुरतः पदके तत्र पुनर्यन्त्रचतुष्टयम्
    । गायत्र्या निगमानां च तथा वै शास्त्रमन्त्रयोः ॥ १२॥ मध्ये सिद्धिनिधीयन्त्रमासनं तत्र कल्पयेत् । गोपालयन्त्रराजं
    च पृष्ठे तस्याग्रतो भवेत् ॥ १३॥ सङ्ख्यायन्त्रं चाङ्कयन्त्रं पृष्ठे पीठस्य पृष्ठतः । अधर्मचक्रं चक्रस्याधस्थं
    मूर्ध्नि गुरुर्विशेत् ॥ १४॥ गोपालोपासकानां च एतत्सिंहासनं मतम् । सौवर्णं राजतं ताम्रं काष्ठमाश्मं
    च मृन्मयम् ॥ १५॥ असम्भवे भावनैव मन्त्रादीनां विधीयते । उत्सेधः परिणाहश्च शास्त्रतो वाप्यभीप्सितः ॥
    १६॥ आचार्यकुलसम्भूत आचार्यगुणसंश्रयः । स्थित्वैव तत्त्वमाचार्या योग्यो व्याख्योपदेशयोः ॥ १७॥ समृद्धयोऽस्य
    वर्द्धन्ते प्रतापोऽस्य यतो महान् । आचार्यतो हरेर्भक्तिर्विरक्तिरपि जायते ॥ १८॥ एतत्सिंहासनं दिव्यं
    राज्ञा शिष्यैश्च सम्मतैः । पूजितं मननीयं स्यादाचार्यः साम्प्रदायिकः ॥ १९॥ व्याससिंहासनं चान्यद्दीयते
    ऋषिभिर्द्विजैः । रोमहर्षणये यद्वच्छास्त्रव्याख्याकृतेऽर्पितम् ॥ २०॥ संश्रयेद् ब्राह्मणो विद्वान्सूतो
    नैव विलोमजः । मन्त्रयोः प्रातिलोम्येन मखें जातस्तथोच्यते ॥ २१॥ विनन्दन्निजकाण्डार्थं पाञ्चरात्रं सदागमम्
    । वदन् स्वसंहितां गर्वाज्जज्ञे सङ्कर्षणश्च तम् ॥ २२॥ आचार्यं मानयेद्धीमान्मनसा कर्मणा गिरा । पञ्चाक्षरी
    महामन्त्रयन्त्रं स्थित्वा स्वयं हरिः ॥ २३॥ इत्थं पीठस्य माहात्म्यं ज्ञात्वा पीठं समाश्रितम् । राधिकायै
    ददौ पूर्वं ललितायै च सा ददौ ॥ २४॥ सा मह्यमददाद् देवी वागीशाय सदस्पतिः । सङ्कल्पमस्य सङ्कल्प्य चरितं
    च महात्मनाम् ॥ २५॥ पञ्चाक्षरं चाष्टवर्णं तथैवाष्टादशाक्षरम् । नारायणाय शेषाय स ददौ त्रिपुरारये ॥ २६॥
    दशार्णेन च संयुक्तान्सोऽदान्मन्त्रान्सुरर्षये । द्वादशार्णेन संयुक्तान्तान् व्यासाय ददावसौ ॥ २७॥ नमः
    पीठाय महते आचार्याय नमो नमः । उपदेशाय मन्त्रेभ्यः शिष्येभ्यश्च नमो नमः ॥ २८॥ छत्रायामृतवर्षाय वारणायातपस्य
    च । नमश्चामरयुग्माय शङ्खयुग्माय वै नमः ॥ २९॥ वादित्रेभ्यो नमस्तस्य दरारिभ्यां नमो नमः । ज्योतिर्युग्मायान्धकारमर्दनाय
    नमो नमः ॥ ३०॥ मायूरहस्तकद्वन्द्वस्वर्णवेत्रयुगं नमः । रूप्यं वेत्रयुगं भव्यं हरिवक्त्रचतुष्टयम् ॥
    ३१॥ आर्यसिंहासनं वन्दे केतुध्वजविराजितम् । नीराजमानं यः पश्येत्प्रणमेत्स हरिं व्रजेत् ॥ ३२॥
