    मयो॒भुव॑ ईजा॒न ञ्च धे॒नवः॑ । पृ॒णन्त॑ श्र॒व॒स्यवो॑ घृ॒तस्य॒ श्रव॒स्यवो॑ घृ॒तस्य॒ धारा॒ उप॑ यन्ति वि॒श्वतः॑
    ॥सोमा॑रुद्रा॒ वि वृ॑हतं॒ विँषू॑ची॒ममी॑वा॒ या नो॒ गय॑ मावि॒वेश॑ । आ॒रे बा॑धेथा॒ ञ्चि॒देनः॒ प्र मु॑मुक्त
    म॒स्मत् ॥ सोमा॑रुद्रा यु॒व मे॒तान्य॒स्मे विश्वा॑ त॒नूषु॑ भेष॒जानि॑ धत्तम् । अव॑ स्यत यँन्नो॒ अस्ति॑
    त॒नूषु॑ ब॒द्ध ङ्कृ॒तमेनो॑ अ॒स्मत् ॥ सोमा॑पूषणा॒ जन॑ना रयी॒णा ञ्जन॑ना दि॒वो जन॑ना पृथि॒व्याः । जा॒तौ
