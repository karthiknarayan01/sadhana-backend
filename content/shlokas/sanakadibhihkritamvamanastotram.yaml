id: sanakadibhihkritamvamanastotram
category: stotram
name:
  english: sanakadibhihkritamvamanastotram
  devanagari: सनकादिभिःकृतंवामनस्तोत्रम्
content:
  english: sanakadibhih kritam vamanastotram ityuktva baturupam tadvihaya parameshvarah | vavridhe vamano'tiva
    kritva rupam caturbhujam || 62|| vardhamanam harim drishtva brahmana rishayah surah | tushtuvurgagane
    jatam bhagavantam janardanam || 63|| jaya vishno jaya vishno jaya bhaktakripakara | jaya hrasva jaya
    dirgha jaya bhikshuka vamana || 64|| jaya devakripakarte jaya bhaktasya gocara | jaya yajna jaya havya
    jaya vahne jaya'cyuta || 65|| jaya'rthin data neta tvam jaya brahmandakridvapuh | jaya matsya namastubhyam
    jaya kurma dharadhara || 66|| jaya varaharupadhrik nrisimhaya namo'stu te | jaya krishna jaya shrimannarayana
    namo'stu te || 67|| namah krishnaya kambharagopalaya namo namah | namah patnivratakhyaya lakshminathaya
    te namah || 68|| varnitam bahudha shastre drishtam naiva kadapi yat | drishyate'dya kripaleshaccaturdashadharasthitaih
    || 69|| vairajam te mahadrupam drishtva hrishtah sma taritah | iti shrilakshminarayaniyasamhitayam
    prathame kritayugasantane 146
  devanagari: सनकादिभिः कृतं वामनस्तोत्रम् इत्युक्त्वा बटुरूपं तद्विहाय परमेश्वरः । ववृधे वामनोऽतीव कृत्वा
    रूपं चतुर्भुजम् ॥ ६२॥ वर्धमानं हरिं दृष्ट्वा ब्राह्मणा ऋषयः सुराः । तुष्टुवुर्गगने जातं भगवन्तं जनार्दनम्
    ॥ ६३॥ जय विष्णो जय विष्णो जय भक्तकृपाकर । जय ह्रस्व जय दीर्घ जय भिक्षुक वामन ॥ ६४॥ जय देवकृपाकर्ते
    जय भक्तस्य गोचर । जय यज्ञ जय हव्य जय वह्ने जयाऽच्युत ॥ ६५॥ जयाऽर्थिन् दाता नेता त्वं जय ब्रह्माण्डकृद्वपुः
    । जय मत्स्य नमस्तुभ्यं जय कूर्म धराधर ॥ ६६॥ जय वाराहरूपधृक् नृसिंहाय नमोऽस्तु ते । जय कृष्ण जय श्रीमन्नारायण
    नमोऽस्तु ते ॥ ६७॥ नमः कृष्णाय कम्भरागोपालाय नमो नमः । नमः पत्नीव्रताख्याय लक्ष्मीनाथाय ते नमः ॥ ६८॥
    वर्णितं बहुधा शास्त्रे दृष्टं नैव कदापि यत् । दृश्यतेऽद्य कृपालेशाच्चतुर्दशधरास्थितैः ॥ ६९॥ वैराजं
    ते महद्रूपं दृष्ट्वा हृष्टाः स्म तारिताः । इति श्रीलक्ष्मीनारायणीयसंहितायां प्रथमे कृतयुगसन्ताने १४६
meaning: {}
