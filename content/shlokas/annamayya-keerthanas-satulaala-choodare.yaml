id: annamayya-keerthanas-satulaala-choodare
category: stotram
name:
  english: Annamayya Keerthanas Satulaala Choodare
content:
  english: sa pallavi satulala cudare shravanabahulashtami sakalaya nadureyi galigè shrikrishudu | putteyapude
    caturbhujalu shankhucakralu yèttu dhariyincène yi krishnudu | attè kiritamu nabharanalu dharinci yètta
    nèduta nunnadu yi krishnudu || satulala cudare shravanabahulashtami sakalaya nadureyi galigè shrikrishudu
    | vacci brahmayu rudrudu vakita nutincaganu yiccaginci vinucunna dikrishnudu | muccatadi devakito
    munci vasudevunito hèccinamahimalato yi krishnudu || satulala cudare shravanabahulashtami sakalaya
    nadureyi galigè shrikrishudu | kòda dira mari nandagopunaku yashodaku idigo ta biddadayè nikrishnudu
    | adana shri venkateshudai yalamelmanga gudi yèdutane nilucunna dikrishnudu || satulala cudare shravanabahulashtami
    sakalaya nadureyi galigè shrikrishudu |
  devanagari: स पल्लवि सतुलाल चूडरे श्रावणबहुलाष्टमि सकलाय नडुरेयि गलिगॆ श्रीकृषुडु । पुट्टेयपुडे चतुर्भुजालु
    शङ्खुचक्रालु यॆट्टु धरियिञ्चॆने यी कृष्णुडु । अट्टॆ किरीटमु नाभरणालु धरिञ्चि यॆट्ट नॆदुट नुन्नाडु
    यी कृष्णुडु ॥ सतुलाल चूडरे श्रावणबहुलाष्टमि सकलाय नडुरेयि गलिगॆ श्रीकृषुडु । वच्चि ब्रह्मयु रुद्रुडु
    वाकिट नुतिञ्चगानु यिच्चगिञ्चि विनुचुन्ना डीकृष्णुडु । मुच्चटाडी देवकितो मुञ्चि वसुदेवुनितो हॆच्चिनमहिमलतो
    यी कृष्णुडु ॥ सतुलाल चूडरे श्रावणबहुलाष्टमि सकलाय नडुरेयि गलिगॆ श्रीकृषुडु । कॊद दीर मरि नन्दगोपुनकु
    यशोदकु इदिगो ता बिड्डाडायॆ नीकृष्णुडु । अदन श्री वेङ्कटेशुडै यलमेल्मङ्ग गूडि यॆदुटने निलुचुन्ना डीकृष्णुडु
    ॥ सतुलाल चूडरे श्रावणबहुलाष्टमि सकलाय नडुरेयि गलिगॆ श्रीकृषुडु ।
