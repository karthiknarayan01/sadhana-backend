id: vedasarashivastotram
category: stotram
name:
  english: vedasarashivastotram
  devanagari: वेदसारशिवस्तोत्रम्
content:
  english: '|| vedasarashivastotram || || shrih || || atha vedasarashivastotram || pashunam patim papanasham
    paresham gajendrasya krittim vasanam varenyam | jatajutamadhye sphuradgangavarim mahadevamekam smarami
    smararim || 1 || mahesham suresham suraratinasham vibhum vishvanatham vibhutyangabhusham | virupakshamindvarkavahnitrinetram
    sadanandamide prabhum pancavaktram || 2 || girisham ganesham gale nilavarnam gavendradhirudham gunatitarupam
    | bhavam bhasvaram bhasmana bhushitangam bhavanikalatram bhaje pancavaktram || 3 || shivakanta shambho
    shashankardhamaule maheshana shulinjatajutadharin | tvameko jagadvyapako vishvarupah prasida prasida
    prabho purnarupa || 4 || paratmanamekam jagadbijamadyam niriham nirakaramomkaravedyam | yato jayate
    palyate yena vishvam tamisham bhaje liyate yatra vishvam || 5 || na bhumirnam capo na vahnirna vayu'
  devanagari: ॥ वेदसारशिवस्तोत्रम् ॥ ॥ श्रीः ॥ ॥ अथ वेदसारशिवस्तोत्रम् ॥ पशूनां पतिं पापनाशं परेशं गजेन्द्रस्य
    कृत्तिं वसानं वरेण्यम् । जटाजूटमध्ये स्फुरद्गाङ्गवारिं महादेवमेकं स्मरामि स्मरारिम् ॥ १ ॥ महेशं सुरेशं
    सुरारातिनाशं विभुं विश्वनाथं विभूत्यङ्गभूषम् । विरूपाक्षमिन्द्वर्कवह्नित्रिनेत्रं सदानन्दमीडे प्रभुं
    पञ्चवक्त्रम् ॥ २ ॥ गिरीशं गणेशं गले नीलवर्णं गवेन्द्राधिरूढं गुणातीतरूपम् । भवं भास्वरं भस्मना भूषिताङ्गं
    भवानीकलत्रं भजे पञ्चवक्त्रम् ॥ ३ ॥ शिवाकान्त शंभो शशाङ्कार्धमौले महेशान शूलिञ्जटाजूटधारिन् । त्वमेको
    जगद्व्यापको विश्वरूपः प्रसीद प्रसीद प्रभो पूर्णरूप ॥ ४ ॥ परात्मानमेकं जगद्बीजमाद्यं निरीहं निराकारमोंकारवेद्यम्
    । यतो जायते पाल्यते येन विश्वं तमीशं भजे लीयते यत्र विश्वम् ॥ ५ ॥ न भूमिर्नं चापो न वह्निर्न वायु
