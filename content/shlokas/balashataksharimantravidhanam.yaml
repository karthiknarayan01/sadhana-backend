id: balashataksharimantravidhanam
category: mantra
name:
  english: balashataksharimantravidhanam
  devanagari: बालाशताक्षरीमन्त्रविधानम्
content:
  english: hiranyavarnam harinim suvarnarajatasrajam | candram hiranmayim lakshmim jatavedo ma avaha ||
    sam sa̱midyṷvase̱ vrisha̱nnagne̱ vishva̭nya̱rya a | i̱laspa̱de sami̭dhyase̱ sa no̱ vasu̱nyabha̭ra
    || sanga̭cchadhva̱m samva̭dadhva̱m sam vo̱ mana̭msi janatam | de̱va bha̱gam yatha̱ purvḙ sanjana̱na
    u̱pasa̭te || sa̱ma̱no mantra̱h sami̭tih sama̱ni sa̭ma̱nam mana̭h sa̱ha ci̱ttamḙsham | sa̱ma̱nam mantra̭ma̱bhima̭ntraye
    vah sama̱nena̭ vo ha̱visha̭ juhomi || sa̱ma̱ni va̱ akṷtissama̱na hrida̭yani vah | sa̱ma̱nama̭stu
    vo̱ mano̱ yatha̭ va̱h susa̱hasa̭ti || shri̱ye ja̱tah shri̱ya aniri̭yaya̱ shriya̱m vayo̭jari̱tribhyo̭
    dadati | shriya̱m vasa̭na amrita̱tvama̭ya̱n bhava̭nti sa̱tya sa̭mi̱thami̱tadraṷ || indra̱ shreshtha̭ni̱
    dravi̭nani dhehi̱ citti̱m daksha̭sya sṷbhaga̱tvama̱sme | posha̭m rayi̱namari̭shtim ta̱nuna̭m sva̱dmana̭m
    va̱cah sṷdina̱tvamahna̱̭m | praja̭pate̱ na tvade̱tanya̱nyo vishva̭ ja̱tani̱ pari̱ta ba̭bhuva | yatka̭maste
    juhumastanno̭ astu va̱ya~ sya̭ma̱ pata̭yo rayi̱nam || iti shribalashataksharimantravidhanam sampurnam
    |
  devanagari: हिरण्यवर्णां हरिणीं सुवर्णरजतस्रजाम् । चन्द्रां हिरण्मयीं लक्ष्मीं जातवेदो म आवह ॥ सं स॒मिद्यु॑वसे॒
    वृष॒न्नग्ने॒ विश्वा॑न्य॒र्य आ । इ॒लस्प॒दे समि॑ध्यसे॒ स नो॒ वसू॒न्याभ॑र ॥ सङ्ग॑च्छध्वं॒ संव॑दध्वं॒
    सं वो॒ मनां॑सि जानताम् । दे॒वा भा॒गं यथा॒ पूर्वे॑ सञ्जाना॒ना उ॒पास॑ते ॥ स॒मा॒नो मन्त्रः॒ समि॑तिः समा॒नी
    स॑मा॒नं मनः॑ स॒ह चि॒त्तमे॑षाम् । स॒मा॒नं मन्त्र॑म॒भिम॑न्त्रये वः समा॒नेन॑ वो ह॒विषा॑ जुहोमि ॥ स॒मा॒नी
    व॒ आकू॑तिस्समा॒ना हृद॑यानि वः । स॒मा॒नम॑स्तु वो॒ मनो॒ यथा॑ वः॒ सुस॒हास॑ति ॥ श्रि॒ये जा॒तः श्रि॒य आनिरि॑याय॒
    श्रियं॒ वयो॑जरि॒तृभ्यो॑ ददाति । श्रियं॒ वसा॑ना अमृत॒त्वमा॑य॒न् भव॑न्ति स॒त्या स॑मि॒थामि॒तद्रौ॑ ॥ इन्द्र॒
    श्रेष्ठा॑नि॒ द्रवि॑णानि धेहि॒ चित्तिं॒ दक्ष॑स्य सु॑भग॒त्वम॒स्मे । पोषं॑ रयी॒णामरि॑ष्टिं त॒नूनां॑ स्वा॒द्मानं॑
    वा॒चः सु॑दिन॒त्वमह्ना॒॑म् । प्रजा॑पते॒ न त्वदे॒तान्य॒न्यो विश्वा॑ जा॒तानि॒ परि॒ता ब॑भूव । यत्का॑मास्ते
    जुहुमस्तन्नो॑ अस्तु व॒यँ स्या॑म॒ पत॑यो रयी॒णाम् ॥ इति श्रीबालाशताक्षरीमन्त्रविधानं सम्पूर्णम् ।
