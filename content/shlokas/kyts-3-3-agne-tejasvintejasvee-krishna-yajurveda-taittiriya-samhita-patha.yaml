    परि॑पातु प॒श्चादु॒तोत्त॑रस्मा॒दध॑रादघा॒योः । इन्द्रः॑ पु॒रस्ता॑दु॒त म॑द्ध्य॒तो न॒ स्सखा॒ सखि॑भ्यो॒
    वरि॑वः कृणोतु ॥ वि ते॒ विष्व॒ग्वात॑जूतासो अग्ने॒ भामा॑स शु॒चे॒ शुच॑यश्चरन्ति । श्शुचे॒ शुच॑यश्चरन्ति
    । तु॒वि॒म्र॒क्षासो॑ दि॒व्या नव॑ग्वा॒ वना॑ वनन्ति धृष॒ता रु॒जन्तः॑ ॥ त्वाम॑ग्ने॒ मानु॑षीरीडते॒ विशो॑
    होत्रा॒विदं॒ विँवि॑चिग्ं रत्न॒धात॑मम् । गुहा॒ सन्तग्ं॑ सुभग वि॒श्वद॑र् न्तु विष्म॒णसग्ं॑ सु॒यज॑ म्
    ॥ धा॒ता द॑दातु नो र॒यिमीशा॑नो॒ जग॑त॒स्पतिः॑ । स नः॑ पू॒र्णेन॑ वावनत् ॥ धा॒ता प्र॒जाया॑ उ॒त रा॒य ई॑शे
    धा॒तेदं ञ्जजान । धा॒ता पु॒त्रं ङ्घृ॒तव॑द्विधेम ॥ धा॒ता द॑दातु नो र॒यि ञ्जी॒वातु॒मक्षि॑ताम् । व॒य न्दे॒वस्य॑
    धीमहि सुम॒तिग्ं स॒त्यरा॑धसः ॥ धा॒ता द॑दातु दा॒शुषे॒ वसू॑नि प्र॒जाका॑माय मी॒ढुषे॑ दुरो॒णे । तस्मै॑
    दे॒वा अ॒मृता॒ विँश्वे॑ दे॒वासो॒ अदि॑ति न्दे॒वेषु॑ मन्यताम् । अ॒ग्निश्च॑ हव्य॒वाह॑नो॒ भव॑ता न्दा॒शुषे॒
    मयः॑ ॥ अन्विद॑नुमते॒ त्व मन्या॑सै॒ शञ्च॑नः कृधि । म्मन्या॑सै॒ शञ्च॑नः कृधि । क्रत्वे॒ दक्षा॑य नो हिनु॒
    प्रण॒ आयूग्ं॑षि तारिषः ॥ अनु॑ मन्यता मनु॒मन्य॑माना प्र॒जाव॑न्तग्ं र॒यिमक्षी॑यमाणम् । तस्यै॑ व॒यग्ं
    हेड॑सि॒ मा ऽपि॑ भूम॒ सा नो॑ दे॒वी सु॒हवा॒ शर्म॑ यच्छतु ॥ यस्या॑मि॒द म्प्र॒दिशि॒ यद्वि॒रोच॒ते म्प्रति॑
    भूषन्त्या॒यवः॑ । यस्या॑ उ॒पस्थ॑ उ॒र्व॑न्तरि॑क्ष॒ग्ं॒ सा नो॑ दे॒वी सु॒हवा॒ शर्म॑ यच्छतु ॥ ॥ रा॒काम॒हग्ं
    सु॒हवाग्ं॑ सुष्टु॒ती हु॑वे शृ॒णोतु॑ न स्सु॒भगा॒ बोध॑तु॒ त्मना । सीव्य॒त्वपः॑ सू॒च्या ऽच्छि॑द्यमानया॒
    ददा॑तु वी॒रग्ं श॒तदा॑यमु॒क्थ्य म् ॥ यास्ते॑ राके सुम॒तयः॑ सु॒पेश॑सो॒ याभि॒र्ददा॑सि दा॒शुषे॒ वसू॑नि
    । ताभि॑र्नो अ॒द्य सु॒मना॑ उ॒पाग॑हि सहस्रपो॒षग्ं सु॑भगे॒ ररा॑णा ॥ सिनी॑वालि॒ या सु॑पा॒णिः ॥ कु॒हूम॒हग्ं
    सु॒भगां विँद्म॒नाप॑सम॒स्मिन् ञ्जोहवीमि । सा नो॑ ददातु॒ श्रव॑ण स्ते देवि ह॒विषा॑ विधेम ॥ कु॒हू र्दे॒वाना॑म॒मृत॑स्य॒
    पत्नी॒ हव्या॑ नो अ॒स्य ह॒विष॑श्चिकेतु । स न्दा॒शुषे॑ कि॒रतु॒ भूरि॑ वा॒मग्ं रा॒यस्पोष॑ ञ्चिकि॒तुषे॑
    दधातु ॥ म॒न्तरि॑क्ष॒ग्ं॒ सा नो॑ दे॒वी सु॒हवा॒ शर्म॑ यच्छतु॒ ँवा॒युर॑सि प्रा॒णो नाम॑ दे॒वा वै यद्य॒ज्ञेन॒न
    प्र॒जाप॑ति र्देवासु॒रा ॥ हरिः॑ ओम् ॥ ॥ कृष्ण यजुर्वेदीय तैत्तिरीय संहिताया न्तृतीयकाण्डे तृतीयः प्रश्न
