id: argalastotram-2
category: stotram
name:
  english: argalastotram
  devanagari: अर्गलास्तोत्रम्
content:
  english: brahman kena prakarena durgamahatmyamuttamam | shighram siddhyati tatsarvvam kathayasva mahaprabho
    || brahmovaca | argalam kilakancadau pathitva kavacam pathet | japet saptashatim pashcat krama esha
    shivoditah || argalam duritam hanti kilakam phaladam tatha | kavacam rakshate nityam candika tritayam
    dishet || argalam hridaye yasya sa canargalavak sada | kilakam hridaye yasya vashakilitamanasah ||
    kavacam hridaye yasya sa vajrahridayah khalu | brahmana nirmmitam purvvam vinishcityapi cetasa
  devanagari: ब्रह्मन् केन प्रकारेण दुर्गामाहात्म्यमुत्तमं । शीघ्रं सिद्ध्यति तत्सर्व्वं कथयस्व महाप्रभो
    ॥ ब्रह्मोवाच । अर्गलं कीलकञ्चादौ पठित्वा कवचं पठेत् । जपेत् सप्तशतीं पश्चात् क्रम एष शिवोदितः ॥ अर्गलं
    दुरितं हन्ति कीलकं फलदं तथा । कवचं रक्षते नित्यं चण्डिका त्रितयं दिशेत् ॥ अर्गलं हृदये यस्य स चानर्गलवाक्
    सदा । कीलकं हृदये यस्य वशकीलितमानसः ॥ कवचं हृदये यस्य स वज्रहृदयः खलु । ब्रह्मणा निर्म्मितं पूर्व्वं
    विनिश्चित्यापि चेतसा
meaning: {}
