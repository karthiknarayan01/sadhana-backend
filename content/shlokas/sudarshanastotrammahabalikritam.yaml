id: sudarshanastotrammahabalikritam
category: stotram
name:
  english: sudarshanastotrammahabalikritam
  devanagari: सुदर्शनस्तोत्रंमहाबलिकृतम्
content:
  english: anantasyaprameyasya vishvamurtermahatmanah | namami cakrinashcakram karasangi sudarshanam ||
    50|| sahasramiva suryanam sanghatam vidyutamiva | kalagnimiva yaccakram tadvishnoh pranamamyaham ||
    51|| dushtarahugalacchedashonitarunatarakam | tannamami hareshcakram shatanemi sudarshanam || 52||
    yasyarakeshu shakradya lokapala vyavasthitah | tadantarvasavo rudrastathaiva marutam ganah || 53||
    dharayam dvadashadityah samastashca hutashanah | dharajale'bdhayah sarve nabhimadhye prajapatih ||
    54|| samastanemishvakhila yasya vidyah pratishthitah | yasya rupamanirdeshyamapi yogibhiruttamaih
    || 55|| yadbhramatsurasanghanam tejasah paribrimhanam daityaujasam ca nashaya tannamami sudarshanam
    bhramanmatamahavegavibhrantakhilakhecaram tannamami hareshcakramanantaram sudarshanam nakshatravadvahnikanavyaptam
    kritsnam nabhastalam tannamami hareshcakram karasangi sudarshanam svabhavatejasa yuktam yadarkagnimayam
    mahat | visheshato harergatva sarvadevamayam karam || 57|| durvrittadaityamathanam jagatah paripalakam
    | tannamami hareshcakram daityacakraharam param || 58|| karotu me sada sharma dharmatam ca prayatu
    me | prasadasumukhe krishne tasya cakram sudarshanam || 59|| svabhavatejasa yuktam madhyahnarkasamaprabham
    prasida samyuge'rinam sudarshanasudarshanam | vidyujjvalamahakaksham dahantarmama yattamah || 60||
    jahi no vishayagrahi mano grahaviceshtitam | visphotayakhilam mayam kurushva vimalam matim || 61||
    evam samsthuyamanam tadvahnipindopamam mahat | babhuva prakatam cakram daityacakrapatestada || 62||
    dadarsha sa mahabahuh prabhamandaladurdrisham | agnijvalagatam tamram taptacakramivaparam || 63||
    bhramatastasya cakrasya nabhimadhye mahipate | trailokyamakhilam daityo drishtavanbhurbhuvadikam ||
    64|| mervadinakhilanchailangangadyah saritastatha | kshirabdhipramukhamshcabdhindvipanjambvadisamjnitan
    || 65|| vaimanikansagandharvansuryadimshca tatha grahan | nakshatratarakakasham shakradimshca divaukasah
    || 66|| rudradityamshca marutam sadhyanam ca mahipate | sannidhanam nirikshyasau daityanam vismito'bhavat
    || 67|| tatah pranamyartiharam suranamaparasaram paramayudham hareh | namo namaste'stviti daityarajah
    provaca bhuyo'pi namo namaste || 68|| yanno'shubham cetasi vayuvega yanno'shubham vaci hutashanottha
    | yaccashubham kayakritam harestadvarayudham tvam prashamam nayashu || 69|| prasida satkarakritam
    mamagham prayatu te nashamanantavirya | satam ca sanmargavatam manamsi sthiribhavantvacyutapadayugme
    || 70|| iti vishnudharmeshu ashtasaptatitamo'dhyayantargatam mahabalikritam sudarshanastotram |
  devanagari: अनन्तस्याप्रमेयस्य विश्वमूर्तेर्महात्मनः । नमामि चक्रिणश्चक्रं करसङ्गि सुदर्शनम् ॥ ५०॥ सहस्रमिव
    सूर्याणां सङ्घातं विद्युतामिव । कालाग्निमिव यच्चक्रं तद्विष्णोः प्रणमाम्यहम् ॥ ५१॥ दुष्टराहुगलच्छेदशोणितारुणतारकम्
    । तन्नमामि हरेश्चक्रं शतनेमि सुदर्शनम् ॥ ५२॥ यस्यारकेषु शक्राद्या लोकपाला व्यवस्थिताः । तदन्तर्वसवो
    रुद्रास्तथैव मरुतां गणाः ॥ ५३॥ धारायां द्वादशादित्याः समस्ताश्च हुताशनाः । धाराजालेऽब्धयः सर्वे नाभिमध्ये
    प्रजापतिः ॥ ५४॥ समस्तनेमिष्वखिला यस्य विद्याः प्रतिष्ठिताः । यस्य रूपमनिर्देश्यमपि योगिभिरुत्तमैः
    ॥ ५५॥ यद्भ्रमत्सुरसङ्घानां तेजसः परिबृंहणं दैत्यौजसां च नाशाय तन्नमामि सुदर्शनं भ्रमन्मतमहावेगविभ्रान्ताखिलखेचरं
    तन्नमामि हरेश्चक्रमनन्तारं सुदर्शनं नक्षत्रवद्वह्निकणव्याप्तं कृत्स्नं नभस्तलं तन्नमामि हरेश्चक्रं
    करसङ्गि सुदर्शनं स्वभावतेजसा युक्तं यदर्काग्निमयं महत् । विशेषतो हरेर्गत्वा सर्वदेवमयं करम् ॥ ५७॥
    दुर्वृत्तदैत्यमथनं जगतः परिपालकम् । तन्नमामि हरेश्चक्रं दैत्यचक्रहरं परम् ॥ ५८॥ करोतु मे सदा शर्म
    धर्मतां च प्रयातु मे । प्रसादसुमुखे कृष्णे तस्य चक्रं सुदर्शनम् ॥ ५९॥ स्वभावतेजसा युक्तं मध्याह्नार्कसमप्रभं
    प्रसीद संयुगेऽरीणां सुदर्शनसुदर्शनम् । विद्युज्ज्वालामहाकक्षं दहान्तर्मम यत्तमः ॥ ६०॥ जहि नो विषयग्राहि
    मनो ग्रहविचेष्टितम् । विस्फोटयाखिलां मायां कुरुष्व विमलां मतिम् ॥ ६१॥ एवं संस्थूयमानं तद्वह्निपिण्डोपमं
    महत् । बभूव प्रकटं चक्रं दैत्यचक्रपतेस्तदा ॥ ६२॥ ददर्श स महाबाहुः प्रभामण्डलदुर्दृशम् । अग्निज्वालागतं
    ताम्रं तप्तचक्रमिवापरम् ॥ ६३॥ भ्रमतस्तस्य चक्रस्य नाभिमध्ये महीपते । त्रैलोक्यमखिलं दैत्यो दृष्टवान्भूर्भुवादिकम्
    ॥ ६४॥ मेर्वादीनखिलाञ्छैलान्गङ्गाद्याः सरितस्तथा । क्षीराब्धिप्रमुखांश्चाब्धीन्द्वीपाञ्जम्ब्वादिसंज्ञितान्
    ॥ ६५॥ वैमानिकान्सगन्धर्वान्सूर्यादींश्च तथा ग्रहान् । नक्षत्रतारकाकाशं शक्रादींश्च दिवौकसः ॥ ६६॥ रुद्रादित्यांश्च
    मरुतां साध्यानां च महीपते । सन्निधानं निरीक्ष्यासौ दैत्यानां विस्मितोऽभवत् ॥ ६७॥ ततः प्रणम्यार्तिहरं
    सुराणामपारसारं परमायुधं हरेः । नमो नमस्तेऽस्त्विति दैत्यराजः प्रोवाच भूयोऽपि नमो नमस्ते ॥ ६८॥ यन्नोऽशुभं
    चेतसि वायुवेग यन्नोऽशुभं वाचि हुताशनोत्थ । यच्चाशुभं कायकृतं हरेस्तद्वरायुधं त्वं प्रशमं नयाशु ॥ ६९॥
    प्रसीद सत्कारकृतं ममाघं प्रयातु ते नाशमनन्तवीर्य । सतां च सन्मार्गवतां मनांसि स्थिरीभवन्त्वच्युतपादयुग्मे
    ॥ ७०॥ इति विष्णुधर्मेषु अष्टसप्ततितमोऽध्यायान्तर्गतं महाबलिकृतं सुदर्शनस्तोत्रम् ।
