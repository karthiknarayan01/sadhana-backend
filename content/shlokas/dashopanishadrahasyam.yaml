id: dashopanishadrahasyam
category: upanishad
name:
  english: dashopanishadrahasyam
  devanagari: दशोपनिषद्रहस्यम्
content:
  english: apitu aneka shastrom ki apani vidvata se aneka shastrom mem svatantra granthom ka pranayana
    kiya lekina unaka yaha pradana adhunika samshodhakom ke nidarshana mem abhi taka laya nahim gaya hai
    | isalie isa samkshipta shodhapatra mem ramacandra pamdita ka samskrita sahitya mem pradana aura visheshataya
    unaka vedantaparaka samkshipta grantha dashopanishadrahasya ke bare mem vishleshana kiya gaya hai
    | vaha aprakashita vedanta grantha hastalikhita grantha ke rupa mem hi abhi taka raha tha jisaka abhyasa
    aura sampadana karake maimne yaha lekha likha hai | ramacandra pamdita ka paricaya
  devanagari: अपितु अनेक शास्त्रों की अपनी विद्वता से अनेक शास्त्रों में स्वतन्त्र ग्रन्थों का प्रणयन
    किया लेकिन उनका यह प्रदान आधुनिक संशोधकों के निदर्शन में अभी तक लाया नहीं गया है । इसलिए इस संक्षिप्त
    शोधपत्र में रामचन्द्र पंडित का संस्कृत साहित्य में प्रदान और विशेषतया उनका वेदान्तपरक संक्षिप्त ग्रन्थ
    दशोपनिषद्रहस्य के बारे में विश्लेषण किया गया है । वह अप्रकाशित वेदान्त ग्रन्थ हस्तलिखित ग्रन्थ के
    रूप में ही अभी तक रहा था जिसका अभ्यास और सम्पादन करके मैंने यह लेख लिखा है । रामचन्द्र पंडित का परिचय
