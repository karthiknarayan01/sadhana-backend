id: sri-padmavati-navaratna-malika-stuti
category: stotram
name:
  english: Sri Padmavati Navaratna Malika Stuti
content:
  english: shriman yasyah priyassan sakalamapi jagajjangamasthavaradyam svarbhupatalabhedam vividhavidhamahashilpasamarthyasiddham
    | ranjan brahmamarendraistribhuvanajanakah stuyate bhurisho yah sa vishnorekapatni tribhuvanajanani
    patu padmavati nah || || shrishringaraikadevim vidhimukhasumanahkotikotirajagra dratnajyotsnaprasaraprakatitacaranambhojanirajitarcam
    | girvanastrainavanipariphanitamahakirtisaubhagyabhagyam helanirdagdhadainyashramavishamamaharanyaganyam
    namami || || vidyutkotiprakasham vividhamaniganonnidrasusnigdhashobha sampatsampurnaharadyabhinavavibhavalankriyollasikantham
    | adyam vidyotamanasmitaruciracitanalpacandraprakasham padmam padmayatakshim padanalinanamatpadmasadmam
    namami || || shashvattasyah shraye'ham caranasarasijam sharngapaneh purandhryah stokam yasyah prasadah
    prasarati manuje kruradaridryadagdhe | so'yam sadyo'navadyasthiratararucirashreshthabhuyishthanavya
    stavyaprasadapanktiprasitabahuvidhaprabhavo bobhaviti || || saundaryodvelahemambujamahitamahasimhapithashrayadhyam
    pushyannilaravindapratimavarakripapurasampurnanetram | jyotsnapiyushadharavahanavasushamakshaumadhamojjvalangim
    vande siddheshacetassarasijanilayam cakrisaubhagyariddhim || || samsarakleshahantrim smitaruciramukhim
    sarashringarashobham sarvaishvaryapradatrim sarasijanayanam samstutam sadhubrindaih | samsiddhasnigdhabhavam
    surahitacaritam sindhurajatmabhutam seve sambhavaniyanupamitamahimam saccidanandarupam || || siddhasvarnopamanadyutilasitatanum
    snigdhasampurnacandra vridasampadivaktram tilasumavijayodyoganirnidranasam | tadatvotphullanilambujahasanacanatmiyacakshuh
    prakasham balashrilapravalapriyasakhacaranadvandvaramyam bhaje'ham || || yam devim maunivaryah shrayadamaravadhumaulimalyarcitanghrim
    samsarasaravarannidhitaratarane sarvada bhavayante | shrikarottungaratnapracuritakanakasnigdhashuddhantalilam
    tam shashvatpadapadmashrayadakhilahridahladinim hladaye'ham || || akashadhishaputrim shritajananivahadhinacetahpravrittim
    vande shrivenkateshaprabhuvaramahishim dinacittapratosham | pushyatpadaravindaprasrimarasumahashshamitasvashritanta
    stamisram tattvarupam shukapuranilayam sarvasaubhagyadatrim || || shrisheshasharmabhinavopaklupta
    priyena bhaktya ca samarpiteyam | padmavatimangalakanthabhusha virajatam shrinavaratnamala || || iti
    shri padmavati navaratnamalika stutih |
  devanagari: श्रीमान् यस्याः प्रियस्सन् सकलमपि जगज्जङ्गमस्थावराद्यं स्वर्भूपातालभेदं विविधविधमहाशिल्पसामर्थ्यसिद्धम्
    । रञ्जन् ब्रह्मामरेन्द्रैस्त्रिभुवनजनकः स्तूयते भूरिशो यः सा विष्णोरेकपत्नी त्रिभुवनजननी पातु पद्मावती
    नः ॥ ॥ श्रीशृङ्गारैकदेवीं विधिमुखसुमनःकोटिकोटीरजाग्र द्रत्नज्योत्स्नाप्रसारप्रकटितचरणाम्भोजनीराजितार्चाम्
    । गीर्वाणस्त्रैणवाणीपरिफणितमहाकीर्तिसौभाग्यभाग्यां हेलानिर्दग्धदैन्यश्रमविषममहारण्यगण्यां नमामि ॥
    ॥ विद्युत्कोटिप्रकाशां विविधमणिगणोन्निद्रसुस्निग्धशोभा सम्पत्सम्पूर्णहाराद्यभिनवविभवालङ्क्रियोल्लासिकण्ठाम्
    । आद्यां विद्योतमानस्मितरुचिरचितानल्पचन्द्रप्रकाशां पद्मां पद्मायताक्षीं पदनलिननमत्पद्मसद्मां नमामि
    ॥ ॥ शश्वत्तस्याः श्रयेऽहं चरणसरसिजं शार्ङ्गपाणेः पुरन्ध्र्याः स्तोकं यस्याः प्रसादः प्रसरति मनुजे
    क्रूरदारिद्र्यदग्धे । सोऽयं सद्योऽनवद्यस्थिरतररुचिरश्रेष्ठभूयिष्ठनव्य स्तव्यप्रासादपङ्क्तिप्रसितबहुविधप्राभवो
    बोभवीति ॥ ॥ सौन्दर्योद्वेलहेमाम्बुजमहितमहासिंहपीठाश्रयाढ्यां पुष्यन्नीलारविन्दप्रतिमवरकृपापूरसम्पूर्णनेत्राम्
    । ज्योत्स्नापीयूषधारावहनवसुषमक्षौमधामोज्ज्वलाङ्गीं वन्दे सिद्धेशचेतस्सरसिजनिलयां चक्रिसौभाग्यऋद्धिम्
    ॥ ॥ संसारक्लेशहन्त्रीं स्मितरुचिरमुखीं सारशृङ्गारशोभां सर्वैश्वर्यप्रदात्रीं सरसिजनयनां संस्तुतां
    साधुबृन्दैः । संसिद्धस्निग्धभावां सुरहितचरितां सिन्धुराजात्मभूतां सेवे सम्भावनीयानुपमितमहिमां सच्चिदानन्दरूपाम्
    ॥ ॥ सिद्धस्वर्णोपमानद्युतिलसिततनुं स्निग्धसम्पूर्णचन्द्र व्रीडासम्पादिवक्त्रां तिलसुमविजयोद्योगनिर्निद्रनासाम्
    । तादात्वोत्फुल्लनीलाम्बुजहसनचणात्मीयचक्षुः प्रकाशां बालश्रीलप्रवालप्रियसखचरणद्वन्द्वरम्यां भजेऽहम्
    ॥ ॥ यां देवीं मौनिवर्याः श्रयदमरवधूमौलिमाल्यार्चिताङ्घ्रिं संसारासारवारान्निधितरतरणे सर्वदा भावयन्ते
    । श्रीकारोत्तुङ्गरत्नप्रचुरितकनकस्निग्धशुद्धान्तलीलां तां शश्वत्पादपद्मश्रयदखिलहृदाह्लादिनीं ह्लादयेऽहम्
    ॥ ॥ आकाशाधीशपुत्रीं श्रितजननिवहाधीनचेतःप्रवृत्तिं वन्दे श्रीवेङ्कटेशप्रभुवरमहिषीं दीनचित्तप्रतोषाम्
    । पुष्यत्पादारविन्दप्रसृमरसुमहश्शामितस्वाश्रितान्त स्तामिस्रां तत्त्वरूपां शुकपुरनिलयां सर्वसौभाग्यदात्रीम्
    ॥ ॥ श्रीशेषशर्माभिनवोपक्लुप्ता प्रियेण भक्त्या च समर्पितेयम् । पद्मावतीमङ्गलकण्ठभूषा विराजतां श्रीनवरत्नमाला
    ॥ ॥ इति श्री पद्मावती नवरत्नमालिका स्तुतिः ।
