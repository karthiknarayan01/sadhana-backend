    | viprasatkritagokotishshatakotisuvarnadah || || svamayamohita'sheshavrishniviro visheshavit | jalajayudhanirdeshta
    svatmaveshitayadavah || || devatabhishtavaradah kritakrityah prasannadhih | sthirasheshayutabalassahasraphanivikshanah
    || || brahmavrikshavaracchayasinah padmasanasthitah | pratyagatma svabhavarthah pranidhanaparayanah
    || || vyadheshuviddhapujyanghrirnishadabhayamocanah | pulindastutisantushtah pulindasugatipradah ||
    || darukarpitaparthadikaraniyoktirishita | divyadundubhisamyuktah pushpavrishtiprapujitah || || puranah
    parameshanah purnabhuma parishtutah | patiradyah param brahma paramatma paratparah || || shriparamatma
    paratparah om namah iti | phalashrutih idam sahasram krishnasya namnam sarvarthadayakam | anantarupi
    bhagavan vyakhyatadau svayambhuve || || tena proktam vasishthaya tato labdhva parasharah | vyasaya
    tena samproktam shuko vyasadavaptavan || || tacchishyairbahubhirbhumau khyapitam dvapare yuge | krishnajnaya
    hariharah kalau prakhyapayadvibhuh || || idam pathati bhaktya yah shrinoti ca samahitah | svasiddhyai
    prarthayantyenam tirthakshetradidevatah || || prayashcittanyasheshani nalam yani vyapohitum | tani
