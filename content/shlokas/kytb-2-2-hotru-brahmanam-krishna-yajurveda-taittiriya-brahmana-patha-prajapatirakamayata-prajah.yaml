id: kytb-2-2-hotru-brahmanam-krishna-yajurveda-taittiriya-brahmana-patha-prajapatirakamayata-prajah
category: stotram
name:
  english: KYTB 2.2 Hotru Brahmanam - Krishna Yajurveda Taittiriya Brahmana Patha - Prajapatirakamayata
    Prajah
content:
  english: krishna yajurvediya taittiriya brahmane dvitiyashtake dvitiyah prapathakah shri gurubhyo namah
    | harih om || anuvakam dashahotrimantrasya kratvarthapurusharthaprayogau prajapatirakamayata praja
    ssrijeyeti | sa eta mmanasa 'nudrutya darbhastambe 'juhot | tato vai sa praja asrijata | ta asmathsrishta
    apa kramann | ta grahenagrihnat | tadgrahasya grahatvam | yah kamayeta prajayeyeti | sa dashahotara
    mmanasa 'nudrutya darbhastambe juhuyat | prajapatirvai dashahota || || prajapatireva bhutva pra jayate
    || manasa juhoti | mana iva hi prajapatih | prajapateraptyai || purnaya juhoti | purna iva hi prajapatih
    | prajapateraptyai || nyunaya juhoti | nyunaddhi prajapatih praja asrijata | prajanagm srishtyai ||
    darbhastambe juhoti | etasmadvai yoneh prajapatih praja asrijata | yasmadeva yoneh prajapatih praja
    asrijata | tasmadeva yoneh pra jayate || brahmano dakshinata upa ste | brahmano vai prajana mupadrashta
    | upadrashtumatyeva pra jayate || graho bhavati | prajanagm srishtana mparetya | darbhastamba mudgratthya
    | brahmana ndakshinato nishadya | catur hotrin vyacakshita | etadvai devana mbrahma | yaccatur hotarah
    | tadeva prakasha ngamayati || darbhastamba mudgratthya vyacashte || vai darbhastambah | agnivatyeva
    vyacashte || brahmano dakshinata upa ste | brahmano vai prajana mupadrashta | upadrashtu ya~sha ricchati
    || ishvara 'rtorityahuh | yasyante vyacashta iti | varastasmai deyah | yadevaina ntatropa namati |
    tadevava rundhe || || agnimadadhano dashahotra 'ranimavadaddhyat | prajatamevaina madhatte | tenaivoddrutya
    njuhuyat | prajatamevainajjuhoti | havirnirvaphsyan vya~cakshita | prajatamevaina nnirvapati | samidheni
    vya~cakshita | samidhenireva srishtva ''rabhya pra tanute | atho yajno vai dashahota | yajnameva tanute
    || njuhuyat | nava vai purushe pranah | nabhirdashami | sapranamevaina mabhicarati | etavadvai purushasya
    svam | yava tpranah | yavadevasyasti | tadabhicarati || svakrita irine juhoti pradare va | etadva
    asyai nir dvacah kruram | tena vashatkaroti | vaca evaina nkrurena pra vrishcati | tajagartimarcchati
    || nkratvarthaprayogah prajapatirakamayata dar shapurnamasau srijeyeti | sa eta 'nudrutya havaniye
    'juhot | tato vai sa dar shapurnamasavasrijata | tavasma kramatam | tau grahena grihnat | tadgrahasya
    grahatvam | darshapurnamasa havaniye juhuyat | darshapurnamasaveva srishtva ''rabhya pra tanute ||
    || graho bhavati | darshapurnamasayo 'kamayata caturmasyani srijeyeti | sa eta 'nudrutya havaniye
    'juhot | tato vai sa caturmasyanyasrijata | tanyasma kramann | tani grahenagrihnat | tadgrahasya grahatvam
    | caturmasyanyalabhamanah || 'nudrutya havaniye juhuyat | caturmasyanyeva srishtva ''rabhya pra tanute
    | graho bhavati | caturmasyanagm srishtana 'kamayata pashubandhagm srijeyeti | sa etagm shaddhotara
    'nudrutya havaniye 'juhot | tato vai sa pashubandhamasrijata | so ngrahenagrihnat || || tadgrahasya
    grahatvam | pashubandhena yakshyamanah | shaddhotara mmanasa 'nudrutya havaniye juhuyat | pashubandhameva
    srishtva ''rabhya pra tanute | graho bhavati | pashubandhasya srishtasya dhrityai maddhvaragm srijeyeti
    | sa etagm saptahotara 'nudrutya havaniye 'juhot | tato vai sa saumya ngrahenagrihnat | tadgrahasya
    grahatvam | dikshishyamanah | saptahotara 'nudrutya havaniye juhuyat | saumyamevaddhvaragm srishtva
    ''rabhya pra tanute | graho bhavati | saumyasya ddhvarasya srishtasya dhrityai || devebhyo vai yajno
    na prabhavat | tametavaccha thsabhamrah | tato vai tebhyo yajnah prabhavat | ya thsabhamra bhavanti
    | yajnasya prabhu tyai || atitthyamasadya vyacashte | yajnamukham va~ atithyam | mukhata eva yajnagm
    sabhrintya pra tanute || ayajno va eshah | yo 'patnikah | na prajah pra jayerann | patnirvyacashte
    | yajnamevakah | prajana mprajananaya || upasathsu vyacashte | etadvai patnina mayatanam | sva evaina
    ayatane hotripancahotrimantragrahabhagayoh purushartha prayogah prajapati rakamayata pra jayeyeti
    | sa tapo 'tapyata | sa trivritagg stoma mpancadashastomo maddhyata udatrinat | tau pu rvapakshashcaparapakshashcabhavatam
    | purvapaksha ndeva anvasrijyanta | aparapaksha manvasurah | tato deva abhavann | para nkamayeta vasiyan
    rvapakshe yajayet | vasiyaneva bhavati | ya nkamayeta papiyan thsyaditi | tamaparapakshe yajayet |
    papiyaneva bhavati | tasma karunyatarah || prajapatirvai dashahota | catur hota pancahota | shaddhota
    saptahota | ritavah sam || prajah pashava ime lokah | ya eva ve~da | bahoreva bhuya rdevasuranasrijata
    | sa indramapi nasrijata | ta ndeva abruvann | indra stapasa 'srikshi | evamindra 'tapyanta | ta atmannindra
    mapashyann | tamabruvann | jayasveti | so mabhijanishya iti | ritun va~thsaram | prajah pashun | imal
    ~lokanityabruvann | tam ''hutya prajanayatetyabravit || hotra prajanayann || yah kamayeta viro ma
    a jayeteti | sa catur njuhuyat | prajapatirvai catur hota | prajapatireva bhutva prajayate | jajanadindra
    mindriyaya svaheti grahena juhoti | a 'sya viro jayate | viragm hi deva etaya ''hutya prajanayann
    || adityashcangirasashca suvarge loke mpura prataranuvakadagni ddhre 'juhavuh | tato vai te purve
    suvargam ssyat | sa pancahotara mpura prataranuvakadagni ddhre juhuyat | sam va~thsaro vai pancahota
    | sam ssuvargo lokah | sam va~thsara evartushu pratishthaya | suvargam nnangirasa adityan || va~kshyama
    iti | chanda ssvityabruvann | gayatriya jagatyamiti | tasmacchandah su sadbhya adityebhyah | angirasih
    praja havyam va~hanti | vahantyasmai praja balim | ainamapratikhyata ve~da || dvadasha masah pancartavah
    | traya ime lokah | asavaditya ekavigmshah | etasmin va esha shritah | etasmin pratishthitah | ya
    evametagg ve~da | pratyeva tishthati || thsrishtikathanamukhena hotrimantraprashamsa prajapati rakamayata
    prajayeyeti | sa eta mapashyat | tena dashadha ''tmanam vi~dhaya | dashahotra 'tapyata | tasya citti
    m | tasyaitavatyeva vagasi yajnakratuh || sa catur || asrikshi va imamiti | tasya somo havirasi 'tamyat
    | sa bhuriti vyaharat | sa bhumimasrijata | agnihotra shapurnamasau yajugmshi | sa dvitiyamatapyata
    | so 'tamyat | sa bhuva iti vyaharat || masrijata | caturmasyani samani | sa tritiyamatapyata | so
    'tamyat | sa suvariti vyaharat | sa divamasrijata | agnishtoma matiratramricah | eta vai vyahritaya
    ime lokah | ima nkhalu vai lokananu prajah pashavashchandagmsi prajayanta | ya evametah prajapateh
    prathama vyahritih prajata veda || || pra prajaya pashubhi rjayate || sa pancahotara vindata | tasmai
    soma tte haviriti | sa pancahotra 'tapyata | so 'tamyat | sa pratyannabadhata | so nasrijata | tadasya
    priyamasit || ddurvarnagm hiranyamabhavat | ta ddurvarnasya hiranyasya janma | sa dvitiyamatapyata
    | so 'tamyat | sa pramabadhata | sa devanasrijata | tadasya priyamasit | ta thsuvarnagm hiranyamabhavat
    | ta thsuvarnasya hiranyasya janma | ya evagm suvarnasya hiranyasya janma veda || || suvarna atmana
    bhavati | durvarno 'sya bhratrivyah | tasma thsuvarnagm hiranya m | suvarna eva bhavati | aina ngacchati
    napriyam || sa saptahotara t || trinavena stomenaibhyo lokebhyo npranudata | trayastrigmshena pratyatishthat
    | ekavigmshena rucamadhatta || || saptadashena prajayata | ya evam thsomena yajate | saptaho lo~kameti
    | trinavena stomenaibhyo lokebhyo bhratrivyan pranudate | trayastrigmshena prati tishthati | ekavigmshena
    ruca ndhatte | saptadashena prajayate | tasma sstomo na nirhrityah | prajapati rvai saptadashah |
    prajapatimeva maddhyato dhatte praja dakshinapratigrahamantravyakhyanam deva vai varunamayajayann
    | sa yasyai yasyai devatayai dakshinamanayat | tamavlinat | te 'bruvann | vyavritya prati grihnama
    | tatha no dakshina na vle shyatiti | te vyavritya pratyagrihnann | tato vai ta ndakshina navlinat
    | ya evam vi~dvan vyavritya dakshina mpratigrihnati | naina ndakshina vlinati || tva varuno nayatu
    devi dakshine 'gnaye hiranyamityaha | agneyam vai~ hiranyam | svayaivaina ddevataya prati grihnati
    | somaya vasa ityaha | saumyam vai~ vasah | svayaivaina ddevataya prati grihnati | rudraya gamityaha
    | raudri vai gauh | svayaivaina ndevataya prati grihnati | varunayashvamityaha || || varuno va ashvah
    | svayaivaina ndevataya prati grihnati | prajapataye purushamityaha | prajapatyo vai purushah | svayaivaina
    ndevataya prati grihnati | manave talpamityaha | manavo vai talpah | svayaivaina ndevataya prati grihnati
    | uttanaya ngirasayana ityaha | iyam prati grihnati || vaishvanaryarca ratha mprati grihnati | vaishvanaro
    vai devataya rathah | svayaivaina ndevataya prati grihnati || tenamritatvamashya mityaha | amritamevatman
    dhatte || vayo datra ityaha | vaya evaina nkritva | suvargam ngamayati || mayo mahyamastu pratigrahitra
    ityaha || || yadvai shivam | tanmayah | atmana evaisha pari nkasma adadityaha | prajapatirvai kah
    | sa prajapataye dadati || kamah kamayetyaha | kamena hi dadati | kamena pratigrihnati || kamo data
    kamah prati grahitetyaha || || kamo hi data | kamah prati grahita || kamagm samudra mavishetyaha |
    samudra iva hi kamah | neva hi kamasyanto 'sti | na samudrasya || kamena tva prati grihnamityaha |
    yena kamena prati grihnati | sa evainamamushmil ~loke kama agacchati || kamaitatta esha te kama dakshinetyaha
    | kama eva ta 'mushmil ~loke dakshinamicchati | na pratigrahitari || ya evam mpratigrihnati | anrinamevaina
    pratigrahitra ityaha pratigrahitetyaha dakshinetyaha catvari ca 'hani hotrimantrah anto va esha yajnasya
    | ya ddashamamahah | dashame thsarparajniya rigbhi sstuvanti | yajnasyaivanta ngatva | annadyamavarundhate
    || tisribhih stuvanti | traya ime lokah | ebhya eva lokebhyo 'nnadyamavarundhate | prishnivati rundhate
    || manasa prastauti | manasodgayati | manasa prati harati | mana iva hi prajapatih | prajapateraptyai
    || deva vai sarpah | teshamiyagm rajni thsarparajniya rigbhi sstuvanti | asyameva prati tishthanti
    || hota vyacashte | stutamanushagmsati shantyai || anto va esha yajnasya | ya mbrahma | yaccatur hotrin
    vyacashte | yajnasyaivanta mbrahmavarundhe | tadeva prakasha ya~cchati | yajnasya dhrityai || yajamanadevatyam
    va~ ahah | bhratrivyadevatya ratrih | ahna ratri ndhyayet | bhratrivyasyaiva tallokam vri~nkte | yaddiva
    vacam vi~srijet | aharbhratrivyayocchigmshet | yannaktam vi~srijet | ratri mbhratrivyayocchigmshet
    | adhivrikshasurye vacam vi~srijati | etavantamevasmai lokamucchigmshati | yavadadityo saptahotrimantrasadhyayajnaprashamsa
    prajapatih praja asrijata | ta ssamashlishyann | ta rupenanu pravishat | tasmadahuh | rupam vai~ prajapatiriti
    | ta namna 'nu pravishat | tasmadahuh | nama vai prajapatiriti | tasmadapya 'mitrau sagantya | namna
    ceddhvayete || || mitrameva bhavatah || prajapati rdevasuranasrijata | sa indramapi nasrijata | ta
    ndeva abruvann | indra nno janayeti | sa atma mapashyat | tamasrijata | ta 'nu pravishat | tasya vajrah
    pancadasho hasta apadyata | tenodayyasuranabhya bhavat || ve~da | abhi bhratrivya nbhavati || te deva
    asurai rvijitya | suvargam 'mushmil ~loke vyakshuddhyann | te 'bruvann | amutah pradanam va~ upajijivimeti
    | te saptahotaram mprahinvann | etenamutra kalpayeti || nklriptih | yadida mmanushyeshu yajna ssaptahota
    | amutra sadbhyo devebhyo havyam 'manyata | abhi va ime nkamishyanta iti | sa vacaspate hriditi vyaharat
    | tasma tputro hridayam | tasmadasma nnabhikamayante | putro hi hridayam || hotrimantranam somayagangatvam
    deva vai catur ryajnamatanvata | te vi papmana bhratrivyenajayanta | abhi suvargam lo~kamajayann |
    ya evam ntanute | vi papmana bhratrivyena jayate | abhi suvargam tra prayaniyamasadayati | amushmai
    vai lokaya shaddhota | ghnanti khalu va eta m | yadabhishunvanti || hotra ''titthyam | yasho vai catur
    hota | yasha evatman dhatte | pancahotra pashumupa sadayati | suvargyo vai pancahota | yajamanah pashuh
    | yajamanameva suvargam grihitva saptahotara njuhoti | indriyam || indriyamevatman dhatte || yo vai
    catur ntarpayati | tripyati prajaya pashubhih | upainagm somapitho namati | bahishpavamane dashahotaram
    vya~cakshita | maddhyandine pavamane catur hotaram | arbhave pavamane pancahotaram | pitriyajne shaddhotaram
    | yajnayajniyasya stotre saptahotaram | anusavanamevainag starpayati || || tripyati prajaya pashubhih
    | upainagm somapitho namati || deva vai catur ssatramasata | riddhiparimitam 'bruvann | yannah prathamam
    ya~sha ricchat | sarvesha thsahasaditi | somashcatur hotra | agnih pancahotra | dhata shaddho rdashahotra
    | teshagm somagm rajanam ya~sha arcchat || tannyakamayata | tenapa kramat | tena pralayamacarat |
    ta ndevah praishaih praishamaicchann | tat mpraishatvam | nividbhirnyavedayann | tannivida || apribhirapnuvann
    | tadaprinamapritvam | tamaghnann | tasya yasho vyagrihnata | te graha abhavann | tadgrahana ngrahatvam
    | yasyaivam vi~dusho graha grihyante | tasya tveva grihitah || te 'bruvann | yo vai na || tamavadhishma
    | punarimagm suvamaha iti | ta rasuvanta | tacchandasa nchandastvam | samna samanayann | ta thsamnah
    samatvam | ukthai rudasthapayann | tadukthana mukthatvam | ya evam ve~da | pratyeva tishthati || ||
    sarvamayureti || somo vai yashah | ya evam thsomamagacchati | yasha evainamricchati | tasmadahuh |
    yashcaivam ve~da yashca na | tavubhau soma magacchatah | somo hi yashah | ta 'va yasha ricchatityahuh
    | ya mpraheti | tasma thsome somah procyah | yasha evainamricchati || hotrimantrotpattikathanaprasangena
    jaga va~ agre naiva kincanasi t | na dyaurasit | na prithivi | nantariksham | tadasadeva sanmano 'kuruta
    syamiti | tadatapyata | tasma tepanadudara ajayanta | ta 'tapyata | tadabhramiva samahanyata || ta
    thsamudrasya na pibanti | prajananamiva hi manyante | tasma rjayamanadapah purasta 'nvasrijyata |
    prajapatirvai dasha hota || ya eva stapyate | bhavatyeva || tadva idamapah salila || sa kasma ajni
    | ya dyasya apratishthaya iti | yadaphsva vapadyata | sa prithivyabhavat | yadvyamrishta | tadantariksha
    mudamrishta | sa dyaurabhavat | yadarodit | tadanayo rodastvam || ve~da | nasya grihe rudanti | etadva
    esham njanma | ya evamesham njanma veda | naishu loke shvartimarcchati | sa ima vi~ttva 'kamayata
    prajayeyeti | sa tapo 'ntarvanabhavat | sa jaghanadasura || tebhyo mrinmaye patre t | tamapahata |
    sa tamisra 'kamayata prajayeyeti | sa tapo nabhavat | sa prajananadeva praja asrijata | tasmadima
    bhuyishthah | prajananaddhyena asrijata || || tabhyo darumaye patre payo t | tamapahata | sa jothsna
    'bhavat || so 'kamayata prajayeyeti | satapo nabhavat | sa upapakshabhya mevartunasrijata | tebhyo
    rajate patre ghritamaduhat | ya 'kamayata prajayeyeti | sa tapo nasrijata | tebhyo harite patre somamaduhat
    | ya t | tamapahata | tadaharabhavat || || ete vai prajapaterdohah ve~da | duha eva prajah || diva
    vai no ve~da | devavaneva bhavati || etadva ahoratrana njanma | ya evamahoratrana njanma veda | nahoratreshvartimarcchati
    || 'srijyata | manah prajapati masrijata | prajapatih praja asrijata | tadva ida mpratishthitam |
    yadida nkinca | tadetacchvovasya sannama brahma || vyucchanti vyucchantyasmai vasyasi vasyasi vyucchati
    | prajayate prajaya pashubhih | pra parameshthino matra agnirajayata tadbhuyo rmaricaya udara stadabhragm
    thsa tamisra sa prajanana thsa jothsna sa upapakshabhyagm so 'horatrayo mrinmaye darumaye rajate harite
    tebhyastabhyo dve tebhyo 'vasthitasyendrasya devatadhipatitvam prajapati mprahinot | parehi | etesha
    ndeva abruvann | kastvamasi | vayam vai~ tvacchreyagmsa 'bravit | kastvamasi vayam vai~ tvacchreyagmsa
    ssma iti ma deva avocanniti || atha va ida hi prajapatau hara asit || || yadasminnaditye | tadenamabravit
    | etanme prayaccha | athahametesha rbhavishyamiti | kohagg syamityabravit | eta thsya ityabravit |
    yadetadbravishiti | ko ha vai nama prajapatih | ya evam nkritva pratyamuncat | tato va indro devana
    ve~da | adhipatireva samanana va~ akaramiti | sa candra mma ahareti pralapat | taccandramasa shcandramastvam
    | ya evam || candravaneva bhavati || ta ndeva abruvann | suviryo 'marya yatha gopayata iti | ta thsuryasya
    suryatvam | ya evam ndabhnoti || kashca nasminva idamindriya mpratyasthaditi | tadindra syendratvam
    | ya evam ve~da | indriyavyeva bhavati || parameshthinah parameshthitvam | ya evam ve~da | paramameva
    kashtha mparyavishann | vasavah purasta t | rudra dakshinatah | adityah pashcat | vishve deva uttaratah
    | angirasah pratyanca ve~da | upainagm samana vi~shanti || sa prajapatireva bhutva praja avayat |
    ta asmai natishthantannadyaya | ta mukha pashyantih | dakshinatah paryayann | sa dakshinatah paryavartayata
    | ta mukha paryayann | sa pashcat paryavartayata | ta mukha mpashcat | uttaratah paryayann | sa uttaratah
    paryavartayata | ta mukha || mukhamuttaratah | urdhva udayann | sa uparishtannya ssarvatomukho bhutva
    ''vayat | tato vai tasmai praja atishthantannadyaya || ya evam npari ca vartayate ni ca | prajapatireva
    bhutva praja atti | tishthante 'smai praja annadyaya | annada eva bhavati || ndriyavyeva bhavati mpurusharthaprayogah
    prajapati thsyamiti | sa eta mprayunkta | tasya prayukti bahorbhuyanabhavat | yah kamayeta bahorbhuya
    thsyamiti | sa dashahotara mprayunjita | bahoreva bhuya 'kamayata viro ma ajayeteti | sa dashahotushcatur
    || tasya prayuktindro 'jayata | yah kamayeta viro ma ajayeteti | sa catur 'sya viro jayate || so thsyamiti
    | sa catur mprayunkta | tasya prayukti pashumanabhavat | yah kamayeta pashuman thsyamiti | sa pancahotara
    || pashumaneva bhavati || so 'kamayatartavo me kalperanniti | sa pancahotu mprayunkta | tasya prayuktyritavo
    'sma akalpanta | yah kamayetartavo me kalperanniti | sa shaddhotara mprayunjita | kalpante ssomayaji
    jayeteti || mprayunkta | tasya prayukti somapa ssomayajyabhavat | a ssomayajyajayata | yah kamayeta
    somapa ssomayaji jayeteti | sa saptahotara mprayunjita | somapa eva somayaji bhavati | a ssomayaji
    jayate || sa va esha pashuh pancadha prati tishthati || || padbhirmukhena || te devah pashun vittva
    | suvargam 'mushmil ~loke vyakshuddhyann | te 'bruvann | amutah pradanam va~ upajijivimeti | te saptahotaram
    mprahinvann | etenamutra kalpayeti | tasya va iya mmanushyeshu yajna ssaptahota | amutra sadbhyo devebhyo
    havyam ya~jno namati || yo vai catur nbhavati | agnihotram m | darshapurnamasau catur hotuh | caturmasyani
    panca hotuh | pashubandha shshaddhotuh | saumyo ssaptahotuh | etadvai catur rnidanagm sapta ca prajapatirakamayata
    praja prajapatirakamayata dar shapurnamasau srijeyeti prajapatirakamayata prajayeyeti sa tapa prajapatirakamayata
    dashahotara prajapatirindram prajapatirakamayata bahorbhuyanekadasha r yadasminnaditye || harih om
    || || krishna yajurvediya taittiriya brahmane dvitiyashtake dvitiyah prapathaka
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय ब्राह्मणे द्वितीयाष्टके द्वितीयः प्रपाठकः श्री गुरुभ्यो नमः ।
