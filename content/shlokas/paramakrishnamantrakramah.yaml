id: paramakrishnamantrakramah
category: mantra
name:
  english: paramakrishnamantrakramah
  devanagari: परमकृष्णमन्त्रक्रमः
content:
  english: '|| karanyasah || om klam angushthabhyam namah | om klim tarjanibhyam namah | om klum madhyamabhyam
    namah | om klaim anamikabhyam namah | om klaum kanishthikabhyam namah | om klah karatalakaraprishthabhyam
    namah || || shadanganyasah || om klam hridayaya namah | om klim shirase svaha | om klum shikhayai
    vashat | om klaim kavacaya hum | om klaum netratrayaya vaushat | om klah astraya phat || iti shriparamakrishnamantrakramah
    sampurnah |'
  devanagari: ॥ करन्यासः ॥ ॐ क्लां अङ्गुष्ठाभ्यां नमः । ॐ क्लीं तर्जनीभ्यां नमः । ॐ क्लूं मध्यमाभ्यां
    नमः । ॐ क्लैं अनामिकाभ्यां नमः । ॐ क्लौं कनिष्ठिकाभ्यां नमः । ॐ क्लः करतलकरपृष्ठाभ्यां नमः ॥ ॥ षडङ्गन्यासः
    ॥ ॐ क्लां हृदयाय नमः । ॐ क्लीं शिरसे स्वाहा । ॐ क्लूं शिखायै वषट् । ॐ क्लैं कवचाय हुं । ॐ क्लौं नेत्रत्रयाय
    वौषट् । ॐ क्लः अस्त्राय फट् ॥ इति श्रीपरमकृष्णमन्त्रक्रमः सम्पूर्णः ।
meaning: {}
