id: shricandrashekharashtakam
category: stotram
name:
  english: shricandrashekharashtakam
  devanagari: श्रीचन्द्रशेखराष्टकम्
content:
  english: candrashekhara candrashekhara candrashekhara pahimam | candrashekhara candrashekhara candrashekhara
    rakshamam || 1|| ratnasanusharasanam rajatadishringaniketanam sinjinikritapannageshvaramacyutananasayakam
    | kshipradaghapuratrayam tridivalayaibhivanditam candrashekharamashraye mama kim karishyati vai yamah
    || 2|| pancapadapapushpagandhapadambujaduyashobhitam bhalalocanajatapavakadagdhamanmathavigraham |
    bhasmadigdhakalevaram bhavanashanam bhavamavyayam candrashekhara candrashekhara candrashekhara rakshamam
    || 3|| mattvaranamukhyacarmakritottarimanoharam pankajasanapadmalocanapujitanghrisaroruham | devasindhutarangasikara
    siktashubhrajatadharam candrashekhara candrashekhara candrashekhara rakshamam || 4|| yaksharajasakham
    bhagakshaharam bhujangavibhushanam shailarajasuta parishkrita caruvamakalevaram | kshvedanilagalam
    parashvadhadharinam mrigadharinam candrashekhara candrashekhara candrashekhara rakshamam || 5|| kundalikritakundaleshvarakundalam
    vrishavahanam naradadimunishvarastutavaibhavam bhuvaneshvaram | andhakandhakama shrita marapadapam
    shamanantakam candrashekhara candrashekhara candrashekhara rakshamam || 6|| bhashajam bhavaroginamakhilapadamapaharinam
    dakshayajnarvinashanam trigunatmakam trivilocanam | bhuktimuktaphalapradam sakalaghasanghanivarhanam
    candrashekhara candrashekhara candrashekhara rakshamam || 7|| bhakta vatsalamacintam nidhimakshayam
    haridamvaram sarvabhutapatim paratpara prameyamanuttamam | somavarija bhuhutashanasomapanilakhakritim
    candrashekhara candrashekhara candrashekhara rakshamam || 8|| vishvasrishtividhalinam punareva palanatatparam
    samharantamapi prapancama sheshalokanivasinam | kridayantamaharnisham gananathayutha samanvitam candrashekhara
    candrashekara candrashekara rakshamam || 9|| mrityubhitamrikandasunukritastava shiva sannidhau yatra
    kutra ca pathennahi tasya mrityubhayam bhavet | purnamayurarogitamakhilatha sampadamadaram candrashekhara
    eva tasya dadati muktimayatnatah || 10|| ||| iti candrashekharashtakam ||
  devanagari: चन्द्रशेखर चन्द्रशेखर चन्द्रशेखर पाहिमाम् । चन्द्रशेखर चन्द्रशेखर चन्द्रशेखर रक्षमाम् ॥
    १॥ रत्नसानुशरासनं रजतादिशृङ्गनिकेतनं सिञ्जिनीकृतपन्नगेश्वरमच्युताननसायकम् । क्षिप्रदघपुरत्रयं त्रिदिवालयैभिवन्दितं
    चन्द्रशेखरमाश्रये मम किं करिष्यति वै यमः ॥ २॥ पञ्चपादपपुष्पगन्धपदाम्बुजदूयशोभितं भाललोचनजातपावकदग्धमन्मथविग्रहं
    । भस्मदिग्धकलेवरं भवनाशनं भवमव्ययं चन्द्रशेखर चन्द्रशेखर चन्द्रशेखर रक्षमाम् ॥ ३॥ मत्त्वारणमुख्यचर्मकृतोत्तरीमनोहरं
    पङ्कजासनपद्मलोचनपुजिताङ्घ्रिसरोरुहम् । देवसिन्धुतरङ्गसीकर सिक्तशुभ्रजटाधरं चन्द्रशेखर चन्द्रशेखर चन्द्रशेखर
    रक्षमाम् ॥ ४॥ यक्षराजसखं भगाक्षहरं भुजङ्गविभूषणं शैलराजसुता परिष्कृत चारुवामकलेवरम् । क्ष्वेडनीलगलं
    परश्वधधारिणं मृगधारिणं चन्द्रशेखर चन्द्रशेखर चन्द्रशेखर रक्षमाम् ॥ ५॥ कुण्डलीकृतकुण्डलेश्वरकुण्डलं
    वृषवाहनं नारदादिमुनीश्वरस्तुतवैभवं भुवनेश्वरम् । अन्धकान्धकामा श्रिता मरपादपं शमनान्तकं चन्द्रशेखर
    चन्द्रशेखर चन्द्रशेखर रक्षमाम् ॥ ६॥ भषजं भवरोगिणामखिलापदामपहारिणं दक्षयज्ञर्विनाशनं त्रिगुणात्मकं
    त्रिविलोचनम् । भुक्तिमुक्तफलप्रदं सकलाघसङ्घनिवर्हनं चन्द्रशेखर चन्द्रशेखर चन्द्रशेखर रक्षमाम् ॥ ७॥
    भक्त वत्सलमचिञ्तं निधिमक्षयं हरिदम्वरं सर्वभूतपतिं परात्पर प्रमेयमनुत्तमम् । सोमवारिज भूहुताशनसोमपानिलखाकृतिं
    चन्द्रशेखर चन्द्रशेखर चन्द्रशेखर रक्षमाम् ॥ ८॥ विश्वसृष्टिविधालिनं पुनरेव पालनतत्परं संहरन्तमपि प्रपञ्चम
    शेषलोकनिवासिनम् । क्रिडयन्तमहर्निशं गणनाथयूथ समन्वितं चन्द्रशेखर चन्द्रशेकर चन्द्रशेकर रक्षमाम् ॥
    ९॥ मृत्युभीतमृकण्डसूनुकृतस्तव शिव सन्निधौ यत्र कुत्र च पठेन्नहि तस्य मृत्युभयं भवेत् । पूर्णमायुररोगितामखिलाथ
    सम्पदमादरं चन्द्रशेखर एव तस्य ददाति मुक्तिमयत्नतः ॥ १०॥ ॥। इति चन्द्रशेखराष्टकम् ॥
