id: brahmakritam12vishnustotram
category: stotram
name:
  english: brahmakritam12vishnustotram
  devanagari: ब्रह्मकृतं१२विष्णुस्तोत्रम्
content:
  english: brahmakritam 12 vishnustotram vishvavasurvishvamurtirvishvesho vishvakseno vishvakarma vashi
    ca | vishveshvaro vasudevo'si tasmadyogatmanam daivatam tvamupaimi || 42|| jaya vishva mahadeva jaya
    lokahite rata | jaya yogishvara vibho jaya yogaparavara || 43|| padmagarbha vishalaksha jaya lokeshvareshvara
    | bhutabhavyabhavannatha jaya saumyatmajatmaja || 44|| asankhyeyagunajeya jaya sarvaparayana | narayana
    sudushpara jaya sharngadhanurdhara || 45|| sarvaguhyagunopeta vishvamurte niramaya | vishveshvara
    mahabaho jaya lokarthatatpara || 46|| mahoraga varahadya harikesha vibho jaya | harivasa vishamisha
    vishvavasamitavyaya || 47|| vyaktavyaktamitasthana niyatendriya sendriya | asankhyeyatmabhavajna jaya
    gambhira kamada || 48|| ananta viditaprajna nityam bhutavibhavana | kritakarya kritaprajna dharmajna
    vijayajaya || 49|| guhyatmansarvabhutatmansphutasambhutasambhava | bhutarthatattva lokesha jaya bhutavibhavana
    || 50|| atmayone mahabhaga kalpasankshepatatpara | udbhavana manodbhava jaya brahmajanapriya || 51||
    nisargasargabhirata kamesha parameshvara | amritodbhava sadbhava yugagne vijayaprada || 52|| prajapatipate
    deva padmanabha mahabala | atmabhuta mahabhuta karmatmanjaya karmada || 53|| padau tava dhara devi
    disho bahurdivam shirah | murtiste'ham surah kayashcandradityau ca cakshushi || 54|| balam tapashca
    satyam ca dharmah kamatmajah prabho | tejo'gnih pavanah shvasa apaste svedasambhavah || 55|| ashvinau
    shravanau nityam devi jihva sarasvati | vedah samskaranishtha hi tvayidam jagadashritam || 56|| na
    sankhyam na parimanam na tejo na parakramam | na balam yogayogisha janimaste na sambhavam || 57||
    tvadbhaktinirata deva niyamaistvam samahitah | arcayamah sada vishno paramesham maheshvaram || 58||
    rishayo devagandharva yaksharakshasapannagah | pishaca manushashcaiva mrigapakshisarisripah || 59||
    evamadi maya srishtam prithivyam tvatprasadajam | padmanabha vishalaksha krishna duhsvapnanashana
    || 60|| tvam gatih sarvabhutanam tvam neta tvam jaganmukham | tvatprasadena devesha sukhino vibudhah
    sada || 61|| prithivi nirbhaya deva tvatprasadatsadabhavat | tasmadbhava vishalaksha yaduvamshavivardhanah
    || 62|| dharmasamsthapanarthaya daiteyanam vadhaya ca | jagato dharanarthaya vijnapyam kuru me prabho
    || 63|| yadetatparamam guhyam tvatprasadamayam vibho | vasudeva tadetatte mayodgitam yathatatham ||
    64|| srishtva sankarshanam devam svayamatmanamatmana | krishna tvamatmanasrakshih pradyumnam catmasambhavam
    || 65|| pradyumnaccaniruddham tvam yam vidurvishnumavyayam | aniruddho'srijanmam vai brahmanam lokadharinam
    || 66|| vasudevamayah so'ham tvayaivasmi vinirmitah | vibhajya bhagasho''tmanam vraja manushatam vibho
    || 67|| tatrasuravadham kritva sarvalokasukhaya vai | dharmam sthapya yashah prapya yogam prapsyasi
    tattvatah || 68|| tvam hi brahmarshayo loke devashcamitavikrama | taistaishca namabhirbhakta gayanti
    paramatmakam || 69|| sthitashca sarve tvayi bhutasanghah kritva''shrayam tvam varadam subaho | anadimadhyantamaparayogam
    lokasya setum pravadanti viprah || 70|| iti mahabharate bhishmaparvani 33 adhyayantargatam brahmakritam
    vishnustotram sampurnam | mahabharata | bhishmaparva | adhyaya 61
  devanagari: ब्रह्मकृतं १२ विष्णुस्तोत्रम् विश्वावसुर्विश्वमूर्तिर्विश्वेशो विष्वक्सेनो विश्वकर्मा वशी
    च । विश्वेश्वरो वासुदेवोऽसि तस्माद्योगात्मानं दैवतं त्वामुपैमि ॥ ४२॥ जय विश्व महादेव जय लोकहिते रत
    । जय योगीश्वर विभो जय योगपरावर ॥ ४३॥ पद्मगर्भ विशालाक्ष जय लोकेश्वरेश्वर । भूतभव्यभवन्नाथ जय सौम्यात्मजात्मज
    ॥ ४४॥ असङ्ख्येयगुणाजेय जय सर्वपरायण । नारायण सुदुष्पार जय शार्ङ्गधनुर्धर ॥ ४५॥ सर्वगुह्यगुणोपेत विश्वमूर्ते
    निरामय । विश्वेश्वर महाबाहो जय लोकार्थतत्पर ॥ ४६॥ महोरग वराहाद्य हरिकेश विभो जय । हरिवास विशामीश विश्वावासामिताव्यय
    ॥ ४७॥ व्यक्ताव्यक्तामितस्थान नियतेन्द्रिय सेन्द्रिय । असङ्ख्येयात्मभावज्ञ जय गम्भीर कामद ॥ ४८॥ अनन्त
    विदितप्रज्ञ नित्यं भूतविभावन । कृतकार्य कृतप्रज्ञ धर्मज्ञ विजयाजय ॥ ४९॥ गुह्यात्मन्सर्वभूतात्मन्स्फुटसम्भूतसम्भव
    । भूतार्थतत्त्व लोकेश जय भूतविभावन ॥ ५०॥ आत्मयोने महाभाग कल्पसङ्क्षेपतत्पर । उद्भावन मनोद्भाव जय ब्रह्मजनप्रिय
    ॥ ५१॥ निसर्गसर्गाभिरत कामेश परमेश्वर । अमृतोद्भव सद्भाव युगाग्ने विजयप्रद ॥ ५२॥ प्रजापतिपते देव पद्मनाभ
    महाबल । आत्मभूत महाभूत कर्मात्मञ्जय कर्मद ॥ ५३॥ पादौ तव धरा देवी दिशो बाहुर्दिवं शिरः । मूर्तिस्तेऽहं
    सुराः कायश्चन्द्रादित्यौ च चक्षुषी ॥ ५४॥ बलं तपश्च सत्यं च धर्मः कामात्मजः प्रभो । तेजोऽग्निः पवनः
    श्वास आपस्ते स्वेदसम्भवाः ॥ ५५॥ अश्विनौ श्रवणौ नित्यं देवी जिह्वा सरस्वती । वेदाः संस्कारनिष्ठा हि
    त्वयीदं जगदाश्रितम् ॥ ५६॥ न सङ्ख्यां न परीमाणं न तेजो न पराक्रमम् । न बलं योगयोगीश जानीमस्ते न सम्भवम्
    ॥ ५७॥ त्वद्भक्तिनिरता देव नियमैस्त्वां समाहिताः । अर्चयामः सदा विष्णो परमेशं महेश्वरम् ॥ ५८॥ ऋषयो
    देवगन्धर्वा यक्षराक्षसपन्नगाः । पिशाचा मानुषाश्चैव मृगपक्षिसरीसृपाः ॥ ५९॥ एवमादि मया सृष्टं पृथिव्यां
    त्वत्प्रसादजम् । पद्मनाभ विशालाक्ष कृष्ण दुःस्वप्ननाशन ॥ ६०॥ त्वं गतिः सर्वभूतानां त्वं नेता त्वं
    जगन्मुखम् । त्वत्प्रसादेन देवेश सुखिनो विबुधाः सदा ॥ ६१॥ पृथिवी निर्भया देव त्वत्प्रसादात्सदाभवत्
    । तस्माद्भव विशालाक्ष यदुवंशविवर्धनः ॥ ६२॥ धर्मसंस्थापनार्थाय दैतेयानां वधाय च । जगतो धारणार्थाय विज्ञाप्यं
    कुरु मे प्रभो ॥ ६३॥ यदेतत्परमं गुह्यं त्वत्प्रसादमयं विभो । वासुदेव तदेतत्ते मयोद्गीतं यथातथम् ॥ ६४॥
    सृष्ट्वा सङ्कर्षणं देवं स्वयमात्मानमात्मना । कृष्ण त्वमात्मनास्राक्षीः प्रद्युम्नं चात्मसम्भवम् ॥
    ६५॥ प्रद्युम्नाच्चानिरुद्धं त्वं यं विदुर्विष्णुमव्ययम् । अनिरुद्धोऽसृजन्मां वै ब्रह्माणं लोकधारिणम्
    ॥ ६६॥ वासुदेवमयः सोऽहं त्वयैवास्मि विनिर्मितः । विभज्य भागशोऽऽत्मानं व्रज मानुषतां विभो ॥ ६७॥ तत्रासुरवधं
    कृत्वा सर्वलोकसुखाय वै । धर्मं स्थाप्य यशः प्राप्य योगं प्राप्स्यसि तत्त्वतः ॥ ६८॥ त्वां हि ब्रह्मर्षयो
    लोके देवाश्चामितविक्रम । तैस्तैश्च नामभिर्भक्ता गायन्ति परमात्मकम् ॥ ६९॥ स्थिताश्च सर्वे त्वयि भूतसङ्घाः
    कृत्वाऽऽश्रयं त्वां वरदं सुबाहो । अनादिमध्यान्तमपारयोगं लोकस्य सेतुं प्रवदन्ति विप्राः ॥ ७०॥ इति महाभारते
    भीष्मपर्वणि ३३ अध्यायान्तर्गतं ब्रह्मकृतं विष्णुस्तोत्रं सम्पूर्णम् । महाभारत । भीष्मपर्व । अध्याय
    ६१
