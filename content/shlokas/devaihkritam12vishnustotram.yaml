id: devaihkritam12vishnustotram
category: stotram
name:
  english: devaihkritam12vishnustotram
  devanagari: देवैःकृतं१२विष्णुस्तोत्रम्
content:
  english: devaih kritam 12 vishnustotram deva ucuh | jaya deva jagannatha daityasuravimarddana | varaharupamasthaya
    uddhrita vasudha tvaya || 22|| uddhrita matsyarupena veda udadhimadhyatah | kurmarupi tatha bhutva
    kshirodarnavamanthanam || 23|| kritva tvaya jagannatha uddhrita shrirnamo'stu te | shripatih shridharo
    deva arttanamartinashanah || 24|| balirvamanarupena tvaya baddho'surarina | hiranyaksho mahadaityo
    hiranyakashipurhatah || 25|| narasimhena rupena antarikshe dhritastvaya | devamulam mahadeva uddhritam
    bhuvanam tvaya || 26|| tvaya vina jagannatha bhuvanam nishprabhikritam | suryeneva tu vikrantam tamobhiriva
    danavaih || 27|| iti shriskandapurane prabhasakhande prabhasakshetramahatmye ekashititamadhyayantargatam
    devaih kritam vishnustotram samaptam | skandapurana | prabhasakhanda | adhyaya 81
  devanagari: देवैः कृतं १२ विष्णुस्तोत्रम् देवा ऊचुः । जय देव जगन्नाथ दैत्यासुरविमर्द्दन । वाराहरूपमास्थाय
    उद्धृता वसुधा त्वया ॥ २२॥ उद्धृता मत्स्यरूपेण वेदा उदधिमध्यतः । कूर्मरूपी तथा भूत्वा क्षीरोदार्णवमन्थनम्
    ॥ २३॥ कृत्वा त्वया जगन्नाथ उद्धृता श्रीर्नमोऽस्तु ते । श्रीपतिः श्रीधरो देव आर्त्तानामर्तिनाशनः ॥
    २४॥ बलिर्वामनरूपेण त्वया बद्धोऽसुरारिणा । हिरण्याक्षो महादैत्यो हिरण्यकशिपुर्हतः ॥ २५॥ नारसिंहेन रूपेण
    अन्तरिक्षे धृतस्त्वया । देवमूलं महादेव उद्धृतं भुवनं त्वया ॥ २६॥ त्वया विना जगन्नाथ भुवनं निष्प्रभीकृतम्
    । सूर्येणेव तु विक्रान्तं तमोभिरिव दानवैः ॥ २७॥ इति श्रीस्कन्दपुराणे प्रभासखण्डे प्रभासक्षेत्रमाहात्म्ये
    एकाशीतितमाध्यायान्तर्गतं देवैः कृतं विष्णुस्तोत्रं समाप्तम् । स्कन्दपुराण । प्रभासखण्ड । अध्याय ८१
