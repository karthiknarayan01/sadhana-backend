id: dwadasa-jyotirlinga-stotram
category: stotram
name:
  english: Dwadasa Jyotirlinga Stotram
  devanagari: द्वादशज्योतिर्लिङ्गस्तोत्रम् (शङ्कराचार्यविरचितम्)
content:
  english: saurashtradeshe vish ade'tiramye jyotirmayam candrakalavatamsam | (saurashtradeshe vasudhavakashe)
    bhaktipradanaya kripavatirnam tam somanatham sharanam prapadye || 1|| (kritavataram tam) shrishailashringe
    vibudhatisange tuladritunge'pi muda vasantam | (shrishailashringe vividhaprasange sheshadrishringe'pi
    sadavasantam ) tamarjunam mallikapurvamekam namami samsarasamudrasetum || 2|| (purvamenam) avantikayam
    vihitavataram muktipradanaya ca sajjananam | akalamrityoh parirakshanartham vande mahakalamahasuresham
    || 3|| kaverikanarmadayoh pavitre samagame sajjanataranaya | sadaiva mandhatripure vasantam onkaramisham
    shivamekamide || 4|| purvottare prajvalikanidhane sadashivam tam girijasametam | (paralikabhidhane)
    surasuraradhitapadapadmam shrivaidyanatham tamaham namami || 5|| (satatam namami) yamye sadange nagare'tiramye
    vibhushitangam vividhaishca bhogaih | (amardasajne nagareca ramye) sadbhuktimuktipradamishamekam shrinaganatham
    sharanam prapadye || 6|| (pradamekamisham) mahadriparshve ca tate ramantam sampujyamanam satatam munindraih
    | (himadriparshve) surasurairyaksha mahoragadhyaih kedaramisham shivamekamide || 7|| (mahoragadyaih
    kedarasajnam) sahyadrishirshe vimale vasantam godavaritirapavitradeshe | (simhadriparshve'pi tate
    ramante) yaddharshanatpatakamashu nasham prayati tam tryambakamishamide || 8|| (yaddharshanatpatakajatanashah
    prajayate) sutamraparnijalarashiyoge nibadhya setum vishikhairasankhyaih | (shritamramarnim jalarashiyoge
    nibadhya setum nishi bilvapatraih) shriramacandrena samarpitam tam rameshvarakhyam niyatam namami
    || 9|| (samarcitam tam, satatam namami) yam dakinishakinikasamaje nishevyamanam pishitashanaishca
    | (yo) sadaiva bhimadipadaprasiddham tam shankaram bhaktahitam namami || 10|| sanandamanandavane vasantamanandakandam
    hatapapavrindam | varanasinathamanathanatham shrivishvanatham sharanam prapadye || 11|| ilapure ramyavishalake'smin
    samullasantam ca jagadvarenyam | (elapuriramya shivalaye'smin, trijagadvarenyam) vande mahodaratarasvabhavam
    ghrishneshvarakhyam sharanam prapadye || 12|| (sadashivam tam vishaneshvarakhyam) jyotirmayadvadashalingakanam
    shivatmanam proktamidam kramena | stotram pathitva manujo'tibhaktya phalam tadalokya nijam bhajecca
    || (etani lingani sadaiva martyah pratah pathanto'malamanasashca | te putrapautraishca dhanairudaraih
    satkirti bhajah sukhino bhavanti ||) || iti shrimadshankaracaryaviracitam dvadashajyotirlingastotram
    sampurnam ||
  devanagari: सौराष्ट्रदेशे विश् अदेऽतिरम्ये ज्योतिर्मयं चन्द्रकलावतंसम् । (सौराष्ट्रदेशे वसुधावकाशे)
    भक्तिप्रदानाय कृपावतीर्णं तं सोमनाथं शरणं प्रपद्ये ॥ १॥ (कृतावतारं तं) श्रीशैलशृङ्गे विबुधातिसङ्गे
    तुलाद्रितुङ्गेऽपि मुदा वसन्तम् । (श्रीशैलशृङ्गे विविधप्रसङ्गे शेषाद्रिशृङ्गेऽपि सदावसन्तम् ) तमर्जुनं
    मल्लिकपूर्वमेकं नमामि संसारसमुद्रसेतुम् ॥ २॥ (पूर्वमेनं) अवन्तिकायां विहितावतारं मुक्तिप्रदानाय च
    सज्जनानाम् । अकालमृत्योः परिरक्षणार्थं वन्दे महाकालमहासुरेशम् ॥ ३॥ कावेरिकानर्मदयोः पवित्रे समागमे
    सज्जनतारणाय । सदैव मान्धातृपुरे वसन्तं ओङ्कारमीशं शिवमेकमीडे ॥ ४॥ पूर्वोत्तरे प्रज्वलिकानिधाने सदाशिवं
    तं गिरिजासमेतम् । (पारलिकाभिधाने) सुरासुराराधितपादपद्मं श्रीवैद्यनाथं तमहं नमामि ॥ ५॥ (सततं नमामि)
    याम्ये सदङ्गे नगरेऽतिरम्ये विभूषिताङ्गं विविधैश्च भोगैः । (आमर्दसज्ञे नगरेच रम्ये) सद्भुक्तिमुक्तिप्रदमीशमेकं
    श्रीनागनाथं शरणं प्रपद्ये ॥ ६॥ (प्रदमेकमीशं) महाद्रिपार्श्वे च तटे रमन्तं सम्पूज्यमानं सततं मुनीन्द्रैः
    । (हिमाद्रिपार्श्वे) सुरासुरैर्यक्ष महोरगाढ्यैः केदारमीशं शिवमेकमीडे ॥ ७॥ (महोरगाद्यैः केदारसज्ञं)
    सह्याद्रिशीर्षे विमले वसन्तं गोदावरितीरपवित्रदेशे । (सिम्हाद्रिपार्श्वेऽपि तटे रमन्ते) यद्धर्शनात्पातकमाशु
    नाशं प्रयाति तं त्र्यम्बकमीशमीडे ॥ ८॥ (यद्धर्शनात्पातकजातनाशः प्रजायते) सुताम्रपर्णीजलराशियोगे निबध्य
    सेतुं विशिखैरसङ्ख्यैः । (श्रीताम्रमर्णीं जलराशियोगे निबध्य सेतुं निशि बिल्वपत्रैः) श्रीरामचन्द्रेण
    समर्पितं तं रामेश्वराख्यं नियतं नमामि ॥ ९॥ (समर्चितं तं, सततं नमामि) यं डाकिनिशाकिनिकासमाजे निषेव्यमाणं
    पिशिताशनैश्च । (यो) सदैव भीमादिपदप्रसिद्धं तं शङ्करं भक्तहितं नमामि ॥ १०॥ सानन्दमानन्दवने वसन्तमानन्दकन्दं
    हतपापवृन्दम् । वाराणसीनाथमनाथनाथं श्रीविश्वनाथं शरणं प्रपद्ये ॥ ११॥ इलापुरे रम्यविशालकेऽस्मिन् समुल्लसन्तं
    च जगद्वरेण्यम् । (एलापुरीरम्य शिवालयेऽस्मिन्, त्रिजगद्वरेण्यम्) वन्दे महोदारतरस्वभावं घृष्णेश्वराख्यं
    शरणम् प्रपद्ये ॥ १२॥ (सदाशिवं तं विषणेश्वराख्यम्) ज्योतिर्मयद्वादशलिङ्गकानां शिवात्मनां प्रोक्तमिदं
    क्रमेण । स्तोत्रं पठित्वा मनुजोऽतिभक्त्या फलं तदालोक्य निजं भजेच्च ॥ (एतानि लिङ्गानि सदैव मर्त्याः
    प्रातः पठन्तोऽमलमानसाश्च । ते पुत्रपौत्रैश्च धनैरुदारैः सत्कीर्ति भाजः सुखिनो भवन्ति ॥) ॥ इति श्रीमद्शङ्कराचार्यविरचितं
    द्वादशज्योतिर्लिङ्गस्तोत्रं सम्पूर्णम् ॥
