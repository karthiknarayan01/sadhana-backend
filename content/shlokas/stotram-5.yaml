id: stotram-5
category: stotram
name:
  english: stotram
  devanagari: स्तोत्रम्
content:
  english: tarashatanamavalih brihannilatantrantargata om tarinyai namah | om tarasamyogayai namah | om
    mahatarasvarupinyai namah | om tarakapranahartryai namah | om taranandasvarupinyai namah | om mahanilayai
    namah | om maheshanyai namah | om mahanilasarasvatyai namah | om ugratarayai namah | om satyai namah
    | om sadhvyai namah | om bhavanyai namah | om bhavamocinyai namah | om mahashankharatayai namah |
    om bhimayai namah | om shankaryai namah | om shankarapriyayai namah | om mahadanaratayai namah | om
    candyai namah | om candasuravinashinyai namah | 20 om candravadrupavadanayai namah | om carucandramahojjvalayai
    namah | om ekajatayai namah | om kurangakshyai namah | om varadabhayadayinyai namah | om mahakalyai
    namah | om mahadevyai namah | om guhyakalyai namah | om varapradayai namah | om mahakalaratayai namah
    | om sadhvyai namah | om mahaishvaryapradayinyai namah | om muktidayai namah | om svargadayai namah
    | om saumyayai namah | om saumyarupayai namah | om surarihayai namah | om shathavijnayai namah | om
    mahanadayai namah | om kamalayai namah | 40 om bagalamukhyai namah | om mahamuktipradayai namah |
    om kalyai namah | om kalaratrisvarupinyai namah | om sarasvatyai namah | om saricshreshthayai namah
    | om svargangayai namah | om svargavasinyai namah | om himalayasutayai namah | om kanyayai namah |
    om kanyarupavilasinyai namah | om shavoparisamasinayai namah | om mundamalavibhushitayai namah | om
    digambarayai namah | om patiratayai namah | om viparitarataturayai namah | om rajasvalayai namah |
    om rajahpritayai namah | om svayambhukusumapriyayai namah | om svayambhukusumapranayai namah | 60
    om svayambhukusumotsukayai namah | om shivapranayai namah | om shivaratayai namah | om shivadatryai
    namah | om shivasanayai namah | om attahasayai namah | om ghorarupayai namah | om nityanandasvarupinyai
    namah | om meghavarnayai namah | om kishoryai namah | om yuvatistanakunkumayai namah | om kharvayai
    namah | om kharvajanapritayai namah | om manibhushitamandanayai namah | om kinkinishabdasamyuktayai
    namah | om nrityantyai namah | om raktalocanayai namah | om krishangyai namah | om krisarapritayai
    namah | om sharasanagatotsukayai namah | 80 om kapalakharparadharayai namah | om pancashanmundamalikayai
    namah | om havyakavyapradayai namah | om tushtyai namah | om pushtyai namah | om varanganayai namah
    | om shantyai namah | om kshantyai namah | om manase namah | om buddhyai namah | om sarvabijasvarupinyai
    namah | om ugrapatarinyai namah | om tirnayai namah | om nistirnagunavrindakayai namah | om rameshyai
    namah | om ramanyai namah | om ramyayai namah | om ramanandasvarupinyai namah | om rajanikarasampurnayai
    namah | om raktotpalavilocanayai namah | 100 iti brihannilatantrantargata tarashatanamavalih samapta
    |
  devanagari: ताराशतनामावलिः बृहन्नीलतन्त्रान्तर्गता ॐ तारिण्यै नमः । ॐ तारसंयोगायै नमः । ॐ महातारस्वरूपिण्यै
    नमः । ॐ तारकप्राणहर्त्र्यै नमः । ॐ तारानन्दस्वरूपिण्यै नमः । ॐ महानीलायै नमः । ॐ महेशान्यै नमः । ॐ
    महानीलसरस्वत्यै नमः । ॐ उग्रतारायै नमः । ॐ सत्यै नमः । ॐ साध्व्यै नमः । ॐ भवान्यै नमः । ॐ भवमोचिन्यै
    नमः । ॐ महाशङ्खरतायै नमः । ॐ भीमायै नमः । ॐ शाङ्कर्यै नमः । ॐ शङ्करप्रियायै नमः । ॐ महादानरतायै नमः
    । ॐ चण्ड्यै नमः । ॐ चण्डासुरविनाशिन्यै नमः । २० ॐ चन्द्रवद्रूपवदनायै नमः । ॐ चारुचन्द्रमहोज्ज्वलायै
    नमः । ॐ एकजटायै नमः । ॐ कुरङ्गाक्ष्यै नमः । ॐ वरदाभयदायिन्यै नमः । ॐ महाकाल्यै नमः । ॐ महादेव्यै नमः
    । ॐ गुह्यकाल्यै नमः । ॐ वरप्रदायै नमः । ॐ महाकालरतायै नमः । ॐ साध्व्यै नमः । ॐ महैश्वर्यप्रदायिन्यै
    नमः । ॐ मुक्तिदायै नमः । ॐ स्वर्गदायै नमः । ॐ सौम्यायै नमः । ॐ सौम्यरूपायै नमः । ॐ सुरारिहायै नमः
    । ॐ शठविज्ञायै नमः । ॐ महानादायै नमः । ॐ कमलायै नमः । ४० ॐ बगलामुख्यै नमः । ॐ महामुक्तिप्रदायै नमः
    । ॐ काल्यै नमः । ॐ कालरात्रिस्वरूपिण्यै नमः । ॐ सरस्वत्यै नमः । ॐ सरिच्श्रेष्ठायै नमः । ॐ स्वर्गङ्गायै
    नमः । ॐ स्वर्गवासिन्यै नमः । ॐ हिमालयसुतायै नमः । ॐ कन्यायै नमः । ॐ कन्यारूपविलासिन्यै नमः । ॐ शवोपरिसमासीनायै
    नमः । ॐ मुण्डमालाविभूषितायै नमः । ॐ दिगम्बरायै नमः । ॐ पतिरतायै नमः । ॐ विपरीतरतातुरायै नमः । ॐ रजस्वलायै
    नमः । ॐ रजःप्रीतायै नमः । ॐ स्वयम्भूकुसुमप्रियायै नमः । ॐ स्वयम्भूकुसुमप्राणायै नमः । ६० ॐ स्वयम्भूकुसुमोत्सुकायै
    नमः । ॐ शिवप्राणायै नमः । ॐ शिवरतायै नमः । ॐ शिवदात्र्यै नमः । ॐ शिवासनायै नमः । ॐ अट्टहासायै नमः
    । ॐ घोररूपायै नमः । ॐ नित्यानन्दस्वरूपिण्यै नमः । ॐ मेघवर्णायै नमः । ॐ किशोर्यै नमः । ॐ युवतीस्तनकुङ्कुमायै
    नमः । ॐ खर्वायै नमः । ॐ खर्वजनप्रीतायै नमः । ॐ मणिभूषितमण्डनायै नमः । ॐ किङ्किणीशब्दसंयुक्तायै नमः
    । ॐ नृत्यन्त्यै नमः । ॐ रक्तलोचनायै नमः । ॐ कृशाङ्ग्यै नमः । ॐ कृसरप्रीतायै नमः । ॐ शरासनगतोत्सुकायै
    नमः । ८० ॐ कपालखर्परधरायै नमः । ॐ पञ्चाशन्मुण्डमालिकायै नमः । ॐ हव्यकव्यप्रदायै नमः । ॐ तुष्ट्यै नमः
    । ॐ पुष्ट्यै नमः । ॐ वराङ्गनायै नमः । ॐ शान्त्यै नमः । ॐ क्षान्त्यै नमः । ॐ मनसे नमः । ॐ बुद्ध्यै
    नमः । ॐ सर्वबीजस्वरूपिण्यै नमः । ॐ उग्रापतारिण्यै नमः । ॐ तीर्णायै नमः । ॐ निस्तीर्णगुणवृन्दकायै नमः
    । ॐ रमेश्यै नमः । ॐ रमण्यै नमः । ॐ रम्यायै नमः । ॐ रामानन्दस्वरूपिण्यै नमः । ॐ रजनीकरसम्पूर्णायै नमः
    । ॐ रक्तोत्पलविलोचनायै नमः । १०० इति बृहन्नीलतन्त्रान्तर्गता ताराशतनामावलिः समाप्ता ।
