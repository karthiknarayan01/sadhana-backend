id: langulastra
category: stotram
name:
  english: langulastra
  devanagari: लान्गूलास्त्र
content:
  english: '|| atha karanyasah || om aim shrim hramhrimhrum sphem khphem hsaum hskhphremhsaum namo hanumate
    angushthabhyam namah || om aim shrim hramhrimhrum sphem khphem hsaum hskhphrem hsaum namo ramadutaya
    tarjanibhyam namah || om aim shrim hramhrimhrum sphem khphem hsaum hskhphrem hsaum namo lakshmanapranadatre
    madhyamabhyam namah || om aim shrim hramhrimhrum sphem khphem hsaum hskhphrem hsaum namo anjanasunave
    anamikabhyam namah || om aim shrim hramhrimhrum sphem khphem hsaum hskhphrem hsaum namo sitashokavinashaya
    kanishthikabhyam namah || om aim shrim hramhrimhrum sphem khphem hsaum hskhphrem hsaum namo lankaprasadabhanjanaya
    karatalakaraprishthabhyam namah || || iti karanyasah || || atha hridayadishadanganyasah || om aim
    shrim hramhrimhrum sphem khphem hsaum hskhphrem hsaum namo hanumate hridayaya namah || om aim shrim
    hramhrimhrum sphem khphem hsaum hskhphrem hsaum namo ramadutaya shirase svaha || om aim shrim hramhrimhrum
    sphem khphem hsaum hskhphrem hsaum namo lakshmanapranadatre shikhayai vashat || om aim shrim hramhrimhrum
    sphem khphem hsaum hskhphrem hsaum namo anjanasunave kavacaya hum || om aim shrim hramhrimhrum sphem
    khphem hsaum hskhphrem hsaum namo sitashokavinashine netratrayaya vaushat || om aim shrim hramhrimhrum
    sphem khphem hsaum hskhphrem hsaum namo lankaprasadabhanjanaya astraya phat || || iti hridayadishadanganyasah
    || || atha dhyanam || om dhyayedbaladivakaradyutinibham devaridarpapaham devendrapramukhaih prashastayashasam
    dedipyamanam rica | sugrivadisamastavanarayutam suvyaktatattvapriyam samraktarunalocanam pavanajam
    pitambaralankritam || manojavam marutatulyavegam jitendriyam buddhimatam varishtham | vatatmajam vanarayuthamukhyam
    shriramadutam shirasa namami || vajrangapingakeshadhyam svarnakundalamanditam | niyuddha upasangatram
    paravaraparakramam || vamahastagadayuktam pashahastakamandalum || udyaddakshinadordandam hanumantam
    vicintayet || iti dhyatva aremallacatakhetyuccarane''thava todaramallacatakhetyuccarane kapimudram
    pradarshayet || || atha mantrah || om aim shrim hramhrimhrum sphrem khphrem hsaum hskhphrem hsaum
    namo hanumate trailokyakramanaparakrama shriramabhakta mama parasya ca sarvashatrun catuvarnasambhavan
    pumstrinapumsakan bhutabhavishyadvartamanan nanadurasthasamipasthan nananamadheyan nanasankarajatijan
    kalatraputramitrabhrityabandhusuhritsametan pashushaktisahitan dhanadhanyadisampattiyutan rajno rajaputrasevakan
    mantrisacivasakhin atyantikakshanena tvaraya etaddinavadhi nanopayairmaraya maraya shastraishchedaya
    chedaya agnina jvalaya jvalaya dahaya dahaya akshayakumaravatpadatalakramanenana shilatalena trotaya
    trotaya ghataya ghataya vadha vadha bhutasanghaih saha bhakshaya bhakshaya kruddhacetasa nakhairvidaraya
    vidaraya deshadasmaduccataya uccataya pishacavat bhramshaya bhramshaya bhramaya bhramaya bhayaturan
    visamjnan sadyah kuru kuru bhasmibhutan uddhulaya uddhulaya bhaktajanavatsala sitashokapaharaka sarvatra
    mamenam ca raksha raksha hamhamham humhumhum ghegheghe hum phat svaha || om namo hanumate mahabalaparakramaya
    mahavipattinivarakaya bhaktajanamanahkamanakalpadrumaya dushtajanamanorathastambhanaya prabhanjanapranapriyaya
    svaha || om hramhrimhrumhraimhraumhrah mama shatrun shulena chedaya chedaya agnina jvalaya jvalaya
    dahaya dahaya uccataya uccataya hum phat svaha || || iti mantram pathitva punardhyayet || om hanumate
    namah | dhyanam | shrimantam hanumantamartaripubhidbhubhrittatabhrajitam calpadvaladhibandhavairinicayam
    camikaradriprabham | ashtau raktapishanganetranalinam bhrubhangabhangasphurat prodyaccandamayukhamandalamukham
    duhkhapaham duhkhinam || kaupinam katisutramaunjyajinayugdeham videhatmaja'
  devanagari: ॥ अथ करन्यासः ॥ ॐ ऐं श्रीं ह्रांह्रींह्रूं स्फें ख्फें ह्सौं ह्स्ख्फ्रेंह्सौं नमो हनुमते
    अङ्गुष्ठाभ्यां नमः ॥ ॐ ऐं श्रीं ह्रांह्रींह्रूं स्फें ख्फें ह्सौं ह्स्ख्फ्रें ह्सौं नमो रामदूताय तर्जनीभ्यां
    नमः ॥ ॐ ऐं श्रीं ह्रांह्रींह्रूं स्फें ख्फें ह्सौं ह्स्ख्फ्रें ह्सौं नमो लक्ष्मणप्राणदात्रे मध्यमाभ्यां
    नमः ॥ ॐ ऐं श्रीं ह्रांह्रींह्रूं स्फें ख्फें ह्सौं ह्स्ख्फ्रें ह्सौं नमो अञ्जनासूनवे अनामिकाभ्यां
    नमः ॥ ॐ ऐं श्रीं ह्रांह्रींह्रूं स्फें ख्फें ह्सौं ह्स्ख्फ्रें ह्सौं नमो सीताशोकविनाशाय कनिष्ठिकाभ्यां
    नमः ॥ ॐ ऐं श्रीं ह्रांह्रींह्रूं स्फें ख्फें ह्सौं ह्स्ख्फ्रें ह्सौं नमो लङ्काप्रासादभञ्जनाय करतलकरपृष्ठाभ्यां
    नमः ॥ ॥ इति करन्यासः ॥ ॥ अथ हृदयादिषडङ्गन्यासः ॥ ॐ ऐं श्रीं ह्रांह्रींह्रूं स्फें ख्फें ह्सौं ह्स्ख्फ्रें
    ह्सौं नमो हनुमते हृदयाय नमः ॥ ॐ ऐं श्रीं ह्रांह्रींह्रूं स्फें ख्फें ह्सौं ह्स्ख्फ्रें ह्सौं नमो रामदूताय
    शिरसे स्वाहा ॥ ॐ ऐं श्रीं ह्रांह्रींह्रूं स्फें ख्फें ह्सौं ह्स्ख्फ्रें ह्सौं नमो लक्ष्मणप्राणदात्रे
    शिखायै वषट् ॥ ॐ ऐं श्रीं ह्रांह्रींह्रूं स्फें ख्फें ह्सौं ह्स्ख्फ्रें ह्सौं नमो अञ्जनासूनवे कवचाय
    हुम् ॥ ॐ ऐं श्रीं ह्रांह्रींह्रूं स्फें ख्फें ह्सौं ह्स्ख्फ्रें ह्सौं नमो सीताशोकविनाशिने नेत्रत्रयाय
    वौषट् ॥ ॐ ऐं श्रीं ह्रांह्रींह्रूं स्फें ख्फें ह्सौं ह्स्ख्फ्रें ह्सौं नमो लङ्काप्रासादभञ्जनाय अस्त्राय
    फट् ॥ ॥ इति हृदयादिषडङ्गन्यासः ॥ ॥ अथ ध्यानम् ॥ ॐ ध्यायेद्बालदिवाकरद्युतिनिभं देवारिदर्पापहं देवेन्द्रप्रमुखैः
    प्रशस्तयशसं देदीप्यमानं ऋचा । सुग्रीवादिसमस्तवानरयुतं सुव्यक्ततत्त्वप्रियं संरक्तारुणलोचनं पवनजं पीताम्बरालङ्कृतम्
    ॥ मनोजवं मारुततुल्यवेगं जितेन्द्रियं बुद्धिमतां वरिष्ठम् । वातात्मजं वानरयूथमुख्यं श्रीरामदूतं शिरसा
    नमामि ॥ वज्राङ्गपिङ्गकेशाढ्यं स्वर्णकुण्डलमण्डितम् । नियुद्ध उपसङ्गात्रं पारावारपराक्रमम् ॥ वामहस्तगदायुक्तं
    पाशहस्तकमण्डलुम् ॥ उद्यद्दक्षिणदोर्दण्डं हनुमन्तं विचिन्तयेत् ॥ इति ध्यात्वा अरेमल्लचटखेत्युच्चारणेऽथवा
    तोडरमल्लचटखेत्युच्चारणे कपिमुद्रां प्रदर्शयेत् ॥ ॥ अथ मन्त्रः ॥ ॐ ऐं श्रीं ह्रांह्रींह्रूं स्फ्रें
    ख्फ्रें ह्सौं ह्स्ख्फ्रें ह्सौं नमो हनुमते त्रैलोक्याक्रमणपराक्रम श्रीरामभक्त मम परस्य च सर्वशत्रून्
    चतुवर्णसम्भवान् पुंस्त्रीनपुंसकान् भूतभविष्यद्वर्तमानान् नानादूरस्थसमीपस्थान् नानानामधेयान् नानासङ्करजातिजान्
    कलत्रपुत्रमित्रभृत्यबन्धुसुहृत्समेतान् पशुशक्तिसहितान् धनधान्यादिसम्पत्तियुतान् राज्ञो राजपुत्रसेवकान्
    मन्त्रीसचिवसखीन् आत्यन्तिकक्षणेन त्वरया एतद्दिनावधि नानोपायैर्मारय मारय शस्त्रैश्छेदय छेदय अग्निना
    ज्वालय ज्वालय दाहय दाहय अक्षयकुमारवत्पादतलाक्रमणेनान शिलातलेन त्रोटय त्रोटय घातय घातय वध वध भूतसङ्घैः
    सह भक्षय भक्षय क्रूद्धचेतसा नखैर्विदारय विदारय देशादस्मादुच्चाटय उच्चाटय पिशाचवत् भ्रंशय भ्रंशय भ्रामय
    भ्रामय भयातुरान् विसंज्ञान् सद्यः कुरु कुरु भस्मीभूतान् उद्धूलय उद्धूलय भक्तजनवत्सल सीताशोकापहारक
    सर्वत्र मामेनं च रक्ष रक्ष हांहांहां हुंहुंहुं घेघेघे हुं फट् स्वाहा ॥ ॐ नमो हनुमते महाबलपराक्रमाय
    महाविपत्तिनिवारकाय भक्तजनमनःकामनाकल्पद्रुमाय दुष्टजनमनोरथस्तम्भनाय प्रभञ्जनप्राणप्रियाय स्वाहा ॥ ॐ
    ह्रांह्रींह्रूंह्रैंह्रौंह्रः मम शत्रून् शूलेन छेदय छेदय अग्निना ज्वालय ज्वालय दाहय दाहय उच्चाटय उच्चाटय
    हुं फट् स्वाहा ॥ ॥ इति मन्त्रं पठित्वा पुनर्ध्यायेत् ॥ ॐ हनुमते नमः । ध्यानम् । श्रीमन्तं हनुमन्तमार्तरिपुभिद्भूभृत्तटभ्राजितं
    चाल्पद्वालधिबन्धवैरिनिचयं चामीकराद्रिप्रभम् । अष्टौ रक्तपिशङ्गनेत्रनलिनं भ्रूभङ्गभङ्गस्फुरत् प्रोद्यच्चण्डमयूखमण्डलमुखं
    दुःखापहं दुःखिनाम् ॥ कौपीनं कटिसूत्रमौञ्ज्यजिनयुग्देहं विदेहात्मजा
