id: aditikritamsuryastotram-19
category: stotram
name:
  english: aditikritamsuryastotram 19
  devanagari: अदितिकृतंसूर्यस्तोत्रम् १९
content:
  english: aditikritam suryastotram 19 aditiruvaca | namastubhyam param sukshmam sauvarnim bibhrate tanum
    | dhama dhamavatamisha dhamnamadhara shashvata || 18|| jagatamupakaraya tathapastava gopate | adadanasya
    yadrupam tivram tasmai namamyaham || 19|| grahitumashtamasena kalenendumayam rasam | bibhratastava
    yadrupamatitivram natasmi tat || 20|| tameva muncatah sarvam rasam vai varshanaya yat | rupamapyayakam
    bhasvamstasmai medhaya te namah || 21|| varyutsargavinishpannamashesham caushadhiganam | pakaya tava
    yadrupam bhaskaram tam namamyaham || 22|| yacca rupam tavatitam himotsargadishitalam | tatkalasasyaposhaya
    tarane tasya te namah || 23|| natitivram ca yadrupam natishitam ca yattava | vasantarttau rave saumyam
    tasmai deva namo namah || 24|| apyayanamasheshanam devanam ca tathaparam | pitrinam ca namastasmai
    sasyanam pakahetave || 25|| yadrupam jivanayaikam virudhamamritatmakam | piyate devapitribhistasmai
    somatmane namah || 26|| apyayadaharupabhyam rupam vishvamayam tava | sametamagnishomabhyam namastasmai
    gunatmane || 27|| yadrupamrigyajuhsamnamaikyena tapate tava | vishvametattrayisamjnam namastasmai
    vibhavaso || 28|| markandeya uvaca | yattu tasmatparam rupamomityuktvabhishabditam | asthulanantamamalam
    namastasmai sadatmane || 29|| iti markandayapurane ekadhikashatatamadhyayantargatam aditikritam suryastotram
    samaptam | markandeyapurana | adhyaya 101
  devanagari: अदितिकृतं सूर्यस्तोत्रम् १९ अदितिरुवाच । नमस्तुभ्यं परां सूक्ष्मां सौवर्णीं बिभ्रते तनुम्
    । धाम धामवतामीश धाम्नामाधार शाश्वत ॥ १८॥ जगतामुपकाराय तथापस्तव गोपते । आददानस्य यद्रूपं तीव्रं तस्मै
    नमाम्यहम् ॥ १९॥ ग्रहीतुमष्टमासेन कालेनेन्दुमयं रसम् । बिभ्रतस्तव यद्रूपमतितीव्रं नतास्मि तत् ॥ २०॥
    तमेव मुञ्चतः सर्वं रसं वै वर्षणाय यत् । रूपमाप्यायकं भास्वंस्तस्मै मेधाय ते नमः ॥ २१॥ वार्युत्सर्गविनिष्पन्नमशेषं
    चौषधीगणम् । पाकाय तव यद्रूपं भास्करं तं नमाम्यहम् ॥ २२॥ यच्च रूपं तवातीतं हिमोत्सर्गादिशीतलम् । तत्कालसस्यपोषाय
    तरणे तस्य ते नमः ॥ २३॥ नातितीव्रं च यद्रूपं नातिशीतं च यत्तव । वसन्तर्त्तौ रवे सौम्यं तस्मै देव नमो
    नमः ॥ २४॥ आप्यायनमशेषाणां देवानां च तथापरम् । पितॄणां च नमस्तस्मै सस्यानां पाकहेतवे ॥ २५॥ यद्रूपं
    जीवनायैकं वीरुधाममृतात्मकम् । पीयते देवपितृभिस्तस्मै सोमात्मने नमः ॥ २६॥ आप्यायदाहरूपाभ्यां रूपं विश्वमयं
    तव । समेतमग्नीषोमाभ्यां नमस्तस्मै गुणात्मने ॥ २७॥ यद्रूपमृग्यजुःसाम्नामैक्येन तपते तव । विश्वमेतत्त्रयीसंज्ञं
    नमस्तस्मै विभावसो ॥ २८॥ मार्कण्डेय उवाच । यत्तु तस्मात्परं रूपमोमित्युक्त्वाभिशब्दितम् । अस्थूलानन्तममलं
    नमस्तस्मै सदात्मने ॥ २९॥ इति मार्कण्डयपुराणे एकाधिकशततमाध्यायान्तर्गतं अदितिकृतं सूर्यस्तोत्रं समाप्तम्
    । मार्कण्डेयपुराण । अध्याय १०१
