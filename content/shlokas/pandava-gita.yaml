id: pandava-gita
category: stotram
name:
  english: Pandava Gita
content:
  english: prahladanaradaparasharapundarika vyasambarishashukashaunakabhishmakavyah | rukmangadarjunavasishthavibhishanadya
    etanaham paramabhagavatan namami || || lomaharshana uvaca | dharmo vivardhati yudhishthirakirtanena
    papam pranashyati vrikodarakirtanena | shatrurvinashyati dhananjayakirtanena madrisutau kathayatam
    na bhavanti rogah || || brahmovaca | ye manava vigataragapara jna narayanam suragurum satatam smaranti
    | dhyanena tena hatakilbisha cetanaste matuh payodhararasam na punah pibanti || || indra uvaca | narayano
    nama naro naranam prasiddhacaurah kathitah prithivyam | anekajanmarjitapapasancayam haratyashesham
    smritamatra eva yah || || yudhishthira uvaca | meghashyamam pitakausheyavasam shrivatsankam kaustubhodbhasitangam
    | punyopetam pundarikayataksham vishnum vande sarvalokaikanatham || || bhima uvaca | jalaughamagna
    sacara'cara dhara vishanakotya'khilavishvamurtina | samuddhrita yena varaharupina sa me svayambhurbhagavan
    prasidaru || || arjuna uvaca | acintyamavyaktamanantamavyayam vibhum prabhum bhavitavishvabhavanam
    | trailokyavistaravicarakarakam harim prapanno'smi gatim mahatmanam || || nakula uvaca | yadi gamanamadhastat
    kalapashanubandhad yadi ca kulavihine jayate pakshikite | krimishatamapi gatva dhyayate cantaratma
    mama bhavatu hridistha keshave bhaktireka || || sahadeva uvaca | tasya yajnavarahasya vishnoratulatejasah
    | pranamam ye prakurvanti teshamapi namo namah || || kunti uvaca | svakarmaphalanirdishtam yam yam
    yonim vrajamyaham | tasyam tasyam hrishikesha tvayi bhaktirdridha'stu me || || madri uvaca | krishne
    ratah krishnamanusmaranti ratrau ca krishnam punarutthita ye | te bhinnadehah pravishanti krishne
    haviryatha mantrahutam hutashe || || draupadi uvaca | kiteshu pakshishu mrigeshu sarisripeshu rakshahpishacamanujeshvapi
    yatra yatra | jatasya me bhavatu keshava tvatprasadat tvayyeva bhaktiracala'vyabhicarini ca || ||
    subhadra uvaca | eko'pi krishnasya kritah pranamo dashashvamedhavabhrithena tulyah | dashashvamedhi
    punareti janma krishnapranami na punarbhavaya || || abhimanyuruvaca | govinda govinda hare murare
    govinda govinda mukunda krishna govinda govinda rathangapane | govinda govinda namami nityam || ||
    dhrishtadyumna uvaca | shrirama narayana vasudeva govinda vaikuntha mukunda krishna | shrikeshavananta
    nrisimha vishno mam trahi samsarabhujangadashtam || || satyakiruvaca | aprameya hare vishno krishna
    damodara'cyuta | govindananta sarvesha vasudeva namo'stu te || || uddhava uvaca | vasudevam parityajya
    yo'nyam devamupasate | trishito jahnavitire kupam khanati durmatih || || dhaumya uvaca | apam samipe
    shayanasanasthite diva ca ratrau ca yathadhigacchata | yadyasti kincit sukritam kritam maya janardanastena
    kritena tushyatu || || sanjaya uvaca | arta vishannah shithilashca bhita ghoreshu vyaghradishu vartamanah
    | sankirtya narayanashabdamatram vimuktaduhkhah sukhino bhavanti || || akrura uvaca | aham tu narayanadasadasa
    dasasya dasasya ca dasadasah | anyo na hisho jagato naranam tasmadaham dhanyataro'smi loke || || virata
    uvaca | vasudevasya ye bhaktah shantastadgatacetasah | tesham dasasya daso'ham bhaveyam janmajanmani
    || || bhishma uvaca | vipariteshu kaleshu parikshineshu bandhushu | trahi mam kripaya krishna sharanagatavatsala
    || || drona uvaca | ye ye hatashcakradharena daityam strailokyanathena janardanena | te te gata vishnupurim
    prayatah krodho'pi devasya varena tulyah || || kripacarya uvaca | majjanmanah phalamidam madhukaitabhare
    matprarthaniya madanugraha esha eva | tvadbhrityabhrityaparicarakabhrityabhritya bhrityasya bhritya
    iti mam smara lokanatha || || ashvatthama uvaca | govinda keshava janardana vasudeva vishvesha vishva
    madhusudana vishvarupa | shripadmanabha purushottama dehi dasyam narayanacyuta nrisimha namo namaste
    || || karna uvaca | nanyam vadami na sha rinomi na cintayami nanyam smarami na bhajami na cashrayami
    | bhaktya tvadiyacaranambujamadarena shrishrinivasa purushottama dehi dasyam || || dhritarashtra uvaca
    | namo namah karanavamanaya narayanayamitavikramaya | shrisharngacakrasigadadharaya namo'stu tasmai
    purushottamaya || || gandhari uvaca | tvameva mata ca pita tvameva tvameva bandhushca sakha tvameva
    | tvameva vidya dravinam tvameva tvameva sarvam mama deva deva || || drupada uvaca | yajneshacyuta
    govinda madhavananta keshava | krishna vishno hrishikesha vasudeva namo'stu te || || jayadratha uvaca
    | namah krishnaya devaya brahmane'nantashaktaye | yogeshvaraya yogaya tvamaham sharanam gatah || ||
    vikarna uvaca | krishnaya vasudevaya devakinandanaya ca | nandagopakumaraya govindaya namo namah ||
    || virata uvaca | namo brahmanyadevaya gobrahmanahitaya ca | jagaddhitaya krishnaya govindaya namo
    namah || || shalya uvaca | atasipushpasankasham pitavasasamacyutam | ye namasyanti govindam tesham
    na vidyate bhayam || || balabhadra uvaca | krishna krishna kripalo tvamagatinam gatirbhava | samsararnavamagnanam
    prasida purushottama || || shrikrishna uvaca | krishna krishneti krishneti yo mam smarati nityashah
    | jalam bhitva yatha padmam narakaduddharamyaham || || shrikrishna uvaca | nityam vadami manujah svayamurdhvabahu
    ryo mam mukunda narasimha janardaneti | jivo japatyanudinam marane rane va pashanakashthasadrishaya
    dadamyabhishtam || || ishvara uvaca | sakrinnarayanetyuktva puman kalpashatatrayam | gangadisarvatirtheshu
    snato bhavati putraka || || suta uvaca | tatraiva ganga yamuna ca tatra godavari sindhu sarasvati
    ca | sarvani tirthani vasanti tatra yatracyutodara kathaprasangah || || yama uvaca | narake pacyamanam
    tu yamenam paribhashitam | kim tvaya narcito devah keshavah kleshanashanah || || narada uvaca | janmantarasahasrena
    tapodhyanasamadhina | naranam kshinapapanam krishne bhaktih prajayate || || prahlada uvaca | natha
    yonisahasreshu yeshu yeshu vrajamyaham | teshu teshvacala bhaktiracyuta'stu sada tvayi || || ya pritiravivekanam
    vishayeshvanapayini | tvamanusmaratah sa me hridayanma'pasarpatu || || vishvamitra uvaca | kim tasya
    danaih kim tirthaih kim tapobhih kimadhvaraih | yo nityam dhyayate devam narayanamananyadhih || ||
    jamadagniruvaca | nityotsavo bhavettesham nityam nityam ca mangalam | yesham hridistho bhagavanmangalayatanam
    harih || || bharadvaja uvaca | labhastesham jayastesham kutastesham parajayah | yeshamindishvarashyamo
    hridayastho janardanah || || gautama uvaca | gokotidanam grahaneshu kashi prayagagangayutakalpavasah
    | yajnayutam merusuvarnadanam govindanamasmaranena tulyam || || agniruvaca | govindeti sada snanam
    govindeti sada japah | govindeti sada dhyanam sada govindakirtanam || || tryaksharam paramam brahma
    govinda tryaksharam param | tasmaduccaritam yena brahmabhuyaya kalpate || || vedavyasa uvaca | acyutah
    kalpavriksho'savanantah kamadhenu vai | cintamanistu govindo harernama vicintayet || || indra uvaca
    | jayatu jayatu devo devakinandano'yam jayatu jayatu krishno vrishnivamshapradipah | jayatu jayatu
    meghashyamalah komalango jayatu jayatu prithvibharanasho mukundah || || pippalayana uvaca | shrimannrisimhavibhave
    garudadhvajaya tapatrayopashamanaya bhavaushadhaya | krishnaya vrishcikajalagnibhujangaroga kleshavyayaya
    haraye gurave namaste || || avirhotra uvaca | krishna tvadiyapadapankajapanjarante adyaiva me vishatu
    manasarajahamsah | pranaprayanasamaye kaphavatapittaih kanthavarodhanavidhau smaranam kutaste || ||
    vidura uvaca | harernamaiva namaiva namaiva mama jivanam | kalau nastyeva nastyeva nastyeva gatiranyatha
    || || vasishtha uvaca | krishneti mangalam nama yasya vaci pravartate | bhasmibhavanti tasyashu mahapatakakotayah
    || || arundhatyuvaca | krishnaya vasudevaya haraye paramatmane | pranatakleshanashaya govindaya namo
    namah || || kashyapa uvaca | krishnanusmaranadeva papasanghattapanjaram | shatadha bhedamapnoti girirvajrahato
    yatha || || duryodhana uvaca | janami dharmam na ca me pravritti rjanami papam na ca me nivrittih
    | kenapi devena hridi sthitena yatha niyukto'smi tatha karomi || || yantrasya mama doshena kshamyatam
    madhusudana | aham yantram bhavan yantri mama dosho na diyatam || || bhriguruvaca | namaiva tava govinda
    nama tvattah shatadhikam | dadattyuccarananmuktih bhavanashtangayogatah || || lomasha uvaca | namami
    narayana padapankajam karomi narayanapujanam sada | vadami narayananama nirmalam smarami narayanatattvamavyayam
    || || shaunaka uvaca | smriteh sakalakalyanam bhajanam yasya jayate | purusham tamajam nityam vrajami
    sharanam harim || || garga uvaca | narayaneti mantro'sti vagasti vashavartini | tathapi narake ghore
    patantityadbhutam mahat || || dalbhya uvaca | kim tasya bahubhirmantrairbhaktiryasya janardane | namo
    narayanayeti mantrah sarvarthasadhake || || vaishampayana uvaca | yatra yogeshvarah krishno yatra
    partho dhanurdharah | tatra shrirvijayo bhutirdhruva nitirmatirmama || || agniruvaca | harirharati
    papani dushtacittairapi smritah | anicchayapi samsprishto dahatyeva hi pavakah || || parameshvara
    uvaca | sakriduccaritam yena harirityaksharadvayam | labdhah parikarastena mokshaya gamanam prati
    || || pulastya uvaca | he jihve rasasarajne sarvada madhurapriye | narayanakhyapiyusham piba jihve
    nirantaram || || vyasa uvaca | satyam satyam punah satyam satyam satyam vadamyaham | nasti vedatparam
    shastram na devah keshavatparah || || dhanvantariruvaca | acyutananta govinda namoccaranabheshajat
    | nashyanti sakala rogah satyam satyam vadamyaham || || markandeya uvaca | svargadam mokshadam devam
    sukhadam jagato gurum | katham muhurtamapi tam vasudevam na cintayet || || agastya uvaca | nimisham
    nimishardham va praninam vishnucintanam | tatra tatra kurukshetram prayago naimisham varam || || vamadeva
    uvaca | nimisham nimishardham va praninam vishnucintanam | kalpakotisahasrani labhate vanchitam phalam
    || || shuka uvaca | alodya sarvashastrani vicarya ca punah punah | idamekam sunishpannam dhyeyo narayanah
    sada || || shrimahadeva uvaca | sharire jarjaribhute vyadhigraste kalevare | aushadham jahnavitoyam
    vaidyo narayano harih || || shaunaka uvaca | bhojanacchadane cintam vritha kurvanti vaishnavah | yo'sau
    vishvambharo devah sa kim bhaktanupekshate || || sanatkumara uvaca | yasya haste gada cakram garudo
    yasya vahanam | shankhacakragadapadmi sa me vishnuh prasidatu || || evam brahmadayo deva rishayashca
    tapodhanah | kirtayanti surashreshthamevam narayanam vibhum || || idam pavitramayushyam punyam papapranashanam
    | duhsvapnanashanam stotram pandavaih parikirtitam || || yah pathetpratarutthaya shucistadgatamanasah
    | gavam shatasahasrasya samyagdattasya yatphalam || || tatphalam samavapnoti yah pathediti samstavam
    | sarvapapavinirmukto vishnulokam sa gacchati || || ganga gita ca gayatri govindo garudadhvajah |
    gakaraih pancabhiryuktah punarjanma na vidyate || || gitam yah pathate nityam shlokardham shlokameva
    va | mucyate sarvapapebhyo vishnulokam sa gacchati || || iti pandavagita athava prapannagita samapta
    | om tatsat |
  devanagari: प्रह्लादनारदपराशरपुण्डरीक व्यासाम्बरीषशुकशौनकभीष्मकाव्याः । रुक्माङ्गदार्जुनवसिष्ठविभीषणाद्या
    एतानहं परमभागवतान् नमामि ॥ ॥ लोमहर्षण उवाच । धर्मो विवर्धति युधिष्ठिरकीर्तनेन पापं प्रणश्यति वृकोदरकीर्तनेन
    । शत्रुर्विनश्यति धनञ्जयकीर्तनेन माद्रीसुतौ कथयतां न भवन्ति रोगाः ॥ ॥ ब्रह्मोवाच । ये मानवा विगतरागपरा
    ज्ञा नारायणं सुरगुरुं सततं स्मरन्ति । ध्यानेन तेन हतकिल्बिष चेतनास्ते मातुः पयोधररसं न पुनः पिबन्ति
    ॥ ॥ इन्द्र उवाच । नारायणो नाम नरो नराणां प्रसिद्धचौरः कथितः पृथिव्याम् । अनेकजन्मार्जितपापसञ्चयं हरत्यशेषं
    स्मृतमात्र एव यः ॥ ॥ युधिष्ठिर उवाच । मेघश्यामं पीतकौशेयवासं श्रीवत्साङ्कं कौस्तुभोद्भासिताङ्गम् ।
    पुण्योपेतं पुण्डरीकायताक्षं विष्णुं वन्दे सर्वलोकैकनाथम् ॥ ॥ भीम उवाच । जलौघमग्ना सचराऽचरा धरा विषाणकोट्याऽखिलविश्वमूर्तिना
    । समुद्धृता येन वराहरूपिणा स मे स्वयम्भूर्भगवान् प्रसीदरु ॥ ॥ अर्जुन उवाच । अचिन्त्यमव्यक्तमनन्तमव्ययं
    विभुं प्रभुं भावितविश्वभावनम् । त्रैलोक्यविस्तारविचारकारकं हरिं प्रपन्नोऽस्मि गतिं महात्मनाम् ॥ ॥
    नकुल उवाच । यदि गमनमधस्तात् कालपाशानुबन्धाद् यदि च कुलविहीने जायते पक्षिकीटे । कृमिशतमपि गत्वा ध्यायते
    चान्तरात्मा मम भवतु हृदिस्था केशवे भक्तिरेका ॥ ॥ सहदेव उवाच । तस्य यज्ञवराहस्य विष्णोरतुलतेजसः । प्रणामं
    ये प्रकुर्वन्ति तेषामपि नमो नमः ॥ ॥ कुन्ती उवाच । स्वकर्मफलनिर्दिष्टां यां यां योनिं व्रजाम्यहम् ।
    तस्यां तस्यां हृषीकेश त्वयि भक्तिर्दृढाऽस्तु मे ॥ ॥ माद्री उवाच । कृष्णे रताः कृष्णमनुस्मरन्ति रात्रौ
    च कृष्णं पुनरुत्थिता ये । ते भिन्नदेहाः प्रविशन्ति कृष्णे हविर्यथा मन्त्रहुतं हुताशे ॥ ॥ द्रौपदी उवाच
    । कीटेषु पक्षिषु मृगेषु सरीसृपेषु रक्षःपिशाचमनुजेष्वपि यत्र यत्र । जातस्य मे भवतु केशव त्वत्प्रसादात्
    त्वय्येव भक्तिरचलाऽव्यभिचारिणी च ॥ ॥ सुभद्रा उवाच । एकोऽपि कृष्णस्य कृतः प्रणामो दशाश्वमेधावभृथेन
    तुल्यः । दशाश्वमेधी पुनरेति जन्म कृष्णप्रणामी न पुनर्भवाय ॥ ॥ अभिमन्युरुवाच । गोविन्द गोविन्द हरे
    मुरारे गोविन्द गोविन्द मुकुन्द कृष्ण गोविन्द गोविन्द रथाङ्गपाणे । गोविन्द गोविन्द नमामि नित्यम् ॥
    ॥ धृष्टद्युम्न उवाच । श्रीराम नारायण वासुदेव गोविन्द वैकुण्ठ मुकुन्द कृष्ण । श्रीकेशवानन्त नृसिंह
    विष्णो मां त्राहि संसारभुजङ्गदष्टम् ॥ ॥ सात्यकिरुवाच । अप्रमेय हरे विष्णो कृष्ण दामोदराऽच्युत । गोविन्दानन्त
    सर्वेश वासुदेव नमोऽस्तु ते ॥ ॥ उद्धव उवाच । वासुदेवं परित्यज्य योऽन्यं देवमुपासते । तृषितो जाह्नवीतीरे
    कूपं खनति दुर्मतिः ॥ ॥ धौम्य उवाच । अपां समीपे शयनासनस्थिते दिवा च रात्रौ च यथाधिगच्छता । यद्यस्ति
    किञ्चित् सुकृतं कृतं मया जनार्दनस्तेन कृतेन तुष्यतु ॥ ॥ सञ्जय उवाच । आर्ता विषण्णाः शिथिलाश्च भीता
    घोरेषु व्याघ्रादिषु वर्तमानाः । सङ्कीर्त्य नारायणशब्दमात्रं विमुक्तदुःखाः सुखिनो भवन्ति ॥ ॥ अक्रूर
    उवाच । अहं तु नारायणदासदास दासस्य दासस्य च दासदासः । अन्यो न हीशो जगतो नराणां तस्मादहं धन्यतरोऽस्मि
    लोके ॥ ॥ विराट उवाच । वासुदेवस्य ये भक्ताः शान्तास्तद्गतचेतसः । तेषां दासस्य दासोऽहं भवेयं जन्मजन्मनि
    ॥ ॥ भीष्म उवाच । विपरीतेषु कालेषु परिक्षीणेषु बन्धुषु । त्राहि मां कृपया कृष्ण शरणागतवत्सल ॥ ॥ द्रोण
    उवाच । ये ये हताश्चक्रधरेण दैत्यां स्त्रैलोक्यनाथेन जनार्दनेन । ते ते गता विष्णुपुरीं प्रयाताः क्रोधोऽपि
    देवस्य वरेण तुल्यः ॥ ॥ कृपाचार्य उवाच । मज्जन्मनः फलमिदं मधुकैटभारे मत्प्रार्थनीय मदनुग्रह एष एव ।
    त्वद्भृत्यभृत्यपरिचारकभृत्यभृत्य भृत्यस्य भृत्य इति मां स्मर लोकनाथ ॥ ॥ अश्वत्थाम उवाच । गोविन्द केशव
    जनार्दन वासुदेव विश्वेश विश्व मधुसूदन विश्वरूप । श्रीपद्मनाभ पुरुषोत्तम देहि दास्यं नारायणाच्युत नृसिंह
    नमो नमस्ते ॥ ॥ कर्ण उवाच । नान्यं वदामि न श ऋणोमि न चिन्तयामि नान्यं स्मरामि न भजामि न चाश्रयामि ।
    भक्त्या त्वदीयचरणाम्बुजमादरेण श्रीश्रीनिवास पुरुषोत्तम देहि दास्यम् ॥ ॥ धृतराष्ट्र उवाच । नमो नमः
    कारणवामनाय नारायणायामितविक्रमाय । श्रीशार्ङ्गचक्रासिगदाधराय नमोऽस्तु तस्मै पुरुषोत्तमाय ॥ ॥ गान्धारी
    उवाच । त्वमेव माता च पिता त्वमेव त्वमेव बन्धुश्च सखा त्वमेव । त्वमेव विद्या द्रविणं त्वमेव त्वमेव
    सर्वं मम देव देव ॥ ॥ द्रुपद उवाच । यज्ञेशाच्युत गोविन्द माधवानन्त केशव । कृष्ण विष्णो हृषीकेश वासुदेव
    नमोऽस्तु ते ॥ ॥ जयद्रथ उवाच । नमः कृष्णाय देवाय ब्रह्मणेऽनन्तशक्तये । योगेश्वराय योगाय त्वामहं शरणं
    गतः ॥ ॥ विकर्ण उवाच । कृष्णाय वासुदेवाय देवकीनन्दनाय च । नन्दगोपकुमाराय गोविन्दाय नमो नमः ॥ ॥ विराट
    उवाच । नमो ब्रह्मण्यदेवाय गोब्राह्मणहिताय च । जगद्धिताय कृष्णाय गोविन्दाय नमो नमः ॥ ॥ शल्य उवाच ।
    अतसीपुष्पसङ्काशं पीतवाससमच्युतम् । ये नमस्यन्ति गोविन्दं तेषां न विद्यते भयम् ॥ ॥ बलभद्र उवाच । कृष्ण
    कृष्ण कृपालो त्वमगतीनां गतिर्भव । संसारार्णवमग्नानां प्रसीद पुरुषोत्तम ॥ ॥ श्रीकृष्ण उवाच । कृष्ण
    कृष्णेति कृष्णेति यो मां स्मरति नित्यशः । जलं भित्वा यथा पद्मं नरकादुद्धराम्यहम् ॥ ॥ श्रीकृष्ण उवाच
    । नित्यं वदामि मनुजाः स्वयमूर्ध्वबाहु र्यो मां मुकुन्द नरसिंह जनार्दनेति । जीवो जपत्यनुदिनं मरणे रणे
    वा पाषाणकाष्ठसदृशाय ददाम्यभीष्टम् ॥ ॥ ईश्वर उवाच । सकृन्नारायणेत्युक्त्वा पुमान् कल्पशतत्रयम् । गङ्गादिसर्वतीर्थेषु
    स्नातो भवति पुत्रक ॥ ॥ सूत उवाच । तत्रैव गङ्गा यमुना च तत्र गोदावरी सिन्धु सरस्वती च । सर्वाणि तीर्थानि
    वसन्ति तत्र यत्राच्युतोदार कथाप्रसङ्गः ॥ ॥ यम उवाच । नरके पच्यमानं तु यमेनं परिभाषितम् । किं त्वया
    नार्चितो देवः केशवः क्लेशनाशनः ॥ ॥ नारद उवाच । जन्मान्तरसहस्रेण तपोध्यानसमाधिना । नराणां क्षीणपापानां
    कृष्णे भक्तिः प्रजायते ॥ ॥ प्रह्लाद उवाच । नाथ योनिसहस्रेषु येषु येषु व्रजाम्यहम् । तेषु तेष्वचला
    भक्तिरच्युताऽस्तु सदा त्वयि ॥ ॥ या प्रीतिरविवेकनां विषयेष्वनपायिनि । त्वामनुस्मरतः सा मे हृदयान्माऽपसर्पतु
    ॥ ॥ विश्वामित्र उवाच । किं तस्य दानैः किं तीर्थैः किं तपोभिः किमध्वरैः । यो नित्यं ध्यायते देवं नारायणमनन्यधीः
    ॥ ॥ जमदग्निरुवाच । नित्योत्सवो भवेत्तेषां नित्यं नित्यं च मङ्गलम् । येषां हृदिस्थो भगवान्मङ्गलायतनं
    हरिः ॥ ॥ भरद्वाज उवाच । लाभस्तेषां जयस्तेषां कुतस्तेषां पराजयः । येषामिन्दीश्वरश्यामो हृदयस्थो जनार्दनः
    ॥ ॥ गौतम उवाच । गोकोटिदानं ग्रहणेषु काशी प्रयागगङ्गायुतकल्पवासः । यज्ञायुतं मेरुसुवर्णदानं गोविन्दनामस्मरणेन
    तुल्यम् ॥ ॥ अग्निरुवाच । गोविन्देति सदा स्नानं गोविन्देति सदा जपः । गोविन्देति सदा ध्यानं सदा गोविन्दकीर्तनम्
    ॥ ॥ त्र्यक्षरं परमं ब्रह्म गोविन्द त्र्यक्षरं परम् । तस्मादुच्चारितं येन ब्रह्मभूयाय कल्पते ॥ ॥ वेदव्यास
    उवाच । अच्युतः कल्पवृक्षोऽसावनन्तः कामधेनु वै । चिन्तामणिस्तु गोविन्दो हरेर्नाम विचिन्तयेत् ॥ ॥ इन्द्र
    उवाच । जयतु जयतु देवो देवकीनन्दनोऽयं जयतु जयतु कृष्णो वृष्णिवंशप्रदीपः । जयतु जयतु मेघश्यामलः कोमलाङ्गो
    जयतु जयतु पृथ्वीभारनाशो मुकुन्दः ॥ ॥ पिप्पलायन उवाच । श्रीमन्नृसिंहविभवे गरुडध्वजाय तापत्रयोपशमनाय
    भवौषधाय । कृष्णाय वृश्चिकजलाग्निभुजङ्गरोग क्लेशव्ययाय हरये गुरवे नमस्ते ॥ ॥ आविर्होत्र उवाच । कृष्ण
    त्वदीयपदपङ्कजपञ्जरान्ते अद्यैव मे विशतु मानसराजहंसः । प्राणप्रयाणसमये कफवातपित्तैः कण्ठावरोधनविधौ
    स्मरणं कुतस्ते ॥ ॥ विदुर उवाच । हरेर्नामैव नामैव नामैव मम जीवनम् । कलौ नास्त्येव नास्त्येव नास्त्येव
    गतिरन्यथा ॥ ॥ वसिष्ठ उवाच । कृष्णेति मङ्गलं नाम यस्य वाचि प्रवर्तते । भस्मीभवन्ति तस्याशु महापातककोटयः
    ॥ ॥ अरुन्धत्युवाच । कृष्णाय वासुदेवाय हरये परमात्मने । प्रणतक्लेशनाशाय गोविन्दाय नमो नमः ॥ ॥ कश्यप
    उवाच । कृष्णानुस्मरणादेव पापसङ्घट्टपञ्जरम् । शतधा भेदमाप्नोति गिरिर्वज्रहतो यथा ॥ ॥ दुर्योधन उवाच
    । जानामि धर्मं न च मे प्रवृत्ति र्जानामि पापं न च मे निवृत्तिः । केनापि देवेन हृदि स्थितेन यथा नियुक्तोऽस्मि
    तथा करोमि ॥ ॥ यन्त्रस्य मम दोषेण क्षम्यतां मधुसूदन । अहं यन्त्रं भवान् यन्त्री मम दोषो न दीयताम् ॥
    ॥ भृगुरुवाच । नामैव तव गोविन्द नाम त्वत्तः शताधिकम् । ददात्त्युच्चारणान्मुक्तिः भवानष्टाङ्गयोगतः ॥
    ॥ लोमश उवाच । नमामि नारायण पादपङ्कजं करोमि नारायणपूजनं सदा । वदामि नारायणनाम निर्मलं स्मरामि नारायणतत्त्वमव्ययम्
    ॥ ॥ शौनक उवाच । स्मृतेः सकलकल्याणं भजनं यस्य जायते । पुरुषं तमजं नित्यं व्रजामि शरणं हरिम् ॥ ॥ गर्ग
    उवाच । नारायणेति मन्त्रोऽस्ति वागस्ति वशवर्तिनी । तथापि नरके घोरे पतन्तीत्यद्भुतं महत् ॥ ॥ दाल्भ्य
    उवाच । किं तस्य बहुभिर्मन्त्रैर्भक्तिर्यस्य जनार्दने । नमो नारायणायेति मन्त्रः सर्वार्थसाधाके ॥ ॥
    वैशम्पायन उवाच । यत्र योगेश्वरः कृष्णो यत्र पार्थो धनुर्धरः । तत्र श्रीर्विजयो भूतिर्ध्रुवा नीतिर्मतिर्मम
    ॥ ॥ अग्निरुवाच । हरिर्हरति पापानि दुष्टचित्तैरपि स्मृतः । अनिच्छयापि संस्पृष्टो दहत्येव हि पावकः ॥
    ॥ परमेश्वर उवाच । सकृदुच्चरितं येन हरिरित्यक्षरद्वयम् । लब्धः परिकरस्तेन मोक्षाय गमनं प्रति ॥ ॥ पुलस्त्य
    उवाच । हे जिह्वे रससारज्ञे सर्वदा मधुरप्रिये । नारायणाख्यपीयूषं पिब जिह्वे निरन्तरम् ॥ ॥ व्यास उवाच
    । सत्यं सत्यं पुनः सत्यं सत्यं सत्यं वदाम्यहम् । नास्ति वेदात्परं शास्त्रं न देवः केशवात्परः ॥ ॥ धन्वन्तरिरुवाच
    । अच्युतानन्त गोविन्द नामोच्चारणभेषजात् । नश्यन्ति सकला रोगाः सत्यं सत्यं वदाम्यहम् ॥ ॥ मार्कण्डेय
    उवाच । स्वर्गदं मोक्षदं देवं सुखदं जगतो गुरुम् । कथं मुहुर्तमपि तं वासुदेवं न चिन्तयेत् ॥ ॥ अगस्त्य
    उवाच । निमिषं निमिषार्धं वा प्राणिनां विष्णुचिन्तनम् । तत्र तत्र कुरुक्षेत्रं प्रयागो नैमिषं वरम्
    ॥ ॥ वामदेव उवाच । निमिषं निमिषार्धं वा प्राणिनां विष्णुचिन्तनम् । कल्पकोटिसहस्राणि लभते वाञ्छितं फलम्
    ॥ ॥ शुक उवाच । आलोड्य सर्वशास्त्राणि विचार्य च पुनः पुनः । इदमेकं सुनिष्पन्नं ध्येयो नारायणः सदा ॥
    ॥ श्रीमहादेव उवाच । शरीरे जर्जरीभूते व्याधिग्रस्ते कलेवरे । औषधं जाह्नवीतोयं वैद्यो नारायणो हरिः ॥
    ॥ शौनक उवाच । भोजनाच्छादने चिन्तां वृथा कुर्वन्ति वैष्णवाः । योऽसौ विश्वम्भरो देवः स किं भक्तानुपेक्षते
    ॥ ॥ सनत्कुमार उवाच । यस्य हस्ते गदा चक्रं गरुडो यस्य वाहनम् । शङ्खचक्रगदापद्मी स मे विष्णुः प्रसीदतु
    ॥ ॥ एवं ब्रह्मादयो देवा ऋषयश्च तपोधनाः । कीर्तयन्ति सुरश्रेष्ठमेवं नारायणं विभुम् ॥ ॥ इदं पवित्रमायुष्यं
    पुण्यं पापप्रणाशनम् । दुःस्वप्ननाशनं स्तोत्रं पाण्डवैः परिकीर्तितम् ॥ ॥ यः पठेत्प्रातरुत्थाय शुचिस्तद्गतमानसः
    । गवां शतसहस्रस्य सम्यग्दत्तस्य यत्फलम् ॥ ॥ तत्फलं समवाप्नोति यः पठेदिति संस्तवम् । सर्वपापविनिर्मुक्तो
    विष्णुलोकं स गच्छति ॥ ॥ गङ्गा गीता च गायत्री गोविन्दो गरुडध्वजः । गकारैः पञ्चभिर्युक्तः पुनर्जन्म
    न विद्यते ॥ ॥ गीतां यः पठते नित्यं श्लोकार्धं श्लोकमेव वा । मुच्यते सर्वपापेभ्यो विष्णुलोकं स गच्छति
    ॥ ॥ इति पाण्डवगीता अथवा प्रपन्नगीता समाप्ता । ॐ तत्सत् ।
