id: rama-sabha
category: stotram
name:
  english: Rama Sabha
content:
  english: raghu ramasabha sita kanta kalyana sabha | arishadvargamularayu sabha paramapadambunu òsagu
    sabha || vedantulake jnana sabha vipravarulake dana sabha | durjanulaku virodhi sabha sajjanulaku
    santosha sabha || rajasabha raghu ramasabha sita kanta kalyana sabha | suralu asurulu kòlacu sabha
    amarulu rudrulu pògadu sabha | vèruvaka harivillu viracu sabha janakuni madi mèppincu sabha || rajasabha
    raghu ramasabha sita kanta kalyana sabha | bhakti jnanamulòsagu sabha srishti rahitulai nilacu sabha
    | uttama purushula mukti sabha citta vishrantinòsagu sabha || rajasabha raghu ramasabha sita kanta
    kalyana sabha | gam dharvulu ganamu ceyu sabha ram bhadulu natyamuladu sabha | pushpa varshamulu kuriyu
    sabha pujyulaina munulundu sabha || rajasabha raghu ramasabha sita kanta kalyana sabha | arishadvargamularayu
    sabha arishadvargamularayu sabha
  devanagari: रघु रामसभ सीता कान्त कल्याण सभ । अरिषड्वर्गमुलरयु सभ परमपदम्बुनु ऒसगु सभ ॥ वेदान्तुलके ज्ञान
    सभ विप्रवरुलके दान सभ । दुर्जनुलकु विरोधि सभ सज्जनुलकु सन्तोष सभ ॥ राजसभ रघु रामसभ सीता कान्त कल्याण
    सभ । सुरलु असुरुलु कॊलचु सभ अमरुलु रुद्रुलु पॊगडु सभ । वॆरुवक हरिविल्लु विरचु सभ जनकुनि मदि मॆप्पिञ्चु
    सभ ॥ राजसभ रघु रामसभ सीता कान्त कल्याण सभ । भक्ति ज्ञानमुलॊसगु सभ सृष्टि रहितुलै निलचु सभ । उत्तम
    पुरुषुल मुक्ति सभ चित्त विश्रान्तिनॊसगु सभ ॥ राजसभ रघु रामसभ सीता कान्त कल्याण सभ । गं धर्वुलु गानमु
    चेयु सभ रं भादुलु नाट्यमुलाडु सभ । पुष्प वर्षमुलु कुरियु सभ पूज्युलैन मुनुलुण्डु सभ ॥ राजसभ रघु रामसभ
    सीता कान्त कल्याण सभ । अरिषड्वर्गमुलरयु सभ अरिषड्वर्गमुलरयु सभ
