id: indraramastotra
category: stotram
name:
  english: indraramastotra
  devanagari: इन्द्ररामस्तोत्र
content:
  english: indrakritam ramastotram indra uvaca bhaje'ham sada ramamindivarabham bhavaranyadavanalabhabhidhanam
    | bhavanihrida bhavitanandarupam bhavabhavahetum bhavadiprapannam || 1|| suranikaduhkhaughanashaikahetum
    narakaradeham nirakaramidyam | paresham paranandarupam varenyam harim ramamisham bhaje bharanasham
    || 2|| prapannakhilanandadoham prapannam prapannartinihsheshanashabhidhanam | tapoyogayogishabhavabhibhavyam
    kapishadimitram bhaje ramamitram || 3|| sada bhogabhajam sudure vibhantam sada yogabhajamadure vibhantam
    | cidanandakandam sada raghavesham videhatmajanandarupam prapadye || 4|| mahayogamayavisheshanuyukto
    vibhasisha lilanarakaravrittih | tvadanandalilakathapurnakarnah sadanandarupa bhavantiha loke || 5||
    aham manapanabhimattapramatto na vedakhileshabhimanabhimanah | idanim bhavatpadapadmaprasadattrilokadhipatyabhimano
    vinashtah || 6|| sphuradratnakeyuraharabhiramam dharabharabhutasuranikadavam | sharaccandravaktram
    lasatpadmanetram duravaraparam bhaje raghavesham || 7|| suradhishanilabhranilangakantim viradhadirakshovadhallokashantim
    | kiritadishobham puraratilabham bhaje ramacandram raghunamadhisham || 8|| lasaccandrakotiprakashadipithe
    samasinamanke samadhaya sitam | sphuraddhemavarnam taditpunjabhasam bhaje ramacandram nivrittartitandram
    || 9|| || iti shrimadadhyatmaramayane yuddhakande trayodashasarge indrakritashriramastotram sampurnam
    ||
  devanagari: इन्द्रकृतं रामस्तोत्रम् इन्द्र उवाच भजेऽहं सदा राममिन्दीवराभं भवारण्यदावानलाभाभिधानम् ।
    भवानीहृदा भावितानन्दरूपं भवाभावहेतुं भवादिप्रपन्नम् ॥ १॥ सुरानीकदुःखौघनाशैकहेतुं नराकारदेहं निराकारमीड्यम्
    । परेशं परानन्दरूपं वरेण्यं हरिं राममीशं भजे भारनाशम् ॥ २॥ प्रपन्नाखिलानन्ददोहं प्रपन्नं प्रपन्नार्तिनिःशेषनाशाभिधानम्
    । तपोयोगयोगीशभावाभिभाव्यं कपीशादिमित्रं भजे राममित्रम् ॥ ३॥ सदा भोगभाजां सुदूरे विभान्तं सदा योगभाजामदूरे
    विभान्तम् । चिदानन्दकन्दं सदा राघवेशं विदेहात्मजानन्दरूपं प्रपद्ये ॥ ४॥ महायोगमायाविशेषानुयुक्तो विभासीश
    लीलानराकारवृत्तिः । त्वदानन्दलीलाकथापूर्णकर्णाः सदानन्दरूपा भवन्तीह लोके ॥ ५॥ अहं मानपानाभिमत्तप्रमत्तो
    न वेदाखिलेशाभिमानाभिमानः । इदानीं भवत्पादपद्मप्रसादात्त्रिलोकाधिपत्याभिमानो विनष्टः ॥ ६॥ स्फुरद्रत्नकेयूरहाराभिरामं
    धराभारभूतासुरानीकदावम् । शरच्चन्द्रवक्त्रं लसत्पद्मनेत्रं दुरावारपारं भजे राघवेशम् ॥ ७॥ सुराधीशनीलाभ्रनीलाङ्गकान्तिं
    विराधादिरक्षोवधाल्लोकशान्तिम् । किरीटादिशोभं पुरारातिलाभं भजे रामचन्द्रं रघूणामधीशम् ॥ ८॥ लसच्चन्द्रकोटिप्रकाशादिपीठे
    समासीनमङ्के समाधाय सीताम् । स्फुरद्धेमवर्णां तडित्पुञ्जभासां भजे रामचन्द्रं निवृत्तार्तितन्द्रम् ॥
    ९॥ ॥ इति श्रीमदध्यात्मरामायणे युद्धकाण्डे त्रयोदशसर्गे इन्द्रकृतश्रीरामस्तोत्रं सम्पूर्णम् ॥
