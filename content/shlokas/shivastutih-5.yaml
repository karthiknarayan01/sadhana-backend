id: shivastutih-5
category: stotram
name:
  english: shivastutih
  devanagari: शिवस्तुतिः
content:
  english: nirvapanandhakaharava sadaiva mam tvam || 54|| sheshahibhusha varayoshakritardhakaya doshadhirajavaracuda
    vrishadhirudha | veshayitakhilajagatkalanavishesha kashayavastraparidhana namo namaste || 55|| alingastvamatma
    katham lingasamsthah sphulingopamam tvatta evam prasutam | jagannashvaram shashvadetadvicitram prasida
    prasida prabho candracuda || 56|| evam vai shravane mase pujya stutva maheshvaram | dadyadgomithunam
    shvetam savatsam dakshinanvitam || 57|| shambhavebhyo huneddhomam paurnamyam bhojayed dvijan | svayam
    bhunjita capyante supapupairmanoharaih || 58|| prasadya devamishanamamasam naktabhojanah | evam yah
    shravanam masam prapayetpujaya mama || 59|| || iti shivarahasyantargate ishvaraproktam shravanamasakrite
    shivastutih sampurna ||
  devanagari: निर्वापणान्धकहराव सदैव मां त्वम् ॥ ५४॥ शेषाहिभूष वरयोषकृतार्धकाय दोषाधिराजवरचूड वृषाधिरूढ
    । वेषायिताखिलजगत्कलनाविशेष काषायवस्त्रपरिधान नमो नमस्ते ॥ ५५॥ अलिङ्गस्त्वमात्मा कथं लिङ्गसंस्थः स्फुलिङ्गोपमं
    त्वत्त एवं प्रसूतम् । जगन्नश्वरं शश्वदेतद्विचित्रं प्रसीद प्रसीद प्रभो चन्द्रचूड ॥ ५६॥ एवं वै श्रवणे
    मासे पूज्य स्तुत्वा महेश्वरम् । दद्याद्गोमिथुनं श्वेतं सवत्सं दक्षिणान्वितम् ॥ ५७॥ शाम्भवेभ्यो हुनेद्धोमं
    पौर्णम्यां भोजयेद् द्विजान् । स्वयं भुञ्जीत चाप्यन्ते सूपापूपैर्मनोहरैः ॥ ५८॥ प्रसाद्य देवमीशानमामासं
    नक्तभोजनः । एवं यः श्रावणं मासं प्रापयेत्पूजया मम ॥ ५९॥ ॥ इति शिवरहस्यान्तर्गते ईश्वरप्रोक्तं श्रावणमासकृते
    शिवस्तुतिः सम्पूर्णा ॥
