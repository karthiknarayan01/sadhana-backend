id: annamayya-keerthanas-muddugaare-yasoda
category: stotram
name:
  english: Annamayya Keerthanas Muddugaare Yasoda
content:
  english: adi pallavi muddugare yashoda mungiti mutyamu vidu | tiddarani mahimala devaki sutudu || anta
    ninta gòllètala araceti manikyamu | panta made kamsuni pali vajramu | kantula mudu lokala garuda pacca
    busa | cèntala malo nunna cinni krishnudu || muddugare yashoda mungiti mutyamu vidu ratikeli rukminiki
    rangu movi pagadamu | miti govardhanapu gomedhikamu | satamai shankha cakrala sandula vaiduryamu |
    gatiyai mammu gaceti kamalakshudu || muddugare yashoda mungiti mutyamu vidu kalinguni talalapai gappina
    pushyaragamu | yeleti shri venkatadri yindranilamu | pala jalanidhi lona bayani divya ratnamu | balunivalè
    dirigi badma nabhudu || muddugare yashoda mungiti mutyamu vidu
  devanagari: आदि पल्लवि मुद्दुगारे यशोद मुङ्गिटि मुत्यमु वीडु । तिद्दरानि महिमल देवकी सुतुडु ॥ अन्त निन्त
    गॊल्लॆतल अरचेति माणिक्यमु । पन्त माडे कंसुनि पालि वज्रमु । कान्तुल मूडु लोकाल गरुड पच्च बूस । चॆन्तल
    मालो नुन्न चिन्नि कृष्णुडु ॥ मुद्दुगारे यशोद मुङ्गिटि मुत्यमु वीडु रतिकेलि रुक्मिणिकि रङ्गु मोवि पगडमु
    । मिति गोवर्धनपु गोमेधिकमु । सतमै शङ्ख चक्राल सन्दुल वैडूर्यमु । गतियै मम्मु गाचेटि कमलाक्षुडु ॥ मुद्दुगारे
    यशोद मुङ्गिटि मुत्यमु वीडु कालिङ्गुनि तललपै गप्पिन पुष्यरागमु । येलेटि श्री वेङ्कटाद्रि यिन्द्रनीलमु
    । पाल जलनिधि लोन बायनि दिव्य रत्नमु । बालुनिवलॆ दिरिगी बद्म नाभुडु ॥ मुद्दुगारे यशोद मुङ्गिटि मुत्यमु
    वीडु
