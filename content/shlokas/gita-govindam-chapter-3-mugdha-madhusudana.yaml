id: gita-govindam-chapter-3-mugdha-madhusudana
category: stotram
name:
  english: Gita Govindam Chapter 3 - Mugdha Madhusudana
content:
  english: '|| tritiyah sargah || || mugdhamadhusudanah || kamsarirapi samsaravasanabandhashrinkhalam
    | radhamadhaya hridaye tatyaja vrajasundarih || || itastatastamanusritya radhika manangabanavranakhinnamanasah
    | kritanutapah sa kalindanandini tatantakunje vishasada madhavah || || mamiyam calita vilokya vritam
    vadhunicayena | saparadhataya mayapi na varitatibhayena || hari hari hatadarataya gata sa kupiteva
    || || kim karishyati kim vadishyati sa ciram virahena | kim dhanena janena kim mama jivanena grihena
    || || cintayami tadananam kutilabhru kopabharena | shonapadmamivopari bhramatakulam bhramarena ||
    || tamaham hridi sangatamanisham bhrisham ramayami | kim vane''nusarami tamiha kim vritha vilapami
    || || tanvi khinnamasuyaya hridayam tavakalayami | tanna vedmi kuto gatasi na tena te''nunayami ||
    || drishyate purato gatagatameva me vidadhasi | kim pureva sasambhramam parirambhanam na dadasi ||
    || kshamyatamaparam kadapi tavedrisham na karomi | dehi sundari darshanam mama manmathena dunomi ||
    || varnitam jayadevakena hareridam pravanena | kindubilvasamudrasambhavarohiniramanena || || hridi
    bisalataharo nayam bhujangamanayakah kuvalayadalashreni kanthe na sa garaladyutih | malayajarajo nedam
    bhasma priyarahite mayi prahara na harabhrantyananga krudha kimu dhavasi || || panau ma kuru cutasayakamamum
    ma capamaropaya kridanirjitavishva murchitajanaghatena kim paurusham | tasya eva mrigidrisho manasijaprenkhatkatakshashuga
    shrenijarjaritam managapi mano nadyapi sandhukshate || || bhrucape nihitah katakshavishikho nirmatu
    marmavyatham shyamatma kutilah karotu kabaribharo''pi marodyamam | moham tavadayam ca tanvi tanutam
    bimbadaro ragavan sadvrittastanamandalastava katham pranairmama kridati || || tani sparshasukhani
    te ca taralah snigdha drishorvibhrama stadvaktrambujasaurabham sa ca sudhasyandi giram vakrima | sa
    bimbadharamadhuriti vishayasange''pi cenmanasam tasyam lagnasamadhi hanta virahavyadhih katham vardhate
    || || bhrupallavam dhanurapangatarangitani banah gunah shravanapaliriti smarena | tasyamanangajayajangamadevatayam
    astrani nirjitajaganti kimarpitani || eshah shlokah keshucana samskaraneshu vidyate tiryakkantha vilola
    mauli taralottam sasya vamshoccarad diptisthana kritavadhana lalana lakshairna samlakshitah | sammugdhe
    madhusudanasya madhure radhamukhendau sudha sare kandalitashciram dadhatu vah kshemam katakshormmaya
    || || || iti shrigitagovinde mugdhamadhusudano nama tritiyah sargah ||'
  devanagari: ॥ तृतीयः सर्गः ॥ ॥ मुग्धमधुसूदनः ॥ कंसारिरपि संसारवासनाबन्धशृङ्खलाम् । राधामाधाय हृदये तत्याज
    व्रजसुन्दरीः ॥ ॥ इतस्ततस्तामनुसृत्य राधिका मनङ्गबाणव्रणखिन्नमानसः । कृतानुतापः स कलिन्दनन्दिनी तटान्तकुञ्जे
    विषसाद माधवः ॥ ॥ मामियं चलिता विलोक्य वृतं वधूनिचयेन । सापराधतया मयापि न वारितातिभयेन ॥ हरि हरि हतादरतया
    गता सा कुपितेव ॥ ॥ किं करिष्यति किं वदिष्यति सा चिरं विरहेण । किं धनेन जनेन किं मम जीवनेन गृहेण ॥
    ॥ चिन्तयामि तदाननं कुटिलभ्रु कोपभरेण । शोणपद्ममिवोपरि भ्रमताकुलं भ्रमरेण ॥ ॥ तामहं हृदि सङ्गतामनिशं
    भृशं रमयामि । किं वनेऽनुसरामि तामिह किं वृथा विलपामि ॥ ॥ तन्वि खिन्नमसूयया हृदयं तवाकलयामि । तन्न
    वेद्मि कुतो गतासि न तेन तेऽनुनयामि ॥ ॥ दृश्यते पुरतो गतागतमेव मे विदधासि । किं पुरेव ससम्भ्रमं परिरम्भणं
    न ददासि ॥ ॥ क्षम्यतामपरं कदापि तवेदृशं न करोमि । देहि सुन्दरि दर्शनं मम मन्मथेन दुनोमि ॥ ॥ वर्णितं
    जयदेवकेन हरेरिदं प्रवणेन । किन्दुबिल्वसमुद्रसम्भवरोहिणीरमणेन ॥ ॥ हृदि बिसलताहारो नायं भुजङ्गमनायकः
    कुवलयदलश्रेणी कण्ठे न सा गरलद्युतिः । मलयजरजो नेदं भस्म प्रियारहिते मयि प्रहर न हरभ्रान्त्यानङ्ग क्रुधा
    किमु धावसि ॥ ॥ पाणौ मा कुरु चूतसायकममुं मा चापमारोपय क्रीडानिर्जितविश्व मूर्छितजनाघातेन किं पौरुषम्
    । तस्या एव मृगीदृशो मनसिजप्रेङ्खत्कटाक्षाशुग श्रेणीजर्जरितं मनागपि मनो नाद्यापि सन्धुक्षते ॥ ॥ भ्रूचापे
    निहितः कटाक्षविशिखो निर्मातु मर्मव्यथां श्यामात्मा कुटिलः करोतु कबरीभारोऽपि मारोद्यमम् । मोहं तावदयं
    च तन्वि तनुतां बिम्बादरो रागवान् सद्वृत्तस्तनमण्दलस्तव कथं प्राणैर्मम क्रीडति ॥ ॥ तानि स्पर्शसुखानि
    ते च तरलाः स्निग्धा दृशोर्विभ्रमा स्तद्वक्त्राम्बुजसौरभं स च सुधास्यन्दी गिरां वक्रिमा । सा बिम्बाधरमाधुरीति
    विषयासङ्गेऽपि चेन्मानसं तस्यां लग्नसमाधि हन्त विरहव्याधिः कथं वर्धते ॥ ॥ भ्रूपल्लवं धनुरपाङ्गतरङ्गितानि
    बाणाः गुणः श्रवणपालिरिति स्मरेण । तस्यामनङ्गजयजङ्गमदेवतायां अस्त्राणि निर्जितजगन्ति किमर्पितानि ॥
    एषः श्लोकः केषुचन संस्करणेषु विद्यते तिर्यक्कण्ठ विलोल मौलि तरलोत्तं सस्य वंशोच्चरद् दीप्तिस्थान कृतावधान
    ललना लक्षैर्न संलक्षिताः । सम्मुग्धे मधुसूदनस्य मधुरे राधामुखेन्दौ सुधा सारे कन्दलिताश्चिरं दधतु वः
    क्षेमं कटाक्षोर्म्मय ॥ ॥ ॥ इति श्रीगीतगोविन्दे मुग्धमधुसूदनो नाम तृतीयः सर्गः ॥
