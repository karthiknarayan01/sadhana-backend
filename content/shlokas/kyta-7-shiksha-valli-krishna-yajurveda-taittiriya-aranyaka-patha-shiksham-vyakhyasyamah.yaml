id: kyta-7-shiksha-valli-krishna-yajurveda-taittiriya-aranyaka-patha-shiksham-vyakhyasyamah
category: stotram
name:
  english: KYTA 7 Shiksha Valli - Krishna Yajurveda Taittiriya Aranyaka Patha - Shiksham Vyakhyasyamah
content:
  english: krishna yajurvediya taittiriya aranyake saptamah prapathakah shri gurubhyo namah | harih om
    || anuvakam va~runah | shanno bhavatvaryama | shanna indro brihaspatih | shanno vishnu rurukramah
    | namo brahmane | namaste vayo | tvameva pratyaksha mbrahmasi | tvameva pratyaksha mbrahma vadishyami
    | ritam va~dishyami | satyam va~dishyami | tanmamavatu | tadvaktaramavatu | avatu mam | avatu vaktara
    sattyam ~vadishyami panca ca ssvarah | matra balam | sama santanah | ityukta saha nau yashah | saha
    nau brahmavarcasam || athata ssagmhitaya upanishadam khyasyamah | pancasvadhi karaneshu | adhilokamadhi
    maddhyatmam | ta mahasagmhita ityacakshate || athadhi lokam | prithivi pu rvarupam | dyauruttararupam
    | akasha || vayuh sandhanam | ityadhi lokam || athadhi jyautisham | agnih pu rva rupam | aditya uttararupam
    | apa ssandhih | vaidyutah sandhanam | ityadhi jyautisham || athadhi vidyam | acaryah pu || antevasyuttararupam
    | vidya sandhih | pravacanagm sandhanam | ityadhi vidyam || athadhiprajam | mata pu rvarupam | pitottararupam
    | praja sandhih | prajananagm sandhanam | ityadhiprajam || || athaddhyatmam | adharahanuh pu rva rupam
    | uttarahanu khsandhih | jihva sandhanam | ityaddhyatmam || iti mamaha sagmhitah || ya evameta mahasagmhita
    vyakhyata veda | sandhiyate prajaya pashubhih | brahmavarca senannadyena suvargyena mrishabho vishvarupah
    | chandobhyo thsambabhuva | sa mendro medhaya sprinotu | amritasya deva dharano bhuyasam || sharira
    shanam | jihva me madhumattama | karna mbhuri vishruvam | brahmanah kosho 'si medhaya 'pihitah | shruta
    mme gopaya || avahanti vitanvana || matmanah | vasagmsi mama gavashca | annapane ca sarvada | tato
    me shriya mpashubhih saha svaha || amayantu brahmacarina ''yantu brahmacarina ''yantu brahmacarina
    | damayantu brahmacarina | shamayantu brahmacarina ntva bhaga pravishani svaha | sa ma bhaga pravisha
    svaha thsahasra shakhe | nibhagaha ntvayi mrije svaha ''yanti | yatha masa aharjaram | eva mbrahmacarinah
    | dhatarayantu sarvata 'si pra ma bhahi pra ma padyasva || shamayantu brahmacarina dhatarayantu sarvata
    riti va eta stisro vyahritayah || tasamuhasmai ta ncaturthim | mahacamasyah pravedayate | maha iti
    || ta dbrahma | sa atma | anga lo~kah | bhuva ityantariksham | suva || maha ityadityah | adityena
    vava sarve loka mahiyante || bhuriti va agnih | bhuva iti vayuh | suvarityadityah | maha iti candramah
    | candramasa vava sarvani jyotigmshi mahiyante || bhu riti va ricah | bhuva iti samani | suva riti
    yajugmshi || || maha iti brahma | brahmana vava sarve veda mahiyante || bhuriti vai pranah | bhuva
    ityapanah | suvariti vyanah | maha ityanna m | annena vava sarve prana mahiyante || ta va eta shcatasra
    shcaturdha | catasra shcatasro vyahritayah | ta yo veda | sa veda brahma | sarve 'smai deva balimavahanti
    || hridaya akashah | tasminnaya mpurusho manomayah | amrito hiranmayah || antarena taluke | ya esha
    stana ivavalambate | se ndra yonih | yatrasau keshanto vivartate | vyapohya shir shakapale || bhurityagnau
    pratitishthati | bhuva iti vayau || || suvarityaditye | maha iti brahmani | apnoti svara jyam | apnoti
    manasaspati m | vakpati shcakshushpatih | shrotrapati rvijnanapatih | eta ttato bhavati | akasha sharira
    mbrahma | satyatma pranarama mmana anandam | shanti samriddha m || iti pracina yogyopa prithivyantariksha
    'vantaradishah | agni shcandrama nakshatrani | apa oshadhayo vanaspataya akasha atma | ityadhibhutam
    || athaddhyatmam | prano vyano ktvak | carma magm sagg snavasthi majja || eta dadhividhayarshi ravocat
    | panktam m | panktanaiva panktagg sprinotiti || danukriti hasma va apyo shravayetya miti samani gayanti
    | ogm shomiti shastrani shagmsanti | omityaddhvaryuh pratigara mpratigrinati | omiti brahma prasauti
    | omityagnihotra manujanati | omiti brahmanah pravakshyannaha brahmopa pnavaniti | brahmaivo nca svaddhyaya
    pravacane ca | satya nca svaddhyaya pravacane ca | tapashca svaddhyaya pravacane ca | damashca svaddhyaya
    pravacane ca | shamashca svaddhyaya pravacane ca | agnayashca svaddhyaya pravacane ca | agnihotra
    nca svaddhyaya pravacane ca | atithayashca svaddhyaya pravacane ca | manusha nca svaddhyaya pravacane
    ca | praja ca svaddhyaya pravacane ca | prajanashca svaddhyaya pravacane ca | prajatishca svaddhyaya
    pravacane ca || satyamiti satyavaca rathi tarah | tapa iti taponityah paurushishtih | svaddhyaya pravacane
    eveti nako maudgalyah | taddhi tapastaddhi tapah || praja ca svaddhyayapravacane ca shatca vri~kshasya
    reriva | kirtih prishtha ngireriva | urdhva pavitro vajiniva svamritamasmi | dravinagm savarcasam
    | sumedha amritokshitah | iti trishanko manushasti || satyam nma pramadah | acaryaya priya ndhanamahritya
    prajatantu mma vyavacchethsih | satyanna pramaditavyam | dharmanna pramaditavyam | kushalanna pramaditavyam
    | bhutyai na pramaditavyam | svaddhyaya pravacanabhya nna pramaditavyam || nna pramaditavyam || matridevo
    bhava | pitridevo bhava | acarya devo bhava | atithidevo bhava || yanyanavadyani karmani | tani sevitavyani
    | no itarani || yanyasmakagm sucaritani | tani tvayopasyani || || no itarani || ye ke casma cchreyagmso
    brahmanah | tesha ''sane na prashvasitavyam || shraddhaya deyam | ashraddhaya 'deyam | shriya deyam
    | hriya deyam | bhiya deyam | sam vi~da deyam || atha yadi te karmavicikithsa va vritta vicikithsa
    va syat || shinah | yukta ayuktah | aluksha dharmakama ssyuh | yatha te tatra varterann | tatha tatra
    vartethah || athabhya khyateshu | ye tatra brahmana ssammarshinah | yukta ayuktah | aluksha dharma
    kama ssyuh | yatha te teshu varterann || || tatha teshu vartethah || esha adeshah | esha upadeshah
    | esha vedopanishat | etadanushasanam | eva mupasitavyam | eva mucaitadupasyam || svaddhyayapravacanabhya
    va~runah | shanno bhavatvaryama | shanna indro brihaspatih | shanno vishnu rurukramah | namo brahmane
    | namaste vayo | tvameva pratyaksha mbrahmasi | tvameva pratyaksha mbrahma vadisham | ritamavadisham
    | satyamavadisham | tanmamavit | tadvaktaramavit | avinmam | avi || iti shikshavalli samapta || ||
    harih om || || krishna yajurvediya taittiriya aranyake saptamah prapathaka
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय आरण्यके सप्तमः प्रपाठकः श्री गुरुभ्यो नमः । ह॒रिः॒ ओम् ॥ अनुवाकं
    वँरु॑णः । शन्नो॑ भवत्वर्य॒मा । शन्न॒ इन्द्रो॒ बृह॒स्पतिः॑ । शन्नो॒ विष्णु॑ रुरुक्र॒मः । नमो॒ ब्रह्म॑णे
    । नम॑स्ते वायो । त्वमे॒व प्र॒त्यक्ष॒ म्ब्रह्मा॑सि । त्वमे॒व प्र॒त्यक्ष॒ म्ब्रह्म॑ वदिष्यामि । ऋ॒तं
    वँ॑दिष्यामि । स॒त्यं वँ॑दिष्यामि । तन्माम॑वतु । तद्व॒क्तार॑मवतु । अव॑तु॒ माम् । अव॑तु व॒क्तार स॒त्त्यम्
    ँव॑दिष्यामि॒ पञ्च॑ च स्स्वरः । मात्रा॒ बलम् । साम॑ सन्ता॒नः । इत्युक्त स॒ह नौ॒ यशः । स॒ह नौ ब्र॑ह्मव॒र्चसम्
    ॥ अथात स्सग्ंहिताया उपनिषदं ख्यास्या॒मः । पञ्चस्वधि क॑रणे॒षु । अधिलोकमधि मद्ध्या॒त्मम् । ता महासग्ंहिता
    इ॑त्याच॒क्षते ॥ अथा॑धि लो॒कम् । पृथिवी पू र्वरू॒पम् । द्यौरुत्त॑ररू॒पम् । आका॑श ॥ वायुः॑ सन्धा॒नम्
    । इत्य॑धि लो॒कम् ॥ अथा॑धि ज्यौ॒तिषम् । अग्निः पू र्व रू॒पम् । आदित्य उत्त॑ररू॒पम् । आ॑प स्स॒न्धिः
    । वैद्युतः॑ सन्धा॒नम् । इत्य॑धि ज्यौ॒तिषम् ॥ अथा॑धि वि॒द्यम् । आचार्यः पू ॥ अन्तेवास्युत्त॑ररू॒पम्
    । वि॑द्या स॒न्धिः । प्रवचनग्ं॑ सन्धा॒नम् । इत्य॑धि वि॒द्यम् ॥ अथाधि॒प्रजम् । माता पू र्वरू॒पम् । पितोत्त॑ररू॒पम्
    । प्र॑जा स॒न्धिः । प्रजननग्ं॑ सन्धा॒नम् । इत्यधि॒प्रजम् ॥ ॥ अथाद्ध्या॒त्मम् । अधराहनुः पू र्व रू॒पम्
    । उत्तराहनु ख्स॒न्धिः । जिह्वा॑ सन्धा॒नम् । इत्यद्ध्या॒त्मम् ॥ इती माम॑हा स॒ग्ं॒हिताः ॥ य एवमेता महासग्ंहिता
    व्याख्या॑ता वे॒द । सन्धीयते प्रज॑या प॒शुभिः । ब्रह्मवर्च सेनान्नाद्येन सुवर्ग्येण॑ मृष॒भो वि॒श्वरू॑पः
    । छन्दो॒भ्यो थ्सम्ब॒भूव॑ । स मेन्द्रो॑ मे॒धया स्पृणोतु । अ॒मृत॑स्य देव॒ धार॑णो भूयासम् ॥ शरी॑र षणम्
    । जि॒ह्वा मे॒ मधु॑मत्तमा । कर्णा म्भूरि॒ विश्रु॑वम् । ब्रह्म॑णः को॒शो॑ ऽसि मे॒धया ऽपि॑हितः । श्रु॒त
    म्मे॑ गोपाय ॥ आ॒वह॑न्ती वितन्वा॒ना ॥ मा॒त्मनः॑ । वासाग्ं॑सि॒ मम॒ गाव॑श्च । अ॒न्न॒पा॒ने च॑ सर्व॒दा
    । ततो॑ मे॒ श्रिय॒ म्प॒शुभिः॑ स॒ह स्वाहा ॥ आमा॑यन्तु ब्रह्मचा॒रिण॒ ऽऽयन्तु ब्रह्मचा॒रिण॒ ऽऽयन्तु ब्रह्मचा॒रिण॒
    । दमा॑यन्तु ब्रह्मचा॒रिण॒ । शमा॑यन्तु ब्रह्मचा॒रिण॒ न्त्वा॑ भग॒ प्रवि॑शानि॒ स्वाहा । स मा॑ भग॒ प्रवि॑श॒
    स्वाहा थ्स॒हस्र॑ शाखे । निभ॑गा॒ह न्त्वयि॑ मृजे॒ स्वाहा ऽऽयन्ति॑ । यथा॒ मासा॑ अहर्ज॒रम् । ए॒व म्ब्र॑ह्मचा॒रिणः॑
    । धात॒राय॑न्तु स॒र्वत॒ ऽसि॒ प्र मा॑ भाहि॒ प्र मा॑ पद्यस्व ॥ शमा॑यन्तु ब्रह्मचा॒रिण॒ धात॒राय॑न्तु स॒र्वत॒
    रिति॒ वा ए॒ता स्ति॒स्रो व्याहृ॑तयः ॥ तासा॑मुहस्मै॒ ता ञ्च॑तु॒र्थीम् । माहा॑चमस्यः॒ प्रवे॑दयते । मह॒
    इति॑ ॥ त द्ब्रह्म॑ । स आ॒त्मा । अङ्गा लोँ॒कः । भुव॒ इत्य॒न्तरि॑क्षम् । सुव॒ ॥ मह॒ इत्या॑दि॒त्यः ।
    आ॒दि॒त्येन॒ वाव सर्वे॑ लो॒का मही॑यन्ते ॥ भूरिति॒ वा अ॒ग्निः । भुव॒ इति॑ वा॒युः । सुव॒रित्या॑दि॒त्यः
    । मह॒ इति॑ च॒न्द्रमाः । च॒न्द्रम॑सा॒ वाव सर्वा॑णि॒ ज्योतीग्ं॑षि॒ मही॑यन्ते ॥ भू रिति॒ वा ऋचः॑ । भुव॒
    इति॒ सामा॑नि । सुव॒ रिति॒ यजूग्ं॑षि ॥ ॥ मह॒ इति॒ ब्रह्म॑ । ब्रह्म॑णा॒ वाव सर्वे॑ वे॒दा मही॑यन्ते ॥
    भूरिति॒ वै प्रा॒णः । भुव॒ इत्य॑पा॒नः । सुव॒रिति॑ व्या॒नः । मह॒ इत्यन्न म् । अन्ने॑न॒ वाव सर्वे प्रा॒णा
    मही॑यन्ते ॥ ता वा ए॒ता श्चत॑स्र श्चतु॒र्धा । चत॑स्र श्चतस्रो॒ व्याहृ॑तयः । ता यो वेद॑ । स वे॑द॒ ब्रह्म॑
    । सर्वे ऽस्मै दे॒वा ब॒लिमाव॑हन्ति ॥ हृ॑दय आका॒शः । तस्मि॑न्न॒य म्पुरु॑षो मनो॒मयः॑ । अमृ॑तो हिर॒ण्मयः॑
    ॥ अन्त॑रेण॒ तालु॑के । य ए॒ष स्तन॑ इवाव॒लम्ब॑ते । से न्द्र यो॒निः । यत्रा॒सौ के॑शा॒न्तो वि॒वर्त॑ते
    । व्य॒पोह्य॑ शीर् षकपा॒ले ॥ भूरित्य॒ग्नौ प्रति॑तिष्ठति । भुव॒ इति॑ वा॒यौ ॥ ॥ सुव॒रित्या॑दि॒त्ये ।
    मह॒ इति॒ ब्रह्म॑णि । आ॒प्नोति॒ स्वारा ज्यम् । आ॒प्नोति॒ मन॑स॒स्पति म् । वाक्प॑ति॒ श्चक्षु॑ष्पतिः ।
    श्रोत्र॑पति र्वि॒ज्ञान॑पतिः । ए॒त त्ततो॑ भवति । आ॒का॒श श॑रीर॒ म्ब्रह्म॑ । स॒त्यात्म॑ प्रा॒णारा॑म॒
    म्मन॑ आनन्दम् । शान्ति॑ समृद्ध म् ॥ इति॑ प्राचीन यो॒ग्योपा पृ॒थि॒व्य॑न्तरि॑क्ष॒ ऽवान्तरदि॒शाः । अ॒ग्नि
    श्च॒न्द्रमा॒ नक्ष॑त्राणि । आप॒ ओष॑धयो॒ वन॒स्पत॑य आका॒श आ॒त्मा । इत्य॑धिभू॒तम् ॥ अथाद्ध्या॒त्मम् ।
    प्रा॒णो व्या॒नो॑ क्त्वक् । चर्म॑ मा॒ग्ं॒ सग्ग् स्नावास्थि॑ म॒ज्जा ॥ ए॒त द॑धिवि॒धाय॒र्॒षि॒ रवो॑चत्
    । पाङ्क्तं॒ म् । पाङ्क्त॑नै॒व पाङ्क्तग्ग्॑ स्पृणो॒तीति॑ ॥ द॑नुकृति हस्म॒ वा अ॒प्यो श्रा॑व॒येत्या मिति॒
    सामा॑नि गायन्ति । ओग्ं शोमिति॑ श॒स्त्राणि॑ शग्ंसन्ति । ओमित्य॑द्ध्व॒र्युः प्र॑तिग॒र म्प्रति॑गृणाति
    । ओमिति॒ ब्रह्मा॒ प्रसौ॑ति । ओमित्य॑ग्निहो॒त्र मनु॑जानाति । ओमिति॑ ब्राह्म॒णः प्र॑व॒क्ष्यन्ना॑ह॒ ब्रह्मोपा
    प्नवा॒नीति॑ । ब्रह्मै॒वो ञ्च स्वाद्ध्याय प्रव॑चने॒ च । सत्य ञ्च स्वाद्ध्याय प्रव॑चने॒ च । तपश्च स्वाद्ध्याय
    प्रव॑चने॒ च । दमश्च स्वाद्ध्याय प्रव॑चने॒ च । शमश्च स्वाद्ध्याय प्रव॑चने॒ च । अग्नयश्च स्वाद्ध्याय
    प्रव॑चने॒ च । अग्निहोत्र ञ्च स्वाद्ध्याय प्रव॑चने॒ च । अतिथयश्च स्वाद्ध्याय प्रव॑चने॒ च । मानुष ञ्च
    स्वाद्ध्याय प्रव॑चने॒ च । प्रजा च स्वाद्ध्याय प्रव॑चने॒ च । प्रजनश्च स्वाद्ध्याय प्रव॑चने॒ च । प्रजातिश्च
    स्वाद्ध्याय प्रव॑चने॒ च ॥ सत्यमिति सत्यवचा॑ राथी॒ तरः । तप इति तपोनित्यः पौ॑रुशि॒ष्टिः । स्वाद्ध्याय
    प्रवचने एवेति नाको॑ मौद्ग॒ल्यः । तद्धि तप॑स्तद्धि॒ तपः ॥ प्रजा च स्वाद्ध्यायप्रव॑चने॒ च षट्च॑ वृँ॒क्षस्य॒
    रेरि॑वा । की॒र्तिः पृ॒ष्ठ ङ्गि॒रेरि॑व । ऊ॒र्ध्व प॑वित्रो वा॒जिनी॑व स्व॒मृत॑मस्मि । द्रवि॑ण॒ग्ं॒ सव॑र्चसम्
    । सुमेधा अ॑मृतो॒क्षितः । इति त्रिशङ्को म॑नुशा॒स्ति ॥ सत्यं॒ न्मा प्र॒मदः । आचार्याय प्रिय न्धनमाहृत्य
    प्रजातन्तु म्मा व्य॑वच्छे॒थ्सीः । सत्यान्न प्रम॑दित॒व्यम् । धर्मान्न प्रम॑दित॒व्यम् । कुशलान्न प्रम॑दित॒व्यम्
    । भूत्यै न प्रम॑दित॒व्यम् । स्वाद्ध्याय प्रवचनाभ्या न्न प्रम॑दित॒व्यम् ॥ न्न प्रम॑दित॒व्यम् ॥ मातृ॑देवो॒
    भव । पितृ॑देवो॒ भव । आचार्य॑ देवो॒ भव । अतिथि॑देवो॒ भव ॥ यान्यनवद्यानि॑ कर्मा॒णि । तानि सेवि॑तव्या॒नि
    । नो इ॑तरा॒णि ॥ यान्यस्माकग्ं सुच॑रिता॒नि । तानि त्वयो॑पास्या॒नि ॥ ॥ नो इ॑तरा॒णि ॥ ये के चास्म च्छ्रेयाग्ं॑सो
    ब्रा॒ह्मणाः । तेषा ऽऽसने न प्रश्व॑सित॒व्यम् ॥ श्रद्ध॑या दे॒यम् । अश्रद्ध॑या ऽदे॒यम् । श्रि॑या दे॒यम्
    । ह्रि॑या दे॒यम् । भि॑या दे॒यम् । सं विँ॑दा दे॒यम् ॥ अथ यदि ते कर्मविचिकिथ्सा वा वृत्त विचिकि॑थ्सा
    वा॒ स्यात् ॥ शिनः । युक्ता॑ आयु॒क्ताः । अलूक्षा॑ धर्म॑कामा॒ स्स्युः । यथा ते॑ तत्र॑ वर्ते॒रन्न् ।
    तथा तत्र॑ वर्ते॒थाः ॥ अथाभ्या ख्याते॒षु । ये तत्र ब्राह्मणा स्सम्म॒र्॒शिनः । युक्ता॑ आयु॒क्ताः । अलूक्षा॑
    धर्म॑ कामा॒ स्स्युः । यथा ते॑ तेषु॑ वर्ते॒रन्न् ॥ ॥ तथा तेषु॑ वर्ते॒थाः ॥ एष॑ आदे॒शः । एष उ॑पदे॒शः
    । एषा वे॑दोप॒निषत् । एतद॑नुशा॒सनम् । एव मुपा॑सित॒व्यम् । एव मुचैत॑दुपा॒स्यम् ॥ स्वाद्ध्यायप्रवचनाभ्या
    वँरु॑णः । शन्नो॑ भवत्वर्य॒मा । शन्न॒ इन्द्रो॒ बृह॒स्पतिः॑ । शन्नो॒ विष्णु॑ रुरुक्र॒मः । नमो॒ ब्रह्म॑णे
    । नम॑स्ते वायो । त्वमे॒व प्र॒त्यक्ष॒ म्ब्रह्मा॑सि । त्वामे॒व प्र॒त्यक्ष॒ म्ब्रह्मा वा॑दिषम् । ऋ॒तम॑वादिषम्
    । स॒त्यम॑वादिषम् । तन्मामा॑वीत् । तद्व॒क्तार॑मावीत् । आवी॒न्माम् । आवी ॥ इति शीक्षावल्ली समाप्ता ॥
