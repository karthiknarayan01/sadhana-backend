id: narayaniyam-dashaka-85
category: stotram
name:
  english: Narayaniyam Dashaka 85
content:
  english: tato magadhabhubhrita ciranirodhasankleshitam shatashtakayutayutadvitayamisha bhumibhritam
    | anathasharanaya te kamapi purusham prahino dayacata sa magadhakshapanameva kim bhuyasa || || yiyasurabhimagadham
    tadanu naradodirita dyudhishthiramakhodyamadubhayakaryaparyakulah | viruddhajayino'dhvaradubhayasiddhirityuddhave
    shashamsushi nijaih samam puramiyetha yaudhishthirim || || asheshadayitayute tvayi samagate dharmajo
    vijitya sahajairmahim bhavadapangasamvardhitaih | shriyam nirupamam vahannahaha bhaktadasayitam bhavantamayi
    magadhe prahitavan sabhimarjunam || || girivrajapuram gatastadanu deva yuyam trayo yayaca samarotsavam
    dvijamishena tam magadham | apurnasukritam tvamum pavanajena sangramayan nirikshya saha jishnuna tvamapi
    rajayuddhva sthitah || || ashantasamaroddhatam bitapapatanasanjnaya nipatya jararassutam pavanajena
    nishpatitam | vimucya nripatin muda samanugrihya bhaktim param dideshitha gatasprihanapi ca dharmaguptyai
    bhuvah || || pracakrushi yudhishthire tadanu rajasuyadhvaram prasannabhritakibhavatsakalarajakavyakulam
    | tvamapyayi jagatpate dvijapadavanejadikam cakartha kimu kathyate nripavarasya bhagyonnatih || ||
    tatah savanakarmani pravaramagryapujavidhim vicarya sahadevavaganugatah sa dharmatmajah | vyadhatta
    bhavate muda sadasi vishvabhutatmane tada sasuramanusham bhuvanameva triptim dadhau || || tatah sapadi
    cedipo muninripeshu tishthatsvaho sabhajayati ko jadah pashupadurdurutam vatum | iti tvayi sa durvacovitatimudvamannasana
    dudapatadudayudhah samapatannamum pandavah || || nivarya nijapakshaganabhimukhasyavidveshina stvameva
    jahrishe shiro danujadarina svarina | janustritayalabdhaya satatacintaya shuddhadhi stvaya sa paramekatamadhrita
    yoginam durlabham || || tatah sumahite tvaya kratuvare nirudhe jano yayau jayati dharmajo jayati krishna
    ityalapan| khalah sa tu suyodhano dhutamanassapatnashriya mayarpitasabhamukhe sthalajalabhramadabhramit
    || || tada hasitamutthitam drupadanandanabhimayo rapangakalaya vibho kimapi tavadujjrimbhayan | dharabharanirakritau
    sapadi nama bijam vapan janardana marutpurinilaya pahi mamamayat ||
  devanagari: ततो मगधभूभृता चिरनिरोधसङ्क्लेशितं शताष्टकयुतायुतद्वितयमीश भूमीभृताम् । अनाथशरणाय ते कमपि
    पूरुषं प्राहिणो दयाचत स मागधक्षपणमेव किं भूयसा ॥ ॥ यियासुरभिमागधं तदनु नारदोदीरिता द्युधिष्ठिरमखोद्यमादुभयकार्यपर्याकुलः
    । विरुद्धजयिनोऽध्वरादुभयसिद्धिरित्युद्धवे शशंसुषि निजैः समं पुरमियेथ यौधिष्ठिरीम् ॥ ॥ अशेषदयितायुते
    त्वयि समागते धर्मजो विजित्य सहजैर्महीं भवदपाङ्गसंवर्धितैः । श्रियं निरुपमां वहन्नहह भक्तदासायितं भवन्तमयि
    मागधे प्रहितवान् सभीमार्जुनम् ॥ ॥ गिरिव्रजपुरं गतास्तदनु देव यूयं त्रयो ययाच समरोत्सवं द्विजमिषेण
    तं मागधम् । अपूर्णसुकृतं त्वमुं पवनजेन सङ्ग्रामयन् निरीक्ष्य सह जिष्णुना त्वमपि राजयुद्ध्वा स्थितः
    ॥ ॥ अशान्तसमरोद्धतं बिटपपाटनासञ्ज्ञया निपात्य जररस्सुतं पवनजेन निष्पाटितम् । विमुच्य नृपतीन् मुदा
    समनुगृह्य भक्तिं परां दिदेशिथ गतस्पृहानपि च धर्मगुप्त्यै भुवः ॥ ॥ प्रचक्रुषि युधिष्ठिरे तदनु राजसूयाध्वरं
    प्रसन्नभृतकीभवत्सकलराजकव्याकुलम् । त्वमप्ययि जगत्पते द्विजपदावनेजादिकं चकर्थ किमु कथ्यते नृपवरस्य
    भाग्योन्नतिः ॥ ॥ ततः सवनकर्मणि प्रवरमग्र्यपूजाविधिं विचार्य सहदेववागनुगतः स धर्मात्मजः । व्यधत्त भवते
    मुदा सदसि विश्वभूतात्मने तदा ससुरमानुषं भुवनमेव तृप्तिं दधौ ॥ ॥ ततः सपदि चेदिपो मुनिनृपेषु तिष्ठत्स्वहो
    सभाजयति को जडः पशुपदुर्दुरूटं वटुम् । इति त्वयि स दुर्वचोविततिमुद्वमन्नासना दुदापतदुदायुधः समपतन्नमुं
    पाण्डवाः ॥ ॥ निवार्य निजपक्षगानभिमुखस्यविद्वेषिण स्त्वमेव जहृषे शिरो दनुजदारिणा स्वारिणा । जनुस्त्रितयलब्धया
    सततचिन्तया शुद्धधी स्त्वया स परमेकतामधृत योगिनां दुर्लभाम् ॥ ॥ ततः सुमहिते त्वया क्रतुवरे निरूढे जनो
    ययौ जयति धर्मजो जयति कृष्ण इत्यालपन्। खलः स तु सुयोधनो धुतमनास्सपत्नश्रिया मयार्पितसभामुखे स्थलजलभ्रमादभ्रमीत्
    ॥ ॥ तदा हसितमुत्थितं द्रुपदनन्दनाभीमयो रपाङ्गकलया विभो किमपि तावदुज्जृम्भयन् । धराभरनिराकृतौ सपदि
    नाम बीजं वपन् जनार्दन मरुत्पुरीनिलय पाहि मामामयात् ॥
