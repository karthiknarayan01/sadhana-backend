id: gopabalaihkritamshrikrishnaramastotram
category: stotram
name:
  english: gopabalaihkritamshrikrishnaramastotram
  devanagari: गोपबालैःकृतंश्रीकृष्णरामस्तोत्रम्
content:
  english: asman raksha samagaccha he krishna karunanidhe | he sankarshana no raksha prana no yanti danavat
    || 21|| he krishna he krishna hare murare govinda damodara dinabandho | gopisha gopesha bhavarnave'smanananta
    narayana raksha raksha || 22|| bhaye'bhaye vatha shubhe'shubhe va sukheshu duhkheshu ca dinanatha
    | tvaya vina'nyam sharanam bhavarnave na no'sti he madhava raksha raksha || 23|| jaya jaya gunasindho
    krishna bhaktaikabandho bahutarabhayayuktanbalakan raksha raksha | jahi danujakulanamishamasmakamantam
    surakulabaladarpam vardhayemam nihatya || 24|| iti brahmavaivartapurane shrikrishnajanmakhande dvavimshadhyayantargatam
    gopabalaih dhenukasurat rakshartham kritam shrikrishna
  devanagari: अस्मान् रक्ष समागच्छ हे कृष्ण करुणानिधे । हे सङ्कर्षण नो रक्ष प्राणा नो यान्ति दानवात् ॥
    २१॥ हे कृष्ण हे कृष्ण हरे मुरारे गोविन्द दामोदर दीनबन्धो । गोपीश गोपेश भवार्णवेऽस्माननन्त नारायण रक्ष
    रक्ष ॥ २२॥ भयेऽभये वाथ शुभेऽशुभे वा सुखेषु दुःखेषु च दीननाथ । त्वया विनाऽन्यं शरणं भवार्णवे न नोऽस्ति
    हे माधव रक्ष रक्ष ॥ २३॥ जय जय गुणसिन्धो कृष्ण भक्तैकबन्धो बहुतरभययुक्तान्बालकान् रक्ष रक्ष । जहि दनुजकुलानामीशमस्माकमन्तं
    सुरकुलबलदर्पं वर्धयेमं निहत्य ॥ २४॥ इति ब्रह्मवैवर्तपुराणे श्रीकृष्णजन्मखण्डे द्वाविंशाध्यायान्तर्गतं
    गोपबालैः धेनुकासुरात् रक्षार्थं कृतं श्रीकृष्ण
