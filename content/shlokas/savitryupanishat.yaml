id: savitryupanishat
category: upanishad
name:
  english: savitryupanishat
  devanagari: सावित्र्युपनिषत्
content:
  english: 3|| kah savita ka savitri yajna eva savita candamsi savitri sa yatra yajnastatra candamsi yatra
    va candamsi sa yajnaste dve yonistadekam mithunam || 4|| kah savita ka savitri stanayitrureva savita
    vidyutsavitri sa yatra stanayitrustadvidyut yatra va vidyuttatra stanayitruste dve yonistadekam mithunam
    || 5|| kah savita ka savitri aditya eva savita dyauh savitri sa yatradityastaddyauryatra va dyaustadadityaste
    dve yonistadekam mithunam || 6|| kah savita ka savitri
  devanagari: ३॥ कः सविता का सावित्री यज्ञ एव सविता चन्दांसि सावित्री स यत्र यज्ञस्तत्र चन्दांसि यत्र
    वा चन्दांसि स यज्ञस्ते द्वे योनिस्तदेकं मिथुनम् ॥ ४॥ कः सविता का सावित्री स्तनयित्रुरेव सविता विद्युत्सावित्री
    स यत्र स्तनयित्रुस्तद्विद्युत् यत्र वा विद्युत्तत्र स्तनयित्रुस्ते द्वे योनिस्तदेकं मिथुनम् ॥ ५॥ कः
    सविता का सावित्री आदित्य एव सविता द्यौः सावित्री स यत्रादित्यस्तद्द्यौर्यत्र वा द्यौस्तदादित्यस्ते
    द्वे योनिस्तदेकं मिथुनम् ॥ ६॥ कः सविता का सावित्री
