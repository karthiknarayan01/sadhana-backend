id: alternate
category: kavacha
name:
  english: alternate
  devanagari: अल्तेर्नते
content:
  english: dhyakarshini tatha || 15|| ahankarakarshini tu prakandam patu dakshinam | shabdakarshinika
    vamam sparshakarshinika'vatu || 16|| prakoshtham dakshinam patu rupakarshiniketaram | rasakarshinika
    patu manibandham ca dakshinam || 17|| gandhakarshinika vamam cittakarshinika'vatu | karabham dakshinam
    dhairyakarshini patu vamakam || 18|| smrityakarshinyasau vamam namakarshiniketaram | bijakarshinika
    payat satatam dakshinangulih || 19|| atmakarshinika tvanya amritakarshini nakhan | sharirakarshini
    vamanakhan rakshatu sarvada || 20|| anangakusuma shaktih patu dakshinastanopari | anangamekhala canyastanordhvamabhirakshatu
    || 21|| anangamadana dakshastanam taccucukam punah | rakshatadanisham devi hyanangahmadanatura ||
    22|| anangarekha vamam tu vakshoja tasya cucukam | anangavegini krodamanangasyankusha'vatu || 23||
    anangamalini payad vakshahsthalamaharnisham | sarvasankshobhini shaktirhrit sarvadravini para || 24||
    kukshim sarvakarshini tu patu parshvam ca dakshinam | ahladini vamaparshvam madhyam sammohini ciram
    || 25|| sa sarvastambhini prishtham nabhim vai sarvajrimbhini | vashankari vastidesham sarvaranjini
    me katim || 26|| sa tu sarvonmadini me payajjaghanamandalam | sarvarthasadhini shaktih nitambam rakshatanmama
    || 27|| dakshasphicam sada patu sarvasampattipurini | sarvamantramayi shaktih patu vamasphicam mama
    || 28|| payat kukundaradvandvam sarvadvandvakshayankari | sarvasiddhiprada devi patu dakshina vankshanam
    || 29|| sarvasampatprada devi patu me vamavankshanam | sarvapriyankari devi guhyam rakshatu me sada
    || 30|| medhram rakshatu me devi sarvamangalakarini | sarvakamaprada devi patu mushkam tu dakshinam
    || 31|| payat tadanyamushkam tu sarvaduhkhavimocini | sarvamrityuprashamani devi patu gudam mama ||
    32|| patu devi guhyamadhyam sarvavighnanivarini | sarvangasundari devi rakshatad dakshasakthikam ||
    33|| vamasakthitalam payat sarvasaubhagyadayini | ashthivam mama sarvajna devi rakshatu dakshinam
    || 34|| vamashthivam sarvashaktih devi patu yugam mama | sarvaishvaryaprada devi dakshajanum sada'vatu
    || 35|| sarvajnanamayi devi janumanyam mamavatat | avyad devi dakshajangam sarvavyadhivinashini ||
    36|| tadanyam patu devi sa sarvadharasvarupini | sarvapapahara devi gulpham rakshatu dakshinam ||
    37|| sarvanandamayi devi vamagulpham sada'vatu | parshni me dakshinam payat sarvarakshasvarupini ||
    38|| avyat sada sada parshni sarvepsitaphalaprada | dakshanghriparshvam vashini purvam vagdevata mama
    || 39|| sarvam kameshvari cordhvamadho vagdevata mama | modini prapadam patu vimala dakshinetare ||
    40|| anguliraruna patu dakshapadanakhojjvala | tadanya jayini patu sada sarveshvari mama || 41|| dakshavamapadatalam
    kaulini devata mama | kurvantu jrimbhana banah trailokyakarshanam mama || 42|| moham samharatadikshukodandam
    bhringamauvikam | karotu satatam pashi vashikaranamadbhutam || 43|| vidadhyadankusham nityam stambhanam
    shatrusankate | pitham me kamarupakhyam patu kamantikam manah || 44|| purnam purnagireh pitham kantim
    me janayet sada | jalandharamanyajalandharapitham me rakshatu || 45|| sayujye niyatam prajnam shripitham
    shrikaram mama | kameshvari tvatmatattvam rakshed vajreshvari tatha || 46|| vidyatattvam shaivatattvam
    payachribhagamalini | kamam vidyanmahashatrunamritarnavamanasam || 47|| krodham krodhapaha hanyanmanyum
    paitambujasanam | lobham cidasanam hanyad devyatmamritarupabhak || 48|| moham samharataccakram madam
    mantrasanam mama | matsaryam nashayennityam mama sandhyasanam tatha || 49|| adharam tripura rakshet
    svadhishthanam pureshvari | manipuram manidyota payat tripurasundari || 50|| avyadanahatam bhavya
    nityam tripuravasini | vishuddhim tripura shrishca ajnam tripuramalini || 51|| idam me tripurasiddha
    tripura capi pingalam | sushumnam patu me nitya payat tripurabhairavi || 52|| trailokyamohanam cakram
    romakupamshca rakshatu | sarvashapurakam cakram saptadhatu~shca rakshatu || 53|| sarvasankshobhana
    cakram pranadyam vayupancakam | saubhagyadayakam cakram nagadyanilapancakam || 54|| sarvarthasadhakam
    cakram karananam catushtayam | sarvarakshakaram cakram rakshatanme gunatrayam || 55|| sarvarogaharam
    cakram payat puryashtakam mama | sarvasiddhipradam cakamavyanme koshapancakam || 56|| sarvanandamayam
    cakram yashah kirtim ca rakshatu | saundaryam manmathah payad dhritishcapi ratim mama || 57|| pritim
    me patu ya pritih rupam patu vasantakah | sankalpam kalpakodyanam mahalakshmi shriyam mama || 58||
    kantim kapalini rakshet mandiram manimandapah | putran shankhayanidhih payad bharyam padmanidhistatha
    || 59|| marge kshemankari rakshet matangi mukutam tatha | yogini prakatadyasta navadvarani pantu me
    || 60|| bhojane mamannapurna matangi kridane'vatat | vane rakshatu mam durga jagrati dushtanigrahe
    || 61|| tridha'hankaranaishthuryadoshatrayam malatrayam | dakinyo yoginimukhyah samharantu mamanisham
    || 62|| icchashaktirgurorbhaktim patu me jnanamatmani | jnanashaktih kriyashaktirvairagyavishayeshvapi
    || 63|| hritpadmakarnikamadhye hrinkari parirakshatu | vaikhari shravanam patu madhyama mananam punah
    || 64|| yogam rakshatu pashyanti sakshat jnanapara mama | brahmani jagritam patu shayanam vaishnavi
    tatha || 65|| sushuptau candika patu turya me mohakarini | sada mam bhairavi patu jagadbharanapandita
    || 66|| caranambhoruhanandaparamritaraserita | plavini kundali purna antarantam sada'vatat || 67||
    ashtadikshu mahendradya sayudhah pantu sarvada | payadurdhva disham brahma vishnushcakrayudhopyadhah
    || 68|| anavrittani sthanani kavacena tu yani me | tani sarvani rakshantu shivadya guravah sada ||
    69|| phalashrutih | etat saubhagyakavacam shankaram yastu pathayet | trisandhyam yah pathed bhaktya
    sha
  devanagari: ध्याकर्षिणी तथा ॥ १५॥ अहङ्काराकर्षिणी तु प्रकाण्डं पातु दक्षिणम् । शब्दाकर्षिणिका वामं स्पर्शाकर्षिणिकाऽवतु
    ॥ १६॥ प्रकोष्ठं दक्षिणं पातु रूपाकर्षिणिकेतरम् । रसाकर्षिणिका पातु मणिबन्धं च दक्षिणम् ॥ १७॥ गन्धाकर्षिणिका
    वामं चित्ताकर्षिणिकाऽवतु । करभं दक्षिणं धैर्याकर्षिणी पातु वामकम् ॥ १८॥ स्मृत्याकर्षिण्यसौ वामं नामाकर्षिणिकेतरम्
    । बीजाकर्षिणिका पायात् सततं दक्षिणाङ्गुलीः ॥ १९॥ आत्माकर्षिणिका त्वन्या अमृताकर्षिणी नखान् । शरीराकर्षिणी
    वामनखान् रक्षतु सर्वदा ॥ २०॥ अनङ्गकुसुमा शक्तिः पातु दक्षिणस्तनोपरि । अनङ्गमेखला चान्यस्तनोर्ध्वमभिरक्षतु
    ॥ २१॥ अनङ्गमदना दक्षस्तनं तच्चूचुकं पुनः । रक्षतादनिशं देवी ह्यनङ्गःमदनातुरा ॥ २२॥ अनङ्गरेखा वामं
    तु वक्षोज तस्य चूचुकम् । अनङ्गवेगिनी क्रोडमनङ्गास्याङ्कुशाऽवतु ॥ २३॥ अनङ्गमालिनी पायाद् वक्षःस्थलमहर्निशम्
    । सर्वसङ्क्षोभिणी शक्तिर्हृत् सर्वद्राविणी परा ॥ २४॥ कुक्षिं सर्वाकर्षिणी तु पातु पार्श्वं च दक्षिणम्
    । आह्लादिनी वामपार्श्वं मध्यं सम्मोहिनी चिरम् ॥ २५॥ सा सर्वस्तम्भिनी पृष्ठं नाभिं वै सर्वजृम्भिणी
    । वशङ्करी वस्तिदेशं सर्वरञ्जिनी मे कटिम् ॥ २६॥ सा तु सर्वोन्मादिनी मे पायाज्जघनमण्डलम् । सर्वार्थसाधिनी
    शक्तिः नितम्बं रक्षतान्मम ॥ २७॥ दक्षस्फिचं सदा पातु सर्वसम्पत्तिपूरिणी । सर्वमन्त्रमयी शक्तिः पातु
    वामस्फिचं मम ॥ २८॥ पायात् कुकुन्दरद्वन्द्वं सर्वद्वन्द्वक्षयङ्करी । सर्वसिद्धिप्रदा देवी पातु दक्षिण
    वङ्क्षणम् ॥ २९॥ सर्वसम्पत्प्रदा देवी पातु मे वामवङ्क्षणम् । सर्वप्रियङ्करी देवी गुह्यं रक्षतु मे सदा
    ॥ ३०॥ मेढ्रं रक्षतु मे देवी सर्वमङ्गलकारिणी । सर्वकामप्रदा देवी पातु मुष्कं तु दक्षिणम् ॥ ३१॥ पायात्
    तदन्यमुष्कं तु सर्वदुःखविमोचिनी । सर्वमृत्युप्रशमनी देवी पातु गुदं मम ॥ ३२॥ पातु देवी गुह्यमध्यं सर्वविघ्ननिवारिणी
    । सर्वाङ्गसुन्दरी देवी रक्षताद् दक्षसक्थिकम् ॥ ३३॥ वामसक्थितलं पायात् सर्वसौभाग्यदायिनी । अष्ठीवं
    मम सर्वज्ञा देवी रक्षतु दक्षिणम् ॥ ३४॥ वामाष्ठीवं सर्वशक्तिः देवी पातु युगं मम । सर्वैश्वर्यप्रदा
    देवी दक्षजानुं सदाऽवतु ॥ ३५॥ सर्वज्ञानमयी देवी जानुमन्यं ममावतात् । अव्याद् देवी दक्षजङ्गां सर्वव्याधिविनाशिनी
    ॥ ३६॥ तदन्यां पातु देवी सा सर्वाधारस्वरूपिणी । सर्वपापहरा देवी गुल्फं रक्षतु दक्षिणम् ॥ ३७॥ सर्वानन्दमयी
    देवी वामगुल्फं सदाऽवतु । पार्ष्णि मे दक्षिणं पायात् सर्वरक्षास्वरूपिणी ॥ ३८॥ अव्यात् सदा सदा पार्ष्णि
    सर्वेप्सितफलप्रदा । दक्षाङ्घ्रिपार्श्वं वशिनी पूर्वं वाग्देवता मम ॥ ३९॥ सर्वं कामेश्वरी चोर्ध्वमधो
    वाग्देवता मम । मोदिनी प्रपदं पातु विमला दक्षिणेतरे ॥ ४०॥ अङ्गुलीररुणा पातु दक्षपादनखोज्ज्वला । तदन्या
    जयिनी पातु सदा सर्वेश्वरी मम ॥ ४१॥ दक्षवामपादतलं कौलिनी देवता मम । कुर्वन्तु जृम्भणा बाणाः त्रैलोक्याकर्षणं
    मम ॥ ४२॥ मोहं संहरतादिक्षुकोदण्डं भृङ्गमौविकम् । करोतु सततं पाशी वशीकरणमद्भुतम् ॥ ४३॥ विदध्यादङ्कुशं
    नित्यं स्तम्भनं शत्रुसङ्कटे । पीठं मे कामरूपाख्यं पातु कामान्तिकं मनः ॥ ४४॥ पूर्णं पूर्णगिरेः पीठं
    कान्तिं मे जनयेत् सदा । जालन्धरमन्यजालन्धरपीठं मे रक्षतु ॥ ४५॥ सायुज्ये नियतां प्रज्ञां श्रीपीठं श्रीकरं
    मम । कामेश्वरी त्वात्मतत्त्वं रक्षेद् वज्रेश्वरी तथा ॥ ४६॥ विद्यातत्त्वं शैवतत्त्वं पायाछ्रीभगमालिनी
    । कामं विद्यान्महाशत्रूनमृतार्णवमानसम् ॥ ४७॥ क्रोधं क्रोधापहा हन्यान्मन्युं पैताम्बुजासनम् । लोभं
    चिदासनं हन्याद् देव्यात्मामृतरूपभाक् ॥ ४८॥ मोहं संहरताच्चक्रं मदं मन्त्रासनं मम । मात्सर्यं नाशयेन्नित्यं
    मम सान्ध्यासनं तथा ॥ ४९॥ आधारं त्रिपुरा रक्षेत् स्वाधिष्ठानं पुरेश्वरी । मणिपूरं मणिद्योता पायात्
    त्रिपुरसुन्दरी ॥ ५०॥ अव्यादनाहतं भव्या नित्यं त्रिपुरवासिनी । विशुद्धिं त्रिपुरा श्रीश्च आज्ञां त्रिपुरमालिनी
    ॥ ५१॥ इडां मे त्रिपुरसिद्धा त्रिपुरा चापि पिङ्गलाम् । सुषुम्नां पातु मे नित्या पायात् त्रिपुरभैरवी
    ॥ ५२॥ त्रैलोक्यमोहनं चक्रं रोमकूपांश्च रक्षतु । सर्वाशापूरकं चक्रं सप्तधातूँश्च रक्षतु ॥ ५३॥ सर्वसङ्क्षोभण
    चक्रं प्राणाद्यं वायुपञ्चकम् । सौभाग्यदायकं चक्रं नागाद्यनिलपञ्चकम् ॥ ५४॥ सर्वार्थसाधकं चक्रं कारणानां
    चतुष्टयम् । सर्वरक्षाकरं चक्रं रक्षतान्मे गुणत्रयम् ॥ ५५॥ सर्वरोगहरं चक्रं पायात् पुर्यष्टकं मम ।
    सर्वसिद्धिप्रदं चकमव्यान्मे कोशपञ्चकम् ॥ ५६॥ सर्वानन्दमयं चक्रं यशः कीर्तिं च रक्षतु । सौन्दर्यं मन्मथः
    पायाद् धृतिश्चापि रतिं मम ॥ ५७॥ प्रीतिं मे पातु या प्रीतिः रूपं पातु वसन्तकः । सङ्कल्पं कल्पकोद्यानं
    महालक्ष्मी श्रियं मम ॥ ५८॥ कान्तिं कपालिनी रक्षेत् मन्दिरं मणिमण्डपः । पुत्रान् शङ्खयनिधिः पायाद्
    भार्यां पद्मनिधिस्तथा ॥ ५९॥ मार्गे क्षेमङ्करी रक्षेत् मातङ्गी मुकुटं तथा । योगिनी प्रकटाद्यास्ता नवद्वाराणि
    पान्तु मे ॥ ६०॥ भोजने मामन्नपूर्णा मातङ्गी क्रीडनेऽवतात् । वने रक्षतु मां दुर्गा जाग्रती दुष्टनिग्रहे
    ॥ ६१॥ त्रिधाऽहङ्कारनैष्ठुर्यदोषत्रयं मलत्रयम् । डाकिन्यो योगिनीमुख्याः संहरन्तु ममानिशम् ॥ ६२॥ इच्छाशक्तिर्गुरोर्भक्तिं
    पातु मे ज्ञानमात्मनि । ज्ञानशक्तिः क्रियाशक्तिर्वैराग्यविषयेष्वपि ॥ ६३॥ हृत्पद्मकर्णिकामध्ये ह्रीङ्कारी
    परिरक्षतु । वैखरी श्रवणं पातु मध्यमा मननं पुनः ॥ ६४॥ योगं रक्षतु पश्यन्ती साक्षात् ज्ञानपरा मम । ब्रह्माणी
    जागृतं पातु शयानं वैष्णवी तथा ॥ ६५॥ सुषुप्तौ चण्डिका पातु तुर्या मे मोहकारिणी । सदा मां भैरवी पातु
    जगद्भरणपण्डिता ॥ ६६॥ चरणाम्भोरुहानन्दपरामृतरसेरिता । प्लाविनी कुण्डली पूर्णा अन्तरान्तं सदाऽवतात्
    ॥ ६७॥ अष्टदिक्षु महेन्द्राद्या सायुधाः पान्तु सर्वदा । पायादूर्ध्वा दिशं ब्रह्मा विष्णुश्चक्रायुधोप्यधः
    ॥ ६८॥ अनावृत्तानि स्थानानि कवचेन तु यानि मे । तानि सर्वाणि रक्षन्तु शिवाद्या गुरवः सदा ॥ ६९॥ फलश्रुतिः
    । एतत् सौभाग्यकवचं शाङ्करं यस्तु पाठयेत् । त्रिसन्ध्यं यः पठेद् भक्त्या श
