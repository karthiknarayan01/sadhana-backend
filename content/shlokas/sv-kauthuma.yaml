id: sv-kauthuma
category: veda
name:
  english: sv-kauthuma
  devanagari: स्व्-कौथुम
content:
  english: eva hi pushan | eva hi devah om evahi devah || 650 || iti panca purishapadani || || iti mahanamnyarcikah
    || uttara arcikah prathama prapathakah | prathamo'rdhah asitah kashyapo devalo va| gayatri| pavamanah
    somah| 4 1 1 01 01
  devanagari: एवा हि पूषन् । एवा हि देवाः ॐ एवाहि देवाः ॥ ६५० ॥ इति पञ्च पुरीषपदानि ॥ ॥ इति महानाम्न्यार्चिकः
    ॥ उत्तर आर्चिकः प्रथम प्रपाठकः । प्रथमोऽर्धः असितः काश्यपो देवलो वा। गायत्री। पवमानः सोमः। ४ १ १ ०१
    ०१
meaning: {}
