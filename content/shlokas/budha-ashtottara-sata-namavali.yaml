id: budha-ashtottara-sata-namavali
category: stotram
name:
  english: Budha Ashtottara Sata Namavali
  devanagari: बुधाष्टोत्तरशतनामावली
content:
  english: 'budha bija mantra - om bra~ brim braum sah budhaya namah | om budhaya namah | om budharcitaya
    namah | om saumyaya namah | om saumyacittaya namah | om shubhapradaya namah | om dridhavrataya namah
    | om dridhaphalaya namah | om shrutijalaprabodhakaya namah | om satyavasaya namah | om satyavacase
    namah | 10 om shreyasam pataye namah | om avyayaya namah | om somajaya namah | om sukhadaya namah
    | om shrimate namah | om somavamshapradipakaya namah | om vedavide namah | om vedatattvashaya namah
    | om vedantajnanabhaskaraya namah | om vidyavicakshanaya namah | 20 om vidushe namah | om vidvatpritikaraya
    namah | om rijave namah | om vishvanukulasamcaraya namah | om visheshavinayanvitaya namah | om vividhagamasarajnaya
    namah | om viryavate namah | om vigatajvaraya namah | om trivargaphaladaya namah | om anantaya namah
    | 30 om tridashadhipapujitaya namah | om buddhimate namah | om bahushastrajnaya namah | om baline
    namah | om bandhavimocakaya namah | om vakrativakragamanaya namah | om vasavaya namah | om vasudhadhipaya
    namah | om prasannavadanaya namah | om vandyaya namah | 40 om varenyaya namah | om vagvilakshanaya
    namah | om satyavate namah | om satyasamkalpaya namah | om satyabandhave namah | om sadadaraya namah
    | om sarvarogaprashamanaya namah | om sarvamrityunivarakaya namah | om vanijyanipunaya namah | om
    vashyaya namah | 50 om vatangaya namah | om vatarogahrite namah | om sthulaya namah | om sthairyagunadhyakshaya
    namah | om sthulasukshmadikaranaya namah | om aprakashaya namah | om prakashatmane namah | om ghanaya
    namah | om gaganabhushanaya namah | om vidhistutyaya namah | 60 om vishalakshaya namah | om vidvajjanamanoharaya
    namah | om carushilaya namah | om svaprakashaya namah | om capalaya namah | om jitendriyaya namah
    | om udanmukhaya namah | om makhasaktaya namah | om magadhadhipataye namah | om haraye namah | 70
    om saumyavatsarasamjataya namah | om somapriyakaraya namah | om mahate namah | om simhadhirudhaya
    namah | om sarvajnaya namah | om shikhivarnaya namah | om shivamkaraya namah | om pitambaraya namah
    | om pitavapushe namah | om pitacchatradhvajankitaya namah | 80 om khadgacarmadharaya namah | om karyakartre
    namah | om kalushaharakaya namah | om atreyagotrajaya namah | om atyantavinayaya namah | om vishvapavanaya
    namah | om campeyapushpasamkashaya namah | om caranaya namah | om carubhushanaya namah | om vitaragaya
    namah | 90 om vitabhayaya namah | om vishuddhakanakaprabhaya namah | om bandhupriyaya namah | om bandhuyuktaya
    namah | om vanamandalasamshritaya namah | om arkeshananivasasthaya namah | om tarkashastravisharadaya
    namah | om prashantaya namah | om pritisamyuktaya namah | om priyakrite namah | 100 om priyabhushanaya
    namah | om medhavine namah | om madhavasaktaya namah | om mithunadhipataye namah | om sudhiye namah
    | om kanyarashipriyaya namah | om kamapradaya namah | om ghanaphalashrayaya namah | || iti budha ashtottarashatanamavalih
    sampurnam || Propitiation of mercury (Wednesday) chhaṟitẏ: donate small grin lentils, a grin pumpkin,
    a goat, or grin clothes to a pur student on Wednesday at nun| Fashtinġ: On Wednesday, especially during
    mercury transits and major or minor mercury periods| mantṟa: to be canted on Wednesday, tvo hours
    after sunrise, especially during major or minor mercury periods: ṟEshuḻt: the planetary diety Budha
    is propitiated increasing health and intelligence| transliteration and information by dr| sh| khalyanaraman
    kalyan97@yahuॅom'
  devanagari: 'बुध बीज मन्त्र - ॐ ब्राँ ब्रीं ब्रौं सः बुधाय नमः । ॐ बुधाय नमः । ॐ बुधार्चिताय नमः । ॐ
    सौम्याय नमः । ॐ सौम्यचित्ताय नमः । ॐ शुभप्रदाय नमः । ॐ दृढव्रताय नमः । ॐ दृढफलाय नमः । ॐ श्रुतिजालप्रबोधकाय
    नमः । ॐ सत्यवासाय नमः । ॐ सत्यवचसे नमः । १० ॐ श्रेयसां पतये नमः । ॐ अव्ययाय नमः । ॐ सोमजाय नमः । ॐ
    सुखदाय नमः । ॐ श्रीमते नमः । ॐ सोमवंशप्रदीपकाय नमः । ॐ वेदविदे नमः । ॐ वेदतत्त्वाशाय नमः । ॐ वेदान्तज्ञानभास्कराय
    नमः । ॐ विद्याविचक्षणाय नमः । २० ॐ विदुषे नमः । ॐ विद्वत्प्रीतिकराय नमः । ॐ ऋजवे नमः । ॐ विश्वानुकूलसंचाराय
    नमः । ॐ विशेषविनयान्विताय नमः । ॐ विविधागमसारज्ञाय नमः । ॐ वीर्यवते नमः । ॐ विगतज्वराय नमः । ॐ त्रिवर्गफलदाय
    नमः । ॐ अनन्ताय नमः । ३० ॐ त्रिदशाधिपपूजिताय नमः । ॐ बुद्धिमते नमः । ॐ बहुशास्त्रज्ञाय नमः । ॐ बलिने
    नमः । ॐ बन्धविमोचकाय नमः । ॐ वक्रातिवक्रगमनाय नमः । ॐ वासवाय नमः । ॐ वसुधाधिपाय नमः । ॐ प्रसन्नवदनाय
    नमः । ॐ वन्द्याय नमः । ४० ॐ वरेण्याय नमः । ॐ वाग्विलक्षणाय नमः । ॐ सत्यवते नमः । ॐ सत्यसंकल्पाय नमः
    । ॐ सत्यबन्धवे नमः । ॐ सदादराय नमः । ॐ सर्वरोगप्रशमनाय नमः । ॐ सर्वमृत्युनिवारकाय नमः । ॐ वाणिज्यनिपुणाय
    नमः । ॐ वश्याय नमः । ५० ॐ वाताङ्गाय नमः । ॐ वातरोगहृते नमः । ॐ स्थूलाय नमः । ॐ स्थैर्यगुणाध्यक्षाय
    नमः । ॐ स्थूलसूक्ष्मादिकारणाय नमः । ॐ अप्रकाशाय नमः । ॐ प्रकाशात्मने नमः । ॐ घनाय नमः । ॐ गगनभूषणाय
    नमः । ॐ विधिस्तुत्याय नमः । ६० ॐ विशालाक्षाय नमः । ॐ विद्वज्जनमनोहराय नमः । ॐ चारुशीलाय नमः । ॐ स्वप्रकाशाय
    नमः । ॐ चपलाय नमः । ॐ जितेन्द्रियाय नमः । ॐ उदङ्मुखाय नमः । ॐ मखासक्ताय नमः । ॐ मगधाधिपतये नमः । ॐ
    हरये नमः । ७० ॐ सौम्यवत्सरसंजाताय नमः । ॐ सोमप्रियकराय नमः । ॐ महते नमः । ॐ सिंहाधिरूढाय नमः । ॐ सर्वज्ञाय
    नमः । ॐ शिखिवर्णाय नमः । ॐ शिवंकराय नमः । ॐ पीताम्बराय नमः । ॐ पीतवपुषे नमः । ॐ पीतच्छत्रध्वजाङ्किताय
    नमः । ८० ॐ खड्गचर्मधराय नमः । ॐ कार्यकर्त्रे नमः । ॐ कलुषहारकाय नमः । ॐ आत्रेयगोत्रजाय नमः । ॐ अत्यन्तविनयाय
    नमः । ॐ विश्वपवनाय नमः । ॐ चाम्पेयपुष्पसंकाशाय नमः । ॐ चारणाय नमः । ॐ चारुभूषणाय नमः । ॐ वीतरागाय
    नमः । ९० ॐ वीतभयाय नमः । ॐ विशुद्धकनकप्रभाय नमः । ॐ बन्धुप्रियाय नमः । ॐ बन्धुयुक्ताय नमः । ॐ वनमण्डलसंश्रिताय
    नमः । ॐ अर्केशाननिवासस्थाय नमः । ॐ तर्कशास्त्रविशारदाय नमः । ॐ प्रशान्ताय नमः । ॐ प्रीतिसंयुक्ताय
    नमः । ॐ प्रियकृते नमः । १०० ॐ प्रियभूषणाय नमः । ॐ मेधाविने नमः । ॐ माधवसक्ताय नमः । ॐ मिथुनाधिपतये
    नमः । ॐ सुधिये नमः । ॐ कन्याराशिप्रियाय नमः । ॐ कामप्रदाय नमः । ॐ घनफलाश्रयाय नमः । ॥ इति बुध अष्टोत्तरशतनामावलिः
    सम्पूर्णम् ॥ Pरोपितिअतिओन् ओफ़् ंएर्चुर्य् (Wएद्नेस्दय्) छ्ःआऱीट्य़्: डोनते स्मल्ल् ग्रीन् लेन्तिल्स्,
    अ ग्रीन् पुम्प्किन्, अ गोअत्, ओर् ग्रीन् च्लोथेस् तो अ पूर् स्तुदेन्त् ओन् Wएद्नेस्दय् अत् नून्। Fआष्टीण्ग़्:
    Oन् Wएद्नेस्दय्, एस्पेचिअल्ल्य् दुरिन्ग् ंएर्चुर्य् त्रन्सित्स् अन्द् मजोर् ओर् मिनोर् ंएर्चुर्य्
    पेरिओद्स्। ंआण्ट्ऱा: टो बे चन्तेद् ओन् Wएद्नेस्दय्, त्वो होउर्स् अफ़्तेर् सुन्रिसे, एस्पेचिअल्ल्य्
    दुरिन्ग् मजोर् ओर् मिनोर् ंएर्चुर्य् पेरिओद्स्: ऱ्Eषूळ्ट्: ठे प्लनेतर्य् दिएत्य् Bउध इस् प्रोपितिअतेद्
    इन्च्रेअसिन्ग् हेअल्थ् अन्द् इन्तेल्लिगेन्चे। ट्रन्स्लितेरतिओन् अन्द् इन्फ़ोर्मतिओन् ब्य् ड्र्। ष्।
    ख़ल्यनरमन् कल्यन्९७@यहूॅओम्'
