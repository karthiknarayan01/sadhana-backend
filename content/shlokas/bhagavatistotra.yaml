id: bhagavatistotra
category: stotram
name:
  english: bhagavatistotra
  devanagari: भगवतीस्तोत्र
content:
  english: vinashakare jaya putrakala travivriddhikare || 4|| jaya devi samastashariradhare jaya nakavidarshini
    duhkhahare | jaya vyadhivinashini mokshakare jaya vamchitadayini siddhikare || 5|| etadvyasakritam
    stotram yah pathenniyatah shucih | grihe va shuddhabhavena prita bhagavati sada || 6|| || iti vyasakritam
    bhagavatistotram sampurnam ||
  devanagari: विनाशकरे जय पुत्रकल त्रविवृद्धिकरे ॥ ४॥ जय देवि समस्तशरीरधरे जय नाकविदर्शिनि दुःखहरे । जय
    व्याधिविनाशिनि मोक्षकरे जय वांछितदायिनि सिद्धिकरे ॥ ५॥ एतद्व्यासकृतं स्तोत्रं यः पठेन्नियतः शुचिः
    । गृहे वा शुद्धभावेन प्रीता भगवती सदा ॥ ६॥ ॥ इति व्यासकृतं भगवतीस्तोत्रं सम्पूर्णम् ॥
meaning: {}
