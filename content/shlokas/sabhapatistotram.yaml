id: sabhapatistotram
category: stotram
name:
  english: sabhapatistotram
  devanagari: सभापतिस्तोत्रम्
content:
  english: shrisabhapatistotram om shriganeshaya namah | yatkarunyakatakshavikshanamaho janmadiduhkhapaham
    yatpadambujasevanam tanubhritam svatmavabodhankuram yannamasmaranam kritantaparihrit samsarinam tarakam
    tam vande girijasahayamamalam shricitsabhanayakam || 1|| lokanahuya sarvan damarukaninadairghorasamsaramagnan
    dattvabhitim dayaluh pranatabhayaharam kuncitam padapadmam | uddhrityedam vimukterayanamiti karad
    darshayan pratyayartham bibhrad vahnim samayam kalayati natanam yah sa payacchivo nah || 2|| na param
    puramasti paundarikacchivagangasadrishi na kapi sindhuh | api hemasabhanibha na goshthi natarajadadhiko
    na ko'pi devah || 3|| ghibhuteranumatrena trikalamanulepanam | roma roma bhavellingam tacchariram
    shivalayam || 4|| ardrayamarunodayasya samaye cape ca lagne yute parvam yuktamayuktameva natanam srishtyadimashtottaram
  devanagari: श्रीसभापतिस्तोत्रम् ॐ श्रीगणेशाय नमः । यत्कारुण्यकटाक्षवीक्षणमहो जन्मादिदुःखापहं यत्पादाम्बुजसेवनं
    तनुभृतां स्वात्मावबोधाङ्कुरं यन्नामस्मरणं कृतान्तपरिहृत् संसारिणां तारकं तं वन्दे गिरिजासहायममलं श्रीचित्सभानायकम्
    ॥ १॥ लोकानाहूय सर्वान् डमरुकनिनदैर्घोरसंसारमग्नान् दत्त्वाभीतिं दयालुः प्रणतभयहरं कुञ्चितं पादपद्मम्
    । उद्धृत्येदं विमुक्तेरयनमिति कराद् दर्शयन् प्रत्ययार्थं बिभ्रद् वह्निं समायां कलयति नटनं यः स पायाच्छिवो
    नः ॥ २॥ न परं पुरमस्ति पौण्डरीकाच्छिवगङ्गासदृशी न कापि सिन्धुः । अपि हेमसभानिभा न गोष्ठी नटराजादधिको
    न कोऽपि देवः ॥ ३॥ घिभूतेरणुमात्रेण त्रिकालमनुलेपनम् । रोम रोम भवेल्लिङ्गं तच्छरीरं शिवालयम् ॥ ४॥ आर्द्रायामरुणोदयस्य
    समये चापे च लग्ने युते पर्वं युक्तमयुक्तमेव नटनं सृष्ट्यादिमष्टोत्तरं
