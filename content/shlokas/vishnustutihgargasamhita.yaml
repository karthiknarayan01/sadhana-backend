id: vishnustutihgargasamhita
category: stotram
name:
  english: vishnustutihgargasamhita
  devanagari: विष्णुस्तुतिःगर्गसम्हिता
content:
  english: vasudeva namaste'stu govinda purushottama | dinavatsala dinesha dvarakesha pareshvara || 1||
    dhruve dhruvapadam datre prahladasyartiharine | gajasyoddharine tubhyam balerbalivide namah || 2||
    draupadicirasantanakarine haraye namah | garagnivanavasebhyah pandavanam sahayine || 3|| yadavatranakartre
    ca shakradabhirarakshine | gurumatridvijanam ca putradatre namo namah || 4|| jarasandhanirodhartanripanam
    mokshakarine | nrigasyoddharine sakshatsudamno dainyaharine || 5|| vasudevaya krishnaya namah sankarshanaya
    ca | pradyumnayaniruddhaya caturvyuhaya te namah || 6|| tvameva mata ca pita tvameva tvameva bandhushca
    sakha tvameva | tvameva vidya dravinam tvameva tvameva sarvam mama devadeva || 7|| iti gargasamhitayam
    dvarakakhande dvadashadhyayantargata tritamunishishyena kakshivata krita vishnustutih samapta ||
  devanagari: वासुदेव नमस्तेऽस्तु गोविन्द पुरुषोत्तम । दीनवत्सल दीनेश द्वारकेश परेश्वर ॥ १॥ ध्रुवे ध्रुवपदं
    दात्रे प्रह्लादस्यार्तिहारिणे । गजस्योद्धारिणे तुभ्यं बलेर्बलिविदे नमः ॥ २॥ द्रौपदीचीरसन्तानकारिणे
    हरये नमः । गराग्निवनवासेभ्यः पाण्डवानां सहायिने ॥ ३॥ यादवत्राणकर्त्रे च शक्रादाभीररक्षिणे । गुरुमातृद्विजानां
    च पुत्रदात्रे नमो नमः ॥ ४॥ जरासन्धनिरोधार्तनृपाणां मोक्षकारिणे । नृगस्योद्धारिणे साक्षात्सुदाम्नो
    दैन्यहारिणे ॥ ५॥ वासुदेवाय कृष्णाय नमः सङ्कर्षणाय च । प्रद्युम्नायानिरुद्धाय चतुर्व्यूहाय ते नमः ॥
    ६॥ त्वमेव माता च पिता त्वमेव त्वमेव बन्धुश्च सखा त्वमेव । त्वमेव विद्या द्रविणं त्वमेव त्वमेव सर्वं
    मम देवदेव ॥ ७॥ इति गर्गसंहितायां द्वारकाखण्डे द्वादशाध्यायान्तर्गता त्रितमुनिशिष्येन कक्षीवता कृता
    विष्णुस्तुतिः समाप्ता ॥
meaning: {}
