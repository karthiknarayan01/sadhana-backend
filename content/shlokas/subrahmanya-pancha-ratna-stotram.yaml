id: subrahmanya-pancha-ratna-stotram
category: stotram
name:
  english: Subrahmanya Pancha Ratna Stotram
content:
  english: shadananam candanalepitangam mahorasam divyamayuravahanam | rudrasyasunum suralokanatham brahmanyadevam
    sharanam prapadye || || jajvalyamanam suravrindavandyam kumara dharatata mandirastham | kandarparupam
    kamaniyagatram brahmanyadevam sharanam prapadye || || dvishadbhujam dvadashadivyanetram trayitanum
    shulamasi dadhanam | sheshavataram kamaniyarupam brahmanyadevam sharanam prapadye || || surarighorahavashobhamanam
    surottamam shaktidharam kumaram | sudhara shaktyayudha shobhihastam brahmanyadevam sharanam prapadye
    || || ishtarthasiddhipradamishaputram ishtannadam bhusurakamadhenum | gangodbhavam sarvajananukulam
    brahmanyadevam sharanam prapadye || || yah shlokapancamidam pathatiha bhaktya brahmanyadeva viniveshita
    manasah san | prapnoti bhogamakhilam bhuvi yadyadishtam ante sa gacchati muda guhasamyameva ||
  devanagari: षडाननं चन्दनलेपिताङ्गं महोरसं दिव्यमयूरवाहनम् । रुद्रस्यसूनुं सुरलोकनाथं ब्रह्मण्यदेवं शरणं
    प्रपद्ये ॥ ॥ जाज्वल्यमानं सुरवृन्दवन्द्यं कुमार धारातट मन्दिरस्थम् । कन्दर्परूपं कमनीयगात्रं ब्रह्मण्यदेवं
    शरणं प्रपद्ये ॥ ॥ द्विषड्भुजं द्वादशदिव्यनेत्रं त्रयीतनुं शूलमसी दधानम् । शेषावतारं कमनीयरूपं ब्रह्मण्यदेवं
    शरणं प्रपद्ये ॥ ॥ सुरारिघोराहवशोभमानं सुरोत्तमं शक्तिधरं कुमारम् । सुधार शक्त्यायुध शोभिहस्तं ब्रह्मण्यदेवं
    शरणं प्रपद्ये ॥ ॥ इष्टार्थसिद्धिप्रदमीशपुत्रं इष्टान्नदं भूसुरकामधेनुम् । गङ्गोद्भवं सर्वजनानुकूलं
    ब्रह्मण्यदेवं शरणं प्रपद्ये ॥ ॥ यः श्लोकपञ्चमिदं पठतीह भक्त्या ब्रह्मण्यदेव विनिवेशित मानसः सन् ।
    प्राप्नोति भोगमखिलं भुवि यद्यदिष्टम् अन्ते स गच्छति मुदा गुहसाम्यमेव ॥
