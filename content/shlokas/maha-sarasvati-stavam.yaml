id: maha-sarasvati-stavam
category: stotram
name:
  english: Maha Sarasvati Stavam
content:
  english: ashvatara uvaca | jagaddhatrimaham devimariradhayishuh shubham | stoshye pranamya shirasa brahmayonim
    sarasvatim || || sadasaddevi yatkincinmokshavaccarthavatpadam | tatsarvam tvayyasamyogam yogavaddevi
    samsthitam || || tvamaksharam param devi yatra sarvam pratishthitam | aksharam paramam devi samsthitam
    paramanuvat || || aksharam paramam brahma vishvancaitatksharatmakam | darunyavasthito vahnirbhaumashca
    paramanavah || || tatha tvayi sthitam brahma jagaccedamasheshatah | onkaraksharasamsthanam yattu devi
    sthirasthiram || || tatra matratrayam sarvamasti yaddevi nasti ca | trayo lokastrayo vedastraividyam
    pavakatrayam || || trini jyotimshi varnashca trayo dharmagamastatha | trayo gunastrayah shabdastrayo
    vedastathashramah || || trayah kalastathavasthah pitaro'harnishadayah | etanmatratrayam devi tava
    rupam sarasvati || || vibhinnadarshinamadya brahmano hi sanatanah | somasamstha havih samsthah pakasamsthashca
    sapta yah || || tastvaduccaranaddevi kriyante brahmavadibhih | anirdeshyam tatha canyadardhamatranvitam
    param || || avikaryakshayam divyam parinamavivarjitam | tavaitatparamam rupam yanna shakyam mayoditum
    || || na casyena ca tajjihva tamroshthadibhirucyate | indro'pi vasavo brahma candrarkau jyotireva
    ca || || vishvavasam vishvarupam vishvesham parameshvaram | sankhyavedantavadoktam bahushakhasthirikritam
    || || anadimadhyanidhanam sadasanna sadeva yat | ekantvanekam napyekam bhavabhedasamashritam || ||
    anakhyam shadgunakhyanca vargakhyam trigunashrayam | nanashaktimatamekam shaktivaibhavikam param ||
    || sukhasukham mahasaukhyarupam tvayi vibhavyate | evam devi tvaya vyaptam sakalam nishkalanca yat
    | advaitavasthitam brahma yacca dvaite vyavasthitam || || ye'rtha nitya ye vinashyanti canye ye va
    sthula ye ca sukshmatisukshmah | ye va bhumau ye'ntarikshe'nyato va tesham tesham tvatta evopalabdhih
    || || yaccamurtam yacca murtam samastam yadva bhuteshvekamekanca kincit | yaddivyasti kshmatale khe'nyato
    va tvatsambandham tvatsvarairvyanjanaishca || || iti shrimarkandeyapurane trayovimsho'dhyaye ashvatara
    prokta mahasarasvati stavam |
  devanagari: अश्वतर उवाच । जगद्धात्रीमहं देवीमारिराधयिषुः शुभाम् । स्तोष्ये प्रणम्य शिरसा ब्रह्मयोनिं
    सरस्वतीम् ॥ ॥ सदसद्देवि यत्किञ्चिन्मोक्षवच्चार्थवत्पदम् । तत्सर्वं त्वय्यसंयोगं योगवद्देवि संस्थितम्
    ॥ ॥ त्वमक्षरं परं देवि यत्र सर्वं प्रतिष्ठितम् । अक्षरं परमं देवि संस्थितं परमाणुवत् ॥ ॥ अक्षरं परमं
    ब्रह्म विश्वञ्चैतत्क्षरात्मकम् । दारुण्यवस्थितो वह्निर्भौमाश्च परमाणवः ॥ ॥ तथा त्वयि स्थितं ब्रह्म
    जगच्चेदमशेषतः । ओङ्काराक्षरसंस्थानं यत्तु देवि स्थिरास्थिरम् ॥ ॥ तत्र मात्रात्रयं सर्वमस्ति यद्देवि
    नास्ति च । त्रयो लोकास्त्रयो वेदास्त्रैविद्यं पावकत्रयम् ॥ ॥ त्रीणि ज्योतींषि वर्णाश्च त्रयो धर्मागमास्तथा
    । त्रयो गुणास्त्रयः शब्दस्त्रयो वेदास्तथाश्रमाः ॥ ॥ त्रयः कालास्तथावस्थाः पितरोऽहर्निशादयः । एतन्मात्रात्रयं
    देवि तव रूपं सरस्वति ॥ ॥ विभिन्नदर्शिनामाद्या ब्रह्मणो हि सनातनाः । सोमसंस्था हविः संस्थाः पाकसंस्थाश्च
    सप्त याः ॥ ॥ तास्त्वदुच्चारणाद्देवि क्रियन्ते ब्रह्मवादिभिः । अनिर्देश्यं तथा चान्यदर्धमात्रान्वितं
    परम् ॥ ॥ अविकार्यक्षयं दिव्यं परिणामविवर्जितम् । तवैतत्परमं रूपं यन्न शक्यं मयोदितुम् ॥ ॥ न चास्येन
    च तज्जिह्वा ताम्रोष्ठादिभिरुच्यते । इन्द्रोऽपि वसवो ब्रह्मा चन्द्रार्कौ ज्योतिरेव च ॥ ॥ विश्वावासं
    विश्वरूपं विश्वेशं परमेश्वरम् । साङ्ख्यवेदान्तवादोक्तं बहुशाखास्थिरीकृतम् ॥ ॥ अनादिमध्यनिधनं सदसन्न
    सदेव यत् । एकन्त्वनेकं नाप्येकं भवभेदसमाश्रितम् ॥ ॥ अनाख्यं षड्गुणाख्यञ्च वर्गाख्यं त्रिगुणाश्रयम्
    । नानाशक्तिमतामेकं शक्तिवैभविकं परम् ॥ ॥ सुखासुखं महासौख्यरूपं त्वयि विभाव्यते । एवं देवि त्वया व्याप्तं
    सकलं निष्कलञ्च यत् । अद्वैतावस्थितं ब्रह्म यच्च द्वैते व्यवस्थितम् ॥ ॥ येऽर्था नित्या ये विनश्यन्ति
    चान्ये ये वा स्थूला ये च सूक्ष्मातिसूक्ष्माः । ये वा भूमौ येऽन्तरीक्षेऽन्यतो वा तेषां तेषां त्वत्त
    एवोपलब्धिः ॥ ॥ यच्चामूर्तं यच्च मूर्तं समस्तं यद्वा भूतेष्वेकमेकञ्च किञ्चित् । यद्दिव्यस्ति क्ष्मातले
    खेऽन्यतो वा त्वत्सम्बन्धं त्वत्स्वरैर्व्यञ्जनैश्च ॥ ॥ इति श्रीमार्कण्डेयपुराणे त्रयोविंशोऽध्याये अश्वतर
    प्रोक्त महासरस्वती स्तवम् ।
