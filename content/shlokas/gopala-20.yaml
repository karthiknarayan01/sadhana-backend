id: gopala-20
category: stotram
name:
  english: gopala 20
  devanagari: गोपाल २०
content:
  english: gopalavimshatistotram shriman vemkatanatharyah kavitarkikakesari | vedantacaryavaryo me sannidhattam
    sada hridi || vande vrindavanacaram valavvijanavallabham | jayantisambhavam dhama vaijayantivibhushanam
    || 1|| vacam nijankarasikam prasamikshamano vaktraravindaviniveshitapamcajanyah | varnah trikonarucire
    varapundarike baddhasano jayati vallavacakravarti || 2|| amnayagandharuditasphuritadharoshtham asravilekshanamanukshanamandahasam
    | gopaladimbhavapusham kuhana jananyah pranastanandhayamavaimi param pumamsam || 3|| avirbhavatvanibhritabharanam
    purastat akumcitaikacarana nibhrihitanyapadam | dadhnanibaddhamukharena nibaddhatalam nathasya nandabhavane
    navanitanatyam || 4|| kundaprasunavishadairdashanaishcartubhih samdashya maturanisham kucacucukagram
    | nandasya vaktramavalokayato murarer
  devanagari: गोपालविंशतिस्तोत्रम् श्रीमान् वेंकटनाथार्यः कवितार्किककेसरी । वेदान्ताचार्यवर्यो मे सन्निधत्तां
    सदा हृदि ॥ वन्दे वृन्दावनचरं वलव्वीजनवल्लभम् । जयन्तीसम्भवं धाम वैजयन्तीविभूषणम् ॥ १॥ वाचं निजाङ्करसिकां
    प्रसमीक्षमाणो वक्त्रारविन्दविनिवेशितपांचजन्यः । वर्णः त्रिकोणरूचिरे वरपुण्डरीके बद्धासनो जयति वल्लवचक्रवर्ती
    ॥ २॥ आम्नायगन्धरुदितस्फुरिताधरोष्ठम् आस्राविलेक्षणमनुक्षणमन्दहासम् । गोपालडिम्भवपुषं कुहना जनन्याः
    प्राणस्तनन्धयमवैमि परं पुमांसम् ॥ ३॥ आविर्भवत्वनिभृताभरणं पुरस्तात् आकुंचितैकचरण निभृहितान्यपादम्
    । दध्नानिबद्धमुखरेण निबद्धतालं नाथस्य नन्दभवने नवनीतनाट्यम् ॥ ४॥ कुन्दप्रसूनविशदैर्दशनैश्चर्तुभिः
    संदश्य मातुरनिशं कुचचूचुकाग्रम् । नन्दस्य वक्त्रमवलोकयतो मुरारेर्
