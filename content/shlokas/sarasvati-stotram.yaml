id: sarasvati-stotram
category: stotram
name:
  english: sarasvati stotram
  devanagari: सरस्वति स्तोत्रम्
content:
  english: ravirudrapitamahavishnunutam haricandanakunkumapankayutam| munivrindagajendrasamanayutam tava
    naumi sarasvati padayugam ||1|| shashishuddhasudhahimadhamayutam sharadambarabimbasamanakaram| bahuratnamanoharakantiyutam
    tava naumi sarasvati padayugam ||2|| kanakabjavibhushitabhutibhavam bhavabhavavibhashitabhinnapadam|
    prabhucittasamahitasadhupadam tava naumi sarasvati padayugam ||3|| bhavasagaramajjanabhitinutam pratipaditasantatikaramidam|
    vimaladikashuddhavishuddhapadam tava naumi sarasvati padayugam ||4|| matihinajanashrayapadamidam sakalagamabhashitabhinnapadam|
    paripuritavishvamanekabhavam tava naumi sarasvati padayugam ||5|| paripurnamanorathadhamanidhim paramarthavicaravivekanidhim|
    surayoshitasevitapadatalam tava naumi sarasvati padayugam || 6|| suramaulimanidyutishubhrakaram vishayadimahabhayavarnaharam|
    nijakantivilepitacandrashivam tava naumi sarasvati padayugam || 7|| gunanaikakulasthitibhitapadam
    gunagauravagarvitasatyapadam| kamalodarakomalapadatalam tava naumi sarasvati padayugam || 8|| trisandhyam
    yo japennityam jale vapi sthalesthitah pathamatradbhavetprajno brahmanishthah punah punah || 9 ||
    idam stavam mahapunyam brahmana ca prakirtitam | ya
  devanagari: रविरुद्रपितामहविष्णुनुतं हरिचन्दनकुङ्कुमपङ्कयुतम्। मुनिवृन्दगजेन्द्रसमानयुतं तव नौमि सरस्वति
    पादयुगम् ॥१॥ शशिशुद्धसुधाहिमधामयुतं शरदम्बरबिम्बसमानकरम्। बहुरत्नमनोहरकान्तियुतं तव नौमि सरस्वति पादयुगम्
    ॥२॥ कनकाब्जविभूषितभूतिभवं भवभावविभाषितभिन्नपदम्। प्रभुचित्तसमाहितसाधुपदं तव नौमि सरस्वति पादयुगम्
    ॥३॥ भवसागरमज्जनभीतिनुतं प्रतिपादितसन्ततिकारमिदम्। विमलादिकशुद्धविशुद्धपदं तव नौमि सरस्वति पादयुगम्
    ॥४॥ मतिहीनजनाश्रयपादमिदं सकलागमभाषितभिन्नपदम्। परिपूरितविश्वमनेकभवं तव नौमि सरस्वति पादयुगम् ॥५॥ परिपूर्णमनोरथधामनिधिं
    परमार्थविचारविवेकनिधिम्। सुरयोषितसेवितपादतलं तव नौमि सरस्वति पादयुगम् ॥ ६॥ सुरमौलिमणिद्युतिशुभ्रकरं
    विषयादिमहाभयवर्णहरम्। निजकान्तिविलेपितचन्द्रशिवं तव नौमि सरस्वति पादयुगम् ॥ ७॥ गुणनैककुलस्थितिभीतपदं
    गुणगौरवगर्वितसत्यपदम्। कमलोदरकोमलपादतलं तव नौमि सरस्वति पादयुगम् ॥ ८॥ त्रिसन्ध्यं यो जपेन्नित्यं जले
    वापि स्थलेस्थितः पाठमात्रद्भवेत्प्राज्ञो ब्रह्मनिष्ठः पुनः पुनः ॥ ९ ॥ इदं स्तवं महापुण्यं ब्रह्मणा
    च प्रकिर्तितम् । य
