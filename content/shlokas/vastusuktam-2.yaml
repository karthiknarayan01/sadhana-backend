id: vastusuktam-2
category: veda
name:
  english: vastusuktam
  devanagari: वास्तुसूक्तम्
content:
  english: 14| vasto̭shpate̱ prati̭ janihya̱smansva̭ve̱sho a̭nami̱vo bha̭va nah | yattvema̭he̱ prati̱
    tanno̭ jushasva̱ sham no̭ bhava dvi̱pade̱ sham catṷshpade || 7
  devanagari: १४। वास्तो॑ष्पते॒ प्रति॑ जानीह्य॒स्मान्स्वा॑वे॒शो अ॑नमी॒वो भ॑वा नः । यत्त्वेम॑हे॒ प्रति॒
    तन्नो॑ जुषस्व॒ शं नो॑ भव द्वि॒पदे॒ शं चतु॑ष्पदे ॥ ७
meaning: {}
