id: devadikritamshrikrishnastotram
category: stotram
name:
  english: devadikritamshrikrishnastotram
  devanagari: देवादिकृतंश्रीकृष्णस्तोत्रम्
content:
  english: '| jaya krishna jagannatha jaya sankarshananuja | jaya padmapalashaksha jaya vanchaphalaprada
    || 50|| jaya malavritoraska jaya cakragadadhara | jaya padmalayakanta jaya vishno namo''stu te ||
    51|| brahmovaca | evam stutva tada devah shakradya hrishtamanasah | siddhacaranasanghashca ye canye
    svargavasinah || 52|| munayo valakhilyashca krishnam ramena sangatam | subhadram ca munishreshthah
    pranipatyambare sthitah || 53|| iti brahmapurane pancashashtitamadhyayantargatam devadikritam krishnastotram
    samaptam | brahmapurana | adhyaya 59'
  devanagari: । जय कृष्ण जगन्नाथ जय सङ्कर्षणानुज । जय पद्मपलाशाक्ष जय वाञ्छाफलप्रद ॥ ५०॥ जय मालावृतोरस्क
    जय चक्रगदाधर । जय पद्मालयाकान्त जय विष्णो नमोऽस्तु ते ॥ ५१॥ ब्रह्मोवाच । एवं स्तुत्वा तदा देवाः शक्राद्या
    हृष्टमानसाः । सिद्धचारणसङ्घाश्च ये चान्ये स्वर्गवासिनः ॥ ५२॥ मुनयो वालखिल्याश्च कृष्णं रामेण सङ्गतम्
    । सुभद्रां च मुनिश्रेष्ठाः प्रणिपत्याम्बरे स्थिताः ॥ ५३॥ इति ब्रह्मपुराणे पञ्चषष्टितमाध्यायान्तर्गतं
    देवदिकृतं कृष्णस्तोत्रं समाप्तम् । ब्रह्मपुराण । अध्याय ५९
meaning: {}
