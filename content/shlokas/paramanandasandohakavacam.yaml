id: paramanandasandohakavacam
category: kavacha
name:
  english: paramanandasandohakavacam
  devanagari: परमानन्दसन्दोहकवचम्
content:
  english: shrikrishnadasyabhaktipraptyarthe pathe viniyogah || rishyadinyasah | om narayanarishaye namah
    shirasi | om anushtupchandase namah mukhe | om shriradhika tripurasundaridevatayai namah hridi | om
    shrikrishnadasyabhaktipraptyarthe namah nabhau | om viniyogaya namah sarvange || karanyasah | om hram
    angushthabhyam namah | om hrim tarjanibhyam namah | om hrum madhyamabhyam namah | om hraim anamikabhyam
    namah | om hraum kanishthikabhyam namah | om hrah karatalakaraprishthabhyam namah || shadanganyasah
    | om hram hridayaya namah | om hrim shirase svaha | om hrum shikhayai vashat | om hraim kavacaya hum
    | om hraum netratrayaya vaushat | om hrah astraya phat || atha kavacam | om sarvadya mem shirah patu
    kesham keshavakamini | bhalam bhagavati patu lola locanayugmakam || 1|| nasam narayani patu sananda
    cadharoshthakam | jihvam patu jaganmata dantam damodarapriya || 2|| kapolayugmam krishnesha kantham
    krishnapriya'vatu | karnayugmam sada patu kalindikulavasini || 3|| vasundharesha vaksho me parama
    sa payodharam | padmanabhapriya nabhim jatharam jahnavishvari || 4|| nitya nitambayugmam me kankalam
    krishnasevita | paratpara patu prishtham sushroni shronikayugam || 5|| paramadya padayugmam nakharamshca
    narottama | sarvangam me sada patu sarvesha sarvamangala || 6|| patu raseshvari radha svapne jagarane
    ca mam | jale sthale cantarikshe sevita jalashayini || 7|| pracyam me satatam patu paripurnatamapriya
    | vahnishvari vahnikone dakshine duhkhanashini || 8|| nairitye satatam patu narakarnavatarini | varune
    vanamalisha vayavyam vayupujita || 9|| kaubere mam sada patu kurmena parisevita | ishanyamishvari
    patu shatasha
  devanagari: श्रीकृष्णदास्यभक्तिप्राप्त्यर्थे पाठे विनियोगः ॥ ऋष्यादिन्यासः । ॐ नारायणऋषये नमः शिरसि
    । ॐ अनुष्टुप्छन्दसे नमः मुखे । ॐ श्रीराधिका त्रिपुरसुन्दरीदेवतायै नमः हृदि । ॐ श्रीकृष्णदास्यभक्तिप्राप्त्यर्थे
    नमः नाभौ । ॐ विनियोगाय नमः सर्वाङ्गे ॥ करन्यासः । ॐ ह्रां अङ्गुष्ठाभ्यां नमः । ॐ ह्रीं तर्जनीभ्यां
    नमः । ॐ ह्रूं मध्यमाभ्यां नमः । ॐ ह्रैं अनामिकाभ्यां नमः । ॐ ह्रौं कनिष्ठिकाभ्यां नमः । ॐ ह्रः करतलकरपृष्ठाभ्यां
    नमः ॥ षडङ्गन्यासः । ॐ ह्रां हृदयाय नमः । ॐ ह्रीं शिरसे स्वाहा । ॐ ह्रूं शिखायै वषट् । ॐ ह्रैं कवचाय
    हुम् । ॐ ह्रौं नेत्रत्रयाय वौषट् । ॐ ह्रः अस्त्राय फट् ॥ अथ कवचम् । ॐ सर्वाद्या में शिरः पातु केशं
    केशवकामिनी । भालं भगवती पातु लोला लोचनयुग्मकम् ॥ १॥ नासां नारायणी पातु सानन्दा चाधरोष्ठकम् । जिह्वां
    पातु जगन्माता दन्तं दामोदरप्रिया ॥ २॥ कपोलयुग्मं कृष्णेशा कण्ठं कृष्णप्रियाऽवतु । कर्णयुग्मं सदा पातु
    कालिन्दीकूलवासिनी ॥ ३॥ वसुन्धरेशा वक्षो मे परमा सा पयोधरम् । पद्मनाभप्रिया नाभिं जठरं जाह्नवीश्वरी
    ॥ ४॥ नित्या नितम्बयुग्मं मे कङ्कालं कृष्णसेविता । परात्परा पातु पृष्ठं सुश्रोणी श्रोणिकायुगम् ॥ ५॥
    परमाद्या पादयुग्मं नखरांश्च नरोत्तमा । सर्वाङ्गं मे सदा पातु सर्वेशा सर्वमङ्गला ॥ ६॥ पातु रासेश्वरी
    राधा स्वप्ने जागरणे च माम् । जले स्थले चान्तरिक्षे सेविता जलशायिनी ॥ ७॥ प्राच्यां मे सततं पातु परिपूर्णतमप्रिया
    । वह्नीश्वरी वह्निकोणे दक्षिणे दुःखनाशिनी ॥ ८॥ नैऋत्ये सततं पातु नरकार्णवतारिणी । वारुणे वनमालीशा
    वायव्यां वायुपूजिता ॥ ९॥ कौबेरे मां सदा पातु कूर्मेण परिसेविता । ईशान्यामीश्वरी पातु शतश
