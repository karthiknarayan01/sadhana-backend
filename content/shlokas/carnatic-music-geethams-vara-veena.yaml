id: carnatic-music-geethams-vara-veena
category: stotram
name:
  english: Carnatic Music Geethams - Vara Veena
content:
  english: harikambhoji janyaragam catushruti dhaivatam arohana catusra jati rupaka talam angah appayya
    dikshitar bhasha samskritam sahityam vara vina mridu pani vana ruha locana rani surucira bambara veni
    suranuta kalyani nirupama shubhaguna lola nirata jayaprada shila varadapriya ranganayaki vanchita
    phala dayaki sarasijasana janani jaya jaya jaya || ga ga | ga ga ri ga || pa ga | pa || ni ru | pa
    ma shu bha || gu na || lo | da da da pa || va ra | da da pa || da pa | ga ga ri sa || vam || sa ri
    | sa ga ri sa || ja ya | ja ya ja ya ||
  devanagari: हरिकाम्भोजि जन्यरागम् चतुश्रुति धैवतम् आरोहण चतुस्र जाति रूपक तालम् अङ्गाः अप्पय्य दीक्षितार्
    भाषा संस्कृतम् साहित्यम् वर वीणा मृदु पाणि वन रुह लोचन राणी सुरुचिर बम्बर वेणी सुरनुत कल्याणी निरुपम
    शुभगुण लोला निरत जयाप्रद शीला वरदाप्रिय रङ्गनायकि वाञ्छित फल दायकि सरसीजासन जननी जय जय जय ॥ ग ग ।
    ग ग रि ग ॥ प ग । प ॥ नि रु । प म शु भ ॥ गु ण ॥ लो । द द द प ॥ व र । दा द प ॥ द प । ग ग रि स ॥ वां
    ॥ स रि । स ग रि स ॥ ज य । ज य ज य ॥
meaning: {}
