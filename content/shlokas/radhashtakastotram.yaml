id: radhashtakastotram
category: stotram
name:
  english: radhashtakastotram
  devanagari: राधाष्टकस्तोत्रम्
content:
  english: bhavukaishca prapujitam || 3|| ananya rasikajanom ke dvara samaradhita evam parama bhavuka
    janom se samarcita tatha anantakoti lavanya vrindavanadhishvari sarveshvara shrikrishna bhagavan ke
    antarmanasa mem virajita parama lavanyamayi shrinityanavakishori ka apane antarmanasa mem nirantara
    smarana karate haim || 3|| paramanandarupam ca
  devanagari: भावुकैश्च प्रपूजिताम् ॥ ३॥ अनन्य रसिकजनों के द्वारा समाराधित एवं परम भावुक जनों से समर्चित
    तथा अनन्तकोटि लावण्य वृन्दावनाधीश्वरी सर्वेश्वर श्रीकृष्ण भगवान् के अन्तर्मानस में विराजित परम लावण्यमयी
    श्रीनित्यनवकिशोरी का अपने अन्तर्मानस में निरन्तर स्मरण करते हैं ॥ ३॥ परमानन्दरूपां च
meaning: {}
