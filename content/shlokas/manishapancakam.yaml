  devanagari: मनीषापञ्चकम्
content:
  english: jagratsvapnasushuptishu sphutatara ya samvidujjrimbhate ya brahmadipipilikantatanushu prota
    jagatsakshini
  devanagari: जाग्रत्स्वप्नसुषुप्तिषु स्फुटतरा या संविदुज्जृम्भते या ब्रह्मादिपिपीलिकान्ततनुषु प्रोता
    जगत्साक्षिणी
