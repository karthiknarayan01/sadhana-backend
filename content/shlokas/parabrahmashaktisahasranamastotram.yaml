id: parabrahmashaktisahasranamastotram
category: sahasranama
name:
  english: parabrahmashaktisahasranamastotram
  devanagari: परब्रह्मशक्तिसहस्रनामस्तोत्रम्
content:
  english: kotisuryapratikasham candrakotisushitalam | avanmanasagocaram shaktivyaptam jaganmayam || 16||
    saccidanandarupam ca nirgunam sagunam param | dhyatva parabrahmashaktim atmajnanam vindati kshanat
    || 17|| atha saharanamastotram | om citpunjapinditakhandatejorashirjagatprasuh | vyomatitapadantastha
    shunyashunyavilakshana || 18|| nirvikalpamahadiptirnirakarasamujjvala | bhavashunya prapancarta sattvamatravabhasini
    || 19|| adrishyadrigrupadhara gambhiragadhavaibhava | nistarangacidabhasa nishprapancaparamrita ||
    20|| avacyamahimopeta kevalajnanamurtimati | murtamurtaparityaga mahasamvinmayishvari || 21|| anakhyeyatmasamsthana
    kutasthacalamangala | nilajimutasankashavyalavadramyakuntala || 22|| praphullaminanetranta suvaktra
    carunasika | sahasrabahuvibhava mantrasiddhacaturbhuja || 23|| ragadveshalasatpasha krodhankushavimardini
    | manobhavekshukodanda tanmatrakusumayudha || 24|| arunarunasankasha balasuryasamaprabha | suryacandramasodbhasimukutonnatashekhara
    || 25|| nakhadiptivinirdhutakotibrahmandamandala | nakharomaprasutadyanekakalpasurasura || 26|| kotishavandyacarana
    durgamagamapaduka | kalpamanvantaratita mahakalaviharini || 27|| anaupamyasvarupa ca samadhikarahita
    sati | sarvamayi jagatpujya lepashunya cidambara || 28|| ajanma janmarahita punaravrittivarjita |
    nimeshonmeshanigdhutakotikalatigavini || 29|| mahodayi mahapunya mahasattva mahojjvala | guhyatiguhyagoptri
    ca sarvatattvamayi para || 30|| anadinidhana svastha parabrahmatmikadyutih | prapancashamanodyukta
    mahabhairavavallabha || 31|| nishkala nistulananta vishuddhajnanavigraha | ghorasamsaravaridhisantaranamahatari
    || 32|| cicchaktishcitsvarupa ca paramanandadayini | cidghana ca cidakara cidullasa cidancita || 33||
    amurta murtikavyapta sarvasankalpavarjita | mahamantramayi mata mahatantraprakashini || 34|| vyomavisphotasanjatanadabrahmamayi
    para | pranavodgarahridaya mahabindusamujjvala || 35|| akaraprathamabhasa sarvavarnashiromanih | shabdabrahmatmika
    devi shabdamalavibhushita || 36|| nadapunjaparishvanga bindunadakalantaga | shattrimshattattvasandoha
    tattvatita cidashraya || 37|| shivashaktidvayirubha sadashivapadonmukhi | ishvaratvavidhatri ca shuddhavidyamayishvari
    || 38|| mayamayatarorbijam kalakalavibhedini | niyatyargalasamruddha vidyavidyaprakashini || 39||
    ragaraginicitsamstha purushatvavidhayini | prakritiprasavabhikhya gunatrayavibhavini || 40|| mahattattvamahadiptirahankaravikarini
    | manobuddhindriyaprana pancatanmatramurtimati || 41|| sthulabhutaparicchinna vipravisphotakarini
    | brahmamayi brahmarupa parabrahmaprakashini || 42|| bhagavati bhagadhya ca bhagarupaprapancini |
    bhagavaniti shabdarya bhagasanasusamsthita || 43|| paramatma param jyotih paramatmaksharaprasuh |
    ishvari ceshvarakhyata sarveshvarahridashraya || 44|| kutastha svaprakasha ca sarvavyapiparanvita
    | jagadvijabijabhuta bijashunya sanatani || 45|| mahamaya mahavidyetyuccarya vacyavarjita | citprakasha
    cidalhada saccidanandavigraha || 46|| nadaruparasasparshagandhashabdatishayini | mahakaranarupa ca
    karyakaranavarjita || 47|| sarvashunya sarvapurna sarvasattvasamashraya | vishvotpattilayonmesha vishvapalanatatpara
    || 48|| kalaratrikalatita mahakalakalamayi | aksharaksharasambandha ksharaksharavilakshana || 49||
    sarvajna sarvakartri ca sarvashaktisamanvita | anirvacyaparananda saccidekarasatmika || 50|| icchajnanakriyashaktitrivenisangamojjvala
    | citprabha citkala cinmayi samvidunmeshatarini || 51|| sandhinyadharasamputa hladinihladavardhini
    | ahladini mahahlada hladananandadayini || 52|| rikprapancajatajuta yajuhsamavibhavini | atharvangirasambhodhih
    shadangashrutibhushita || 53|| upavedakaladhara puranaprasavonmukhi | itihasamahakaya mimamsadvayalocana
    || 54|| shaddarshanamahahamsa nyayavaisheshikaranih | agamendramahamanca tantramantraikasetuka ||
    55|| mantrabijaprakasha ca yantrarajapratishthita | navadhabhaktigambhira premapiyushavahini || 56||
    vaishnavi vishnurupastha shakta shaktajanapriya | shaivi shivapadaradhya ganapatyamahodaya || 57||
    sauralokamahadiptih kaumari guhamanasa | aindri marudvrita smarta kaulikacaravardhini || 58|| jainasattvamayi
    shuddha bodhisattvaikavigraha | sarasvatapravaha ca vaidikacaramangala || 59|| vamacararahasyastha
    dakshinacaradipika | samayacarasantushta samayantarviharini || 60|| mishracaramahavega mlecchacaravimardini
    | sarvatantramayi svaccha sarvamantramayi para || 61|| prakritipralayananda mahapunkhanupunkhika |
    namashatamahollasa brahmacaitanyavahini || 62|| caturvarnyamayi cakri varnashramavibhavini | brahmacaryavratadhara
    grihamedhipriyavaha || 63|| vanaprasthashramavasa sannyasollasavigraha | strirupa pumsvarupa ca napumsakapadasthita
    || 64|| apsaroganasangita yakshayakshinisevita | brahmarakshasasamhartri brahmapishamavimardini ||
    65|| bhutavetalakautuka kushmandaganamatrika | shakinidakinilola hakinicakravartini || 66|| kakinilakinimurti
    rakiniyakinimayi | muladharabjamadhyastha svadhishthanaviharini || 67|| manipuraprakasha ca anahatadhvanimayi
    | vishuddhicakranilaya ajnapadmanivasini || 68|| sahasraramaharambha shatcakrabhedabhedini | dashanakhyotthavishnushrirdashavidyamahodaya
    || 69|| mandasmitavinirmatakotikotishamandala | gatrakampamahakampavisphurjajjagadandaka || 70|| ruditotpaditanyakpralayakalaprabhanjani
    | nityanaimittikatyantapralayarnavatarini || 71|| mahasamharajhanjha ca mahakalpavasanika | shodashasamskritakara
    garbhadhanashubhodaya || 72|| pumsavanasvarupastha simantonnayanapriya | jatakarmamayi diptirnamakaranabhushita
    || 73|| nishkramanamahotsaha annaprashanaharshini | cudakarmamayi devi karnavedhavidhayini || 74||
    upanayanavedadhya samavartanamangala | vivahavratasampurna antyeshtisamskritakshara || 75|| dikshamayi
    dikshayitri gurumantraprakashini | gurusvarupa guruga gurugamya guhashraya || 76|| yajnarupa yajnabhoktri
    yajamanasvarupini | yajnakartri yajnasiddha mahayajnaphalaprada || 77|| madanamohanamohardra mahamanmathamohini
    | radhapriya radhika ca shadakshari rasatmika || 78|| paramanupramanastha brahmandaparamavadhih |
    mandasmitavinirjivashivajivanadayini || 79|| svatantra ca svatantrottha svacchandamitashaktika | srishtikartri
    srishtirupa srishtipalanatatpara || 80|| samhartri samhritimukha tirodhanavidhayini | anugrahaprada
    nitya pancakrityadhurandhara || 81|| pratyayakalanayajnaravananvayanashini | dakshayani dakshayajnavinashatibhayankari
    || 82|| atmavidya brahmavidya mahavidya maheshvari | shodashaksharamantradhya pancadashyaksharavalih
    || 83|| shrividya shrimayi shrida shrimati tripurasundari | ganga yamunavartana narmada gandaki nadi
    || 84|| sarasvati sindhukanya godavari tarangini | kaveri sarayu krishna candrabhaga mahanadi || 85||
    sarvatirthamayi shuddha tirtharajapratishthita | mahajalaughagambhira jagatpavanapavani || 86|| nishkampadiparupa
    ca mahabhairavasakshini | svaprakashacidananda parabrahmavabhasini || 87|| ashtangayoganirata yamaniyamamurtimati
    | asanapranasamrodha pratyaharaprakashini || 88|| dharanadhyanamagna ca samadhisamavigraha | kriyayogamayi
    kshemya hathayogavisharada || 89|| rajayogamahapitha layayogatarangini | jnanayogaprakasha ca bhaktiyogamahodaya
    || 90|| karmayogapathadhara sarvayogeshvareshvara | kundaliyogasandoha nadayogasukhaprada || 91||
    vamabhagalasadrupa prakritih prakriteh para | dakshinabhagasamputa purushah purushottama || 92|| svayameva
    param brahma saccidanandalakshanam | mata pita ca bhrata ca bhagini bandhurupini || 93|| vadhuh putrashca
    putri ca pautrapautrikulakula | vamshakrid vamsharupa ca vamshanashananashini || 94|| sumukhi ca samukhi
    ca tripadgayatrirupini | matangi rajyashyamala sarvamantravashankari || 95|| vishnurupa vishnushaktirmadhusudanamardini
    | sarvavedantatatparya sarvadarshanagocara || 96|| shabdarthagranthasandoha kavikalpalata shubha |
    abheda bhedarupa ca bhedabhedavilakshana || 97|| paranandamritotseka cidvilasatarangini | parabrahmacaitanyadiptih
    sarvamangalamangala || 98|| kubjika kubjarupa ca kuluka kulanayika | kurukulla karala ca karalavadana
    shubha || 99|| kalika kalakanta ca kalakutavimardini | kadambavanavasastha kadambakusumotsuka || 100||
    kadambamalalankara kadambarimadalasa | parabrahmasutradhara parabrahmamayi sati || 101|| parabrahmamahabindusinduratilakojjvala
    | svakiyabhartrirupa ca svayam vai patirupini || 102|| svapatnyabhedasamsiddha svashaktyaikatmavigraha
    | mahatripurasundarya mahasamrajyashalini || 103|| catuhshashtikalamayi kalatita kalanidhih | simhasanasamarudha
    rajarajeshvari para || 104|| binducakrakritavasa navacakrakramonmukhi | trailokyamohanacakraprakatitaksharamalika
    || 105|| sarvashaparipurastha sarvasankshobhini tatha | sarvasaubhagyadayitri sarvarthasadhikojjvala
    || 106|| sarvarakshakarakara sarvarogaharakshara | sarvasiddhiprada devi sarvahladamayi para || 107||
    mahakundalinishaktih paramanandalahari | sudhamayapravaha ca candramandalavartini || 100|| mahamayukhakalita
    mahatejomayishvari | sarvavedantanilaya sarvasankalpavarjita || 109|| acintyadivyamahima vanmanasatigavini
    | nityashuddha buddharupa parabrahmaprakashini || 110|| cidakashamahagarbha mahashunyaviharini | anantakotibrahmandabhandaspandanakarini
    || 111|| mahakalpagnisandoha mahapralayanartiki | mahakalagrasatprana sarvagrasamahotsava || 112||
    vinashatulanarahita sarvotpattivivarjita | niradharapratishtha ca svapratishtha paratpara || 113||
    atitanagatajnana vartamanaprakashini | trikalajvalamukuta trikalabhuvaneshvari || 114|| adeshakalaparicchinna
    sarvadeshamayi sati | amurta murtasanghata vyaktavyaktasvarupini || 115|| anadyantacidabhasa madhyashunya
    mahodaya | maharahasyamantradhya gudhaguhyatamaprabha || 116|| niranjana nirguna ca nishkala nirupadrava
    | nirvikara nirakara nirvikalpa niramaya || 117|| ameyamahima devi pramanajnanavarjita | pramatrirupa
    prameya pramitiprasavonmukhi || 118|| mahamahopadhyayapriya vedavedangaparaga | shastrarthajalpajalpastha
    vadajalpavimardini || 119|| siddhasevya siddhamayi siddhasanghapramodini | mahasiddheshvaraprana siddhivijnanadayini
    || 120|| svayambhuh svaprakashastha svakiyanandavahini | parabrahmarasambhodhih parabrahmamayottama
    || 121|| akararupa prathama adyashaktiranakula | ikaramanmathakala ishvaripadamangala || 122|| ukaraviryavibhava
    uruvegaviharini | rikaramantramurta ca rikaravarnamatrika || 123|| likaratantrasamsiddha likarabhairavi
    para | ekaraikarapithastha okaraukararupini || 124|| ankarabindumadhyastha ahkaraparamakshara | kadihadimahantastha
    kadimantrarthabhavini || 125|| akaradikshakarantasarvavarnasvarupini | varnamalamahabhusha nadapunjavilasini
    || 126|| akashamatrika mukhya anandamritavahini | icchashaktiprakasha ca ihashunyapade sthita || 127||
    utpattisthitisamharamulabhuta uma sati | urdhvaretomahadiptirurdhvacakravibhedini || 128|| rishivandya
    rijuprajna ritavriddhividhayini | litulyashunyasamstha ca ekaviramahodaya || 129|| aishvaryadatri
    aishani ojorashih oshadhishah | audaryanilaya augryanashini anuttama || 130|| antarmukhajanaradhya
    andhakaravinashini | aksharaprasavitri ca aksharatitagavini || 131|| sarvavarnamayi svaccha sarvamantrarthadipika
    | parabrahmaksharabhasa parabrahmamayishvari || 132|| kamala kamaniya ca kalyani kalikalmasha | kathorakarmanirmukya
    karunarasavahini || 133|| khadgadharinidurdharsha khetakaprakataprabha | khagasanamahadiptih khadyotadyutihasini
    || 134|| gambhiravartanabhistha gangavartatarangini | gadadharinigandharva guniguhyatamashraya ||
    135|| ghantanadamahahlada ghargharaghoranadini | ghanastanabharanamra ghanashyama ghanotsuka || 136||
    nakaravarnamadhyastha nasvarupa namatrika | caturvargaprada cakracancaccakraviharini || 137|| candramandalashankasha
    candamundavimardini | chatracamarasamputa cchinnamastakamurtimati || 138|| jagatprasutirjagati janardanajanapriya
    | jadyavidhvamsanacatura jitamitra jitendriya || 139|| jhankaranupuropeta jhanjhavatajhanatkrita |
    nakaravarnasamsiddha narupa navibhavini || 140|| tankarabanahasta ca tankadharinitankini | thakarapithanilaya
    tharupa thamahodaya || 141|| dama damaruhasta ca dakinidamarupriya | dhakkaravaniboddha ca dhundhirajaprapujita
    || 142|| nakaravarnamurdhastha tantriki tantramantrini | taruni tapashamani tamasi tarini tatha ||
    143|| sthulasukshmamahakaya sthairyarupa sthira sati | dantadiptivinirdhutadaityadanavadarpaka ||
    144|| durga durgartishamani dushtadanavaghatini | dhanurdharinidharmadhya dharini dhanadayini || 145||
    nandini nandaputra ca nagaharavibhushita | nabhihradamahavarta nirguna nirupadrava || 146|| padmanabhapriya
    padma padmanetra padonmukhi | pancapretasanasina pancabanapramardini || 147|| phullapankajasankasha
    phetkarabhairavi para | bandhanonmocani bandya balabhadraprasuh sati || 148|| bahubahurupa siddha
    balasuryasamaprabha | bhavani bhavarogaghni bhima bhimavadojjvala || 149|| madhupriya madonmatta matangi
    madironmukhi | mahalakshmirmahakali mahasarasvati mayi || 150|| yajnapriya yajnamurti yajamanasvarupini
    | yashoda yamunavarta yaksharatprakataprabha || 151|| rakta raktambaradhara raktadantika ranjani |
    ramani ramaniya ca rajarajeshvari para || 152|| lajjabijaprakasha ca lalita lalitambika | lambastanabharanamra
    lokalocanalocana || 153|| vasuprada vasumati varuna varnini vara | vagbhaveshi vagmayi ca vajapeyaphalaprada
    || 154|| shankhacakragadahasta shashankamukutonmukhi | shyama shyamalatanvangi shmashananilaya shiva
    || 155|| shatcakrabhedini shodha shattrimshattattvabhushita | shadangashrutirupa ca shadamnayamahodaya
    || 156|| sarasvati sagarastha subhadra sarvamangala | saccidanandarupa ca sarvasiddheshvareshvara
    || 157|| hamsahina hamsamurti hathayogavisharada | haripriya hararadhya hakaravarnavigraha || 158||
    kshakarasankatahara kshama kshemankari kshitih | kshutpipasasvarupastha kshirodarnavakanyaka || 159||
    sarvavarnamahavyapta sarvamantrarthadipika | parabrahmaksharabhasa parabrahmamayishvari || 160|| manolekhanalekhastha
    vidhatri vishvabhagyada | sarvasankalpacitrajna nityalekhanatatpara || 161|| kadividya hadividya sadividya
    mahodaya | paramahamsinividya cakshurvidya sukhaprada || 162|| shukavidya shubhakara sanjivanimahadyutih
    | marmividya marmabhetta marmarahasyagopita || 163|| kamarupa kamakala kamacaraviharini | yoginiparvatamadhyastha
    yonikundasusamsthita || 164|| yonipithamahadhara nilashailanivasini | nilancalavilasastha nilacalashiromanih
    || 165|| yonipithaparapitha kamakhya kamadayini | prasiddhalalitambika mahavidya maheshvari || 166||
    guptabhicara shamani shatrusanghavimardini | guhyakali guhyarupa guhyamantraprakashini || 167|| mahabhairavamurdhastha
    mahakaleshvarashraya | siddhasanasamarudha siddhamritatarangini || 168|| cinmayi citkalatita cetanacetanaprasuh
    | mahamantramayimata mahatantraikadikshita || 169|| svaprakashacidabhasa parabrahmatmika dyutih |
    jagadutpattibijadhya sarvamangalamangala || 170|| akhandanandapiyushadharasaravivardhini | brahmandakotisankshobhakarini
    kalamardini || 171|| mahavidyeshvaraprananadimandalacarini | citsuryamandalantastha mahamohadribhedini
    || 172|| acintyavyaktarupa ca vyaktalokamaheshvari | nadabindukalatita shuddhasamvitprakashini ||
    173|| yajnesharcitapadabja sarvayajnaphalaprada | trikalajnanasampanna bhutabhavyabhavatprasuh ||
    174|| mayajalavritakara mayajalavimardini | guhatiguhyagandharva guhyamandalavartini || 175|| anantarashmisandoha
    mahatejahprasarini | svaprakashacidakasha sarvalokaikasakshini || 176|| bhavabandhaprashamani bhaktakalyanakarini
    | namarupavinirmukta namarupaprakashini || 177|| brahmavishnushivaradhya brahmavishnushivatmika |
    sarvashunyaspadastha ca sarvalokamayi para || 178|| mahamantrarthamurta ca mantrashaktyudayaprada
    | anahatamahadhvanaranjita lokadharini || 179|| mahodayanilaya ca mahakalyanasantatih | parabrahmacaitanyarupa
    paraparaphalaprada || 180|| acintyanandavibhava saccidanandavigraha | mahamahodayotsikta cidvilasatarangini
    || 181|| sarvavedantasiddhanta sarvashastrarthadipika | svaprakashacidabhasa niradharapadasthita ||
    182|| kalacakrabhrameshani mahakalapramardini | nityamukta nityasiddha nityamangaladayini || 183||
    guhyatiguhyagoptri ca guhyamandalavartini | mahasamvinmayi shuddha mahabinduvibhushita || 184|| jagadutpattihetustha
    jagatpalanatatpara | jagatsamhararabhasa tirodhanavidhayini || 185|| anugrahamayi nitya pancakrityasamutsuka
    | brahmavishnushivendradidivyavaibhavadayini || 186|| anadyantaparicchinna sarvadeshamayi sati | sarvakalakalatita
    sarvavastvavabhasini || 187|| paramarthaikasamsiddha paramanandalahari | mahabhairavasakshinya mahabhairavavallabha
    || 188|| avanmanasagamya ca shabdabrahmatmika para | cidghana citkala sukshma sthulamurtamurtakshara
    || 189|| shriparaparashaktih shrimati parabrahmatmika | evam shriparamabrahmashaktisahasrakam jaguh
    || 190|| anandabhairava uvaca
  devanagari: कोटिसूर्यप्रतीकाशं चन्द्रकोटिसुशीतलम् । अवाङ्मनसगोचरं शक्तिव्याप्तं जगन्मयम् ॥ १६॥ सच्चिदानन्दरूपं
    च निर्गुणं सगुणं परम् । ध्यात्वा परब्रह्मशक्तिं आत्मज्ञानं विन्दति क्षणात् ॥ १७॥ अथ सहरनामस्तोत्रम्
    । ॐ चित्पुञ्जपिण्डिताखण्डतेजोराशिर्जगत्प्रसूः । व्योमातीतपदान्तस्था शून्याशून्यविलक्षणा ॥ १८॥ निर्विकल्पमहादीप्तिर्निराकारसमुज्ज्वला
    । भावशून्या प्रपञ्चार्ता सत्त्वमात्रावभासिनी ॥ १९॥ अदृश्यदृग्रूपधरा गम्भीरागाधवैभवा । निस्तरङ्गचिदाभासा
    निष्प्रपञ्चपरामृता ॥ २०॥ अवाच्यमहिमोपेता केवलज्ञानमूर्तिमती । मूर्तामूर्तपरित्यागा महासंविन्मयीश्वरी
    ॥ २१॥ अनाख्येयात्मसंस्थाना कूटस्थाचलमङ्गला । नीलजीमूतसङ्काशव्यालवद्रम्यकुन्तला ॥ २२॥ प्रफुल्लमीननेत्रान्ता
    सुवक्त्रा चारुनासिका । सहस्रबाहुविभवा मन्त्रसिद्धचतुर्भुजा ॥ २३॥ रागद्वेषलसत्पाशा क्रोधान्कुशविमर्दिनी
    । मनोभवेक्षुकोदण्डा तन्मात्रकुसुमायुधा ॥ २४॥ अरुणारुणसङ्काशा बालसूर्यसमप्रभा । सूर्याचन्द्रमसोद्भासिमुकुटोन्नतशेखरा
    ॥ २५॥ नखदीप्तिविनिर्धूतकोटिब्रह्माण्डमण्डला । नखरोमप्रसूताद्यानेककल्पसुरासुरा ॥ २६॥ कोटीशवन्द्यचरणा
    दुर्गमागमपादुका । कल्पमन्वन्तरातीता महाकालविहारिणी ॥ २७॥ अनौपम्यस्वरूपा च समाधिकरहिता सती । सर्वमयी
    जगत्पूज्या लेपशून्या चिदम्बरा ॥ २८॥ अजन्मा जन्मरहिता पुनरावृत्तिवर्जिता । निमेषोन्मेषनिग्धूतकोटिकालातिगाविनी
    ॥ २९॥ महोदयी महापुण्या महासत्त्वा महोज्ज्वला । गुह्यातिगुह्यगोप्त्री च सर्वतत्त्वमयी परा ॥ ३०॥ अनादिनिधना
    स्वस्था परब्रह्मात्मिकाद्युतिः । प्रपञ्चशमनोद्युक्ता महाभैरववल्लभा ॥ ३१॥ निष्कला निस्तुलानन्ता विशुद्धज्ञानविग्रहा
    । घोरसंसारवारिधिसन्तारणमहातरी ॥ ३२॥ चिच्छक्तिश्चित्स्वरूपा च परमानन्ददायिनी । चिद्घना च चिदाकारा चिदुल्लासा
    चिदञ्चिता ॥ ३३॥ अमूर्ता मूर्तिकाव्याप्ता सर्वसङ्कल्पवर्जिता । महामन्त्रमयी माता महातन्त्रप्रकाशिनी
    ॥ ३४॥ व्योमविस्फोटसञ्जातनादब्रह्ममयी परा । प्रणवोद्गारहृदया महाबिन्दुसमुज्ज्वला ॥ ३५॥ अकारप्रथमाभासा
    सर्ववर्णशिरोमणिः । शब्दब्रह्मात्मिका देवी शब्दमालाविभूषिता ॥ ३६॥ नादपुञ्जपरिष्वङ्गा बिन्दुनादकलान्तगा
    । षट्त्रिंशत्तत्त्वसन्दोहा तत्त्वातीता चिदाश्रया ॥ ३७॥ शिवशक्तिद्वयीरूभा सदाशिवपदोन्मुखी । ईश्वरत्वविधात्री
    च शुद्धविद्यामयीश्वरी ॥ ३८॥ मायामयतरोर्बीजं कलाकालविभेदिनी । नियत्यर्गलसंरुद्धा विद्याविद्याप्रकाशिनी
    ॥ ३९॥ रागरागिणिचित्संस्था पुरुषत्वविधायिनी । प्रकृतिप्रसवाभिख्या गुणत्रयविभाविनी ॥ ४०॥ महत्तत्त्वमहादीप्तिरहङ्कारविकारिणी
    । मनोबुद्धीन्द्रियप्राणा पञ्चतन्मात्रमूर्तिमती ॥ ४१॥ स्थूलभूतपरिच्छिन्ना विप्रविस्फोटकारिणी । ब्रह्ममयी
    ब्रह्मरूपा परब्रह्मप्रकाशिनी ॥ ४२॥ भगवती भगाढ्या च भगरूपप्रपञ्चिनी । भगवानिति शब्दार्या भगासनसुसंस्थिता
    ॥ ४३॥ परमात्मा परं ज्योतिः परमात्माक्षरप्रसूः । ईश्वरी चेश्वराख्याता सर्वेश्वरहृदाश्रया ॥ ४४॥ कूटस्था
    स्वप्रकाशा च सर्वव्यापिपरान्विता । जगद्वीजबीजभूता बीजशून्या सनातनी ॥ ४५॥ महामाया महाविद्येत्युच्चार्या
    वाच्यवर्जिता । चित्प्रकाशा चिदाल्हादा सच्चिदानन्दविग्रहा ॥ ४६॥ नादरूपरसस्पर्शगन्धशब्दातिशायिनी । महाकारणरूपा
    च कार्यकारणवर्जिता ॥ ४७॥ सर्वशून्या सर्वपूर्णा सर्वसत्त्वसमाश्रया । विश्वोत्पत्तिलयोन्मेषा विश्वपालनतत्परा
    ॥ ४८॥ कालरात्रिकलातीता महाकालकलामयी । अक्षराक्षरसम्बन्धा क्षराक्षरविलक्षणा ॥ ४९॥ सर्वज्ञा सर्वकर्त्री
    च सर्वशक्तिसमन्विता । अनिर्वाच्यापरानन्दा सच्चिदेकरसात्मिका ॥ ५०॥ इच्छाज्ञानक्रियाशक्तित्रिवेणीसङ्गमोज्ज्वला
    । चित्प्रभा चित्कला चिन्मयी संविदुन्मेषतारिणी ॥ ५१॥ सन्धिन्याधारसम्पूता ह्लादिनीह्लादवर्धिनी । आह्लादिनी
    महाह्लादा ह्लादनानन्ददायिनी ॥ ५२॥ ऋक्प्रपञ्चजटाजूटा यजुःसामविभाविनी । अथर्वाङ्गिरसाम्भोधिः षडङ्गश्रुतिभूषिता
    ॥ ५३॥ उपवेदकलाधारा पुराणप्रसवोन्मुखी । इतिहासमहाकाया मीमांसाद्वयलोचना ॥ ५४॥ षड्दर्शनमहाहंसा न्यायवैशेषिकारणिः
    । आगमेन्द्रमहामञ्चा तन्त्रमन्त्रैकसेतुका ॥ ५५॥ मन्त्रबीजप्रकाशा च यन्त्रराजप्रतिष्ठिता । नवधाभक्तिगम्भीरा
    प्रेमपीयूषवाहिनी ॥ ५६॥ वैष्णवी विष्णुरुपस्था शाक्ता शाक्तजनप्रिया । शैवी शिवपदाराध्या गाणपत्यमहोदया
    ॥ ५७॥ सौरलोकमहादीप्तिः कौमारी गुहमानसा । ऐन्द्री मरुद्वृता स्मार्ता कौलिकाचारवर्धिनी ॥ ५८॥ जैनसत्त्वमयी
    शुद्धा बोधिसत्त्वैकविग्रहा । सारस्वतप्रवाहा च वैदिकाचारमङ्गला ॥ ५९॥ वामाचाररहस्यस्था दक्षिणाचारदीपिका
    । समयाचारसन्तुष्टा समयान्तर्विहारिणी ॥ ६०॥ मिश्राचारमहावेगा म्लेच्छाचारविमर्दिनी । सर्वतन्त्रमयी स्वच्छा
    सर्वमन्त्रमयी परा ॥ ६१॥ प्रकृतिप्रलयानन्दा महापुङ्खानुपुङ्खिका । नामशतमहोल्लासा ब्रह्मचैतन्यवाहिनी
    ॥ ६२॥ चातुर्वर्ण्यमयी चक्री वर्णाश्रमविभाविनी । ब्रह्मचर्यव्रताधारा गृहमेधिप्रियावहा ॥ ६३॥ वानप्रस्थाश्रमावासा
    सन्न्यासोल्लासविग्रहा । स्त्रीरूपा पुंस्वरूपा च नपुंसकपदस्थिता ॥ ६४॥ अप्सरोगणसङ्गीता यक्षयक्षिणिसेविता
    । ब्रह्मराक्षससंहर्त्री ब्रह्मपिशामविमर्दिनी ॥ ६५॥ भूतवेतालकौतुका कूष्माण्डगणमातृका । शाकिनीडाकिनीलोला
    हाकिनीचक्रवर्तिनी ॥ ६६॥ काकिनीलाकिनीमूर्ती राकिनीयाकिनीमयी । मूलाधाराब्जमध्यस्था स्वाधिष्ठानविहारिणी
    ॥ ६७॥ मणिपूरप्रकाशा च अनाहतध्वनिमयी । विशुद्धिचक्रनिलया आज्ञापद्मनिवासिनी ॥ ६८॥ सहस्रारमहारम्भा षट्चक्रभेदभेदिनी
    । दशनाख्योत्थविष्णुश्रीर्दशविद्यामहोदया ॥ ६९॥ मन्दस्मितविनिर्मातकोटिकोटीशमण्डला । गात्रकम्पमहाकम्पविस्फूर्जज्जगदण्डका
    ॥ ७०॥ रुदितोत्पादितन्यक्प्रलयाकालप्रभञ्जनी । नित्यनैमित्तिकात्यन्तप्रलयार्णवतारिणी ॥ ७१॥ महासंहारझञ्झा
    च महाकल्पावसानिका । षोडशसंस्कृताकारा गर्भाधानशुभोदया ॥ ७२॥ पुंसवनस्वरूपस्था सीमन्तोन्नयनप्रिया । जातकर्ममयी
    दीप्तिर्नामकरणभूषिता ॥ ७३॥ निष्क्रमणमहोत्साहा अन्नप्राशनहर्षिणी । चूडाकर्ममयी देवी कर्णवेधविधायिनी
    ॥ ७४॥ उपनयनवेदाढ्या समावर्तनमङ्गला । विवाहव्रतसम्पूर्णा अन्त्येष्टिसंस्कृताक्षरा ॥ ७५॥ दीक्षामयी दीक्षयित्री
    गुरुमन्त्रप्रकाशिनी । गुरुस्वरूपा गुरुगा गुरुगम्या गुहाश्रया ॥ ७६॥ यज्ञरूपा यज्ञभोक्त्री यजमानस्वरूपिणी
    । यज्ञकर्त्री यज्ञसिद्धा महायज्ञफलप्रदा ॥ ७७॥ मदनमोहनमोहार्द्रा महामन्मथमोहिनी । राधाप्रिया राधिका
    च षडक्षरी रसात्मिका ॥ ७८॥ परमाणुप्रमाणस्था ब्रह्माण्डपरमावधिः । मन्दस्मितविनिर्जीवशिवजीवनदायिनी ॥
    ७९॥ स्वतन्त्रा च स्वतन्त्रोत्था स्वच्छन्दामितशक्तिका । सृष्टिकर्त्री सृष्टिरूपा सृष्टिपालनतत्परा ॥
    ८०॥ संहर्त्री संहृतिमुखा तिरोधानविधायिनी । अनुग्रहप्रदा नित्या पञ्चकृत्यधुरन्धरा ॥ ८१॥ प्रत्यायकलनायज्ञरावणान्वयनाशिनी
    । दाक्षायणी दक्षयज्ञविनाशातिभयङ्करी ॥ ८२॥ आत्मविद्या ब्रह्मविद्या महाविद्या महेश्वरी । षोडशाक्षरमन्त्राढ्या
    पञ्चदश्यक्षरावलिः ॥ ८३॥ श्रीविद्या श्रीमयी श्रीदा श्रीमती त्रिपुरसुन्दरी । गङ्गा यमुनावर्ताना नर्मदा
    गण्डकी नदी ॥ ८४॥ सरस्वती सिन्धुकन्या गोदावरी तरङ्गिणी । कावेरी सरयू कृष्णा चन्द्रभागा महानदी ॥ ८५॥
    सर्वतीर्थमयी शुद्धा तीर्थराजप्रतिष्ठिता । महाजलौघगम्भीरा जगत्पावनपावनी ॥ ८६॥ निष्कम्पदीपरूपा च महाभैरवसाक्षिणी
    । स्वप्रकाशचिदानन्दा परब्रह्मावभासिनी ॥ ८७॥ अष्टाङ्गयोगनिरता यमनियममूर्तिमती । आसनप्राणसंरोधा प्रत्याहारप्रकाशिनी
    ॥ ८८॥ धारणाध्यानमग्ना च समाधिसमविग्रहा । क्रियायोगमयी क्षेम्या हठयोगविशारदा ॥ ८९॥ राजयोगमहापीठा लययोगतरङ्गिणी
    । ज्ञानयोगप्रकाशा च भक्तियोगमहोदया ॥ ९०॥ कर्मयोगपथाधारा सर्वयोगेश्वरेश्वर । कुण्डलीयोगसन्दोहा नादयोगसुखप्रदा
    ॥ ९१॥ वामभागलसद्रूपा प्रकृतिः प्रकृतेः परा । दक्षिणभागसम्पूता पुरुषः पुरुषोत्तमा ॥ ९२॥ स्वयमेव परं
    ब्रह्म सच्चिदानन्दलक्षणम् । माता पिता च भ्राता च भगिनी बन्धुरूपिणी ॥ ९३॥ वधूः पुत्रश्च पुत्री च पौत्रपौत्रीकुलाकुला
    । वंशकृद् वंशरूपा च वंशनाशननाशिनी ॥ ९४॥ सुमुखी च समुखी च त्रिपाद्गायत्रीरूपिणी । मातङ्गी राज्यश्यामाला
    सर्वमन्त्रवशङ्करी ॥ ९५॥ विष्णुरूपा विष्णुशक्तिर्मधुसूदनमर्दिनी । सर्ववेदान्ततात्पर्या सर्वदर्शनगोचरा
    ॥ ९६॥ शब्दार्थग्रन्थसन्दोहा कविकल्पलता शुभा । अभेदा भेदरूपा च भेदाभेदविलक्षणा ॥ ९७॥ परानन्दामृतोत्सेका
    चिद्विलासतरङ्गिणी । परब्रह्मचैतन्यदीप्तिः सर्वमङ्गलमङ्गला ॥ ९८॥ कुब्जिका कुब्जरूपा च कुलूका कुलनायिका
    । कुरुकुल्ला कराला च करालवदना शुभा ॥ ९९॥ कालिका कालकान्ता च कालकूटविमर्दिनी । कदम्बवनवासस्था कदम्बकुसुमोत्सुका
    ॥ १००॥ कदम्बमालालङ्कारा कादम्बरीमदालसा । परब्रह्मसूत्रधरा परब्रह्ममयी सती ॥ १०१॥ परब्रह्ममहाबिन्दुसिन्दूरतिलकोज्ज्वला
    । स्वकीयभर्तृरूपा च स्वयं वै पतिरूपिणी ॥ १०२॥ स्वपत्न्यभेदसंसिद्धा स्वशक्त्यैकात्मविग्रहा । महात्रिपुरसुन्दर्या
    महासाम्राज्यशालिनी ॥ १०३॥ चतुःषष्टिकलामयी कलातीता कलानिधिः । सिंहासनसमारूढा राजराजेश्वरी परा ॥ १०४॥
    बिन्दुचक्रकृतावासा नवचक्रक्रमोन्मुखी । त्रैलोक्यमोहनचक्रप्रकटिताक्षरमालिका ॥ १०५॥ सर्वाशापरिपूरस्था
    सर्वसङ्क्षोभिणी तथा । सर्वसौभाग्यदायित्री सर्वार्थसाधिकोज्ज्वला ॥ १०६॥ सर्वरक्षाकराकारा सर्वरोगहराक्षरा
    । सर्वसिद्धिप्रदा देवी सर्वाह्लादमयी परा ॥ १०७॥ महाकुण्डलिनीशक्तिः परमानन्दलहरी । सुधामयप्रवाहा च
    चन्द्रमण्डलवर्तिनी ॥ १००॥ महामयूखकलिता महातेजोमयीश्वरी । सर्ववेदान्तनिलया सर्वसङ्कल्पवर्जिता ॥ १०९॥
    अचिन्त्यदिव्यमहिमा वाङ्मनसातिगाविनी । नित्यशुद्धा बुद्धरूपा परब्रह्मप्रकाशिनी ॥ ११०॥ चिदाकाशमहागर्भा
    महाशून्यविहारिणी । अनन्तकोटिब्रह्माण्डभाण्डस्पन्दनकारिणी ॥ १११॥ महाकल्पाग्निसन्दोहा महाप्रलयनर्तिकी
    । महाकालग्रसत्प्राणा सर्वग्रासमहोत्सवा ॥ ११२॥ विनाशतुलनारहिता सर्वोत्पत्तिविवर्जिता । निराधारप्रतिष्ठा
    च स्वप्रतिष्ठा परात्परा ॥ ११३॥ अतीतानागतज्ञाना वर्तमानप्रकाशिनी । त्रिकालज्वालामुकुटा त्रिकालभुवनेश्वरी
    ॥ ११४॥ अदेशकालपरिच्छिन्ना सर्वदेशमयी सती । अमूर्ता मूर्तसङ्घाता व्यक्ताव्यक्तस्वरूपिणी ॥ ११५॥ अनाद्यन्तचिदाभासा
    मध्यशून्या महोदया । महारहस्यमन्त्राढ्या गूढगुह्यतमप्रभा ॥ ११६॥ निरञ्जना निर्गुणा च निष्कला निरुपद्रवा
    । निर्विकारा निराकारा निर्विकल्पा निरामया ॥ ११७॥ अमेयमहिमा देवी प्रमाणज्ञानवर्जिता । प्रमातृरूपा प्रमेया
    प्रमितिप्रसवोन्मुखी ॥ ११८॥ महामहोपाध्यायप्रिया वेदवेदाङ्गपारगा । शास्त्रार्थजल्पजल्पस्था वादजल्पविमर्दिनी
    ॥ ११९॥ सिद्धसेव्या सिद्धमयी सिद्धसङ्घप्रमोदिनी । महासिद्धेश्वरप्राणा सिद्धिविज्ञानदायिनी ॥ १२०॥ स्वयम्भूः
    स्वप्रकाशस्था स्वकीयानन्दवाहिनी । परब्रह्मरसाम्भोधिः परब्रह्ममयोत्तमा ॥ १२१॥ अकाररूपा प्रथमा आद्यशक्तिरनाकुला
    । इकारमन्मथकला ईश्वरीपदमङ्गला ॥ १२२॥ उकारवीर्यविभवा ऊरुवेगविहारिणी । ऋकारमन्त्रमूर्ता च ॠकारवर्णमातृका
    ॥ १२३॥ ऌकारतन्त्रसंसिद्धा ॡकारभैरवी परा । एकारैकारपीठस्था ओकारौकाररूपिणी ॥ १२४॥ अङ्कारबिन्दुमध्यस्था
    अःकारपरमक्षरा । कादिहादिमहान्तस्था कादिमन्त्रार्थभाविनी ॥ १२५॥ अकारादिक्षकारान्तसर्ववर्णस्वरूपिणी
    । वर्णमालामहाभूषा नादपुञ्जविलासिनी ॥ १२६॥ आकाशमातृका मुख्या आनन्दामृतवाहिनी । इच्छाशक्तिप्रकाशा च
    ईहाशून्यपदे स्थिता ॥ १२७॥ उत्पत्तिस्थितिसंहारमूलभूता उमा सती । ऊर्ध्वरेतोमहादीप्तिरूर्ध्वचक्रविभेदिनी
    ॥ १२८॥ ऋषिवन्द्या ऋजुप्रज्ञा ॠतावृद्धिविधायिनी । ऌतुल्यशून्यसंस्था च एकवीरामहोदया ॥ १२९॥ ऐश्वर्यदात्री
    ऐशानी ओजोराशिः ओषधीशः । औदार्यनिलया औग्र्यनाशिनी अनुत्तमा ॥ १३०॥ अन्तर्मुखजनाराध्या अन्धकारविनाशिनी
    । अक्षरप्रसवित्री च अक्षरातीतगाविनी ॥ १३१॥ सर्ववर्णमयी स्वच्छा सर्वमन्त्रार्थदीपिका । परब्रह्माक्षराभासा
    परब्रह्ममयीश्वरी ॥ १३२॥ कमला कमनीया च कल्याणी कलिकल्मषा । कठोरकर्मनिर्मुक्या करुणारसवाहिनी ॥ १३३॥
    खड्गधारिणिदुर्धर्षा खेटकप्रकटप्रभा । खगासनमहादीप्तिः खद्योतद्युतिहासिनी ॥ १३४॥ गम्भीरावर्तनाभिस्था
    गङ्गावर्ततरङ्गिणी । गदाधारिणिगन्धर्वा गुणिगुह्यतमाश्रया ॥ १३५॥ घण्टानादमहाह्लादा घर्घराघोरनादिनी ।
    घनस्तनभरानम्रा घनश्यामा घनोत्सुका ॥ १३६॥ ङकारवर्णमध्यस्था ङस्वरूपा ङमातृका । चतुर्वर्गप्रदा चक्रचञ्चच्चक्रविहारिणी
    ॥ १३७॥ चन्द्रमण्डलशङ्काशा चण्डमुण्डविमर्दिनी । छत्रचामरसम्पूता च्छिन्नमस्तकमूर्तिमती ॥ १३८॥ जगत्प्रसूतिर्जगती
    जनार्दनजनप्रिया । जाड्यविध्वंसनचतुरा जितामित्रा जितेन्द्रिया ॥ १३९॥ झङ्कारनूपुरोपेता झञ्झावातझणत्कृता
    । ञकारवर्णसंसिद्धा ञरूपा ञविभाविनी ॥ १४०॥ टङ्कारबाणहस्ता च टङ्कधारिणिटङ्किनी । ठकारपीठनिलया ठरूपा
    ठमहोदया ॥ १४१॥ डम डमरुहस्ता च डाकिनीडमरुप्रिया । ढक्कारवनिबोद्धा च ढुण्ढिराजप्रपूजिता ॥ १४२॥ णकारवर्णमूर्धस्था
    तान्त्रिकी तन्त्रमन्त्रिणी । तरुणी तापशमनी तामसी तारिणी तथा ॥ १४३॥ स्थूलसूक्ष्ममहाकाया स्थैर्यरूपा
    स्थिरा सती । दन्तदीप्तिविनिर्धूतदैत्यदानवदर्पका ॥ १४४॥ दुर्गा दुर्गार्तिशमनी दुष्टदानवघातिनी । धनुर्धारिणिधर्माढ्या
    धरिणी धनदायिनी ॥ १४५॥ नन्दिनी नन्दपुत्रा च नागहारविभूषिता । नाभिह्रदमहावर्ता निर्गुणा निरुपद्रवा ॥
    १४६॥ पद्मनाभप्रिया पद्मा पद्मनेत्रा पदोन्मुखी । पञ्चप्रेतासनासीना पञ्चबाणप्रमर्दिनी ॥ १४७॥ फुल्लपङ्कजसङ्काशा
    फेत्कारभैरवी परा । बन्धनोन्मोचनी बन्द्या बलभद्रप्रसूः सती ॥ १४८॥ बहुबाहुरुपा सिद्धा बालसूर्यसमप्रभा
    । भवानी भवरोगघ्नी भीमा भीमवदोज्ज्वला ॥ १४९॥ मधुप्रिया मदोन्मत्ता मातङ्गी मदिरोन्मुखी । महालक्ष्मीर्महाकाली
    महासरस्वती मयी ॥ १५०॥ यज्ञप्रिया यज्ञमूर्ती यजमानस्वरूपिणी । यशोदा यमुनावर्ता यक्षराट्प्रकटप्रभा ॥
    १५१॥ रक्ता रक्ताम्बरधरा रक्तदन्तिका रञ्जनी । रमणी रमणीया च राजराजेश्वरी परा ॥ १५२॥ लज्जाबीजप्रकाशा
    च ललिता ललिताम्बिका । लम्बस्तनभरानम्रा लोकलोचनलोचना ॥ १५३॥ वसुप्रदा वसुमती वरुणा वर्णिनी वरा । वाग्भवेशी
    वाग्मयी च वाजपेयफलप्रदा ॥ १५४॥ शङ्खचक्रगदाहस्ता शशाङ्कमुकुटोन्मुखी । श्यामा श्यामलतन्वाङ्गी श्मशाननिलया
    शिवा ॥ १५५॥ षट्चक्रभेदिनी षोढा षट्त्रिंशत्तत्त्वभूषिता । षडङ्गश्रुतिरूपा च षडाम्नायमहोदया ॥ १५६॥ सरस्वती
    सागरस्था सुभद्रा सर्वमङ्गला । सच्चिदानन्दरूपा च सर्वसिद्धेश्वरेश्वर ॥ १५७॥ हंसहीना हंसमूर्ती हठयोगविशारदा
    । हरिप्रिया हराराध्या हकारवर्णविग्रहा ॥ १५८॥ क्षकारसङ्कटहरा क्षमा क्षेमङ्करी क्षितिः । क्षुत्पिपासास्वरूपस्था
    क्षीरोदार्णवकन्यका ॥ १५९॥ सर्ववर्णमहाव्याप्ता सर्वमन्त्रार्थदीपिका । परब्रह्माक्षराभासा परब्रह्ममयीश्वरी
    ॥ १६०॥ मनोलेखनलेखस्था विधात्री विश्वभाग्यदा । सर्वसङ्कल्पचित्रज्ञा नित्यलेखनतत्परा ॥ १६१॥ कादिविद्या
    हादिविद्या सादिविद्या महोदया । परमहंसिनीविद्या चक्षुर्विद्या सुखप्रदा ॥ १६२॥ शुकविद्या शुभाकारा सञ्जीवनीमहाद्युतिः
    । मर्मीविद्या मर्मभेत्ता मर्मरहस्यगोपिता ॥ १६३॥ कामरूपा कामकला कामचारविहारिणी । योगिनीपर्वतमध्यस्था
    योनिकुण्डसुसंस्थिता ॥ १६४॥ योनिपीठमहाधारा नीलशैलनिवासिनी । नीलाञ्चलविलासस्था नीलाचलशिरोमणिः ॥ १६५॥
    योनिपीठपरापीठा कामाख्या कामदायिनी । प्रसिद्धललिताम्बिका महाविद्या महेश्वरी ॥ १६६॥ गुप्ताभिचारा शमनी
    शत्रुसङ्घविमर्दिनी । गुह्यकाली गुह्यरूपा गुह्यमन्त्रप्रकाशिनी ॥ १६७॥ महाभैरवमूर्धस्था महाकालेश्वराश्रया
    । सिद्धासनसमारूढा सिद्धामृततरङ्गिणी ॥ १६८॥ चिन्मयी चित्कलातीता चेतनाचेतनप्रसूः । महामन्त्रमयीमाता
    महातन्त्रैकदीक्षिता ॥ १६९॥ स्वप्रकाशचिदाभासा परब्रह्मात्मिका द्युतिः । जगदुत्पत्तिबीजाढ्या सर्वमङ्गलमङ्गला
    ॥ १७०॥ अखण्डानन्दपीयूषधारासारविवर्धिनी । ब्रह्माण्डकोटिसङ्क्षोभकारिणी कालमर्दिनी ॥ १७१॥ महाविद्येश्वरप्राणनाडीमण्डलचारिणी
    । चित्सूर्यमण्डलान्तस्था महामोहाद्रिभेदिनी ॥ १७२॥ अचिन्त्यव्यक्तरूपा च व्यक्तलोकमहेश्वरी । नादबिन्दुकलातीता
    शुद्धसंवित्प्रकाशिनी ॥ १७३॥ यज्ञेशार्चितपादब्जा सर्वयज्ञफलप्रदा । त्रिकालज्ञानसम्पन्ना भूतभव्यभवत्प्रसूः
    ॥ १७४॥ मायाजालावृताकारा मायाजालविमर्दिनी । गुहातिगुह्यगन्धर्वा गुह्यमण्डलवर्तिनी ॥ १७५॥ अनन्तरश्मिसन्दोहा
    महातेजःप्रसारिणी । स्वप्रकाशचिदाकाशा सर्वलोकैकसाक्षिणी ॥ १७६॥ भवबन्धप्रशमनी भक्तकल्याणकारिणी । नामरूपविनिर्मुक्ता
    नामरूपप्रकाशिनी ॥ १७७॥ ब्रह्मविष्णुशिवाराध्या ब्रह्मविष्णुशिवात्मिका । सर्वशून्यास्पदस्था च सर्वलोकमयी
    परा ॥ १७८॥ महामन्त्रार्थमूर्ता च मन्त्रशक्त्युदयप्रदा । अनाहतमहाध्वानरञ्जिता लोकधारिणी ॥ १७९॥ महोदयनिलया
    च महाकल्याणसन्ततिः । परब्रह्मचैतन्यरूपा परापरफलप्रदा ॥ १८०॥ अचिन्त्यानन्दविभवा सच्चिदानन्दविग्रहा
    । महामहोदयोत्सिक्ता चिद्विलासतरङ्गिणी ॥ १८१॥ सर्ववेदान्तसिद्धान्ता सर्वशास्त्रार्थदीपिका । स्वप्रकाशचिदाभासा
    निराधारपदस्थिता ॥ १८२॥ कालचक्रभ्रमेशानी महाकालप्रमर्दिनी । नित्यमुक्ता नित्यसिद्धा नित्यमङ्गलदायिनी
    ॥ १८३॥ गुह्यातिगुह्यगोप्त्री च गुह्यमण्डलवर्तिनी । महासंविन्मयी शुद्धा महाबिन्दुविभूषिता ॥ १८४॥ जगदुत्पत्तिहेतुस्था
    जगत्पालनतत्परा । जगत्संहाररभसा तिरोधानविधायिनी ॥ १८५॥ अनुग्रहमयी नित्या पञ्चकृत्यसमुत्सुका । ब्रह्मविष्णुशिवेन्द्रादिदिव्यवैभवदायिनी
    ॥ १८६॥ अनाद्यन्तापरिच्छिन्ना सर्वदेशमयी सती । सर्वकालकलातीता सर्ववस्त्ववभासिनी ॥ १८७॥ परमार्थैकसंसिद्धा
    परमानन्दलहरी । महाभैरवसाक्षिण्या महाभैरववल्लभा ॥ १८८॥ अवाङ्मनसगम्या च शब्दब्रह्मात्मिका परा । चिद्घना
    चित्कला सूक्ष्मा स्थूलमूर्तामूर्ताक्षरा ॥ १८९॥ श्रीपरापरशक्तिः श्रीमती परब्रह्मात्मिका । एवं श्रीपरमब्रह्मशक्तिसहस्रकं
    जगुः ॥ १९०॥ आनन्दभैरव उवाच
