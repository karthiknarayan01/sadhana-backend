id: cidambaram-shrinatarajastuti
category: stotram
name:
  english: cidambaram shrinatarajastuti
  devanagari: चिदम्बरं श्रीनटराजस्तुती
content:
  english: cidambaram shrinatarajastuti || namaste rudra manyava utota ishave namah | namaste astu dhanvane
    karabhyam te namo namah || 1|| yate rudra shiva tanuh shanta tasyai namo namah | namo'stu nilagrivaya
    sahasrakshaya te namah || 2|| sahasrapanaye tubhyam midhushtamaya te namah | kapardine namastubhyam
    kalarupaya te namah || 3|| namaste cattashastraya namaste shulapanaye | hiranyapanaye tubhyam hiranyapataye
    namah || 4|| namaste vriksharupaya harikeshaya te namah | pashunam pataye tubhyam pathinam pataye
    namah || 5|| pushtanam pataye tubhyam kshetranam pataye namah | atatavisvarupaya vananam pataye namah
    || 6|| rohitaya stapataye vrikshanam pataye namah | namaste mantrine sakshat kakshanam pataye namah
    || 7|| oshadhinam ca pataye namah sakshatparatmane | uccairghoshaya devaya pattinam pataye namah ||
    8|| satvanam pataye tubhyam ghananam pataye namah | sahamanaya shantaya shankaraya namo namah || 9||
    adhinam pataye tubhyam vyadhinam pataye namah | kakubhaya namastubhyam namaste'stu nishangine || 10||
    stenanam pataye tubhyam dhananam pataye namah | taskaranam namastubhyam pataye papaharine || 11||
    vancate parivancate stayunam pataye namah | namo nicerave tubhyam aranyanam pataye namah || 12|| ushnishine
    namastubhyam namaste paramatmane | vistritaya namastubhyam asinaya namonamah || 13|| shayanaya namstubhyam
    sushuptaya namo namah | prabuddhaya namastubhyam sthiraya paramatmane || 14|| sabharupaya te nityam
    sabhayah pataye namah | namah shivaya sambaya brahmane sarvasakshine || 15|| || iti sutasamhitayam
    muktikande sabhapatistutih sampurnam ||
  devanagari: चिदम्बरं श्रीनटराजस्तुती ॥ नमस्ते रूद्र मन्यव उतोत इषवे नमः । नमस्ते अस्तु धन्वने कराभ्यां
    ते नमो नमः ॥ १॥ याते रुद्र शिवा तनूः शान्ता तस्यै नमो नमः । नमोऽस्तु नीलग्रीवाय सहस्राक्षाय ते नमः
    ॥ २॥ सहस्रपाणये तुभ्यं मीढुष्टमाय ते नमः । कपर्दिने नमस्तुभ्यं कालरूपाय ते नमः ॥ ३॥ नमस्ते चात्तशस्त्राय
    नमस्ते शूलपाणये । हिरण्यपाणये तुभ्यं हिरण्यपतये नमः ॥ ४॥ नमस्ते वृक्षरूपाय हरिकेशाय ते नमः । पशूनां
    पतये तुभ्यं पथीनां पतये नमः ॥ ५॥ पुष्टानां पतये तुभ्यं क्षेत्राणां पतये नमः । आतताविस्वरूपाय वनानां
    पतये नमः ॥ ६॥ रोहिताय स्तपतये वृक्षाणां पतये नमः । नमस्ते मन्त्रिणे साक्षात् कक्षाणां पतये नमः ॥ ७॥
    ओषधीनां च पतये नमः साक्षात्परात्मने । उच्चैर्घोषाय देवाय पत्तीनां पतये नमः ॥ ८॥ सत्वानां पतये तुभ्यं
    घनानां पतये नमः । सहमानाय शान्ताय शङ्कराय नमो नमः ॥ ९॥ आधीनां पतये तुभ्यं व्याधीनं पतये नमः । ककुभाय
    नमस्तुभ्यं नमस्तेऽस्तु निषङ्गिणे ॥ १०॥ स्तेनानां पतये तुभ्यं धनानां पतये नमः । तस्कराणां नमस्तुभ्यं
    पतये पापहारिणे ॥ ११॥ वञ्चते परिवञ्चते स्तायूनां पतये नमः । नमो निचेरवे तुभ्यं अरण्यानां पतये नमः ॥
    १२॥ उष्णीषिणे नमस्तुभ्यं नमस्ते परमात्मने । विस्तृताय नमस्तुभ्यं आसीनाय नमोनमः ॥ १३॥ शयनाय नम्स्तुभ्यं
    सुषुप्ताय नमो नमः । प्रबुद्धाय नमस्तुभ्यं स्थिराय परमात्मने ॥ १४॥ सभारूपाय ते नित्यं सभायाः पतये नमः
    । नमः शिवाय साम्बाय ब्रह्मणे सर्वसाक्षिणे ॥ १५॥ ॥ इति सूतसंहितायां मुक्तिकाण्डे सभापतिस्तुतिः सम्पूर्णम्
    ॥
