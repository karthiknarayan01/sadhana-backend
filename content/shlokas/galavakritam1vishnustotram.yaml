id: galavakritam1vishnustotram
category: stotram
name:
  english: galavakritam1vishnustotram
  devanagari: गालवकृतं१विष्णुस्तोत्रम्
content:
  english: galavakritam 1 vishnustotram galava uvaca | namo devadidevaya shankhacakragadabhrite | namo
    nityaya shuddhaya saccidanandarupine || 31|| namo bhaktartihantre te havyakavyasvarupine | namastrimurtaye
    tubhyam srishtisthityantakarine || 32|| namah pareshaya namo vibhumne namo'stu lakshmipataye vidhatre
    | namo'stu suryenduvilocanaya namo virincyadyabhivanditaya || 33|| yo namajatyadivikalpahinah samastadoshairapi
    varjito yah | samastasamsarabhayapaharine tasmai namo daityavinashanaya || 34|| vedantavedyaya rameshvaraya
    vaikunthavasaya vidhatripitre | namo namah satyajanartiharine narayanayamitavikramaya || 35|| namastubhyam
    bhagavate vasudevaya sharngine | bhuyo bhuyo namastubhyam sheshaparyankashayine || 36|| iti shriskandapurane
    brahmakhande setukhande tritiyadhyayantargatam galavakritam vishnustotram samaptam | skandapurana
    | brahmakhanda | setukhanda | adhyaya 3
  devanagari: गालवकृतं १ विष्णुस्तोत्रम् गालव उवाच । नमो देवादिदेवाय शङ्खचक्रगदाभृते । नमो नित्याय शुद्धाय
    सच्चिदानन्दरूपिणे ॥ ३१॥ नमो भक्तार्तिहन्त्रे ते हव्यकव्यस्वरूपिणे । नमस्त्रिमूर्तये तुभ्यं सृष्टिस्थित्यन्तकारिणे
    ॥ ३२॥ नमः परेशाय नमो विभूम्ने नमोऽस्तु लक्ष्मीपतये विधात्रे । नमोऽस्तु सूर्येन्दुविलोचनाय नमो विरिञ्च्याद्यभिवन्दिताय
    ॥ ३३॥ यो नामजात्यादिविकल्पहीनः समस्तदोषैरपि वर्जितो यः । समस्तसंसारभयापहारिणे तस्मै नमो दैत्यविनाशनाय
    ॥ ३४॥ वेदान्तवेद्याय रमेश्वराय वैकुण्ठवासाय विधातृपित्रे । नमो नमः सत्यजनार्तिहारिणे नारायणायामितविक्रमाय
    ॥ ३५॥ नमस्तुभ्यं भगवते वासुदेवाय शार्ङ्गिणे । भूयो भूयो नमस्तुभ्यं शेषपर्यङ्कशायिने ॥ ३६॥ इति श्रीस्कन्दपुराणे
    ब्रह्मखण्डे सेतुखण्डे तृतीयाध्यायान्तर्गतं गालवकृतं विष्णुस्तोत्रं समाप्तम् । स्कन्दपुराण । ब्राह्मखण्ड
    । सेतुखण्ड । अध्याय ३
meaning: {}
