id: paingala
category: upanishad
name:
  english: paingala
  devanagari: पैन्गल
content:
  english: paingalopanishat shuklayajurvediya samanya upanishat || paingalopanishadvedyam paramanandavigraham
    | paritah kalaye ramam paramaksharavaibhavam || om purnamadah purnamidam purnatpurnamudacyate | purnasya
    purnamadaya purnamevavashishyate || om shantih shantih shantih || atha ha painġalo yajnavalkyamupasametya
    dvadashavarshashushrushapurvakam paramarahasyakaivalyamanubruhiti papraccha | sa hovaca yajnnavalkyah
    sadeva somyedamagra asit | tannityamuktamavikriyam satyajnananandam paripurnam sanatanamekamevadvitiyam
    brahma | tasminmarushuktikasthanusphatikadau jalaraupyapurusharekhadivallohitashuklakrishnagunamayi
    gunasamyanirvacya mulaprakritirasit | tatpratibimbitam yattatsakshicaitanyamasit | sa punarvikritim
    prapya sattvodrikta'vyaktakhyavaranashaktirasit | tatpratibimbitam yattadishvaracaitanyamasit | sa
    svadhinamayah sarvajnah srishtisthitilayanamadikarta jagadankurarupo bhavati | svasminvilinam sakalam
    jagadavirbhavayati | pranikarmavashadesha pato yadvatprasaritah pranikarmakshayatpunastirobhavayati
    | tasminnevakhilam vishvam sankocitapatavadvartate | ishadhishthitavaranashaktito rajodrikta mahadakhya
    vikshepashaktirasit | tatpratibimbitam yattaddhiranyagarbhacaitanyamasit | sa mahattattvabhimani spashtaspashtavapurbhavati
    | hiranyagarbhadhishthitavikshepashaktitastamodriktahankarabhidha sthulashaktirasit | tatpratibimbitam
    yattadviratacaitanyamasit | sa tadabhimani spashtavapuh sarvasthulapalako vishnuh pradhanapurusho
    bhavati | tasmadatmana akashah sambhutah | akashadvayuh | vayoragnih | agnerapah | adbhyah prithivi
    | tani panca tanmatrani trigunani bhavanti | srashtukamo jagadyonistamogunamadhishthaya sukshmatanmatrani
    bhutani sthulikartum so'kamayata | srishteh parimitani bhutanyekamekam dvidha vidhaya punashcaturdha
    kritva svasvetaradvitiyamshaih pancadha samyojya pancikritabhutairanantakotibrahmandani tattadandocitagolakasthulashariranyasrijat
    | sa pancabhutanam rajomshamshcaturdha kritva bhagatrayatpancavrittyatmakam pranamasrijat | sa tesham
    turyabhagena karmendriyanyasrijat | sa tesham sattvamsham caturdha kritva bhagatrayasamashtitah pancakriyavrittyatmakamantahkaranamasrijat
    | sa tesham sattvaturiyabhagena jnanendriyanyasrijat | sattvasamashtita indriyapalakanasrijat | tani
    srishtanyande pracikshipat | tadajnaya samashtyandam vyapya tanyatishthan | tadajnayahankarasamanvito
    virat sthulanyarakshat | hiranyagarbhastadajnaya sukshmanyapalayat | andasthani tani tena vina spanditum
    ceshtitum va na shekuh | tani cetanikartum so'kamayata brahmandabrahmarandhrani samastavyashtimastakanvidarya
    tadevanupravishat | tada jadanyapi tani cetanavatsvakarmani cakrire | sarvajnesho mayaleshasamanvito
    vyashtideham pravishya taya mohito jivatvamagamat | shariratrayatadatmyatkartritvabhoktritvatamagamat
    | jagratsvapnasushuptimurcchamaranadharmayukto ghatiyantravadudvigno jato mrita iva kulalacakranyayena
    paribhramatiti || iti prathamo'dhyayah || 1|| atha paingalo yajnavalkyamuvaca sarvalokanam srishtisthityantakridvibhurishah
    katham jivatvamagamaditi | sa hovaca yajnavalkyah sthulasukshmakaranadehodbhavapurvakam jiveshvarasvarupam
    vivicya kathayamiti savadhanenaikagrataya shruyatam | ishah pancikritamahabhutaleshanadaya vyashtisamashtyatmakasthulasharirani
    yathakramamakarot | kapalacarmantrasthimamsanakhani prithivyamshah | raktamutralalasvedadikamavamshah
    | kshuttrishnoshnamohamaithunadya agnyamshah | pracaranottaranashvasadika vayvamshah | kamakrodhadayo
    vyomamshah | etatsanghatam karmani sancitam tvagadiyuktam balyadyavasthabhimanaspadam bahudopashrayam
    sthulashariram bhavati || athapancikritamahabhutarajomshabhagatrayasamashtitah pranamasrijat | pranapanavyanodanasamanah
    pranavrittayah | nagakurmakrikaradevadattadhananjaya upapranah | hridasananabhikanthasarvangani sthanani
    | akashadirajogunaturiyabhagena karmendriyamasrijat | vakpanipadapayupasthastadvrittayah | vacanadanagamanavisarganandastadvishayah
    || evam bhutasattvamshabhagatrayasamashtito'ntahkaranamasrijat | antahkaranamanobuddhicittahankarastadvrittayah
    | sankalpanishcayasmaranabhimananusandhanastadvishayah | galavadananabhihridayabhrumadhyam sthanam
    | bhutasatvaturiyabhagena jnanendriyamasrijat | shrotratvakcakshurjihvaghranastadvrittayah | shabdasparsharuparasagandhastadvishayah
    | digvatarkapraceto'shvivahnindropendramrityukah | candro vishnushcaturvaktrah shambhushca karanadhipah
    || athannamayapranamayamanomayavijnamayanandamayah panca koshah | annarasenaiva bhutvannarasenabhivriddhim
    prapyannarasamayaprithivyam yadviliyate so'nnamayakoshah | tadeva sthulashariram | karmendriyaih saha
    pranadipancakam pranamayakoshah | jnanendriyaih saha buddhirvijnanamayakoshah | etatkoshatrayam lingashariram
    | svarupajnanamanandamayakoshah | tatkaranashariram || atha jnanendriyapancakam karmendriyapancakam
    pranadipancakam viyadadipancakamantahkaranacatushtayam kamakarmatamamsyashtapuram || ishajnaya virajo
    vyashtideham pravishya buddhimadhishthaya vishvatvamagamat | vijnanatma cidabhaso vishvo vyavahariko
    jagratsthuladehabhimani karmabhuriti ca vishvasya nama bhavati | ishajnaya sutratma vyashtisukshmashariram
    pravishya mana adhishthaya taijasatvamagamat | taijasah pratibhasikah svapnakalpita iti taijasasya
    nama bhavati | ishajnaya mayopadhiravyaktasamanvito vyashtikaranashariram pravishya prajnatvamagamat
    | prajnovicchinnah paramarthikah sushuptyabhimaniti prajnasya nama bhavati | avyaktaleshajnanacchaditaparamarthikajivasya
    tattvamasyadivakyani brahmanaikatam jaguh netarayorvyavaharikapratibhasikayoh | antahkaranapratibimbitacaitanyam
    yattadevavasthatrayabhagbhavati | sa jagratsvapnasushuptyavasthah prapya ghatiyantravadudvigno jato
    mrita iva sthito bhavati | atha jagratsvapnasushuptimurcchamaranadyavasthah panca bhavanti || tattaddevatagrahanvitaih
    shrotradijnanendriyaih shabdyadyarthavishayagrahanajnanam jagradavastha bhavati | tatra bhrumadhyam
    gato jiva apadamastakam vyapya krishishravanadyakhilakriyakarta bhavati | tattatphalabhuk ca bhavati
    | lokantaragatah karmarjitaphalam sa eva bhunkte | sa sarvabhaumavadvyavaharacchranta antarbhavanam
    praveshtum margamashritya tishthati | karanoparame jagratsamskarotthaprabodhavadgrahyagrahakarupasphuranam
    svapnavastha bhavati | tatra vishva eva jagradvyavaharalopannadimadhyam caramstaijasatvamavapya vasanarupakam
    jagadvaicitryam svabhasa bhasayanyathepsitam svayam bhunkte || cittaikakarana sushuptyavastha bhavati
    | bhramavishrantashakunih pakshau samhritya nidabhimukham yatha gacchati tatha jivo'pi jagratsvapnaprapance
    vyavahritya shranto'jnanam pravishya svanandam bhunkte || akasmanmudgaradandadyaistaditavadbhayajnanabhyamindriyasangh
    ataih kampanniva mritatulya murccha bhavati | jagratsvapnasushuptimurcchavasthanamanya brahmadistambaparyantam
    sarvajivabhayaprada sthuladehavisarjani maranavastha bhavati | karmendriyani jnanendriyani tattadvishayanpranansamhritya
    kamakarmanvita avidyabhutaveshtito jivo dehantaram prapya lokantaram gacchati | prakkarmaphalapakenavartantarakitavadvishrantim
    naiva gacchati | satkarmaparipakato bahunam janmanamante nrinam moksheccha jayate | tada sadgurumashritya
    cirakalasevaya bandham moksham kashcitprayati | avicarakrito bandho vicaranmoksho bhavati | tasmatsada
    vicarayet | adhyaropapavadatah svarupam nishcayikartum shakyate | tasmatsada vicarayejjagajjivaparamatmano
    jivabhavajagadbhavabadhe pratyagabhinnam brahmaivavashishyata iti || iti dvitiyo'dhyayah || 2|| atha
    hainam paingalah prapaccha yajnavalkyam mahavakyavivaranamanubruhiti | sa hovaca yajnavalkyastattvamasi
    tvam tadasi tvam brahmasyaham brahmasmityanusandhanam kuryat | tatra parokshyashabalah sarvajnatvadilakshano
    mayopadhih saccidanandalakshano jagadyonistatpadavacyo bhavati | sa evantahkaranasambhinnabodho'smatpratyayavalambanastvampadavacyo
    bhavati | parajivopadhimayavidye vihaya tattvampadalakshyam pratyagabhinnam brahma | tattvamasityaham
    brahmasmiti vakyarthavicarah shravanam bhavati | ekantena shravanarthanusandhanam mananam bhavati
    | shravanamanananirvicikitse'rthe vastunyekatanavattaya cetahsthapanam nididhyasanam bhavati | dhyatridhyane
    vihaya nivatasthitadipavaddhyeyaikagocaram cittam samadhirbhavati | tadanimatmagocara vrittayah samutthita
    ajnata bhavanti | tah smaranadanumiyante | ihanadisamsare sancitah karmakotayo'nenaiva vilayam yanti
    | tatobhyasapatavatsahasrashah sadamritadhara varshati | tato yogavittamah samadhim dharmamegham prahuh
    | vasanajale nihsheshamamuna pravilapite karmasancaye punyapape samulonmulite prakparokshamapi karatalamalakavadvakyamapratibaddhaparokshasakshatkaram
    prasuyate | tada jivanmukto bhavati || ishah pancikritabhutanamapancikaranam kartum so'kamayata |
    brahmandatadgatalokankaryarupamshca karanatvam prapayitva tatah sukshmangam karmendriyani pranamshca
    jnanendriyanyantahkaranacatushtayam caikikritya sarvani bhautikani karane bhutapancake samyojya bhumim
    jale jalam vahnau vahnim vayau vayumakashe cakashamahankare cahankaram mahati mahadavyakte'vyaktam
    purushe kramena viliyate | viradddhiranyagarbheshvara upadhivilayatparamatmani liyante | pancikritamahabhutasambhavakarmasancitasthuladehah
    karmakshayatsatkarmaparipakato'pancikaranam prapya sukshmenaikibhutva karanarupatvamasadya tatkaranam
    kutasthe pratyagatmani viliyate | vishvataijasaprajnah svasvopadhilayatpratyagatmani liyante | andam
    jnanagnina dagdham karanaih saha paramatmani linam bhavati | tato brahmanah samahito bhutva tattvampadaikyameva
    sada kuryat | tato meghapayem'shumanivatmavirbhavati | dhyatva madhyasthamatmanam kalashantaradipavat
    | angushthamatramatmanamadhumajyotirupakam || 1|| prakashayantamantahstham dhyayetkutasthamavyayam
    | dhyayannaste munishcaiva casupteramritestu yah || 2|| jivanmuktah sa vijneyah sa dhanyah kritakrityavan
    | jivanmuktapadam tyaktva svadehe kalasatkrite | vishatyadehamuktatvam pavano'spandatamiva || 3||
    ashabdamasparshamarupamavyayam tatha rasam nityamagandhavacca yat | anadyanantam mahatah param dhruvam
    tadeva shishyatyamalam niramayam || 4|| iti || iti tritiyo'dhyayah || 3|| atha hainam paingalah prapaccha
    yajnavalkyam jnaninah kim karma ka ca sthitiriti | sa hovaca yajnavalkyah | amanitvadisampanno mumukshurekavimshatikulam
    tarayati | brahmavinmatrena kulamekottarashatam tarayati | atmanam rathinam viddhi shariram rathameva
    ca | buddhim tu sarathim viddhi manah pragrahameva ca || 1|| indriyani hayanahurvishayamsteshu gocaran
    | jangamani vimanani hridayani manishinah || 2|| atmendriyamanoyuktam bhoktetyahurmaharshayah | tato
    narayanah sakshaddhridaye supratishthitah || 3|| prarabdhakarmaparyantamahinirmokavadvyavaharati |
    candravaccarate dehi sa muktashcaniketanah || 4|| tirthe shvapacagrihe va tanum vihaya yati kaivalyam
    | prananavakirya yati kaivalyam || tam pashcaddigbalim kuryadathava khananam caret | pumsah pravrajanam
    proktam netaraya kadacana || 5|| nashaucam nagnikaryam ca na pindam nodakakriya | na kuryatparvanadini
    brahmabhutaya bhikshave || 6|| dagdhasya dahanam nasti pakvasya pacanam yatha | jnanagnidagdhadehasya
    na ca shraddham na ca kriya || 7|| yavaccopadhiparyantam tavacchushrushayedgurum | guruvadgurubharyayam
    tatputreshu ca vartanam || 8|| shuddhamanasah shuddhacidrupah sahishnuh so'hamasmi sahishnuh so'hamasmiti
    prapte jnanena vijnane jneye paramatmani hridi samsthite dehe labdhashantipadam gate tada prabhamanobuddhishunyam
    bhavati | amritena triptasya payasa kim prayojanam | evam svatmanam jnatva vedaih prayojanam kim bhavati
    | jnanamritatriptayogino na kincitkartavyamasti tadasti cenna sa tattvavidbhavati | durastho'pi na
    durasthah pindavarjitah pindastho'pi pratyagatma sarvavyapi bhavati | hridayam nirmalam kritva cintayitvapyanamayam
    | ahameva param sarvamiti pashyetparam sukham || 9|| yatha jale jalam kshiptam kshire kshiram ghrite
    ghritam | avishesho bhavettdvajjivatmaparamatmanoh || 10|| dehe jnanena dipite buddhirakhandakararupa
    yada bhavati tada vidvanbrahmajnanagnina karmabandham nirdahet | tatah pavitram parameshvarakhyamadvaitarupam
    vimalambarabham | yathodake toyamanupravishtam tathatmarupo nirupadhisamsthitah || 11|| akashavatsukshmasharira
    atma na drishyate vayuvadantaratma | sa bahyamabhyantaranishcalatma jnanolkayapashyati cantaratma
    || 12|| yatrayatra mrito jnani yena va kena mrityuna | yatha sarvagatam vyoma tatratatra layam gatah
    || 13|| ghatakashamivatmanam vilayam vetti tattvatah | sa gacchati niralambam jnanalokam samantatah
    || 14|| tapedvarshasahasrani ekapadasthito narah | etasya dhyanayogasya kalam narhati shodashim ||
    15|| idam jnanamidam jneyam tatsarvam jnatumicchati | | api varshasahasrayuh shastrantam nadhigacchati
    || 16|| vijneyo'ksharatanmatro jivitam vapi cancalam | vihaya shastrajalani yatsatyam tadupasatam
    || 17|| anantakarmashaucam ca japo yajnastathaiva ca | tirthayatrabhigamanam yavattattvam na vindati
    || 18|| aham brahmeti niyatam mokshaheturmahatmanam | dve pade bandhamokshaya na mameti mameti ca
    || 19|| mameti badhyate janturnirmameti vimucyate | manaso hyunmani bhave dvaitam naivopalabhyate
    || 20|| yada yatyunmanibhavastada tatparamam padam | yatrayatra mano yati tatratatra param padam ||
    21|| tatratatra param brahma sarvatra samavasthitam | hanyanmushtibhirakasham kshudhartah khandayettusham
    || 22|| naham brahmeti janati tasya muktirna jayate | ya etadupanishadam nityamadhite so'gniputo bhavati
    | sa vayuputo bhavati | sa adityaputo bhavati | sa brahmaputo bhavati | sa vishnuputo bhavati | sa
    rudraputo bhavati | sa sarveshu tirtheshu snato bhavati | sa sarveshu vedeshvadhito bhavati | sa sarvavedavratacaryasu
    carito bhavati | tenetihasapurananam rudranam shatasahasrani japtani phalani bhavanti | pranavanamayutam
    japtam bhavati | dasha purvandashottaranpunati | sa panktipavano bhavati | sa mahanbhavati | brahmahatyasurapanasvarnasteyagurutalpagamanatatsamyogipatakebhya
    h puto bhavati | tadvishnoh paramam padam sada pashyanti surayah | diviva cakshuratatam || tadvipraso
    vipanyavo jagrivamsah samindhate | vishnoryatparamam padam || om satyamityupanishat || om purnamada
    iti shantih || iti paingalopanishtsamapta ||
  devanagari: पैङ्गलोपनिषत् शुक्लयजुर्वेदीय सामान्य उपनिषत् ॥ पैङ्गलोपनिषद्वेद्यं परमानन्दविग्रहम् । परितः
    कलये रामं परमाक्षरवैभवम् ॥ ॐ पूर्णमदः पूर्णमिदं पूर्णात्पूर्णमुदच्यते । पूर्णस्य पूर्णमादाय पूर्णमेवावशिष्यते
    ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ अथ ह पैङ्ग़लो याज्ञवल्क्यमुपसमेत्य द्वादशवर्शशुश्रूषापूर्वकं परमरहस्यकैवल्यमनुब्रूहीति
    पप्रच्छ । स होवाच याज्ञ्नवल्क्यः सदेव सोम्येदमग्र आसीत् । तन्नित्यमुक्तमविक्रियं सत्यज्ञानानन्दं परिपूर्णं
    सनातनमेकमेवाद्वितीयं ब्रह्म । तस्मिन्मरुशुक्तिकास्थाणुस्फटिकादौ जलरौप्यपुरुषरेखादिवल्लोहितशुक्लकृष्णगुणमयी
    गुणसाम्यानिर्वाच्या मूलप्रकृतिरासीत् । तत्प्रतिबिम्बितं यत्तत्साक्षिचैतन्यमासीत् । सा पुनर्विकृतिं
    प्राप्य सत्त्वोद्रिक्ताऽव्यक्ताख्यावरणशक्तिरासीत् । तत्प्रतिबिम्बितं यत्तदीश्वरचैतन्यमासीत् । स स्वाधीनमायः
    सर्वज्ञः सृष्टिस्थितिलयानामादिकर्ता जगदङ्कुररूपो भवति । स्वस्मिन्विलीनं सकलं जगदाविर्भावयति । प्राणिकर्मवशादेष
    पटो यद्वत्प्रसारितः प्राणिकर्मक्षयात्पुनस्तिरोभावयति । तस्मिन्नेवाखिलं विश्वं सङ्कोचितपटवद्वर्तते
    । ईशाधिष्ठितावरणशक्तितो रजोद्रिक्ता महदाख्या विक्षेपशक्तिरासीत् । तत्प्रतिबिम्बितं यत्तद्धिरण्यगर्भचैतन्यमासीत्
    । स महत्तत्त्वाभिमानी स्पष्टास्पष्टवपुर्भवति । हिरण्यगर्भाधिष्ठितविक्षेपशक्तितस्तमोद्रिक्ताहङ्काराभिधा
    स्थूलशक्तिरासीत् । तत्प्रतिबिम्बितं यत्तद्विराटचैतन्यमासीत् । स तदभिमानी स्पष्टवपुः सर्वस्थूलपालको
    विष्णुः प्रधानपुरुषो भवति । तस्मादात्मन आकाशः सम्भूतः । आकाशाद्वायुः । वायोरग्निः । अग्नेरापः । अद्भ्यः
    पृथिवी । तानि पञ्च तन्मात्राणि त्रिगुणानि भवन्ति । स्रष्टुकामो जगद्योनिस्तमोगुणमधिष्ठाय सूक्ष्मतन्मात्राणि
    भूतानि स्थूलीकर्तुं सोऽकामयत । सृष्टेः परिमितानि भूतान्येकमेकं द्विधा विधाय पुनश्चतुर्धा कृत्वा स्वस्वेतरद्वितीयांशैः
    पञ्चधा संयोज्य पञ्चीकृतभूतैरनन्तकोटिब्रह्माण्डानि तत्तदण्डोचितगोलकस्थूलशरीराण्यसृजत् । स पञ्चभूतानां
    रजोंशांश्चतुर्धा कृत्वा भागत्रयात्पञ्चवृत्त्यात्मकं प्राणमसृजत् । स तेषां तुर्यभागेन कर्मेन्द्रियाण्यसृजत्
    । स तेषां सत्त्वांशं चतुर्धा कृत्वा भागत्रयसमष्टितः पञ्चक्रियावृत्त्यात्मकमन्तःकरणमसृजत् । स तेषां
    सत्त्वतुरीयभागेन ज्ञानेन्द्रियाण्यसृजत् । सत्त्वसमष्टित इन्द्रियपालकानसृजत् । तानि सृष्टान्यण्डे प्राचिक्षिपत्
    । तदाज्ञया समष्ट्यण्डं व्याप्य तान्यतिष्ठन् । तदाज्ञयाहङ्कारसमन्वितो विराट् स्थूलान्यरक्षत् । हिरण्यगर्भस्तदाज्ञया
    सूक्ष्माण्यपालयत् । अण्डस्थानि तानि तेन विना स्पन्दितुं चेष्टितुं वा न शेकुः । तानि चेतनीकर्तुं सोऽकामयत
    ब्रह्माण्डब्रह्मरन्ध्राणि समस्तव्यष्टिमस्तकान्विदार्य तदेवानुप्राविशत् । तदा जडान्यपि तानि चेतनवत्स्वकर्माणि
    चक्रिरे । सर्वज्ञेशो मायालेशसमन्वितो व्यष्टिदेहं प्रविश्य तया मोहितो जीवत्वमगमत् । शरीरत्रयतादात्म्यात्कर्तृत्वभोक्तृत्वतामगमत्
    । जाग्रत्स्वप्नसुषुप्तिमूर्च्छामरणधर्मयुक्तो घटीयन्त्रवदुद्विग्नो जातो मृत इव कुलालचक्रन्यायेन परिभ्रमतीति
    ॥ इति प्रथमोऽध्यायः ॥ १॥ अथ पैङ्गलो याज्ञवल्क्यमुवाच सर्वलोकानां सृष्टिस्थित्यन्तकृद्विभूरीशः कथं
    जीवत्वमगमदिति । स होवाच याज्ञवल्क्यः स्थूलसूक्ष्मकारणदेहोद्भवपूर्वकं जीवेश्वरस्वरूपं विविच्य कथयामीति
    सावधानेनैकाग्रतया श्रूयताम् । ईशः पञ्चीकृतमहाभूतलेशानादाय व्यष्टिसमष्ट्यात्मकस्थूलशरीराणि यथाक्रममकरोत्
    । कपालचर्मान्त्रास्थिमांसनखानि पृथिव्यंशाः । रक्तमूत्रलालास्वेदादिकमवंशाः । क्षुत्तृष्णोष्णमोहमैथुनाद्या
    अग्न्यंशाः । प्रचारणोत्तारणश्वासादिका वाय्वंशाः । कामक्रोधादयो व्योमांशाः । एतत्सङ्घातं कर्मणि सञ्चितं
    त्वगादियुक्तं बाल्याद्यवस्थाभिमानास्पदं बहुदोपाश्रयं स्थूलशरीरं भवति ॥ अथापञ्चीकृतमहाभूतरजोंशभागत्रयसमष्टितः
    प्राणमसृजत् । प्राणापानव्यानोदानसमानाः प्राणवृत्तयः । नागकूर्मकृकरदेवदत्तधनञ्जया उपप्राणाः । हृदासननाभिकण्ठसर्वाङ्गानि
    स्थानानि । आकाशादिरजोगुणतुरीयभागेन कर्मेन्द्रियमसृजत् । वाक्पाणिपादपायूपास्थास्तद्वृत्तयः । वचनादानगमनविसर्गानन्दास्तद्विषयाः
    ॥ एवं भूतसत्त्वांशभागत्रयसमष्टितोऽन्तःकरणमसृजत् । अन्तःकरणमनोबुद्धिचित्ताहङ्कारास्तद्वृत्तयः । सङ्कल्पनिश्चयस्मरणाभिमानानुसन्धानास्तद्विषयाः
    । गलवदननाभिहृदयभ्रूमध्यं स्थानम् । भूतसत्वतुरीयभागेन ज्ञानेन्द्रियमसृजत् । श्रोत्रत्वक्चक्षुर्जिह्वाघ्राणास्तद्वृत्तयः
    । शब्दस्पर्शरूपरसगन्धास्तद्विषयाः । दिग्वातार्कप्रचेतोऽश्विवह्नीन्द्रोपेन्द्रमृत्युकाः । चन्द्रो विष्णुश्चतुर्वक्त्रः
    शम्भुश्च कारणाधिपाः ॥ अथान्नमयप्राणमयमनोमयविज्ञामयानन्दमयाः पञ्च कोशाः । अन्नरसेनैव भूत्वान्नरसेनाभिवृद्धिं
    प्राप्यान्नरसमयपृथिव्यां यद्विलीयते सोऽन्नमयकोशः । तदेव स्थूलशरीरम् । कर्मेन्द्रियैः सह प्राणादिपञ्चकं
    प्राणमयकोशः । ज्ञानेन्द्रियैः सह बुद्धिर्विज्ञानमयकोशः । एतत्कोशत्रयं लिङ्गशरीरम् । स्वरूपाज्ञानमानन्दमयकोशः
    । तत्कारणशरीरम् ॥ अथ ज्ञानेन्द्रियपञ्चकं कर्मेन्द्रियपञ्चकं प्राणादिपञ्चकं वियदादिपञ्चकमन्तःकरणचतुष्टयं
    कामकर्मतमांस्यष्टपुरम् ॥ इशाज्ञया विराजो व्यष्टिदेहं प्रविश्य बुद्धिमधिष्ठाय विश्वत्वमगमत् । विज्ञानात्मा
    चिदाभासो विश्वो व्यावहारिको जाग्रत्स्थूलदेहाभिमानी कर्मभूरिति च विश्वस्य नाम भवति । ईशाज्ञया सूत्रात्मा
    व्यष्टिसूक्ष्मशरीरं प्रविश्य मन अधिष्ठाय तैजसत्वमगमत् । तैजसः प्रातिभासिकः स्वप्नकल्पित इति तैजसस्य
    नाम भवति । ईशाज्ञया मायोपाधिरव्यक्तसमन्वितो व्यष्टिकारणशरीरं प्रविश्य प्राज्ञत्वमगमत् । प्राज्ञोविच्छिन्नः
    पारमार्थिकः सुषुप्त्यभिमानीति प्राज्ञस्य नाम भवति । अव्यक्तलेशाज्ञानाच्छादितपारमार्थिकजीवस्य तत्त्वमस्यादिवाक्यानि
    ब्रह्मणैकतां जगुः नेतरयोर्व्यावहारिकप्रातिभासिकयोः । अन्तःकरणप्रतिबिम्बितचैतन्यं यत्तदेवावस्थात्रयभाग्भवति
    । स जाग्रत्स्वप्नसुषुप्त्यवस्थाः प्राप्य घटीयन्त्रवदुद्विग्नो जातो मृत इव स्थितो भवति । अथ जाग्रत्स्वप्नसुषुप्तिमूर्च्छामरणाद्यवस्थाः
    पञ्च भवन्ति ॥ तत्तद्देवताग्रहान्वितैः श्रोत्रादिज्ञानेन्द्रियैः शब्द्याद्यर्थविषयग्रहणज्ञानं जाग्रदवस्था
    भवति । तत्र भ्रूमध्यं गतो जीव आपादमस्तकं व्याप्य कृषिश्रवणाद्यखिलक्रियाकर्ता भवति । तत्तत्फलभुक् च
    भवति । लोकान्तरगतः कर्मार्जितफलं स एव भुङ्क्ते । स सार्वभौमवद्व्यवहाराच्छ्रान्त अन्तर्भवनं प्रवेष्टुं
    मार्गमाश्रित्य तिष्ठति । करणोपरमे जाग्रत्संस्कारोत्थप्रबोधवद्ग्राह्यग्राहकरूपस्फुरणं स्वप्नावस्था
    भवति । तत्र विश्व एव जाग्रद्व्यवहारलोपान्नाडीमध्यं चरंस्तैजसत्वमवाप्य वासनारूपकं जगद्वैचित्र्यं स्वभासा
    भासयन्यथेप्सितं स्वयं भुङ्क्ते ॥ चित्तैककरणा सुषुप्त्यवस्था भवति । भ्रमविश्रान्तशकुनिः पक्षौ संहृत्य
    नीडाभिमुखं यथा गच्छति तथा जीवोऽपि जाग्रत्स्वप्नप्रपञ्चे व्यवहृत्य श्रान्तोऽज्ञानं प्रविश्य स्वानन्दं
    भुङ्क्ते ॥ अकस्मान्मुद्गरदण्डाद्यैस्ताडितवद्भयाज्ञानाभ्यामिन्द्रियसङ्घ् आतैः कम्पन्निव मृततुल्या मूर्च्छा
    भवति । जाग्रत्स्वप्नसुषुप्तिमूर्च्छावस्थानामन्या ब्रह्मादिस्तम्बपर्यन्तं सर्वजीवभयप्रदा स्थूलदेहविसर्जनी
    मरणावस्था भवति । कर्मेन्द्रियाणि ज्ञानेन्द्रियाणि तत्तद्विषयान्प्राणान्संहृत्य कामकर्मान्वित अविद्याभूतवेष्टितो
    जीवो देहान्तरं प्राप्य लोकान्तरं गच्छति । प्राक्कर्मफलपाकेनावर्तान्तरकीटवद्विश्रान्तिं नैव गच्छति
    । सत्कर्मपरिपाकतो बहूनां जन्मनामन्ते नृणां मोक्षेच्छा जायते । तदा सद्गुरुमाश्रित्य चिरकालसेवया बन्धं
    मोक्षं कश्चित्प्रयाति । अविचारकृतो बन्धो विचारान्मोक्षो भवति । तस्मात्सदा विचारयेत् । अध्यारोपापवादतः
    स्वरूपं निश्चयीकर्तुं शक्यते । तस्मात्सदा विचारयेज्जगज्जीवपरमात्मनो जीवभावजगद्भावबाधे प्रत्यगभिन्नं
    ब्रह्मैवावशिष्यत इति ॥ इति द्वितीयोऽध्यायः ॥ २॥ अथ हैनं पैङ्गलः प्रपच्छ याज्ञवल्क्यं महावाक्यविवरणमनुब्रूहीति
    । स होवाच याज्ञवल्क्यस्तत्त्वमसि त्वं तदसि त्वं ब्रह्मास्यहं ब्रह्मास्मीत्यनुसन्धानं कुर्यात् । तत्र
    पारोक्ष्यशबलः सर्वज्ञत्वादिलक्षणो मायोपाधिः सच्चिदानन्दलक्षणो जगद्योनिस्तत्पदवाच्यो भवति । स एवान्तःकरणसम्भिन्नबोधोऽस्मत्प्रत्ययावलम्बनस्त्वम्पदवाच्यो
    भवति । परजीवोपाधिमायाविद्ये विहाय तत्त्वंपदलक्ष्यं प्रत्यगभिन्नं ब्रह्म । तत्त्वमसीत्यहं ब्रह्मास्मीति
    वाक्यार्थविचारः श्रवणं भवति । एकान्तेन श्रवणार्थानुसन्धानं मननं भवति । श्रवणमनननिर्विचिकित्सेऽर्थे
    वस्तुन्येकतानवत्तया चेतःस्थापनं निदिध्यासनं भवति । ध्यातृध्याने विहाय निवातस्थितदीपवद्ध्येयैकगोचरं
    चित्तं समाधिर्भवति । तदानीमात्मगोचरा वृत्तयः समुत्थिता अज्ञाता भवन्ति । ताः स्मरणादनुमीयन्ते । इहानादिसंसारे
    सञ्चिताः कर्मकोटयोऽनेनैव विलयं यान्ति । ततोभ्यासपाटवात्सहस्रशः सदामृतधारा वर्षति । ततो योगवित्तमाः
    समाधिं धर्ममेघं प्राहुः । वासनाजाले निःशेषममुना प्रविलापिते कर्मसञ्चये पुण्यपापे समूलोन्मूलिते प्राक्परोक्षमपि
    करतलामलकवद्वाक्यमप्रतिबद्धापरोक्षसाक्षात्कारं प्रसूयते । तदा जीवन्मुक्तो भवति ॥ ईशः पञ्चीकृतभूतानामपञ्चीकरणं
    कर्तुं सोऽकामयत । ब्रह्माण्डतद्गतलोकान्कार्यरूपांश्च कारणत्वं प्रापयित्वा ततः सूक्ष्माङ्गं कर्मेन्द्रियाणि
    प्राणांश्च ज्ञानेन्द्रियाण्यन्तःकरणचतुष्टयं चैकीकृत्य सर्वाणि भौतिकानि कारणे भूतपञ्चके संयोज्य भूमिं
    जले जलं वह्नौ वह्निं वायौ वायुमाकाशे चाकाशमहङ्कारे चाहङ्कारं महति महदव्यक्तेऽव्यक्तं पुरुषे क्रमेण
    विलीयते । विराद्ड्ढिरण्यगर्भेश्वरा उपाधिविलयात्परमात्मनि लीयन्ते । पञ्चीकृतमहाभूतसम्भवकर्मसञ्चितस्थूलदेहः
    कर्मक्षयात्सत्कर्मपरिपाकतोऽपञ्चीकरणं प्राप्य सूक्ष्मेणैकीभूत्वा कारणरूपत्वमासाद्य तत्कारणं कूटस्थे
    प्रत्यगात्मनि विलीयते । विश्वतैजसप्राज्ञाः स्वस्वोपाधिलयात्प्रत्यगात्मनि लीयन्ते । अण्डं ज्ञानाग्निना
    दग्धं कारणैः सह परमात्मनि लीनं भवति । ततो ब्राह्मणः समाहितो भूत्वा तत्त्वंपदैक्यमेव सदा कुर्यात् ।
    ततो मेघापायेंऽशुमानिवात्माविर्भवति । ध्यात्वा मध्यस्थमात्मानं कलशान्तरदीपवत् । अङ्गुष्ठमात्रमात्मानमधूमज्योतिरूपकम्
    ॥ १॥ प्रकाशयन्तमन्तःस्थं ध्यायेत्कूटस्थमव्ययम् । ध्यायन्नास्ते मुनिश्चैव चासुप्तेरामृतेस्तु यः ॥ २॥
    जीवन्मुक्तः स विज्ञेयः स धन्यः कृतकृत्यवान् । जीवन्मुक्तपदं त्यक्त्वा स्वदेहे कालसात्कृते । विशत्यदेहमुक्तत्वं
    पवनोऽस्पन्दतामिव ॥ ३॥ अशब्दमस्पर्शमरूपमव्ययं तथा रसं नित्यमगन्धवच्च यत् । अनाद्यनन्तं महतः परं ध्रुवं
    तदेव शिष्यत्यमलं निरामयम् ॥ ४॥ इति ॥ इति तृतीयोऽध्यायः ॥ ३॥ अथ हैनं पैङ्गलः प्रपच्छ याज्ञवल्क्यं ज्ञानिनः
    किं कर्म का च स्थितिरिति । स होवाच याज्ञवल्क्यः । अमानित्वादिसम्पन्नो मुमुक्षुरेकविंशतिकुलं तारयति
    । ब्रह्मविन्मात्रेण कुलमेकोत्तरशतं तारयति । आत्मानं रथिनं विद्धि शरीरं रथमेव च । बुद्धिं तु सारथिं
    विद्धि मनः प्रग्रहमेव च ॥ १॥ इन्द्रियाणि हयानाहुर्विषयांस्तेषु गोचरान् । जङ्गमानि विमानानि हृदयानि
    मनीषिणः ॥ २॥ आत्मेन्द्रियमनोयुक्तं भोक्तेत्याहुर्महर्षयः । ततो नारायणः साक्षाद्धृदये सुप्रतिष्ठितः
    ॥ ३॥ प्रारब्धकर्मपर्यन्तमहिनिर्मोकवद्व्यवहरति । चन्द्रवच्चरते देही स मुक्तश्चानिकेतनः ॥ ४॥ तीर्थे
    श्वपचगृहे वा तनुं विहाय याति कैवल्यम् । प्राणानवकीर्य याति कैवल्यम् ॥ तं पश्चाद्दिग्बलिं कुर्यादथवा
    खननं चरेत् । पुंसः प्रव्रजनं प्रोक्तं नेतराय कदाचन ॥ ५॥ नाशौचं नाग्निकार्यं च न पिण्डं नोदकक्रिया
    । न कुर्यात्पार्वणादीनि ब्रह्मभूताय भिक्षवे ॥ ६॥ दग्धस्य दहनं नास्ति पक्वस्य पचनं यथा । ज्ञानाग्निदग्धदेहस्य
    न च श्राद्धं न च क्रिया ॥ ७॥ यावच्चोपाधिपर्यन्तं तावच्छुश्रूषयेद्गुरुम् । गुरुवद्गुरुभार्यायां तत्पुत्रेषु
    च वर्तनम् ॥ ८॥ शुद्धमानसः शुद्धचिद्रूपः सहिष्णुः सोऽहमस्मि सहिष्णुः सोऽहमस्मीति प्राप्ते ज्ञानेन विज्ञाने
    ज्ञेये परमात्मनि हृदि संस्थिते देहे लब्धशान्तिपदं गते तदा प्रभामनोबुद्धिशून्यं भवति । अमृतेन तृप्तस्य
    पयसा किं प्रयोजनम् । एवं स्वात्मानं ज्ञात्वा वेदैः प्रयोजनं किं भवति । ज्ञानामृततृप्तयोगिनो न किञ्चित्कर्तव्यमस्ति
    तदस्ति चेन्न स तत्त्वविद्भवति । दूरस्थोऽपि न दूरस्थः पिण्डवर्जितः पिण्डस्थोऽपि प्रत्यगात्मा सर्वव्यापी
    भवति । हृदयं निर्मलं कृत्वा चिन्तयित्वाप्यनामयम् । अहमेव परं सर्वमिति पश्येत्परं सुखम् ॥ ९॥ यथा जले
    जलं क्षिप्तं क्षीरे क्षीरं घृते घृतम् । अविशेषो भवेत्त्द्वज्जिवात्मपरमात्मनोः ॥ १०॥ देहे ज्ञानेन दीपिते
    बुद्धिरखण्डाकाररूपा यदा भवति तदा विद्वान्ब्रह्मज्ञानाग्निना कर्मबन्धं निर्दहेत् । ततः पवित्रं परमेश्वराख्यमद्वैतरूपं
    विमलाम्बराभम् । यथोदके तोयमनुप्रविष्टं तथात्मरूपो निरुपाधिसंस्थितः ॥ ११॥ आकाशवत्सूक्ष्मशरीर आत्मा
    न दृश्यते वायुवदन्तरात्मा । स बाह्यमभ्यन्तरनिश्चलात्मा ज्ञानोल्कयापश्यति चान्तरात्मा ॥ १२॥ यत्रयत्र
    मृतो ज्ञानी येन वा केन मृत्युना । यथा सर्वगतं व्योम तत्रतत्र लयं गतः ॥ १३॥ घटाकाशमिवात्मानं विलयं
    वेत्ति तत्त्वतः । स गच्छति निरालम्बं ज्ञानालोकं समन्ततः ॥ १४॥ तपेद्वर्षसहस्राणि एकपादस्थितो नरः ।
    एतस्य ध्यानयोगस्य कलां नार्हति षोडशीम् ॥ १५॥ इदं ज्ञानमिदं ज्ञेयं तत्सर्वं ज्ञातुमिच्छति । । अपि वर्षसहस्रायुः
    शास्त्रान्तं नाधिगच्छति ॥ १६॥ विज्ञेयोऽक्षरतन्मात्रो जीवितं वापि चञ्चलम् । विहाय शास्त्रजालानि यत्सत्यं
    तदुपासताम् ॥ १७॥ अनन्तकर्मशौचं च जपो यज्ञस्तथैव च । तीर्थयात्राभिगमनं यावत्तत्त्वं न विन्दति ॥ १८॥
    अहं ब्रह्मेति नियतं मोक्षहेतुर्महात्मनाम् । द्वे पदे बन्धमोक्षाय न ममेति ममेति च ॥ १९॥ ममेति बध्यते
    जन्तुर्निर्ममेति विमुच्यते । मनसो ह्युन्मनी भावे द्वैतं नैवोपलभ्यते ॥ २०॥ यदा यात्युन्मनीभावस्तदा
    तत्परमं पदम् । यत्रयत्र मनो याति तत्रतत्र परं पदम् ॥ २१॥ तत्रतत्र परं ब्रह्म सर्वत्र समवस्थितम् ।
    हन्यान्मुष्टिभिराकाशं क्षुधार्तः खण्डयेत्तुषम् ॥ २२॥ नाहं ब्रह्मेति जानाति तस्य मुक्तिर्न जायते ।
    य एतदुपनिषदं नित्यमधीते सोऽग्निपूतो भवति । स वायुपूतो भवति । स आदित्यपूतो भवति । स ब्रह्मपूतो भवति
    । स विष्णुपूतो भवति । स रुद्रपूतो भवति । स सर्वेषु तीर्थेषु स्नातो भवति । स सर्वेषु वेदेष्वधीतो भवति
    । स सर्ववेदव्रतचर्यासु चरितो भवति । तेनेतिहासपुराणानां रुद्राणां शतसहस्राणि जप्तानि फलानि भवन्ति ।
    प्रणवानामयुतं जप्तं भवति । दश पूर्वान्दशोत्तरान्पुनाति । स पङ्क्तिपावनो भवति । स महान्भवति । ब्रह्महत्यासुरापानस्वर्णस्तेयगुरुतल्पगमनतत्संयोगिपातकेभ्य
    ः पूतो भवति । तद्विष्णोः परमं पदं सदा पश्यन्ति सूरयः । दिवीव चक्षुराततम् ॥ तद्विप्रासो विपन्यवो जागृवांसः
    समिन्धते । विष्णोर्यत्परमं पदम् ॥ ॐ सत्यमित्युपनिषत् ॥ ॐ पूर्णामद इति शान्तिः ॥ इति पैङ्गलोपनिष्त्समाप्ता
    ॥
