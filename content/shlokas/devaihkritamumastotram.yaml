id: devaihkritamumastotram
category: stotram
name:
  english: devaihkritamumastotram
  devanagari: देवैःकृतंउमास्तोत्रम्
content:
  english: 30|| gayatri tvam vedamata tvam savitri sarasvati || 70|| tvam varta sarvajagatam tvam trayi
    dharmarupini || 31|| nidra tvam sarvabhuteshu kshudha triptistvameva hi | trishna kantishchavistushtissarvanandakari
    sada || 32|| tvam lakshmih punyakartrinam tvam jyeshtha papinam sada | tvam shantih sarvajagatam tvam
    dhatri pranaposhini || 33|| tvamantahsvarupa bhutanam pancanamapi sarakrit | tvam hi nitibhritam nitirvyavasayasvarupini
    || 34|| gitistvam samavedasya granthistvam yajusham hutih | rigvedasya tatha matratharvanasya para
    gatih || 35|| samastagirvanaganasya shaktistamomayi dhatrigunaikadrishya | rajah prapancattu bhavaikarupa
    ya na shruta bhavyakari stuteha || 36|| samsarasagarakaralabhavangaduhkhanistarakaritaranishca nivitahina
    | ashtangayogaparipalanakelidaksham vindhyagavasaniratam pranamama tam vai || 37|| nasakshivaktrabhujavakshasi
    manase ca dhritya sukhani vitanoshi sadaiva jantoh | nidreti yati subhaga jagati bhava nah sa nah
    prasidatu bhavasthitipalanaya || 38|| iti shivapurane rudrasamhitayam parvatikhande tritiyadhyayantargatam
    devaih kritam umastotram samapatam | shivapurana | rudrasamhita | parvatikhanda | adhyaya 3
  devanagari: ३०॥ गायत्री त्वं वेदमाता त्वं सावित्री सरस्वती ॥ ७०॥ त्वं वार्ता सर्वजगतां त्वं त्रयी धर्मरूपिणी
    ॥ ३१॥ निद्रा त्वं सर्वभूतेषु क्षुधा तृप्तिस्त्वमेव हि । तृष्णा कान्तिश्छविस्तुष्टिस्सर्वानन्दकरी सदा
    ॥ ३२॥ त्वं लक्ष्मीः पुण्यकर्तॄणां त्वं ज्येष्ठा पापिनां सदा । त्वं शान्तिः सर्वजगतां त्वं धात्री प्राणपोषिणी
    ॥ ३३॥ त्वमन्तःस्वरूपा भूतानां पञ्चानामपि सारकृत् । त्वं हि नीतिभृतां नीतिर्व्यवसायस्वरूपिणी ॥ ३४॥
    गीतिस्त्वं सामवेदस्य ग्रन्थिस्त्वं यजुषां हुतिः । ऋग्वेदस्य तथा मात्राथर्वणस्य परा गतिः ॥ ३५॥ समस्तगीर्वाणगणस्य
    शक्तिस्तमोमयी धातृगुणैकदृश्या । रजः प्रपञ्चात्तु भवैकरूपा या न श्रुता भव्यकरी स्तुतेह ॥ ३६॥ संसारसागरकरालभवाङ्गदुःखनिस्तारकारितरणिश्च
    निवीतहीना । अष्टाङ्गयोगपरिपालनकेलिदक्षां विन्ध्यागवासनिरतां प्रणमाम तां वै ॥ ३७॥ नासाक्षिवक्त्रभुजवक्षसि
    मानसे च धृत्या सुखानि वितनोषि सदैव जन्तोः । निद्रेति याति सुभगा जगती भवा नः सा नः प्रसीदतु भवस्थितिपालनाय
    ॥ ३८॥ इति शिवपुराणे रुद्रसंहितायां पार्वतीखण्डे तृतीयाध्यायान्तर्गतं देवैः कृतं उमास्तोत्रं समापतम्
    । शिवपुराण । रुद्रसंहिता । पार्वतीखण्ड । अध्याय ३
