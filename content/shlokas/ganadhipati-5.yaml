id: ganadhipati-5
category: stotram
name:
  english: ganadhipati 5
  devanagari: गणाधिपति ५
content:
  english: shriganadhipati pancaratnastotram om saragilokadurlabham viragilokapujitam surasurairnamaskritam
    jarapamrityunashakam | gira gurum shriya harim jayanti yatpadarcakah namami tam ganadhipam kripapayah
    payonidhim || 1|| girindrajamukhambuja pramodadana bhaskaram karindravaktramanataghasanghavaranodyatam
    | sarisripesha baddhakukshimashrayami santatam sharirakanti nirjitabjabandhubalasantatim || 2|| shukadimaunivanditam
    gakaravacyamaksharam prakamamishtadayinam sakamanamrapanktaye | cakasatam caturbhujaih vikasipadmapujitam
    prakashitatmatatvakam namamyaham ganadhipam || 3|| naradhipatvadayakam svaradilokanayakam jvaradirogavarakam
    nirakritasuravrajam | karambujollasatsrinim vikarashunyamanasaih hridasadavibhavitam muda namami vighnapam
    || 4|| shramapanodanakshamam samahitantaratmanam sumadibhih sadarcitam kshamanidhim ganadhipam | ramadhavadipujitam
    yamantakatmasambhavam shamadishadgunapradam namami tam vibhutaye || 5|| ganadhipasya pancakam nrinamabhishtadayakam
    pranamapurvakam janah pathanti ye mudayutah | bhavanti te vidam purah pragitavaibhavajavat cirayusho'dhikah
    shriyassusunavo na samshayah || om || || iti dakshinamnaya shringeri shrisharadapithadhipati shankaracarya
    jagadguruvaryo shri saccidananda shivabhinava nrisimhabharati mahasvamibhih viracitam shri ganadhipati
    pancaratna stotram sampurnam ||
  devanagari: श्रीगणाधिपति पञ्चरत्नस्तोत्रम् ॐ सरागिलोकदुर्लभं विरागिलोकपूजितं सुरासुरैर्नमस्कृतं जरापमृत्युनाशकम्
    । गिरा गुरुं श्रिया हरिं जयन्ति यत्पदार्चकाः नमामि तं गणाधिपं कृपापयः पयोनिधिम् ॥ १॥ गिरीन्द्रजामुखाम्बुज
    प्रमोददान भास्करं करीन्द्रवक्त्रमानताघसङ्घवारणोद्यतम् । सरीसृपेश बद्धकुक्षिमाश्रयामि सन्ततं शरीरकान्ति
    निर्जिताब्जबन्धुबालसन्ततिम् ॥ २॥ शुकादिमौनिवन्दितं गकारवाच्यमक्षरं प्रकाममिष्टदायिनं सकामनम्रपङ्क्तये
    । चकासतं चतुर्भुजैः विकासिपद्मपूजितं प्रकाशितात्मतत्वकं नमाम्यहं गणाधिपम् ॥ ३॥ नराधिपत्वदायकं स्वरादिलोकनायकं
    ज्वरादिरोगवारकं निराकृतासुरव्रजम् । कराम्बुजोल्लसत्सृणिं विकारशून्यमानसैः हृदासदाविभावितं मुदा नमामि
    विघ्नपम् ॥ ४॥ श्रमापनोदनक्षमं समाहितान्तरात्मनां सुमादिभिः सदार्चितं क्षमानिधिं गणाधिपम् । रमाधवादिपूजितं
    यमान्तकात्मसम्भवं शमादिषड्गुणप्रदं नमामि तं विभूतये ॥ ५॥ गणाधिपस्य पञ्चकं नृणामभीष्टदायकं प्रणामपूर्वकं
    जनाः पठन्ति ये मुदायुताः । भवन्ति ते विदां पुरः प्रगीतवैभवाजवात् चिरायुषोऽधिकः श्रियस्सुसूनवो न संशयः
    ॥ ॐ ॥ ॥ इति दक्षिणाम्नाय श्रिङ्गेरी श्रीशारदापीठाधिपति शङ्कराचार्य जगद्गुरुवर्यो श्री सच्चिदानन्द
    शिवाभिनव नृसिंहभारती महास्वामिभिः विरचितम् श्री गणाधिपति पञ्चरत्न स्तोत्रं सम्पूर्णम् ॥
