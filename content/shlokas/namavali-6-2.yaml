id: namavali-6-2
category: stotram
name:
  english: namavali
  devanagari: नामावली
content:
  english: om bhairavaya namah | om bhutanathaya namah | om bhutatmane namah | om bhutabhavanaya namah
    | om kshetrajnaya namah | om kshetrapalaya namah | om kshetradaya namah | om kshatriyaya namah | om
    viraje namah | 9|| om shmashanavasine namah | om mamsashine namah | om kharparashine namah | om smarantakaya
    namah | om raktapaya namah | om panapaya namah | om siddhaya namah | om siddhidaya namah | om siddhasevitaya
    namah | 18|| om kankalaya namah | om kalashamanaya namah | om kalakashthatanave namah | om kavaye
    namah | om trinetraya namah | om bahunetraya namah | om pingalalocanaya namah | 25|| om shulapanaye
    namah | om khadgapanaye namah | om kankaline namah | om dhumralocanaya namah | om abhirave namah |
    om bhairavinathaya namah | om bhutapaya namah | om yoginipataye namah | 33|| om dhanadaya namah |
    om adhanaharine namah | om dhanavate namah | om pratibhanavate namah | om nagaharaya namah | om nagapashaya
    namah | om vyomakeshaya namah | om kapalabhrite namah | 41|| om kalaya namah | om kapalamaline namah
    | om kamaniyaya namah | om kalanidhaye namah | om trilocanaya namah | om jvalannetraya namah | om
    trishikhine namah | om trilokapaya namah | 49|| om trinetratanayaya namah | om dimbhashantaya namah
    | om shantajanapriyaya namah | om batukaya namah | om bahuveshaya namah | om khatvangavaradharakaya
    namah | 55|| om bhutadhyakshaya namah | om pashupataye namah | om bhikshukaya namah | om paricarakaya
    namah | om dhurtaya namah | om digambaraya namah | om shuraya namah | om harinaya namah | om pandulocanaya
    namah | 64|| om prashantaya namah | om shantidaya namah | om shuddhaya namah | om shankarapriyabandhavaya
    namah | om ashtamurtaye namah | om nidhishaya namah | om jnanacakshushe namah | om tapomayaya namah
    | 73|| om ashtadharaya namah | om shadadharaya namah | om sarpayuktaya namah | om shikhisakhaya namah
    | om bhudharaya namah | om bhudharadhishaya namah | om bhupataye
