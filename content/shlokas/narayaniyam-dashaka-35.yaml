id: narayaniyam-dashaka-35
category: stotram
name:
  english: Narayaniyam Dashaka 35
content:
  english: nitassugrivamaitrim tadanu hanumata dundubheh kayamuccaih kshiptvangushthena bhuyo luluvitha
    yugapat patrina sapta salan | hatva sugrivaghatodyatamatulabalam balinam vyajavrittya varshavelamanaishirvirahataralitastvam
    matangashramante || || sugrivenanujoktya sabhayamabhiyata vyuhitam vahinim ta mrikshanam vikshya dikshu
    drutamatha dayitamarganayavanamram | sandesham canguliyam pavanasutakare pradisho modashali marge
    marge mamarge kapibhirapi tada tvatpriya saprayasaih || || tvadvartakarnanodyadgarudurujavasampatisampativakya
    prottirnarnodhirantarnagari janakajam vikshya datvanguliyam | prakshudyodyanamakshakshapanacanaranah
    sodhabandho dashasyam drishtva plushtva ca lankam jhatiti sa hanuman mauliratnam dadau te || || tvam
    sugrivangadadiprabalakapicamucakravikrantabhumi cakro'bhikramya parejaladhi nishicarendranujashriyamanah
    | tatproktam shatruvartam rahasi nishamayan prarthanaparthyarosha prastagneyastratejastrasadudadhigira
    labdhavan madhyamargam || || kishairashantaropahritagirinikaraih setumadhapya yato yatunyamardya damshtranakhashikharishilasalashastraih
    svasainyaih | vyakurvan sanujastvam samarabhuvi param vikramam shakrajetra vegannagastrabaddhah patagapatigarunmarutairmocito'bhuh
    || || saumitristvatra shaktiprahritigaladasurvatajanitashaila ghranat prananupeto vyakrinuta kusritishlaghinam
    meghanadam | mayakshobheshu vaibhishanavacanahritastambhanah kumbhakarnam sampraptam kampitorvitalamakhilacamubhakshinam
    vyakshinostvam || || grihnan jambharisampreshitarathakavacau ravanenabhiyuddhyan brahmastrenasya bhindan
    galatatimabalamagnishuddham pragrihnan | devashrenivarojjivitasamaramritairakshataih rikshasanghai
    rlankabhartra ca sakam nijanagaramagah sapriyah pushpakena || || prito divyabhishekairayutasamadhikan
    vatsaran paryaramsi rmaithilyam papavaca shiva kila tam garbhinimabhyahasih | shatrughnenardayitva
    lavananishicaram prardayah shudrapasham tavadvalmikigehe kritavasatirupasuta sita sutau te || || valmikestvatsutodgapitamadhurakriterajnaya
    yajnavate sitam tvayyaptukame kshitimavishadasau tvam ca kalarthito'bhuh | hetoh saumitrighati svayamatha
    sarayumagnanishsheshabhrityaih sakam nakam prayato nijapadamagamo deva vaikunthamadyam || || so'yam
    martyavatarastava khalu niyatam martyashiksharthamevam vishleshartirniragastyajanamapi bhavet kamadharmatisaktya
    | no cet svatmanubhuteh kva nu tava manaso vikriya cakrapane sa tvam sattvaikamurte pavanapurapate
    vyadhunu vyadhitapan ||
  devanagari: नीतस्सुग्रीवमैत्रीं तदनु हनुमता दुन्दुभेः कायमुच्चैः क्षिप्त्वाङ्गुष्ठेन भूयो लुलुविथ युगपत्
    पत्रिणा सप्त सालान् । हत्वा सुग्रीवघातोद्यतमतुलबलं बालिनं व्याजवृत्त्या वर्षावेलामनैषीर्विरहतरलितस्त्वं
    मतङ्गाश्रमान्ते ॥ ॥ सुग्रीवेणानुजोक्त्या सभयमभियता व्यूहितां वाहिनीं ता मृक्षाणां वीक्ष्य दिक्षु द्रुतमथ
    दयितामार्गणायावनम्राम् । सन्देशं चाङ्गुलीयं पवनसुतकरे प्रादिशो मोदशाली मार्गे मार्गे ममार्गे कपिभिरपि
    तदा त्वत्प्रिया सप्रयासैः ॥ ॥ त्वद्वार्ताकर्णनोद्यद्गरुदुरुजवसम्पातिसम्पातिवाक्य प्रोत्तीर्णार्णोधिरन्तर्नगरि
    जनकजां वीक्ष्य दत्वाङ्गुलीयम् । प्रक्षुद्योद्यानमक्षक्षपणचणरणः सोढबन्धो दशास्यं दृष्ट्वा प्लुष्ट्वा
    च लङ्कां झटिति स हनुमान् मौलिरत्नं ददौ ते ॥ ॥ त्वं सुग्रीवाङ्गदादिप्रबलकपिचमूचक्रविक्रान्तभूमी चक्रोऽभिक्रम्य
    पारेजलधि निशिचरेन्द्रानुजाश्रीयमाणः । तत्प्रोक्तां शत्रुवार्तां रहसि निशमयन् प्रार्थनापार्थ्यरोष प्रास्ताग्नेयास्त्रतेजस्त्रसदुदधिगिरा
    लब्धवान् मध्यमार्गम् ॥ ॥ कीशैराशान्तरोपाहृतगिरिनिकरैः सेतुमाधाप्य यातो यातून्यामर्द्य दंष्ट्रानखशिखरिशिलासालशस्त्रैः
    स्वसैन्यैः । व्याकुर्वन् सानुजस्त्वं समरभुवि परं विक्रमं शक्रजेत्रा वेगान्नागास्त्रबद्धः पतगपतिगरुन्मारुतैर्मोचितोऽभूः
    ॥ ॥ सौमित्रिस्त्वत्र शक्तिप्रहृतिगलदसुर्वातजानीतशैल घ्राणात् प्राणानुपेतो व्यकृणुत कुसृतिश्लाघिनं
    मेघनादम् । मायाक्षोभेषु वैभीषणवचनहृतस्तम्भनः कुम्भकर्णं सम्प्राप्तं कम्पितोर्वीतलमखिलचमूभक्षिणं व्यक्षिणोस्त्वम्
    ॥ ॥ गृह्णन् जम्भारिसम्प्रेषितरथकवचौ रावणेनाभियुद्ध्यन् ब्रह्मास्त्रेणास्य भिन्दन् गलततिमबलामग्निशुद्धां
    प्रगृह्णन् । देवश्रेणीवरोज्जीवितसमरमृतैरक्षतैः ऋक्षसङ्घै र्लङ्काभर्त्रा च साकं निजनगरमगाः सप्रियः
    पुष्पकेण ॥ ॥ प्रीतो दिव्याभिषेकैरयुतसमधिकान् वत्सरान् पर्यरंसी र्मैथिल्यां पापवाचा शिव किल तां गर्भिणीमभ्यहासीः
    । शत्रुघ्नेनार्दयित्वा लवणनिशिचरं प्रार्दयः शूद्रपाशं तावद्वाल्मीकिगेहे कृतवसतिरुपासूत सीता सुतौ ते
    ॥ ॥ वाल्मीकेस्त्वत्सुतोद्गापितमधुरकृतेराज्ञया यज्ञवाटे सीतां त्वय्याप्तुकामे क्षितिमविशदसौ त्वं च
    कालार्थितोऽभूः । हेतोः सौमित्रिघाती स्वयमथ सरयूमग्ननिश्शेषभृत्यैः साकं नाकं प्रयातो निजपदमगमो देव
    वैकुण्ठमाद्यम् ॥ ॥ सोऽयं मर्त्यावतारस्तव खलु नियतं मर्त्यशिक्षार्थमेवं विश्लेषार्तिर्निरागस्त्यजनमपि
    भवेत् कामधर्मातिसक्त्या । नो चेत् स्वात्मानुभूतेः क्व नु तव मनसो विक्रिया चक्रपाणे स त्वं सत्त्वैकमूर्ते
    पवनपुरपते व्याधुनु व्याधितापान् ॥
