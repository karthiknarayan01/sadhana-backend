id: rajaindaradyumnakritamvishnustotram
category: stotram
name:
  english: rajaindaradyumnakritamvishnustotram
  devanagari: राजाइन्दरद्युम्नकृतंविष्णुस्तोत्रम्
content:
  english: raja indaradyumnakritam vishnustotram raja vishnum pratushtava sashtangam pranipatya ca | keshavam
    madhavam vishnum govindam madhusudanam || 94|| padmanabham hrishikesham shridharam ca trivikramam
    | damodaram vasudevam shriharim kambharasutam || 95|| gopalabalam radhesham shrisham rameshvaram prabhum
    | anadishrikrishnanarayanam shripurushottamam || 96|| manjulesham parvatisham prabhesham manikipatim
    | lakshminarayanam hamsajayanatham namamyaham || 97|| shankhacakragadasharngavanamalavibhushanam |
    lokanatham jagannatham shrinatham pranamamyaham || 98|| aksharesha ca muktesha lalitesha namo'stu
    te | avataresha devesha vyuhesha ca namo'stu te || 99|| ishvaresha ca mayesha durgesha jahnavipate
    | jivesha'nantayajnesha yajnadhipa namo'stu te || 100|| vedatmakaya kantaya dharmaputraya te namah
    | brahmavratadharaya'trigunaya ca namo'stu te || 101|| prakritishaya shantaya vaikunthasthaya te namah
    | nrisimhamatsyavarahakurmarupaya te namah || 102|| sadhuveshadharayadikaranaya ca te namah | sahasrashirase
    vedyapurushaya ca te namah || 103|| asuranam damanartham dhritarupaya te namah | hiranyagarbharupaya'mritadhamne
    ca te namah || 104|| sarvagarbhaya krishnaya'ntaratmane ca te namah | srashtre'vitre ca samhartre
    karyarupaya te namah || 105|| sarvadikpalarupaya lokapalatmane namah | ardhanarisvarupaya tridevaya
    ca te namah || 106|| ananta''nandanidhaye brahmadhamne ca te namah | karmaphalapradatre te ca'ntahsthaya
    namo namah || 107|| saurashtrakritavasaya shrikrishnaya paratmane | kotigopikanta tubhyam sukhadaya
    namo namah || 108|| brahmatejase kshatranam viryarupaya te namah | visham sampatsvarupaya sharanyaya
    ca te namah || 109|| pativratyasvarupaya patnivrishaya te namah | sadordhvaretase krishna mokshadaya
    ca te namah || 110|| sadhushu sarvada sthatre balarupaya te namah | namo bhaktamanahkamapurakaya namo
    namah || 111|| jnanadaya tathecchasampradaya yatnadaya ca | kriyadatre phaladatre bhoktre bhogyaya
    te namah || 112|| prakashaya pareshaya jivasthaya ca te namah | sarvadehinivasaya shaktiyogyaya te
    namah || 113|| acintyagunadhamne te divyadehaya te namah | aparaishvaryadhatre te drishyarupaya te
    namah || 114|| adrishyaruparupaya nityajnaya ca te namah | sarvatattvasvarupaya mandapaya ca te namah
    || 115|| pancagnikritarupaya vratasthaya ca te namah | punyadaya maheshaya sarveshaya ca te namah
    || 116|| sarvaduhkhavinashitre vahnirupaya te namah | namo'stu sruksruvadyatmayajnapatraya te namah
    || 117|| dakshinapataye tubhyam cashirvadaya te namah | triptaye shantirupaya rasarupaya te namah
    || 118|| sarvendriyanivasaya satyakamaya te namah | adityadisvarupaya vrisharupaya te namah || 119||
    namaskarasya patraya'rpanapatraya te namah | tvatprasadat kripasindho yajnasiddhirmama'bhavat || 120||
    karam grihana me vishno yatha patnikaram varah | dehi me carane vasam nanyam vrinomi keshava
  devanagari: राजा इन्दरद्युम्नकृतं विष्णुस्तोत्रम् राजा विष्णुं प्रतुष्टाव साष्टाङ्गं प्रणिपत्य च । केशवं
    माधवं विष्णुं गोविन्दं मधुसूदनम् ॥ ९४॥ पद्मनाभं हृषीकेशं श्रीधरं च त्रिविक्रमम् । दामोदरं वासुदेवं
    श्रीहरिं कम्भरासुतम् ॥ ९५॥ गोपालबालं राधेशं श्रीशं रमेश्वरं प्रभुम् । अनादिश्रीकृष्णनारायणं श्रीपुरुषोत्तमम्
    ॥ ९६॥ मञ्जुलेशं पार्वतीशं प्रभेशं माणिकीपतिम् । लक्ष्मीनारायणं हंसाजयानाथं नमाम्यहम् ॥ ९७॥ शङ्खचक्रगदाशार्ङ्गवनमालाविभूषणम्
    । लोकनाथं जगन्नाथं श्रीनाथं प्रणमाम्यहम् ॥ ९८॥ अक्षरेश च मुक्तेश ललितेश नमोऽस्तु ते । अवतारेश देवेश
    व्यूहेश च नमोऽस्तु ते ॥ ९९॥ ईश्वरेश च मायेश दुर्गेश जाह्नवीपते । जीवेशाऽनन्तयज्ञेश यज्ञाधिप नमोऽस्तु
    ते ॥ १००॥ वेदात्मकाय कान्ताय धर्मपुत्राय ते नमः । ब्रह्मव्रतधरायाऽत्रिगुणाय च नमोऽस्तु ते ॥ १०१॥ प्रकृतीशाय
    शान्ताय वैकुण्ठस्थाय ते नमः । नृसिंहमत्स्यवाराहकूर्मरूपाय ते नमः ॥ १०२॥ साधुवेषधरायादिकारणाय च ते
    नमः । सहस्रशिरसे वेद्यपुरुषाय च ते नमः ॥ १०३॥ असुराणां दमनार्थं धृतरूपाय ते नमः । हिरण्यगर्भरूपायाऽमृतधाम्ने
    च ते नमः ॥ १०४॥ सर्वगर्भाय कृष्णायाऽन्तरात्मने च ते नमः । स्रष्ट्रेऽवित्रे च संहर्त्रे कार्यरूपाय
    ते नमः ॥ १०५॥ सर्वदिक्पालरूपाय लोकपालात्मने नमः । अर्धनारीस्वरूपाय त्रिदेवाय च ते नमः ॥ १०६॥ अनन्ताऽऽनन्दनिधये
    ब्रह्मधाम्ने च ते नमः । कर्मफलप्रदात्रे ते चाऽन्तःस्थाय नमो नमः ॥ १०७॥ सौराष्ट्रकृतवासाय श्रीकृष्णाय
    परात्मने । कोटिगोपीकान्त तुभ्यं सुखदाय नमो नमः ॥ १०८॥ ब्राह्मतेजसे क्षत्राणां वीर्यरूपाय ते नमः ।
    विशां सम्पत्स्वरूपाय शरण्याय च ते नमः ॥ १०९॥ पातिव्रत्यस्वरूपाय पत्नीवृषाय ते नमः । सदोर्ध्वरेतसे
    कृष्ण मोक्षदाय च ते नमः ॥ ११०॥ साधुषु सर्वदा स्थात्रे बालरूपाय ते नमः । नमो भक्तमनःकामपूरकाय नमो नमः
    ॥ १११॥ ज्ञानदाय तथेच्छासम्प्रदाय यत्नदाय च । क्रियादात्रे फलदात्रे भोक्त्रे भोग्याय ते नमः ॥ ११२॥
    प्रकाशाय परेशाय जीवस्थाय च ते नमः । सर्वदेहिनिवासाय शक्तियोग्याय ते नमः ॥ ११३॥ अचिन्त्यगुणधाम्ने ते
    दिव्यदेहाय ते नमः । अपारैश्वर्यधात्रे ते दृश्यरूपाय ते नमः ॥ ११४॥ अदृश्यरूपरूपाय नित्यज्ञाय च ते नमः
    । सर्वतत्त्वस्वरूपाय मण्डपाय च ते नमः ॥ ११५॥ पञ्चाग्निकृतरूपाय व्रतस्थाय च ते नमः । पुण्यदाय महेशाय
    सर्वेशाय च ते नमः ॥ ११६॥ सर्वदुःखविनाशित्रे वह्निरूपाय ते नमः । नमोऽस्तु स्रुक्स्रुवाद्यात्मयज्ञपात्राय
    ते नमः ॥ ११७॥ दक्षिणापतये तुभ्यं चाशीर्वादाय ते नमः । तृप्तये शान्तिरूपाय रसरूपाय ते नमः ॥ ११८॥ सर्वेन्द्रियनिवासाय
    सत्यकामाय ते नमः । आदित्यादिस्वरूपाय वृषरूपाय ते नमः ॥ ११९॥ नमस्कारस्य पात्रायाऽर्पणपात्राय ते नमः
    । त्वत्प्रसादात् कृपासिन्धो यज्ञसिद्धिर्ममाऽभवत् ॥ १२०॥ करं गृहाण मे विष्णो यथा पत्नीकरं वरः । देहि
    मे चरणे वासं नान्यं वृणोमि केशव
