id: tvamevabruhi
category: stotram
name:
  english: tvamevabruhi
  devanagari: त्वमेवब्रुहि
content:
  english: tvameva bruhistotram shri ganeshaya namah | asiddharadhamalalamarupo nasidaho kasya gururgariyan
    | deshah sa evadya tvadiyapreyan heyanadhastishthati sarvadeshat || 1|| abhudayodhya bhavadiyamedhya
    puri pura devapuradapiha | mlecchairupetamavalokyate tam no duyate kim vada caru cetah || 2|| pura
    surakrantavasundharaya vyatha tvaya kim na nirakrita sa | tatte balam kvasti kharah sharo va goghatino
    hanta katham na hansi || 3|| manye mahapapakalapakari cedravano hanta hatastvayaiva | kim tadvidhanadya
    na pashyasiha yadva tvamasmakamivasi bhitah || 4|| sitatimita dashakandharena vita tvaya shantimito
    na bhedah | nanabala hadya khala haranti nayamsi karunyamito'sti khedah || 5|| noced dayaghana dayamadhuna
    karoshi san dinabandhurapi nishthuratam tano'si | kasyantikam vrajatu bharatametadadya lokabhirama
    ghanashyama tvameva bruhi || 6|| || shrirajamanisharmakritam tvamevabruhistotram sampurnam ||
  devanagari: त्वमेव ब्रूहिस्तोत्रम् श्री गणेशाय नमः । आसीद्धराधामललामरूपो नासीदहो कस्य गुरुर्गरीयान्
    । देशः स एवाद्य त्वदीयप्रेयान् हेयानधस्तिष्ठति सर्वदेशात् ॥ १॥ अभूदयोध्या भवदीयमेध्या पुरी पुरा देवपुरादपीह
    । म्लेच्छैरुपेतामवलोक्यते तां नो दूयते किं वद चारु चेतः ॥ २॥ पुरा सुराक्रान्तवसुन्धराया व्यथा त्वया
    किं न निराकृता सा । तत्ते बलं क्वास्ति खरः शरो वा गोघातिनो हन्त कथं न हन्सि ॥ ३॥ मन्ये महापापकलापकारी
    चेद्रावणो हन्त हतस्त्वयैव । किं तद्विधानद्य न पश्यसीह यद्वा त्वमस्माकमिवासि भीतः ॥ ४॥ सीतातिमीता दशकन्धरेण
    वीता त्वया शान्तिमितो न भेदः । नानाबला हाद्य खला हरन्ति नायांसि कारुण्यमितोऽस्ति खेदः ॥ ५॥ नोचेद्
    दयाघन दयामधुना करोषि सन् दीनबन्धुरपि निष्ठुरतां तनोऽसि । कस्यान्तिकं व्रजतु भारतमेतदद्य लोकाभिराम
    घनश्याम त्वमेव ब्रूहि ॥ ६॥ ॥ श्रीराजमणिशर्मकृतं त्वमेवब्रूहिस्तोत्रं सम्पूर्णम् ॥
