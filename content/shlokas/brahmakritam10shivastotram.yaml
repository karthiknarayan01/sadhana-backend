id: brahmakritam10shivastotram
category: stotram
name:
  english: brahmakritam10shivastotram
  devanagari: ब्रह्मकृतं१०शिवस्तोत्रम्
content:
  english: brahmakritam 10 shivastotram brahmovaca | jane tvamisham vishvasya jagato yonibijayoh | shakteh
    shivasya ca param yattadbrahma nirantaram || 42|| tvameva bhagavannetacchivashaktyoh svarupayoh |
    vishvam srijasi pasyatsi kridannurnapato yatha || 43|| tvameva dharmarthadughabhipattaye dakshena
    sutrena sasarjithadhvaram | tvayaiva loke'vasitashca setavo yan brahmanah shraddadhate dhritavratah
    || 44|| tvam karmanam mangalamangalanam kartuh sma lokam tanushe svah param va | amangalanam ca tamisramulbanam
    viparyayah kena tadeva kasyacit || 45|| na vai satam tvaccaranarpitatmanam bhuteshu sarveshvabhipashyatam
    tava | bhutani catmanyaprithagdidrikshatam prayena rosho'bhibhavedyatha pashum || 46|| iti shrimadbhagavatamahapurane
    caturthaskandhe shashthadhyayantargatam brahmakritam shivastotram samaptam | bhagavatapurana | adhyaya
    4
  devanagari: ब्रह्मकृतं १० शिवस्तोत्रम् ब्रह्मोवाच । जाने त्वामीशं विश्वस्य जगतो योनिबीजयोः । शक्तेः
    शिवस्य च परं यत्तद्ब्रह्म निरन्तरम् ॥ ४२॥ त्वमेव भगवन्नेतच्छिवशक्त्योः स्वरूपयोः । विश्वं सृजसि पास्यत्सि
    क्रीडन्नूर्णपटो यथा ॥ ४३॥ त्वमेव धर्मार्थदुघाभिपत्तये दक्षेण सूत्रेण ससर्जिथाध्वरम् । त्वयैव लोकेऽवसिताश्च
    सेतवो यान् ब्राह्मणाः श्रद्दधते धृतव्रताः ॥ ४४॥ त्वं कर्मणां मङ्गलमङ्गलानां कर्तुः स्म लोकं तनुषे
    स्वः परं वा । अमङ्गलानां च तमिस्रमुल्बणं विपर्ययः केन तदेव कस्यचित् ॥ ४५॥ न वै सतां त्वच्चरणार्पितात्मनां
    भूतेषु सर्वेष्वभिपश्यतां तव । भूतानि चात्मन्यपृथग्दिदृक्षतां प्रायेण रोषोऽभिभवेद्यथा पशुम् ॥ ४६॥ इति
    श्रीमद्भागवतमहापुराणे चतुर्थस्कन्धे षष्ठाध्यायान्तर्गतं ब्रह्मकृतं शिवस्तोत्रं समाप्तम् । भागवतपुराण
    । अध्याय ४
