id: anjaneya-dvadasha-nama-stotram
category: stotram
name:
  english: Anjaneya Dvadasha Nama Stotram
content:
  english: hanumananjanasunuh vayuputro mahabalah | rameshtah phalgunasakhah pingaksho'mitavikramah ||
    || udadhikramanashcaiva sitashokavinashakah | lakshmana pranadataca dashagrivasya darpaha || || dvadashaitani
    namani kapindrasya mahatmanah | svapakale pathennityam yatrakale visheshatah | tasyamrityu bhayam
    nasti sarvatra vijayi bhavet ||
  devanagari: हनुमानञ्जनासूनुः वायुपुत्रो महाबलः । रामेष्टः फल्गुणसखः पिङ्गाक्षोऽमितविक्रमः ॥ ॥ उदधिक्रमणश्चैव
    सीताशोकविनाशकः । लक्ष्मण प्राणदाताच दशग्रीवस्य दर्पहा ॥ ॥ द्वादशैतानि नामानि कपीन्द्रस्य महात्मनः
    । स्वापकाले पठेन्नित्यं यात्राकाले विशेषतः । तस्यमृत्यु भयं नास्ति सर्वत्र विजयी भवेत् ॥
