id: bagalamukhi-108
category: stotram
name:
  english: bagalamukhi 108
  devanagari: बगलामुखी १०८
content:
  english: shripitambarapritaye pathe viniyogah | om bagala vishnuvanita vishnushankarabhamini | bahula
    vedamata ca mahavishnuprasurapi || 4|| mahamatsya mahakurmma mahavaraharupini | narasimhapriya ramya
    vamana baturupini || 5|| jamadagnyasvarupa ca rama ramaprapujita | krishna kapardini kritya kalaha
    kalakarini || 6|| buddhirupa buddhabharya bauddhapakhandakhandini | kalkirupa kalihara kalidurgati
    nashini || 7|| kotisuryyapratikasha kotikandarpamohini | kevala kathina kali kala kaivalyadayini ||
    8|| keshavi keshavaradhya kishori keshavastuta | rudrarupa rudramurti rudrani rudradevata || 9|| nakshatrarupa
    nakshatra nakshatreshaprapujita | nakshatreshapriya nitya nakshatrapativandita || 10|| nagini nagajanani
    nagarajapravandita | nageshvari nagakanya nagari ca nagatmaja || 11|| nagadhirajatanaya nagarajaprapujita
    | navina nirada pita shyama saundaryyakarini || 12|| rakta nila ghana shubhra shveta saubhagyadayini
    | sundari saubhaga saumya svarnabha svargatiprada || 13|| riputrasakari rekha shatrusamharakarini
    | bhamini ca tatha maya stambhini mohini shubha || 14|| ragadveshakari ratri rauravadhvamsakarini
    | yakshini siddhanivaha siddhesha siddhirupini || 15|| lankapatidhvamsakari lankeshi ripuvandita |
    lankanathakulahara maharavanaharini || 16|| devadanavasiddhaughapujita parameshvari | paranurupa parama
    paratantravinashini || 17|| varada varadaradhya varadanaparayana | varadeshapriya vira virabhushanabhushita
    || 18|| vasuda bahuda vani brahmarupa varanana | balada pitavasana pitabhushanabhushita || 19|| pitapushpapriya
    pitahara pitasvarupini | iti te kathitam vipra namnamashtottaram shatam || 20|| yah pathetpathayedvapi
    sha
  devanagari: श्रीपीताम्बराप्रीतये पाठे विनियोगः । ॐ बगला विष्णुवनिता विष्णुशङ्करभामिनी । बहुला वेदमाता
    च महाविष्णुप्रसूरपि ॥ ४॥ महामत्स्या महाकूर्म्मा महावाराहरूपिणी । नारसिंहप्रिया रम्या वामना बटुरूपिणी
    ॥ ५॥ जामदग्न्यस्वरूपा च रामा रामप्रपूजिता । कृष्णा कपर्दिनी कृत्या कलहा कलकारिणी ॥ ६॥ बुद्धिरूपा बुद्धभार्या
    बौद्धपाखण्डखण्डिनी । कल्किरूपा कलिहरा कलिदुर्गति नाशिनी ॥ ७॥ कोटिसूर्य्यप्रतीकाशा कोटिकन्दर्पमोहिनी
    । केवला कठिना काली कला कैवल्यदायिनी ॥ ८॥ केशवी केशवाराध्या किशोरी केशवस्तुता । रुद्ररूपा रुद्रमूर्ती
    रुद्राणी रुद्रदेवता ॥ ९॥ नक्षत्ररूपा नक्षत्रा नक्षत्रेशप्रपूजिता । नक्षत्रेशप्रिया नित्या नक्षत्रपतिवन्दिता
    ॥ १०॥ नागिनी नागजननी नागराजप्रवन्दिता । नागेश्वरी नागकन्या नागरी च नगात्मजा ॥ ११॥ नगाधिराजतनया नगराजप्रपूजिता
    । नवीना नीरदा पीता श्यामा सौन्दर्य्यकारिणी ॥ १२॥ रक्ता नीला घना शुभ्रा श्वेता सौभाग्यदायिनी । सुन्दरी
    सौभगा सौम्या स्वर्णाभा स्वर्गतिप्रदा ॥ १३॥ रिपुत्रासकरी रेखा शत्रुसंहारकारिणी । भामिनी च तथा माया
    स्तम्भिनी मोहिनी शुभा ॥ १४॥ रागद्वेषकरी रात्री रौरवध्वंसकारिणी । यक्षिणी सिद्धनिवहा सिद्धेशा सिद्धिरूपिणी
    ॥ १५॥ लङ्कापतिध्वंसकरी लङ्केशी रिपुवन्दिता । लङ्कानाथकुलहरा महारावणहारिणी ॥ १६॥ देवदानवसिद्धौघपूजिता
    परमेश्वरी । पराणुरूपा परमा परतन्त्रविनाशिनी ॥ १७॥ वरदा वरदाराध्या वरदानपरायणा । वरदेशप्रिया वीरा वीरभूषणभूषिता
    ॥ १८॥ वसुदा बहुदा वाणी ब्रह्मरूपा वरानना । बलदा पीतवसना पीतभूषणभूषिता ॥ १९॥ पीतपुष्पप्रिया पीतहारा
    पीतस्वरूपिणी । इति ते कथितं विप्र नाम्नामष्टोत्तरं शतम् ॥ २०॥ यः पठेत्पाठयेद्वापि श
