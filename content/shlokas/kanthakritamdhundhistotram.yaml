id: kanthakritamdhundhistotram
category: stotram
name:
  english: kanthakritamdhundhistotram
  devanagari: कण्ठकृतंढुण्ढिस्तोत्रम्
content:
  english: 20|| jaya srishtikritam vandya jaya sthitikritanata | jaya samhritikritstutya jayasatkarmasiddhida
    || 21|| siddhavandyapadambhoja jayasiddhividhayaka | sarvasiddhyekanilaya mahasiddhyriddhisucaka ||
    22|| asheshagunanirmana gunatita gunagrani | paripurnacaritrartha jaya tvam gunavarnita || 23|| jaya
    sarvabaladhisha balarati balaprada | balakojjvaladantagra balabalaparakama || 24|| anantamahima''dhara
    dharadharavidarana | dantagraprotadinnaga jaya nagavibhushana || 25|| ye tvam namanti karunamaya divyamurte
    sarvainasamapi bhuvo bhuvi muktibhajah | tesham sadaiva harasiha mahopasargan svargapavargamapi sampradadasi
    tebhyah || 26|| ye vighnaraja bhavata karunakatakshaih samprekshitah kshititale kshanamatramatra |
    tesham kshayanti sakalanyapi kilvishani lakshmih katakshayati tanpurushottamanhi || 27|| ye tvam stuvanti
    natavighnavighatadaksha dakshayanihridayapankajatigmarashme | shruyanta eva ta iha prathita na citram
    citram tadatra ganapa yadaho ta eva || 28|| ye shilayanti satatam bhavatom'ghriyugmam te putrapautradhanadhanyasamriddhibhajah
    | samshilitanghrikamala bahubhrityavargai
  devanagari: २०॥ जय सृष्टिकृतां वन्द्य जय स्थितिकृतानत । जय संहृतिकृत्स्तुत्य जयसत्कर्मसिद्धिद ॥ २१॥
    सिद्धवन्द्यपदाम्भोज जयसिद्धिविधायक । सर्वसिद्ध्येकनिलय महासिद्ध्यृद्धिसूचक ॥ २२॥ अशेषगुणनिर्माण गुणातीत
    गुणाग्रणी । परिपूर्णचरित्रार्थ जय त्वं गुणवर्णित ॥ २३॥ जय सर्वबलाधीश बलाराति बलप्रद । बलाकोज्ज्वलदन्ताग्र
    बालाबालपराकम ॥ २४॥ अनन्तमहिमाऽऽधार धराधरविदारण । दन्ताग्रप्रोतदिङ्नाग जय नागविभूषण ॥ २५॥ ये त्वां
    नमन्ति करुणामय दिव्यमूर्ते सर्वैनसामपि भुवो भुवि मुक्तिभाजः । तेषां सदैव हरसीह महोपसर्गान् स्वर्गापवर्गमपि
    सम्प्रददासि तेभ्यः ॥ २६॥ ये विघ्नराज भवता करुणाकटाक्षैः सम्प्रेक्षिताः क्षितितले क्षणमात्रमत्र । तेषां
    क्षयन्ति सकलान्यपि किल्विषाणि लक्ष्मीः कटाक्षयति तान्पुरुषोत्तमान्हि ॥ २७॥ ये त्वां स्तुवन्ति नतविघ्नविघातदक्ष
    दाक्षायणीहृदयपङ्कजतिग्मरश्मे । श्रूयन्त एव त इह प्रथिता न चित्रं चित्रं तदत्र गणपा यदहो त एव ॥ २८॥
    ये शीलयन्ति सततं भवतोंऽघ्रियुग्मं ते पुत्रपौत्रधनधान्यसमृद्धिभाजः । संशीलिताङ्घ्रिकमला बहुभृत्यवर्गै
