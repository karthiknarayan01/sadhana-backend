id: viraughagurukavacam
category: kavacha
name:
  english: viraughagurukavacam
  devanagari: वीरौघगुरुकवचम्
content:
  english: urdhvamnayokta siddha viraughagurukavacam || guru dhyanam || dhyayecchirasi shuklabje dvinetram
    dvibhujam gurum | shvetambaraparidhanam shvetamalyanulepanam || 2|| varabhayakaram shantam karunamayavigraham
    | vamenotpaladharinya shaktyalingitavigraham || smerananam suprasannam sadhakabhishtasiddhidam | ||
    kavacastotram || paranathadinathashca brahmarandhre sahasrake | divyacakre ca me patu sarvavishveshvareshvarah
    || 1|| shrinathah patu shirasi siddhidale tu shripatih | vagdevi durganathashca durga durgatinashini
    || 2|| shodashare sada patu kanthadeshe svare tatha | ishvaro bhairavinatho kalamishanabhairavah ||
    3|| dvadashare ca me patu virabhadro kalantakrit | dashare nabhideshe ca rurunathashca bhairavah ||
    4|| paratparagururdevo cakranatho sada'vatu | shaddale kamanetre ca kamadevo sada'vatu || 5|| matsyendro
    matsyanathashca rakshatu candakoshake | gorakshashca vedapadme adhare patu me sada || 6|
  devanagari: ऊर्ध्वाम्नायोक्त सिद्ध वीरौघगुरुकवचम् ॥ गुरु ध्यानम् ॥ ध्यायेच्छिरसि शुक्लाब्जे द्विनेत्रं
    द्विभुजं गुरुम् । श्वेताम्बरपरीधानं श्वेतमाल्यानुलेपनम् ॥ २॥ वराभयकरं शान्तं करुणामयविग्रहम् । वामेनोत्पलधारिण्या
    शक्त्यालिङ्गितविग्रहम् ॥ स्मेराननं सुप्रसन्नं साधकाभीष्टसिद्धिदम् । ॥ कवचस्तोत्रम् ॥ परनाथादिनाथश्च
    ब्रह्मरन्ध्रे सहस्रके । दिव्यचक्रे च मे पातु सर्वविश्वेश्वरेश्वरः ॥ १॥ श्रीनाथः पातु शिरसि सिद्धिदले
    तु श्रीपतिः । वाग्देवी दुर्गनाथश्च दुर्गा दुर्गतिनाशिनी ॥ २॥ षोडशारे सदा पातु कण्ठदेशे स्वरे तथा ।
    ईश्वरो भैरवीनाथो कालमीशानभैरवः ॥ ३॥ द्वादशारे च मे पातु वीरभद्रो कालान्तकृत् । दशारे नाभिदेशे च रुरुनाथश्च
    भैरवः ॥ ४॥ परात्परगुरुर्देवो चक्रनाथो सदाऽवतु । षड्दले कामनेत्रे च कामदेवो सदाऽवतु ॥ ५॥ मत्स्येन्द्रो
    मत्स्यनाथश्च रक्षतु चाण्डकोषके । गोरक्षश्च वेदपद्मे आधारे पातु मे सदा ॥ ६।
