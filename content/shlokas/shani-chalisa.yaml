id: shani-chalisa
category: stotram
name:
  english: Shani Chalisa
content:
  english: doha jaya ganesha girija suvana mangala karana kripala | dinana ke dukha dura kari kijai natha
    nihala || jaya jaya shri shanideva prabhu sunahu vinaya maharaja | karahu kripa he ravi tanaya rakhahu
    jana ki laja || caupai jayati jayati shanideva dayala | karata sada bhaktana pratipala || cari bhuja
    tanu shyama virajai | mathe ratana mukuta chavi chajai || parama vishala manohara bhala | tedhai drishti
    bhrikuti vikarala || kundala shravana camacama camake | hiye mala muktana mani damake || kara mem
    gada trishula kuthara | pala bica karaim arihim samhara || pingala dasha nama | bhanu putra pujahim
    saba kama || ja para prabhu prasanna hai jahim | rankahum rava karainkshana mahim || parvatahu trina
    hoi niharata | trina hu ko parvata kari darata|| raja milata bana ramahim dinho | kaikeihum ki mati
    hari linhom|| banahum mem mriga kapata dikhai | matu janaki gi caturai|| lakhanahim shakti vikala
    kari dara | maciga dala mem hahakara|| ravana ki gati mati baurai | ramacandra som baira badhai||
    diyo kita kari kancana lanka | baji bajaranga bira ki danka|| nripa vikrama para tuhi pagu dhara |
    citra mayura nigali gai hara|| hara naulakha lagyo cori | hatha paira daravayo tori|| bhari dasha
    nikrishta dikhayo | telihim ghara kolhu calavayo|| vinaya raga dipaka maham kinhom | taba prasanna
    prabhu hai sukha dinhom|| harishcandra nripa nari bikani | apahum bhare doma ghara pani|| taise nala
    paradasha sirani | bhunji mina kuda gi pani|| shri shankarahi gahayo jaba jai | parvati ko sati karai||
    tanika vilokata hi kari risa | nabha udi gayo gaurisuta sisa|| pandava para bhai dasha tumhari | baci
    draupadi hoti ughari|| kaurava ke bhi gati mati marayo | yudgha mahabharata kari darayo|| ravi kaham
    mukha maham dhari tatkala | lekara kudi parayo patala || shesha deva lakhi vinati lai | ravi ko mukha
    te diyo chudai || vahana prabhu ke sata sujana | jaga digja gardabha mriga svana || jambuka simha
    adi nakhadhari | so phala jajyotisha kahata pukari || gaja vahana lakshmi griha avaim | haya te sukha
    sampatti upajavaim || gardabha hani karai bahu kaja | gardabha sidgha kara raja samaja || jambuka
    budghi nashta kara darai | mriga de kashta prana samharai || jaba avahim prabhu svana savari | cori
    adi hoya dara bhari || taisahi cari carana yaha nama | svarna lauha canji aru tama || lauha carana
    para jaba prabhu avaim | dhana jana sampatti nashta karavai || samata tamra rajata shubhakari | svarna
    sarva sukha mangala kari || jo yaha shani caritra nita gavai | kabahum na dasha nikrishta satavai
    || adabhuta natha dikhavaim lila | karaim shatru ke nashi bali dhila || jo pandita suyogya bulavai
    | vidhivata shani graha shanti karai || pipala jala shani divasa cadhavata | dipa dana dai bahu sukha
    pavata || kahata ramasundara prabhu dasa | shani sumirata sukha hota prakasha || doha patha shanishcara
    deva ko ki hom vimala taiyara | karata patha calisa dina
  devanagari: दोहा जय गणेश गिरिजा सुवन मङ्गल करण कृपाल । दीनन के दुख दूर करि कीजै नाथ निहाल ॥ जय जय श्री
    शनिदेव प्रभु सुनहु विनय महाराज । करहु कृपा हे रवि तनय राखहु जन की लाज ॥ चौपाई जयति जयति शनिदेव दयाला
    । करत सदा भक्तन प्रतिपाला ॥ चारि भुजा तनु श्याम विराजै । माथे रतन मुकुट छवि छाजै ॥ परम विशाल मनोहर
    भाला । टेढई दृष्टि भृकुटि विकराला ॥ कुण्डल श्रवण चमाचम चमके । हिये माल मुक्तन मणि दमके ॥ कर में गदा
    त्रिशूल कुठारा । पल बिच करैं आरिहिं संहारा ॥ पिङ्गल दश नामा । भानु पुत्र पूजहिं सब कामा ॥ जा पर प्रभु
    प्रसन्न है जाहीम् । रङ्कहुं राव करैङ्क्षण माहीम् ॥ पर्वतहू तृण होई निहारत । तृण हू को पर्वत करि डारत॥
    राज मिलत बन रामहिं दीन्हो । कैकेइहुं की मति हरि लीन्हों॥ बनहूं में मृग कपट दिखाई । मातु जानकी गी चतुराई॥
    लखनहिं शक्ति विकल करि डारा । मचिगा दल में हाहाकारा॥ रावण की गति मति बौराई । रामचन्द्र सों बैर बढई॥
    दियो कीट करि कञ्चन लङ्का । बजि बजरङ्ग बीर की डङ्का॥ नृप विक्रम पर तुहि पगु धारा । चित्र मयूर निगलि
    गै हारा॥ हार नौलाखा लाग्यो चोरी । हाथ पैर डरवायो तोरी॥ भारी दशा निकृष्ट दिखायो । तेलिहिं घर कोल्हू
    चलवायो॥ विनय राग दीपक महं कीन्होम् । तब प्रसन्न प्रभु है सुख दीन्हों॥ हरिश्चन्द्र नृप नारि बिकानी
    । आपहुं भरे डोम घर पानी॥ तैसे नल परदशा सिरानी । भूञ्जी मीन कूद गी पानी॥ श्री शङ्करहि गहयो जब जाई ।
    पार्वती को सती कराई॥ तनिक विलोकत ही करि रीसा । नभ उडि़ गयो गौरिसुत सीसा॥ पाण्डव पर भै दशा तुम्हारी
    । बची द्रौपदी होति उघारी॥ कौरव के भी गति मति मारयो । युद्घ महाभारत करि डारयो॥ रवि कहं मुख महं धरि
    तत्काला । लेकर कूदि परयो पाताला ॥ शेष देव लखि विनती लाई । रवि को मुख ते दियो छुडई ॥ वाहन प्रभु के
    सात सुजाना । जग दिग्ज गर्दभ मृग स्वाना ॥ जम्बुक सिंह आदि नखधारी । सो फल जज्योतिष कहत पुकारी ॥ गज वाहन
    लक्ष्मी गृह आवैम् । हय ते सुख सम्पत्ति उपजावैम् ॥ गर्दभ हानि करै बहु काजा । गर्दभ सिद्घ कर राज समाजा
    ॥ जम्बुक बुद्घि नष्ट कर डारै । मृग दे कष्ट प्रण संहारै ॥ जब आवहिं प्रभु स्वान सवारी । चोरी आदि होय
    डर भारी ॥ तैसहि चारि चरण यह नामा । स्वर्ण लौह चाञ्जी अरु तामा ॥ लौह चरण पर जब प्रभु आवैम् । धन जन
    सम्पत्ति नष्ट करावै ॥ समता ताम्र रजत शुभकारी । स्वर्ण सर्व सुख मङ्गल कारी ॥ जो यह शनि चरित्र नित गावै
    । कबहुं न दशा निकृष्ट सतावै ॥ अदभुत नाथ दिखावैं लीला । करैं शत्रु के नशि बलि ढीला ॥ जो पण्डित सुयोग्य
    बुलवाई । विधिवत शनि ग्रह शान्ति कराई ॥ पीपल जल शनि दिवस चढावत । दीप दान दै बहु सुख पावत ॥ कहत रामसुन्दर
    प्रभु दासा । शनि सुमिरत सुख होत प्रकाशा ॥ दोहा पाठ शनिश्चर देव को की हों विमल तैयार । करत पाठ चालीस
    दिन
