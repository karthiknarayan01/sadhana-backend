id: narayanistutih
category: stotram
name:
  english: narayanistutih
  devanagari: नारायणीस्तुतिः
content:
  english: dapyayate kritsnamalanghyavirye || 4|| tvam vaishnavishaktiranantavirya vishvasya bijam paramasi
    maya | sammohitam devi samastametat tvam vai prasanna bhuvi muktihetuh || 5|| vidyah samastastava
    devi bhedah striyah samastah sakala jagatsu | tvayaikaya puritamambayaitat ka te stutih stavyaparaparoktih
    || 6|| sarvabhuta yada devi bhuktimuktipradayini | tvam stuta stutaye ka va bhavantu paramoktayah
    || 7|| sarvasya buddhirupena janasya hridi samsthite | svargapavargade devi narayani namo'stu te ||
    8|| kalakashthadirupena parinamapradayini | vishvasyoparatau shakte narayani namo'stu te || 9|| sarvamangalamangalye
    shive sarvarthasadhike | sharanye tryambake gauri narayani namo'stu te || 10|| srishtisthitivinashanam
    shaktibhute sanatani | gunashraye gunamaye narayani namo'stu te || 11|| sharanagatadinartaparitranaparayane
    | sarvasyartihare devi narayani namo'stu te || 12|| hamsayuktavimanasthe brahmanirupadharini | kaushambhahksharike
    devi narayani namo'stu te || 13|| trishulacandrahidhare mahavrishabhavahini | maheshvarisvarupena
    narayani namo'stute || 14|| mayurakukkutavrite mahashaktidhare'naghe | kaumarirupasamsthane narayani
    namo'stu te || 15|| shankhacakragadasharngagrihitaparamayudhe | prasida vaishnavirupe narayani namo'stu
    te || 16|| grihitogramahacakre damshtroddhritavasundhare | varaharupini shive narayani namo'stu te
    || 17|| nrisimharupenogrena hantum daityan kritodyame | trailokyatranasahite narayani namo'stu te
    || 18|| kiritini mahavajre sahasranayanojjvale | vritrapranahare caindri narayani namo'stu te || 19||
    shivadutisvarupena hatadaityamahabale | ghorarupe maharave narayani namo'stu te || 20|| damshtrakaralavadane
    shiromalavibhushane | camunde mundamathane narayani namo'stu te || 21|| lakshmi lajje mahavidye shraddhe
    pushti svadhe dhruve | maharatri mahamaye narayani namo'stu te || 22|| medhe sarasvati vare bhuti
    babhravi tamasi | niyate tvam prasideshe narayani namo'stute || 23|| sarvasvarupe sarveshe sarvashaktisamanvite
    | bhayebhyastrahi no devi durge devi namo'stu te || 24|| etatte vadanam saumyam locanatrayabhushitam
    | patu nah sarvabhutebhyah katyayani namo'stu te || 25|| jvalakaralamatyugramasheshasurasudanam |
    trishulam patu no bhiterbhadrakali namo'stu te || 26|| hinasti daityatejamsi svanenapurya ya jagat
    | sa ghanta patu no devi papebhyo nah sutaniva || 27|| asurasrigvasapankacarcitaste karojjvalah |
    shubhaya khadgo bhavatu candike tvam nata vayam || 28|| roganasheshanapahamsi tushta rushta tu kaman
    sakalanabhishtan | tvamashritanam na vipannaranam tvamashrita hyashrayatam prayanti || 29|| etatkritam
    yatkadanam tvayadya dharmadvisham devi mahasuranam | rupairanekairbahudhatmamurtim kritvambike tatprakaroti
    kanya || 30|| vidyasu shastreshu vivekadipe
  devanagari: दाप्यायते कृत्स्नमलङ्घ्यवीर्ये ॥ ४॥ त्वं वैष्णवीशक्तिरनन्तवीर्या विश्वस्य बीजं परमासि माया
    । सम्मोहितं देवि समस्तमेतत् त्वं वै प्रसन्ना भुवि मुक्तिहेतुः ॥ ५॥ विद्याः समस्तास्तव देवि भेदाः स्त्रियः
    समस्ताः सकला जगत्सु । त्वयैकया पूरितमम्बयैतत् का ते स्तुतिः स्तव्यपरापरोक्तिः ॥ ६॥ सर्वभूता यदा देवी
    भुक्तिमुक्तिप्रदायिनी । त्वं स्तुता स्तुतये का वा भवन्तु परमोक्तयः ॥ ७॥ सर्वस्य बुद्धिरूपेण जनस्य
    हृदि संस्थिते । स्वर्गापवर्गदे देवि नारायणि नमोऽस्तु ते ॥ ८॥ कलाकाष्ठादिरूपेण परिणामप्रदायिनि । विश्वस्योपरतौ
    शक्ते नारायणि नमोऽस्तु ते ॥ ९॥ सर्वमङ्गलमाङ्गल्ये शिवे सर्वार्थसाधिके । शरण्ये त्र्यम्बके गौरि नारायणि
    नमोऽस्तु ते ॥ १०॥ सृष्टिस्थितिविनाशानां शक्तिभूते सनातनि । गुणाश्रये गुणमये नारायणि नमोऽस्तु ते ॥
    ११॥ शरणागतदीनार्तपरित्राणपरायणे । सर्वस्यार्तिहरे देवि नारायणि नमोऽस्तु ते ॥ १२॥ हंसयुक्तविमानस्थे
    ब्रह्माणीरूपधारिणि । कौशाम्भःक्षरिके देवि नारायणि नमोऽस्तु ते ॥ १३॥ त्रिशूलचन्द्राहिधरे महावृषभवाहिनि
    । माहेश्वरीस्वरूपेण नारायणि नमोऽस्तुते ॥ १४॥ मयूरकुक्कुटवृते महाशक्तिधरेऽनघे । कौमारीरूपसंस्थाने नारायणि
    नमोऽस्तु ते ॥ १५॥ शङ्खचक्रगदाशार्ङ्गगृहीतपरमायुधे । प्रसीद वैष्णवीरूपे नारायणि नमोऽस्तु ते ॥ १६॥ गृहीतोग्रमहाचक्रे
    दंष्ट्रोद्धृतवसुन्धरे । वराहरूपिणि शिवे नारायणि नमोऽस्तु ते ॥ १७॥ नृसिंहरूपेणोग्रेण हन्तुं दैत्यान्
    कृतोद्यमे । त्रैलोक्यत्राणसहिते नारायणि नमोऽस्तु ते ॥ १८॥ किरीटिनि महावज्रे सहस्रनयनोज्ज्वले । वृत्रप्राणहरे
    चैन्द्रि नारायणि नमोऽस्तु ते ॥ १९॥ शिवदूतीस्वरूपेण हतदैत्यमहाबले । घोररूपे महारावे नारायणि नमोऽस्तु
    ते ॥ २०॥ दंष्ट्राकरालवदने शिरोमालाविभूषणे । चामुण्डे मुण्डमथने नारायणि नमोऽस्तु ते ॥ २१॥ लक्ष्मि लज्जे
    महाविद्ये श्रद्धे पुष्टि स्वधे ध्रुवे । महारात्रि महामाये नारायणि नमोऽस्तु ते ॥ २२॥ मेधे सरस्वति वरे
    भूति बाभ्रवि तामसि । नियते त्वं प्रसीदेशे नारायणि नमोऽस्तुते ॥ २३॥ सर्वस्वरूपे सर्वेशे सर्वशक्तिसमन्विते
    । भयेभ्यस्त्राहि नो देवि दुर्गे देवि नमोऽस्तु ते ॥ २४॥ एतत्ते वदनं सौम्यं लोचनत्रयभूषितम् । पातु नः
    सर्वभूतेभ्यः कात्यायनि नमोऽस्तु ते ॥ २५॥ ज्वालाकरालमत्युग्रमशेषासुरसूदनम् । त्रिशूलं पातु नो भीतेर्भद्रकालि
    नमोऽस्तु ते ॥ २६॥ हिनस्ति दैत्यतेजांसि स्वनेनापूर्य या जगत् । सा घण्टा पातु नो देवि पापेभ्यो नः सुतानिव
    ॥ २७॥ असुरासृग्वसापङ्कचर्चितस्ते करोज्ज्वलः । शुभाय खड्गो भवतु चण्डिके त्वां नता वयम् ॥ २८॥ रोगानशेषानपहंसि
    तुष्टा रुष्टा तु कामान् सकलानभीष्टान् । त्वामाश्रितानां न विपन्नराणां त्वामाश्रिता ह्याश्रयतां प्रयान्ति
    ॥ २९॥ एतत्कृतं यत्कदनं त्वयाद्य धर्मद्विषां देवि महासुराणाम् । रूपैरनेकैर्बहुधात्ममूर्तिं कृत्वाम्बिके
    तत्प्रकरोति कान्या ॥ ३०॥ विद्यासु शास्त्रेषु विवेकदीपे
