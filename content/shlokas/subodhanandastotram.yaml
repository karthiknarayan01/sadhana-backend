id: subodhanandastotram
category: stotram
name:
  english: subodhanandastotram
  devanagari: सुबोधानन्दस्तोत्रम्
content:
  english: shrisubodhanandastotram shri krishnadasatanayam sahajatabhaktim sambhu shitankanayanottaratarabalam
    | shriramakrishnakripaya kritakritya buddhim vande subodhapurusham vinayaptamurtim || 1|| lokottararjavagunam
    jitakamabhogam daivakhyaya tvabhihitam jananidyadevaih | tejasvita saralata vyavaharasiddham naumi
    dyulokavasatim madhurasvabhavam || 2|| shuddhanvayam priyajanam caritena shuddha
  devanagari: श्रीसुबोधानन्दस्तोत्रम् श्री कृष्णदासतनयं सहजातभक्तिं सम्भू षिताङ्कनयनोत्तरतारबालम् । श्रीरामकृष्णकृपया
    कृतकृत्य बुद्धिं वन्दे सुबोधपुरुषं विनयाप्तमूर्तिम् ॥ १॥ लोकोत्तरार्जवगुणं जितकामभोगं दैवाख्यया त्वभिहितं
    जननीड्यदेवैः । तेजस्विता सरलता व्यवहारसिद्धं नौमि द्युलोकवसतिं मधुरस्वभावम् ॥ २॥ शुद्धान्वयं प्रियजनं
    चरितेन शुद्ध
meaning: {}
