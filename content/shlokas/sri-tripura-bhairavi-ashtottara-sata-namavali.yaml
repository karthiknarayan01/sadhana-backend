    नमः । ॐ महामोहायै नमः । ॐ महाक्रोधायै नमः । ॐ महानद्यै नमः । ॐ महापातकसंहर्त्र्यै नमः । ॐ महामोहप्रदायिन्यै
    नमः । ॐ विकरालायै नमः । । ॐ महाकालायै नमः । ॐ कालरूपायै नमः । ॐ कलावत्यै नमः । ॐ कपालखट्वाङ्गधरायै
    नमः । ॐ खड्गखर्परधारिण्यै नमः । ॐ कुमार्यै नमः । ॐ कुङ्कुमप्रीतायै नमः । ॐ कुङ्कुमारुणरञ्जितायै नमः
    । ॐ कौमोदक्यै नमः । ॐ कुमुदिन्यै नमः । । ॐ कीर्त्यायै नमः । ॐ कीर्तिप्रदायिन्यै नमः । ॐ नवीनायै नमः
    । ॐ नीरदायै नमः । ॐ नित्यायै नमः । ॐ नन्दिकेश्वरपालिन्यै नमः । ॐ घर्घरायै नमः । ॐ घर्घरारावायै नमः
    । ॐ घोरायै नमः । ॐ घोरस्वरूपिण्यै नमः । । ॐ कलिघ्न्यै नमः । ॐ कलिधर्मघ्न्यै नमः । ॐ कलिकौतुकनाशिन्यै
    नमः । ॐ किशोर्यै नमः । ॐ केशवप्रीतायै नमः । ॐ क्लेशसङ्घनिवारिण्यै नमः । ॐ महोन्मत्तायै नमः । ॐ महामत्तायै
    नमः । ॐ महाविद्यायै नमः । ॐ महीमय्यै नमः । । ॐ महायज्ञायै नमः । ॐ महावाण्यै नमः । ॐ महामन्दरधारिण्यै
    नमः । ॐ मोक्षदायै नमः । ॐ मोहदायै नमः । ॐ मोहायै नमः । ॐ भुक्तिमुक्तिप्रदायिन्यै नमः । ॐ अट्टाट्टहासनिरतायै
    नमः । ॐ क्वणन्नूपुरधारिण्यै नमः । ॐ दीर्घदंष्ट्रायै नमः । । ॐ दीर्घमुख्यै नमः । ॐ दीर्घघोणायै नमः
    । ॐ दीर्घिकायै नमः । ॐ दनुजान्तकर्यै नमः । ॐ दुष्टायै नमः । ॐ दुःखदारिद्र्यभञ्जिन्यै नमः । ॐ दुराचारायै
    नमः । ॐ दोषघ्न्यै नमः । ॐ दमपत्न्यै नमः । ॐ दयापरायै नमः । । ॐ मनोभवायै नमः । ॐ मनुमय्यै नमः । ॐ मनुवंशप्रवर्धिन्यै
    नमः । ॐ श्यामायै नमः । ॐ श्यामतनवे नमः । ॐ शोभायै नमः । ॐ सौम्यायै नमः । ॐ शम्भुविलासिन्यै नमः ।
