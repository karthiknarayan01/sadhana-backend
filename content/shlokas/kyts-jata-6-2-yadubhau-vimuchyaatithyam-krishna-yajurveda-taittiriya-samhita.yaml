id: kyts-jata-6-2-yadubhau-vimuchyaatithyam-krishna-yajurveda-taittiriya-samhita
category: stotram
name:
  english: KYTS Jata 6.2 Yadubhau Vimuchyaatithyam - Krishna Yajurveda Taittiriya Samhita
content:
  english: ubhau vimucya vimucyobha vubhau vimucya | vimucya tithya matithyam ~vimucya vimucya tithyam
    | dgrihniya datithya matithya vi cchindyac chindyat dvi vi cchindyat | dyac chindyac chindya ubha
    vavimucya vimucyobha vubha vavimucya | avimucya yatha yatha 'vimucya vimucya yatha yatha 'nagataya
    nagataya yatha yatha 'nagataya | anagataya tithya matithya managataya nagataya tithyam | kriyata atithya
    matithya dvimukto vimukta sta 'nyo vimukto vimukto 'nyah | anyo 'nadva nanadva nanyo nbhavati bhava
    tyanadva nanadva bhava tyavimukto 'vimukto bhavati bhava tyavimuktah | 'nyo 'vimukto 'vimukto 'nyah
    | athatithya matithya mathatha tithyam | ngrihnati grihna tyatithya matithya grihnati yajnasya yajnasya
    grihnati grihnati yajnasya | yajnasya santatyai santatyai yajnasya yajnasya santatyai | santatyai
    patni patni santatyai santatyai patni patnyanvarabhate 'nvarabhate patni patnyanvarabhate | anvarabhate
    patni patnyanvarabhate 'nvarabhate patni patni hi hi patni patni hi | hi parinahyasya parinahyasya
    hi hi parinahyasya | parinahyasyesha ishe parinahyasya parinahyasyeshe parinahyasyeti pari ishe patniya
    patniyesha ishe patniya | patni yaivaiva patniya patni yaiva | eva numata manumata mevaiva numatam
    | vai patni patni vai vai patni patni yajnasya yajnasya patni patni yajnasya | yajnasya karoti karoti
    yajnasya yajnasya karoti | nkaroti karoti mithunam | atho patniyah patniya atho atho patniyah | patniya
    evaiva patniyah patniya eva | evaisha esha evaivaishah | || esha yajnasya yajnasyaisha esha yajnasya
    | 'nvarambho yajnasya yajnasya anvarambho 'navacchittya anavacchittya anvarambho 'nvarambho 'navacchittyai
    | anvarambha ityanu anavacchittyai yavadbhi ryavadbhi ranavacchittya anavacchittyai yavadbhih | anavacchittya
    ityanava yavadbhiriti yavat vai raja raja vai vai raja raja 'nucarai ranucarai raja raja 'nucaraih
    | anucarai ragaccha tyagaccha tyanucarai ranucarai ragacchati | bhya agaccha tyagacchati sarve vai
    tebhya stebhyo vai vai tebhyah | tebhya atithya matithya ntebhya stebhya atithyam | nkriyate kriyata
    atithya matithya kriyate chandagmsi chandagmsi kriyate kriyate chandagmsi | chandagmsi khalu khalu
    chandagmsi chandagmsi khalu | khalu vai vai khalu khalu vai | vai somasya somasya vai vai somasya
    | somasya rajno rajna ssomasya somasya rajnah | rajno 'nucara nyanucarani rajno rajno 'nucarani |
    anucara nyagne ragne ranucara nyanucara nyagneh | agne ratithya matithya magne ragne ratithyam | atithya
    masyasya tithya matithya masi | asi vishnave vishnave 'syasi vishnave | vishnave tva tva vishnave
    vishnave tva | tvetiti tva tveti | ityahahe tityaha | aha gayatriyai gayatriya ahaha gayatriyai |
    gayatriya evaiva gayatriyai gayatriya eva | evaite naite naivai vaitena | etena karoti karo tyete
    naitena karoti | karoti somasya somasya karoti karoti somasya | somasya tithya matithyagm somasya
    somasya tithyam | atithya masyasya tithya matithya masi | asi vishnave vishnave 'syasi vishnave |
    vishnave tva tva vishnave vishnave tva | tvetiti tva tveti | ityahahe tityaha | trishtubha ahaha trishtubhe
    trishtubha evaiva trishtubhe evaite naite naivai vaitena | etena karoti karo tyete naitena karoti
    | karo tyatithe ratitheh karoti karo tyatitheh | atithe ratithya matithya matithe ratithe ratithyam
    | atithya masyasya tithya matithya masi | asi vishnave vishnave 'syasi vishnave | vishnave tva tva
    vishnave vishnave tva | tvetiti tva tveti | ityahahe tityaha | aha jagatyai jagatya ahaha jagatyai
    | jagatya evaiva jagatyai jagatya eva | || evaite naite naivai vaitena | etena karoti karo tyete naitena
    karoti | karo tyagnaye 'gnaye karoti karo tyagnaye tva tva 'gnaye 'gnaye tva rayasposhadavamne rayasposhadavamne
    tva tva rayasposhadavamne rayasposhadavamne vishnave vishnave rayasposhadavamne rayasposhadavamne
    vishnave | rayasposhadavamna iti rayasposha vishnave tva tva vishnave vishnave tva | tvetiti tva tveti
    | ityahahe tityaha | aha nushtubhe 'nushtubha ahaha nushtubhe anushtubha evaiva nushtubhe 'nushtubha
    eva | evaite naite naivai vaitena | etena karoti karo tyete naitena karoti | karoti shyenaya shyenaya
    karoti karoti shyenaya | shyenaya tva tva shyenaya shyenaya tva | tva somabhrite somabhrite somabhrite
    vishnave vishnave somabhrite somabhrite vishnave | vishnave tva tva vishnave vishnave tva | tvetiti
    tva tveti | ityahahe tityaha | aha gayatriyai gayatriya ahaha gayatriyai | gayatriya evaiva gayatriyai
    gayatriya eva | evaite naite naivai vaitena | etena karoti karo tyete naitena karoti | karoti panca
    panca karoti karoti panca | panca kritvah kritvah panca panca kritvah | kritvo grihnati grihnati kritvah
    kritvo grihnati | kshara grihnati grihnati panca kshara panktih panktih panca panktih panktah panktah
    panktih panktih panktah | pankto yajno yajnah panktah pankto yajnah | ya~jno yajno yajnam | ava rundhe
    rundhe 'vava rundhe | rundhe brahmavadino brahmavadino rundhe rundhe brahmavadinah | brahmavadino
    vadanti vadanti brahmavadino brahmavadino vadanti | brahmavadina iti brahma dvadanti vadanti kasma
    dgayatriyai gayatriyai satya gayatriya ubhayata ubhayato gayatriyai gayatriya ubhayatah | ubhayata
    atithyasya tithya syobhayata ubhayata atithyasya | atithyasya kriyate kriyata atithyasya tithyasya
    kriyate | kriyata ititi kriyate kriyata iti | evado 'da evaivadah | ssomagm soma mado 'da soma ma
    somagm soma ma | ttasma dahara dahara dgayatriyai gayatriyai tasma gayatriya ubhayata ubhayato gayatriyai
    gayatriya ubhayatah | ubhayata atithyasya tithyasyobhayata ubhayata atithyasya | atithyasya kriyate
    kriyata atithyasya tithyasya kriyate | tkriyate kriyate purasta coparishta duparishtac ca coparishtat
    | uparishtac ca coparishta duparishtac ca | shshirashca ca shirah | dyajnasya yajna syaita deta dyajnasya
    yajnasya yat | yadatithya matithyam nnavakapalo navakapala atithya matithya navakapalah purodashah
    purodasho navakapalo navakapalah purodashah | purodasho bhavati bhavati purodashah purodasho bhavati
    | nnavadha navadha tasma shshiro navadha navadha shirah | shshiro vishyutam | nnavakapalo navakapalo
    vishyutam navakapalah purodashah purodasho navakapalo navakapalah purodashah | purodasho bhavati bhavati
    purodashah purodasho bhavati | bhavati te te bhavati bhavati te | te traya straya ste te trayah |
    traya strikapala strikapala straya straya strikapalah | trikapala strivrita trikapala strikapala strivrita
    trikapala iti tri trivrita stomena stomena trivrita trivrita stomena | sstomena stomena sammitah |
    sammita steja steja ssammita stejah | tteja steja strivrit | tteja steja strivri teja evaiva teja
    steja eva | eva yajnasya yajna syaivaiva yajnasya | yajnasya yajnasya shirshann | ndadhati dadhati
    shirsha dadhati navakapalo navakapalo dadhati dadhati navakapalah | navakapalah purodashah purodasho
    navakapalo navakapalah purodashah | purodasho bhavati bhavati purodashah purodasho bhavati | bhavati
    te te bhavati bhavati te | te traya straya ste te trayah | traya strikapala strikapala straya straya
    strikapalah | trikapala strivrita trikapala strikapala strivrita trikapala iti tri pranena pranena
    trivrita ssammitah pranena pranena sammitah | ssammita strivrit | vai pranah prano vai vai pranah
    | || mpranah prana strivrita trivrita mevaiva trivrita mprana mevaiva pranam | prana mabhipurva mabhipurva
    mprana mabhipurvam | ya~jnasya yajnasya bhipurva mabhipurvam yajnasya yajnasya shirshann | ndadhati
    dadhati shirsha dadhati prajapateh prajapate rdadhati dadhati prajapateh | rvai vai prajapateh prajapate
    prajapateriti praja va eta nyetani vai va etani | etani pakshmani pakshma nyeta nyetani pakshmani
    | tpakshmani pakshmani yat | yadashvavala ashvavala ya kshavi ashvavala ashvavala ai ashvavala ityashva
    aikshavi tirashci tirashci aikshavi ai ttirashci tirashci yat | tirashci iti tirashci yadashvavala
    ashvavalo ya ashvavalah prastarah prastara ashvavala ashvavalah prastarah | prastaro bhavati bhavati
    prastarah prastaro bhavati | kshavi bhavati bhava tyaikshavi | aikshavi tirashci tirashci aikshavi
    ai prajapateh prajapate stirashci tirashci tirashci iti tirashci prajapate revaiva prajapateh prajapate
    reva | prajapateriti praja tac cakshu shcakshu sta mbharati bharati sagm sa bharati deva deva bharati
    bharati devah | deva vai vai deva deva vai | vai ya ya vai vai yah | ahuti rajuhavu rajuhavu rahuti
    rahuti rajuhavuh | ajuhavu sta sta ajuhavu rajuhavu stah | ta asura asura sta sta asurah | nnishkava
    masura asura nishkava nnishkava madann | te deva deva ste te devah | shmarya mapashyann | apashyan
    karmanyah karmanyo 'pashya nnapashyan karmanyah | karmanyo vai vai karmanyah karmanyo vai | vai karma
    karma vai vai karma | karmai nenainena karma karmainena | enena kurvita kurvi taine nainena kurvita
    | kurvite titi kurvita kurviteti | iti te ta ititi te | shmaryamayaniti kar paridhi nakurvata kurvata
    paridhi nparidhi nakurvata | akurvata tai stai rakurvata kurvata taih | te rakshagmsi rakshagmsi te
    te rakshagmsi | rakshag syapapa rakshagmsi rakshag syapa | dyadaghnata ghnata yat | paridhayah paridhayah
    kar shmaryamaya iti kar paridhayo bhavanti bhavanti paridhayah paridhayo bhavanti | bhavanti rakshasagm
    rakshasa mbhavanti bhavanti rakshasam | rakshasa mapahatya apahatyai rakshasagm rakshasa mapahatyai
    | apahatyai sagm sa mapahatya apahatyai sam | sparshayati rakshasagm rakshasag rakshasa mananvavacaraya
    nanvavacaraya rakshasagm rakshasa mananvavacaraya | ananvavacaraya na nananvavacaraya nanvavacaraya
    na | ananvavacarayetyananu tpari pari purasta pari dadhati dadhati pari pari dadhati | dadha tyaditya
    adityo dadhati dadha tyadityah | adityo hi hyaditya adityo hi | hyevaiva hi hyeva | drakshagmsi rakshagmsi
    purasta ntyapahanti rakshagmsi rakshag syapahanti | ntyurdhve urdhve apaha urdhve samidhau samidha
    vurdhve urdhve samidhau urdhve ityurdhve | samidha va samidhau samidha va | a dadhati dadha tyadadhati
    | dadha tyuparishta duparishta ddadhati dadha tyuparishtat | uparishta devaivoparishta duparishta
    deva | eva rakshagmsi rakshag syevaiva rakshagmsi | rakshag syapapa rakshagmsi rakshag syapa | hanti
    yajusha yajusha hanti hanti yajusha | yajusha 'nya manyam ya~jusha yajusha 'nyam | ntushni manya manya
    tushni manya manya ntushni manyam | mmithunatvaya mithunatvaya nya manya mithunatvaya dve dve mithunatvaya
    mithunatvaya dve | mithunatvayeti mithuna dve a dve dve a | a dadhati dadhatya dadhati | ddadhati
    dadhati dvipat | dyajamano yajamano dvipa yajamanah pratishthityai pratishthityai yajamano yajamanah
    pratishthityai | pratishthityai brahmavadino brahmavadinah pratishthityai pratishthityai brahmavadinah
    | pratishthitya iti prati brahmavadino vadanti vadanti brahmavadino brahmavadino vadanti | brahmavadina
    iti brahma vada ntyagni ragni rvadanti vada ntyagnih | || agnishca cagni ragnishca | va eta vetau
    vai va etau | ssoma eta vetau somah | ca katha katha ca ca katha | katha somaya somaya katha katha
    somaya | somayatithya matithyagm somaya somayatithyam | kriyata atithya matithya kriyate na na kriyate
    nagnaye 'gnaye na nagnaye agnaya iti tyagnaye 'gnaya iti | agna vagni magni magna vagna vagnim | mmathitva
    mathitva 'gni magni mathitva praharati praharati mathitva mathitva praharati | praharati tena tena
    praharati praharati tena | tenaivaiva tena tenaiva | evagnaye 'gnaya evaivagnaye agnaya atithya matithya
    magnaye 'gnaya atithyam | nkriyate kriyata atithya matithya kriyate kriyate 'tho atho khalu khalvatho
    atho khalu | khalvahu rahuh khalu khalvahuh | ahu ragni ragni rahu rahu ragnih | ssarva agni ragni
    sarva devata devata devata ititi devata devata iti | havi rasadya sadya havir asadya gni magni masadya
    sadya gnim | mmanthati mantha tyagni magni manthati havyaya havyaya manthati manthati havyaya | havya
    yaivaiva havyaya havyayaiva | eva sannaya sanna yaivaivasannaya | ssarva asannaya sannaya sarvah sarva
    devata devata devata janayati janayati devata devata janayati | janayatiti janayati | || ya~tta devasura
    devasura devasura iti deva te deva deva ste te devah | deva mitho mitho deva deva mithah | mitho vipriya
    vipriya mitho mitho vipriyah | vipriya vipriya asann | 'nyasma anyasma anyo anyasmai jyaishthyaya
    jyaishthyaya nyasma anyasmai jyaishthyaya | jyaishthyaya tishthamana atishthamana jyaishthyaya jyaishthyaya
    tishthamanah | atishthamanah pancadha pancadha 'tishthamana atishthamanah pancadha | pancadha vi vi
    pancadha pancadha vi | nnagni ragni rakrama rvasubhi ragni ragni somo rudrai rudrai rudrai rindra
    indro rudrai rudrai rindrah | rmarudbhi rindra indro marudbhih | rvaruno varuno marudbhi marudbhiriti
    marut varuna adityai radityai rvaruno varuna adityaih | rbrihaspati radityai radityai te 'manyanta
    manyanta te te 'manyanta | amanyanta surebhyo 'surebhyo 'manyanta manyanta surebhyah | asurebhyo vai
    va asurebhyo 'surebhyo vai | mbhratrivyebhyo bhratrivyebhya ida mida bhratrivyebhyo raddhyamo raddhyamo
    bhratrivyebhyo bhratrivyebhyo raddhyamah | draddhyamo raddhyamo yat | mitho vipriya vipriya mitho
    mitho vipriyah | ssmo vipriya vipriya ya no no ya ya nah | na ima ima no na imah | imah priyah priya
    ima imah priyah | priya stanuva stanuvah priyah priya stanuvah | tanuva sta sta stanuva stanuva stah
    | ssamavadyamahai samavadyamahai ta sta samavadyamahai tabhya stabhyah samavadyamahai samavadyamahai
    tabhyah | samavadyamaha iti sam ssa sa tabhya stabhya dyo ya riccha driccha yo no no yo yo nah | ||
    nah prathamah prathamo no nah prathamah | 'nyah prathamah prathamo 'nyasma anyasma anyo anyasmai druhya
    ddruhya danyasma anyasmai druhya druhya dititi druhya ttasma dititi tasma ssatanunaptrinagm satanunaptrinam
    ssatanunaptrinam | ssatanunaptrinagm satanunaptrina satanunaptrinamiti sa tanunaptrinam | prathamo
    druhyati druhyati prathamah prathamo druhyati | druhyati sa sa druhyati druhyati sah | sa arti martigm
    sa sa arti arti ma ''rti marti ma | arccha tyriccha tyarcchati | dyadriccha tyricchati yat | tanunaptragm
    samavadyati samavadyati tanunaptra ntanunaptragm samavadyati | tanunaptramiti tanu samavadyati bhratrivyabhibhutyai
    bhratrivyabhibhutyai samavadyati samavadyati bhratrivyabhibhutyai | bhratrivyabhibhutyai bhavati bhavati
    bhratrivyabhibhutyai bhratrivyabhibhutyai bhavati | bhratrivyabhibhutya iti bhratrivya bhava tyatmana
    ''tmana bhavati bhava tyatmana atmana para para ''tmana ''tmana para asya bhratrivyo bhratrivyo 'syasya
    bhratrivyah | bhratrivyo bhavati bhavati bhratrivyo bhratrivyo bhavati | bhavati panca panca bhavati
    bhavati panca | panca kritvah kritvah panca panca kritvah | kritvo 'vava kritvah kritvo 'va | ava
    dyati dya tyavava dyati | dyati pancadha pancadha dyati dyati pancadha | pancadha hi hi pancadha pancadha
    hi | thsamavadyanta samavadyanta ta samavadyantatho atho samavadyanta samavadyantatho samavadyanteti
    sam kshara 'tho atho panca kshara panktih panktih panca panktih panktah panktah panktih panktih panktah
    | pankto yajno yajnah panktah pankto yajnah | ya~jno yajno yajnam | ava rundhe rundhe 'vava rundhe
    | rundha apataya apataye rundhe rundha apataye | apataye tva tva ''pataya apataye tva | tva grihnami
    grihnami tva tva grihnami | grihnamititi grihnami grihnamiti | ityahahe tityaha | aha pranah prana
    ahaha pranah | prano vai vai pranah prano vai | mprana mapati rapatih pranam | prana mevaiva prana
    eva prinati prina tyevaiva prinati | prinati paripataye paripataye prinati prinati paripataye | paripataya
    ititi paripataye paripataya iti | ityahahe tityaha | aha mano mana ahaha manah | mano vai vai mano
    mano vai | vai paripatih paripati rmano manah paripatih paripati mana evaiva mano mana eva | eva prinati
    prina tyevaiva prinati | prinati tanunaptre tanunaptre prinati prinati tanunaptre tanunaptra ititi
    tanunaptre tanunaptra iti | tanunaptra iti tanu ityahahe tityaha | aha tanuva stanuva ahaha tanuvah
    | tanuvo hi hi tanuva stanuvo hi | te ta sta ste te tah | ssamavadyanta samavadyanta ta sta samavadyanta
    shakvaraya shakvaraya samavadyanta samavadyanta shakvaraya | samavadyanteti sam shakvaraye titi shakvaraya
    shakvarayeti | ityahahe tityaha | aha shaktyai shaktya ahaha shaktyai shaktyai hi hi shaktyai shaktyai
    hi | te ta sta ste te tah | ssamavadyanta samavadyanta ta sta samavadyanta shakma thsamavadyanta samavadyanta
    shakmann | samavadyanteti sam nnojishtha yaujishthaya shakma ojishthaye tityojishtha yaujishthayeti
    | ityahahe tityaha | ahaujishtha mojishtha maha haujishtham | ojishthagm hi hyojishtha mojishthagm
    hi | tadatmana atmana sta atmanah samavadyanta samavadyanta tmana atmanah samavadyanta | samavadyanta
    nadhrishta manadhrishtagm samavadyanta samavadyanta nadhrishtam | samavadyanteti sam anadhrishta masya
    syanadhrishta manadhrishta masi | asyanadhrishya manadhrishya masya syanadhrishyam | anadhrishya miti
    tyanadhrishya manadhrishya miti | ityahahe tityaha | ahanadhrishta manadhrishta mahaha nadhrishtam
    | anadhrishtagm hi hyanadhrishta manadhrishtagm hi | hye tadeta ddhi hyetat | eta danadhrishya manadhrishya
    meta deta danadhrishyam | ndevana manadhrishya manadhrishya devana moja ojo devana oja iti tyoja oja
    iti | || ityahahe tityaha | ndevana mahaha devana devanagm hi hi devana hyeta deta ddhi hyetat | eta
    doja oja eta deta dojah | ojo 'bhishastipa abhishastipa oja ojo 'bhishastipah | abhishastipa anabhishastenya
    manabhishastenya mabhishastipa abhishastipa anabhishastenyam | abhishastipa ityabhishasti anabhishastenya
    mitityanabhishastenya manabhishastenya miti | anabhishastenyamityanabhi ityahahe tityaha | aha bhishastipa
    abhishastipa ahaha bhishastipah | abhishastipa hi hyabhishastipa abhishastipa hi | abhishastipa ityabhishasti
    hye tadeta ddhi hyetat | eta danabhishastenya manabhishastenya meta deta danabhishastenyam | anabhishastenya
    man van vanabhishastenya manabhishastenya manu | anabhishastenyamityanabhi anu me me 'nvanu me | mme
    me diksham | dikshapatiriti diksha manyata mititi manyata ityahahe tityaha | ryathayaju rahaha yathayajuh
    | yathayaju revaiva yathayaju evaita deta devai vaitat | vai deva deva vai vai devah | nkritva kritva
    vajram kritva somagm soma nkritva kritva soma nthsomagm soma maghnann | nnantika mantika maghna antika
    mive vantika mantika miva | iva khalu khalviveva khalu | khalu vai vai khalu khalu vai | va asyasya
    vai va asya | asyaita deta dasya syaitat | etac caranti cara ntyeta detac caranti | dyac caranti caranti
    yat | ttanunaptrena tanunaptrena ya tanunaptrena pracaranti pracaranti tanunaptrena tanunaptrena pracaranti
    | tanunaptreneti tanu pracara ntyagmshuragmshu ragmshuragmshuh pracaranti pracara ntyagmshuragmshuh
    | agmshuragmshu ste te agmshuragmshu ragmshuragmshu ste | agmshuragmshurityagmshuh te deva deva te
    te deva | deva soma soma deva deva soma | mpyayata ma pyayatam | pyayata mititi pyayata ityahahe tityaha
    | asya puvayate 'puvayate dyadapuvayate 'puvayate yat | nmiyate miyate tat | a pyayayati pyayayatya
    pyayayati | pyayayatya pyayayati pyayayatya | tubhya mindra indra stubhya ntubhya mindrah | mpyayata
    mindra indrah pyayatam | pyayata ma pyayata tva mindra yendraya tva indraya pyayasva pyaya svendra
