id: kys-jata-1-8-anumatyai-purodaasamashtakapalam-krishna-yajurveda-taittiriya-samhita
category: stotram
name:
  english: KYS Jata 1.8 Anumatyai Purodaasamashtakapalam - Krishna Yajurveda Taittiriya Samhita
content:
  english: mpurodasha manumatya anumatyai purodasha purodasha mashtakapala mashtakapala mpurodasha mashtakapalam
    | rnirashtakapala mashtakapala ashtakapalamityashta rvapati vapati dhenuh | rdakshina dakshina dhenu
    dakshina ye ye dakshina dakshina ye | ye pratyancah pratyanco ye ye pratyancah | shshamyayah pratyancah
    pratyanca shamyaya avashiyante 'vashiyante shamyaya shshamyaya avashiyante | nta mavashiyante 'vashiyante
    tam | nairrita mekakapala mekakapala nkrishna mekakapala mekakapala va~so vasah krishnatusham | ndakshina
    dakshina krishnatusha krishnatushamiti krishna dakshina vi vi dakshina dakshina vi | ihi svaha sva
    hehihi svaha svaha ''huti mahutigg svaha svaha ''hutim | njushano jushana ahuti mahuti jushana esha
    esha jushano jushana eshah | esha te ta esha esha te te nirrite nirrite te te nirrite | nirrite bhago
    bhago nir bhago bhute bhute bhago bhago bhute bhute havishmati havishmati bhute bhute havishmati |
    havishma tyasyasi havishmati havishma tyasi | asi munca munca syasi munca | mmunca munce mam | ima
    magmhaso 'gmhasa ima mima magmhasah | ssvaha svaha 'gmhaso 'gmhasa ssvaha svaha namah | namo yo yo
    namo namo yah | ncakara cakare da mida caka raditya maditya ncakara caka radityam | ncaru maditya
    maditya vapati varo varo vapati vapati varah | varo dakshina dakshina varo varo dakshina | dakshina
    ''gnavaishnava ma ndakshina dakshina ''gnavaishnavam | agnavaishnava mekadashakapala mekadashakapala
    magnavaishnava ma gnavaishnava mekadashakapalam | agnavaishnavamitya va~mano vamana ekadashakapala
    mekadashakapalam ekadashakapalamityekadasha vamano vahi vahi vamano vamano vahi | vahi dakshina dakshina
    vahi vahi dakshina | dakshina 'gnishomiya magnishomiya ndakshina dakshina 'gnishomiya agnishomiya
    mekadashakapala mekadashakapala magnishomiya magnishomiya mekadashakapalam | agnishomiyamityagni ekadashakapalagm
    hiranyagm hiranya mekadashakapala mekadashakapalagm hiranyam | ekadashakapalamityekadasha ndakshina
    dakshina hiranyagm hiranya dakshinaindra maindra ndakshina dakshinaindram | aindra mekadashakapala
    mekadashakapala maindra maindra mekadashakapalam | ekadashakapala mrishabha rishabha ekadashakapala
    mekadashakapala mrishabhah | ekadashakapalamityekadasha rishabho vahi vahyrishabha rishabho vahi |
    vahi dakshina dakshina vahi vahi dakshina | dakshina ''gneya ma ndakshina dakshina ''gneyam | agneya
    mashtakapala mashtakapala magneya ma gneya mashtakapalam | ashtakapala maindra maindra mashtakapala
    mashtakapala maindram | ashtakapalamityashta ndadhi dadhyaindra maindra dadhyrishabha rishabho dadhi
    dadhyrishabhah | rishabho vahi vahyrishabha rishabho vahi | vahi dakshina dakshina vahi vahi dakshina
    | dakshinaindragna mai ndakshina dakshi naindragnam | ndvadashakapala maindragna mai dvadashakapalamiti
    dvadasha vaishvadevamiti vaishva mprathamajah prathamaja shcaru prathamajo vathso vathsah prathamajah
    prathamajo vathsah | prathamaja iti prathama vathso dakshina dakshina vathso vathso dakshina | dakshina
    saumyagm saumya ndakshina dakshina saumyam | shyamakagm saumyagm saumyagg vaso dakshina dakshina vaso
    vaso dakshina | dakshina sarasvatyai sarasvatyai dakshina dakshina sarasvatyai | ncarugm sarasvatyai
    sarasvatyai carum | carugm sarasvate sarasvate caru ncarugm sarasvate | ncarugm sarasvate sarasvate
    carum | mmithunau mithunau caru mithunau gavau gavau mithunau mithunau gavau gavau dakshina dakshina
    gavau gavau dakshina | dakshineti dakshina | || agneya mashtakapala mashtakapala magneya ma gneya
    mashtakapalam | rnirashtakapala mashtakapala ashtakapalamityashta vapati saumyagm saumyam va~pati
    vapati saumyam | ncarugm saumyagm saumya carugm savitragm savitra ncarugm savitram | ndvadashakapalagm
    savitragm savitra dvadashakapalagm sarasvatagm sarasvata ndvadashakapalagm sarasvatam | dvadashakapalamiti
    dvadasha ncarugm sarasvatagm sarasvata marutagm saptakapalagm saptakapala mmarutagm saptakapalam |
    shvadevigm saptakapalagm saptakapalam saptakapalamiti sapta vaishvadevi mamiksha mamiksham vaishvadevimiti
    vaishva ndyavaprithivya mamiksha mamiksha dyavaprithivya mekakapala mekakapala ndyavaprithivya mekakapalam
    | dyavaprithivyamiti dyava aindragna mekadashakapala mekadashakapala maindragna mai ndragna mekadashakapalam
    | mmaruti mekadashakapala mekadashakapala ekadashakapalamityekadasha maruti mamiksha mamiksha mmaruti
    mamiksha va~runi mamiksha mamiksham varuni mamiksha mamiksham nkaya mamiksha mamiksha kaya mekakapala
    mekakapala npraghasya nekakapala mekakapala havamahe havamahe praghasya praghasyaniti pra havamahe
    maruto maruto havamahe havamahe marutah | maruto yajnavahaso yajnavahaso maruto maruto yajnavahasah
    | yajnavahasah karambhena karambhena yajnavahaso yajnavahasah karambhena | yajnavahasa iti yajna ssajoshasah
    karambhena karambhena sajoshasah | na indre ndra no na indra | indra prithsu prithsvindre ndra prithsu
    | prithsu deva deva prithsu prithsu deva | deva stva stu deva deva stu | astu sma sma stva stu sma
    | sma te te sma sma te | nte te shushminn | nnavaya 'vaya shushmi mahi hi hi mahi mahi hi | hyasyasya
    hi hyasya | asya midhusho midhusho midhusho yavya yavya midhusho midhusho yavya | havishmato maruto
    maruto havishmato havishmato marutah | maruto vandate vandate maruto maruto vandate | rvandate vandate
    gih | dgrame grame yat | dyadaranye 'ranye yat | thsabhayagm sabhayam thsabhayagm sabhayam yadindriya
    indriye ya yac chudre shudre ya dyac chudre shudre yat | arya ena eno 'rye ena shcakrima cakrimaina
    ena shcakrima | ncakrima cakrima vayam | ekasya dhya dhyeka syaikasya dhi | adhi dharmani dharma nyadhya
    dhi dharmani | dharmani tasya tasya dharmani dharmani tasya | tasya vayajana mavayajana ntasya tasya
    vayajanam | avayajana masyasya vayajana mavayajana masi | asi svaha svaha akran karma karmakra karma
    karmakritah karmakritah karma karma karmakritah | karmakritah saha saha karmakritah karmakritah saha
    | karmakrita iti karma saha vaca vaca saha saha vaca | vaca mayobhuva mayobhuva vaca vaca mayobhuva
    | devebhyah karma karma devebhyo devebhyah karma | karma kritva kritva karma karma kritva | nkritva
    kritva 'sta mpra prasta masta pre te ta pra pre ta | ssudanava ite ta sudanavah | agnaye 'nikavate
    'nikavate 'gnaye 'gnaye 'nikavate | mpurodasha manikavate 'nikavate purodasha purodasha mashtakapala
    mashtakapala mpurodasha mashtakapalam | rnirashtakapala mashtakapala ashtakapalamityashta vapati sakagm
    sakam va~pati vapati sakam | sakagm suryena suryena sakagm sakagm suryena | surye nodyato dyata suryena
    suryenodyata | udyata marudbhyo marudbhya udyatodyata marudbhyah | marudbhyah santapanebhyah santapanebhyo
    marudbhyo marudbhyah santapanebhyah | marudbhya iti marut santapanebhyo maddhyandine maddhyandine
    santapanebhyah santapanebhyo maddhyandine | santapanebhya iti sam mmaddhyandine maddhyandine carum
    | mmarudbhyo marudbhya shcaru marudbhyo grihamedhibhyo grihamedhibhyo marudbhyo marudbhyo grihamedhibhyah
    | marudbhya iti marut ssarvasagm sarvasa ngrihamedhibhyo grihamedhibhya grihamedhibhya iti grihamedhi
    ndugdhe dugdhe sarvasagm sarvasa dugdhe sayagm saya ndugdhe dugdhe sayam | ncarugm sayagm saya mpurna
    purna caru purna darvi darvi purna purna darvi | darvi para para darvi darvi para para pata pata para
    para pata | puna ra punah puna ra | vasneve va vasna vasneva | iva vi vive va vi | vi krinavahai krinavahai
    vi vi krinavahai | krinavaha isha misha nkrinavahai krinavaha isha isha murja murja misha misha murja
    urjagm shatakrato shatakrato urja murjagm shatakrato | dehi me me dehi dehi me me dadami dadami me
    me dadami | dadami te te dadami dadami te | te ni ni te te ni | me dhehi dhehi me me dhehi | dhehi
    ni ni dhehi dhehi ni | te dadhe dadhe te te dadhe | me hara hara me me hara | nniharagm hara hara
    nihara ni harami harami ni ni harami | harami te te harami harami te | marudbhyah kridibhyah kridibhyo
    marudbhyo marudbhyah kridibhyah | marudbhya iti marut kridibhyah purodasha nkridibhyah kridibhyah
    purodasha kridibhya iti kridi purodashagm saptakapalagm saptakapala mpurodashagm saptakapalam | ssaptakapalagm
    saptakapala saptakapalamiti sapta vapati sakagm sakam va~pati vapati sakam | sakagm suryena suryena
    sakagm sakagm suryena | surye nodyato dyata suryena suryenodyata | udyata ''gneya ma gneya mudyato
    dyata ''gneyam | agneya mashtakapala mashtakapala magneya ma gneya mashtakapalam | rnirashtakapala
    mashtakapala ashtakapalamityashta vapati saumyagm saumyam va~pati vapati saumyam | ncarugm saumyagm
    saumya carugm savitragm savitra ncarugm savitram | ndvadashakapalagm savitragm savitra dvadashakapalagm
    sarasvatagm sarasvata ndvadashakapalagm sarasvatam | dvadashakapalamiti dvadasha ncarugm sarasvatagm
    sarasvata aindragna mekadashakapala mekadashakapala maindragna mai ndragna mekadashakapalam | ekadashakapala
    maindra maindra mekadashakapala mekadashakapala maindram | ekadashakapalamityekadasha ncaru maindra
    maindra vaishvakarmana mekakapala mekakapalam shvakarmana mekakapalam | vaishvakarmanamiti vaishva
    somaya pitrimate pitrimate somaya somaya pitrimate pitrimate purodasha mpitrimate pitrimate purodasha
    purodashagm shatkapalagm shatkapala mpurodashagm shatkapalam | rnishshatkapalagm shatkapala vapati
    pitribhyah pitribhyo vapati vapati pitribhyah | hishadbhyah pitribhyah pitribhyo bar pitribhya iti
    pitri barhishadbhyo dhana dhana bar hishadbhyo dhanah | barhishadbhya iti bar dhanah pitribhyah pitribhyo
    dhana dhanah pitribhyah | 'gnishvattebhyah pitribhyah pitribhyo 'gnishvattebhyah | pitribhya iti pitri
    agnishvattebhyo 'bhivanyaya abhivanyaya agnishvattebhyo 'gnishvattebhyo 'bhivanyayai | agnishvattebhya
    ityagni abhivanyayai dugdhe dugdhe 'bhivanyaya abhivanyayai dugdhe | abhivanyaya ityabhi ndugdhe dugdhe
    mantham | te tata tata te te tata | tata ye ye tata tata ye | anveta deta danvan vetat | te pitamaha
    pitamaha te te pitamaha | pitamaha prapitamaha prapitamaha pitamaha pitamaha prapitamaha | prapitamaha
    ye ye prapitamaha prapitamaha ye | prapitamaheti pra anvatra tranvanvatra | atra pitarah pitaro 'tratra
    pitarah | mpitarah pitaro yathabhagam | mandaddhvagm susandrishagm susandrisha mmandaddhvagm susandrisha
    ntva tva susandrishagm susandrisha nmandishimahi mandishimahi maghava mandishimahiti mandishimahi
    | mpurnavandhurah purnavandhuro nuna sstutah purnavandhurah purnavandhura purnavandhura iti purna
    stuto yasi yasi stuta vashagm anvanu vashan yoja nu nu yoja yoja nu | nvindre ndra nu nvindra | indra
    te ta indre ndra te | te hari hari te te hari nnamimadanta mimadantaksha amimadanta hi hyamimadanta
    mimadanta hi | ava priyah priya avava priyah | priya adhushata dhushata priyah priya adhushata | ssvabhanavo
    'stoshata stoshata svabhanavah | svabhanavo vipra vipra ssvabhanavo viprah vipra navishthaya navishthaya
    vipra vipra navishthaya | navishthaya mati mati navishthaya navishthaya mati | yoja nu nu yoja yoja
    nu | nvindre ndra nu nvindra | indra te ta indre ndra te | te hari hari te te hari npitarah pitaro
    'ksha pitaro 'mimadanta mimadanta pitarah pitaro 'mimadanta | amimadanta pitarah pitaro 'mimadanta
    mimadanta pitarah | pitaro 'titripanta titripanta pitarah pitaro 'titripanta | atitripanta pitarah
    pitaro 'titripanta titripanta pitarah | pitaro 'mimrijanta mimrijanta pitarah pitaro 'mimrijanta |
    amimrijanta pitarah pitaro 'mimrijanta mimrijanta pitarah | pitara iti pitarah | parete ta para pareta
    | ita pitarah pitara ite ta pitarah | ssomyah pitarah pitara ssomya gambhiraih | gambhiraih pathibhih
    pathibhi rgambhiraih pathibhih | pathibhih purvyaih purvyaih pathibhih pathibhih purvyaih | purvyairiti
    purvyaih | npitri nathatha pitrin | nthsuvidatran | suvidatragm apyapi suvidatra nthsuvidatragm api
    | suvidatraniti su ita yamena yamene te ta yamena | yamena ye ye yamena yamena ye | ye sadhamadagm
    sadhamadam mmadanti madanti sadhamadagm sadhamada madantiti madanti | mano nu nu mano mano nu | a
    huvamahe huvamaha a huvamahe | huvamahe narashagmsena narashagmsena huvamahe huvamahe narashagmsena
    | narashagmsena stomena stomena narashagmsena narashagmsena stomena | stomena stomena pitrinam | rmanmabhishca
    ca manmabhih | na etvetu no na etu | etu mano mana etvetu manah | punah kratve kratve punah punah
    kratve kratve dakshaya dakshaya kratve kratve dakshaya | dakshaya jivase jivase dakshaya dakshaya
    jivase jyokca ca jyog jyokca | ca suryagm surya ndrishe drishe suryagm surya nah pitarah pitaro no
    nah pitarah | pitaro mano manah pitarah pitaro manah | mano dadatu dadatu mano mano dadatu | dadatu
    daivyo daivyo dadatu dadatu daivyah | daivyo jano jano daivyo daivyo janah | vratagm sacemahi sacemahi
    vratam sacemahiti sacemahi | yadantariksha mantariksham mprithivi mantariksha mantariksha prithivi
    mutota prithivi ndya mutota dyam | va jihigmsima jihigmsima va va jihigmsima | jihigmsimeti jihigmsima
    | rma ma 'gni ragni tasma denasa enasa stasma hapatya enasa enaso gar hapatyah pra pra gar pra muncatu
    muncatu pra pra muncatu | muncatu durita durita muncatu muncatu durita | durita yani yani durita durita
    yani | yani cakrima cakrima yani yani cakrima | cakrima karotu karotu cakrima cakrima karotu | nkarotu
    karotu mam | pratipurusha mekakapala nekakapala mpratipurusha mekakapalan | pratipurushamiti prati
    rnirekakapala nekakapala eka matirikta matirikta meka meka matiriktam | ya~vanto yavanto 'tirikta
    matiriktam yavanto grihya grihya yavanto yavanto grihyah ssmo grihya grihya sma stebhya stebhya ntebhya
    stebhyah kam | pashunagm sharma sharma pashuna mpashunagm sharma | syasi sharma sharmasi | sharma
    yajamanasya yajamanasya sharma sharma yajamanasya | yajamanasya sharma sharma yajamanasya yajamanasya
    sharma | sharma me me sharma sharma me | me yaccha yaccha me me yaccha | yacchaika eko yaccha yacchaikah
    | eka evaivaika eka eva | eva rudro rudra evaiva rudrah | rudro na na rudro rudro na | na dvitiyaya
    dvitiyaya na na dvitiyaya | dvitiyaya tasthe tasthe dvitiyaya dvitiyaya tasthe | tastha akhu rakhu
    stasthe tastha akhuh | akhuste ta akhu rakhuste te rudra rudra te te rudra | rudra pashuh pashu rudra
    rudra pashuh | mpashuh pashu stam | jushasvaisha esha jushasva jushasvaishah | esha te ta esha esha
    te te rudra rudra te te rudra | rudra bhago bhago rudra rudra bhagah | ssaha saha bhago bhaga saha
    svasra svasra saha saha svasra svasra mbikaya mbikaya svasra svasra mbikaya | nta mambikaya mbikaya
    tam | njushasva jushasva bheshajam | gave 'shvaya shvaya gave gave 'shvaya | ashvaya purushaya purushaya
    shvaya shvaya purushaya | mpurushaya purushaya bheshajam | bheshaja matho atho bheshaja atho asmabhya
    masmabhya matho atho asmabhya mbheshaja masmabhya masmabhya bheshajagm subheshajagm subheshaja mbheshajagm
    subheshajam | ya~tha yatha subheshajagm subheshajam yatha 'satyasati yatha yatha 'sati | mmeshaya
    meshaya sugagm suga meshaya meshyai meshyai meshaya meshaya meshyai meshya avava meshyai meshya ava
    | amba rudragm rudra mamba mba rudram | rudra madima hyadimahi rudragm rudra madimahi | adimahya vava
    dimahya dimahyava | ndeva mavava devam | tryambakamiti tri yatha no no yatha yatha nah | yatha no
    no yatha yatha nah | no vasyaso vasyaso no no vasyasah | dvasyaso vasyasah karat | yatha no no yatha
    yatha nah | nah pashumatah pashumato no nah pashumatah | tpashumatah pashumatah karat | yatha no no
    yatha yatha nah | vyavasayayaditi vi ya~jamahe yajamahe tryambaka tryambakamiti tri yajamahe sugandhigm
    sugandhim ya~jamahe yajamahe sugandhim | mpushtivardhanagm sugandhigm sugandhi mpushtivardhanam |
    pushtivardhanamiti pushti urvaruka mive vorvaruka murvaruka miva | dbandhanadive va bandhanat | rmukshiya
    mukshiya mrityo mukshiya ma ma mukshiya mukshiya ma | esha te ta esha esha te te rudra rudra te te
    rudra | rudra bhago bhago rudra rudra bhagah | mbhago bhaga stam | jushasva tena tena jushasva jushasva
    tena | tena vasena vasena tena tena vasena | avasena parah paro 'vasena vasena parah | paro mujavato
    mujavatah parah paro mujavatah | mujavato 'tyati mujavato mujavato 'ti | atihi hyatyatihi | ihya vatatadhanva
    'vatatadhan vehi hyavatatadhanva | avatatadhanva pinakahastah pinakahasto 'vatatadhanva 'vatatadhanva
    pinakahastah | pinakahastah krittivasah krittivasah pinakahastah pinakahastah krittivasah | pinakahasta
    iti pinaka krittivasa iti kritti ndvadashakapala maindragna mai dvadashakapalamiti dvadasha vaishvadevamiti
    vaishva caru mindraye ndraya caru indraya shunasiraya shunasiraye ndraye ndraya shunasiraya | shunasiraya
    purodasha mpurodashagm shunasiraya shunasiraya purodasha dvadashakapalamiti dvadasha mpayah payo vayavyam
    payah sauryagm saurya mpayah payah sauryam | saurya mekakapala mekakapalagm sauryagm saurya mekakapalam
    | ndvadashagava mekakapala mekakapala dvadashagavagm siragm sira dvadashagavamiti dvadasha ndakshina
    dakshina siragm sira dakshina ''gneya ma ndakshina dakshina ''gneyam | agneya mashtakapala mashtakapala
    magneya ma gneya mashtakapalam | rnirashtakapala mashtakapala ashtakapalamityashta vapati raudragm
    raudram va~pati vapati raudram | ngavidhukagm raudragm raudra caru maindra maindra ndadhi dadhyaindra
    maindra ndadhi dadhi varunam | va~hini vahini caru rvahini vahini dhenuh | rdakshina dakshina dhenu
    dakshina ye ye dakshina dakshina ye | ye deva deva ye ye devah | devah purassadah purassado deva devah
    purassadah | trah purassadah purassado 'gnine purassada iti purah tra dakshinasado dakshinasado 'gnine
    tra dakshinasado dakshinasado yamane dakshinasada iti dakshina trah pashcathsadah pashcathsado yamane
    trah pashcathsadah | pashcathsadah savitrine trah pashcathsadah pashcathsadah savitrine pashcathsada
    iti pashcat tra uttarasada uttarasadah savitrine uttarasado varunanetra varunanetra uttarasada uttarasado
    varunanetrah | uttarasada ityuttara varunanetra uparishada uparishado varunanetra varunanetra uparishadah
    | varunanetra iti varuna uparishado brihaspatinetra brihaspatinetra uparishada uparishado brihaspatinetrah
    | uparishada ityupari brihaspatinetra rakshohano rakshohano brihaspatinetra brihaspatinetra rakshohanah
    | brihaspatinetra iti brihaspati rakshohanaste te rakshohano rakshohanaste | rakshohana iti rakshah
    te no na ste te nah | nah pantu pantu no nah pantu | te no na ste te nah | no 'va ntva vantu no no
    'vantu | avantu tebhya stebhyo 'va ntvavantu tebhyah | tebhyo namo nama stebhya stebhyo namah | ||
    nama stebhya stebhyo namo nama stebhyah | ssvaha svaha tebhya stebhya svaha samudhagm samudhagg svaha
    svaha samudham | samudhagm raksho raksha ssamudhagm samudhagm rakshah | ssandagdhagm sandagdhagm raksho
    raksha sandagdhagm raksho raksha ssandagdhagm sandagdhagm rakshah | raksha ida midagm raksho raksha
    idam | ida maha maha mida mida maham | ahagm raksho raksho 'ha mahagm rakshah | raksho 'bhyabhi raksho
    raksho 'bhi | abhi sagm sa mabhyabhi sam | ndahami dahami sagm sa daha myagnaye 'gnaye dahami daha
    myagnaye agnaye rakshoghne rakshoghne 'gnaye 'gnaye rakshoghne | rakshoghne svaha svaha rakshoghne
    rakshoghne svaha rakshoghna iti rakshah svaha yamaya yamaya svaha svaha yamaya | yamaya savitre savitre
    yamaya yamaya savitre | savitre varunaya varunaya savitre savitre varunaya | varunaya brihaspataye
