    ॥ १९॥ दुर्वाससो मुनेर्मोहे कार्तिक्यां रासमण्डले । ततः पृष्टवती राधा सन्देहभेदमात्मनः ॥ २०॥ निरञ्जनात्समुत्पन्नं
