id: varahamukhistava
category: stotram
name:
  english: varahamukhistava
  devanagari: वराहमुखीस्तव
content:
  english: skhalitamatibhirbhutapretaih svayam vriyate shriya | kshapayati ripunishte vacam rane labhate
    jayam vashayati jagat sarvam varahi yastvayi bhaktiman || 2|| stimitagatayah sidadvacah paricyutahetayah
    kshubhitahridayah sadyo nashyaddrisho galitaujasah | bhayaparavasha bhagnotsahah parahatapaurusha
    bhagavati purastvadbhaktanam bhavanti virodhinah || 3|| kisalayamridurhastah klishyate kandukalilaya
    bhagavati mahabharah kridasaroruhameva te | tadapi musalam dhatse haste halam samayadruham harasi
    ca tadaghataih prananaho tava sahasam || 4|| janani niyatasthane tvadvamadakshinaparshvayo
  devanagari: स्खलितमतिभिर्भूतप्रेतैः स्वयं व्रियते श्रिया । क्षपयति रिपूनीष्टे वाचां रणे लभते जयं वशयति
    जगत् सर्वं वाराहि यस्त्वयि भक्तिमान् ॥ २॥ स्तिमितगतयः सीदद्वाचः परिच्युतहेतयः क्षुभितहृदयाः सद्यो
    नश्यद्दृशो गलितौजसः । भयपरवशा भग्नोत्साहाः पराहतपौरुषा भगवति पुरस्त्वद्भक्तानां भवन्ति विरोधिनः ॥
    ३॥ किसलयमृदुर्हस्तः क्लिश्यते कन्दुकलीलया भगवति महाभारः क्रीडासरोरुहमेव ते । तदपि मुसलं धत्से हस्ते
    हलं समयद्रुहां हरसि च तदाघातैः प्राणानहो तव साहसम् ॥ ४॥ जननि नियतस्थाने त्वद्वामदक्षिणपार्श्वयो
