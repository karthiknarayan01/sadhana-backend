id: sahasranamastotram
category: sahasranama
name:
  english: sahasranamastotram
  devanagari: सहस्रनामस्तोत्रम्
content:
  english: ringapurasthayi suresharcitavaibhavah || 94|| dvarakapithasamvasi padmapadarcitanghrikah |
    jagannathapurasthayi totakacaryasevitah || 95|| jyotirmathalayasthayi hastamalakapujitah | vidyabhogayashomokshayogalingapratishthitah
    || 96|| pancalingapratishthayi dvadashalingasamsthitah | kolacalapurasthayi kameshinagareshvarah ||
    97|| jvalamukhimukhasthayi shrishailakritavasakah | lankeshvarah kumarishah kashisho mathureshvarah
    || 98|| malayadrishirovasi malayanilasevitah | shonadrishikhararudhah shonadrishapriyankarah || 99||
    jambuvanantamadhyastho valmikapuramadhyagah | pancashatpithanilayo pancashadaksharatmakah || 100||
    ashtottarashatakshetro'shtottarashatapujitah | ratnashailakritavasah shuddhajnanapradayakah || 101||
    shatakumbhagiristhayi shatakumbhodarasthitah | gomayapratimavishtah shvetarkatanupujitah || 102||
    haridrabimbasuprito nimbabimbasupujitah | ashvatthamulasamsthayi vatavrikshadharasthitah || 103||
    nimbavrikshasya mulasthah pratigramadhidaivatam | ashvatthanimbasamyoge priyalingitamurtikah || 104||
    gambijarupa ekarno ganadhyaksho ganadhipah | glaimbijakhyo ganeshano gonkara ekavarnakah || 105||
    virirupo vighnahanta drishtadrishtaphalapradah | patnivarangasatpanih sindurabhah kapalabhrit || 106||
    lakshmiganesho hemabha ekonatrimshadaksharah | vamangavishtalakshmiko mahashripravidhayakah || 107||
    tryaksharah shaktiganapah sarvasiddhiprapurakah | caturaksharashaktisho hemacchayastrinetrakah ||
    108|| kshipraprasadapanktyarno raktabhah kalpavallibhrit | pancavaktrah simhavaho herambashcaturarnakah
    || 109|| subrahmanyaganeshano dhatvarnah sarvakamadah | arunabhatanushrikah kukkutodyatkaranvitah
    || 110|| ashtavimshativarnatmamantrarajasupujitah | gandharvasiddhasamsevyo vyaghradvipadibhikarah
    || 111|| mantrashastramahodanvatsamudyatakalanidhih | janasambadhasammohi navadravyavisheshakah ||
    112|| kamanabhedasamsiddhavividhadhyanabhedakah | caturavrittisantriptiprito'bhishtasamarpakah ||
    113|| candracandanakashmirakasturijalatarpitah | shundagrajalasantriptikaivalyaphaladayakah || 114||
    shirahkritapayastriptisarvasampadvidhayakah | guhyadeshamadhudravyasantriptya kamadayakah || 115||
    netradvayamadhudravyatriptyakrishtividhayakah | prishthadeshaghritadravyatriptibhupavashankarah ||
    116|| erandatailasantriptirandakarshakanabhikah | uruyugmakatailiyatarpanatipramoditah || 117|| pritipravardhakamsiyapayah
    payahpratarpanah | dharmavardhakatundiyadravyatrayasutarpanah || 118|| ashtadravyahutiprito vividhadravyahomakah
    | brahmamuhurtanishpannahomakarmaprasaditah || 119|| madhudravyakahomena svarnasamriddhivardhakah
    | godugdhakritahomena gosamriddhividhayakah || 120|| ajyahutihomena lakshmilasavilasakah | sharkarahutihomena
    kashthashtakayashahpradah || 121|| dadhidravyakahomena sarvasampattidayakah | shalyannakritahomenannasamriddhivitarakah
    || 122|| satandulatilahutya dravyakadambapurakah | lajahutikahomena digantavyapikirtidah || 123||
    jatiprasunahomena medhaprajnaprakashakah | durvatrikiyahomena purnayuhpratipadakah || 124|| supitasumahomena
    vairibhupatishikshakah | vibhitakasamiddhomaih stambhoccatanasiddhidah || 125|| apamargasamiddhomaih
    panyayoshavashankarah | erandakasamiddhomaih randasanghavashankarah || 126|| nimbadrudalahomena vidveshanavidhayakah
    | ghritaktadaugdhashalyannahomairishtaphalapradah || 127|| tiladicaturahutya sarvapranivashankarah
    | nanadravyasamiddhomairakarshanadisiddhidah || 128|| trailokyamohano vighnastryadhikatrimshadarnakah
    | dvadashaksharashaktishah patnivarangahastakah || 129|| muktacandraughadiptabho virivighneshapaddhatih
    | ekadashaksharimantraullasi bhogaganadhipah || 130|| dvatrimshadarnasamyukto haridraganapo mahan
    | jagattrayahito bhogamokshadah kavitakarah || 131|| shadarnah papavidhvamsi sarvasaubhagyadayakah
    | vakratundabhidhah shriman bhajatam kamado manih || 132|| megholkadimahamantrah sarvavashyaphalapradah
    | atharvanikamantratma rayasposhadimantrarat || 133|| vakratundeshagayatripratipaditavaibhavah | pindamantradimalantasarvamantraughavigrahah
    || 134|| sanjaptihomasantriptisekabhojanasadhitah | pancangakapurashcaryo'rnalakshajapasadhitah ||
    135|| kotyavrittikasanjaptisiddhishvaratvadayakah | krishnashtamisamarabdhamasenaikena sadhitah ||
    136|| matrikaya putikritya masenaikena sadhitah | bhutalipya putikritya masenaikena sadhitah || 137||
    trishashtyaksharasamyuktamatrikaputasiddhidah | krishnashtamisamarabdhadinasaptakasiddhidah || 138||
    arkedugrahakalinajapajjhatitisiddhidah | nishatrikalapujakamasenaikena siddhidah || 139|| mantrarnaushadhinishpannagutikabhih
    susiddhidah | suryodayasamarambhadinenaikena sadhitah || 140|| sahasrarambujarudhadeshikasmritisiddhidah
    | shivohambhavanasiddhasarvasiddhivilasakah || 141|| parakamakaladhyanasiddhishvaratvadayakah | akaro'griyapujako'mritanandadayakah
    || 142|| ananto'nantavatareshvanantaphaladayakah | ashtangapatasamprito'shtavidhabhaithunapriyah ||
    143|| ashtapushpasamaradhyo'shtadhyayijnanadayakah | arabdhakarmanirvighnapurayita''kshapatikah ||
    144|| indragopasamanashririkshubhakshanalalasah | inkaravarnasambuddhaparakamakalatmakah || 145||
    ishanaputra ishana ishanatrayamarjakah | uddanda ugra udagra underakabalipriyah || 146|| urjasvanushmalamada
    uhapohadurasadah | rijucittaikasulabha rinatrayavimocakah || 147|| rigarthavetta rikara rikarakshararupadhrik
    | livarnarupo livarno likaraksharapujitah || 148|| edhitakhilabhaktashriredhitakhilasamshrayah | ekararupa
    aikara aimputitasmritindukah || 149|| onkaravacya onkara onkarakshararupadhrik | aunkaradhyagabhuyukta
    aumpurvayuggakarakah || 150|| amshamshibhavasandrishtoshamshibhavavivarjitah | ah karantasamastackavarnamandalapujitah
    || 151|| katritiyavisargadhyah katritiyarnakevalah | karpuratilakodbhasilalatordhvapradeshakah ||
    152|| khalvatabhumisamrakshi khalvatabuddhibheshajam | khatvangayudhasamyuktah khadgodyatakaranvitah
    || 153|| khanditakhiladurbhikshah khanilakshmipradarshakah | khadiradhikasaradhyah khalikritavipakshakah
    || 154|| gandharvavidyacaturo gandharvanikarapriyah | ghapurvabijasannishtho ghoraghargharabrimhitah
    || 155|| ghantaninadasantushto gharno ghanagamapriyah | carturvedeshu sangitashcaturthavedanishthitah
    || 156|| caturdashasamyuktacaturyuktacatushshatah | caturthipujanapritashcaturatma caturgatih || 157||
    caturthitithisambhutashcaturvargaphalapradah | chatricchadmacchalashchandovapushchandavatarakah ||
    158|| jagadbandhurjaganmata jagadrakshi jaganmayah | jagadyonirjagadrupo jagadatma jagannidhih ||
    159|| jaramaranavidhvamsi jagadanandadayakah | jagudanukriticchayo jagradadiprakashakah || 160|| jambunadasamacchayo
    japasampritamanasah | japayogasusamvedyo japatatparasiddhidah || 161|| japakusumasankasho jatipujakavakpradah
    | jayantidinasuprito jayantipujitanghrikah || 162|| jagadbhanatiraskari jagadbhanatirohitah | jagadrupamahamayadhishthanacinmayatmakah
    || 163|| jhanjhanilasamashvasi jhillikasamakantikah | jhalajhjhalasusamshobhishurpakritidvikarnakah
    || 164|| tankakarmavinabhavasvayambhutakalevarah | thakkurashthakkuraradhyashthakkurakritishobhitah
    || 165|| dindimasvanasamvadi damarupriyaputrakah | dhakkavadanasantushto dhundhirajavinayakah || 166||
    tundilastundilavapustapanastaparoshaha | tarakabrahmasamsthanastaranayakashekharah || 167|| tarunyadhyavadhusangi
    tattvavetta trikalavit | sthulah sthulakarah stheyah sthitikarta sthitipradah || 168|| sthanuh sthirah
    sthaleshayi sthandilakulapujitah | duhkhahanta duhkhadayi durbhikshadivinashakah || 169|| dhanadhanyaprado
    dhyeyo dhyanastimitalocanah | dhiro dhirdhiradhirdhuryo dhurinatvapradayakah || 170|| dhyanayogaikasandrishto
    dhyanayogaikalampatah | narayanapriyo namyo naranarijanashrayah || 171|| nagnapujanasantushto nagnanilasamavritah
    | niranjano niradharo nirlepo niravagrahah || 172|| nishithininamasyako nishithinijapapriyah | namaparayanaprito
    namarupaprakashakah || 173|| puranapurushah pratassandhyarunavapuhprabhah | phullapushpasamuhashrisambhushitasumastakah
    || 174|| phalgunanujapujakah phetkaratantravarnitah | brahmanadisamaradhyo balapujyo balapradah ||
    175|| banarcitapadadvandvo balakelikutuhalah | bhavanihridayanandi bhavagamyo bhavatmajah || 176||
    bhavesho bhavyarupadhyo bhargavesho bhrigoh sutah | bhavyo bhavyakalayukto bhavanavashatatparah ||
    177|| bhagavan bhaktisulabho bhayahanta bhayapradah | mayavi manado mani manobhimanashodhakah || 178||
    mahahavodyatakrido mandahasamanoharah | manasvi manavidhvamsi madalalasamanasah || 179|| yashasvi
    yashashamsi yajniko yajnikapriyah | rajarajeshvaro raja ramo ramanalampatah || 180|| rasarajasamasvadi
    rasarajaikapujitah | lakshmivan lakshmasampanno lakshyo lakshanasamyutah || 181|| lakshyalakshanabhavastho
    layayogavibhavitah | virasanasamasino viravandyo varenyadah || 182|| vividharthajnanadata vedavedantavittamah
    | shikhivahasamarudhah shikhivahananathitah || 183|| shrividyopasanapritah shrividyamantravigrahah
    | shadadharakramapritah shadamnayeshu samsthitah || 184|| shaddarshaniparadrishva shadadhvatitarupakah
    | shadurmivrindavidhvamsi shatkonamadhyavindugah || 185|| shattrimshattattvasannishthah shatkarmasanghasiddhidah
    | shadvairivargavidhvamsivighneshvaragajananah || 186|| sattajnanadirupadhyah sahasadbhutakhelanah
    | sarparupadharahsamvit samsarambudhitarakah || 187|| sarpasanghasamashlishtah sarpakundalitodarah
    | saptavimshatirikpujyah svahayunmantravigrahah || 188|| sarvakarmasamarambhasampujitapadadvayah |
    svayambhuh satyasankalpah svayamprakashamurtikah || 189|| svayambhulingasamsthayi svayambhulingapujitah
    | havyo hutapriyo hota hutabhug havanapriyah || 190|| haralalanasantushto halahalashiputrakah | hrinkararupo
    hunkaro hahakarasamakulah || 191|| himacalasutasunurhemabhasvaradehakah | himacalashikharudho himadhamasamadyutih
    || 192|| kshobhahanta kshudhahanta kshainyahanta kshamapradah | kshamadhari kshamayuktah kshapakaranibhah
    kshami || 193|| kakaradikshakarantasarvahalkaprapujitah | akaradikshakarantavarnamalavijrimbhitah
    || 194|| akaradikshakarantamahasarasvatimayah | sthulatamashariradhyah karukarmavijrimbhitah || 195||
    sthulatarasvarupadhyashcakrajalaprakashitah | sthularupasamujjrimbhi hridabjadhyatarupakah || 196||
    sukshmarupasamullasi mantrajalasvarupakah | sukshmataratanushrikah kundalinisvarupakah || 197|| sukshmatamavapushshobhi
    parakamakalatanuh | pararupasamudbhasi saccidanandavigrahah || 198|| paraparavapurdhari saptarupavilasitah
    | shadamnayamahamantranikurumbanishevitah || 199|| tatpurushamukhotpannapurvamnayamanupriyah | aghoramukhasanjatadakshinamnayapujitah
    || 200|| sadyojatamukhotpannapashcimamnayasevitah | vamadevamukhotpannottaramnayaprapujitah || 201||
    ishanamukhasanjatordhvamnayamanusevitah | vimarshamukhasanjatanuttaramnayapujitah || 202|| totakacaryasandishtapurvamnayakamantrakah
    | sureshasamupadishtadakshinamnayamantrakah || 203|| padmapadasamadishtapashcimamnayamantrakah | hastamalakasandishtottaramnayakamantrakah
    || 204|| shankaracaryasandishtordhvamnayakhilamantrakah | dakshinamurtisannishthanuttaramnayamantrakah
    || 205|| sahajanandasannishthasarvamnayaprakashakah | purvamnayakamantraughaih srishtishaktiprakashakah
    || 206|| dakshinamnayamantraughaih sthitishaktiprakashakah | pashcimamnayamantraughairhritishaktiprakashakah
    || 207|| uttaramnayamantraughaistirodhanaprakashakah | urdhvamnayakamantraughairanugrahaprakashakah
    || 208|| anuttaragamantraughaih sahajanandalasakah | sarvamnayakasannishthanusyutacitsukhatmakah ||
    209|| srishtikarta brahmarupo gopta govindarupakah | samharakridrudrarupastirodhayaka ishvarah ||
    210|| sadashivo'nugrahita pancakrityaparayanah | animadigunasprishto nirgunanandarupakah || 211||
    sarvatmabhavanarupah sukhamatranubhavakah | svasvarupasusamshobhi tatasthikasvarupakah || 212|| shadguno'khilakalyanagunarajivirajitah
    | yajnagnikundasambhutah kshirasagarabhadhyagah || 213|| tridashakarunishpannasvanandabhavanasthitah
    | urikriteshaputratvo nilavanivivahitah || 214|| nilasarasvatimantrajapatatparyasiddhidah | vidyavadasuradhvamsi
    surarakshasamudyatah || 215|| cintamanikshetravasi cintitakhilapurakah | mahapapaughavidhvamsi devendrakritapujanah
    || 216|| tararambhi namoyukto bhagavatpadadentagah | ekadamshtrayasamyukto hastimukhayasamyutah ||
    217|| lambodaracaturthyantavirajitakalevarah | ucchishtapadasamraji mahatmanepadapriyah || 218|| ankromhringamsamayukto
    ghedhesvahasamapitah | tararabdhamahamantro hastimukhantaneyutah || 219|| lambodarayasamyukto dentocchishtamahatmayuk
    | pashankushatrapamaro hrillekhasamalankritah || 220|| varmagheghesamarudha ucchishtayapadopadhah
    | vahnijayasumsampurno mantrarajadvayanvitah || 221|| herambakhyaganeshano lakshmiyutagajananah |
    tarunyesho balarupi shaktisho viranamakah || 222 urdhvasamakhya ucchishto vijayo nrityakarmakah |
    vighnavidhvamsivighnesho dvijapurvaganadhipah || 223|| kshipresho vallabhajanirbhaktishah siddhinayakah
    | dvyashtavatarasambhinnalilavaividhyashobhitah || 224|| dvatrimshadavataradhyo dvatrimshaddikshanakramah
    | shuddhavidyasamarabdhamahashodashikantimah || 225|| mahatpadasamayuktapadukasampratishthitah | pranavadistritariyug
    balabijakashobhitah || 226|| vanibhubijasamyukto hamsatrayasamanvitah | khecaribijasambhinno navanathasushobhitah
    || 227|| prasadashrisamayukto navanathavilomakah | paraprasadabijadhyo mahaganeshamantrakah || 228||
    balakramotkramaprito yogabalavijrimbhitah | annapurnasamayukto bajivahavilasitah || 229|| saubhagyapurvavidyayun
    ramadishodashiyutah | ucchishtapurvacandalisamayuktasuvigrahah || 230|| trayodasharnavagdevisamullasitamurtikah
    | nakulimatrisamyukto mahamatanginiyutah || 231|| laghuvartalikayuktasvapnavartalikanvitah | tiraskarisamayukto
    mahavartalikayutah || 232|| parabijasamayukto lopamudravijrimbhitah | trayodashaksharihadijnaptividyasamanvitah
    || 233|| mahavakyamahamatricatushtayavilasitah | brahmanyarasabijadhyabrahmanyadvayashebhitah || 234||
    saptadashaksharishaivatattvavimarshiniyutah | caturvimshativarnatmadakshinamurtishobhitah || 235||
    radanaksharasamshobhiganapocchishtamantrakah | girivyahritivarnatmaganapocchishtarajakah || 236||
    hamsatrayasamarudho rasavanisamarpitah | shrividyanandanathadhya atmakapadasamyutah || 237|| shricaryanandanathadhyah
    shrimahapadukashritah | pujayamipadaprito namahpadasamapitah || 238|| gurumukhaikasamvedyo gurumandalapujitah
    | dikshagurusamarabdhashivantagurusevitah || 239|| samaradhyapadadvandvo gurubhih kularupibhih | vidyavataragurubhih
    sampujitapadadvayah || 240|| paraughiyaguruprito divyaughagurupujitah | siddhaughadeshikaradhyo manavaughanishevitah
    || 241|| gurutrayasamaradhyo gurushatkaprapujitah | shambhavikramasampujyo'shityuttarashatarcitah
    || 242|| kshityadirashmisannishtho langhitakhilarashmikah | shadanvayakramaradhyo deshikanvayarakshitah
    || 243|| sarvashrutishironishthapadukadvayavaibhavah | parakamakalarupah shivohambhavanatmakah ||
    244|| cicchaktyakhyaparahamyuk sarvajnanisvarupakah | samvidbindusamakhyato'parakamakalamayah || 245||
    mayavishishtasarvesho mahabindusvarupakah | animadigunopetah sarjanadikriyanvitah || 246|| mayavishishtacaitanyo'ganyarupavilasakah
    | mishrakamakalarupo'gnishomiyasvarupakah || 247|| mishrabindusamakhyako jivavrindasamashritah | kamakalatrayavishto
    bindutrayavilasitah || 248|| kamakalatrayadhyanasarvabandhavimocakah | bindutrayaikatadhyanavikalevaramuktidah
    || 249|| mahayajanasamprito viracaryadharapriyah | antaryagakramaradhyo bahiryagapuraskritah || 250||
    atmayagasamaradhyah sarvavishvaniyamakah | matrikadashakanyasadevatabhavasiddhidah || 251|| prapancayaganyasena
    sarveshvaratvadayakah | laghushodhamahashodhanyasadvayasamarcitah || 252|| shricakratrividhanyasamahasiddhividhayakah
    | rashmimalamahanyasavajravarmasvarupakah || 253|| hamsaparamahamsakhyanyasadvayavibhavitah | mahapadavaninyasakalashatadhikashtakah
    || 254|| tripurapujanapritah tripurapujakapriyah | navavritimahayajnasamrakshanadhurandharah || 255||
    lambodaramaharupo bhairavibhairavatmakah | utkrishtashishtasadvastu parasamvittirupakah || 256|| shubhashubhakaram
    karma jivayatravidhayakah | saccitsukham nama rupamadhishthanatmakah parah || 257|| aropitajagajjatam
    mithyajnanamamangalam | akaradikshakarantah shabdasrishtisvarupakah || 258|| paravag vimarsharupi
    pashyanti sphotarupadhrik | madhyama cintanarupo vaikhari sthulavacakah || 259|| dhvanirupo varnarupi
    sarvabhashatmako'parah | muladharagatah suptah svadhishthane prapujitah || 260|| manipurakamadhyastho'nahatambujamadhyagah
    | vishuddhipankajollasa ajnacakrabjavasakah || 261|| sahasrarambujarudhah shivashaktyaikyarupakah
    | mulakundalinirupo mahakundalinimayah || 262|| shodashantamahasthano'sparshabhidhamahasthitih | idam
    namasahasram tu sarvasampatpradayakam | dhanadhanyasutadyashtalakshmivrindapravardhakam || 263|| sarvavandhyatvadoshaghnam
    satsantanapradayakam | sarvajvarartishamanam dirghayushyapradayakam || 264|| dharmamartham kamamokshau
    jhatitidam pradasyati | nishkamo va sakamo va sarva etatprasadhayet || 265|| iti uddamareshvaratantre
    kshipraprasadanapatale guhyanama ucchishtaganeshasahasranamastotram |
  devanagari: ृङ्गपुरस्थायी सुरेशार्चितवैभवः ॥ ९४॥ द्वारकापीठसंवासी पद्मपादार्चिताङ्घ्रिकः । जगन्नाथपुरस्थायी
    तोटकाचार्यसेवितः ॥ ९५॥ ज्योतिर्मठालयस्थायी हस्तामलकपूजितः । विद्याभोगयशोमोक्षयोगलिङ्गप्रतिष्ठितः ॥
    ९६॥ पञ्चलिङ्गप्रतिष्ठायी द्वादशलिङ्गसंस्थितः । कोलाचलपुरस्थायी कामेशीनगरेश्वरः ॥ ९७॥ ज्वालामुखीमुखस्थायी
    श्रीशैलकृतवासकः । लङ्केश्वरः कुमारीशः काशीशो मथुरेश्वरः ॥ ९८॥ मलयाद्रिशिरोवासी मलयानिलसेवितः । शोणाद्रिशिखरारूढः
    शोणाद्रीशप्रियङ्करः ॥ ९९॥ जम्बूवनान्तमध्यस्थो वल्मीकपुरमध्यगः । पञ्चाशत्पीठनिलयो पञ्चाशदक्षरात्मकः
    ॥ १००॥ अष्टोत्तरशतक्षेत्रोऽष्टोत्तरशतपूजितः । रत्नशैलकृतावासः शुद्धज्ञानप्रदायकः ॥ १०१॥ शातकुम्भगिरिस्थायी
    शातकुम्भोदरस्थितः । गोमयप्रतिमाविष्टः श्वेतार्कतनुपूजितः ॥ १०२॥ हरिद्राबिम्बसुप्रीतो निम्बबिम्बसुपूजितः
    । अश्वत्थमूलसंस्थायी वटवृक्षाधरस्थितः ॥ १०३॥ निम्बवृक्षस्य मूलस्थः प्रतिग्रामाधिदैवतम् । अश्वत्थनिम्बसंयोगे
    प्रियालिङ्गितमूर्तिकः ॥ १०४॥ गम्बीजरूप एकार्णो गणाध्यक्षो गणाधिपः । ग्लैम्बीजाख्यो गणेशानो गोङ्कार
    एकवर्णकः ॥ १०५॥ विरिरूपो विघ्नहन्ता दृष्टादृष्टफलप्रदः । पत्नीवराङ्गसत्पाणिः सिन्दूराभः कपालभृत् ॥
    १०६॥ लक्ष्मीगणेशो हेमाभ एकोनत्रिंशदक्षरः । वामाङ्गाविष्टलक्ष्मीको महाश्रीप्रविधायकः ॥ १०७॥ त्र्यक्षरः
    शक्तिगणपः सर्वसिद्धिप्रपूरकः । चतुरक्षरशक्तीशो हेमच्छायस्त्रिणेत्रकः ॥ १०८॥ क्षिप्रप्रसादपङ्क्त्यर्णो
    रक्ताभः कल्पवल्लिभृत् । पञ्चवक्त्रः सिंहवाहो हेरम्बश्चतुरर्णकः ॥ १०९॥ सुब्रह्मण्यगणेशानो धात्वर्णः
    सर्वकामदः । अरुणाभतनुश्रीकः कुक्कुटोद्यत्करान्वितः ॥ ११०॥ अष्टाविंशतिवर्णात्ममन्त्रराजसुपूजितः । गन्धर्वसिद्धसंसेव्यो
    व्याघ्रद्विपादिभीकरः ॥ १११॥ मन्त्रशास्त्रमहोदन्वत्समुद्यतकलानिधिः । जनसम्बाधसम्मोही नवद्रव्यविशेषकः
    ॥ ११२॥ कामनाभेदसंसिद्धविविधध्यानभेदकः । चतुरावृत्तिसन्तृप्तिप्रीतोऽभीष्टसमर्पकः ॥ ११३॥ चन्द्रचन्दनकाश्मीरकस्तूरीजलतर्पितः
    । शुण्डाग्रजलसन्तृप्तिकैवल्यफलदायकः ॥ ११४॥ शिरःकृतपयस्तृप्तिसर्वसम्पद्विधायकः । गुह्यदेशमधुद्रव्यसन्तृप्त्या
    कामदायकः ॥ ११५॥ नेत्रद्वयमधुद्रव्यतृप्त्याकृष्टिविधायकः । पृष्ठदेशघृतद्रव्यतृप्तिभूपवशङ्करः ॥ ११६॥
    एरण्डतैलसन्तृप्तिरण्डाकर्षकनाभिकः । ऊरुयुग्मकतैलीयतर्पणातिप्रमोदितः ॥ ११७॥ प्रीतिप्रवर्धकांसीयपयः
    पयःप्रतर्पणः । धर्मवर्धकतुण्डीयद्रव्यत्रयसुतर्पणः ॥ ११८॥ अष्टद्रव्याहुतिप्रीतो विविधद्रव्यहोमकः ।
    ब्राह्ममुहूर्तनिष्पन्नहोमकर्मप्रसादितः ॥ ११९॥ मधुद्रव्यकहोमेन स्वर्णसमृद्धिवर्धकः । गोदुग्धकृतहोमेन
    गोसमृद्धिविधायकः ॥ १२०॥ आज्याहुतिहोमेन लक्ष्मीलासविलासकः । शर्कराहुतिहोमेन काष्ठाष्टकयशःप्रदः ॥ १२१॥
    दधिद्रव्यकहोमेन सर्वसम्पत्तिदायकः । शाल्यन्नकृतहोमेनान्नसमृद्धिवितारकः ॥ १२२॥ सतण्डुलतिलाहुत्या द्रव्यकदम्बपूरकः
    । लाजाहुतिकहोमेन दिगन्तव्यापिकीर्तिदः ॥ १२३॥ जातीप्रसूनहोमेन मेधाप्रज्ञाप्रकाशकः । दूर्वात्रिकीयहोमेन
    पूर्णायुःप्रतिपादकः ॥ १२४॥ सुपीतसुमहोमेन वैरिभूपतिशिक्षकः । विभीतकसमिद्धोमैः स्तम्भोच्चाटनसिद्धिदः
    ॥ १२५॥ अपामार्गसमिद्धोमैः पण्ययोषावशङ्करः । एरण्डकसमिद्धोमैः रण्डासङ्घवशङ्करः ॥ १२६॥ निम्बद्रुदलहोमेन
    विद्वेषणविधायकः । घृताक्तदौग्धशाल्यन्नहोमैरिष्टफलप्रदः ॥ १२७॥ तिलादिचतुराहुत्या सर्वप्राणिवशङ्करः
    । नानाद्रव्यसमिद्धोमैराकर्षणादिसिद्धिदः ॥ १२८॥ त्रैलोक्यमोहनो विघ्नस्त्र्यधिकत्रिंशदर्णकः । द्वादशाक्षरशक्तीशः
    पत्नीवराङ्गहस्तकः ॥ १२९॥ मुक्ताचन्द्रौघदीप्ताभो विरिविघ्नेशपद्धतिः । एकादशाक्षरीमन्त्रौल्लासी भोगगणाधिपः
    ॥ १३०॥ द्वात्रिंशदर्णसंयुक्तो हरिद्रागणपो महान् । जगत्त्रयहितो भोगमोक्षदः कविताकरः ॥ १३१॥ षडर्णः पापविध्वंसी
    सर्वसौभाग्यदायकः । वक्रतुण्डाभिधः श्रीमान् भजतां कामदो मणिः ॥ १३२॥ मेघोल्कादिमहामन्त्रः सर्ववश्यफलप्रदः
    । आथर्वणिकमन्त्रात्मा रायस्पोषादिमन्त्रराट् ॥ १३३॥ वक्रतुण्डेशगायत्रीप्रतिपादितवैभवः । पिण्डमन्त्रादिमालान्तसर्वमन्त्रौघविग्रहः
    ॥ १३४॥ सञ्जप्तिहोमसन्तृप्तिसेकभोजनसाधितः । पञ्चाङ्गकपुरश्चर्योऽर्णलक्षजपसाधितः ॥ १३५॥ कोट्यावृत्तिकसञ्जप्तिसिद्धीश्वरत्वदायकः
    । कृष्णाष्टमीसमारब्धमासेनैकेन साधितः ॥ १३६॥ मातृकया पुटीकृत्य मासेनैकेन साधितः । भूतलिप्या पुटीकृत्य
    मासेनैकेन साधितः ॥ १३७॥ त्रिषष्ट्यक्षरसंयुक्तमातृकापुटसिद्धिदः । कृष्णाष्टमीसमारब्धदिनसप्तकसिद्धिदः
    ॥ १३८॥ अर्केदुग्रहकालीनजपाज्झटितिसिद्धिदः । निशात्रिकालपूजाकमासेनैकेन सिद्धिदः ॥ १३९॥ मन्त्रार्णौषधिनिष्पन्नगुटिकाभिः
    सुसिद्धिदः । सूर्योदयसमारम्भदिनेनैकेन साधितः ॥ १४०॥ सहस्राराम्बुजारूढदेशिकस्मृतिसिद्धिदः । शिवोहम्भावनासिद्धसर्वसिद्धिविलासकः
    ॥ १४१॥ पराकामकलाध्यानसिद्धीश्वरत्वदायकः । अकारोऽग्रियपूजाकोऽमृतानन्ददायकः ॥ १४२॥ अनन्तोऽनन्तावतारेष्वनन्तफलदायकः
    । अष्टाङ्गपातसम्प्रीतोऽष्टविधभैथुनप्रियः ॥ १४३॥ अष्टपुष्पसमाराध्योऽष्टाध्यायीज्ञानदायकः । आरब्धकर्मनिर्विघ्नपूरयिताऽऽक्षपाटिकः
    ॥ १४४॥ इन्द्रगोपसमानश्रीरिक्षुभक्षणलालसः । ईङ्कारवर्णसम्बुद्धपराकामकलात्मकः ॥ १४५॥ ईशानपुत्र ईशान
    ईषणात्रयमार्जकः । उद्दण्ड उग्र उदग्र उण्डेरकबलिप्रियः ॥ १४६॥ ऊर्जस्वानूष्मलमद ऊहापोहदुरासदः । ऋजुचित्तैकसुलभ
    ऋणत्रयविमोचकः ॥ १४७॥ ऋगर्थवेत्ता ॠकार ॠकाराक्षररूपधृक् । ऌवर्णरूपो ॡवर्णो ॡकाराक्षरपूजितः ॥ १४८॥ एधिताखिलभक्तश्रीरेधिताखिलसंश्रयः
    । एकाररूप ऐकार ऐम्पुटितस्मृतिन्दुकः ॥ १४९॥ ओङ्कारवाच्य ओङ्कार ओङ्काराक्षररूपधृक् । औङ्काराढ्यगभूयुक्त
    औम्पूर्वयुग्गकारकः ॥ १५०॥ अंशांशिभावसन्दृष्टोशांशिभावविवर्जितः । अः कारान्तसमस्ताच्कवर्णमण्डलपूजितः
    ॥ १५१॥ कतृतीयविसर्गाढ्यः कतृतीयार्णकेवलः । कर्पूरतिलकोद्भासिललाटोर्ध्वप्रदेशकः ॥ १५२॥ खल्वाटभूमिसम्रक्षी
    खल्वाटबुद्धिभेषजम् । खट्वाङ्गायुधसंयुक्तः खड्गोद्यतकरान्वितः ॥ १५३॥ खण्डिताखिलदुर्भिक्षः खनिलक्ष्मीप्रदर्शकः
    । खदिराधिकसाराढ्यः खलीकृतविपक्षकः ॥ १५४॥ गान्धर्वविद्याचतुरो गन्धर्वनिकरप्रियः । घपूर्वबीजसन्निष्ठो
    घोरघर्घरबृंहितः ॥ १५५॥ घण्टानिनादसन्तुष्टो घार्णो घनागमप्रियः । चर्तुर्वेदेषु सङ्गीतश्चतुर्थवेदनिष्ठितः
    ॥ १५६॥ चतुर्दशसंयुक्तचतुर्युक्तचतुश्शतः । चतुर्थीपूजनप्रीतश्चतुरात्मा चतुर्गतिः ॥ १५७॥ चतुर्थीतिथिसम्भूतश्चतुर्वर्गफलप्रदः
    । छत्रीच्छद्मच्छलश्छन्दोवपुश्छन्दावतारकः ॥ १५८॥ जगद्बन्धुर्जगन्माता जगद्रक्षी जगन्मयः । जगद्योनिर्जगद्रूपो
    जगदात्मा जगन्निधिः ॥ १५९॥ जरामरणविध्वंसी जगदानन्ददायकः । जागुडानुकृतिच्छायो जाग्रदादिप्रकाशकः ॥ १६०॥
    जाम्बूनदसमच्छायो जपसम्प्रीतमानसः । जपयोगसुसंवेद्यो जपतत्परसिद्धिदः ॥ १६१॥ जपाकुसुमसङ्काशो जातीपूजकवाक्प्रदः
    । जयन्तीदिनसुप्रीतो जयन्तीपूजिताङ्घ्रिकः ॥ १६२॥ जगद्भानतिरस्कारी जगद्भानतिरोहितः । जगद्रूपमहामायाधिष्ठानचिन्मयात्मकः
    ॥ १६३॥ झञ्झानिलसमश्वासी झिल्लिकासमकान्तिकः । झलझ्झलासुसंशोभिशूर्पाकृतिद्विकर्णकः ॥ १६४॥ टङ्ककर्मविनाभावस्वयम्भूतकलेवरः
    । ठक्कुरष्ठक्कुराराध्यष्ठक्कुराकृतिशोभितः ॥ १६५॥ डिण्डिमस्वनसंवादी डमरुप्रियपुत्रकः । ढक्कावादनसन्तुष्टो
    ढुण्ढिराजविनायकः ॥ १६६॥ तुन्दिलस्तुन्दिलवपुस्तपनस्तापरोषहा । तारकब्रह्मसंस्थानस्तारानायकशेखरः ॥ १६७॥
    तारुण्याढ्यवधूसङ्गी तत्त्ववेत्ता त्रिकालवित् । स्थूलः स्थूलकरः स्थेयः स्थितिकर्ता स्थितिप्रदः ॥ १६८॥
    स्थाणुः स्थिरः स्थलेशायी स्थाण्डिलकुलपूजितः । दुःखहन्ता दुःखदायी दुर्भिक्षादिविनाशकः ॥ १६९॥ धनधान्यप्रदो
    ध्येयो ध्यानस्तिमितलोचनः । धीरो धीर्धीरधीर्धुर्यो धुरीणत्वप्रदायकः ॥ १७०॥ ध्यानयोगैकसन्दृष्टो ध्यानयोगैकलम्पटः
    । नारायणप्रियो नम्यो नरनारीजनाश्रयः ॥ १७१॥ नग्नपूजनसन्तुष्टो नग्ननीलासमावृतः । निरञ्जनो निराधारो निर्लेपो
    निरवग्रहः ॥ १७२॥ निशीथिनीनमस्याको निशीथिनीजपप्रियः । नामपारायणप्रीतो नामरूपप्रकाशकः ॥ १७३॥ पुराणपुरुषः
    प्रातस्सन्ध्यारुणवपुःप्रभः । फुल्लपुष्पसमूहश्रीसम्भूषितसुमस्तकः ॥ १७४॥ फाल्गुनानुजपूजाकः फेत्कारतन्त्रवर्णितः
    । ब्राह्मणादिसमाराध्यो बालपूज्यो बलप्रदः ॥ १७५॥ बाणार्चितपदद्वन्द्वो बालकेलिकुतूहलः । भवानीहृदयानन्दी
    भावगम्यो भवात्मजः ॥ १७६॥ भवेशो भव्यरूपाढ्यो भार्गवेशो भृगोः सुतः । भव्यो भव्यकलायुक्तो भावनावशतत्परः
    ॥ १७७॥ भगवान् भक्तिसुलभो भयहन्ता भयप्रदः । मायावी मानदो मानी मनोभिमानशोधकः ॥ १७८॥ महाहवोद्यतक्रीडो
    मन्दहासमनोहरः । मनस्वी मानविध्वंसी मदलालसमानसः ॥ १७९॥ यशस्वी यशाशंसी याज्ञिको याज्ञिकप्रियः । राजराजेश्वरो
    राजा रामो रमणलम्पटः ॥ १८०॥ रसराजसमास्वादी रसराजैकपूजितः । लक्ष्मीवान् लक्ष्मसम्पन्नो लक्ष्यो लक्षणसंयुतः
    ॥ १८१॥ लक्ष्यलक्षणभावस्थो लययोगविभावितः । वीरासनसमासीनो वीरवन्द्यो वरेण्यदः ॥ १८२॥ विविधार्थज्ञानदाता
    वेदवेदान्तवित्तमः । शिखिवाहसमारूढः शिखिवाहननाथितः ॥ १८३॥ श्रीविद्योपासनप्रीतः श्रीविद्यामन्त्रविग्रहः
    । षडाधारक्रमप्रीतः षडाम्नायेषु संस्थितः ॥ १८४॥ षड्दर्शनीपारदृश्वा षडध्वातीतरूपकः । षडूर्मिवृन्दविध्वंसी
    षट्कोणमध्यविन्दुगः ॥ १८५॥ षट्त्रिंशत्तत्त्वसन्निष्ठः षट्कर्मसन्घसिद्धिदः । षड्वैरिवर्गविध्वंसिविघ्नेश्वरगजाननः
    ॥ १८६॥ सत्ताज्ञानादिरूपाढ्यः साहसाद्भुतखेलनः । सर्परूपधरःसंवित् संसाराम्बुधितारकः ॥ १८७॥ सर्पसङ्घसमाश्लिष्टः
    सर्पकुण्डलितोदरः । सप्तविंशतिऋक्पूज्यः स्वाहायुङ्मन्त्रविग्रहः ॥ १८८॥ सर्वकर्मसमारम्भसम्पूजितपदद्वयः
    । स्वयम्भूः सत्यसङ्कल्पः स्वयम्प्रकाशमूर्तिकः ॥ १८९॥ स्वयम्भूलिङ्गसंस्थायी स्वयम्भूलिङ्गपूजितः । हव्यो
    हुतप्रियो होता हुतभुग् हवनप्रियः ॥ १९०॥ हरलालनसन्तुष्टो हलाहलाशिपुत्रकः । ह्रीङ्काररूपो हुङ्कारो हाहाकारसमाकुलः
    ॥ १९१॥ हिमाचलसुतासूनुर्हेमभास्वरदेहकः । हिमाचलशिखारूढो हिमधामसमद्युतिः ॥ १९२॥ क्षोभहन्ता क्षुधाहन्ता
    क्षैण्यहन्ता क्षमाप्रदः । क्षमाधारी क्षमायुक्तः क्षपाकरनिभः क्षमी ॥ १९३॥ ककारादिक्षकारान्तसर्वहल्कप्रपूजितः
    । अकारादिक्षकारान्तवर्णमालाविजृम्भितः ॥ १९४॥ अकारादिक्षकारान्तमहासरस्वतीमयः । स्थूलतमशरीराढ्यः कारुकर्मविजृम्भितः
    ॥ १९५॥ स्थूलतरस्वरूपाढ्यश्चक्रजालप्रकाशितः । स्थूलरूपसमुज्जृम्भी हृदब्जध्यातरूपकः ॥ १९६॥ सूक्ष्मरूपसमुल्लासी
    मन्त्रजालस्वरूपकः । सूक्ष्मतरतनुश्रीकः कुण्डलिनीस्वरूपकः ॥ १९७॥ सूक्ष्मतमवपुश्शोभी पराकामकलातनुः ।
    पररूपसमुद्भासी सच्चिदानन्दविग्रहः ॥ १९८॥ परापरवपुर्धारी सप्तरूपविलासितः । षडाम्नायमहामन्त्रनिकुरुम्बनिषेवितः
    ॥ १९९॥ तत्पुरुषमुखोत्पन्नपूर्वाम्नायमनुप्रियः । अघोरमुखसञ्जातदक्षिणाम्नायपूजितः ॥ २००॥ सद्योजातमुखोत्पन्नपश्चिमाम्नायसेवितः
    । वामदेवमुखोत्पन्नोत्तराम्नायप्रपूजितः ॥ २०१॥ ईशानमुखसञ्जातोर्ध्वाम्नायमनुसेवितः । विमर्शमुखसञ्जातानुत्तराम्नायपूजितः
    ॥ २०२॥ तोटकाचार्यसन्दिष्टपूर्वाम्नायकमन्त्रकः । सुरेशसमुपादिष्टदक्षिणाम्नायमन्त्रकः ॥ २०३॥ पद्मपादसमादिष्टपश्चिमाम्नायमन्त्रकः
    । हस्तामलकसन्दिष्टोत्तराम्नायकमन्त्रकः ॥ २०४॥ शङ्कराचार्यसन्दिष्टोर्ध्वाम्नायाखिलमन्त्रकः । दक्षिणामूर्तिसन्निष्ठानुत्तराम्नायमन्त्रकः
    ॥ २०५॥ सहजानन्दसन्निष्ठसर्वाम्नायप्रकाशकः । पूर्वाम्नायकमन्त्रौघैः सृष्टिशक्तिप्रकाशकः ॥ २०६॥ दक्षिणाम्नायमन्त्रौघैः
    स्थितिशक्तिप्रकाशकः । पश्चिमाम्नायमन्त्रौघैर्हृतिशक्तिप्रकाशकः ॥ २०७॥ उत्तराम्नायमन्त्रौघैस्तिरोधानप्रकाशकः
    । ऊर्ध्वाम्नायकमन्त्रौघैरनुग्रहप्रकाशकः ॥ २०८॥ अनुत्तरगमन्त्रौघैः सहजानन्दलासकः । सर्वाम्नायकसन्निष्ठानुस्यूतचित्सुखात्मकः
    ॥ २०९॥ सृष्टिकर्ता ब्रह्मरूपो गोप्ता गोविन्दरूपकः । संहारकृद्रुद्ररूपस्तिरोधायक ईश्वरः ॥ २१०॥ सदाशिवोऽनुग्रहीता
    पञ्चकृत्यपरायणः । अणिमादिगुणास्पृष्टो निर्गुणानन्दरूपकः ॥ २११॥ सर्वात्मभावनारूपः सुखमात्रानुभावकः
    । स्वस्वरूपसुसंशोभी ताटस्थिकस्वरूपकः ॥ २१२॥ षड्गुणोऽखिलकल्याणगुणराजिविराजितः । यज्ञाग्निकुण्डसम्भूतः
    क्षीरसागरभध्यगः ॥ २१३॥ त्रिदशकारुनिष्पन्नस्वानन्दभवनस्थितः । ऊरीकृतेशपुत्रत्वो नीलवाणीविवाहितः ॥ २१४॥
    नीलसरस्वतीमन्त्रजपतात्पर्यसिद्धिदः । विद्यावदसुरध्वंसी सुररक्षासमुद्यतः ॥ २१५॥ चिन्तामणिक्षेत्रवासी
    चिन्तिताखिलपूरकः । महापापौघविध्वंसी देवेन्द्रकृतपूजनः ॥ २१६॥ तारारम्भी नमोयुक्तो भगवत्पदडेन्तगः ।
    एकदंष्ट्रायसंयुक्तो हस्तिमुखायसंयुतः ॥ २१७॥ लम्बोदरचतुर्थ्यन्तविराजितकलेवरः । उच्छिष्टपदसंराजी महात्मनेपदप्रियः
    ॥ २१८॥ आङ्क्रोंह्रीङ्गंसमायुक्तो घेधेस्वाहासमापितः । तारारब्धमहामन्त्रो हस्तिमुखान्तङेयुतः ॥ २१९॥
    लम्बोदरायसंयुक्तो डेन्तोच्छिष्टमहात्मयुक् । पाशाङ्कुशत्रपामारो हृल्लेखासमलङ्कृतः ॥ २२०॥ वर्मघेघेसमारूढ
    उच्छिष्टायपदोपधः । वह्निजायासुंसम्पूर्णो मन्त्रराजद्वयान्वितः ॥ २२१॥ हेरम्बाख्यगणेशानो लक्ष्मीयुतगजाननः
    । तारुण्येशो बालरूपी शक्तीशो वीरनामकः ॥ २२२ ऊर्ध्वसमाख्य उच्छिष्टो विजयो नृत्यकर्मकः । विघ्नविध्वंसिविघ्नेशो
    द्विजपूर्वगणाधिपः ॥ २२३॥ क्षिप्रेशो वल्लभाजानिर्भक्तीशः सिद्धिनायकः । द्व्यष्टावतारसम्भिन्नलीलावैविध्यशोभितः
    ॥ २२४॥ द्वात्रिंशदवताराढ्यो द्वात्रिंशद्दीक्षणक्रमः । शुद्धविद्यासमारब्धमहाषोडशिकान्तिमः ॥ २२५॥ महत्पदसमायुक्तपादुकासम्प्रतिष्ठितः
    । प्रणवादिस्त्रितारीयुग् बालाबीजकशोभितः ॥ २२६॥ वाणीभूबीजसंयुक्तो हंसत्रयसमन्वितः । खेचरीबीजसम्भिन्नो
    नवनाथसुशोभितः ॥ २२७॥ प्रासादश्रीसमायुक्तो नवनाथविलोमकः । पराप्रासादबीजाढ्यो महागणेशमन्त्रकः ॥ २२८॥
    बालाक्रमोत्क्रमप्रीतो योगबालाविजृम्भितः । अन्नपूर्णासमायुक्तो बाजिवाहाविलासितः ॥ २२९॥ सौभाग्यपूर्वविद्यायुङ्
    रमादिषोडशीयुतः । उच्छिष्टपूर्वचाण्डालीसमायुक्तसुविग्रहः ॥ २३०॥ त्रयोदशार्णवाग्देवीसमुल्लसितमूर्तिकः
    । नकुलीमातृसंयुक्तो महामातङ्गिनीयुतः ॥ २३१॥ लघुवार्तालिकायुक्तस्वप्नवार्तालिकान्वितः । तिरस्कारिसमायुक्तो
    महावार्तालिकायुतः ॥ २३२॥ पराबीजसमायुक्तो लोपामुद्राविजृम्भितः । त्रयोदशाक्षरीहादिज्ञप्तिविद्यासमन्वितः
    ॥ २३३॥ महावाक्यमहामातृचतुष्टयविलासितः । ब्रह्मण्यरसबीजाढ्यब्रह्मण्यद्वयशेभितः ॥ २३४॥ सप्तदशाक्षरीशैवतत्त्वविमर्शिनीयुतः
    । चतुर्विंशतिवर्णात्मदक्षिणामूर्तिशोभितः ॥ २३५॥ रदनाक्षरसंशोभिगणपोच्छिष्टमन्त्रकः । गिरिव्याहृतिवर्णात्मगणपोच्छिष्टराजकः
    ॥ २३६॥ हंसत्रयसमारुढो रसावाणीसमर्पितः । श्रीविद्यानन्दनाथाढ्य आत्मकपदसंयुतः ॥ २३७॥ श्रीचर्यानन्दनाथाढ्यः
    श्रीमहापादुकाश्रितः । पूजयामिपदप्रीतो नमःपदसमापितः ॥ २३८॥ गुरुमुखैकसंवेद्यो गुरुमण्डलपूजितः । दीक्षागुरुसमारब्धशिवान्तगुरुसेवितः
    ॥ २३९॥ समाराध्यपदद्वन्द्वो गुरुभिः कुलरूपिभिः । विद्यावतारगुरुभिः सम्पूजितपदद्वयः ॥ २४०॥ परौघीयगुरुप्रीतो
    दिव्यौघगुरुपूजितः । सिद्धौघदेशिकाराध्यो मानवौघनिषेवितः ॥ २४१॥ गुरुत्रयसमाराध्यो गुरुषट्कप्रपूजितः
    । शाम्भवीक्रमसम्पूज्योऽशीत्युत्तरशतार्चितः ॥ २४२॥ क्षित्यादिरश्मिसन्निष्ठो लङ्घिताखिलरश्मिकः । षडन्वयक्रमाराध्यो
    देशिकान्वयरक्षितः ॥ २४३॥ सर्वश्रुतिशिरोनिष्ठपादुकाद्वयवैभवः । पराकामकलारूपः शिवोहम्भावनात्मकः ॥ २४४॥
    चिच्छक्त्याख्यपराहंयुक् सर्वज्ञानिस्वरूपकः । संविद्बिन्दुसमाख्यातोऽपराकामकलामयः ॥ २४५॥ मायाविशिष्टसर्वेशो
    महाबिन्दुस्वरूपकः । अणिमादिगुणोपेतः सर्जनादिक्रियान्वितः ॥ २४६॥ मायाविशिष्टचैतन्योऽगण्यरूपविलासकः
    । मिश्रकामकलारूपोऽग्नीषोमीयस्वरूपकः ॥ २४७॥ मिश्रबिन्दुसमाख्याको जीववृन्दसमाश्रितः । कामकलात्रयाविष्टो
    बिन्दुत्रयविलासितः ॥ २४८॥ कामकलात्रयध्यानसर्वबन्धविमोचकः । बिन्दुत्रयैकताध्यानविकलेवरमुक्तिदः ॥ २४९॥
    महायजनसम्प्रीतो वीरचर्याधरप्रियः । अन्तर्यागक्रमाराध्यो बहिर्यागपुरस्कृतः ॥ २५०॥ आत्मयागसमाराध्यः
    सर्वविश्वनियामकः । मातृकादशकन्यासदेवताभावसिद्धिदः ॥ २५१॥ प्रपञ्चयागन्यासेन सर्वेश्वरत्वदायकः । लघुषोढामहाषोढान्यासद्वयसमर्चितः
    ॥ २५२॥ श्रीचक्रत्रिविधन्यासमहासिद्धिविधायकः । रश्मिमालामहान्यासवज्रवर्मस्वरूपकः ॥ २५३॥ हंसपरमहंसाख्यन्यासद्वयविभावितः
    । महापदावनीन्यासकलाशताधिकाष्टकः ॥ २५४॥ त्रिपुरापूजनप्रीतः त्रिपुरापूजकप्रियः । नवावृतिमहायज्ञसंरक्षणधुरन्धरः
    ॥ २५५॥ लम्बोदरमहारूपो भैरवीभैरवात्मकः । उत्कृष्टशिष्टसद्वस्तु परसंवित्तिरूपकः ॥ २५६॥ शुभाशुभकरं कर्म
    जीवयात्राविधायकः । सच्चित्सुखं नाम रूपमधिष्ठानात्मकः परः ॥ २५७॥ आरोपितजगज्जातं मिथ्याज्ञानममङ्गलम्
    । अकारादिक्षकारान्तः शब्दसृष्टिस्वरूपकः ॥ २५८॥ परावाग् विमर्शरूपी पश्यन्ती स्फोटरूपधृक् । मध्यमा चिन्तनारूपो
    वैखरी स्थूलवाचकः ॥ २५९॥ ध्वनिरूपो वर्णरूपी सर्वभाषात्मकोऽपरः । मूलाधारगतः सुप्तः स्वाधिष्ठाने प्रपूजितः
    ॥ २६०॥ मणिपूरकमध्यस्थोऽनाहताम्बुजमध्यगः । विशुद्धिपङ्कजोल्लास आज्ञाचक्राब्जवासकः ॥ २६१॥ सहस्राराम्बुजारूढः
    शिवशक्त्यैक्यरूपकः । मूलकुण्डलिनीरूपो महाकुण्डलिनीमयः ॥ २६२॥ षोडशान्तमहास्थानोऽस्पर्शाभिधमहास्थितिः
    । इदं नामसहस्रं तु सर्वसम्पत्प्रदायकम् । धनधान्यसुताद्यष्टलक्ष्मीवृन्दप्रवर्धकम् ॥ २६३॥ सर्ववन्ध्यात्वदोषघ्नं
    सत्सन्तानप्रदायकम् । सर्वज्वरार्तिशमनं दीर्घायुष्यप्रदायकम् ॥ २६४॥ धर्ममर्थं काममोक्षौ झटितीदं प्रदास्यति
    । निष्कामो वा सकामो वा सर्व एतत्प्रसाधयेत् ॥ २६५॥ इति उड्डामरेश्वरतन्त्रे क्षिप्रप्रसादनपटले गुह्यनाम
    उच्छिष्टगणेशसहस्रनामस्तोत्रम् ।
