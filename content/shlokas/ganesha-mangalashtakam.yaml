id: ganesha-mangalashtakam
category: stotram
name:
  english: Ganesha Mangalashtakam
content:
  english: gajananaya gangeyasahajaya sadatmane | gauripriya tanujaya ganeshayastu mangalam || || nagayajnopavitaya
    natavighnavinashine | nandyadi gananathaya nayakayastu mangalam || || ibhavaktraya cendradi vanditaya
    cidatmane | ishanapremapatraya nayakayastu mangalam || || sumukhaya sushundagrat kshiptamritaghataya
    ca | surabrinda nishevyaya ceshtadayastu mangalam || || caturbhujaya candrardhavilasanmastakaya ca
    | caranavanatanantataranayastu mangalam || || vakratundaya vatave vanyaya varadaya ca | virupaksha
    sutayastu mangalam || || pramodamodarupaya siddhivijnanarupine | prakrishta papanashaya phaladayastu
    mangalam || || mangalam gananathaya mangalam harasunave | mangalam vighnarajaya vighahartrestu mangalam
    || || shlokashtakamidam punyam mangalaprada madarat | pathitavyam prayatnena sarvavighnanivrittaye
    || || iti shri ganesha mangalashtakam ||
  devanagari: गजाननाय गाङ्गेयसहजाय सदात्मने । गौरीप्रिय तनूजाय गणेशायास्तु मङ्गलम् ॥ ॥ नागयज्ञोपवीताय
    नतविघ्नविनाशिने । नन्द्यादि गणनाथाय नायकायास्तु मङ्गलम् ॥ ॥ इभवक्त्राय चेन्द्रादि वन्दिताय चिदात्मने
    । ईशानप्रेमपात्राय नायकायास्तु मङ्गलम् ॥ ॥ सुमुखाय सुशुण्डाग्रात् क्षिप्तामृतघटाय च । सुरबृन्द निषेव्याय
    चेष्टदायास्तु मङ्गलम् ॥ ॥ चतुर्भुजाय चन्द्रार्धविलसन्मस्तकाय च । चरणावनतानन्ततारणायास्तु मङ्गलम् ॥
    ॥ वक्रतुण्डाय वटवे वन्याय वरदाय च । विरूपाक्ष सुतायास्तु मङ्गलम् ॥ ॥ प्रमोदमोदरूपाय सिद्धिविज्ञानरूपिणे
    । प्रकृष्टा पापनाशाय फलदायास्तु मङ्गलम् ॥ ॥ मङ्गलं गणनाथाय मङ्गलं हरसूनवे । मङ्गलं विघ्नराजाय विघहर्त्रेस्तु
    मङ्गलम् ॥ ॥ श्लोकाष्टकमिदं पुण्यं मङ्गलप्रद मादरात् । पठितव्यं प्रयत्नेन सर्वविघ्ननिवृत्तये ॥ ॥ इति
    श्री गणेश मङ्गलाष्टकम् ॥
