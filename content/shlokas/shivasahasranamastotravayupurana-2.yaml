id: shivasahasranamastotravayupurana-2
category: sahasranama
name:
  english: shivasahasranamastotravayupurana
  devanagari: शिवसहस्रनामस्तोत्रवायुपुराण
content:
  english: rigalaya tarakaya taraya ca | namo yajnadhipataye drutayopadrutaya ca || 211|| yajnavahaya
    danaya tapyaya tapanaya ca | namastataya bhavyaya taditam pataye namah || 212|| annadayannapataye
    namo'stvannabhavaya ca | namah sahasrashirshne ca sahasracaranaya ca || 213|| sahasrodyatashulaya
    sahasranayanaya ca | namo'stu balarupaya balarupadharaya ca || 214|| balanancaiva goptre ca balakridanakaya
    ca | namah shuddhaya buddhaya kshobhanayakshataya ca || 215|| tarangankitakeshaya muktakeshaya vai
    namah | namah shatkarmanishthaya trikarmanirataya ca || 216|| varnashramanam vidhivat prithakkarmapravartine
    | namo ghoshaya ghoshyaya namah kalakalaya ca || 217|| shvetapingalanetraya krishnaraktakshanaya ca
    | dharmartha kamamokshaya krathaya kathanaya ca || 218|| sankhyaya sankhyamukhyaya yogadhipataye namah
    | namo rathyavirathyaya catushpatharataya ca || 219|| krishna jinottariyaya vyalayajnopavitine | ishanavajrasamhaya
    harikesha namo'stu te | avivekaikanathaya vyaktavyakta namo'stu te || 220|| kama kamada kamadhna dhrishtodriptanishudana
    | sarva sarvada sarvajna sandhyaraga namo'stu te || 221|| mahabala mahabaho mahasattva mahadyute |
    mahameghavarapreksha mahakala namo'stu te || 222|| sthulajirnangajatine valkalajinadharine | diptasuryagnijatine
    valkalajinavasase | sahasrasuryapratima taponitya namo'stu te || 223|| unmadanashatavartta gangatoyarddhamurddhaja
    | candravartta yugavartta meghavartta namo'stu te || 224|| tvamannamannakartta ca annadashca tvameva
    hi | annasrashta ca pakta ca pakvabhuktapace namah || 225|| jarayujo'ndajashcaiva svedajodbhijja eva
    ca | tvameva devadevasho bhutagramashcaturvidhah || 226|| caracarasya brahma tvam pratihartta tvameva
    ca | tvameva brahmavidushamapi brahmavidam varah || 227|| sattvasya parama yonirabvayujyotisham nidhih
    | riksamani tathonkaramahustvam brahmavadinah || 228|| havirhavi havo havi huvam vacahutih sada |
    gayanti tvam surashreshtha samaga brahmavadinah || 229|| yajurmayo rinmayashca samatharvamayastatha
    | pathyase brahmavidbhistvam kalpopanishadam ganaih || 230|| brahmanah kshatriya vaishyah shudra varnavarashca
    ye | tvameva meghasanghashca vishvasta nitagarjjitam || 231|| samvatsarastvamritavo masa masarddhameva
    ca | kala kashtha nimeshashca nakshatrani yuga grahah || 232|| vrishanam kakudam tvam hi girinam shikharani
    ca | simho mriganam patatam tarkshyo'nantashca bhoginam || 233|| kshirodo hyudadhinanca yantranam
    dhanureva ca | vajrampraharanananca vratanam satyameva ca || 234|| iccha dveshashca ragashca mohah
    kshamo damah shamah | vyavasayo dhritirlobhah kamakrodhau jayajayau || 235|| tvam gadi tvam shari
    capi khatvangi jharjhari tatha | chetta bhetta prahartta ca tvam netapyantako matah || 236|| dashalakshanasamyukto
    dharmo'rthah kama eva ca | indrah samudrah saritah palvalani saramsi ca || 237|| latavalli trinaushadhyah
    pashavo mrigapakshinah | dravyakarmagunarambhah kalapushpaphalapradah || 238|| adishcantashca madhyashca
    gayatryonkara eva ca | harito lohitah krishno nilah pitastatharunah || 239|| kadrushca kapilashcaiva
    kapoto mecakastatha | suvarnareta vikhyatah suvarnashcapyato matah || 240|| suvarnanama ca tatha suvarnapriya
    eva ca | tvamindro'tha yamashcaiva varuno dhanado'nalah || 241|| utphullashcitrabhanushca svarbhanurbhanureva
    ca | hotram hota ca homastvam hutanca prahutam prabhuh || 242|| suparnanca tatha brahma yajusham shatarudriyam
    | pavitranam pavitram ca mangalananca mangalam || 243|| girih stokastatha vriksho jivah pudgala eva
    ca | sattvam tvanca rajastvanca tamashca prajanam tatha || 244|| prano'panah samanashca udano vyana
    eva ca | unmeshashcaiva meshashca tatha jrimbhitameva ca || 245|| lohitango gadi damshtri mahavaktro
    mahodarah | shuciroma haricchmashrururddhvakeshastrilocanah || 246|| gitavaditranrityango gitavadanakapriyah
    | matsyo jali jalo jalyo javah kalah kali kalah || 247|| vikalashca sukalashca dushkalah kalanashanah
    | mrityushcaiva kshayo'ntashca kshamapayakaro harah || 248|| samvarttako'ntakashcaiva samvarttakabalahakau
    | ghato ghatiko ghantiko cudalolabalo balam || 249|| brahmakalo'gnivaktrashca dandi mundi ca dandadhrik
    | caturyugashcaturvedashcaturhotrashcatushpathah || 250|| catura shramavetta ca caturvarnyakarashca
    ha | ksharaksharapriyo dhurtto'ganyo'ganyaganadhipah || 251|| rudrakshamalyambaradharo giriko girikapriyah
    | shilpishah shilpinam shreshthah sarvashilpapravarttakah || 252|| bhaganetrantakashcandrah pushno
    dantavinashanah | gudhavarttashca gudhashca gudhapratinishevita || 253|| taranastarakashcaiva sarvabhutasutaranah
    | dhata vidhata sattvanam nidhata dharano dharah || 254|| tapo brahma ca satyanca brahmacaryamatharjavam
    | bhutatma bhutakridbhuto bhutabhavyabhavodbhavah || 255|| bhurbhuvahsvaritashcaiva tathotpattirmaheshvarah
    | ishano vikshanah shanto durdanto dantanashanah || 256|| brahmavartta suravartta kamavartta namo'stu
    te | kamabimbanihartta ca karnikararajahpriyah || 257|| mukhacandro bhimamukhah sumukho durmukho mukhah
    | caturmukho bahumukho rane hyabhimukhah sada || 258|| hiranyagarbhah shakunirmahodadhih paro virat
    | adharmaha mahadando dandadhari ranapriyah || 259|| gotamo gopratarashca govrisheshvaravahanah |
    dharmakriddharmasrashta ca dharmo dharmaviduttamah || 260|| trailokyagopta govindo manado mana eva
    ca | tishthan sthirashca sthanushca nishkampah kampa eva ca || 261|| durvarano durvishado duhsaho
    duratikramah | durddharo dushprakampashca durvido durjjayo jayah || 262|| shashah shashankah shamanah
    shitoshnam durjara'tha trit | adhayo vyadhayashcaiva vyadhiha vyadhigashca ha || 263|| sahyo yajno
    mriga vyadha vyadhinamakaro'karah | shikhandi pundarikakshah pundarikavalokanah || 264|| dandadharah
    sadandashca dandamundavibhushitah | vishapo'mritapashcaiva surapah kshirasomapah || 265|| madhupashcajyapashcaiva
    sarvapashca mahabalah | vrishashvavahyo vrishabhastatha vrishabhalocanah || 266|| vrishabhashcaiva
    vikhyato lokanam lokasatkritah | candradityau cakshushi te hridayanca pitamahah | agnirapastatha devo
    dharmakarmaprasadhitah || 267|| na brahma na ca govindah puranarishayo na ca | mahatmyam veditum shakta
    yathatathyena te shiva || 268|| ya murttayah susukshmaste na mahyam yanti darshanam | tabhirmam satatam
    raksha pita putramivaurasam || 269|| raksha mam rakshaniyo'ham tavanagha namo'stu te | bhaktanukampi
    bhagavan bhaktashcaham sada tvayi || 270|| yah sahasranyanekani pumsamahritya durddashah | tishthatyekah
    samudrante sa me goptastu nityashah || 271|| yam vinidra jitashvasah sattvasthah samadarshinah | jyotih
    pashyanti yunjanastasmai yogatmane namah || 272|| sambhakshya sarva bhutani yugante samupasthite |
    yah shete jalamadhyasthastam prapadye'psushayinam || 273|| pravishya vadane rahoryah somam grasate
    nishi | grasatyarkanca svarbhanurbhutva somagnireva ca || 274|| ye'ngushthamatrah purusha dehasthah
    sarvadehinam | rakshantu te hi mam nityam nityamapyayayantu mam || 275|| ye capyutpatita garbhadadhobhagagatashca
    ye | tesham svahah svadhashcaiva apnuvantu svadantu ca || 276|| ye na rodanti dehasthah pranino rodayanti
    ca | harshayanti ca hrishyanti namastebhyo'stu nityashah || 277|| ye samudre nadidurge parvateshu
    guhasu ca | vrikshamuleshu goshtheshu kantaragahaneshu na || 278|| catushpatheshu rathyasu catvareshu
    sabhasu ca | candrarkayormadhyagata ye ca candrarkarashmishu || 279|| rasatalagata ye ca ye ca tasmatparangatah
    | namastebhyo namastebhyo namastebhyashca nityashah | sukshmah sthulah krisha hrasva namastebhyastu
    nityashah || 280|| sarvastvam sarvago deva sarvabhutapatirbhavan | sarvabhutantaratma ca tena tvam
    na nimantritah || 281|| tvameva cejyase yasmadyajnairvividhadakshinaih | tvameva kartta sarvasya tena
    tvam na nimantritah || 282|| athava mayaya deva mohitah sukshmaya tvaya | etasmat karanadvapi tena
    tvam na nimantritah || 283|| prasida mama devesha tvameva sharanam mama | tvam gatistvam pratishtha
    ca na canyasti na me gatih || 284|| stutvaivam sa mahadevam virarama prajapatih | bhagavanapi supritah
    punardakshamabhashata || 285|| paritushto'smi te daksha stavenanena suvrata | bahunatra kimuktena
    matsamipam gamishyasi || 286|| athainamabravidvakyam trailokyadhipatirbhavah | kritvashvasakaram vakyam
    vakyajno vakyamahatam || 287|| daksha daksha na karttavyo manyurvighnamimam prati | aham yajnaha na
    tvanyo drishyate tatpura tvaya || 288|| bhuyashca tam varamimam matto grihnishva suvrata | prasannavadano
    bhutva tvamekagramanah sha
  devanagari: ृगालाय तारकाय तराय च । नमो यज्ञाधिपतये द्रुतायोपद्रुताय च ॥ २११॥ यज्ञवाहाय दानाय तप्याय
    तपनाय च । नमस्तटाय भव्याय तडितां पतये नमः ॥ २१२॥ अन्नदायान्नपतये नमोऽस्त्वन्नभवाय च । नमः सहस्रशीर्ष्णे
    च सहस्रचरणाय च ॥ २१३॥ सहस्रोद्यतशूलाय सहस्रनयनाय च । नमोऽस्तु बालरूपाय बालरूपधराय च ॥ २१४॥ बालानाञ्चैव
    गोप्त्रे च बालक्रीडनकाय च । नमः शुद्धाय बुद्धाय क्षोभणायाक्षताय च ॥ २१५॥ तरङ्गाङ्कितकेशाय मुक्तकेशाय
    वै नमः । नमः षट्कर्मनिष्ठाय त्रिकर्मनिरताय च ॥ २१६॥ वर्णाश्रमाणां विधिवत् पृथक्कर्मप्रवर्तिने । नमो
    घोषाय घोष्याय नमः कलकलाय च ॥ २१७॥ श्वेतपिङ्गलनेत्राय कृष्णरक्तक्षणाय च । धर्मार्थ काममोक्षाय क्रथाय
    कथनाय च ॥ २१८॥ साङ्ख्याय साङ्ख्यमुख्याय योगाधिपतये नमः । नमो रथ्यविरथ्याय चतुष्पथरताय च ॥ २१९॥ कृष्णा
    जिनोत्तरीयाय व्यालयज्ञोपवीतिने । ईशानवज्रसंहाय हरिकेश नमोऽस्तु ते । अविवेकैकनाथाय व्यक्ताव्यक्त नमोऽस्तु
    ते ॥ २२०॥ काम कामद कामध्न धृष्टोदृप्तनिषूदन । सर्व सर्वद सर्वज्ञ सन्ध्याराग नमोऽस्तु ते ॥ २२१॥ महाबाल
    महाबाहो महासत्त्व महाद्युते । महामेघवरप्रेक्ष महाकाल नमोऽस्तु ते ॥ २२२॥ स्थूलजीर्णाङ्गजटिने वल्कलाजिनधारिणे
    । दीप्तसूर्याग्निजटिने वल्कलाजिनवाससे । सहस्रसूर्यप्रतिम तपोनित्य नमोऽस्तु ते ॥ २२३॥ उन्मादनशतावर्त्त
    गङ्गातोयार्द्धमूर्द्धज । चन्द्रावर्त्त युगावर्त्त मेघावर्त्त नमोऽस्तु ते ॥ २२४॥ त्वमन्नमन्नकर्त्ता
    च अन्नदश्च त्वमेव हि । अन्नस्रष्टा च पक्ता च पक्वभुक्तपचे नमः ॥ २२५॥ जरायुजोऽण्डजश्चैव स्वेदजोद्भिज्ज
    एव च । त्वमेव देवदेवशो भूतग्रामश्चतुर्विधः ॥ २२६॥ चराचरस्य ब्रह्मा त्वं प्रतिहर्त्ता त्वमेव च । त्वमेव
    ब्रह्मविदुषामपि ब्रह्मविदां वरः ॥ २२७॥ सत्त्वस्य परमा योनिरब्वायुज्योतिषां निधिः । ऋक्सामानि तथोङ्कारमाहुस्त्वां
    ब्रह्मवादिनः ॥ २२८॥ हविर्हावी हवो हावी हुवां वाचाहुतिः सदा । गायन्ति त्वां सुरश्रेष्ठ सामगा ब्रह्मवादिनः
    ॥ २२९॥ यजुर्मयो ऋङ्मयश्च सामाथर्वमयस्तथा । पठ्यसे ब्रह्मविद्भिस्त्वं कल्पोपनिषदां गणैः ॥ २३०॥ ब्राह्मणाः
    क्षत्रिया वैश्याः शूद्रा वर्णावराश्च ये । त्वामेव मेघसङ्घाश्च विश्वस्त नितगर्ज्जितम् ॥ २३१॥ संवत्सरस्त्वमृतवो
    मासा मासार्द्धमेव च । कला काष्ठा निमेषाश्च नक्षत्राणि युगा ग्रहाः ॥ २३२॥ वृषाणां ककुदं त्वं हि गिरीणां
    शिखराणि च । सिंहो मृगाणां पततां तार्क्ष्योऽनन्तश्च भोगिनाम् ॥ २३३॥ क्षीरोदो ह्युदधीनाञ्च यन्त्राणां
    धनुरेव च । वज्रम्प्रहरणानाञ्च व्रतानां सत्यमेव च ॥ २३४॥ इच्छा द्वेषश्च रागश्च मोहः क्षामो दमः शमः
    । व्यवसायो धृतिर्लोभः कामक्रोधौ जयाजयौ ॥ २३५॥ त्वं गदी त्वं शरी चापि खट्वाङ्गी झर्झरी तथा । छेत्ता
    भेत्ता प्रहर्त्ता च त्वं नेताप्यन्तको मतः ॥ २३६॥ दशलक्षणसंयुक्तो धर्मोऽर्थः काम एव च । इन्द्रः समुद्राः
    सरितः पल्वलानि सरांसि च ॥ २३७॥ लतावल्ली तृणौषध्यः पशवो मृगपक्षिणः । द्रव्यकर्मगुणारम्भः कालपुष्पफलप्रदः
    ॥ २३८॥ आदिश्चान्तश्च मध्यश्च गायत्र्योङ्कार एव च । हरितो लोहितः कृष्णो नीलः पीतस्तथारुणः ॥ २३९॥ कद्रुश्च
    कपिलश्चैव कपोतो मेचकस्तथा । सुवर्णरेता विख्यातः सुवर्णश्चाप्यतो मतः ॥ २४०॥ सुवर्णनामा च तथा सुवर्णप्रिय
    एव च । त्वमिन्द्रोऽथ यमश्चैव वरुणो धनदोऽनलः ॥ २४१॥ उत्फुल्लश्चित्रभानुश्च स्वर्भानुर्भानुरेव च । होत्रं
    होता च होमस्त्वं हुतञ्च प्रहुतं प्रभुः ॥ २४२॥ सुपर्णञ्च तथा ब्रह्म यजुषां शतरुद्रियम् । पवित्राणां
    पवित्रं च मङ्गलानाञ्च मङ्गलम् ॥ २४३॥ गिरिः स्तोकस्तथा वृक्षो जीवः पुद्गल एव च । सत्त्वं त्वञ्च रजस्त्वञ्च
    तमश्च प्रजनं तथा ॥ २४४॥ प्राणोऽपानः समानश्च उदानो व्यान एव च । उन्मेषश्चैव मेषश्च तथा जृम्भितमेव च
    ॥ २४५॥ लोहिताङ्गो गदी दंष्ट्री महावक्त्रो महोदरः । शुचिरोमा हरिच्छ्मश्रुरूर्द्ध्वकेशस्त्रिलोचनः ॥
    २४६॥ गीतवादित्रनृत्याङ्गो गीतवादनकप्रियः । मत्स्यो जली जलो जल्यो जवः कालः कली कलः ॥ २४७॥ विकालश्च
    सुकालश्च दुष्कालः कलनाशनः । मृत्युश्चैव क्षयोऽन्तश्च क्षमापायकरो हरः ॥ २४८॥ संवर्त्तकोऽन्तकश्चैव संवर्त्तकबलाहकौ
    । घटो घटीको घण्टीको चूडालोलबलो बलम् ॥ २४९॥ ब्रह्मकालोऽग्निवक्त्रश्च दण्डी मुण्डी च दण्डधृक् । चतुर्युगश्चतुर्वेदश्चतुर्होत्रश्चतुष्पथः
    ॥ २५०॥ चतुरा श्रमवेत्ता च चातुर्वर्ण्यकरश्च ह । क्षराक्षरप्रियो धूर्त्तोऽगण्योऽगण्यगणाधिपः ॥ २५१॥
    रुद्राक्षमाल्याम्बरधरो गिरिको गिरिकप्रियः । शिल्पीशः शिल्पिनां श्रेष्ठः सर्वशिल्पप्रवर्त्तकः ॥ २५२॥
    भगनेत्रान्तकश्चन्द्रः पूष्णो दन्तविनाशनः । गूढावर्त्तश्च गूढश्च गूढप्रतिनिषेविता ॥ २५३॥ तरणस्तारकश्चैव
    सर्वभूतसुतारणः । धाता विधाता सत्त्वानां निधाता धारणो धरः ॥ २५४॥ तपो ब्रह्म च सत्यञ्च ब्रह्मचर्यमथार्जवम्
    । भूतात्मा भूतकृद्भूतो भूतभव्यभवोद्भवः ॥ २५५॥ भूर्भुवःस्वरितश्चैव तथोत्पत्तिर्महेश्वरः । ईशानो वीक्षणः
    शान्तो दुर्दान्तो दन्तनाशनः ॥ २५६॥ ब्रह्मावर्त्त सुरावर्त्त कामावर्त्त नमोऽस्तु ते । कामबिम्बनिहर्त्ता
    च कर्णिकाररजःप्रियः ॥ २५७॥ मुखचन्द्रो भीममुखः सुमुखो दुर्मुखो मुखः । चतुर्मुखो बहुमुखो रणे ह्यभिमुखः
    सदा ॥ २५८॥ हिरण्यगर्भः शकुनिर्महोदधिः परो विराट् । अधर्महा महादण्डो दण्डधारी रणप्रियः ॥ २५९॥ गोतमो
    गोप्रतारश्च गोवृषेश्वरवाहनः । धर्मकृद्धर्मस्रष्टा च धर्मो धर्मविदुत्तमः ॥ २६०॥ त्रैलोक्यगोप्ता गोविन्दो
    मानदो मान एव च । तिष्ठन् स्थिरश्च स्थाणुश्च निष्कम्पः कम्प एव च ॥ २६१॥ दुर्वारणो दुर्विषदो दुःसहो
    दुरतिक्रमः । दुर्द्धरो दुष्प्रकम्पश्च दुर्विदो दुर्ज्जयो जयः ॥ २६२॥ शशः शशाङ्कः शमनः शीतोष्णं दुर्जराऽथ
    तृट् । आधयो व्याधयश्चैव व्याधिहा व्याधिगश्च ह ॥ २६३॥ सह्यो यज्ञो मृगा व्याधा व्याधीनामाकरोऽकरः । शिखण्डी
    पुण्डरीकाक्षः पुण्डरीकावलोकनः ॥ २६४॥ दण्डधरः सदण्डश्च दण्डमुण्डविभूषितः । विषपोऽमृतपश्चैव सुरापः क्षीरसोमपः
    ॥ २६५॥ मधुपश्चाज्यपश्चैव सर्वपश्च महाबलः । वृषाश्ववाह्यो वृषभस्तथा वृषभलोचनः ॥ २६६॥ वृषभश्चैव विख्यातो
    लोकानां लोकसत्कृतः । चन्द्रादित्यौ चक्षुषी ते हृदयञ्च पितामहः । अग्निरापस्तथा देवो धर्मकर्मप्रसाधितः
    ॥ २६७॥ न ब्रह्मा न च गोविन्दः पुराणऋषयो न च । माहात्म्यं वेदितुं शक्ता याथातथ्येन ते शिव ॥ २६८॥ या
    मूर्त्तयः सुसूक्ष्मास्ते न मह्यं यान्ति दर्शनम् । ताभिर्मां सततं रक्ष पिता पुत्रमिवौरसम् ॥ २६९॥ रक्ष
    मां रक्षणीयोऽहं तवानघ नमोऽस्तु ते । भक्तानुकम्पी भगवान् भक्तश्चाहं सदा त्वयि ॥ २७०॥ यः सहस्राण्यनेकानि
    पुंसामाहृत्य दुर्द्दशः । तिष्ठत्येकः समुद्रान्ते स मे गोप्तास्तु नित्यशः ॥ २७१॥ यं विनिद्रा जितश्वासाः
    सत्त्वस्थाः समदर्शिनः । ज्योतिः पश्यन्ति युञ्जानास्तस्मै योगात्मने नमः ॥ २७२॥ सम्भक्ष्य सर्व भूतानि
    युगान्ते समुपस्थिते । यः शेते जलमध्यस्थस्तं प्रपद्येऽप्सुशायिनम् ॥ २७३॥ प्रविश्य वदने राहोर्यः सोमं
    ग्रसते निशि । ग्रसत्यर्कञ्च स्वर्भानुर्भूत्वा सोमाग्निरेव च ॥ २७४॥ येऽङ्गुष्ठमात्राः पुरुषा देहस्थाः
    सर्वदेहिनाम् । रक्षन्तु ते हि मां नित्यं नित्यमाप्याययन्तु माम् ॥ २७५॥ ये चाप्युत्पतिता गर्भादधोभागगताश्च
    ये । तेषां स्वाहाः स्वधाश्चैव आप्नुवन्तु स्वदन्तु च ॥ २७६॥ ये न रोदन्ति देहस्थाः प्राणिनो रोदयन्ति
    च । हर्षयन्ति च हृष्यन्ति नमस्तेभ्योऽस्तु नित्यशः ॥ २७७॥ ये समुद्रे नदीदुर्गे पर्वतेषु गुहासु च ।
    वृक्षमूलेषु गोष्ठेषु कान्तारगहनेषु न ॥ २७८॥ चतुष्पथेषु रथ्यासु चत्वरेषु सभासु च । चन्द्रार्कयोर्मध्यगता
    ये च चन्द्रार्करश्मिषु ॥ २७९॥ रसातलगता ये च ये च तस्मात्परङ्गताः । नमस्तेभ्यो नमस्तेभ्यो नमस्तेभ्यश्च
    नित्यशः । सूक्ष्माः स्थूलाः कृशा ह्रस्वा नमस्तेभ्यस्तु नित्यशः ॥ २८०॥ सर्वस्त्वं सर्वगो देव सर्वभूतपतिर्भवान्
    । सर्वभूतान्तरात्मा च तेन त्वं न निमन्त्रितः ॥ २८१॥ त्वमेव चेज्यसे यस्माद्यज्ञैर्विविधदक्षिणैः । त्वमेव
    कर्त्ता सर्वस्य तेन त्वं न निमन्त्रितः ॥ २८२॥ अथवा मायया देव मोहितः सूक्ष्मया त्वया । एतस्मात् कारणाद्वापि
    तेन त्वं न निमन्त्रितः ॥ २८३॥ प्रसीद मम देवेश त्वमेव शरणं मम । त्वं गतिस्त्वं प्रतिष्ठा च न चान्यास्ति
    न मे गतिः ॥ २८४॥ स्तुत्वैवं स महादेवं विरराम प्रजापतिः । भगवानपि सुप्रीतः पुनर्दक्षमभाषत ॥ २८५॥ परितुष्टोऽस्मि
    ते दक्ष स्तवेनानेन सुव्रत । बहुनात्र किमुक्तेन मत्समीपं गमिष्यसि ॥ २८६॥ अथैनमब्रवीद्वाक्यं त्रैलोक्याधिपतिर्भवः
    । कृत्वाश्वासकरं वाक्यं वाक्यज्ञो वाक्यमाहतम् ॥ २८७॥ दक्ष दक्ष न कर्त्तव्यो मन्युर्विघ्नमिमं प्रति
    । अहं यज्ञहा न त्वन्यो दृश्यते तत्पुरा त्वया ॥ २८८॥ भूयश्च तं वरमिमं मत्तो गृह्णीष्व सुव्रत । प्रसन्नवदनो
    भूत्वा त्वमेकाग्रमनाः श
