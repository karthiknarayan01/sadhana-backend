id: sudarshana-ashtottara-sata-namavali
category: stotram
name:
  english: Sudarshana Ashtottara Sata Namavali
content:
  english: om shri sudarshanaya namah | om cakrarajaya namah | om tejovyuhaya namah | om mahadyutaye namah
    | om sahasra bahave namah | om diptangaya namah | om arunakshaya namah | om pratapavate namah | om
    anekaditya sankashaya namah | om prodyajjvalabhiranjitaya namah | sahasrabhaya namah | om manikundala
    shobhitaya namah | om pancabhutamano rupaya namah | om shatkonantara samsthitaya namah | om harantahkaranodbhutarosha
    bhishana vigrahaya namah | om haripanilasatpadmavihara manoharaya namah | om shrakararupaya namah
    | om sarvajnaya namah | om sarvalokarcitaprabhave namah | om caturdashasahasraraya namah | | om caturvedamayaya
    namah | om analaya namah | om bhaktacandramasa jyotishe namah | om bhavaroga vinashakaya namah | om
    rephatmakaya namah | om makaraya namah | om rakshosrigrushitangaya namah | om sarvadaityagrivanala
    damshtraya namah | om ujjvalakaraya namah | | om bhimakarmane namah | om trilocanaya namah | om nilavartmane
    namah | om nityasukhaya namah | om nirmalashriyai namah | om niranjanaya namah | om raktamalyambaradharaya
    namah | om raktacandana rushitaya namah | om rajogunakritaye namah | om shuraya namah | yamopamaya
    namah | om nitya kshemakaraya namah | om prajnaya namah | om pashandajana khandanaya namah | om narayanajnanuvartine
    namah | om naigamantah prakashakaya namah | om balinandanadordandakhandanaya namah | om vijayakritaye
    namah | om mitrabhavine namah | om sarvamayaya namah | vidhvamsakaya namah | om rajassattvatamodvartine
    namah | om trigunatmane namah | om trilokadhrite namah | om harimayagunopetaya namah | om avyayaya
    namah | om akshasvarupabhaje namah | om paramatmane namah | om param jyotishe namah | om pancakritya
    prabhamayaya namah | om sadasat paramaya namah | om purnaya namah | om vanmayaya namah | om varadaya
    namah | om acyutaya namah | om jivaya namah | om gurave namah | om hamsarupaya namah | om pancashatpitha
    | om matrikamandaladhyakshaya namah | om madhu dhvamsine namah | om manomayaya namah | om buddhirupaya
    namah | om cittasakshine namah | om saraya namah | om hamsaksharadvayaya namah | om mantra prabhavajnaya
    namah | om mantra yantramayaya namah | om vibhave namah | | om srashtre namah | om kriyaspadaya namah
    | om shuddhaya namah | om adharaya namah | om cakra rupakaya namah | om nirayudhaya namah | om asamrambhaya
    namah | om sarvayudha samanvitaya namah | om onkara rupine namah | om purnatmane namah | bandhanaya
    namah | om ainkaraya namah | om vakpradaya namah | om vagmine namah | om shrinkaraishvarya vardhanaya
    namah | om klinkara mohanakaraya namah | om humphatkshobhanakritaye namah | om indrarcita manovegaya
    namah | om dharanibhara nashakaya namah | om viraradhyaya namah | | om vishvarupaya namah | om vaishnavaya
    namah | om vishnu rupakaya namah | om satyavrataya namah | om satyaparaya namah | om satyadharmanushangakaya
    namah | om narayanakripavyuhatejashcakraya namah | om sudarshanaya namah | parabrahmane namah | ||
    shri sudarshanashtottarashatanamavalih sampurna ||
  devanagari: ॐ श्री सुदर्शनाय नमः । ॐ चक्रराजाय नमः । ॐ तेजोव्यूहाय नमः । ॐ महाद्युतये नमः । ॐ सहस्र
    बाहवे नमः । ॐ दीप्ताङ्गाय नमः । ॐ अरुणाक्षाय नमः । ॐ प्रतापवते नमः । ॐ अनेकादित्य सङ्काशाय नमः । ॐ
    प्रोद्यज्ज्वालाभिरञ्जिताय नमः । सहस्राभाय नमः । ॐ मणिकुण्डल शोभिताय नमः । ॐ पञ्चभूतमनो रूपाय नमः ।
    ॐ षट्कोणान्तर संस्थिताय नमः । ॐ हरान्तःकरणोद्भूतरोष भीषण विग्रहाय नमः । ॐ हरिपाणिलसत्पद्मविहार मनोहराय
    नमः । ॐ श्राकाररूपाय नमः । ॐ सर्वज्ञाय नमः । ॐ सर्वलोकार्चितप्रभवे नमः । ॐ चतुर्दशसहस्राराय नमः ।
    । ॐ चतुर्वेदमयाय नमः । ॐ अनलाय नमः । ॐ भक्तचान्द्रमस ज्योतिषे नमः । ॐ भवरोग विनाशकाय नमः । ॐ रेफात्मकाय
    नमः । ॐ मकाराय नमः । ॐ रक्षोसृग्रूषिताङ्गाय नमः । ॐ सर्वदैत्यग्रीवानाल दंष्ट्राय नमः । ॐ उज्ज्वलाकाराय
