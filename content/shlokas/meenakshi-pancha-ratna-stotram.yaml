id: meenakshi-pancha-ratna-stotram
category: stotram
name:
  english: Meenakshi Pancha Ratna Stotram
content:
  english: udyadbhanusahasrakotisadrisham keyuraharojjvalam bimboshthim smitadantapanktiruciram pitambaralankritam
    | vishnubrahmasurendrasevitapadam tattvasvarupam shivam minakshim pranato'smi santatamaham karunyavarannidhim
    || || muktaharalasatkiritaruciram purnenduvaktraprabham shinjannupurakinkinimanidharam padmaprabhabhasuram
    | sarvabhishtaphalapradam girisutam vaniramasevitam minakshim pranato'smi santatamaham karunyavarannidhim
    || || shrividyam shivavamabhaganilayam hrinkaramantrojjvalam shricakrankitabindumadhyavasatim shrimatsabhanayakim
    | shrimatshanmukhavighnarajajananim shrimajjaganmohinim minakshim pranato'smi santatamaham karunyavarannidhim
    || || shrimatsundaranayikam bhayaharam jnanapradam nirmalam shyamabham kamalasanarcitapadam narayanasyanujam
    | vinavenumridangavadyarasikam nanavidhamambikam minakshim pranato'smi santatamaham karunyavarannidhim
    || || nanayogimunindrahritsuvasatim nanarthasiddhipradam nanapushpavirajitanghriyugalam narayanenarcitam
    | nadabrahmamayim paratparataram nanarthatatvatmikam minakshim pranato'smi santatamaham karunyavarannidhim
    ||
  devanagari: उद्यद्भानुसहस्रकोटिसदृशां केयूरहारोज्ज्वलां बिम्बोष्ठीं स्मितदन्तपङ्क्तिरुचिरां पीताम्बरालङ्कृताम्
    । विष्णुब्रह्मसुरेन्द्रसेवितपदां तत्त्वस्वरूपां शिवां मीनाक्षीं प्रणतोऽस्मि सन्ततमहं कारुण्यवारान्निधिम्
    ॥ ॥ मुक्ताहारलसत्किरीटरुचिरां पूर्णेन्दुवक्त्रप्रभां शिञ्जन्नूपुरकिङ्किणीमणिधरां पद्मप्रभाभासुराम्
    । सर्वाभीष्टफलप्रदां गिरिसुतां वाणीरमासेवितां मीनाक्षीं प्रणतोऽस्मि सन्ततमहं कारुण्यवारान्निधिम् ॥
    ॥ श्रीविद्यां शिववामभागनिलयां ह्रीङ्कारमन्त्रोज्ज्वलां श्रीचक्राङ्कितबिन्दुमध्यवसतिं श्रीमत्सभानायकीम्
    । श्रीमत्षण्मुखविघ्नराजजननीं श्रीमज्जगन्मोहिनीं मीनाक्षीं प्रणतोऽस्मि सन्ततमहं कारुण्यवारान्निधिम्
    ॥ ॥ श्रीमत्सुन्दरनायिकां भयहरां ज्ञानप्रदां निर्मलां श्यामाभां कमलासनार्चितपदां नारायणस्यानुजाम् ।
    वीणावेणुमृदङ्गवाद्यरसिकां नानाविधामम्बिकां मीनाक्षीं प्रणतोऽस्मि सन्ततमहं कारुण्यवारान्निधिम् ॥ ॥
    नानायोगिमुनीन्द्रहृत्सुवसतीं नानार्थसिद्धिप्रदां नानापुष्पविराजिताङ्घ्रियुगलां नारायणेनार्चिताम् ।
    नादब्रह्ममयीं परात्परतरां नानार्थतत्वात्मिकां मीनाक्षीं प्रणतोऽस्मि सन्ततमहं कारुण्यवारान्निधिम् ॥
