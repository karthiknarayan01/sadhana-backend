id: kayasthakritamharistotram
category: stotram
name:
  english: kayasthakritamharistotram
  devanagari: कायस्थकृतंहरिस्तोत्रम्
content:
  english: kayasthakritam haristotram namaste papahartre'tra rogahartre namo namah || 24|| bhaktanam sukhakartre'tra
    tirthe goptre namo'stu te | namaste sarvakarnaya namaste sarvacakshushe || 25|| namaste sarvavijnaya
    sarvahritsthaya te namah | namah kayastharupaya namo nikayayojine || 26|| namashcadrishyarupaya sharanagatarakshine
    | ityevam prarthayamasa kayastho vimana iva || 27|| iti shrilakshminarayaniyasamhita | khanda 2| adhyaya
    263
  devanagari: कायस्थकृतं हरिस्तोत्रम् नमस्ते पापहर्त्रेऽत्र रोगहर्त्रे नमो नमः ॥ २४॥ भक्तानां सुखकर्त्रेऽत्र
    तीर्थे गोप्त्रे नमोऽस्तु ते । नमस्ते सर्वकर्णाय नमस्ते सर्वचक्षुषे ॥ २५॥ नमस्ते सर्वविज्ञाय सर्वहृत्स्थाय
    ते नमः । नमः कायस्थरूपाय नमो निकाययोजिने ॥ २६॥ नमश्चादृश्यरूपाय शरणागतरक्षिणे । इत्येवं प्रार्थयामास
    कायस्थो विमना इव ॥ २७॥ इति श्रीलक्ष्मीनारायणीयसंहिता । खण्ड २। अध्याय २६३
meaning: {}
