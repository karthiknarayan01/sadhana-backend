id: bhishma-kruta-sri-krishna-stuti
category: stotram
name:
  english: Bhishma Kruta Sri Krishna Stuti
content:
  english: bhishma uvaca | iti matirupakalpita vitrishna bhagavati satvatapungave vibhumni | svasukhamupagate
    kvacidvihartum prakritimupeyushi yadbhavapravahah || || tribhuvanakamanam tamalavarnam ravikaragauravarambaram
    dadhane | vapuralakakulavritananabjam vijayasakhe ratirastu me'navadya || || yudhi turagarajovidhumravishvak
    kacalulitashramavaryalankritasye | mama nishitasharairvibhidyamana tvaci vilasatkavace'stu krishna
    atma || || sapadi sakhivaco nishamya madhye nijaparayorbalayo ratham niveshya | sthitavati parasainikayurakshna
    hritavati parthasakhe ratirmamastu || || vyavahita prithanamukham nirikshya svajanavadhadvimukhasya
    doshabuddhya | kumatimaharadatmavidyaya ya shcaranaratih paramasya tasya me'stu || || svanigamamapahaya
    matpratijnam ritamadhikartumavapluto rathasthah | dhritarathacarano'bhyayaccaladguh haririva hantumibham
    gatottariyah || || shitavishikhahato vishirnadamshah kshatajaparipluta atatayino me | prasabhamabhisasara
    madvadhartham sa bhavatu me bhagavan gatirmukundah || || vijayarathakutumba attatotre dhritahayarashmini
    tacchriyekshaniye | bhagavati ratirastu me mumurshoh yamiha nirikshya hatah gatah sarupam || || lalita
    gati vilasa valguhasa pranaya nirikshana kalpitorumanah | kritamanukritavatya unmadandhah prakritimagan
    kila yasya gopavadhvah || || munigananripavaryasankule'ntah sadasi yudhishthirarajasuya esham | arhanamupapeda
    ikshaniyo mama drishigocara esha aviratma || || tamimamahamajam sharirabhajam hridi hridi dhishtitamatmakalpitanam
    | pratidrishamiva naikadha'rkamekam samadhigato'smi vidhutabhedamohah || || iti shrimadbhagavate mahapurane
    prathamaskandhe navamo'dhyaye bhishmakrita bhagavat stutih |
  devanagari: भीष्म उवाच । इति मतिरुपकल्पिता वितृष्णा भगवति सात्वतपुङ्गवे विभूम्नि । स्वसुखमुपगते क्वचिद्विहर्तुं
    प्रकृतिमुपेयुषि यद्भवप्रवाहः ॥ ॥ त्रिभुवनकमनं तमालवर्णं रविकरगौरवराम्बरं दधाने । वपुरलककुलावृताननाब्जं
    विजयसखे रतिरस्तु मेऽनवद्या ॥ ॥ युधि तुरगरजोविधूम्रविष्वक् कचलुलितश्रमवार्यलङ्कृतास्ये । मम निशितशरैर्विभिद्यमान
    त्वचि विलसत्कवचेऽस्तु कृष्ण आत्मा ॥ ॥ सपदि सखिवचो निशम्य मध्ये निजपरयोर्बलयो रथं निवेश्य । स्थितवति
    परसैनिकायुरक्ष्णा हृतवति पार्थसखे रतिर्ममास्तु ॥ ॥ व्यवहित पृथनामुखं निरीक्ष्य स्वजनवधाद्विमुखस्य
    दोषबुद्ध्या । कुमतिमहरदात्मविद्यया य श्चरणरतिः परमस्य तस्य मेऽस्तु ॥ ॥ स्वनिगममपहाय मत्प्रतिज्ञां
    ऋतमधिकर्तुमवप्लुतो रथस्थः । धृतरथचरणोऽभ्ययाच्चलद्गुः हरिरिव हन्तुमिभं गतोत्तरीयः ॥ ॥ शितविशिखहतो विशीर्णदंशः
    क्षतजपरिप्लुत आततायिनो मे । प्रसभमभिससार मद्वधार्थं स भवतु मे भगवान् गतिर्मुकुन्दः ॥ ॥ विजयरथकुटुम्ब
    आत्ततोत्रे धृतहयरश्मिनि तच्छ्रियेक्षणीये । भगवति रतिरस्तु मे मुमूर्षोः यमिह निरीक्ष्य हताः गताः सरूपम्
    ॥ ॥ ललित गति विलास वल्गुहास प्रणय निरीक्षण कल्पितोरुमानाः । कृतमनुकृतवत्य उन्मदान्धाः प्रकृतिमगन्
    किल यस्य गोपवध्वः ॥ ॥ मुनिगणनृपवर्यसङ्कुलेऽन्तः सदसि युधिष्ठिरराजसूय एषाम् । अर्हणमुपपेद ईक्षणीयो
    मम दृशिगोचर एष आविरात्मा ॥ ॥ तमिममहमजं शरीरभाजां हृदि हृदि धिष्टितमात्मकल्पितानाम् । प्रतिदृशमिव नैकधाऽर्कमेकं
    समधिगतोऽस्मि विधूतभेदमोहः ॥ ॥ इति श्रीमद्भागवते महापुराणे प्रथमस्कन्धे नवमोऽध्याये भीष्मकृत भगवत्
    स्तुतिः ।
