id: gautamakritam1shivastotram
category: stotram
name:
  english: gautamakritam1shivastotram
  devanagari: गौतमकृतं१शिवस्तोत्रम्
content:
  english: gautamakritam 1 shivastotram gautama uvaca | agnirupam pura shailamasadayitumakshamah | pura
    surah stutim cakrurabhyarcya kratusambhavaih || 8|| bhagavannarunadrisha sarvalokahitavaha | agnirupo'pi
    samshantah prakashasya mahitale || 9|| asau yastamro aruna uta babhruh sumangalah | iti tvam sakala
    vedah stuvanti shivavigraham || 10|| namastamrayarunaya shivaya paramatmane | vedavedya svarupaya
    somaya sukharupine || 11|| tvadrupamakhilam deva jagadetaccaracaram | nidhanamiva te rupam devanamidamikshyate
    || 12|| varshatam ca payodanam nirjharanam ca bhuyasam | salilopayasamharo yuktaste yugasankshaye
    || 13|| agnerapah samudbhutastvatto hi paramatmanah | vishvasrishtim vitanvati vicitraguna vaibhavat
    || 14|| shito bhava mahadeva shonacala kripanidhe | sarveshamapi jivanamabhigamyo bhava prabho ||
    15|| iti stutah suraih sarveranatairbhaktavatsalah | sadyah shitalatam gacchannabhigamyo'bhavatprabhuh
    || 16|| iti shriskandapurane maheshvarakhande
  devanagari: गौतमकृतं १ शिवस्तोत्रम् गौतम उवाच । अग्निरूपं पुरा शैलमासादयितुमक्षमाः । पुरा सुराः स्तुतिं
    चक्रुरभ्यर्च्य क्रतुसम्भवैः ॥ ८॥ भगवन्नरुणाद्रीश सर्वलोकहितावह । अग्निरूपोऽपि संशान्तः प्रकाशस्य महीतले
    ॥ ९॥ असौ यस्ताम्रो अरुण उत बभ्रुः सुमङ्गलः । इति त्वां सकला वेदाः स्तुवन्ति शिवविग्रहम् ॥ १०॥ नमस्ताम्रायारुणाय
    शिवाय परमात्मने । वेदवेद्य स्वरूपाय सोमाय सुखरूपिणे ॥ ११॥ त्वद्रूपमखिलं देव जगदेतच्चराचरम् । निधानमिव
    ते रूपं देवानामिदमीक्ष्यते ॥ १२॥ वर्षतां च पयोदानां निर्झराणां च भूयसाम् । सलिलोपायसंहारो युक्तस्ते
    युगसङ्क्षये ॥ १३॥ अग्नेरापः समुद्भूतास्त्वत्तो हि परमात्मनः । विश्वसृष्टिं वितन्वति विचित्रगुण वैभवात्
    ॥ १४॥ शीतो भव महादेव शोणाचल कृपानिधे । सर्वेषामपि जीवानामभिगम्यो भव प्रभो ॥ १५॥ इति स्तुतः सुरैः सर्वेरानतैर्भक्तवत्सलः
    । सद्यः शीतलतां गच्छन्नभिगम्योऽभवत्प्रभुः ॥ १६॥ इति श्रीस्कन्दपुराणे माहेश्वरखण्डे
