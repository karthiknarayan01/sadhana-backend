    । त्वं वैँ मे॒ नेदि॑ष्ठग्ं हू॒तः प्रत्य॑श्रौषीः । त्वयै॑ नानाख्या॒तार॒ इति॑ । तस्मा॒न्नु है॑ना॒ग्॒
    होतार॒ इत्याच॑क्षते । तस्मा च्छुश्रू॒षुः पु॒त्राणा॒ग्ं॒ हृद्य॑तमः । नेदि॑ष्ठो॒ हृद्य॑तमः । नेदि॑ष्ठो॒
    ब्रह्म॑णो भवति । य ए॒वं पञ्च॑हो॒तेत्याच॑क्षते प॒रोक्षे॑णा ब्र॒ह्म॒वा॒दिनः॒ किं प्र॒जाप॑तिः॒ पुरु॑षं
    प्र॒जाप॑तिरकामयत॒ स तप॒ ब्रह्मवा॒दिनो॒ यो वा इ॒मं य ए॒वास्य॑ दक्षिण॒तः प॑ञ्चा॒शत् ॥ हरिः॑ ओम् ॥ ॥
    कृष्ण यजुर्वेदीय तैत्तिरीय ब्राह्मणे द्वितीयाष्टके तृतीयः प्रपाठक
