id: sri-medha-dakshina-murthy-stotram
category: stotram
name:
  english: Sri Medha Dakshina Murthy Stotram
content:
  english: omityekaksharam brahma vyaharanti trayashshikhah | tasmaitaratmane medhadakshinamurtaye namah
    || || natva yam munayassarve paramyanti durasadam | nakararupine medhadakshinamurtaye namah || ||
    mohajalavinirmukto brahmavidyati yatpadam | mokararupine medhadakshinamurtaye namah || || bhavamashrityayam
    vidvan nabhavohyabhavatparah | bhakararupine medhadakshinamurtaye namah || || gaganakaravadbhantamanubhatyakhilam
    jagat | gakararupine medhadakshinamurtaye namah || || vatamulanivaso yo lokanam prabhuravyayah | vakararupine
    medhadakshinamurtaye namah || || tejobhiryasyasuryo'sau kalaklriptikaro bhavet | tekararupine medhadakshinamurtaye
    namah || || dakshatripurasamhare yah kalavishabhanjane | dakararupine medhadakshinamurtaye namah ||
    || kshipram bhavati vaksiddhiryannamasmaranannrinam | kshikararupine medhadakshinamurtaye namah ||
    || nakaravacyoyassuptam sandipayati me manah | nakararupine medhadakshinamurtaye namah || || murtayo
    hyashtadhayasya jagajjanmadikaranam | mukararupine medhadakshinamurtaye namah || || tattvam brahmasi
    paramamiti yadgurubodhitah | sarephatatmane medhadakshinamurtaye namah || || yeyam viditva brahmadya
    rishayo yanti nirvritim | yekararupine medhadakshinamurtaye namah || || mahatam devamityahurnigamagamayoshshivah
    | makararupine medhadakshinamurtaye namah || || sarvasyajagato hyantarbahiryo vyapyasamsthitah | hyakararupine
    medhadakshinamurtaye namah || || tvameva jagatassakshi srishtisthityantakaranam | mekararupine medhadakshinamurtaye
    namah || || dhameti dhatrisrishteryatkaranam karyamucyate | dhankararupine medhadakshinamurtaye namah
    || || prakriteryatparam dhyatva tadatmyam yati vai munih | prakararupine medhadakshinamurtaye namah
    || || jnaninoyamupasyanti tattvatitam cidatmakam | jnakararupine medhadakshinamurtaye namah || ||
    prajna sanjayate yasya dhyananamarcanadibhih | prakararupine medhadakshinamurtaye namah || || yasya
    smaranamatrena naromuktassabandhanat | yakararupine medhadakshinamurtaye namah || || chaveryannendriyanyapurvishayeshviha
    jadyatam | chakararupine medhadakshinamurtaye namah || || svantevidam jadanam yo duretishthati cinmayah
    | svakararupine medhadakshinamurtaye namah || || haraprayaphanindraya sarvavidyapradayine | hakararupine
    medhadakshinamurtaye namah || || iti shri medhadakshinamurti mantravarnapada stutih ||
  devanagari: ओमित्येकाक्षरं ब्रह्म व्याहरन्ति त्रयश्शिखाः । तस्मैतारात्मने मेधादक्षिणामूर्तये नमः ॥ ॥
    नत्वा यं मुनयस्सर्वे परंयान्ति दुरासदम् । नकाररूपिणे मेधादक्षिणामूर्तये नमः ॥ ॥ मोहजालविनिर्मुक्तो
    ब्रह्मविद्याति यत्पदम् । मोकाररूपिणे मेधादक्षिणामूर्तये नमः ॥ ॥ भवमाश्रित्ययं विद्वान् नभवोह्यभवत्परः
    । भकाररूपिणे मेधादक्षिणामूर्तये नमः ॥ ॥ गगनाकारवद्भान्तमनुभात्यखिलं जगत् । गकाररूपिणे मेधादक्षिणामूर्तये
    नमः ॥ ॥ वटमूलनिवासो यो लोकानां प्रभुरव्ययः । वकाररूपिणे मेधादक्षिणामूर्तये नमः ॥ ॥ तेजोभिर्यस्यसूर्योऽसौ
    कालक्लृप्तिकरो भवेत् । तेकाररूपिणे मेधादक्षिणामूर्तये नमः ॥ ॥ दक्षत्रिपुरसंहारे यः कालविषभञ्जने ।
    दकाररूपिणे मेधादक्षिणामूर्तये नमः ॥ ॥ क्षिप्रं भवति वाक्सिद्धिर्यन्नामस्मरणान्नृणाम् । क्षिकाररूपिणे
    मेधादक्षिणामूर्तये नमः ॥ ॥ णाकारवाच्योयस्सुप्तं सन्दीपयति मे मनः । णाकाररूपिणे मेधादक्षिणामूर्तये
    नमः ॥ ॥ मूर्तयो ह्यष्टधायस्य जगज्जन्मादिकारणम् । मूकाररूपिणे मेधादक्षिणामूर्तये नमः ॥ ॥ तत्त्वं ब्रह्मासि
    परममिति यद्गुरुबोधितः । सरेफतात्मने मेधादक्षिणामूर्तये नमः ॥ ॥ येयं विदित्वा ब्रह्माद्या ऋषयो यान्ति
    निर्वृतिम् । येकाररूपिणे मेधादक्षिणामूर्तये नमः ॥ ॥ महतां देवमित्याहुर्निगमागमयोश्शिवः । मकाररूपिणे
    मेधादक्षिणामूर्तये नमः ॥ ॥ सर्वस्यजगतो ह्यन्तर्बहिर्यो व्याप्यसंस्थितः । ह्यकाररूपिणे मेधादक्षिणामूर्तये
    नमः ॥ ॥ त्वमेव जगतस्साक्षी सृष्टिस्थित्यन्तकारणम् । मेकाररूपिणे मेधादक्षिणामूर्तये नमः ॥ ॥ धामेति
    धातृसृष्टेर्यत्कारणं कार्यमुच्यते । धाङ्काररूपिणे मेधादक्षिणामूर्तये नमः ॥ ॥ प्रकृतेर्यत्परं ध्यात्वा
    तादात्म्यं याति वै मुनिः । प्रकाररूपिणे मेधादक्षिणामूर्तये नमः ॥ ॥ ज्ञानिनोयमुपास्यन्ति तत्त्वातीतं
    चिदात्मकम् । ज्ञाकाररूपिणे मेधादक्षिणामूर्तये नमः ॥ ॥ प्रज्ञा सञ्जायते यस्य ध्याननामार्चनादिभिः ।
    प्रकाररूपिणे मेधादक्षिणामूर्तये नमः ॥ ॥ यस्य स्मरणमात्रेण नरोमुक्तस्सबन्धनात् । यकाररूपिणे मेधादक्षिणामूर्तये
    नमः ॥ ॥ छवेर्यन्नेन्द्रियाण्यापुर्विषयेष्विह जाड्यताम् । छकाररूपिणे मेधादक्षिणामूर्तये नमः ॥ ॥ स्वान्तेविदां
    जडानां यो दूरेतिष्ठति चिन्मयः । स्वाकाररूपिणे मेधादक्षिणामूर्तये नमः ॥ ॥ हारप्रायफणीन्द्राय सर्वविद्याप्रदायिने
    । हाकाररूपिणे मेधादक्षिणामूर्तये नमः ॥ ॥ इति श्री मेधादक्षिणामूर्ति मन्त्रवर्णपद स्तुतिः ॥
