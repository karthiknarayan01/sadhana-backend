  devanagari: रामकृष्णस्तोत्रम् ६
content:
  english: shau kripavarinidherjalasya snato vishuddho vimalantaratma | pibami rupamritameva samyak bhaktyanjanabhrinnayanastu
    deva || 8|| ma
  devanagari: शौ कृपावारिनिधेर्जलस्य स्नातो विशुद्धो विमलान्तरात्मा । पिबामि रूपामृतमेव सम्यक् भक्त्यञ्जनाभृन्नयनस्तु
    देव ॥ ८॥ म
