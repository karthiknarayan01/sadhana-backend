id: ucchishtaganeshakavacam
category: kavacha
name:
  english: ucchishtaganeshakavacam
  devanagari: उच्छिष्टगणेशकवचम्
content:
  english: akashe ca phalam praptam nanyatha vacanam mama | esha rajavati vidya vina punyam na labhyate
    || 12|| atha vakshyami deveshi kavacam mantrapurvakam | yena vijnatamatrena rajabhogaphalapradam ||
    13|| rishirme ganakah patu shirasi ca nirantaram | trahi mam devi gayatrichando rishih sada mukhe
    || 14|| hridaye patu mam nityamucchishtaganadevata | guhye rakshatu tadbijam svaha shaktishca padayoh
    || 15|| kamakilakasarvange viniyogashca sarvada | parshvardvaye sada patu svashaktim gananayakah ||
    16|| shikhayam patu tadbijam bhrumadhye tarabijakam | hastivaktrashca shirasi lambodaro lalatake ||
    17|| ucchishto netrayoh patu karnau patu mahatmane | pashankushamahabijam nasikayam ca rakshatu ||
    18|| bhutishvarah parah patu asyam jihvam svayam vapuh | tadbijam patu mam nityam grivayam kanthadeshake
    || 19|| gam bijam ca tatha rakshettatha tvagre ca prishthake | sarvakamashca hritpatu patu mam ca
    karadvaye || 20|| ucchishtaya ca hridaye vahnibijam tathodare | mayabijam tatha katyam dvavuru siddhidayakah
    || 21|| janghayam gananathashca padau patu vinayakah | shirasah padaparyantamucchishtagananayakah
    || 22|| apadamastakantam ca umaputrashca patu mam | disho'shtau ca tathakashe patale vidishashtake
    || 23|| aharnisham ca mam patu madacancalalocanah | jale'nale ca sangrame dushtakaragrihe vane ||
    24|| rajadvare ghorapathe patu mam gananayakah | idam tu kavacam guhyam mama vaktradvinirgatam ||
    25|| trailaukye satatam patu dvibhujashca caturbhujah | bahyamabhyantaram patu siddhibuddhirvinayakah
    || 26|| sarvasiddhipradam devi kavacamriddhisiddhidam | ekante prajapenmantram kavacam yuktisamyutam
    || 27|| idam rahasyam kavacamucchishtagananayakam | sarvavarmasu deveshi idam kavacanayakam || 28||
    etatkavacamahatmyam varnitum naiva shakyate | dharmarthakamamoksham ca nanaphalapradam nrinam || 29||
    shivaputrah sada patu patu mam surarcitah | gajananah sada patu ganarajashca patu mam || 30|| sada
    shaktiratah patu patu mam kamavihvalah | sarvabharanabhushadhayah patu mam sindurarcitah || 31|| pancamodakarah
    patu patu mam parvatisutah | pashankushadharah patu patu mam ca dhaneshvarah || 32|| gadadharah sada
    patu patu mam kamamohitah | nagnanariratah patu patu mam ca ganeshvarah || 33|| akshayam varadah patu
    shaktiyuktih sada'vatu | bhalacandrah sada patu nanaratnavibhushitah || 34|| ucchishtagananathashca
    madaghurnitalocanah | nariyonirasasvadah patu mam gajakarnakah || 35|| prasannavadanah patu patu mam
    bhagavallabhah | jatadharah sada patu patu mam ca kiritikah
  devanagari: आकाशे च फलं प्राप्तं नान्यथा वचनं मम । एषा राजवती विद्या विना पुण्यं न लभ्यते ॥ १२॥ अथ वक्ष्यामि
    देवेशि कवचं मन्त्रपूर्वकम् । येन विज्ञातमात्रेण राजभोगफलप्रदम् ॥ १३॥ ऋषिर्मे गणकः पातु शिरसि च निरन्तरम्
    । त्राहि मां देवि गायत्रीछन्दो ऋषिः सदा मुखे ॥ १४॥ हृदये पातु मां नित्यमुच्छिष्टगणदेवता । गुह्ये रक्षतु
    तद्बीजं स्वाहा शक्तिश्च पादयोः ॥ १५॥ कामकीलकसर्वाङ्गे विनियोगश्च सर्वदा । पार्श्वर्द्वये सदा पातु
    स्वशक्तिं गणनायकः ॥ १६॥ शिखायां पातु तद्बीजं भ्रूमध्ये तारबीजकम् । हस्तिवक्त्रश्च शिरसि लम्बोदरो ललाटके
    ॥ १७॥ उच्छिष्टो नेत्रयोः पातु कर्णौ पातु महात्मने । पाशाङ्कुशमहाबीजं नासिकायां च रक्षतु ॥ १८॥ भूतीश्वरः
    परः पातु आस्यं जिह्वां स्वयं वपुः । तद्बीजं पातु मां नित्यं ग्रीवायां कण्ठदेशके ॥ १९॥ गं बीजं च तथा
    रक्षेत्तथा त्वग्रे च पृष्ठके । सर्वकामश्च हृत्पातु पातु मां च करद्वये ॥ २०॥ उच्छिष्टाय च हृदये वह्निबीजं
    तथोदरे । मायाबीजं तथा कट्यां द्वावूरू सिद्धिदायकः ॥ २१॥ जङ्घायां गणनाथश्च पादौ पातु विनायकः । शिरसः
    पादपर्यन्तमुच्छिष्टगणनायकः ॥ २२॥ आपादमस्तकान्तं च उमापुत्रश्च पातु माम् । दिशोऽष्टौ च तथाकाशे पाताले
    विदिशाष्टके ॥ २३॥ अहर्निशं च मां पातु मदचञ्चललोचनः । जलेऽनले च सङ्ग्रामे दुष्टकारागृहे वने ॥ २४॥ राजद्वारे
    घोरपथे पातु मां गणनायकः । इदं तु कवचं गुह्यं मम वक्त्राद्विनिर्गतम् ॥ २५॥ त्रैलौक्ये सततं पातु द्विभुजश्च
    चतुर्भुजः । बाह्यमभ्यन्तरं पातु सिद्धिबुद्धिर्विनायकः ॥ २६॥ सर्वसिद्धिप्रदं देवि कवचमृद्धिसिद्धिदम्
    । एकान्ते प्रजपेन्मन्त्रं कवचं युक्तिसंयुतम् ॥ २७॥ इदं रहस्यं कवचमुच्छिष्टगणनायकम् । सर्ववर्मसु देवेशि
    इदं कवचनायकम् ॥ २८॥ एतत्कवचमाहात्म्यं वर्णितुं नैव शक्यते । धर्मार्थकाममोक्षं च नानाफलप्रदं नृणाम्
    ॥ २९॥ शिवपुत्रः सदा पातु पातु मां सुरार्चितः । गजाननः सदा पातु गणराजश्च पातु माम् ॥ ३०॥ सदा शक्तिरतः
    पातु पातु मां कामविह्वलः । सर्वाभरणभूषाढयः पातु मां सिन्दूरार्चितः ॥ ३१॥ पञ्चमोदकरः पातु पातु मां
    पार्वतीसुतः । पाशाङ्कुशधरः पातु पातु मां च धनेश्वरः ॥ ३२॥ गदाधरः सदा पातु पातु मां काममोहितः । नग्ननारीरतः
    पातु पातु मां च गणेश्वरः ॥ ३३॥ अक्षयं वरदः पातु शक्तियुक्तिः सदाऽवतु । भालचन्द्रः सदा पातु नानारत्नविभूषितः
    ॥ ३४॥ उच्छिष्टगणनाथश्च मदाघूर्णितलोचनः । नारीयोनिरसास्वादः पातु मां गजकर्णकः ॥ ३५॥ प्रसन्नवदनः पातु
    पातु मां भगवल्लभः । जटाधरः सदा पातु पातु मां च किरीटिकः
