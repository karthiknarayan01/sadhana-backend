id: namavali-46
category: stotram
name:
  english: namavali
  devanagari: नामावली
content:
  english: om mahotsahaya namah | om duhkhadaurbhagyanashakaya namah | om mishtapriyaya namah | om bhalacandraya
    namah | om nityasaubhagyavardhanaya namah | om danapurardragandaya namah | om amshakaya namah | om
    vibudhapriyaya namah | om raktambaradharaya namah | om shreshthaya namah |
  devanagari: ॐ महोत्साहाय नमः । ॐ दुःखदौर्भाग्यनाशकाय नमः । ॐ मिष्टप्रियाय नमः । ॐ भालचन्द्राय नमः ।
    ॐ नित्यसौभाग्यवर्धनाय नमः । ॐ दानपूरार्द्रगण्डाय नमः । ॐ अंशकाय नमः । ॐ विबुधप्रियाय नमः । ॐ रक्ताम्बरधराय
    नमः । ॐ श्रेष्ठाय नमः ।
meaning: {}
