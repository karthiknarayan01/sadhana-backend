id: atharvashira
category: upanishad
name:
  english: atharvashira
  devanagari: अथर्वशिर
content:
  english: rvyashema devahitam yadayuh || svasti na indro vriddhashravah svasti nah pusha vishvavedah
    | svasti nastarkshyo arishtanemih svasti no brihaspatirdadhatu || om shantih shantih shantih || om
    deva ha vai svargam lokamayamste rudramapricchanko bhavaniti | so'bravidahamekah prathamamasam vartami
    ca bhavishyami ca nanyah kashcinmatto vyatirikta iti | so'ntaradantaram pravishat dishashcantaram
    pravishat so'ham nityanityo'ham vyaktavyakto brahmabrahmaham prancah pratyanco'ham dakshinanca udancoham
    adhashcordhvam caham dishashca pratidishashcaham pumanapuman striyashcaham gayatryaham savitryaham
    trishtubjagatyanushtup caham chando'ham garhapatyo dakshinagnirahavaniyo'ham satyo'ham gauraham gauryahamrigaham
    yajuraham samahamatharvangiraso'ham jyeshtho'ham shreshtho'ham varishtho'hamapo'ham tejo'ham guhyohamaranyo'hamaksharamaham
    ksharamaham pushkaramaham pavitramahamugram ca madhyam ca bahishca purastajjyotirityahameva sarvebhyo
    mameva sa sarvah samam yo mam veda sa sarvandevanveda sarvamshca vedansanganapi brahma brahmanaishca
    gam gobhirbrahmananbrahmanena havirhavisha ayurayusha satyena satyam dharmena dharmam tarpayami svena
    tejasa | tato ha vai te deva rudramapricchan te deva rudramapashyan | te deva rudramadhyayan tato
    deva urdhvabahavo rudram stuvanti || 1|| om yo vai rudrah sa bhagavanyashca brahma tasmai vai namonamah
    || 1|| yo vai rudrah sa bhagavan yashca vishnustasmai vai namonamah || 2|| yo vai rudrah sa bhagavanyashca
    skandastasmai vai namonamah || 3|| yo vai rudrah sa bhagavanyashcendrastasmai vai namonamah || 4||
    yo vai rudrah sa bhagavanyashcagnistasmai vai namonamah || 5|| yo vai rudrah sa bhagavanyashca vayustasmai
    vai namonamah || 6|| yo vai rudrah sa bhagavanyashca suryastasmai vai namonamah || 7|| yo vai rudrah
    sa bhagavanyashca somastasmai vai namonamah || 8|| yo vai rudrah sa bhagavanye cashtau grahastasmai
    vai namonamah || 9|| yo vai rudrah sa bhagavanye cashtau pratigrahastasmai vai namonamah || 10|| yo
    vai rudrah sa bhagavanyacca bhustasmai vai namonamah || 11|| yo vai rudrah sa bhagavanyacca bhuvastasmai
    vai namonamah || 12|| yo vai rudrah sa bhagavanyacca svastasmai vai namonamah || 13|| yo vai rudrah
    sa bhagavanyacca mahastasmai vai namonamah || 14|| yo vai rudrah sa bhagavanya ca prithivi tasmai
    vai namonamah || 15|| yo vai rudrah sa bhagavanyaccantariksham tasmai vai namonamah || 16|| yo vai
    rudrah sa bhagavanya ca dyaustasmai vai namonamah || 17|| yo vai rudrah sa bhagavanyashcapastasmai
    vai namonamah || 18|| yo vai rudrah sa bhagavanyacca tejastasmai vai namonamah || 19|| yo vai rudrah
    sa bhagavanyashca kalastasmai vai namonamah || 20|| yo vai rudrah sa bhagavanyashca yamastasmai vai
    namonamah || 21|| yo vai rudrah sa bhagavanyashca mrityustasmai vai namonamah || 22|| yo vai rudrah
    sa bhagavanyaccamritam tasmai vai namonamah || 23|| yo vai rudrah sa bhagavanyaccakasham tasmai vai
    namonamah || 24|| yo vai rudrah sa bhagavanyacca vishvam tasmai vai namonamah || 25|| yo vai rudrah
    sa bhagavanyacca sthulam tasmai vai namonamah || 26|| yo vai rudrah sa bhagavanyacca sukshmam tasmai
    vai namonamah || 27|| yo vai rudrah sa bhagavanyacca shuklam tasmai namonamah || 28|| yo vai rudrah
    sa bhagavanyacca krishnam tasmai vai namonamah || 29|| yo vai rudrah sa bhagavanyacca kritsnam tasmai
    vai namonamah || 30|| yo vai rudrah sa bhagavanyacca satyam tasmai vai namonamah || 31|| yo vai rudrah
    sa bhagavanyacca sarvam tasmai vai namonamah || 32|| || 2|| bhuste adirmadhyam bhuvah svaste shirsham
    vishvarupo'si brahmaikastvam dvidha tridha vriddhistam shantistvam pushtistvam hutamahutam dattamadattam
    sarvamasarvam vishvamavishvam kritamakritam paramaparam parayanam ca tvam | apama somamamrita abhumaganma
    jyotiravidama devan | kim nunamasmankrinavadaratih kimu dhurtiramritam martyasya | somasuryapurastat
    sukshmah purushah | sarvam jagaddhitam va etadaksharam prajapatyam sukshmam saumyam purusham grahyamagrahyena
    bhavam bhavena saumyam saumyena sukshmam sukshmena vayavyam vayavyena grasati svena tejasa tasmadupasamhartre
    mahagrasaya vai namo namah | hridistha devatah sarva hridi pranah pratishthitah | hridi tvamasi yo
    nityam tisro matrah parastu sah | tasyottaratah shiro dakshinatah padau ya uttaratah sa onkarah ya
    onkarah sa pranavah yah pranavah sa sarvavyapi yah sarvavyapi so'nantah yo'nantastattaram yattaram
    tatsukshmam tacchuklam yacchuklam tadvaidyutam yadvaidyutam tatparam brahma yatparam brahma sa ekah
    ya ekah sa rudrah ya rudrah yo rudrah sa ishanah ya ishanah sa bhagavan maheshvarah || 3|| atha kasmaducyata
    onkaro yasmaduccaryamana eva prananurdhvamutkramayati tasmaducyate onkarah | atha kasmaducyate pranavah
    yasmaduccaryamana eva rigyajuhsamatharvangirasam brahma brahmanebhyah pranamayati namayati ca tasmaducyate
    pranavah | atha kasmaducyate sarvavyapi yasmaduccaryamana eva sarvamlokanvyapnoti sneho yatha palalapindamiva
    shantarupamotaprotamanuprapto vyatishaktashca tasmaducyate sarvavyapi | atha kasmaducyate'nanto yasmaduccaryamana
    eva tiryagurdhvamadhastaccasyanto nopalabhyate tasmaducyate'nantah | atha kasmaducyate taram yasmaduccaramana
    eva garbhajanmavyadhijaramaranasamsaramahabhayattarayati trayate ca tasmaducyate taram | atha kasmaducyate
    shuklam yasmaduccaryamana eva klandate klamayati ca tasmaducyate shuklam | atha kasmaducyate sukshmam
    yasmaduccaryamana eva sukshmo bhutva shariranyadhitishthati sarvani canganyamimrishati tasmaducyate
    sukshmam | atha kasmaducyate vaidyutam yasmaduccaryamana eva vyakte mahati tamasi dyotayati tasmaducyate
    vaidyutam | atha kasmaducyate param brahma yasmatparamaparam parayanam ca brihadbrihatya brimhayati
    tasmaducyate param brahma | atha kasmaducyate ekah yah sarvanpranansambhakshya sambhakshanenajah samsrijati
    visrijati tirthameke vrajanti tirthameke dakshinah pratyanca udancah pranco'bhivrajantyeke tesham
    sarveshamiha sadgatih | sakam sa eko bhutashcarati prajanam tasmaducyata ekah | atha kasmaducyate
    rudrah yasmadrishibhirnanyairbhaktairdrutamasya rupamupalabhyate tasmaducyate rudrah | atha kasmaducyate
    ishanah yah sarvandevanishate ishanibhirjananibhishca paramashaktibhih | amitva shura no numo dugdha
    iva dhenavah | ishanamasya jagatah svardrishamishanamindra tasthisha iti tasmaducyate ishanah | atha
    kasmaducyate bhagavanmaheshvarah yasmadbhakta jnanena bhajantyanugrihnati ca vacam samsrijati visrijati
    ca sarvanbhavanparityajyatmajnanena yogeshvairyena mahati mahiyate tasmaducyate bhagavanmaheshvarah
    | tadetadrudracaritam || 4|| eko ha devah pradisho nu sarvah purvo ha jatah sa u garbhe antah | sa
    eva jatah janishyamanah pratyanjanastishthati sarvatomukhah | eko rudro na dvitiyaya tasmai ya imamllokanishata
    ishanibhih | pratyanjanastishthati samcukocantakale samsrijya vishva bhuvanani gopta | yo yonim yonimadhitishthatityeko
    yenedam sarvam vicarati sarvam | tamishanam purusham devamidyam nicayyemam shantimatyantameti | kshamam
    hitva hetujalasya mulam buddhya sancitam sthapayitva tu rudre | rudramekatvamahuh shashvatam vai puranamishamurjena
    pashavo'nunamayantam mrityupashan | tadetenatmannetenardhacaturthena matrena shantim samsrijanti pashupashavimokshanam
    | ya sa prathama matra brahmadevatya rakta varnena yastam dhyayate nityam sa gacchetbrahmapadam |
    ya sa dvitiya matra vishnudevatya krishna varnena yastam dhyayate nityam sa gacchedvaishnavam padam
    | ya sa tritiya matra ishanadevatya kapila varnena yastam dhyayate nityam sa gacchedaishanam padam
    | ya sardhacaturthi matra sarvadevatya'vyaktibhuta kham vicarati shuddha sphatikasannibha varnena
    yastam dhyayate nityam sa gacchetpadamanamayam | tadetadupasita munayo vagvadanti na tasya grahanamayam
    pantha vihita uttarena yena deva yanti yena pitaro yena rishayah paramaparam parayanam ceti | valagramatram
    hridayasya madhye vishvam devam jatarupam varenyam | tamatmastham yenu pashyanti dhirastesham shantirbhavati
    netaresham | yasminkrodham yam ca trishnam kshamam cakshamam hitva hetujalasya mulam | buddhya samcitam
    sthapayitva tu rudre rudramekatvamahuh | rudro hi shashvatena vai puraneneshamurjena tapasa niyanta
    | agniriti bhasma vayuriti bhasma jalamiti bhasma sthalamiti bhasma vyometi bhasma sarvamha va idam
    bhasma mana etani cakshumshi yasmadvratamidam pashupatam yadbhasma nangani samsprishettasmadbrahma
    tadetatpashupatam pashupasha vimokshanaya || 5|| yo'gnau rudro yo'psvantarya oshadhirvirudha avivesha
    | ya ima vishva bhuvanani caklripe tasmai rudraya namo'stvagnaye | yo rudro'gnau yo rudro'psvantaryo
    oshadhirvirudha avivesha | yo rudra ima vishva bhuvanani caklripe tasmai rudraya namonamah | yo rudro'psu
    yo rudra oshadhishu yo rudro vanaspatishu | yena rudrena jagadurdhvamdharitam prithivi dvidha tridha
    dharta dharita naga ye'ntarikshe tasmai rudraya vai namonamah | murdhanamasya samsevyapyatharva hridayam
    ca yat | mastishkadurdhvam prerayatyavamano'dhishirshatah | tadva atharvanah shiro devakoshah samujjhitah
    | tatprano'bhirakshati shiro'ntamatho manah | na ca divo devajanena gupta na cantarikshani na ca bhuma
    imah | yasminnidam sarvamotaprotam tasmadanyanna param kincanasti | na tasmatpurvam na param tadasti
    na bhutam nota bhavyam yadasit | sahasrapadekamurdhna vyaptam sa evedamavarivarti bhutam | aksharatsamjayate
    kalah kaladvyapaka ucyate | vyapako hi bhagavanrudro bhogayamano yada shete rudrastada samharyate
    prajah | ucchvasite tamo bhavati tamasa apo'psvangulya mathite mathitam shishire shishiram mathyamanam
    phenam bhavati phenadandam bhavatyandadbrahma bhavati brahmano vayuh vayoronkarah omkaratsavitri savitrya
    gayatri gayatrya loka bhavanti | arcayanti tapah satyam madhu ksharanti yadbhuvam | etaddhi paramam
    tapah | apo'jyoti raso'mritam brahma bhurbhuvah svaro nama iti || 6|| ya idamatharvashiro brahmano'dhite
    ashrotriyah shrotriyo bhavati anupanita upanito bhavati so'gniputo bhavati sa vayuputo bhavati sa
    suryaputo bhavati sa sarverdevairjnato bhavati sa sarvairvedairanudhyato bhavati sa sarveshu tirtheshu
    snato bhavati tena sarvaih kratubhirishtam bhavati gayatryah shashtisahasrani japtani bhavanti itihasapurananam
    rudranam shatasahasrani japtani bhavanti | pranavanamayutam japtam bhavati | sa cakshushah panktim
    punati | a saptamatpurushayuganpunatityaha bhagavanatharvashirah sakrijjaptvaiva shucih sa putah karmanyo
    bhavati | dvitiyam japtva ganadhipatyamavapnoti | tritiyam japtvaivamevanupravishatyom satyamom satyamom
    satyam || 7|| om bhadram karnebhiriti shantih || || ityatharvashiropanishatsamapta ||
  devanagari: र्व्यशेम देवहितं यदायुः ॥ स्वस्ति न इन्द्रो वॄद्धश्रवाः स्वस्ति नः पूषा विश्ववेदाः । स्वस्ति
    नस्तार्क्ष्यो अरिष्टनेमिः स्वस्ति नो बृहस्पतिर्दधातु ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ ॐ देवा ह वै स्वर्गं
    लोकमायंस्ते रुद्रमपृच्छन्को भवानिति । सोऽब्रवीदहमेकः प्रथममासं वर्तामि च भविश्यामि च नान्यः कश्चिन्मत्तो
    व्यतिरिक्त इति । सोऽन्तरादन्तरं प्राविशत् दिशश्चान्तरं प्राविशत् सोऽहं नित्यानित्योऽहं व्यक्ताव्यक्तो
    ब्रह्माब्रह्माहं प्राञ्चः प्रत्यञ्चोऽहं दक्षिणाञ्च उदञ्चोहं अधश्चोर्ध्वं चाहं दिशश्च प्रतिदिशश्चाहं
    पुमानपुमान् स्त्रियश्चाहं गायत्र्यहं सावित्र्यहं त्रिष्टुब्जगत्यनुष्टुप् चाहं छन्दोऽहं गार्हपत्यो
    दक्षिणाग्निराहवनीयोऽहं सत्योऽहं गौरहं गौर्यहमृगहं यजुरहं सामाहमथर्वाङ्गिरसोऽहं ज्येष्ठोऽहं श्रेष्ठोऽहं
    वरिष्ठोऽहमापोऽहं तेजोऽहं गुह्योहंअरण्योऽहमक्षरमहं क्षरमहं पुष्करमहं पवित्रमहमुग्रं च मध्यं च बहिश्च
    पुरस्ताज्ज्योतिरित्यहमेव सर्वेभ्यो मामेव स सर्वः समां यो मां वेद स सर्वान्देवान्वेद सर्वांश्च वेदान्साङ्गानपि
    ब्रह्म ब्राह्मणैश्च गां गोभिर्ब्राह्माणान्ब्राह्मणेन हविर्हविषा आयुरायुषा सत्येन सत्यं धर्मेण धर्मं
    तर्पयामि स्वेन तेजसा । ततो ह वै ते देवा रुद्रमपृच्छन् ते देवा रुद्रमपश्यन् । ते देवा रुद्रमध्यायन्
    ततो देवा ऊर्ध्वबाहवो रुद्रं स्तुवन्ति ॥ १॥ ॐ यो वै रुद्रः स भगवान्यश्च ब्रह्मा तस्मै वै नमोनमः ॥ १॥
    यो वै रुद्रः स भगवान् यश्च विष्णुस्तस्मै वै नमोनमः ॥ २॥ यो वै रुद्रः स भगवान्यश्च स्कन्दस्तस्मै वै
    नमोनमः ॥ ३॥ यो वै रुद्रः स भगवान्यश्चेन्द्रस्तस्मै वै नमोनमः ॥ ४॥ यो वै रुद्रः स भगवान्यश्चाग्निस्तस्मै
    वै नमोनमः ॥ ५॥ यो वै रुद्रः स भगवान्यश्च वायुस्तस्मै वै नमोनमः ॥ ६॥ यो वै रुद्रः स भगवान्यश्च सूर्यस्तस्मै
    वै नमोनमः ॥ ७॥ यो वै रुद्रः स भगवान्यश्च सोमस्तस्मै वै नमोनमः ॥ ८॥ यो वै रुद्रः स भगवान्ये चाष्टौ
    ग्रहास्तस्मै वै नमोनमः ॥ ९॥ यो वै रुद्रः स भगवान्ये चाष्टौ प्रतिग्रहास्तस्मै वै नमोनमः ॥ १०॥ यो वै
    रुद्रः स भगवान्यच्च भूस्तस्मै वै नमोनमः ॥ ११॥ यो वै रुद्रः स भगवान्यच्च भुवस्तस्मै वै नमोनमः ॥ १२॥
    यो वै रुद्रः स भगवान्यच्च स्वस्तस्मै वै नमोनमः ॥ १३॥ यो वै रुद्रः स भगवान्यच्च महस्तस्मै वै नमोनमः
    ॥ १४॥ यो वै रुद्रः स भगवान्या च पृथिवी तस्मै वै नमोनमः ॥ १५॥ यो वै रुद्रः स भगवान्यच्चान्तरिक्षं तस्मै
    वै नमोनमः ॥ १६॥ यो वै रुद्रः स भगवान्या च द्यौस्तस्मै वै नमोनमः ॥ १७॥ यो वै रुद्रः स भगवान्याश्चापस्तस्मै
    वै नमोनमः ॥ १८॥ यो वै रुद्रः स भगवान्यच्च तेजस्तस्मै वै नमोनमः ॥ १९॥ यो वै रुद्रः स भगवान्यश्च कालस्तस्मै
    वै नमोनमः ॥ २०॥ यो वै रुद्रः स भगवान्यश्च यमस्तस्मै वै नमोनमः ॥ २१॥ यो वै रुद्रः स भगवान्यश्च मृत्युस्तस्मै
    वै नमोनमः ॥ २२॥ यो वै रुद्रः स भगवान्यच्चामृतं तस्मै वै नमोनमः ॥ २३॥ यो वै रुद्रः स भगवान्यच्चाकाशं
    तस्मै वै नमोनमः ॥ २४॥ यो वै रुद्रः स भगवान्यच्च विश्वं तस्मै वै नमोनमः ॥ २५॥ यो वै रुद्रः स भगवान्याच्च
    स्थूलं तस्मै वै नमोनमः ॥ २६॥ यो वै रुद्रः स भगवान्यच्च सूक्ष्मं तस्मै वै नमोनमः ॥ २७॥ यो वै रुद्रः
    स भगवान्यच्च शुक्लं तस्मै नमोनमः ॥ २८॥ यो वै रुद्रः स भगवान्यच्च कृष्णं तस्मै वै नमोनमः ॥ २९॥ यो वै
    रुद्रः स भगवान्यच्च कृत्स्नं तस्मै वै नमोनमः ॥ ३०॥ यो वै रुद्रः स भगवान्यच्च सत्यं तस्मै वै नमोनमः
    ॥ ३१॥ यो वै रुद्रः स भगवान्यच्च सर्वं तस्मै वै नमोनमः ॥ ३२॥ ॥ २॥ भूस्ते आदिर्मध्यं भुवः स्वस्ते शीर्षं
    विश्वरूपोऽसि ब्रह्मैकस्त्वं द्विधा त्रिधा वृद्धिस्तं शान्तिस्त्वं पुष्टिस्त्वं हुतमहुतं दत्तमदत्तं
    सर्वमसर्वं विश्वमविश्वं कृतमकृतं परमपरं परायणं च त्वम् । अपाम सोमममृता अभूमागन्म ज्योतिरविदाम देवान्
    । किं नूनमस्मान्कृणवदरातिः किमु धूर्तिरमृतं मार्त्यस्य । सोमसूर्यपुरस्तात् सूक्ष्मः पुरुषः । सर्वं
    जगद्धितं वा एतदक्षरं प्राजापत्यं सूक्ष्मं सौम्यं पुरुषं ग्राह्यमग्राह्येण भावं भावेन सौम्यं सौम्येन
    सूक्ष्मं सूक्ष्मेण वायव्यं वायव्येन ग्रसति स्वेन तेजसा तस्मादुपसंहर्त्रे महाग्रासाय वै नमो नमः । हृदिस्था
    देवताः सर्वा हृदि प्राणाः प्रतिष्ठिताः । हृदि त्वमसि यो नित्यं तिस्रो मात्राः परस्तु सः । तस्योत्तरतः
    शिरो दक्षिणतः पादौ य उत्तरतः स ओङ्कारः य ओङ्कारः स प्रणवः यः प्रणवः स सर्वव्यापी यः सर्वव्यापी सोऽनन्तः
    योऽनन्तस्तत्तारं यत्तारं तत्सूक्ष्मं तच्छुक्लं यच्छुक्लं तद्वैद्युतं यद्वैद्युतं तत्परं ब्रह्म यत्परं
    ब्रह्म स एकः य एकः स रुद्रः य रुद्रः यो रुद्रः स ईशानः य ईशानः स भगवान् महेश्वरः ॥ ३॥ अथ कस्मादुच्यत
    ओङ्कारो यस्मादुच्चार्यमाण एव प्राणानूर्ध्वमुत्क्रामयति तस्मादुच्यते ओङ्कारः । अथ कस्मादुच्यते प्रणवः
    यस्मादुच्चार्यमाण एव ऋग्यजुःसामाथर्वाङ्गिरसं ब्रह्म ब्राह्मणेभ्यः प्रणामयति नामयति च तस्मादुच्यते
    प्रणवः । अथ कस्मादुच्यते सर्वव्यापी यस्मादुच्चार्यमाण एव सर्वांलोकान्व्याप्नोति स्नेहो यथा पललपिण्डमिव
    शान्तरूपमोतप्रोतमनुप्राप्तो व्यतिषक्तश्च तस्मादुच्यते सर्वव्यापी । अथ कस्मादुच्यतेऽनन्तो यस्मादुच्चार्यमाण
    एव तिर्यगूर्ध्वमधस्ताच्चास्यान्तो नोपलभ्यते तस्मादुच्यतेऽनन्तः । अथ कस्मादुच्यते तारं यस्मादुच्चारमाण
    एव गर्भजन्मव्याधिजरामरणसंसारमहाभयात्तारयति त्रायते च तस्मादुच्यते तारम् । अथ कस्मादुच्यते शुक्लं यस्मादुच्चार्यमाण
    एव क्लन्दते क्लामयति च तस्मादुच्यते शुक्लम् । अथ कस्मादुच्यते सूक्ष्मं यस्मादुच्चार्यमाण एव सूक्ष्मो
    भूत्वा शरीराण्यधितिष्ठति सर्वाणि चाङ्गान्यमिमृशति तस्मादुच्यते सूक्ष्मम् । अथ कस्मादुच्यते वैद्युतं
    यस्मादुच्चार्यमाण एव व्यक्ते महति तमसि द्योतयति तस्मादुच्यते वैद्युतम् । अथ कस्मादुच्यते परं ब्रह्म
    यस्मात्परमपरं परायणं च बृहद्बृहत्या बृंहयति तस्मादुच्यते परं ब्रह्म । अथ कस्मादुच्यते एकः यः सर्वान्प्राणान्संभक्ष्य
    संभक्षणेनाजः संसृजति विसृजति तीर्थमेके व्रजन्ति तीर्थमेके दक्षिणाः प्रत्यञ्च उदञ्चः प्राञ्चोऽभिव्रजन्त्येके
    तेषां सर्वेषामिह सद्गतिः । साकं स एको भूतश्चरति प्रजानां तस्मादुच्यत एकः । अथ कस्मादुच्यते रुद्रः
    यस्मादृषिभिर्नान्यैर्भक्तैर्द्रुतमस्य रूपमुपलभ्यते तस्मादुच्यते रुद्रः । अथ कस्मादुच्यते ईशानः यः
    सर्वान्देवानीशते ईशानीभिर्जननीभिश्च परमशक्तिभिः । अमित्वा शूर णो नुमो दुग्धा इव धेनवः । ईशानमस्य जगतः
    स्वर्दृशमीशानमिन्द्र तस्थिष इति तस्मादुच्यते ईशानः । अथ कस्मादुच्यते भगवान्महेश्वरः यस्माद्भक्ता ज्ञानेन
    भजन्त्यनुगृह्णाति च वाचं संसृजति विसृजति च सर्वान्भावान्परित्यज्यात्मज्ञानेन योगेश्वैर्येण महति महीयते
    तस्मादुच्यते भगवान्महेश्वरः । तदेतद्रुद्रचरितम् ॥ ४॥ एको ह देवः प्रदिशो नु सर्वाः पूर्वो ह जातः स
    उ गर्भे अन्तः । स एव जातः जनिष्यमाणः प्रत्यङ्जनास्तिष्ठति सर्वतोमुखः । एको रुद्रो न द्वितीयाय तस्मै
    य इमांल्लोकानीशत ईशनीभिः । प्रत्यङ्जनास्तिष्ठति संचुकोचान्तकाले संसृज्य विश्वा भुवनानि गोप्ता । यो
    योनिं योनिमधितिष्ठतित्येको येनेदं सर्वं विचरति सर्वम् । तमीशानं पुरुषं देवमीड्यं निचाय्येमां शान्तिमत्यन्तमेति
    । क्षमां हित्वा हेतुजालास्य मूलं बुद्ध्या सञ्चितं स्थापयित्वा तु रुद्रे । रुद्रमेकत्वमाहुः शाश्वतं
    वै पुराणमिषमूर्जेण पशवोऽनुनामयन्तं मृत्युपाशान् । तदेतेनात्मन्नेतेनार्धचतुर्थेन मात्रेण शान्तिं संसृजन्ति
    पशुपाशविमोक्षणम् । या सा प्रथमा मात्रा ब्रह्मदेवत्या रक्ता वर्णेन यस्तां ध्यायते नित्यं स गच्छेत्ब्रह्मपदम्
    । या सा द्वितीया मात्रा विष्णुदेवत्या कृष्णा वर्णेन यस्तां ध्यायते नित्यं स गच्छेद्वैष्णवं पदम् ।
    या सा तृतीया मात्रा ईशानदेवत्या कपिला वर्णेन यस्तां ध्यायते नित्यं स गच्छेदैशानं पदम् । या सार्धचतुर्थी
    मात्रा सर्वदेवत्याऽव्यक्तीभूता खं विचरति शुद्धा स्फटिकसन्निभा वर्णेन यस्तां ध्यायते नित्यं स गच्छेत्पदमनामयम्
    । तदेतदुपासीत मुनयो वाग्वदन्ति न तस्य ग्रहणमयं पन्था विहित उत्तरेण येन देवा यान्ति येन पितरो येन ऋषयः
    परमपरं परायणं चेति । वालाग्रमात्रं हृदयस्य मध्ये विश्वं देवं जातरूपं वरेण्यम् । तमात्मस्थं येनु पश्यन्ति
    धीरास्तेषां शान्तिर्भवति नेतरेषाम् । यस्मिन्क्रोधं यां च तृष्णां क्षमां चाक्षमां हित्वा हेतुजालस्य
    मूलम् । बुद्ध्या संचितं स्थापयित्वा तु रुद्रे रुद्रमेकत्वमाहुः । रुद्रो हि शाश्वतेन वै पुराणेनेषमूर्जेण
    तपसा नियन्ता । अग्निरिति भस्म वायुरिति भस्म जलमिति भस्म स्थलमिति भस्म व्योमेति भस्म सर्वंह वा इदं
    भस्म मन एतानि चक्षूंषि यस्माद्व्रतमिदं पाशुपतं यद्भस्म नाङ्गानि संस्पृशेत्तस्माद्ब्रह्म तदेतत्पाशुपतं
    पशुपाश विमोक्षणाय ॥ ५॥ योऽग्नौ रुद्रो योऽप्स्वन्तर्य ओषधीर्वीरुध आविवेश । य इमा विश्वा भुवनानि चक्लृपे
    तस्मै रुद्राय नमोऽस्त्वग्नये । यो रुद्रोऽग्नौ यो रुद्रोऽप्स्वन्तर्यो ओषधीर्वीरुध आविवेश । यो रुद्र
    इमा विश्वा भुवनानि चक्लृपे तस्मै रुद्राय नमोनमः । यो रुद्रोऽप्सु यो रुद्र ओषधीषु यो रुद्रो वनस्पतिषु
    । येन रुद्रेण जगदूर्ध्वंधारितं पृथिवी द्विधा त्रिधा धर्ता धारिता नागा येऽन्तरिक्षे तस्मै रुद्राय वै
    नमोनमः । मूर्धानमस्य संसेव्याप्यथर्वा हृदयं च यत् । मस्तिष्कादूर्ध्वं प्रेरयत्यवमानोऽधिशीर्षतः । तद्वा
    अथर्वणः शिरो देवकोशः समुज्झितः । तत्प्राणोऽभिरक्षति शिरोऽन्तमथो मनः । न च दिवो देवजनेन गुप्ता न चान्तरिक्षाणि
    न च भूम इमाः । यस्मिन्निदं सर्वमोतप्रोतं तस्मादन्यन्न परं किञ्चनास्ति । न तस्मात्पूर्वं न परं तदस्ति
    न भूतं नोत भव्यं यदासीत् । सहस्रपादेकमूर्ध्ना व्याप्तं स एवेदमावरीवर्ति भूतम् । अक्षरात्संजायते कालः
    कालाद्व्यापक उच्यते । व्यापको हि भगवान्रुद्रो भोगायमनो यदा शेते रुद्रस्तदा संहार्यते प्रजाः । उच्छ्वासिते
    तमो भवति तमस आपोऽप्स्वङ्गुल्या मथिते मथितं शिशिरे शिशिरं मथ्यमानं फेनं भवति फेनादण्डं भवत्यण्डाद्ब्रह्मा
    भवति ब्रह्मणो वायुः वायोरोङ्कारः ॐकारात्सावित्री सावित्र्या गायत्री गायत्र्या लोका भवन्ति । अर्चयन्ति
    तपः सत्यं मधु क्षरन्ति यद्भुवम् । एतद्धि परमं तपः । आपोऽज्योती रसोऽमृतं ब्रह्म भूर्भुवः स्वरो नम इति
    ॥ ६॥ य इदमथर्वशिरो ब्राह्मणोऽधीते अश्रोत्रियः श्रोत्रियो भवति अनुपनीत उपनीतो भवति सोऽग्निपूतो भवति
    स वायुपूतो भवति स सूर्यपूतो भवति स सर्वेर्देवैर्ज्ञातो भवति स सर्वैर्वेदैरनुध्यातो भवति स सर्वेषु
    तीर्थेषु स्नातो भवति तेन सर्वैः क्रतुभिरिष्टं भवति गायत्र्याः षष्टिसहस्राणि जप्तानि भवन्ति इतिहासपुराणानां
    रुद्राणां शतसहस्राणि जप्तानि भवन्ति । प्रणवानामयुतं जप्तं भवति । स चक्षुषः पङ्क्तिं पुनाति । आ सप्तमात्पुरुषयुगान्पुनातीत्याह
    भगवानथर्वशिरः सकृज्जप्त्वैव शुचिः स पूतः कर्मण्यो भवति । द्वितीयं जप्त्वा गणाधिपत्यमवाप्नोति । तृतीयं
    जप्त्वैवमेवानुप्रविशत्यों सत्यमों सत्यमों सत्यम् ॥ ७॥ ॐ भद्रं कर्णेभिरिति शान्तिः ॥ ॥ इत्यथर्वशिरोपनिषत्समाप्ता
    ॥
