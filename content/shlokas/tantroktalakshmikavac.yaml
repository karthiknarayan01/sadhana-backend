id: tantroktalakshmikavac
category: kavacha
name:
  english: tantroktalakshmikavac
  devanagari: तन्त्रोक्तलक्ष्मीकवच्
content:
  english: shrilakshmiprityarthe pathe viniyogah | om lakshmi me cagratah patu kamala patu prishthatah
    | narayani shirshadeshe sarvange shrisvarupini || 1|| ramapatni tu pratyange sada'vatu shameshvari|
    vishalakshi yogamaya kaumari cakrini tatha || 2|| jayadatri dhanadatri pashakshamalini shubha | haripriya
    harirama jayankari mahodari || 3|| krishnaparayana devi shrikrishnamanamohini | jayankari maharaudri
    siddhidatri shubhankari || 4|| sukhada mokshada devi citrakutanivasini | bhayam haratu bhaktanam bhavabandham
    vimucyatu || 5|| kavacam tanmahapunyam yah pathedbhaktisamyutah | trisandhyamekasandhyam va mucyate
    sarvasankatat || 6|| etatkavacasya pathanam dhanaputravivardhanam | bhitirvinashanancaiva trishu lokeshu
    kirtitam || 7|| bhurjapatre samalikhya rocanakunkumena tu | dharanadgaladeshe ca sarvasiddhirbhavishyati
    || 8|| aputro labhate putra dhanarthi labhate dhanam | moksharthi mokshamapnoti kavacasya prasadatah
    || 9|| garbhini labhate putram vandhya ca garbhini bhavet | dharayedyapi kanthe ca athava vamabahuke
    || 10|| yah pathenniyatam bhaktya sa eva vishnuvadbhavet | mrityuvyadhibhayam tasya nasti kincinmahitale
    || 11|| pathedva pathayedva'pi sha
  devanagari: श्रीलक्ष्मीप्रीत्यर्थे पाठे विनियोगः । ॐ लक्ष्मी मे चाग्रतः पातु कमला पातु पृष्ठतः । नारायणी
    शीर्षदेशे सर्वाङ्गे श्रीस्वरूपिणी ॥ १॥ रामपत्नी तु प्रत्यङ्गे सदाऽवतु शमेश्वरी। विशालाक्षी योगमाया
    कौमारी चक्रिणी तथा ॥ २॥ जयदात्री धनदात्री पाशाक्षमालिनी शुभा । हरिप्रिया हरिरामा जयङ्करी महोदरी ॥
    ३॥ कृष्णपरायणा देवी श्रीकृष्णमनमोहिनी । जयङ्करी महारौद्री सिद्धिदात्री शुभङ्करी ॥ ४॥ सुखदा मोक्षदा
    देवी चित्रकूटनिवासिनी । भयं हरतु भक्तानां भवबन्धं विमुच्यतु ॥ ५॥ कवचं तन्महापुण्यं यः पठेद्भक्तिसंयुतः
    । त्रिसन्ध्यमेकसन्ध्यं वा मुच्यते सर्वसङ्कटात् ॥ ६॥ एतत्कवचस्य पठनं धनपुत्रविवर्धनम् । भीतिर्विनाशनञ्चैव
    त्रिषु लोकेषु कीर्तितम् ॥ ७॥ भूर्जपत्रे समालिख्य रोचनाकुङ्कुमेन तु । धारणाद्गलदेशे च सर्वसिद्धिर्भविष्यति
    ॥ ८॥ अपुत्रो लभते पुत्र धनार्थी लभते धनम् । मोक्षार्थी मोक्षमाप्नोति कवचस्य प्रसादतः ॥ ९॥ गर्भिणी
    लभते पुत्रं वन्ध्या च गर्भिणी भवेत् । धारयेद्यपि कण्ठे च अथवा वामबाहुके ॥ १०॥ यः पठेन्नियतं भक्त्या
    स एव विष्णुवद्भवेत् । मृत्युव्याधिभयं तस्य नास्ति किञ्चिन्महीतले ॥ ११॥ पठेद्वा पाठयेद्वाऽपि श
