id: raghavendrakavacam
category: kavacha
name:
  english: raghavendrakavacam
  devanagari: राघवेन्द्रकवचम्
content:
  english: kavacam raghavendrasya yatindrasya mahatmanah | vakshyami guruvaryasya vanchitarthapradayakam
    || 1|| rishirasyappanacaryah chando'nushtup prakirtitam | devata shriraghavendragururishtarthasiddhaye
    || 2|| ashtottarashatam japyam bhaktiyuktena cetasa | udyatpradyotanadyotabharmakurmasane sthitam
    || 3|| edyakhadyotanadyotapratapam ramamanasam | dhritakashayavasanam tulasiharavakshasam || 4|| dordandavilasaddandakamandaluvirajitam
    | abhayajnanamudrakshamalashilakarambujam || 5|| yogindravandyapadabjam raghavendragurum bhaje | shiro
    rakshatu me nityam raghavendro'khileshtadah || 6|| papadripatane vajrah keshan rakshatu me sada |
    kshamasuraganadhisho mukham rakshatu me guruh || 7|| harisevalabdhasarvasampatbhalam mamavatu | devasvabhavo'vatu
    me drishau tattvapradarshakah || 8|| ishtapradane kalpadruh shrotre shrutyarthabodhakah | bhavyasvarupo
    me nasam jihvam me'vatu bhavyakrit || 9|| asyam rakshatu me duhkhatulasanghagnicaryakah | sukhadhairyadisuguno
    bhruvau mama sada'vatu || 10|| oshthau rakshatu me sarvagrahanigrahashaktiman | upaplavodadhesseturdantan
    rakshatu me sada || 11|| nirastadosho me patu kapolau sarvapalakah | niravadyamahaveshah kantham me'vatu
    sarvada || 12|| karnamule tu pratyarthimukatvakaravan mama | bahuvadijayi patu hastau sattattvavadakrit
    || 13|| karau rakshatu me vidvatparijneyavisheshavan | vagvaikharibhavyasheshajayi vakshasthalam mama
    || 14|| satisantanasampattibhaktijnanadivriddhikrit | stanau rakshatu me nityam shariravadyahanikrit
    || 15|| punyavardhanapadabjabhishekajalasancayah | nabhim rakshatu me parshvau dyunaditulyasadgunah
    || 16|| prishtham rakshatu me nityam tapatrayavinashakrit | katim me rakshatu sada vandhyasatputradayakah
    || 17|| jaghanam me'vatu sada vyangasvangasamriddhikrit | guhyam rakshatu me papagraharishtavinashakrit
    || 18|| bhaktaghavidhvamsakaranijamurtipradarshakah | murtimanpatu me romam raghavendro jagadguruh
    || 19|| sarvatantrasvatantro'sau januni me sada'vatu | janghe rakshatu me nityam shrimadhvamatavardhanah
    || 20|| vijayindrakarabjotthasudhindravaraputrakah | gulphau shriraghavendro me yatirat sarvada'vatu
    ||| 21|| padau rakshatu me sarvabhayahari kripanidhih | jnanabhaktisuputrayuryashah shripunyavardhanah
    || 22|| karapadangulih sarva mamavatu jagadguruh | prativadijayasvantabhedacihnadaro guruh || 23||
    nakhanavatu me sarvan sarvashastravisharadah | aparokshikritashrishah pracyam dishi sada'vatu || 24||
    sa dakshine cavatu mam samupekshitabhavajah | apekshitapradata ca praticyamavatu prabhuh || 25|| dayadakshinyavairagyavakpatavamukhankitah
    | sadodicyamavatu mam shapanugrahashaktiman || 26|| nikhilendriyadoshaghno mahanugrahakridguruh |
    adhashcordhvam cavatu mamashtaksharamanuditam || 27|| atma''tmiyagharashighno mam rakshatu vidikshu
    ca | caturnam ca pumarthanam data pratah sada'vatu || 28|| sangrame'vatu mam nityam tattvavitsarvasaukhyakrit
    | madhyahne'gamyamahima mam rakshatu mahayashah || 29|| mritapotapranadata sayahne mam sada'vatu |
    vedisthapurushojjivi nishithe patu mam guruh || 30|| vahnisthamalikoddharta vahnitapatsada'vatu |
    samagratikavyakhyata gururme vishaye'vatu || 31|| kantare'vatu mam nityam bhatta
  devanagari: कवचं राघवेन्द्रस्य यतीन्द्रस्य महात्मनः । वक्ष्यामि गुरुवर्यस्य वाञ्छितार्थप्रदायकम् ॥ १॥
    ऋषिरस्याप्पणाचार्यः छन्दोऽनुष्टुप् प्रकीर्तितम् । देवता श्रीराघवेन्द्रगुरुरिष्टार्थसिद्धये ॥ २॥ अष्टोत्तरशतं
    जप्यं भक्तियुक्तेन चेतसा । उद्यत्प्रद्योतनद्योतभर्मकूर्मासने स्थितम् ॥ ३॥ एद्यखद्योतनद्योतप्रतापं
    राममानसम् । धृतकाषायवसनं तुलसीहारवक्षसम् ॥ ४॥ दोर्दण्डविलसद्दण्डकमण्डलुविराजितम् । अभयज्ञानमुद्राक्षमालाशीलकराम्बुजम्
    ॥ ५॥ योगीन्द्रवन्द्यपादाब्जं राघवेन्द्रगुरुं भजे । शिरो रक्षतु मे नित्यं राघवेन्द्रोऽखिलेष्टदः ॥ ६॥
    पापाद्रिपाटने वज्रः केशान् रक्षतु मे सदा । क्षमासुरगणाधीशो मुखं रक्षतु मे गुरुः ॥ ७॥ हरिसेवालब्धसर्वसम्पत्भालं
    ममावतु । देवस्वभावोऽवतु मे दृशौ तत्त्वप्रदर्शकः ॥ ८॥ इष्टप्रदाने कल्पद्रुः श्रोत्रे श्रुत्यर्थबोधकः
    । भव्यस्वरूपो मे नासां जिह्वां मेऽवतु भव्यकृत् ॥ ९॥ आस्यं रक्षतु मे दुःखतूलसङ्घाग्निचर्यकः । सुखधैर्यादिसुगुणो
    भ्रुवौ मम सदाऽवतु ॥ १०॥ ओष्ठौ रक्षतु मे सर्वग्रहनिग्रहशक्तिमान् । उपप्लवोदधेस्सेतुर्दन्तान् रक्षतु
    मे सदा ॥ ११॥ निरस्तदोषो मे पातु कपोलौ सर्वपालकः । निरवद्यमहावेषः कण्ठं मेऽवतु सर्वदा ॥ १२॥ कर्णमूले
    तु प्रत्यर्थिमूकत्वाकरवाङ् मम । बहुवादिजयी पातु हस्तौ सत्तत्त्ववादकृत् ॥ १३॥ करौ रक्षतु मे विद्वत्परिज्ञेयविशेषवान्
    । वाग्वैखरीभव्यशेषजयी वक्षस्थलं मम ॥ १४॥ सतीसन्तानसम्पत्तिभक्तिज्ञानादिवृद्धिकृत् । स्तनौ रक्षतु मे
    नित्यं शरीरावद्यहानिकृत् ॥ १५॥ पुण्यवर्धनपादाब्जाभिषेकजलसञ्चयः । नाभिं रक्षतु मे पार्श्वौ द्युनदीतुल्यसद्गुणः
    ॥ १६॥ पृष्ठं रक्षतु मे नित्यं तापत्रयविनाशकृत् । कटिं मे रक्षतु सदा वन्ध्यासत्पुत्रदायकः ॥ १७॥ जघनं
    मेऽवतु सदा व्यङ्गस्वङ्गसमृद्धिकृत् । गुह्यं रक्षतु मे पापग्रहारिष्टविनाशकृत् ॥ १८॥ भक्ताघविध्वंसकरनिजमूर्तिप्रदर्शकः
    । मूर्तिमान्पातु मे रोमं राघवेन्द्रो जगद्गुरुः ॥ १९॥ सर्वतन्त्रस्वतन्त्रोऽसौ जानुनी मे सदाऽवतु । जङ्घे
    रक्षतु मे नित्यं श्रीमध्वमतवर्धनः ॥ २०॥ विजयीन्द्रकराब्जोत्थसुधीन्द्रवरपुत्रकः । गुल्फौ श्रीराघवेन्द्रो
    मे यतिराट् सर्वदाऽवतु ॥। २१॥ पादौ रक्षतु मे सर्वभयहारी कृपानिधिः । ज्ञानभक्तिसुपुत्रायुर्यशः श्रीपुण्यवर्धनः
    ॥ २२॥ करपादाङ्गुलीः सर्वा ममावतु जगद्गुरुः । प्रतिवादिजयस्वान्तभेदचिह्नादरो गुरुः ॥ २३॥ नखानवतु मे
    सर्वान् सर्वशास्त्रविशारदः । अपरोक्षीकृतश्रीशः प्राच्यां दिशि सदाऽवतु ॥ २४॥ स दक्षिणे चावतु मां समुपेक्षितभावजः
    । अपेक्षितप्रदाता च प्रतीच्यामवतु प्रभुः ॥ २५॥ दयादाक्षिण्यवैराग्यवाक्पाटवमुखाङ्कितः । सदोदीच्यामवतु
    मां शापानुग्रहशक्तिमान् ॥ २६॥ निखिलेन्द्रियदोषघ्नो महानुग्रहकृद्गुरुः । अधश्चोर्ध्वं चावतु मामष्टाक्षरमनूदितम्
    ॥ २७॥ आत्माऽऽत्मीयाघराशिघ्नो मां रक्षतु विदिक्षु च । चतुर्णां च पुमर्थानां दाता प्रातः सदाऽवतु ॥ २८॥
    सङ्ग्रामेऽवतु मां नित्यं तत्त्ववित्सर्वसौख्यकृत् । मध्याह्नेऽगम्यमहिमा मां रक्षतु महायशाः ॥ २९॥ मृतपोतप्राणदाता
    सायाह्ने मां सदाऽवतु । वेदिस्थपुरुषोज्जीवी निशीथे पातु मां गुरुः ॥ ३०॥ वह्निस्थमालिकोद्धर्ता वह्नितापात्सदाऽवतु
    । समग्रटीकाव्याख्याता गुरुर्मे विषयेऽवतु ॥ ३१॥ कान्तारेऽवतु मां नित्यं भाट्ट
