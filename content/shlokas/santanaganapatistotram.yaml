id: santanaganapatistotram
category: stotram
name:
  english: santanaganapatistotram
  devanagari: सन्तानगणपतिस्तोत्रम्
content:
  english: santanaganapatistotram shriganeshaya namah | namo'stu gananathaya siddhibuddhiyutaya ca | sarvapradaya
    devaya putravriddhipradaya ca || 1|| gurudaraya gurave goptre guhyasitaya te | gopyaya gopitasheshabhuvanaya
    cidatmane ||2|| vishvamulaya bhavyaya vishvasrishtikaraya te | namo namaste satyaya satyapurnaya shundine
    || 3|| ekadantaya shuddhaya sumukhaya namo namah | prapannajanapalaya pranatartivinashine || 4|| sharanam
    bhava devesha santatim sudridha kuru| bhavishyanti ca ye putra matkule gananayaka || 5|| te sarve
    tava pujartham niratah syurvaromatah | putrapradamidam stotram sarvasiddhipradayakam || 6|| iti santanaganapatistotram
    sampurnam |
  devanagari: सन्तानगणपतिस्तोत्रम् श्रीगणेशाय नमः । नमोऽस्तु गणनाथाय सिद्धिबुद्धियुताय च । सर्वप्रदाय
    देवाय पुत्रवृद्धिप्रदाय च ॥ १॥ गुरुदराय गुरवे गोप्त्रे गुह्यासिताय ते । गोप्याय गोपिताशेषभुवनाय चिदात्मने
    ॥२॥ विश्वमूलाय भव्याय विश्वसृष्टिकराय ते । नमो नमस्ते सत्याय सत्यपूर्णाय शुण्डिने ॥ ३॥ एकदन्ताय शुद्धाय
    सुमुखाय नमो नमः । प्रपन्नजनपालाय प्रणतार्तिविनाशिने ॥ ४॥ शरणं भव देवेश सन्ततिं सुदृढा कुरु। भविष्यन्ति
    च ये पुत्रा मत्कुले गणनायक ॥ ५॥ ते सर्वे तव पूजार्थं निरताः स्युर्वरोमतः । पुत्रप्रदमिदं स्तोत्रं
    सर्वसिद्धिप्रदायकम् ॥ ६॥ इति सन्तानगणपतिस्तोत्रं सम्पूर्णम् ।
