id: sutikshnakritamramastotram-10
category: stotram
name:
  english: sutikshnakritamramastotram 10
  devanagari: सुतीक्ष्णकृतंरामस्तोत्रम् १०
content:
  english: 10|| namaste kaushikamuneryagarakshanadikshita | namaste kausaleyaya vishvamitrapriyaya ca
    || 11|| namaste harakodandabhanjakamarasevita | maricantaka rajendra tatakaprananashana || 12|| kabandhare
    hare tubhyam namo dasharathatmaja | jamadagnyajite tubhyam kharavidhvamsine namah || 13|| namah sugrivanathaya
    namo valiharaya te | vibhishanabhayakleshaharine malaharine || 14|| ahalyaduhkhasamhartre namaste
    bharatagraja | ambhodhigarvasamhartre tasminsetukrite namah || 15|| tarakabrahmane tubhyam lakshmanagraja
    te namah | rakshahsamharine tubhyam namo ravanamarddine || 16|| kodandadharine tubhyam sarvarakshavidhayine
    || iti shriskandapurane brahmakhande setukhande ashtadasha
  devanagari: १०॥ नमस्ते कौशिकमुनेर्यागरक्षणदीक्षित । नमस्ते कौसलेयाय विश्वामित्रप्रियाय च ॥ ११॥ नमस्ते
    हरकोदण्डभञ्जकामरसेवित । मारीचान्तक राजेन्द्र ताटकाप्राणनाशन ॥ १२॥ कबन्धारे हरे तुभ्यं नमो दशरथात्मज
    । जामदग्न्यजिते तुभ्यं खरविध्वंसिने नमः ॥ १३॥ नमः सुग्रीवनाथाय नमो वालिहराय ते । विभीषणभयक्लेशहारिणे
    मलहारिणे ॥ १४॥ अहल्यादुःखसंहर्त्रे नमस्ते भरताग्रज । अम्भोधिगर्वसंहर्त्रे तस्मिन्सेतुकृते नमः ॥ १५॥
    तारकब्रह्मणे तुभ्यं लक्ष्मणाग्रज ते नमः । रक्षःसंहारिणे तुभ्यं नमो रावणमर्द्दिने ॥ १६॥ कोदण्डधारिणे
    तुभ्यं सर्वरक्षाविधायिने ॥ इति श्रीस्कन्दपुराणे ब्रह्मखण्डे सेतुखण्डे अष्टादशा
