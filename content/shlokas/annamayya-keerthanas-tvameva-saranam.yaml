id: annamayya-keerthanas-tvameva-saranam
category: stotram
name:
  english: Annamayya Keerthanas Tvameva Saranam
content:
  english: adi pallavi tvameva sharanam tvameva sharanam kamalodara shrijagannatha || vasudeva krishna
    vamana narasimha shri satisha sarasijanetra | bhusuravallabha purushottama pita balabhadranuja paramapurusha
    dugdha jaladhivihara kunjaravarada | sulabha subhadra sumukha sureshvara kalidoshaharana jagannatha
    || vatapatrashayana bhuvanapalana jantu ghatakarakarana shringaradhipa | patutara nityavaibhavaraya
    tiruvenkatagirinilaya jagannatha ||
  devanagari: आदि पल्लवि त्वमेव शरणं त्वमेव शरणं कमलोदर श्रीजगन्नाथा ॥ वासुदेव कृष्ण वामन नरसिंह श्री
    सतीश सरसिजनेत्रा । भूसुरवल्लभ पुरुषोत्तम पीत बलभद्रानुज परमपुरुष दुग्ध जलधिविहार कुञ्जरवरद । सुलभ
    सुभद्रा सुमुख सुरेश्वर कलिदोषहरण जगन्नाथा ॥ वटपत्रशयन भुवनपालन जन्तु घटकारकरण शृङ्गाराधिपा । पटुतर
    नित्यवैभवराय तिरुवेङ्कटगिरिनिलय जगन्नाथा ॥
