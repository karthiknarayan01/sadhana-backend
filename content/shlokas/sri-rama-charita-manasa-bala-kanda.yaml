    सदा सिव जोगी। अज अनवद्य अकाम अभोगी ॥ जौं मैं सिव सेये अस जानी। प्रीति समेत कर्म मन बानी ॥ तौ हमार
    पन सुनहु मुनीसा। करिहहिं सत्य कृपानिधि ईसा ॥ तुम्ह जो कहा हर जारेउ मारा। सोइ अति बड़ अबिबेकु तुम्हारा
    ॥ तात अनल कर सहज सुभ् । हिम तेहि निकट जाइ नहिं क् ॥ गेँ समीप सो अवसि नसाई। असि मन्मथ महेस की नाई ॥
    दो हियँ हरषे मुनि बचन सुनि देखि प्रीति बिस्वास ॥ चले भवानिहि नाइ सिर गे हिमाचल पास ॥ ॥ सबु प्रसङ्गु
    गिरिपतिहि सुनावा। मदन दहन सुनि अति दुखु पावा ॥ बहुरि कहेउ रति कर बरदाना। सुनि हिमवन्त बहुत सुखु माना
    ॥ हृदयँ बिचारि सम्भु प्रभुताई। सादर मुनिबर लिए बोलाई ॥ सुदिनु सुनखतु सुघरी सोचाई। बेगि बेदबिधि लगन
    धराई ॥ पत्री सप्तरिषिन्ह सोइ दीन्ही। गहि पद बिनय हिमाचल कीन्ही ॥ जाइ बिधिहि दीन्हि सो पाती। बाचत प्रीति
    न हृदयँ समाती ॥ लगन बाचि अज सबहि सुनाई। हरषे मुनि सब सुर समुदाई ॥ सुमन बृष्टि नभ बाजन बाजे। मङ्गल
    कलस दसहुँ दिसि साजे ॥ दो लगे सँवारन सकल सुर बाहन बिबिध बिमान। होहि सगुन मङ्गल सुभद करहिं अपछरा गान
    ॥ ॥ सिवहि सम्भु गन करहिं सिङ्गारा। जटा मुकुट अहि मौरु सँवारा ॥ कुण्डल कङ्कन पहिरे ब्याला। तन बिभूति
    पट केहरि छाला ॥ ससि ललाट सुन्दर सिर गङ्गा। नयन तीनि उपबीत भुजङ्गा ॥ गरल कण्ठ उर नर सिर माला। असिव
    बेष सिवधाम कृपाला ॥ कर त्रिसूल अरु डमरु बिराजा। चले बसहँ चढ़इ बाजहिं बाजा ॥ देखि सिवहि सुरत्रिय मुसुकाहीं।
    बर लायक दुलहिनि जग नाहीम् ॥ बिष्नु बिरञ्चि आदि सुरब्राता। चढ़इ चढ़इ बाहन चले बराता ॥ सुर समाज सब भाँति
    अनूपा। नहिं बरात दूलह अनुरूपा ॥ दो बिष्नु कहा अस बिहसि तब बोलि सकल दिसिराज। बिलग बिलग होइ चलहु सब
    निज निज सहित समाज ॥ ॥ बर अनुहारि बरात न भाई। हँसी करैहहु पर पुर जाई ॥ बिष्नु बचन सुनि सुर मुसकाने।
    निज निज सेन सहित बिलगाने ॥ मनहीं मन महेसु मुसुकाहीं। हरि के बिङ्ग्य बचन नहिं जाहीम् ॥ अति प्रिय बचन
    सुनत प्रिय केरे। भृङ्गिहि प्रेरि सकल गन टेरे ॥ सिव अनुसासन सुनि सब आए। प्रभु पद जलज सीस तिन्ह नाए
    ॥ नाना बाहन नाना बेषा। बिहसे सिव समाज निज देखा ॥ कौ मुखहीन बिपुल मुख काहू। बिनु पद कर कौ बहु पद बाहू
    ॥ बिपुल नयन कौ नयन बिहीना। रिष्टपुष्ट कौ अति तनखीना ॥ छं तन खीन कौ अति पीन पावन कौ अपावन गति धरें।
    भूषन कराल कपाल कर सब सद्य सोनित तन भरेम् ॥ खर स्वान सुअर सृकाल मुख गन बेष अगनित को गनै। बहु जिनस प्रेत
    पिसाच जोगि जमात बरनत नहिं बनै ॥ सो नाचहिं गावहिं गीत परम तरङ्गी भूत सब। देखत अति बिपरीत बोलहिं बचन
    बिचित्र बिधि ॥ ॥ जस दूलहु तसि बनी बराता। कौतुक बिबिध होहिं मग जाता ॥ इहाँ हिमाचल रचेउ बिताना। अति
    बिचित्र नहिं जाइ बखाना ॥ सैल सकल जहँ लगि जग माहीं। लघु बिसाल नहिं बरनि सिराहीम् ॥ बन सागर सब नदीं
    तलावा। हिमगिरि सब कहुँ नेवत पठावा ॥ कामरूप सुन्दर तन धारी। सहित समाज सहित बर नारी ॥ गे सकल तुहिनाचल
    गेहा। गावहिं मङ्गल सहित सनेहा ॥ प्रथमहिं गिरि बहु गृह सँवराए। जथाजोगु तहँ तहँ सब छाए ॥ पुर सोभा अवलोकि
    सुहाई। लागि लघु बिरञ्चि निपुनाई ॥ छं लघु लाग बिधि की निपुनता अवलोकि पुर सोभा सही। बन बाग कूप तड़आग
    सरिता सुभग सब सक को कही ॥ मङ्गल बिपुल तोरन पताका केतु गृह गृह सोहहीम् ॥ बनिता पुरुष सुन्दर चतुर छबि
    देखि मुनि मन मोहहीम् ॥ दो जगदम्बा जहँ अवतरी सो पुरु बरनि कि जाइ। रिद्धि सिद्धि सम्पत्ति सुख नित नूतन
    अधिकाइ ॥ ॥ नगर निकट बरात सुनि आई। पुर खरभरु सोभा अधिकाई ॥ करि बनाव सजि बाहन नाना। चले लेन सादर अगवाना
    ॥ हियँ हरषे सुर सेन निहारी। हरिहि देखि अति भे सुखारी ॥ सिव समाज जब देखन लागे। बिडरि चले बाहन सब भागे
    ॥ धरि धीरजु तहँ रहे सयाने। बालक सब लै जीव पराने ॥ गेँ भवन पूछहिं पितु माता। कहहिं बचन भय कम्पित गाता
    ॥ कहिअ काह कहि जाइ न बाता। जम कर धार किधौं बरिआता ॥ बरु बौराह बसहँ असवारा। ब्याल कपाल बिभूषन छारा
    ॥ छं तन छार ब्याल कपाल भूषन नगन जटिल भयङ्करा। सँग भूत प्रेत पिसाच जोगिनि बिकट मुख रजनीचरा ॥ जो जिअत
    रहिहि बरात देखत पुन्य बड़ तेहि कर सही। देखिहि सो उमा बिबाहु घर घर बात असि लरिकन्ह कही ॥ दो समुझि महेस
    समाज सब जननि जनक मुसुकाहिं। बाल बुझाए बिबिध बिधि निडर होहु डरु नाहिम् ॥ ॥ लै अगवान बरातहि आए। दिए
    सबहि जनवास सुहाए ॥ मैनाँ सुभ आरती सँवारी। सङ्ग सुमङ्गल गावहिं नारी ॥ कञ्चन थार सोह बर पानी। परिछन
    चली हरहि हरषानी ॥ बिकट बेष रुद्रहि जब देखा। अबलन्ह उर भय भयु बिसेषा ॥ भागि भवन पैठीं अति त्रासा। गे
    महेसु जहाँ जनवासा ॥ मैना हृदयँ भयु दुखु भारी। लीन्ही बोलि गिरीसकुमारी ॥ अधिक सनेहँ गोद बैठारी। स्याम
    सरोज नयन भरे बारी ॥ जेहिं बिधि तुम्हहि रूपु अस दीन्हा। तेहिं जड़ बरु बाउर कस कीन्हा ॥ छं कस कीन्ह
    बरु बौराह बिधि जेहिं तुम्हहि सुन्दरता दी। जो फलु चहिअ सुरतरुहिं सो बरबस बबूरहिं लागी ॥ तुम्ह सहित
    गिरि तें गिरौं पावक जरौं जलनिधि महुँ परौम् ॥ घरु जाउ अपजसु हौ जग जीवत बिबाहु न हौं करौम् ॥ दो भी बिकल
    अबला सकल दुखित देखि गिरिनारि। करि बिलापु रोदति बदति सुता सनेहु सँभारि ॥ ॥ नारद कर मैं काह बिगारा।
    भवनु मोर जिन्ह बसत उजारा ॥ अस उपदेसु उमहि जिन्ह दीन्हा। बौरे बरहि लगि तपु कीन्हा ॥ साचेहुँ उन्ह के
    मोह न माया। उदासीन धनु धामु न जाया ॥ पर घर घालक लाज न भीरा। बाझँ कि जान प्रसव कैं पीरा ॥ जननिहि बिकल
    बिलोकि भवानी। बोली जुत बिबेक मृदु बानी ॥ अस बिचारि सोचहि मति माता। सो न टरि जो रचि बिधाता ॥ करम लिखा
    जौ बाउर नाहू। तौ कत दोसु लगाइअ काहू ॥ तुम्ह सन मिटहिं कि बिधि के अङ्का। मातु ब्यर्थ जनि लेहु कलङ्का
    ॥ छं जनि लेहु मातु कलङ्कु करुना परिहरहु अवसर नहीं। दुखु सुखु जो लिखा लिलार हमरें जाब जहँ पाउब तहीम्
    ॥ सुनि उमा बचन बिनीत कोमल सकल अबला सोचहीम् ॥ बहु भाँति बिधिहि लगाइ दूषन नयन बारि बिमोचहीम् ॥ दो तेहि
    अवसर नारद सहित अरु रिषि सप्त समेत। समाचार सुनि तुहिनगिरि गवने तुरत निकेत ॥ ॥ तब नारद सबहि समुझावा।
    पूरुब कथाप्रसङ्गु सुनावा ॥ मयना सत्य सुनहु मम बानी। जगदम्बा तव सुता भवानी ॥ अजा अनादि सक्ति अबिनासिनि।
    सदा सम्भु अरधङ्ग निवासिनि ॥ जग सम्भव पालन लय कारिनि। निज इच्छा लीला बपु धारिनि ॥ जनमीं प्रथम दच्छ
    गृह जाई। नामु सती सुन्दर तनु पाई ॥ तहँहुँ सती सङ्करहि बिबाहीं। कथा प्रसिद्ध सकल जग माहीम् ॥ एक बार
    आवत सिव सङ्गा। देखेउ रघुकुल कमल पतङ्गा ॥ भयु मोहु सिव कहा न कीन्हा। भ्रम बस बेषु सीय कर लीन्हा ॥ छं
    सिय बेषु सती जो कीन्ह तेहि अपराध सङ्कर परिहरीं। हर बिरहँ जाइ बहोरि पितु कें जग्य जोगानल जरीम् ॥ अब
    जनमि तुम्हरे भवन निज पति लागि दारुन तपु किया। अस जानि संसय तजहु गिरिजा सर्बदा सङ्कर प्रिया ॥ दो सुनि
    नारद के बचन तब सब कर मिटा बिषाद। छन महुँ ब्यापेउ सकल पुर घर घर यह सम्बाद ॥ ॥ तब मयना हिमवन्तु अनन्दे।
    पुनि पुनि पारबती पद बन्दे ॥ नारि पुरुष सिसु जुबा सयाने। नगर लोग सब अति हरषाने ॥ लगे होन पुर मङ्गलगाना।
