id: brahmakritam1subhadrastotram
category: stotram
name:
  english: brahmakritam1subhadrastotram
  devanagari: ब्रह्मकृतं१सुभद्रास्तोत्रम्
content:
  english: brahmakritam 1 subhadrastotram stutva jayam tam bho viprah pranipatya prasadayet | jaya devi
    mahadevi prasida bhavatarini || 56|| sukharani shritavatam jaya santushtikarini | karyam karyasvarupanam
    karananam ca karanam || 97|| dharanam dharyamananam tvamadim pranamamyaham | vakshahsthalasthitam
    vishnoh shambhorarddhangadharinim || 58|| padmayonimukhabjastham pranamami jagatpriyam | srishtisthitivinashadikarmanam
    paramatmanah || 59|| tvameka shaktiratula tvam vina so'pi neshvarah | tvam sarvalokajananim vishnumayam
    tapasvinim || 2
  devanagari: ब्रह्मकृतं १ सुभद्रास्तोत्रम् स्तुत्वा जयां तां भो विप्राः प्रणिपत्य प्रसादयेत् । जय देवि
    महादेवि प्रसीद भवतारिणि ॥ ५६॥ सुखारणि श्रितवतां जय सन्तुष्टिकारिणि । कार्यं कार्यस्वरूपाणां कारणानां
    च कारणम् ॥ ९७॥ धारणां धार्यमाणानां त्वामादिं प्रणमाम्यहम् । वक्षःस्थलस्थितां विष्णोः शम्भोरर्द्धाङ्गधारिणीम्
    ॥ ५८॥ पद्मयोनिमुखाब्जस्थां प्रणमामि जगत्प्रियाम् । सृष्टिस्थितिविनाशादिकर्मणां परमात्मनः ॥ ५९॥ त्वमेका
    शक्तिरतुला त्वां विना सोऽपि नेश्वरः । त्वां सर्वलोकजननीं विष्णुमायां तपस्विनीम् ॥ २
