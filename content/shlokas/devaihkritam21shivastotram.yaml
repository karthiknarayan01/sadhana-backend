id: devaihkritam21shivastotram
category: stotram
name:
  english: devaihkritam21shivastotram
  devanagari: देवैःकृतं२१शिवस्तोत्रम्
content:
  english: devaih kritam 21 shivastotram tasmindvipe tato devi suryakotisamaprabham | sashtangam pranatim
    kritva te devah stutimabruvan || 15|| bhavanbrahma ca rudrashca mahendro devasattamah | bhavankartta
    vikartta ca lokanam prabhavo'vyayah || 16|| evam ca satyam paramam tapashca paramam tatha | pavitram
    paramamargam yajnastvam paramah prabho || 17
  devanagari: देवैः कृतं २१ शिवस्तोत्रम् तस्मिन्द्वीपे ततो देवि सूर्यकोटिसमप्रभम् । साष्टाङ्गां प्रणतिं
    कृत्वा ते देवाः स्तुतिमब्रुवन् ॥ १५॥ भवान्ब्रह्मा च रुद्रश्च महेन्द्रो देवसत्तमः । भवान्कर्त्ता विकर्त्ता
    च लोकानां प्रभवोऽव्ययः ॥ १६॥ एवं च सत्यं परमं तपश्च परमं तथा । पवित्रं परममार्गं यज्ञस्त्वं परमः प्रभो
    ॥ १७
meaning: {}
