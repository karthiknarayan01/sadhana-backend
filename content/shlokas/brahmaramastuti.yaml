id: brahmaramastuti
category: stotram
name:
  english: brahmaramastuti
  devanagari: ब्रह्मरामस्तुति
content:
  english: shriramastuti brahmadevakritam shri ganeshaya namah | brahmovacah | vande devam vishnumasheshasthitihetum
    tvamadhyatmajnanibhirantarhridi bhavyam | heyaheyadvandvavihinam paramekam sattamatram sarvahridistham
    drishirupam || 1|| pranapanau nishcayabuddhya hridi ruddhva chitva sarvam samshayabandham vishayaughan
    | pashyantisham yam gatamoha yatayastam vande ramam ratnakiritam ravibhasam || 2|| mayatitam madhavamadyam
    jagadadim manatitam mohavinasham munivandyam | yogidhyeyam yogavidhanam paripurnam vande ramam ranjitalokam
    ramaniyam || 3|| bhavabhavapratyayahinam bhavamukhyairbhogasaktairarcitapadambujayugmam | nityam shuddham
    buddhamanantam pranavakhyam vande ramam viramasheshasuradavam || 4|| tvam me natho nathitakaryakhilakari
    manatito madhavarupo'khiladhari | bhaktya gamyo bhavitarupo bhavahari yogabhyasairbhavitacetahsahacari
    || 5|| tvamadyantam lokatatinam paramisham lokanam no laukikamanairadhigamyam | bhaktishraddhabhavasametairbhajaniyam
    vande ramam sundaramindivaranilam || 6|| ko va jnatum tvamatimanam gatamanam manasakto madhavashakto
    munimanyam | vrindaranye vanditavrindarakavrindam vande ramam bhavamukhavandyam sukhakandam || 7||
    nanashastrairvedakadambaih pratipadyam nityanandam nirvishayajnanamanadim | matsevartham manushabhavam
    pratipannam vande ramam marakatavarnam mathuresham || 8|| shraddhayukto yah pathatimam stavamadyam
    brahmam brahmajnanavidhanam bhuvi martyah | ramam shyamam kamitakamapradamisham dhyatva dhyata patakajalairvigatah
    syat || 9|| || iti shrimaddhyatmaramayane yuddhakande brahmadevakritam ramastotram sampurnam ||
  devanagari: श्रीरामस्तुती ब्रह्मदेवकृतम् श्री गणेशाय नमः । ब्रह्मोवाचः । वन्दे देवं विष्णुमशेषस्थितिहेतुं
    त्वामध्यात्मज्ञानिभिरन्तर्हृदि भाव्यम् । हेयाहेयद्वन्द्वविहीनं परमेकं सत्तामात्रं सर्वहृदिस्थं दृशिरूपम्
    ॥ १॥ प्राणापानौ निश्चयबुद्ध्या हृदि रुद्ध्वा छित्वा सर्वं संशयबन्धं विषयौघान् । पश्यन्तीशं यं गतमोहा
    यतयस्तं वन्दे रामं रत्नकिरीटं रविभासम् ॥ २॥ मायातीतं माधवमाद्यं जगदादिं मानातीतं मोहविनाशं मुनिवन्द्यम्
    । योगिध्येयं योगविधानं परिपूर्णं वन्दे रामं रञ्जितलोकं रमणीयम् ॥ ३॥ भावाभावप्रत्ययहीनं भवमुख्यैर्भोगासक्तैरर्चितपादाम्बुजयुग्मम्
    । नित्यं शुद्धं बुद्धमनन्तं प्रणवाख्यं वन्दे रामं वीरमशेषासुरदावम् ॥ ४॥ त्वं मे नाथो नाथितकार्याखिलकारी
    मानातीतो माधवरूपोऽखिलधारी । भक्त्या गम्यो भावितरूपो भवहारी योगाभ्यासैर्भावितचेतःसहचारी ॥ ५॥ त्वामाद्यन्तं
    लोकततीनां परमीशं लोकानां नो लौकिकमानैरधिगम्यम् । भक्तिश्रद्धाभावसमेतैर्भजनीयं वन्दे रामं सुन्दरमिन्दीवरनीलम्
    ॥ ६॥ को वा ज्ञातुं त्वामतिमानं गतमानं मानासक्तो माधवशक्तो मुनिमान्यम् । वृन्दारण्ये वन्दितवृन्दारकवृन्दं
    वन्दे रामं भवमुखवन्द्यं सुखकन्दम् ॥ ७॥ नानाशास्त्रैर्वेदकदम्बैः प्रतिपाद्यं नित्यानन्दं निर्विषयज्ञानमनादिम्
    । मत्सेवार्थं मानुषभावं प्रतिपन्नं वन्दे रामं मरकतवर्णं मथुरेशम् ॥ ८॥ श्रद्धायुक्तो यः पठतीमं स्तवमाद्यं
    ब्राह्मं ब्रह्मज्ञानविधानं भुवि मर्त्यः । रामं श्यामं कामितकामप्रदमीशं ध्यात्वा ध्याता पातकजालैर्विगतः
    स्यात् ॥ ९॥ ॥ इति श्रीमद्ध्यात्मरामायणे युद्धकाण्डे ब्रह्मदेवकृतं रामस्तोत्रं सम्पूर्णम् ॥
