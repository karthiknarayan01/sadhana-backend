id: subrahmanyakavacam-2
category: kavacha
name:
  english: subrahmanyakavacam 2
  devanagari: सुब्रह्मण्यकवचम् २
content:
  english: locanah ||12 || katim dvishadbhujah patu guhyam gangasuto'vatu | jaghanam jahnavisunuh prishthabhagam
    parantapah || 13|| uru rakshedumaputrah januyugmam jagaddharah | janghe patu jagatpujyah gulphau patu
    mahabalah || 14|| padau patu paramjyotih sarvangam kukkutaddhvajah | urdhvam patu mahodarah adhastatpatu
    shankarih || 15|| parshvayoh patu shatrughnah sarvada patu shashvatah | pratah patu param brahma maddhyahne
    yuddhakaushalah || 16|| aparahne guhah patu ratrau daityantako'vatu | trisandhyantu trikalajnah antastham
    patvarindamah || 17|| bahisthitam patu khadhgi nishannam krittikasutah | vrajantam prathamadhishah
    tishthantam patu pashabhrit || 18|| shayane patu mam shurah marge mam patu shurajit | ugraranye vajradharah
    sada rakshatu mam vatuh || 19|| subrahmanyasya kavacam dharmakamarthamokshadam | mantranam paramam
    mantram rahasyam sarvadehinam || 20|| sarvarogaprashamanam sarvavyadhi vinashanam | sarvapunya pradam
    divyam subhagaishvarya vardhanam || 21|| sarvatra shubhadam nityam yah pathedvajrapanjaram | subrahmanyassusamprito
    vanchitarthan prayacchati || 22|| dehante muktimapnoti skandavarmanubhavatah || || iti skande agastya
    narada samvade shivaproktam subrahmanya kavacam sampurnam ||
  devanagari: लोचनः ॥१२ ॥ कटिं द्विषड्भुजः पातु गुह्यं गङ्गासुतोऽवतु । जघनं जाह्नवीसूनुः पृष्ठभागं परन्तपः
    ॥ १३॥ ऊरू रक्षेदुमापुत्रः जानुयुग्मं जगद्धरः । जङ्घे पातु जगत्पूज्यः गुल्फौ पातु महाबलः ॥ १४॥ पादौ
    पातु परंज्योतिः सर्वाङ्गं कुक्कुटद्ध्वजः । ऊर्ध्वं पातु महोदारः अधस्तात्पातु शाङ्करिः ॥ १५॥ पार्श्वयोः
    पातु शत्रुघ्नः सर्वदा पातु शाश्वतः । प्रातः पातु परं ब्रह्म मद्ध्याह्ने युद्धकौशलः ॥ १६॥ अपराह्ने
    गुहः पातु रात्रौ दैत्यान्तकोऽवतु । त्रिसन्ध्यन्तु त्रिकालज्ञः अन्तस्थं पात्वरिन्दमः ॥ १७॥ बहिस्थितं
    पातु खढ्गी निषण्णं कृत्तिकासुतः । व्रजन्तं प्रथमाधीशः तिष्ठन्तं पातु पाशभृत् ॥ १८॥ शयने पातु मां शूरः
    मार्गे मां पातु शूरजित् । उग्रारण्ये वज्रधरः सदा रक्षतु मां वटुः ॥ १९॥ सुब्रह्मण्यस्य कवचं धर्मकामार्थमोक्षदम्
    । मन्त्राणां परमं मन्त्रं रहस्यं सर्वदेहिनाम् ॥ २०॥ सर्वरोगप्रशमनं सर्वव्याधि विनाशनम् । सर्वपुण्य
    प्रदं दिव्यं सुभगैश्वर्य वर्धनम् ॥ २१॥ सर्वत्र शुभदं नित्यं यः पठेद्वज्रपञ्जरम् । सुब्रह्मण्यस्सुसम्प्रीतो
    वाञ्छितार्थान् प्रयच्छति ॥ २२॥ देहान्ते मुक्तिमाप्नोति स्कन्दवर्मानुभावतः ॥ ॥ इति स्कान्दे अगस्त्य
    नारद संवादे शिवप्रोक्तं सुब्रह्मण्य कवचं सम्पूर्णम् ॥
