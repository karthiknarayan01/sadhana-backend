id: niruktopanishat-3
category: upanishad
name:
  english: niruktopanishat
  devanagari: निरुक्तोपनिषत्
content:
  english: niruktopanishat sa yadyanurudhyate tadbhavati | yadi dharmo'nurudhyate tadevodbhavati | yadi
    jnanamanurudhyate tadamrito bhavati | yadi kamamanurudhyate sancaratam imam yonim sandadhyattadidamatra
    manah shleshmaretasah sambhavati | shleshmano rasah | rasacchonitam | shonitanmamsam | mamsanmedah
    | medasah snava | snavo'sthini | asthibhyo majja | majjato retah | tadidam yonau retah siktam purushah
    sambhavati | shukratireke puman bhavati | shonitatireke stri bhavati | dvabhyam samena napumsako bhavati
    | shukrabhinnena yamo bhavati | shukrashonitasamyoganmatripitrisamyogacca kathamidam shariram param
    samyamyate | saumyo bhavatyekaratroshitam kalalam bhavati | pancaratrabudbudah | saptaratrat peshi
    | dvisaptaratradarbudah | pancavimshatiratrasthito yonau ghano bhavati | masamatrat kathino bhavati
    | dvimasabhyantare shirah sampadyate | masatrayena grivavyadeshah | masacatushkena tvagvyadeshah |
    pancame mase nakharomavyadeshah | shashthe mukhanasikakshishrotram ca sambhavati | saptame calanasamartho
    bhavati | ashtame buddhyadhyavasyate | navame sarvangasampurno bhavati || mritashcaham punarjato jatashcaham
    punarmritah | nanayonisahasrani maya yanyushitani vai || ahara vividha bhuktah pita nanavidhah stanah
    | mataro vividha drishtah pitarah suhridastatha || avanmukhah pidyamano jantushcaiva samanvitah |
    sankhyam yogam samabhyasya purusham pancavimshakam || iti || tatashca dashame mase prajayate | jatashca
    vayuna sprishto na smarati janma maranam | ante ca shubhashubham karmaitaccharirasya pramanyam ||
    iti niruktopanishadi vimshatitamodhyayah | ashtottaram sandhishatamashtakapalam shirah sampadyate
    | shodasha vapapalani | nava snayushatani | saptashatam purushasya marmani | ardhacatasro romani kotayah
    | hridayam hyashtakapalani | dvadashakapalani jihva | vrishano hrishtasuparnau | tata upasthagudayonyetanmutrapurisham
    kasmadaharapanasiktatvadanupacati | karmana anyonyam jayata iti | tam vidyakarmani samanvarabhete
    purvaprajna ca | mahatyajnanatamasi magno jaramaranakshutpipasashokakrodhadrohalobhamohamadabhayamatsara
  devanagari: निरुक्तोपनिषत् स यद्यनुरुध्यते तद्भवति । यदि धर्मोऽनुरुध्यते तदेवोद्भवति । यदि ज्ञानमनुरुध्यते
    तदमृतो भवति । यदि काममनुरुध्यते सञ्चरतां इमां योनिं सन्दध्यात्तदिदमत्र मनः श्लेष्मरेतसः सम्भवति ।
    श्लेष्मणो रसः । रसाच्छोणितम् । शोणितान्मांसम् । मांसान्मेदः । मेदसः स्नावा । स्नावोऽस्थीनि । अस्थिभ्यो
    मज्जा । मज्जातो रेतः । तदिदं योनौ रेतः सिक्तं पुरुषः सम्भवति । शुक्रातिरेके पुमान् भवति । शोणितातिरेके
    स्त्री भवति । द्वाभ्यां समेन नपुंसको भवति । शुक्रभिन्नेन यमो भवति । शुक्रशोणितसंयोगान्मातृपितृसंयोगाच्च
    कथमिदं शरीरं परं संयम्यते । सौम्यो भवत्येकरात्रोषितं कललं भवति । पञ्चरात्राबुद्बुदः । सप्तरात्रात्
    पेशी । द्विसप्तरात्रादर्बुदः । पञ्चविंशतिरात्रस्थितो योनौ घनो भवति । मासमात्रात् कठिनो भवति । द्विमासाभ्यन्तरे
    शिरः सम्पद्यते । मासत्रयेण ग्रीवाव्यादेशः । मासचतुष्केण त्वग्व्यादेशः । पञ्चमे मासे नखरोमव्यादेशः
    । षष्ठे मुखनासिकाक्षिश्रोत्रं च सम्भवति । सप्तमे चलनसमर्थो भवति । अष्टमे बुद्ध्याध्यवस्यते । नवमे
    सर्वाङ्गसम्पूर्णो भवति ॥ मृतश्चाहं पुनर्जातो जातश्चाहं पुनर्मृतः । नानायोनिसहस्राणि मया यान्युषितानि
    वै ॥ आहारा विविधा भुक्ताः पीता नानाविधाः स्तनाः । मातरो विविधा दृष्टाः पितरः सुहृदस्तथा ॥ अवाङ्मुखः
    पीड्यमानो जन्तुश्चैव समन्वितः । साङ्ख्यं योगं समभ्यस्य पुरुषं पञ्चविंशकम् ॥ इति ॥ ततश्च दशमे मासे
    प्रजायते । जातश्च वायुना स्पृष्टो न स्मरति जन्म मरणम् । अन्ते च शुभाशुभं कर्मैतच्छरीरस्य प्रामाण्यम्
    ॥ इति निरुक्तोपनिषदि विंशतितमोध्यायः । अष्टोत्तरं सन्धिशतमष्टाकपालं शिरः सम्पद्यते । षोडश वपापलानि
    । नव स्नायुशतानि । सप्तशतं पुरुषस्य मर्माणि । अर्धचतस्रो रोमाणि कोटयः । हृदयं ह्यष्टकपलानि । द्वादशकपलानि
    जिह्वा । वृषणो हृष्टसुपर्णौ । तत उपस्थगुदयोन्येतन्मूत्रपुरीषं कस्मादाहारापानसिक्तत्वादनुपचति । कर्मणा
    अन्योन्यं जायत इति । तं विद्याकर्मणी समन्वारभेते पूर्वप्रज्ञा च । महत्यज्ञानतमासि मग्नो जरामरणक्षुत्पिपासाशोकक्रोधद्रोहलोभमोहमदभयमत्सर
