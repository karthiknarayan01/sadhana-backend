id: devaihkritamgananathastotram
category: stotram
name:
  english: devaihkritamgananathastotram
  devanagari: देवैःकृतंगणनाथस्तोत्रम्
content:
  english: devaih kritam gananathastotram deva ucuh | namaste rudrabhaktaya rudrajapyarataya ca || 154||
    rudrabhaktartinashaya raudrakarmarataya te | kushmandagananathaya yoginam pataye namah || 155|| sarvadaya
    sharanyaya sarvajnayartiharine | vedanam pataye caiva vedavedyaya te namah || 156|| vajrine vajradamshtraya
    vajrivajranivarine | vajralankritadehaya vajrina''radhitaya te || 157|| raktaya raktanetraya raktambaradharaya
    te | raktanam bhavapadabje rudralokapradayine || 158|| namah senadhipataye rudranam pateya namah |
    bhutanam bhuvaneshanam pataye papaharine || 159|| rudraya rudrapataye raudrapapaharaya te | namah
    shivaya saumyaya rudrabhaktaya te namah || 160|| iti shrilingamahapurane purvabhage ekasaptatitamadhyayantargatam
    devaih kritam gananathastotram samaptam | lingapurana | purvabhaga | adhyaya 71
  devanagari: देवैः कृतं गणनाथस्तोत्रम् देवा ऊचुः । नमस्ते रुद्रभक्ताय रुद्रजाप्यरताय च ॥ १५४॥ रुद्रभक्तार्तिनाशाय
    रौद्रकर्मरताय ते । कूष्माण्डगणनाथाय योगिनां पतये नमः ॥ १५५॥ सर्वदाय शरण्याय सर्वज्ञायार्तिहारिणे ।
    वेदानां पतये चैव वेदवेद्याय ते नमः ॥ १५६॥ वज्रिणे वज्रदंष्ट्राय वज्रिवज्रनिवारिणे । वज्रालङ्कृतदेहाय
    वज्रिणाऽऽराधिताय ते ॥ १५७॥ रक्ताय रक्तनेत्राय रक्ताम्बरधराय ते । रक्तानां भवपादाब्जे रुद्रलोकप्रदायिने
    ॥ १५८॥ नमः सेनाधिपतये रुद्राणां पतेय नमः । भूतानां भुवनेशानां पतये पापहारिणे ॥ १५९॥ रुद्राय रुद्रपतये
    रौद्रपापहराय ते । नमः शिवाय सौम्याय रुद्रभक्ताय ते नमः ॥ १६०॥ इति श्रीलिङ्गमहापुराणे पूर्वभागे एकसप्ततितमाध्यायान्तर्गतं
    देवैः कृतं गणनाथस्तोत्रं समाप्तम् । लिङ्गपुराण । पूर्वभाग । अध्याय ७१
