id: shivavaidikashodacopacarapuja
category: veda
name:
  english: shivavaidikashodacopacarapuja
  devanagari: शिववैदिकषोडचोपचारपूजा
content:
  english: dhyayennityam mahesham rajatagirinibham carucandravatamsam ratnakalpojjcalangam parashumrigavarabhitihastam
    prasannam | padmasinam samantat stutamamaraganairvyaghrakrittim vasanam vishvadyam vishvabijam nikhilabhayaharam
    pancavaktram trinetram || om nama̭ste rudra ma̱nyava̭ u̱tota̱ isha̭ve̱ nama̭h | nama̭ste astu̱ dhanva̭ne
    ba̱hubhya̭mu̱ta te̱ nama̭h || 2 asanam
  devanagari: ध्यायेन्नित्यं महेशं रजतगिरिनिभं चारुचन्द्रावतंसं रत्नाकल्पोज्ज्चलाङ्गं परशुमृगवराभीतिहस्तं
    प्रसन्नम् । पद्मासीनं समन्तात् स्तुतममरगणैर्व्याघ्रकृत्तिं वसानं विश्वाद्यं विश्वबीजं निखिलभयहरं पञ्चवक्त्रं
    त्रिनेत्रम् ॥ ॐ नम॑स्ते रुद्र म॒न्यव॑ उ॒तोत॒ इष॑वे॒ नमः॑ । नम॑स्ते अस्तु॒ धन्व॑ने बा॒हुभ्या॑मु॒त ते॒
    नमः॑ ॥ २ आसनम्
meaning: {}
