id: chandogya
category: upanishad
name:
  english: chandogya
  devanagari: छान्दोग्य
content:
  english: chandogyopanishat || atha chandogyopanishat || om apyayantu mamangani vakpranashcakshuh shrotramatho
    balamindriyani ca sarvani | sarvam brahmaupanishadam maham brahma nirakuryam ma ma brahma nirakarodanirakaranamastvanirakaranam
    me'stu | tadatmani nirate ya upanishatsu dharmaste mayi santu te mayi santu || || om shantih shantih
    shantih || || prathamo'dhyayah || omityetadaksharamudgithamupasita | omiti hyudgayati tasyopavyakhyanam
    || 1
  devanagari: छान्दोग्योपनिषत् ॥ अथ छान्दोग्योपनिषत् ॥ ॐ आप्यायन्तु ममाङ्गानि वाक्प्राणश्चक्षुः श्रोत्रमथो
    बलमिन्द्रियाणि च सर्वाणि । सर्वं ब्रह्मौपनिषदं माहं ब्रह्म निराकुर्यां मा मा ब्रह्म निराकरोदनिराकरणमस्त्वनिराकरणं
    मेऽस्तु । तदात्मनि निरते य उपनिषत्सु धर्मास्ते मयि सन्तु ते मयि सन्तु ॥ ॥ ॐ शान्तिः शान्तिः शान्तिः
    ॥ ॥ प्रथमोऽध्यायः ॥ ओमित्येतदक्षरमुद्गीथमुपासीत । ओमिति ह्युद्गायति तस्योपव्याख्यानम् ॥ १
meaning: {}
