id: kyts-4-7-agnavishnoo-sajoshasemaa-vardhantu-krishna-yajurveda-taittiriya-samhita-patha
category: stotram
name:
  english: KYTS 4.7 Agnavishnoo Sajoshasemaa Vardhantu - Krishna Yajurveda Taittiriya Samhita Patha
content:
  english: krishna yajurvediya taittiriya samhitaya ncaturthakande saptamah prashnah vasordharadishishta
    samskarabhidhanam o shri gurubhyo namah | harih om || agnavishnu sajoshasema vardhantu va ngirah |
    dyunaimrvajebhira gatam || vajashca me prasavashca me prayatishca me prasitishca me dhitishca me kratushca
    me svarashca me shlokashca me shravashca me shrutishca me jyotishca me suvashca me pranashca me 'pana
    pranashca me 'panah ca me vyanashca me 'sushca me shca me vyanashca me 'sushca me citta nca me vakca
    me manashca me cakshushca me shrotra nca me dakshashca me bala nca ma ojashca me sahashca ma ayushca
    me jara ca ma atma ca me tanushca me sharma ca me varma ca me 'ngani ca me 'sthani ca me parugmshi
    ca me sharirani ca me || nca me manyushca me bhamashca me 'mashca me 'bhamshca me jema ca me mahima
    ca me varima ca me prathima ca me var shma ca me draghuya ca me vriddha nca me vriddhishca me satya
    nca me shraddha ca me jagacca nca me vashashca me tvishishca me krida ca me modashca me jata nca me
    bhutanca me bhavishyacca me suga nca ma riddhi shca me klipta nca me kliptishca me matishca me sumatishca
    me || nca me mayashca me priya nca me 'nukamashca me kamashca me saumanasashca me bhadra nca me shreyashca
    me vasyashca me yashashca me bhagashca me dravina nca me yanta ca me dharta ca mekshemashca me dhritishca
    me vishva vi~cca me jnatra nca me sushca me prasushca me sira nca me layashca ma rita nca me 'namayacca
    me jivatushca me dirghayutva nca me susha ca me sudina urkca me sunrita ca me payashca me rasashca
    me ghrita nca me madhu ca me sagdhishca me sapitishca me krishishca me vrishtishca me jaitra nca me
    rayishca me rayashca me pushta nca me pushtishca me vibhu ca me prabhu ca me bahu ca me bhuyashca
    me purna nca me 'kshitishca me kuyavashca me nca me 'kshucca me vrihayashca me yava shca me mudgashca
    me khalva shca me priyangavashca me 'navashca me shyamaka ashma ca me mrittika ca me girayashca me
    parvatashca me sikatashca me vanaspatayashca me hiranya nca me 'yashca me sisa nca me trapushca me
    shyama 'gnishca ma apashca mevirudhashca ma oshadhayashca me krishtapacya nca me grmayashca me pashava
    aranyashca yajnena kalpantam ~vitta nca me vittishca me bhuta nca me bhutishca me vasu ca me vasatishca
    me karma ca me shaktishca me 'rthashca ma emashca ma itishca me gatishca me || 'shtacatvarigmshacca
    agnishca ma indrashca me somashca ma indrashca me savita ca ma indrashca me sarasvati ca ma indrashca
    me pusha ca ma indrashca me brihaspatishca ma indrashca me mitrashca ma indrashca me varunashca ma
    indrashca me tvashta ca ma indrashca me dhata ca ma indrashca me vishnushca ma indrashca me 'shvinau
    ca ma indrashca me marutashca ma indrashca me vishve ca me deva indrashca me prithivi ca ma indrashca
    me nca ma indrashca me dyaushca ma indrashca me dishashca ma indrashca me murdha ca ma indrashca me
    prajapatishca ma indrashca me || agmshushca me rashmishca me 'da 'dhipatishca ma upagmshushca me 'ntaryamashca
    ma aindravayavashca me maitravarunashca ma ashvinashca me pratiprasthanashca me shukrashca me manthi
    ca ma agrayanashca me vaishvadevashca me dhruvashca me vaishvanarashca ma ritugrahashca shca ma aindragnashca
    me vaishvadevashca me marutvatiya shca me mahendrashca ma adityashca me savitrashca me sarasvatashca
    me paushnashca me patnivatashca me hariyojanashca me || iddhmashca me barhishca me vedishca me dhishniyashca
    me srucashca me camasashca me gravanashca me svaravashca ma uparavashca me 'dhishavane ca me dronakalashashca
    me vayavyani ca me putabhricca ma adhavaniyashca ma agni nca me grihashca me sadashca me purodasha
    'vabhrithashca me svagakarashca me || agnishca me gharmashca me 'rkashca me suryashca me pranashca
    me 'shvamedhashca me prithivi ca me 'ditishca me ditishca me dyaushca me shakvarirangulayo dishashca
    me yajnena kalpanta mrikca me sama ca me stomashca me yajushca me diksha ca me tapashca ma ritushca
    me vrata rvrishtya brihadrathantare ca me yajnena kalpetam || shca me vathsashca me tryavishca me
    tryavi ca me dityavat ca me dityauhi ca me pancavishca me pancavi ca me trivathsashca me trivathsa
    ca me turyavat ca me turyauhi ca me pashthavacca me pashthauhi ca ma uksha ca me vasha ca ma rishabhashca
    me vehacca me 'nadvan ca me dhenushca ma ayuryajnena kalpata mprano yajnena kalpata mapano yajnena
    kalpatam vya~no yajnena kalpata ryajnena kalpatag shrotram mmano yajnena kalpatam ~vag yajnena kalpata
    matma yajnena kalpatam ya~jno yajnena kalpatam || eka ca me tisrashca me panca ca me sapta ca me nava
    ca ma ekadasha ca me trayodasha ca me pancadasha ca me saptadasha ca me navadasha ca ma ekavigmshatishca
    me trayovigmshatishca me pancavigmshatishca me saptavigmshatishca me navavigmshatishca ma ekatrigmshacca
    me trayastrigmshacca me catasrashca me 'shtau ca me dvadasha ca me shodasha ca me vigmshatishca me
    caturvigmshatishca me 'shtavigmshatishca me dvatrigmshacca me shat trigmshacca me catvarigmshacca
    me catushcatvarigmshacca me 'shtacatvarigmshacca me vajashca prasavashca pijashca kratushca suvashca
    murdha ca vyashniyashca ntyashca bhauvanashca bhuvanashca ssapta pradishashcatasro va paravatah |
    vajo no vishvai rdhanasatavihavatu || vishve adya maruto vishva uti vishve bhavantvagnaya ssamiddhah
    | vishve no deva avasa '' gamantu vishvamastu dravinam va~jo asme || vajasya prasava | agnirindro
    brihaspatirmaruta ssomapitaye || vajevaje 'vata vajino no dhaneshu vipra amrita ritajnah | vipra amrita
    ritajnah | asya maddhvah pibata madayaddhva ntripta yata pathibhirdevayanaih || vajah purastaduta
    maddhyato no vajo devagm ritubhih kalpayati | vajasya hi prasavo nannamiti vishva asha vajapatirbhaveyam
    || payah prithivya mpaya oshadhishu payo divyantarikshe payo dham | payasvatih pradishah santu mahya
    mma srijami payasa ghritena sa va~jagm saneyamagne || naktoshasa samanasa virupe dhapayete shishumekagm
    samici | dyava kshama rukmo antarvi bhati deva agni ndravinodah || samudro 'si nabhasvanardradanu
    shshabhumrmayobhurabhi ma vahi svaha maruto shshabhumrmayobhurabhi ma vahi svaha 'vasyurasi duvasvanchabhumrmayobhurabhi
    ma vahi svaha duvasvanchabhumrmayobhurabha ma yu~najmi shavasa ghritena divyagm suparnam mpatema braddhnasya
    vishtapagm suvo ruhana adhi naka uttame || imau te pakshavajarau patatrino yabhyagm rakshag mpatema
    sukritamu lokam shayah prathamaja ye puranah || cidasi samudrayonirindurdakshah shyena ritava a nishattah
    || namaste astu ma ma higmsirvishvasya murdhannadhi tishthasi shritah | samudre te hridaya rdyavaprithivi
    bhuvaneshvarpite || udno dattodadhi mbhintta divah parjanyadantariksha tprithivyastato no vrishtyavata
    | divo murdha 'si prithivya nabhirurgapamoshadhinam | vishvayu shsharma sapratha namaspathe || yenar
    masatendhana agnigm suvarabharantah | tasminnaha nni dadhe nake agnimetam ya~mahurmanava stirnabar
    mpatnibhiranu gacchema devah putrairbhratribhiruta va hiranyaih | naka ssukritasya loke tritiye prishthe
    adhi rocane divah || a vaco maddhya ssatpatishcekitanah | prishthe prithivya nihito davidyuta ye pritanyavah
    || ayamagnirviratamo vayodha ssahasriyo dipyatamaprayucchann | vibhrajamana ssarirasya maddhya upa
    pra yata divyani dhama || sa mpra cyavaddhvamanu sa mpra yatagne patho devayana n krinuddhvam | asmin
    thsadhasthe addhyuttarasmin vishve deva yajamanashca sidata || yena sahasram gne sarvavedasam | tenemam
    nno vaha devayano ya dbuddhyasvagne prati jagrihyena mishtapurte sagm srijethamaya nca | punah krinvagg
    ttvayi tantumetam || aya ritviyo yato jato arocathah | ta njanannagna a rohatha no vardhaya rayim
    || gne varco vihaveshvastu vaya ntvendhana stanuva mpradishashcatasra stvaya 'ddhyakshena pritana
    jayema || mama deva vihave santu sarva indravanto maruto vishnuragnih | mamantariksha muru gopamastu
    mahyam nkame asminn || mayi deva dravina mayajanta mmayya shirastu mayi devahutih | daivya hotara
    vanishanta ssyama tanuva suvirah ya~jantu mama yani havya ssatya manaso me astu | eno maniga vi~shve
    devaso adhivoca ta me || devi shshadurvirurunah krinota vishve deva sa iha virayaddhvam | maha smahi
    prajaya ma tanubhirma radhama dvishate soma rajann || agnirmanyu dadabdho gopah paripahi nastvam |
    pratyanco yantu nigutah punaste 'maisha mprabudha vineshat || dhata dhatrina mbhuvanasya yaspati rdevagm
    savitaramabhi matishaha ya~jna mashvinobha brihaspati rdevah pa nnyarthat || uruvyaca no mahisha shsharma
    yagm sadasmin have puruhutah purukshu | sa nah prajayai haryashva mridayendra ma no ririsho ma para
    dah | no ririsho ma para dah || ye nah sapatna apate bhavantvindra gnibhyamava badhamahe tan | vasavo
    rudra aditya upari sprisha ncettaramadhi rajamakrann || arvanca mindramamuto havamahe yo goji jidyah
    | imanno yajnam vi~have jushasvasya kurmo harivo medina agnermanve prathamasya pracetaso ya vi~shi
    pravivishivagm samimahe sa no muncatvagm hasah || yasyeda dyadejati yasya jata nca kevalam | staumyagni
    nnathito johavimi sa no muncatvagm hasah || indrasya manye prathamasya pracetaso vritraghna sstoma
    upa mamupaguh | yo dashushah sukrito havamupa ganta sa no muncatvagm hasah | sa no muncatvagm hasah
    || ya va~shi yudhe yah pushtani sagmsrijati trayani | staumindra nnathito johavimi sa no muncatvagm
    hasah || manve va mmitra varuna tasya vittagm satyaujasa drigmhana ya | ya rajanagm saratham ya~tha
    ugra ta no muncatamagasah || yo vagm ratha rijurashmi ssatyadharma mithu shcaranta mupayati dushayann
    | staumi mitravaruna nathito johavimi tau no muncatamagasah || vayo ssavitu rvidathani manmahe yava
    dbibhrito yau ca rakshatah | yau vishvasya paribhu babhuvatustau no muncatamagasah || upa shreshthana
    ashisho devayordharme asthirann | staumi vayugm savitara nnathito johavimi tau no muncatamagasah ||
    rathitamau rathinamahva utaye shubha ngamishthau suyamebhirashvaih mojastau no muncatamagasah || yadayatam
    stricakrena sagm sadamicchamanau | staumi deva vashvinau nathito johavimi tau no muncatamagasah ||
    maruta mmanve adhino bruvantu premam vi~shva mavantu vishve huve suyamanutaye te no muncantvenasah
    || tigmamayudham pritanasu jishnu | staumi deva nmaruto nathito johavimi te no muncantvenasah || devana
    mmanve adhi no bruvantu premam vi~shvamavantu vishve huve suyamanutaye te no muncantvenasah || yadida
    'bhishocati paurusheyena daivyena | staumi vishva nnathito johavimi te no muncantvenasah || anuno
    nvidanumate tvam ~vai shvanaro na utyaprishto divi mamitebhi rojobhi rye pratishthe abhavatam va~sunam
    | staumi dyava prithivi nathito johavimi te no muncatamagm hasah || urvi rodasi varivah krinota nkshetrasya
    patni adhi no bruyatam | staumi dyava prithivi nathito johavimi te no muncatamagm hasah || ya mpurushatra
    yavishtha vidvagmsashcakrima kaccana ''gah | kridhi svasmagm aditeranaga vyenagmsi shishratho vishvagagne
    || yatha ha ta tpadishita mamuncata yajatrah | eva tvamasma tpramunca vyagmhah prata ryagne prataranna
    ayuh || ngramamindragm sa no muncatvagm hasah | manve vanta no muncatamagasah | yo vam tau no muncatamagasah
    | maruta te no muncantvenasah | anu na te no muncatamagmhaso yattai shshadagasashcaturenaso dviragmhasah
    | || harih om || || krishna yajurvediya taittiriya samhitaya ncaturthakande saptamah prashna
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय संहिताया ञ्चतुर्थकाण्डे सप्तमः प्रश्नः वसोर्धारादिशिष्ट संस्काराभिधानं
    ओ श्री गुरुभ्यो नमः । ह॒रिः॒ ओम् ॥ अग्ना॑विष्णू स॒जोष॑से॒मा व॑र्धन्तु वा॒ ङ्गिरः॑ । द्यु॒नैंर्वाजे॑भि॒रा
    ग॑तम् ॥ वाज॑श्च मे प्रस॒वश्च॑ मे॒ प्रय॑तिश्च मे॒ प्रसि॑तिश्च मे धी॒तिश्च॑ मे॒ क्रतु॑श्च मे॒ स्वर॑श्च
    मे॒ श्लोक॑श्च मे श्रा॒वश्च॑ मे॒ श्रुति॑श्च मे॒ ज्योति॑श्च मे॒ सुव॑श्च मे प्रा॒णश्च॑ मे ऽपा॒न प्रा॒णश्च॑
    मे ऽपा॒नः च॒ मे॒ व्या॒नश्च॒ मे ऽसु॑श्च मे श्च॑ मे व्या॒नश्च॒ मे ऽसु॑श्च मे चि॒त्त ञ्च मे॒ वाक्च॑ मे॒
    मन॑श्च मे॒ चक्षु॑श्च मे॒ श्रोत्र॑ ञ्च मे॒ दक्ष॑श्च मे॒ बल॑ ञ्च म॒ ओज॑श्च मे॒ सह॑श्च म॒ आयु॑श्च मे
    ज॒रा च॑ म आ॒त्मा च॑ मे त॒नूश्च॑ मे॒ शर्म॑ च मे॒ वर्म॑ च॒ मे ऽङ्गा॑नि च मे॒ ऽस्थानि॑ च मे॒ परूग्ं॑षि
    च मे॒ शरी॑राणि च मे ॥ ञ्च मे म॒न्युश्च॑ मे॒ भाम॑श्च॒ मे ऽम॑श्च॒ मे ऽभं॑श्च मे जे॒मा च॑ मे महि॒मा च॑
    मे वरि॒मा च॑ मे प्रथि॒मा च॑ मे व॒र् ष्मा च॑ मे द्राघु॒या च॑ मे वृ॒द्ध ञ्च॑ मे॒ वृद्धि॑श्च मे स॒त्य
    ञ्च॑ मे श्र॒द्धा च॑ मे॒ जग॑च्च ञ्च मे॒ वश॑श्च मे॒ त्विषि॑श्च मे क्री॒डा च॑ मे॒ मोद॑श्च मे जा॒त ञ्च
    मे भू॒तञ्च॑ मे भवि॒ष्यच्च॑ मे सु॒ग ञ्च॑ म॒ ऋद्धि॑ श्च मे कॢ॒प्त ञ्च॑ मे॒ कॢप्ति॑श्च मे म॒तिश्च॑ मे
    सुम॒तिश्च॑ मे ॥ ञ्च॑ मे॒ मय॑श्च मे प्रि॒य ञ्च॑ मे ऽनुका॒मश्च॑ मे॒ काम॑श्च मे सौमन॒सश्च॑ मे भ॒द्र ञ्च॑
    मे॒ श्रेय॑श्च मे॒ वस्य॑श्च मे॒ यश॑श्च मे॒ भग॑श्च मे॒ द्रवि॑ण ञ्च मे य॒न्ता च॑ मे ध॒र्ता च॑ मे॒क्षेम॑श्च
    मे॒ धृति॑श्च मे॒ विश्व॑ विँच्च॑ मे॒ ज्ञात्र॑ ञ्च मे॒ सूश्च॑ मे प्र॒सूश्च॑ मे॒ सीर॑ ञ्च मे ल॒यश्च॑
    म ऋ॒त ञ्च॒ मे ऽना॑मयच्च मे जी॒वातु॑श्च मे दीर्घायु॒त्व ञ्च मे सू॒षा च॑ मे सु॒दिन॑ ऊर्क्च॑ मे सू॒नृता॑
    च मे॒ पय॑श्च मे॒ रस॑श्च मे घृ॒त ञ्च॑ मे॒ मधु॑ च मे॒ सग्धि॑श्च मे॒ सपी॑तिश्च मे कृ॒षिश्च॑ मे॒ वृष्टि॑श्च
    मे॒ जैत्र॑ ञ्च मे र॒यिश्च॑ मे॒ राय॑श्च मे पु॒ष्ट ञ्च॑ मे॒ पुष्टि॑श्च मे वि॒भु च॑ मे प्र॒भु च॑ मे ब॒हु
    च॑ मे॒ भूय॑श्च मे पू॒र्ण ञ्च॒ मे ऽक्षि॑तिश्च मे॒ कूय॑वाश्च॒ मे ञ्च॒ मे ऽक्षु॑च्च मे व्री॒हय॑श्च मे॒
    यवा श्च मे मु॒द्गाश्च॑ मे ख॒ल्वा श्च मे प्रि॒यङ्ग॑वश्च॒ मे ऽण॑वश्च मे श्या॒माका अश्मा॑ च मे॒ मृत्ति॑का
    च मे गि॒रय॑श्च मे॒ पर्व॑ताश्च मे॒ सिक॑ताश्च मे॒ वन॒स्पत॑यश्च मे॒ हिर॑ण्य ञ्च॒ मे ऽय॑श्च मे॒ सीस॑ ञ्च
    मे॒ त्रपु॑श्च मे श्या॒म ऽग्निश्च॑ म॒ आप॑श्च मेवी॒रुध॑श्च म॒ ओष॑धयश्च मे कृष्टप॒च्य ञ्च॑ मे ग्र्मा॒याश्च॑
    मे प॒शव॑ आर॒ण्याश्च॑ य॒ज्ञेन॑ कल्पन्तां ँवि॒त्त ञ्च॑ मे॒ वित्ति॑श्च मे भू॒त ञ्च॑ मे॒ भूति॑श्च मे॒
    वसु॑ च मे वस॒तिश्च॑ मे॒ कर्म॑ च मे॒ शक्ति॑श्च॒ मे ऽर्थ॑श्च म॒ एम॑श्च म॒ इति॑श्च मे॒ गति॑श्च मे ॥ ऽष्टाच॑त्वारिग्ंशच्च
    अ॒ग्निश्च॑ म॒ इन्द्र॑श्च मे॒ सोम॑श्च म॒ इन्द्र॑श्च मे सवि॒ता च॑ म॒ इन्द्र॑श्च मे॒ सर॑स्वती च म॒ इन्द्र॑श्च
    मे पू॒षा च॑ म॒ इन्द्र॑श्च मे॒ बृह॒स्पति॑श्च म॒ इन्द्र॑श्च मे मि॒त्रश्च॑ म॒ इन्द्र॑श्च मे॒ वरु॑णश्च
