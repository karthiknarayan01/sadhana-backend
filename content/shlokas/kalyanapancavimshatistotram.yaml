id: kalyanapancavimshatistotram
category: stotram
name:
  english: kalyanapancavimshatistotram
  devanagari: कल्याणपन्चविंशतिस्तोत्रम्
content:
  english: jhatiti tam sthapayamasa vasam | gandhesho vitarago'bhavadakhilasuhrillokanathagratasthah kalyanam
    vah kriyasuh kvacidapi saratam tishthatam naumyaham tah || 13|| shankham dadhmau saharshah smaradamitasutam
    vikramat praptasiddhih yasmallokeshvarajnavinihitaharayah pradurasit khagarbhah | yah svasham sthapayitva
    nijapuramagamad vikrameshabhidhanam kalyanam vah kriyasuh kvacidapi saratam tishthatam naumyaham tah
    || 14|| nagastarkshyena yasmadalabhadanusukham punyanama sutirthah parvatya yatra tepe kalahanivasane
    shantatirthah prashantah | taptam rudrena durgabhilashitamanasa shankarakhyastrivenah kalyanam vah
    kriyasuh kvacidapi saratam tishthatam naumyaham tah || 15|| tirtho rajabhidhano yadalabhadavanipalarajyam
    virupo vyadhashcaitashca yasmat surapatisadanam pragamat kamatirthah | vajracaryena pashyam yadabhishavakritah
    sangamo nirmalakhyah kalyanam vah kriyasuh kvacidapi saratam tishthatam naumyaham tah || 16|| dinairaptam
    nidhanam yadapacitiparairakarakhyo hi tirtho jnairlabdham jnanamasmad yadudakamatibhirjnanasamjnaikatirthah
    | cintamanyakhyatirthabhidhavadabhishavairyatra prapto'bhilashah kalyanam vah kriyasuh kvacidapi saratam
    tishthatam naumyaham tah || 17|| yatra snatairmudaptetisamabhidhamabhud yashca pramodatirthah pradat
    sallakshanam yah svapayasi saratam tirthasallakshanakhyah | yatra snatva balakhyah surapatirajayad
    dvipamakhyambhatirthah kalyanam vah kriyasuh kvacidapi saratam tishthatam naumyaham tah || 18|| vidyadharyakhyadevi
    gaganapathagata yogini vajrapurva haritah shrihanuman saganapatimahakalacudakhyavandyah | brahmanyadyashca
    devyah saharisukhavaraksharanaskandayuktah kalyanam vah kriyasuh kvacidapi saratam tishthatam naumyaham
    tah || 19|| vagmatya mulapucchaprabhritaya upatirthastatha keshacaityah shankhoccasthashca jatoccayagirilalitashcaityabhattarako'sau
    | phullocco drashtadevi tadanu bhagavatidhyanaproccadisamsthah kalyanam vah kriyasuh kvacidapi saratam
    tishthatam naumyaham tah || 20|| manjushriparvatastho'nucaraviracito manjushobhakhyacaityah shantashrinirmiteshu
    prakritavasatayah pancadevapureshu | pucchagrashcaityavaryo'bhyakathadanupamam yatra shaketpurasham
    kalyanam vah kriyasuh kvacidapi saratam tishthatam naumyaham tah || 21|| adharakhyo hridisthah saganaphanipatirvighnarajantakashca
    nagashcanandaloke harihariharivahakhyatrailokyavamshe | lokeshayakshamatvastadanu saphalayashabhilokaikanathah
    kalyanam vah kriyasuh kvacidapi saratam tishthatam naumyaham tah || 22|| hevajrah samvaro'sau saparijanaganashcandavirastriloki
    viro yogambaro'sau yamanidhanakaradya dashakrodha
  devanagari: झटिति तं स्थापयामास वासम् । गन्धेशो वीतरागोऽभवदखिलसुहृल्लोकनाथाग्रतस्थः कल्याणं वः क्रियासुः
    क्वचिदपि सरतां तिष्ठतां नौम्यहं ताः ॥ १३॥ शङ्खं दध्मौ सहर्षः स्मरदमितसुतं विक्रमात् प्राप्तसिद्धिः
    यस्माल्लोकेश्वराज्ञाविनिहितहरयः प्रादुरासीत् खगर्भः । यः स्वाशं स्थापयित्वा निजपुरमगमद् विक्रमेशाभिधानं
    कल्याणं वः क्रियासुः क्वचिदपि सरतां तिष्ठतां नौम्यहं ताः ॥ १४॥ नागस्तार्क्ष्येण यस्मादलभदनुसुखं पुण्यनामा
    सुतीर्थः पार्वत्या यत्र तेपे कलहनिवसने शान्ततीर्थः प्रशान्तः । तप्तं रुद्रेण दुर्गाभिलषितमनसा शङ्कराख्यस्त्रिवेणः
    कल्याणं वः क्रियासुः क्वचिदपि सरतां तिष्ठतां नौम्यहं ताः ॥ १५॥ तीर्थो राजाभिधानो यदलभदवनीपालराज्यं
    विरूपो व्याधश्चैतश्च यस्मात् सुरपतिसदनं प्रागमत् कामतीर्थः । वज्राचार्येण पश्यं यदभिषवकृतः सङ्गमो
    निर्मलाख्यः कल्याणं वः क्रियासुः क्वचिदपि सरतां तिष्ठतां नौम्यहं ताः ॥ १६॥ दीनैराप्तं निधानं यदपचितिपरैराकराख्यो
    हि तीर्थो ज्ञैर्लब्धं ज्ञानमस्माद् यदुदकमतिभिर्ज्ञानसंज्ञैकतीर्थः । चिन्तामण्याख्यतीर्थाभिधवदभिषवैर्यत्र
    प्राप्तोऽभिलाषः कल्याणं वः क्रियासुः क्वचिदपि सरतां तिष्ठतां नौम्यहं ताः ॥ १७॥ यत्र स्नातैर्मुदाप्तेतिसमभिधमभूद्
    यश्च प्रामोदतीर्थः प्रादात् सल्लक्षणं यः स्वपयसि सरतां तीर्थसल्लक्षणाख्यः । यत्र स्नात्वा बलाख्यः
    सुरपतिरजयद् द्वीपमाख्यम्भतीर्थः कल्याणं वः क्रियासुः क्वचिदपि सरतां तिष्ठातां नौम्यहं ताः ॥ १८॥ विद्याधर्याख्यदेवी
    गगनपथगता योगिनी वज्रपूर्वा हारीतः श्रीहनूमान् सगणपतिमहाकालचूडाख्यवन्द्याः । ब्रह्माण्याद्याश्च देव्यः
    सहरिसुखवरक्षारनास्कन्दयुक्ताः कल्याणं वः क्रियासुः क्वचिदपि सरतां तिष्ठतां नौम्यहं ताः ॥ १९॥ वाग्मत्या
    मूलपुच्छप्रभृतय उपतीर्थास्तथा केशचैत्याः शङ्खोच्चस्थाश्च जातोच्चयगिरिललितश्चैत्यभट्टारकोऽसौ । फुल्लोच्चो
    द्रष्टदेवी तदनु भगवतीध्यानप्रोच्चादिसंस्थाः कल्याणं वः क्रियासुः क्वचिदपि सरतां तिष्ठतां नौम्यहं ताः
    ॥ २०॥ मञ्जुश्रीपर्वतस्थोऽनुचरविरचितो मञ्जुशोभाख्यचैत्यः शान्तश्रीनिर्मितेषु प्रकृतवसतयः पञ्चदेवापुरेषु
    । पुच्छाग्रश्चैत्यवर्योऽभ्यकथदनुपमं यत्र शाकेत्पुराशं कल्याणं वः क्रियासुः क्वचिदपि सरतां तिष्ठतां
    नौम्यहं ताः ॥ २१॥ आधाराख्यो हृदिस्थः सगणफणिपतिर्विघ्नराजान्तकश्च नागश्चानन्दलोके हरिहरिहरिवाहाख्यत्रैलोक्यवंशे
    । लोकेशायाक्षमत्वस्तदनु सफलयाशाभिलोकैकनाथः कल्याणं वः क्रियासुः क्वचिदपि सरतां तिष्ठतां नौम्यहं ताः
    ॥ २२॥ हेवज्रः संवरोऽसौ सपरिजनगणश्चण्डवीरस्त्रिलोकी वीरो योगाम्बरोऽसौ यमनिधनकराद्या दशक्रोढ
