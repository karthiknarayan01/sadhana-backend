id: vatukopanishat
category: upanishad
name:
  english: vatukopanishat
  devanagari: वटुकोपनिषत्
content:
  english: vatukopanishat atha vatukopanishadam vyakhyasyamah | valagramatram hridayasya madhye vishvam
    deva jatarupam varenyam | tamatmastham ye'nupashyanti dhirastesham shantirbhavita netaresham yo vai
    vatukah sa bhagavan yashca brahma tasmai vai namo namah | yo vai vatukah sa bhagavan yashca vipnustasmai
    vai namo namah || yo vai vatukah sa bhagavan yashca rudrastasmai vai namo namah | yo vai vatukah sa
    bhagavan yashcendrastasmai vai namo namah || yo vai vatukah sa bhagavan yashcagnistasmai vai namo
    namah | yo vai vatukah sa bhagavan yashca vayustasmai vai namo namah || yo vai vatukah sa bhagavan
    yashca suryastasmai vai namo namah | yo vai vatukah sa bhagavan yashca somastasmai vai namo namah
    || yo vai vatukah sa bhagavan yashca grahastasmai vai namo namah | yo vai vatukah sa bhagavan yashcopagrahastasmai
    vai namo namah || yo vai vatukah sa bhagavan yashca bhustasmai vai namo namah | yo vai vatukah sa
    bhagavan yashca bhuvastasmai vai namo namah || yo vai vatukah sa bhagavan yashca svastasmai vai namo
    namah | yo vai vatukah sa bhagavan yashcantariksham tasmai vai namo namah | yo vai vatukah sa bhagavan
    yashca dyaustasmai vai namo namah | yo vai vatukah sa bhagavan yashcapastasmai vai namo namah || yo
    vai vatukah sa bhagavan yashca tejastasmai vai namo namah | yo vai vatukah sa bhagavan yashca kalastasmai
    vai namo namah || yo vai vatukah sa bhagavan yashca mrityustasmai vai namo namah | yo vai vatukah
    sa bhagavan yashcamrityustasmai vai namo namah || yo vai vatukah sa bhagavan yashcakashastasmai vai
    namo namah | yo vai vatukah sa bhagavan yashca vishvam tasmai vai namo namah || yo vai vatukah sa
    bhagavan yashca shuklam tasmai vai namo namah | yo vai vatukah sa bhagavan yashca dambhastasmai vai
    namo namah || yo vai vatuka sa bhagavan yashcadambhastasmai vai namo namah | yo vai vatukah sa bhagavat
    yashca sukshmam tasmai vai namo namah || yo vai vatukah sa bhagavan yashca sthulam tasmai vai namo
    namah | yo vai vatukah sa bhagavan yashca krishnastasmai vai namo namah || yo vai vatukah sa bhagavan
    yashcakrishnastasmai vai namo namah | yo vai vatukah sa bhagavan yashca satyam tasmai vai namo namah
    | yo vai vatukah sa bhagavan yashca sarvam tasmai vai namo namah || bhuste adirmadhyam bhuvah svaste
    shirsham vishvarupo'si brahmaikastvam dvidha tridha buddhistvam shantistvam pushtistvam hutamahutam
    dattamadattam sarvamasarvam vishvamavishvam kritamakritam paramaparam parayanam ca tvam | apama somamamrita
    abhumaganma jyotiravidama devan | kim nunamasmankrinavadaratih kimu dhurtiramritam martyasya | somasuryapurastat
    sukshmah purushah | sarvam jagaddhitam va etadaksharam prajapatyam sukshmam saumyam purusham grahyamagrahyena
    bhavam bhavena saumyam saumyena sukshmam sukshmena vayavyam vayavyena grasati svena tejasa tasmadupasahartre
    mahagrasaya vai namo namah || hridistha devatah sarva hridi pranah pratishthitah | hridi tvamasi yo
    nityam tisro matrah parastu sah || tasyottaratah shiro dakshinatah padau ya uttaratah sa onkaro ya
    onkarah sa pranavo yah pranavah sa sarvavyapi yah sarvavyapi so'nanto yo'nantastattaram yattaram tatsukshmam
    yatsukshmam tacchuklam yacchuklam tadvaidyutam yadvaidyutam tatparam brahma yatparam brahma sa eko
    ya ekah sa rudro yo rudrah sa ishano ya ishanah sa bhagavan maheshvaro yo bhagavan maheshvarah sa
    bhagavan vatukeshvaro yo bhagavan vatukeshvarah || atha kasmaducyata onkaro yasmaduccaryamana eva
    prananurdhvamutkamayati tasmaducyata onkarah | atha kasmaducyate pranavo yasmaduccaryamana eva rigyajussamatharvangirasam
    brahma brahmanebhyah pranamayati namayati ca tasmaducyate pranavah | atha kasmaducyate sarvavyapi
    yasmaduccaryamana eva sarvan lokan vyapnoti sneho yatha palalapindamiva shantarupamotaprotamanuprapto
    vyatishaktashca tasmaducyate sarvavyapi | atha kasmaducyate'nanto yasmaduccaryamana eva tiryagurdhvamadhastaccasyanto
    nopalabhyate tasmaducyate'nantah | atha kasmaducyate taram yasmaduccaryamana eva garbhajanmavyadhijaramaranasamsaramahabhayattarayati
    trayate ca tasmaducyate taram | atha kasmaducyate sukshmam yasmaduccaryamana eva sukshmo bhutva shariranyadhitishthati
    sarvani canganyabhimrishati tasmaducyate sukshmam | atha kasmaducyate shuklam yasmaduccaryamana tava
    klandate klamayati ca tasmaducyate shuklam | atha kasmaducyate vaidyutam yasmaduccaryamana evavyakte
    mahati tamasi dyotayati tasmaducyate vaidyutam | atha kasmaducyate param brahma yasmat paramaparam
    parayanam ca brihadbrihatya brimhayati tasmaducyate param brahma | atha kasmaducyata eko yah sarvan
    pranan sambhakshya sambhakshanenajah samsrijati visrijati tirthameke vrajanti tirthameke dakshinah
    pratyanca udanca pranco'bhivrajantyeka tesham sarveshamiha sadgatih | sakam sa eko bhutashcarati prajanam
    tasmaducyata ekah | atha kasmaducyate rudro yasmadrishibhirnanyairbhaktairdrutamasya rupamupalabhyate
    tasmaducyate rudrah | atha kasmaducyata ishano yah sarvan devanishata ishanibhirjananibhishca paramashaktibhih
    | abhi tva shura nonumo'dugdha iva dhenavah | ishanamasya jagatah suvardrishamishanamindra tasthushah
    | tasmaducyata ishanah | atha kasmaducyate bhagavan maheshvaro yasmadbhakta jnanena bhajantyanugrihnati
    ca vacam samsrijati visrijati ca sarvan bhavan parityajyatmajnanena yogaishvaryena mahati mahiyate
    tasmaducyate bhagavan maheshvarah | atha kasmaducyate bhagavan vatukeshvaro yasmadantarjalaushadhivirudhanavishyemam
    vishvam bhuvanani va avate tasmaducyate bhagavan vatukeshvarah | tadetadrudracaritam || eko ha devah
    pradisho nu sarvah purvo ha jatah sa u garbhe antah | sa eva jatah sa janishyamanah pratyanjanastishthati
    sarvatomukhah || eko vatuko na dvitiyaya tasmai ya iman lokanishata ishanibhih | pratyanjanastishthati
    sancukocantakale samsrijya vishva bhuvanani gopta || yasmin krodham yam ca trishnam kshamam ca hyakshamam
    hitva hetujalasya mulam | buddhya sancitam sthapayitva tu rudre shashvata vai rudramekatvamahuh ||
    vatuko hi shashvatena puranena veshamurjena tapasa niyanta || agniriti bhasma vayuriti bhasma jalamiti
    bhasma sthalamiti bhasma vyometi bhasma sarvam ha vedam bhasma mana etani cakshashi yasmadvratamidam
    pashupatam yadbhasmanangani samsprishettasmadbrahma tadetadvatukam pashupashavimokshanaya || yasminnidam
    savarmotaprotam tasmadanyanna param kincanasti | na tasmat purvam na param tadasti na bhutam nota
    bhavyam yadasit || aksharajjayate kalah kaladvyapaka ucyate | vyapako hi bhagavan vatuko bhogayamano
    yada shete rudrastada samharate prajah | ucchvasite tamo bhavati tamasa apo'psvangulya mathite mathitam
    shishire shishiram mathyamanam phenam bhavati phenadandam bhavatyandadbrahma bhavati brahmano vayurvayoronkara
    onkaratsavitri savitrya gayatri gayatrya lokah bhavanti | etaddhi paramam tapah | apo jyoti raso'mritam
    brahma bhurbhuvahsvarom nama iti || ya imam vatukopanishadam brahmano'dhite'shrotriyah shrotriyo bhavati
    | anupanita upanito bhavati | sa hagniputo bhavati | sa vayuputo bhavati | sa suryaputo bhavati |
    sa somaputo bhavati | sa satyaputo bhavati | sa sarvaputo bhavati | sa sarvairdevarainujnato bhavati
    | sa sarvairvedairanudhyato bhavati | sa sarveshu tirtheshu snato bhavati | sa sarvavidbhavati | sa
    sarvayurarogyavan bhavati | sa kalajnani bhavati | sa gurvanugrahabhagi bhavati | ityevam bhagavadvatukeshvaram
    yah stauti sa vedyam vedeti ||
  devanagari: वटुकोपनिषत् अथ वटुकोपनिषदं व्याख्यास्यामः । वालाग्रमात्रं हृदयस्य मध्ये विश्वं देव जातरूपं
    वरेण्यम् । तमात्मस्थं येऽनुपश्यन्ति धीरास्तेषां शान्तिर्भविता नेतरेषां यो वै वटुकः स भगवान् यश्च ब्रह्मा
    तस्मै वै नमो नमः । यो वै वटुकः स भगवान् यश्च विप्णुस्तस्मै वै नमो नमः ॥ यो वै वटुकः स भगवान् यश्च
    रुद्रस्तस्मै वै नमो नमः । यो वै वटुकः स भगवान् यश्चेन्द्रस्तस्मै वै नमो नमः ॥ यो वै वटुकः स भगवान्
    यश्चाग्निस्तस्मै वै नमो नमः । यो वै वटुकः स भगवान् यश्च वायुस्तस्मै वै नमो नमः ॥ यो वै वटुकः स भगवान्
    यश्च सूर्यस्तस्मै वै नमो नमः । यो वै वटुकः स भगवान् यश्च सोमस्तस्मै वै नमो नमः ॥ यो वै वटुकः स भगवान्
    यश्च ग्रहास्तस्मै वै नमो नमः । यो वै वटुकः स भगवान् यश्चोपग्रहास्तस्मै वै नमो नमः ॥ यो वै वटुकः स
    भगवान् यश्च भूस्तस्मै वै नमो नमः । यो वै वटुकः स भगवान् यश्च भुवस्तस्मै वै नमो नमः ॥ यो वै वटुकः स
    भगवान् यश्च स्वस्तस्मै वै नमो नमः । यो वै वटुकः स भगवान् यश्चान्तरिक्षं तस्मै वै नमो नमः । यो वै वटुकः
    स भगवान् यश्च द्यौस्तस्मै वै नमो नमः । यो वै वटुकः स भगवान् यश्चापस्तस्मै वै नमो नमः ॥ यो वै वटुकः
    स भगवान् यश्च तेजस्तस्मै वै नमो नमः । यो वै वटुकः स भगवान् यश्च कालस्तस्मै वै नमो नमः ॥ यो वै वटुकः
    स भगवान् यश्च मृत्युस्तस्मै वै नमो नमः । यो वै वटुकः स भगवान् यश्चामृत्युस्तस्मै वै नमो नमः ॥ यो वै
    वटुकः स भगवान् यश्चाकाशस्तस्मै वै नमो नमः । यो वै वटुकः स भगवान् यश्च विश्वं तस्मै वै नमो नमः ॥ यो
    वै वटुकः स भगवान् यश्च शुक्लं तस्मै वै नमो नमः । यो वै वटुकः स भगवान् यश्च दम्भस्तस्मै वै नमो नमः
    ॥ यो वै वटुक स भगवान् यश्चादम्भस्तस्मै वै नमो नमः । यो वै वटुकः स भगवात् यश्च सूक्ष्मं तस्मै वै नमो
    नमः ॥ यो वै वटुकः स भगवान् यश्च स्थूलं तस्मै वै नमो नमः । यो वै वटुकः स भगवान् यश्च कृष्णस्तस्मै वै
    नमो नमः ॥ यो वै वटुकः स भगवान् यश्चाकृष्णस्तस्मै वै नमो नमः । यो वै वटुकः स भगवान् यश्च सत्यं तस्मै
    वै नमो नमः । यो वै वटुकः स भगवान् यश्च सर्वं तस्मै वै नमो नमः ॥ भूस्ते आदिर्मध्यं भुवः स्वस्ते शीर्षं
    विश्वरूपोऽसि ब्रह्मैकस्त्वं द्विधा त्रिधा बुद्धिस्त्वं शान्तिस्त्वं पुष्टिस्त्वं हुतमहुतं दत्तमदत्तं
    सर्वमसर्वं विश्वमविश्वं कृतमकृतं परमपरं परायणं च त्वम् । अपाम सोमममृता अभूमागन्म ज्योतिरविदाम देवान्
    । किं नूनमस्मान्कृणवदरातिः किमु धूर्तिरमृतं मर्त्यस्य । सोमसूर्यपुरस्तात् सूक्ष्मः पुरुषः । सर्वं
    जगद्धितं वा एतदक्षरं प्राजापत्यं सूक्ष्मं सौम्यं पुरुषं ग्राह्यमग्राह्येण भावं भावेन सौम्यं सौम्येन
    सूक्ष्मं सूक्ष्मेण वायव्यं वायव्येन ग्रसति स्वेन तेजसा तस्मादुपसहर्त्रे महाग्रासाय वै नमो नमः ॥ हृदिस्था
    देवताः सर्वा हृदि प्राणाः प्रतिष्ठिताः । हृदि त्वमसि यो नित्यं तिस्रो मात्राः परस्तु सः ॥ तस्योत्तरतः
    शिरो दक्षिणतः पादौ य उत्तरतः स ओङ्कारो य ओङ्कारः स प्रणवो यः प्रणवः स सर्वव्यापी यः सर्वव्यापी सोऽनन्तो
    योऽनन्तस्तत्तारं यत्तारं तत्सूक्ष्मं यत्सुक्ष्मं तच्छुक्लं यच्छुक्लं तद्वैद्युतं यद्वैद्युतं तत्परं
    ब्रह्म यत्परं ब्रह्म स एको य एकः स रुद्रो यो रुद्रः स ईशानो य ईशानः स भगवान् महेश्वरो यो भगवान् महेश्वरः
    स भगवान् वटुकेश्वरो यो भगवान् वटुकेश्वरः ॥ अथ कस्मादुच्यत ओङ्कारो यस्मादुच्चार्यमाण एव प्राणानूर्ध्वमुत्कामयति
    तस्मादुच्यत ओङ्कारः । अथ कस्मादुच्यते प्रणवो यस्मादुच्चार्यमाण एव ऋग्यजुस्सामाथर्वाङ्गिरसं ब्रह्म
    ब्राह्मणेभ्यः प्रणामयति नामयति च तस्मादुच्यते प्रणवः । अथ कस्मादुच्यते सर्वव्यापी यस्मादुच्चार्यमाण
    एव सर्वान् लोकान् व्याप्नोति स्नेहो यथा पललपिण्डमिव शान्तरूपमोतप्रोतमनुप्राप्तो व्यतिषक्तश्च तस्मादुच्यते
    सर्वव्यापी । अथ कस्मादुच्यतेऽनन्तो यस्मादुच्चार्यमाण एव तिर्यगूर्ध्वमधस्ताच्चास्यान्तो नोपलभ्यते तस्मादुच्यतेऽनन्तः
    । अथ कस्मादुच्यते तारं यस्मादुच्चार्यमाण एव गर्भजन्मव्याधिजरामरणसंसारमहाभयात्तारयति त्रायते च तस्मादुच्यते
    तारम् । अथ कस्मादुच्यते सूक्ष्मं यस्मादुच्चार्यमाण एव सूक्ष्मो भूत्वा शरीराण्यधितिष्ठति सर्वाणि चाङ्गान्यभिमृशति
    तस्मादुच्यते सूक्ष्मम् । अथ कस्मादुच्यते शुक्लं यस्मादुच्चार्यमाण तव क्लन्दते क्लामयति च तस्मादुच्यते
    शुक्लम् । अथ कस्मादुच्यते वैद्युतं यस्मादुच्चार्यमाण एवाव्यक्ते महति तमसि द्योतयति तस्मादुच्यते वैद्युतम्
    । अथ कस्मादुच्यते परं ब्रह्म यस्मात् परमपरं परायणं च बृहद्बृहत्या बृंहयति तस्मादुच्यते परं ब्रह्म
    । अथ कस्मादुच्यत एको यः सर्वान् प्राणान् सम्भक्ष्य सम्भक्षणेनाजः संसृजति विसृजति तीर्थमेके व्रजन्ति
    तीर्थमेके दक्षिणाः प्रत्यञ्च उदञ्च प्राञ्चोऽभिव्रजन्त्येक तेषां सर्वेषामिह सद्गतिः । साकं स एको भूतश्चरति
    प्रजानां तस्मादुच्यत एकः । अथ कस्मादुच्यते रुद्रो यस्मादृषिभिर्नान्यैर्भक्तैर्द्रुतमस्य रूपमुपलभ्यते
    तस्मादुच्यते रुद्रः । अथ कस्मादुच्यत ईशानो यः सर्वान् देवानीशत ईशानीभिर्जननीभिश्च परमशक्तिभिः । अभि
    त्वा शूर नोनुमोऽदुग्धा इव धेनवः । ईशानमस्य जगतः सुवर्दृशमीशानमिन्द्र तस्थुषः । तस्मादुच्यत ईशानः ।
    अथ कस्मादुच्यते भगवान् महेश्वरो यस्माद्भक्ता ज्ञानेन भजन्त्यनुगृह्णाति च वाचं संसृजति विसृजति च सर्वान्
    भावान् परित्यज्यात्मज्ञानेन योगैश्वर्येण महति महीयते तस्मादुच्यते भगवान् महेश्वरः । अथ कस्मादुच्यते
    भगवान् वटुकेश्वरो यस्मादन्तर्जलौषधिवीरुधानाविश्येमं विश्वं भुवनानि वा अवते तस्मादुच्यते भगवान् वटुकेश्वरः
    । तदेतद्रुद्रचरितम् ॥ एको ह देवः प्रदिशो नु सर्वाः पूर्वो ह जातः स उ गर्भे अन्तः । स एव जातः स जनिष्यमाणः
    प्रत्यङ्जनास्तिष्ठति सर्वतोमुखः ॥ एको वटुको न द्वितीयाय तस्मै य इमान् लोकानीशत ईशनीभिः । प्रत्यङ्जनास्तिष्ठति
    सञ्चुकोचान्तकाले संसृज्य विश्वा भुवनानि गोप्ता ॥ यस्मिन् क्रोधं यां च तृष्णां क्षमां च ह्यक्षमां हित्वा
    हेतुजालस्य मूलम् । बुद्ध्या सञ्चितं स्थापयित्वा तु रुद्रे शाश्वत वै रुद्रमेकत्वमाहुः ॥ वटुको हि शाश्वतेन
    पुराणेन वेषमूर्जेण तपसा नियन्ता ॥ अग्निरिति भस्म वायुरिति भस्म जलमिति भस्म स्थलमिति भस्म व्योमेति
    भस्म सर्वं ह वेदं भस्म मन एतानि चक्षषि यस्माद्व्रतमिदं पाशुपतं यद्भस्मनाङ्गानि संस्पृशेत्तस्माद्ब्रह्म
    तदेतद्वटुकं पशुपाशविमोक्षणाय ॥ यस्मिन्निदं सवर्मोतप्रोतं तस्मादन्यन्न परं किञ्चनास्ति । न तस्मात्
    पूर्वं न परं तदस्ति न भूतं नोत भव्यं यदासीत् ॥ अक्षराज्जायते कालः कालाद्व्यापक उच्यते । व्यापको हि
    भगवान् वटुको भोगायमानो यदा शेते रुद्रस्तदा संहरते प्रजाः । उच्छ्वासिते तमो भवति तमस आपोऽप्स्वङ्गुल्या
    मथिते मथितं शिशिरे शिशिरं मथ्यमानं फेनं भवति फेनादण्डं भवत्यण्डाद्ब्रह्मा भवति ब्रह्मणो वायुर्वायोरोङ्कार
    ओङ्कारात्सावित्री सावित्र्या गायत्री गायत्र्या लोकाः भवन्ति । एतद्धि परमं तपः । आपो ज्योती रसोऽमृतं
    ब्रह्म भूर्भुवःस्वरों नम इति ॥ य इमां वटुकोपनिषदं ब्राह्मणोऽधीतेऽश्रोत्रियः श्रोत्रियो भवति । अनुपनीत
    उपनीतो भवति । स हाग्निपूतो भवति । स वायुपूतो भवति । स सूर्यपूतो भवति । स सोमपूतो भवति । स सत्यपूतो
    भवति । स सर्वपूतो भवति । स सर्वैर्देवरैनुज्ञातो भवति । स सर्वैर्वेदैरनुध्यातो भवति । स सर्वेषु तीर्थेषु
    स्नातो भवति । स सर्वविद्भवति । स सर्वायुरारोग्यवान् भवति । स कालज्ञानी भवति । स गुर्वनुग्रहभागी भवति
    । इत्येवं भगवद्वटुकेश्वरं यः स्तौति स वेद्यं वेदेति ॥
