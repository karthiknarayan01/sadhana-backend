id: jalandharashtakam
category: stotram
name:
  english: jalandharashtakam
  devanagari: जलन्धराष्टकम्
content:
  english: nyonyaprabhashanabhayadbhavabhirnato'smi || 4|| tvatpadakalpatarumulanisevako'ham tapatrayena
    pihatah sharanagato'smi | krityatmanam ca sukriti nu kada bhaveyam shrinatha pahi bhagavan bhavabhirnato'smi
    || 5|| enamsi sarvani layam prayanti yannamakirteh purushasya nityam | vidyodaye bhrantirivarishatkam
    nivarayahim bhavabhirnato'smi || 6|| pura'sya sakshin bahavo'pi yogino gattah svarupam tvayi dharitasavah
    | bhavapravahe patitam tathapi mam samuddhara tam bhavabhirnato'smyaham || 7|| sarvadharamanarambham
    samam sarvatra vai sthitam | tam dhyatva mucyate turnam nanyaih krityaih kadacana || iti mano niveshya
    tvayi siddhimapnuyamiticchitam puraya me kila prabho | yapankajanghrim bhajatam vivekinam kuto nvarishtha
    bhavabhirnato'smyaham || 8|| yah shrinathajalandharashtakamidam bhaktya pathedanvahah so'rishtaricamupamurdhani
    padam nyasyatativarbhakah | vidvadbhih parisevitam pratidinam samyogamargeshubhih tacchrimangalamatanotvalamiti
    prantam gatam tatsatam || 9|| shrinathaya namah | shivaya namah || pratarutthaya yo bhaktya shrinathashtakamuttamam
    | pathedva sha
  devanagari: न्योन्यप्रभाषणभयाद्भवभीर्नतोऽस्मि ॥ ४॥ त्वत्पादकल्पतरुमूलनिसेवकोऽहं तापत्रयेण पिहतः शरणागतोऽस्मि
    । कृत्यात्मनां च सुकृती नु कदा भवेयं श्रीनाथ पाहि भगवन् भवभीर्नतोऽस्मि ॥ ५॥ एनांसि सर्वाणि लयं प्रयान्ति
    यन्नामकीर्तेः पुरुषस्य नित्यम् । विद्योदये भ्रान्तिरिवारिषट्कं निवारयाहिं भवभीर्नतोऽस्मि ॥ ६॥ पुराऽस्य
    साक्षिन् बहवोऽपि योगिनो गत्ताः स्वरूपं त्वयि धारितासवः । भवप्रवाहे पतितं तथापि मां समुद्धर तं भवभीर्नतोऽस्म्यहम्
    ॥ ७॥ सर्वाधारमनारम्भं समं सर्वत्र वै स्थितम् । तं ध्यात्वा मुच्यते तूर्णं नान्यैः कृत्यैः कदाचन ॥
    इति मनो निवेश्य त्वयि सिद्धिमाप्नुयामितीच्छितं पूरय मे किल प्रभो । यापङ्कजाङ्घ्रिं भजतां विवेकिनां
    कुतो न्वरिष्ठा भवभीर्नतोऽस्म्यहम् ॥ ८॥ यः श्रीनाथजलन्धराष्टकमिदं भक्त्या पठेदन्वहः सोऽरिष्टारिचमूपमूर्धनि
    पदं न्यस्याटतीवार्भकः । विद्वद्भिः परिसेवितं प्रतिदिनं संयोगमार्गेषुभिः तच्छ्रीमङ्गलमातनोत्वलमिति
    प्रान्तं गतं तत्सताम् ॥ ९॥ श्रीनाथाय नमः । शिवाय नमः ॥ प्रातरुत्थाय यो भक्त्या श्रीनाथाष्टकमुत्तमम्
    । पठेद्वा श
