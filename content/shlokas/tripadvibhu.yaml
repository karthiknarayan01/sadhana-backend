id: tripadvibhu
category: upanishad
name:
  english: tripadvibhu
  devanagari: त्रिपद्विभु
content:
  english: sastanubhirvyashema devahitam yadayuh || atha paramatattvarahasyam jijnasuh parameshthi devamanena
    sahasrasamvatsaram tapashcacara | sahasravarshe'tite'tyugrativratapasa prasannam bhagavantam mahavishnum
    brahma paripricchati bhagavan paramatattvarahasyam me bruhiti | paramatattvarahasyavakta tvameva nanyah
    kashcidasti tatkathamiti | tadevocyate | tvameva sarvajnah | tvameva sarvashaktih | tvameva sarvadharah
    | tvameva sarvasvarupah | tvameva sarveshvarah | tvameva sarvapravartakah | tvameva sarvapalakah |
    tvameva sarvanivartakah | tvameva sadasadatmakah | tvameva sadasadvilakshanah | tvamevantarbahirvyapakah
    | tvamevatisukshmatarah | tvamevatimahato mahiyan | tvameva sarvamulavidyanivartakah | tvamevavidyaviharah
    | tvamevavidyadharakah | tvameva vidyavedyah | tvameva vidyasvarupah | tvameva vidyatitah | tvameva
    sarvakaranahetuh | tvameva sarvakaranasamashtih | tvameva sarvakaranavyashtih | tvamevakhandanandah
    | tvameva paripurnanandah | tvameva niratishayanandah | tvameva turiyaturiyah | tvameva turiyatitah
    | tvameva anantopanishadvimrigyah | tvamevakhilashastrairvimrigyah | tvameva brahmeshanapurandarapurogamairakhilamarairakhilagamairvimrigyah
    | tvameva sarvamumukshubhirvimrigyah | tvamevamritamayairvimrigyah | tvamevamritamayastvamevamritamayastvamevamritamayah
    | tvameva sarvam tvameva sarvam tvameva sarvam | tvameva mokshastvameva mokshadastvamevakhilamokshasadhanam
    | na kincidasti tvadvyatiriktam | tvadvyatiriktam yatkimcitpratiyate tatsarvam badhitamiti nishcayam
    | tasmattvameva vakta tvamevagurustvameva pita tvameva sarvaniyanta tvameva sarvam tvameva sada dhyeya
    iti sunishcitah | paramatattvajnastamuvaca mahavishnuratiprasanno bhutva sadhusadhviti sadhuprashamsapurvam
    sarvam paramatattvarahasyam te kathayami | savadhanena shrunu | brahman devadarshityakhyatharvanashakhayam
    paramatattvarahasyakhyatharvanamahanarayanopanishadi gurushishyasamvadah puratanah prasiddhataya jagarti
    | pura tatsvarupajnanena mahantah sarvam brahmabhavam gatah | yasya shravanena sarvabandhah pravinashyanti
    | yasya jnanena sarvarahasyam viditam bhavati | tatsvarupam kathamiti | shanto danto'tiviraktah sushuddho
    gurubhaktastaponishthah shishyo brahmanishtham gurumasadya pradakshinapurvakam dandavatpranamya pranjalirbhutva
    vinayenopasamgamya bhagavan guro me paramatattvarahasyam vivicya vaktavyamiti | atyadarapurvakamiti
    harshena shishyam bahukritya gururvadati | paramatattvarahasyopanishatkramah kathyate savadhanena
    shruyatam |katham brahma | kalatrayabadhitam brahma | sarvakalabadhitam brahma | sagunanirgunasvarupam
    brahma | adimadhyantashunyam brahma | sarvam khalvidam brahma | mayatitam gunatitam brahma | anantamaprameyakhandaparipurnam
    brahma | advitiyaparamanandashuddhabuddhamuktasatyasvarupavyapakabhinnaparicchinam brahma | saccidanandasvaprakasham
    brahma | manovacamagocaram brahma | amitavedantavedyam brahma | deshatah kalato vastutah paricchedarahitam
    brahma | sarvaparipurnam brahma turiyam nirakaramekam brahma | advaitamanirvacyam brahma | pranavatmakam
    brahma | pranavatmakatvenoktam brahma | pranavadyakhilamantratmakam brahma | padacatushtayatmakam
    brahma | kim tatpadacatushtayam brahma bhavati | avidyapadah suvidyapadashcanandapadasturiyapadasturiya
    iti | turiyapadasturiyaturiyam turiyatitam ca | katham padacatushtayasya bhedah | avidyapadah prathamah
    pado vidyapado dvitiyah anandapadastritiyasturiyapadasturiya iti | mulavidya prathamapade nanyatra
    | vidyanandaturiyamshah sarveshu padeshu vyapya tishthanti | evam tarhi vidyadinam bhedah kathamiti
    | tattatpradhanyena tattadvyapadeshah | vastutastvabheda eva | tatradhastanamekam padamavidyashabalam
    bhavati | uparitanapadatrayam shuddhabodhanandalakshanamamritam bhavati | taccanirvacyamanirdeshyamakhandanandaikarasatmakam
    bhavati | tatra madhyamapadamadhyapradeshe'mitatejahpravahakarataya nityavaikuntham vibhati | tacca
    niratishayanandakhandabrahmanandanijamurtyakarena jvalati | aparicchinnamandalani yatha drishyante
    tadvadakhandanandamitavaishnavadivyatejorashyantargatavilasanmahavishnoh paramam padam virajate |
    dugdhodadhimadhyasthitamritamritakalashavadvaishnavam dhama paramam samdrishyate | sudarshanadivyatejo'ntargatah
    sudarshanapurusho yatha suryamandalantargatah suryanarayano'mitaparicchinnadvaitaparamanandalakshanatejorashyantargata
    adinarayanastatha samdrishyate | sa eva turiyam brahma sa eva turiyatitah sa eva vishnuh sa eva samastabrahmavacakavacyah
    sa eva paramjyotih sa eva mayatitah sa eva gunatitah sa eva kalatitah sa eva akhilakarmatitah sa eva
    satyopadhirahitah sa eva parameshvarah sa eva cirantanah purushah pranavadyakhilamantravacakavacya
    adyantashunya adideshakalavastuturiyasamjnanityaparipurnah purnah satyasamkalpa atmaramah kalatrayabadhitanijasvarupah
    svayamjyotih svayamprakashamayah svasamanadhikaranashunyah svasamanadhikashunyo na divaratrivibhago
    na samvatsaradikalavibhagah svanandamayanantacintyavibhava atmantaratma paramatma jnanatma turiyatmetyadivacakavacyo'dvaitaparamanando
    vibhurnityo nishkalanko nirvikalpo niranjano nirakhyatah shuddho deva eko narayano na dvitiyo'sti
    kashciditi ya evam veda sa purushastadiyopasanaya tasya sayujyametityasamshayamityupanishat || ityatharvanamahanarayanopanishadi
    padacatushtayasvarupanirupanam nama prathamo'dhyayah || 1|| atheti hovaca cchatro gurum bhagavantam
    | bhagavanvaikunthasya narayanasya ca nityatvamuktvam | sa eva turiyamityuktameva | vaikunthah sakaro
    narayanah sakarashca | turiyam tu nirakaram | sakarah savayavo niravayavam nirakaram | tasmatsakaramanityam
    nityam nirakaramiti shruteh | yadyatsavayavam tattadanityamityanumanacceti pratyakshena drishtatvacca
    | atastayoranityatvameva vaktumucitam bhavati | kathamuktam nityatvamiti | turiyamaksharamiti shruteh
    | turiyasya nityatvam prasiddham | nityatvanityatve parasparaviruddhadharmau | tayorekasminbrahmanyatyantaviruddham
    bhavati | tasmadvaikunthasya ca narayanasya ca nityatvameva vaktumucitam bhavati | satyameva bhavatiti
    deshikam pariharati | sakarastu dvividhah | sopadhiko nirupadhikashca | tatra sopadhikah sakarah kathamiti
    | avidyakamakhilakaryakaranajamavidyapada eva nanyatra | tasmatsamastavidyopadhih sakarah savayava
    eva | savayavatvadavashyamanityam bhavatyeva | sopadhikasakaro varnitah | tarhi nirupadhika sakarah
    kathamiti | nirupadhikasakarastrividhah | brahmavidyasakarashcanandasakarubhayatmakasakarashceti |
    brahmavidyasakarashcanandasakara ubhayatmakasakarashceti | trividhasakaro'pi punardvividho bhavati
    | nityasakaro muktasakarashceti | nityasakarastvadyantashunyah shashvatah | upasanaya ye muktim gatastesham
    sakaro muktasakarah | tasyakhandajnanenavirbhavo bhavati | so'pi shashvatah | muktasakarastvaicchika
    iti | anye vadanti shashvatatvam kathamiti | advaitakhandaparipurnaniratishayaparamananda
  devanagari: सस्तनूभिर्व्यशेम देवहितं यदायुः ॥ अथ परमतत्त्वरहस्यं जिज्ञासुः परमेष्ठी देवमानेन सहस्रसंवत्सरं
    तपश्चचार । सहस्रवर्षेऽतीतेऽत्युग्रतीव्रतपसा प्रसन्नं भगवन्तं महाविष्णुं ब्रह्मा परिपृच्छति भगवन् परमतत्त्वरहस्यं
    मे ब्रूहीति । परमतत्त्वरहस्यवक्ता त्वमेव नान्यः कश्चिदस्ति तत्कथमिति । तदेवोच्यते । त्वमेव सर्वज्ञः
    । त्वमेव सर्वशक्तिः । त्वमेव सर्वाधारः । त्वमेव सर्वस्वरूपः । त्वमेव सर्वेश्वरः । त्वमेव सर्वप्रवर्तकः
    । त्वमेव सर्वपालकः । त्वमेव सर्वनिवर्तकः । त्वमेव सदसदात्मकः । त्वमेव सदसद्विलक्षणः । त्वमेवान्तर्बहिर्व्यापकः
    । त्वमेवातिसूक्ष्मतरः । त्वमेवातिमहतो महीयान् । त्वमेव सर्वमूलाविद्यानिवर्तकः । त्वमेवाविद्याविहारः
    । त्वमेवाविद्याधारकः । त्वमेव विद्यावेद्यः । त्वमेव विद्यास्वरूपः । त्वमेव विद्यातीतः । त्वमेव सर्वकारणहेतुः
    । त्वमेव सर्वकारणसमष्टिः । त्वमेव सर्वकारणव्यष्टिः । त्वमेवाखण्डानन्दः । त्वमेव परिपूर्णानन्दः । त्वमेव
    निरतिशयानन्दः । त्वमेव तुरीयतुरीयः । त्वमेव तुरीयातीतः । त्वमेव अनन्तोपनिषद्विमृग्यः । त्वमेवाखिलशास्त्रैर्विमृग्यः
    । त्वमेव ब्रह्मेशानपुरन्दरपुरोगमैरखिलामरैरखिलागमैर्विमृग्यः । त्वमेव सर्वमुमुक्षुभिर्विमृग्यः । त्वमेवामृतमयैर्विमृग्यः
    । त्वमेवामृतमयस्त्वमेवामृतमयस्त्वमेवामृतमयः । त्वमेव सर्वं त्वमेव सर्वं त्वमेव सर्वम् । त्वमेव मोक्षस्त्वमेव
    मोक्षदस्त्वमेवाखिलमोक्षसाधनम् । न किञ्चिदस्ति त्वद्व्यतिरिक्तम् । त्वद्व्यतिरिक्तं यत्किंचित्प्रतीयते
    तत्सर्वं बाधितमिति निश्चयम् । तस्मात्त्वमेव वक्ता त्वमेवगुरुस्त्वमेव पिता त्वमेव सर्वनियन्ता त्वमेव
    सर्वं त्वमेव सदा ध्येय इति सुनिश्चितः । परमतत्त्वज्ञस्तमुवाच महाविष्णुरतिप्रसन्नो भूत्वा साधुसाध्विति
    साधुप्रशंसापूर्वं सर्वं परमतत्त्वरहस्यं ते कथयामि । सावधानेन श्रुणु । ब्रह्मन् देवदर्शीत्याख्याथर्वणशाखायां
    परमतत्त्वरहस्याख्याथर्वणमहानारायणोपनिषदि गुरुशिष्यसंवादः पुरातनः प्रसिद्धतया जागर्ति । पुरा तत्स्वरूपज्ञानेन
    महान्तः सर्वं ब्रह्मभावं गताः । यस्य श्रवणेन सर्वबन्धः प्रविनश्यन्ति । यस्य ज्ञानेन सर्वरहस्यं विदितं
    भवति । तत्स्वरूपं कथमिति । शान्तो दान्तोऽतिविरक्तः सुशुद्धो गुरुभक्तस्तपोनिष्ठः शिष्यो ब्रह्मनिष्ठं
    गुरुमासाद्य प्रदक्षिणपूर्वकं दण्डवत्प्रणम्य प्राञ्जलिर्भूत्वा विनयेनोपसंगम्य भगवन् गुरो मे परमतत्त्वरहस्यं
    विविच्य वक्तव्यमिति । अत्यादरपूर्वकमिति हर्षेण शिष्यं बहूकृत्य गुरुर्वदति । परमतत्त्वरहस्योपनिषत्क्रमः
    कथ्यते सवाधानेन श्रूयताम् ।कथं ब्रह्म । कालत्रयाबाधितं ब्रह्म । सर्वकालाबाधितं ब्रह्म । सगुणनिर्गुणस्वरूपं
    ब्रह्म । आदिमध्यान्तशून्यं ब्रह्म । सर्वं खल्विदं ब्रह्म । मायातीतं गुणातीतं ब्रह्म । अनन्तमप्रमेयाखण्डपरिपूर्णं
    ब्रह्म । अद्वितीयपरमानन्दशुद्धबुद्धमुक्तसत्यस्वरूपव्यापकाभिन्नापरिच्छिनं ब्रह्म । सच्चिदानन्दस्वप्रकाशं
    ब्रह्म । मनोवाचामगोचरं ब्रह्म । अमितवेदान्तवेद्यं ब्रह्म । देशतः कालतो वस्तुतः परिच्छेदरहितं ब्रह्म
    । सर्वपरिपूर्णं ब्रह्म तुरीयं निराकारमेकं ब्रह्म । अद्वैतमनिर्वाच्यं ब्रह्म । प्रणवात्मकं ब्रह्म ।
    प्रणवात्मकत्वेनोक्तं ब्रह्म । प्रणवाद्यखिलमन्त्रात्मकं ब्रह्म । पादचतुष्टयात्मकं ब्रह्म । किं तत्पादचतुष्टयं
    ब्रह्म भवति । अविद्यापादः सुविद्यापादश्चानन्दपादस्तुरीयपादस्तुरीय इति । तुरीयपादस्तुरीयतुरीयं तुरीयातीतं
    च । कथं पादचतुष्टयस्य भेदः । अविद्यापदः प्रथमः पादो विद्यापादो द्वितीयः आनन्दपादस्तृतीयस्तुरीयपादस्तुरीय
    इति । मूलाविद्या प्रथमपादे नान्यत्र । विद्यानन्दतुरीयांशाः सर्वेषु पादेषु व्याप्य तिष्ठन्ति । एवं
    तर्हि विद्यादीनां भेदः कथमिति । तत्तत्प्राधान्येन तत्तद्व्यपदेशः । वस्तुतस्त्वभेद एव । तत्राधस्तनमेकं
    पादमविद्याशबलं भवति । उपरितनपादत्रयं शुद्धबोधानन्दलक्षणममृतं भवति । तच्चानिर्वाच्यमनिर्देश्यमखण्डानन्दैकरसात्मकं
    भवति । तत्र मध्यमपादमध्यप्रदेशेऽमिततेजःप्रवाहाकारतया नित्यवैकुण्ठं विभाति । तच्च निरतिशयानन्दाखण्डब्रह्मानन्दनिजमूर्त्याकारेण
    ज्वलति । अपरिच्छिन्नमण्डलानि यथा दृश्यन्ते तद्वदखण्डानन्दामितवैष्णवदिव्यतेजोराश्यन्तर्गतविलसन्महाविष्णोः
    परमं पदं विराजते । दुग्धोदधिमध्यस्थितामृतामृतकलशवद्वैष्णवं धाम परमं संदृश्यते । सुदर्शनदिव्यतेजोऽन्तर्गतः
    सुदर्शनपुरुषो यथा सूर्यमण्डलान्तर्गतः सूर्यनारायणोऽमितापरिच्छिन्नाद्वैतपरमानन्दलक्षणतेजोराश्यन्तर्गत
    आदिनारायणस्तथा संदृश्यते । स एव तुरीयं ब्रह्म स एव तुरीयातीतः स एव विष्णुः स एव समस्तब्रह्मवाचकवाच्यः
    स एव परंज्योतिः स एव मायातीतः स एव गुणातीतः स एव कालातीतः स एव अखिलकर्मातीतः स एव सत्योपाधिरहितः स
    एव परमेश्वरः स एव चिरन्तनः पुरुषः प्रणवाद्यखिलमन्त्रवाचकवाच्य आद्यन्तशून्य आदिदेशकालवस्तुतुरीयसंज्ञानित्यपरिपूर्णः
    पूर्णः सत्यसंकल्प आत्मारामः कालत्रयाबाधितनिजस्वरूपः स्वयंज्योतिः स्वयम्प्रकाशमयः स्वसमानाधिकरणशून्यः
    स्वसमानाधिकशून्यो न दिवारात्रिविभागो न संवत्सरादिकालविभागः स्वानन्दमयानन्ताचिन्त्यविभव आत्मान्तरात्मा
    परमात्मा ज्ञानात्मा तुरीयात्मेत्यादिवाचकवाच्योऽद्वैतपरमानन्दो विभुर्नित्यो निष्कलङ्को निर्विकल्पो
    निरञ्जनो निराख्यातः शुद्धो देव एको नारायणो न द्वितीयोऽस्ति कश्चिदिति य एवं वेद स पुरुषस्तदीयोपासनया
    तस्य सायुज्यमेतीत्यसंशयमित्युपनिषत् ॥ इत्याथर्वणमहानारायणोपनिषदि पादचतुष्टयस्वरूपनिरूपणं नाम प्रथमोऽध्यायः
    ॥ १॥ अथेति होवाच च्छात्रो गुरुं भगवन्तम् । भगवन्वैकुण्ठस्य नारायणस्य च नित्यत्वमुक्त्वम् । स एव तुरीयमित्युक्तमेव
    । वैकुण्ठः साकारो नारायणः साकारश्च । तुरीयं तु निराकारम् । साकारः सावयवो निरवयवं निराकारम् । तस्मात्साकारमनित्यं
    नित्यं निराकारमिति श्रुतेः । यद्यत्सावयवं तत्तदनित्यमित्यनुमानाच्चेति प्रत्यक्षेण दृष्टत्वाच्च । अतस्तयोरनित्यत्वमेव
    वक्तुमुचितं भवति । कथमुक्तं नित्यत्वमिति । तुरीयमक्षरमिति श्रुतेः । तुरीयस्य नित्यत्वं प्रसिद्धम्
    । नित्यत्वानित्यत्वे परस्परविरुद्धधर्मौ । तयोरेकस्मिन्ब्रह्मण्यत्यन्तविरुद्धं भवति । तस्माद्वैकुण्ठस्य
    च नारायणस्य च नित्यत्वमेव वक्तुमुचितं भवति । सत्यमेव भवतीति देशिकं परिहरति । साकारस्तु द्विविधः ।
    सोपाधिको निरुपाधिकश्च । तत्र सोपाधिकः साकारः कथमिति । आविद्यकमखिलकार्यकरणजामविद्यापाद एव नान्यत्र
    । तस्मात्समस्ताविद्योपाधिः साकारः सावयव एव । सावयवत्वादवश्यमनित्यं भवत्येव । सोपाधिकसाकारो वर्णितः
    । तर्हि निरुपाधिक साकारः कथमिति । निरुपाधिकसाकारस्त्रिविधः । ब्रह्मविद्यासाकारश्चानन्दसाकारुभयात्मकसाकारश्चेति
    । ब्रह्मविद्यासाकारश्चानन्दसाकार उभयात्मकसाकारश्चेति । त्रिविधसाकारोऽपि पुनर्द्विविधो भवति । नित्यसाकारो
    मुक्तसाकारश्चेति । नित्यसाकारस्त्वाद्यन्तशून्यः शाश्वतः । उपासनया ये मुक्तिं गतास्तेषां साकारो मुक्तसाकारः
    । तस्याखण्डज्ञानेनाविर्भावो भवति । सोऽपि शाश्वतः । मुक्तसाकारस्त्वैच्छिक इति । अन्ये वदन्ति शाश्वतत्वं
    कथमिति । अद्वैताखण्डपरिपूर्णनिरतिशयपरमानन्द
