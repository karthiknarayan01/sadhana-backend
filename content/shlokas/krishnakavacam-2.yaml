id: krishnakavacam-2
category: kavacha
name:
  english: krishnakavacam
  devanagari: कृष्णकवचम्
content:
  english: shrikrishnakavacam pranamya devam vipresham pranamya ca sarasvatim | pranamya ca munin sarvan
    sarvashastravisharadan || 1|| shrikrishnakavacam vakshye shrikirtivijayapradam | kantare pathi durge
    ca sada rakshakaram nrinam || 2|| smritva nilambudashyamam nilakuncitakuntalam | barhipinchalasanmaulim
    sharaccandranibhananam || 3|| rajivalocanam rajadvenuna bhushitadharam | dirghapinamahabahum shrivatsankitavakshasam
    || 4|| bhubharaharanodyuktam krishnam girvanavanditam | nishkalam devadevesham naradadibhirarcitam
    || 5|| narayanam jagannatham mandasmitavirajitam | japedevamimam bhaktya mantram sarvarthasiddhaye
    || 6|| sararvadoshaharam punyam sakalavyadhinashanam | vasudevasutah patu murdhanam mama sararvada
    || 7|| lalatam devakisunuh bhruyugmam nandanandanah | nayanau putanahanta nasam shakatamarddanah ||
    8|| yamalarjunahritkarnauki kapolau nagamarddanah | dantan gopalakah potu jihvam hayyangavinabhuk
    || 9|| oshtham dhenukajitpayadadharam keshinashanah | cibukam patu govindo baladevanujo mukham ||
    10|| akrurasahitah kantham kakshau dantivarantakah | bhujau canuraharirme karau kamsanishudanah ||
    11|| vaksho lakshmipatih patu hridayam jagadishvarah | udaram madhuranatho nabhim dvaravatipatih ||
    12|| rugminivallabhah prishtham jaghanam shishupalaha | uru pandavaduto me januni parthasarathih ||
    13|| vishvarupadharo janghe prapade bhumibharahrit | caranau yadavah patu patu vighno'khilam vapuh
    || 14|| diva payajjagannatho ratrau narayanah svayam | sararvakalamupasirissarvakamarthasiddhaye ||
    15|| idam krishnabalopetam yah pathet kavacam narah | sarvada''rtibhayanmuktah krishnabhaktim samapnuyat
    || 16|| iti shrikrishnakavacam sampurnam |
  devanagari: श्रीकृष्णकवचम् प्रणम्य देवं विप्रेशं प्रणम्य च सरस्वतीम् । प्रणम्य च मुनीन् सर्वान् सर्वशास्त्रविशारदान्
    ॥ १॥ श्रीकृष्णकवचं वक्ष्ये श्रीकीर्तिविजयप्रदम् । कान्तारे पथि दुर्गे च सदा रक्षाकरं नृणाम् ॥ २॥ स्मृत्वा
    नीलाम्बुदश्यामं नीलकुञ्चितकुन्तलम् । बर्हिपिञ्छलसन्मौलिं शरच्चन्द्रनिभाननम् ॥ ३॥ राजीवलोचनं राजद्वेणुना
    भूषिताधरम् । दीर्घपीनमहाबाहुं श्रीवत्साङ्कितवक्षसम् ॥ ४॥ भूभारहरणोद्युक्तं कृष्णं गीर्वाणवन्दितम्
    । निष्कलं देवदेवेशं नारदादिभिरर्चितम् ॥ ५॥ नारायणं जगन्नाथं मन्दस्मितविराजितम् । जपेदेवमिमं भक्त्या
    मन्त्रं सर्वार्थसिद्धये ॥ ६॥ सरर्वदोषहरं पुण्यं सकलव्याधिनाशनम् । वसुदेवसुतः पातु मूर्धानं मम सरर्वदा
    ॥ ७॥ ललाटं देवकीसूनुः भ्रूयुग्मं नन्दनन्दनः । नयनौ पूतनाहन्ता नासां शकटमर्द्दनः ॥ ८॥ यमलार्जुनहृत्कर्णौकि
    कपोलौ नगमर्द्दनः । दन्तान् गोपालकः पोतु जिह्वां हय्यङ्गवीनभुक् ॥ ९॥ ओष्ठं धेनुकजित्पायादधरं केशिनाशनः
    । चिबुकं पातु गोविन्दो बलदेवानुजो मुखम् ॥ १०॥ अक्रूरसहितः कण्ठं कक्षौ दन्तिवरान्तकः । भुजौ चाणूरहारिर्मे
    करौ कंसनिषूदनः ॥ ११॥ वक्षो लक्ष्मीपतिः पातु हृदयं जगदीश्वरः । उदरं मधुरानाथो नाभिं द्वारवतीपतिः ॥
    १२॥ रुग्मिणीवल्लभः पृष्ठं जघनं शिशुपालहा । ऊरू पाण्डवदूतो मे जानुनी पार्थसारथिः ॥ १३॥ विश्वरूपधरो
    जङ्घे प्रपदे भूमिभारहृत् । चरणौ यादवः पातु पातु विघ्नोऽखिलं वपुः ॥ १४॥ दिवा पायाज्जगन्नाथो रात्रौ
    नारायणः स्वयम् । सरर्वकालमुपासीरिस्सर्वकामार्थसिद्धये ॥ १५॥ इदं कृष्णबलोपेतं यः पठेत् कवचं नरः । सर्वदाऽऽर्तिभयान्मुक्तः
    कृष्णभक्तिं समाप्नुयात् ॥ १६॥ इति श्रीकृष्णकवचं सम्पूर्णम् ।
