id: bharatimangalastotram
category: stotram
name:
  english: bharatimangalastotram
  devanagari: भारतीमन्गलस्तोत्रम्
content:
  english: bharati sammriddha mangalastu nah || 5|| vishvamanavashasanam gitakhyam yatra ghoshitam | dharmakshetratmabharati
    sammriddha mangalastu nah || 6|| vyasavyavasthita madhye shankaracaryasevita | prasthanatrayabharati
    sammriddha mangalastu nah || 7|| vasishtadi
  devanagari: भारती संमृद्धा मङ्गलास्तु नः ॥ ५॥ विश्वमानवशासनं गीताख्यं यत्र घोषितम् । धर्मक्षेत्रात्मभारती
    संमृद्धा मङ्गलास्तु नः ॥ ६॥ व्यासव्यवस्थिता मध्ये शङ्काराचार्यसेविता । प्रस्थानत्रयभारती संमृद्धा
    मङ्गलास्तु नः ॥ ७॥ वसिष्टादि
meaning: {}
