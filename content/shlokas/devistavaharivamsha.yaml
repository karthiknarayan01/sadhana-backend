id: devistavaharivamsha
category: stotram
name:
  english: devistavaharivamsha
  devanagari: देवीस्तवहरिवंश
content:
  english: 8 vaishampayana uvaca arya katyayani devi kaushiki brahmacarini | janani siddhasenasya durga
    vira mahatapah || 1|| jaya ca vijaya caiva pushtishca tvam kshama daya | jyeshtha yamasya bhagini
    nilakausheyavasini || 2|| bahurupa virupa ca anekavidharupini | virupakshi vishalakshi bhaktanam parirakshani
    || 3|| parvatagreshu ghoreshu nadishu ca guhasu ca | vasastava mahadevi vaneshupavaneshu ca || 4||
    shabarairbarbaraishcaiva pulindaishca supujita | mayurapakshadhvajini lokan kramasi sarvashah || 5||
    kukkutaishcagalairmeshaih simhairvyaghraih samakula | ghantaninadabahula vishruta vindhyavasini ||
    6|| trishulapattisadhara suryacandrapatakini | navami krishnapakshasya shuklasyaikadashi priya ||
    7 || bhagini vasudevasya rajani kalahapriya | avasah sarvabhutanam nishtha ca parama gatih || 8 ||
    nandagopasuta caiva devanam vijayavaha | ciravasah suvasashca raudri sandhya tvameva ca || 9|| prakirnakeshi
    mrityushca tatha mamsaudanapriya | lakshmiralakshmirupena danavanam vadhaya ca || 10|| savitri capi
    devanam mata bhutaganasya ca | antarvedi ca yajnanamritvijam caiva dakshina || 11|| siddhih samyatrikanam
    ca vela sagarayayinam | yakshanam prathama yakshi naganam suraseti ca || 12|| kanyanam brahmacarya
    ca saubhagyam pramadasu ca | brahmavadinyatho diksha shobha ca parama tatha | jyotisham tvam prabha
    devi nakshatranam ca rohini || 13|| rajadvareshu tirtheshu nadinam sangameshu ca | purne ca purnimacandre
    krittivasa iti smrita || 14|| sarasvati ca valmikeh smritirdvaipayane tatha | suradevi ca bhuteshu
    stuyase tvam svakarmabhih || 15|| indrasya carudrishtistvam sahasranayaneti ca | rishinam dharmabuddhistu
    devanamaditistatha || 16|| karshakanam ca siteti bhutanam dharaniti ca | tapasanam ca devi tvamarani
    cagnihotrinam || 17|| kshudha ca sarvabhutanam triptistvam ca divaukasam | svaha tushtirdhritirmedha
    vasunam tvam vasumati || 18|| asha tvam manushanam tu tushtishca kritakarmanam | dishashca vidishashcaiva
    tatha hyagnishikha prabha || 19|| shakuni putana ca tvam revati ca sudaruna | nidra ca sarvabhutanam
    mohani kshatriya tatha || 20|| vidyanam brahmavidya tvamonkaro'stha vashat tatha | narinam parvati
    ca tvam pauranimrishayo viduh || 21|| arundhatyekabhartrinam prajapativaco yatha | bhedo vivadashilanam
    tvamindraniti vishruta | paryayanamabhirdivyairindrani ceti vishruta || 22|| tvaya vyaptamidam sarvam
    jagat sthavarajangamam | sangrameshu ca sarveshu agniprajvaliteshu ca || 23 || naditireshu ghoreshu
    kantareshu bhayeshu ca | pravase rajabandhe ca shatrunam ca pramardane || 24 || pranatyayeshu sarveshu
    tvam hi raksha na samshayah | tvayi me hridayam devi tvayi buddhirmanastvayi || 25|| raksha mam sarvapapebhyah
    prasadam ca karishyasi | imam devyah stavam divyamitihasasamanvitam || 26|| yah pathet pratarutthaya
    shucih prayatamanasah | tribhishca kankshitam masaih phalam vai samprayacchati || 27 || shadbhirmasairvarishtham
    tu varamekam prayacchati | shanmasan pathate yastu kankshitam ca labheta sah | arcita navabhirmasairdivyam
    cakshuh prayacchati || 28 || samvatsarena siddhim tu yathakamam prayacchati | satyam ca brahmacaryam
    ca dvaipayanavaco yatha || 29 || iti harivamshanubandham antargatam devistavam sampurnam ||
  devanagari: ८ वैशम्पायन उवाच आर्या कात्यायनी देवी कौशिकी ब्रह्मचारिणी । जननी सिद्धसेनस्य दुर्गा वीरा
    महातपाः ॥ १॥ जया च विजया चैव पुष्टिश्च त्वं क्षमा दया । ज्येष्ठा यमस्य भगिनी नीलकौशेयवासिनी ॥ २॥ बहुरूपा
    विरूपा च अनेकविधरूपिणी । विरूपाक्षी विशालाक्षी भक्तानां परिरक्षणी ॥ ३॥ पर्वताग्रेषु घोरेषु नदीषु च
    गुहासु च । वासस्तव महादेवि वनेषूपवनेषु च ॥ ४॥ शबरैर्बर्बरैश्चैव पुलिन्दैश्च सुपूजिता । मयूरपक्षध्वजिनी
    लोकान् क्रामसि सर्वशः ॥ ५॥ कुक्कुटैश्चागलैर्मेषैः सिंहैर्व्याघ्रैः समाकुला । घण्टानिनादबहुला विश्रुता
    विन्ध्यवासिनी ॥ ६॥ त्रिशूलपट्टिसधरा सूर्यचन्द्रपताकिनी । नवमी कृष्णपक्षस्य शुक्लस्यैकादशी प्रिया ॥
    ७ ॥ भगिनी वासुदेवस्य रजनी कलहप्रिया । आवासः सर्वभूतानां निष्ठा च परमा गतिः ॥ ८ ॥ नन्दगोपसुता चैव देवानां
    विजयावहा । चीरवासाः सुवासाश्च रौद्री सन्ध्या त्वमेव च ॥ ९॥ प्रकीर्णकेशी मृत्युश्च तथा मांसौदनप्रिया
    । लक्ष्मीरलक्ष्मीरूपेण दानवानां वधाय च ॥ १०॥ सावित्री चापि देवानां माता भूतगणस्य च । अन्तर्वेदी च
    यज्ञानामृत्विजां चैव दक्षिणा ॥ ११॥ सिद्धिः सांयात्रिकाणां च वेला सागरयायिनाम् । यक्षाणां प्रथमा यक्षी
    नागानां सुरसेति च ॥ १२॥ कन्यानां ब्रह्मचर्या च सौभाग्यं प्रमदासु च । ब्रह्मवादिन्यथो दीक्षा शोभा च
    परमा तथा । ज्योतिषां त्वं प्रभा देवि नक्षत्राणां च रोहिणी ॥ १३॥ राजद्वारेषु तीर्थेषु नदीनां सङ्गमेषु
    च । पूर्णे च पूर्णिमाचन्द्रे कृत्तिवासा इति स्मृता ॥ १४॥ सरस्वती च वाल्मीकेः स्मृतिर्द्वैपायने तथा
    । सुरदेवी च भूतेषु स्तूयसे त्वं स्वकर्मभिः ॥ १५॥ इन्द्रस्य चारुदृष्टिस्त्वं सहस्रनयनेति च । ऋषीणां
    धर्मबुद्धिस्तु देवानामदितिस्तथा ॥ १६॥ कर्षकानां च सीतेति भूतानां धरणीति च । तापसानां च देवी त्वमरणी
    चाग्निहोत्रिणाम् ॥ १७॥ क्षुधा च सर्वभूतानां तृप्तिस्त्वं च दिवौकसाम् । स्वाहा तुष्टिर्धृतिर्मेधा वसूनां
    त्वं वसूमती ॥ १८॥ आशा त्वं मानुषाणां तु तुष्टिश्च कृतकर्मणाम् । दिशश्च विदिशश्चैव तथा ह्यग्निशिखा
    प्रभा ॥ १९॥ शकुनी पूतना च त्वं रेवती च सुदारुणा । निद्रा च सर्वभूतानां मोहनी क्षत्रिया तथा ॥ २०॥ विद्यानां
    ब्रह्मविद्या त्वमोङ्कारोऽस्थ वषट् तथा । नारीणां पार्वती च त्वं पौराणीमृषयो विदुः ॥ २१॥ अरुन्धत्येकभर्तॄणां
    प्रजापतिवचो यथा । भेदो विवादशीलानं त्वमिन्द्राणीति विश्रुता । पर्यायनामभिर्दिव्यैरिन्द्राणी चेति विश्रुता
    ॥ २२॥ त्वया व्याप्तमिदं सर्वं जगत् स्थावरजङ्गमम् । सङ्ग्रामेषु च सर्वेषु अग्निप्रज्वलितेषु च ॥ २३
    ॥ नदीतीरेषु घोरेषु कान्तारेषु भयेषु च । प्रवासे राजबन्धे च शत्रूणां च प्रमर्दने ॥ २४ ॥ प्राणात्ययेषु
    सर्वेषु त्वं हि रक्षा न संशयः । त्वयि मे हृदयं देवि त्वयि बुद्धिर्मनस्त्वयि ॥ २५॥ रक्ष मां सर्वपापेभ्यः
    प्रसादं च करिष्यसि । इमं देव्याः स्तवं दिव्यमितिहाससमन्वितम् ॥ २६॥ यः पठेत् प्रातरुत्थाय शुचिः प्रयतमानसः
    । त्रिभिश्च काङ्क्षितं मासैः फलं वै सम्प्रयच्छति ॥ २७ ॥ षड्भिर्मासैर्वरिष्ठं तु वरमेकं प्रयच्छति ।
    षण्मासान् पठते यस्तु काङ्क्षितं च लभेत सः । अर्चिता नवभिर्मासैर्दिव्यं चक्षुः प्रयच्छति ॥ २८ ॥ संवत्सरेण
    सिद्धिं तु यथाकामं प्रयच्छति । सत्यं च ब्रह्मचर्यं च द्वैपायनवचो यथा ॥ २९ ॥ इति हरिवंशानुबन्धं अन्तर्गतं
    देवीस्तवं सम्पूर्णम् ॥
