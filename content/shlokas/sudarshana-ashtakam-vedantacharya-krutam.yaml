id: sudarshana-ashtakam-vedantacharya-krutam
category: stotram
name:
  english: Sudarshana Ashtakam (Vedantacharya Krutam)
  devanagari: सुदर्शनाष्टकम् (श्रीवेदान्तदेशिककृतं प्रतिभटश्रेणि)
content:
  english: 'by shri V| shadagopan October 2, 1995 shrimate nigamanta mahadeshikaya namah shriman venkatanatharyah
    kavitarkika kesari | vedantacarya varyo me sannidhattam sada hridi || Verse 1: pratibhatashreni bhishana
    varagunastoma bhushana janibhayasthana tarana jagadavasthana karana | nikhiladushkarma karshana nigamasaddharma
    darshana jaya jaya shri sudarshana jaya jaya shri sudarshana || Verse 2: shubhajagadrupa mandana suraganatrasa
    khandana shatamakhabrahma vandita shatapathabrahma nandita | prathitavidvat sapakshita bhajadahirbudhnya
    lakshita jaya jaya shri sudarshana jaya jaya shri sudarshana || Verse 3: sphutatatijjala pinjara prithutarajvala
    panjara parigata pratnavigraha patutaraprajna durgraha | praharana grama mandita parijana trana pandita
    jaya jaya shri sudarshana jaya jaya shri sudarshana || Verse 4: nijapadaprita sadgana nirupadhisphita
    shadguna nigama nirvyudha vaibhava nijapara vyuha vaibhava | hari haya dveshi darana hara pura plosha
    karana jaya jaya shri sudarshana jaya jaya shri sudarshana || Verse 5: danuja vistara kartana jani
    tamisra vikartana danujavidya nikartana bhajadavidya nivartana | amara drishta sva vikrama samara
    jushta bhramikrama jaya jaya shri sudarshana jaya jaya shri sudarshana || Verse 6: prathimukhalidha
    bandhura prithumahaheti dantura vikatamaya bahishkrita vividhamala parishkrita | sthiramahayantra
    tantrita dridha daya tantra yantrita jaya jaya shri sudarshana jaya jaya shri sudarshana || Verse
    7: mahita sampat sadakshara vihitasampat shadakshara shadaracakra pratishthita sakala tattva pratishthita
    | vividha sankalpa kalpaka vibudhasankalpa kalpaka jaya jaya shri sudarshana jaya jaya shri sudarshana
    || Verse 8: bhuvana netra trayimaya savana tejastrayimaya niravadhi svadu cinmaya nikhila shakte jaganmaya
    | amita vishvakriyamaya shamita vishvagbhayamaya jaya jaya shri sudarshana jaya jaya shri sudarshana
    || Verse 9: phala shruti dvicatushkamidam prabhutasaram pathatam venkatanayaka pranitam | vishame''pi
    manorathah pradhavan na vihanyeta rathanga dhurya guptah || || iti shrivedantadeshikaracitam sudarshanashtakam
    samaptam || kavitarkikasimhaya kalyanagunashaline | shrimate venkateshaya vedantagurave namah || translation
    by V|shadagopan http://vvv|ramanuja|org/sv/acaryas/desika/stotras/sudarsana|html https://ramanuja|org/sri/zournal/shudarsanaashtakam'
  devanagari: 'ब्य् श्री V। षदगोपन् Oच्तोबेर् २, १९९५ श्रीमते निगमान्त महादेशिकाय नमः श्रीमान् वेङ्कटनाथार्यः
    कवितार्किक केसरी । वेदान्ताचार्य वर्यो मे सन्निधत्ताम् सदा हृदि ॥ Vएर्से १: प्रतिभटश्रेणि भीषण वरगुणस्तोम
    भूषण जनिभयस्थान तारण जगदवस्थान कारण । निखिलदुष्कर्म कर्शन निगमसद्धर्म दर्शन जय जय श्री सुदर्शन जय
    जय श्री सुदर्शन ॥ Vएर्से २: शुभजगद्रूप मण्डन सुरगणत्रास खण्डन शतमखब्रह्म वन्दित शतपथब्रह्म नन्दित
    । प्रथितविद्वत् सपक्षित भजदहिर्बुध्न्य लक्षित जय जय श्री सुदर्शन जय जय श्री सुदर्शन ॥ Vएर्से ३: स्फुटतटिज्जाल
    पिञ्जर पृथुतरज्वाल पञ्जर परिगत प्रत्नविग्रह पतुतरप्रज्ञ दुर्ग्रह । प्रहरण ग्राम मण्डित परिजन त्राण
    पण्डित जय जय श्री सुदर्शन जय जय श्री सुदर्शन ॥ Vएर्से ४: निजपदप्रीत सद्गण निरुपधिस्फीत षड्गुण निगम
    निर्व्यूढ वैभव निजपर व्यूह वैभव । हरि हय द्वेषि दारण हर पुर प्लोष कारण जय जय श्री सुदर्शन जय जय श्री
    सुदर्शन ॥ Vएर्से ५: दनुज विस्तार कर्तन जनि तमिस्रा विकर्तन दनुजविद्या निकर्तन भजदविद्या निवर्तन ।
    अमर दृष्ट स्व विक्रम समर जुष्ट भ्रमिक्रम जय जय श्री सुदर्शन जय जय श्री सुदर्शन ॥ Vएर्से ६: प्रथिमुखालीढ
    बन्धुर पृथुमहाहेति दन्तुर विकटमाय बहिष्कृत विविधमाला परिष्कृत । स्थिरमहायन्त्र तन्त्रित दृढ दया तन्त्र
    यन्त्रित जय जय श्री सुदर्शन जय जय श्री सुदर्शन ॥ Vएर्से ७: महित सम्पत् सदक्षर विहितसम्पत् षडक्षर षडरचक्र
    प्रतिष्ठित सकल तत्त्व प्रतिष्ठित । विविध सङ्कल्प कल्पक विबुधसङ्कल्प कल्पक जय जय श्री सुदर्शन जय जय
    श्री सुदर्शन ॥ Vएर्से ८: भुवन नेत्र त्रयीमय सवन तेजस्त्रयीमय निरवधि स्वादु चिन्मय निखिल शक्ते जगन्मय
    । अमित विश्वक्रियामय शमित विश्वग्भयामय जय जय श्री सुदर्शन जय जय श्री सुदर्शन ॥ Vएर्से ९: फल श्रुति
    द्विचतुष्कमिदं प्रभूतसारं पठतां वेङ्कटनायक प्रणीतम् । विषमेऽपि मनोरथः प्रधावन् न विहन्येत रथाङ्ग धुर्य
    गुप्तः ॥ ॥ इति श्रीवेदान्तदेशिकरचितं सुदर्शनाष्टकं समाप्तम् ॥ कवितार्किकसिंहाय कल्याणगुणशालिने । श्रीमते
    वेङ्कटेषाय वेदान्तगुरवे नमः ॥ ट्रन्स्लतिओन् ब्य् V।षदगोपन् ह्त्त्प्://व्व्व्।रमनुज।ओर्ग्/स्व्/अचर्यस्/देसिक/स्तोत्रस्/सुदर्सन।ह्त्म्ल्
    ह्त्त्प्स्://रमनुज।ओर्ग्/स्रि/ज़ोउर्नल्/षुदर्सनआश्तकम्'
