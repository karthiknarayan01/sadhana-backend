id: ekatmata-stotram
category: stotram
name:
  english: Ekatmata Stotram
  devanagari: एकात्मतास्तोत्रम्
content:
  english: om saccidandarupaya namo'stu paramatmane jyotirmayasvarupaya vishvamangalyamurtaye ||1 || prakritih
    pancabhutani graha lokah svarastatha dishah kalashca sarvesham sada kurvantu mangalam|| 2|| ratnakaradhautapadam
    himalayakiritinim brahmarajarshiratnadhyam vande bharatamataram ||3|| mahendro malayah sahyo devatatma
    himalayah dhyeyo raivatako vindhyo girishcaravalistatha ||4 || ganga sarasvati sindhurbrahmaputrashca
    gandaki kaveri yamuna reva krishna goda mahanadi ||5 ayodhya mathura maya kashi kamci avantika vaishali
    dvarika dhyeya puri takshashila gaya ||6 || prayagah pataliputram vijayanagaram mahat indraprastham
    somanathastathamritasarah priyam ||7 || caturvedah puranani sarvopanishadastatha ramayanam bharatam
    ca gita shaddarshanani ca ||8|| jainagamastripitakah gurugranthah satam girah esha jnananidhih shreshthah
    shraddheyo hridi sarvada ||9|| arundhatyanasuya ca savitri janaki sati draupadi kannage gargi mira
    durgavati tatha ||10|| lakshmi ahalya cannamma rudramamba suvikrama nivedita sarada ca pranamya matri
    devatah ||11|| shri ramo bharatah krishno bhishmo dharmastatharjunah markamdeyo harishcandra prahlado
    narado dhruvah ||12|| hanuman janako vyaso vasishthashca shuko balih dadhici vishvakarmanau prithu
    valmiki bhargavah ||13|| bhagirathashcaikalavyo manurdhanvantaristatha shibishca rantidevashca puranodgitakirtayah
    ||14|| buddha jinendra gorakshah paninishca patamjalih shamkaro madhva nimbarkau shri ramanuja vallabhau
    ||15|| jhulelalotha caitanyah tiruvalluvarastatha nayanmaralavarashca kambashca basaveshvarah ||16||
    devalo ravidasashca kabiro guru nanakah narasi tulasidaso dashamesho dridhavratah ||17|| shrimacchankaradevashca
    bamdhu sayana madhavau jnaneshvarastukarama ramadasah purandarah ||18|| birasa sahajanando ramanandastatha
    mahan vitarantu sadaivaite daivim shadgunasampadam ||19|| ravivarma bhatakhamde bhagyacandrah sa bhopatih
    kalavamtashca vikhyatah smaraniya niramtaram ||20|| bharatarshih kalidasah shribhojo janakastatha
    suradasastyagarajo rasakhanashca satkavih ||21|| agastyah kambu kaundinyau rajendrashcola vamshajah
    ashokah pushya mitrashca kharavelah sunitiman ||22|| canakya candraguptau ca vikramah shalivahanah
    samudraguptah shriharshah shailemdro bapparavalah ||23|| lacidbhaskara varma ca yashodharma ca hunajit
    shrikrishnadevarayashca lalitaditya udbalah ||24|| musunurinayakau tau pratapah shiva bhupatih ranajitasimha
    ityete vira vikhyata vikramah ||25|| vaijnanikashca kapilah kanadah shushrutastatha carako bhaskaracaryo
    varahamihira sudhih ||26|| nagarjuna bharadvaja aryabhatto vasurbudhah dhyeyo vemkata ramashca vijna
    ramanujayah ||27|| ramakrishno dayanando ravindro ramamohanah ramatirtho'ravindashca vivekananda udyashah
    ||28|| dadabhai gopabamdhustilako gamdhiradritah ramano malaviyashca shrisubrahmanyabharati ||29||
    subhashah pranavanandah krantiviro vinayakah thakkaro bhimaravashca phule narayano guruh ||30|| sanghashaktipranetarau
    keshavo madhavastatha smaraniyah sadaivaite navacaitanyadayakah ||31|| anukta ye bhaktah prabhucaranasamsaktahridayah
    anirdishtah vira adhisamaramuddhvastaripavah samajoddhartarah suhitakaravijnananipunah namastebhyo
    bhuyatsakalasujanebhyah pratidinam || 32|| idamekatmatastotram shraddhaya yah sada pathet sa rashtradharmanishthavan
    akhandam bharatam smaret ||33|| || vande bharatamataram ||
  devanagari: ॐ सच्चिदान्दरूपाय नमोऽस्तु परमात्मने ज्योतिर्मयस्वरूपाय विश्वमाङ्गल्यमूर्तये ॥१ ॥ प्रकृतिः
    पञ्चभूतानि ग्रहा लोकाः स्वरास्तथा दिशः कालश्च सर्वेषां सदा कुर्वन्तु मङ्गलम्।। २।। रत्नाकराधौतपदां
    हिमालयकिरीटिनीम् ब्रह्मराजर्षिरत्नाढ्यां वन्दे भारतमातरम् ॥३॥ महेन्द्रो मलयः सह्यो देवतात्मा हिमालयः
    ध्येयो रैवतको विन्ध्यो गिरिश्चारावलिस्तथा ॥४ ॥ गङ्गा सरस्वती सिन्धुर्ब्रह्मपुत्रश्च गण्डकी कावेरी
    यमुना रेवा कृष्णा गोदा महानदी ॥५ अयोध्या मथुरा माया काशी कांची अवन्तिका वैशाली द्वारिका ध्येया पुरी
    तक्षशिला गया ॥६ ॥ प्रयागः पाटलिपुत्रं विजयानगरं महत् इन्द्रप्रस्थं सोमनाथस्तथामृतसरः प्रियम् ॥७ ॥
    चतुर्वेदाः पुराणानि सर्वोपनिषदस्तथा रामायणं भारतं च गीता षड्दर्शनानि च ॥८॥ जैनागमास्त्रिपिटकः गुरुग्रन्थः
    सतां गिरः एष ज्ञाननिधिः श्रेष्ठः श्रद्धेयो हृदि सर्वदा ॥९॥ अरुन्धत्यनसूय च सावित्री जानकी सती द्रौपदी
    कन्नगे गार्गी मीरा दुर्गावती तथा ॥१०॥ लक्ष्मी अहल्या चन्नम्मा रुद्रमाम्बा सुविक्रमा निवेदिता सारदा
    च प्रणम्य मातृ देवताः ॥११॥ श्री रामो भरतः कृष्णो भीष्मो धर्मस्तथार्जुनः मार्कंडेयो हरिश्चन्द्र प्रह्लादो
    नारदो ध्रुवः ॥१२॥ हनुमान् जनको व्यासो वसिष्ठश्च शुको बलिः दधीचि विश्वकर्माणौ पृथु वाल्मीकि भार्गवः
    ॥१३॥ भगीरथश्चैकलव्यो मनुर्धन्वन्तरिस्तथा शिबिश्च रन्तिदेवश्च पुराणोद्गीतकीर्तयः ॥१४॥ बुद्ध जिनेन्द्र
    गोरक्शः पाणिनिश्च पतंजलिः शंकरो मध्व निंबार्कौ श्री रामानुज वल्लभौ ॥१५॥ झूलेलालोथ चैतन्यः तिरुवल्लुवरस्तथा
    नायन्मारालवाराश्च कंबश्च बसवेश्वरः ॥१६॥ देवलो रविदासश्च कबीरो गुरु नानकः नरसी तुलसीदासो दशमेषो दृढव्रतः
    ॥१७॥ श्रीमच्छङ्करदेवश्च बंधू सायन माधवौ ज्ञानेश्वरस्तुकाराम रामदासः पुरन्दरः ॥१८॥ बिरसा सहजानन्दो
    रमानन्दस्तथा महान् वितरन्तु सदैवैते दैवीं षड्गुणसंपदम् ॥१९॥ रविवर्मा भातखंडे भाग्यचन्द्रः स भोपतिः
    कलावंतश्च विख्याताः स्मरणीया निरंतरम् ॥२०॥ भरतर्षिः कालिदासः श्रीभोजो जनकस्तथा सूरदासस्त्यागराजो रसखानश्च
    सत्कविः ॥२१॥ अगस्त्यः कंबु कौन्डिण्यौ राजेन्द्रश्चोल वंशजः अशोकः पुश्य मित्रश्च खारवेलः सुनीतिमान्
    ॥२२॥ चाणक्य चन्द्रगुप्तौ च विक्रमः शालिवाहनः समुद्रगुप्तः श्रीहर्षः शैलेंद्रो बप्परावलः ॥२३॥ लाचिद्भास्कर
    वर्मा च यशोधर्मा च हूणजित् श्रीकृष्णदेवरायश्च ललितादित्य उद्बलः ॥२४॥ मुसुनूरिनायकौ तौ प्रतापः शिव
    भूपतिः रणजितसिंह इत्येते वीरा विख्यात विक्रमाः ॥२५॥ वैज्ञानिकाश्च कपिलः कणादः शुश्रुतस्तथा चरको भास्कराचार्यो
    वराहमिहिर सुधीः ॥२६॥ नागार्जुन भरद्वाज आर्यभट्टो वसुर्बुधः ध्येयो वेंकट रामश्च विज्ञा रामानुजायः ॥२७॥
    रामकृष्णो दयानन्दो रवीन्द्रो राममोहनः रामतीर्थोऽरविन्दाश्च विवेकानन्द उद्यशः ॥२८॥ दादाभाई गोपबंधुस्तिलको
    गांधिरादृताः रमणो मालवीयश्च श्रीसुब्रह्मण्यभारती ॥२९॥ सुभाषः प्रणवानन्दः क्रान्तिवीरो विनायकः ठक्करो
    भीमरावश्च फुले नारायणो गुरुः ॥३०॥ सङ्घशक्तिप्रणेतारौ केशवो माधवस्तथा स्मरणीयाः सदैवैते नवचैतन्यदायकाः
    ॥३१॥ अनुक्ता ये भक्ताः प्रभुचरणसंसक्तहृदयाः अनिर्दिष्टाः वीरा अधिसमरमुद्ध्वस्तरिपवः समाजोद्धर्तारः
    सुहितकरविज्ञाननिपुणाः नमस्तेभ्यो भूयात्सकलसुजनेभ्यः प्रतिदिनम् ॥ ३२॥ इदमेकात्मतास्तोत्रं श्रद्धया
    यः सदा पठेत् स राष्ट्रधर्मनिष्ठावान् अखण्डं भारतं स्मरेत् ॥३३॥ ॥ वन्दे भारतमातरम् ॥
