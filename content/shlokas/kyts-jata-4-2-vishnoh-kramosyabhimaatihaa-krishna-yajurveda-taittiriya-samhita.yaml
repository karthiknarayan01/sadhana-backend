id: kyts-jata-4-2-vishnoh-kramosyabhimaatihaa-krishna-yajurveda-taittiriya-samhita
category: stotram
name:
  english: KYTS Jata 4.2 Vishnoh Kramosyabhimaatihaa - Krishna Yajurveda Taittiriya Samhita
content:
  english: vishnoh kramah kramo vishno 'syasi kramah kramo 'si | asya bhimatiha 'bhimatiha 'sya syabhimatiha
    | abhimatiha gayatra ngayatra mabhimatiha 'bhimatiha gayatram | abhimatihetyabhimati nchanda shchando
    gayatra '' cchanda shchanda a | mprithivigm roha roha prithivim | prithivi manvanu prithivi anu vi
    vyan vanu vi | vi kramasva kramasva vi vi kramasva | kramasva nirbhakto nirbhaktah kramasva kramasva
    nirbhaktah | ssa sa nirbhakto nirbhakta ndvishmo dvishmo yam rdvishmo dvishmo vishnoh vishnoh kramah
    kramo vishno 'syasi kramah kramo 'si | asyabhishastiha 'bhishastiha 'sya syabhishastiha | abhishastiha
    traishtubha ntraishtubha mabhishastiha 'bhishastiha traishtubham | abhishastihetyabhishasti nchanda
    shchanda straishtubha '' cchanda shchanda a | roha ntariksha mantarikshagm roha roha ntariksham |
    antariksha manvan vantariksha mantariksha manu | anu vi vyan vanu vi | vi kramasva kramasva vi vi
    kramasva | kramasva nirbhakto nirbhaktah kramasva kramasva nirbhaktah | ssa sa nirbhakto nirbhakta
    ndvishmo dvishmo yam rdvishmo dvishmo vishnoh vishnoh kramah kramo vishno 'syasi kramah kramo 'si
    | asyaratiyato 'ratiyato aratiyato hanta hanta 'ratiyato 'ratiyato hanta | njagatagm hanta hanta jagatam
    | nchanda shchando jagata '' cchanda shchanda a | ndivagm roha roha diva anu vi vyan vanu vi | vi
    kramasva kramasva vi vi kramasva | kramasva nirbhakto nirbhaktah kramasva kramasva nirbhaktah | ssa
    sa nirbhakto nirbhakta ndvishmo dvishmo yam rdvishmo dvishmo vishnoh vishnoh kramah kramo vishno rvishnoh
    kramah | || 'syasi kramah kramo 'si | shatruyato hanta hanta shatruyata shshatruyato hanta | shatruyata
    iti shatru hanta ''nushtubha manushtubhagm hanta hanta ''nushtubham | nchanda shchanda anushtubha
    manushtubha '' cchanda shchanda a | roha disho disho roha roha dishah | disho 'nvanu disho disho 'nu
    | anu vi vyan vanu vi | vi kramasva kramasva vi vi kramasva | kramasva nirbhakto nirbhaktah kramasva
    kramasva nirbhaktah | ssa sa nirbhakto nirbhakta ndvishmo dvishmo yam dvishma iti dvishmah | akranda
    dagni ragni rakranda dakranda dagnih | rdyau rive va dyauh | tkshama kshama rerihat | dvirudho virudho
    reriha virudho virudhah samanjann | sadyo jajnano jajnana ssadyo jajnanah | jajnano vi vi jajnano
    jajnano vi | hi migm hi him | i middha iddha i mi middhah | iddho akhya dakhya diddha iddho akhyat
    | akhyada 'khya dakhyada | a rodasi rodasi a rodasi | rodasi bhanuna bhanuna rodasi rodasi bhanuna
    rodasi iti rodasi | bhanuna bhati bhati bhanuna bhanuna bhati | rbhati bhatyantah | abhyavartinnityabhi
    abhi no no abhyabhi nah | a vartasva vartasva vartasva | vartasvayusha ''yusha vartasva vartasvayusha
    | ayusha varcasa varcasa ''yusha ''yusha varcasa | varcasa sanya sanya varcasa varcasa sanya | sanya
    medhaya medhaya sanya sanya medhaya prajaya medhaya medhaya prajaya dhanena dhanena prajaya agne angiro
    angiro 'gne 'gne angirah | || shshatagm shata mangiro angira te santu santu te te santu | santvavrita
    avritah santu santvavritah | avritah sahasragm sahasra mavrita avritah sahasra nte te sahasragm sahasra
    ta upavrita upavrita ste ta upavritah | mposhasya poshasya tasa poshasya poshena poshena poshasya
    poshasya poshena | poshena punah punah poshena poshena punah | a kridhi kridhya kridhi | kridhi punah
    puna skridhi kridhi punah | rayi ma rayigm rayi ma | a kridhi kridhya kridhi | puna rurjorja punah
    puna rurja | ni vartasva vartasva ni ni vartasva | vartasva punah puna rvartasva vartasva punah |
    puna ragne 'gne punah puna ragne | isha ''yusha ''yushe shesha ''yusha | nah pahi pahi no nah pahi
    | pahi vishvato vishvata spahi pahi vishvatah | vishvata iti vishvatah | saha rayya rayya saha saha
    rayya | rayya ni ni rayya rayya ni | ni vartasva vartasva ni ni vartasva | vartasvagne 'gne vartasva
    vartasvagne agne pinvasva pinvasvagne 'gne pinvasva | pinvasva dharaya dharaya pinvasva pinvasva dharaya
    | vishvaphsniya vishvato vishvato vishvaphsniya vishvaphsniya vishvatah | vishvaphsniyeti vishva vishvata
    spari pari vishvato vishvata spari | uduttama muttama mudu duttamam | va~runa varunottama muttamam
    asma davava sma dasma dava | avadhama madhama mavava dhamam | vi~ vi maddhyamam | shrathaya shrathaya
    maddhyama shrathayeti shrathaya | vaya maditya ditya vayam aditya vrate vrata aditya ditya vrate |
    vrate tava tava vrate vrate tava | tava nagaso 'nagasa stava tava nagasah | anagaso aditaye aditaye
    'nagaso 'nagaso aditaye | aditaye syama syama ditaye aditaye syama | tva 'harsha maharsha ntva tva
    'harsham | aharsha manta ranta rahar anta rabhu rabhu ranta ranta rabhuh | rdhruvo dhruvo abhu rabhu
    dhruva stishtha tishtha dhruvo dhruva stishtha | tishtha vicacali ravicacali stishtha tishtha vicacalih
    | visha stva tva visho visha stva | sarva vanchantu vanchantu sarva ssarva vanchantu | nchantu vancha
    ntvasminn | nrashtragm rashtra masmi rashtra madhyadhi rashtragm rashtra madhi | adhi shraya shraya
    dhyadhi shraya | nnagre agre brihann | ushasa murdhva urdhva ushasa mushasa murdhvah | urdhvo astha
    dastha durdhva urdhvo asthat | nnirjagmiva nastha dastha ntamasa stamaso nirjagmiva nirjagmivaniti
    nih tamaso jyotisha jyotisha tamasa stamaso jyotisha | jyotisha ''jyotisha jyotisha | rbhanuna bhanuna
    'gni ragni bhanuna rushata rushata bhanuna bhanuna rushata | ssvango rushata rushata svangah | a jato
    jata a jatah | jato vishva vishva jato jato vishva vishva sadmani sadmani vishva vishva sadmani |
    apra ityaprah | ntvagm sida sida tvam | matu rasya asya matu asya upastha upasthe asya asya upasthe
    upasthe vishvani vishva nyupastha upasthe vishvani | nyagne agne vishvani vishva agne vayunani vayuna
    nyagne agne vayunani | vayunani vayunani vidvan | vidvaniti vidvan | ena marcisha 'rcishaina mena
    marcisha arcisha ma ma 'rcisha 'rcisha ma | ma tapasa tapasa ma ma tapasa | tapasa 'bhyabhi tapasa
    tapasa 'bhi | shshushuco abhyabhi shushucah | shushuco 'nta ranta anta rasya masya manta ranta rasyam
    | asyagm shukrajyoti shshukrajyoti rasya masyagm shukrajyotih | rvi vi shukrajyoti shukrajyotiriti
    shukra vi bhahi bhahi vi vi bhahi | anta ragne agne anta ranta ragne | agne ruca ruca 'gne agne ruca
    | ntvagm ruca ruca tvam | tva mukhaya ukhayai tva ukhayai sadane sadana ukhaya ukhayai sadane | sadane
    sve sve sadane sadane sve | ntasya stasya stvam | tvagm harasa harasa tva harasa harasa tapann | tapan
    jatavedo jataveda stapa shshivo jatavedo jataveda shivo bhutva bhutva shiva mbhutva bhutva mahya mahya
    magne agne mahya agne 'tho atho agne agne 'tho atho sida sidatho atho sida | shivah kritva kritva
    shiva kritva disho dishah kritva kritva dishah | a 'sado asada a 'sadah | shshucisha cchucisha ddhagmso
    hagmsa rvasuh shucisha cchucisha vasu rantarikshasa dantarikshasa rvasu rantarikshasat | antarikshasa
    ddhota hota 'ntarikshasa dantarikshasa ddhota antarikshasadityantariksha dvedisha ddhota hota vedishat
    | vedisha datithi ratithi dduronasa datithi ratithi duronasaditi durona dvyomasa dritasa dritasa vyomasa
    dabja abja vyomasa dvyomasa dabjah | abja goja goja abja abja gojah | goja ritaja ritaja goja goja
    ritajah | ritaja adrija adrija ritaja ritaja adrijah | adrija rita mrita madrija adrija ritam | brihaditi
    brihat | || diva spari pari divo diva spari | mpari pari prathamam | njajne jajne prathama jajne agni
    ragni rjajne jajne agnih | agni rasma dasma dagni ragni rasmat | ndvitiya masma dasma mpari pari dvitiya
    pari jataveda jatavedah pari pari jatavedah | jataveda iti jata tritiya maphsvaphsu tritiya aphsu
    nrimana nrimana aphsvaphsu nrimanah nrimana ajasra majasra nnrimana nrimana ajasram | ajasra mindhana
    indhano 'jasra majasra mindhanah | indhana ena mena mindhana indhana enam | njarate jarata ena mena
    rjarate jarate svadhih | vidma te te vidma vidma te te agne agne te te agne | agne tredha tredha 'gne
    agne tredha | tredha trayani trayani tredha tredha trayani | trayani vidma vidma trayani trayani vidma
    | vidma te te vidma vidma te te sadma sadma te te sadma | vi~bhritagm sadma sadma vibhritam | mpurutra
    purutra vibhritam vidma te te vidma vidma te te nama nama te te nama | nnama nama paramam | vi~dma
    vidma tam | ya~to yata uthsa muthsam yata ajagantha jagantha yato yata ajagantha | tva samudre samudre
    tva tva nrimana nrimana nrimana aphsvaphsu nrimana nrimana aphsu | aphsvanta ranta raphsva rnricaksha
    nricaksha anta ranta nricaksha idha idhe nricaksha nricaksha idhe | idhe divo diva idha idhe divah
    | divo agne agne divo divo agne | nnagne agna udhann | tva tva tritiye tritiye tva rajasi rajasi tva
    tva rajasi | || ntasthivagmsagm rajasi rajasi tasthivagmsa tasthivagmsa mritasya rtasya tasthivagmsa
    ntasthivagmsa mritasya | ritasya yonau yona vritasya rtasya yonau yonau mahisha mahisha yonau yonau
    mahishah | nmahisha mahisha ahinvann | ahinvannityahinvann | akranda dagni ragni rakranda dakranda
    dagnih | rdyau riveva dyauh | tkshama kshama rerihat | dvirudho virudho reriha virudho virudhah samanjann
    | sadyo jajnano jajnana ssadyo jajnanah | jajnano vi vi jajnano jajnano vi | hi migm hi him | i middha
    iddha imi middhah | iddho akhya dakhya diddha iddho akhyat | akhyada 'khya dakhyada | a rodasi rodasi
    a rodasi | rodasi bhanuna bhanuna rodasi rodasi bhanuna rodasi iti rodasi | bhanuna bhati bhati bhanuna
    bhanuna bhati | rbhati bhatyantah | kpavakah pavaka ushi gushi pavako arati raratih pavakah pavako
    aratih | ssumedha arati rarati sumedha marteshu marteshu sumedha ssumedha marteshu | agni ramrito
    amrito agni ragni ramritah | amrito ni nyamrito amrito ni | ni dhayi dhayi ni ni dhayi | ndhuma miyarti
    yarti dhumam | dbharibhra darusha marusha ucchukrena shukrenodu cchukrena | shukrena shocisha shocisha
    shukrena shukrena shocisha ndyagm shocisha shocisha dyam | dya minaksha dinaksha inakshaditinakshat
    | vishvasya ketuh ketu rvishvasya vishvasya ketuh | rbhuvanasya bhuvanasya ketuh ketu bhuvanasya garbho
    garbho bhuvanasya bhuvanasya garbhah | garbha a garbho garbha a | a rodasi rodasi a rodasi | || drodasi
    rodasi aprinat | rodasi iti rodasi | aprinaj jayamano jayamano 'prina daprinaj jayamanah | jayamana
    iti jayamanah | adri mabhina dabhina dadri madri mabhinat | dyaj jana jana yat | agni mayajanta yajantagni
    magni mayajanta | ayajanta panca panca yajanta yajanta panca | shrina mudara udara udaro dharuno dharuna
    udara udaro dharunah | dharuno rayinagm rayina ndharuno dharuno rayinam | mmanishanagm rayinagm rayina
    mprarpanah prarpano manishana ssomagopah prarpanah prarpana sahaso aphsvaphsu sahasa aphsu raja raja
    'phsvaphsu raja raja vi vi raja raja vi | vi bhati bhati vi vi bhati | bhatyagre agre bhati bhatyagre
    agra ushasa mushasa magre agra ushasa ushasa midhana idhana ushasa mushasa midhanah | ya ste te yo
    ya ste te adyadya te te adya | tkrinava dadyadya krinavat | dbhadrashoce bhadrashoce krinava bhadrashoce
    'pupa mapupa mbhadrashoce bhadrashoce 'pupam | bhadrashoca iti bhadra ndeva devapupa mapupa ndeva
    deva ghritavantam | ghritavanta magne agne ghritavanta ghritavantamiti ghrita nnaya naya prataram
    | va~syo vasyah pratara vasyo acchaccha vasyo vasyo accha | accha bhyabhyaccha cchabhi | ndyumna mabhyabhi
    dyumnam | ya~vishtha yavishtha devabhakta devabhaktamiti deva yavishtheti yavishtha | bhaja saushravaseshu
    saushravaseshu bhaja bhaja saushravaseshu | saushravase shvagne agne saushravaseshu saushravase shvagne
    | ukthe agne agna uktha bhaja shasyamane shasyamane bhaja bhaja shasyamane | shasyamana iti shasyamane
    | priyo agna 'gna priyah priyo agna | agna bhavati bhava tyagna 'gna bhavati | dbhavati bhava tyut
    | uj jatena jate noduj jatena | dbhinadaj jatena jatena bhinadat | rjanitvai ruduj janitvaih | janitvairiti
    janitvaih | tva magne agne tva agne yajamana yajamana agne agne yajamanah | yajamana anvanu yajamana
    yajamana anu | ndyu nan vanu dyun | vishva vishva dyu vishva vasuni vasuni vishva vishva vasuni |
    vasuni dadhire dadhire vasuni vasuni dadhire | dadhire varyani varyani dadhire dadhire varyani | varyaniti
    varyani | tvaya saha saha tvaya tvaya saha | ndravinagm saha saha dravinam | dravina micchamana icchamana
    dravina ndravina micchamanah | vra~ja micchamana icchamana vrajam | gomanta mushija ushijo gomanta
    ngomanta mushijah | ushijo vi vyushija ushijo vi | vavruriti vavruh | drishano rukmo rukmo drishano
    drishano rukmah | rukma urvyorvya rukmo rukma urvya | urvya vi vyurvyorvya vi | ayuh shriye shriya
    ayu rayuh shriye | shriye rucano rucana shshriye shriye rucanah | rucana iti rucanah | agni ramrito
    amrito agni ragni ramritah | amrito abhava dabhava damrito amrito abhavat | ssureta ajanaya dajanaya
    annapate 'nnasya nnasya nnapate 'nnapate 'nnasya | annasya no no annasya nnasya nah | no dehi dehi
    no no dehi | dehyanamivasya namivasya dehi dehyanamivasya | anamivasya shushminah shushmino 'namivasya
    namivasya shushminah | shushmina iti shushminah | mpra pra pradatara ntarisha starishah pradatara
    pradataramiti pra tarisha urja murja ntarisha starisha urja nno na urja murja no dhehi dhehi no no
    dhehi | dvipade dhehi dhehi dvipade dvipade catushpade catushpade dvipade dvipade catushpade | catushpada
    iti catuh udu vu vu du du | u tva tva vu tva | tva vishve vishve vishve deva deva vishve vishve devah
    | deva agne 'gne deva deva agne agne bharantu bhara ntvagne 'gne bharantu | bharantu cittibhi shcittibhi
    rbharantu bharantu cittibhih | cittibhiriti citti no bhava bhava no no bhava | shshivatamo bhava bhava
    shivatamah | supratiko vibhavasu ssupratiko vibhavasuh | vibhavasuriti vibha idagne agna ididagne
    | agne jyotishman jyotishma nagne agne jyotishman | yahi yahi jyotishman jyotishman yahi shivebhih
    shivebhi ryahi yahi shivebhih | shivebhi rarcibhi rarcibhih shivebhih shivebhi rarcibhih | ntva marcibhi
    rarcibhi stvam | brihadbhiriti brihat higmsi stanuva tanuva higmsir prajah praja stanuva tanuva samidha
    'gni magnigm samidha samidha 'gnim | nduvasyata duvasyatagni magni rduvasyata duvasyata ghritaih |
    rbodhayata bodhayata ghritai bodhayata tithi matithi mbodhayata bodhayata tithim | atithimityatithim
    | havya havya 'smi havya juhotana juhotana havya havya juhotana | juhotaneti juhotana | mprapra praprayam
    | aya magni ragni raya maya magnih | rbharatasya bharatasyagni ragni bharatasya shrinve shrinve bharatasya
    bharatasya shrinve | shrinve vi vi shrinve shrinve vi | na rocate rocate na na rocate | drocate rocate
    brihat | abhi yo yo abhyabhi yah | mpritanasu pritanasu puru pritanasu tasthau tasthau pritanasu pritanasu
    tasthau | tasthau didaya didaya tasthau tasthau didaya | didaya daivyo daivyo didaya didaya daivyah
    | daivyo atithi ratithi rdaivyo daivyo atithih | shshivo atithi ratithi rdevi rapa apo devih | devih
    prati prati devi prati grihnita grihnita prati prati grihnita | grihnita bhasma bhasma grihnita grihnita
    bhasma | thsyone syona eta deta syone syone krinuddhvam | krinuddhvagm surabhau surabhau krinuddhva
    nkrinuddhvagm surabhau | surabha vu vu surabhau surabha vu | u loke loka u vu loke | ntasmai tasmai
    namantam | njanayo janayo namanta rmata mata supatni mateveva mata mateva | mputra miveva putram |
    mbibhrita bibhrita putra bibhrita su su bibhrita bibhrita su | svena menagm su svenam | aphsvagne
    agne 'phsva ssadhi ragne agne sadhih | tava sa sa tava tava sah | || oshadhi ranvan voshadhi roshadhi
    ranu | anu ruddhyase ruddhyase anvanu ruddhyase | ruddhyasa iti ruddhyase | ngarbhe garbhe sann |
    rjayase jayase punah | garbho asyasi garbho garbho asi | asyoshadhina moshadhina masya syoshadhinam
    | ngarbho garbha oshadhina moshadhina garbho vanaspatinam ngarbho garbho vanaspatinam | vanaspatinamiti
    vanaspatinam | garbho vishvasya vishvasya garbho garbho vishvasya | vishvasya bhutasya bhutasya vishvasya
    vishvasya bhutasya | bhutasyagne 'gne bhutasya bhutasyagne agne garbho garbho 'gne 'gne garbhah |
    ngarbho garbho apam | apa masya syapa mapa masi | prasadya bhasmana bhasmana prasadya prasadya bhasmana
    | mbhasmana bhasmana yoni yoni mapo apo yonim apashca capo apashca | prithivi magne agne prithivi
    sagmsrijya matribhi rmatribhih sagmsrijya sagmsrijya matribhih | rmatribhi stvam | njyotishman jyotishma
    rjyotishman jyotishma punara punah punara | a 'sado asada a 'sadah | puna rasadya sadya punah puna
    rasadya | asadya sadanagm sadana masadya sadya sadanam | ssadanagm sadana mapah | apashca capo apashca
    | prithivi magne agne prithivi shsheshe sheshe matuh | yathopastha upasthe yatha yathopasthe upasthe
    'nta ranta rupastha upasthe 'ntah | anta rasya masya manta ranta rasyam | shshivatamo asya masyagm
    shivatamah | puna rurjorja punah puna rurja | ni vartasva vartasva ni ni vartasva | vartasva punah
    puna rvartasva vartasva punah | puna ragne 'gne punah puna ragne | isha ''yusha ''yushe shesha ''yusha
    | nah pahi pahi no nah pahi | pahi vishvato vishvata spahi pahi vishvatah | vishvata iti vishvatah
    | saha rayya rayya saha saha rayya | rayya ni ni rayya rayya ni | ni vartasva vartasva ni ni vartasva
    | vartasvagne 'gne vartasva vartasvagne agne pinvasva pinvasvagne 'gne pinvasva | pinvasva dharaya
    dharaya pinvasva pinvasva dharaya | vishvaphsniya vishvato vishvato vishvaphsniya vishvaphsniya vishvatah
    | vishvaphsniyeti vishva vishvata spari pari vishvato vishvata spari | puna stva tva punah puna stva
    | tva ''ditya aditya stva aditya rudra rudra aditya aditya rudrah | rudra vasavo vasavo rudra rudra
    vasavah | sa mindhata mindhatagm sagm sa mindhatam | mpunah puna rindhata mindhata brahmanah punah
    puna brahmano vasunitha vasunitha brahmano brahmano vasunitha | rvasunitha vasunitha yajnaih | yajnairiti
    yajnaih | nghritena ghritena tvam | ntanuva stanuva stva tanuvo vardhayasva vardhayasva tanuva stanuvo
    vardhayasva | ssatya vardhayasva vardhayasva satyah | ssantu santu satya santu yajamanasya yajamanasya
    santu santu yajamanasya | yajamanasya kamah kama yajamanasya yajamanasya kamah bodha no no bodha bodha
    nah | no asyasya no no asya | asya vacaso vacaso asyasya vacasah | vacaso yavishtha yavishtha vacaso
    vacaso yavishtha | yavishtha magmhishthasya magmhishthasya yavishtha yavishtha magmhishthasya | magmhishthasya
    prabhritasya prabhritasya magmhishthasya magmhishthasya prabhritasya | ssvadhavah prabhritasya prabhritasya
    svadhavah | svadhava iti svadha piyati tvastvah piyati piyati tvah | tvo anvanu tva stvo anu | anu
    tva stvo anvanu tvah | tvo grinati grinati tva stvo grinati | rgrinati grinati vandaruh | vandaru
    ste te vandaru vande agne agne vande vande agne | sa bodhi bodhi sa sa bodhi | rbodhi bodhi surih
    | rmaghava maghava suri maghava vasudava vasudava maghava maghava vasudava rvasudava vasudava vasupatih
