id: shivashatakam-4
category: shataka
name:
  english: shivashatakam 4
  devanagari: शिवशतकम् ४
content:
  english: purare mama kripanaih paridevitaprapancaih || 20|| sarasamapi varam na bhoktumihe hara mama
    shambalasancayam grihana | upadisha kataraddhi durayatrashramashamanam bhavavartmano'vasanam || 21||
    mama bhavapathikasya karmabhogyam pralayanishi tvamavekshathah shayaloh | tvayi sakalamakincano bubhushuh
    praharakavetanametadarpayami || 22|| shrutijanaka ratatyasau kumari tava duhita bahiretya neti neti
    | vyavahita nikatasthite'pi tasmattvayi milite'pi mamatitheh kva bhogah || 23|| aparimitavibhagabhumirekastvamasi
    tato jagadandabindurasit | iti bhuvanabharaikadhurya jane dasha kakubho ganitakramena siddhah || 24||
    kathaya ka iva digviparyaye'pi prabhavati gantumatah kva samsareyam | bhava bhavapathikasya ko'pyapurvastvamahamiti
    prasrito mama pramohah || 25|| mayi paramavibhau vishuddhasattve yadiha shariratadatmatamadhasih |
    nigamapurusha tatpratikriyayai tvayi nidadhami samastavastvabhedam || 26|| nibidajadatadatmatapramoham
    vimalayati tvadabhedavibhramo mam | prakritimupanayanti varidhanim katakarajamsi rajo'ntarapakarshat
    || 27|| puri puri viharamahe bhramantah purahara pashyasi bhogavancito'sman | kimiti na viharamahe
    nathavanto vayamitare tvamanatha eka eva || 28|| svapishi na parakarmasu prasaktah paramupabhojayatastava
    kva bhogah | paracaritamavaishi nirnimeshah prakritidaridra na ko'pi pashyati tvam || 29|| prakriticatula
    sukshmabhutasheshe prakritivikaranikocabhaji kale | avirataparivrittikhedakhinne svapiti jane pratibudhyase
    tvamekah || 30|| pralayadahanadagdhasheshapiluprakarashilonchapavitravrittiradau | ghatayasi bhuvanani
    teshu jivaprakriticalaih paramanubhih shariram || 31|| janasharana sharirinam prasriptaih karanaganairupalabhyacetananam
    | katicana janurantaranubhutiprasrimaravasanaya smritih prasushe || 32|| atishayitavibuddhavatpuranah
    smarati munirnigamam hiranyagarbhah | gaganapavanasannipatakarta kathayasi va karananapeksha eva ||
    33|| atha kritakakalevaradvayena vyavaharata ca nideshadayina ca | avagamitapadapravrittimadau kavayasi
    lokahitaya sampradayam || 34|| hitavidhikapatannisargamudhaprakritirasavahitannivartaniyah | iti vishamatame'pi
    samvidhane ganayatu kastava natha kaushalani || 35|| bhavatu vidhirapurvakaryatattvashayahitasadhanatabhidhasu
    kashcit | tadapi mushitadoshamantara tvam na bhavitumarhati codana pramanam || 36|| prabhavati paramapta
    yo durantadapasaranaya hite pravartanaya | saha carati caturbhirarthavadairnigamakave sa tavaiva suktasarah
    || 37|| ajinamusalavediyupashamyadrishadupalasphyahavihkapalashurpaih | atha guruyajamanagatrihotriprabhritibhiradhvarakarmasu
    tvamijyah || 38|| vikirati parito ghanavaliva shrutiramritani tavashayadudasya | vilayamayamupaiti
    citsamudra tvayi jagato nigamasya citpravahah || 39|| abhisarati param param purare vishayamanekamapasya
    purvapurvam | varunanilayamapageva yavadbhajati bhavantamasau na cittavrittih || 40|| gunaganamapaniya
    cittakupe mama nigamaih sahasa nipatito'si | amritakalasha tishtha tishtha manye punarapi jivanamuddharishyase
    nah || 41|| prathamasamayasangamaya naitajjagadupajivati kevalam bhavantam | bhavatu satatasantamantara
    tvam kathamanidamprathama'pi vastusatta || 42|| pravahapavanavegaghattito'pi skhalati na yajjagadandapindabharah
    | laghugurutulanatulaprakanda dradhimagunah sa bhavadgunatrayasya || 43|| tvamakhilajagadisha shadbhirangairupacitavedamajijanah
    shadangam | kathaya kathamasavupaitvasattam satatasato bhavatah svatah prapancah || 44|| vishakalitamanuvrajannicitya
    sthapatiriva tvamajighatah prapancam | vibhurasi na ca yujyase vikaraistvayi samavaitu katham sa bhutasargah
    || 45|| na jagadidamahetuto na shunyadavadhimatam kathamudbhavo'stvakasmat | prakritiriyamadharmadharmarupa
    purushagunah kathamarabheta vishvam || 46|| svaparaparicayandhyahetumetam shiva bhavadavaraniyamandhakaram
    | shamayati jagadandabinduvrindambuda bhavadekapada vivekavidyut || 47|| smarasi kathamananyadeva
    vrittam prabhavakathavidhuram nijamavastham | punarapi na cirajjanardana tvam na paricarishyati cetano
    dvitiyah || 48|| nimishaparicito hare samulam harasi visheshagunavrajam parasya | prathayasi khalatamimamapurvam
    kathayasi yadvigunatvamatmano'pi || 49|| alamavagalitendriyapravrittestava jaratah purushasya jagarena
    | ayamahamadhuna prabuddhyamanah purushavikarakarim nihanmi mayam || 50|| asakridanatadasmita nati
    me nihitapada mashake matangaje ca | dhruvamupari tavadhirokshyatiyam bhava mahato'pi mahananoraniyan
    || 51|| vilayamupajagama cedakhandastvayi jaratho jagadandagulmapindah | kshapayasi tadapi kshapamanidrah
    katibhirasau hi bubhushati prarohaih || 52|| vikirati paradrishtivancanaya tvadupari vishtapasarshapanavidya
    | tadapi nimishamatranirgato'pi pravishati bhutagano bhavantameva || 53|| asakriduparamadbhirankabhedairnatagananishkramanadviviktarangah
    | aviditamukhasandhiramukhanto nigamakavestava natakaprabandhah || 54|| bhramayasi jagatastvameva
    samjnaparicayasamskritirupavedanabhih | sadasadatadapodhavastucintakritiriti kalpayase vivekavedyam
    || 55|| tvamamrita vishayapraveshabhumau bhavasi drishah pathi yasya sa dvitiyam | jagati na paripashyati
    sma jihma smarahara drishtivishadhika gatiste || 56|| druhinabhavanapadmabijamalamaniparivartanatatparatmanaste
    | grasitumakhilameva jantujatam vijanayato vidita bidalavrittih || 57|| aparimitakriternirashrayasya
    bhramarahitasya nirastaceshtitasya | drishadudaradarishu darduranam ghatanapatostava kidrisham shariram
    || 58|| bhuvanabhavanabhasanapradipa nyapatadasau tvayi cetanapatangi | kshanamadhikamadipyata jvalanti
    punarajahatprathamamapi svasattam || 59|| dhruvamiyamapavargaratrisandhya bhavati yatastvayi nirbharo'nuragah
    | rucimaya caramo'yamanjaliste nanu naciradbhavita bhavanadrishyah || 60|| yadapi tava vashe mamendriyani
    shrutivishayavadhivartamanadrishteh | mukhamasi jagatastathapi natha shrutimukurena vina na veditase
    || 61|| matidhanamitare sudirghanidrapravanadhiyastvayi nikshipantyatantre | upaharanasusancito na
    jatu vyayamupagacchati cetananidhiste || 62|| kvacidapi vishame tvaya niyujya sthitimanavapya cirasya
    samsarami | bhavagirisaridasmi citsamudra svamapi jahami tada labhe yadi tvam || 63|| bhagavati niyate
    vidurayatrasahacari samsaranadhvano'yamantah | jarati virama nihsahasi samvinnagaramatahparamadvayopabhogyam
    || 64|| vilikhatu kathamaksharani bhale sa vidhiradrishtapadarthalekhadakshah | mama hi militamakshapadapadapranipatanena
    lalatasimni cakshuh || 65|| uduni mayi rave prakashalesham vyavadhivashadaparikshito nyadhasih | tamapaharasi
    sannikarshametya tvadupari tarhi nijam vapustyajami || 66|| bhavapathapathiko'smi vatapataccara milito'si
    vilunthya sampado me | ahamapi bhavadantaram pravishya dhruvamacirena harami te vibhutih || 67|| shrutirasi
    purusharthasannibaddhastava carane prathame viraumi vatsah | amaragavi sa dogdhi kasya hetoramritamabhoktari
    purtibhaji bhande || 68|| shiva tava mama cantaralabhumau vividhavidham vyavadham vyadhadvidhata |
    tadapi hi bhavato'hameva bhittirbhavati vritih sadanasya najirasya || 69|| vyavadhirupararama bhurvibhakta
    prabhavasi gudhamatirna mam prahartum | tadahamahamikahridekasheshavadhiradhuna dhruvamavayorvimardah
    || 70|| na dharanirupari prayati nadhah patati na ca plavate na bambhramiti | na ca divi vasati svashaktiyogadapi
    tu bhavanacalasthiratvahetuh || 71|| avishamacaturasrashadvibhagam na srijasi kandukanistalam na sushe
    | ghatayasi prithivimimam khacakrabhramanakulala vishaladarpanabham || 72|| purahara paradrishtidoshashantyai
    kati jagadandakagandakanbibharshi | tvadupari paripatayanti drishtim vijahati sarvamakincana bhavanti
    || 73|| parapuramabhivishya sarvalokam bhramayasi sarvadineshu bhutavargah | bhavapitrivanavatabodhivriksha
    pralayanishasu niliya sevate tvam || 74|| grahagrihasarasiruhasya rahubhramaravimardasaharkakarnikasya
    | bhramanamidamabhivyanakti lilam tava ghatitam dhruvanalaghattanaya || 75|| sakalagunagano mamornanabhervilayamupaiti
    vitayate ca bhuyah | patujanajadatapaharahetoh kshanamapi na kshamase kshayam gunanam || 76|| na khalu
    vighatitah punarghatante na ca ghatitah sthirasangatam shrayante | pipatishumavasham rujanti vamshyastatatarumapa
    ivapaganakasya || 77|| vigataviparilopadrishti pashyanvashayasi yam purushaprakanda mayam | prakriticapalaya
    taya vikarairbahuvidhavarnikaya vashikrito'smi || 78|| prakriticapalapilubijavarge dalati khagolakushulaviprakirnam
    | aghatitamitaretarena kalpakshayarajanau samacikalastvamekah || 79|| svaputapatalamabhyajiryadashavritiradalanniravadravipradipah
    | pralayamavanivastvagattathapi kva jagadagaragrihastha nishyavatsih || 80|| prasarati vishayeshu
    yeshu ragah parinamate virateshu teshu shokah | tvayi rucirucita nitantakante gunaparipakashucamagocaro'si
    || 81|| pratigrihamatithirgrihitadando dhritajagadandakamandaluprakandah | bhuvanavahana patramatrashesham
    satrinamimam jagadatti kalabhikshuh || 82|| prasabhanivishamanakalasarpapratihatanirgamane khagolanide
    | bahuvidhagatayo viviktajayasutajananitanavah khaga bhramanti || 83|| abhilapitamathanucintitam yo
    hridayaguhashayitah sha
  devanagari: पुरारे मम कृपणैः परिदेवितप्रपञ्चैः ॥ २०॥ सरसमपि वरं न भोक्तुमीहे हर मम शम्बलसञ्चयं गृहाण
    । उपदिश कतरद्धि दूरयात्राश्रमशमनं भववर्त्मनोऽवसानम् ॥ २१॥ मम भवपथिकस्य कर्मभोग्यं प्रलयनिशि त्वमवेक्षथाः
    शयालोः । त्वयि सकलमकिञ्चनो बुभूषुः प्रहरकवेतनमेतदर्पयामि ॥ २२॥ श्रुतिजनक रटत्यसौ कुमारी तव दुहिता
    बहिरेत्य नेति नेति । व्यवहित निकटस्थितेऽपि तस्मात्त्वयि मिलितेऽपि ममातिथेः क्व भोगः ॥ २३॥ अपरिमितविभागभूमिरेकस्त्वमसि
    ततो जगदण्डबिन्दुरासीत् । इति भुवनभरैकधुर्य जाने दश ककुभो गणितक्रमेण सिद्धाः ॥ २४॥ कथय क इव दिग्विपर्ययेऽपि
    प्रभवति गन्तुमतः क्व संसरेयम् । भव भवपथिकस्य कोऽप्यपूर्वस्त्वमहमिति प्रसृतो मम प्रमोहः ॥ २५॥ मयि परमविभौ
    विशुद्धसत्त्वे यदिह शरीरतदात्मतामधासीः । निगमपुरुष तत्प्रतिक्रियायै त्वयि निदधामि समस्तवस्त्वभेदम्
    ॥ २६॥ निबिडजडतदात्मताप्रमोहं विमलयति त्वदभेदविभ्रमो माम् । प्रकृतिमुपनयन्ति वारिधानीं कतकरजांसि रजोऽन्तरापकर्षात्
    ॥ २७॥ पुरि पुरि विहरामहे भ्रमन्तः पुरहर पश्यसि भोगवञ्चितोऽस्मान् । किमिति न विहरामहे नाथवन्तो वयमितरे
    त्वमनाथ एक एव ॥ २८॥ स्वपिषि न परकर्मसु प्रसक्तः परमुपभोजयतस्तव क्व भोगः । परचरितमवैषि निर्निमेषः प्रकृतिदरिद्र
    न कोऽपि पश्यति त्वाम् ॥ २९॥ प्रकृतिचटुल सूक्ष्मभूतशेषे प्रकृतिविकारनिकोचभाजि काले । अविरतपरिवृत्तिखेदखिन्ने
    स्वपिति जने प्रतिबुध्यसे त्वमेकः ॥ ३०॥ प्रलयदहनदग्धशेषपीलुप्रकरशिलोञ्छपवित्रवृत्तिरादौ । घटयसि भुवनानि
    तेषु जीवप्रकृतिचलैः परमाणुभिः शरीरम् ॥ ३१॥ जनशरण शरीरिणां प्रसृप्तैः करणगणैरुपलभ्यचेतनानाम् । कतिचन
    जनुरन्तरानुभूतिप्रसृमरवासनया स्मृतीः प्रसूषे ॥ ३२॥ अतिशयितविबुद्धवत्पुराणः स्मरति मुनिर्निगमं हिरण्यगर्भः
    । गगनपवनसन्निपातकर्ता कथयसि वा करणानपेक्ष एव ॥ ३३॥ अथ कृतककलेवरद्वयेन व्यवहरता च निदेशदायिना च । अवगमितपदप्रवृत्तिमादौ
    कवयसि लोकहिताय सम्प्रदायम् ॥ ३४॥ हितविधिकपटान्निसर्गमूढप्रकृतिरसावहितान्निवर्तनीयः । इति विषमतमेऽपि
    संविधाने गणयतु कस्तव नाथ कौशलानि ॥ ३५॥ भवतु विधिरपूर्वकार्यतत्त्वाशयहितसाधनताभिधासु कश्चित् । तदपि
    मुषितदोषमन्तरा त्वां न भवितुमर्हति चोदना प्रमाणम् ॥ ३६॥ प्रभवति परमाप्त यो दुरन्तादपसरणाय हिते प्रवर्तनाय
    । सह चरति चतुर्भिरर्थवादैर्निगमकवे स तवैव सूक्तसारः ॥ ३७॥ अजिनमुसलवेदियूपशम्यादृषदुपलस्फ्यहविःकपालशूर्पैः
    । अथ गुरुयजमानगातृहोतृप्रभृतिभिरध्वरकर्मसु त्वमिज्यः ॥ ३८॥ विकिरति परितो घनावलीव श्रुतिरमृतानि तवाशयादुदस्य
    । विलयमयमुपैति चित्समुद्र त्वयि जगतो निगमस्य चित्प्रवाहः ॥ ३९॥ अभिसरति परं परं पुरारे विषयमनेकमपास्य
    पूर्वपूर्वम् । वरुणनिलयमापगेव यावद्भजति भवन्तमसौ न चित्तवृत्तिः ॥ ४०॥ गुणगणमपनीय चित्तकूपे मम निगमैः
    सहसा निपातितोऽसि । अमृतकलश तिष्ठ तिष्ठ मन्ये पुनरपि जीवनमुद्धरिष्यसे नः ॥ ४१॥ प्रथमसमयसङ्गमाय नैतज्जगदुपजीवति
    केवलं भवन्तम् । भवतु सततसन्तमन्तरा त्वां कथमनिदम्प्रथमाऽपि वस्तुसत्ता ॥ ४२॥ प्रवहपवनवेगघट्टितोऽपि
    स्खलति न यज्जगदण्डपिण्डभारः । लघुगुरुतुलनातुलाप्रकाण्ड द्रढिमगुणः स भवद्गुणत्रयस्य ॥ ४३॥ त्वमखिलजगदीश
    षड्भिरङ्गैरुपचितवेदमजीजनः षडङ्गम् । कथय कथमसावुपैत्वसत्तां सततसतो भवतः स्वतः प्रपञ्चः ॥ ४४॥ विशकलितमनुव्रजन्निचित्य
    स्थपतिरिव त्वमजीघटः प्रपञ्चम् । विभुरसि न च युज्यसे विकारैस्त्वयि समवैतु कथं स भूतसर्गः ॥ ४५॥ न जगदिदमहेतुतो
    न शून्यादवधिमतां कथमुद्भवोऽस्त्वकस्मात् । प्रकृतिरियमधर्मधर्मरूपा पुरुषगुणः कथमारभेत विश्वम् ॥ ४६॥
    स्वपरपरिचयान्ध्यहेतुमेतं शिव भवदावरणीयमन्धकारम् । शमयति जगदण्डबिन्दुवृन्दाम्बुद भवदेकपदा विवेकविद्युत्
    ॥ ४७॥ स्मरसि कथमनन्यदेव वृत्तां प्रभवकथाविधुरां निजामवस्थाम् । पुनरपि न चिराज्जनार्दन त्वां न परिचरिष्यति
    चेतनो द्वितीयः ॥ ४८॥ निमिषपरिचितो हरे समूलं हरसि विशेषगुणव्रजं परस्य । प्रथयसि खलतामिमामपूर्वां कथयसि
    यद्विगुणत्वमात्मनोऽपि ॥ ४९॥ अलमवगलितेन्द्रियप्रवृत्तेस्तव जरतः पुरुषस्य जागरेण । अयमहमधुना प्रबुद्ध्यमानः
    पुरुषविकारकरीं निहन्मि मायाम् ॥ ५०॥ असकृदनटदस्मिता नटी मे निहितपदा मशके मतङ्गजे च । ध्रुवमुपरि तवाधिरोक्ष्यतीयं
    भव महतोऽपि महानणोरणीयान् ॥ ५१॥ विलयमुपजगाम चेदखण्डस्त्वयि जरठो जगदण्डगुल्मपिण्डः । क्षपयसि तदपि क्षपामनिद्रः
    कतिभिरसौ हि बुभूषति प्ररोहैः ॥ ५२॥ विकिरति परदृष्टिवञ्चनाय त्वदुपरि विष्टपसर्षपानविद्या । तदपि निमिषमात्रनिर्गतोऽपि
    प्रविशति भूतगणो भवन्तमेव ॥ ५३॥ असकृदुपरमद्भिरङ्कभेदैर्नटगणनिष्क्रमणाद्विविक्तरङ्गः । अविदितमुखसन्धिरामुखान्तो
    निगमकवेस्तव नाटकप्रबन्धः ॥ ५४॥ भ्रमयसि जगतस्त्वमेव संज्ञापरिचयसंस्कृतिरूपवेदनाभिः । सदसदतदपोढवस्तुचिन्ताकृतिरिति
    कल्पयसे विवेकवेद्यम् ॥ ५५॥ त्वममृत विषयप्रवेशभूमौ भवसि दृशः पथि यस्य स द्वितीयम् । जगति न परिपश्यति
    स्मा जिह्मा स्मरहर दृष्टिविषाधिका गतिस्ते ॥ ५६॥ द्रुहिणभवनपद्मबीजमालामणिपरिवर्तनतत्परात्मनस्ते । ग्रसितुमखिलमेव
    जन्तुजातं विजनयतो विदिता बिडालवृत्तिः ॥ ५७॥ अपरिमितकृतेर्निराश्रयस्य भ्रमरहितस्य निरस्तचेष्टितस्य
    । दृषदुदरदरीषु दर्दुराणां घटनपटोस्तव कीदृशं शरीरम् ॥ ५८॥ भुवनभवनभासनप्रदीप न्यपतदसौ त्वयि चेतनापतङ्गी
    । क्षणमधिकमदीप्यत ज्वलन्ती पुनरजहात्प्रथमामपि स्वसत्ताम् ॥ ५९॥ ध्रुवमियमपवर्गरात्रिसन्ध्या भवति यतस्त्वयि
    निर्भरोऽनुरागः । रुचिमय चरमोऽयमञ्जलिस्ते ननु नचिराद्भविता भवानदृश्यः ॥ ६०॥ यदपि तव वशे ममेन्द्रियाणि
    श्रुतिविषयावधिवर्तमानदृष्टेः । मुखमसि जगतस्तथापि नाथ श्रुतिमुकुरेण विना न वेदितासे ॥ ६१॥ मतिधनमितरे
    सुदीर्घनिद्राप्रवणधियस्त्वयि निक्षिपन्त्यतन्त्रे । उपहरणसुसञ्चितो न जातु व्ययमुपगच्छति चेतनानिधिस्ते
    ॥ ६२॥ क्वचिदपि विषमे त्वया नियुज्य स्थितिमनवाप्य चिरस्य संसरामि । भवगिरिसरिदस्मि चित्समुद्र स्वमपि
    जहामि तदा लभे यदि त्वाम् ॥ ६३॥ भगवति नियते विदूरयात्रासहचरि संसरणाध्वनोऽयमन्तः । जरति विरम निःसहासि
    संविन्नगरमतःपरमद्वयोपभोग्यम् ॥ ६४॥ विलिखतु कथमक्षराणि भाले स विधिरदृष्टपदार्थलेखदक्षः । मम हि मिलितमक्षपादपादप्रणिपतनेन
    ललाटसीम्नि चक्षुः ॥ ६५॥ उडुनि मयि रवे प्रकाशलेशं व्यवधिवशादपरीक्षितो न्यधासीः । तमपहरसि सन्निकर्षमेत्य
    त्वदुपरि तर्हि निजं वपुस्त्यजामि ॥ ६६॥ भवपथपथिकोऽस्मि वाटपाटच्चर मिलितोऽसि विलुण्ठ्य सम्पदो मे । अहमपि
    भवदन्तरं प्रविश्य ध्रुवमचिरेण हरामि ते विभूतीः ॥ ६७॥ श्रुतिरसि पुरुषार्थसन्निबद्धस्तव चरणे प्रथमे
    विरौमि वत्सः । अमरगवि स दोग्धि कस्य हेतोरमृतमभोक्तरि पूर्तिभाजि भाण्डे ॥ ६८॥ शिव तव मम चान्तरालभूमौ
    विविधविधां व्यवधां व्यधाद्विधाता । तदपि हि भवतोऽहमेव भित्तिर्भवति वृतिः सदनस्य नाजिरस्य ॥ ६९॥ व्यवधिरुपरराम
    भूर्विभक्ता प्रभवसि गूढमतिर्न मां प्रहर्तुम् । तदहमहमिकाहृदेकशेषावधिरधुना ध्रुवमावयोर्विमर्दः ॥ ७०॥
    न धरणिरुपरि प्रयाति नाधः पतति न च प्लवते न बम्भ्रमीति । न च दिवि वसति स्वशक्तियोगादपि तु भवानचलास्थिरत्वहेतुः
    ॥ ७१॥ अविषमचतुरस्रषड्विभागां न सृजसि कन्दुकनिस्तलां न सूषे । घटयसि पृथिवीमिमां खचक्रभ्रमणकुलाल विशालदर्पणाभाम्
    ॥ ७२॥ पुरहर परदृष्टिदोषशान्त्यै कति जगदण्डकगण्डकान्बिभर्षि । त्वदुपरि परिपातयन्ति दृष्टिं विजहति सर्वमकिञ्चना
    भवन्ति ॥ ७३॥ परपुरमभिविश्य सर्वलोकं भ्रमयसि सर्वदिनेषु भूतवर्गः । भवपितृवनवाटबोधिवृक्ष प्रलयनिशासु
    निलीय सेवते त्वाम् ॥ ७४॥ ग्रहगृहसरसीरुहस्य राहुभ्रमरविमर्दसहार्ककर्णिकस्य । भ्रमणमिदमभिव्यनक्ति लीलां
    तव घटितां ध्रुवनालघट्टनाय ॥ ७५॥ सकलगुणगणो ममोर्णनाभेर्विलयमुपैति वितायते च भूयः । पटुजनजडतापहारहेतोः
    क्षणमपि न क्षमसे क्षयं गुणानाम् ॥ ७६॥ न खलु विघटिताः पुनर्घटन्ते न च घटिताः स्थिरसङ्गतां श्रयन्ते
    । पिपतिषुमवशं रुजन्ति वंश्यास्तटतरुमाप इवापगाणकस्य ॥ ७७॥ विगतविपरिलोपदृष्टि पश्यन्वशयसि यां पुरुषप्रकाण्ड
    मायाम् । प्रकृतिचपलया तया विकारैर्बहुविधवर्णिकया वशीकृतोऽस्मि ॥ ७८॥ प्रकृतिचपलपीलुबीजवर्गे दलति खगोलकुशूलविप्रकीर्णम्
    । अघटितमितरेतरेण कल्पक्षयरजनौ समचीकलस्त्वमेकः ॥ ७९॥ स्वपुटपटलमभ्यजीर्यदाशावृतिरदलन्निरवाद्रविप्रदीपः
    । प्रलयमवनिवास्त्वगात्तथापि क्व जगदगारगृहस्थ निश्यवात्सीः ॥ ८०॥ प्रसरति विषयेषु येषु रागः परिणमते
    विरतेषु तेषु शोकः । त्वयि रुचिरुचिता नितान्तकान्ते गुणपरिपाकशुचामगोचरोऽसि ॥ ८१॥ प्रतिगृहमतिथिर्गृहीतदण्डो
    धृतजगदण्डकमण्डलुप्रकाण्डः । भुवनवहन पात्रमात्रशेषं सतृणमिमं जगदत्ति कालभिक्षुः ॥ ८२॥ प्रसभनिविशमानकालसर्पप्रतिहतनिर्गमने
    खगोलनीडे । बहुविधगतयो विविक्तजायासुतजननीतनवः खगा भ्रमन्ति ॥ ८३॥ अभिलपितमथानुचिन्तितं यो हृदयगुहाशयितः
    श
