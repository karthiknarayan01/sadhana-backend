id: uddhava-geetha-chapter-7
category: stotram
name:
  english: Uddhava Geetha - Chapter 7
content:
  english: atha saptamo'dhyayah | shri bhagavan uvaca | yat attha mam mahabhaga tat cikirshitam eva me
    | brahma bhavah lokapalah svarvasam me abhikankshinah || || maya nishpaditam hi atra devakaryam asheshatah
    | yadartham avatirnah aham amshena brahmanarthitah || || kulam vai shapanirdagdham nankshyati anyonyavigrahat
    | samudrah saptame ahnhyetam purim ca plavayishyati || || yah hi eva ayam maya tyaktah lokah ayam
    nashtamangalah | bhavishyati acirat sadho kalina'pi nirakritah || || na vastavyam tvaya eva iha maya
    tyakte mahitale | janah adharmarucih bhadrah bhavishyati kalau yuge || || tvam tu sarvam parityajya
    sneham svajanabandhushu | mayi aveshya manah samyak samadrik vicarasva gam || || yat idam manasa vaca
    cakshurbhyam shravanadibhih | nashvaram grihyamanam ca viddhi mayamanomayam || || pumsah ayuktasya
    nanarthah bhramah sah gunadoshabhak | karmakarmavikarma iti gunadoshadhiyah bhida || || tasmat yuktaindriyagramah
    yuktacittah idam jagat | atmani ikshasva vitatam atmanam mayi adhishvare || || jnanavijnanasamyuktah
    atmabhutah sharirinam | atmanubhavatushtatma na antarayaih vihanyase || || doshabuddhya ubhayatitah
    nishedhat na nivartate | gunabuddhya ca vihitam na karoti yatha arbhakah || || sarvabhutasuhrit shantah
    jnanavijnananishcayah | pashyan madatmakam vishvam na vipadyeta vai punah || || shri shukah uvaca
    | iti adishtah bhagavata mahabhagavatah nripa | uddhavah pranipatya aha tattvajijnasuh acyutam ||
    || uddhavah uvaca | yogesha yogavinnyasa yogatma yogasambhava | nihshreyasaya me proktah tyagah sannyasalakshanah
    || || tyagah ayam dushkarah bhuman kamanam vishayatmabhih | sutaram tvayi sarvatman na abhaktaih iti
    me matih || || sah aham mama aham iti mudhamatih vigadhah tvat mayaya viracita atmani sanubandhe |
    tat tu anjasa nigaditam bhavata yatha aham samsadhayami bhagavan anushadhi bhrityam || || satyasya
    te svadrishah atmanah atmanah anyam vaktaram isha vibudheshu api na anucakshe | sarve vimohitadhiyah
    tava mayaya ime brahmadayah tanubhritah bahih arthabhavah || || tasmat bhavantam anavadyam anantaparam
    sarvajnam ishvaram akunthavikunthadhishni ayam | nirvinnadhih aham u ha vrijanabhitaptah narayanam
    narasakham sharanam prapadye || || shri bhagavan uvaca | prayena manuja loke lokatattvavicakshanah
    | samuddharanti hi atmanam atmana eva ashubhashayat || || atmanah guruh atma eva purushasya visheshatah
    | yat pratyaksha anumanabhyam shreyah asau anuvindate || || purushatve ca mam dhirah sankhyayogavisharadah
    | avistaram prapashyanti sarvashakti upabrimhitam || || ekadvitricatushpadah bahupadah tatha apadah
    | bahvyah santi purah srishtah tasam me paurushi priya || || atra mam margayantyaddhah yuktah hetubhih
    ishvaram | grihyamanaih gunaih lingaih agrahyam anumanatah || || atra api udaharanti imam itihasam
    puratanam | avadhutasya samvadam yadoh amitatejasah || avadhutam dvijam kancit carantam akutobhayam
    | kavim nirikshya tarunam yaduh papraccha dharmavit || || yaduh uvaca | kutah buddhih iyam brahman
    akartuh suvisharada | yam asadya bhavan lokam vidvan carati balavat || || prayah dharmarthakameshu
    vivitsayam ca manavah | hetuna eva samihante ayushah yashasah shriyah || || tvam tu kalpah kavih dakshah
    subhagah amritabhashanah | na karta nehase kincit jadaunmattapishacavat || || janeshu dahyamaneshu
    kamalobhadavagnina | na tapyase agnina muktah gangambhasthah iva dvipah || || tvam hi nah pricchatam
    brahman atmani anandakaranam | bruhi sparshavihinasya bhavatah kevala atmanah || || shri bhagavan
    uvaca | yaduna evam mahabhagah brahmanyena sumedhasa | prishtah sabhajitah praha prashraya avanatam
    dvijah || || brahmanah uvaca | santi me guravah rajan bahavah buddhya upashritah | yatah buddhim upadaya
    muktah atami iha tan shrunu || || prithivi vayuh akasham apah agnih candrama ravih | kapotah ajagarah
    sindhuh patangah madhukrid gajah || || madhuha harinah minah pingala kurarah arbhakah | kumari sharakrit
    sarpah urnanabhih supeshakrit || || ete me guravah rajan caturvimshatih ashritah | shiksha vrittibhih
    etesham anvashiksham iha atmanah || || yatah yat anushikshami yatha va nahushatmaja | tat tatha purushavyaghra
    nibodha kathayami te || || bhutaih akramanah api dhirah daivavashanugaih | tat vidvan na calet margat
    anvashiksham kshiteh vratam || || shashvat pararthasarvehah parartha ekantasambhavah | sadhuh shiksheta
    bhubhrittah nagashishyah paratmatam || || pranavrittya eva santushyet munih na eva indriyapriyaih
    | jnanam yatha na nashyeta na avakiryeta vanmanah || || vishayeshu avishan yogi nanadharmeshu sarvatah
    | gunadoshavyapeta atma na vishajjeta vayuvat || || parthiveshu iha deheshu pravishtah tat gunashrayah
    | gunaih na yujyate yogi gandhaih vayuh iva atmadrik || || antah hitah ca sthirajangameshu brahma
    atmabhavena samanvayena | vyaptya avacchedam asangam atmanah munih nabhah tvam vitatasya bhavayet
    || || tejah abannamayaih bhavaih megha adyaih vayuna iritaih | na sprishyate nabhah tadvat kalasrishtaih
    gunaih puman || || svacchah prakrititah snigdhah madhuryah tirthabhuh nrinam | munih punati apam mitram
    iksha upasparshakirtanaih || || tejasvi tapasa diptah durdharshaudarabhajanah | sarvabhakshah api
    yukta atma na adatte malam agnivat || || kvacit shannah kvacit spashtah upasyah shreyah icchatam |
    bhunkte sarvatra datrinam dahan prak uttara ashubham || || svamayaya srishtam idam sat asat lakshanam
    vibhuh | pravishtah iyate tat tat svarupah agnih iva edhasi || || visargadyah shmashanantah bhavah
    dehasya na atmanah | kalanam iva candrasya kalena avyaktavartmana || || kalena hi oghavegena bhutanam
    prabhava api ayau | nityau api na drishyete atmanah agneh yatha arcisham || || gunaih gunan upadatte
    yathakalam vimuncati | na teshu yujyate yogi gobhih gah iva gopatih || || budhyate svena bhedena vyaktisthah
    iva tat gatah | lakshyate sthulamatibhih atma ca avasthitah arkavat || || na atisnehah prasangah va
    kartavyah kva api kenacit | kurvan vindeta santapam kapotah iva dinadhih || || kapotah kashcana aranye
    kritanidah vanaspatau | kapotya bharyaya sardham uvasa katicit samah || || kapotau snehagunitahridayau
    grihadharminau | drishtim drishtyangam angena buddhim buddhya babandhatuh || || shayyasanatanasthanavartakridashanadikam
    | mithunibhuya visrabdhau ceratuh vanarajishu || || yam yam vanchati sa rajan tarpayanti anukampita
    | tam tam samanayat kamam kricchrena api ajitaindriyah || || kapoti prathamam garbham grihnati kalah
    agate | andani sushuve nide svapatyuh sannidhau sati || || teshu kale vyajayanta racitavayava hareh
    | shaktibhih durvibhavyabhih komalangatanuruhah || || prajah pupushatuh pritau dampati putravatsalau
    | sha rinvantau kujitam tasam nirvritau kalabhashitaih || || tasam patatraih susparshaih kujitaih
    mugdhaceshtitaih | pratyudgamaih adinanam pitarau mudam apatuh || || snehanubaddhahridayau anyonyam
    vishnumayaya | vimohitau dinadhiyau shishun pupushatuh prajah || || ekada jagmatuh tasam annartham
    tau kutumbinau | paritah kanane tasmin arthinau ceratuh ciram || || drishtva tan lubdhakah kashcit
    yadriccha atah vanecarah | jagrihe jalam atatya caratah svalayantike || || kapotah ca kapoti ca prajaposhe
    sada utsukau | gatau poshanam adaya svanidam upajagmatuh || || kapoti svatmajan vikshya balakan jalasamvritan
    | tan abhyadhavat kroshanti kroshatah bhrishaduhkhita || || sa asakrit snehagunita dinacitta ajamayaya
    | svayam ca abadhyata shica baddhan pashyanti apasmritih || || kapotah ca atmajan baddhan atmanah
    api adhikan priyan | bharyam ca atmasamam dinah vilalapa atiduhkhitah || || aho me pashyata apayam
    alpapunyasya durmateh | atriptasya akritarthasya grihah traivargikah hatah || || anurupa anukula ca
    yasya me patidevata | shunye grihe mam santyajya putraih svaryati sadhubhih || || sah aham shunye
    grihe dinah mritadarah mritaprajah | jijivishe kimartham va vidhurah duhkhajivitah || || tan tatha
    eva avritan shigbhih mrityugrastan viceshtatah | svayam ca kripanah shikshu pashyan api abudhah apatat
    || || tam labdhva lubdhakah krurah kapotam grihamedhinam | kapotakan kapotim ca siddharthah prayayau
    griham || || evam kutumbi ashanta atma dvandva aramah patat trivat | pushnan kutumbam kripanah sanubandhah
    avasidati || || yah prapya manusham lokam muktidvaram apavritam | griheshu khagavat saktah tam arudhacyutam
    viduh || || iti shrimadbhagavate mahapurane paramahamsyam samhitayamekadashaskandhe shrikrishnoddhavasamvade
    yadvadhutetihase saptamo'dhyayah ||
  devanagari: अथ सप्तमोऽध्यायः । श्री भगवान् उवाच । यत् आत्थ मां महाभाग तत् चिकीर्षितं एव मे । ब्रह्मा
    भवः लोकपालाः स्वर्वासं मे अभिकाङ्क्षिणः ॥ ॥ मया निष्पादितं हि अत्र देवकार्यं अशेषतः । यदर्थं अवतीर्णः
    अहं अंशेन ब्रह्मणार्थितः ॥ ॥ कुलं वै शापनिर्दग्धं नङ्क्ष्यति अन्योन्यविग्रहात् । समुद्रः सप्तमे अह्न्ह्येतां
    पुरीं च प्लावयिष्यति ॥ ॥ यः हि एव अयं मया त्यक्तः लोकः अयं नष्टमङ्गलः । भविष्यति अचिरात् साधो कलिनाऽपि
    निराकृतः ॥ ॥ न वस्तव्यं त्वया एव इह मया त्यक्ते महीतले । जनः अधर्मरुचिः भद्रः भविष्यति कलौ युगे ॥
    ॥ त्वं तु सर्वं परित्यज्य स्नेहं स्वजनबन्धुषु । मयि आवेश्य मनः सम्यक् समदृक् विचरस्व गाम् ॥ ॥ यत्
    इदं मनसा वाचा चक्षुर्भ्यां श्रवणादिभिः । नश्वरं गृह्यमाणं च विद्धि मायामनोमयम् ॥ ॥ पुंसः अयुक्तस्य
    नानार्थः भ्रमः सः गुणदोषभाक् । कर्माकर्मविकर्म इति गुणदोषधियः भिदा ॥ ॥ तस्मात् युक्तैन्द्रियग्रामः
    युक्तचित्तः इदं जगत् । आत्मनि ईक्षस्व विततं आत्मानं मयि अधीश्वरे ॥ ॥ ज्ञानविज्ञानसंयुक्तः आत्मभूतः
    शरीरिणाम् । आत्मानुभवतुष्टात्मा न अन्तरायैः विहन्यसे ॥ ॥ दोषबुद्ध्या उभयातीतः निषेधात् न निवर्तते
    । गुणबुद्ध्या च विहितं न करोति यथा अर्भकः ॥ ॥ सर्वभूतसुहृत् शान्तः ज्ञानविज्ञाननिश्चयः । पश्यन् मदात्मकं
    विश्वं न विपद्येत वै पुनः ॥ ॥ श्री शुकः उवाच । इति आदिष्टः भगवता महाभागवतः नृप । उद्धवः प्रणिपत्य
    आह तत्त्वजिज्ञासुः अच्युतम् ॥ ॥ उद्धवः उवाच । योगेश योगविन्न्यास योगात्म योगसम्भव । निःश्रेयसाय मे
    प्रोक्तः त्यागः सन्न्यासलक्षणः ॥ ॥ त्यागः अयं दुष्करः भूमन् कामानां विषयात्मभिः । सुतरां त्वयि सर्वात्मन्
    न अभक्तैः इति मे मतिः ॥ ॥ सः अहं मम अहं इति मूढमतिः विगाढः त्वत् मायया विरचित आत्मनि सानुबन्धे । तत्
    तु अञ्जसा निगदितं भवता यथा अहम् संसाधयामि भगवन् अनुशाधि भृत्यम् ॥ ॥ सत्यस्य ते स्वदृशः आत्मनः आत्मनः
    अन्यम् वक्तारं ईश विबुधेषु अपि न अनुचक्षे । सर्वे विमोहितधियः तव मायया इमे ब्रह्मादयः तनुभृतः बहिः
    अर्थभावः ॥ ॥ तस्मात् भवन्तं अनवद्यं अनन्तपारम् सर्वज्ञं ईश्वरं अकुण्ठविकुण्ठधिष्णि अयम् । निर्विण्णधीः
    अहं उ ह वृजनाभितप्तः नारायणं नरसखं शरणं प्रपद्ये ॥ ॥ श्री भगवान् उवाच । प्रायेण मनुजा लोके लोकतत्त्वविचक्षणाः
    । समुद्धरन्ति हि आत्मानं आत्मना एव अशुभाशयात् ॥ ॥ आत्मनः गुरुः आत्मा एव पुरुषस्य विशेषतः । यत् प्रत्यक्ष
    अनुमानाभ्यां श्रेयः असौ अनुविन्दते ॥ ॥ पुरुषत्वे च मां धीराः साङ्ख्ययोगविशारदाः । आविस्तरां प्रपश्यन्ति
    सर्वशक्ति उपबृंहितम् ॥ ॥ एकद्वित्रिचतुष्पादः बहुपादः तथा अपदः । बह्व्यः सन्ति पुरः सृष्टाः तासां मे
    पौरुषी प्रिया ॥ ॥ अत्र मां मार्गयन्त्यद्धाः युक्ताः हेतुभिः ईश्वरम् । गृह्यमाणैः गुणैः लिङ्गैः अग्राह्यं
    अनुमानतः ॥ ॥ अत्र अपि उदाहरन्ति इमं इतिहासं पुरातनम् । अवधूतस्य संवादं यदोः अमिततेजसः ॥ अवधूतं द्विजं
    कञ्चित् चरन्तं अकुतोभयम् । कविं निरीक्ष्य तरुणं यदुः पप्रच्छ धर्मवित् ॥ ॥ यदुः उवाच । कुतः बुद्धिः
    इयं ब्रह्मन् अकर्तुः सुविशारदा । यां आसाद्य भवान् लोकं विद्वान् चरति बालवत् ॥ ॥ प्रायः धर्मार्थकामेषु
    विवित्सायां च मानवाः । हेतुना एव समीहन्ते आयुषः यशसः श्रियः ॥ ॥ त्वं तु कल्पः कविः दक्षः सुभगः अमृतभाषणः
    । न कर्ता नेहसे किञ्चित् जडौन्मत्तपिशाचवत् ॥ ॥ जनेषु दह्यमानेषु कामलोभदवाग्निना । न तप्यसे अग्निना
    मुक्तः गङ्गाम्भस्थः इव द्विपः ॥ ॥ त्वं हि नः पृच्छतां ब्रह्मन् आत्मनि आनन्दकारणम् । ब्रूहि स्पर्शविहीनस्य
    भवतः केवल आत्मनः ॥ ॥ श्री भगवान् उवाच । यदुना एवं महाभागः ब्रह्मण्येन सुमेधसा । पृष्टः सभाजितः प्राह
    प्रश्रय अवनतं द्विजः ॥ ॥ ब्राह्मणः उवाच । सन्ति मे गुरवः राजन् बहवः बुद्ध्या उपाश्रिताः । यतः बुद्धिं
    उपादाय मुक्तः अटामि इह तान् श्रुणु ॥ ॥ पृथिवी वायुः आकाशं आपः अग्निः चन्द्रमा रविः । कपोतः अजगरः सिन्धुः
    पतङ्गः मधुकृद् गजः ॥ ॥ मधुहा हरिणः मीनः पिङ्गला कुररः अर्भकः । कुमारी शरकृत् सर्पः ऊर्णनाभिः सुपेशकृत्
    ॥ ॥ एते मे गुरवः राजन् चतुर्विंशतिः आश्रिताः । शिक्षा वृत्तिभिः एतेषां अन्वशिक्षं इह आत्मनः ॥ ॥ यतः
    यत् अनुशिक्षामि यथा वा नाहुषात्मज । तत् तथा पुरुषव्याघ्र निबोध कथयामि ते ॥ ॥ भूतैः आक्रमाणः अपि धीरः
    दैववशानुगैः । तत् विद्वान् न चलेत् मार्गात् अन्वशिक्षं क्षितेः व्रतम् ॥ ॥ शश्वत् परार्थसर्वेहः परार्थ
    एकान्तसम्भवः । साधुः शिक्षेत भूभृत्तः नगशिष्यः परात्मताम् ॥ ॥ प्राणवृत्त्या एव सन्तुष्येत् मुनिः न
    एव इन्द्रियप्रियैः । ज्ञानं यथा न नश्येत न अवकीर्येत वाङ्मनः ॥ ॥ विषयेषु आविशन् योगी नानाधर्मेषु सर्वतः
    । गुणदोषव्यपेत आत्मा न विषज्जेत वायुवत् ॥ ॥ पार्थिवेषु इह देहेषु प्रविष्टः तत् गुणाश्रयः । गुणैः न
    युज्यते योगी गन्धैः वायुः इव आत्मदृक् ॥ ॥ अन्तः हितः च स्थिरजङ्गमेषु ब्रह्म आत्मभावेन समन्वयेन । व्याप्त्य
    अवच्छेदं असङ्गं आत्मनः मुनिः नभः त्वं विततस्य भावयेत् ॥ ॥ तेजः अबन्नमयैः भावैः मेघ आद्यैः वायुना ईरितैः
    । न स्पृश्यते नभः तद्वत् कालसृष्टैः गुणैः पुमान् ॥ ॥ स्वच्छः प्रकृतितः स्निग्धः माधुर्यः तीर्थभूः
    नृणाम् । मुनिः पुनाति अपां मित्रं ईक्ष उपस्पर्शकीर्तनैः ॥ ॥ तेजस्वी तपसा दीप्तः दुर्धर्षौदरभाजनः ।
    सर्वभक्षः अपि युक्त आत्मा न आदत्ते मलं अग्निवत् ॥ ॥ क्वचित् शन्नः क्वचित् स्पष्टः उपास्यः श्रेयः इच्छताम्
    । भुङ्क्ते सर्वत्र दातॄणां दहन् प्राक् उत्तर अशुभम् ॥ ॥ स्वमायया सृष्टं इदं सत् असत् लक्षणं विभुः
    । प्रविष्टः ईयते तत् तत् स्वरूपः अग्निः इव एधसि ॥ ॥ विसर्गाद्याः श्मशानान्ताः भावाः देहस्य न आत्मनः
    । कलानां इव चन्द्रस्य कालेन अव्यक्तवर्त्मना ॥ ॥ कालेन हि ओघवेगेन भूतानां प्रभव अपि अयौ । नित्यौ अपि
    न दृश्येते आत्मनः अग्नेः यथा अर्चिषाम् ॥ ॥ गुणैः गुणान् उपादत्ते यथाकालं विमुञ्चति । न तेषु युज्यते
    योगी गोभिः गाः इव गोपतिः ॥ ॥ बुध्यते स्वेन भेदेन व्यक्तिस्थः इव तत् गतः । लक्ष्यते स्थूलमतिभिः आत्मा
    च अवस्थितः अर्कवत् ॥ ॥ न अतिस्नेहः प्रसङ्गः वा कर्तव्यः क्व अपि केनचित् । कुर्वन् विन्देत सन्तापं
    कपोतः इव दीनधीः ॥ ॥ कपोतः कश्चन अरण्ये कृतनीडः वनस्पतौ । कपोत्या भार्यया सार्धं उवास कतिचित् समाः
    ॥ ॥ कपोतौ स्नेहगुणितहृदयौ गृहधर्मिणौ । दृष्टिं दृष्ट्याङ्गं अङ्गेन बुद्धिं बुद्ध्या बबन्धतुः ॥ ॥ शय्यासनाटनस्थानवार्ताक्रीडाशनादिकम्
    । मिथुनीभूय विस्रब्धौ चेरतुः वनराजिषु ॥ ॥ यं यं वाञ्छति सा राजन् तर्पयन्ति अनुकम्पिता । तं तं समनयत्
    कामं कृच्छ्रेण अपि अजितैन्द्रियः ॥ ॥ कपोती प्रथमं गर्भं गृह्णति कालः आगते । अण्डानि सुषुवे नीडे स्वपत्युः
    सन्निधौ सती ॥ ॥ तेषू काले व्यजायन्त रचितावयवा हरेः । शक्तिभिः दुर्विभाव्याभिः कोमलाङ्गतनूरुहाः ॥ ॥
    प्रजाः पुपुषतुः प्रीतौ दम्पती पुत्रवत्सलौ । श ऋण्वन्तौ कूजितं तासां निर्वृतौ कलभाषितैः ॥ ॥ तासां पतत्रैः
    सुस्पर्शैः कूजितैः मुग्धचेष्टितैः । प्रत्युद्गमैः अदीनानां पितरौ मुदं आपतुः ॥ ॥ स्नेहानुबद्धहृदयौ
    अन्योन्यं विष्णुमायया । विमोहितौ दीनधियौ शिशून् पुपुषतुः प्रजाः ॥ ॥ एकदा जग्मतुः तासां अन्नार्थं तौ
    कुटुम्बिनौ । परितः कानने तस्मिन् अर्थिनौ चेरतुः चिरम् ॥ ॥ दृष्ट्वा तान् लुब्धकः कश्चित् यदृच्छ अतः
    वनेचरः । जगृहे जालं आतत्य चरतः स्वालयान्तिके ॥ ॥ कपोतः च कपोती च प्रजापोषे सदा उत्सुकौ । गतौ पोषणं
    आदाय स्वनीडं उपजग्मतुः ॥ ॥ कपोती स्वात्मजान् वीक्ष्य बालकान् जालसंवृतान् । तान् अभ्यधावत् क्रोशन्ती
    क्रोशतः भृशदुःखिता ॥ ॥ सा असकृत् स्नेहगुणिता दीनचित्ता अजमायया । स्वयं च अबध्यत शिचा बद्धान् पश्यन्ति
    अपस्मृतिः ॥ ॥ कपोतः च आत्मजान् बद्धान् आत्मनः अपि अधिकान् प्रियान् । भार्यां च आत्मसमां दीनः विललाप
    अतिदुःखितः ॥ ॥ अहो मे पश्यत अपायं अल्पपुण्यस्य दुर्मतेः । अतृप्तस्य अकृतार्थस्य गृहः त्रैवर्गिकः हतः
    ॥ ॥ अनुरूपा अनुकूला च यस्य मे पतिदेवता । शून्ये गृहे मां सन्त्यज्य पुत्रैः स्वर्याति साधुभिः ॥ ॥ सः
    अहं शून्ये गृहे दीनः मृतदारः मृतप्रजः । जिजीविषे किमर्थं वा विधुरः दुःखजीवितः ॥ ॥ तान् तथा एव आवृतान्
    शिग्भिः मृत्युग्रस्तान् विचेष्टतः । स्वयं च कृपणः शिक्षु पश्यन् अपि अबुधः अपतत् ॥ ॥ तं लब्ध्वा लुब्धकः
    क्रूरः कपोतं गृहमेधिनम् । कपोतकान् कपोतीं च सिद्धार्थः प्रययौ गृहम् ॥ ॥ एवं कुटुम्बी अशान्त आत्मा
    द्वन्द्व आरामः पतत् त्रिवत् । पुष्णन् कुटुम्बं कृपणः सानुबन्धः अवसीदति ॥ ॥ यः प्राप्य मानुषं लोकं
    मुक्तिद्वारं अपावृतम् । गृहेषु खगवत् सक्तः तं आरूढच्युतं विदुः ॥ ॥ इति श्रीमद्भागवते महापुराणे पारमहंस्यां
    संहितायामेकादशस्कन्धे श्रीकृष्णोद्धवसंवादे यद्वधूतेतिहासे सप्तमोऽध्यायः ॥
