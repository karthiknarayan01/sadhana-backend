id: govindastotram-3
category: stotram
name:
  english: govindastotram
  devanagari: गोविन्दस्तोत्रम्
content:
  english: rajitasanmukha devakinandana govinda vande || 4|| || iti shrimatkalyanidevi viracitam govindastotram
    sampurnam ||
  devanagari: राजितसन्मुख देवकीनन्दन गोविन्द वन्दे ॥ ४॥ ॥ इति श्रीमत्कल्याणीदेवी विरचितं गोविन्दस्तोत्रं
    संपूर्णम् ॥
