id: nirvanopanishat
category: upanishad
name:
  english: nirvanopanishat
  devanagari: निर्वाणोपनिषत्
content:
  english: nirvanopanishadvedyam nirvananandatundilam | traipadanandasamrajyam svamatramiti cintayet ||
    om vanme manasi pratishthita | mano me vaci pratishthitam | aviravirma edhi | vedasya ma anisthah
    | shrutam me ma prahasih| anenadhitenahoratransandadhami | ritam vadishyami | satyam vadishyami |
    tanmamavatu | tadvaktaramavatu | avatu mamavatu vaktaram| om shantih shantih shantih || atha nirvanopanishadam
    vyakhyasyamah | paramahamsah so'ham | parivrajakah pashcimalingah | manmathakshetrapalah | gaganasiddhantah|
    amritakallolanadi | akshayam niranjanam | nihsamshaya rishih | nirvano devata | nishkulapravrittih
    | nishkevalanẏanam ||1
  devanagari: निर्वाणोपनिषद्वेद्यं निर्वाणानन्दतुन्दिलम् । त्रैपदानन्दसाम्राज्यं स्वमात्रमिति चिन्तयेत्
    ॥ ॐ वाण्मे मनसि प्रतिष्ठिता । मनो मे वाचि प्रतिष्ठितम् । आविरावीर्म एधि । वेदस्य मा आणीस्थः । श्रुतं
    मे मा प्रहासीः। अनेनाधीतेनाहोरात्रान्सन्दधामि । ऋतं वदिष्यामि । सत्यं वदिष्यामि । तन्मामवतु । तद्वक्तारमवतु
    । अवतु मामवतु वक्तारम्। ॐ शान्तिः शान्तिः शान्तिः ॥ अथ निर्वाणोपनिषदं व्याख्यास्यामः । परमहंसः सोऽहम्
    । परिव्राजकाः पश्चिमलिण्गाः । मन्मथक्षेत्रपालाः । गगनसिद्धान्तः। अमृतकल्लोलनदी । अक्षयं निरञ्जनम्
    । निःसंशय ऋषिः । निर्वाणो देवता । निष्कुलप्रवृत्तिः । निष्केवलङ्य़ानम् ॥१
meaning: {}
