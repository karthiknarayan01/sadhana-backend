id: sri-hayagriva-sampada-stotram
category: stotram
name:
  english: Sri Hayagriva Sampada Stotram
content:
  english: jnananandamayam devam nirmalasphatikakritim adharam sarvavidyanam hayagrivamupasmahe || ||
    hayagriva hayagriva hayagriveti vadinam | naram muncanti papani daridramiva yoshitah || || hayagriva
    hayagriva hayagriveti yo vadet | tasya nissarate vani jahnukanya pravahavat || || hayagriva hayagriva
    hayagriveti yo dhvanih | vishobhate sa vaikuntha kavatodghatanakshamah || || shlokatrayamidam punyam
    hayagrivapadankitam vadirajayatiproktam pathatam sampadam padam || || || iti shrimadvadirajapujyacaranaviracitam
    hayagrivasampadastotram sampurnam ||
  devanagari: ज्ञानानन्दमयं देवं निर्मलस्फटिकाकृतिं आधारं सर्वविद्यानां हयग्रीवमुपास्महे ॥ ॥ हयग्रीव हयग्रीव
    हयग्रीवेति वादिनम् । नरं मुञ्चन्ति पापानि दरिद्रमिव योषितः ॥ ॥ हयग्रीव हयग्रीव हयग्रीवेति यो वदेत्
    । तस्य निस्सरते वाणी जह्नुकन्या प्रवाहवत् ॥ ॥ हयग्रीव हयग्रीव हयग्रीवेति यो ध्वनिः । विशोभते स वैकुण्ठ
    कवाटोद्घाटनक्षमः ॥ ॥ श्लोकत्रयमिदं पुण्यं हयग्रीवपदाङ्कितम् वादिराजयतिप्रोक्तं पठतां सम्पदां पदम्
    ॥ ॥ ॥ इति श्रीमद्वादिराजपूज्यचरणविरचितं हयग्रीवसम्पदास्तोत्रं सम्पूर्णम् ॥
