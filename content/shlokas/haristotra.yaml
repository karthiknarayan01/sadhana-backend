id: haristotra
category: stotram
name:
  english: haristotra
  devanagari: हरिस्तोत्र
content:
  english: kacatkanthamalam sharaccandrabhalam mahadaityakalam | nabhonilakayam duravaramayam supadmasahayam
    bhaje'ham bhaje'ham || 1|| sadambhodhivasam galatpushpahasam jagatsannivasam shatadityabhasam | gadacakrashastram
    lasatpitavastram hasaccaruvaktram bhaje'ham bhaje'ham || 2|| ramakanthaharam shrutivratasaram jalantarviharam
    dharabharaharam | cidanandarupam manojnasvarupam dhritanekarupam bhaje'ham bhaje'ham || 3|| jarajanmahinam
    paranandapinam samadhanalinam sadaivanavinam | jagajjanmahetum suranikaketum trilokaikasetum bhaje'ham
    bhaje'ham || 4|| kritamnayaganam khagadhishayanam vimukternidanam hararatimanam | svabhaktanukulam
    jagadvrikshamulam nirastartashulam bhaje'ham bhaje'ham || 5|| samastamaresham dvirephabhakesham jagadbimbalesham
    hridakashadesham | sada divyadeham vimuktakhileham suvaikunthageham bhaje'ham bhaje'ham || 6|| suralibalishtham
    trilokivarishtham gurunam garishtham svarupaikanishtham | sada yuddhadhiram mahaviraviram mahambhodhitiram
    bhaje'ham bhaje'ham || 7|| ramavamabhagam talanagranagam kritadhinayagam gataragaragam | munindraih
    sugitam suraih samparitam gunaudhairatitam bhaje'ham bhaje'ham || 8|| phalashrutih | idam yastu nityam
    samadhaya cittam pathedashtakam kanthaharam murareh | sa vishnorvishokam dhruvam yati lokam jarajanmashokam
    punarvindate no || 9|| iti shrimatparamahamsasvamibrahmanandaviracitam shriharistotram sampurnam ||
  devanagari: कचत्कण्ठमालं शरच्चन्द्रभालं महादैत्यकालम् । नभोनीलकायं दुरावारमायं सुपद्मासहायं भजेऽहं भजेऽहम्
    ॥ १॥ सदाम्भोधिवासं गलत्पुष्पहासं जगत्सन्निवासं शतादित्यभासम् । गदाचक्रशस्त्रं लसत्पीतवस्त्रं हसच्चारुवक्त्रं
    भजेऽहं भजेऽहम् ॥ २॥ रमाकण्ठहारं श्रुतिव्रातसारं जलान्तर्विहारं धराभारहारम् । चिदानन्दरूपं मनोज्ञस्वरूपं
    धृतानेकरूपं भजेऽहं भजेऽहम् ॥ ३॥ जराजन्महीनं परानन्दपीनं समाधानलीनं सदैवानवीनम् । जगज्जन्महेतुं सुरानीककेतुं
    त्रिलोकैकसेतुं भजेऽहं भजेऽहम् ॥ ४॥ कृताम्नायगानं खगाधीशयानं विमुक्तेर्निदानं हरारातिमानम् । स्वभक्तानुकूलं
    जगद्वृक्षमूलं निरस्तार्तशूलं भजेऽहं भजेऽहम् ॥ ५॥ समस्तामरेशं द्विरेफाभकेशं जगद्बिम्बलेशं हृदाकाशदेशम्
    । सदा दिव्यदेहं विमुक्ताखिलेहं सुवैकुण्ठगेहं भजेऽहं भजेऽहम् ॥ ६॥ सुरालिबलिष्ठं त्रिलोकीवरिष्ठं गुरूणां
    गरिष्ठं स्वरूपैकनिष्ठम् । सदा युद्धधीरं महावीरवीरं महाम्भोधितीरं भजेऽहं भजेऽहम् ॥ ७॥ रमावामभागं तलानग्रनागं
    कृताधीनयागं गतारागरागम् । मुनीन्द्रैः सुगीतं सुरैः सम्परीतं गुणौधैरतीतं भजेऽहं भजेऽहम् ॥ ८॥ फलश्रुतिः
    । इदं यस्तु नित्यं समाधाय चित्तं पठेदष्टकं कण्ठहारं मुरारेः । स विष्णोर्विशोकं ध्रुवं याति लोकं जराजन्मशोकं
    पुनर्विन्दते नो ॥ ९॥ इति श्रीमत्परमहंसस्वामिब्रह्मानन्दविरचितं श्रीहरिस्तोत्रं सम्पूर्णम् ॥
