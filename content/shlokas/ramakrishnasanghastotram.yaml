id: ramakrishnasanghastotram
category: stotram
name:
  english: ramakrishnasanghastotram
  devanagari: रामकृष्णसन्घस्तोत्रम्
content:
  english: shriramakrishnasanghastotram sarvadharmasthapakastvam sarvadharmasvarupakah | acaryanam mahacaryo
    ramakrishnaya te namah || 1|| yathagnerdahika shakti ramakrishne sthita hi ya | sarvavidya svarupam
    tam sharadam pranamamyaham || 2|| paratattve sada lino ramakrishna samajnaya | yo dharmasthapanaparo
    viresham tam namamyaham || 3|| kalindiphullakamale madhavena krir̤aratah | brahmananda
  devanagari: श्रीरामकृष्णसङ्घस्तोत्रम् सर्वधर्मस्थापकस्त्वं सर्वधर्मस्वरूपकः । आचार्याणां महाचार्यो रामकृष्णाय
    ते नमः ॥ १॥ यथाग्नेर्दाहिका शक्ती रामकृष्णे स्थिता हि या । सर्वविद्या स्वरूपां तां शारदां प्रणमाम्यहम्
    ॥ २॥ परतत्त्वे सदा लीनो रामकृष्ण समाज्ञया । यो धर्मस्थापनपरो वीरेशं तं नमाम्यहम् ॥ ३॥ कालिन्दीफुल्लकमले
    माधवेन क्रीड़ारतः । ब्रह्मानन्द
meaning: {}
