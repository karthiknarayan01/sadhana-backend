    स्या॑तिग्रा॒ह्या॑ न गृ॒ह्यन्त॒ इत्यप्य॑ग्निष्टो॒मे ग्र॑हीत॒व्या॑ य॒ज्ञस्य॑ सतनु॒त्वाय॑ दे॒वता॒ वै
    सर्वा ऽऽग्ने॒ यम॒ग्निरै॒न्द्रमिन्द्रः॑ सौ॒र्यग्ं सूर्य॒स्ततो॒ वै ते र्व्या॒वृत॑मगच्छ॒न्॒ विँ॒दुष॑
    ए॒ते ग्रहा॑ गृ॒ह्यन्ते व्या॒वृत॑मे॒व पा॒प्मना॒ भ्रातृ॑व्येण गच्छती॒मे लो॒का ज्योति॑ष्मन्त द्वीर्याः
    का॒र्या॑ इत्या॑हुराग्ने॒येना॒स्मिन् ँलो॒के ज्योति॑र्धत्त ऐ॒न्द्रेणा॒न्तरि॑क्ष इन्द्रवा॒यू हि स॒युजौ॑
    सौ॒र्येणा॒मुष्मि॑न् ँलो॒के ज्योति॑र्धत्ते॒ ज्योति॑ष्मन्तो ऽस्मा इ॒मे लो॒का भ॑वन्ति स॒माव॑ द्वीर्यानेनान्
    कुरुत ए॒तान् न्ताभ्या॑मि॒मे लो॒काः परा ञ्चश्चा॒र्वाञ्च॑श्च॒ प्राभु॒र्यस्यै॒वं विँ॒दुष॑ ए॒ते ग्रहा॑
    गृ॒ह्यन्ते॒ प्रास्मा॑ इ॒मे लो॒काः परा ञ्चश्चा॒र्वाञ्च॑श्च भान्ति ॥ एका॒न्नच॑त्वारि॒ग्ं॒शच्च॑ ऽकु॑र्वत॒
    तदसु॑रा अकुर्वत॒ ते दे॒वा अदा भ्ये॒ छन्दाग्ं॑सि॒ सव॑नानि॒ सम॑स्थापय॒ भ्यो गृ॒ह्यते॒ भव॑त्या॒त्मना॒
    परा ऽस्य॒ भ्रातृ॑व्यो भवति॒ यद्वै दे॒वा असु॑रा॒ वेँद॑ द॒भ्नोत्ये॒व भ्रातृ॑व्य॒ त्ये॒षा वै प्र॒जाप॑ते
    रतिमो॒क्षिणी॒ नाम॑ त॒नूर्यददा भ्य॒ उप॑नद्धस्य गृह्णा॒त्यति॑मुक्त्या॒ अति॑ पा॒प्मान॒ वेँद॒ घ्नन्ति॒
    वा ए॒त यँद॑भिषु॒ण्वन्ति॒ सोमे॑ ह॒न्यमा॑ने य॒ज्ञो ह॑न्यते य॒ज्ञे यज॑मानो ब्रह्मवा॒दिनो॑ वदन्ति॒ कि
    द्य॒ज्ञे यज॑मानः कुरुते॒ येन॒ जीवन् लोँ॒कमेतीति॑ जीवग्र॒हो वा ए॒ष यददा॒भ्यो ऽन॑भिषुतस्य गृह्णाति॒
    जीव॑न्तमे॒वैनग्ं॑ सुव॒र्गं ँलो॒क न्त्य॒ग्ं॒शूनपि॑ सृजति य॒ज्ञस्य॒ सन्त॑त्यै ॥ न॑भिषुतस्य गृह्णा॒त्ये
    का॒न्नविग्ं॑श॒तिश्च॑ दे॒वा वै प्र॒बाहु॒ग्ग्रहा॑ त्तम॑गृह्णीत॒ तेन॒ वै स आ र्गृ॒ह्यत॑ ऋ॒द्ध्नोत्ये॒व
    स॒कृद॑भिषुतस्य गृह्णाति स॒कृद्धि स तेना ऽऽर्ध्नो॒न्मन॑सा गृह्णाति॒ मन॑ इव॒ हि प्र॒जाप॑तिः प्र॒जाप॑ते॒राप्त्या॒
    औदु॑म्बरेण गृह्णा॒त्यूर्ग्वा उ॑दु॒म्बर॒ ऊर्ज॑मे॒वाव॑ रुन्धे॒ चतुः॑स्रक्ति भवति दि॒ क्ष्वे॑व प्रति॑
    तिष्ठति॒ यो वा अ॒ग्ं॒शोरा॒यत॑नं॒ न्भवति वामदे॒व्यमिति॒ साम॒ तद्वा अ॑स्या॒ म्मन॑सा॒ गाय॑मानो गृह्णात्या॒यत॑नवाने॒व
    भ॑वति॒ यद॑द्ध्व॒र्युर॒ग्ं॒शु न्नार्धये॑दु॒भाभ्या॒ न्नर्ध्ये॑ताद्ध्व॒र्यवे॑ च॒ यज॑मानाय च॒ यद॒र्धये॑
    ङ्गृह्णाति॒ सैवास्यर्धि॒र्॒ हिर॑ण्यम॒भि व्य॑नित्य॒मृतं॒ वैँ हिर॑ण्य॒मायुः॑ प्रा॒ण आयु॑षै॒वामृत॑म॒भि
    धि॑नोति श॒तमा॑न म्भवति श॒तायुः॒ पुरु॑ष श्श॒तेन्द्रि॑य॒ आयु॑ष्ये॒वेन्द्रि॒ये प्रति॑ तिष्ठति ॥ र्दे॒वेभ्यो॑
    य॒ज्ञान् व्यादि॑श॒ ऽमन्यत॒ स य॒ज्ञानाग्ं॑ षोडश॒धेन्द्रि॒यं वीँ॒र्य॑मा॒त्मान॑म॒भि सम॑क्खिद॒ थ्षो॑ड॒श्य॑भव॒न्न
    वै षो॑ड॒शी नाम॑ य॒ज्ञो ऽस्ति॒ यद्वाव षो॑ड॒शग्ग् स्तो॒त्रग्ं षो॑ड॒शग्ं श॒स्त्र थ्षो॑ड॒शिनः॑ षोडशि॒त्वं
    थ्षो॑ड॒शी गृ॒ह्यत॑ इन्द्रि॒यमे॒व त न्ध॑त्ते दे॒वेभ्यो॒ वै सु॑व॒र्गो लो॒को त्त ए॒तग्ं षो॑ड॒शिन॑मपश्य॒
    न्तम॑गृह्णत॒ ततो॒ वै तेभ्यः॑ सुव॒र्गो लो॒कः प्राभ॑व॒द्य थ्षो॑ड॒शी गृ॒ह्यते॑ सुव॒र्गस्य॑ लो॒कस्या॒भिजि॑त्या॒
    इन्द्रो॒ वै दे॒वाना॑मानुजाव॒र आ॑सी॒ थ्स प्र॒जाप॑ति॒मुपा॑धाव॒ त्तस्मा॑ ए॒तग्ं षो॑ड॒शिन॒ त्तम॑गृह्णीत॒
    ततो॒ वै सो विँ॒दुषः॑ षोड॒शी गृ॒ह्यते ऽग्र॑मे॒व स॑मा॒नाना॒ म्पर्ये॑ति प्रातस्सव॒ने गृ॑ह्णाति॒ वज्रो॒
    वै षो॑ड॒शी वज्रः॑ प्रातस्सव॒नग्ग् योँने॒र्निगृ॑ह्णाति॒ सव॑नेसवने॒ ऽभि गृ॑ह्णाति॒ सव॑नाथ्सवनादे॒वैन॒
    म्प्र ज॑नयति तृतीयसव॒ने प॒शुका॑मस्य गृह्णीया॒ द्वज्रो॒ वै षो॑ड॒शी प॒शव॑स्तृतीयसव॒नं वँज्रे॑णै॒वास्मै॑
    तृतीयसव॒ना त्प॒शूनव॑ रुन्धे॒ नोक्थ्ये॑ गृह्णीया त्प्र॒जा वै प॒शव॑ उ॒क्थानि॒ यदु॒क्थ्ये॑ म्प॒शून॑स्य॒
    निर्द॑हेदतिरा॒त्रे प॒शुका॑मस्य गृह्णीया॒ द्वज्रो॒ वै षो॑ड॒शी वज्रे॑णै॒वास्मै॑ प॒शून॑व॒रुद्ध्य॒ रात्रि॑
    च्छमय॒त्यप्य॑ग्निष्टो॒मे रा॑ज॒न्य॑स्य गृह्णीया द्व्या॒वृत्का॑मो॒ हि रा॑ज॒न्यो॑ यज॑ते सा॒ह्न ए॒वास्मै॒
    वज्र॑ वँज्रो॒ भूत्या॑ इन्धे॒ निर्वा॑ दह म्भ॑वति॒ प्रति॑ष्ठित्यै॒ हरि॑वच्छस्यत॒ इन्द्र॑स्य प्रि॒य ऽऽप्नोति॒
    कनी॑याग्ंसि॒ वै दे॒वेषु॒ छन्दा॒ग्॒स्यास॒न् स्यसु॑रेषु॒ ते दे॒वाः कनी॑यसा॒ छन्द॑सा॒ ज्याय॒ त्कनी॑यसा॒
    छन्द॑सा॒ ज्याय॒ ऽभिवि॒शग्ंस॑ति॒ भ्रातृ॑व्यस्यै॒व तल्लो॒कं वृँ॑ङ्क्ते॒ षड॒क्षरा॒ण्यति॑ रेचयन्ति॒ ष
    ड्वा ऋ॒तव॑ ऋ॒तूने॒व प्री॑णाति च॒त्वारि॒ पूर्वा॒ण्यव॑ कल्पयन्ति॒ चतु॑ष्पद ए॒व प॒शूनव॑ रुन्धे॒ द्वे
    उत्त॑रे द्वि॒पद॑ ए॒वाव॑ रुन्धे ऽनु॒ष्टुभ॑म॒भि स म्पा॑दयन्ति॒ वाग्वा अ॑नु॒ष्टु वाँगु॑त्त॒मा स॑मयाविषि॒ते
    सूर्ये॑ षोड॒शिनः॑ स्तो॒त्र मु॒पाक॑रोत्ये॒तस्मि॒न् वै लो॒क इन्द्रो॑ वृ॒त्रम॑हन् म्भ्रातृ॑व्याय॒ प्र
    ह॑र ऽश्वो॒ दक्षि॑णै॒तद्वै वज्र॑स्य रू॒पग्ं समृ॑द्ध्यै ॥ वि॒दुषः॑ षोड॒शी गृ॒ह्यते॒ स॒प्तच॑त्वारिग्ंशच्च
    प्र॒जाप॑तिरेकाद॒शिनी॒ दे॒वा वा इ॑न्द्रि॒यं दे॒वा वै प्र॒बाहु॑क् प्र॒जाप॑तिर्दे॒वेभ्य॒ वज्र॑स्य रू॒पग्ं
    समृ॑द्ध्यै ॥ हरिः॑ ओम् ॥ ॥ कृष्ण यजुर्वेदीय तैत्तिरीय संहितायां षष्ठकाण्डे षष्ठः प्रश्न
