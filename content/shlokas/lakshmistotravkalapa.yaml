id: lakshmistotravkalapa
category: stotram
name:
  english: lakshmistotraVkalapa
  devanagari: लक्ष्मीस्तोत्रVकलाप
content:
  english: 3 shriyam shrivenkateshasya shrinivasasya vallabham | ishvarim sarvabhutanamashraye vishvamataram
    || 1|| vishnorvicitracidacinmishravishvavidhishramah | saphalassakridalokadyasyastasyai namah shriyai
    || 2|| yasya mugdhakatakshadugdhakanika nyunadhikodancitah dvitrah kutracidekatastricaturah kincanyatah
    pancashah | brahmeshendramukhamarannarapatimshcoccavacashrijushah kurvantyashritavatsalam bhagavatim
    tamashrayamah shriyam || 3|| astokastabaka stanadvayamishat panipravalojjvala romalilalitalipanktimahita
    bahupratanancita | samoda harikalpavrikshavipulopaghna vrishadrestate lakshmikalpalata sthira mayi
    kripavikshaprasunam kshipet || 4|| svairodvelakripakatakshasudhaya samplavayantya jagat lakshmyastau
    caranau prapannasulabhau stotum prayasyamyaham | yallaksharasalakshma vakshasi harervikshyaiva sakshatparam
    brahmedam jagadekakaranamiti trayyantavarga jaguh || 5|| vedanta vibudhashcaturmukhamukhassantassanandadayah
    vyasadya munayashca surinivaha lakshmipatirva svayam | sarve yanmahimamritabdhikanikeyattam na vettum
    kshamah tam lakshmimanapatrapah kathayitum vanchami dhinmam kavim || 6|| matangassumahananushca mashakah
    patum pravrittau trisha dugdhabdhim pibatassvashaktyanugunam kritsnam na patum kshamau | matarlakshmi
    tava prabhavajaladhau brahma'pyaham cedrishau yajnanadishu taratamyamubhayornau tena kim sadhitam
    || 7|| mugdhastanandhayamukhat prathamodita vak avyaktavarnamadhura svadate hi matre | shriramba tadvadatimaugdhyakrita
    stutirme tvatkarnavartmani vamedamritasya dharam || 8|| sudhadharasekadiva sukhitakarnah sukavayah
    stuviran yah shrutva sapadi sashirahkampamavashah | tathabhuta matarastutivacanabhangistvaducitah
    vidhatum me shaktim vitara vrishashaileshadayite || 9|| mahitamahasah panke magnanmaniniva cetanan
    pralayatamasa gadham gudhanasatsamatam gatan | na yadi bhavati matah pashyeddayardradrigancala kathamiva
    bhavetsatta tesham pumarthakatha kutah || 10|| asyeshana jagata iti ya vishruta vishvagoptri satyam
    sa tvam bhavasi kamale vishnupatnityanukteh | tasya matastava parijanepvatmasu premabandhah tadvatsalyam
    niravadhikripa sarvametanna citram || 11|| shrutishirovarakoshagrihahitan smritipuranasudipavidipitan
    | sphuritatavakadivyagunan manin svahridaye sudhiyo dadhatindire || 12|| rasyam gavamapi payo rasanopaghatat
    paityena tiktamiti vakti yatha tatha'pi hi | tattvam param tvadupagudhamapodhaheyam heyaspadam vadati
    kashcana gadhapapah || 13|| nityodancitacancarikaninadam nirandhrapushpadrumam niryannirjharashitalam
    vrishagireruttungasha
  devanagari: ३ श्रियं श्रीवेङ्कटेशस्य श्रीनिवासस्य वल्लभाम् । ईश्वरीं सर्वभूतानामाश्रये विश्वमातरम् ॥
    १॥ विष्णोर्विचित्रचिदचिन्मिश्रविश्वविधिश्रमः । सफलस्सकृदालोकाद्यस्यास्तस्यै नमः श्रियै ॥ २॥ यस्या
    मुग्धकटाक्षदुग्धकणिका न्यूनाधिकोदञ्चिताः द्वित्राः कुत्रचिदेकतस्त्रिचतुराः किञ्चान्यतः पञ्चषाः । ब्रह्मेशेन्द्रमुखामरान्नरपतींश्चोच्चावचश्रीजुषः
    कुर्वन्त्याश्रितवत्सलां भगवतीं तामाश्रयामः श्रियम् ॥ ३॥ अस्तोकस्तबका स्तनद्वयमिषात् पाणिप्रवालोज्ज्वला
    रोमालीललितालिपङ्क्तिमहिता बाहुप्रतानाञ्चिता । सामोदा हरिकल्पवृक्षविपुलोपघ्ना वृषाद्रेस्तटे लक्ष्मीकल्पलता
    स्थिरा मयि कृपावीक्षाप्रसूनं क्षिपेत् ॥ ४॥ स्वैरोद्वेलकृपाकटाक्षसुधया सम्प्लावयन्त्या जगत् लक्ष्म्यास्तौ
    चरणौ प्रपन्नसुलभौ स्तोतुं प्रयस्याम्यहम् । यल्लाक्षारसलक्ष्म वक्षसि हरेर्वीक्ष्यैव साक्षात्परं ब्रह्मेदं
    जगदेककारणमिति त्रय्यन्तवर्गा जगुः ॥ ५॥ वेदान्ता विबुधाश्चतुर्मुखमुखास्सन्तस्सनन्दादयः व्यासाद्या मुनयश्च
    सूरिनिवहा लक्ष्मीपतिर्वा स्वयम् । सर्वे यन्महिमामृताब्धिकणिकेयत्तां न वेत्तुं क्षमाः तां लक्ष्मीमनपत्रपः
    कथयितुं वाञ्छामि धिङ्मां कविम् ॥ ६॥ मातङ्गस्सुमहानणुश्च मशकः पातुं प्रवृत्तौ तृषा दुग्धाब्धिं पिबतस्स्वशक्त्यनुगुणं
    कृत्स्नं न पातुं क्षमौ । मातर्लक्ष्मि तव प्रभावजलधौ ब्रह्माऽप्यहं चेदृशौ यज्ञानादिषु तारतम्यमुभयोर्नौ
    तेन किं साधितम् ॥ ७॥ मुग्धस्तनन्धयमुखात् प्रथमोदिता वाक् अव्यक्तवर्णमधुरा स्वदते हि मात्रे । श्रीरम्ब
    तद्वदतिमौग्ध्यकृता स्तुतिर्मे त्वत्कर्णवर्त्मनि वमेदमृतस्य धाराम् ॥ ८॥ सुधाधारासेकादिव सुखितकर्णाः
    सुकवयः स्तुवीरन् याः श्रुत्वा सपदि सशिरःकम्पमवशाः । तथाभूता मातरस्तुतिवचनभङ्गीस्त्वदुचिताः विधातुं
    मे शक्तिं वितर वृषशैलेशदयिते ॥ ९॥ महितमहसः पङ्के मग्नान्मणीनिव चेतनान् प्रलयतमसा गाढं गूढानसत्समतां
    गतान् । न यदि भवती मातः पश्येद्दयार्द्रदृगञ्चला कथमिव भवेत्सत्ता तेषां पुमर्थकथा कुतः ॥ १०॥ अस्येशाना
    जगत इति या विश्रुता विश्वगोप्त्री सत्यं सा त्वं भवसि कमले विष्णुपत्नीत्यनूक्तेः । तस्या मातस्तव परिजनेप्वात्मसु
    प्रेमबन्धः तद्वात्सल्यं निरवधिकृपा सर्वमेतन्न चित्रम् ॥ ११॥ श्रुतिशिरोवरकोशगृहाहितान् स्मृतिपुराणसुदीपविदीपितान्
    । स्फुरिततावकदिव्यगुणान् मणीन् स्वहृदये सुधियो दधतीन्दिरे ॥ १२॥ रस्यं गवामपि पयो रसनोपघातात् पैत्येन
    तिक्तमिति वक्ति यथा तथाऽपि हि । तत्त्वं परं त्वदुपगूढमपोढहेयं हेयास्पदं वदति कश्चन गाढपापः ॥ १३॥ नित्योदञ्चितचञ्चरीकनिनदां
    नीरन्ध्रपुष्पद्रुमां निर्यन्निर्झरशीतलां वृषगिरेरुत्तुङ्गश
