id: sri-maha-kalabhairava-kavacham
category: stotram
name:
  english: Sri Maha Kalabhairava Kavacham
content:
  english: shridevyuvaca | devadeva mahabaho bhaktanam sukhavardhana | kena siddhim dadatyashu kali trailokyamohana
    || || tanme vada daya''dhara sadhakabhishtasiddhaye | kripam kuru jagannatha vada vedavidam vara ||
    || shribhairava uvaca | gopaniyam prayatnena tattvat tattvam paratparam | esha siddhikarah samyak
    kimatho kathayamyaham || || mahakalamaham vande sarvasiddhipradayakam | devadanavagandharvakinnaraparisevitam
    || || kavacam tattvadevasya pathanad ghoradarshane | satyam bhavati sannidhyam kavacastavanantarat
    || || siddhim dadati sa tushta kritva kavacamuttamam | samrajyatvam priyam datva putravat paripalayet
    || || kavacasya rishirdevi kalika dakshina tatha viratchandah suvijneyam mahakalastu devata | kalika
    sadhane caiva viniyogah prakirttitah || || om shmashanastho maharudro mahakalo digambarah | kapalakartrika
    vame shulam khatvangam dakshine || || bhujangabhushite devi bhasmasthimanimanditah | jvalatpavakamadhyastho
    bhasmashayyavyavasthitah || || viparitaratam tatra kalikam hridayopari | peyam khadyam ca coshyam
    ca tau kritva tu parasparam | evam bhaktya yajed devam sarvasiddhih prajayate || || pranavam purvamuccarya
    mahakalaya tatpadam | namah patu mahamantrah sarvashastrarthaparagah || || ashtaksharo maha mantrah
    sarvashaparipurakah | sarvapapakshayam yati grahane bhaktavatsale || || kurcadvandvam mahakala prasideti
    padadvayam | lajjayugmam vahnijaya sa tu rajeshvaro mahan || || mantragrahanamatrena bhaveta satyam
    mahakavih | gadyapadyamayi vani ganganirjharita tatha || || tasya nama tu deveshi deva gayanti bhavukah
    | shaktibijadvayam datva kurcam syat tadanantaram || || mahakalapadam datva mayabijayugam tatha |
    kurcamekam samuddhritya mahamantro dashaksharah || || rajasthane durgame ca patu mam sarvato muda
    | vedadibijamadaya bhagaman tadanantaram || || mahakalaya samprocya kurcam datva ca thadvayam | hrinkarapurvamuddhritya
    vedadistadanantaram || || mahakalasyantabhage svahantamanumuttamam | dhanam putram sada patu bandhudaraniketanam
    || || pingalaksho manjuyuddhe yuddhe nityam jayapradah | sambhavyah sarvadushtaghnah patu svasthanavallabhah
    || || iti te kathitam tubhyam devanamapi durlabham | anena pathanad devi vighnanasho yatha bhavet
    || || sampujakah shucisnatah bhaktiyuktah samahitah | sarvavyadhivinirmuktah vairimadhye visheshatah
    || || mahabhimah sada patu sarvasthana vallabham | kaliparshvasthito devah sarvada patu me mukhe ||
    || || phala shruti|| pathanat kalikadevi pathet kavacamuttamam | shrunuyad va prayatnena sada''nandamayo
    bhavet || || shraddhaya'shraddhaya vapi pathanat kavacasya yat | sarvasiddhimavapnoti yadyanmanasi
    vartate || || bilvamule pathed yastu pathanad kavacasya yat | trisandhyam pathanad devi bhavennityam
    mahakavih || || kumarim pujayitva tu yah pathed bhavatatparah | na kincid durlabham tasya divi va
    bhuvi modate || || durbhikshe rajapidayam grame va vairimadhyake | yatra yatra bhayam praptah sarvatra
    prapathennarah || || tatra tatrabhayam tasya bhavatyeva na samshayah | vamaparshve samaniya shobhitam
    varakaminim || || shraddhaya'shraddhaya vapi pathanat kavacasya tu | prayatnatah pathed yastu tasya
    siddhih kare sthita || || idam kavacamajnatva kalam yo bhajate narah | naiva siddhirbhavet tasya vighnastasya
    pade pade | adau varma pathitva tu tasya siddhirbhavishyati || || || iti rudrayamale mahatantre mahakalabhairavakavacam
    sampurnam||
  devanagari: श्रीदेव्युवाच । देवदेव महाबाहो भक्तानां सुखवर्धन । केन सिद्धिं ददात्याशु काली त्रैलोक्यमोहन
    ॥ ॥ तन्मे वद दयाऽऽधार साधकाभीष्टसिद्धये । कृपां कुरु जगन्नाथ वद वेदविदां वर ॥ ॥ श्रीभैरव उवाच । गोपनीयं
    प्रयत्नेन तत्त्वात् तत्त्वं परात्परम् । एष सिद्धिकरः सम्यक् किमथो कथयाम्यहम् ॥ ॥ महाकालमहं वन्दे सर्वसिद्धिप्रदायकम्
    । देवदानवगन्धर्वकिन्नरपरिसेवितम् ॥ ॥ कवचं तत्त्वदेवस्य पठनाद् घोरदर्शने । सत्यं भवति सान्निध्यं कवचस्तवनान्तरात्
    ॥ ॥ सिद्धिं ददाति सा तुष्टा कृत्वा कवचमुत्तमम् । साम्राज्यत्वं प्रियं दत्वा पुत्रवत् परिपालयेत् ॥
    ॥ कवचस्य ऋषिर्देवी कालिका दक्षिणा तथा विराट्छन्दः सुविज्ञेयं महाकालस्तु देवता । कालिका साधने चैव विनियोगः
    प्रकीर्त्तितः ॥ ॥ ॐ श्मशानस्थो महारुद्रो महाकालो दिगम्बरः । कपालकर्तृका वामे शूलं खट्वाङ्गं दक्षिणे
    ॥ ॥ भुजङ्गभूषिते देवि भस्मास्थिमणिमण्डितः । ज्वलत्पावकमध्यस्थो भस्मशय्याव्यवस्थितः ॥ ॥ विपरीतरतां
    तत्र कालिकां हृदयोपरि । पेयं खाद्यं च चोष्यं च तौ कृत्वा तु परस्परम् । एवं भक्त्या यजेद् देवं सर्वसिद्धिः
    प्रजायते ॥ ॥ प्रणवं पूर्वमुच्चार्य महाकालाय तत्पदम् । नमः पातु महामन्त्रः सर्वशास्त्रार्थपारगः ॥ ॥
    अष्टक्षरो महा मन्त्रः सर्वाशापरिपूरकः । सर्वपापक्षयं याति ग्रहणे भक्तवत्सले ॥ ॥ कूर्चद्वन्द्वं महाकाल
    प्रसीदेति पदद्वयम् । लज्जायुग्मं वह्निजाया स तु राजेश्वरो महान् ॥ ॥ मन्त्रग्रहणमात्रेण भवेत सत्यं
    महाकविः । गद्यपद्यमयी वाणी गङ्गानिर्झरिता तथा ॥ ॥ तस्य नाम तु देवेशि देवा गायन्ति भावुकाः । शक्तिबीजद्वयं
    दत्वा कूर्चं स्यात् तदनन्तरम् ॥ ॥ महाकालपदं दत्वा मायाबीजयुगं तथा । कूर्चमेकं समुद्धृत्य महामन्त्रो
    दशाक्षरः ॥ ॥ राजस्थाने दुर्गमे च पातु मां सर्वतो मुदा । वेदादिबीजमादाय भगमान् तदनन्तरम् ॥ ॥ महाकालाय
    सम्प्रोच्य कूर्चं दत्वा च ठद्वयम् । ह्रीङ्कारपूर्वमुद्धृत्य वेदादिस्तदनन्तरम् ॥ ॥ महाकालस्यान्तभागे
    स्वाहान्तमनुमुत्तमम् । धनं पुत्रं सदा पातु बन्धुदारानिकेतनम् ॥ ॥ पिङ्गलाक्षो मञ्जुयुद्धे युद्धे नित्यं
    जयप्रदः । सम्भाव्यः सर्वदुष्टघ्नः पातु स्वस्थानवल्लभः ॥ ॥ इति ते कथितं तुभ्यं देवानामपि दुर्लभम् ।
    अनेन पठनाद् देवि विघ्ननाशो यथा भवेत् ॥ ॥ सम्पूजकः शुचिस्नातः भक्तियुक्तः समाहितः । सर्वव्याधिविनिर्मुक्तः
    वैरिमध्ये विशेषतः ॥ ॥ महाभीमः सदा पातु सर्वस्थान वल्लभम् । कालीपार्श्वस्थितो देवः सर्वदा पातु मे मुखे
    ॥ ॥ ॥ फल श्रुति॥ पठनात् कालिकादेवी पठेत् कवचमुत्तमम् । श्रुणुयाद् वा प्रयत्नेन सदाऽऽनन्दमयो भवेत्
    ॥ ॥ श्रद्धयाऽश्रद्धया वापि पठनात् कवचस्य यत् । सर्वसिद्धिमवाप्नोति यद्यन्मनसि वर्तते ॥ ॥ बिल्वमूले
    पठेद् यस्तु पठनाद् कवचस्य यत् । त्रिसन्ध्यं पठनाद् देवि भवेन्नित्यं महाकविः ॥ ॥ कुमारीं पूजयित्वा
    तु यः पठेद् भावतत्परः । न किञ्चिद् दुर्लभं तस्य दिवि वा भुवि मोदते ॥ ॥ दुर्भिक्षे राजपीडायां ग्रामे
    वा वैरिमध्यके । यत्र यत्र भयं प्राप्तः सर्वत्र प्रपठेन्नरः ॥ ॥ तत्र तत्राभयं तस्य भवत्येव न संशयः
    । वामपार्श्वे समानीय शोभितां वरकामिनीम् ॥ ॥ श्रद्धयाऽश्रद्धया वापि पठनात् कवचस्य तु । प्रयत्नतः पठेद्
    यस्तु तस्य सिद्धिः करे स्थिता ॥ ॥ इदं कवचमज्ञात्वा कालं यो भजते नरः । नैव सिद्धिर्भवेत् तस्य विघ्नस्तस्य
    पदे पदे । आदौ वर्म पठित्वा तु तस्य सिद्धिर्भविष्यति ॥ ॥ ॥ इति रुद्रयामले महातन्त्रे महाकालभैरवकवचं
    सम्पूर्णम्॥
