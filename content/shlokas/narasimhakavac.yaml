id: narasimhakavac
category: kavacha
name:
  english: narasimhakavac
  devanagari: नरसिम्हकवच्
content:
  english: narasimhakavacam shri ganeshaya namah | shrimaddivyalakshminrisimhaya namah | atha shrilakshminrisimhakavacaprarambhah
    | om asya shrilakshminrisimhakavacamalamantrasya vyasaprahlada rishih shirasi | shrilakshminrisimho
    devata hridaye | anushtupchandah mukhe | sarvavyapi stambhavaso bijam nabhau | shrih shaktih padayoh
    | guhyarupadhrik kilakam sarvange | shrilakshminrisimhaprasadasidhyarthe shrilakshminrisimhakavacastotramantrarajajape
    viniyogah | atha karanyasah | om yogihritpadmavasaya angushthabhyam namah | om lakshminrisimhaya tarjanibhyam
    namah | om svaprakashaya madhyamabhyam namah | om sahasrashirshaya anamikabhyam namah | om somasuryagnilocanaya
    kanishthikabhyam namah | om divyastrashobhitabhujaya karatalakaraprishthabhyam namah | atha hridayadinyasah
    | om yogihritpadmavasaya hridayaya namah | om lakshminrisimhaya shirase svaha | om svaprakashaya shikhayai
    vashat | om sahasrashirshaya kavacaya hum | om somasuryagnilocanaya netratrayaya vaushat | om divyastrashobhitabhujaya
    astraya phat | om bhurbhuvasvarom | iti digbandhah | atha dhyanam | karpuradhamabalam katakangadadi
  devanagari: नरसिंहकवचम् श्री गणेशाय नमः । श्रीमद्दिव्यलक्ष्मीनृसिंहाय नमः । अथ श्रीलक्ष्मीनृसिंहकवचप्रारम्भः
    । ॐ अस्य श्रीलक्ष्मीनृसिंहकवचमालामन्त्रस्य व्यासप्रह्लाद ऋषिः शिरसि । श्रीलक्ष्मीनृसिंहो देवता हृदये
    । अनुष्टुप्छन्दः मुखे । सर्वव्यापी स्तम्भवासो बीजं नाभौ । श्रीः शक्तिः पादयोः । गुह्यरूपधृक् कीलकं
    सर्वाङ्गे । श्रीलक्ष्मीनृसिंहप्रसादसिध्यर्थे श्रीलक्ष्मीनृसिंहकवचस्तोत्रमन्त्रराजजपे विनियोगः । अथ
    करन्यासः । ॐ योगिहृत्पद्मवासाय अङ्गुष्ठाभ्यां नमः । ॐ लक्ष्मीनृसिंहाय तर्जनीभ्यां नमः । ॐ स्वप्रकाशाय
    मध्यमाभ्यां नमः । ॐ सहस्रशीर्षाय अनामिकाभ्यां नमः । ॐ सोमसूर्याग्निलोचनाय कनिष्ठिकाभ्यां नमः । ॐ दिव्यास्त्रशोभितभुजाय
    करतलकरपृष्ठाभ्यां नमः । अथ हृदयादिन्यासः । ॐ योगिहृत्पद्मवासाय हृदयाय नमः । ॐ लक्ष्मीनृसिंहाय शिरसे
    स्वाहा । ॐ स्वप्रकाशाय शिखायै वषट् । ॐ सहस्रशीर्षाय कवचाय हुम् । ॐ सोमसूर्याग्निलोचनाय नेत्रत्रयाय
    वौषट् । ॐ दिव्यास्त्रशोभितभुजाय अस्त्राय फट् । ॐ भूर्भुवस्वरोम् । इति दिग्बन्धः । अथ ध्यानम् । कर्पूरधामबलं
    कटकाङ्गदादि
