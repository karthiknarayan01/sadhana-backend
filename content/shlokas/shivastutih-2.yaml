id: shivastutih-2
category: stotram
name:
  english: shivastutih
  devanagari: शिवस्तुतिः
content:
  english: evam samstutya vaishakhe devadevam maheshvaram | ekakalam trikalam va pujayellingngamaishvaram
    || 70|| dadyadgomithunam devi masante shambhaveshu ca | sadakshinam savatsam ca vastralankarabhushitam
    || 71|| homah karyo'travaishakhyam praguktakramatah shive | naktashi bhasmanishtho'tha bhavenmasantamishvari
    || 72|| vaishakhyamatha paurnamyam kuryacca dadhikambalam | ghritakambaladanena vidhih proktah pura
    maya || 73|| etatte'bhihitam gauri vaishakharcanajam phalam | snanapujanamishani gandhapushpaphalarna
  devanagari: एवं संस्तुत्य वैशाखे देवदेवं महेश्वरम् । एककालं त्रिकालं वा पूजयेल्लिङ्ग्ङ्गमैश्वरम् ॥ ७०॥
    दद्याद्गोमिथुनं देवि मासान्ते शाम्भवेषु च । सदक्षिणं सवत्सं च वस्त्रालङ्कारभूषितम् ॥ ७१॥ होमः कार्योऽत्रवैशाख्यां
    प्रागुक्तक्रमतः शिवे । नक्ताशी भस्मनिष्ठोऽथ भवेन्मासान्तमीश्वरि ॥ ७२॥ वैशाख्यामथ पौर्णम्यां कुर्याच्च
    दधिकम्बलम् । घृतकम्बलदानेन विधिः प्रोक्तः पुरा मया ॥ ७३॥ एतत्तेऽभिहितं गौरि वैशाखार्चनजं फलम् । स्नानपूजनमीशानि
    गन्धपुष्पफलार्ण
meaning: {}
