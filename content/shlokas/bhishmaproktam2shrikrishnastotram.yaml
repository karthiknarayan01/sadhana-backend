id: bhishmaproktam2shrikrishnastotram
category: stotram
name:
  english: bhishmaproktam2shrikrishnastotram
  devanagari: भीष्मप्रोक्तं२श्रीकृष्णस्तोत्रम्
content:
  english: bhishmaproktam 2 shrikrishnastotram krishnah prithvimasrijatkham divam ca varaho'yam bhimabalah
    puranah | asya cadho'thantariksham divam ca dishashcatasrah pradishashcatasrah | srishtistathaiveyamanuprasuta
    sa nirmame vishvamidam puranam || 7|| asya nabhyam pushkaram samprasutam yatrotpannah svayamevamitaujah
    | yenacchinnam tattamah partha ghoram yattattishthatyarnavam tarjayanam || 8|| krite yuge dharma asitsamagra
    stretakale jnanamanuprapannah | balam tvasiddvapare partha krishnah kalavadharmah kshitimajagama ||
    9|| sa purvadevo nijaghana daityansa purvadevashca babhuva samrat | sa bhutanam bhavano bhutabhavyah
    sa vishvasyasya jagatashcapi gopta || 10|| yada dharmo glayati vai suranam tada krishno jayate manusheshu
    | dharme sthitva sa tu vai bhavitatma paramshca lokanaparamshca yati || 11|| tyajyamstyaktvathasuranam
    vadhaya karyakarye karanam caiva partha | kritam karishyatkriyate ca devo muhuh somam viddhi ca shakrametam
    || 12|| sa vishvakarma sa ca vishvarupah sa vishvabhridvishvasrigvishvajicca | sa shulabhricchonitabhritkaralastam
    karmabhirviditam vai stuvanti || 13|| tam gandharva apsarasashca nitya mupatishthante vibudhanam shatani
    | tam rakshasashca parisamvahante rayasposhah sa vijigishurekah || 14|| tamadhvare shamsitarah stuvanti
    rathantare samagashca stuvanti | tam brahmana brahmamantraih stuvanti tasmai haviradhvaryavah kalpayanti
    || 15|| sa pauranim brahmaguham pravishto mahisatram bharatagre dadarsha | sa caiva gamuddadharagryakarma
    vikshobhya daityanuragandanavamshca || 16|| tasya bhakshanvividhanvedayanti tamevajau vahanam vedayanti
    | tasyantariksham prithivi divam ca sarvam vashe tishthati shashvatasya || 17|| sa kumbharetah sasrije
    puranam yatrotpannamrishimahurvasishtham | sa matarishva vibhurashvavaji sa rashmimansavita cadidevah
    || 18|| tenasura vijitah sarva eva tasya vikrantairvijitaniha trini | sa devanam manushanam pitrinam
    tamevahuryajnavidam vitanam || 19|| sa eva kalam vibhajannudeti tasyottaram dakshinam cayane dve |
    tasyaivordhvam tiryagadhashcaranti gabhastayo medinim tapayantah || 20|| tam brahmana vedavido jushanti
    tasyadityo bhamupayujya bhati | sa masi masyadhvarakridvidhatte tamadhvare vedavidah pathanti || 21||
    sa ekayukcakramidam trinabhi saptashvayuktam vahate vai tridhama | mahatejah sarvagah sarvasimhah
    krishno lokandharayate tathaikah || 22|| ashnannanashnamshca tathaiva dhirah krishnam sada partha
    kartaramehi || 22|| sa ekada kakshagato mahatma tripto vibhuh khandave dhumaketuh | sa rakshasanuragamshcavajitya
    sarvatragah sarvamagnau juhoti || 23|| sa evashvah shvetamashvam prayacchatsa evashvanatha sarvamshcakara
    | trivandhurastasya rathastricakra strivricchirashcaturasrashca tasya || 24|| sa vihayo vyadadhatpancanabhih
    sa nirmame gam divamantariksham | evam ramyanasrijatparvatamshca hrishikesho'mitadiptagnitejah ||
    25|| sa langhayanvai sarito jighamsansa tam vajram praharantam nirasa | sa mahendrah stuyate vai mahadhvare
    vipraireko riksahasraih puranaih || 26|| durvasa vai tena nanyena shakyo grihe rajanvasayitum mahaujah
    | tamevahurrishimekam puranam sa vishvakridvidadhatyatmabhavan || 27|| vedamshca yo vedayate'dhidevo
    vidhimshca yashcashrayate puranan | kame vede laukike yatphalam ca vishvaksene sarvametatpratihi ||
    28|| jyotimshi shuklani ca sarvaloke trayo loka lokapalastrayashca | trayo'gnayo vyahritayashca tisrah
    sarve deva devakiputra eva || 29|| samvatsarah sa rituh so'rdhamasah so'horatrah sa kala vai sa kashthah
    | matra muhurtashca lavah kshanashca vishvaksene sarvametatpratihi || 30|| candradityau grahanakshatratarah
    sarvani darshanyatha paurnamasyah | nakshatrayoga ritavashca partha vishvaksenatsarvametatprasutam
    || 31|| rudraditya vasavo'thashvinau ca sadhya vishve marutam shadganashca | prajapatirdevamataditishca
    sarve krishnadrishayashcaiva sapta || 32|| vayurbhutva vikshipate ca vishva magnirbhutva dahate vishvarupah
    | apo bhutva majjayate ca sarvam brahma bhutva srijate vishvasanghan || 33|| vedyam ca yadvedayate
    ca vedanvidhishca yashcashrayate vidheyan | dharme ca vede ca bale ca sarvam caracaram keshavam tvam
    pratihi || 34|| jyotirbhutah paramo'sau purasta tprakashayanprabhaya vishvarupah | apah srishtva hyatmabhuratmayonih
    purakarotsarvamevatha vishvam || 35|| ritunutpatanvividhanyadbhutani meghanvidyutsarvamairavatam ca
    | sarvam krishnatsthavaram jangamam ca vishvakhyatadvishnumenam pratihi || 36|| vishvavasam nirgunam
    vasudevam sankarshanam jivabhutam vadanti | tatah pradyumnamaniruddham caturtha majnapayatyatmayonirmahatma
    || 37|| sa pancadha pancajanopapannam sancodayanvishvamidam sisrikshuh | tatashcakaravanimarutau ca
    kham jyotirapashca tathaiva partha || 38|| sa sthavaram jangamam caivametaccaturvidham lokamimam ca
    kritva | tato bhumim vyadadhatpancabijam dyauh prithivyam dhasyati bhuri vari || 39|| tena vishvam
    kritametaddhi rajansa jivayatyatmanaivatmayonih || 39|| tato devanasuranmanushamshca lokanrishimshcatha
    pitrinprajashca | samasena vividhanpranilokansarvansada bhutapatih sisrikshuh || 40|| shubhashubham
    sthavaram jangamam ca vishvaksenatsarvametatpratihi | yadvartate yacca bhavishyatiha sarvametatkeshavam
    tvam pratihi || 41|| mrityushcaiva praninamantakale sakshatkrishnah shashvato dharmavahah | bhutam
    ca yacceha na vidma kincidvishvaksenatsarvametatpratihi || 42|| yatprashastam ca lokeshu punyam yacca
    shubhashubham | tatsarvam keshavo'cintyo viparitamato bhavet || 43|| etadrishah keshavo'yam svayambhurnarayanah
    paramashcavyayashca | madhyam casya jagatastasthushashca sarvesham bhutanam prabhavashcapyayashca
    || 44|| iti mahabharate anushasanaparvani 143 adhyayantargatam bhishmaproktam shrikrishnastotram sampurnam
    | mahabharata | anuparva | adhyaya 143
  devanagari: भीष्मप्रोक्तं २ श्रीकृष्णस्तोत्रम् कृष्णः पृथ्वीमसृजत्खं दिवं च वराहोऽयं भीमबलः पुराणः ।
    अस्य चाधोऽथान्तरिक्षं दिवं च दिशश्चतस्रः प्रदिशश्चतस्रः । सृष्टिस्तथैवेयमनुप्रसूता स निर्ममे विश्वमिदं
    पुराणम् ॥ ७॥ अस्य नाभ्यां पुष्करं सम्प्रसूतं यत्रोत्पन्नः स्वयमेवामितौजाः । येनाच्छिन्नं तत्तमः पार्थ
    घोरं यत्तत्तिष्ठत्यर्णवं तर्जयानम् ॥ ८॥ कृते युगे धर्म आसीत्समग्र स्त्रेताकाले ज्ञानमनुप्रपन्नः ।
    बलं त्वासीद्द्वापरे पार्थ कृष्णः कलावधर्मः क्षितिमाजगाम ॥ ९॥ स पूर्वदेवो निजघान दैत्यान्स पूर्वदेवश्च
    बभूव संराट् । स भूतानां भावनो भूतभव्यः स विश्वस्यास्य जगतश्चापि गोप्ता ॥ १०॥ यदा धर्मो ग्लायति वै
    सुराणां तदा कृष्णो जायते मानुषेषु । धर्मे स्थित्वा स तु वै भावितात्मा परांश्च लोकानपरांश्च याति ॥
    ११॥ त्याज्यांस्त्यक्त्वाथासुराणां वधाय कार्याकार्ये कारणं चैव पार्थ । कृतं करिष्यत्क्रियते च देवो
    मुहुः सोमं विद्धि च शक्रमेतम् ॥ १२॥ स विश्वकर्मा स च विश्वरूपः स विश्वभृद्विश्वसृग्विश्वजिच्च । स
    शूलभृच्छोणितभृत्करालस्तं कर्मभिर्विदितं वै स्तुवन्ति ॥ १३॥ तं गन्धर्वा अप्सरसश्च नित्य मुपतिष्ठन्ते
    विबुधानां शतानि । तं राक्षसाश्च परिसंवहन्ते रायस्पोषः स विजिगीषुरेकः ॥ १४॥ तमध्वरे शंसितारः स्तुवन्ति
    रथन्तरे सामगाश्च स्तुवन्ति । तं ब्राह्मणा ब्रह्ममन्त्रैः स्तुवन्ति तस्मै हविरध्वर्यवः कल्पयन्ति ॥
    १५॥ स पौराणीं ब्रह्मगुहां प्रविष्टो महीसत्रं भारताग्रे ददर्श । स चैव गामुद्दधाराग्र्यकर्मा विक्षोभ्य
    दैत्यानुरगान्दानवांश्च ॥ १६॥ तस्य भक्षान्विविधान्वेदयन्ति तमेवाजौ वाहनं वेदयन्ति । तस्यान्तरिक्षं
    पृथिवी दिवं च सर्वं वशे तिष्ठति शाश्वतस्य ॥ १७॥ स कुम्भरेताः ससृजे पुराणं यत्रोत्पन्नमृषिमाहुर्वसिष्ठम्
    । स मातरिश्वा विभुरश्ववाजी स रश्मिमान्सविता चादिदेवः ॥ १८॥ तेनासुरा विजिताः सर्व एव तस्य विक्रान्तैर्विजितानीह
    त्रीणि । स देवानां मानुषाणां पितॄणां तमेवाहुर्यज्ञविदां वितानम् ॥ १९॥ स एव कालं विभजन्नुदेति तस्योत्तरं
    दक्षिणं चायने द्वे । तस्यैवोर्ध्वं तिर्यगधश्चरन्ति गभस्तयो मेदिनीं तापयन्तः ॥ २०॥ तं ब्राह्मणा वेदविदो
    जुषन्ति तस्यादित्यो भामुपयुज्य भाति । स मासि मास्यध्वरकृद्विधत्ते तमध्वरे वेदविदः पठन्ति ॥ २१॥ स एकयुक्चक्रमिदं
    त्रिनाभि सप्ताश्वयुक्तं वहते वै त्रिधामा । महातेजाः सर्वगः सर्वसिंहः कृष्णो लोकान्धारयते तथैकः ॥ २२॥
    अश्नन्ननश्नंश्च तथैव धीरः कृष्णं सदा पार्थ कर्तारमेहि ॥ २२॥ स एकदा कक्षगतो महात्मा तृप्तो विभुः खाण्डवे
    धूमकेतुः । स राक्षसानुरगांश्चावजित्य सर्वत्रगः सर्वमग्नौ जुहोति ॥ २३॥ स एवाश्वः श्वेतमश्वं प्रयच्छत्स
    एवाश्वानथ सर्वांश्चकार । त्रिवन्धुरस्तस्य रथस्त्रिचक्र स्त्रिवृच्छिराश्चतुरस्रश्च तस्य ॥ २४॥ स विहायो
    व्यदधात्पञ्चनाभिः स निर्ममे गां दिवमन्तरिक्षम् । एवं रम्यानसृजत्पर्वतांश्च हृषीकेशोऽमितदीप्ताग्नितेजाः
    ॥ २५॥ स लङ्घयन्वै सरितो जिघांसन्स तं वज्रं प्रहरन्तं निरास । स महेन्द्रः स्तूयते वै महाध्वरे विप्रैरेको
    ऋक्सहस्रैः पुराणैः ॥ २६॥ दुर्वासा वै तेन नान्येन शक्यो गृहे राजन्वासयितुं महौजाः । तमेवाहुरृषिमेकं
    पुराणं स विश्वकृद्विदधात्यात्मभावान् ॥ २७॥ वेदांश्च यो वेदयतेऽधिदेवो विधींश्च यश्चाश्रयते पुराणान्
    । कामे वेदे लौकिके यत्फलं च विष्वक्सेने सर्वमेतत्प्रतीहि ॥ २८॥ ज्योतींषि शुक्लानि च सर्वलोके त्रयो
    लोका लोकपालास्त्रयश्च । त्रयोऽग्नयो व्याहृतयश्च तिस्रः सर्वे देवा देवकीपुत्र एव ॥ २९॥ संवत्सरः स ऋतुः
    सोऽर्धमासः सोऽहोरात्रः स कला वै स काष्ठाः । मात्रा मुहूर्ताश्च लवाः क्षणाश्च विष्वक्सेने सर्वमेतत्प्रतीहि
    ॥ ३०॥ चन्द्रादित्यौ ग्रहनक्षत्रताराः सर्वाणि दर्शान्यथ पौर्णमास्यः । नक्षत्रयोगा ऋतवश्च पार्थ विष्वक्सेनात्सर्वमेतत्प्रसूतम्
    ॥ ३१॥ रुद्रादित्या वसवोऽथाश्विनौ च साध्या विश्वे मरुतां षड्गणाश्च । प्रजापतिर्देवमातादितिश्च सर्वे
    कृष्णादृषयश्चैव सप्त ॥ ३२॥ वायुर्भूत्वा विक्षिपते च विश्व मग्निर्भूत्वा दहते विश्वरूपः । आपो भूत्वा
    मज्जयते च सर्वं ब्रह्मा भूत्वा सृजते विश्वसङ्घान् ॥ ३३॥ वेद्यं च यद्वेदयते च वेदान्विधिश्च यश्चाश्रयते
    विधेयान् । धर्मे च वेदे च बले च सर्वं चराचरं केशवं त्वं प्रतीहि ॥ ३४॥ ज्योतिर्भूतः परमोऽसौ पुरस्ता
    त्प्रकाशयन्प्रभया विश्वरूपः । अपः सृष्ट्वा ह्यात्मभूरात्मयोनिः पुराकरोत्सर्वमेवाथ विश्वम् ॥ ३५॥ ऋतूनुत्पातान्विविधान्यद्भुतानि
    मेघान्विद्युत्सर्वमैरावतं च । सर्वं कृष्णात्स्थावरं जङ्गमं च विश्वाख्याताद्विष्णुमेनं प्रतीहि ॥ ३६॥
    विश्वावासं निर्गुणं वासुदेवं सङ्कर्षणं जीवभूतं वदन्ति । ततः प्रद्युम्नमनिरुद्धं चतुर्थ माज्ञापयत्यात्मयोनिर्महात्मा
    ॥ ३७॥ स पञ्चधा पञ्चजनोपपन्नं सञ्चोदयन्विश्वमिदं सिसृक्षुः । ततश्चकारावनिमारुतौ च खं ज्योतिरापश्च तथैव
    पार्थ ॥ ३८॥ स स्थावरं जङ्गमं चैवमेतच्चतुर्विधं लोकमिमं च कृत्वा । ततो भूमिं व्यदधात्पञ्चबीजां द्यौः
    पृथिव्यां धास्यति भूरि वारि ॥ ३९॥ तेन विश्वं कृतमेतद्धि राजन्स जीवयत्यात्मनैवात्मयोनिः ॥ ३९॥ ततो देवानसुरान्मानुषांश्च
    लोकानृषींश्चाथ पितॄन्प्रजाश्च । समासेन विविधान्प्राणिलोकान्सर्वान्सदा भूतपतिः सिसृक्षुः ॥ ४०॥ शुभाशुभं
    स्थावरं जङ्गमं च विष्वक्सेनात्सर्वमेतत्प्रतीहि । यद्वर्तते यच्च भविष्यतीह सर्वमेतत्केशवं त्वं प्रतीहि
    ॥ ४१॥ मृत्युश्चैव प्राणिनामन्तकाले साक्षात्कृष्णः शाश्वतो धर्मवाहः । भूतं च यच्चेह न विद्म किञ्चिद्विष्वक्सेनात्सर्वमेतत्प्रतीहि
    ॥ ४२॥ यत्प्रशस्तं च लोकेषु पुण्यं यच्च शुभाशुभम् । तत्सर्वं केशवोऽचिन्त्यो विपरीतमतो भवेत् ॥ ४३॥ एतादृशः
    केशवोऽयं स्वयम्भूर्नारायणः परमश्चाव्ययश्च । मध्यं चास्य जगतस्तस्थुषश्च सर्वेषां भूतानां प्रभवश्चाप्ययश्च
    ॥ ४४॥ इति महाभारते अनुशासनपर्वणि १४३ अध्यायान्तर्गतं भीष्मप्रोक्तं श्रीकृष्णस्तोत्रं सम्पूर्णम् ।
    महाभारत । अनुपर्व । अध्याय १४३
