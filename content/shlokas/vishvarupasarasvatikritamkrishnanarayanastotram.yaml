id: vishvarupasarasvatikritamkrishnanarayanastotram
category: stotram
name:
  english: vishvarupasarasvatikritamkrishnanarayanastotram
  devanagari: विश्वरूपासरस्वतीकृतंकृष्णनारायणस्तोत्रम्
content:
  english: ringi caturvaktra catushpada caturmukhi || 31|| caturhasta caturnetra caturdamshtra catuhstani
    | nanama padayosturnam vyomna cagatya vai purah || 32|| krishnanarayanapadatale lileha jihvaya | harirvari
    dadau tasyai jihvayam sa papau drutam || 33|| kumari sa'bhavattatra vishvarupa sarasvati | tushtava
    paramatmanam shripativallabham nijam || 34|| namo'nadikrishnakanta ramakanta ca te namah | namah shrimanikikanta
    lakshmikanta ca te namah || 35|| namah sarasvatikanta radhakanta ca te namah | sukhadashrikanta padmavatikanta
    ca te namah || 36|| aham shaktirbhavan shaktah krishna'ham krishna te namah | aham bhagavati bharya
    bhagava~stvam patih prabhuh || 37|| tapastaptam samayata golokattu tava''jnaya | pavanim mam samajnapya
    sthapaya'tra sarastate || 38|| tirtham tvatra hare krishna mannamna'pi vidhehi ca | tatha'stviti harih
    praha badrike tam sarasvatim || 39|| asthapayat sarastire mahadhenum sarasvatim | narayanasarastire
    tirtham sarasvatam shubham || 40|| iti shrilakshminarayaniyasamhitayah tishyasantanatmakasya vishvarupa
    sarasvatikritam krishnanarayanastotram sampurnam | lakshminarayaniyasamhita | khanda 4| adhyaya 45
  devanagari: ृङ्गी चतुर्वक्त्रा चतुष्पादा चतुर्मुखी ॥ ३१॥ चतुर्हस्ता चतुर्नेत्रा चतुर्दंष्ट्रा चतुःस्तनी
    । ननाम पादयोस्तूर्णं व्योम्ना चागत्य वै पुरः ॥ ३२॥ कृष्णनारायणपादतले लिलेह जिह्वया । हरिर्वारि ददौ
    तस्यै जिह्वायां सा पपौ द्रुतम् ॥ ३३॥ कुमारी साऽभवत्तत्र विश्वरूपा सरस्वती । तुष्टाव परमात्मानं श्रीपतिवल्लभं
    निजम् ॥ ३४॥ नमोऽनादिकृष्णकान्त रमाकान्त च ते नमः । नमः श्रीमाणिकीकान्त लक्ष्मीकान्त च ते नमः ॥ ३५॥
    नमः सरस्वतीकान्त राधाकान्त च ते नमः । सुखदाश्रीकान्त पद्मावतीकान्त च ते नमः ॥ ३६॥ अहं शक्तिर्भवान्
    शक्तः कृष्णाऽहं कृष्ण ते नमः । अहं भगवती भार्या भगवाँस्त्वं पतिः प्रभुः ॥ ३७॥ तपस्तप्तं समायाता गोलोकात्तु
    तवाऽऽज्ञया । पावनीं मां समाज्ञाप्य स्थापयाऽत्र सरस्तटे ॥ ३८॥ तीर्थं त्वत्र हरे कृष्ण मन्नाम्नाऽपि
    विधेहि च । तथाऽस्त्विति हरिः प्राह बद्रिके तां सरस्वतीम् ॥ ३९॥ अस्थापयत् सरस्तीरे महाधेनुं सरस्वतीम्
    । नारायणसरस्तीरे तीर्थं सारस्वतं शुभम् ॥ ४०॥ इति श्रीलक्ष्मीनारायणीयसंहितायाः तिष्यसन्तानात्मकस्य
    विश्वरूपा सरस्वतीकृतं कृष्णनारायणस्तोत्रं सम्पूर्णम् । लक्ष्मीनारायणीयसंहिता । खण्ड ४। अध्याय ४५
