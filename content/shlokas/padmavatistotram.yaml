id: padmavatistotram
category: stotram
name:
  english: padmavatistotram
  devanagari: पद्मावतीस्तोत्रम्
content:
  english: 27 shrih || astu padmasaromadhyadavirbhutam param mahah | vashe yasya param dhama tadvrishacala
    masthitam || 1|| ananyadhinavibhavamadbhutam daivatam shraye | mataram jagatam lakshmim jaganmatuh
    param priyam || 2|| sakhibhishshrutibhirnityam yam yathavat panayitam | akarnya hridaye nyasyan labdhatma
    shrinidhih parah || 3|| matuste namadheyam tat debateti harirdhruvam | padmadevyucyate tena nityashlishtataya
    tvaya || 4|| prajah patipriyah kritva bhogasamyavidhitsaya | svacchayashrayanam tasu tanoshi kripaya
    rame || 5|| sarojasaurabha''dhayi divyam lavanyavarshi te | vashikritavrishadrisham rupam papam vyapohatu
    || 6|| abhaye kripaya devi pratijnate tvaya harih | vyajabhangabhiya vakti prapattim panimudraya ||
    7|| yaya khalu parishvakto devo devatvamashnute | shraddhaya sarvalokaikahitam tvam mataram shraye
    || 8|| ambujanivasarasikamambujanetrasya vallabham devim | anavadyagunagarimna shriyam param nissamam
    vande || 9|| ashrayatu manasam sukhamasinamambuje jagajjananim | ashritarakshanahetoradritapadmavatirupam
    || 10|| pranamayati savyakarato dakshinato ya dadati capyabhayam | svadhinalokavrittim sarojavasam
    param vande || 11|| paraya maya tvaya khalu paramo'bhutpurusha esha devi tatha | aparamata''pattibhiya'napayinimurasi
    dhatte tvam || 12|| nigrahanitantaduramagraharahitaih prabuddhavibhavam tvam | prapyam prapakabhutam
    paramam vishnoh priyam vande || 13|| nikhilavibhutiniyanta yatpadalakshankalakshitoraskah | atyantasaumyamurtim
    mataramanagham shriyam vande || 14|| dushkritakartribahishkritibaddhashraddhe pare harau pumsi | pradushkritavacanasudham
    shriyam prapadye shubham dadatim || 15|| akhilairashritahrudyairgunaih param tvam nirikshya savridam
    | vishnum shrutirdhruvam shrih sakhistvamadishtavatyasi stotum || 16|| papani vardhayati nah paro
    ranam taishcikirshurativelam | rakshovadhanta iva te parirambham mataradbhutam lipsuh || 17|| anaghairambujavasini
    katakshitaissahajashitalairdivyaih | acyutarupollasibhirasmaka bhavukamatra dehi tvam || 18|| shukapuramadhyashobhishubhasadmasamujjvalaya
    vrishagirisha
  devanagari: २७ श्रीः ॥ अस्तु पद्मसरोमध्यादाविर्भूतं परं महः । वशे यस्य परं धाम तद्वृषाचल मास्थितम् ॥
    १॥ अनन्याधीनविभवमद्भुतं दैवतं श्रये । मातरं जगतां लक्ष्मीं जगन्मातुः परां प्रियाम् ॥ २॥ सखीभिश्श्रुतिभिर्नित्यं
    यां यथावत् पनायिताम् । आकर्ण्य हृदये न्यस्यन् लब्धात्मा श्रीनिधिः परः ॥ ३॥ मातुस्ते नामधेयं तत् देबतेति
    हरिर्ध्रुवम् । पद्मदेव्युच्यते तेन नित्यश्लिष्टतया त्वया ॥ ४॥ प्रजाः पतिप्रियाः कृत्वा भोगसाम्यविधित्सया
    । स्वच्छायाश्रयणं तासु तनोषि कृपया रमे ॥ ५॥ सरोजसौरभाऽऽधायि दिव्यं लावण्यवर्षि ते । वशीकृतवृषाद्रीशं
    रूपं पापं व्यपोहतु ॥ ६॥ अभये कृपया देवि प्रतिज्ञाते त्वया हरिः । व्याजभङ्गभिया वक्ति प्रपत्तिं पाणिमुद्रया
    ॥ ७॥ यया खलु परिष्वक्तो देवो देवत्वमश्नुते । श्रद्धया सर्वलोकैकहितां त्वां मातरं श्रये ॥ ८॥ अम्बुजनिवासरसिकामम्बुजनेत्रस्य
    वल्लभां देवीम् । अनवद्यगुणगरिम्ना श्रियं परां निस्समां वन्दे ॥ ९॥ आश्रयतु मानसं सुखमासीनामम्बुजे जगज्जननीम्
    । आश्रितरक्षणहेतोरादृतपद्मावतीरूपाम् ॥ १०॥ प्रणमयति सव्यकरतो दक्षिणतो या ददाति चाप्यभयम् । स्वाधीनलोकवृत्तिं
    सरोजवासां परां वन्दे ॥ ११॥ परया मया त्वया खलु परमोऽभूत्पुरुष एष देवि तथा । अपरमताऽऽपत्तिभियाऽनपायिनीमुरसि
    धत्ते त्वाम् ॥ १२॥ निग्रहनितान्तदूरामाग्रहरहितैः प्रबुद्धविभवां त्वाम् । प्राप्यां प्रापकभूतां परमां
    विष्णोः प्रियां वन्दे ॥ १३॥ निखिलविभूतिनियन्ता यत्पदलाक्षाङ्कलक्षितोरस्कः । अत्यन्तसौम्यमूर्तिं मातरमनघां
    श्रियं वन्दे ॥ १४॥ दुष्कृतकर्तृबहिष्कृतिबद्धश्रद्धे परे हरौ पुंसि । प्रादुष्कृतवचनसुधां श्रियं प्रपद्ये
    शुभं ददतीम् ॥ १५॥ अखिलैराश्रितह्रुद्यैर्गुणैः परां त्वां निरीक्ष्य सव्रीडम् । विष्णुं श्रुतीर्ध्रुवं
    श्रीः सखीस्त्वमादिष्टवत्यसि स्तोतुम् ॥ १६॥ पापानि वर्धयति नः परो रणं तैश्चिकीर्षुरतिवेलम् । रक्षोवधान्त
    इव ते परिरम्भं मातरद्भुतं लिप्सुः ॥ १७॥ अनघैरम्बुजवासिनि कटाक्षितैस्सहजशीतलैर्दिव्यैः । अच्युतरूपोल्लासिभिरस्माक
    भवुकमत्र देहि त्वम् ॥ १८॥ शुकपुरमध्यशोभिशुभसद्मसमुज्ज्वलया वृषगिरिश
