id: ganapatistavah
category: stotram
name:
  english: ganapatistavah
  devanagari: गणपतिस्तवः
content:
  english: shriganapatistavah shri ganeshaya namah || brahmavishnumaheshvara ucuh| ajam nirvikalpam nirakaramekam
    niralambamadvaitamanandapurnam | param nirgunam nirvishesham niriham param brahmarupam ganesham bhajema
    || 1|| gunatitamadyam cidanandarupam cidabhasakam sarvagam jnanagamyam | munidhyeyamakasharupam paresham
    param brahmarupam ganesham bhajema || 2|| jagatkaranam karanajnanahinam suradim sukhadim yugadim ganesham
    | jagadvyapinam vishvavandyam suresham param brahmarupam ganesham bhajema || 3|| rajoyogato brahmarupam
    shrutijnam sada karyasaktam hrida'cintyarupam | jagatkarakam sarvavidyanidhanam sada brahmarupam ganesham
    natah smah || 4|| sada sattvayogam muda kridamanam surarin harantam jagatpalayantam | anekavataram
    nijajnanaharam sada vishnurupam ganesham natah smah || 5|| tamoyoginam rudrarupam trinetram jagaddharakam
    tarakam jnanahetum | anekagamaih svam janam bodhayantam sada sharvarupam ganesham natah smah || 6||
    tamahstomaharam janajnanaharam trayivedasaram parabrahmaparam | munijnanakaram vidure vikaram sada
    bradhnarupam ganesham natah smah|| 7|| nijairaushadhaistarpayantam karoghaih suraughankalabhih sudhasravinibhih
    | dineshamshusantapaharam dvijesham shashankasvarupam ganesham natah smah || 8|| prakashasvarupam
    nabhovayurupam vikaradihetum kalakalabhutam | anekakriyanekashaktisvarupam sada shaktirupam ganesham
    natah smah || 9|| pradhanasvarupam mahattattvarupam dharavarirupam digishadirupam | asatsatsvarupam
    jagaddhetubhupam sada vishvarupam ganesham natah smah || 10|| tvadiye manah sthapayedanghriyugme jano
    vighnasanghanna pidam labheta | lasatsuryabimbe vishale sthite'yam jano dhvantabadham katham va labheta
    || 11|| vayam bhramitah sarvatha'jnanayogadalabdhva tavanghrim bahunvarshapugan | idanimavaptastavaiva
    prasadatprapannansada pahi vishvambharadya || 12|| brahmovaca | evam stuto ganeshastu santushto'bhunmahamune
    | kripaya parayopeto'bhidhatum tan pracakrame || 13|| phalashrutih | ganesha uvaca | yadartham kleshita
    yuyam yadarthamiha cagatah | prito'hamanaya stutya varam matto vrinita tam || 14|| kritanca mama yat
    stotram bhavadbhirbhavitatmabhih | stotrarajamitikhyatam bhavishyati mamajnaya || 15|| idam yah pathet
    pratarutthaya dhiman strisandhyam sada bhaktiyukto vishuddhah | sa putran shriyam sarvakaman labheta
    parabrahmarupo bhavedantakale || 16|| iti ganeshapurana upasanakhande trayodasho'dhyaye brahmavishnumaheshvarakrito
    ganapatistavah sampurnah ||
  devanagari: श्रीगणपतिस्तवः श्री गणेशाय नमः ॥ ब्रह्मविष्णुमहेश्वरा ऊचुः। अजं निर्विकल्पं निराकारमेकं
    निरालम्बमद्वैतमानन्दपूर्णम् । परं निर्गुणं निर्विशेषं निरीहं परं ब्रह्मरूपं गणेशं भजेम ॥ १॥ गुणातीतमाद्यं
    चिदानन्दरूपं चिदाभासकं सर्वगं ज्ञानगम्यम् । मुनिध्येयमाकाशरूपं परेशं परं ब्रह्मरूपं गणेशं भजेम ॥ २॥
    जगत्कारणं कारणाज्ञानहीनं सुरादिं सुखादिं युगादिं गणेशम् । जगद्व्यापिनं विश्ववन्द्यं सुरेशं परं ब्रह्मरूपं
    गणेशं भजेम ॥ ३॥ रजोयोगतो ब्रह्मरूपं श्रुतिज्ञं सदा कार्यसक्तं हृदाऽचिन्त्यरूपम् । जगत्कारकं सर्वविद्यानिधानं
    सदा ब्रह्मरूपं गणेशं नताः स्मः ॥ ४॥ सदा सत्त्वयोगं मुदा क्रीडमानं सुरारीन् हरन्तं जगत्पालयन्तम् ।
    अनेकावतारं निजाज्ञानहारं सदा विष्णुरूपं गणेशं नताः स्मः ॥ ५॥ तमोयोगिनं रुद्ररूपं त्रिनेत्रं जगद्धारकं
    तारकं ज्ञानहेतुम् । अनेकागमैः स्वं जनं बोधयन्तं सदा शर्वरूपं गणेशं नताः स्मः ॥ ६॥ तमःस्तोमहारं जनाज्ञानहारं
    त्रयीवेदसारं परब्रह्मपारम् । मुनिज्ञानकारं विदूरे विकारं सदा ब्रध्नरूपं गणेशं नताः स्मः॥ ७॥ निजैरौषधैस्तर्पयन्तं
    करोघैः सुरौघान्कलाभिः सुधास्राविणीभिः । दिनेशांशुसन्तापहारं द्विजेशं शशाङ्कस्वरूपं गणेशं नताः स्मः
    ॥ ८॥ प्रकाशस्वरूपं नभोवायुरूपं विकारादिहेतुं कलाकालभूतम् । अनेकक्रियानेकशक्तिस्वरूपं सदा शक्तिरूपं
    गणेशं नताः स्मः ॥ ९॥ प्रधानस्वरूपं महत्तत्त्वरूपं धरावारिरूपं दिगीशादिरूपम् । असत्सत्स्वरूपं जगद्धेतुभूपं
    सदा विश्वरूपं गणेशं नताः स्मः ॥ १०॥ त्वदीये मनः स्थापयेदङ्घ्रियुग्मे जनो विघ्नसङ्घान्न पीडां लभेत
    । लसत्सूर्यबिम्बे विशाले स्थितेऽयं जनो ध्वान्तबाधां कथं वा लभेत ॥ ११॥ वयं भ्रामिताः सर्वथाऽज्ञानयोगादलब्ध्वा
    तवाङ्घ्रिं बहून्वर्षपूगान् । इदानीमवाप्तास्तवैव प्रसादात्प्रपन्नान्सदा पाहि विश्वम्भराद्य ॥ १२॥ ब्रह्मोवाच
    । एवं स्तुतो गणेशस्तु सन्तुष्टोऽभून्महामुने । कृपया परयोपेतोऽभिधातुं तान् प्रचक्रमे ॥ १३॥ फलश्रुतिः
    । गणेश उवाच । यदर्थं क्लेशिता यूयं यदर्थमिह चागताः । प्रीतोऽहमनया स्तुत्या वरं मत्तो वृणीत तम् ॥ १४॥
    कृतञ्च मम यत् स्तोत्रं भवद्भिर्भावितात्मभिः । स्तोत्रराजमितिख्यातं भविष्यति ममाज्ञया ॥ १५॥ इदं यः
    पठेत् प्रातरुत्थाय धीमान् स्त्रिसन्ध्यं सदा भक्तियुक्तो विशुद्धः । स पुत्रान् श्रियं सर्वकामान् लभेत
    परब्रह्मरूपो भवेदन्तकाले ॥ १६॥ इति गणेशपुराण उपासनाखण्डे त्रयोदशोऽध्याये ब्रह्मविष्णुमहेश्वराकृतो
    गणपतिस्तवः सम्पूर्णः ॥
