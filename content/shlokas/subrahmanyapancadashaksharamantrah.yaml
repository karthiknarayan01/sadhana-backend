id: subrahmanyapancadashaksharamantrah
category: mantra
name:
  english: subrahmanyapancadashaksharamantrah
  devanagari: सुब्रह्मण्यपन्चदशाक्षरमन्त्रः
content:
  english: pancapuja | lam prithivyatmane gandham kalpayami | ham akashatmane pushpani kalpayami | yam
    vayvatmane dhupam kalpayami | ram agnyatmane dipam kalpayami | vam amritatmane amritam mahanaivedyam
    kalpayami | sam sarvatmane tambuladi sarvopacarapujan kalpayami || mulamantrah
  devanagari: पञ्चपूजा । लं पृथिव्यात्मने गन्धं कल्पयामि । हं आकाशात्मने पुष्पाणि कल्पयामि । यं वाय्वात्मने
    धूपं कल्पयामि । रं अग्न्यात्मने दीपं कल्पयामि । वं अमृतात्मने अमृतं महानैवेद्यं कल्पयामि । सं सर्वात्मने
    ताम्बूलादि सर्वोपचारपूजान् कल्पयामि ॥ मूलमन्त्रः
meaning: {}
