id: uma-1000
category: stotram
name:
  english: uma 1000
  devanagari: उम १०००
content:
  english: 21|| janani jagatam svalpe kame'pyayam tvayi lambate purabhidabale madhye kame'pyayam tvayi
    lambate | bahulakarune shreshthe kame'pyayam tvayi lambate bhagavati pare vite kame'pyayam tvayi lambate
    || 34
  devanagari: २१॥ जननि जगतां स्वल्पे कामेऽप्ययं त्वयि लम्बते पुरभिदबले मध्ये कामेऽप्ययं त्वयि लम्बते ।
    बहुलकरुणे श्रेष्ठे कामेऽप्ययं त्वयि लम्बते भगवति परे वीते कामेऽप्ययं त्वयि लम्बते ॥ ३४
meaning: {}
