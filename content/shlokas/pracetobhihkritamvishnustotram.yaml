id: pracetobhihkritamvishnustotram
category: stotram
name:
  english: pracetobhihkritamvishnustotram
  devanagari: प्रचेतोभिःकृतंविष्णुस्तोत्रम्
content:
  english: pracetobhih kritam vishnustotram pracetasa ucuh | namo namah kleshavinashanaya nirupitodaragunahvayaya
    | manovacovegapurojavaya sarvakshamargairagatadhvane namah || 22|| shuddhaya shantaya namah svanishthaya
    manasyapartham vilasaddvayaya | namo jagatsthanalayodayeshu grihitamayagunavigrahaya || 23|| namo
    vishuddhasattvaya haraye harimedhase | vasudevaya krishnaya prabhave sarvasatvatam || 24|| namah kamalanabhaya
    namah kamalamaline | namah kamalapadaya namaste kamalekshana || 25|| namah kamalakinjalkapishangamalavasase
    | sarvabhutanivasaya namo'yunkshmahi sakshine || 26|| rupam bhagavata tvetadasheshakleshasankshayam
    | avishkritam nah klishtanam kimanyadanukampitam || 27|| etavattvam hi vibhubhirbhavyam dineshu vatsalaih
    | yadanusmaryate kale svabuddhyabhadrarandhana || 28|| yenopashantirbhutanam kshullakanamapiha tam
    | antarhito'ntarhridaye kasmanno veda nashishah || 29|| asaveva varo'smakamipsito jagatah pate | prasanno
    bhagavan yeshamapavargagururgatih || 30|| varam vrinimahe'thapi natha tvatparatah parat | na hyantastvadvibhutinam
    so'nanta iti giyase || 31|| parijate'njasa labdhe sarango'nyanna sevate | tvadanghrimulamasadya sakshatkim
    kim vrinimahi || 32|| yavatte mayaya sprishta bhramama iha karmabhih | tavadbhavatprasanganam sangah
    syanno bhave bhave || 33|| tulayama lavenapi na svargam napunarbhavam | bhagavatsangisangasya martyanam
    kimutashishah || 34|| yatredyante katha mrishtastrishnayah prashamo yatah | nirvairam yatra bhuteshu
    nodvego yatra kashcana || 35|| yatra narayanah sakshadbhagavan nyasinam gatih | samstuyate satkathasu
    muktasangaih punah punah || 36|| tesham vicaratam padbhyam tirthanam pavanecchaya | bhitasya kim na
    roceta tavakanam samagamah || 37|| vayam tu sakshadbhagavan bhavasya priyasya sakhyuh kshanasangamena
    | sudushcikitsyasya bhavasya mrityo
  devanagari: प्रचेतोभिः कृतं विष्णुस्तोत्रम् प्रचेतस ऊचुः । नमो नमः क्लेशविनाशनाय निरूपितोदारगुणाह्वयाय
    । मनोवचोवेगपुरोजवाय सर्वाक्षमार्गैरगताध्वने नमः ॥ २२॥ शुद्धाय शान्ताय नमः स्वनिष्ठया मनस्यपार्थं विलसद्द्वयाय
    । नमो जगत्स्थानलयोदयेषु गृहीतमायागुणविग्रहाय ॥ २३॥ नमो विशुद्धसत्त्वाय हरये हरिमेधसे । वासुदेवाय कृष्णाय
    प्रभवे सर्वसात्वताम् ॥ २४॥ नमः कमलनाभाय नमः कमलमालिने । नमः कमलपादाय नमस्ते कमलेक्षण ॥ २५॥ नमः कमलकिञ्जल्कपिशङ्गामलवाससे
    । सर्वभूतनिवासाय नमोऽयुङ्क्ष्महि साक्षिणे ॥ २६॥ रूपं भगवता त्वेतदशेषक्लेशसङ्क्षयम् । आविष्कृतं नः
    क्लिष्टानां किमन्यदनुकम्पितम् ॥ २७॥ एतावत्त्वं हि विभुभिर्भाव्यं दीनेषु वत्सलैः । यदनुस्मर्यते काले
    स्वबुद्ध्याभद्ररन्धन ॥ २८॥ येनोपशान्तिर्भूतानां क्षुल्लकानामपीह ताम् । अन्तर्हितोऽन्तर्हृदये कस्मान्नो
    वेद नाशिषः ॥ २९॥ असावेव वरोऽस्माकमीप्सितो जगतः पते । प्रसन्नो भगवान् येषामपवर्गगुरुर्गतिः ॥ ३०॥ वरं
    वृणीमहेऽथापि नाथ त्वत्परतः परात् । न ह्यन्तस्त्वद्विभूतीनां सोऽनन्त इति गीयसे ॥ ३१॥ पारिजातेऽञ्जसा
    लब्धे सारङ्गोऽन्यन्न सेवते । त्वदङ्घ्रिमूलमासाद्य साक्षात्किं किं वृणीमहि ॥ ३२॥ यावत्ते मायया स्पृष्टा
    भ्रमाम इह कर्मभिः । तावद्भवत्प्रसङ्गानां सङ्गः स्यान्नो भवे भवे ॥ ३३॥ तुलयाम लवेनापि न स्वर्गं नापुनर्भवम्
    । भगवत्सङ्गिसङ्गस्य मर्त्यानां किमुताशिषः ॥ ३४॥ यत्रेड्यन्ते कथा मृष्टास्तृष्णायाः प्रशमो यतः । निर्वैरं
    यत्र भूतेषु नोद्वेगो यत्र कश्चन ॥ ३५॥ यत्र नारायणः साक्षाद्भगवान् न्यासिनां गतिः । संस्तूयते सत्कथासु
    मुक्तसङ्गैः पुनः पुनः ॥ ३६॥ तेषां विचरतां पद्भ्यां तीर्थानां पावनेच्छया । भीतस्य किं न रोचेत तावकानां
    समागमः ॥ ३७॥ वयं तु साक्षाद्भगवन् भवस्य प्रियस्य सख्युः क्षणसङ्गमेन । सुदुश्चिकित्स्यस्य भवस्य मृत्यो
