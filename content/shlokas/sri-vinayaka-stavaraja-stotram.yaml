id: sri-vinayaka-stavaraja-stotram
category: stotram
name:
  english: Sri Vinayaka Stavaraja Stotram
content:
  english: bijapuragadekshukarmukaruja cakrabjapashotpala vrihyagrasvavishanaratnakalashaprodyatkarambhoruhah
    | dhyeyo vallabhaya sapadmakarayashlishtojjvaladbhushaya vishvotpattivipattisamsthitikaro vighnesha
    ishtarthadah || || namaste siddhilakshmisha ganadhipa mahaprabho | vighneshvara jagannatha gauriputra
    jagatprabho || || jaya vighneshvara vibho vinayaka maheshvara | lambodara mahabaho sarvada tvam prasida
    me || || mahadeva jagatsvamin mushikarudha shankara | vishalaksha mahakaya mam trahi parameshvara
    || || kunjarasya suradhisha mahesha karunanidhe | matulungadhara svamin gadacakrasamanvita || || dashabaho
    maharaja gajavaktra caturbhuja | shurpakarna mahakarna gananatha prasida me || || shankhashulasamayukta
    bijapurasamanvita | ikshukarmukasamyukta padmahasta prasida me || || nanabharanasamyukta ratnakumbhakara
    prabho | sargasthitilayadhisha paramatman jaya prabho || || anathanatha vishvesha vighnasanghavinashana
    | trayimurte surapate brahmavishnushivatmaka || || trayiguna mahadeva pahi mam sarvapalaka | animadigunadhara
    lakshmishrivishnupujita || || gaurishankarasampujya jaya tvam gananayaka | ratimanmathasamsevya mahibhudarasamstuta
    || || riddhyamodadisamsevya mahaganapate jaya | shankhapadmadisamsevya niralamba nirishvara || ||
    nishkalanka niradhara pahi mam nityamavyaya | anadya jagatamadya pitamahasupujita || || dhumaketo
    ganadhyaksha mahamushakavahana | anantaparamananda jaya vighneshvareshvara || || ratnasimhasanasina
    kiritena sushobhita | paratpara pareshana parapurusha pahi mam || || nirdvandva nirgunabhasa japapushpasamaprabha
    | sarvapramathasamstutya trahi mam vighnanayaka || || kumarasya guro deva sarvaishvaryapradayaka |
    sarvabhishtaprada svamin sarvapratyuhanashaka || || sharanya sarvalokanam sharanagatavatsala | mahaganapate
    nityam mam palaya kripanidhe || || evam shrigananathasya stavarajamanuttamam | yah pathecchrinuyannityam
    pratyuhaih sa vimucyate || || ashvamedhasamam punyaphalam prapnotyanuttamam | vashikaroti trailokyam
    prapya saubhagyamuttamam || || sarvabhishtamavapnoti shighrameva sudurlabham | mahaganeshasannidhyam
    prapnotyeva na samshayah || || iti shrirudrayamale shrivinayakastavarajah sampurnam |
  devanagari: बीजापूरगदेक्षुकार्मुकरुजा चक्राब्जपाशोत्पल व्रीह्यग्रस्वविषाणरत्नकलशप्रोद्यत्कराम्भोरुहः
    । ध्येयो वल्लभया सपद्मकरयाश्लिष्टोज्ज्वलद्भूषया विश्वोत्पत्तिविपत्तिसंस्थितिकरो विघ्नेश इष्टार्थदः
    ॥ ॥ नमस्ते सिद्धिलक्ष्मीश गणाधिप महाप्रभो । विघ्नेश्वर जगन्नाथ गौरीपुत्र जगत्प्रभो ॥ ॥ जय विघ्नेश्वर
    विभो विनायक महेश्वर । लम्बोदर महाबाहो सर्वदा त्वं प्रसीद मे ॥ ॥ महादेव जगत्स्वामिन् मूषिकारूढ शङ्कर
    । विशालाक्ष महाकाय मां त्राहि परमेश्वर ॥ ॥ कुञ्जरास्य सुराधीश महेश करुणानिधे । मातुलुङ्गधर स्वामिन्
    गदाचक्रसमन्वित ॥ ॥ दशबाहो महाराज गजवक्त्र चतुर्भुज । शूर्पकर्ण महाकर्ण गणनाथ प्रसीद मे ॥ ॥ शङ्खशूलसमायुक्त
    बीजापूरसमन्वित । इक्षुकार्मुकसंयुक्त पद्महस्त प्रसीद मे ॥ ॥ नानाभरणसंयुक्त रत्नकुम्भकर प्रभो । सर्गस्थितिलयाधीश
    परमात्मन् जय प्रभो ॥ ॥ अनाथनाथ विश्वेश विघ्नसङ्घविनाशन । त्रयीमूर्ते सुरपते ब्रह्मविष्णुशिवात्मक ॥
    ॥ त्रयीगुण महादेव पाहि मां सर्वपालक । अणिमादिगुणाधार लक्ष्मीश्रीविष्णुपूजित ॥ ॥ गौरीशङ्करसम्पूज्य
    जय त्वं गणनायक । रतिमन्मथसंसेव्य महीभूदारसंस्तुत ॥ ॥ ऋद्ध्यामोदादिसंसेव्य महागणपते जय । शङ्खपद्मादिसंसेव्य
    निरालम्ब निरीश्वर ॥ ॥ निष्कलङ्क निराधार पाहि मां नित्यमव्यय । अनाद्य जगतामाद्य पितामहसुपूजित ॥ ॥ धूमकेतो
    गणाध्यक्ष महामूषकवाहन । अनन्तपरमानन्द जय विघ्नेश्वरेश्वर ॥ ॥ रत्नसिंहासनासीन किरीटेन सुशोभित । परात्पर
    परेशान परपूरुष पाहि माम् ॥ ॥ निर्द्वन्द्व निर्गुणाभास जपापुष्पसमप्रभ । सर्वप्रमथसंस्तुत्य त्राहि मां
    विघ्ननायक ॥ ॥ कुमारस्य गुरो देव सर्वैश्वर्यप्रदायक । सर्वाभीष्टप्रद स्वामिन् सर्वप्रत्यूहनाशक ॥ ॥
    शरण्य सर्वलोकानां शरणागतवत्सल । महागणपते नित्यं मां पालय कृपानिधे ॥ ॥ एवं श्रीगणनाथस्य स्तवराजमनुत्तमम्
    । यः पठेच्छृणुयान्नित्यं प्रत्यूहैः स विमुच्यते ॥ ॥ अश्वमेधसमं पुण्यफलं प्राप्नोत्यनुत्तमम् । वशीकरोति
    त्रैलोक्यं प्राप्य सौभाग्यमुत्तमम् ॥ ॥ सर्वाभीष्टमवाप्नोति शीघ्रमेव सुदुर्लभम् । महागणेशसान्निध्यं
    प्राप्नोत्येव न संशयः ॥ ॥ इति श्रीरुद्रयामले श्रीविनायकस्तवराजः सम्पूर्णम् ।
