id: rishibhihkritamnarmadastotram
category: stotram
name:
  english: rishibhihkritamnarmadastotram
  devanagari: ऋषिभिःकृतंनर्मदास्तोत्रम्
content:
  english: rishibhih kritam narmadastotram shrimarkandeya uvaca | etacchrutva vaco rajansamhrishta rishayo'bhavan
    | narmadam stotumarabdhah kritanjaliputa dvijah || 1|| namo'stu te punyajale namo makaragamini | namaste
    papamocinyai namo devi varanane || 2|| namo'stu te punyajalashraye shubhe vishuddhasattvam surasiddhasevite
    | namo'stu te tirthaganairnishevite namo'stu rudrangasamudbhave vare || 3|| namo'stu te devi samudragamini
    namo'stu te devi varaprade shive | namo'stu lokadvayasaukhyadayini hyanekabhutaughasamashrite'naghe
    || 4|| saridvare papahare vicitrite gandharvayakshoragasevitange | sanatani pranigananukampini mokshaprade
    devi vidhehi sham nah || 5|| mahagajaughairmahishairvarahaih samsevite devi mahormimale | natah sma
    sarve varade sukhaprade vimocayasmanpashupashabandhat || 6|| papairanekairashubhairvibaddha bhramanti
    tavannarakeshu martyah | mahanilodbhutatarangabhutam yavattavambho hi na samsprishanti || 7|| anekaduhkhaughabhayarditanam
    papairanekairabhiveshtitanam | gatistvamambhojasamanavakre dvandvairanekairapi samvritanam || 8||
    nadyashca puta vimala bhavanti tvam devi samprapya na samshayo'tra | duhkhaturanamabhayam dadasi shishtairanekairabhipujitasi
    || 9|| sprishtam karaishcandramaso raveshca tadaiva dadyatparamam padam tu | yatropalah punyajalaplutaste
    shivatvamayanti kimatra citram || 10|| bhramanti tavannarakeshu martya duhkhaturah papaparitadehah
    | mahanilodbhutatarangabhangam yavattavambho na hi samshrayanti || 11|| mlecchah pulindastvatha yatudhanah
    pibanti ye'mbhastava devi punyam | mukta bhavantiha bhayattu ghorannihsamshayam te'pi kimatra citram
    || 12|| saramsi nadyah kshayamabhyupeta ghore yuge'smin hi kalau pradushite | tvam bhrajase devi jalaughapurna
    diviva nakshatrapathe ca ganga || 13|| tava prasadadvarade varishthe kalam yathemam paripalayitva
    | yamo'tha rudram tava suprasadadvayam tatha tvam kuru vai prasadam || 14|| gatistvamambeva piteva
    putramstvam pahi no yavadimam yugantam | kalam tvanavrishtihatam sughoram yavattaramastava suprasadat
    || 15|| pathanti ye stotramidam dvijendrah sha
  devanagari: ऋषिभिः कृतं नर्मदास्तोत्रम् श्रीमार्कण्डेय उवाच । एतच्छ्रुत्वा वचो राजन्संहृष्टा ऋषयोऽभवन्
    । नर्मदां स्तोतुमारब्धाः कृताञ्जलिपुटा द्विजाः ॥ १॥ नमोऽस्तु ते पुण्यजले नमो मकरगामिनि । नमस्ते पापमोचिन्यै
    नमो देवि वरानने ॥ २॥ नमोऽस्तु ते पुण्यजलाश्रये शुभे विशुद्धसत्त्वं सुरसिद्धसेविते । नमोऽस्तु ते तीर्थगणैर्निषेविते
    नमोऽस्तु रुद्राङ्गसमुद्भवे वरे ॥ ३॥ नमोऽस्तु ते देवि समुद्रगामिनि नमोऽस्तु ते देवि वरप्रदे शिवे ।
    नमोऽस्तु लोकद्वयसौख्यदायिनि ह्यनेकभूतौघसमाश्रितेऽनघे ॥ ४॥ सरिद्वरे पापहरे विचित्रिते गन्धर्वयक्षोरगसेविताङ्गे
    । सनातनि प्राणिगणानुकम्पिनि मोक्षप्रदे देवि विधेहि शं नः ॥ ५॥ महागजौघैर्महिषैर्वराहैः संसेविते देवि
    महोर्मिमाले । नताः स्म सर्वे वरदे सुखप्रदे विमोचयास्मान्पशुपाशबन्धात् ॥ ६॥ पापैरनेकैरशुभैर्विबद्धा
    भ्रमन्ति तावन्नरकेषु मर्त्याः । महानिलोद्भूततरङ्गभूतं यावत्तवाम्भो हि न संस्पृशन्ति ॥ ७॥ अनेकदुःखौघभयार्दितानां
    पापैरनेकैरभिवेष्टितानाम् । गतिस्त्वमम्भोजसमानवक्रे द्वन्द्वैरनेकैरपि संवृतानाम् ॥ ८॥ नद्यश्च पूता
    विमला भवन्ति त्वां देवि सम्प्राप्य न संशयोऽत्र । दुःखातुराणामभयं ददासि शिष्टैरनेकैरभिपूजितासि ॥ ९॥
    स्पृष्टं करैश्चन्द्रमसो रवेश्च तदैव दद्यात्परमं पदं तु । यत्रोपलाः पुण्यजलाप्लुतास्ते शिवत्वमायान्ति
    किमत्र चित्रम् ॥ १०॥ भ्रमन्ति तावन्नरकेषु मर्त्या दुःखातुराः पापपरीतदेहाः । महानिलोद्भूततरङ्गभङ्गं
    यावत्तवाम्भो न हि संश्रयन्ति ॥ ११॥ म्लेच्छाः पुलिन्दास्त्वथ यातुधानाः पिबन्ति येऽम्भस्तव देवि पुण्यम्
    । मुक्ता भवन्तीह भयात्तु घोरान्निःसंशयं तेऽपि किमत्र चित्रम् ॥ १२॥ सरांसि नद्यः क्षयमभ्युपेता घोरे
    युगेऽस्मिन् हि कलौ प्रदूषिते । त्वं भ्राजसे देवि जलौघपूर्णा दिवीव नक्षत्रपथे च गङ्गा ॥ १३॥ तव प्रसादाद्वरदे
    वरिष्ठे कालं यथेमं परिपालयित्वा । यामोऽथ रुद्रं तव सुप्रसादाद्वयं तथा त्वं कुरु वै प्रसादम् ॥ १४॥
    गतिस्त्वमम्बेव पितेव पुत्रांस्त्वं पाहि नो यावदिमं युगान्तम् । कालं त्वनावृष्टिहतं सुघोरं यावत्तरामस्तव
    सुप्रसादात् ॥ १५॥ पठन्ति ये स्तोत्रमिदं द्विजेन्द्राः श
