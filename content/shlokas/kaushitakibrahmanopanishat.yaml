id: kaushitakibrahmanopanishat
category: upanishad
name:
  english: kaushitakibrahmanopanishat
  devanagari: कौषीतकिब्राह्मणोपनिषत्
content:
  english: ayuh pranah prano va ayuh prana evacamritam | yavaddhyasmincharire prano vasati tavadayuh |
    pranena hyevamushmimlloke'mritatvamapnoti | prajnaya satyasankalpam sa yo mamayuramritamityupaste
    sarvamayurasmimlloka eti | apnotyamritatvamakshitim svarge loke | taddhaika ahurekabhuyam vai prana
    gacchantiti | na hi kashcana shaknuyatsakridvaca nama prajnapayitum cakshusha rupam shrotrena shabdam
    manasa dhyanamityekabhuyam vai pranah | ekaikametani sarvanyeva prajnapayanti | vacam vadanti sarve
    prana anuvadanti | cakshuh pashyatsarve prana anupashyanti shrotram shrinvatsarve prana anushrinvanti
    mano dhyayatsarve prana anudhyayanti pranam pranantam sarve prana anupranantiti | evamuhaivaitaditi
    hendra uvaca | astityeva prananam nihshreyasadanamiti || 2 || jivati vagapeto mukanhi pashyamo jivati
    cakshurapeto'ndhanhi pashyamo jivati shrotrapeto badhiranhi pashyamo jivati manopeto balanhi pashyamo
    jivati bahucchinno jivatyurucchinna iti | evam hi pashyama iti | atha khalu prana eva prajnatmedam
    shariram parigrihyotathapayati | tasmadetadevo'thamupasita | yo vai pranah sa prajna ya va prajna
    sa pranah | saha hyetavasmincharire vasatah sahotkramatastasyaishaiva drishtih | etadvijnanam | yatraitatpurushah
    suptah svapnam na kancana pashyatyathasminprana evaikadha bhavati | tadainam vaksarvairnamabhih sahapyeti
    cakshuh sarvai rupaih sahapyeti shrotram sarvaih shabdaih sahapyeti manah sarvairdhyataih sahapyeti
    | sa yada pratibudhyate yathagnerjvalato sarva dishò visphulinga vipratishtherannevamevaitasmadatmanah
    prana yathayatanam vipratishthante pranebhyo deva devebhyo lokah | tasyaishaiva siddhiretadvijnanam
    | yatraitatpurusha arto marishyannabalyam nyetya moham naiti tadahuh | udakramiccittam | na shrinoti
    na pashyati vaca vadati na dhyayatyathasminprana evaikadha bhavati tadainam vaksarvairnamabhih sahapyeti
    cakshuh sarvai rupaih sahapyeti shrotram sarvaih shabdaih sahapyeti manah sarvairdhyataih sahapyeti
    sa yada pratibudhyate yathagnerjvalato visphulinga vipratishtherannevamevaitasmadatmanah prana yathayatanam
    vipratishthante pranebhyo deva devebhyo lokah || 3 || sa yadasmacchariradutkramati sahaivaitaih sarvairutkramati
    vagasmatsarvani namanyabhivisrijate srijate | vaca sarvani namanyapnoti prano'smatsarvangandhanabhivisrijate
    pranena sarvangandhanapnoti cakshurasmatsarvani rupanyabhivisrijate cakshusha sarvani rupanyapnoti
    shrotramasmatsarvancchabdanabhivisrijate shrotrena sarvancchabdanapnoti mano'smatsarvani dhyatanyabhivisrijate
    manasa sarvani dhyatanyapnoti saisha prane sarvaptih | yo vai pranah sa prajna ya va prajna sa pranah
    sa ha hyetavasminccharire vasatah sahotkramatah | atha khalu yatha'syai prajnayai sarvani bhutanyekam
    bhavanti tadvyakhyasyamah || 4 || vagevasya ekamangamududham tasyai nama parastatprativihita bhutamatra
    | ghranamevasya ekamangamududham tasya gandhah parastatprativihita bhutamatra cakshurevasya ekamangamududham
    tasya rupam parastatprativihita bhutamatra shrotramevasya ekamangamududham tasya shabdah parastatprativihita
    bhutamatra jihvaivasya ekamangamududham tasyannarasah parastatprativihita bhutamatra hastavevasya
    ekamangamududham tayoh karma parastatprativihita bhutamatra shariramevasya ekamangamududham tasya
    sukhaduhkhe parastatprativihita bhutamatra upastha evasya ekamangamududham tasyanando ratih prajatih
    parastatprativihita bhutamatra padavevasya ekamangamududham tayoritya parastatprativihita bhutamatra
    prajnaivasya ekamangamududham tasyai dhiyo vijnatavyam kamah parastatprativihita bhutamatra || 5 ||
    prajnaya vacam samaruhya vaca sarvani samanyapnoti | prajnaya pranam samaruhya pranena sarvangandhanapnoti
    prajnaya cakshuh samaruhya cakshusha sarvani rupanyapnoti prajnaya shrotram samaruhya shrotrena sarvancchabdanapnoti
    prajnaya jihvam samaruhya jihvaya sarvanannarasanapnoti prajnaya hastau samaruhya hastabhyam sarvani
    karmanyapnoti prajnaya shariram samaruhya sharirena sukhaduhkhe apnoti prajnayopastham samaruhyopasthenanandam
    ratim prajnamapnoti prajnaya padau samaruhya padabhyam sarva itya apnoti prajnayaiva dhiyam samaruhya
    prajnayaiva dhiyo vijnatavyam kamanapnoti || 6 || na hi prajnapeta vannama kincana prajnapayedanyatra
    me mano'bhudityaha | nahametannama prajnasishamiti | na hi prajnapetah prano gandham kancana prajnapayedanyatra
    me mano'bhudityaha nahametam gandham prajnasishamiti | na hi prajnapetam cakshu rupam kincana prajnapayedanyatra
    me mano'bhudityaha | nahametadrupam prajnasishamiti na prajnapetam shrotram shabdam kancana prajnapayedanyatra
    me mano'bhudityaha | nahametam shabdam prajnasishamiti na hi prajnapeta jihvannarasam kancana prajnapayedanyatra
    me mano'bhudityaha | nahametamannarasam prajnasishamiti na prajnapetau hatau karma kincana prajnapayetamanyatra
    me mano'bhudityaha nahametatkarma prajnasishamiti na hi prajnapetam shariram sukhaduhkham kincana
    prajnapayedanyatra me mano'bhudityaha nahametatsukhaduhkham prajnasishamiti na hi prajnapeta upastha
    anandam ratim prajatim kancana prajnapayedanyatra me mano'bhudityaha | nahametamanandam na ratim prajatim
    prajnasishamiti na hi prajnapetau padavityam kancana prajnapayetamanyatra me mano'bhudityaha | nahametamityam
    prajnasishamiti na hi prajnapeta dhih kacana siddhyenna prajnatavyam prajnayet || 7 || na vacam vijijnasita
    vaktaram vidyanna gandham vijijnasita ghrataram vidyanna rupam vijijnasita rupavidyam vidyanna shabdam
    vijijnasita shrotaram vidyannannarasam vijijnasitannarasavijnataram vidyanna karma vijijnasita kartaram
    vidyanna sukhaduhkhe vijijnasita sukhaduhkhayorvijnataram vidyannanandam na ratim na prajatim vijijnasitanandasya
    rateh prajatervijnataram vidyannetyam vijijnasitaitaram vidyat | na mano vijijnasita mantaram vidyat
    | ta va eta dashaiva bhutamatra adhiprajnam dasha prajnamatra adhibhutam yaddhi bhutamatra na syurna
    prajnamatrah syuryadva prajnamatra na syurna bhutamatrah syuh || 8 || na hyanyatarato rupam kincana
    siddhyenno etannana tadyatha rathasyareshu nemirarpita nabhavara arpita evamevaita bhutamatrah prajnamatrasvarpitah
    prajnamatrah prane'rpitah sa esha prana eva prajnatmanando'jaro'mritah | na sadhuna karmana bhuyanno
    evasadhuna kaniyan | esha hyevainam sadhukarma karayati tam yamebhyo lokebhyo unninishata esha u evainamasadhu
    karma karayati tam yamadho ninishate | esha lokapala esha lokadhipatiresha sarveshvarah sa ma atmeti
    vidyatsa ma atmeti vidyat || 9 || || caturtho'dhyayah || atha gargyo ha vai balakiranucanah samsprishta
    asa so'yamushinareshu samvasanmatsyeshu kurupancaleshu kashivideheshviti sahajatashatrum kashyametyovaca
    | brahma te bravaniti tam hovaca ajatashatruh | sahasram dadmasta ityetasyam vaci janako janaka iti
    va u jana dhavantiti || 1 || sa hovaca balakirya evaisha aditye purushastamevahamupasa iti tam hovacajatashatrurma
    maitasminsamavadayishthah | brihatpandaravasa atishthah sarvesham bhutanam murdheti va ahametamupasa
    iti sa yo haitamevamupaste'tishthah sarvesham bhutanam murdha bhavati || 2 || sa hovaca balakirya
    evaisha candramasi purushastamevahamupasa iti tam hovacajatashatrurma maitasminsamavadayishthah somo
    rajannasyatmeti va ahametamupasa iti sa yo mevamupaste'nnasyatma bhavati || 3 || sa hovaca balakirya
    evaisha vidyuti purushastamevahamupasa iti tam hovacajatashatrurma maitasminsamavadayishthastejasa
    atmeti va ahametamupasa iti sa yo haitamevamupaste tejasa atma bhavati || 4 || sa hovaca balakirya
    evaisha stanayitnau purushastamevahamupasa iti tam hovacajatashatrurma maitasminsamavadayishthah shabdasyatmeti
    va ahametamupasa iti sa yo haitamevamupaste shabdasyatma bhavati || 5 || sa hovaca balakirya evaisha
    akashe purushastamevahamupasa iti tam hovacajatashatrurma maitasminsamavadayishthah purnamapravarti
    brahmeti va ahametamupasa iti sa yo haitamevamupaste puryate prajaya pashubhirno eva svayam nasya
    praja pura kalatpravartate || 6 || sa hovaca balakirya evaisha vayau purushastamevahamupasa iti tam
    hovacajatashatrurma maitasminsamavadayishtha indro vaikuntho'parajita seneti va ahametamupasa iti
    sa yo haitamevamupaste | jishnurha vaparajishnuranyatasyajayi bhavati || 7 || sa hovaca balakirya
    evaisho'gnau purushastamevahamupasa iti tam hovacajatashatrurma maitasminsamavadayishtha vishasahiriti
    va ahametamupasa iti sa yo haitamevamupaste vishasahirvanvesha bhavati || 8 || sa hovaca balakirya
    evaisho'psu purushastamevahamupasa iti tam hovacajatashatrurma maitasminsamavadayishtha namnyasyatmeti
    va ahametamupasa iti sa yo haitamevamupaste namnyasyatma bhavatityadhidaivatamathadhyatmam || 9 ||
    sa hovaca balakirya evaisha adarshe purushastamevahamupasa iti tam hovacajatashatrurma maitasminsamavadayishthah
    pratirupa iti va ahametamupasa iti sa yo haitamevamupaste pratirupo haivasya prajayamajayate napratirupah
    || 10 || sa hovaca balakirya evaisha pratishrutkayam purushastamevahamupasa iti tam hovacajatashatrurma
    maitasminsamavadayishtha dvitiyo'napaga iti va ahametamupasa iti sa yo haitamevamupaste vindate dvitiyaddvitiyavanbhavati
    || 11 || sa hovaca balakirya evaisha shabdah purushamanveti tamevahamupasa iti tam hovacajatashatrurma
    maitasminsamavadayishtha asuriti va ahametamupasa iti sa yo haitamevamupaste no eva svayam nasya praja
    pura kalatsammohameti || 12 || sa hovaca balakirya evaisha cchayapurushastamevahamupasa iti tam hovacajatashatrurma
    maitasminsamavadayishtha mrityuriti va ahametamupasa iti sa yo haitamevamupaste no eva svayam nasya
    praja pura kalatpramiyate || 13 || sa hovaca balakirya evaisha sharirah purushastamevahamupasa iti
    tam hovacajatashatrurma maitasminsamavadayishthah prajapatiriti va ahametamupasa iti sa yo haitamevamupaste
    prajayate prajaya pashubhih || 14 || sa hovaca balakirya evaisha prajna atma yenaitatpurushah suptah
    svapnamacarati tamevahamupasa iti tam hovacajatashatrurma maitasminsamavadayishtha yamo rajeti va
    ahametamupasa iti sa yo haitamevamupaste sarvam hasma idam shraishthyaya gamyate || 15 || sa hovaca
    balakirya evaisha dakshine'kshanpurushastamevahamupasa iti tam hovacajatashatrurma maitasminsamavadayishtha
    namna atma'gneratma jyotisha atmeti va ahametamupasa iti sa yo haitamevamupasta etesham sarveshamatma
    bhavati || 16 || sa hovaca balakirya evaisha savye'kshanpurushastamevahamupasa iti tam hovacajatashatrurma
    maitasminsamavadayishthah satyasyatma vidyuta atma tejasa atmeti va ahametamupasa iti sa yo haitamevamupasta
    etesham sarveshamatma bhavatiti || 17 || tata u ha balakistushnimasa tam hovacajatashatruretavannu
    balaka3i ityetavaddhiti hovaca balakistam hovacajatashatrurmrisha vai kila ma samavadayishtha brahma
    te bravaniti | sa hovaca yo vai balaka etesham purushanam karta yasya vaitatkarma sa vai veditavya
    iti tata u ha balakih samitpanih praticakramopayaniti tam hovacajatashatruh pratilomarupameva syadyatkshatriyo
    brahmanamupanayet | ehi vyeva tva jnapayishyamiti tam ha panavabhipadya pravavraja tau ha suptam purushamiyatustam
    hajatashatruramantrayamcakre | brihatpandaravasah somarajanniti | sa u ha tushnimeva shishye | tata
    u hainam yashtyavicikshepa sa tata eva samuttasthau tam hovacajatashatruh | kvaisha etadvaloke purusho'shayishta
    kvaitadabhutkuta etadaga3diti | tata u ha balakirna vijajnau || 18 || tam hovacajatashatruryatraisha
    etadbalake purusho'shayishta yatraitadabhudyata etadagaddhita nama hridayasya nadyo hridayatpuritatamabhipratanvanti
    tadyatha sahasradha kesho vipatitastavadanvyah pingalasyanimna tishthanti | shuklasya krishnasya pitasya
    lohitasyeti tasu tada bhavati | yada suptah svapnam na kancana pashyatyasminprana evaikadha bhavati
    tathainam vaksarvairnamabhih sahapyeti cakshuh sarvai rupaih sahapyeti shrotram sarvaih shabdaih sahapyeti
    manah sarvairdhyataih sahapyeti sa yada pratibudhyate yathagnerjvalato sarva disho visphulinga vipratishtherannevamevaitasmadatmanah
    prana yathayatanam vipratishthante pranebhyo deva devebhyo lokastadyatha kshurah kshuradhyane'vahitah
    syadvishvambharo va vishvambharakulaya evamevaisha prajna atmedam shariramatmanamanupravishta a lomabhya
    a nakhebhyah || 19 || tametamatmanametamatmano'nvavasyati yatha shreshthinam svastadyatha shreshthaih
    svairbhunkte yatha va shreshthinam sva bhunjantyevamevaisha prajnatmaitairatmabhirbhunkte | evam vai
    tamatmanameta atmano bhunjanti | sa yavaddha va indra etamatmanam na vijajne tavadenamasura abhibabhuvuh
    | sa yada vijajne'tha hatvasuranvijitya sarvesham devanam shraishthyam svarajyamadhipatyam pariyaya
    evaivam vidvansarvanpapmano'pahatya sarvesham bhutanam shraishthyam svarajyamadhipatyam paryeti ya
    evam veda ya evam veda || 20 || om vanme manasi pratishthita | mano me vaci pratishthitam | aviravirma
    edhi | vedasya ma anisthah | shrutam me maprahasih | anenadhitenahoratransandadhami | ritam vadishyami|
    satyam vadishyami | tanmamavatu | tadvaktaramavatu | avatu mamavatuvaktaram || om shantih shantih
    shantih || || iti kaushitakibrahmanopanishatsamapta || adhikadhyayanaya
  devanagari: आयुः प्राणः प्राणो वा आयुः प्राण एवाचामृतम् । यावद्ध्यस्मिञ्छरीरे प्राणो वसति तावदायुः ।
    प्राणेन ह्येवामुष्मिंल्लोकेऽमृतत्वमाप्नोति । प्रज्ञया सत्यसङ्कल्पं स यो ममायुरमृतमित्युपास्ते सर्वमायुरस्मिंल्लोक
    एति । आप्नोत्यमृतत्वमक्षितिं स्वर्गे लोके । तद्धैक आहुरेकभूयं वै प्राणा गच्छन्तीति । न हि कश्चन शक्नुयात्सकृद्वाचा
    नाम प्रज्ञापयितुं चक्षुषा रूपं श्रोत्रेण शब्दं मनसा ध्यानमित्येकभूयं वै प्राणाः । एकैकमेतानि सर्वाण्येव
    प्रज्ञापयन्ति । वाचं वदन्ती सर्वे प्राणा अनुवदन्ति । चक्षुः पश्यत्सर्वे प्राणा अनुपश्यन्ति श्रोत्रं
    शृण्वत्सर्वे प्राणा अनुशृण्वन्ति मनो ध्यायत्सर्वे प्राणा अनुध्यायन्ति प्राणं प्राणन्तं सर्वे प्राणा
    अनुप्राणन्तीति । एवमुहैवैतदिति हेन्द्र उवाच । अस्तीत्येव प्राणानां निःश्रेयसादानमिति ॥ २ ॥ जीवति वागपेतो
    मूकान्हि पश्यामो जीवति चक्षुरपेतोऽन्धान्हि पश्यामो जीवति श्रोत्रापेतो बधिरान्हि पश्यामो जीवति मनोपेतो
    बालान्हि पश्यामो जीवति बाहुच्छिन्नो जीवत्यूरुच्छिन्न इति । एवं हि पश्याम इति । अथ खलु प्राण एव प्रज्ञात्मेदं
    शरीरं परिगृह्योतथापयति । तस्मादेतदेवोऽथमुपासीत । यो वै प्राणः सा प्रज्ञा या वा प्रज्ञा स प्राणः ।
    सह ह्येतावस्मिञ्छरीरे वसतः सहोत्क्रामतस्तस्यैषैव दृष्टिः । एतद्विज्ञानम् । यत्रैतत्पुरुषः सुप्तः स्वप्नं
    न कञ्चन पश्यत्यथास्मिन्प्राण एवैकधा भवति । तदैनं वाक्सर्वैर्नामभिः सहाप्येति चक्षुः सर्वै रूपैः सहाप्येति
    श्रोत्रं सर्वैः शब्दैः सहाप्येति मनः सर्वैर्ध्यातैः सहाप्येति । स यदा प्रतिबुध्यते यथाग्नेर्ज्वलतो
    सर्वा दिशॊ विस्फुलिङ्गा विप्रतिष्ठेरन्नेवमेवैतस्मादात्मनः प्राणा यथायतनं विप्रतिष्ठन्ते प्राणेभ्यो
    देवा देवेभ्यो लोकाः । तस्यैषैव सिद्धिरेतद्विज्ञानम् । यत्रैतत्पुरुष आर्तो मरिष्यन्नाबल्यं न्येत्य
    मोहं नैति तदाहुः । उदक्रमीच्चित्तम् । न शृणोति न पश्यति वाचा वदति न ध्यायत्यथास्मिन्प्राण एवैकधा भवति
    तदैनं वाक्सर्वैर्नामभिः सहाप्येति चक्षुः सर्वै रूपैः सहाप्येति श्रोत्रं सर्वैः शब्दैः सहाप्येति मनः
    सर्वैर्ध्यातैः सहाप्येति स यदा प्रतिबुध्यते यथाग्नेर्ज्वलतो विस्फुलिङ्गा विप्रतिष्ठेरन्नेवमेवैतस्मादात्मनः
    प्राणा यथायतनं विप्रतिष्ठन्ते प्राणेभ्यो देवा देवेभ्यो लोकाः ॥ ३ ॥ स यदास्माच्छरीरादुत्क्रामति सहैवैतैः
    सर्वैरुत्क्रामति वागस्मात्सर्वाणि नामान्यभिविसृजते सृजते । वाचा सर्वाणि नामान्याप्नोति प्राणोऽस्मात्सर्वान्गन्धानभिविसृजते
    प्राणेन सर्वान्गन्धानाप्नोति चक्षुरस्मात्सर्वाणि रूपाण्यभिविसृजते चक्षुषा सर्वाणि रूपाण्याप्नोति श्रोत्रमस्मात्सर्वाञ्च्छब्दानभिविसृजते
    श्रोत्रेण सर्वाञ्च्छब्दानाप्नोति मनोऽस्मात्सर्वाणि ध्यातान्यभिविसृजते मनसा सर्वाणि ध्यातान्याप्नोति
    सैषा प्राणे सर्वाप्तिः । यो वै प्राणः सा प्रज्ञा या वा प्रज्ञा स प्राणः स ह ह्येतावस्मिञ्च्छरीरे वसतः
    सहोत्क्रामतः । अथ खलु यथाऽस्यै प्रज्ञायै सर्वाणि भूतान्येकं भवन्ति तद्व्याख्यास्यामः ॥ ४ ॥ वागेवास्या
    एकमङ्गमुदूढं तस्यै नाम परस्तात्प्रतिविहिता भूतमात्रा । घ्राणमेवास्या एकमङ्गमुदूढं तस्य गन्धः परस्तात्प्रतिविहिता
    भूतमात्रा चक्षुरेवास्या एकमङ्गमुदूढं तस्य रूपं परस्तात्प्रतिविहिता भूतमात्रा श्रोत्रमेवास्या एकमङ्गमुदूढं
    तस्य शब्दः परस्तात्प्रतिविहिता भूतमात्रा जिह्वैवास्या एकमङ्गमुदूढं तस्यान्नरसः परस्तात्प्रतिविहिता
    भूतमात्रा हस्तावेवास्या एकमङ्गमुदूढं तयोः कर्म परस्तात्प्रतिविहिता भूतमात्रा शरीरमेवास्या एकमङ्गमुदूढं
    तस्य सुखदुःखे परस्तात्प्रतिविहिता भूतमात्रा उपस्थ एवास्या एकमङ्गमुदूढं तस्यानन्दो रतिः प्रजातिः परस्तात्प्रतिविहिता
    भूतमात्रा पादावेवास्या एकमङ्गमुदूढं तयोरित्या परस्तात्प्रतिविहिता भूतमात्रा प्रज्ञैवास्या एकमङ्गमुदूढं
    तस्यै धियो विज्ञातव्यं कामाः परस्तात्प्रतिविहिता भूतमात्रा ॥ ५ ॥ प्रज्ञया वाचं समारुह्य वाचा सर्वाणि
    सामान्याप्नोति । प्रज्ञया प्राणं समारुह्य प्राणेन सर्वान्गन्धानाप्नोति प्रज्ञया चक्षुः समारुह्य चक्षुषा
    सर्वाणि रूपाण्याप्नोति प्रज्ञया श्रोत्रं समारुह्य श्रोत्रेण सर्वाञ्च्छब्दानाप्नोति प्रज्ञया जिह्वां
    समारुह्य जिह्वया सर्वानन्नरसानाप्नोति प्रज्ञया हस्तौ समारुह्य हस्ताभ्यां सर्वाणि कर्माण्याप्नोति प्रज्ञया
    शरीरं समारुह्य शरीरेण सुखदुःखे आप्नोति प्रज्ञयोपस्थं समारुह्योपस्थेनानन्दं रतिं प्रज्ञामाप्नोति प्रज्ञया
    पादौ समारुह्य पादाभ्यां सर्वा इत्या आप्नोति प्रज्ञयैव धियं समारुह्य प्रज्ञयैव धियो विज्ञातव्यं कामानाप्नोति
    ॥ ६ ॥ न हि प्रज्ञापेता वाङ्नाम किञ्चन प्रज्ञपयेदन्यत्र मे मनोऽभूदित्याह । नाहमेतन्नाम प्राज्ञासिषमिति
    । न हि प्रज्ञापेतः प्राणो गन्धं कञ्चन प्रज्ञपयेदन्यत्र मे मनोऽभूदित्याह नाहमेतं गन्धं प्राज्ञासिषमिति
    । न हि प्रज्ञापेतं चक्षू रूपं किञ्चन प्रज्ञपयेदन्यत्र मे मनोऽभूदित्याह । नाहमेतद्रूपं प्राज्ञासिषमिति
    न प्रज्ञापेतं श्रोत्रं शब्दं कञ्चन प्रज्ञपयेदन्यत्र मे मनोऽभूदित्याह । नाहमेतं शब्दं प्राज्ञासिषमिति
    न हि प्रज्ञापेता जिह्वान्नरसं कञ्चन प्रज्ञपयेदन्यत्र मे मनोऽभूदित्याह । नाहमेतमन्नरसं प्राज्ञासिषमिति
    न प्रज्ञापेतौ हतौ कर्म किञ्चन प्रज्ञपयेतामन्यत्र मे मनोऽभूदित्याह नाहमेतत्कर्म प्राज्ञासिषमिति न हि
    प्रज्ञापेतं शरीरं सुखदुःखं किञ्चन प्रज्ञपयेदन्यत्र मे मनोऽभूदित्याह नाहमेतत्सुखदुःखं प्राज्ञासिषमिति
    न हि प्रज्ञापेत उपस्थ आनन्दं रतिं प्रजातिं काञ्चन प्रज्ञपयेदन्यत्र मे मनोऽभूदित्याह । नाहमेतमानन्दं
    न रतिं प्रजातिं प्राज्ञासिषमिति न हि प्रज्ञापेतौ पादावित्यां काञ्चन प्रज्ञापयेतामन्यत्र मे मनोऽभूदित्याह
    । नाहमेतामित्यां प्राज्ञसिषमिति न हि प्रज्ञापेता धीः काचन सिद्ध्येन्न प्रज्ञातव्यं प्रज्ञायेत् ॥ ७
    ॥ न वाचं विजिज्ञासीत वक्तारं विद्यान्न गन्धं विजिज्ञासीत घ्रातारं विद्यान्न रूपं विजिज्ञासीत रूपविद्यं
    विद्यान्न शब्दं विजिज्ञासीत श्रोतारं विद्यान्नान्नरसं विजिज्ञासीतान्नरसविज्ञातारं विद्यान्न कर्म विजिज्ञासीत
    कर्तारं विद्यान्न सुखदुःखे विजिज्ञासीत सुखदुःखयोर्विज्ञातारं विद्यान्नानन्दं न रतिं न प्रजातिं विजिज्ञासीतानन्दस्य
    रतेः प्रजातेर्विज्ञातारं विद्यान्नेत्यां विजिज्ञासीतैतारं विद्यात् । न मनो विजिज्ञासीत मन्तारं विद्यात्
    । ता वा एता दशैव भूतमात्रा अधिप्रज्ञं दश प्रज्ञामात्रा अधिभूतं यद्धि भूतमात्रा न स्युर्न प्रज्ञामात्राः
    स्युर्यद्वा प्रज्ञामात्रा न स्युर्न भूतमात्राः स्युः ॥ ८ ॥ न ह्यन्यतरतो रूपं किञ्चन सिद्ध्येन्नो एतन्नाना
    तद्यथा रथस्यारेषु नेमिरर्पिता नाभावरा अर्पिता एवमेवैता भूतमात्राः प्रज्ञामात्रास्वर्पिताः प्रज्ञामात्राः
    प्राणेऽर्पिताः स एष प्राण एव प्रज्ञात्मानन्दोऽजरोऽमृतः । न साधुना कर्मणा भूयान्नो एवासाधुना कनीयान्
    । एष ह्येवैनं साधुकर्म कारयति तं यमेभ्यो लोकेभ्यो उन्निनीषत एष उ एवैनमसाधु कर्म कारयति तं यमधो निनीषते
    । एष लोकपाल एष लोकाधिपतिरेष सर्वेश्वरः स म आत्मेति विद्यात्स म आत्मेति विद्यात् ॥ ९ ॥ ॥ चतुर्थोऽध्यायः
    ॥ अथ गार्ग्यो ह वै बालाकिरनूचानः संस्पृष्ट आस सोऽयमुशिनरेषु संवसन्मत्स्येषु कुरुपञ्चालेषु काशीविदेहेष्विति
    सहाजातशत्रुं काश्यमेत्योवाच । ब्रह्म ते ब्रवाणीति तं होवाच अजातशत्रुः । सहस्रं दद्मस्त इत्येतस्यां
    वाचि जनको जनक इति वा उ जना धावन्तीति ॥ १ ॥ स होवाच बालाकिर्य एवैष आदित्ये पुरुषस्तमेवाहमुपास इति तं
    होवाचाजातशत्रुर्मा मैतस्मिन्समवादयिष्ठाः । बृहत्पाण्डरवासा अतिष्ठाः सर्वेषां भूतानां मूर्धेति वा अहमेतमुपास
    इति स यो हैतमेवमुपास्तेऽतिष्ठाः सर्वेषां भूतानां मूर्धा भवति ॥ २ ॥ स होवाचा बालाकिर्य एवैष चन्द्रमसि
    पुरुषस्तमेवाहमुपास इति तं होवाचाजातशत्रुर्मा मैतस्मिन्समवादयिष्ठाः सोमो राजान्नस्यात्मेति वा अहमेतमुपास
    इति स यो मेवमुपास्तेऽन्नस्यात्मा भवति ॥ ३ ॥ स होवाच बालाकिर्य एवैष विद्युति पुरुषस्तमेवाहमुपास इति
    तं होवाचाजातशत्रुर्मा मैतस्मिन्समवादयिष्ठास्तेजस आत्मेति वा अहमेतमुपास इति स यो हैतमेवमुपास्ते तेजस
    आत्मा भवति ॥ ४ ॥ स होवाच बालाकिर्य एवैष स्तनयित्नौ पुरुषस्तमेवाहमुपास इति तं होवाचाजातशत्रुर्मा मैतस्मिन्समवादयिष्ठाः
    शब्दस्यात्मेति वा अहमेतमुपास इति स यो हैतमेवमुपास्ते शब्दस्यात्मा भवति ॥ ५ ॥ स होवाच बालाकिर्य एवैष
    आकाशे पुरुषस्तमेवाहमुपास इति तं होवाचाजातशत्रुर्मा मैतस्मिन्समवादयिष्ठाः पूर्णमप्रवर्ति ब्रह्मेति
    वा अहमेतमुपास इति स यो हैतमेवमुपास्ते पूर्यते प्रजया पशुभिर्नो एव स्वयं नास्य प्रजा पुरा कालात्प्रवर्तते
    ॥ ६ ॥ स होवाच बालाकिर्य एवैष वायौ पुरुषस्तमेवाहमुपास इति तं होवाचाजातशत्रुर्मा मैतस्मिन्समवादयिष्ठा
    इन्द्रो वैकुण्ठोऽपराजिता सेनेति वा अहमेतमुपास इति स यो हैतमेवमुपास्ते । जिष्णुर्ह वापराजिष्णुरन्यतस्यजायी
    भवति ॥ ७ ॥ स होवाच बालाकिर्य एवैषोऽग्नौ पुरुषस्तमेवाहमुपास इति तं होवाचाजातशत्रुर्मा मैतस्मिन्समवादयिष्ठा
    विषासहिरिति वा अहमेतमुपास इति स यो हैतमेवमुपास्ते विषासहिर्वान्वेष भवति ॥ ८ ॥ स होवाच बालाकिर्य एवैषोऽप्सु
    पुरुषस्तमेवाहमुपास इति तं होवाचाजातशत्रुर्मा मैतस्मिन्समवादयिष्ठा नाम्न्यस्यात्मेति वा अहमेतमुपास
    इति स यो हैतमेवमुपास्ते नाम्न्यस्यात्मा भवतीत्यधिदैवतमथाध्यात्मम् ॥ ९ ॥ स होवाच बालाकिर्य एवैष आदर्शे
    पुरुषस्तमेवाहमुपास इति तं होवाचाजातशत्रुर्मा मैतस्मिन्समवादयिष्ठाः प्रतिरूप इति वा अहमेतमुपास इति
    स यो हैतमेवमुपास्ते प्रतिरूपो हैवास्य प्रजायामाजायते नाप्रतिरूपः ॥ १० ॥ स होवाच बालाकिर्य एवैष प्रतिश्रुत्कायां
    पुरुषस्तमेवाहमुपास इति तं होवाचाजातशत्रुर्मा मैतस्मिन्समवादयिष्ठा द्वितीयोऽनपग इति वा अहमेतमुपास इति
    स यो हैतमेवमुपास्ते विन्दते द्वितीयाद्द्वितीयवान्भवति ॥ ११ ॥ स होवाच बालाकिर्य एवैष शब्दः पुरुषमन्वेति
    तमेवाहमुपास इति तं होवाचाजातशत्रुर्मा मैतस्मिन्समवादयिष्ठा असुरिति वा अहमेतमुपास इति स यो हैतमेवमुपास्ते
    नो एव स्वयं नास्य प्रजा पुरा कालात्संमोहमेति ॥ १२ ॥ स होवाच बालाकिर्य एवैष च्छायापुरुषस्तमेवाहमुपास
    इति तं होवाचाजातशत्रुर्मा मैतस्मिन्समवादयिष्ठा मृत्युरिति वा अहमेतमुपास इति स यो हैतमेवमुपास्ते नो
    एव स्वयं नास्य प्रजा पुरा कालात्प्रमीयते ॥ १३ ॥ स होवाच बालाकिर्य एवैष शारीरः पुरुषस्तमेवाहमुपास इति
    तं होवाचाजातशत्रुर्मा मैतस्मिन्समवादयिष्ठाः प्रजापतिरिति वा अहमेतमुपास इति स यो हैतमेवमुपास्ते प्रजायते
    प्रजया पशुभिः ॥ १४ ॥ स होवाच बालाकिर्य एवैष प्राज्ञ आत्मा येनैतत्पुरुषः सुप्तः स्वप्नमाचरति तमेवाहमुपास
    इति तं होवाचाजातशत्रुर्मा मैतस्मिन्समवादयिष्ठा यमो राजेति वा अहमेतमुपास इति स यो हैतमेवमुपास्ते सर्वं
    हास्मा इदं श्रैष्ठ्याय गम्यते ॥ १५ ॥ स होवाच बालाकिर्य एवैष दक्षिणेऽक्षन्पुरुषस्तमेवाहमुपास इति तं
    होवाचाजातशत्रुर्मा मैतस्मिन्समवादयिष्ठा नाम्न आत्माऽग्नेरात्मा ज्योतिष आत्मेति वा अहमेतमुपास इति स
    यो हैतमेवमुपास्त एतेषां सर्वेषामात्मा भवति ॥ १६ ॥ स होवाच बालाकिर्य एवैष सव्येऽक्षन्पुरुषस्तमेवाहमुपास
    इति तं होवाचाजातशत्रुर्मा मैतस्मिन्समवादयिष्ठाः सत्यस्यात्मा विद्युत आत्मा तेजस आत्मेति वा अहमेतमुपास
    इति स यो हैतमेवमुपास्त एतेषां सर्वेषामात्मा भवतीति ॥ १७ ॥ तत उ ह बालाकिस्तूष्णीमास तं होवाचाजातशत्रुरेतावन्नु
    बालाका३इ इत्येतावद्धीति होवाच बालाकिस्तं होवाचाजातशत्रुर्मृषा वै किल मा समवादयिष्ठा ब्रह्म ते ब्रवाणीति
    । स होवाच यो वै बालाक एतेषां पुरुषाणां कर्ता यस्य वैतत्कर्म स वै वेदितव्य इति तत उ ह बालाकिः समित्पाणिः
    प्रतिचक्रामोपायानीति तं होवाचजातशत्रुः प्रतिलोमरूपमेव स्याद्यत्क्षत्रियो ब्राह्मणमुपनयेत् । एहि व्येव
    त्वा ज्ञपयिष्यामीति तं ह पाणावभिपद्य प्रवव्राज तौ ह सुप्तं पुरुषमीयतुस्तं हाजातशत्रुरामन्त्रयांचक्रे
    । बृहत्पाण्डरवासः सोमराजन्निति । स उ ह तूष्णीमेव शिश्ये । तत उ हैनं यष्ट्याविचिक्षेप स तत एव समुत्तस्थौ
    तं होवाचाजातशत्रुः । क्वैष एतद्वालोके पुरुषोऽशयिष्ट क्वैतदभूत्कुत एतदागा३दिति । तत उ ह बालाकिर्न विजज्ञौ
    ॥ १८ ॥ तं होवाचाजातशत्रुर्यत्रैष एतद्बालाके पुरुषोऽशयिष्ट यत्रैतदभूद्यत एतदागाद्धिता नाम हृदयस्य नाड्यो
    हृदयात्पुरीततमभिप्रतन्वन्ति तद्यथा सहस्रधा केशो विपाटितस्तावदण्व्यः पिङ्गलस्याणिम्ना तिष्ठन्ति । शुक्लस्य
    कृष्णस्य पीतस्य लोहितस्येति तासु तदा भवति । यदा सुप्तः स्वप्नं न कञ्चन पश्यत्यस्मिन्प्राण एवैकधा भवति
    तथैनं वाक्सर्वैर्नामभिः सहाप्येति चक्षुः सर्वै रूपैः सहाप्येति श्रोत्रं सर्वैः शब्दैः सहाप्येति मनः
    सर्वैर्ध्यातैः सहाप्येति स यदा प्रतिबुध्यते यथाग्नेर्ज्वलतो सर्वा दिशो विस्फुलिङ्गा विप्रतिष्ठेरन्नेवमेवैतस्मादात्मनः
    प्राणा यथायतनं विप्रतिष्ठन्ते प्राणेभ्यो देवा देवेभ्यो लोकास्तद्यथा क्षुरः क्षुरध्यानेऽवहितः स्याद्विश्वंभरो
    वा विश्वंभरकुलाय एवमेवैष प्राज्ञ आत्मेदं शरीरमात्मानमनुप्रविष्ट आ लोमभ्य आ नखेभ्यः ॥ १९ ॥ तमेतमात्मानमेतमात्मनोऽन्ववस्यति
    यथा श्रेष्ठिनं स्वास्तद्यथा श्रेष्ठैः स्वैर्भुङ्क्ते यथा वा श्रेष्ठिनं स्वा भुञ्जन्त्येवमेवैष प्राज्ञात्मैतैरात्मभिर्भुङ्क्ते
    । एवं वै तमात्मानमेत आत्मानो भुञ्जन्ति । स यावद्ध वा इन्द्र एतमात्मानं न विजज्ञे तावदेनमसुरा अभिबभूवुः
    । स यदा विजज्ञेऽथ हत्वासुरान्विजित्य सर्वेषां देवानां श्रैष्ठ्यं स्वाराज्यमाधिपत्यं परीयाय एवैवं विद्वान्सर्वान्पाप्मनोऽपहत्य
    सर्वेषां भूतानां श्रैष्ठ्यं स्वाराज्यमाधिपत्यं पर्येति य एवं वेद य एवं वेद ॥ २० ॥ ॐ वाङ्मे मनसि प्रतिष्ठिता
    । मनो मे वाचि प्रतिष्ठितम् । आविरावीर्म एधि । वेदस्य मा आणीस्थः । श्रुतं मे माप्रहासीः । अनेनाधीतेनाहोरात्रान्सन्दधामि
    । ऋतं वदिष्यामि। सत्यं वदिष्यामि । तन्मामवतु । तद्वक्तारमवतु । अवतु मामवतुवक्तारम् ॥ ॐ शान्तिः शान्तिः
    शान्तिः ॥ ॥ इति कौषीतकिब्राह्मणोपनिषत्समाप्ता ॥ अधिकाध्ययनाय
