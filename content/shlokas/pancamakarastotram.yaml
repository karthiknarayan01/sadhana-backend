id: pancamakarastotram
category: stotram
name:
  english: pancamakarastotram
  devanagari: पन्चमकारस्तोत्रम्
content:
  english: kalah saptadasha prokta amritam sravyate shashi | prathama sa vijaniyaditare madyapayinah ||
    2|| karmakarmapashun hatva jnanakhadgena caiva hi | dvitiyam vindate yena itare mamsabhakshakah ||
    3|| manominam tritiyam ca hatva sankalpa
  devanagari: कलाः सप्तदश प्रोक्ता अमृतं स्राव्यते शशी । प्रथमा सा विजानीयादितरे मद्यपायिनः ॥ २॥ कर्माकर्मपशून्
    हत्वा ज्ञानखड्गेन चैव हि । द्वितीयं विन्दते येन इतरे मांसभक्षकाः ॥ ३॥ मनोमीनं तृतीयं च हत्वा सङ्कल्प
meaning: {}
