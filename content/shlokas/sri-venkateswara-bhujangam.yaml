id: sri-venkateswara-bhujangam
category: stotram
name:
  english: Sri Venkateswara Bhujangam
content:
  english: mukhe caruhasam kare shankhacakram gale ratnamalam svayam meghavarnam | tatha divyashastram
    priyam pitavastram dharantam murarim bhaje venkatesham || || sadabhitihastam mudajanupanim lasanmekhalam
    ratnashobhaprakasham | jagatpadapadmam mahatpadmanabham dharantam murarim bhaje venkatesham || ||
    aho nirmalam nityamakasharupam jagatkaranam sarvavedantavedyam | vibhum tapasam saccidanandarupam
    dharantam murarim bhaje venkatesham || || shriya vishtitam vamapakshaprakasham surairvanditam brahmarudrastutam
    tam | shivam shankaram svastinirvanarupam dharantam murarim bhaje venkatesham || || mahayogasaddhyam
    paribhrajamanam ciram vishvarupam suresham mahesham | aho shantarupam sadadhyanagamyam dharantam murarim
    bhaje venkatesham || || aho matsyarupam tatha kurmarupam mahakrodarupam tatha narasimham | bhaje kubjarupam
    vibhum jamadagnyam dharantam murarim bhaje venkatesham || || aho buddharupam tatha kalkirupam prabhum
    shashvatam lokarakshamahantam | prithakkalalabdhatmalilavataram dharantam murarim bhaje venkatesham
    || || iti shrivenkatesha bhujangam sampurnam |
  devanagari: मुखे चारुहासं करे शङ्खचक्रं गले रत्नमालां स्वयं मेघवर्णम् । तथा दिव्यशस्त्रं प्रियं पीतवस्त्रं
    धरन्तं मुरारिं भजे वेङ्कटेशम् ॥ ॥ सदाभीतिहस्तं मुदाजानुपाणिं लसन्मेखलं रत्नशोभाप्रकाशम् । जगत्पादपद्मं
    महत्पद्मनाभं धरन्तं मुरारिं भजे वेङ्कटेशम् ॥ ॥ अहो निर्मलं नित्यमाकाशरूपं जगत्कारणं सर्ववेदान्तवेद्यम्
    । विभुं तापसं सच्चिदानन्दरूपं धरन्तं मुरारिं भजे वेङ्कटेशम् ॥ ॥ श्रिया विष्टितं वामपक्षप्रकाशं सुरैर्वन्दितं
    ब्रह्मरुद्रस्तुतं तम् । शिवं शङ्करं स्वस्तिनिर्वाणरूपं धरन्तं मुरारिं भजे वेङ्कटेशम् ॥ ॥ महायोगसाद्ध्यं
    परिभ्राजमानं चिरं विश्वरूपं सुरेशं महेशम् । अहो शान्तरूपं सदाध्यानगम्यं धरन्तं मुरारिं भजे वेङ्कटेशम्
    ॥ ॥ अहो मत्स्यरूपं तथा कूर्मरूपं महाक्रोडरूपं तथा नारसिंहम् । भजे कुब्जरूपं विभुं जामदग्न्यं धरन्तं
    मुरारिं भजे वेङ्कटेशम् ॥ ॥ अहो बुद्धरूपं तथा कल्किरूपं प्रभुं शाश्वतं लोकरक्षामहन्तम् । पृथक्काललब्धात्मलीलावतारं
    धरन्तं मुरारिं भजे वेङ्कटेशम् ॥ ॥ इति श्रीवेङ्कटेश भुजङ्गं सम्पूर्णम् ।
