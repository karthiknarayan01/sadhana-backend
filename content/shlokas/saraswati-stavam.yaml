id: saraswati-stavam
category: stotram
name:
  english: Saraswati Stavam
content:
  english: yajnavalkyakrita sarasvati stavam yajnavalkya uvaca kripam kuru jaganmatar | gurushapat smritibhrashtam
    vidyahinam ca duhkhitam || jnanam dehi smritim vidyam shaktim shishya prabodhinim | granthakartritva
    shaktim ca sushishyam supratishthitam || pratibham satsabhayam ca vicarakshamatam shubham | luptam
    sarvam daiva yoga nnavibhutam punah kuru || || yathankuram bhasmani ca karoti devata punah | brahmasvarupa
    parama jyotirupa sanatani || || sarvavidyadhidevi ya tasyai vanyai namo namah | visarga bindumatrasu
    yadadhishthanamevaca || || tadadhishthatri ya devi tasyai vanyai namo namah | vyakhyasvarupa sa devi
    vyakhyadhishthatrirupini || || yaya vina prasankhyavan sankhyam kartum na shakyate | kalasankhya svarupa
    ya tasyai devyai namo namah || || bhrama siddhantarupa ya tasyai devyai namo namah | smritishakti
    jnanashakti buddhishakti svarupini || || pratibhakalpanashaktir ya ca tasyai namonamah | sanatkumaro
    brahmanam jnanam papraccha yatra vai || || babhuva mukavatsospi siddhantam kartu makshamah | tadashjagama
    bhagava natma shrikrishna ishvarah || || uvaca sa ca tam stauhi vani mishtam prajapate | sa ca tushtava
    tam brahma cajnaya paramatmanah || || cakara tatprasadena tada siddhanta muttamam | yadapyanantam
    papraccha jnanamekam vasundhara || || babhuva mukavatsospi siddhantam kartu makshamah | tada tam ca
    sa tushtava santrastah kashyapajnaya || || tata shcakara siddhantam nirmalam bhrama bhanjanam | vyasah
    puranasutram ca papraccha valmikim yada || || maunibhuta shca sasmara tameva jagadambikam | tada cakara
    siddhantam tadvarena munishvarah || || samprapya nirmalam jnanam bhramandhya dhvamsadipakam | puranasutram
    shrutva ca vyasah krishnakalodbhavah || || tam shivam veda dadhyau ca shatavarsham ca pushkare | tada
    tvatto varam prapya satkavindro babhuva ha || || tada vedavibhagam ca puranam ca cakara sah | yada
    mahendrah papraccha tattvajnanam sadashivam || kshanam tameva sancintya tasmai jnanam dadau vibhuh
    | papraccha shabdashastram ca mahendra shca brihaspatim || divya varsha sahasram ca sa tvam dadhyau
    ca pushkare | tada tvatto varam prapya divyavarshasahasrakam || uvaca shabda shastram ca tadartham
    ca sureshvaram | adhyapitashca ye shishya yairadhitam munishvaraih || || te ca tam parisancitya pravartante
    sureshvarim | tvam samstuta pujita ca munindrai rmanu manavaih || || daityendrai shca suraishcapi
    brahma vishnushivadibhih | jadibhuta ssahasrasyah pancavaktra shcaturmukhah || || yam stotum ki maham
    staumi tamekasyena manavah | ityuktva yajnavalkya shca bhaktinamratma kandharah || || prananama niraharo
    ruroda ca muhurmuhuh | jyotirupa mahamaya tena drishta || sukavindro bhavetyuktva vaikuntham ca jagama
    ha | yajnavalkya kritam vani stotrametattu yah pathet || sa kavindro mahavagmi brihaspatisamo bhavet
    | maha murkhashca durbuddhir | sa panditashca medhavi sukavindro bhaveddhruvam || iti shri devi bhagavate
    mahapurane navamaskandhe sarasvatistavam nama pancamodhyayah | sarasvati kataksha siddhirastu | idam
    mayakritam parayanam shrisadguru caranaravindarpanamastu |
  devanagari: याज्ञवल्क्यकृत सरस्वती स्तवम् याज्ञवल्क्य उवाच कृपां कुरु जगन्मातर् । गुरुशापात् स्मृतिभ्रष्टं
    विद्याहीनं च दुःखितम् ॥ ज्ञानं देहि स्मृतिं विद्यां शक्तिं शिष्य प्रबोधिनीम् । ग्रन्थकर्तृत्व शक्तिं
    च सुशिष्यं सुप्रतिष्ठितम् ॥ प्रतिभां सत्सभायां च विचारक्षमतां शुभाम् । लुप्तं सर्वं दैव योगा न्नवीभूतं
    पुनः कुरु ॥ ॥ यथाङ्कुरं भस्मनि च करोति देवता पुनः । ब्रह्मस्वरूपा परमा ज्योतीरूपा सनातनी ॥ ॥ सर्वविद्याधिदेवी
    या तस्यै वाण्यै नमो नमः । विसर्ग बिन्दुमात्रासु यदधिष्ठानमेवच ॥ ॥ तदधिष्ठात्री या देवी तस्यै वाण्यै
    नमो नमः । व्याख्यास्वरूपा सा देवी व्याख्याधिष्ठातृरूपिणी ॥ ॥ यया विना प्रसङ्ख्यावान् सङ्ख्यां कर्तुं
    न शक्यते । कालसङ्ख्या स्वरूपा या तस्यै देव्यै नमो नमः ॥ ॥ भ्रम सिद्धान्तरूपा या तस्यै देव्यै नमो नमः
    । स्मृतिशक्ति ज्ञानशक्ति बुद्धिशक्ति स्वरूपिणी ॥ ॥ प्रतिभाकल्पनाशक्तिर् या च तस्यै नमोनमः । सनत्कुमारो
    ब्रह्माणं ज्ञानं पप्रच्छ यत्र वै ॥ ॥ बभूव मूकवत्सोस्पि सिद्धान्तं कर्तु मक्षमः । तदाष्जगाम भगवा नात्मा
    श्रीकृष्ण ईश्वरः ॥ ॥ उवाच स च तां स्तौहि वाणी मिष्टां प्रजापते । स च तुष्टाव तां ब्रह्मा चाज्ञया परमात्मनः
    ॥ ॥ चकार तत्प्रसादेन तदा सिद्धान्त मुत्तमम् । यदाप्यनन्तं पप्रच्छ ज्ञानमेकं वसुन्धरा ॥ ॥ बभूव मूकवत्सोस्पि
    सिद्धान्तं कर्तु मक्षमः । तदा तां च स तुष्टाव सन्त्रस्तः कश्यपाज्ञया ॥ ॥ तत श्चकार सिद्धान्तं निर्मलं
    भ्रम भञ्जनम् । व्यासः पुराणसूत्रं च पप्रच्छ वाल्मीकिं यदा ॥ ॥ मौनीभूत श्च सस्मार तामेव जगदम्बिकाम्
    । तदा चकार सिद्धान्तं तद्वरेण मुनीश्वरः ॥ ॥ सम्प्राप्य निर्मलं ज्ञानं भ्रमान्ध्य ध्वंसदीपकम् । पुराणसूत्रं
    श्रुत्वा च व्यासः कृष्णकलोद्भवः ॥ ॥ तां शिवां वेद दध्यौ च शतवर्षं च पुष्करे । तदा त्वत्तो वरं प्राप्य
    सत्कवीन्द्रो बभूव ह ॥ ॥ तदा वेदविभागं च पुराणं च चकार सः । यदा महेन्द्रः पप्रच्छ तत्त्वज्ञानं सदाशिवम्
    ॥ क्षणं तामेव सञ्चिन्त्य तस्मै ज्ञानं ददौ विभुः । पप्रच्छ शब्दशास्त्रं च महेन्द्र श्च बृहस्पतिम् ॥
    दिव्य वर्ष सहस्रं च स त्वां दध्यौ च पुष्करे । तदा त्वत्तो वरं प्राप्य दिव्यवर्षसहस्रकम् ॥ उवाच शब्द
    शास्त्रं च तदर्थं च सुरेश्वरम् । अध्यापिताश्च ये शिष्या यैरधीतं मुनीश्वरैः ॥ ॥ ते च तां परिसञ्चित्य
    प्रवर्तन्ते सुरेश्वरीम् । त्वं संस्तुता पूजिता च मुनीन्द्रै र्मनु मानवैः ॥ ॥ दैत्येन्द्रै श्च सुरैश्चापि
    ब्रह्म विष्णुशिवादिभिः । जडीभूत स्सहस्रास्यः पञ्चवक्त्र श्चतुर्मुखः ॥ ॥ यां स्तोतुं कि महं स्तौमि
    तामेकास्येन मानवः । इत्युक्त्वा याज्ञवल्क्य श्च भक्तिनम्रात्म कन्धरः ॥ ॥ प्रणनाम निराहारो रुरोद च
    मुहुर्मुहुः । ज्योतीरूपा महामाया तेन दृष्टा ॥ सुकवीन्द्रो भवेत्युक्त्वा वैकुण्ठं च जगाम ह । याज्ञवल्क्य
    कृतं वाणी स्तोत्रमेतत्तु यः पठेत् ॥ स कवीन्द्रो महावाग्मी बृहस्पतिसमो भवेत् । महा मूर्खश्च दुर्बुद्धिर्
    । स पण्डितश्च मेधावी सुकवीन्द्रो भवेद्ध्रुवम् ॥ इति श्री देवी भागवते महापुराणे नवमस्कन्धे सरस्वतीस्तवं
    नाम पञ्चमोध्यायः । सरस्वती कटाक्ष सिद्धिरस्तु । इदं मयाकृतं पारायणं श्रीसद्गुरु चरणारविन्दार्पणमस्तु
    ।
