id: samastapapanashanavishnustotrapushkara
category: stotram
name:
  english: samastapapanashanavishnustotrapushkara
  devanagari: समस्तपापनाशनविष्णुस्तोत्रपुष्कर
content:
  english: papam yatu shariram me hrishikesha pundarikaksha madhava | papam prashamayadyatvam vakkritam
    mama madhava || 14|| yadbhunjanyatsvapamstishthan gacchan jagrad yadasthitah | kritavan papamadyaham
    kayena manasagira || 15|| yat svalpamapi yat sthulam kuyoninarakavaham | tadyatu prashamamsarva vasudevanukirtanat
    || 16|| param brahma param dhama pavitram paramanca yat | tasmin prakirtite vishnau yat papam tat
    pranashyatu || 17|| yat prapya na nivartante gandhasparshadi varjitam | surayastat padam vishnostat
    sarvam shamayatvadham || 18|| mahatmyam papapranashanam stotram yah pathecchrinuyadapi | sharirairmanasairvagjaih
    kritaih papaih pramucyate || 19|| sarvapapagrahadibhyo yativishnoh param padam | tasmatpape krite
    japyamstotramsarvaghamardanam || 20|| prayashcittamaghaughanam stotram vratakrite varam | prayashcittaih
    stotrajapairvratairnashyati patakam || 21|| tatah karyani samsiddhyai tani vai bhuktimuktaye || 22||
    ityagneye mahapurane sarvapapaprayashcitta papanashanastotram nama dvisaptatyadhikashatatamo'dhyayah
    ||
  devanagari: पापं यातु शरीरं मे हृषीकेश पुण्डरीकाक्ष माधव । पापं प्रशमयाद्यत्वं वाक्कृतं मम माधव ॥ १४॥
    यद्भुञ्जन्यत्स्वपंस्तिष्ठन् गच्छन् जाग्रद् यदास्थितः । कृतवान् पापमद्याहं कायेन मनसागिरा ॥ १५॥ यत्
    स्वल्पमपि यत् स्थूलं कुयोनिनरकावहम् । तद्यातु प्रशमंसर्व वासुदेवानुकीर्तनात् ॥ १६॥ परं ब्रह्म परं
    धाम पवित्रं परमञ्च यत् । तस्मिन् प्रकीर्तिते विष्णौ यत् पापं तत् प्रणश्यतु ॥ १७॥ यत् प्राप्य न निवर्तन्ते
    गन्धस्पर्शादि वर्जितम् । सूरयस्तत् पदं विष्णोस्तत् सर्वं शमयत्वधम् ॥ १८॥ माहात्म्यं पापप्रणाशनं स्तोत्रं
    यः पठेच्छृणुयादपि । शारीरैर्मानसैर्वाग्जैः कृतैः पापैः प्रमुच्यते ॥ १९॥ सर्वपापग्रहादिभ्यो यातिविष्णोः
    परं पदम् । तस्मात्पापे कृते जप्यंस्तोत्रंसर्वाघमर्दनम् ॥ २०॥ प्रायश्चित्तमघौघानां स्तोत्रं व्रतकृते
    वरम् । प्रायश्चित्तैः स्तोत्रजपैर्व्रतैर्नश्यति पातकम् ॥ २१॥ ततः कार्याणि संसिद्ध्यै तानि वै भुक्तिमुक्तये
    ॥ २२॥ इत्याग्नेये महापुराणे सर्वपापप्रायश्चित्त पापनाशनस्तोत्रं नाम द्विसप्तत्यधिकशततमोऽध्यायः ॥
