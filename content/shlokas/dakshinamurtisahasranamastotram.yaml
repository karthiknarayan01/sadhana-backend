id: dakshinamurtisahasranamastotram
category: sahasranama
name:
  english: dakshinamurtisahasranamastotram
  devanagari: दक्षिणामूर्तिसहस्रनामस्तोत्रम्
content:
  english: vatamule mahaccitram sumdarah paramashshivah | taruno maunayu kchambhurmunayah pamditottamah
    || om dakshino dakshinamurtirdayalurdinavallabhah | dinartiha dinanatho dinabandhurdayaparah || 1||
    daridryashamano'dino dirgho danavanashanah | danujarirduhkhahanta dushtabhutanishudanah || 2|| dinartiharano
    danto diptimandivyalocanah | dedipyamano durgeshah shridurgavaradayakah || 3|| darisamstho danarupo
    danasanmanatoshitah | dino dadimapushpadhyo dadimipushpabhushitah || 4|| dainyahridduritaghnashca
    dishavaso digambarah | dikpatirdirghasutri ca daradambudalocanah || 5|| dakshinapremasantushto daridryavadavanalah
    | dakshinavarado daksho dakshadhvaravinashakrit || 6|| damodarapriyo dirgho dirghikajanamadhyagah
    | dharmo dhanaprado dhyeyo dhimandhairyavibhushitah || 7|| dharanidharako dhata dhanadhyaksho dhurandharah
    | dhidharako dhindimako nagno narayano narah || 8|| naranathapriyo natho nadipulinasamsthitah | nanarupadharo
    namo nandishraddhapriyo narah || 9|| natacaryo natavaro narimanasamohanah | nadipriyo nitidharo nanamantrarahasyavit
    || 10|| narado namarahito naukarudho natapriyah | paramah paramadashca paravidyavikarshanah || 11||
    patih patityasamharta parameshah puratanah | puranapurushah punyah padyagadyavisharadah || 12|| padyapriyah
    padyahastah paramarthaparayanah | pritah puranapurushah puranagamasucakah || 13|| puranavetta papaghnah
    parvatishah pararthavit | padmavatipriyah pranah parah pararahasyavit || 14|| parvatiramanah pinah
    pitavasah paratparah | pashupahararasikah pashi pashupatah priyah || 15|| pakshindravahanapritah putradah
    putrapujitah | phaninadah phainkritishca phatkarih phrem parayanah || 16|| phrim bijajapasantushta
    phrinkarah phanibhushitah | phanividyamayah phraim phraim phraim phraim shabdaparayanah || 17|| phadasrajapasantushto
    balibhug banabhushitah | banapujarato blum blum blum bijaniratah shucih || 18|| bhavarnavo balamatih
    balesho balabhavadhrit | balapriyo balagatih balivaradapriyo bali || 19|| balacandrapriyo balo balashabdaparayanah
    | brahmandabhedano brahmajnani brahmanapalakah || 20|| bhavani bhupatirbhadro bhadrado bhadravahanah
    | bhutadhyaksho bhutapatih bhutabhitinivarana || 21|| bhadrankaro bhimagarbho bhimasangamalolupah
    | bhimo bhayanako bhrata bhranto bharakasurapriyah || 22|| bhasmabhusho bhasmasamstho bhaikshakarmaparayanah
    | bhanubhusho bhanurupo bhavanipritido bhavah || 23|| bhagedavo bhargavaso bhargapujaparayanah | bhavavrato
    bhavarato bhavabhavavivarjitah || 24|| bhargo bhavanantayukto bham bhim shabdaparayanah | bhram bijajapasantushto
    bhattaro bhadravahanah || 25|| bhattarako bhimabhimo bhimacandapatirbhavah | bhavanijapasantushto
    bhavanipujanotsukah || 26|| bhramaro bhramariyukto bhramarambaprapujitah | mahadevo mahamanyo mahesho
    madhavapriyah || 27|| madhupushpapriyo madhvi manapujaparayanah | madhupanapriyo mino minakshinayako
    mahan || 28|| maradrisho madanaghno mananiyo mahokshagah | madhavo manarahito mrambijajapatoshitah
    || 29|| madhupanarato mani maharho mohanasravit | mahatandavakrinmantro madhupujaparayanah || 30||
    murtirmudrapriyo mitro mitrasantushtamanasah | mrim mrim madhumatinatho mahadevapriyo mridah || 31||
    yadonidhiryadupatih yatiryajnaparayanah | yajva yagapriyo yaji yayibhavapriyo yamah || 32|| yatayatadirahito
    yatidharmaparayanah | yatisadhyo yashtidharo yajamanapriyo yajah || 33|| yajurvedapriyo yayi yamasamyamasamyutah
    | yamapidaharo yuktiryogi yogishvaralayah || 34|| yajnavalkyapriyo yonih yonidoshavivarjitah | yamininatho
    yushi ca yamavamshasamudbhavah || 35|| yaksho yakshapriyo yamyo ramo rajivalocanah | ratrincaro ratricaro
    ramesho ramapujitah || 36|| ramapujyo ramanatho ratnado ratnaharakah | rajyado ramavarado ranjako
    ratimargakrit || 37|| ramaniyo raghunatho raghuvamshapravartakah | ramanandapriyo raja rajarajeshvaro
    rasah || 38|| ratnamandiramadhyastho ratnapujaparayanah | ratnakaro lakshmanesho lakshmako lakshmalakshanah
    || 39|| lakshminathapriyo lali lambikayogamargadhrit | labdhalakshyo labdhasiddhirlabhyo laksharunekshanah
    || 40|| lolakshinayako lobhi lokanatho latamayah | latapujaparo lilo lakshamantrajapapriyah || 41||
    lambikamarganirato lakshakotyandanayakah | vanipriyo vamamargo vadi vadaparayanah || 42|| viramargarato
    viro viracaryaparayanah | varenyo varado vamo vamamargapravartakah || 43|| vamadevo vagadhisho vinadhyo
    venutatparah | vidyaprado vitihotro viravidyavisharadah || 44|| vargo vargapriyo vayuh vayuvegaparayanah
    | vartajnashca vashikari varshishtho vamaharshakah || 45|| vasishtho vakpatirvedyo vamano vasudo virat
    | varahipalako vashyo vanavasi vanapriyah || 46|| vanapatirvaridhari viro varanganapriyah | vanadurgapatirvanyah
    shaktipujaparayanah || 47|| shashankamaulih shantatma shaktimargaparayanah | sharaccandranibhah shantah
    shaktih samshayavarjitah || 48|| shacipatih shakrapujyah sharasthah shapavarjitah | shapanugrahakah
    shankhapriyah shatrunishudanah || 49|| sharirayogi shantarih shakta shramagatah shubhah | shukrapujyah
    shukrabhogi shukrabhakshanatatparah || 50|| sharadanayakah shaurih shanmukhah shanmanah shadhah |
    shandah shadangah shatkashca shadadhvamyagatatparah || 51|| shadamnayarahasyajnah shashthijapaparayanah
    | shatcakrabhedanah shashthinadashaddarshanapriyah || 52|| shashthidoshaharah shatkah shatshasrartharahasyavit
    | shadbhumi hitah shadvargah shadaishvaryaphalapradah || 53|| shadgunah shanmukhapritah shashthipalah
    shadatmakah | shatkrittikasamajasthah shadadharanivasakah || 54|| shodhanyasamayah sindhuh sundarah
    surasundarah | suradhyakshah surapatih sumukhah susamah surah || 55|| subhagah sarvavitsaumya siddhamargapravartakah
    | sahajanandajah sama sarvashastrarahasyavit || 56|| samiddhomapriyah sarvah sarvashaktiprapujitah
    | suradevah sudevashca sanmargah siddhadarshanah || 57|| sarvavitsadhuvitsadhuh sarvadharmasamanvitah
    | sarvadhyakshah sarvavedyah sanmargasucako'rthavit || 58|| hari harirharo hridyo haro harshaprado
    harih | harayogi heharato harivaho haridhvajah || 59|| hradimargarato hrim ca haritavaradayakah |
    haritavarado hino hitakriddhumkritirhavih || 60|| havishyabhug havishyashi haridvarno haratmakah |
    haihayesho hrinkritishca harimanasatoshanah || 61|| hramnkarajapasantushto hrinkarajapacihnitah |
    hitakari harinadrik halito haranayakah || 62|| harapriyo hararato hahashabdaparayanah | ḻakara varnabhushadhyo
    ḻakaresho mahamunih || 63|| ḻakarabijanilayo ḻamḻim mantrapravartakah | kshemankaripriyah kshamyah
    kshamabhritkshanarakshakah || 64|| kshankarabijanilayah kshobhahrit kshobhavarjitah | kshobhahari
    kshobhakari kshrim bija kshram svarupadhrit || 65|| kshrankarabijanilayah kshaumambaravibhushitah
    | kshonirathah priyakarah kshamapalah kshamakarah || 66|| kshetrajnah kshetrapalashca kshayarogakshayankarah
    | kshamodarah kshamagatrah kshamarupah kshayodarah || 67|| adbhuto'nantavaradah anasuyuh priyamvadah
    | atriputro'gnigarbhashca abhuto'nantavikramah || 68|| adimadhyantarahitah animadi gunakarah | aksharo'shtagunaishvaryah
    arho'narhah sa ucyate || 69|| adityashcagunashcatma adhyatmapritamanasah | adyashcamrapriyashcamra
    amrapushpavibhushitah || 70|| amrapushpapriyah pranah arsha amratakeshvarah | ingitajnashca ishtajna
    ishtabhadra ishtapradastatha || 71|| ishtapurtapriyashceshta isha ishvaravallabhah | inkarashceshvaradhinah
    ishatatidindravacakah || 72|| ukshirukaragarbhashca ukaraya namo namah | uhya uhavinirmukta ushma
    ushmamanistatha || 73|| riddhikari riddhirupi riddhipravartakeshvarah | rikaravarnabhushadhyah rikaraya
    namo namah || 74|| likaragarbho likara lim linkaraya te namah | ekaragarbhashcaikarah ekashcaikapravacakah
    || 75|| ekankarishcaikakara ekapriyataraya te | ekavira ekapatih em aim shabdaparayanah || 76|| aindrapriyashcaikyakari
    aim bijajapatatparah | onkarashconkarabijah onkaraya namo namah || 77|| onkarapithanilayah onkareshvarapujitah
    | ankitottamavarnashca ankitajnaya te namah || 78|| kalankaharah kankalah krurah kukkutavahanah |
    kaminivallabhah kami kamyarthah kamaniyakah || 79|| kalanidhih kirtinathah kameshihridayangamah |
    kameshvarah kamarupah kalah kalakripanidhih || 80|| krishnah kalipatih kali krishacudamanih kalah
    | keshavah kevalah kantah kalisho
  devanagari: वटमूले महच्चित्रं सुंदरः परमश्शिवः । तरुणो मौनयु क्छंभुर्मुनयः पंडितोत्तमाः ॥ ॐ दक्षिणो
    दक्षिणामूर्तिर्दयालुर्दीनवल्लभः । दीनार्तिहा दीननाथो दीनबन्धुर्दयापरः ॥ १॥ दारिद्र्यशमनोऽदीनो दीर्घो
    दानवनाशनः । दनुजारिर्दुःखहन्ता दुष्टभूतनिषूदनः ॥ २॥ दीनार्तिहरणो दान्तो दीप्तिमान्दिव्यलोचनः । देदीप्यमानो
    दुर्गेशः श्रीदुर्गावरदायकः ॥ ३॥ दरिसंस्थो दानरूपो दानसन्मानतोषितः । दीनो दाडिमपुष्पाढ्यो दाडिमीपुष्पभूषितः
    ॥ ४॥ दैन्यहृद्दुरितघ्नश्च दिशावासो दिगम्बरः । दिक्पतिर्दीर्घसूत्री च दरदम्बुदलोचनः ॥ ५॥ दक्षिणाप्रेमसन्तुष्टो
    दारिद्र्यवडवानलः । दक्षिणावरदो दक्षो दक्षाध्वरविनाशकृत् ॥ ६॥ दामोदरप्रियो दीर्घो दीर्घिकाजनमध्यगः
    । धर्मो धनप्रदो ध्येयो धीमान्धैर्यविभूषितः ॥ ७॥ धरणीधारको धाता धनाध्यक्षो धुरन्धरः । धीधारको धिण्डिमको
    नग्नो नारायणो नरः ॥ ८॥ नरनाथप्रियो नाथो नदीपुलिनसंस्थितः । नानारूपधरो नमो नान्दीश्राद्धप्रियो नरः
    ॥ ९॥ नटाचार्यो नटवरो नारीमानसमोहनः । नदीप्रियो नीतिधरो नानामन्त्ररहस्यवित् ॥ १०॥ नारदो नामरहितो नौकारूढो
    नटप्रियः । परमः परमादश्च परविद्याविकर्षणः ॥ ११॥ पतिः पातित्यसंहर्ता परमेशः पुरातनः । पुराणपुरुषः पुण्यः
    पद्यगद्यविशारदः ॥ १२॥ पद्यप्रियः पद्यहस्तः परमार्थपरायणः । प्रीतः पुराणपुरुषः पुराणागमसूचकः ॥ १३॥
    पुराणवेत्ता पापघ्नः पार्वतीशः परार्थवित् । पद्मावतीप्रियः प्राणः परः पररहस्यवित् ॥ १४॥ पार्वतीरमणः
    पीनः पीतवासाः परात्परः । पशूपहाररसिकः पाशी पाशुपतः प्रियः ॥ १५॥ पक्षीन्द्रवाहनप्रीतः पुत्रदः पुत्रपूजितः
    । फणिनादः फैङ्कृतिश्च फट्कारिः फ्रें परायणः ॥ १६॥ फ्रीं बीजजपसन्तुष्ट फ्रीङ्कारः फणिभूषितः । फणिविद्यामयः
    फ्रैं फ्रैं फ्रैं फ्रैं शब्दपरायणः ॥ १७॥ फडस्रजपसन्तुष्टो बलिभुग् बाणभूषितः । बाणपूजारतो ब्लूं ब्लूं
    ब्लूं बीजनिरतः शुचिः ॥ १८॥ भवार्णवो बालमतिः बालेशो बालभावधृत् । बालप्रियो बालगतिः बलिवरदप्रियो बली
    ॥ १९॥ बालचन्द्रप्रियो बालो बालशब्दपरायणः । ब्रह्माण्डभेदनो ब्रह्मज्ञानी ब्राह्मणपालकः ॥ २०॥ भवानी
    भूपतिर्भद्रो भद्रदो भद्रवाहनः । भूताध्यक्षो भूतपतिः भूतभीतिनिवारण ॥ २१॥ भद्रङ्करो भीमगर्भो भीमसङ्गमलोलुपः
    । भीमो भयानको भ्राता भ्रान्तो भरकासुरप्रियः ॥ २२॥ भस्मभूषो भस्मसंस्थो भैक्षकर्मपरायणः । भानुभूषो भानुरूपो
    भवानीप्रीतिदो भवः ॥ २३॥ भगेदवो भर्गवासो भर्गपूजापरायणः । भावव्रतो भावरतो भावाभावविवर्जितः ॥ २४॥ भर्गो
    भावानन्तयुक्तो भां भिं शब्दपरायणः । भ्रां बीजजपसन्तुष्टो भट्टारो भद्रवाहनः ॥ २५॥ भट्टारको भीमभीमो
    भीमचण्डपतिर्भवः । भवानीजपसन्तुष्टो भवानीपूजनोत्सुकः ॥ २६॥ भ्रमरो भ्रामरीयुक्तो भ्रमराम्बाप्रपूजितः
    । महादेवो महामान्यो महेशो माधवप्रियः ॥ २७॥ मधुपुष्पप्रियो माध्वी मानपूजपरायणः । मधुपानप्रियो मीनो
    मीनाक्षीनायको महान् ॥ २८॥ मारदृशो मदनघ्नो माननीयो महोक्षगः । माधवो मानरहितो म्राम्बीजजपतोषितः ॥ २९॥
    मधुपानरतो मानी महार्हो मोहनास्रवित् । महाताण्डवकृन्मन्त्रो मधुपूजापरायणः ॥ ३०॥ मूर्तिर्मुद्राप्रियो
    मित्रो मित्रसन्तुष्टमानसः । म्रीं म्रीं मधुमतीनाथो महादेवप्रियो मृडः ॥ ३१॥ यादोनिधिर्यदुपतिः यतिर्यज्ञपरायणः
    । यज्वा यागप्रियो याजी यायीभावप्रियो यमः ॥ ३२॥ यातायातादिरहितो यतिधर्मपरायणः । यतिसाध्यो यष्टिधरो
    यजमानप्रियो यजः ॥ ३३॥ यजुर्वेदप्रियो यायी यमसंयमसंयुतः । यमपीडाहरो युक्तिर्योगी योगीश्वरालयः ॥ ३४॥
    याज्ञवल्क्यप्रियो योनिः योनिदोषविवर्जितः । यामिनीनाथो यूषी च यमवंशसमुद्भवः ॥ ३५॥ यक्षो यक्षप्रियो
    याम्यो रामो राजीवलोचनः । रात्रिञ्चरो रात्रिचरो रामेशो रामपूजितः ॥ ३६॥ रामपूज्यो रामनाथो रत्नदो रत्नहारकः
    । राज्यदो रामवरदो रञ्जको रतिमार्गकृत् ॥ ३७॥ रमणीयो रघुनाथो रघुवंशप्रवर्तकः । रामानन्दप्रियो राजा राजराजेश्वरो
    रसः ॥ ३८॥ रत्नमन्दिरमध्यस्थो रत्नपूजापरायणः । रत्नाकरो लक्ष्मणेशो लक्ष्मको लक्ष्मलक्षणः ॥ ३९॥ लक्ष्मीनाथप्रियो
    लाली लम्बिकायोगमार्गधृत् । लब्धलक्ष्यो लब्धसिद्धिर्लभ्यो लाक्षारुणेक्षणः ॥ ४०॥ लोलाक्षीनायको लोभी
    लोकनाथो लतामयः । लतापूजापरो लीलो लक्षमन्त्रजपप्रियः ॥ ४१॥ लम्बिकामार्गनिरतो लक्षकोट्यण्डनायकः । वाणीप्रियो
    वाममार्गो वादी वादपरायणः ॥ ४२॥ वीरमार्गरतो वीरो वीरचर्यापरायणः । वरेण्यो वरदो वामो वाममार्गप्रवर्तकः
    ॥ ४३॥ वामदेवो वागधीशो वीणाढ्यो वेणुतत्परः । विद्याप्रदो वीतिहोत्रो वीरविद्याविशारदः ॥ ४४॥ वर्गो वर्गप्रियो
    वायुः वायुवेगपरायणः । वार्तज्ञश्च वशीकारी वर्षिष्ठो वामहर्षकः ॥ ४५॥ वासिष्ठो वाक्पतिर्वेद्यो वामनो
    वसुदो विराट् । वाराहीपालको वश्यो वनवासी वनप्रियः ॥ ४६॥ वनपतिर्वारिधारी वीरो वाराङ्गनाप्रियः । वनदुर्गापतिर्वन्यः
    शक्तिपूजापरायणः ॥ ४७॥ शशाङ्कमौलिः शान्तात्मा शक्तिमार्गपरायणः । शरच्चन्द्रनिभः शान्तः शक्तिः संशयवर्जितः
    ॥ ४८॥ शचीपतिः शक्रपूज्यः शरस्थः शापवर्जितः । शापानुग्राहकः शङ्खप्रियः शत्रुनिषूदनः ॥ ४९॥ शरीरयोगी
    शान्तारिः शक्ता श्रमगतः शुभः । शुक्रपूज्यः शुक्रभोगी शुक्रभक्षणतत्परः ॥ ५०॥ शारदानायकः शौरिः षण्मुखः
    षण्मनाः षढः । षण्डः षडङ्गः षट्कश्च षडध्वंयागतत्परः ॥ ५१॥ षडाम्नायरहस्यज्ञः षष्ठीजपपरायणः । षट्चक्रभेदनः
    षष्ठीनादषड्दर्शनप्रियः ॥ ५२॥ षष्ठीदोषहरः षट्कः षट्शास्रार्थरहस्यवित् । षड्भूमि हितः षड्वर्गः षडैश्वर्यफलप्रदः
    ॥ ५३॥ षड्गुणः षण्मुखप्रीतः षष्ठिपालः षडात्मकः । षट्कृत्तिकासमाजस्थः षडाधारनिवासकः ॥ ५४॥ षोढान्यासमयः
    सिन्धुः सुन्दरः सुरसुन्दरः । सुराध्यक्षः सुरपतिः सुमुखः सुसमः सुरः ॥ ५५॥ सुभगः सर्ववित्सौम्य सिद्धमार्गप्रवर्तकः
    । सहजानन्दजः साम सर्वशास्त्ररहस्यवित् ॥ ५६॥ समिद्धोमप्रियः सर्वः सर्वशक्तिप्रपूजितः । सुरदेवः सुदेवश्च
    सन्मार्गः सिद्धदर्शनः ॥ ५७॥ सर्ववित्साधुवित्साधुः सर्वधर्मसमन्वितः । सर्वाध्यक्षः सर्ववेद्यः सन्मार्गसूचकोऽर्थवित्
    ॥ ५८॥ हारी हरिर्हरो हृद्यो हरो हर्षप्रदो हरिः । हरयोगी हेहरतो हरिवाहो हरिध्वजः ॥ ५९॥ ह्रादिमार्गरतो
    ह्रीं च हारीतवरदायकः । हारीतवरदो हीनो हितकृद्धुंकृतिर्हविः ॥ ६०॥ हविष्यभुग् हविष्याशी हरिद्वर्णो हरात्मकः
    । हैहयेशो ह्रीङ्कृतिश्च हरिमानसतोषणः ॥ ६१॥ ह्रांङ्कारजपसन्तुष्टो ह्रीङ्कारजपचिह्नितः । हितकारी हरिणदृक्
    हलितो हरनायकः ॥ ६२॥ हारप्रियो हाररतो हाहाशब्दपरायणः । ळकार वर्णभूषाढ्यो ळकारेशो महामुनिः ॥ ६३॥ ळकारबीजनिलयो
    ळांळिं मन्त्रप्रवर्तकः । क्षेमङ्करीप्रियः क्षाम्यः क्षमाभृत्क्षणरक्षकः ॥ ६४॥ क्षाङ्कारबीजनिलयः क्षोभहृत्
    क्षोभवर्जितः । क्षोभहारी क्षोभकारी क्ष्रीं बीज क्ष्रां स्वरूपधृत् ॥ ६५॥ क्ष्राङ्कारबीजनिलयः क्षौमाम्बरविभूषितः
    । क्षोणीरथः प्रियकरः क्षमापालः क्षमाकरः ॥ ६६॥ क्षेत्रज्ञः क्षेत्रपालश्च क्षयरोगक्षयङ्करः । क्षामोदरः
    क्षामगात्रः क्षामरूपः क्षयोदरः ॥ ६७॥ अद्भुतोऽनन्तवरदः अनसूयुः प्रियंवदः । अत्रिपुत्रोऽग्निगर्भश्च
    अभूतोऽनन्तविक्रमः ॥ ६८॥ आदिमध्यान्तरहितः अणिमादि गुणाकरः । अक्षरोऽष्टगुणैश्वर्यः अर्होऽनर्हः स उच्यते
    ॥ ६९॥ आदित्यश्चागुणश्चात्मा अध्यात्मप्रीतमानसः । आद्यश्चाम्रप्रियश्चाम्र आम्रपुष्पविभूषितः ॥ ७०॥ आम्रपुष्पप्रियः
    प्राणः आर्ष आम्रातकेश्वरः । इङ्गितज्ञश्च इष्टज्ञ इष्टभद्र इष्टप्रदस्तथा ॥ ७१॥ इष्टापूर्तप्रियश्चेष्ट
    ईश ईश्वरवल्लभः । ईङ्कारश्चेश्वराधीनः ईशतटिदिन्द्रवाचकः ॥ ७२॥ उक्षिरूकारगर्भश्च ऊकाराय नमो नमः । ऊह्य
    ऊहविनिर्मुक्त ऊष्मा ऊष्ममणिस्तथा ॥ ७३॥ ऋद्धिकारी ऋद्धिरूपी ऋद्धिप्रावर्तकेश्वरः । ॠकारवर्णभूषाढ्यः
    ॠकाराय नमो नमः ॥ ७४॥ ऌकारगर्भो ॡकार ॡं ॡङ्काराय ते नमः । एकारगर्भश्चैकारः एकश्चैकप्रवाचकः ॥ ७५॥ एकङ्कारिश्चैककर
    एकप्रियतराय ते । एकवीर एकपतिः एं ऐं शब्दपरायणः ॥ ७६॥ ऐन्द्रप्रियश्चैक्यकारी ऐं बीजजपतत्परः । ओङ्कारश्चोङ्कारबीजः
    ओङ्काराय नमो नमः ॥ ७७॥ ओङ्कारपीठनिलयः ओङ्कारेश्वरपूजितः । अङ्कितोत्तमवर्णश्च अङ्कितज्ञाय ते नमः ॥
    ७८॥ कलङ्कहरः कङ्कालः क्रूरः कुक्कुटवाहनः । कामिनीवल्लभः कामी काम्यार्थः कमनीयकः ॥ ७९॥ कलानिधिः कीर्तिनाथः
    कामेशीहृदयङ्गमः । कामेश्वरः कामरूपः कालः कालकृपानिधिः ॥ ८०॥ कृष्णः कालीपतिः कालि कृशचूडामणिः कलः ।
    केशवः केवलः कान्तः कालीशो
