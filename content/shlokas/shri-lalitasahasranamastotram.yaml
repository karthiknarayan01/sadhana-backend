id: shri-lalitasahasranamastotram
category: stotram
name:
  english: shri lalitasahasranamastotram
  devanagari: श्री ललितासहस्रनामस्तोत्रम्
content:
  english: ḻopamudrapate'gastya savadhanamanah shunrih | namnam sahasra yannoktam karanam tadvadami te
    || rahasyamiti matva'ham noktavaste na canyatha | punshca pricchate bhaktya tasmattte vadamyaham ||
    bruyacchishyaya bhaktaya rahasyamapi deshikah | bhavata na pradeyam syadabhaktaya kadacana || na shathaya
    na dushtaya navishvasaya karhicit | shrimatribhaktiyuktaya shrividyarajavedine || upasakaya shuddhaya
    deyam namasahasrakam | yani nama sahasranani sadyah siddhipradani vai || tantreshu lalitadevyastute
    mukhyamidam mune | shrividyaiva tu mantranam tatra kadiryatha para || puranam shrirapuramiva shaktinam
    lalita yatha | shrividyopasakanam ca yatha devo parah shivah || tatha nama sahasreshu varametat prakirtitam
    | yatha'sya pathanaddevi priyate lalitambika || anyanamasahasrasya pathanna priyate tatha | shrimatuh
    priyate tasmadadisham kirtayedidma || bilvapatraishvakraraje yo'rcayellalitambikam | padymairva tulasipushpairibhirnamasahasraih
    || sadyah prasadam kurute tasya simhasaneshvari | cakradhirajamabhyarcya japtva pancadashaksharim
    || japante kirtiyennityamidam namasahasrakam | japapujadyashaktashret pathennamasahasram || sangarcane
    sangajape yatphalam tadavapnuyat | upasane stutiranya pathedabhyudayo hi sah || idam namasahasram
    tu kirtiyennityakarmavat | cakrarajarcanam devya japo namnam ca kirtinam || bhaktasya krityametavadanyadabhyudayam
    viduh | bhaktasyavashyakamidam namasahasrakirtinam | tatra hetum pravakshyami shunri tvam kumbhasambhava
    || pura shrilalitadevi bhaktanam hitakamyaya || vagdevirvashinimukhyah samahuyedamabravita | vagdevata
    vashinyadyah shunridhvam vacanam mama || bhavatyo matprasadena prollasadvagvibhutayah | madbhaktanam
    vagvibhutipradane viniyajitah || maccakrasya rahasyajna mama namaparayanah | mama stotravidhanaya
    tasmadajnapayami vah || kurudhvamamkkitam stotram mama namasahasrakaih | yena bhaktaih stutaya me
    sadyah pritih para bhavet || hayagriva uvaca
  devanagari: ळोपामुद्रापतेऽगस्त्य सावधानमनाः शुणृः । नाम्नां सहस्र यन्नोक्तं कारणं तद्वदामि ते ॥ रहस्यमिति
    मत्वाऽहं नोक्तवास्ते न चान्यथा । पुन्श्च पृच्छते भक्त्या तस्मात्त्ते वदाम्यहम् ॥ ब्रूयाच्छिष्याय भक्ताय
    रहस्यमपि देशिकः । भवता न प्रदेयं स्यादभक्ताय कदाचन ॥ न शठाय न दुष्टाय नाविश्वासाय कर्हिचित् । श्रीमातृभक्तियुक्ताय
    श्रीविद्याराजवेदिने ॥ उपासकाय शुद्धाय देयं नामसहस्रकम् । यानि नाम सहस्रणानि सद्यः सिद्धिप्रदानि वै
    ॥ तन्त्रेषु ललितादेव्यास्तुते मुख्यमिदं मुने । श्रीविद्यैव तु मन्त्राणां तत्र कादिर्यथा परा ॥ पुराणां
    श्रिरपुरमिव शक्तिनां ललिता यथा । श्रीविद्योपासकानां च यथा देवो परः शिवः ॥ तथा नाम सहस्रेषु वरमेतत्
    प्रकीर्तितम् । यथाऽस्य पठनाद्देवी प्रीयते ललिताम्बिका ॥ अन्यनामसहस्रस्य पाठान्न प्रीयते तथा । श्रीमातुः
    प्रीयते तस्माददिशं कीर्तयेदिद्म ॥ बिल्वपत्रैश्वक्रराजे योऽर्चयेल्ललिताम्बिकाम् । पद्य्मैर्वा तुलसीपुष्पैरिभिर्नामसहस्रैः
    ॥ सद्यः प्रसादं कुरुते तस्य सिंहासनेश्वरी । चक्राधिराजमभ्यर्च्य जप्त्वा पञ्चदशाक्षरीम् ।। जपान्ते
    कीर्तियेन्नित्यमिदं नामसहस्रकम् । जपपूजाद्यशक्तश्रेत् पठेन्नामसहस्रम् ।। साङ्गर्चने साङ्गजपे यत्फलं
    तदवाप्नुयात् । उपासने स्तुतीरन्या पठेदभ्युदयो हि सः ।। इदं नामसहस्रं तु कीर्तियेन्नित्यकर्मवत् । चक्रराजार्चनं
    देव्या जपो नाम्नां च कीर्तिनम् ।। भक्तस्य कृत्यमेतावदन्यदभ्युदयं विदुः । भक्तस्यावश्यकमिदं नामसहस्रकीर्तिनम्
    । तत्र हेतुं प्रवक्ष्यामि शुणृ त्वं कुम्भसम्भव ।। पुरा श्रीललितादेवी भक्तानां हितकाम्यया ।। वाग्देवीर्वशिनीमुख्याः
    समाहूयेदमब्रवीत । वाग्देवता वशिन्याद्याः शुणृध्वं वचनं मम ।। भवत्यो मत्प्रसादेन प्रोल्लसद्वाग्विभूतयः
    । मद्भक्तानाम् वाग्विभूतिप्रदाने विनियाजिताः ।। मच्चक्रस्य रहस्यज्ञा मम नामपरायणाः । मम स्तोत्रविधानाय
    तस्मादाज्ञापयामि वः ।। कुरुध्वमंक्कितं स्तोत्रं मम नामसहस्रकैः । येन भक्तैः स्तुताया मे सद्यः प्रीतिः
    परा भवेत् ।। हयग्रीव उवाच
