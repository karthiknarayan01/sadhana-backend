    भि नः॑ शीयताग्ं र॒यिरेक॑ द्दि॑दी॒क्षे चतु॑र्दश यामे॒वाफ्स्वाहु॑तिम् ह॑पत्या स्त्रि॒ग्ं॒शदु॑त्तरश॒तं
    ॥ हरिः॑ ओम् ॥ ॥ कृष्ण यजुर्वेदीय तैत्तिरीय ब्राह्मणे तृतीयाष्टके सप्तमः प्रपाठक
