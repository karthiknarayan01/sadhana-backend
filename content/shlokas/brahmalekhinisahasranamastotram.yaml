id: brahmalekhinisahasranamastotram
category: sahasranama
name:
  english: brahmalekhinisahasranamastotram
  devanagari: ब्रह्मलेखिनीसहस्रनामस्तोत्रम्
content:
  english: rinu kavacasyasya rishih parabrahmasmritah || 1|| chando'nushtup prokta devata lekhinishvari
    | vagbhavabijam ca shaktikutabijakam || 2|| kurcabijotkilanam saubhagyanirnayaya ca | madiyankalipisamshodhanarthe
    viniyogah smritah || 3|| || atha kavacam || pranavam me shirah patu mayam ca mama bhalakam | ekakshari
    para shaktih sravanti patu cakshushi || 4|| tryakshari tryambakakara nasikam me sadavatu | caturakshari
    mahamaya mukham me patu sarvada || 5|| pancadashakshari nitya jihvam rakshet kuleshvari | shodashi
    shodasharna ca kantham me patu cinmayi || 6|| aim hrim aim samputakara karnayugmam sadavatu | klim
    blum klim bijarupa ca kapolau me sadavatu || 7|| mayabijam mahadiptam dantapanktim mamavatu | kurcabijam
    parakaram civukam me sadavatu || 8|| vadhubijam mahaguhyam rasanam me sadavatu | lekhini sarvavarnesha
    grivam patu mahotkata || 9|| gayatri patu me skandhau savitri bahuyugmakam | sarasvati karau patu
    tara angulimulakam || 10|| ugratara nakhagram ca nilasarasvati tatha | vakshahsthalam sada rakshet
    sharada sarvamangala || 11|| shyama patu dviparshvam ca matangi stanamandalam | bagalamukhi mahodagro
    nabhim patu bhayatura || 12|| rajamatangini patu jatharam kukshibhagakam | mahapishacini rakshet prishthavamsham
    samantatah || 13|| kotishvari katim patu kalpabhedini guhyakam | hastiyogini me uru rahasyayogini
    tatha || 14|| brahmi patu januyugmam brahmayogini janghakam | brahmalekhini patu padau brahmani padaprishthakam
    || 15|| akshara patu padangulih mahasarasvati tatha | niladevi sarvagatram patu mam sarvasankate ||
    16|| adisharada sada rakshet svapne jagarane pathi | vinapanirjnanamayi sarvadikshu sadavatu || 17||
    durga durgatika patu sangrame rajamandire | pancapranan mahamaya lekhinirupadharini || 18|| raktamamsamasthimajjam
    shukram tvacam tathaiva ca | dhatuna sarvan sharire tu patu devyakshareshvari || 19|| bhucari khecari
    caiva patu mam kulavarddhini | yadrisham rupamasthaya vilikhed daivamaksharam || 20|| tadrisham rupamasthaya
    patu mam sarvato vibhuh | ida pingala sushumna naditantram mamavatu || 21|| sahasraradalapadmam mahabindum
    sadavatu | aksharamala mahadipta sarvangam me sadavatu || 22|| bindudvandvamayi caiva patu me netramandalam
    | trikonamadhyasamvishta bhruyugam me sadavatu || 23|| kadirupa patu kantham hadirupa ca hridgatam
    | sadirupa mahadevi nabhidesham sadavatu || 24|| vagbhavadhya mahalekha dakshinam parshvamavatu |
    kamakutatmika devi vamaparshvam sadavatu || 25|| shaktikuta mahaguhya prishthabhagam sadavatu | lajjabijam
    mahabhasaka hridayantaram mamavatu || 26|| shribijam patu me kosham kaulim ca patu kauliki | mantralekhamayi
    nitya buddhim me patu sarvada || 27|| cittam ceto madiyam ca jnanarupam kalavati | ahankaram mama
    rakshet sarvavidyavisharada || 28|| shabdaksharamayi rekha shrotrendriyam mamavatu | sparshaksharamayi
    nitya tvagindriyam sadavatu || 29|| rupaksharamayi jyeshtha cakshurindriyamavatu | rasaksharamayi
    shreshtha jihvendriyam mamavatu || 30|| gandhaksharamayi shuddha ghranendriyam sadavatu | vakpanipadapayumshca
    patu devyakshareshvari || 31|| jagradavastham sada rakshet vishvarupa paratpara | svapnavastham mahasukshma
    taijasakhya sadavatu || 32|| sushuptyavastham nityam me prajnarupa mamavatu | turiyastham mahashunya
    bindurupa sadavatu || 33|| purvasyam patu mam vani agneyyam tarini tatha | dakshinasyam mahashyama
    nairityam ugratarini || 34|| pashcimayam mahadurga vayavyam bagalamukhi | uttarasyam sada rakshet
    matangi rajamatula || 35|| aishanyam patu mam brahmi urdhvam brahmamayi para | adhastat patu mam nityam
    patalavasini shiva || 36|| digvidikshu ca sarvatra sarvavyapini lekhini | vajrarekhaparighrite rakshet
    mam kulamandire || 37|| yantralekhamahapraci mantrakilanasamskrita | mahapishacamantrebhyo rakshet
    mam sarvada vibhuh || 38|| jalamadhye sthalamadhye ca rane rajakule pathi | mahashailatate ghore patu
    mam kamarupini || 39|| vivade shastracarcayam sabhayam shatrusankate | dantaushthakanthajihvasu patu
    mam sharada svayam || 40|| ajnanat jnanato va'pi yat tyaktam kavace mama | tatsa rakshet mahadevi
    lekhini sarvamangala || 41|| padatalat shiro yavat shirasah padatalakam | vajrakotisamam gatram patu
    devi nirantaram || 42|| kavacasya phalashrutih ityetatkavacam divyam vajrapanjaramuttamam | guhyadguhyataram
    tattvam sarvasaubhagyadayakam || 1|| na deyam yasya kasyapi gopitam kulapustake | yah pathecchranuyadvapi
    trisandhyam niyatah shucih || 2|| tasya hastagata siddhih sakshadvagishvaro bhavet | etanmahakavacam
    guhyam yo na janati manavah || 3|| sa japet satatam mantram tasya mantro na sidhyati | sarasvatam
    mahamantram lekhinimantramuttamam || 4|| dikshito'pi kulacare kotikalpairna vindati | kavacena vina
    martyo mantrajapyam karoti yah || 5|| tasya bhagyakshayo yati mantrashca malinastatha | kota kalpam
    japedvapi shrama eva hi kevalam || 6|| tasmatsarvaprayatnena kavacam prapathetpura | pashcanmantram
    japetprajnah sa sakshad bhairavo bhavet || 7|| rakshakamo mahamartyo yah kashcid bhuvi vartate | tena
    na gantavyam kvapi kavacena vina padam || 8|| na padaikam pragacchecca na ca gacchet kadacana | vina
    kavacapathattu margam naiva pravishet puman || 9|| yadi gacchet pramadena mandabuddhih vimohitah |
    tadaiva tasya vighnani jayante sarvatomukham || 10|| bhutapretapishacashca dakinyo yatudhanah | ripavah
    shastrahastashca tam himsanti pade pade || 11|| tasmad grihad vinishkrante kavacam dharayet pathet
    | tasya padayuge nityam raksha tishthati sarvada || 12|| shanmasadharanadasya vajrakayo bhavennarah
    | na shastrairbhidyate gatram na cagnirdahate kacit || 13|| visham sthavarajangamam kritrimam cabhicarikam
    | prashamyedamritam yati kavacasya prabhavatah || 14|| yah pathet paramam divyam sa vasham nayate
    jagat | rajano rajaputrashca naryashca kulajastatha || 15|| tasyadhina bhavantyeva dasabhuta nirantaram
    | mahotpate ca durbhikshe shmashane sankate tatha || 16|| kavacam samsmaran martyo hyakshato vijayanvitah
    | likhitva dharayedyastu kanthe va dakshina bhuje || 17|| tasya gehe sthira lakshmih vani ca vadane
    vaset | iti te kathitam garbha parakrishnarahasyakam || 18|| bhagyarekhavishodhanam sarvakaranakaranam
    | na kalo badhate tasya na mrityuh prabhavatyapi || 19|| cinmayah subhago loke mahakirtisamanvitah
    | sarvamargeshu mam patu parakrishno jaganmayah || 20|| iti sarvasaubhagyadayakam vajrapanjara brahmalekhinikavacam
    sampurnam |
  devanagari: ृणु कवचस्यास्य ऋषिः परब्रह्मस्मृतः ॥ १॥ छन्दोऽनुष्टुप् प्रोक्ता देवता लेखिनीश्वरी । वाग्भवबीजं
    च शक्तिकूटबीजकम् ॥ २॥ कूर्चबीजोत्कीलनां सौभाग्यनिर्णयाय च । मदीयाङ्कलिपिसंशोधनार्थे विनियोगः स्मृतः
    ॥ ३॥ ॥ अथ कवचम् ॥ प्रणवं मे शिरः पातु मायां च मम भालकम् । एकाक्षरी परा शक्तिः स्रवन्ती पातु चक्षुषी
    ॥ ४॥ त्र्यक्षरी त्र्यम्बकाकारा नासिकां मे सदावतु । चतुरक्षरी महामाया मुखं मे पातु सर्वदा ॥ ५॥ पञ्चदशाक्षरी
    नित्या जिह्वां रक्षेत् कुलेश्वरी । षोडशी षोडशार्णा च कण्ठं मे पातु चिन्मयी ॥ ६॥ ऐं ह्रीं ऐं सम्पुटाकारा
    कर्णयुग्मं सदावतु । क्लीं ब्लूं क्लीं बीजरूपा च कपोलौ मे सदावतु ॥ ७॥ मायाबीजं महादीप्तं दन्तपङ्क्तिं
    ममावतु । कूर्चबीजं पराकारं चिवुकं मे सदावतु ॥ ८॥ वधूबीजं महागुह्यं रसनां मे सदावतु । लेखिनी सर्ववर्णेशा
    ग्रीवां पातु महोत्कटा ॥ ९॥ गायत्री पातु मे स्कन्धौ सावित्री बाहुयुग्मकम् । सरस्वती करौ पातु तारा अङ्गुलीमूलकम्
    ॥ १०॥ उग्रतारा नखाग्रं च नीलसरस्वती तथा । वक्षःस्थलं सदा रक्षेत् शारदा सर्वमङ्गला ॥ ११॥ श्यामा पातु
    द्विपार्श्वं च मातङ्गी स्तनमण्डलम् । बगलामुखी महोदग्रो नाभिं पातु भयातुर ॥ १२॥ राजमातङ्गिनी पातु जठरं
    कुक्षिभागकम् । महापिशाचिनी रक्षेत् पृष्ठवंशं समन्ततः ॥ १३॥ कोटिश्वरी कटिं पातु कल्पभेदिनी गुह्यकम्
    । हस्तियोगिनी मे ऊरू रहस्ययोगिनी तथा ॥ १४॥ ब्राह्मी पातु जानुयुग्मं ब्रह्मयोगिनी जङ्घकम् । ब्रह्मलेखिनी
    पातु पादौ ब्रह्माणी पादपृष्ठकम् ॥ १५॥ अक्षरा पातु पादाङ्गुलीः महासरस्वती तथा । नीलादेवी सर्वगात्रं
    पातु मां सर्वसङ्कटे ॥ १६॥ आदिशारदा सदा रक्षेत् स्वप्ने जागरणे पथि । वीणापाणिर्ज्ञानमयी सर्वदिक्षु
    सदावतु ॥ १७॥ दुर्गा दुर्गतिका पातु सङ्ग्रामे राजमन्दिरे । पञ्चप्राणान् महामाया लेखिनीरूपधारिणी ॥ १८॥
    रक्तमांसमस्थिमज्जां शुक्रं त्वचं तथैव च । धातून सर्वान् शरीरे तु पातु देव्यक्षरेश्वरी ॥ १९॥ भूचरी
    खेचरी चैव पातु मां कुलवर्द्धिनी । यादृशं रूपमास्थाय विलिखेद् दैवमक्षरम् ॥ २०॥ तादृशं रूपमास्थाय पातु
    मां सर्वतो विभुः । इडा पिङ्गला सुषुम्ना नाडीतन्त्रं ममावतु ॥ २१॥ सहस्रारदलपद्मं महाबिन्दुं सदावतु
    । अक्षरमाला महादीप्ता सर्वाङ्गं मे सदावतु ॥ २२॥ बिन्दुद्वन्द्वमयी चैव पातु मे नेत्रमण्डलम् । त्रिकोणमध्यसंविष्टा
    भ्रूयुगं मे सदावतु ॥ २३॥ कादिरूपा पातु कण्ठं हादिरूपा च हृद्गतम् । सादिरूपा महादेवी नाभिदेशं सदावतु
    ॥ २४॥ वाग्भवाढ्या महालेखा दक्षिणं पार्श्वमावतु । कामकूटात्मिका देवी वामपार्श्वं सदावतु ॥ २५॥ शक्तिकूटा
    महागुह्या पृष्ठभागं सदावतु । लज्जाबीजं महाभासक हृदयन्तरं ममावतु ॥ २६॥ श्रीबीजं पातु मे कोशां कौलीं
    च पातु कौलिकी । मन्त्रलेखमयी नित्या बुद्धिं मे पातु सर्वदा ॥ २७॥ चित्तं चेतो मदीयं च ज्ञानरूपं कलावती
    । अहङ्कारं मम रक्षेत् सर्वविद्याविशारदा ॥ २८॥ शब्दाक्षरमयी रेखा श्रोत्रेन्द्रियं ममावतु । स्पर्शाक्षरमयी
    नित्या त्वगिन्द्रियं सदावतु ॥ २९॥ रूपाक्षरमयी ज्येष्ठा चक्षुरिन्द्रियमवातु । रसाक्षरमयी श्रेष्ठा जिह्वेन्द्रियं
    ममावतु ॥ ३०॥ गन्धाक्षरमयी शुद्धा घ्राणेन्द्रियं सदावतु । वाक्पाणिपादपायूंश्च पातु देव्यक्षरेश्वरी
    ॥ ३१॥ जाग्रदवस्थां सदा रक्षेत् विश्वरूपा परात्परा । स्वप्नावस्थां महासूक्ष्मा तैजसाख्या सदावतु ॥ ३२॥
    सुषुप्त्यवस्थां नित्यं मे प्राज्ञरूपा ममावतु । तुरीयास्थां महाशून्या बिन्दुरूपा सदावतु ॥ ३३॥ पूर्वस्यां
    पातु मां वाणी आग्नेय्यां तारिणी तथा । दक्षिणस्यां महाश्यामा नैऋत्यां उग्रतारिणी ॥ ३४॥ पश्चिमायां महादुर्गा
    वायव्यां बगलामुखी । उत्तरस्यां सदा रक्षेत् मातङ्गी राजमातुल ॥ ३५॥ ऐशान्यां पातु मां ब्राह्मी ऊर्ध्वं
    ब्रह्ममयी परा । अधस्तात् पातु मां नित्यं पातालवासिनी शिवा ॥ ३६॥ दिग्विदिक्षु च सर्वत्र सर्वव्यापिनी
    लेखिनी । वज्ररेखापरिघृते रक्षेत् मां कुलमन्दिरे ॥ ३७॥ यन्त्रलेखमहाप्राची मन्त्रकीलनसंस्कृता । महापिशाचमन्त्रेभ्यो
    रक्षेत् मां सर्वदा विभुः ॥ ३८॥ जलमध्ये स्थलमध्ये च रणे राजकुले पथि । महाशैलतटे घोरे पातु मां कामरूपिणी
    ॥ ३९॥ विवादे शास्त्रचर्चायां सभायां शत्रुसङ्कटे । दन्तौष्ठकण्ठजिह्वासु पातु मां शारदा स्वयम् ॥ ४०॥
    अज्ञानात् ज्ञानतो वाऽपि यत् त्यक्तं कवचे मम । तत्स रक्षेत् महादेवी लेखिनी सर्वमङ्गला ॥ ४१॥ पादतलात्
    शिरो यावत् शिरसः पादतलकम् । वज्रकोटिसमं गात्रं पातु देवी निरन्तरम् ॥ ४२॥ कवचस्य फलश्रुतिः इत्येतत्कवचं
    दिव्यं वज्रपञ्जरमुत्तमम् । गुह्याद्गुह्यतरं तत्त्वं सर्वसौभाग्यदायकम् ॥ १॥ न देयं यस्य कस्यापि गोपितं
    कुलपुस्तके । यः पठेच्छ्रणुयाद्वापि त्रिसन्ध्यं नियतः शुचिः ॥ २॥ तस्य हस्तगता सिद्धिः साक्षाद्वागीश्वरो
    भवेत् । एतन्महाकवचं गुह्यं यो न जानाति मानवः ॥ ३॥ स जपेत् सततं मन्त्रं तस्य मन्त्रो न सिध्यति । सारस्वतं
    महामन्त्रं लेखिनीमन्त्रमुत्तमम् ॥ ४॥ दीक्षितोऽपि कुलाचारे कोटिकल्पैर्न विन्दति । कवचेन विना मर्त्यो
    मन्त्रजाप्यं करोति यः ॥ ५॥ तस्य भाग्यक्षयो याति मन्त्राश्च मलिनास्तथा । कोट कल्पं जपेद्वापि श्रम एव
    हि केवलम् ॥ ६॥ तस्मात्सर्वप्रयत्नेन कवचं प्रपठेत्पुरा । पश्चान्मन्त्रं जपेत्प्राज्ञः स साक्षाद् भैरवो
    भवेत् ॥ ७॥ रक्षाकामो महामर्त्यो यः कश्चिद् भुवि वर्तते । तेन न गन्तव्यं क्वापि कवचेन विना पदम् ॥ ८॥
    न पदैकं प्रगच्छेच्च न च गच्छेत् कदाचन । विना कवचपाठात्तु मार्गं नैव प्रविशेत् पुमान् ॥ ९॥ यदि गच्छेत्
    प्रमादेन मन्दबुद्धिः विमोहितः । तदैव तस्य विघ्नानि जायन्ते सर्वतोमुखम् ॥ १०॥ भूतप्रेतपिशाचाश्च डाकिन्यो
    यातुधानाः । रिपवः शस्त्रहस्ताश्च तं हिंसन्ति पदे पदे ॥ ११॥ तस्माद् गृहाद् विनिष्क्रान्ते कवचं धारयेत्
    पठेत् । तस्य पादयुगे नित्यं रक्षा तिष्ठति सर्वदा ॥ १२॥ षण्मासधारनादस्य वज्रकायो भवेन्नरः । न शस्त्रैर्भिद्यते
    गात्रं न चाग्निर्दहते कचित् ॥ १३॥ विषं स्थावरजङ्गमं कृत्रिमं चाभिचारिकम् । प्रशाम्येदमृतं याति कवचस्य
    प्रभावतः ॥ १४॥ यः पठेत् परमं दिव्यं स वशं नयते जगत् । राजानो राजपुत्राश्च नार्यश्च कुलजास्तथा ॥ १५॥
    तस्याधीना भवन्त्येव दासभूता निरन्तरम् । महोत्पाते च दुर्भिक्षे श्मशाने सङ्कटे तथा ॥ १६॥ कवचं संस्मरन्
    मर्त्यो ह्यक्षतो विजयान्वितः । लिखित्वा धारयेद्यस्तु कण्ठे वा दक्षिण भुजे ॥ १७॥ तस्य गेहे स्थिरा लक्ष्मीः
    वाणी च वदने वसेत् । इति ते कथितं गर्भ परकृष्णरहस्यकम् ॥ १८॥ भाग्यरेखाविशोधनं सर्वकारणकारणम् । न कालो
    बाधते तस्य न मृत्युः प्रभवत्यपि ॥ १९॥ चिन्मयः सुभगो लोके महाकीर्तिसमन्वितः । सर्वमार्गेषु मां पातु
    परकृष्णो जगन्मयः ॥ २०॥ इति सर्वसौभाग्यदायकं वज्रपञ्जर ब्रह्मलेखिनीकवचम् सम्पूर्णम् ।
