id: venkateshvarashatakam
category: shataka
name:
  english: venkateshvarashatakam
  devanagari: वेन्कटेश्वरशतकम्
content:
  english: shrautaradhanaradhitah sa satatam sheshadriranmamava || 84|| vedangapravirajamanagarudarudho'njasa
    gam gato vetandarti nivaranaya makaram cchittvarina yah svayam | vetandacalamastake varadarajakhyatanamna
    sthitah | sa tvam venkatanayakashritajanatrata bhavadya prabho || 85|| sitalakshmanamadhyabhagavilasanmurtya
    ghanashyamalah kodandena sa khanditamararipuh sarakshitaravandalah | rakshovanararajayoravarajau samrakshitau
    ca tvaya shrimadvenkatanayaka tvamadhuna bhadradriranmamava || 86|| yastvam shribalabhadraramasahitastvaddarshanayagatan
    dasamstan patitanapi trijagatam nathah subhadranvitah | kshetre shripurushottame sthitimagah patum
    prasadanmuda sa tvam venkatanayakadya kripanam niladriranmamava || 87|| smarami manasa shriya sakalalokamatra
    sthitam vadami vacasa bhuvapyakhilalokadhatrashritam | namami shirasa gurum trijagatam susamrakshakam
    sada paricaramyaham vrishagirishamishtapradam || 88|| kalaye satatam vrishashailapatim kalidoshaharam
    karunajaladhim | kamaniyavapuhkalitam saramam kamalalayavakshasamadhiharam || 89|| kamalayatakshamamalatmavaibhavam
    vimalambujasyamatulakhilamaram | tarasa namami shirasa ca venkatam manasa bhajami vacasa stavimyaham
    || 90|| shrimadvenkatanatha te yadi kripa dino dhanadhyo bhavet no cettadviparitavaniti budhah prahurvishishtadayah
    | raksham yasya karomi tasya kripaya vittam haramiti ya
  devanagari: श्रौताराधनराधितः स सततं शेषाद्रिराण्मामव ॥ ८४॥ वेदाङ्गप्रविराजमानगरुडारूढोऽञ्जसा गां गतो
    वेतण्डार्ति निवारणाय मकरं च्छित्त्वारिणा यः स्वयम् । वेतण्डाचलमस्तके वरदराजाख्यातनाम्ना स्थितः । स
    त्वं वेङ्कटनायकाश्रितजनत्राता भवाद्य प्रभो ॥ ८५॥ सीतालक्ष्मणमध्यभागविलसन्मूर्त्या घनश्यामलः कोदण्डेन
    स खण्डितामररिपुः सरक्षितारवण्डलः । रक्षोवानरराजयोरवरजौ संरक्षितौ च त्वया श्रीमद्वेङ्कटनायक त्वमधुना
    भद्राद्रिराण्मामव ॥ ८६॥ यस्त्वं श्रीबलभद्ररामसहितस्त्वद्दर्शनायागतान् दासांस्तान् पतितानपि त्रिजगतां
    नाथः सुभद्रान्वितः । क्षेत्रे श्रीपुरुषोत्तमे स्थितिमगाः पातुं प्रसादान्मुदा स त्वं वेङ्कटनायकाद्य
    कृपणं नीलाद्रिराण्मामव ॥ ८७॥ स्मरामि मनसा श्रिया सकललोकमात्रा स्थितं वदामि वचसा भुवाप्यखिललोकधात्राश्रितम्
    । नमामि शिरसा गुरुं त्रिजगतां सुसंरक्षकं सदा परिचराम्यहं वृषगिरीशमिष्टप्रदम् ॥ ८८॥ कलये सततं वृषशैलपतिं
    कलिदोषहरं करुणाजलधिम् । कमनीयवपुःकलितं सरमं कमलालयवक्षसमाधिहरम् ॥ ८९॥ कमलायताक्षममलात्मवैभवं विमलाम्बुजास्यमतुलाखिलामरम्
    । तरसा नमामि शिरसा च वेङ्कटं मनसा भजामि वचसा स्तवीम्यहम् ॥ ९०॥ श्रीमद्वेङ्कटनाथ ते यदि कृपा दीनो धनाढ्यो
    भवेत् नो चेत्तद्विपरीतवानिति बुधाः प्राहुर्विशिष्टादयः । रक्षां यस्य करोमि तस्य कृपया वित्तं हरामीति
    य
