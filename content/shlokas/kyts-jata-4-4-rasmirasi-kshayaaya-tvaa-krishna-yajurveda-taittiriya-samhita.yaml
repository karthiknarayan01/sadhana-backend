    । ऊ॒त्या पृ॒ष्टः पृ॒ष्ट ऊ॒त्योत्या पृ॒ष्टः । पृ॒ष्टो दि॒वि दि॒वि पृ॒ष्टः पृ॒ष्टो दि॒वि । दि॒व्यन्
    वनु॑ दि॒वि दि॒व्यनु॑ । अनु॑ नो नो॒ अन्वनु॑ नः । नो॒ ऽद्याद्य नो॑ नो॒ ऽद्य । अ॒द्या नु॑मति॒ रनु॑मति
    र॒द्याद्या नु॑मतिः । अनु॑मति॒ रन्वन्व नु॑मति॒ रनु॑मति॒ रनु॑ । अन्वि दिदन् वन्वित् । इद॑नुमते ऽनुमत॒
    इदि द॑नुमते । न्त्व म॑नुमते ऽनुमते॒ त्वम् । कया॑ नो नः॒ कया॒ कया॑ नः । न॒ श्चि॒त्र श्चि॒त्रो नो॑ नश्चि॒त्रः
    । चि॒त्र आ चि॒त्र श्चि॒त्र आ । को अ॒द्याद्य कः को अ॒द्य । अ॒द्य यु॑ङ्क्ते युङ्क्ते अ॒द्याद्य यु॑ङ्क्ते
    । यु॒ङ्क्त॒ इति॑ युङ्क्ते । ॥
