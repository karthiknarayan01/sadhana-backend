id: dakshakritam4shivastotram
category: stotram
name:
  english: dakshakritam4shivastotram
  devanagari: दक्षकृतं४शिवस्तोत्रम्
content:
  english: dakshakritam 4 shivastotram daksha uvaca | namami devam varadam varenyam namami deveshvaram
    sanatanam | namami devadhipamishvaram haram namami shambhum jagadekabandhum || 36|| namami vishveshvaravishvarupam
    sanatanam brahma nijatmarupam | namami sarvam nijabhavabhavam varam varenyam satatam nato'smi || 37||
    iti shriskandapurane maheshvarakhande
  devanagari: दक्षकृतं ४ शिवस्तोत्रम् दक्ष उवाच । नमामि देवं वरदं वरेण्यं नमामि देवेश्वरं सनातनम् । नमामि
    देवाधिपमीश्वरं हरं नमामि शम्भुं जगदेकबन्धुम् ॥ ३६॥ नमामि विश्वेश्वरविश्वरूपं सनातनं ब्रह्म निजात्मरूपम्
    । नमामि सर्वं निजभावभावं वरं वरेण्यं सततं नतोऽस्मि ॥ ३७॥ इति श्रीस्कन्दपुराणे माहेश्वरखण्डे
meaning: {}
