id: sri-chinnamasta-ashtottara-satanama-stotram
category: stotram
name:
  english: Sri Chinnamasta Ashtottara Satanama Stotram
content:
  english: shri parvatyuvaca namnam sahasram paramam chinnamastapriyam shubham | kathitam bhavata shambhossadyashshatrunikrintanam
    || || punah pricchamyaham deva kripam kuru mamopari | sahasranamapathe ca ashakto yah puman bhavet
    || || tena kim pathyate natha tanme bruhi kripamaya | shri sadashiva uvaca ashtottarashatam namnam
    pathyate tena sarvada || || sahasranamapathasya phalam prapnoti nishcitam | om asya shrichinnamastadevyashtottara
    shatanama stotramahamantrasya sadashiva rishih anushtup chandah shrichinnamasta devata mama sakalasiddhi
    praptaye jape viniyogah || om chinnamasta mahavidya mahabhima mahodari | candeshvari candamata candamundaprabhanjini
    || || mahacanda candarupa candika candakhandini | krodhini krodhajanani krodharupa kuhuh kala || ||
    kopatura kopayuta kopasamharakarini | vajravairocani vajra vajrakalpa ca dakini || || dakinikarmanirata
    dakinikarmapujita | dakinisanganirata dakinipremapurita || || khatvangadharini kharva khadgakharparadharini
    | pretasana pretayuta pretasangaviharini || || chinnamundadhara chinnacandavidya ca citrini | ghorarupa
    ghoradrishtih ghorarava ghanodari || || yogini yoganirata japayajnaparayana | yonicakramayi yoniryonicakrapravartini
    || || yonimudra yonigamya yoniyantranivasini | yantrarupa yantramayi yantreshi yantrapujita || ||
    kirtya kapardini kali kankali kalakarini | arakta raktanayana raktapanaparayana || || bhavani bhutida
    bhutirbhutidhatri ca bhairavi | bhairavacaranirata bhutabhairavasevita || || bhima bhimeshvari devi
    bhimanadaparayana | bhavaradhya bhavanuta bhavasagaratarini || || bhadrakali bhadratanurbhadrarupa
    ca bhadrika | bhadrarupa mahabhadra subhadra bhadrapalini || || subhavya bhavyavadana sumukhi siddhasevita
    | siddhida siddhinivaha siddha siddhanishevita || || shubhada shubhaga shuddha shuddhasattva shubhavaha
    | shreshtha drishtimayi devi drishtisamharakarini || || sharvani sarvaga sarva sarvamangalakarini
    | shiva shanta shantirupa mridani madanatura || || iti te kathitam devi stotram paramadurlabham |
    guhyadguhyataram gopyam gopaniyam prayatnatah || || kimatra bahunoktena tvadagre pranavallabhe | maranam
    mohanam devi hyuccatanamatah param || || stambhanadikakarmani riddhayassiddhayo'pi ca | trikalapathanadasya
    sarve siddhyantyasamshayah || || mahottamam stotramidam varanane mayeritam nityamananyabuddhayah |
    pathanti ye bhaktiyuta narottama bhavenna tesham ripubhih parajayah || || iti shrichinnamastadevyashtottarashatanama
    stotram ||
  devanagari: श्री पार्वत्युवाच नाम्नां सहस्रं परमं छिन्नमस्ताप्रियं शुभम् । कथितं भवता शम्भोस्सद्यश्शत्रुनिकृन्तनम्
    ॥ ॥ पुनः पृच्छाम्यहं देव कृपां कुरु ममोपरि । सहस्रनामपाठे च अशक्तो यः पुमान् भवेत् ॥ ॥ तेन किं पठ्यते
    नाथ तन्मे ब्रूहि कृपामय । श्री सदाशिव उवाच अष्टोत्तरशतं नाम्नां पठ्यते तेन सर्वदा ॥ ॥ सहस्रनामपाठस्य
    फलं प्राप्नोति निश्चितम् । ॐ अस्य श्रीछिन्नमस्तादेव्यष्टोत्तर शतनाम स्तोत्रमहामन्त्रस्य सदाशिव ऋषिः
    अनुष्टुप् छन्दः श्रीछिन्नमस्ता देवता मम सकलसिद्धि प्राप्तये जपे विनियोगः ॥ ॐ छिन्नमस्ता महाविद्या
    महाभीमा महोदरी । चण्डेश्वरी चण्डमाता चण्डमुण्डप्रभञ्जिनी ॥ ॥ महाचण्डा चण्डरूपा चण्डिका चण्डखण्डिनी
    । क्रोधिनी क्रोधजननी क्रोधरूपा कुहूः कला ॥ ॥ कोपातुरा कोपयुता कोपसंहारकारिणी । वज्रवैरोचनी वज्रा वज्रकल्पा
    च डाकिनी ॥ ॥ डाकिनीकर्मनिरता डाकिनीकर्मपूजिता । डाकिनीसङ्गनिरता डाकिनीप्रेमपूरिता ॥ ॥ खट्वाङ्गधारिणी
    खर्वा खड्गखर्परधारिणी । प्रेतासना प्रेतयुता प्रेतसङ्गविहारिणी ॥ ॥ छिन्नमुण्डधरा छिन्नचण्डविद्या च
    चित्रिणी । घोररूपा घोरदृष्टिः घोररावा घनोदरी ॥ ॥ योगिनी योगनिरता जपयज्ञपरायणा । योनिचक्रमयी योनिर्योनिचक्रप्रवर्तिनी
    ॥ ॥ योनिमुद्रा योनिगम्या योनियन्त्रनिवासिनी । यन्त्ररूपा यन्त्रमयी यन्त्रेशी यन्त्रपूजिता ॥ ॥ कीर्त्या
    कपर्दिनी काली कङ्काली कलकारिणी । आरक्ता रक्तनयना रक्तपानपरायणा ॥ ॥ भवानी भूतिदा भूतिर्भूतिधात्री च
    भैरवी । भैरवाचारनिरता भूतभैरवसेविता ॥ ॥ भीमा भीमेश्वरी देवी भीमनादपरायणा । भवाराध्या भवनुता भवसागरतारिणी
    ॥ ॥ भद्रकाली भद्रतनुर्भद्ररूपा च भद्रिका । भद्ररूपा महाभद्रा सुभद्रा भद्रपालिनी ॥ ॥ सुभव्या भव्यवदना
    सुमुखी सिद्धसेविता । सिद्धिदा सिद्धिनिवहा सिद्धा सिद्धनिषेविता ॥ ॥ शुभदा शुभगा शुद्धा शुद्धसत्त्वा
    शुभावहा । श्रेष्ठा दृष्टिमयी देवी दृष्टिसंहारकारिणी ॥ ॥ शर्वाणी सर्वगा सर्वा सर्वमङ्गलकारिणी । शिवा
    शान्ता शान्तिरूपा मृडानी मदानतुरा ॥ ॥ इति ते कथितं देवी स्तोत्रं परमदुर्लभम् । गुह्याद्गुह्यतरं गोप्यं
    गोपनियं प्रयत्नतः ॥ ॥ किमत्र बहुनोक्तेन त्वदग्रे प्राणवल्लभे । मारणं मोहनं देवि ह्युच्चाटनमतः परम्
    ॥ ॥ स्तम्भनादिककर्माणि ऋद्धयस्सिद्धयोऽपि च । त्रिकालपठनादस्य सर्वे सिद्ध्यन्त्यसंशयः ॥ ॥ महोत्तमं
    स्तोत्रमिदं वरानने मयेरितं नित्यमनन्यबुद्धयः । पठन्ति ये भक्तियुता नरोत्तमा भवेन्न तेषां रिपुभिः पराजयः
    ॥ ॥ इति श्रीछिन्नमस्तादेव्यष्टोत्तरशतनाम स्तोत्रम् ॥
