id: shrikrishnanamavalih
category: stotram
name:
  english: shrikrishnanamavalih
  devanagari: श्रीकृष्णनामावलिः
content:
  english: shrikrishnanamavalih shrikrishnah saccidanando vasudevatmasambhavah | devakigarbhasambhuto
    yashodanandanandanah || 1|| putanajivitaharah shakatadhvamsakarakah | trinavartapranaharta mukhe vishvapradarshakah
    || 2|| ulukhalanibaddhashca yamalarjunabhanjanah | vatsasurantakarano bakasuravinashakah || 3|| aghaghahrinnaikagopabalavatsasvarupabhrit
    | iti | om shrikrishnaya namah | om saccidanandaya namah | om vasudevatmasambhavaya namah | om devakigarbhasambhutaya
    namah | om yashodanandanandanaya namah | om putanajivitaharaya namah | om shakatadhvamsakarakaya namah
    | om trinavartapranaharta namah | om mukhe vishvapradarshakaya namah | om ulukhalanibaddhaya namah
    | om yamalarjunabhanjanaya namah | om vatsasurantakaranaya namah | om bakasuravinashakaya namah |
    om aghaghaya namah | om hrit anekagopabalavatsasvarupabhrite namah | 15 iti shrimayurakrita shrikrishnanamavalih
    samapta |
  devanagari: श्रीकृष्णनामावलिः श्रीकृष्णः सच्चिदानन्दो वसुदेवात्मसम्भवः । देवकीगर्भसम्भूतो यशोदानन्दनन्दनः
    ॥ १॥ पूतनाजीवितहरः शकटध्वंसकारकः । तृणावर्तप्राणहर्ता मुखे विश्वप्रदर्शकः ॥ २॥ उलूखलनिबद्धश्च यमलार्जुनभञ्जनः
    । वत्सासुरान्तकरणो बकासुरविनाशकः ॥ ३॥ अघाघहृन्नैकगोपबालवत्सस्वरूपभृत् । इति । ॐ श्रीकृष्णाय नमः ।
    ॐ सच्चिदानन्दाय नमः । ॐ वसुदेवात्मसम्भवाय नमः । ॐ देवकीगर्भसम्भूताय नमः । ॐ यशोदानन्दनन्दनाय नमः ।
    ॐ पूतनाजीवितहराय नमः । ॐ शकटध्वंसकारकाय नमः । ॐ तृणावर्तप्राणहर्ता नमः । ॐ मुखे विश्वप्रदर्शकाय नमः
    । ॐ उलूखलनिबद्धाय नमः । ॐ यमलार्जुनभञ्जनाय नमः । ॐ वत्सासुरान्तकरणाय नमः । ॐ बकासुरविनाशकाय नमः ।
    ॐ अघाघाय नमः । ॐ हृत् अनेकगोपबालवत्सस्वरूपभृते नमः । १५ इति श्रीमयूरकृता श्रीकृष्णनामावलिः समाप्ता
    ।
