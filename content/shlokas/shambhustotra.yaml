id: shambhustotra
category: stotram
name:
  english: shambhustotra
  devanagari: शम्भुस्तोत्र
content:
  english: saktastadvashagah svadharmavimukhah sadbhih sada dushitah | karmakarshamaparanarakaphalam saukhyashaya
    durmatih trahi tvam karunatarangitadrisha shambho dayambhonidhe || 3|| vriddhatve galitakhilendriyabalo
    vibhrashtadantavalih shvetibhutashirah sujarjaratanuh kampashrayo'nashrayah | lalocchishtapurishamutrasalilaklinno'smi
    dino'smyaham trahi tvam karunatarangitadrisha shambho dayambhonidhe || 4|| dhyatam te padambujam sakridapi
    dhyatam dhanam sarvada puja te na krita krita svavapushah straggandhaleparcanaih | nannadyaih paritarpita
    dvijavara jihvaiva santarpita papishthena maya sadashiva vibho shambho dayambhonidhe || 5|| sandhyasnanajapadi
    karma na kritam bhaktya kritam dushkritam tvannamesha na kirtitam tvatimuda durbhashitam bhashitam
    | tvanmurtirna vilokita punarapi strimurtiralokita bhogasaktimata maya shiva vibho shambho dayambhonidhe
    || 6|| sandhyadhyanajapadikarmakarane shakto'smi naiva prabho datum hanta matim pratipakarane daradibandhaspade
    | namaikam tava tarakam mama vibho hyanyanna casti kvacit trahi tvam karunatarangitadrisha shambho
    dayambhonidhe || 7|| kumbhipakadhurandharadishu mahabijadishu proddhatam ghoram narakaduhkhamishadapi
    va sodhum na shakto'smyaham | tasmat tvam sharanam vrajami satatam janami na tvam vina trahi tvam
    karunatarangitadrisha shambho dayambhonidhe || 8|| mata vapi pita suto'pi na hito bhratradayo bandhavah
    sarve svarthapara bhavanti khalu mam tratum na ke'pi kshamah | dutebhyo yamacoditebhya iha tu tvamantara
    shankara trahi tvam karunatarangitadrisha shambho dayambhonidhe || 9|| || iti shambhustotram sampurnam
    ||
  devanagari: सक्तस्तद्वशगः स्वधर्मविमुखः सद्भिः सदा दूषितः । कर्माकार्षमपारनारकफलं सौख्याशया दुर्मतिः
    त्राहि त्वं करुणातरङ्गितदृशा शम्भो दयाम्भोनिधे ॥ ३॥ वृद्धत्वे गलिताखिलेन्द्रियबलो विभ्रष्टदन्तावलिः
    श्वेतीभूतशिराः सुजर्जरतनुः कम्पाश्रयोऽनाश्रयः । लालोच्छिष्टपुरीषमूत्रसलिलक्लिन्नोऽस्मि दीनोऽस्म्यहं
    त्राहि त्वं करुणातरङ्गितदृशा शम्भो दयाम्भोनिधे ॥ ४॥ ध्यातं ते पदाम्बुजं सकृदपि ध्यातं धनं सर्वदा पूजा
    ते न कृता कृता स्ववपुषः स्त्रग्गन्धलेपार्चनैः । नान्नाद्यैः परितर्पिता द्विजवरा जिह्वैव सन्तर्पिता
    पापिष्ठेन मया सदाशिव विभो शम्भो दयाम्भोनिधे ॥ ५॥ सन्ध्यास्नानजपादि कर्म न कृतं भक्त्या कृतं दुष्कृतं
    त्वन्नामेश न कीर्तितं त्वतिमुदा दुर्भाषितं भाषितम् । त्वन्मूर्तिर्न विलोकिता पुनरपि स्त्रीमूर्तिरालोकिता
    भोगासक्तिमता मया शिव विभो शम्भो दयाम्भोनिधे ॥ ६॥ सन्ध्याध्यानजपादिकर्मकरणे शक्तोऽस्मि नैव प्रभो दातुं
    हन्त मतिं प्रतीपकरणे दारादिबन्धास्पदे । नामैकं तव तारकं मम विभो ह्यन्यन्न चास्ति क्वचित् त्राहि त्वं
    करुणातरङ्गितदृशा शम्भो दयाम्भोनिधे ॥ ७॥ कुम्भीपाकधुरन्धरादिषु महाबीजादिषु प्रोद्धतं घोरं नारकदुःखमीषदपि
    वा सोढुं न शक्तोऽस्म्यहम् । तस्मात् त्वां शरणं व्रजामि सततं जानामि न त्वां विना त्राहि त्वं करुणातरङ्गितदृशा
    शम्भो दयाम्भोनिधे ॥ ८॥ माता वापि पिता सुतोऽपि न हितो भ्रात्रादयो बान्धवाः सर्वे स्वार्थपरा भवन्ति
    खलु मां त्रातुं न केऽपि क्षमाः । दूतेभ्यो यमचोदितेभ्य इह तु त्वामन्तरा शङ्कर त्राहि त्वं करुणातरङ्गितदृशा
    शम्भो दयाम्भोनिधे ॥ ९॥ ॥ इति शम्भुस्तोत्रं सम्पूर्णम् ॥
