id: ratnamalastotram
category: stotram
name:
  english: ratnamalastotram
  devanagari: रत्नमालास्तोत्रम्
content:
  english: ratnamalastotram vimalashunyakripardracittam margajnataprathitadeshanayarthavacam | sarvajnatadiparipurnavishuddhadeham
    jnanadhikaralalitam shirasa namami || 1|| vaineyabhedavashato bahudhavabhasaireko'pi patragajaleshu
    shashiva yasmat | samlakshase parahitanugataiva tasmad buddhistvaho paramavismayaniyarupa || 2|| sampurnacandravadane
    lalito lalatadeshadvinirgatamaheshvaradevaputrah | vaineyashambhavajanapratibodhanartham devadhidevapratimanuja
    ishvarastvam || 3|| vaineyakomalabhavapratibodhanaya kim dhama sambhrita mahashubhalakshanam te |
    niryata eva hi pitamahadevapujam lokeshvareshvaraparam shirasa namami || 4|| vaineyavaishnavajanapratibodhanaya
    rajivapanihridayat pratinihsrito'sau | narayano'pi bhuvaneshvara eva tasmat pumsam tvameva paramottama
    eva nanyah || 5|| candrarkasadarabalahitabhaktibhajam sandarshanarthamibhanilasulocanabhyam | yannihsritau
    shashiravi bhuvi locanabhyam dhvastantaralatamasam tamaham namami || 6|| sarasvativinayayojitabhaktibhajam
    bodhaya vai bhagavatiha sarasvatiyam | drishtagratastava jinatmajapaprasuta prajnabhilashiphaladam
    tamaham namami || 7|| vaineyavayujanitaksharamargasiddhyai yo lokanatha sugato'tha vinihsrito'sau
    | devah samiranavaro bhuvi janmabhajamiryapatharthaphaladam tamaham namami || 8|| vaineyavarunashivayanamipsitanam
    sambodhanarthamudaratsugatatmajanam | yannihsrito varunadevavaro'pyakasmadaishvaryasiddhi phaladam
    tamaham namami || 9|| vaineyasammataphaladyabhilashino vai samsiddhaye pravaralakshanapadapadme |
    yannihsrita bhagavati dharani prasiddha trailokyanathamasamam satatam namami || 10|| samsaramuktamapi
    susthitameva tatra karunyatashca bhavacarini sattvavarge | bhuyat sthitirmama sadasthirasa bhavantamevam
    mahashayavaram paramam namami || 11|| ekena padatalakena bhavatsvakena cakrantasamvaramanantaralokadhatau
    | kalpantadagdhabhuvane jvalitogravahnirnihshvasavayubalatastava nirvritah syat || 12|| svam tarjanim
    mukhadhrito'hitatarjanena sancalitashca bahumerugana nakhasya | koshoddhritam jaladhitoyamasheshatah
    syat samarthyamidrishamaho bhavatah kuto'nyat || 13|| kvedam ca shaishavaparam nanu carurupam sandarshaniyavarakomalabalacandram
    | durvaramaramathanam ca mayaikasahyam vikrantaduhsahaparam kva ca ceshtitam te || 14|| esha batanjananibhorujanavali
    sa kautilyacaruvikata svashiroruhagre | kleshendhane jvalitavisphuritatvavahne
  devanagari: रत्नमालास्तोत्रम् विमलशून्यकृपार्द्रचित्तं मार्गज्ञताप्रथितदेशनयार्थवाचम् । सर्वज्ञतादिपरिपूर्णविशुद्धदेहं
    ज्ञानाधिकारललितं शिरसा नमामि ॥ १॥ वैनेयभेदवशतो बहुधावभासैरेकोऽपि पात्रगजलेषु शशीव यस्मात् । संलक्षसे
    परहितानुगतैव तस्माद् बुद्धिस्त्वहो परमविस्मयनीयरूपा ॥ २॥ सम्पूर्णचन्द्रवदने ललितो ललाटदेशाद्विनिर्गतमहेश्वरदेवपुत्रः
    । वैनेयशाम्भवजनप्रतिबोधनार्थं देवाधिदेवप्रतिमानुज ईश्वरस्त्वम् ॥ ३॥ वैनेयकोमलभवप्रतिबोधनाय किं धाम
    सम्भृत महाशुभलक्षणं ते । निर्यात एव हि पितामहदेवपूजां लोकेश्वरेश्वरपरं शिरसा नमामि ॥ ४॥ वैनेयवैष्णवजनप्रतिबोधनाय
    राजीवपाणिहृदयात् प्रतिनिःसृतोऽसौ । नारायणोऽपि भुवनेश्वर एव तस्मात् पुंसां त्वमेव परमोत्तम एव नान्यः
    ॥ ५॥ चन्द्रार्कसादरबलाहितभक्तिभाजां सन्दर्शनार्थमिभनीलसुलोचनाभ्याम् । यन्निःसृतौ शशिरवी भुवि लोचनाभ्यां
    ध्वस्तान्तरालतमसं तमहं नमामि ॥ ६॥ सारस्वतीविनययोजितभक्तिभाजां बोधाय वै भगवतीह सरस्वतीयम् । दृष्टाग्रतस्तव
    जिनात्मजपप्रसूता प्रज्ञाभिलाषिफलदं तमहं नमामि ॥ ७॥ वैनेयवायुजनिताक्षरमार्गसिद्ध्यै यो लोकनाथ सुगतोऽथ
    विनिःसृतोऽसौ । देवः समीरणवरो भुवि जन्मभाजामीर्यापथार्थफलदं तमहं नमामि ॥ ८॥ वैनेयवारुणशिवायनमीप्सितानां
    सम्बोधनार्थमुदरात्सुगतात्मजानाम् । यन्निःसृतो वरुणदेववरोऽप्यकस्मादैश्वर्यसिद्धि फलदं तमहं नमामि ॥
    ९॥ वैनेयसम्मतफलाद्यभिलाषिणो वै संसिद्धये प्रवरलक्षणपादपद्मे । यन्निःसृता भगवती धरणी प्रसिद्धा त्रैलोक्यनाथमसमं
    सततं नमामि ॥ १०॥ संसारमुक्तमपि सुस्थितमेव तत्र कारुण्यतश्च भवचारिणि सत्त्ववर्गे । भूयात् स्थितिर्मम
    सदास्थिरसा भवन्तमेवं महाशयवरं परमं नमामि ॥ ११॥ एकेन पादतलकेन भवत्स्वकेन चक्रान्तसंवरमनन्तरलोकधातौ
    । कल्पान्तदग्धभुवने ज्वलितोग्रवह्निर्निःश्वासवायुबलतस्तव निर्वृतः स्यात् ॥ १२॥ स्वां तर्जनीं मुखधृतोऽहिततर्जनेन
    सञ्चालिताश्च बहुमेरुगणा नखस्य । कोषोद्धृतं जलधितोयमशेषतः स्यात् सामर्थ्यमीदृशमहो भवतः कुतोऽन्यत् ॥
    १३॥ क्वेदं च शैशवपरं ननु चारुरूपं सन्दर्शनीयवरकोमलबालचन्द्रम् । दुर्वारमारमथनं च मयैकसह्यं विक्रान्तदुःसहपरं
    क्व च चेष्टितं ते ॥ १४॥ एषा बताञ्जननिभोरुजनावली सा कौटिल्यचारुविकटा स्वशिरोरुहाग्रे । क्लेशेन्धने
    ज्वलितविस्फुरितत्ववह्ने
