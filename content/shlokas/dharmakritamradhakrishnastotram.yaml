id: dharmakritamradhakrishnastotram
category: stotram
name:
  english: dharmakritamradhakrishnastotram
  devanagari: धर्मकृतंराधाकृष्णस्तोत्रम्
content:
  english: dharmakritam radhakrishnastotram dharma uvaca | matarjanihi mam dharmam dharmajnanam gurorgurum
    | parastrimatribuddhim ca kurvantam santatam sati || 19|| aham tavantarvijnatumagatastava sannidhim
    | yushmakam ca mano jane tathapi daivabodhitah || 20|| kritam me damanam sadhvi na viruddham yathocitam
    | shastih samutpathasthanamishvarena vinirmita || 21|| dharmam svadharmam vijnatum kalam kalayitum
    kshamah | vidhataram samvidhatum tasmai krishnaya te namah || 22|| samhartum yah kshamah kale samhartaram
    bhavam vibhuh | srashtaram lilaya srashtum tasmai krishnaya te namah || 23|| shatrum vidhatum mitram
    ca supritim kalaham kshamah | srashtum nashtum tadevam ca tasmai krishnaya te namah || 24|| shapam
    pradatum sarvashca sukhaduhkhavarankshamah | sampadam vipadam yo hi tasmai krishnaya te namah || 25||
    prakritirnirmita yena mahavishnushca nirmitah | brahmavishnumaheshadyastasmai krishnaya te namah ||
    26|| yena shuklikritam kshiram jalam shitam kritam pura | dahikrito hutashashca tasmai krishnaya te
    namah || 27|| atitejah samutthaya tejorupaya murttaye | gunashreshtha nirgunaya tasmai krishnaya te
    namah || 28|| sarvasmai sarvabijaya sarveshamantaratmane | sarvabandhusvarupaya tasmai krishnaya te
    namah || 29|| ityuktva puratastasyastasthau dharmo jagadguruh || iti shribrahmavaivartapurane shrikrishnajanmakhande
    purve dvatrimshadhyayantargatam dharmakritam radhakrishnastotram samaptam | brahmavaivartapurana |
    shrikrishnajanma
  devanagari: धर्मकृतं राधाकृष्णस्तोत्रम् धर्म उवाच । मातर्जानीहि मां धर्मं धर्मज्ञानां गुरोर्गुरुम् ।
    परस्त्रीमातृबुद्धिं च कुर्वन्तं सन्ततं सति ॥ १९॥ अहं तवान्तर्विज्ञातुमागतस्तव सन्निधिम् । युष्माकं
    च मनो जाने तथापि दैवबोधितः ॥ २०॥ कृतं मे दमनं साध्वि न विरुद्धं यथोचितम् । शास्तिः समुत्पथस्थानामीश्वरेण
    विनिर्मिता ॥ २१॥ धर्मं स्वधर्मं विज्ञातुं कालं कलयितुं क्षमः । विधातारं संविधातुं तस्मै कृष्णाय ते
    नमः ॥ २२॥ संहर्तुं यः क्षमः काले संहर्तारं भवं विभुः । स्रष्टारं लीलया स्रष्टुं तस्मै कृष्णाय ते नमः
    ॥ २३॥ शत्रुं विधातुं मित्रं च सुप्रीतिं कलहं क्षमः । स्रष्टुं नष्टुं तदेवं च तस्मै कृष्णाय ते नमः
    ॥ २४॥ शापं प्रदातुं सर्वाश्च सुखदुःखवरान्क्षमः । सम्पदं विपदं यो हि तस्मै कृष्णाय ते नमः ॥ २५॥ प्रकृतिर्निर्मिता
    येन महाविष्णुश्च निर्मितः । ब्रह्मविष्णुमहेशाद्यास्तस्मै कृष्णाय ते नमः ॥ २६॥ येन शुक्लीकृतं क्षीरं
    जलं शीतं कृतं पुरा । दाहीकृतो हुताशश्च तस्मै कृष्णाय ते नमः ॥ २७॥ अतितेजः समुत्थाय तेजोरूपाय मूर्त्तये
    । गुणश्रेष्ठ निर्गुणाय तस्मै कृष्णाय ते नमः ॥ २८॥ सर्वस्मै सर्वबीजाय सर्वेषामन्तरात्मने । सर्वबन्धुस्वरूपाय
    तस्मै कृष्णाय ते नमः ॥ २९॥ इत्युक्त्वा पुरतस्तस्यास्तस्थौ धर्मो जगद्गुरुः ॥ इति श्रीब्रह्मवैवर्तपुराणे
    श्रीकृष्णजन्मखण्डे पूर्वे द्वात्रिंशाध्यायान्तर्गतं धर्मकृतं राधाकृष्णस्तोत्रं समाप्तम् । ब्रह्मवैवर्तपुराण
    । श्रीकृष्णजन्म
