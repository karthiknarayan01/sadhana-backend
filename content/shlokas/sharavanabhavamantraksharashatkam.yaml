id: sharavanabhavamantraksharashatkam
category: mantra
name:
  english: sharavanabhavamantraksharashatkam
  devanagari: शरवनभवमन्त्राक्षरषट्कम्
content:
  english: shrisharavanabhavamantraksharashatkam om shriganeshaya namah | shaktisvarupaya sharodbhavaya
    shakrarcitayatha shacistutaya | shamaya shambhupranavarthadaya shakararupaya namo guhaya || 1|| rananmaniprojjvalamekhalaya
    ramasanathapranavarthadaya | ratishapujyaya raviprabhaya rakararupaya namo guhaya || 2|| varaya varnashramarakshakaya
    varatrishulabhayamanditaya | valarikanyasukritalayaya vakararupaya namo guhaya || 3|| nagendrakanyeshvaratattvadaya
    nagadhirudhaya nagarcitaya | nagasuraghnaya nagalayaya nakararupaya namo guhaya || 4|| bhavaya bhargaya
    bhavatmajaya bhasmayamanadbhutavigrahaya | bhakteshtakamapradakalpakaya bhakararupaya namo guhaya
    || 5|| vallivalaratisutarcitaya varangaragancitavigrahaya | vallikarambhoruhamarditaya vakararupaya
    namo guhaya || 6|| iti shrisharavanabhavamantraksharashatkam sampurnam || iti shivam ||
  devanagari: श्रीशरवनभवमन्त्राक्षरषट्कम् ॐ श्रीगणेशाय नमः । शक्तिस्वरूपाय शरोद्भवाय शक्रार्चितायाथ शचीस्तुताय
    । शमाय शम्भुप्रणवार्थदाय शकाररूपाय नमो गुहाय ॥ १॥ रणन्मणिप्रोज्ज्वलमेखलाय रमासनाथप्रणवार्थदाय । रतीशपूज्याय
    रविप्रभाय रकाररूपाय नमो गुहाय ॥ २॥ वराय वर्णाश्रमरक्षकाय वरत्रिशूलाभयमण्डिताय । वलारिकन्यासुकृतालयाय
    वकाररूपाय नमो गुहाय ॥ ३॥ नगेन्द्रकन्येश्वरतत्त्वदाय नगाधिरूढाय नगार्चिताय । नगासुरघ्नाय नगालयाय नकाररूपाय
    नमो गुहाय ॥ ४॥ भवाय भर्गाय भवात्मजाय भस्मायमानाद्भुतविग्रहाय । भक्तेष्टकामप्रदकल्पकाय भकाररूपाय नमो
    गुहाय ॥ ५॥ वल्लीवलारातिसुतार्चिताय वराङ्गरागाञ्चितविग्रहाय । वल्लीकराम्भोरुहमर्दिताय वकाररूपाय नमो
    गुहाय ॥ ६॥ इति श्रीशरवनभवमन्त्राक्षरषट्कं सम्पूर्णम् ॥ इति शिवम् ॥
