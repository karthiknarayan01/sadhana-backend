id: sarasvatikavacamdevibhagavatam
category: kavacha
name:
  english: sarasvatikavacamdevibhagavatam
  devanagari: सरस्वतीकवचम्देवीभागवतम्
content:
  english: rinu narada vakshyami kanvashakhoktapaddhatim | jaganmatuh sarasvatyah pujavidhisamanvitam
    || 32|| maghasya shuklapancamyam vidyarambhadine'pi ca | purve'hni samayam kritva tatrahni samyatah
    shucih || 33|| snatva nityakriyah kritva ghatam samsthapya bhaktitah | svashakhoktavidhanena tantrikenathava
    punah || 34|| ganesham purvamabhyarcya tato'bhishtam prapujayet | dhyanena vakshyamanena dhyatva bahyaghate
    dhruvam || 35|| dhyatva punah shodashopacarena pujayed vrati | pujopayuktam naivedyam yacca vedanirupitam
    || 36|| vakshyami saumya tatkincidyathadhitam yathagamam | navanitam dadhi kshiram lajamshca tilaladdukam
    || 37|| ikshumikshurasam shuklavarnam pancagudam madhu | svastikam sharkaram shukladhanyasyakshatamakshatam
    || 38|| acchinnashukladhanyasya prithukam shuklamodakam | ghritasaindhavasamyuktam havishyannam yathoditam
    || 39|| yavagodhumacurnanam pishtakam ghritasamyutam | pishtakam svastikasyapi pakvarambhaphalasya
    ca || 40|| paramannam ca saghritam mishtannam ca sudhopamam | narikelam tadudakam kaserum mulamardrakam
    || 41|| pakvarambhaphalam caru shriphalam badariphalam | kaladeshodbhavam caru phalam shuklam ca samskatam
    || 42|| sugandham shuklapushpam ca sugandham shuklacandanam | navinam shuklavastram ca shankham ca
    sundaram mune || 43|| malyam ca shuklapushpanam shuklaharam ca bhushanam | yadrisham ca shrutau dhyanam
    prashasyam shrutisundaram || 44|| tannibodha mahabhaga bhramabhanjanakaranam | sarasvatim shuklavarnam
    sasmitam sumanoharam || 45|| koticandraprabhamushtapushtashriyuktavigraham | vahnishuddhamshukadhanam
    vinapustakadharinim || 46|| ratnasarendranirmananavabhushanabhushitam | supujitam suraganairbrahmavishnushivadibhih
    || 47|| vande bhaktya vanditam ca munindramanumanavaih | evam dhyatva ca mulena sarvam dattva vicakshanah
    || 48|| samstuya kavacam dhritva pranameddandavadbhuvi | yesham ceyamishtadevi tesham nityakriya mune
    || 49|| vidyarambhe ca varshante sarvesham pancamidine | sarvopayuktam mulam ca vaidikashtaksharah
    parah || 50|| yesham yenopadesho va tesham sa mula eva ca | sarasvati caturthyantam vahnijayantameva
    ca || 51|| lakshmimayadikam caiva mantro'yam kalpapadapah | pura narayanashcemam valmikaya kripanidhih
    || 52|| pradadau jahnavitire punyakshetre ca bharate | bhrigurdadau ca shukraya pushkare suryaparvani
    || 53|| candraparvani marico dadau vakpataye muda | bhrigoshcaiva dadau tushto brahma badarikashrame
    || 54|| astikasya jaratkarurdadau kshirodasannidhau | vibhandako dadau merau rishyasha
  devanagari: ृणु नारद वक्ष्यामि कण्वशाखोक्तपद्धतिम् । जगन्मातुः सरस्वत्याः पूजाविधिसमन्विताम् ॥ ३२॥ माघस्य
    शुक्लपञ्चम्यां विद्यारम्भदिनेऽपि च । पूर्वेऽह्नि समयं कृत्वा तत्राह्नि संयतः शुचिः ॥ ३३॥ स्नात्वा
    नित्यक्रियाः कृत्वा घटं संस्थाप्य भक्तितः । स्वशाखोक्तविधानेन तान्त्रिकेणाथवा पुनः ॥ ३४॥ गणेशं पूर्वमभ्यर्च्य
    ततोऽभीष्टां प्रपूजयेत् । ध्यानेन वक्ष्यमाणेन ध्यात्वा बाह्यघटे ध्रुवम् ॥ ३५॥ ध्यात्वा पुनः षोडशोपचारेण
    पूजयेद् व्रती । पूजोपयुक्तं नैवेद्यं यच्च वेदनिरूपितम् ॥ ३६॥ वक्ष्यामि सौम्य तत्किञ्चिद्यथाधीतं यथागमम्
    । नवनीतं दधि क्षीरं लाजांश्च तिललड्डुकम् ॥ ३७॥ इक्षुमिक्षुरसं शुक्लवर्णं पञ्चगुडं मधु । स्वस्तिकं
    शर्करां शुक्लधान्यस्याक्षतमक्षतम् ॥ ३८॥ अच्छिन्नशुक्लधान्यस्य पृथुकं शुक्लमोदकम् । घृतसैन्धवसंयुक्तं
    हविष्यान्नं यथोदितम् ॥ ३९॥ यवगोधूमचूर्णानां पिष्टकं घृतसंयुतम् । पिष्टकं स्वस्तिकस्यापि पक्वरम्भाफलस्य
    च ॥ ४०॥ परमान्नं च सघृतं मिष्टान्नं च सुधोपमम् । नारिकेलं तदुदकं कसेरुं मूलमार्द्रकम् ॥ ४१॥ पक्वरम्भाफलं
    चारु श्रीफलं बदरीफलम् । कालदेशोद्भवं चारु फलं शुक्लं च संस्कतम् ॥ ४२॥ सुगन्धं शुक्लपुष्पं च सुगन्धं
    शुक्लचन्दनम् । नवीनं शुक्लवस्त्रं च शङ्खं च सुन्दरं मुने ॥ ४३॥ माल्यं च शुक्लपुष्पाणां शुक्लहारं च
    भूषणम् । यादृशं च श्रुतौ ध्यानं प्रशस्यं श्रुतिसुन्दरम् ॥ ४४॥ तन्निबोध महाभाग भ्रमभञ्जनकारणम् । सरस्वतीं
    शुक्लवर्णां सस्मितां सुमनोहराम् ॥ ४५॥ कोटिचन्द्रप्रभामुष्टपुष्टश्रीयुक्तविग्रहाम् । वह्निशुद्धांशुकाधानां
    वीणापुस्तकधारिणीम् ॥ ४६॥ रत्नसारेन्द्रनिर्माणनवभूषणभूषिताम् । सुपूजितां सुरगणैर्ब्रह्मविष्णुशिवादिभिः
    ॥ ४७॥ वन्दे भक्त्या वन्दितां च मुनीन्द्रमनुमानवैः । एवं ध्यात्वा च मूलेन सर्वं दत्त्वा विचक्षणः ॥
    ४८॥ संस्तूय कवचं धृत्वा प्रणमेद्दण्डवद्भुवि । येषां चेयमिष्टदेवी तेषां नित्यक्रिया मुने ॥ ४९॥ विद्यारम्भे
    च वर्षान्ते सर्वेषां पञ्चमीदिने । सर्वोपयुक्तं मूलं च वैदिकाष्टाक्षरः परः ॥ ५०॥ येषां येनोपदेशो वा
    तेषां स मूल एव च । सरस्वती चतुर्थ्यन्तं वह्निजायान्तमेव च ॥ ५१॥ लक्ष्मीमायादिकं चैव मन्त्रोऽयं कल्पपादपः
    । पुरा नारायणश्चेमं वाल्मीकाय कृपानिधिः ॥ ५२॥ प्रददौ जाह्नवीतीरे पुण्यक्षेत्रे च भारते । भृगुर्ददौ
    च शुक्राय पुष्करे सूर्यपर्वणि ॥ ५३॥ चन्द्रपर्वणि मारीचो ददौ वाक्पतये मुदा । भृगोश्चैव ददौ तुष्टो ब्रह्मा
    बदरिकाश्रमे ॥ ५४॥ आस्तिकस्य जरत्कारुर्ददौ क्षीरोदसन्निधौ । विभाण्डको ददौ मेरौ ऋष्यश
