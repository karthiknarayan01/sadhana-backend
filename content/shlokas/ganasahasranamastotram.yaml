id: ganasahasranamastotram
category: stotram
name:
  english: ganasahasranamastotram
  devanagari: गणसहस्रनामस्तोत्रम्
content:
  english: dvipinirdaḻanah prithuh || 38|| khatvangapanirgarudapakshacchedo'sitambarah | ashtanaganguliyassu
    keshanangadri kundalah || 39|| bhagadattah pashupatirvyaghrah carmottariyakah | kalapaharane vishnu
    kankaḻanko'gni kundalah || 40|| kashtha kutanandagirikandukatanadurdharah | ekapadahkshitiviyattaḻanandogra
    kundalah || 41|| bhimakayovidhishiracchedyuddha tavarapradah | vishnu netradana kundakarnadirgha vilocanah
    || 42|| cakrapaho vidhitiraskarano lambanasikah | shri badabagni tilakavartulakshordhvabahavah ||
    43|| shrikalarudra badabanalananasubahavah | ajandabahupraḻayagni netrau dirghadamshtrakah || 44||
    somadattah kulagirishyatanassu caritrakah | kutharadanto vilayagni khelanasujanghakau || 45|| kurmahinatanabhi
    labhratalalalitangakah | varahadamshtrankamukhaksha padabahu varnakah || 46|| shri badarayanabhujotpatanashcandaghargharah
    | matangah kshirasharadhipanah shrilambajihvakah || 47|| yajna carmasana simhacarmavasassu poshanah
    | tyakshashshribhagavo'kayo vahni jihvanikrintanah || 48|| vishvaksenaharah panduranga strijatadhurjati
    | somo hariratharudhah shri naki pashiroharah || 49|| shrilambakarnebhacarmacelau shribahuvaktrakah
    | carudantastatvamatih kalakanthokshavahanau || 50|| svacchandakarnasenorutalujihvogra jihvaka h |
    lohajanghah shrimahokshapatako bahughonakah || 51|| bahujanghordhvakeshah shripatalatalavasinah |
    bahukarno mahabahu bahunetrordhvabahavah || 52|| shrisahasrodarabahutalujihvamahalayah | mahabhilovishvamukhassumukhah
    sthulavigrahah || 53|| pracandabaladirghoshthau lambaksho dhumavigrahah | mayurakantho bimboshtha
    mahasenorubahavah || 54|| shrimeghamukhalambakshau shulaksho lambakandharah | raudrakshah shashvatasukhanandashambhorujihvakah
    || 55|| urubahumukhojanumukhah shrijatukarnakah | sahasrabahussomaksha mahakesha dvibahavah || 56||
    lambanano bahumukha shripralambatri bahavah | vikato gaganah padamukhakukshimukhavapi || 57|| simhagrivo
    dirghabahurvidyujjihyastrijihvakah | sahasra jihvavarnakshashrisukeshadvijihyakah || 58|| shridhararadhyaraktaksha
    nilambarasamahvayah | pitambarah kratuharo'gni kesho dvibhujastatha| || 59|| lambodaro lambahanurbhimanga
    prabalastatha | mahajihvo mahadamshtrah shrijihvodaranamakah || 60|| suryaksharomanga kambugrivadashabhujastatha
    | urupado lambatanuh padabahuritiritah || 61|| pramathanam prasiddhanam ca yastrailokya pavanah |
    iti | atha rudragana sankirtanam | bhuvaneshvara sarvajna vibhutibhavashashvatah || 62|| meghanado
    bhutikarah pinaki bhutapavanah | ajashcakradharah shvetah kapali vedaparagah || 63|| mahabalo dantadamshtrastrikalo
    meghavahanah | urdhva dehah kruradamshtro dhananjaya kapardinau || 64|| nilarudrah kalakala rudra
    vishvesha babhravah | sarveshadahanau sthularudra bhadranilashanah || 65|| dirghahasta ssukhakara
    ssunadaharapingaḻah | balabhargamaheshatridamshtra ssarvamanonmanah || 66|| aghorah purakajyoti raudro
    vishadharo guhah | krodhesho vatarudrah shrijvalanaksho vivahanah || 67|| dhumravarnassarvabhutadamanah
    shricarastatha | vidyadharesho rudragnissu keshah shriganapriyah || 68|| mrityunjayo mahanatyarudrah
    shribadabamukhah | laghurupadharo mrityunjaya rudrobhayanakah || 69|| ishanarudrah praḻayagni rudrah
    kalalohitah | hararurdro'rdhanarisha rudrastridashavanditah || 70|| shighravikaranau vishvadhikarudro
    vicakshanah | vijnanarudrah sharabharudrah shuladharo vibhuh || 71|| mahograrudrah shabararudro data
    hutashanah | adirudro mahakala rudrabhimabhavodbhavah || 72|| samhararudraika padarudrarcirvarapanakah
    | mahavrishabharudrashca vayuvegassudumbarah || 73|| kiratarudro jayavijayarudrah paraparah | karta
    jatadhara sadashivarudrau kshayantakah || 74|| shrimahashivarudro grau sthanusamharaghatukau karakhyaru
    | virakhyarudrah karmakhyarudro mrityuharomrida h || 75|| bakarudrah kalamegho nivrittih pashahastakah
    | matanga kshayarudrau ca vitarudrah pramardakah || 76|| buddho vidhata kshemisho viyokta prabalo'vyayah
    | hitapramatanau jyeshtho virupakshashca gopatih || 77|| shrinidhisho mahateja vidveshanantashambhavah
    | ganadhyakshantarikshanga shrimatpancashikheshvarah || 78|| saumyadehordhvakeshati bhavesha gaganeshvarah
    | shrivajradantojvalanaprakashasahaneshvarau || 79|| sarvatma sitavarnashca grasanah pingalekshanah
    | asadhyah shreshthagaurisha paramatmasamahvayah || 80|| parandhata prabhusvami shrimadratnadharastatha
    | vamadevo duhkhakarah phanindrasukshmasamjnikah || 81|| balavikaranarudrosneka virastrinetro | haraharihara
    kalamarahantaikavirah | kalavikaranarudro yamya bhasmantakah | shrikshanavrishabha ganendrashcetyayam
    rudravargah || 82|| atha
  devanagari: द्वीपिनिर्दळनः पृथुः ॥ ३८॥ खट्वाङ्गपाणिर्गरुडपक्षच्छेदोऽसिताम्बरः । अष्टनागाङ्गुलीयस्सु
    केशानङ्गाद्रि कुण्डलाः ॥ ३९॥ भगदत्तः पशुपतिर्व्याघ्रः चर्मोत्तरीयकः । कालापहरणे विष्णु कङ्काळाङ्कोऽग्नि
    कुण्डलः ॥ ४०॥ काष्ठ कूटानन्दगिरिकन्दुकाटनदुर्धराः । एकपादःक्षितिवियत्ताळनन्दोग्र कुण्डलाः ॥ ४१॥ भीमकायोविधिशिरच्छेद्युद्ध
    तवरप्रदाः । विष्णु नेत्रादान कुण्डकर्णदीर्घ विलोचनाः ॥ ४२॥ चक्रापहो विधितिरस्करणो लम्बनासिकः । श्री
    बडबाग्नि तिलकवर्तुलाक्षोर्ध्वबाहवः ॥ ४३॥ श्रीकालरुद्र बडबानलाननसुबाहवः । आजाण्डबाहुप्रळयाग्नि नेत्रौ
    दीर्घदंष्ट्रकः ॥ ४४॥ सोमदत्तः कुलगिरिश्यातनस्सु चरित्रकः । कुठारदन्तो विलयाग्नि खेलनसुजङ्घकौ ॥ ४५॥
    कूर्माहिनटनाभी लाभ्रतालललिताङ्गकाः । वराहदंष्ट्राङ्कमुखाक्ष पादबहु वर्णकाः ॥ ४६॥ श्री बादरायणभुजोत्पाटनश्चण्डघर्घरः
    । मातङ्गः क्षीरशरधिपानः श्रीलम्बजिह्वकः ॥ ४७॥ यज्ञ चर्मासन सिंहचर्मवासास्सु पोषणः । त्यक्षश्श्रीभगवोऽकायो
    वह्नि जिह्वानिकृन्तनः ॥ ४८॥ विश्वक्सेनहरः पाण्डुरङ्ग स्त्रिजटधूर्जटी । सोमो हरिरथारूढः श्री नाकि पशिरोहरः
    ॥ ४९॥ श्रीलम्बकर्णेभचर्मचेलौ श्रीबहुवक्त्रकः । चारुदन्तस्तत्वमतिः कालकण्ठोक्षवाहनौ ॥ ५०॥ स्वच्छन्दकर्णसेनोरुतालुजिह्वोग्र
    जिह्वका ः । लोहजङ्घः श्रीमहोक्षपताको बहुघोणकः ॥ ५१॥ बहुजङ्घोर्ध्वकेशः श्रीपातालतलवासिनः । बहुकर्णो
    महाबाहु बहुनेत्रोर्ध्वबाहवः ॥ ५२॥ श्रीसहस्रोदरबहुतालुजिह्वमहालयाः । महाभीलोविश्वमुखस्सुमुखः स्थूलविग्रहः
    ॥ ५३॥ प्रचण्डबलदीर्घोष्ठौ लम्बाक्षो धूमविग्रहः । मयूरकण्ठो बिम्बोष्ठ महासेनोरुबाहवः ॥ ५४॥ श्रीमेघमुखलम्बाक्षौ
    शूलाक्षो लम्बकन्धरः । रौद्राक्षः शाश्वतसुखानन्दशम्भोरुजिह्वकाः ॥ ५५॥ ऊरुबाहुमुखोजानुमुखः श्रीजतुकर्णकः
    । सहस्रबाहुस्सोमाक्ष महाकेश द्विबाहवः ॥ ५६॥ लम्बाननो बहुमुख श्रीप्रलम्बत्रि बाहवः । विकटो गगनः पादमुखकुक्षिमुखावपि
    ॥ ५७॥ सिंहग्रीवो दीर्घबाहुर्विद्युज्जिह्यस्त्रिजिह्वकः । सहस्र जिह्ववर्णाक्षश्रीसुकेशद्विजिह्यकाः
    ॥ ५८॥ श्रीधराराध्यरक्ताक्ष नीलाम्बरसमाह्वयाः । पीताम्बरः क्रतुहरोऽग्नि केशो द्विभुजस्तथा। ॥ ५९॥ लम्बोदरो
    लम्बहनुर्भीमाङ्ग प्रबलस्तथा । महाजिह्वो महादंष्ट्रः श्रीजिह्वोदरनामकः ॥ ६०॥ सूर्याक्षरोमाङ्ग कम्बुग्रीवादशभुजस्तथा
    । ऊरुपादो लम्बतनुः पादबाहुरितीरितः ॥ ६१॥ प्रमथानां प्रसिद्धनां च यस्त्रैलोक्य पावनः । इति । अथ रुद्रगण
    सङ्कीर्तनम् । भुवनेश्वर सर्वज्ञ विभूतिभवशाश्वताः ॥ ६२॥ मेघनादो भूतिकरः पिनाकी भूतपावनः । अजश्चक्रधरः
    श्वेतः कपाली वेदपारगः ॥ ६३॥ महाबलो दन्तदंष्ट्रस्त्रिकलो मेघवाहनः । ऊर्ध्व देहः क्रूरदंष्ट्रो धनञ्जय
    कपर्दिनौ ॥ ६४॥ नीलरुद्रः कालकाल रुद्र विश्वेश बभ्रवः । सर्वेशदहनौ स्थूलरुद्र भद्रानिलाशनाः ॥ ६५॥ दीर्घहस्त
    स्सुखकर स्सुनादहरपिङ्गळाः । बलभर्गमहेशत्रिदंष्ट्र स्सर्वमनोन्मनाः ॥ ६६॥ अघोरः पूरकज्योति रौद्रो विषधरो
    गुहः । क्रोधेशो वटरुद्रः श्रीज्वलनाक्षो विवाहनः ॥ ६७॥ धूम्रवर्णस्सर्वभूतदमनः श्रीचरस्तथा । विद्याधरेशो
    रुद्राग्निस्सु केशः श्रीगणप्रियः ॥ ६८॥ मृत्युञ्जयो महानाट्यरुद्रः श्रीबडबामुखः । लघुरूपधरो मृत्युञ्जय
    रुद्रोभयानकः ॥ ६९॥ ईशानरुद्रः प्रळयाग्नि रुद्रः काललोहितः । हररुर्द्रोऽर्धनारीश रुद्रस्त्रिदशवन्दितः
    ॥ ७०॥ शीघ्राविकरणौ विश्वाधिकरुद्रो विचक्षणः । विज्ञानरुद्रः शरभरुद्रः शूलधरो विभुः ॥ ७१॥ महोग्ररुद्रः
    शबररुद्रो दाता हुताशनः । आदिरुद्रो महाकाल रुद्रभीमभवोद्भवाः ॥ ७२॥ संहाररुद्रैक पादरुद्रार्चिर्वरपानकाः
    । महावृषभरुद्रश्च वायुवेगस्सुदुम्बरः ॥ ७३॥ किरातरुद्रो जयविजयरुद्रः परापरः । कर्ता जटाधर सदाशिवरुद्रौ
    क्षयान्तकः ॥ ७४॥ श्रीमहाशिवरुद्रो ग्रौ स्थाणुसंहारघातुकौ कराख्यरु । वीराख्यरुद्रः कर्माख्यरुद्रो मृत्युहरोमृड
    ः ॥ ७५॥ बकरुद्रः कालमेघो निवृत्तिः पाशहस्तकः । मातङ्ग क्षयरुद्रौ च विटरुद्रः प्रमर्दकः ॥ ७६॥ बुद्धो
    विधाता क्षेमीशो वियोक्ता प्रबलोऽव्ययः । हितप्रमतनौ ज्येष्ठो विरूपाक्षश्च गोपतिः ॥ ७७॥ श्रीनिधीशो महातेजा
    विद्वेषानन्तशम्भवः । गणाध्यक्षान्तरिक्षाङ्ग श्रीमत्पञ्चशिखेश्वराः ॥ ७८॥ सौम्यदेहोर्ध्वकेशाति भवेश
    गगनेश्वाराः । श्रीवज्रदन्तोज्वलनप्रकाशसहनेश्वरौ ॥ ७९॥ सर्वात्मा सितवर्णश्च ग्रसनः पिङ्गलेक्षणः । असाध्यः
    श्रेष्ठगौरीश परमात्मसमाह्वयाः ॥ ८०॥ परन्धाता प्रभुस्वामि श्रीमद्रत्नधरस्तथा । वामदेवो दुःखकरः फणीन्द्रसूक्ष्मसंज्ञिकः
    ॥ ८१॥ बलविकरणरुद्रोस्नेक वीरस्त्रिनेत्रो । हरहरिहर कालामारहन्तैकवीरः । कलविकरणरुद्रो याम्य भस्मान्तकः
    । श्रीक्षणवृषभ गणेन्द्राश्चेत्ययं रुद्रवर्गः ॥ ८२॥ अथ
