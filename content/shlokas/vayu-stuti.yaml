id: vayu-stuti
category: stotram
name:
  english: vayu stuti
  devanagari: वायु स्तुति
content:
  english: vayustutih athava khilavayustutih || shriharivayustutih || || atha shrinakhastutih || pantvasman
    puruhutavairi balavanmatanga madyadghata kumbhoccadri vipatanadhikapatu pratyeka vajrayitah | shrimatkanthiravasya
    pratata sunakhara daritaratidura praddhvastadhvanta shanta pravitata manasa bhavitanakivrindaih ||
    1|| bhavita bhuribhagaih lakshmikanta samantato'pikalayan naiveshituste samam pashyamyuttama vastu
    durataratopastam rasoyo'shtamah | yadroshotkara daksha netra kutila prantotthitagni sphurat khadyotopama
    visphulingabhasita brahmeshashakrotkarah || 2|| iti shrimadanandatirthabhagavatpadacaryaviracita shrinrisimhanakhastutih
    sampurna | || atha shriharivayustutih || shrimadvishnvanghri nishtha atigunagurutama shrimadanandatirtha
    trailokyacarya padojjvala jalajalasat pamsavo'smanpunantu | vacamyatrapranetritribhuvanamahita sharada
    sharadenduh jyotsnabhadrasmita shridhavaḻitakakubhapremabharambabhara || 1|| utkanthakunthakolahalajavaviditajasrasevanuvriddha
    prajnatmajnana dhutandhatamasasumano mauliratnavaḻinam | bhaktyudrekavagadha praghatanasaghatatkara
    sanghrishyamana prantapragryanghri pithotthita kanakarajah pinjararanjitashah || 2|| janmadhivyadhyupadhipratihativirahaprapakanam
    gunanam agryanam arpakanam ciramuditacidananda sandohadanam | eteshameshadosha pramushitamanasam dveshinam
    dushakanam daityanamarthimandhe tamasi vidadhatam samstavenasmi shaktah || 3|| asyavishkartukamam
    kalimalakalushe'sminjanejnanamargam vandyam candrendrarudra dyumaniphanivayoh nayakadyairihadya |
    madhvakhyam mantrasiddham kimutakritavato marutasyavataram pataram parameshtyam padamapavipadah prapturapanna
    pumsam || 4|| udyadvidyutpracandam nijaruci nikaravyapta lokavakasho bibhradbhimo bhujeyo'bhyudita
    dinakarabhangadadhya prakande | viryoddharyam gadagryamayamiha sumatimvayudevovidadhyat adhyatmajnananeta
    yativaramahito bhumibhushamarnime || 5|| samsarottapanityopashamada sadaya snehahasambupura prodyadvidyavanadya
    dyutimanikirana shrenisampuritashah | shrivatsankadhi vasocita tarasaralashrimadanandatirtha kshirambhodhirvibhindyadbhavadanabhimatambhurimebhuti
    hetuh || 6|| murdhanyesho'njalirme dridhataramihate badhyate bandhapasha kshetredhatre sukhanam bhajati
    bhuvi bhavishyadvidhatre dyubhartre | atyantam santatam tvam pradisha padayuge hanta santapa bhajam
    asmakam bhaktimekam bhagavata utate madhavasyatha vayoh || 7|| sabhroshnabhishu shubhraprabhamabhayanabho
    bhuribhubhridvibhutih bhrajishnurbhurribhunam bhavanamapi vibho'bhedibabhrebabhuve | yenabhrovibhramaste
    bhramayatusubhrisham babhruvaddurbhritashan bhrantirbhedava bhasastvitibhayamabhi bhorbhukshyatomayibhikshun
    || 8|| ye'mumbhavambhajante suramukhasujanaradhitam te tritiyam bhasante bhasuraiste sahacaracalitaishcamaraishcaruveshah
    | vaikunthe kanthalagna sthirashuci vilasatkanti tarunyalila lavanya purnakanta kucabharasulabhashleshasammodasandrah
    || 9|| anandanmandamanda dadati hi marutah kundamandaranandyavarta 'modan dadhanam mridupada muditodgitakaih
    sundarinam | vrindairavandya muktendvahimagu madanahindra devendrasevye maukunde mandare'sminnaviratamudayanmodinam
    deva deva || 10|| uttaptatyutkatatvit prakatakatakata dhvanasanghattanodyad vidyudvyudhasphulinga
    prakara vikiranotkvathite badhitangan | udgadhampatyamana tamasi tata itah kinkaraih pankilete panktirgravnam
    garimnam glapayati hi bhavadveshino vidvadadya || 11|| asminnasmadgurunam haricarana ciradhyana sanmangalanam
    yushmakam parshvabhumim dhritaranaranikah svargisevyamprapannah | yastudaste sa aste'dhibhavamasulabha
    klesha nirmukamasta prayanandam katham cinnavasati satatam pancakashte'tikashte || 12|| kshut kshaman
    ruksharaksho radakharanakhara kshunnavikshobhitakshan amagnanandhakupe kshuramukhamukharaih pakshibhirvikshatangan
    | puyasrinmutra vishtha krimikulakaliletatkshanakshipta shaktyadyastra vratarditan stvadvisha upajihate
    vajrakalpa jalukah || 13|| matarmematarishvan pitaratulaguro bhratarishtaptabandho svaminsarvantaratmannajarajarayitah
    janmamrityamayanam | govinde dehibhaktim bhavatica bhagavannurjitam nirnimittam nirvyajam nishcalam
    sadgunagana brihatim shashvatimashudeva || 14|| vishnorattyuttamatvadakhilagunaganaistatra bhaktingarishtham
    samshlishte shridharabhyamamumatha parivaratmana sevakeshu | yah sandhatte virinci shvasana vihagapananta
    rudrendra purve shvadhyayamstaratamyam sphutamavati sada vayurasmadgurustam || 15|| tattvajnan muktibhajah
    sukhayisi hi guro yogyatataratamyat adhatse mishrabuddhim stridivanirayabhugocarannityabaddhan | tamisrandhadikakhye
    tamasisubahulam duhkhayasyanyathajnan vishnorajnabhirittham sha
  devanagari: वायुस्तुतिः अथवा खिलवायुस्तुतिः ॥ श्रीहरिवायुस्तुतिः ॥ ॥ अथ श्रीनखस्तुतिः ॥ पान्त्वस्मान्
    पुरुहूतवैरि बलवन्मातङ्ग माद्यद्घटा कुम्भोच्चाद्रि विपाटनाधिकपटु प्रत्येक वज्रायिताः । श्रीमत्कण्ठीरवास्य
    प्रतत सुनखरा दारितारातिदूर प्रद्ध्वस्तध्वान्त शान्त प्रवितत मनसा भावितानाकिवृन्दैः ॥ १॥ भाविता भूरिभागैः
    लक्ष्मीकान्त समन्ततोऽपिकलयन् नैवेशितुस्ते समं पश्याम्युत्तम वस्तु दूरतरतोपास्तं रसोयोऽष्टमः । यद्रोशोत्कर
    दक्ष नेत्र कुटिल प्रान्तोत्थिताग्नि स्फुरत् खद्योतोपम विस्फुलिङ्गभसिता ब्रह्मेशशक्रोत्कराः ॥ २॥ इति
    श्रीमदानन्दतीर्थभगवत्पादाचार्यविरचिता श्रीनृसिंहनखस्तुतिः सम्पूर्णा । ॥ अथ श्रीहरिवायुस्तुतिः ॥ श्रीमद्विष्ण्वङ्घ्रि
    निष्ठा अतिगुणगुरुतम श्रीमदानन्दतीर्थ त्रैलोक्याचार्य पादोज्ज्वल जलजलसत् पांसवोऽस्मान्पुनन्तु । वाचांयत्रप्रणेत्रीत्रिभुवनमहिता
    शारदा शारदेन्दुः ज्योत्स्नाभद्रस्मित श्रीधवळितककुभाप्रेमभारम्बभार ॥ १॥ उत्कण्ठाकुण्ठकोलाहलजवविदिताजस्रसेवानुवृद्ध
    प्राज्ञात्मज्ञान धूतान्धतमससुमनो मौलिरत्नावळीनाम् । भक्त्युद्रेकावगाढ प्रघटनसघटात्कार सङ्घृष्यमाण
    प्रान्तप्राग्र्याङ्घ्रि पीठोत्थित कनकरजः पिञ्जरारञ्जिताशाः ॥ २॥ जन्माधिव्याध्युपाधिप्रतिहतिविरहप्रापकाणां
    गुणानाम् अग्र्याणां अर्पकाणां चिरमुदितचिदानन्द सन्दोहदानाम् । एतेषामेशदोष प्रमुषितमनसां द्वेषिणां
    दूषकाणाम् दैत्यानामार्थिमन्धे तमसि विदधतां संस्तवेनास्मि शक्तः ॥ ३॥ अस्याविष्कर्तुकामं कलिमलकलुषेऽस्मिन्जनेज्ञानमार्गम्
    वन्द्यं चन्द्रेन्द्ररुद्र द्युमणिफणिवयोः नायकद्यैरिहाद्य । मध्वाख्यं मन्त्रसिद्धं किमुतकृतवतो मारुतस्यावतारम्
    पातारं पारमेष्ट्यं पदमपविपदः प्राप्तुरापन्न पुंसाम् ॥ ४॥ उद्यद्विद्युत्प्रचण्डां निजरुचि निकरव्याप्त
    लोकावकाशो बिभ्रद्भीमो भुजेयोऽभ्युदित दिनकराभाङ्गदाढ्य प्रकाण्डे । वीर्योद्धार्यां गदाग्र्यामयमिह सुमतिंवायुदेवोविदध्यात्
    अध्यात्मज्ञाननेता यतिवरमहितो भूमिभूषामर्णिमे ॥ ५॥ संसारोत्तापनित्योपशमद सदय स्नेहहासाम्बुपूर प्रोद्यद्विद्यावनद्य
    द्युतिमणिकिरण श्रेणिसम्पूरिताशः । श्रीवत्साङ्काधि वासोचित तरसरलश्रीमदानन्दतीर्थ क्षीराम्भोधिर्विभिन्द्याद्भवदनभिमतम्भूरिमेभूति
    हेतुः ॥ ६॥ मूर्धन्येषोऽन्जलिर्मे दृढतरमिहते बध्यते बन्धपाश क्षेत्रेधात्रे सुखानां भजति भुवि भविष्यद्विधात्रे
    द्युभर्त्रे । अत्यन्तं सन्ततं त्वं प्रदिश पदयुगे हन्त सन्ताप भाजाम् अस्माकं भक्तिमेकां भगवत उतते माधवस्याथ
    वायोः ॥ ७॥ साभ्रोष्णाभीशु शुभ्रप्रभमभयनभो भूरिभूभृद्विभूतिः भ्राजिष्णुर्भूरृभूणां भवनमपि विभोऽभेदिबभ्रेबभूवे
    । येनभ्रोविभ्रमस्ते भ्रमयतुसुभृशं बभ्रुवद्दुर्भृताशान् भ्रान्तिर्भेदाव भासस्त्वितिभयमभि भोर्भूक्ष्यतोमायिभिक्षून्
    ॥ ८॥ येऽमुम्भावम्भजन्ते सुरमुखसुजनाराधितं ते तृतीयम् भासन्ते भासुरैस्ते सहचरचलितैश्चामरैश्चारुवेशाः
    । वैकुण्ठे कण्ठलग्न स्थिरशुचि विलसत्कान्ति तारुण्यलीला लावण्या पूर्णकान्ता कुचभरसुलभाश्लेषसम्मोदसान्द्राः
    ॥ ९॥ आनन्दान्मन्दमन्दा ददति हि मरुतः कुन्दमन्दारनन्द्यावर्ता ऽमोदान् दधानां मृदुपद मुदितोद्गीतकैः
    सुन्दरीणाम् । वृन्दैरावन्द्य मुक्तेन्द्वहिमगु मदनाहीन्द्र देवेन्द्रसेव्ये मौकुन्दे मन्दरेऽस्मिन्नविरतमुदयन्मोदिनां
    देव देव ॥ १०॥ उत्तप्तात्युत्कटत्विट् प्रकटकटकट ध्वानसङ्घट्टनोद्यद् विद्युद्व्यूढस्फुलिङ्ग प्रकर विकिरणोत्क्वाथिते
    बाधिताङ्गान् । उद्गाढम्पात्यमाना तमसि तत इतः किङ्करैः पङ्किलेते पङ्क्तिर्ग्राव्णां गरिम्णां ग्लपयति
    हि भवद्वेषिणो विद्वदाद्य ॥ ११॥ अस्मिन्नस्मद्गुरूणां हरिचरण चिरध्यान सन्मङ्गलानाम् युष्माकं पार्ष्वभूमिं
    धृतरणरणिकः स्वर्गिसेव्यांप्रपन्नः । यस्तूदास्ते स आस्तेऽधिभवमसुलभ क्लेश निर्मूकमस्त प्रायानन्दं कथं
    चिन्नवसति सततं पञ्चकष्टेऽतिकष्टे ॥ १२॥ क्षुत् क्षामान् रूक्षरक्षो रदखरनखर क्षुण्णविक्षोभिताक्षान्
    आमग्नानान्धकूपे क्षुरमुखमुखरैः पक्षिभिर्विक्षताङ्गान् । पूयासृन्मूत्र विष्ठा क्रिमिकुलकलिलेतत्क्षणक्षिप्त
    शक्त्याद्यस्त्र व्रातार्दितान् स्त्वद्विष उपजिहते वज्रकल्पा जलूकाः ॥ १३॥ मातर्मेमातरिश्वन् पितरतुलगुरो
    भ्रातरिष्टाप्तबन्धो स्वामिन्सर्वान्तरात्मन्नजरजरयितः जन्ममृत्यामयानाम् । गोविन्दे देहिभक्तिं भवतिच
    भगवन्नूर्जितां निर्निमित्ताम् निर्व्याजां निश्चलां सद्गुणगण बृहतीं शाश्वतीमाशुदेव ॥ १४॥ विष्णोरत्त्युत्तमत्वादखिलगुणगणैस्तत्र
    भक्तिङ्गरिष्ठाम् संश्लिष्टे श्रीधराभ्याममुमथ परिवारात्मना सेवकेषु । यः सन्धत्ते विरिञ्चि श्वसन विहगपानन्त
    रुद्रेन्द्र पूर्वे ष्वाध्यायंस्तारतम्यं स्फुटमवति सदा वायुरस्मद्गुरुस्तम् ॥ १५॥ तत्त्वज्ञान् मुक्तिभाजः
    सुखयिसि हि गुरो योग्यतातारतम्यात् आधत्से मिश्रबुद्धिं स्त्रिदिवनिरयभूगोचरान्नित्यबद्धान् । तामिस्रान्धादिकाख्ये
    तमसिसुबहुलं दुःखयस्यन्यथाज्ञान् विष्णोराज्ञाभिरित्थं श
