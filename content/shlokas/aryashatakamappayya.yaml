id: aryashatakamappayya
category: shataka
name:
  english: aryashatakamappayya
  devanagari: आर्याशतकमप्पय्या
content:
  english: aryashatakam shrimadappayyadikshitaviracitam dayaya yadiyaya vannavarasarucira sudhadhikodeti
    | sharanagatacintitadam tam shivacintamanim vande || 1|| shirasi sitamshukaladhyam karunapiyushapuritam
    nayane | smitadugdhamugdhavadanam lalanakalitam mahah kalaye || 2|| ante cintayate yattattametiti
    ca tvaya gaditam | shiva tava caranadvandvadhyanannirdvandvata citram || 3|| drutamuddhara hara samhara
    samhara bhavavairinam tvatitvaraya| bhava bhavato'pi bhavo'yam ripuretanninditam jagati || 4|| cetasi
    cintaya vamam va mam va na dvidha sthitasyaham | iti yadi vadasi dayabdhe vamardhe sa tavapyasti ||
    5|| mitrakalatrasutadin dhyayasyanisham na mam kshanam jatu| yadi kupyasi mayi dine tulayami tvam
    katham saha taih || 6|| matkritadushkritashantirvishavahnijaladiyatanaya | yadi nishcayastavayam preshaya
    garalagnigangaughan || 7|| bhogam vihaya yogam sadhaya dasye tavapi parabhagam | mama kim na vavakashastvadbhushabhoginam
    madhye || 8|| lalanalolavilokanajitamityavamanyase katham mam tvam| tvayi jayardhasharire shiva shiva
    na''lokananubhavah || 9|| smaranadanupadamidrigvismritishilo na vallabho'si mama| utpadyasham bhankturlagna
    vrittistavaiveyam || 10|| putrah pitrivatputri matrivadittham mamatra ko doshah | ahamapi bhogasaktah
    prakritirjata vishadavati || 11|| vapurardham vamardham shirasi shashi so'pi bhushanam te'rdham |
    mamapi tavardhabhaktam shiva shiva dehe na dharayasi || 12|| stanapam shishum tvadiyam palaya samba
    drutam na pasi yadi | jagatah piteti gitam yatam nameti janihi || 13|| matari hitva balam karyakuladhih
    pita bahiryati | shiva bata shaknoshi katham svanganmanmataram moktum || 14|| gunahinatam tanuje mayi
    drishtva kim parityajasyevam | ucitam guninastvetannirgunarupasya te'nucitam || 15|| kamakrodhakatabhyam
    madajaladharam nirankushe sravati | matkritadushkritakarini prakata pancasyata te'stu || 16|| tvaddhinam
    mam dinam drishtva vishayatiragasambaddham | dhavatyakirtiresha nathah shakto'pyudasinah || 17|| aribhirjitairashaktairvijnapyam
    sevakaih prabhornitih | vishayairjito'smi shambho tava yacchlaghyam tadaracaya || 18|| samrakshyate
    svadasairyadyadvastu prabhorabhishtataram | dasastaveshtakamah kantam kanakam katham tyajeyamaham
    || 19|| papi papam sukriti sukritam bhunkte mamatra kim nu gatam| ityaudasyamayuktam bhrityakirtih
    prabhoreva || 20|| vikale'tidinacitte vishayashamatradharini nitantam | mayi roshatah kiyat te vada
    vada shambho yasho bhavi || 21|| svagrihe bhuvanatritaye yogaksheme mukhani catvari | matprativacanam
    hi vina pancamavadanasya kutra gatih || 22|| tava ko'ham tvam mama kah pancasvevam vicarayasveti |
    brushe dinadayabdhe pancamukhatvam tvayi vyaktam|| 23|| yacasvanyam dhaninam bhavita tava ko digambarallabhah
    | mam ma pratarayaivam khyatah shrikanthanamasi|| 24|| vasanashanapradatari mayi jivati kim samakulastvamiti
    | dohaya mocyamano vatsah kim na tvaramayate || 25|| patakarashiritidam tvayabhidhanam shrutam na
    tad drishtam| taddarshanakutukam yadi mam drashtum kim vilambase deva || 26|| patakarashirasi tvam
    pashyamyata eva nahamiti vadasi | patakarupajnane shiva tava sarvajnatabhangah || 27|| papam papamitidam
    karoshi shiva kim mudha budhan bhrantan | tatsatyam cenna katham tvayanubhutam na drishtam va || 28||
    pape lokanubhavah sa eva manam mamapyananubhute | na hi parakiyanubhavah jnatum shakyah parenapi ||
    29|| lokabhinnah so'ham vaktum vakyam hyupakramastava cet| siddha manoratha me tvattah kasyapi lokasya
    || 30|| ativalganam mamaitanmudhatvam yadyapi prabhoh puratah | dinah karomi kim va madvishaye ko
    nivedayati || 31|| laghurasi kim tvayi dayaya ma ma mamsthah shiveti sahasa tvam| bharo bhuvo'smi
    dhritva svakare tulayashu mam shambho|| 32|| sasye trine ca vrishtim tulyam devah sadaiva vidadhati
    | devo mahan bata tvam gurulaghuvartam katham kurushe || 33|| dishtoddishtam dasyamyanyanneshtam yadi
    sphutam vakyam | datta katham tvayasavajaramarata mrikandujaneh || 34|| nadattam prapnotityetadvakyam
    prataranamatram | upamanyuna kada va kasmai dugdhodadhirdattah || 35|| prabalataronmadadhyam tvamapyaganayya
    dhavamanam ca | macceto'pasmaram niyamaya shambho padabhyam te || 36|| ashapishacika mam bhramayati
    parito dashasvapi dishasu | sviye pishacavarge sevayai kim na yojayasi || 37|| yakshadhinam raksham
    tryaksha nidhinam kuto nu va kurushe| sakshanmanushyadharma'pyahaha katham nu vismritirmama te ||
    38|| dhanade sakhitvametat tava yat tatrasti vismayah ka iva | mayi nirdhane tadastam trijagati citram
    kiyadbhavi || 39|| sakhitarupanidhanam vittanidhanam dvidha dhanam tava yat | naikakare nripanitistatranyatarannidhehi
    mayi || 40|| palaya va mam ma va mattanubhuta tu pancabhutatatih | poshyavashyam bhavata bhavita no
    cenna bhutapatih || 41|| atikomalam manaste munibhirgitam kuto'dhuna kathinam | manye vishashanartham
    kathinam cetastvaya vihitam || 42|| mam drashtumashtamurte karuna te'dyapi kim na vollasati | bhikshaprasangato
    va kiyatam no yasi sadanani || 43|| vittadhipah sakha te bharya dehe tavannapurnakhya | urikritam
    na durikurushe bhikshatanamapisha || 44|| nangikrito maya tvam tata eva na darshanam mama tavasti
    | iti nottaram pradeyam shiva shiva vishveshanamasi || 45|| yadi dehageharupam dadasi deshadhikarakaryam
    mama | rasanakhyalekhapatre sudridham kuru namamudram te || 46|| rasanoktam kuru sarvam shiva tava
    namadhimudritastiyam | ganayasi mudram na hi cet prabhutocchinna tavaiva syat || 47|| atyatinam karalam
    bhikshayuktam kapalashulakaram | maddaridryam bhairavarupam kuru cardhacandrayutam || 48|| daridryacandarashmau
    pratapati kedaravacca mayi shushke | jaladharatayam satyam tvayi shiva nadyapi samupaishi || 49||
    daridryakhyamanobhuh klibam ceto'pi mohayatyanisham | enam linam kartum dhanyah ko'nyastvadanyo'sti
    || 50|| bhalanalakshiyuktastrijagati nanyo madanya iti| garvam ma vaha yavaddaridryagnih kapale me||
    51|| cetah kuru ma kalaham tava vaiklavye'pi shambhuna prabhuna| na vadati yadyapi bharta tavopakarta
    sa evasti || 52|| ayi citta vittaleshe sahajapremna kiyannu lubdhamasi | na tathapi tadviyogah kevalamaste
    shivenapi || 53|| cetah kira viharam parihara paritah svayam prayatnena| attum kalabidalo dhavati
    shivapanjaram pravisha || 54|| cetah sadagate tvam pratyashavatyayanugatamurtih| ma vaha vishayaranye
    lino bhava saccidakashe || 55|| cetah sha
  devanagari: आर्याशतकम् श्रीमदप्पय्यदीक्षितविरचितम् दयया यदीयया वाङ्नवरसरुचिरा सुधाधिकोदेति । शरणागतचिन्तितदं
    तं शिवचिन्तामणिं वन्दे ॥ १॥ शिरसि सितांशुकलाढ्यं करुणापीयूषपूरितं नयने । स्मितदुग्धमुग्धवदनं ललनाकलितं
    महः कलये ॥ २॥ अन्ते चिन्तयते यत्तत्तामेतीति च त्वया गदितम् । शिव तव चरणद्वन्द्वध्यानान्निर्द्वन्द्वता
    चित्रम् ॥ ३॥ द्रुतमुद्धर हर संहर संहर भववैरिणं त्वतित्वरया। भव भवतोऽपि भवोऽयं रिपुरेतन्निन्दितं जगति
    ॥ ४॥ चेतसि चिन्तय वामां वा मां वा न द्विधा स्थितस्याहम् । इति यदि वदसि दयाब्धे वामार्धे सा तवाप्यस्ति
    ॥ ५॥ मित्रकलत्रसुतादीन् ध्यायस्यनिशं न मां क्षणं जातु। यदि कुप्यसि मयि दीने तुलयामि त्वां कथं सह तैः
    ॥ ६॥ मत्कृतदुष्कृतशान्तिर्विषवह्निजलादियातनया । यदि निश्चयस्तवायं प्रेषय गरलाग्निगङ्गौघान् ॥ ७॥ भोगं
    विहाय योगं साधय दास्ये तवापि परभागम् । मम किं न वावकाशस्त्वद्भूषाभोगिनां मध्ये ॥ ८॥ ललनालोलविलोकनजितमित्यवमन्यसे
    कथं मां त्वम्। त्वयि जायार्धशरीरे शिव शिव नाऽऽलोकनानुभवः ॥ ९॥ स्मरणादनुपदमीदृग्विस्मृतिशीलो न वल्लभोऽसि
    मम। उत्पाद्याशां भङ्क्तुर्लग्ना वृत्तिस्तवैवेयम् ॥ १०॥ पुत्रः पितृवत्पुत्री मातृवदित्थं ममात्र को
    दोषः । अहमपि भोगासक्तः प्रकृतिर्जाता विषादवती ॥ ११॥ वपुरर्धं वामार्धं शिरसि शशी सोऽपि भूषणं तेऽर्धम्
    । मामपि तवार्धभक्तं शिव शिव देहे न धारयसि ॥ १२॥ स्तनपं शिशुं त्वदीयं पालय साम्ब द्रुतं न पासि यदि
    । जगतः पितेति गीतं यातं नामेति जानीहि ॥ १३॥ मातरि हित्वा बालं कार्याकुलधीः पिता बहिर्याति । शिव बत
    शक्नोषि कथं स्वाङ्गान्मन्मातरं मोक्तुम् ॥ १४॥ गुणहीनतां तनूजे मयि दृष्ट्वा किं परित्यजस्येवम् । उचितं
    गुणिनस्त्वेतन्निर्गुणरूपस्य तेऽनुचितम् ॥ १५॥ कामक्रोधकटाभ्यां मदजलधारां निरङ्कुशे स्रवति । मत्कृतदुष्कृतकरिणि
    प्रकटा पञ्चास्यता तेऽस्तु ॥ १६॥ त्वद्धीनं मां दीनं दृष्ट्वा विषयातिरागसम्बद्धम् । धावत्यकीर्तिरेषा
    नाथः शक्तोऽप्युदासीनः ॥ १७॥ अरिभिर्जितैरशक्तैर्विज्ञाप्यं सेवकैः प्रभोर्नीतिः । विषयैर्जितोऽस्मि शम्भो
    तव यच्छ्लाघ्यं तदारचय ॥ १८॥ संरक्ष्यते स्वदासैर्यद्यद्वस्तु प्रभोरभीष्टतरम् । दासस्तवेष्टकामः कान्तां
    कनकं कथं त्यजेयमहम् ॥ १९॥ पापी पापं सुकृती सुकृतं भुङ्क्ते ममात्र किं नु गतम्। इत्यौदास्यमयुक्तं भृत्याकीर्तिः
    प्रभोरेव ॥ २०॥ विकलेऽतिदीनचित्ते विषयाशामात्रधारिणि नितान्तम् । मयि रोषतः कियत् ते वद वद शम्भो यशो
    भावि ॥ २१॥ स्वगृहे भुवनत्रितये योगक्षेमे मुखानि चत्वारि । मत्प्रतिवचनं हि विना पञ्चमवदनस्य कुत्र गतिः
    ॥ २२॥ तव कोऽहं त्वं मम कः पञ्चस्वेवं विचारयस्वेति । ब्रूषे दीनदयाब्धे पञ्चमुखत्वं त्वयि व्यक्तम्॥
    २३॥ याचस्वान्यं धनिनं भविता तव को दिगम्बराल्लाभः । मां मा प्रतारयैवं ख्यातः श्रीकण्ठनामासि॥ २४॥ वसनाशनप्रदातरि
    मयि जीवति किं समाकुलस्त्वमिति । दोहाय मोच्यमानो वत्सः किं न त्वरामयते ॥ २५॥ पातकराशिरितीदं त्वयाभिधानं
    श्रुतं न तद् दृष्टम्। तद्दर्शनकुतुकं यदि मां द्रष्टुं किं विलम्बसे देव ॥ २६॥ पातकराशिरसि त्वं पश्याम्यत
    एव नाहमिति वदसि । पातकरूपाज्ञाने शिव तव सर्वज्ञताभङ्गः ॥ २७॥ पापं पापमितीदं करोषि शिव किं मुधा बुधान्
    भ्रान्तान् । तत्सत्यं चेन्न कथं त्वयानुभूतं न दृष्टं वा ॥ २८॥ पापे लोकानुभवः स एव मानं ममाप्यननुभूते
    । न हि परकीयानुभवः ज्ञातुं शक्यः परेणापि ॥ २९॥ लोकाभिन्नः सोऽहं वक्तुं वाक्यं ह्युपक्रमस्तव चेत्।
    सिद्धा मनोरथा मे त्वत्तः कस्यापि लोकस्य ॥ ३०॥ अतिवल्गनं ममैतन्मूढत्वं यद्यपि प्रभोः पुरतः । दीनः करोमि
    किं वा मद्विषये को निवेदयति ॥ ३१॥ लघुरसि किं त्वयि दयया मा मा मंस्थाः शिवेति सहसा त्वम्। भारो भुवोऽस्मि
    धृत्वा स्वकरे तुलयाशु मां शम्भो॥ ३२॥ सस्ये तृणे च वृष्टिं तुल्यां देवः सदैव विदधाति । देवो महान् बत
    त्वं गुरुलघुवार्तां कथं कुरुषे ॥ ३३॥ दिष्टोद्दिष्टं दास्याम्यन्यन्नेष्टं यदि स्फुटं वाक्यम् । दत्ता
    कथं त्वयासावजरामरता मृकण्डुजनेः ॥ ३४॥ नादत्तं प्राप्नोतीत्येतद्वाक्यं प्रतारणामात्रम् । उपमन्युना
    कदा वा कस्मै दुग्धोदधिर्दत्तः ॥ ३५॥ प्रबलतरोन्मादाढ्यं त्वामप्यगणय्य धावमानं च । मच्चेतोऽपस्मारं नियमय
    शम्भो पदाभ्यां ते ॥ ३६॥ आशापिशाचिका मां भ्रमयति परितो दशस्वपि दिशासु । स्वीये पिशाचवर्गे सेवायै किं
    न योजयसि ॥ ३७॥ यक्षाधीनां रक्षां त्र्यक्ष निधीनां कुतो नु वा कुरुषे। साक्षान्मनुष्यधर्माऽप्यहह कथं
    नु विस्मृतिर्मम ते ॥ ३८॥ धनदे सखित्वमेतत् तव यत् तत्रास्ति विस्मयः क इव । मयि निर्धने तदास्तां त्रिजगति
    चित्रं कियद्भावि ॥ ३९॥ सखितारूपनिधानं वित्तनिधानं द्विधा धनं तव यत् । नैककरे नृपनीतिस्तत्रान्यतरन्निधेहि
    मयि ॥ ४०॥ पालय वा मां मा वा मत्तनुभूता तु पञ्चभूतततिः । पोष्यावश्यं भवता भविता नो चेन्न भूतपतिः ॥
    ४१॥ अतिकोमलं मनस्ते मुनिभिर्गीतं कुतोऽधुना कठिनम् । मन्ये विषाशनार्थं कठिनं चेतस्त्वया विहितम् ॥ ४२॥
    मां द्रष्टुमष्टमूर्ते करुणा तेऽद्यापि किं न वोल्लसति । भिक्षाप्रसङ्गतो वा कियतां नो यासि सदनानि ॥
    ४३॥ वित्ताधिपः सखा ते भार्या देहे तवान्नपूर्णाख्या । ऊरीकृतं न दूरीकुरुषे भिक्षाटनमपीश ॥ ४४॥ नाङ्गीकृतो
    मया त्वं तत एव न दर्शनं मम तवास्ति । इति नोत्तरं प्रदेयं शिव शिव विश्वेशनामासि ॥ ४५॥ यदि देहगेहरूपं
    ददासि देशाधिकारकार्यं मम । रसनाख्यलेखपत्रे सुदृढां कुरु नाममुद्रां ते ॥ ४६॥ रसनोक्तं कुरु सर्वं शिव
    तव नामाधिमुद्रितास्तीयम् । गणयसि मुद्रां न हि चेत् प्रभुतोच्छिन्ना तवैव स्यात् ॥ ४७॥ अत्याटिनं करालं
    भिक्षायुक्तं कपालशूलकरम् । मद्दारिद्र्यं भैरवरूपं कुरु चार्धचन्द्रयुतम् ॥ ४८॥ दारिद्र्यचण्डरश्मौ प्रतपति
    केदारवच्च मयि शुष्के । जलधरतायां सत्यां त्वयि शिव नाद्यापि समुपैषि ॥ ४९॥ दारिद्र्याख्यमनोभूः क्लीबं
    चेतोऽपि मोहयत्यनिशम् । एनं लीनं कर्तुं धन्यः कोऽन्यस्त्वदन्योऽस्ति ॥ ५०॥ भालानलाक्षियुक्तस्त्रिजगति
    नान्यो मदन्य इति। गर्वं मा वह यावद्दारिद्र्याग्निः कपाले मे॥ ५१॥ चेतः कुरु मा कलहं तव वैक्लव्येऽपि
    शम्भुना प्रभुणा। न वदति यद्यपि भर्ता तवोपकर्ता स एवास्ति ॥ ५२॥ अयि चित्त वित्तलेशे सहजप्रेम्णा कियन्नु
    लुब्धमसि । न तथापि तद्वियोगः केवलमास्ते शिवेनापि ॥ ५३॥ चेतः कीर विहारं परिहर परितः स्वयं प्रयत्नेन।
    अत्तुं कालबिडालो धावति शिवपञ्जरं प्रविश ॥ ५४॥ चेतः सदागते त्वं प्रत्याशावात्ययानुगतमूर्तिः। मा वह
    विषयारण्ये लीनो भव सच्चिदाकाशे ॥ ५५॥ चेतः श
