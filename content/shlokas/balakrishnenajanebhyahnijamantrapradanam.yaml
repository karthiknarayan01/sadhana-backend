id: balakrishnenajanebhyahnijamantrapradanam
category: mantra
name:
  english: balakrishnenajanebhyahnijamantrapradanam
  devanagari: बालकृष्णेनजनेभ्यःनिजमन्त्रप्रदानम्
content:
  english: '|| 97|| ityevam nijamantra~shca pradadau bhagavan svayam | atha praja harim natva pujayamasuradarat
    || 98|| iti shrilakshminarayaniyasamhita | khanda 2| adhyaya 219'
  devanagari: ॥ ९७॥ इत्येवं निजमन्त्राँश्च प्रददौ भगवान् स्वयम् । अथ प्रजा हरिं नत्वा पूजयामासुरादरात्
    ॥ ९८॥ इति श्रीलक्ष्मीनारायणीयसंहिता । खण्ड २। अध्याय २१९
meaning: {}
