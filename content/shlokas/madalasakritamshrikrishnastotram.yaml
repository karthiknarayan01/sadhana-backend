id: madalasakritamshrikrishnastotram
category: stotram
name:
  english: madalasakritamshrikrishnastotram
  devanagari: मदालसकृतंश्रीकृष्णस्तोत्रम्
content:
  english: madalasakritam shrikrishnastotram madanalasa uvaca | namaste dayasindhave krishnadeva tvayedam
    tatam vishvamambhodhirupam | tvayaikena lilarthato devadeva priyaradhaya sarddhametaddhi guptam ||
    43|| jagatyantakale tvaya kalamurtya jagatsamhritam vai namaste namaste | madiya ca buddhirhrishikesha
    shuddha yatha syattathaivesha shighram kuru tvam || 44|| iti stotraprabhavena devadevena mocita |
    kamapashattasya buddhih sa kshatri grihamayayau || 45|| iti bhavishyapurane pratisargaparvani dvitiyakhande
    caturdashadhyayantargatam madalasakritam shrikrishnastotram samaptam | bhavishyapurana | pratisargaparva
    | dvitiyakhanda | adhyaya 14
  devanagari: मदालसकृतं श्रीकृष्णस्तोत्रम् मदनालस उवाच । नमस्ते दयासिन्धवे कृष्णदेव त्वयेदं ततं विश्वमम्भोधिरूपम्
    । त्वयैकेन लीलार्थतो देवदेव प्रियाराधया सार्द्धमेतद्धि गुप्तम् ॥ ४३॥ जगत्यन्तकाले त्वया कालमूर्त्या
    जगत्संहृतं वै नमस्ते नमस्ते । मदीया च बुद्धिर्हृषीकेश शुद्धा यथा स्यात्तथैवेश शीघ्रं कुरु त्वम् ॥
    ४४॥ इति स्तोत्रप्रभावेन देवदेवेन मोचिता । कामपाशात्तस्य बुद्धिः स क्षत्री गृहमाययौ ॥ ४५॥ इति भविष्यपुराणे
    प्रतिसर्गपर्वणि द्वितीयखण्डे चतुर्दशाध्यायान्तर्गतं मदालसकृतं श्रीकृष्णस्तोत्रं समाप्तम् । भविष्यपुराण
    । प्रतिसर्गपर्व । द्वितीयखण्ड । अध्याय १४
