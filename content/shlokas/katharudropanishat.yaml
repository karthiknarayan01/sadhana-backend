id: katharudropanishat
category: upanishad
name:
  english: katharudropanishat
  devanagari: कठरुद्रोपनिषत्
content:
  english: upanishad katharudropanishat parivrajyadharmapugalamkara yatpadam yayuh | tadaham kathavidyartham
    ramacandrapadam bhaje || om sahanavavatu saha nau bhunaktu saha viryam karavavahai || tejasvinavadhitamastu
    ma vidvishavahai || om shantih shantih shantih || harih om || deva ha vai bhagavantamabruvannadhihi
    bhagavanbrahmavidyam | sa prajapatirabravitsashikhankeshannishkritya visrijya yajnopavitam nishkritya
    putram drishtva tvam brahma tvam yajnastvam vashatkara stvamonkarastvam svaha tvam svadha tvam dhata
    tvam vidhata tvam pratishtha'siti vadet | atha putro vadatyaham brahmaham yajno'ham vashatkaro'hamomkaro'ham
    svahaham svadhaham dhataham vidhataham tvashtaham pratishthasmiti | tanyetanyanuvrajannashrumapatayet
    | yadashrumapatayetprajam vicchindyat | pradakshinamavrittyaitaccaitaccanavekshamanah pratyayanti
    | sa svargyo bhavati brahmacari vedamadhitya vedoktacaritabrahmacaryo daranahritya putranutpadya tananupadibhirvitatyeshtva
    ca shaktito yajnaih | tasya samnyaso gurubhiranujnatasya bandhavaishca | so'ranyam paretya dvadasharatram
    payasagnihotram juhuyat | dvadasharatram payobhaksha syat | dvadasharatrasyante agnaye vaishvanaraya
    prajapataye ca prajapatyam carum vaishnavam trikapalamagnim samsthitani purvani darupatranyagnau juhuyat
    | mrinmayanyapsu juhuyat | taijasani gurave dadyat | ma tvam mamapahaya paragah | naham tvamapahaya
    paragamiti | garhapatyadakshinagnyahavaniyeshvaranideshadbhasmamushtim pibedityeke | sashikhankeshannishkritya
    visrijya yajnopavitam bhuhsvahetyapsu juhuyat | ata urdhvamanashanamapam pravesha magnipravesham viradhvanam
    mahaprasthanam vriddhashramam va gacchet | payasa yam prashniyatso'sya sayamhomah | yatpratah so'yam
    pratah | yaddarshe taddarshanam | yatpaurnamasye tatpaurnamasyam | yadvasante keshashmashrulomanakhani
    vapayetso'syagnishtomah | samnyasyagnim na punaravartayenmrityurjayamavahamityadhyatma mantranpathet
    | svasti sarvajivebhya ityuktvatmanamananyam dhyayan tadurdhvabahurvimuktamargo bhavet | aniketashcaret
    | bhikshashi yatkimcinnadyat | lavaikam na dhavayejjantusamrakshanartham varshavarjamiti | tadapi
    shloka bhavanti | kundikam camasam shikyam trivishtamupanahau | shitopaghatinim kantham kaupinacchadanam
    tatha || 1|| pavitram jnanashatim ca uttarasangameva ca | yajnopavitam vedamshca sarvam tadvarjayedyatih
    || 2|| snanam panam tatha shaucamadbhih putabhiracaret | nadipulinashayi syaddevagareshu va svapet
    || 3|| natyartham sukhaduhkhabhyam shariramupatayet | stuyamano na tusheta nindito na shapetparan
    || 4|| brahmacaryena samtishthedapramadena maskari | darshanam sparshanam kelih kirtanam guhyabhashanam
    || 5|| samkalpo'dhyavasayashca kriyannirvrittireva ca | etanmaithunamashtangam pravadanti manishinah
    || 6|| viparitam brahmacaryamanushtheyam mumukshubhih | yajjagadbhasakam bhanam nityam bhati svatah
    sphurat || 7|| sa eva jagatah sakshi sarvatma vimalakritih | pratishtha sarvabhutanam prajnanaghanalakshanah
    || 8|| na karmana na prajaya na canyenapi kecit | brahmavedanamatrena brahmapnotyeva manavah || 9||
    tadvidya vishayam brahma satyajnanasukhadvayam | samsare ca guhavacye mayajnanadisamjnake || 10||
    nihitam brahma yo veda parame vyomni samjnite | so'shnute sakalankamankramenaiva dvijottamah || 11||
    pratyagatmanamajnanamayashakteshca sakshinam | ekam brahmahamasmiti brahmaiva bhavati svayam || 12||
    brahmabhutatmanastasmadetasmacchktimishritat | apancikrita akashasambhuto rajjusarpavat || 13|| akashadvayusamjnastu
    sparsho'pancikritah punah | vayoragnistatha cagnerapa adbhyo vasundhara || 14|| tani bhutani sukshmani
    pancikrityeshvarastada | tebhya eva visrishtam tadbrahmandadi shivena ha || 15|| brahmandasyodare
    deva danava yakshakinnarah | manushyah pashupakshyadyastattatkarmanusaratah || 16|| asthisnayvadirupo'yam
    shariram bhati dehinam | yo'yamannamayo hyatma bhati sarvasharirinah || 17|| tatah pranamayo hyatma
    vibhinnashcantarah sthitah | tato vijnana atma tu tato'nyashcantarah svatah || 18|| anandamaya atma
    tu tato'nyashcantarasthitah | yo'yamannamayah so'yam purnah pranamayena tu || 19|| manomayena prano'pi
    tatha purnah svabhavatah | tatha manomayo hyatma purno jnanamayena tu || 20|| anandena sada purnah
    sada jnanamayah sukham | tathanandamayashcapi brahmano'nyena sakshina || 21|| sarvantarena purnashca
    brahma nanyena kenacit | yadidam brahmapucchakhyam satyajnanadvayatmakam || 22|| sarameva rasam labdhva
    sakshaddehi sanatanam | sukhi bhavati sarvatra anyatha sukhata kutah || 23|| asatyasminparanande svatmabhute'khilatmanam
    | ko jivati naro jantuh ko va nityam viceshtate || 24|| tasmatsarvatmana citte bhasamano hyasau narah
    | anandayati duhkhadhyam jivatmanam sada janah || 25|| yada hyevaisha etasminnadrishyatvadilakshane
    | nirbhedam paramadvaitam vindate ca mahayatih || 26|| tadevabhayamatyantakalyanam paramamritam |
    sadrupam paramam brahma triparicchedavarjitam || 27|| yada hyevaisha etasminnalpamapyantaram narah
    | vijanati tada tasya bhayam syannatra samshayah || 28|| asyaivanandakoshena stambanta vishnupurvakah
    | bhavanti sukhino nityam taratamyakramena tu || 29|| tattatpadaviraktasya shrotriyasya prasadinah
    | svarupabhuta anandah svayam bhati pare yatha || 30|| nimittam kimcidashritya khalu shabdah pravartate
    | yato vaco nivartante nimittanamabhavatah || 31|| nirvisheshe paranande katham shabdah pravartate
    | tasmadetanmanah sukshmam vyavritam sarvagocaram || 32|| yasmacchrotratvagakshyadikhadikarmendriyani
    ca | vyavrittani param praptum na samarthani tani tu || 33|| tadbrahmanandamadvandvam nirgunam satyacidghanam
    | viditva svatmarupena na bibheti kutashcana || 34|| evam yastu vijanati svagurorupadeshatah | sa
    sadhvasadhukarmabhyam sada na tapati prabhuh || 35|| tapyatapakarupena vibhatamakhilam jagat | pratyagatmataya
    bhati jnanadvedantavakyajat || 36|| shuddhamishvaracaitanyam jivacaitanyameva ca | pramata ca pramanam
    ca prameyam ca phalam tatha || 37|| iti saptavidham proktam bhidyate vyavaharatah | mayopadhivinirmuktam
    shuddhamityabhidhiyate || 38|| mayasambandhatashcesho jivo'vidyavashastatha | antahkaranasambandhatpramatetyabhidhiyate
    || 39|| tatha tadvrittisambandhatpramanamiti kathyate | ajnatamapi caitanyam prameyamiti kathyate
    || 40|| tatha jnatam ca caitanyam phalamityabhidhiyate | sarvopadhivinirmuktam svatmanam bhavayetsudhih
    || 41|| evam yo veda tattvena brahmabhuyaya kalpate | sarvavedantasiddhantasaram vacmi yatharthatah
    || 42|| svayam mritva svayam bhutva svayamevavashishyate || ityupanishat || om sahanavavatu saha nau
    bhunaktu saha viryam karavavahai || tejasvinavadhitamastu ma vidvishavahai || om shantih shantih shantih
    || harih om tatsat || iti katharudropanishatsamapta || adhikadhyayanaya
  devanagari: उपनिषद् कठरुद्रोपनिषत् परिव्रज्याधर्मपूगालंकारा यत्पदं ययुः । तदहं कठविद्यार्थं रामचन्द्रपदं
    भजे ॥ ॐ सहनाववतु सह नौ भुनक्तु सह वीर्यं करवावहै ॥ तेजस्विनावधीतमस्तु मा विद्विषावहै ॥ ॐ शान्तिः शान्तिः
    शान्तिः ॥ हरिः ॐ ॥ देवा ह वै भगवन्तमब्रुवन्नधीहि भगवन्ब्रह्मविद्याम् । स प्रजापतिरब्रवीत्सशिखान्केशान्निष्कृत्य
    विसृज्य यज्ञोपवीतं निष्कृत्य पुत्रं दृष्ट्वा त्वं ब्रह्मा त्वं यज्ञस्त्वं वषट्कार स्त्वमोङ्कारस्त्वं
    स्वाहा त्वं स्वधा त्वं धाता त्वं विधाता त्वं प्रतिष्ठाऽसीति वदेत् । अथ पुत्रो वदत्यहं ब्रह्माहं यज्ञोऽहं
    वषट्कारोऽहमोंकारोऽहं स्वाहाहं स्वधाहं धाताहं विधाताहं त्वष्टाहं प्रतिष्ठास्मीति । तान्येतान्यनुव्रजन्नाश्रुमापातयेत्
    । यदश्रुमापातयेत्प्रजां विच्च्हिन्द्यात् । प्रदक्षिणमावृत्त्यैतच्चैतच्चानवेक्षमाणाः प्रत्यायन्ति ।
    स स्वर्ग्यो भवति ब्रह्मचारी वेदमधीत्य वेदोक्ताचरितब्रह्मचर्यो दारानाहृत्य पुत्रानुत्पाद्य ताननुपादिभिर्वितत्येष्ट्वा
    च शक्तितो यज्ञैः । तस्य संन्यासो गुरुभिरनुज्ञातस्य बान्धवैश्च । सोऽरण्यं परेत्य द्वादशरात्रं पयसाग्निहोत्रं
    जुहुयात् । द्वादशरात्रं पयोभक्षा स्यात् । द्वादशरात्रस्यान्ते अग्नये वैश्वानराय प्रजापतये च प्राजापत्यं
    चरुं वैष्णवं त्रिकपालमग्निं संस्थितानि पूर्वाणि दारुपात्राण्याग्नौ जुहुयात् । मृण्मयान्यप्सु जुहुयात्
    । तैजसानि गुरवे दद्यात् । मा त्वं मामपहाय परागाः । नाहं त्वामपहाय परागामिति । गार्हपत्यदक्षिणाग्न्याहवनीयेष्वरणिदेशाद्भस्ममुष्टिं
    पिबेदित्येके । सशिखान्केशान्निष्कृत्य विसृज्य यज्ञोपवीतं भूःस्वाहेत्यप्सु जुहुयात् । अत ऊर्ध्वमनशनमपां
    प्रवेश मग्निप्रवेशं वीराध्वानं महाप्रस्थानं वृद्धाश्रमं वा गच्च्हेत् । पयसा यं प्राश्नीयात्सोऽस्य
    सायंहोमः । यत्प्रातः सोऽयं प्रातः । यद्दर्शे तद्दर्शनम् । यत्पौर्णमास्ये तत्पौर्णमास्यम् । यद्वसन्ते
    केशश्मश्रुलोमनखानि वापयेत्सोऽस्याग्निष्टोमः । संन्यस्याग्निं न पुनरावर्तयेन्मृत्युर्जयमावहमित्यध्यात्म
    मन्त्रान्पठेत् । स्वस्ति सर्वजीवेभ्य इत्युक्त्वात्मानमनन्यं ध्यायन् तदूर्ध्वबाहुर्विमुक्तमार्गो भवेत्
    । अनिकेतश्चरेत् । भिक्षाशी यत्किंचिन्नाद्यात् । लवैकं न धावयेज्जन्तुसंरक्षणार्थं वर्षवर्जमिति । तदपि
    श्लोका भवन्ति । कुण्डिकां चमसं शिक्यं त्रिविष्टमुपानहौ । शीतोपघातिनीं कन्थां कौपीनाच्च्हादनं तथा ॥
    १॥ पवित्रं ज्ञानशाटीं च उत्तरासङ्गमेव च । यज्ञोपवीतं वेदांश्च सर्वं तद्वर्जयेद्यतिः ॥ २॥ स्नानं पानं
    तथा शौचमद्भिः पूताभिराचरेत् । नदीपुलिनशायी स्याद्देवागारेषु वा स्वपेत् ॥ ३॥ नात्यर्थं सुखदुःखाभ्यां
    शरीरमुपतायेत् । स्तूयमानो न तुषेत निन्दितो न शपेत्परान् ॥ ४॥ ब्रह्मचर्येण संतिष्ठेदप्रमादेन मस्करी
    । दर्शनं स्पर्शनं केलिः कीर्तनं गुह्यभाषणम् ॥ ५॥ संकल्पोऽध्यवसायश्च क्रियान्निर्वृत्तिरेव च । एतन्मैथुनमष्टाङ्गं
    प्रवदन्ति मनीषिणः ॥ ६॥ विपरीतं ब्रह्मचर्यमनुष्ठेयं मुमुक्षुभिः । यज्जगद्भासकं भानं नित्यं भाति स्वतः
    स्फुरत् ॥ ७॥ स एव जगतः साक्षी सर्वात्मा विमलाकृतिः । प्रतिष्ठा सर्वभूतानां प्रज्ञानघनलक्षणः ॥ ८॥ न
    कर्मणा न प्रजया न चान्येनापि केचित् । ब्रह्मवेदनमात्रेण ब्रह्माप्नोत्येव मानवः ॥ ९॥ तद्विद्या विषयं
    ब्रह्म सत्यज्ञानसुखाद्वयम् । संसारे च गुहावाच्ये मायाज्ञानादिसंज्ञके ॥ १०॥ निहितं ब्रह्म यो वेद परमे
    व्योम्नि संज्ञिते । सोऽश्नुते सकलान्कामान्क्रमेणैव द्विजोत्तमः ॥ ११॥ प्रत्यगात्मानमज्ञानमायाशक्तेश्च
    साक्षिणम् । एकं ब्रह्माहमस्मीति ब्रह्मैव भवति स्वयम् ॥ १२॥ ब्रह्मभूतात्मनस्तस्मादेतस्माच्च्ह्क्तिमिश्रितात्
    । अपञ्चीकृत आकाशसंभूतो रज्जुसर्पवत् ॥ १३॥ आकाशाद्वायुसंज्ञस्तु स्पर्शोऽपञ्चीकृतः पुनः । वायोरग्निस्तथा
    चाग्नेराप अद्भ्यो वसुन्धरा ॥ १४॥ तानि भूतानि सूक्ष्माणि पञ्चीकृत्येश्वरस्तदा । तेभ्य एव विसृष्टं तद्ब्रह्माण्डादि
    शिवेन ह ॥ १५॥ ब्रह्माण्डस्योदरे देवा दानवा यक्षकिन्नराः । मनुष्याः पशुपक्ष्याद्यास्तत्तत्कर्मानुसारतः
    ॥ १६॥ अस्थिस्नाय्वादिरूपोऽयं शरीरं भाति देहिनाम् । योऽयमन्नमयो ह्यात्मा भाति सर्वशरीरिणः ॥ १७॥ ततः
    प्राणमयो ह्यात्मा विभिन्नश्चान्तरः स्थितः । ततो विज्ञान आत्मा तु ततोऽन्यश्चान्तरः स्वतः ॥ १८॥ आनन्दमय
    आत्मा तु ततोऽन्यश्चान्तरस्थितः । योऽयमन्नमयः सोऽयं पूर्णः प्राणमयेन तु ॥ १९॥ मनोमयेन प्राणोऽपि तथा
    पूर्णः स्वभावतः । तथा मनोमयो ह्यात्मा पूर्णो ज्ञानमयेन तु ॥ २०॥ आनन्देन सदा पूर्णः सदा ज्ञानमयः सुखम्
    । तथानन्दमयश्चापि ब्रह्मणोऽन्येन साक्षिणा ॥ २१॥ सर्वान्तरेण पूर्णश्च ब्रह्म नान्येन केनचित् । यदिदं
    ब्रह्मपुच्छाख्यं सत्यज्ञानद्वयात्मकम् ॥ २२॥ सारमेव रसं लब्ध्वा साक्षाद्देही सनातनम् । सुखी भवति सर्वत्र
    अन्यथा सुखता कुतः ॥ २३॥ असत्यस्मिन्परानन्दे स्वात्मभूतेऽखिलात्मनाम् । को जीवति नरो जन्तुः को वा नित्यं
    विचेष्टते ॥ २४॥ तस्मात्सर्वात्मना चित्ते भासमानो ह्यसौ नरः । आनन्दयति दुःखाढ्यं जीवात्मानं सदा जनः
    ॥ २५॥ यदा ह्येवैष एतस्मिन्नदृश्यत्वादिलक्षणे । निर्भेदं परमाद्वैतं विन्दते च महायतिः ॥ २६॥ तदेवाभयमत्यन्तकल्याणं
    परमामृतम् । सद्रूपं परमं ब्रह्म त्रिपरिच्च्हेदवर्जितम् ॥ २७॥ यदा ह्येवैष एतस्मिन्नल्पमप्यन्तरं नरः
    । विजानाति तदा तस्य भयं स्यान्नात्र संशयः ॥ २८॥ अस्यैवानन्दकोशेन स्तम्बान्ता विष्णुपूर्वकाः । भवन्ति
    सुखिनो नित्यं तारतम्यक्रमेण तु ॥ २९॥ तत्तत्पदविरक्तस्य श्रोत्रियस्य प्रसादिनः । स्वरूपभूत आनन्दः स्वयं
    भाति परे यथा ॥ ३०॥ निमित्तं किंचिदाश्रित्य खलु शब्दः प्रवर्तते । यतो वाचो निवर्तन्ते निमित्तानामभवतः
    ॥ ३१॥ निर्विशेषे परानन्दे कथं शब्दः प्रवर्तते । तस्मादेतन्मनः सूक्ष्मं व्यावृतं सर्वगोचरम् ॥ ३२॥ यस्माच्च्ह्रोत्रत्वगक्ष्यादिखादिकर्मेन्द्रियाणि
    च । व्यावृत्तानि परं प्राप्तुं न समर्थानि तानि तु ॥ ३३॥ तद्ब्रह्मानन्दमद्वन्द्वं निर्गुणं सत्यचिद्घनम्
    । विदित्वा स्वात्मरूपेण न बिभेति कुतश्चन ॥ ३४॥ एवं यस्तु विजानाति स्वगुरोरुपदेशतः । स साध्वासाधुकर्मभ्यां
    सदा न तपति प्रभुः ॥ ३५॥ ताप्यतापकरूपेण विभातमखिलं जगत् । प्रत्यगात्मतया भाति ज्ञानाद्वेदान्तवाक्यजात्
    ॥ ३६॥ शुद्धमीश्वरचैतन्यं जीवचैतन्यमेव च । प्रमाता च प्रमाणं च प्रमेयं च फलं तथा ॥ ३७॥ इति सप्तविधं
    प्रोक्तं भिद्यते व्यवहारतः । मायोपाधिविनिर्मुक्तं शुद्धमित्यभिधीयते ॥ ३८॥ मायासंबन्धतश्चेशो जीवोऽविद्यावशस्तथा
    । अन्तःकरणसंबन्धात्प्रमातेत्यभिधीयते ॥ ३९॥ तथा तद्वृत्तिसंबन्धात्प्रमाणमिति कथ्यते । अज्ञातमपि चैतन्यं
    प्रमेयमिति कथ्यते ॥ ४०॥ तथा ज्ञातं च चैतन्यं फलमित्यभिधीयते । सर्वोपाधिविनिर्मुक्तं स्वात्मानं भावयेत्सुधीः
    ॥ ४१॥ एवं यो वेद तत्त्वेन ब्रह्मभूयाय कल्पते । सर्ववेदान्तसिद्धान्तसारं वच्मि यथार्थतः ॥ ४२॥ स्वयं
    मृत्वा स्वयं भूत्वा स्वयमेवावशिष्यते ॥ इत्युपनिषत् ॥ ॐ सहनाववतु सह नौ भुनक्तु सह वीर्यं करवावहै ॥
    तेजस्विनावधीतमस्तु मा विद्विषावहै ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ हरिः ॐ तत्सत् ॥ इति कठरुद्रोपनिषत्समाप्ता
    ॥ अधिकाध्ययनाय
