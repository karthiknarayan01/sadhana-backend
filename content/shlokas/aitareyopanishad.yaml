id: aitareyopanishad
category: upanishad
name:
  english: aitareyopanishad
  devanagari: ऐतरेयोपनिषद्
content:
  english: upanishad || aitareya upanishat || || shantipathah || van me manasi pratishthita mano me vaci
    pratishthitamaviravirma edhi || vedasya ma anisthah shrutam me ma prahasiranenadhitenahoratran sandadhamyritam
    vadishyami satyam vadishyami || tanmamavatu tadvaktaramavatvavatu mamavatu vaktaramavatu vaktaram
    || || om shantih shantih shantih|| || atha aitareyopanishadi prathamadhyaye prathamah khandah || atma
    va idameka evagra asinnanyatkincacana | sa ikshata lokannu srija iti || 1 || sa ima~llokanasrijata
    | ambho maricirmapo'do'mbhah parena divam dyauh pratishtha'ntariksham maricayah | prithivi maro ya
    adhastatta apah || 2 || sa ikshateme nu loka lokapalannu srija iti || so'dbhya eva purusham samuddhrityamurchayat
    || 3 || tamabhyatapattasyabhitaptasya mukham nirabhidyata yatha'ndam mukhadvagvaco'gnirnasike nirabhidyetam
    nasikabhyam pranah | pranadvayurakshini nirabhidyetamakshibhyam cakshushcakshusha adityah karnau nirabhidyetam
    karnabhyam shrotram shrotraddishastvannirabhidyata tvaco lomani lomabhya oshadhivanaspatayo hridayam
    nirabhidyata hridayanmano manasashcandrama nabhirnirabhidyata nabhya apano'pananmrityuh shishnam nirabhidyata
    shishnadreto retasa apah || 4 || || atha aitareyopanishadi prathamadhyaye dvitiyah khandah || ta eta
    devata srishta asminmahatyarnave prapatan | tamashanapipasabhyamanvavarjat | ta enamabruvannayatanam
    nah prajanihi yasminpratishthita annamadameti || 1 || tabhyo gamanayatta abruvanna vai no'yamalamiti
    | tabhyo'shvamanayatta abruvanna vai no'yamalamiti || 2 || tabhyah purushamanayatta abruvan sukritam
    bateti purusho vava sukritam | ta abravidyathayatanam pravishateti || 3 || agnirvagbhutva mukham pravishadvayuh
    prano bhutva nasike pravishadadityashcakshurbhutva'kshini pravishaddishah shrotram bhutva karnau pravishannoshadhivanaspatayo
    lomani bhutva tvacam pravishamshcandrama mano bhutva hridayam pravishanmrityurapano bhutva nabhim
    pravishadapo reto bhutva shishnam pravishan || 4 || tamashanayapipase abrutamavabhyamabhiprajanihiti
    te abravidetasveva vam devatasvabhajamyetasu bhaginyau karomiti | tasmadyasyai kasyai ca devatayai
    havirgrihyate bhaginyavevasyamashanayapipase bhavatah || 5 || || atha aitareyopanishadi prathamadhyaye
    tritiyah khandah || sa ikshateme nu lokashca lokapalashcannamebhyah srija iti || 1 || so'po'bhyatapattabhyo'bhitaptabhyo
    murtirajayata | ya vai sa murtirajayatannam vai tat || 2 || tadenatsrishtam parantyajighamsattadvaca'jighrikshat
    tannashaknodvaca grahitum | sa yaddhainadvaca'grahaishyadabhivyahritya haivannamatrapsyat || 3 ||
    tatpranenajighrikshat tannashaknotpranena grahitum | sa yaddhainatpranenagrahaishyadabhipranya haivannamatrapsyat
    || 4 || taccakshusha'jighrikshat tannashaknoccakshusha grahitum | sa yaddhainaccakshusha'grahaishyaddrishtva
    haivanamatrapsyat || 5 || tacchrotrenajighrikshat tannashaknocchrotrena grahitum | sa yaddhainacchrotrenagrahaishyacchrutva
    haivannamatrapsyat || 6 || tattvaca'jighrikshat tannashaknottvaca grahitum | sa yaddhainattvaca'grahaishyat
    sprishtva haivannamatrapsyat || 7 || tanmanasa'jighrikshat tannashaknonmanasa grahitum | sa yaddhainanmanasa'grahaishyaddhyatva
    haivannamatrapsyat || 8 || tacchishnenajighrikshat tannashaknocchishnena grahitum | sa yaddhainacchishnenagrahaishyadvitsrijya
    haivanamatrapsyat || 9 || tadapanenajighrikshat tadavayat saisho'nnasya graho yadvayuranayurva esha
    yadvayuh || 10 || sa ikshata katham nvidam madrite syaditi sa ikshata katarena prapadya iti | sa ikshata
    yadi vaca'bhivyahritam yadi pranenabhipranitam yadi cakshusha drishtam yadi shrotrena shrutam yadi
    tvaca sprishtam yadi manasa dhyatam yadyapanenabhyapanitam yadi shishnena visrishtamatha ko'hamiti
    || 11 || sa etameva simanam vidaryaitaya dvara prapadyata | saisha vidritirnama dvastadetanna'ndanam
    | tasya traya avasathastrayah svapna ayamavasatho'yamavasatho'yamavasatha iti ||12|| sa jato bhutanyabhivyaikhyat
    kimihanyam vavadishaditi | sa etameva purusham brahma tatamamapashyat | idamadarshanamiti 3 || 13
    || tasmadidandro namedandro ha vai nama tamidandram santamindra ityacakshate parokshena | parokshapriya
    iva hi devah parokshapriya iva hi devah || 14 || || atha aitaropanishadi dvitiyodhyayah || purushe
    ha va ayamadito garbho bhavati yadetadretah | tadetatsarvebhyo'ngebhyastejah sambhutamatmanyeva''tmanam
    bibharti tadyada striyam sincatyathainajjanayati tadasya prathamam janma || 1 || tatstriya atmabhuyam
    gacchati yatha svamangam tatha | tasmadenam na hinasti | sa'syaitamatmanamatra gatam bhavayati ||
    2 || sa bhavayitri bhavayitavya bhavati | tam stri garbha bibharti | so'gra eva kumaram janmano'gre'dhibhavayati
    | sa yatkumaram janmano'gre'dhibhavayatyatmanameva tadbhavayatyesham lokanam santatya | evam santata
    hime lokastadasya dvitiyam janma || 3 || so'syayamatma punyebhyah karmabhyah pratidhiyate | athasyayamitara
    atma kritakrityo vayogatah praiti | sa itah prayanneva punarjayate tadasya tritiyam janma || 4 ||
    taduktamrishina garbhe nu sannanveshamavedamaham devanam janimani vishva shatam ma pura ayasirarakshannadhah
    shyeno javasa niradiyamiti | garbha evaitacchayano vamadeva evamuvaca ||5|| sa evam vidvanasmaccharirabhedadurdhva
    utkramyamushmin svarge loke sarvan kamanaptva'mritah samabhavat samabhavat || 6 || || atha aitaropanishadi
    tritiyodhyayah || ko'yamatmeti vayamupasmahe katarah sa atma | yena va pashyati yena va shrinoti yena
    va gandhanajighrati yena va vacam vyakaroti yena va svadu casvadu ca vijanati || 1 || yadetaddhridayam
    manashcaitat | sanjnanamajnanam vijnanam prajnanam medha drishtidhrirtimatirmanisha jutih smritih
    sankalpah kraturasuh kamo vasha iti | sarvanyevaitani prajnanasya namadheyani bhavanti || 2 || esha
    brahmaisha indra esha prajapatirete sarve deva imani ca pancamahabhutani prithivi vayurakasha apo
    jyotimshityetanimani ca kshudramishraniva | bijanitarani cetarani candajani ca jarujani ca svedajani
    codbhijjani cashva gavah purusha hastino yatkincedam prani jangamam ca patatri ca yacca sthavaram
    sarvam tatprajnanetram prajnane pratishthitam prajnanetro lokah prajna pratishtha prajnanam brahma
    || 3 || sa etena prajnena''tmana'smallokadutkramyamushminsvarge loke sarvan kamanaptva'mritah samabhavat
    samabhavat || 4 || || iti ètareyopanishat samapta || adhikadhyayanaya
  devanagari: उपनिषद् ॥ ऐतरेय उपनिषत् ॥ ॥ शान्तिपाठः ॥ वाङ् मे मनसि प्रतिष्ठिता मनो मे वाचि प्रतिष्ठितमाविरावीर्म
    एधि ॥ वेदस्य म आणीस्थः श्रुतं मे मा प्रहासीरनेनाधीतेनाहोरात्रान् सन्दधाम्यृतं वदिष्यामि सत्यं वदिष्यामि
    ॥ तन्मामवतु तद्वक्तारमवत्ववतु मामवतु वक्तारमवतु वक्तारम् ॥ ॥ ॐ शान्तिः शान्तिः शान्तिः॥ ॥ अथ ऐतरेयोपनिषदि
    प्रथमाध्याये प्रथमः खण्डः ॥ आत्मा वा इदमेक एवाग्र आसीन्नान्यत्किञ्चचन । स ईक्षत लोकान्नु सृजा इति
    ॥ १ ॥ स इमाँल्लोकानसृजत । अम्भो मरीचीर्मापोऽदोऽम्भः परेण दिवं द्यौः प्रतिष्ठाऽन्तरिक्षं मरीचयः । पृथिवी
    मरो या अधस्तात्त आपः ॥ २ ॥ स ईक्षतेमे नु लोका लोकपालान्नु सृजा इति ॥ सोऽद्भ्य एव पुरुषं समुद्धृत्यामूर्छयत्
    ॥ ३ ॥ तमभ्यतपत्तस्याभितप्तस्य मुखं निरभिद्यत यथाऽण्डं मुखाद्वाग्वाचोऽग्निर्नासिके निरभिद्येतं नासिकाभ्यां
    प्राणः । प्राणाद्वायुरक्षिणी निरभिद्येतमक्षिभ्यां चक्षुश्चक्षुष आदित्यः कर्णौ निरभिद्येतां कर्णाभ्यां
    श्रोत्रं श्रोत्रद्दिशस्त्वङ्निरभिद्यत त्वचो लोमानि लोमभ्य ओषधिवनस्पतयो हृदयं निरभिद्यत हृदयान्मनो
    मनसश्चन्द्रमा नाभिर्निरभिद्यत नाभ्या अपानोऽपानान्मृत्युः शिश्नं निरभिद्यत शिश्नाद्रेतो रेतस आपः ॥
    ४ ॥ ॥ अथ ऐतरेयोपनिषदि प्रथमाध्याये द्वितीयः खण्डः ॥ ता एता देवता सृष्टा अस्मिन्महत्यर्णवे प्रापतन्
    । तमशनापिपासाभ्यामन्ववार्जत् । ता एनमब्रुवन्नायतनं नः प्रजानीहि यस्मिन्प्रतिष्ठिता अन्नमदामेति ॥ १
    ॥ ताभ्यो गामानयत्ता अब्रुवन्न वै नोऽयमलमिति । ताभ्योऽश्वमानयत्ता अब्रुवन्न वै नोऽयमलमिति ॥ २ ॥ ताभ्यः
    पुरुषमानयत्ता अब्रुवन् सुकृतं बतेति पुरुषो वाव सुकृतम् । ता अब्रवीद्यथायतनं प्रविशतेति ॥ ३ ॥ अग्निर्वाग्भूत्वा
    मुखं प्राविशद्वायुः प्राणो भूत्वा नासिके प्राविशदादित्यश्चक्षुर्भूत्वाऽक्षिणी प्राविशद्दिशः श्रोत्रं
    भूत्वा कर्णौ प्राविशन्नोषधिवनस्पतयो लोमानि भूत्वा त्वचं प्राविशंश्चन्द्रमा मनो भूत्वा हृदयं प्राविशन्मृत्युरपानो
    भूत्वा नाभिं प्राविशदापो रेतो भूत्वा शिश्नं प्राविशन् ॥ ४ ॥ तमशनायापिपासे अब्रूतामावाभ्यामभिप्रजानीहीति
    ते अब्रवीदेतास्वेव वां देवतास्वाभजाम्येतासु भागिन्यौ करोमीति । तस्माद्यस्यै कस्यै च देवतायै हविर्गृह्यते
    भागिन्यावेवास्यामशनायापिपासे भवतः ॥ ५ ॥ ॥ अथ ऐतरेयोपनिषदि प्रथमाध्याये तृतीयः खण्डः ॥ स ईक्षतेमे नु
    लोकाश्च लोकपालाश्चान्नमेभ्यः सृजा इति ॥ १ ॥ सोऽपोऽभ्यतपत्ताभ्योऽभितप्ताभ्यो मूर्तिरजायत । या वै सा
    मूर्तिरजायतान्नं वै तत् ॥ २ ॥ तदेनत्सृष्टं पराङ्त्यजिघांसत्तद्वाचाऽजिघृक्षत् तन्नाशक्नोद्वाचा ग्रहीतुम्
    । स यद्धैनद्वाचाऽग्रहैष्यदभिव्याहृत्य हैवान्नमत्रप्स्यत् ॥ ३ ॥ तत्प्राणेनाजिघृक्षत् तन्नाशक्नोत्प्राणेन
    ग्रहीतुम् । स यद्धैनत्प्राणेनाग्रहैष्यदभिप्राण्य हैवान्नमत्रप्स्यत् ॥ ४ ॥ तच्चक्षुषाऽजिघृक्षत् तन्नाशक्नोच्चक्षुषा
    ग्रहीतुम् । स यद्धैनच्चक्षुषाऽग्रहैष्यद्दृष्ट्वा हैवानमत्रप्स्यत् ॥ ५ ॥ तच्छ्रोत्रेणाजिघृक्षत् तन्नाशक्नोच्छ्रोत्रेण
    ग्रहीतुम् । स यद्धैनच्छ्रोत्रेणाग्रहैष्यच्छ्रुत्वा हैवान्नमत्रप्स्यत् ॥ ६ ॥ तत्त्वचाऽजिघृक्षत् तन्नाशक्नोत्त्वचा
    ग्रहीतुम् । स यद्धैनत्त्वचाऽग्रहैष्यत् स्पृष्ट्वा हैवान्नमत्रप्स्यत् ॥ ७ ॥ तन्मनसाऽजिघृक्षत् तन्नाशक्नोन्मनसा
    ग्रहीतुम् । स यद्धैनन्मनसाऽग्रहैष्यद्ध्यात्वा हैवान्नमत्रप्स्यत् ॥ ८ ॥ तच्छिश्नेनाजिघृक्षत् तन्नाशक्नोच्छिश्नेन
    ग्रहीतुम् । स यद्धैनच्छिश्नेनाग्रहैष्यद्वित्सृज्य हैवानमत्रप्स्यत् ॥ ९ ॥ तदपानेनाजिघृक्षत् तदावयत्
    सैषोऽन्नस्य ग्रहो यद्वायुरनायुर्वा एष यद्वायुः ॥ १० ॥ स ईक्षत कथं न्विदं मदृते स्यादिति स ईक्षत कतरेण
    प्रपद्या इति । स ईक्षत यदि वाचाऽभिव्याहृतं यदि प्राणेनाभिप्राणितं यदि चक्षुषा दृष्टं यदि श्रोत्रेण
    श्रुतं यदि त्वचा स्पृष्टं यदि मनसा ध्यातं यद्यपानेनाभ्यपानितं यदि शिश्नेन विसृष्टमथ कोऽहमिति ॥ ११
    ॥ स एतमेव सीमानं विदर्यैतया द्वारा प्रापद्यत । सैषा विदृतिर्नाम द्वास्तदेतन्नाऽन्दनम् । तस्य त्रय
    आवसथास्त्रयः स्वप्ना अयमावसथोऽयमावसथोऽयमावसथ इति ॥१२॥ स जातो भूतान्यभिव्यैख्यत् किमिहान्यं वावदिषदिति
    । स एतमेव पुरुषं ब्रह्म ततममपश्यत् । इदमदर्शनमिती ३ ॥ १३ ॥ तस्मादिदन्द्रो नामेदन्द्रो ह वै नाम तमिदन्द्रं
    सन्तमिन्द्र इत्याचक्षते परोक्षेण । परोक्षप्रिया इव हि देवाः परोक्षप्रिया इव हि देवाः ॥ १४ ॥ ॥ अथ ऐतरोपनिषदि
    द्वितीयोध्यायः ॥ पुरुषे ह वा अयमादितो गर्भो भवति यदेतद्रेतः । तदेतत्सर्वेभ्योऽङ्गेभ्यस्तेजः सम्भूतमात्मन्येवऽऽत्मानं
    बिभर्ति तद्यदा स्त्रियां सिञ्चत्यथैनज्जनयति तदस्य प्रथमं जन्म ॥ १ ॥ तत्स्त्रिया आत्मभूयं गच्छति यथा
    स्वमङ्गं तथा । तस्मादेनां न हिनस्ति । साऽस्यैतमात्मानमत्र गतं भावयति ॥ २ ॥ सा भावयित्री भावयितव्या
    भवति । तं स्त्री गर्भ बिभर्ति । सोऽग्र एव कुमारं जन्मनोऽग्रेऽधिभावयति । स यत्कुमारं जन्मनोऽग्रेऽधिभावयत्यात्मानमेव
    तद्भावयत्येषां लोकानां सन्तत्या । एवं सन्तता हीमे लोकास्तदस्य द्वितीयं जन्म ॥ ३ ॥ सोऽस्यायमात्मा पुण्येभ्यः
    कर्मभ्यः प्रतिधीयते । अथास्यायामितर आत्मा कृतकृत्यो वयोगतः प्रैति । स इतः प्रयन्नेव पुनर्जायते तदस्य
    तृतीयं जन्म ॥ ४ ॥ तदुक्तमृषिणा गर्भे नु सन्नन्वेषामवेदमहं देवानां जनिमानि विश्वा शतं मा पुर आयसीररक्षन्नधः
    श्येनो जवसा निरदीयमिति । गर्भ एवैतच्छयानो वामदेव एवमुवाच ॥५॥ स एवं विद्वानस्माच्छरीरभेदादूर्ध्व उत्क्रम्यामुष्मिन्
    स्वर्गे लोके सर्वान् कामानाप्त्वाऽमृतः समभवत् समभवत् ॥ ६ ॥ ॥ अथ ऐतरोपनिषदि तृतीयोध्यायः ॥ कोऽयमात्मेति
    वयमुपास्महे कतरः स आत्मा । येन वा पश्यति येन वा शृणोति येन वा गन्धानाजिघ्रति येन वा वाचं व्याकरोति
    येन वा स्वादु चास्वादु च विजानाति ॥ १ ॥ यदेतद्धृदयं मनश्चैतत् । सञ्ज्ञानमाज्ञानं विज्ञानं प्रज्ञानं
    मेधा दृष्टिधृर्तिमतिर्मनीषा जूतिः स्मृतिः सङ्कल्पः क्रतुरसुः कामो वश इति । सर्वाण्येवैतानि प्रज्ञानस्य
    नामधेयानि भवन्ति ॥ २ ॥ एष ब्रह्मैष इन्द्र एष प्रजापतिरेते सर्वे देवा इमानि च पञ्चमहाभूतानि पृथिवी
    वायुराकाश आपो ज्योतींषीत्येतानीमानि च क्षुद्रमिश्राणीव । बीजानीतराणि चेतराणि चाण्डजानि च जारुजानि
    च स्वेदजानि चोद्भिज्जानि चाश्वा गावः पुरुषा हस्तिनो यत्किञ्चेदं प्राणि जङ्गमं च पतत्रि च यच्च स्थावरं
    सर्वं तत्प्रज्ञानेत्रं प्रज्ञाने प्रतिष्ठितं प्रज्ञानेत्रो लोकः प्रज्ञा प्रतिष्ठा प्रज्ञानं ब्रह्म
    ॥ ३ ॥ स एतेन प्राज्ञेनाऽऽत्मनाऽस्माल्लोकादुत्क्रम्यामुष्मिन्स्वर्गे लोके सर्वान् कामानाप्त्वाऽमृतः
    समभवत् समभवत् ॥ ४ ॥ ॥ इति ऎतरेयोपनिषत् समाप्ता ॥ अधिकाध्ययनाय
