id: durgasahasranamastotram
category: sahasranama
name:
  english: durgasahasranamastotram
  devanagari: दुर्गासहस्रनामस्तोत्रम्
content:
  english: ringastha gandhini suratalasa || 108|| kadambari kantimati kanta kadambarashana | madhudanavavidravi
    madhupa patalaruna || 109|| ratrincara rakshasaghni ramya ratrisamarcita | shivaratrimahapujya devalokaviharini
    || 110|| dhyanadikalasanjapya bhaktasantanabhagyada | madhyahnakalasantarpya jayasamharashulini ||
    111|| triyambaka makhadhvamsi tripura purashulini | rangastha ranjini ranga sindurarunashalini ||
    112|| sundopasundahantri tu sukshma mohanashulini | ashtamurtih kalanatha cashtahasta sutaprada ||
    113|| angaraka kopanakshi hamsasuramadapaha | apinastananamrangi haridralepitastani || 114|| indrakshi
    hemasankasha hemavastra harapriya | ishvari tvitihasatma itibadhanivarini || 115|| upasya conmadakara
    hyullanghitasurapaga | usharasthalakasara hyutpalashyamalakritih || 116|| rinmayi samasangita shuddhih
    kalpakavallari | sayantanahutirdasakamadhenusvarupini || 117|| pancadashaksharimantra tarakavritashodashi
    | hrinkaranishtha hrinkarahunkari duritapaha || 118|| shadanga navakonastha trikona sarvatomukhi |
    sahasravadana padma shulini surapalini || 119|| mahashuladhara shaktirmata mahendrapujita | shuladurga
    shulahara shobhana caiva shulini || 120|| shrishulini jagadbija mulahankarashulini | prakasha paramakasha
    bhavita virashulini || 121|| narasimhi mahendrani salisharabhashulini | rinkaryritumati caivaghora'tharvanagopika
    || 122|| ghoraghora japaragaprasunancitamalika | susvarupa sauhridadhyalidha dadimapataka || 123||
    laya ca lampata lina kunkumarunakandhara | ikaradhyatvilanatha tvilavritajanavrita || 124|| aishvaryanishtha
    harita haritalasamaprabha | mudgamashajyabhojya ca yuktayuktabhatanvita || 125|| autsuki canimadgamya
    tvakhilandanivasini | hamsamuktamanishrenih hamsakhya hasakarini || 126|| kalidoshahara kshirapayini
    viprapujita | khatvangastha khadgarupa khabija kharasudana || 127|| ajyapayinyasthimala parthivaradhyapaduka
    | gambhiranabhikasiddhakinnarastri samavrita || 128|| khadgatmika ghananibha vaishyarcya makshikapriya
    | makaravarna gambhira shudrarcya casavapriya || 129|| caturi parvanaradhya muktadhavalyarupini |
    chandomayi bhaumapujya dushtashatruvinashini || 130|| jayini cashtamisevya krurahomasamanvita | jhankari
    navamipujya langalikusumapriya || 131|| sada caturdashipujya bhaktanam pushtikarini | jnanagamya darshapujya
    damari ripumarini || 132|| satyasankalpasamvedya kalikalasusandhika | dambhakara kalpasiddha shalyakautukavardhini
    || 133|| thakritih kavivararadhya sarvasampatpradayika | navaratridinaradhya rashtrada rashtravardhini
    || 134|| panasavamadadhvamsimulikasiddhidayini | phalaprada kuberadhya parijataprasunabhak || 135||
    balimantraughasamsiddha mantracintyaphalavaha | bhaktipriya bhaktigamya kinkara bhagamalini || 136||
    madhavi vipinantasstha mahati mahishardini | yajurvedagata shankhacakrahastambujadvaya || 137|| rajasa
    rajamatangi rakacandranibhanana | laghavalaghavaradhya ramanijanamadhyaga || 138|| vagishvari vakulamalya
    vanmayi varitasukha | sharabhadhishavanita candramandalamadhyaga || 139|| shadadhvantaratara ca raktajushtahutavaha
    | tattvajnananandakalamaya sayujyasadhana || 140|| karmasadhakasamlinadhanadarshanada sada | hankarika
    sthavaratma tvamarilasyamodana || 141|| lakaratrayasambhuta lalita lakshmanarcita | lakshmamurtissadahara
    prasadavasalocana || 142|| nilakanthi haridrashmih shuki gauri ca gotraja | aparna yakshini yaksha
    haridra halini hali || 143|| dadati cormada cormi rasa vishvambhara sthira | pancasya pancamiraga
    bhagyayogatmikambika || 144|| ganika caiva kali ca vina shonarunatmika | ramaduti kalasimhi lajja
    dhumavati jada || 145|| bhringisangisakhi pina sneharogamanasvini | ranimrida dridha jyeshtha ramani
    yamunarata || 146|| musalikunthitamota candakhanda ganabala | shukla srashtrivasha jnanimani lilalaka
    shaci || 147|| suracandraghriniryoshaviryakrida rasavaha | nutna soma maharajni gayayagahutaprabha
    || 148|| dhurta sudhaghanalinapushtimrishtasudhakara | karini kamini muktamanishreni phanishvara ||
    149|| tarkshi sukshma natacarya gaurika girijangana | indrajala cendumukhitvindropendradi samstuta
    || 150|| shivaduti ca garalashitikanthakutumbini | jvalantijvalanakara jvalajjajvalyajambhada || 151||
    jvalashaya jvalamanirjyotisham gatireva hi | jyotihshastranumeyatma jyotishi jvalitojjvala || 152||
    jyotishmati durgavasi jyotsnabha jvalanarcita | lankari lalitavasa lalitalalitatmika || 153|| lankadhipa
    lasyalola layabhogamayalaya | lavanyashalini lola langala lalitambika || 154|| lanchana lampatalanghya
    lakularnavamuktida | lalatanetra lajjadhya lasyalapamudakara || 155|| jvalakritirjvaladbija jyotirmandalamadhyaga
    | jyotisstambha jvaladvirya jvalanmantra jvalatphala || 156|| jushira jumpata jyotirmalika jyotikasmita
    | jvaladvalayahastabja jvalatprajvalakojjvala || 157|| jvalamalya jagajjvala jvalajjvalanasajjvala
    | lambija lelihanatma lilaklinna layavaha || 158|| lajjavati labdhaputri lakini lolakundala | labdhabhagya
    labdhakama labdhadhirlabdhamangala || 159|| labdhavirya labdhavrita labha labdhavinashini | lasadvastra
    lasatpida lasanmalya lasatprabha || 160|| shulahasta shurasevya shulini shulanashini | shunkrityanumatih
    shurpashobhana shurpadharini || 161|| shulastha shuracittastha shula shuklasurarcita | shuklapadmasanarudha
    shukla shuklambaramshuka || 162|| shukalalitahastabja shveta shukanuta shubha | lalitaksharamantrastha
    liptakunkumabhasura || 163|| lipirupa liptabhasma liptacandanapankila | lilabhashanasamlola linakasturikadrava
    || 164|| likhitambujacakrastha likhyalikhitavaibhava | nilalaka nitimati nitishastrasvarupini || 165||
    nicaghni nishkala nitya nilakanthapriyangana | nirasha nirgunatita nirmada nirupaplava || 166|| nirnita
    nirmala nishtha nirankushaparakrama | nirvinnadanavabala nishsheshikritataraka || 167|| niranjanakaramantri
    nirvighnaparanashini | nityaklinna nirahara nivinilambarancita || 168|| nishakarakuladhvamsi nityanandaparampara
    | nimbapriya niravesha nindi tasurasundari || 169|| nirghosha nigalakrishtakrittijjvalavritangana
    | nirasa nityakalyani nirantarasukhaprada || 170|| nirlobha nitimatprita nirvighna nimishapaha | dumbija
    dushtasamhari durmada duritapaha || 171|| durutsahamahavirya durmedhotsavanashini | durmamsabhakshini
    dushta durikritanishacara || 172|| duti dushtagrahamadacumbi durbalarakshaki | shtankari shtammayi
    shtambha shtambija shtambhakilaka || 173|| graheshvari graharadhya grahanirogamocini | grahaveshakari
    grahya grahagramabhirakshini || 174|| gramaushadhamahavirya gramyasarvabhayapaha | grahadveshi graharudha
    gramanirgramadevata || 175|| grihitabrahmamukhyastra grihitayudhashaktida | grasamamsa grihastharcya
    grahabhutanivarini || 176|| hambhuta haladhriksevya haraharikucancala | harshaprada hararadhya hasanindyanishakara
    || 177|| havirbhoktri haridrabha haritashvadhirohini | haritpatisamaradhya halakrishtasurasura ||
    178|| haritashukavatpanih hayamedhabhirakshaki | hamsakshari hamsabija hahakaraharashuga || 179||
    hayyangavinahridvrittih haritamshumanidyutih | hunkaratma hutahomya hunkaralayanayika || 180|| hunkarapanjarashuki
    hunkarakamalendira | hunkararatrikajyotsna hunkaradrumamanjari || 181|| hunkaradipikajvala hunkararnavakaumudi
    | humphatkari humphatdyutih hunkarakashabhaskara || 182|| phatkari sphatikakara sphatikakshakarambuja
    | phatkilaka phadastra ca phatkarahishikhamanih || 183|| phatkarasumanomadhvi phatkarakamalendira
    | phatkarasaudhasha
  devanagari: ृङ्गस्था गन्धिनी सुरतालसा ॥ १०८॥ कादम्बरी कान्तिमती कान्ता कादम्बराशना । मधुदानवविद्रावी
    मधुपा पाटलारुणा ॥ १०९॥ रात्रिञ्चरा राक्षसघ्नी रम्या रात्रिसमर्चिता । शिवरात्रिमहापूज्या देवलोकविहारिणी
    ॥ ११०॥ ध्यानादिकालसञ्जप्या भक्तसन्तानभाग्यदा । मध्याह्नकालसन्तर्प्या जयसंहारशूलिनी ॥ १११॥ त्रियम्बका
    मखध्वंसी त्रिपुरा पुरशूलिनी । रङ्गस्था रञ्जिनी रङ्गा सिन्दूरारुणशालिनी ॥ ११२॥ सुन्दोपसुन्दहन्त्री
    तु सूक्ष्मा मोहनशूलिनी । अष्टमूर्तिः कलानाथा चाष्टहस्ता सुतप्रदा ॥ ११३॥ अङ्गारका कोपनाक्षी हंसासुरमदापहा
    । आपीनस्तननम्राङ्गी हरिद्रालेपितस्तनी ॥ ११४॥ इन्द्राक्षी हेमसङ्काशा हेमवस्त्रा हरप्रिया । ईश्वरी त्वितिहासात्मा
    ईतिबाधानिवारिणी ॥ ११५॥ उपास्या चोन्मदाकारा ह्युल्लङ्घितसुरापगा । ऊषरस्थलकासारा ह्युत्पलश्यामलाकृतिः
    ॥ ११६॥ ऋङ्मयी सामसङ्गीता शुद्धिः कल्पकवल्लरी । सायन्तनहुतिर्दासकामधेनुस्वरूपिणी ॥ ११७॥ पञ्चदशाक्षरीमन्त्रा
    तारकावृतषोडशी । ह्रीङ्कारनिष्ठा ह्रीङ्कारहुङ्कारी दुरितापहा ॥ ११८॥ षडङ्गा नवकोणस्था त्रिकोणा सर्वतोमुखी
    । सहस्रवदना पद्मा शूलिनी सुरपालिनी ॥ ११९॥ महाशूलधरा शक्तिर्माता माहेन्द्रपूजिता । शूलदुर्गा शूलहरा
    शोभना चैव शूलिनी ॥ १२०॥ श्रीशूलिनी जगद्बीजा मूलाहङ्कारशूलिनी । प्रकाशा परमाकाशा भाविता वीरशूलिनी ॥
    १२१॥ नारसिंही महेन्द्राणी सालीशरभशूलिनी । ऋङ्कार्यृतुमती चैवाघोराऽथर्वणगोपिका ॥ १२२॥ घोरघोरा जपारागप्रसूनाञ्चितमालिका
    । सुस्वरूपा सौहृदाढ्यालीढा दाडिमपाटका ॥ १२३॥ लया च लम्पटा लीना कुङ्कुमारुणकन्धरा । इकाराध्यात्विलानाथा
    त्विलावृतजनावृता ॥ १२४॥ ऐश्वर्यनिष्ठा हरिता हरितालसमप्रभा । मुद्गमाषाज्यभोज्या च युक्तायुक्तभटान्विता
    ॥ १२५॥ औत्सुकी चाणिमद्गम्या त्वखिलाण्डनिवासिनी । हंसमुक्तामणिश्रेणिः हंसाख्या हासकारिणी ॥ १२६॥ कलिदोषहरा
    क्षीरपायिनी विप्रपूजिता । खट्वाङ्गस्था खड्गरूपा खबीजा खरसूदना ॥ १२७॥ आज्यपायिन्यस्थिमाला पार्थिवाराध्यपादुका
    । गम्भीरनाभिकासिद्धकिन्नरस्त्री समावृता ॥ १२८॥ खड्गात्मिका घननिभा वैश्यार्च्या माक्षिकप्रिया । मकारवर्णा
    गम्भीरा शूद्रार्च्या चासवप्रिया ॥ १२९॥ चातुरी पार्वणाराध्या मुक्ताधावल्यरूपिणी । छन्दोमयी भौमपूज्या
    दुष्टशत्रुविनाशिनी ॥ १३०॥ जयिनी चाष्टमीसेव्या क्रूरहोमसमन्विता । झङ्कारी नवमीपूज्या लाङ्गलीकुसुमप्रिया
    ॥ १३१॥ सदा चतुर्दशीपूज्या भक्तानां पुष्टिकारिणी । ज्ञानगम्या दर्शपूज्या डामरी रिपुमारिणी ॥ १३२॥ सत्यसङ्कल्पसंवेद्या
    कलिकालसुसन्धिका । डम्भाकारा कल्पसिद्धा शल्यकौतुकवर्धिनी ॥ १३३॥ ठाकृतिः कविवराराध्या सर्वसम्पत्प्रदायिका
    । नवरात्रिदिनाराध्या राष्ट्रदा राष्ट्रवर्धिनी ॥ १३४॥ पानासवमदध्वंसिमूलिकासिद्धिदायिनी । फलप्रदा कुबेराध्या
    पारिजातप्रसूनभाक् ॥ १३५॥ बलिमन्त्रौघसंसिद्धा मन्त्रचिन्त्यफलावहा । भक्तिप्रिया भक्तिगम्या किङ्करा
    भगमालिनी ॥ १३६॥ माधवी विपिनान्तस्स्था महती महिषार्दिनी । यजुर्वेदगता शङ्खचक्रहस्ताम्बुजद्वया ॥ १३७॥
    राजसा राजमातङ्गी राकाचन्द्रनिभानना । लाघवालाघवाराध्या रमणीजनमध्यगा ॥ १३८॥ वागीश्वरी वकुलमाल्या वाङ्मयी
    वारितासुखा । शरभाधीशवनिता चन्द्रमण्डलमध्यगा ॥ १३९॥ षडध्वान्तरतारा च रक्तजुष्टाहुतावहा । तत्त्वज्ञानानन्दकलामया
    सायुज्यसाधना ॥ १४०॥ कर्मसाधकसंलीनधनदर्शनदा सदा । हङ्कारिका स्थावरात्मा त्वमरीलास्यमोदना ॥ १४१॥ लकारत्रयसम्भूता
    ललिता लक्ष्मणार्चिता । लक्ष्ममूर्तिस्सदाहारा प्रासादावासलोचना ॥ १४२॥ नीलकण्ठी हरिद्रश्मिः शुकी गौरी
    च गोत्रजा । अपर्णा यक्षिणी यक्षा हरिद्रा हलिनी हली ॥ १४३॥ ददती चोर्मदा चोर्मी रसा विश्वम्भरा स्थिरा
    । पञ्चास्या पञ्चमीरागा भाग्ययोगात्मिकाम्बिका ॥ १४४॥ गणिका चैव काली च वीणा शोणारुणात्मिका । रमादूती
    कलासिंही लज्जा धूमवती जडा ॥ १४५॥ भृङ्गिसङ्गिसखी पीना स्नेहारोगमनस्विनी । रणीमृडा दृढा ज्येष्ठा रमणी
    यमुनारता ॥ १४६॥ मुसलीकुण्ठितामोटा चण्डखण्डा गणाबला । शुक्ला स्रष्ट्रीवशा ज्ञानिमानी लीलालका शची ॥
    १४७॥ सूरचन्द्रघृणिर्योषावीर्याक्रीडा रसावहा । नूत्ना सोमा महाराज्ञी गयायागाहुतप्रभा ॥ १४८॥ धूर्ता
    सुधाघनालीनपुष्टिमृष्टसुधाकरा । करिणी कामिनी मुक्तामणिश्रेणी फणीश्वरा ॥ १४९॥ तार्क्षी सूक्ष्मा नताचार्या
    गौरिका गिरिजाङ्गना । इन्द्रजाला चेन्दुमुखीत्विन्द्रोपेन्द्रादि संस्तुता ॥ १५०॥ शिवदूती च गरलशितिकण्ठकुटुम्बिनी
    । ज्वलन्तीज्वलनाकारा ज्वलज्जाज्वल्यजम्भदा ॥ १५१॥ ज्वालाशया ज्वालमणिर्ज्योतिषां गतिरेव हि । ज्योतिःशास्त्रानुमेयात्मा
    ज्योतिषी ज्वलितोज्ज्वला ॥ १५२॥ ज्योतिष्मती दुर्गवासी ज्योत्स्नाभा ज्वलनार्चिता । लङ्कारी ललितावासा
    ललिताललितात्मिका ॥ १५३॥ लङ्काधिपा लास्यलोला लयभोगमयालया । लावण्यशालिनी लोला लाङ्गला ललिताम्बिका ॥
    १५४॥ लाञ्छना लम्पटालङ्घ्या लकुलार्णवमुक्तिदा । ललाटनेत्रा लज्जाढ्या लास्यालापमुदाकरा ॥ १५५॥ ज्वालाकृतिर्ज्वलद्बीजा
    ज्योतिर्मण्डलमध्यगा । ज्योतिस्स्तम्भा ज्वलद्वीर्या ज्वलन्मन्त्रा ज्वलत्फला ॥ १५६॥ जुषिरा जुम्पटा ज्योतिर्मालिका
    ज्योतिकास्मिता । ज्वलद्वलयहस्ताब्जा ज्वलत्प्रज्वलकोज्ज्वला ॥ १५७॥ ज्वालमाल्या जगज्ज्वाला ज्वलज्ज्वलनसज्ज्वला
    । लम्बीजा लेलिहानात्मा लीलाक्लिन्ना लयावहा ॥ १५८॥ लज्जावती लब्धपुत्री लाकिनी लोलकुण्डला । लब्धभाग्या
    लब्धकामा लब्धधीर्लब्धमङ्गला ॥ १५९॥ लब्धवीर्या लब्धवृता लाभा लब्धविनाशिनी । लसद्वस्त्रा लसत्पीडा लसन्माल्या
    लसत्प्रभा ॥ १६०॥ शूलहस्ता शूरसेव्या शूलिनी शूलनाशिनी । शूङ्कृत्यनुमतिः शूर्पशोभना शूर्पधारिणी ॥ १६१॥
    शूलस्था शूरचित्तस्था शूला शुक्लसुरार्चिता । शुक्लपद्मासनारूढा शुक्ला शुक्लाम्बरांशुका ॥ १६२॥ शुकलालितहस्ताब्जा
    श्वेता शुकनुता शुभा । ललिताक्षरमन्त्रस्था लिप्तकुङ्कुमभासुरा ॥ १६३॥ लिपिरूपा लिप्तभस्मा लिप्तचन्दनपङ्किला
    । लीलाभाषणसंलोला लीनकस्तूरिकाद्रवा ॥ १६४॥ लिखिताम्बुजचक्रस्था लिख्यालिखितवैभवा । नीलालका नीतिमती नीतिशास्त्रस्वरूपिणी
    ॥ १६५॥ नीचघ्नी निष्कला नित्या नीलकण्ठप्रियाङ्गना । निराशा निर्गुणातीता निर्मदा निरुपप्लवा ॥ १६६॥ निर्णीता
    निर्मला निष्ठा निरङ्कुशपराक्रमा । निर्विण्णदानवबला निश्शेषीकृततारका ॥ १६७॥ निरञ्जनकरामन्त्री निर्विघ्नपरनाशिनी
    । नित्यक्लिन्ना निराहारा नीवीनीलाम्बराञ्चिता ॥ १६८॥ निशाकरकुलध्वंसी नित्यानन्दपरम्परा । निम्बप्रिया
    निरावेशा निन्दि तासुरसुन्दरी ॥ १६९॥ निर्घोषा निगलाकृष्टकृत्तिज्ज्वालावृताङ्गणा । नीरसा नित्यकल्याणी
    निरन्तरसुखप्रदा ॥ १७०॥ निर्लोभा नीतिमत्प्रीता निर्विघ्ना निमिषापहा । दुम्बीजा दुष्टसंहारी दुर्मदा
    दुरितापहा ॥ १७१॥ दुरुत्सहमहावीर्या दुर्मेधोत्सवनाशिनी । दुर्मांसभक्षिणी दुष्टा दूरीकृतनिशाचरा ॥ १७२॥
    दूती दुष्टग्रहमदचुम्बी दुर्बलरक्षकी । ष्टङ्कारी ष्टम्मयी ष्टम्भा ष्टम्बीजा ष्टम्भकीलका ॥ १७३॥ ग्रहेश्वरी
    ग्रहाराध्या ग्रहणीरोगमोचिनी । ग्रहावेशकरी ग्राह्या ग्रहग्रामाभिरक्षिणी ॥ १७४॥ ग्रामौषधमहावीर्या ग्राम्यसर्वभयापहा
    । ग्रहद्वेषी ग्रहारूढा ग्रामणीर्ग्रामदेवता ॥ १७५॥ गृहीतब्रह्ममुख्यास्त्रा गृहीतायुधशक्तिदा । ग्रासमांसा
    गृहस्थार्च्या ग्रहभूतनिवारिणी ॥ १७६॥ हम्भूता हलधृक्सेव्या हारहारिकुचाञ्चला । हर्षप्रदा हराराध्या हासनिन्द्यनिशाकरा
    ॥ १७७॥ हविर्भोक्त्री हरिद्राभा हरिताश्वाधिरोहिणी । हरित्पतिसमाराध्या हलाकृष्टसुरासुरा ॥ १७८॥ हारीतशुकवत्पाणिः
    हयमेधाभिरक्षकी । हंसाक्षरी हंसबीजा हाहाकारहराशुगा ॥ १७९॥ हय्यङ्गवीनहृद्वृत्तिः हारीतांशुमणिद्युतिः
    । हुङ्कारात्मा हुताहोम्या हुङ्कारालयनायिका ॥ १८०॥ हुङ्कारपञ्जरशुकी हुङ्कारकमलेन्दिरा । हुङ्काररात्रिकाज्योत्स्ना
    हुङ्कारद्रुममञ्जरी ॥ १८१॥ हुङ्कारदीपिकाज्वाला हुङ्कारार्णवकौमुदी । हुम्फट्करी हुम्फट्द्युतिः हुङ्काराकाशभास्करा
    ॥ १८२॥ फट्कारी स्फाटिकाकारा स्फटिकाक्षकराम्बुजा । फट्कीलका फडस्त्रा च फट्काराहिशिखामणिः ॥ १८३॥ फट्कारसुमनोमाध्वी
    फट्कारकमलेन्दिरा । फट्कारसौधश
