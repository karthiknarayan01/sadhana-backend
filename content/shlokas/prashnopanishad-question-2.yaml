id: prashnopanishad-question-2
category: stotram
name:
  english: Prashnopanishad - Question 2
content:
  english: dvitiyah prashnah atha haina mbhargavo vaidarbhih papraccha| bhagavan katyeva devah prajam
    vi~dharayante katara etatprakashayante kah punaresham || tasmai sa hovacakasho ha va esha devo vayuragnirapah
    prithivi vanmanashcakshu nca| te prakashyabhivadanti vayametadbanamavashtabhya vidharayamah || ||
    tan varishthah prana uvaca| ma mohamapadyatha ahamevaitatpancadhatmana mpravibhajyaitadbanamavashtabhya
    vidharayamiti te 'shraddadhana babhuvuh || 'bhimanadurdhvamutkramata iva tasminnutkramatyathetare
    sarva evotkramante tasmimshca pratishthamane sarva eva pratishthante| tadyatha makshika madhukararajanamutkramantam
    sarva evotkramante tasmimshca pratishthamane sarva eva pratishthanta evam nca te pritah pranam stunvanti
    || 'gnistapatyesha surya esha parjanyo maghavanesha vayuh| esha prithivi rayirdeva || ara iva rathanabhau
    prane sarva mpratishthitam| rico yajumshi samani yajnah || prajapatishcarasi garbhe tvameva pratijayase|
    tubhya mprana prajastvima balim haranti yah pranaih pratitishthasi || || devanamasi vahnitamah pitrina
    mprathama svadha| rishina ncaritam satyamatharvangirasamasi || mprana tejasa rudro 'si parirakshita|
    tvamantarikshe carasi suryastva shasyathemah prana te prajah| anandarupastishthanti kamayanna shiratta
    vishvasya satpatih| vayamadyasya datarah pita tva || ya te tanurvaci pratishthita ya shrotre ya ca
    cakshushi| ya ca manasi santata shiva tpratishthitam| mateva putra nrakshasva shrishca prajna
  devanagari: द्वितीयः प्रश्नः अथ हैन म्भार्गवो वैदर्भिः पप्रच्छ। भगवन् कत्येव देवाः प्रजां विँधारयन्ते
    कतर एतत्प्रकाशयन्ते कः पुनरेषां ॥ तस्मै स होवाचाकाशो ह वा एष देवो वायुरग्निरापः पृथिवी वाङ्मनश्चक्षु
    ञ्च। ते प्रकाश्याभिवदन्ति वयमेतद्बाणमवष्टभ्य विधारयामः ॥ ॥ तान् वरिष्ठः प्राण उवाच। मा मोहमापद्यथ
    अहमेवैतत्पञ्चधात्मान म्प्रविभज्यैतद्बाणमवष्टभ्य विधारयामीति ते ऽश्रद्दधाना बभूवुः ॥ ऽभिमानादूर्ध्वमुत्क्रामत
    इव तस्मिन्नुत्क्रामत्यथेतरे सर्व एवोत्क्रामन्ते तस्मिंश्च प्रतिष्ठमाने सर्व एव प्रातिष्ठन्ते। तद्यथा
    मक्षिका मधुकरराजानमुत्क्रामन्तं सर्व एवोत्क्रामन्ते तस्मिंश्च प्रतिष्ठमाने सर्व एव प्रातिष्ठन्त एवं
    ञ्च ते प्रीताः प्राणं स्तुन्वन्ति ॥ ऽग्निस्तपत्येष सूर्य एष पर्जन्यो मघवानेष वायुः। एष पृथिवी रयिर्देव
    ॥ अरा इव रथनाभौ प्राणे सर्व म्प्रतिष्ठितम्। ऋचो यजूंषि सामानि यज्ञः ॥ प्रजापतिश्चरसि गर्भे त्वमेव
    प्रतिजायसे। तुभ्य म्प्राण प्रजास्त्विमा बलिं हरन्ति यः प्राणैः प्रतितिष्ठसि ॥ ॥ देवानामसि वह्नितमः
    पितृणा म्प्रथमा स्वधा। ऋषीणा ञ्चरितं सत्यमथर्वाङ्गिरसामसि ॥ म्प्राण तेजसा रुद्रो ऽसि परिरक्षिता। त्वमन्तरिक्षे
    चरसि सूर्यस्त्व षस्यथेमाः प्राण ते प्रजाः। आनन्दरूपास्तिष्ठन्ति कामायान्न षिरत्ता विश्वस्य सत्पतिः।
    वयमाद्यस्य दातारः पिता त्व ॥ या ते तनूर्वाचि प्रतिष्ठिता या श्रोत्रे या च चक्षुषि। या च मनसि सन्तता
    शिवा त्प्रतिष्ठितम्। मातेव पुत्रा न्रक्षस्व श्रीश्च प्रज्ञा
