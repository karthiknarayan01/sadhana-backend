id: kytb-1-4-somadi-brahmanam-krishna-yajurveda-taittiriya-brahmana-patha-ubhaye-va
category: stotram
name:
  english: KYTB 1.4 Somadi Brahmanam - Krishna Yajurveda Taittiriya Brahmana Patha - Ubhaye Va
content:
  english: krishna yajurvediya taittiriya brahmane prathamashtake caturthah prapathakah shri gurubhyo
    namah | harih om || anuvakam grahana grahanam ubhaye va ete prajapateraddhya srijyanta | devashcasurashca
    | tanna vyajanat | ime 'nya iti | sa devanagm shunakarot | tanabhyashunot | ta vyagrihnat | te graha
    abhavann | tadgrahana || devata va eta yajamanasya grihe grihyante | ya vi~dusha ete graha grihyante
    || esha vai somasyahutih | yadupagmshuh | somena devag starpayaniti khalu vai somena yajate | yadupagmshu
    njuhoti | somenaiva ta starpayati || yadgraha gacchanti || yaccamasanjuhoti | tenaivanurupena yajamana
    nnvetadagra asidityahuh | ya tpatraniti | iyam va~ etadagra asit | mrinmayani va etanyasann | tairdeva
    na vyavrita magacchann | ta etani darumayani patra pashyann | tanyakurvata || || tairvai te vyavrita
    ddarumayani patrani bhavanti | vyavritameva tai ryajamano gacchati || yani darumayani patrani bhavanti
    | amumeva tai mabhijayati | yani mrinmayani | imameva tai mabhijayati || brahmavadino vadanti | kashcatasra
    ssthalirvayavya ssomagrahaniriti | deva vai prishnimaduhrann || || tasya ete stana asann | iyam vai~
    prishnih | tamaditya adityasthalya catushpadah pashunaduhrann | yadadityasthali bhavati | catushpada
    eva taya pashun nduhe | tamindra ukthyasthalyendriya maduhat | yadukthyasthali bhavati | indriyameva
    taya yajamana ima grayanasthali bhavati || || urjameva taya yajamana ima dhruvasthalya ''yuraduhrann
    | yaddhruvasthali bhavati | ayureva taya yajamana ima nduhe | sthalya grihnati | vayavyena juhoti
    | tasmadanyena patrena pashu nduhanti | anyena pratigrihnanti | atho nnagrayanasthali bhavati sotramanishesha
    mantrah yuvagm suramamashvina | namucava | vipipana shubhaspati | indra nkarmasvavatam || putramiva
    pitaravashvinobha | indravata nkarmana dagmsanabhih | ya shshacibhih | sarasvati tva maghavannabhishnat
    || aha vyagne havirasye te | sruciva ghrita || vajasanigm rayimasme suvira m || yasminnashvasa rishabhasa
    ukshanah | vasha mesha avasrishtasa ahutah | kilalape somaprishthaya vedhase njanaya carumagnaye ndevahitagm
    sado mitam | ma sagmsrikshatha mparame vyomann | sura tvamasi shushmini soma eshah | ma ma higmsi
    || yadatra shishtagm rasinah sutasya | yadindro apibacchacibhih | aha ntadasya manasa shivena | somagm
    rajanamiha bhakshayami || dve sruti ashrinava ndevanamuta martyanam | tabhyamidam mbhuvanagm sameti
    | antara purvamapara nca ketum || yaste deva varuna gayatrachandah pashah | ta || yaste deva varuna
    trishtupchandah pashah | ta nta etenavayaje | yaste deva varuna jagatichandah pashah | ta nta etenavayaje
    || somo va etasya rajyamadatte | yo raja sa nrajyo va somena yajate | devasuvametani havigmshi bhavanti
    | etavanto vai devanagm savah | ta evasmai sava nprayacchanti | ta ena mpunah suvante rajyaya | devasu
    raja bhavati || rvishvarupi | ayuryajnapatavadhat | indraya krinvati bhagam | mitraya varunaya ca
    || iyam va~ agnihotri | iyam va~ etasya nishidati | yasya gnihotri nishidati | tamutthapayet | udastha
    ddevyaditiriti | iyam || imamevasma utthapayati || ayuryajnapatavadhadityaha | ayurevasmi ndadhati
    || indraya krinvati bhaga mmitraya varunaya cetyaha | yatha yajurevaitat || avartim va~ eshaitasya
    papmana mpratikhyaya nishidati | yasya gnihotryupasrishta nishidati | ta hmanaya dadyat | yasyanna
    nnadyat | avartimevasmi || dugdhva dadati | na hyadrishta dakshina diyate va~ etasya payah pravishati
    | yasya nduhyamanagg skandati || yadadya dugdha mprithivimasakta | yadoshadhi dyadapah | payo griheshu
    payo aghniyasu | payo vathseshu payo astu tanmayityaha | paya evatma ngriheshu pashushu dhatte ||
    apa upasrijati || || adbhirevainadapnoti || yo vai yajnasyartenana rtagm sagm srijati | ubhe vai te
    tar hyarcchatah | arcchati khalu va etadagnihotram | ya dduhyamanagg skandati | yadabhiduhyat | artenana
    ya~jnasya sagmsrijet | tadeva yadrikkidrikca hotavya ya~jnasya nishkaroti || dyuddrutasya skande 'hutva
    punareyat | yajnam vi~cchindyat | yatra skande t | tannishadya punargrihniyat | yatraiva skandati
    | tata evainat punargrihnati | tadeva yadrik ya~jnasya nishkaroti || || vi va etasya yajnashchidyate
    | yasya 'ntara dhavati | rudrah khalu va eshah | yadagnih | ya dgamanvatyavartaye napidaddhyat | apashu
    'nvatishincet | anadya magnerapah | anadyama mapidaddhyat | gar rvicakrama iti vaishnavyarca ''havaniya
    ddhvagm sayannudravet | yajno vai vishnuh | yajnenaiva yajnagm santanoti | bhasmana padamapivapati
    shantyai agniprayashcittam agnihotre ni va etasyahavaniyo gar m | yasyagnimanuddhritagm suryo 'bhinimrocati
    | darbhena hiranya mprabaddhya purasta ddharet | athagnim | atha gnihotram | yaddhiranya mpurastaddharati
    | jyotirvai hiranyam | jyotirevaina nnuddharati | yadagni mpurvagm haratyatha mpranayati || brahmana
    ar sheya uddharet | brahmano vai sarva devatah ndevatabhiruddharati || agnihotra rasita | vratameva
    hatamanu mriyate || antam va~ esha atmano gacchati | yastamyati | antamesha yajnasya gacchati | yasyagnimanuddhritagm
    suryo || punah samanya juhoti | antenaivantam ya~jnasya nishkaroti || varuno va etasya yajna ngrihnati
    | yasyagni manuddhritagm suryo 'bhinimrocati | varuna nnirvapet | tenaiva yajna nnishkrinite || ni
    va etasyahavaniyo gar manuddhritagm suryo 'bhyudeti | caturgrihita gnihotram | yadajya mpurastaddharati
    | etadva agneh priya ndhamna samardhayati | yadagni mpurvagm haratyatha gnihotram | bhagadheyenaivaina
    mpranayati | brahmana ar sheya uddharet | brahmano vai sarva devatah ndevatabhiruddharati || paraci
    va etasmai vyucchanti vyucchati | yasyagni manuddhritagm suryo 'bhyudeti | ushah ketuna jushatam |
    yajna ndevebhirinvitam | devebhyo madhumattamagg svaheti pratyam nishadyajyena juhuyat | praticimevasmai
    vivasayati || agnihotra rasita | vratameva hatamanu mriyate | antam va~ esha atmano gacchati || ||
    yastamyati | antamesha yajnasya gacchati | yasyagni manuddhritagm suryo 'bhyudeti | punah samanya
    juhoti | antenaivantam ya~jnasya nishkaroti | mitro va etasya yajna ngrihnati | yasyagni manuddhritagm
    suryo 'bhyudeti | maitra nnirvapet | tenaiva yajna nnishkrinite || yasya t | vicchindyat | bhratrivyamasmai
    janayet | yadvai yajnasya vastavya manvavasyet | vastavya magnimupasita | rudro ssyat | ahavaniya
    njajne agnih | svadyoneradhi jatavedah | sa gayatriya trishtubha jagatya | devebhyo havyam va~hatu
    prajananniti | chandobhirevainagg svadyoneh prajanayati || gar va~ anvahitagneh pashava upa tishthante
    | sa yadudvayati | tadanu pashavo 'pakramanti | ishe rayyai ramasva || || sahase dyumnaya | urje patyayetyaha
    | pashavo vai rayih | pashunevasmai ramayati || sarasvatau tvothsau samindhatamityaha | ri khsame
    vai sarasvatavuthsau samabhyamevainagm samindhe || samradasi viradasityaha | rathantaram || tabhyamevainagm
    samindhe || vajro vai cakram | vajro va etasya yajnam vi~cchinatti | yasyano va ratho va 'gni yati
    | ahavaniya duddharet | yadagne purva nvatatana | tatra rayishthamanu sambharaitam | sa nnah srija
    sumatya vajavatyeti || || purvenaivasya yajnena yajnamanu sa ntanoti || tvamagne sapratha asityaha
    | agni | devatabhireva yajnagm sa ntanoti || agnaye pathikrite purodashamashtakapala nnirvapet | agnimeva
    pathikritagg svena bhagadheyenopa dhavati | sa evainam dakshina | vahi hyesha samriddhyai || ntrini
    nimrocati darbhena yaddhiranyamagnihotra mpunarvaruno varuna nni va etasyabhyudeti caturgrihitamajyam
    yadajyam para cyushah punarmitro metram hapatyo yadvai mantheduddharet somatirekaprayashcittam yasya
    pratassavane somo 'tiricyate | maddhyandinagm savana 'bhyatiricyate | gaurdhayati marutamiti dhayadvatishu
    kurvanti | hinasti vai sandhyadhitam | sandhiva khalu va etat | ya thsavana syatiricyate | yaddhayadvatishu
    kurvanti | sandhe || gayatragm sama bhavati pancadasha sstomah | tenaiva pratassavanannayanti || ||
    marutvatishu kurvanti | tenaiva maddhyandina thsavanannayanti || hotushca masamanunnayante | hota
    'nushagmsati | maddhyata eva yajnagm samadadhati || yasya maddhyandine savane somo 'tiricyate | aditya
    'bhyatiricyate | gaurivitagm sama bhavati | atiriktam vai~ gaurivitam | atiriktam || atiriktasya shantyai
    || banmahagm asi suryeti kurvanti | yasyaivadityasya savanasya kamenatiricyate | tenaivaina nkamena
    samardhayanti || gaurivitagm sama bhavati | tenaiva maddhyandina thsavanannayanti || saptadasha sstomah
    | tenaiva tritiyasavanannayanti || hotushcamasamanunnayante | hota || maddhyata eva yajnagm samadadhati
    || yasya tritiyasavane somo 'tiricyeta | ukthya nkurvita | yasyokthye 'tiricyeta | atiratra 'tiricyate|
    tattvai dushprajnanam | yajamanam tpashava asahya yanti | briha thsama bhavati | brihadva imam hatah
    pashavah | brihataivasmai pashu ndadhara || shipivishtavatishu kurvanti | shipivishto vai devana mpushtam
    | pushtyaivainagm samardhayanti || hotushcamasamanunnayante | hota 'nushagmsati | maddhyata eva yajnagm
    samadadhati || mprayashcittam ekaiko vai janataya va~ etavindramabhi sagmsunutah | yau dvau sagmsunutah
    | prajapatirva esha vitayate | ya dyajnah | tasya gravano dantah va~ ete sagmsunvato rnirbaphsati
    | purvenopasritya devata ityahuh | purvopasritasya vai shreya nbhavati | etivantyajyani bhavantya
    || marutvatih pratipadah | maruto vai devana mayatanam | devana mevaparajita ayatane yatate ||ubhe
    brihadrathantare bhavatah | iyam va~va rathantaram | asau brihat | abhyamevaina mantareti | vacashca
    manasashca | pranacca panacca | divashca prithivyashca || t || abhivarto brahmasama mbhavati | suvargasya
    lokasya bhivrittyai || abhiji dbhavati | suvargasya lokasya bhijityai | vishvaji dbhavati | vishvasya
    jityai || yasya bhuyagmso yajnakratava ityahuh | sa devata vrinkta iti | yadyagnishtoma nkurvita |
    yadyukthyah syat | atiratra nkurvita | yajnakratubhi revasya devata vrinkte || yo vai chandobhi rabhibhavati
    | sa sagm sunvato ve~shaya tvopaveshaya tvetyaha | chandagmsi vai sam ve~sha upaveshah | chandobhirevasya
    chandagsya bhibhavati || ishtargo va ritvija || ishtargah khalu vai purvo kshiyate | pranapanau mrityorma
    patamityaha | pranapanayoreva shrayate | pranapanau ma ma hasishtamityaha | naina ''yushah pranapanau
    jahitah || artim va~ ete niyanti | yesha ya~davavarjeyuh | krurakritamivaisham t | ahara daheti bruyat
    || ndakshinato vedyai nidhaya | sarparajniya rigbhi mparidadati || vyriddha prathamah pracinaviti
    ma mpariyat | yamiranu bruvann | sarparajnina nkirtayet | ubhayorevainam lo~kayoh paridadati || ||
    atho dhuvantyevaina m | atho nyevasmai hnuvate || trih pariyanti | traya ime lokah | ebhya evainam
    lo~kebhyo dhuvate | trih punah pariyanti | shat thsampadyante | shadva ritavah | ritubhirevaina ndhuvate
    || agna ayugmshi pavasa iti pratipada nkurvirann | rathantarasamaishagm somah syat | ayurevatman dadhate
    | atho papmanameva vijahato yanti || kurvaragg strini ca yupavirohanadiprayashcittam asuryam nkritva
    | pashavo virya mapakramanti | yasya yupo virohati | tvashtra malabheta | tvashta vai rupanamishe
    | ya eva rupanamishe mapakramanti || artim va~ ete niyanti | yesha || yadahavaniya udvaye t | vicchindyat
    | bhratrivyamasmai janayet | yadahavaniya udvaye duddharet | yadagni || atra vava sa nilayate | yatra
    khalu vai nilina t | tasyarani kuryat | krumukamapi kuryat | esha va agneh priya tanuh | yat krumukah
    | priyayaivaina ntanuva samardhayati || gar hapatyo va agneryonih | svadevainam rjanayati | nasmai
    bhratrivya njanayati || yasya soma upadasye t | suvarnagm hiranya ndvedha vicchidya | rijishe 'nyadadhunuyat
    | juhuyadanyat | somameva njuhoti || somasya va abhishuyamanasya priya tanu thsuvarnagm hiranya thsuvarnagm
    hiranya nkurvanti | priyayaivaina ntanuva samardhayanti || yasyakritagm soma mapahareyuh | kriniyadeva
    | saiva tatah prayashcittih || yasya kritamapahareyuh | adarag shca phalgunani cabhishunuyat | gayatri
    yagm somamaharat | tasya yo || ta adara abhavann | indro vritramahann | tasya valkah para 'patat |
    tani phalgunanyabhavann | pashavo vai pha shca phalgunani cabhishunoti | somameva rajanamabhishunoti
    || shritena pratassavane shriniyat | daddhna maddhyandine || || nitamishrena tritiyasavane | agnishtoma
    drathantarasama | ya evartvijo vrita ndadyattebhya eva | puna nkriniyat | yajnenaiva ta micchati |
    saiva tatah prayashcittih || sarva bhyah prishthebhya atmana khalu vai purushah | yavadasya vittam
    | sarvavedasena yajeta | sarvaprishtho 'sya somah syat | sarva bhyah prishthebhya atmana smarte shnanadau
    marjanarthashca ssuvarjanah | pavitrena vicar shanih | yah pota sa punatu ma || punantu ma devajanah
    | punantu mana vo dhiya | punantu vishva ayavah || jatavedah pavitravat | pavitrena punahi ma | shukrena
    deva didyat | agne kratva kratugm ranu || marcishi | agne vitatamantara | brahma tena punimahe ||
    ubhabhya ndeva savitah |pavitrena savena ca | ida mbrahma punimahe || vaishvadevi punati devyaga stanuvo
    vitaprishthah | taya madanta ssadhamadyeshu | vayagg syama patayo rayinam || || vaishvanaro rashmibhirma
    punatu | vatah praneneshiro mayobhuh | dyavaprithivi payasa payobhih | ritavari yajniye ma punitam
    || brihadbhih savitastribhih | var rdeva manmabhih | agne dakshaih punahi ma || yena deva apunata
    | yenapo divya nkashah | tena divyena brahmana || mbrahma punimahe || yah pavamaniraddhyeti | rishibhi
    m | sarvagm sa putamashnati | svadita mmatarishvana || pavamaniryo addhyeti | rishibhi m | tasmai
    sarasvati duhe | kshiragm sarpi rmadhudakam || pavamani || sudugha hi payasvatih | rishibhi ssambhrito
    rasah | brahmaneshvamritagm hitam || pavamani rdishantu nah | imam lo~kamatho amum | kaman thsamardhayantu
    nah | devi ssamabhritah || pavamani ssvastyayanih | sudughahi ghritashcutah | rishibhi || brahmaneshvamritagm
    hitam || yena devah pavitrena | atmana | tena sahasradharena | pavamanyah punantu ma || prajapatya
    m | shatodyamagm hiranmaya m | tena brahma vido vayam | puta mbrahma punimahe || indrah suniti saha
    ma punatu | somah svastya varuna pramrinabhih punatu ma | jataveda morjayantya punatu || sudugha hi
    ghritashcuta rishibhi rajasuyagatacaturmasyasheshah praja vai satramasata tapastapyamana ajuhvatih
    | deva apashya nghritasya purnagg svadham | tamupodatishthanta rdhamasa urjamavarundhata | tasmadardhamase
    deva ijyante || pitaro nghritasya purnagg svadham | tamupodatishthanta majuhavuh | tena masyurjamavarundhata
    | tasma nmasi pitribhyah kriyate | manushya apashya nghritasya purnagg dvayimurjamavarundhata | tasma
    bhya upahriyate | pratashca saya nghritasya purnagg svadham | tamupodatishthanta ttrirahnah pashavah
    prerate | pratassagamve sayam | asura apashya nghritasya purnagg rundhata || te deva amanyanta | ami
    va idamabhuvann | yadvayagg sma iti | ta etani caturmasyanyapashyann | tani niravapann | tairevaisha
    ntamurjamavrinjata | tato deva abhavann | para dyajate | yameva deva urjamavarundhata | ta tpitribhyah
    karoti | yameva pitara urjamava varundhe | yadavasathe 'nnagm haranti | yameva manushya urjamava ||
    yameva pashava urjamava ryajate | yamevasura urjama varundhe | bhavatyatmana 'sya bhratrivyo bhavati
    || virajo va esha vikra rmasyani | vaishvadevenasmi~lloke pratyatishthat | varuna praghasai rantarikshe
    | sakamedhai ramushmi~lloke | esha ha tvavaita manushya apashyancamasa nghritasya purnagg nghritasya
    purnagg tyatishtha ccatvari ca caturmasyaprashamsanam agnirvava sam va~thsarah | adityah parivathsarah
    | candrama idavathsarah | vayu shvadevena yajate | agnimeva ta dvaishvadevena yajamanah | sam va~thsarinag
    svasti sta ityashasita || ya ryajate | adityameva ta ryajamanah | parivathsarinag svasti sta ityashasita
    | ya ryajate | candramasameva tadidavathsara ryajamanah | idavathsarinag svasti sta ityashasita ||
    ya tpitri yajnena yajate | devaneva tadanvavasyati || atha va asya vayushca nuvathsarashca pritavucchishyete
    | yacchunasiriyena yajate || || vayumeva tadanuvathsara cchunasiriyena yajamanah | anuvathsarinag
    svasti sta ityashasita || sam phsatityahuh | yashcatu ryajata iti | esha ha tvai savan ryajate ||
    vishve deva 'gnimevayajanta | ta etam || yasminnagnih | ya shvadevena yajate | etameva loka njayati
    | yasminnagnih | agnereva sayujyamupaiti || yada vai shvadevena yajate | atha sam va~thsarasya grihapati
    va~thsarasya grihapati mapnoti | atha sahasrayajina mapnoti | yada sahasrayajina mapnoti | yada grihamedhina
    mapnoti | athagni rbhavati | atha gaurbhavati | esha vai vai dva eteshamavamam | ato 'to va uttarani
    shreyagmsi bhavanti | ya shvadevasya vaishvadevatvam || || athadityo varunagm rajanam va~runa praghasairayajata
    | sa etam lo~kamajayat | yasminnadityah | ya ryajate | etameva loka njayati | yasminnadityah | adityasyaiva
    mupaiti | yadadityo varunagm rajanam va~runa praghasairayajata | ta va~runa praghasatvam || atha somo
    raja chandagmsi sakamedhairayajata || lo~kamajayat | yasmigg shcandrama vibhati | ya ryajate | etameva
    loka njayati | yasmigg shcandrama vibhati | candramasa eva sayujya mupaiti | somo vai candramah |
    esha ha tvai saksha thsomashca raja chandagmsi ca samaidhanta || thsakamedhanagm sakamedhatvam ||
    athartavah pitarah prajapati lo~kamajayann | yasminnritavah | ya tpitriyajnena yajate | etameva loka
    njayati | yasminnritavah | ritunameva sayujya ritavah pitarah prajapati mpitriyajnenayajanta | ta
    tpitriyajnasya pitriyajnatvam || rayajanta prathemahiti | tato vai ta aprathanta | ya evam ryajate
    | prathate prajaya pashubhih || atha vayuh parameshthinagm shunasiriyenayajata | sa etam lo~kamajayat
    | yasmin vayuh | yacchunasiriyena yajate | etameva loka || vayoreva sayujya mupaiti || brahmavadino
    vadanti | pra caturmasyayaji iti | jivanva esha ritunapyeti | yadi vasanta pramiyate | vasanto bhavati
    | yadi grishme grishmah | yadi varshasu varshah | yadi sharadi sharat | yadi heman hemantah | riturbhutva
    sam va~thsaramapyeti | sam va~thsarah prajapatih | prajapatirva vaishah || shunasiriyena yajate sahasrayajinamapnoti
    jayati yasmin vayu r hemanta strini ca tha grihamedhinagm shat || harih om || || krishna yajurvediya
    taittiriya brahmane prathamashtake caturthah prapathaka krishna yajurvediya taittiriya brahmane prathamashtakam
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय ब्राह्मणे प्रथमाष्टके चतुर्थः प्रपाठकः श्री गुरुभ्यो नमः । ह॒रिः॒
    ओम् ॥ अनुवाकं ग्रहणा ग्रहणम् उ॒भये॒ वा ए॒ते प्र॒जाप॑ते॒रद्ध्य॑ सृज्यन्त । दे॒वाश्चासु॑राश्च । तान्न
    व्य॑जानात् । इ॒मे ऽन्य इति॑ । स दे॒वान॒ग्ं॒ शून॑करोत् । तान॒भ्य॑षुणोत् । ता व्य॑गृह्णात् । ते ग्रहा॑
    अभवन्न् । तद्ग्रहा॑णा ॥ दे॒वता॒ वा ए॒ता यज॑मानस्य गृ॒हे गृ॑ह्यन्ते । य विँ॒दुष॑ ए॒ते ग्रहा॑ गृ॒ह्यन्ते
