id: shrinivasagunakara
category: stotram
name:
  english: shrinivasagunakara
  devanagari: श्रीनिवासगुणाकर
content:
  english: tvatkarunyakalamiva prakatayatyetat kiritam tava || 39|| alijaladharabalabhidupalatimiralaghimakalanasabalakabararucah
    | janadrigagunaparihritimatikritaparivriti bhavati tava nu suma makutam || 40|| shribhridruddhakacam
    shramaikaphaladam kim te kiritam mahat citram manmakutam shirassthamapi me bibhradbharam bhasayat
    | sadgamyam paramam padam tvavati te pracinamapyuttaram sarvasmatparipurayatyurutarah svasha mahadvarnyate
    || 41|| sakshinyaptatama dayam tava gata sarvarthavinmadhuriyuk shrutyantapadabhiramaninada sarvaistvadiyaissaha
    | tvadghantaiva sahasradha nikatabhagbrute jagaddhurvaham tvadbhrinmanmakutaprasiddhimadhikam shrivallabha
    shruyatam || 42|| sheshatvena nirupitam guruvaraistaccheshatamashritaih svamitvam nirupadhikam bhajadaho
    nirdoshamatsvatvabhak | lakshmibhagadharikritam tu bhavata lokanukulam pura tvamudvasya tava prabhutvamakaronno
    vetsi kim tatprabho || 43|| gavo yatra nirupyamanavilasadrupanugacchadhdridah sotkantha vicarantyaho
    sumanasam padva'pyajanam gavam | shirsheshu pratibhati nirmaladrisham tvadgatyupayatmata yasminneva
    vibhati tena sadrisham lakshmisha kim vartate || 44|| gehadermanujastrivishtapasadastesham payojasanah
    tesham tasya ca venkatacalapate shrishasya te shrisha padadvayam | yattasyapi hi padukamanimayam samrakshakam
    pummanivyakirnam tadananyarakshakakatham mam sarvada rakshatu || 45|| stotram gotrapatinam na kuru
    mukha mudha svaya te jna yadi syuh no janantyuktishaktim tricaturapadadhilolavaco yadi syuh | durvarakharvagarvah
    paribhavacaturassiddhayo yadyalabhyah natmashlagham sahante na tava phalalavastadbhaja shrinivasam
    || 46|| no gaccheh kavite sute kshitipatim tvam candanadrum dhane gandhe lolataya sasamshayabudhakrurahayastatra
    hi | anyonyaikyagalatkudushanavishah sadhvoshadhisparshato'pyegre tvam bata marayeyuracirat tat patripatram
    bhaja || 47|| boddharo'pi samiddhamatsarataya naddhavahitthacanah shuddhoktishvavishuddhabuddhijananashraddhalutatyuddhatah
    | maddhikanapi viddhayanti kavite shraddhatsva teme'ddhavaco' baddhakshmeshaguna jagaddhavapade naddha
    mamriddha bhava || 48|| vidvaddveshabhrito mudhapadaganah proccaissvara nistrapah sanketena parasparam
    svavijaye sakshitvamapyashritah | sadbuddhinapi vancayanti vibudhan bhupantike nastika vidyavittavighatuka
    bhuvi krite lakshmishamevashraya || 49|| gaurgam gava gave gorgorgavi gauryasya pati yah | varaya
    pidakan vyaptan datte tam shrinidhim bhaja || 50|| vrishacaleshituh padashritah kubhrinmuda''patat
  devanagari: त्वत्कारुण्यकलामिव प्रकटयत्येतत् किरीटं तव ॥ ३९॥ अलिजलधरबलभिदुपलतिमिरलघिमकलनसबलकबररुचः ।
    जनदृगगुणपरिहृतिमतिकृतपरिवृति भवति तव नु सुम मकुटम् ॥ ४०॥ श्रीभृद्रुद्धकचं श्रमैकफलदं किं ते किरीटं
    महत् चित्रं मन्मकुटं शिरस्स्थमपि मे बिभ्रद्भरं भासयत् । सद्गम्यं परमं पदं त्ववति ते प्राचीनमप्युत्तरं
    सर्वस्मात्परिपूरयत्युरुतराः स्वाशा महद्वर्ण्यते ॥ ४१॥ साक्षिण्याप्ततमा दयां तव गता सर्वार्थविन्माधुरीयुक्
    श्रुत्यन्तपदाभिरामनिनदा सर्वैस्त्वदीयैस्सह । त्वद्घण्टैव सहस्रधा निकटभाग्ब्रूते जगद्धूर्वहं त्वद्भृन्मन्मकुटप्रसिद्धिमधिकां
    श्रीवल्लभ श्रूयताम् ॥ ४२॥ शेषत्वेन निरूपितं गुरुवरैस्तच्छेषतामाश्रितैः स्वामित्वं निरुपाधिकं भजदहो
    निर्दोषमत्स्वत्वभाक् । लक्ष्मीभागधरीकृतं तु भवता लोकानुकूलं पुरा त्वामुद्वास्य तव प्रभुत्वमकरोन्नो
    वेत्सि किं तत्प्रभो ॥ ४३॥ गावो यत्र निरूप्यमाणविलसद्रूपानुगच्छध्दृदः सोत्कण्ठा विचरन्त्यहो सुमनसां
    पद्वाऽप्यजानां गवाम् । शीर्षेषु प्रतिभाति निर्मलदृशाम् त्वद्गत्युपायात्मता यस्मिन्नेव विभाति तेन सदृशं
    लक्ष्मीश किं वर्तते ॥ ४४॥ गेहादेर्मनुजास्त्रिविष्टपसदस्तेषां पयोजासनः तेषां तस्य च वेङ्कटाचलपते श्रीशस्य
    ते श्रीश पादद्वयम् । यत्तस्यापि हि पादुकामणिमयं संरक्षकं पुंमणिव्याकीर्णं तदनन्यरक्षककथं मां सर्वदा
    रक्षतु ॥ ४५॥ स्तोत्रं गोत्रापतीनां न कुरु मुख मुधा स्वाय ते ज्ञा यदि स्युः नो जानन्त्युक्तिशक्तिं
    त्रिचतुरपदधीलोलवाचो यदि स्युः । दुर्वाराखर्वगर्वाः परिभवचतुरास्सिद्धयो यद्यलभ्याः नात्मश्लाघां सहन्ते
    न तव फललवस्तद्भज श्रीनिवासम् ॥ ४६॥ नो गच्छेः कविते सुते क्षितिपतिं त्वं चन्दनद्रुं धने गन्धे लोलतया
    ससंशयबुधक्रूराहयस्तत्र हि । अन्योन्यैक्यगलत्कुदूषणविषाः साध्वोषधिस्पर्शतोऽप्येग्रे त्वां बत मारयेयुरचिरात्
    तत् पत्रिपत्रं भज ॥ ४७॥ बोद्धारोऽपि समिद्धमत्सरतया नाद्धावहित्थाचणाः शुद्धोक्तिष्वविशुद्धबुद्धिजननश्रद्धालुतात्युद्धताः
    । मद्धीकानपि विद्धयन्ति कविते श्रद्धत्स्व तेमेऽद्धावचोऽ बद्धक्ष्मेशगुणा जगद्धवपदे नद्धा ममृद्धा भव
    ॥ ४८॥ विद्वद्द्वेषभृतो मुधापदगणाः प्रोच्चैस्स्वरा निस्त्रपाः सङ्केतेन परस्परं स्वविजये साक्षित्वमप्याश्रिताः
    । सद्बुद्धीनपि वञ्चयन्ति विबुधान् भूपान्तिके नास्तिका विद्यावित्तविघातुका भुवि कृते लक्ष्मीशमेवाश्रय
    ॥ ४९॥ गौर्गां गवा गवे गोर्गोर्गवि गौर्यस्य पाति यः । वराय पीडकान् व्याप्तान् दत्ते तं श्रीनिधिं भज
    ॥ ५०॥ वृषाचलेशितुः पदाश्रिताः कुभृन्मुदाऽऽपतत्
