id: saptabuddhastotram
category: stotram
name:
  english: saptabuddhastotram
  devanagari: सप्तबुद्धस्तोत्रम्
content:
  english: mayuh shashtisahasradabhavadurumateryasya samvatsaranam | jitva kleshanasheshanamritamadhigatam
    yena shalasya mule tam vande dharmarajam bhuvanahitakaram vishvabhunamadheyam || 3|| kshemavatyam
    prajato manujapatisame yo vashi vipravamshe ayurvarshayutani pravaragunanidherashtacatvari caiva |
    jainendram yena labdham tribhavavadhakaram jnanakhadgeshvarena vande'ham simhakayam sugatamanupamam
    kakupchandam munindram || 4|| shobhavatyam dvijanam narapatimahite yo'nvaye samprasutas tasyamayuh
    sahasranyatishayavapushastrimshadevam babhuva | buddhatvam yena ratnacalavaragurunaudumbare praptamasid
    tam vande shasitaram kanakamunimrishim dhvastamohandhakaram || 5|| varanasyam krishishakshitipatimahite
    vipravamshe'bhijato yasyamayuh sahasranyatishayamahitam vimshatirvatsaranam | yena nyagrodhamule tribhavajalanidhih
    poshito divyagatya tam vande vandaniyam munivaramanagham kashyapam lokanatham || 6|| yo jatah shrivishale
    kapilapuravare shakyarajendravamshe yasyasidayurekamshatamiha sharadam sarvalokaikabandhoh | nirgatyashvatthamule
    namucimapi sata'nuttara yena bodhis tam vande shakyasimham suranaranamitam buddhamadityabandhum ||
    7|| jatim vipretivamshe nripavaramahite ketumatyam grihitva buddhatvam yena labdhamatigunanidhina
    nagavrikshasya mule | ashtavabdayutani kshapitabhagavato bhavi yasyagramayur vande maitreyanatham
    tushitapuravare bhavinam lokanatham || 8|| stutva vai saptabuddhan sakalamupagatan saptasaptarkabhaso
    maitreyam ca stuvan vai tushitapuragatam bhavinam lokanatham | yatpunyam samprasutam shubhagatiphaladam
    dehinameva sarvam chitva sankleshapashan munaya iva caran nirvritim sa prayatu || 9|| iti shrisaptabuddhastotram
    sampurnam ||
  devanagari: मायुः षष्टिसहस्रादभवदुरुमतेर्यस्य संवत्सराणाम् । जित्वा क्लेशानशेषानमृतमधिगतं येन शालस्य
    मूले तं वन्दे धर्मराजं भुवनहितकरं विश्वभूनामधेयम् ॥ ३॥ क्षेमावत्यां प्रजातो मनुजपतिसमे यो वशी विप्रवंशे
    आयुर्वर्षायुतानि प्रवरगुणनिधेरष्टचत्वारि चैव । जैनेन्द्रं येन लब्धं त्रिभववधकरं ज्ञानखड्गेश्वरेण वन्देऽहं
    सिंहकायं सुगतमनुपमं ककुप्छन्दं मुनीन्द्रम् ॥ ४॥ शोभावत्यां द्विजानां नरपतिमहिते योऽन्वये संप्रसूतस्
    तस्यामायुः सहस्राण्यतिशयवपुषस्त्रिंशदेवं बभूव । बुद्धत्वं येन रत्नाचलवरगुरुणौदुम्बरे प्राप्तमासीद्
    तं वन्दे शासितारं कनकमुनिमृषिं ध्वस्तमोहान्धकारम् ॥ ५॥ वाराणस्यां कृषीशक्षितिपतिमहिते विप्रवंशेऽभिजातो
    यस्यामायुः सहस्राण्यतिशयमहितं विंशतिर्वत्सराणाम् । येन न्यग्रोधमूले त्रिभवजलनिधिः पोषितो दिव्यगत्या
    तं वन्दे वन्दनीयं मुनिवरमनघं काश्यपं लोकनाथम् ॥ ६॥ यो जातः श्रीविशाले कपिलपुरवरे शाक्यराजेन्द्रवंशे
    यस्यासीदायुरेकंशतमिह शरदां सर्वलोकैकबन्धोः । निर्गत्याश्वत्थमूले नमुचिमपि सताऽनुत्तरा येन बोधिस् तं
    वन्दे शाक्यसिंहं सुरनरनमितं बुद्धमादित्यबन्धुम् ॥ ७॥ जातिं विप्रेतिवंशे नृपवरमहिते केतुमत्यां गृहीत्वा
    बुद्धत्वं येन लब्धमतिगुणनिधिना नागवृक्षस्य मूले । अष्टावब्दायुतानि क्षपितभगवतो भावि यस्याग्रमायुर्
    वन्दे मैत्रेयनाथं तुषितपुरवरे भाविनं लोकनाथम् ॥ ८॥ स्तुत्वा वै सप्तबुद्धान् सकलमुपगतान् सप्तसप्तार्कभासो
    मैत्रेयं च स्तुवन् वै तुषितपुरगतं भाविनं लोकनाथम् । यत्पुण्यं संप्रसूतं शुभगतिफलदं देहिनामेव सर्वं
    छित्वा सङ्क्लेशपाशान् मुनय इव चरन् निर्वृतिं स प्रयातु ॥ ९॥ इति श्रीसप्तबुद्धस्तोत्रं सम्पूर्णम् ॥
