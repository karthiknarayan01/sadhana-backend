id: batukabhairavasahasranamastotram-2
category: sahasranama
name:
  english: batukabhairavasahasranamastotram
  devanagari: बटुकभैरवसहस्रनामस्तोत्रम्
content:
  english: shridurvasa rishaye namah shirasi | anushtup chandase namah mukhe | shribatukabhairavo devatayai
    namah hridi | mama sarvakaryasiddhyartha sarvashatrunivaranartham shribatukabhairavasahasranamastavapathe
    viniyogaya namah sarvange | om namo bhairavarupaya bhairavaya namo namah | namo bhadrasvarupaya jayadaya
    namo namah || 1|| namah kalpasvarupaya vikalpaya namo namah | namah shuddhasvarupaya suprakashaya
    te namah || 2|| namah kankalarupaya kalarupa namo'stute | namastryambakarupaya mahakalaya te namo
    namah || 3|| namah samsarasaraya saradaya namo namah | namo bhairavarupaya bhairavaya namo namah ||
    4|| namah kshetranivasaya kshetrapalaya te namah | kshetrakshetrasvarupaya kshetrakartre namo namah
    || 5|| namo nagavinashaya bhairavaya namah | namo matangarupaya bhararupa namo'stu te || 6|| namah
    siddhasvarupaya siddhidaya namo namah | namah bindusvarupaya bindusindhuprakashine || 7|| namah mangalarupaya
    mangalaya namo namah | namah sankatanashaya shankaraya namo namah || 8|| namo dharmasvarupaya dharmadaya
    namo namah | namo'nantasvarupaya ekarupa namo'stu te || 9|| namo vriddhisvarupaya vriddhikaminnamo'stute
    | namo mohanarupaya moksharupaya te namah || 10|| namo jaladarupaya samarupa namo'stu te | namah sthulasvarupaya
    shuddharupaya te namah || 11|| namo nilasvarupaya rangarupaya te namah | namo mandalarupaya mandalaya
    namo namah || 12|| namo rudrasvarupaya rudranathaya te namah | namo brahmasvarupaya brahmavaktre namo
    namah || 13|| namastrishuladharaya dharadharinnamo'stute | namah samsarabijaya virupaya namo namah
    || 14||
  devanagari: श्रीदुर्वासा ऋषये नमः शिरसि । अनुष्टुप् छन्दसे नमः मुखे । श्रीबटुकभैरवो देवतायै नमः हृदि
    । मम सर्वकार्यसिद्ध्यर्थ सर्वशत्रुनिवारणार्थं श्रीबटुकभैरवसहस्रनामस्तवपाठे विनियोगाय नमः सर्वाङ्गे
    । ॐ नमो भैरवरूपाय भैरवाय नमो नमः । नमो भद्रस्वरूपाय जयदाय नमो नमः ॥ १॥ नमः कल्पस्वरूपाय विकल्पाय नमो
    नमः । नमः शुद्धस्वरूपाय सुप्रकाशाय ते नमः ॥ २॥ नमः कङ्कालरूपाय कालरूप नमोऽस्तुते । नमस्त्र्यम्बकरूपाय
    महाकालाय ते नमो नमः ॥ ३॥ नमः संसारसाराय सारदाय नमो नमः । नमो भैरवरूपाय भैरवाय नमो नमः ॥ ४॥ नमः क्षेत्रनिवासाय
    क्षेत्रपालाय ते नमः । क्षेत्राक्षेत्रस्वरूपाय क्षेत्रकर्त्रे नमो नमः ॥ ५॥ नमो नागविनाशाय भैरवाय नमः
    । नमो मातङ्गरूपाय भाररूप नमोऽस्तु ते ॥ ६॥ नमः सिद्धस्वरूपाय सिद्धिदाय नमो नमः । नमः बिन्दुस्वरूपाय
    बिन्दुसिन्धुप्रकाशिने ॥ ७॥ नमः मङ्गलरूपाय मङ्गलाय नमो नमः । नमः सङ्कटनाशाय शङ्कराय नमो नमः ॥ ८॥ नमो
    धर्मस्वरूपाय धर्मदाय नमो नमः । नमोऽनन्तस्वरूपाय एकरूप नमोऽस्तु ते ॥ ९॥ नमो वृद्धिस्वरूपाय वृद्धिकामिन्नमोऽस्तुते
    । नमो मोहनरूपाय मोक्षरूपाय ते नमः ॥ १०॥ नमो जलदरूपाय सामरूप नमोऽस्तु ते । नमः स्थूलस्वरूपाय शुद्धरूपाय
    ते नमः ॥ ११॥ नमो नीलस्वरूपाय रङ्गरूपाय ते नमः । नमो मण्डलरूपाय मण्डलाय नमो नमः ॥ १२॥ नमो रुद्रस्वरूपाय
    रुद्रनाथाय ते नमः । नमो ब्रह्मस्वरूपाय ब्रह्मवक्त्रे नमो नमः ॥ १३॥ नमस्त्रिशूलधाराय धाराधारिन्नमोऽस्तुते
    । नमः संसारबीजाय विरूपाय नमो नमः ॥ १४॥
