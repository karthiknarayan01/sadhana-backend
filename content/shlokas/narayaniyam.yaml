id: narayaniyam
category: stotram
name:
  english: narayaniyam
  devanagari: नारायणीयम्
content:
  english: 11|| iti melpattur shrinarayanabhattatirivaryaviracitam narayaniyam stotram samaptam || anubandham
    shrikrishnapadambujam mangaḻam manjulam krishnapadambujam mangalyadayakam krishnapadambujam | sankatanashanam
    krishnapadambujam santoshadayakam krishnapadambujam || dushtavinashanam krishnapadambujam shishtajanapriyam
    krishnapadambujam | muktipradayakam krishnapadambujam shaktipradayakam krishnapadambujam || sanmayam
    cinmayam krishnapadambujam kalmashanashanam krishnapadambujam | nishkalam nistulam krishnapadambujam
    nityaniramayam krishnapadambujam || anandadayakam krishnapadambujam akulanashanam krishnapadambujam
    | modapradayakam krishnapadambujam mohavinashanam krishnapadambujam || shriguruvayupureshapadambujam
    shrishridayakam krishnapadambujam | nityam namaskaru nityam bhaja bhaja nityam smara smara krishnapadambujam
    || mangalam mangaḻam mangaḻakanta tava vakshasthale sthita | mangaḻam prarthyamanasya karotu mama
    mangaḻam || 1|| tvameva mangaḻakantah lokamangaḻakarakah | mangaḻam te pravakshyami mama mangalahetave
    || 2|| narayanaya haraye srishtisthityantakarine | guruvatapurishaya vishvarupaya mangaḻam || 3||
    shankhacakragadapadmamalakaustubhadharine | guruvatapurishaya vishnurupaya mangaḻam || 4|| praḻayabdhicarayastu
    namo vedavikasine | guruvatapurishaya matsyarupaya mangaḻam || 5|| lakshminathaya shantaya namo mandaradharine
    | guruvatapurishaya kurmarupaya mangaḻam || 6|| kshityuddharaviharaya hiranyakshasuharine | guruvatapurishaya
    krodarupaya mangaḻam || 7|| prahladarakshakayastu hiranyakashipughatine | guruvatapurishaya narasimhaya
    mangaḻam || 8|| vamanaya namastubhyam balidarpapaharine | guruvatapurishaya yajnarupaya mangaḻam ||
    9|| balyarpitapadabjaya krantatribhuvanaya ca | guruvatapurishaya vishvarupaya mangaḻam || 10|| namah
    parashuhastaya keraḻoddharakaya ca | guruvatapurishaya bhargavayadya mangaḻam || 11|| namah kodandahastaya
    dashagrivantakaya ca | guruvatapurishaya ramacandraya mangaḻam || 12|| balagopalaveshaya putanamokshadayine
    | guruvatapurishaya govindayastu mangaḻam || 13|| varabhattatrivandyaya vataroganivarine | jnanapradaya
    devaya vateshayastu mangaḻam || 14|| dayasaraya saumyaya mama mangaḻakarine | sarvarogapaharaya vateshayadya
    mangaḻam || 15|| maya vandyaya nityaya jagatkaranamurtaye | mama tapavinashaya jagarukaya mangaḻam
    || 16|| shubhamastu || parayanavasanashlokah svasti prajabhyah paripalayantam nyayyena margena mahim
    mahishah | gobrahmanebhyah shubhamastu nityam lokassamastassukhino bhavantu || kale varshatu parjanyah
    prithivi sasyashalini | loko'yam kshobharahitah sajjanassantu nirbhayah || aputrah putrinah santu
    putrinassantu pautrinah | adhanah sadhanassantu jivantu sharadam shatam || tvameva mata ca pita tvameva
    tvameva bandhushca sakha tvameva | tvameva vidya dravinam tvameva tvameva sarvam mama deva deva ||
    kayena vaca manasendriyairva bud
  devanagari: ११॥ इति मेल्पत्तूर् श्रीनारायणभट्टतिरिवर्यविरचितं नारायणीयं स्तोत्रं समाप्तम् ॥ अनुबन्धम्
    श्रीकृष्णपादाम्बुजं मङ्गळं मञ्जुलं कृष्णपादाम्बुजं मङ्गल्यदायकं कृष्णपादाम्बुजम् । सङ्कटनाशनं कृष्णपादाम्बुजं
    सन्तोषदायकं कृष्णपादाम्बुजम् ॥ दुष्टविनाशनं कृष्णपादाम्बुजं शिष्टजनप्रियं कृष्णपादाम्बुजम् । मुक्तिप्रदायकं
    कृष्णपादाम्बुजं शक्तिप्रदायकं कृष्णपादाम्बुजम् ॥ सन्मयं चिन्मयं कृष्णपादाम्बुजं कल्मषनाशनं कृष्णपादाम्बुजम्
    । निष्कलं निस्तुलं कृष्णपादाम्बुजं नित्यनिरामयं कृष्णपादाम्बुजम् ॥ आनन्ददायकं कृष्णपादाम्बुजं आकुलनाशनं
    कृष्णपादाम्बुजम् । मोदप्रदायकं कृष्णपादाम्बुजं मोहविनाशनं कृष्णपादाम्बुजम् ॥ श्रीगुरुवायुपुरेशपादाम्बुजं
    श्रीश्रीदायकं कृष्णपादाम्बुजम् । नित्यं नमस्करु नित्यं भज भज नित्यं स्मर स्मर कृष्णपादाम्बुजम् ॥ मङ्गलम्
    मङ्गळं मङ्गळाकान्त तव वक्षस्थले स्थिता । मङ्गळं प्रार्थ्यमानस्य करोतु मम मङ्गळम् ॥ १॥ त्वमेव मङ्गळाकान्तः
    लोकमङ्गळकारकः । मङ्गळं ते प्रवक्ष्यामि मम मङ्गलहेतवे ॥ २॥ नारायणाय हरये सृष्टिस्थित्यन्तकारिणे । गुरुवातपुरीशाय
    विश्वरूपाय मङ्गळम् ॥ ३॥ शङ्खचक्रगदापद्ममालाकौस्तुभधारिणे । गुरुवातपुरीशाय विष्णुरूपाय मङ्गळम् ॥ ४॥
    प्रळयाब्धिचरायास्तु नमो वेदविकासिने । गुरुवातपुरीशाय मत्स्यरूपाय मङ्गळम् ॥ ५॥ लक्ष्मीनाथाय शान्ताय
    नमो मन्दरधारिणे । गुरुवातपुरीशाय कूर्मरूपाय मङ्गळम् ॥ ६॥ क्षित्युद्धारविहाराय हिरण्याक्षासुहारिणे
    । गुरुवातपुरीशाय क्रोडरूपाय मङ्गळम् ॥ ७॥ प्रह्लादरक्षकायास्तु हिरण्यकशिपुघातिने । गुरुवातपुरीशाय नारसिंहाय
    मङ्गळम् ॥ ८॥ वामनाय नमस्तुभ्यं बलिदर्पापहारिणे । गुरुवातपुरीशाय यज्ञरूपाय मङ्गळम् ॥ ९॥ बल्यर्पितपदाब्जाय
    क्रान्तत्रिभुवनाय च । गुरुवातपुरीशाय विश्वरूपाय मङ्गळम् ॥ १०॥ नमः परशुहस्ताय केरळोद्धारकाय च । गुरुवातपुरीशाय
    भार्गवायाद्य मङ्गळम् ॥ ११॥ नमः कोदण्डहस्ताय दशग्रीवान्तकाय च । गुरुवातपुरीशाय रामचन्द्राय मङ्गळम्
    ॥ १२॥ बालगोपालवेषाय पूतनामोक्षदायिने । गुरुवातपुरीशाय गोविन्दायास्तु मङ्गळम् ॥ १३॥ वरभट्टात्रिवन्द्याय
    वातरोगनिवारिणे । ज्ञानप्रदाय देवाय वातेशायास्तु मङ्गळम् ॥ १४॥ दयासाराय सौम्याय मम मङ्गळकारिणे । सर्वरोगापहाराय
    वातेशायाद्य मङ्गळम् ॥ १५॥ मया वन्द्याय नित्याय जगत्कारणमूर्तये । मम तापविनाशाय जागरूकाय मङ्गळम् ॥
    १६॥ शुभमस्तु ॥ पारायणावसानश्लोकाः स्वस्ति प्रजाभ्यः परिपालयन्तां न्याय्येन मार्गेण महीं महीशाः । गोब्राह्मणेभ्यः
    शुभमस्तु नित्यं लोकास्समस्तास्सुखिनो भवन्तु ॥ काले वर्षतु पर्जन्यः पृथिवी सस्यशालिनी । लोकोऽयं क्षोभरहितः
    सज्जनास्सन्तु निर्भयाः ॥ अपुत्राः पुत्रिणः सन्तु पुत्रिणस्सन्तु पौत्रिणः । अधनाः सधनास्सन्तु जीवन्तु
    शरदां शतम् ॥ त्वमेव माता च पिता त्वमेव त्वमेव बन्धुश्च सखा त्वमेव । त्वमेव विद्या द्रविणं त्वमेव त्वमेव
    सर्वं मम देव देव ॥ कायेन वाचा मनसेन्द्रियैर्वा बुद्
