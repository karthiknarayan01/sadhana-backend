id: anaghakavacashtakam
category: kavacha
name:
  english: anaghakavacashtakam
  devanagari: अनघाकवचाष्टकम्
content:
  english: shri anaghakavacashtakam shiro me anagha patu bhalam me dattabhamini | bhrumadhyam yogini patu
    netre patu sudarshini || 1|| nasarandhradvaye patu yogishi bhaktavatsala || mukham me madhuvakpatu
    dattacittaviharini || 2|| trikanthi patu me kantham vacam vacaspatipriya | skandhau me triguna patu
    bhujau kamaladharini || 3|| karau sevarata patu hridayam mandahasini | udaram annada patu svayanja
    nabhimandalam || 4|| kamaniya kati patu guhyam guhyeshvari sada | uru me patu jambhaghni januni renukeshtada
    || 5|| padau padasthita patu putrada vai khilam vapuh | vamaga patu vamangam dakshanga gurugamini
    || 6|| griham me dattagrihini bahye sarvatmika'vatu | trikale sarvada rakshet patishushrunotsuka ||
    7|| jaya me dattavamangi ashtaputra suto'vatu | gotramatri snusha rakshedanagha bhaktarakshani ||
    8|| yah pathedanaghakavacam nityam bhaktiyuto narah | tasmai bhavatyanaghamba varada sarvabhagyada
    || iti shri anaghakavacashtakam sampurnam |
  devanagari: श्री अनघाकवचाष्टकम् शिरो मे अनघा पातु भालं मे दत्तभामिनी । भ्रूमध्यं योगिनी पातु नेत्रे
    पातु सुदर्शिनी ॥ १॥ नासारन्ध्रद्वये पातु योगिशी भक्तवत्सला ॥ मुखं मे मधुवाक्पातु दत्तचित्तविहारिणी
    ॥ २॥ त्रिकण्ठी पातु मे कण्ठं वाचं वाचस्पतिप्रिया । स्कन्धौ मे त्रिगुणा पातु भुजौ कमलधारिणी ॥ ३॥ करौ
    सेवारता पातु हृदयं मन्दहासिनी । उदरं अन्नदा पातु स्वयञ्जा नाभिमण्डलम् ॥ ४॥ कमनिया कटि पातु गुह्यं
    गुह्येश्वरी सदा । ऊरु मे पातु जम्भघ्नी जानुनी रेणुकेष्टदा ॥ ५॥ पादौ पादस्थिता पातु पुत्रदा वै खिलं
    वपुः । वामगा पातु वामाङ्गं दक्षाङ्ग गुरुगामिनी ॥ ६॥ गृहं मे दत्तगृहिणी बाह्ये सर्वात्मिकाऽवतु । त्रिकाले
    सर्वदा रक्षेत् पतिशुश्रुणोत्सुका ॥ ७॥ जाया मे दत्तवामाङ्गी अष्टपुत्रा सुतोऽवतु । गोत्रमत्रि स्नुषा
    रक्षेदनघा भक्तरक्षणी ॥ ८॥ यः पठेदनघाकवचं नित्यं भक्तियुतो नरः । तस्मै भवत्यनघाम्बा वरदा सर्वभाग्यदा
    ॥ इति श्री अनघाकवचाष्टकं सम्पूर्णम् ।
