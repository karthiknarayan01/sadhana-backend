id: yadagirilakshmiprapatti
category: stotram
name:
  english: yadagirilakshmiprapatti
  devanagari: यादगिरिलक्ष्मिप्रपत्ति
content:
  english: shriyadagiri lakshminrisimha prapattih lakshminrisimha lalanam jagatosyanetrim matrisvabhava
    mahitam haritulya shilam | lokasya mangaḻakarim ramaniya rupam padmalayam bhagavatim sharanam prapadye
    || 1|| shriyadanamakamunindratapovisheshat shriyadashailashikhare satata prakashau | bhaktanuragabharitau
    bhavaroga vaidyau lakshminrisimha caranau sharanam prapadye || 2|| devasvarupa vikritavapinaijarupau
    sarvottarau sujana saru nishevyamanau | sarvasya jivanakarau sadrrishasvarupau lakshminrisimha caranau
    sharanam prapadye || 3|| lakshmishate prapadane sahakarabhutau tvattopyati priyatamau sharanagatanam
    | rakshavicakshana patu karunalayau shri lakshminrisimha caranau sharanam prapadye || 4|| prahlada
    pautra balidanava bhumidana kalaprakashita nijanya jaghanya bhavau | lokapramana karanau shubhadau
    suranam lakshminrisimha caranau sharanam prapadye || 5|| kayadaviya shubhamanasa rajahamsau vedanta
    kalpataru pallava talli jautau | sadbhakta muladhanamityudita prabhavau lakshminrisimha caranau sharanam
    prapadye || 6|| || iti shri vangipuram narasimhacarya viracitam shri yadagiri lakshminrisimha prapattih
    samaptam ||
  devanagari: श्रीयादगिरि लक्ष्मीनृसिंह प्रपत्तिः लक्ष्मीनृसिंह ललनाम् जगतोस्यनेत्रीम् मातृस्वभाव महिताम्
    हरितुल्य शीलाम् । लोकस्य मङ्गळकरीम् रमणीय रूपाम् पद्मालयाम् भगवतीम् शरणम् प्रपद्ये ॥ १॥ श्रीयादनामकमुनीन्द्रतपोविशेषात्
    श्रीयादशैलशिखरे सतत प्रकाशौ । भक्तानुरागभरितौ भवरोग वैद्यौ लक्ष्मीनृसिंह चरणौ शरणम् प्रपद्ये ॥ २॥
    देवस्वरूप विकृतावपिनैजरुपौ सर्वोत्तरौ सुजन सरु निशेव्यमानौ । सर्वस्य जीवनकरौ सद्रृशस्वरूपौ लक्ष्मीनृसिंह
    चरणौ शरणम् प्रपद्ये ॥ ३॥ लक्ष्मीशते प्रपदने सहकारभूतौ त्वत्तोप्यति प्रियतमौ शरणागतानाम् । रक्षाविचक्षण
    पटू करुणालयौ श्री लक्ष्मीनृसिंह चरणौ शरणम् प्रपद्ये ॥ ४॥ प्रह्लाद पौत्र बलिदानव भूमिदान कालप्रकाशित
    निजान्य जघन्य भावौ । लोकप्रमाण करणौ शुभदौ सुरानाम् लक्ष्मीनृसिंह चरणौ शरणम् प्रपद्ये ॥ ५॥ कायादवीय
    शुभमानस राजहंसौ वेदान्त कल्पतरु पल्लव टल्लि जौतौ । सद्भक्त मूलधनमित्युदित प्रभावौ लक्ष्मीनृसिंह चरणौ
    शरणम् प्रपद्ये ॥ ६॥ ॥ इति श्री वाङ्गीपुरम् नरसिंहाचार्य विरचितं श्री यादगिरि लक्ष्मीनृसिंह प्रपत्तिः
    समाप्तम् ॥
