    विशो॑ यथा॒ प्रदे॑व वरुण व्र॒तम् । मि॒नी॒मसि॒ द्यवि॑द्यवि ॥ य वँ॑रुण॒ दैव्ये॒ जने॑ श्चरा॑मसि । अचि॑त्ती॒य
    त्तव॒ धर्मा॑ युयोपि॒ममा न॒स्तस्मा॒ देन॑सो देव रीरिषः ॥ कि॒त॒वासो॒ यद्रि॑ रि॒पुर्न दी॒वि यद्वा॑ घा
    स॒त्य मु॒तयन्न वि॒द्म । सर्वा॒ ता विष्य॑ शिथि॒रे व॑ दे॒वाथा॑ ते स्याम वरुण प्रि॒यासः॑ ॥ दे॒वा वा अ॑भ्याता॒ना
    ॥ हरिः॑ ओम् ॥ ॥ कृष्ण यजुर्वेदीय तैत्तिरीय संहिताया न्तृतीयकाण्डे चतुर्थः प्रश्न
