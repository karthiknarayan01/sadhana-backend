id: gayatrisarasvatikritamshivastotram
category: stotram
name:
  english: gayatrisarasvatikritamshivastotram
  devanagari: गायत्रीसरस्वतीकृतंशिवस्तोत्रम्
content:
  english: gayatrisarasvatikritam shivastotram gayatrisarasvatyavucatuh | namo durvarasamsaradhvantadhvamsaikahetave
    | jvalajjvalavalibhimakalakutavishadine || 27|| jaganmohana pancastradehanathaikahetave | jagadantakarakrura
    yamantaka namo'stu te || 28|| gangatarangasampriktajatamandaladharine | namaste'stu virupaksha balashitamshudharine
    || 29|| pinakabhimatankaratrasitatripuraukase | namaste vividhakarajagatsrashtrishirashchide || 1
  devanagari: गायत्रीसरस्वतीकृतं शिवस्तोत्रम् गायत्रीसरस्वत्यावूचतुः । नमो दुर्वारसंसारध्वान्तध्वंसैकहेतवे
    । ज्वलज्ज्वालावलीभीमकालकूटविषादिने ॥ २७॥ जगन्मोहन पञ्चास्त्रदेहनाथैकहेतवे । जगदन्तकरक्रूर यमान्तक
    नमोऽस्तु ते ॥ २८॥ गङ्गातरङ्गसम्पृक्तजटामण्डलधारिणे । नमस्तेऽस्तु विरूपाक्ष बालशीतांशुधारिणे ॥ २९॥
    पिनाकभीमटङ्कारत्रासितत्रिपुरौकसे । नमस्ते विविधाकारजगत्स्रष्टृशिरश्छिदे ॥ १
meaning: {}
