id: namavali-5-2
category: stotram
name:
  english: namavali
  devanagari: नामावली
content:
  english: anjaneyadvadashanamavalih om hanumate namah | anjanasunave | vayuputraya | mahabalaya | rameshtaya
    | phalgunasakhaya | pingakshaya | amitavikramaya | udadhikramanaya | sitashokavinashakaya | lakshmanapranadatre
    | dashagrivasyadarpaghne namah | iti anjaneyadvadashanamavalih sampurna |
  devanagari: आञ्जनेयद्वादशनामावलिः ॐ हनुमते नमः । अञ्जनासूनवे । वायुपुत्राय । महाबलाय । रामेष्टाय । फल्गुनसखाय
    । पिङ्गाक्षाय । अमितविक्रमाय । उदधिक्रमणाय । सीताशोकविनाशकाय । लक्ष्मणप्राणदात्रे । दशग्रीवस्यदर्पघ्ने
    नमः । इति आञ्जनेयद्वादशनामावलिः सम्पूर्णा ।
meaning: {}
