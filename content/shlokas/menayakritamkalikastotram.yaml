id: menayakritamkalikastotram
category: stotram
name:
  english: menayakritamkalikastotram
  devanagari: मेनयाकृतंकालिकास्तोत्रम्
content:
  english: menaya kritam kalikastotram 2 menovaca | mahamayam jagaddhatrim candikan lokadharinim | pranamami
    mahadevim sarvakamarthadayinim || 21|| nityanandakarim mayam yoganidram jagatprasum | pranamami sadasiddham
    shubhasarasamalinim || 22|| matamahim sadanandam bhaktashokavinashinim | akalpam vanitanam ca praninam
    buddhirupinim || 23|| sa tvam bandhacchedaheturyatinam kaste geyo madrishibhih prabhavah | himsaya
    vatharvavedasya sa tvam nityam kamam tvam mameshtam vidhehi || 24|| nityanityairbhavahinaih parastaistattanmatrairyojyate
    bhutavargah | tesham shaktistvam sada nityarupa kale yosha yogayukta samartha || 25|| yonirdharitri
    jagatam tvameva tvameva nitya prakritih parastat | yatha vasham kriyate brahmarupam sa tvam nitya
    me prasidadya matah || 26|| tvam jatavedogatashaktirugra tvam dahika suryakarasya shaktih | ahladika
    tvam bahucandrika ya tam tvamaham staumi namami candim || 27|| yoshanam satpriya ca tvam nitya tvam
    cordhvaretasam | vancha tvam sarvajagatam dhaya ca tvam yatha hareh || 28|| ya ceshtarupani vidhaya
    devi srishtisthitanashamayi ca kartri | brahmacyutasthanusharirahetussa tvam prasidadya punarnamaste
    || 29|| iti shivapurane rudrasamhitayam parvatikhande pancamadhyayantargatam menaya kritam kalikastotram
    samapatam | shivapurana | rudrasamhita | parvatikhanda | adhyaya 5
  devanagari: मेनया कृतं कालिकास्तोत्रम् २ मेनोवाच । महामायां जगद्धात्रीं चण्डिकाङ् लोकधारिणीम् । प्रणमामि
    महादेवीं सर्वकामार्थदायिनीम् ॥ २१॥ नित्यानन्दकरीं मायां योगनिद्रां जगत्प्रसूम् । प्रणमामि सदासिद्धां
    शुभसारसमालिनीम् ॥ २२॥ मातामहीं सदानन्दां भक्तशोकविनाशिनीम् । आकल्पं वनितानां च प्राणिनां बुद्धिरूपिणीम्
    ॥ २३॥ सा त्वं बन्धच्छेदहेतुर्यतीनां कस्ते गेयो मादृशीभिः प्रभावः । हिंसाया वाथर्ववेदस्य सा त्वं नित्यं
    कामं त्वं ममेष्टं विधेहि ॥ २४॥ नित्यानित्यैर्भावहीनैः परास्तैस्तत्तन्मात्रैर्योज्यते भूतवर्गः । तेषां
    शक्तिस्त्वं सदा नित्यरूपा काले योषा योगयुक्ता समर्था ॥ २५॥ योनिर्धरित्री जगतां त्वमेव त्वमेव नित्या
    प्रकृतिः परस्तात् । यथा वशं क्रियते ब्रह्मरूपं सा त्वं नित्या मे प्रसीदाद्य मातः ॥ २६॥ त्वं जातवेदोगतशक्तिरुग्रा
    त्वं दाहिका सूर्यकरस्य शक्तिः । आह्लादिका त्वं बहुचन्द्रिका या तां त्वामहं स्तौमि नमामि चण्डीम् ॥
    २७॥ योषाणां सत्प्रिया च त्वं नित्या त्वं चोर्ध्वरेतसाम् । वाञ्छा त्वं सर्वजगतां धाया च त्वं यथा हरेः
    ॥ २८॥ या चेष्टरूपाणि विधाय देवी सृष्टिस्थितानाशमयी च कर्त्री । ब्रह्माच्युतस्थाणुशरीरहेतुस्सा त्वं
    प्रसीदाद्य पुनर्नमस्ते ॥ २९॥ इति शिवपुराणे रुद्रसंहितायां पार्वतीखण्डे पञ्चमाध्यायान्तर्गतं मेनया
    कृतं कालिकास्तोत्रं समापतम् । शिवपुराण । रुद्रसंहिता । पार्वतीखण्ड । अध्याय ५
