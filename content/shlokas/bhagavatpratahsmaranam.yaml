id: bhagavatpratahsmaranam
category: stotram
name:
  english: bhagavatpratahsmaranam
  devanagari: भगवत्प्रातह्स्मरणम्
content:
  english: bhagavatpratahsmaranam shri ganeshaya namah | pratah smarami phanirajatanau shayanam nagamarasuranaradijagannidanam
    | vedaih sahagamaganairupagiyamanam kantaraketanavatam paramam nidhanam || 1|| pratarbhajami bhavasagaravariparam
    devarshisiddhanivahairvihitopaharam | samdriptadanavakadambamadapaharam saundaryarashijalarashisutaviharam
    || 2|| pratarnamami sharadambarakantikantam padaravindamakarandajusham bhavantam | nanavatarahritabhumibharam
    kritantam pathojakamburathapadakaram prashantam || 3|| shlokatrayamidam punyam brahmanandena kirtitam
    | yah pathetpratarutthaya sarvapapaih pramucyate || 4|| iti shriparamahamsasvamibrahmanandaviracitam
    shribhagavatpratahsmaranam sampurnam ||
  devanagari: भगवत्प्रातःस्मरणम् श्री गणेशाय नमः । प्रातः स्मरामि फणिराजतनौ शयानं नागामरासुरनरादिजगन्निदानम्
    । वेदैः सहागमगणैरूपगीयमानं कान्तारकेतनवतां परमं निधानम् ॥ १॥ प्रातर्भजामि भवसागरवारिपारं देवर्षिसिद्धनिवहैर्विहितोपहारम्
    । संदृप्तदानवकदम्बमदापहारं सौन्दर्यराशिजलराशिसुताविहारम् ॥ २॥ प्रातर्नमामि शरदम्बरकान्तिकान्तं पादारविन्दमकरन्दजुषां
    भवान्तम् । नानावतारहृतभूमिभरं कृतान्तं पाथोजकम्बुरथपादकरं प्रशान्तम् ॥ ३॥ श्लोकत्रयमिदं पुण्यं ब्रह्मानन्देन
    कीर्तितम् । यः पठेत्प्रातरुत्थाय सर्वपापैः प्रमुच्यते ॥ ४॥ इति श्रीपरमहंसस्वामिब्रह्मानन्दविरचितं
    श्रीभगवत्प्रातःस्मरणं सम्पूर्णम् ॥
