id: pandurangastotram-2
category: stotram
name:
  english: pandurangastotram 2
  devanagari: पाण्डुरन्गस्तोत्रम् २
content:
  english: '|| 1|| sarvasvasya karotyapaharam tadapi vadanti janastamudaram | drashtum yanti ca varamvaram
    premna shlipyantyapi camudaram || 2|| shlishyantyenam sudridham yoshah svamisamakshamacintitadoshah
    | citramidam vigatershyaroshah sarve''pi bhavantyeva satoshah || 3|| yasya purah svajane''pyanukalam
    vivasha bhapanditamavalam | gayantyuccaih kritakaratalam nrityanti ca vihasanti batalam || 4|| yam
    drishtvaiva sakriskhalu deham sadhanatanayadayitam nijageham | smarati ma hridayam tyaktasneham vashinam
    manye tamasandeham || 5|| iti shriramanandanamayureshvarakritam pandurangastotram sampurnam | 1| ah
    te iti padacchedah |'
  devanagari: ॥ १॥ सर्वस्वस्य करोत्यपहारं तदपि वदन्ति जनास्तमुदारम् । द्रष्टुं यान्ति च वारंवारं प्रेम्णा
    श्लिप्यन्त्यपि चमुदारम् ॥ २॥ श्लिष्यन्त्येनं सुदृढं योषाः स्वामिसमक्षमचिन्तितदोषाः । चित्रमिदं विगतेर्ष्यारोषाः
    सर्वेऽपि भवन्त्येव सतोषाः ॥ ३॥ यस्य पुरः स्वजनेऽप्यनुकालं विवशा भापण्डितमावालं । गायन्त्युच्चैः कृतकरतालं
    नृत्यन्ति च विहसन्ति बतालम् ॥ ४॥ यं दृष्ट्वैव सकृस्खलु देहं सधनतनयदयितं निजगेहं । स्मरति म हृदयं त्यक्तस्नेहं
    वशिनं मन्ये तमसन्देहम् ॥ ५॥ इति श्रीरामनन्दनमयूरेश्वरकृतं पाण्डुरङ्गस्तोत्रं सम्पूर्णम् । १। आः ते
    इति पदच्छेदः ।
