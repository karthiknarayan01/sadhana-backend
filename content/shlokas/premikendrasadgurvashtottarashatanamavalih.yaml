id: premikendrasadgurvashtottarashatanamavalih
category: stotram
name:
  english: premikendrasadgurvashtottarashatanamavalih
  devanagari: प्रेमिकेन्द्रसद्गुर्वष्टोत्तरशतनामावलिः
content:
  english: krishnadasahshriharih jaya shriradhekrishna | atha shripremikendrasadgurvashtottarashatanamavalih
    | om shrigurave namah | om shridinabandhave namah | om dayavate namah | om pritivardhanaya namah |
    om ajnanajanatajnanapradatre namah | om jnanabhaskaraya namah | om vairagyamerushikharaya namah |
    om natajivasuposhakaya namah | om premabhaktirbharakrantaya namah | om bhaktibhavaprakashakaya namah
    | 10 om jagatpavanakarishrirekhancitapadambujaya namah | om sugulphaya namah | om carujanave namah
    | om ramyajanghaya namah | om sushaktimate namah | om katibaddhasvarnasutraya namah | om shubhravastradharaya
    namah | om shucaye namah | om avartanabhaye namah | om gambhiraya namah | 20 om trilekhalankritodaraya
    namah | om vishalavaksholiptashricandanamodasundaraya namah | om shuramyorasthalalambitulasikashthamalikaya
    namah | om yajnopavitasamrajatcaruvakshahsthalaya namah | om mahate namah | om hastishunthayatabhujaya
    namah | om karakomalapallavaya namah | om abhitimudrasamshobhihastapankajarancitaya namah | om shriramanamavilasanmudrikalankritangulaye
    namah | om arvatamanatulasijapamaladritangulaye namah | 30 om shrinamasutrasamsaktavamangushtasushikshakaya
    namah | om simhaskandaya namah | om kambukanthaya namah | om trikonacimbukaya namah | om shubhaya
    namah | om mukuraprabhakanthaya namah | om adharavidrumasamputaya namah | om vininditapayah phenadantapanktivirajitaya
    namah | om kotindukiranacchedirasahasa mahadyutaye namah | om carucampakanasaya namah | 40 om purnacandrashubhananaya
    namah | om karnantayatalavanyalocanabjayugaya namah | om prabhave namah | om amritastravidrikpataya
    namah | om natabhruvilasavate namah | om shrimallalatavilasatgopicandanapundravate namah | om sampashyannayananandisugandhasitakuntalaya
    namah | om premonmadamahanrittapavitrikritabhutalaya namah | om shrimadbhaktapurivasaya namah | om
    venatiravinodakrite namah | 50 om sarvashastrarthanipunaya namah | om gudhatattvasubodhakaya namah
    | om bhagavadpadabhaktimate namah | om shrimadbodhendrakarunapayodadhisukaustubhaya namah | om bhagavannamamahatmyapracarakaranotsukhaya
    namah | om namamahatmyanishnataya namah | om namamohitamanasaya namah | om namadatre namah | om namajivaya
    namah | om sadanamajapapriyaya namah | 60 om shabdabrahmaparabrahmavetre namah | om vedyaya namah
    | om narakritaye namah | om aparakarunasindhave namah | om nijashishyaganarcitaya namah | om satyapriyaya
    namah | om satyavadine namah | om satyasankalpavate namah | om vashine namah | om venkataramaryatanujaya
    namah | 70 om parvatibhagyavardhanaya namah | om nijabhaktamahambodhikutuhalasudhakaraya namah | om
    svabhaktagunavaktre namah | om madhuraya namah | om mridubhashanaya namah | om dhirashantaya namah
    | om adinatmane namah | om sadacaravibhushanaya namah | om premamritarasabdindave namah | om hathatpatitapavanaya
    namah | 80 om gitabhagavatagranthanishcitarthasubhashanaya namah | om svabhaktacittavasataye namah
    | om palitasheshavaishnavaya namah | om kotishashankadhikashitalaya namah | om shrikrishnapreminamne
    namah | om sadhyasadhanabodhakaya namah | om divyasurivarodgitakshetradarshanakamukaya namah | om
    pamdhari
  devanagari: कृष्णदासःश्रीहरिः जय श्रीराधेकृष्ण । अथ श्रीप्रेमिकेन्द्रसद्गुर्वष्टोत्तरशतनामावलिः । ॐ
    श्रीगुरवे नमः । ॐ श्रीदीनबन्धवे नमः । ॐ दयावते नमः । ॐ प्रीतिवर्धनाय नमः । ॐ अज्ञानजनताज्ञानप्रदात्रे
    नमः । ॐ ज्ञानभास्कराय नमः । ॐ वैराग्यमेरुशिखराय नमः । ॐ नतजीवसुपोषकाय नमः । ॐ प्रेमभक्तिर्भराक्रान्ताय
    नमः । ॐ भक्तिभावप्रकाशकाय नमः । १० ॐ जगत्पावनकारिश्रीरेखाञ्चितपदाम्बुजाय नमः । ॐ सुगुल्फाय नमः । ॐ
    चारुजानवे नमः । ॐ रम्यजङ्घाय नमः । ॐ सुशक्तिमते नमः । ॐ कटिबद्धस्वर्णसूत्राय नमः । ॐ शुभ्रवस्त्रधराय
    नमः । ॐ शुचये नमः । ॐ आवर्तनाभये नमः । ॐ गम्भीराय नमः । २० ॐ त्रिलेखालङ्कृतोदराय नमः । ॐ विशालवक्षोलिप्तश्रीचन्दनामोदसुन्दराय
    नमः । ॐ शुरम्योरस्थलालम्बितुलसीकाष्ठमालिकाय नमः । ॐ यज्ञोपवीतसंराजत्चारुवक्षःस्थलाय नमः । ॐ महते नमः
    । ॐ हस्तिशुण्ठायतभुजाय नमः । ॐ करकोमलपल्लवाय नमः । ॐ अभीतिमुद्रासंशोभिहस्तपङ्कजरञ्चिताय नमः । ॐ श्रीरामनामविलसन्मुद्रिकालङ्कृतङ्गुलये
    नमः । ॐ आर्वतमानतुलसीजपमालादृताङ्गुलये नमः । ३० ॐ श्रीनामसूत्रसंसक्तवामाङ्गुष्टसुशिक्षकाय नमः । ॐ
    सिंहस्कन्दाय नमः । ॐ कम्बुकण्ठाय नमः । ॐ त्रिकोणचिम्बुकाय नमः । ॐ शुभाय नमः । ॐ मुकुरप्रभकण्ठाय नमः
    । ॐ अधरविद्रुमसम्पुटाय नमः । ॐ विनिन्दितपयः फेनदन्तपङ्क्तिविराजिताय नमः । ॐ कोटीन्दुकिरणच्छेदिरसहास
    महाद्युतये नमः । ॐ चारुचम्पकनासाय नमः । ४० ॐ पूर्णचन्द्रशुभाननाय नमः । ॐ कर्णान्तायतलावण्यलोचनाब्जयुगाय
    नमः । ॐ प्रभवे नमः । ॐ अमृतस्त्राविदृक्पाताय नमः । ॐ नतभ्रूविलासवते नमः । ॐ श्रीमल्ललाटविलसत्गोपीचन्दनपुण्ड्रवते
    नमः । ॐ सम्पश्यन्नयनानन्दिसुगन्धासितकुन्तलाय नमः । ॐ प्रेमोन्मादमहानृत्तपवित्रीकृतभूतलाय नमः । ॐ श्रीमद्भक्तपुरीवासाय
    नमः । ॐ वेणातीरविनोदकृते नमः । ५० ॐ सर्वशास्त्रार्थनिपुणाय नमः । ॐ गूढतत्त्वसुबोधकाय नमः । ॐ भगवद्पादभक्तिमते
    नमः । ॐ श्रीमद्बोधेन्द्रकरुणापयोदधिसुकौस्तुभाय नमः । ॐ भगवन्नाममहात्म्यप्रचारकरणोत्सुखाय नमः । ॐ नाममाहात्म्यनिष्णाताय
    नमः । ॐ नाममोहितमानसाय नमः । ॐ नामदात्रे नमः । ॐ नामजीवाय नमः । ॐ सदानामजपप्रियाय नमः । ६० ॐ शब्दब्रह्मपरब्रह्मवेत्रे
    नमः । ॐ वेद्याय नमः । ॐ नराकृतये नमः । ॐ अपारकरुणासिन्धवे नमः । ॐ निजशिष्यगणार्चिताय नमः । ॐ सत्यप्रियाय
    नमः । ॐ सत्यवादिने नमः । ॐ सत्यसङ्कल्पवते नमः । ॐ वशिने नमः । ॐ वेङ्कटरामार्यतनूजाय नमः । ७० ॐ पार्वतीभाग्यवर्धनाय
    नमः । ॐ निजभक्तमहाम्बोधिकुतूहलसुधाकराय नमः । ॐ स्वभक्तगुणवक्त्रे नमः । ॐ मधुराय नमः । ॐ मृदुभाषणाय
    नमः । ॐ धीरशान्ताय नमः । ॐ अदीनात्मने नमः । ॐ सदाचारविभूषणाय नमः । ॐ प्रेमामृतरसाब्दीन्दवे नमः । ॐ
    हठात्पतितपावनाय नमः । ८० ॐ गीताभागवतग्रन्थनिश्चितार्थसुभाषणाय नमः । ॐ स्वभक्तचित्तवसतये नमः । ॐ पालिताशेषवैष्णवाय
    नमः । ॐ कोटिशशङ्काधिकशीतलाय नमः । ॐ श्रीकृष्णप्रेमीनाम्ने नमः । ॐ साध्यसाधनबोधकाय नमः । ॐ दिव्यसूरिवरोद्गीतक्षेत्रदर्शनकामुकाय
    नमः । ॐ पंढरी
