id: navadurgastotram-2
category: stotram
name:
  english: navadurgastotram 2
  devanagari: नवदुर्गास्तोत्रम् २
content:
  english: varade namo'stu || 4|| shrinilakanthasya hritardhakaya padme sahasre dhritapadmapada | yogindravaryairvihitapranama
    shailatmaja vindhyanivasini sa || 5|| purnenduvaktra sharadindushubhra bhogendrahara navadvibhujadhya
    | simhadhirudha suvishalanetra sa shailaputri bhavatu prasanna || 6|| ya shat saroje ca kritadhivasa
    taram japanti pranavam pramodat | sardhatrivritya ca samullasanti sa vedamata bhavatu prasanna ||
    7|| ya candrabhala kamalasane sve vinyasya padau dhritakonahasta | kukshau dadhana ca sushubhravina
    sa sharada no varada sadastu || 8|| kumaramata dviradananarcita shabdatmika gadyapadairudirita | udgithabija
    pranavasvarupini sa padmahasta bhavatu prasanna || 9||
  devanagari: वरदे नमोऽस्तु ॥ ४॥ श्रीनीलकण्ठस्य हृतार्धकाया पद्मे सहस्रे धृतपद्मपादा । योगीन्द्रवर्यैर्विहितप्रणामा
    शैलात्मजा विन्ध्यनिवासिनी सा ॥ ५॥ पूर्णेन्दुवक्त्रा शरदिन्दुशुभ्रा भोगेन्द्रहारा नवद्विभुजाढ्या ।
    सिंहाधिरूढा सुविशालनेत्रा सा शैलपुत्री भवतु प्रसन्ना ॥ ६॥ या षट् सरोजे च कृताधिवासा तारं जपन्ती प्रणवं
    प्रमोदात् । सार्धत्रिवृत्या च समुल्लसन्ती सा वेदमाता भवतु प्रसन्ना ॥ ७॥ या चन्द्रभाला कमलासने स्वे
    विन्यस्य पादौ धृतकोणहस्ता । कुक्षौ दधाना च सुशुभ्रवीणा सा शारदा नो वरदा सदास्तु ॥ ८॥ कुमारमाता द्विरदाननार्चिता
    शब्दात्मिका गद्यपदैरुदीरिता । उद्गीथबीजा प्रणवस्वरूपिणी सा पद्महस्ता भवतु प्रसन्ना ॥ ९॥
