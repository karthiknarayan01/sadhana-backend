id: vighnesvara-ashtottara-sata-nama-stotram
category: stotram
name:
  english: Vighnesvara Ashtottara Sata Nama Stotram
  devanagari: विघ्नेश्वराष्टोत्तरशतनामस्तोत्रम्
content:
  english: vighneshvarashtottarashatanamastotram bhavishyottarapuranam 1953 vighneshvarashtottarashatanamastotram
    bhavishyottarapuranam 1953 shrivighneshvarashtottarashatanamastotram vinayako vighnarajo ganeshvarah|
    skandagrajo'vyayah puto daksho'dhyaksho dvijapriyah|| agnigarbhacchidindrishriprado vaniprado'vyayah|
    sarvasiddhipradashsharvatanayashsharvaripriyah||2 sarvatmakassrishtikarta devo'nekarcitashshivah shaddho
    buddhipriyashshanto brahmacari gajananah||3 dvaimatreyo munistutyo bhakttivighnavinashanah| ekadantashcaturbahushcarashshkttisamyutah||4
    lambodarashshurpakarno harirbrahmaviduttamah| kalo grahapatih kami somasuryagnilocanah|| pashankushadharashcando
    gunatito niranjanah| akasmashassvayamsiddhassiddharcitapadambujah|| bijapuraphalasrakto varadashshashvatah
    kriti| dvijapriyo vitabhavo gadi cakrikshucapadhrit| shrido'ja utpalakarashshripatih stutiharshitah|
    kuladrimotta jatilah kalikalmashanashanah| candracudamanih kantah papahari samahitah| ashritashrikarassaumyo
    bhakttavanchitadayakah shantah kaivalyasukhadassaccidanandavigrahah| shantah dayayuto danto brahmadveshavivarjitah|
    jnani dayayuto danto vibudheshvarah| ramarcito vidhirnagarajayajnopavitavan|| svulakanthah svayam
    karta samaghopapriyah parah| sthulatundo'pravirciro vargashassiddhidayakah|| durvabildapriyo'nyakttamurtiradbhutamurtiman|
    shelendratanulotsankakhalenotsukhamanasah|| svalacanvasudhasarajitamanmathavigrahah| shvamastajagadagharo
    mayi sushakavahanah|| hrishtastushtah prasannatma sarvasiddhipradayakah| ashtottarashatenaivam namnam
    vighneshvaram vibhum|| tushtava shankarah putram tripuram hantumudyatah| yah pujayedanenaiva bhaktya
    siddhivinayakam|| durvadaḻairbilvapatraih pushpairva candanakshataih| sarvankamanavapnoti sarvavighnaih
    pramucyate|| iti shribhavishyottarapurane ||vighneshvarashtottarashatanamastotram sampurnam||
  devanagari: विघ्नेश्वराष्टोत्तरशतनामस्तोत्रम् भविष्योत्तरपुराणम् १९५३ विघ्नेश्वराष्टोत्तरशतनामस्तोत्रम्
    भविष्योत्तरपुराणम् १९५३ श्रीविघ्नेश्वराष्टोत्तरशतनामस्तोत्रम् विनायको विघ्नराजो गणेश्वरः। स्कन्दाग्रजोऽव्ययः
    पूतो दक्षोऽध्यक्षो द्विजप्रियः॥ अग्निगर्भच्छिदिन्द्रिश्रीप्रदो वाणीप्रदोऽव्ययः। सर्वसिद्धिप्रदश्शर्वतनयश्शर्वरीप्रियः॥२
    सर्वात्मकस्सृष्टिकर्ता देवोऽनेकार्चितश्शिवः शद्धो बुद्धिप्रियश्शान्तो ब्रह्मचारी गजाननः॥३ द्वैमात्रेयो
    मुनिस्तुत्यो भक्त्तिविघ्नविनाशनः। एकदन्तश्चतुर्बाहुश्चरश्श्क्त्तिसंयुतः॥४ लम्बोदरश्शूर्पकर्णो हरिर्ब्रह्मविदुत्तमः।
    कालो ग्रहपतिः कामी सोमसूर्याग्निलोचनः॥ पाशाङ्कुशधरश्चण्डो गुणातीतो निरञ्जनः। अकस्मषस्स्वयंसिद्धस्सिद्धार्चितपदाम्बुजः॥
    बीजपूरफलास्रक्तो वरदश्शाश्वतः कृती। द्विजप्रियो वीतभवो गदी चक्रीक्षुचापधृत्। श्रीदोऽज उत्पलकरश्श्रीपतिः
    स्तुतिहर्षितः। कुलाद्रिमोत्ता जटिलः कलिकल्मषनाशनः। चन्द्रचूडामणिः कान्तः पापहारी समाहितः। आश्रितश्रीकरस्सौम्यो
    भक्त्तवाञ्छितदायकः शान्तः कैवल्यसुखदस्सच्चिदानन्दविग्रहः। शान्तः दयायुतो दान्तो ब्रह्मद्वेषविवर्जितः।
    ज्ञानी दयायुतो दान्तो विबुधेश्वरः। रमार्चितो विधिर्नागराजयज्ञोपवीतवान्॥ स्वूलकण्ठः स्वयं कर्ता सामघोपप्रियः
    परः। स्थूलतुण्डोऽप्रवीर्चीरो वार्गाशस्सिद्धिदायकः॥ दूर्वाबिल्दप्रियोऽञ्यक्त्तमूर्तिरद्भुतमूर्तिमान्।
    शेलेन्द्रतनुलोत्सङ्कखलेनोत्सुखमानसः॥ स्वलाचण्वसुधासारजितमन्मथविग्रहः। श्वमस्तजगदाघारो मायी सूषकवाहनः॥
    हृष्टस्तुष्टः प्रसन्नात्मा सर्वसिद्धिप्रदायकः। अष्टोत्तरशतेनैवं नाम्नां विघ्नेश्वरं विभुम्॥ तुष्टाव
    शङ्करः पुत्रं त्रिपुरं हन्तुमुद्यतः। यः पूजयेदनेनैव भक्त्या सिद्धिविनायकम्॥ दूर्वादळैर्बिल्वपत्रैः
    पुष्पैर्वा चन्दनाक्षतैः। सर्वान्कामानवाप्नोति सर्वविघ्नैः प्रमुच्यते॥ इति श्रीभविष्योत्तरपुराणे ॥विघ्नेश्वराष्टोत्तरशतनामस्तोत्रं
    सम्पूर्णम्॥
