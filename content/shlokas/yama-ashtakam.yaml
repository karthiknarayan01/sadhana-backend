id: yama-ashtakam
category: stotram
name:
  english: Yama Ashtakam
content:
  english: savitryuvaca | tapasa dharmamaradhya pushkare bhaskarah pura | dharmam suryahsutam prapa dharmarajam
    namamyaham || || samata sarvabhuteshu yasya sarvasya sakshinah | ato yannama shamanamiti tam pranamamyaham
    || || yenantashca krito vishve sarvesham jivinam param | kamanurupam kalena tam kritantam namamyaham
    || || bibharti dandam dandaya papinam shuddhihetave | namami tam dandadharam yah shasta sarvajivinam
    || || vishvam ca kalayatyeva yah sarveshu ca santatam | ativa durnivaryam ca tam kalam pranamamyaham
    || || tapasvi brahmanishtho yah samyami sanjitendriyah | jivanam karmaphaladastam yamam pranamamyaham
    || || svatmaramashca sarvajno mitram punyakritam bhavet | papinam kleshado yastam punyamitram namamyaham
    || || yajjanma brahmanom'shena jvalantam brahmatejasa | yo dhyayati param brahma tamisham pranamamyaham
    || || ityuktva sa ca savitri prananama yamam mune | yamastam shaktibhajanam karmapakamuvaca ha ||
    || idam yamashtakam nityam pratarutthaya yah pathet | yamattasya bhayam nasti sarvapapatpramucyate
    || || mahapapi yadi pathennityam bhaktisamanvitah | yamah karoti samshuddham kayavyuhena nishcitam
    || || iti shrimaddevibhagavate mahapurane navamaskandhe ekatrimsho'dhyayah |
  devanagari: सावित्र्युवाच । तपसा धर्ममाराध्य पुष्करे भास्करः पुरा । धर्मं सूर्यःसुतं प्राप धर्मराजं
    नमाम्यहम् ॥ ॥ समता सर्वभूतेषु यस्य सर्वस्य साक्षिणः । अतो यन्नाम शमनमिति तं प्रणमाम्यहम् ॥ ॥ येनान्तश्च
    कृतो विश्वे सर्वेषां जीविनां परम् । कामानुरूपं कालेन तं कृतान्तं नमाम्यहम् ॥ ॥ बिभर्ति दण्डं दण्डाय
    पापिनां शुद्धिहेतवे । नमामि तं दण्डधरं यः शास्ता सर्वजीविनाम् ॥ ॥ विश्वं च कलयत्येव यः सर्वेषु च सन्ततम्
    । अतीव दुर्निवार्यं च तं कालं प्रणमाम्यहम् ॥ ॥ तपस्वी ब्रह्मनिष्ठो यः संयमी सञ्जितेन्द्रियः । जीवानां
    कर्मफलदस्तं यमं प्रणमाम्यहम् ॥ ॥ स्वात्मारामश्च सर्वज्ञो मित्रं पुण्यकृतां भवेत् । पापिनां क्लेशदो
    यस्तं पुण्यमित्रं नमाम्यहम् ॥ ॥ यज्जन्म ब्रह्मणोंऽशेन ज्वलन्तं ब्रह्मतेजसा । यो ध्यायति परं ब्रह्म
    तमीशं प्रणमाम्यहम् ॥ ॥ इत्युक्त्वा सा च सावित्री प्रणनाम यमं मुने । यमस्तां शक्तिभजनं कर्मपाकमुवाच
    ह ॥ ॥ इदं यमष्टकं नित्यं प्रातरुत्थाय यः पठेत् । यमात्तस्य भयं नास्ति सर्वपापात्प्रमुच्यते ॥ ॥ महापापी
    यदि पठेन्नित्यं भक्तिसमन्वितः । यमः करोति संशुद्धं कायव्यूहेन निश्चितम् ॥ ॥ इति श्रीमद्देवीभागवते
    महापुराणे नवमस्कन्धे एकत्रिंशोऽध्यायः ।
