id: rishidadhiciproktamshivakavacam
category: kavacha
name:
  english: rishidadhiciproktamshivakavacam
  devanagari: ऋषिदधीचिप्रोक्तंशिवकवचम्
content:
  english: radho mamavyaduragendra bhushah | digantaraleshu samastanathah payadvrishidhishvaraketulakshyah
    || 154|| nadishu mam rakshatu vishvanathah kupeshu mam rakshatu vishvamurtih | payatsamudreshu jaladhirajah
    saritsamudradividhanadakshah || 155|| vapishu payadatibahyavarti davanalatpatu darishaharah | garteshu
    payatsuragarvahari vriksheshu payadvrishabhadhvajomam || 156|| payadgajebhyo gajadarpahari payadahibhyo'pi
    hi virabhadrah | payatsamebhyo vishasarpahari payattrimurtivishavrishcikebhyah || 157|| bhutadhipah
    patu virodhibhiteh rakshah pishacidibhayatkapali | mrityunjayo rakshatu mrityubhiteh kalagnirudro'vatu
    kalabhiteh || 158|| papariravyadbahupatakebhyah payadgrahebhyah kamalasanarcyah | shri vishnunetrarcita
    padapadmah patu prabhateshvakhileshu shambhuh || 159|| madhyandineshveva mrido'nisham mam sayahnakale'pyamaradhinathah
    | maheshvaro rakshatu madhyaratre payadushasyandhakanashahetuh || 160|| sarsheshukaleshvapi patu shambhu
  devanagari: रधो ममाव्यादुरगेन्द्र भूषः । दिगन्तरालेषु समस्तनाथः पायाद्वृषीधीश्वरकेतुलक्ष्यः ॥ १५४॥ नदीषु
    मां रक्षतु विश्वनाथः कूपेषु मां रक्षतु विश्वमूर्तिः । पायात्समुद्रेषु जलाधिराजः सरित्समुद्रादिविधानदक्षः
    ॥ १५५॥ वापीषु पायादतिबाह्यवर्ती दवानलात्पातु दरीशहारः । गर्तेषु पायात्सुरगर्वहारी वृक्षेषु पायाद्वृषभध्वजोमाम्
    ॥ १५६॥ पायाद्गजेभ्यो गजदर्पहारी पायादहिभ्योऽपि हि वीरभद्रः । पायात्समेभ्यो विषसर्पहारी पायात्त्रिमूर्तिविषवृश्चिकेभ्यः
    ॥ १५७॥ भूताधिपः पातु विरोधिभीतेः रक्षः पिशाचिदिभयात्कपाली । मृत्युञ्जयो रक्षतु मृत्युभीतेः कालाग्निरुद्रोऽवतु
    कालभीतेः ॥ १५८॥ पापारिरव्याद्बहुपातकेभ्यः पायाद्ग्रहेभ्यः कमलासनार्च्यः । श्री विष्णुनेत्रार्चित पादपद्मः
    पातु प्रभातेष्वखिलेषु शम्भुः ॥ १५९॥ मध्यन्दिनेष्वेव मृडोऽनिशं मां सायाह्नकालेऽप्यमराधिनाथः । महेश्वरो
    रक्षतु मध्यरात्रे पायादुषस्यान्धकनाशहेतुः ॥ १६०॥ सर्षेषुकालेष्वपि पातु शम्भु
