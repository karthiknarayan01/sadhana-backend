id: sri-lalitha-hrudayam
category: stotram
name:
  english: Sri Lalitha Hrudayam
content:
  english: athashrilalitahridayastotram || shrilalitambikayai namah | devyuvaca | devadeva mahadeva saccidanandavigraha
    | sundaryahridayam stotram param kautuhalam vibho || || ishvarauvaca | sadhu sadhutvaya prajne lokanugrahakarakam
    | rahasyamapivakshyami savadhanamanahsha || shrividyam jagatam dhatrim sarggasthitilayeshvarim | namamilalitam
    nityam bhaktanamishtadayinim || || bindutrikonasamyuktam vasukonasamanvitam | dashakonadvayopetam
    caturddasha samanvitam || || dalashtakesaropetam dalashodashakanvitam | vrittatrayayanvitambhumisadanatrayabhushitam
    || || namami lalitacakram bhaktanamishtadayakam | amritambhonidhintatra ratnadvipam namamyaham ||
    || nanavrikshamahodyanam vandeham kalpavatikam | santanavatikamvande haricandanavatikam || || mandaravatikam
    parijatavatim muda bhaje | namamitava deveshi kadambavanavatikam || || pushyaragamaharatnaprakaram
    pranamamyaham | padmaragadimanibhihprakaram sarvada bhaje || || gomedaratnaprakaram vajraprakaramashraye
    | vaiduryaratnaprakarampranamami kuleshvari || || indranilakhyaratnanam prakaram pranamamyaham | muktaphalamaharatnaprakarampranamamyaham
    || || maratakhyamaharatnaprakaraya namonamah | vidrumakhyamaharatnaprakarampranamamyaham || || manikyamandapam
    ratnasahasrastambhamandapam | lalite tavadeveshi bhajamyamritavapikam || || anandavapikam vandevimarshavapikam
    bhaje | bhajebalatapolgaram candrikogarikam bhaje || ringaraparikham mahapatmatavim bhaje | cintamanimaharatnagriharajam
    namamyaham || || purvannayamayam purvvadvaram devi namamyaham | dakshinannayarupantedakshinadvaramashraye
    || || namami pashcimadvaram pashcimamnaya rupakam | vandehamuttaradvaramuttaramnayarupakam || || urddhvamnayamayam
    vande hyurddhadvaram kuleshvari | lalitetava deveshi mahasimhasanam bhaje || || brahmatmakam mancapadamekam
    tava namamyaham | ekamvishnumayam mancapadamanyam namamyaham || || ekam rudramayam mancapadamanyam
    namamyaham | mancapadammamamyekam tava devishvaratmakam || || mancaikaphalakam vande sadashivamayam
    shubham | namamitehamsatulatalpakam parameshvari || namamite hamsatulamahopadhanamuttamam | kaustubhastaranamvande
    tava nityam kuleshvari || || mahavitanikam vande mahayavinikam bhaje | evam pujagriham dhyatva shricakre
    shrishivam bhaje || || svadakshine sthapayami bhage pushpakshatadikan | amitamstemahadevi dipan sandarshayamyaham
    || || mulena tripuracakram tava sampujyayamyaham | tribhihkhandaistavakhyataih pujayami maheshvari
    || vayvagni jalasamyuktam pranayamairaham shivai | shoshanandahanam caiva karomi plavanam tatha ||
    || trivaram mulamantrena pranayamam karomyaham | pashandakarinobhuta bhumauye cantarikshake || ||
    karomyanena mantrena talatrayamaham shive | narayano'hambrahmaham bhairavo'ham shivosmyaham || ||
    devoham paramanando'smyaham tripurasundari | dhyatvavai vajrakavacam nyasam tava karomyaham || ||
    kumaribijasamyuktam mahatripurasundari | mamraksharaksheti hridi karomyajnalimishvari || mahadevyasanayeti
    prakaromyasanam shive | cakrasanannamasyami sarvamantrasanam shive || || saddhyasiddhasanam mantrairebhiryuktam
    maheshvari | karomyasmincakramantrairdevatasanamuttamam || || karomyatha shadangakhyam matrikam ca
    kalam nyase | shrikantankeshavam caiva prapancam yogamatrikam || || tattvanyasam tatah kurvve catushpitam
    yathacare | laghushodhantatah kurvve shaktinyasam mahottamam || || pitanyasam tatah kurve devatavahanam
    priye | kunkumanyasakancaiva cakranyasamathacare || || cakranyasam tatah kurvve nyasam kamakaladvayam
    | shodasharnnamahamantrairanganyasankaromyaham || || mahashodham tatah kurvve shambhavam ca mahapriye
    | tatomulamprajaptvatha padukanca tatah param || || gurave samyagarcyatha devatam hridisambhaje |
    karomimandalam vrittam caturashram shivapriye || || pushpairabhyarccyasadharam shankham sampujayamaham
    | arccayamishadangena jalamapurayamyaham || || dadami cadimam bindum kurve mulabhimantritam | tajjalenajaganmatastrikonam
    vrittasamyutam || || shalkonam caturashranca mandalam pranamamyaham | vidyayapujayamiha trikhandena
    tu pujanam || || bijenavrittashalkonam pujayami tavapriye | tasmindevikalatmanam manimandalamashraye
    || || dhumrarccisham namasyami ushmam ca jvalanim tatha | jvalininca namasyami vandeham vispulinginim
    || || sushriyam ca surupancakampilam pranamamyaham | naumihavyavaham nityam bhaje kavyavaham kalam
    || || suryagnimandalam tatra sakaladvadashatmakam | arghyapadyamahantatra tapinim tapinim bhaje ||
    || dhumram maricim vandeham jvalinim maruham bhaje | sushumnambhogadam vande bhaje vishvam ca bodhinim
    || || dharinim ca kshamam vande sauriretah kalabhaje | ashrayemanmalam candram talkalashodashatmakam
    || || amritam manadam vande pusham tushtim bhajamyaham | pushtimbhaje mahadevi bhaje'ham ca ratim
    dhritim || || rashanim candrikam vande kantim jotsana shriyam bhaje | neaumipritincagatadancapurnnimamamritambhaje
    || || trikonalekhanam kurvve akaradisurekhakam | halakshavarnnasamyuktamspitam tam hamsabhaskaram
    || || vakkamashakti samyuktam hamsamaradhayamyaham | vrittadbahihshadashrasyalekhanam prakaromyaham
    || || puratognyadishalkhaonam kakhagenarccayamyaham | shrividyayasaptavaram karomyatrabhi mantritam
    || || samarppayami deveshi tasmat gandhakshatadikam | dhyayamipujadravyeshu tat sarvam vidyayayutam
    || || caturnnavatisanmantran sprishtva tat prajapamyaham | vahnerddashakalahsuryakaladvadashakam bhaje
    || || ashraye shodashakalastatra candramasastada | srishtimvriddhim smritim vande medham kantim tathaiva
    ca || || lakshmim dyuthim sthitam vande sthitim siddhim bhajamyaham | etabrahmakalavande jarantham
    palinim bhaje || || shantim namamishvarim ca ratim vande ca karikam | varadamhladinim vande pritim
    dirgham bhajabhamyaham || || eta vishnuakalavande tikshanam raudrim bhayam bhaje | nidrantandrim kshudham
    vande namami krodhinim kriyam || || ulkarim mrityurupam ca eta rudrakala bhaje | nilampitam bhaje
    shvetam vandehamarunam kalam || || anantakhyam kalanceti ishvarasya kalabhaje | nivrittincapratishthancavidyamshantim
    bhajamyaham || || rodhikam dipikam vande recikam mocikam bhaje | paramsukshamritam suksham pranami
    kuleshvari || jnanakhyancanamasyami naumijnanamritam kalam | apyayinimvyapinim ca modinim pranamamyaham
    || || kalah sadashivasyaitah shodasha pranamamyaham | vishnuyoninnamasyami mulavidyam namamyaham ||
    || traiyambakam namasyami tadvishnum pranamamyaham | vishnuyonimnamasyami mulavidyam namamyaham ||
    || amritam mantritam vande caturnnavatibhistatha | akhandaikarasanandakareparasudhatmani || || svacchandaspapuranam
    mantram nidhehi kularupini | akulasthamritakaresiddhijnanakarepare || || amritam nidhehyasmin vastuniklinnarupini
    | tadrupanekarasyatvankritvahyetatsvarupini || || bhutva paramritakaramayi cit spuranam kuru | ebhirmmanuttamairvandemantritam
    paramamritam || || jotimmayamidam vande paramarghyanca sundari | tadvindubhirmeshirasi gurum santarppayamyaham
    || || brahmasmin tadvindum kundalinyam juhomyaham | hriccakrastam mahadevimmahatripurasundarim ||
    || nirastamohatimiram sakshat samvitsvarupinim | nasaputatparakalamathanirggamayamyaham || || namamiyonimaddhyastham
    trikhandakusumamnjalim | jaganmatarmahadeviyantretvam sthapayamyaham || || sudhacaitanyamurttim te
    kalpayamimanum tava | anenadevimantrayantretvam sthapayamyaham || || mahapadmavanantasthe karananantavigrahe
    | sarvabhutahitematarehyapi parameshvari || || deveshi bhaktasulabhe sarvabharanabhushite | yavatvampujayamihatavattvam
    susthirabhava || || anena mantrayugmena tvamatravahayamyaham | kalpayaminamah padamarghyam te kalpayamyaham
    || || gandhatailabhyanjanancamajjashalapravesham | kalpayaminamastasmai manipithopraveshanam || ||
    divyasnaniyamishani grihanodvarttanam shubhe | grihanoshnadakasnanankalpayamyabhishecanam || || hemakumbhayutaih
    snigddhaih kalpayamyabhishecanam | kalpayaminamastubhyam dheautena parimarjjanam || || balabhanu pratikasham
    dukulam paridhanakam | arunenadukulenottariyam kalpayamyaham || || praveshanam kalpayami sarvangani
    vilepanam | namastekalpayamyatra manipithopaveshanam || || ashtagandhaih kalpayami tavalekhanamambike
    | kalagarumahadhupankalpayami namashshive || || mallikamalatijati campakadi manoramaih | arccitankusumairmmalam
    kalpayami namashshive || || praveshanam kalpayami namo bhushanamandape | upaveshyamratnapithe tatrate
    kalpayamyaham || || navamanikyamakutam tatrate kalpayamyaham | sharaccandranibhamyuktam taccandrashakalam
    tava || || tata simantasinduram kasturitilakam tava | kalajnanankalpayami paliyugalamuttamam || ||
    manikundalayugmanca nasabharanamishvari | tatankayugalandevi lalite dharayamyaham || || athadyam bhushanam
    kanthe mahacintakamuttamam | padakante kalpayami mahapadakamuttamam || || muktavalim kalpayami caikavali
    samanvitam | channavirancakeyurayugalanam catushtayam || || valayavalimalanim cormikavalimishvari
    | kancidamakatisutramsaubhagyabharanam ca te || || tripure padakatakam kalpaye ratnanupuram | padanguliyakantubhyam
    pashamekam karetava || || anye karenkusham devi pundrekshudhanusham tava | aparepushpabananca shrimanmanikyapaduke
    || || tadavarana deveshi mahamancadirohanam | kameshvarankaparyankamupaveshanamuttamam || || sudhaya
    purnnacashakam tatastat panamuttamam | karppuravitikantubhyam kalpayami namah shive || || anandollasavilasaddhamsam
    te kalpayamyaham | mangalaratrikamvande chatram te kalpayamyaham || || camaram yugalam devidarppanam
    kalpayamyaham | talavrintankalpayamigandhapushpakshatairapi || || dhupam dipashcanaivedyam kalpayami
    shivapriye | athahambaindave cakre sarvanandamayatmake || || ratnasimhasane ramye samasinam shivapriyam
    | udyadbhanusahasrabhanjapapushpasamaprabham || || navaratnaprabhayuktamakutena virajitam | candrarekhasamopetankasturitilakankitam
    || || kamakodandasaundaryanirjjitabhrulatayutam | anjanancitanetrantupadmapatranibheshanam || || manikundalasamyukta
    karnnadvayavirajitam | tambulapuritamukhimsusmitasyavirajitam || || adyabhushanasamyuktam hemacintakasamyutam
    | padakenasamopetam mahapadakasamyutam || || muktaphalasamopetamekavalisamanvitam | kausubhangadasamyuktacaturbahusamanvitam
    || || ashtagandhasamopetam shricandanavirajitam | hemakumbhopamaprakhyastanadvandavirajitam || ||
    raktavastraparidhanam raktakancukasamyutam | sukshmaromavaliyuktatanumaddhyavirajitam || || muktamanikyakhacita
    kanciyutanitambanim | sadashivanakasthabrihanmahajaghanamandalam || || kadalistambhasamrajadurudvayavirajitam
    | kapalikantisankashajanghayugalashobhitam || || grudhagulphadveyopetam raktapadasamanvitam | brahmavishnumaheshadikiritasphurjjitanghrikam
    || || kantya virajitapadam bhaktatrana parayanam | ikshukarmukapushpeshupashankushadharamshubham ||
    || samvitsvarupinim vande dhyayami parameshvarim | pradarshayamyathashivedashamudrah phalapradah ||
    || tvam tarppayami tripure tridhana parvvati | agnaumaheshadigbhage nairritryam marute tatha || ||
    indrashavaruni bhage shadanganyarccaye kramat | adyankameshvarim vande namami bhagamalinim || || nityaklinnam
    namasyami bherundam pranamamyaham | vahnivasannamasyami mahavidyeshvarim bhaje || || shivadutim namasyami
    tvaritam kula sundarim | nityannilapatakanca vijayam sarvamangalam || || jvalamalanca citranca mahanityam
    ca samstuve | prakashanandanathakhyamparashaktinamamyaham || || shukladevim namasyami pranamami kuleshvarim
    | parashivanandanathakhyamparashakti namamyaham || || kauleshvaranandanatham naumi kameshvarim sada
    | bhoganandannamasyami siddhaughanca varanane || || klinnanandam namasyami samayanandamevaca | sahajanandanathancapranamami
    muhurmuhu || || manavaugham namasyami gagananandagapyaham | vishvanandannamasyami vimalanandamevaca
    || || madananandanathanca bhuvananandarupinim | lilanandannamasyami svatmanandam maheshvari || ||
    pranamamipriyanandam sarvakamaphalapradam | parameshtigurumvande paramangurumashraye || || shrigurum
    pranamasyami murddhni brahmabileshvarim | shrimadanandanathakhyashriguropadukam tatha || || atha prathamike
    devi caturashre kuleshvari | animamlakhimam vande mahimam pranamamyaham || || ishitvasiddhim kalaye
    vashitvam pranamamyaham | prakamyasiddhimbhuktinca icchapraprtimaham bhaje || || sarvakamapradam sarvakamasiddhimaham
    bhaje | maddhyamecaturashreham brahmim maheshvarim bhaje || || kaumarim vaishnavim vande varahim pranamamyaham
    | mahendrimapicamundammahalakshmimaham bhaje || || tritiye caturashre tu sarvasankshobhinim bhaje
    | sarvavidrapinimmudram sarvakarshinikam bhaje || || mudram vashankarim vande sarvonmadinikam bhaje
    | bhajemahankusham mudram khecarim pranamamyaham || || bijamudram yonimudram bhaje sarvatrikhandinim
    | trailokyamohanancakram namami lalite tava || || namami yoginim tatra prakhatakhyamabhishtadam |
    sudharnnavasanamvande tatra te parameshvari || || cakreshvari maham vande tripuram pranamamyaham |
    sarvasankshobhinimmudram tatoham kalaye shive || || athaham shodashadale kamakarshinikam bhaje | buddhyakarshinikam
    vande'hankarakarshinim bhaje || || shabdakarshinikam vande sparshakarshinikam bhaje | rupakarshinikamvande
    rasakarshinikam bhaje || || gandhakarshinikam vande cittakarshinikam bhaje | dhairyakarshinikamvande
    smrityakarshinikam bhaje || || namakarshinikam vande bijakarshinikam bhaje | atmakarshinikamvande
    amritakarshinikam bhaje || || sharirakarshinikam vande nityam shriparameshvari | sarvashapurakamvande
    kalpayeham taveshvari || || guptakhyam yoginim vande mataram guptapujyatam | potambujasanantatra namami
    lalite tava || || tripureshim namasyami bhajamishtartthasiddhidam | sarvavidravinimudrantatraham te
    vicantaye || || sive tavashtapatrehamanangakusumam bhaje | anangamekhalamvande anangamadanam bhaje
    || || namoham pranasyami anangamadanaturam | anangarekhankalaye bhajenangam ca veginim || || anangakushavande'hamanangamalinim
    bhaje | tatrahampranasyami devya asanamuttamam || || namami jagatishanim tatra tripurasundarim | sarvakarshinikammudram
    tatraha kalpayamite || || bhuvanashraye tava shive sarvasankshobhinim bhaje | sarvavidravinimvande
    sarvakarshinikam bhaje || || sarvahladinim vande sarvasammohinim bhaje | sakalastambhinim vande kalaye
    sarvajrimbhinim || || vashankarim namasyami sarvarajninikam bhaje | sakalonmadinim vande bhaje sarvarthasadhake
    || || sampattipurikam vande sarvamantramayim bhaje | bhajamyevatatashshaktim sarvadvandvakshyankarim
    || || tatraham kalaye cakram sarvasaubhagyadayakam | namamijagatam dhatrim sampradayakhyayoginim ||
    || namami parameshanim mahatripuravasinim | kalayehantava shive mudram sarvashankarim || || bahirddashare
    te devi sarvasiddhipradam bhaje | sarvasampatpradam vande sarvapriyankarim bhaje || || namamyaham
    tato devim sarvamangalakarinim | sarvakamapradamvande sarvaduhkhavimocinim || || sarvamrityuprashamanim
    sarvavighnanivarinim | sarvangasundarimvande sarvasaubhagyadayinim || || sarvartthasadhakam cakram
    tatraham ne vicintaye | tatrahante namasyami kulottirnakhya yoginim || || sarvamantrasanam vande tripurashriyamashraye
    | kalayamitato mudram sarvonmadana karinim || || antarddashare te devi sarvajnam pranamamyaham | sarvashaktinnamasyami
    sarvaishvaryapradam bhaje || || sarvajnanamayim vande sarvavyadhivinashinim | sarvadharasvarupancasarvapapaharambhaje
    || || sarvanandamayim vande sarvarakshasvarupinim | pranamamimahadevim sarvepsita phalapradam || ||
    sarvarakshakaram cakram sundarim kalaye sada | nigarbhayonimvande tatraham pranamamyaham || || saddhyasiddhasanam
    vande bhaje tripuramalinim | kalayamitato devim mudram sarvamahankusham || || ashtare vashinim vande
    maha kameshvarim bhaje | modinimvimalamvande arunajayinim bhaje || || sarveshvarim namasyami kaulinim
    pranamamyaham | sarvarogaharancakram tatraham kalaye sada || || namami tripura siddhim bhaje mudram
    ca khecarim | mahatrikonavatbahucaturashre kuleshvari || || namami jrimbhanabanam sarvasammohinim
    bhaje | pashancapam bhaje nityam bhaje stambhanamankusham || || trikoneham jagaddhatrim mahakameshvarim
    bhaje | mahavajreshvarimvande mahashribhagamalinim || || mahashrisundarim vande sarvakamaphalapradam
    | sarvasiddhipradancakram tavadevi namamyaham || || namamyatirahasyakhyam yoginim tavakamadam | tripurambannamasyami
    bijamudramahambhaje || || mulamantrena lalite talbindau pujayamyaham | sarvanandamayancakram tavadevi
    bhajamyaham || || param pararahasyakhyam yoginim tatrakamadam | mahacakreshvarimvande yonimudramaham
    bhaje || || dhupadipadikam sarvamarppitam kalpayamyaham | tvalpritayemahamudram darshayami tatashshive
    || || shalyannam madhusamyuktam payasapupa samyuktam | ghritasupasamayuktandadhikshirasamanvitam ||
    || sarvabhakshyasamayuktam bahushakasamanvitam | nikshipyakancane patre naivedyam kalpayami te ||
    || sankalpabinduna cakram kucau bindudvayena ca | yonishcasapararddhena kritva shrilalite tava ||
    || etat kamakala rupam bhaktanam sarvakamadam | sarvasaubhagyadamvande tatra tripurasundarim || ||
    vamabhage maheshani vrittam ca caturasrakam | kritvagandhakshatadyaishcapyarccayami maheshvarim ||
    || vagdavadyam namasyami tatra vyapakamandalam | jalayuktenapanau ca shuddhamudra samanvitam || ||
    tatra mantrena dasyami devi te balimuttamam | namastedevadeveshi nama strailokyavandite || || namashshivavarankasthe
    namastripurasundari | pradakshinanamaskaramanenaham karomi te || || tata sankalpamantranam samajam
    parameshvari | prajapamimahavidyam tvat prityartthamaham shive || || tava vidyam prajaptvatha naumi
    tvam parameshvari | mahadevimaheshani mahashivamaye priye || || mahanitye mahasiddhe tvamaham sharanam
    shive | jayatvantripure devi lalite parameshvari || || sadashiva priyankari pahimam karunanidhe |
    jaganmatarjjagadrupejagadishvaravallabhe || || jaganmayi jagat stutye gauri tvamahamashraye | anadyesarvalokanamadye
    bhakteshtadayini || || girirajendratanaye namastipurasundari | jayarinjayadeveshibrahmamatarmaheshvari
    || || vishnumataramadyante haramatassureshvari | brahmyadimatrisamstutye sarvabharana samyukte ||
    || jyotirmayi maharupe pahimam tripure sada | lakshmivanyadisam pujye brahmavishnushivapriya || ||
    bhajami tava padabjam devi tripurasundari | tvalprityartthamyatah kancicchaktim vaipujayamyaham ||
    || tatashca ketanam shaktim tarpayami maheshvari | tathapitvam bhajamstosham cidagnau ca dadamyaham
    || || tvalprityarthyam mahadevi mamabhishtarttha siddhaye | baddhvatvam khaicarimudram kshamasvodvasayamyaham
    || || tishthame hridayenityam tripure parameshvari | jagadambamaharajni mahashakti shivapriye || ||
    hriccakre tishtame nityam mahatripurasundari | etattripurasundarya hridayam sarvakamadam || || maharahasyam
    satatam durllabham daivatairapi | sakshatsadashivenoktam guhyat guhyamanuttamam || || yah patet shraddhaya
    nityam sha rinuyadva samahitah | nityapujaphalandevyassalabhennatra samshayah || || papaih samucyate
    sadyah kayavakk sittasambhavaih | purvajanmasamut bhradatairjnanajnakritairapi || || sarvakratushuyat
    punyam sarvatirttheshu yarphalam | tatpunyam labhate nityam manavo natra samshayah || || acalam labhate
    lakshmim trailokyenati durlabham | sakshadvishnurmahalakshyashighrameva bhavishyati || || ashtaishvarya
    mavapnoti sa shighram manavottamah | ghandikapadukasiddhyadishtakamshighramashnute || || shrimattripurambikayai
    namah | || shrilalitahridayastotram sampurnam || om tat sat ||
  devanagari: अथश्रीललिताहृदयस्तोत्रम् ॥ श्रीललिताम्बिकायै नमः । देव्युवाच । देवदेव महादेव सच्चिदानन्दविग्रहा
    । सुन्दर्याहृदयं स्तोत्रं परं कौतूहलं विभो ॥ ॥ ईश्वरौवाच । साधु साधुत्वया प्राज्ञे लोकानुग्रहकारकम्
    । रहस्यमपिवक्ष्यामि सावधानमनाःश ॥ श्रीविद्यां जगतां धात्रीं सर्ग्गस्थितिलयेश्वरीम् । नमामिललितां नित्यां
    भक्तानामिष्टदायिनीम् ॥ ॥ बिन्दुत्रिकोणसम्युक्तं वसुकोणसमन्वितम् । दशकोणद्वयोपेतं चतुर्द्दश समन्वितम्
    ॥ ॥ दलाष्टकेसरोपेतं दलषोडशकान्वितम् । वृत्तत्रययान्वितम्भूमिसदनत्रयभूषितम् ॥ ॥ नमामि ललिताचक्रं भक्तानामिष्टदायकम्
    । अमृताम्भोनिधिन्तत्र रत्नद्वीपं नमाम्यहम् ॥ ॥ नानावृक्षमहोद्यानं वन्देहं कल्पवाटिकाम् । सन्तानवाटिकांवन्दे
    हरिचन्दनवाटिकाम् ॥ ॥ मन्दारवाटिकां पारिजातवाटीं मुदा भजे । नमामितव देवेशि कदम्बवनवाटिकाम् ॥ ॥ पुष्यरागमहारत्नप्राकारं
    प्रणमाम्यहम् । पद्मरागादिमणिभिःप्राकारं सर्वदा भजे ॥ ॥ गोमेदरत्नप्राकारं वज्रप्राकारमाश्रये । वैडूर्यरत्नप्राकारम्प्रणमामि
    कुलेश्वरी ॥ ॥ इन्द्रनीलाख्यरत्नानां प्राकारं प्रणमाम्यहम् । मुक्ताफलमहारत्नप्राकारम्प्रणमाम्यहम् ॥
    ॥ मरताख्यमहारत्नप्राकाराय नमोनमः । विद्रुमाख्यमहारत्नप्राकारम्प्रणमाम्यहम् ॥ ॥ माणिक्यमण्डपं रत्नसहस्रस्तम्भमण्डपम्
    । ललिते तवदेवेशि भजाम्यमृतवापिकाम् ॥ ॥ आनन्दवापिकां वन्देविमर्शवापिकां भजे । भजेबालातपोल्गारं चन्द्रिकोगारिकां
    भजे ॥ ऋङ्गारपरिखां महापत्माटवीं भजे । चिन्तामणिमहारत्नगृहराजं नमाम्यहम् ॥ ॥ पूर्वान्नायमयं पूर्व्वद्वारं
    देवि नमाम्यहम् । दक्षिणान्नायरूपन्तेदक्षिणद्वारमाश्रये ॥ ॥ नमामि पश्चिमद्वारं पश्चिमाम्नाय रूपकम्
    । वन्देहमुत्तरद्वारमुत्तराम्नायरूपकम् ॥ ॥ ऊर्द्ध्वाम्नायमयं वन्दे ह्यूर्द्धद्वारं कुलेश्वरि । ललितेतव
    देवेशि महासिंहासनं भजे ॥ ॥ ब्रह्मात्मकं मञ्चपादमेकं तव नमाम्यहम् । एकंविष्णुमयं मञ्चपादमन्यं नमाम्यहम्
    ॥ ॥ एकं रुद्रमयं मञ्चपादमन्यं नमाम्यहम् । मञ्चपादम्ममाम्येकं तव देवीश्वरात्मकम् ॥ ॥ मञ्चैकफलकं वन्दे
    सदाशिवमयं शुभम् । नमामितेहंसतूलतल्पकं परमेश्वरी ॥ नमामिते हंसतूलमहोपाधानमुत्तमम् । कौस्तुभास्तरणंवन्दे
    तव नित्यं कुलेश्वरी ॥ ॥ महावितानिकां वन्दे महायविनिकां भजे । एवं पूजागृहं ध्यात्वा श्रीचक्रे श्रीशिवां
    भजे ॥ ॥ स्वदक्षिणे स्थापयामि भागे पुष्पाक्षतादिकान् । अमितांस्तेमहादेवि दीपान् सन्दर्शयाम्यहम् ॥ ॥
    मूलेन त्रिपुराचक्रं तव सम्पूज्ययाम्यहम् । त्रिभिःखण्डैस्तवख्यातैः पूजयामि महेश्वरि ॥ वाय्वग्नि जलसम्युक्तं
    प्राणायामैरहं शिवै । शोषाणान्दाहनं चैव करोमि प्लावनं तथा ॥ ॥ त्रिवारं मूलमन्त्रेण प्राणायामं करोम्यहम्
    । पाषण्डकारिणोभूता भूमौये चान्तरिक्षके ॥ ॥ करोम्यनेन मन्त्रेण तालत्रयमहं शिवे । नारायणोऽहम्ब्रह्माहं
    भैरवोऽहं शिवोस्म्यहम् ॥ ॥ देवोहं परमानन्दोऽस्म्यहं त्रिपुरसुन्दरि । ध्यात्वावै वज्रकवचं न्यासं तव
    करोम्यहम् ॥ ॥ कुमारीबीजसम्युक्तं महात्रिपुरसुन्दरि । मांरक्षरक्षेति हृदि करोम्यज्ञलिमीश्वरि ॥ महादेव्यासनायेति
    प्रकरोम्यासनं शिवे । चक्रासनन्नमस्यामि सर्वमन्त्रासनं शिवे ॥ ॥ साद्ध्यसिद्धासनं मन्त्रैरेभिर्युक्तं
    महेश्वरि । करोम्यस्मिञ्चक्रमन्त्रैर्देवतासनमुत्तमम् ॥ ॥ करोम्यथ षडङ्गाख्यं मातृकां च कलां न्यसे ।
    श्रीकण्टङ्केशवं चैव प्रपञ्चं योगमातृकाम् ॥ ॥ तत्त्वन्यासं ततः कूर्व्वे चतुष्पीटं यथाचरे । लघुषोढान्ततः
    कूर्व्वे शक्तिन्यासं महोत्तमम् ॥ ॥ पीटन्यासं ततः कुर्वे देवतावाहनं प्रिये । कुङ्कुमन्यासकञ्चैव चक्रन्यासमथाचरे
    ॥ ॥ चक्रन्यासं ततः कुर्व्वे न्यासं कामकलाद्वयम् । षोडशार्ण्णमहामन्त्रैरङ्गन्यासङ्करोम्यहम् ॥ ॥ महाषोढां
    ततः कुर्व्वे शाम्भवं च महाप्रिये । ततोमूलम्प्रजप्त्वाथ पादुकाञ्च ततः परम् ॥ ॥ गुरवे सम्यगर्च्याथ देवतां
    हृदिसम्भजे । करोमिमण्डलं वृत्तं चतुरश्रं शिवप्रिये ॥ ॥ पुष्पैरभ्यर्च्च्यसाधारं शङ्खं सम्पूजयामहम्
    । अर्च्चयामिषडङ्गेन जलमापूरयाम्यहम् ॥ ॥ ददामि चादिमं बिन्दुं कुर्वे मूलाभिमन्त्रितम् । तज्जलेनजगन्मातस्त्रिकोणं
    वृत्तसम्युतम् ॥ ॥ षल्कोणं चतुरश्रञ्च मण्डलं प्रणमाम्यहम् । विद्ययापूजयामीह त्रिखण्डेन तु पूजनम् ॥
    ॥ बीजेनवृत्तषल्कोणं पूजयामि तवप्रिये । तस्मिन्देवीकलात्मानां मणिमण्डलमाश्रये ॥ ॥ धूम्रार्च्चिषं नमस्यामि
    ऊष्मां च ज्वलनीं तथा । ज्वालिनीञ्च नमस्यामि वन्देहं विस्पुलिङ्गिनीम् ॥ ॥ सुश्रियं च सुरूपाञ्चकम्पिलां
    प्रणमाम्यहम् । नौमिहव्यवहां नित्यां भजे कव्यवहां कलाम् ॥ ॥ सूर्याग्निमण्डलां तत्र सकलाद्वादशात्मकम्
    । अर्घ्यपाद्यमहन्तत्र तपिनीं तापिनीं भजे ॥ ॥ धूम्रां मरीचीं वन्देहं ज्वालिनीं मरुहं भजे । सुषुम्नाम्भोगदां
    वन्दे भजे विश्वां च बोधिनीम् ॥ ॥ धारिणीं च क्षमां वन्दे सौरीरेताः कलाभजे । आश्रयेमण्मलं चान्द्रं तल्कलाषोडशात्मकम्
    ॥ ॥ अमृतां मानदां वन्दे पूषां तुष्टीं भजाम्यहम् । पुष्टिम्भजे महादेवि भजेऽहं च रतिं धृतिम् ॥ ॥ रशनिं
    चन्द्रिकां वन्दे कान्तीं जोत्सना श्रियं भजे । नेऔमिप्रीतिञ्चागतदाञ्चपूर्ण्णिमाममृताम्भजे ॥ ॥ त्रिकोणलेखनं
    कुर्व्वे आकारादिसुरेखकम् । हलक्षवर्ण्णसम्युक्तंस्पीतं तं हंसभास्करम् ॥ ॥ वाक्कामशक्ति संयुक्तं हंसमाराधयाम्यहम्
    । वृत्ताद्बहिःषडश्रस्यलेखनं प्रकरोम्यहम् ॥ ॥ पुरतोग्न्यादिषल्ख़ओणं कखगेनार्च्चयाम्यहम् । श्रीविद्ययासप्तवारं
    करोम्यत्राभि मन्त्रितम् ॥ ॥ समर्प्पयामि देवेशि तस्मात् गन्धाक्षतादिकम् । ध्यायामिपूजाद्रव्येषु तत्
    सर्वं विद्ययायुतम् ॥ ॥ चतुर्न्नवतिसन्मन्त्रान् स्पृष्ट्वा तत् प्रजपाम्यहम् । वह्नेर्द्दशकलाःसूर्यकलाद्वादशकं
    भजे ॥ ॥ आश्रये शोडषकलास्तत्र चन्द्रमसस्तदा । सृष्टिम्वृद्धिं स्मृतिं वन्दे मेधां कान्तीं तथैव च ॥
    ॥ लक्ष्मीं द्युथिं स्थितां वन्दे स्थितिं सिद्धिं भजाम्यहम् । एताब्रह्मकलावन्दे जरान्थां पालिनीं भजे
    ॥ ॥ शान्तिं नमामीश्वरीं च रतीं वन्दे च कारिकाम् । वरदांह्लादिनीं वन्दे प्रीतिं दीर्घां भजाभम्यहम्
    ॥ ॥ एता विष्णुअकलावन्दे तीक्षणां रौद्रिं भयां भजे । निद्रान्तन्द्रीं क्षुधां वन्दे नमामि क्रोधिनीं
    क्रियाम् ॥ ॥ उल्कारीं मृत्युरूपां च एता रुद्रकला भजे । नीलाम्पीतां भजे श्वेतां वन्देहमरुणां कलाम्
    ॥ ॥ अनन्तख्यां कलाञ्चेति ईश्वरस्य कलाभजे । निवृत्तिञ्चप्रतिष्ठाञ्चविद्यांशान्तिं भजाम्यहम् ॥ ॥ रोधिकां
    दीपिकां वन्दे रेचिकां मोचिकां भजे । परांसूक्षामृतां सूक्षां प्रणामि कुलेश्वरि ॥ ज्ञानाख्याञ्चनमस्यामि
    नौमिज्ञानामृतां कलाम् । आप्यायिनींव्यापिनीं च मोदिनीं प्रणमाम्यहम् ॥ ॥ कलाः सदाशिवस्यैताः षोडश प्रणमाम्यहम्
    । विष्णुयोनिन्नमस्यामि मूलविद्यां नमाम्यहम् ॥ ॥ त्रैयम्बकं नमस्यामि तद्विष्णुं प्रणमाम्यहम् । विष्णुयोनिम्नमस्यामि
    मूलविद्यां नमाम्यहम् ॥ ॥ अमृतं मन्त्रितं वन्दे चतुर्न्नवतिभिस्तथा । अखण्डैकरसानन्दकरेपरसुधात्मनि ॥
    ॥ स्वच्छन्दस्पपुरणं मन्त्रं नीधेहि कुलरूपिणि । अकुलस्थामृताकारेसिद्धिज्ञानकरेपरे ॥ ॥ अमृतं निधेह्यस्मिन्
    वस्तुनिक्लिन्नरूपिणि । तद्रूपाणेकरस्यत्वङ्कृत्वाह्येतत्स्वरूपिणि ॥ ॥ भूत्वा परामृताकारमयि चित् स्पुरणं
    कुरु । एभिर्म्मनूत्तमैर्वन्देमन्त्रितं परमामृतम् ॥ ॥ जोतिम्मयमिदं वन्दे परमर्घ्यञ्च सुन्दरि । तद्विन्दुभिर्मेशिरसि
    गुरुं सन्तर्प्पयाम्यहम् ॥ ॥ ब्रह्मास्मिन् तद्विन्दुं कुण्डलिन्यां जुहोम्यहम् । हृच्चक्रस्तां महादेवीम्महात्रिपुरसुन्दरीम्
    ॥ ॥ निरस्तमोहतिमिरां साक्षात् संवित्स्वरूपिणीम् । नासापुटात्परकलामथनिर्ग्गमयाम्यहम् ॥ ॥ नमामियोनिमद्ध्यास्थां
    त्रिखण्डकुसुमांञ्जलिम् । जगन्मातर्महादेवियन्त्रेत्वां स्थापयाम्यहम् ॥ ॥ सुधाचैतन्यमूर्त्तीं ते कल्पयामिमनुं
    तव । अनेनदेविमन्त्रयन्त्रेत्वां स्थापयाम्यहम् ॥ ॥ महापद्मवनान्तस्थे कारणानन्तविग्रहे । सर्वभूतहितेमातरेह्यपि
    परमेश्वरि ॥ ॥ देवेशी भक्तसुलभे सर्वाभरणभूषिते । यावत्वम्पूजयामीहतावत्त्वं सुस्थिराभव ॥ ॥ अनेन मन्त्रयुग्मेन
    त्वामत्रावाहयाम्यहम् । कल्पयामिनमः पादमर्घ्यं ते कल्पयाम्यहम् ॥ ॥ गन्धतैलाभ्यञ्जनञ्चमज्जशालाप्रवेशम्
    । कल्पयामिनमस्तस्मै मणिपीठोप्रवेशनम् ॥ ॥ दिव्यस्नानीयमीशानि गृहाणोद्वर्त्तनं शुभे । गृहाणोष्णादकस्नानङ्कल्पयाम्यभिषेचनम्
    ॥ ॥ हेमकुम्भायुतैः स्निग्द्धैः कल्पयाम्यभिषेचनम् । कल्पयामिनमस्तुभ्यं धेऔतेन परिमार्ज्जनम् ॥ ॥ बालभानु
    प्रतीकाशं दुकूलं परिधानकम् । अरुणेनदुकुलेनोत्तरीयं कल्पयाम्यहम् ॥ ॥ प्रवेशनं कल्पयामि सर्वाङ्गानि
    विलेपनम् । नमस्तेकल्पयाम्यत्र मणिपीठोपवेशनम् ॥ ॥ अष्टगन्धैः कल्पयामि तवलेखनमम्बिके । कालागरुमहाधूपङ्कल्पयामि
    नमश्शिवे ॥ ॥ मल्लिकामालातीजाति चम्पकादि मनोरमैः । अर्च्चिताङ्कुसुमैर्म्मालां कल्पयामि नमश्शिवे ॥ ॥
    प्रवेशनं कल्पयामि नमो भूषणमण्डपे । उपवेश्यंरत्नपीठे तत्रते कल्पयाम्यहम् ॥ ॥ नवमाणिक्यमकुटं तत्रते
    कल्पयाम्यहम् । शरच्चन्द्रनिभंयुक्तं तच्चन्द्रशकलं तव ॥ ॥ तत सीमन्तसिन्दूरं कस्तूरीतिलकं तव । कालाज्ञनङ्कल्पयामि
    पालीयुगलमुत्तमम् ॥ ॥ मणिकुण्डलयुग्मञ्च नासाभरणमीश्वरी । ताटङ्कयुगलन्देवि ललिते धारयाम्यहम् ॥ ॥ अथाद्यां
    भूषणं कण्ठे महाचिन्ताकमुत्तमम् । पदकन्ते कल्पयामि महापदकमुत्तमम् ॥ ॥ मुक्तावलीं कल्पयामि चैकावलि समन्विताम्
    । छन्नवीरञ्चकेयूरयुगलानां चतुष्टयम् ॥ ॥ वलयावलिमालानीं चोर्मिकावलिमीश्वरि । काञ्चीदामकटीसूत्रंसौभग्याभरणं
    च ते ॥ ॥ त्रिपुरे पादकटकं कल्पये रत्ननूपुरम् । पादाङ्गुलीयकन्तुभ्यं पाशमेकं करेतव ॥ ॥ अन्ये करेङ्कुशं
    देवि पूण्ड्रेक्षुधनुषं तव । अपरेपुष्पबाणञ्च श्रीमन्माणिक्यपादुके ॥ ॥ तदावरण देवेशि महामञ्चादिरोहणम्
    । कामेश्वराङ्कपर्यङ्कमुपवेशनमुत्तमम् ॥ ॥ सुधया पूर्ण्णचषकं ततस्तत् पानमुत्तमम् । कर्प्पूरवीटिकान्तुभ्यं
    कल्पयामि नमः शिवे ॥ ॥ आनन्दोल्लासविलसद्धंसं ते कल्पयाम्यहम् । मङ्गलारात्रिकंवन्दे छत्रं ते कल्पयाम्यहम्
    ॥ ॥ चामरं यूगलं देविदर्प्पणं कल्पयाम्यहम् । तालव्रिन्तङ्कल्पयामिगन्धपुष्पाक्षतैरपि ॥ ॥ धूपं दीपश्चनैवेद्यं
    कल्पयामि शिवप्रिये । अथाहम्बैन्दवे चक्रे सर्वानन्दमयात्मके ॥ ॥ रत्नसिंहासने रम्ये समासीनां शिवप्रियाम्
    । उद्यद्भानुसहस्राभाञ्जपापुष्पसमप्रभाम् ॥ ॥ नवरत्नप्रभायुक्तमकुटेन विराजिताम् । चन्द्ररेखासमोपेताङ्कस्तूरितिलकाङ्किताम्
    ॥ ॥ कामकोदण्डसौन्दर्यनिर्ज्जितभ्रूलतायुताम् । अञ्जनाञ्चितनेत्रान्तुपद्मपत्रनिभेषणाम् ॥ ॥ मणिकुण्डलसम्युक्त
    कर्ण्णद्वयविराजिताम् । ताम्बूलपूरितमुखींसुस्मितास्यविराजिताम् ॥ ॥ आद्यभूषणसम्युक्तां हेमचिन्ताकसंयुताम्
    । पदकेनसमोपेतां महापदकसंयुताम् ॥ ॥ मुक्ताफलसमोपेतामेकावलिसमन्विताम् । कौसुभाङ्गदसंयुक्तचतुर्बाहुसमन्विताम्
    ॥ ॥ अष्टगन्धसमोपेतां श्रीचन्दनविराजिताम् । हेमकुम्भोपमप्रख्यस्तनद्वन्दविराजिताम् ॥ ॥ रक्तवस्त्रपरीधानां
    रक्तकञ्चुकसंयुताम् । सूक्ष्मरोमावलियुक्ततनुमद्ध्यविराजिताम् ॥ ॥ मुक्तामाणिक्यखचित काञ्चीयुतनितम्बनीम्
    । सदाशिवाङकस्थबृहन्महाजघनमण्डलाम् ॥ ॥ कदलिस्तम्भसंराजदूरुद्वयविराजिताम् । कपालीकान्तिसङ्काशजङ्घायुगलशोभिताम्
    ॥ ॥ ग्रूढगुल्फद्वेयोपेतां रक्तपादसमन्विताम् । ब्रह्मविष्णुमहेशादिकिरीटस्फूर्ज्जिताङ्घ्रिकाम् ॥ ॥ कान्त्या
    विराजितपदां भक्तत्राण परायणाम् । इक्षुकार्मुकपुष्पेषुपाशाङ्कुशधरांशुभाम् ॥ ॥ संवित्स्वरूपिणीं वन्दे
    ध्यायामि परमेश्वरीम् । प्रदर्शयाम्यथशिवेदशामुद्राः फलप्रदाः ॥ ॥ त्वां तर्प्पयामि त्रिपुरे त्रिधना
    पार्व्वति । अग्नौमहेशदिग्भागे नैरृत्र्यां मारुते तथा ॥ ॥ इन्द्राशावारुणी भागे षडङ्गान्यर्च्चये क्रमात्
    । आद्याङ्कामेश्वरीं वन्दे नमामि भगमालिनीम् ॥ ॥ नित्यक्लिन्नां नमस्यामि भेरुण्डां प्रणमाम्यहम् । वह्निवासान्नमस्यामि
    महाविद्येश्वरीं भजे ॥ ॥ शिवदूतिं नमस्यामि त्वरितां कुल सुन्दरीम् । नित्यान्नीलपताकाञ्च विजयां सर्वमङ्गलाम्
    ॥ ॥ ज्वालामालाञ्च चित्राञ्च महानित्यां च संस्तुवे । प्रकाशानन्दनाथाख्याम्पराशक्तिनमाम्यहम् ॥ ॥ शुक्लदेवीं
    नमस्यामि प्रणमामि कुलेश्वरीम् । परशिवानन्दनाथाख्याम्पराशक्ति नमाम्यहम् ॥ ॥ कौलेश्वरानन्दनाथं नौमि
    कामेश्वरीं सदा । भोगानन्दन्नमस्यामि सिद्धौघञ्च वरानने ॥ ॥ क्लिन्नानन्दं नमस्यामि समयानन्दमेवच । सहजानन्दनाथञ्चप्रणमामि
    मुहुर्मुहु ॥ ॥ मानवौघं नमस्यामि गगनानन्दगप्यहम् । विश्वानन्दन्नमस्यामि विमलानन्दमेवच ॥ ॥ मदनानन्दनाथञ्च
    भुवनानन्दरूपिणीम् । लीलानन्दन्नमस्यामि स्वात्मानन्दं महेश्वरि ॥ ॥ प्रणमामिप्रियानन्दं सर्वकामफलप्रदम्
    । परमेष्टिगुरुंवन्दे परमङ्गुरुमाश्रये ॥ ॥ श्रीगुरुं प्रणमस्यामि मूर्द्ध्नि ब्रह्मबिलेश्वरीम् । श्रीमदानन्दनाथाख्यश्रिगुरोपादुकां
    तथा ॥ ॥ अथ प्राथमिके देवि चतुरश्रे कुलेश्वरि । अणिमांलखिमां वन्दे महिमां प्रणमाम्यहम् ॥ ॥ ईशित्वसिद्धिं
    कलये वशित्वं प्रणमाम्यहम् । प्राकाम्यसिद्धिम्भुक्तिञ्च इच्छाप्राप्र्तिमहं भजे ॥ ॥ सर्वकामप्रदां सर्वकामसिद्धिमहं
    भजे । मद्ध्यमेचतुरश्रेहं ब्राह्मीं माहेश्वरीं भजे ॥ ॥ कौमारीं वैष्णवीं वन्दे वाराहीं प्रणमाम्यहम्
    । माहेन्द्रीमपिचामुण्डाम्महालक्ष्मीमहं भजे ॥ ॥ तृतीये चतुरश्रे तु सर्वसङ्क्षोभिणीं भजे । सर्वविद्रापिणीम्मुद्रां
    सर्वाकर्षिणिकां भजे ॥ ॥ मुद्रां वशङ्करीं वन्दे सर्वोन्मादिनिकां भजे । भजेमहाङ्कुशां मुद्रां खेचरीं
    प्रणमाम्यहम् ॥ ॥ बीजामुद्रां योनिमुद्रां भजे सर्वत्रिखण्डिनीम् । त्रैलोक्यमोहनञ्चक्रं नमामि ललिते
    तव ॥ ॥ नमामि योगिनीं तत्र प्रखटाख्यामभीष्टदाम् । सुधार्ण्णवासनंवन्दे तत्र ते परमेश्वरि ॥ ॥ चक्रेश्वरि
    महं वन्दे त्रिपुरां प्रणमाम्यहम् । सर्वसङ्क्षोभिणीम्मुद्रां ततोहं कलये शिवे ॥ ॥ अथाहं षोडशदले कामाकर्षिणिकां
    भजे । बुद्ध्याकर्षिणिकां वन्देऽहङ्काराकर्षिणीं भजे ॥ ॥ शब्दाकर्षिणिकां वन्दे स्पर्शाकर्षिणिकां भजे
    । रूपाकर्षिणिकांवन्दे रसाकर्षिणिकां भजे ॥ ॥ गन्धाकर्षिणिकां वन्दे चित्ताकर्षिणिकां भजे । धैर्याकर्षिणिकांवन्दे
    स्मृत्याकर्षिणिकां भजे ॥ ॥ नामाकर्षिणिकां वन्दे बीजाकर्षिणिकां भजे । आत्माकर्षिणिकांवन्दे अमृताकर्षिणिकां
    भजे ॥ ॥ शरीराकर्षिणिकां वन्दे नित्यां श्रीपरमेश्वरि । सर्वाशापूरकंवन्दे कल्पयेहं तवेश्वरि ॥ ॥ गुप्ताख्यां
    योगिनीं वन्दे मातरं गुप्तपूज्यताम् । पोताम्बुजासनन्तत्र नमामि ललिते तव ॥ ॥ त्रिपुरेशीं नमस्यामि भजामिष्टार्त्थसिद्धिदाम्
    । सर्वविद्राविणिमुद्रान्तत्राहं ते विचन्तये ॥ ॥ सिवे तवाष्टपत्रेहमनङ्गकुसुमां भजे । अनङ्गमेखलांवन्दे
    अनङ्गमदनां भजे ॥ ॥ नमोहं प्रणस्यामि अनङ्गमदनातुराम् । अनङ्गरेखाङ्कलये भजेनङ्गां च वेगिनीम् ॥ ॥ अनङ्गाकुशवन्देऽहमनङ्गमालिनीं
    भजे । तत्राहम्प्रणस्यामि देव्या आसनमुत्तमम् ॥ ॥ नमामि जगतीशानीं तत्र त्रिपुरसुन्दरीम् । सर्वाकर्षिणिकाम्मुद्रां
    तत्राह कल्पयामिते ॥ ॥ भुवनाश्रये तव शिवे सर्वसङ्क्षोभिणीं भजे । सर्वविद्राविणींवन्दे सर्वकर्षिणिकां
    भजे ॥ ॥ सर्वह्लादिनीं वन्दे सर्वसम्मोहिनीं भजे । सकलस्तम्भिनीं वन्दे कलये सर्वजृम्भिणीम् ॥ ॥ वशङ्करीं
    नमस्यामि सर्वरज्ञिनिकां भजे । सकलोन्मदिनीं वन्दे भजे सर्वार्थसाधके ॥ ॥ सम्पत्तिपुरिकां वन्दे सर्वमन्त्रमयीं
    भजे । भजाम्येवततश्शक्तिं सर्वद्वन्द्वक्ष्यङ्करीम् ॥ ॥ तत्राहं कलये चक्रं सर्वसौभाग्यदायकम् । नमामिजगतां
    धात्रीं सम्प्रदायाख्ययोगिनिम् ॥ ॥ नमामि परमेशानीं महात्रिपुरवासिनिम् । कलयेहन्तव शिवे मुद्रां सर्वशङ्करीम्
    ॥ ॥ बहिर्द्दशारे ते देवि सर्वसिद्धिप्रदां भजे । सर्वसम्पत्प्रदां वन्दे सर्वप्रियङ्करीं भजे ॥ ॥ नमाम्यहं
    ततो देवीं सर्वमङ्गलकारिणीम् । सर्वकामप्रदांवन्दे सर्वदुःखविमोचिनिम् ॥ ॥ सर्वमृत्युप्रशमनीं सर्वविघ्ननिवारिणीम्
    । सर्वाङ्गसुन्दरींवन्दे सर्वसौभाग्यदायिनीम् ॥ ॥ सर्वार्त्थसाधकं चक्रं तत्राहं ने विचिन्तये । तत्राहन्ते
    नमस्यामि कुलोत्तीर्णाख्य योगिनीम् ॥ ॥ सर्वमन्त्रसनं वन्दे त्रिपुराश्रियमाश्रये । कलयामिततो मुद्रां
    सर्वोन्मादन कारिणीम् ॥ ॥ अन्तर्द्दशारे ते देवि सर्वज्ञां प्रणमाम्यहम् । सर्वशक्तिन्नमस्यामि सर्वैश्वर्यप्रदां
    भजे ॥ ॥ सर्वज्ञानमयीं वन्दे सर्वव्याधिविनाशिनीम् । सर्वाधारस्वरूपाञ्चसर्वपापहराम्भजे ॥ ॥ सर्वानन्दमयिं
    वन्दे सर्वरक्षास्वरूपिणीम् । प्रणमामिमहादेवीं सर्वेप्सित फलप्रदाम् ॥ ॥ सर्वरक्षाकरं चक्रं सुन्दरीं
    कलये सदा । निगर्भयोनींवन्दे तत्राहं प्रणमाम्यहम् ॥ ॥ साद्ध्यसिद्धासनं वन्दे भजे त्रिपुरमालिनीम् ।
    कलयामिततो देवीं मुद्रां सर्वमहाङ्कुशाम् ॥ ॥ अष्टारे वशिनीं वन्दे महा कामेश्वरीं भजे । मोदिनींविमलांवन्दे
    अरुणाजयिनीं भजे ॥ ॥ सर्वेश्वरीं नमस्यामि कौलिनीं प्रणमाम्यहम् । सर्वरोगहरञ्चक्रं तत्राहं कलये सदा
    ॥ ॥ नमामि त्रिपुरा सिद्धिं भजे मुद्रां च खेचरीम् । महात्रिकोणवत्बाहुचतुरश्रे कुलेश्वरि ॥ ॥ नमामि जृम्भणाबाणं
    सर्वसम्मोहिनीं भजे । पाशञ्चापं भजे नित्यं भजे स्तम्भनमङ्कुशम् ॥ ॥ त्रिकोणेहं जगद्धात्रीं महाकामेश्वरीं
    भजे । महावज्रेश्वरींवन्दे महाश्रीभगमालिनीम् ॥ ॥ महाश्रीसुन्दरीं वन्दे सर्वकामफलप्रदाम् । सर्वसिद्धिप्रदञ्चक्रं
    तवदेवि नमाम्यहम् ॥ ॥ नमाम्यतिरहस्याख्यां योगिनीं तवकामदाम् । त्रिपुराम्बान्नमस्यामि बीजामुद्रामहाम्भजे
    ॥ ॥ मूलमन्त्रेण ललिते तल्बिन्दौ पूजयाम्यहम् । सर्वानन्दमयञ्चक्रं तवदेवि भजाम्यहम् ॥ ॥ परां पररहस्याख्यां
    योगिनीं तत्रकामदाम् । महाचक्रेश्वरींवन्दे योनिमुद्रामहं भजे ॥ ॥ धूपदीपादिकं सर्वमर्प्पितं कल्पयाम्यहम्
    । त्वल्प्रीतयेमहामुद्रां दर्शयामि ततश्शिवे ॥ ॥ शाल्यन्नं मधुसम्युक्तं पायसापूप सम्युक्तम् । घृतसूपसमायुक्तन्दधिक्षीरसमन्वितम्
    ॥ ॥ सर्वभक्ष्यसमायुक्तं बहुशाकसमन्वितम् । निक्षिप्यकाञ्चने पात्रे नैवेद्यं कल्पयामि ते ॥ ॥ सङ्कल्पबिन्दुना
    चक्रं कुचौ बिन्दुद्वयेन च । योनिश्चसपरार्द्धेन कृत्वा श्रीललिते तव ॥ ॥ एतत् कामकला रूपं भक्तानां सर्वकामदम्
    । सर्वसौभाग्यदंवन्दे तत्र त्रिपुरसुन्दरीम् ॥ ॥ वामभागे महेशानि वृत्तं च चतुरस्रकम् । कृत्वागन्धाक्षताद्यैश्चाप्यर्च्चयामि
    महेश्वरीम् ॥ ॥ वाग्दवाद्यं नमस्यामि तत्र व्यापकमण्डलम् । जलयुक्तेनपाणौ च शुद्धमुद्रा समन्वितम् ॥ ॥
    तत्र मन्त्रेण दास्यामि देवि ते बलिमुत्तमम् । नमस्तेदेवदेवेशि नम स्त्रैलोक्यवन्दिते ॥ ॥ नमश्शिववराङ्कस्थे
    नमस्त्रीपुरसुन्दरि । प्रदक्षिणनमस्कारमनेनाहं करोमि ते ॥ ॥ तत सङ्कल्पमन्त्राणां समाजं परमेश्वरि । प्रजपामिमहाविद्यां
    त्वत् प्रीत्यर्त्थमहं शिवे ॥ ॥ तव विद्यां प्रजप्त्वाथ नौमि त्वां परमेश्वरि । महादेविमहेशानि महाशिवमये
    प्रिये ॥ ॥ महानित्ये महासिद्धे त्वामहं शरणं शिवे । जयत्वन्त्रिपुरे देवि ललिते परमेश्वरि ॥ ॥ सदाशिव
    प्रियङ्करि पाहिमां करुणानिधे । जगन्मातर्ज्जगद्रूपेजगदीश्वरवल्लभे ॥ ॥ जगन्मयि जगत् स्तुत्ये गौरि त्वामहमाश्रये
    । अनाद्येसर्वलोकानामाद्ये भक्तेष्टदायिनि ॥ ॥ गिरिराजेन्द्रतनये नमस्तीपुरसुन्दरि । जयारीञ्जयदेवेशिब्रह्ममातर्महेश्वरि
    ॥ ॥ विष्णुमातरमाद्यन्ते हरमातस्सुरेश्वरि । ब्रह्म्यादिमातृसंस्तुत्ये सर्वाभरण सम्युक्ते ॥ ॥ ज्योतिर्मयि
    महारूपे पाहिमां त्रिपुरे सदा । लक्ष्मीवाण्यादिसं पूज्ये ब्रह्मविष्णुशिवप्रिय ॥ ॥ भजामि तव पादाब्जं
    देवि त्रिपुरसुन्दरि । त्वल्प्रीत्यर्त्थंयतः काञ्चीच्छक्तिं वैपूजयाम्यहम् ॥ ॥ ततश्च केतनां शक्तिं तर्पयामि
    महेश्वरि । तथापित्वां भजंस्तोषं चिदग्नौ च ददाम्यहम् ॥ ॥ त्वल्प्रीत्यर्थ्यं महादेवि ममाभीष्टार्त्थ
    सिद्धये । बद्ध्वात्वां खैचरीमुद्रां क्षमस्वोद्वासयाम्यहम् ॥ ॥ तिष्ठमे हृदयेनित्यं त्रिपुरे परमेश्वरि
    । जगदम्बमहाराज्ञि महाशक्ति शिवप्रिये ॥ ॥ हृच्चक्रे तिष्तमे नित्यं महात्रिपुरसुन्दरि । एतत्त्रिपुरसुन्दर्या
    हृदयं सर्वकामदम् ॥ ॥ महारहस्यं सततं दुर्ल्लभं दैवतैरपि । साक्षात्सदाशिवेनोक्तं गुह्यात् गुह्यमनुत्तमम्
    ॥ ॥ यः पतेत् श्रद्धया नित्यं श ऋणुयाद्वा समाहितः । नित्यपूजाफलन्देव्यास्सलभेन्नात्र संशयः ॥ ॥ पापैः
    समुच्यते सद्यः कायवाक्क् सित्तसम्भवैः । पूर्वजन्मसमुत् भ्रदतैर्ज्ञानाज्ञकृतैरपि ॥ ॥ सर्वक्रतुषुयत्
    पुण्यं सर्वतीर्त्थेषु यर्फलम् । तत्पुण्यं लभते नित्यं मानवो नात्र संशयः ॥ ॥ अचलां लभते लक्ष्मीं त्रैलोक्येनाति
    दुर्लभाम् । साक्षाद्विष्णुर्महालक्ष्याशीघ्रमेव भविष्यति ॥ ॥ अष्टैश्वर्य मवाप्नोति स शीघ्रं मानवोत्तमः
    । घण्डिकापादुकासिद्ध्यादिष्टकंशीघ्रमश्नुते ॥ ॥ श्रीमत्त्रिपुराम्बिकायै नमः । ॥ श्रीललिताहृदयस्तोत्रं
    सम्पूर्णम् ॥ ॐ तत् सत् ॥
