id: manukritammatsyastotram
category: stotram
name:
  english: manukritammatsyastotram
  devanagari: मनुकृतंमत्स्यस्तोत्रम्
content:
  english: nnamna yatha darumayim narah striyam || 26|| yam lokapalah kila matsarajvara hitva yatanto'pi
    prithaksametya ca | patum na shekurdvipadashcatushpadah sarisripam sthanu yadatra drishyate || 27||
    bhavan yugantarnava urmimalini kshonimimamoshadhivirudham nidhim | maya sahorukramateja ojasa tasmai
    jagatpranaganatmane nama iti || 28|| iti shrimadbhagavatamahapurane pancamaskandhe ashtadashadhyayantargatam
    manukritam matsyastotram samaptam | bhagavatapurana | adhyaya 5
  devanagari: न्नाम्ना यथा दारुमयीं नरः स्त्रियम् ॥ २६॥ यं लोकपालाः किल मत्सरज्वरा हित्वा यतन्तोऽपि पृथक्समेत्य
    च । पातुं न शेकुर्द्विपदश्चतुष्पदः सरीसृपं स्थाणु यदत्र दृश्यते ॥ २७॥ भवान् युगान्तार्णव ऊर्मिमालिनि
    क्षोणीमिमामोषधिवीरुधां निधिम् । मया सहोरुक्रमतेज ओजसा तस्मै जगत्प्राणगणात्मने नम इति ॥ २८॥ इति श्रीमद्भागवतमहापुराणे
    पञ्चमस्कन्धे अष्टादशाध्यायान्तर्गतं मनुकृतं मत्स्यस्तोत्रं समाप्तम् । भागवतपुराण । अध्याय ५
meaning: {}
