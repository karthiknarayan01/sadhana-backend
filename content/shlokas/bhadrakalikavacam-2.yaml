id: bhadrakalikavacam-2
category: kavacha
name:
  english: bhadrakalikavacam 2
  devanagari: भद्रकालीकवचम् २
content:
  english: dharmarthakamamoksharthe kavaca pathe viniyogah | atha dhyanam | udyashcandrakalavatamsita
    shikham krinkara varnujvalam | shyamam shyamamukhim ravindu nayanam hum varna raktadharam || 6|| bhaim
    bijankita manasam shavagatam nilambarodbhasitam | svahalankrita sarva gatra latikam bhaim bhadrakalim
    bhaje || 7|| om bhaim patu me shiro nityam devi bhadrakalika | lalatam krim sada patu maharatneshvari
    tatha || 8|| krim bhruvau patu me nityam mahakameshvari tatha | netrevyat krim ca me nityam nityanandamayi
    shiva || 9|| gandau me patu bhaim nityam sarvalokamaheshvari | shruti hrim patu me nityam sarvamangalamangala
    || 10|| nasam hrim patu me nityam mahatribhuvaneshvari | adhare hum sadavyanme sarvamantramayi tatha
    || 11|| jihvam krim me sada patu vishuddheshvararupini | bhaim hrim hrim me radanpatu nitya krim kulasundari
    || 12|| hrim hum krim me galam patu jvalamandalamandana | hrim hum krim me bhujau patu bhavamokshapradambika
    || 13|| hrim hum krim me karau patu sarvanandamayi tatha | stanau krim hum sada patu nitya nilapatakini
    || 14|| krim bhaim hrim mama vakshovyat brahmavidyamayi shiva | bhaim hum kukshim me sada patu mahatripurasundari
    || 15|| aim sauh bhaim patu me parshvau vidya caturdashatmika | aim klim bhaim patu me prishtham sarvamantravibhushita
    || 16|| om krim aim sauh sadavyanme nabhim bhaim baindaveshvari | om hrim hum patu shishnam me devata
    bhagamalini || 17|| hrim hrim hrim me katim patu devata bhagarupini | hum hum bhaim bhaim sadavyanme
    devi brahmasvarupini || 18|| om krim hum patu me janu mahatripurabhairavi | om krim aim sauh patu
    me janghe balashritripureshvari || 19|| gulphau me krim sada patu shivashaktisvarupini | krim aim
    sauh patu me padau payad shrikulasundari || 20|| bhaim krim hum shrim sada patu padadhah kulashekhara
    | om krim hum shrim sadavyanme padaprishtham maheshvari || 21|| krim hum shrim bhaim vapu payat sarvam
    me bhadrakalika | krim hrim hrim patu mam pratardevendri vajrayogini || 22|| hum bhaim mam patu madhyanhe
    nityamekadashakshari | om aim sauh patu mam sayandevata parameshvari || 23|| nishadau krim ca mam
    patu devi shrishodashakshari | ardharatre ca mam patu krim hum bhaim chinnamastaka || 24|| nishavasana
    samaye patu mam krim ca pancami | purve mam patu shrim hrim klim rajni rajyapradayini || 25|| om hrim
    hum mam pashcimevyatsarvada tattvarupini | aim sauh mam dakshine patu devi dakshinakalika || 26||
    aim klim mamuttare patu rajarajeshvari tatha | vrajantam patu mam shrim hum tishthantam krim sadavatu
    || 27|| prabudham hum sada patu suptam mam patu sarvada | agneye krim sada patu nairritye hum tathavatu
    || 28|| vayavye krim sada payadaishanyam bhaim sadavatu | urdhvam krim mam sada patu hyadhasta hrim
    tathaivatu || 29|| cauratopaptibhitibhyah payanmam shrim shiveshvari | yakshabhutapishacadi rakshasebhyovatatsada
    || 30|| aim klim sauh hum ca matangicocchishthapadarupini | daityabhucarabhitibhyovatad dvavimshadakshari
    || 31|| vismaritam tu yatsthanam yatsthanam namavarjitam | tatsarvam patu me nityam devi bhaim bhadrakalika
    || 32|| itidam kavacam devi sarvamantramayam param | jagatmangalanamedam rahasyam sarva kamikam ||
    33|| rahasyati rahasyam ca gopyam guptataram kalau | mantragarbham ca sarvasvam bhadrakalya mayasmritam
    || 34|| adrishtavyamavaktavyam adatavyamavacikam | ashrotavyamidam varma dikshahinaya parvati || 35||
    abhaktebhyopiputrebhyo datva naraka mapnuyat | datavyamabhaktebhyo bhaktebhyo diyate sada || 36||
    mahadaridrya shamanam mahamangalavardhanam | bhurjatvaci likheddevi rocana candanena ca || 37|| shvetasutrena
    samveshtya dharayenmurdhni va bhuje | murdhni dhritva ca kavacam trailokyavijayam bhavet || 38|| bhuje
    dhritva ripunjitva rane jayamavapnuyat | itidam kavacam devi mulamantraika sadhanam || 39|| guhyam
    gopyam param punyam gopaniya svayonivat | || iti shribhairavitantre bhadrakalikavacam sampurnam ||
  devanagari: धर्मार्थकाममोक्षार्थे कवच पाठे विनियोगः । अथ ध्यानम् । उद्यश्चन्द्रकलावतंसित शिखां क्रीङ्कार
    वर्णूज्वलाम् । श्यामां श्याममुखीं रवीन्दु नयनां हूं वर्ण रक्ताधराम् ॥ ६॥ भैं बीजाङ्कित मानसां शवगतां
    नीलाम्बरोद्भासिताम् । स्वाहालङ्कृत सर्व गात्र लतिकां भैं भद्रकालीं भजे ॥ ७॥ ॐ भैं पातु मे शिरो नित्यं
    देवी भद्रकालिका । ललाटं क्रीं सदा पातु महारत्नेश्वरी तथा ॥ ८॥ क्रीं भ्रुवौ पातु मे नित्यं महाकामेश्वरी
    तथा । नेत्रेव्यात् क्रीं च मे नित्यं नित्यानन्दमयी शिवा ॥ ९॥ गण्डौ मे पातु भैं नित्यं सर्वलोकमहेश्वरी
    । श्रुती ह्रीं पातु मे नित्यं सर्वमङ्गलमङ्गला ॥ १०॥ नासां ह्रीं पातु मे नित्यं महात्रिभुवनेश्वरी ।
    अधरे हूं सदाव्यान्मे सर्वमन्त्रमयी तथा ॥ ११॥ जिह्वां क्रीं मे सदा पातु विशुद्धेश्वररूपिणी । भैं ह्रीं
    ह्रीं मे रदान्पातु नित्या क्रीं कुलसुन्दरी ॥ १२॥ ह्रीं हूं क्रीं मे गलं पातु ज्वालामण्डलमण्डना । ह्रीं
    हूं क्रीं मे भुजौ पातु भवमोक्षप्रदाम्बिका ॥ १३॥ ह्रीं हूं क्रीं मे करौ पातु सर्वानन्दमयी तथा । स्तनौ
    क्रीं हूं सदा पातु नित्या नीलपताकिनी ॥ १४॥ क्रीं भैं ह्रीं मम वक्षोव्यात् ब्रह्मविद्यामयी शिवा । भैं
    हूं कुक्षिं मे सदा पातु महात्रिपुरसुन्दरी ॥ १५॥ ऐं सौः भैं पातु मे पार्श्वौ विद्या चतुर्दशात्मिका
    । ऐं क्लीं भैं पातु मे पृष्ठं सर्वमन्त्रविभूषिता ॥ १६॥ ॐ क्रीं ऐं सौः सदाव्यान्मे नाभिं भैं बैन्दवेश्वरी
    । ॐ ह्रीं हूं पातु शिश्नं मे देवता भगमालिनी ॥ १७॥ ह्रीं ह्रीं ह्रीं मे कटिं पातु देवता भगरूपिणी ।
    हूं हूं भैं भैं सदाव्यान्मे देवी ब्रह्मस्वरूपिणी ॥ १८॥ ॐ क्रीं हूं पातु मे जानू महात्रिपुरभैरवी ।
    ॐ क्रीं ऐं सौः पातु मे जङ्घे बालाश्रीत्रिपुरेश्वरी ॥ १९॥ गुल्फौ मे क्रीं सदा पातु शिवशक्तिस्वरूपिणी
    । क्रीं ऐं सौः पातु मे पादौ पायाद् श्रीकुलसुन्दरी ॥ २०॥ भैं क्रीं हूं श्रीं सदा पातु पादाधः कुलशेखरा
    । ॐ क्रीं हूं श्रीं सदाव्यान्मे पादपृष्ठं महेश्वरी ॥ २१॥ क्रीं हूं श्रीं भैं वपु पायात् सर्वं मे भद्रकालिका
    । क्रीं ह्रीं ह्रीं पातु मां प्रातर्देवेन्द्री वज्रयोगिनी ॥ २२॥ हूं भैं मां पातु मध्यान्हे नित्यमेकादशाक्षरी
    । ॐ ऐं सौः पातु मां सायन्देवता परमेश्वरी ॥ २३॥ निशादौ क्रीं च मां पातु देवी श्रीषोडशाक्षरी । अर्धरात्रे
    च मां पातु क्रीं हूं भैं छिन्नमस्तका ॥ २४॥ निशावसान समये पातु मां क्रीं च पञ्चमी । पूर्वे मां पातु
    श्रीं ह्रीं क्लीं राज्ञी राज्यप्रदायिनी ॥ २५॥ ॐ ह्रीं हूं मां पश्चिमेव्यात्सर्वदा तत्त्वरूपिणी । ऐं
    सौः मां दक्षिणे पातु देवी दक्षिणकालिका ॥ २६॥ ऐं क्लीं मामुत्तरे पातु राजराजेश्वरी तथा । व्रजन्तं पातु
    मां श्रीं हूं तिष्ठन्तं क्रीं सदावतु ॥ २७॥ प्रबुधं हूं सदा पातु सुप्तं मां पातु सर्वदा । आग्नेये क्रीं
    सदा पातु नैरृत्ये हूं तथावतु ॥ २८॥ वायव्ये क्रीं सदा पायादैशान्यां भैं सदावतु । ऊर्ध्वं क्रीं मां
    सदा पातु ह्यधस्ता ह्रीं तथैवतु ॥ २९॥ चौरतोपाप्तिभीतिभ्यः पायान्मां श्रीं शिवेश्वरी । यक्षभूतपिशाचादि
    राक्षसेभ्योवतात्सदा ॥ ३०॥ ऐं क्लीं सौः हूं च मातङ्गीचोच्छिष्ठपदरूपिणी । दैत्यभूचरभीतिभ्योवताद् द्वाविंशदक्षरी
    ॥ ३१॥ विस्मारितं तु यत्स्थानं यत्स्थानं नामवर्जितम् । तत्सर्वं पातु मे नित्यं देवी भैं भद्रकालिका
    ॥ ३२॥ इतीदं कवचं देवि सर्वमन्त्रमयं परम् । जगत्मङ्गलनामेदं रहस्यं सर्व कामिकम् ॥ ३३॥ रहस्याति रहस्यं
    च गोप्यं गुप्ततरं कलौ । मन्त्रगर्भं च सर्वस्वं भद्रकाल्या मयास्मृतम् ॥ ३४॥ अदृष्टव्यमवक्तव्यं अदातव्यमवाचिकम्
    । अश्रोतव्यमिदं वर्म दीक्षाहीनाय पार्वति ॥ ३५॥ अभक्तेभ्योपिपुत्रेभ्यो दत्वा नरक माप्नुयात् । दातव्यमभक्तेभ्यो
    भक्तेभ्यो दीयते सदा ॥ ३६॥ महादारिद्र्य शमनं महामङ्गलवर्धनम् । भूर्जत्वचि लिखेद्देवि रोचना चन्दनेन
    च ॥ ३७॥ श्वेतसूत्रेण संवेष्ट्य धारयेन्मूर्ध्नि वा भुजे । मूर्ध्नि धृत्वा च कवचं त्रैलोक्यविजयं भवेत्
    ॥ ३८॥ भुजे धृत्वा रिपुञ्जित्वा रणे जयमवाप्नुयात् । इतीदं कवचं देवि मूलमन्त्रैक साधनम् ॥ ३९॥ गुह्यं
    गोप्यं परं पुण्यं गोपनीय स्वयोनिवत् । ॥ इति श्रीभैरवीतन्त्रे भद्रकालीकवचं सम्पूर्णम् ॥
