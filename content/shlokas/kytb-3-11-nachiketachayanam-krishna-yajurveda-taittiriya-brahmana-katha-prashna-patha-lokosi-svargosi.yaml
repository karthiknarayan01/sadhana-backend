id: kytb-3-11-nachiketachayanam-krishna-yajurveda-taittiriya-brahmana-katha-prashna-patha-lokosi-svargosi
category: stotram
name:
  english: KYTB 3.11 Nachiketachayanam - Krishna Yajurveda Taittiriya Brahmana Katha Prashna Patha - Lokosi
    Svargosi
content:
  english: krishna yajurvediya taittiriya brahmane kathake dvitiyah prashnah shri gurubhyo namah | harih
    om || anuvakam ishtakopadhanamantrah loko 'si | tapasah pratishtha | tvayidamantah | vishvam vi~shvagm
    subhutam | vishvasya bharta vishvasya janayita | tantvopadadhe kamadugha makshitam | prajapatistva
    sadayatu | taya devataya 'si loke shritam | tejasah pratishtha | tvayidamantah | vishvam vi~shvagm
    subhutam | vishvasya bhartri vishvasya janayitri | ta ttvopadadhe kamadugha makshitam | prajapatistva
    sadayatu | taya devataya 'si tapasi shritam | samudrasya pratishtha | tvayidamantah | vishvam vi~shvagm
    subhutam | vishvasya bhartrivishvasya janayitri | ta ttvopadadhe kamadugha makshitam | prajapatistva
    sadayatu | taya devataya 'si tejasi shritah | apa mpratishtha | tvayidamantah | vishvam vi~shvagm
    subhutam | vishvasya bharta vishvasya janayita | ta ntvopadadhe kamadugha makshitam | prajapatistva
    sadayatu | taya devataya || apah stha samudre shritah | prithivyah pratishtha yushmasu | idamantah
    | vishvam vi~shvagm subhutam | vishvasya bhartryo vishvasya janayitryah | ta va upadadhe kamadugha
    akshitah | prajapatistva sadayatu | taya devataya syaphsu shrita | agneh pratishtha | tvayidamantah
    | vishvam vi~shvagm subhutam | vishvasya bhartri vishvasya janayitri | ta ntvopadadhe kamadugha makshitam
    | prajapatistva sadayatu | taya devataya || agnirasi prithivyag shritah | antarikshasya pratishtha
    | tvayidamantah | vishvam vi~shvagm subhutam | vishvasya bharta vishvasya janayita | ta ntvopadadhe
    kamadugha makshitam | prajapatistva sadayatu | taya devataya masyagnau shritam | vayoh pratishtha
    | tvayidamantah | vishvam vi~shvagm subhutam | vishvasya bhartri vishvasya janayitri | ta ttvopadadhe
    kamadugha makshitam | prajapatistva sadayatu | taya devataya || vayurasyantarikshe shritah | divah
    pratishtha | tvayidamantah | vishvam vi~shvagm subhutam | vishvasya bharta vishvasya janayita | ta
    ntvopadadhe kamadugha makshitam | prajapatistva sadayatu | taya devataya || dyaurasi vayau shrita
    | adityasya pratishtha | tvayidamantah | vishvam vi~shvagm subhutam | vishvasya bhartri vishvasya
    janayitri | ta ntvopadadhe kamadugha makshitam | prajapatistva sadayatu | taya devataya 'si divi shritah
    | candramasah pratishtha | tvayidamantah | vishvam vi~shvagm subhutam | vishvasya bharta vishvasya
    janayita | ta ntvopadadhe kamadugha makshitam | prajapatistva sadayatu | taya devataya || candrama
    asyaditye shritah | nakshatrana mpratishtha | tvayidamantah | vishvam vi~shvagm subhutam | vishvasya
    bharta vishvasya janayita | ta ntvopadadhe kamadugha makshitam | prajapatistva sadayatu | taya devataya
    || nakshatrani stha candramasi shritani | sam va~thsarasya pratishtha yushmasu | idamantah | vishvam
    vi~shvagm subhutam | vishvasya bhartrini vishvasya janayitrini | tani va upadadhe kamadugha nyakshitani
    | prajapatistva sadayatu | taya devataya 'si nakshatreshu shritah | rituna mpratishtha | tvayidamantah
    | vishvam vi~shvagm subhutam | vishvasya bharta vishvasya janayita | ta ntvopadadhe kamadugha makshitam
    | prajapatistva sadayatu | taya devataya va~thsare shritah | masana mpratishtha yushmasu | idamantah
    | vishvam vi~shvagm subhutam | vishvasya bhartaro vishvasya janayitarah | tan nakshitan | prajapatistva
    sadayatu | taya devataya ssthartushu shritah | adrdhamasana mpratishtha yushmasu | idamantah | vishvam
    vi~shvagm subhutam | vishvasya bhartaro vishvasya janayitarah | tan nakshitan | prajapatistva sadayatu
    | taya devataya sstha masu shritah | ahoratrayoh pratishtha yushmasu | idamantah | vishvam vi~shvagm
    subhutam | vishvasya bhartaro vishvasya janayitarah | tan nakshitan | prajapatistva sadayatu | taya
    devataya 'drdhamaseshu shrite | bhutasya pratishthe bhavyasya pratishthe | yuvayo ridamantah | vishvam
    vi~shvagm subhutam | vishvasya bhartryau vishvasya janayitryau | te vamupadadhe kamadughe akshite
    | prajapatistva sadayatu | taya devataya || paurnamasyashtaka 'mavasya nnadugho yushmasu | idamantah
    | vishvam vi~shvagm subhutam | vishvasya bhartryo vishvasya janayitryah | ta va upadadhe kamadugha
    akshitah | prajapatistva sadayatu | taya devataya || radasi brihati shrirasindrapatni dharmapatni
    | vishva mbhutamanu prabhuta | tvayidamantah | vishvam vi~shvagm subhutam | vishvasya bhartri vishvasya
    janayitri | ta ntvopadadhe kamadugha makshitam | prajapatistva sadayatu | taya devataya 'si | balamasi
    bhrajo stapojah | tvayidamantah | vishvam vi~shvagm subhutam | vishvasya bharta vishvasya janayita
    | ta ntvopadadhe kamadugha makshitam | prajapatistva sadayatu | taya devataya 'si bharta tam | tapastejo
    'si bhartri tat | samudro 'si bharta tam | apah stha bhartryasta vah | prithivi bhartri tam | agnirasi
    bharta tam | antariksha mbhartri tat | vayurasi bharta tam | dyaurasi bhartri tam | adityashcandrama
    bharta tam | nakshatrani stha bhartrini tani vah | sam 'si bharta tam | ritavo masa adrdhamasa bhartarastan
    vah | ahoratre bhartryau te va m | paurnamasi bhartryasta vah | radasi bhartri tam | ojo 'si bharta
    tamekavigmshatih | anuvakam shcatasra ahutirjuhoti tvamagne rudro asuro maho divah | tvagm shardho
    maruta mpriksha ishishe | tvam va~tairarunairyasi shangayah | tva mpusha vidhatah pasi nu tmana |
    deva deveshu shrayaddhvam | prathama dvitiyeshu shrayaddhvam | dvitiya stritiyeshu shrayaddhvam |
    tritiya shcaturtheshu shrayaddhvam | caturthah pancameshu shrayaddhvam | pancama shshashtheshu shrayaddhvam
    || ssaptameshu shrayaddhvam | saptama ashtameshu shrayaddhvam | ashtama navameshu shrayaddhvam | navama
    dashameshu shrayaddhvam | dashama ekadasheshu shrayaddhvam | ekadasha dvadasheshu shrayaddhvam | dvadasha
    strayodasheshu shrayaddhvam | trayodasha shcaturdasheshu shrayaddhvam | caturdashah pancadasheshu
    shrayaddhvam | pancadasha shshodasheshu shrayaddhvam || ssaptadasheshu shrayaddhvam | saptadasha ashtadasheshu
    shrayaddhvam | ashtadasha ekannavigmsheshu shrayaddhvam | ekannavigmsha vigmsheshu shrayaddhvam |
    vigmsha ekavigmsheshu shrayaddhvam | ekavigmsha dvavigmsheshu shrayaddhvam | dvavigmsha strayovigmsheshu
    shrayaddhvam | trayovigmsha shcaturvigmsheshu shrayaddhvam | caturvigmshah pancavigmsheshu shrayaddhvam
    | pancavigmsha shshadvigmsheshu shrayaddhvam || ssaptavigmsheshu shrayaddhvam | saptavigmsha ashtavigmsheshu
    shrayaddhvam | ashtavigmsha ekannatrigmsheshu shrayaddhvam | ekannatrigmsha strigmsheshu shrayaddhvam
    | trigmsha ekatrigmsheshu shrayaddhvam | ekatrigmsha dva trigmsheshu shrayaddhvam | dvatrigmsha strayastrigmsheshu
    shrayaddhvam | deva kadasha stristrayastrigmshah | uttare bhavata | uttara vartmana uttara satvanah
    | yatkama ida njuhomi | tanme samriddhyatam | vayagg syama patayo rayinam | bhurbhuvasvah svaha shashtheshu
    shrayaddhavagm shodasheshu shrayaddhavagm shadvigmsheshu shrayaddhva muttarasatvanashcatvari ca shcatasra
    ahutirjuhoti agnavishnu sajoshasa | ima vardhantu vangirah | dyumnai rvajebhi ragatam | rajni virajni
    shshocih | tapo haro bhah | agni ssomo brihaspatih | vishve deva bhuvanasya gopah | te sarve sangatya
    | ida mme pravata vacah | vayagg syama patayo rayinam | bhu shcatasra ahutirjuhoti annapate 'nnasya
    no dehi | anamivasya shushminah | prapradatarantarishah | urja nno dhehi dvipade catushpade | agne
    prithivipate | soma virudha mpate | tvashtah samidha mpate | vishnavashana mpate | mitra satyana mpate
    | varuna dharmana mpatayah | rudra pashuna mpate | brihaspate brahmanaspate | a ruca roce svayam |
    ruca ruruce rocamanah | atityada ssvarabhareha | tasmin prajanau prajayeya | vayagg syama patayo rayinam
    | bhurbhuva shcatasra ahutirjuhoti sapta te agne samidhah sapta jihvah | saptar ssaptadhama priyani
    | sapta hotra anu vidvan | sapta yoni raprinasva ghritena | praci dik | agni rdevata mricchatu | yo
    maitasyai disho 'bhidasati | dakshina dik | indro devata || indragm sa disha mricchatu | yo maitasyai
    disho 'bhidasati | pratici dik | somo devata mricchatu | yo maitasyai disho 'bhidasati | udici dik
    | mitravarunau devata | mitravarunau sa disha mricchatu | yo maitasyai disho 'bhidasati || || udrdhva
    dik | brihaspati rdevata | brihaspatigm sa disha mricchatu | yo maitasyai disho 'bhidasati | iyandik
    | aditi rdevata | aditigm sa disha mricchatu | yo maitasyai disho 'bhidasati | purusho dik | purusho
    me kama || andho jagrivih prana | asavehi | badhira a rapana | asavehi | ushasa mashiya | ahamaso
    jyotirashiya | ahamaso 'poshiya | vayagg syama patayo rayinam | bhurbhuva dakshina digindro devata
    mitravarunau sa disha ndevau devatanamricchatu yo maitasyai disho ya~du citante agne | yatta unam
    'tiriktam | adityasta shcinvantu | vishve te devashciti mapurayantu | citashcasi sancitashca syagne
    | etavagshcasi bhuyagshcasyagne || loka mprina | atho sida shiva tvam | indragni tva brihaspatih |
    asmin ddhruva sida || ta asya sudadohasah | somagg shrinanti prishnayah | janma vi~shah | trishva
    rocane divah | taya devataya ddhruva sida || agne devagm ihavaha | jajnano vrikta bar hishe | asi
    hota na idyah || aganma maha manasa yavishtham || || yo didaya samiddha ssve durone | citrabhanu rodasi
    antarurvi | svahutam vi~shvatah pratyanca vi~dathasya prasadhanam | agnigm hotara mmatim | tvamarbhasya
    havishah samanamit | tva mmaho vrinate naro nanyan tvat || manushvattva nidhimahi | manushva thsamidhimahi
    | agne manushva ndevayate yaja || agnir vi~she | dadati vishvacar shanih | agni raye svabhuva m |
    sa prito yati varya m | ishagg stotribhya abhara || prishto divi prishto agnih prithivyam | prishto
    vishva oshadhi ravivesha | vaishvanara ssahasa prishto agnih | sa no diva sa rishah patu nakta ntatra
    agnidevatopasanam ayam 'gni narciketah | sa ya mpavate | tadasya shirah | atha ya ddakshina | sa dakshinah
    pakshah | atha ya m | ya dudann | sa uttarah pakshah || va~ti | tadasya samancana nca | atho sapandevasya
    sa || sagm ha va asmai sa kamah padyate | ya ncinute | ya u caina ve~da || yo ha va agne rnaciketasyayatana
    nbhavati | gacchati pratishtham || va~ agne rnaciketasyayatana mpratishtha | ya evam nbhavati | gacchati
    pratishtham || yo ha va agne rnaciketasya shariram ve~da | sa sharira eva svargam lo~kameti | hiranyam
    va~ agne rnaciketasya shariram | ya evam ve~da | sa sharira eva svargam lo~kameti || atho yatha rukma
    ut || evameva sa tejasa yashasa | asmigg 'mushmiggshca bhati || uravo ha vai namaite lokah | ye 'varenadityam
    | atha haite variyagmso lokah | ye parenadityam | antavantagm ha va esha kshayyam 'varenadityam |
    atha haisho njayati | yah parenadityam || || anantagm ha va apara ncinute | ya u caina ve~da || atho
    yatha rathe tishtha mahoratre pratyape ncinute | ya u caina naciketopakhyanam ushan ndadau | tasya
    ha naciketa nama putra asa | tagm ha kumaragm santa m | dakshinasu niyamanasu shraddha ''vivesha |
    sa hovaca | tata kasmai ma syasiti | dvitiya m || tagm ha parita uvaca | mrityave tva dadamiti ||
    tagm ha smotthitam || gautama kumaramiti | sa hovaca | parehi mrityo rgrihan | mrityave vai tva ngantasiti
    hovaca | tasya sma tisro ratri ngrihe vasatat | sa yadi tva pricchet | kumara kati ratri riti | tisra
    iti prati brutat | ki mprathamagm ratri miti | sadhukritya njagama | tasya ha tisro ratri ngriha uvasa
    | tamagatya papraccha | kumara kati ratri riti | tisra iti pratyuvaca || mprathamagm ratri mashna
    iti | praja miti | sadhukritya nta iti || namaste astu bhagava iti hovaca | varam vri~nishveti ||
    pitarameva jivannayaniti || dvitiyam || ishtapurtayo rme 'kshiti mbruhiti hovaca | tasmai haitamagni
    muvaca | tato vai tasye shtapurte na kshiyete || nasye purte kshiyete | yo ncinute | ya u caina vri~nishveti
    | puna mrirtyo rme 'pajiti mbruhiti hovaca | tasmai haitamagni ncinute || ya u caina ve~da || prajapati
    rvai prajakama dagnau prasyat | ta dasmai nacchadayat | ta dasmai nai vacchadayat | ta dasmai nai
    vacchadayat | ta shvanare prasyat | ta dasma acchadayat | tasmaddhiranya tpriyatamam | hridayajagm
    hi | sa vai tameva navindat | yasmai ta svayaiva hastaya dakshinayanayat | ta || dakshaya tva dakshina
    mpratigrihnamiti | so 'dakshata dakshina mpratigrihya | dakshate ha vai dakshina mpratigrihya | ya
    evam ve~da || etaddha sma vai ta dvidvagmso vajashravasa gotamah | apyanudeshya mpratigrihnanti |
    ubhayena vaya ndakshishyamaha eva dakshina mpratigrihyeti | te 'dakshanta dakshina mpratigrihya |
    dakshate ha vai dakshina mpratigrihya | ya evam cayanaprayogah tagm haita meke pashubandha evottaravedya
    ncinvate | uttaravedisammita esho 'gniriti vadantah | tanna tatha kuryat | eta nkamena vyardhayet
    | sa ena nkamena vyriddhah | kamena vyardhayet | saumye vavai namadhvare cinvita | yatra va bhuyishtha
    ahutayo huyerann | eta nkamena samardhayati | sa ena nkamena samriddhah || || kamena samardhayati
    || atha haina shayah | uttaravedya macinvata | tato vai te 'vindanta prajam | abhi svargam majayann
    | vindata eva pajam | abhi svargam ncinute | ya u caina mevopadadhe | tato vai sa eta madrdhnot |
    yamidam mriddhnoti | yamidam ncinute | ya u caina shnah pashukamah | panktameva cikye | panca purasta
    || panca dakshinatah | panca pashcat | panco ncinute | ya u caina mprajapati rjyaishthyakamo yashaskamah
    prajananakamah | trivritameva cikye || t | tisro dakshinatah | sapta pashcat | tisra uttaratah | eka
    | tato vai sa pra yasho jyaishthya mprajayata | yamida mprajah prajayante | trivri m | mata pita putrah
    || tprajananam | upastho yoni rmaddhyama | prayasho jyaishthya mprajayate | yamida mprajah prajayante
    | yo ncinute | ya u cainamevam mindro jyaishthyakamah | udrdhva evopadadhe | tato vai sa jyaishthya
    ncinute | ya u caina ssvargakamah | pracirevopadadhe | tato vai so majayat | abhi svargam ncinute
    | ya u caina ve~da || sa yadicchet || || tejasvi yashasvi brahmavarcasi syamiti | prama hoturdhishnya
    dyashasvati | sa ma prornotu | tejasa yashasa brahmavarcaseneti | tejasvyeva yashasvi brahmavarcasi
    bhavati || atha yadicchet | bhuyishtha mme shraddadhirann | bhuyishtha dakshina nayeyuriti | dakshinasu
    niyamanasu pracyehi pracyehiti praci jushana vetvajyasya svaheti sruveno pahatya havaniye juhuyat
    || mevasmai shraddadhate | bhuyishtha dakshina nayanti || purisha mpraniyopasamadhaya | catasra eta
    ahuti rjuhoti | tvamagne rudra iti shatarudriyasya rupam | agna vishnu iti vasodrdharayah | annapata
    ityanna homah | sapta te agne samidhah sapta jihva iti vishvaprih || mprajapati strivridindro 'savaditya
    mabhi jayati | atho ya asmin ~loke devatah | tasagm sayujyagm salokata mupadadhati | antarikshaloka
    'bhi jayati | atho ya antariksha loke devatah | tasagm sayujyagm salokata || atho ya amushmin ~loke
    devatah | tasagm sayujyagm salokata mapnoti | atho ya amuritara ashtadasha | ya evami uravashca variyagmsashca
    lokah | taneva tabhi rabhijayati || kamacaro ha va asyorushu ca variyassu ca lokeshu bhavati | yo
    ncinute | ya u caina va~thsaro va agni narciketah | tasya vasanta || grishmo dakshinah pakshah | varsha
    uttarah | shara karmakarah | ahoratre shatarudriya m | parjanyo vasodrdhara vri~shtva | prajabhya
    meva sa tasya sarvan kaman va~thsaro va agni rnaciketah | tasya vasanta shshirah | grishmo dakshinah
    pakshah | varshah puccha m | sharaduttarah pakshah | hemanto maddhya m | purvapakshashcitayah | aparapakshah
    purisham | ahoratranishtakah | esha vava so ragnimayah punarnavah | agnimayo ha vai punarnavo bhutva
    | svargam meti | adityasya sayujyam | yo ncinute | ya u caina ntaya lokamabhijayati grishmo dvishashtih
    || harih om || || taittariya yajubrahmane kathake dvitiyah prashna
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय ब्राह्मणे काठके द्वितीयः प्रश्नः श्री गुरुभ्यो नमः । ह॒रिः॒ ओम्
    ॥ अनुवाकं इष्टकोपधानमन्त्राः लो॒को॑ ऽसि । तप॑सः प्रति॒ष्ठा । त्वयी॒दम॒न्तः । विश्वं॑ विँश्वग्ं॑ सुभू॒तम्
    । विश्व॑स्य भ॒र्ता विश्व॑स्य जनयि॒ता । तन्त्वोप॑दधे काम॒दुघ॒ मक्षि॑तम् । प्र॒जाप॑तिस्त्वा सादयतु ।
    तया॑ दे॒वत॑या ऽसि लो॒के श्रि॒तम् । तेज॑सः प्रति॒ष्ठा । त्वयी॒दम॒न्तः । विश्वं॑ विँश्वग्ं॑ सुभू॒तम्
    । विश्व॑स्य भ॒र्तृ विश्व॑स्य जनयि॒तृ । त त्त्वोप॑दधे काम॒दुघ॒ मक्षि॑तम् । प्र॒जाप॑तिस्त्वा सादयतु
    । तया॑ दे॒वत॑या ऽसि॒ तप॑सि श्रि॒तम् । स॒मु॒द्रस्य॑ प्रति॒ष्ठा । त्वयी॒दम॒न्तः । विश्वं॑ विँश्वग्ं॑
    सुभू॒तम् । विश्व॑स्य भ॒र्तृविश्व॑स्य जनयि॒तृ । त त्त्वोप॑दधे काम॒दुघ॒ मक्षि॑तम् । प्र॒जाप॑तिस्त्वा
    सादयतु । तया॑ दे॒वत॑या ऽसि॒ तेज॑सि श्रि॒तः । अ॒पा म्प्र॑ति॒ष्ठा । त्वयी॒दम॒न्तः । विश्वं॑ विँश्वग्ं॑
    सुभू॒तम् । विश्व॑स्य भ॒र्ता विश्व॑स्य जनयि॒ता । त न्त्वोप॑दधे काम॒दुघ॒ मक्षि॑तम् । प्र॒जाप॑तिस्त्वा
