id: lakshmidvadashanamastotram
category: hridaya
name:
  english: lakshmidvadashanamastotram
  devanagari: लक्ष्मीद्वादशनामस्तोत्रम्
content:
  english: shrilakshmi dvadashanamastotram athava shribhadralakshmistavam shritulakaverimahatmye dvavimshe'dhyaye
    shrikrishnena arjunayopadishtam lakshmihridayastotram | shridevi prathamam nama dvitiyam amritodbhava
    | tritiyam kamala prokta caturtham candrashobhana || 1||
  devanagari: श्रीलक्ष्मी द्वादशनामस्तोत्रम् अथवा श्रीभद्रलक्ष्मीस्तवम् श्रीतुलाकावेरीमाहात्म्ये द्वाविंशेऽध्याये
    श्रीकृष्णेन अर्जुनायोपदिष्टं लक्ष्मीहृदयस्तोत्रम् । श्रीदेवी प्रथमं नाम द्वितीयं अमृतोद्भवा । तृतीयं
    कमला प्रोक्ता चतुर्थं चन्द्रशोभना ॥ १॥
meaning: {}
