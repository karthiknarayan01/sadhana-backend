id: kumarabhujangaprayatastotram
category: stotram
name:
  english: kumarabhujangaprayatastotram
  devanagari: कुमारभुजन्गप्रयातस्तोत्रम्
content:
  english: na cette'pakirtih atah svaminam svam bhajamo dhunimo bhavamo'dya bhaktah || 36|| dvishadbahudandam
    dvishatcarugandam dvishatkarnashandam trishannetratundam | hatakrauncagotram dhritabrahmasutram bhavapritipatram
    bhajamah sugatram || 37|| prasida prasida prabho tarakare prasida prasida bhavamo nirihah | prapanna
    vipannah pura tara khinnah bhavamo'dya bhinnastvaya duhkhanunnah || 38|| kimartham surartham krita
    nanukampa nilimpah pura taraduhkhabhikampah | bhavatpadamoda prabhavaddhi saudhe vasamo vishamah pramodorusindhum
    || 39|| uronyastaharam shironyastahiram dayasindhupuram shivajnanasaram | parabhutataram bhavambhodhiparam
    sura jalasauram bhajamah kumaram || 40|| gurunam gurum devasenasametam paresham param kekiyanena yantam
    | katakshardhapatam kurushvadya bhadram onkaramudram bhajamo'stanidram || 41|| shatangam vihangam
    kritaratibhangam sudhicitrarangam mahapapabhangam | kuje premabhajam bhuje sarparajam samajadhipam
    tvam bhajamo natajam || 42|| namaste namaste shivapremamurte namaste namaste trayigitakirte | namaste
    namaste hritatraidasharte namaste namaste surabhishtapurte || 43|| suranam purastadyadi tvatpadabjam
    samastapadasta nirasta bhaveyuh | karastha vimuktirhridistha subhaktih shivastheshabhaktirbhavetsatyametat
    || 44|| kvacidbhutasangam kvacitpretasangam kvacidvyadhisangam kvaciddhatusangam | kvacitkshudra punkhanupunkhaprasangam
    samuccatayantam bhajamo guham tam || 45|| bhavaneva pata bhavaneva neta bhavaneva data bhavan duhkhaharta
    | iti tvatkataksham pratikshya''vasama sahasvaparadham kripaparasindho || 46|| na manyamahe tvatpadabjatsudhanyam
    nacanyam bhajamo na canyam namamah | tvaya palaniya vayam palakatvam samastam suranam tavaste va haste
    || 47|| tvamevasya karta tvamevasya dharta tvamevasya bharta tvadanyam na yamah | bhavambhodhimagna
    dayambhonidhe nah samuddhartumarhasyato'pyarhaniyah || 48|| balare kiritam grihanacyutemam grihanatapatram
    vidhe harajalam | iti praudhavacam vadantam nivesham jananya vishantam bhajamo'nuyamah || 49|| bhavatpadato'nyannahi
    prarthayamah bhave bhaktito'nyat kvacinnarthayamah | tvaya shikshaniya utarakshaniya tvayopekshaniya
    na va mokshaniya || 50|| pita tvam gurustvam ca mata ca nityam kshudharta bhavartiprapannah sma dinah
    | katakshavaloke'pyupeksha yadisya
  devanagari: न चेत्तेऽपकीर्तिः अतः स्वामिनं स्वं भजामो धुनीमो भवामोऽद्य भक्ताः ॥ ३६॥ द्विषड्बाहुदण्डं
    द्विषट्चारुगण्डं द्विषट्कर्णषण्डं त्रिषण्णेत्रतुण्डम् । हतक्रौञ्चगोत्रं धृतब्रह्मसूत्रं भवप्रीतिपात्रं
    भजामः सुगात्रम् ॥ ३७॥ प्रसीद प्रसीद प्रभो तारकारे प्रसीद प्रसीद भवामो निरीहाः । प्रपन्ना विपन्नाः
    पुरा तार खिन्नाः भवामोऽद्य भिन्नास्त्वया दुःखनुन्नाः ॥ ३८॥ किमर्थं सुरार्थं कृता नानुकम्पा निलिम्पाः
    पुरा तारदुःखाभिकम्पाः । भवत्पादमोद प्रभावाद्धि सौधे वसामो विशामः प्रमोदोरुसिन्धुम् ॥ ३९॥ उरोन्यस्तहारं
    शिरोन्यस्तहीरं दयासिन्धुपूरं शिवज्ञानसारम् । पराभूततारं भवाम्भोधिपारं सुरा जालसौरं भजामः कुमारम् ॥
    ४०॥ गुरूणां गुरुं देवसेनासमेतं परेषां परं केकियानेन यान्तम् । कटाक्षार्धपातं कुरुष्वाद्य भद्रं ओङ्कारमुद्रं
    भजामोऽस्तनिद्रम् ॥ ४१॥ शताङ्गं विहङ्गं कृतारातिभङ्गं सुधीचित्ररङ्गं महापापभङ्गम् । कुजे प्रेमभाजं
    भुजे सर्पराजं समाजाधिपं त्वां भजामो नताजम् ॥ ४२॥ नमस्ते नमस्ते शिवप्रेममूर्ते नमस्ते नमस्ते त्रयीगीतकीर्ते
    । नमस्ते नमस्ते हृतत्रैदशार्ते नमस्ते नमस्ते सुराभीष्टपूर्ते ॥ ४३॥ सुराणां पुरस्ताद्यदि त्वत्पदाब्जं
    समस्तापदस्ता निरस्ता भवेयुः । करस्था विमुक्तिर्हृदिस्था सुभक्तिः शिवस्थेशभक्तिर्भवेत्सत्यमेतत् ॥ ४४॥
    क्वचिद्भूतसङ्गं क्वचित्प्रेतसङ्गं क्वचिद्व्याधिसङ्गं क्वचिद्धातुसङ्गम् । क्वचित्क्षुद्र पुङ्खानुपुङ्खप्रसङ्गं
    समुच्चाटयन्तं भजामो गुहं तम् ॥ ४५॥ भवानेव पाता भवानेव नेता भवानेव दाता भवान् दुःखहर्ता । इति त्वत्कटाक्षं
    प्रतीक्ष्याऽऽवसाम सहस्वापराधं कृपापारसिन्धो ॥ ४६॥ न मन्यामहे त्वत्पदाब्जात्सुधन्यं नचान्यं भजामो न
    चान्यं नमामः । त्वया पालनीया वयं पालकत्वं समस्तं सुराणां तवास्ते व हस्ते ॥ ४७॥ त्वमेवास्य कर्ता त्वमेवास्य
    धर्ता त्वमेवास्य भर्ता त्वदन्यं न यामः । भवाम्भोधिमग्ना दयाम्भोनिधे नः समुद्धर्तुमर्हस्यतोऽप्यर्हणीयः
    ॥ ४८॥ बलारे किरीटं गृहाणाच्युतेमं गृहाणातपत्रं विधे हारजलम् । इति प्रौढवाचं वदन्तं निवेशं जनन्या विशन्तं
    भजामोऽनुयामः ॥ ४९॥ भवत्पादतोऽन्यन्नहि प्रार्थयामः भवे भक्तितोऽन्यत् क्वचिन्नार्थयामः । त्वया शिक्षणीया
    उतारक्षणीया त्वयोपेक्षणीया न वा मोक्षणीया ॥ ५०॥ पिता त्वं गुरुस्त्वं च माता च नित्यं क्षुधार्ता भवर्तिप्रपन्नाः
    स्म दीनाः । कटाक्षावलोकेऽप्युपेक्षा यदिस्या
