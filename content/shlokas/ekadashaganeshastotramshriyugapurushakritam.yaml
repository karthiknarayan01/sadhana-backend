id: ekadashaganeshastotramshriyugapurushakritam
category: stotram
name:
  english: ekadashaganeshastotramshriyugapurushakritam
  devanagari: एकादशगणेशस्तोत्रम्श्रीयुगपुरुषाकृतं
content:
  english: shriyugapurushakritam ekadashaganeshastotram || shriganeshaya namah || yugapurusha ucuh | ganeshaya
    namastubhyam bhaktasamrakshakaya ca | nanarupabhrite tubhyam herambaya namo namah || 30|| bhaktebhyah
    sarvadayaivabhaktanam nashanaya ca | pareshaya paranam te paraya ca namo namah || 31|| svanandavasine
    tubhyam nanamayapracarine | sada svanadambhogastha palakaya namo namah || 32|| ameyashaktaye tubhyam
    nanamayapraharine | mayibhyo mohadatre vai mayine te namo namah || 33|| lambodaraya lokanamudarasthaya
    te namah | ekadantaya shurpakarakarnaya namo namah || 34|| trinetraya gajakaravaktraya paramatmane
    | caturbhujaya sarveshamadipujyaya vai namah || 35|| devaya devarupaya devadevaya te namah | devadeveshakayaiva
    vighneshaya namo namah || 36|| sarvesham jyeshtharupaya matre pitre namo namah | satatam sarvapujyaya
    brahmanishthaya te namah || 37|| brahmane brahmanam natha brahmabhuyapradaya ca | brahmabhyo brahmadatre
    te shantisthaya namo namah || 38|| kim stumastvam ganeshana yatra vedah shivadayah | yogarupa bhavanti
    sma tataste namanam shubham || 39|| evamuktva pranemuste yuga ganapatim dvija | sa tanuvaca pritatma
    bhaktavatsalyayantritah || 40||
  devanagari: श्रीयुगपुरुषाकृतं एकादशगणेशस्तोत्रम् ॥ श्रीगणेशाय नमः ॥ युगपुरुषा ऊचुः । गणेशाय नमस्तुभ्यं
    भक्तसंरक्षकाय च । नानारूपभृते तुभ्यं हेरम्बाय नमो नमः ॥ ३०॥ भक्तेभ्यः सर्वदायैवाभक्तानां नाशनाय च
    । परेशाय पराणां ते पराय च नमो नमः ॥ ३१॥ स्वानन्दवासिने तुभ्यं नानामायाप्रचारिणे । सदा स्वानदम्भोगस्थ
    पालकाय नमो नमः ॥ ३२॥ अमेयशक्तये तुभ्यं नानामायाप्रहारिणे । मायिभ्यो मोहदात्रे वै मायिने ते नमो नमः
    ॥ ३३॥ लम्बोदराय लोकानामुदरस्थाय ते नमः । एकदन्ताय शूर्पाकारकर्णाय नमो नमः ॥ ३४॥ त्रिनेत्राय गजाकारवक्त्राय
    परमात्मने । चतुर्भुजाय सर्वेषामादिपूज्याय वै नमः ॥ ३५॥ देवाय देवरूपाय देवदेवाय ते नमः । देवदेवेशकायैव
    विघ्नेशाय नमो नमः ॥ ३६॥ सर्वेषां ज्येष्ठरूपाय मात्रे पित्रे नमो नमः । सततं सर्वपूज्याय ब्रह्मनिष्ठाय
    ते नमः ॥ ३७॥ ब्रह्मणे ब्रह्मणां नाथ ब्रह्मभूयप्रदाय च । ब्रह्मभ्यो ब्रह्मदात्रे ते शान्तिस्थाय नमो
    नमाः ॥ ३८॥ किं स्तुमस्त्वां गणेशान यत्र वेदाः शिवादयः । योगरूपा भवन्ति स्म ततस्ते नमनं शुभम् ॥ ३९॥
    एवमुक्त्वा प्रणेमुस्ते युगा गणपतिं द्विज । स तानुवाच प्रीतात्मा भक्तवात्सल्ययन्त्रितः ॥ ४०॥
