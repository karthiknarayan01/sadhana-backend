id: vedantastotrani
category: stotram
name:
  english: vedantastotrani
  devanagari: वेदान्तस्तोत्राणि
content:
  english: atmashatkam kaupinapancakam carpatapanjarika dhanyashtakam nirvanapancakam nirvanadashakam
    parapuja brahmajnanavali maniratnamala manishapancakam dvadashapanjarika
  devanagari: आत्मषट्कम् कौपीनपञ्चकम् चर्पटपञ्जरिका धन्याष्टकम् निर्वाणपञ्चकम् निर्वाणदशकम् परापूजा ब्रह्मज्ञानावली
    मणिरत्नमाला मनीषापञ्चकम् द्वादशपञ्जरिका
meaning: {}
