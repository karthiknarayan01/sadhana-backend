id: nandabhupatikritamvarahastotram-08
category: stotram
name:
  english: nandabhupatikritamvarahastotram 08
  devanagari: नन्दभूपतिकृतंवराहस्तोत्रम् ०८
content:
  english: nandabhupatikritam varahastotram 8 tada''kashe vimanena bhramata nandabhubhrita | varahantu
    mahadrupam drishtam brahmandanayakam || 6|| avatirya vimanat sah stutim tasya'karottada | namo'nantasvarupaya
    purushottamanamine || 7|| svaloka'vanasankartre dharitryah pataye namah | sarvatattvanivasaya'ksharadhishaya
    te namah || 8|| krishnanarayanaya'stu namaskarastu me punah | tvaya prithvi kripaya'dya rakshita rakshita
    vayam || 9|| anadharashca rajanah prajashca'pyavitah prabho
  devanagari: नन्दभूपतिकृतं वराहस्तोत्रम् ८ तदाऽऽकाशे विमानेन भ्रमता नन्दभूभृता । वाराहन्तु महद्रूपं दृष्टं
    ब्रह्माण्डनायकम् ॥ ६॥ अवतीर्य विमानात् सः स्तुतिं तस्याऽकरोत्तदा । नमोऽनन्तस्वरूपाय पुरुषोत्तमनामिने
    ॥ ७॥ स्वलोकाऽवनसङ्कर्त्रे धरित्र्याः पतये नमः । सर्वतत्त्वनिवासायाऽक्षराधीशाय ते नमः ॥ ८॥ कृष्णनारायणायाऽस्तु
    नमस्कारस्तु मे पुनः । त्वया पृथ्वी कृपयाऽद्य रक्षिता रक्षिता वयम् ॥ ९॥ अनाधाराश्च राजानः प्रजाश्चाऽप्यविताः
    प्रभो
meaning: {}
