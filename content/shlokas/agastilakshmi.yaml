id: agastilakshmi
category: stotram
name:
  english: agastilakshmi
  devanagari: अगस्तिलक्ष्मी
content:
  english: shrilakshmistotram agastyaracitam jaya padmapalashakshi jaya tvam shripatipriye | jaya matarmahalakshmi
    samsararnavatarini || 1|| mahalakshmi namastubhyam namastubhyam sureshvari | haripriye namastubhyam
    namastubhyam dayanidhe || 2|| padmalaye namastubhyam namastubhyam ca sarvade | sarvabhutahitarthaya
    vasuvrishtim sada kuru || 3|| jaganmatarnamastubhyam namastubhyam dayanidhe | dayavati namastubhyam
    vishveshvari namo'stu te || 4|| namah kshirarnavasute namastrailokyadharini | vasuvrishte namastubhyam
    raksha mam sharanagatam || 5|| raksha tvam devadeveshi devadevasya vallabhe | daridrattrahi mam lakshmi
    kripam kuru mamopari || 6|| namastrailokyajanani namastrailokyapavani | brahmadayo namaste tvam jagadanandadayini
    || 7|| vishnupriye namastubhyam namastubhyam jagaddhite | artahantri namastubhyam samriddhim kuru
    me sada || 8|| abjavase namastubhyam capalayai namo namah | cancalayai namastubhyam lalitayai namo
    namah || 9|| namah pradyumnajanani matustubhyam namo namah | paripalaya bho matarmam tubhyam sharanagatam
    || 10|| sharanye tvam prapanno'smi kamale kamalalaye | trahi trahi mahalakshmi paritranaparayane ||
    11|| pandityam shobhate naiva na shobhanti guna nare | shilatvam naiva shobheta mahalakshmi tvaya
    vina || 12|| tavadvirajate rupam tavacchilam virajate | tavadguna naranam ca yavallakshmih prasidati
    || 13|| lakshmitvayalankritamanava ye papairvimukta nripalokamanyah | gunairvihina gunino bhavanti
    dushilinah shilavatam varishthah || 14|| lakshmirbhushayate rupam lakshmirbhushayate kulam | lakshmirbhushayate
    vidyam sarvallakshmirvishishyate || 15|| lakshmi tvadgunakirtanena kamalabhuryatyalam jihvatam rudradya
    ravicandradevapatayo vaktum ca naiva kshamah | asmabhistava rupalakshanagunanvaktum katham shakyate
    matarmam paripahi vishvajanani kritva mameshtam dhruvam || 16|| dinartibhitam bhavatapapiditam dhanairvihinam
    tava parshvamagatam | kripanidhitvanmama lakshmi satvaram dhanapradanaddhannayakam kuru || 17|| mam
    vilokya janani haripriye | nirdhanam tvatsamipamagatam || dehi me jhatiti lakshmi | karagram vastrakancanavarannamadbhutam
    || 18|| tvameva janani lakshmi pita lakshmi tvameva ca | bhrata tvam ca sakha lakshmi vidya lakshmi
    tvameva ca || 19|| trahi trahi mahalakshmi trahi trahi sureshvari | trahi trahi jaganmatardaridrattrahi
    vegatah || 20|| namastubhyam jagaddhatri namastubhyam namo namah | dharmadhare namastubhyam namah
    sampattidayini || 21|| daridrarnavamagno'ham nimagno'ham rasatale | majjantam mam kare dhritva suddhara
    tvam rame drutam || 22|| kim lakshmi bahunoktena jalpitena punah punah | anyanme sharanam nasti satyam
    satyam haripriye || 23|| etacshrutva'gastivakyam hrishyamana haripriya | uvaca madhuram vanim tushtaham
    tava sarvada || 24|| lakshmiruvaca | yattvayoktamidam stotram yah pathishyati manavah | sha
  devanagari: श्रीलक्ष्मीस्तोत्रं अगस्त्यरचितम् जय पद्मपलाशाक्षि जय त्वं श्रीपतिप्रिये । जय मातर्महालक्ष्मि
    संसारार्णवतारिणि ॥ १॥ महालक्ष्मि नमस्तुभ्यं नमस्तुभ्यं सुरेश्वरि । हरिप्रिये नमस्तुभ्यं नमस्तुभ्यं
    दयानिधे ॥ २॥ पद्मालये नमस्तुभ्यं नमस्तुभ्यं च सर्वदे । सर्वभूतहितार्थाय वसुवृष्टिं सदा कुरु ॥ ३॥ जगन्मातर्नमस्तुभ्यं
    नमस्तुभ्यं दयानिधे । दयावति नमस्तुभ्यं विश्वेश्वरि नमोऽस्तु ते ॥ ४॥ नमः क्षीरार्णवसुते नमस्त्रैलोक्यधारिणि
    । वसुवृष्टे नमस्तुभ्यं रक्ष मां शरणागतं ॥ ५॥ रक्ष त्वं देवदेवेशि देवदेवस्य वल्लभे । दरिद्रात्त्राहि
    मां लक्ष्मि कृपां कुरु ममोपरि ॥ ६॥ नमस्त्रैलोक्यजननि नमस्त्रैलोक्यपावनि । ब्रह्मादयो नमस्ते त्वां
    जगदानन्ददायिनि ॥ ७॥ विष्णुप्रिये नमस्तुभ्यं नमस्तुभ्यं जगद्धिते । आर्तहन्त्रि नमस्तुभ्यं समृद्धिं
    कुरु मे सदा ॥ ८॥ अब्जवासे नमस्तुभ्यं चपलायै नमो नमः । चञ्चलायै नमस्तुभ्यं ललितायै नमो नमः ॥ ९॥ नमः
    प्रद्युम्नजननि मातुस्तुभ्यं नमो नमः । परिपालय भो मातर्मां तुभ्यं शरणागतं ॥ १०॥ शरण्ये त्वां प्रपन्नोऽस्मि
    कमले कमलालये । त्राहि त्राहि महालक्ष्मि परित्राणपरायणे ॥ ११॥ पाण्डित्यं शोभते नैव न शोभन्ति गुणा नरे
    । शीलत्वं नैव शोभेत महालक्ष्मि त्वया विना ॥ १२॥ तावद्विराजते रूपं तावच्छीलं विराजते । तावद्गुणा नराणां
    च यावल्लक्ष्मीः प्रसीदति ॥ १३॥ लक्ष्मित्वयालङ्कृतमानवा ये पापैर्विमुक्ता नृपलोकमान्याः । गुणैर्विहीना
    गुणिनो भवन्ति दुशीलिनः शीलवतां वरिष्ठाः ॥ १४॥ लक्ष्मीर्भूषयते रूपं लक्ष्मीर्भूषयते कुलं । लक्ष्मीर्भूषयते
    विद्यां सर्वाल्लक्ष्मीर्विशिष्यते ॥ १५॥ लक्ष्मि त्वद्गुणकीर्तनेन कमलाभूर्यात्यलं जिह्वतां रुद्राद्या
    रविचन्द्रदेवपतयो वक्तुं च नैव क्षमाः । अस्माभिस्तव रूपलक्षणगुणान्वक्तुं कथं शक्यते मातर्मां परिपाहि
    विश्वजननि कृत्वा ममेष्टं ध्रुवं ॥ १६॥ दीनार्तिभीतं भवतापपीडितं धनैर्विहीनं तव पार्श्वमागतं । कृपानिधित्वान्मम
    लक्ष्मि सत्वरं धनप्रदानाद्धन्नायकं कुरु ॥ १७॥ मां विलोक्य जननि हरिप्रिये । निर्धनं त्वत्समीपमागतं
    ॥ देहि मे झटिति लक्ष्मि । कराग्रं वस्त्रकाञ्चनवरान्नमद्भुतं ॥ १८॥ त्वमेव जननी लक्ष्मि पिता लक्ष्मि
    त्वमेव च । भ्राता त्वं च सखा लक्ष्मि विद्या लक्ष्मि त्वमेव च ॥ १९॥ त्राहि त्राहि महालक्ष्मि त्राहि
    त्राहि सुरेश्वरि । त्राहि त्राहि जगन्मातर्दरिद्रात्त्राहि वेगतः ॥ २०॥ नमस्तुभ्यं जगद्धात्रि नमस्तुभ्यं
    नमो नमः । धर्माधारे नमस्तुभ्यं नमः सम्पत्तिदायिनी ॥ २१॥ दरिद्रार्णवमग्नोऽहं निमग्नोऽहं रसातले । मज्जन्तं
    मां करे धृत्वा सूद्धर त्वं रमे द्रुतं ॥ २२॥ किं लक्ष्मि बहुनोक्तेन जल्पितेन पुनः पुनः । अन्यन्मे शरणं
    नास्ति सत्यं सत्यं हरिप्रिये ॥ २३॥ एतच्श्रुत्वाऽगस्तिवाक्यं हृष्यमाण हरिप्रिया । उवाच मधुरां वाणीं
    तुष्टाहं तव सर्वदा ॥ २४॥ लक्ष्मीरुवाच । यत्त्वयोक्तमिदं स्तोत्रं यः पठिष्यति मानवः । श
