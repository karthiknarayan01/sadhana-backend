id: guhyaucchishtaganeshapurvapithikaphalashrutih
category: sahasranama
name:
  english: guhyaucchishtaganeshapurvapithikaphalashrutih
  devanagari: गुह्यौच्छिष्टगणेशपूर्वपीठिकाफलश्रुतिः
content:
  english: dhyati || 16|| sanguptanamasahasrapathanadya hi sadhyate | sa shaktirashvamedhasyashtakotyapi
    na sidhyati || 17|| idam nama sahasram tu sarvavidyaprakashakam | ashtavadhanavidyayam shatavadhanake'pi
    ca || 18|| sahasrikavadhane'pi sarvavidyasvayangrahe | etadrisham stotramanyan nopakari na samshayah
    || 19|| prativadimukhastambhe ganeshasya mahaprabhoh | ucchishtasya stotrametadvismapakaphalapradam
    || 20|| manushyatarushitaddhi pramadadikalankitat | guroh sampadyate vidya ya sa vidyadhidevata ||
    21|| svayangrahashleshamargamanurundhe hi sadhake | anubhavaikagamyam tu guhyanamaprasadanam || 22||
    idam namasahasram tu sarvasampatpradayakam | dhanadhanyasutadyashtalakshmivrindapravardhakam || 23||
    sarvavandhyatvadoshaghram satsantanapradayakam | sarvajvarartishamanam dirghayushyapradayakam || 24||
    dharmamartham kamamokshau ititidam pradasyati | nishkamo va sakamo va sarva etatprasadhayet || 25||
    dvatrimshadvarnakam mantram sahasravrittikam japet | guhyanamasahasrakhyametad bhaktya tatah pathet
    || 26|| evam tu sadhakashreshtho varshamatram prayatnatah | nishithinyam muktakeshah prajapetsthiramanasah
    || 27|| ashtasiddhimavapnoti khecarimelako bhavet | samasteshvapi lokeshu tasyasadhyam na vidyate
    || 28|| dvatrimshadvarnakam mantram matrikapariveshtitam | masamekam pratidinamashtottarashatam japet
    || 29|| tatastu namasahasram pratyaham bhaktitah pathet | siddhisanghah samayanti sadyah sadhakatallajam
    || 30|| pustake likhitam mantram drishtva japati yo narah | sa sadhakadhamabhrashto yoginishapabhagbhavet
    || 31|| acaryoddhatsiddhamantranmanum labdhva vidhanatah | sadhakoddhah sadya eva siddhamantro bhavishyati
    || 32|| mantraradhanakale'pi sahasrapathe'pi ca | patniyonyam nyastalingo dhyatavyo'tra ganadhipah
    || 33|| shundahastena jayaya samlalitorujadvayah | tarathadvayagambijairbijashakti ca kilakam || 34||
    tambulacarvanayuktah patnyalingatadehakah | muktakesho vivastrashca kuryadharadhanam param || 35||
    jananashaucayukto va maranashaucayuk tatha | japam kurvanhi dhiro'yam sadyah siddhim prashyati ||
    36|| rajasvalayah kanyayah samipe japatatparah | yogininam catuhshashtikotim dasikaroti hi || 37||
    pitribhumau nishithinyam pratyaham dhairyasamyutah | matrikaputitam mantramashtottarashatam japet
    || 38|| sadhakatallajasyasya yavanmasam samapyate | nishcitam mantrasiddhih syadityuktam tantravedibhih
    || 39|| gurum santoshayed bhaktya bhushanacchadanadibhih | guroh santoshamatrena mantrasiddhirbhaved
    dhrumam || 40|| gurumulamidam sarvamityahustantravedinah | gurum vilanghya mantre'smin nadhikarah
    sureshvapi || 41|| etasya mantrarajasya prayogah kriyate yadi | gurornujnam vina tasya nashah sadyah
    prajayate || 42|| shive rushte gurustrata gurau rushte na kashcana | yasya deve ca mantre ca gurau
    ca trishu nishcala || 43|| na vyavacchidyate bhaktih tasya siddhiraduratah | gurostu pahukamantram
    smritva shirasi pankaje || 44|| mahatim padukamevathava svashirasi smaran | sarvamantreshu samsiddhimanayasena
    gacchati || 45|| gurupadusmritim hitva samsisadhayishoranum | kotyavrittijapenapi tasya mantro na
    sid
  devanagari: ध्यति ॥ १६॥ सङ्गुप्तनामसाहस्रपठनाद्या हि साध्यते । सा शक्तिरश्वमेधस्याष्टकोट्यापि न सिध्यति
    ॥ १७॥ इदं नाम सहस्रं तु सर्वविद्याप्रकाशकम् । अष्टावधानविद्यायां शतावधानकेऽपि च ॥ १८॥ साहस्रिकावधानेऽपि
    सर्वविद्यास्वयङ्ग्रहे । एतादृशं स्तोत्रमन्यन् नोपकारि न संशयः ॥ १९॥ प्रतिवादिमुखस्तम्भे गणेशस्य महाप्रभोः
    । उच्छिष्टस्य स्तोत्रमेतद्विस्मापकफलप्रदम् ॥ २०॥ मनुष्यतारूषिताद्धि प्रमादादिकलङ्कितात् । गुरोः सम्पाद्यते
    विद्या या सा विद्याधिदेवता ॥ २१॥ स्वयङ्ग्रहाश्लेषमार्गमनुरुन्धे हि साधके । अनुभवैकगम्यं तु गुह्यनामप्रसादनम्
    ॥ २२॥ इदं नामसहस्रम् तु सर्वसम्पत्प्रदायकम् । धनधान्यसुताद्यष्टलक्ष्मीवृन्दप्रवर्धकम् ॥ २३॥ सर्ववन्ध्यात्वदोषघ्रं
    सत्सन्तानप्रदायकम् । सर्वज्वरार्तिशमनं दीर्घायुष्यप्रदायकम् ॥ २४॥ धर्ममर्थं काममोक्षौ इटितीदं प्रदास्यति
    । निष्कामो वा सकामो वा सर्व एतत्प्रसाधयेत् ॥ २५॥ द्वत्रिंशद्वर्णकं मन्त्रं सहस्रावृत्तिकं जपेत् ।
    गुह्यनामसहस्राख्यमेतद् भक्त्या ततः पठेत् ॥ २६॥ एवं तु सधकश्रेष्ठो वर्षमात्रं प्रयत्नतः । निशीथिन्यां
    मुक्तकेशः प्रजपेत्स्थिरमानसः ॥ २७॥ अष्टसिद्धिमवाप्नोति खेचरीमेलको भवेत् । समस्तेष्वपि लोकेषु तस्यासाध्यं
    न विद्यते ॥ २८॥ द्वात्रिंशद्वर्णकं मन्त्रं मातृकापरिवेष्टितम् । मासमेकं प्रतिदिनमष्टोत्तरशतं जपेत्
    ॥ २९॥ ततस्तु नामासहस्रं प्रत्यहं भक्तितः पठेत् । सिद्धिसन्घाः समायान्ति सद्यः साधकतल्लजम् ॥ ३०॥ पुस्तके
    लिखितं मन्त्रं दृष्ट्वा जपति यो नरः । स साधकाधमभ्रष्टो योगिनीशापभाग्भवेत् ॥ ३१॥ आचार्योद्धात्सिद्धमन्त्रान्मनुं
    लब्ध्वा विधानतः । साधकोद्धः सद्य एव सिद्धमन्त्रो भविष्यति ॥ ३२॥ मन्त्राराधनकालेऽपि साहस्रपठेऽपि च
    । पत्नीयोन्यां न्यस्तलिङ्गो ध्यातव्योऽत्र गणाधिपः ॥ ३३॥ शुण्डाहस्तेन जायाया संलालितोरुजद्वयः । तारठद्वयगम्बीजैर्बीजशक्ती
    च कीलकम् ॥ ३४॥ ताम्बूलचर्वणायुक्तः पत्न्यालिङ्गतदेहकः । मुक्तकेशो विवस्त्रश्च कुर्याधाराधनं परम् ॥
    ३५॥ जननाशौचयुक्तो वा मरणाशौचयुक् तथा । जपं कुर्वन्हि धीरोऽयं सद्यः सिद्धिं प्रश्यति ॥ ३६॥ रजस्वलायाः
    कन्यायाः समीपे जपतत्परः । योगिनीनां चतुःषष्टिकोटिं दासीकरोति हि ॥ ३७॥ पितृभूमौ निशीथिन्यां प्रत्यहं
    धैर्यसम्युतः । मातृकापुटितं मन्त्रमष्टोत्तरशतं जपेत् ॥ ३८॥ साधकतल्लजस्यास्य यावन्मासं समाप्यते । निश्चितं
    मन्त्रसिद्धिः स्यादित्युक्तं तन्त्रवेदिभिः ॥ ३९॥ गुरुं सन्तोषयेद् भक्त्या भूषणाच्छादनादिभिः । गुरोः
    सन्तोषमात्रेण मन्त्रसिद्धिर्भवेद् ध्रुमम् ॥ ४०॥ गुरुमूलमिदं सर्वमित्याहुस्तन्त्रवेदिनः । गुरुं विलङ्घ्य
    मन्त्रेऽस्मिन् नाधिकारः सुरेष्वपि ॥ ४१॥ एतस्य मन्त्रराजस्य प्रयोगः क्रियते यदि । गुरोर्नुज्ञां विना
    तस्य नाशः सद्यः प्रजायते ॥ ४२॥ शिवे रुष्टे गुरुस्त्राता गुरौ रुष्टे न कश्चन । यस्य देवे च मन्त्रे
    च गुरौ च त्रिषु निश्चला ॥ ४३॥ न व्यवच्छिद्यते भक्तिः तस्य सिद्धिरदूरतः । गुरोस्तु पाहुकामन्त्रं स्मृत्वा
    शिरसि पङ्कजे ॥ ४४॥ महतीं पादुकामेवाथवा स्वशिरसि स्मरन् । सर्वमन्त्रेषु संसिद्धिमनायासेन गच्छति ॥ ४५॥
    गुरुपादुस्मृतिं हित्वा संसिसाधयिषोरणुम् । कोट्यावृत्तिजपेनापि तस्य मन्त्रो न सिद्
