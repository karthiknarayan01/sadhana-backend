id: tyagaraja-pancharatna-keerthanas-jagadananda-karaka
category: stotram
name:
  english: Tyagaraja Pancharatna Keerthanas Jagadananda Karaka
content:
  english: shri tyagarajacaryulu ragam adi jagadananda karaka jaya janaki prana nayaka jagadananda karaka
    gaganadhipa satkulaja raja rajeshvara sugunakara surasevya bhavya dayaka sada sakala jagadananda karaka
    amara taraka nicaya kumuda hita paripurna naga sura surabhuja dadhi payodhi vasa harana sundaratara
    vadana sudhamaya vaco brinda govinda sananda ma varajarapta shubhakaraneka jagadananda karaka nigama
    nirajamritaja poshaka nimishavairi varida samirana khaga turanga satkavi hridalaya ganita vanaradhipa
    natanghriyuga jagadananda karaka indra nilamani sannibhapa ghana candra surya nayanaprameya vagindra
    janaka sakalesha shubhra nagendra shayana shamana vairi sannuta jagadananda karaka pada vijita mauni
    shapa sava paripala vara mantra grahana lola parama shanta citta janakajadhipa sarojabhava varadakhila
    jagadananda karaka srishti sthityantakara kamita kamita phalada samana gatra shacipati nutabdhi mada
    hara nuragaraga rajitakadha sarahita jagadananda karaka sajjana manasabdhi sudhakara kusuma vimana
    surasaripu karabja lalita caranava guna suragana mada harana sanatana januta jagadananda karaka onkara
    panjara kira pura hara saroja bhava keshavadi rupa vasavaripu janakantaka kaladharapta karunakara
    sharanagata janapalana sumano ramana nirvikara nigama saratara jagadananda karaka karadhrita sharajala
    sura madapa harana vanisura suravana kavina bilaja mauni krita caritra sannuta shri tyagarajanuta
    jagadananda karaka purana purusha nrivaratmaja shrita paradhina kara viradha ravana viravana nagha
    parashara manohara vikrita tyagaraja sannuta jagadananda karaka aganita guna kanaka cela sala vidalanarunabha
    samana caranapara mahimadbhuta sukavijana hritsadana sura munigana vihita kalasha nira nidhija ramana
    papa gaja nrisimha vara tyagarajadhinuta jagadananda karaka jaya janaki prana nayaka jagadananda karaka
  devanagari: श्री त्यागराजाचार्युलु रागं आदि जगदानन्द कारका जय जानकी प्राण नायका जगदानन्द कारका गगनाधिप
    सत्कुलज राज राजेश्वर सुगुणाकर सुरसेव्य भव्य दायक सदा सकल जगदानन्द कारका अमर तारक निचय कुमुद हित परिपूर्ण
    नग सुर सुरभूज दधि पयोधि वास हरण सुन्दरतर वदन सुधामय वचो बृन्द गोविन्द सानन्द मा वराजराप्त शुभकरानेक
    जगदानन्द कारका निगम नीरजामृतज पोषका निमिशवैरि वारिद समीरण खग तुरङ्ग सत्कवि हृदालया गणित वानराधिप नताङ्घ्रियुग
    जगदानन्द कारका इन्द्र नीलमणि सन्निभाप घन चन्द्र सूर्य नयनाप्रमेय वागीन्द्र जनक सकलेश शुभ्र नागेन्द्र
    शयन शमन वैरि सन्नुत जगदानन्द कारका पाद विजित मौनि शाप सव परिपाल वर मन्त्र ग्रहण लोल परम शान्त चित्त
    जनकजाधिप सरोजभव वरदाखिल जगदानन्द कारका सृष्टि स्थित्यन्तकार कामित कामित फलदा समान गात्र शचीपति नुताब्धि
    मद हरा नुरागराग राजितकधा सारहित जगदानन्द कारका सज्जन मानसाब्धि सुधाकर कुसुम विमान सुरसारिपु कराब्ज
    लालित चरणाव गुण सुरगण मद हरण सनातना जनुत जगदानन्द कारका ओङ्कार पञ्जर कीर पुर हर सरोज भव केशवादि रूप
    वासवरिपु जनकान्तक कलाधराप्त करुणाकर शरणागत जनपालन सुमनो रमण निर्विकार निगम सारतर जगदानन्द कारका करधृत
    शरजाला सुर मदाप हरण वनीसुर सुरावन कवीन बिलज मौनि कृत चरित्र सन्नुत श्री त्यागराजनुत जगदानन्द कारका
    पुराण पुरुष नृवरात्मज श्रित पराधीन कर विराध रावण विरावण नघ पराशर मनोहर विकृत त्यागराज सन्नुत जगदानन्द
    कारका अगणित गुण कनक चेल साल विडलनारुणाभ समान चरणापार महिमाद्भुत सुकविजन हृत्सदन सुर मुनिगण विहित कलश
    नीर निधिजा रमण पाप गज नृसिंह वर त्यागराजाधिनुत जगदानन्द कारका जय जानकी प्राण नायका जगदानन्द कारका
