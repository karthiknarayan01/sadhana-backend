id: govind
category: stotram
name:
  english: govind
  devanagari: गोविन्द्
content:
  english: ruroda gopi bhavanasya madhye govinda damodara madhaveti || 32|| sarovare kaliyanagabaddham
    shishum yashodatanayam nishamya | cakrurluthantyah pathi gopabala govinda damodara madhaveti || 33||
    akrurayane yaduvamshanatham sangacchamanam mathuram nirikshya | ucurviyogat kila gopabala govinda
    damodara madhaveti || 34|| cakranda gopi nalinivanante krishnena hina kusume shayana | praphullanilotpalalocanabhyam
    govinda damodara madhaveti || 35|| matapitribhyam parivaryamana geham pravishta vilalapa gopi | agatya
    mam palaya vishvanatha govinda damodara madhaveti || 36|| vrindavanastham harimashu buddhva gopi gata
    kapi vanam nishayam | tatrapyadrishtva'tibhayadavocad govinda damodara madhaveti || 37|| sukham shayana
    nilaye nije'pi namani vishnoh pravadanti martyah | te nishcitam tanmayatam vrajanti govinda damodara
    madhaveti || 38|| sa nirajakshimavalokya radham ruroda govindaviyogakhinnam | sakhi praphullotpalalocanabhyam
    govinda damodara madhaveti || 39|| jihve rasajne madhurapriya tvam satyam hitam tvam paramam vadami
    | avarnayetha madhuraksharani govinda damodara madhaveti || 40|| atyantikavyadhiharam jananam cikitsakam
    vedavido vadanti | samsaratapatrayanashabijam govinda damodara madhaveti || 41|| tatajnaya gacchati
    ramacandre salakshmane'ranyacaye sasite | cakranda ramasya nija janitri govinda damodara madhaveti
    || 42|| ekakini dandakakananantat sa niyamana dashakandharena | sita tadakrandadananyanatha govinda
    damodara madhaveti || 43|| ramadviyukta janakatmaja sa vicintayanti hridi ramarupam | ruroda sita
    raghunatha pahi govinda damodara madhaveti || 44|| prasida vishno raghuvamshanatha surasuranam sukhaduhkhaheto
    | ruroda sita tu samudramadhye govinda damodara madhaveti || 45|| antarjale grahagrihitapado visrishtaviklishtasamastabandhuh
    | tada gajendro nitaram jagada govinda damodara madhaveti || 46|| hamsadhvajah shankhayuto dadarsha
    putram katahe pratapantamenam | punyani namani harerjapantam govinda damodara madhaveti || 47|| durvasaso
    vakyamupetya krishna sa cabravit kananavasinisham | antah pravishtam manasa juhava govinda damodara
    madhaveti || 48|| dhyeyah sada yogibhiraprameyah cintaharashcintitaparijatah | kasturikakalpitanilavarno
    govinda damodara madhaveti || 49|| samsarakupe patito'tyagadhe mohandhapurne vishayabhitapte | karavalambam
    mama dehi vishno govinda damodara madhaveti || 50|| bhajasva mantram bhavabandhamuktyai jihve rasajne
    sulabham manojnam | dvaipayanadyairmunibhih prajaptam govinda damodara madhaveti || 51|| tvameva yace
    mama dehi jihve samagate dandadhare kritante | vaktavyamevam madhuram subhaktya govinda damodara madhaveti
    || 52|| gopala vamshidhara rupasindho lokesha narayana dinabandho | uccasvaraistvam vada sarvadaiva
    govinda damodara madhaveti || 53|| jihve sadaivam bhaja sundarani namani krishnasya manoharani | samastabhaktartivinashanani
    govinda damodara madhaveti || 54|| govinda govinda hare murare govinda govinda mukunda krishna | govinda
    govinda rathangapane govinda damodara madhaveti || 55|| sukhavasane tvidameva saram duhkhavasane tvidameva
    geyam | dehavasane tvidameva japyam govinda damodara madhaveti || 56|| durvaravakyam parigrihya krishna
    mrigiva bhita tu katham kathancit | sabham pravishta manasa juhava govinda damodara madhaveti || 57||
    shrikrishna radhavara gokulesha gopala govardhana natha vishno | jihve pibasvamritametadeva govinda
    damodara madhaveti || 58|| shrinatha vishveshvara vishvamurte shridevakinandana daityashatro | jihve
    pibasvamritametadeva govinda damodara madhaveti || 59|| gopipate kamsaripo mukunda lakshmipate keshava
    vasudeva | jihve pibasvamritametadeva govinda damodara madhaveti || 60|| gopijanahladakara vrajesha
    gocaranaranyakritapravesha | jihve pibasvamritametadeva govinda damodara madhaveti || 61|| pranesha
    vishvambhara kaitabhare vaikuntha narayana cakrapane | jihve pibasvamritametadeva govinda damodara
    madhaveti || 62|| hare murare madhusudanadya shrirama sitavara ravanare | jihve pibasvamritametadeva
    govinda damodara madhaveti || 63|| shriyadavendradridharambujaksha gogopagopisukhadanadaksha | jihve
    pibasvamritametadeva govinda damodara madhaveti || 64|| dharabharottaranagopavesha viharalilakritabandhushesha
    | jihve pibasvamritametadeva govinda damodara madhaveti || 65|| bakibakaghasuradhenukare keshitrinavartavighatadaksha
    | jihve pibasvamritametadeva govinda damodara madhaveti || 66|| shrijanakijivana ramacandra nishacarare
    bharatagrajesha | jihve pibasvamritametadeva govinda damodara madhaveti || 67|| narayanananta hare
    nrisimha prahladabadhahara he kripalo | jihve pibasvamritametadeva govinda damodara madhaveti || 68||
    lilamanushyakritiramarupa pratapadasikritasarvabhupa | jihve pibasvamritametadeva govinda damodara
    madhaveti || 69|| shrikrishna govinda hare murare he natha narayana vasudeva | jihve pibasvamritametadeva
    govinda damodara madhaveti || 70|| vaktum samartho'pi na vakti kashcidaho jananam vyasanabhimukhyam
    | jihve pibasvamritametadeva govinda damodara madhaveti || 71|| iti shribilvamangalacaryaviracitam
    shrigovindadamodarastotram sampurnam | shloka 42
  devanagari: रुरोद गोपी भवनस्य मध्ये गोविन्द दामोदर माधवेति ॥ ३२॥ सरोवरे कालियनागबद्धं शिशुं यशोदातनयं
    निशम्य । चक्रुर्लुठन्त्यः पथि गोपबाला गोविन्द दामोदर माधवेति ॥ ३३॥ अक्रूरयाने यदुवंशनाथं सङ्गच्छमानं
    मथुरां निरीक्ष्य । ऊचुर्वियोगत् किल गोपबाला गोविन्द दामोदर माधवेति ॥ ३४॥ चक्रन्द गोपी नलिनीवनान्ते
    कृष्णेन हीना कुसुमे शयाना । प्रफुल्लनीलोत्पललोचनाभ्यां गोविन्द दामोदर माधवेति ॥ ३५॥ मातापितृभ्यां
    परिवार्यमाणा गेहं प्रविष्टा विललाप गोपी । आगत्य मां पालय विश्वनाथ गोविन्द दामोदर माधवेति ॥ ३६॥ वृन्दावनस्थं
    हरिमाशु बुद्ध्वा गोपी गता कापि वनं निशायाम् । तत्राप्यदृष्ट्वाऽतिभयादवोचद् गोविन्द दामोदर माधवेति
    ॥ ३७॥ सुखं शयाना निलये निजेऽपि नामानि विष्णोः प्रवदन्ति मर्त्याः । ते निश्चितं तन्मयतां व्रजन्ति गोविन्द
    दामोदर माधवेति ॥ ३८॥ सा नीरजाक्षीमवलोक्य राधां रुरोद गोविन्दवियोगखिन्नाम् । सखी प्रफुल्लोत्पललोचनाभ्यां
    गोविन्द दामोदर माधवेति ॥ ३९॥ जिह्वे रसज्ञे मधुरप्रिया त्वं सत्यं हितं त्वां परमं वदामि । आवर्णयेथा
    मधुराक्षराणि गोविन्द दामोदर माधवेति ॥ ४०॥ आत्यन्तिकव्याधिहरं जनानां चिकित्सकं वेदविदो वदन्ति । संसारतापत्रयनाशबीजं
    गोविन्द दामोदर माधवेति ॥ ४१॥ ताताज्ञया गच्छति रामचन्द्रे सलक्ष्मणेऽरण्यचये ससीते । चक्रन्द रामस्य
    निजा जनित्री गोविन्द दामोदर माधवेति ॥ ४२॥ एकाकिनी दण्डककाननान्तात् सा नीयमाना दशकन्धरेण । सीता तदाक्रन्ददनन्यनाथा
    गोविन्द दामोदर माधवेति ॥ ४३॥ रामाद्वियुक्ता जनकात्मजा सा विचिन्तयन्ती हृदि रामरूपम् । रुरोद सीता रघुनाथ
    पाहि गोविन्द दामोदर माधवेति ॥ ४४॥ प्रसीद विष्णो रघुवंशनाथ सुरासुराणां सुखदुःखहेतो । रुरोद सीता तु
    समुद्रमध्ये गोविन्द दामोदर माधवेति ॥ ४५॥ अन्तर्जले ग्राहगृहीतपादो विसृष्टविक्लिष्टसमस्तबन्धुः । तदा
    गजेन्द्रो नितरां जगाद गोविन्द दामोदर माधवेति ॥ ४६॥ हंसध्वजः शङ्खयुतो ददर्श पुत्रं कटाहे प्रतपन्तमेनम्
    । पुण्यानि नामानि हरेर्जपन्तं गोविन्द दामोदर माधवेति ॥ ४७॥ दुर्वाससो वाक्यमुपेत्य कृष्णा सा चाब्रवीत्
    काननवासिनीशम् । अन्तः प्रविष्टं मनसा जुहाव गोविन्द दामोदर माधवेति ॥ ४८॥ ध्येयः सदा योगिभिरप्रमेयः
    चिन्ताहरश्चिन्तितपारिजातः । कस्तूरिकाकल्पितनीलवर्णो गोविन्द दामोदर माधवेति ॥ ४९॥ संसारकूपे पतितोऽत्यगाधे
    मोहान्धपूर्णे विषयाभितप्ते । करावलम्बं मम देहि विष्णो गोविन्द दामोदर माधवेति ॥ ५०॥ भजस्व मन्त्रं भवबन्धमुक्त्यै
    जिह्वे रसज्ञे सुलभं मनोज्ञम् । द्वैपायनाद्यैर्मुनिभिः प्रजप्तं गोविन्द दामोदर माधवेति ॥ ५१॥ त्वामेव
    याचे मम देहि जिह्वे समागते दण्डधरे कृतान्ते । वक्तव्यमेवं मधुरं सुभक्त्या गोविन्द दामोदर माधवेति ॥
    ५२॥ गोपाल वंशीधर रूपसिन्धो लोकेश नारायण दीनबन्धो । उच्चस्वरैस्त्वं वद सर्वदैव गोविन्द दामोदर माधवेति
    ॥ ५३॥ जिह्वे सदैवं भज सुन्दराणि नामानि कृष्णस्य मनोहराणि । समस्तभक्तार्तिविनाशनानि गोविन्द दामोदर
    माधवेति ॥ ५४॥ गोविन्द गोविन्द हरे मुरारे गोविन्द गोविन्द मुकुन्द कृष्ण । गोविन्द गोविन्द रथाङ्गपाणे
    गोविन्द दामोदर माधवेति ॥ ५५॥ सुखावसाने त्विदमेव सारं दुःखावसाने त्विदमेव गेयम् । देहावसाने त्विदमेव
    जाप्यं गोविन्द दामोदर माधवेति ॥ ५६॥ दुर्वारवाक्यं परिगृह्य कृष्णा मृगीव भीता तु कथं कथञ्चित् । सभां
    प्रविष्टा मनसा जुहाव गोविन्द दामोदर माधवेति ॥ ५७॥ श्रीकृष्ण राधावर गोकुलेश गोपाल गोवर्धन नाथ विष्णो
    । जिह्वे पिबस्वामृतमेतदेव गोविन्द दामोदर माधवेति ॥ ५८॥ श्रीनाथ विश्वेश्वर विश्वमूर्ते श्रीदेवकीनन्दन
    दैत्यशत्रो । जिह्वे पिबस्वामृतमेतदेव गोविन्द दामोदर माधवेति ॥ ५९॥ गोपीपते कंसरिपो मुकुन्द लक्ष्मीपते
    केशव वासुदेव । जिह्वे पिबस्वामृतमेतदेव गोविन्द दामोदर माधवेति ॥ ६०॥ गोपीजनाह्लादकर व्रजेश गोचारणारण्यकृतप्रवेश
    । जिह्वे पिबस्वामृतमेतदेव गोविन्द दामोदर माधवेति ॥ ६१॥ प्राणेश विश्वम्भर कैटभारे वैकुण्ठ नारायण चक्रपाणे
    । जिह्वे पिबस्वामृतमेतदेव गोविन्द दामोदर माधवेति ॥ ६२॥ हरे मुरारे मधुसूदनाद्य श्रीराम सीतावर रावणारे
    । जिह्वे पिबस्वामृतमेतदेव गोविन्द दामोदर माधवेति ॥ ६३॥ श्रीयादवेन्द्राद्रिधराम्बुजाक्ष गोगोपगोपीसुखदानदक्ष
    । जिह्वे पिबस्वामृतमेतदेव गोविन्द दामोदर माधवेति ॥ ६४॥ धराभरोत्तारणगोपवेष विहारलीलाकृतबन्धुशेष । जिह्वे
    पिबस्वामृतमेतदेव गोविन्द दामोदर माधवेति ॥ ६५॥ बकीबकाघासुरधेनुकारे केशीतृणावर्तविघातदक्ष । जिह्वे पिबस्वामृतमेतदेव
    गोविन्द दामोदर माधवेति ॥ ६६॥ श्रीजानकीजीवन रामचन्द्र निशाचरारे भरताग्रजेश । जिह्वे पिबस्वामृतमेतदेव
    गोविन्द दामोदर माधवेति ॥ ६७॥ नारायणानन्त हरे नृसिंह प्रह्लादबाधाहर हे कृपालो । जिह्वे पिबस्वामृतमेतदेव
    गोविन्द दामोदर माधवेति ॥ ६८॥ लीलामनुष्याकृतिरामरूप प्रतापदासीकृतसर्वभूप । जिह्वे पिबस्वामृतमेतदेव
    गोविन्द दामोदर माधवेति ॥ ६९॥ श्रीकृष्ण गोविन्द हरे मुरारे हे नाथ नारायण वासुदेव । जिह्वे पिबस्वामृतमेतदेव
    गोविन्द दामोदर माधवेति ॥ ७०॥ वक्तुं समर्थोऽपि न वक्ति कश्चिदहो जनानां व्यसनाभिमुख्यम् । जिह्वे पिबस्वामृतमेतदेव
    गोविन्द दामोदर माधवेति ॥ ७१॥ इति श्रीबिल्वमङ्गलाचार्यविरचितं श्रीगोविन्ददामोदरस्तोत्रं सम्पूर्णम्
    । श्लोक ४२
