id: sarasvatistotramumeshvarananda-1
category: stotram
name:
  english: sarasvatistotramumeshvarananda 1
  devanagari: सरस्वतीस्तोत्रमुमेश्वरानन्द १
content:
  english: shrisarasvatistotram shvetambaram hamsamusevitatam mridala pushpopari samshishanca | vina nadantim
    svara sadhayanti namami vanim jana shantidatrim || 1|| sarasvatim veda visharadam param vimuktidam
    nitya sudhabdhidhamadam | alaukikam lokasubuddhidam tvam namami kotindu samammucismitam || 2|| varabhaya
    pustaka malikamayim svaraishcarvarnalaya gana tatparam | vedanta vijnanaghananca sharadam namamitam
    candramukhim samujjvalam || 3|| harairsuvasaishca kiritakundale karadvaye vallakina sushobhite | uttunga
    vakshasthalaratna shobhitam namami vanim sakalartha dayinim || 4|| ainkara purvam ca sarasvatinca
    yuktam caturthi namah shabdamuttaram | krittvatu pancayuta japakaya siddhim pradatrim pranamami vanim
    || 5|| shastrartha saram paramartha saram vijnana saram shubhajnana saram | svaramalankara gatam susaram
    tam sharadam nitya namami bhaktaya || 6|| om hrim aim dhim klim saum shrim sarasvatyai namah
  devanagari: श्रीसरस्वतीस्तोत्रम् श्वेताम्बरां हंसमुसेवितातां मृडाल पुष्पोपरि संषिशाञ्च । वीणा नदन्तीं
    स्वर साधयन्ती नमामि वाणीं जन शान्तिदात्रीम् ॥ १॥ सरस्वतीं वेद विशारदां परां विमुक्तिदां नित्य सुधाब्धिधामदाम्
    । अलौकिकां लोकसुबुद्धिदां त्वां नमामि कोटीन्दु समम्मुचिस्मिताम् ॥ २॥ वराभय पुस्तक मालिकामयीं स्वरैश्चर्वर्णालय
    गान तत्पराम् । वेदान्त विज्ञानघनाञ्च शारदां नमामितां चन्द्रमुखीं समुज्ज्वलाम् ॥ ३॥ हारैर्सुवासैश्च
    किरीटकुण्डले करद्वये वल्लकिना सुशोभिते । उत्तुङ्ग वक्षस्थलरत्न शोभितां नमामी वाणीं सकलार्थ दायिनीम्
    ॥ ४॥ ऐङ्कार पूर्वं च सरस्वतीञ्च युक्तं चतुर्थी नमः शब्दमुत्तरम् । कृत्त्वातु पञ्चायुत जापकाय सिद्धिं
    प्रदात्रीं प्रणमामि वाणीम् ॥ ५॥ शास्त्रार्थ सारं परमार्थ सारं विज्ञान सारं शुभज्ञान सारम् । स्वरमलङ्कार
    गतं सुसारं तां शारदां नित्य नमामि भक्तया ॥ ६॥ ॐ ह्रीं ऐं धीं क्लीं सौं श्रीं सरस्वत्यै नमः
