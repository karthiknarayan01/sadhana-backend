id: shastasuktam-2
category: veda
name:
  english: shastasuktam
  devanagari: शास्तासूक्तम्
content:
  english: rabhadhvamimam pashcadanu jivatha sarve || om shantih shantih shantih | bhutanathaya vidmahe
    bhavaputraya dhimahi | tannah shasta pracodayat | om shantih shantih shantih || iti shastasuktam |
  devanagari: रभध्वमिमं पश्चादनु जीवाथ सर्वे ॥ ॐ शान्तिः शान्तिः शान्तिः । भूतनाथाय विद्महे भवपुत्राय
    धीमही । तन्नः शास्ता प्रचोदयात् । ॐ शान्तिः शान्तिः शान्तिः ॥ इति शास्तासूक्तम् ।
meaning: {}
