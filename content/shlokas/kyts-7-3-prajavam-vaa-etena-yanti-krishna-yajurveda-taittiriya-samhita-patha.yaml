id: kyts-7-3-prajavam-vaa-etena-yanti-krishna-yajurveda-taittiriya-samhita-patha
category: stotram
name:
  english: KYTS 7.3 Prajavam Vaa Etena Yanti - Krishna Yajurveda Taittiriya Samhita Patha
content:
  english: krishna yajurvediya taittiriya samhitayam saptamakande tritiyah prashnah shri gurubhyo namah
    | harih om || prajavam ddashamamahah papavahiyam va~ etena bhavanti ya ddashamamaharyo vai prajavam
    ya~tamapathena pratipadyate ya ssthanugm hanti yo bhresha nnyeti sa hiyate sa yo vai dashame 'hannavivakya
    upahanyate sa hiyate tasmai ya upahataya vyaha tamevanvarabhya samashnute ddashame 'hannavivakya upahataya
    na vyucyamatho khalvahuryajnasya vai samriddhena deva lo~kamayan yajnasya vyriddhenasura tkhalu vai
    yajnasya samriddha dyajamanasya yadvyriddha ntadbhratrivyasya sa yo vai dashame 'hannavivakya upahanyate
    sa evati recayati te ye bahya drishikava ye bahya drishikavah ssyuste vi bruyuryadi tatra na vindeyu
    ya~di tatra na vindeyu rgrihapatina vyucya thsarparajniya rigbhi vai~ sarpato rajni yadva asya ncarcanti
    yadanricu steneyagm sarparajni te yadeva ki nca vaca ''nricurya maptva 'varuddhyo ttishthameti tabhirmanasa
    stuvate na va imamashvaratho na hati mano va imagm sadyah parya hati manah paribhavitumatha brahma
    vadanti parimita va ricah parimitani samani parimitani yajugshyathaitasyaivanto nasti ya tpratigrinata
    a cakshita sa pratigarah || brahmavadino vadanti ki ndvadashahasya prathamena ya~jamano vrinkta iti
    teja indriya ndvitiyeneti prana ntritiyeneti triniman ~loka ncaturtheneti catushpadah pashu mpancameneti
    panca miti kigm shashtheneti sha drituniti kigm saptameneti saptapadagm shakvarimiti mashtamenetyashtakshara
    mashtamenetyashtakshara nnavameneti trivritagg stoma vi~rajamiti kimekadashenetyekadashakshara ndvadasheneti
    dvadashakshara mityetavadva asti yava esha va apto dvadashaho ya tprayaniyashcodayaniyashca tryatiratro
    bhavati traya ime loka esham prano vai prathamo 'tiratro vyano dvitiyo 'panastritiyah pranapano 'nnadye
    prati tishthanti sarva ryanti ya evam ~vidvagmsa rvagva esha vitata ryanmaddhye 'tiratra rupadasuka
    grihapate nkurvanti santata 'nupadasuka grihapate bhavati pashavo vai chandoma anna nkurvanti pashushu
    caivannadye ca prati tishthanti || aditya akamayanto rlokayor riddhnuyameti ta eta ntenayajanta tato
    vai ta ubhayo rardhnuvannasmigg mushmiggshca ya evam shcaturdasharatramasata ubhayoreva lokayor riddhnuvantyasmigg
    mushmiggshca caturdasharatro bhavati sapta gramya oshadhaya ''ranya ubhayishamavaruddhyai ya tparacinani
    prishthani tpraticinani prishthani bhavantima mabhi jayanti trayastrigmshau maddhyata jyameva gacchantyadhirajau
    bhavato 'dhiraja eva samanana vabhito bhavatah parigrihityai || ntanadityashca pashavashca nte deva
    abruvan nupajivishma ta ime nta adityah prishthai masmin ~loke pashu raditya amushmin ~loka ardhnuva
    ~lloke pashavo ya evam shcaturdasharatramasata ubhayoreva lokayor riddhnuvantyasmigg mushmiggshca
    prishthai 'mushmin ~loka riddhnuvanti tryahabhya masmin ~loke jyoti riti tryaho bhavatiyam danyatah
    prishthani syurvivivadhagg syanmaddhye prishthani bhavanti savivadhatvayau mprishthanyoja eva virya
    mmaddhyato dadhate briha meva yantyatho anayo reva prati tishthantyete vai yajnasya 'njasayani sruti
    tabhya nco va ete suvargam mabhyarohanti ye paracinani prishthanyupayanti pratya ntryaho bhavati pratyavarudhya
    atho pratishthitya ubhayo rlokayor riddhvo ttishthanti caturdashaita mava rundhate yashcatasra shcatasro
    disho dikshveva prati tishthantyatiratra vabhito bhavatah parigrihityai || ntryahabhyamasminth thsa
    na vyavritamagaccha thsa prajapatimupadhava ttenayajata tato vai so vi~dvagmsah pancadasharatra meva
    papmana bhratrivyena gacchanti jyoti riti tryaho bhavatiyam reshveva lokeshu prati tishthantyasatram
    ya~cchandoma bhavanti tena satra ndevata eva prishthairava rundhate pashu mprishthani pashavah chandoma
    ojasyeva virye pashushu prati tishthanti pancadasharatro bhavati pancadasho vajro vajrameva bhratrivyebhyah
    pra harantyatiratra vabhito bhavata indriyasya parigrihityai || indro vai shithila iva thsa prajapatimupa
    nparabhavya vijitya shriyamagacchadagnishtuta papmana nniradahata pancadasharatrenaujo balamindriyam
    vi~ryamatmannadhatta ya evam vi~dvagmsah pancadasharatramasate bhratrivyaneva parabhavya vijitya shriya
    ngacchantyagnishtuta papmana dahante pancadasharatrenaujo rdahante pancadasharatrenaujo bala ndadhata
    eta eva pashavyah pancadasha va ardhamasasya ratrayo 'nu pra jayante tasma tpashavya eta eva suvargyah
    pancadasha va ardhamasasya ratrayo ssuvargo lokastasma riti tryaho bhavatiyam nabhyarohanti yadanyatah
    prishthani syurvivivadhagg syanmaddhye prishthani bhavanti savivadhatvayaujo vai virya mprishthanyoja
    eva virya mmaddhyato dadhate briha va~va rathantaramasau brihadabhyameva yantyatho anayoreva prati
    tishthantyete vai yajnasya njasayani sruti tabhyameva suvargam nco va ete suvargam lo~kamabhyarohanti
    ye paracinani prishthanyupayanti pratya ntryaho bhavati pratyavarudhya atho pratishthitya ubhayo rlokayor
    riddhvo ttishthanti pancadashaitastasam dvirajaivannadyamava rundhate yah panca panca disho dikshveva
    prati tishthantyatiratravabhito bhavata indriyasya viryasya prajayai pashuna gacchantyagnishtuta papmana
    ssyamiti sa etagm saptadasharatra ttenayajata tato vai so vi~dvagmsah saptadasha ratramasate 'nnada
    eva bhavanti pancaho bhavati panca va ritavah sam va~thsara ritushveva sam va~thsare prati tishthantyatho
    panca kshara panktih pankto yajno yajnameva 'va rundhate 'satram ya~cchandoma bhavanti tena satra
    ndevata eva prishthairava rundhate pashunchandomairojo vai virya mprishthani pashavah chandoma ojasyeva
    virye pashushu prati tishthanti saptadasharatro bhavati saptadashah prajapatih prajapateraptya atiratravabhito
    bhavato 'nnadyasya parigrihityai || dbrahmana deveshvannena sureshu te deva akamayantobhayagm sam
    vri~njimahi brahma canna nceti ta eta vigmshatigm ratrirapashya ntato vai ta ubhayagm samavrinjata
    brahma canna vi~dvagmsa eta asata ubhayameva sam vri~njate brahma ca 'nnada bhavanti dve va ete virajau
    tayoreva nana prati tishthanti vigmsho vai purusho dasha hastya angulayo dasha padya yavaneva purushasta
    ttishthanti jyoti riti tryaha bhavantiyam nabhyarohantyabhipurva ntryaha bhavantyabhipurva mabhyarohanti
    yadanyatah prishthani syurvivivadhagg syanmaddhye prishthani bhavanti savivadhatvayaujo vai virya
    mprishthanyoja eva virya mmaddhyato dadhate briha va~va rathantaramasau brihadabhyameva yantyatho
    anayoreva prati tishthantyete vai yajnasya njasayani sruti tabhyameva suvargam nco va ete suvargam
    ~lokamabhyarohanti ye paracinani prishthanyupayanti pratya ntryaho bhavati pratyavarudhya atho pratishthitya
    ubhayo ttishthantyatiratravabhito bhavato brahmavarcasa syannadyasya parigrihityai || vrinjate brahma
    ca ndevah prishthaih parigrihya suvargam ndivakirtyena suvarge loke pratyasthapaya nprishthairupavarohan
    thsa va asavadityo 'mushmin ~loke parairubhayatah parigrihito ya tprishthani bhavanti suvargameva
    tairlokam ya~jamana yanti parairavasta tpari grihnanti divakirtyena suvarge loke prati suvarge loke
    prati tishthanti paraih tpari grihnanti prishthairupavarohanti ya tpare parastanna syuh para llokannishpadyeran
    yadavastanna syuh praja nirdaheyurabhito divakirtya mparassamano bhavanti suvarga evaina llo~ka ubhayatah
    pari grihnanti yajamana vai divakirtyagm sam va~thsarah parassamano 'bhito divakirtya mparassamano
    bhavanti sam prati tishthanti prishtham shve parassamano 'bhito divakirtya mparassamano bhavanti tasmadabhitah
    prishtha shve bhuyishtha graha grihyante bhuyishthagm shasyate yajnasyaiva tanmaddhyato granthi ngrathnantyavisragmsaya
    sapta grihyante sapta vai shir pranah prananeva yajamaneshu dadhati ya tparacinani prishthani bhavantyamumeva
    tai rlokamabhyarohanti yadimam rudva madyeyuryajamanah pra va miyeran tpraticinani prishthani bhavantima
    mpratyavarohantyatho asminneva loke prati tishthantyanunmadayendro va apratishthita asi ttenayajata
    tato vai sa pratyatishthadye bahuyajino 'pratishthita ssyusta ekavigmshati ndvadasha masah pancartava
    straya ime loka asavaditya ekavigmsha etavanto vai devalokasteshveva yatha purva mprati tishthantyasavadityo
    na vyarocata sa prajapati ttasma etamekavigmshatiratra ttenayajata tato vai so 'rocata ya evam vi~dvagmsa
    ekavigmshatiratra masate rocanta evaikavigmshatiratro bhavati rugva ekavigmsho rucameva gacchantyatho
    pratishthameva pratishtha hyekavigmsho 'tiratravabhito bhavato brahmavarcasasya parigrihityai || grihnanti
    divakirtyenai dadhi mamabhi | rishinam yah ~purohitah || nirdeva nkritva vishkandha ndveshti | shariram
    ndveshti || yajna yajnasya ya ttejastena sankrama mamabhi | brahmana nritvijo devan yajnasya tapasa
    te savahama huve || ishtena pakvamupa nte vrinje sukritagm sa mpashun || praishan mpratyashrutama
    shrinami te | prayajanuyajan mashisha a vrinje suvah || agninendrena somena sarasvatya vishnuna devatabhih
    | yajyanuvakya ya~jnama dade te vashatkritam || stutagm shastra a vrinje suvah | patnisam nupa te
    huve savahagm samishtayaju ra dade tava || pashun thsavananyota yajnam | devan thsendranupa te huve
    savaha thsomavato ye ca vishve thsvaha namo gayatri trishtu thsvaha namah prithivyantariksha thsvaha
    namo 'gnirvayu thsvaha namah prano thsvaha namah pitaputrah pautro vashat thsvaha namo bhurbhuva a
    me griha bhavantva praja ma a ma yajno vishatu viryavan | apo deviryajniya ma ''vishantu sahasrasya
    ma bhuma ma pra hasit || a me graho bhavatva puroru khstutashastre ma '' vishatagm samici | aditya
    rudra vasavo me sadasya ssahasrasya ma bhuma ma pra hasit || a ma 'gnishtomo vishatu kthyashcatiratro
    ma '' vishatvapisharvarah | tiroahniya ma suhuta a vishantu sahasrasya ma bhuma ma pra hasit || agnishtomo
    vishatva dvaca brahma manina rupanindrena devan vatena pranan ncandramasa nakshatrani yamena pitri
    nphalena nadeyanajagarena sarpan vyaghrena npashunchyenena patatrino vrishna 'shvanrishabhena ga bastenaja
    vrishnina 'nnani yavenaushadhirnyagrodhena vanaspatinudubamrenorja ngayatriya chandagmsi trivrita
    stoma ''dhimadhitaya svaha svaha mmanase svaha svaha manah prajapataye svaha kaya svaha kasmai svaha
    katamasmai svaha 'dityai svaha 'dityai mahyai 'dityai sumridikayai svaha sarasvatyai svaha sarasvatyai
    brihatyai svaha sarasvatyai pavakayai svaha pushne svaha pushne prapathyaya svaha pushne narandhishaya
    svaha tvashtre svaha tvashtre turipaya svaha tvashtre pururupaya svaha vishnave svaha vishnave nikhuryapaya
    svaha vishnave nibhuyapaya svaha sarvasmai svaha pururupaya svaha bhyag svaha mukhaya svaha nasikabhyag
    svaha 'kshibhyag svaha karna bhyag svaha para ikshavo ssvaha 'vara ikshavah parye svaha lalataya svaha
    murdhne svaha mastishkaya svaha keshe ssvaha vahaya svaha ssvaha kikasabhya ssvaha prishtibhya ssvaha
    pajasyaya svaha par bhyag svaha doshabhyag svaha bahubhyag svaha jangha bhyag svaha shroni bhyag svahorubhyag
    svaha 'shthivadbhyag svaha jangha bhyag svaha bhasade svaha shikhandebhya ssvaha valadhanaya svaha
    ''ndabhyag svaha shepaya svaha retase svaha prajananaya svaha padbhya tvace svaha lohitaya svaha magmsaya
    svaha snavabhya ssvaha ''tmane svaha sarvasmai svaha shvabhyag svaha anjyetaya svaha 'njisakthaya
    svaha shitipade svaha shitikakude svaha shitirandhraya svaha shitiprishthaya svaha shityagmsaya svaha
    pushpakarnaya svaha shityoshthaya svaha shitibhrave svaha shitibhasade svaha shvetanukashaya svaha
    'njaye svaha lalamaya svaha 'sitajnave svaha krishnaitaya svaha rohitaitaya svaha 'runaitaya svahedrishaya
    svaha kidrishaya svaha tadrishaya svaha sadrishaya svaha visadrishaya svaha susadrishaya svaha rupaya
    svaha sarvasmai svaha shvetaya svaha pishangaya svaha sarangaya svaha 'runaya svaha gauraya svaha
    babhrave svaha nakulaya svaha rohitaya svaha shonaya svaha shyamaya svaha pakalaya svaha surupaya
    svaha 'nurupaya svaha virupaya svaha sarupaya svaha pratirupaya svaha shabalaya svaha kamalaya svaha
    prishnaye svaha prishnisakthaya svaha sarvasmai svaha ssvaha grihitebhya ssvaha 'grihitebhya ssvaha
    'vapannebhya ssvaha shayanebhya ssvaha sarvasmai svaha ssvaha parnebhya ssvaha grihitebhya ssvaha
    'grihitebhya ssvaha 'vapannebhya ssvaha shayanebhya ssvaha shishtaya svaha 'tishishtaya svaha parishishtaya
    svaha sagmshishtaya svaho cchishtaya svaha riktaya svaha 'riktaya svaha prariktaya svaha sagmriktaya
    svaho driktaya svaha sarvasmai svaha nnindro vai sadrim mindro vai shithilah prajapatirakamayata 'nnadah
    || harih om || || krishna yajurvediya taittiriya samhitayam saptamakande tritiyah prashna
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय संहितायां सप्तमकाण्डे तृतीयः प्रश्नः श्री गुरुभ्यो नमः । ह॒रिः॒
    ओम् ॥ प्र॒जवं॒ द्द॑श॒ममहः॑ पापाव॒हीयं॒ वाँ ए॒तेन॑ भवन्ति॒ य द्द॑श॒ममह॒र्यो वै प्र॒जवं॑ यँ॒तामप॑थेन
    प्रति॒पद्य॑ते॒ य स्स्था॒णुग्ं हन्ति॒ यो भ्रेष॒ न्न्येति॒ स ही॑यते॒ स यो वै द॑श॒मे ऽह॑न्नविवा॒क्य उ॑पह॒न्यते॒
    स ही॑यते॒ तस्मै॒ य उप॑हताय॒ व्याह॒ तमे॒वान्वा॒रभ्य॒ सम॑श्ञु॒ते द्दश॒मे ऽह॑न्नविवा॒क्य उप॑हताय॒ न व्युच्य॒मथो॒
    खल्वा॑हुर्य॒ज्ञस्य॒ वै समृ॑द्धेन दे॒वा लोँ॒कमा॑यन् य॒ज्ञस्य॒ व्यृ॑द्धे॒नासु॑रा॒ त्खलु॒ वै य॒ज्ञस्य॒
    समृ॑द्ध॒ द्यज॑मानस्य॒ यद्व्यृ॑द्ध॒ न्तद्भ्रातृ॑व्यस्य॒ स यो वै द॑श॒मे ऽह॑न्नविवा॒क्य उ॑पह॒न्यते॒ स
    ए॒वाति॑ रेचयति॒ ते ये बाह्या॑ दृशी॒कव॒ ये बाह्या॑ दृशी॒कवः॑ स्स्युस्ते वि ब्रू॑यु॒र्यदि॒ तत्र॒ न वि॒न्देयु॑
    यँदि॒ तत्र॒ न वि॒न्देयु॑ र्गृ॒हप॑तिना॒ व्युच्य॒ थ्स॑र्परा॒ज्ञिया॑ ऋ॒ग्भि वैँ सर्प॑तो॒ राज्ञी॒ यद्वा
    अ॒स्या ञ्चार्च॑न्ति॒ यदा॑नृ॒चु स्तेने॒यग्ं स॑र्परा॒ज्ञी ते यदे॒व कि ञ्च॑ वा॒चा ऽऽनृ॒चुर्य मा॒प्त्वा
    ऽव॒रुद्ध्यो त्ति॑ष्ठा॒मेति॒ ताभि॒र्मन॑सा स्तुवते॒ न वा इ॒माम॑श्वर॒थो ना हति॒ मनो॒ वा इ॒माग्ं स॒द्यः
    पर्या हति॒ मनः॒ परि॑भवितु॒मथ॒ ब्रह्म॑ वदन्ति॒ परि॑मिता॒ वा ऋचः॒ परि॑मितानि॒ सामा॑नि॒ परि॑मितानि॒ यजू॒ग्॒ष्यथै॒तस्यै॒वान्तो॒
    नास्ति॒ य त्प्र॑तिगृण॒त आ च॑क्षीत॒ स प्र॑तिग॒रः ॥ ब्र॒ह्म॒वा॒दिनो॑ वदन्ति॒ कि न्द्वा॑दशा॒हस्य॑ प्रथ॒मेना
    यँज॑मानो वृङ्क्त॒ इति॒ तेज॑ इन्द्रि॒य न्द्वि॒तीये॒नेति॑ प्रा॒णा न्तृ॒तीये॒नेति॒ त्रीनि॒मान् ँलो॒का
    ञ्च॑तु॒र्थेनेति॒ चतु॑ष्पदः प॒शू म्प॑ञ्च॒मेनेति॒ पञ्चा मिति॒ किग्ं ष॒ष्ठेनेति॒ ष डृ॒तूनिति॒ किग्ं स॑प्त॒मेनेति॑
    स॒प्तप॑दा॒ग्ं॒ शक्व॑री॒मिति॒ म॑ष्ट॒मेनेत्य॒ष्टाक्ष॑रा म॑ष्ट॒मेनेत्य॒ष्टाक्ष॑रा न्न॑व॒मेनेति॑ त्रि॒वृत॒ग्ग्॒
    स्तोम॒ विँ॒राज॒मिति॒ किमे॑काद॒शेनेत्येका॑दशाक्षरा न्द्वा॑द॒शेनेति॒ द्वाद॑शाक्षरा॒ मित्ये॒ताव॒द्वा
    अ॑स्ति॒ याव॑ ए॒ष वा आ॒प्तो द्वा॑दशा॒हो य त्प्रा॑य॒णीय॑श्चोदय॒नीय॑श्च॒ त्र्य॑तिरात्रो भवति॒ त्रय॑ इ॒मे
    लो॒का ए॒षां प्रा॒णो वै प्र॑थ॒मो॑ ऽतिरा॒त्रो व्या॒नो द्वि॒तीयो॑ ऽपा॒नस्तृ॒तीयः॑ प्राणापानो ऽन्नाद्ये॒
    प्रति॑ तिष्ठन्ति॒ सर्व॒ र्यन्ति॒ य ए॒वं ँवि॒द्वाग्ंस॑ र्वाग्वा ए॒षा वित॑ता॒ र्यन्मद्ध्ये॑ ऽतिरा॒त्र
    रु॑प॒दासु॑का गृ॒हप॑ते॒ ङ्कु॑र्वन्ति॒ सन्त॑ता ऽनु॑पदासुका गृ॒हप॑ते॒ भ॑वति प॒शवो॒ वै छ॑न्दो॒मा अन्न॑
    ङ्कु॒र्वन्ति॑ प॒शुषु॑ चै॒वान्नाद्ये॑ च॒ प्रति॑ तिष्ठन्ति ॥ आ॒दि॒त्या अ॑कामयन्तो॒ र्लो॒कयोर्॑ ऋद्ध्नुया॒मेति॒
    त ए॒त न्तेना॑यजन्त॒ ततो॒ वै त उ॒भयो रार्ध्नुवन्न॒स्मिग्ग् मुष्मिग्ग्॑श्च॒ य ए॒वं श्चतुर्दशरा॒त्रमास॑त
    उ॒भयो॑रे॒व लो॒कयोर्॑ ऋद्ध्नुवन्त्य॒स्मिग्ग् मुष्मिग्ग्॑श्च चतुर्दशरा॒त्रो भ॑वति स॒प्त ग्रा॒म्या ओष॑धय
