id: shivashatakamramapanivada
category: shataka
name:
  english: shivashatakamramapanivada
  devanagari: शिवशतकम्रामपाणिवाद
content:
  english: pranamamyaham bhavantam || 62|| niravadhinigamantashilanena sphutajanitadvayavodhashodhitanam
    | aviralatamamatmani sphurantam bhajatu mano mama nishkalam bhavantam || 63|| aparimitamanadimantahinam
    vimalamavikriyamakriyam vishalam | janavacanadhiyamagocaram tam bhajatu mano mama nishkalam bhavantam
    || 64|| pratiphaladiva bhati yatra shuddhe sphatikamanaviva karyajatametat | kamapi tamatamaskamadvitiyam
    bhajatu mano mama nishkalam bhavantam || 64|| srijati kila jaganti sakshimatre sthitavati nishcaladhamni
    yatra maya | yamiyamiha janaya nihnute tam bhajatu mano mama nishphalam bhavantam || 66|| bahirabahirapi
    prakashamanam nanu jagato vigatoccanicabhavam | upanishadupagudhamujjvalam tam bhajatu mano mama nishkalam
    bhavantam || 67|| anubhavaramaniyamarthaniya nirupadhibhaktigunena gamyamahuh | paracidanagharupamavyayam
    tam bhajatu mano mama nishkalam bhavantam || 68|| jananamaranasindhumuttaritum sharanamiyam khalu
    yasya bhavanaiva | tamimamamitasammadatisandram bhajatu mano mama nishkalam bhavantam || 69|| paramashiva
  devanagari: प्रणमाम्यहं भवन्तम् ॥ ६२॥ निरवधिनिगमान्तशीलनेन स्फुटजनिताद्वयवोधशोधितानाम् । अविरलतममात्मनि
    स्फुरन्तं भजतु मनो मम निष्कलं भवन्तम् ॥ ६३॥ अपरिमितमनादिमन्तहीनं विमलमविक्रियमक्रियं विशालम् । जनवचनधियामगोचरं
    तं भजतु मनो मम निष्कलं भवन्तम् ॥ ६४॥ प्रतिफलदिव भाति यत्र शुद्धे स्फटिकमणाविव कार्यजातमेतत् । कमपि
    तमतमस्कमद्वितीयं भजतु मनो मम निष्कलं भवन्तम् ॥ ६४॥ सृजति किल जगन्ति साक्षिमात्रे स्थितवति निश्चलधाम्नि
    यत्र माया । यमियमिह जनाय निह्नुते तं भजतु मनो मम निष्फलं भवन्तम् ॥ ६६॥ बहिरबहिरपि प्रकाशमानं ननु जगतो
    विगतोच्चनीचभावम् । उपनिषदुपगूढमुज्ज्वलं तं भजतु मनो मम निष्कलं भवन्तम् ॥ ६७॥ अनुभवरमणीयमर्थनीय निरुपधिभक्तिगुणेन
    गम्यमाहुः । परचिदनघरूपमव्ययं तं भजतु मनो मम निष्कलं भवन्तम् ॥ ६८॥ जननमरणसिन्धुमुत्तरीतुं शरणमियं खलु
    यस्य भावनैव । तमिमममितसम्मदातिसान्द्रं भजतु मनो मम निष्कलं भवन्तम् ॥ ६९॥ परमशिव
