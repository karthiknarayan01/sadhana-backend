id: sharabheshvaramantravidhana
category: mantra
name:
  english: sharabheshvaramantravidhana
  devanagari: शरभेश्वरमन्त्रविधान
content:
  english: mrigastvardhasharirena pakshabhyam cancuna dvijah | ghoravaktrashcatushpada urdhvanetrashcaturbhujah
    || kalantadahanah punyo nilajimutanisvanah | aristaddarshanadeva vinashtabalavikramah || satachatograrupaya
    pakshavikshiptabhubhrite | ashtapadaya rudraya namah sharabhamurtaye || athava
  devanagari: मृगस्त्वर्धशरीरेण पक्षाभ्यां चञ्चुना द्विजः । घोरवक्त्रश्चतुष्पाद ऊर्ध्वनेत्रश्चतुर्भुजः
    ॥ कालान्तदहनः पुण्यो नीलजीमूतनिस्वनः । अरिस्तद्दर्शनादेव विनष्टबलविक्रमः ॥ सटाछटोग्ररूपाय पक्षविक्षिप्तभूभृते
    । अष्टपादाय रुद्राय नमः शरभमूर्तये ॥ अथवा
meaning: {}
