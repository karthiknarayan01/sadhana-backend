id: yamastotrasavitrikritabvp
category: stotram
name:
  english: yamastotrasavitrikritaBVP
  devanagari: यमस्तोत्रसावित्रिक्रितBVP
content:
  english: yamastotram savitrikrita 1 athashtavimsho'dhyayah | shri narayana uvaca | harerutkirtanam shrutva
    savitri yamavaktratah | sashrunetra supulaka yamam punaruvaca sa || 1|| savitryuvaca | harerutkirtanam
    dharma svakuloddharakakaranam | shrotrinam ca vaktrinam janmamrityujaraharam || 2|| danam ca vratanam
    ca siddhinam tapasam param | yoganam ca vedanam sevanam kirtanam hareh || 3|| muktatvamamaratvam va
    sarvasiddhitvameva va | shrikrishnasevanasyaiva kalam narhanti shodashim || 4|| bhajami kena vidhina
    shrikrishnam prakriteh param | mudham mamabalam tata vada vedavidam varah || 5|| shubhakarmavipakam
    ca shrutam nrinam manoharam | karmashubhavipakam ca tanme vyakhyatumarhasi || 6|| ityuktva sa sati
    brahmanbhaktinamratmakamdhara | tushtava dharmarajam ca vedoktena stavena ca || 7|| savitryuvaca |
    tapasa dharmamaradhya pushkare bhasvarah pura | dharmamsham yam sutam prapa dharmarajam namamyaham
    || 8|| samata sarvabhuteshu yasya sarvasya sakshinah | ato yannama shamanamiti tam pranamamyaham ||
    9|| yenantashca krito vishve sarvesham jivinam param | karmanurupakalena tam kritantam namamyaham
    || 10|| bibharti dandam dandyaya papinam shuddhihetave | namami tam dandadharam yah shasta sarvakarmanam
    || 11|| vishve yah kalayatyeva sarvayushcapi samtatam | ativa durnivaryam ca tam kalam pranamamyaham
    || 12|| tapasvi vaishnavo dharmo samyami vijitendriyah | jivinam karmaphaladam tam yamam pranamamyaham
    || 13|| svatmaramashca sarvajno mitram punyakritam bhavet | papinam kleshado yasya putro mitro namamyaham
    || 14|| yajjanma brahmano vamshe jvalantam brahmatejasa | yo dhyayati param brahma brahmavamsham namamyaham
    || 15|| ityuktva sa ca savitri prananama yamam mune | yamastam vishnubhajanam karmapakamuvaca ha ||
    16|| idam yamashtakam nityam pratarutthaya yah pathet | yamattasya bhayam nasti sarvapapatpramucyate
    || 17|| mahapapi yadi pathet nityam bhaktya ca narada | yamah karoti tam shuddham kayavyuhena nishcitam
    || 18|| iti shribrahmavaivarte mahapurane prakritikhande naradanarayanasamvade savitrrikritayamastotram
    namashtavimsho'dhyayah || brahmavaivartapurana | prakṟitikhanda | adhyaya 28||
  devanagari: यमस्तोत्रं सावित्रीकृत १ अथाष्टाविंशोऽध्यायः । श्री नारायण उवाच । हरेरुत्कीर्तनं श्रुत्वा
    सावित्री यमवक्त्रतः । साश्रुनेत्रा सुपुलका यमं पुनरुवाच सा ॥ १॥ सावित्र्युवाच । हरेरुत्कीर्तनं धर्म
    स्वकुलोद्धारककारणम् । श्रोतृणां च वक्तृणां जन्ममृत्युजराहरम् ॥ २॥ दानां च व्रतानां च सिद्धीनां तपसां
    परम् । योगानां च वेदानां सेवनं कीर्तनं हरेः ॥ ३॥ मुक्तत्वममरत्वं वा सर्वसिद्धित्वमेव वा । श्रीकृष्णसेवनस्यैव
    कलां नार्हन्ति षोडशीम् ॥ ४॥ भजामि केन विधिना श्रीकृष्णं प्रकृतेः परम् । मूढां मामबलां तात वद वेदविदां
    वरः ॥ ५॥ शुभकर्मविपाकं च श्रुतं नृणां मनोहरम् । कर्माशुभविपाकं च तन्मे व्याख्यातुमर्हसि ॥ ६॥ इत्युक्त्वा
    सा सती ब्रह्मन्भक्तिनम्रात्मकंधरा । तुष्टाव धर्मराजं च वेदोक्तेन स्तवेन च ॥ ७॥ सावित्र्युवाच । तपसा
    धर्ममाराध्य पुष्करे भास्वरः पुरा । धर्मांशं यम् सुतं प्राप धर्मराजं नमाम्यहम् ॥ ८॥ समता सर्वभूतेषु
    यस्य सर्वस्य साक्षिणः । अतो यन्नाम शमनमिति तं प्रणमाम्यहम् ॥ ९॥ येनान्तश्च कृतो विश्वे सर्वेषां जीविनां
    परम् । कर्मानुरूपकालेन तं कृतान्तं नमाम्यहम् ॥ १०॥ बिभर्ति दण्डं दण्ड्याय पापिनां शुद्धिहेतवे । नमामि
    तं दण्डधरं यः शास्ता सर्वकर्मणाम् ॥ ११॥ विश्वे यः कलयत्येव सर्वायुश्चापि संततम् । अतीव दुर्निवार्यं
    च तं कालं प्रणमाम्यहम् ॥ १२॥ तपस्वी वैष्णवो धर्मो संयमी विजितेन्द्रियः । जीविनां कर्मफलदं तं यमं प्रणमाम्यहम्
    ॥ १३॥ स्वात्मारामश्च सर्वज्ञो मित्रं पुण्यकृतां भवेत् । पापिनं क्लेशदो यस्य पुत्रो मित्रो नमाम्यहम्
    ॥ १४॥ यज्जन्म ब्रह्मणो वंशे ज्वलन्तं ब्रह्मतेजसा । यो ध्यायति परम् ब्रह्म ब्रह्मवंशं नमाम्यहम् ॥ १५॥
    इत्युक्त्वा सा च सावित्री प्रणनाम यमं मुने । यमस्तां विष्णुभजनं कर्मपाकमुवाच ह ॥ १६॥ इदं यमाष्टकं
    नित्यं प्रातरुत्थाय यः पठेत् । यमात्तस्य भयं नास्ति सर्वपापात्प्रमुच्यते ॥ १७॥ महापापी यदि पठेत् नित्यं
    भक्त्या च नारद । यमः करोति तं शुद्धं कायव्यूहेन निश्चितम् ॥ १८॥ इति श्रीब्रह्मवैवर्ते महापुराणे प्रकृतिखण्डे
    नारदनारायणसंवादे सावित्र्रिकृतयमस्तोत्रं नामाष्टाविंशोऽध्यायः ॥ ब्रह्मवैवर्तपुराण । प्रक्ऱितिखण्ड
    । अध्याय २८॥
