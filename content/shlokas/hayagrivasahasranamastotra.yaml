id: hayagrivasahasranamastotra
category: sahasranama
name:
  english: hayagrivasahasranamastotra
  devanagari: हयग्रीवसहस्रनामस्तोत्र
content:
  english: rinkhalakankanormikah | sitopavitasamshlishyatpadmakshamanimalikah || 67|| shricurnavaddvadashordhvapundrarekhaparishkritah
    | pattatantugrathanavatpavitranarashobhitah || 68|| pinavakshamahaskandho vipulorukatitatah | kaustubhi
    vanamali ca kantyacandrayutopamah || 69|| mandaramalikamodi manjuvagamalacchavih | divyagandho divyaraso
    divyateja divaspatih || 70|| vacalo vakpatirvakta vyakhyata vadinam priyah | bhaktahrinmadhuro vadijihvabhadrananasthitih
    || 71|| smritisannihitassnigdhassiddhidasiddhisannutah | mulakandomukundoglaussvayambhushambhuraindavah
    || 72|| ishto manuryamah kalakalyah kambukalanidhih | kalyah kamayita bhimah kataryaharanah kritih
    || 73|| sampriyah pakkanastarkacarcanirdharanadayah | vyatireko vivekashca pravekah prakramah kramah
    || 74|| pramana pratibhuh prajnah prajnapatthyacadharanah | vidhirvidhata vyavadhirudbhavah prabhavasthitih
    || 75|| vishayassamshayah purvah pakshah kakshyopapadakah | raddhanto vihito nyayaphalanishpattirudbhavah
    || 76|| nanarupani tantrani vyavaharyo vyavasthitih | sarvasadharano devassadhvasadhuhite ratah ||
    77|| sandha sanatano dharmo dharmairarcya mahatmabhih | chandomayastridhamatma svacchandashchandaseditah
    || 78|| yajno yajnatmako yashta yajnango'paghanohavih | samidajyam purodashashshala sthali sruvassruca
    || 79|| pragvamsho devayajanah paridhishca paristarah | vedirviharanam treta pashuh pashashca samskritih
    || 80|| vidhirmantro'rthavadashca dravyamangam ca daivatam | stotram shastram sama gitirudgithassarvasadhanam
    || 81|| yajya puronukavya ca samidheni samuhanam | prayoktarah prayogashca prapancah prashubha shramah
    || 82|| shraddha pradhvamsana tushtih pushtih punyam pratirbhavah | sadassadasyasampatah prashnah
    prativacasthitih || 83|| prayashcittam parishkaro dhritirnirvahanam phalam | niyogo bhavana bhavyam
    hiranyam dakshina nutih || 84|| ashirabhyupapattishca triptissvam sharma kevalama | punyakshayah punah
    patabhayam shikshashugardanah || 85|| karpanyam yatanam cinta nirvedashca vihastata | dehabhritkarmasampatah
    kincitkarmanukulakah || 86|| ahetukataya prema sammukhyam capyanugrahah | shucishshrimatkulajano neta
    sattvabhimanavan || 87|| antarayaharah pitroradushtaharadayakah | shuddhaharanurupangaparinamavidhayakah
    || 88|| sravapatadivipadam pariharta parayanah | shirahpanyadisandhata kshemakritpranadah prabhu ||
    89|| anirghrinashcavishamashshaktitritayadayakah | svecchaprasangasampattivyajaharshavisheshavan ||
    90|| samvitsandhayakassarvajanmakleshasmritipradah | vivakeshokavairagyabhavabhitividhayakah || 91||
    garbhasyapyanukuladinasantadhyavasayadah | shubhavaijananopetasadanehojanipradah || 92|| uttamayuhprado
    brahmanishthanugrahakarakah | svadasajananistirnatadvamshajaparamparah || 93|| shrivaishnavotpadakritasvastikavanimandalah
    | adharvanoktaikashatamrityudurakriyaparah || 94|| dayadyashtagunadhata tattatsamskritisadhakah |
    medhavidhata shraddhakrit sausthyado jamitaharah || 95|| vighnanudvijayi dhata deshakalanukulyakrit
    | vineta satpathaneta doshahricchubhadassakha || 96|| hrido bhido rucikaro vishvo vishvahite ratah
    | pramadahritpraptakari pradyumno balavattarah || 97|| sangavedasamayokta sarvashastrarthavittidah
    | brahmacaryantarayaghnah priyakriddhitakritparah || 98|| cittashuddhipradashchinnakshacapalyah kshamavahah
    | indriyartharaticchetta vidyaikavyasanavahah || 99|| atmanukulyarucikridakhilartivinashakah | titirshuhrittvaravedi
    gurusadbhaktitejasah || 100|| gurusambandhaghatako guruvishvasavardhanah | gurupasanasandhata gurupremapravardhanah
    || 101|| acaryabhimatairyokta pancasamskritibhavanah | guruktavrittinaishcalyasandhata'vahitasthitih
    || 102|| apannakhilaraksharthamacaryakamupashritah | shastrapanipradanena bhavamagnansamuddharan ||
    103|| pancakalikadharmeshu naishcalyam pratipadayan | svadasaradhanadyarthashuddhadravyapradayakah
    || 104|| nyasavidyavinirvodha nyastatmabhararakshakah | svakainkaryaikarucidassvadasyapremavardhanah
    || 105|| acaryarthakhiladravyasambhrityarpanarocakah | acaryasya svasacchishyojjivanaikarucipradah
    || 106|| agatyayojayanasahitaikakritijagarah | brahmavidyasamasvadasuhitah kritisamskritih || 107||
    satkare vishadhidata tarunyam shavabuddhidah | sabhampratyayayanvyalim sarvatra samabuddhidah || 108||
    sambhavitasheshadoshahritpunarnyasarocakah | mahavishvasasandhata sthairyadata madapahah || 109||
    nadavyakhyasvasiddhantarakshahetusvamantradah | svamantrajapasamsiddhijanghalakavitodayah || 110||
    adushtagunavatkavyabandhavyamugdhacetanah | vyangyapradhanarasavadgadyapadyadinirmitih || 111|| svabhaktastutisantushto
    bhuyobhaktipradayakah | satvikatyagasampannasatkarmakridatipriyah || 112|| nirantaranusmarananijadasaivadasyakrit
    | nishkamavatsalo naicyabhavaneshu vinirvishan || 113|| sarvabhutabhavadbhavam sampashyatsusadasthitah
    | karanatrayasarupyakalyanapatisadarah || 114|| kada kadeti kainkaryakaminam sheshitambhajana | paravyuhadinirdoshashubhashrayaparigrahah
    || 115|| candramandalamadhyasya shvetambhoruhavishtarah | jyotsnayamanangarucinirdhutantarbahistamah
    || 116|| bhavyo bhavayita bhadram parijatavanalayah | kshirabdhimadhyamadvipapalakah prapitamahah
    || 117|| nirantaranamovakashuddhayajihadashrayah | muktidashvetamridrupashvetadvipavibhavanah || 118||
    garudaharitashvetamritputayadubhudharah | bhadrashvavarshanilayo bhayahari shubhashrayah || 119||
    bhadrashrivatsaharadhyah pancaratrapravartakah | bhaktatmabhavabhavano hardo'ngushthapramanavan ||
    120|| svadasasatkritakritye tanmitrarishu yojayan | prananutkramayannurikritaprarabdhalopanah || 121||
    ladhvyaiva shikshayapapamasheshamapi nirnudan | tristhunakshobhato bhutasukshmyaissukshmavapussrijan
    || 122|| nirankushakripapuro nityakalyanakarakah | murdhanyanadya svandasanbrahmarandhradudancayan
    || 123|| upasanaparansarvan prarabdhamanubhavayan | sarvaprarabdhadehante'pyantimasmaranam dishan
    || 124|| prapeyusham bhejusham ca yamadrishtimabhavayan | divyadehapradassuryam dvarayanmokshameyusham
    || 125|| ativahikasatkaranadhvanyapadya manayan | sarvankratubhujashshashvatprabhritani pradapayan
    || 126|| durantamayakantaram drutam yogen langhayan | sphayatsudarshavividhavithyantenadhvana nayan
    || 127|| simantasindhuvirajam yogenottarayanvashi | amanavasya devasya karam shirasi dharayan || 128||
    anadivasanam dhunvan vaikunthaptya salokayan | aheyamangalodaratanudanatsarupayana || 129|| surijushtam
    sukhaikantam paramam padamapayan | araranyamritambhodhi darshayan shramanashanah || 130|| divyodyanasarovapisarinmaninagannayana
    | airammadamritasarogamayansupabrimhanah || 131|| ashvattham somasavanam prapayanvishtarashravah |
    divyapsarassamanitabrahmalankaradayakah || 132|| divyavaso'njanakshaumamalyaissvanbahumanayan | sviyamayodhyam
    nagarim sadaram sampraveshayan || 133|| dasandivyarasalokagandhamsalasharirayan | svadasansurivargena
    sasneham bahumanayan || 134|| surisevoditanandanaicyansvanatishayayan | vacayansvam namovipsam kurvanprahvankritanjalin
    || 135|| prakaragopuraramaprasadebhyah pranamayan | indraprajapatidvarapalasammanamapayan || 136||
    malikancanmaharajavithimadhyam nivasayan | shrivaikunthapurandhribhirnanasatkarakarakah || 137|| divyam
    vimanam gamayan brahmakantyabhipurayan | mahanandatmakashrimanmanimandapamapayan || 138|| hrishyatkumudacandadyairvishvaksenantikam
    nayan | seneshacoditasthananayako hetinayakah || 139|| prapayandivyamasthanam vainateyam pranamayan
    | shrimatsundarasurindradivyapanktim pranamayan || 140|| bhasvarasanaparyankaprapanena kritarthayan
    | paryankavidyasamsiddhasarvavaibhavasangatah || 141|| svatmanameva shrikantam sadaram bhuri darshayan
    | sheshataikaratim shesham shayyatmanam pranamayan || 142|| anantakshidvisahasrasadaralokapatrayan
    | akumarayuvakaram shrikantam sampranamayan || 143|| atatanandato heto rancayankilikincitam | dasanatyutthitamuhuhkritisrishtiprasannahrit
    || 144|| shriyam prapasvayam tatam jivam putram praharshayan | majjayan svamukhambhodhau svakam kirtirucim
    dishan || 145|| dayardragangavalanakritahladaih kritarthayan | paryankarohanaprahvam samam lakshmyopapadayan
    || 146|| kastvamityanuyunjano daso'smityuktivismitah | aprithaktvaprakaro'smi vacasvashritavadbhavan
    || 147|| vidusham tatkratunayaddhayasyavapushabhavan | vasudevatmana bhuyo bhavanvaikunthanayakah
    || 148|| yatha tathaiva svam rupam jaganmohanamurtiman | dvimurti bahumurtishca atmanashca prakashayan
    || 149|| yugapatsakalam sakshatsvatah kartum samarthayan | kavinamadishannityam muktanamadimah kavih
    || 150|| shadarnamanunishthanam shvetadvipasthitim dishan | dvadashaksharanishthanam lokam santanikam
    dishan || 151|| ashtaksharaikanishthanam karyam vaikunthamarpayan | sharanagatinishthanam sakshadvaikunthamarpayan
    || 152|| svamantrarajanishthanam svasmardateshayam dishan | shriya gadhopagudhatma bhutadhatrirucim
    dishan || 153|| nilavibhutivyamugdho mahashvetashvamastakah | tryakshastripurasamhari rudrasskando
    vinayakah || 154|| ajo virinco druhino vyaptamurtiramurtikah | asango'nanyadhisangavihangovairibhangadah
    || 155|| svami svam svena santupyan shakrassarvadhikasyadah | svayamjyotissvayamvaidyashshurashshurakulodbhavah
    || 156|| vasavo vasuranyognirvasudevassuhridvasuh | bhuto bhavi bhavanbhavyo vishnusthanassanatanah
    || 157|| nityanubhavo nediyandaviyandurvibhavanah | sanatkumarassandhata sugandhissukhadarshanah ||
    158|| tirtham titikshustirthanghristirthasvadushubhashshucih | tirthavaddidhitistigmatejastivramanamayah
    || 159|| ishadyupanishadvedyah pancopanishadatmakah | idantahstho'pi durasthah kalyanatamarupavan
    || 160|| prananam prananah purnajnanairapi sudurgrahah | naciketopasanarcyastrimatrapranavoditah ||
    161|| bhutayonishca sarvajno'ksharo'ksharaparatparah | akaradipadajneyavyuhatararthapurushah || 162||
    manomayamrito nandamayo dahararupadrit | nyasavidyavedyarupah adityantarhiranmayah || 163|| idandra
    atmodgithadi pratiko pasananvayi | madhuvidyopasaniyo gayatridhyanagocarah || 164|| divyakauksheyasajjyotih
    shandilyopastivikshitah | samvargavidyavedyatma tat shodashakalam param || 165|| upakosalavidyekshyah
    pancagnyatmasharirakah | vaishvanarah sadakhebhuma ca jagatkarma''dipurushah || 166|| murtamurtabrahma
    sarvapreshtho'nyapriyatakarah | sarvantarashcaparokshashcantaryamyamrito'naghah || 167|| aharnamadityarupashcahannamakshisamshritah
    | saturyagayatryarthashca yathopastyapyasadvapuh || 168|| candradisayujyapurvamokshadanyasagocarah
    | nyasanashyanabhyupetaprarabdhamsho mahadayah || 169|| avatararahasyadijnaniprarabdhanashanah | svena
    svartham parenapi krite nyase phalapradah || 170|| asahaso'napayashrissahayassa shriyai vasan | shrimannarayano
    vasudevo'vyadvishnuruttamah || 171|| || om || itidam paramam guhyam sarvapapapranashanam | vagishanamasahasram
    vatsa te'bhihitam maya || 1|| ya idam sha
  devanagari: ृङ्खलाकङ्कणोर्मिकः । सितोपवीतसंश्लिष्यत्पद्माक्षमणिमालिकः ॥ ६७॥ श्रीचूर्णवद्द्वादशोर्ध्वपुण्ड्ररेखापरिष्कृतः
    । पट्टतन्तुग्रथनवत्पवित्रनरशोभितः ॥ ६८॥ पीनवक्षामहास्कन्धो विपुलोरुकटीतटः । कौस्तुभी वनमाली च कान्त्याचन्द्रायुतोपमः
    ॥ ६९॥ मन्दारमालिकामोदी मञ्जुवागमलच्छविः । दिव्यगन्धो दिव्यरसो दिव्यतेजा दिवस्पतिः ॥ ७०॥ वाचालो वाक्पतिर्वक्ता
    व्याख्याता वादिनां प्रियः । भक्तहृन्मधुरो वादिजिह्वाभद्राननस्थितिः ॥ ७१॥ स्मृतिसन्निहितस्स्निग्धस्सिद्धिदसिद्धिसन्नुतः
    । मूलकन्दोमुकुन्दोग्लौस्स्वयम्भूशम्भुरैन्दवः ॥ ७२॥ इष्टो मनुर्यमः कालकाल्यः कम्बुकलानिधिः । कल्यः
    कामयिता भीमः कातर्यहरणः कृतिः ॥ ७३॥ सम्प्रियः पक्कणस्तर्कचर्चानिर्धारणादयः । व्यतिरेको विवेकश्च प्रवेकः
    प्रक्रमः क्रमः ॥ ७४॥ प्रमाण प्रतिभूः प्राज्ञः प्रज्ञापत्थ्याचधारणः । विधिर्विधाता व्यवधिरुद्भवः प्रभवस्थितिः
    ॥ ७५॥ विषयस्संशयः पूर्वः पक्षः कक्ष्योपपादकः । राद्धान्तो विहितो न्यायफलनिष्पत्तिरुद्भवः ॥ ७६॥ नानारूपाणि
    तन्त्राणि व्यवहार्यो व्यवस्थितिः । सर्वसाधारणो देवस्साध्वसाधुहिते रतः ॥ ७७॥ सन्धा सनातनो धर्मो धर्मैरर्च्या
    महात्मभिः । छन्दोमयस्त्रिधामात्मा स्वच्छन्दश्छान्दसेडितः ॥ ७८॥ यज्ञो यज्ञात्मको यष्टा यज्ञाङ्गोऽपघनोहविः
    । समिदाज्यं पुरोडाशश्शाला स्थाली स्रुवस्स्रुचा ॥ ७९॥ प्राग्वंशो देवयजनः परिधिश्च परिस्तरः । वेदिर्विहरणं
    त्रेता पशुः पाशश्च संस्कृतिः ॥ ८०॥ विधिर्मन्त्रोऽर्थवादश्च द्रव्यमङ्गं च दैवतम् । स्तोत्रं शस्त्रं
    साम गीतिरुद्गीथस्सर्वसाधनम् ॥ ८१॥ याज्या पुरोनुकाव्या च सामिधेनी समूहनम् । प्रयोक्तारः प्रयोगश्च प्रपञ्चः
    प्राशुभा श्रमः ॥ ८२॥ श्रद्धा प्रध्वंसना तुष्टिः पुष्टिः पुण्यं प्रतिर्भवः । सदस्सदस्यसम्पातः प्रश्नः
    प्रतिवचस्थितिः ॥ ८३॥ प्रायश्चित्तं परिष्कारो धृतिर्निर्वहणं फलम् । नियोगो भावना भाव्यं हिरण्यं दक्षिणा
    नुतिः ॥ ८४॥ आशीरभ्युपपत्तिश्च तृप्तिस्स्वं शर्म केवलम । पुण्यक्षयः पुनः पातभयं शिक्षाशुगर्दनः ॥ ८५॥
    कार्पण्यं यातनां चिन्ता निर्वेदश्च विहस्तता । देहभृत्कर्मसम्पातः किञ्चित्कर्मानुकूलकः ॥ ८६॥ अहेतुकतया
    प्रेम साम्मुख्यं चाप्यनुग्रहः । शुचिश्श्रीमत्कुलजनो नेता सत्त्वाभिमानवान् ॥ ८७॥ अन्तरायहरः पित्रोरदुष्टाहारदायकः
    । शुद्धाहारानुरूपाङ्गपरिणामविधायकः ॥ ८८॥ स्रावपातादिविपदां परिहर्ता परायणः । शिरःपाण्यादिसन्धाता क्षेमकृत्प्राणदः
    प्रभु ॥ ८९॥ अनिर्घृणश्चाविषमश्शक्तित्रितयदायकः । स्वेच्छाप्रसङ्गसम्पत्तिव्याजहर्षविशेषवान् ॥ ९०॥ संवित्सन्धायकस्सर्वजन्मक्लेशस्मृतिप्रदः
    । विवकेशोकवैराग्यभवभीतिविधायकः ॥ ९१॥ गर्भस्याप्यनुकूलादिनासान्ताध्यवसायदः । शुभवैजननोपेतसदनेहोजनिप्रदः
    ॥ ९२॥ उत्तमायुःप्रदो ब्रह्मनिष्ठानुग्रहकारकः । स्वदासजननिस्तीर्णतद्वंशजपरम्परः ॥ ९३॥ श्रीवैष्णवोत्पादकृतस्वस्तिकावनिमण्डलः
    । अधर्वणोक्तैकशतमृत्युदूरक्रियापरः ॥ ९४॥ दयाद्यष्टगुणाधाता तत्तत्संस्कृतिसाधकः । मेधाविधाता श्रद्धाकृत्
    सौस्थ्यदो जामिताहरः ॥ ९५॥ विघ्ननुद्विजयी धाता देशकालानुकूल्यकृत् । विनेता सत्पथानेता दोषहृच्छुभदस्सखा
    ॥ ९६॥ ह्रीदो भीदो रुचिकरो विश्वो विश्वहिते रतः । प्रमादहृत्प्राप्तकारी प्रद्युम्नो बलवत्तरः ॥ ९७॥
    साङ्गवेदसमायोक्ता सर्वशास्त्रार्थवित्तिदः । ब्रह्मचर्यान्तरायघ्नः प्रियकृद्धितकृत्परः ॥ ९८॥ चित्तशुद्धिप्रदश्छिन्नाक्षचापल्यः
    क्षमावहः । इन्द्रियार्थारतिच्छेत्ता विद्यैकव्यसनावहः ॥ ९९॥ आत्मानुकूल्यरुचिकृदखिलार्तिविनाशकः । तितीर्षुहृत्त्वरावेदी
    गुरुसद्भक्तितेजसः ॥ १००॥ गुरुसम्बन्धघटको गुरुविश्वासवर्धनः । गुरूपासनसन्धाता गुरुप्रेमप्रवर्धनः ॥
    १०१॥ आचार्याभिमतैर्योक्ता पञ्चसंस्कृतिभावनः । गुरूक्तवृत्तिनैश्चल्यसन्धाताऽवहितस्थितिः ॥ १०२॥ आपन्नाखिलरक्षार्थमाचार्यकमुपाश्रितः
    । शास्त्रपाणिप्रदानेन भवमग्नान्समुद्धरन् ॥ १०३॥ पाञ्चकालिकधर्मेषु नैश्चल्यं प्रतिपादयन् । स्वदासाराधनाद्यर्थशुद्धद्रव्यप्रदायकः
    ॥ १०४॥ न्यासविद्याविनिर्वोढा न्यस्तात्मभररक्षकः । स्वकैङ्कर्यैकरुचिदस्स्वदास्यप्रेमवर्धनः ॥ १०५॥ आचार्यार्थाखिलद्रव्यसम्भृत्यर्पणरोचकः
    । आचार्यस्य स्वसच्छिष्योज्जीवनैकरुचिप्रदः ॥ १०६॥ आगत्ययोजयनासहितैककृतिजागरः । ब्रह्मविद्यासमास्वादसुहितः
    कृतिसंस्कृतिः ॥ १०७॥ सत्कारे विषधीदाता तरुण्यां शवबुद्धिदः । सभाम्प्रत्याययन्व्यालीं सर्वत्र समबुद्धिदः
    ॥ १०८॥ सम्भाविताशेषदोषहृत्पुनर्न्यासरोचकः । महाविश्वाससन्धाता स्थैर्यदाता मदापहः ॥ १०९॥ नादव्याख्यास्वसिद्धान्तरक्षाहेतुस्वमन्त्रदः
    । स्वमन्त्रजपसंसिद्धिजङ्घालकवितोदयः ॥ ११०॥ अदुष्टगुणवत्काव्यबन्धव्यामुग्धचेतनः । व्यङ्ग्यप्रधानरसवद्गद्यपद्यादिनिर्मितिः
    ॥ १११॥ स्वभक्तस्तुतिसन्तुष्टो भूयोभक्तिप्रदायकः । सात्विकत्यागसम्पन्नसत्कर्मकृदतिप्रियः ॥ ११२॥ निरन्तरानुस्मरणनिजदासैवादास्यकृत्
    । निष्कामवत्सलो नैच्यभावनेषु विनिर्विशन् ॥ ११३॥ सर्वभूतभवद्भावं सम्पश्यत्सुसदास्थितः । करणत्रयसारूप्यकल्याणपतिसादरः
    ॥ ११४॥ कदा कदेति कैङ्कर्यकामिनां शेषिताम्भजन । परव्यूहादिनिर्दोषशुभाश्रयपरिग्रहः ॥ ११५॥ चन्द्रमण्डलमध्यस्य
    श्वेताम्भोरुहविष्टरः । ज्योत्स्नायमानाङ्गरुचिनिर्धूतान्तर्बहिस्तमाः ॥ ११६॥ भाव्यो भावयिता भद्रं पारिजातवनालयः
    । क्षीराब्धिमध्यमद्वीपपालकः प्रपितामहः ॥ ११७॥ निरन्तरनमोवाकशुद्धयाजिहदाश्रयः । मुक्तिदश्वेतमृद्रूपश्वेतद्वीपविभावनः
    ॥ ११८॥ गरुडाहारितश्वेतमृत्पूतयदुभूधरः । भद्राश्ववर्षनिलयो भयहारी शुभाश्रयः ॥ ११९॥ भद्रश्रीवत्सहाराढ्यः
    पञ्चरात्रप्रवर्तकः । भक्तात्मभावभवनो हार्दोऽङ्गुष्ठप्रमाणवान् ॥ १२०॥ स्वदाससत्कृताकृत्ये तन्मित्रारिषु
    योजयन् । प्राणानुत्क्रामयन्नूरीकृतप्रारब्धलोपनः ॥ १२१॥ लध्व्यैव शिक्षयापापमशेषमपि निर्णुदन् । त्रिस्थूणक्षोभतो
    भूतसूक्ष्म्यैस्सूक्ष्मवपुस्सृजन् ॥ १२२॥ निरङ्कुशकृपापूरो नित्यकल्याणकारकः । मूर्धन्यनाड्या स्वान्दासान्ब्रह्मरन्ध्रादुदञ्चयन्
    ॥ १२३॥ उपासनपरान्सर्वान् प्रारब्धमनुभावयन् । सर्वप्रारब्धदेहान्तेऽप्यन्तिमस्मरणं दिशन् ॥ १२४॥ प्रपेयुषां
    भेजुषां च यमदृष्टिमभावयन् । दिव्यदेहप्रदस्सूर्यं द्वारयन्मोक्षमेयुषाम् ॥ १२५॥ आतिवाहिकसत्कारानध्वन्यापाद्य
    मानयन् । सार्वान्क्रतुभुजश्शश्वत्प्राभृतानि प्रदापयन् ॥ १२६॥ दुरन्तमायाकान्तारं द्रुतं योगेन् लङ्घयन्
    । स्फायत्सुदर्शविविधवीथ्यन्तेनाध्वना नयन् ॥ १२७॥ सीमान्तसिन्धुविरजां योगेनोत्तारयन्वशी । अमानवस्य
    देवस्य करं शिरसि धारयन् ॥ १२८॥ अनादिवासनां धून्वन् वैकुण्ठाप्त्या सलोकयन् । अहेयमङ्गलोदारतनुदानात्सरूपयन
    ॥ १२९॥ सूरिजुष्टं सुखैकान्तं परमं पदमापयन् । अरारण्यामृताम्भोधी दर्शयन् श्रमनाशनः ॥ १३०॥ दिव्योद्यानसरोवापीसरिन्मणिनगान्नयन
    । ऐरम्मदामृतसरोगमयन्सूपबृंहणः ॥ १३१॥ अश्वत्थं सोमसवनं प्रापयन्विष्टरश्रवाः । दिव्याप्सरस्समानीतब्रह्मालङ्कारदायकः
    ॥ १३२॥ दिव्यवासोऽञ्जनक्षौममाल्यैस्स्वान्बहुमानयन् । स्वीयामयोध्यां नगरीं सादरं सम्प्रवेशयन् ॥ १३३॥
    दासान्दिव्यरसालोकगन्धांसलशरीरयन् । स्वदासान्सूरिवर्गेण सस्नेहं बहुमानयन् ॥ १३४॥ सूरिसेवोदितानन्दनैच्यान्स्वानतिशाययन्
    । वाचयन्स्वां नमोवीप्सां कुर्वन्प्रह्वान्कृताञ्जलीन् ॥ १३५॥ प्राकारगोपुरारामप्रासादेभ्यः प्रणामयन्
    । इन्द्रप्रजापतिद्वारपालसम्मानमापयन् ॥ १३६॥ मालिकाञ्चन्महाराजवीथीमध्यं निवासयन् । श्रीवैकुण्ठपुरन्ध्रीभिर्नानासत्कारकारकः
    ॥ १३७॥ दिव्यं विमानं गमयन् ब्रह्मकान्त्याभिपूरयन् । महानन्दात्मकश्रीमन्मणिमण्डपमापयन् ॥ १३८॥ हृष्यत्कुमुदचण्डाद्यैर्विष्वक्सेनान्तिकं
    नयन् । सेनेशचोदितास्थाननायको हेतिनायकः ॥ १३९॥ प्रापयन्दिव्यमास्थानं वैनतेयं प्रणामयन् । श्रीमत्सुन्दरसूरीन्द्रदिव्यपङ्क्तिं
    प्रणामयन् ॥ १४०॥ भास्वरासनपर्यङ्कप्रापणेन कृतार्थयन् । पर्यङ्कविद्यासंसिद्धसर्ववैभवसङ्गतः ॥ १४१॥ स्वात्मानमेव
    श्रीकान्तं सादरं भूरि दर्शयन् । शेषतैकरतिं शेषं शय्यात्मानं प्रणामयन् ॥ १४२॥ अनन्ताक्षिद्विसाहस्रसादरालोकपात्रयन्
    । अकुमारयुवाकारं श्रीकान्तं सम्प्रणामयन् ॥ १४३॥ अतटानन्दतो हेतो रञ्चयन्किलिकिञ्चितम् । दासानत्युत्थितमुहुःकृतिसृष्टिप्रसन्नहृत्
    ॥ १४४॥ श्रीयां प्रापस्वयं तातं जीवं पुत्रं प्रहर्षयन् । मज्जयन् स्वमुखाम्भोधौ स्वकां कीर्तिरुचिं दिशन्
    ॥ १४५॥ दयार्द्रगङ्गावलनाकृतह्लादैः कृतार्थयन् । पर्यङ्कारोहणप्रह्वं समं लक्ष्म्योपपादयन् ॥ १४६॥ कस्त्वमित्यनुयुञ्जानो
    दासोऽस्मीत्युक्तिविस्मितः । अपृथक्त्वप्रकारोऽस्मि वाचास्वाश्रितवद्भवन् ॥ १४७॥ विदुषां तत्क्रतुनयाद्धयास्यवपुषाभवन्
    । वासुदेवात्मना भूयो भवन्वैकुण्ठनायकः ॥ १४८॥ यथा तथैव स्वं रूपं जगन्मोहनमूर्तिमान् । द्विमूर्ती बहुमूर्तीश्च
    आत्मनश्च प्रकाशयन् ॥ १४९॥ युगपत्सकलं साक्षात्स्वतः कर्तुं समर्थयन् । कवीनामादिशन्नित्यं मुक्तानामादिमः
    कविः ॥ १५०॥ षडर्णमनुनिष्ठानां श्वेतद्वीपस्थितिं दिशन् । द्वादशाक्षरनिष्ठानां लोकं सान्तानिकं दिशन्
    ॥ १५१॥ अष्टाक्षरैकनिष्ठानां कार्यं वैकुण्ठमर्पयन् । शरणागतिनिष्ठानां साक्षाद्वैकुण्ठमर्पयन् ॥ १५२॥
    स्वमन्त्रराजनिष्ठानां स्वस्मार्दातेशयं दिशन् । श्रिया गाढोपगूढात्मा भूतधात्रीरुचिं दिशन् ॥ १५३॥ नीलाविभूतिव्यामुग्धो
    महाश्वेताश्वमस्तकः । त्र्यक्षस्त्रिपुरसंहारी रुद्रस्स्कन्दो विनायकः ॥ १५४॥ अजो विरिञ्चो द्रुहिणो व्याप्तमूर्तिरमूर्तिकः
    । असङ्गोऽनन्यधीसङ्गविहङ्गोवैरिभङ्गदः ॥ १५५॥ स्वामी स्वं स्वेन सन्तुप्यन् शक्रस्सर्वाधिकस्यदः । स्वयंज्योतिस्स्वयंवैद्यश्शूरश्शूरकुलोद्भवः
    ॥ १५६॥ वासवो वसुरण्योग्निर्वासुदेवस्सुहृद्वसुः । भूतो भावी भवन्भव्यो विष्णुस्थानस्सनातनः ॥ १५७॥ नित्यानुभावो
    नेदीयान्दवीयान्दुर्विभावनः । सनत्कुमारस्सन्धाता सुगन्धिस्सुखदर्शनः ॥ १५८॥ तीर्थं तितिक्षुस्तीर्थाङ्घ्रिस्तीर्थस्वादुशुभश्शुचिः
    । तीर्थवद्दीधितिस्तिग्मतेजास्तीव्रमनामयः ॥ १५९॥ ईशाद्युपनिषद्वेद्यः पञ्चोपनिषदात्मकः । ईडन्तःस्थोऽपि
    दूरस्थः कल्याणतमरूपवान् ॥ १६०॥ प्राणानां प्राणनः पूर्णज्ञानैरपि सुदुर्ग्रहः । नाचिकेतोपासनार्च्यस्त्रिमात्रप्रणवोदितः
    ॥ १६१॥ भूतयोनिश्च सर्वज्ञोऽक्षरोऽक्षरपरात्परः । अकारादिपदज्ञेयव्यूहतारार्थपूरुषः ॥ १६२॥ मनोमयामृतो
    नन्दमयो दहररूपदृत् । न्यासविद्यावेद्यरूपः आदित्यान्तर्हिरण्मयः ॥ १६३॥ इदन्द्र आत्मोद्गीथादि प्रतीको
    पासनान्वयी । मधुविद्योपासनीयो गायत्रीध्यानगोचरः ॥ १६४॥ दिव्यकौक्षेयसज्ज्योतिः शाण्डिल्योपास्तिवीक्षितः
    । संवर्गविद्यावेद्यात्मा तत् षोडशकलं परम् ॥ १६५॥ उपकोसलविद्येक्ष्यः पञ्चाग्न्यात्मशरीरकः । वैश्वानरः
    सदखेभूमा च जगत्कर्माऽऽदिपूरुषः ॥ १६६॥ मूर्तामूर्तब्रह्म सर्वप्रेष्ठोऽन्यप्रियताकरः । सर्वान्तरश्चापरोक्षश्चान्तर्याम्यमृतोऽनघः
    ॥ १६७॥ अहर्नामादित्यरूपश्चाहन्नामाक्षिसंश्रितः । सतुर्यगायत्र्यर्थश्च यथोपास्त्याप्यसद्वपुः ॥ १६८॥
    चन्द्रादिसायुज्यपूर्वमोक्षदन्यासगोचरः । न्यासनाश्यानभ्युपेतप्रारब्धांशो महादयः ॥ १६९॥ अवताररहस्यादिज्ञानिप्रारब्धनाशनः
    । स्वेन स्वार्थं परेणापि कृते न्यासे फलप्रदः ॥ १७०॥ असाहसोऽनपायश्रीस्सहायस्स श्रियै वसन् । श्रीमान्नारायणो
    वासुदेवोऽव्याद्विष्णुरुत्तमः ॥ १७१॥ ॥ ॐ ॥ इतीदं परमं गुह्यं सर्वपापप्रणाशनम् । वागीशनामसाहस्रं वत्स
    तेऽभिहितं मया ॥ १॥ य इदं श
