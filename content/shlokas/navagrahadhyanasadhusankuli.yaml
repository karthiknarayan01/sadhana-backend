id: navagrahadhyanasadhusankuli
category: stotram
name:
  english: navagrahadhyanasadhusankuli
  devanagari: नवग्रहध्यानसधुसन्कुलि
content:
  english: matreyam vaishyajatijam | kalankankitasarvangam keshapashatisundaram || mukutermanimanikyaih
    shobhaniyam tu locanam | yoshitpriyam mahanandam yamunajalasambhavam || umadhidaivatam devamapapratyadhidaivatam
    || hrim hrim hum somaya svaha | om meshadhirudham dvibhujam shakticapadharam muda | raktavarnam mahatejam
    tejasvinam samakulam || raktavastraparidhanam nanalankarasamyutam | raktangam dharaniputram raktamalyanulepanam
    || haste varahadashanam prishthe tunasamanvitam | katakshad bhitijanakam mahamohapradam mahat || mahacapadharam
    devam mahogramugravigraham | skandadidaivam suryasyam kshitipratyadhidaivatam || hrim om aim kujaya
    svaha | om sutaptasvarnabhatanum romarajivirajitam | dvibhujam svarnadandeva sharaccandranibhananam
    || carane ratnamanjiram kumaram shubhalakshanam | svarnayajnopavitanca pitavastrayugavritam || atrigotrasamutpannam
    vaishyajatim mahabalam | magadham mahimapurnam dvinetram dvibhujam shubham || narayanadhidaivanca
    vishnupratyadhidaivatam | cintayet somatanayam sarvabhishtaphalapradam || om klim om budhaya svaha
    | om kanakaruciragauram carumurtim prasannam dvibhujamapi sarajau samdadhanam surejyam | vasanayugadadhanam
    pitavastram subhadram suravaranarapujyamangirogotrayuktam || dvijavarakulajatam sindhudeshaprasiddham
    trijagati ganashreshthashcadhidaivam tadiyam | sakalagirinihanta indrah pratyadhidaivam grahaganagurunatham
    tam bhaje'bhishtasiddhau || ram yam hrim aim gurave namah | om shuklambaram shuklarucim sudiptam tusharakundendudyutim
    caturbhujam | indradhidaivam shacipratyadhidaivam vedarthavijnam ca kavim kavinam || bhrigugotrayuktam
    dvijajatimatram ditindrapujyam khalu shuddhishantam | sarvarthasiddhipradameva kavyam bhaje'pyaham
    bhojakatodbhavam bhrigum || hum hum shrim shrim nam ram shukraya svaha | om saurim gridhragatatikrishnavapusham
    kalagnivat sankulam samyuktam bhujapallavairupalasatstambhaishcaturbhih samaih | bhimam cogramahabalativapusham
    badhaganaih samyutam gotram kashyapajam surashtravibhavam kalagnidaivam shanim || vastraih krishnamayairyutam
    tanuvaram tam suryasunum bhaje || hrim klim shanaishcaraya namah | om mahishastham krishnam vadanamayavibhum
    karnanasakshimatram karalasyam bhimam gadavibhavayutam shyamavarnam mahogram | paithinam gotrayuktam
    ravishashidamanam cadhidaivam yamo'pi sarpapratyadhidaivatam malayagirbhavam tam tamasam namami ||
    vam aim vam vam klim vam tamase svaha | om mahogram dhumabham karacaranayutam chinnashirsham sudiptam
    haste vanam kripanam trishikhashashidhritam vedahastam prasannam | brahma tasyadhidaivam sakalagadayutam
    sarpapratyadhidaivam dhyayet ketum vishalam sakalasuranare shantidam pushtidanca || shrim shrim am
    vam ram lam ketave svaha |
  devanagari: मात्रेयं वैश्यजातिजम् । कलङ्काङ्कितसर्वाङ्गं केशपाशातिसुन्दरम् ॥ मुकुटेर्मणिमाणिक्यैः शोभनीयं
    तु लोचनम् । योषित्प्रियं महानन्दं यमुनाजलसम्भवम् ॥ उमाधिदैवतं देवमापप्रत्यधिदैवतम् ॥ ह्रीं ह्रीं हुं
    सोमाय स्वाहा । ॐ मेशाधिरूढं द्विभुजं शक्तिचापधरं मुदा । रक्तवर्णं महातेजं तेजस्वीनां समाकुलम् ॥ रक्तवस्त्रपरिधानम्
    नानालङ्कारसंयुतम् । रक्ताङ्गं धरणीपुत्रं रक्तमाल्यानुलेपनम् ॥ हस्ते वाराहदशनं पृष्ठे तूणसमन्वितम्
    । कटाक्षाद् भीतिजनकं महामोहप्रदं महत् ॥ महाचापधरं देवं महोग्रमुग्रविग्रहम् । स्कन्दादिदैवं सूर्यास्यं
    क्षितिप्रत्यधिदैवतम् ॥ ह्रीं ॐ ऐं कुजाय स्वाहा । ॐ सुतप्तस्वर्णाभतनुं रोमराजिविराजितम् । द्विभुजं
    स्वर्णदण्डेव शरच्चन्द्रनिभाननम् ॥ चरणे रत्नमञ्जीरं कुमारं शुभलक्षणम् । स्वर्णयज्ञोपवीतञ्च पीतवस्त्रयुगावृतम्
    ॥ अत्रिगोत्रसमुत्पन्नं वैश्यजातिं महाबलम् । मागधं महिमापूर्णं द्विनेत्रं द्विभुजं शुभम् ॥ नारायणाधिदैवञ्च
    विष्णुप्रत्यधिदैवतम् । चिन्तयेत् सोमतनयं सर्वाभिष्टफलप्रदम् ॥ ॐ क्लीं ॐ बुधाय स्वाहा । ॐ कनकरुचिरगौरं
    चारुमूर्तिं प्रसन्नं द्विभुजमपि सरजौ संदधानं सुरेज्यम् । वसनयुगदधानं पीतवस्त्रं सुभद्रं सुरवरनरपुज्यमङ्गिरोगोत्रयुक्तम्
    ॥ द्विजवरकुलजातं सिन्धुदेशप्रसिद्धं त्रिजगति गणश्रेष्ठश्चाधिदैवं तदीयम् । सकलगिरिनिहन्ता इन्द्रः प्रत्याधिदैवं
    ग्रहगणगुरुनाथं तं भजेऽभीष्टसिद्धौ ॥ रं यं ह्रीं ऐं गुरवे नमः । ॐ शुक्लाम्बरं शुक्लरुचिं सुदीप्तं तुषारकुन्देन्दुद्युतिं
    चतुर्भुजम् । इन्द्राधिदैवं शचीप्रत्याधिदैवं वेदार्थविज्ञं च कविं कवीनाम् ॥ भृगुगोत्रयुक्तं द्विजजातिमात्रं
    दितीन्द्रपूज्यं खलु शुद्धिशान्तम् । सर्वार्थसिद्धिप्रदमेव काव्यं भजेऽप्यहं भोजकतोद्भवं भृगुम् ॥ हुं
    हुं श्रीं श्रीं नं रं शुक्राय स्वाहा । ॐ सौरिं गृध्रगतातिकृष्णवपुषं कालाग्निवत् सङ्कुलं संयुक्तं भुजपल्लवैरुपलसत्स्तम्भैश्चतुर्भिः
    समैः । भीमं चोग्रमहाबलातिवपुषं बाधागणैः संयुतं गोत्रं काश्यपजं सुराष्ट्रविभवं कालाग्निदैवं शनिम् ॥
    वस्त्रैः कृष्णमयैर्युतं तनुवरं तं सूर्यसूनुं भजे ॥ ह्रीं क्लीम् शनैश्चराय नमः । ॐ महिषस्थं कृष्णं
    वदनमयविभुं कर्णनासाक्षिमात्रम् कारालास्यं भीमं गदविभवयुतं श्यामवर्णं महोग्रम् । पैठीनं गोत्रयुक्तं
    रविशशीदमनं चाधिदैवं यमोऽपि सर्पप्रत्यधिदैवतं मलयगीर्भावं तं तमसं नमामि ॥ वं ऐं वं वं क्लीं वं तमसे
    स्वाहा । ॐ महोग्रं धूमाभं करचरणयुतं छिन्नशीर्षं सुदीप्तम् हस्ते वाणं कृपाणं त्रिशिखशशिधृतं वेदहस्तं
    प्रसन्नम् । ब्रह्मा तस्याधिदैवं सकलगदयुतं सर्पप्रत्यधिदैवं ध्यायेत् केतुं विशालं सकलसुरनरे शान्तिदं
    पुष्टिदञ्च ॥ श्रीं श्रीं आं वं रं लं केतवे स्वाहा ।
