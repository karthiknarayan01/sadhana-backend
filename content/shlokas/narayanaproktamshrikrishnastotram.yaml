id: narayanaproktamshrikrishnastotram
category: stotram
name:
  english: narayanaproktamshrikrishnastotram
  devanagari: नारायणप्रोक्तंश्रीकृष्णस्तोत्रम्
content:
  english: rinu tvam kamaleshvari || 54|| om namo bhagavate rasamandaleshaya svaha | imam mantram kalpavriksham
    janihi shodasha'ksharam || 55|| goloke krishna ishaya dattavan ca tatah param | brahmane tu pura krishnah
    pushkare dattava~statha || 56|| kumaraya dattava~shca brahma lokapitamahah | brahmandapavanasya'sya
    kavacasya harih svayam || 57|| rishishchandashca gayatri devo'ham bhagavanharih | dhamarthakamamoksheshu
    viniyogah sada matah || 58|| trilakshavarajapanat sarvasiddhiprado bhavet | pranavo me shirah patu
    namo rameshvaraya ca || 59|| bhalam payannetrayugmam namo radheshvaraya ca | krishnah payacchrotrayugmam
    shriharirghranamityapi || 60|| jihvikam vahnijaya tu krishnaya sarvato namah | shrikrishnaya svaheti
    ca kashtham patu shadaksharah || 61|| hrim krishnaya namo vaktram klim purvashca bhujadvayam | namo
    gopanganeshaya skandhavashtaksharo'vatu || 62|| dantapanktimoshthayugmam namo gopishvaraya ca | om
    namo bhagavate rasamandaleshaya svaha || 63|| harirvakshahsthalam patu mantratma shodashaksharah |
    shrikrishnaya svaheti om karnayugmam sada'vatu || 64|| om vishnave svaheti ca kapolam sarvato'vatu
    | om haraye nama iti prishtham padau sada'vatu || 65|| om govardhanadharine svaha sarvasharirakam
    | pracyam mam patu shrikrishna agneyyam patu madhavah || 66|| dakshine patu gopisho nairrityam nandanandanah
    | varunyam patu govindo vayavyam radhikeshvarah || 67|| uttare patu rasesha aishanyamacyutah svayam
    | satatam sarvatah patu harirnarayanah svayam || 68|| gurumabhyarcya vidhivad vastralankaracandanaih
    | snatva tam ca namaskritya kavacam dharayet sudhih || 69|| kavacasya prasadena jivanmukto bhavennarah
    | yadi syat siddhakavaco vishnureva bhavet priye || 70|| asya pathanmahatpunyam sarvatirthaphalam
    bhavet | aputro labhate putramabharyo labhate satim || 71|| vidyarthi labhate vidyam dhanarthi dhanamapnuyat
    | bhrashtarajyo labhedrajyamaishvaryam siddhikamanah || 72|| rogarto mucyate rogadbaddho mucyeta bandhanat
    | bhaktim prapya hareshcante labhate dhama caksharam || 73|| iha loke sukham bhuktva kritva kirtim
    sudurlabham | parshadapravaro bhutva golokam dhama yati ca || 74|| evam gandharvapravarah upabarhanasamjnakah
    | reme kalavashesham ca tabhih patnibhiradarat || 75|| iti shrilakshminarayaniyasamhitayam prathame
    kritayugasantane 202
  devanagari: ृणु त्वं कमलेश्वरि ॥ ५४॥ ॐ नमो भगवते रासमण्डलेशाय स्वाहा । इमं मन्त्रं कल्पवृक्षं जानीहि
    षोडशाऽक्षरम् ॥ ५५॥ गोलोके कृष्ण ईशाय दत्तवान् च ततः परम् । ब्रह्मणे तु पुरा कृष्णः पुष्करे दत्तवाँस्तथा
    ॥ ५६॥ कुमाराय दत्तवाँश्च ब्रह्मा लोकपितामहः । ब्रह्माण्डपावनस्याऽस्य कवचस्य हरिः स्वयम् ॥ ५७॥ ऋषिश्छन्दश्च
    गायत्री देवोऽहं भगवान्हरिः । धमार्थकाममोक्षेषु विनियोगः सदा मतः ॥ ५८॥ त्रिलक्षवारजपनात् सर्वसिद्धिप्रदो
    भवेत् । प्रणवो मे शिरः पातु नमो रामेश्वराय च ॥ ५९॥ भालं पायान्नेत्रयुग्मं नमो राधेश्वराय च । कृष्णः
    पायाच्छ्रोत्रयुग्मं श्रीहरिर्घ्राणमित्यपि ॥ ६०॥ जिह्विकां वह्निजाया तु कृष्णाय सर्वतो नमः । श्रीकृष्णाय
    स्वाहेति च काष्ठं पातु षडक्षरः ॥ ६१॥ ह्रीं कृष्णाय नमो वक्त्रं क्लीं पूर्वश्च भुजद्वयम् । नमो गोपाङ्गनेशाय
    स्कन्धावष्टाक्षरोऽवतु ॥ ६२॥ दन्तपङ्क्तिमोष्ठयुग्मं नमो गोपीश्वराय च । ॐ नमो भगवते रासमण्डलेशाय स्वाहा
    ॥ ६३॥ हरिर्वक्षःस्थलं पातु मन्त्रात्मा षोडशाक्षरः । श्रीकृष्णाय स्वाहेति ॐ कर्णयुग्मं सदाऽवतु ॥ ६४॥
    ॐ विष्णवे स्वाहेति च कपोलं सर्वतोऽवतु । ॐ हरये नम इति पृष्ठं पादौ सदाऽवतु ॥ ६५॥ ॐ गोवर्धनधारिणे स्वाहा
    सर्वशरीरकम् । प्राच्यां मां पातु श्रीकृष्ण आग्नेय्यां पातु माधवः ॥ ६६॥ दक्षिणे पातु गोपीशो नैरृत्यां
    नन्दनन्दनः । वारुण्यां पातु गोविन्दो वायव्यां राधिकेश्वरः ॥ ६७॥ उत्तरे पातु रासेश ऐशान्यामच्युतः स्वयम्
    । सततं सर्वतः पातु हरिर्नारायणः स्वयम् ॥ ६८॥ गुरुमभ्यर्च्य विधिवद् वस्त्रालङ्कारचन्दनैः । स्नात्वा
    तं च नमस्कृत्य कवचं धारयेत् सुधीः ॥ ६९॥ कवचस्य प्रसादेन जीवन्मुक्तो भवेन्नरः । यदि स्यात् सिद्धकवचो
    विष्णुरेव भवेत् प्रिये ॥ ७०॥ अस्य पाठान्महत्पुण्यं सर्वतीर्थफलं भवेत् । अपुत्रो लभते पुत्रमभार्यो
    लभते सतीम् ॥ ७१॥ विद्यार्थी लभते विद्यां धनार्थी धनमाप्नुयात् । भ्रष्टराज्यो लभेद्राज्यमैश्वर्यं सिद्धिकामनः
    ॥ ७२॥ रोगार्तो मुच्यते रोगाद्बद्धो मुच्येत बन्धनात् । भक्तिं प्राप्य हरेश्चान्ते लभते धाम चाक्षरम्
    ॥ ७३॥ इह लोके सुखं भुक्त्वा कृत्वा कीर्तिं सुदुर्लभाम् । पार्षदप्रवरो भूत्वा गोलोकं धाम याति च ॥ ७४॥
    एवं गन्धर्वप्रवरः उपबर्हणसंज्ञकः । रेमे कालावशेषं च ताभिः पत्नीभिरादरात् ॥ ७५॥ इति श्रीलक्ष्मीनारायणीयसंहितायां
    प्रथमे कृतयुगसन्ताने २०२
