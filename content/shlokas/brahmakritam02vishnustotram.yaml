id: brahmakritam02vishnustotram
category: stotram
name:
  english: brahmakritam02vishnustotram
  devanagari: ब्रह्मकृतं०२विष्णुस्तोत्रम्
content:
  english: 20|| vikarabhedairbhagavamstvamevedam caracaram | katakadi yatha svarnam gunatrayavibhagashah
    || 21|| srashta srijyam tvamevatra poshta poshyam jagatprabho | adharo dhriyamanam ca dhartta tvam
    parameshvara || 22|| tvatpreritamatih sarvashcarate ca shubha'shubham | tatah prapnoti sadrishim tvayaiva
    vihitam gatim || 23|| jagato'sya gatirbhartta sakshi tvam parameshvara | caracaraguro sarvajivabhuta
    kripamaya | prasidadya jagannatha nityam tvaccharanyasya me || 24|| iti shriskandapurane vaishnavakhande
    purushottamajagannathamahatmye prathamadhyayantargatam brahmakritam vishnustotram samaptam | skandapurana
    | vaishnavakhanda | purushottamakhanda | adhyaya 1
  devanagari: २०॥ विकारभेदैर्भगवंस्त्वमेवेदं चराचरम् । कटकादि यथा स्वर्णं गुणत्रयविभागशः ॥ २१॥ स्रष्टा
    सृज्यं त्वमेवात्र पोष्टा पोष्यं जगत्प्रभो । आधारो ध्रियमाणं च धर्त्ता त्वं परमेश्वर ॥ २२॥ त्वत्प्रेरितमतिः
    सर्वश्चरते च शुभाऽशुभम् । ततः प्राप्नोति सदृशीं त्वयैव विहितां गतिम् ॥ २३॥ जगतोऽस्य गतिर्भर्त्ता साक्षी
    त्वं परमेश्वर । चराचरगुरो सर्वजीवभूत कृपामय । प्रसीदाद्य जगन्नाथ नित्यं त्वच्छरण्यस्य मे ॥ २४॥ इति
    श्रीस्कन्दपुराणे वैष्णवखण्डे पुरुषोत्तमजगन्नाथमाहात्म्ये प्रथमाध्यायान्तर्गतं ब्रह्मकृतं विष्णुस्तोत्रं
    समाप्तम् । स्कन्दपुराण । वैष्णवखण्ड । पुरुषोत्तमखण्ड । अध्याय १
