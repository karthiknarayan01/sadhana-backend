id: v-ishadrinathastotram
category: stotram
name:
  english: vṟishadrinathastotram
  devanagari: व्ऱिषाद्रिनाथस्तोत्रम्
content:
  english: shankya daushkamikam | tasmannarakaduhkhahetuduritam drishtva param duhkhyasi haha hanta tavapi
    duhkhavashatam dasyami lakshmivibho || 55|| papaniha maya kritani ganitum shakyani lakshmivibho sadyastani
    samuhya varaya kripadrishtya niratankaya | yadva tavakabhaktimeva paramam tannishkritim dehi me nopekshyashsharanagatah
    khalu dharanathasya satyatmanah || 56|| yadva durvacapapakrityaniratam mam raksha lakshmivibho vatsalyadigunodadhim
    mama gurum samvikshya sattvatmakam | kritva mayinirakritim tava mataprakhyatanirvahakam brahmendradikiritaratnasushamanirajitanghre
    hare || 57|| tvadyathatmyanibodhake manuvare nishtamavapyadarat onkararthamavetya tattvasasharananastannarashabdoditam
    artham cayanashabdavedyamamalam vyutpattiyugmepsitam muktassyadvibudhocitarthamapi vai jnani caturthiritam
    || 58|| lakshminatha paratmanashcidacitostattvasya rupam vidan sheshitvam bhavatashcaracaravibhoshsheshatvamapyatmanah
    | vaishamyam prakritervicaya sadupayopeyabhavat sudhih tvatpadau sharanam gatastaditaro sanmukto bhavetsantyajan
    || 59|| suktassampratipujitassuravarairbrahmadibhissamvrajan andam cavarananyatitya ca mahavyaktestakte
    ta ranvai tatah snatassan virajasarityatha bhajan divyollasadvigraham vaikuntham bhavataiva nandati
    samam shrisheshabhubhridvibho || 60|| sauvarnancitadivyavajraphalakapratyuptasalavrite bhavyottungasahasraratnakhacitastambhoddhrite
    mandape | devibhissaha samsthitam phanipaterbhoge phanalankrite dhyaye tvam dhritashankhacakramanagham
    samveshtitam suribhih || 61|| divyam tatpuradhamanamakapuradvarollasadgopuram bhasvatkotisamaprabham
    hridi sada dhyaye'njanadriprabho | tasmin ya viraja nadi pravahate tasyobhayoh parshvayoh sauvarnadrumapushpagucchasurabhinyudyanavrindani
    ca || 62|| hare surayaste pare dhamni samsthah namanto vadanteto bhavatkirtanani | pragiyayatha sama
    pradhiyanti kirtim vitanvanti nityam vicitram ca krityam || 63|| kvacitkirarupa hare surayaste pravakshyanti
    namani shakhivrajeshu | kvacidbhringarupa bhavanmalyagandhan samaghraya divyam pramodam labhante ||
    64|| tava paramapade vai surayah parshvayoste parishadi racayante dravidamnayaganam | iti yatikulanathashrishatharipramukhyah
    api ca guruvaraste mangalanyacaranti || 65|| shrisheshashailashikhare cidacidvishishtam shrisamshritorasamaparakripaikapatram
    | apadashirshamavalokya hare janastvam bhaktabhayaprada sadaiva mudam labhante || 66|| ammangivenkatacaryacaranambujasamshritah
    | cakara raghunatharyah sheshabhubhridvibhosstutim || || iti tirunandaḻvamsharaghunathacaryena kritam
    vrishadrinathastotram sampurnam||
  devanagari: शङ्क्य दौष्कामिकम् । तस्मान्नारकदुःखहेतुदुरितं दृष्ट्वा परं दुःख्यसि हाहा हन्त तवापि दुःखवशतां
    दास्यामि लक्ष्मीविभो ॥ ५५॥ पापानीह मया कृतानि गणितुं शक्यानि लक्ष्मीविभो सद्यस्तानि समुह्य वारय कृपादृष्ट्या
    निरातङ्कया । यद्वा तावकभक्तिमेव परमां तन्निष्कृतिं देहि मे नोपेक्ष्यश्शरणागतः खलु धरानाथस्य सत्यात्मनः
    ॥ ५६॥ यद्वा दुर्वचपापकृत्यनिरतं मं रक्ष लक्ष्मीविभो वात्सल्यादिगुणोदधिं मम गुरुं संवीक्ष्य सत्त्वात्मकम्
    । कृत्वा मायिनिराकृतिं तव मतप्रख्यातनिर्वाहकं ब्रह्मेन्द्रादिकिरीटरत्नसुषमानीराजिताङ्घ्रे हरे ॥ ५७॥
    त्वद्याथात्म्यनिबोधके मनुवरे निष्टामवाप्यादरात् ओङ्कारार्थमवेत्य तत्त्वसशरणाणस्तन्नारशब्दोदितम् अर्थं
    चायनशब्दवेद्यममलं व्युत्पत्तियुग्मेप्सितं मुक्तस्स्याद्विबुधोचितार्थमपि वै ज्ञानी चतुर्थीरितम् ॥ ५८॥
    लक्ष्मीनाथ परात्मनश्चिदचितोस्तत्त्वस्य रूपं विदन् शेषित्वं भवतश्चराचरविभोश्शेषत्वमप्यात्मनः । वैषम्यं
    प्रकृतेर्विचाय सदुपायोपेयभावात् सुधीः त्वत्पादौ शरणं गतस्तदितरो सन्मुक्तो भवेत्सन्त्यजन् ॥ ५९॥ सुक्तस्संप्रतिपूजितस्सुरवरैर्ब्रह्मादिभिस्संव्रजन्
    अण्डं चावरणान्यतीत्य च महाव्यक्तेस्तक्ते त रन्वै ततः स्नातस्सन् विरजासरित्यथ भजन् दिव्योल्लसद्विग्रहं
    वैकुण्ठं भवतैव नन्दति समं श्रीशेषभूभृद्विभो ॥ ६०॥ सौवर्णाञ्चितदिव्यवज्रफलकप्रत्युप्तसालावृते भव्योत्तुङ्गसहस्ररत्नखचितस्तम्भोद्धृते
    मण्डपे । देवीभिस्सह संस्थितं फणिपतेर्भोगे फणालङ्कृते ध्याये त्वां धृतशङ्खचक्रमनघं संवेष्टितं सूरिभिः
    ॥ ६१॥ दिव्यं तत्पुरधामनामकपुरद्वारोल्लसद्गोपुरं भास्वत्कोटिसमप्रभं हृदि सदा ध्यायेऽञ्जनाद्रिप्रभो
    । तस्मिन् या विरजा नदी प्रवहते तस्योभयोः पार्श्वयोः सौवर्णद्रुमपुष्पगुच्छसुरभीण्युद्यानवृन्दानि च
    ॥ ६२॥ हरे सूरयस्ते परे धाम्नि संस्थाः नमन्तो वदन्तेतो भवत्कीर्तनानि । प्रगीययाथ साम प्रधीयन्ति कीर्तिं
    वितन्वन्ति नित्यं विचित्रं च कृत्यम् ॥ ६३॥ क्वचित्कीररूपा हरे सूरयस्ते प्रवक्ष्यन्ति नामानि शाखिव्रजेषु
    । क्वचिद्भृङ्गरूपा भवन्माल्यगन्धान् समाघ्राय दिव्यं प्रमोदं लभन्ते ॥ ६४॥ तव परमपदे वै सूरयः पार्ष्वयोस्ते
    परिषदि रचयन्ते द्राविडाम्नायगानम् । इति यतिकुलनाथश्रीशठारिप्रमुख्याः अपि च गुरुवरास्ते मङ्गलान्याचरन्ति
    ॥ ६५॥ श्रीशेषशैलशिखरे चिदचिद्विशिष्टं श्रीसंश्रितोरसमपारकृपैकपात्रम् । आपादशीर्षमवलोक्य हरे जनास्त्वां
    भक्ताभयप्रद सदैव मुदं लभन्ते ॥ ६६॥ अम्मङ्गिवेङ्कटाचार्यचरणाम्बुजसंश्रितः । चकार रघुनाथार्यः शेषभूभृद्विभोस्स्तुतिम्
    ॥ ॥ इति तिरुनन्दाळ्वंशरघुनाथाचार्येण कृतं वृषाद्रिनाथस्तोत्रं संपूर्णम्॥
