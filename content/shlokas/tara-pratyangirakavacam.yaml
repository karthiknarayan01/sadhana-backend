id: tara-pratyangirakavacam
category: kavacha
name:
  english: tara pratyangirakavacam
  devanagari: तारा प्रत्यङ्गिराकवचम्
content:
  english: om tarayah stambhini devi mohini kshobhini tatha | hastini bhramini raudri samharanyapi tarini
    || 1|| shaktayohashtau kramadeta shatrupakshe niyojitah | dharita sadhakendrena sarvashatrunivarini
    || 2|| om stambhini strem strem mama shatrun stambhaya stambhaya || 3|| om kshobhini strem strem mama
    shatrun kshobhaya kshobhaya || 4|| om mohini strem strem mama shatrun mohaya mohaya || 5|| om jrimbhini
    strem strem mama shatrun jrimbhaya jrimbhaya || 6|| om bhramini strem strem mama shatrun bhramaya
    bhramaya || 7|| om raudri strem strem mama shatrun santapaya santapaya || 8|| om samharini strem strem
    mama shatrun samharaya samharaya || 9|| om tarini strem strem sarvapadbhyah sarvabhutebhyah sarvatra
    raksha raksha mam svaha || 10|| ya imam dharayet vidyam trisandhyam vapi yah pathet | sa duhkham duratastyaktva
    hyanyacchtrun na samshayah || 11|| rane rajakule durge mahabhaye vipattishu | vidya pratyangira hyesha
    sarvato rakshayennaram || 12|| anaya vidyaya raksham kritva yastu pathet sudhi | mantraksharamapi
    dhyayan cintayet nilasarasvatim | acire naiva tasyasan karastha sarvasiddhayah om hrim ugratarayai
    nilasarasvatyai namah || 13|| imam stavam dhiyano nityam dharayennarah | sarvatah sukhamapnoti sarvatrajayamapnuyat
    || 14|| nakkapi bhayamapnoti sarvatrasukhamapnuyat || 15|| iti rudrayamale shrimadugrataraya pratyangira
    kavacam samaptam ||
  devanagari: ॐ तारायाः स्तम्भिनी देवी मोहिनी क्षोभिनी तथा । हस्तिनी भ्रामिणी रौद्री संहारण्यापि तारिणी
    ॥ १॥ शक्तयोहष्टौ क्रमादेता शत्रुपक्षे नियोजिताः । धारिता साधकेन्द्रेण सर्वशत्रुनिवारिणी ॥ २॥ ॐ स्तम्भिनी
    स्त्रें स्त्रें मम शत्रून् स्तम्भय स्तम्भय ॥ ३॥ ॐ क्षोभिणी स्त्रें स्त्रें मम शत्रून् क्षोभय क्षोभय
    ॥ ४॥ ॐ मोहिनी स्त्रें स्त्रें मम शत्रून् मोहय मोहय ॥ ५॥ ॐ जृम्भिणी स्त्रें स्त्रें मम शत्रून् जृम्भय
    जृम्भय ॥ ६॥ ॐ भ्रामिनी स्त्रें स्त्रें मम शत्रून् भ्रामय भ्रामय ॥ ७॥ ॐ रौद्री स्त्रें स्त्रें मम शत्रून्
    सन्तापय सन्तापय ॥ ८॥ ॐ संहारिणी स्त्रें स्त्रें मम शत्रून् संहारय संहारय ॥ ९॥ ॐ तारिणी स्त्रें स्त्रें
    सर्वपद्भ्यः सर्वभूतेभ्यः सर्वत्र रक्ष रक्ष मां स्वाहा ॥ १०॥ य इमां धारयेत् विद्यां त्रिसन्ध्यं वापि
    यः पठेत् । स दुःखं दूरतस्त्यक्त्वा ह्यन्याच्छ्त्रून् न संशयः ॥ ११॥ रणे राजकुले दुर्गे महाभये विपत्तिषु
    । विद्या प्रत्यङ्गिरा ह्येषा सर्वतो रक्षयेन्नरम् ॥ १२॥ अनया विद्यया रक्षां कृत्वा यस्तु पठेत् सुधी
    । मन्त्राक्षरमपि ध्यायन् चिन्तयेत् नीलसरस्वतीम् । अचिरे नैव तस्यासन् करस्था सर्वसिद्धयः ॐ ह्रीं उग्रतारायै
    नीलसरस्वत्यै नमः ॥ १३॥ इमं स्तवं धीयानो नित्यं धारयेन्नरः । सर्वतः सुखमाप्नोति सर्वत्रजयमाप्नुयात्
    ॥ १४॥ नक्कापि भयमाप्नोति सर्वत्रसुखमाप्नुयात् ॥ १५॥ इति रुद्रयामले श्रीमदुग्रताराया प्रत्यङ्गिरा कवचं
    समाप्तम् ॥
