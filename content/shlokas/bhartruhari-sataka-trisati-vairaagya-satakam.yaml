id: bhartruhari-sataka-trisati-vairaagya-satakam
category: stotram
name:
  english: Bhartruhari Sataka Trisati - Vairaagya Satakam
content:
  english: cudottamsitacandracarukalikacancacchikhabhasvaro liladagdhavilolakamashalabhah shreyodashagre
    sphuran | antahsphurjad aparamohatimirapragbharam uccatayan cetahsadmani yoginam vijayate jnanapradipo
    harah || || bhrantam desham anekadurgavishamam praptam na kincitphalam tyaktva jatikulabhimanam ucitam
    seva krita nishphala | bhuktam manavivarjitam paragriheshvashankaya kakavat trishne jrimbhasi papakarmapishune
    nadyapi santushyasi || || utkhatam nidhishankaya kshititalam dhmata girerdhatavo nistirnah saritam
    patirnripatayo yatnena santoshitah | mantraradhanatatparena manasa nitah shmashane nishah praptah
    kanavaratako'pi na maya trishne sakama bhava || || khalalapah sodhah katham api tad aradhanaparairnigrihyantar
    bashpam hasitam api shunyena manasa | krito vittastambhapratihatadhiyam anjalirapi tvam ashe moghashe
    kima aparam ato nartayasi mam || || amisham prananam tulitavisinipatrapayasam krite kim nasmabhirvigalitavivekairvyavasitam
    | yad adhyanam agre dravinamadanihsanjnamanasam kritam vitavridairnijagunakathapatakam api || || kshantam
    na kshamaya grihocitasukham tyaktam na santoshatah sodho duhsahashitatapapavanaklesho na taptam tapah
    | dhyatam vittam aharnisham nityamitapranairna shambhoh padam tattatkarma kritam yadeva munibhistaistaih
    phalairvancitah || || bhoga na bhukta vayam eva bhuktas tapo na taptam vayam eva taptah | kalo na
    yato vayam eva yatastrishna na jirna vayam eva jirnah || || balibhirmukham akrantam palitenankitam
    shirah | gatrani shithilayante trishnaika tarunayate || || vivekavyakoshe vidadhati same shamyati
    trisha parishvange tunge prasaratitaram sa parinata | jarajirnaishvaryagrasanagahanakshepakripanastrishapatram
    yasyam bhavati marutam apyadhipatih || || nivritta bhogeccha purushabahumano'pi galitah samanah svaryatah
    sapadi suhrido jivitasamah | shanairyashtyutthanam ghanatimiraruddhe ca nayane aho mudhah kayastadapi
    maranapayacakitah || || asha nama nadi manorathajala trishnatarangakula ragagrahavati vitarkavihaga
    dhairyadrumadhvamsini | mohavartasudustaratigahana prottungacintatati tasyah paragata vishuddhamanaso
    nandanti yogishvarah || || na samsarotpannam caritam anupashyami kushalam vipakah punyanam janayati
    bhayam me vimrishatah | mahadbhih punyaughaishciraparigrihitashca vishaya mahanto jayante vyasanam
    iva datum vishayinam || || avashyam yatarashcirataram ushitvapi vishaya viyoge ko bhedastyajati na
    jano yatsvayam amun | vrajantah svatantryadatulaparitapaya manasah svayam tyakta hyete shamasukham
    anantam vidadhati || || brahmajnanavivekanirmaladhiyah kurvantyaho dushkaram yanmuncantyupabhogabhanjyapi
    dhananyekantato nihsprihah | sampraptanna pura na samprati na ca praptau dridhapratyayan vanchamatraparigrahanapi
    param tyaktum na shakta vayam || || dhanyanam girikandareshu vasatam jyotih param dhyayatamanandashru
    jalam pibanti shakuna nihshankam ankeshayah | asmakam tu manorathoparacitaprasadavapitatakrida kananakelikautukajusham
    ayuh param kshiyate || || bhikshashanam tadapi nirasam ekavaram shayya ca bhuh parijano nijadehamatram
    | vastram vishirnashatakhandamayi ca kantha ha ha tathapi vishaya na parityajanti || || stanau mamsagranthi
    kanakakalashavityupamitau mukham shleshmagaram tadapi ca shashankena tulitam | sravanmutraklinnam
    karivarashiraspardhi jaghanam muhurnindyam rupam kavijanavisheshairgurukritam || || eko ragishu rajate
    priyatamadehardhahari haro nirageshu jano vimuktalalanasango na yasmatparah | durvarasmarabanapannagavishavyaviddhamugdho
    janah sheshah kamavidambitanna vishayanbhoktum na moktum kshamah || || ajanandahatmyam patatu shalabhastivradahane
    sa mino'pyajnanadbadishayutam ashnatu pishitam | vijananto'pyete vayam iha vipajjalajatilan na muncamah
    kaman ahaha gahano mohamahima || || trisha shushyatyasye pibati salilam shitamadhuram kshudhartah
    shalyannam kavalayati mamsadikalitam | pradipte kamagnau sudridhataram alingati vadhum pratikaram
    vyadheh sukham iti viparyasyati janah || || tungam veshma sutah satam abhimatah sankhyatigah sampadah
    kalyani dayita vayashca navam ityajnanamudho janah | matva vishvam anashvaram nivishate samsarakaragrihe
    sandrishya kshanabhanguram tadakhilam dhanyastu sannyasyati || || dina dinamukhaih sadaiva shishukairakrishtajirnambara
    kroshadbhih kshudhitairnirannavidhura drishya na cedgehini | yacnabhangabhayena gadgadagalatrutyadvilinaksharam
    ko dehiti vadetsvadagdhajatharasyarthe manasvi puman || || abhimatamahamanagranthiprabhedapatiyasi
    gurutaragunagramambhojasphutojjvalacandrika | vipulavilasallajjavallivitanakutharika jatharapithari
    dushpureyam karoti vidambanam || || punye grame vane va mahati sitapatacchannapali kapalim hyadaya
    nyayagarbhadvijahutahutabhugdhumadhumropakanthe | dvaram dvaram pravishto varam udaradaripuranaya
    kshudharto mani pranaih sanatho na punaranudinam tulyakulyeshu dinah || || gangatarangakanashikarashitalani
    vidyadharadhyushitacarushilatalani | sthanani kim himavatah pralayam gatani yatsavamanaparapindarata
    manushyah || || kim kandah kandarebhyah pralayam upagata nirjhara va giribhyah pradhvasta va tarubhyah
    sarasaphalabhrito valkalinyashca shakhah | vikshyante yanmukhani prasabham apagataprashrayanam khalanam
    duhkhaptasvalpavittasmayapavanavashannartitabhrulatani || || punyairmulaphalaistatha pranayinim vrittim
    kurushvadhuna bhushayyam navapallavairakripanairuttishtha yavo vanam | kshudranam avivekamudhamanasam
    yatreshvaranam sada vittavyadhivikaravihvalagiram namapi na shruyate || || phalam svecchalabhyam prativanam
    akhedam kshitiruham payah sthane sthane shishiramadhuram punyasaritam | mridusparsha shayya sulalitalatapallavamayi
    sahante santapam tadapi dhaninam dvari kripanah || || ye vartante dhanapatipurah prarthanaduhkhabhajo
    ye calpatvam dadhati vishayakshepaparyaptabuddheh | tesham antahsphuritahasitam vasarani smareyam
    dhyanacchede shikharikuharagravashayyanishannah || || ye santoshanirantarapramuditastesham na bhinna
    mudo ye tvanye dhanalubdhasankuladhiyastesham na trishnahata | ittham kasya krite kutah sa vidhina
    kidrikpadam sampadam svatmanyeva samaptahemamahima merurna me rocate || || bhikshaharam adainyam apratisukham
    bhiticchidam sarvato durmatsaryamadabhimanamathanam duhkhaughavidhvamsanam | sarvatranvaham aprayatnasulabham
    sadhupriyam pavanam shambhoh satram avaryam akshayanidhim shamsanti yogishvarah || || bhoge rogabhayam
    kule cyutibhayam vitte nripaladbhayam mane dainyabhayam bale ripubhayam rupe jaraya bhayam | shastre
    vadibhayam gune khalabhayam kaye kritantadbhayam sarvam vastu bhayanvitam bhuvi nrinam vairagyamevabhayam
    || || akrantam maranena janma jarasa catyujjvalam yauvanam santosho dhanalipsaya shamasukham praudhanganavibhramaih
    | lokairmatsaribhirguna vanabhuvo vyalairnripa durjanair asthairyena vibhutayo'pyapahata grastam na
    kim kena va || || adhivyadhishatairjanasya vividhairarogyam unmulyate lakshmiryatra patanti tatra
    vivritadvara iva vyapadah | jatam jatam avashyam ashu vivasham mrityuh karotyatmasat tatkim tena nirankushena
    vidhina yannirmitam susthiram || || bhogastungatarangabhangataralah pranah kshanadhvamsinah stokanyeva
    dinani yauvanasukham sphurtih priyasu sthita | tatsamsaram asaram eva nikhilam buddhva budha bodhaka
    lokanugrahapeshalena manasa yatnah samadhiyatam || || bhoga meghavitanamadhyavilasatsaudaminicancala
    ayurvayuvighattitabjapatalilinambuvadbhanguram | lila yauvanalalasastanubhritam ityakalayya drutam
    yoge dhairyasamadhisiddhisulabhe buddhim vidadhvam budhah || || ayuh kallolalolam katipayadivasasthayini
    yauvanashrih arthah sankalpakalpa ghanasamayatadidvibhrama bhogapugah | kanthashleshopagudham tadapi
    ca na ciram yatpriyabhih pranitam brahmanyasaktacitta bhavata bhavabhayambhodhiparam taritum || ||
    kricchrenamedhyamadhye niyamitatanubhih sthiyate garbhavase kantavishleshaduhkhavyatikaravishamo yauvane
    copabhogah | vamakshinam avajnavihasitavasatirvriddhabhavo'pyasadhuh samsare re manushya vadata yadi
    sukham svalpam apyasti kincit || || vyaghriva tishthati jara paritarjayanti rogashca shatrava iva
    praharanti deham | ayuh parisravati bhinnaghatadivambho lokastathapyahitam acaratiti citram || ||
    bhoga bhanguravrittayo bahuvidhastaireva cayam bhavastat kasyeha krite paribhramata re lokah kritam
    ceshtitaih | ashapashashatopashantivishadam cetahsamadhiyatam kamotpattivashatsvadhamani yadi shraddheyam
    asmadvacah || || sakhe dhanyah kecittrutitabhavabandhavyatikara vanante cittantarvishamavishayashivishagatah
    | sharaccandrajyotsnadhavalagaganabhogasubhagam nayante ye ratrim sukritacayacintaikasharanah || ||
    brahmendradimarudganamstrinakananyatra sthito manyate yatsvadadvirasa bhavanti vibhavastrailokyarajyadayah
    | bhogah ko'pi sa eva ekah paramo nityodito jrimbhate bhoh sadho kshanabhangure taditare bhoge ratim
    ma krithah || || sa ramya nagari mahansa nripatih samantacakram ca tat parshve tasya ca sa vidagdhaparishattashcandrabimbananah
    | udvrittah sa rajaputranivahaste vandinastah kathah sarvam yasya vashadagatsmritipatham kalaya tasmai
    namah || || yatranekah kvacidapi grihe tatra tishthatyathaiko yatrapyekastadanu bahavastatra naiko'pi
    cante | ittham neyau rajanidivasau lolayandvavivakshau kalah kalyo bhuvanaphalake kridati pranisharaih
    || || adityasya gatagatairaharahah sankshiyate jivitam vyaparairbahukaryabharagurubhih kalo'pi na
    jnayate | drishtva janmajaravipattimaranam trasashca notpadyate pitva mohamayim pramadamadiram unmattabhutam
    jagat || || ratrih saiva punah sa eva divaso matva mudha jantavo dhavantyudyaminastathaiva nibhritaprarabdhatattatkriyah
    | vyaparaih punar uktabhutavishayairittham vidhenamuna samsarena kadarthita vayam aho mohanna lajjamahe
    || || na dhyatam padam ishvarasya vidhivatsamsaravicchittaye svargadvarakapatapatanapaturdharmo'pi
    noparjitah | naripinapayodharoruyugalam svapne'pi nalingitam matuh kevalam eva yauvanavanacchede kuthara
    vayam || || nabhyasta prativadivrindadamani vidya vinitocita khadgagraih karikumbhapithadalanairnakam
    na nitam yashah | kantakomalapallavadhararasah pito na candrodaye tarunyam gatam eva nishphalam aho
    shunyalaye dipavat || || vidya nadhigata kalankarahita vittam ca noparjitam shushrushapi samahitena
    manasa pitrorna sampadita | alolayatalocanah priyatamah svapne'pi nalingitah kalo'yam parapindalolupataya
    kakairiva preryate || || vayam yebhyo jatashciraparigata eva khalu te samam yaih samvriddhah smritivishayatam
    te'pi gamitah | idanim ete smah pratidivasam asannapatana gatastulyavastham sikatilanaditiratarubhih
    || || ayurvarshashatam nrinam parimitam ratrau tad ardham gatam tasyardhasya parasya cardham aparam
    balatvavriddhatvayoh | shesham vyadhiviyogaduhkhasahitam sevadibhirniyate jive varitarangacancalatare
    saukhyam kutah praninam || || kshanam balo bhutva kshanam api yuva kamarasikah kshanam vittairhinah
    kshanam api ca sampurnavibhavah | jarajirnairangairnata iva valimanditatanur narah samsarante vishati
    yamadhaniyavanikam || || tvam raja vayam apyupasitaguruprajnabhimanonnatah khyatastvam vibhavairyashamsi
    kavayo dikshu pratanvanti nah | ittham manadhanatiduram ubhayorapyavayorantaram yadyasmasu paranmukho'si
    vayam apyekantato nihsprihah || || arthanam ishishe tvam vayam api ca giram ishmahe yavadartham shurastvam
    vadidarpavyupashamanavidhavakshayam patavam nah | sevante tvam dhanadhya matimalahataye mam api shrotukamah
    | mayyapyastha na te cettvayi mama nitaram eva rajannanastha || || vayam iha paritushta valkalaistvam
    dukulaih sama iha paritosho nirvishesho visheshah | sa tu bhavatu daridro yasya trishna vishala manasi
    ca paritushte ko'rthavanko daridrah || || phalam alam ashanaya svadu panaya toyam kshitirapi shayanartham
    vasase valkalam ca | navadhanamadhupanabhrantasarvendriyanam avinayam anumantum notsahe durjananam
    || || ashnimahi vayam bhiksham ashavaso vasimahi | shayimahi mahiprishthe kurvimahi kim ishvaraih
    || || na nata na vita na gayaka na ca sabhyetaravadacuncavah | nripam ikshitum atra ke vayam stanabharanamita
    na yoshitah || || vipulahridayairishairetajjagajjanitam pura vidhritam aparairdattam canyairvijitya
    trinam yatha | iha hi bhuvananyanyairdhirashcaturdasha bhunjate katipayapurasvamye pumsam ka esha
    madajvarah || || abhuktayam yasyam kshanam api na yatam nripashatair bhuvastasya labhe ka iva bahumanah
    kshitibhritam | tad avayavaleshe'pi patayo vishade kartavye vidadhati jadah pratyuta mudam || || mritpindo
    jalarekhaya valayitah sarvo'pyayam nanvanuh svamshikritya sa eva sangarashatai rajnam gana bhunjate
    | ye dadyurdadato'thava kim aparam kshudra daridra bhrisham dhigdhiktanpurushadhamandhanakananvanchanti
    tebhyo'pi ye || || sa jatah ko'pyasinmadanaripuna murdhni dhavalam kapalam yasyoccairvinihitam alankaravidhaye
    | nribhih pranatranapravanamatibhih kaishcidadhuna namadbhih kah pumsam ayam atuladarpajvarabharah
    || || paresham cetamsi pratidivasam aradhya bahudha prasadam kim netum vishasi hridaya kleshakalitam
    | prasanne tvayyantahsvayamuditacintamanigano viviktah sankalpah kim abhilashitam pushyati na te ||
    || satyam eva trilokisariti harashirashcumbinivacchatayam sadvrittim kalpayantyam vatavitapabhavairvalkalaih
    satphalaishca | ko'yam vidvanvipattijvarajanitarujativaduhkhasikanam vaktram viksheta duhsthe yadi
    hi na vibhriyatsve kutumbe'nukampam || || paribhramasi kim mudha kvacana citta vishramyatam svayam
    bhavati yadyatha bhavati tattatha nanyatha | atitam ananusmarannapi ca bhavyasankalpayannatarkita
    samagamananubhavami bhoganaham || || etasmadviramendriyarthagahanadayasakadashrayashreyo margam asheshaduhkhashamanavyaparadaksham
    kshanat | svatmibhavam upaihi santyaja nijam kallolalolam gatim ma bhuyo bhaja bhanguram bhavaratim
    cetah prasidadhuna || || moham marjaya tam uparjaya ratim candrardhacudamanau cetah svargataranginitatabhuvam
    asangam angikuru | ko va vicishu budbudeshu ca tadillekhasu ca shrishu ca jvalagreshu ca pannageshu
    saridvegeshu ca pratyayah || || cetashcintaya ma ramam sakridimam asthayinim asthaya bhupalabhrukutikutiviharanavyaparapanyanganam
    | kanthakancukinah pravishya bhavanadvarani varanasirathya panktishu panipatrapatitam bhiksham apekshamahe
    || || agre gitam sarasakavayah parshvayordakshinatyah pashcallilavalayaranitam camaragrahininam |
    yadyastyevam kuru bhavarasasvadane lampatatvam no ceccetah pravisha sahasa nirvikalpe samadhau ||
    || praptah shriyah sakalakamadughastatah kim nyastam padam shirasi vidvishatam tatah kim | sampaditah
    pranayino vibhavaistatah kim kalpam sthitastanubhritam tanavastatah kim || || bhaktirbhave maranajanmabhayam
    hridistham sneho na bandhushu na manmathaja vikarah | samsarga dosharahita vijana vananta vairagyam
    asti kim itah paramarthaniyam || || tasmadanantam ajaram paramam vikasi tadbrahma cintaya kim ebhirasadvikalpaih
    | yasyanushangina ime bhuvanadhipatyabhogadayah kripanalokamata bhavanti || || patalam avishasi yasi
    nabho vilanghya dinmandalam bhramasi manasa capalena | bhrantyapi jatu vimalam katham atmaninam na
    brahma samsmarasi nirvritim eshi yena || || kim vedaih smritibhih puranapathanaih shastrairmahavistaraih
    svargagramakutinivasaphaladaih karmakriyavibhramaih | muktvaikam bhavaduhkhabhararacanavidhvamsakalanalam
    svatmanandapadapraveshakalanam sheshairvanigvrittibhih || || nayam te samayo rahasyam adhuna nidrati
    natho yadi sthitva drakshyati kupyati prabhuriti dvareshu yesham vacah | cetastanapahaya yahi bhavanam
    devasya vishveshitur nirdauvarikanirdayokty aparusham nihsimasharmapradam || || yato meruh shrimannipatati
    yugantagnivalitah samudrah shushyanti pracuramakaragrahanilayah | dhara gacchatyantam dharanidharapadairapi
    dhrita sharire ka varta karikalabhakarnagracapale || || gatram sankucitam gatirvigalita bhrashta ca
    dantavalir drishtirnashyati vardhate badhirata vaktram ca lalayate | vakyam nadriyate ca bandhavajano
    bharya na shushrushate ha kashtam purushasya jirnavayasah putro'pyamitrayate || || varnam sitam shirasi
    vikshya shiroruhanam sthanam jaraparibhavasya tada pumamsam | aropitasthishatakam parihritya yanti
    candalakupam iva durataram tarunyah || || yavatsvastham idam shariram arujam yavacca dure jara yavaccendriyashaktirapratihata
    yavatkshayo nayushah | atmashreyasi tavadeva vidusha karyah prayatno mahan sandipte bhavane tu kupakhananam
    pratyudyamah kidrishah || || tapasyantah santah kim adhinivasamah suranadim gunodarandaranuta paricaramah
    savinayam | pibamah shastraughanutavividhakavyamritarasan na vidmah kim kurmah katipayanimeshayushi
    jane || || duraradhyashcami turagacalacittah kshitibhujo vayam tu sthulecchah sumahati phale baddhamanasah
    | jara deham mrityurharati dayitam jivitam idam sakhe nanyacchreyo jagati vidusho'nyatra tapasah ||
    || mane mlayini khandite ca vasuni vyarthe prayate'rthini kshine bandhujane gate parijane nashte shanairyauvane
    | yuktam kevalam etadeva sudhiyam yajjahnukanyapayahputagrava girindrakandaratatikunje nivasah kvacit
    || || ramyashcandramaricayastrinavati ramya vanantasthali ramyam sadhusamagamagatasukham kavyeshu
    ramyah kathah | kopopahitabashpabindutaralam ramyam priyaya mukham sarvam ramyam anityatam upagate
    citte na kincitpunah || || ramyam harmyatalam na kim vasataye shravyam na geyadikam kim va pranasamasamagamasukham
    naivadhikapritaye | kintu bhrantapatangapakshapavanavyaloladipankuracchaya cancalam akalayya sakalam
    santo vanantam gatah || || a samsarattribhuvanam idam cinvatam tata tadrinnaivasmakam nayanapadavim
    shrotramargam gato va | yo'yam dhatte vishayakarino gadhagudhabhimanakshivasyantah vishayakarinigadhagudhabhimanakshivasyantah
    karanakarinah samyamalanalilam || || yadetatsvacchandam viharanam akarpanyam ashanam saharyaih samvasah
    shrutam upashamaikavrataphalam | mano mandaspandam bahirapi cirasyapi vimrishanna jane kasyaisha parinatirudarasya
    tapasah || || jirna eva manorathashca hridaye yatam ca tadyauvanam hantangeshu gunashca vandhyaphalatam
    yata gunajnairvina | kim yuktam sahasabhyupaiti balavankalah kritanto'kshami ha jnatam madanantakanghriyugalam
    muktvasti nanya gatih || || maheshvare va jagatam adhishvare janardane va jagad antaratmani | na vastubhedapratipattirasti
    me tathapi bhaktistarunendushekhare || || sphuratspharajyotsnadhavalitatale kvapi puline sukhasinah
    shantadhvanishu rajanishu dyusaritah | bhavabhogodvignah shiva shiva shivetyuccavacasah kada yasyamo'ntargatabahulabashpakuladasham
    || || mahadevo devah saridapi ca saisha surasaridguha evagaram vasanam api ta eva haritah | suhrida
    kalo'yam vratam idam adainyavratam idam kiyadva vakshyamo vatavitapa evastu dayita || || vitirne sarvasve
    tarunakarunapurnahridayah smarantah samsare vigunaparinamam vidhigatim | vayam punyaranye parinatasharaccandrakiranas
    triyama neshyamo haracaranacintaikasharanah || || kada varanasyam amaratatinirodhasi vasan vasanah
    kaupinam shirasi nidadhano'njaliputam | aye gaurinatha tripurahara shambho trinayana prasidetyakroshannimisham
    iva neshyami divasan || || udyaneshu vicitrabhojanavidhistivratitivram tapah kaupinavaranam suvastram
    amitam bhikshatanam mandanam | asannam maranam ca mangalasamam yasyam samutpadyate tam kashim parihritya
    hanta vibudhairanyatra kim sthiyate || || snatva gangaih payobhih shucikusumaphalairarcayitva vibho
    tvam dhyeye dhyanam niveshya kshitidharakuharagravaparyankamule | atmaramah phalashi guruvacanaratastvatprasadatsmarare
    duhkham mokshye kadaham samakaracarane pumsi sevasamuttham || || ekaki nihsprihah shantah panipatro
    digambarah | kada shambho bhavishyami karmanirmulanakshamah || || panim patrayatam nisargashucina
    bhaikshena santushyatam yatra kvapi nishidatam bahutrinam vishvam muhuh pashyatam | atyage'pi tanorakhandaparamanandavabodhasprisha
    madhva ko'pi shivaprasadasulabhah sampatsyate yoginam || || kaupinam shatakhandajarjarataram kantha
    punastadrishi naishcintyam nirapekshabhaikshyam ashanam nidra shmashane vane | svatantryena nirankusham
    viharanam svantam prashantam sada sthairyam yogamahotsave'pi ca yadi trailokyarajyena kim || || brahmandam
    mandalimatram kim lobhaya manasvinah | shapharisphuritenabdhih kshubdho na khalu jayate || || matarlakshmi
    bhajasva kancidaparam matkankshini ma sma bhur bhogeshu sprihayalavastava vashe ka nihsprihanam asi
    | sadyah syutapalashapatraputikapatraih pavitrikritair bhikshavastubhireva samprati vayam vrittim
    samihamahe || || mahashayya prithvi vipulam upadhanam bhujalata vitanam cakasham vyajanam anukulo'yam
    anilah | sharaccandro dipo virativanitasangamuditah sukhi shantah shete muniratanubhutirnripa iva
    || || bhikshashi janamadhyasangarahitah svayattaceshtah sada hanadanaviraktamarganiratah kashcittapasvi
    sthitah | rathyakirnavishirnajirnavasanah sampraptakanthasano nirmano nirahankritih shamasukhabhogaikabaddhasprihah
    || || candalah kim ayam dvijatirathava shudro'tha kim tapasah kim va tattvavivekapeshalamatiryogishvarah
    ko'pi kim | ityutpannavikalpajalpamukharairabhashyamana janair na kruddhah pathi naiva tushtamanaso
    yanti svayam yoginah || || himsashunyam ayatnalabhyam ashanam dhatra marutkalpitam vyalanam pashavastrinankurabhujastushtah
    sthalishayinah | samsararnavalanghanakshamadhiyam vrittih krita sa nrinam tam anveshayatam prayanti
    satatam sarvam samaptim gunah || || gangatire himagirishilabaddhapadmasanasya brahmadhyanabhyasanavidhina
    yoganidram gatasya | kim tairbhavyam mama sudivasairyatra te nirvishankah kanduyante jarathaharinah
    svangam ange madiye || || jirna kantha tatah kim sitam amalapatam pattasutram tatah kim eka bharya
    tatah kim hayakarisuganairavrito va tatah kim | bhaktam bhuktam tatah kim kadashanam athava vasarante
    tatah kim vyaktajyotirna vantarmathitabhavabhayam vaibhavam va tatah kim || || panih patram pavitram
    bhramanaparigatam bhaikshyam akshayyam annam vistirnam vastram ashadashakam acapalam talpam asvalpam
    urvi | yesham nihsangatangikaranaparinatasvantasantoshinaste dhanyah sannyastadainyavyatikaranikarah
    karma nirmulayanti || || trailokyadhipatitvam eva virasam yasminmahashasane tallabdhvasanavastramanaghatane
    bhoge ratim ma krithah | bhogah ko'pi sa eka eva paramo nityodito jrimbhate yatsvadadvirasa bhavanti
    vishayastrailokyarajyadayah || || matarmedini tata maruta sakhe tejah subandho jala bhratarvyoma nibaddha
    esha bhavatam antyah pranamanjalih | yushmatsangavashopajatasukritaspharasphurannirmalajnanapasta
    samastamohamahima liye parabrahmani || || shayya shailashila griham giriguha vastram tarunam tvacah
    sarangah suhrido nanu kshitiruham vrittih phalaih komalaih | yesham nirjharam ambupanam ucitam ratyai
    tu vidyangana manye te parameshvarah shirasi yair baddho na sevanjalih || || dhairyam yasya pita kshama
    ca janani shantishciram gehini satyam mitram idam daya ca bhagini bhrata manahsamyamah | shayya bhumitalam
    disho'pi vasanam jnanamritam bhojanam hyete yasya kutumbino vada sakhe kasmadbhayam yoginah || ||
    ahau va hare va balavati ripau va suhridi va manau va loshthe va kusumashayane va drishadi va | trine
    va straine va mama samadrisho yanti divasah kvacitpunyaranye shiva shiva shiveti pralapatah ||
  devanagari: चूडोत्तंसितचन्द्रचारुकलिकाचञ्चच्छिखाभास्वरो लीलादग्धविलोलकामशलभः श्रेयोदशाग्रे स्फुरन् ।
    अन्तःस्फूर्जद् अपारमोहतिमिरप्राग्भारं उच्चाटयन् चेतःसद्मनि योगिनां विजयते ज्ञानप्रदीपो हरः ॥ ॥ भ्रान्तं
    देशं अनेकदुर्गविषमं प्राप्तं न किञ्चित्फलं त्यक्त्वा जातिकुलाभिमानं उचितं सेवा कृता निष्फला । भुक्तं
    मानविवर्जितं परगृहेष्वाशङ्कया काकवत् तृष्णे जृम्भसि पापकर्मपिशुने नाद्यापि सन्तुष्यसि ॥ ॥ उत्खातं
    निधिशङ्कया क्षितितलं ध्माता गिरेर्धातवो निस्तीर्णः सरितां पतिर्नृपतयो यत्नेन सन्तोषिताः । मन्त्राराधनतत्परेण
    मनसा नीताः श्मशाने निशाः प्राप्तः काणवराटकोऽपि न मया तृष्णे सकामा भव ॥ ॥ खलालापाः सोढाः कथं अपि तद्
    आराधनपरैर्निगृह्यान्तर् बाष्पं हसितं अपि शून्येन मनसा । कृतो वित्तस्तम्भप्रतिहतधियां अञ्जलिरपि त्वं
    आशे मोघाशे किम अपरं अतो नर्तयसि माम् ॥ ॥ अमीषां प्राणानां तुलितविसिनीपत्रपयसां कृते किं नास्माभिर्विगलितविवेकैर्व्यवसितम्
    । यद् आढ्यानां अग्रे द्रविणमदनिःसञ्ज्ञमनसां कृतं वीतव्रीडैर्निजगुणकथापातकं अपि ॥ ॥ क्षान्तं न क्षमया
    गृहोचितसुखं त्यक्तं न सन्तोषतः सोढो दुःसहशीततापपवनक्लेशो न तप्तं तपः । ध्यातं वित्तं अहर्निशं नित्यमितप्राणैर्न
    शम्भोः पदं तत्तत्कर्म कृतं यदेव मुनिभिस्तैस्तैः फलैर्वञ्चिताः ॥ ॥ भोगा न भुक्ता वयं एव भुक्तास् तपो
    न तप्तं वयं एव तप्ताः । कालो न यातो वयं एव यातास्तृष्णा न जीर्णा वयं एव जीर्णाः ॥ ॥ बलिभिर्मुखं आक्रान्तं
    पलितेनाङ्कितं शिरः । गात्राणि शिथिलायन्ते तृष्णैका तरुणायते ॥ ॥ विवेकव्याकोशे विदधति समे शाम्यति तृषा
    परिष्वङ्गे तुङ्गे प्रसरतितरां सा परिणता । जराजीर्णैश्वर्यग्रसनगहनाक्षेपकृपणस्तृषापात्रं यस्यां भवति
    मरुतां अप्यधिपतिः ॥ ॥ निवृत्ता भोगेच्छा पुरुषबहुमानोऽपि गलितः समानाः स्वर्याताः सपदि सुहृदो जीवितसमाः
    । शनैर्यष्ट्युत्थानं घनतिमिररुद्धे च नयने अहो मूढः कायस्तदपि मरणापायचकितः ॥ ॥ आशा नाम नदी मनोरथजला
    तृष्णातरङ्गाकुला रागग्राहवती वितर्कविहगा धैर्यद्रुमध्वंसिनी । मोहावर्तसुदुस्तरातिगहना प्रोत्तुङ्गचिन्तातटी
    तस्याः पारगता विशुद्धमनसो नन्दन्ति योगीश्वराः ॥ ॥ न संसारोत्पन्नं चरितं अनुपश्यामि कुशलं विपाकः पुण्यानां
    जनयति भयं मे विमृशतः । महद्भिः पुण्यौघैश्चिरपरिगृहीताश्च विषया महान्तो जायन्ते व्यसनं इव दातुं विषयिणाम्
    ॥ ॥ अवश्यं यातारश्चिरतरं उषित्वापि विषया वियोगे को भेदस्त्यजति न जनो यत्स्वयं अमून् । व्रजन्तः स्वातन्त्र्यादतुलपरितापाय
    मनसः स्वयं त्यक्ता ह्येते शमसुखं अनन्तं विदधति ॥ ॥ ब्रह्मज्ञानविवेकनिर्मलधियः कुर्वन्त्यहो दुष्करं
    यन्मुञ्चन्त्युपभोगभाञ्ज्यपि धनान्येकान्ततो निःस्पृहाः । सम्प्राप्तान्न पुरा न सम्प्रति न च प्राप्तौ
    दृढप्रत्ययान् वाञ्छामात्रपरिग्रहानपि परं त्यक्तुं न शक्ता वयम् ॥ ॥ धन्यानां गिरिकन्दरेषु वसतां ज्योतिः
    परं ध्यायतामानन्दाश्रु जलं पिबन्ति शकुना निःशङ्कं अङ्केशयाः । अस्माकं तु मनोरथोपरचितप्रासादवापीतटक्रीडा
    काननकेलिकौतुकजुषां आयुः परं क्षीयते ॥ ॥ भिक्षाशनं तदपि नीरसं एकवारं शय्या च भूः परिजनो निजदेहमात्रम्
    । वस्त्रं विशीर्णशतखण्डमयी च कन्था हा हा तथापि विषया न परित्यजन्ति ॥ ॥ स्तनौ मांसग्रन्थी कनककलशावित्युपमितौ
    मुखं श्लेष्मागारं तदपि च शशाङ्केन तुलितम् । स्रवन्मूत्रक्लिन्नं करिवरशिरस्पर्धि जघनं मुहुर्निन्द्यं
    रूपं कविजनविशेषैर्गुरुकृतम् ॥ ॥ एको रागिषु राजते प्रियतमादेहार्धहारी हरो नीरागेषु जनो विमुक्तललनासङ्गो
    न यस्मात्परः । दुर्वारस्मरबाणपन्नगविषव्याविद्धमुग्धो जनः शेषः कामविडम्बितान्न विषयान्भोक्तुं न मोक्तुं
    क्षमः ॥ ॥ अजानन्दाहात्म्यं पततु शलभस्तीव्रदहने स मीनोऽप्यज्ञानाद्बडिशयुतं अश्नातु पिशितम् । विजानन्तोऽप्येते
    वयं इह विपज्जालजटिलान् न मुञ्चामः कामान् अहह गहनो मोहमहिमा ॥ ॥ तृषा शुष्यत्यास्ये पिबति सलिलं शीतमधुरं
    क्षुधार्तः शाल्यन्नं कवलयति मांसादिकलितम् । प्रदीप्ते कामाग्नौ सुदृढतरं आलिङ्गति वधूं प्रतीकारं व्याधेः
    सुखं इति विपर्यस्यति जनः ॥ ॥ तुङ्गं वेश्म सुताः सतां अभिमताः सङ्ख्यातिगाः सम्पदः कल्याणी दयिता वयश्च
    नवं इत्यज्ञानमूढो जनः । मत्वा विश्वं अनश्वरं निविशते संसारकारागृहे सन्दृश्य क्षणभङ्गुरं तदखिलं धन्यस्तु
    सन्न्यस्यति ॥ ॥ दीना दीनमुखैः सदैव शिशुकैराकृष्टजीर्णाम्बरा क्रोशद्भिः क्षुधितैर्निरन्नविधुरा दृश्या
    न चेद्गेहिनी । याच्ञाभङ्गभयेन गद्गदगलत्रुट्यद्विलीनाक्षरं को देहीति वदेत्स्वदग्धजठरस्यार्थे मनस्वी
    पुमान् ॥ ॥ अभिमतमहामानग्रन्थिप्रभेदपटीयसी गुरुतरगुणग्रामाम्भोजस्फुटोज्ज्वलचन्द्रिका । विपुलविलसल्लज्जावल्लीवितानकुठारिका
    जठरपिठरी दुष्पूरेयं करोति विडम्बनम् ॥ ॥ पुण्ये ग्रामे वने वा महति सितपटच्छन्नपाली कपालिं ह्यादाय न्यायगर्भद्विजहुतहुतभुग्धूमधूम्रोपकण्ठे
    । द्वारं द्वारं प्रविष्टो वरं उदरदरीपूरणाय क्षुधार्तो मानी प्राणैः सनाथो न पुनरनुदिनं तुल्यकुल्येषु
    दीनः ॥ ॥ गङ्गातरङ्गकणशीकरशीतलानि विद्याधराध्युषितचारुशिलातलानि । स्थानानि किं हिमवतः प्रलयं गतानि
    यत्सावमानपरपिण्डरता मनुष्याः ॥ ॥ किं कन्दाः कन्दरेभ्यः प्रलयं उपगता निर्झरा वा गिरिभ्यः प्रध्वस्ता
    वा तरुभ्यः सरसफलभृतो वल्कलिन्यश्च शाखाः । वीक्ष्यन्ते यन्मुखानि प्रसभं अपगतप्रश्रयाणां खलानां दुःखाप्तस्वल्पवित्तस्मयपवनवशान्नर्तितभ्रूलतानि
    ॥ ॥ पुण्यैर्मूलफलैस्तथा प्रणयिनीं वृत्तिं कुरुष्वाधुना भूशय्यां नवपल्लवैरकृपणैरुत्तिष्ठ यावो वनम्
    । क्षुद्राणां अविवेकमूढमनसां यत्रेश्वराणां सदा वित्तव्याधिविकारविह्वलगिरां नामापि न श्रूयते ॥ ॥ फलं
    स्वेच्छालभ्यं प्रतिवनं अखेदं क्षितिरुहां पयः स्थाने स्थाने शिशिरमधुरं पुण्यसरिताम् । मृदुस्पर्शा शय्या
    सुललितलतापल्लवमयी सहन्ते सन्तापं तदपि धनिनां द्वारि कृपणाः ॥ ॥ ये वर्तन्ते धनपतिपुरः प्रार्थनादुःखभाजो
    ये चाल्पत्वं दधति विषयाक्षेपपर्याप्तबुद्धेः । तेषां अन्तःस्फुरितहसितं वासराणि स्मरेयं ध्यानच्छेदे
    शिखरिकुहरग्रावशय्यानिषण्णः ॥ ॥ ये सन्तोषनिरन्तरप्रमुदितास्तेषां न भिन्ना मुदो ये त्वन्ये धनलुब्धसङ्कुलधियस्तेषां
    न तृष्णाहता । इत्थं कस्य कृते कुतः स विधिना कीदृक्पदं सम्पदां स्वात्मन्येव समाप्तहेममहिमा मेरुर्न
    मे रोचते ॥ ॥ भिक्षाहारं अदैन्यं अप्रतिसुखं भीतिच्छिदं सर्वतो दुर्मात्सर्यमदाभिमानमथनं दुःखौघविध्वंसनम्
    । सर्वत्रान्वहं अप्रयत्नसुलभं साधुप्रियं पावनं शम्भोः सत्रं अवार्यं अक्षयनिधिं शंसन्ति योगीश्वराः
    ॥ ॥ भोगे रोगभयं कुले च्युतिभयं वित्ते नृपालाद्भयं माने दैन्यभयं बले रिपुभयं रूपे जराया भयम् । शास्त्रे
    वादिभयं गुणे खलभयं काये कृतान्ताद्भयं सर्वं वस्तु भयान्वितं भुवि नृणां वैराग्यमेवाभयम् ॥ ॥ आक्रान्तं
    मरणेन जन्म जरसा चात्युज्ज्वलं यौवनं सन्तोषो धनलिप्सया शमसुखं प्रौढाङ्गनाविभ्रमैः । लोकैर्मत्सरिभिर्गुणा
    वनभुवो व्यालैर्नृपा दुर्जनैर् अस्थैर्येण विभूतयोऽप्यपहता ग्रस्तं न किं केन वा ॥ ॥ आधिव्याधिशतैर्जनस्य
    विविधैरारोग्यं उन्मूल्यते लक्ष्मीर्यत्र पतन्ति तत्र विवृतद्वारा इव व्यापदः । जातं जातं अवश्यं आशु
    विवशं मृत्युः करोत्यात्मसात् तत्किं तेन निरङ्कुशेन विधिना यन्निर्मितं सुस्थिरम् ॥ ॥ भोगास्तुङ्गतरङ्गभङ्गतरलाः
    प्राणाः क्षणध्वंसिनः स्तोकान्येव दिनानि यौवनसुखं स्फूर्तिः प्रियासु स्थिता । तत्संसारं असारं एव निखिलं
    बुद्ध्वा बुधा बोधका लोकानुग्रहपेशलेन मनसा यत्नः समाधीयताम् ॥ ॥ भोगा मेघवितानमध्यविलसत्सौदामिनीचञ्चला
    आयुर्वायुविघट्टिताब्जपटलीलीनाम्बुवद्भङ्गुरम् । लीला यौवनलालसास्तनुभृतां इत्याकलय्य द्रुतं योगे धैर्यसमाधिसिद्धिसुलभे
    बुद्धिं विदध्वं बुधाः ॥ ॥ आयुः कल्लोललोलं कतिपयदिवसस्थायिनी यौवनश्रीः अर्थाः सङ्कल्पकल्पा घनसमयतडिद्विभ्रमा
    भोगपूगाः । कण्ठाश्लेषोपगूढं तदपि च न चिरं यत्प्रियाभिः प्रणीतं ब्रह्मण्यासक्तचित्ता भवत भवभयाम्भोधिपारं
    तरीतुम् ॥ ॥ कृच्छ्रेणामेध्यमध्ये नियमिततनुभिः स्थीयते गर्भवासे कान्ताविश्लेषदुःखव्यतिकरविषमो यौवने
    चोपभोगः । वामाक्षीणां अवज्ञाविहसितवसतिर्वृद्धभावोऽप्यसाधुः संसारे रे मनुष्या वदत यदि सुखं स्वल्पं
    अप्यस्ति किञ्चित् ॥ ॥ व्याघ्रीव तिष्ठति जरा परितर्जयन्ती रोगाश्च शत्रव इव प्रहरन्ति देहम् । आयुः परिस्रवति
    भिन्नघटादिवाम्भो लोकस्तथाप्यहितं आचरतीति चित्रम् ॥ ॥ भोगा भङ्गुरवृत्तयो बहुविधास्तैरेव चायं भवस्तत्
    कस्येह कृते परिभ्रमत रे लोकाः कृतं चेष्टितैः । आशापाशशतोपशान्तिविशदं चेतःसमाधीयतां कामोत्पत्तिवशात्स्वधामनि
    यदि श्रद्धेयं अस्मद्वचः ॥ ॥ सखे धन्याः केचित्त्रुटितभवबन्धव्यतिकरा वनान्ते चित्तान्तर्विषमविषयाशीविषगताः
    । शरच्चन्द्रज्योत्स्नाधवलगगनाभोगसुभगां नयन्ते ये रात्रिं सुकृतचयचिन्तैकशरणाः ॥ ॥ ब्रह्मेन्द्रादिमरुद्गणांस्तृणकणान्यत्र
    स्थितो मन्यते यत्स्वादाद्विरसा भवन्ति विभवास्त्रैलोक्यराज्यादयः । भोगः कोऽपि स एव एकः परमो नित्योदितो
    जृम्भते भोः साधो क्षणभङ्गुरे तदितरे भोगे रतिं मा कृथाः ॥ ॥ सा रम्या नगरी महान्स नृपतिः सामन्तचक्रं
    च तत् पार्श्वे तस्य च सा विदग्धपरिषत्ताश्चन्द्रबिम्बाननाः । उद्वृत्तः स राजपुत्रनिवहस्ते वन्दिनस्ताः
    कथाः सर्वं यस्य वशादगात्स्मृतिपथं कालाय तस्मै नमः ॥ ॥ यत्रानेकः क्वचिदपि गृहे तत्र तिष्ठत्यथैको यत्राप्येकस्तदनु
    बहवस्तत्र नैकोऽपि चान्ते । इत्थं नेयौ रजनिदिवसौ लोलयन्द्वाविवाक्षौ कालः कल्यो भुवनफलके क्रीडति प्राणिशारैः
    ॥ ॥ आदित्यस्य गतागतैरहरहः सङ्क्षीयते जीवितं व्यापारैर्बहुकार्यभारगुरुभिः कालोऽपि न ज्ञायते । दृष्ट्वा
    जन्मजराविपत्तिमरणं त्रासश्च नोत्पद्यते पीत्वा मोहमयीं प्रमादमदिरां उन्मत्तभूतं जगत् ॥ ॥ रात्रिः सैव
    पुनः स एव दिवसो मत्वा मुधा जन्तवो धावन्त्युद्यमिनस्तथैव निभृतप्रारब्धतत्तत्क्रियाः । व्यापारैः पुनर्
    उक्तभूतविषयैरित्थं विधेनामुना संसारेण कदर्थिता वयं अहो मोहान्न लज्जामहे ॥ ॥ न ध्यातं पदं ईश्वरस्य
    विधिवत्संसारविच्छित्तये स्वर्गद्वारकपाटपाटनपटुर्धर्मोऽपि नोपार्जितः । नारीपीनपयोधरोरुयुगलं स्वप्नेऽपि
    नालिङ्गितं मातुः केवलं एव यौवनवनच्छेदे कुठारा वयम् ॥ ॥ नाभ्यस्ता प्रतिवादिवृन्ददमनी विद्या विनीतोचिता
    खड्गाग्रैः करिकुम्भपीठदलनैर्नाकं न नीतं यशः । कान्ताकोमलपल्लवाधररसः पीतो न चन्द्रोदये तारुण्यं गतं
    एव निष्फलं अहो शून्यालये दीपवत् ॥ ॥ विद्या नाधिगता कलङ्करहिता वित्तं च नोपार्जितं शुश्रूषापि समाहितेन
    मनसा पित्रोर्न सम्पादिता । आलोलायतलोचनाः प्रियतमाः स्वप्नेऽपि नालिङ्गिताः कालोऽयं परपिण्डलोलुपतया
    काकैरिव प्रेर्यते ॥ ॥ वयं येभ्यो जाताश्चिरपरिगता एव खलु ते समं यैः संवृद्धाः स्मृतिविषयतां तेऽपि गमिताः
    । इदानीं एते स्मः प्रतिदिवसं आसन्नपतना गतास्तुल्यावस्थां सिकतिलनदीतीरतरुभिः ॥ ॥ आयुर्वर्षशतं नृणां
    परिमितं रात्रौ तद् अर्धं गतं तस्यार्धस्य परस्य चार्धं अपरं बालत्ववृद्धत्वयोः । शेषं व्याधिवियोगदुःखसहितं
    सेवादिभिर्नीयते जीवे वारितरङ्गचञ्चलतरे सौख्यं कुतः प्राणिनाम् ॥ ॥ क्षणं बालो भूत्वा क्षणं अपि युवा
    कामरसिकः क्षणं वित्तैर्हीनः क्षणं अपि च सम्पूर्णविभवः । जराजीर्णैरङ्गैर्नट इव वलीमण्डिततनूर् नरः संसारान्ते
    विशति यमधानीयवनिकाम् ॥ ॥ त्वं राजा वयं अप्युपासितगुरुप्रज्ञाभिमानोन्नताः ख्यातस्त्वं विभवैर्यशांसि
    कवयो दिक्षु प्रतन्वन्ति नः । इत्थं मानधनातिदूरं उभयोरप्यावयोरन्तरं यद्यस्मासु पराङ्मुखोऽसि वयं अप्येकान्ततो
    निःस्पृहाः ॥ ॥ अर्थानां ईशिषे त्वं वयं अपि च गिरां ईश्महे यावदर्थं शूरस्त्वं वादिदर्पव्युपशमनविधावक्षयं
    पाटवं नः । सेवन्ते त्वां धनाढ्या मतिमलहतये मां अपि श्रोतुकामाः । मय्यप्यास्था न ते चेत्त्वयि मम नितरां
    एव राजन्ननास्था ॥ ॥ वयं इह परितुष्टा वल्कलैस्त्वं दुकूलैः सम इह परितोषो निर्विशेषो विशेषः । स तु भवतु
    दरिद्रो यस्य तृष्णा विशाला मनसि च परितुष्टे कोऽर्थवान्को दरिद्रः ॥ ॥ फलं अलं अशनाय स्वादु पानाय तोयं
    क्षितिरपि शयनार्थं वाससे वल्कलं च । नवधनमधुपानभ्रान्तसर्वेन्द्रियाणां अविनयं अनुमन्तुं नोत्सहे दुर्जनानाम्
    ॥ ॥ अश्नीमहि वयं भिक्षां आशावासो वसीमहि । शयीमहि महीपृष्ठे कुर्वीमहि किं ईश्वरैः ॥ ॥ न नटा ना विटा
    न गायका न च सभ्येतरवादचुञ्चवः । नृपं ईक्षितुं अत्र के वयं स्तनभारानमिता न योषितः ॥ ॥ विपुलहृदयैरीशैरेतज्जगज्जनितं
    पुरा विधृतं अपरैर्दत्तं चान्यैर्विजित्य तृणं यथा । इह हि भुवनान्यन्यैर्धीराश्चतुर्दश भुञ्जते कतिपयपुरस्वाम्ये
    पुंसां क एष मदज्वरः ॥ ॥ अभुक्तायां यस्यां क्षणं अपि न यातं नृपशतैर् भुवस्तस्या लाभे क इव बहुमानः क्षितिभृताम्
    । तद् अवयवलेशेऽपि पतयो विषादे कर्तव्ये विदधति जडाः प्रत्युत मुदम् ॥ ॥ मृत्पिण्डो जलरेखया वलयितः सर्वोऽप्ययं
    नन्वणुः स्वांशीकृत्य स एव सङ्गरशतै राज्ञां गणा भुञ्जते । ये दद्युर्ददतोऽथवा किं अपरं क्षुद्रा दरिद्रा
    भृशं धिग्धिक्तान्पुरुषाधमान्धनकणान्वाञ्छन्ति तेभ्योऽपि ये ॥ ॥ स जातः कोऽप्यासीन्मदनरिपुणा मूर्ध्नि
    धवलं कपालं यस्योच्चैर्विनिहितं अलङ्कारविधये । नृभिः प्राणत्राणप्रवणमतिभिः कैश्चिदधुना नमद्भिः कः पुंसां
    अयं अतुलदर्पज्वरभरः ॥ ॥ परेषां चेतांसि प्रतिदिवसं आराध्य बहुधा प्रसादं किं नेतुं विशसि हृदय क्लेशकलितम्
    । प्रसन्ने त्वय्यन्तःस्वयमुदितचिन्तामणिगणो विविक्तः सङ्कल्पः किं अभिलषितं पुष्यति न ते ॥ ॥ सत्यां
    एव त्रिलोकीसरिति हरशिरश्चुम्बिनीवच्छटायां सद्वृत्तिं कल्पयन्त्यां वटविटपभवैर्वल्कलैः सत्फलैश्च । कोऽयं
    विद्वान्विपत्तिज्वरजनितरुजातीवदुःखासिकानां वक्त्रं वीक्षेत दुःस्थे यदि हि न विभृयात्स्वे कुटुम्बेऽनुकम्पाम्
    ॥ ॥ परिभ्रमसि किं मुधा क्वचन चित्त विश्राम्यतां स्वयं भवति यद्यथा भवति तत्तथा नान्यथा । अतीतं अननुस्मरन्नपि
    च भाव्यसङ्कल्पयन्नतर्कित समागमाननुभवामि भोगानहम् ॥ ॥ एतस्माद्विरमेन्द्रियार्थगहनादायासकादाश्रयश्रेयो
    मार्गं अशेषदुःखशमनव्यापारदक्षं क्षणात् । स्वात्मीभावं उपैहि सन्त्यज निजां कल्लोललोलां गतिं मा भूयो
    भज भङ्गुरां भवरतिं चेतः प्रसीदाधुना ॥ ॥ मोहं मार्जय तां उपार्जय रतिं चन्द्रार्धचूडामणौ चेतः स्वर्गतरङ्गिणीतटभुवां
    आसङ्गं अङ्गीकुरु । को वा वीचिषु बुद्बुदेषु च तडिल्लेखासु च श्रीषु च ज्वालाग्रेषु च पन्नगेषु सरिद्वेगेषु
    च प्रत्ययः ॥ ॥ चेतश्चिन्तय मा रमां सकृदिमां अस्थायिनीं आस्थया भूपालभ्रुकुटीकुटीविहरणव्यापारपण्याङ्गनाम्
    । कन्थाकञ्चुकिनः प्रविश्य भवनद्वाराणि वाराणसीरथ्या पङ्क्तिषु पाणिपात्रपतितां भिक्षां अपेक्षामहे ॥
    ॥ अग्रे गीतं सरसकवयः पार्श्वयोर्दाक्षिणात्याः पश्चाल्लीलावलयरणितं चामरग्राहिणीनाम् । यद्यस्त्येवं
    कुरु भवरसास्वादने लम्पटत्वं नो चेच्चेतः प्रविश सहसा निर्विकल्पे समाधौ ॥ ॥ प्राप्ताः श्रियः सकलकामदुघास्ततः
    किं न्यस्तं पदं शिरसि विद्विषतां ततः किम् । सम्पादिताः प्रणयिनो विभवैस्ततः किं कल्पं स्थितास्तनुभृतां
    तनवस्ततः किम् ॥ ॥ भक्तिर्भवे मरणजन्मभयं हृदिस्थं स्नेहो न बन्धुषु न मन्मथजा विकाराः । संसर्ग दोषरहिता
    विजना वनान्ता वैराग्यं अस्ति किं इतः परमर्थनीयम् ॥ ॥ तस्मादनन्तं अजरं परमं विकासि तद्ब्रह्म चिन्तय
    किं एभिरसद्विकल्पैः । यस्यानुषङ्गिण इमे भुवनाधिपत्यभोगादयः कृपणलोकमता भवन्ति ॥ ॥ पातालं आविशसि यासि
    नभो विलङ्घ्य दिङ्मण्डलं भ्रमसि मानस चापलेन । भ्रान्त्यापि जातु विमलं कथं आत्मनीनं न ब्रह्म संस्मरसि
    निर्वृतिं एषि येन ॥ ॥ किं वेदैः स्मृतिभिः पुराणपठनैः शास्त्रैर्महाविस्तरैः स्वर्गग्रामकुटीनिवासफलदैः
    कर्मक्रियाविभ्रमैः । मुक्त्वैकं भवदुःखभाररचनाविध्वंसकालानलं स्वात्मानन्दपदप्रवेशकलनं शेशैर्वणिग्वृत्तिभिः
    ॥ ॥ नायं ते समयो रहस्यं अधुना निद्राति नाथो यदि स्थित्वा द्रक्ष्यति कुप्यति प्रभुरिति द्वारेषु येषां
    वचः । चेतस्तानपहाय याहि भवनं देवस्य विश्वेशितुर् निर्दौवारिकनिर्दयोक्त्य् अपरुषं निःसीमशर्मप्रदम्
    ॥ ॥ यतो मेरुः श्रीमान्निपतति युगान्ताग्निवलितः समुद्राः शुष्यन्ति प्रचुरमकरग्राहनिलयाः । धरा गच्छत्यन्तं
    धरणिधरपादैरपि धृता शरीरे का वार्ता करिकलभकर्णाग्रचपले ॥ ॥ गात्रं सङ्कुचितं गतिर्विगलिता भ्रष्टा च
    दन्तावलिर् दृष्टिर्नश्यति वर्धते बधिरता वक्त्रं च लालायते । वाक्यं नाद्रियते च बान्धवजनो भार्या न
    शुश्रूषते हा कष्टं पुरुषस्य जीर्णवयसः पुत्रोऽप्यमित्रायते ॥ ॥ वर्णं सितं शिरसि वीक्ष्य शिरोरुहाणां
    स्थानं जरापरिभवस्य तदा पुमांसम् । आरोपितास्थिशतकं परिहृत्य यान्ति चण्डालकूपं इव दूरतरं तरुण्यः ॥ ॥
    यावत्स्वस्थं इदं शरीरं अरुजं यावच्च दूरे जरा यावच्चेन्द्रियशक्तिरप्रतिहता यावत्क्षयो नायुषः । आत्मश्रेयसि
    तावदेव विदुषा कार्यः प्रयत्नो महान् सन्दीप्ते भवने तु कूपखननं प्रत्युद्यमः कीदृशः ॥ ॥ तपस्यन्तः सन्तः
    किं अधिनिवसामः सुरनदीं गुणोदारान्दारानुत परिचरामः सविनयम् । पिबामः शास्त्रौघानुतविविधकाव्यामृतरसान्
    न विद्मः किं कुर्मः कतिपयनिमेषायुषि जने ॥ ॥ दुराराध्याश्चामी तुरगचलचित्ताः क्षितिभुजो वयं तु स्थूलेच्छाः
    सुमहति फले बद्धमनसः । जरा देहं मृत्युर्हरति दयितं जीवितं इदं सखे नान्यच्छ्रेयो जगति विदुषोऽन्यत्र
    तपसः ॥ ॥ माने म्लायिनि खण्डिते च वसुनि व्यर्थे प्रयातेऽर्थिनि क्षीणे बन्धुजने गते परिजने नष्टे शनैर्यौवने
    । युक्तं केवलं एतदेव सुधियां यज्जह्नुकन्यापयःपूतग्राव गिरीन्द्रकन्दरतटीकुञ्जे निवासः क्वचित् ॥ ॥ रम्याश्चन्द्रमरीचयस्तृणवती
    रम्या वनान्तस्थली रम्यं साधुसमागमागतसुखं काव्येषु रम्याः कथाः । कोपोपाहितबाष्पबिन्दुतरलं रम्यं प्रियाया
    मुखं सर्वं रम्यं अनित्यतां उपगते चित्ते न किञ्चित्पुनः ॥ ॥ रम्यं हर्म्यतलं न किं वसतये श्राव्यं न
    गेयादिकं किं वा प्राणसमासमागमसुखं नैवाधिकप्रीतये । किन्तु भ्रान्तपतङ्गपक्षपवनव्यालोलदीपाङ्कुरच्छाया
    चञ्चलं आकलय्य सकलं सन्तो वनान्तं गताः ॥ ॥ आ संसारात्त्रिभुवनं इदं चिन्वतां तात तादृङ्नैवास्माकं नयनपदवीं
    श्रोत्रमार्गं गतो वा । योऽयं धत्ते विषयकरिणो गाढगूढाभिमानक्षीवस्यान्तः विषयकरिणीगाढगूढाभिमानक्षीवस्यान्तः
    करणकरिणः संयमालानलीलाम् ॥ ॥ यदेतत्स्वच्छन्दं विहरणं अकार्पण्यं अशनं सहार्यैः संवासः श्रुतं उपशमैकव्रतफलम्
    । मनो मन्दस्पन्दं बहिरपि चिरस्यापि विमृशन्न जाने कस्यैषा परिणतिरुदारस्य तपसः ॥ ॥ जीर्णा एव मनोरथाश्च
    हृदये यातं च तद्यौवनं हन्ताङ्गेषु गुणाश्च वन्ध्यफलतां याता गुणज्ञैर्विना । किं युक्तं सहसाभ्युपैति
    बलवान्कालः कृतान्तोऽक्षमी हा ज्ञातं मदनान्तकाङ्घ्रियुगलं मुक्त्वास्ति नान्या गतिः ॥ ॥ महेश्वरे वा
    जगतां अधीश्वरे जनार्दने वा जगद् अन्तरात्मनि । न वस्तुभेदप्रतिपत्तिरस्ति मे तथापि भक्तिस्तरुणेन्दुशेखरे
    ॥ ॥ स्फुरत्स्फारज्योत्स्नाधवलिततले क्वापि पुलिने सुखासीनाः शान्तध्वनिषु रजनीषु द्युसरितः । भवाभोगोद्विग्नाः
    शिव शिव शिवेत्युच्चवचसः कदा यास्यामोऽन्तर्गतबहुलबाष्पाकुलदशाम् ॥ ॥ महादेवो देवः सरिदपि च सैषा सुरसरिद्गुहा
    एवागारं वसनं अपि ता एव हरितः । सुहृदा कालोऽयं व्रतं इदं अदैन्यव्रतं इदं कियद्वा वक्ष्यामो वटविटप एवास्तु
    दयिता ॥ ॥ वितीर्णे सर्वस्वे तरुणकरुणापूर्णहृदयाः स्मरन्तः संसारे विगुणपरिणामां विधिगतिम् । वयं पुण्यारण्ये
    परिणतशरच्चन्द्रकिरणास् त्रियामा नेष्यामो हरचरणचिन्तैकशरणाः ॥ ॥ कदा वाराणस्यां अमरतटिनीरोधसि वसन् वसानः
    कौपीनं शिरसि निदधानोऽञ्जलिपुटम् । अये गौरीनाथ त्रिपुरहर शम्भो त्रिनयन प्रसीदेत्याक्रोशन्निमिषं इव
    नेष्यामि दिवसान् ॥ ॥ उद्यानेषु विचित्रभोजनविधिस्तीव्रातितीव्रं तपः कौपीनावरणं सुवस्त्रं अमितं भिक्षाटनं
    मण्डनम् । आसन्नं मरणं च मङ्गलसमं यस्यां समुत्पद्यते तां काशीं परिहृत्य हन्त विबुधैरन्यत्र किं स्थीयते
    ॥ ॥ स्नात्वा गाङ्गैः पयोभिः शुचिकुसुमफलैरर्चयित्वा विभो त्वां ध्येये ध्यानं निवेश्य क्षितिधरकुहरग्रावपर्यङ्कमूले
    । आत्मारामः फलाशी गुरुवचनरतस्त्वत्प्रसादात्स्मरारे दुःखं मोक्ष्ये कदाहं समकरचरणे पुंसि सेवासमुत्थम्
    ॥ ॥ एकाकी निःस्पृहः शान्तः पाणिपात्रो दिगम्बरः । कदा शम्भो भविष्यामि कर्मनिर्मूलनक्षमः ॥ ॥ पाणिं पात्रयतां
    निसर्गशुचिना भैक्षेण सन्तुष्यतां यत्र क्वापि निषीदतां बहुतृणं विश्वं मुहुः पश्यताम् । अत्यागेऽपि तनोरखण्डपरमानन्दावबोधस्पृशा
    मध्वा कोऽपि शिवप्रसादसुलभः सम्पत्स्यते योगिनाम् ॥ ॥ कौपीनं शतखण्डजर्जरतरं कन्था पुनस्तादृशी नैश्चिन्त्यं
    निरपेक्षभैक्ष्यं अशनं निद्रा श्मशाने वने । स्वातन्त्र्येण निरङ्कुशं विहरणं स्वान्तं प्रशान्तं सदा
    स्थैर्यं योगमहोत्सवेऽपि च यदि त्रैलोक्यराज्येन किम् ॥ ॥ ब्रह्माण्डं मण्डलीमात्रं किं लोभाय मनस्विनः
    । शफरीस्फुरितेनाब्धिः क्षुब्धो न खलु जायते ॥ ॥ मातर्लक्ष्मि भजस्व कञ्चिदपरं मत्काङ्क्षिणी मा स्म भूर्
    भोगेषु स्पृहयालवस्तव वशे का निःस्पृहाणां असि । सद्यः स्यूतपलाशपत्रपुटिकापात्रैः पवित्रीकृतैर् भिक्षावस्तुभिरेव
    सम्प्रति वयं वृत्तिं समीहामहे ॥ ॥ महाशय्या पृथ्वी विपुलं उपधानं भुजलता वितानं चाकाशं व्यजनं अनुकूलोऽयं
    अनिलः । शरच्चन्द्रो दीपो विरतिवनितासङ्गमुदितः सुखी शान्तः शेते मुनिरतनुभूतिर्नृप इव ॥ ॥ भिक्षाशी जनमध्यसङ्गरहितः
    स्वायत्तचेष्टः सदा हानादानविरक्तमार्गनिरतः कश्चित्तपस्वी स्थितः । रथ्याकीर्णविशीर्णजीर्णवसनः सम्प्राप्तकन्थासनो
    निर्मानो निरहङ्कृतिः शमसुखाभोगैकबद्धस्पृहः ॥ ॥ चण्डालः किं अयं द्विजातिरथवा शूद्रोऽथ किं तापसः किं
    वा तत्त्वविवेकपेशलमतिर्योगीश्वरः कोऽपि किम् । इत्युत्पन्नविकल्पजल्पमुखरैराभाष्यमाणा जनैर् न क्रुद्धाः
    पथि नैव तुष्टमनसो यान्ति स्वयं योगिनः ॥ ॥ हिंसाशून्यं अयत्नलभ्यं अशनं धात्रा मरुत्कल्पितं व्यालानां
    पशवस्तृणाङ्कुरभुजस्तुष्टाः स्थलीशायिनः । संसारार्णवलङ्घनक्षमधियां वृत्तिः कृता सा नृणां तां अन्वेषयतां
    प्रयान्ति सततं सर्वं समाप्तिं गुणाः ॥ ॥ गङ्गातीरे हिमगिरिशिलाबद्धपद्मासनस्य ब्रह्मध्यानाभ्यसनविधिना
    योगनिद्रां गतस्य । किं तैर्भाव्यं मम सुदिवसैर्यत्र ते निर्विशङ्काः कण्डूयन्ते जरठहरिणाः स्वाङ्गं अङ्गे
    मदीये ॥ ॥ जीर्णा कन्था ततः किं सितं अमलपटं पट्टसूत्रं ततः किं एका भार्या ततः किं हयकरिसुगणैरावृतो
    वा ततः किम् । भक्तं भुक्तं ततः किं कदशनं अथवा वासरान्ते ततः किं व्यक्तज्योतिर्न वान्तर्मथितभवभयं वैभवं
    वा ततः किम् ॥ ॥ पाणिः पात्रं पवित्रं भ्रमणपरिगतं भैक्ष्यं अक्षय्यं अन्नं विस्तीर्णं वस्त्रं आशादशकं
    अचपलं तल्पं अस्वल्पं उर्वी । येषां निःसङ्गताङ्गीकरणपरिणतस्वान्तसन्तोषिणस्ते धन्याः सन्न्यस्तदैन्यव्यतिकरनिकराः
    कर्म निर्मूलयन्ति ॥ ॥ त्रैलोक्याधिपतित्वं एव विरसं यस्मिन्महाशासने तल्लब्ध्वासनवस्त्रमानघटने भोगे
    रतिं मा कृथाः । भोगः कोऽपि स एक एव परमो नित्योदितो जृम्भते यत्स्वादाद्विरसा भवन्ति विषयास्त्रैलोक्यराज्यादयः
    ॥ ॥ मातर्मेदिनि तात मारुत सखे तेजः सुबन्धो जल भ्रातर्व्योम निबद्ध एष भवतां अन्त्यः प्रणामाञ्जलिः ।
    युष्मत्सङ्गवशोपजातसुकृतस्फारस्फुरन्निर्मलज्ञानापास्त समस्तमोहमहिमा लीये परब्रह्मणि ॥ ॥ शय्या शैलशिला
    गृहं गिरिगुहा वस्त्रं तरूणां त्वचः सारङ्गाः सुहृदो ननु क्षितिरुहां वृत्तिः फलैः कोमलैः । येषां निर्झरं
    अम्बुपानं उचितं रत्यै तु विद्याङ्गना मन्ये ते परमेश्वराः शिरसि यैर् बद्धो न सेवाञ्जलिः ॥ ॥ धैर्यं
    यस्य पिता क्षमा च जननी शान्तिश्चिरं गेहिनी सत्यं मित्रं इदं दया च भगिनी भ्राता मनःसंयमः । शय्या भूमितलं
    दिशोऽपि वसनं ज्ञानामृतं भोजनं ह्येते यस्य कुटुम्बिनो वद सखे कस्माद्भयं योगिनः ॥ ॥ अहौ वा हारे वा बलवति
    रिपौ वा सुहृदि वा मणौ वा लोष्ठे वा कुसुमशयने वा दृषदि वा । तृणे वा स्त्रैणे वा मम समदृशो यान्ति दिवसाः
    क्वचित्पुण्यारण्ये शिव शिव शिवेति प्रलपतः ॥
