id: chanakya-neethi-chapter-14
category: stotram
name:
  english: Chanakya Neethi - Chapter 14
content:
  english: atmaparadhavrikshasya phalanyetani dehinam | daridryaduhkharogani bandhanavyasanani ca || ||
    punarvittam punarmitram punarbharya punarmahi | etatsarvam punarlabhyam na shariram punah punah ||
    || bahunam caiva sattvanam samavayo ripunjayah | varshadharadharo meghastrinairapi nivaryate || ||
    jale tailam khale guhyam patre danam managapi | prajne shastram svayam yati vistaram vastushaktitah
    || || dharmakhyane shmashane ca roginam ya matirbhavet | sa sarvadaiva tishtheccetko na mucyeta bandhanat
    || || utpannapashcattapasya buddhirbhavati yadrishi | tadrishi yadi purvam syatkasya na syanmahodayah
    || || dane tapasi shaurye va vijnane vinaye naye | vismayo nahi kartavyo bahuratna vasundhara || ||
    durastho'pi na durastho yo yasya manasi sthitah | yo yasya hridaye nasti samipastho'pi duratah ||
    || yasmacca priyamicchettu tasya bruyatsada priyam | vyadho mrigavadham kartum gitam gayati susvaram
    || || atyasanna vinashaya durastha na phalaprada | sevyatam madhyabhavena raja vahnirguruh striyah
    || || agnirapah striyo murkhah sarpa rajakulani ca | nityam yatnena sevyani sadyah pranaharani shat
    || || sa jivati guna yasya yasya dharmah sa jivati | gunadharmavihinasya jivitam nishprayojanam ||
    || yadicchasi vashikartum jagadekena karmana | pura pancadashasyebhyo gam caranti nivaraya || || prastavasadrisham
    vakyam prabhavasadrisham priyam | atmashaktisamam kopam yo janati sa panditah || || eka eva padarthastu
    tridha bhavati vikshitah | kunapam kamini mamsam yogibhih kamibhih shvabhih || || susiddhamaushadham
    dharmam grihacchidram ca maithunam | kubhuktam kushrutam caiva matimanna prakashayet || || tavanmaunena
    niyante kokilaishcaiva vasarah | yavatsarvajananandadayini vakpravartate || || dharmam dhanam ca dhanyam
    ca gurorvacanamaushadham | sugrihitam ca kartavyamanyatha tu na jivati || || tyaja durjanasamsargam
    bhaja sadhusamagamam | kuru punyamahoratram smara nityamanityatah ||
  devanagari: आत्मापराधवृक्षस्य फलान्येतानि देहिनाम् । दारिद्र्यदुःखरोगाणि बन्धनव्यसनानि च ॥ ॥ पुनर्वित्तं
    पुनर्मित्रं पुनर्भार्या पुनर्मही । एतत्सर्वं पुनर्लभ्यं न शरीरं पुनः पुनः ॥ ॥ बहूनां चैव सत्त्वानां
    समवायो रिपुञ्जयः । वर्षाधाराधरो मेघस्तृणैरपि निवार्यते ॥ ॥ जले तैलं खले गुह्यं पात्रे दानं मनागपि
    । प्राज्ञे शास्त्रं स्वयं याति विस्तारं वस्तुशक्तितः ॥ ॥ धर्माख्याने श्मशाने च रोगिणां या मतिर्भवेत्
    । सा सर्वदैव तिष्ठेच्चेत्को न मुच्येत बन्धनात् ॥ ॥ उत्पन्नपश्चात्तापस्य बुद्धिर्भवति यादृशी । तादृशी
    यदि पूर्वं स्यात्कस्य न स्यान्महोदयः ॥ ॥ दाने तपसि शौर्ये वा विज्ञाने विनये नये । विस्मयो नहि कर्तव्यो
    बहुरत्ना वसुन्धरा ॥ ॥ दूरस्थोऽपि न दूरस्थो यो यस्य मनसि स्थितः । यो यस्य हृदये नास्ति समीपस्थोऽपि
    दूरतः ॥ ॥ यस्माच्च प्रियमिच्छेत्तु तस्य ब्रूयात्सदा प्रियम् । व्याधो मृगवधं कर्तुं गीतं गायति सुस्वरम्
    ॥ ॥ अत्यासन्ना विनाशाय दूरस्था न फलप्रदा । सेव्यतां मध्यभावेन राजा वह्निर्गुरुः स्त्रियः ॥ ॥ अग्निरापः
    स्त्रियो मूर्खाः सर्पा राजकुलानि च । नित्यं यत्नेन सेव्यानि सद्यः प्राणहराणि षट् ॥ ॥ स जीवति गुणा
    यस्य यस्य धर्मः स जीवति । गुणधर्मविहीनस्य जीवितं निष्प्रयोजनम् ॥ ॥ यदीच्छसि वशीकर्तुं जगदेकेन कर्मणा
    । पुरा पञ्चदशास्येभ्यो गां चरन्ती निवारय ॥ ॥ प्रस्तावसदृशं वाक्यं प्रभावसदृशं प्रियम् । आत्मशक्तिसमं
    कोपं यो जानाति स पण्डितः ॥ ॥ एक एव पदार्थस्तु त्रिधा भवति वीक्षितः । कुणपं कामिनी मांसं योगिभिः कामिभिः
    श्वभिः ॥ ॥ सुसिद्धमौषधं धर्मं गृहच्छिद्रं च मैथुनम् । कुभुक्तं कुश्रुतं चैव मतिमान्न प्रकाशयेत् ॥
    ॥ तावन्मौनेन नीयन्ते कोकिलैश्चैव वासराः । यावत्सर्वजनानन्ददायिनी वाक्प्रवर्तते ॥ ॥ धर्मं धनं च धान्यं
    च गुरोर्वचनमौषधम् । सुगृहीतं च कर्तव्यमन्यथा तु न जीवति ॥ ॥ त्यज दुर्जनसंसर्गं भज साधुसमागमम् । कुरु
    पुण्यमहोरात्रं स्मर नित्यमनित्यतः ॥
