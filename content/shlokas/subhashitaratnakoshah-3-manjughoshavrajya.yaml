id: subhashitaratnakoshah-3-manjughoshavrajya
category: subhashita
name:
  english: subhashitaratnakoshah/3 manjughoshavrajya
  devanagari: सुभाषितरत्नकोशः/३ मञ्जुघोषव्रज्या
content:
  english: malitah sphurjatkanchana malitasphurjallanchana shastrodyadbahudehasphuradanalamiladdhumakalpantapunjah
    shringantanantavishvarpitamahishamahishashiromakshikalivikalpah
  devanagari: मालितः स्फूर्जत्काञ्छन मालितस्फूर्जल्लाञ्छन शस्त्रोद्यद्बाहुदेहस्फुरदनलमिलद्धूमकल्पान्तपुञ्जः
    शृङ्गान्तानन्तविश्वार्पितमहिषमहिषशिरोमक्षिकालीविकल्पः
meaning: {}
