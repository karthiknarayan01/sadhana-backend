id: kiratashtakam
category: stotram
name:
  english: kiratashtakam
  devanagari: किराताष्टकम्
content:
  english: saktasya shambhohsutah tratum yo bhuvanam pura samajani khyatah kiratakritih | kodandah churikadharo
    ghanarucih pinchavatamsojvalah sa tvam mamava sarvada ripugana trastam dayavaridhe || 2 || yo mam
    pidayati prasahya satatam dehi tvadekashrayam bhitva tasya riporurah churikaya shatagraya durmateh
    | deva tvatkarapankajolasitaya shriman kiratakrite tatpranan vitarantakaya bhagavan kalariputranjasa
    || 3 || viddho marmamasu durvacobhirasatam santaptashalyopamaih driptanam dvishatamashantamanasam
    khinno'smi yavad bhrisham tavat tvam churikasharasanadharah citte mamavirbhavan svamin deva kiratarupa
    shamaya pratyarthivargam kshanat || 4 || hartum vittadharmato mama ratah
  devanagari: सक्तस्य शम्भोःसुतः त्रातुं यो भुवनं पुरा समजनि ख्यातः किराताकृतिः । कोदण्डः छुरिकाधरो घनरुचिः
    पिञ्छावतंसोज्वलः स त्वं मामव सर्वदा रिपुगण त्रस्तं दयावारिधे ॥ २ ॥ यो मां पीडयति प्रसह्य सततं देही
    त्वदेकाश्रयं भित्वा तस्य रिपोरुरः छुरिकया शाताग्रया दुर्मतेः । देव त्वत्करपङ्कजोलसितया श्रीमन् किराताकृते
    तत्प्राणान् वितरान्तकाय भगवन् कालारिपुत्राञ्जसा ॥ ३ ॥ विद्धो मर्ममसु दुर्वचोभिरसतां सन्तप्तशल्योपमैः
    दृप्तानां द्विषतामशान्तमनसां खिन्नोऽस्मि यावद् भृशं तावत् त्वं छुरिकाशरासनधरः चित्ते ममाविर्भवन् स्वामिन्
    देव किरातरूप शमय प्रत्यर्थिवर्गं क्षणात् ॥ ४ ॥ हर्तुं वित्तधर्मतो मम रताः
