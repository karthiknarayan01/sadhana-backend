id: sri-kali-chalisa
category: stotram
name:
  english: Sri Kali Chalisa
content:
  english: doha jayakali kalimalaharana mahima agama apara | mahisha mardini kalika dehu abhaya apara
    || ari mada mana mitavana hari | mundamala gala sohata pyari || ashtabhuji sukhadayaka mata | dushtadalana
    jaga mem vikhyata || bhala vishala mukuta chavichajai | kara mem shisha shatru ka sajai || duje hatha
    lie madhu pyala | hatha tisare sohata bhala || cauthe khappara khadga kara pance | chathe trishulashatru
    bala jance || saptama karadamakata asi pyari | shobha adbhuta mata tumhari || ashtama kara bhaktana
    vara data | jaga manaharana rupa ye mata || bhaktana mem anurakta bhavani | nishadina ratemrishi muni
    jnani || mahashakti ati prabala punita | tu hi kali tu hi sita || patita tarini he jaga palaka | kalyani
    papikula ghalaka || shesha suresha na pavata para | gauri rupa dharyo ika bara || tuma samana data
    nahim duja | vidhivata karem bhaktajana puja || rupa bhayankara jaba tuma dhara | dushtadalana kinhehu
    samhara || nama anekana mata tumhare | bhaktajanom ke sankata tare || kali ke kashta kaleshana harani
    | bhava bhaya mocana mangala karani || mahima agama veda yasha gavaim | narada sharada para na pavaim
    || bhu para bhara badhyau jaba bhari | taba taba tuma prakatim mahatari || adi anadi abhaya varadata
    | vishvavidita bhava sankata trata || kusamaya nama tumharau linha | usako sada abhaya vara dinha
    || dhyana dharem shruti shesha suresha | kala rupa lakhi tumaro bhesha || kalua bhaimrom sanga tumhare
    | ari hita rupa bhayanaka dhare || sevaka langura rahata agari | causatha jogana ajnakari || treta
    mem raghuvara hita ai | dashakandhara ki saina nasai || khela rana ka khela nirala | bhara mamsa majja
    se pyala || raudra rupa lakhi danava bhage | kiyau gavana bhavana nija tyage || taba aisau tamasa
    carha ayo | svajana vijana ko bheda bhulayo || ye balaka lakhi shankara ae | raha roka caranana mem
    dhae || taba mukha jibha nikara jo ai | yahi rupa pracalita hai mai || badhyo mahishasura mada bhari
    | piraita kie sakala nara nari || karuna pukara suni bhaktana ki | pira mitavana hita jana jana ki
    || taba pragati nija saina sameta | nama paraa mam mahisha vijeta || shumbha nishumbha hane chana
    mahim | tuma sama jaga dusara kau nahim || mana mathanahari khala dala ke | sada sahayaka bhakta vikala
    ke || dina vihina karaim nita seva | pavaim manavanchita phala meva || sankata mem jo sumirana karahim
    | unake kashta matu tuma harahim || prema sahita jo kiratigavaim | bhava bandhana som mukti pavaim
    || kali calisa jo parhahim | svargaloka binu bandhana carhahim || daya drishti herau jagadamba | kehi
    karanamam kiyau vilamba || karahu matu bhaktana rakhavali | jayati jayati kali kankali || sevaka dina
    anatha anari| bhaktibhava yuti sharana tumhari || doha prema sahita jo kare kali calisa patha | tinaki
    purana kamana
  devanagari: दोहा जयकाली कलिमलहरण महिमा अगम अपार । महिष मर्दिनी कालिका देहु अभय अपार ॥ अरि मद मान मिटावन
    हारी । मुण्डमाल गल सोहत प्यारी ॥ अष्टभुजी सुखदायक माता । दुष्टदलन जग में विख्याता ॥ भाल विशाल मुकुट
    छविछाजै । कर में शीश शत्रु का साजै ॥ दूजे हाथ लिए मधु प्याला । हाथ तीसरे सोहत भाला ॥ चौथे खप्पर खड्ग
    कर पाञ्चे । छठे त्रिशूलशत्रु बल जाञ्चे ॥ सप्तम करदमकत असि प्यारी । शोभा अद्भुत मात तुम्हारी ॥ अष्टम
    कर भक्तन वर दाता । जग मनहरण रूप ये माता ॥ भक्तन में अनुरक्त भवानी । निशदिन रटेंॠषी मुनि ज्ञानी ॥ महशक्ति
    अति प्रबल पुनीता । तू ही काली तू ही सीता ॥ पतित तारिणी हे जग पालक । कल्याणी पापीकुल घालक ॥ शेष सुरेश
    न पावत पारा । गौरी रूप धर्यो इक बारा ॥ तुम समान दाता नहिं दूजा । विधिवत करें भक्तजन पूजा ॥ रूप भयङ्कर
    जब तुम धारा । दुष्टदलन कीन्हेहु संहारा ॥ नाम अनेकन मात तुम्हारे । भक्तजनों के सङ्कट टारे ॥ कलि के
    कष्ट कलेशन हरनी । भव भय मोचन मङ्गल करनी ॥ महिमा अगम वेद यश गावैम् । नारद शारद पार न पावैम् ॥ भू पर
    भार बढ्यौ जब भारी । तब तब तुम प्रकटीं महतारी ॥ आदि अनादि अभय वरदाता । विश्वविदित भव सङ्कट त्राता ॥
    कुसमय नाम तुम्हारौ लीन्हा । उसको सदा अभय वर दीन्हा ॥ ध्यान धरें श्रुति शेष सुरेशा । काल रूप लखि तुमरो
    भेषा ॥ कलुआ भैंरों सङ्ग तुम्हारे । अरि हित रूप भयानक धारे ॥ सेवक लाङ्गुर रहत अगारी । चौसठ जोगन आज्ञाकारी
    ॥ त्रेता में रघुवर हित आई । दशकन्धर की सैन नसाई ॥ खेला रण का खेल निराला । भरा मांस मज्जा से प्याला
    ॥ रौद्र रूप लखि दानव भागे । कियौ गवन भवन निज त्यागे ॥ तब ऐसौ तामस चढ़ आयो । स्वजन विजन को भेद भुलायो
    ॥ ये बालक लखि शङ्कर आए । राह रोक चरनन में धाए ॥ तब मुख जीभ निकर जो आई । यही रूप प्रचलित है माई ॥ बाढ्यो
    महिषासुर मद भारी । पीड़इत किए सकल नर नारी ॥ करूण पुकार सुनी भक्तन की । पीर मिटावन हित जन जन की ॥ तब
    प्रगटी निज सैन समेता । नाम पड़आ मां महिष विजेता ॥ शुम्भ निशुम्भ हने छन माहीम् । तुम सम जग दूसर कौ
    नाहीम् ॥ मान मथनहारी खल दल के । सदा सहायक भक्त विकल के ॥ दीन विहीन करैं नित सेवा । पावैं मनवाञ्छित
    फल मेवा ॥ सङ्कट में जो सुमिरन करहीम् । उनके कष्ट मातु तुम हरहीम् ॥ प्रेम सहित जो कीरतिगावैम् । भव
    बन्धन सों मुक्ती पावैम् ॥ काली चालीसा जो पढ़हीम् । स्वर्गलोक बिनु बन्धन चढ़हीम् ॥ दया दृष्टि हेरौ
    जगदम्बा । केहि कारणमां कियौ विलम्बा ॥ करहु मातु भक्तन रखवाली । जयति जयति काली कङ्काली ॥ सेवक दीन अनाथ
    अनारी। भक्तिभाव युति शरण तुम्हारी ॥ दोहा प्रेम सहित जो करे काली चालीसा पाठ । तिनकी पूरन कामना
