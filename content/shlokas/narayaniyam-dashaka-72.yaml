id: narayaniyam-dashaka-72
category: stotram
name:
  english: Narayaniyam Dashaka 72
content:
  english: kamso'tha naradagira vrajavasinam tva makarnya dirnahridayah sa hi gandineyam | ahuya karmukamakhacchalato
    bhavanta manetumenamahinodahinathashayin || || akrura esha bhavadanghriparashciraya tvaddarshanakshamamanah
    kshitipalabhitya | tasyajnayaiva punarikshitumudyatastva manandabharamatibhuritaram babhara || ||
    so'yam rathena sukriti bhavato nivasam gacchan manorathaganamstvayi dharyamanan | asvadayan muhurapayabhayena
    daivam samprarthayan pathi na kincidapi vyajanat || || drakshyami vedashatagitagatim pumamsam sprakshyami
    kimsvidapi nama parishvajeyam | kim vakshyate sa khalu mam kvanu vikshitah sya dittham ninaya sa bhavanmayameva
    margam || || bhuyah kramadabhivishan bhavadanghriputam vrindavanam haravirincasurabhivandyam | anandamagna
    iva lagna iva pramohe kim kim dashantaramavapa na pankajaksha || || pashyannavandata bhavadvihritisthalani
    pamsushvaveshtata bhavaccaranankiteshu | kim brumahe bahujana hi tadapi jata evam tu bhaktitarala
    viralah paratman || || sayam sa gopabhavanani bhavaccaritra gitamritaprasritakarnarasayanani | pashyan
    pramodasariteva kilohyamano gacchan bhavadbhavanasannidhimanvayasit || || tavaddadarsha pashudohavilokalolam
    bhaktottamagatimiva pratipalayantam | bhuman bhavantamayamagrajavantamanta rbrahmanubhutirasasindhumivodvamantam
    || || sayantanaplavavisheshaviviktagatrau dvau pitanilarucirambaralobhaniyau | natiprapancadhritabhushanacaruveshau
    mandasmitardravadanau sa yuvam dadarsha || || duradrathatsamavaruhya namantamena mutthapya bhaktakulamaulimathopaguhan
    | harshanmitaksharagira kushalanuyogi panim pragrihya sabalo'tha griham ninetha || || nandena sakamamitadaramarcayitva
    tam yadavam taduditam nishamayya vartam | gopeshu bhupatinideshakatham nivedya nanakathabhiriha tena
    nishamanaishih || || candragrihe kimuta candrabhagagrihe nu radhagrihe nu bhavane kimu maitravinde
    | dhurto vilambata iti pramadabhiruccai rashankito nishi marutpuranatha payah ||
  devanagari: कंसोऽथ नारदगिरा व्रजवासिनं त्वा माकर्ण्य दीर्णहृदयः स हि गान्दिनेयम् । आहूय कार्मुकमखच्छलतो
    भवन्त मानेतुमेनमहिनोदहिनाथशायिन् ॥ ॥ अक्रूर एष भवदङ्घ्रिपरश्चिराय त्वद्दर्शनाक्षममनाः क्षितिपालभीत्या
    । तस्याज्ञयैव पुनरीक्षितुमुद्यतस्त्वा मानन्दभारमतिभूरितरं बभार ॥ ॥ सोऽयं रथेन सुकृती भवतो निवासं गच्छन्
    मनोरथगणांस्त्वयि धार्यमाणान् । आस्वादयन् मुहुरपायभयेन दैवं सम्प्रार्थयन् पथि न किञ्चिदपि व्यजानात्
    ॥ ॥ द्रक्ष्यामि वेदशतगीतगतिं पुमांसं स्प्रक्ष्यामि किंस्विदपि नाम परिष्वजेयम् । किं वक्ष्यते स खलु
    मां क्वनु वीक्षितः स्या दित्थं निनाय स भवन्मयमेव मार्गम् ॥ ॥ भूयः क्रमादभिविशन् भवदङ्घ्रिपूतं वृन्दावनं
    हरविरिञ्चसुराभिवन्द्यम् । आनन्दमग्न इव लग्न इव प्रमोहे किं किं दशान्तरमवाप न पङ्कजाक्ष ॥ ॥ पश्यन्नवन्दत
    भवद्विहृतिस्थलानि पांसुष्ववेष्टत भवच्चरणाङ्कितेषु । किं ब्रूमहे बहुजना हि तदापि जाता एवं तु भक्तितरला
    विरलाः परात्मन् ॥ ॥ सायं स गोपभवनानि भवच्चरित्र गीतामृतप्रसृतकर्णरसायनानि । पश्यन् प्रमोदसरितेव किलोह्यमानो
    गच्छन् भवद्भवनसन्निधिमन्वयासीत् ॥ ॥ तावद्ददर्श पशुदोहविलोकलोलं भक्तोत्तमागतिमिव प्रतिपालयन्तम् । भूमन्
    भवन्तमयमग्रजवन्तमन्त र्ब्रह्मानुभूतिरससिन्धुमिवोद्वमन्तम् ॥ ॥ सायन्तनाप्लवविशेषविविक्तगात्रौ द्वौ
    पीतनीलरुचिराम्बरलोभनीयौ । नातिप्रपञ्चधृतभूषणचारुवेषौ मन्दस्मितार्द्रवदनौ स युवां ददर्श ॥ ॥ दूराद्रथात्समवरुह्य
    नमन्तमेन मुत्थाप्य भक्तकुलमौलिमथोपगूहन् । हर्षान्मिताक्षरगिरा कुशलानुयोगी पाणिं प्रगृह्य सबलोऽथ गृहं
    निनेथ ॥ ॥ नन्देन साकममितादरमर्चयित्वा तं यादवं तदुदितां निशमय्य वार्ताम् । गोपेषु भूपतिनिदेशकथां निवेद्य
    नानाकथाभिरिह तेन निशामनैषीः ॥ ॥ चन्द्रागृहे किमुत चन्द्रभगागृहे नु राधागृहे नु भवने किमु मैत्रविन्दे
    । धूर्तो विलम्बत इति प्रमदाभिरुच्चै राशङ्कितो निशि मरुत्पुरनाथ पायाः ॥
