name:
  english: bhumivandanam
  devanagari: भूमिवन्दनम्
content:
  english: samudravasane devi parvatastanamandale | vishnupatni namastubhyam padasparsha kshamasva me
    |
  devanagari: समुद्रवसने देवि पर्वतस्तनमण्डले । विष्णुपत्नि नमस्तुभ्यं पादस्पर्श क्षमस्व मे ।
