id: medhadakshinamurtimanasapujastotram
category: stotram
name:
  english: medhadakshinamurtimanasapujastotram
  devanagari: मेधादक्षिणामूर्तिमानसपूजास्तोत्रम्
content:
  english: bhakshyajyayuktam ca dadhiprasiktam | kapitthasadraksha phalanicaiva saposhanam bhakshaya dakshinasya
    || 7|| nirajanam nirmalapatrasamstham karpurasandipitamaccharupam | karomi gaurisha tavoparidam vyomakrite
    shankara dakshinasya || 8|| pushpanjalim padatale vikirnam chatradirajopacaran grihana | mamaparadhan
    sakalan kshamasva dayanidhe maunaguro prasida || 9|| namonamah papavinashanaya namonamah kanjabhavarcitaya
    | namonamah krishnahridisthitaya shridakshinamurtimaheshvaraya || 10|| iti shrimedhadakshinamurtimanasapujastotram
    sampurnam |
  devanagari: भक्ष्याज्ययुक्तं च दधिप्रसिक्तम् । कपित्थसद्राक्ष फलानिचैव सापोशनं भक्षय दक्षिणास्य ॥ ७॥
    नीराजनं निर्मलपात्रसंस्थं कर्पूरसन्दीपितमच्छरूपम् । करोमि गौरीश तवोपरीदं व्योमाकृते शङ्कर दक्षिणास्य
    ॥ ८॥ पुष्पाञ्जलिं पादतले विकीर्णां छत्रादिराजोपचारान् गृहाण । ममापराधान् सकलान् क्षमस्व दयानिधे मौनगुरो
    प्रसीद ॥ ९॥ नमोनमः पापविनाशनाय नमोनमः कञ्जभवार्चिताय । नमोनमः कृष्णहृदिस्थिताय श्रीदक्षिणामूर्तिमहेश्वराय
    ॥ १०॥ इति श्रीमेधादक्षिणामूर्तिमानसपूजास्तोत्रं सम्पूर्णम् ।
meaning: {}
