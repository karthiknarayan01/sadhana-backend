id: annamayya-keerthanas-suvvi-suvvi-suvvaalamma
category: stotram
name:
  english: Annamayya Keerthanas Suvvi Suvvi Suvvaalamma
content:
  english: suvvi suvvi suvvalamma navvucu devaki nandanu ganiyè || shashi vòdacè alasambulu gadacè disha
    devatala digullu vidacè || kaviri virasè kamsudu ginisè vaviri puvvula vanalu gurisè || gati sesè
    atu gadida gusè kutilakudici janakudu noru musè || gaguru pòdicè lokamu vidhi vidicè mògulu guriyaga
    yamunapai nadacè || kalijarè venkatapati mirè alamelmanga nancarammakalukalu tirè ||
  devanagari: सुव्वि सुव्वि सुव्वालम्मा नव्वुचु देवकि नन्दनु गनियॆ ॥ शशि वॊडचॆ अलसम्बुलु गदचॆ दिश देवतल
    दिगुल्लु विडचॆ ॥ काविरि विरसॆ कंसुडु गिनिसॆ वाविरि पुव्वुल वानलु गुरिसॆ ॥ गति सेसॆ अटु गाडिद गूसॆ
    कुतिलकुडिचि जनकुडु नोरु मूसॆ ॥ गगुरु पॊडिचॆ लोकमु विधि विडिचॆ मॊगुलु गुरियग यमुनपै नदचॆ ॥ कलिजारॆ
    वेङ्कटपति मीरॆ अलमेल्मङ्ग नाञ्चारम्मकलुकलु तीरॆ ॥
