    m | tadetenaiva vratenagopayat | tasmadeta m | tejaso gopithaya | tasmadetani yajugmshi vibhrajah
    sauryasyetyahuh | svaha tva suryasya rashmibhya iti prata ssagmsadayati | svaha tva nakshatrebhya
    iti sayam | eta va etasya devatah | tabhirevainagm samardhayati || pradisho gacchetyaha mantah paridhi
