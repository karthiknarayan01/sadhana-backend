id: yatirajavijayashlokah
category: stotram
name:
  english: yatirajavijayashlokah
  devanagari: यतिराजविजयश्लोकाः
content:
  english: '|| namo varadavishnvaryanayananandadayine | vatsyaya varadaryaya vadiniharabhasvate || mayavimohitasuranasuranalavit
    yenacyutassa kuhanasamayairmanushyan | sammohayatsu punareshu sudarshano''pi taneva jetumadhuna yatishekharo''bhut
    || 1|| tridandakashayashikhopavitaih prasadhayan paramahamsyalakshmim | vaikunthamaropayitum mumukshun
    sopanakari yatiraja eshah || 2|| sa esha sakshatkritakrishnadattam nikshepavidyam niravadyabhuma |
    gadyatmana krishnajanopabhogyam samvadarupam vidadhe dayaluh || 3|| pramaneshvesha vedantah prameyeshu
    parah puman | pramatrishu yatindro''yam na dvitiyamapekshate || 4|| karmavyajakritakhilatmanivahakleshavabodhasphurat'
  devanagari: ॥ नमो वरदविष्ण्वार्यनयनानन्ददायिने । वात्स्याय वरदार्याय वादिनीहारभास्वते ॥ मायाविमोहितसुरानसुरानलावीत्
    येनाच्युतस्स कुहनासमयैर्मनुष्यान् । सम्मोहयत्सु पुनरेषु सुदर्शनोऽपि तानेव जेतुमधुना यतिशेखरोऽभूत्
    ॥ १॥ त्रिदण्डकाषायशिखोपवीतैः प्रसाधयन् पारमहंस्यलक्ष्मीम् । वैकुण्ठमारोपयितुं मुमुक्षून् सोपानकारी
    यतिराज एषः ॥ २॥ स एष साक्षात्कृतकृष्णदत्तां निक्षेपविद्यां निरवद्यभूमा । गद्यात्मना कृष्णजनोपभोग्यां
    संवादरूपां विदधे दयालुः ॥ ३॥ प्रमाणेष्वेष वेदान्तः प्रमेयेषु परः पुमान् । प्रमातृषु यतीन्द्रोऽयं न
    द्वितीयमपेक्षते ॥ ४॥ कर्मव्याजकृताखिलात्मनिवहक्लेशावबोधस्फुरत्
