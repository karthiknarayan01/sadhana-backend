id: devataganaihkritamdevakistotram
category: stotram
name:
  english: devataganaihkritamdevakistotram
  devanagari: देवतागणैःकृतंदेवकीस्तोत्रम्
content:
  english: devataganaih kritam devakistotram adrishtam purushaih stribhirdevakim devataganah | vibhranam
    vapusha vishnum tushtuvustamaharnisham || 5
  devanagari: देवतागणैः कृतं देवकीस्तोत्रम् अदृष्टां पुरुषैः स्त्रीभिर्देवकीं देवतागणाः । विभ्राणां वपुषा
    विष्णुं तुष्टुवुस्तामहर्निशम् ॥ ५
meaning: {}
