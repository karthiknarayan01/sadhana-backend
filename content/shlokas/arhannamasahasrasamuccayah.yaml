id: arhannamasahasrasamuccayah
category: sahasranama
name:
  english: arhannamasahasrasamuccayah
  devanagari: अर्हन्नामसहस्रसमुच्चयः
content:
  english: rinvan vaca samuccaran | jivah pivarapunyashrirlabhate phalamuttamam || 1|| ataeva pratipratah
    samutthaya manishibhih | bhaktya'shtagrasahasrarhannamoccaro vidhiyate || 2|| om shrimanarhan jinah
    svami svayambhuh shambhuratmabhuh | svayamprabhuh prabhurbhokta vishvabhurapunarbhavah || 3|| vishvatma
    vishvalokesho vishvatashvakshuraksharah | vishvavid vishvavidyesho vishvayoniranishvarah || 4|| vishvadrishva
    vibhurdhata vishvesho vishvalocanah | vishvavyapi vidhurvedhah shashvato vishvatomukhah || 5|| vishvapo
    vishvatah pado vishvashirshah shucishravah | vishvadrig vishvabhutesho vishvajyotiranashvarah || 6||
    vishvasrit vishvasurvishvet vishvabhuk vishvanayakah | vishvashi vishvabhutatma vishvajid vishvapalakah
    || 7|| vishvakarma jagadvishvom vishvamurttirjineshvarah | bhutabhavibhavadbhartta vishvavaidyo yatishvarah
    || 8|| sarvadih sarvadrik sarvah sarvajnah sarvadarshanah | sarvatma sarvalokeshah sarvavit sarvalokajit
    || 9|| sarvagah sushrutah sushruh suvak suribahushrutah | sahasrashirshah kshetrajnah sahasrakshah
    sahasrapat || 10|| yugadipurusho brahma pancabrahmamayah shivah | brahmavid brahmatattvajno brahmayonirayonijah
    || 11|| brahmanishthah parabrahma brahmatma brahmasambhavah | brahma brahmapatirbrahmacari brahmapadeshvarah
    || 12|| vishnurjishnurjayi jeta jinendro jinapungavah | parah paratarah sukshmah parameshthi sanatanah
    || 13|| || 100|| jinanatho jagannatho jagatsvami jagatprabhuh | jagatpujyo jagadvandyo jagadisho jagatpatih
    || 14|| jaganneta jagajjeta jaganmanyo jagadvibhuh | jagajjyeshtho jagacchreshtho jagaddhyeyo jagaddhitah
    || 15|| jagadarcyo jagadbandhurjagacchasta jagatpita | jagannetro jaganmaitro jagadipo jagadguruh
    || 16|| svayanjyotirajo'janma parantejah parammahah | paramatma shami shantah paranjyotistamo'pahah
    || 17|| prashantariranantatma yogi yogishvaro guruh | anantajidanantatma bhavyabandhurabandhanah ||
    18|| shuddhabuddhih prabuddhatma siddharthah siddhashasanah | siddhah siddhantavid dhyeyah siddhah
