id: yama-kruta-shiva-keshava-stotram
category: stotram
name:
  english: Yama Kruta Shiva Keshava Stotram
content:
  english: dhyanam madhavomadhavavishau sarvasiddhivihayinau | vande parasparatmanau parasparanutipriyau
    || stotram govinda madhava mukunda hare murare shambho shivesha shashishekhara shulapane | damodara'cyuta
    janardana vasudeva tyajyabhataya iti santatamamananti || gangadharandhakaripo hara nilakantha vaikunthakaitabharipo
    kamathabjapane | bhutesha khandaparasho mrida candikesha tyajyabhataya iti santatamamananti || vishno
    nrisimha madhusudana cakrapane gauripate girisha shankara candracuda | narayana'suranibarhana sharngapane
    tyajyabhataya iti santatamamananti || mrityunjayogra vishamekshana kamashatro shrikantha pitavasanambudanilashaure
    | ishana krittivasana tridashaikanatha tyajyabhataya iti santatamamananti || lakshmipate madhuripo
    purushottamadya shrikantha digvasana shanta pinakapane | anandakanda dharanidhara padmanabha tyajyabhataya
    iti santatamamananti || sarveshvara tripurasudana devadeva brahmanyadeva garudadhvaja shankhapane
    | tryakshoragabharana balamrigankamaule tyajyabhataya iti santatamamananti || shrirama raghava rameshvara
    ravanare bhutesha manmatharipo pramathadhinatha | canuramardana hrishikapate murare tyajyabhataya
    iti santatamamananti || shulin girisha rajanishakalavatamsa kamsapranashana sanatana keshinasha |
    bharga trinetra bhava bhutapate purare tyajyabhataya iti santatamamananti || gopipate yadupate vasudevasuno
    karpuragaura vrishabhadhvaja phalanetra | govardhanoddharana dharmadhurina gopa tyajyabhataya iti
    santatamamananti || sthano trilocana pinakadhara smarare krishna'niruddha kamalakara kalmashare |
    vishveshvara tripathagardrajatakalapa tyajyabhataya iti santatamamananti || ashtottaradhikashatena
    sucarunamnam sandharbhitam lalitaratnakadambakena | sannamakam dridhagunam dvijakanthagam yah kuryadimam
    srajamaho sa yamam na pashyet || iti yamakrita shri shivakeshava stutih |
  devanagari: ध्यानं माधवोमाधवावीशौ सर्वसिद्धिविहायिनौ । वन्दे परस्परात्मानौ परस्परनुतिप्रियौ ॥ स्तोत्रं
    गोविन्द माधव मुकुन्द हरे मुरारे शम्भो शिवेश शशिशेखर शूलपाणे । दामोदराऽच्युत जनार्दन वासुदेव त्याज्याभटाय
    इति सन्ततमामनन्ति ॥ गङ्गाधरान्धकरिपो हर नीलकण्ठ वैकुण्ठकैटभरिपो कमठाब्जपाणे । भूतेश खण्डपरशो मृड चण्डिकेश
    त्याज्याभटाय इति सन्ततमामनन्ति ॥ विष्णो नृसिंह मधुसूदन चक्रपाणे गौरीपते गिरिश शङ्कर चन्द्रचूड । नारायणाऽसुरनिबर्हण
    शार्ङ्गपाणे त्याज्याभटाय इति सन्ततमामनन्ति ॥ मृत्युञ्जयोग्र विषमेक्षण कामशत्रो श्रीकण्ठ पीतवसनाम्बुदनीलशौरे
    । ईशान कृत्तिवसन त्रिदशैकनाथ त्याज्याभटाय इति सन्ततमामनन्ति ॥ लक्ष्मीपते मधुरिपो पुरुषोत्तमाद्य श्रीकण्ठ
    दिग्वसन शान्त पिनाकपाणे । आनन्दकन्द धरणीधर पद्मनाभ त्याज्याभटाय इति सन्ततमामनन्ति ॥ सर्वेश्वर त्रिपुरसूदन
    देवदेव ब्रह्मण्यदेव गरुडध्वज शङ्खपाणे । त्र्यक्षोरगाभरण बालमृगाङ्कमौले त्याज्याभटाय इति सन्ततमामनन्ति
    ॥ श्रीराम राघव रमेश्वर रावणारे भूतेश मन्मथरिपो प्रमथाधिनाथ । चाणूरमर्दन हृषीकपते मुरारे त्याज्याभटाय
    इति सन्ततमामनन्ति ॥ शूलिन् गिरीश रजनीशकलावतंस कंसप्रणाशन सनातन केशिनाश । भर्ग त्रिनेत्र भव भूतपते
    पुरारे त्याज्याभटाय इति सन्ततमामनन्ति ॥ गोपीपते यदुपते वसुदेवसूनो कर्पूरगौर वृषभध्वज फालनेत्र । गोवर्धनोद्धरण
    धर्मधुरीण गोप त्याज्याभटाय इति सन्ततमामनन्ति ॥ स्थाणो त्रिलोचन पिनाकधर स्मरारे कृष्णाऽनिरुद्ध कमलाकर
    कल्मषारे । विश्वेश्वर त्रिपथगार्द्रजटाकलाप त्याज्याभटाय इति सन्ततमामनन्ति ॥ अष्टोत्तराधिकशतेन सुचारुनाम्नां
    सन्धर्भितां ललितरत्नकदम्बकेन । सन्नामकां दृढगुणां द्विजकण्ठगां यः कुर्यादिमां स्रजमहो स यमं न पश्येत्
    ॥ इति यमकृत श्री शिवकेशव स्तुतिः ।
