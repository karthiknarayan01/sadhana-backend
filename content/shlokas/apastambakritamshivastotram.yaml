id: apastambakritamshivastotram
category: stotram
name:
  english: apastambakritamshivastotram
  devanagari: आपस्तम्बकृतंशिवस्तोत्रम्
content:
  english: apastambakritam shivastotram apastamba uvaca | kashtheshu vahnih kusumeshu gandho bijeshu vrikshadi
    drishatsu hema | bhuteshu sarveshu tatha'sti yo vai tam somanatham sharanam vrajami || 23|| yo lilaya
    vishvamidam cakara dhata vidhata bhuvanatrayasya | yo vishvarupah sadasatparo yah someshvaram tam
    sharanam vrajami || 24|| yam smritya daridryamahabhishaparogadibhirna sprishyate shariri | yamashritashcepsitamapnuvanti
    someshvaram tam sharanam vrajami || 25|| yena trayidharmamavekshya purvam brahmadayastatra samihitashca
    | evam dvidha yena kritam shariram someshvaram tam sharanam vrajami || 26|| yasmai namo gacchati mantraputam
    hutam havirya ca krita ca puja | dattam haviryena sura bhajante someshvaram tam sharanam vrajami ||
    27|| yasmatparam nanyadasti prashastam yasmatparam naiva susukshmamanyat | yasmatparam no mahatam
    mahacca someshvaram tam sharanam vrajami || 28|| yasyajnaya vishvamidam vicitramacintyarupam vividham
    mahacca | ekakriyam yadvadanuprayati someshvaram tam sharanam vrajami || 29|| yasminvibhutih sakaladhipatyam
    kartritvadatritvamahattvameva | pritiryashah saukhyamanadidharmah someshvaram tam sharanam vrajami
    || 30|| nityam sharanyah sakalasya pujyo nityam priyo yah sharanagatasya | nityam shivo yah sakalasya
    rupam someshvaram tam sharanam vrajami || 31|| iti brahmapurane tramshadhikashatatamadhyayantargatam
    apastambakritam shivastotram samaptam | brahmapurana | adhyaya 130
  devanagari: आपस्तम्बकृतं शिवस्तोत्रम् आपस्तम्ब उवाच । काष्ठेषु वह्निः कुसुमेषु गन्धो बीजेषु वृक्षादि
    दृषत्सु हेम । भूतेषु सर्वेषु तथाऽस्ति यो वै तं सोमनाथं शरणं व्रजामि ॥ २३॥ यो लीलया विश्वमिदं चकार
    धाता विधाता भुवनत्रयस्य । यो विश्वरूपः सदसत्परो यः सोमेश्वरं तं शरणं व्रजामि ॥ २४॥ यं स्मृत्य दारिद्र्यमहाभिशापरोगादिभिर्न
    स्पृश्यते शरीरी । यमाश्रिताश्चेप्सितमाप्नुवन्ति सोमेश्वरं तं शरणं व्रजामि ॥ २५॥ येन त्रयीधर्ममवेक्ष्य
    पूर्वं ब्रह्मादयस्तत्र समीहिताश्च । एवं द्विधा येन कृतं शरीरं सोमेश्वरं तं शरणं व्रजामि ॥ २६॥ यस्मै
    नमो गच्छति मन्त्रपूतं हुतं हविर्या च कृता च पूजा । दत्तं हविर्येन सूरा भजन्ते सोमेश्वरं तं शरणं व्रजामि
    ॥ २७॥ यस्मात्परं नान्यदस्ति प्रशस्तं यस्मात्परं नैव सुसूक्ष्ममन्यत् । यस्मात्परं नो महतां महच्च सोमेश्वरं
    तं शरणं व्रजामि ॥ २८॥ यस्याज्ञया विश्वमीदं विचित्रमचिन्त्यरूपं विविधं महच्च । एकक्रियं यद्वदनुप्रयाति
    सोमेश्वरं तं शरणं व्रजामि ॥ २९॥ यस्मिन्विभूतिः सकलाधिपत्यं कर्तृत्वदातृत्वमहात्त्वमेव । प्रीतिर्यशः
    सौख्यमनादिधर्मः सोमेश्वरं तं शरणं व्रजामि ॥ ३०॥ नित्यं शरण्यः सकलस्य पूज्यो नित्यं प्रियो यः शरणागतस्य
    । नित्यं शिवो यः सकलस्य रूपं सोमेश्वरं तं शरणं व्रजामि ॥ ३१॥ इति ब्रह्मपुराणे त्रंशाधिकशततमाध्यायान्तर्गतं
    आपस्तम्बकृतं शिवस्तोत्रं समाप्तम् । ब्रह्मपुराण । अध्याय १३०
