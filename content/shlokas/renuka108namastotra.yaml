id: renuka108namastotra
category: stotram
name:
  english: renuka108namastotra
  devanagari: रेणुका१०८नामस्तोत्र
content:
  english: bhaktanandavidhayinim pramuditam nityotsavam renukam || om jagadamba jagadvandya mahashaktirmaheshvari
    | mahadevi mahakali mahalakshmih sarasvati || mahavira maharatrih kalaratrishca kalika | siddhavidya
    ramamata shiva shanta rishipriya || narayani jaganmata jagadbija jagatprabha | candrika candracuda
    ca candrayudhadharashubha || bhramaramba tathananda renuka mrityunashini | durgama durlabha gauri
    durga bhargakutumbini || katyayani mahamata rudrani cambika sati | kalpavriksha kamadhenuh cintamanirupadharini
    || siddhacalavasini ca siddhavrindasushobhini | jvalamukhi jvalatkanta jvalaprajvalarupini || aja
    pinakini bhadra vijaya vijayotsava | kushtharogahara dipta dushtasuragarvamardini || siddhida buddhida
    shuddha nityanityatapahpriya | niradhara nirakara nirmaya ca shubhaprada || aparna cannapurna ca purnacandranibhanana
    | kripakara khadgahasta chinnahasta cidambara || camundi candikananta ratnabharanabhushita | vishalakshi
    ca kamakshi minakshi mokshadayini || savitri caiva saumitri sudha sadbhaktarakshini | shantishca shantyatita
    ca shantatitatara tatha || jamadagnitamohantri dharmarthakamamokshada | kamada kamajanani matrika
    suryakantini || mantrasiddhirmahateja matrimandalavallabha | lokapriya renutanaya bhavani raudrarupini
    || tushtida pushtida caiva shambhavi sarvamangala | etadashtottarashata namastotram pathet sada ||
    sarvam sampatkaram divyam sarvabhishtaphalapradam | ashtasiddhiyutam caiva sarvapapanivaranam || digbandhana
    shantimantrah indradi digpalakah svasthasthaneshu sthiri bhavantu | om shantih shantih shantih | iti
    shri shandilyamaharshiviracita shrirenukadevyashtottarashatanamavalih sampurna |
  devanagari: भक्तानन्दविधायिनीं प्रमुदितां नित्योत्सवां रेणुकाम् ॥ ॐ जगदम्बा जगद्वन्द्या महाशक्तिर्महेश्वरी
    । महादेवी महाकाली महालक्ष्मीः सरस्वती ॥ महावीरा महारात्रिः कालरात्रिश्च कालिका । सिद्धविद्या राममाता
    शिवा शान्ता ऋषिप्रिया ॥ नारायणी जगन्माता जगद्बीजा जगत्प्रभा । चन्द्रिका चन्द्रचूडा च चन्द्रायुधधराशुभा
    ॥ भ्रमराम्बा तथानन्दा रेणुका मृत्युनाशिनी । दुर्गमा दुर्लभा गौरी दुर्गा भर्गकुटुम्बिनी ॥ कात्यायनी
    महामाता रुद्राणी चाम्बिका सती । कल्पवृक्षा कामधेनुः चिन्तामणिरूपधारिणी ॥ सिद्धाचलवासिनी च सिद्धवृन्दसुशोभिनी
    । ज्वालामुखी ज्वलत्कान्ता ज्वालाप्रज्वलरूपिणी ॥ अजा पिनाकिनी भद्रा विजया विजयोत्सवा । कुष्ठरोगहरा
    दीप्ता दुष्टासुरगर्वमर्दिनी ॥ सिद्धिदा बुद्धिदा शुद्धा नित्यानित्यतपःप्रिया । निराधारा निराकारा निर्माया
    च शुभप्रदा ॥ अपर्णा चान्नपूर्णा च पूर्णचन्द्रनिभानना । कृपाकरा खड्गहस्ता छिन्नहस्ता चिदम्बरा ॥ चामुण्डी
    चण्डिकानन्ता रत्नाभरणभूषिता । विशालाक्षी च कामाक्षी मीनाक्षी मोक्षदायिनी ॥ सावित्री चैव सौमित्री सुधा
    सद्भक्तरक्षिणी । शान्तिश्च शान्त्यतीता च शान्तातीततरा तथा ॥ जमदग्नितमोहन्त्री धर्मार्थकाममोक्षदा ।
    कामदा कामजननी मातृका सूर्यकान्तिनी ॥ मन्त्रसिद्धिर्महातेजा मातृमण्डलवल्लभा । लोकप्रिया रेणुतनया भवानी
    रौद्ररूपिणी ॥ तुष्टिदा पुष्टिदा चैव शाम्भवी सर्वमङ्गला । एतदष्टोत्तरशत नामस्तोत्रं पठेत् सदा ॥ सर्वं
    सम्पत्करं दिव्यं सर्वाभीष्टफलप्रदम् । अष्टसिद्धियुतं चैव सर्वपापनिवारणम् ॥ दिग्बन्धन शान्तिमन्त्राः
    इन्द्रादि दिग्पालकाः स्वस्थस्थानेषु स्थिरी भवन्तु । ॐ शान्तिः शान्तिः शान्तिः । इति श्री शाण्डिल्यमहर्षिविरचिता
    श्रीरेणुकादेव्यष्टोत्तरशतनामावलिः सम्पूर्णा ।
