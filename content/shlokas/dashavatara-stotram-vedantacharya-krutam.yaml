id: dashavatara-stotram-vedantacharya-krutam
category: stotram
name:
  english: Dashavatara Stotram (Vedantacharya Krutam)
content:
  english: devo nashshubhamatanotu dashadha nirvartayanbhumikam range dhamani labdhanirbhararasairadhyakshito
    bhavukaih | yadbhaveshu prithagvidheshvanugunanbhavansvayam bibhrati yaddharmairiha dharmini viharate
    nanakritirnayika || || nirmagnashrutijalamarganadashadattakshanairvikshanai rantastanvadivaravindagahananyaudanvatinamapam
    | nishpratyuhatarangarinkhanamithah pratyudhapathashchata dolarohasadohalam bhagavato matsyam vapuh
    patu nah || || avyasurbhuvanatrayimanibhritam kanduyanairadrina nidranasya parasya kurmavapusho nishvasavatormayah
    | yadvikshepanasamskritodadhipayah prenkholaparyankika nityarohananirvrito viharate devassahaiva shriya
    || || gopayedanisham jaganti kuhanapotri pavitrikrita brahmandapralayormighoshagurubhirghonaravairghurghuraih
    | yaddamshtrankurakotigadhaghatananishkampanityasthiti rbrahmastambamasaudasau bhagavatimustevavishvambhara
    || || pratyadishtapuratanapraharanagramahkshanam panijai ravyattrini jagantyakunthamahima vaikunthakanthiravah
    | yatpradurbhavanadavandhyajatharayadricchikadvedhasam ya kacitsahasa mahasuragrihasthunapitamahyabhrit
    || || vridaviddhavadanyadanavayashonasiradhatibhata straiyaksham makutam punannavatu nastraivikramo
    vikramah | yatprastavasamucchritadhvajapativrittantasiddhantibhi ssrotobhissurasindhurashtasudishasaudheshu
    dodhuyate || || krodhagnim jamadagnipidanabhavam santarpayishyan krama dakshatramiha santataksha ya
    imam trissaptakritvah kshitim | datva karmani dakshinam kvacana tamaskandya sindhum vasa nnabrahmanyamapakarotu
    bhagavanabrahmakitam munih || || paravarapayovishoshanakalaparinakalanala jvalajalaviharaharivishikhavyaparaghorakramah
    | sarvavasthasakritprapannajanatasamrakshanaikavrati dharmo vigrahavanadharmaviratim dhanvi satanvitu
    nah || || phakkatkauravapattanaprabhritayah prastapralambadaya stalankasyatathavidha vihritayastanvantu
    bhadrani nah | kshiram sharkarayeva yabhiraprithagbhutah prabhutairgunai rakaumarakamasvadantajagate
    krishnasya tah kelayah || || nathayaiva namah padam bhavatu nashcitraishcaritrakramai rbhuyobhirbhuvananyamunikuhanagopaya
    gopayate | kalindirasikayakaliyaphanispharasphatavatika rangotsangavishankacankramadhuraparyaya caryayate
    || || bhavinya dashayabhavanniha bhavadhvamsaya nah kalpatam kalki vishnuyashassutah kalikathakalushyakulankashah
    | nishsheshakshatakantake kshititale dharajalaughairdhruvam dharmam kartayugam prarohayati yannistrimshadharadharah
    || || icchamina viharakacchapa mahapotrin yadricchahare rakshavamana rosharama karunakakutstha helahalin
    | kridavallava kalkivahana dashakalkinniti pratyaham jalpantah purushah punantu bhuvanam punyaughapanyapanah
    || vidyodanvati venkateshvarakavau jatam jaganmangalam deveshasyadashavataravishayam stotram vivaksheta
    yah | vaktre tasya sarasvati bahumukhi bhaktih para manase shuddhih kapi tanau dishasu dashasu khyatishshubha
    jrimbhate || iti kavitarkikasimhasya sarvatantrasvatantrasya shrimadvenkatanathasya vedantacaryasya
    kritishu dashavatarastotram |
  devanagari: देवो नश्शुभमातनोतु दशधा निर्वर्तयन्भूमिकां रङ्गे धामनि लब्धनिर्भररसैरध्यक्षितो भावुकैः ।
    यद्भावेषु पृथग्विधेष्वनुगुणान्भावान्स्वयं बिभ्रती यद्धर्मैरिह धर्मिणी विहरते नानाकृतिर्नायिका ॥ ॥
    निर्मग्नश्रुतिजालमार्गणदशादत्तक्षणैर्वीक्षणै रन्तस्तन्वदिवारविन्दगहनान्यौदन्वतीनामपाम् । निष्प्रत्यूहतरङ्गरिङ्खणमिथः
    प्रत्यूढपाथश्छटा डोलारोहसदोहलं भगवतो मात्स्यं वपुः पातु नः ॥ ॥ अव्यासुर्भुवनत्रयीमनिभृतं कण्डूयनैरद्रिणा
    निद्राणस्य परस्य कूर्मवपुषो निश्वासवातोर्मयः । यद्विक्षेपणसंस्कृतोदधिपयः प्रेङ्खोलपर्यङ्किका नित्यारोहणनिर्वृतो
    विहरते देवस्सहैव श्रिया ॥ ॥ गोपायेदनिशं जगन्ति कुहनापोत्री पवित्रीकृत ब्रह्माण्डप्रलयोर्मिघोषगुरुभिर्घोणारवैर्घुर्घुरैः
    । यद्दंष्ट्राङ्कुरकोटिगाढघटनानिष्कम्पनित्यस्थिति र्ब्रह्मस्तम्बमसौदसौ भगवतीमुस्तेवविश्वम्भरा ॥ ॥ प्रत्यादिष्टपुरातनप्रहरणग्रामःक्षणं
    पाणिजै रव्यात्त्रीणि जगन्त्यकुण्ठमहिमा वैकुण्ठकण्ठीरवः । यत्प्रादुर्भवनादवन्ध्यजठरायादृच्छिकाद्वेधसां
    या काचित्सहसा महासुरगृहस्थूणापितामह्यभृत् ॥ ॥ व्रीडाविद्धवदान्यदानवयशोनासीरधाटीभट स्त्रैयक्षं मकुटं
    पुनन्नवतु नस्त्रैविक्रमो विक्रमः । यत्प्रस्तावसमुच्छ्रितध्वजपटीवृत्तान्तसिद्धान्तिभि स्स्रोतोभिस्सुरसिन्धुरष्टसुदिशासौधेषु
    दोधूयते ॥ ॥ क्रोधाग्निं जमदग्निपीडनभवं सन्तर्पयिष्यन् क्रमा दक्षत्रामिह सन्ततक्ष य इमां त्रिस्सप्तकृत्वः
    क्षितिम् । दत्वा कर्मणि दक्षिणां क्वचन तामास्कन्द्य सिन्धुं वस न्नब्रह्मण्यमपाकरोतु भगवानाब्रह्मकीटं
    मुनिः ॥ ॥ पारावारपयोविशोषणकलापारीणकालानल ज्वालाजालविहारहारिविशिखव्यापारघोरक्रमः । सर्वावस्थसकृत्प्रपन्नजनतासंरक्षणैकव्रती
    धर्मो विग्रहवानधर्मविरतिं धन्वी सतन्वीतु नः ॥ ॥ फक्कत्कौरवपट्टणप्रभृतयः प्रास्तप्रलम्बादय स्तालाङ्कास्यतथाविधा
    विहृतयस्तन्वन्तु भद्राणि नः । क्षीरं शर्करयेव याभिरपृथग्भूताः प्रभूतैर्गुणै राकौमारकमस्वदन्तजगते कृष्णस्य
    ताः केलयः ॥ ॥ नाथायैव नमः पदं भवतु नश्चित्रैश्चरित्रक्रमै र्भूयोभिर्भुवनान्यमूनिकुहनागोपाय गोपायते
    । कालिन्दीरसिकायकालियफणिस्फारस्फटावाटिका रङ्गोत्सङ्गविशङ्कचङ्क्रमधुरापर्याय चर्यायते ॥ ॥ भाविन्या
    दशयाभवन्निह भवध्वंसाय नः कल्पतां कल्की विष्णुयशस्सुतः कलिकथाकालुष्यकूलङ्कषः । निश्शेषक्षतकण्टके क्षितितले
    धाराजलौघैर्ध्रुवं धर्मं कार्तयुगं प्ररोहयति यन्निस्त्रिंशधाराधरः ॥ ॥ इच्छामीन विहारकच्छप महापोत्रिन्
    यदृच्छाहरे रक्षावामन रोषराम करुणाकाकुत्स्थ हेलाहलिन् । क्रीडावल्लव कल्किवाहन दशाकल्किन्निति प्रत्यहं
    जल्पन्तः पुरुषाः पुनन्तु भुवनं पुण्यौघपण्यापणाः ॥ विद्योदन्वति वेङ्कटेश्वरकवौ जातं जगन्मङ्गलं देवेशस्यदशावतारविषयं
    स्तोत्रं विवक्षेत यः । वक्त्रे तस्य सरस्वती बहुमुखी भक्तिः परा मानसे शुद्धिः कापि तनौ दिशासु दशसु
    ख्यातिश्शुभा जृम्भते ॥ इति कवितार्किकसिंहस्य सर्वतन्त्रस्वतन्त्रस्य श्रीमद्वेङ्कटनाथस्य वेदान्ताचार्यस्य
    कृतिषु दशावतारस्तोत्रम् ।
