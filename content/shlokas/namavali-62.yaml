    varenyaya namah | 10 || om sharanyaya namah | om pinakine namah | om yogine namah | om dhyanagamyaya
    namah | om ramyaya namah | om gurave namah | om avasanyaya namah | om vanyaya namah | om ahananyaya
    namah | om kamanashaya namah | 20 || om vasaya namah | om haranaya namah | om visarine namah | om
    maheshaya namah | om shantamumapataye namah | om pradhanapurusheshaya namah | om yogadhipataye namah
    | om trikagnikalaya namah | om tryambakaya namah | om pinakine namah | 30 || om kalaya namah | om
    rudraya namah | om mahasatraya namah | om shuline namah | om dhurjataye namah | om jatilaya namah
    | om krishaya namah | om brahmadhipataye namah | om brahmavidyadhipaya namah | om vishnujanakaya namah
    | 40 || om kamakayantakaya namah | om vedarahasyaya namah | om harshatarshaya namah | om vedavedantasaraya
    namah | om suparaya namah | om atitanagatajnaya namah | om vartamanaya namah | om brimhate namah |
    om merukodandahastaya namah | om gangamastaya namah | 50 || om darine namah | om buddhaya namah |
    om shuddhaya namah | om medhyaya namah | om paramatmane namah | om bhutanathaya namah | om bhavyaya
    namah | om havyakavyabhuje namah | om digvasase namah | om dandine namah | 60 || om mundine namah
    | om anadimalahinaya namah | om jnanagamyaya namah | om pradhanaparamanvadimurtaye namah | om anantashaktaye
    namah | om vicitramahimadharasvarupaya namah | om bhumne namah | om simne namah | om vedadhamne namah
    | om vyomasamne namah | 70 || om taraya namah | om tirthaya namah | om sargadiparamaya namah | om
    paryaya namah | om varyaya namah | om sharvaya namah | om pratimaya namah | om kukkuraya namah | om
    visheshaya namah | om madhyantarahitaya namah | 80 || om prasannaya namah | om paraya namah | om kamangaya
    namah | om suretase namah | om garjate namah | om tarjate namah | om marjate namah | om brahmarupine
    namah | om urjaya namah | om kalanetraya namah | 90 || om durgagamyaya namah | om bhasvate namah |
    om tamraya namah | om tarunaya namah | om karanaya namah | om dharmadigamyaya namah | om viragaya
    namah | om suragine namah | om nishprapancaya namah | om nirabhasaya namah | 100 || om brahmane namah
    | om vishvarupaya namah | om sanatanaya namah | om manyave namah | om pattinam pataye namah | om karananam
    karine namah | om paradaviryaya namah | om durgartishamanaya namah | 108 || || iti shivarahasyavyutpannam
    phalgunamasakrite shivashatashtanamavalih sampurna ||
