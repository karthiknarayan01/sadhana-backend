id: shri-ganesha-stuti
category: stotram
name:
  english: shri ganesha stuti
  devanagari: श्री गणेश स्तुति
content:
  english: shrimad shamkaracarya dvara shri ganesha ki stuti muda karattamodakam sada vimuktisadhakam
    kaladharavatamsakam vilasilokaranjakam| anayakaikanayakam vinashitebhadaityakam natashubhashunashakam
    namami tam vinayakam || 1|| natetaratibhikaram navoditarkabhasvaram namatsurarinirjakam natadhikapaduddharam
    | sureshvaramam nidhishvaram gajeshvaram ganeshvaram maheshvaram tamashraye paratparam nirantaram
    || 2|| samastalokashamkaram nirastadaityakunjaram daretarodaram varam varebhavaktramaksharam | kripakaram
    kshamakaram mudakaram yashaskaram namaskaram namaskritam namaskaromi bhasvaram || 3|| akimcanartimarjanam
    ciramtanoktibhajanam puraripurvanandanam surarigarvacarvanam | prapancanashabhishanam dhanamjayadibhushanam
    kapoladanavaranam bhaje puranavaranam ||4|| nitantakantadantakantimantakantakatmajamacintyarupamantahinamantarayakrintanam|
    hridantare nirantaram vasantameva yoginam tamekadantameva tam vicintayami samtatam || 5|| mahaganesha
    pancaratnamadarena yo'nvaham pragayati prabhatake hridi smaran ganeshvaram | arogatamadoshatam susahitim
    suputratam samahitayurashtabhutimabhyupaiti so'cirat || 6|| mamgalamurti moraya
  devanagari: श्रीमद् शंकराचार्य द्वारा श्री गणेश की स्तुति मुदा करात्तमोदकं सदा विमुक्तिसाधकं कलाधरावतंसकं
    विलासिलोकरञ्जकम्। अनायकैकनायकं विनाशितेभदैत्यकं नताशुभाशुनाशकं नमामि तं विनायकम् ।। १।। नतेतरातिभीकरं
    नवोदितार्कभास्वरं नमत्सुरारिनिर्जकं नताधिकापदुद्धरम् । सुरेश्वरमं निधीश्वरं गजेश्वरं गणेश्वरं महेश्वरं
    तमाश्रये परात्परं निरन्तरम् ।। २।। समस्तलोकशंकरं निरस्तदैत्यकुञ्जरं दरेतरोदरं वरं वरेभवक्त्रमक्षरम्
    । कृपाकरं क्षमाकरं मुदाकरं यशस्करं नमस्करं नमस्कृतां नमस्करोमि भास्वरम् ।। ३।। अकिंचनार्तिमार्जनं
    चिरंतनोक्तिभाजनं पुरारिपूर्वनन्दनं सुरारिगर्वचर्वणम् । प्रपञ्चनाशभीषणं धनंजयादिभूषणं कपोलदानवारणं
    भजे पुराणवारणम् ।।४।। नितान्तकान्तदन्तकान्तिमन्तकान्तकात्मजमचिन्त्यरुपमन्तहीनमन्तरायकृन्तनम्। हृदन्तरे
    निरन्तरं वसन्तमेव योगिनां तमेकदन्तमेव तं विचिन्तयामि संततम् ।। ५।। महागणेश पञ्चरत्नमादरेण योऽन्वहं
    प्रगायति प्रभातके हृदि स्मरन् गणेश्वरम् । अरोगतामदोषतां सुसाहितीं सुपुत्रतां समाहितायुरष्टभूतिमभ्युपैति
    सोऽचिरात् ।। ६।। मंगलमुर्ती मोरया
