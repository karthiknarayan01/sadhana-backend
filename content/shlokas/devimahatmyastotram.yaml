id: devimahatmyastotram
category: stotram
name:
  english: devimahatmyastotram
  devanagari: देवीमाहात्म्यस्तोत्रम्
content:
  english: ramyam bhaktabhishtapradatrim ripumathanakarim sarvalokaikavandyam | sarvalankarayuktam shashiyutamakutam
    shyamalangim krishangim durgam devim prapadye sharanamahamasheshapadunmulanaya || 8|| trayasva svaminiti
    tribhuvanajanani prarthana tvayyapartha palyante'bhyarthanayam bhagavati shishavah kintvananya jananyah
    | tattubhyam syannamasyetyavanata
  devanagari: रम्यां भक्ताभीष्टप्रदात्रीं रिपुमथनकरीं सर्वलोकैकवन्द्याम् । सर्वालङ्कारयुक्तां शशियुतमकुटां
    श्यामलाङ्गीं कृशाङ्गीं दुर्गां देवीं प्रपद्ये शरणमहमशेषापदुन्मूलनाय ॥ ८॥ त्रायस्व स्वामिनीति त्रिभुवनजननि
    प्रार्थना त्वय्यपार्था पाल्यन्तेऽभ्यर्थनायां भगवति शिशवः किन्त्वनन्या जनन्याः । तत्तुभ्यं स्यान्नमस्येत्यवनत
meaning: {}
