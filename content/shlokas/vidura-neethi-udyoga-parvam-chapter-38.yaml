id: vidura-neethi-udyoga-parvam-chapter-38
category: stotram
name:
  english: Vidura Neethi - Udyoga Parvam Chapter 38
content:
  english: '|| iti shrimahabharate udyogaparvani prajagaraparvani viduravakye ashtatrimsho''dhyayah ||
    vidura uvaca | urdhvam prana hyutkramanti yunah sthavira ayati | pratyutthanabhivadabhyam punastanpatipadyate
    || || pitham dattva sadhave''bhyagataya aniyapah parinirnijya padau | sukham prishtva prativedyatma
    samstham tato dadyadannamavekshya dhirah || || yasyodakam madhuparkam ca gam ca na mantravitpratigrihnati
    gehe | lobhadbhayadarthakarpanyato va tasyanartham jivitamahuraryah || || cikitsakah shakya kartavakirni
    stenah kruro madyapo bhrunaha ca | senajivi shrutivikrayakash ca bhrisham priyo''pyatithirnodakarhah
    || || avikreyam lavanam pakvamannam dadhi kshiram madhu tailam ghritam ca | tila mamsam mulaphalani
    shakam raktam vasah sarvagandha gudash ca || || aroshano yah samaloshta kancanah prahina shoko gatasandhi
    vigrahah | ninda prashamsoparatah priyapriye carannudasinavadesha bhikshukah || || nivara mulenguda
    shakavrittih susamyatatmagnikaryeshvacodyah | vane vasannatithishvapramatto dhurandharah punyakridesha
    tapasah || || apakritva buddhimato durastho''smiti nashvaset | dirghau buddhimato bahu yabhyam himsati
    himsitah || || na vishvasedavishvaste vishvaste nativishvaset | vishvasadbhayamutpannam mulanyapi
    nikrintati || || anirshyurguptadarah syatsamvibhagi priyamvadah | shlakshno madhuravakstrinam na casam
    vashago bhavet || || pujaniya mahabhagah punyashca grihadiptayah | striyah shriyo grihasyoktastasmadrakshya
    visheshatah || || piturantahpuram dadyanmaturdadyanmahanasam | goshu catmasamam dadyatsvayameva krishim
    vrajet | bhrityairvanijyacaram ca putraih seveta brahmanan || || adbhyo''gnirbrahmatah kshatramashmano
    lohamutthitam | tesham sarvatragam tejah svasu yonishu shamyati || || nityam santah kule jatah pavakopama
    tejasah | kshamavanto nirakarah kashthe''gniriva sherate || || yasya mantram na jananti bahyashcabhyantarash
    ca ye | sa raja sarvatashcakshushciramaishvaryamashnute || || karishyanna prabhasheta kritanyeva ca
    darshayet | dharmakamartha karyani tatha mantro na bhidyate || || giriprishthamuparuhya prasadam va
    rahogatah | aranye nihshalake va tatra mantro vidhiyate || || nasuhritparamam mantram bharatarhati
    veditum | apandito vapi suhritpandito vapyanatmavan | amatye hyarthalipsa ca mantrarakshanameva ca
    || || kritani sarvakaryani yasya va parshada viduh | gudhamantrasya nripatestasya siddhirasamshayam
    || || aprashastani karmani yo mohadanutishthati | sa tesham viparibhramshe bhrashyate jivitadapi ||
    || karmanam tu prashastanamanushthanam sukhavaham | teshamevananushthanam pashcattapakaram mahat ||
    || sthanavriddha kshayajnasya shadgunya viditatmanah | anavajnata shilasya svadhina prithivi nripa
    || || amoghakrodhaharshasya svayam krityanvavekshinah | atmapratyaya koshasya vasudheyam vasundhara
    || || namamatrena tushyeta chatrena ca mahipatih | bhrityebhyo visrijedarthannaikah sarvaharo bhavet
    || || brahmano brahmanam veda bharta veda striyam tatha | amatyam nripatirveda raja rajanameva ca
    || || na shatrurankamapanno moktavyo vadhyatam gatah | ahataddhi bhayam tasmajjayate naciradiva ||
    || daivateshu ca yatnena rajasu brahmaneshu ca | niyantavyah sada krodho vriddhabalatureshu ca ||
    || nirartham kalaham prajno varjayenmudha sevitam | kirtim ca labhate loke na canarthena yujyate ||
    || prasado nishphalo yasya krodhashcapi nirarthakah | na tam bhartaramicchanti shandham patimiva striyah
    || || na buddhirdhanalabhaya na jadyamasamriddhaye | lokaparyaya vrittantam prajno janati netarah
    || || vidya shilavayovriddhanbuddhivriddhamshca bharata | dhanabhijana vriddhamshca nityam mudho''vamanyate
    || || anarya vrittamaprajnamasuyakamadharmikam | anarthah kshipramayanti vagdushtam krodhanam tatha
    || || avisamvadanam danam samayasyavyatikramah | avartayanti bhutani samyakpranihita ca vak || ||
    avisamvadako dakshah kritajno matimanrijuh | api sankshina kosho''pi labhate parivaranam || || dhritih
    shamo damah shaucam karunyam vaganishthura | mitranam canabhidrohah sataitah samidhah shriyah || ||
    asamvibhagi dushtatma kritaghno nirapatrapah | tadrinnaradhamo loke varjaniyo naradhipa || || na sa
    ratrau sukham shete sa sarpa iva veshmani | yah kopayati nirdosham sa dosho''bhyantaram janam || ||
    yeshu dushteshu doshah syadyogakshemasya bharata | sada prasadanam tesham devatanamivacaret || ||
    ye''rthah strishu samasaktah prathamotpatiteshu ca | ye canarya samasaktah sarve te samshayam gatah
    || || yatra stri yatra kitavo yatra balo''nushasti ca | majjanti te''vasha desha nadyamashmaplava
    iva || || prayojaneshu ye sakta na vishesheshu bharata | tanaham panditanmanye vishesha hi prasanginah
    || || yam prashamsanti kitava yam prashamsanti caranah | yam prashamsanti bandhakyo na sa jivati manavah
    || || hitva tanparameshvasanpandavanamitaujasah | ahitam bharataishvaryam tvaya duryodhane mahat ||
    || tam drakshyasi paribhrashtam tasmattvam naciradiva | aishvaryamadasammudham balim lokatrayadiva
    || || || iti shrimahabharate udyogaparvani prajagaraparvani viduravakye ashtatrimsho''dhyayah ||'
  devanagari: ॥ इति श्रीमहाभारते उद्योगपर्वणि प्रजागरपर्वणि विदुरवाक्ये अष्टत्रिंशोऽध्यायः ॥ विदुर उवाच
    । ऊर्ध्वं प्राणा ह्युत्क्रामन्ति यूनः स्थविर आयति । प्रत्युत्थानाभिवादाभ्यां पुनस्तान्पतिपद्यते ॥
    ॥ पीठं दत्त्वा साधवेऽभ्यागताय आनीयापः परिनिर्णिज्य पादौ । सुखं पृष्ट्वा प्रतिवेद्यात्म संस्थं ततो
    दद्यादन्नमवेक्ष्य धीरः ॥ ॥ यस्योदकं मधुपर्कं च गां च न मन्त्रवित्प्रतिगृह्णाति गेहे । लोभाद्भयादर्थकार्पण्यतो
    वा तस्यानर्थं जीवितमाहुरार्याः ॥ ॥ चिकित्सकः शक्य कर्तावकीर्णी स्तेनः क्रूरो मद्यपो भ्रूणहा च । सेनाजीवी
    श्रुतिविक्रायकश् च भृशं प्रियोऽप्यतिथिर्नोदकार्हः ॥ ॥ अविक्रेयं लवणं पक्वमन्नं दधि क्षीरं मधु तैलं
    घृतं च । तिला मांसं मूलफलानि शाकं रक्तं वासः सर्वगन्धा गुडश् च ॥ ॥ अरोषणो यः समलोष्ट काञ्चनः प्रहीण
    शोको गतसन्धि विग्रहः । निन्दा प्रशंसोपरतः प्रियाप्रिये चरन्नुदासीनवदेष भिक्षुकः ॥ ॥ नीवार मूलेङ्गुद
    शाकवृत्तिः सुसंयतात्माग्निकार्येष्वचोद्यः । वने वसन्नतिथिष्वप्रमत्तो धुरन्धरः पुण्यकृदेष तापसः ॥ ॥
    अपकृत्वा बुद्धिमतो दूरस्थोऽस्मीति नाश्वसेत् । दीर्घौ बुद्धिमतो बाहू याभ्यां हिंसति हिंसितः ॥ ॥ न विश्वसेदविश्वस्ते
    विश्वस्ते नातिविश्वसेत् । विश्वासाद्भयमुत्पन्नं मूलान्यपि निकृन्तति ॥ ॥ अनीर्ष्युर्गुप्तदारः स्यात्संविभागी
    प्रियंवदः । श्लक्ष्णो मधुरवाक्स्त्रीणां न चासां वशगो भवेत् ॥ ॥ पूजनीया महाभागाः पुण्याश्च गृहदीप्तयः
    । स्त्रियः श्रियो गृहस्योक्तास्तस्माद्रक्ष्या विशेषतः ॥ ॥ पितुरन्तःपुरं दद्यान्मातुर्दद्यान्महानसम्
    । गोषु चात्मसमं दद्यात्स्वयमेव कृषिं व्रजेत् । भृत्यैर्वणिज्याचारं च पुत्रैः सेवेत ब्राह्मणान् ॥ ॥
    अद्भ्योऽग्निर्ब्रह्मतः क्षत्रमश्मनो लोहमुत्थितम् । तेषां सर्वत्रगं तेजः स्वासु योनिषु शाम्यति ॥ ॥
    नित्यं सन्तः कुले जाताः पावकोपम तेजसः । क्षमावन्तो निराकाराः काष्ठेऽग्निरिव शेरते ॥ ॥ यस्य मन्त्रं
    न जानन्ति बाह्याश्चाभ्यन्तराश् च ये । स राजा सर्वतश्चक्षुश्चिरमैश्वर्यमश्नुते ॥ ॥ करिष्यन्न प्रभाषेत
    कृतान्येव च दर्शयेत् । धर्मकामार्थ कार्याणि तथा मन्त्रो न भिद्यते ॥ ॥ गिरिपृष्ठमुपारुह्य प्रासादं
    वा रहोगतः । अरण्ये निःशलाके वा तत्र मन्त्रो विधीयते ॥ ॥ नासुहृत्परमं मन्त्रं भारतार्हति वेदितुम् ।
    अपण्डितो वापि सुहृत्पण्डितो वाप्यनात्मवान् । अमात्ये ह्यर्थलिप्सा च मन्त्ररक्षणमेव च ॥ ॥ कृतानि सर्वकार्याणि
    यस्य वा पार्षदा विदुः । गूढमन्त्रस्य नृपतेस्तस्य सिद्धिरसंशयम् ॥ ॥ अप्रशस्तानि कर्माणि यो मोहादनुतिष्ठति
    । स तेषां विपरिभ्रंशे भ्रश्यते जीवितादपि ॥ ॥ कर्मणां तु प्रशस्तानामनुष्ठानं सुखावहम् । तेषामेवाननुष्ठानं
    पश्चात्तापकरं महत् ॥ ॥ स्थानवृद्ध क्षयज्ञस्य षाड्गुण्य विदितात्मनः । अनवज्ञात शीलस्य स्वाधीना पृथिवी
    नृप ॥ ॥ अमोघक्रोधहर्षस्य स्वयं कृत्यान्ववेक्षिणः । आत्मप्रत्यय कोशस्य वसुधेयं वसुन्धरा ॥ ॥ नाममात्रेण
    तुष्येत छत्रेण च महीपतिः । भृत्येभ्यो विसृजेदर्थान्नैकः सर्वहरो भवेत् ॥ ॥ ब्राह्मणो ब्राह्मणं वेद
    भर्ता वेद स्त्रियं तथा । अमात्यं नृपतिर्वेद राजा राजानमेव च ॥ ॥ न शत्रुरङ्कमापन्नो मोक्तव्यो वध्यतां
    गतः । अहताद्धि भयं तस्माज्जायते नचिरादिव ॥ ॥ दैवतेषु च यत्नेन राजसु ब्राह्मणेषु च । नियन्तव्यः सदा
    क्रोधो वृद्धबालातुरेषु च ॥ ॥ निरर्थं कलहं प्राज्ञो वर्जयेन्मूढ सेवितम् । कीर्तिं च लभते लोके न चानर्थेन
    युज्यते ॥ ॥ प्रसादो निष्फलो यस्य क्रोधश्चापि निरर्थकः । न तं भर्तारमिच्छन्ति षण्ढं पतिमिव स्त्रियः
    ॥ ॥ न बुद्धिर्धनलाभाय न जाड्यमसमृद्धये । लोकपर्याय वृत्तान्तं प्राज्ञो जानाति नेतरः ॥ ॥ विद्या शीलवयोवृद्धान्बुद्धिवृद्धांश्च
    भारत । धनाभिजन वृद्धांश्च नित्यं मूढोऽवमन्यते ॥ ॥ अनार्य वृत्तमप्राज्ञमसूयकमधार्मिकम् । अनर्थाः क्षिप्रमायान्ति
    वाग्दुष्टं क्रोधनं तथा ॥ ॥ अविसंवादनं दानं समयस्याव्यतिक्रमः । आवर्तयन्ति भूतानि सम्यक्प्रणिहिता च
    वाक् ॥ ॥ अविसंवादको दक्षः कृतज्ञो मतिमानृजुः । अपि सङ्क्षीण कोशोऽपि लभते परिवारणम् ॥ ॥ धृतिः शमो दमः
    शौचं कारुण्यं वागनिष्ठुरा । मित्राणां चानभिद्रोहः सतैताः समिधः श्रियः ॥ ॥ असंविभागी दुष्टात्मा कृतघ्नो
    निरपत्रपः । तादृङ्नराधमो लोके वर्जनीयो नराधिप ॥ ॥ न स रात्रौ सुखं शेते स सर्प इव वेश्मनि । यः कोपयति
    निर्दोषं स दोषोऽभ्यन्तरं जनम् ॥ ॥ येषु दुष्टेषु दोषः स्याद्योगक्षेमस्य भारत । सदा प्रसादनं तेषां देवतानामिवाचरेत्
    ॥ ॥ येऽर्थाः स्त्रीषु समासक्ताः प्रथमोत्पतितेषु च । ये चानार्य समासक्ताः सर्वे ते संशयं गताः ॥ ॥ यत्र
    स्त्री यत्र कितवो यत्र बालोऽनुशास्ति च । मज्जन्ति तेऽवशा देशा नद्यामश्मप्लवा इव ॥ ॥ प्रयोजनेषु ये
    सक्ता न विशेषेषु भारत । तानहं पण्डितान्मन्ये विशेषा हि प्रसङ्गिनः ॥ ॥ यं प्रशंसन्ति कितवा यं प्रशंसन्ति
    चारणाः । यं प्रशंसन्ति बन्धक्यो न स जीवति मानवः ॥ ॥ हित्वा तान्परमेष्वासान्पाण्डवानमितौजसः । आहितं
    भारतैश्वर्यं त्वया दुर्योधने महत् ॥ ॥ तं द्रक्ष्यसि परिभ्रष्टं तस्मात्त्वं नचिरादिव । ऐश्वर्यमदसम्मूढं
    बलिं लोकत्रयादिव ॥ ॥ ॥ इति श्रीमहाभारते उद्योगपर्वणि प्रजागरपर्वणि विदुरवाक्ये अष्टत्रिंशोऽध्यायः
    ॥
