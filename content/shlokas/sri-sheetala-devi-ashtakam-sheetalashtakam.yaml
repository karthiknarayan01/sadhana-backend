id: sri-sheetala-devi-ashtakam-sheetalashtakam
category: stotram
name:
  english: Sri Sheetala Devi Ashtakam (Sheetalashtakam)
content:
  english: asya shrishitalastotrasya mahadeva rishih anushtup chandah shitala devata lakshmirbijam bhavani
    shaktih sarvavisphotakanivrityarthe jape viniyogah || ishvara uvaca | vande'ham shitalam devim rasabhastham
    digambaram | marjanikalashopetam shurpalankritamastakam || || vande'ham shitalam devim sarvarogabhayapaham
    | yamasadya nivarteta visphotakabhayam mahat || || shitale shitale ceti yo bruyaddahapiditah | visphotakabhayam
    ghoram kshipram tasya pranashyati || || yastvamudakamadhye tu dhyatva sampujayennarah | visphotakabhayam
    ghoram grihe tasya na jayate || || shitale jvaradagdhasya putigandhayutasya ca | pranashtacakshushah
    pumsastvamahurjivanaushadham || || shitale tanujan rogan nrinam harasi dustyajan | visphotakavidirnanam
    tvameka'mritavarshini || || galagandagraha roga ye canye daruna nrinam | tvadanudhyanamatrena shitale
    yanti sankshayam || || na mantro naushadham tasya paparogasya vidyate | tvamekam shitale dhatrim nanyam
    pashyami devatam || || mrinalatantusadrishim nabhihrinmadhyasamsthitam | yastvam sancintayeddevi tasya
    mrityurna jayate || || ashtakam shitaladevya yo narah prapathetsada | visphotakabhayam ghoram grihe
    tasya na jayate || || shrotavyam pathitavyam ca shraddhabhaktisamanvitaih | upasargavinashaya param
    svastyayanam mahat || || shitale tvam jaganmata shitale tvam jagatpita | shitale tvam jagaddhatri
    shitalayai namo namah || || rasabho gardabhashcaiva kharo vaishakhanandanah | shitalavahanashcaiva
    durvakandanikrintanah || || etani kharanamani shitalagre tu yah pathet | tasya gehe shishunam ca shitalarun
    na jayate || || shitalashtakamevedam na deyam yasyakasyacit | datavyam ca sada tasmai shraddhabhaktiyutaya
    vai || || iti shriskandapurane shitalashtakam ||
  devanagari: अस्य श्रीशीतलास्तोत्रस्य महादेव ऋषिः अनुष्टुप् छन्दः शीतला देवता लक्ष्मीर्बीजं भवानी शक्तिः
    सर्वविस्फोटकनिवृत्यर्थे जपे विनियोगः ॥ ईश्वर उवाच । वन्देऽहं शीतलां देवीं रासभस्थां दिगम्बराम् । मार्जनीकलशोपेतां
    शूर्पालङ्कृतमस्तकाम् ॥ ॥ वन्देऽहं शीतलां देवीं सर्वरोगभयापहाम् । यामासाद्य निवर्तेत विस्फोटकभयं महत्
    ॥ ॥ शीतले शीतले चेति यो ब्रूयाद्दाहपीडितः । विस्फोटकभयं घोरं क्षिप्रं तस्य प्रणश्यति ॥ ॥ यस्त्वामुदकमध्ये
    तु ध्यात्वा सम्पूजयेन्नरः । विस्फोटकभयं घोरं गृहे तस्य न जायते ॥ ॥ शीतले ज्वरदग्धस्य पूतिगन्धयुतस्य
    च । प्रणष्टचक्षुषः पुंसस्त्वामाहुर्जीवनौषधम् ॥ ॥ शीतले तनुजान् रोगान् नृणां हरसि दुस्त्यजान् । विस्फोटकविदीर्णानां
    त्वमेकाऽमृतवर्षिणी ॥ ॥ गलगण्डग्रहा रोगा ये चान्ये दारुणा नृणाम् । त्वदनुध्यानमात्रेण शीतले यान्ति
    सङ्क्षयम् ॥ ॥ न मन्त्रो नौषधं तस्य पापरोगस्य विद्यते । त्वामेकां शीतले धात्रीं नान्यां पश्यामि देवताम्
    ॥ ॥ मृणालतन्तुसदृशीं नाभिहृन्मध्यसंस्थिताम् । यस्त्वां सञ्चिन्तयेद्देवि तस्य मृत्युर्न जायते ॥ ॥ अष्टकं
    शीतलादेव्या यो नरः प्रपठेत्सदा । विस्फोटकभयं घोरं गृहे तस्य न जायते ॥ ॥ श्रोतव्यं पठितव्यं च श्रद्धाभक्तिसमन्वितैः
    । उपसर्गविनाशाय परं स्वस्त्ययनं महत् ॥ ॥ शीतले त्वं जगन्माता शीतले त्वं जगत्पिता । शीतले त्वं जगद्धात्री
    शीतलायै नमो नमः ॥ ॥ रासभो गर्दभश्चैव खरो वैशाखनन्दनः । शीतलावाहनश्चैव दूर्वाकन्दनिकृन्तनः ॥ ॥ एतानि
    खरनामानि शीतलाग्रे तु यः पठेत् । तस्य गेहे शिशूनां च शीतलारुङ् न जायते ॥ ॥ शीतलाष्टकमेवेदं न देयं
    यस्यकस्यचित् । दातव्यं च सदा तस्मै श्रद्धाभक्तियुताय वै ॥ ॥ इति श्रीस्कान्दपुराणे शीतलाष्टकम् ॥
