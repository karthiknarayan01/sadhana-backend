id: viraraghavastotram
category: stotram
name:
  english: viraraghavastotram
  devanagari: वीरराघवस्तोत्रम्
content:
  english: stvamancan paridhuya valinamasau samrajyamasedivan || 11|| matstutya vishayikrito'pyagunaya
    tvam rajase jyotisham jyotirviraraghudvaha shrutishirahsiddhantasiddhalaya | dhanyo'ham tvadhuna bhavatstutikriteh
    santapabhumna shuna lidha kim na virajate surasarit tapat sa mukto na kim || 12|| tarunatulasimalam
    malambaniyanijorasam ripujana tatikalam kalanghaniyanijajnakam | dharanitanayalolam lolamba dimbhasamacchavim
    vimalavilasacchrilam shrilam bhajemahi raghavam || 13|| nijapadanamatsomam somam mukhena parakritam
    satatavilasadbhumam bhumandanam ravupungavam | munijanadrisho'bhimam bhimam dashasyadrisham bhrisham
    vihitavinamatkamam kamam sadehamivashraye || 14|| nirupamatanushrikam shrikanjabhupramukhancitam nijadhritilasadbhukam
    bhukantakavrajasudanam | vidhutadivishadbhikam bhikandaladripusainyakam smara rucirabhasakam sakam
    shriya raghupungavam || 15|| natajanamahodaram daram vipadvitateh satam vinatadivishadvaram varam
    prashastamahamhasam | ranabhuvi mahadhiram dhiramyamartajanavanam raghupatimamum smaramsmaram vaseyamaham
    sada || 16|| nijapada bhavadganga gangatmajapramukhedita kritaduritakrudbhangabhangatmashaktirakunthita
    | dharanitanayasangasanga raghudvahadevata jayati hasitananganangantakadruhinancita || 17|| nirupadhidayasaram
    sarangamukhyavarapradam paridhutamahibharam bharamyakam khupungavam | natajanamano'duram duram kudrishtimatam
    mride prakatitamahataram taram shraye bhavavaridheh || 18|| viksharanyapatirvirajatitaram sakshacchriyah
    shrih sada dhikshantyadigunojjvalaih sumahitaih sakshatkrito yogibhih | drakshasarasadrikshanaijaphanitirdakshayanishadibhih
    svekshakankshibhirancitah pranamatam kankshadhikarthapradah || 19|| shriman viraraghudvahah shrutishirahsima
    pumanedhate kamahankritidhikkritikshamavapurbhumabhiramananah | kamasaktanrinam sudurgrahagatirvaimanikendrancitah
    shyamatma navaniradaprakaravaddhamabhibhutarunah || 20|| payad viraraghudvaho'khilaguruh kayadhavadyaih
    sada mayasamvritidurakairabhinuto mayavinamagranih | chayanathavilocano'khilasudhigeyanubhavah svayam
    heyatitagunojjvalo vinamatamayasahari harih || 21|| naracapravarapradhutadivishadvarabhiyativrajah
    saratyadbhutashaktidugdhajaladhih smerabjatulyananah | dhoratma sanakadibhirmunijanairaradhyamanah
    sa sam
  devanagari: स्त्वामञ्चन् परिधूय वालिनमसौ साम्राज्यमासेदिवान् ॥ ११॥ मत्स्तुत्या विषयीकृतोऽप्यगुणया त्वं
    राजसे ज्योतिषां ज्योतिर्वीररघूद्वह श्रुतिशिरःसिद्धान्तसिद्धालय । धन्योऽहं त्वधुना भवत्स्तुतिकृतेः
    सन्तापभूम्ना शुना लीढा किं न विराजते सुरसरित् तापात् स मुक्तो न किम् ॥ १२॥ तरुणतुलसीमालं मालम्बनीयनिजोरसं
    रिपुजन ततीकालं कालङ्घनीयनिजाज्ञकम् । धरणितनयालोलं लोलम्ब डिम्भसमच्छविं विमलविलसच्छ्रीलं श्रीलं भजेमहि
    राघवम् ॥ १३॥ निजपदनमत्सोमं सोमं मुखेन पराकृतं सततविलसद्भूमं भूमण्डनं रवुपुङ्गवम् । मुनिजनदृशोऽभीमं
    भीमं दशास्यदृशां भृशं विहितविनमत्कामं कामं सदेहमिवाश्रये ॥ १४॥ निरुपमतनुश्रीकं श्रीकञ्जभूप्रमुखाञ्चितं
    निजधृतिलसद्भूकं भूकण्टकव्रजसूदनम् । विधुतदिविषद्भीकं भीकन्दलद्रिपुसैन्यकं स्मर रुचिरभासाकं साकं श्रिया
    रघुपुङ्गवम् ॥ १५॥ नतजनमहोदारं दारं विपद्विततेः सतां विनतदिविषद्वारं वारं प्रशस्तमहांहसाम् । रणभुवि
    महाधीरं धीरम्यमार्तजनावनं रघुपतिममुं स्मारंस्मारं वसेयमहं सदा ॥ १६॥ निजपद भवद्गङ्गा गङ्गात्मजप्रमुखेडिता
    कृतदुरितक्रुद्भङ्गाभङ्गात्मशक्तिरकुण्ठिता । धरणितनयासङ्गासङ्गा रघूद्वहदेवता जयति हसितानङ्गानङ्गान्तकद्रुहिणाञ्चिता
    ॥ १७॥ निरुपधिदयासारं सारङ्गमुख्यवरप्रदं परिधुतमहीभारं भारम्यकं खुपुङ्गवम् । नतजनमनोऽदूरं दूरं कुदृष्टिमतां
    मृडे प्रकटितमहातारं तारं श्रये भववारिधेः ॥ १८॥ वीक्षारण्यपतिर्विराजतितरां साक्षाच्छ्रियः श्रीः सदा
    धीक्षान्त्यादिगुणोज्ज्वलैः सुमहितैः साक्षात्कृतो योगिभिः । द्राक्षासारसदृक्षनैजफणितिर्दाक्षायणीशादिभिः
    स्वेक्षाकाङ्क्षिभिरञ्चितः प्रणमतां काङ्क्षाधिकार्थप्रदः ॥ १९॥ श्रीमान् वीररघूद्वहः श्रुतिशिरःसीमा
    पुमानेधते कामाहङ्कृतिधिक्कृतिक्षमवपुर्भूमाभिरामाननः । कामासक्तनृणां सुदुर्ग्रहगतिर्वैमानिकेन्द्राञ्चितः
    श्यामात्मा नवनीरदप्रकरवद्धामाभिभूतारुणः ॥ २०॥ पायाद् वीररघूद्वहोऽखिलगुरुः कायाधवाद्यैः सदा मायासंवृतिदूरकैरभिनुतो
    मायाविनामग्रणीः । छायानाथविलोचनोऽखिलसुधीगेयानुभावः स्वयं हेयातीतगुणोज्ज्वलो विनमतामायासहारी हरिः ॥
    २१॥ नाराचप्रवरप्रधूतदिविषद्वाराभियातिव्रजः सारात्यद्भुतशक्तिदुग्धजलधिः स्मेराब्जतुल्याननः । धोरात्मा
    सनकादिभिर्मुनिजनैराराध्यमानः स सं
