id: sutaproktamvasudevastotram
category: stotram
name:
  english: sutaproktamvasudevastotram
  devanagari: सूतप्रोक्तंवासुदेवस्तोत्रम्
content:
  english: sutaproktam vasudevastotram bhagavanvasudevashca kirtyate'tra sanatanah | sa hi satyamritam
    caiva pavitram punyameva ca || 193|| shashvatam brahma paramam dhruvam jyotih sanatanam | yasya divyani
    karmani kathayanti manishinah || 194|| asatsatsadasaccaiva yasmaddevatpravartate | santatishca pravrittishca
    janma mrityuh punarbhavah || 195|| adhyatmam shruyate yacca pancabhutagunatmakam | avyaktadi param
    yacca sa eva parigiyate || 196|| yattadyativara yukta dhyanayogabalanvitah | pratibimbamivadarshe
    pashyantyatmanyavasthitam || 197|| shraddadhanah sadodyuktah satyadharmaparayanah | asevannimamadhyayam
    narah papatpramucyate || 198|| iti mahabharate adiparvani 1 adhyayantargatam sutaproktam vasudevastotram
    sampurnam | mahabharata | adiparva | adhyaya 1
  devanagari: सूतप्रोक्तं वासुदेवस्तोत्रम् भगवान्वासुदेवश्च कीर्त्यतेऽत्र सनातनः । स हि सत्यमृतं चैव पवित्रं
    पुण्यमेव च ॥ १९३॥ शाश्वतं ब्रह्म परमं ध्रुवं ज्योतिः सनातनम् । यस्य दिव्यानि कर्माणि कथयन्ति मनीषिणः
    ॥ १९४॥ असत्सत्सदसच्चैव यस्माद्देवात्प्रवर्तते । सन्ततिश्च प्रवृत्तिश्च जन्म मृत्युः पुनर्भवः ॥ १९५॥
    अध्यात्मं श्रूयते यच्च पञ्चभूतगुणात्मकम् । अव्यक्तादि परं यच्च स एव परिगीयते ॥ १९६॥ यत्तद्यतिवरा युक्ता
    ध्यानयोगबलान्विताः । प्रतिबिम्बमिवादर्शे पश्यन्त्यात्मन्यवस्थितम् ॥ १९७॥ श्रद्दधानः सदोद्युक्तः सत्यधर्मपरायणः
    । आसेवन्निममध्यायं नरः पापात्प्रमुच्यते ॥ १९८॥ इति महाभारते आदिपर्वणि १ अध्यायान्तर्गतं सूतप्रोक्तं
    वासुदेवस्तोत्रं सम्पूर्णम् । महाभारत । आदिपर्व । अध्याय १
