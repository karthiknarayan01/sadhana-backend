    स्स्यात् । स ए॒तेन॑ यजेत । वि॒घ॒नेनै॒वैन॑ द्वि॒हत्य॑ । वि॒शामाधि॑पत्य ङ्गच्छति ॥ तस्य॒ द्वे द्वा॑द॒शे
    स्तो॒त्रे भव॑तः । द्वे च॑तुर्वि॒ग्ं॒शे । औद्भि॑द्यमे॒व तत् । ए॒तद्वै क्ष॒त्रस्यौद्भि॑द्यम् । यद॑स्मै॒
    स्वा विशो॑ ब॒लिग्ं हर॑न्ति ॥ ॥ हर॑न्त्यस्मै॒ विशो॑ ब॒लिम् । ऐन॒मप्र॑तिख्यात वेँद॑ ॥ प्र॒बाहु॒ग्वा
    अग्रे क्ष॒त्राण्याते॑पुः । तेषा॒मिन्द्रः॑ क्ष॒त्राण्याद॑त्त । न वा इ॒मानि॑ क्ष॒त्राण्य॑ भूव॒न्निति॑
    । तन्नक्ष॑त्राणा न्नक्षत्र॒त्वम् । आ श्रेय॑सो॒ भ्रातृ॑व्यस्य॒ तेज॑ इन्द्रि॒य न्द॑त्ते । य ए॒तेन॒ यज॑ते
    । य उ॑ चैनमे॒वं द्यथा॑ ह॒ वै स॑च्या॒क्रिणौ॒ कप्ल॑कावु॒पा म् । ए॒वमे॒तौ यु॒ग्मन्तौ॒ स्तोमौ । अ॒युक्षु॒
    स्तोमे॑षु क्रियेते । पा॒प्मनो ऽप॑हत्यै ॥ अप॑ पा॒प्मान॒ म्भ्रातृ॑व्यग्ं हते । य ए॒तेन॒ यज॑ते । य उ॑
    चैनमे॒वं द्यथा॑ ह॒ वै सू॑तग्राम॒ण्यः॑ । ए॒व ञ्छन्दाग्ं॑सि । तेष्व॒सावा॑दि॒त्यो बृ॑ह॒तीर॒भ्यू॑ढः ॥
    ॥ स॒तोबृ॑हतीषु स्तुवते स॒तो बृ॑हन्न् । प्र॒जया॑ प॒शुभि॑ रसा॒नीत्ये॒व ॥ व्यति॑षक्ताभि स्स्तुवते । व्यति॑षक्तं॒
    ङ्क्ष॒त्रेण॒ व्यति॑षजति ॥ व्यति॑षक्ताभि स्स्तुवते । व्यति॑षक्तो॒ वै ग्रा॑म॒णी स्स॑जा॒तैः । स॒जा॒तैरे॒वैनं॒
    व्यँति॑षजति ॥ व्यति॑षक्ताभि स्स्तुवते । व्यति॑षक्तो॒ वै पुरु॑षः पा॒प्मभिः॑ । व्यति॑षक्ता भिरे॒वास्य॑
    पा॒प्मनो॑ नुदते ॥ ऽग्निमु॑खा॒ ह्यृद्धि॒ ऽभिप्रेहि॑ मित्र॒वर्ध॑नः प्र॒जाप॑ति॒स्ता ओ॑द॒नं प्र॒जाप॑तिरकामयत
    ब॒हो भिप्रेहि॑ वृत्र॒हन्त॑मो॒ तेभ्यो॑ नि॒धान॒ग्ं॒ षट्थ्ष॑ष्टिः ॥ हरिः॑ ओम् ॥ ॥ कृष्ण यजुर्वेदीय तैत्तिरीय
    ब्राह्मणे द्वितीयाष्टके सप्तमः प्रपाठक
