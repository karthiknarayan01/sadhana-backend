id: narayana-suktam
category: stotram
name:
  english: Narayana Suktam
  devanagari: नारायणसूक्तम्
content:
  english: taittiriyaranyakam, prapathakah - 10 anuvakah - 13 (10|13|1 10|13|2) om saha navavatu| saha
    nau bhunaktu| saha viryam karavavahai | tejasvinavadhitamastu ma vidvishavahai || om shantih shantih
    shantih || om || sahasrashirsham devam vishvaksham vishvashambhuvam | vishvam narayanam devamaksharam
    paramam padam | vishvatah paramannityam vishvam narayana harim | vishvamevedam purushastadvishvamupajivati
    | patim vishvasyatmeshvara shashvata shivamacyutam | narayanam mahajneyam vishvatmanam parayanam |
    narayanaparo jyotiratma narayanah parah | narayana param brahma tattvam narayanah parah | narayanaparo
    dhyata dhyanam narayanah parah | yacca kincijjagatsarvam drishyate shruyate'pi va || antarbahishca
    tatsarvam vyapya narayanah sthitah | anantamavyayam kavi samudre'ntam vishvashambhuvam | padmakosha
    pratikasha hridayam capyadhomukham | adho nishtya vitasyante nabhyamupari tishthati | jvalamalakulam
    bhati vishvasyayatanam mahat | santata shilabhistulambatyakoshasannibham | tasyante sushira sukshmam
    tasmin sarvam pratishthitam | tasya madhye mahanagagnirvishvarcirvishvatomukhah | so'grabhugvibhajantishthannaharamajarah
    kavih | tiryagurdhvamadhashshayi rashmayastasya santata | santapayati svam dehamapadatalamastakah
    | tasya madhye vahnishikha aniyordhva vyavasthitah | nilatoyadamadhyasthadvidyullekheva bhasvara |
    nivarashukavattanvi pita bhasvatyanupama | tasyah shikhaya madhye paramatma vyavasthitah | sa brahma
    sa shivah sa harih sendrah so'ksharah paramah svarat || rita satyam param brahma purusham krishnapingalam
    | urdhvaretam virupaksham vishvarupaya vai namo namah | om narayanaya vidmahe vasudevaya dhimahi |
    tanno vishnuh pracodayat | Encoded vith accents by ṟajagopal iyer
  devanagari: तैत्तिरीयारण्यकम्, प्रपाठकः - १० अनुवाकः - १३ (१०।१३।१ १०।१३।२) ॐ सह नाववतु। सह नौ भुनक्तु।
    सह वीर्यं करवावहै । तेजस्विनावधीतमस्तु मा विद्विषावहै ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ ॐ ॥ सहस्रशीर्षं
    देवं विश्वाक्षं विश्वशम्भुवं । विश्वं नारायणं देवमक्षरं परमं पदम् । विश्वतः परमान्नित्यं विश्वं नारायण
    हरिम् । विश्वमेवेदं पुरुषस्तद्विश्वमुपजीवति । पतिं विश्वस्यात्मेश्वर शाश्वत शिवमच्युतम् । नारायणं
    महाज्ञेयं विश्वात्मानं परायणम् । नारायणपरो ज्योतिरात्मा नारायणः परः । नारायण परं ब्रह्म तत्त्वं नारायणः
    परः । नारायणपरो ध्याता ध्यानं नारायणः परः । यच्च किञ्चिज्जगत्सर्वं दृश्यते श्रूयतेऽपि वा ॥ अन्तर्बहिश्च
    तत्सर्वं व्याप्य नारायणः स्थितः । अनन्तमव्ययं कवि समुद्रेऽन्तं विश्वशम्भुवम् । पद्मकोश प्रतीकाश हृदयं
    चाप्यधोमुखम् । अधो निष्ट्या वितस्यान्ते नाभ्यामुपरि तिष्ठति । ज्वालमालाकुलं भाति विश्वस्यायतनं महत्
    । सन्तत शिलाभिस्तुलम्बत्याकोशसन्निभम् । तस्यान्ते सुषिर सूक्ष्मं तस्मिन् सर्वं प्रतिष्ठितम् । तस्य
    मध्ये महानगग्निर्विश्वार्चिर्विश्वतोमुखः । सोऽग्रभुग्विभजन्तिष्ठन्नाहारमजरः कविः । तिर्यगूर्ध्वमधश्शायी
    रश्मयस्तस्य सन्तता । सन्तापयति स्वं देहमापादतलमस्तकः । तस्य मध्ये वह्निशिखा अणीयोर्ध्वा व्यवस्थितः
    । नीलतोयदमध्यस्थाद्विद्युल्लेखेव भास्वरा । नीवारशूकवत्तन्वी पीता भास्वत्यणूपमा । तस्याः शिखाया मध्ये
    परमात्मा व्यवस्थितः । स ब्रह्म स शिवः स हरिः सेन्द्रः सोऽक्षरः परमः स्वराट् ॥ ऋत सत्यं परं ब्रह्म
    पुरुषं कृष्णपिङ्गलम् । ऊर्ध्वरेतं विरूपाक्षं विश्वरूपाय वै नमो नमः । ॐ नारायणाय विद्महे वासुदेवाय
    धीमहि । तन्नो विष्णुः प्रचोदयात् । Eन्चोदेद् विथ् आच्चेन्त्स् ब्य् ऱजगोपल् ईयेर्
