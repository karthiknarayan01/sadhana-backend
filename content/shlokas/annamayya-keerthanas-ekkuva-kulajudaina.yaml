id: annamayya-keerthanas-ekkuva-kulajudaina
category: stotram
name:
  english: Annamayya Keerthanas Ekkuva Kulajudaina
content:
  english: adi pallavi èkkuva kulajudaina hina kulajudaina nikkamèrigina maha nityude ghanudu || vedamulu
    cadiviyunu vimukhudai haribhakti yadarincani somayaji kantè | ediyunu leni kula hinudainanu vishnu
    padamulu sevincu bhaktude ghanudu || èkkuva kulajudaina hina kulajudaina nikkamèrigina maha nityude
    ghanudu || paramamagu vedanta pathana dòrikiyu sada hari bhakti leni sanyasi kantè | saravi malina
    antya jati kulajudaina narasi vishnuni vèdaku natade ghanudu || èkkuva kulajudaina hina kulajudaina
    nikkamèrigina maha nityude ghanudu || shri vibhuni dasudu gaka tanuvu vepucu nundu tapasi kantè |
    ènaleni tiru venkateshu prasadannamu anubhavincina yatadappude ghanudu || èkkuva kulajudaina hina
    kulajudaina nikkamèrigina maha nityude ghanudu ||
  devanagari: आदि पल्लवि ऎक्कुव कुलजुडैन हीन कुलजुडैन निक्कमॆरिगिन महा नित्युडे घनुडु ॥ वेदमुलु चदिवियुनु
    विमुखुडै हरिभक्ति यादरिञ्चनि सोमयाजि कण्टॆ । एदियुनु लेनि कुल हीनुडैननु विष्णु पादमुलु सेविञ्चु भक्तुडे
    घनुडु ॥ ऎक्कुव कुलजुडैन हीन कुलजुडैन निक्कमॆरिगिन महा नित्युडे घनुडु ॥ परममगु वेदान्त पठन दॊरिकियु
    सदा हरि भक्ति लेनि सन्यासि कण्टॆ । सरवि मालिन अन्त्य जाति कुलजुडैन नरसि विष्णुनि वॆदकु नातडे घनुडु
    ॥ ऎक्कुव कुलजुडैन हीन कुलजुडैन निक्कमॆरिगिन महा नित्युडे घनुडु ॥ श्री विभुनि दासुडु गाक तनुवु वेपुचु
    नुण्डु तपसि कण्टॆ । ऎनलेनि तिरु वेङ्कटेशु प्रसादान्नमु अनुभविञ्चिन यातडप्पुडे घनुडु ॥ ऎक्कुव कुलजुडैन
    हीन कुलजुडैन निक्कमॆरिगिन महा नित्युडे घनुडु ॥
