id: kshupakritamvishnustotram
category: stotram
name:
  english: kshupakritamvishnustotram
  devanagari: क्षुपकृतंविष्णुस्तोत्रम्
content:
  english: kshupakritam vishnustotram nandyuvaca | pujaya tasya santushto bhagavanpurushottamah | shribhumisahitah
    shrimanshankhacakragadadharah || 1|| kiriti padmahastashca sarvabharanabhushitah | pitambarashca bhagavandevairdaityaishca
    samvritah || 2|| pradadau darshanam tasmai divyam vai garudadhvajah | divyena darshanenaiva drishtva
    devam janardanam || 3|| tushtava vagbhirishtabhih pranamya garudadhvajam | kshupa uvaca | tvamadistvamanadishca
    prakritistvam janardanah || 4|| purushastvam jagannatho vishnurvishveshvaro bhavan | yo'yam brahmasi
    purusho vishvamurtih pitamahah || 5|| tattvamadyam bhavaneva param jyotirjanardana | paramatma parandhama
    shripate bhupate prabho || 6|| tvatkrodhasambhavo rudrastamasa ca samavritah | tvatprasadajjagaddhata
    rajasa ca pitamahah || 7|| tvatprasadatsvayam vishnuh sattvena purushottamah | kalamurte hare vishno
    narayana jaganmaya || 8|| mahamstatha ca bhutadistanmatranindriyani ca | tvayaivadhishthitanyeva vishvamurte
    maheshvara || 9|| mahadeva jagannatha pitamaha jagadguro | prasida devadevesha prasidaparameshvara
    || 10|| prasida tvam jagannatha sharanyam sharanam gatah | vaikuntha shaure sarvajna vasudeva mahabhuja
    || 11|| sankarshana mahabhaga pradyumna purushottama | aniruddha mahavishno sada vishno namo'stu te
    || 12|| vishno tavasanam divyamavyaktam madhyato vibhuh | sahasraphanasamyuktastamomurtirdharadharah
    || 13|| adhashca dharmo devesha jnanam vairagyameva ca | aishvaryamasanasyasya padarupena suvrata
    || 14|| saptapatalapadastvam dharajaghanameva ca | vasamsi sagarah sapta dishashcaiva mahabhujah ||
    15|| dyaurmurdha te vibho nabhih kham vayurnasikam gatah | netre somashca suryashca kesha vai pushkaradayah
    || 16|| nakshatrataraka dyaushca graiveyakavibhushanam | katham stoshyami devesham pujyashca purushottamah
    || 17|| shraddhaya ca kritam divyam yacchrayam yacca kirtitam | yadishtam tatkshamasvesha narayana
    namo'stu te || 18|| shailadiruvaca | idam tu vaishnavam stotram sarvapapapranashanam | yah pathecchrinuyadvapi
    kshupena parikirtitam || 19|| shravayedva dvijan bhaktya vishnulokam sa gacchati || 20|| sampujya
    caivam tridasheshvaradyaih stutva stutam devamajeyamisham | vijnapayamasa nirikshya bhaktya janardanaya
    pranipatya murdhna || 21|| iti shrilingamahapurane purvabhage shattrimshadhyayanetargatam kshupakritam
    vishnustotram samaptam | lingapurana | purvabhaga | adhyaya 36
  devanagari: क्षुपकृतं विष्णुस्तोत्रम् नन्द्युवाच । पूजया तस्य सन्तुष्टो भगवान्पुरुषोत्तमः । श्रीभूमिसहितः
    श्रीमाञ्शङ्खचक्रगदाधरः ॥ १॥ किरीटी पद्महस्तश्च सर्वाभरणभूषितः । पीताम्बरश्च भगवान्देवैर्दैत्यैश्च
    संवृतः ॥ २॥ प्रददौ दर्शनं तस्मै दिव्यं वै गरुडध्वजः । दिव्येन दर्शनेनैव दृष्ट्वा देवं जनार्दनम् ॥
    ३॥ तुष्टाव वाग्भिरिष्टाभिः प्रणम्य गरुडध्वजम् । क्षुप उवाच । त्वमादिस्त्वमनादिश्च प्रकृतिस्त्वं जनार्दनः
    ॥ ४॥ पुरुषस्त्वं जगन्नाथो विष्णुर्विश्वेश्वरो भवान् । योऽयं ब्रह्मासि पुरुषो विश्वमूर्तिः पितामहः
    ॥ ५॥ तत्त्वमाद्यं भवानेव परं ज्योतिर्जनार्दन । परमात्मा परन्धाम श्रीपते भूपते प्रभो ॥ ६॥ त्वत्क्रोधसम्भवो
    रुद्रस्तमसा च समावृतः । त्वत्प्रसादाज्जगद्धाता रजसा च पितामहः ॥ ७॥ त्वत्प्रसादात्स्वयं विष्णुः सत्त्वेन
    पुरुषोत्तमः । कालमूर्ते हरे विष्णो नारायण जगन्मय ॥ ८॥ महांस्तथा च भूतादिस्तन्मात्राणीन्द्रियाणि च
    । त्वयैवाधिष्ठितान्येव विश्वमूर्ते महेश्वर ॥ ९॥ महादेव जगन्नाथ पितामह जगद्गुरो । प्रसीद देवदेवेश प्रसीदपरमेश्वर
    ॥ १०॥ प्रसीद त्वं जगन्नाथ शरण्यं शरणं गतः । वैकुण्ठ शौरे सर्वज्ञ वासुदेव महाभुज ॥ ११॥ सङ्कर्षण महाभाग
    प्रद्युम्न पुरुषोत्तम । अनिरुद्ध महाविष्णो सदा विष्णो नमोऽस्तु ते ॥ १२॥ विष्णो तवासनं दिव्यमव्यक्तं
    मध्यतो विभुः । सहस्रफणसंयुक्तस्तमोमूर्तिर्धराधरः ॥ १३॥ अधश्च धर्मो देवेश ज्ञानं वैराग्यमेव च । ऐश्वर्यमासनस्यास्य
    पादरूपेण सुव्रत ॥ १४॥ सप्तपातालपादस्त्वं धराजघनमेव च । वासांसि सागराः सप्त दिशश्चैव महाभुजाः ॥ १५॥
    द्यौर्मूर्धा ते विभो नाभिः खं वायुर्नासिकां गतः । नेत्रे सोमश्च सूर्यश्च केशा वै पुष्करादयः ॥ १६॥
    नक्षत्रतारका द्यौश्च ग्रैवेयकविभूषणम् । कथं स्तोष्यामि देवेशं पूज्यश्च पुरुषोत्तमः ॥ १७॥ श्रद्धया
    च कृतं दिव्यं यच्छ्रयं यच्च कीर्तितम् । यदिष्टं तत्क्षमस्वेश नारायण नमोऽस्तु ते ॥ १८॥ शैलादिरुवाच
    । इदं तु वैष्णवं स्तोत्रं सर्वपापप्रणाशनम् । यः पठेच्छृणुयाद्वापि क्षुपेण परिकीर्तितम् ॥ १९॥ श्रावयेद्वा
    द्विजान् भक्त्या विष्णुलोकं स गच्छति ॥ २०॥ सम्पूज्य चैवं त्रिदशेश्वराद्यैः स्तुत्वा स्तुतं देवमजेयमीशम्
    । विज्ञापयामास निरीक्ष्य भक्त्या जनार्दनाय प्रणिपत्य मूर्ध्ना ॥ २१॥ इति श्रीलिङ्गमहापुराणे पूर्वभागे
    षट्त्रिंशाध्यायानेतर्गतं क्षुपकृतं विष्णुस्तोत्रं समाप्तम् । लिङ्गपुराण । पूर्वभाग । अध्याय ३६
