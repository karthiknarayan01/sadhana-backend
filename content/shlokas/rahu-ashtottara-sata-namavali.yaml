id: rahu-ashtottara-sata-namavali
category: stotram
name:
  english: Rahu Ashtottara Sata Namavali
  devanagari: राहु अष्टोत्तरशतनामावलिः
content:
  english: 'rahu bija mantra - om bhra~ bhrim bhraum sah rahave namah || om rahave namah | om saimhikeyaya
    namah | om vidhuntudaya namah | om surashatrave namah | om tamase namah | om phanine namah | om gargyayanaya
    namah | om surapine namah | om nilajimutasankashaya namah | om caturbhujaya namah | 10 om khadgakhetakadharine
    namah | om varadayakahastakaya namah | om shulayudhaya namah | om meghavarnaya namah | om krishnadhvajapatakavate
    namah | om dakshinashamukharataya namah | om tikshnadamshtrakaralakaya namah | om shurpakarasanasthaya
    namah | om gomedabharanapriyaya namah | om mashapriyaya namah | 20 om kashyaparshinandanaya namah
    | om bhujageshvaraya namah | om ulkapatayitre namah | ulkapatajanaye om shuline namah | om nidhipaya
    namah | om krishnasarparaje namah | om vishajvalavritasyaya ardhashariraya namah | om jadyasampradaya
    namah | shatravapradaya om ravindubhikaraya namah | om chayasvarupine namah | 30 om kathinangakaya
    namah | om dvishaccakracchedakaya namah | om karalasyaya namah | om bhayankaraya namah | om krurakarmane
    namah | om tamorupaya namah | om shyamatmane namah | om nilalohitaya namah | om kiritine namah | om
    nilavasanaya namah | 40 om shanisamantavartmagaya namah | om candalavarnaya namah | om ashvyarkshabhavaya
    namah | om meshabhavaya namah | om shanivatphaladaya namah | om shuraya namah | om apasavyagataye
    namah | om uparagakaraya namah | om suryahimamshucchaviharakaya namah | somasuryacchavivimardakaya
    om nilapushpaviharaya namah | 50 om grahashreshthaya namah | om ashtamagrahaya namah | om kabandhamatradehaya
    namah | om yatudhanakulodbhavaya namah | om govindavarapatraya namah | om devajatipravishtakaya namah
    | om kruraya namah | om ghoraya namah | om shanermitraya namah | om shukramitraya namah | 60 om agocaraya
    namah | om mane gangasnanadatre namah | om svagrihe prabaladhyakaya namah | prabaladhyadaya om sadgrihe''nyabaladhrite
    namah | om caturthe matrinashakaya namah | om candrayukte candalajanmasucakaya namah | om janmasimhe
    namah | simhajanmane om rajyadatre namah | om mahakayaya namah | om janmakartre namah | 70 om vidhuripave
    namah | om mattako jnanadaya namah | mattagajnanadayakaya om janmakanyarajyadatre namah | om janmahanidaya
    namah | om navame pitrihantre namah | om pancame shokadayakaya namah | om dyune kalatrahantre namah
    | om saptame kalahapradaya namah | om shashthe vittadatre namah | om caturthe vairadayakaya namah
    | 80 om navame papadatre namah | om dashame shokadayakaya namah | om adau yashah pradatre namah |
    om ante vairapradayakaya namah | om kalatmane namah | om gocaracaraya namah | om dhane kakutpradaya
    namah | om pancame dhishanashringadaya namah | om svarbhanave namah | om baline namah | 90 om mahasaukhyapradayine
    namah | om candravairine namah | om shashvataya namah | om surashatrave namah | om papagrahaya namah
    | om shambhavaya namah | om pujyakaya namah | om patirapuranaya namah | om paithinasakulodbhavaya
    namah | om bhaktarakshaya namah | 100 om rahumurtaye namah | om sarvabhishtaphalapradaya namah | om
    dirghaya namah | om krishnaya namah | om atanave namah | om vishnunetraraye namah | om devaya namah
    | om danavaya namah | iti rahu ashtottarashatanamavalih sampurnam || Propitiation of rahu (shaturday)
    chhaṟitẏ: donate a coconut, old coins or coal to a leper on shaturday| vakshing mun, especially during
    major or minor rahu periods| mantṟa: to be canted on shaturday, tvo hours after sunset, especially
    during major or minor rahu periods: ṟEshuḻt: the planetary diety rahu is propitiated granting victory
    over enemies, reduction in diseases caused by rahu| transliteration and information by dr| sh| khalyanaraman
    kalyan97@yahuॅom'
  devanagari: 'राहु बीज मन्त्र - ॐ भ्राँ भ्रीं भ्रौं सः राहवे नमः ॥ ॐ राहवे नमः । ॐ सैंहिकेयाय नमः । ॐ
    विधुन्तुदाय नमः । ॐ सुरशत्रवे नमः । ॐ तमसे नमः । ॐ फणिने नमः । ॐ गार्ग्यायनाय नमः । ॐ सुरापिने नमः
    । ॐ नीलजीमूतसङ्काशाय नमः । ॐ चतुर्भुजाय नमः । १० ॐ खड्गखेटकधारिणे नमः । ॐ वरदायकहस्तकाय नमः । ॐ शूलायुधाय
    नमः । ॐ मेघवर्णाय नमः । ॐ कृष्णध्वजपताकावते नमः । ॐ दक्षिणाशामुखरताय नमः । ॐ तीक्ष्णदंष्ट्रकरालकाय
    नमः । ॐ शूर्पाकारासनस्थाय नमः । ॐ गोमेदाभरणप्रियाय नमः । ॐ माषप्रियाय नमः । २० ॐ कश्यपर्षिनन्दनाय
    नमः । ॐ भुजगेश्वराय नमः । ॐ उल्कापातयित्रे नमः । उल्कापातजनये ॐ शूलिने नमः । ॐ निधिपाय नमः । ॐ कृष्णसर्पराजे
    नमः । ॐ विषज्वालावृतास्याय अर्धशरीराय नमः । ॐ जाद्यसम्प्रदाय नमः । शात्रवप्रदाय ॐ रवीन्दुभीकराय नमः
    । ॐ छायास्वरूपिणे नमः । ३० ॐ कठिनाङ्गकाय नमः । ॐ द्विषच्चक्रच्छेदकाय नमः । ॐ करालास्याय नमः । ॐ भयङ्कराय
    नमः । ॐ क्रूरकर्मणे नमः । ॐ तमोरूपाय नमः । ॐ श्यामात्मने नमः । ॐ नीललोहिताय नमः । ॐ किरीटिणे नमः ।
    ॐ नीलवसनाय नमः । ४० ॐ शनिसमान्तवर्त्मगाय नमः । ॐ चाण्डालवर्णाय नमः । ॐ अश्व्यर्क्षभवाय नमः । ॐ मेषभवाय
    नमः । ॐ शनिवत्फलदाय नमः । ॐ शूराय नमः । ॐ अपसव्यगतये नमः । ॐ उपरागकराय नमः । ॐ सूर्यहिमांशुच्छविहारकाय
    नमः । सोमसूर्यच्छविविमर्दकाय ॐ नीलपुष्पविहाराय नमः । ५० ॐ ग्रहश्रेष्ठाय नमः । ॐ अष्टमग्रहाय नमः ।
    ॐ कबन्धमात्रदेहाय नमः । ॐ यातुधानकुलोद्भवाय नमः । ॐ गोविन्दवरपात्राय नमः । ॐ देवजातिप्रविष्टकाय नमः
    । ॐ क्रूराय नमः । ॐ घोराय नमः । ॐ शनेर्मित्राय नमः । ॐ शुक्रमित्राय नमः । ६० ॐ अगोचराय नमः । ॐ माने
    गङ्गास्नानदात्रे नमः । ॐ स्वगृहे प्रबलाढ्यकाय नमः । प्रबलाढ्यदाय ॐ सद्गृहेऽन्यबलधृते नमः । ॐ चतुर्थे
    मातृनाशकाय नमः । ॐ चन्द्रयुक्ते चण्डालजन्मसूचकाय नमः । ॐ जन्मसिंहे नमः । सिंहजन्मने ॐ राज्यदात्रे
    नमः । ॐ महाकायाय नमः । ॐ जन्मकर्त्रे नमः । ७० ॐ विधुरिपवे नमः । ॐ मत्तको ज्ञानदाय नमः । मत्तगाज्ञानदायकाय
    ॐ जन्मकन्याराज्यदात्रे नमः । ॐ जन्महानिदाय नमः । ॐ नवमे पितृहन्त्रे नमः । ॐ पञ्चमे शोकदायकाय नमः ।
    ॐ द्यूने कलत्रहन्त्रे नमः । ॐ सप्तमे कलहप्रदाय नमः । ॐ षष्ठे वित्तदात्रे नमः । ॐ चतुर्थे वैरदायकाय
    नमः । ८० ॐ नवमे पापदात्रे नमः । ॐ दशमे शोकदायकाय नमः । ॐ आदौ यशः प्रदात्रे नमः । ॐ अन्ते वैरप्रदायकाय
    नमः । ॐ कालात्मने नमः । ॐ गोचराचाराय नमः । ॐ धने ककुत्प्रदाय नमः । ॐ पञ्चमे धिशणाशृङ्गदाय नमः । ॐ
    स्वर्भानवे नमः । ॐ बलिने नमः । ९० ॐ महासौख्यप्रदायिने नमः । ॐ चन्द्रवैरिणे नमः । ॐ शाश्वताय नमः ।
    ॐ सुरशत्रवे नमः । ॐ पापग्रहाय नमः । ॐ शाम्भवाय नमः । ॐ पूज्यकाय नमः । ॐ पाटीरपूरणाय नमः । ॐ पैठीनसकुलोद्भवाय
    नमः । ॐ भक्तरक्षाय नमः । १०० ॐ राहुमूर्तये नमः । ॐ सर्वाभीष्टफलप्रदाय नमः । ॐ दीर्घाय नमः । ॐ कृष्णाय
    नमः । ॐ अतनवे नमः । ॐ विष्णुनेत्रारये नमः । ॐ देवाय नमः । ॐ दानवाय नमः । इति राहु अष्टोत्तरशतनामावलिः
    सम्पूर्णम् ॥ Pरोपितिअतिओन् ओफ़् राहु (षतुर्दय्) छ्ःआऱीट्य़्: डोनते अ चोचोनुत्, ओल्द् चोइन्स् ओर् चोअल्
    तो अ लेपेर् ओन् षतुर्दय्। वक्षिन्ग् मून्, एस्पेचिअल्ल्य् दुरिन्ग् मजोर् ओर् मिनोर् राहु पेरिओद्स्।
    ंआण्ट्ऱा: टो बे चन्तेद् ओन् षतुर्दय्, त्वो होउर्स् अफ़्तेर् सुन्सेत्, एस्पेचिअल्ल्य् दुरिन्ग् मजोर्
    ओर् मिनोर् राहु पेरिओद्स्: ऱ्Eषूळ्ट्: ठे प्लनेतर्य् दिएत्य् राहु इस् प्रोपितिअतेद् ग्रन्तिन्ग् विच्तोर्य्
    ओवेर् एनेमिएस्, रेदुच्तिओन् इन् दिसेअसेस् चौसेद् ब्य् राहु। ट्रन्स्लितेरतिओन् अन्द् इन्फ़ोर्मतिओन्
    ब्य् ड्र्। ष्। ख़ल्यनरमन् कल्यन्९७@यहूॅओम्'
