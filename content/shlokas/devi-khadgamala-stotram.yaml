id: devi-khadgamala-stotram
category: stotram
name:
  english: devi khadgamala stotram
  devanagari: देवी खड्गमाला स्तोत्रम्
content:
  english: mulamantrena shadanganyasam kuryat | dhyanam tadrisham khadgamapnoti yeva hastasthitenavai
    ashtadashamahadvipasamradbhoktabhavishyati araktabhamtrinetramarunimavasanam ratnatatankaramyam hastambhojaissapashamkushamadanadhanussayakairvisphurantim
    apinottungu vakshoruhakalashaluthattaraharojjvalangim dhyayedambhoruhasthamarunimavasanamishvarimishvaranam
    | lamityadipanca pujam kuryat
  devanagari: मूलमन्त्रेण षडङ्गन्यासं कुर्यात् । ध्यानम् तादृशं खड्गमाप्नोति येव हस्तस्थितेनवै अष्टादशमहाद्वीपसम्राड्भोक्ताभविष्यति
    आरक्ताभांत्रिणेत्रामरुणिमवसनाम् रत्नताटङ्करम्याम् हस्ताम्भोजैस्सपाशाम्कुशमदनधनुस्सायकैर्विस्फुरन्तीम्
    आपीनोत्तुङ्गु वक्षोरुहकलशलुठत्तारहारोज्ज्वलाङ्गीं ध्यायेदम्भोरुहस्थामरुणिमवसनामीश्वरीमीश्वराणाम् ।
    लमित्यादिपञ्च पूजाम् कुर्यात्
meaning: {}
