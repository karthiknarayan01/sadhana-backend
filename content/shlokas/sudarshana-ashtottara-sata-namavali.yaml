    ॐ शूराय नमः । यमोपमाय नमः । ॐ नित्य क्षेमकराय नमः । ॐ प्राज्ञाय नमः । ॐ पाषण्डजन खण्डनाय नमः । ॐ नारायणाज्ञानुवर्तिने
