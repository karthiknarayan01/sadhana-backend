id: narayaniyam-dashaka-11
category: stotram
name:
  english: Narayaniyam Dashaka 11
content:
  english: kramena sarge parivardhamane kadapi divyah sanakadayaste | bhavadvilokaya vikunthalokam prapedire
    marutamandiresha || || manojnanaishreyasakananadyai ranekavapimanimandiraishca | anopamam tam bhavato
    niketam munishvarah prapuratitakakshyah || || bhavaddiddrikshunbhavanam vivikshun dvahsthau jayastan
    vijayo'pyarundham | tesham ca citte padamapa kopah sarvam bhavatpreranayaiva bhuman || || vaikunthalokanucitapraceshtau
    kashtau yuvam daityagatim bhajetam | iti prashaptau bhavadashrayau tau harismritirno'stviti nematustan
    || || tadetadajnaya bhavanavaptah sahaiva lakshmya bahirambujaksha | khageshvaramsarpitacarubahu ranandayamstanabhiramamurtya
    || || prasadya girbhih stuvato munindra nananyanathavatha parshadau tau | samrambhayogena bhavaistribhirma
    mupetamityattakripam nyagadih || || tvadiyabhrityavatha kashyapattau surariviravuditau ditau dvau
    | sandhyasamutpadanakashtaceshtau yamau ca lokasya yamavivanyau || || hiranyapurvah kashipuh kilaikah
    paro hiranyaksha iti pratitah | ubhau bhavannathamasheshalokam rusha nyarundham nijavasanandhau ||
    || tayorhiranyakshamahasurendro ranaya dhavannanavaptavairi | bhavatpriyam kshmam salile nimajya cacara
    garvadvinadan gadavan || || tato jaleshat sadrisham bhavantam nishamya babhrama gaveshayamstvam |
    bhaktaikadrishyah sa kripanidhe tvam nirundhi rogan marudalayesha ||
  devanagari: क्रमेण सर्गे परिवर्धमाने कदापि दिव्याः सनकादयस्ते । भवद्विलोकाय विकुण्ठलोकं प्रपेदिरे मारुतमन्दिरेश
    ॥ ॥ मनोज्ञनैश्रेयसकाननाद्यै रनेकवापीमणिमन्दिरैश्च । अनोपमं तं भवतो निकेतं मुनीश्वराः प्रापुरतीतकक्ष्याः
    ॥ ॥ भवद्दिद्दृक्षून्भवनं विविक्षून् द्वाःस्थौ जयस्तान् विजयोऽप्यरुन्धाम् । तेषां च चित्ते पदमाप कोपः
    सर्वं भवत्प्रेरणयैव भूमन् ॥ ॥ वैकुण्ठलोकानुचितप्रचेष्टौ कष्टौ युवां दैत्यगतिं भजेतम् । इति प्रशप्तौ
    भवदाश्रयौ तौ हरिस्मृतिर्नोऽस्त्विति नेमतुस्तान् ॥ ॥ तदेतदाज्ञाय भवानवाप्तः सहैव लक्ष्म्या बहिरम्बुजाक्ष
    । खगेश्वरांसार्पितचारुबाहु रानन्दयंस्तानभिराममूर्त्या ॥ ॥ प्रसाद्य गीर्भिः स्तुवतो मुनीन्द्रा ननन्यनाथावथ
    पार्षदौ तौ । संरम्भयोगेन भवैस्त्रिभिर्मा मुपेतमित्यात्तकृपं न्यगादीः ॥ ॥ त्वदीयभृत्यावथ काश्यपात्तौ
    सुरारिवीरावुदितौ दितौ द्वौ । सन्ध्यासमुत्पादनकष्टचेष्टौ यमौ च लोकस्य यमाविवान्यौ ॥ ॥ हिरण्यपूर्वः
    कशिपुः किलैकः परो हिरण्याक्ष इति प्रतीतः । उभौ भवन्नाथमशेषलोकं रुषा न्यरुन्धां निजवासनान्धौ ॥ ॥ तयोर्हिरण्याक्षमहासुरेन्द्रो
    रणाय धावन्ननवाप्तवैरी । भवत्प्रियां क्ष्मां सलिले निमज्य चचार गर्वाद्विनदन् गदावान् ॥ ॥ ततो जलेशात्
    सदृशं भवन्तं निशम्य बभ्राम गवेषयंस्त्वाम् । भक्तैकदृश्यः स कृपानिधे त्वं निरुन्धि रोगान् मरुदालयेश
    ॥
