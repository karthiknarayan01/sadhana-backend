id: devaihkritam07shivastotram
category: stotram
name:
  english: devaihkritam07shivastotram
  devanagari: देवैःकृतं०७शिवस्तोत्रम्
content:
  english: devaih kritam 7 shivastotram deva ucuh | ya esha bhagavan rudro brahmavishnumaheshvarah | skandashcapi
    tatha cendro bhuvanani caturdasha | ashvinau grahatarashca nakshatrani ca kham dishah || 1|| bhutani
    ca tatha suryah somashcashtau grahastatha | pranah kalo yamo mrityuramritah parameshvarah || 2|| bhutam
    bhavyam bhavishyacca vartamanam maheshvarah | vishvam kritsnam jagatsarvam satyam tasmai namo namah
    || 3|| tvamadau ca tatha bhuto bhurbhuvah svastathaiva ca | ante tvam vishvarupo'si shirsham tu jagatah
    sada || 4|| brahmaikastvam dvitridharthamadhashca tvam sureshvarah | shantishca tvam tatha pushtistushtishcapyahutam
    hutam || 5|| vishvam caiva tatha'vishvam dattam va'dattamishvaram | kritam capyakritam devam paramapyaparam
    dhruvam | parayanam satam caiva hyasatamapi shankaram || 6|| apama somamamrita abhumaganma jyotiravidama
    devan | kim nunamasmankrinavadaratih kimu dhurtiramritam martyasya || 7|| etajjagaddhitam divyamaksharam
    sukshmamavyayam || 8|| prajapatyam pavitram ca saumyamagrahyamavyayam | agrahyenapi va grahyam vayavyena
    samiranah || 9|| saumyena saumyam grasati tejasa svena lilaya | tasmai namo'pasamhartre mahagrasaya
    shuline || 10|| hridistha devatah sarva hridi prane pratishthitah | hridi tvamasi yo nityam tisro
    matrah parastu sah || 11|| shirashcottaratashcaiva padau dakshinatastatha | yo vai cottaratah sakshatsa
    onkarah sanatanah || 12|| om karo yah sa eveha pranavo vyapya tishthati | anantastarasukshmam ca shuklam
    vaidyutameva ca || 13|| param brahma sa ishana eko rudrah sa eva ca | bhavanmaheshvarah sakshanmahadevo
    na samshayah || 14|| urdhvamunnamayatyeva sa onkarah prakirtitah | prananavati yastasmat pranavah
    parikirtitah || 15|| sarvam vyapnoti yastasmatsarvavyapi sanatanah | brahma harishca bhagavanadyantam
    nopalabdhavan || 16|| tathanye ca tato'nanto rudrah paramakaranam | yastarayati samsarattara ityabhidhiyate
    || 17|| sukshmo bhutva sharirani sarvada hyadhitishthati | tasmatsukshmah samakhyato bhagavannilalohitah
    || 18|| nilashca lohitashcaiva pradhanapurushanvayat | skandate'sya yatah shukram tatha shukramapaiti
    ca || 19|| vidyotayati yastasmadvaidyutah parigiyate | brihattvadbrimhanatvacca brihate ca parapare
    || 20|| tasmadbrimhati yasmaddhi param brahmeti kirtitam | advitiyo'tha bhagavamsturiyah parameshvarah
    || 21|| ishanamasya jagatah svardrisham cakshurishvaram | ishanamindrasurayah sarveshamapi sarvada
    || 22|| ishanah sarvavidyanam yattadishana ucyate | yadikshate ca bhagavannirikshyamiti cajnaya ||
    23|| atmajnanam mahadevo yogam gamayati svayam | bhagavamshcocyate devo devadevo maheshvarah || 24||
    sarvamllokan kramenaiva yo grihnati maheshvarah | visrijatyesha devesho vasayatyapi lilaya || 25||
    esho hi devah pradisho'nusarvah purvo hi jatah sa u garbhe antah | sa eva jatah sa janishyamanah pratyanmukhastishthati
    sarvatomukhah || 26|| upasitavyam yatnena tadetatsadbhiravyayam | yato vaco nivartante hyaprapya manasa
    saha || 27|| tadagrahanameveha yadvagvadati yatnatah | aparam ca param veti parayanamiti svayam ||
    28|| vadanti vacah sarvajnah shankaram nilalohitam | esha sarvo namastasmai purushah pingalah shivah
    || 29|| sa esha sa maharudro vishvam bhutam bhavishyati | bhuvanam bahudha jatam jayamanamitastatah
    || 30|| hiranyabahurbhagavan hiranyapatirishvarah | ambikapatirishano hemareta vrishadhvajah || 31||
    umapatirvirupaksho vishvasrigvishvavahanah | brahmanam vidadhe yo'sau putramagre sanatanam || 32||
    prahinoti sma tasyaiva jnanamatmaprakashakam | tamekam purusham rudram puruhutam purushtutam || 33||
    balagramatram hridayasya madhye vishvam devam vahnirupam varenyam | tamatmastham ye'nupashyanti dhirastesham
    shantih shashvati netaresham || 34|| mahato yo mahiyamshca hyanorapyanuravyayah | guhayam nihitashcatma
    jantorasya maheshvarah || 35|| veshmabhuto'sya vishvasya kamalastho hridi svayam | gahvaram gahanam
    tatstham tasyantashcordhvatah sthitah || 36|| tatrapi dahram gaganamonkaram parameshvaram | balagramatram
    tanmadhye ritam paramakaranam || 37|| satyam brahma mahadevam purusham krishnapingalam | urdhvaratesamishanam
    virupakshamajodbhavam || 38|| adhitishthati yonim yo yonim vacaika ishvarah | deham pancavidham yena
    tamishanam puratanam || 39|| iti shrilingamahapurane uttarabhage ashtadashadhyayantargatam devaih
    kritam shivastotram samaptam | lingapurana | uttarabhaga | adhyaya 18
  devanagari: देवैः कृतं ७ शिवस्तोत्रम् देवा ऊचुः । य एष भगवान् रुद्रो ब्रह्मविष्णुमहेश्वराः । स्कन्दश्चापि
    तथा चेन्द्रो भुवनानि चतुर्दश । अश्विनौ ग्रहताराश्च नक्षत्राणि च खं दिशः ॥ १॥ भूतानि च तथा सूर्यः सोमश्चाष्टौ
    ग्रहास्तथा । प्राणः कालो यमो मृत्युरमृतः परमेश्वरः ॥ २॥ भूतं भव्यं भविष्यच्च वर्तमानं महेश्वरः । विश्वं
    कृत्स्नं जगत्सर्वं सत्यं तस्मै नमो नमः ॥ ३॥ त्वमादौ च तथा भूतो भूर्भुवः स्वस्तथैव च । अन्ते त्वं विश्वरूपोऽसि
    शीर्षं तु जगतः सदा ॥ ४॥ ब्रह्मैकस्त्वं द्वित्रिधार्थमधश्च त्वं सुरेश्वरः । शान्तिश्च त्वं तथा पुष्टिस्तुष्टिश्चाप्यहुतं
    हुतम् ॥ ५॥ विश्वं चैव तथाऽविश्वं दत्तं वाऽदत्तमीश्वरम् । कृतं चाप्यकृतं देवं परमप्यपरं ध्रुवम् । परायणं
    सतां चैव ह्यसतामपि शङ्करम् ॥ ६॥ अपाम सोमममृता अभूमागन्म ज्योतिरविदाम देवान् । किं नूनमस्मान्कृणवदरातिः
    किमु धूर्तिरमृतं मर्त्यस्य ॥ ७॥ एतज्जगद्धितं दिव्यमक्षरं सूक्ष्ममव्ययम् ॥ ८॥ प्राजापत्यं पवित्रं च
    सौम्यमग्राह्यमव्ययम् । अग्राह्येणापि वा ग्राह्यं वायव्येन समीरणः ॥ ९॥ सौम्येन सौम्यं ग्रसति तेजसा
    स्वेन लीलया । तस्मै नमोऽपसंहर्त्रे महाग्रासाय शूलिने ॥ १०॥ हृदिस्था देवताः सर्वा हृदि प्राणे प्रतिष्ठिताः
    । हृदि त्वमसि यो नित्यं तिस्रो मात्राः परस्तु सः ॥ ११॥ शिरश्चोत्तरतश्चैव पादौ दक्षिणतस्तथा । यो वै
    चोत्तरतः साक्षात्स ओङ्कारः सनातनः ॥ १२॥ ॐ कारो यः स एवेह प्रणवो व्याप्य तिष्ठति । अनन्तस्तारसूक्ष्मं
    च शुक्लं वैद्युतमेव च ॥ १३॥ परं ब्रह्मा स ईशान एको रुद्रः स एव च । भवान्महेश्वरः साक्षान्महादेवो न
    संशयः ॥ १४॥ ऊर्ध्वमुन्नामयत्येव स ओङ्कारः प्रकीर्तितः । प्राणानवति यस्तस्मात् प्रणवः परिकीर्तितः ॥
    १५॥ सर्वं व्याप्नोति यस्तस्मात्सर्वव्यापी सनातनः । ब्रह्मा हरिश्च भगवानाद्यन्तं नोपलब्धवान् ॥ १६॥
    तथान्ये च ततोऽनन्तो रुद्रः परमकारणम् । यस्तारयति संसारात्तार इत्यभिधीयते ॥ १७॥ सूक्ष्मो भूत्वा शरीराणि
    सर्वदा ह्यधितिष्ठति । तस्मात्सूक्ष्मः समाख्यातो भगवन्नीललोहितः ॥ १८॥ नीलश्च लोहितश्चैव प्रधानपुरुषान्वयात्
    । स्कन्दतेऽस्य यतः शुक्रं तथा शुक्रमपैति च ॥ १९॥ विद्योतयति यस्तस्माद्वैद्युतः परिगीयते । बृहत्त्वाद्बृंहणत्वाच्च
    बृहते च परापरे ॥ २०॥ तस्माद्बृंहति यस्माद्धि परं ब्रह्मेति कीर्तितम् । अद्वितीयोऽथ भगवांस्तुरीयः परमेश्वरः
    ॥ २१॥ ईशानमस्य जगतः स्वर्दृशां चक्षुरीश्वरम् । ईशानमिन्द्रसूरयः सर्वेषामपि सर्वदा ॥ २२॥ ईशानः सर्वविद्यानां
    यत्तदीशान उच्यते । यदीक्षते च भगवान्निरीक्ष्यमिति चाज्ञया ॥ २३॥ आत्मज्ञानं महादेवो योगं गमयति स्वयम्
    । भगवांश्चोच्यते देवो देवदेवो महेश्वरः ॥ २४॥ सर्वांल्लोकान् क्रमेणैव यो गृह्णति महेश्वरः । विसृजत्येष
    देवेशो वासयत्यपि लीलया ॥ २५॥ एषो हि देवः प्रदिशोऽनुसर्वाः पूर्वो हि जातः स उ गर्भे अन्तः । स एव जातः
    स जनिष्यमाणः प्रत्यङ्मुखास्तिष्ठति सर्वतोमुखः ॥ २६॥ उपासितव्यं यत्नेन तदेतत्सद्भिरव्ययम् । यतो वाचो
    निवर्तन्ते ह्यप्राप्य मनसा सह ॥ २७॥ तदग्रहणमेवेह यद्वाग्वदति यत्नतः । अपरं च परं वेति परायणमिति स्वयम्
    ॥ २८॥ वदन्ति वाचः सर्वज्ञः शङ्करं नीललोहितम् । एष सर्वो नमस्तस्मै पुरुषः पिङ्गलः शिवः ॥ २९॥ स एष स
    महारुद्रो विश्वं भूतं भविष्यति । भुवनं बहुधा जातं जायमानमितस्ततः ॥ ३०॥ हिरण्यबाहुर्भगवान् हिरण्यपतिरीश्वरः
    । अम्बिकापतिरीशानो हेमरेता वृषध्वजः ॥ ३१॥ उमापतिर्विरूपाक्षो विश्वसृग्विश्ववाहनः । ब्रह्माणं विदधे
    योऽसौ पुत्रमग्रे सनातनम् ॥ ३२॥ प्रहिणोति स्म तस्यैव ज्ञानमात्मप्रकाशकम् । तमेकं पुरुषं रुद्रं पुरुहूतं
    पुरुष्टुतम् ॥ ३३॥ बालाग्रमात्रं हृदयस्य मध्ये विश्वं देवं वह्निरूपं वरेण्यम् । तमात्मस्थं येऽनुपश्यन्ति
    धीरास्तेषां शान्तिः शाश्वती नेतरेषाम् ॥ ३४॥ महतो यो महीयांश्च ह्यणोरप्यणुरव्ययः । गुहायां निहितश्चात्मा
    जन्तोरस्य महेश्वरः ॥ ३५॥ वेश्मभूतोऽस्य विश्वस्य कमलस्थो हृदि स्वयम् । गह्वरं गहनं तत्स्थं तस्यान्तश्चोर्ध्वतः
    स्थितः ॥ ३६॥ तत्रापि दह्रं गगनमोङ्कारं परमेश्वरम् । बालाग्रमात्रं तन्मध्ये ऋतं परमकारणम् ॥ ३७॥ सत्यं
    ब्रह्म महादेवं पुरुषं कृष्णपिङ्गलम् । ऊर्ध्वरतेसमीशानं विरूपाक्षमजोद्भवम् ॥ ३८॥ अधितिष्ठति योनिं यो
    योनिं वाचैक ईश्वरः । देहं पञ्चविधं येन तमीशानं पुरातनम् ॥ ३९॥ इति श्रीलिङ्गमहापुराणे उत्तरभागे अष्टादशाध्यायान्तर्गतं
    देवैः कृतं शिवस्तोत्रं समाप्तम् । लिङ्गपुराण । उत्तरभाग । अध्याय १८
