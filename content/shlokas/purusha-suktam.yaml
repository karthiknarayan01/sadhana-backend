id: purusha-suktam
category: stotram
name:
  english: Purusha Suktam
content:
  english: yo~ravrinimahe | gatum svastirastu nah | svastirmanushebhyah | urdhva njigatu bheshajam | sha
    nno astu dvipade ncatushpade | om shanti shshantih || sahasrashir sha purushah | sahasraksha ssahasrapat
    | sa bhumim vi~shvato vritva | atyatishthaddashangulam || purusha evedagm sarvam | utamritatva syeshanah
    | yadannenatirohati || etavanasya mahima | ato jyayagshca purushah | pado 'sya vishva bhutani | tripadasyamrita
    ndivi || tripadurdhva udaitpurushah | pado ''bhavatpunah | tato vishvan vyakramat | sashananashane
    abhi || tasma dviradajayata | virajo adhi purushah | sa jato atyaricyata | pashcadbhumimatho purah
    || yatpurushena havisha | deva yajnamatanvata | vasanto asyasidajyam | grishma idhmashsharadhdhavih
    || saptasyasanparidhayah | tri ssapta samidhah kritah | deva yadyajna ntanvanah | abadhnan mbarhishi
    praukshan | purusha njatamagratah | tena deva ayajanta | sadhya rishayashca ye || tasma dyajnathsarvahutah
    | sambhrita mprishadajyam | pashug shcakre vayavyan | aranyan gramyashca ye || tasma dyajnathsarvahutah
    | rica ssamani jajnire | chandagmsi jajnire tasma t | yajustasmadajayata || tasmadashva ajayanta |
    ye ke cobhayadatah | gavo ha jajnire tasma jjata ajavayah || yatpurusham vya~dadhuh | katitha vyakalpayann
    | mukha nkimasya kau bahu | kavuru padavucyete || brahmano 'sya mukhamasit | bahu rajanyah kritah
    | uru tadasya yadvaishyah | padbhyagm shudro ajayata || candrama manaso jatah | caksho ssuryo ajayata
    | mukhadindrashcagnishca | pranadvayurajayata || nabhya asidantariksham | shir ssamavartata | padbhya
    t | tatha lokagm akalpayann || vedahameta ntamasastu pare | sarvani rupani vicitya dhirah | namani
    kritva || dhata purastadyamudajahara | shakrah pravidva npradishashcatasrah | tamevam vi~dvanamrita
    iha bhavati | nanyah pantha ayanaya vidyate || yajnena yajnamayajanta devah | tani dharmani prathamanyasann
    | te ha naka mmahimanah sacante | yatra purve sadhya ssanti devah || adbhya ssambhutah prithivyai
    rasa ssamavartatadhi | tasya tvashta vidadhadrupameti | tatpurushasya vishvamajanamagre ntamasah parastat
    | tamevam vi~dvanamrita iha bhavati | nanyah pantha vidyate 'yanaya || prajapatishcarati garbhe antah
    | ajayamano bahudha vijayate | tasya dhirah parijananti yonim mpadamicchanti vedhasah || yo devebhya
    atapati | yo devana mpurohitah | purvo yo devebhyo jatah | namo rucaya brahmaye || ruca njanayantah
    | deva agre tadabruvann | yastvaiva hmano vidyat | tasya deva asan vashe || hrishca te lakshmishca
    patnyau | ahoratre par shve | nakshatrani rupam | ashvinau vyattam yo~ravrinimahe | gatum svastirastu
    nah | svastirmanushebhyah | urdhva njigatu bheshajam | sha nno astu dvipade ncatushpade | om shanti
  devanagari: योँरावृ॑णीमहे । गा॒तुं स्व॒स्तिर॑स्तु नः । स्व॒स्तिर्मानु॑षेभ्यः । ऊ॒र्ध्व ञ्जि॑गातु भेष॒जम्
    । श न्नो॑ अस्तु द्वि॒पदे ञ्चतु॑ष्पदे । ॐ शान्ति॒ श्शान्तिः॑ ॥ स॒हस्र॑शीर् षा॒ पुरु॑षः । स॒ह॒स्रा॒क्ष
    स्स॒हस्र॑पात् । स भूमिं॑ विँ॒श्वतो॑ वृ॒त्वा । अत्य॑तिष्ठद्दशाङ्गु॒लम् ॥ पुरु॑ष ए॒वेदग्ं सर्वम् । उ॒तामृ॑त॒त्व
    स्येशा॑नः । यदन्ने॑नाति॒रोह॑ति ॥ ए॒तावा॑नस्य महि॒मा । अतो॒ ज्यायाग्॑श्च॒ पूरु॑षः । पादो ऽस्य॒ विश्वा॑
    भू॒तानि॑ । त्रि॒पाद॑स्या॒मृत॑ न्दि॒वि ॥ त्रि॒पादू॒र्ध्व उदै॒त्पुरु॑षः । पादो ऽऽभ॑वा॒त्पुनः॑ । ततो॒
    विष्व॒ङ् व्य॑क्रामत् । सा॒श॒ना॒न॒श॒ने अ॒भि ॥ तस्मा द्वि॒राड॑जायत । वि॒राजो॒ अधि॒ पूरु॑षः । स जा॒तो
    अत्य॑रिच्यत । प॒श्चाद्भूमि॒मथो॑ पु॒रः ॥ यत्पुरु॑षेण ह॒विषा । दे॒वा य॒ज्ञमत॑न्वत । व॒स॒न्तो अ॑स्यासी॒दाज्यम्
    । ग्री॒ष्म इ॒ध्मश्श॒रध्ध॒विः ॥ स॒प्तास्या॑सन्परि॒धयः॑ । त्रि स्स॒प्त स॒मिधः॑ कृ॒ताः । दे॒वा यद्य॒ज्ञ
    न्त॑न्वा॒नाः । अब॑ध्न॒न् म्ब॒र्॒हिषि॒ प्रौक्षन्॑ । पुरु॑ष ञ्जा॒तम॑ग्र॒तः । तेन॑ दे॒वा अय॑जन्त । सा॒ध्या
    ऋष॑यश्च॒ ये ॥ तस्मा द्य॒ज्ञाथ्स॑र्व॒हुतः॑ । सम्भृ॑त म्पृषदा॒ज्यम् । प॒शूग् श्च॑क्रे वाय॒व्यान्॑ ।
    आ॒र॒ण्यान् ग्रा॒म्याश्च॒ ये ॥ तस्मा द्य॒ज्ञाथ्स॑र्व॒हुतः॑ । ऋच॒ स्सामा॑नि जज्ञिरे । छन्दाग्ं॑सि जज्ञिरे॒
    तस्मा त् । यजु॒स्तस्मा॑दजायत ॥ तस्मा॒दश्वा॑ अजायन्त । ये के चो॑भ॒याद॑तः । गावो॑ ह जज्ञिरे॒ तस्मा ज्जा॒ता
    अ॑जा॒वयः॑ ॥ यत्पुरु॑षं॒ व्यँ॑दधुः । क॒ति॒था व्य॑कल्पयन्न् । मुख॒ ङ्किम॑स्य॒ कौ बा॒हू । कावू॒रू पादा॑वुच्येते
    ॥ ब्रा॒ह्म॒णो ऽस्य॒ मुख॑मासीत् । बा॒हू रा॑ज॒न्यः॑ कृ॒तः । ऊ॒रू तद॑स्य॒ यद्वैश्यः॑ । प॒द्भ्याग्ं शू॒द्रो
    अ॑जायत ॥ च॒न्द्रमा॒ मन॑सो जा॒तः । चक्षो॒ स्सूर्यो॑ अजायत । मुखा॒दिन्द्र॑श्चा॒ग्निश्च॑ । प्रा॒णाद्वा॒युर॑जायत
    ॥ नाभ्या॑ आसीद॒न्तरि॑क्षम् । शी॒र् स्सम॑वर्तत । प॒द्भ्या त् । तथा॑ लो॒काग्ं अ॑कल्पयन्न् ॥ वेदा॒हमे॒त
    न्तम॑स॒स्तु पा॒रे । सर्वा॑णि रू॒पाणि॑ वि॒चित्य॒ धीरः॑ । नामा॑नि कृ॒त्वा ॥ धा॒ता पु॒रस्ता॒द्यमु॑दाज॒हार॑
    । श॒क्रः प्रवि॒द्वा न्प्र॒दिश॒श्चत॑स्रः । तमे॒वं विँ॒द्वान॒मृत॑ इ॒ह भ॑वति । नान्यः पन्था॒ अय॑नाय विद्यते
    ॥ य॒ज्ञेन॑ य॒ज्ञम॑यजन्त दे॒वाः । तानि॒ धर्मा॑णि प्रथ॒मान्या॑सन्न् । ते ह॒ नाक॑ म्महि॒मानः॑ सचन्ते
    । यत्र॒ पूर्वे॑ सा॒ध्या स्सन्ति॑ दे॒वाः ॥ अ॒द्भ्य स्सम्भू॑तः पृथि॒व्यै रसा स्सम॑वर्त॒ताधि॑ । तस्य॒
    त्वष्टा॑ वि॒दध॑द्रू॒पमे॑ति । तत्पुरु॑षस्य॒ विश्व॒माजा॑न॒मग्रे न्तम॑सः॒ पर॑स्तात् । तमे॒वं विँ॒द्वान॒मृत॑
    इ॒ह भ॑वति । नान्यः पन्था॑ विद्य॒ते ऽय॑नाय ॥ प्र॒जाप॑तिश्चरति॒ गर्भे॑ अ॒न्तः । अ॒जाय॑मानो बहु॒धा विजा॑यते
    । तस्य॒ धीराः॒ परि॑जानन्ति॒ योनिम् म्प॒दमि॑च्छन्ति वे॒धसः॑ ॥ यो दे॒वेभ्य॒ आत॑पति । यो दे॒वाना म्पु॒रोहि॑तः
    । पूर्वो॒ यो दे॒वेभ्यो॑ जा॒तः । नमो॑ रु॒चाय॒ ब्राह्म॑ये ॥ रुच॑ ञ्ज॒नय॑न्तः । दे॒वा अग्रे॒ तद॑ब्रुवन्न्
    । यस्त्वै॒व ह्म॒णो वि॒द्यात् । तस्य॑ दे॒वा अस॒न् वशे ॥ ह्रीश्च॑ ते ल॒क्ष्मीश्च॒ पत्न्यौ । अ॒हो॒रा॒त्रे
    पा॒र् श्वे । नक्ष॑त्राणि रू॒पम् । अ॒श्विनौ॒ व्यात्तम् योँरावृ॑णीमहे । गा॒तुं स्व॒स्तिर॑स्तु नः । स्व॒स्तिर्मानु॑षेभ्यः
    । ऊ॒र्ध्व ञ्जि॑गातु भेष॒जम् । श न्नो॑ अस्तु द्वि॒पदे ञ्चतु॑ष्पदे । ॐ शान्ति॒
