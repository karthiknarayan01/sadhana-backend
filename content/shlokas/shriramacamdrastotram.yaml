id: shriramacamdrastotram
category: stotram
name:
  english: shriramacamdrastotram
  devanagari: श्रीरामचंद्रस्तोत्रम्
content:
  english: paharin||3|| mamaparadhanakhilankshamasva tejomaya shrisha vibho dayasva|| janmadihetoh kritabhurimamtor
    dattabhaya tvam parama gatirme||4|| yamadiyogam na ca yagamapa tta paghna jane vihitarthabhogam||
    jagannivaseshvara mamavadya tre dhadyatapan hara me bhavadya||5|| yashahprapurnam shravanam kurushva
    ya yadgatim yena khalo
  devanagari: पहारिन्।।३।। ममापराधानखिलान्क्षमस्व तेजोमय श्रीश विभो दयस्व।। जन्मादिहेतोः कृतभूरिमंतोर्
    दत्ताभय त्वं परमा गतिर्मे।।४।। यमादियोगं न च यागमाप त्ता पघ्न जाने विहितार्थभोगम्।। जगन्निवासेश्वर
    मामवाद्य त्रे धाद्यतापान् हर मे भवाद्य।।५।। यशःप्रपूर्णं श्रवणं कुरुष्व या याद्गतिं येन खलो
meaning: {}
