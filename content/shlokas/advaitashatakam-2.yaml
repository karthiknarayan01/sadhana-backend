id: advaitashatakam-2
category: shataka
name:
  english: advaitashatakam
  devanagari: अद्वैतशतकम्
content:
  english: sushuptau dehashca karanakyah prakirtitah || 8|| drishyarupamidam sarvam deha ityabhidhiyate
    | tatravyaptam param jyotirdehoti parigiyate || 9|| ayam samanya dehasyatmanushyanam vivekinam | savastha
    hi turoyarakhya bhuvaneshu sudurlabha || 10|| yada samanyadehe'smin sthitih pumsabhijayate | tada
    yogishvaro vedaih paramatmeti giyate || 11|| yada sthuladideheshu manushyanam sthitirbhavet | jivatmeti
    tada proktah sankocagrahanadbudhaih || 12|| ayam jivo hi samsare sada'sare paribhraman | lokallokantaram
    gatva garbhapatram vishatyasau || 13|| gatva garbhagrihadbhuyo manusham lokamavishan | putro'yam mama
    bharye'yamasmadiyamidam dhanam || 14|| idam gotramidam mitramasmadiyamidam griham | iyam mata mama
    pita jana ete mamarayah || 15|| iti nishcitya jivatma ragadesham dine dine | etan prati karotyeva
    svajnanadeva kevalam || 16|| ekarupasya devasya sarveshamantaratmanah | vyomavadvyaptadehasya bodharupasya
    sarvada || 17|| kutraciddrishyarupasya mayadinam parigrahat | sarvasyadhararupasya meghadhinam yatha
    nabhah || 18|| saccidanandarupasya brahmarudradikalpanat | vibhagam kurute jivah sva'jnanadeva kevalam
    || 19|| vyaptarupasya devasya sankocam duhkhameva hi | tadeva jivah kurute sva'jnanadeva kevalam ||
    20|| atha satyavihinanam kaminam kamacarinam | svadharmavimukhanam ca samsargam kurute sada || 21||
    punarvashyavasho sthitva taissardham shvakharagavat | sarvadharmavinirmukto deho ta eva sevate ||
    22|| alape harinakshinam darshanasparshanadishu | hasabhavavilaseshu manah samyan nimajjati || 23||
    vishayagrahanajjantoh pradvesha upajayate | mataram pitaram putram vriddhancanyajanan prati || 24||
    alabdhavishayo jantuh cintaya paritapyate | shokamohabhayakleshakrodhalobhadhiyuktaya || 25|| labdhe
    tu paramapriti saubhagyashatasamyutam | abhiprayashatam dhyatva vishayeshu vishajyate || 26|| alabdhavishaye
    labdhe jantuh shreyo na labhyate | evam vishayagarteshu parimajjati manavah || 27|| sampadya mitram
    jivatma tesham duhkham dine dine | mameti manyate nityam janmantarakritashrubhat || 28|| prarabdhakarmanam
    bhuktim kurvan dehi dine dine | paurushena prayatnena karmani kurute sada || 29|| samsare vartamananam
    pumsam tenaiva hetuna | shrubhashrubhani karmani dvividhaniti sanmatam || 30|| shrubhashrubhani karmani
    paurushani na cedyadi | vedanam vidhivakyanam vyarthatvam bhavati dhruvam || 31|| na himsyatsarvabhutani
    na kuryadahitam satam | evamadini vakyani vyarthanyeva vicarane || 32|| anyatha vidhivakyani pravartante
    tu kam prati | jivam prati pravrittishcetso'pi karmavashanugah || 33|| karmanusari jivashca karmanyevanuvartate
    | tasmaddhi karmani kshine tasya mrityurbhaveddhruvam || 34|| ye mudha dvividham karma nangikurvanti
    mohatah | tesham hi maranam moksho lokayatikavaddhruvam || 35|| sthuladeham grihitvaivamanubhuya shubhashubham
    | paurusham sukshmadehena bhoktumarabhate punah || 36|| sthuladehatsukshmadehavyavrittim maranam smritam
    | jivanam mritikale'smin sukshmadehah prakirtitah || 37|| prarabdhakarmanam nashat upabhogena cetanah
    | sthuladehatsukshmadehavyavrittim kurute'vashah || 38|| yatha svapne sthuladehatsukshmadehasthitirbhavet
    | mritikale tatha pusam sukshmadehasthitirbhavet || 39|| yatkarma kurute svapne sukshmadehena cetanah
    | sthuladehena jivatma tadeva kurute tada || 40|| sthuladeham vihayaivam grihitva sukshmavigraham
    | svargam va narakam va'pi jivatma parigacchati || 41|| jivatma punyabahulyatsvargalokam yathakramam
    | vikasayati bhogartham svarupe svena catesa || 42|| vishuddham jnanamevaikam yatha svapne tridha
    bhavet | grahakagrahanadhyaishca svargaloke tatha bhavet || 43|| yadyatsvapnaprapancasya copadanam
    svayam bhavet | svargasya narakasyaiva upadanam svayam bhavet || 44|| jivatma lingadehena svargam
    narakameva va | gatva manomayam pashcadanubhuya shubhashubham || 45|| pravishya karanam deham paripurnam
    manomayam | mahatsukhamavapnoti parityajya parishramam || 46|| vihaya karanam deham svatmajnanamayadbhutam
    | shuklarteve susamshuddhe garbhapatre prabuddhavan || 47|| punargarbhagrihadbuddhva shuddhashuklartavam
    tada | upadhitvena sangrihya dehameva kilecchati || 48|| garbhapatre sthitam kurvan bahvabhadravahah
    puman | murcchavastham grihitvadau janmantarasubhashubhat || 49|| pravahato'nadimayam dehameva punah
    punah | dhyatva dhyatva kalavashat deha eva prajayate || 50|| upadhitvena sangrihya sthitashshuklartavam
    yada | deham vina sthiyasyasya katham dhyanam bhavettada || 51|| bodhamatraikarupasya devasyanandarupinah
    | svasvarupe'paricchedya maya syatparameshvari || 52|| jnaptirupasya devasya jnaptirupo'hameva hi
    | iti jnanavihinasya bodho mayeti kathyate || 53|| evam vicarane maya daiviti parikalpita | taya sankocamattasya
    bandho'nadirihocyate || 54|| anadhyantavati maya sthita mayavicarane | caracaramidam vishvam tatkaryatvattatha
    bhavet || 55|| ata eva hi devasya saccidanandarupinah | saptayonishvahambhavastatra tatra dridham
    bhavet || 56|| lokeshu vartamananam pumsam tena ca hetuna | deham vinapyahankaro vartate vasanavashat
    || 57|| vrikshabije yatha vriksho sthitashshakhadisamyutah | tathahami sthito deho hastapadadisamyutah
    || 58|| tasmadgarbhasthitim kurvan jibo'vidyadisamyutah | ahankaravashadeva deha eva prajayate ||
    59|| dehi sampurnadeho'sau janmantarashubhashubhat | punargarbhagrihadgatva murcchamapa suvismitam
    || 60|| evam dehatraye kurvan sthitim dehi paribhraman | jivatmetucyate sadbhih sarvavedantaparagaih
    || 61|| evam samsaratah pumsah svenarjitashubhashubhat | deshikalokanadeva vairagyam jayate hridi
    || 62|| evam vairagyayuktasya pumso hridi nirantaram | avirbabhuva shuddhatma vicarassoyamidrishah
    || 63|| dhanena duhkharopena durlabhenatmamrityuna | pumsam ka pritirevasyatpaparupena sarvada ||
    64|| kim me gehena kim bhogaih kim dhanairdhanadairapi | kim mitrabandhavaih karyam sarva kalavashadasat
    || 65|| kim striya paparupinya kim putrairbhandahetukaih | mrityuna grihyamanasya taih kim karyam
    kshane kshane || 66|| atita bahavah putrah dara janmani janmani | prarabdhakarmabhoktrinam pumsam
    kimiha taih phalam || 67|| bhaveshvaratiyuktasya pumsassatyarthabhashinah | ko'ham kathamidanceti
    cinta syatsuvhisharada || 68|| sa cinta deshikam vipram vedashastragamanvitam | brahmajnanavatam pumsam
    varam ghatayati kshanat || 69|| shaktipatapavitro'yam jivatma guruvigraham | drishtva paravasho bhutva
    natincakai punah punah || 70|| natva devam mahatmanam deshikam karunamayam | svasvarupam parijnatum
    pranjalistamabhashata || 71|| svarupam paramanandam jnatubhicchami deshika | samsarabdhititirshunam
    karnadharo'si dehinam || 72|| iti prishto viraktena shishyena paramarthavit | svasvarupam pam dhyayan
    deshikastamabhashata || 73|| yamashritya pravartante janassarve nirantaram | svarupamiti tam vidyatkaranaishcakshuradibhih
    || 74|| jagratkale yamashritya sthuladehah prabartate | sukshmadehastatha svapne svarupam tam vidurbudhah
    || 75|| sushuptau tu yamashritya bhasate karanam vapuh | svajnanamayamavyaktam svarupamavadharaya
    || 76|| yo jagradadibhedena mithyarupena bhasate | tesham drashtrisvarupena sa eva parameshvarah ||
    77|| sa eva tvam shivo vishnuragnirindracaturmukhah | sa eva suryassomashca sah shasta sa vinayakah
    || 78|| vani shrigirija durga devi cetyadinamabhih | vibhidya procyate prajnairmatibhedena nanyatha
    || 79|| ekarupam samashritya sankalpanca vikalpakam | yada karotyasau dehi mana ityucyate tada ||
    80|| samshayam parityajyam ca rupam pratyavadharitah | yasmin kale pratyagatma buddhirityucyate tada
    || 81|| yada'sau svaparamarshadidamitthamiti sphutam | rupam prati vijanati tadahankaravan bhavet
    || 82|| yada hastah kara iti bahoh paryaya eva hi | manobuddhirahankarashcittam ceti tathatmanah ||
    83|| yathavahnorvartibhedat ikshoh pakavisheshatah | namarupatmako bhedah sa tatha jivasya nanyatha
    || 84|| yatha kshire ghritam vyapta tathya drishye parah puman | upadhibhedatbhedassyat tasmadekasya
    nanyatha || 85|| ekarupo mahadevah sarvabhuteshvavasthitah | ekarupo mahakasho ghatadishu yatha sthitah
    || 86|| prithak prithak sthitananca dehanamavivadatah | panipadadiyuktanam bhedo nasti vicarane ||
    87|| caracaramidam vishvam pancabhutatmakam smritam | dehanam pancabhutanam bhedo nasti tathasthite
    || 87|| mrinmayatvadghatadinam yatha bhedo na vidyate | pancabhutatmakatvena dehananca tathaiva ca
    || 89|| evam vicarane tata nasti bhedah kadacana | dehanam pancabhutanam jadanamashunashinam || 90||
    navapradeshamatro'yam hastapadadimanaham | iti nishcayavan loke jiva ityabhidhiyate || 91|| sarvatra
    paripurno'hamayam deho sameti ca | iti nishcayavanantah paramatmeti kathyate || 92|| evam sthite na
    bhedassyatjivatmaparamatmanoh | tayorabheda eva syatcitsvarupavisheshatah || 13|| dehasakshi prana
    eva iti cettanna sangatam | sushuptau sarvadehanam jadatvadeva nanyatha || 14|| svavyaparakrite prano
    dehoparatidarshanat | dehasya karta na prana ityevamavadharaya || 95|| yaccintyate bhupatina tatkurvantyanujivinah
    | tasmatprano na karta syaditi lokeshu darshanat || 96|| dehatrayasamudbhutam vasanam samparityajan
    | parigrihya param deham paripurnam paro bhava || 97|| paripurnamayam rupam parigrihya shubhashubham
    | nityanaimittikam karma sada kurvanna lityate || 98|| kritani vanmanah kayairloke karmani jantubhih
    | toshamanyatamatvena katham karta bhavishyati || 99|| sarvatravasthitam shantam svasvarupabhidham
    shivam | anubhuya vapustyaktva jnaptimatramayo bhava || 100|| iti shrigangadharashastrina viracitam
    advaitashatakam sampurnam |
  devanagari: सुषुप्तौ देहश्च कारणाक्यः प्रकीर्तितः ॥ ८॥ दृश्यरूपमिदं सर्वं देह इत्याभिधीयते । तत्रव्याप्तं
    परं ज्योतिर्देहोति परिगीयते ॥ ९॥ अयं सामान्य देहस्यात्मनुष्याणां विवेकिनाम् । सावस्था हि तुरोयारख्या
    भुवनेषु सुदुर्लभा ॥ १०॥ यदा सामन्यदेहेऽस्मिन् स्थितिः पुंसाभिजायते । तदा योगीश्वरो वेदैः परमात्मेति
    गीयते ॥ ११॥ यदा स्थूलादिदेहेषु मनुष्याणां स्थितिर्भवेत् । जीवात्मेति तदा प्रोक्तः सङ्कोचग्रहणाद्बुधैः
    ॥ १२॥ अयं जीवो हि संसारे सदाऽसारे परिभ्रमन् । लोकाल्लोकान्तरं गत्वा गर्भपात्रं विशात्यसौ ॥ १३॥ गत्वा
    गर्भगृहाद्भूयो मानुषं लोकमाविशन् । पुत्रोऽयं मम भार्येऽयमस्मदीयमिदं धनम् ॥ १४॥ इदं गोत्रमिदं मित्रमस्मदीयमिदं
    गृहम् । इयं माता मम पिता जना एते ममारयः ॥ १५॥ इति निश्चित्य जीवात्मा रागदेषं दिने दिने । एतान् प्रति
    करोत्येव स्वाज्ञानादेव केवलम् ॥ १६॥ एकरूपस्य देवस्य सर्वेषामन्तरात्मनः । व्योमवद्व्याप्तदेहस्य बोधरूपस्य
    सर्वदा ॥ १७॥ कुत्रचिद्दृश्यरूपस्य मायादीनां परिग्रहात् । सर्वस्याधाररूपस्य मेघाधीनां यथा नभः ॥ १८॥
    सच्चिदानन्दरूपस्य ब्रह्मरुद्रादिकल्पनात् । विभागं कुरुते जीवः स्वाऽज्ञानादेव केवलम् ॥ १९॥ व्याप्तरूपस्य
    देवस्य सङ्कोचं दुःखमेव हि । तदेव जीवः कुरुते स्वाऽज्ञानादेव केवलम् ॥ २०॥ अथ सत्यविहीनानां कामिनां
    कामचारिणाम् । स्वधर्मविमुखानां च संसर्गं कुरुते सदा ॥ २१॥ पुनर्वश्यावशो स्थित्वा तैस्सार्धं श्वखरागवत्
    । सर्वधर्मविनिर्मुक्तो देहो ता एव सेवते ॥ २२॥ आलापे हरिणाक्षीणां दर्शनस्पर्शनादिषु । हासभावविलासेषु
    मनः सम्यङ् निमज्जति ॥ २३॥ विषयग्रहणाज्जन्तोः प्रद्वेष उपजायते । मातरं पितरं पुत्रं वृद्धञ्चान्यजनान्
    प्रति ॥ २४॥ अलब्धविषयो जन्तुः चिन्तया परितप्यते । शोकमोहभयक्लेशक्रोधलोभाधियुक्तया ॥ २५॥ लब्धे तु परमप्रीति
    सौभाग्यशतसंयुतम् । अभिप्रायशतं ध्यात्वा विषयेषु विषज्यते ॥ २६॥ अलब्धविषये लब्धे जन्तुः श्रेयो न लभ्यते
    । एवं विषयगर्तेषु परिमज्जति मानवः ॥ २७॥ सम्पाद्य मित्रं जीवात्मा तेषां दुःखं दिने दिने । ममेति मन्यते
    नित्यं जन्मान्तरकृताश्रुभात् ॥ २८॥ प्रारब्धकर्मणां भुक्तिं कुर्वन् देहि दिने दिने । पौरुषेण प्रयत्नेन
    कर्माणि कुरुते सदा ॥ २९॥ संसारे वर्तमानानां पुंसां तेनैव हेतुना । श्रुभाश्रुभानि कर्माणि द्विविधनीति
    सन्मतम् ॥ ३०॥ श्रुभाश्रुभानि कर्माणि पौरुषाणि न चेद्यदि । वेदानां विधिवाक्यानां व्यर्थत्वं भवति ध्रुवम्
    ॥ ३१॥ न हिंस्यात्सर्वभूतानि न कुर्यादहितं सताम् । एवमादीनि वाक्यानि व्यार्थन्येव विचारणे ॥ ३२॥ अन्यथा
    विधिवाक्यानि प्रवर्तन्ते तु कं प्रति । जीवं प्रति प्रवृत्तिश्चेत्सोऽपि कर्मवशानुगः ॥ ३३॥ कर्मानुसारि
    जीवश्च कर्माण्येवानुवर्तते । तस्माद्धि कर्माणि क्षीणे तस्य मृत्युर्भवेद्ध्रुवम् ॥ ३४॥ ये मूढा द्विविधं
    कर्म नाङ्गीकुर्वन्ति मोहतः । तेषां हि मरणं मोक्षो लोकायतिकवद्ध्रुवम् ॥ ३५॥ स्थूलदेहं गृहीत्वैवमनुभूय
    शुभाशुभम् । पौरुषं सूक्ष्मदेहेन भोक्तुमारभते पुनः ॥ ३६॥ स्थूलदेहात्सूक्ष्मदेहव्यावृत्तिं मरणं स्मृतम्
    । जीवानां मृतिकालेऽस्मिन् सूक्ष्मदेहः प्रकीर्तितः ॥ ३७॥ प्रारब्धकर्माणां नाशात् उपभोगेन चेतनः । स्थूलदेहात्सूक्ष्मदेहव्यावृत्तिं
    कुरुतेऽवशः ॥ ३८॥ यथा स्वप्ने स्थूलदेहात्सूक्ष्मदेहस्थितिर्भवेत् । मृतिकाले तथा पुसां सूक्ष्मदेहस्थितिर्भवेत्
    ॥ ३९॥ यत्कर्म कुरुते स्वप्ने सूक्ष्मदेहेन चेतनः । स्थूलदेहेन जीवात्मा तदेव कुरुते तदा ॥ ४०॥ स्थूलदेहं
    विहयैवं गृहीत्वा सूक्ष्मविग्रहम् । स्वर्गं वा नरकं वाऽपि जीवात्मा परिगच्छति ॥ ४१॥ जीवात्मा पुण्यबाहुल्यात्स्वर्गलोकं
    यथाक्रमम् । विकासयति भोगार्थं स्वरूपे स्वेन चतेसा ॥ ४२॥ विशुद्धं ज्ञानमेवैकं यथा स्वप्ने त्रिधा भवेत्
    । ग्राहकग्रहणाध्यैश्च स्वर्गलोके तथा भवेत् ॥ ४३॥ यद्यत्स्वप्नप्रपञ्चस्य चोपादानं स्वयं भवेत् । स्वर्गस्य
    नरकस्यैव उपादानं स्वयं भवेत् ॥ ४४॥ जीवात्मा लिङ्गदेहेन स्वर्गं नरकमेव वा । गत्वा मनोमयं पश्चादनुभूय
    शुभाशुभम् ॥ ४५॥ प्रविश्य कारणं देहं परिपूर्णं मनोमयम् । महत्सुखमवाप्नोति परित्यज्य परिश्रमम् ॥ ४६॥
    विहाय कारणं देहं स्वात्मज्ञानमयाद्भुतम् । शुक्लार्तेवे सुसंशुद्धे गर्भपात्रे प्रबुद्धवान् ॥ ४७॥ पुनर्गर्भगृहाद्बुद्ध्वा
    शुद्धशुक्लार्तवं तदा । उपाधित्वेन सङ्गृह्य देहमेव किलेच्छति ॥ ४८॥ गर्भपात्रे स्थितं कुर्वन् बह्वभद्रावहः
    पुमान् । मूर्च्छावस्थां गृहीत्वादौ जन्मान्तरसुभाशुभात् ॥ ४९॥ प्रवाहतोऽनादिमयं देहमेव पुनः पुनः । ध्यात्वा
    ध्यात्वा कालवशात् देह एव प्रजायते ॥ ५०॥ उपाधित्वेन सङ्गृह्य स्थितश्शुक्लार्तवं यदा । देहं विना स्थियस्यास्य
    कथं ध्यानं भवेत्तदा ॥ ५१॥ बोधमात्रैकरूपस्य देवस्यानन्दरूपिणः । स्वस्वरूपेऽपरिच्छेद्या माया स्यात्पारमेश्वरी
    ॥ ५२॥ ज्ञप्तिरूपस्य देवस्य ज्ञप्तिरूपोऽहमेव हि । इति ज्ञानविहीनस्य बोधो मायेति कथ्यते ॥ ५३॥ एवं विचारणे
    माया दैवीति परिकल्पिता । तया सङ्कोचमात्तस्य बन्धोऽनादिरिहोच्यते ॥ ५४॥ अनाध्यन्तवती माया स्थिता मायाविचारणे
    । चराचरमिदं विश्वं तत्कार्यत्वात्तथा भवेत् ॥ ५५॥ अत एव हि देवस्य सच्चिदानन्दरूपिणः । सप्तयोनिष्वहम्भावस्तत्र
    तत्र दृढं भवेत् ॥ ५६॥ लोकेषु वर्तमानानां पुंसां तेन च हेतुना । देहं विनाप्यहङ्कारो वर्तते वासनावशात्
    ॥ ५७॥ वृक्षबीजे यथा वृक्षो स्थितश्शाखादिसंयुतः । तथाहमि स्थितो देहो हस्तपादादिसंयुतः ॥ ५८॥ तस्माद्गर्भस्थितिं
    कुर्वन् जीबोऽविद्यादिसंयुतः । अहङ्कारवशादेव देह एव प्रजायते ॥ ५९॥ देहि सम्पूर्णदेहोऽसौ जन्मान्तरशुभाशुभात्
    । पुनर्गर्भगृहाद्गत्वा मूर्च्छामाप सुविस्मिताम् ॥ ६०॥ एवं देहत्रये कुर्वन् स्थितिं देहि परिभ्रमन्
    । जीवात्मेतुच्यते सद्भिः सर्ववेदान्तपारगैः ॥ ६१॥ एवं संसरतः पुंसः स्वेनार्जितशुभाशुभात् । देशिकालोकनादेव
    वैराग्यं जायते हृदि ॥ ६२॥ एवं वैराग्ययुक्तस्य पुंसो हृदि निरन्तरम् । आविर्बभूव शुद्धात्मा विचारस्सोयमीदृशः
    ॥ ६३॥ धनेन दुःखरोपेण दुर्लभेनात्ममृत्युना । पुंसां का प्रीतिरेवस्यात्पापरूपेण सर्वदा ॥ ६४॥ किं मे
    गेहेन किं भोगैः किं धनईर्धनदैरपि । किं मित्रबान्धवईः कार्यं सर्व कालवशादसत् ॥ ६५॥ किं स्त्रिया पापरूपिण्या
    किं पुत्रैर्भन्दहेतुकैः । मृत्युना गृह्यमाणस्य तैः किं कार्यं क्षणे क्षणे ॥ ६६॥ अतीता बहवः पुत्राः
    दारा जन्मनि जन्मनि । प्रारब्धकर्मभोक्तृणां पुंसां किमिह तैः फलम् ॥ ६७॥ भावेष्वरतियुक्तस्य पुंसस्सत्यार्थभाषिणः
    । कोऽहं कथमिदञ्चेति चिन्ता स्यात्सुव्हिशारदा ॥ ६८॥ सा चिन्ता देशिकं विप्रं वेदशास्त्रागमान्वितम् ।
    ब्रह्मज्ञानवतां पुंसां वरं घटयति क्षणात् ॥ ६९॥ शक्तिपातपवित्रोऽयं जीवात्मा गुरुविग्रहम् । दृष्ट्वा
    परवशो भूत्वा नतिञ्चकै पुनः पुनः ॥ ७०॥ नत्वा देवं महात्मानं देशिकं करुणामयम् । स्वस्वरूपं परिज्ञातुं
    प्राञ्जलिस्तमभाषत ॥ ७१॥ स्वरूपं परमानन्दं ज्ञातुभिच्छामि देशिक । संसाराब्धितितीर्षूणां कर्णधारोऽसि
    देहिनाम् ॥ ७२॥ इति पृष्टो विरक्तेन शिष्येण परमार्थवित् । स्वस्वरूपं पां ध्यायन् देशिकस्तमभाषत ॥ ७३॥
    यमाश्रित्य प्रवर्तन्ते जनास्सर्वे निरन्तरम् । स्वरूपमिति तं विद्यात्करणैश्चक्षुरादिभिः ॥ ७४॥ जाग्रत्काले
    यमाश्रित्य स्थूलदेहः प्रबर्तते । सूक्ष्मदेहस्तथा स्वप्ने स्वरूपं तं विदुर्बुधाः ॥ ७५॥ सुषूप्तौ तु
    यमाश्रित्य भासते कारणं वपुः । स्वाज्ञानमयमव्यक्तं स्वरूपमवधारय ॥ ७६॥ यो जाग्रदादिभेदेन मिथ्यारूपेण
    भासते । तेषां द्रष्टृस्वरूपेण स एव परमेश्वरः ॥ ७७॥ स एव त्वं शिवो विष्णुरग्निरिन्द्रचतुर्मुखः । स
    एव सूर्यस्सोमश्च सः शास्ता स विनायकः ॥ ७८॥ वाणी श्रीगिरिजा दुर्गा देवी चेत्यादिनामभिः । विभिद्य प्रोच्यते
    प्राज्ञैर्मतिभेदेन नान्यथा ॥ ७९॥ एकरूपं समाश्रित्य सङ्कल्पञ्च विकल्पकम् । यदा करोत्यसौ देही मन इत्युच्यते
    तदा ॥ ८०॥ संशयं परित्यज्यं च रूपं प्रत्यवधारितः । यस्मिन् काले प्रत्यगात्मा बुद्धिरित्युच्यते तदा
    ॥ ८१॥ यदाऽसौ स्वपरामर्शादिदमित्थमिति स्फुटम् । रूपं प्रति विजानाति तदाहङ्कारवान् भवेत् ॥ ८२॥ यदा हस्तः
    कर इति बाहोः पर्याय एव हि । मनोबुद्धिरहङ्कारश्चित्तं चेति तथात्मनः ॥ ८३॥ यथावह्नोर्वर्तिभेदात् इक्षोः
    पाकविशेषतः । नामरूपात्मको भेदः स तथा जीवस्य नान्यथा ॥ ८४॥ यथा क्षीरे घृतं व्याप्त तथ्या दृश्ये परः
    पुमान् । उपाधिभेदात्भेदस्स्यात् तस्मादेकस्य नान्यथा ॥ ८५॥ एकरूपो महादेवः सर्वभूतेष्ववस्थितः । एकरूपो
    महाकाशो घटादिषु यथा स्थितः ॥ ८६॥ पृथक् पृथक् स्थितानाञ्च देहानामविवादतः । पाणिपादादियुक्तानां भेदो
    नास्ति विचारणे ॥ ८७॥ चराचरमिदं विश्वं पञ्चभूतात्मकं स्मृतम् । देहानां पञ्चभूतानां भेदो नास्ति तथास्थिते
    ॥ ८७॥ मृन्मयत्वाद्घटादीनां यथा भेदो न विद्यते । पञ्चभूतात्मकत्वेन देहानाञ्च तथैव च ॥ ८९॥ एवं विचारणे
    तात नास्ति भेदः कदाचन । देहानां पञ्चभूतानां जडानामाशुनाशिनाम् ॥ ९०॥ नवप्रदेशमात्रोऽयं हस्तपादादिमानहम्
    । इति निश्चयवान् लोके जीव इत्यभिधीयते ॥ ९१॥ सर्वत्र परिपूर्णोऽहमयं देहो समेति च । इति निश्चयवानन्तः
    परमात्मेति कथ्यते ॥ ९२॥ एवं स्थिते न भेदस्स्यात्जीवात्मपरमात्मनोः । तयोरभेद एव स्यात्चित्स्वरूपाविशेषतः
    ॥ १३॥ देहसाक्षी प्राण एव इति चेत्तन्न सङ्गतम् । सुषुप्तौ सर्वदेहानां जडत्वादेव नान्यथा ॥ १४॥ स्वव्यापारकृते
    प्राणो देहोपरतिदर्शनात् । देहस्य कर्ता न प्राण इत्येवमवधारय ॥ ९५॥ यच्चिन्त्यते भूपतिना तत्कुर्वन्त्यनुजीविनः
    । तस्मात्प्राणो न कर्ता स्यादिति लोकेषु दर्शनात् ॥ ९६॥ देहत्रयसमुद्भूतां वासनां सम्परित्यजन् । परिगृह्य
    परं देहं परिपूर्णं परो भव ॥ ९७॥ परिपूर्णमयं रूपं परिगृह्य शुभशुभम् । नित्यनैमित्तिकं कर्म सदा कुर्वन्न
    लित्यते ॥ ९८॥ कृतानि वाङ्मनः कायैर्लोके कर्माणि जन्तुभिः । तोषामन्यतमत्वेन कथं कर्ता भविष्यति ॥ ९९॥
    सर्वत्रावस्थितं शान्तं स्वस्वरूपाभिधं शिवम् । अनुभूय वपुस्त्यक्त्वा ज्ञाप्तिमात्रमयो भव ॥ १००॥ इति
    श्रीगङ्गाधराशास्त्रिणा विरचितं अद्वैतशतकं सम्पूर्णम् ।
