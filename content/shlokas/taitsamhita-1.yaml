id: taitsamhita-1
category: veda
name:
  english: taitsamhita 1
  devanagari: तैत्सम्हित १
content:
  english: '|| kshetra̭syapate̱madhṷmantamu̱rmimdhe̱nuri̭va̱payo̭a̱smasṷdhukshva | ma̱dhu̱shcuta̭m ghri̱tami̭vasupṷtamri̱tasya̭na̱hpata̭yomridayantu
    || agne̱naya̭su̱patha̭ra̱ye a̱smanvishva̭nidevava̱yuna̭nivi̱dvan | yu̱yodhya̭smajjṷhura̱nameno̱bhuyi̭shthamte̱nama̭uktimvidhema
    || ade̱vana̱mapi̱ pantha̭maganma̱yaccha̱knava̭ma̱tadanu̱pravodhum | a̱gnirvi̱dvantsaya̭ja̱tsedu̱hota̱so
    a̭dhva̱ranthsari̱tunka̭lpayati || yadvahi̭shtha̱tada̱gnayḙbri̱hada̭rcavibhavaso | mahi̭shiva̱tvadra̱yistvadvaja̱udi̭rate
    || agne̱tvampa̭raya̱navyo̭a̱smanthsva̱stibhi̱rati̭du̱rgani̱vishva'
  devanagari: ॥ क्षेत्र॑स्यपते॒मधु॑मन्तमू॒र्मिंधे॒नुरि॑व॒पयो॑अ॒स्मासु॑धुक्ष्व । म॒धु॒श्चुतं॑ घृ॒तमि॑वसुपू॑तमृ॒तस्य॑नः॒पत॑योमृडयन्तु
    ॥ अग्ने॒नय॑सु॒पथा॑रा॒ये अ॒स्मान्विश्वा॑निदेवव॒युना॑निवि॒द्वान् । यु॒योध्य॑स्मज्जु॑हुरा॒णमेनो॒भूयि॑ष्ठांते॒नम॑उक्तिंविधेम
    ॥ आदे॒वाना॒मपि॒ पन्था॑मगन्म॒यच्छ॒क्नवा॑म॒तदनु॒प्रवोढुम् । अ॒ग्निर्वि॒द्वान्त्सय॑जा॒त्सेदु॒होता॒सो
    अ॑ध्व॒रान्थ्सऋ॒तून्क॑ल्पयाति ॥ यद्वाहि॑ष्ठ॒तद॒ग्नये॑बृ॒हद॑र्चविभावसो । महि॑षीव॒त्वद्र॒यिस्त्वद्वाजा॒उदी॑रते
    ॥ अग्ने॒त्वम्पा॑रया॒नव्यो॑अ॒स्मान्थ्स्व॒स्तिभि॒रति॑दु॒र्गाणि॒विश्वा
