id: radhikahridayam
category: hridaya
name:
  english: radhikahridayam
  devanagari: राधिकाहृदयम्
content:
  english: om vishvatmika parashaktih parama brahmavidya radhika namna vikhyata | sa eva sakshatparatparabrahmasvarupini
    | yasyah prabhavatsarve devah svasmin svasmin karmani pravartante | yatha raveh prabha yatha vagvani
    tathaiva sa radhika akhilajagadadhara | yasyah sparshena vina anumatramapi na calati sa eva mulaprakritih
    | sa shiva sa shaktih sa purushah sa prakritih sa maya sa kala sa shattrimshattattvarupa sa kundalini
    | sa eva ekaivapi bahudha prakashate | yatha gaganam ghateghate bhinnam drishyate tathapi akashamekameva
    tathaiva sa radhika caturmukhabrahmarupena sa srijati vishnutvena palayati rudrarupena samharati |
    indravarunagniyamadishu sarveshu devataganeshu sa eva shaktirupena pratishthita | tasyah svarupam
    na adimat na ca antavat | sa cidakashe cidagnikundamadhyasthita | sa eva mohatmika sa eva mokshada
    | yaya vyaptamidam sarvam yasyam sthitam caracaram sa radhika iti procyate | sa nadabindukalatita
    parabrahmamayi | udyadinadyutimindukiritam tungakucam nayanatrayayuktam smeramukhim varadankushapashabhitikaram
    prabhaje parameshvarim | iti dhyatva sadhakah tanmayatam labhate | tadbijam yatra hakaram rephasamyuktam
    ikaram bindubhushitam tadeva mayabijam yadantarnigudham vartate | tasya mantrasya shaktirishirgayatri
    chando bhuvaneshvari devata | etadbijam hridaye nidhaya yo japatyasau sakshatparabrahmamayah bhavati
    | sa eva brahma sa eva brahmani sa eva purushaprakritibhinnapi abhinnarupa | sa tapomayi sa tapah
    sa mahah sa janah sa satyam | sa yada sankalpayati tada srishtirudeti yada sa nimilayati tada sarvam
    tasyameva liyate | sa pashankushadhanurbanadhara sa yogini sa bhogini sa sannyasini | sa eva indriyagrahya
    sa indriyatita | yasyah prasadadaksharani sphuranti yasyah anugrahadjnanamudeti sa para vaksa radhika
    | na tasyah samipe kashcidbhinnah sa eva sarvam | ya evam veda sa sakshatparabrahmasvarupam radhikameva
    pashyati | sa eva muktih sa eva bhuktih sa eva purnata | yasya anghripankaje sarvam vishvam nivasati
    sa radhika iti prokta | idamatharvashirshasadrisham rahasyam yah pathati sa mahapatakabhayatpramucyate
    | ahoratrakritam papam tasya nashayati | sa sarvasiddhinam patram bhavati | tasya grihe lakshmih sada
    vasati | yah sahasram japatyasau brahmasvarupam prapnoti | mrityoh param na tasya bhayam sa jivanmukto
    bhavatiti | ityupanishat | om shantih shantih shantih || iti brahmayamale radhikahridayam athava atharvashirshasadrisham
    radhikarahasyam sampurnam |
  devanagari: ॐ विश्वात्मिका पराशक्तिः परमा ब्रह्मविद्या राधिका नाम्ना विख्याता । सा एव साक्षात्परात्परब्रह्मस्वरूपिणी
    । यस्याः प्रभावात्सर्वे देवाः स्वस्मिन् स्वस्मिन् कर्मणि प्रवर्तन्ते । यथा रवेः प्रभा यथा वाग्वाणी
    तथैव सा राधिका अखिलजगदाधारा । यस्याः स्पर्शेन विना अणुमात्रमपि न चलति सा एव मूलप्रकृतिः । सा शिवा
    सा शक्तिः सा पुरुषः सा प्रकृतिः सा माया सा काला सा षट्त्रिंशत्तत्त्वरूपा सा कुण्डलिनी । सा एव एकैवापि
    बहुधा प्रकाशते । यथा गगनं घटेघटे भिन्नं दृश्यते तथापि आकाशमेकमेव तथैव सा राधिका चतुर्मुखब्रह्मरूपेण
    सा सृजति विष्णुत्वेन पालयति रुद्ररूपेण संहरति । इन्द्रवरुणाग्नियमादिषु सर्वेषु देवतागणेषु सा एव शक्तिरूपेण
    प्रतिष्ठिता । तस्याः स्वरूपं न आदिमत् न च अन्तवत् । सा चिदाकाशे चिदग्निकुण्डमध्यस्थिता । सा एव मोहात्मिका
    सा एव मोक्षदा । यया व्याप्तमिदं सर्वं यस्यां स्थितं चराचरं सा राधिका इति प्रोच्यते । सा नादबिन्दुकलातीता
    परब्रह्ममयी । उद्यदिनद्युतिमिन्दुकिरीटां तुङ्गकुचां नयनत्रययुक्तां स्मेरमुखीं वरदाङ्कुशपाशाभीतिकरां
    प्रभजे परमेश्वरीम् । इति ध्यात्वा साधकः तन्मयतां लभते । तद्बीजं यत्र हाकारं रेफसंयुक्तं इकारं बिन्दुभूषितं
    तदेव मायाबीजं यदन्तर्निगूढं वर्तते । तस्य मन्त्रस्य शक्तिऋषिर्गायत्री छन्दो भुवनेश्वरी देवता । एतद्बीजं
    हृदये निधाय यो जपत्यसौ साक्षात्परब्रह्ममयः भवति । सा एव ब्रह्म सा एव ब्रह्मणी सा एव पुरुषप्रकृतिभिन्नापि
    अभिन्नरूपा । सा तपोमयी सा तपः सा महः सा जनः सा सत्यम् । सा यदा सङ्कल्पयति तदा सृष्टिरुदेति यदा सा
    निमीलयति तदा सर्वं तस्यामेव लीयते । सा पाशङ्कुशधनुर्बाणधरा सा योगिनी सा भोगिनी सा सन्न्यासिनी । सा
    एव इन्द्रियग्राह्या सा इन्द्रियातीता । यस्याः प्रसादादक्षराणि स्फुरन्ति यस्याः अनुग्रहाद्ज्ञानमुदेति
    सा परा वाक्सा राधिका । न तस्याः समीपे कश्चिद्भिन्नः सा एव सर्वम् । य एवं वेद स साक्षात्परब्रह्मस्वरूपां
    राधिकामेव पश्यति । सा एव मुक्तिः सा एव भुक्तिः सा एव पूर्णता । यस्या अङ्घ्रिपङ्कजे सर्वं विश्वं निवसति
    सा राधिका इति प्रोक्ता । इदमथर्वशीर्षसदृशं रहस्यं यः पठति स महापातकभयात्प्रमुच्यते । अहोरात्रकृतं
    पापं तस्य नाशयति । स सर्वसिद्धीनां पात्रं भवति । तस्य गृहे लक्ष्मीः सदा वसति । यः सहस्रं जपत्यसौ ब्रह्मस्वरूपं
    प्राप्नोति । मृत्योः परं न तस्य भयं स जीवन्मुक्तो भवतीति । इत्युपनिषत् । ॐ शान्तिः शान्तिः शान्तिः
    ॥ इति ब्रह्मयामले राधिकाहृदयं अथवा अथर्वशीर्षसदृशं राधिकारहस्यं सम्पूर्णम् ।
