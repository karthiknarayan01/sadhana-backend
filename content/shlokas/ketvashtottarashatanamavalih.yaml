id: ketvashtottarashatanamavalih
category: stotram
name:
  english: ketvashtottarashatanamavalih
  devanagari: केत्वष्टोत्तरशतनामावलिः
content:
  english: om sram srim sraum sah ketave namah || om ketave namah || om sthulashirase namah || om shiromatraya
    namah || om dhvajakritaye namah || om navagrahayutaya namah || om simhikasurigarbhasambhavaya namah
    || om mahabhitikaraya namah || om citravarnaya namah || om shripingalakshakaya namah || om phulladhumrasamkashaya
    namah || 10 om tikshnadamshtraya namah || om mahodaraya namah || om raktanetraya namah || om citrakarine
    namah || om tivrakopaya namah || om mahasuraya namah || om krurakanthaya namah || om krodhanidhaye
    namah || om chayagrahavisheshakaya namah || om antyagrahaya namah || 20 om mahashirshaya namah ||
    om suryaraye namah || om pushpavadgrahine namah || om varahastaya namah || om gadapanaye namah ||
    om citravastradharaya namah || om citradhvajapatakaya namah || om ghoraya namah || om citrarathaya
    namah || om shikhine namah || 30 om kulutthabhakshakaya namah || om vaiduryabharanaya namah || om
    utpatajanakaya namah || om shukramitraya namah || om mandasakhaya namah || om gadadharaya namah ||
    om nakapataye namah || om antarvedishvaraya namah || om jaiminigotrajaya namah || om citraguptatmane
    namah || 40 om dakshinamukhaya namah || om mukundavarapatraya namah || om mahasurakulodbhavaya namah
    || om ghanavarnaya namah || om lambadevaya namah || om mrityuputraya namah || om utpatarupadharine
    namah || om adrishyaya namah || om kalagnisamnibhaya namah || om nripidaya namah || 50 om grahakarine
    namah || om sarvopadravakarakaya namah || om citraprasutaya namah || om analaya namah || om sarvavyadhivinashakaya
    namah || om apasavyapracarine namah || om navame papadayakaya namah || om pamcame shokadaya namah
    || om uparagakhecaraya namah || om atipurushakarmane namah || 60 om turiye sukhapradaya namah || om
    tritiye vairadaya namah || om papagrahaya namah || om sphotakakarakaya namah || om prananathaya namah
    || om pancame shramakarakaya namah || om dvitiye'sphutavagdatre namah || om vishakulitavaktrakaya
    namah || om kamarupine namah || om simhadantaya namah || 70 om kushedhmapriyaya namah || om caturthe
    matrinashaya namah || om navame pitrinashakaya namah || om antye vairapradaya namah || om sutanandannidhanakaya
    namah || om sarpakshijataya namah || om anangaya namah || om karmarashyudbhavaya namah || om upante
    kirtidaya namah || om saptame kalahapradaya namah || 80 om ashtame vyadhikartre namah || om dhane
    bahusukhapradaya namah || om janane rogadaya namah || om urdhvamurdhajaya namah || om grahanayakaya
    namah || om papadrishtaye namah || om khecaraya namah || om shambhavaya namah || om asheshapujitaya
    namah || om shashvataya namah || 90 om nataya namah || om shubhashubhaphalapradaya namah || om dhumraya
    namah || om sudhapayine namah || om ajitaya namah || om bhaktavatsalaya namah || om simhasanaya namah
    || om ketumurtaye namah || om ravindudyutinashakaya namah || om amaraya namah || 100 om pidakaya namah
    || om amartyaya namah || om vishnudrishtaya namah || om asureshvaraya namah || om bhaktarakshaya namah
    || om vaicitryakapatasyandanaya namah || om vicitraphaladayine namah || om bhaktabhishtaphalapradaya
    namah || || iti ketu ashtottarashatanamavalih sampurnam ||
  devanagari: ॐ स्रां स्रीं स्रौं सः केतवे नमः ॥ ॐ केतवे नमः ॥ ॐ स्थूलशिरसे नमः ॥ ॐ शिरोमात्राय नमः ॥
    ॐ ध्वजाकृतये नमः ॥ ॐ नवग्रहयुताय नमः ॥ ॐ सिंहिकासुरीगर्भसंभवाय नमः ॥ ॐ महाभीतिकराय नमः ॥ ॐ चित्रवर्णाय
    नमः ॥ ॐ श्रीपिङ्गलाक्षकाय नमः ॥ ॐ फुल्लधूम्रसंकाषाय नमः ॥ १० ॐ तीक्ष्णदंष्ट्राय नमः ॥ ॐ महोदराय नमः
    ॥ ॐ रक्तनेत्राय नमः ॥ ॐ चित्रकारिणे नमः ॥ ॐ तीव्रकोपाय नमः ॥ ॐ महासुराय नमः ॥ ॐ क्रूरकण्ठाय नमः ॥
    ॐ क्रोधनिधये नमः ॥ ॐ छायाग्रहविशेषकाय नमः ॥ ॐ अन्त्यग्रहाय नमः ॥ २० ॐ महाशीर्षाय नमः ॥ ॐ सूर्यारये
    नमः ॥ ॐ पुष्पवद्ग्राहिणे नमः ॥ ॐ वरहस्ताय नमः ॥ ॐ गदापाणये नमः ॥ ॐ चित्रवस्त्रधराय नमः ॥ ॐ चित्रध्वजपताकाय
    नमः ॥ ॐ घोराय नमः ॥ ॐ चित्ररथाय नमः ॥ ॐ शिखिने नमः ॥ ३० ॐ कुलुत्थभक्षकाय नमः ॥ ॐ वैडूर्याभरणाय नमः
    ॥ ॐ उत्पातजनकाय नमः ॥ ॐ शुक्रमित्राय नमः ॥ ॐ मन्दसखाय नमः ॥ ॐ गदाधराय नमः ॥ ॐ नाकपतये नमः ॥ ॐ अन्तर्वेदीश्वराय
    नमः ॥ ॐ जैमिनिगोत्रजाय नमः ॥ ॐ चित्रगुप्तात्मने नमः ॥ ४० ॐ दक्षिणामुखाय नमः ॥ ॐ मुकुन्दवरपात्राय नमः
    ॥ ॐ महासुरकुलोद्भवाय नमः ॥ ॐ घनवर्णाय नमः ॥ ॐ लम्बदेवाय नमः ॥ ॐ मृत्युपुत्राय नमः ॥ ॐ उत्पातरूपधारिणे
    नमः ॥ ॐ अदृश्याय नमः ॥ ॐ कालाग्निसंनिभाय नमः ॥ ॐ नृपीडाय नमः ॥ ५० ॐ ग्रहकारिणे नमः ॥ ॐ सर्वोपद्रवकारकाय
    नमः ॥ ॐ चित्रप्रसूताय नमः ॥ ॐ अनलाय नमः ॥ ॐ सर्वव्याधिविनाशकाय नमः ॥ ॐ अपसव्यप्रचारिणे नमः ॥ ॐ नवमे
    पापदायकाय नमः ॥ ॐ पंचमे शोकदाय नमः ॥ ॐ उपरागखेचराय नमः ॥ ॐ अतिपुरुषकर्मणे नमः ॥ ६० ॐ तुरीये सुखप्रदाय
    नमः ॥ ॐ तृतीये वैरदाय नमः ॥ ॐ पापग्रहाय नमः ॥ ॐ स्फोटककारकाय नमः ॥ ॐ प्राणनाथाय नमः ॥ ॐ पञ्चमे श्रमकारकाय
    नमः ॥ ॐ द्वितीयेऽस्फुटवग्दात्रे नमः ॥ ॐ विषाकुलितवक्त्रकाय नमः ॥ ॐ कामरूपिणे नमः ॥ ॐ सिंहदन्ताय नमः
    ॥ ७० ॐ कुशेध्मप्रियाय नमः ॥ ॐ चतुर्थे मातृनाशाय नमः ॥ ॐ नवमे पितृनाशकाय नमः ॥ ॐ अन्त्ये वैरप्रदाय
    नमः ॥ ॐ सुतानन्दन्निधनकाय नमः ॥ ॐ सर्पाक्षिजाताय नमः ॥ ॐ अनङ्गाय नमः ॥ ॐ कर्मराश्युद्भवाय नमः ॥ ॐ
    उपान्ते कीर्तिदाय नमः ॥ ॐ सप्तमे कलहप्रदाय नमः ॥ ८० ॐ अष्टमे व्याधिकर्त्रे नमः ॥ ॐ धने बहुसुखप्रदाय
    नमः ॥ ॐ जनने रोगदाय नमः ॥ ॐ ऊर्ध्वमूर्धजाय नमः ॥ ॐ ग्रहनायकाय नमः ॥ ॐ पापदृष्टये नमः ॥ ॐ खेचराय नमः
    ॥ ॐ शाम्भवाय नमः ॥ ॐ अशेषपूजिताय नमः ॥ ॐ शाश्वताय नमः ॥ ९० ॐ नटाय नमः ॥ ॐ शुभाशुभफलप्रदाय नमः ॥ ॐ
    धूम्राय नमः ॥ ॐ सुधापायिने नमः ॥ ॐ अजिताय नमः ॥ ॐ भक्तवत्सलाय नमः ॥ ॐ सिंहासनाय नमः ॥ ॐ केतुमूर्तये
    नमः ॥ ॐ रवीन्दुद्युतिनाशकाय नमः ॥ ॐ अमराय नमः ॥ १०० ॐ पीडकाय नमः ॥ ॐ अमर्त्याय नमः ॥ ॐ विष्णुदृष्टाय
    नमः ॥ ॐ असुरेश्वराय नमः ॥ ॐ भक्तरक्षाय नमः ॥ ॐ वैचित्र्यकपटस्यन्दनाय नमः ॥ ॐ विचित्रफलदायिने नमः ॥
    ॐ भक्ताभीष्टफलप्रदाय नमः ॥ ॥ इति केतु अष्टोत्तरशतनामावलिः सम्पूर्णम् ॥
