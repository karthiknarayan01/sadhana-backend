id: ramaraghavastotram
category: stotram
name:
  english: ramaraghavastotram
  devanagari: रामराघवस्तोत्रम्
content:
  english: adikavyasuganasaurasalolasaukhyaparatpara ravanarditadevabandhavimocanaya nridehabhrit | rama
    raghava rama raghava rama raghava pahi mam rama raghava rama raghava rama raghava shadhi mam || 1||
    bhanuvamshavibhushanottamalokapala jagadguro lakshmanagraja satyanishthasukosalendra jagatpate | rama
    raghava rama raghava rama raghava pahi mam rama raghava rama raghava rama raghava shadhi mam || 2||
    tatakantaka yajnarakshaka kripakara bahughataka devasamstuta tapasottamatoshaka | rama raghava rama
    raghava rama raghava pahi mam rama raghava rama raghava rama raghava shadhi mam || 3|| marakotisuvarnasundarakotishah
    shashibhasura punyapavana padapamsusamuddhritarshisatistuta | rama raghava rama raghava rama raghava
    pahi mam rama raghava rama raghava rama raghava shadhi mam || 4|| capabhanjana garvashunyavidehavandita
    sadguro adishaktividehajakarasevitakhilamangala | rama raghava rama raghava rama raghava pahi mam
    rama raghava rama raghava rama raghava shadhi mam || 5|| bhaktagarvavinashakritkarunanidanashivankara
    jamadagnyakalapakarshaka vishvavandya jagatpate | rama raghava rama raghava rama raghava pahi mam
    rama raghava rama raghava rama raghava shadhi mam || 6|| tatabhashitapalanonmukhatyaktarajyavanecara
    guhakarcita gangaparita kaikayisutasamstuta | rama raghava rama raghava rama raghava pahi mam rama
    raghava rama raghava rama raghava shadhi mam || 7|| dushanadikharadinashaka hemarakshasamaraka pakshimokshada
    bhaktidattakiratiniphalasevita | rama raghava rama raghava rama raghava pahi mam rama raghava rama
    raghava rama raghava shadhi mam || 8|| vajradehakapindravandita valibandhuhitankara vayunandanabhashitasvasudarashodhanasushruta
    | rama raghava rama raghava rama raghava pahi mam rama raghava rama raghava rama raghava shadhi mam
    || 9|| tapasottamavandya shankarageya vanarayuthapa dushtarakshasasainyanashaka dharmapala sukhodaya
    | rama raghava rama raghava rama raghava pahi mam rama raghava rama raghava rama raghava shadhi mam
    || 10|| lokakantakaravanadikadushtavamshanibarhana svanghrisevivibhishanaya tu rajyadanasukhankara
    | rama raghava rama raghava rama raghava pahi mam rama raghava rama raghava rama raghava shadhi mam
    || 11|| bhaktapalana bhaktavatsala satyasandha dayambudhe bhaktadainyakutharaduhkhavidara sarvashubhankara
    | rama raghava rama raghava rama raghava pahi mam rama raghava rama raghava rama raghava shadhi mam
    || 12|| janakinijashaktimanditadharmarajyadhurandhara brahmarupa sadaiva cidghana nityasatya sukhakara
    | rama raghava rama raghava rama raghava pahi mam rama raghava rama raghava rama raghava shadhi mam
    || 13|| iti shrishridharasvamiviracitam shriramaraghavastotram sampurnam | sthala girinara ramamandira
    ramanavami samvatsarah h 1946 shridhara
  devanagari: आदिकाव्यसुगानसौरसलोलसौख्यपरात्पर रावणार्दितदेवबन्धविमोचनाय नृदेहभृत् । राम राघव राम राघव
    राम राघव पाहि मां राम राघव राम राघव राम राघव शाधि माम् ॥ १॥ भानुवंशविभूषणोत्तमलोकपाल जगद्गुरो लक्ष्मणाग्रज
    सत्यनिष्ठसुकोसलेन्द्र जगत्पते । राम राघव राम राघव राम राघव पाहि मां राम राघव राम राघव राम राघव शाधि
    माम् ॥ २॥ ताटकान्तक यज्ञरक्षक कृपाकर बाहुघातक देवसंस्तुत तापसोत्तमतोषक । राम राघव राम राघव राम राघव
    पाहि मां राम राघव राम राघव राम राघव शाधि माम् ॥ ३॥ मारकोटिसुवर्णसुन्दरकोटिशः शशिभासुर पुण्यपावन पादपांसुसमुद्धृतर्षिसतीस्तुत
    । राम राघव राम राघव राम राघव पाहि मां राम राघव राम राघव राम राघव शाधि माम् ॥ ४॥ चापभञ्जन गर्वशून्यविदेहवन्दित
    सद्गुरो आदिशक्तिविदेहजाकरसेविताखिलमङ्गल । राम राघव राम राघव राम राघव पाहि मां राम राघव राम राघव राम
    राघव शाधि माम् ॥ ५॥ भक्तगर्वविनाशकृत्करुणानिदानशिवङ्कर जामदग्न्यकलापकर्षक विश्ववन्द्य जगत्पते । राम
    राघव राम राघव राम राघव पाहि मां राम राघव राम राघव राम राघव शाधि माम् ॥ ६॥ तातभाषितपालनोन्मुखत्यक्तराज्यवनेचर
    गूहकार्चित गाङ्गपारित कैकयीसुतसंस्तुत । राम राघव राम राघव राम राघव पाहि मां राम राघव राम राघव राम
    राघव शाधि माम् ॥ ७॥ दूषणादिखरादिनाशक हेमराक्षसमारक पक्षिमोक्षद भक्तिदत्तकिरातिनीफलसेवित । राम राघव
    राम राघव राम राघव पाहि मां राम राघव राम राघव राम राघव शाधि माम् ॥ ८॥ वज्रदेहकपीन्द्रवन्दित वालिबन्धुहितङ्कर
    वायुनन्दनभाषितस्वसुदारशोधनसुश्रुत । राम राघव राम राघव राम राघव पाहि मां राम राघव राम राघव राम राघव
    शाधि माम् ॥ ९॥ तापसोत्तमवन्द्य शङ्करगेय वानरयूथप दुष्टराक्षससैन्यनाशक धर्मपाल सुखोदय । राम राघव राम
    राघव राम राघव पाहि मां राम राघव राम राघव राम राघव शाधि माम् ॥ १०॥ लोककण्टकरावणादिकदुष्टवंशनिबर्हण
    स्वाङ्घ्रिसेविविभीषणाय तु राज्यदानसुखङ्कर । राम राघव राम राघव राम राघव पाहि मां राम राघव राम राघव
    राम राघव शाधि माम् ॥ ११॥ भक्तपालन भक्तवत्सल सत्यसन्ध दयाम्बुधे भक्तदैन्यकुठारदुःखविदार सर्वशुभङ्कर
    । राम राघव राम राघव राम राघव पाहि मां राम राघव राम राघव राम राघव शाधि माम् ॥ १२॥ जानकीनिजशक्तिमण्डितधर्मराज्यधुरन्धर
    ब्रह्मरूप सदैव चिद्घन नित्यसत्य सुखाकर । राम राघव राम राघव राम राघव पाहि मां राम राघव राम राघव राम
    राघव शाधि माम् ॥ १३॥ इति श्रीश्रीधरस्वामीविरचितं श्रीरामराघवस्तोत्रं सम्पूर्णम् । स्थल गिरिनार राममन्दिर
    रामनवमी संवत्सरः ः १९४६ श्रीधर
