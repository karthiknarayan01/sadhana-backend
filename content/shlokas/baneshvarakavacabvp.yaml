id: baneshvarakavacabvp
category: kavacha
name:
  english: baneshvarakavacaBVP
  devanagari: बाणेश्वरकवचBVP
content:
  english: rinu vakshyami he vatsa kavacam paramadbhutam | aham tubhyam pradasyami gopaniyam sudurlabham
    || 44|| pura durvasase dattam trailokyavijayaya ca | mamaivedam ca kavacam bhaktya yo dharayet sudhih
    || 45|| jetum shaknoti trailokyam bhagavannavalilaya | samsarapavanasyasya kavacasya prajapatih ||
    46|| rishishcchandashca gayatri devo'ham ca maheshvarah | dharmarthakamamoksheshu viniyogah prakirtitah
    || 47|| pancalakshajapenaiva siddhidam kavacam bhavet | yo bhavet siddhakavaco mama tulyo bhavedbhuvi
    | tejasa siddhiyogena tapasa vikramena ca || 48|| shambhurme mastakam patu mukham patu maheshvarah
    | dantapamktim nilakantho'pyadharoshtham harah svayam || 49|| kantham patu candracudah skandhau vrishabhavahanah
    | vakshahsthalam nilakanthah patu prishtham digambarah || 50|| sarvangam patu vishveshah sarvadikshu
    ca sarvada | svapne jagarane caiva sthanurme patu santatam || 51|| iti te kathitam bana kavacam paramadbhutam
    | yasmai kasmai na datavyam gopaniyam prayatnatah || 52|| yat phalam sarvatirthanam snanena labhate
    narah | tat phalam labhate nunam kavacasyaiva dharanat || 53|| idam kavacamajnatva bhajenmam yah sumandadhih
    | shatalakshaprajapto'pi na mantrah siddhidayakah || 54|| iti shribrahmavaivarte shankarakavacam samaptam
    |
  devanagari: ृणु वक्ष्यामि हे वत्स कवचं परमाद्भुतम् । अहं तुभ्यं प्रदास्यामि गोपनीयं सुदुर्लभम् ॥ ४४॥
    पुरा दुर्वाससे दत्तं त्रैलोक्यविजयाय च । ममैवेदं च कवचं भक्त्या यो धारयेत् सुधीः ॥ ४५॥ जेतुं शक्नोति
    त्रैलोक्यं भगवन्नवलीलया । संसारपावनस्यास्य कवचस्य प्रजापतिः ॥ ४६॥ ऋषिश्च्छन्दश्च गायत्री देवोऽहं च
    महेश्वरः । धर्मार्थकाममोक्षेषु विनियोगः प्रकीर्तितः ॥ ४७॥ पञ्चलक्षजपेनैव सिद्धिदं कवचं भवेत् । यो
    भवेत् सिद्धकवचो मम तुल्यो भवेद्भुवि । तेजसा सिद्धियोगेन तपसा विक्रमेण च ॥ ४८॥ शम्भुर्मे मस्तकं पातु
    मुखं पातु महेश्वरः । दन्तपंक्तिं नीलकण्ठोऽप्यधरोष्ठं हरः स्वयम् ॥ ४९॥ कण्ठं पातु चन्द्रचूडः स्कन्धौ
    वृषभवाहनः । वक्षःस्थलं नीलकण्ठः पातु पृष्ठं दिगम्बरः ॥ ५०॥ सर्वाङ्गं पातु विश्वेशः सर्वदिक्षु च सर्वदा
    । स्वप्ने जागरणे चैव स्थाणुर्मे पातु सन्ततम् ॥ ५१॥ इति ते कथितं बाण कवचं परमाद्भुतम् । यस्मै कस्मै
    न दातव्यं गोपनीयं प्रयत्नतः ॥ ५२॥ यत् फलं सर्वतीर्थानां स्नानेन लभते नरः । तत् फलं लभते नूनं कवचस्यैव
    धारणात् ॥ ५३॥ इदं कवचमज्ञात्वा भजेन्मां यः सुमन्दधीः । शतलक्षप्रजप्तोऽपि न मन्त्रः सिद्धिदायकः ॥ ५४॥
    इति श्रीब्रह्मवैवर्ते शङ्करकवचं समाप्तम् ।
