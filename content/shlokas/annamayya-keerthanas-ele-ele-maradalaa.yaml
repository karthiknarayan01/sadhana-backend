id: annamayya-keerthanas-ele-ele-maradalaa
category: stotram
name:
  english: Annamayya Keerthanas Ele Ele Maradalaa
content:
  english: adi pallavi ele yele maradala calujalu | calunu calu nitodi sarasambu bava || caranam gatapu
    gubbalu gadalaga gulikevu | matala detala maradala | citiki matiki jènakeve vatti | butakalu manipove
    bava || caranam andindè nannu nadalinci vesevu | mandamelapu maradala | sanduko dirigevi satakarivo
    bava | pòndugadika bove bava || caranam còkkapu giligintala cupula nannu | makkuva sesina maradala
    | gakkuna nanu venkatapati kuditi | dakkincukòntivi tagulaiti bava ||
  devanagari: आदि पल्लवि एले येले मरदला चालुजालु । चालुनु चालु नीतोडि सरसम्बु बाव ॥ चरणं गाटपु गुब्बलु
    गदलग गुलिकेवु । माटल देटल मरदला । चीटिकि माटिकि जॆनकेवे वट्टि । बूटकालु मानिपोवे बाव ॥ चरणं अन्दिन्दॆ
    नन्नु नदलिञ्चि वेसेवु । मन्दमेलपु मरदला । सन्दुको दिरिगेवि सटकारिवो बाव । पॊन्दुगादिक बोवे बाव ॥ चरणं
    चॊक्कपु गिलिगिन्तल चूपुल नन्नु । मक्कुव सेसिन मरदला । गक्कुन ननु वेङ्कटपति कूडिति । दक्किञ्चुकॊण्टिवि
    तगुलैति बाव ॥
