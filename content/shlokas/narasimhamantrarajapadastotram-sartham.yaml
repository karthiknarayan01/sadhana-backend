id: narasimhamantrarajapadastotram-sartham
category: mantra
name:
  english: narasimhamantrarajapadastotram sartham
  devanagari: नरसिंहमन्त्रराजपदस्तोत्रम् सार्थम्
content:
  english: vrittotphullavishalaksham vipakshakshayadikshitam | ninadatrastavishvandam vishnumugram namamyaham
    || 1|| sarvairavadhyatam praptam saphalaugham diteh sutam | nakhagraih shakalicakre yastam viram namamyaham
    || 2|| padavashtabdhapatalam murdha''vishtatrivishtapam | bhujapravishtashtadisham mahavishnum namamyaham
    || 3|| jyotimshyarkendunakshatrajvalanadinyanukramat | jvalanti tejasa yasya tam jvalantam namamyaham
    || 4|| sarvendriyairapi vina sarvam sarvatra sarvada | janati yo namamyadyam tamaham sarvatomukham
    || 5|| naravatsimhavaccaiva rupam yasya mahatmanah | mahasatam mahadamshtram tam nrisimham namamyaham
    || 6|| yannamasmaranadbhitah bhutavetalarakshasah | rogadyashca pranashyanti bhishanam tam namamyaham
    || 7|| sarvo'pi yam samashritya sakalam bhadramashnute | shriya ca bhadraya jushto yastam bhadram
    namamyaham || 8|| sakshatsvakale sampraptam mrityum shatrugananapi | bhaktanam nashayedyastu mrityumrityum
    namamyaham || 9|| namaskaratmakam yasmai vidhayatmanivedanam | tyaktaduhkho'khilan kamanashnute tam
    namamyaham || 10|| dasabhutah svatah sarve hyatmanah paramatmanah | ato'hamapi te dasa iti matva namamyaham
    || 11|| phalashrutih | shankarenadaratproktam padanam tattvamuttamam | trisandhyam yah pathettasya
    shrirvidya''yushca vardhate || 12|| iti shrinarasimhamantrarajapadastotram sampurnam |
  devanagari: वृत्तोत्फुल्लविशालाक्षं विपक्षक्षयदीक्षितम् । निनादत्रस्तविश्वाण्डं विष्णुमुग्रं नमाम्यहम्
    ॥ १॥ सर्वैरवध्यतां प्राप्तं सफलौघं दितेः सुतम् । नखाग्रैः शकलीचक्रे यस्तं वीरं नमाम्यहम् ॥ २॥ पादावष्टब्धपातालं
    मूर्धाऽऽविष्टत्रिविष्टपम् । भुजप्रविष्टाष्टदिशं महाविष्णुं नमाम्यहम् ॥ ३॥ ज्योतींष्यर्केन्दुनक्षत्रज्वलनादीन्यनुक्रमात्
    । ज्वलन्ति तेजसा यस्य तं ज्वलन्तं नमाम्यहम् ॥ ४॥ सर्वेन्द्रियैरपि विना सर्वं सर्वत्र सर्वदा । जानाति
    यो नमाम्याद्यं तमहं सर्वतोमुखम् ॥ ५॥ नरवत्सिंहवच्चैव रूपं यस्य महात्मनः । महासटं महादंष्ट्रं तं नृसिंहं
    नमाम्यहम् ॥ ६॥ यन्नामस्मरणाद्भीताः भूतवेतालराक्षसाः । रोगाद्याश्च प्रणश्यन्ति भीषणं तं नमाम्यहम् ॥
    ७॥ सर्वोऽपि यं समाश्रित्य सकलं भद्रमश्नुते । श्रिया च भद्रया जुष्टो यस्तं भद्रं नमाम्यहम् ॥ ८॥ साक्षात्स्वकाले
    सम्प्राप्तं मृत्युं शत्रुगणानपि । भक्तानां नाशयेद्यस्तु मृत्युमृत्युं नमाम्यहम् ॥ ९॥ नमस्कारात्मकं
    यस्मै विधायात्मनिवेदनम् । त्यक्तदुःखोऽखिलान् कामानश्नुते तं नमाम्यहम् ॥ १०॥ दासभूताः स्वतः सर्वे ह्यात्मानः
    परमात्मनः । अतोऽहमपि ते दास इति मत्वा नमाम्यहम् ॥ ११॥ फलश्रुतिः । शङ्करेणादरात्प्रोक्तं पदानां तत्त्वमुत्तमम्
    । त्रिसन्ध्यं यः पठेत्तस्य श्रीर्विद्याऽऽयुश्च वर्धते ॥ १२॥ इति श्रीनरसिंहमन्त्रराजपदस्तोत्रं सम्पूर्णम्
    ।
