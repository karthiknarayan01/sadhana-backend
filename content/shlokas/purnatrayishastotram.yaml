id: purnatrayishastotram
category: stotram
name:
  english: purnatrayishastotram
  devanagari: पूर्णत्रयीशस्तोत्रम्
content:
  english: mityuktvagatya yasmadavadadamumasau patu purnatrayishah || 87|| shrutva kamsam hatam tam rathakariharibhih
    pattisanghairjaraya atrayam magadhakhyo yadupuramagamat kamsahantra niyoddhum | kritva yuddham sa
    ramannihatanijabalo bandhitah krishnamukto duhkharto'gattadanim suragananuditah patu purnatrayishah
    || 88|| ittham tvakshohinibhirdasha ca punarasau saptavaram ca yuddhva bhagno bhutvatha yatastadanu
    yavanapah sviyasainyairniruddhah | tatkale dvarakayam nijajanamanayadyogamayaprabhavat tadrakshayai
    balam cagamayadatha harih patu purnatrayishah || 89|| purya nishkrantamenam sa tu yavanavarah pradravannidritam
    tam adrerantarguhaya nripatimatha padahatya taddrishtidagdhah | bhasmibhutastadanim yadupatiragamattatpurastat
    sa drishtva natva samprapya ceshtam tapasi kritamanah prapayadrim nripendrah || 90|| pratyavrityatha
    rajyam yavanaganavritam samharan mlecchasanghan hritva dravyam prayatau yaduvaratanayo margamadhye
    sa drishtva | akshohinya vritastau drutataramagamaccelaturduraduram padabhyam parvatagram harivarasadrishau
    prapatu ramakrishnau || 91|| so'pyavritya svasainyai rgirivaramabhitastavadrishtva krishanum dattva
    sadyo girindram tvadahadatha javadramakrishnau girindrat | tasmaccadho nipatya svapuramagamatam simhashardulavegau
    niryato magadho'sau nijapuramatha tau yadavendravadrishtva || 12|| anarto raivatakhyo nijavaratanayam
    revatim dattavamstam ramayatho sa krishno dvijavaravacanat kundinam prapa sadyah | hritvasau rukminim
    tam yaduvaratanayashcaidyarajaya klriptam bhupanam pashyatam tadrathavaramagamat patu purnatrayishah
    || 93|| rajanah krodhayukta drutataramagaman yoddhumavritya sainyaih virah samprapurete yadubalapatayah
    sampracukrurmrigham taih | krishnashcapam vidhunvamstvarishu bahusharan prairayatte'pi bhagnah yatashcaidyam
    nimagnam vyasanajalanidhau santvayamasurenam || 94|| rukmi kopadrathastho harimavadadasau cora kim
    yasi hritva kanyamenam visrijya vraja yadi tu na cettvam nihanyam sharaughaih | ityuktva bhallabananamucadatha
    harirbanavarshai ratham tam chittva keshamshca capam vyasrijadamumasau mundayan ramavakyat || 95||
    vadyanudghushya carat puramagamadasau brahmanairbandhuvargaih matra pitra ca rajna nijasahajavarenashu
    sangamya puryam | rukminyah panipadmam parinayavidhina tadgrihitva hasan yo bheje modam nitantam smitavadana
    imam patu purnatrayishah || 96|| pradyumnam cambudhau tam vyasrijadatha rusha shambarastvagrasittam
    matsyah kaivartasangha daduratha jhashamasmai punah so'pi tasyai | mayavatyai tadantahsthitamamumatha
    sarakshadarabdhakama jnatartham yauvane tam yaduvaratanayam cakarot kamapatni || 97|| shrutva panyah
    sakashannijaripumasuram shambaram yudhyamanam khadgenapaharattadgalamatha nijaya bharyaya niyamanah
    | gatva sviyagriham nitantamahitam matra ca pitra svakaih devakyanakadundubhiprabhritibhih samlalyamano'vasat
    || 98|| satrajittvekakale manivaramanujo dharayan kananantam yato jagraha ratnam tvavadaditi haristacchrutam
    shaurinatha | tanmarshtum sviyasanghairvanamavishadasau simhashagnam prasenam simham carkshena bhagnam
    bilamavishadavasthapya bandhuna nishamya || 99|| tam drishtva bhallarajastvagamadavinayadyoddhumasicca
    yuddham tvashtavimshaddinantam tvanavaratamatho tannishamya svanatham | dattvasau sviyakanyam manivaramapi
    tau jambavan preshya pashcat modam bheje haristau yuvatimanivarau patu purnatrayishah || 100|| labdhva
    striratnavaryam manivaramapi samprapya rajnah sabham tam nitva satrajitam tam sa manivaramadan pashyatam
    cadavanam | satrajit sviyakanyam manivaramapi tadroshashantyai dadau tat ratnam no satyabhamamabhajata
    sa harih patu purnatrayishah || 101|| shrikrishne hastinakhyam gatavati ca puram prapya sambhajitam
    tam hatva sangrihma ratnam shatadhanuragamattatsuta satyabhama | drishtva vrittam svatatam kurupuramagamat
    sviyanathaya coce shrutva tadramakrishnau nijapuramanusamprapatuh syandanena || 102|| jnatvayantam
    ca krishnam tadanu sakritavarmanvitakrurametya drakr~ sahayye nirashah shatadhanuratha tadratnamakrurasamjne
    | nikshipyagaduducim harivaramadhiruhyatha ramena krishno gatva tam duraduram hariramumakarot krittakantham
    svacakrat || 103|| krishno ratnam vimrishyalabhata na tu yadagat purim dvarakakhyam uktva bharyasuhridbhih
    saha nijagurave cordhvakrityam vidhaya | anayyakrurasamjnam manimatha suhridam darshayitva nivritya
    svasmimllokoktidosham mudamagamadamum patu purnatrayishah || 104|| indraprastham sa gatva vijayasakhayutah
    suryaputritatante kalindim tatra drishtva rathavaramadhiropyayayau dvarakam tam | tamudvahyatha tata
    svasrivaratanayam mitravindamavanti
  devanagari: मित्युक्त्वागत्य यस्मादवददमुमसौ पातु पूर्णत्रयीशः ॥ ८७॥ श्रुत्वा कंसं हतं तं रथकरिहरिभिः
    पत्तिसङ्घैर्जराया अत्रायं मागधाख्यो यदुपुरमगमत् कंसहन्त्रा नियोद्धुम् । कृत्वा युद्धं स रामान्निहतनिजबलो
    बन्धितः कृष्णमुक्तो दुःखार्तोऽगात्तदानीं सुरगणनुदितः पातु पूर्णत्रयीशः ॥ ८८॥ इत्थं त्वक्षोहिणीभिर्दश
    च पुनरसौ सप्तवारं च युद्ध्वा भग्नो भूत्वाथ यातस्तदनु यवनपः स्वीयसैन्यैर्निरुद्धः । तत्काले द्वारकायां
    निजजनमनयद्योगमायाप्रभावात् तद्रक्षायै बलं चागमयदथ हरिः पातु पूर्णत्रयीशः ॥ ८९॥ पुर्या निष्क्रान्तमेनं
    स तु यवनवरः प्राद्रवन्निद्रितं तं अद्रेरन्तर्गुहाया नृपतिमथ पदाहत्य तद्दृष्टिदग्धः । भस्मीभूतस्तदानीं
    यदुपतिरगमत्तत्पुरस्तात् स दृष्ट्वा नत्वा सम्प्राप्य चेष्टं तपसि कृतमनाः प्रापयाद्रिं नृपेन्द्रः ॥
    ९०॥ प्रत्यावृत्याथ राज्यं यवनगणवृतं संहरन् म्लेच्छसङ्घान् हृत्वा द्रव्यं प्रयातौ यदुवरतनयो मार्गमध्ये
    स दृष्ट्वा । अक्षोहिण्या वृतस्तौ द्रुततरमगमच्चेलतुर्दूरदूरं पादाभ्यां पर्वताग्रं हरिवरसदृशौ प्रापतू
    रामकृष्णौ ॥ ९१॥ सोऽप्यावृत्य स्वसैन्यै र्गिरिवरमभितस्तावदृष्ट्वा कृशानुं दत्त्वा सद्यो गिरीन्द्रं
    त्वदहदथ जवाद्रामकृष्णौ गिरीन्द्रात् । तस्माच्चाधो निपत्य स्वपुरमगमतां सिंहशार्दूलवेगौ निर्यातो मागधोऽसौ
    निजपुरमथ तौ यादवेन्द्रावदृष्ट्वा ॥ १२॥ आनर्तो रैवताख्यो निजवरतनयां रेवतीं दत्तवांस्तां रामायाथो स
    कृष्णो द्विजवरवचनात् कुन्डिनं प्राप सद्यः । हृत्वासौ रुक्मिणीं तां यदुवरतनयश्चैद्यराजाय क्लृप्तां
    भूपानां पश्यतां तद्रथवरमगमत् पातु पूर्णत्रयीशः ॥ ९३॥ राजानः क्रोधयुक्ता द्रुततरमगमन् योद्धुमावृत्य
    सैन्यैः वीराः सम्प्रापुरेते यदुबलपतयः सम्प्रचुक्रुर्मृघं तैः । कृष्णश्चापं विधून्वंस्त्वरिषु बहुशरान्
    प्रैरयत्तेऽपि भग्नाः याताश्चैद्यं निमग्नं व्यसनजलनिधौ सान्त्वयामासुरेनम् ॥ ९४॥ रुक्मी कोपाद्रथस्थो
    हरिमवददसौ चोर किं यासि हृत्वा कन्यामेनां विसृज्य व्रज यदि तु न चेत्त्वां निहन्यां शरौघैः । इत्युक्त्वा
    भल्लबाणानमुचदथ हरिर्बाणवर्षै रथं तं छित्त्वा केशांश्च चापं व्यसृजदमुमसौ मुन्डयन् रामवाक्यात् ॥ ९५॥
    वाद्यानुद्घुष्य चारात् पुरमगमदसौ ब्राह्मणैर्बन्धुवर्गैः मात्रा पित्रा च राज्ञा निजसहजवरेणाशु सङ्गम्य
    पुर्याम् । रुक्मिण्याः पाणिपद्मं परिणयविधिना तद्गृहीत्वा हसन् यो भेजे मोदं नितान्तं स्मितवदन इमं पातु
    पूर्णत्रयीशः ॥ ९६॥ प्रद्युम्नं चाम्बुधौ तं व्यसृजदथ रुषा शम्बरस्त्वग्रसीत्तं मत्स्यः कैवर्तसङ्घा ददुरथ
    झषमस्मै पुनः सोऽपि तस्यै । मायावत्यै तदन्तःस्थितममुमथ सारक्षदारब्धकामा ज्ञातार्थं यौवने तं यदुवरतनयं
    चाकरोत् कामपत्नी ॥ ९७॥ श्रुत्वा पन्याः सकाशान्निजरिपुमसुरं शम्बरं युध्यमानं खड्गेनापाहरत्तद्गलमथ निजया
    भार्यया नीयमानः । गत्वा स्वीयगृहं नितान्तमहितं मात्रा च पित्रा स्वकैः देवक्यानकदुन्दुभिप्रभृतिभिः
    संलाल्यमानोऽवसत् ॥ ९८॥ सत्राजित्त्वेककाले मणिवरमनुजो धारयन् काननान्तं यातो जग्राह रत्नं त्ववददिति
    हरिस्तच्छ्रुतं शौरिणाथ । तन्मार्ष्टुं स्वीयसङ्घैर्वनमविशदसौ सिंहशग्नं प्रसेनं सिंहं चर्क्षेण भग्नं
    बिलमविशदवस्थाप्य बन्धून निशाम्य ॥ ९९॥ तं दृष्ट्वा भल्लराजस्त्वगमदविनयाद्योद्धुमासीच्च युद्धं त्वष्टाविंशद्दिनान्तं
    त्वनवरतमथो तन्निशाम्य स्वनाथम् । दत्त्वासौ स्वीयकन्यां मणिवरमपि तौ जाम्बवान् प्रेष्य पश्चात् मोदं
    भेजे हरिस्तौ युवतिमणिवरौ पातु पूर्णत्रयीशः ॥ १००॥ लब्ध्वा स्त्रीरत्नवर्यं मणिवरमपि सम्प्राप्य राज्ञः
    सभां तां नीत्वा सत्राजितं तं स मणिवरमदान् पश्यतां चादवानाम् । सत्राजित् स्वीयकन्यां मणिवरमपि तद्रोषशान्त्यै
    ददौ तत् रत्नं नो सत्यभामामभजत स हरिः पातु पूर्णत्रयीशः ॥ १०१॥ श्रीकृष्णे हस्तिनाख्यं गतवति च पुरं
    प्राप्य सम्भाजितं तं हत्वा सङ्गृह्म रत्नं शतधनुरगमत्तत्सुता सत्यभामा । दृष्ट्वा वृत्तं स्वतातं कुरुपुरमगमत्
    स्वीयनाथाय चोचे श्रुत्वा तद्रामकृष्णौ निजपुरमनुसम्प्रापतुः स्यन्दनेन ॥ १०२॥ ज्ञात्वायान्तं च कृष्णं
    तदनु सकृतवर्मान्विताक्रूरमेत्य द्राक्र्ँ साहाय्ये निराशः शतधनुरथ तद्रत्नमक्रूरसंज्ञे । निक्षिप्यागादुदूचीं
    हरिवरमधिरुह्याथ रामेण कृष्णो गत्वा तं दूरदूरं हरिरमुमकरोत् कृत्तकण्ठं स्वचक्रात् ॥ १०३॥ कृष्णो रत्नं
    विमृश्यालभत न तु यदागात् पुरीं द्वारकाख्यां उक्त्वा भार्यासुहृद्भिः सह निजगुरवे चोर्ध्वकृत्यं विधाय
    । आनाय्याक्रूरसंज्ञं मणिमथ सुहृदां दर्शयित्वा निवृत्य स्वस्मिंल्लोकोक्तिदोषं मुदमगमदमुं पातु पूर्णत्रयीशः
    ॥ १०४॥ इन्द्रप्रस्थं स गत्वा विजयसखयुतः सूर्यपुत्रीतटान्ते कालिन्दीं तत्र दृष्ट्वा रथवरमधिरोप्याययौ
    द्वारकां ताम् । तामुद्वाह्याथ तात स्वसृवरतनयां मित्रविन्दामवन्ती
