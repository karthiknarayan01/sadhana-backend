id: brahmadevaproktamshivastotram
category: stotram
name:
  english: brahmadevaproktamshivastotram
  devanagari: ब्रह्मदेवप्रोक्तंशिवस्तोत्रम्
content:
  english: brahmadevaproktam shivastotram sanatkumara uvaca | katham bhavaprasadena devadaruvanaukasah
    | prapannah sharanam devam vaktumarhasi me prabho || 1|| shailadiruvaca | tanuvaca mahabhaganbhagavanatmabhuh
    svayam | devadaruvanasthamstu tapasan pavakaprabhan || 2|| pitamaha uvaca | esha devo mahadevo vijneyastu
    maheshvarah | na tasmatparamam kincitpadam samadhigamyate || 3|| devanam ca rishinam ca pitrinam caiva
    sa prabhuh | sahasrayugaparyante pralaye sarvadehinah || 4|| samharatyesha bhagavan kalo bhutva maheshvarah
    | esha caiva prajah sarvah srijatyekah svatejasa || 5|| esha cakri ca vajri ca shrivatsakritalakshanah
    | yogi kritayuge caiva tretayam kraturucyate || 6|| dvapare caiva kalagnirdhamaketuh kalau smritah
    | rudrasya murtayastveta ye'bhidhyayanti panditah || 7|| caturasram bahishcantarashtasram pindikashraye
    | vrittam sudarshanam yogyamevam lingam prapujayet || 8|| tamo hyagni rajo brahma sattvam vishnuh
    prakashakam | murtireka sthita casya murtayah parikirtitah || 9|| yatra tishthati tadbrahma yogena
    tu samanvitam | tasmaddhi devadeveshamishanam prabhumavyayam || 10|| aradhayanti viprendra jitakrodha
    jitondriyah | lingam kritva yathanyayam sarvalakshanasamyutam || 11|| angushthamatram sushubham suvrittam
    sarvasammatam | samanabham tathashtasram shodashasramathapi va || 12|| suvrittam mandalam divyam sarvakamaphalapradam
    | vedika dviguna tasya sama va sarvasammata || 13|| gomukhi ca tribhagaika vedya lakshanasayuta |
    pattika ca samantadvai yavamatra dvijottamah || 14|| sauvarnam rajatam shailam kritva tamramayam tatha
    | vedikayashca vistaram trigunam vai samantatah || 15|| vartulam caturasram va shadasram va trirasrakam
    | samantannirvranam shubhram lakshanaistatsulakshitam || 16|| iti shrilingamahapurane purvabhage ekatrimshadhyayantargatam
    brahmadevaproktam shivastotram samaptam | lingapurana | purvabhaga | adhyaya 32
  devanagari: ब्रह्मदेवप्रोक्तं शिवस्तोत्रम् सनत्कुमार उवाच । कथं भवप्रसादेन देवदारुवनौकसः । प्रपन्नाः
    शरणं देवं वक्तुमर्हसि मे प्रभो ॥ १॥ शैलादिरुवाच । तानुवाच महाभागान्भगवानात्मभूः स्वयम् । देवदारुवनस्थांस्तु
    तपसान् पावकप्रभान् ॥ २॥ पितामह उवाच । एष देवो महादेवो विज्ञेयस्तु महेश्वरः । न तस्मात्परमं किञ्चित्पदं
    समधिगम्यते ॥ ३॥ देवानां च ऋषीणां च पितॄणां चैव स प्रभुः । सहस्रयुगपर्यन्ते प्रलये सर्वदेहिनः ॥ ४॥
    संहरत्येष भगवान् कालो भूत्वा महेश्वरः । एष चैव प्रजाः सर्वाः सृजत्येकः स्वतेजसा ॥ ५॥ एष चक्री च वज्री
    च श्रीवत्सकृतलक्षणः । योगी कृतयुगे चैव त्रेतायां क्रतुरुच्यते ॥ ६॥ द्वापरे चैव कालाग्निर्धमकेतुः कलौ
    स्मृतः । रुद्रस्य मूर्तयस्त्वेता येऽभिध्यायन्ति पण्डिताः ॥ ७॥ चतुरस्रं बहिश्चान्तरष्टास्रं पिण्डिकाश्रये
    । वृत्तं सुदर्शनं योग्यमेवं लिङ्गं प्रपूजयेत् ॥ ८॥ तमो ह्यग्नी रजो ब्रह्मा सत्त्वं विष्णुः प्रकाशकम्
    । मूर्तिरेका स्थिता चास्य मूर्तयः परिकीर्तिताः ॥ ९॥ यत्र तिष्ठति तद्ब्रह्म योगेन तु समन्वितम् । तस्माद्धि
    देवदेवेशमीशानं प्रभुमव्ययम् ॥ १०॥ आराधयन्ति विप्रेन्द्रा जितक्रोधा जितोन्द्रियाः । लिङ्गं कृत्वा यथान्यायं
    सर्वलक्षणसंयुतम् ॥ ११॥ अङ्गुष्ठमात्रं सुशुभं सुवृत्तं सर्वसम्मतम् । समनाभं तथाष्टास्रं षोडशास्रमथापि
    वा ॥ १२॥ सुवृत्तं मण्डलं दिव्यं सर्वकामफलप्रदम् । वेदिका द्विगुणा तस्य समा वा सर्वसम्मता ॥ १३॥ गोमुखी
    च त्रिभागैका वेद्या लक्षणसयुता । पट्टिका च समन्ताद्वै यवमात्रा द्विजोत्तमाः ॥ १४॥ सौवर्णं राजतं शैलं
    कृत्वा ताम्रमयं तथा । वेदिकायाश्च विस्तारं त्रिगुणं वै समन्ततः ॥ १५॥ वर्तुलं चतुरस्रं वा षडस्रं वा
    त्रिरस्रकम् । समन्तान्निर्व्रणं शुभ्रं लक्षणैस्तत्सुलक्षितम् ॥ १६॥ इति श्रीलिङ्गमहापुराणे पूर्वभागे
    एकत्रिंशाध्यायान्तर्गतं ब्रह्मदेवप्रोक्तं शिवस्तोत्रं समाप्तम् । लिङ्गपुराण । पूर्वभाग । अध्याय ३२
