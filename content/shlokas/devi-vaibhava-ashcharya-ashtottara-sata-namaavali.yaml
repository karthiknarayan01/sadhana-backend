id: devi-vaibhava-ashcharya-ashtottara-sata-namaavali
category: stotram
name:
  english: Devi Vaibhava Ashcharya Ashtottara Sata Namaavali
content:
  english: om paramanandalaharyai namah | om paracaitanyadipikayai namah | om svayamprakashakiranayai
    namah | om nityavaibhavashalinyai namah | om vishuddhakevalakhandasatyakalatmarupinyai namah | om
    adimadhyantarahitayai namah | om mahamayavilasinyai namah | om gunatrayaparicchetryai namah | om sarvatattvaprakashinyai
    namah | om stripumsabhavarasikayai namah | | om jagatsargadilampatayai namah | om asheshanamarupadibhedacchedaraviprabhayai
    namah | om anadivasanarupayai namah | om vasanodyatprapancikayai namah | om prapancopashamapraudhayai
    namah | om caracarajaganmayyai namah | om samastajagadadharayai namah | om sarvasanjivanotsukayai
    namah | om bhaktacetomayanantasvarthavaibhavavibhramayai namah | om sarvakarshanavashyadisarvakarmadhurandharayai
    namah | | om vijnanaparamanandavidyayai namah | om santanasiddhidayai namah | om ayurarogyasaubhagyabalashrikirtibhagyadayai
    namah | om dhanadhanyamanivastrabhushalepanamalyadayai namah | om grihagramamaharajyasamrajyasukhadayinyai
    namah | om saptangashaktisampurnasarvabhaumaphalapradayai namah | om brahmavishnushivendradipadavishrananakshamayai
    namah | om bhuktimuktimahabhaktiviraktyadvaitadayinyai namah | om nigrahanugrahadhyakshayai namah
    | om jnananirdvaitadayinyai namah | om parakayapraveshadiyogasiddhipradayinyai namah | | om shishtasanjivanapraudhayai
    namah | om dushtasamharasiddhidayai namah | om lilavinirmitanekakotibrahmandamandalayai namah | om
    ekasyai namah | om anekatmikayai namah | om nanarupinyai namah | om ardhanganeshvaryai namah | om
    shivashaktimayyai namah | om nityashringaraikarasapriyayai namah | | om tushtayai namah | om pushtayai
    namah | om aparicchinnayai namah | om nityayauvanamohinyai namah | om samastadevatarupayai namah |
    om sarvadevadhidevatayai namah | om devarshipitrisiddhadiyoginibhairavatmikayai namah | om nidhisiddhimanimudrayai
    namah | om shastrastrayudhabhasurayai namah | om chatracamaravaditrapatakavyajanancitayai namah |
    | om hastyashvarathapadatamatyasenasusevitayai namah | om purohitakulacaryagurushishyadisevitayai
    namah | om sudhasamudramadhyodyatsuradrumanivasinyai namah | om manidvipantaraprodyatkadambavanavasinyai
    namah | om cintamanigrihantahsthayai namah | om manimantapamadhyagayai namah | om ratnasimhasanaprodyacchivamancadhishayinyai
    namah | om sadashivamahalingamulasanghattayonikayai namah | om anyonyalingasangharshakandusankshubdhamanasayai
    namah | om kalodyadbindukalinyaturyanadaparamparayai namah | | om nadantanandasandohasvayamvyaktavaco'mritayai
    namah | om kamarajamahatantrarahasyacaradakshinayai namah | om makarapancakodbhutapraudhantollasasundaryai
    namah | om shricakrarajanilayayai namah | om shrividyamantravigrahayai namah | om akhandasaccidanandashivashaktaikyarupinyai
    namah | om tripurayai namah | om tripureshanyai namah | om mahatripurasundaryai namah | om tripuravasarasikayai
    namah | | om tripurashrisvarupinyai namah | om mahapadmavanantasthayai namah | om shrimattripuramalinyai
    namah | om mahatripurasiddhambayai namah | om shrimahatripurambikayai namah | om navacakrakramadevyai
    namah | om mahatripurabhairavyai namah | om shrimatre namah | om lalitayai namah | om balayai namah
    | | om rajarajeshvaryai namah | om shivayai namah | om utpattisthitisamharakramacakranivasinyai namah
    | om ardhamervatmacakrasthayai namah | om sarvalokamaheshvaryai namah | om valmikapuramadhyasthayai
    namah | om jambuvananivasinyai namah | om arunacalashringasthayai namah | om vyaghralayanivasinyai
    namah | om shrikalahastinilayayai namah | | om kashipuranivasinyai namah | om shrimatkailasanilayayai
    namah | om dvadashantamaheshvaryai namah | om shrishodashantamadhyasthayai namah | om sarvavedantalakshitayai
    namah | om shrutismritipuranetihasagamakaleshvaryai namah | om bhutabhautikatanmatradevatapranahrinmayyai
    namah | om jiveshvarabrahmarupayai namah | om shrigunadhyayai namah | om gunatmikayai namah | | om
    avasthatrayanirmuktayai namah | om vagramomamahimayyai namah | om gayatribhuvaneshanidurgakalyadirupinyai
    namah | om matsyakurmavarahadinanarupavilasinyai namah | om mahayogishvararadhyayai namah | om mahaviravarapradayai
    namah | om siddheshvarakularadhyayai namah | om shrimaccaranavaibhavayai namah | iti devivaibhavashcaryashtottarashatanamavalih
    |
  devanagari: ॐ परमानन्दलहर्यै नमः । ॐ परचैतन्यदीपिकायै नमः । ॐ स्वयम्प्रकाशकिरणायै नमः । ॐ नित्यवैभवशालिन्यै
    नमः । ॐ विशुद्धकेवलाखण्डसत्यकालात्मरूपिण्यै नमः । ॐ आदिमध्यान्तरहितायै नमः । ॐ महामायाविलासिन्यै नमः
    । ॐ गुणत्रयपरिच्छेत्र्यै नमः । ॐ सर्वतत्त्वप्रकाशिन्यै नमः । ॐ स्त्रीपुंसभावरसिकायै नमः । । ॐ जगत्सर्गादिलम्पटायै
    नमः । ॐ अशेषनामरूपादिभेदच्छेदरविप्रभायै नमः । ॐ अनादिवासनारूपायै नमः । ॐ वासनोद्यत्प्रपञ्चिकायै नमः
    । ॐ प्रपञ्चोपशमप्रौढायै नमः । ॐ चराचरजगन्मय्यै नमः । ॐ समस्तजगदाधारायै नमः । ॐ सर्वसञ्जीवनोत्सुकायै
    नमः । ॐ भक्तचेतोमयानन्तस्वार्थवैभवविभ्रमायै नमः । ॐ सर्वाकर्षणवश्यादिसर्वकर्मधुरन्धरायै नमः । । ॐ
    विज्ञानपरमानन्दविद्यायै नमः । ॐ सन्तानसिद्धिदायै नमः । ॐ आयुरारोग्यसौभाग्यबलश्रीकीर्तिभाग्यदायै नमः
    । ॐ धनधान्यमणीवस्त्रभूषालेपनमाल्यदायै नमः । ॐ गृहग्राममहाराज्यसाम्राज्यसुखदायिन्यै नमः । ॐ सप्ताङ्गशक्तिसम्पूर्णसार्वभौमफलप्रदायै
    नमः । ॐ ब्रह्मविष्णुशिवेन्द्रादिपदविश्राणनक्षमायै नमः । ॐ भुक्तिमुक्तिमहाभक्तिविरक्त्यद्वैतदायिन्यै
    नमः । ॐ निग्रहानुग्रहाध्यक्षायै नमः । ॐ ज्ञाननिर्द्वैतदायिन्यै नमः । ॐ परकायप्रवेशादियोगसिद्धिप्रदायिन्यै
    नमः । । ॐ शिष्टसञ्जीवनप्रौढायै नमः । ॐ दुष्टसंहारसिद्धिदायै नमः । ॐ लीलाविनिर्मितानेककोटिब्रह्माण्डमण्डलायै
    नमः । ॐ एकस्यै नमः । ॐ अनेकात्मिकायै नमः । ॐ नानारूपिण्यै नमः । ॐ अर्धाङ्गनेश्वर्यै नमः । ॐ शिवशक्तिमय्यै
    नमः । ॐ नित्यशृङ्गारैकरसप्रियायै नमः । । ॐ तुष्टायै नमः । ॐ पुष्टायै नमः । ॐ अपरिच्छिन्नायै नमः ।
    ॐ नित्ययौवनमोहिन्यै नमः । ॐ समस्तदेवतारूपायै नमः । ॐ सर्वदेवाधिदेवतायै नमः । ॐ देवर्षिपितृसिद्धादियोगिनीभैरवात्मिकायै
    नमः । ॐ निधिसिद्धिमणीमुद्रायै नमः । ॐ शस्त्रास्त्रायुधभासुरायै नमः । ॐ छत्रचामरवादित्रपताकाव्यजनाञ्चितायै
    नमः । । ॐ हस्त्यश्वरथपादातामात्यसेनासुसेवितायै नमः । ॐ पुरोहितकुलाचार्यगुरुशिष्यादिसेवितायै नमः ।
    ॐ सुधासमुद्रमध्योद्यत्सुरद्रुमनिवासिन्यै नमः । ॐ मणिद्वीपान्तरप्रोद्यत्कदम्बवनवासिन्यै नमः । ॐ चिन्तामणिगृहान्तःस्थायै
    नमः । ॐ मणिमण्टपमध्यगायै नमः । ॐ रत्नसिंहासनप्रोद्यच्छिवमञ्चाधिशायिन्यै नमः । ॐ सदाशिवमहालिङ्गमूलसङ्घट्टयोनिकायै
    नमः । ॐ अन्योन्यालिङ्गसङ्घर्षकण्डूसङ्क्षुब्धमानसायै नमः । ॐ कलोद्यद्बिन्दुकालिन्यातुर्यनादपरम्परायै
    नमः । । ॐ नादान्तानन्दसन्दोहस्वयंव्यक्तवचोऽमृतायै नमः । ॐ कामराजमहातन्त्ररहस्याचारदक्षिणायै नमः ।
    ॐ मकारपञ्चकोद्भूतप्रौढान्तोल्लाससुन्दर्यै नमः । ॐ श्रीचक्रराजनिलयायै नमः । ॐ श्रीविद्यामन्त्रविग्रहायै
    नमः । ॐ अखण्डसच्चिदानन्दशिवशक्तैक्यरूपिण्यै नमः । ॐ त्रिपुरायै नमः । ॐ त्रिपुरेशान्यै नमः । ॐ महात्रिपुरसुन्दर्यै
    नमः । ॐ त्रिपुरावासरसिकायै नमः । । ॐ त्रिपुराश्रीस्वरूपिण्यै नमः । ॐ महापद्मवनान्तस्थायै नमः । ॐ श्रीमत्त्रिपुरमालिन्यै
    नमः । ॐ महात्रिपुरसिद्धाम्बायै नमः । ॐ श्रीमहात्रिपुराम्बिकायै नमः । ॐ नवचक्रक्रमादेव्यै नमः । ॐ महात्रिपुरभैरव्यै
    नमः । ॐ श्रीमात्रे नमः । ॐ ललितायै नमः । ॐ बालायै नमः । । ॐ राजराजेश्वर्यै नमः । ॐ शिवायै नमः । ॐ
    उत्पत्तिस्थितिसंहारक्रमचक्रनिवासिन्यै नमः । ॐ अर्धमेर्वात्मचक्रस्थायै नमः । ॐ सर्वलोकमहेश्वर्यै नमः
    । ॐ वल्मीकपुरमध्यस्थायै नमः । ॐ जम्बूवननिवासिन्यै नमः । ॐ अरुणाचलशृङ्गस्थायै नमः । ॐ व्याघ्रालयनिवासिन्यै
    नमः । ॐ श्रीकालहस्तिनिलयायै नमः । । ॐ काशीपुरनिवासिन्यै नमः । ॐ श्रीमत्कैलासनिलयायै नमः । ॐ द्वादशान्तमहेश्वर्यै
    नमः । ॐ श्रीषोडशान्तमध्यस्थायै नमः । ॐ सर्ववेदान्तलक्षितायै नमः । ॐ श्रुतिस्मृतिपुराणेतिहासागमकलेश्वर्यै
    नमः । ॐ भूतभौतिकतन्मात्रदेवताप्राणहृन्मय्यै नमः । ॐ जीवेश्वरब्रह्मरूपायै नमः । ॐ श्रीगुणाढ्यायै नमः
    । ॐ गुणात्मिकायै नमः । । ॐ अवस्थात्रयनिर्मुक्तायै नमः । ॐ वाग्रमोमामहीमय्यै नमः । ॐ गायत्रीभुवनेशानीदुर्गाकाल्यादिरूपिण्यै
    नमः । ॐ मत्स्यकूर्मवराहादिनानारूपविलासिन्यै नमः । ॐ महायोगीश्वराराध्यायै नमः । ॐ महावीरवरप्रदायै नमः
    । ॐ सिद्धेश्वरकुलाराध्यायै नमः । ॐ श्रीमच्चरणवैभवायै नमः । इति देवीवैभवाश्चर्याष्टोत्तरशतनामावलिः
    ।
