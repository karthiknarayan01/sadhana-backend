id: shabarikavacam
category: kavacha
name:
  english: shabarikavacam
  devanagari: शाबरीकवचम्
content:
  english: sarvarishtanashakam shabarikavacam om mahashabari shakti paramatmane namah | om shriguru paramatmane
    namah | om shrinavanatha paramatmane namah | om shabari pancadashi yantra paramatmane namah | atha
    dhyanam | om namo bhagavate shrivirabhadraya | virupakshi lam nikumbhini shodashi apacarini | varuthini
    mamsacarvini | cem cem cem camalavarayai | dhanam dhanam kampa kampa aveshaya | trilokavarti lokadayai
    | sahasrakotidevan akarshaya akarshaya | navakotigandharvan akarshaya akarshaya | hamsah hamsah so'ham
    so'ham sarvam raksha mam raksha bhutebhyo raksha | grahebhyo raksha | pishacebhyo raksha | shakinito
    raksha | dakinito raksha | apratyakshapratyaksharishtebhyo raksha raksha | mahashaktim raksha | kavacashaktim
    raksha | raksha ojavala | guruvala | om prasaha hanumanta raksha | shrimannathagurutrayam ganapatim
    pithatrayam bhairavam || siddhadhyam batukatrayam padayugam dyutikramam mandalam || vairatashtacatushtayam
    ca navakam vairavali pancakam | shrimanmalinimantrarajasahitam vande gurormandalam | iti dhyanam ||
    atha prarthana | om hram hrim hrrim ksham kshim kshum | krishnakshetrapalaya namah agaccha agaccha
    | bali sarvagrahashamanam mama karyam kuru kuru svaha | om namo om hrim shrim klim aim cakreshvari
    | shankhacakragadapadmadharini | mama vanchita siddhim kuru kuru svaha | om namo kamalavadanamohini
    sarvajanavashakarini sakshat sukshmasvarupini yanmama vashaga om surasura bhaveyuh svaha | gururbrahma
    gururvishnuh gururdevo maheshvarah | guruhsakshat parabrahma tasmai shrigurave namah || ajnanatimirandhasya
    jnananjanashalakaya | cakshurunmilitam yena tasmai shrigurave namah || arunakirana jalai ranjita shavakasha
    vidhritajapamala vitika pustahasta | itarakaravaradhya phullakalhara hasta nivasatu hridi bala nityakalyanashila
    || atha shabarikavacajape viniyogah || || shri || || atha shabarikavacapathaprarambhah || om sarvavighnanashaya
    | sarvarishtanivaranaya | sarvasaukhyapradaya | balanam buddhipradaya | nanaprakarakadhanavahanabhumipradaya
    | manovanchitaphalapradaya | raksham kuru kuru svaha | om gurave namah | om shrikrishnaya namah |
    om balabhadraya namah | om shriramaya namah | om hanumate namah | om shivaya namah | om jagannathaya
    namah | om badrinarayanaya namah | om durgadevyai namah | om suryaya namah | om candraya namah | om
    bhaumaya namah | om budhaya namah | om gurave namah | om bhrigave namah | om shanaishcaraya namah
    | om rahave namah | om pucchanayakaya namah | om navagraha raksham kuru kuru namah | om manye varam
    hariharadaya evam drishtva drishteshu hridayam tvayi toshameti | kim vikshitena bhavata bhuvi yena
    nanyah kashcit mano harati natha bhavanata ehi | om namah shrimanbalabhadrajayavijaya aparajita bhadram
    bhadram kuru kuru svaha | om bhurbhuvah svah tatsaviturvarenyam bhargo devasya dhimahi | dhiyo yo
    nah pracodayat || sarvavighnashantim kuru kuru svaha | om aim hrim klim shrim batukabhairavaya | apaduddharanaya
    | mahanamasyaya svarupaya | dirgharishtam vinashaya vinashaya | nanaprakarabhogapradaya | mama
  devanagari: सर्वारिष्टनाशकं शाबरीकवचम् ॐ महाशाबरी शक्ति परमात्मने नमः । ॐ श्रीगुरु परमात्मने नमः । ॐ
    श्रीनवनाथ परमात्मने नमः । ॐ शाबरी पञ्चदशी यन्त्र परमात्मने नमः । अथ ध्यानम् । ॐ नमो भगवते श्रीवीरभद्राय
    । विरूपाक्षी लं निकुम्भिनी षोडशी अपचारिणी । वरूथिनी मांसचर्विणी । चें चें चें चामलवरायै । धनं धनं
    कम्प कम्प आवेशय । त्रिलोकवर्ति लोकदायै । सहस्रकोटिदेवान् आकर्षय आकर्षय । नवकोटिगन्धर्वान् आकर्षय आकर्षय
    । हंसः हंसः सोऽहं सोऽहं सर्वं रक्ष मां रक्ष भूतेभ्यो रक्ष । ग्रहेभ्यो रक्ष । पिशाचेभ्यो रक्ष । शाकिनीतो
    रक्ष । डाकिनीतो रक्ष । अप्रत्यक्षप्रत्यक्षारिष्टेभ्यो रक्ष रक्ष । महाशक्तिं रक्ष । कवचशक्तिं रक्ष
    । रक्ष ओजवाल । गुरुवाल । ॐ प्रसह हनूमन्त रक्ष । श्रीमन्नाथगुरुत्रयं गणपतिं पीठत्रयं भैरवम् ॥ सिद्धाढ्यं
    बटुकत्रयं पदयुगं द्युतिक्रमं मण्डलम् ॥ वैराटाष्टचतुष्टयं च नवकं वैरावली पञ्चकम् । श्रीमन्मालिनीमन्त्रराजसहितं
    वन्दे गुरोर्मण्डलम् । इति ध्यानम् ॥ अथ प्रार्थना । ॐ ह्रां ह्रीं ह्रृं क्षां क्षीं क्षुं । कृष्णक्षेत्रपालाय
    नमः आगच्छ आगच्छ । बली सर्वग्रहशमनं मम कार्यं कुरु कुरु स्वाहा । ॐ नमो ॐ ह्रीं श्रीं क्लीं ऐं चक्रेश्वरी
    । शङ्खचक्रगदापद्मधारिणी । मम वाञ्छित सिद्धिं कुरु कुरु स्वाहा । ॐ नमो कमलवदनमोहिनी सर्वजनवशकारिणी
    साक्षात् सूक्ष्मस्वरूपिणी यन्मम वशगा ॐ सुरासुरा भवेयुः स्वाहा । गुरुर्ब्रह्मा गुरुर्विष्णुः गुरुर्देवो
    महेश्वरः । गुरुःसाक्षात् परब्रह्म तस्मै श्रीगुरवे नमः ॥ अज्ञानतिमिरान्धस्य ज्ञानाञ्जनशलाकया । चक्षुरुन्मीलितं
    येन तस्मै श्रीगुरवे नमः ॥ अरुणकिरण जालै रञ्जिता शावकाशा विधृतजपमाला वीटिका पुस्तहस्ता । इतरकरवराढ्या
    फुल्लकल्हार हस्ता निवसतु हृदि बाला नित्यकल्याणशीला ॥ अथ शाबरीकवचजपे विनियोगः ॥ ॥ श्री ॥ ॥ अथ शाबरीकवचपाठप्रारम्भः
    ॥ ॐ सर्वविघ्ननाशाय । सर्वारिष्टनिवारणाय । सर्वसौख्यप्रदाय । बालानां बुद्धिप्रदाय । नानाप्रकारकधनवाहनभूमिप्रदाय
    । मनोवाञ्छितफलप्रदाय । रक्षां कुरु कुरु स्वाहा । ॐ गुरवे नमः । ॐ श्रीकृष्णाय नमः । ॐ बलभद्राय नमः
    । ॐ श्रीरामाय नमः । ॐ हनुमते नमः । ॐ शिवाय नमः । ॐ जगन्नाथाय नमः । ॐ बद्रीनारायणाय नमः । ॐ दुर्गादेव्यै
    नमः । ॐ सूर्याय नमः । ॐ चन्द्राय नमः । ॐ भौमाय नमः । ॐ बुधाय नमः । ॐ गुरवे नमः । ॐ भृगवे नमः । ॐ शनैश्चराय
    नमः । ॐ राहवे नमः । ॐ पुच्छनायकाय नमः । ॐ नवग्रह रक्षां कुरु कुरु नमः । ॐ मन्ये वरं हरिहरादय एवं दृष्ट्वा
    दृष्टेषु हृदयं त्वयि तोषमेति । किं वीक्षितेन भवता भुवि येन नान्यः कश्चित् मनो हरति नाथ भवानत एहि ।
    ॐ नमः श्रीमन्बलभद्रजयविजय अपराजित भद्रं भद्रं कुरु कुरु स्वाहा । ॐ भूर्भुवः स्वः तत्सवितुर्वरेण्यं
    भर्गो देवस्य धीमहि । धियो यो नः प्रचोदयात् ॥ सर्वविघ्नशान्तिं कुरु कुरु स्वाहा । ॐ ऐं ह्रीं क्लीं
    श्रीं बटुकभैरवाय । आपदुद्धरणाय । महानमस्याय स्वरूपाय । दीर्घारिष्टं विनाशय विनाशय । नानाप्रकारभोगप्रदाय
    । मम
