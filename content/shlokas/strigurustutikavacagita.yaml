id: strigurustutikavacagita
category: kavacha
name:
  english: strigurustutikavacagita
  devanagari: स्त्रीगुरुस्तुतिकवचगीता
content:
  english: striguroh kavacasyasya sadashiva rishih smritah | tarakhya devata khyata caturvargaphalaprada
    || 1|| klim bijam cakshushormadhye sarvangam me sadavatu | aim bijam me mukham patu hrim jihvam parirakshatu
    || 2|| shrim bijam skandhadesham me hasakhaphrem bhujadvayam | hakarah kanthadesham me sakarah shodasham
    dalam || 3|| kshavarnastadadhah patu lakaro hridayam mama | vakarah prishthadeshanca rakaro dakshaparshvakam
    || 4|| yunkaro vamaparshvanca sakaro merumeva ca | hakaro me dakshabhujam kshakaro vamahastakam ||
    5|| makarashcangulim patu lakaro me nakham vatu | vakaro me nitambanca rakaro jatharam vatu || 6||
    shinkarah padayugalam hesauh sarvangam me'vatu | hesaurlinganca lomani keshanca parirakshatu || 7||
    aim bijam patu purve me hrim bijam dakshine'vatu | shrim bijam pashcime patu uttare bhutasambhavam
    || 8|| shrim patu cagnikone ca vedakhya nairrite'vatu | devamba patu vayavyam shambhau shripadukam
    tatha || 9|| pujayami tatha corddhvam namashcadhah sada'vatu | iti te kathitam kante
  devanagari: स्त्रीगुरोः कवचस्यास्य सदाशिव ऋषिः स्मृतः । ताराख्या देवता ख्याता चतुर्वर्गफलप्रदा ॥ १॥
    क्लीं बीजं चक्षुषोर्मध्ये सर्वाङ्गं मे सदावतु । ऐं बीजं मे मुखं पातु ह्रीं जिह्वां परिरक्षतु ॥ २॥
    श्रीं बीजं स्कन्धदेशं मे हसखफ्रें भुजद्वयम् । हकारः कण्ठदेशं मे सकारः षोडशं दलम् ॥ ३॥ क्षवर्णस्तदधः
    पातु लकारो हृदयं मम । वकारः पृष्ठदेशञ्च रकारो दक्षपार्श्वकम् ॥ ४॥ यूङ्कारो वामपार्श्वञ्च सकारो मेरुमेव
    च । हकारो मे दक्षभुजं क्षकारो वामहस्तकम् ॥ ५॥ मकारश्चाङ्गुलीं पातु लकारो मे नखं वतु । वकारो मे नितम्बञ्च
    रकारो जठरं वतु ॥ ६॥ षीङ्कारः पादयुगलं हेसौः सर्वाङ्गं मेऽवतु । हेसौर्लिङ्गञ्च लोमानि केशञ्च परिरक्षतु
    ॥ ७॥ ऐं बीजं पातु पूर्वे मे ह्रीं बीजं दक्षिणेऽवतु । श्रीं बीजं पश्चिमे पातु उत्तरे भूतसम्भवम् ॥ ८॥
    श्रीं पातु चाग्निकोणे च वेदाख्या नैरृतेऽवतु । देवाम्बा पातु वायव्यां शम्भौ श्रीपादुकां तथा ॥ ९॥ पूजयामि
    तथा चोर्द्ध्वं नमश्चाधः सदाऽवतु । इति ते कथितं कान्ते
