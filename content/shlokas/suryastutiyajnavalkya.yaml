id: suryastutiyajnavalkya
category: stotram
name:
  english: suryastutiyajnavalkya
  devanagari: सूर्यस्तुतियाज्ञवल्क्य
content:
  english: gilitam mritakamiva vicetanam avalokya anukampaya paramakarunikah ikshayaiva utthapya aharaharanusavanam
    shreyasi svadharmakhyatmavasthane pravartayati avanipatiriva asadhunam bhayamudirayannatati || 4||
    parita ashapalaih tatra tatra kamalakoshanjalibhih upahritarhanah || 5|| athaha bhagavan tava carananalinayugalam
    tribhuvanagurubhirvanditam aham ayatayamayajuhkamah upasaramiti || 6|| evam stutah sa bhagavan vajirupadharo
    harih | yajumshyayatayamani munaye'dat prasaditah || 7|| || iti shrimadbhagavate dvadashaskandhe shriyajnavalkyakritam
    shrisuryastotram sampurnam ||
  devanagari: गिलितं मृतकमिव विचेतनं अवलोक्य अनुकम्पया परमकारुणिकः ईक्षयैव उत्थाप्य अहरहरनुसवनं श्रेयसि
    स्वधर्माख्यात्मावस्थाने प्रवर्तयति अवनिपतिरिव असाधूनां भयमुदीरयन्नटति ॥ ४॥ परित आशापालैः तत्र तत्र
    कमलकोशाञ्जलिभिः उपहृतार्हणः ॥ ५॥ अथह भगवन् तव चरणनलिनयुगलं त्रिभुवनगुरुभिर्वन्दितं अहं अयातयामयजुःकामः
    उपसरामीति ॥ ६॥ एवं स्तुतः स भगवान् वाजिरूपधरो हरिः । यजूंष्ययातयामानि मुनयेऽदात् प्रसादितः ॥ ७॥ ॥
    इति श्रीमद्भागवते द्वादशस्कन्धे श्रीयाज्ञवल्क्यकृतं श्रीसूर्यस्तोत्रं सम्पूर्णम् ॥
meaning: {}
