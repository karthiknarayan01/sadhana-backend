id: andhakadhyatamshivashtottarashatanamastotram
category: stotram
name:
  english: andhakadhyatamshivashtottarashatanamastotram
  devanagari: अन्धकध्यातंशिवाष्टोत्तरशतनामस्तोत्रम्
content:
  english: andhakadhyatam shivashtottarashatanamastotram 4 dadarsha shule samshushkam dhyayantam parameshvarah
    | andhakam dhairyasampannam danavesham tapasvinam || 4|| andhaka uvaca | om mahadevo virupakshah candrarddhakritashekharah
    | amritah shashvatah sthanuh nilakanthah pinakadhrik || 5|| vrishabhaksho mahajneyah purushah sarvakamadah
    | kamarih kamadahanah kamarupah kapardadhrik || 6|| virupo girisho bhimah sragvi ca raktavasadhrik
    | yogi ca kaladahanah kapali tripurantakah || 7|| gudhavrato guptamantrah gambhiro bhavagocarah |
    animadigunadharastrailokyaishvaryadayakah || 8|| viro virahano ghorah virupo mamsalah patuh | mahamamsada
    unmattah bhairavo vai maheshvarah || 9|| trailokyadravano lubdhah lubdhako yajnasudanah | krittikanam
    sutairyukta unmattah krittivasadhrik || 10|| gajakrittiparidhanah kshubdho bhujagabhushanah | dattalambashca
    vetalah ghorashshakinipujitah || 11|| aghoro ghoradaityaghnah ghoraghosho vanaspatih | bhasmango jatilashshuddho
    bherundashatasevitah || 12|| bhuteshvaro bhutanathah pancabhutashritah khagah | krodhito nishthurashcandah
    candishashcandikapriyah || 13|| candastungashca garutman nityamasavabhojanah | lelihano maharaudrah
    mrityurmrityoragocarah || 14|| mrityormrityurmahasenah shmashanaranyavasakrit | rago virago ragandhah
    vitaragashatacitah || 15|| sattvam rajastamodharmamadharmam vasavanujah | satyam tvasatyam sadrupamasadrupamahetukam
    || 16|| arddhanarishvaro bhanuh bhanukotishataprabhah | yajno yajnapati rudra ishano varadah shivah
    || 17||
  devanagari: अन्धकध्यातं शिवाष्टोत्तरशतनामस्तोत्रम् ४ ददर्श शूले संशुष्कं ध्यायन्तं परमेश्वरः । अन्धकं
    धैर्यसम्पन्नं दानवेशं तपस्विनम् ॥ ४॥ अन्धक उवाच । ॐ महादेवो विरूपाक्षः चन्द्रार्द्धकृतशेखरः । अमृतः
    शाश्वतः स्थाणुः नीलकण्ठः पिनाकधृक् ॥ ५॥ वृषभाक्षो महाज्ञेयः पुरुषः सर्वकामदः । कामारिः कामदहनः कामरूपः
    कपर्दधृक् ॥ ६॥ विरूपो गिरिशो भीमः स्रग्वी च रक्तवासधृक् । योगी च कालदहनः कपाली त्रिपुरान्तकः ॥ ७॥
    गूढव्रतो गुप्तमन्त्रः गम्भीरो भावगोचरः । अणिमादिगुणाधारस्त्रैलोक्यैश्वर्यदायकः ॥ ८॥ वीरो वीरहणो घोरः
    विरूपो मांसलः पटुः । महामांसाद उन्मत्तः भैरवो वै महेश्वरः ॥ ९॥ त्रैलोक्यद्रावणो लुब्धः लुब्धको यज्ञसूदनः
    । कृत्तिकानां सुतैर्युक्त उन्मत्तः कृत्तिवासधृक् ॥ १०॥ गजकृत्तिपरीधानः क्षुब्धो भुजगभूषणः । दत्तालम्बश्च
    वेतालः घोरश्शाकिनिपूजितः ॥ ११॥ अघोरो घोरदैत्यघ्नः घोरघोषो वनस्पतिः । भस्माङ्गो जटिलश्शुद्धो भेरुण्डशतसेवितः
    ॥ १२॥ भूतेश्वरो भूतनाथः पञ्चभूताश्रितः खगः । क्रोधितो निष्ठुरश्चण्डः चण्डीशश्चण्डिकाप्रियः ॥ १३॥ चण्डस्तुङ्गश्च
    गरुत्मान् नित्यमासवभोजनः । लेलिहानो महारौद्रः मृत्युर्मृत्योरगोचरः ॥ १४॥ मृत्योर्मृत्युर्महासेनः श्मशानारण्यवासकृत्
    । रागो विरागो रागान्धः वीतरागशताचितः ॥ १५॥ सत्त्वं रजस्तमोधर्ममधर्मं वासवानुजः । सत्यं त्वसत्यं सद्रूपमसद्रूपमहेतुकम्
    ॥ १६॥ अर्द्धनारीश्वरो भानुः भानुकोटिशतप्रभः । यज्ञो यज्ञपती रुद्र ईशानो वरदः शिवः ॥ १७॥
