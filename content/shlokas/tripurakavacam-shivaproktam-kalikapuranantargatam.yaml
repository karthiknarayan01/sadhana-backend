id: tripurakavacam-shivaproktam-kalikapuranantargatam
category: kavacha
name:
  english: tripurakavacam shivaproktam (kalikapuranantargatam)
  devanagari: त्रिपुराकवचम् शिवप्रोक्तं (कालिकापुराणान्तर्गतम्)
content:
  english: mavatu sakalaraksham kurvati sundari me || 63|| mahamaya mahayonirvishvayonih sadaiva tu |
    sa patu tripura nityam sundari bhairavi ca ya || 64|| lalate subhaga devi purvasyam dishi kamada |
    nityam tishthatu rakshanti sada tripurasundari || 65|| bhruvormadhye tathagneyyam dishi mam tripura
    ca ya | vardhayanti bhagaganan patu tripurabhairavi || 66|| vadane dakshinasyam ca dishi mam bhagasarpini
    | tripura yamadutadin varayanti sada'vatu || 67|| karnayoh pashcimayam ca dishi mam bhagamalini |
    ayonija jagadyonirbala mam tripura'vatu || 68|| anangakusuma kanthe praticyam dishi sundari | tripurabhairavi
    mata nityam patu maheshvari || 69|| hridi marutakashthayam devi canangamekhala | nabhavudicyam dishi
    mam matangi tripurapara || 70|| anangamadana devi patu tripurabhairavi | aishanyam dishi linge ca
    madavibhramamanthara || 71|| vagvadini rakshatu mam sada tripurabhairavi | gudamedhrantare patu ratistripurabhairavi
    || 72|| hridayabhyantare pritih patu tripurabhairavi | bhrunasayormadhyadeshe nityam patu manobhavah
    || 73|| dravani mam grahat patu vani mam durgamurdhani | kshobhana mam sada patu kravyadbhyo'nishtabhititah
    || 74|| vashikaranavani mamagnitah patu rajatah | akarshanahvaya vani mam patu shastraghatatah ||
    75|| mohanah sarvabhutebhyah pishacebhyo jalattatha | nityam patu mahabanastanvanah kamamuttamam ||
    76|| mala mam shastrabodhaya shastravade sada'vatu | pustakam patu manasi sankalpam vardhayan mama
    || 77|| varah patu sada dhamni dhamatejo vivardhayan | abhayam hyabhayam dhattam sarvebhyo bhutibhavanam
    || 78|| urdhvadhobhavabhutasthitatarakaranai raktakirna sucakra kalagniprakhyarocih sakalasuraganairarcita
    mundamala | jnanadhyanaikatanaprabalabalakaram tattvabhutapratishtham patadurdhvam tathadhah sakalabhayabhrito
    bhogabhirostu vidya || 79|| hah patu hridi mam nityam sah shirshe patu nityashah | rah patu guhyadeshe
    mam sauh patu kanthaparshvayoh || 80|| rakaro mama nadishu shirah sauh patu sarvada | shakrah patu
    sadakashe brahma rakshatu sarvatah || 81|| vidya vidyabhavini kamarupa sthula sukshma mayaya ya''dimaya
    | brahmendradyairarcita bhutidatri raksham kuryat sarvato bhairavi mam || 82|| adya madhya bhavini
    nitiyukta samyagjnanajneyarupapara ya | adavante madhyabhage ca tara payaddevi traipuri bhairavi ya
    || 83|| yanmantrabhagatantranam yantranamapi keshavah | brahma rudrashca janati tattvam nanyo namo'stu
    tan || 84|| tvam brahmani bhavani vishvabhaviturlakshmiratiryogini tvam vagmi subhaga bhavayutayutam
    mantraksharam nishkalam | varnaste nikhila stanavacalitastvam kaminikamada tvam devi tripure kavitvamamalam
    saubhagyamuccaih kuru || 85|| idam tu kavacam devya yo janati sa mantravit | nadhayo vyadhayastasya
    na bhayam ca sada kvacit || 86|| iti te paramam guhyamakhyatam kavacam param | tadbhajasva mahabhaga
    tatah siddhimavapsyasi || 87|| idam pavitram paramam punyam kirtivivardhanam | tripurayastrimurtestu
    kavacam mayakoditam || 88|| yah pathet pratarutthaya sa prapnoti manogatam | likhitam kavacam yastu
    kanthe grihvati mantravit || 89|| na tasya gatram krintanti rane shastrani bhairava | sangrame shastravade
    ca vijayastasya jayate || 90|| idam kavacamajnatva yo japet tripuram narah | sa shastraghatamapnoti
    bhairavim sundarimapi || 91|| bijamuccarayet svastho gatavagdoshanishcitah | samyogabodhah pratyekabheda
  devanagari: मवतु सकलरक्षां कुर्वती सुन्दरी मे ॥ ६३॥ महामाया महायोनिर्विश्वयोनिः सदैव तु । सा पातु त्रिपुरा
    नित्यं सुन्दरी भैरवी च या ॥ ६४॥ ललाटे सुभगा देवी पूर्वस्यां दिशि कामदा । नित्यं तिष्ठतु रक्षन्ती सदा
    त्रिपुरसुन्दरी ॥ ६५॥ भ्रुवोर्मध्ये तथाग्नेय्यां दिशि मां त्रिपुरा च या । वर्धयन्ती भगगणान् पातु त्रिपुरभैरवी
    ॥ ६६॥ वदने दक्षिणस्यां च दिशि मां भगसर्पिणी । त्रिपुरा यमदूतादीन् वारयन्ती सदाऽवतु ॥ ६७॥ कर्णयोः पश्चिमायां
    च दिशि मां भगमालिनी । अयोनिजा जगद्योनिर्बाला मां त्रिपुराऽवतु ॥ ६८॥ अनङ्गकुसुमा कण्ठे प्रतीच्यां दिशि
    सुन्दरी । त्रिपुराभैरवी माता नित्यं पातु महेश्वरी ॥ ६९॥ हृदि मारुतकाष्ठायां देवी चानङ्गमेखला । नाभावुदीच्यां
    दिशि मां मातङ्गी त्रिपुरापरा ॥ ७०॥ अनङ्गमदना देवी पातु त्रिपुरभैरवी । ऐशान्यां दिशि लिङ्गे च मदविभ्रममन्थरा
    ॥ ७१॥ वाग्वादिनी रक्षतु मां सदा त्रिपुरभैरवी । गुदमेढ्रान्तरे पातु रतिस्त्रिपुरभैरवी ॥ ७२॥ हृदयाभ्यन्तरे
    प्रीतिः पातु त्रिपुरभैरवी । भ्रूनासयोर्मध्यदेशे नित्यं पातु मनोभवः ॥ ७३॥ द्रावणी मां ग्रहात् पातु
    वाणी मां दुर्गमूर्धनि । क्षोभणा मां सदा पातु क्रव्याद्भ्योऽनिष्टभीतितः ॥ ७४॥ वशीकरणवाणी मामग्नितः
    पातु राजतः । आकर्षणाह्वया वाणी मां पातु शस्त्रघाततः ॥ ७५॥ मोहनः सर्वभूतेभ्यः पिशाचेभ्यो जलात्तथा ।
    नित्यं पातु महाबाणस्तन्वानः काममुत्तमम् ॥ ७६॥ माला मां शास्त्रबोधाय शास्त्रवादे सदाऽवतु । पुस्तकं
    पातु मनसि सङ्कल्पं वर्धयन् मम ॥ ७७॥ वरः पातु सदा धाम्नि धामतेजो विवर्धयन् । अभयं ह्यभयं धत्तां सर्वेभ्यो
    भूतिभावनम् ॥ ७८॥ ऊर्ध्वाधोभावभूतस्थिततरकरणै रक्तकीर्णा सुचक्रा कालाग्निप्रख्यरोचिः सकलसुरगणैरर्चिता
    मुण्डमाला । ज्ञानध्यानैकतानप्रबलबलकरं तत्त्वभूतप्रतिष्ठं पातादूर्ध्वं तथाधः सकलभयभृतो भोगभीरोस्तु
    विद्या ॥ ७९॥ हः पातु हृदि मां नित्यं सः शीर्षे पातु नित्यशः । रः पातु गुह्यदेशे मां सौः पातु कण्ठपार्श्वयोः
    ॥ ८०॥ रकारो मम नाडीषु शिरः सौः पातु सर्वदा । शक्रः पातु सदाकाशे ब्रह्मा रक्षतु सर्वतः ॥ ८१॥ विद्या
    विद्याभाविनी कामरूपा स्थूला सूक्ष्मा मायया याऽऽदिमाया । ब्रह्मेन्द्राद्यैरर्चिता भूतिदात्री रक्षां
    कुर्यात् सर्वतो भैरवी माम् ॥ ८२॥ आद्या मध्या भाविनी नीतियुक्ता सम्यग्ज्ञानज्ञेयरूपापरा या । आदावन्ते
    मध्यभागे च तारा पायाद्देवी त्रैपुरी भैरवी या ॥ ८३॥ यन्मन्त्रभागतन्त्राणां यन्त्राणामपि केशवः । ब्रह्मा
    रुद्रश्च जानाति तत्त्वं नान्यो नमोऽस्तु तान् ॥ ८४॥ त्वं ब्रह्माणि भवानि विश्वभवितुर्लक्ष्मीरतिर्योगिनी
    त्वं वाग्मी सुभगा भवायुतयुतं मन्त्राक्षरं निष्कलम् । वर्णास्ते निखिला स्तनावचलितस्त्वं कामिनीकामदा
    त्वं देवि त्रिपुरे कवित्वममलं सौभाग्यमुच्चैः कुरु ॥ ८५॥ इदं तु कवचं देव्या यो जानाति स मन्त्रवित्
    । नाधयो व्याधयस्तस्य न भयं च सदा क्वचित् ॥ ८६॥ इति ते परमं गुह्यमाख्यातं कवचं परम् । तद्भजस्व महाभाग
    ततः सिद्धिमवाप्स्यसि ॥ ८७॥ इदं पवित्रं परमं पुण्यं कीर्तिविवर्धनम् । त्रिपुरायास्त्रिमूर्तेस्तु कवचं
    मयकोदितम् ॥ ८८॥ यः पठेत् प्रातरुत्थाय स प्राप्नोति मनोगतम् । लिखितं कवचं यस्तु कण्ठे गृह्वाति मन्त्रवित्
    ॥ ८९॥ न तस्य गात्रं कृन्तन्ति रणे शस्त्राणि भैरव । सङ्ग्रामे शास्त्रवादे च विजयस्तस्य जायते ॥ ९०॥
    इदं कवचमज्ञात्वा यो जपेत् त्रिपुरां नरः । स शस्त्रघातमाप्नोति भैरवीं सुन्दरीमपि ॥ ९१॥ बीजमुच्चारयेत्
    स्वस्थो गतवाग्दोषनिश्चितः । संयोगबोधः प्रत्येकभेद
