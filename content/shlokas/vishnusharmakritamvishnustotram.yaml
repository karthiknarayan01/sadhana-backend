id: vishnusharmakritamvishnustotram
category: stotram
name:
  english: vishnusharmakritamvishnustotram
  devanagari: विष्णुशर्मकृतंविष्णुस्तोत्रम्
content:
  english: vishnusharmakritam vishnustotram vishnusharmmovaca | prasida bhagavanvishno prasida purushottama
    | prasida devadevesha prasida kamalekshana || 79|| jaya krishna jayacintya jaya vishno jayavyaya |
    jaya yajnapate natha jaya vishno pate vibho || 80|| jaya papaharananta jaya janmajvarapaha | namah
    kamalanabhaya namah kamalamaline || 81|| namah sarvesha bhutesha namah kaitabhasudana | namastrailokyanathaya
    jaganmula jagatpate || 82|| namo devadhidevaya namo narayanaya vai | namah krishnaya ramaya namashcakrayudhaya
    ca || 83|| tvam mata sarvalokanam tvameva jagatah pita | bhayarttanam suhrinmitram tvam pita tvam
    pitamahah || 84|| tvam havistvam vashatkarastvam prabhustvam hutashanah | karanam karanam kartta tvameva
    parameshvarah || 85|| shankhacakragadapane mam samuddhara madhava || 86|| prasida mandaradhara prasida
    madhusudana | prasida kamalakanta prasida bhuvanadhipa || 87|| iti shriskandapurane vaishnavakhande
    ayodhyamahatmye prathamadhyayantargatam vishnusharmakritam vishnustotram samaptam | skandapurana |
    vaishnavakhanda | ayodhyakhanda 8 | adhyaya 1
  devanagari: विष्णुशर्मकृतं विष्णुस्तोत्रम् विष्णुशर्म्मोवाच । प्रसीद भगवन्विष्णो प्रसीद पुरुषोत्तम ।
    प्रसीद देवदेवेश प्रसीद कमलेक्षण ॥ ७९॥ जय कृष्ण जयाचिन्त्य जय विष्णो जयाव्यय । जय यज्ञपते नाथ जय विष्णो
    पते विभो ॥ ८०॥ जय पापहरानन्त जय जन्मज्वरापह । नमः कमलनाभाय नमः कमलमालिने ॥ ८१॥ नमः सर्वेश भूतेश नमः
    कैटभसूदन । नमस्त्रैलोक्यनाथाय जगन्मूल जगत्पते ॥ ८२॥ नमो देवाधिदेवाय नमो नारायणाय वै । नमः कृष्णाय
    रामाय नमश्चक्रायुधाय च ॥ ८३॥ त्वं माता सर्वलोकानां त्वमेव जगतः पिता । भयार्त्तानां सुहृन्मित्रं त्वं
    पिता त्वं पितामहः ॥ ८४॥ त्वं हविस्त्वं वषट्कारस्त्वं प्रभुस्त्वं हुताशनः । करणं कारणं कर्त्ता त्वमेव
    परमेश्वरः ॥ ८५॥ शङ्खचक्रगदापाणे मां समुद्धर माधव ॥ ८६॥ प्रसीद मन्दरधर प्रसीद मधुसूदन । प्रसीद कमलाकान्त
    प्रसीद भुवनाधिप ॥ ८७॥ इति श्रीस्कन्दपुराणे वैष्णवखण्डे अयोध्यामाहात्म्ये प्रथमाध्यायान्तर्गतं विष्णुशर्मकृतं
    विष्णुस्तोत्रं समाप्तम् । स्कन्दपुराण । वैष्णवखण्ड । अयोध्याखण्ड ८ । अध्याय १
