id: hanumadadivanaraihkritamramanathastotram
category: stotram
name:
  english: hanumadadivanaraihkritamramanathastotram
  devanagari: हनुमदादिवानरैःकृतंरामनाथस्तोत्रम्
content:
  english: 30|| nala uvaca | brahmavishnumaheshana yadavidyavijrimbhitah | namo'vidyavihinaya tasmai rameshvaraya
    te || 31|| kumuda uvaca | yastvarupaparijnanatpradhanam karanatvatah | kalpitam karanayasmai ramanathaya
    shambhave || 32|| panasa uvaca | jagratsvapnasushuptyadiyadavidyavijrimbhitam | jagradadivihinaya
    namo'smai jnanarupine || 33|| gaja uvaca | yatsvarupaparijnanatkaryanam paramanavah | kalpitah karanatvena
    tarkikapasadairvritha || 34|| tamaham paramanandam ramanatham maheshvaram | atmarupataya nityamupase
    sarvasakshinam || 35|| gavaksha uvaca | ajnanapashabaddhanam pashunam pashamocakam | rameshvaram shivam
    shantamupaimi sharanam sada || 36|| gavaya uvaca | sadhvastajagadadharam candracudamumapatim | ramanatham
    shivam vande samsaramayabheshajam || 37|| sharabha uvaca | antahkaranamatmeti yadajnanadvimohitaih
    | bhanyate ramanatham tamatmanam pranamamyaham || 38|| gandhamadana uvaca | ramanathamumanatham gananatham
    ca tryambakam | sarvapatakashuddhyarthamupase jagadishvaram || 39|| sugriva uvaca | samsarambhodhi
    madhye mam janmamrityujale bhaye | putradaradhanakshetravicimalasamakule || 1
  devanagari: ३०॥ नल उवाच । ब्रह्मविष्णुमहेशाना यदविद्याविजृम्भिताः । नमोऽविद्याविहीनाय तस्मै रामेश्वराय
    ते ॥ ३१॥ कुमुद उवाच । यस्त्वरूपापरिज्ञानात्प्रधानं कारणत्वतः । कल्पितं कारणायास्मै रामनाथाय शम्भवे
    ॥ ३२॥ पनस उवाच । जाग्रत्स्वप्नसुषुप्त्यादियदविद्याविजृम्भितम् । जाग्रदादिविहीनाय नमोऽस्मै ज्ञानरूपिणे
    ॥ ३३॥ गज उवाच । यत्स्वरूपापरिज्ञानात्कार्याणां परमाणवः । कल्पिताः कारणत्वेन तार्किकापसदैर्वृथा ॥ ३४॥
    तमहं परमानन्दं रामनाथं महेश्वरम् । आत्मरूपतया नित्यमुपासे सर्वसाक्षिणम् ॥ ३५॥ गवाक्ष उवाच । अज्ञानपाशबद्धानां
    पशूनां पाशमोचकम् । रामेश्वरं शिवं शान्तमुपैमि शरणं सदा ॥ ३६॥ गवय उवाच । साध्वस्तजगदाधारं चन्द्रचूडमुमापतिम्
    । रामनाथं शिवं वन्दे संसारामयभेषजम् ॥ ३७॥ शरभ उवाच । अन्तःकरणमात्मेति यदज्ञानाद्विमोहितैः । भण्यते
    रामनाथं तमात्मानं प्रणमाम्यहम् ॥ ३८॥ गन्धमादन उवाच । रामनाथमुमानाथं गणनाथं च त्र्यम्बकम् । सर्वपातकशुद्ध्यर्थमुपासे
    जगदीश्वरम् ॥ ३९॥ सुग्रीव उवाच । संसाराम्भोधि मध्ये मां जन्ममृत्युजले भये । पुत्रदारधनक्षेत्रवीचिमालासमाकुले
    ॥ १
