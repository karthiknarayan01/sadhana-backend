id: shloka-1
category: shloka
name:
  english: shloka 1
  devanagari: श्लोक १
content:
  english: shlokasangraha 1 om vakratunda mahakaya kotisuryasamaprabha | nirvighnam kuru me deva sarvakaryeshu
    sarvada || ya kundendu tushar hara dhavala ya shubhravastravrita | ya vinavaradanda manditakara ya
    shvetapadmasana | ya brahmacyutashankaraprabhrutibhirdevai sada vandita | sa mam patu sarasvati bhagavati
    nihshesha jadya paha || gururbrahma gururvishnuh gururdevo maheshvarah | guruh sakshatparabrahma tasmai
    shri guravenamah || karagre vasate lakshmih karamadhye sarasvati | karamule tu govindah prabhate karadarshanam
    || samudravasane devi parvatastanamandale | vishnupatni namastubhyam padasparsham kshamasva me ||
    shantakaram bhujagashayanam padmanabham suresham | vishvadharam gaganasadrisham meghavarnam shubhangam
    | lakshmikantam kamalanayanam yogibhirdhyanagamyam | vande vishnum bhavabhayaharam sarvalokaikanatham
    || sarve'pi sukhinah santu sarve santu niramayah | sarve bhadrani pashyantu ma kashcitduhkhabhagbhavet
    || ya devi sarvabhuteshu matrirupena samsthitah | ya devi sarvabhuteshu shaktirupena samsthitah |
    ya devi sarvabhuteshu shantirupena samsthitah | namastasyaih namastasyaih namastasyaih namo namah
    || om namo arihantanam om namo siddhanam om namo ayariyanam om namo uvajjhayanam om namo loe savvasahunam
    eso panca namokaro savva pavapanasano | mangalanam ca savvesim padhamam havai mangalam | sarva mangala
    mangalye shive sarvartha sadhike | sharanye tryambake gauri narayani namo'stute || vasudeva sutam
    devam kamsa canuramardanam | devaki paramanandam krishnam vande jagadgurum || brahmarpanam brahma
    havih brahmagnau brahmana hutam | brahmaiva tena gantavyam brahmakarmasamadhina || rama rameti rameti
    rame rame manorame | sahasranamatattulyam ramanama varanane || shubham karoti kalyanam arogyam dhanasampada
    | shatrubudhdivinashaya dipajyoti namo'stute || karmanyevadhikaraste ma phaleshu kadacana | ma karmaphalaheturbhih
    ma te sangostva karmani || karacarana kritam vakkayajam karmajam va | shravananayanajam va manasam
    vaparadham | vihitamavihitam va sarvametatkshamasva | jaya jaya karunabdhe shrimahadeva shambho ||
    om saha navavatu | saha naubhunaktu | saha viryam karavavahai | tejasvi navadhitamastu | ma vidvishavahai
    || tvameva mata ca pita tvameva | tvameva bandhushca sakha tvameva | tvameva vidya dravinam tvameva
    | tvameva sarvam mama devadeva || om asato ma sadgamaya | tamaso ma jyotirgamaya | mrityorma amritam
    gamaya || om shantih shantih shantih || om purnamadah purnamidam purnat purnamudacyate | purnasya
    purnamadaya purnamevavashishyate || om shantih shantih shantih ||
  devanagari: श्लोकसङ्ग्रह १ ॐ वक्रतुण्ड महाकाय कोटिसूर्यसमप्रभ । निर्विघ्नं कुरु मे देव सर्वकार्येषु
    सर्वदा ॥ या कुन्देन्दु तुषार् हार धवला या शुभ्रवस्त्रावृता । या वीणावरदण्ड मण्डितकरा या श्वेतपद्मासना
    । या ब्रह्माच्युतशङ्करप्रभ्रुतिभिर्देवै सदा वन्दिता । सा मां पातु सरस्वती भगवती निःशेष जाड्या पहा
    ॥ गुरुर्ब्रह्मा गुरुर्विष्णुः गुरुर्देवो महेश्वरः । गुरुः साक्षात्परब्रह्म तस्मै श्री गुरवेनमः ॥ कराग्रे
    वसते लक्ष्मीः करमध्ये सरस्वती । करमूले तु गोविन्दः प्रभाते करदर्शनम् ॥ समुद्रवसने देवि पर्वतस्तनमण्डले
    । विष्णुपत्नि नमस्तुभ्यं पादस्पर्शं क्षमस्व मे ॥ शान्ताकारं भुजगशयनं पद्मनाभं सुरेशम् । विश्वाधारं
    गगनसदृशं मेघवर्णं शुभाङ्गम् । लक्ष्मीकान्तं कमलनयनं योगिभिर्ध्यानगम्यम् । वन्दे विष्णुं भवभयहरं सर्वलोकैकनाथम्
    ॥ सर्वेऽपि सुखिनः सन्तु सर्वे सन्तु निरामयाः । सर्वे भद्राणि पश्यन्तु मा कश्चित्दुःखभाग्भवेत् ॥ या
    देवी सर्वभूतेषु मातृरुपेण संस्थितः । या देवी सर्वभूतेषु शक्तिरुपेण संस्थितः । या देवी सर्वभूतेषु शान्तिरुपेण
    संस्थितः । नमस्तस्यैः नमस्तस्यैः नमस्तस्यैः नमो नमः ॥ ॐ णमो अरिहन्ताणं ॐ णमो सिद्धाणं ॐ णमो आयरियाणं
    ॐ णमो उवज्झायाणं ॐ णमो लोए सव्वसाहुणं एसो पञ्च णमोकारो सव्व पावपणासणो । मङ्गलाणं च सव्वेसिं पढमं हवई
    मङ्गलम् । सर्व मङ्गल माङ्गल्ये शिवे सर्वार्थ साधिके । शरण्ये त्र्यम्बके गौरी नारायणी नमोऽस्तुते ॥
    वसुदेव सुतं देवं कंस चाणूरमर्दनम् । देवकी परमानन्दं कृष्णं वन्दे जगद्गुरुम् ॥ ब्रह्मार्पणं ब्रह्म
    हविः ब्रह्माग्नौ ब्रह्मणा हुतम् । ब्रह्मैव तेन गन्तव्यं ब्रह्मकर्मसमाधिना ॥ राम रामेति रामेति रमे
    रामे मनोरमे । सहस्रनामतत्तुल्यं रामनाम वरानने ॥ शुभं करोति कल्याणं आरोग्यं धनसम्पदा । शत्रुबुध्दिविनाशाय
    दीपज्योति नमोऽस्तुते ॥ कर्मण्येवाधिकारस्ते मा फलेषु कदाचन । मा कर्मफलहेतुर्भिः मा ते सङ्गोस्त्व कर्मणि
    ॥ करचरण कृतं वाक्कायजं कर्मजं वा । श्रवणनयनजं वा मानसं वापराधम् । विहितमविहितं वा सर्वमेतत्क्षमस्व
    । जय जय करुणाब्धे श्रीमहादेव शम्भो ॥ ॐ सह नाववतु । सह नौभुनक्तु । सह वीर्यं करवावहै । तेजस्वि नावधीतमस्तु
    । मा विद्विषावहै ॥ त्वमेव माता च पिता त्वमेव । त्वमेव बन्धुश्च सखा त्वमेव । त्वमेव विद्या द्रविणं
    त्वमेव । त्वमेव सर्वं मम देवदेव ॥ ॐ असतो मा सद्गमय । तमसो मा ज्योतिर्गमय । मृत्योर्मा अमृतं गमय ॥
    ॐ शान्तिः शान्तिः शान्तिः ॥ ॐ पूर्णमदः पूर्णमिदं पूर्णात् पूर्णमुदच्यते । पूर्णस्य पूर्णमादाय पूर्णमेवावशिष्यते
    ॥ ॐ शान्तिः शान्तिः शान्तिः ॥
