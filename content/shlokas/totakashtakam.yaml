id: totakashtakam
category: stotram
name:
  english: Totakashtakam
content:
  english: viditakhila shastra sudha jaladhe mahitopanishat kathitartha nidhe | hridaye kalaye vimalam
    caranam bhava shankara deshika me sharanam || || karuna varunalaya palaya mam bhavasagara duhkha viduna
    hridam | racayakhila darshana tattvavidam bhava shankara deshika me sharanam || || bhavata janata
    suhita bhavita nijabodha vicarana carumate | kalayeshvara jiva viveka vidam bhava shankara deshika
    me sharanam || || bhava èva bhavaniti mè nitaram samajayata cetasi kautukita | mama varaya moha mahajaladhim
    bhava shankara deshika me sharanam || || sukrite'dhikrite bahudha bhavato bhavita samadarshana lalasata
    | ati dinamimam paripalaya mam bhava shankara deshika me sharanam || || jagatimavitum kalitakritayo
    vicaranti mahamaha sacchalatah | ahimamshurivatra vibhasi guro bhava shankara deshika me sharanam
    || || gurupungava pungavaketana te samatamayatam na hi ko'pi sudhih | sharanagata vatsala tattvanidhe
    bhava shankara deshika me sharanam || || vidita na maya vishadaika kala na ca kincana kancanamasti
    guro | dritameva vidhehi kripam sahajam bhava shankara deshika me sharanam ||
  devanagari: विदिताखिल शास्त्र सुधा जलधे महितोपनिषत् कथितार्थ निधे । हृदये कलये विमलं चरणं भव शङ्कर देशिक
    मे शरणम् ॥ ॥ करुणा वरुणालय पालय मां भवसागर दुःख विदून हृदम् । रचयाखिल दर्शन तत्त्वविदं भव शङ्कर देशिक
    मे शरणम् ॥ ॥ भवता जनता सुहिता भविता निजबोध विचारण चारुमते । कलयेश्वर जीव विवेक विदं भव शङ्कर देशिक
    मे शरणम् ॥ ॥ भव ऎव भवानिति मॆ नितरां समजायत चेतसि कौतुकिता । मम वारय मोह महाजलधिं भव शङ्कर देशिक मे
    शरणम् ॥ ॥ सुकृतेऽधिकृते बहुधा भवतो भविता समदर्शन लालसता । अति दीनमिमं परिपालय मां भव शङ्कर देशिक मे
    शरणम् ॥ ॥ जगतीमवितुं कलिताकृतयो विचरन्ति महामाह सच्छलतः । अहिमांशुरिवात्र विभासि गुरो भव शङ्कर देशिक
    मे शरणम् ॥ ॥ गुरुपुङ्गव पुङ्गवकेतन ते समतामयतां न हि कोऽपि सुधीः । शरणागत वत्सल तत्त्वनिधे भव शङ्कर
    देशिक मे शरणम् ॥ ॥ विदिता न मया विशदैक कला न च किञ्चन काञ्चनमस्ति गुरो । दृतमेव विधेहि कृपां सहजां
    भव शङ्कर देशिक मे शरणम् ॥
