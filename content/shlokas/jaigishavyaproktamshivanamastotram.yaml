id: jaigishavyaproktamshivanamastotram
category: stotram
name:
  english: jaigishavyaproktamshivanamastotram
  devanagari: जैगीषव्यप्रोक्तंशिवनामस्तोत्रम्
content:
  english: purusham parameshanam sarvabhutaguhashayam | vyapya vyapakatahinam karananam ca karanam ||
    17|| patinam patimishanamumapatimanamayam | gananam ca patim devam shivam gritsapatim prabhum || 18||
    kuluncanam patim shambhum haram vratapatim vibhum | disham ca patimishanamugram devam kapardinam ||
    19|| ambikesham pashupatim pathinam patimishvaram | annanam ca patim devam babhrusham midhusham shivam
    || 20|| bhavodbhavam mahadevam pushtanam patimishvaram | jagatam patimashasyam vananam ca patim bhavam
    || 21|| kshetranam ca patim bhimam vrikshanam sharvamishvaram | kakshanam ca patim vyomakesham koshadivarjitam
    || 22|| jagatam caiva vishveshamoshadhinam maheshvaram | pattinam merudhanusham satvanam banadharakam
    || 23|| sahamanam maheshanamavyadhipatimishvaram | sarvesham tasthushanam
  devanagari: पुरुषं परमेशानं सर्वभूतगुहाशयम् । व्याप्य व्यापकताहीनं कारणानां च कारणम् ॥ १७॥ पतीनां पतिमीशानमुमापतिमनामयम्
    । गणानां च पतिं देवं शिवं गृत्सपतिं प्रभुम् ॥ १८॥ कुलुञ्चानां पतिं शम्भुं हरं व्रातपतिं विभुम् । दिशां
    च पतिमीशानमुग्रं देवं कपर्दिनम् ॥ १९॥ अम्बिकेशं पशुपतिं पथीनां पतिमीश्वरम् । अन्नानां च पतिं देवं
    बभ्रुशं मीढुषं शिवम् ॥ २०॥ भवोद्भवं महादेवं पुष्टानां पतिमीश्वरम् । जगतां पतिमाशास्यं वनानां च पतिं
    भवम् ॥ २१॥ क्षेत्राणां च पतिं भीमं वृक्षाणां शर्वमीश्वरम् । कक्षाणां च पतिं व्योमकेशं कोशादिवर्जितम्
    ॥ २२॥ जगतां चैव विश्वेशमोषधीनां महेश्वरम् । पत्तीनां मेरुधनुषं सत्वानां बाणधारकम् ॥ २३॥ सहमानं महेशानमाव्याधिपतिमीश्वरम्
    । सर्वेषां तस्थुषाणां
