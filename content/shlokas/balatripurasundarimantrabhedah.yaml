id: balatripurasundarimantrabhedah
category: mantra
name:
  english: balatripurasundarimantrabhedah
  devanagari: बालात्रिपुरसुन्दरीमन्त्रभेदाः
content:
  english: klim klim klim shrim shrim shrim hrim hrim hrim tripurasundari sarvam jaganmama vasham kuru
    kuru mahyam balam dehi svaha iti shribalatripurasundari mantrabhedah samaptah |
  devanagari: क्लीं क्लीं क्लीं श्रीं श्रीं श्रीं ह्रीं ह्रीं ह्रीं त्रिपुरसुन्दरि सर्वं जगन्मम वशं कुरु
    कुरु मह्यं बलं देहि स्वाहा इति श्रीबालात्रिपुरसुन्दरी मन्त्रभेदाः समाप्ताः ।
meaning: {}
