id: ritiviracitamshankarastotram
category: stotram
name:
  english: ritiviracitamshankarastotram
  devanagari: रिटिविरचितंशन्करस्तोत्रं
content:
  english: '|| 7|| samastomaikabhuma ravishashihutabhugdhama sima tvamatma sarvesham bhurikamapradavaradagiri
    devadevo''si somah | urvimaurvika darvikara rathagiridhrigbanabanasanam te vishnurjishnustvamevagamavaraturagottungaheshairapidyah
    || 8|| dhata yanta suranye tava hara sukagah kinkarah shankara tvam stotum jnatum kilesham mama varakarane
    karanam tvam mahesha || 9|| vamadeva jitakama samajastomasima sudidhitilalama | vyomakesha kushakashapujitotkrishtakoshaganapancakadura
    || 10|| aja gajavaramaulikrittidharin suragajarajasamarcitabjapada | ajagajakaraneshu karanam tvam
    bhajatam nasti bhavo bhava prapanne || 11|| mayi kuru karunam pinakapane bhavabhaveshu nimagnamenamisha
    | sudayarasasaraya drisha krishamadya''dya vilokayenducuda || 12|| svarnavarnakritanetrakarnajaparahara
    gaganarnavasamstha | urnanabhiriva jagatametattvadgatam visrijase''tsi ca turnam || 19|| sharva sarvaparipuritakamastomabanaganana
    karunadhya | lokane''pi kalane''pi kalatah kamakopadamanavyayamurte || 20|| shrimattriyambaka sadashiva
    vedavedya vaidyottama pramathanatha surasuredya | vishvanatha mama natha pahi mam mama natha girijadhava
    natha || 21||'
  devanagari: ॥ ७॥ सामस्तोमैकभूमा रविशशिहुतभुग्धाम सीमा त्वमात्मा सर्वेषां भूरिकामप्रदवरदगिरी देवदेवोऽसि
    सोमः । उर्वीमौर्वीक दर्वीकर रथगिरिधृग्बाणबाणासनं ते विष्णुर्जिष्णुस्त्वमेवागमवरतुरगोत्तुङ्गहेषैरपीड्यः
    ॥ ८॥ धाता यन्ता सुरान्ये तव हर सुकगः किङ्कराः शङ्कर त्वां स्तोतुं ज्ञातुं किलेशं मम वरकरणे कारणं त्वं
    महेश ॥ ९॥ वामदेव जितकाम सामजस्तोमसीम सुदिधीतिललाम । व्योमकेश कुशकाशपूजितोत्कृष्टकोशगणपञ्चकदूर ॥ १०॥
    अज गजवरमौलिकृत्तिधारिन् सुरगजराजसमर्चिताब्जपाद । अजगजकरणेषु कारणं त्वां भजतां नास्ति भवो भव प्रपन्ने
    ॥ ११॥ मयि कुरु करुणां पिनाकपाणे भवभावेषु निमग्नमेनमीश । सुदयारससारया दृशा कृशमाद्याऽद्य विलोकयेन्दुचूड
    ॥ १२॥ स्वर्णवर्णकृतनेत्रकर्णजापारहार गगनर्णवसंस्थ । ऊर्णनाभिरिव जागतमेतत्त्वद्गतं विसृजसेऽत्सि च तूर्णम्
    ॥ १९॥ शर्व सर्वपरिपूरितकामस्तोमबाणगणना करुणाढ्य । लोकनेऽपि कलनेऽपि कालतः कामकोपदमनाव्ययमूर्ते ॥ २०॥
    श्रीमत्त्रियम्बक सदाशिव वेदवेद्य वैद्योत्तम प्रमथनाथ सुरासुरेड्य । विश्वनाथ मम नाथ पाहि मां माम नाथ
    गिरिजाधव नाथ ॥ २१॥
