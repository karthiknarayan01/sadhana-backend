name:
  english: namavali
  devanagari: नामावली
content:
  english: shribagalashtottarashatanamavalih asyah shrivagala devyah shatanamastotrasya shrisadashivarishirgayatrichandah
    shrivagalamukhi devata dharmarthakamamoksharthasiddhaye viniyogah | om vashinyai namah | om vashapujyayai
    namah | om valikayai namah | om vasudayai namah | om vasave namah | om vagvadinyai namah | om vayorupayai
