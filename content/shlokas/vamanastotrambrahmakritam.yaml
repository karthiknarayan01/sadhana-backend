id: vamanastotrambrahmakritam
category: stotram
name:
  english: vamanastotrambrahmakritam
  devanagari: वामनस्तोत्रंब्रह्मकृतम्
content:
  english: jayadyesha jayajeya jaya sarvatmakatmaka | jaya janmajarapeta jayananta jayacyuta || 68|| jayajita
    jayashesha jayavyaktasthite jaya | paramarthartha sarvajna jnanajneyatmanihsrita || 69|| jayasheshajagatsakshinjaya
    kartarjagadguro | jagato jagadante'ntahsthitau palayita jaya || 70|| jayakhila jayashesha jayakhilahridi
    sthita | jayadimadhyantamaya sarvajnanamayottama || 71|| mumukshubhiranirdeshya svayandrishta jayeshvara
    | yogibhirmuktiphalada damadigunabhushanaih || 72|| jayatisukshma durjneya jagatsthula jaganmaya |
    jaya sthulatisukshma tvam jayatindriya sendriya || 73|| jaya svamaya yogastha sheshabhogashayakshara
    | jayaikadamshtraprantanta samuddhritavasundhara || 74|| nrikesarinjayarativakshahsthalavidarana |
    sampratam jaya vishvatmanmayavamana keshava || 75|| nijamayapatacchanna jagaddhatarjanardana | jayacintya
    jayanekasvarupaikavidha prabho || 76|| vardhasva vardhitanekavikaraprakrite hare | tvayyesha jagatamisha
    samsthita dharmapaddhatih || 77|| na tvamaham na ceshano nendradyastridasha hare | jnatumisha na munayah
    sanakadya na yoginah || 78|| tvanmayapatasamvite jagatyatra jagatpate | kastvam vetsyati sarvesham
    tvatprasadam vina narah || 79|| tvamevaradhito yasya prasadasumukhah prabho | sa eva kevalam deva
    vetti tvam netaro janah || 80|| tadishvareshvareshana vibho vardhasva bhavana | prabhavayasya vishvasya
    vishvatmanprithulocana || 81|| iti vishnudharmeshu shatsaptatitamo'dhyayantargatam brahmakritam vamanastotram
    sampurnam |
  devanagari: जयाद्येश जयाजेय जय सर्वात्मकात्मक । जय जन्मजरापेत जयानन्त जयाच्युत ॥ ६८॥ जयाजित जयाशेष जयाव्यक्तस्थिते
    जय । परमार्थार्थ सर्वज्ञ ज्ञानज्ञेयात्मनिःसृत ॥ ६९॥ जयाशेषजगत्साक्षिञ्जय कर्तर्जगद्गुरो । जगतो जगदन्तेऽन्तःस्थितौ
    पालयिता जय ॥ ७०॥ जयाखिल जयाशेष जयाखिलहृदि स्थित । जयादिमध्यान्तमय सर्वज्ञानमयोत्तम ॥ ७१॥ मुमुक्षुभिरनिर्देश्य
    स्वयन्दृष्ट जयेश्वर । योगिभिर्मुक्तिफलद दमादिगुणभूषणैः ॥ ७२॥ जयातिसूक्ष्म दुर्ज्ञेय जगत्स्थूल जगन्मय
    । जय स्थूलातिसूक्ष्म त्वं जयातीन्द्रिय सेन्द्रिय ॥ ७३॥ जय स्वमाया योगस्थ शेषभोगशयाक्षर । जयैकदंष्ट्राप्रान्तान्त
    समुद्धृतवसुन्धर ॥ ७४॥ नृकेसरिञ्जयारातिवक्षःस्थलविदारण । साम्प्रतं जय विश्वात्मन्मायावामन केशव ॥ ७५॥
    निजमायापटच्छन्न जगद्धातर्जनार्दन । जयाचिन्त्य जयानेकस्वरूपैकविध प्रभो ॥ ७६॥ वर्धस्व वर्धितानेकविकारप्रकृते
    हरे । त्वय्येषा जगतामीश संस्थिता धर्मपद्धतिः ॥ ७७॥ न त्वामहं न चेशानो नेन्द्राद्यास्त्रिदशा हरे ।
    ज्ञातुमीशा न मुनयः सनकाद्या न योगिनः ॥ ७८॥ त्वन्मायापटसंवीते जगत्यत्र जगत्पते । कस्त्वां वेत्स्यति
    सर्वेशं त्वत्प्रसादं विना नरः ॥ ७९॥ त्वमेवाराधितो यस्य प्रसादसुमुखः प्रभो । स एव केवलं देव वेत्ति
    त्वां नेतरो जनः ॥ ८०॥ तदीश्वरेश्वरेशान विभो वर्धस्व भावन । प्रभावायास्य विश्वस्य विश्वात्मन्पृथुलोचन
    ॥ ८१॥ इति विष्णुधर्मेषु षट्सप्ततितमोऽध्यायान्तर्गतं ब्रह्मकृतं वामनस्तोत्रं सम्पूर्णम् ।
