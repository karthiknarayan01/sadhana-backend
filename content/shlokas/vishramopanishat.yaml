id: vishramopanishat
category: upanishad
name:
  english: vishramopanishat
  devanagari: विश्रामोपनिषत्
content:
  english: vishramopanishat om purvadale shvetavarne yada vishramyate manah | tada dhairyamudaram ca dharmakirtimatirbhavet
    || agnidale raktavarne yada vishramyate manah | tada krodhashca kamashca mandabuddhirmatirbhavet ||
    krishnavarne dakshinadale yada vishramyate manah | nidralasyabhayam devi matsare ca matirbhavet ||
    nairritadale nilavarne yada vishramyate manah | tada krodhashca kamashca manobhinnamatirbhavet ||
    pashcimadale kapilavarne yada vishramyate manah | tada hasyavinodau ca utsahe ca matirbhavet || shyamavarne
    vayudale yada vishramyate manah | tada cintoccatanam ca vairagye ca matirbhavet || pitavarnottaradale
    yada vishramyate manah | tada sha
  devanagari: विश्रामोपनिषत् ॐ पूर्वदले श्वेतवर्णे यदा विश्राम्यते मनः । तदा धैर्यमुदारं च धर्मकीर्तिमतिर्भवेत्
    ॥ अग्निदले रक्तवर्णे यदा विश्राम्यते मनः । तदा क्रोधश्च कामश्च मन्दबुद्धिर्मतिर्भवेत् ॥ कृष्णवर्णे
    दक्षिणदले यदा विश्राम्यते मनः । निद्रालस्यभयं देवि मत्सरे च मतिर्भवेत् ॥ नैरृतदले नीलवर्णे यदा विश्राम्यते
    मनः । तदा क्रोधश्च कामश्च मनोभिन्नमतिर्भवेत् ॥ पश्चिमदले कपिलवर्णे यदा विश्राम्यते मनः । तदा हास्यविनोदौ
    च उत्साहे च मतिर्भवेत् ॥ श्यामवर्णे वायुदले यदा विश्राम्यते मनः । तदा चिन्तोच्चाटनं च वैराग्ये च मतिर्भवेत्
    ॥ पीतवर्णोत्तरदले यदा विश्राम्यते मनः । तदा श
