id: kyts-4-2-vishnoh-kramosyabhimaatihaa-krishna-yajurveda-taittiriya-samhita-patha
category: stotram
name:
  english: KYTS 4.2 Vishnoh Kramosyabhimaatihaa - Krishna Yajurveda Taittiriya Samhita Patha
content:
  english: krishna yajurvediya taittiriya samhitaya ncaturthakande dvitiyah prashnah shri gurubhyo namah
    | harih om || vishnoh kramo 'syabhimatiha gayatra nchanda a roha prithivimanu vikramasva nirbhakta
    ndvishmo vishnoh kramo 'syabhishastiha traishtubha nchanda a rohantarikshamanu vikramasva nirbhakta
    ndvishmo vishnoh kramo 'syaratiyato hanta jagata nchanda a roha divamanu vikramasva nirbhakta ndvishmo
    vishnoh 'si shatruyato hanta nchanda a roha disho 'nu vikramasva nirbhakta ndvishmah || akrandadagni
    sstanayanniva dyauh dvirudhah samanjann | sadyo jajnano vi himiddho akhyada rodasi bhanuna bhatyantah
    || agne 'bhyavartinnabhi na a vartasva ''yusha varcasa sanya medhaya prajaya dhanena || agne nte santvavritah
    sahasra nta upavritah | tasa mposhasya poshena punarno nashtama kridhi punarno rayima kridhi || punarurja
    nivartasva punaragna isha ''yusha | punarnah pahi vishvatah || saha rayya ni vartasvagne pinvasva
    dharaya | vishvaphsniya vishva taspari || uduttamam va~runa pasha masmadava shrathaya | atha vayamaditya
    vrate tavanagaso aditaye syama || a tva mantarabhurdhruvastishtha 'vicacalih | vishastva sarva vanchantvasmi
    nrashtramadhi shraya ||agre brihannushasamurdhvo asthannirjagmivan t | agnirbhanuna rushata svanga
    a jato vishva sadma nyagne vayunani vidvan | mainamarcisha ma tapasa 'ntarasyagm shukrajyotirvi bhahi
    || antaragne ruca tvamukhayai sadane sve | tasyastvagm harasa tapanjataveda shshivo bhava || shivo
    bhutva mahyamagne 'tho sida shivastvam | shivah kritva disha shshucisha dvasurantariksha saddhota
    vedishadatithi rduronasat | nrishadvarasa dabja goja ritaja adrija rita divamanu vi kramasva nirbhakta
    njajne agnirasma mpari jatavedah | tritiyamaphsu nrimana ajasramindhana ena njarate svadhih || vidma
    te agne tredha trayani vidma te sadma vibhrita mpurutra | vidma te nama parama nguha yadvidma tamuthsam
    ya~ta ajagantha || samudre tva nrimana aphsvantarnricaksha idhe divo agna udhann | tritiye rajasi
    tasthivagm samritasya rajasi tasthivagm samritasya yonau mahisha ahinvann || akrandadagni sstanayanniva
    dyauh dvirudhah samanjann | sadyo jajnano vi himiddho akhyada rodasi bhanuna bhatyantah || ushi shvagniramrito
    nidhayi | iyarti dhumamarusha mbharibhraducchukrena shocisha dyaminakshat || vishvasya keturbhuvanasya
    garbha a rodasi aprinajjayamanah | vidu tparayan jana yadagnimayajanta panca || shrinamudaro dharuno
    rayina ssahaso aphsu raja vi bhatyagra ushasamidhanah || yaste adya krinava ndeva ghritavantamagne
    | prata va~syo acchabhi dyumna mbhaja saushravaseshvagna uktha uktha a bhaja shasyamane | priya priyo
    agna bhavatyujjatena bhinadadujjanitvaih || tvamagne yajamana anu dyun vishva vasuni dadhire varyani
    | tvaya saha dravinamicchamana vraja ngomantamushijo vi vavruh || drishano rukma urvya vyadyau shamayuh
    shriye rucanah | agniramrito abhava 'nnasya no dehyanamivasya shushminah | pra pradatara nno dhehi
    dvipade catushpade || udu tva vishve deva agne bharantu cittibhih | sa no bhava shivatama ssupratiko
    vibhavasuh || predagne jyotishman yahi shivebhirarcibhistvam | brihadbhi nma higmsi stanuva nduvasyata
    ghritairbodhayatatithim | a havya juhotana || praprayamagnirbharatasya shrinve vi ya thsuryo na rocate
    brihadbhah | abhi yah puru mpritanasu tasthau didaya daivyo atithi shshivo nah || apo devih prati
    grihnita bhasmaita thsyone krinuddhvagm surabhavu loke | tasmai namanta mbibhrita svenam || aphsvagne
    sadhishtava aphsvagne sadhishtava saushadhiranu ruddhyase | saushadhiranu ruddhyase | garbhe sanjayase
    punah || garbho asyoshadhina ngarbho vanaspatinam | garbho vishvasya bhutasyagne garbho apamasi ||
    prasadya bhasmana yonimapashca prithivimagne | sagmsrijya matribhistva 'sadah || punarasadya sadanamapashca
    prithivimagne | sheshe maturyathopasthe 'ntarasyagm shivatamah || punarurja ni vartasva punaragna
    isha ''yusha | punarnah pahi vishvatah || saha rayya ni vartasvagne pinvasva dharaya | vishvaphsniya
    vishvataspari || punastva ''ditya rudra vasava mpunarbrahmano vasunitha yajnaih | ghritena tva ntanuvo
    vardhayasva satya ssantu yajamanasya kamah || bodha no asya vacaso yavishtha magmhishthasya prabhritasya
    svadhavah | piyati tvo anu tvo grinati vandaruste tanuvam va~nde agne || sa bodhi surirmaghava vasudava
    vasupatih | yuyoddhyasma apeta vita vi ca sarpatato ye 'tra stha purana ye ca nutanah | adadidam mprithivya
    akrannima mpitaro lokamasmai || agnerbhasma syagneh purishamasi sajnannamasi kamadharana ya~ vah priyastanuva
    mpriya hridayani vah | atma vo astu ssampriyastanuvo mama || ayagm so agniryasmin thsomamindrah suta
    ndadhe jathare vavashanah | sahasriyam nna saptigm sasavan thstuyase jatavedah || agne divo arnamaccha
    jigasyaccha devagm ucishe dhishniya ye | yah parasta drocane suryasya yashca vasta dupatishthanta
    apah || agne ya tte divi varcah prithivyam shvaphsu va yajatra | yenantariksha murvatatantha tvesha
    ssa bhanurarnavo nricakshah || purishyaso agnayah pravanebhih sajoshasah | jushantagm havyamahutamanamiva
    isho mahih || idamagne purudagm sagm sani shshashvattamagm havamanaya sadha | syannah sunustanayo
    vijava 'gne sa te sumatirbhu ritviyo yato jato arocathah | ta agna a rohatha no nnagna a rohatha no
    vardhaya rayim || cidasi taya devataya ddhruva sida paricidasi taya devataya mprinatho sida shiva
    tvam | indragni tva brihaspatirasmin yonavasishadann || ta asya sudadohasa ssomagg shrinanti prishnayah
    | janma vi~shastrishva rocane divah || nnashtacatvarigmshacca samitagm sankalpethagm sampriyau rocishnu
    sumanasyamanau | ishamurjamabhi sam vra~ta samu cittanya 'karam || agne purishyadhipa bhava tva ya~jamanaya
    dhehi || purishyastvamagne rayima npushtimagm asi | shivah kritva disha | ma yajnagm higmsishta njatavedasau
    shivau bhavatamadya nah || mateva putra mprithivi purishyamagnigg sve yonavabharukha | tam vi~danah
    prajapatirvishvakarma vi muncatu || yadasya pare rajasa 'gne vaishvanara svaha vi~ crita bandhametam
    | yamena tvam nnakamadhi rohayemam || yatte devi nir ritirababandha dama grivasva vicartyam | ida
    ya~yusho na maddhyadatha jivah pitumaddhi pramuktah || yasya ste asyah krura asanjuhomyesha mbandhanamavasarjanaya
    | bhumiriti tva jana vidurnir mpari veda vishvatah || asunvantama yajamanamiccha stenasyetyan taskarasyan
    veshi | anya masma diccha sa ta itya namo devi nir rite tubhyamastu || devimaha va~ndamanah piteva
    putra ndasaye vacobhih | vishvasya ya jayamanasya veda shirah shirah prati suri vi cashte || niveshana
    ssangamano vasunam shacibhih | deva iva savita satyadharmendro na tasthau samare pathinam || sam va~ratra
    dadhatana nirahavan krinotana | sincamaha avatamudrinam 'dastamakshitam || nishkritaha vamavatagm
    suvaratragm sushecanam | udrinagm since akshitam || sira yunjanti kavayo yuga vi tanvate prithak |
    dhira deveshu sumnaya || yunakta sira vi yuga tanota krite yonau vapateha m | gira ca shrushti ssabhara
    asanno nediya i thsrinya pakvama 'yat || langala mpaviravagm sushevagm sumatithsaru | udi nca pivarim
    | prasthava nnah phala vi tudantu bhumigm shuna nkinasha abhi yantu vahan | shuna mparjanyo madhuna
    payobhi shshunasira shunamasmasu dhattam || kama nkamadughe dhukshva mitraya varunaya ca | indrayagnaye
    pushna oshadhibhyah prajabhyah ||ghritena sita madhuna samakta vishvai rdevairanumata marudbhih |
    urjasvati payasa pinvamana ya jata oshadhayo devebhyastriyuga mpura | mandami babhrunamahagm shata
    ndhamani sapta ca || shatam ndhamani sahasramuta vo ruhah | atha shatakratvo yuyamima nkrita || pushpavatih
    prasuvatih phaliniraphala uta | ashva iva sajitvari rvirudhah parayishnavah || oshadhiriti matara
    rupa bruve | rapagmsi vighnatirita rapa shcatayamanah || ashvatthe vo nishadana mparne vo vasatih
    krita | gobhaja i thsanavatha purusham || yadaham nnima oshadhirhasta adadhe | atma yakshmasya nashyati
    pura jivagribho yatha || yadoshadhaya ssangacchante rajana ssamita viva | vipra rakshoha 'miva catanah
    || nishkriti stha sankritih | sarah patatrini sthana yada mayati nishkrita || anya vo anyamava 'nyasya
    upavata | ta mme pravata vacah || ucchushma oshadhina ngavo goshtha diverate | dhanagm sanishyanti
    namatmana ntava purusha || ati vishvah parishthah stena iva vrajamakramuh | oshadhayah pracucyavu
    rya nca tanuvagm rapah || ya ya~ avivishuh paruh paruh | taste yakshmam vi~badhanta mugro maddhyamashiriva
    || sakam ya~kshma pra pata shyenena kikidivina nnashya nihakaya || ashvavatigm somavati murjayanti
    mudojasam | a vithsi sarva oshadhirasma arishtatataye || yah phalinirya aphala apushpa yashca pushpinih
    | brihaspati prasuta stano muncantvagm hasah || ya ssomarajnih pravishtah prithivimanu | tasa ntvamasyuttama
    prano jivatave suva || avapatantiravada ndiva oshadhayah pari | ya njiva mashnava mahai na sa rishyati
    purushah || yashceda mupa shrinvanti yashca dura mparagatah | iha sangatya ta ndatta bheshajam ||
    ma vo risha tkhanita yasmai caha nkhanami vah | dvipa mastvanaturam || oshadhaya va~dante somena saha
    rajna | yasmai karoti brahmanastagm raja ma no higmsijjanita yah prithivya yo va divagm satyadharma
    jajana | yashcapashcandra brihatirjajana kasmai devaya havisha vidhema || abhyavartasva prithivi yajnena
    payasa saha | vapa nte agnirishito 'va sarpatu || agne ya ddevebhyo bharamasi || ishamurjamahamita
    a dada ritasya dhamno dada ritasya dhamno amritasya yoneh | a no goshu vishatvaushadhishu jahami sedimaniramamivam
    || agne tava shravo vayo mahi bhrajantyarcayo vibhavaso | briha dbhano shavasa vajamukthya ndadhasi
    dashushe kave || irajyannagne prathayasva jantubhirasme rayo amartya | sa dar shatasya vapusho vi
    rajasi prinakshi sanasigm rayim || urjo napajjataveda shcitro tayo vamajatah || pavakavarca shshukravarca
    anunavarca udiyar | putrah pitara vicarannupavasyubhe prinakshi rodasi || ritavana shanimagnigm sumnaya
    dadhire puro janah | shrutkarnagm saprathastama mmanusha yuga || nishkartara maddhvarasya pracetasa
    nkshayantagm radhase mahe | rati mprinakshi sanasigm rayim || citah stha paricita urdhvacitah shrayaddhva
    ssidata || a pyayasva sametu te vishvatah soma vrishniyam | bhava vajasya sangathe || sa nte payagmsi
    samu yantu vaja nyabhimatishahah | apyayamano amritaya soma divi shravagsyuttamani dhishva || mekannacatvarigmshacca
    dvishvah pritana aratistadagniraha tadu soma aha | brihaspatih savita tanma aha pusha ma thsukritasya
    loke || yadakrandah prathama thsamudraduta va purishat | shyenasya paksha harinasya bahu upastuta
    tte arvann || apa mprishthamasi yoniragne ssamudramabhitah pinvamanam | vardhamana ndivo matraya varina
    prathasva || brahma jajnana mpurastadvi simata ssuruco vena avah | sa buddhniya upama asya vishtha
    ssatashca yonimasatashca vivah || hiranyagarbha ssamavartatagre bhutasya jatah patireka asit | sa
    dadhara prithivi nkasmai devaya havisha vidhema || draphsashcaskanda prithivimanu nca yonimanu yashca
    purvah | tritiyam yo~nimanu sancaranta njuhomyanu sapta hotrah || namo astu sarpebhyo ye ke ca prithivimanu
    | ye antarikshe ye divi tebhyah sarpebhyo namah || ye 'do rocane divo ye va suryasya rashmishu | yeshamaphsu
    sadah krita ntebhyah sarpebhyo namah || ya ishavo yatu dhananam ~ye va vanaspatigmranu | ye va 'vateshu
    sherate tebhyah sarpebhyo namah || 'strita vishvakarmana sukrita | ma tva samudra udvadhinma suparno
    vyathamana prithivi ndrigmha || prajapatistva sadayatu prithivyah prishthe vyacasvati 'si prithivyasi
    bhurasi bhumirasyaditirasi vishvadhaya vishvasya bhuvanasya dhartri prithivim mma higmsirvishvasmai
    pranayapanaya vyanayodanaya pratishthayai 'bhi patu mahya svastya chardisha shantamena taya devataya
    ddhruva sida || kanda tprarohanti parushahparushah pari | eva no durve pra tanu sahasrena shatena
    ca || ya shatena pratanoshi sahasrena virohasi | tasya ste devishtake vidhema havisha vayam || ashadha
    'si sahamana sahasvarati ssahasva pritanyatah | sahasravirya asi sa ma jinva | 'si sa ma jinva ||
    madhu vata ritayate madhu ksharanti sindhavah | maddhvi ssantvoshadhih || madhu naktamutoshasi madhuma
    tparthivagm rajah | madhu dyaurastu nah pita || madhuma rmadhumagm astu suryah | maddhvirgavo bhavantu
    nah || mahi dyauh prithivi ca na imam mmimikshatam | piprita padagm sada pashyanti mpadagm sada pashyanti
    surayah | diviva cakshuratatam || dhruva 'si prithivi sahasva pritanyatah | syuta devebhiramritena
    ''gah || yaste agne surye ruca udyato divamatanvanti rashmibhih | tabhi ssarvabhi ruce janaya naskridhi
    || ya vo deva ssurye ruco goshvashveshu ya rucah | indra nno dhatta brihaspate || vira djyotiradharayat
    || agne yukshva hi ye tavashvaso deva sadhavah | aram va~hantyashavah || yukshva hi devahutamagm ashvagm
    agne rathiriva | ni hota purvya ssadah || draphsashcaskanda prithivimanu dyamima nca yonimanu yashca
    purvah | tritiyam yo~nimanu sancaranta njuhomyanu sapta vi~shvasya bhuvanasya vajinamagne shvanarasya
    ca | agnirjyotisha jyotishma nrukmo varcasa varcasvan || rice tva ruce tva sami thsravanti sarito
    na dhenah hrida manasa puyamanah || ghritasya dhara abhi cakashimi | hiranyayo vetaso maddhya asam
    || tasmin tkulayi bhajannaste madhu devata bhyah | tasya sa te haraya nduhana amritasya dhara thsahasrasya
    pratimam vi~shvarupam | pari vringdhi harasa ma nkrinuhi ciyamanah || ima mma higmsirdvipada mpashunagm
    sahasraksha medha a ciyamanah | mayumaranyamanu te dishami tena cinvanastanuvo ni shida || vatasya
    dhrajim va~runasya nabhimashva njajnanagm sarirasya maddhye nnadinagm harimadribuddhamagne ma higmsih
    parame vyomann || ima mma higmsirekashapha va~jineshu | gauramaranyamanu te dishami tena cinvanastanuvo
    ni shida || ajasramindumarusha mbhuranyumagnimide purvacittau namobhih | sa parvabhir ritushah kalpamano
    ga mma higmsiraditim m || imagm samudragm shatadharamu higmsih parame vyomann | higmsih parame vyomann
    | gavayamaranyamanu te dishami tena cinvanastanuvo ni shida || varu ntvashturvarunasya nabhimavi njajnanagm
    rajasah parasmat | mahigm sahasrimasurasya mayamagne ma higmsih parame vyomann || imamu ncatushpadam
    | tvashtuh prajana njanitramagne ma higmsih parame vyomann | ushtramaranyamanu te dishami tena cinvanastanuvo
    ni shida || yo agniragnesta tprithivya uta va divaspari | yena praja vishvakarma vyana ttamagne hedah
    pari te vrinaktu || aja hyagnerajanishta garbha thsa va apashyajjanitaramagre | taya rohamayannupa
    meddhyasastaya deva devatamagra ayann | sharabha maranyamanu te dishami tena cinvanastanuvo nishida
    || aditya mimandvipade mayum va~tasya 'shva mima mekashapha ngaurama jasrangavayam gni rocana divah
    pari vajeshu bhushathah | tadva dvritramuta sanoti vajamindra yo agni sahuri saparyat | irajyanta
    vasavyasya bhure ssahastama sahasa vajayanta shanibhyah pritana haveshu pra prithivya riricathe divashca
    | pra sindhubhyah pragiribhyo mahitva prendra gni vishva bhuvana 'tyanya || maruto yasya hi kshaye
    patha divo vimahasah | sa sugopatamo janah || yajnairva yajnavahaso viprasya va matinam | maruta mmimikshire
    te rashmibhista rikvabhi ssukhadayah | te vashimanta ishmino abhiravo vidre priyasya marutasya dhamnah
    || ava te heda uduttamam || kaya nashcitra a bhuvaduti sada vridha | kaya shacishthaya vrita || ||
    ko adya yunkte dhuri ga ritasya shimivato bhamino dur hrinayun | asannishun hrithsvaso mayobhun thsa
    jivat || agne naya ''devanagm shanno bhavantu vajevaje| aphsvagne sadhishtava saushadhiranu ruddhyase
    | garbhe sanjayase punah || vrisha soma dyumagm asi vrisha deva vrishavratah | vrisha dharmani dadhishe
    || ima ashtacatvarigmshat tvanno agne sa tvanno agne || harih om || || krishna yajurvediya taittiriya
    samhitaya ncaturtha kande dvitiyah prashna
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय संहिताया ञ्चतुर्थकाण्डे द्वीतीयः प्रश्नः श्री गुरुभ्यो नमः ।
    ह॒रिः॒ ओम् ॥ विष्णोः॒ क्रमो ऽस्यभिमाति॒हा गा॑य॒त्र ञ्छन्द॒ आ रो॑ह पृथि॒वीमनु॒ विक्र॑मस्व॒ निर्भ॑क्त॒
    न्द्वि॒ष्मो विष्णोः॒ क्रमो ऽस्यभिशस्ति॒हा त्रैष्टु॑भ॒ ञ्छन्द॒ आ रो॑हा॒न्तरि॑क्ष॒मनु॒ विक्र॑मस्व॒ निर्भ॑क्त॒
    न्द्वि॒ष्मो विष्णोः॒ क्रमो ऽस्यरातीय॒तो ह॒न्ता जाग॑त॒ ञ्छन्द॒ आ रो॑ह॒ दिव॒मनु॒ विक्र॑मस्व॒ निर्भ॑क्त॒
    न्द्वि॒ष्मो विष्णोः॒ ऽसि शत्रूय॒तो ह॒न्ता ञ्छन्द॒ आ रो॑ह॒ दिशो ऽनु॒ विक्र॑मस्व॒ निर्भ॑क्त॒ न्द्वि॒ष्मः
    ॥ अक्र॑न्दद॒ग्नि स्स्त॒नय॑न्निव॒ द्यौः द्वी॒रुधः॑ सम॒ञ्जन्न् । स॒द्यो ज॑ज्ञा॒नो वि हीमि॒द्धो अख्य॒दा
    रोद॑सी भा॒नुना॑ भात्य॒न्तः ॥ अग्ने ऽभ्यावर्तिन्न॒भि न॒ आ व॑र्त॒स्वा ऽऽयु॑षा॒ वर्च॑सा स॒न्या मे॒धया
    प्र॒जया॒ धने॑न ॥ अग्ने॑ न्ते॑ सन्त्वा॒वृतः॑ स॒हस्र॑ न्त उपा॒वृतः॑ । तासा॒ म्पोष॑स्य॒ पोषे॑ण॒ पुन॑र्नो
    न॒ष्टमा कृ॑धि॒ पुन॑र्नो र॒यिमा कृ॑धि ॥ पुन॑रू॒र्जा निव॑र्तस्व॒ पुन॑रग्न इ॒षा ऽऽयु॑षा । पुन॑र्नः पाहि
    वि॒श्वतः॑ ॥ स॒ह र॒य्या नि व॑र्त॒स्वाग्ने॒ पिन्व॑स्व॒ धार॑या । वि॒श्वफ्स्नि॑या वि॒श्व त॒स्परि॑ ॥ उदु॑त्त॒मं
    वँ॑रुण॒ पाश॑ म॒स्मदवा॑ श्र॑थाय । अथा॑ व॒यमा॑दित्य व्र॒ते तवाना॑गसो॒ अदि॑तये स्याम ॥ आ त्वा॑ म॒न्तर॑भूर्ध्रु॒वस्ति॒ष्ठा
    ऽवि॑चाचलिः । विश॑स्त्वा॒ सर्वा॑ वाञ्छन्त्व॒स्मि न्रा॒ष्ट्रमधि॑ श्रय ॥अग्रे॑ बृ॒हन्नु॒षसा॑मू॒र्ध्वो
