id: mahamantrarajastotram
category: mantra
name:
  english: mahamantrarajastotram
  devanagari: महामन्त्रराजस्तोत्रम्
content:
  english: bala se shrilakshmana shastri dvara shaka samvat 1888 mem apaka yaha stotra raca gaya hai |
    yaha bhaktajanom dvara ekamatra japaniya ho || 117|| isa stotraka pratidina ikkisa patha karane se
    patha karane vale janom ka sukhapurvaka sundara ramanama ka ikkisa hajara nau sau caubisa japa nishcaya
    hi ho jata hai
  devanagari: बल से श्रीलक्ष्मण शास्त्री द्वारा शक संवत् १८८८ में आपका यह स्तोत्र रचा गया है । यह भक्तजनों
    द्वारा एकमात्र जपनीय हो ॥ ११७॥ इस स्तोत्रका प्रतिदिन इक्कीस पाठ करने से पाठ करने वाले जनों का सुखपूर्वक
    सुन्दर रामनाम का इक्कीस हजार नौ सौ चौबीस जप निश्चय ही हो जाता है
meaning: {}
