id: brahmakritam1shrikrishnastotram
category: stotram
name:
  english: brahmakritam1shrikrishnastotram
  devanagari: ब्रह्मकृतं१श्रीकृष्णस्तोत्रम्
content:
  english: brahmakritam 1 shrikrishnastotram brahmovaca | sarvasvarupam sarvesham sarvakaranakaranam |
    sarvanirvacaniyam tam namami shivarupinam || 37|| navinajaladakaram shyamasundaravigraham | sthitam
    jantushu sarveshu nirliptam sakshirupinam || 38|| svatmaramam purnakamam jagadvyapijagatparam | sarvasvarupam
    sarvesham bijarupam sanatanam || 39|| sarvadharam sarvavaram sarvashaktisamanvitam | sarvaradhyam
    sarvagurum sarvamangalakaranam || 40|| sarvamantrasvarupam ca sarvasampatkaram varam | shaktiyuktamayuktam
    ca staumi svecchamayam vibhum || 41|| shaktisham shaktibijam ca shaktirupadharam varam | samsarasagare
    ghore shaktinaukasamanvitam || 42|| kripalum karnadharam ca namami bhaktavatsalam | atmasvarupamekantam
    liptam nirliptameva ca || 43|| sagunam nirgunam brahma staumi svecchasvarupinam | sarvendriyadidevam
    tamindriyalayameva ca || 44|| sarvendriyasvarupam ca viradrupam namamyaham | vedam ca vedajanakam
    sarvavedangarupinam || 45|| sarvamantasvarupam ca namami parameshvaram | saratsarataram dravyamapurvamanirupinam
    || 46|| svatantramasvatantram ca yashodanandanam bhaje | santam sarvasharireshu tamadrishtamanuhakam
    || 47|| dhyanasadhyam vidyamanam yogindranam gurum bhaje | rasamandalamadhyastham rasollasasamutsukam
    || 48|| gopibhih sevyamanam ca tam dharesham namamyaham | satam sadaiva santam tamasantamasatamapi
    || 49|| yogisham yogasadhyam ca namami shivasevitam | mantrabijam mantrarajam mantradam phaladam phalam
    || 50|| mantrasiddhisvarupam tam namami ca paratparam | sukham duhkham ca sukhadam duhkhadam punyameva
    ca || 51|| punyapradam ca shubhadam shubhabijam namamyaham | ityevam stavanam kritva dattva gashca
    sa balakan || 92|| nipatya dandavadbhumau ruroda prananama ca | dadarsha cakshurunmilya vidhata jagatam
    mune || 53|| brahmana ca kritam stotram nityam bhaktya ca yah pathet | iha loke sukham bhuktva yatyante
    shrihareh padam || 54|| labhate dasyamatulam sthanamishvarasannidhau | labdhva ca krishnasannidhyam
    parshadapravaro bhavet || 55|| iti shribrahmavaivartapurane shrikrishnajanmakhande purve vimshadhyayantargatam
    brahmakritam shrikrishnastotram samaptam | brahmavaivartapurana | shrikrishnajanma
  devanagari: ब्रह्मकृतं १ श्रीकृष्णस्तोत्रम् ब्रह्मोवाच । सर्वस्वरूपं सर्वेशं सर्वकारणकारणम् । सर्वानिर्वचनीयं
    तं नमामि शिवरूपिणम् ॥ ३७॥ नवीनजलदाकारं श्यामसुन्दरविग्रहम् । स्थितं जन्तुषु सर्वेषु निर्लिप्तं साक्षिरूपिणम्
    ॥ ३८॥ स्वात्मारामं पूर्णकामं जगद्व्यापिजगत्परम् । सर्वस्वरूपं सर्वेषां बीजरूपं सनातनम् ॥ ३९॥ सर्वाधारं
    सर्ववरं सर्वशक्तिसमन्वितम् । सर्वाराध्यं सर्वगुरुं सर्वमङ्गलकारणम् ॥ ४०॥ सर्वमन्त्रस्वरूपं च सर्वसम्पत्करं
    वरम् । शक्तियुक्तमयुक्तं च स्तौमि स्वेच्छामयं विभुम् ॥ ४१॥ शक्तीशं शक्तिबीजं च शक्तिरूपधरं वरम् ।
    संसारसागरे घोरे शक्तिनौकासमन्वितम् ॥ ४२॥ कृपालुं कर्णधारं च नमामि भक्तवत्सलम् । आत्मस्वरूपमेकान्तं
    लिप्तं निर्लिप्तमेव च ॥ ४३॥ सगुणं निर्गुणं ब्रह्म स्तौमि स्वेच्छास्वरूपिणम् । सर्वेन्द्रियादिदेवं
    तमिन्द्रियालयमेव च ॥ ४४॥ सर्वेन्द्रियस्वरूपं च विराड्रूपं नमाम्यहम् । वेदं च वेदजनकं सर्ववेदाङ्गरूपिणम्
    ॥ ४५॥ सर्वमन्तस्वरूपं च नमामि परमेश्वरम् । सारात्सारतरं द्रव्यमपूर्वमनिरूपिणम् ॥ ४६॥ स्वतन्त्रमस्वतन्त्रं
    च यशोदानन्दनं भजे । सन्तं सर्वशरीरेषु तमदृष्टमनूहकम् ॥ ४७॥ ध्यानासाध्यं विद्यमानं योगीन्द्राणां गुरुं
    भजे । रासमण्डलमध्यस्थं रासोल्लाससमुत्सुकम् ॥ ४८॥ गोपीभिः सेव्यमानं च तं धरेशं नमाम्यहम् । सतां सदैव
    सन्तं तमसन्तमसतामपि ॥ ४९॥ योगीशं योगसाध्यं च नमामि शिवसेवितम् । मन्त्रबीजं मन्त्रराजं मन्त्रदं फलदं
    फलम् ॥ ५०॥ मन्त्रसिद्धिस्वरूपं तं नमामि च परात्परम् । सुखं दुःखं च सुखदं दुःखदं पुण्यमेव च ॥ ५१॥ पुण्यप्रदं
    च शुभदं शुभबीजं नमाम्यहम् । इत्येवं स्तवनं कृत्वा दत्त्वा गाश्च स बालकान् ॥ ९२॥ निपत्य दण्डवद्भूमौ
    रुरोद प्रणनाम च । ददर्श चक्षुरुन्मील्य विधाता जगतां मुने ॥ ५३॥ ब्रह्मणा च कृतं स्तोत्रं नित्यं भक्त्या
    च यः पठेत् । इह लोके सुखं भुक्त्वा यात्यन्ते श्रीहरेः पदम् ॥ ५४॥ लभते दास्यमतुलं स्थानमीश्वरसन्निधौ
    । लब्ध्वा च कृष्णसान्निध्यं पार्षदप्रवरो भवेत् ॥ ५५॥ इति श्रीब्रह्मवैवर्तपुराणे श्रीकृष्णजन्मखण्डे
    पूर्वे विंशाध्यायान्तर्गतं ब्रह्मकृतं श्रीकृष्णस्तोत्रं समाप्तम् । ब्रह्मवैवर्तपुराण । श्रीकृष्णजन्म
