id: shakyasimhastotram-6
category: stotram
name:
  english: shakyasimhastotram 6
  devanagari: शाक्यसिंहस्तोत्रम् ६
content:
  english: dyatkanta bhumidevi svaganaparivrita bhedayitva'vanim tam | sthitvagre pujayitva namucimabhigatam
    bhartsayitva dvishantam sakshibhuta nilina pranamitashirasa tvam name'ham jinendram || 5|| yasyodgrivasya
    cagre vidhiharamadhuhrillokasamsthaih pravinair drashtum naivabhishaktya kimu manujapure vasitairmadrishaishca
    | brahmandam langhayitva taranishashadharau dyaushca nakshatralokam urdhvam lokottarakhye nijabhuvanavare
    bhasitam tvam name'ham || 6|| yadvaktram pankajabham suradanavasanakarnikakesaradhyam brahmandam jumbhate'smin
    bhuvanaganavrittam samshritam karnikavat | drishtva sammurcchito'bhunnamuciranucaraistrasi sarvajnanatha
    kritva kecitprayatah sharanamabhimatam shrighanam tvam name'ham || 7|| sankhyajnanapravinastribhuvanasadane
    pandita ye vasanti taih sarvairmilayitva yadi tava mahima varnyate kalpakalam | param gantum samartha
    nahi nikhilagunakshirasindhoh kathancid ekaki kim samarthastadapi mama mano bodhanartham name tvam
    || 8|| pathyante stotrametatsurapatiracitam sragdharavrittasamjnam shakradya lokapalah pratipadanucarah
    sankarishyanti raksham | saukhyam bhuktveha loke tadanu surapateh kalpavrikshabhikirne sthitva gacchanti
    cante sugatasutamahim sarvalaukaikagamyam || 9|| iti surapatikritam shrishakyasimhastotram sampurnam
    ||
  devanagari: द्यत्कान्ता भूमिदेवी स्वगणपरिवृता भेदयित्वाऽवनिं ताम् । स्थित्वाग्रे पूजयित्वा नमुचिमभिगतं
    भर्त्सयित्वा द्विषन्तं साक्षीभूता निलीना प्रणमितशिरसा त्वां नमेऽहं जिनेन्द्रम् ॥ ५॥ यस्योद्ग्रीवस्य
    चाग्रे विधिहरमधुहृल्लोकसंस्थैः प्रवीणैर् द्रष्टुं नैवाभिशक्त्या किमु मनुजपुरे वासितैर्मादृशैश्च ।
    ब्रह्माण्डं लङ्घयित्वा तरणिशशधरौ द्यौश्च नक्षत्रलोकं ऊर्ध्वं लोकोत्तराख्ये निजभुवनवरे भासितं त्वां
    नमेऽहम् ॥ ६॥ यद्वक्त्रं पङ्कजाभं सुरदनवसनाकर्णिकाकेसराढ्यं ब्रह्माण्डं जूम्भतेऽस्मिन् भुवनगणवृत्तं
    संश्रितं कर्णिकावत् । दृष्ट्वा सम्मूर्च्छितोऽभून्नमुचिरनुचरैस्त्रासि सर्वज्ञनाथ कृत्वा केचित्प्रयाताः
    शरणमभिमतं श्रीघनं त्वां नमेऽहम् ॥ ७॥ सङ्ख्याज्ञानप्रवीणास्त्रिभुवनसदने पण्डिता ये वसन्ति तैः सर्वैर्मीलयित्वा
    यदि तव महिमा वर्ण्यते कल्पकालम् । पारं गन्तुं समर्था नहि निखिलगुणक्षीरसिन्धोः कथञ्चिद् एकाकी किं समर्थास्तदपि
    मम मनो बोधनार्थं नमे त्वाम् ॥ ८॥ पठ्यन्ते स्तोत्रमेतत्सुरपतिरचितं स्रग्धरावृत्तसंज्ञं शक्राद्या लोकपालाः
    प्रतिपदनुचराः सङ्करिष्यन्ति रक्षाम् । सौख्यं भुक्त्वेह लोके तदनु सुरपतेः कल्पवृक्षाभिकीर्णे स्थित्वा
    गच्छन्ति चान्ते सुगतसुतमहीं सर्वलौकैकगम्याम् ॥ ९॥ इति सुरपतिकृतं श्रीशाक्यसिंहस्तोत्रं सम्पूर्णम्
    ॥
