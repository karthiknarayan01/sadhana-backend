id: nrisimhastotram-5
category: stotram
name:
  english: nrisimhastotram 5
  devanagari: नृसिंहस्तोत्रम् ५
content:
  english: shrinrisimhastotram 5 shriganeshaya namah | om namo bhagavate viranarasimhaya karalamukhaya
    | aghora narasimhaya | raudragnijvalanarasimhaya | prajvalitanetratrayaya | kalagniraudravataraya
    | jvalanarasimhaya | naramriganakhadamshtrakaralamukhaya | hiranyakshachedanaya | raktamamsograsevitaya
    | paramajyotivadavanalashri viranarasimhaya | vikramarudrakaravishvarupastambhodbhavaya | rava rava
    rajata rajata urjita urjita dhagadhagata gaccha gaccha | bhugola bhugola brahmandabhairavaya | tandavanarasimhaya
    | prahladavaradaya | shrikeshavadirupaya | dashavidhavataraya | ekadasharudradvadashabhanutejajvalanarasimhaya
    | manavaguruprasada jaramaranadaridrayanivaranaya svaha | mantrayantratantrarakshanaya | sarvabhutapretapishacannashaya
    | yaksharakshasabrahmarakshasashakinidakinikaminigandharvaparavidya
  devanagari: श्रीनृसिंहस्तोत्रम् ५ श्रीगणेशाय नमः । ॐ नमो भगवते वीरनारसिंहाय करालमुखाय । अघोर नारसिंहाय
    । रौद्राग्निज्वालानारसिंहाय । प्रज्वलितनेत्रत्रयाय । कालाग्निरौद्रावताराय । ज्वालानारसिंहाय । नरमृगनखदंष्ट्राकरालमुखाय
    । हिरण्याक्षछेदनाय । रक्तमांसोग्रसेविताय । परमज्योतिवडवानलश्री वीरनारसिंहाय । विक्रमरुद्राकारविश्वरूपस्तम्भोद्भवाय
    । रव रव रजत रजत ऊर्जित ऊर्जित धगधगत गच्छ गच्छ । भूगोल भूगोल ब्रह्माण्डभैरवाय । ताण्डवनारसिंहाय । प्रह्लादवरदाय
    । श्रीकेशवादिरूपाय । दशविधावताराय । एकादशरुद्राद्वादशभानुतेजज्वालानारसिंहाय । मानवगुरुप्रसाद जरामरणदारिद्रयनिवारणाय
    स्वाहा । मन्त्रयन्त्रतन्त्ररक्षणाय । सर्वभूतप्रेतपिशाचान्नाशय । यक्षराक्षसब्रह्मराक्षसशाकिनीडाकिनीकामिनीगान्धर्वपरविद्या
meaning: {}
