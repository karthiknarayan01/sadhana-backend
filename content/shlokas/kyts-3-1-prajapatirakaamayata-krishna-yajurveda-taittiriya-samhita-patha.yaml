id: kyts-3-1-prajapatirakaamayata-krishna-yajurveda-taittiriya-samhita-patha
category: stotram
name:
  english: KYTS 3.1 Prajapatirakaamayata - Krishna Yajurveda Taittiriya Samhita Patha
content:
  english: krishna yajurvediya taittiriya samhitaya ntritiyakande prathamah prashnah shri gurubhyo namah
    | harih om || prajapatirakamayata praja ssrijeyeti sa tapo 'tapyata sa sarpanasrijata so ssrijeyeti
    sadvitiyamatapyata sa vayagsya srijata so ssrijeyeti sa tritiyamatapyata sa eta ttato vai sa praja
    asrijata ya va~dati praja eva tadyajamana smaddikshakramati nilamasya haro vye ssuryo jyotishagshreshtho
    dikshe ma mahasirityaha nasma 'pakramati nasya nila nna haro vyeti yadvai di nirghnantyundati ndhattaujo
    dhatta bala ndhatta ma me diksha mma taponirvadhishtetyahai tadeva sarvamatma ndhatte nasyaujo bala
    nna taponirghnantyagnirvai di kshitasya devata so shvaragm rakshagmsi hanto shreyah prehibrihaspatih
    pura eta te astvityahabrahma vai devana mbrihaspatistamevanva rabhate sa enagm sa mparayatye damaganma
    devayajana mprithivya ityaha devayajanagg hyesha prithivya agacchati yo yajate vishve deva yadajushanta
    purva ityaha vishve hyetaddeva joshayante yadbra hmana rikhsamabhyam ya~jusha santaranta ityaharkhsamabhyag
    hyesha yajusha santarati yo yajate rayasposhena samisha esha te gayatro bhaga iti me somaya brutadesha
    te traishtubho jagato bhaga iti me somaya brutacchandomanagm samra ngaccheti me somaya bruta dyo vai
    somagm rajanagm samra ngamayitva krinati gacchati svanagm samra nchandagmsi khalu vai somasya rajna
    jyo lokah purasta thsomasya krayadevamabhi mantrayeta samra ngamayitva krinati gacchati svanagm samra
    yo~ vai tanunaptrasya pratishtham ve~da pratyeva tishthati brahmavadino vadanti na prashnanti na juhvatyatha
    kva tanunaptra mprati tishthatiti prajapatau manasiti bruya tprajapatau tva manasi juhomityesha vai
    tanunaptrasya pratishtha ya evam ve~da pratyeva tishthati yo pratyeva tishthati yah va addhvaryoh
    pratishtham ve~da pratyeva tishthati yato manyetanabhikramya hoshyamiti ta ttishthanna shravayedesha
    va addhvaryoh pratishtha ya evam ve~da pratyeva tishthati yadabhikramya juhuya tpratishthaya iya thsamanatra
    tishthata hotavya mpratishthityai yo va addhvaryo ve~da svavaneva bhavati srugva asya svam ttasma
    danvarabhya ''shravyagg svadeva naiti yo vai somama pratishthapya stotra mupakarotya pratishthita
    ssomo bhavatyapratishthita nyukthanyapratishthito yajamano 'pratishthito 'dhvaryurva yavyam vai~ somasya
    pratishtha camaso 'sya pratishtha soma sstomasya stoma ukthana va~ grihitva camasam vo~nniya stotramupa
    kurya tpratyeva somagg sthapayati pratistoma mpratyukthani prati yajamanastishthati pratyaddhvaryuh
    || thsomakrayanyai padam ya~jnamukhagm havirdhane yar hi havirdhane praci dyajnamukha eva yajnamanu
    santanoti prancamagni tpatnima nayantyanvanagmsi pra vartayantyatha va asyaisha dhishniyo hiyate so
    shvaro rudro bhutva yajamanasya shamayitoryar hi pashuma pritamudanca hi tasya pashushrapanagm hare
    nkaroti yajamano va ahavaniyo yajamanam tpashushrapanagm haranti sa vaiva syannirmanthyam dyajamanasya
    satmatvaya yadi pashoravadana nnashyedajyasya pratyakhyayamava dye thsaiva tatah prayashcittirye pashum
    yastan kamayeta ''rtimarccheyuriti kuvidangeti namo vriktivatyarca ddhre juhuyannamo vriktimevaisham
    vri~nkte tajagartimarcchanti || prajapaterjayamanah praja jatashca ya imah | tasmai prati pra vedayacikitvagm
    anu manyatam || ima mpashupate te adya baddhnamyagne sukritasya maddhye | anu manyasva suyaja yajama
    jushta ndevanamidamastu havyam || prajanantah pratigrihnanti purve bhyah paryacarantam | suvargam
    ya~hi pathibhi rdevayanai roshadhishu pratitishtha shariraih || yeshamishe ncatushpadamuta ca dvipada
    mbhagametu rayasposha yajamanasya santu || ye baddhyamanamanu baddhyamana abhyaikshanta manasa cakshusha
    ca | agnistagm agre pramumoktu devah prajapatih prajaya sam vi~danah || ya aranyah pashavo vishvarupa
    virupa ssanto bahudhaikarupah | vayustagm agre pramumoktu devah prajapatih prajaya sam vi~danah ||
    pramuncamana bhuvanasya reto gatu ndhatta yajamanaya devah | upakritagm shashamanam ndevanamapyetu
    pathah || nana prano yajamanasya pashuna yajno devebhih saha devayanah | jiva ndevanamapyetu pathah
    satya ssantu yajamanasya kamah tpashurmayumakritoro va padbhirahate | agnirma tasmadenasovishva nmuncatvagmhasah
    || shamitara upetana yajna devebhirinvitam | ndevebhirinvitam | pasha mpramuncata bandhadyajnapati
    mpari || aditih pasha nnamah pashubhyah pashupataye karomi || aratiyanta nprati muncami pasha m ||
    tvamu te dadhire havyavahagm shritankartaramuta yajniya nca | agne sadaksha ssatanurhi bhutva 'tha
    havya jatavedo jushasva || jatavedo vapaya gaccha devantvagm hi hota prathamo babhutha | ghritena
    tva ntanuvo vardhayasva svahakritagm haviradantu devah || svaha devebhyo devebhya prajapatya vai pashavasteshagm
    rudro mupa karoti tabhyamevaina vraskaya dvabhyamupakaroti dvipadyajamanah pratishthitya upakritya
    panca juhoti panktah pashavah pashuneva varundhemrityave va esha niyate ya ya~danvarabheta pramayuko
    yajamana prano yajamanasya pashunetyaha vyavrittyai makriteti juhoti shantyai shamitara upetanetyaha
    yathayajurevaitadvapayam 'pa kramati tvamu te dadhire havyavahamiti vapamabhi juhotyagnereva medhamava
    rundhe 'tho shritatvaya purasta thsvaha kritayo va anye deva uparishta 'nye svaha devebhyo devebhya
    ssvahetyabhito vapa njuhoti tanevobhaya ya~jnamupacaratya devata bhyo vrishcyate papiya nbhavati yo
    yathadevatanna devata bhya a vrishcyate vasiya nbhavatyagneyyarca ''gni dvaishnavya havirdhanamagneyya
    sruco vayavyaya vayavya nyaindriya sado yathadevatameva yajnamupa carati na devata bhya a vrishcyate
    vasiya nbhavati yunajmi te prithivi njyotisha saha yunajmi vayumantarikshena te saha yunajmi vacagm
    saha suryena te yunajmi tisro viprica ssuryasya te | agnirdevata gayatri chanda upagmshoh patramasi
    somo devata 'ntaryamasya patramasindro devata jagati chanda indravayuvoh patramasi brihaspati pchando
    mitravarunayoh patramasyashvinau devata panktishchando 'shvinoh patramasi suryo devata brihati chandah
    shukrasya patramasi candrama devata sato brihati chando manthinah patramasi vishvedeva devatoshniha
    chanda agrayanasya patramasindro devata kakucchanda ukthana mpatramasi prithivi devata virat chando
    dhruvasya patramasi || ishtargo va addhvaryuryajamanasyeshtargah khalu vai purvo shcidabhishastya
    iti pura prataranuvakajjuhuyadatmana eva tadaddhvaryuh purastaccharma nahyate ve~shaya tvopaveshaya
    tva gayatriya strishtubho jagatya abhibhu tyai svaha pranapanau mrityorma pata mpranapanau ma ma hasishta
    ndevatasu va ete pranapanayo rvyayacchante yeshagm somah samricchate sam ve~shaya tvopaveshaya tvetyaha
    chandagmsi vai sam ve~sha upaveshashchandobhirevasya chandagmsi vrinkte pretivantyajyani bhavantyabhijityai
    marutvatih pratipado vijitya ubhe brihadrathantare bhavata iyam va~va rathantaramasau brihadabhyamevainamantare
    tyadya vava rathantaragg shvo brihadadyashva devainamantareti bhutam mbhavishyatashcantareti va~va
    rathantaramaparimita 'ntareti vishvamitrajamadagni vasishthenaspardhetagmsa etajjamadagni rvihavyama
    pashya ttena vai sa vasishthasyendriyam vi~ryamavrinkta yadvihavyagm shasyata indriyameva tadviryam
    ya~jamano bhratrivyasya vrinkte yasya bhuyagmso yajnakratava ityahu ssa devata vrinkta iti yadyagnishtoma
    nkurvita yadyukthyah syadatiratra nkurvita yajnakratubhirevasya devata vrinkte vasiya sstha devashruta
    ayurme tarpayata prana mme tarpayata cakshurme tarpayata shrotra mme tarpayata manome tarpayata vaca
    mme tarpayatangani me tarpayata praja nme tarpayata sarvagana mma tarpayata tarpayata ma gana me ma
    vi trishannoshadhayo vai somasya visho vishah khalu vai rajnah pradatorishvara aindra vo~ manasa sujata
    ritaprajata bhaga idvah syama | indrena devirvirudhah sam vi~dana anu manyantagm savanaya somamityahaushadhibhya
    evainagg svayai visha ssvayai devatayai niryacyabhi shunoti yo vai somasyabhishuyamanasya somasyabhishuyamanasya
    hantostamabhi mantrayeta thsaha prajaya saha rayasposhenendriya mma nivardhirityashishamevaitama sha
    sta indriyasya viyar sya prajayai pashunamanirghataya draphsashcaskanda prithivimanu dyamimanca yonimanu
    yashca purvah | tritiyam yo~nimanu sancaranta njuhomyanu sapta hotrah ndevayashasenarpayati manushya
    nmanushyayashasena devayashasyeva deveshu bhavati manushyayashasi manushyeshu ya ttanupagmshu grihniyadyanurdhvag
    stanupabdimato devaneva taddevayashasena nmanushyayashasena devayashasyeva deveshu bhavati manushyayashasi
    manushye shvagnih pratassavane pa shvanaro mahina vishvashambhuh | sa nah pavako dravina ssyama ||
    vishve deva maruta indro asmanasmi ndvitiye savane na jahyuh | ayushmantah priyamesham ndevanagm sumatau
    syama || ida nkavinamritena ye camasamairayanta | te saudhanvana nno abhi vasiyo nayantu || ayatanavatirva
    anya ahutayo huyante 'nayatana anya ya agharavatista ayatanavatirya ssaumyasta anayatana ai ''gharama
    gharayedaddhvaro yajno 'yamastu deva oshadhibhyah pashave no janaya vishvasmai bhutaya 'si sa pinvasva
    ghritavaddeva someti saumya eva tadahutirayatanavatih karotyayatanava ve~datho dyavaprithivi eva ghritena
    vyunatti te vyutte upajivaniye bhavata upajivaniyo bhavati ve~daisha te rudrabhago ya njushasva vidergaupatyagm
    rayasposhagm suviryagm sam va~thsarinag svastim || manuh putrebhyo dayam tkatha ma nirabhagiti na
    tva nirabhakshamitya bravidangirasa ime satramasate te nna prajananti tebhya ida mbruhi te suvargam
    ste dasyantiti tade ya~jnavastau rudra a 'bravinmama va ime pashava ityadurvai mahyamimanityabravinna
    vai tasya ta ishata ityabravi dyajnavastau hiyate mama vai taditi tasma dyajnavastu nabhyavetyagm
    so dyajne ma ''bhajatha te pashu nnabhi maggsya iti tasma eta ttato vai tasya rudrah pashu nnabhyamanyata
    yatraita mevam njuhoti na tatra rudrah pashunabhi manyate || jushto vaco bhuyasa njushto vacaspataye
    devi vak | yadvaco madhuma ssvaha sarasvatyai || rica stomagm samardhaya gayatrena rathantaram | briha
    dgayatravartani ||yaste sskandati yaste agmshurbahucyuto dhishanayorupastha t | addhvaryorva pari
    yaste pavitra thsvahakritamindraya ta njuhomi || yo draphso agmshuh patitah prithivya tkarambhat |
    dhanasomanmanthina indra shukra thsvahakritamindraya ta draphso madhumagm indriyavan thsvahakritah
    punarapyeti devan | divah prithivyah paryantariksha thsvaha kritamindraya ta njuhomi || addhvaryurva
    ritvija mprathamo yujyate tena stomo yoktavya ityahurvagagrega agra etvrijuga devebhyo yasho mayi
    dadhati prana ca yajamane cetyaha vacameva tadyajnamukhe yunakti vastu va etadyajnasya kriyate yadgraha
    ngrihitva bahishpavamanagm sarpantipara nco hi yanti paracibhi sstuvate vaishnavyarca punaretyopa
    tishthate yajno vai vishnu ryajnamevakarvishno tvanno antama shsharma yaccha sahantya | pra te dhara
    madhushcuta uthsa nduhrate akshitamityaha yadevasya shayanasyopashushyati tadevasyaitena ''pyayayati
    || agnina rayimashnava tposhameva divedive | yashasam vi~ravattamam || gomagm agne 'vimagm ashvi yajno
    nrivathsakha sadamidapramrishyah | idavagm esho asura prajava ndirgho rayih prithubudhna ssabhavan
    || apyayasva || iha tvashtaramagriyam vi~shvarupamupa hvaye | asmakamastu kevalah || tannasturipamadha
    poshayitnu deva tvashtarvi rarana ssyasva | yato virah karmanyah sudaksho karmanyah sudaksho yuktagrava
    jayate devakamah ||shivastvashtariha '' gahi vibhuh posha utatmana | yajneyajne na udava || pishangarupa
    shshrushti viro jayate devakamah | praja ntvashta vishyatu nabhimasme atha devanamapyetu pathah ||
    pranode vya no divah || pipivagm sagm sarasvata shatah | dhukshimahi prajamisha || ye te sarasva urmayo
    madhumanto ghritashcutah | tesha nte sumnamimahe || yasya vrata mpashavo yanti sarve yasya vratamupatishthanta
    apah | yasya vrate pushtipatirnivishtastagm sarasvantamavase huvema || divyagm suparnam vri~shabhamoshadhinam
    | abhipato vrishtya tarpayanta ntagm sarasvantamavase huvema || sinivali prithushtuke ya devanamasi
    svasa ndevi dididdhi nah || ya supani ssushuma bahusuvari | tasyai vishpatniyai havi ssinivalyai juhotana
    || indram nnarah || asitavarna haraya ssuparna miho vasana divamu tprithivi ghritairvyudyate || hiranyakesho
    rajaso visare 'hirdhunirvata iva dhrajiman | shucibhraja ushaso rapasyuvo na satyah || a te suparna
    aminanta evaih krishno nonava vrishabho yadidam | shivabhirna smayamanabhira tpatanti mihah stanayantyabhra
    || vashreva vidyunmimati vathsa nna mata sishakti | yadesham vri~shtirasarji || parvatashcinmahi vriddho
    bibhaya divashci thsanu rejata svane vah | ya rishtimanta apa iva saddhriyanco dhavaddhve || abhi
    kranda stanaya garbhama dha udanvata pari diya rathena | dritigm su kar nnyancagm sama bhavantudvata
    nipadah || tva 'gne pashurna yavase | dhama ha ya tte ajara vana vrishcanti shikvasah || agne bhurini
    tava jatavedo deva svadhavo 'mritasya dhama | yashca vi~shvaminva tve purvi ssandadhuh prishtabandho
    || divo no vrishti mprapinvata vrishno ashvasya dharah | arvametena stanayitnunehyapo nishincannasurah
    pita nah || pinvantyapo marutah sudanavah payo ghritavadvidathe nna mihe vi nayanti vajinamuthsa nduhanti
    stanayantamakshitam || udapruto marutastagm iyarta vrishtim ~ye vishve maruto junanti | kroshati garda
    kanyeva tunna peru ntunjana patyeva jaya || ghritena dyavaprithivi madhuna samukshata payasvatih krinata
    nca pinvatha yatra naro maruta ssincatha madhu || udutyam bhriguvacchucimapnavanavada huve | agnigm
    samudravasasam || a savagm savituryatha bhagasye va bhujigm huve | agnigm samudravasasam || huve vatasvana
    mparjanyakrandyagm sahah | agnigm samudravasasam || prajapaterjayamanah prajapaterjayamana agnigm
    samudravasasam || harih om || || krishna yajurvediya taittiriya samhitaya ntritiyakande prathamah
    prashna
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय संहिताया न्तृतीयकाण्डे प्रथमः प्रश्नः श्री गुरुभ्यो नमः । ह॒रिः॒
    ओम् ॥ प्र॒जाप॑तिरकामयत प्र॒जा स्सृ॑जे॒येति॒ स तपो॑ ऽतप्यत॒ स स॒र्पान॑सृजत॒ सो॑ स्सृ॑जे॒येति॒ सद्वि॒तीय॑मतप्यत॒
    स वयाग्॑स्य सृजत॒ सो॑ स्सृ॑जे॒येति॒ स तृ॒तीय॑मतप्यत॒ स ए॒त त्ततो॒ वै स प्र॒जा अ॑सृजत॒ य वँद॑ति प्र॒जा
    ए॒व तद्यज॑मान स्माद्दी॒क्षाक्रा॑मति॒ नील॑मस्य॒ हरो॒ व्ये स्सूर्यो॒ ज्योति॑षा॒ग्॒श्रेष्ठो॒ दीक्षे॒
    मा मा॑हासी॒रित्या॑ह॒ नास्मा ऽप॑क्रामति॒ नास्य॒ नील॒ न्न हरो॒ व्ये॑ति॒ यद्वै दी निर्घ्न॑न्त्युन्द॒ती
    न्ध॒त्तौजो॑ धत्त॒ बल॑ न्धत्त॒ मा मे॑ दी॒क्षा म्मा तपो॒निर्व॑धि॒ष्टेत्या॑है॒ तदे॒व सर्व॑मा॒त्म न्ध॑त्ते॒
    नास्यौजो॒ बल॒ न्न तपो॒निर्घ्न॑न्त्य॒ग्निर्वै दी क्षि॒तस्य॑ दे॒वता॒ सो श्व॒रग्ं रक्षाग्ं॑सि॒ हन्तो
    श्रेयः॒ प्रेहि॒बृह॒स्पतिः॑ पुर ए॒ता ते॑ अ॒स्त्वित्या॑ह॒ब्रह्म॒ वै दे॒वाना॒ म्बृह॒स्पति॒स्तमे॒वान्वा
    र॑भते॒ स ए॑न॒ग्ं॒ स म्पा॑रय॒त्ये दम॑गन्म देव॒यज॑न म्पृथि॒व्या इत्या॑ह देव॒यज॑न॒ग्ग्॒ ह्ये॑ष पृ॑थि॒व्या
    आ॒गच्छ॑ति॒ यो यज॑ते॒ विश्वे॑ दे॒वा यदजु॑षन्त॒ पूर्व॒ इत्या॑ह॒ विश्वे॒ ह्ये॑तद्दे॒वा जो॒षय॑न्ते॒ यद्ब्रा
    ह्म॒णा ऋ॑ख्सा॒माभ्यां॒ यँजु॑षा स॒न्तर॑न्त॒ इत्या॑हर्ख्सा॒माभ्या॒ग्॒ ह्ये॑ष यजु॑षा स॒न्तर॑ति॒ यो यज॑ते
    रा॒यस्पोषे॑ण॒ समि॒षा ए॒ष ते॑ गाय॒त्रो भा॒ग इति॑ मे॒ सोमा॑य ब्रूतादे॒ष ते॒ त्रैष्टु॑भो॒ जाग॑तो भा॒ग
    इति॑ मे॒ सोमा॑य ब्रूताच्छन्दो॒माना॒ग्ं॒ साम्रा ङ्ग॒च्छेति॑ मे॒ सोमा॑य ब्रूता॒ द्यो वै सोम॒ग्ं॒ राजा॑न॒ग्ं॒
    साम्रा ङ्ग॑मयि॒त्वा क्री॒णाति॒ गच्छ॑ति॒ स्वाना॒ग्ं॒ साम्रा ञ्छन्दाग्ं॑सि॒ खलु॒ वै सोम॑स्य॒ राज्ञ॒
    ज्यो लो॒कः पु॒रस्ता॒ थ्सोम॑स्य क्र॒यादे॒वम॒भि म॑न्त्रयेत॒ साम्रा ङ्ग॑मयि॒त्वा क्री॑णाति॒ गच्छ॑ति॒
    स्वाना॒ग्ं॒ साम्रा योँ वै ता॑नून॒प्त्रस्य॑ प्रति॒ष्ठां वेँद॒ प्रत्ये॒व ति॑ष्ठति ब्रह्मवा॒दिनो॑ वदन्ति॒
    न प्रा॒श्ञन्ति॒ न जु॑ह्व॒त्यथ॒ क्व॑ तानून॒प्त्र म्प्रति॑ तिष्ठ॒तीति॑ प्र॒जाप॑तौ॒ मन॒सीति॑ ब्रूया॒
    त्प्र॒जाप॑तौ त्वा॒ मन॑सि जुहो॒मीत्ये॒षा वै ता॑नून॒प्त्रस्य॑ प्रति॒ष्ठा य ए॒वं वेँद॒ प्रत्ये॒व ति॑ष्ठति॒
    यो प्रत्ये॒व ति॑ष्ठति॒ यः वा अ॑द्ध्व॒र्योः प्र॑ति॒ष्ठां वेँद॒ प्रत्ये॒व ति॑ष्ठति॒ यतो॒ मन्ये॒तान॑भिक्रम्य
