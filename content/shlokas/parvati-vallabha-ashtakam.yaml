id: parvati-vallabha-ashtakam
category: stotram
name:
  english: Parvati Vallabha Ashtakam
content:
  english: namo bhutanatham namo devadevam namah kalakalam namo divyatejam | namah kamabhasmam namah shantashilam
    bhaje parvativallabham nilakantham || || sada tirthasiddham sada bhaktaraksham sada shaivapujyam sada
    shubhrabhasmam | sada dhyanayuktam sada jnanatalpam bhaje parvativallabham nilakantham || || shmashane
    shayanam mahasthanavasam shariram gajanam sada carmaveshtam | pishacadinatham pashunam pratishtham
    bhaje parvativallabham nilakantham || || phaninagakanthe bhujangadyanekam gale rundamalam mahavira
    shuram | kativyaghracarmam citabhasmalepam bhaje parvativallabham nilakantham || || shirah shuddhaganga
    shiva vamabhagam viyaddirghakesham sada mam trinetram | phaninagakarnam sada phalacandram bhaje parvativallabham
    nilakantham || || kare shuladharam mahakashtanasham suresham paresham mahesham janesham | dhaneshamaresham
    dhvajesham girisham bhaje parvativallabham nilakantham || || udasam sudasam sukailasavasam dharanirjhare
    samsthitam hyadidevam | ajam hemakalpadrumam kalpasevyam bhaje parvativallabham nilakantham || ||
    muninam varenyam gunam rupavarnam dvijaih sampathantam shivam vedashastram | aho dinavatsam kripalum
    shivam tam bhaje parvativallabham nilakantham || || sada bhavanatham sada sevyamanam sada bhaktidevam
    sada pujyamanam | mahatirthavasam sada sevyamekam bhaje parvativallabham nilakantham || || iti shrimacchankarayogindra
    viracitam parvativallabhashtakam nama nilakantha stavah ||
  devanagari: नमो भूतनाथं नमो देवदेवं नमः कालकालं नमो दिव्यतेजम् । नमः कामभस्मं नमः शान्तशीलं भजे पार्वतीवल्लभं
    नीलकण्ठम् ॥ ॥ सदा तीर्थसिद्धं सदा भक्तरक्षं सदा शैवपूज्यं सदा शुभ्रभस्मम् । सदा ध्यानयुक्तं सदा ज्ञानतल्पं
    भजे पार्वतीवल्लभं नीलकण्ठम् ॥ ॥ श्मशाने शयानं महास्थानवासं शरीरं गजानां सदा चर्मवेष्टम् । पिशाचादिनाथं
    पशूनां प्रतिष्ठं भजे पार्वतीवल्लभं नीलकण्ठम् ॥ ॥ फणीनागकण्ठे भुजङ्गाद्यनेकं गले रुण्डमालं महावीर शूरम्
    । कटिव्याघ्रचर्मं चिताभस्मलेपं भजे पार्वतीवल्लभं नीलकण्ठम् ॥ ॥ शिरः शुद्धगङ्गा शिवा वामभागं वियद्दीर्घकेशं
    सदा मां त्रिणेत्रम् । फणीनागकर्णं सदा फालचन्द्रं भजे पार्वतीवल्लभं नीलकण्ठम् ॥ ॥ करे शूलधारं महाकष्टनाशं
    सुरेशं परेशं महेशं जनेशम् । धनेशामरेशं ध्वजेशं गिरीशं भजे पार्वतीवल्लभं नीलकण्ठम् ॥ ॥ उदासं सुदासं
    सुकैलासवासं धरानिर्झरे संस्थितं ह्यादिदेवम् । अजं हेमकल्पद्रुमं कल्पसेव्यं भजे पार्वतीवल्लभं नीलकण्ठम्
    ॥ ॥ मुनीनां वरेण्यं गुणं रूपवर्णं द्विजैः सम्पठन्तं शिवं वेदशास्त्रम् । अहो दीनवत्सं कृपालुं शिवं
    तं भजे पार्वतीवल्लभं नीलकण्ठम् ॥ ॥ सदा भावनाथं सदा सेव्यमानं सदा भक्तिदेवं सदा पूज्यमानम् । महातीर्थवासं
    सदा सेव्यमेकं भजे पार्वतीवल्लभं नीलकण्ठम् ॥ ॥ इति श्रीमच्छङ्करयोगीन्द्र विरचितं पार्वतीवल्लभाष्टकं
    नाम नीलकण्ठ स्तवः ॥
