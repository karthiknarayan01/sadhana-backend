id: shankara-108
category: stotram
name:
  english: shankara 108
  devanagari: शन्कर १०८
content:
  english: ringapureshvarah | saundaryalaharimukhyabahustotravidhayakah || 20|| catushshashtikalabhijno
    brahmarakshasaposhakah | shrimanmandanamishrakhyasvayambhujayasannutah || 21|| totakacaryasampujya
    padmapadarcitanghrikah | hastamalayogindra brahmajnanapradayakah || 22|| sureshvarakhyasacchishya
    samnyasashramadayakah | nrisimhabhaktassadratnagarbhaherambapujakah || 23|| vyakhyasimhasanadhisho
    jagatpujyo jagadguruh | iti shrimacchankaracaryasarvalokaguroh param || 24|| namnamashtottarashatam
    bhuktimuktiphalapradam | trisandhyam yah pathedbhaktya sarvankamanavapnuyat || 25|| iti shrimacchankaracaryashtottarashatanamastotram
    ||
  devanagari: ृङ्गपुरेश्वरः । सौन्दर्यलहरीमुख्यबहुस्तोत्रविधायकः ॥ २०॥ चतुष्षष्टिकलाभिज्ञो ब्रह्मराक्षसपोषकः
    । श्रीमन्मण्डनमिश्राख्यस्वयम्भूजयसन्नुतः ॥ २१॥ तोटकाचार्यसम्पूज्य पद्मपादर्चिताङ्घ्रिकः । हस्तामलयोगिन्द्र
    ब्रह्मज्ञानप्रदायकः ॥ २२॥ सुरेश्वराख्यसच्छिष्य संन्यासाश्रमदायकः । नृसिंहभक्तस्सद्रत्नगर्भहेरम्बपूजकः
    ॥ २३॥ व्याख्यसिंहासनाधीशो जगत्पूज्यो जगद्गुरुः । इति श्रीमच्छङ्कराचार्यसर्वलोकगुरोः परम् ॥ २४॥ नाम्नामष्टोत्तरशतं
    भुक्तिमुक्तिफलप्रदम् । त्रिसन्ध्यं यः पठेद्भक्त्या सर्वान्कामानवाप्नुयात् ॥ २५॥ इति श्रीमच्छङ्कराचार्याष्टोत्तरशतनामस्तोत्रम्
    ॥
