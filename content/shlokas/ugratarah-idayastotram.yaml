id: ugratarah-idayastotram
category: hridaya
name:
  english: ugratarahṟidayastotram
  devanagari: उग्रताराह्ऱिदयस्तोत्रम्
content:
  english: kripam kritva mamopari || 2|| shrishiva uvaca | rane devasure purvam kritamindrena supriye
    | dushtashatruvinashartham balavriddhiyashaskaram || 3|| viniyogah | om asya shrimadugratarahridayastotramantrasya
    shribhairavarishih | anushtup chandah | shrimadugrataradevata | strim bijam | hum shaktih | namah
    kilakam | sakalashatruvinasharthe pathe viniyoga || || rishyadinyasah || shribhairava rishaye namah
    shirasi | anushtupchandase namah mukhe | shrimadugratara devatayai namah hridi | strim bijaya namah
    guhye | hum shaktaye namah nabhau | namah kilakaya namah padayoh | sakala shatruvinasharthe pathe
    viniyogaya namah anjalau || || iti rishyadinyasah || || atha karanyasah || om strim angushthabhyam
    namah | om hrim tarjanibhyam namah | om hum madhyamabhyam namah | om trim anamikabhyam namah | om
    aim kanishthikabhyam namah | om hamsah karatala karaprishthabhyam namah || || iti karanyasah || ||
    atha hridayadishadanganyasah || om strim hridayaya namah | om hrim shirase svaha | om hum shikhayai
    vashat | om trim kavacaya hum | om aim netratrayaya vaushat | om hamsah astraya phat || || iti hridayadishadanganyasah
    || || atha dhyanam || om dhyayetkotidivakaradyutinibham balenduyukshekharam raktangim rasanam suraktavasanam
    purnendubimbananam | pasham kartrimahankushadi dadhatim dorbhishcaturbhiryutam nanabhushanabhushitam
    bhagavatim taram jagattarinim || 4|| || iti dhyanam || evam dhyatva shubham taram tatasyu hridayam
    pathet || tarini tattvanishthanam sarvatattvaprakashika | ramabhinna parashaktih shatrunasham karotu
    me || 5|| sarvada shatrusamrambhe tara me kurutam jayam | strim trimsvarupini devi trishu lokeshu
    vishruta || 6|| tava snehanmayakhyatam na paishunyam prakashyatam | sha
  devanagari: कृपां कृत्वा ममोपरि ॥ २॥ श्रीशिव उवाच । रणे देवासुरे पूर्वं कृतमिन्द्रेण सुप्रिये । दुष्टशत्रुविनाशार्थं
    बलवृद्धियशस्करम् ॥ ३॥ विनियोगः । ॐ अस्य श्रीमदुग्रताराहृदयस्तोत्रमन्त्रस्य श्रीभैरवऋषिः । अनुष्टुप्
    छन्दः । श्रीमदुग्रतारादेवता । स्त्रीं बीजम् । हूं शक्तिः । नमः कीलकम् । सकलशत्रुविनाशार्थे पाठे विनियोग
    ॥ ॥ ऋष्यादिन्यासः ॥ श्रीभैरव ऋषये नमः शिरसि । अनुष्टुप्छन्दसे नमः मुखे । श्रीमदुग्रतारा देवतायै नमः
    हृदि । स्त्रीं बीजाय नमः गुह्ये । हूं शक्तये नमः नाभौ । नमः कीलकाय नमः पादयोः । सकल शत्रुविनाशार्थे
    पाठे विनियोगाय नमः अञ्जलौ ॥ ॥ इति ऋष्यादिन्यासः ॥ ॥ अथ करन्यासः ॥ ॐ स्त्रीं अङ्गुष्ठाभ्यां नमः । ॐ
    ह्रीं तर्जनीभ्यां नमः । ॐ हूं मध्यमाभ्यां नमः । ॐ त्रीं अनामिकाभ्यां नमः । ॐ ऐं कनिष्ठिकाभ्यां नमः
    । ॐ हंसः करतल करपृष्ठाभ्यां नमः ॥ ॥ इति करन्यासः ॥ ॥ अथ हृदयादिषडङ्गन्यासः ॥ ॐ स्त्रीं हृदयाय नमः
    । ॐ ह्रीं शिरसे स्वाहा । ॐ हूं शिखायै वषट् । ॐ त्रीं कवचाय हुम् । ॐ ऐं नेत्रत्रयाय वौषट् । ॐ हंसः
    अस्त्राय फट् ॥ ॥ इति हृदयादिषडङ्गन्यासः ॥ ॥ अथ ध्यानम् ॥ ॐ ध्यायेत्कोटिदिवाकरद्युतिनिभां बालेन्दुयुक्शेखरां
    रक्ताङ्गीं रसनां सुरक्तवसनां पूर्णेन्दुबिम्बाननाम् । पाशं कर्त्रीमहाङ्कुशादि दधतीं दोर्भिश्चतुर्भिर्युतां
    नानाभूषणभूषितां भगवतीं तारां जगत्तारिणीम् ॥ ४॥ ॥ इति ध्यानम् ॥ एवं ध्यात्वा शुभां तारां ततस्यु हृदयं
    पठेत् ॥ तारिणी तत्त्वनिष्ठानां सर्वतत्त्वप्रकाशिका । रामाभिन्ना पराशक्तिः शत्रुनाशं करोतु मे ॥ ५॥
    सर्वदा शत्रुसंरम्भे तारा मे कुरुतां जयम् । स्त्रीं त्रींस्वरूपिणी देवी त्रिषु लोकेषु विश्रुता ॥ ६॥
    तव स्नेहान्मयाख्यातं न पैशुन्यं प्रकाश्यताम् । श
