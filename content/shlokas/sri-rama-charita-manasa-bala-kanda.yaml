    पुनि पुनि सिरु नाई। फिरे महीसु आसिषा पाई ॥ चली बरात निसान बजाई। मुदित छोट बड़ सब समुदाई ॥ रामहि निरखि
    ग्राम नर नारी। पाइ नयन फलु होहिं सुखारी ॥ दो बीच बीच बर बास करि मग लोगन्ह सुख देत। अवध समीप पुनीत
    दिन पहुँची आइ जनेत ॥ हने निसान पनव बर बाजे। भेरि सङ्ख धुनि हय गय गाजे ॥ झाँझि बिरव डिण्डमीं सुहाई।
    सरस राग बाजहिं सहनाई ॥ पुर जन आवत अकनि बराता। मुदित सकल पुलकावलि गाता ॥ निज निज सुन्दर सदन सँवारे।
    हाट बाट चौहट पुर द्वारे ॥ गलीं सकल अरगजाँ सिञ्चाई। जहँ तहँ चौकें चारु पुराई ॥ बना बजारु न जाइ बखाना।
    तोरन केतु पताक बिताना ॥ सफल पूगफल कदलि रसाला। रोपे बकुल कदम्ब तमाला ॥ लगे सुभग तरु परसत धरनी। मनिमय
    आलबाल कल करनी ॥ दो बिबिध भाँति मङ्गल कलस गृह गृह रचे सँवारि। सुर ब्रह्मादि सिहाहिं सब रघुबर पुरी निहारि
    ॥ ॥ भूप भवन तेहि अवसर सोहा। रचना देखि मदन मनु मोहा ॥ मङ्गल सगुन मनोहरताई। रिधि सिधि सुख सम्पदा सुहाई
    ॥ जनु उछाह सब सहज सुहाए। तनु धरि धरि दसरथ दसरथ गृहँ छाए ॥ देखन हेतु राम बैदेही। कहहु लालसा होहि न
    केही ॥ जुथ जूथ मिलि चलीं सुआसिनि। निज छबि निदरहिं मदन बिलासनि ॥ सकल सुमङ्गल सजें आरती। गावहिं जनु
    बहु बेष भारती ॥ भूपति भवन कोलाहलु होई। जाइ न बरनि समु सुखु सोई ॥ कौसल्यादि राम महतारीं। प्रेम बिबस
    तन दसा बिसारीम् ॥ दो दिए दान बिप्रन्ह बिपुल पूजि गनेस पुरारी। प्रमुदित परम दरिद्र जनु पाइ पदारथ चारि
    ॥ ॥ मोद प्रमोद बिबस सब माता। चलहिं न चरन सिथिल भे गाता ॥ राम दरस हित अति अनुरागीं। परिछनि साजु सजन
