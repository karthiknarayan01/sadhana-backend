id: jyotirlingam
category: stotram
name:
  english: jyotirlingam
  devanagari: ज्योतिर्लिङ्गम्
content:
  english: jyotirlingam saurashtre somanathamca shrishailye mallikarjunam ujjayinyam mahakalam momkalamamaleshvaram
    | paralyam vaijanatham ca dakimnyam bhimashamkaram setubamdhe tu ramesham
  devanagari: ज्योतिर्लिङ्गम् सौराष्ट्रे सोमनाथंच श्रीशैल्ये मल्लिकार्जुनम् उज्जयिन्याम् महाकालम् मोंकालममलेश्वरम्
    । परल्यां वैजनाथं च डाकिंन्यां भीमशंकरम् सेतुबंधे तु रामेशं
meaning: {}
