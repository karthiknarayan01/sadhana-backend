id: indradyumnakritam1vishnustotram
category: stotram
name:
  english: indradyumnakritam1vishnustotram
  devanagari: इन्द्रद्युम्नकृतं१विष्णुस्तोत्रम्
content:
  english: uvaca | shriyah kanta namaste'stu shripate pitavasase | shrida shrisha shrinivasa namaste shriniketana
    || 10|| adyam purushamishanam sarvesham sarvatomukham | nishkalam paramam devam pranato'smi sanatanam
    || 11|| shabdatitam gunatitam bhavabhavavivarjitam | nirlepam nirgunam sukshmam sarvajnam sarvabhavanam
    || 12|| pravrinmeghapratikasham gobrahmanahite ratam | sarveshameva goptaram vyapinam sarvabhavinam
    || 13|| shankhacakradharam devam gadamusaladharinam | namasye'ham hrishikesham sarvapapaharam hirim
    || 14|| nagaparyankashayanam kshirodarnavashayinam | namasye'ham hrishikesham sarvapapaharam harim
    || 15|| punastvam devadevesham namasye varadam vibhum | sarvalokeshvaram vishnum mokshakaranamavyayam
    || 16|| iti brahmapurane ekapancashattamadhyayantargatam indradyumnakritam vishnustotra samaptam |
    brahmapurana | adhyaya 51
  devanagari: उवाच । श्रियः कान्त नमस्तेऽस्तु श्रीपते पीतवाससे । श्रीद श्रीश श्रीनिवास नमस्ते श्रीनिकेतन
    ॥ १०॥ आद्यं पुरुषमीशानं सर्वेशं सर्वतोमुखम् । निष्कलं परमं देवं प्रणतोऽस्मि सनातनम् ॥ ११॥ शब्दातीतं
    गुणातीतं भावाभावविवर्जितम् । निर्लेपं निर्गुणं सूक्ष्मं सर्वज्ञं सर्वभावनम् ॥ १२॥ प्रावृण्मेघप्रतीकाशं
    गोब्राह्मणहिते रतम् । सर्वेषामेव गोप्तारं व्यापिनं सर्वभाविनम् ॥ १३॥ शङ्खचक्रधरं देवं गदामुसलधारिणम्
    । नमस्येऽहं हृषीकेशं सर्वपापहरं हिरिम् ॥ १४॥ नागपर्यङ्कशयनं क्षीरोदार्णवशायिनम् । नमस्येऽहं हृषीकेशं
    सर्वपापहरं हरिम् ॥ १५॥ पुनस्त्वां देवदेवेशं नमस्ये वरदं विभुम् । सर्वलोकेश्वरं विष्णुं मोक्षकारणमव्ययम्
    ॥ १६॥ इति ब्रह्मपुराणे एकपञ्चाशत्तमाध्यायान्तर्गतं इन्द्रद्युम्नकृतं विष्णुस्तोत्र समाप्तम् । ब्रह्मपुराण
    । अध्याय ५१
