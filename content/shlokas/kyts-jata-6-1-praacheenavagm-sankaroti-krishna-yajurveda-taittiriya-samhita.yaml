id: kyts-jata-6-1-praacheenavagm-sankaroti-krishna-yajurveda-taittiriya-samhita
category: stotram
name:
  english: KYTS Jata 6.1 Praacheenavagm Sankaroti - Krishna Yajurveda Taittiriya Samhita
content:
  english: nkaroti karoti pracinavagmsha pracinavagmshamiti pracina karoti devamanushya devamanushyah
    karoti karoti devamanushyah | devamanushya disho disho devamanushya devamanushya dishah | devamanushya
    iti deva disho vi vi disho disho vi | vyabhajanta bhajanta vi vyabhajanta | mpraci mabhajanta bhajanta
    praci ndeva devah praci deva dakshina dakshina deva deva dakshina | dakshina pitarah pitaro dakshina
    dakshina pitarah | mpitarah pitarah pratici mmanushya manushyah manushya udici mudici mmanushya manushya
    udicim | udicigm rudra rudra udici mudicigm rudrah | drudra rudra yat | tpracinavagmsham | nkaroti
    karoti pracinavagmsha pracinavagmshamiti pracina nkaroti karoti devalokam | devaloka mevaiva devaloka
    dyajamano yajamana sta yajamana upavartata upavartate yajamano yajamana upavartate | upavartate pari
    paryu pavartata upavartate pari | pari shrayati shrayati pari pari shrayati | shshrayati shraya tyantar
    hi devaloko devaloko hi hi devalokah | devaloko manushyaloka ddevaloko devaloko manushyalokat | manushyalokaditi
    manushya asma lloka lloka dasma dasma llokat | thsvetavyagg svetavyam ~loka lloka svetavya miveva
    svetavyagg svetavya miva | ive titive veti | ityahu rahu riti tyahuh | ahuh kah ka ahu rahuh kah |
    veda yadi yadi veda veda yadi | yadi yadyamushminn | amushmin ~loke loke 'mushmi nnamushmin ~loke
    | loke 'styasti loke loke 'sti | asti va va 'styasti va | iti dikshu dikshvi titi dikshu | dikshva
    tikasha natikasha ndikshu dikshva tikashan | atikashan karoti karotya tikasha natikashan karoti |
    karo tyubhayo rubhayoh rlokayo rubhayo rubhayo lokayo rabhijitya abhijityai lokayo rlokayo rabhijityai
    | abhijityai keshashmashru keshashma shrvabhijitya abhijityai keshashmashru | abhijitya ityabhi keshashmashru
    vapate vapate keshashmashru keshashmashru vapate | keshashmashrviti kesha vapate nakhani nakhani vapate
    vapate nakhani | nakhani ni ni nakhani nakhani ni | ni krintate krintate ni ni krintate | krintate
    mrita mrita krintate krintate mrita | mrita vai vai mrita mrita vai | va eshaisha vai va esha | ktvage
    shaisha tvak | tva gameddhya 'meddhya tva dyadameddhya 'meddhya yat | tkeshashmashru keshashmashru
    ya nkeshashmashru keshashmashru mritam | keshashmashrviti kesha tvaca mameddhya mameddhya ntvaca mameddhyam
    | ameddhya mapahatya pahatya meddhya mameddhya mapahatya | apahatya yajniyo yajniyo 'pahatya pahatya
    yajniyah | yajniyo bhutva bhutva yajniyo yajniyo bhutva | mbhutva bhutva medha tye tyupo paiti | etyangiraso
    'ngirasa etye tyangirasah | ssuvargagm suvarga mangiraso 'ngirasa suvargam ~lokam ~lokagm suvargagm
    suvargam ~lokam | ya~nto yanto lokam ~lokam yanto 'phsvaphsu yanto yanto 'phsu | kshatapasi dikshatapasi
    aphsvaphsu di dikshatapasi pra pra di kshatapasi dikshatapasi pra | dikshatapasi iti diksha npra praveshayann
    | aphsu snati sna tyaphsvaphsu snati | thsnati snati sakshat | saksha devaiva saksha kshatapasi dikshatapasi
    evaiva di dikshatapasi avava dikshatapasi dikshatapasi ava | dikshatapasi iti diksha ava rundhe rundhe
    'vava rundhe | rundhe tirthe tirthe rundhe rundhe tirthe | tirthe snati snati tirthe tirthe snati
    | snati tirthe tirthe snati snati tirthe | tirthe hi hi tirthe tirthe hi | npra praveshayann | ntirthe
    tirthe 'veshaya tirthe snati snati tirthe tirthe snati | snati snati tirtham | || tirtha mevaiva tirtha
    eva samananagm samanana mevaiva samanana mbhavati bhavati samananagm samanana bhava tyapo 'po bhavati
    bhava tyapah | 'shna tyashna tyapo ashna tyantarato 'shna tyashna tyantaratah | antarata evai vantarato
    eva meddhyo meddhya evaiva meddhyah | meddhyo bhavati bhavati meddhyo meddhyo bhavati | bhavati vasasa
    vasasa bhavati bhavati vasasa | vasasa dikshayati dikshayati vasasa vasasa dikshayati | dikshayati
    saumyagm saumya kshayati dikshayati saumyam | vai~ vai saumyagm saumyam ndevataya devataya kshauma
    devataya somagm soma ndevataya devataya soma soma mesha esha somagm soma meshah | ndevata mesha esha
    devata devata mupopa devata tye tyupo paiti | yo dikshate dikshate yo yo dikshate | dikshate somasya
    somasya dikshate dikshate somasya | ssomasya somasya tanuh | tanu rasyasi tanu stanu rasi | ntanuva
    masyasi tanuva me pahi pahi me me pahi | pahi titi pahi pahiti | ityahahe tityaha | sva mahaha svam
    | ndevata mevaiva devata devata mupopa devata tye tyupo paiti | etyatho atho etye tyatho atho ashisha
    mashisha matho atho ashisha ashisha mevai vashisha mashisha meva | evaita meta mevai vaitam | eta
    maita meta ma | shaste 'gne ragne ste shaste 'gneh | ntushadhana magne ragne stushadhana rvayo stushadhana
    nivi roshadhina moshadhina rnivi roshadhinam | mpraghatah praghata oshadhina moshadhina praghata adityana
    madityana mpraghatah praghata adityana mpracinatanah pracinatana adityana madityana pracinatano vishvesham
    mpracinatanah pracinatano vishvesham | pracinatana iti pracina devana motu rotu nnakshatrana motu
    rotu nakshatrana matikasha atikasha nakshatrana nnakshatrana matikashah | ttadatikasha atikasha stat
    | thsarvadevatyagm sarvadevatya meta deta thsarvadevatyagm sarvadevatyam sarvadevatyamiti sarva vasasa
    dikshayati dikshayati vasasa vasasa dikshayati | dikshayati sarvabhi rdikshayati dikshayati sarvabhih
    | sarvabhi revaiva sarvabhi evaina mena mevai vaina rdikshayati dikshayati devatabhi dikshayati bahihprano
    bahihprano dikshayati dikshayati bahihpranah | bahihprano vai vai bahihprano bahihprano vai | bahihprana
    iti bahih vai manushyo manushyo vai vai manushyah | manushya stasya tasya manushyo manushya stasya
    | ntasya tasya shanam | mpranah prano 'shana mashana 'shnatya shnati pranah prano ssaprano 'shnatya
    shnati sapranah | saprana evaiva saprana kshate dikshata evaiva di dikshata ashita ashito dikshate
    dikshata ashitah | ashito bhavati bhavatya shita ashito bhavati | nbhavati bhavati yavan | yavane
    vaiva yavan asya pranah prano prana stena tena pranah prana stena | tena saha saha tena tena saha
    | mmedhagm saha saha medha tye tyupo paiti | mmastu mastu devana mmastu mastu pitrinam | thsarvadevatyagm
    sarvadevatya meta deta thsarvadevatyagm sarvadevatyam sarvadevatyamiti sarva nnavanitena navanitena
    ya navanite nabhyankte 'bhyankte navanitena navanite nabhyankte | ssarva abhyankte eva devata devata
    evaiva devatah prinati prinati devata devatah prinati pracyutah pracyutah prinati prinati pracyutah
    | pracyuto vai vai pracyutah pracyuto vai | va esha esha vai va eshah | 'sma dasma desha esho asma
    lloka lloka dasma dasma llokat | loka dagato 'gato loka lloka dagatah | ndevaloka magato 'gato devalokam
    | anta reve vantara 'nta reva | nnavanita miveva navanitam | nnavanitena navanitena tasma navanite
    nabhyabhi navanitena navanite nabhi | abhyankte 'nkte 'bhya ankte 'nuloma manuloma mankte 'nkte 'nulomam
    | ya~jusha yajusha 'nuloma manulomam yajusha vyavrittyai vyavrittyai yajusha yajusha vyavrittyai |
    vyavrittya indra indro vyavrittyai vyavrittya indrah | vyavrittya iti vi vri~tra mindra indro vritram
    | tasya kaninika kaninika tasya tasya kaninika | kaninika para para kaninika kaninika para anjana
    mabhava dabhava danjana manjana mabhavat | yadankta ankte ya ankte cakshu shcakshu rankta ankte cakshuh
    | cakshu revaiva cakshu shcakshu reva | eva bhratrivyasya bhratrivya syaivaiva bhratrivyasya | bhratrivyasya
    vrinkte vrinkte bhratrivyasya bhratrivyasya vrinkte | vri~nkte vrinkte dakshinam | ankte savyagm savya
    mankte 'nkte savyam | || savyagm hi hi savyagm savyagm hi | mpurvagm hi hi purva mmanushya manushyah
    manushya anjata anjate manushya manushya anjate anjate na nanjata anjate na | ni dhavate dhavate ni
    ni dhavate | dhavate ni ni dhavate dhavate ni | iva hi hiveva hi | hi manushya manushya hi hi manushyah
    manushya dhavante dhavante manushya manushya dhavante | dhavante panca panca dhavante dhavante panca
    | panca kritvah kritvah panca panca kritvah | kritva a kritvah kritva a | kshara 'nkte 'nkte panca
    kshara panktih panktih panca panktih panktah panktah panktih panktih panktah | pankto yajno yajnah
    panktah pankto yajnah | ya~jno yajno yajnam | ava rundhe rundhe 'vava rundhe | mparimitagm rundhe
    rundhe parimitam | parimita ma parimita ankte 'parimita maparimita mankte 'nkte 'parimitam | aparimitagm
    hi hyaparimita maparimitagm hi | hi manushya manushya hi hi manushyah manushya anjata anjate manushya
    manushya anjate anjate satulaya satulaya ''njata anjate satulaya | satulaya ''satulaya satulaya |
    ankte 'patulaya 'patulaya 'nkte 'nkte 'patulaya | apatulaya hi hyapatulaya 'patulaya hi | hi manushya
    manushya hi hi manushyah manushya anjata anjate manushya manushya anjate anjate vyavrittyai vyavrittya
    anjata anjate vyavrittyai | dvyavrittyai vyavrittyai yat | vyavrittya iti vi yadapatulaya 'patulaya
    ya apatulaya ''nji tanji tapatulaya 'patulaya ''njita | anjita vajro vajra anjitanjita vajrah | vajra
    iveva vajro vajra iva | thsya diveva syat | thsatulaya satulaya sya satulaya ''satulaya satulaya |
    ankte mitratvaya mitratvaya nkte 'nkte mitratvaya | mitratvayendra indro mitratvaya mitratvayendrah
    | mitratvayeti mitra vri~tra mindra indro vritram | abhyamriyata mriyatabhya ntasa mamriya tamriyata
    tasa yajniyagm sadevagm sadevam ya~jniyagm sadevam | thsadevagm sadeva masi udakrama dakrama dudu
    dakramat | te darbha darbha ste te darbhah | ndarbha darbha abhavann | darbhapunjilaih pavayati pavayati
    darbhapunjilai rdarbhapunjilaih pavayati | darbhapunjilairiti darbha pavayati ya yah pavayati pavayati
    yah | ya evaiva ya ya eva | eva meddhya meddhya evaiva meddhyah meddhya yajniya yajniya meddhya meddhya
    yajniyah ssadeva yajniya yajniya apa stabhi stabhi rapa apa stabhih | tabhi revaiva tabhi stabhi reva
    | evaina mena mevai vaina mpavayati pavaya tyena mena mpavayati pavayati dvabhya mpavayati pavayati
    dvabhya pavaya tyahoratrabhya mahoratrabhya mpavayati pavaya tyahoratrabhya ahoratrabhya mevai vahoratrabhya
    mahoratrabhya meva | ahoratrabhyamityahah evaina mena mevai vaina mpavayati pavaya tyena mena pavayati
    tribhi stribhih pavayati pavayati tribhih | tribhih pavayati pavayati tribhi stribhih pavayati | pavayati
    traya strayah pavayati pavayati trayah | traya ima ime traya straya ime | ime loka loka ima ime lokah
    | rloka loka ebhih | ebhi revai vaibhi rebhi reva | evaina mena mevai vaina rlokai rena menam ~lokaih
    | lokaih pavayati pavayati lokai pavayati pancabhih pancabhih pavayati pavayati pancabhih | pancabhih
    pavayati pavayati pancabhih pancabhih pavayati | kshara pavayati pavayati panca kshara panktih panktih
    panca panktih panktah panktah panktih panktih panktah | pankto yajno yajnah panktah pankto yajnah
    | yajno yajnaya yajnaya yajno yajno yajnaya | yajnayai vaiva yajnaya yajnayaiva | evaina mena mevai
    vaina mpavayati pavaya tyena mena pavayati shadbhi shshadbhih pavayati pavayati shadbhih | shadbhih
    pavayati pavayati shadbhi shshadbhih pavayati | tthshat pavayati pavayati shat | va ritava ritavo
    vai va ritavah | ritava ritava ritubhih | evaina mena mevai vaina mpavayati pavaya tyena mena pavayati
    saptabhih saptabhih pavayati pavayati saptabhih | saptabhih pavayati pavayati saptabhih saptabhih
    pavayati | pavayati sapta sapta pavayati pavayati sapta | sapta chandagmsi chandagmsi sapta sapta
    chandagmsi | chandagmsi chandobhi shchandobhi shchandagmsi chandagmsi chandobhih | chandobhi revaiva
    chandobhi shchandobhi reva | chandobhiriti chandah evaina mena mevai vaina mpavayati pavaya tyena
    mena rnavabhih pavayati pavayati navabhih | navabhih pavayati pavayati navabhi pavayati nava nava
    pavayati pavayati nava | nava vai vai nava nava vai | vai purushe purushe vai vai purushe | purushe
    pranah pranah purushe purushe pranah | ssapranagm saprana saprana mevaiva sapranagm saprana meva |
    evaina mena mevai vaina mpavayati pavaya tyena mena pavaya tyekavigmshatyai kavigmshatya pavayati
    pavaya tyekavigmshatya | ekavigmshatya pavayati pavayatyekavigmsha tyaikavigmshatya pavayati | ekavigmshatyetyeka
    pavayati dasha dasha pavayati pavayati dasha | dasha hastya hastya dasha dasha hastyah hastya angulayo
    'ngulayo hastya hastya angulayah | angulayo dasha dasha ngulayo 'ngulayo dasha | dasha padyah padya
    dasha dasha padyah padya atma ''tma padyah padya atma | atmai kavigmsha ekavigmsha atma ''tmai kavigmshah
    | ekavigmsho yavan yava nekavigmsha ekavigmsho yavan | ekavigmsha ityeka yavane vaiva yavan eva purushah
    purusha evaiva purushah | mpurushah purusha stam | tamaparivarga maparivarga mpavayati pavaya tyaparivarga
    maparivarga pavayati citpati shcitpatih pavayati pavayati citpatih | citpati stva tva citpati shcitpati
    stva | tva punatu punatu tva tva punatu | puna tvititi punatu puna tviti | ityahahe tityaha | aha
    mano mana ahaha manah | mano vai vai mano mano vai | vai citpati shcitpati rvai vai citpatih | rmanasa
    manasa citpati shcitpati manasai vaiva manasa mana saiva | evaina mena mevai vaina mpavayati pavaya
    tyena mena rvakpatih pavayati pavayati vakpatih | vakpati stva tva vakpati rvakpati stva | tva punatu
    punatu tva tva punatu | puna tvititi punatu puna tviti | ityahahe tityaha | aha vaca vaca ''haha vaca
    | vacai vaiva vaca vacaiva | evaina mena mevai vaina mpavayati pavaya tyena mena pavayati devo devah
    pavayati pavayati devah | tva devo deva stva tva savita savita tva savita punatu punatu savita savita
    punatu | puna tvititi punatu puna tviti | ityahahe tityaha | ssavitriprasuta ahaha savitriprasutah
    | savitriprasuta evaiva savitriprasuta ssavitriprasuta eva | savitriprasuta iti savitri evaina mena
    mevai vaina mpavayati pavaya tyena mena pavayati tasya tasya pavayati pavayati tasya | tasya te te
    tasya tasya te | te pavitrapate pavitrapate te te pavitrapate | pavitrapate pavitrena pavitrena pavitrapate
    pavitrapate pavitrena | pavitrapata iti pavitra pavitrena yasmai yasmai pavitrena pavitrena yasmai
    ya~smai yasmai kam | shakeya mititi shakeyagm shakeya miti | ityahahe tityaha | ahashisha mashisha
    mahaha shisha ashisha mevai vashisha mashisha meva | evaita meta mevai vaitam | eta maita meta ma
    | shasta iti shaste | || yavanto vai vai yavanto yavanto vai | vai deva deva vai vai devah | deva
    yajnaya yajnaya deva deva yajnaya | yajnaya punata punata yajnaya yajnaya punata | apunata te te 'punata
    punata te | nnabhavanne vaiva bhavann | yo yo 'bhavanna bhavan yajnaya yajnaya vidvan yajnaya punite
    punite yajnaya yajnaya punite | punite bhavati bhavati punite punite bhavati | bhava tyevaiva bhavati
    bhava tyeva | rbahi revaiva bahih | bahih pavayitva pavayitva bahi rbahih pavayitva | pavayitva 'nta
    rantah pavayitva pavayitva 'ntah | antah pra pranta rantah pra | pra padayati padayati pra pra padayati
    | padayati manushyaloke manushyaloke padayati padayati manushyaloke | manushyaloka evaiva manushyaloke
    manushyaloka eva | manushyaloka iti manushya evaina mena mevai vaina mpavayitva pavayitvaina mena
    mpavayitva pavayitva putam | pra nayati nayati pra pra nayati | kshito nayati naya tyadi kshita ekayaikaya
    'di ekaya ''hutya ''hu tyaika yaikaya ''hutya | ahutye titya hutya ''hu tyeti | ityahu rahu riti tyahuh
    | ssruvena sruvena hurahu sruvena catasra shcatasra ssruvena sruvena catasrah | catasro juhoti juhoti
    catasra shcatasro juhoti | juhoti dikshitatvaya dikshitatvaya juhoti juhoti dikshitatvaya | dikshitatvaya
    sruca sruca di kshitatvaya dikshitatvaya sruca | dikshitatvayeti dikshita sruca sruca pancamim | kshara
    panktih panktih panca panktih panktah panktah panktih panktih panktah | pankto yajno yajnah panktah
    pankto yajnah | ya~jno yajno yajnam | ava rundhe rundhe 'vava rundhe | tyai rundhe rundha aku prayuje
    'gnaye 'gnaye agnaye svaha svaha 'gnaye 'gnaye svaha svahetiti svaha svaheti | ityahahe tityaha |
    tya hi hyakutya ''ku hi purushah purusho hi hi purushah | mpurushah purusho yajnam | yajna mabhyabhi
    yajnam abhi prayunkte prayunkte 'bhyabhi prayunkte | prayunkte yajeya yajeya prayunkte prayunkte yajeya
    | prayunkta iti pra yajeye titi yajeya yajeyeti | iti medhayai medhaya ititi medhayai medhayai manase
    manase medhayai medhayai manase | manase 'gnaye 'gnaye manase manase 'gnaye agnaye svaha svaha 'gnaye
    'gnaye svaha svahe titi svaha svaheti | ityahahe tityaha | aha medhaya medhaya ''haha medhaya medhaya
    hi hi medhaya medhaya hi | hi manasa manasa hi hi manasa | manasa purushah purusho manasa manasa purushah
    | mpurushah purusho yajnam | yajna mabhigaccha tyabhigacchati yajnam ya~jna mabhigacchati | abhigacchati
    sarasvatyai sarasvatya abhigaccha tyabhigacchati sarasvatyai | sarasvatyai pushne pushne sarasvatyai
    sarasvatyai pushne | 'gnaye 'gnaye pushne pushne agnaye svaha svaha 'gnaye 'gnaye svaha svahe titi
    svaha svaheti | ityahahe tityaha | aha vag vaga haha vak | vag vai vai vag vag vai | vai sarasvati
    sarasvati vai vai sarasvati | sarasvati prithivi prithivi sarasvati sarasvati prithivi | prithivi
    pusha pusha prithivi prithivi pusha | pusha vaca vaca pusha pusha vaca | vacai vaiva vaca vacaiva
    | eva prithivya prithivyai vaiva prithivya | mprithivya prithivya yajnam | pra yunkte yunkte pra pra
    yunkte | yunkta apa apo yunkte yunkta apah | rdevi rapa apo devih | rvishvashambhuvo vishvashambhuvo
    brihati rvishvashambhuvah | vishvashambhuva ititi vishvashambhuvo vishvashambhuva iti | vishvashambhuva
    iti vishva ityahahe tityaha | aha ya ya ahaha yah | ta apa apa sta sta apah | || rdevi rapa apo devih
    | rvishvashambhuvo vishvashambhuvo brihati dvishvashambhuvo vishvashambhuvo yat | vishvashambhuva
    iti vishva ddivya divya bruya divya apa apo divya divya apah | imam ~lokam ~loka mima mimam ~lokam
    | loka ma lokam ~loka ma | rgaccheyura gaccheyuh | gaccheyu rapa apo gaccheyu rdevi rapa apo devih
    | rvishvashambhuvo vishvashambhuvo brihati rvishvashambhuvah | vishvashambhuva ititi vishvashambhuvo
    vishvashambhuva iti | vishvashambhuva iti vishva ityahahe tityaha | ahasma asma aha hasmai | asma
    evai vasma asma eva | evaina ena evai vainah ena lokaya lokayaina ena lokaya | lokaya shamayati shamayati
    lokaya lokaya shamayati | cchamayati shamayati tasma shanta ima mimagm shanta imam ~lokam ~loka mima
    mimam ~lokam | loka ma lokam ~loka ma | a gacchanti gacchantya gacchanti | gacchanti dyavaprithivi
    dyavaprithivi gacchanti gacchanti dyavaprithivi | dyavaprithivi ititi dyavaprithivi dyavaprithivi
    iti | dyavaprithivi iti dyava ityahahe tityaha | aha dyavaprithivyo rdyavaprithivyo rahaha dyavaprithivyoh
    | hi hi dyavaprithivyo rdyavaprithivyor dyavaprithivyoriti dyava hi yajno yajno hi hi yajnah | yajna
    ururu yajno yajna uru | urvantariksha mantariksha muru antariksha mititya ntariksha mantariksha miti
    | ityahahe tityaha | ahantarikshe 'ntariksha ahaha ntarikshe | antarikshe hi hyantarikshe 'ntarikshe
    hi | hi yajno yajno hi hi yajnah | ryajno yajno brihaspatih | no havisha havisha no no havisha havisha
    vridhatu vridhatu havisha havisha vridhatu | vridha tvititi vridhatu vridha tviti | || ityahahe tityaha
    | aha brahma brahmahaha brahma | brahma vai vai brahma brahma vai | rbrahmana brahmana brihaspati
    brahmanai vaiva brahmana brahmanaiva | evasma asma evai vasmai ya~jna masma asmai yajnam | ava rundhe
    rundhe 'vava rundhe | drundhe rundhe yat | ya~jnasthanu mititi yajnasthanum | yajnasthanu mricche
