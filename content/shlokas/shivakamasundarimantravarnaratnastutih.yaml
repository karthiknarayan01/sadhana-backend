id: shivakamasundarimantravarnaratnastutih
category: mantra
name:
  english: shivakamasundarimantravarnaratnastutih
  devanagari: शिवकामसुन्दरीमन्त्रवर्णरत्नस्तुतिः
content:
  english: omityaksharamudyatam tadanu ca vyahrityabhikhya punah gayatri smritibhistrayi shivagalatsargadime'dhitya
    tat | yasyassandrakripavalokanavashadbrahma sasarjakhilam tam devim shivakamasundarasakhim dhyayami
    sa'smityaham || 1|| aim varnam pratibhaprakashanaparam dvaitiyakam yanmanoh abhyasadanilanaloktavibhave
    yakshe gate devarat | gaurim haimavatimumam bhagavatim drishtva vimukto'bhavat tam devim shivakamasundarasakhim
    dhyayami sa'smityaham || 2|| shim varnam shivadam tritiyamaparam mantrasya yasyah pura japam japamavapuradbhutatamassiddhishca
    siddhah parah | nandishapramukhashca yamabhinutah pancashravahnyashrage tam devim shivakamasundarasakhim
    dhyayami sa'smityaham || 3|| saum varnam ca turiyamantaranisham yanmantrarajah svayam dhyayan shakrasamo
    bhuvi prathitavan bhutva vijejiyate | atmaramaviharavan sa sukriti svante'pi yasyah pade tam devim
    shivakamasundarasakhim dhyayami sa'smityaham || 4|| mam varnam manupancamam vidhimukhat jnatva samanyahvaye
    sthane vyomni sabhantare parashivasyananda lasyanugam | svabhinnam sanakadayassukritinah pashyanti
    yam shambhavim tam devim shivakamasundarasakhim dhyayami sa'smityaham || 5|| shardulanghritanubhavena
    shivakamyambamanorvarnabhak stotram yatkritamanvaham ca pathatam tesham shivanugrahat | vakshrisaukhyayashassumangaladharakantatmajatadimah
    dirghayushyamarogatam ca carame daivyam padam syaddhruvam || 6|| iti upamanyumaharshiviracita shrishivakamasundarimantravarnaratnastutih
    |
  devanagari: ओमित्यक्षरमुद्यतं तदनु च व्याहृत्यभिख्या पुनः गायत्री स्मृतिभिस्त्रयी शिवगलात्सर्गादिमेऽधीत्य
    तत् । यस्यास्सान्द्रकृपावलोकनवशाद्ब्रह्मा ससर्जाखिलं तां देवीं शिवकामसुन्दरसखीं ध्यायामि साऽस्मीत्यहम्
    ॥ १॥ ऐं वर्णं प्रतिभाप्रकाशनपरं द्वैतीयकं यन्मनोः अभ्यासादनिलानलोक्तविभवे यक्षे गते देवराट् । गौरीं
    हैमवतीमुमां भगवतीं दृष्ट्वा विमुक्तोऽभवत् तां देवीं शिवकामसुन्दरसखीं ध्यायामि साऽस्मीत्यहम् ॥ २॥ शिं
    वर्णं शिवदं तृतीयमपरं मन्त्रस्य यस्याः पुरा जापं जापमवापुरद्भुततमास्सिद्धीश्च सिद्धाः पराः । नन्दीशप्रमुखाश्च
    यामभिनुताः पञ्चाश्रवह्न्यश्रगे तां देवीं शिवकामसुन्दरसखीं ध्यायामि साऽस्मीत्यहम् ॥ ३॥ सौं वर्णं च
    तुरीयमन्तरनिशं यन्मन्त्रराजः स्वयं ध्यायन् शक्रसमो भुवि प्रथितवान् भूत्वा विजेजीयते । आत्मारामविहारवान्
    स सुकृती स्वान्तेऽपि यस्याः पदे तां देवीं शिवकामसुन्दरसखीं ध्यायामि साऽस्मीत्यहम् ॥ ४॥ मं वर्णं मनुपञ्चमं
    विधिमुखात् ज्ञात्वा समन्याह्वये स्थाने व्योम्नि सभान्तरे परशिवस्यानन्द लास्यानुगाम् । स्वाभिन्नां
    सनकादयस्सुकृतिनः पश्यन्ति यां शाम्भवीं तां देवीं शिवकामसुन्दरसखीं ध्यायामि साऽस्मीत्यहम् ॥ ५॥ शार्दूलाङ्घ्रितनूभवेन
    शिवकाम्यम्बामनोर्वर्णभाक् स्तोत्रं यत्कृतमन्वहं च पठतां तेषां शिवानुग्रहात् । वाक्श्रीसौख्ययशस्सुमङ्गलधराकान्तात्मजातादिमाः
    दीर्घायुष्यमरोगतां च चरमे दैव्यं पदं स्याद्ध्रुवम् ॥ ६॥ इति उपमन्युमहर्षिविरचिता श्रीशिवकामसुन्दरीमन्त्रवर्णरत्नस्तुतिः
    ।
