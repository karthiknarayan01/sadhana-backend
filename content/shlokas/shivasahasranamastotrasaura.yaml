id: shivasahasranamastotrasaura
category: sahasranama
name:
  english: shivasahasranamastotrasaura
  devanagari: शिवसहस्रनामस्तोत्रसौर
content:
  english: evam namnam sahasrena tushtava girijapatim | sampujya paraya bhaktya pundarikairdvijottamah
    || 141|| jijnasartham harerbhaktya kamaleshu shivah svayam | tatraikam gopayamasa kamalam munipungavah
    || 142|| hrite pushpe tada vishnushcintayankimidam tviti | jnatva''tmano'kshimuddhritya pujayamasa
    shankaram || 143|| atha jnatva mahadevo harerbhakti sunishcalam | pradurbhuto mahadevo mandalattigmadidhiteh
    || 144|| suryakotipratikashastrinetrashcandrashekharah | shulatankadagacakrakuntapashadharo vibhuh
    || 145|| varadabhayapanishca sarvabharanabhushitah | tam drishtva devadevesham bhagavankamalekshanah
    || 146|| punarnanama caranau dandavacchulapaninah | drishtva shambhum tada deva dudruvurbhayavihvalah
    || 147|| cacala brahmabhuvanam cakampe ca vasundhara | adhashcordhvam tatah prite dadaha shatayojanam
    || 148|| shambhorbhagavatastejastaddrishtva prahasanshivah | abraviccharnginam viprah kritanjaliputam
    sthitam || 149|| devakaryami'dam jnatamidanim madhusudana | divyam dadami te cakramadbhutam tatsudarshanam
    || 150|| hitartham sarvadevanam nirmitam yanmaya pura | grihitva tadgunairdaityanjahi vishno mama''jnaya
    || 151|| evamuktva dadau cakram suryayutasamaprabham | lokeshu pundarikaksha iti khyatim gata harih
    || 152|| punastamabravicchambhurnarayanamanamayam | varananyansurashreshtha varayasva yathepsitan
    || 153|| evam shambhornigaditam shrutva devo janardanah | abravitkhandaparashum pranjalih pranayanvitah
    || 154|| shrivishnuruvaca
  devanagari: एवं नाम्नां सहस्रेण तुष्टाव गिरिजापतिम् । सम्पूज्य परया भक्त्या पुण्डरीकैर्द्विजोत्तमाः
    ॥ १४१॥ जिज्ञासार्थं हरेर्भक्त्या कमलेषु शिवः स्वयम् । तत्रैकं गोपयामास कमलं मुनिपुङ्गवाः ॥ १४२॥ हृते
    पुष्पे तदा विष्णुश्चिन्तयन्किमिदं त्विति । ज्ञात्वाऽऽत्मनोऽक्षिमुद्धृत्य पूजयामास शङ्करम् ॥ १४३॥ अथ
    ज्ञात्वा महादेवो हरेर्भक्ति सुनिश्चलाम् । प्रादुर्भूतो महादेवो मण्डलात्तिग्मदीधितेः ॥ १४४॥ सूर्यकोटिप्रतीकाशस्त्रिनेत्रश्चन्द्रशेखरः
    । शूलटङ्कदगाचक्रकुन्तपाशधरो विभुः ॥ १४५॥ वरदाभयपाणिश्च सर्वाभरणभूषितः । तं दृष्ट्वा देवदेवेशं भगवान्कमलेक्षणः
    ॥ १४६॥ पुनर्ननाम चरणौ दण्डवच्छूलपाणिनः । दृष्ट्वा शम्भुं तदा देवा दुद्रुवुर्भयविह्वलाः ॥ १४७॥ चचाल
    ब्रह्मभुवनं चकम्पे च वसुन्धरा । अधश्चोर्ध्वं ततः प्रीते ददाह शतयोजनम् ॥ १४८॥ शम्भोर्भगवतस्तेजस्तद्दृष्ट्वा
    प्रहसञ्शिवः । अब्रवीच्छार्ङ्गिणं विप्राः कृताञ्जलिपुटं स्थितम् ॥ १४९॥ देवकार्यमिऽदं ज्ञातमिदानीं मधुसूदन
    । दिव्यं ददामि ते चक्रमद्भुतं तत्सुदर्शनम् ॥ १५०॥ हितार्थं सर्वदेवानां निर्मितं यन्मया पुरा । गृहीत्वा
    तद्गुणैर्दैत्याञ्जहि विष्णो ममाऽऽज्ञया ॥ १५१॥ एवमुक्त्वा ददौ चक्रं सूर्यायुतसमप्रभम् । लोकेषु पुण्डरीकाक्ष
    इति ख्यातिं गता हरिः ॥ १५२॥ पुनस्तमब्रवीच्छम्भुर्नारायणमनामयम् । वरानन्यान्सुरश्रेष्ठ वरयस्व यथेप्सितान्
    ॥ १५३॥ एवं शम्भोर्निगदितं श्रुत्वा देवो जनार्दनः । अब्रवीत्खण्डपरशुं प्राञ्जलिः प्रणयान्वितः ॥ १५४॥
    श्रीविष्णुरुवाच
