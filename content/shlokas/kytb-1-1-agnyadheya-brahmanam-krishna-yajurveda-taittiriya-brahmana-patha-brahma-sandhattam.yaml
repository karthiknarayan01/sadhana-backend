    । अहे॑ बुद्ध्निय॒ मन्त्र॑ म्मे गोपा॒येति॑ । अ॒ग्नीन् वाव सा तान् व्य॑क्रमत । ता न्प्र॒जाप॑तिः॒ पर्य॑गृह्णात्
    । अथो॑ प॒ङ्क्तिमे॒व ॥ प॒ङ्क्तिर्वा ए॒षा ब्रा ऽधि॒ निर्मि॑मीते । यद॒ग्नि ऽग्नय॒ आधी॑यन्ते । पाङ्क्तं॒
    म् । पाङ्क्ते॑नै॒व पाङ्क्तग्ग्॑ स्पृणोति ॥ अथ॑र्व पि॒तु म्मे॑ गोपा॒येत्या॑ह । अन्न॑मे॒वै तेन॑ स्पृणोति
    । नर्य॑ प्र॒जा म्मे॑ गोपा॒येत्या॑ह । प्र॒जामे॒वैतेन॑ स्पृणोति । शग्ग् न्मे॑ गोपा॒येत्या॑ह ॥ ॥ प॒शूने॒वैतेन॑
    स्पृणोति । सप्र॑थ स॒भा म्मे॑ गोपा॒येत्या॑ह । स॒भामे॒वैतेनॆ स्पृ॑णोति । अहे॑ बुद्ध्निय॒ मन्त्र॑ म्मे
    गोपा॒येत्या॑ह । मन्त्र॑मे॒वै तेन॒ श्रियग्ग्॑ स्पृणोति ॥ यद॑न्वाहार्य॒ ऽस्या॒भीष्टः॑ प्री॒तः । य ह॑पत्य॒
    आज्य॑मधि॒श्रय॑न्ति॒ सम्पत्नी र्या॒जय॑न्ति । तेन॒ सो ऽस्या॒भीष्टः॑ प्री॒तः । यदा॑हव॒नीये॒ जुह्व॑ति
    ॥ ऽस्या॒भीष्टः॑ प्री॒तः । यथ्स॒भायां विँ॒जय॑न्ते । तेन॒ सो ऽस्या॒भीष्टः॑ प्री॒तः । यदा॑वस॒थे ऽन्न॒ग्ं॒
    हर॑न्ति । तेन॒ सो ऽस्या॒भीष्टः॑ प्री॒तः । तथा प्री॒ता अ॒भीष्टा॒ आधी॑यन्ते ॥ प्र॒व॒स॒थ ब्राह्म॒णाय॑
    गृहेवा॒सिने॑ परि॒दाय॑ गृ॒हानेति॑ । ता॒दृगे॒व तत् ॥ पुन॑रा॒ग त्योप॑तिष्ठते । सा भा॑गेयमे॒वैषा॒ न्तत्
    । सा तत॑ ऊ॒र्ध्वा ऽऽरो॑हत् । सा रो॑हि॒ण्य॑भवत् । त द्रो॑हि॒ण्यै रो॑हिणि॒त्वम् । रो॒हि॒ण्या माद॑धीत
    । स्व ए॒वैनं॒ माध॑त्ते । ऋ॒द्ध्नोत्ये॑नेन ॥ प॒शून्मे॑ गोपा॒येति॒ प॒शून्मे॑ गोपा॒येत्या॑ह॒ दे॑वासु॒रास्तद॒ग्निर्नो
    ऽश्वो॒ वारो॑ भू॒त्वा ॥ हरिः॑ ओम् ॥ ॥ कृष्ण यजुर्वेदीय तैत्तिरीय ब्राह्मणे प्रथमाष्टके प्रथमः प्रपाठक
