id: shivastotramvetalabhairavabhyamkritam
category: stotram
name:
  english: shivastotramvetalabhairavabhyamkritam
  devanagari: शिवस्तोत्रम्वेतालभैरवाभ्यांकृतं
content:
  english: vetalabhairavabhyam kritam shivastotram vetalabhairavavucatuh pancavaktram mahakavyam sarvajnanamayam
    param | samsarasagaratranam pranamavo vrishadhvajam || 179|| tvam parah paramatma ca pareshah purushottamah
    | tvam kutastho jagadvyapi pradhanah parameshvarah || 180|| rupatma tvam mahatattvam tattvajnanalayah
    prabhuh | sankhyayogalayah shuddho gunatrayavibhagavit || 181|| tvam nityastvamanityashca jagatkarta
    layah smritah | eko'nekasvarupashca shantaceshto jaganmayah || 182|| nirvikaro niradharo nityanandah
    sanatanah | tvam vishnustvam mahendrastvam brahma tvam jagatam patih || 183|| yo ruparupeshvararatnamalah
    sambhutibhuto niravagrahashca | kakshyavatirnavagatapramathi yogeshvaro jnanagatistvagamyah || 184||
    prameyarupatmadharadharabho bhogindrabaddhamritabhogatantrah | sukshmaksharastattvavidapramathi tvam
    devadevah sharanam suranam || 185|| vikalpamanaparihinadehah shuddhantadhamanugataikavidyah | vardhishnurugrah
    purushah paratma tvamindriyaughasya vicarabuddhih || 186|| tvam nathanatha prabhavah paresham gatirmuninam
    parayogigamyah | tvam bhudharo bhagadharo hyananto vishvatmanaste bahavah prapancah || 187|| jnanamritasyandakapurnacandro
    mohandhakarasya parah pradipah | bhaktatmajanam paramah pita tvam kame ca pancananarupadhari || 188||
    shastrakhilanam prathamo vivasvamstanunapat tvam tanushe gunaughan | tvam brahmarupena karoshi srishtim
    vishnusvarupaih satatam sthitim ca || 189|| tvam rudrarupi kurushe tathantam tvatto na canyajjagatiha
    vastu | tvam ratrinatho divaseshvarashca tvamagnirapah pavano dharitri || 190|| nabhastatha tvam kratutantrahota
    tvamashtamurtirbhavato na canyat | anantamurtistviha mukhyabhavannigadyate cashtamayi trimurtih ||
    191|| anantamurte kathamanyatha te sankhyasti rupasya yadashtamurtih | tvam tryambakastvam tripurantakashca
    tvamshambhurishah shamano vidhata || 192|| sahasrabahushca hiranyabahuh sahasramurtistviha pancavaktrah
    | prabhutanetrastu shadarddhanetrah prabhutabahurdashabahurishah || 193|| prabhutabhogi mitabhogayukto
    bhogyanusaro niravagrahashca || 194|| nityanityasvarupaya nityadhamasvarupine | paratattvasvarupaya
    namastubhyam shivatmane || 195|| nantam lingasya yasyaptam vishnuna brahmana tava | tasyavam kim vidhasyavah
    stutivakyam vrishadhvaja || 196|| svarupam yasya jananti na deva napi danavah | alavavam kathantu
    tvam stoshyavah parameshvarah || 197|| bhaktimatrena devesha tavavam vrishabhadhvaja | kurvah pranamam
    gaurisha bhuyastubhyam namo namah || 198|| iti kalikapurane ekapancashattamadhyayantargatam vetalabhairavabhyam
    kritam shivastotram sampurnam |
  devanagari: वेतालभैरवाभ्यां कृतं शिवस्तोत्रम् वेतालभैरवावूचतुः पञ्चवक्त्रं महाकाव्यं सर्वज्ञानमयं परम्
    । संसारसागरत्राणं प्रणमावो वृषध्वजम् ॥ १७९॥ त्वं परः परमात्मा च परेशः पुरुषोत्तमः । त्वं कूटस्थो जगद्व्यापी
    प्रधानः परमेश्वरः ॥ १८०॥ रूपात्मा त्वं महातत्त्वं तत्त्वज्ञानालयः प्रभुः । साङ्ख्ययोगालयः शुद्धो गुणत्रयविभागवित्
    ॥ १८१॥ त्वं नित्यस्त्वमनित्यश्च जगत्कर्ता लयः स्मृतः । एकोऽनेकस्वरूपश्च शान्तचेष्टो जगन्मयः ॥ १८२॥
    निर्विकारो निराधारो नित्यानन्दः सनातनः । त्वं विष्णुस्त्वं महेन्द्रस्त्वं ब्रह्मा त्वं जगतां पतिः
    ॥ १८३॥ यो रूपरूपेश्वररत्नमालः सम्भूतिभूतो निरवग्रहश्च । काक्ष्यावतीर्णावगतप्रमाथी योगेश्वरो ज्ञानगतिस्त्वगम्यः
    ॥ १८४॥ प्रमेयरूपात्मधराधराभो भोगीन्द्रबद्धामृतभोगतन्त्रः । सूक्ष्माक्षरस्तत्त्वविदप्रमाथी त्वं देवदेवः
    शरणं सुराणाम् ॥ १८५॥ विकल्पमानापरिहीनदेहः शुद्धान्तधामानुगतैकविद्यः । वर्धिष्णुरुग्रः पुरुषः परात्मा
    त्वमिन्द्रियौघस्य विचारबुद्धिः ॥ १८६॥ त्वं नाथनाथ प्रभवः परेषां गतिर्मुनीनां परयोगिगम्यः । त्वं भूधरो
    भागधरो ह्यनन्तो विश्वात्मनस्ते बहवः प्रपञ्चाः ॥ १८७॥ ज्ञानामृतस्यन्दकपूर्णचन्द्रो मोहान्धकारस्य परः
    प्रदीपः । भक्तात्मजानां परमः पिता त्वं कामे च पञ्चाननरूपधारी ॥ १८८॥ शास्त्राखिलानां प्रथमो विवस्वांस्तनूनपात्
    त्वं तनुषे गुणौघान् । त्वं ब्रह्मरूपेण करोषि सृष्टिं विष्णुस्वरूपैः सततं स्थितिं च ॥ १८९॥ त्वं रुद्ररूपी
    कुरुषे तथान्तं त्वत्तो न चान्यज्जगतीह वस्तु । त्वं रात्रिनाथो दिवसेश्वरश्च त्वमग्निरापः पवनो धरित्री
    ॥ १९०॥ नभस्तथा त्वं क्रतुतन्त्रहोता त्वमष्टमूर्तिर्भवतो न चान्यत् । अनन्तमूर्तिस्त्विह मुख्यभावान्निगद्यते
    चाष्टमयी त्रिमूर्तिः ॥ १९१॥ अनन्तमूर्ते कथमन्यथा ते सङ्ख्यास्ति रूपस्य यदष्टमूर्तिः । त्वं त्र्यम्बकस्त्वं
    त्रिपुरान्तकश्च त्वंशम्भुरीशः शमनो विधाता ॥ १९२॥ सहस्रबाहुश्च हिरण्यबाहुः सहस्रमूर्तिस्त्विह पञ्चवक्त्रः
    । प्रभूतनेत्रस्तु षडर्द्धनेत्रः प्रभूतबाहुर्दशबाहुरीशः ॥ १९३॥ प्रभूतभोगी मितभोगयुक्तो भोग्यानुसारो
    निरवग्रहश्च ॥ १९४॥ नित्यानित्यस्वरूपाय नित्यधामस्वरूपिणे । परतत्त्वस्वरूपाय नमस्तुभ्यं शिवात्मने ॥
    १९५॥ नान्तं लिङ्गस्य यस्याप्तं विष्णुना ब्रह्मणा तव । तस्यावां किं विधास्यावः स्तुतिवाक्यं वृषध्वज
    ॥ १९६॥ स्वरूपं यस्य जानन्ति न देवा नापि दानवाः । आलावावां कथन्तु त्वां स्तोष्यावः परमेश्वरः ॥ १९७॥
    भक्तिमात्रेण देवेश तवावां वृषभध्वज । कुर्वः प्रणामं गौरीश भूयस्तुभ्यं नमो नमः ॥ १९८॥ इति कालिकापुराणे
    एकपञ्चाशत्तमाध्यायान्तर्गतं वेतालभैरवाभ्यां कृतं शिवस्तोत्रं सम्पूर्णम् ।
