id: namavali-36
category: stotram
name:
  english: namavali
  devanagari: नामावली
content:
  english: rinu carvangi vakshyami savadhanavadharaya | yannoktam sarvatantreshu adhuna nigadami te ||
    2|| asya shritripurasundarishatanamastotrasya parambrahma rishaye namah shirasi | gayatri chandase
    namah mukhe | shrimahatripurasundari devatayai namah hridaye | dharmarthakamamoksheshu viniyogaya
    namah sarvangeshu | om mahamayayai namah | om mahadevyai namah | om menakayai namah | om meghagarjinyai
    namah | om mohinyai namah | om harinakshyai namah | om harinyai namah | om haravalabhayai namah |
    om haripujyayai namah | om hararadhyayai namah | 10 om herayai namah | om hemavatyai namah | om harayai
    namah | om hemarupayai namah | om hemayai namah | om hemabharanabhushitayai namah | om ranginyai namah
    | om rangarupayai namah | om radhayai namah | om vrindavaneshvaryai namah | 20 om valayai namah |
    om valavatyai namah | om balayai namah | om balikayai namah | om veshadharinyai namah | om vayasthayai
    namah | om veshadhayai namah | om vidyayai namah | om shrivishnupujitayai namah | om viyadgangayai
    namah | 30 om vyomagangayai namah | om vishalayai namah | om vishvamohinyai namah | om ranginyai namah
    | om ranganiyayai namah | om ranabhumikritalayayai namah | om putayai namah | om pavitrayai namah
    | om paramayai namah | om parayai namah | 40 om punyayai namah | om vibhushanayai namah | om punyanamnyai
    namah | om papahantryai namah | om paparaye namah | om papanashinyai namah | om punyadayai namah |
    om punyakirtaye namah | om punyashlokayai namah | om pavanyai namah | 50 om rupamalayai namah | om
    rupavatyai namah | om rasayai namah | om veshaparicchdayai namah | om rakshanyai namah | om rakshaniyayai
    namah | om rukmamala
  devanagari: ृणु चार्वङ्गि वक्ष्यामि सावधानावधारय । यन्नोक्तं सर्वतन्त्रेषु अधुना निगदामि ते ॥ २॥ अस्य
    श्रीत्रिपुरसुन्दरीशतनामस्तोत्रस्य परम्ब्रह्म ऋषये नमः शिरसि । गायत्री छन्दसे नमः मुखे । श्रीमहात्रिपुरसुन्दरी
    देवतायै नमः हृदये । धर्मार्थकाममोक्षेषु विनियोगाय नमः सर्वाङ्गेषु । ॐ महामायायै नमः । ॐ महादेव्यै
    नमः । ॐ मेनकायै नमः । ॐ मेघगर्जिन्यै नमः । ॐ मोहिन्यै नमः । ॐ हरिणाक्ष्यै नमः । ॐ हारिण्यै नमः । ॐ
    हरवलभायै नमः । ॐ हरिपूज्यायै नमः । ॐ हराराध्यायै नमः । १० ॐ हेरायै नमः । ॐ हेमवत्यै नमः । ॐ हरायै
    नमः । ॐ हेमरूपायै नमः । ॐ हेमायै नमः । ॐ हेमाभरणभूषितायै नमः । ॐ रङ्गिण्यै नमः । ॐ रङ्गरूपायै नमः
    । ॐ राधायै नमः । ॐ वृन्दावनेश्वर्यै नमः । २० ॐ वलायै नमः । ॐ वलवत्यै नमः । ॐ बालायै नमः । ॐ बालिकायै
    नमः । ॐ वेशधारिण्यै नमः । ॐ वयस्थायै नमः । ॐ वेशधायै नमः । ॐ विद्यायै नमः । ॐ श्रीविष्णुपूजितायै नमः
    । ॐ वियद्गङ्गायै नमः । ३० ॐ व्योमगङ्गायै नमः । ॐ विशालायै नमः । ॐ विश्वमोहिन्यै नमः । ॐ रङ्गिण्यै
    नमः । ॐ रङ्गणीयायै नमः । ॐ रणभूमिकृतालयायै नमः । ॐ पूतायै नमः । ॐ पवित्रायै नमः । ॐ परमायै नमः । ॐ
    परायै नमः । ४० ॐ पुण्यायै नमः । ॐ विभूषणायै नमः । ॐ पुण्यनाम्न्यै नमः । ॐ पापहन्त्र्यै नमः । ॐ पापारये
    नमः । ॐ पापनाशिन्यै नमः । ॐ पुण्यदायै नमः । ॐ पुण्यकीर्तये नमः । ॐ पुण्यश्लोकायै नमः । ॐ पावन्यै नमः
    । ५० ॐ रूपमालायै नमः । ॐ रुपवत्यै नमः । ॐ रसायै नमः । ॐ वेशपरिच्छ्दायै नमः । ॐ रक्षण्यै नमः । ॐ रक्षणीयायै
    नमः । ॐ रुक्ममाला
