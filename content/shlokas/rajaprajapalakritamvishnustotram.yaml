id: rajaprajapalakritamvishnustotram
category: stotram
name:
  english: rajaprajapalakritamvishnustotram
  devanagari: राजाप्रजापालकृतंविष्णुस्तोत्रम्
content:
  english: uvaca | namami devam jagatam ca murttim gopendramindranujamaprameyam | samsaracakrakramanaikadaksham
    kshitidharam devavaram namami || 12|| bhavodadhau duhkhashatormmibhime jaravartte krishnapatalamule
    | tadantameko dadhate sukham me namo'stu te gopatiraprameya || 13|| vyadhyadiyuktah purushairgrahaishca
    sanghattamanam punareva deva | namo'stu te yuddharate mahatma janardano gopatirugrabahuh || 14|| tvamuttamah
    sarvavidam suresha tvaya tatam vishvamidam samastam | gopendra mam pahi mahanubhava bhavadbhitam tigmarathangapane
    || 15|| paro'si deva pravarah suranam pumsah svarupo'si shashiprakashah | hutashavaktracyuta tivrabhava
    gopendra mam pahi bhave patantam || 16|| samsaracakrakramananyanekanyavirbhavantyacyuta dehinam yat
    | tvanmayaya mohitanam suresha kaste mayam tarate dvandvadhama || 17|| agotramasparshamarupagandhamanamanirdeshamajam
    varenyam | gopendra tvam yadyupasanti dhiraste muktibhajo bhavabandhamuktah || 18|| shabdatigam vyomarupam
    vimurttim vikarmminam shubhabhavam varenyam | cakrabjapanim tu tathopacaraduktam purane satatam namami
    || 19|| trivikramam krantajagattrayam ca caturmurttim vishvagatam kshitisham | shambhum vibhum bhutapatim
    suresham namamyaham vishnumanantamurttim || 20|| tvam deva sarvani caracarani srijasyatho samharase
    tvameva | mam muktikamam naya deva shighram yasmin gata yogino napayanti || 21|| jayasva govinda mahanubhava
    jayasva vishno jaya padmanabha | jayasva sarvajna jayaprameya jayasva vishveshvara vishvamurtte ||
    22|| iti varahapurane shattrimshadhyayantargatam raja prajapalakritam vishnustotram samaptam | varahapurana
    | adhyaya 36
  devanagari: उवाच । नमामि देवं जगतां च मूर्त्तिं गोपेन्द्रमिन्द्रानुजमप्रमेयम् । संसारचक्रक्रमणैकदक्षं
    क्षितीधरं देववरं नमामि ॥ १२॥ भवोदधौ दुःखशतोर्म्मिभीमे जरावर्त्ते कृष्णपातालमूले । तदन्तमेको दधते सुखं
    मे नमोऽस्तु ते गोपतिरप्रमेय ॥ १३॥ व्याध्यादियुक्तः पुरुषैर्ग्रहैश्च सङ्घट्टमानं पुनरेव देव । नमोऽस्तु
    ते युद्धरते महात्मा जनार्दनो गोपतिरुग्रबाहुः ॥ १४॥ त्वमुत्तमः सर्वविदां सुरेश त्वया ततं विश्वमिदं
    समस्तम् । गोपेन्द्र मां पाहि महानुभाव भवाद्भीतं तिग्मरथाङ्गपाणे ॥ १५॥ परोऽसि देव प्रवरः सुराणां पुंसः
    स्वरूपोऽसि शशिप्रकाशः । हुताशवक्त्राच्युत तीव्रभाव गोपेन्द्र मां पाहि भवे पतन्तम् ॥ १६॥ संसारचक्रक्रमणान्यनेकान्याविर्भवन्त्यच्युत
    देहिनां यत् । त्वन्मायया मोहितानां सुरेश कस्ते मायां तरते द्वन्द्वधामा ॥ १७॥ अगोत्रमस्पर्शमरूपगन्धमनामनिर्देशमजं
    वरेण्यम् । गोपेन्द्र त्वां यद्युपासन्ति धीरास्ते मुक्तिभाजो भवबन्धमुक्ताः ॥ १८॥ शब्दातिगं व्योमरूपं
    विमूर्त्तिं विकर्म्मिणां शुभभावं वरेण्यम् । चक्राब्जपाणिं तु तथोपचारादुक्तं पुराणे सततं नमामि ॥ १९॥
    त्रिविक्रमं क्रान्तजगत्त्रयं च चतुर्मूर्त्तिं विश्वगतां क्षितीशम् । शम्भुं विभुं भूतपतिं सुरेशं नमाम्यहं
    विष्णुमनन्तमूर्त्तिम् ॥ २०॥ त्वं देव सर्वाणि चराचराणि सृजस्यथो संहरसे त्वमेव । मां मुक्तिकामं नय देव
    शीघ्रं यस्मिन् गता योगिनो नापयान्ति ॥ २१॥ जयस्व गोविन्द महानुभाव जयस्व विष्णो जय पद्मनाभ । जयस्व सर्वज्ञ
    जयाप्रमेय जयस्व विश्वेश्वर विश्वमूर्त्ते ॥ २२॥ इति वराहपुराणे षट्त्रिंशाध्यायान्तर्गतं राजा प्रजापालकृतं
    विष्णुस्तोत्रं समाप्तम् । वराहपुराण । अध्याय ३६
