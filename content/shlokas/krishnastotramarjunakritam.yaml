id: krishnastotramarjunakritam
category: stotram
name:
  english: krishnastotramarjunakritam
  devanagari: कृष्णस्तोत्रंअर्जुनकृतम्
content:
  english: namo'stu te cakradharograrupa namo'stu te sharngadhararunaksha | namo'stu te'bhyudyatakhadga
    raudra namo'stu vibhrantagadantakarin || 20|| bhayena sanno'smi savepathena nangani me deva vasham
    prayanti | vacah samuccarayatah skhalanti kesha hrishikesha samucchvasanti || 21|| kalo bhavankalakaralakarma
    yenaitadevam kshayamakshayatman | kshatram samudbhutarusha samastam nitam bhuvo bharavirecanaya ||
    22|| prasida kartarjaya lokanatha prasida sarvasya ca palanaya | sthitau samastasya ca kalarupa kritodyameshana
    jayavyayatman || 23|| na me drigesha tava rupametaddrashtum samartha kshubhito'smi cantah | purvasvabhavasthitavigraho'pi
    samlakshyase'tyantamasaumyarupa || 24|| smarami rupam tava vishvarupam yaddarshitam purvamabhunmamaiva
    | yasminmaya vishvamasheshamasiddrishtam sayakshoragadevadaityam || 25|| sa me smritirdarshanabhashanadi
    prakurvato natha gata pranasham | kalo'hamasmityudite tvaya tu samagateyam punarapyananta || 26||
    karta bhavankaranamapyashesham karyam ca nishkarana kartrirupa | adau sthitau samharane ca deva vishvasya
    vishvam svayameva ca tvam || 27|| brahma bhavanvishvasrigadikale vishvasya rupo'si tatha visrishtau
    | vishnuh sthitau palanabaddhakaksho rudro bhavansamharane prajanam || 28|| ebhistribhirnatha vibhutibhedairyashcintyate
    karanamatmano'pi | vedantavedoditamasti vishnoh padam dhruvam tatparamam tvameva || 29|| yannirgunam
    sarvavikalpahinamanantamasthulamarupagandham | param padam vedavido vadanti tvameva tacchabdarasadihinam
    || 30|| yatha hi mule vitapi mahadrumah pratishtitaskandhavarograshakhah | tatha samastamaramartyatiryagvyomadishabdadimayam
    tvayidam || 31|| muncami yavatparamayudhani vairishvanantahavadurmadeshu | drishtva hi tavatsahasa
    patanto nunam tavaivacyuta sa prabhavah || 32|| hata hataste bhavato drishaiva maya punah keshava
    shastrapugaih | kah karnabhishmapramukhanvijetum yushmatprasadena vina samarthah || 33|| trishulapanirmama
    yah purastannishudayanvairibalam jagama | jnatam maya sampratametadisha tava prasadasya hi sa vibhutih
    || 34|| yamendravitteshajaleshavahnisuryatmako yashca mamastrapugah | nashaya nabhutpatito'pi kaye
    tvatsannidhanasya hi so'nubhavah || 35|| balye bhavanyani cakara deva karmanyasahyani surasuranam
    | taireva janima na yatparam tvam doshah sa nirdoshamanushyatayah || 36|| talocchritagram gurubharasaramayamavistaravadadya
    jatah | padagravikshepavibhinnabhandam cikshepa ko'nyah shakatam yatha tvam || 37|| anyena kenacyuta
    putanayah pranaih samam pitamasrigvimishram | tvaya yatha stanyamativa balye goshthe ca bhagnau yamalarjunau
    tau || 38|| vishanaloshnambunipatabhimamasphotya ko va bhuvi manusho'nyah | nanarta padabjanipiditasya
    phanam samaruhya ca kaliyasya || 39|| sureshasandeshavirodhavatsu varshatsu megheshu gavannimittam
    | dinani saptasti ca kasya shaktirgovardhanam dharayitum karena || 40|| pralambacanuramukhannihatya
    kamsasuram yasya bibheti shakrah | tamashtavarsho nijaghana ko'nyo nirayodho natha manushyajanma ||
    41|| banarthamabhyudyatamugrashulam nirjitya sankhye tripurarimekah | sakarttikeyajvaramastrabahum
    karoti ko banamanacyuto'nyah || 42|| kah parijatam surasundarinam sadopabhogyam vijitendrasainyah
    | svarganmahimucchritaviryadhairyah samanayamasa yatha prabho tvam || 43|| hatva hayagrivamudaraviryam
    nishumbhashumbhau narakam ca ko'nyah | jagraha kanyapuramatmano'rtham pragjyotishakhye nagare mahatman
    || 44|| sthitau sthitastvam paripasi vishvam taistairupayairavinitabhitaih | maitri na yesham vinayaya
    tamstansarvanbhavansamharate'vyayatman || 45|| hitaya tesham kapiladirupina tvayanushasta bahavo'nujivah
    | yesham na maitri hridi te na neya vishvopakari vadha eva tesham || 46|| ittham bhavandushtavadhena
    nunam vishvopakaraya vibho pravrittah | sthitau sthitam palanameva vishnuh karoti hantyantagato'ntarudrah
    || 47|| etani canyani ca dushkarani drishtani karmani tathapi satyam | manyamahe tvam jagatah prasutim
    kim kurma maya tava mohaniyam || 48|| tvam sarvametattvayi sarvametattvattastathaitattava caitadisha
    | etatsvarupam tava sarvabhutam vibhutibhedairbahubhih sthitasya || 49|| prasida krishnacyuta vasudeva
    janardanananta nrisimha vishno | manushyasamanyadhiya yadisha drishto maya tatkshamasvadideva || 50||
    na vedmi sadbhavamaham tavadya sadbhavabhutasya caracarasya | yo vai bhavanko'pi nato'smi tasmai manushyarupaya
    caturbhujaya || 51|| devadeva jagannatha sarvapapaharo bhava | hetumatrastvaham tatra tvayaitadupasamhritam
    || 52|| prasidesha hrishikesha akshauhinya dashashta ca | tvaya grasta bhuvo bhutyai hetubhuta hi
    madvidhah || 53|| vayamanye ca govinda narah kridanakastava | madvidhaih karanairdeva karoshi sthitipalanam
    || 54|| yadatra sadasadvapi kinciduccaritam maya | bhaktimaniti tatsarvam kshantavyam mama keshava
    || 55|| iti vishnudharmeshu pancatrimsho'dhyayantargatam arjunaproktam shrikrishnastotram sampurnam
    |
  devanagari: नमोऽस्तु ते चक्रधरोग्ररूप नमोऽस्तु ते शार्ङ्गधरारुणाक्ष । नमोऽस्तु तेऽभ्युद्यतखड्ग रौद्र
    नमोऽस्तु विभ्रान्तगदान्तकारिन् ॥ २०॥ भयेन सन्नोऽस्मि सवेपथेन नाङ्गानि मे देव वशं प्रयान्ति । वाचः
    समुच्चारयतः स्खलन्ति केशा हृषीकेश समुच्छ्वसन्ति ॥ २१॥ कालो भवान्कालकरालकर्मा येनैतदेवं क्षयमक्षयात्मन्
    । क्षत्रं समुद्भूतरुषा समस्तं नीतं भुवो भारविरेचनाय ॥ २२॥ प्रसीद कर्तर्जय लोकनाथ प्रसीद सर्वस्य च
    पालनाय । स्थितौ समस्तस्य च कालरूप कृतोद्यमेशान जयाव्ययात्मन् ॥ २३॥ न मे दृगेषा तव रूपमेतद्द्रष्टुं
    समर्था क्षुभितोऽस्मि चान्तः । पूर्वस्वभावस्थितविग्रहोऽपि संलक्ष्यसेऽत्यन्तमसौम्यरूप ॥ २४॥ स्मरामि
    रूपं तव विश्वरूपं यद्दर्शितं पूर्वमभून्ममैव । यस्मिन्मया विश्वमशेषमासीद्दृष्टं सयक्षोरगदेवदैत्यम्
    ॥ २५॥ सा मे स्मृतिर्दर्शनभाषणादि प्रकुर्वतो नाथ गता प्रणाशम् । कालोऽहमस्मीत्युदिते त्वया तु समागतेयं
    पुनरप्यनन्त ॥ २६॥ कर्ता भवान्कारणमप्यशेषं कार्यं च निष्कारण कर्तृरूप । आदौ स्थितौ संहरणे च देव विश्वस्य
    विश्वं स्वयमेव च त्वम् ॥ २७॥ ब्रह्मा भवान्विश्वसृगादिकाले विश्वस्य रूपोऽसि तथा विसृष्टौ । विष्णुः
    स्थितौ पालनबद्धकक्षो रुद्रो भवान्संहरणे प्रजानाम् ॥ २८॥ एभिस्त्रिभिर्नाथ विभूतिभेदैर्यश्चिन्त्यते
    कारणमात्मनोऽपि । वेदान्तवेदोदितमस्ति विष्णोः पदं ध्रुवं तत्परमं त्वमेव ॥ २९॥ यन्निर्गुणं सर्वविकल्पहीनमनन्तमस्थूलमरूपगन्धम्
    । परं पदं वेदविदो वदन्ति त्वमेव तच्छब्दरसादिहीनम् ॥ ३०॥ यथा हि मूले विटपी महाद्रुमः प्रतिष्टितस्कन्धवरोग्रशाखः
    । तथा समस्तामरमर्त्यतिर्यग्व्योमादिशब्दादिमयं त्वयीदम् ॥ ३१॥ मुञ्चामि यावत्परमायुधानि वैरिष्वनन्ताहवदुर्मदेषु
    । दृष्ट्वा हि तावत्सहसा पतन्तो नूनं तवैवाच्युत स प्रभावः ॥ ३२॥ हता हतास्ते भवतो दृशैव मया पुनः केशव
    शस्त्रपूगैः । काः कर्णभीष्मप्रमुखान्विजेतुं युष्मत्प्रसादेन विना समर्थः ॥ ३३॥ त्रिशूलपाणिर्मम यः पुरस्तान्निषूदयन्वैरिबलं
    जगाम । ज्ञातं मया साम्प्रतमेतदीश तव प्रसादस्य हि सा विभूतिः ॥ ३४॥ यमेन्द्रवित्तेशजलेशवह्निसूर्यात्मको
    यश्च ममास्त्रपूगः । नाशाय नाभूत्पतितोऽपि काये त्वत्सन्निधानस्य हि सोऽनुभावः ॥ ३५॥ बाल्ये भवान्यानि
    चकार देव कर्माण्यसह्यानि सुरासुराणाम् । तैरेव जानीम न यत्परं त्वां दोषः स निर्दोषमनुष्यतायाः ॥ ३६॥
    तालोच्छ्रिताग्रं गुरुभारसारमायामविस्तारवदद्य जातः । पादाग्रविक्षेपविभिन्नभाण्डं चिक्षेप कोऽन्यः शकटं
    यथा त्वम् ॥ ३७॥ अन्येन केनाच्युत पूतनायाः प्राणैः समं पीतमसृग्विमिश्रम् । त्वया यथा स्तन्यमतीव बाल्ये
    गोष्ठे च भग्नौ यमलार्जुनौ तौ ॥ ३८॥ विषानलोष्णाम्बुनिपातभीममास्फोट्य को वा भुवि मानुषोऽन्यः । ननर्त
    पादाब्जनिपीडितस्य फणं समारुह्य च कालियस्य ॥ ३९॥ सुरेशसन्देशविरोधवत्सु वर्षत्सु मेघेषु गवान्निमित्तम्
    । दिनानि सप्तास्ति च कस्य शक्तिर्गोवर्धनं धारयितुं करेण ॥ ४०॥ प्रलम्बचाणूरमुखान्निहत्य कंसासुरं यस्य
    बिभेति शक्रः । तमष्टवर्षो निजघान कोऽन्यो निरायोधो नाथ मनुष्यजन्मा ॥ ४१॥ बाणार्थमभ्युद्यतमुग्रशूलं
    निर्जित्य सङ्ख्ये त्रिपुरारिमेकः । सकार्त्तिकेयज्वरमस्त्रबाहुं करोति को बाणमनच्युतोऽन्यः ॥ ४२॥ कः
    पारिजातं सुरसुन्दरीणां सदोपभोग्यं विजितेन्द्रसैन्यः । स्वर्गान्महीमुच्छ्रितवीर्यधैर्यः समानयामास यथा
    प्रभो त्वम् ॥ ४३॥ हत्वा हयग्रीवमुदारवीर्यं निशुम्भशुम्भौ नरकं च कोऽन्यः । जग्राह कन्यापुरमात्मनोऽर्थं
    प्राग्ज्योतिषाख्ये नगरे महात्मन् ॥ ४४॥ स्थितौ स्थितस्त्वं परिपासि विश्वं तैस्तैरुपायैरविनीतभीतैः ।
    मैत्री न येषां विनयाय तांस्तान्सर्वान्भवान्संहरतेऽव्ययात्मन् ॥ ४५॥ हिताय तेषां कपिलादिरूपिणा त्वयानुशस्ता
    बहवोऽनुजीवाः । येषां न मैत्री हृदि ते न नेया विश्वोपकारी वध एव तेषाम् ॥ ४६॥ इत्थं भवान्दुष्टवधेन नूनं
    विश्वोपकाराय विभो प्रवृत्तः । स्थितौ स्थितं पालनमेव विष्णुः करोति हन्त्यन्तगतोऽन्तरुद्रः ॥ ४७॥ एतानि
    चान्यानि च दुष्कराणि दृष्टानि कर्माणि तथापि सत्यम् । मन्यामहे त्वां जगतः प्रसूतिं किं कुर्म माया तव
    मोहनीयम् ॥ ४८॥ त्वं सर्वमेतत्त्वयि सर्वमेतत्त्वत्तस्तथैतत्तव चैतदीश । एतत्स्वरूपं तव सर्वभूतं विभूतिभेदैर्बहुभिः
    स्थितस्य ॥ ४९॥ प्रसीद कृष्णाच्युत वासुदेव जनार्दनानन्त नृसिंह विष्णो । मनुष्यसामान्यधिया यदीश दृष्टो
    मया तत्क्षमस्वादिदेव ॥ ५०॥ न वेद्मि सद्भावमहं तवाद्य सद्भावभूतस्य चराचरस्य । यो वै भवान्कोऽपि नतोऽस्मि
    तस्मै मनुष्यरूपाय चतुर्भुजाय ॥ ५१॥ देवदेव जगन्नाथ सर्वपापहरो भव । हेतुमात्रस्त्वहं तत्र त्वयैतदुपसंहृतम्
    ॥ ५२॥ प्रसीदेश हृषीकेश अक्षौहिण्या दशाष्ट च । त्वया ग्रस्ता भुवो भूत्यै हेतुभूता हि मद्विधाः ॥ ५३॥
    वयमन्ये च गोविन्द नराः क्रीडनकास्तव । मद्विधैः करणैर्देव करोषि स्थितिपालनम् ॥ ५४॥ यदत्र सदसद्वापि
    किञ्चिदुच्चारितं मया । भक्तिमानिति तत्सर्वं क्षन्तव्यं मम केशव ॥ ५५॥ इति विष्णुधर्मेषु पञ्चत्रिंशोऽध्यायान्तर्गतं
    अर्जुनप्रोक्तं श्रीकृष्णस्तोत्रं सम्पूर्णम् ।
