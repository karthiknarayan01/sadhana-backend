id: kanakadharastotram
category: stotram
name:
  english: kanakadharastotram
  devanagari: कनकधारास्तोत्रम्
content:
  english: asminnakincanavihangashishau vishanne | dushkarmadharmamapaniya ciraya duram narayanapranayininayanambuvahah
    || 9 || girdevateti garur̤adhvajasundariti shakambhariti shashishekharavallabheti | srishtisthitipralayakelishu
    samsthitayai tasyai namastribhuvanaikagurostarunyai || 10 || shrutyai namo'stu shubhakarmaphalaprasutyai
    ratyai namo'stu ramaniyagunarnavayai | shaktyai namo'stu shatapatraniketanayai pushtyai namo'stu purushottamavallabhayai
    || 11 || namo'stu nalikanibhananayai namo'stu dugdhodadhijanmabhutyai | namo'stu somamritasodarayai
    namo'stu narayanavallabhayai || 12 || namo'stu hemambujapithikayai namo'stu bhumandalanayikayai |
    namo'stu devadidayaparayai namo'stu sharngayudhavallabhayai || 13 || namo'stu devyai bhrigunandanayai
    namo'stu vishnorurasi sthitayai | namo'stu lakshmyai kamalalayayai namo'stu damodaravallabhayai ||
    14 || namo'stu kantyai kamalekshanayai namo'stu bhutyai bhuvanaprasutyai | namo'stu devadibhirarcitayai
    namo'stu nandatmajavallabhayai || 15 || sampatkarani sakalendriyanandanani samrajyadanavibhavani saroruhakshi
    | tvadvandanani duritoddharanodyatani mameva mataranisham kalayantu manye || 16 || yatkatakshasamupasanavidhih
    sevakasya sakalarthasampadah | santanoti vacanangamanasais
  devanagari: अस्मिन्नकिञ्चनविहङ्गशिशौ विषण्णे । दुष्कर्मधर्ममपनीय चिराय दूरं नारायणप्रणयिनीनयनाम्बुवाहः
    ॥ ९ ॥ गीर्देवतेति गरुड़ध्वजसुन्दरीति शाकम्भरीति शशिशेखरवल्लभेति । सृष्टिस्थितिप्रलयकेलिषु संस्थितायै
    तस्यै नमस्त्रिभुवनैकगुरोस्तरुण्यै ॥ १० ॥ श्रुत्यै नमोऽस्तु शुभकर्मफलप्रसूत्यै रत्यै नमोऽस्तु रमणीयगुणार्णवायै
    । शक्त्यै नमोऽस्तु शतपत्रनिकेतनायै पुष्ट्यै नमोऽस्तु पुरुषोत्तमवल्लभायै ॥ ११ ॥ नमोऽस्तु नालीकनिभाननायै
    नमोऽस्तु दुग्धोदधिजन्मभूत्यै । नमोऽस्तु सोमामृतसोदरायै नमोऽस्तु नारायणवल्लभायै ॥ १२ ॥ नमोऽस्तु हेमाम्बुजपीठिकायै
    नमोऽस्तु भूमण्डलनायिकायै । नमोऽस्तु देवादिदयापरायै नमोऽस्तु शार्ङ्गायुधवल्लभायै ॥ १३ ॥ नमोऽस्तु देव्यै
    भृगुनन्दनायै नमोऽस्तु विष्णोरुरसि स्थितायै । नमोऽस्तु लक्ष्म्यै कमलालयायै नमोऽस्तु दामोदरवल्लभायै
    ॥ १४ ॥ नमोऽस्तु कान्त्यै कमलेक्षणायै नमोऽस्तु भूत्यै भुवनप्रसूत्यै । नमोऽस्तु देवादिभिरर्चितायै नमोऽस्तु
    नन्दात्मजवल्लभायै ॥ १५ ॥ सम्पत्कराणि सकलेन्द्रियनन्दनानि साम्राज्यदानविभवानि सरोरुहाक्षि । त्वद्वन्दनानि
    दुरितोद्धरणोद्यतानि मामेव मातरनिशं कलयन्तु मान्ये ॥ १६ ॥ यत्कटाक्षसमुपासनाविधिः सेवकस्य सकलार्थसम्पदः
    । सन्तनोति वचनाङ्गमानसैस्
