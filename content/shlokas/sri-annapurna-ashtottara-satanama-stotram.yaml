id: sri-annapurna-ashtottara-satanama-stotram
category: stotram
name:
  english: Sri Annapurna Ashtottara Satanama Stotram
content:
  english: asya shri annapurnashtottara shatanamastotra mahamantrasya brahma rishih anushtupchandah shri
    annapurneshvari devata svadha bijam svaha shaktih om kilakam mama sarvabhishtaprasadasiddhyarthe jape
    viniyogah | om annapurna shiva devi bhima pushtissarasvati | sarvajna parvati durga sharvani shivavallabha
    || || vedavedya mahavidya vidyadatri visharada | kumari tripura bala lakshmishshrirbhayaharini ||
    || bhavani vishnujanani brahmadijanani tatha | ganeshajanani shaktih kumarajanani shubha || || bhogaprada
    bhagavati bhaktabhishtapradayini | bhavarogahara bhavya shubhra paramamangala || || bhavani cancala
    gauri carucandrakaladhara | vishalakshi vishvamata vishvavandya vilasini || || arya kalyananilaya
    rudrani kamalasana | shubhaprada shubha'nanta vrittapinapayodhara || || amba samharamathani mridani
    sarvamangala | vishnusamsevita siddha brahmani surasevita || || paramanandada shantih paramanandarupini
    | paramanandajanani paranandapradayini || || paropakaranirata parama bhaktavatsala | purnacandrabhavadana
    purnacandranibhamshuka || || shubhalakshanasampanna shubhanandagunarnava | shubhasaubhagyanilaya shubhada
    ca ratipriya || || candika candamathani candadarpanivarini | martandanayana sadhvi candragninayana
    sati || || pundarikahara purna punyada punyarupini | mayatita shreshthamaya shreshthadharmatmavandita
    || || asrishtissangarahita srishtihetu kapardini | vrisharudha shulahasta sthitisamharakarini || ||
    mandasmita skandamata shuddhacitta munistuta | mahabhagavati daksha dakshadhvaravinashini || || sarvarthadatri
    savitri sadashivakutumbini | nityasundarasarvangi saccidanandalakshana || || namnamashtottarashatamambayah
    punyakaranam | sarvasaubhagyasiddhyartham japaniyam prayatnatah || || idam japadhikarastu pranameva
    tatasstutah | avahantiti mantrena pratyekam ca yathakramam || || kartavyam tarpanam nityam pithamantreti
    mulavat | tattanmantretihometi kartavyashceti malavat || || etani divyanamani shrutva dhyatva nirantaram
    | stutva devim ca satatam sarvankamanavapnuyat || || iti shri brahmottarakhande agamaprakhyatishivarahasye
    annapurnashtottara shatanamastotram ||
  devanagari: अस्य श्री अन्नपूर्णाष्टोत्तर शतनामस्तोत्र महामन्त्रस्य ब्रह्मा ऋषिः अनुष्टुप्छन्दः श्री
    अन्नपूर्णेश्वरी देवता स्वधा बीजं स्वाहा शक्तिः ॐ कीलकं मम सर्वाभीष्टप्रसादसिद्ध्यर्थे जपे विनियोगः
    । ॐ अन्नपूर्णा शिवा देवी भीमा पुष्टिस्सरस्वती । सर्वज्ञा पार्वती दुर्गा शर्वाणी शिववल्लभा ॥ ॥ वेदवेद्या
    महाविद्या विद्यादात्री विशारदा । कुमारी त्रिपुरा बाला लक्ष्मीश्श्रीर्भयहारिणी ॥ ॥ भवानी विष्णुजननी
    ब्रह्मादिजननी तथा । गणेशजननी शक्तिः कुमारजननी शुभा ॥ ॥ भोगप्रदा भगवती भक्ताभीष्टप्रदायिनी । भवरोगहरा
    भव्या शुभ्रा परममङ्गला ॥ ॥ भवानी चञ्चला गौरी चारुचन्द्रकलाधरा । विशालाक्षी विश्वमाता विश्ववन्द्या
    विलासिनी ॥ ॥ आर्या कल्याणनिलया रुद्राणी कमलासना । शुभप्रदा शुभाऽनन्ता वृत्तपीनपयोधरा ॥ ॥ अम्बा संहारमथनी
    मृडानी सर्वमङ्गला । विष्णुसंसेविता सिद्धा ब्रह्माणी सुरसेविता ॥ ॥ परमानन्ददा शान्तिः परमानन्दरूपिणी
    । परमानन्दजननी परानन्दप्रदायिनी ॥ ॥ परोपकारनिरता परमा भक्तवत्सला । पूर्णचन्द्राभवदना पूर्णचन्द्रनिभांशुका
    ॥ ॥ शुभलक्षणसम्पन्ना शुभानन्दगुणार्णवा । शुभसौभाग्यनिलया शुभदा च रतिप्रिया ॥ ॥ चण्डिका चण्डमथनी चण्डदर्पनिवारिणी
    । मार्ताण्डनयना साध्वी चन्द्राग्निनयना सती ॥ ॥ पुण्डरीकहरा पूर्णा पुण्यदा पुण्यरूपिणी । मायातीता श्रेष्ठमाया
    श्रेष्ठधर्मात्मवन्दिता ॥ ॥ असृष्टिस्सङ्गरहिता सृष्टिहेतु कपर्दिनी । वृषारूढा शूलहस्ता स्थितिसंहारकारिणी
    ॥ ॥ मन्दस्मिता स्कन्दमाता शुद्धचित्ता मुनिस्तुता । महाभगवती दक्षा दक्षाध्वरविनाशिनी ॥ ॥ सर्वार्थदात्री
    सावित्री सदाशिवकुटुम्बिनी । नित्यसुन्दरसर्वाङ्गी सच्चिदानन्दलक्षणा ॥ ॥ नाम्नामष्टोत्तरशतमम्बायाः पुण्यकारणम्
    । सर्वसौभाग्यसिद्ध्यर्थं जपनीयं प्रयत्नतः ॥ ॥ इदं जपाधिकारस्तु प्राणमेव ततस्स्तुतः । आवहन्तीति मन्त्रेण
    प्रत्येकं च यथाक्रमम् ॥ ॥ कर्तव्यं तर्पणं नित्यं पीठमन्त्रेति मूलवत् । तत्तन्मन्त्रेतिहोमेति कर्तव्यश्चेति
    मालवत् ॥ ॥ एतानि दिव्यनामानि श्रुत्वा ध्यात्वा निरन्तरम् । स्तुत्वा देवीं च सततं सर्वान्कामानवाप्नुयात्
    ॥ ॥ इति श्री ब्रह्मोत्तरखण्डे आगमप्रख्यातिशिवरहस्ये अन्नपूर्णाष्टोत्तर शतनामस्तोत्रम् ॥
