id: venkateshashlokatrayam
category: stotram
name:
  english: venkateshashlokatrayam
  devanagari: वेन्कटेशश्लोकत्रयम्
content:
  english: venkatesha pratahsmaranam shlokatrayam pratah smarami ramaya saha venkatesham mandasmitam mukhasaroruhakantiramyam
    | manikyakantivilasanmakutordhvapundram padmakshalakshyamanikundalamanditangam || 1|| pratarbhajami
    kararamyasushankhacakram bhaktabhayapradakatisthaladattapanim | shrivatsakaustubhalasanmanibhushanodyat
    pitambaram madanakotisumohanangam || 2|| pratarnamami paramadya padaravindam anandasandranilayam maninupuradhyam
    | etatsamastajagatamiti darshayantam vaikunthamatra bhajatam karapallavena || 3|| shlokatrayasya pathanam
    dinapurvakale dussvapnadushshakunadurbhayapapashantyai | nityam karoti matimanparamatmarupam shrivenkateshanilayam
    vrajati sma yo'sau || shrih ghanagurave namah | || iti venkatesha pratahsmaranam shlokatrayam ||
  devanagari: वेङ्कटेश प्रातःस्मरणं श्लोकत्रयम् प्रातः स्मरामि रमया सह वेङ्कटेशं मन्दस्मितं मुखसरोरुहकान्तिरम्यम्
    । माणिक्यकान्तिविलसन्मकुटोर्ध्वपुण्ड्रं पद्माक्षलक्ष्यमणिकुण्डलमण्डिताङ्गम् ॥ १॥ प्रातर्भजामि कररम्यसुशङ्खचक्रं
    भक्ताभयप्रदकटिस्थलदत्तपाणिम् । श्रीवत्सकौस्तुभलसन्मणिभूषणोद्यत् पीताम्बरं मदनकोटिसुमोहनाङ्गम् ॥ २॥
    प्रातर्नमामि परमाद्य पदारविन्दं आनन्दसान्द्रनिलयं मणिनूपुराढ्यम् । एतत्समस्तजगतामिति दर्शयन्तं वैकुण्ठमत्र
    भजतां करपल्लवेन ॥ ३॥ श्लोकत्रयस्य पठनं दिनपूर्वकाले दुस्स्वप्नदुश्शकुनदुर्भयपापशान्त्यै । नित्यं करोति
    मतिमान्परमात्मरूपं श्रीवेङ्कटेशनिलयं व्रजति स्म योऽसौ ॥ श्रीः घनगुरवे नमः । ॥ इति वेङ्कटेश प्रातःस्मरणं
    श्लोकत्रयम् ॥
