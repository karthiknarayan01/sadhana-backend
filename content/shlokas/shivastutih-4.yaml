id: shivastutih-4
category: stotram
name:
  english: shivastutih
  devanagari: शिवस्तुतिः
content:
  english: spharashobhikusumanga mahesha | dhumavahavaha shankara shambho vyomadhama bhagavannava mam
    tvam || 73|| shambho balamrigankashekhara mahasarpangamalojjvala kandarpantaka sharva sarvaga vibho
    durvadalarcyanghrika | vedeshakhilapala bhalashashabhritputangasangatula lilagangasutungabhangaparamanandangasangava
    mam || 74|| vishvotpattivipattisamsthitijagatkaryam ca tatkaranam jiveshashrayabhedabhanamakhilam
    yannamarupatmakam | kalanalpavikalpashilpa sumahasankalpakalpantaka tvayyanandapayodhivarilahari vidyotate
    kevalam || 75|| vishnubrahmamukhah surasuravara ye bhasura bhusurah sanjatahsthitinashamadhyapatita
    bhrantashca samsarinah | vishvadhishvara shankara tribhuvanaparoruduhkhartihan kalatita maheshvarava
    bhagavan vishvesha vishvadhika || 76|| iti stutva trikalam va pujante va maheshvaram | ashadhyamatha
    paurnamyam homah karyo dvijaihsaha || 77|| datva gomithunam devi savatsam ca sadakshinam | naktashano
    bhavenmasam brahmanaih paranam tatah || 78|| evamashadhapujata ashadhapratimo bhavet | candrabhayanairyatyante
    mama lokam sanatanam || 79|| || iti shivarahasyantargate ishvaraproktamashadhamasakrite shivastutih
    sampurna ||
  devanagari: स्फारशोभिकुसुमाङ्ग महेश । धूमवाहवह शङ्कर शम्भो व्योमधाम भगवन्नव मां त्वम् ॥ ७३॥ शम्भो बालमृगाङ्कशेखर
    महासर्पाङ्गमालोज्ज्वल कन्दर्पान्तक शर्व सर्वग विभो दूर्वादलार्च्याङ्घ्रिक । वेदेशाखिलपाल भालशशभृत्पूताङ्गसङ्गातुल
    लीलागाङ्गसुतुङ्गभङ्गपरमानन्दाङ्गसङ्गाव माम् ॥ ७४॥ विश्वोत्पत्तिविपत्तिसंस्थितिजगत्कार्यं च तत्कारणं
    जीवेशाश्रयभेदभानमखिलं यन्नामरूपात्मकम् । कालानल्पविकल्पशिल्प सुमहासङ्कल्पकल्पान्तक त्वय्यानन्दपयोधिवारिलहरी
    विद्योतते केवलम् ॥ ७५॥ विष्णुब्रह्ममुखाः सुरासुरवरा ये भासुरा भूसुराः सञ्जाताःस्थितिनाशमध्यपतिता भ्रान्ताश्च
    संसारिणः । विश्वाधीश्वर शङ्कर त्रिभुवनापारोरुदुःखार्तिहन् कालातीत महेश्वराव भगवन् विश्वेश विश्वाधिक
    ॥ ७६॥ इति स्तुत्वा त्रिकालं वा पूजान्ते वा महेश्वरम् । आषाढ्यामथ पौर्णम्यां होमः कार्यो द्विजैःसह
    ॥ ७७॥ दत्वा गोमिथुनं देवि सवत्सं च सदाक्षिणम् । नक्ताशनो भवेन्मासं ब्राह्मणैः पारणं ततः ॥ ७८॥ एवमाषाढपूजात
    आषाढप्रतिमो भवेत् । चन्द्राभयानैर्यात्यन्ते मम लोकं सनातनम् ॥ ७९॥ ॥ इति शिवरहस्यान्तर्गते ईश्वरप्रोक्तमाषाढमासकृते
    शिवस्तुतिः सम्पूर्णा ॥
