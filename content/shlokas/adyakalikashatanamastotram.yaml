id: adyakalikashatanamastotram
category: stotram
name:
  english: adyakalikashatanamastotram
  devanagari: आद्याकालिकाशतनामस्तोत्रम्
content:
  english: rinu devi jagadvandye stotrametadanuttamam | pathanat shravanadyasya sarvasiddhishvaro bhavet
    || 1|| asaubhagyaprashamanam sukhasampadvivardhanam | akalamrityuharanam sarvapadvinivaranam || 2||
    shrimadadyakalikayah sukhasannidhyakaranam | stavasyasya prasadena tripurariraham shive || 3|| stotrasyasya
    rishirdevi sadashiva udahritah | chando'nushtubdevata''dya kalika parikirttita | dharmakamarthamoksheshu
    viniyogah prakirttitah || 4|| om asya shriadyakalikashatanamastotramantrasya shrisadashivarishih |
    anushtupchandah | shri adyakalika devata | dharmakamarthamoksha sidhyarthe jape viniyogah || hri~
    kali shri~ karali ca kri~ kalyani kalavati | kamala kalidarpaghni kapardishakripanvita || 5|| kalika
    kalamata ca kalanalasamadyutih | kapardini karalasya karunamritasagara || 6|| kripamayi kripadhara
    kripapara kripagama | krishanuh kapila krishna krishnanandavivarddhini || 7|| kalaratrih kamarupa
    kamapashavimocani | kadambini kaladhara kalikalmashanashini || 8|| kumaripujanaprita kumaripujakalaya
    | kumaribhojanananda kumarirupadharini || 9|| kadambavanasancara kadambavanavasini | kadambapushpasantosha
    kadambapushpamalini || 10|| kishori kalakantha ca kalanadaninadini | kadambaripanarata tatha kadambaripriya
    || 11|| kapalapatranirata kankalamalyadharini | kamalasanasantushta kamalasanavasini || 12|| kamalalayamadhyastha
    kamalamodamodini | kalahamsagatih klaibyanashini kamarupini || 13|| kamarupakritavasa kamapithavilasini
    | kamaniya kalpalata kamaniyavibhushana || 14|| kamaniyagunaradhya komalangi krishodari | karanamritasantosha
    karananandasiddhida || 15|| karananandajapeshta karanarcanaharshita | karanarnavasammagna karanavratapalini
    || 16|| kasturisaurabhamoda kasturitilakojjvala | kasturipujanarata kasturipujakapriya || 17|| kasturidahajanani
    kasturimrigatoshini | kasturibhojanaprita karpuramodamodita || 18|| karpuramalabharana karpuracandanokshita
    | karpurakaranahlada karpuramritapayini || 19|| karpurasagarasnata karpurasagaralaya | kurcabijajapaprita
    kurcajapaparayana || 20|| kulina kaulikaradhya kaulikapriyakarini | kulacara kautukini kulamargapradarshini
    || 21|| kashishvari kashtahartri kashishavaradayini | kashishvarakritamoda kashishvaramanorama ||
    22|| kalamanjiracarana kvanatkancivibhushana | kancanadrikritagara kancanacalakaumudi || 23|| kamabijajapananda
    kamabijasvarupini | kumatighni kulinarttinashini kulakamini || 24|| kri~ hri~ shri~ mantravarnena
    kalakantakaghatini | ityadyakalikadevyah shatanama prakirttitam || 25|| kakarakutaghatitam kalirupasvarupakam
    | pujakale pathedyastu kalikakritamanasah || 26|| mantrasiddhirbhavedashu tasya kali prasidati | buddhim
    vidyanca labhate guroradeshamatratah || 27|| dhanavan kirttiman bhuyaddanashilo dayanvitah | putrapautrasukhaishvaryairmodate
    sadhako bhuvi || 28|| bhaumavasyanishabhage mapancakasamanvitah | pujayitva mahakalimadyam tribhuvaneshvarim
    || 29|| pathitva shatanamani sakshat kalimayo bhavet | nasadhyam vidyate tasya trishu lokeshu kincana
    || 30|| vidyayam vakpatih sakshat dhane dhanapatirbhavet | samudra iva gambhirye bale ca pavanopamah
    || 31|| tigmamshuriva dushprekshyah shashivat shubhadarshanah | rupe murttidharah kamo yoshitam hridayangamah
    || 32|| sarvatra jayamapnoti stavasyasya prasadatah | yam yam kamam puraskritya stotrametadudirayet
    || 33|| tam tam kamamavapnoti shrimadadyaprasadatah | rane rajakule dyute vivade pranasankate || 34||
    dasyugraste gramadahe simhavyaghravrite tatha | aranye prantare durge graharajabhaye'pi va || 35||
    jvaradahe ciravyadhau maharogadisankule | balagrahadiroge ca tatha duhsvapnadarshane || 36|| dustare
    salile vapi pote vatavipadgate | vicintya paramam mayamadyam kalim paratparam || 37|| yah pathecchatanamani
    dridhabhaktisamanvitah | sarvapadbhyo vimucyeta devi satyam na samshayah || 38|| na papebhyo bhayam
    tasya na rogebhyo bhayam kvacit | sarvatra vijayastasya na kutrapi parabhavah || 39|| tasya darshanamatrena
    palayante vipadganah | sa vakta sarvashastranam sa bhokta sarvasampadam || 40|| sa kartta jatidharmanam
    jnatinam prabhureva sah | vani tasya vasedvaktre kamala nishcala grihe || 41|| tannamna manavah sarve
    pranamanti sasambhramah | drishtya tasya trinayante hyanimadyashtasiddhayah || 42|| adyakalisvarupakhyam
    shatanama prakirtitam | ashtottarashatavrittya purashcarya'sya giyate || 43|| puraskriyanvitam stotram
    sarvabhishtaphalapradam | shatanamastutimimamadyakalisvarupinim || 44|| pathedva pathayedvapi sha
  devanagari: ृणु देवि जगद्वन्द्ये स्तोत्रमेतदनुत्तमम् । पठनात् श्रवणाद्यस्य सर्वसिद्धीश्वरो भवेत् ॥ १॥
    असौभाग्यप्रशमनं सुखसम्पद्विवर्धनम् । अकालमृत्युहरणं सर्वापद्विनिवारणम् ॥ २॥ श्रीमदाद्याकालिकायाः सुखसान्निध्यकारणम्
    । स्तवस्यास्य प्रसादेन त्रिपुरारिरहं शिवे ॥ ३॥ स्तोत्रस्यास्य ऋषिर्देवि सदाशिव उदाहृतः । छन्दोऽनुष्टुब्देवताऽऽद्या
    कालिका परिकीर्त्तिता । धर्मकामार्थमोक्षेषु विनियोगः प्रकीर्त्तितः ॥ ४॥ ॐ अस्य श्रीआद्याकालिकाशतनामस्तोत्रमन्त्रस्य
    श्रीसदाशिवऋषिः । अनुष्टुप्छन्दः । श्री आद्याकालिका देवता । धर्मकामार्थमोक्ष सिध्यर्थे जपे विनियोगः
    ॥ ह्रीँ काली श्रीँ कराली च क्रीँ कल्याणी कलावती । कमला कलिदर्पघ्नी कपर्दीशकृपान्विता ॥ ५॥ कालिका कालमाता
    च कालानलसमद्युतिः । कपर्दिनी करालास्या करुणामृतसागरा ॥ ६॥ कृपामयी कृपाधारा कृपापारा कृपागमा । कृशानुः
    कपिला कृष्णा कृष्णानन्दविवर्द्धिनी ॥ ७॥ कालरात्रिः कामरूपा कामपाशविमोचनी । कादम्बिनी कलाधारा कलिकल्मषनाशिनी
    ॥ ८॥ कुमारीपूजनप्रीता कुमारीपूजकालया । कुमारीभोजनानन्दा कुमारीरूपधारिणी ॥ ९॥ कदम्बवनसञ्चारा कदम्बवनवासिनी
    । कदम्बपुष्पसन्तोषा कदम्बपुष्पमालिनी ॥ १०॥ किशोरी कलकण्ठा च कलनादनिनादिनी । कादम्बरीपानरता तथा कादम्बरीप्रिया
    ॥ ११॥ कपालपात्रनिरता कङ्कालमाल्यधारिणी । कमलासनसन्तुष्टा कमलासनवासिनी ॥ १२॥ कमलालयमध्यस्था कमलामोदमोदिनी
    । कलहंसगतिः क्लैब्यनाशिनी कामरूपिणी ॥ १३॥ कामरूपकृतावासा कामपीठविलासिनी । कमनीया कल्पलता कमनीयविभूषणा
    ॥ १४॥ कमनीयगुणाराध्या कोमलाङ्गी कृशोदरी । कारणामृतसन्तोषा कारणानन्दसिद्धिदा ॥ १५॥ कारणानन्दजापेष्टा
    कारणार्चनहर्षिता । कारणार्णवसम्मग्ना कारणव्रतपालिनी ॥ १६॥ कस्तूरीसौरभामोदा कस्तूरितिलकोज्ज्वला । कस्तूरीपूजनरता
    कस्तूरीपूजकप्रिया ॥ १७॥ कस्तूरीदाहजननी कस्तूरीमृगतोषिणी । कस्तूरीभोजनप्रीता कर्पूरामोदमोदिता ॥ १८॥
    कर्पूरमालाभरणा कर्पूरचन्दनोक्षिता । कर्पूरकारणाह्लादा कर्पूरामृतपायिनी ॥ १९॥ कर्पूरसागरस्नाता कर्पूरसागरालया
    । कूर्चबीजजपप्रीता कूर्चजापपरायणा ॥ २०॥ कुलीना कौलिकाराध्या कौलिकप्रियकारिणी । कुलाचारा कौतुकिनी कुलमार्गप्रदर्शिनी
    ॥ २१॥ काशीश्वरी कष्टहर्त्री काशीशवरदायिनी । काशीश्वरकृतामोदा काशीश्वरमनोरमा ॥ २२॥ कलमञ्जीरचरणा क्वणत्काञ्चीविभूषणा
    । काञ्चनाद्रिकृतागारा काञ्चनाचलकौमुदी ॥ २३॥ कामबीजजपानन्दा कामबीजस्वरूपिणी । कुमतिघ्नी कुलीनार्त्तिनाशिनी
    कुलकामिनी ॥ २४॥ क्रीँ ह्रीँ श्रीँ मन्त्रवर्णेन कालकण्टकघातिनी । इत्याद्याकालिकादेव्याः शतनाम प्रकीर्त्तितम्
    ॥ २५॥ ककारकूटघटितं कालीरूपस्वरूपकम् । पूजाकाले पठेद्यस्तु कालिकाकृतमानसः ॥ २६॥ मन्त्रसिद्धिर्भवेदाशु
    तस्य काली प्रसीदति । बुद्धिं विद्याञ्च लभते गुरोरादेशमात्रतः ॥ २७॥ धनवान् कीर्त्तिमान् भूयाद्दानशीलो
    दयान्वितः । पुत्रपौत्रसुखैश्वर्यैर्मोदते साधको भुवि ॥ २८॥ भौमावास्यानिशाभागे मपञ्चकसमन्वितः । पूजयित्वा
    महाकालीमाद्यां त्रिभुवनेश्वरीम् ॥ २९॥ पठित्वा शतनामानि साक्षात् कालीमयो भवेत् । नासाध्यं विद्यते तस्य
    त्रिषु लोकेषु किञ्चन ॥ ३०॥ विद्यायां वाक्पतिः साक्षात् धने धनपतिर्भवेत् । समुद्र इव गाम्भीर्ये बले
    च पवनोपमः ॥ ३१॥ तिग्मांशुरिव दुष्प्रेक्ष्यः शशिवत् शुभदर्शनः । रूपे मूर्त्तिधरः कामो योषितां हृदयङ्गमः
    ॥ ३२॥ सर्वत्र जयमाप्नोति स्तवस्यास्य प्रसादतः । यं यं कामं पुरस्कृत्य स्तोत्रमेतदुदीरयेत् ॥ ३३॥ तं
    तं काममवाप्नोति श्रीमदाद्याप्रसादतः । रणे राजकुले द्यूते विवादे प्राणसङ्कटे ॥ ३४॥ दस्युग्रस्ते ग्रामदाहे
    सिंहव्याघ्रावृते तथा । अरण्ये प्रान्तरे दुर्गे ग्रहराजभयेऽपि वा ॥ ३५॥ ज्वरदाहे चिरव्याधौ महारोगादिसङ्कुले
    । बालग्रहादिरोगे च तथा दुःस्वप्नदर्शने ॥ ३६॥ दुस्तरे सलिले वापि पोते वातविपद्गते । विचिन्त्य परमां
    मायामाद्यां कालीं परात्पराम् ॥ ३७॥ यः पठेच्छतनामानि दृढभक्तिसमन्वितः । सर्वापद्भ्यो विमुच्येत देवि
    सत्यं न संशयः ॥ ३८॥ न पापेभ्यो भयं तस्य न रोगेभ्यो भयं क्वचित् । सर्वत्र विजयस्तस्य न कुत्रापि पराभवः
    ॥ ३९॥ तस्य दर्शनमात्रेण पलायन्ते विपद्गणाः । स वक्ता सर्वशास्त्राणां स भोक्ता सर्वसम्पदाम् ॥ ४०॥ स
    कर्त्ता जातिधर्माणां ज्ञातीनां प्रभुरेव सः । वाणी तस्य वसेद्वक्त्रे कमला निश्चला गृहे ॥ ४१॥ तन्नाम्ना
    मानवाः सर्वे प्रणमन्ति ससम्भ्रमाः । दृष्ट्या तस्य तृणायन्ते ह्यणिमाद्यष्टसिद्धयः ॥ ४२॥ आद्याकालीस्वरूपाख्यं
    शतनाम प्रकीर्तितम् । अष्टोत्तरशतावृत्त्या पुरश्चर्याऽस्य गीयते ॥ ४३॥ पुरस्क्रियान्वितं स्तोत्रं सर्वाभीष्टफलप्रदम्
    । शतनामस्तुतिमिमामाद्याकालीस्वरूपिणीम् ॥ ४४॥ पठेद्वा पाठयेद्वापि श
