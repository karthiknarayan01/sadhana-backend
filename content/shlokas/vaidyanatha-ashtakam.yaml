id: vaidyanatha-ashtakam
category: stotram
name:
  english: Vaidyanatha Ashtakam
content:
  english: shriramasaumitrijatayuveda shadananaditya kujarcitaya | shrinilakanthaya dayamayaya shrivaidyanathaya
    namahshivaya || || shambho mahadeva shambho mahadeva shambho mahadeva shambho mahadeva | shambho mahadeva
    shambho mahadeva shambho mahadeva shambho mahadeva || gangapravahendu jatadharaya trilocanaya smara
    kalahantre | samasta devairabhipujitaya shrivaidyanathaya namah shivaya || bhaktahpriyaya tripurantakaya
    pinakine dushtaharaya nityam | pratyakshalilaya manushyaloke shrivaidyanathaya namah shivaya || prabhutavatadi
    samastaroga pranashakartre munivanditaya | prabhakarendvagni vilocanaya shrivaidyanathaya namah shivaya
    || vak shrotra netranghri vihinajantoh vakshrotranetranghrisukhapradaya | kushthadisarvonnatarogahantre
    shrivaidyanathaya namah shivaya || vedantavedyaya jaganmayaya yogishvaradyeya padambujaya | trimurtirupaya
    sahasranamne shrivaidyanathaya namah shivaya || svatirthamridbhasmabhritangabhajam pishacaduhkhartibhayapahaya
    | atmasvarupaya sharirabhajam shrivaidyanathaya namah shivaya || shrinilakanthaya vrishadhvajaya srakgandha
    bhasmadyabhishobhitaya | suputradaradi subhagyadaya shrivaidyanathaya namah shivaya || balambikesha
    vaidyesha bhavaroga hareti ca | japennamatrayam nityam maharoganivaranam || || iti shri vaidyanathashtakam
    ||
  devanagari: श्रीरामसौमित्रिजटायुवेद षडाननादित्य कुजार्चिताय । श्रीनीलकण्ठाय दयामयाय श्रीवैद्यनाथाय नमःशिवाय
    ॥ ॥ शम्भो महादेव शम्भो महादेव शम्भो महादेव शम्भो महादेव । शम्भो महादेव शम्भो महादेव शम्भो महादेव शम्भो
    महादेव ॥ गङ्गाप्रवाहेन्दु जटाधराय त्रिलोचनाय स्मर कालहन्त्रे । समस्त देवैरभिपूजिताय श्रीवैद्यनाथाय
    नमः शिवाय ॥ भक्तःप्रियाय त्रिपुरान्तकाय पिनाकिने दुष्टहराय नित्यम् । प्रत्यक्षलीलाय मनुष्यलोके श्रीवैद्यनाथाय
    नमः शिवाय ॥ प्रभूतवातादि समस्तरोग प्रनाशकर्त्रे मुनिवन्दिताय । प्रभाकरेन्द्वग्नि विलोचनाय श्रीवैद्यनाथाय
    नमः शिवाय ॥ वाक् श्रोत्र नेत्राङ्घ्रि विहीनजन्तोः वाक्श्रोत्रनेत्राङ्घ्रिसुखप्रदाय । कुष्ठादिसर्वोन्नतरोगहन्त्रे
    श्रीवैद्यनाथाय नमः शिवाय ॥ वेदान्तवेद्याय जगन्मयाय योगीश्वरद्येय पदाम्बुजाय । त्रिमूर्तिरूपाय सहस्रनाम्ने
    श्रीवैद्यनाथाय नमः शिवाय ॥ स्वतीर्थमृद्भस्मभृताङ्गभाजां पिशाचदुःखार्तिभयापहाय । आत्मस्वरूपाय शरीरभाजां
    श्रीवैद्यनाथाय नमः शिवाय ॥ श्रीनीलकण्ठाय वृषध्वजाय स्रक्गन्ध भस्माद्यभिशोभिताय । सुपुत्रदारादि सुभाग्यदाय
    श्रीवैद्यनाथाय नमः शिवाय ॥ बालाम्बिकेश वैद्येश भवरोग हरेति च । जपेन्नामत्रयं नित्यं महारोगनिवारणम्
    ॥ ॥ इति श्री वैद्यनाथाष्टकम् ॥
