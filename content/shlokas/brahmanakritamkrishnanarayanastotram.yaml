id: brahmanakritamkrishnanarayanastotram
category: stotram
name:
  english: brahmanakritamkrishnanarayanastotram
  devanagari: ब्रह्मणाकृतंकृष्णनारायणस्तोत्रम्
content:
  english: brahmana kritam krishnanarayanastotram nilacalena mahata parvatena virajitam | srishtva caracaram
    brahma cintayamasa vai pura || 10|| dehinam mokshanartham vai vishnum stoshye pareshvaram | aham tu
    mama mokshartham bhajishye purushottamam || 11|| vicaryettham pratushtava'nadishrikrishnamacyutam
    | om namah shrikrishnanarayanaya svamine namah || 12|| akshareshaya muktanamadhipaya namo namah |
    radhalakshmiprabhahamsamanikishaya te namah || 13|| parvatishaya sagunamanjuleshaya te namah | shrikrishnastvam
    parabrahma narayanastvameva ca || 14|| bhuma vishnurmahavishnurvairajastvam pravartase | antaryami
    prakashashca gocaro'gocarastatha || 15|| tattvatmakashca prakritivikritijnastvameva ca | koshasamsyashcanusukshmo
    mahiyanmahatam bhavan || 16|| dravyam gunashca karma tvam bhavo'bhavastvameva ca | maya ca karanam
    karyam tvameva'si namo'stu te || 17|| samsare tvatmalubdhanam saramatma tvameva ca | asarashcapi te
    drishtya sararupah prajayate || 18|| so'ham ragam parityajya bhavishye tvam pareshvaram | kimasarasvarupanam
    tushanamayaghatanat || 19|| yatra cante bhavecchunyam tannarabheta buddhiman | maya srishtih shunyakanta
    kartavya naiva keshava || 20|| prasida'dya pramoksham ca pradehi mama cecchatah | iti shrilakshminarayaniyasamhitayam
    prathame kritayugasantane 581
  devanagari: ब्रह्मणा कृतं कृष्णनारायणस्तोत्रम् नीलाचलेन महता पर्वतेन विराजितम् । सृष्ट्वा चराचरं ब्रह्मा
    चिन्तयामास वै पुरा ॥ १०॥ देहिनां मोक्षणार्थं वै विष्णुं स्तोष्ये परेश्वरम् । अहं तु मम मोक्षार्थं
    भजिष्ये पुरुषोत्तमम् ॥ ११॥ विचार्येत्थं प्रतुष्टावाऽनादिश्रीकृष्णमच्युतम् । ॐ नमः श्रीकृष्णनारायणाय
    स्वामिने नमः ॥ १२॥ अक्षरेशाय मुक्तानामधिपाय नमो नमः । राधालक्ष्मीप्रभाहंसामाणिकीशाय ते नमः ॥ १३॥ पार्वतीशाय
    सगुणामञ्जुलेशाय ते नमः । श्रीकृष्णस्त्वं परब्रह्म नारायणस्त्वमेव च ॥ १४॥ भूमा विष्णुर्महाविष्णुर्वैराजस्त्वं
    प्रवर्तसे । अन्तर्यामी प्रकाशश्च गोचरोऽगोचरस्तथा ॥ १५॥ तत्त्वात्मकश्च प्रकृतिविकृतिज्ञस्त्वमेव च ।
    कोशसंस्यश्चाणुसूक्ष्मो महीयान्महतां भवान् ॥ १६॥ द्रव्यं गुणश्च कर्म त्वं भावोऽभावस्त्वमेव च । माया
    च कारणं कार्यं त्वमेवाऽसि नमोऽस्तु ते ॥ १७॥ संसारे त्वात्मलुब्धानां सारमात्मा त्वमेव च । असारश्चापि
    ते दृष्ट्या साररूपः प्रजायते ॥ १८॥ सोऽहं रागं परित्यज्य भविष्ये त्वां परेश्वरम् । किमसारस्वरूपाणां
    तुषाणामयघातनात् ॥ १९॥ यत्र चान्ते भवेच्छून्यं तन्नारभेत बुद्धिमान् । मया सृष्टिः शून्यकान्ता कर्तव्या
    नैव केशव ॥ २०॥ प्रसीदाऽद्य प्रमोक्षं च प्रदेहि मम चेच्छतः । इति श्रीलक्ष्मीनारायणीयसंहितायां प्रथमे
    कृतयुगसन्ताने ५८१
