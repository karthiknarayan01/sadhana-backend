id: jnanatirthastotrashatpadi
category: stotram
name:
  english: jnanatirthastotrashatpadi
  devanagari: ज्नानतीर्थस्तोत्रषट्पदी
content:
  english: 67 vishuddhavijnanamahavakyarthalocanastrutam | antyatmakaravrittyatmajnanatirtham punatu mam
    || 1|| ragadveshamukhamatmagatadoshanvidhuya yat | sattvashudindha vidhattentarjnanatirtham punatu
    mam || 2|| yatkevalam sajatiyatmapravahopabrimhitam | utpatayatyavidyadrunjnanatirtham punatu mam
    || 3|| shraddhavati visandehe tatpare vijitendriye | udeti shantidam yattajjnanatirtham punatu mam
    || 4|| yatasvayam yogasamsiddhe kalenodeti nirmalam | pavitranam pavitram tajjnanatirtham punatu mam
    || 5|| hridayagranthibhitsarvasamshayacchicca karmahrit | shokamohanudashvotajjnanatirtham punatu
    mam || 6|| shatpadiyam madiyasyapadme tishthatu sarvada | gurvabhinneshabhaktyabhajnanatirthasamahvaya
    || 7|| iti shrivasudevanandasarasvativiracitam jnanatirthashatpadistotram sampurnam |
  devanagari: ६७ विशुद्धविज्ञानमहावाक्यार्थालोचनस्त्रुतम् । अन्त्यात्माकारवृत्त्यात्मज्ञानतीर्थं पुनातु
    माम् ॥ १॥ रागद्वेषमुखामात्मगतदोषान्विधूय यत् । सत्त्वशुदिन्ध विधत्तेन्तर्ज्ञानतीर्थं पुनातु माम् ॥
    २॥ यत्केवलं सजातीयात्मप्रवाहोपबृंहितम् । उत्पाटयत्यविद्याद्रून्ज्ञानतीर्थं पुनातु माम् ॥ ३॥ श्रद्धावति
    विसन्देहे तत्परे विजितेन्द्रिये । उदेति शान्तिदं यत्तज्ज्ञानतीर्थं पुनातु माम् ॥ ४॥ यतस्वयं योगसंसिद्धे
    कालेनोदेति निर्मलम् । पवित्राणां पवित्रं तज्ज्ञानतीर्थं पुनातु माम् ॥ ५॥ हृदयग्रन्थिभित्सर्वसंशयच्छिच्च
    कर्महृत् । शोकमोहनुदाश्वोतज्ज्ञानतीर्थं पुनातु माम् ॥ ६॥ षट्पदीयं मदीयास्यपद्मे तिष्ठतु सर्वदा । गुर्वभिन्नेशभक्त्याभज्ञानतीर्थसमाह्वया
    ॥ ७॥ इति श्रीवासुदेवानन्दसरस्वतीविरचितं ज्ञानतीर्थषट्पदीस्तोत्रं सम्पूर्णम् ।
