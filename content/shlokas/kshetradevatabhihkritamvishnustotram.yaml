id: kshetradevatabhihkritamvishnustotram
category: stotram
name:
  english: kshetradevatabhihkritamvishnustotram
  devanagari: क्षेत्रदेवताभिःकृतंविष्णुस्तोत्रम्
content:
  english: tvamagnistvam tatha pranastvamapanah sarasvati | tvamakasham dhanadhyakshastvam sharirasya
    dhatavah || 57|| ahankaro bhavan deva tvamadityo'shtako ganah | tvam maya prithivi durga tvam dishastvam
    marutpatih || 58|| tvam vishnustvam tatha dharmastvam jishnustvam parajitah | akshararthasvarupena
    parameshvarasamjnitah || 59|| asmabhirapayataistu kathametadbhavishyati | evamatra shariram tu tyaktamasmabhireva
    ca || 60|| tatparam bhavata deva tadavastham prapalyate | sthanabhango na nah karyah svayam srishtva
    prajapate || 61|| iti varahapurane saptadashadhyayantargatam kshetradevatabhih kritam vishnustotram
    samaptam | varahapurana | adhyaya 17
  devanagari: त्वमग्निस्त्वं तथा प्राणस्त्वमपानः सरस्वती । त्वमाकाशं धनाध्यक्षस्त्वं शरीरस्य धातवः ॥ ५७॥
    अहङ्कारो भवान् देव त्वमादित्योऽष्टको गणः । त्वं माया पृथिवी दुर्गा त्वं दिशस्त्वं मरुत्पतिः ॥ ५८॥
    त्वं विष्णुस्त्वं तथा धर्मस्त्वं जिष्णुस्त्वं पराजितः । अक्षरार्थस्वरूपेण परमेश्वरसंज्ञितः ॥ ५९॥ अस्माभिरपयातैस्तु
    कथमेतद्भविष्यति । एवमत्र शरीरं तु त्यक्तमस्माभिरेव च ॥ ६०॥ तत्परं भवता देव तदवस्थं प्रपाल्यते । स्थानभङ्गो
    न नः कार्यः स्वयं सृष्ट्वा प्रजापते ॥ ६१॥ इति वराहपुराणे सप्तदशाध्यायान्तर्गतं क्षेत्रदेवताभिः कृतं
    विष्णुस्तोत्रं समाप्तम् । वराहपुराण । अध्याय १७
