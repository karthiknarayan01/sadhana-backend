id: annamayya-keerthanas-raamudu-raaghavudu
category: stotram
name:
  english: Annamayya Keerthanas Raamudu Raaghavudu
content:
  english: adi pallavi ramudu raghavudu ravikulu ditadu | bhumijaku patiyaina purusha nidhanamu || araya
    putrakameshti yandu paramannamuna | paraga janincina para brahmamu | surala rakshimpaga asurula shikshimpaga
    | tiramai udayincina divya tejamu || ramudu raghavudu ravikulu ditadu | bhumijaku patiyaina purusha
    nidhanamu || cintince yogindrula citta sarojamulalo | santatamu nilicina sakaramu | vintaluga munulèlla
    vèdakina yatti | kantula cènnu mirina kaivalya padamu || ramudu raghavudu ravikulu ditadu | bhumijaku
    patiyaina purusha nidhanamu || veda vedantamulayandu vijnana shastramulandu | padukòna paliketi paramardhamu
    | proditò shri venkatadri pònci vijaya nagarana | adiki anadiyaina arcavataramu || ramudu raghavudu
    ravikulu ditadu | bhumijaku patiyaina purusha nidhanamu ||
  devanagari: आदि पल्लवि रामुडु राघवुडु रविकुलु डितडु । भूमिजकु पतियैन पुरुष निधानमु ॥ अरय पुत्रकामेष्टि
    यन्दु परमान्नमुन । परग जनिञ्चिन पर ब्रह्ममु । सुरल रक्षिम्पग असुरुल शिक्षिम्पग । तिरमै उदयिञ्चिन दिव्य
    तेजमु ॥ रामुडु राघवुडु रविकुलु डितडु । भूमिजकु पतियैन पुरुष निधानमु ॥ चिन्तिञ्चे योगीन्द्रुल चित्त
    सरोजमुललो । सन्ततमु निलिचिन साकारमु । विन्तलुगा मुनुलॆल्ल वॆदकिन यट्टि । कान्तुल चॆन्नु मीरिन कैवल्य
    पदमु ॥ रामुडु राघवुडु रविकुलु डितडु । भूमिजकु पतियैन पुरुष निधानमु ॥ वेद वेदान्तमुलयन्दु विज्ञान शास्त्रमुलन्दु
    । पादुकॊन पलिकेटि परमार्धमु । प्रोदितॊ श्री वेङ्कटाद्रि पॊञ्चि विजय नगरान । आदिकि अनादियैन अर्चावतारमु
    ॥ रामुडु राघवुडु रविकुलु डितडु । भूमिजकु पतियैन पुरुष निधानमु ॥
