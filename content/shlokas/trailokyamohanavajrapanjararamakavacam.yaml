id: trailokyamohanavajrapanjararamakavacam
category: kavacha
name:
  english: trailokyamohanavajrapanjararamakavacam
  devanagari: त्रैलोक्यमोहनवज्रपन्जररामकवचम्
content:
  english: vallabhayapadam tatah | dhimahityatha tam no'tha ramashcapi pracodayat || 31|| esha syadramagayatri
    sarvavasthasu patu mam | iti te kathitam devi sarvamantraughavigraham || 32|| trailokyamohanam nama
    kavacam brahmarupakam | pratah kale pathedyastu kavacam muktisadhakam || 33|| kirtishrikantimedhayurbhutishca
    bhavati dhruvam | ramamantramatha brahmakavacam manucoditam || 34|| guhyamabhyarcya vidhivat punashcaryam
    samacaret | ashtottarashatam japtva dashamsham havanadikam || 35|| tatah susiddham kavacam sarvakaryani
    sadhayet | mantrasiddhirbhavettasya purashcaryam vina tatah || 36|| laja ajyam ca | gadyapadyamayi
    vani tasya vaktratpravartate | vaktre tasya vasedvani kalashca nishcala grihe || 37|| pushpanjalyashtakam
    dattva malenaiva pare sakrit | api varshasahasrani pujayah phalamapnuyat || 38|| vilikhya bhurjapatre
    tu svarnastham dharayedyadi | karne ca dakshine bahau sa kurya vatam
  devanagari: वल्लभायपदं ततः । धीमहीत्यथ तं नोऽथ रामश्चापि प्रचोदयात् ॥ ३१॥ एषा स्याद्रामगायत्री सर्वावस्थासु
    पातु माम् । इति ते कथितं देवि सर्वमन्त्रौघविग्रहम् ॥ ३२॥ त्रैलोक्यमोहनं नाम कवचं ब्रह्मरूपकम् । प्रातः
    काले पठेद्यस्तु कवचं मुक्तिसाधकम् ॥ ३३॥ कीर्तिश्रीकान्तिमेधायुर्भूतिश्च भवति ध्रुवम् । राममन्त्रमथ
    ब्रह्मकवचं मनुचोदितम् ॥ ३४॥ गुह्यमभ्यर्च्य विधिवत् पुनश्चर्यां समाचरेत् । अष्टोत्तरशतं जप्त्वा दशांशं
    हवनादिकम् ॥ ३५॥ ततः सुसिद्धं कवचं सर्वकार्याणि साधयेत् । मन्त्रसिद्धिर्भवेत्तस्य पुरश्चर्यां विना
    ततः ॥ ३६॥ लाज आज्यं च । गद्यपद्यमयी वाणी तस्य वक्त्रात्प्रवर्तते । वक्त्रे तस्य वसेद्वाणी कलाश्च निश्चला
    गृहे ॥ ३७॥ पुष्पाञ्जल्यष्टकं दत्त्वा मलेनैव परे सकृत् । अपि वर्षसहस्राणि पूजायाः फलमाप्नुयात् ॥ ३८॥
    विलिख्य भूर्जपत्रे तु स्वर्णस्थं धारयेद्यदि । कर्णे च दक्षिणे बाहौ स कुर्या वतं
