id: brahmanakritam03shivastotram
category: stotram
name:
  english: brahmanakritam03shivastotram
  devanagari: ब्रह्मणाकृतं०३शिवस्तोत्रम्
content:
  english: brahmana kritam 3 shivastotram brahmovaca | anantaya namastubhyam varadaya pinakine | mahadevaya
    devaya sthanave paramatmane || 5|| namo'stu bhuvaneshaya tubhyam taraka sarvada | jnananam dayako
    devastvamekah purushottamah || 6|| namaste padmagarbhaya padmeshaya namo namah | ghorashantisvarupaya
    candakrodha namo'stu te || 7|| namaste deva vishvesha namaste suranayaka | shulapane namaste'stu namaste
    vishvabhavana || 8|| iti vamanapurane catushcatvarimshadhyayantargatam brahmana kritam shivastotram
    samaptam | vamanapurana | adhyaya 44
  devanagari: ब्रह्मणा कृतं ३ शिवस्तोत्रम् ब्रह्मोवाच । अनन्ताय नमस्तुभ्यं वरदाय पिनाकिने । महादेवाय देवाय
    स्थाणवे परमात्मने ॥ ५॥ नमोऽस्तु भुवनेशाय तुभ्यं तारक सर्वदा । ज्ञानानां दायको देवस्त्वमेकः पुरुषोत्तमः
    ॥ ६॥ नमस्ते पद्मगर्भाय पद्मेशाय नमो नमः । घोरशान्तिस्वरूपाय चण्डक्रोध नमोऽस्तु ते ॥ ७॥ नमस्ते देव
    विश्वेश नमस्ते सुरनायक । शूलपाणे नमस्तेऽस्तु नमस्ते विश्वभावन ॥ ८॥ इति वामनपुराणे चतुश्चत्वारिंशाध्यायान्तर्गतं
    ब्रह्मणा कृतं शिवस्तोत्रं समाप्तम् । वामनपुराण । अध्याय ४४
meaning: {}
