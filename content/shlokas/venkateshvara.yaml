id: venkateshvara
category: stotram
name:
  english: venkateshvara
  devanagari: वेन्कतेश्वर
content:
  english: shrivenkateshastotram kamalakucacucuka kunkumato niyatarunitatulanilatano | kamalayatalocana
    lokapate vijayi bhava venkatashailapate || 1|| sacaturmukhashanmukhapamcamukhapramukhakhiladaivatamaulimane
    | sharanagatavatsala saranidhe paripalaya mam vrishashailapate || 2|| ativelataya tava durvishahai
    ranuvelakritairaparadhashatai| bharitam tvaritam vrishashailapate paraya kripaya paripahi hare ||
    3|| adhivenkatashailamudaramatejanatabhimatadhikadanaratat | paradevataya gaditannigamaih kamaladayitanna
    param kalaye || 4|| kalavenuravavashagopavadhu shatakotivritatsmarakotisamat | prativallavikabhimatatsukhadat
    vasudevasutanna param kalaye || 5|| abhiramagunakara dasharathe jagadekadhanurdhara dhiramate | raghunayaka
    rama ramesha vibho varado bhava deva dayajaladhe || 6|| avanitanayakamaniyakaram rajanikaracarumukhamburuham
    | rajanicararajatamomihiram mahaniyamaham raghuramamaye || 7|| sumukham suhridam sulabham sukhadam
    svanujam ca sukayamamoghasharam | apahaya raghudvahamanyamaham na kathancana kancana jatu bhaje ||
    8|| vina venkatesham na natho na nathah sada venkatesham smarami smarami | hare venkatesha
  devanagari: श्रीवेङ्कटेशस्तोत्रम् कमलाकुचचूचुक कुङ्कुमतो नियतारुणितातुलनीलतनो । कमलायतलोचन लोकपते विजयी
    भव वेङ्कटशैलपते ॥ १॥ सचतुर्मुखषण्मुखपंचमुखप्रमुखाखिलदैवतमौलिमणे । शरणागतवत्सल सारनिधे परिपालय मां
    वृषशैलपते ॥ २॥ अतिवेलतया तव दुर्विषहै रनुवेलकृतैरपराधशतै। भरितं त्वरितं वृषशैलपते परया कृपया परिपाहि
    हरे ॥ ३॥ अधिवेङ्कटशैलमुदारमतेजनताभिमताधिकदानरतात् । परदेवतया गदितान्निगमैः कमलादयितान्न परं कलये ॥
    ४॥ कलवेणुरवावशगोपवधू शतकोटिवृतात्स्मरकोटिसमात् । प्रतिवल्लविकाभिमतात्सुखदात् वसुदेवसुतान्न परं कलये
    ॥ ५॥ अभिरामगुणाकर दाशरथे जगदेकधनुर्धर धीरमते । रघुनायक राम रमेश विभो वरदो भव देव दयाजलधे ॥ ६॥ अवनीतनयाकमनीयकरं
    रजनीकरचारुमुखाम्बुरुहम् । रजनीचरराजतमोमिहिरं महनीयमहं रघुराममये ॥ ७॥ सुमुखं सुहृदं सुलभं सुखदं स्वनुजं
    च सुकायममोघशरम् । अपहाय रघूद्वहमन्यमहं न कथञ्चन कञ्चन जातु भजे ॥ ८॥ विना वेङ्कटेशं न नाथो न नाथः सदा
    वेङ्कटेशं स्मरामि स्मरामि । हरे वेङ्कटेश
