id: ramarahasyopanishat
category: upanishad
name:
  english: ramarahasyopanishat
  devanagari: रामरहस्योपनिषत्
content:
  english: tryaksharo mantrarajah syatsarvabhishtaphalapradah || 8|| dvyaksharashcandrabhadranto dvividhashcaturaksharah
    | rishyadi purvavajjneyametayoshca vicakshanaih || 9|| sapratishthau ramau vayau hritpancarno manurmatah
    | vishvamitrarishih proktah panktishchando'sya devata ||10|| ramabhadro bijashaktih prathamarnamiti
    kramat | bhrumadhye hridi nabhyurvoh padayorvinyasenmanum || 11|| shadangam purvavadvidyanmantrarnairmanunastrakam
    | madhye vanam kalpatarormule pushpalatasane || 12|| lakshmanena pragunitamakshnah konena sayakam
    | avekshamanam janakya kritavyajanamishvaram || 13|| jatabharalasacchirsham shyamam muniganavritam
    | lakshmanena dhritacchatramathava pushpakopari || 14|| dashaasyamathanam shantam sasugrivavibhishanam
    | evam labdhva jayarthi tu varnalaksham japenmanum || 15|| svakamashaktivaglakshmistavadyah pancavarnakah
    | shadaksharah shadvidhah syaccaturvargaphalapradah || 16|| pancashanmatrikamantravarnapratyekapurvakam
    | lakshmivanmanmathadishca taradih syadanekadha || 17|| shrimayamanmathaikaika bijadyantargato manuh
    | caturvarnah sa eva syatshadvarno vanchitapradah || 18|| svahanto humphadanto va natyanto va bhavedayam
    | ashtavimshatyuttarashatabhedah shadvarna iritah || 19|| brahma sammohanah shaktirdakshinamurtireva
    ca | agastyashca shivah prokta munayo'kramadime || 20|| chando gayatrasamjnam ca shriramashcaiva devata
    | athava kamabijadervishvamitro munirmanoh || 21|| chando devyadigayatri ramabhadro'sya devata | bijashakti
    yathapurvam shadvarnanvinyasetkramat || 22|| brahmarandhre bhruvormadhye hrinnabhyurushu padayoh |
    bijaih shaddirghayuktairva mantrarnaiva shadangakam || 23|| kalabhodharakantikantamanisham virasanadhyasitam
    mudram jnanamayim dadhanamaparam hastambujam januni | sitam parshvagatam saroruhakaram vidyunnibham
    raghavam pashyantam mukutangadadivividhakalpojjvalangam bhaje || 24|| shriramashcandrabhadranto nento
    natiyuto dvidha | saptaksharo mantrarajah sarvakamaphalapradah || 25|| taradisahitah so'pi dvividho'shtaksharo
    matah | taram ramashcaturthyatah krodastram vahnitalpaga || 26|| ashtarno'yam paro mantro rishyadih
    syatshadarnavat | punarashtaksharasyatha rama eva rishih smritah || 27|| gayatram chanda ityasya devata
    rama eva ca | taram shribijayugmam ca bijashaktyadayo matah || 28|| shadangam ca tatah kuryanmantrarnaireva
    buddhiman | taram shribijayugmam ca ramaya nama uccaret || 29|| glaummom bijam vadenmayam hridramaya
    punashca tam | shivomaramamantro'yam vasvarnastu vasupradah || 30|| rishih sadashivah prokto gayatram
    chanda ucyate | shivomaramacandro'tra devata parikirtitah || 31|| dirghaya mayayangani tarapancarnayuktaya
    | ramam trinetram somardhadharinam shulinam param | bhasmoddhulitasarvangam kapardinamupasmahe ||
    32|| ramabhiramam saundaryasimam somavatamsikam | pashankushadhanurbanadharam dhyayettrilocanam ||
    33|| dhyayannevam varnalaksham japatarpanatatparah | bilvapatraih phalaih pushpaistilajyaih pankajairhunet
    || 34|| svayamayanti nidhayah siddhayashca surepsitah | punarashtaksharasyatha brahmagayatra raghavah
    || 35|| rishyadayastu vijneyah shribijam mama shaktikam | tatprityai viniyogashca mantrarnairangakalpana
    || 36|| keyurangadakankanairmanigatairvidyotamanam sada ramam parvanacandrakotisadrishacchatrena vai
    rajitam | hemastambhasahasrashodashayute madhye mahamandape devesham bharatadibhih parivritam ramam
    bhaje shyamalam || 37|| kim mantrairbahubhirvinashvaraphalairayasasadhyairvrita kimcillobhavitanamatraviphalaih
    samsaraduhkhavahaih | ekah sannapi sarvamantraphalado lobhadidoshojjhitah shriramah sharanam mameti
    satatam mantro'yamashtaksharah || 38|| evamashtaksharah samyak saptadha parikirtitah | ramasaptaksharo
    mantra adyante tarasamyutah || 39|| navarno mantrarajah syacchesham shadvarnavannyaset | janakivallabham
    nentam vahnerjayahumadikam || 40|| dashaksharo'yam mantrah syatsarvabhishtaphalapradah | dashaksharasya
    mantrasya vasishtho'sya rishirvirat || 41|| chando'sya devata ramah sitapaniparigrahah | adyo bijam
    dvithah shaktih kamenangakriya mata || 42|| shirolalatabhrumadhye talukarneshu hridyapi | nabhurujanupadeshu
    dasharnanvinyasenmanoh || 43|| ayodhyanagare ratnacitre sauvarnamandape | mandarapushpairabaddhavitane
    toranancite || 44|| simhasane samasinam pushpakopari raghavam | rakshobhirharibhirdevairdivyayanagataih
    shubhaih || 45|| samstuyamanam munibhih prahvaishca parisevitam | sitalankritavamangam lakshmanenopasevitam
    ||46|| shyamam prasannavadanam sarvabharanabhushitam | dhyayannevam japenmantram varnalakshamananyadhih
    || 47|| ramam nentam dhanushpanaye'ntah syadvahnisundari | dashaksharo'yam mantrah syanmunirbrahma
    virat smritah || 48|| chandastu devata prokto ramo rakshasamardanah | shesham tu purvavatkuryaccapabanadharam
    smaret || 49|| taramayaramanangavaksvabijaishca shadvidhah | dasharno mantrarajah syadrudravarnatmako
    manuh || 50|| shesham shadarnavajjneyam nyasadhyanadikam budhaih | dvadashaksharamantrasya shrirama
    rishirucyate || 51|| jagati chanda ityuktam shriramo devata matah | pranavo bijamityuktah klim shaktirhrim
    ca kilakam || 52|| mantrenangani vinyasya shishtam purvavadacaret | taram mayam samuccarya bharatagraja
    ityapi || 53|| ramam klim vahnijayantam mantroyam dvadashaksharah | om hridbhagavate ramacandrabhadrau
    ca neyutau || 54|| arkarno dvividho'pyasya rishidhyanadipurvavat | chandastu jagati caiva mantrarnairangakalpana
    || 55|| shrirameti padam coktva jayarama tatah param | jayadvayam vadetprajno rameti manurajakah ||
    56|| trayodasharna rishyadi purvavatsarvakamadah | padadvayadviravritterangam dhyanam dasharnavat
    || 57|| taradisahitah so'pi sa caturdashavarnakah | trayodasharnamuccarya pashcadrameti yojayet ||
    58|| sa vai pancadasharnastu japatam kalpabhuruhah | namashca sitapataye ramayeti hanadvayam || 59||
    tatastu kavacastrantah shodashakshara iritah | tasyagastyarishishchando brihati devata ca sah || 60||
    ram bijam shaktirastram ca kilakam humitiritam | dvipancatricaturvarnaih sarvairangam nyasetkramat
    || 61|| taradisahitah so'pi mantrah saptadashaksharah | taram namo bhagavate ram nentam maha tatah
    || 62|| purushaya padam pashcaddhridanto'shtadashaksharah | vishvamitro munishchando gayatram devata
    ca sah || 63|| kamadisahitah so'pi mantra ekonavimshakah | taram namo bhagavate ramayeti padam vadet
    || 64|| sarvashabdam samuccarya saubhagyam dehi me vadet | vahnijayam tathoccarya mantro vimsharnako
    matah || 65|| taram namo bhagavate ramaya sakalam vadet | apannivaranayeti vahnijayam tato vadet ||
    66|| ekavimsharnako mantrah sarvabhishtaphalapradah | taram rama svabijam ca tato dasharathaya ca
    || 67|| tatah sitavallabhaya sarvabhishtapadam vadet | tato daya hridanto'yam mantro dvavimshadaksharah
    || 68|| taram namo bhagavate viraramaya samvadet | kala shatrun hana dvandvam vahnijayam tato vadet
    || 69|| trayovimshaksharomantrah sarvashatrunibarhanah | vishvamitro munih prokto gayatrichanda ucyate
    || 70|| devata viraramo'sau bijadyah purvavanmatah | mulamantravibhagena nyasankritva vicakshanah
    || 71|| sharam dhanushi sandhaya tishthantam ravanonmukham | vajrapanim ratharudham ramam dhyatva
    japenmanum || 72|| taram namo bhagavate shriramaya padam vadet | tarakabrahmane coktva mam taraya
    padam vadet || 73|| namastaratmako mantrashcaturvimshatimantrakah | bijadikam yatha purvam sarvam
    kuryatshadarnavat || 74|| kamastaro natishcaiva tato bhagavatepadam | ramacandraya coccarya sakaleti
    padam vadet || 75|| janavashyakarayeti svaha kamatmako manuh | sarvavashyakaro mantrah pancavimshativarnakah
    || 76|| adau tarena samyukto mantrah shadvimshadaksharah | ante'pi tarasamyuktah saptavimshativarnakah
    || 77|| taram namo bhagavate rakshoghnavishadaya ca | sarvavighnantsamuccarya nivaraya padadvayam
    || 78|| svahanto mantrarajo'yamashtavimshativarnakah | ante tarena samyukta ekonatrimshadaksharah
    || 79|| adau svabijasamyuktastrimshadvarnatmako manuh | ante'pi tena samyukta ekatrimshatmakah smritah
    || 80|| ramabhadra maheshvasa raghuvira nripottama | bho dashasyantakasmakam shriyam dapaya dehi me
    || 81|| anushtubha rishi ramashchando'nushtupsa devata | ram bijamasya yam shaktirishtarthe viniyojayet
    || 82|| padam hridi ca vinyasya padam shirasi vinyaset | shikhayam pancabhirnyasya trivarnaih kavacam
    nyaset || 83|| netrayoh pancavarnaishca dapayetyastramucyate | capabanadharam shyamam sasugrivabibhishanam
    || 84|| hatva ravanamayantam kritatrailokyarakshanam | ramacandram hridi dhyatva dashalaksham japenmanum
    || 85|| vadeddasharathayeti vidmaheti padam tatah | sitapadam samuddhritya vallabhaya tato vadet ||
    86|| dhimahiti vadettanno ramashcapi pracodayat taradiresha gayatri muktimeva prayacchati || 87||
    mayadirapi vaidushtyam ramadishca shriyahpadam | madanenapi samyuktah sa mohayati medinim || 88||
    panca trini shadarnaishca trini catvari varnakaih | catvari ca caturvarnairanganyasam prakalpayet
    || 89|| bijadhyanadikam sarvam kuryatshadvarnavatkramat | taram namo bhagavate caturthya raghunandanam
    || 90|| rakshoghnavishadam tadvanmadhureti vadettatah | prasannavadanam nentam vadedamitatejase ||
    91|| balaramau caturthyantau vishnum nentam natistatah | prokto malamanuh saptacatvarimshadbhiraksharaih
    || 92|| rishishchando devatadi brahmanushtubharaghavah | saptartusaptadasha shadrudrasamkhyaih shadangakam
    || 93|| dhyanam dashaksharam proktam lakshamekam japenmanum | shriyam sitam caturthyantam svahanto'yam
    shadaksharah || 94|| janako'sya rishishchando gayatri devata manoh | sita bhagavati prokta shrim bijam
    natishaktikam || 95|| kilam sita caturthyantamishtarthe viniyojayet | dirghasvarayutadyena shadangani
    prakalpayet || 96|| svarnabhamambujakaram ramalokanatatparam | dhyayetshatkonamadhyastharamankopari
    shobhitam || 97|| lakaram tu samuddhritya lakshmanaya namontakah | agastyarishirasyatha gayatram chanda
    ucyate || 98|| lakshmano devata prokto lam bijam shaktirasya hi | namastu viniyogo hi purushartha
    catushtaye || 99|| dirghabhaja svabijena shadangani prakalpayet | dvibhujam svarnaruciratanum padmanibhekshanam
    || 100|| dhanurbanadharam devam ramaradhanatatparam | bhakaram tu samuddhritya bharataya namontakah
    || 101|| agastyarishirasyatha shesham purvavadacaret | bharatam shyamalam shantam ramasevaparayanam
    || 102|| dhanurbanadharam viram kaikeyitanayam bhaje | sham bijam tu samuddhritya shatrughnaya namontakah
    | rishyadayo yathapurvam viniyogo'rinigrahe || 103|| dvibhujam svarnavarnabham ramasevaparayanam |
    lavanasurahantaram sumitratanayam bhaje || 104|| hrim hanumamshcaturthyantam hridanto mantrarajakah
    | ramacandra rishih prokto yojayetpurvavatkramat || 105|| dvibhujam svarnavarnabham ramasevaparayanam
    | maunjikaupinasahitam mam dhyayedramasevakam || iti|| 106|| iti ramarahasyopanishadi dvitiyo'dhyayah
    || 2|| sanakadya munayo hanumantam papracchuh | anjaneya mahabala purvoktamantranam pujapithamanubruhiti
    | hanuman hovaca | adau shatkonam | tanmadhye ramabijam sashrikam | tadadhobhage dvitiyantam sadhyam
    | bijordhvabhage shashthyantam sadhakam | parshve drishtibije tatparito jivapranashaktivashyabijani
    | tatsarvam sanmukhonmukhabhyam pranavabhyam veshtanam | agnishasuravayavyapurahprishtheshu shatkoneshu
    dirghabhanji | hridayadimantrah kramena | ram rim rum raim raum rah iti dirghabhaji tadyuktahridayadyastrantam
    | shatkonaparshve ramamayabije | konagre varaham humiti | tadbijantarale kamabijam | parito vagbhavam
    | tato vrittatrayam sashtapatram | teshu daleshu svaranashtavarganpratidalam malamanuvarnashatkam
    | ante pancaksharam | taddalakapoleshvashtavarnan | punarashtadalapadmam | teshu daleshu narayanashtaksharo
    mantrah | taddalakapoleshu shribijam | tato vrittam | tato dvadashadalam | teshu daleshu vasudevadvadashaksharo
    mantrah | taddalakapoleshvadikshantan | tato vrittam | tatah shodashadalam | teshu daleshu hum phat
    natisahitaramadvadashaksharam | taddalakapoleshu mayabijam | sarvatra pratikapolam dviravrittya hram
    sram bhram bram bhramam shrum jram | tato vrittam | tato dvatrimshaddalapadmam | teshu daleshu nrisimhamantrarajanushtubhamanrah
    | taddalakapoleshvashtava svekadasharudradvadashadityamantrah pranavadinamonta shcaturthyantah kramena
    | tadbahirvashatkaram paritah | tato rekhatrayayuktam bhupuram | dvadashadikshu rashyadibhushitam
    | ashtanagairadhishthitam | caturdikshu narasimhabijam | vidikshu varahabijam | etatsarvatmakam yantram
    sarvakamapradam mokshapradam ca | ekaksharadinavaksharantanametadyantram bhavati | taddashavaranatmakam
    bhavati | shatkonamadhye sangam raghavam yajet | shatkoneshvangaih prathama vritih | ashtadalamule
    atmadyavaranam | tadagre vasudevadyavaranam | dvitiyashtadalamule ghrishtadyavaranam | tadagre hanumadadyavaranam
    | dvadashadaleshu vasishthadyavaranam | shodashadaleshu niladyavaranam | dvatrimshaddaleshu dhruvadyavaranam
    | bhupurantarindradyavaranam | tadbahirvajradyavaranam | evamabhyarcya manum japet || atha dashaksharadidvatrimshadaksharantanam
    mantranam pujapithamucyate | adau shatkonam | tanmadhye svabijam | tanmadhye sadhyanamani | evam kamabijaveshtanam
    | tam shishtena navarnena veshtanam | shatkoneshu shadanganyagnishasuravayavyapurvaprishtheshu | tatkapoleshu
    shrimaye | konagre krodham | tato vrittam | tato'shtadalam | teshu daleshu shatsamkhyaya malamanuvarnan
    | taddalakapoleshu shodasha svarah | tato vrittam | tatparita adikshantam | tadbahirbhupuram sashtashulagram
    | dikshu vidikshu narasimhavarahe | etanmahayantram | adharashaktyadivaishnavapitham | angaih prathama
    vritih | madhye ramam | vamabhage sitam | tatpuratah sharngam sharam ca | ashtadalamule hanumadadidvitiyavaranam
    | ghrishtyaditritiyavaranam | indradibhishcaturthi | vajradibhih pancami | etadyantraradhana purvakam
    dashaksharadimantram japet | || iti ramarahasyopanishadi tritiyo'dhyayah || 3|| sanakadya munayo hanumantam
    papracchuh | shriramamantranam purashcaranavidhimanubruhiti | hanumanhovaca | nityam trishavanasnayi
    payomulaphaladibhuk | athava payasaharo havishyannada eva va || 1|| shadsaishca parityaktah svashramoktavidhim
    caran | vanitadishu vakkarmamanobhirnihsprihah shucih || 2|| bhumishayi brahmacari nishkamo gurubhaktiman
    | snanapujajapadhyanahomatarpanatatparah || 3|| gurupadishtamargena dhyayanramamananyadhih | suryendugurudipadigobrahmanasamipatah
    || 4|| shriramasannidhau mauni mantrarthamanucintayan | vyaghracarmasane sthitva svastikadyasanakramat
    || 5|| tulasiparijatashrivrikshamuladikasthale | padmakshatulasikashtharudrakshakritamalaya || 6||
    matrikamalaya mantri manasaiva manum japet | abhyarcya vaishnave pithe japedaksharalakshakam || 7||
    tarpayettaddashamshena payasattaddashamshatah | juhuyadgoghritenaiva bhojayettaddashamshatah || 8||
    tatah pushpanjalim mulamantrena vidhivaccaret | tatah siddhamanurbhutva jivanmukto bhavenmunih ||
    9|| animadirbhajatyenam yunam varavadhuriva | aihikeshu ca karyeshu mahapatsu ca sarvada || 10|| naiva
    yojyo ramamantrah kevalam mokshasadhakah | aihike samanuprapte mam smaredramasevakam || 11|| yo ramam
    samsmarennityam bhaktya manuparayanah | tasyahamishtasamsiddhyai dikshito'smi munishvarah || 12||
    vanchitartham pradasyami bhaktanam raghavasya tu | sarvatha jagaruko'smi ramakaryadhurandharah ||
    13|| iti ramarahasyopanishadi caturtho'dhyayah || 4|| sanakadya munayo hanumantam papracchuh | shriramamantrarthamanubruhiti
    | hanumanhovaca | sarveshu ramamantreshu mantrarajah shadaksharah | ekadhaya dvidha tredha caturdha
    pancadha tatha || 1|| shatsaptadhashtadha caiva bahudhayam vyavasthitah | shadaksharasya mahatmyam
    shivo janati tattvatah || 2|| shriramamantrarajasya samyagartho'yamucyate | narayanashtakshare ca
    shivapancakshare tatha | sarthakarnadvayam ramo ramante yatra yoginah | rakaro vahnivacanah prakashah
    paryavasyati || 3|| saccidanandarupo'sya paramatmartha ucyate | vyanjanam nishkalam brahma prano mayeti
    ca svarah || 4|| vyanjanaih svarasamyogam viddhi tatpranayojanam | repho jyotirmaye tasmatkritamakarayojanam
    || 5|| makaro'bhyudayarthatvatsa mayeti ca kirtyate | so'yam bijam svakam yasmatsamayam brahma cocyate
    || 6|| sabinduh so'pi purushah shivasuryendurupavan | jyotistasya shikha rupam nadah saprakritirmatah
    || 7|| prakritih purushashcobhau samayadbrahmanah smritau | bindunadatmakam bijam vahnisomakalatmakam
    || 8|| agnishomatmakam rupam ramabije pratishthitam | yathaiva vatabijasthah prakritashca mahadrumah
    || 9|| tathaiva ramabijastham jagadetaccaracaram | bijoktamubhayarthatvam ramanamani drishyate ||
    10|| bijam mayavinirmuktam param brahmeti kirtyate | muktidam sadhakanam ca makaro muktido matah ||
    11|| marupatvadato ramo bhuktimuktiphalapradah | adyo ra tatpadarthah syanmakarastvampadarthavan ||
    12|| tayoh samyojanamasityarthe tattvavido viduh | namastvamartho vijneyo ramastatpadamucyate || 13||
    asityarthe caturthi syadevam mantreshu yojayet | tattvamasyadivakyam tu kevalam muktidam yatah ||
    14|| bhuktimuktipradam caitattasmadapyatiricyate | manushveteshu sarveshamadhikaro'sti dehinam ||
    15|| mumukshunam viraktanam tatha cashramavasinam | pranavatvatsada dhyeyo yatinam ca visheshatah
    | ramamantrarthavijnani jivanmukto na samshayah || 16|| ya imamupanishadamadhite so'gniputo bhavati
    | sa vayuputo bhavati | surapanatputo bhavati | svarnasteyatputo bhavati | brahmahatyaputo bhavati
    | sa ramamantranam kritapurashcarano ramacandro bhavati | tadetadricabhyuktam | sada ramo'hamasmiti
    tattvatah pravadanti ye | na te samsarino nunam rama eva na samshayah || om ya'yodhya sa sarvabaikunthanameva
    muladhara prakriteh para tatsad brahmamayi virajottara divyaratnakoshadhya tasya nityameva shrisitaramayorviharasthalamasti||
  devanagari: त्र्यक्षरो मन्त्रराजः स्यात्सर्वाभीष्टफलप्रदः ॥ ८॥ द्व्यक्षरश्चन्द्रभद्रान्तो द्विविधश्चतुरक्षरः
    । ऋष्यादि पूर्ववज्ज्ञेयमेतयोश्च विचक्षणैः ॥ ९॥ सप्रतिष्ठौ रमौ वायौ हृत्पञ्चार्णो मनुर्मतः । विश्वामित्रऋषिः
    प्रोक्तः पङ्क्तिश्च्हन्दोऽस्य देवता ॥१०॥ रामभद्रो बीजशक्तिः प्रथमार्णमिति क्रमात् । भ्रूमध्ये हृदि
    नाभ्यूर्वोः पादयोर्विन्यसेन्मनुम् ॥ ११॥ षडङ्गं पूर्ववद्विद्यान्मन्त्रार्णैर्मनुनास्त्रकम् । मध्ये
    वनं कल्पतरोर्मूले पुष्पलतासने ॥ १२॥ लक्ष्मणेन प्रगुणितमक्ष्णः कोणेन सायकम् । अवेक्षमाणं जानक्या कृतव्यजनमीश्वरम्
    ॥ १३॥ जटाभारलसच्च्हीर्षं श्यामं मुनिगणावृतम् । लक्ष्मणेन धृतच्च्हत्रमथवा पुष्पकोपरि ॥ १४॥ दशाअस्यमथनं
    शान्तं ससुग्रीवविभीषणम् । एवं लब्ध्वा जयार्थी तु वर्णलक्षं जपेन्मनुम् ॥ १५॥ स्वकामशक्तिवाग्लक्ष्मीस्तवाद्याः
    पञ्चवर्णकाः । षडक्षरः षड्विधः स्याच्चतुर्वर्गफलप्रदः ॥ १६॥ पञ्चाशन्मातृकामन्त्रवर्णप्रत्येकपूर्वकम्
    । लक्ष्मीवाङ्मन्मथादिश्च तारादिः स्यादनेकधा ॥ १७॥ श्रीमायामन्मथैकैक बीजाद्यन्तर्गतो मनुः । चतुर्वर्णः
    स एव स्यात्षड्वर्णो वाञ्च्हितप्रदः ॥ १८॥ स्वाहान्तो हुंफडन्तो वा नत्यन्तो वा भवेदयम् । अष्टाविंशत्युत्तरशतभेदः
    षड्वर्ण ईरितः ॥ १९॥ ब्रह्मा संमोहनः शक्तिर्दक्षिणामूर्तिरेव च । अगस्त्यश्च शिवः प्रोक्ता मुनयोऽक्रमादिमे
    ॥ २०॥ च्हन्दो गायत्रसंज्ञं च श्रीरामश्चैव देवता । अथवा कामबीजादेर्विश्वामित्रो मुनिर्मनोः ॥ २१॥ च्हन्दो
    देव्यादिगायत्री रामभद्रोऽस्य देवता । बीजशक्ती यथापूर्वं षड्वर्णान्विन्यसेत्क्रमात् ॥ २२॥ ब्रह्मरन्ध्रे
    भ्रुवोर्मध्ये हृन्नाभ्यूरुषु पादयोः । बीजैः षड्दीर्घयुक्तैर्वा मन्त्रार्णैवा षडङ्गकम् ॥ २३॥ कालाभोधरकान्तिकान्तमनिशं
    वीरासनाध्यासितं मुद्रां ज्ञानमयीं दधानमपरं हस्तांबुजं जानुनि । सीतां पार्श्वगतां सरोरुहकरां विद्युन्निभां
    राघवं पश्यन्तं मुकुटाङ्गदादिविविधाकल्पोज्ज्वलाङ्गं भजे ॥ २४॥ श्रीरामश्चन्द्रभद्रान्तो ङेन्तो नतियुतो
    द्विधा । सप्ताक्षरो मन्त्रराजः सर्वकामफलप्रदः ॥ २५॥ तारादिसहितः सोऽपि द्विविधोऽष्टाक्षरो मतः । तारं
    रामश्चतुर्थ्यतः क्रोडास्त्रं वह्नितल्पगा ॥ २६॥ अष्टार्णोऽयं परो मन्त्रो ऋष्यादिः स्यात्षडर्णवत् ।
    पुनरष्टाक्षरस्याथ राम एव ऋषिः स्मृतः ॥ २७॥ गायत्रं च्हन्द इत्यस्य देवता राम एव च । तारं श्रीबीजयुग्मं
    च बीजशक्त्यादयो मताः ॥ २८॥ षडङ्गं च ततः कुर्यान्मन्त्रार्णैरेव बुद्धिमान् । तारं श्रीबीजयुग्मं च रामाय
    नम उच्चरेत् ॥ २९॥ ग्लौंमों बीजं वदेन्मायां हृद्रामाय पुनश्च ताम् । शिवोमाराममन्त्रोऽयं वस्वर्णस्तु
    वसुप्रदः ॥ ३०॥ ऋषिः सदाशिवः प्रोक्तो गायत्रं च्हन्द उच्यते । शिवोमारामचन्द्रोऽत्र देवता परिकीर्तितः
    ॥ ३१॥ दीर्घया माययाङ्गानि तारपञ्चार्णयुक्तया । रामं त्रिनेत्रं सोमार्धधारिणं शूलिनं परम् । भस्मोद्धूलितसर्वाङ्गं
    कपर्दिनमुपास्महे ॥ ३२॥ रामाभिरामां सौन्दर्यसीमां सोमावतंसिकाम् । पाशाङ्कुशधनुर्बाणधरां ध्यायेत्त्रिलोचनाम्
    ॥ ३३॥ ध्यायन्नेवं वर्णलक्षं जपतर्पणतत्परः । बिल्वपत्रैः फलैः पुष्पैस्तिलाज्यैः पङ्कजैर्हुनेत् ॥ ३४॥
    स्वयमायान्ति निधयः सिद्धयश्च सुरेप्सिताः । पुनरष्टाक्षरस्याथ ब्रह्मगायत्र राघवाः ॥ ३५॥ ऋष्यादयस्तु
    विज्ञेयाः श्रीबीजं मम शक्तिकम् । तत्प्रीत्यै विनियोगश्च मन्त्रार्णैरङ्गकल्पना ॥ ३६॥ केयूराङ्गदकङ्कणैर्मणिगतैर्विद्योतमानं
    सदा रामं पार्वणचन्द्रकोटिसदृशच्च्हत्रेण वै राजितम् । हेमस्तम्भसहस्रषोडशयुते मध्ये महामण्डपे देवेशं
    भरतादिभिः परिवृतं रामं भजे श्यामलम् ॥ ३७॥ किं मन्त्रैर्बहुभिर्विनश्वरफलैरायाससाध्यैर्वृता किंचिल्लोभवितानमात्रविफलैः
    संसारदुःखावहैः । एकः सन्नपि सर्वमन्त्रफलदो लोभादिदोषोज्झितः श्रीरामः शरणं ममेति सततं मन्त्रोऽयमष्टाक्षरः
    ॥ ३८॥ एवमष्टाक्षरः सम्यक् सप्तधा परिकीर्तितः । रामसप्ताक्षरो मन्त्र आद्यन्ते तारसंयुतः ॥ ३९॥ नवार्णो
    मन्त्रराजः स्याच्च्हेषं षड्वर्णवन्न्यसेत् । जानकीवल्लभं ङेन्तं वह्नेर्जायाहुमादिकम् ॥ ४०॥ दशाक्षरोऽयं
    मन्त्रः स्यात्सर्वाभीष्टफलप्रदः । दशाक्षरस्य मन्त्रस्य वसिष्ठोऽस्य ऋषिर्विराट् ॥ ४१॥ च्हन्दोऽस्य देवता
    रामः सीतापाणिपरिग्रहः । आद्यो बीजं द्विठः शक्तिः कामेनाङ्गक्रिया मता ॥ ४२॥ शिरोललाटभ्रूमध्ये तालुकर्णेषु
    हृद्यपि । नाभूरुजानुपादेषु दशार्णान्विन्यसेन्मनोः ॥ ४३॥ अयोध्यानगरे रत्नचित्रे सौवर्णमण्डपे । मन्दारपुष्पैराबद्धविताने
    तोरणाञ्चिते ॥ ४४॥ सिंहासने समासीनं पुष्पकोपरि राघवम् । रक्षोभिर्हरिभिर्देवैर्दिव्ययानगतैः शुभैः ॥
    ४५॥ संस्तूयमानं मुनिभिः प्रह्वैश्च परिसेवितम् । सीतालङ्कृतवामाङ्गं लक्ष्मणेनोपसेवितम् ॥४६॥ श्यामं
    प्रसन्नवदनं सर्वाभरणभूषितम् । ध्यायन्नेवं जपेन्मन्त्रं वर्णलक्षमनन्यधीः ॥ ४७॥ रामं ङेन्तं धनुष्पाणयेऽन्तः
    स्याद्वह्निसुन्दरी । दशाक्षरोऽयं मन्त्रः स्यान्मुनिर्ब्रह्मा विराट् स्मृतः ॥ ४८॥ च्हन्दस्तु देवता
    प्रोक्तो रामो राक्षसमर्दनः । शेषं तु पूर्ववत्कुर्याच्चापबाणधरं स्मरेत् ॥ ४९॥ तारमायारमानङ्गवाक्स्वबीजैश्च
    षड्विधः । दशार्णो मन्त्रराजः स्याद्रुद्रवर्णात्मको मनुः ॥ ५०॥ शेषं षडर्णवज्ज्ञेयं न्यासध्यानादिकं
    बुधैः । द्वादशाक्षरमन्त्रस्य श्रीराम ऋषिरुच्यते ॥ ५१॥ जगती च्हन्द इत्युक्तं श्रीरामो देवता मतः । प्रणवो
    बीजमित्युक्तः क्लीं शक्तिर्ह्रीं च कीलकम् ॥ ५२॥ मन्त्रेणाङ्गानि विन्यस्य शिष्टं पूर्ववदाचरेत् । तारं
    मायां समुच्चार्य भरताग्रज इत्यपि ॥ ५३॥ रामं क्लीं वह्निजायान्तं मन्त्रोयं द्वादशाक्षरः । ॐ हृद्भगवते
    रामचन्द्रभद्रौ च ङेयुतौ ॥ ५४॥ अर्कार्णो द्विविधोऽप्यस्य ऋषिध्यानादिपूर्ववत् । च्हन्दस्तु जगती चैव
    मन्त्रार्णैरङ्गकल्पना ॥ ५५॥ श्रीरामेति पदं चोक्त्वा जयराम ततः परम् । जयद्वयं वदेत्प्राज्ञो रामेति
    मनुराजकः ॥ ५६॥ त्रयोदशार्ण ऋष्यादि पूर्ववत्सर्वकामदः । पदद्वयद्विरावृत्तेरङ्गं ध्यानं दशार्णवत् ॥
    ५७॥ तारादिसहितः सोऽपि स चतुर्दशवर्णकः । त्रयोदशार्णमुच्चार्य पश्चाद्रामेति योजयेत् ॥ ५८॥ स वै पञ्चदशार्णस्तु
    जपतां कल्पभूरुहः । नमश्च सीतापतये रामायेति हनद्वयम् ॥ ५९॥ ततस्तु कवचास्त्रान्तः षोडशाक्षर ईरितः ।
    तस्यागस्त्यऋषिश्च्हन्दो बृहती देवता च सः ॥ ६०॥ रां बीजं शक्तिरस्त्रं च कीलकं हुमितीरितम् । द्विपञ्चत्रिचतुर्वर्णैः
    सर्वैरङ्गं न्यसेत्क्रमात् ॥ ६१॥ तारादिसहितः सोऽपि मन्त्रः सप्तदशाक्षरः । तारं नमो भगवते रां ङेन्तं
    महा ततः ॥ ६२॥ पुरुषाय पदं पश्चाद्धृदन्तोऽष्टदशाक्षरः । विश्वामित्रो मुनिश्च्हन्दो गायत्रं देवता च
    सः ॥ ६३॥ कामादिसहितः सोऽपि मन्त्र एकोनविंशकः । तारं नामो भगवते रामायेति पदं वदेत् ॥ ६४॥ सर्वशब्दं
    समुच्चार्य सौभाग्यं देहि मे वदेत् । वह्निजायां तथोच्चार्य मन्त्रो विंशार्णको मतः ॥ ६५॥ तारं नमो भगवते
    रामाय सकलं वदेत् । आपन्निवारणायेति वह्निजायां ततो वदेत् ॥ ६६॥ एकविंशार्णको मन्त्रः सर्वाभीष्टफलप्रदः
    । तारं रमा स्वबीजं च ततो दाशरथाय च ॥ ६७॥ ततः सीतावल्लभाय सर्वाभीष्टपदं वदेत् । ततो दाय हृदन्तोऽयं
    मन्त्रो द्वाविंशदक्षरः ॥ ६८॥ तारं नमो भगवते वीररामाय संवदेत् । कल शत्रून् हन द्वन्द्वं वह्निजायां
    ततो वदेत् ॥ ६९॥ त्रयोविंशाक्षरोमन्त्रः सर्वशत्रुनिबर्हणः । विश्वामित्रो मुनिः प्रोक्तो गायत्रीच्हन्द
    उच्यते ॥ ७०॥ देवता वीररामोऽसौ बीजाद्याः पूर्ववन्मताः । मूलमन्त्रविभागेन न्यासान्कृत्वा विचक्षणः ॥
    ७१॥ शरं धनुषि सन्धाय तिष्ठन्तं रावणोन्मुखम् । वज्रपाणिं रथारूढं रामं ध्यात्वा जपेन्मनुम् ॥ ७२॥ तारं
    नमो भगवते श्रीरामाय पदं वदेत् । तारकब्रह्मणे चोक्त्वा मां तारय पदं वदेत् ॥ ७३॥ नमस्तारात्मको मन्त्रश्चतुर्विंशतिमन्त्रकः
    । बीजादिकं यथा पूर्वं सर्वं कुर्यात्षडर्णवत् ॥ ७४॥ कामस्तारो नतिश्चैव ततो भगवतेपदम् । रामचन्द्राय
    चोच्चार्य सकलेति पदं वदेत् ॥ ७५॥ जनवश्यकरायेति स्वाहा कामात्मको मनुः । सर्ववश्यकरो मन्त्रः पञ्चविंशतिवर्णकः
    ॥ ७६॥ आदौ तारेण संयुक्तो मन्त्रः षड्विंशदक्षरः । अन्तेऽपि तारसंयुक्तः सप्तविंशतिवर्णकः ॥ ७७॥ तारं
    नमो भगवते रक्षोघ्नविशदाय च । सर्वविघ्नान्त्समुच्चार्य निवारय पदद्वयम् ॥ ७८॥ स्वाहान्तो मन्त्रराजोऽयमष्टाविंशतिवर्णकः
    । अन्ते तारेण संयुक्त एकोनत्रिंशदक्षरः ॥ ७९॥ आदौ स्वबीजसंयुक्तस्त्रिंशद्वर्णात्मको मनुः । अन्तेऽपि
    तेन संयुक्त एकत्रिंशात्मकः स्मृतः ॥ ८०॥ रामभद्र महेश्वास रघुवीर नृपोत्तम । भो दशास्यान्तकास्माकं श्रियं
    दापय देहि मे ॥ ८१॥ आनुष्टुभ ऋषी रामश्च्हन्दोऽनुष्टुप्स देवता । रां बीजमस्य यं शक्तिरिष्टार्थे विनियोजयेत्
    ॥ ८२॥ पादं हृदि च विन्यस्य पादं शिरसि विन्यसेत् । शिखायां पञ्चभिर्न्यस्य त्रिवर्णैः कवचं न्यसेत् ॥
    ८३॥ नेत्रयोः पञ्चवर्णैश्च दापयेत्यस्त्रमुच्यते । चापबाणधरं श्यामं ससुग्रीवबिभीषणम् ॥ ८४॥ हत्वा रावणमायान्तं
    कृतत्रैलोक्यरक्षणम् । रामचन्द्रं हृदि ध्यात्वा दशलक्षं जपेन्मनुम् ॥ ८५॥ वदेद्दाशरथायेति विद्महेति
    पदं ततः । सीतापदं समुद्धृत्य वल्लभाय ततो वदेत् ॥ ८६॥ धीमहीति वदेत्तन्नो रामश्चापि प्रचोदयात् तारादिरेषा
    गायत्री मुक्तिमेव प्रयच्च्हति ॥ ८७॥ मायादिरपि वैदुष्ट्यं रामादिश्च श्रियःपदम् । मदनेनापि संयुक्तः
    स मोहयति मेदिनीम् ॥ ८८॥ पञ्च त्रीणि षडर्णैश्च त्रीणि चत्वारि वर्णकैः । चत्वारि च चतुर्वर्णैरङ्गन्यासं
    प्रकल्पयेत् ॥ ८९॥ बीजध्यानादिकं सर्वं कुर्यात्षड्वर्णवत्क्रमात् । तारं नमो भगवते चतुर्थ्या रघुनन्दनम्
    ॥ ९०॥ रक्षोघ्नविशदं तद्वन्मधुरेति वदेत्ततः । प्रसन्नवदनं ङेन्तं वदेदमिततेजसे ॥ ९१॥ बलरामौ चतुर्थ्यन्तौ
    विष्णुं ङेन्तं नतिस्ततः । प्रोक्तो मालामनुः सप्तचत्वारिंशद्भिरक्षरैः ॥ ९२॥ ऋषिश्च्हन्दो देवतादि ब्रह्मानुष्टुभराघवाः
    । सप्तर्तुसप्तदश षड्रुद्रसंख्यैः षडङ्गकम् ॥ ९३॥ ध्यानं दशाक्षरं प्रोक्तं लक्षमेकं जपेन्मनुम् । श्रियं
    सीतां चतुर्थ्यन्तां स्वाहान्तोऽयं षडक्षरः ॥ ९४॥ जनकोऽस्य ऋषिश्च्हन्दो गायत्री देवता मनोः । सीता भगवती
    प्रोक्ता श्रीं बीजं नतिशक्तिकम् ॥ ९५॥ कीलं सीता चतुर्थ्यन्तमिष्टार्थे विनियोजयेत् । दीर्घस्वरयुताद्येन
    षडङ्गानि प्रकल्पयेत् ॥ ९६॥ स्वर्णाभामम्बुजकरां रामालोकनतत्पराम् । ध्यायेत्षट्कोणमध्यस्थरामाङ्कोपरि
    शोभिताम् ॥ ९७॥ लकारं तु समुद्धृत्य लक्ष्मणाय नमोन्तकः । अगस्त्यऋषिरस्याथ गायत्रं च्हन्द उच्यते ॥ ९८॥
    लक्ष्मणो देवता प्रोक्तो लं बीजं शक्तिरस्य हि । नमस्तु विनियोगो हि पुरुषार्थ चतुष्टये ॥ ९९॥ दीर्घभाजा
    स्वबीजेन षडङ्गानि प्रकल्पयेत् । द्विभुजं स्वर्णरुचिरतनुं पद्मनिभेक्षणम् ॥ १००॥ धनुर्बाणधरं देवं रामाराधनतत्परम्
    । भकारं तु समुद्धृत्य भरताय नमोन्तकः ॥ १०१॥ अगस्त्यऋषिरस्याथ शेषं पूर्ववदाचरेत् । भरतं श्यामलं शान्तं
    रामसेवापरायणम् ॥ १०२॥ धनुर्बाणधरं वीरं कैकेयीतनयं भजे । शं बीजं तु समुद्धृत्य शत्रुघ्नाय नमोन्तकः
    । ऋष्यादयो यथापूर्वं विनियोगोऽरिनिग्रहे ॥ १०३॥ द्विभुजं स्वर्णवर्णाभं रामसेवापरायणम् । लवणासुरहन्तारं
    सुमित्रातनयं भजे ॥ १०४॥ हृं हनुमांश्चतुर्थ्यन्तं हृदन्तो मन्त्रराजकः । रामचन्द्र ऋषिः प्रोक्तो योजयेत्पूर्ववत्क्रमात्
    ॥ १०५॥ द्विभुजं स्वर्णवर्णाभं रामसेवापरायणम् । मौञ्जीकौपीनसहितं मां ध्यायेद्रामसेवकम् ॥ इति॥ १०६॥
    इति रमरहस्योपनिषदि द्वितीयोऽध्यायः ॥ २॥ सनकाद्या मुनयो हनूमन्तं पप्रच्च्हुः । आञ्जनेय महाबल पूर्वोक्तमन्त्राणां
    पूजापीठमनुब्रूहीति । हनुमान् होवाच । आदौ षट्कोणम् । तन्मध्ये रामबीजं सश्रीकम् । तदधोभागे द्वितीयान्तं
    साध्यम् । बीजोर्ध्वभागे षष्ठ्यन्तं साधकम् । पार्श्वे दृष्टिबीजे तत्परितो जीवप्राणशक्तिवश्यबीजानि ।
    तत्सर्वं सन्मुखोन्मुखाभ्यां प्रणवाभ्यां वेष्टनम् । अग्नीशासुरवायव्यपुरःपृष्ठेषु षट्कोणेषु दीर्घभाञ्जि
    । हृदयादिमन्त्राः क्रमेण । रां रीं रूं रैं रौं रः इति दीर्घभाजि तद्युक्तहृदयाद्यस्त्रान्तम् । षट्कोणपार्श्वे
    रमामायाबीजे । कोणाग्रे वाराहं हुमिति । तद्बीजान्तराले कामबीजम् । परितो वाग्भवम् । ततो वृत्तत्रयं साष्टपत्रम्
    । तेषु दलेषु स्वरानष्टवर्गान्प्रतिदलं मालामनुवर्णषट्कम् । अन्ते पञ्चाक्षरम् । तद्दलकपोलेष्वष्टवर्णान्
    । पुनरष्टदलपद्मम् । तेषु दलेषु नारायणाष्टाक्षरो मन्त्रः । तद्दलकपोलेषु श्रीबीजम् । ततो वृत्तम् । ततो
    द्वादशदलम् । तेषु दलेषु वासुदेवद्वादशाक्षरो मन्त्रः । तद्दलकपोलेष्वादिक्षान्तान् । ततो वृत्तम् । ततः
    षोडशदलम् । तेषु दलेषु हुं फट् नतिसहितरामद्वादशाक्षरम् । तद्दलकपोलेषु मायाबीजम् । सर्वत्र प्रतिकपोलं
    द्विरावृत्त्या ह्रं स्रं भ्रं ब्रं भ्रमं श्रुं ज्रम् । ततो वृत्तम् । ततो द्वात्रिंशद्दलपद्मम् । तेषु
    दलेषु नृसिंहमन्त्रराजानुष्टुभमन्रः । तद्दलकपोलेश्वष्टव स्वेकादशरुद्रद्वादशादित्यमन्त्राः प्रणवादिनमोन्ता
    श्चतुर्थ्यन्ताः क्रमेण । तद्बहिर्वषट्कारं परितः । ततो रेखात्रययुक्तं भूपुरम् । द्वादशदिक्षु राश्यादिभूषितम्
    । अष्टनागैरधिष्ठितम् । चतुर्दिक्षु नारसिंहबीजम् । विदिक्षु वाराहबीजम् । एतत्सर्वात्मकं यन्त्रं सर्वकामप्रदं
    मोक्षप्रदं च । एकाक्षरादिनवाक्षरान्तानामेतद्यन्त्रं भवति । तद्दशावरणात्मकं भवति । षट्कोणमध्ये साङ्गं
    राघवं यजेत् । षट्कोणेष्वङ्गैः प्रथमा वृतिः । अष्टदलमूले आत्माद्यावरणम् । तदग्रे वासुदेवाद्यावरणम्
    । द्वितीयाष्टदलमूले घृष्टाद्यावरणम् । तदग्रे हनूमदाद्यावरणम् । द्वादशदलेषु वसिष्ठाद्यावरणम् । षोडशदलेशु
    नीलाद्यावरणम् । द्वात्रिंशद्दलेषु ध्रुवाद्यावरणम् । भूपुरान्तरिन्द्राद्यावरणम् । तद्बहिर्वज्राद्यावरणम्
    । एवमभ्यर्च्य मनुं जपेत् ॥ अथ दशाक्षरादिद्वात्रिंशदक्षरान्तानां मन्त्राणां पूजापीठमुच्यते । आदौ षट्कोणम्
    । तन्मध्ये स्वबीजम् । तन्मध्ये साध्यनामानि । एवं कामबीजवेष्टनम् । तं शिष्टेन नवार्णेन वेष्टनम् । षट्कोणेषु
    षडङ्गान्यग्नीशासुरवायव्यपूर्वपृष्ठेषु । तत्कपोलेषु श्रीमाये । कोणाग्रे क्रोधम् । ततो वृत्तम् । ततोऽष्टदलम्
    । तेषु दलेषु षट्संख्यया मालामनुवर्णान् । तद्दलकपोलेषु षोडश स्वराः । ततो वृत्तम् । तत्परित आदिक्षान्तम्
    । तद्बहिर्भूपुरम् साष्टशूलाग्रम् । दिक्षु विदिक्षु नारसिंहवाराहे । एतन्महायन्त्रम् । आधारशक्त्यादिवैष्णवपीठम्
    । अङ्गैः प्रथमा वृतिः । मध्ये रामम् । वामभागे सीताम् । तत्पुरतः शार्ङ्गं शरं च । अष्टदलमूले हनुमदादिद्वितीयावरणम्
    । घृष्ट्यादितृतीयावरणम् । इन्द्रादिभिश्चतुर्थी । वज्रादिभिः पञ्चमी । एतद्यन्त्राराधन पूर्वकं दशाक्षरादिमन्त्रं
    जपेत् । ॥ इति रामरहस्योपनिषदि तृतीयोऽध्यायः ॥ ३॥ सनकाद्या मुनयो हनूमन्तं पप्रच्च्हुः । श्रीराममन्त्राणां
    पुरश्चरणविधिमनुब्रूहीति । हनूमान्होवाच । नित्यं त्रिषवणस्नायी पयोमूलफलादिभुक् । अथवा पायसाहारो हविष्यान्नाद
    एव वा ॥ १॥ षड्सैश्च परित्यक्तः स्वाश्रमोक्तविधिं चरन् । वनितादिषु वाक्कर्ममनोभिर्निःस्पृहः शुचिः ॥
    २॥ भूमिशायी ब्रह्मचारी निष्कामो गुरुभक्तिमान् । स्नानपूजाजपध्यानहोमतर्पणतत्परः ॥ ३॥ गुरूपदिष्टमार्गेण
    ध्यायन्राममनन्यधीः । सूर्येन्दुगुरुदीपादिगोब्राह्मणसमीपतः ॥ ४॥ श्रीरामसन्निधौ मौनी मन्त्रार्थमनुचिन्तयन्
    । व्याघ्रचर्मासने स्थित्वा स्वस्तिकाद्यासनक्रमात् ॥ ५॥ तुलसीपारिजातश्रीवृक्षमूलादिकस्थले । पद्माक्षतुलसीकाष्ठरुद्राक्षकृतमालया
    ॥ ६॥ मातृकामालया मन्त्री मनसैव मनुं जपेत् । अभ्यर्च्य वैष्णवे पीठे जपेदक्षरलक्षकम् ॥ ७॥ तर्पयेत्तद्दशांशेन
    पायसात्तद्दशांशतः । जुहुयाद्गोघृतेनैव भोजयेत्तद्दशांशतः ॥ ८॥ ततः पुष्पाञ्जलिं मूलमन्त्रेण विधिवच्चरेत्
    । ततः सिद्धमनुर्भूत्वा जीवन्मुक्तो भवेन्मुनिः ॥ ९॥ अणिमादिर्भजत्येनं यूनं वरवधूरिव । ऐहिकेषु च कार्येषु
    महापत्सु च सर्वदा ॥ १०॥ नैव योज्यो राममन्त्रः केवलं मोक्षसाधकः । ऐहिके समनुप्राप्ते मां स्मरेद्रामसेवकम्
    ॥ ११॥ यो रामं संस्मरेन्नित्यं भक्त्या मनुपरायणः । तस्याहमिष्टसंसिद्ध्यै दीक्षितोऽस्मि मुनीश्वराः ॥
    १२॥ वाञ्च्हितार्थं प्रदास्यामि भक्तानां राघवस्य तु । सर्वथा जागरूकोऽस्मि रामकार्यधुरन्धरः ॥ १३॥ इति
    रामरहस्योपनिषदि चतुर्थोऽध्यायः ॥ ४॥ सनकाद्या मुनयो हनूमन्तं पप्रच्च्हुः । श्रीराममन्त्रार्थमनुब्रूहीति
    । हनूमान्होवाच । सर्वेषु राममन्त्रेषु मन्त्रराजः षडक्षरः । एकधाय द्विधा त्रेधा चतुर्धा पञ्चधा तथा
    ॥ १॥ षट्सप्तधाष्टधा चैव बहुधायं व्यवस्थितः । षडक्षरस्य माहात्म्यं शिवो जानाति तत्त्वतः ॥ २॥ श्रीराममन्त्रराजस्य
    सम्यगर्थोऽयमुच्यते । नारायणाष्टाक्षरे च शिवपञ्चाक्षरे तथा । सार्थकार्णद्वयं रामो रमन्ते यत्र योगिनः
    । रकारो वह्निवचनः प्रकाशः पर्यवस्यति ॥ ३॥ सच्चिदानन्दरूपोऽस्य परमात्मार्थ उच्यते । व्यञ्जनं निष्कलं
    ब्रह्म प्राणो मायेति च स्वरः ॥ ४॥ व्यञ्जनैः स्वरसंयोगं विद्धि तत्प्राणयोजनम् । रेफो ज्योतिर्मये तस्मात्कृतमाकरयोजनम्
    ॥ ५॥ मकारोऽभ्युदयार्थत्वात्स मायेति च कीर्त्यते । सोऽयं बीजं स्वकं यस्मात्समायं ब्रह्म चोच्यते ॥ ६॥
    सबिन्दुः सोऽपि पुरुषः शिवसूर्येन्दुरूपवान् । ज्योतिस्तस्य शिखा रूपं नादः सप्रकृतिर्मतः ॥ ७॥ प्रकृतिः
    पुरुषश्चोभौ समायाद्ब्रह्मणः स्मृतौ । बिन्दुनादात्मकं बीजं वह्निसोमकलात्मकम् ॥ ८॥ अग्नीषोमात्मकं रूपं
    रामबीजे प्रतिष्ठितम् । यथैव वटबीजस्थः प्राकृतश्च महाद्रुमः ॥ ९॥ तथैव रामबीजस्थं जगदेतच्चराचरम् । बीजोक्तमुभयार्थत्वं
    रामनामनि दृश्यते ॥ १०॥ बीजं मायाविनिर्मुक्तं परं ब्रह्मेति कीर्त्यते । मुक्तिदं साधकानां च मकारो मुक्तिदो
    मतः ॥ ११॥ मारूपत्वादतो रामो भुक्तिमुक्तिफलप्रदः । आद्यो र तत्पदार्थः स्यान्मकरस्त्वंपदार्थवान् ॥ १२॥
    तयोः संयोजनमसीत्यर्थे तत्त्वविदो विदुः । नमस्त्वमर्थो विज्ञेयो रामस्तत्पदमुच्यते ॥ १३॥ असीत्यर्थे
    चतुर्थी स्यादेवं मन्त्रेषु योजयेत् । तत्त्वमस्यादिवाक्यं तु केवलं मुक्तिदं यतः ॥ १४॥ भुक्तिमुक्तिप्रदं
    चैतत्तस्मादप्यतिरिच्यते । मनुष्वेतेषु सर्वेषामधिकारोऽस्ति देहिनाम् ॥ १५॥ मुमुक्षूणां विरक्तानां तथा
    चाश्रमवासिनाम् । प्रणवत्वात्सदा ध्येयो यतीनां च विशेषतः । राममन्त्रार्थविज्ञानी जीवन्मुक्तो न संशयः
    ॥ १६॥ य इमामुपनिषदमधीते सोऽग्निपूतो भवति । स वायुपूतो भवति । सुरापानात्पूतो भवति । स्वर्णस्तेयात्पूतो
    भवति । ब्रह्महत्यापूतो भवति । स राममन्त्राणां कृतपुरश्चरणो रामचन्द्रो भवति । तदेतदृचाभ्युक्तम् । सदा
    रामोऽहमस्मीति तत्त्वतः प्रवदन्ति ये । न ते संसारिणो नूनं राम एव न संशयः ॥ ॐ याऽयोध्या सा सर्वबैकुण्ठानामेव
    मूलाधारा प्रकृतेः परा तत्सद् ब्रह्ममयी विरजोत्तरा दिव्यरत्नकोशाढ्या तस्या नित्यमेव श्रीसीतारामयोर्विहारस्थलमस्ति।।
