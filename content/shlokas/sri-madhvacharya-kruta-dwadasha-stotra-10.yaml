id: sri-madhvacharya-kruta-dwadasha-stotra-10
category: stotram
name:
  english: Sri Madhvacharya Kruta Dwadasha Stotra - 10
content:
  english: atha dashamastotram ava nah shripatirapratiradhikeshadibhavade | karunapurnavarapradacaritam
    jnapaya me te || || suravandyadhipa sadvarabharitasheshagunalam | karunapurnavarapradacaritam jnapaya
    me te || paramanandasudhaho | karunapurnavarapradacaritam jnapaya me te || || trijagatpota sadarcitacaranashapatidhato
    | karunapurnavarapradacaritam jnapaya me te || || trigunatitavidharaka parito dehi subhaktim | karunapurnavarapradacaritam
    jnapaya me te || || sharanam karanabhavana bhava me tata sada'lam | karunapurnavarapradacaritam jnapaya
    me te || || maranapranada palaka jagadishava subhaktim | karunapurnavarapradacaritam jnapaya me te
    || || tarunadityasavarnakacaranabjamala kirte | karunapurnavarapradacaritam jnapaya me te || || salilaprotthasaragakamanivarnoccanakhade
    | karunapurnavarapradacaritam jnapaya me te || tuninibhapavanavarajanghamitashakte | karunapurnavarapradacaritam
    jnapaya me te || || ibahastaprabhashobhanaparamorustharamale | karunapurnavarapradacaritam jnapaya
    me te || || asanotphullasupushpakasamavarnavaranante | karunapurnavarapradacaritam jnapaya me te ||
    || shatamododbhavasundarivarapadmotthitanabhe | karunapurnavarapradacaritam jnapaya me te || || jagadaguhakapallavasamakukshe
    sharanade | karunapurnavarapradacaritam jnapaya me te || || jagadambamalasundarigrihavakshovara yogin
    | karunapurnavarapradacaritam jnapaya me te || || ditijantaprada cakradharagadayugvarabaho | karunapurnavarapradacaritam
    jnapaya me te || || paramajnanamahanidhivadana shriramanendo | karunapurnavarapradacaritam jnapaya
    me te || parasaukhyapradadrishte | karunapurnavarapradacaritam jnapaya me te || || paramanandasutirthasumunirajo
    harigatham | kritavannityasupurnakaparamanandapadaishin || || iti shrimadanandatirthabhagavatpadacarya
    viracitam dvadashastotreshu dashamastotram sampurnam
  devanagari: अथ दशमस्तोत्रम् अव नः श्रीपतिरप्रतिरधिकेशादिभवादे । करुणापूर्णवरप्रदचरितं ज्ञापय मे ते ॥
    ॥ सुरवन्द्याधिप सद्वरभरिताशेषगुणालम् । करुणापूर्णवरप्रदचरितं ज्ञापय मे ते ॥ परमानन्दसुधाहो । करुणापूर्णवरप्रदचरितं
    ज्ञापय मे ते ॥ ॥ त्रिजगत्पोत सदार्चितचरणाशापतिधातो । करुणापूर्णवरप्रदचरितं ज्ञापय मे ते ॥ ॥ त्रिगुणातीतविधारक
    परितो देहि सुभक्तिम् । करुणापूर्णवरप्रदचरितं ज्ञापय मे ते ॥ ॥ शरणं कारणभावन भव मे तात सदाऽलम् । करुणापूर्णवरप्रदचरितं
    ज्ञापय मे ते ॥ ॥ मरणप्राणद पालक जगदीशाव सुभक्तिम् । करुणापूर्णवरप्रदचरितं ज्ञापय मे ते ॥ ॥ तरुणादित्यसवर्णकचरणाब्जामल
    कीर्ते । करुणापूर्णवरप्रदचरितं ज्ञापय मे ते ॥ ॥ सलिलप्रोत्थसरागकमणिवर्णोच्चनखादे । करुणापूर्णवरप्रदचरितं
    ज्ञापय मे ते ॥ तूणीनिभपावनवरजङ्घामितशक्ते । करुणापूर्णवरप्रदचरितं ज्ञापय मे ते ॥ ॥ इबहस्तप्रभशोभनपरमोरुस्थरमाले
    । करुणापूर्णवरप्रदचरितं ज्ञापय मे ते ॥ ॥ असनोत्फुल्लसुपुष्पकसमवर्णावरणान्ते । करुणापूर्णवरप्रदचरितं
    ज्ञापय मे ते ॥ ॥ शतमोदोद्भवसुन्दरिवरपद्मोत्थितनाभे । करुणापूर्णवरप्रदचरितं ज्ञापय मे ते ॥ ॥ जगदागूहकपल्लवसमकुक्षे
    शरणादे । करुणापूर्णवरप्रदचरितं ज्ञापय मे ते ॥ ॥ जगदम्बामलसुन्दरिगृहवक्षोवर योगिन् । करुणापूर्णवरप्रदचरितं
    ज्ञापय मे ते ॥ ॥ दितिजान्तप्रद चक्रधरगदायुग्वरबाहो । करुणापूर्णवरप्रदचरितं ज्ञापय मे ते ॥ ॥ परमज्ञानमहानिधिवदन
    श्रीरमणेन्दो । करुणापूर्णवरप्रदचरितं ज्ञापय मे ते ॥ परसौख्यप्रददृष्टे । करुणापूर्णवरप्रदचरितं ज्ञापय
    मे ते ॥ ॥ परमानन्दसुतीर्थसुमुनिराजो हरिगाथाम् । कृतवान्नित्यसुपूर्णकपरमानन्दपदैषिन् ॥ ॥ इति श्रीमदानन्दतीर्थभगवत्पादाचार्य
    विरचितं द्वादशस्तोत्रेषु दशमस्तोत्रं सम्पूर्णम्
