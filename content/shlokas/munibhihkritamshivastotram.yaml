id: munibhihkritamshivastotram
category: stotram
name:
  english: munibhihkritamshivastotram
  devanagari: मुनिभिःकृतंशिवस्तोत्रम्
content:
  english: munibhih kritam shivastotram nirikshya te jagannatham trinetram candrabhushanam | tushtaburhrishtamanaso
    bhaktya tam parameshvaram || 1|| munaya ucuh | jayeshvara mahadeva jaya bhutapate shiva | jayasheshamunishana
    tapasa'bhiprapujita || 2|| sahasramurte vishvatman jagadyantrapravarttaka | jayananta jagajjanmatranasamharakaraka
    || 3|| sahasracaraneshana shambho yogindravandita | jayambikapate deva namaste parameshvara || 4||
    iti shrikurmapurane uttarabhage prathamadhyayantgatam munibhih kritam shivastotram samaptam | kurmapurane
    uttarabhage 1
  devanagari: मुनिभिः कृतं शिवस्तोत्रम् निरीक्ष्य ते जगन्नाथं त्रिनेत्रं चन्द्रभूषणम् । तुष्टबुर्हृष्टमनसो
    भक्त्या तं परमेश्वरम् ॥ १॥ मुनय ऊचुः । जयेश्वर महादेव जय भूतपते शिव । जयाशेषमुनीशान तपसाऽभिप्रपूजित
    ॥ २॥ सहस्रमूर्ते विश्वात्मन् जगद्यन्त्रप्रवर्त्तक । जयानन्त जगज्जन्मत्राणसंहारकारक ॥ ३॥ सहस्रचरणेशान
    शम्भो योगीन्द्रवन्दित । जयाम्बिकापते देव नमस्ते परमेश्वर ॥ ४॥ इति श्रीकूर्मपुराणे उत्तरभागे प्रथमाध्यायान्त्गतं
    मुनिभिः कृतं शिवस्तोत्रं समाप्तम् । कूर्मपुराणे उत्तरभागे १
meaning: {}
