id: saraswati-ashtottara-sata-nama-stotram
category: stotram
name:
  english: Saraswati Ashtottara Sata Nama Stotram
content:
  english: sarasvati mahabhadra mahamaya varaprada | shriprada padmanilaya padmakshi padmavaktriga ||
    || shivanuja pustakahasta jnanamudra rama ca vai | kamarupa mahavidya mahapatakanashini || || mahashraya
    malini ca mahabhoga mahabhuja | mahabhaga mahotsaha divyanga suravandita || || mahakali mahapasha
    mahakara mahankusha | sita ca vimala vishva vidyunmala ca vaishnavi || || candrika candralekhavibhushita
    ca mahaphala | savitri surasadevi divyalankarabhushita || || vagdevi vasudha tivra mahabhadra ca bhogada
    | govinda bharati bhama gomati jatila tatha || || vindhyavasa candika ca subhadra surapujita | vinidra
    vaishnavi brahmi brahmajnanaikasadhana || || saudamini sudhamurti ssuvina ca suvasini | vidyarupa
    brahmajaya vishala padmalocana || || shumbhasurapramathini dhumralocanamardana | sarvatmika trayimurti
    shshubhada shastrarupini || || sarvadevastuta sauya surasuranamaskrita | raktabijanihantri ca camunda
    mundakambika || || kalaratrih praharana kaladhara niranjana | vararoha ca vagdevi varahi varijasana
    || || citrambara citragandha citramalyavibhushita | kanta kamaprada vandya rupasaubhagyadayini ||
    || shvetasana raktamadhya dvibhuja surapujita | niranjana nilajangha caturvargaphalaprada || || caturananasamrajni
    brahmavishnushivatmika | hamsanana mahavidya mantravidya sarasvati || || mahasarasvati tantravidya
    jnanaikatatpara | iti shrisarasvatyashtottarashatanamastotram sampurnam |
  devanagari: सरस्वती महाभद्रा महामाया वरप्रदा । श्रीप्रदा पद्मनिलया पद्माक्षी पद्मवक्त्रिगा ॥ ॥ शिवानुजा
    पुस्तकहस्ता ज्ञानमुद्रा रमा च वै । कामरूपा महाविद्या महापातकनाशिनी ॥ ॥ महाश्रया मालिनी च महाभोगा महाभुजा
    । महाभागा महोत्साहा दिव्याङ्गा सुरवन्दिता ॥ ॥ महाकाली महापाशा महाकारा महाङ्कुशा । सीता च विमला विश्वा
    विद्युन्माला च वैष्णवी ॥ ॥ चन्द्रिका चन्द्रलेखाविभूषिता च महाफला । सावित्री सुरसादेवी दिव्यालङ्कारभूषिता
    ॥ ॥ वाग्देवी वसुधा तीव्रा महाभद्रा च भोगदा । गोविन्दा भारती भामा गोमती जटिला तथा ॥ ॥ विन्ध्यवासा चण्डिका
    च सुभद्रा सुरपूजिता । विनिद्रा वैष्णवी ब्राह्मी ब्रह्मज्ञानैकसाधना ॥ ॥ सौदामिनी सुधामूर्ति स्सुवीणा
    च सुवासिनी । विद्यारूपा ब्रह्मजाया विशाला पद्मलोचना ॥ ॥ शुम्भासुरप्रमथिनी धूम्रलोचनमर्दना । सर्वात्मिका
    त्रयीमूर्ति श्शुभदा शास्त्ररूपिणी ॥ ॥ सर्वदेवस्तुता सौया सुरासुरनमस्कृता । रक्तबीजनिहन्त्री च चामुण्डा
    मुण्डकाम्बिका ॥ ॥ कालरात्रिः प्रहरणा कलाधारा निरञ्जना । वरारोहा च वाग्देवी वाराही वारिजासना ॥ ॥ चित्राम्बरा
    चित्रगन्धा चित्रमाल्यविभूषिता । कान्ता कामप्रदा वन्द्या रूपसौभाग्यदायिनी ॥ ॥ श्वेतासना रक्तमध्या द्विभुजा
    सुरपूजिता । निरञ्जना नीलजङ्घा चतुर्वर्गफलप्रदा ॥ ॥ चतुराननसाम्राज्ञी ब्रह्मविष्णुशिवात्मिका । हंसानना
    महाविद्या मन्त्रविद्या सरस्वती ॥ ॥ महासरस्वती तन्त्रविद्या ज्ञानैकतत्परा । इति श्रीसरस्वत्यष्टोत्तरशतनामस्तोत्रं
    सम्पूर्णम् ।
