id: apaduddharakashrirama
category: stotram
name:
  english: apaduddharakashrirama
  devanagari: आपदुद्धारकश्रीराम
content:
  english: shrirama apaduddharakastotram apadamapahartaram dataram sarvasampadam lokabhiramam shriramam
    bhuyo bhuyo namamyaham | namah kodandahastaya sandhikritasharaya ca danditakhiladaityaya ramayapannivarine
    || 1|| apannajanarakshaikadikshayamitatejase | namo'stu vishnave tubhyam ramayapannivarine || 2||
    padambhojarajasparshapavitramuniyoshite | namo'stu sitapataye ramayapannivarine || 3|| danavendramahamattagajapancasyarupine
    | namo'stu raghunathaya ramayapannivarine || 4|| mahijakucasamlagnakunkumarunavakshase | namah kalyanarupaya
    ramayapannivarine || 5|| padmasambhavabhuteshamunisamstutakirtaye | namo martandavamshyaya ramayapannivarine
    || 6|| haratyartim ca lokanam yo va madhunishudanah | namo'stu haraye tubhyam ramayapannivarine ||
    7|| tapakaranasamsaragajasimhasvarupine | namo vedantavedyaya ramayapannivarine || 8|| rangattarangajaladhigarvahriccharadharine
    | namah prataparupaya ramayapannivarine || 9|| daropahitacandravatamsadhyatasvamurtaye | namah satyasvarupaya
    ramayapannivarine || 10|| taranayakasankashavadanaya mahaujase | namo'stu tatakahantre ramayapannivarine
    || 11|| ramyasanulasaccitrakutashramaviharine | namassaumitrisevyaya ramayapannivarine || 12|| sarvadevahitasakta
    dashananavinashine | namo'stu duhkhadhvamsaya ramayapannivarine || 13|| ratnasanunivasaika vandyapadambujaya
    ca | namastrailokyanathaya ramayapannivarine || 14|| samsarabandha mokshaikahetudamaprakashine | namah
    kalushasamhartre ramayapannivarine || 15|| pavanashugasankshiptamaricadisuraraye | namo makhaparitratre
    ramayapannivarine || 16|| dambhiketarabhaktaughamahanandapradayine | namah kamalanetraya ramayapannivarine
    || 17|| lokatrayodvegakarakumbhakarnashirashchide | namo niradadehaya ramayapannivarine || 18|| kakasuraikanayanaharallilastradharine
    | namo bhaktaikavedyaya ramayapannivarine || 19|| bhikshurupa samakrantabalisarvaikasampade | namo
    vamanarupaya ramayapannivarine || 20|| rajivanetrasuspandarucirangasurocishe | namah kaivalyanidhaye
    ramayapannivarine || 21|| mandamarutasamvitamandaradrumavasine | namah pallavapadaya ramayapannivarine
    || 22|| shrikanthacapadalanadhurinabalabahave | namah sitanushaktaya ramayapannivarine || 23|| rajarajasuhridyosharcitamangalamurtaye
    | nama ikshvakuvamshyaya ramayapannivarine || 24|| manjuladarshaviprekshanotsukaikavilasine | namah
    palitabhakttaya ramayapannivarine || 25|| bhuribhudharakodandamurtidhyeyasvarupine | namo'stu tejonidhaye
    ramayapannivarine || 26|| yogindrahritsarojatamadhupaya mahatmane | namo rajadhirajaya ramayapannivarine
    || 27|| bhuvarahasvarupaya namo bhuripradayine | namo hiranyagarbhaya ramayapannivarine || 28|| yoshanjalivinirmukta
    lajancitavapushmate | namassaundaryanidhaye ramayapannivarine || 29|| nakhakotivinirbhinnadaityadhipativakshase
    | namo nrisimharupaya ramayapannivarine || 30|| mayamanushadehaya vedoddharanahetave | namo'stu matsyarupaya
    ramayapannivarine || 31|| mitishunya mahadivyamahimne manitatmane | namo brahmasvarupaya ramayapannivarine
    || 32|| ahankaretarajanasvantasaudhaviharine | namo'stu citsvarupaya ramayapannivarine || 33|| sitalakshmanasamshobhiparshvaya
    paramatmane | namah pattabhishiktaya ramayapannivarine || 34|| apadamapahartaram dataram sarvasampadam
    | lokabhiramam shriramam bhuyo bhuyo namamyaham || 35|| phalashruti imam stavam bhagavatah pathedyah
    pritamanasah | prabhate va pradoshe va ramasya paramatmanah || 1|| sa tu tirtva bhavambhodhimapadassakala
    api | ramasayujyamapnoti devadevaprasadatah || 2|| karagrihadibadhasu samprapte bahusankate | apannivarakastotram
    pathedyastu yathavidhi || 3|| samyojyanushtubham mantramanushlokam smaran vibhum | saptahatsarvabadhabhyo
    mucyate natra samshayah || 4|| dvatrimshadvarajapatah pratyaham tu dridhavratah | vaishakhe bhanumalokya
    pratyaham shatasankhyaya || 5|| dhanavan dhanadaprakhyassa bhavennatra samshayah | bahunatra kimuktena
    yam yam kamayate narah || 6|| tam tam kamamavapnoti stotrenanena manavah | yantrapujavidhanena japahomaditarpanaih
    || 7|| yastu kurvita sahasa sarvan kamanavapnuyat | iha loke sukhi bhutva pare mukto bhavishyati ||
    8||
  devanagari: श्रीराम आपदुद्धारकस्तोत्रम् आपदामपहर्तारं दातारं सर्वसम्पदां लोकाभिरामं श्रीरामं भूयो भूयो
    नमाम्यहम् । नमः कोदण्डहस्ताय सन्धीकृतशराय च दण्डिताखिलदैत्याय रामायापन्निवारिणे ॥ १॥ आपन्नजनरक्षैकदीक्षायामिततेजसे
    । नमोऽस्तु विष्णवे तुभ्यं रामायापन्निवारिणे ॥ २॥ पदाम्भोजरजस्पर्शपवित्रमुनियोषिते । नमोऽस्तु सीतापतये
    रामायापन्निवारिणे ॥ ३॥ दानवेन्द्रमहामत्तगजपञ्चास्यरूपिणे । नमोऽस्तु रघुनाथाय रामायापन्निवारिणे ॥ ४॥
    महिजाकुचसंलग्नकुङ्कुमारुणवक्षसे । नमः कल्याणरूपाय रामायापन्निवारिणे ॥ ५॥ पद्मसम्भवभूतेशमुनिसंस्तुतकीर्तये
    । नमो मार्ताण्डवंश्याय रामायापन्निवारिणे ॥ ६॥ हरत्यार्तिं च लोकानां यो वा मधुनिषूदनः । नमोऽस्तु हरये
    तुभ्यं रामायापन्निवारिणे ॥ ७॥ तापकारणसंसारगजसिंहस्वरूपिणे । नमो वेदान्तवेद्याय रामायापन्निवारिणे ॥
    ८॥ रङ्गत्तरङ्गजलधिगर्वहृच्छरधारिणे । नमः प्रतापरूपाय रामायापन्निवारिणे ॥ ९॥ दारोपहितचन्द्रावतंसध्यातस्वमूर्तये
    । नमः सत्यस्वरूपाय रामायापन्निवारिणे ॥ १०॥ तारानायकसङ्काशवदनाय महौजसे । नमोऽस्तु ताटकाहन्त्रे रामायापन्निवारिणे
    ॥ ११॥ रम्यसानुलसच्चित्रकूटाश्रमविहारिणे । नमस्सौमित्रिसेव्याय रामायापन्निवारिणे ॥ १२॥ सर्वदेवाहितासक्त
    दशाननविनाशिने । नमोऽस्तु दुःखध्वंसाय रामायापन्निवारिणे ॥ १३॥ रत्नसानुनिवासैक वन्द्यपादाम्बुजाय च ।
    नमस्त्रैलोक्यनाथाय रामायापन्निवारिणे ॥ १४॥ संसारबन्ध मोक्षैकहेतुदामप्रकाशिने । नमः कलुषसंहर्त्रे रामायापन्निवारिणे
    ॥ १५॥ पवनाशुगसङ्क्षिप्तमारीचादिसुरारये । नमो मखपरित्रात्रे रामायापन्निवारिणे ॥ १६॥ दाम्भिकेतरभक्तौघमहानन्दप्रदायिने
    । नमः कमलनेत्राय रामायापन्निवारिणे ॥ १७॥ लोकत्रयोद्वेगकरकुम्भकर्णशिरश्छिदे । नमो नीरददेहाय रामायापन्निवारिणे
    ॥ १८॥ काकासुरैकनयनहरल्लीलास्त्रधारिणे । नमो भक्तैकवेद्याय रामायापन्निवारिणे ॥ १९॥ भिक्षुरूप समाक्रान्तबलिसर्वैकसम्पदे
    । नमो वामनरूपाय रामायापन्निवारिणे ॥ २०॥ राजीवनेत्रसुस्पन्दरुचिराङ्गसुरोचिषे । नमः कैवल्यनिधये रामायापन्निवारिणे
    ॥ २१॥ मन्दमारुतसंवीतमन्दारद्रुमवासिने । नमः पल्लवपादाय रामायापन्निवारिणे ॥ २२॥ श्रीकण्ठचापदलनधुरीणबलबाहवे
    । नमः सीतानुषक्ताय रामायापन्निवारिणे ॥ २३॥ राजराजसुहृद्योषार्चितमङ्गलमूर्तये । नम इक्ष्वाकुवंश्याय
    रामायापन्निवारिणे ॥ २४॥ मञ्जुलादर्शविप्रेक्षणोत्सुकैकविलासिने । नमः पालितभक्त्ताय रामायापन्निवारिणे
    ॥ २५॥ भूरिभूधरकोदण्डमूर्तिध्येयस्वरूपिणे । नमोऽस्तु तेजोनिधये रामायापन्निवारिणे ॥ २६॥ योगीन्द्रहृत्सरोजातमधुपाय
    महात्मने । नमो राजाधिराजाय रामायापन्निवारिणे ॥ २७॥ भूवराहस्वरूपाय नमो भूरिप्रदायिने । नमो हिरण्यगर्भाय
    रामायापन्निवारिणे ॥ २८॥ योषाञ्जलिविनिर्मुक्त लाजाञ्चितवपुष्मते । नमस्सौन्दर्यनिधये रामायापन्निवारिणे
    ॥ २९॥ नखकोटिविनिर्भिन्नदैत्याधिपतिवक्षसे । नमो नृसिंहरूपाय रामायापन्निवारिणे ॥ ३०॥ मायामानुषदेहाय
    वेदोद्धरणहेतवे । नमोऽस्तु मत्स्यरूपाय रामायापन्निवारिणे ॥ ३१॥ मितिशून्य महादिव्यमहिम्ने मानितात्मने
    । नमो ब्रह्मस्वरूपाय रामायापन्निवारिणे ॥ ३२॥ अहङ्कारेतरजनस्वान्तसौधविहारिणे । नमोऽस्तु चित्स्वरूपाय
    रामायापन्निवारिणे ॥ ३३॥ सीतालक्ष्मणसंशोभिपार्श्वाय परमात्मने । नमः पट्टाभिषिक्ताय रामायापन्निवारिणे
    ॥ ३४॥ आपदामपहर्तारं दातारं सर्वसम्पदाम् । लोकाभिरामं श्रीरामं भूयो भूयो नमाम्यहम् ॥ ३५॥ फलश्रुति इमं
    स्तवं भगवतः पठेद्यः प्रीतमानसः । प्रभाते वा प्रदोषे वा रामस्य परमात्मनः ॥ १॥ स तु तीर्त्वा भवाम्भोधिमापदस्सकला
    अपि । रामसायुज्यमाप्नोति देवदेवप्रसादतः ॥ २॥ कारागृहादिबाधासु सम्प्राप्ते बहुसङ्कटे । अपन्निवारकस्तोत्रं
    पठेद्यस्तु यथाविधि ॥ ३॥ संयोज्यानुष्टुभं मन्त्रमनुश्लोकं स्मरन् विभुम् । सप्ताहात्सर्वबाधाभ्यो मुच्यते
    नात्र संशयः ॥ ४॥ द्वात्रिंशद्वारजपतः प्रत्यहं तु दृढव्रतः । वैशाखे भानुमालोक्य प्रत्यहं शतसङ्ख्यया
    ॥ ५॥ धनवान् धनदप्रख्यस्स भवेन्नात्र संशयः । बहुनात्र किमुक्तेन यं यं कामयते नरः ॥ ६॥ तं तं काममवाप्नोति
    स्तोत्रेणानेन मानवः । यन्त्रपूजाविधानेन जपहोमादितर्पणैः ॥ ७॥ यस्तु कुर्वीत सहसा सर्वान् कामानवाप्नुयात्
    । इह लोके सुखी भूत्वा परे मुक्तो भविष्यति ॥ ८॥
