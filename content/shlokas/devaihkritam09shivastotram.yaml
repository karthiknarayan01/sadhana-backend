id: devaihkritam09shivastotram
category: stotram
name:
  english: devaihkritam09shivastotram
  devanagari: देवैःकृतं०९शिवस्तोत्रम्
content:
  english: devaih kritam 9 shivastotram deva ucuh | namo rudraya devaya madanantakaraya ca | stutyaya
    bhuribhasaya trinetraya namo namah || 1|| shipivishtaya bhimaya bhimakshaya namo namah | mahadevaya
    prabhave trivishtapataye namah || 2|| tvam nathah sarvalokanam pita mata tvamishvarah | shambhurishashshankaro'si
    dayalustvam visheshatah || 3|| tvam dhata sarvajagatam tratumarhasi nah prabho | tvam vina kassamartho'sti
    duhkhanashe maheshvara || 4|| iti shrishivapurane rudrasamhitayam parvatikhande caturvimshadhyayantargatam
    devaih kritam shivastotram samaptam | shivapurana | rudrasamhita | parvatikhanda | adhyaya 24
  devanagari: देवैः कृतं ९ शिवस्तोत्रम् देवा ऊचुः । नमो रुद्राय देवाय मदनान्तकराय च । स्तुत्याय भूरिभासाय
    त्रिनेत्राय नमो नमः ॥ १॥ शिपिविष्टाय भीमाय भीमाक्षाय नमो नमः । महादेवाय प्रभवे त्रिविष्टपतये नमः ॥
    २॥ त्वं नाथः सर्वलोकानां पिता माता त्वमीश्वरः । शम्भुरीशश्शङ्करोऽसि दयालुस्त्वं विशेषतः ॥ ३॥ त्वं
    धाता सर्वजगतां त्रातुमर्हसि नः प्रभो । त्वां विना कस्समर्थोऽस्ति दुःखनाशे महेश्वर ॥ ४॥ इति श्रीशिवपुराणे
    रुद्रसंहितायां पार्वतीखण्डे चतुर्विंशाध्यायान्तर्गतं देवैः कृतं शिवस्तोत्रं समाप्तम् । शिवपुराण ।
    रुद्रसंहिता । पार्वतीखण्ड । अध्याय २४
meaning: {}
