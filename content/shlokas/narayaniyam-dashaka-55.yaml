id: narayaniyam-dashaka-55
category: stotram
name:
  english: Narayaniyam Dashaka 55
content:
  english: atha varini ghorataram phaninam prativarayitum kritadhirbhagavan | drutamaritha tiraganipatarum
    vishamarutashoshitaparnacayam || || adhiruhya padamburuhena ca tam navapallavatulyamanojnaruca | hradavarini
    durataram nyapatah parighurnitaghorataranggane || || bhuvanatrayabharabhrito bhavato gurubharavikampivijrimbhijala
    | parimajjayati sma dhanushshatakam tatini jhatiti sphutaghoshavati || || atha dikshu vidikshu parikshubhita
    bhramitodaravarininadabharaih | udakadudagaduragadhipati stvadupantamashantarusha'ndhamanah || ||
    phanashringasahasravinissrimara jvaladagnikanogravishambudharam | puratah phaninam samalokayatha bahushringinamanjanashailamiva
    || || jvaladakshi pariksharadugravisha shvasanoshmabharah sa mahabhujagah | paridashya bhavantamanantabalam
    samaveshtayadasphutaceshtamaho || || avilokya bhavantamathakulite tatagamini balakadhenugane | vrajagehatale'pyanimittashatam
    samudikshya gata yamunam pashupah || || akhileshu vibho bhavadiya dasha mavalokya jihasushu jivabharam
    | phanibandhanamashu vimucya java dudagamyata hasajusha bhavata || || adhiruhya tatah phanirajaphanan
    nanrite bhavata mridupadaruca | kalashinjitanupuramanjumila tkarakankanasankulasankvanitam || || jahrishuh
    pashupastutushurmunayo vavrishuh kusumani surendraganah | tvayi nrityati marutagehapate paripahi sa
    mam tvamadantagadat ||
  devanagari: अथ वारिणि घोरतरं फणिनं प्रतिवारयितुं कृतधीर्भगवन् । द्रुतमारिथ तीरगनीपतरुं विषमारुतशोषितपर्णचयम्
    ॥ ॥ अधिरुह्य पदाम्बुरुहेण च तं नवपल्लवतुल्यमनोज्ञरुचा । ह्रदवारिणि दूरतरं न्यपतः परिघूर्णितघोरतरङ्ग्गणे
    ॥ ॥ भुवनत्रयभारभृतो भवतो गुरुभारविकम्पिविजृम्भिजला । परिमज्जयति स्म धनुश्शतकं तटिनी झटिति स्फुटघोषवती
    ॥ ॥ अथ दिक्षु विदिक्षु परिक्षुभित भ्रमितोदरवारिनिनादभरैः । उदकादुदगादुरगाधिपति स्त्वदुपान्तमशान्तरुषाऽन्धमनाः
    ॥ ॥ फणशृङ्गसहस्रविनिस्सृमर ज्वलदग्निकणोग्रविषाम्बुधरम् । पुरतः फणिनं समलोकयथा बहुशृङ्गिणमञ्जनशैलमिव
    ॥ ॥ ज्वलदक्षि परिक्षरदुग्रविष श्वसनोष्मभरः स महाभुजगः । परिदश्य भवन्तमनन्तबलं समवेष्टयदस्फुटचेष्टमहो
    ॥ ॥ अविलोक्य भवन्तमथाकुलिते तटगामिनि बालकधेनुगणे । व्रजगेहतलेऽप्यनिमित्तशतं समुदीक्ष्य गता यमुनां
    पशुपाः ॥ ॥ अखिलेषु विभो भवदीय दशा मवलोक्य जिहासुषु जीवभरम् । फणिबन्धनमाशु विमुच्य जवा दुदगम्यत हासजुषा
    भवता ॥ ॥ अधिरुह्य ततः फणिराजफणान् ननृते भवता मृदुपादरुचा । कलशिञ्जितनूपुरमञ्जुमिल त्करकङ्कणसङ्कुलसङ्क्वणितम्
    ॥ ॥ जहृषुः पशुपास्तुतुषुर्मुनयो ववृषुः कुसुमानि सुरेन्द्रगणाः । त्वयि नृत्यति मारुतगेहपते परिपाहि
    स मां त्वमदान्तगदात् ॥
