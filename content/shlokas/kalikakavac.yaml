id: kalikakavac
category: kavacha
name:
  english: kalikakavac
  devanagari: कालिकाकवच्
content:
  english: hrim aimrupini devi bhavabandhavimocani | humrupini mahakali rakshasman devi sarvada || 14||
    yaya shumbho hato daityo nishumbhashca mahasurah | vairinashaya vande tam kalikam shankarapriyam ||
    15|| brahmi shaivi vaishnavi ca varahi narasimhika | kaumaryaindri ca camunda khadantu mama vidvishah
    || 16|| sureshvari ghorarupa candamundavinashini | mundamalavritangi ca sarvatah patu mam sada ||
    17|| hrim hrim hrim kalike ghore damshtreva rudhirapriye | rudhirapurnavaktre ca rudhirenavritastani
    || 18|| mama shatrun khadaya khadaya himsa himsa maraya maraya bhindhi bhindhi chindhi chindhi uccataya
    uccataya dravaya dravaya shoshaya shoshaya svaha | hram hrim kalikayai madiyashatrun samarpayami svaha
    | om jaya jaya kiri kiri kiti kiti kata kata marda marda mohaya mohaya hara hara mama ripuna dhvamsa
    dhvamsa bhakshaya bhakshaya trotaya trotaya yatudhanan camunde sarvajanan rajno rajapurushan striyo
    mama vashyan kuru kuru tanu tanu dhanyam dhanam me'shvan gajan ratnani divyakaminih putran rajashriyam
    dehi yaccha ksham kshim kshum kshaim kshaum kshah svaha | ityetat kavacam divyam kathitam shambhuna
    pura | ye pathanti sada tesham dhruvam nashyanti shatravah || 19|| vairinah pralayam yanti vyadhita
    ya bhavanti hi | balahinah putrahinah shatravastasya sarvada || 20|| sahasrapathanatsiddhih kavacasya
    bhavettada | tatkaryani ca sidhyanti yatha shankarabhashitam || 21|| shmashanangaramadaya curnam kritva
    prayatnatah | padodakena pishtva tallikhellohashalakaya || 22|| bhumau shatrun hinarupanuttarashirasastatha
    | hastam dattva tu hridaye kavacam tu svayam pathet || 23|| shatroh pranapriyashtham tu kuryanmantrena
    mantravit | hanyadastram praharena shatro gaccha yamakshayam || 24|| jvaladangaratapena bhavanti jvarita
    bhrisham | pronchanairvamapadena daridro bhavati dhruvam || 25|| vairinashakaram proktam kavacam vashyakarakam
    | paramaishvaryadam caiva putrapautradivriddhidam || 26|| prabhatasamaye caiva pujakale ca yatnatah
    | sayankale tatha pathatsarvasiddhirbhaveddhruvam || 27|| shatruruccatanam yati deshadva vicyuto bhavet
    | pashcatkinkaratameti satyam satyam na samshayah || 28|| shatrunashakare devi sarvasampatkare shubhe
    | sarvadevastute devi kalike
  devanagari: ह्रीं ऐंरूपिणी देवी भवबन्धविमोचनी । हुंरूपिणी महाकाली रक्षास्मान् देवि सर्वदा ॥ १४॥ यया
    शुम्भो हतो दैत्यो निशुम्भश्च महासुरः । वैरिनाशाय वन्दे तां कालिकां शङ्करप्रियाम् ॥ १५॥ ब्राह्मी शैवी
    वैष्णवी च वाराही नारसिंहिका । कौमार्यैन्द्री च चामुण्डा खादन्तु मम विद्विषः ॥ १६॥ सुरेश्वरी घोररूपा
    चण्डमुण्डविनाशिनी । मुण्डमालावृताङ्गी च सर्वतः पातु मां सदा ॥ १७॥ ह्रीं ह्रीं ह्रीं कालिके घोरे दंष्ट्रेव
    रुधिरप्रिये । रुधिरापूर्णवक्त्रे च रुधिरेणावृतस्तनि ॥ १८॥ मम शत्रून् खादय खादय हिंस हिंस मारय मारय
    भिन्धि भिन्धि छिन्धि छिन्धि उच्चाटय उच्चाटय द्रावय द्रावय शोषय शोषय स्वाहा । ह्रां ह्रीं कालिकायै
    मदीयशत्रून् समर्पयामि स्वाहा । ॐ जय जय किरि किरि किटि किटि कट कट मर्द मर्द मोहय मोहय हर हर मम रिपून
    ध्वंस ध्वंस भक्षय भक्षय त्रोटय त्रोटय यातुधानान् चामुण्डे सर्वजनान् राज्ञो राजपुरुषान् स्त्रियो मम
    वश्यान् कुरु कुरु तनु तनु धान्यं धनं मेऽश्वान् गजान् रत्नानि दिव्यकामिनीः पुत्रान् राजश्रियं देहि
    यच्छ क्षां क्षीं क्षूं क्षैं क्षौं क्षः स्वाहा । इत्येतत् कवचं दिव्यं कथितं शम्भुना पुरा । ये पठन्ति
    सदा तेषां ध्रुवं नश्यन्ति शत्रवः ॥ १९॥ वैरिणः प्रलयं यान्ति व्याधिता या भवन्ति हि । बलहीनाः पुत्रहीनाः
    शत्रवस्तस्य सर्वदा ॥ २०॥ सहस्रपठनात्सिद्धिः कवचस्य भवेत्तदा । तत्कार्याणि च सिध्यन्ति यथा शङ्करभाषितम्
    ॥ २१॥ श्मशानाङ्गारमादाय चूर्णं कृत्वा प्रयत्नतः । पादोदकेन पिष्ट्वा तल्लिखेल्लोहशलाकया ॥ २२॥ भूमौ
    शत्रून् हीनरूपानुत्तराशिरसस्तथा । हस्तं दत्त्वा तु हृदये कवचं तु स्वयं पठेत् ॥ २३॥ शत्रोः प्राणप्रियष्ठां
    तु कुर्यान्मन्त्रेण मन्त्रवित् । हन्यादस्त्रं प्रहारेण शत्रो गच्छ यमक्षयम् ॥ २४॥ ज्वलदङ्गारतापेन भवन्ति
    ज्वरिता भृशम् । प्रोञ्छनैर्वामपादेन दरिद्रो भवति ध्रुवम् ॥ २५॥ वैरिनाशकरं प्रोक्तं कवचं वश्यकारकम्
    । परमैश्वर्यदं चैव पुत्रपौत्रादिवृद्धिदम् ॥ २६॥ प्रभातसमये चैव पूजाकाले च यत्नतः । सायङ्काले तथा पाठात्सर्वसिद्धिर्भवेद्ध्रुवम्
    ॥ २७॥ शत्रुरुच्चाटनं याति देशाद्वा विच्युतो भवेत् । पश्चात्किङ्करतामेति सत्यं सत्यं न संशयः ॥ २८॥
    शत्रुनाशकरे देवि सर्वसम्पत्करे शुभे । सर्वदेवस्तुते देवि कालिके
