id: namavali-76
category: stotram
name:
  english: namavali
  devanagari: नामावली
content:
  english: saubhagyashtottarashatanamavalih om kameshvaryai namah | kamashaktyai | kamasaubhagyadayinyai
    | kamarupayai | kamakalayai | kaminyai | kamalasanayai | kamalayai | kalpanahinayai | kamaniyakalavatyai
    | kamalabharatisevyayai | kalpitasheshasamsrityai | anuttarayai | anaghayai | anantayai | adbhutarupayai
    | analodbhavayai | atilokacaritrayai | atisundaryai | atishubhapradayai namah | 20 om aghahantryai
    namah | ativistarayai | arcanatushtayai | amitaprabhayai | ekarupayai | ekavirayai | ekanathayai |
    ekantarcanapriyayai | ekasyai | ekabhavatushtayai | ekarasayai | ekantajanapriyayai | edhamanaprabhavayai
    | edhadbhaktapatakanashinyai | elamodamukhayai | eno'drishakrayudhasamasthityai | ihashunyayai | ipsitayai
    | ishadisevyayai | ishanavaranganayai namah | 40 om ishvara''jnapikayai namah | ikarabhavyayai | ipsitaphalapradayai
    | ishanayai | itiharayai | ikshayai | ishadarunakshyai | ishvareshvaryai | lalitayai | lalanarupayai
    | layahinayai | lasattanave | layasarvayai | layakshonyai | layakarnyai
  devanagari: सौभाग्याष्टोत्तरशतनामावलिः ॐ कामेश्वर्यै नमः । कामशक्त्यै । कामसौभाग्यदायिन्यै । कामरूपायै
    । कामकलायै । कामिन्यै । कमलासनायै । कमलायै । कल्पनाहीनायै । कमनीयकलावत्यै । कमलाभारतीसेव्यायै । कल्पिताशेषसंसृत्यै
    । अनुत्तरायै । अनघायै । अनन्तायै । अद्भुतरूपायै । अनलोद्भवायै । अतिलोकचरित्रायै । अतिसुन्दर्यै । अतिशुभप्रदायै
    नमः । २० ॐ अघहन्त्र्यै नमः । अतिविस्तारायै । अर्चनतुष्टायै । अमितप्रभायै । एकरूपायै । एकवीरायै । एकनाथायै
    । एकान्तार्चनप्रियायै । एकस्यै । एकभावतुष्टायै । एकरसायै । एकान्तजनप्रियायै । एधमानप्रभावायै । एधद्भक्तपातकनाशिन्यै
    । एलामोदमुखायै । एनोऽद्रिशक्रायुधसमस्थित्यै । ईहाशून्यायै । ईप्सितायै । ईशादिसेव्यायै । ईशानवराङ्गनायै
    नमः । ४० ॐ ईश्वराऽऽज्ञापिकायै नमः । ईकारभाव्यायै । ईप्सितफलप्रदायै । ईशानायै । ईतिहरायै । ईक्षायै
    । ईषदरुणाक्ष्यै । ईश्वरेश्वर्यै । ललितायै । ललनारूपायै । लयहीनायै । लसत्तनवे । लयसर्वायै । लयक्षोण्यै
    । लयकर्ण्यै
