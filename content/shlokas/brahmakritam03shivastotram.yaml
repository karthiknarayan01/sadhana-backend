id: brahmakritam03shivastotram
category: stotram
name:
  english: brahmakritam03shivastotram
  devanagari: ब्रह्मकृतं०३शिवस्तोत्रम्
content:
  english: brahmakritam 3 shivastotram brahmovaca | namo rudraya shantaya brahmane paramatmane | tvam
    hi vishvasrijam srashta dhata tvam prapitamahah || 16|| namo rudraya mahate nilakanthaya vedhase |
    vishvaya vishvabijaya jagadanandahetave || 17|| om karastvam vashatkarah sarvarambhapravartakah |
    yajno'si yajnakarmasi yajnanam ca pravartakah || 18|| sarvesham yajnakartrinam tvameva pratipalakah
    | sharanyo'si mahadeva sarvesham praninam prabho | raksha raksha mahadeva putrashokena piditam ||
    19|| iti shriskandapurane maheshvarakhande
  devanagari: ब्रह्मकृतं ३ शिवस्तोत्रम् ब्रह्मोवाच । नमो रुद्राय शान्ताय ब्रह्मणे परमात्मने । त्वं हि
    विश्वसृजां स्रष्टा धाता त्वं प्रपितामहः ॥ १६॥ नमो रुद्राय महते नीलकण्ठाय वेधसे । विश्वाय विश्वबीजाय
    जगदानन्दहेतवे ॥ १७॥ ॐ कारस्त्वं वषट्कारः सर्वारम्भप्रवर्तकः । यज्ञोऽसि यज्ञकर्मासि यज्ञानां च प्रवर्तकः
    ॥ १८॥ सर्वेषां यज्ञकर्तॄणां त्वमेव प्रतिपालकः । शरण्योऽसि महादेव सर्वेषां प्राणिनां प्रभो । रक्ष रक्ष
    महादेव पुत्रशोकेन पीडितम् ॥ १९॥ इति श्रीस्कन्दपुराणे माहेश्वरखण्डे
meaning: {}
