id: draunikritamrudrastotram
category: stotram
name:
  english: draunikritamrudrastotram
  devanagari: द्रौणिकृतंरुद्रस्तोत्रम्
content:
  english: draunikritam rudrastotram drauniruvaca | ugram sthanum shivam rudram sharvamishanamishvaram
    | girisham varadam devam bhavam bhavanamavyayam || 2|| shitikanthamajam shakram kratham kratuharam
    haram | vishvarupam virupaksham bahurupamumapatim || 3|| shmashanavasinam driptam mahaganapatim prabhum
    | khatvangadharinam mundam jatilam brahmacarinam || 4|| manasapyasucintyena dushkarenalpacetasa |
    so'hamatmopaharena yakshye tripuraghatinam || 5|| stutam stutyam stuyamanamamogham carmavasasam |
    vilohitam nilakanthamapriktam durnivaranam || 6|| shukram vishvasrijam brahma brahmacarinameva ca
    | vratavantam taponityamanantam tapatam gatim || 7|| bahurupam ganadhyaksham tryaksham parishadapriyam
    | ganadhyakshekshitamukham gaurihridayavallabham || 8|| kumarapitaram pingam govrishottamavahanam
    | tanuvasasamatyugramumabhushanatatparam || 9|| param parebhyah paramam param yasmanna vidyate | ishvastrottamabhartaram
    digantam caiva dakshinam || 10|| hiranyakavacam devam candramaulivibhushitam | prapadye sharanam devam
    paramena samadhina || 11|| imam capyapadam ghoram taramyadya sudustaram | sarvabhutopaharena yakshye'ham
    shucina shucim || 12|| iti mahabharate sauptikaparvani 7 adhyayantargatam draunikritam rudrastotram
    sampurnam | mahabharata | sauptikaparva | adhyaya 7
  devanagari: द्रौणिकृतं रुद्रस्तोत्रम् द्रौणिरुवाच । उग्रं स्थाणुं शिवं रुद्रं शर्वमीशानमीश्वरम् । गिरिशं
    वरदं देवं भवं भावनमव्ययम् ॥ २॥ शितिकण्ठमजं शक्रं क्रथं क्रतुहरं हरम् । विश्वरूपं विरूपाक्षं बहुरूपमुमापतिम्
    ॥ ३॥ श्मशानवासिनं दृप्तं महागणपतिं प्रभुम् । खट्वाङ्गधारिणं मुण्डं जटिलं ब्रह्मचारिणम् ॥ ४॥ मनसाप्यसुचिन्त्येन
    दुष्करेणाल्पचेतसा । सोऽहमात्मोपहारेण यक्ष्ये त्रिपुरघातिनम् ॥ ५॥ स्तुतं स्तुत्यं स्तूयमानममोघं चर्मवाससम्
    । विलोहितं नीलकण्ठमपृक्तं दुर्निवारणम् ॥ ६॥ शुक्रं विश्वसृजं ब्रह्म ब्रह्मचारिणमेव च । व्रतवन्तं तपोनित्यमनन्तं
    तपतां गतिम् ॥ ७॥ बहुरूपं गणाध्यक्षं त्र्यक्षं पारिषदप्रियम् । गणाध्यक्षेक्षितमुखं गौरीहृदयवल्लभम्
    ॥ ८॥ कुमारपितरं पिङ्गं गोवृषोत्तमवाहनम् । तनुवाससमत्युग्रमुमाभूषणतत्परम् ॥ ९॥ परं परेभ्यः परमं परं
    यस्मान्न विद्यते । इष्वस्त्रोत्तमभर्तारं दिगन्तं चैव दक्षिणम् ॥ १०॥ हिरण्यकवचं देवं चन्द्रमौलिविभूषितम्
    । प्रपद्ये शरणं देवं परमेण समाधिना ॥ ११॥ इमां चाप्यापदं घोरां तराम्यद्य सुदुस्तराम् । सर्वभूतोपहारेण
    यक्ष्येऽहं शुचिना शुचिम् ॥ १२॥ इति महाभारते सौप्तिकपर्वणि ७ अध्यायान्तर्गतं द्रौणिकृतं रुद्रस्तोत्रं
    सम्पूर्णम् । महाभारत । सौप्तिकपर्व । अध्याय ७
