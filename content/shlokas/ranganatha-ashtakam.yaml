id: ranganatha-ashtakam
category: stotram
name:
  english: Ranganatha Ashtakam
content:
  english: anandarupe nijabodharupe brahmasvarupe shrutimurtirupe | shashankarupe ramaniyarupe shrirangarupe
    ramatam mano me || || kaveritire karunavilole mandaramule dhritacarukele | daityantakale'khilalokalile
    shrirangalile ramatam mano me || || lakshminivase jagatam nivase hritpadmavase ravibimbavase | kripanivase
    gunabrindavase shrirangavase ramatam mano me || || brahmadivandye jagadekavandye mukundavandye suranathavandye
    | vyasadivandye sanakadivandye shrirangavandye ramatam mano me || || brahmadhiraje garudadhiraje vaikuntharaje
    surarajaraje | trailokyaraje'khilalokaraje shrirangaraje ramatam mano me || || amoghamudre paripurnanidre
    shriyoganidre sasamudranidre | shritaikabhadre jagadekanidre shrirangabhadre ramatam mano me || ||
    sacitrashayi bhujagendrashayi nandankashayi kamalankashayi | kshirabdhishayi vatapatrashayi shrirangashayi
    ramatam mano me || || idam hi rangam tyajatamihangam punarna cangam yadi cangameti | panau rathangam
    carane'mbu gangam yane vihangam shayane bhujangam || || ranganathashtakam punyam pratarutthaya yah
    pathet | sarvankamanavapnoti rangisayujyamapnuyat || || iti shri ranganathashtakam |
  devanagari: आनन्दरूपे निजबोधरूपे ब्रह्मस्वरूपे श्रुतिमूर्तिरूपे । शशाङ्करूपे रमणीयरूपे श्रीरङ्गरूपे
    रमतां मनो मे ॥ ॥ कावेरितीरे करुणाविलोले मन्दारमूले धृतचारुकेले । दैत्यान्तकालेऽखिललोकलीले श्रीरङ्गलीले
    रमतां मनो मे ॥ ॥ लक्ष्मीनिवासे जगतां निवासे हृत्पद्मवासे रविबिम्बवासे । कृपानिवासे गुणबृन्दवासे श्रीरङ्गवासे
    रमतां मनो मे ॥ ॥ ब्रह्मादिवन्द्ये जगदेकवन्द्ये मुकुन्दवन्द्ये सुरनाथवन्द्ये । व्यासादिवन्द्ये सनकादिवन्द्ये
    श्रीरङ्गवन्द्ये रमतां मनो मे ॥ ॥ ब्रह्माधिराजे गरुडाधिराजे वैकुण्ठराजे सुरराजराजे । त्रैलोक्यराजेऽखिललोकराजे
    श्रीरङ्गराजे रमतां मनो मे ॥ ॥ अमोघमुद्रे परिपूर्णनिद्रे श्रीयोगनिद्रे ससमुद्रनिद्रे । श्रितैकभद्रे
    जगदेकनिद्रे श्रीरङ्गभद्रे रमतां मनो मे ॥ ॥ सचित्रशायी भुजगेन्द्रशायी नन्दाङ्कशायी कमलाङ्कशायी । क्षीराब्धिशायी
    वटपत्रशायी श्रीरङ्गशायी रमतां मनो मे ॥ ॥ इदं हि रङ्गं त्यजतामिहाङ्गं पुनर्न चाङ्गं यदि चाङ्गमेति ।
    पाणौ रथाङ्गं चरणेऽम्बु गाङ्गं याने विहङ्गं शयने भुजङ्गम् ॥ ॥ रङ्गनाथाष्टकं पुण्यं प्रातरुत्थाय यः
    पठेत् । सर्वान्कामानवाप्नोति रङ्गिसायुज्यमाप्नुयात् ॥ ॥ इति श्री रङ्गनाथाष्टकम् ।
