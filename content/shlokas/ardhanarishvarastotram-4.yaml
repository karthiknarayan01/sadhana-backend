id: ardhanarishvarastotram-4
category: stotram
name:
  english: ardhanarishvarastotram 4
  devanagari: अर्धनारीश्वरस्तोत्रम् ४
content:
  english: malinye'pyalikavilocanasya yatra | raktatve karacaranadharasya canyo na'nyonyam samajani nutano
    visheshah || 13|| kanthasya bhramaranibha vibhardhabhagam muktva kim sthitimakarocchiroruhardhe |
    ardham va kanakasadrigrucih kacanam santyajya nyavishata kim galaikadeshe || 14|| sauvarnah karakamale
    yathaiva vame savye'pi dhruvamabhavattathaiva kumbhah | kridaikaprasritamatirvibhurbibharti svacchandyadurasi
    tameva nunamenam || 15|| yatrasijjagadakhilam yugavasane purnatvam yaducitamatra madhyabhage | samrambhadgalitamadastadeva
    nunam vishrantam ghanakathine nitambabimbe || 16|| ityadinpravidadhureva yatra tava
  devanagari: मालिन्येऽप्यलिकविलोचनस्य यत्र । रक्तत्वे करचरणाधरस्य चान्यो नाऽन्योन्यं समजनि नूतनो विशेषः
    ॥ १३॥ कण्ठस्य भ्रमरनिभा विभार्धभागं मुक्त्वा किं स्थितिमकरोच्छिरोरुहार्धे । अर्धं वा कनकसदृग्रुचिः
    कचानां सन्त्यज्य न्यविशत किं गलैकदेशे ॥ १४॥ सौवर्णः करकमले यथैव वामे सव्येऽपि ध्रुवमभवत्तथैव कुम्भः
    । क्रीडैकप्रसृतमतिर्विभुर्बिभर्ति स्वाच्छन्द्यादुरसि तमेव नूनमेनम् ॥ १५॥ यत्रासीज्जगदखिलं युगावसाने
    पूर्णत्वं यदुचितमत्र मध्यभागे । संरम्भाद्गलितमदस्तदेव नूनं विश्रान्तं घनकठिने नितम्बबिम्बे ॥ १६॥ इत्यादीन्प्रविदधुरेव
    यत्र ताव
meaning: {}
