    || 110|| bhangayantrarasananda bhangayantraraseshvari | bhangayantrarasasvada bhangayantrarasasthita
    || 111|| bhangayantrarasadhara bhangayantrarasashraya | bhudharatmajarupeshi bhudharatmajarupini ||
    112|| bhudharatmajayogeshi bhudharatmajapalini | bhudharatmajamahima bhudharatmajamalini || 113||
