id: pranavopanishat-2
category: upanishad
name:
  english: pranavopanishat 2
  devanagari: प्रणवोपनिषत् २
content:
  english: iti | tatheti te deva devayajanasyottarardhe'raih samyatta asamstanonkarenagnidhriya deva asuran
    parabhavayanta | tadyatparabhavayanta tasmadonkarah purvamuccaryate | yo ha va etamonkaram na vedavashyahsyadityatha
    ya evam veda brahmavashah syaditi tasmadonkara rigbhavati yajushi yajuh samni sama sutre sutram brahmane
    brahmanam shloke shlokah pranave pranava iti brahmanam || onkaram pricchamah ko dhatuh kim pratipadikam
    kim namakhyatam kim lingam kim ca vacanam ka vibhaktih kah pratyayah kah svarah upasargo nipatah kim
    vai vyakaranam ko vikarah ko vikari katimatrah kativarnah katyaksharah katipadah kah samyogah kim
    sthananupradanakaranam shikshakah kimuccarayanti kim chandah ko varna iti purve prashnah | athottare
    mantrah | kalpo brahmanam rig yajuh sama | kasmadbrahmavadina onkaramaditah kurvanti | kim daivatam
    kim jyotisham kim niruktam kim sthanam ka prakritih kimadhyatmamiti shattrimshatprashnah purvottaranam
    trayo varga dvadasha ekashataironkaram vyakhyasyamah || indrah prajapatimapricchat bhagavannabhyastuya
    pricchamiti | priccha vatsetyabravit | kimayamonkarah kasya putrah kim caitacchandah kim caitadvarnah
    kim caitadbrahma brahma sampadyate | tasmadvaitamonkaram purvamalobhasvaritodatta ekakshara onkara
    rigvede traisvaryodatta ekakshara onkaro yajurvede dirghaplutodatta ekakshara onkarah samavede hrasvodatta
    ekaksharah ukaro'tharvavede'nudattodattadvipada a u ityardhacatasro matra makare vyanjanamityahuh
    | ya sa prathama matra brahmadaivatya rakta varnena yastam dhyayate nityam sa gacchedbrahmam padam
    | ya sa dvitiya matra vishnudaivatya krishna varnena yastam dhyayate nityam sa gacchedvaishnavam padam
    | ya sa tritiya matra ishanadaivatya kapila varnena yastam dhyayate nityam sa gacchedaishanam padam
    | ya sardhacaturthi matra sarvadaivatya vyaktibhuta svam vicarati shuddhasphatikasannibha varnena
    yastam dhyayate nityam sa gacchet padamanamakam | onkarasyotpattim vipro yo na janati tatpunarupanayanam
    tasmadbrahmanavacanamadartavyam | yatha latavyo gotro brahmanah | putro gayatram chandah shuklo varnah
    | pumso vatso rudro devata | onkaro vedanam uttaropanishadam vyakhyasyamah | ko dhaturityapterdhaturavatimapyeke
    | rupasamanyadyarthasamanyanyanyadiyastasmadaperonkarah sarvamapnotityarthah | kridantamarthavatpratipadikamadarshanam
    pratyayasya nama sampadyate | nipateshu cainam vaiyyakarana ukshattam samamananti | tadavyayibhutamanvarthavaci
    shabdo na vyeti kadacaneti | sadrisham trishu lingeshu sarvasu ca vibhaktishu | vacaneshu ca sarveshu
    yanna vyeti tadavyayam || ko vikari cyavate prakaranamapnotirakarapakarau vikaryau aditah okaro vikriyate
    | dvitiyo makara evam dvivarna ekakshara omityonkaro nirvrittah | katimatra ityadestisro matrah abhyadhane
    hi plavate | makarashcaturthi kim sthanamityubhavoshthau sthanamadhanakarani ca dvihsthanam sandhyaksharamavarnaleshah
    kanthyo yathoktasheshah purvo vivrittakaranasthitashca dvitiyah sprishtakaranasthitashca | nayam yoge
    vidyuta akhyatopasarganudattah svaritalingavibhaktivacanani ca sancchinnadhyayina acaryah purve babhubuh
    | shravanadevam pratipadyante | na karanam prayacchantyathaparapakshiyanam kavih pancalacandah paripricchako
    babhuvambuh prithagudgithadoshan bhavanto bruvantviti | tadvacyupalakshayet varnaksharapadankasho
    vibhaktyamrishinishevitamiti vacam stuvanti | tasmat karanam brumo varnanamayamidam bhavishyatiti
    shadangavidastattayadhimahi | kim chanda iti | gayatram hi chando gayatri devanamekakshara shvetavarna
    ca vyakhyata | dvau dvadashakau vargavetadvai vyakaranam dhatvarthavacanam shaiksham chando vacanam
    cathottarau dvau dvadashakau vargau vedarahasiki
  devanagari: इति । तथेति ते देवा देवयजनस्योत्तरार्धेऽरैः संयत्ता आसंस्तानोङ्कारेणाग्नीध्रीया देवा असुरान्
    पराभावयन्त । तद्यत्पराभावयन्त तस्मादोङ्कारः पूर्वमुच्चार्यते । यो ह वा एतमोङ्कारं न वेदावश्यःस्यादित्यथ
    य एवं वेद ब्रह्मवशः स्यादिति तस्मादोङ्कार ऋग्भवति यजुषि यजुः साम्नि साम सूत्रे सूत्रं ब्राह्मणे ब्राह्मणं
    श्लोके श्लोकः प्रणवे प्रणव इति ब्राह्मणम् ॥ ओङ्कारं पृच्छामः को धातुः किं प्रातिपदिकं किं नामाख्यातं
    किं लिङ्गं किं च वचनं का विभक्तिः कः प्रत्ययः कः स्वरः उपसर्गो निपातः किं वै व्याकरणं को विकारः को
    विकारी कतिमात्रः कतिवर्णः कत्यक्षरः कतिपदः कः संयोगः किं स्थानानुप्रदानकरणं शिक्षकाः किमुच्चारयन्ति
    किं छन्दः को वर्ण इति पूर्वे प्रश्नाः । अथोत्तरे मन्त्राः । कल्पो ब्राह्मणं ऋग् यजुः साम । कस्माद्ब्रह्मवादिन
    ओङ्कारमादितः कुर्वन्ति । किं दैवतं किं ज्योतिषं किं निरुक्तं किं स्थानं का प्रकृतिः किमध्यात्ममिति
    षट्त्रिंशत्प्रश्नाः पूर्वोत्तराणां त्रयो वर्गा द्वादश एकाशतैरोङ्कारं व्याख्यास्यामः ॥ इन्द्रः प्रजापतिमपृच्छत्
    भगवन्नभ्यस्तूय पृच्छामीति । पृच्छ वत्सेत्यब्रवीत् । किमयमोङ्कारः कस्य पुत्रः किं चैतच्छन्दः किं चैतद्वर्णः
    किं चैतद्ब्रह्मा ब्रह्म सम्पद्यते । तस्माद्वैतमोङ्कारं पूर्वमालोभस्वरितोदात्त एकाक्षर ओङ्कार ऋग्वेदे
    त्रैस्वर्योदात्त एकाक्षर ओङ्कारो यजुर्वेदे दीर्घप्लुतोदात्त एकाक्षर ओङ्कारः सामवेदे ह्रस्वोदात्त एकाक्षरः
    उकारोऽथर्ववेदेऽनुदात्तोदात्तद्विपद अ उ इत्यर्धचतस्रो मात्रा मकारे व्यञ्जनमित्याहुः । या सा प्रथमा
    मात्रा ब्रह्मदैवत्या रक्ता वर्णेन यस्तां ध्यायते नित्यं स गच्छेद्ब्राह्मं पदम् । या सा द्वितीया मात्रा
    विष्णुदैवत्या कृष्णा वर्णेन यस्तां ध्यायते नित्यं स गच्छेद्वैष्णवं पदम् । या सा तृतीया मात्रा ईशानदैवत्या
    कपिला वर्णेन यस्तां ध्यायते नित्यं स गच्छेदैशानं पदम् । या सार्धचतुर्थी मात्रा सर्वदैवत्या व्यक्तीभूता
    स्वं विचरति शुद्धस्फटिकसन्निभा वर्णेन यस्तां ध्यायते नित्यं स गच्छेत् पदमनामकम् । ओङ्कारस्योत्पत्तिं
    विप्रो यो न जानाति तत्पुनरुपनयनं तस्माद्ब्राह्मणवचनमादर्तव्यम् । यथा लातव्यो गोत्रो ब्राह्मणः । पुत्रो
    गायत्रं छन्दः शुक्लो वर्णः । पुंसो वत्सो रुद्रो देवता । ओङ्कारो वेदानां उत्तरोपनिषदं व्याख्यास्यामः
    । को धातुरित्याप्तेर्धातुरवतिमप्येके । रूपसामान्याद्यर्थसामान्यान्यन्यदीयस्तस्मादापेरोङ्कारः सर्वमाप्नोतीत्यर्थः
    । कृदन्तमर्थवत्प्रातिपदिकमदर्शनं प्रत्ययस्य नाम सम्पद्यते । निपातेषु चैनं वैय्याकरणा उक्षत्तं समामनन्ति
    । तदव्ययीभूतमन्वर्थवाची शब्दो न व्येति कदाचनेति । सदृशं त्रिषु लिङ्गेषु सर्वासु च विभक्तिषु । वचनेषु
    च सर्वेषु यन्न व्येति तदव्ययम् ॥ को विकारी च्यवते प्रकारणमाप्नोतिराकारपकारौ विकार्यौ आदितः ओकारो विक्रियते
    । द्वितीयो मकार एवं द्विवर्ण एकाक्षर ओमित्योङ्कारो निर्वृत्तः । कतिमात्र इत्यादेस्तिस्रो मात्राः अभ्याधाने
    हि प्लवते । मकारश्चतुर्थी किं स्थानमित्युभावोष्ठौ स्थानमाधानकरणी च द्विःस्थानं सन्ध्यक्षरमवर्णलेशः
    कण्ठ्यो यथोक्तशेषः पूर्वो विवृत्तकरणस्थितश्च द्वितीयः स्पृष्टकरणस्थितश्च । नायं योगे विद्युत आख्यातोपसर्गानुदात्तः
    स्वरितलिङ्गविभक्तिवचनानि च सञ्च्छिन्नाध्यायिन आचार्याः पूर्वे बभूबुः । श्रवणादेवं प्रतिपद्यन्ते ।
    न कारणं प्रयच्छन्त्यथापरपक्षीयाणां कविः पञ्चालचण्डः परिपृच्छको बभूवांबुः पृथगुद्गीथदोषान् भवन्तो ब्रुवन्त्विति
    । तद्वाच्युपलक्षयेत् वर्णाक्षरपदाङ्कशो विभक्त्यामृषिनिषेवितामिति वाचं स्तुवन्ति । तस्मात् कारणं ब्रूमो
    वर्णानामयमिदं भविष्यतीति षडङ्गविदस्तत्तयाधीमहि । किं छन्द इति । गायत्रं हि छन्दो गायत्री देवानामेकाक्षरा
    श्वेतवर्णा च व्याख्याता । द्वौ द्वादशकौ वर्गावेतद्वै व्याकरणं धात्वर्थवचनं शैक्षं छन्दो वचनं चाथोत्तरौ
    द्वौ द्वादशकौ वर्गौ वेदरहसिकी
