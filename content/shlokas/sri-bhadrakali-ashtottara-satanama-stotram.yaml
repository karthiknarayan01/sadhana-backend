id: sri-bhadrakali-ashtottara-satanama-stotram
category: stotram
name:
  english: Sri Bhadrakali Ashtottara Satanama Stotram
content:
  english: shrinandikeshvara uvaca bhadrakalimaham vande virabhadrasatim shivam | sutamrarcitapadabjam
    sukhasaubhagyadayinim || || atha stotram bhadrakali kamarupa mahavidya yashasvini | mahashraya mahabhaga
    dakshayagavibhedini || || rudrakopasamudbhuta bhadra mudra shivankari | candrika candravadana roshatamrakshashobhini
    || || indradidamani shanta candralekhavibhushita | bhaktartiharini mukta candikanandadayini || ||
    saudamini sudhamurtih divyalankarabhushita | suvasini sunasa ca trikalajna dhurandhara || || sarvajna
    sarvalokeshi devayonirayonija | nirguna nirahankara lokakalyanakarini || || sarvalokapriya gauri sarvagarvavimardini
    | tejovati mahamata kotisuryasamaprabha || || virabhadrakritanandabhogini virasevita | naradadimunistutya
    nitya satya tapasvini || || jnanarupa kalatita bhaktabhishtaphalaprada | kailasanilaya shubhra kshama
    shrih sarvamangala || || siddhavidya mahashaktih kamini padmalocana | devapriya daityahantri dakshagarvapaharini
    || || shivashasanakartri ca shaivanandavidhayini | bhavapashanihantri ca savanangasukarini || || lambodari
    mahakali bhishanasya sureshvari | mahanidra yoganidra prajna varta kriyavati || || putrapautraprada
    sadhvi senayuddhasukankshini | iccha shambhoh kripasindhuh candi candaparakrama || || shobha bhagavati
    maya durga nila manogatih | khecari khadgini cakrahasta shulavidharini || || subana shaktihasta ca
    padasancarini para | tapahsiddhiprada devi virabhadrasahayini || || dhanadhanyakari vishva manomalinyaharini
    | sunakshatrodbhavakari vamshavriddhipradayini || || brahmadisurasamsevya shankari priyabhashini |
    bhutapretapishacadiharini sumanasvini || || punyakshetrakritavasa pratyakshaparameshvari | evam namnam
    bhadrakalyah shatamashtottaram viduh || || punyam yasho dirghamayuh putrapautram dhanam bahu | dadati
    devi tasyashu yah pathet stotramuttamam || || bhaumavare bhrigau caiva paurnamasyam visheshatah |
    pratah snatva nityakarma vidhaya ca subhaktiman || || virabhadralaye bhadram sampujya surasevitam
    | pathet stotramidam divyam nana bhogapradam shubham || || abhishtasiddhim prapnoti shighram vidvan
    parantapa | athava svagrihe virabhadrapatnim samarcayet || || stotrenanena vidhivat sarvan kamanavapnuyat
    | roga nashyanti tasyashu yogasiddhim ca vindati || || sanatkumarabhaktanamidam stotram prabodhaya
    | rahasyam sarabhutam ca sarvajnah sambhavishyasi || || iti shribhadrakalyashtottarashatanama stotram
    |
  devanagari: श्रीनन्दिकेश्वर उवाच भद्रकालीमहं वन्दे वीरभद्रसतीं शिवाम् । सुताम्रार्चितपादाब्जं सुखसौभाग्यदायिनीम्
    ॥ ॥ अथ स्तोत्रम् भद्रकाली कामरूपा महाविद्या यशस्विनी । महाश्रया महाभागा दक्षयागविभेदिनी ॥ ॥ रुद्रकोपसमुद्भूता
    भद्रा मुद्रा शिवङ्करी । चन्द्रिका चन्द्रवदना रोषताम्राक्षशोभिनी ॥ ॥ इन्द्रादिदमनी शान्ता चन्द्रलेखाविभूषिता
    । भक्तार्तिहारिणी मुक्ता चण्डिकानन्ददायिनी ॥ ॥ सौदामिनी सुधामूर्तिः दिव्यालङ्कारभूषिता । सुवासिनी
    सुनासा च त्रिकालज्ञा धुरन्धरा ॥ ॥ सर्वज्ञा सर्वलोकेशी देवयोनिरयोनिजा । निर्गुणा निरहङ्कारा लोककल्याणकारिणी
    ॥ ॥ सर्वलोकप्रिया गौरी सर्वगर्वविमर्दिनी । तेजोवती महामाता कोटिसूर्यसमप्रभा ॥ ॥ वीरभद्रकृतानन्दभोगिनी
    वीरसेविता । नारदादिमुनिस्तुत्या नित्या सत्या तपस्विनी ॥ ॥ ज्ञानरूपा कलातीता भक्ताभीष्टफलप्रदा । कैलासनिलया
    शुभ्रा क्षमा श्रीः सर्वमङ्गला ॥ ॥ सिद्धविद्या महाशक्तिः कामिनी पद्मलोचना । देवप्रिया दैत्यहन्त्री
    दक्षगर्वापहारिणी ॥ ॥ शिवशासनकर्त्री च शैवानन्दविधायिनी । भवपाशनिहन्त्री च सवनाङ्गसुकारिणी ॥ ॥ लम्बोदरी
    महाकाली भीषणास्या सुरेश्वरी । महानिद्रा योगनिद्रा प्रज्ञा वार्ता क्रियावती ॥ ॥ पुत्रपौत्रप्रदा साध्वी
    सेनायुद्धसुकाङ्क्षिणी । इच्छा शम्भोः कृपासिन्धुः चण्डी चण्डपराक्रमा ॥ ॥ शोभा भगवती माया दुर्गा नीला
    मनोगतिः । खेचरी खड्गिनी चक्रहस्ता शूलविधारिणी ॥ ॥ सुबाणा शक्तिहस्ता च पादसञ्चारिणी परा । तपःसिद्धिप्रदा
    देवी वीरभद्रसहायिनी ॥ ॥ धनधान्यकरी विश्वा मनोमालिन्यहारिणी । सुनक्षत्रोद्भवकरी वंशवृद्धिप्रदायिनी
    ॥ ॥ ब्रह्मादिसुरसंसेव्या शाङ्करी प्रियभाषिणी । भूतप्रेतपिशाचादिहारिणी सुमनस्विनी ॥ ॥ पुण्यक्षेत्रकृतावासा
    प्रत्यक्षपरमेश्वरी । एवं नाम्नां भद्रकाल्याः शतमष्टोत्तरं विदुः ॥ ॥ पुण्यं यशो दीर्घमायुः पुत्रपौत्रं
    धनं बहु । ददाति देवी तस्याशु यः पठेत् स्तोत्रमुत्तमम् ॥ ॥ भौमवारे भृगौ चैव पौर्णमास्यां विशेषतः ।
    प्रातः स्नात्वा नित्यकर्म विधाय च सुभक्तिमान् ॥ ॥ वीरभद्रालये भद्रां सम्पूज्य सुरसेविताम् । पठेत्
    स्तोत्रमिदं दिव्यं नाना भोगप्रदं शुभम् ॥ ॥ अभीष्टसिद्धिं प्राप्नोति शीघ्रं विद्वान् परन्तप । अथवा
    स्वगृहे वीरभद्रपत्नीं समर्चयेत् ॥ ॥ स्तोत्रेणानेन विधिवत् सर्वान् कामानवाप्नुयात् । रोगा नश्यन्ति
    तस्याशु योगसिद्धिं च विन्दति ॥ ॥ सनत्कुमारभक्तानामिदं स्तोत्रं प्रबोधय । रहस्यं सारभूतं च सर्वज्ञः
    सम्भविष्यसि ॥ ॥ इति श्रीभद्रकाल्यष्टोत्तरशतनाम स्तोत्रम् ।
