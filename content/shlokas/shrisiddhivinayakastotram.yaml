name:
  english: shrisiddhivinayakastotram
  devanagari: श्रीसिद्धिविनायकस्तोत्रम्
content:
  english: shanmasaih siddhimapnoti na bhavedanritam vacah ganeshacaranau natva brute bhakto divakarah
  devanagari: षण्मासैः सिद्धिमाप्नोति न भवेदनृतं वचः गणेशचरणौ नत्वा ब्रूते भक्तो दिवाकरः
