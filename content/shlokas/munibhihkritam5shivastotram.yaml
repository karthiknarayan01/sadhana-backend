id: munibhihkritam5shivastotram
category: stotram
name:
  english: munibhihkritam5shivastotram
  devanagari: मुनिभिःकृतं५शिवस्तोत्रम्
content:
  english: brahmadinam ca devanam durvijneyani te hara | agatim te na janimo gatim naiva ca naiva ca ||
    35|| vishveshvara mahadeva yo'si so'si namo'stu te | stuvanti tvam mahatmano devadevam maheshvaram
    || 36|| namo bhavaya bhavyaya bhavanayodbhavaya ca | anantabalaviryaya bhutanam pataye namah || 37||
    samhartre ca pishangaya avyayaya vyayaya ca | gangasaliladharaya adharaya gunatmane || 38|| tryambakaya
    trinetraya trishulavaradharine | kandarpaya hutashaya namo'stu paramatmane || 39|| shankaraya vrishankaya
    gananam pataye namah | dandahastaya kalaya pashahastaya vai namah || 40|| vedamantrapradhanaya shatajihvaya
    vai namah | bhutam bhavyam bhavishyam ca sthavaram jangamam ca yat || 41|| tava dehatsamutpannam deva
    sarvamidam jagat | pasi hamsi ca bhadram te prasida bhagavamstatah || 42|| ajnanadyadi vijnanadyatkincitkurute
    narah | tatsarvam bhagavaneva kurute yogamayaya || 43|| evam stutva tu munayah prahrishtairantaratmabhih
    | yacanta tapasa yuktah pashyamastvam yathapura || 44|| iti shrilingamahapurane purvabhage ekatrimshadhyayantargatam
    munibhih kritam shivastotram samaptam | lingapurana | purvabhaga | adhyaya 31
  devanagari: ब्रह्मादीनां च देवानां दुर्विज्ञेयानि ते हर । अगतिं ते न जानीमो गतिं नैव च नैव च ॥ ३५॥ विश्वेश्वर
    महादेव योऽसि सोऽसि नमोऽस्तु ते । स्तुवन्ति त्वां महात्मानो देवदेवं महेश्वरम् ॥ ३६॥ नमो भवाय भव्याय
    भावनायोद्भवाय च । अनन्तबलवीर्याय भूतानां पतये नमः ॥ ३७॥ संहर्त्रे च पिशङ्गाय अव्ययाय व्ययाय च । गङ्गासलिलधाराय
    आधाराय गुणात्मने ॥ ३८॥ त्र्यम्बकाय त्रिनेत्राय त्रिशूलवरधारिणे । कन्दर्पाय हुताशाय नमोऽस्तु परमात्मने
    ॥ ३९॥ शङ्कराय वृषाङ्काय गणानां पतये नमः । दण्डहस्ताय कालाय पाशहस्ताय वै नमः ॥ ४०॥ वेदमन्त्रप्रधानाय
    शतजिह्वाय वै नमः । भूतं भव्यं भविष्यं च स्थावरं जङ्गमं च यत् ॥ ४१॥ तव देहात्समुत्पन्नं देव सर्वमिदं
    जगत् । पासि हंसि च भद्रं ते प्रसीद भगवंस्ततः ॥ ४२॥ अज्ञानाद्यदि विज्ञानाद्यत्किञ्चित्कुरुते नरः ।
    तत्सर्वं भगवानेव कुरुते योगमायया ॥ ४३॥ एवं स्तुत्वा तु मुनयः प्रहृष्टैरन्तरात्मभिः । याचन्त तपसा युक्ताः
    पश्यामस्त्वां यथापुरा ॥ ४४॥ इति श्रीलिङ्गमहापुराणे पूर्वभागे एकत्रिंशाध्यायान्तर्गतं मुनिभिः कृतं
    शिवस्तोत्रं समाप्तम् । लिङ्गपुराण । पूर्वभाग । अध्याय ३१
