    gunah || 28|| gunadhisho gunalayo gunavikshanalalasah | gunagauravadata ca gunadata gunapradah ||
    29|| gunakridgunasambandho gunabhridgunabandhanah | gunahridyo gunasthayi gunadayi gunotkatah || 30||
