id: gangasahasranamastotrambrihaddharma-2
category: sahasranama
name:
  english: gangasahasranamastotrambrihaddharma
  devanagari: गन्गासहस्रनामस्तोत्रम्ब्रिहद्धर्म
content:
  english: tara tarasvaradhya ca tarini tararupini | ananta cadirahita madhyashunyasvarupini || 65|| nakshatramalini
    kshina nakshatrasthalavasini | tarunadityasankasha matangi mrityuvarjita || 66|| amaramarasamsevya
    upasya shaktirupini | dhumakaragnisambhuta dhuma dhumavati ratih || 67|| kamakhya kamarupa ca kashi
    kashipurasthita | varanasi varayoshit kashinathashirahsthita || 68|| ayodhya mathura maya kashi kanci
    hyavantika | dvaraka jvaladagnishca kevala kevalatvada || 69|| karavirapurastha ca kaveri kavari shiva
    | rakshini ca karalakshi kankala shankarapriya || 70|| jvalamukhi kshirini ca kshiragramanivasini
    | rakshakari dirghakarna sudantadantavarjita || 71|| daityadanavasamhantri dushtahantri balipriya
    | balimamsapriya shyama vyaghracarmapidhayini || 72|| javakusumasankasha sattviki rajasi tatha | tamasi
    taruni vriddha yuvati balika tatha || 73|| yaksharajasuta jambumalini jambuvasini | jambunadavibhusha
    ca jvalajambunadaprabha || 74|| rudrani rudradehastha rudra rudrakshadharini | anushca paramanushca
    hrasva dirgha cakorini || 75|| rudragita vishnugita mahakavyasvarupini | adikavyasvarupa ca mahabharatarupini
    || 76|| ashtadashapuranastha dharmamata ca dharmini | mata manya svasa caiva shvashrushcaiva pitamahi
    || 77|| gurushca gurupatni ca kalasarpabhayaprada | pitamahasuta sita shivasimantini shiva || 78||
    rukmini rukmavarna ca bhaishmi bhaimi surrupini | svarupini satyabhama mahalakshmi bhadra jambavati
    mahi || 79|| nanda bhadramukhi rikta jaya vijayada jaya | jayitri purnima purna purnacandranibhanana
    || 80|| gurupurna saumyabhadra vishtih samveshakarini | shanirikta kujajaya siddhida siddhirupini
    || 81|| amrita'mritarupa ca shrimati ca jalamrita || 82|| niratanka niralamba nishprapanca visheshini
    | nishedhashesharupa ca varishtha yoshitamvara || 83|| yashasvini kirtimati mahashailagravasini |
    dhara dharitri dharani sindhurbandhuh sabandhava || 84|| sampattih sampadisha ca vipattiparimocini
    | janmapravahaharani janmashunya niranjani || 85|| nagalayalaya nila jatamandaladharini | sutarangajatajuta
    jatadharashirahsthita || 86|| pattambaradhara dhira kavih kavyarasapriya | punyakshetra papahara harini
    harini harih || 87|| haridranagarastha ca vaidyanathapriya balih | vakreshvari vakradhara vakreshvarapurahsthita
    || 88|| shvetaganga shitala ca ushmodakamayi rucih | ushnodakamayi colarajapriyakari candramandalavarttini
    || 89|| adityamandalagata sadaditya ca kashyapi | dahanakshi bhayahara vishajvalanivarini || 90||
    hara dashahara snehadayini kalushashanih | kapalamalini kali kala kalasvarupini || 91|| indrani varuni
    vani balaka balashankari | gorgirhrirdharmarupa ca dhih shrirdhanya dhananjaya || 92|| vit samvit
    kuh kuveri bhurbhutirbhumidharadhara | ishvari hrimati krida kridasaya jayaprada || 93|| jivanti jivani
    jiva jayakara jayeshvari | sarvopadravasamshunya sarvapapavivarjita || 94|| savitri caiva gayatri
    ganeshi ganavandita | dushpreksha dushpravesha ca durdarsha ca suyogini || 95|| duhkhahantri duhkhahara
    durdanta yamadevata | grihadevi bhumidevi vaneshi vanadevata || 96|| guhalaya ghorarupa mahaghoranitambini
    | grihalaya stricancala carumukhi carunetra layatmika || 97|| kantih kamya nirguna ca rajahsattvatamomayi
    | kantikamya kalaratrirmaharatrirjivarupa sanatani || 98|| sukhaduhkhadibhoktri ca sukhaduhkhadivarjita
    | mahavrijinasamhara vrijinadhvantamocani || 99|| halini khalahantri ca varunipanakarini | papakarini
    nidrayogya mahanidra yoganidra yugeshvari || 100|| uddharayitri svarganga uddharanapurahsthita | uddhrita
    uddhritahara lokoddharanakarini || 101|| shankhini shankhadhatri ca shankhavadanakarini | shankhadhari
    shankheshvari shankhahasta shankharajavidarini || 102|| pashcimasya mahasrota purvadakshinavahini
    | sardhayojanavistirna pavanyuttaravahini || 103|| patitoddharini doshakshamini doshavarjita | sharanya
    sharana shreshtha shriyuta shraddhadevata || 104|| svaha svadha svarupakshi surupakshi shubhanana
    | virupakshi kaumudi kumudakara kumudambarabhushana || 105|| saumya bhavani bhutistha bhimarupa varanana
    | varahakarna barhishtha brihacchroni balahaka || 106||
  devanagari: तारा तारस्वराढ्या च तारिणी ताररूपिणी । अनन्ता चादिरहिता मध्यशून्यास्वरूपिणी ॥ ६५॥ नक्षत्रमालिनी
    क्षीणा नक्षत्रस्थलवासिनी । तरुणादित्यसङ्काशा मातङ्गी मृत्युवर्जिता ॥ ६६॥ अमरामरसंसेव्या उपास्या शक्तिरूपिणी
    । धूमाकाराग्निसम्भूता धूमा धूमावती रतिः ॥ ६७॥ कामाख्या कामरूपा च काशी काशीपुरस्थिता । वाराणसी वारयोषित्
    काशीनाथशिरःस्थिता ॥ ६८॥ अयोध्या मथुरा माया काशी काञ्ची ह्यवन्तिका । द्वारका ज्वलदग्निश्च केवला केवलत्वदा
    ॥ ६९॥ करवीरपुरस्था च कावेरी कवरी शिवा । रक्षिणी च करालाक्षी कङ्काला शङ्करप्रिया ॥ ७०॥ ज्वालामुखी क्षीरिणी
    च क्षीरग्रामनिवासिनी । रक्षाकरी दीर्घकर्णा सुदन्तादन्तवर्जिता ॥ ७१॥ दैत्यदानवसंहन्त्री दुष्टहन्त्री
    बलिप्रिया । बलिमांसप्रिया श्यामा व्याघ्रचर्मापिधायिनी ॥ ७२॥ जवाकुसुमसङ्काशा सात्त्विकी राजसी तथा ।
    तामसी तरुणी वृद्धा युवती बालिका तथा ॥ ७३॥ यक्षराजसुता जाम्बुमालिनी जम्बुवासिनी । जाम्बूनदविभूषा च
    ज्वलजाम्बूनदप्रभा ॥ ७४॥ रुद्राणी रुद्रदेहस्था रुद्रा रुद्राक्षधारिणी । अणुश्च परमाणुश्च ह्रस्वा दीर्घा
    चकोरिणी ॥ ७५॥ रुद्रगीता विष्णुगीता महाकाव्यस्वरूपिणी । आदिकाव्यस्वरूपा च महाभारतरूपिणी ॥ ७६॥ अष्टादशपुराणस्था
    धर्ममाता च धर्मिणी । माता मान्या स्वसा चैव श्वश्रूश्चैव पितामही ॥ ७७॥ गुरुश्च गुरुपत्नी च कालसर्पभयप्रदा
    । पितामहसुता सीता शिवसीमन्तिनी शिवा ॥ ७८॥ रुक्मिणी रुक्मवर्णा च भैष्मी भैमी सुर्रूपिणी । स्वरूपिणी
    सत्यभामा महालक्ष्मी भद्रा जाम्बवती मही ॥ ७९॥ नन्दा भद्रमुखी रिक्ता जया विजयदा जया । जयित्री पूर्णिमा
    पूर्णा पूर्णचन्द्रनिभानना ॥ ८०॥ गुरुपूर्णा सौम्यभद्रा विष्टिः संवेशकारिणी । शनिरिक्ता कुजजया सिद्धिदा
    सिद्धिरूपिणी ॥ ८१॥ अमृताऽमृतरूपा च श्रीमती च जलामृता ॥ ८२॥ निरातङ्का निरालम्बा निष्प्रपञ्चा विशेषिणी
    । निषेधशेषरूपा च वरिष्ठा योषितांवरा ॥ ८३॥ यशस्विनी कीर्तिमती महाशैलाग्रवासिनी । धरा धरित्री धरणी सिन्धुर्बन्धुः
    सबान्धवा ॥ ८४॥ सम्पत्तिः सम्पदीशा च विपत्तिपरिमोचिनी । जन्मप्रवाहहरणी जन्मशून्या निरञ्जनी ॥ ८५॥ नागालयालया
    नीला जटामण्डलधारिणी । सुतरङ्गजटाजूटा जटाधरशिरःस्थिता ॥ ८६॥ पट्टाम्बरधरा धीरा कविः काव्यरसप्रिया ।
    पुण्यक्षेत्रा पापहरा हरिणी हारिणी हरिः ॥ ८७॥ हरिद्रानगरस्था च वैद्यनाथप्रिया बलिः । वक्रेश्वरी वक्रधारा
    वक्रेश्वरपुरःस्थिता ॥ ८८॥ श्वेतगङ्गा शीतला च उष्मोदकमयी रुचिः । उष्णोदकमयी चोलराजप्रियकरी चन्द्रमण्डलवर्त्तिनी
    ॥ ८९॥ आदित्यमण्डलगता सदादित्या च काश्यपी । दहनाक्षी भयहरा विषज्वालानिवारिणी ॥ ९०॥ हरा दशहरा स्नेहदायिनी
    कलुषाशनिः । कपालमालिनी काली कला कालस्वरूपिणी ॥ ९१॥ इन्द्राणी वारुणि वाणी बलाका बालशङ्करी । गोर्गीर्ह्रीर्धर्मरूपा
    च धीः श्रीर्धन्या धनञ्जया ॥ ९२॥ वित् संवित् कुः कुवेरी भूर्भूतिर्भूमिधराधरा । ईश्वरी ह्रीमती क्रीडा
    क्रीडासाया जयप्रदा ॥ ९३॥ जीवन्ती जीवनी जीवा जयाकारा जयेश्वरी । सर्वोपद्रवसंशून्या सर्वपापविवर्जिता
    ॥ ९४॥ सावित्री चैव गायत्री गणेशी गणवन्दिता । दुष्प्रेक्षा दुष्प्रवेशा च दुर्दर्शा च सुयोगिणी ॥ ९५॥
    दुःखहन्त्री दुःखहरा दुर्दान्ता यमदेवता । गृहदेवी भूमिदेवी वनेशी वनदेवता ॥ ९६॥ गुहालया घोररूपा महाघोरनितम्बिनी
    । गृहालया स्त्रीचञ्चला चारुमुखी चारुनेत्रा लयात्मिका ॥ ९७॥ कान्तिः काम्या निर्गुणा च रजःसत्त्वतमोमयी
    । कान्तिकाम्या कालरात्रिर्महारात्रिर्जीवरूपा सनातनी ॥ ९८॥ सुखदुःखादिभोक्त्री च सुखदुःखादिवर्जिता ।
    महावृजिनसंहारा वृजिनध्वान्तमोचनी ॥ ९९॥ हलिनी खलहन्त्री च वारुणीपानकारिणी । पापकारिणी निद्रायोग्या
    महानिद्रा योगनिद्रा युगेश्वरी ॥ १००॥ उद्धारयित्री स्वर्गङ्गा उद्धारणपुरःस्थिता । उद्धृता उद्धृताहारा
    लोकोद्धारणकारिणी ॥ १०१॥ शङ्खिनी शङ्खधात्री च शङ्खवादनकारिणी । शङ्खधारी शङ्खेश्वरी शङ्खहस्ता शङ्खराजविदारिणी
    ॥ १०२॥ पश्चिमास्या महास्रोता पूर्वदक्षिणवाहिनी । सार्धयोजनविस्तीर्णा पावन्युत्तरवाहिनी ॥ १०३॥ पतितोद्धारिणी
    दोषक्षमिणी दोषवर्जिता । शरण्या शरणा श्रेष्ठा श्रीयुता श्राद्धदेवता ॥ १०४॥ स्वाहा स्वधा स्वरूपाक्षी
    सुरूपाक्षी शुभानना । विरूपाक्षी कौमुदी कुमुदाकारा कुमुदाम्बरभूषणा ॥ १०५॥ सौम्या भवानी भूतिस्था भीमरूपा
    वरानना । वराहकर्णा बर्हिष्ठा बृहच्छ्रोणी बलाहका ॥ १०६॥
