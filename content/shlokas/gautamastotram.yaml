id: gautamastotram
category: stotram
name:
  english: gautamastotram
  devanagari: गौतमस्तोत्रम्
content:
  english: hastaya shrirangesha namo'stu te || 8|| brahmeshvaraya brahmaya brahmamurtibrihaspate | brihaspativide
    tubhyam shrirangesha namo'stu te || 9|| shivaya shivarupaya shivatranaparaya ca | shivadharaya shantaya
    shrirangesha namo'stu te || 10|| sarveshvaraya sarvaya sarvashastrasvarupine | sarvaradhyaya medhyaya
    shrirangesha namo'stu te || 11|| abjaukadyamareshaya saccidanandarupine | cinmatrarupine nityam shrirangesha
    namo'ste te || 12|| sarvam shariram bhavatah shariri tvam ramapate | ato'tra bhinnah sarvasmat shrirangesha
    namo'stu te || 13|| iti stuto jagannatho gautama ranganayakah | stotrenettham kriteneha yah stoshyati
    sada narah | yam yam kamayate kamam tam tamapnotyasamshayah || 14|| iti gautamastotram sampurnam |
  devanagari: हस्ताय श्रीरङ्गेश नमोऽस्तु ते ॥ ८॥ ब्रह्मेश्वराय ब्रह्माय ब्रह्ममूर्तिबृहस्पते । बृहस्पतिविदे
    तुभ्यं श्रीरङ्गेश नमोऽस्तु ते ॥ ९॥ शिवाय शिवरूपाय शिवत्राणपराय च । शिवाधाराय शान्ताय श्रीरङ्गेश नमोऽस्तु
    ते ॥ १०॥ सर्वेश्वराय सर्वाय सर्वशास्त्रस्वरूपिणे । सर्वाराध्याय मेध्याय श्रीरङ्गेश नमोऽस्तु ते ॥ ११॥
    अब्जौकाद्यमरेशाय सच्चिदानन्दरूपिणे । चिन्मात्ररूपिणे नित्यं श्रीरङ्गेश नमोऽस्ते ते ॥ १२॥ सर्वं शरीरं
    भवतः शरीरी त्वं रमापते । अतोऽत्र भिन्नः सर्वस्मात् श्रीरङ्गेश नमोऽस्तु ते ॥ १३॥ इति स्तुतो जगन्नाथो
    गौतम रङ्गनायकः । स्तोत्रेणेत्थं कृतेनेह यः स्तोष्यति सदा नरः । यं यं कामयते कामं तं तमाप्नोत्यसंशयः
    ॥ १४॥ इति गौतमस्तोत्रं सम्पूर्णम् ।
