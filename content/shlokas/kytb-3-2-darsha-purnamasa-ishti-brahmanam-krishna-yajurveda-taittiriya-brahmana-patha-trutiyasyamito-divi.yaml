id: kytb-3-2-darsha-purnamasa-ishti-brahmanam-krishna-yajurveda-taittiriya-brahmana-patha-trutiyasyamito-divi
category: stotram
name:
  english: KYTB 3.2 Darsha Purnamasa Ishti Brahmanam - Krishna Yajurveda Taittiriya Brahmana Patha - Trutiyasyamito
    Divi
content:
  english: krishna yajurvediya taittiriya brahmane tritiyashtake dvitiyah prapathakah dashapurnamaseshtibrahmanam
    o shri gurubhyo namah | harih om || anuvakam vathsapakaranam tritiyasyamito divi soma asit | ta ngayatryaharat
    | tasya parnamacchidyata | ta tparnasya parnatvam | brahma vai parnah | ya tparnashakhaya vathsanapakaroti
    | brahmanaivainanapakaroti || gayatro vai parnah | gayatrah pashavah || ttrinitrini parnasya palashani
    | tripada gayatri | ya tparnashakhaya gah prarpayati | svayaivaina devataya prarpayati | ya ssyaditi
    | aparna gramaharet | apashureva bhavati | ya thsyaditi | bahuparna ntasmai bahushakhamaharet | pashumanta
    mabhijayet | yadudici mmanushyalokam | pracimudicimaharati | ubhayo rabhijityai || ishe tvorje tvetyaha
    | ishamevorjam ya~jamane dadhati || vayava ssthetyaha | vayurva antariksha syaddhyakshah | antarikshadevatyah
    npari dadati | pra va enanetada karoti | yadaha | vayava ssthetyupayavah sthetyaha | yajamanayaiva
    pashunupahvayate || devo vah savita prarpayatvityaha prasu tyai || shreshthatamaya karmana ityaha
    | yajno hi shreshthatama nkarma | tasmadevamaha || apyayaddhvamaghniya devabhagamityaha || || vathsebhyashca
    va etah pura manushye shcapyayanta | devebhya evaina indrayapyayayati || urjasvatih payasvatirityaha
    | urjagm hi payah sambharanti || prajavati ranamiva ayakshma ityaha praja tyai | mavah stena ishata
    ma 'ghashagmsa ityaha guptyai || rudrasya hetih pari vo vrinaktvityaha | rudra devaina strayate ||
    dhruva asmi ngopatau syata bahvirityaha | dhruva evasmi npahityaha | pashuna ngopithaya | tasma mpashava
    upa samavartante || anadha ssadayati | garbhana ndhritya aprapadaya | tasmadgarbhah prajanamaprapadukah
    | upariva nidadhati | upariva hi suvargo lokah | suvargasya lokasya samashtyai || hiraharanam devasya
    tva savituh prasava ityashvaparshumadatte prasu rbahubhyamityaha | ashvinau hi devanamaddhvaryu asta
    bhyamityaha yatyai || yo va oshadhih parvasho veda | naina ssa hinasti | prajapatirva oshadhih parvasho
    veda | sa ena na hinasti | ashvapar shva barhiracchaiti | prajapatyo va ashvah sayonitvaya || || oshadhinamahigmsayai
    || yajnasya ghoshadasityaha | yajamana eva rayi ndadhati | pratyushtagm rakshah pratyushta arataya
    ityaha | rakshasa mapahatyai || preyamagaddhishana barhiracchetyaha | vidya vai dhishana | vidyayaivainadacchaiti
    || manuna krita svadhaya vitashtetyaha | manavi hi par || ta avahanti kavayah purastadityaha | shushruvagmso
    vai kavayah | yajnah purasta t | mukhata eva yajnamarabhate | atho yadetaduktva yatah kutashcaharati
    | ta tpracya eva disho bhavati || devebhyo jushtamiha barhirasada ityaha | barhisha ssamriddhyai |
    karmano mparishutamasityaha || mparishutam | atho yatha vasyase prati procyaheda nkarishyamiti | evameva
    tadaddhvaryu rdevebhyah prati procya barhirdati | atmano npari dishet | yattesha mucchiggshyat | ati
    ta dyajnasya recayet | ekagg stamba mparidishet | tagm sarva || yajnasyanatirekaya || varshavriddha
    masityaha | varsha vriddha va oshadhayah || deva bar hirityaha | devebhya evaina 'nvamma tiryagityaha
    higmsayai | parva te raddhyasamitya || acchetta te ma rishamityaha | nasyatmano miyate | ya evam vi~rohetyaha
    | praja vai barhih | prajana mprajananaya || sahasraval sha vi vayagm ruhemetyaha | ashishamevaitamasha
    ssaprincah pahityaha pratishthityai || ayungayunga nmushtin ~lunoti | mithunatvaya praja tva sambharamityaha
    | brahmanaivainath va~ aditih | asya evaina nkaroti || indranyai sanamhanamityaha | indrani va agre
    devatanagm samanahyata | sa ''rdhno t | riddhyai sannahyati | praja vai barhih | prajanamaparavapaya
    | tasma thsnavasantatah praja jayante || ngrathnatvityaha | pushtimeva yajamane dadhati || sa te ma
    '' sthadityahahigmsayai || pashca tprancamupaguhati | pashca dvai pracinagm reto dhiyate | pashcadevasmai
    pracinagm reto dadhati || indrasya tva bahubhya mudyaccha ityaha | indriyameva yajamane dadhati ||
    brihaspate rmurdhna haramityaha | brahma vai devana || brahmanaivainaddharati || urvantariksha manvihityaha
    gatyai || devagammamasityaha | devanevainadgamayati || anadha ssadayati | garbhana ndhritya aprapadaya
    | tasma prajanamaprapadukah | upariva nidadhati | upariva hi suvargo lokah | suvargasya lokasya samashtyai
    || dohanam purvedyuriddhma barhih karoti | yajnamevarabhya grihitvopavasati || prajapati ryajnamasrijata
    | tasyokhe asragmsetam | yajno vai prajapatih | ya nnayyokhe bhavatah | yajnasyaiva tadukhe upadadhatya
    prasragmsaya || shundhaddhva ndaivyaya karmane devayajyaya ityaha | devayajyaya evainani shundhati
    || matarishvano gharmo vai~ matarishvano gharmah | esham vi~dhrityai || dyaurasi prithivyasityaha
    | divashca hyesha prithivyashca sambhrita | yadukha | tasmadevamaha || vishvadhaya asi paramena dhamnetyaha
    | vrishtirvai vishvadhayah | vrishtimevavarundhe | drigmhasva ma hvarityaha dhrityai mpavitramasityaha
    | prana vai vasavah | tesham tkaroti || shatadharagm sahasradharamityaha | praneshvevayu rdadhati
    sarvatvaya || trivri mbhavati | trivridvai pranah | trivritameva prana mmaddhyato yajamane dadhati
    || ssayonitvaya | saksha ndarbhah | prakhsayamadhi nidadhati | ta tpranapanayo rupam | tiryakpratah
    | ta shasya rupam | dar mpranah | ubhayamevopaityajamitvaya || || tasmadayagm sarvatah pavate || huta
    sstoko huto draphsa ityaha pratishthityai | havisho 'skandaya | na hi hutagg svahakritagg skandati
    | divi nako namagnih | tasya viprusho bhagadheya m | agnaye brihate nakayetyaha | nakamevagni mbhagadheyena
    samardhayati | svaha dyavaprithivibhyamityaha | dyavaprithivyorevainat || pavitravatyanayati | apa
    nca rasagm sagmsrijati | atho oshadhishveva pashu npratishthapayati || anvarabhya vacam ya~cchati
    | yajnasya dhrityai | dharayannaste | dharayanta iva hi duhanti | kamadhuksha ityahatritiyasyai |
    traya ime lokah | imaneva lokan || amumiti nama grihnati | bhadramevasa nkarmavishkaroti || sa vishvayu
    ssa vishvakarmetyaha | iyam vai~ vishvayuh | antariksham vi~shvavyacah | asau vishvakarma | imanevaitabhirlokan
    pradatre punyamashaste | evamevaina etadupastauti | tasmat pradadityunniya vandamana upastuvantah
    pashu || bahu dugdhindraya devebhyo haviriti vacam vi~srijate | yatha devatameva prasauti | daivyasya
    ca manushasya ca vyavrittyai | triraha | trishatya hi devah | avacam rabhyottarah | aparimitamevavarundhe
    || na darupatrena duhyat | agnivadvai darupatram | ya ddarupatrena duhyat || mna havisha yajeta |
    atho khalvahuh | purodashamukhani vai havigmshi | neta itah purodashagm havisho yamo 'stiti | kamameva
    darupatrena duhyat || shudra eva na duhyat | asato va esha sambhutah | yacchudrah | ahavireva tadityahuh
    | yacchudro dogdhiti || || agnihotramevana duhyacchudrah | taddhi not punanti | yada khalu vai pavitramatyeti
    | atha taddhaviriti || sampricyaddhva mritavarirityaha | apa nca rasagm sagmsrijati | tasmadapa nca
    rasamupa jivamah | mandra dhanasya sataya ityaha | pushtimeva yajamane dadhati || somena tva ''tanacmindraya
    dadhityaha || tkaroti | yo vai soma nna pibati | punarbhakshyo 'sya somapitho bhavati || somah khalu
    vai sa mpibati | apunarbhakshyo 'sya somapitho bhavati | na mrinmayenapidaddhyat | ya nmrinmayenapidaddhyat
    | pitridevatyagg syat || || ayaspatrena va darupatrena va 'pidadhati | taddhi sadevam || udanvad bhavati
    | apo vai rakshoghnih | rakshasa mapahatyai || adastamasi vishnave tvetyaha | yajno vai vishnuh |
    yajnayaivainadadasta nkaroti | vishno havyagm rakshasvetyaha guptyai ssadayati | garbhana ndhritya
    aprapadaya | tasma prajanama prapadukah | upariva nidadhati | upariva hi suvargo lokah | suvargasya
    lokasya samashtyai || havirnirvapah karmane va ndevebhyah shakeyamityaha shaktyai | yajnasya vai santatimanu
    prajah pashavo yajamanasya santayante | yajnasya vicchittimanu prajah pashavo yajamanasya vicchidyante
    | yajnasya santatirasi yajnasya tva santatyai strinami santatyai tva yajnasyetyahavaniya thsantanoti
    | yajamanasya prajayai pashunagm santatyai || apah pranayati | shraddha va apah | shraddhamevarabhya
    praniya pracarati | apah pranayati | yajno va apah || || yajnamevarabhya praniya pracarati | apah
    pranayati | vajro va apah | vajrameva bhratrivyebhyah prahritya praniya pracarati | apah pranayati
    | apo vai rakshoghnih | rakshasa mapahatyai | apah pranayati | apo vai devana ndhama | devanameva
    priya ndhama praniya pracarati || || apah pranayati | apo vai sarva devatah | devata evarabhya praniya
    pracarati || veshaya tvetyaha | veshaya hyenadadatte || pratyushtagm rakshah pratyushta arataya ityaha
    | rakshasa mapahatyai || dhurasityaha | esha vai dhuryo ya~danupasprishyatiyat || nca pradahet | upasprishyatyeti
    | addhvaryoshca yajamanasya capradahaya || dhurva tam ndhurvama ityaha | dvau vava purushau | ya ncaiva
    dhurvati | yashcaina ndhurvati | tavubhau shuca ndevanamasi sasnitama ndevahutamamityaha | yatha yajurevai
    tat || || ahrutamasi havirdhana rtyai | drigmhasva ma hvarityaha dhrityai || mitrasya tva cakshusha
    preksha ityaha mitratvaya | ma bherma sam vi~ktha ma tva higmsisha mityahahigmsayai | yadvai ki nca
    vato nabhivati | ta m || uru vatayetyaha | avarunamevaina tkaroti || devasya tva savituh prasava ityaha
    prasu rbahubhyamityaha || || ashvinau hi devanamaddhvaryu asta bhyamityaha yatyai nnirvapamityaha
    | agnaya evainanjushtam nirvapati | triryajusha | traya ime lokah | esham ncaturtham | aparimitamevavarundhe
    | sa evamevanupurvagm havigmshi nirvapati || ssahetyaha vyavrittyai || sphatyai tva nara tya ityaha
    guptyai 'ntashcarati | yah parinahi || suvarabhi vikhyesham njyotirityaha | suvarevabhi vi pashyati
    vaishvanara njyotih | dyavaprithivi havishi grihita udavepetam || drigmhanta ndurya dyavaprithivyorityaha
    | grihana manvihityaha gatyai || adityastvopasthe sadayamityaha | iyam va~ aditih | asya evainadupasthe
    sadayati || agne havyagm rakshasvetyaha guptyai dhama praniya pracara havigmshi nirvapati vrihyavaghatah
    indro vritramahann | so 'pah | abhyamriyata | tasam ya~jniyagm sadevamasi t | tadapodakramat | te
    darbha abhavann | ya ddarbhairapa utpunati | ya eva meddhya yajniya ssadeva apah | tabhirevaina utpunati
    | dvabhyamutpunati || dyajamanah pratishthityai || devo vah savitot punatvityaha | savitriprasuta
    evaina utpunati | acchidrena pavitrenetyaha | asau va adityo m | tenaivaina utpunati | vaso ssuryasya
    rashmibhirityaha | prana va apah | prana vasavah | prana rashmayah || || pranaireva pranan thsamprinakti
    | savitriyarca | savitriprasuta mme karmasaditi | savitriprasutamevasya karma bhavati | paccho gayatriya
    trishshamriddhatvaya || apo deviragrepuvo agreguva ityaha | rupa vya~cashte | agra imam nnayatagre
    yajnapatimityaha | agra eva yajna nnayanti | agre yajnapatim || || yushmanindro 'vrinita vritratuye
    yuyamindramavriniddhvam vri~traturya ityaha | vritragm ha hanishyannindra apo vavre | apo hendram
    vya~cashte || prokshita ssthetyaha | tenapah prokshitah || agnaye vo jushta mityaha | yatha devatamevaina
    nprokshati | trih prokshati | tryavriddhi yajnah || || atho rakshasamapahatyai | shundhaddhvam daivyaya
    karmane devayajyaya ityaha | devayajyaya evainani shundhati | trih prokshati | tryavriddhi yajnah
    | atho meddhyatvaya | avadhutagm raksho 'vadhuta arataya ityaha | rakshasa mapahatyai | adityastvagasityaha
    | iyam nkaroti | prati tva prithivi vettvityaha pratishthityai || purasta muttaralomopastrinati meddhyatvaya
    | tasma tpratyancah pashavo medhamupatishthante | tasma ngrahukah | yajno devebhyo nilayata | krishno
    rupa tkrishnajine haviraddhyavahanti | yajnadeva mprayunkte | havisho || adhishavanamasi vanaspatyamityaha
    | adhishavana tkaroti | prati tva 'dityastvagvettvityaha sayatvaya || agnestanu rasityaha | agnerva
    esha tanuh | yadoshadhayah | vaco visarjanamityaha | yada hi praja oshadhina mashnanti | atha vacam
    vi~srijante | devavitaye tva grihnamityaha || thsamardhayati || adrirasi vanaspatya ityaha | gravana
    ndevebhyo havyagm sushami shamishvetyaha shantyai || havishkridehityaha | ya eva devanagm havishkritah
    | tan hvayati | trishatya hi devah || ishama vadorjama vadetyaha || ya~jamane dadhati | dyumadvadata
    vayagm saghanta njeshmetyaha bhratrivyabhibhutyai || mano shshraddhadevasya yajamanasyasuraghni vak
    | yajnayudheshu pravishta 'sura yavanto yajnayudhanamudvadata mupashrinvann | te para 'vasaya yajeta
    | yavanto 'sya bhratrivya yajnayudhana mupashrinvanti | te para bhavanti | uccai ssamahantava aha
    vijityai || || vrinkta eshamindriyam mbhavati || varsha vriddhamasi prati tva varshavriddham ve~ttvityaha
    | varshavriddha va oshadhayah | varshavriddha ishika ssamriddhyai | yajnagm rakshagsyanu pravishann
    | tanyasna pashubhyo niravadayanta | tushairoshadhibhyah || paraputagm rakshah paraputa arataya ityaha
    | rakshasamapahatyai || 'sityaha | tushaireva rakshagmsi niravadayate | apa upasprishati meddhyatvaya
    | vayurvo vi vinaktvityaha | pavitram vai~ vayuh | punatyevainan | antarikshadiva va ete praskandanti
    | ye shurpa t | devo vah savita hiranyapanih pratigrihnatvityaha pratishthityai | havisho 'skandaya
    | trishphalikartava aha | tryavriddhi yajnah | atho meddhyatvaya || nayantyagre yajnapatim askandaya
    trini ca tandulapeshanam avadhutagm raksho 'vadhuta arataya ityaha | rakshasamapahatyai | adityastvagasityaha
    | iyam va~ aditih | asya evaina nkaroti | prati tva prithivi vettvityaha pratishthityai | purasta
    muttaralomopastrinati meddhyatvaya | tasma tpratyancah pashavo medhamupatishthante | tasma ngrahukah
    | yajno devebhyo nilayata || tkrishnajine haviradhipinashti | yajnadeva ta mprayunkte | havisho 'skandaya
    || dyavaprithivi sahasta m | te shamyamatramekamaharvyaitagm shamyamatramekamahah || diva sskambhanirasi
    prati tva 'dityastvagvettvityaha | dyavaprithivyo 'si parvatya prati tva diva sskambhanirvettvityaha
    | dyavaprithivyo 'si parvateyi prati tva parvatirvettvityaha | dyavaprithivyordhrityai || devasya
    tva savituh prasava ityaha prasu rbahubhyamityaha | ashvinau hi devanamaddhvaryu asta bhyamityaha
    yatyai | adhivapamityaha | yathadevata mevainanadhi vapati || dhanyamasi dhinuhi devanityaha | etasya
    yajusho viryena || || yavadeka devata kamayate yavadeka | tavadahutih prathate | na hi tadasti | yattavadeva
    syat | yavajjuhoti || pranaya tva 'panaya tvetyaha | prananeva yajamane dadhati | dirghamanu prasitimayushe
    dhamityaha | ayurevasmi ndadhati | antarikshadiva va etani praskandanti | yani drishadah | devo vah
    savita hiranyapanih prati grihnatvityaha pratishthityai | havisho va~panti pigmshanuni kurutadityaha
    meddhyatvaya || skandanti catvari ca kapalopadhanam dhrishtirasi brahma yacchetyaha dhrityai njahi
    nishkravyadagm sedha devayajam va~hetyaha | ya evamatkravyat | tamapahatya | meddhye 'gnau kapalamupadadhati
    || nirdagdhagm raksho nirdagdha arataya ityaha | rakshagsyeva nirdahati | agnivatyupadadhati | asminneva
    loke jyotirdhatte | angaramadhi || antariksha eva jyotirdhatte | adityamevamushmin ~loke jyotirdhatte
    | jyotishmanto 'sma ime loka bhavanti | ya evam ve~da || dhruvamasi prithivi ndrigmhetyaha | prithivimevaitena
    drigmhati | dhartramasyantariksha ndrigmhetyaha | antarikshamevaitena drigmhati | dharunamasi diva
    ndrigmhetyaha | divamevaitena drigmhati || || dharmasi disho drigmhetyaha | disha evaitena drigmhati
    | imanevaitai ndrigmhati | drigm hante 'sma ime lokah prajaya pashubhih | ya evam ve~da || trinyagre
    kapalanyupadadhati | traya ime lokah | esham | ekamagre kapalamupadadhati | ekam || atha dve | atha
    trini | atha catvari | athashtau | tasmadashtakapala mpurushasya shirah | yadeva nyupa dadhati | yajno
    vai prajapatih | yajnameva prajapatigm sagg skaroti | atmanameva ta skaroti | tagm sagg || amushmin
    ~loke 'nuparaiti || yadashtavupa dadhati | gayatriya ta thsammitam | yannava | trivrita tat | ya ddasha
    | viraja tat | yadekadasha | trishtubha tat | yaddvadasha || || jagatya tat | chandah sammitani sa
    upadadha tkapalani | iman ~lokananupurva ndisho vidhrityai drigmhati | athayuh prana yajamane dadhati
    | sajatanasma abhito bahulan karoti || cita ssthetyaha | yatha yajurevaitat || bhrigunamangirasa ntapasa
    tapyaddhvamityaha | devatana mevainani tapasa tapati | tani tata sthite | yani gharme kapala n yupacinvanti
    vedhasa iti catushpadayarca vimuncati | catushpadah pashavah | pashushvevoparishta divamevaitena drigmhati
    purodashanishpadanam devasya tva savituh prasava ityaha prasu rbahubhyamityaha | ashvinau hi devanamaddhvaryu
    asta bhyamityaha yatyai va~pamityaha | yatha devatamevainani sam va~pati || samapo adbhiragmata samoshadhayo
    rasenetyaha | apo va oshadhi rjinvanti | oshadhayo 'po jinvanti | anya va etasamanya jinvanti || ||
    tasmadevamaha | sagm revati ssrijyaddhvamityaha | apo vai revatih | pashavo jagatih | oshadhayo madhumatih
    | apa oshadhih pashun | tanevasma ekadha sagmsrijya | madhumatah karoti | adbhyah pari prajata sstha
    samadbhih pricyaddhvamiti paryaplavayati | yatha suvrishta imamanu visritya || || apa oshadhirmahayanti
    | tadrigeva tat || janayatyai tva sam yau~mityaha | praja evaitena dadhara | agnaye bhyamityaha vyavrittyai
    | makhasya shiro 'sityaha | yajno vai makhah | tasyaitacchirah | ya tpurodashah | tasmadevamaha ||
    'si vishvayurityaha | vishvamevayu ryajamane dadhati | uru prathasvoru te yajnapatih prathatamityaha
    | yajamanameva prajaya pashubhih prathayati | tvaca ngrihnishvetyaha | sarvamevainagm satanu nkaroti
    | athapa aniya pari mar shti | magmsa eva ta nchannam || gharmo va esho 'rdhamase pravrijyate | ya
    shvaro yajamanagm shuca pradahah | paryagni karoti | pashumevainamakah | shantya apradahaya | trih
    paryagni karoti | tryavriddhi yajnah | atho rakshasamapahatyai || antaritagm raksho 'ntarita arataya
    ityaha || hityai | purodasham va~ adhishritagm rakshagsyajighagmsann | divi nako namagni rakshoha
    | sa evasma drakshagsyapahann | devastva savita shrapayatvityaha | savitriprasuta evainagg shrapayati
    | var shishthe adhi naka ityaha | rakshasamapahatyai | agniste tanuva 'ti dhagityahanatidahaya | agne
    havyagm rakshasvetyaha guptyai vi~srijate | yajnameva havig vyahritya pratanute | purorucamavidahaya
    shrityai karoti || mastishko vai purodashah | tam t | avirmastishkah syat | abhivasayati | tasma dguha
    mastishkah | bhasmana nmagmsenasthi channam || || vedenabhi vasayati | tasma shshirah channam | akhalatibhavuko
    bhavati | ya evam ve~da || pashorvai pratima purodashah | sa nayajushka mabhivasyah | vritheva syat
    | ishvara yajamanasya pashavah prametoh || sa mbrahmana pricyasvetyaha | prana vai brahma || || pranah
    pashavah | pranaireva pashunth samprinakti | na pramayuka bhavanti | yajamano vai purodashah | praja
    pashavah purisham | yadevamabhi vasayati | yajamanameva prajaya pashubhi ssamardhayati || deva vai
    havi 'bruvann | kasminnida mmrakshyamaha iti | so ssannidhaddhvam | aham njanayishyami | yasmi nmrakshyaddhva
    iti | te deva agnau tanu nnyadadhata | tasmadahuh | agni ssarva devata iti | so 'ngarenapah | abhyapatayat
    | tata ekato 'jayata | sa dvitiyamabhyapatayat || 'jayanta | tadapyanamapyatvam | yadatmabhyo 'jayanta
    | tadatmyana matmyatvam || te deva apyeshvamrijata | apya amrijata surya ssuryabhinimrukte || || suryabhinimruktah
    kunakhini | kunakhi shyavadati | shyavadannagradidhishau | agradidhishuh parivitte | parivitto virahani
    | viraha brahmahani | tadbrahmahana nnatyacyavata | antarvedi ninayatyavaruddhyai | ulmukenabhi grihnati
    shritatvaya | shritakama iva hi devah || ddvitiyamabhyapataya thsuryabhinimrukte vedikaranam devasya
    tva savituh prasava iti sphyamadatte prasu rbahubhyamityaha | ashvinau hi devanamaddhvaryu asta bhyamityaha
    yatyai || adada indrasya bahurasi dakshina ityaha | indriyameva yajamane dadhati | sahasrabhrishti
    shshatateja ityaha | rupamevasyaita vya~cashte || vayurasi tigmateja ityaha | tejo vai vayuh || ndadhati
    || vishadvai namasura asit | so 'bibhet | yajnena ma deva abhibhavishyantiti | sa prithivimabhyavamit
    | sa 'meddhya 'bhavat | atho yadindro vritramahann | tasya lohita mprithivimanu vyadhavat | sa 'meddhya
    'bhavat | prithivi devayajanityaha || nkaroti | oshaddhyaste mula mma higmsishamityaha | oshadhina
    ngaccha gosthanamityaha | chandagmsi vai vrajo gosthanah | chandagsyevasmai shatu te dyaurityaha |
    vrishtirvai dyauh | vrishtimevavarundhe || badhana deva savitah paramasya || dvau vava purushau |
    ya ncaiva dveshti | yashcaina ndveshti | tavubhau baddhnati paramasya mparavati shatena pashaih ndvishmastamato
    ma maugityahanimruktyai || ararurvai namasura asit | sa prithivyamupamlupto 'raruh prithivya iti prithivya
    apa ghnann | bhratrivyo va araruh | apahato 'raruh prithivya iti yadaha || || bhratrivyameva prithivya
    apahanti | te va~ ayamitah patishyatiti | tamararuste diva mma skaniti divah paryabadhanta | bhratrivyo
    va araruh | araruste diva mma skaniti yadaha | bhratrivyameva divah paribadhate | stamba yajur harati
    | prithivya eva bhratrivya mapahanti | dvitiyagm harati || || antarikshadevaina mapahanti | tritiyagm
    harati | diva evaina ncaturthagm harati | aparimitadevaina mapahanti || asuranam va~ iyamagra asit
    | yavadasinah para pashyati | tava m | te deva abruvann | astveva no || kyanno dasyatheti | yavathsvaya
    mparigrihnitheti | te vasavastveti dakshinatah paryagrihnann | rudrastveti pashcat | aditya stvetyuttaratah
    | te rdakshina | rudraih pratyancah | adityairudancah | yasyaivam 'sya bhratrivyo bhavati || devasya
    savitu ssava ityaha prasu tyai | karma krinvanti vedhasa ityaha | ishitagm hi karma kriyate | prithivyai
    meddhya nca vyudakramatam | pracina ndakshina 'meddhyam | pracimudici nkaroti | meddhyamevaina ||
    prancau vedyagm savunnayati | ahavaniyasya parigrihityai | pratici shroni hapatyasya parigrihityai
    | atho mithunatvaya | uddhanti | yadevasya ameddhyam | tadapahanti | uddhanti | tasmadoshadhayah parabhavanti
    || nchinatti | bhratrivyasyaiva mula tpipate | yaddhastena chindyat | kunakhinih ssyuh | sphyena chinatti
    | vajro vai sphyah | vajrenaiva yajna drakshagsyapahanti | pitridevatya 'tikhata | iyati || prajapatina
    yajnamukhena sammitam || vedirdevebhyo nilayata | ta ncaturangule 'nvavindann | tasma nkhanati | caturangule
    hyoshadhayah pratitishthanti | apratishthayai khanati | yajamanameva pratishtha ngamayati | dakshinato
    var nkaroti | devayajanasyaiva rupamakah || nkaroti | praja vai pashavah purisham | prajayaivaina
    mpashubhih purishavanta mparigrihnati | etavati vai prithivi | yavati vedih | tasya etavata eva bhratrivya
    nnirbhajya | atmana uttara mparigrihnati | rita masyritashrirasityaha | yatha yajurevai tat || ||
    kruramiva va eta nkaroti | dha asi svadha asiti yoyupyate shantyai | urvi casi vasvi casityaha | urvimevainam
    nkaroti | pura krurasya visripo viraphshinnityaha meddhyatvaya | udadaya prithivi njiradanuryamairaya
    ncandramasi svadhabhirityaha | yadevasya ameddhyam | tadapahatya | meddhya || yadadashcandramasi meddhya
    m | tadasyamerayati | ta ndhiraso anudrishya yajanta ityahanukhyatyai || prokshanirasadaya | iddhmabarhi
    nca srucashca sammriddhi | patnigm sannahya | ajyenodehityahanupurvatayai | prokshanirasadayati |
    apo vai rakshoghnih || || rakshasamapahatyai | sphyasya vartman thsadayati | yajnasya santatyai |
    uvaca hasito daivalah | etavatirva amushmin ~loka apa asann | yavatih prokshaniriti | tasma | sphyamudasyann
    | ya ndhyayet | shucaivaina ssadanam vajro vai sphyah | yadanvanca kshanvita | purasta ndharayati
    | vajro vai sphyah | vajrenaiva yajnasya dakshinato rakshagsyapahanti | agnibhya mpracashca praticashca
    | sphyenodicashca dharacashca | sphyena va esha vajrenasyai papmana || yathopadhaya vrishcantyavam
    | hastavava nenikte | atmanameva pavayate | sphya mprakshalayati meddhyatvaya | atho papmana eva bhratrivyasya
    nyanga nchinatti || iddhma rupasadayati yuktyai | yajnasya mithunatvaya | atho purorucamevaita ndadhati
    | uttarasya karmano 'nukhyatyai | na purasta tpratyagupasadayet || t | anyatrahutipathadiddhma mpratipadayet
    | praja vai barhih | aparaddhnuya mprajananam | pashcat pragupasadayati | ahutipatheneddhma mpratipadayati
    | saprantyeva barhisha mprajananamupaiti | dakshinamiddhmam | uttara mbarahih | atma va iddhmah |
    praja barhih | praja hya tmana uttaratara tirthe | tato medhamupaniya | yatha devatamevainat pratishthapayati
    | pratitishthati prajaya pashubhi mindro vritramahan r devasyetyaha sam devasya sphyamadade vajro
    vai sphyo dasha yadadashcandramasi meddhya || harih om || || krishna yajurvediya taittiriya brahmane
    tritiyashtake dvitiyah prapathaka
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय ब्राह्मणे तृतीयाष्टके द्वितीयः प्रपाठकः दशपूर्णमासेष्टिब्राह्मणम्
