    ॐ स्यमन्तकमणेर्हर्त्रे नमः । ॐ नरनारायणात्मकाय नमः । ॐ कुब्जाकृष्टाम्बरधराय नमः । ॐ मायिने नमः । ॐ
    परमपूरुषाय नमः । ॐ मुष्टिकासुरचाणूरमल्लयुद्धविशारदाय नमः । ॐ संसारवैरिणे नमः । ॐ कंसारये नमः । ॐ मुरारये
    नमः । ७० ॐ नरकान्तकाय नमः । ॐ अनादिब्रह्मचारिणे नमः । ॐ कृष्णाव्यसनकर्षकाय नमः । ॐ शिशुपालशिरश्छेत्रे
    नमः । ॐ दुर्योधनकुलान्तकाय नमः । ॐ विदुराक्रूरवरदाय नमः । ॐ विश्वरूपप्रदर्शकाय नमः । ॐ सत्यवाचे नमः
    । ॐ सत्यसङ्कल्पाय नमः । ॐ सत्यभामारताय नमः । ८० ॐ जयिने नमः । ॐ सुभद्रापूर्वजाय नमः । ॐ जिष्णवे नमः
    । ॐ भीष्ममुक्तिप्रदायकाय नमः । ॐ जगद्गुरवे नमः । ॐ जगन्नाथाय नमः । ॐ वेणुनादविशारदाय नमः । ॐ वृषभासुरविध्वंसिने
    नमः । ॐ बाणासुरकरान्तकाय नमः । बाणासुरबलान्तकाय
