id: pitambarisahasranamastotra
category: stotram
name:
  english: pitambarisahasranamastotra
  devanagari: पीताम्बरीसहस्रनामस्तोत्र
content:
  english: rinu tankathayami te || 14|| jagadvidhvamsinindevimajaramarakarinim | tannamami mahamayamahadaishcaryadayinim
    || 15|| pranavampurvamuddhritya sthiramayantato vadet | bagalamukhi sarveti dushtanavacameva ca ||
    16|| mukhampadam stambhayeti jihvankilaya buddhimat | vinashayeti taranca sthiramayantato vadet ||
    17|| vahnipriyantato mantrashcaturvargaphalapradah | brahmastrambrahmavidya ca brahmamata sanatani
    || 18|| brahmeshi brahmakaivalyabagala brahmacarini | nityananda nityasiddha nityarupa niramaya ||
    19|| sandharini mahamaya katakshakshemakarini | kamala vimala nila ratnakantigunashrita || 20|| kamapriya
    kamarata kamakamasvarupini | mangala vijaya jaya sarvamangalakarini || 21|| kamini kaminikamya kamuka
    kamacarini | kamapriya kamarata kamakamasvarupini || 22|| kamakhya kamabijastha kamapithanivasini
    | kamada kamaha kali kapali ca karalika || 23|| kamsarih kamala kama kailaseshvaravallabha | katyayani
    keshava ca karuna kamakelibhuk || 24|| kriyakirttih krittika ca kashika mathura shiva | kalakshi kalika
    kali dhavalananasundari || 25|| khecari ca khamurttishca kshudra kshudrakshudhavara | khadgahasta
    khadgarata khadgini kharparapriya || 26|| ganga gauri gamini ca gita gotravivarddhini | godhara gokara
    godha gandharvapuravasini || 27|| gandharva gandharvakala gopani garudasana | govindabhava govinda
    gandhari gandhamadini || 28|| gaurangi gopikamurttirgopigoshthanivasini | gandha gajendragamanya gadadharapriya
    graha || 29|| ghoraghora ghorarupa ghanashroni ghanaprabha | daityendraprabala ghantavadini ghoranissvana
    || 30|| dakinyuma upendra ca urvashi uragasana | uttama unnata unna uttamasthanavasini || 31|| camunda
    mundita candi candadarpahareti ca | ugracanda candacanda candadaityavinashini || 32|| candarupa pracanda
    ca candacandasharirini | caturbhuja pracanda ca caracaranivasini || 33|| kshatraprayashshirovaha chala
    chalatara chali | kshatrarupa kshatradhara kshatriyakshayakarini || 34|| jaya ca jayadurga ca jayanti
    jayada para | jayini jayini jyotsna jatadharapriya jita || 35|| jitendriya jitakrodha jayamana janeshvari
    | jitamrityurjaratita jahnavi janakatmaja || 36|| jhankara jhanjhari jhanta jhankari jhakashobhini
    | jhakha jhamesha jhankari yonikalyanadayini || 37|| jhanjhara jhamuri jhara jharajharatara para |
    jhanjha jhameta jhankari jhanakalyanadayini || 38|| imana manasi cintya imuna shankarapriya | tankari
    titika tika tankini ca tavargaga || 39|| tapa topa tatapatishtamani tamanapriya | thakaradharini thika
    thankari thikarapriya || 40|| thekathasa thakarati thamini thamanapriya | daraha dakini dara damara
    damarapriya || 41|| dakhini dadayukta ca damarukaravallabha | dhakka dhakki dhakkanada dholashabdaprabodhini
    || 42|| dhamini dhamanaprita dhagatantraprakashini | anekarupini amba animasiddhidayini || 43|| amantrini
    anukari anumadbhanusamsthita | tara tantravati tantratattvarupa tapasvini || 44|| tarangini tattvapara
    tantrika tantravigraha | taporupa tattvadatri tapahpritipradharshini || 45|| tantra yantrarccanapara
    talatalanivasini | talpada tvalpada kamya sthira sthiratara sthitih || 46|| sthanupriya sthapara sthita
    sthanapradayini | digambara dayarupa davagni damanidama || 47|| durga durgapara devi dushtadaityavinashini
    | damanapramada daityadayadanaparayana || 48|| durgartinashini danta dambhini dambhavarjita | digambarapriya
    dambha daityadambhavidarini || 49|| damana dashanasaundarya danavendravinashini | daya dhara ca damani
    darbhapatravilasini || 50|| dharini dharini dhatri dharadharadharapriya | dharadharasuta devi sudharma
    dharmacarini || 51|| dharmajna dhavala dhula dhanada dhanavarddhini | dhira dhira dhiratara dhirasiddhipradayini
    || 52|| dhanvantaridharadhira dhyeya dhyanasvarupini | narayani narasimhi nityanandanarottama || 53||
    nakta naktavati nitya nilajimutasannibha | nilangi nilavastra ca nilaparvatavasini || 54|| sunilapushpakhacita
    nilajambusamaprabha | nityakhya shodashi vidya nitya nityasukhavaha || 55|| narmada nandanananda nandanandavivarddhini
    | yashodanandatanaya nandanodyanavasini || 56|| nagantaka nagavriddha nagapatni ca nagini | namitasheshajanata
    namaskaravati namah || 57|| pitambara parvati ca pitambaravibhushita | pitamilyambaradhara pitabha
    pingamurddhaja || 58|| pitapushparccanarata pitapushpasamarccita | paraprabha pitripatih parasainyavinashini
    || 59|| parama paratantra ca paramantra paratpara | paravidya parasiddhih parasthanapradayini || 60||
    pushpa pushpavati nitya pushpamalavibhushita | puratana purvapara parasiddhipradayini || 61|| pitanitambini
    pita pinonnatapayastani | premapramadhyamashesha padmapatravilasini || 62|| padmavati padmanetra padma
    padmamukhi para | padmasana padmapriya padmaragasvarupini || 63|| pavani palika patri parada varada
    shiva | pretasamstha parananda parabrahmasvarupuni || 64|| jineshvarapriya devi pashuraktaratapriya
    | pashumamsapriya parna paramritaparayana || 65|| pashini pashika capi pashughni pashubhashini | phullaravindavadani
    phullotpalasharirini || 66|| paranandaprada vinapashupashavinashini | phutkara phutpara pheni phullendivaralocana
    || 67|| phatmantra sphatika svaha sphota ca phatsvarupini | sphatika ghutika ghora sphatikadrisvarupini
    || 68|| varangana varadhara varahi vasuki vara | bindustha binduni vani binducakranivasini || 69||
    vidyadhari vishalakshi kashivasijanapriya | vedavidya virupakshi vishvayugbahurupini || 70|| brahmashaktirvishnushaktih
    pancavaktra shivapriya | vaikunthavasini devi vaikunthapadadayini || 71|| brahmarupa vishnurupa parabrahmamaheshvari
    | bhavapriya bhavodbhava bhavarupa bhavottama || 72|| bhavapara bhavadhara bhagyavatpriyakarini |
    bhadra subhadra bhavada shumbhadaityavinashini || 73|| bhavani bhairavi bhima bhadrakali subhadrika
    | bhagini bhagarupa ca bhagamana bhagottama || 74|| bhagapriya bhagavati bhagavasa bhagakara | bhagasrishta
    bhagyavati bhagarupa bhagasini || 75|| bhagalingapriya devi bhagalingaparayana | bhagalingasvarupa
    ca bhagalingavinodini || 76|| bhagalingarata devi bhagalinganivasini | bhagamala bhagakala bhagadhara
    bhagambara || 77|| bhagavega bhagabhusha bhagendra bhagyarupini | bhagalingangasambhoga bhagalingasavavaha
    || 78|| bhagalingasamadhurya bhagalinganiveshita | bhagalingasupuja ca bhagalingasamanvita || 79||
    bhagalingavirakta ca bhagalingasamavrita | madhavi madhavimanya madhura madhumanini || 80|| mandahasa
    mahamaya mohini mahaduttama | mahamoha mahavidya mahaghora mahasmritih || 81|| manasvini manavati
    modini madhuranana | menika manini manya maniratnavibhushana || 82|| mallika maulika mala maladharamadottama
    | madanasundari medha madhumatta madhupriya || 83|| mattahamsasamonnasa mattasimhamahasani | mahendravallabha
    bhima maulyanca mithunatmaja || 84|| mahakalya mahakali mahabuddhirmahotkata | maheshvari mahamaya
    mahishasuraghatini || 85|| madhurakirttimatta ca mattamatangagamini | madapriya mamsarata mattayukkamakarini
    || 86|| maithunyavallabha devi mahananda mahvotsava | maricirmaratirmaya manobuddhipradayini || 87||
    moha moksha mahalakshmirmahatpadapradayini | yamarupa ca yamuna jayanti ca jayaprada || 88|| yamya
    yamavati yuddha yadoh kulavivarddhini | rama rama ramapatni ratnamala ratipriya || 89|| ratnasimhasanastha
    ca ratnabharanamandita | ramani ramaniya ca ratyarasaparayana || 90|| ratananda ratavati radhunankulavarddhini
    | ramanariparibhrajya raidharadhikaratnaja || 91|| ravi rasasvarupa ca ratrirajasukhavaha | rituja
    rituda riddha riturupa ritupriya || 92|| raktapriya raktavati rangini raktadantika | lakshmirllajja
    latika ca lilalagnanitakshini || 93|| lila lilavati lomaharshahladanapattika | brahmasthita brahmarupa
    brahmana vedavandita || 94|| brahmodbhava brahmakala brahmani brahmabodhini | vedangana vedarupa vanita
    vinata vasa || 95|| bala ca yuvati vriddha brahmakarmaparayana | vindhyastha vindhyavasi ca binduyugbindubhushana
    || 96|| vidyavati vedadhari vyapika barhini kala | vamacarapriya vahnirvamacaraparayana || 97|| vamacararata
    devi vamadevapriyottama | buddhendriya vibuddha ca buddhacaranamalini || 98|| bandhamocanakartri ca
    varuna varunalaya | shiva shivapriya shuddha shuddhangi shuklavarnika || 99|| shuklapushpapriya shukla
    shivadharmaparayana | shuklastha shuklini shuklarupashuklapashupriya || 100|| shukrastha shukrini
    shukra shukrarupa ca shukrika | shanmukhi ca shadanga ca shatcakravinivasini || 101|| shadgranthiyukta
    shodha ca shanmata ca shadatmika | shadangayuvati devi shadangaprakritirvashi || 102|| shadanana shadrasa
    ca shashthi shashtheshvaripriya | shangavada shodashi ca shodhanyasasvarupini || 103|| shatcakrabhedanakari
    shatcakrasthasvarupini | shodashasvararupa ca shanmukhi shadradanvita || 104|| sanakadisvarupa ca
    shivadharmasharayana | siddha saptasvari shuddha suramata svarottama || 105|| siddhavidya sidhamata
    siddha siddhasvarupini | hara haripriya hara harini harayuk tatha || 106|| harirupa haridhara harinakshi
    haripriya | hetupriya heturata hitahitasvarupini || 107|| kshama kshamavati kshita kshudraghantavibhushana
    | kshayankari kshitisha ca kshinamadhyasushobhana || 108|| ajananta aparna ca ahalyasheshashayini
    | svantargata ca sadhunamantaranantarupini || 109|| arupa amala carddha anantagunashalini | svavidya
    vidyakavidya vidya carvindalocana || 110|| aparajita jataveda ajapa amaravati | alpa svalpa analpadya
    animasiddhidayini || 111|| ashtasiddhiprada devi rupalakshanasamyuta | aravindamukha devi bhogasaukhyapradayini
    || 112|| adividya adibhuta adisiddhipradayini | sitkararupini devi sarvasanavibhushita || 113|| indrapriya
    ca indrani indraprasthanivasini | indrakshi indravajra ca indramadyokshani tatha || 114|| ila kamanivasa
    ca ishvarishvaravallabha | janani ceshvari dina bhedaceshvarakarmakrit || 115|| uma katyayani urddhva
    mina cottaravasini | umapatipriya devi shiva conkararupini || 116|| uragendrashiroratna uragoragavallabha
    | udyanavasini mala prashastamanibhushana || 117|| urddhvadantottamangi ca uttama cordhvakeshini |
    umasiddhiprada ya ca uragasanasamsthita || 118|| rishiputri rishicchanda riddhisiddhipradayini | utsavotsavasimanta
    kamika ca gunanvita || 119|| ela ekaravidya ca enividyadhara tatha | onkaravalayopeta onkaraparama
    kala || 120|| omvadavadavani ca onkaraksharamandita | aindri kulishahasta ca omlokaparavasini || 121||
    onkaramadhyabija ca omnamorupadharini | prabrahmasvarupa ca amshukamshukavallabha || 122|| onkara
    ahphadmantra ca akshaksharavibhushita | amantra mantrarupa ca padashobhasamanvita || 123|| pranavonkararupa
    ca pranavoccarabhak punah | hrinkararupa hrimnkari vagbijaksharabhushana || 124|| hrillekha siddhi
    yoga ca hritpadmasanasamsthita | bijakhya netrahridaya hrimbijabhuvaneshvari || 125|| klinkamaraja
    klinna ca caturvargaphalaprada | klinklinklimrupika devi krinkrinkrimnamadharini || 126|| kamalashaktibija
    ca pashankushavibhushita | shrimshrinkara mahavidya shraddha shraddhavati tatha || 127|| om aim klimhrimshrimpara
    ca klinkari parama kala | hrinklimshrinkarasvarupa sarvakarmaphalaprada || 128|| sarvadhya sarvadevi
    ca sarvasiddhiprada tatha | sarvajna sarvashaktishca vagvibhutipradayini || 129|| sarvamokshaprada
    devi sarvabhogapradayini | gunendravallabha vama sarvashaktipradayini || 130|| sarvanandamayi caiva
    sarvasiddhipradayini | sarvacakreshvari devi sarvasiddheshvari tatha || 131|| sarvapriyankari caiva
    sarvasaukhyapradayini | sarvanandaprada devi brahmanandapradayini || 132|| manovanchitadatri ca manovriddhisamanvita
    | akaradikshakaranta durga durgarttinashini || 133|| padmanetra sunetra ca svadhasvahavashatkari |
    svavarga devavarga ca tavarga ca samanvita || 134|| antasstha veshmarupa ca navadurga narottama |
    tattvasiddhiprada nila tatha nilapatakini || 135|| nityarupa nishakari stambhini mohiniti ca | vashankari
    tathoccati unmadi karshiniti ca || 136|| matangi madhumatta ca anima laghima tatha | siddha mokshaprada
    nitya nityanandapradayini || 137|| raktangi raktanetra ca raktacandanabhushita | svalpasiddhissukalpa
    ca divyacaranashukrabha || 138|| sankrantissarvavidya ca sasyavasarabhushita | prathama ca dvitiya
    ca tritiya ca caturtthika || 139|| pancami caiva shashthi ca vishuddha saptami tatha | ashtami navami
    caiva dashamyekadashi tatha || 140|| dvadashi trayodashi ca caturddashyatha purnima | amavasya tatha
    purva uttara paripurnima || 141|| khadgini cakrini ghora gadini shulini tatha | bhushundi capini bana
    sarvayudhavibhushana || 142|| kuleshvari kulavati kulacaraparayana | kulakarmasurakta ca kulacarapravarddhini
    || 143|| kirtishshrishca rama rama dharmayai satatannamah | kshama dhritih smritirmedha kalpavrikshanivasini
    || 144|| ugra ugraprabha gauri vedavidyavibodhini | sadhya siddha susiddha ca viprarupa tathaiva ca
    || 145|| kali karali kalya ca kaladaityavinashini | kaulini kaliki caiva ka
  devanagari: ृणु ताङ्कथयामि ते ॥ १४॥ जगद्विध्वंसिनीन्देवीमजरामरकारिणीम् । तान्नमामि महामायामहदैश्चर्यदायिनीम्
    ॥ १५॥ प्रणवम्पूर्वमुद्धृत्य स्थिरमायान्ततो वदेत् । बगलामुखी सर्वेति दुष्टानावाचमेव च ॥ १६॥ मुखम्पदं
    स्तम्भयेति जिह्वाङ्कीलय बुद्धिमत् । विनाशयेति तारञ्च स्थिरमायान्ततो वदेत् ॥ १७॥ वह्निप्रियान्ततो मन्त्रश्चतुर्वर्गफलप्रदः
    । ब्रह्मास्त्रम्ब्रह्मविद्या च ब्रह्ममाता सनातनी ॥ १८॥ ब्रह्मेशी ब्रह्मकैवल्यबगला ब्रह्मचारिणी । नित्यानन्दा
    नित्यसिद्धा नित्यरूपा निरामया ॥ १९॥ सन्धारिणी महामाया कटाक्षक्षेमकारिणी । कमला विमला नीला रत्नकान्तिगुणाश्रिता
    ॥ २०॥ कामप्रिया कामरता कामकामस्वरूपिणी । मङ्गला विजया जाया सर्वमङ्गलकारिणी ॥ २१॥ कामिनी कामिनीकाम्या
    कामुका कामचारिणी । कामप्रिया कामरता कामाकामस्वरूपिणी ॥ २२॥ कामाख्या कामबीजस्था कामपीठनिवासिनी । कामदा
    कामहा काली कपाली च करालिका ॥ २३॥ कंसारिः कमला कामा कैलासेश्वरवल्लभा । कात्यायनी केशवा च करुणा कामकेलिभुक्
    ॥ २४॥ क्रियाकीर्त्तिः कृत्तिका च काशिका मथुरा शिवा । कालाक्षी कालिका काली धवलाननसुन्दरी ॥ २५॥ खेचरी
    च खमूर्त्तिश्च क्षुद्रा क्षुद्रक्षुधावरा । खड्गहस्ता खड्गरता खड्गिनी खर्परप्रिया ॥ २६॥ गङ्गा गौरी
    गामिनी च गीता गोत्रविवर्द्धिनी । गोधरा गोकरा गोधा गन्धर्वपुरवासिनी ॥ २७॥ गन्धर्वा गन्धर्वकला गोपनी
    गरुडासना । गोविन्दभावा गोविन्दा गान्धारी गन्धमादिनी ॥ २८॥ गौराङ्गी गोपिकामूर्त्तिर्गोपीगोष्ठनिवासिनी
    । गन्धा गजेन्द्रगामान्या गदाधरप्रिया ग्रहा ॥ २९॥ घोरघोरा घोररूपा घनश्रोणी घनप्रभा । दैत्येन्द्रप्रबला
    घण्टावादिनी घोरनिस्स्वना ॥ ३०॥ डाकिन्युमा उपेन्द्रा च उर्वशी उरगासना । उत्तमा उन्नता उन्ना उत्तमस्थानवासिनी
    ॥ ३१॥ चामुण्डा मुण्डिता चण्डी चण्डदर्पहरेति च । उग्रचण्डा चण्डचण्डा चण्डदैत्यविनाशिनी ॥ ३२॥ चण्डरूपा
    प्रचण्डा च चण्डाचण्डशरीरिणी । चतुर्भुजा प्रचण्डा च चराचरनिवासिनी ॥ ३३॥ क्षत्रप्रायश्शिरोवाहा छला छलतरा
    छली । क्षत्ररूपा क्षत्रधरा क्षत्रियक्षयकारिणी ॥ ३४॥ जया च जयदुर्गा च जयन्ती जयदा परा । जायिनी जयिनी
    ज्योत्स्ना जटाधरप्रिया जिता ॥ ३५॥ जितेन्द्रिया जितक्रोधा जयमाना जनेश्वरी । जितमृत्युर्जरातीता जाह्नवी
    जनकात्मजा ॥ ३६॥ झङ्कारा झञ्झरी झण्टा झङ्कारी झकशोभिनी । झखा झमेशा झङ्कारी योनिकल्याणदायिनी ॥ ३७॥ झञ्झरा
    झमुरी झारा झराझरतरा परा । झञ्झा झमेता झङ्कारी झणाकल्याणदायिनी ॥ ३८॥ ईमना मानसी चिन्त्या ईमुना शङ्करप्रिया
    । टङ्कारी टिटिका टीका टङ्किनी च टवर्गगा ॥ ३९॥ टापा टोपा टटपतिष्टमनी टमनप्रिया । ठकारधारिणी ठीका ठङ्करी
    ठिकरप्रिया ॥ ४०॥ ठेकठासा ठकरती ठामिनी ठमनप्रिया । डारहा डाकिनी डारा डामरा डमरप्रिया ॥ ४१॥ डखिनी डडयुक्ता
    च डमरूकरवल्लभा । ढक्का ढक्की ढक्कनादा ढोलशब्दप्रबोधिनी ॥ ४२॥ ढामिनी ढामनप्रीता ढगतन्त्रप्रकाशिनी ।
    अनेकरूपिणी अम्बा अणिमासिद्धिदायिनी ॥ ४३॥ अमन्त्रिणी अणुकरी अणुमद्भानुसंस्थिता । तारा तन्त्रावती तन्त्रतत्त्वरूपा
    तपस्विनी ॥ ४४॥ तरङ्गिणी तत्त्वपरा तन्त्रिका तन्त्रविग्रहा । तपोरूपा तत्त्वदात्री तपःप्रीतिप्रधर्षिणी
    ॥ ४५॥ तन्त्रा यन्त्रार्च्चनपरा तलातलनिवासिनी । तल्पदा त्वल्पदा काम्या स्थिरा स्थिरतरा स्थितिः ॥ ४६॥
    स्थाणुप्रिया स्थपरा स्थिता स्थानप्रदायिनी । दिगम्बरा दयारूपा दावाग्नि दमनीदमा ॥ ४७॥ दुर्गा दुर्गापरा
    देवी दुष्टदैत्यविनाशिनी । दमनप्रमदा दैत्यदयादानपरायणा ॥ ४८॥ दुर्गार्तिनाशिनी दान्ता दम्भिनी दम्भवर्जिता
    । दिगम्बरप्रिया दम्भा दैत्यदम्भविदारिणी ॥ ४९॥ दमना दशनसौन्दर्या दानवेन्द्रविनाशिनी । दया धरा च दमनी
    दर्भपत्रविलासिनी ॥ ५०॥ धरिणी धारिणी धात्री धराधरधरप्रिया । धराधरसुता देवी सुधर्मा धर्मचारिणी ॥ ५१॥
    धर्मज्ञा धवला धूला धनदा धनवर्द्धिनी । धीरा धीरा धीरतरा धीरसिद्धिप्रदायिनी ॥ ५२॥ धन्वन्तरिधराधीरा ध्येया
    ध्यानस्वरूपिणी । नारायणी नारसिंही नित्यानन्दनरोत्तमा ॥ ५३॥ नक्ता नक्तावती नित्या नीलजीमूतसन्निभा ।
    नीलाङ्गी नीलवस्त्रा च नीलपर्वतवासिनी ॥ ५४॥ सुनीलपुष्पखचिता नीलजम्बुसमप्रभा । नित्याख्या षोडशी विद्या
    नित्या नित्यसुखावहा ॥ ५५॥ नर्मदा नन्दनानन्दा नन्दानन्दविवर्द्धिनी । यशोदानन्दतनया नन्दनोद्यानवासिनी
    ॥ ५६॥ नागान्तका नागवृद्धा नागपत्नी च नागिनी । नमिताशेषजनता नमस्कारवती नमः ॥ ५७॥ पीताम्बरा पार्वती
    च पीताम्बरविभूषिता । पीतमील्याम्बरधरा पीताभा पिङ्गमूर्द्धजा ॥ ५८॥ पीतपुष्पार्च्चनरता पीतपुष्पसमर्च्चिता
    । परप्रभा पितृपतिः परसैन्यविनाशिनी ॥ ५९॥ परमा परतन्त्रा च परमन्त्रा परात्परा । पराविद्या परासिद्धिः
    परास्थानप्रदायिनी ॥ ६०॥ पुष्पा पुष्पवती नित्या पुष्पमालाविभूषिता । पुरातना पूर्वपरा परसिद्धिप्रदायिनी
    ॥ ६१॥ पीतानितम्बिनी पीता पीनोन्नतपयस्तनी । प्रेमाप्रमध्यमाशेषा पद्मपत्रविलासिनी ॥ ६२॥ पद्मावती पद्मनेत्रा
    पद्मा पद्ममुखी परा । पद्मासना पद्मप्रिया पद्मरागस्वरूपिणी ॥ ६३॥ पावनी पालिका पात्री परदा वरदा शिवा
    । प्रेतसंस्था परानन्दा परब्रह्मस्वरूपुणी ॥ ६४॥ जिनेश्वरप्रिया देवी पशुरक्तरतप्रिया । पशुमांसप्रिया
    पर्णा परामृतपरायणा ॥ ६५॥ पाशीनी पाशिका चापि पशुघ्नी पशुभाषिणी । फुल्लारविन्दवदनी फुल्लोत्पलशरीरिणी
    ॥ ६६॥ परानन्दप्रदा वीणापशुपाशविनाशिनी । फूत्कारा फुत्परा फेणी फुल्लेन्दीवरलोचना ॥ ६७॥ फट्मन्त्रा स्फटिका
    स्वाहा स्फोटा च फट्स्वरूपिणी । स्फाटिका घुटिका घोरा स्फटिकाद्रिस्वरूपिणी ॥ ६८॥ वराङ्गना वरधरा वाराही
    वासुकी वरा । बिन्दुस्था बिन्दुनी वाणी बिन्दुचक्रनिवासिनी ॥ ६९॥ विद्याधरी विशालाक्षी काशीवासिजनप्रिया
    । वेदविद्या विरूपाक्षी विश्वयुग्बहुरूपिणी ॥ ७०॥ ब्रह्मशक्तिर्विष्णुशक्तिः पञ्चवक्त्रा शिवप्रिया ।
    वैकुण्ठवासिनी देवी वैकुण्ठपददायिनी ॥ ७१॥ ब्रह्मरूपा विष्णुरूपा परब्रह्ममहेश्वरी । भवप्रिया भवोद्भावा
    भवरूपा भवोत्तमा ॥ ७२॥ भवपारा भवधारा भाग्यवत्प्रियकारिणी । भद्रा सुभद्रा भवदा शुम्भदैत्यविनाशिनी ॥
    ७३॥ भवानी भैरवी भीमा भद्रकाली सुभद्रिका । भगिनी भगरूपा च भगमाना भगोत्तमा ॥ ७४॥ भगप्रिया भगवती भगवासा
    भगाकरा । भगसृष्टा भाग्यवती भगरूपा भगासिनी ॥ ७५॥ भगलिङ्गप्रिया देवी भगलिङ्गपरायणा । भगलिङ्गस्वरूपा
    च भगलिङ्गविनोदिनी ॥ ७६॥ भगलिङ्गरता देवी भगलिङ्गनिवासिनी । भगमाला भगकला भगाधारा भगाम्बरा ॥ ७७॥ भगवेगा
    भगाभूषा भगेन्द्रा भाग्यरूपिणी । भगलिङ्गाङ्गसम्भोगा भगलिङ्गासवावहा ॥ ७८॥ भगलिङ्गसमाधुर्या भगलिङ्गनिवेशिता
    । भगलिङ्गसुपूजा च भगलिङ्गसमन्विता ॥ ७९॥ भगलिङ्गविरक्ता च भगलिङ्गसमावृता । माधवी माधवीमान्या मधुरा
    मधुमानिनी ॥ ८०॥ मन्दहासा महामाया मोहिनी महदुत्तमा । महामोहा महाविद्या महाघोरा महास्मृतिः ॥ ८१॥ मनस्विनी
    मानवती मोदिनी मधुरानना । मेनिका मानिनी मान्या मणिरत्नविभूषणा ॥ ८२॥ मल्लिका मौलिका माला मालाधरमदोत्तमा
    । मदनासुन्दरी मेधा मधुमत्ता मधुप्रिया ॥ ८३॥ मत्तहंसासमोन्नासा मत्तसिंहमहासनी । महेन्द्रवल्लभा भीमा
    मौल्यञ्च मिथुनात्मजा ॥ ८४॥ महाकाल्या महाकाली महाबुद्धिर्महोत्कटा । माहेश्वरी महामाया महिषासुरघातिनी
    ॥ ८५॥ मधुराकीर्त्तिमत्ता च मत्तमातङ्गगामिनी । मदप्रिया मांसरता मत्तयुक्कामकारिणी ॥ ८६॥ मैथुन्यवल्लभा
    देवी महानन्दा मह्वोत्सवा । मरीचिर्मारतिर्माया मनोबुद्धिप्रदायिनी ॥ ८७॥ मोहा मोक्षा महालक्ष्मीर्महत्पदप्रदायिनी
    । यमरूपा च यमुना जयन्ती च जयप्रदा ॥ ८८॥ याम्या यमवती युद्धा यदोः कुलविवर्द्धिनी । रमा रामा रामपत्नी
    रत्नमाला रतिप्रिया ॥ ८९॥ रत्नसिंहासनस्था च रत्नाभरणमण्डिता । रमणी रमणीया च रत्यारसपरायणा ॥ ९०॥ रतानन्दा
    रतवती रधूणाङ्कुलवर्द्धिनी । रमणारिपरिभ्राज्या रैधाराधिकरत्नजा ॥ ९१॥ रावी रसस्वरूपा च रात्रिराजसुखावहा
    । ऋतुजा ऋतुदा ऋद्धा ऋतुरूपा ऋतुप्रिया ॥ ९२॥ रक्तप्रिया रक्तवती रङ्गिणी रक्तदन्तिका । लक्ष्मीर्ल्लज्जा
    लतिका च लीलालग्नानिताक्षिणी ॥ ९३॥ लीला लीलावती लोमाहर्षाह्लादनपट्टिका । ब्रह्मस्थिता ब्रह्मरूपा ब्रह्मणा
    वेदवन्दिता ॥ ९४॥ ब्रह्मोद्भवा ब्रह्मकला ब्रह्माणी ब्रह्मबोधिनी । वेदाङ्गना वेदरूपा वनिता विनता वसा
    ॥ ९५॥ बाला च युवती वृद्धा ब्रह्मकर्मपरायणा । विन्ध्यस्था विन्ध्यवासी च बिन्दुयुग्बिन्दुभूषणा ॥ ९६॥
    विद्यावती वेदधारी व्यापिका बर्हिणी कला । वामाचारप्रिया वह्निर्वामाचारपरायणा ॥ ९७॥ वामाचाररता देवी
    वामदेवप्रियोत्तमा । बुद्धेन्द्रिया विबुद्धा च बुद्धाचरणमालिनी ॥ ९८॥ बन्धमोचनकर्त्री च वारुणा वरुणालया
    । शिवा शिवप्रिया शुद्धा शुद्धाङ्गी शुक्लवर्णिका ॥ ९९॥ शुक्लपुष्पप्रिया शुक्ला शिवधर्मपरायणा । शुक्लस्था
    शुक्लिनी शुक्लरूपशुक्लपशुप्रिया ॥ १००॥ शुक्रस्था शुक्रिणी शुक्रा शुक्ररूपा च शुक्रिका । षण्मुखी च
    षडङ्गा च षट्चक्रविनिवासिनी ॥ १०१॥ षड्ग्रन्थियुक्ता षोढा च षण्माता च षडात्मिका । षडङ्गयुवती देवी षडङ्गप्रकृतिर्वशी
    ॥ १०२॥ षडानना षड्रसा च षष्ठी षष्ठेश्वरीप्रिया । षङ्गवादा षोडशी च षोढान्यासस्वरूपिणी ॥ १०३॥ षट्चक्रभेदनकरी
    षट्चक्रस्थस्वरूपिणी । षोडशस्वररूपा च षण्मुखी षड्रदान्विता ॥ १०४॥ सनकादिस्वरूपा च शिवधर्मषरायणा । सिद्धा
    सप्तस्वरी शुद्धा सुरमाता स्वरोत्तमा ॥ १०५॥ सिद्धविद्या सिधमाता सिद्धा सिद्धस्वरूपिणी । हरा हरिप्रिया
    हारा हरिणी हारयुक् तथा ॥ १०६॥ हरिरूपा हरिधारा हरिणाक्षी हरिप्रिया । हेतुप्रिया हेतुरता हिताहितस्वरूपिणी
    ॥ १०७॥ क्षमा क्षमावती क्षीता क्षुद्रघण्टाविभूषणा । क्षयङ्करी क्षितीशा च क्षीणमध्यसुशोभना ॥ १०८॥ अजानन्ता
    अपर्णा च अहल्याशेषशायिनी । स्वान्तर्गता च साधूनामन्तरानन्तरूपिणी ॥ १०९॥ अरूपा अमला चार्द्धा अनन्तगुणशालिनी
    । स्वविद्या विद्यकाविद्या विद्या चार्विन्दलोचना ॥ ११०॥ अपराजिता जातवेदा अजपा अमरावती । अल्पा स्वल्पा
    अनल्पाद्या अणिमासिद्धिदायिनी ॥ १११॥ अष्टसिद्धिप्रदा देवी रूपलक्षणसंयुता । अरविन्दमुखा देवी भोगसौख्यप्रदायिनी
    ॥ ११२॥ आदिविद्या आदिभूता आदिसिद्धिप्रदायिनी । सीत्काररूपिणी देवी सर्वासनविभूषिता ॥ ११३॥ इन्द्रप्रिया
    च इन्द्राणी इन्द्रप्रस्थनिवासिनी । इन्द्राक्षी इन्द्रवज्रा च इन्द्रमद्योक्षणी तथा ॥ ११४॥ ईला कामनिवासा
    च ईश्वरीश्वरवल्लभा । जननी चेश्वरी दीना भेदाचेश्वरकर्मकृत् ॥ ११५॥ उमा कात्यायनी ऊर्द्ध्वा मीना चोत्तरवासिनी
    । उमापतिप्रिया देवी शिवा चोङ्काररूपिणी ॥ ११६॥ उरगेन्द्रशिरोरत्ना उरगोरगवल्लभा । उद्यानवासिनी माला
    प्रशस्तमणिभूषणा ॥ ११७॥ उर्द्ध्वदन्तोत्तमाङ्गी च उत्तमा चोर्ध्वकेशिनी । उमासिद्धिप्रदा या च उरगासनसंस्थिता
    ॥ ११८॥ ऋषिपुत्री ऋषिच्छन्दा ऋद्धिसिद्धिप्रदायिनी । उत्सवोत्सवसीमन्ता कामिका च गुणान्विता ॥ ११९॥ एला
    एकारविद्या च एणीविद्याधरा तथा । ओङ्कारवलयोपेता ओङ्कारपरमा कला ॥ १२०॥ ओंवदवदवाणी च ओङ्काराक्षरमण्डिता
    । ऐन्द्री कुलिशहस्ता च ओंलोकपरवासिनी ॥ १२१॥ ओङ्कारमध्यबीजा च ओंनमोरूपधारिणी । प्रब्रह्मस्वरूपा च अंशुकांशुकवल्लभा
    ॥ १२२॥ ओङ्कारा अःफड्मन्त्रा च अक्षाक्षरविभूषिता । अमन्त्रा मन्त्ररूपा च पदशोभासमन्विता ॥ १२३॥ प्रणवोङ्काररूपा
    च प्रणवोच्चारभाक् पुनः । ह्रीङ्काररूपा ह्रींङ्कारी वाग्बीजाक्षरभूषणा ॥ १२४॥ हृल्लेखा सिद्धि योगा च
    हृत्पद्मासनसंस्थिता । बीजाख्या नेत्रहृदया ह्रीम्बीजाभुवनेश्वरी ॥ १२५॥ क्लीङ्कामराजा क्लिन्ना च चतुर्वर्गफलप्रदा
    । क्लीङ्क्लीङ्क्लींरूपिका देवी क्रीङ्क्रीङ्क्रींनामधारिणी ॥ १२६॥ कमलाशक्तिबीजा च पाशाङ्कुशविभूषिता
    । श्रींश्रीङ्कारा महाविद्या श्रद्धा श्रद्धावती तथा ॥ १२७॥ ओं ऐं क्लींह्रींश्रीम्परा च क्लीङ्कारी परमा
    कला । ह्रीङ्क्लींश्रीङ्कारस्वरूपा सर्वकर्मफलप्रदा ॥ १२८॥ सर्वाढ्या सर्वदेवी च सर्वसिद्धिप्रदा तथा
    । सर्वज्ञा सर्वशक्तिश्च वाग्विभूतिप्रदायिनी ॥ १२९॥ सर्वमोक्षप्रदा देवी सर्वभोगप्रदायिनी । गुणेन्द्रवल्लभा
    वामा सर्वशक्तिप्रदायिनी ॥ १३०॥ सर्वानन्दमयी चैव सर्वसिद्धिप्रदायिनी । सर्वचक्रेश्वरी देवी सर्वसिद्धेश्वरी
    तथा ॥ १३१॥ सर्वप्रियङ्करी चैव सर्वसौख्यप्रदायिनी । सर्वानन्दप्रदा देवी ब्रह्मानन्दप्रदायिनी ॥ १३२॥
    मनोवाञ्छितदात्री च मनोवृद्धिसमन्विता । अकारादिक्षकारान्ता दुर्गा दुर्गार्त्तिनाशिनी ॥ १३३॥ पद्मनेत्रा
    सुनेत्रा च स्वधास्वाहावषट्करी । स्ववर्गा देववर्गा च तवर्गा च समन्विता ॥ १३४॥ अन्तस्स्था वेश्मरूपा
    च नवदुर्गा नरोत्तमा । तत्त्वसिद्धिप्रदा नीला तथा नीलपताकिनी ॥ १३५॥ नित्यरूपा निशाकारी स्तम्भिनी मोहिनीति
    च । वशङ्करी तथोच्चाटी उन्मादी कर्षिणीति च ॥ १३६॥ मातङ्गी मधुमत्ता च अणिमा लघिमा तथा । सिद्धा मोक्षप्रदा
    नित्या नित्यानन्दप्रदायिनी ॥ १३७॥ रक्ताङ्गी रक्तनेत्रा च रक्तचन्दनभूषिता । स्वल्पसिद्धिस्सुकल्पा च
    दिव्यचारणशुक्रभा ॥ १३८॥ सङ्क्रान्तिस्सर्वविद्या च सस्यवासरभूषिता । प्रथमा च द्वितीया च तृतीया च चतुर्त्थिका
    ॥ १३९॥ पञ्चमी चैव षष्ठी च विशुद्धा सप्तमी तथा । अष्टमी नवमी चैव दशम्येकादशी तथा ॥ १४०॥ द्वादशी त्रयोदशी
    च चतुर्द्दश्यथ पूर्णिमा । आमावस्या तथा पूर्वा उत्तरा परिपूर्णिमा ॥ १४१॥ खड्गिनी चक्रिणी घोरा गदिनी
    शूलिनी तथा । भुशुण्डी चापिनी बाणा सर्वायुधविभूषणा ॥ १४२॥ कुलेश्वरी कुलवती कुलाचारपरायणा । कुलकर्मसुरक्ता
    च कुलाचारप्रवर्द्धिनी ॥ १४३॥ कीर्तिश्श्रीश्च रमा रामा धर्मायै सततन्नमः । क्षमा धृतिः स्मृतिर्मेधा
    कल्पवृक्षनिवासिनी ॥ १४४॥ उग्रा उग्रप्रभा गौरी वेदविद्याविबोधिनी । साध्या सिद्धा सुसिद्धा च विप्ररूपा
    तथैव च ॥ १४५॥ काली कराली काल्या च कलादैत्यविनाशिनी । कौलिनी कालिकी चैव क
