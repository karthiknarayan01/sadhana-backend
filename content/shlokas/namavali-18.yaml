    namah | 109 iti gauryashtottarashatanamavalih sampurna |
  devanagari: सिंहसंस्थां मेचकाभां कौसुम्भांशुकशोभिताम् । खड्गं खेटं त्रिशूलञ्च मुद्गरं बिभ्रतीं करैः
    । चन्द्रचूडां त्रिनयनां ध्यायेत्गौरीमभीष्टदाम् ॥ ॐ गौर्यै नमः । ॐ गोजनन्यै नमः । ॐ विद्यायै नमः ।
    ॐ शिवायै नमः । ॐ देव्यै नमः । ॐ महेश्वर्यै नमः । ॐ नारायणायै नमः । ॐ अनुजायै नमः । ॐ नम्रभूषणायै नमः
    । ॐ नुतवैभवायै नमः । १० ॐ त्रिनेत्रायै नमः । ॐ त्रिशिखायै नमः । ॐ शम्भुसंश्रयायै नमः । ॐ शशिभूषणायै
