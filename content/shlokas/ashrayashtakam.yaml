id: ashrayashtakam
category: stotram
name:
  english: ashrayashtakam
  devanagari: आश्रयाष्टकम्
content:
  english: giricaram karunamrita sagaram paricaram paramam mrigayaparam | suruciram sucaracaragocaram
    hariharatmajamishvaramashraye || 1 || pranatasancayacintita kalpakam pranatamadigurum surashilpakam
    | pranavaranjita manjuḻatalpakam hariharatmajamishvaramashraye || 2 || arisaroruhashankhagadadharam
    parighamudgarabanadhanurdharam | kshurika tomara shaktilasatkaram hariharatmajamishvaramashraye ||
    3 || vimalamanasa sarasabhaskaram vipulavetradharam prayashaskaram | vimatakhandana candadhanushkaram
    hariharatmajamishvaramashraye || 4 || sakalaloka namaskrita padukam sakridupasaka sajjanamodakam |
    sukritabhaktajanavana dikshakam hariharatmajamishvaramashraye || 5 || sharanakirtana bhaktaparayanam
    caranavaridharatmarasayanam | varakarattavibhuti vibhushanam hariharatmajamishvaramashraye || 6 ||
    mrigamadangita sattilakojvalam mrigaganakalitam mrigayakulam | mrigavarasanamadbhuta darshanam hariharatmajamishvaramashraye
    || 7 || guruvaram karunamrita locanam nirupamam nikhilamayamocanam | purusukhapradamatmanidarshanam
    hariharatmajamishvaramashraye || 8 || || ashrayashtakam sampurnam ||
  devanagari: गिरिचरं करुणामृत सागरं परिचरं परमं मृगयापरम् । सुरुचिरं सुचराचरगोचरं हरिहरात्मजमीश्वरमाश्रये
    ॥ १ ॥ प्रणतसञ्चयचिन्तित कल्पकं प्रणतमादिगुरुं सुरशिल्पकम् । प्रणवरञ्जित मञ्जुळतल्पकं हरिहरात्मजमीश्वरमाश्रये
    ॥ २ ॥ अरिसरोरुहशङ्खगदाधरं परिघमुद्गरबाणधनुर्धरम् । क्षुरिक तोमर शक्तिलसत्करं हरिहरात्मजमीश्वरमाश्रये
    ॥ ३ ॥ विमलमानस सारसभास्करं विपुलवेत्रधरं प्रयशस्करम् । विमतखण्डन चण्डधनुष्करं हरिहरात्मजमीश्वरमाश्रये
    ॥ ४ ॥ सकललोक नमस्कृत पादुकं सकृदुपासक सज्जनमोदकम् । सुकृतभक्तजनावन दीक्षकं हरिहरात्मजमीश्वरमाश्रये
    ॥ ५ ॥ शरणकीर्तन भक्तपरायणं चरणवारिधरात्मरसायनम् । वरकरात्तविभूति विभूषणं हरिहरात्मजमीश्वरमाश्रये ॥
    ६ ॥ मृगमदाङ्गित सत्तिलकोज्वलं मृगगणाकलितं मृगयाकुलम् । मृगवरासनमद्भुत दर्शनं हरिहरात्मजमीश्वरमाश्रये
    ॥ ७ ॥ गुरुवरं करुणामृत लोचनं निरुपमं निखिलामयमोचनम् । पुरुसुखप्रदमात्मनिदर्शनं हरिहरात्मजमीश्वरमाश्रये
    ॥ ८ ॥ ॥ आश्रयाष्टकं सम्पूर्णम् ॥
