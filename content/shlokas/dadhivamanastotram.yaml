id: dadhivamanastotram
category: stotram
name:
  english: dadhivamanastotram
  devanagari: दधिवामनस्तोत्रम्
content:
  english: shridadhivamanastotram hemadrishikharakaram shuddhasphatinkabhim | purnacandra nibham devam
    dvibhujam vamanam smaret || 1|| padmasanastham devesham candramandalamadhyagam | jvalatkotitatitprakhyam
    tatitkotisamaprabham || 2|| suryakotipratikasham candrakotisushitalam | candramandalamadhyastham vishnumavyayamacyutam
    || 3|| shrivatsakaustubhoraskam divyaratnavibhushitam | pitambaramudarangam vanamalavibhushitam ||
    4|| sundaram pundarikaksham kiritena virajitam | shodashastrivritam samyagapsaroganasevitam || 5||
    rigyajussamatharvadyairgiyamana janardanam | caturmuravadideveshairgiyamanam muda sada || 6|| dadhimishrannakabalam
    rukmapatram ca dakshine | kare tu cintayed dhyayetpiyushamamritam sudhih || 7|| sadhakanam prayacchantamannapanamanuttamam
    | brahme muhurta utthaya dhyayeddyeyamadhokshajam || 8|| atrapumalagatram rukmapatrasthamannam sakalashadadhiravandam
    panina dakshinena | kalashamamritapurnam vamahaste dadhanam tarati sakaladuhkhadva
  devanagari: श्रीदधिवामनस्तोत्रम् हेमाद्रिशिखराकारं शुद्धस्फटिङ्कभिम् । पूर्णचन्द्र निभं देवं द्विभुजं
    वामनं स्मरेत् ॥ १॥ पद्मासनस्थं देवेशं चन्द्रमण्डलमध्यगम् । ज्वलत्कोटितटित्प्रख्यं तटित्कोटिसमप्रभम्
    ॥ २॥ सूर्यकोटिप्रतीकाशं चन्द्रकोटिसुशीतलम् । चन्द्रमण्डलमध्यस्थं विष्णुमव्ययमच्युतम् ॥ ३॥ श्रीवत्सकौस्तुभोरस्कं
    दिव्यरत्नविभूषितम् । पीताम्बरमुदाराङ्गं वनमालाविभूषितम् ॥ ४॥ सुन्दरं पुण्डरीकाक्षं किरीटेन विराजितम्
    । षोडशस्त्रीवृतं सम्यगप्सरोगणसेवितम् ॥ ५॥ ऋग्यजुस्सामाथर्वाद्यैर्गीयमान जनार्दनम् । चतुर्मुरवादिदेवेशैर्गीयमानं
    मुदा सदा ॥ ६॥ दधिमिश्रान्नकबलं रुक्मपात्रं च दक्षिणे । करे तु चिन्तयेद् ध्यायेत्पीयूषममृतं सुधीः ॥
    ७॥ साधकानां प्रयच्छन्तमन्नपानमनुत्तमम् । ब्राह्मे मुहूर्त उत्थाय ध्यायेद्द्येयमधोक्षजम् ॥ ८॥ अत्रपुमलगात्रं
    रुक्मपात्रस्थमन्नं सकलशदधिरवण्डं पणिना दक्षिणेन । कलशममृतपूर्णं वामहस्ते दधानं तरति सकलदुःखाद्वा
