id: ganeshashatakam-ganeshashtottarashatam
category: kavacha
name:
  english: ganeshashatakam ganeshashtottarashatam
  devanagari: गणेशशतकम् गणेशाष्टोत्तरशतं
content:
  english: sarahikshatijatamohamagadankarantaranashritam | taranathakaladharaya na ciradaraccharanyarthinam
    spharaparakripamritarnavarase'daranimagna krithah || 91|| || iti shrinatipaddhatih | shrisamprarthanapaddhatih
    kashapasthitatulajalacapalan leshan sukhanam bhajan ashaveshavashadganesha vivashah keshanajalam vahan
    | ishapatya cirattvadiyacaranabhyashavatigo'smyaham pashanashu vimucya mem disha gatim ya shasita
    shashvati || 12|| nirmayavanimandale janimadah karmadhikaram tato dharmadudgatimapyadhogatimathadharmaddadannyayatah
    | durmayavashametya darasutabhubhaudilubdham kritah sharmabhasaratam krithah kalitanitimarmadhikaraccyutam
    || 93|| vedha mamakakarmasankramavashadadhajanim yam tu tam tredha putrakalatravittamamatabadhadadabhrikritam
    | medhasanjananena bhanjaya javadedhamsi vahniryatha sve dhamanyabhirakhayadya vishayeshvadhavitam
    me manah || 94|| buddhipreranatakshanena phaladat siddhipravarsha jana tvaddhi prapurabodhasantamasaja
    taddhi jataddhi kshayadanjasa | yaddhitva sharanam na me'sti bhuvane taddhi tvadaddhidvayam viddhi
    praptamimam janam ganapate siddhiprado me bhava || 95|| tapam bhautikamukhyametya bahuvikshepam bhajanmanasam
    kopam durdhaninam madoddhatamadhikshepam sada marshayan | bho panjasyasuta tvameva gatirityapam bhavantam
    param rupam darshaya me'dhuna tvamakhilavyapannarakshakshamam || 96|| dvedha karmani cintite mayi
    kripasadharani cenmaho
  devanagari: साराहिक्षतिजातमोहमगदङ्कारान्तरानाश्रितम् । तारानाथकलाधराय न चिरादाराच्छरण्यार्थिनं स्फारापारकृपामृतार्णवरसेऽदरानिमग्न
    कृथाः ॥ ९१॥ ॥ इति श्रीनतिपद्धतिः । श्रीसम्प्रार्थनापद्धतिः काशापस्थिततूलजालचपलान् लेशान् सुखानां भजन्
    आशावेशवशाद्गणेश विवशः केशानजलं वहन् । ईशापत्य चिरात्त्वदीयचरणाभ्याशावतीगोऽस्म्यहं पाशानाशु विमुच्य
    में दिश गतिं या शासिता शाश्वती ॥ १२॥ निर्मायावनिमण्डले जनिमदाः कर्माधिकारं ततो धर्मादुद्गतिमप्यधोगतिमथाधर्माद्ददन्न्यायतः
    । दुर्मायावशमेत्य दारसुतभूभौदिलुब्धं कृतः शर्माभासरतं कृथाः कलितनीतिमर्माधिकाराच्च्युतम् ॥ ९३॥ वेधा
    मामककर्मसङ्क्रमवशादाधाजनिं यां तु तां त्रेधा पुत्रकलत्रवित्तममताबाधाददभ्रीकृताम् । मेधासञ्जननेन भञ्जय
    जवादेधांसि वह्निर्यथा स्वे धामन्यभिरखयाद्य विषयेष्वाधावितं मे मनः ॥ ९४॥ बुद्धिप्रेरणतक्षणेन फलदात्
    सिद्धिप्रवर्ष जना त्वद्धि प्रापुरबोधसन्तमसजा तद्धि जातद्धी क्षयादञ्जसा । यद्धित्वा शरणं न मेऽस्ति
    भुवने तद्धि त्वदद्धिद्वयं विद्धि प्राप्तमिमं जनं गणपते सिद्धिप्रदो मे भव ॥ ९५॥ तापं भौतिकमुख्यमेत्य
    बहुविक्षेपं भजन्मानसं कोपं दुर्धनिनां मदोद्धतमधिक्षेपं सदा मर्षयन् । भो पञ्जास्यसुत त्वमेव गतिरित्यापं
    भवन्तं परं रूपं दर्शय मेऽधुना त्वमखिलव्यापन्नरक्षाक्षमम् ॥ ९६॥ द्वेधा कर्मणि चिन्तिते मयि कृपासाधारणी
    चेन्महो
