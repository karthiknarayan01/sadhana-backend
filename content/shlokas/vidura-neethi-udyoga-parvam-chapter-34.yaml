id: vidura-neethi-udyoga-parvam-chapter-34
category: stotram
name:
  english: Vidura Neethi - Udyoga Parvam Chapter 34
content:
  english: '|| iti shrimahabharate udyogaparvani prajagaraparvani viduranitivakye catustrimsho''dhyayah
    || dhritarashtra uvaca | jagrato dahyamanasya yatkaryamanupashyasi | tadbruhi tvam hi nastata dharmarthakushalah
    shucih || || tvam mam yathavadvidura prashadhi prajna purvam sarvamajatashatroh | yanmanyase pathyamadinasattva
    shreyah karam bruhi tadvai kurunam || || papashangi papameva naupashyan pricchami tvam vyakulenatmanaham
    | kave tanme bruhi sarvam yathavan manishitam sarvamajatashatroh || || vidura uvaca | shubham va yadi
    va papam dveshyam va yadi va priyam | aprishtastasya tadbruyadyasya necchetparabhavam || || tasmadvakshyami
    te rajanbhavamicchankurunprati | vacah shreyah karam dharmyam bruvatastannibodha me || || mithyopetani
    karmani sidhyeyuryani bharata | anupaya prayuktani ma sma teshu manah krithah || || tathaiva yogavihitam
    na sidhyetkarma yannripa | upayayuktam medhavi na tatra glapayenmanah || || anubandhanaveksheta sanubandheshu
    karmasu | sampradharya ca kurvita na vegena samacaret || || anubandham ca samprekshya vipakamshcaiva
    karmanam | utthanamatmanashcaiva dhirah kurvita va na va || || yah pramanam na janati sthane vriddhau
    tatha kshaye | koshe janapade dande na sa rajyavatishthate || || yastvetani pramanani yathoktanyanupashyati
    | yukto dharmarthayorjnane sa rajyamadhigacchati || || na rajyam praptamityeva vartitavyamasampratam
    | shriyam hyavinayo hanti jara rupamivottamam || || bhakshyottama praticchannam matsyo badishamayasam
    | rupabhipati grasate nanubandhamavekshate || || yacchakyam grasitum grasyam grastam parinamecca yat
    | hitam ca pariname yattadadyam bhutimicchata || || vanaspaterapakvani phalani pracinoti yah | sa
    napnoti rasam tebhyo bijam casya vinashyati || || yastu pakvamupadatte kale parinatam phalam | phaladrasam
    sa labhate bijaccaiva phalam punah || || yatha madhu samadatte rakshanpushpani shatpadah | tadvadarthanmanushyebhya
    adadyadavihimsaya || || pushpam pushpam vicinvita mulacchedam na karayet | malakara ivarame na yathangarakarakah
    || || kim nu me syadidam kritva kim nu me syadakurvatah | iti karmani sancintya kuryadva purusho na
    va || || anarabhya bhavantyarthah ke cinnityam tathagatah | kritah purushakaro''pi bhavedyeshu nirarthakah
    || || kamshcidarthannarah prajno labhu mulanmahaphalan | kshipramarabhate kartum na vighnayati tadrishan
    || || riju pashyati yah sarvam cakshushanupibanniva | asinamapi tushnikamanurajyanti tam prajah ||
    || cakshusha manasa vaca karmana ca caturvidham | prasadayati lokam yastam loko''nuprasidati || ||
    yasmattrasyanti bhutani mrigavyadhanmriga iva | sagarantamapi mahim labdhva sa parihiyate || || pitripaitamaham
    rajyam praptavansvena tejasa | vayurabhramivasadya bhramshayatyanaye sthitah || || dharmamacarato
    rajnah sadbhishcaritamaditah | vasudha vasusampurna vardhate bhutivardhani || || atha santyajato dharmamadharmam
    canutishthatah | pratisamveshtate bhumiragnau carmahitam yatha || || ya eva yatnah kriyate prara rashtravamardane
    | sa eva yatnah kartavyah svarashtra paripalane || || dharmena rajyam vindeta dharmena paripalayet
    | dharmamulam shriyam prapya na jahati na hiyate || || apyunmattatpralapato balacca parisarpatah |
    sarvatah saramadadyadashmabhya iva kancanam || || suvyahritani sudhiyam sukritani tatastatah | sancinvandhira
    asita shila hari shilam yatha || || gandhena gavah pashyanti vedaih pashyanti brahmanah | caraih pashyanti
    rajanashcakshurbhyamitare janah || || bhuyamsam labhate klesham ya gaurbhavati durduha | atha ya suduha
    rajannaiva tam vinayantyapi || || yadataptam pranamati na tatsantapayantyapi | yacca svayam natam
    daru na tatsannamayantyapi || || etayopamaya dhirah sannameta baliyase | indraya sa pranamate namate
    yo baliyase || || parjanyanathah pashavo rajano mitra bandhavah | patayo bandhavah strinam brahmana
    veda bandhavah || || satyena rakshyate dharmo vidya yogena rakshyate | mrijaya rakshyate rupam kulam
    vrittena rakshyate || || manena rakshyate dhanyamashvanrakshyatyanukramah | abhikshnadarshanadgavah
    striyo rakshyah kucelatah || || na kulam vritti hinasya pramanamiti me matih | antyeshvapi hi jatanam
    vrittameva vishishyate || || ya irshyuh paravitteshu rupe virye kulanvaye | sukhe saubhagyasatkare
    tasya vyadhiranantakah || || akarya karanadbhitah karyanam ca vivarjanat | akale mantrabhedacca yena
    madyenna tatpibet || || vidyamado dhanamadastritiyo''bhijano madah | ete madavaliptanameta eva satam
    damah || || asanto''bhyarthitah sadbhih kim citkaryam kada cana | manyante santamatmanamasantamapi
    vishrutam || || gatiratmavatam santah santa eva satam gatih | asatam ca gatih santo na tvasantah satam
    gatih || || jita sabha vastravata samasha gomata jita | adhva jito yanavata sarvam shilavata jitam
    || || shilam pradhanam purushe tadyasyeha pranashyati | na tasya jivitenartho na dhanena na bandhubhih
    || || adhyanam mamsaparamam madhyanam gorasottaram | lavanottaram daridranam bhojanam bharatarshabha
    || || sampannataramevannam daridra bhunjate sada | kshutsvadutam janayati sa cadhyeshu sudurlabha
    || || prayena shrimatam loke bhoktum shaktirna vidyate | daridranam tu rajendra api kashtham hi jiryate
    || || avrittirbhayamantyanam madhyanam maranadbhayam | uttamanam tu martyanamavamanatparam bhayam
    || || aishvaryamadapapishtha madah panamadadayah | aishvaryamadamatto hi napatitva vibudhyate || ||
    indriyaurindriyartheshu vartamanairanigrahaih | tairayam tapyate loko nakshatrani grahairiva || ||
    yo jitah pancavargena sahajenatma karshina | apadastasya vardhante shuklapaksha ivodurad || || avijitya
    ya atmanamamatyanvijigishate | amitranvajitamatyah so''vashah parihiyate || || atmanameva prathamam
    desharupena yo jayet | tato''matyanamitramshca na mogham vijigishate || || vashyendriyam jitamatyam
    dhritadandam vikarishu | parikshya karinam dhiramatyantam shrirnishevate || || rathah shariram purushasya
    rajan natma niyantendriyanyasya cashvah | tairapramattah kushalah sadashvair dantaih sukham yati rathiva
    dhirah || || etanyanigrihitani vyapadayitumapyalam | avidheya ivadanta hayah pathi kusarathim || ||
    anarthamarthatah pashyannartam caivapyanarthatah | indriyaih prasrito balah suduhkham manyate sukham
    || || dharmarthau yah parityajya syadindriyavashanugah | shripranadhanadarebhya kshipram sa parihiyate
    || || arthanamishvaro yah syadindriyanamanishvarah | indriyanamanaishvaryadaishvaryadbhrashyate hi
    sah || || atmanatmanamanvicchenmano buddhindriyairyataih | atmaiva hyatmano bandhuratmaiva ripuratmanah
    || || kshudraksheneva jalena jhashavapihitavubhau | kamashca rajankrodhashca tau prajnanam vilumpatah
    || || samavekshyeha dharmarthau sambharanyo''dhigacchati | sa vai sambhrita sambharah satatam sukhamedhate
    || || yah pancabhyantaranshatrunavijitya matikshayan | jigishati ripunanyanripavo''bhibhavanti tam
    || || drishyante hi duratmano vadhyamanah svakarma bhih | indriyanamanishatvadrajano rajyavibhramaih
    || || asantyagatpapakritamapapams tulyo dandah sprishate mishrabhavat | shushkenardram dahyate mishrabhavat
    tasmatpapaih saha sandhim na kuryat || || nijanutpatatah shatrunpanca panca prayojanan | yo mohanna
    nighrihnati tamapadgrasate naram || || anasuyarjavam shaucam santoshah priyavadita | damah satyamanayaso
    na bhavanti duratmanam || || atmajnanamanayasastitiksha dharmanityata | vakcaiva gupta danam ca naitanyantyeshu
    bharata || || akrosha parivadabhyam vihimsantyabudha budhan | vakta papamupadatte kshamamano vimucyate
    || || himsa balamasadhunam rajnam dandavidhirbalam | shushrusha tu balam strinam kshamagunavatam balam
    || || vaksamyamo hi nripate sudushkaratamo matah | arthavacca vicitram ca na shakyam bahubhashitum
    || || abhyavahati kalyanam vividha vaksubhashita | saiva durbhashita rajannanarthayopapadyate || ||
    samrohati sharairviddham vanam parashuna hatam | vaca duruktam bibhatsam na samrohati vakkshatam ||
    || karninalikanaraca nirharanti shariratah | vakshalyastu na nirhartum shakyo hridi shayo hi sah ||
    || vaksayaka vadanannishpatanti yairahatah shocati ratryahani | parasya namarmasu te patanti tanpandito
    navasrijetpareshu || || yasmai devah prayacchanti purushaya parabhavam | buddhim tasyapakarshanti
    so''pacinani pashyati || || buddhau kalusha bhutayam vinashe pratyupasthite | anayo nayasankasho hridayannapasarpati
    || || seyam buddhih parita te putranam tava bharata | pandavanam virodhena na cainam avabudhyase ||
    || raja lakshanasampannastrailokyasyapi yo bhavet | shishyaste shasita so''stu dhritarashtra yudhishthirah
    || || ativa sarvanputramste bhagadheya puraskritah | tejasa prajnaya caiva yukto dharmarthatattvavit
    || || anrishamsyadanukroshadyo''sau dharmabhritam varah | gauravattava rajendra bahunkleshamstitikshati
    || || || iti shrimahabharate udyogaparvani prajagaraparvani viduranitivakye catustrimsho''dhyayah
    ||'
  devanagari: ॥ इति श्रीमहाभारते उद्योगपर्वणि प्रजागरपर्वणि विदुरनीतिवाक्ये चतुस्त्रिंशोऽध्यायः ॥ धृतराष्ट्र
    उवाच । जाग्रतो दह्यमानस्य यत्कार्यमनुपश्यसि । तद्ब्रूहि त्वं हि नस्तात धर्मार्थकुशलः शुचिः ॥ ॥ त्वं
    मां यथावद्विदुर प्रशाधि प्रज्ञा पूर्वं सर्वमजातशत्रोः । यन्मन्यसे पथ्यमदीनसत्त्व श्रेयः करं ब्रूहि
    तद्वै कुरूणाम् ॥ ॥ पापाशङ्गी पापमेव नौपश्यन् पृच्छामि त्वां व्याकुलेनात्मनाहम् । कवे तन्मे ब्रूहि
    सर्वं यथावन् मनीषितं सर्वमजातशत्रोः ॥ ॥ विदुर उवाच । शुभं वा यदि वा पापं द्वेष्यं वा यदि वा प्रियम्
    । अपृष्टस्तस्य तद्ब्रूयाद्यस्य नेच्छेत्पराभवम् ॥ ॥ तस्माद्वक्ष्यामि ते राजन्भवमिच्छन्कुरून्प्रति ।
    वचः श्रेयः करं धर्म्यं ब्रुवतस्तन्निबोध मे ॥ ॥ मिथ्योपेतानि कर्माणि सिध्येयुर्यानि भारत । अनुपाय प्रयुक्तानि
    मा स्म तेषु मनः कृथाः ॥ ॥ तथैव योगविहितं न सिध्येत्कर्म यन्नृप । उपाययुक्तं मेधावी न तत्र ग्लपयेन्मनः
    ॥ ॥ अनुबन्धानवेक्षेत सानुबन्धेषु कर्मसु । सम्प्रधार्य च कुर्वीत न वेगेन समाचरेत् ॥ ॥ अनुबन्धं च सम्प्रेक्ष्य
    विपाकांश्चैव कर्मणाम् । उत्थानमात्मनश्चैव धीरः कुर्वीत वा न वा ॥ ॥ यः प्रमाणं न जानाति स्थाने वृद्धौ
    तथा क्षये । कोशे जनपदे दण्डे न स राज्यावतिष्ठते ॥ ॥ यस्त्वेतानि प्रमाणानि यथोक्तान्यनुपश्यति । युक्तो
    धर्मार्थयोर्ज्ञाने स राज्यमधिगच्छति ॥ ॥ न राज्यं प्राप्तमित्येव वर्तितव्यमसाम्प्रतम् । श्रियं ह्यविनयो
    हन्ति जरा रूपमिवोत्तमम् ॥ ॥ भक्ष्योत्तम प्रतिच्छन्नं मत्स्यो बडिशमायसम् । रूपाभिपाती ग्रसते नानुबन्धमवेक्षते
    ॥ ॥ यच्छक्यं ग्रसितुं ग्रस्यं ग्रस्तं परिणमेच्च यत् । हितं च परिणामे यत्तदद्यं भूतिमिच्छता ॥ ॥ वनस्पतेरपक्वानि
    फलानि प्रचिनोति यः । स नाप्नोति रसं तेभ्यो बीजं चास्य विनश्यति ॥ ॥ यस्तु पक्वमुपादत्ते काले परिणतं
    फलम् । फलाद्रसं स लभते बीजाच्चैव फलं पुनः ॥ ॥ यथा मधु समादत्ते रक्षन्पुष्पाणि षट्पदः । तद्वदर्थान्मनुष्येभ्य
    आदद्यादविहिंसया ॥ ॥ पुष्पं पुष्पं विचिन्वीत मूलच्छेदं न कारयेत् । मालाकार इवारामे न यथाङ्गारकारकः
    ॥ ॥ किं नु मे स्यादिदं कृत्वा किं नु मे स्यादकुर्वतः । इति कर्माणि सञ्चिन्त्य कुर्याद्वा पुरुषो न
    वा ॥ ॥ अनारभ्या भवन्त्यर्थाः के चिन्नित्यं तथागताः । कृतः पुरुषकारोऽपि भवेद्येषु निरर्थकः ॥ ॥ कांश्चिदर्थान्नरः
    प्राज्ञो लभु मूलान्महाफलान् । क्षिप्रमारभते कर्तुं न विघ्नयति तादृशान् ॥ ॥ ऋजु पश्यति यः सर्वं चक्षुषानुपिबन्निव
    । आसीनमपि तूष्णीकमनुरज्यन्ति तं प्रजाः ॥ ॥ चक्षुषा मनसा वाचा कर्मणा च चतुर्विधम् । प्रसादयति लोकं
    यस्तं लोकोऽनुप्रसीदति ॥ ॥ यस्मात्त्रस्यन्ति भूतानि मृगव्याधान्मृगा इव । सागरान्तामपि महीं लब्ध्वा
    स परिहीयते ॥ ॥ पितृपैतामहं राज्यं प्राप्तवान्स्वेन तेजसा । वायुरभ्रमिवासाद्य भ्रंशयत्यनये स्थितः ॥
    ॥ धर्ममाचरतो राज्ञः सद्भिश्चरितमादितः । वसुधा वसुसम्पूर्णा वर्धते भूतिवर्धनी ॥ ॥ अथ सन्त्यजतो धर्ममधर्मं
    चानुतिष्ठतः । प्रतिसंवेष्टते भूमिरग्नौ चर्माहितं यथा ॥ ॥ य एव यत्नः क्रियते प्रर राष्ट्रावमर्दने ।
    स एव यत्नः कर्तव्यः स्वराष्ट्र परिपालने ॥ ॥ धर्मेण राज्यं विन्देत धर्मेण परिपालयेत् । धर्ममूलां श्रियं
    प्राप्य न जहाति न हीयते ॥ ॥ अप्युन्मत्तात्प्रलपतो बालाच्च परिसर्पतः । सर्वतः सारमादद्यादश्मभ्य इव
    काञ्चनम् ॥ ॥ सुव्याहृतानि सुधियां सुकृतानि ततस्ततः । सञ्चिन्वन्धीर आसीत शिला हारी शिलं यथा ॥ ॥ गन्धेन
    गावः पश्यन्ति वेदैः पश्यन्ति ब्राह्मणाः । चारैः पश्यन्ति राजानश्चक्षुर्भ्यामितरे जनाः ॥ ॥ भूयांसं
    लभते क्लेशं या गौर्भवति दुर्दुहा । अथ या सुदुहा राजन्नैव तां विनयन्त्यपि ॥ ॥ यदतप्तं प्रणमति न तत्सन्तापयन्त्यपि
    । यच्च स्वयं नतं दारु न तत्सन्नामयन्त्यपि ॥ ॥ एतयोपमया धीरः सन्नमेत बलीयसे । इन्द्राय स प्रणमते नमते
    यो बलीयसे ॥ ॥ पर्जन्यनाथाः पशवो राजानो मित्र बान्धवाः । पतयो बान्धवाः स्त्रीणां ब्राह्मणा वेद बान्धवाः
    ॥ ॥ सत्येन रक्ष्यते धर्मो विद्या योगेन रक्ष्यते । मृजया रक्ष्यते रूपं कुलं वृत्तेन रक्ष्यते ॥ ॥ मानेन
    रक्ष्यते धान्यमश्वान्रक्ष्यत्यनुक्रमः । अभीक्ष्णदर्शनाद्गावः स्त्रियो रक्ष्याः कुचेलतः ॥ ॥ न कुलं
    वृत्ति हीनस्य प्रमाणमिति मे मतिः । अन्त्येष्वपि हि जातानां वृत्तमेव विशिष्यते ॥ ॥ य ईर्ष्युः परवित्तेषु
    रूपे वीर्ये कुलान्वये । सुखे सौभाग्यसत्कारे तस्य व्याधिरनन्तकः ॥ ॥ अकार्य करणाद्भीतः कार्याणां च विवर्जनात्
    । अकाले मन्त्रभेदाच्च येन माद्येन्न तत्पिबेत् ॥ ॥ विद्यामदो धनमदस्तृतीयोऽभिजनो मदः । एते मदावलिप्तानामेत
    एव सतां दमाः ॥ ॥ असन्तोऽभ्यर्थिताः सद्भिः किं चित्कार्यं कदा चन । मन्यन्ते सन्तमात्मानमसन्तमपि विश्रुतम्
    ॥ ॥ गतिरात्मवतां सन्तः सन्त एव सतां गतिः । असतां च गतिः सन्तो न त्वसन्तः सतां गतिः ॥ ॥ जिता सभा वस्त्रवता
    समाशा गोमता जिता । अध्वा जितो यानवता सर्वं शीलवता जितम् ॥ ॥ शीलं प्रधानं पुरुषे तद्यस्येह प्रणश्यति
    । न तस्य जीवितेनार्थो न धनेन न बन्धुभिः ॥ ॥ आढ्यानां मांसपरमं मध्यानां गोरसोत्तरम् । लवणोत्तरं दरिद्राणां
    भोजनं भरतर्षभ ॥ ॥ सम्पन्नतरमेवान्नं दरिद्रा भुञ्जते सदा । क्षुत्स्वादुतां जनयति सा चाढ्येषु सुदुर्लभा
    ॥ ॥ प्रायेण श्रीमतां लोके भोक्तुं शक्तिर्न विद्यते । दरिद्राणां तु राजेन्द्र अपि काष्ठं हि जीर्यते
    ॥ ॥ अवृत्तिर्भयमन्त्यानां मध्यानां मरणाद्भयम् । उत्तमानां तु मर्त्यानामवमानात्परं भयम् ॥ ॥ ऐश्वर्यमदपापिष्ठा
    मदाः पानमदादयः । ऐश्वर्यमदमत्तो हि नापतित्वा विबुध्यते ॥ ॥ इन्द्रियौरिन्द्रियार्थेषु वर्तमानैरनिग्रहैः
    । तैरयं ताप्यते लोको नक्षत्राणि ग्रहैरिव ॥ ॥ यो जितः पञ्चवर्गेण सहजेनात्म कर्शिना । आपदस्तस्य वर्धन्ते
    शुक्लपक्ष इवोडुराड् ॥ ॥ अविजित्य य आत्मानममात्यान्विजिगीषते । अमित्रान्वाजितामात्यः सोऽवशः परिहीयते
    ॥ ॥ आत्मानमेव प्रथमं देशरूपेण यो जयेत् । ततोऽमात्यानमित्रांश्च न मोघं विजिगीषते ॥ ॥ वश्येन्द्रियं
    जितामात्यं धृतदण्डं विकारिषु । परीक्ष्य कारिणं धीरमत्यन्तं श्रीर्निषेवते ॥ ॥ रथः शरीरं पुरुषस्य राजन्
    नात्मा नियन्तेन्द्रियाण्यस्य चाश्वाः । तैरप्रमत्तः कुशलः सदश्वैर् दान्तैः सुखं याति रथीव धीरः ॥ ॥
    एतान्यनिगृहीतानि व्यापादयितुमप्यलम् । अविधेया इवादान्ता हयाः पथि कुसारथिम् ॥ ॥ अनर्थमर्थतः पश्यन्नर्तं
    चैवाप्यनर्थतः । इन्द्रियैः प्रसृतो बालः सुदुःखं मन्यते सुखम् ॥ ॥ धर्मार्थौ यः परित्यज्य स्यादिन्द्रियवशानुगः
    । श्रीप्राणधनदारेभ्य क्षिप्रं स परिहीयते ॥ ॥ अर्थानामीश्वरो यः स्यादिन्द्रियाणामनीश्वरः । इन्द्रियाणामनैश्वर्यादैश्वर्याद्भ्रश्यते
    हि सः ॥ ॥ आत्मनात्मानमन्विच्छेन्मनो बुद्धीन्द्रियैर्यतैः । आत्मैव ह्यात्मनो बन्धुरात्मैव रिपुरात्मनः
    ॥ ॥ क्षुद्राक्षेणेव जालेन झषावपिहितावुभौ । कामश्च राजन्क्रोधश्च तौ प्राज्ञानं विलुम्पतः ॥ ॥ समवेक्ष्येह
    धर्मार्थौ सम्भारान्योऽधिगच्छति । स वै सम्भृत सम्भारः सततं सुखमेधते ॥ ॥ यः पञ्चाभ्यन्तराञ्शत्रूनविजित्य
    मतिक्षयान् । जिगीषति रिपूनन्यान्रिपवोऽभिभवन्ति तम् ॥ ॥ दृश्यन्ते हि दुरात्मानो वध्यमानाः स्वकर्म भिः
    । इन्द्रियाणामनीशत्वाद्राजानो राज्यविभ्रमैः ॥ ॥ असन्त्यागात्पापकृतामपापांस् तुल्यो दण्डः स्पृशते मिश्रभावात्
    । शुष्केणार्द्रं दह्यते मिश्रभावात् तस्मात्पापैः सह सन्धिं न कुर्यात् ॥ ॥ निजानुत्पततः शत्रून्पञ्च
    पञ्च प्रयोजनान् । यो मोहान्न निघृह्णाति तमापद्ग्रसते नरम् ॥ ॥ अनसूयार्जवं शौचं सन्तोषः प्रियवादिता
    । दमः सत्यमनायासो न भवन्ति दुरात्मनाम् ॥ ॥ आत्मज्ञानमनायासस्तितिक्षा धर्मनित्यता । वाक्चैव गुप्ता
    दानं च नैतान्यन्त्येषु भारत ॥ ॥ आक्रोश परिवादाभ्यां विहिंसन्त्यबुधा बुधान् । वक्ता पापमुपादत्ते क्षममाणो
    विमुच्यते ॥ ॥ हिंसा बलमसाधूनां राज्ञां दण्डविधिर्बलम् । शुश्रूषा तु बलं स्त्रीणां क्षमागुणवतां बलम्
    ॥ ॥ वाक्संयमो हि नृपते सुदुष्करतमो मतः । अर्थवच्च विचित्रं च न शक्यं बहुभाषितुम् ॥ ॥ अभ्यावहति कल्याणं
    विविधा वाक्सुभाषिता । सैव दुर्भाषिता राजन्ननर्थायोपपद्यते ॥ ॥ संरोहति शरैर्विद्धं वनं परशुना हतम्
    । वाचा दुरुक्तं बीभत्सं न संरोहति वाक्क्षतम् ॥ ॥ कर्णिनालीकनाराचा निर्हरन्ति शरीरतः । वाक्षल्यस्तु
    न निर्हर्तुं शक्यो हृदि शयो हि सः ॥ ॥ वाक्सायका वदनान्निष्पतन्ति यैराहतः शोचति रत्र्यहानि । परस्य
    नामर्मसु ते पतन्ति तान्पण्डितो नावसृजेत्परेषु ॥ ॥ यस्मै देवाः प्रयच्छन्ति पुरुषाय पराभवम् । बुद्धिं
    तस्यापकर्षन्ति सोऽपाचीनानि पश्यति ॥ ॥ बुद्धौ कलुष भूतायां विनाशे प्रत्युपस्थिते । अनयो नयसङ्काशो हृदयान्नापसर्पति
    ॥ ॥ सेयं बुद्धिः परीता ते पुत्राणां तव भारत । पाण्डवानां विरोधेन न चैनां अवबुध्यसे ॥ ॥ राजा लक्षणसम्पन्नस्त्रैलोक्यस्यापि
    यो भवेत् । शिष्यस्ते शासिता सोऽस्तु धृतराष्ट्र युधिष्ठिरः ॥ ॥ अतीव सर्वान्पुत्रांस्ते भागधेय पुरस्कृतः
    । तेजसा प्रज्ञया चैव युक्तो धर्मार्थतत्त्ववित् ॥ ॥ आनृशंस्यादनुक्रोशाद्योऽसौ धर्मभृतां वरः । गौरवात्तव
    राजेन्द्र बहून्क्लेशांस्तितिक्षति ॥ ॥ ॥ इति श्रीमहाभारते उद्योगपर्वणि प्रजागरपर्वणि विदुरनीतिवाक्ये
    चतुस्त्रिंशोऽध्यायः ॥
