    bhajinci cinmayamaha nirvanapithambu pai raccalseyaka yarjavambu kujana vratambuce grangi bhu bhriccandalura
    gopimman budhum dartu dai ciccaram jamu rèlla jallukònuno shri kalahastishvara || dantambu lpadanappude
    tanuvunandarudhi yunnappude kantasanghamu royanappude jarakrantambu ganappude vintalmena jarincanappudè
