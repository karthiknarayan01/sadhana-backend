id: shakinisadashivasahasra
category: stotram
name:
  english: shakinisadashivasahasra
  devanagari: शाकिनीसदाशिवसहस्र
content:
  english: purusharthashtasiddhisamayayogasamriddhaye viniyogah | om shakini pitavastra sadashiva umapatih
    | shakambhari mahadevi bhavani bhuvanapriyah || 13 || yogini yogadharmatma yogatma shrisadashivah
    | yugadya yugadharma ca yogavidya suyogirat || 14 || yogini yogajetakhyah suyoga yogashankarah | yogapriya
    yogavidvan yogada yogashadbhuvih || 15 || triyoga jagadishatma japika japasiddhidah | yatni yatnapriyanando
    vidhijna vedasaravit || 16 || supratishtha shubhakaro madira madanapriyah | madhuvidya madhavishah
    kshitih kshobhavinashanah || 17 || vitijna manmathaghnashca camari carulocanah | ekantara kalpataruh
    kshamabuddho ramasavah || 18 || vasundhara vamadevah shrividya mandarasthitah | akalanka niratankah
    utanka shankarashrayah || 19 || nirakara nirvikalpo rasada rasikashrayah | rama ramananathashca lakshmi
    nileshulocanah || 20 || vidyadhari dharanandah kanaka kancanangadhrik | shubha shubhakaronmattah pracanda
    candavikramah || 21 || sushila devajanakah kakini kamalananah | kajjalabha krishnadehah shulini khadgacarmadhrik
    || 22 || gatigrahyah prabhagaurah kshama kshubdhah shiva shivah | java yatih para harirharaharo'ksharaksharah
    || 23 || sanatani sanatanah shmashanavasinipatih | jayakshayo dharacarah samagatih pramapatih || 24
    || kulakulo malanano valivala malamalah | prabhadharah paraparah sarasarah karakarah || 25 || mayamayah
    payapayah palapalo dayadayah | bhayabhayo jayajayo gayagayah phalanvayah || 26 || samagamo dhamadhamo
    ramaramo vamavamah | varangana dharadharah prabhakaro bhramabhramah || 27 || sati sukhi sulakshana
    kripakaro dayanidhih | dharapatih priyapativiragini manonmanah || 28 || pradhavini sadacalah pracancalaticancalah
    | katupriya mahakatuh patupriya mahapatuh || 29 || dhanavali ganagani kharakharah phanih kshanah |
    priyanvita shiromanistu shakini sadashivah || 30 || runaruno ghanaghano hayi hayo layi layah | sudantara
    sudagamah khalapaha mahashayah || 31 || calatkuca javavrito ghanantara svarantakah | pracandaghargharadhvanih
    priya pratapavahnigah || 32 || prashantirundurusthita maheshvari maheshvarah | mahashivavini ghani
    raneshvari raneshvarah || 33 || pratapini pratapanah pramanika pramanavit | vishuddhavasini munivishuddhavinmadhuttama
    || 34 || tilottama mahottamah sadamaya dayamayah | vikaratarini taruh surasuro'maraguruh || 35 ||
    prakashika prakashakah pracandika vibhandakah | trishulini gadadharah pravalika mahabalah || 36 ||
    kriyavati jarapatih prabhambara digambarah | kulambara mrigambara nirantara jarantarah || 37 || shmashananilaya
    shambhurbhavani bhimalocanah | kritantaharinikantah kupita kamanashanah || 38 || caturbhuja padmanetro
    dashahasta mahaguruh | dashanana dashagrivah kshiptakshi kshepanapriyah || 39 || varanasi pithavasi
    kashi vishvagurupriyah | kapalini mahakalah kalika kalipavanah || 40 || randhravartmasthita vagmi
    rati ramaguruprabhuh | sulakshmih prantarasthashca yogikanya kritantakah || 41 || surantaka punyadata
    tarini tarunapriyah | mahabhayatara tarastarika tarakaprabhuh || 42 || tarakabrahmajanani mahadriptah
    bhavagrajah | lingagamya lingarupi candika vrishavahanah || 43 || rudrani rudradevashca kamaja kamamanthanah
    | vijatiya jatitato vidhatri dhatriposhakah || 44 || nirakara mahakashah supravidya vibhavasuh | vasuki
    patitatrata triveni tattvadarshakah || 45 || pataka padmavasi ca trivarta kirtivardhanah | dharani
    dharanavyapto vimalanandavardhanah || 46 || vipracitta kundakari viraja kalakampanah | sukshmadhara
    atijnani mantrasiddhih pramanagah || 47 || vacya varanatundashca kamala krishnasevakah | dundubhistha
    vadyabhando nilangi varanashrayah || 48 || vasantadya shitarashmih pramadya shaktivallabhah | khadgana
    cakrakuntadhyah shishiralpadhanapriyah || 49 || durvacya mantranilayah khandakali kulashrayah | vanari
    hastiharadyah pranaya lingapujakah || 50 || manushi manurupashca nilavarna vidhuprabhah | ardhashcandradhara
    kalah kamala dirghakeshadhrik || 51 || dirghakeshi vishvakeshi trivarga khandanirnayah | grihini grahaharta
    ca grahapida grahakshayah || 52 || pushpagandha varicarah krodhadevi divakarah | anjana kruraharta
    ca kevala katarapriyah || 53 || padyamayi papaharta vidyadya shailamardakah | krishnajihva raktamukho
    bhuvaneshi paratparah || 54 || vadari mulasamparkah kshetrapala balanalah | pitribhumisthitacaryo
    vishaya badarayanih || 55 || purogama purogami viraga ripunashakah | mahamaya mahanmayo varadah kamadantakah
    || 56 || pashulakshmih pashupatih pancashaktih kshapantakah | vyapika vijayacchanno vijatiya varananah
    || 57 || katumutih shakamutistripura padmagarbhajah | ajabya jarakah prakshya vatulah kshetrabandhava
    || 58 || anantanantarupastho lavanyastha prasancayah | yogajno jnanacakresho babhrama bhramanasthitah
    || 59 || shishupala bhutanasho bhutakritya kutumbapah | triptashvattho vararoha vatukah protikavashah
    || 60 || shraddha shraddhanvitah pushtih pushto rushtashtamadhava | milita melanah prithvi tattvajnani
    carupriya || 61 || alabdha bhayahantya dashanah praptamanasa | jivani paramanando vidyadhya dharmakarmajah
    || 62 || apavadaratakankshi vilvanabhadrakambalah | shivivarahanonmatto vishalakshi parantapah ||
    63 || gopaniya sugopta ca parvati parameshvarah | shrimatangi tripithastho vikari dhyananirmalah ||
    64 || caturi caturanandah putrini sutavatsalah | vamani vishayanandah kinkari krodhajivanah || 65
    || candranana priyanandah kushala ketakipriyah | pracala tarakajnani trikarma narmadapatih || 66 ||
    kapatastha kalapastho vidyajna vardhamanagah | trikuta trividhanando nandana nandanapriyah || 67 ||
    vicikitsa samaptango mantrajna manuvardhanah | mannika cambikanatho vivashi vamshavardhanah || 68
    || vajrajihva vajradanto vikriya kshetrapalanah | vikarani parvatishah priyangi pancacamarah || 69
    || amshika vamadevadya vimayadhya paraparah | payangi paramaishvarya data bhoktri divakarah || 70
    || kamadatri vicitraksho ripuraksha kshapantakrit | ghoramukhi ghargharakhyo vilajva jvalinipatih
    || 71 || jvalamukhi dharmakarta shrikartri karanatmakah | mundali pancacudashca trishavarna sthitagrajah
    || 72 || virupakshi brihadgarbho rakini shripitamahah | vaishnavi vishnubhaktashca dakini dindimapriyah
    || 73 || ratividya ramanatho radhika vishnulakshanah | caturbhuja vedahasto lakini minakuntalah ||
    74 || murdhaja langalidevah sthavira jirnavigrahah | lakinisha lakinishah priyakhya caruvahanah ||
    75 || jatila trijatadhari caturangi caracarah | trishrota parvamtinatho bhuvaneshi nareshvarah ||
    76 || pinakini pinaki ca candracuda vicaravit | jadyahantri jadatma ca jihvayukto jaramarah || 77
    || anahatakhya rajendrah kakini sattvikasthitah | marunmurti padmahasto vishuddha shuddhavahanah ||
    78 || vrishali vrishaprishthastho vibhoga bhogavardhanah | yauvanastha yuvasakshi lokadya lokasakshini
    || 79 || bagala candracudakhyo bhairavi mattabhairavah | krodhadhipa vajradhari indrani vahnivallabhah
    || 80 || nirvikara sutradhari mattapana divashrayah | shabdagarbha shabdamayo vasava vasavanujah ||
    81 || dikpala grahanathashca ishani naravahanah | yakshinisha bhutinisho vibhutirbhutivardhanah ||
    82 || jayavati kalakari kalkyavidya vidhanavit | lajjatita lakshanango vishapayi madashrayah || 83
    || videshini videshastho'papa papavarjitah | atikshobha kalatito nirindriyaganodaya || 84 || vacalo
    vacanagranthimandaro vedamandira | pancamah pancamidurgo durga durgatinashanah || 85 || durgandha
    gandharajashca sugandha gandhacalanah | carvangi carvanaprito vishanka maralaravit || 86 || atithistha
    sthavaradya japastha japamalini | vasundharasuta tarkshi tarkikah pranatarkikah || 87 || talavrikshavritonnasa
    talajaya jatadharah | jatileshi jatadhari saptamishah prasaptami || 88 || ashtamiveshakrit kali sarvah
    sarveshvarishvarah | shatruhantri nityamantri taruni tarakashrayah || 89 || dharmaguptih saragupto
    manoyoga vishapahah | vajravirah surasauri candrika candrashekharah || 90 || vitapindra vatasthani
    bhadrapalah kuleshvarah | catakadya candradehah priyabharya manoyavah || 91 || tirthapunya tirthayogi
    jalaja jalashayakah | bhuteshvarapriyabhuto bhagamala bhagananah || 92 || bhagini bhagavan bhogya
    bhavati bhimalocanah | bhriguputri bhargaveshah pralayalayakaranah || 93 || rudrani rudraganapo raudrakshi
    kshinavahanah | kumbhantaka nikumbharih kumbhanti kumbhiniragah || 94 || kushmandi dhanaratnadhyo
    mahogragrahakah shubha | shivirastha shivanandah shavasanakritasani || 95 || prashamsa samanah prajna
    vibhavya bhavyalocanah | kuruvidya kauravamshah kulakanya mrinaladhrik || 96 || dvidalastha paranando
    nandisevya brihannala | vyasasevya vyasapujyo dharani dhiralocanah || 97 || trividharanya tulakotih
    karpasa kharparangadhrik | vashishtharadhitavishto vashaga vashajivanah || 98 || khadgahasta khadgadhari
    shulahasta vibhakarah | atula tulanahino vividha dhyananirnayah || 99 || aprakashya vishodhyashca
    camunda candavahanah | girija gayanonmatto malamali caladhamah || 100 || pingadeha pingakesho'samartha
    shilavahanah | garudi garudanando vishoka vamshavardhanah || 101 || venindra catakaprayo vidyadya
    doshamardakah | attahasa attahaso madhubhaksha madhuvratah || 102 || madhuranandasampanna madhavo
    madhunashika | makari makarapremo maghastha maghavahanah || 103 || vishakha susakha sukshma jyeshtho
    jyeshthajanapriya | ashadhanilayashadho mithila maithilishvarah || 104 || shitashaityagato vani vimalalakshaneshvarah
    | akaryakaryajanako bhadra bhadrapadiyakah || 105 || pravara varahamsakhyah pavashobha puranavit |
    shravani harinathashca shravana shravanankurah || 106 || sukartri sadhanadhyaksho vishodhya shuddhabhavanah
    | ekashesha shashidharo dharantah sthavaradharah || 107 || dharmaputri dharmamatro vijaya jayadayakah
    | dasarakshadi vidashakalapo vidhavapatih || 108 || vidhavadhavalo dhurtah dhurtadhyo dhurtapalika
    | shankarah kamagami ca devala devamayika || 109 || vinasho mandaracchanna mandarastho mahadvaya |
    atiputri trimundi ca mundamala tricandika || 110 || karkatishah kotarashca simhika simhavahanah |
    narasimhi nrisimhashca narmada jahnavipatih || 111 || trividhastri trisargastro digambaro digambari
    | muncano mancabhedi ca malanca cancalagrajah || 112 || katutungi vikashatma riddhispashtaksharo'ntara
    | virincah prabhavanando nandini mandaradridhrik || 113 || kalikabha kancanabho madiradya madodayah
    | dravidastha dadimastho majjatita marudgatih || 114 || kshantiprajno vidhiprajna vitijnotsukanishcaya
    | abhavo malinakara karagara vicaraha || 115 || shabdah katahabhedatma shishulokaprapalika | ativistaravadano
    vibhavanandamanasa || 116 || akashavasanonmadi mepura mamsacarvanah | atikanta prashantatma nityaguhya
    gabhiragah || 117 || trigambhira tattvavasi rakshasi putanaksharah | abhogaganika hasti ganeshajananishvarah
    || 118 || kundapalakakarta ca trirunda rundabhaladhrik | atishakta vishaktatma devyangi nandanashrayah
    || 119 || bhavaniya bhrantiharah kapilabha manoharah | aryadevi nilavarna sayako balaviryada || 120
    || sukhado mokshadata'to janani vanchitapradah | catirupa virupastho vacya vacyavivarjitah || 121
    || mahalingasamutpanna kakabheri nadasthitah | atmaramakalakayah siddhidata ganeshvari || 122 || kalpadrumah
    kalpalata kulavrikshah kuladruma | sumana shrigurumayi gurumantrapradayakah || 123 || anantashayana'nanto
    jaleshi jahnajeshvarah | ganga gangadharah shrida bhaskaresho mahabala || 124 || guptaksharo vidhirata
    vidhanapurusheshvarah | siddhakalanka kundali vagdevah pancadevata || 125 || alpatita manohari trividha
    tattvalocana | amayapatirbhubhrantih pancajanyadharo'graja || 126 || atitaptah kamatapta mayamohavivarjitah
    | arya putrishvarah sthanuh krishanustha jalaplutah || 127 || varuni madiramatto mamsapremadigambara
    | antarastho dehasiddha kalanalasuradripah || 128 || akashavahini devah kakinisho digambari | kakacancuputamadhuharo
    gaganamabdhipa || 129 || mudrahari mahamudra minapo minabhakshini | shakini shivanatheshah kakordhveshi
    sadashivah || 130 || kamala kanthakamalah sthayukah premanayika | mrinalamaladhari ca mrinalamalamalini
    || 131 || anadinidhana tara durgatara nirakshara | sarvakshara sarvavarna sarvamantrakshamalika ||
    132 || anandabhairavo nilakantho brahmandamanditah | shivo vishveshvaro'nantah sarvatito niranjanah
    || 133 || iti te kathitam natha trailokyasaramangalam | bhuvanamangalam nama mahapatakanashanam ||
    134 || asya prapathane'pi ca yatphalam labhate narah | tatsarvam kathitum nalam kotivarshashatairapi
    || 135 || tathapi tava yatnena phalam sha
  devanagari: पुरुषार्थाष्टसिद्धिसमययोगसमृद्धये विनियोगः । ॐ शाकिनी पीतवस्त्रा सदाशिव उमापतिः । शाकम्भरी
    महादेवी भवानी भुवनप्रियः ॥ १३ ॥ योगिनी योगधर्मात्मा योगात्मा श्रीसदाशिवः । युगाद्या युगधर्मा च योगविद्या
    सुयोगिराट् ॥ १४ ॥ योगिनी योगजेताख्यः सुयोगा योगशङ्करः । योगप्रिया योगविद्वान् योगदा योगषड्भुविः ॥
    १५ ॥ त्रियोगा जगदीशात्मा जापिका जपसिद्धिदः । यत्नी यत्नप्रियानन्दो विधिज्ञा वेदसारवित् ॥ १६ ॥ सुप्रतिष्ठा
    शुभकरो मदिरा मदनप्रियः । मधुविद्या माधवीशः क्षितिः क्षोभविनाशनः ॥ १७ ॥ वीतिज्ञा मन्मथघ्नश्च चमरी चारुलोचनः
    । एकान्तरा कल्पतरुः क्षमाबुद्धो रमासवः ॥ १८ ॥ वसुन्धरा वामदेवः श्रीविद्या मन्दरस्थितः । अकलङ्का निरातङ्कः
    उतङ्का शङ्कराश्रयः ॥ १९ ॥ निराकारा निर्विकल्पो रसदा रसिकाश्रयः । रामा रामननाथश्च लक्ष्मी नीलेषुलोचनः
    ॥ २० ॥ विद्याधरी धरानन्दः कनका काञ्चनाङ्गधृक् । शुभा शुभकरोन्मत्तः प्रचण्डा चण्डविक्रमः ॥ २१ ॥ सुशीला
    देवजनकः काकिनी कमलाननः । कज्जलाभा कृष्णदेहः शूलिनी खड्गचर्मधृक् ॥ २२ ॥ गतिग्राह्यः प्रभागौरः क्षमा
    क्षुब्धः शिवा शिवः । जवा यतिः परा हरिर्हराहरोऽक्षराक्षरः ॥ २३ ॥ सनातनी सनातनः श्मशानवासिनीपतिः । जयाक्षयो
    धराचरः समागतिः प्रमापतिः ॥ २४ ॥ कुलाकुलो मलाननो वलीवला मलामलः । प्रभाधरः परापरः सरासरः कराकरः ॥ २५
    ॥ मयामयः पयापयः पलापलो दयादयः । भयाभयो जयाजयो गयागयः फलान्वयः ॥ २६ ॥ समागमो धमाधमो रमारमो वमावमः ।
    वराङ्गणा धराधरः प्रभाकरो भ्रमाभ्रमः ॥ २७ ॥ सती सुखी सुलक्षणा कृपाकरो दयानिधिः । धरापतिः प्रियापतिवीरागिणी
    मनोन्मनः ॥ २८ ॥ प्रधाविनी सदाचलः प्रचञ्चलातिचञ्चलः । कटुप्रिया महाकटुः पटुप्रिया महापटुः ॥ २९ ॥ धनावली
    गणागणी खराखरः फणिः क्षणः । प्रियान्विता शिरोमणिस्तु शाकिनी सदाशिवः ॥ ३० ॥ रुणारुणो घनाघनो हयी हयो
    लयी लयः । सुदन्तरा सुदागमः खलापहा महाशयः ॥ ३१ ॥ चलत्कुचा जवावृतो घनान्तरा स्वरान्तकः । प्रचण्डघर्घरध्वनिः
    प्रिया प्रतापवह्निगः ॥ ३२ ॥ प्रशान्तिरुन्दुरुस्थिता महेश्वरी महेश्वरः । महाशिवाविनी घनी रणेश्वरी रणेश्वरः
    ॥ ३३ ॥ प्रतापिनी प्रतापनः प्रमाणिका प्रमाणवित् । विशुद्धवासिनी मुनिविशुद्धविन्मधूत्तमा ॥ ३४ ॥ तिलोत्तमा
    महोत्तमः सदामया दयामयः । विकारतारिणी तरुः सुरासुरोऽमरागुरुः ॥ ३५ ॥ प्रकाशिका प्रकाशकः प्रचण्डिका विभाण्डकः
    । त्रिशूलिनी गदाधरः प्रवालिका महाबलः ॥ ३६ ॥ क्रियावती जरापतिः प्रभाम्बरा दिगम्बरः । कुलाम्बरा मृगाम्बरा
    निरन्तरा जरान्तरः ॥ ३७ ॥ श्मशाननिलया शम्भुर्भवानी भीमलोचनः । कृतान्तहारिणीकान्तः कुपिता कामनाशनः ॥
    ३८ ॥ चतुर्भुजा पद्मनेत्रो दशहस्ता महागुरुः । दशानना दशग्रीवः क्षिप्ताक्षी क्षेपनप्रियः ॥ ३९ ॥ वाराणसी
    पीठवासी काशी विश्वगुरुप्रियः । कपालिनी महाकालः कालिका कलिपावनः ॥ ४० ॥ रन्ध्रवर्त्मस्थिता वाग्मी रती
    रामगुरुप्रभुः । सुलक्ष्मीः प्रान्तरस्थश्च योगिकन्या कृतान्तकः ॥ ४१ ॥ सुरान्तका पुण्यदाता तारिणी तरुणप्रियः
    । महाभयतरा तारास्तारिका तारकप्रभुः ॥ ४२ ॥ तारकब्रह्मजननी महादृप्तः भवाग्रजः । लिङ्गगम्या लिङ्गरूपी
    चण्डिका वृषवाहनः ॥ ४३ ॥ रुद्राणी रुद्रदेवश्च कामजा काममन्थनः । विजातीया जातितातो विधात्री धातृपोषकः
    ॥ ४४ ॥ निराकारा महाकाशः सुप्रविद्या विभावसुः । वासुकी पतितत्राता त्रिवेणी तत्त्वदर्शकः ॥ ४५ ॥ पताका
    पद्मवासी च त्रिवार्ता कीर्तिवर्धनः । धरणी धारणाव्याप्तो विमलानन्दवर्धनः ॥ ४६ ॥ विप्रचित्ता कुण्डकारी
    विरजा कालकम्पनः । सूक्ष्माधारा अतिज्ञानी मन्त्रसिद्धिः प्रमाणगः ॥ ४७ ॥ वाच्या वारणतुण्डश्च कमला कृष्णसेवकः
    । दुन्दुभिस्था वाद्यभाण्डो नीलाङ्गी वारणाश्रयः ॥ ४८ ॥ वसन्ताद्या शीतरश्मिः प्रमाद्या शक्तिवल्लभः ।
    खड्गना चक्रकुन्ताढ्यः शिशिराल्पधनप्रियः ॥ ४९ ॥ दुर्वाच्या मन्त्रनिलयः खण्डकाली कुलाश्रयः । वानरी हस्तिहाराद्यः
    प्रणया लिङ्गपूजकः ॥ ५० ॥ मानुषी मनुरूपश्च नीलवर्णा विधुप्रभः । अर्धश्चन्द्रधरा कालः कमला दीर्घकेशधृक्
    ॥ ५१ ॥ दीर्घकेशी विश्वकेशी त्रिवर्गा खण्डनिर्णयः । गृहिणी ग्रहहर्ता च ग्रहपीडा ग्रहक्षयः ॥ ५२ ॥ पुष्पगन्धा
    वारिचरः क्रोधादेवी दिवाकरः । अञ्जना क्रूरहर्ता च केवला कातरप्रियः ॥ ५३ ॥ पद्यामयी पापहर्ता विद्याद्या
    शैलमर्दकः । कृष्णजिह्वा रक्तमुखो भुवनेशी परात्परः ॥ ५४ ॥ वदरी मूलसम्पर्कः क्षेत्रपाला बलानलः । पितृभूमिस्थिताचार्यो
    विषया बादरायणिः ॥ ५५ ॥ पुरोगमा पुरोगामी वीरगा रिपुनाशकः । महामाया महान्मायो वरदः कामदान्तकः ॥ ५६ ॥
    पशुलक्ष्मीः पशुपतिः पञ्चशक्तिः क्षपान्तकः । व्यापिका विजयाच्छन्नो विजातीया वराननः ॥ ५७ ॥ कटुमूतीः
    शाकमूतीस्त्रिपुरा पद्मगर्भजः । अजाब्या जारकः प्रक्ष्या वातुलः क्षेत्रबान्धवा ॥ ५८ ॥ अनन्तानन्तरूपस्थो
    लावण्यस्था प्रसञ्चयः । योगज्ञो ज्ञानचक्रेशो बभ्रमा भ्रमणस्थितः ॥ ५९ ॥ शिशुपाला भूतनाशो भूतकृत्या कुटुम्बपः
    । तृप्ताश्वत्थो वरारोहा वटुकः प्रोटिकावशः ॥ ६० ॥ श्रद्धा श्रद्धान्वितः पुष्टिः पुष्टो रुष्टाष्टमाधवा
    । मिलिता मेलनः पृथ्वी तत्त्वज्ञानी चारुप्रिया ॥ ६१ ॥ अलब्धा भयहन्त्या दशनः प्राप्तमानसा । जीवनी परमानन्दो
    विद्याढ्या धर्मकर्मजः ॥ ६२ ॥ अपवादरताकाङ्क्षी विल्वानाभद्रकम्बलः । शिविवाराहनोन्मत्तो विशालाक्षी परन्तपः
    ॥ ६३ ॥ गोपनीया सुगोप्ता च पार्वती परमेश्वरः । श्रीमातङ्गी त्रिपीठस्थो विकारी ध्याननिर्मलः ॥ ६४ ॥ चातुरी
    चतुरानन्दः पुत्रिणी सुतवत्सलः । वामनी विषयानन्दः किङ्करी क्रोधजीवनः ॥ ६५ ॥ चन्द्रानना प्रियानन्दः
    कुशला केतकीप्रियः । प्रचला तारकज्ञानी त्रिकर्मा नर्मदापतिः ॥ ६६ ॥ कपाटस्था कलापस्थो विद्याज्ञा वर्धमानगः
    । त्रिकूटा त्रिविधानन्दो नन्दना नन्दनप्रियः ॥ ६७ ॥ विचिकित्सा समाप्ताङ्गो मन्त्रज्ञा मनुवर्धनः । मन्निका
    चाम्बिकानाथो विवाशी वंशवर्धनः ॥ ६८ ॥ वज्रजिह्वा वज्रदन्तो विक्रिया क्षेत्रपालनः । विकारणी पार्वतीशः
    प्रियाङ्गी पञ्चचामरः ॥ ६९ ॥ आंशिका वामदेवाद्या विमायाढ्या परापरः । पायाङ्गी परमैश्वर्या दाता भोक्त्री
    दिवाकरः ॥ ७० ॥ कामदात्री विचित्राक्षो रिपुरक्षा क्षपान्तकृत् । घोरमुखी घर्घराख्यो विलज्वा ज्वालिनीपतिः
    ॥ ७१ ॥ ज्वालामुखी धर्मकर्ता श्रीकर्त्री कारणात्मकः । मुण्डाली पञ्चचूडाश्च त्रिशावर्णा स्थिताग्रजः
    ॥ ७२ ॥ विरूपाक्षी बृहद्गर्भो राकिनी श्रीपितामहः । वैष्णवी विष्णुभक्तश्च डाकिनी डिण्डिमप्रियः ॥ ७३
    ॥ रतिविद्या रामनाथो राधिका विष्णुलक्षणः । चतुर्भुजा वेदहस्तो लाकिनी मीनकुन्तलः ॥ ७४ ॥ मूर्धजा लाङ्गलीदेवः
    स्थविरा जीर्णविग्रहः । लाकिनीशा लाकिनीशः प्रियाख्या चारुवाहनः ॥ ७५ ॥ जटिला त्रिजटाधारी चतुराङ्गी चराचरः
    । त्रिश्रोता पार्वंतीनाथो भुवनेशी नरेश्वरः ॥ ७६ ॥ पिनाकिनी पिनाकी च चन्द्रचूडा विचारवित् । जाड्यहन्त्री
    जडात्मा च जिह्वायुक्तो जरामरः ॥ ७७ ॥ अनाहताख्या राजेन्द्रः काकिनी सात्त्विकस्थितः । मरुन्मूर्ति पद्महस्तो
    विशुद्धा शुद्धवाहनः ॥ ७८ ॥ वृषली वृषपृष्ठस्थो विभोगा भोगवर्धनः । यौवनस्था युवासाक्षी लोकाद्या लोकसाक्षिणी
    ॥ ७९ ॥ बगला चन्द्रचूडाख्यो भैरवी मत्तभैरवः । क्रोधाधिपा वज्रधारी इन्द्राणी वह्निवल्लभः ॥ ८० ॥ निर्विकारा
    सूत्रधारी मत्तपाना दिवाश्रयः । शब्दगर्भा शब्दमयो वासवा वासवानुजः ॥ ८१ ॥ दिक्पाला ग्रहनाथश्च ईशानी
    नरवाहनः । यक्षिणीशा भूतिनीशो विभूतिर्भूतिवर्धनः ॥ ८२ ॥ जयावती कालकारी कल्क्यविद्या विधानवित् । लज्जातीता
    लक्षणाङ्गो विषपायी मदाश्रयः ॥ ८३ ॥ विदेशिनी विदेशस्थोऽपापा पापवर्जितः । अतिक्षोभा कलातीतो निरिन्द्रियगणोदया
    ॥ ८४ ॥ वाचालो वचनग्रन्थिमन्दरो वेदमन्दिरा । पञ्चमः पञ्चमीदुर्गो दुर्गा दुर्गतिनाशनः ॥ ८५ ॥ दुर्गन्धा
    गन्धराजश्च सुगन्धा गन्धचालनः । चार्वङ्गी चर्वणप्रीतो विशङ्का मरलारवित् ॥ ८६ ॥ अतिथिस्था स्थावराद्या
    जपस्था जपमालिनी । वसुन्धरसुता तार्क्षी तार्कीकः प्राणतार्कीकः ॥ ८७ ॥ तालवृक्षावृतोन्नासा तालजाया जटाधरः
    । जटिलेशी जटाधारी सप्तमीशः प्रसप्तमी ॥ ८८ ॥ अष्टमीवेशकृत् काली सर्वः सर्वेश्वरीश्वरः । शत्रुहन्त्री
    नित्यमन्त्री तरुणी तारकाश्रयः ॥ ८९ ॥ धर्मगुप्तिः सारगुप्तो मनोयोगा विषापहः । वज्रावीरः सुरासौरी चन्द्रिका
    चन्द्रशेखरः ॥ ९० ॥ विटपीन्द्रा वटस्थानी भद्रपालः कुलेश्वरः । चातकाद्या चन्द्रदेहः प्रियाभार्या मनोयवः
    ॥ ९१ ॥ तीर्थपुण्या तीर्थयोगी जलजा जलशायकः । भूतेश्वरप्रियाभूतो भगमाला भगाननः ॥ ९२ ॥ भगिनी भगवान् भोग्या
    भवती भीमलोचनः । भृगुपुत्री भार्गवेशः प्रलयालयकारणः ॥ ९३ ॥ रुद्राणी रुद्रगणपो रौद्राक्षी क्षीणवाहनः
    । कुम्भान्तका निकुम्भारिः कुम्भान्ती कुम्भिनीरगः ॥ ९४ ॥ कूष्माण्डी धनरत्नाढ्यो महोग्राग्राहकः शुभा
    । शिविरस्था शिवानन्दः शवासनकृतासनी ॥ ९५ ॥ प्रशंसा समनः प्राज्ञा विभाव्या भव्यलोचनः । कुरुविद्या कौरवंशः
    कुलकन्या मृणालधृक् ॥ ९६ ॥ द्विदलस्था परानन्दो नन्दिसेव्या बृहन्नला । व्याससेव्या व्यासपूज्यो धरणी
    धीरलोचनः ॥ ९७ ॥ त्रिविधारण्या तुलाकोटिः कार्पासा खार्पराङ्गधृक् । वशिष्ठाराधिताविष्टो वशगा वशजीवनः
    ॥ ९८ ॥ खड्गहस्ता खड्गधारी शूलहस्ता विभाकरः । अतुला तुलनाहीनो विविधा ध्याननिर्णयः ॥ ९९ ॥ अप्रकाश्या
    विशोध्यश्च चामुण्डा चण्डवाहनः । गिरिजा गायनोन्मत्तो मलामाली चलाधमः ॥ १०० ॥ पिङ्गदेहा पिङ्गकेशोऽसमर्था
    शीलवाहनः । गारुडी गरुडानन्दो विशोका वंशवर्धनः ॥ १०१ ॥ वेणीन्द्रा चातकप्रायो विद्याद्या दोषमर्दकः ।
    अट्टहासा अट्टहासो मधुभक्षा मधुव्रतः ॥ १०२ ॥ मधुरानन्दसम्पन्ना माधवो मधुनाशिका । माकरी मकरप्रेमो माघस्था
    मघवाहनः ॥ १०३ ॥ विशाखा सुसखा सूक्ष्मा ज्येष्ठो ज्येष्ठजनप्रिया । आषाढनिलयाषाढो मिथिला मैथिलीश्वरः
    ॥ १०४ ॥ शीतशैत्यगतो वाणी विमलालक्षणेश्वरः । अकार्यकार्यजनको भद्रा भाद्रपदीयकः ॥ १०५ ॥ प्रवरा वरहंसाख्यः
    पवशोभा पुराणवित् । श्रावणी हरिनाथश्च श्रवणा श्रवणाङ्कुरः ॥ १०६ ॥ सुकर्त्री साधनाध्यक्षो विशोध्या शुद्धभावनः
    । एकशेषा शशिधरो धरान्तः स्थावराधरः ॥ १०७ ॥ धर्मपुत्री धर्ममात्रो विजया जयदायकः । दासरक्षादि विदशकलापो
    विधवापतिः ॥ १०८ ॥ विधवाधवलो धूर्तः धूर्ताढ्यो धूर्तपालिका । शङ्करः कामगामी च देवला देवमायिका ॥ १०९
    ॥ विनाशो मन्दराच्छन्ना मन्दरस्थो महाद्वया । अतिपुत्री त्रिमुण्डी च मुण्डमाला त्रिचण्डिका ॥ ११० ॥ कर्कटीशः
    कोटरश्च सिंहिका सिंहवाहनः । नारसिंही नृसिंहश्च नर्मदा जाह्नवीपतिः ॥ १११ ॥ त्रिविधस्त्री त्रिसर्गास्त्रो
    दिगम्बरो दिगम्बरी । मुञ्चानो मञ्चभेदी च मालञ्चा चञ्चलाग्रजः ॥ ११२ ॥ कटुतुङ्गी विकाशात्मा ऋद्धिस्पष्टाक्षरोऽन्तरा
    । विरिञ्चः प्रभवानन्दो नन्दिनी मन्दराद्रिधृक् ॥ ११३ ॥ कालिकाभा काञ्चनाभो मदिराद्या मदोदयः । द्रविडस्था
    दाडिमस्थो मज्जातीता मरुद्गतिः ॥ ११४ ॥ क्षान्तिप्रज्ञो विधिप्रज्ञा वीतिज्ञोत्सुकनिश्चया । अभावो मलिनाकारा
    कारागारा विचारहा ॥ ११५ ॥ शब्दः कटाहभेदात्मा शिशुलोकप्रपालिका । अतिविस्तारवदनो विभवानन्दमानसा ॥ ११६
    ॥ आकाशवसनोन्मादी मेपुरा मांसचर्वणः । अतिकान्ता प्रशान्तात्मा नित्यगुह्या गभीरगः ॥ ११७ ॥ त्रिगम्भीरा
    तत्त्ववासी राक्षसी पूतनाक्षरः । अभोगगणिका हस्ती गणेशजननीश्वरः ॥ ११८ ॥ कुण्डपालककर्ता च त्रिरूण्डा
    रुण्डभालधृक् । अतिशक्ता विशक्तात्मा देव्याङ्गी नन्दनाश्रयः ॥ ११९ ॥ भावनीया भ्रान्तिहरः कापिलाभा मनोहरः
    । आर्यादेवी नीलवर्णा सायको बलवीर्यदा ॥ १२० ॥ सुखदो मोक्षदाताऽतो जननी वाञ्छितप्रदः । चातिरूपा विरूपस्थो
    वाच्या वाच्यविवर्जितः ॥ १२१ ॥ महालिङ्गसमुत्पन्ना काकभेरी नदस्थितः । आत्मारामकलाकायः सिद्धिदाता गणेश्वरी
    ॥ १२२ ॥ कल्पद्रुमः कल्पलता कुलवृक्षः कुलद्रुमा । सुमना श्रीगुरुमयी गुरुमन्त्रप्रदायकः ॥ १२३ ॥ अनन्तशयनाऽनन्तो
    जलेशी जह्नजेश्वरः । गङ्गा गङ्गाधरः श्रीदा भास्करेशो महाबला ॥ १२४ ॥ गुप्ताक्षरो विधिरता विधानपुरुषेश्वरः
    । सिद्धकलङ्का कुण्डाली वाग्देवः पञ्चदेवता ॥ १२५ ॥ अल्पातीता मनोहारी त्रिविधा तत्त्वलोचना । अमायापतिर्भूभ्रान्तिः
    पाञ्चजन्यधरोऽग्रजा ॥ १२६ ॥ अतितप्तः कामतप्ता मायामोहविवर्जितः । आर्या पुत्रीश्वरः स्थाणुः कृशानुस्था
    जलाप्लुतः ॥ १२७ ॥ वारुणी मदिरामत्तो मांसप्रेमदिगम्बरा । अन्तरस्थो देहसिद्धा कालानलसुराद्रिपः ॥ १२८
    ॥ आकाशवाहिनी देवः काकिनीशो दिगम्बरी । काकचञ्चुपुटमधुहरो गगनमाब्धिपा ॥ १२९ ॥ मुद्राहारी महामुद्रा मीनपो
    मीनभक्षिणी । शाकिनी शिवनाथेशः काकोर्ध्वेशी सदाशिवः ॥ १३० ॥ कमला कण्ठकमलः स्थायुकः प्रेमनायिका । मृणालमालाधारी
    च मृणालमालामालिनी ॥ १३१ ॥ अनादिनिधना तारा दुर्गतारा निरक्षरा । सर्वाक्षरा सर्ववर्णा सर्वमन्त्राक्षमालिका
    ॥ १३२ ॥ आनन्दभैरवो नीलकण्ठो ब्रह्माण्डमण्डितः । शिवो विश्वेश्वरोऽनन्तः सर्वातीतो निरञ्जनः ॥ १३३ ॥
    इति ते कथितं नाथ त्रैलोक्यसारमङ्गलम् । भुवनमङ्गलं नाम महापातकनाशनम् ॥ १३४ ॥ अस्य प्रपठनेऽपि च यत्फलं
    लभते नरः । तत्सर्वं कथितुं नालं कोटिवर्षशतैरपि ॥ १३५ ॥ तथापि तव यत्नेन फलं श
