    ॥ गहि गिरि पादप उपल नख धाए कीस रिसाइ। चले तमीचर बिकलतर गढ़ पर चढ़ए पराइ ॥ ॥ मेघनाद के मुरछा जागी।
    पितहि बिलोकि लाज अति लागी ॥ तुरत गयु गिरिबर कन्दरा। करौं अजय मख अस मन धरा ॥ इहाँ बिभीषन मन्त्र बिचारा।
    सुनहु नाथ बल अतुल उदारा ॥ मेघनाद मख करि अपावन। खल मायावी देव सतावन ॥ जौं प्रभु सिद्ध होइ सो पाइहि।
    नाथ बेगि पुनि जीति न जाइहि ॥ सुनि रघुपति अतिसय सुख माना। बोले अङ्गदादि कपि नाना ॥ लछिमन सङ्ग जाहु
    सब भाई। करहु बिधंस जग्य कर जाई ॥ तुम्ह लछिमन मारेहु रन ओही। देखि सभय सुर दुख अति मोही ॥ मारेहु तेहि
    बल बुद्धि उपाई। जेहिं छीजै निसिचर सुनु भाई ॥ जामवन्त सुग्रीव बिभीषन। सेन समेत रहेहु तीनिउ जन ॥ जब
    रघुबीर दीन्हि अनुसासन। कटि निषङ्ग कसि साजि सरासन ॥ प्रभु प्रताप उर धरि रनधीरा। बोले घन इव गिरा गँभीरा
    ॥ जौं तेहि आजु बधें बिनु आवौं। तौ रघुपति सेवक न कहावौम् ॥ जौं सत सङ्कर करहिं सहाई। तदपि हतुँ रघुबीर
    दोहाई ॥ दो रघुपति चरन नाइ सिरु चलेउ तुरन्त अनन्त। अङ्गद नील मयन्द नल सङ्ग सुभट हनुमन्त ॥ ॥ जाइ कपिन्ह
    सो देखा बैसा। आहुति देत रुधिर अरु भैंसा ॥ कीन्ह कपिन्ह सब जग्य बिधंसा। जब न उठि तब करहिं प्रसंसा ॥
    तदपि न उठि धरेन्हि कच जाई। लातन्हि हति हति चले पराई ॥ लै त्रिसुल धावा कपि भागे। आए जहँ रामानुज आगे
    ॥ आवा परम क्रोध कर मारा। गर्ज घोर रव बारहिं बारा ॥ कोऽपि मरुतसुत अङ्गद धाए। हति त्रिसूल उर धरनि गिराए
    ॥ प्रभु कहँ छाँड़एसि सूल प्रचण्डा। सर हति कृत अनन्त जुग खण्डा ॥ उठि बहोरि मारुति जुबराजा। हतहिं कोऽपि
    तेहि घाउ न बाजा ॥ फिरे बीर रिपु मरि न मारा। तब धावा करि घोर चिकारा ॥ आवत देखि क्रुद्ध जनु काला। लछिमन
    छाड़ए बिसिख कराला ॥ देखेसि आवत पबि सम बाना। तुरत भयु खल अन्तरधाना ॥ बिबिध बेष धरि करि लराई। कबहुँक
    प्रगट कबहुँ दुरि जाई ॥ देखि अजय रिपु डरपे कीसा। परम क्रुद्ध तब भयु अहीसा ॥ लछिमन मन अस मन्त्र दृढ़आवा।
    एहि पापिहि मैं बहुत खेलावा ॥ सुमिरि कोसलाधीस प्रतापा। सर सन्धान कीन्ह करि दापा ॥ छाड़आ बान माझ उर
    लागा। मरती बार कपटु सब त्यागा ॥ दो रामानुज कहँ रामु कहँ अस कहि छाँड़एसि प्रान। धन्य धन्य तव जननी कह
    अङ्गद हनुमान ॥ ॥ बिनु प्रयास हनुमान उठायो। लङ्का द्वार राखि पुनि आयो ॥ तासु मरन सुनि सुर गन्धर्बा।
    चढ़इ बिमान आए नभ सर्बा ॥ बरषि सुमन दुन्दुभीं बजावहिं। श्रीरघुनाथ बिमल जसु गावहिम् ॥ जय अनन्त जय जगदाधारा।
    तुम्ह प्रभु सब देवन्हि निस्तारा ॥ अस्तुति करि सुर सिद्ध सिधाए। लछिमन कृपासिन्धु पहिं आए ॥ सुत बध सुना
    दसानन जबहीं। मुरुछित भयु परेउ महि तबहीम् ॥ मन्दोदरी रुदन कर भारी। उर ताड़न बहु भाँति पुकारी ॥ नगर
    लोग सब ब्याकुल सोचा। सकल कहहिं दसकन्धर पोचा ॥ दो तब दसकण्ठ बिबिध बिधि समुझाईं सब नारि। नस्वर रूप जगत
    सब देखहु हृदयँ बिचारि ॥ ॥ तिन्हहि ग्यान उपदेसा रावन। आपुन मन्द कथा सुभ पावन ॥ पर उपदेस कुसल बहुतेरे।
    जे आचरहिं ते नर न घनेरे ॥ निसा सिरानि भयु भिनुसारा। लगे भालु कपि चारिहुँ द्वारा ॥ सुभट बोलाइ दसानन
    बोला। रन सन्मुख जा कर मन डोला ॥ सो अबहीं बरु जाउ पराई। सञ्जुग बिमुख भेँ न भलाई ॥ निज भुज बल मैं बयरु
    बढ़आवा। देहुँ उतरु जो रिपु चढ़इ आवा ॥ अस कहि मरुत बेग रथ साजा। बाजे सकल जुझ् बाजा ॥ चले बीर सब अतुलित
    बली। जनु कज्जल कै आँधी चली ॥ असगुन अमित होहिं तेहि काला। गनि न भुजबल गर्ब बिसाला ॥ छं अति गर्ब गनि
    न सगुन असगुन स्त्रवहिं आयुध हाथ ते। भट गिरत रथ ते बाजि गज चिक्करत भाजहिं साथ ते ॥ गोमाय गीध कराल खर
    रव स्वान बोलहिं अति घने। जनु कालदूत उलूक बोलहिं बचन परम भयावने ॥ दो ताहि कि सम्पति सगुन सुभ सपनेहुँ
    मन बिश्राम। भूत द्रोह रत मोहबस राम बिमुख रति काम ॥ ॥ चलेउ निसाचर कटकु अपारा। चतुरङ्गिनी अनी बहु धारा
    ॥ बिबिध भाँति बाहन रथ जाना। बिपुल बरन पताक ध्वज नाना ॥ चले मत्त गज जूथ घनेरे। प्राबिट जलद मरुत जनु
    प्रेरे ॥ बरन बरद बिरदैत निकाया। समर सूर जानहिं बहु माया ॥ अति बिचित्र बाहिनी बिराजी। बीर बसन्त सेन
    जनु साजी ॥ चलत कटक दिगसिधुंर डगहीं। छुभित पयोधि कुधर डगमगहीम् ॥ उठी रेनु रबि गयु छपाई। मरुत थकित बसुधा
    अकुलाई ॥ पनव निसान घोर रव बाजहिं। प्रलय समय के घन जनु गाजहिम् ॥ भेरि नफीरि बाज सहनाई। मारू राग सुभट
    सुखदाई ॥ केहरि नाद बीर सब करहीं। निज निज बल पौरुष उच्चरहीम् ॥ कहि दसानन सुनहु सुभट्टा। मर्दहु भालु
    कपिन्ह के ठट्टा ॥ हौं मारिहुँ भूप द्वौ भाई। अस कहि सन्मुख फौज रेङ्गाई ॥ यह सुधि सकल कपिन्ह जब पाई।
    धाए करि रघुबीर दोहाई ॥ छं धाए बिसाल कराल मर्कट भालु काल समान ते। मानहुँ सपच्छ उड़आहिं भूधर बृन्द नाना
    बान ते ॥ नख दसन सैल महाद्रुमायुध सबल सङ्क न मानहीं। जय राम रावन मत्त गज मृगराज सुजसु बखानहीम् ॥ दो
    दुहु दिसि जय जयकार करि निज निज जोरी जानि। भिरे बीर इत रामहि उत रावनहि बखानि ॥ ॥ रावनु रथी बिरथ रघुबीरा।
    देखि बिभीषन भयु अधीरा ॥ अधिक प्रीति मन भा सन्देहा। बन्दि चरन कह सहित सनेहा ॥ नाथ न रथ नहिं तन पद त्राना।
    केहि बिधि जितब बीर बलवाना ॥ सुनहु सखा कह कृपानिधाना। जेहिं जय होइ सो स्यन्दन आना ॥ सौरज धीरज तेहि
    रथ चाका। सत्य सील दृढ़ ध्वजा पताका ॥ बल बिबेक दम परहित घोरे। छमा कृपा समता रजु जोरे ॥ ईस भजनु सारथी
    सुजाना। बिरति चर्म सन्तोष कृपाना ॥ दान परसु बुधि सक्ति प्रचण्ड़आ। बर बिग्यान कठिन कोदण्डा ॥ अमल अचल
    मन त्रोन समाना। सम जम नियम सिलीमुख नाना ॥ कवच अभेद बिप्र गुर पूजा। एहि सम बिजय उपाय न दूजा ॥ सखा धर्ममय
    अस रथ जाकें। जीतन कहँ न कतहुँ रिपु ताकेम् ॥ दो महा अजय संसार रिपु जीति सकि सो बीर। जाकें अस रथ होइ
    दृढ़ सुनहु सखा मतिधीर ॥ ॥ सुनि प्रभु बचन बिभीषन हरषि गहे पद कञ्ज। एहि मिस मोहि उपदेसेहु राम कृपा सुख
    पुञ्ज ॥ ॥ उत पचार दसकन्धर इत अङ्गद हनुमान। लरत निसाचर भालु कपि करि निज निज प्रभु आन ॥ ॥ सुर ब्रह्मादि
    सिद्ध मुनि नाना। देखत रन नभ चढ़ए बिमाना ॥ हमहू उमा रहे तेहि सङ्गा। देखत राम चरित रन रङ्गा ॥ सुभट समर
    रस दुहु दिसि माते। कपि जयसील राम बल ताते ॥ एक एक सन भिरहिं पचारहिं। एकन्ह एक मर्दि महि पारहिम् ॥ मारहिं
    काटहिं धरहिं पछारहिं। सीस तोरि सीसन्ह सन मारहिम् ॥ उदर बिदारहिं भुजा उपारहिं। गहि पद अवनि पटकि भट
    डारहिम् ॥ निसिचर भट महि गाड़हि भालू। ऊपर ढारि देहिं बहु बालू ॥ बीर बलिमुख जुद्ध बिरुद्धे। देखिअत बिपुल
    काल जनु क्रुद्धे ॥ छं क्रुद्धे कृतान्त समान कपि तन स्त्रवत सोनित राजहीं। मर्दहिं निसाचर कटक भट बलवन्त
    घन जिमि गाजहीम् ॥ मारहिं चपेटन्हि डाटि दातन्ह काटि लातन्ह मीजहीं। चिक्करहिं मर्कट भालु छल बल करहिं
    जेहिं खल छीजहीम् ॥ धरि गाल फारहिं उर बिदारहिं गल अँतावरि मेलहीं। प्रहलादपति जनु बिबिध तनु धरि समर
    अङ्गन खेलहीम् ॥ धरु मारु काटु पछारु घोर गिरा गगन महि भरि रही। जय राम जो तृन ते कुलिस कर कुलिस ते कर
    तृन सही ॥ दो निज दल बिचलत देखेसि बीस भुजाँ दस चाप। रथ चढ़इ चलेउ दसानन फिरहु फिरहु करि दाप ॥ ॥ धायु
    परम क्रुद्ध दसकन्धर। सन्मुख चले हूह दै बन्दर ॥ गहि कर पादप उपल पहारा। डारेन्हि ता पर एकहिं बारा ॥
    लागहिं सैल बज्र तन तासू। खण्ड खण्ड होइ फूटहिं आसू ॥ चला न अचल रहा रथ रोपी। रन दुर्मद रावन अति कोपी
    ॥ इत उत झपटि दपटि कपि जोधा। मर्दै लाग भयु अति क्रोधा ॥ चले पराइ भालु कपि नाना। त्राहि त्राहि अङ्गद
    हनुमाना ॥ पाहि पाहि रघुबीर गोसाई। यह खल खाइ काल की नाई ॥ तेहि देखे कपि सकल पराने। दसहुँ चाप सायक सन्धाने
    ॥ छं सन्धानि धनु सर निकर छाड़एसि उरग जिमि उड़इ लागहीं। रहे पूरि सर धरनी गगन दिसि बिदसि कहँ कपि भागहीम्
    ॥ भयो अति कोलाहल बिकल कपि दल भालु बोलहिं आतुरे। रघुबीर करुना सिन्धु आरत बन्धु जन रच्छक हरे ॥ दो निज
    दल बिकल देखि कटि कसि निषङ्ग धनु हाथ। लछिमन चले क्रुद्ध होइ नाइ राम पद माथ ॥ ॥ रे खल का मारसि कपि भालू।
    मोहि बिलोकु तोर मैं कालू ॥ खोजत रहेउँ तोहि सुतघाती। आजु निपाति जुड़आवुँ छाती ॥ अस कहि छाड़एसि बान
    प्रचण्डा। लछिमन किए सकल सत खण्डा ॥ कोटिन्ह आयुध रावन डारे। तिल प्रवान करि काटि निवारे ॥ पुनि निज बानन्ह
    कीन्ह प्रहारा। स्यन्दनु भञ्जि सारथी मारा ॥ सत सत सर मारे दस भाला। गिरि सृङ्गन्ह जनु प्रबिसहिं ब्याला
    ॥ पुनि सत सर मारा उर माहीं। परेउ धरनि तल सुधि कछु नाहीम् ॥ उठा प्रबल पुनि मुरुछा जागी। छाड़इसि ब्रह्म
    दीन्हि जो साँगी ॥ छं सो ब्रह्म दत्त प्रचण्ड सक्ति अनन्त उर लागी सही। पर्यो बीर बिकल उठाव दसमुख अतुल
    बल महिमा रही ॥ ब्रह्माण्ड भवन बिराज जाकें एक सिर जिमि रज कनी। तेहि चह उठावन मूढ़ रावन जान नहिं त्रिभुअन
    धनी ॥ दो देखि पवनसुत धायु बोलत बचन कठोर। आवत कपिहि हन्यो तेहिं मुष्टि प्रहार प्रघोर ॥ ॥ जानु टेकि
    कपि भूमि न गिरा। उठा सँभारि बहुत रिस भरा ॥ मुठिका एक ताहि कपि मारा। परेउ सैल जनु बज्र प्रहारा ॥ मुरुछा
    गै बहोरि सो जागा। कपि बल बिपुल सराहन लागा ॥ धिग धिग मम पौरुष धिग मोही। जौं तैं जिअत रहेसि सुरद्रोही
    ॥ अस कहि लछिमन कहुँ कपि ल्यायो। देखि दसानन बिसमय पायो ॥ कह रघुबीर समुझु जियँ भ्राता। तुम्ह कृतान्त
    भच्छक सुर त्राता ॥ सुनत बचन उठि बैठ कृपाला। गी गगन सो सकति कराला ॥ पुनि कोदण्ड बान गहि धाए। रिपु सन्मुख
    अति आतुर आए ॥ छं आतुर बहोरि बिभञ्जि स्यन्दन सूत हति ब्याकुल कियो। गिर् यो धरनि दसकन्धर बिकलतर बान
    सत बेध्यो हियो ॥ सारथी दूसर घालि रथ तेहि तुरत लङ्का लै गयो। रघुबीर बन्धु प्रताप पुञ्ज बहोरि प्रभु
    चरनन्हि नयो ॥ दो उहाँ दसानन जागि करि करै लाग कछु जग्य। राम बिरोध बिजय चह सठ हठ बस अति अग्य ॥ ॥ इहाँ
    बिभीषन सब सुधि पाई। सपदि जाइ रघुपतिहि सुनाई ॥ नाथ करि रावन एक जागा। सिद्ध भेँ नहिं मरिहि अभागा ॥ पठवहु
    नाथ बेगि भट बन्दर। करहिं बिधंस आव दसकन्धर ॥ प्रात होत प्रभु सुभट पठाए। हनुमदादि अङ्गद सब धाए ॥ कौतुक
    कूदि चढ़ए कपि लङ्का। पैठे रावन भवन असङ्का ॥ जग्य करत जबहीं सो देखा। सकल कपिन्ह भा क्रोध बिसेषा ॥ रन
    ते निलज भाजि गृह आवा। इहाँ आइ बक ध्यान लगावा ॥ अस कहि अङ्गद मारा लाता। चितव न सठ स्वारथ मन राता ॥
    छं नहिं चितव जब करि कोप कपि गहि दसन लातन्ह मारहीं। धरि केस नारि निकारि बाहेर तेऽतिदीन पुकारहीम् ॥
    तब उठेउ क्रुद्ध कृतान्त सम गहि चरन बानर डारी। एहि बीच कपिन्ह बिधंस कृत मख देखि मन महुँ हारी ॥ दो जग्य
    बिधंसि कुसल कपि आए रघुपति पास। चलेउ निसाचर क्रुर्द्ध होइ त्यागि जिवन कै आस ॥ ॥ चलत होहिं अति असुभ
    भयङ्कर। बैठहिं गीध उड़आइ सिरन्ह पर ॥ भयु कालबस काहु न माना। कहेसि बजावहु जुद्ध निसाना ॥ चली तमीचर
    अनी अपारा। बहु गज रथ पदाति असवारा ॥ प्रभु सन्मुख धाए खल कैंसें। सलभ समूह अनल कहँ जैंसेम् ॥ इहाँ देवतन्ह
    अस्तुति कीन्ही। दारुन बिपति हमहि एहिं दीन्ही ॥ अब जनि राम खेलावहु एही। अतिसय दुखित होति बैदेही ॥ देव
    बचन सुनि प्रभु मुसकाना। उठि रघुबीर सुधारे बाना। जटा जूट दृढ़ बाँधै माथे। सोहहिं सुमन बीच बिच गाथे
    ॥ अरुन नयन बारिद तनु स्यामा। अखिल लोक लोचनाभिरामा ॥ कटितट परिकर कस्यो निषङ्गा। कर कोदण्ड कठिन सारङ्गा
    ॥ छं सारङ्ग कर सुन्दर निषङ्ग सिलीमुखाकर कटि कस्यो। भुजदण्ड पीन मनोहरायत उर धरासुर पद लस्यो ॥ कह दास
    तुलसी जबहिं प्रभु सर चाप कर फेरन लगे। ब्रह्माण्ड दिग्गज कमठ अहि महि सिन्धु भूधर डगमगे ॥ दो सोभा देखि
    हरषि सुर बरषहिं सुमन अपार। जय जय जय करुनानिधि छबि बल गुन आगार ॥ ॥ एहीं बीच निसाचर अनी। कसमसात आई अति
    घनी। देखि चले सन्मुख कपि भट्टा। प्रलयकाल के जनु घन घट्टा ॥ बहु कृपान तरवारि चमङ्कहिं। जनु दहँ दिसि
    दामिनीं दमङ्कहिम् ॥ गज रथ तुरग चिकार कठोरा। गर्जहिं मनहुँ बलाहक घोरा ॥ कपि लङ्गूर बिपुल नभ छाए। मनहुँ
    इन्द्रधनु उए सुहाए ॥ उठि धूरि मानहुँ जलधारा। बान बुन्द भै बृष्टि अपारा ॥ दुहुँ दिसि पर्बत करहिं प्रहारा।
    बज्रपात जनु बारहिं बारा ॥ रघुपति कोऽपि बान झरि लाई। घायल भै निसिचर समुदाई ॥ लागत बान बीर चिक्करहीं।
    घुर्मि घुर्मि जहँ तहँ महि परहीम् ॥ स्त्रवहिं सैल जनु निर्झर भारी। सोनित सरि कादर भयकारी ॥ छं कादर
    भयङ्कर रुधिर सरिता चली परम अपावनी। दौ कूल दल रथ रेत चक्र अबर्त बहति भयावनी ॥ जल जन्तुगज पदचर तुरग
    खर बिबिध बाहन को गने। सर सक्ति तोमर सर्प चाप तरङ्ग चर्म कमठ घने ॥ दो बीर परहिं जनु तीर तरु मज्जा बहु
    बह फेन। कादर देखि डरहिं तहँ सुभटन्ह के मन चेन ॥ ॥ मज्जहि भूत पिसाच बेताला। प्रमथ महा झोटिङ्ग कराला
    ॥ काक कङ्क लै भुजा उड़आहीं। एक ते छीनि एक लै खाहीम् ॥ एक कहहिं ऐसिउ सौङ्घाई। सठहु तुम्हार दरिद्र न
    जाई ॥ कहँरत भट घायल तट गिरे। जहँ तहँ मनहुँ अर्धजल परे ॥ खैञ्चहिं गीध आँत तट भे। जनु बंसी खेलत चित
    दे ॥ बहु भट बहहिं चढ़ए खग जाहीं। जनु नावरि खेलहिं सरि माहीम् ॥ जोगिनि भरि भरि खप्पर सञ्चहिं। भूत पिसाच
    बधू नभ नञ्चहिम् ॥ भट कपाल करताल बजावहिं। चामुण्डा नाना बिधि गावहिम् ॥ जम्बुक निकर कटक्कट कट्टहिं।
    खाहिं हुआहिं अघाहिं दपट्टहिम् ॥ कोटिन्ह रुण्ड मुण्ड बिनु डोल्लहिं। सीस परे महि जय जय बोल्लहिम् ॥ छं
    बोल्लहिं जो जय जय मुण्ड रुण्ड प्रचण्ड सिर बिनु धावहीं। खप्परिन्ह खग्ग अलुज्झि जुज्झहिं सुभट भटन्ह
    ढहावहीम् ॥ बानर निसाचर निकर मर्दहिं राम बल दर्पित भे। सङ्ग्राम अङ्गन सुभट सोवहिं राम सर निकरन्हि हे
    ॥ दो रावन हृदयँ बिचारा भा निसिचर सङ्घार। मैं अकेल कपि भालु बहु माया करौं अपार ॥ ॥ देवन्ह प्रभुहि पयादें
    देखा। उपजा उर अति छोभ बिसेषा ॥ सुरपति निज रथ तुरत पठावा। हरष सहित मातलि लै आवा ॥ तेज पुञ्ज रथ दिब्य
    अनूपा। हरषि चढ़ए कोसलपुर भूपा ॥ चञ्चल तुरग मनोहर चारी। अजर अमर मन सम गतिकारी ॥ रथारूढ़ रघुनाथहि देखी।
    धाए कपि बलु पाइ बिसेषी ॥ सही न जाइ कपिन्ह कै मारी। तब रावन माया बिस्तारी ॥ सो माया रघुबीरहि बाँची।
    लछिमन कपिन्ह सो मानी साँची ॥ देखी कपिन्ह निसाचर अनी। अनुज सहित बहु कोसलधनी ॥ छं बहु राम लछिमन देखि
    मर्कट भालु मन अति अपडरे। जनु चित्र लिखित समेत लछिमन जहँ सो तहँ चितवहिं खरे ॥ निज सेन चकित बिलोकि हँसि
    सर चाप सजि कोसल धनी। माया हरी हरि निमिष महुँ हरषी सकल मर्कट अनी ॥ दो बहुरि राम सब तन चिति बोले बचन
    गँभीर। द्वन्दजुद्ध देखहु सकल श्रमित भे अति बीर ॥ ॥ अस कहि रथ रघुनाथ चलावा। बिप्र चरन पङ्कज सिरु नावा
    ॥ तब लङ्केस क्रोध उर छावा। गर्जत तर्जत सन्मुख धावा ॥ जीतेहु जे भट सञ्जुग माहीं। सुनु तापस मैं तिन्ह
    सम नाहीम् ॥ रावन नाम जगत जस जाना। लोकप जाकें बन्दीखाना ॥ खर दूषन बिराध तुम्ह मारा। बधेहु ब्याध इव
    बालि बिचारा ॥ निसिचर निकर सुभट सङ्घारेहु। कुम्भकरन घननादहि मारेहु ॥ आजु बयरु सबु लेउँ निबाही। जौं
    रन भूप भाजि नहिं जाहीम् ॥ आजु करुँ खलु काल हवाले। परेहु कठिन रावन के पाले ॥ सुनि दुर्बचन कालबस जाना।
    बिहँसि बचन कह कृपानिधाना ॥ सत्य सत्य सब तव प्रभुताई। जल्पसि जनि देखाउ मनुसाई ॥ छं जनि जल्पना करि सुजसु
    नासहि नीति सुनहि करहि छमा। संसार महँ पूरुष त्रिबिध पाटल रसाल पनस समा ॥ एक सुमनप्रद एक सुमन फल एक फलि
    केवल लागहीं। एक कहहिं कहहिं करहिं अपर एक करहिं कहत न बागहीम् ॥ दो राम बचन सुनि बिहँसा मोहि सिखावत
    ग्यान। बयरु करत नहिं तब डरे अब लागे प्रिय प्रान ॥ ॥ कहि दुर्बचन क्रुद्ध दसकन्धर। कुलिस समान लाग छाँड़ऐ
    सर ॥ नानाकार सिलीमुख धाए। दिसि अरु बिदिस गगन महि छाए ॥ पावक सर छाँड़एउ रघुबीरा। छन महुँ जरे निसाचर
    तीरा ॥ छाड़इसि तीब्र सक्ति खिसिआई। बान सङ्ग प्रभु फेरि चलाई ॥ कोटिक चक्र त्रिसूल पबारै। बिनु प्रयास
    प्रभु काटि निवारै ॥ निफल होहिं रावन सर कैसें। खल के सकल मनोरथ जैसेम् ॥ तब सत बान सारथी मारेसि। परेउ
    भूमि जय राम पुकारेसि ॥ राम कृपा करि सूत उठावा। तब प्रभु परम क्रोध कहुँ पावा ॥ छं भे क्रुद्ध जुद्ध
    बिरुद्ध रघुपति त्रोन सायक कसमसे। कोदण्ड धुनि अति चण्ड सुनि मनुजाद सब मारुत ग्रसे ॥ मँदोदरी उर कम्प
    कम्पति कमठ भू भूधर त्रसे। चिक्करहिं दिग्गज दसन गहि महि देखि कौतुक सुर हँसे ॥ दो तानेउ चाप श्रवन लगि
    छाँड़ए बिसिख कराल। राम मारगन गन चले लहलहात जनु ब्याल ॥ ॥ चले बान सपच्छ जनु उरगा। प्रथमहिं हतेउ सारथी
    तुरगा ॥ रथ बिभञ्जि हति केतु पताका। गर्जा अति अन्तर बल थाका ॥ तुरत आन रथ चढ़इ खिसिआना। अस्त्र सस्त्र
    छाँड़एसि बिधि नाना ॥ बिफल होहिं सब उद्यम ताके। जिमि परद्रोह निरत मनसा के ॥ तब रावन दस सूल चलावा। बाजि
    चारि महि मारि गिरावा ॥ तुरग उठाइ कोऽपि रघुनायक। खैञ्चि सरासन छाँड़ए सायक ॥ रावन सिर सरोज बनचारी। चलि
    रघुबीर सिलीमुख धारी ॥ दस दस बान भाल दस मारे। निसरि गे चले रुधिर पनारे ॥ स्त्रवत रुधिर धायु बलवाना।
    प्रभु पुनि कृत धनु सर सन्धाना ॥ तीस तीर रघुबीर पबारे। भुजन्हि समेत सीस महि पारे ॥ काटतहीं पुनि भे
    नबीने। राम बहोरि भुजा सिर छीने ॥ प्रभु बहु बार बाहु सिर हे। कटत झटिति पुनि नूतन भे ॥ पुनि पुनि प्रभु
    काटत भुज सीसा। अति कौतुकी कोसलाधीसा ॥ रहे छाइ नभ सिर अरु बाहू। मानहुँ अमित केतु अरु राहू ॥ छं जनु
    राहु केतु अनेक नभ पथ स्त्रवत सोनित धावहीं। रघुबीर तीर प्रचण्ड लागहिं भूमि गिरन न पावहीम् ॥ एक एक सर
    सिर निकर छेदे नभ उड़त इमि सोहहीं। जनु कोऽपि दिनकर कर निकर जहँ तहँ बिधुन्तुद पोहहीम् ॥ दो जिमि जिमि
    प्रभु हर तासु सिर तिमि तिमि होहिं अपार। सेवत बिषय बिबर्ध जिमि नित नित नूतन मार ॥ ॥ दसमुख देखि सिरन्ह
    कै बाढ़ई। बिसरा मरन भी रिस गाढ़ई ॥ गर्जेउ मूढ़ महा अभिमानी। धायु दसहु सरासन तानी ॥ समर भूमि दसकन्धर
    कोप्यो। बरषि बान रघुपति रथ तोप्यो ॥ दण्ड एक रथ देखि न परेऊ। जनु निहार महुँ दिनकर दुरेऊ ॥ हाहाकार सुरन्ह
    जब कीन्हा। तब प्रभु कोऽपि कारमुक लीन्हा ॥ सर निवारि रिपु के सिर काटे। ते दिसि बिदिस गगन महि पाटे ॥
    काटे सिर नभ मारग धावहिं। जय जय धुनि करि भय उपजावहिम् ॥ कहँ लछिमन सुग्रीव कपीसा। कहँ रघुबीर कोसलाधीसा
    ॥ छं कहँ रामु कहि सिर निकर धाए देखि मर्कट भजि चले। सन्धानि धनु रघुबंसमनि हँसि सरन्हि सिर बेधे भले
    ॥ सिर मालिका कर कालिका गहि बृन्द बृन्दन्हि बहु मिलीं। करि रुधिर सरि मज्जनु मनहुँ सङ्ग्राम बट पूजन
    चलीम् ॥ दो पुनि दसकण्ठ क्रुद्ध होइ छाँड़ई सक्ति प्रचण्ड। चली बिभीषन सन्मुख मनहुँ काल कर दण्ड ॥ ॥ आवत
    देखि सक्ति अति घोरा। प्रनतारति भञ्जन पन मोरा ॥ तुरत बिभीषन पाछें मेला। सन्मुख राम सहेउ सोइ सेला ॥
    लागि सक्ति मुरुछा कछु भी। प्रभु कृत खेल सुरन्ह बिकली ॥ देखि बिभीषन प्रभु श्रम पायो। गहि कर गदा क्रुद्ध
    होइ धायो ॥ रे कुभाग्य सठ मन्द कुबुद्धे। तैं सुर नर मुनि नाग बिरुद्धे ॥ सादर सिव कहुँ सीस चढ़आए। एक
    एक के कोटिन्ह पाए ॥ तेहि कारन खल अब लगि बाँच्यो। अब तव कालु सीस पर नाच्यो ॥ राम बिमुख सठ चहसि सम्पदा।
    अस कहि हनेसि माझ उर गदा ॥ छं उर माझ गदा प्रहार घोर कठोर लागत महि पर् यो। दस बदन सोनित स्त्रवत पुनि
    सम्भारि धायो रिस भर् यो ॥ द्वौ भिरे अतिबल मल्लजुद्ध बिरुद्ध एकु एकहि हनै। रघुबीर बल दर्पित बिभीषनु
    घालि नहिं ता कहुँ गनै ॥ दो उमा बिभीषनु रावनहि सन्मुख चितव कि काउ। सो अब भिरत काल ज्यों श्रीरघुबीर
    प्रभाउ ॥ ॥ देखा श्रमित बिभीषनु भारी। धायु हनूमान गिरि धारी ॥ रथ तुरङ्ग सारथी निपाता। हृदय माझ तेहि
    मारेसि लाता ॥ ठाढ़ रहा अति कम्पित गाता। गयु बिभीषनु जहँ जनत्राता ॥ पुनि रावन कपि हतेउ पचारी। चलेउ
    गगन कपि पूँछ पसारी ॥ गहिसि पूँछ कपि सहित उड़आना। पुनि फिरि भिरेउ प्रबल हनुमाना ॥ लरत अकास जुगल सम
    जोधा। एकहि एकु हनत करि क्रोधा ॥ सोहहिं नभ छल बल बहु करहीं। कज्जल गिरि सुमेरु जनु लरहीम् ॥ बुधि बल
    निसिचर परि न पार् यो। तब मारुत सुत प्रभु सम्भार् यो ॥ छं सम्भारि श्रीरघुबीर धीर पचारि कपि रावनु हन्यो।
    महि परत पुनि उठि लरत देवन्ह जुगल कहुँ जय जय भन्यो ॥ हनुमन्त सङ्कट देखि मर्कट भालु क्रोधातुर चले। रन
    मत्त रावन सकल सुभट प्रचण्ड भुज बल दलमले ॥ दो तब रघुबीर पचारे धाए कीस प्रचण्ड। कपि बल प्रबल देखि तेहिं
    कीन्ह प्रगट पाषण्ड ॥ ॥ अन्तरधान भयु छन एका। पुनि प्रगटे खल रूप अनेका ॥ रघुपति कटक भालु कपि जेते। जहँ
    तहँ प्रगट दसानन तेते ॥ देखे कपिन्ह अमित दससीसा। जहँ तहँ भजे भालु अरु कीसा ॥ भागे बानर धरहिं न धीरा।
    त्राहि त्राहि लछिमन रघुबीरा ॥ दहँ दिसि धावहिं कोटिन्ह रावन। गर्जहिं घोर कठोर भयावन ॥ डरे सकल सुर चले
    पराई। जय कै आस तजहु अब भाई ॥ सब सुर जिते एक दसकन्धर। अब बहु भे तकहु गिरि कन्दर ॥ रहे बिरञ्चि सम्भु
    मुनि ग्यानी। जिन्ह जिन्ह प्रभु महिमा कछु जानी ॥ छं जाना प्रताप ते रहे निर्भय कपिन्ह रिपु माने फुरे।
    चले बिचलि मर्कट भालु सकल कृपाल पाहि भयातुरे ॥ हनुमन्त अङ्गद नील नल अतिबल लरत रन बाँकुरे। मर्दहिं दसानन
    कोटि कोटिन्ह कपट भू भट अङ्कुरे ॥ दो सुर बानर देखे बिकल हँस्यो कोसलाधीस। सजि सारङ्ग एक सर हते सकल दससीस
    ॥ ॥ प्रभु छन महुँ माया सब काटी। जिमि रबि उएँ जाहिं तम फाटी ॥ रावनु एकु देखि सुर हरषे। फिरे सुमन बहु
    प्रभु पर बरषे ॥ भुज उठाइ रघुपति कपि फेरे। फिरे एक एकन्ह तब टेरे ॥ प्रभु बलु पाइ भालु कपि धाए। तरल
    तमकि सञ्जुग महि आए ॥ अस्तुति करत देवतन्हि देखें। भयुँ एक मैं इन्ह के लेखेम् ॥ सठहु सदा तुम्ह मोर मरायल।
