id: kamakhyakavacam-1-hariproktam-kalikapuranantargatam-shirah-kameshvari-devi-kamakhya-cakshushi-mama
category: kavacha
name:
  english: kamakhyakavacam 1 hariproktam (kalikapuranantargatam, (shirah kameshvari devi kamakhya cakshushi
    mama))
  devanagari: कामाख्याकवचम् १ हरिप्रोक्तं (कालिकापुराणान्तर्गतम्, (शिराः कामेश्वरी देवी कामाख्या चक्षूषी
    मम))
content:
  english: rinvantu devatah || 46|| shirah kameshvari devi kamakhya cakshushi mama | sharada karnayugalam
    tripura vadanam tatha || 47|| kanthe patu mahamaya hridi kameshvari punah | kamakhya jathare patu
    sharada mam tu nabhitah || 48|| tripura parshvayoh patu mahamaya tu mehane | gude kameshvari patu
    kamakhyorudvaye tu mam || 49|| januno sharada patu tripura patu janghayoh | mahamaya padayuge nityam
    rakshatu kamada || 50|| keshe koteshvari patu nasayam patu dirghika | bhairavi dantasanghate matangyavatu
    cangayoh || 51|| bahvormam lalita patu panyostu vanavasini | vindhyavasinyangulishu shrikama nakhakotishu
    || 52|| romakupeshu sarveshu guptakama sadavatu | padangulih parshnibhage patu mam bhuvaneshvari ||
    53|| jihvayam patu mam setuh kah kanthabhyantare'vatu | lah patu cantare vaksha hah patu jatharantare
    || 54|| saminduh patu mam vastavindubindvantare'vatu | akarastvaci mam patu rakaro'sthishu sarvada
    || 55|| lakarah sarvanadishu ikarah sarvasandhishu | candrah snayushu mam patu vindumajjasu santatam
    || 56|| purvasyam dishi cagneyyam dakshine nairrite tatha | varunyam caiva vayavyam kaubere haramandire
    || 57|| akaradyastu vaishnavya ashtau varnastu mantragah | pantu tishthantu satatam samudbhavavivriddhaye
    || 58|| urdhvadhah patu satatam mam tu setudvayam sada | navaksharani mantreshu sharadamantragocare
    || 59|| navasvaram tu mam nityam nasadishu samantatah | vatapittakaphebhyastu tripurayastu tryaksharam
    || 60|| nityam rakshatu bhutebhyah pishacebhyastathaiva ca | tatsetu satatam patam kravyadbhyomannivarakau
    || 61|| namah kameshvarim devim mahamayam jaganmayim | ya bhutva prakritirnityam tanoti jagadadyatam
    || 62|| kamakhyamakshamalabhayavaradakaram siddhasutraikahastam
  devanagari: ृण्वन्तु देवताः ॥ ४६॥ शिरः कामेश्वरी देवी कामाख्या चक्षुषी मम । शारदा कर्णयुगलं त्रिपुरा
    वदनं तथा ॥ ४७॥ कण्ठे पातु महामाया हृदि कामेश्वरी पुनः । कामाख्या जठरे पातु शारदा मां तु नाभितः ॥ ४८॥
    त्रिपुरा पार्श्वयोः पातु महामाया तु मेहने । गुदे कामेश्वरी पातु कामाख्योरुद्वये तु माम् ॥ ४९॥ जानुनो
    शारदा पातु त्रिपुरा पातु जङ्घयोः । महामाया पादयुगे नित्यं रक्षतु कामदा ॥ ५०॥ केशे कोटेश्वरी पातु नासायां
    पातु दीर्घिका । भैरवी दन्तसङ्घाते मातङ्ग्यवतु चाङ्गयोः ॥ ५१॥ बाह्वोर्मां ललिता पातु पाण्योस्तु वनवासिनी
    । विन्ध्यवासिन्यङ्गुलिषु श्रीकामा नखकोटिषु ॥ ५२॥ रोमकूपेषु सर्वेषु गुप्तकमा सदावतु । पादाङ्गुलीः पार्ष्णिभागे
    पातु मां भुवनेश्वरी ॥ ५३॥ जिह्वायां पातु मां सेतुः कः कण्ठाभ्यन्तरेऽवतु । लः पातु चान्तरे वक्ष हः
    पातु जठरान्तरे ॥ ५४॥ सामीन्दुः पातु मां वस्ताविन्दुबिन्द्वन्तरेऽवतु । अकारस्त्वचि मां पातु रकारोऽस्थिषु
    सर्वदा ॥ ५५॥ लकारः सर्वनाडीषु ईकारः सर्वसन्धिषु । चन्द्रः स्नायुषु मां पातु विन्दुमज्जासु सन्ततम्
    ॥ ५६॥ पूर्वस्यां दिशि चाग्नेय्यां दक्षिणे नैरृते तथा । वारुण्यां चैव वायव्यां कौबेरे हरमन्दिरे ॥ ५७॥
    अकाराद्यास्तु वैष्णव्या अष्टौ वर्णास्तु मन्त्रगाः । पान्तु तिष्ठन्तु सततं समुद्भवविवृद्धये ॥ ५८॥ ऊर्ध्वाधः
    पातु सततं मां तु सेतुद्वयं सदा । नवाक्षराणि मन्त्रेषु शारदामन्त्रगोचरे ॥ ५९॥ नवस्वरं तु मां नित्यं
    नासादिषु समन्ततः । वातपित्तकफेभ्यस्तु त्रिपुरायास्तु त्र्यक्षरम् ॥ ६०॥ नित्यं रक्षतु भूतेभ्यः पिशाचेभ्यस्तथैव
    च । तत्सेतू सततं पातां क्रव्याद्भ्योमान्निवारकौ ॥ ६१॥ नमः कामेश्वरीं देवीं महामायां जगन्मयीम् । या
    भूत्वा प्रकृतिर्नित्यं तनोति जगदाद्यताम् ॥ ६२॥ कामाख्यामक्षमालाभयवरदकरां सिद्धसूत्रैकहस्तां
