id: priyavratakritamshashthidevistotram
category: stotram
name:
  english: priyavratakritamshashthidevistotram
  devanagari: प्रियव्रतकृतंषष्ठीदेवीस्तोत्रम्
content:
  english: priyavratakritam shashthidevistotram priyavrata uvaca | namo devyai mahadevyai siddhyai shantyai
    namo namah | sukhadayai mokshadayai shashthidevyai namo namah || 57|| varadayai putradayai dhanadayai
    namo namah | sukhadayai mokshadayai shashthidevyai namo namah || 58|| shakteh shashthamsharupayai
    siddhayai ca namo namah | mayayai siddhayoginyai shashthidevyai namo namah || 59|| parayai paradayai
    ca parayai sarvakarmanam | sarayai saradayai ca shashthidevyai namo namah || 60|| baladhishthatridevyai
    ca phaladayai ca karmanam | kalyanadayai kalyanyai shashthi devyai namo namah || 61|| pratyakshayai
    ca bhaktanam sarvesham sarvakarmasu | pujyayai skandakantayai shashthidevyai namo namah || 62|| devarakshanakarinyai
    vanditayai nrinam sada | shuddhasattvasvarupayai shashthidevyai namo namah || 63|| dhanam dehi priyam
    dehi putram dehi sureshvari | himsakrodhairvarjitayai shashthidevyai namo namah || 64|| bhumim dehi
    prajam dehi dehi vidyam supujite | dharmam dehi yasho dehi shashthidevyai namo namah || 69|| kalyanam
    ca jayam dehi shashthidevyai namo namah | iti devim ca samstuya lebhe putram priyavratah || 66|| iti
    shribrahmavaivartte mahapurane dvitiye prakritikhande tricatvarimshadhyayantargatam priyavratakritam
    shashthidevistotram samaptam | brahmavaivartapurana | prakritikhanda | adhyaya 43
  devanagari: प्रियव्रतकृतं षष्ठीदेवीस्तोत्रम् प्रियव्रत उवाच । नमो देव्यै महादेव्यै सिद्ध्यै शान्त्यै
    नमो नमः । सुखादायै मोक्षदायै षष्ठीदेव्यै नमो नमः ॥ ५७॥ वरदायै पुत्रदायै धनदायै नमो नमः । सुखदायै मोक्षदायै
    षष्ठीदेव्यै नमो नमः ॥ ५८॥ शक्तेः षष्ठांशरूपायै सिद्धायै च नमो नमः । मायायै सिद्धयोगिन्यै षष्ठीदेव्यै
    नमो नमः ॥ ५९॥ पारायै पारदायै च पारायै सर्वकर्मणाम् । सारायै सारदायै च षष्ठीदेव्यै नमो नमः ॥ ६०॥ बालाधिष्ठातृदेव्यै
    च फलदायै च कर्मणाम् । कल्याणदायै कल्याण्यै षष्ठी देव्यै नमो नमः ॥ ६१॥ प्रत्यक्षायै च भक्तानां सर्वेषां
    सर्वकर्मसु । पूज्यायै स्कन्दकान्तायै षष्ठीदेव्यै नमो नमः ॥ ६२॥ देवरक्षणकारिण्यै वन्दितायै नृणां सदा
    । शुद्धसत्त्वस्वरूपायै षष्ठीदेव्यै नमो नमः ॥ ६३॥ धनं देहि प्रियां देहि पुत्रं देहि सुरेश्वरि । हिंसाक्रोधैर्वर्जितायै
    षष्ठीदेव्यै नमो नमः ॥ ६४॥ भूमिं देहि प्रजां देहि देहि विद्यां सुपूजिते । धर्मं देहि यशो देहि षष्ठीदेव्यै
    नमो नमः ॥ ६९॥ कल्याणं च जयं देहि षष्ठीदेव्यै नमो नमः । इति देवीं च संस्तूय लेभे पुत्रं प्रियव्रतः
    ॥ ६६॥ इति श्रीब्रह्मवैवर्त्ते महापुराणे द्वितीये प्रकृतिखण्डे त्रिचत्वारिंशाध्यायान्तर्गतं प्रियव्रतकृतं
    षष्ठीदेवीस्तोत्रं समाप्तम् । ब्रह्मवैवर्तपुराण । प्रकृतिखण्ड । अध्याय ४३
