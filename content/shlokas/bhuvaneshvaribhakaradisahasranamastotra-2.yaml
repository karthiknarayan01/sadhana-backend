id: bhuvaneshvaribhakaradisahasranamastotra-2
category: sahasranama
name:
  english: bhuvaneshvaribhakaradisahasranamastotra
  devanagari: भुवनेश्वरीभकारादिसहस्रनामस्तोत्र
content:
  english: balaravidyutimindukiritam tungakucam nayanatrayayuktam | smeramukhim varadankushapashabhitikaram
    prabhaje bhuvaneshim || atha shribhuvaneshvaribhakaradisahasranamastotram | om bhuvaneshi bhuvaraghya
    bhavani bhayanashini | bhavarupa bhavananda bhavasagaratarini || 1|| bhavodbhava bhavarata bhavabharanivarini
    | bhavyana bhavyanayana bhavyarupa bhavaushadhih || 2|| bhavyangana bhavyakeshi bhavapashavimocini
    | bhavyasana bhavyavastra bhavyabharanabhushita || 3|| bhagarupa bhagananda bhageshi bhagamalini |
    bhagavidya bhagavati bhagaklinna bhagavaha || 4|| bhagankura bhagakrida bhagadya bhagamangala | bhagalila
    bhagaprita bhagasampadbhageshvari || 5|| bhagalaya bhagotsaha bhagastha bhagaposhini | bhagotsava
    bhagavidya bhagamata bhagasthita || 6|| bhagashaktirbbhaganidhibbhagapuja bhageshana | bhagasvapa
    bhagadhisha bhagarcya bhagasundari || 7|| bhagarekha bhagasneha bhagasnehavivardhini | bhagini bhagabijastha
    bhagabhogavilasini || 8|| bhagacara bhagadhara bhagakara bhagashraya | bhagapushpa bhagashrida bhagapushpanivasini
    || 9|| bhavyarupadhara bhavyabhavyapushpairalankrita | bhavyalila bhavyamala bhavyangi bhavyasundari
    || 10|| bhavyashila bhavyalila bhavyakshi bhavyanashini | bhavyangika bhavyavani bhavyakantirbbhagalini
    || 11|| bhavyatrapa bhavyanadi bhavyabhogaviharini | bhavyastani bhavyamukhi bhavyagoshthi bhayapaha
    || 12|| bhakteshvari bhaktikari bhaktanugrahakarini | bhaktida bhaktijanani bhaktanandavivarddhini
    || 13|| bhaktipriya bhaktirata bhaktibhavaviharini | bhaktishila bhaktilila bhakteshi bhaktipalini
    || 14|| bhaktividya bhaktavidya bhaktirbhaktivinodini | bhaktiritirbbhaktipritirbhaktisadhanasadhini
    || 15|| bhaktisadhya bhaktasadhya bhaktirali bhaveshvari | bhatavidya bhatananda bhatastha bhatarupini
    || 16|| bhatamanya bhatasthanya bhatasthananivasini | bhatini bhatarupeshi bhatarupavivarddhini ||
    17|| bhataveshi bhateshi ca bhatabhagbhavasundari | bhatapritya bhataritya bhatanugrahakarini || 18||
    bhataradhya bhatabodhya bhatabodhavinodini | bhataissevya bhatavara bhatarccya bhatabodhini || 19||
    bhatakirttya bhatakala bhatapa bhatapalini | bhataishvarya bhatadhisha bhateksha bhatatoshini || 20||
    bhateshi bhatajanani bhatabhagyavivarddhini | bhatamuktirbhatayuktirbbhatapritivivarddhini || 21||
    bhagyeshi bhagyajanani bhagyastha bhagyarupini | bhavanabhavakushala bhavada bhavavarddhini || 22||
    bhavarupa bhavarasa bhavantaraviharini | bhavankura bhavakala bhavasthananivasini || 23|| bhavatura
    bhavadhrita bhavamadhyavyavasthita | bhavariddhirbbhavasiddhirbbhavadirbbhavabhavini || 24|| bhavalaya
    bhavapara bhavasadhanatatpara | bhaveshvari bhavagamya bhavastha bhavagarvita || 25|| bhavini bhavaramani
    bharati bharateshvari | bhagirathi bhagyavati bhagyodayakarikala || 26|| bhagyashraya bhagyamayi bhagya
    bhagyaphalaprada | bhagyacara bhagyasara bhagyadhara ca bhagyada || 27|| bhagyeshvari bhagyanidhirbhagya
    bhagyasumatrika | bhagyeksha bhagyana bhagyabhagyada bhagyamatrika || 28|| bhagyeksha bhagyamanasa
    bhagyadirbhagyamadhyaga | bhrateshvari bhratrimati bhratryamba bhratripalini || 29|| bhratristha bhratrikushala
    bhramari bhramarambika | bhillarupa bhillavati bhillastha bhillapalini || 30|| bhillamata bhilladhatri
    bhillini bhillakeshvari | bhillakirttirbbhillakala bhillamandiravasini || 31|| bhillakrida bhillalila
