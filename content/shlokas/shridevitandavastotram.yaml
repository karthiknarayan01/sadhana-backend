id: shridevitandavastotram
category: stotram
name:
  english: shridevitandavastotram
  devanagari: श्रीदेवीताण्डवस्तोत्रं
content:
  english: shridevi tandavastotram atha shridevi tandavam | om tat sat | amaratapasabhupasurayogibhirnutapadaburuhe
    pranamaspade nigamamurdhini nityavinodini bhavabhayabhavamam parameshvari | om tat sat | atha kudacit
    | akarokaramakarabindunadasvarupini | akhilajagadaikakarini | akhandaparipurna saccidanandasvarupini
    | arunakotikoti prakashadarshitashrayasharkasomamandala namupari | shrisadakhya kalarupatvenasakshirupataya
    | anekakoti brahmandanam | devamanushyatiryagyonijatinam | staparajangamandajati caturvidhayoni jatanam
    | teshuttamamadhyamadhamanam | punyamishrapapakarmanu jatanamapi | atalavitalasutalatalatala mahatala
    rasatala patalasaptadhaulokanam bhurbhuvadisaptordhvalokanam | sargasthiti pralayahetubhutataya |
    nirajnanakarataya | nityashuddhabuddhamuktasatya paramanandasvarupaya vartamane | inducudapriye |
    shodashakalabharinduriva candrajnanavidyayam prativadite | nityanandaikarasanubhavacittanam nirmalanam
    | dvaita prapancavasanavyatiraktakalimaladoshanam | shuddhabodhanandakara savinmaye pavake | sancitagamisakaprarabdhakarmotbhava
    sukhasukhadirbhidravairyajatam | hutashinam nikhilalokaikasakshitvena | sarvamangalopetashivasvarupatvena
    | turyatita nishcalanirvikalpa | sajatiya vijatiya svagatabhedarahitvena | traiputisakshitvena | shariratraya
    vilakshanarupataya | avasthatraya sakshitvena pancakoshavyatiraktvatvena saccidanandasvarupataya |
    tattvamasyadi mahavakyajanyajnanajneya svarupataya shuddhasvayam prakashe jyotisvarupe | parabrahmani
    | dinavrittinam arthaputramitrakalatrasadanadisambandhaih samsaraih kamakrodhalobhamohamadamatsaryaragadveshadibhirmeghairnimukte
    daharakashetishucau dashadi pancadashakalabhissakalarupatvena | shri sadakhyabhidhanaya kalaya nishkalasvarupatvena
    | purnakaratayaca shashabhriddivividyamane ishvarasya grihani | ishvararudravishnubrahmanam vyutkramena
    srishtisthitisamhara tirodhana kartribhutanam | nakaramakarashivakaranamapi hemasphatika manikyanilavarnanam
    muladharam vihaya catushcatvarishadvarnanam padanamupari yo | yakararupah sadashivah tatijvalevanu
    mayyanugrahashaktya atisukshmakara gaganakaratayavartate | tadakaphalakamvidhaya etadrishagunavishishtadivasano
    vedavedangavedantadi sakalamatadhishthana rupataya | shaivagamoktaprakarat | omkara svarupataya |
    shaktanugatasakalashastranam | purvaparapakshanam | ekibhutadhareya lakshyasvarupataya | hriimkarasvarupataya
    | ca athava paramarahasyakarayam shripancadashaksharyam atmavidyamatishucyam hariharavirincadibhirabhyarccamaniyam
    | tasyopasakanam | ikarasahitashrikara rephabindusvarupataya virajamane | utkrishtakarmopasana yogaishvaryadishuvinurmukta
    cittanam shuddhopanishat sambhrita vedanta vakyarthavedinam paramahamsanamvarishthavritinamati varnashrama
    pravrittanam tattvavidam nadaruparahitanandakara vishvataijasa prajnanamapi virat hiranyagarbhantaryaminanca
    prajapatya cijvalita shantanam muladhara svadhishthanamanipurakanam hata vishudhyajnacakranamupari
    caturvimshati tattvanashca sarvajna sarvakarana sarveshvara sarvantaryami sarvasrishti sarvasthiti
    sarvasamhara saptopadhibhihrjjahadajahat lakshanaya soyam devatattetyakhandavakyanuvritya | shivakarataya
    ca paramatmasvarupena bhasamamane adivyadhi utbhava dukhairatitivrai vrajabhih grihakshetradhanadhanya
    putramitrakalatradibhih ratibhayanakaijalajantubhih dustare mahavaridhau nimagnamatidinam mam tvadiyaya
    bhaktarakshananipunaya karunadraya drishtya uddharoddhara raksharakshatvaccaranaravinde niveshaya
    niveshaya || om tat sat ||
  devanagari: श्रीदेवी ताण्डवस्तोत्रम् अथ श्रीदेवी ताण्डवं । ॐ तत् सत् । अमरतापसभूपसुरयोगिभिर्नुतपदाबुरुहे
    प्रणमास्पदे निगममूर्धिनि नित्यविनोदिनि भवभयाभवमां परमेश्वरी । ॐ तत् सत् । अथ कुदाचित् । अकारोकारमकारबिन्दुनादस्वरूपिणी
    । अखिलजगदैककारिणी । अखण्डपरिपूर्ण सच्चिदानन्दस्वरूपिणी । अरुणकोटिकोटि प्रकाशदर्शिताश्रयाशार्कसोममण्डला
    नामुपरि । श्रीसादाख्य कलारूपत्वेनसाक्षिरूपतया । अनेककोटि ब्रह्माण्डानां । देवमनुश्यतिर्यग्योनिजातीनां
    । स्तापरजङ्गमाण्डजाति चतुर्विधयोनि जातानां । तेशुत्तममध्यमाधमानां । पुण्यमिश्रपापकर्मानु जातानामपि
    । अतलवितलसुतलतलातल महातल रसातल पातालसप्तधौलोकानां भूर्भुवादिसप्तोर्ध्वलोकानां । सर्गस्थिति प्रलयहेतुभूततया
    । निरज्ञनाकरतया । नित्यशुद्धबुद्धमुक्तसत्य परमानन्दस्वरूपया वर्तमाने । इन्दुचूडप्रिये । शोडशकलाभारिन्दुरिव
    चन्द्रज्ञानविद्यायां प्रतिवादिते । नित्यानन्दैकरसानुभवचित्तानां निर्मलानां । द्वैत प्रपञ्चवासनाव्यतिरक्तकलिमलदोशाणां
    । शुद्धबोधानन्दाकार सविन्मये पावके । सञ्चितागामिसकप्रारब्धकर्मोत्भव सुखसुखादिर्भिद्रवैर्यजतां । हुताशीनां
    निखिललोकैकसाक्षित्वेन । सर्वमङ्गलोपेतशिवस्वरूपत्वेन । तुर्यातीत निश्चलनिर्विकल्प । सजातीय विजातीय
    स्वगतभेदरहित्वेन । त्रैपुटीसाक्षित्वेन । शरीरत्रय विलक्षणरूपतया । अवस्थात्रय साक्षित्वेन पञ्चकोशव्यतिरक्त्वत्वेन
    सच्चिदानन्दस्वरूपतया । तत्त्वमस्यादि महावाक्यजन्यज्ञानज्ञेय स्वरूपतया शुद्धस्वयं प्रकाशे ज्योतिस्वरूपे
    । परब्रह्मणी । दीनवृत्तीनां अर्थपुत्रमित्रकलत्रसदनादिसंबन्धैः संसारैः कामक्रोधलोभमोहमदमात्सर्यरागद्वेशादिभिर्मेघैर्निमुक्ते
    दहराकाशेतिशुचौ दशादि पञ्चदशकलाभिस्सकलरूपत्वेन । श्री सदाख्याभिधानया कलया निश्कलस्वरूपत्वेन । पूर्णकारतयाच
    शशभृद्दिविविद्यामाने ईश्वरस्य गृहणी । ईश्वररुद्रविष्णुब्रह्माणां व्युत्क्रमेन सृष्टिस्थितिसंहार तिरोधान
    कर्तृभूतानां । नकारमकारशिवकाराणामपि हेमस्फटिक माणिक्यनीलवर्णानां मूलाधारं विहाय चतुश्चत्वारिशद्वर्णनां
    पदानामुपरि यो । यकाररूपः सदाशिवः तटिज्वलेवानु मय्यानुग्रहशक्त्या अतिसूक्ष्माकार गगनाकारतयावर्तते ।
    तदाकाफलकांविधाय एतादृशगुणविशिष्टदिवसनो वेदवेदाङ्गवेदान्तादि सकलमताधिष्ठान रूपतया । शैवागमोक्तप्रकारात्
    । ॐकार स्वरूपतया । शाक्तानुगतसकलशास्त्राणां । पूर्वापरपक्षाणां । एकीभूताधारेय लक्ष्यस्वरूपतया । ह्रीइंकारस्वरूपतया
    । च अथवा परमरहस्याकारायां श्रीपञ्चदशाक्षर्यां आत्मविद्यामतिशूच्यां हरिहरविरिञ्चादिभिरभ्यर्च्चमानियां
    । तस्योपासकानां । ईकारसहितश्रीकार रेफबिन्दुस्वरूपतया विराजमाने । उत्कृष्टकर्मोपासना योगैश्वर्यादिशुविनुर्मुक्त
    चित्तानां शुद्धोपनिशत् संभृत वेदान्त वाक्यार्थवेदीनां परमहंसानांवरिष्ठवृतीनामति वर्णाश्रम प्रवृत्तानां
    तत्त्वविदां नादरूपरहितानन्दाकार विश्वतैजस प्राज्ञानामपि विराट् हिरण्यगर्भान्तर्यामिणाञ्च प्रजापत्य
    चिज्वलित शान्तानां मूलाधार स्वाधिष्ठानमणिपूरकानां हत विशुध्याज्ञाचक्राणामुपरि चतुर्विंशति तत्त्वानश्च
    सर्वज्ञ सर्वाकारण सर्वेश्वर सर्वान्तर्यामि सर्वसृष्टि सर्वस्थिति सर्वसंहार सप्तोपाधिभिःर्ज्जहदजहत्
    लक्षणया सोयं देवतत्तेत्यखण्डवाक्यानुवृत्या । शिवकारतया च परमात्मस्वरूपेण भासमामाणे आदिव्याधि उत्भव
    दुखैरतितीव्रै व्रजभिः गृहक्षेत्रधनधान्य पुत्रमित्रकलत्रादिभिः रतिभयानकैजलजन्तुभिः दुस्तरे महावारिधौ
    निमग्नमतिदीनं मां त्वदीयया भक्तरक्षणनिपुणया करुणाद्रया दृष्ट्या उद्धरोद्धर रक्षरक्षत्वच्चरणारविन्दे
    निवेशय निवेशय ॥ ॐ तत् सत् ॥
