id: shrutadevakritamshrikrishnastotram
category: stotram
name:
  english: shrutadevakritamshrikrishnastotram
  devanagari: श्रुतदेवकृतंश्रीकृष्णस्तोत्रम्
content:
  english: rinvatam gadatam shashvadarcatam tvabhivandatam | nrinam samvadatamantarhridi bhasyamalatmanam
    || 46|| hridistho'pyatidurasthah karmavikshiptacetasam | atmashaktibhiragrahyo'pyantyupetagunatmanam
    || 47|| namo'stu te'dhyatmavidam paratmane anatmane svatmavibhaktamrityave | sakaranakaranalingamiyushe
    svamayayasamvritaruddhadrishtaye || 48|| sa tvam shadhi svabhrityannah kim deva karavama he | etadanto
    nrinam klesho yadbhavanakshigocarah || 49|| iti shrimadbhagavatamahapurane dashamaskandhe uttarardhe
    shadashiti
  devanagari: ृण्वतां गदतां शश्वदर्चतां त्वाभिवन्दताम् । नृणां संवदतामन्तर्हृदि भास्यमलात्मनाम् ॥ ४६॥
    हृदिस्थोऽप्यतिदूरस्थः कर्मविक्षिप्तचेतसाम् । आत्मशक्तिभिरग्राह्योऽप्यन्त्युपेतगुणात्मनाम् ॥ ४७॥ नमोऽस्तु
    तेऽध्यात्मविदां परात्मने अनात्मने स्वात्मविभक्तमृत्यवे । सकारणाकारणलिङ्गमीयुषे स्वमाययासंवृतरुद्धदृष्टये
    ॥ ४८॥ स त्वं शाधि स्वभृत्यान्नः किं देव करवाम हे । एतदन्तो नृणां क्लेशो यद्भवानक्षिगोचरः ॥ ४९॥ इति
    श्रीमद्भागवतमहापुराणे दशमस्कन्धे उत्तरार्धे षडशीति
meaning: {}
