id: sanandanadiyogibhihkritamvishnustotram
category: stotram
name:
  english: sanandanadiyogibhihkritamvishnustotram
  devanagari: सनन्दनादियोगिभिःकृतंविष्णुस्तोत्रम्
content:
  english: sanandanadi yogibhih kritam vishnustotram tam tushtuvustoshaparitacetaso loke jane ye nivasanti
    yoginah sanandanadya hyatinamrakandhara dharadharam dhirataroddhatekshanam || 30|| sanandanadya yogina
    ucuh | jayeshvaranam paramesha keshava prabho gadashankhadharasicakradhrik prasutinashasthitiheturishvarastvameva
    nanyatparamam ca yatpadam || 31|| padeshu vedastava yupadamshtra danteshu jajnashcitayashca vaktre
    | hutashajihvo'si tanuruhani darbhah prabho yajnapumamstvameva || 32|| vilocane ratryahani mahatmansarvashrayam
    brahmaparam shiraste | suktanyasheshani satakalapo ghranam samastani havimshi deva || 33|| sruktundasamasvaradhiranadapragvamshakayakhilasatrasandhe
    | purteshtadharmashravano'si deva sanatanatmanbhagavanprasida || 34|| padakramakrantabhuvam bhavantamadisthitam
    caksharavishvamurte | vishvasya vidmah parameshvaro'si prasida natho'si paravarasya || 35|| damshtragravinyastamasheshametadbhumandalam
    natha vibhavyate te | vigahatah padmavanam vilagnam sarojinipatramivodhapankam || 36|| dyavaprithivyoratulaprabhava
    yadantaram tadvapusha tavaiva | vyaptam jagadvyaptisamarthadipte hitaya vishvasya vibho bhava tvam
    || 37|| paramarthastvamevaiko nanyo'sti jagatah pate | tavaisha mahima yena vyaptametaccaracaram ||
    38|| yadetaddrishyate murttametajjnanatmanastava | bhrantijnanena pashyanti jagadrupamayoginah ||
    39|| jnanasvarupamakhilam jagadetadabuddhayah | arthasvarupam pashyanto bhramyante mohasamplave ||
    40|| ye tu jnanavidah shuddhacetasaste'khilam jagat | jnanatmakam prapashyanti tvadrupam parameshvara
    || 41|| prasida sarva sarvatmanbhavaya jagatamimam | uddharorvimameyatmanchanno dehyabjalocana ||
    42|| sattvodrikto'si bhagavan govinda prithivimimam | samuddhara bhavayesha shanno dehyabjalocana
    || 43|| sargapravrittirbhavato jagatamupakarini | bhavatvesha namaste'stu shanno dehyabjalocana ||
    44|| iti vishnupurane prathamabhage caturthadhyayantargatam sanandanadi yogibhih kritam vishnustotram
    samaptam | vishnupurana | adhyaya 4
  devanagari: सनन्दनादि योगिभिः कृतं विष्णुस्तोत्रम् तं तुष्टुवुस्तोषपरीतचेतसो लोके जने ये निवसन्ति योगिनः
    सनन्दनाद्या ह्यतिनम्रकन्धरा धराधरं धीरतरोद्धतेक्षणम् ॥ ३०॥ सनन्दनाद्या योगिन ऊचुः । जयेश्वराणां परमेश
    केशव प्रभो गदाशङ्खधरासिचक्रधृक् प्रसूतिनाशस्थितिहेतुरीश्वरस्त्वमेव नान्यत्परमं च यत्पदम् ॥ ३१॥ पादेषु
    वेदास्तव यूपदंष्ट्रा दन्तेषु जज्ञाश्चितयश्च वक्त्रे । हुताशजिह्वोऽसि तनूरुहाणि दर्भाः प्रभो यज्ञपुमांस्त्वमेव
    ॥ ३२॥ विलोचने रात्र्यहनी महात्मन्सर्वाश्रयं ब्रह्मपरं शिरस्ते । सूक्तान्यशेषानि सटाकलापो घ्राणं समस्तानि
    हवींषि देव ॥ ३३॥ स्रुक्तुण्डसामस्वरधीरनादप्राग्वंशकायाखिलसत्रसन्धे । पूर्तेष्टधर्मश्रवणोऽसि देव सनातनात्मन्भगवन्प्रसीद
    ॥ ३४॥ पदक्रमाक्रान्तभुवं भवन्तमादिस्थितं चाक्षरविश्वमूर्ते । विश्वस्य विद्मः परमेश्वरोऽसि प्रसीद नाथोऽसि
    परावरस्य ॥ ३५॥ दंष्ट्राग्रविन्यस्तमशेषमेतद्भूमण्डलं नाथ विभाव्यते ते । विगाहतः पद्मवनं विलग्नं सरोजिनीपत्रमिवोढपङ्कम्
    ॥ ३६॥ द्यावापृथिव्योरतुलप्रभाव यदन्तरं तद्वपुषा तवैव । व्याप्तं जगद्व्याप्तिसमर्थदीप्ते हिताय विश्वस्य
    विभो भव त्वम् ॥ ३७॥ परमार्थस्त्वमेवैको नान्योऽस्ति जगतः पते । तवैष महिमा येन व्याप्तमेतच्चराचरम् ॥
    ३८॥ यदेतद्दृश्यते मूर्त्तमेतज्ज्ञानात्मनस्तव । भ्रान्तिज्ञानेन पश्यन्ति जगद्रूपमयोगिनः ॥ ३९॥ ज्ञानस्वरूपमखिलं
    जगदेतदबुद्धयः । अर्थस्वरूपं पश्यन्तो भ्राम्यन्ते मोहसम्प्लवे ॥ ४०॥ ये तु ज्ञानविदः शुद्धचेतसस्तेऽखिलं
    जगत् । ज्ञानात्मकं प्रपश्यन्ति त्वद्रूपं परमेश्वर ॥ ४१॥ प्रसीद सर्व सर्वात्मन्भवाय जगतामिमाम् । उद्धरोर्वीममेयात्मञ्छन्नो
    देह्यब्जलोचन ॥ ४२॥ सत्त्वोद्रिक्तोऽसि भगवन् गोविन्द पृथिवीमिमाम् । समुद्धर भवायेश शन्नो देह्यब्जलोचन
    ॥ ४३॥ सर्गप्रवृत्तिर्भवतो जगतामुपकारिणी । भवत्वेषा नमस्तेऽस्तु शन्नो देह्यब्जलोचन ॥ ४४॥ इति विष्णुपुराणे
    प्रथमभागे चतुर्थाध्यायान्तर्गतं सनन्दनादि योगिभिः कृतं विष्णुस्तोत्रं समाप्तम् । विष्णुपुराण । अध्याय
    ४
