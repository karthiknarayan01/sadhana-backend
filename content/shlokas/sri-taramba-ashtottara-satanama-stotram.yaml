id: sri-taramba-ashtottara-satanama-stotram
category: stotram
name:
  english: Sri Taramba Ashtottara Satanama Stotram
content:
  english: shri shiva uvaca tarini tarala tanvi tara tarunavallari | tararupa tari shyama tanukshinapayodhara
    || || turiya taruna tivragamana nilavahini | ugratara jaya candi shrimadekajatashira || || taruni
    shambhavi chinnaphala syadbhadradayini | ugra ugraprabha nila krishna nilasarasvati || || dvitiya
    shobhana nitya navina nityabhishana | candika vijayaradhya devi gaganavahini || || attahasa karalasya
    carasyadishapujita | saguna'saguna'radhya harindradiprapujita || || raktapriya ca raktakshi rudhirasyavibhushita
    | balipriya balirata durga balavati bala || || balapriya balarata balaramaprapujita | ardhakesheshvari
    kesha keshava sragvibhushita || || padmamala ca padmakshi kamakhya girinandini | dakshina caiva daksha
    ca dakshaja dakshinerata || || vajrapushpapriya raktapriya kusumabhushita | maheshvari mahadevapriya
    pannagabhushita || || ida ca pingala caiva sushumnapranarupini | gandhari pancami pancananadiparipujita
    || || tathyavidya tathyarupa tathyamarganusarini | tattvarupa tattvapriya tattvajnanatmika'nagha ||
    || tandavacarasantushta tandavapriyakarini | talanadarata kruratapini taraniprabha || || trapayukta
    trapamukta tarpita triptikarini | tarunyabhavasantushta shakti || shivasakta shivaratih shivabhaktiparayana
    | tamradyuti stamraraga tamrapatraprabhojini || || balabhadrapremarata balibhu gbalikalpani | ramapriya
    ramashakti ramarupanukarini || || ityetatkathitam devi rahasyam paramadbhutam | shrutvamokshamavapnoti
    taradevyah prasadatah || || ya idam pathati stotram tarastutirahasyajam | sarvasiddhiyuto bhutva viharet
    kshiti mandale || || tasyaiva mantrasiddhih syanmayi bhaktiranuttama | bhavatyeva mahamaye satyam
    satyam na samshayah || || mande mangalavare ca yah pathennishi samyutah | tasyaiva mantrasiddhissyadganapatyam
    labheta sah || || shraddhaya'shraddhaya va'pi pathettara rahasyakam | so'cirenaivakalena jivanmuktashshivo
    bhavet || || sahasravartanaddevi purashcaryaphalam labhet | evam satatayukta ye dhyayantastvamupasate
    || || te kritartha maheshani mrityusamsaravartmanah || || iti shri svarnamalatantre tarambashtottarashatanama
    stotram |
  devanagari: श्री शिव उवाच तारिणी तरला तन्वी तारा तरुणवल्लरी । ताररूपा तरी श्यामा तनुक्षीणपयोधरा ॥ ॥
    तुरीया तरुणा तीव्रगमना नीलवाहिनी । उग्रतारा जया चण्डी श्रीमदेकजटाशिरा ॥ ॥ तरुणी शाम्भवी छिन्नफाला
    स्याद्भद्रदायिनी । उग्रा उग्रप्रभा नीला कृष्णा नीलसरस्वती ॥ ॥ द्वितीया शोभना नित्या नवीना नित्यभीषणा
    । चण्डिका विजयाराध्या देवी गगनवाहिनी ॥ ॥ अट्टहासा करालास्या चरास्यादीशपूजिता । सगुणाऽसगुणाऽराध्या
    हरीन्द्रादिप्रपूजिता ॥ ॥ रक्तप्रिया च रक्ताक्षी रुधिरास्यविभूषिता । बलिप्रिया बलिरता दुर्गा बलवती
    बला ॥ ॥ बलप्रिया बलरता बलरामप्रपूजिता । अर्धकेशेश्वरी केशा केशवा स्रग्विभूषिता ॥ ॥ पद्ममाला च पद्माक्षी
    कामाख्या गिरिनन्दिनी । दक्षिणा चैव दक्षा च दक्षजा दक्षिणेरता ॥ ॥ वज्रपुष्पप्रिया रक्तप्रिया कुसुमभूषिता
    । माहेश्वरी महादेवप्रिया पन्नगभूषिता ॥ ॥ इडा च पिङ्गला चैव सुषुम्नाप्राणरूपिणी । गान्धारी पञ्चमी पञ्चाननादिपरिपूजिता
    ॥ ॥ तथ्यविद्या तथ्यरूपा तथ्यमार्गानुसारिणी । तत्त्वरूपा तत्त्वप्रिया तत्त्वज्ञानात्मिकाऽनघा ॥ ॥ ताण्डवाचारसन्तुष्टा
    ताण्डवप्रियकारिणी । तालनादरता क्रूरतापिनी तरणिप्रभा ॥ ॥ त्रपायुक्ता त्रपामुक्ता तर्पिता तृप्तिकारिणी
    । तारुण्यभावसन्तुष्टा शक्ति ॥ शिवासक्ता शिवरतिः शिवभक्तिपरायणा । ताम्रद्युति स्ताम्ररागा ताम्रपात्रप्रभोजिनी
    ॥ ॥ बलभद्रप्रेमरता बलिभु ग्बलिकल्पनी । रामप्रिया रामशक्ती रामरूपानुकारिणी ॥ ॥ इत्येतत्कथितं देवि रहस्यं
    परमाद्भुतम् । श्रुत्वामोक्षमवाप्नोति तारादेव्याः प्रसादतः ॥ ॥ य इदं पठति स्तोत्रं तारास्तुतिरहस्यजम्
    । सर्वसिद्धियुतो भूत्वा विहरेत् क्षिति मण्डले ॥ ॥ तस्यैव मन्त्रसिद्धिः स्यान्मयि भक्तिरनुत्तमा । भवत्येव
    महामाये सत्यं सत्यं न संशयः ॥ ॥ मन्दे मङ्गलवारे च यः पठेन्निशि संयुतः । तस्यैव मन्त्रसिद्धिस्स्याद्गाणापत्यं
    लभेत सः ॥ ॥ श्रद्धयाऽश्रद्धया वाऽपि पठेत्तारा रहस्यकम् । सोऽचिरेणैवकालेन जीवन्मुक्तश्शिवो भवेत् ॥
    ॥ सहस्रावर्तनाद्देवि पुरश्चर्याफलं लभेत् । एवं सततयुक्ता ये ध्यायन्तस्त्वामुपासते ॥ ॥ ते कृतार्था
    महेशानि मृत्युसंसारवर्त्मनः ॥ ॥ इति श्री स्वर्णमालातन्त्रे ताराम्बाष्टोत्तरशतनाम स्तोत्रम् ।
