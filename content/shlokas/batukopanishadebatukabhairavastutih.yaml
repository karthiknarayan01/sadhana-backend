id: batukopanishadebatukabhairavastutih
category: upanishad
name:
  english: batukopanishadebatukabhairavastutih
  devanagari: बटुकोपनिषदेबटुकभैरवस्तुतिः
content:
  english: batukopanishade batukabhairavastutih yo vai batukah sa bhagavan yashca brahma tasmai vai namo
    namah | yo vai batukah sa bhagavan yashca vishnustasmai vai namo namah | yo vai batukah sa bhagavan
    yashca rudrastasmai vai namo namah | yo vai batukah sa bhagavan yashcendrastasmai vai namo namah |
    yo vai batukah sa bhagavan yashcagnistasmai vai namo namah | yo vai batukah sa bhagavan yashca vayustasmai
    vai namo namah | yo vai batukah sa bhagavan yashca suryastasmai vai namo namah | yo vai batukah sa
    bhagavan yashca somastasmai vai namo namah | yo vai batukah sa bhagavan yashcagrahastasmai vai namo
    namah | yo vai batukah sa bhagavan yashcopagrahastasmai vai namo namah | yo vai batukah sa bhagavan
    yashcabhustasmai vai namo namah | yo vai batukah sa bhagavan yashcabhuvastasmai vai namo namah | yo
    vai batukah sa bhagavan yashca svastasmai vai namo namah | yo vai batukah sa bhagavan yashcantariksham
    vai namo namah | yo vai batukah sa bhagavan yashcadyaustasmai vai namo namah | yo vai batukah sa bhagavan
    yashcapastasmai vai namo namah | yo batukah sa bhagavan yashca tejastasmai vai namo namah | yo vai
    batukah sa bhagavan yashca kalastasmai vai namo namah | yo vai batukah sa bhagavan yashca mrityustasmai
    vai namo namah | yo vai batukah sa bhagavan yashcamrityustasmai vai namo namah | vai batukah sa bhagavan
    yashcakashastasmai vai namo namah | yo vai batukah sa bhagavan yashca vishvam tasmai vai namo namah
    | yo vai batukah sa bhagavan yashcashuklam tasmai vai namo namah | yo vai batukah sa bhagavan yashcadambhastasmai
    vai namo namah | yo vai batukah sa bhangavan yashcadambhastasmai vai namo namah | yo vai batukah sa
    bhagavan yashca sukshmam tasmai vai namo namah | yo vai batukah sa bhagavan yashca sthulam tasmai
    vai namo namah | yo vai batukah sa bhagavan yashcakrishnastasmai vai namo namah | yo vai batukah sa
    bhagavan yashcakrishnastasmai vai namo namah | yo vai batukah sa bhagavan yashca satyam tasmai vai
    namo namah | yo vai batukah sa bhagavan yashca sarvam tasmai vai namo namah | || ityatharvanarahasye
    batukopanishade batukabhairavastutih sampurna ||
  devanagari: बटुकोपनिषदे बटुकभैरवस्तुतिः यो वै बटुकः स भगवान् यश्च ब्रह्मा तस्मै वै नमो नमः । यो वै बटुकः
    स भगवान् यश्च विष्णुस्तस्मै वै नमो नमः । यो वै बटुकः स भगवान् यश्च रुद्रस्तस्मै वै नमो नमः । यो वै
    बटुकः स भगवान् यश्चेन्द्रस्तस्मै वै नमो नमः । यो वै बटुकः स भगवान् यश्चाग्निस्तस्मै वै नमो नमः । यो
    वै बटुकः स भगवान् यश्च वायुस्तस्मै वै नमो नमः । यो वै बटुकः स भगवान् यश्च सूर्यस्तस्मै वै नमो नमः
    । यो वै बटुकः स भगवान् यश्च सोमस्तस्मै वै नमो नमः । यो वै बटुकः स भगवान् यश्चग्रहास्तस्मै वै नमो नमः
    । यो वै बटुकः स भगवान् यश्चोपग्रहास्तस्मै वै नमो नमः । यो वै बटुकः स भगवान् यश्चभूस्तस्मै वै नमो नमः
    । यो वै बटुकः स भगवान् यश्चभुवस्तस्मै वै नमो नमः । यो वै बटुकः स भगवान् यश्च स्वस्तस्मै वै नमो नमः
    । यो वै बटुकः स भगवान् यश्चान्तरिक्षं वै नमो नमः । यो वै बटुकः स भगवान् यश्चद्यौस्तस्मै वै नमो नमः
    । यो वै बटुकः स भगवान् यश्चापस्तस्मै वै नमो नमः । यो बटुकः स भगवान् यश्च तेजस्तस्मै वै नमो नमः । यो
    वै बटुकः स भगवान् यश्च कालस्तस्मै वै नमो नमः । यो वै बटुकः स भगवान् यश्च मृत्युस्तस्मै वै नमो नमः
    । यो वै बटुकः स भगवान् यश्चामृत्युस्तस्मै वै नमो नमः । वै बटुकः स भगवान् यश्चाकाशस्तस्मै वै नमो नमः
    । यो वै बटुकः स भगवान् यश्च विश्वं तस्मै वै नमो नमः । यो वै बटुकः स भगवान् यश्चाशुक्लं तस्मै वै नमो
    नमः । यो वै बटुकः स भगवान् यश्चदम्भस्तस्मै वै नमो नमः । यो वै बटुकः स भङ्गवान् यश्चादम्भस्तस्मै वै
    नमो नमः । यो वै बटुकः स भगवान् यश्च सूक्ष्मं तस्मै वै नमो नमः । यो वै बटुकः स भगवान् यश्च स्थूलं तस्मै
    वै नमो नमः । यो वै बटुकः स भगवान् यश्चकृष्णस्तस्मै वै नमो नमः । यो वै बटुकः स भगवान् यश्चाकृष्णस्तस्मै
    वै नमो नमः । यो वै बटुकः स भगवान् यश्च सत्यं तस्मै वै नमो नमः । यो वै बटुकः स भगवान् यश्च सर्वं तस्मै
    वै नमो नमः । ॥ इत्यथर्वणरहस्ये बटुकोपनिषदे बटुकभैरवस्तुतिः सम्पूर्णा ॥
