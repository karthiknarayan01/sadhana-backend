id: shapavimocana
category: stotram
name:
  english: shapavimocana
  devanagari: शपविमोचन
content:
  english: om devi gayatri tvam vasishtha shapat vimukta bhava || om asya shrivishvamitrashapavimocanamantrasya
    nutanasrishtikarta vishvamitrarishih | vagdoha gayatri chandah | vishvamitranugrihita gayatri shaktih
    savita devata | vishvamitrashapavimocanarthe jape viniyogah || tattvani cangeshvagnicito dhiyamsastrigarbham
    yadudbhavam devashcocire vishvasrishtim | tam kalyanimishtakarim prapadye yanmukhannihsrito vedagarbhah
    || om gayatri tvam vishvamitrashapadvimukta bhava || om gayatrim bhajamyagnimukhim vishvagarbham yadudbhavah
    | devashcakrire vishvasrishtim tam kalyanimishtakarim prapadye || om devi gayatri tvam vishvamitra
    shapat vimukta bhava || om asya shrishukrashapavimocanamantrasya shrishukra rishih | anushtupchandah
    | devi gayatri devatah | shukra shapa vimocanartham jape viniyogah || so'hamarkamayam jyotirarkajyotiraham
    shivah | atmajyotiraham shukrah sarvajyotiraso'smyaham || om devi gayatri tvam shukra shapat vimukta
    bhava || prarthana | om aho devi mahadevi sandhye vidye sarasvati | ajare amare caiva brahmayonirnamo'stute
    || om devi gayatri tvam brahmashapat vimukta bhava | vasishthashapat vimukta bhava | vishvamitrashapat
    vimukta bhava | shukrashapat vimukta bhava ||
  devanagari: ॐ देवी गायत्री त्वं वसिष्ठ शापात् विमुक्ता भव ॥ ॐ अस्य श्रीविश्वामित्रशापविमोचनमन्त्रस्य
    नूतनसृष्टिकर्ता विश्वामित्रऋषिः । वाग्दोहा गायत्री छन्दः । विश्वामित्रानुगृहिता गायत्री शक्तिः सविता
    देवता । विश्वामित्रशापविमोचनार्थे जपे विनियोगः ॥ तत्त्वानि चाङ्गेष्वग्निचितो धियांसस्त्रिगर्भां यदुद्भवां
    देवाश्चोचिरे विश्वसृष्टिम् । तां कल्याणीमिष्टकरीं प्रपद्ये यन्मुखान्निःसृतो वेदगर्भः ॥ ॐ गायत्रि त्वं
    विश्वामित्रशापाद्विमुक्ता भव ॥ ॐ गायत्रीं भजाम्यग्निमुखीं विश्वगर्भां यदुद्भवाः । देवाश्चक्रिरे विश्वसृष्टिं
    तां कल्याणीमिष्टकरीं प्रपद्ये ॥ ॐ देवी गायत्री त्वं विश्वामित्र शापात् विमुक्ता भव ॥ ॐ अस्य श्रीशुक्रशापविमोचनमन्त्रस्य
    श्रीशुक्र ऋषिः । अनुष्टुप्छन्दः । देवि गायत्री देवताः । शुक्र शाप विमोचनार्थं जपे विनियोगः ॥ सोऽहमर्कमयं
    ज्योतिरर्कज्योतिरहं शिवः । आत्मज्योतिरहं शुक्रः सर्वज्योतिरसोऽस्म्यहम् ॥ ॐ देवी गायत्री त्वं शुक्र
    शापात् विमुक्ता भव ॥ प्रार्थना । ॐ अहो देवि महादेवि सन्ध्ये विद्ये सरस्वती । अजरे अमरे चैव ब्रह्मयोनिर्नमोऽस्तुते
    ॥ ॐ देवी गायत्री त्वं ब्रह्मशापात् विमुक्ता भव । वसिष्ठशापात् विमुक्ता भव । विश्वामित्रशापात् विमुक्ता
    भव । शुक्रशापात् विमुक्ता भव ॥
