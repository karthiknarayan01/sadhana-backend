id: ketu-25
category: stotram
name:
  english: ketu 25
  devanagari: केतु २५
content:
  english: ketupancavimshatinamastotram ketuh kalah kalayita dhumraketurvivarnakah | lokaketurmahaketuh
    sarvaketurbhayapradah || 1|| raudro rudrapriyo rudrah krurakarma sugandhadhrik | palashadhumasamkashashcitrayajnopavitadhrik
    || 2|| taraganavimardi ca jaimineyo grahadhipah | ganeshadevo vighnesho visharogartinashanah || 3||
    pravrajyado jnanadashca tirthayatrapravartakah | pancavimshatinamani ketoryah satatam pathet || 4||
    tasya nashyati badha ca sarvaketuprasadatah | dhanadhanyapashunam ca bhaved vriddhirna samshayah ||
    5|| || iti shriskandapurane ketoh pancavimshatinamastotram sampurnam ||
  devanagari: केतुपञ्चविंशतिनामस्तोत्रम् केतुः कालः कलयिता धूम्रकेतुर्विवर्णकः । लोककेतुर्महाकेतुः सर्वकेतुर्भयप्रदः
    ॥ १॥ रौद्रो रुद्रप्रियो रुद्रः क्रूरकर्मा सुगन्धधृक् । पलाशधूमसंकाशश्चित्रयज्ञोपवीतधृक् ॥ २॥ तारागणविमर्दी
    च जैमिनेयो ग्रहाधिपः । गणेशदेवो विघ्नेशो विषरोगार्तिनाशनः ॥ ३॥ प्रव्रज्यादो ज्ञानदश्च तीर्थयात्राप्रवर्तकः
    । पञ्चविंशतिनामानि केतोर्यः सततं पठेत् ॥ ४॥ तस्य नश्यति बाधा च सर्वकेतुप्रसादतः । धनधान्यपशूनां च
    भवेद् वृद्धिर्न संशयः ॥ ५॥ ॥ इति श्रीस्कन्दपुराणे केतोः पञ्चविंशतिनामस्तोत्रं संपूर्णम् ॥
meaning: {}
