id: gandharvadianyadevaganaihkritamramanathastotram
category: stotram
name:
  english: gandharvadianyadevaganaihkritamramanathastotram
  devanagari: गन्धर्वादिअन्यदेवगणैःकृतंरामनाथस्तोत्रम्
content:
  english: 80|| vasava ucuh | ramanathaganeshaya ganavrindarcitanghraye | gangadharaya guhyaya namaste
    pahi nah sada || 81|| vishvedeva ucuh | jnaptimatraikanishthanam muktidaya suyoginam | ramanathaya
    sambaya namo'sman raksha shankara || 82|| maruta ucuh | paratattvaya tattvanam tattvabhutaya vastutah
    | namaste ramanathaya svayambhanaya shambhave || 83|| sadhya ucuh | svatiriktavihinaya jagatsattapradayine
    | rameshvaraya devaya namo'vidyavibhedine || 84|| sarve deva ucuh | saccidanandasampurnam dvaitavastuvivarjitam
    | brahmatmanam svayambhanamadimadhyantavarjitam || 85|| avikriyamasangam ca parishuddham sanatanam
    | akashadiprapancanam sakshibhutam paramritam || 86|| pramatitam pramananamapi bodhapradayinam | avirbhavatirobhavasankocarahitam
    sada || 87|| svasminnadhyastarupasya prapancasyasya sakshinam | nirlepam paramanandam nirastasakalakriyam
    || 88|| bhumanandam mahatmanam cidrupam bhogavarjitam | ramanatham vayam sarve svapatakavishuddhaye
    || 89|| cintayamah sada citte svatmanandabubhutsavah | rakshasmankarunasindho ramanatha namo'stu te
    || 1
  devanagari: ८०॥ वसव ऊचुः । रामनाथगणेशाय गणवृन्दार्चिताङ्घ्रये । गङ्गाधराय गुह्याय नमस्ते पाहि नः सदा
    ॥ ८१॥ विश्वेदेवा ऊचुः । ज्ञप्तिमात्रैकनिष्ठानां मुक्तिदाय सुयोगिनाम् । रामनाथाय साम्बाय नमोऽस्मान्
    रक्ष शङ्कर ॥ ८२॥ मरुत ऊचुः । परतत्त्वाय तत्त्वानां तत्त्वभूताय वस्तुतः । नमस्ते रामनाथाय स्वयम्भानाय
    शम्भवे ॥ ८३॥ साध्या ऊचुः । स्वातिरिक्तविहीनाय जगत्सत्ताप्रदायिने । रामेश्वराय देवाय नमोऽविद्याविभेदिने
    ॥ ८४॥ सर्वे देवा ऊचुः । सच्चिदानन्दसम्पूर्णं द्वैतवस्तुविवर्जितम् । ब्रह्मात्मानं स्वयम्भानमादिमध्यान्तवर्जितम्
    ॥ ८५॥ अविक्रियमसङ्गं च परिशुद्धं सनातनम् । आकाशादिप्रपञ्चानां साक्षिभूतं परामृतम् ॥ ८६॥ प्रमातीतं
    प्रमाणानामपि बोधप्रदायिनम् । आविर्भावतिरोभावसङ्कोचरहितं सदा ॥ ८७॥ स्वस्मिन्नध्यस्तरूपस्य प्रपञ्चस्यास्य
    साक्षिणम् । निर्लेपं परमानन्दं निरस्तसकलक्रियम् ॥ ८८॥ भूमानन्दं महात्मानं चिद्रूपं भोगवर्जितम् । रामनाथं
    वयं सर्वे स्वपातकविशुद्धये ॥ ८९॥ चिन्तयामः सदा चित्ते स्वात्मानन्दबुभुत्सवः । रक्षास्मान्करुणासिन्धो
    रामनाथ नमोऽस्तु ते ॥ १
