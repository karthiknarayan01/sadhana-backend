id: devaihkritam03durgastotram-12
category: stotram
name:
  english: devaihkritam03durgastotram 12
  devanagari: देवैःकृतं०३दुर्गास्तोत्रम् १२
content:
  english: devaih kritam 3 durgastotram 12 deva ucuh | namo devyai mahadevyai shivayai satatam namah |
    namah prakrityai bhadrayai niyatah pranatah sma tam || 7|| raudrayai namo nityayau gauryai dhatryai
    namo namah | namo jagatpratishthayai devyai krityai namo namah || 8|| jyotsnayai cendurupinyai sukhayai
    satatam namah | kalyanyai pranatam vriddhyai siddhyai kurmyai namo namah || 9|| nairrityai bhubhritam
    lakshmyai sharvanyai te namo namah | durgayai durgaparayai sarayai sarvakarinyai | khyatyai tathaiva
    krishnayai dhumrayai satatam namah || 10|| atisaumyatiraudrayai natastasyai namo namah | mano jagatpratishthayai
    devyai krityai namo namah || 11|| ya devi sarvabhuteshu vishnumayeti shabdita | namastasyai namastasyai
    namastasyai namo namah || 12|| ya devi sarvabhuteshu cetanetyabhidhiyate | namastasyai namastasyai
    namastasyai namo namah || 13|| ya devi sarvabhuteshu buddhirupena samsthita | namastasyai namastasyai
    namastasyai namo namah || 14|| ya devi sarvabhuteshu nidrarupena samsthita | namastasyai namastasyai
    namastasyai mano namah || 15|| ya devi sarvabhuteshu kshudharupena samsthita | namastasyai namastasyai
    namastasyai namo namah || 16|| ya devi sarvabhuteshu cchayarupena samsthita | namastasyai namastasyai
    namastasyai namo namah || 17|| ya devi sarvabhuteshu shaktirupena samsthita | namastasyai namastasyai
    namastasyai namo namah || 18|| ya devi sarvabhuteshu trishnarupena samsthita | namastasyai namastasyai
    namastasyai namo namah || 19|| ya devi sarvabhuteshu kshantirupena samsthita | namastasyai namastasyai
    namastasyai namo namah || 20|| ya devi sarvabhuteshu jatirupena samsthita | namastasyai namastasyai
    namastasyai namo namah || 21|| ya devi sarvabhuteshu lajjarupena samsthita | namastasyai namastasyai
    namastasyai namo namah || 22|| ya devi sarvabhuteshu shantirupena samsthita | namastasyai namastasyai
    namastasyai namo namah || 23|| ya devi sarvabhuteshu shraddharupena samsthita | namastasyai namastasyai
    namastasyai namo namah || 24|| ya devi sarvabhuteshu kantirupena samsthita | namastasyai namastasyai
    namastasyai namo namah || 25|| ya devi sarvabhuteshu lakshmirupena samsthita | namastasyai namastasyai
    namastasyai namo namah || 26|| ya devi sarvabhuteshu dhritirupena samsthita | tamastasyai namastasyai
    namastasyai namo namah || 27|| ya devi sarvabhuteshu vrittirupena samsthita | namastasyai namastasyai
    namastasyai namo namah || 28|| ya devi sarvabhuteshu smritirupena samsthita | namastasyai namastasyai
    namastasyai namo namah || 29|| ya devi sarvabhuteshu dayarupena samsthita | namastasyai namastasyai
    namastasyai namo namah || 30|| ya devi sarvabhuteshu nitirupenam samsthita | namastasyai namastasyai
    namastasyai namo namah || 31|| ya devi sarvabhuteshu tushtirupena samsthita | namastasyai namastasyai
    namastasyai namo namah || 32|| ya devi sarvabhuteshu pushtirupena samsthita | namastasyai namastasyai
    namastasyai namo namah || 33|| ya devi sarvabhuteshu matrirupena samsthita | namastasyai namastasyai
    namastasyai namo namah || 34|| ya devi sarvabhuteshu bhrantirupena samsthita | namastasyai namastasyai
    namastasyai namo namah || 35|| indriyanamadhishthatri bhutanam cakhileshu ya | bhuteshu satatam tasyai
    vyaptidevyai namo namah || 36|| citirupena ya kritsnametadvyapya sthita jagat | namastasyai namastasyai
    namastasyai namo namah || 37|| stuta suraih purvamabhishtasamshrayat tathasurendrena dineshu sevita
    | karotu sa nah shubhaheturishvari shubhani bhadranyabhihantu capadah || 38|| ya sampratam coddhatadaityatapitaih
    asmabhirisha ca surairnamasyate | ya ca smrita tatkshanameva hanti nah sarvapado bhaktivinamramurtibhih
    || 39|| iti markandeyapurane pancashititamadhyayantargatam devaih kritam durgastotram samaptam | markandeyapurana
    | adhyaya 82|| 85
  devanagari: देवैः कृतं ३ दुर्गास्तोत्रम् १२ देवा ऊचुः । नमो देव्यै महादेव्यै शिवायै सततं नमः । नमः प्रकृत्यै
    भद्रायै नियताः प्रणताः स्म ताम् ॥ ७॥ रौद्रायै नमो नित्यायौ गौर्यै धात्र्यै नमो नमः । नमो जगत्प्रतिष्ठायै
    देव्यै कृत्यै नमो नमः ॥ ८॥ ज्योत्स्नायै चेन्दुरूपिण्यै सुखायै सततं नमः । कल्याण्यै प्रणतां वृद्ध्यै
    सिद्ध्यै कूर्म्यै नमो नमः ॥ ९॥ नैरृत्यै भूभृतां लक्ष्म्यै शर्वाण्यै ते नमो नमः । दुर्गायै दुर्गपारायै
    सारायै सर्वकारिण्यै । ख्यात्यै तथैव कृष्णायै धूम्रायै सततं नमः ॥ १०॥ अतिसौम्यातिरौद्रायै नतास्तस्यै
    नमो नमः । मनो जगत्प्रतिष्ठायै देव्यै कृत्यै नमो नमः ॥ ११॥ या देवी सर्वभूतेषु विष्णुमायेति शब्दिता
    । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ॥ १२॥ या देवी सर्वभूतेषु चेतनेत्यभिधीयते । नमस्तस्यै नमस्तस्यै
    नमस्तस्यै नमो नमः ॥ १३॥ या देवी सर्वभूतेषु बुद्धिरूपेण संस्थिता । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो
    नमः ॥ १४॥ या देवी सर्वभूतेषु निद्रारूपेण संस्थिता । नमस्तस्यै नमस्तस्यै नमस्तस्यै मनो नमः ॥ १५॥ या
    देवी सर्वभूतेषु क्षुधारूपेण संस्थिता । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ॥ १६॥ या देवी सर्वभूतेषु
    च्छायारूपेण संस्थिता । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ॥ १७॥ या देवी सर्वभूतेषु शक्तिरूपेण संस्थिता
    । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ॥ १८॥ या देवी सर्वभूतेषु तृष्णारूपेण संस्थिता । नमस्तस्यै
    नमस्तस्यै नमस्तस्यै नमो नमः ॥ १९॥ या देवी सर्वभूतेषु क्षान्तिरूपेण संस्थिता । नमस्तस्यै नमस्तस्यै
    नमस्तस्यै नमो नमः ॥ २०॥ या देवी सर्वभूतेषु जातिरूपेण संस्थिता । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो
    नमः ॥ २१॥ या देवी सर्वभूतेषु लज्जारूपेण संस्थिता । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ॥ २२॥ या
    देवी सर्वभूतेषु शान्तिरूपेण संस्थिता । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ॥ २३॥ या देवी सर्वभूतेषु
    श्रद्धारूपेण संस्थिता । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ॥ २४॥ या देवी सर्वभूतेषु कान्तिरूपेण
    संस्थिता । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ॥ २५॥ या देवी सर्वभूतेषु लक्ष्मीरूपेण संस्थिता ।
    नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ॥ २६॥ या देवी सर्वभूतेषु धृतिरूपेण संस्थिता । तमस्तस्यै नमस्तस्यै
    नमस्तस्यै नमो नमः ॥ २७॥ या देवी सर्वभूतेषु वृत्तिरूपेण संस्थिता । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो
    नमः ॥ २८॥ या देवी सर्वभूतेषु स्मृतिरूपेण संस्थिता । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ॥ २९॥ या
    देवी सर्वभूतेषु दयारूपेण संस्थिता । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ॥ ३०॥ या देवी सर्वभूतेषु
    नीतिरूपेणं संस्थिता । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ॥ ३१॥ या देवी सर्वभूतेषु तुष्टिरूपेण संस्थिता
    । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ॥ ३२॥ या देवी सर्वभूतेषु पुष्टिरूपेण संस्थिता । नमस्तस्यै
    नमस्तस्यै नमस्तस्यै नमो नमः ॥ ३३॥ या देवी सर्वभूतेषु मातृरूपेण संस्थिता । नमस्तस्यै नमस्तस्यै नमस्तस्यै
    नमो नमः ॥ ३४॥ या देवी सर्वभूतेषु भ्रान्तिरूपेण संस्थिता । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ॥
    ३५॥ इन्द्रियाणामधिष्ठात्री भूतानां चाखिलेषु या । भूतेषु सततं तस्यै व्याप्तिदेव्यै नमो नमः ॥ ३६॥ चितिरूपेण
    या कृत्स्नमेतद्व्याप्य स्थिता जगत् । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ॥ ३७॥ स्तुता सुरैः पूर्वमभीष्टसंश्रयात्
    तथासुरेन्द्रेण दिनेषु सेविता । करोतु सा नः शुभहेतुरीश्वरी शुभानि भद्राण्यभिहन्तु चापदः ॥ ३८॥ या साम्प्रतं
    चोद्धतदैत्यतापितैः अस्माभिरीशा च सुरैर्नमस्यते । या च स्मृता तत्क्षणमेव हन्ति नः सर्वापदो भक्तिविनम्रमूर्तिभिः
    ॥ ३९॥ इति मर्कण्डेयपुराणे पञ्चाशीतितमाध्यायान्तर्गतं देवैः कृतं दुर्गास्तोत्रं समाप्तम् । मार्कण्डेयपुराण
    । अध्याय ८२॥ ८५
