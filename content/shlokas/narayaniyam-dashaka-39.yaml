id: narayaniyam-dashaka-39
category: stotram
name:
  english: Narayaniyam Dashaka 39
content:
  english: bhavantamayamudvahan yadukulodvaho nissaran dadarsha gaganoccalajjalabharam kalindatmajam |
    aho salilasancayah sa punaraindrajalodito jalaugha iva tatkshanat prapadameyatamayayau || || prasuptapashupalikam
    nibhritamarudadbalika mapavritakavatikam pashupavatikamavishan | bhavantamayamarpayan prasavatalpake
    tatpada dvahan kapatakanyakam svapuramagato vegatah || || tatastvadanujaravakshapitanidravegadravad
    bhatotkaraniveditaprasavavartayaivartiman | vimuktacikurotkarastvaritamapatan bhojara datushta iva
    drishtavan bhaginikakare kanyakam || || dhruvam kapatashalino madhuharasya maya bhave dasaviti kishorikam
    bhaginikakaralingitam | dvipo nalinikantaradiva mrinalikamakshipa nnayam tvadanujamajamupalapattake
    pishtavan || || tatah bhavadupasako jhatiti mrityupashadiva pramucya tarasaiva sa samadhirudharupantara
    | adhastalamajagmushi vikasadashtabahusphura nmahayudhamaho gata kila vihayasa didyute || || nrishamsatara
    kamsa te kimu maya vinishpishtaya babhuva bhavadantakah kvacana cintyatam te hitam | iti tvadanuja
    vibho khalamudirya tam jagmushi marudganapanayita bhuvi ca mandiranyeyushi || || prage punaragatmajavacanamirita
    bhubhuja pralambabakaputanapramukhadanava maninah | bhavannidhanakamyaya jagati babhramurnirbhayah
    kumarakavimarakah kimiva dushkaram nishkripaih || || tatah pashupamandire tvayi mukunda nandapriya
    prasutishayaneshaye rudati kincidancatpade | vibudhya vanitajanaistanayasambhave ghoshite muda kimu
    vadamyaho sakalamakulam gokulam || || aho khalu yashodaya navakalayacetoharam bhavantamalamantike
    prathamamapibantya drisha | punah stanabharam nijam sapadi payayantya muda manoharatanusprisha jagati
    punyavanto jitah || || bhavatkushalakamyaya sa khalu nandagopastada pramodabharasankulo dvijakulaya
    kinnadadat | tathaiva pashupalakah kimu na mangalam tenire jagattritayamangala tvamiha pahi mamamayat
    ||
  devanagari: भवन्तमयमुद्वहन् यदुकुलोद्वहो निस्सरन् ददर्श गगनोच्चलज्जलभरां कलिन्दात्मजाम् । अहो सलिलसञ्चयः
    स पुनरैन्द्रजालोदितो जलौघ इव तत्क्षणात् प्रपदमेयतामाययौ ॥ ॥ प्रसुप्तपशुपालिकां निभृतमारुदद्बालिका
    मपावृतकवाटिकां पशुपवाटिकामाविशन् । भवन्तमयमर्पयन् प्रसवतल्पके तत्पदा द्वहन् कपटकन्यकां स्वपुरमागतो
    वेगतः ॥ ॥ ततस्त्वदनुजारवक्षपितनिद्रवेगद्रवद् भटोत्करनिवेदितप्रसववार्तयैवार्तिमान् । विमुक्तचिकुरोत्करस्त्वरितमापतन्
    भोजरा डतुष्ट इव दृष्टवान् भगिनिकाकरे कन्यकाम् ॥ ॥ ध्रुवं कपटशालिनो मधुहरस्य माया भवे दसाविति किशोरिकां
    भगिनिकाकरालिङ्गिताम् । द्विपो नलिनिकान्तरादिव मृणालिकामाक्षिप न्नयं त्वदनुजामजामुपलपट्टके पिष्टवान्
    ॥ ॥ ततः भवदुपासको झटिति मृत्युपाशादिव प्रमुच्य तरसैव सा समधिरूढरूपान्तरा । अधस्तलमजग्मुषी विकसदष्टबाहुस्फुर
    न्महायुधमहो गता किल विहायसा दिद्युते ॥ ॥ नृशंसतर कंस ते किमु मया विनिष्पिष्टया बभूव भवदन्तकः क्वचन
    चिन्त्यतां ते हितम् । इति त्वदनुजा विभो खलमुदीर्य तं जग्मुषी मरुद्गणपणायिता भुवि च मन्दिराण्येयुषी
    ॥ ॥ प्रगे पुनरगात्मजावचनमीरिता भूभुजा प्रलम्बबकपूतनाप्रमुखदानवा मानिनः । भवन्निधनकाम्यया जगति बभ्रमुर्निर्भयाः
    कुमारकविमारकाः किमिव दुष्करं निष्कृपैः ॥ ॥ ततः पशुपमन्दिरे त्वयि मुकुन्द नन्दप्रिया प्रसूतिशयनेशये
    रुदति किञ्चिदञ्चत्पदे । विबुध्य वनिताजनैस्तनयसम्भवे घोषिते मुदा किमु वदाम्यहो सकलमाकुलं गोकुलम् ॥
    ॥ अहो खलु यशोदया नवकलायचेतोहरं भवन्तमलमन्तिके प्रथममापिबन्त्या दृशा । पुनः स्तनभरं निजं सपदि पाययन्त्या
    मुदा मनोहरतनुस्पृशा जगति पुण्यवन्तो जिताः ॥ ॥ भवत्कुशलकाम्यया स खलु नन्दगोपस्तदा प्रमोदभरसङ्कुलो द्विजकुलाय
    किन्नाददात् । तथैव पशुपालकाः किमु न मङ्गलं तेनिरे जगत्त्रितयमङ्गल त्वमिह पाहि मामामयात् ॥
