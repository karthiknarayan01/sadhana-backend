id: parashuramasahasranamavali
category: stotram
name:
  english: parashuramasahasranamavali
  devanagari: परशुरामसहस्रनामावली
content:
  english: shriparashuramasahasranamavalih atha viniyogah | om asya shrijamadagnyasahasranamavalimahamantrasya
    shrirama rishih | jamadagnyah paramatma devata | anushtup chandah | shrimadavinasharamaprityartham
    caturvidhapurusharthasiddhyartham jape viniyogah || atha karanyasah | om hram govindatmane angushthabhyam
    namah | om hrim mahidharatmane tarjanibhyam namah | om hrum hrishikeshatmane madhyamabhyam namah |
    om hraim trivikramatmane anamikabhyam namah | om hraum vishnvatmane kanishthikabhyam namah | om hrah
    madhavatmane karatalakaraprishthabhyam namah || atha hridayanyasah | om hram govindatmane hridayaya
    namah | om hrim mahidharatmane shirase svaha | om hrum hrishikeshatmane shikhayai vashat | om hraim
    trivikramatmane kavacaya hum | om hraum vishnvatmane netratrayaya vaushat | om hrah madhavatmane astraya
    phat | atha dhyanam | shuddhajambunadanibham brahmavishnushivatmakam | sarvabharanasamyuktam krishnajinadharam
    vibhum || 1|| banacapau ca parashumabhayam ca caturbhujaih | prakoshthashobhi rudrakshairdadhanam
    bhrigunandanam || 2|| hemayajnopavitam ca snigdhasmitamukhambujam | darbhancitakaram devam kshatriyakshayadikshitam
    || 3|| shrivatsavakshasam ramam dhyayedvai brahmacarinam | hritpundarikamadhyastham sanakadyairabhishtutam
    || 4|| sahasramiva suryanamekibhuya purah sthitam | tapasamiva sanmurtim bhriguvamshatapasvinam ||
    5|| cudacumbitakankapatramabhitastunidvayam prishthato bhasmasnigdhapavitralanchanavapurdhatte tvacam
    rauravim | maunjya mekhalaya niyantritamadhovasashca manjishthakam panau karmukamakshasutravalayam
    dandam param paippalam || 6|| renukahridayanandam bhriguvamshatapasvinam | kshatriyanamantakam purnam
    jamadagnyam namamyaham || 7|| avyaktavyaktarupaya nirgunaya gunatmane | samastajagadadharamurtaye
    brahmane namah || 8|| || shriparashuramadvadashanamani || harih parashudhari ca ramashca bhrigunandanah
    | ekaviratmajo vishnurjamadagnyah pratapavan || sahyadrivasi virashca kshatrajitprithivipatih | iti
    dvadashanamani bhargavasya mahatmanah | yastrikale pathennityam sarvatra vijayi bhavet || atha shriparashuramasahasranamavalih
