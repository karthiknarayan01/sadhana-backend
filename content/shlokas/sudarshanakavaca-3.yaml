id: sudarshanakavaca-3
category: kavacha
name:
  english: sudarshanakavaca 3
  devanagari: सुदर्शनकवच ३
content:
  english: tejorupaya ashritarakshakaya | om sudarshanaya vidmahe mahajvalaya dhimahi | tannashcakrah
    pracodayat iti svaha svaha || om sudarshanaya vidmahe mahajvalaya dhimahi | tannashcakrah pracodayat
    iti svaha svaha || bho bho sudarshana narasimha mam rakshaya rakshaya | om sudarshanaya vidmahe mahajvalaya
    dhimahi | tannashcakrah pracodayat|| om sudarshanaya vidmahe mahajvalaya dhimahi | tannashcakrah pracodayat
    || mama shatrunnashaya nashaya om sudarshanaya vidmahe mahajvalaya dhimahi | tannashcakrah pracodayat
    || om sudarshanaya vidmahe mahajvalaya dhimahi | tannashcakrah pracodayat || jvala jvala prajvala
    prajvala canda canda pracanda pracanda sphura prasphura ghora ghora ghoratara ghoratara cata cata
    pracata pracata prasphuta daha kahara bhaga bhindhi handhi khatata pracata phata jahi jahi paya sasa
    pralayava purushaya ram ram netragnirupaya | om sudarshanaya vidmahe mahajvalaya dhimahi | tannashcakrah
    pracodayat || om sudarshanaya vidmahe mahajvalaya dhimahi | tannashcakrah pracodayat || bho bho sudarshana
    narasimha mam rakshaya rakshaya | om sudarshanaya vidmahe mahajvalaya dhimahi | tannashcakrah pracodayat
    || om sudarshanaya vidmahe mahajvalaya dhimahi | tannashcakrah pracodayat || ehi ehi agaccha agaccha
    bhutagraha
  devanagari: तेजोरूपाय आश्रितरक्षकाय । ॐ सुदर्शनाय विद्महे महाज्वालाय धीमहि । तन्नश्चक्रः प्रचोदयात्
    इति स्वाहा स्वाहा ॥ ॐ सुदर्शनाय विद्महे महाज्वालाय धीमहि । तन्नश्चक्रः प्रचोदयात् इति स्वाहा स्वाहा
    ॥ भो भो सुदर्शन नारसिंह मां रक्षय रक्षय । ॐ सुदर्शनाय विद्महे महाज्वालाय धीमहि । तन्नश्चक्रः प्रचोदयात्॥
    ॐ सुदर्शनाय विद्महे महाज्वालाय धीमहि । तन्नश्चक्रः प्रचोदयात् ॥ मम शत्रून्नाशय नाशय ॐ सुदर्शनाय विद्महे
    महाज्वालाय धीमहि । तन्नश्चक्रः प्रचोदयात् ॥ ॐ सुदर्शनाय विद्महे महाज्वालाय धीमहि । तन्नश्चक्रः प्रचोदयात्
    ॥ ज्वल ज्वल प्रज्वल प्रज्वल चण्ड चण्ड प्रचण्ड प्रचण्ड स्फुर प्रस्फुर घोर घोर घोरतर घोरतर चट चट प्रचट
    प्रचट प्रस्फुट दह कहर भग भिन्धि हन्धि खटट प्रचट फट जहि जहि पय सस प्रलयवा पुरुषाय रं रं नेत्राग्निरूपाय
    । ॐ सुदर्शनाय विद्महे महाज्वालाय धीमहि । तन्नश्चक्रः प्रचोदयात् ॥ ॐ सुदर्शनाय विद्महे महाज्वालाय धीमहि
    । तन्नश्चक्रः प्रचोदयात् ॥ भो भो सुदर्शन नारसिंह मां रक्षय रक्षय । ॐ सुदर्शनाय विद्महे महाज्वालाय
    धीमहि । तन्नश्चक्रः प्रचोदयात् ॥ ॐ सुदर्शनाय विद्महे महाज्वालाय धीमहि । तन्नश्चक्रः प्रचोदयात् ॥ एहि
    एहि आगच्छ आगच्छ भूतग्रह
