    त्रैलोक्यवन्दिता ॥ १०३॥ ॐ श्रीं क्रीं ऐं ह्सौः ॐ स्त्रीं त्रयीतनुविलोचना । ॐ वां वेदत्रयी स्वाहा ॐ
    श्रीं अग्नित्रयीं तथा ॥ १०४॥ ॐ प्रीं पुरत्रयी स्वाहा ॐ वां वर्गत्रयी तथा । ॐ सौः विद्यात्रयी श्रीं
    क्लीं देवी त्रितयरूपिणी ॥ १०५॥ ॐ द्रीं देवप्रसू स्वाहा ॐ द्रीं ऐं सौः दयावती । ॐ क्लीं ऐं सौः च धर्मज्ञा
    ॐ श्रीं धर्मनिधिस्तथा ॥ १०६॥ ॐ श्रीं द्रीं धनदा स्वाहा ऐं सौः क्लीं धनदार्चिता । ॐ श्रीं हूं धार्मिकेष्टा
    च ॐ श्रीं धर्मिजनप्रिया ॥ १०७॥ ऐं सौः द्युतिमती श्रीं ह्रीं सर्वदाभूतभूषिता । ॐ क्लीं दीप्ति ह्सौः
    धात्री ॐ श्रीं धूर्ता ह्सौः धृतिः ॥ १०८॥ ॐ श्रीं दम्भविहीना च ॐ श्रीं दाम्भिकरूपिणी । ॐ श्रीं म्रीं
