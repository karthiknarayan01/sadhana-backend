id: hakinishvarasahasra
category: stotram
name:
  english: hakinishvarasahasra
  devanagari: हाकिनीश्वरसहस्र
content:
  english: hakinishvarashtottarasahasranamastotra paranathashtottarasahasranamastotram ca shrianandabhairava
    uvaca | anandabhairavi pranavallabhe jagadishvari | tava prasadavakyena shrutam namasahasrakam ||
    1 || hakinyah kulayoginyah paramadbhutamangalam | idanim shrotumicchami paranathasya vanchitam ||
    2 || sahasranamayogangamashtottarasamakulam | bhrupadmabhedanarthaya hakiniyogasiddhaye || 3 || paranathasya
    yogadhisiddhaye kulabhairavi | kripaya vada me prita dharmasiddhinibandhanat || 4 || mama deharakshanaya
    pativratyaprasiddhaye | mahavishahare shighram vada yogini vistarat || 5 || tvatprasadat khecaranam
    bhairavanam hi yoginam | natho'ham jagatikhande sudhakhande vada priye || 6 || punah punah staumi
    nitye tvameva supriya bhava | shrianandabhairavi uvaca atha yogeshvara prananatha yogendra siddhida
    || 7 || idanim kathaye te'ham nijadehasusiddhaye | sarvada hi pathasva tvam kalamrityum vasham naya
    || 8 || kripaya tava nathasya snehapashaniyantrita | tavajnapalanarthaya kalakutavinashanat || 9 ||
    bhuktimuktikriyabhaktisiddhaye tacchrinu prabho | nityamritakhandarasollasanamasahasrakam || 10 ||
    ashtottaram prayatnena yoginam hi hitaya ca | kathayami siddhanamajnananirnayasadhanam || 11 || om
    hsau sam pareshashca parashaktih priyeshvarah | shivah parah paribhadrah paresho nirmalo'dvayah ||
    12 || svayamjyotiranadyanto nirvikarah paratparah | paramatma parakasho'paro'pyaparajitah || 13 ||
    parvativallabhah shriman dinabandhustrilocanah | yogatma yogadah siddheshvaro virah svarantakah ||
    14 || kapilesho gururgitah svapriyo gitamohanah | gabhiro gadhanasthashca gitavadyapriyankarah ||
    15 || gurugitapavitrashca ganasammanatojjhitah | gayanatho dattanatho dattatreyapatih shivah || 16
    || akashavahako nilo nilanjanashariradhrik | khagarupi khecarashca gaganatma gabhiragah || 17 || gokotidanakartta
    ca gokotidugdhabhojanah | abhayavallabhah shriman paramatma nirakritih || 18 || sankhyadhari nirakari
    nirakaranavallabhah | vayvahari vayurupi vayuganta svavayupah || 19 || vataghno vatasampattirvatajirno
    vasantavit | vasanisho vyasanatho naradadimunishvarah || 20 || narayanapriyanando narayananirakritih
    | navamalo navakarta navasamjnanadharakah || 21 || jaladharo jneya indro nirindriyagunodayah | tejorupi
    candabhimo tejomaladharah kulah || 22 || kulateja kulanandah shobhadhyo vedarashmidhrik | kiranatma
    karanatma kalpacchayapatih shashi || 23 || parajnani paranandadayako dharmajitprabhuh | trilocanambhojarajo
    dirghanetro manoharah || 24 || camundeshah pracandeshah paribhadreshvaro harah | gopita mohito gopta
    guptistho gopapujitah || 25 || gopanakhyo godhaneshashca caruvaktro digambarah | pancananah pancamisho
    vishalo garudeshvarah || 26 || ardhanarishvareshashca nayikeshah kulantakah | samharavigrahah pretabhutakotiparayanah
    || 27 || anantesho'pyanantatma manicudo vibhavasuh | kalanalah kalarupi vedadharmeshvarah kavih ||
    28 || bhargah smaraharah shambhuh svayambhuh pitakundalah | jayapatiryajajuko vilashishah shikhapatih
    || 29 || parvateshah parvanakhyah kshetrapalo mahishvarah | varanasipatirmanyo dhanyo vrishasuvahanah
    || 30 || amritanandito mugdho vanamalishvarah priyah | kashipatih pranapatih kalakantho maheshvarah
    || 31 || kambukanthah krantivargo vargatma jalashasanah | jalabudbudavakshashca jalarekhamayah prithuh
    || 32 || parthivesho mahikarta prithiviparipalakah | bhumistho bhumipujyashca kshaunivrindarakarcitah
    || 33 || shulapanih shaktihasto padmagarbho hiranyabhrit | bhugartasamsthito yogi yogasambhavavigrahah
    || 34 || patalamulakarta ca patalakulapalakah | patalanagamaladhyo danakarta nirakulah || 35 || bhrunahanta
    paparadhinagakah kalanagakah | kapilogratapahprito lokopakarakrinnripah || 36 || nriparcito nriparthastho
    nriparthakotidayakah | parthivarcanasantushto mahavegi pareshvarah || 37 || paraparaparataro mahatarunivasakah
    | tarumulasthito rudro rudranamaphalodayah || 38 || raudrishaktipatih krodhi kopanashto virocanah
    | asamkhyeyakhyayuktashca parinamavivarjitah || 39 || pratapi pavanadharah prashamsyah sarvanirnayah
    | vedajapi mantrajapi devata gururishvarah || 40 || shrinatho gurudevashca paranatho guruh prabhuh
    | paraparagururjnani tantrajno'rkashataprabhah || 41 || tirkshyo gamanakari ca kalabhavi niranjanah
    | kalakutanalah shrotah punjapanaparayanah || 42 || parivaraganadhyashca parashashisutasthitah | sthitisthapakarupashca
    rupatito'malapatih || 43 || patisho bhagurishcaiva kalashcaiva haristatha | vaishnavah premasindhushca
    taralo vatavittaha || 44 || bhavasvarupo bhagavan nirakashah sanatanah | avyayah purushah sakshi cacyuto
    mandarashrayah || 45 || mandaradrikriyanando vrindavanatanudbhavah | vacyavacyasvarupashca nirmalakhyo
    vivadaha || 46 || vaidyo vedaparo grantho vedashastraprakashakah | smritimulo vedayuktih pratyakshakuladevata
    || 47 || parikshako varanakhyo mahashailanishevitah | virincapremadata ca janyollasakarah priyah ||
    48 || prayagadhari payo'rthi gangagangadharah smarah | gangabuddhipriyo devo gangasnananishevitah
    || 49 || gangasalilasamstho hi gangapratyakshasadhakah | giro gangamanimaro mallikamaladharakah ||
    50 || mallikagandhasupremo mallikapushpadharakah | mahadrumo mahaviro mahashuro mahoragah || 51 ||
    mahatushtirmahapushtirmahalakshmishubhankarah | mahashrami mahadhyani mahacandeshvaro mahan || 52
    || mahadevo mahahlado mahabuddhiprakashakah | mahabhakto mahashakto mahadhurto mahamatih || 53 ||
    mahacchatradharo dharodharakotigataprabha | advaitanandavadi ca mukto bhangapriyo'priyah || 54 ||
    atigandhashcatimatro ninitantah parantapah | ninito'niladhari ca sukshmanilanirupakah || 55 || mahabhayankaro
    golo mahavivekabhushanah | sudhanandah pithasamstho hinguladeshvarah surah || 56 || naro nagapatih
    kruro bhaktanam kamadah prabhuh | nagamaladharo dharmi nityakarmi kulinakrit || 57 || shishupaleshvarah
    kirtivikari lingadharakah | triptanando hrishikesheshvarah pancalavallabhah || 58 || akrureshah patih
    pritivardhako lokavardhakah | atipujyo vamadevo daruno ratisundarah || 59 || mahakalah priyahladi
    vinodi pancacudadhrik | adyashaktipatih panto vibhadhari prabhakarah || 60 || anayasagatirbuddhipraphullo
    nandipujitah | shilamurtisthito ratnamalamanditavigrahah || 61 || budhashrido budhanando vibudho bodhavardhanah
    | aghorah kalaharta ca nishkalanko nirashrayah || 62 || pithashaktipatih premadharako mohakarakah
    | asamo visamo bhavo'bhavo bhavo nirindriyah || 63 || niraloko bilanando bilastho vishabhukpatih |
    durgapatirdurgaharta dirghasiddhantapujitah || 64 || sarvo durgapativipro viprapujaparayanah | brahmananandanirato
    brahmakarmasamadhivit || 65 || vishvatma vishvabharta ca vishvavijnanapurakah | vishvantahkaranasthashca
    vishvasamjnapratishthitah || 66 || vishvadharo vishvapujyo vishvastho'cita indraha | alabubhakshanah
    kshantiraksho rakshanivaranah || 67 || titiksharahito hutih puruhutapriyankarah | purushah purushashreshtho
    vilalasthah kulalaha || 68 || kutilastho vidhiprano vishayanandaparagah | brahmajnanaprado brahmajnani
    brahmagunantarah || 69 || palakesho virajashca vajradando mahastradhrik | sarvastrarakshakah shrido
    vidhibuddhiprapuranah || 70 || aryaputro devarajapujito munipujitah | gandharvapujitah pujyo danavajnananashanah
    || 71 || apsaroganapujyashca martyalokasupujitah | mrityujidripujit plaksho mrityunjaya ishupriyah
    || 72 || tribijatma nilakanthah kshitisho roganashanah | jitarih premasevyashca bhaktigamyo nirudyamah
    || 73 || niriho nirayahladah kumaro ripupujitah | ajo devatmajo dharmo'santo mandamasanah || 74 ||
    mandahaso mandanashto mandagandhasuvasitah | manikyaharanilayo muktaharavibhushitah || 75 || muktido
    bhaktidashcaiva nirvanapadadanadah | nirvikalpo modadhari niratanko mahajanah || 76 || muktavidrumamaladhyo
    muktadamalasatkatih || 77 || ratneshvaro dhaneshashca dhaneshapranavallabhah | dhanajivi karmajivi
    samharavigrahojjvalah || 78 || samnketarthajnanashunyo mahasanketapanditah | supanditah kshemadata
    bhavadata bhavanvayah || 79 || kinkaresho vidhata ca vidhatuh priyavallabhah | karta harta karayita
    yojanayojanashrayah || 80 || yukto yogapatih shraddhapalako bhutashankarah | bhutadhyaksho bhutanatho
    bhutapalanatatparah || 81 || vibhutidata bhutishca mahabhutivivardhanah | mahalakshmishvarah kantah
    kamaniyah kaladharah || 82 || kamalakanta ishano yamo'maro manojavah | manayogi manayogi manabhango
    nirupanah || 83 || avyaktanandanirato vyaktavyaktanirupitah | atmaramapatih krishnapalako ramapalakah
    || 84 || lakshanesho lakshabharta bhavatishah prajabhavah | bharatakhyo bharatashca shatrughno hanuman
    kapih || 85 || kapicudamanih kshetrapalesho dikkarantarah | dishampatidishishashca dikpalo hi digambarah
    || 86 || anantaratnacudadhyo nanaratnasanasthitah | samvidanandanirato vijayo vijayatmajah || 87 ||
    jayajayavicarashca bhavacudamanishvarah | mundamaladharastantri saratantrapracarakah || 88 || samsararakshakah
    prani pancaprano mahashayah | garudadhvajapujyashca garudadhvajavigrahah || 89 || garudisho mantrinisho
    maitrapranahitakarah | siddhimitro mitradevo jagannatho nareshvarah || 90 || narendreshvarabhavastho
    vidyabhavapracaravit | kalagnirudro bhagavan pracandeshvarabhupatih || 91 || alakshmiharakah kruddho
    ripunam kshayakarakah | sadanandamayo vriddho dharmasakshi sudhamshudhrik || 92 || saksharo ripuvargastho
    daityaha mundadharakah | kapali rundamaladhyo mahabijaprakashakah || 93 || ajeyograpatih svahavallabho
    hetuvallabhah | hetupriyanandadata hetubijaprakashakah || 94 || shrutikshipramanirato brahmasutraprabodhakah
    | brahmanando jayanando vijayananda eva ca || 95 || sudhanando budhanando vidyanando balipatih | jnananando
    vibhanando bhavanando nripasanah || 96 || sarvasanogranandashca jagadanandadayakah | purnanando bhavanando
    hyamritananda eva ca || 97 || shitalo'shitivarshastho vyavasthaparicayakah | shiladhyashca sushilashca
    shilanando parashrayah || 98 || sulabho madhuranando madhuramodamadanah | abhedyo mutrasancari kalahakhyo
    vishankatah || 99 || vashabhadhyah paranando visamananda ulbanah | adhipo varunimatto mattagandharvashasanah
    || 100 || shatakotisharushrido virakotisamaprabhah | ajavibhavarinatho vishamapushnipujitah || 101
    || vidyapatirvedapatiraprameyaparakramah | rakshopatirmahavirapatih premopakarakah || 102 || varanavipriyanando
    varanesho vibhusthitah | ranacando rasheshashca ranaramapriyah prabhuh || 103 || rananathi ranahladah
    samgramapretavigrahah | devibhakto devadevo divi darunatatparah || 104 || khadgi ca kavaci siddhah
    shuli dhulistrishuladhrik | dhanushman dharmacittesho'cinnanagasumalyadhrik || 105 || artho'narthapriyo'prayo
    malatito'tisundarah | kancanadhyo hemamali kancanasha
  devanagari: हाकिनीश्वराष्टोत्तरसहस्रनामस्तोत्र परनाथाष्टोत्तरसहस्रनामस्तोत्रं च श्रीआनन्दभैरव उवाच ।
    आनन्दभैरवि प्राणवल्लभे जगदीश्वरि । तव प्रसादवाक्येन श्रुतं नामसहस्रकम् ॥ १ ॥ हाकिन्याः कुलयोगिन्याः
    परमाद्भुतमङ्गलम् । इदानीं श्रोतुमिच्छामि परनाथस्य वाञ्छितम् ॥ २ ॥ सहस्रनामयोगाङ्गमष्टोत्तरसमाकुलम्
    । भ्रूपद्मभेदनार्थाय हाकिनीयोगसिद्धये ॥ ३ ॥ परनाथस्य योगाधिसिद्धये कुलभैरवि । कृपया वद मे प्रीता धर्मसिद्धिनिबन्धनात्
    ॥ ४ ॥ मम देहरक्षणाय पातिव्रात्यप्रसिद्धये । महाविषहरे शीघ्रं वद योगिनि विस्तरात् ॥ ५ ॥ त्वत्प्रसादात्
    खेचराणां भैरवाणां हि योगिनाम् । नाथोऽहं जगतीखण्डे सुधाखण्डे वद प्रिये ॥ ६ ॥ पुनः पुनः स्तौमि नित्ये
    त्वमेव सुप्रिया भव । श्रीआनन्दभैरवी उवाच अथ योगेश्वर प्राणनाथ योगेन्द्र सिद्धिद ॥ ७ ॥ इदानीं कथये
    तेऽहं निजदेहसुसिद्धये । सर्वदा हि पठस्व त्वं कालमृत्युं वशं नय ॥ ८ ॥ कृपया तव नाथस्य स्नेहपाशनियन्त्रिता
    । तवाज्ञापालनार्थाय कालकूटविनाशनात् ॥ ९ ॥ भुक्तिमुक्तिक्रियाभक्तिसिद्धये तच्छृणु प्रभो । नित्यामृतखण्डरसोल्लासनामसहस्रकम्
    ॥ १० ॥ अष्टोत्तरं प्रयत्नेन योगिनां हि हिताय च । कथयामि सिद्धनामज्ञाननिर्णयसाधनम् ॥ ११ ॥ ॐ ह्सौ सां
    परेशश्च पराशक्तिः प्रियेश्वरः । शिवः परः पारिभद्रः परेशो निर्मलोऽद्वयः ॥ १२ ॥ स्वयंज्योतिरनाद्यन्तो
    निर्वीकारः परात्परः । परमात्मा पराकाशोऽपरोऽप्यपराजितः ॥ १३ ॥ पार्वतीवल्लभः श्रीमान् दीनबन्धुस्त्रिलोचनः
    । योगात्मा योगदः सिद्धेश्वरो वीरः स्वरान्तकः ॥ १४ ॥ कपिलेशो गुरुर्गीतः स्वप्रियो गीतमोहनः । गभीरो
    गाधनस्थश्च गीतवाद्यप्रियङ्करः ॥ १५ ॥ गुरुगीतापवित्रश्च गानसम्मानतोज्झितः । गयानाथो दत्तनाथो दत्तात्रेयपतिः
    शिवः ॥ १६ ॥ आकाशवाहको नीलो नीलाञ्जनशरीरधृक् । खगरूपी खेचरश्च गगनात्मा गभीरगः ॥ १७ ॥ गोकोटिदानकर्त्ता
    च गोकोटिदुग्धभोजनः । अभयावल्लभः श्रीमान् परमात्मा निराकृतिः ॥ १८ ॥ सङ्ख्याधारी निराकारी निराकरणवल्लभः
    । वाय्वाहारी वायुरूपी वायुगन्ता स्ववायुपाः ॥ १९ ॥ वातघ्नो वातसम्पत्तिर्वाताजीर्णो वसन्तवित् । वासनीशो
    व्यासनाथो नारदादिमुनीश्वरः ॥ २० ॥ नारायणप्रियानन्दो नारायणनिराकृतिः । नावमालो नावकर्ता नावसंज्ञानधारकः
    ॥ २१ ॥ जलाधारो ज्ञेय इन्द्रो निरिन्द्रियगुणोदयः । तेजोरूपी चण्डभीमो तेजोमालाधरः कुलः ॥ २२ ॥ कुलतेजा
    कुलानन्दः शोभाढ्यो वेदरश्मिधृक् । किरणात्मा कारणात्मा कल्पच्छायापतिः शशी ॥ २३ ॥ परज्ञानी परानन्ददायको
    धर्मजित्प्रभुः । त्रिलोचनाम्भोजराजो दीर्घनेत्रो मनोहरः ॥ २४ ॥ चामुण्डेशः प्रचण्डेशः पारिभद्रेश्वरो
    हरः । गोपिता मोहितो गोप्ता गुप्तिस्थो गोपपूजितः ॥ २५ ॥ गोपनाख्यो गोधनेशश्च चारुवक्त्रो दिगम्बरः ।
    पञ्चाननः पञ्चमीशो विशालो गरुडेश्वरः ॥ २६ ॥ अर्धनारीश्वरेशश्च नायिकेशः कुलान्तकः । संहारविग्रहः प्रेतभूतकोटिपरायणः
    ॥ २७ ॥ अनन्तेशोऽप्यनन्तात्मा मणिचूडो विभावसुः । कालानलः कालरूपी वेदधर्मेश्वरः कविः ॥ २८ ॥ भर्गः स्मरहरः
    शम्भुः स्वयम्भुः पीतकुण्डलः । जायापतिर्याजजूको विलाशीशः शिखापतिः ॥ २९ ॥ पर्वतेशः पार्वणाख्यः क्षेत्रपालो
    महीश्वरः । वाराणसीपतिर्मान्यो धन्यो वृषसुवाहनः ॥ ३० ॥ अमृतानन्दितो मुग्धो वनमालीश्वरः प्रियः । काशीपतिः
    प्राणपतिः कालकण्ठो महेश्वरः ॥ ३१ ॥ कम्बुकण्ठः क्रान्तिवर्गो वर्गात्मा जलशासनः । जलबुद्बुदवक्षश्च जलरेखामयः
    पृथुः ॥ ३२ ॥ पार्थिवेशो महीकर्ता पृथिवीपरिपालकः । भूमिस्थो भूमिपूज्यश्च क्षौणीवृन्दारकार्चीतः ॥ ३३
    ॥ शूलपाणिः शक्तिहस्तो पद्मगर्भो हिरण्यभृत् । भूगर्तसंस्थितो योगी योगसम्भवविग्रहः ॥ ३४ ॥ पातालमूलकर्ता
    च पातालकुलपालकः । पातालनागमालाढ्यो दानकर्ता निराकुलः ॥ ३५ ॥ भ्रूणहन्ता पापराधिनागकः कालनागकः । कपिलोग्रतपःप्रीतो
    लोकोपकारकृन्नृपः ॥ ३६ ॥ नृपार्चीतो नृपार्थस्थो नृपार्थकोटिदायकः । पार्थिवार्चनसन्तुष्टो महावेगी परेश्वरः
    ॥ ३७ ॥ परापारापारतरो महातरुनिवासकः । तरुमूलस्थितो रुद्रो रुद्रनामफलोदयः ॥ ३८ ॥ रौद्रीशक्तिपतिः क्रोधी
    कोपनष्टो विरोचनः । असंख्येयाख्ययुक्तश्च परिणामविवर्जितः ॥ ३९ ॥ प्रतापी पवनाधारः प्रशंस्यः सर्वनिर्णयः
    । वेदजापी मन्त्रजापी देवता गुरुरीश्वरः ॥ ४० ॥ श्रीनाथो गुरुदेवश्च परनाथो गुरुः प्रभुः । परापरगुरुर्ज्ञानी
    तन्त्रज्ञोऽर्कशतप्रभाः ॥ ४१ ॥ तीर्क्ष्यो गमनकारी च कालभावी निरञ्जनः । कालकूटानलः श्रोतः पुञ्जपानपरायणः
    ॥ ४२ ॥ परिवारगणाढ्यश्च पाराशाषिसुतस्थितः । स्थितिस्थापकरूपश्च रूपातीतोऽमलापतिः ॥ ४३ ॥ पतीशो भागुरिश्चैव
    कालश्चैव हरिस्तथा । वैष्णवः प्रेमसिन्धुश्च तरलो वातवित्तहा ॥ ४४ ॥ भावस्वरूपो भगवान् निराकाशः सनातनः
    । अव्ययः पुरुषः साक्षी चाच्युतो मन्दराश्रयः ॥ ४५ ॥ मन्दराद्रिक्रियानन्दो वृन्दावनतनूद्भवः । वाच्यावाच्यस्वरूपश्च
    निर्मलाख्यो विवादहा ॥ ४६ ॥ वैद्यो वेदपरो ग्रन्थो वेदशास्त्रप्रकाशकः । स्मृतिमूलो वेदयुक्तिः प्रत्यक्षकुलदेवता
    ॥ ४७ ॥ परीक्षको वारणाख्यो महाशैलनिषेवितः । विरिञ्चप्रेमदाता च जन्योल्लासकरः प्रियः ॥ ४८ ॥ प्रयागधारी
    पयोऽर्थी गाङ्गागङ्गाधरः स्मरः । गङ्गाबुद्धिप्रियो देवो गङ्गास्नाननिषेवितः ॥ ४९ ॥ गङ्गासलिलसंस्थो हि
    गङ्गाप्रत्यक्षसाधकः । गिरो गङ्गामणिमरो मल्लिकामालधारकः ॥ ५० ॥ मल्लिकागन्धसुप्रेमो मल्लिकापुष्पधारकः
    । महाद्रुमो महावीरो महाशूरो महोरगः ॥ ५१ ॥ महातुष्टिर्महापुष्टिर्महालक्ष्मीशुभङ्करः । महाश्रमी महाध्यानी
    महाचण्डेश्वरो महान् ॥ ५२ ॥ महादेवो महाह्लादो महाबुद्धिप्रकाशकः । महाभक्तो महाशक्तो महाधूर्तो महामतिः
    ॥ ५३ ॥ महाच्छत्रधरो धारोधरकोटिगतप्रभा । अद्वैतानन्दवादी च मुक्तो भङ्गप्रियोऽप्रियः ॥ ५४ ॥ अतिगन्धश्चातिमात्रो
    निणीतान्तः परन्तपः । निणीतोऽनिलधारी च सूक्ष्मानिलनिरूपकः ॥ ५५ ॥ महाभयङ्करो गोलो महाविवेकभूषणः । सुधानन्दः
    पीठसंस्थो हिङ्गुलादेश्वरः सुरः ॥ ५६ ॥ नरो नागपतिः क्रूरो भक्तानां कामदः प्रभुः । नागमालाधरो धर्मी
    नित्यकर्मी कुलीनकृत् ॥ ५७ ॥ शिशुपालेश्वरः कीर्तिविकारी लिङ्गधारकः । तृप्तानन्दो हृषीकेशेश्वरः पाञ्चालवल्लभः
    ॥ ५८ ॥ अक्रूरेशः पतिः प्रीतिवर्धको लोकवर्धकः । अतिपूज्यो वामदेवो दारुणो रतिसुन्दरः ॥ ५९ ॥ महाकालः
    प्रियाह्लादी विनोदी पञ्चचूडधृक् । आद्याशक्तिपतिः पान्तो विभाधारी प्रभाकरः ॥ ६० ॥ अनायासगतिर्बुद्धिप्रफुल्लो
    नन्दिपूजितः । शीलामूर्तीस्थितो रत्नमालामण्डितविग्रहः ॥ ६१ ॥ बुधश्रीदो बुधानन्दो विबुधो बोधवर्धनः ।
    अघोरः कालहर्ता च निष्कलङ्को निराश्रयः ॥ ६२ ॥ पीठशक्तिपतिः प्रेमधारको मोहकारकः । असमो विसमो भावोऽभावो
    भावो निरिन्द्रियः ॥ ६३ ॥ निरालोको बिलानन्दो बिलस्थो विषभुक्पतिः । दुर्गापतिर्दुर्गहर्ता दीर्घसिद्धान्तपूजितः
    ॥ ६४ ॥ सर्वो दुर्गापतिवीप्रो विप्रपूजापरायणः । ब्राह्मणानन्दनिरतो ब्रह्मकर्मसमाधिवित् ॥ ६५ ॥ विश्वात्मा
    विश्वभर्ता च विश्वविज्ञानपूरकः । विश्वान्तःकारणस्थश्च विश्वसंज्ञाप्रतिष्ठितः ॥ ६६ ॥ विश्वाधारो विश्वपूज्यो
    विश्वस्थोऽचीत इन्द्रहा । अलाबुभक्षणः क्षान्तिरक्षो रक्षनिवारणः ॥ ६७ ॥ तितिक्षारहितो हूतिः पुरुहूतप्रियङ्करः
    । पुरुषः पुरुषश्रेष्ठो विलालस्थः कुलालहा ॥ ६८ ॥ कुटिलस्थो विधिप्राणो विषयानन्दपारगः । ब्रह्मज्ञानप्रदो
    ब्रह्मज्ञानी ब्रह्मगुणान्तरः ॥ ६९ ॥ पालकेशो विराजश्च वज्रदण्डो महास्त्रधृक् । सर्वास्त्ररक्षकः श्रीदो
    विधिबुद्धिप्रपूरणः ॥ ७० ॥ आर्यपुत्रो देवराजपूजितो मुनिपूजितः । गन्धर्वपूजितः पूज्यो दानवज्ञाननाशनः
    ॥ ७१ ॥ अप्सरोगणपूज्यश्च मर्त्यलोकसुपूजितः । मृत्युजिद्रिपूजित् प्लक्षो मृत्युञ्जय इषुप्रियः ॥ ७२ ॥
    त्रिबीजात्मा नीलकण्ठः क्षितीशो रोगनाशनः । जितारिः प्रेमसेव्यश्च भक्तिगम्यो निरुद्यमः ॥ ७३ ॥ निरीहो
    निरयाह्लादः कुमारो रिपुपूजितः । अजो देवात्मजो धर्मोऽसन्तो मन्दमासनः ॥ ७४ ॥ मन्दहासो मन्दनष्टो मन्दगन्धसुवासितः
    । माणिक्यहारनिलयो मुक्ताहारविभूषितः ॥ ७५ ॥ मुक्तिदो भक्तिदश्चैव निर्वाणपददानदः । निर्विकल्पो मोदधारी
    निरातङ्को महाजनः ॥ ७६ ॥ मुक्ताविद्रुममालाढ्यो मुक्तादामलसत्कटिः ॥ ७७ ॥ रत्नेश्वरो धनेशश्च धनेशप्राणवल्लभः
    । धनजीवी कर्मजीवी संहारविग्रहोज्ज्वलः ॥ ७८ ॥ संङ्केतार्थज्ञानशून्यो महासङ्केतपण्डितः । सुपण्डितः क्षेमदाता
    भवदाता भवान्वयः ॥ ७९ ॥ किङ्करेशो विधाता च विधातुः प्रियवल्लभः । कर्ता हर्ता कारयिता योजनायोजनाश्रयः
    ॥ ८० ॥ युक्तो योगपतिः श्रद्धापालको भूतशङ्करः । भूताध्यक्षो भूतनाथो भूतपालनतत्परः ॥ ८१ ॥ विभूतिदाता
    भूतिश्च महाभूतिविवर्धनः । महालक्ष्मीश्वरः कान्तः कमनीयः कलाधरः ॥ ८२ ॥ कमलाकान्त ईशानो यमोऽमरो मनोजवः
    । मनयोगी मानयोगी मानभङ्गो निरूपणः ॥ ८३ ॥ अव्यक्तानन्दनिरतो व्यक्ताव्यक्तनिरूपितः । आत्मारामपतिः कृष्णपालको
    रामपालकः ॥ ८४ ॥ लक्षणेशो लक्षभर्ता भावतीशः प्रजाभवः । भरताख्यो भारतश्च शत्रुघ्नो हनुमान् कपिः ॥ ८५
    ॥ कपिचूडामणिः क्षेत्रपालेशो दिक्करान्तरः । दिशांपतिदीशीशश्च दिक्पालो हि दिगम्बरः ॥ ८६ ॥ अनन्तरत्नचूडाढ्यो
    नानारत्नासनस्थितः । संविदानन्दनिरतो विजयो विजयात्मजः ॥ ८७ ॥ जयाजयविचारश्च भावचूडामणीश्वरः । मुण्डमालाधरस्तन्त्री
    सारतन्त्रप्रचारकः ॥ ८८ ॥ संसाररक्षकः प्राणी पञ्चप्राणो महाशयः । गरुडध्वजपूज्यश्च गरुडध्वजविग्रहः ॥
    ८९ ॥ गारुडीशो मन्त्रिणीशो मैत्रप्राणहिताकरः । सिद्धिमित्रो मित्रदेवो जगन्नाथो नरेश्वरः ॥ ९० ॥ नरेन्द्रेश्वरभावस्थो
    विद्याभावप्रचारवित् । कालाग्निरुद्रो भगवान् प्रचण्डेश्वरभूपतिः ॥ ९१ ॥ अलक्ष्मीहारकः क्रुद्धो रिपूणां
    क्षयकारकः । सदानन्दमयो वृद्धो धर्मसाक्षी सुधांशुधृक् ॥ ९२ ॥ साक्षरो रिपुवर्गस्थो दैत्यहा मुण्डधारकः
    । कपाली रुण्डमालाढ्यो महाबीजप्रकाशकः ॥ ९३ ॥ अजेयोग्रपतिः स्वाहावल्लभो हेतुवल्लभः । हेतुप्रियानन्ददाता
    हेतुबीजप्रकाशकः ॥ ९४ ॥ श्रुतिक्षिप्रमणिरतो ब्रह्मसूत्रप्रबोधकः । ब्रह्मानन्दो जयानन्दो विजयानन्द एव
    च ॥ ९५ ॥ सुधानन्दो बुधानन्दो विद्यानन्दो बलीपतिः । ज्ञानानन्दो विभानन्दो भावानन्दो नृपासनः ॥ ९६ ॥
    सर्वासनोग्रानन्दश्च जगदानन्ददायकः । पूर्णानन्दो भवानन्दो ह्यमृतानन्द एव च ॥ ९७ ॥ शीतलोऽशीतिवर्षस्थो
    व्यवस्थापरिचायकः । शीलाढ्यश्च सुशीलश्च शीलानन्दो पराश्रयः ॥ ९८ ॥ सुलभो मधुरानन्दो मधुरामोदमादनः ।
    अभेद्यो मूत्रसञ्चारी कलहाख्यो विषङ्कटः ॥ ९९ ॥ वाशभाढ्यः परानन्दो विसमानन्द उल्बणः । अधिपो वारुणीमत्तो
    मत्तगन्धर्वशासनः ॥ १०० ॥ शतकोटिशरुश्रीदो वीरकोटिसमप्रभः । अजाविभावरीनाथो विषमापूष्णिपूजितः ॥ १०१ ॥
    विद्यापतिर्वेदपतिरप्रमेयपराक्रमः । रक्षोपतिर्महावीरपतिः प्रेमोपकारकः ॥ १०२ ॥ वारणाविप्रियानन्दो वारणेशो
    विभुस्थितः । रणचण्डो रशेशश्च रणरामप्रियः प्रभुः ॥ १०३ ॥ रणनाथी रणाह्लादः संग्रामप्रेतविग्रहः । देवीभक्तो
    देवदेवो दिवि दारुणतत्परः ॥ १०४ ॥ खड्गी च कवची सिद्धः शूली धूलिस्त्रिशूलधृक् । धनुष्मान् धर्मचित्तेशोऽचिन्ननागसुमाल्यधृक्
    ॥ १०५ ॥ अर्थोऽनर्थप्रियोऽप्रायो मलातीतोऽतिसुन्दरः । काञ्चनाढ्यो हेममाली काञ्चनश
