    karta namo svaha | om punyakarta namo svaha | om gunavale namo svaha | om guna se yukta namo svaha
    | 900|| om guno ke yogya namo svaha | om gine jane vale namo svaha | om guno ke premi namo svaha |
    om guno ke jnani namo svaha | om pujaniya guna vale namo svaha | om gunatantra marga ke pradhanapravartaka
