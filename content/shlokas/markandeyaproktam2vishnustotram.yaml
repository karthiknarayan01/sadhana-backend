id: markandeyaproktam2vishnustotram
category: stotram
name:
  english: markandeyaproktam2vishnustotram
  devanagari: मार्कण्डेयप्रोक्तं२विष्णुस्तोत्रम्
content:
  english: markandeyaproktam 2 vishnustotram gatva devasamipam ca pradakshinyena keshavam | tatah samuccaranmantram
    gayatrya vatha vaishnavam || 92|| narayanam sharanyesham sarvadevanamaskritam | namo yajnangasambhuta
    sarvavyapinnamo'stu te || 93|| namo namaste devesha padmagarbha sanatana | damodara jayananta raksha
    mam sharanagatam || 94|| tvam karta tvam ca harta ca jagatyasmimshcaracare | tvam palayasi bhutani
    bhuvanam tvam bibharshi ca || 95|| prasida devadevesha suptamangam prabodhaya | tvaddhyananirato nityam
    tvadbhaktiparamo hare || 96|| iti shriskandapurane avantyakhande revakhande shatcatvarimshadhika
  devanagari: मार्कण्डेयप्रोक्तं २ विष्णुस्तोत्रम् गत्वा देवसमीपं च प्रादक्षिण्येन केशवम् । ततः समुच्चरन्मन्त्रं
    गायत्र्या वाथ वैष्णवम् ॥ ९२॥ नारायणं शरण्येशं सर्वदेवनमस्कृतम् । नमो यज्ञाङ्गसम्भूत सर्वव्यापिन्नमोऽस्तु
    ते ॥ ९३॥ नमो नमस्ते देवेश पद्मगर्भ सनातन । दामोदर जयानन्त रक्ष मां शरणागतम् ॥ ९४॥ त्वं कर्ता त्वं
    च हर्ता च जगत्यस्मिंश्चराचरे । त्वं पालयसि भूतानि भुवनं त्वं बिभर्षि च ॥ ९५॥ प्रसीद देवदेवेश सुप्तमङ्गं
    प्रबोधय । त्वद्ध्याननिरतो नित्यं त्वद्भक्तिपरमो हरे ॥ ९६॥ इति श्रीस्कन्दपुराणे आवन्त्यखण्डे रेवाखण्डे
    षट्चत्वारिंशाधिक
meaning: {}
