id: kundikopanishat-samavedokta
category: upanishad
name:
  english: kundikopanishat (samavedokta)
  devanagari: कुण्डिकोपनिषत् (सामवेदोक्त)
content:
  english: kundikopanishat kundikopanishatkhyataparivrajakasamtatih | yatra vishrantimagamattadramapadamashraye
    || om apyayantu mamangani vakpranashcakshuh shrotramatho balamindriyani ca || sarvani sarvam brahmopanishadam
    maham brahma nirakuryam ma ma brahma nirakarodanirakaranamastvanirakaranam mestu tadatmani nirate
    ya upanishatsu dharmaste mayi santu te mayi santu || om shantih shantih shantih || harih om brahmacaryashrame
    kshine gurushushrushane ratah | vedanadhityanujnata ucyate gurunashrami || 1|| daramahritya sadrishamagnimadhaya
    shaktitah | brahmimishtim yajettasamahoratrena nirvapet || 2|| samvibhajya sutanarthe gramyakamanvisrijya
    ca | samcaranvanamargena shucau deshe paribhraman || 3|| vayubhaksho'mbubhaksho va vihitaih kandamulakaih
    | svasharire samapyatha prithivyam nashru patayet || 4|| saha tenaiva purushah katham samnyasta ucyate
    | sanamadheyo yasmimstu katham samnyasta ucyate || 5|| tasmatphalavishuddhangi samnyasam samhitatmanam
    | agnivarnam vinishkramya vanaprastham prapadyate || 6|| lokavadbharyayasakto vanam gacchati samyatah
    | samtyaktva samsritisukhamanutishthati kim mudha || 7|| kimva duhkhamanusmritya bhogamstyajati cocchritan
    | garbhavasabhayadbhitah shitoshnabhyam tathaiva ca || 8|| guhyam praveshtumicchami param padamanamayamiti
    | samnyasyagnimapunaravartanam yanmrityurjayamavahamiti || athadhyatmamantranjapet | dikshamupeyatkashayavasah
    | kakshopasthalomani varjayet | urdhvabahurvimuktamargo bhavati | aniketashcarebhikshashi | nididhyasanam
    dadhyat | pavitram dharayejjantusamrakshanartham | tadapi shloka bhavanti | kundikam camakam shikyam
    trivishtapamupanahau | shitopaghatinim kantham kaupinacchadanam tatha || 9|| pavitram snanashatim
    ca uttarasangameva ca | ato'tiriktam yatkimcitsarvam tadvarjayedyatih || 10|| nadipulinashayi syaddevagareshu
    bahyatah | natyartham sukhaduhkhabhyam shariramupatapayet || 11|| snanam panam tatha shaucamadbhih
    putabhiraciret | stuyamano na tushyeta nindito na shapetparan || 12|| bhikshadivaidalam patram snanadravyamavaritam
    | evam vrittimupasino yatendriyo japetsada || 13|| vishvayamanusamyogam manasa bhavayetsudhih | akashadvayurvayorjyotirjyotisha
    apo'dbhyah prithivi | esham bhutanam brahma prapadye | ajaramamaramaksharamavyayam prapadye | mayyakhandasukhambhodhau
    bahudha vishvavicayah | utpadyante viliyante mayamarutavibhramat || 14|| na me dehena sambandho megheneva
    vihayasah | atah kuto me taddharma jagratsvapnasushuptishu || 15|| akashavatkalpaviduragoha
  devanagari: कुण्डिकोपनिषत् कुण्डिकोपनिषत्ख्यातपरिव्राजकसंततिः । यत्र विश्रान्तिमगमत्तद्रामपदमाश्रये
    ॥ ॐ आप्यायन्तु ममाङ्गानि वाक्प्राणश्चक्षुः श्रोत्रमथो बलमिन्द्रियाणि च ॥ सर्वाणि सर्वं ब्रह्मोपनिषदं
    माहं ब्रह्म निराकुर्यां मा मा ब्रह्म निराकरोदनिराकरणमस्त्वनिराकरणं मेस्तु तदात्मनि निरते य उपनिषत्सु
    धर्मास्ते मयि सन्तु ते मयि सन्तु ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ हरिः ॐ ब्रह्मचर्याश्रमे क्षीणे गुरुशुश्रूषणे
    रतः । वेदानधीत्यानुज्ञात उच्यते गुरुणाश्रमी ॥ १॥ दारमाहृत्य सदृशमग्निमाधाय शक्तितः । ब्राह्मीमिष्टिं
    यजेत्तासामहोरात्रेण निर्वपेत् ॥ २॥ संविभज्य सुतानर्थे ग्राम्यकामान्विसृज्य च । संचरन्वनमार्गेण शुचौ
    देशे परिभ्रमन् ॥ ३॥ वायुभक्षोऽम्बुभक्षो वा विहितैः कन्दमूलकैः । स्वशरीरे समाप्याथ पृथिव्यां नाश्रु
    पातयेत् ॥ ४॥ सह तेनैव पुरुषः कथं संन्यस्त उच्यते । सनामधेयो यस्मिंस्तु कथं संन्यस्त उच्यते ॥ ५॥ तस्मात्फलविशुद्धाङ्गी
    संन्यासं संहितात्मनाम् । अग्निवर्णं विनिष्क्रम्य वानप्रस्थं प्रपद्यते ॥ ६॥ लोकवद्भार्ययासक्तो वनं
    गच्छति संयतः । संत्यक्त्वा संसृतिसुखमनुतिष्ठति किं मुधा ॥ ७॥ किंवा दुःखमनुस्मृत्य भोगांस्त्यजति चोच्छ्रितान्
    । गर्भवासभयाद्भीतः शीतोष्णाभ्यां तथैव च ॥ ८॥ गुह्यं प्रवेष्टुमिच्छामि परं पदमनामयमिति । संन्यस्याग्निमपुनरावर्तनं
    यन्मृत्युर्जायमावहमिति ॥ अथाध्यात्ममन्त्राञ्जपेत् । दीक्षामुपेयात्काषायवासाः । कक्षोपस्थलोमानि वर्जयेत्
    । ऊर्ध्वबाहुर्विमुक्तमार्गो भवति । अनिकेतश्चरेभिक्षाशी । निदिध्यासनं दध्यात् । पवित्रं धारयेज्जन्तुसंरक्षणार्थम्
    । तदपि श्लोका भवन्ति । कुण्डिकां चमकं शिक्यं त्रिविष्टपमुपानहौ । शीतोपघातिनीं कन्थां कौपीनाच्छादनं
    तथा ॥ ९॥ पवित्रं स्नानशाटीं च उत्तरासङ्गमेव च । अतोऽतिरिक्तं यत्किंचित्सर्वं तद्वर्जयेद्यतिः ॥ १०॥
    नदीपुलिनशायी स्याद्देवागारेषु बाह्यतः । नात्यर्थं सुखदुःखाभ्यां शरीरमुपतापयेत् ॥ ११॥ स्नानं पानं तथा
    शौचमद्भिः पूताभिराचिरेत् । स्तूयमानो न तुष्येत निन्दितो न शपेत्परान् ॥ १२॥ भिक्षादिवैदलं पात्रं स्नानद्रव्यमवारितम्
    । एवं वृत्तिमुपासीनो यतेन्द्रियो जपेत्सदा ॥ १३॥ विश्वायमनुसंयोगं मनसा भावयेत्सुधीः । आकाशाद्वायुर्वायोर्ज्योतिर्ज्योतिष
    आपोऽद्भ्यः पृथिवी । एषां भूतानां ब्रह्म प्रपद्ये । अजरममरमक्षरमव्ययं प्रपद्ये । मय्यखण्डसुखांभोधौ
    बहुधा विश्ववीचयः । उत्पद्यन्ते विलीयन्ते मायामारुतविभ्रमात् ॥ १४॥ न मे देहेन संबन्धो मेघेनेव विहायसः
    । अतः कुतो मे तद्धर्मा जाग्रत्स्वप्नसुषुप्तिषु ॥ १५॥ आकाशवत्कल्पविदूरगोह
