id: gita-govindam-chapter-10-chatura-chaturbhuja
category: stotram
name:
  english: Gita Govindam Chapter 10 - Chatura Chaturbhuja
content:
  english: '|| dashamah sargah || || caturacaturbhujah || atrantare masrinaroshavashamasim nihshvasanihsahamukhim
    sumukhimupetya | savridamikshitasakhivadanam dinante sanandagadgadapadam harirityuvaca || || vadasi
    yadi kincidapi dantarucikaumudi harati daratimiramatighoram | sphuradadharasidhave tava vadanacandrama
    rocayatu locanacakoram || priye carushile munca mayi manamanidanam sapadi madananalo dahati mama manasam
    dehi mukhakamalamadhupanam || || satyamevasi yadi sudati mayi kopini dehi kharanakhasharaghatam |
    ghataya bhujabandhanam janaya radakhandanam yena va bhavati sukhajatam || || tvamasi mama bhushanam
    tvamasi mama jivanam tvamasi bhavajaladhiratnam | bhavatu bhavatiha mayi satatamanorodhini tatra mama
    hridayamatiratnam || || nilanalinabhamapi tanvi tava locanam dharayati kokanadarupam | kusumasharabanabhavena
    yadi ranjayasi krishnamidametadanurupam || || sphuratu kucakumbhayorupari manimanjari ranjayatu tava
    hridayadesham | rasatu rashanapi tava ghanajaghanamandale ghoshayatu manmathanidesham || || sthalakamalaganjanam
    mama hridayaranjanam janitaratirangaparabhagam | bhana masrinavani karavani padapankajam sarasalasadalaktakaragam
    || || smaragaralakhandanam mama shirasi mandanam dehi padapallavamudaram | jvalati mayi daruno madanakadanaruno
    haratu tadupahitavikaram || || iti catulacatupatucaru muravairino radhikamadhi vacanajatam | jayati
    padmavatiramanajayadevakavi || parihara kritatanke shankam tvaya satatam ghana stanajaghanayakrante
    svante paranavakashini | vishati vitanoranyo dhanyo na ko''pi mamantaram stanabharaparirambharambhe
    vidhehi vidheyatam || || mugdhe vidhehi mayi nirdayadantadamsha dorvallibandhanibidastanapidanani
    | candi tvameva mudamanca na pancabana candalakandadalanadasavah prayantu || || vyathayati vritha
    maunam tanvi prapancaya pancamam taruni madhuralapaistapam vinodaya drishtibhih | sumukhi vimukhibhavam
    tavadvimunca na munca mam svayamatishayasnigdho mugdhe priyi''hamupasthitah || || bandhukadyutibandhavo''yamadharah
    snigdho madhukaccavi rgandashcandi cakasti nilanalinashrimocanam locanam | nasabhyeti tilaprasunapadavim
    kundabhadanti priye prayastvanmukhasevaya vijayate vishvam sa pushpayudhah || || drishau tava madalase
    vadanamindusandipakam gatirjanamanorama vidhutarambhamurudvayam | ratistava kalavati ruciracitralekhe
    bhruva vaho vibudhayauvanam vahasi tanvi prithvigata || || || iti shrigitagovinde maninivarnane caturacaturbhujo
    nama dashamah sargah ||'
  devanagari: ॥ दशमः सर्गः ॥ ॥ चतुरचतुर्भुजः ॥ अत्रान्तरे मसृणरोषवशामसीम् निःश्वासनिःसहमुखीं सुमुखीमुपेत्य
    । सव्रीडमीक्षितसखीवदनां दिनान्ते सानन्दगद्गदपदं हरिरित्युवाच ॥ ॥ वदसि यदि किञ्चिदपि दन्तरुचिकौमुदी
    हरति दरतिमिरमतिघोरम् । स्फुरदधरसीधवे तव वदनचन्द्रमा रोचयतु लोचनचकोरम् ॥ प्रिये चारुशीले मुञ्च मयि
    मानमनिदानं सपदि मदनानलो दहति मम मानसं देहि मुखकमलमधुपानम् ॥ ॥ सत्यमेवासि यदि सुदति मयि कोपिनी देहि
    खरनखशरघातम् । घटय भुजबन्धनं जनय रदखण्डनं येन वा भवति सुखजातम् ॥ ॥ त्वमसि मम भूषणं त्वमसि मम जीवनं
    त्वमसि भवजलधिरत्नम् । भवतु भवतीह मयि सततमनोरोधिनि तत्र मम हृदयमतिरत्नम् ॥ ॥ नीलनलिनाभमपि तन्वि तव
    लोचनं धारयति कोकनदरूपम् । कुसुमशरबाणभावेन यदि रञ्जयसि कृष्णमिदमेतदनुरूपम् ॥ ॥ स्फुरतु कुचकुम्भयोरुपरि
    मणिमञ्जरी रञ्जयतु तव हृदयदेशम् । रसतु रशनापि तव घनजघनमण्डले घोषयतु मन्मथनिदेशम् ॥ ॥ स्थलकमलगञ्जनं
    मम हृदयरञ्जनं जनितरतिरङ्गपरभागम् । भण मसृणवाणि करवाणि पदपङ्कजं सरसलसदलक्तकरागम् ॥ ॥ स्मरगरलखण्डनं
    मम शिरसि मण्डनं देहि पदपल्लवमुदारम् । ज्वलति मयि दारुणो मदनकदनारुणो हरतु तदुपाहितविकारम् ॥ ॥ इति चटुलचाटुपटुचारु
    मुरवैरिणो राधिकामधि वचनजातम् । जयति पद्मावतीरमणजयदेवकवि ॥ परिहर कृतातङ्के शङ्कां त्वया सततं घन स्तनजघनयाक्रान्ते
    स्वान्ते परानवकाशिनि । विशति वितनोरन्यो धन्यो न कोऽपि ममान्तरं स्तनभरपरीरम्भारम्भे विधेहि विधेयताम्
    ॥ ॥ मुग्धे विधेहि मयि निर्दयदन्तदंश दोर्वल्लिबन्धनिबिडस्तनपीडनानि । चण्डि त्वमेव मुदमञ्च न पञ्चबाण
    चण्डालकाण्डदलनादसवः प्रयान्तु ॥ ॥ व्यथयति वृथा मौनं तन्वि प्रपञ्चय पञ्चमं तरुणी मधुरालापैस्तापं विनोदय
    दृष्टिभिः । सुमुखि विमुखीभावं तावद्विमुञ्च न मुञ्च मां स्वयमतिशयस्निग्धो मुग्धे प्रियिऽहमुपस्थितः
    ॥ ॥ बन्धूकद्युतिबान्धवोऽयमधरः स्निग्धो मधूकच्चवि र्गण्डश्चण्डि चकास्ति नीलनलिनश्रीमोचनं लोचनम् । नासाभ्येति
    तिलप्रसूनपदवीं कुन्दाभदान्ति प्रिये प्रायस्त्वन्मुखसेवया विजयते विश्वं स पुष्पायुधः ॥ ॥ दृशौ तव मदालसे
    वदनमिन्दुसन्दीपकं गतिर्जनमनोरमा विधुतरम्भमूरुद्वयम् । रतिस्तव कलावती रुचिरचित्रलेखे भ्रुवा वहो विबुधयौवनं
    वहसि तन्वी पृथ्वीगता ॥ ॥ ॥ इति श्रीगीतगोविन्दे मानिनीवर्णने चतुरचतुर्भुजो नाम दशमः सर्गः ॥
