id: rajanalakritamcarmamundadevistotram
category: stotram
name:
  english: rajanalakritamcarmamundadevistotram
  devanagari: राजानलकृतंचर्ममुण्डादेवीस्तोत्रम्
content:
  english: raja nalakritam carmamundadevistotram tatah sa mrinmayim kritva carmamundadharam nripah | vibhavabhavatah
    pashcatphalamulairatarpayat || 17|| tatastasyah stutim kritva purah sthitva kritanjalih | shraddhaya
    paraya yukto nishadhadhipatih svayam || 18|| jaya sarvagate devi carmamundadhare vare | jaya daityakulocchedadakshe
    dakshatmaje shubhe || 19|| kalaratri jayacintye navamyashtamivallabhe | trinetre tryambakabhishte
    jaya devi surarcite || 20|| bhimarupe surupe ca mahavidye mahabale | mahodaye mahakaye jayadevi mahavrate
    || 21|| nityarupe jagaddhatri suramamsavasapriye | vikarali mahakali jaya pretajananuge || 22|| shavayanarate
    ramye bhujangabharananvite | pashahaste mahahaste rudhiraughakritaspade || 23|| phetkararavashobhishthe
    gitavadyavirajite | jayanadye jaya dhyeye bhargadehardhasamshraye || 24|| tvam ratistvam dhritistushtistvam
    gauri tvam sureshvari | tvam lakshmistvam ca savitri gayatri tvamasamshayam || 25|| yatkincittrishu
    lokeshu strirupam devi drishyate | tatsarvam tvanmayam natra vikalpo'sti mama kvacit || 26|| yena
    satyena tena tvamatravasam drutam kuru | sannidhyam bhaktitastushta surasuranamaskrite || 27|| iti
    shriskandapurane nagarakhande catuhpancashattamadhyayantargatam raja nalakritam carmamundadevistotram
    samaptam | skandapurana | nagarakhanda | adhyaya 54
  devanagari: राजा नलकृतं चर्ममुण्डादेवीस्तोत्रम् ततः स मृण्मयीं कृत्वा चर्ममुण्डधरां नृपः । विभवाभावतः
    पश्चात्फलमूलैरतर्पयत् ॥ १७॥ ततस्तस्याः स्तुतिं कृत्वा पुरः स्थित्वा कृताञ्जलिः । श्रद्धया परया युक्तो
    निषधाधिपतिः स्वयम् ॥ १८॥ जय सर्वगते देवि चर्ममुण्डधरे वरे । जय दैत्यकुलोच्छेददक्षे दक्षात्मजे शुभे
    ॥ १९॥ कालरात्रि जयाचिन्त्ये नवम्यष्टमिवल्लभे । त्रिनेत्रे त्र्यम्बकाभीष्टे जय देवि सुरार्चिते ॥ २०॥
    भीमरूपे सुरूपे च महाविद्ये महाबले । महोदये महाकाये जयदेवि महाव्रते ॥ २१॥ नित्यरूपे जगद्धात्रि सुरामांसवसाप्रिये
    । विकरालि महाकालि जय प्रेतजनानुगे ॥ २२॥ शवयानरते रम्ये भुजङ्गाभरणान्विते । पाशहस्ते महाहस्ते रुधिरौघकृतास्पदे
    ॥ २३॥ फेत्कारारवशोभिष्ठे गीतवाद्यविराजिते । जयानाद्ये जय ध्येये भर्गदेहार्धसंश्रये ॥ २४॥ त्वं रतिस्त्वं
    धृतिस्तुष्टिस्त्वं गौरी त्वं सुरेश्वरी । त्वं लक्ष्मीस्त्वं च सावित्री गायत्री त्वमसंशयम् ॥ २५॥ यत्किञ्चित्त्रिषु
    लोकेषु स्त्रीरूपं देवि दृश्यते । तत्सर्वं त्वन्मयं नात्र विकल्पोऽस्ति मम क्वचित् ॥ २६॥ येन सत्येन
    तेन त्वमत्रावासं द्रुतं कुरु । सान्निध्यं भक्तितस्तुष्टा सुरासुरनमस्कृते ॥ २७॥ इति श्रीस्कन्दपुराणे
    नागरखण्डे चतुःपञ्चाशत्तमाध्यायान्तर्गतं राजा नलकृतं चर्ममुण्डादेवीस्तोत्रं समाप्तम् । स्कन्दपुराण
    । नागरखण्ड । अध्याय ५४
