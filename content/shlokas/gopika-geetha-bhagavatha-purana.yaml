id: gopika-geetha-bhagavatha-purana
category: stotram
name:
  english: Gopika Geetha (Bhagavatha Purana)
content:
  english: gopya ucuh | jayati te'dhikam janmana vrajah shrayata indira shashvadatra hi | dayita drishyatam
    dikshu tavaka stvayi dhritasavastvam vicinvate || || sharadudashaye sadhujatasa tsarasijodarashrimusha
    drisha | suratanatha te'shulkadasika varada nighnato neha kim vadhah || || vishajalapyayadvyalarakshasa
    dvarshamarutadvaidyutanalat | vrishamayatmajadvishvatobhaya drishabha te vayam rakshita muhuh || ||
    na khalu gopikanandano bhava nakhiladehinamantaratmadrik | vikhanasarthito vishvaguptaye sakha udeyivansatvatam
    kule || || viracitabhayam vrishnidhurya te caranamiyusham samsriterbhayat | karasaroruham kanta kamadam
    shirasi dhehi nah shrikaragraham || || vrajajanartihanvira yoshitam nijajanasmayadhvamsanasmita |
    bhaja sakhe bhavatkinkarih sma no jalaruhananam caru darshaya || || pranatadehinam papakarshanam trinacaranugam
    shriniketanam | phaniphanarpitam te padambujam krinu kuceshu nah krindhi hricchayam || || madhuraya
    gira valguvakyaya budhamanojnaya pushkarekshana | vidhikaririma vira muhyati radharasidhuna''pyayayasva
    nah || || tava kathamritam taptajivanam kavibhiriditam kalmashapaham | shravanamangalam shrimadatatam
    bhuvi grinanti te bhurida janah || || prahasitam priya premavikshanam viharanam ca te dhyanamangalam
    | rahasi samvido ya hridisprishah kuhaka no manah kshobhayanti hi || || calasi yadvrajaccarayanpashun
    nalinasundaram natha te padam | shilatrinankuraih sidatiti nah kalilatam manah kanta gacchati || ||
    dinaparikshaye nilakuntalai rvanaruhananam bibhradavritam | ghanarajasvalam darshayanmuhu rmanasi
    nah smaram vira yacchasi || || pranatakamadam padmajarcitam dharanimandanam dhyeyamapadi | caranapankajam
    shantamam ca te ramana nah staneshvarpayadhihan || || suratavardhanam shokanashanam svaritavenuna
    sushthu cumbitam | itararagavismaranam nrinam vitara vira naste'dharamritam || || atati yadbhavanahni
    kananam trutiryugayate tvamapashyatam | kutilakuntalam shrimukham ca te jada udikshatam pakshmakriddrisham
    || || patisutanvayabhratribandhava nativilanghya te'ntyacyutagatah | gatividastavodgitamohitah kitava
    yoshitah kastyajennishi || || rahasi samvidam hricchayodayam prahasitananam premavikshanam | brihadurah
    shriyo vikshya dhama te muhuratispriha muhyate manah || || vrajavanaukasam vyaktiranga te vrijinahantryalam
    vishvamangalam | tyaja manak ca nastvatsprihatmanam svajanahridrujam yannishudanam || || yatte sujatacaranamburuham
    stanesha bhitah shanaih priya dadhimahi karkasheshu | tenatavimatasi tadvyathate na kimsvit kurpadibhirbhramati
    dhirbhavadayusham nah || || iti shrimadbhagavata mahapurane paramahamsyam samhitayam dashamaskandhe
    purvardhe rasakridayam gopigitam namaikatrimsho'dhyayah ||
  devanagari: गोप्य ऊचुः । जयति तेऽधिकं जन्मना व्रजः श्रयत इन्दिरा शश्वदत्र हि । दयित दृश्यतां दिक्षु
    तावका स्त्वयि धृतासवस्त्वां विचिन्वते ॥ ॥ शरदुदाशये साधुजातस त्सरसिजोदरश्रीमुषा दृशा । सुरतनाथ तेऽशुल्कदासिका
    वरद निघ्नतो नेह किं वधः ॥ ॥ विषजलाप्ययाद्व्यालराक्षसा द्वर्षमारुताद्वैद्युतानलात् । वृषमयात्मजाद्विश्वतोभया
    दृषभ ते वयं रक्षिता मुहुः ॥ ॥ न खलु गोपिकानन्दनो भवा नखिलदेहिनामन्तरात्मदृक् । विखनसार्थितो विश्वगुप्तये
    सख उदेयिवान्सात्वतां कुले ॥ ॥ विरचिताभयं वृष्णिधुर्य ते चरणमीयुषां संसृतेर्भयात् । करसरोरुहं कान्त
    कामदं शिरसि धेहि नः श्रीकरग्रहम् ॥ ॥ व्रजजनार्तिहन्वीर योषितां निजजनस्मयध्वंसनस्मित । भज सखे भवत्किङ्करीः
    स्म नो जलरुहाननं चारु दर्शय ॥ ॥ प्रणतदेहिनां पापकर्शनं तृणचरानुगं श्रीनिकेतनम् । फणिफणार्पितं ते पदाम्बुजं
    कृणु कुचेषु नः कृन्धि हृच्छयम् ॥ ॥ मधुरया गिरा वल्गुवाक्यया बुधमनोज्ञया पुष्करेक्षण । विधिकरीरिमा
    वीर मुह्यती रधरसीधुनाऽऽप्याययस्व नः ॥ ॥ तव कथामृतं तप्तजीवनं कविभिरीडितं कल्मषापहम् । श्रवणमङ्गलं
    श्रीमदाततं भुवि गृणन्ति ते भूरिदा जनाः ॥ ॥ प्रहसितं प्रिय प्रेमवीक्षणं विहरणं च ते ध्यानमङ्गलम् ।
    रहसि संविदो या हृदिस्पृशः कुहक नो मनः क्षोभयन्ति हि ॥ ॥ चलसि यद्व्रजाच्चारयन्पशून् नलिनसुन्दरं नाथ
    ते पदम् । शिलतृणाङ्कुरैः सीदतीति नः कलिलतां मनः कान्त गच्छति ॥ ॥ दिनपरिक्षये नीलकुन्तलै र्वनरुहाननं
    बिभ्रदावृतम् । घनरजस्वलं दर्शयन्मुहु र्मनसि नः स्मरं वीर यच्छसि ॥ ॥ प्रणतकामदं पद्मजार्चितं धरणिमण्डनं
    ध्येयमापदि । चरणपङ्कजं शन्तमं च ते रमण नः स्तनेष्वर्पयाधिहन् ॥ ॥ सुरतवर्धनं शोकनाशनं स्वरितवेणुना
    सुष्ठु चुम्बितम् । इतररागविस्मारणं नृणां वितर वीर नस्तेऽधरामृतम् ॥ ॥ अटति यद्भवानह्नि काननं त्रुटिर्युगायते
    त्वामपश्यताम् । कुटिलकुन्तलं श्रीमुखं च ते जड उदीक्षतां पक्ष्मकृद्दृशाम् ॥ ॥ पतिसुतान्वयभ्रातृबान्धवा
    नतिविलङ्घ्य तेऽन्त्यच्युतागताः । गतिविदस्तवोद्गीतमोहिताः कितव योषितः कस्त्यजेन्निशि ॥ ॥ रहसि संविदं
    हृच्छयोदयं प्रहसिताननं प्रेमवीक्षणम् । बृहदुरः श्रियो वीक्ष्य धाम ते मुहुरतिस्पृहा मुह्यते मनः ॥ ॥
    व्रजवनौकसां व्यक्तिरङ्ग ते वृजिनहन्त्र्यलं विश्वमङ्गलम् । त्यज मनाक् च नस्त्वत्स्पृहात्मनां स्वजनहृद्रुजां
    यन्निषूदनम् ॥ ॥ यत्ते सुजातचरणाम्बुरुहं स्तनेष भीताः शनैः प्रिय दधीमहि कर्कशेषु । तेनाटवीमटसि तद्व्यथते
    न किंस्वित् कूर्पादिभिर्भ्रमति धीर्भवदायुषां नः ॥ ॥ इति श्रीमद्भागवत महापुराणे पारमहंस्यां संहितायां
    दशमस्कन्धे पूर्वार्धे रासक्रीडायां गोपीगीतं नामैकत्रिंशोऽध्यायः ॥
