id: gayatryupanishat
category: upanishad
name:
  english: gayatryupanishat
  devanagari: गायत्र्युपनिषत्
content:
  english: gayatryupanishat || gayatryupanishat | om bhumirantariksha dyaurityashtavaksharani | ashtakshara
    ha va eka gayatryai padametadu hasya etatsa yavadeteshu lokeshu tavaddha jayati | yo'sya etadeva pada
    veda rico yajushi samanityashtakshara ha va eka gayatryai padametadu hasya etatsa yavatiya trayi vidya
    tavaddha jayati | yo'sya etadeva pada veda prano'pano vyana ityashtavaksharanyashtakshara ha va eka
    gayatryai padametadu hasya etatsa yavadida praniti tavaddha jayati | yo'sya etadeva pada vedathasya
    etadeva turiya darshita pada parorajaya esha tapatiti yadvai caturtha tatturiya darshita padamiti
    dadarsha iva hyesha paroraja iti sarvamu hyesha raja uparyupari tapatyeva ha va esha shriya yashasa
    tapati | yo'sya etadeva pada veda saisha gayatri etasmisturiye darshite pade parorajasi pratishthita
    tadvai tatsatye pratishthita cakshurhi vai satya tasmadyadidanim dvau vivadamanaveyata ahamadrakshamahamashraushamiti
    | ya eva bruyadahamadrakshamiti tasya eva shraddhavya ya etadvai tat satya bale pratishthita tasmadahurbalasatyadau
    jneya eva vaisha gayatryadhyatma pratishthita sa haisha gayastate prana vai gayastan pranastate udyadgayastate
    tasmadgayatri nama sa yavemamumatva haishaivamasa yasma ityaha tasya pramana trayate ta haike savitri
  devanagari: गायत्र्युपनिषत् ॥ गायत्र्युपनिषत् । ॐ भूमिरन्तरिक्ष द्यौरित्यष्टावक्षराणि । अष्टाक्षर ह
    वा एक गायत्र्यै पदमेतदु हास्या एतत्स यावदेतेषु लोकेषु तावद्ध जयति । योऽस्या एतदेव पद वेद ऋचो यजूषि
    सामानीत्यष्टाक्षर ह वा एक गायत्र्यै पदमेतदु हास्या एतत्स यावतीय त्रयी विद्या तावद्ध जयति । योऽस्या
    एतदेव पद वेद प्राणोऽपानो व्यान इत्यष्टावक्षराण्यष्टाक्षर ह वा एक गायत्र्यै पदमेतदु हास्या एतत्स यावदिद
    प्राणिति तावद्ध जयति । योऽस्या एतदेव पद वेदाथास्या एतदेव तुरीय दर्शित पद परोरजाय एष तपतीति यद्वै चतुर्थ
    तत्तुरीय दर्शित पदमिति ददर्श इव ह्येष परोरजा इति सर्वमु ह्येष रज उपर्युपरि तपत्येव ह वा एष श्रिया
    यशसा तपति । योऽस्या एतदेव पद वेद सैषा गायत्री एतस्मिस्तुरीये दर्शिते पदे परोरजसि प्रतिष्ठिता तद्वै
    तत्सत्ये प्रतिष्ठित चक्षुर्हि वै सत्य तस्माद्यदिदानीं द्वौ विवदमानावेयाता अहमद्राक्षमहमश्रौषमिति ।
    य एव ब्रूयादहमद्राक्षमिति तस्या एव श्रद्धव्या य एतद्वै तत् सत्य बले प्रतिष्ठित तस्मादाहुर्बलसत्यादौ
    ज्ञेय एव वैषा गायत्र्यध्यात्म प्रतिष्ठिता सा हैषा गायस्तते प्राणा वै गायास्तान् प्राणास्तते उद्यद्गायस्तते
    तस्माद्गायत्री नाम स यावेमामूमत्वा हैषैवमास यस्मा इत्याह तस्य प्रमाण त्रायते ता हैके सावित्री
