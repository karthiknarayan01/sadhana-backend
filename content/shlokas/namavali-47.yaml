  devanagari: चित्तचक्षुर्मुखगतिजिह्वां स्तंभनं कुरु कुरु शीघ्रं वश्यं कुरु कुरु । ऐं ग्लौं ठः ठः ठः ठः
    हुं फट् स्वाहा । महावाराह्यं वा श्रीपादुकां पूजयामि नमः ॥ ॐ ऐं ग्लौं वाराह्यै नमः । ॐ ऐं ग्लौं वामन्यै
    नमः । ॐ ऐं ग्लौं वामायै नमः । ॐ ऐं ग्लौं बगळायै नमः । ॐ ऐं ग्लौं वासव्यै नमः । ॐ ऐं ग्लौं वसवे नमः
    । ॐ ऐं ग्लौं वैदेह्यै नमः । ॐ ऐं ग्लौं विरसुवे नमः । ॐ ऐं ग्लौं बालायै नमः । ॐ ऐं ग्लौं वरदायै नमः
    । १० ॐ ऐं ग्लौं विष्णुवल्लभायै नमः । ॐ ऐं ग्लौं वन्दितायै नमः । ॐ ऐं ग्लौं वसुधायै नमः । ॐ ऐं ग्लौं
    वश्यायै नमः । ॐ ऐं ग्लौं व्यात्तास्यायै नमः । ॐ ऐं ग्लौं वञ्चिन्यै नमः । ॐ ऐं ग्लौं बलायै नमः । ॐ
    ऐं ग्लौं वसुन्धरायै नमः । ॐ ऐं ग्लौं वीथिहोत्रायै नमः । ॐ ऐं ग्लौं वीथिराजायै नमः । २० ॐ ऐं ग्लौं
    विहायस्यै नमः । ॐ ऐं ग्लौं गर्वायै नमः । ॐ ऐं ग्लौं खनिप्रियायै नमः । ॐ ऐं ग्लौं काम्यायै नमः । ॐ
    ऐं ग्लौं कमलायै नमः । ॐ ऐं ग्लौं काञ्चन्यै नमः । ॐ ऐं ग्लौं रमायै नमः । ॐ ऐं ग्लौं धूम्रायै नमः ।
    ॐ ऐं ग्लौं कपालिन्यै नमः । ॐ ऐं ग्लौं वामायै नमः । ३० ॐ ऐं ग्लौं कुरुकुल्लायै नमः । ॐ ऐं ग्लौं कलावत्यै
    नमः । ॐ ऐं ग्लौं याम्यायै नमः । ॐ ऐं ग्लौं आग्नेय्यै नमः । ॐ ऐं ग्लौं धरायै नमः । ॐ ऐं ग्लौं धन्यायै
    नमः । ॐ ऐं ग्लौं दायिन्यै नमः । ॐ ऐं ग्लौं ध्यानिन्यै नमः । ॐ ऐं ग्लौं ध्रुवायै नमः । ॐ ऐं ग्लौं धृत्यै
    नमः । ४० ॐ ऐं ग्लौं लक्ष्म्यै नमः । ॐ ऐं ग्लौं जयायै नमः । ॐ ऐं ग्लौं तुष्ट्यै नमः । ॐ ऐं ग्लौं शक्त्यै
