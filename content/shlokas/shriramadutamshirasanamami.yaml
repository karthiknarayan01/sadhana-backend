id: shriramadutamshirasanamami
category: stotram
name:
  english: shriramadutamshirasanamami
  devanagari: श्रीरामदुतंशिरसानमामि
content:
  english: shriramadutam shirasa namami anjaneyamatipatalananam kancanadrikamaniyavigraham | parijatatarumulavasinam
    bhavayami pavamananandanam || 1|| yatra yatra raghunathakirtanam tatra tatra kritamastakanjalim |
    bashpavariparipurnalocanam marutim namata rakshasantakam || 2|| manojavam marutatulyavegam jitendriyam
    buddhimatam varishtham | vatatmajam vanarayuthamukhyam shriramadutam shirasa namami || 3||
  devanagari: श्रीरामदूतं शिरसा नमामि आञ्जनेयमतिपाटलाननं काञ्चनाद्रिकमनीयविग्रहम् । पारिजाततरुमूलवासिनं
    भावयामि पवमाननन्दनम् ॥ १॥ यत्र यत्र रघुनाथकीर्तनं तत्र तत्र कृतमस्तकाञ्जलिम् । बाष्पवारिपरिपूर्णलोचनं
    मारुतिं नमत राक्षसान्तकम् ॥ २॥ मनोजवं मारुततुल्यवेगं जितेन्द्रियं बुद्धिमतां वरिष्ठम् । वातात्मजं
    वानरयूथमुख्यं श्रीरामदुतं शिरसा नमामि ॥ ३॥
meaning: {}
