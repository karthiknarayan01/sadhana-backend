id: navagrahakara
category: stotram
name:
  english: navagrahakara
  devanagari: नवग्रहकरा
content:
  english: navagraha karavalambastotram jyotisha deva bhuvanatraya mulashakte gonatha bhasura suradibhiridyamana
    | nrinamshca virya vara dayaka adideva aditya vedya mama dehi karavalambam || 1|| nakshatranatha sumanohara
    shitalamsho shri bhargavi priya sahodara shvetamurte | kshirabdhijata rajanikara carushila shrimacchashamka
    mama dehi karavalambam || 2|| rudratmajata budhapujita raudramurte brahmanya mamgala dharatmaja buddhishalin
    | rogartihara rinamocaka buddhidayin shri bhumijata mama dehi karavalambam || 3|| somatmajata surasevita
    saumyamurte narayanapriya manohara divyakirte | dhipatavaprada supamdita carubhashin shri saumyadeva
    mama dehi karavalambam || 4|| vedantajnana shrutivacya vibhasitatman brahmadi vandita guro sura sevitamghre
    | yogisha brahma guna bhushita vishva yone vagisha deva mama dehi karavalambam || 5|| ulhasa dayaka
    kave bhriguvamshajata lakshmi sahodara kalatmaka bhagyadayin | kamadiragakara daityaguro sushila shri
    shukradeva mama dehi karavalambam || 6|| shuddhatma jnana parishobhita kalarupa chayasunandana yamagraja
    kruraceshta | kashtadyanishthakara dhivara mandagamin martamdajata mama dehi karavalambam || 7|| martamda
    purna shashi mardaka raudravesha sarpadhinatha surabhikara daityajanma | gomedhikabharana bhasita
    bhaktidayin shri rahudeva mama dehi karavalambam || 8|| aditya soma paripidaka citravarna he simhikatanaya
    vira bhujamga natha | mandasya mukhya sakha dhivara muktidayin shri ketu deva mama dehi karavalambam
    || 9|| martamda candra kuja saumya brihaspatinam shukrasya bhaskara sutasya ca rahu murteh | ketoshca
    yah pathati bhuri karavalamba stotram sa yatu sakalamshca manoratharan || 10|| || om shantih shantih
    shantih || || om tat sat ||
  devanagari: नवग्रह करावलम्बस्तोत्रम् ज्योतीश देव भुवनत्रय मूलशक्ते गोनाथ भासुर सुरादिभिरीद्यमान । नॄणांश्च
    वीर्य वर दायक आदिदेव आदित्य वेद्य मम देहि करावलम्बम् ॥ १॥ नक्षत्रनाथ सुमनोहर शीतलांशो श्री भार्गवी
    प्रिय सहोदर श्वेतमूर्ते । क्षीराब्धिजात रजनीकर चारुशील श्रीमच्छशांक मम देहि करावलम्बम् ॥ २॥ रुद्रात्मजात
    बुधपूजित रौद्रमूर्ते ब्रह्मण्य मंगल धरात्मज बुद्धिशालिन् । रोगार्तिहार ऋणमोचक बुद्धिदायिन् श्री भूमिजात
    मम देहि करावलम्बम् ॥ ३॥ सोमात्मजात सुरसेवित सौम्यमूर्ते नारायणप्रिय मनोहर दिव्यकीर्ते । धीपाटवप्रद
    सुपंडित चारुभाषिन् श्री सौम्यदेव मम देहि करावलम्बम् ॥ ४॥ वेदान्तज्ञान श्रुतिवाच्य विभासितात्मन् ब्रह्मादि
    वन्दित गुरो सुर सेवितांघ्रे । योगीश ब्रह्म गुण भूषित विश्व योने वागीश देव मम देहि करावलम्बम् ॥ ५॥
    उल्हास दायक कवे भृगुवंशजात लक्ष्मी सहोदर कलात्मक भाग्यदायिन् । कामादिरागकर दैत्यगुरो सुशील श्री शुक्रदेव
    मम देहि करावलम्बम् ॥ ६॥ शुद्धात्म ज्ञान परिशोभित कालरूप छायासुनन्दन यमाग्रज क्रूरचेष्ट । कष्टाद्यनिष्ठकर
    धीवर मन्दगामिन् मार्तंडजात मम देहि करावलम्बम् ॥ ७॥ मार्तंड पूर्ण शशि मर्दक रौद्रवेश सर्पाधिनाथ सुरभीकर
    दैत्यजन्म । गोमेधिकाभरण भासित भक्तिदायिन् श्री राहुदेव मम देहि करावलम्बम् ॥ ८॥ आदित्य सोम परिपीडक
    चित्रवर्ण हे सिंहिकातनय वीर भुजंग नाथ । मन्दस्य मुख्य सख धीवर मुक्तिदायिन् श्री केतु देव मम देहि करावलम्बम्
    ॥ ९॥ मार्तंड चन्द्र कुज सौम्य बृहस्पतीनाम् शुक्रस्य भास्कर सुतस्य च राहु मूर्तेः । केतोश्च यः पठति
    भूरि करावलम्ब स्तोत्रम् स यातु सकलांश्च मनोरथारान् ॥ १०॥ ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ ॥ ॐ तत् सत्
    ॥
