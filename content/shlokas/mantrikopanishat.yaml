id: mantrikopanishat
category: upanishad
name:
  english: mantrikopanishat
  devanagari: मान्त्रिकोपनिषत्
content:
  english: upanishad mantrikopanishat svavidyadvayatatkaryapahnavajnanabhasuram | mantrikopanishadvedyam
    ramacandramaham bhaje || om purnamadah purnamidam purnatpurnamudacyate | purnasya purnamadaya purnamevavashishyate
    || om shantih shantih shantih || om ashtapadam shucim hamsam trisutramanumavyayam | trivartmanam tejasoham
    sarvatahpashyanna pashyati || 1|| bhutasammohane kale bhinne tamasi vaikhare | antah pashyanti sattvastha
    nirgunam gunagahvare || 2|| ashakyah so'nyatha drashtum dhyayamanah kumarakaih | vikarajananimajnamashtarupamajam
    dhruvam || 3|| dhyayate'dhyasita tena tanyate preryate punah | suyate purushartham ca tenaivadhishthitam
    jagat || 4|| gauranadyantavati sa janitri bhutabhavini | sitasita ca rakta ca sarvakamadudha vibhoh
    || 5|| pibantyenamavishayamavijnatam kumarakah | ekastu pibate devah svacchando'tra vashanugah ||
    6|| dhyanakriyabhyam bhagavanbhunkte'sau prasahadvibhuh | sarvasadharanim dogdhrim piyamanam tu yajvamih
    || 7|| pashyantyasyam mahatmanah suvarnam pippalashanam | udasinam dhruvam hamsam snatakadhvaryavo
    jaguh || 8|| shamsantamanushamsanti bahvricah shastrakovidah | rathantaram brihatsama saptavaidhaistu
    giyate || 9|| mantropanishadam brahma padakramasamanvitam | pathanti bhargava hyete hyatharvano bhriguttamah
    || 10|| sabrahmacarivrittishca stambho'tha phalitastatha | anadvanrohitocchishtah pashyanto bahuvistaram
    || 11|| kalah pranashca bhagavanmrityuh sharvo maheshvarah | ugro bhavashca rudrashca sasurah sasurastatha
    || 12|| prajapatirvirat caiva purushah salilameva ca | stuyate mantrasamstutyairatharvaviditairvibhuh
    || 13|| tam shadvimshaka ityete saptavimsham tathapare | purusham nirgunam sankhyamatharvashiraso
    viduh || 14|| caturvimshatisamkhyatam vyaktamavyaktameva ca | advaitam dvaitamityahustridha tam pancadha
    tatha || 15|| brahmadyam sthavarantam ca pashyanti jnanacakshushah | tamekameva pashyanti parishubhram
    vibhum dvijah || 16|| yasminsarvamidam protam brahma sthavarajangamam | tasminneva layam yanti sravantyah
    sagare yatha || 17|| yasminbhavah praliyante linashcavyaktatam yayuh | pashyanti vyaktatam bhuyo jayante
    budbuda iva || 18|| kshetrajnadhishthitam caiva karanairvidyate punah | evam sa bhagavandevam pashyantyanye
    punah punah || 19|| brahma brahmetyathayanti ye vidurbrahmanastatha | atraiva te layam yanti linashcavyaktashalinah
    || linashcavyaktashalina ityupanishat || om purnamadah purnamidam purnatpurnamudacyate | purnasya
    purnamadaya purnamevavashishyate || om shantih shantih shantih || iti mantrikopanishatsamapta || adhikadhyayanaya
  devanagari: उपनिषद् मन्त्रिकोपनिषत् स्वाविद्याद्वयतत्कार्यापह्नवज्ञानभासुरम् । मन्त्रिकोपनिषद्वेद्यं
    रामचन्द्रमहं भजे ॥ ॐ पूर्णमदः पूर्णमिदं पूर्णात्पूर्णमुदच्यते । पूर्णस्य पूर्णमादाय पूर्णमेवावशिष्यते
    ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ ॐ अष्टपादं शुचिं हंसं त्रिसूत्रमणुमव्ययम् । त्रिवर्त्मानं तेजसोहं सर्वतःपश्यन्न
    पश्यति ॥ १॥ भूतसंमोहने काले भिन्ने तमसि वैखरे । अन्तः पश्यन्ति सत्त्वस्था निर्गुणं गुणगह्वरे ॥ २॥
    अशक्यः सोऽन्यथा द्रष्टुं ध्यायमानः कुमारकैः । विकारजननीमज्ञामष्टरूपामजां ध्रुवाम् ॥ ३॥ ध्यायतेऽध्यासिता
    तेन तन्यते प्रेर्यते पुनः । सूयते पुरुषार्थं च तेनैवाधिष्ठितं जगत् ॥ ४॥ गौरनाद्यन्तवती सा जनित्री
    भूतभाविनी । सितासिता च रक्ता च सर्वकामदुधा विभोः ॥ ५॥ पिबन्त्येनामविषयामविज्ञातां कुमारकाः । एकस्तु
    पिबते देवः स्वच्च्हन्दोऽत्र वशानुगः ॥ ६॥ ध्यानक्रियाभ्यां भगवान्भुङ्क्तेऽसौ प्रसहद्विभुः । सर्वसाधारणीं
    दोग्ध्रीं पीयमानां तु यज्वमिः ॥ ७॥ पश्यन्त्यस्यां महात्मानः सुवर्णं पिप्पलाशनम् । उदासीनं ध्रुवं हंसं
    स्नातकाध्वर्यवो जगुः ॥ ८॥ शंसन्तमनुशंसन्ति बह्वृचाः शास्त्रकोविदाः । रथन्तरं बृहत्साम सप्तवैधैस्तु
    गीयते ॥ ९॥ मन्त्रोपनिषदं ब्रह्म पदक्रमसमन्वितम् । पठन्ति भार्गवा ह्येते ह्यथर्वाणो भृगूत्तमाः ॥ १०॥
    सब्रह्मचारिवृत्तिश्च स्तम्भोऽथ फलितस्तथा । अनड्वान्रोहितोच्च्हिष्टः पश्यन्तो बहुविस्तरम् ॥ ११॥ कालः
    प्राणश्च भगवान्मृत्युः शर्वो महेश्वरः । उग्रो भवश्च रुद्रश्च ससुरः सासुरस्तथा ॥ १२॥ प्रजापतिर्विराट्
    चैव पुरुषः सलिलमेव च । स्तूयते मन्त्रसंस्तुत्यैरथर्वविदितैर्विभुः ॥ १३॥ तं षड्विंशक इत्येते सप्तविंशं
    तथापरे । पुरुषं निर्गुणं साङ्ख्यमथर्वशिरसो विदुः ॥ १४॥ चतुर्विंशतिसंख्यातं व्यक्तमव्यक्तमेव च । अद्वैतं
    द्वैतमित्याहुस्त्रिधा तं पञ्चधा तथा ॥ १५॥ ब्रह्माद्यं स्थावरान्तं च पश्यन्ति ज्ञानचक्षुषः । तमेकमेव
    पश्यन्ति परिशुभ्रं विभुं द्विजाः ॥ १६॥ यस्मिन्सर्वमिदं प्रोतं ब्रह्म स्थावरजङ्गमम् । तस्मिन्नेव लयं
    यान्ति स्रवन्त्यः सागरे यथा ॥ १७॥ यस्मिन्भावाः प्रलीयन्ते लीनाश्चाव्यक्ततां ययुः । पश्यन्ति व्यक्ततां
    भूयो जायन्ते बुद्बुदा इव ॥ १८॥ क्षेत्रज्ञाधिष्ठितं चैव कारणैर्विद्यते पुनः । एवं स भगवान्देवं पश्यन्त्यन्ये
    पुनः पुनः ॥ १९॥ ब्रह्म ब्रह्मेत्यथायान्ति ये विदुर्ब्राह्मणास्तथा । अत्रैव ते लयं यान्ति लीनाश्चाव्यक्तशालिनः
    ॥ लीनाश्चाव्यक्तशालिन इत्युपनिषत् ॥ ॐ पूर्णमदः पूर्णमिदं पूर्णात्पूर्णमुदच्यते । पूर्णस्य पूर्णमादाय
    पूर्णमेवावशिष्यते ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ इति मन्त्रिकोपनिषत्समाप्ता ॥ अधिकाध्ययनाय
