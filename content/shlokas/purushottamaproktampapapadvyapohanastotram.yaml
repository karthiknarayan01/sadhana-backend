id: purushottamaproktampapapadvyapohanastotram
category: stotram
name:
  english: purushottamaproktampapapadvyapohanastotram
  devanagari: पुरुषोत्तमप्रोक्तंपापापद्व्यपोहनस्तोत्रम्
content:
  english: rinkhala rashana karshni vyapohantvaghamapadah || 48|| gunaishvaryani sarvani camatkarashca
    siddhayah | shaktayah shrihareh sarva vyapohantvaghamapadah || 49|| shalagramastatha shalankayanarshishca
    gandaki | triveni shalavrikshashca vyapohantvaghamapadah || 50|| badari badarivasah rishayashca naro
    harih | ganga himashrayo haima vyapohantvaghamapadah || 51|| sheshashayi kshiranidhih kshiraja shvetabhogirat
    | nirannamuktabhaktashca vyapohantvaghamapadah || 52|| brahma vishnuh shankarashca ganeshashca prabhakarah
    | gana rudrashca rudranyo vyapohantvaghamapadah || 53|| siddha yakshashca gandharvashcandrastarashca
    taijasah | grahashca ketavashcapi vyapohantvaghamapadah || 54|| hamso garudo vrishabhah simhashca
    harino gajah | sheshah shikhi tivyavaha vyapohantvaghamapadah || 55|| kartikeyo mahakalo mahavajram
    trishulakam | kaladando hetayaste vyapohantvaghamapadah || 56|| aditya vasavo rudra ashvinavishvareshvarah
    | dikpala lokapalashca vyapohantvaghamapadah || 57|| gaganam sparshanam tejo rasashca prithivi tatha
    | tanmatrani tatha prana vyapohantvaghamapadah || 58|| sadhya vishve marutashca kinnara guhyakastatha
    | gandharva kimpurushaka vyapohantvaghamapadah || 59|| devanam matarashcapi gananam matarastatha |
    bhutanam matarah sarva vyapohantvaghamapadah || 60|| apsarasastatha devyo rashayastithayastatha |
    paksha masa vatsarashca vyapohantvaghamapadah || 61|| jvara rogashca ritavah rinani rakshasastatha
    | daityashca danava dushta vyapohantvaghamapadah || 62|| sagarah saritah kupastadagani ca dirghikah
    | vapyah saramsi varuno vyapohantvaghamapadah || 63|| gavo yah kamavarshinyah kalpapurashca vallikah
    | tatha ca kalpataravo vyapohantvaghamapadah || 64|| yajna yajnakriyashcapi vidhayah shrutayo'pi ca
    | ricah samani chandamsi vyapohantvaghamapadah || 659|| sahasrashirsha purushah sahasrakshah sahasrapat
    | sahasrabahuh sarvajno vyapohantvaghamapadah || 66|| pavakah pavano vahnih saptarcih saptajihvikah
    | svarnapita brahmamukham papapado vyapohatu || 67|| danam damo daya daivam deva devyashca sadhavah
    | santah satpurushah punya vyapohantvaghamapadah || 68|| vriddha vandya bhagavata bhaktashcaikantino
    hareh | daivajna devapurusha vyapohantvaghamapadah || 69|| vratani punyakarmani sukritani prasevanam
    | seva shraddha bhavana ca vyapohantvaghamapadah || 70|| yoga jnanani sarvani satyam vairagyamishita
    | upasana harerajna vyapohantvaghamapadah || 71|| grihadeva gramadevah kshetradevashca simagah | dvaradeva
    bahirdeva vyapohantvaghamapadah || 72|| vastudevah shraddhadeva makhadeva mahotsavah | tirthani devavasashca
    vyapohantvaghamapadah || 73|| devalaya mandirani mathah kathasthalani ca | muktikshetrani sarvani
    vyapohantvaghamapadah || 74|| matarah pitarah shreshtha bandhavashca satishriyah | bhakta bala balikashca
    vyapohantvaghamapadah || 75|| prayashcittani sarvani darbhashca devahetayah | havyakavyani daivani
    vyapohantvaghamapadah || 76|| devaratha devayana devamargashca devatah | ativahikadevashca vyapohantvaghamapadah
    || 77|| vidyutashca ghana megha bhukampa itayastatha | baliharashca ye deva vyapohantvaghamapadah
    || 78|| nidhayashca dishashcapi manavashca kalastatha | caturdashabhavanani vyapohantvaghamapadah
    || 79|| vyahritayah pranayama yamyashca dharmavamshajah | dharmadevashca tatpatnyo vyapohantvaghamapadah
    || 80|| kundamandapadevashca dhvajashakhanivasinah | samitpatradidevashca vyapohantvaghamapadah ||
    81|| sadguroshcaranau lakshmi caranamritavari ca | gurubhuktaprasadashca vyapohantvaghamapadah ||
    82|| satipatipadavari sadhucaranavari ca | vishnupadodakam punyam vyapohantvaghamapadah || 83|| satam
    samagamah seva''shrayashca''jnavacamsi ca | prasannata''shirvadashca vyapohantvaghamapadah || 84||
    matritirtham pitritirtham gurutirtham tathottamam | patitirtham satitirtham vyapohantvaghamapadah
    || 85|| gotirtham ca'vabhrithatirtham panktitirtham ca dakshinam | sanyasatirtham mantrashca vyapohantvaghamapadah
    || 86|| yajnopavitakam kanthi taulaseyi samarpanam | atmaniveditakhyam ca vyapohantvaghamapadah ||
    87|| yogitvam sadhuta naishthikata shrotriyata tatha | brahmasatta bhaktata ca pavayantu hi mam sada
    || 88|| pavani kunkumavapi pavanah shrinarayanah | pavanishrih pavayantu mam sada sharanagatam ||
    89|| dharmo vishnuh shrishca bhaktih seva mam pavayantviha | eshah samarpitashca'smi tam mam bhaktam
    punantviha || 90|| evam stuvan namedbhumau lakshmi pavanavrittiman | apadastasya nashyanti nivartante
    hyaghani ca || 91|| vyapohanastavam divyam yah pathecchrinuyadapi | patram pushpadyarpayeshca shuddho
    bhavati tatkshanat || 92|| kanyarthi labhate kanyam jayakamo jayam labhet | arthakamo labhedartham
    putrakamah sutan labhet || 93|| vidyarthi labhate vidyam bhogarthi bhogamapnuyat | sampadarthi sampadashca
    rajyarthi rajyamapnuyat || 94|| svargarthi svargamadadyanmoksharthi mokshamapnuyat | duhkhanashabhilashi
    ca duhkhanashamavapnuyat || 95|| patyarthini patim ramyam dhanarthini dhanam labhet | sukharthini
    sukham capi saubhagyam labhate tatha || 96|| yasho'rthini yashashcapi pradhanyam labhate tatha | yan
    yanarthayate kaman sarvanavapnuyat stavi || 97|| pathyamanamidam punyam yamuddishya tu pathyate |
    tasya roga na badhante vatapittadisambhavah || 98|| na'pamrityurbhavettasya na damshtravishasangamah
    | na'kaladuhkhava~shcapi bhavedvyapohanastavi || 99|| sarvatirthaprapunyani yajnapunyani yani ca |
    danavratanam punyani labhedvyapohanastavi || 100|| goghnah kritaghno viraha brahmaha balaha tatha
    | sharanagataha mitravishvasaghatako'pi ca || 101|| matriha pitriha nariha tatha pashughatakah | vyapohya
    sarvapapani shuddho bhavati samstavi || 102|| bhaktim kritva sarvapunyo yati mokshapradam tatah |
    agatikasya gatidam stotram vyapohanam tvidam || 103|| lakshmi stutva'nena mam tu namet praprarthayettatah
    | dhyatva brahmamayo bhutva mucyate bandhanaditah || 104|| etaduccarya bhavena stotavyam navashishyate
    | tasmadapatprade kale vyapohanam samuccaret || 105|| iti shrilakshminarayaniyasamhitayah dvaparayugasantanatmakasya
    tritiyakhande 167
  devanagari: ृङ्खला रशना कार्ष्णी व्यपोहन्त्वघमापदः ॥ ४८॥ गुणैश्वर्याणि सर्वाणि चमत्काराश्च सिद्धयः ।
    शक्तयः श्रीहरेः सर्वा व्यपोहन्त्वघमापदः ॥ ४९॥ शालग्रामस्तथा शालङ्कायनर्षिश्च गण्डकी । त्रिवेणी शालवृक्षश्च
    व्यपोहन्त्वघमापदः ॥ ५०॥ बदरी बदरीवासाः ऋषयश्च नरो हरिः । गङ्गा हिमाश्रयो हैमा व्यपोहन्त्वघमापदः ॥
    ५१॥ शेषशायी क्षीरनिधिः क्षीरजा श्वेतभोगिराट् । निरन्नमुक्तभक्ताश्च व्यपोहन्त्वघमापदः ॥ ५२॥ ब्रह्मा
    विष्णुः शङ्करश्च गणेशश्च प्रभाकरः । गणा रुद्राश्च रुद्राण्यो व्यपोहन्त्वघमापदः ॥ ५३॥ सिद्धा यक्षाश्च
    गन्धर्वाश्चन्द्रस्ताराश्च तैजसाः । ग्रहाश्च केतवश्चापि व्यपोहन्त्वघमापदः ॥ ५४॥ हंसो गरुडो वृषभः सिंहश्च
    हरिणो गजः । शेषः शिखी टिव्यवाहा व्यपोहन्त्वघमापदः ॥ ५५॥ कार्तिकेयो महाकालो महावज्रं त्रिशूलकम् । कालदण्डो
    हेतयस्ते व्यपोहन्त्वघमापदः ॥ ५६॥ आदित्या वसवो रुद्रा अश्विनावीश्वरेश्वराः । दिक्पाला लोकपालाश्च व्यपोहन्त्वघमापदः
    ॥ ५७॥ गगनं स्पर्शनं तेजो रसश्च पृथिवी तथा । तन्मात्राणि तथा प्राणा व्यपोहन्त्वघमापदः ॥ ५८॥ साध्या
    विश्वे मरुतश्च किन्नरा गुह्यकास्तथा । गन्धर्वा किम्पुरुषका व्यपोहन्त्वघमापदः ॥ ५९॥ देवानां मातरश्चापि
    गणानां मातरस्तथा । भूतानां मातरः सर्वा व्यपोहन्त्वघमापदः ॥ ६०॥ अप्सरसस्तथा देव्यो राशयस्तिथयस्तथा
    । पक्षा मासा वत्सराश्च व्यपोहन्त्वघमापदः ॥ ६१॥ ज्वरा रोगाश्च ऋतवः ऋणानि राक्षसास्तथा । दैत्याश्च दानवा
    दुष्टा व्यपोहन्त्वघमापदः ॥ ६२॥ सागराः सरितः कूपास्तडागानि च दीर्घिकाः । वाप्यः सरांसि वरुणो व्यपोहन्त्वघमापदः
    ॥ ६३॥ गावो याः कामवर्षिण्यः कल्पपूराश्च वल्लिकाः । तथा च कल्पतरवो व्यपोहन्त्वघमापदः ॥ ६४॥ यज्ञा यज्ञक्रियाश्चापि
    विधयः श्रुतयोऽपि च । ऋचः सामानि छन्दांसि व्यपोहन्त्वघमापदः ॥ ६५९॥ सहस्रशीर्षा पुरुषः सहस्राक्षः सहस्रपात्
    । सहस्रबाहुः सर्वज्ञो व्यपोहन्त्वघमापदः ॥ ६६॥ पावकः पावनो वह्निः सप्तार्चिः सप्तजिह्विकः । स्वर्णपिता
    ब्रह्ममुखं पापापदो व्यपोहतु ॥ ६७॥ दानं दमो दया दैवं देवा देव्यश्च साधवः । सन्तः सत्पुरुषाः पुण्या
    व्यपोहन्त्वघमापदः ॥ ६८॥ वृद्धा वन्द्या भागवता भक्ताश्चैकान्तिनो हरेः । दैवज्ञा देवपुरुषा व्यपोहन्त्वघमापदः
    ॥ ६९॥ व्रतानि पुण्यकर्माणि सुकृतानि प्रसेवनम् । सेवा श्रद्धा भावना च व्यपोहन्त्वघमापदः ॥ ७०॥ योगा
    ज्ञानानि सर्वाणि सत्यं वैराग्यमीशिता । उपासना हरेराज्ञा व्यपोहन्त्वघमापदः ॥ ७१॥ गृहदेवा ग्रामदेवाः
    क्षेत्रदेवाश्च सीमगाः । द्वारदेवा बहिर्देवा व्यपोहन्त्वघमापदः ॥ ७२॥ वास्तुदेवाः श्राद्धदेवा मखदेवा
    महोत्सवाः । तीर्थानि देववासाश्च व्यपोहन्त्वघमापदः ॥ ७३॥ देवालया मन्दिराणि मठाः कथास्थलानि च । मुक्तिक्षेत्राणि
    सर्वाणि व्यपोहन्त्वघमापदः ॥ ७४॥ मातरः पितरः श्रेष्ठा बान्धवाश्च सतीश्रियः । भक्ता बाला बालिकाश्च व्यपोहन्त्वघमापदः
    ॥ ७५॥ प्रायश्चित्तानि सर्वाणि दर्भाश्च देवहेतयः । हव्यकव्यानि दैवानि व्यपोहन्त्वघमापदः ॥ ७६॥ देवरथा
    देवयाना देवमार्गाश्च देवताः । आतिवाहिकदेवाश्च व्यपोहन्त्वघमापदः ॥ ७७॥ विद्युतश्च घना मेघा भूकम्पा
    ईतयस्तथा । बलिहाराश्च ये देवा व्यपोहन्त्वघमापदः ॥ ७८॥ निधयश्च दिशाश्चापि मनवश्च कलास्तथा । चतुर्दशभवनानि
    व्यपोहन्त्वघमापदः ॥ ७९॥ व्याहृतयः प्राणयमा याम्याश्च धर्मवंशजाः । धर्मदेवश्च तत्पत्न्यो व्यपोहन्त्वघमापदः
    ॥ ८०॥ कुण्डमण्डपदेवाश्च ध्वजशाखानिवासिनः । समित्पात्रादिदेवाश्च व्यपोहन्त्वघमापदः ॥ ८१॥ सद्गुरोश्चरणौ
    लक्ष्मि चरणामृतवारि च । गुरुभुक्तप्रसादश्च व्यपोहन्त्वघमापदः ॥ ८२॥ सतीपतिपादवारि साधुचरणवारि च । विष्णुपादोदकं
    पुण्यं व्यपोहन्त्वघमापदः ॥ ८३॥ सतां समागमः सेवाऽऽश्रयश्चाऽऽज्ञावचांसि च । प्रसन्नताऽऽशीर्वादाश्च व्यपोहन्त्वघमापदः
    ॥ ८४॥ मातृतीर्थं पितृतीर्थं गुरुतीर्थं तथोत्तमम् । पतितीर्थं सतीतीर्थं व्यपोहन्त्वघमापदः ॥ ८५॥ गोतीर्थं
    चाऽवभृथतीर्थं पङ्क्तितीर्थं च दक्षिणम् । सन्यासतीर्थं मन्त्रश्च व्यपोहन्त्वघमापदः ॥ ८६॥ यज्ञोपवीतकं
    कण्ठी तौलसेयी समर्पणम् । आत्मनिवेदिताख्यं च व्यपोहन्त्वघमापदः ॥ ८७॥ योगित्वं साधुता नैष्ठिकता श्रोत्रियता
    तथा । ब्रह्मसत्ता भक्तता च पावयन्तु हि मां सदा ॥ ८८॥ पावनी कुङ्कुमवापी पावनः श्रीनरायणः । पावनीश्रीः
    पावयन्तु मां सदा शरणागतम् ॥ ८९॥ धर्मो विष्णुः श्रीश्च भक्तिः सेवा मां पावयन्त्विह । एषः समर्पितश्चाऽस्मि
    तं मां भक्तं पुनन्त्विह ॥ ९०॥ एवं स्तुवन् नमेद्भूमौ लक्ष्मि पावनवृत्तिमान् । आपदस्तस्य नश्यन्ति निवर्तन्ते
    ह्यघानि च ॥ ९१॥ व्यपोहनस्तवं दिव्यं यः पठेच्छृणुयादपि । पत्रं पुष्पाद्यर्पयेश्च शुद्धो भवति तत्क्षणात्
    ॥ ९२॥ कन्यार्थी लभते कन्यां जयकामो जयं लभेत् । अर्थकामो लभेदर्थं पुत्रकामः सुतान् लभेत् ॥ ९३॥ विद्यार्थी
    लभते विद्यां भोगार्थी भोगमाप्नुयात् । सम्पदर्थी सम्पदश्च राज्यार्थी राज्यमाप्नुयात् ॥ ९४॥ स्वर्गार्थी
    स्वर्गमादद्यान्मोक्षार्थी मोक्षमाप्नुयात् । दुःखनाशाभिलाषी च दुःखनाशमवाप्नुयात् ॥ ९५॥ पत्यर्थिनी पतिं
    रम्यं धनार्थिनी धनं लभेत् । सुखार्थिनी सुखं चापि सौभाग्यं लभते तथा ॥ ९६॥ यशोऽर्थिनी यशश्चापि प्राधान्यं
    लभते तथा । यान् यानर्थयते कामान् सर्वानवाप्नुयात् स्तवी ॥ ९७॥ पठ्यमानमिदं पुण्यं यमुद्दिश्य तु पठ्यते
    । तस्य रोगा न बाधन्ते वातपित्तादिसम्भवाः ॥ ९८॥ नाऽपमृत्युर्भवेत्तस्य न दंष्ट्राविषसङ्गमः । नाऽकालदुःखवाँश्चापि
    भवेद्व्यपोहनस्तवी ॥ ९९॥ सर्वतीर्थप्रपुण्यानि यज्ञपुण्यानि यानि च । दानव्रतानां पुण्यानि लभेद्व्यपोहनस्तवी
    ॥ १००॥ गोघ्नः कृतघ्नो वीरहा ब्रह्महा बालहा तथा । शरणागतहा मित्रविश्वासघातकोऽपि च ॥ १०१॥ मातृहा पितृहा
    नारीहा तथा पशुघातकः । व्यपोह्य सर्वपापानि शुद्धो भवति संस्तवी ॥ १०२॥ भक्तिं कृत्वा सर्वपुण्यो याति
    मोक्षप्रदं ततः । अगतिकस्य गतिदं स्तोत्रं व्यपोहनं त्विदम् ॥ १०३॥ लक्ष्मि स्तुत्वाऽनेन मां तु नमेत्
    प्रप्रार्थयेत्ततः । ध्यात्वा ब्रह्ममयो भूत्वा मुच्यते बन्धनादितः ॥ १०४॥ एतदुच्चार्य भावेन स्तोतव्यं
    नावशिष्यते । तस्मादापत्प्रदे काले व्यपोहनं समुच्चरेत् ॥ १०५॥ इति श्रीलक्ष्मीनारायणीयसंहितायाः द्वापरयुगसन्तानात्मकस्य
    तृतीयखण्डे १६७
