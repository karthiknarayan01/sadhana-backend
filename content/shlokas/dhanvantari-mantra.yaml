id: dhanvantari-mantra
category: stotram
name:
  english: Dhanvantari Mantra
content:
  english: dhyanam acyutananta govinda vishno narayana'mrita roganme nashaya'sheshanashu dhanvantare hare
    | arogyam dirghamayushyam balam tejo dhiyam shriyam svabhaktebhyo'nugrihnantam vande dhanvantarim
    harim || shankham cakram jalaukam dadhadamritaghatam carudorbhishcaturbhih | sukshmasvacchatihridyamshuka
    parivilasanmaulimambhojanetram | kalambhodojjvalangam katitatavilasaccarupitambaradhyam | vande dhanvantarim
    tam nikhilagadavanapraudhadavagnililam || dhanvantarerimam shlokam bhaktya nityam pathanti ye | anarogyam
    na tesham syat sukham jivanti te ciram || mantram om namo bhagavate vasudevaya dhanvantaraye amritakalashahastaya
    sarvamayavinashanaya trailokyanathaya shrimahavishnave svaha | om namo bhagavate mahasudarshanaya
    vasudevaya dhanvantaraye amritakalashahastaya sarvabhayavinashaya sarvaroganivaranaya trailokyapataye
    trailokyanidhaye shrimahavishnusvarupa shridhanvantarisvarupa shri shri shri aushadhacakra narayanaya
    svaha | gayatri mantram om vasudevaya vidmahe sudhahastaya dhimahi | tanno dhanvantarih pracodayat
    | tarakamantram om dham dhanvantaraye namah |
  devanagari: ध्यानं अच्युतानन्त गोविन्द विष्णो नारायणाऽमृत रोगान्मे नाशयाऽशेषानाशु धन्वन्तरे हरे । आरोग्यं
    दीर्घमायुष्यं बलं तेजो धियं श्रियं स्वभक्तेभ्योऽनुगृह्णन्तं वन्दे धन्वन्तरिं हरिम् ॥ शङ्खं चक्रं जलौकां
    दधदमृतघटं चारुदोर्भिश्चतुर्भिः । सूक्ष्मस्वच्छातिहृद्यांशुक परिविलसन्मौलिमम्भोजनेत्रम् । कालाम्भोदोज्ज्वलाङ्गं
    कटितटविलसच्चारुपीताम्बराढ्यम् । वन्दे धन्वन्तरिं तं निखिलगदवनप्रौढदावाग्निलीलम् ॥ धन्वन्तरेरिमं श्लोकं
    भक्त्या नित्यं पठन्ति ये । अनारोग्यं न तेषां स्यात् सुखं जीवन्ति ते चिरम् ॥ मन्त्रं ॐ नमो भगवते वासुदेवाय
    धन्वन्तरये अमृतकलशहस्ताय सर्वामयविनाशनाय त्रैलोक्यनाथाय श्रीमहाविष्णवे स्वाहा । ॐ नमो भगवते महासुदर्शनाय
    वासुदेवाय धन्वन्तरये अमृतकलशहस्ताय सर्वभयविनाशाय सर्वरोगनिवारणाय त्रैलोक्यपतये त्रैलोक्यनिधये श्रीमहाविष्णुस्वरूप
    श्रीधन्वन्तरीस्वरूप श्री श्री श्री औषधचक्र नारायणाय स्वाहा । गायत्री मन्त्रम् ॐ वासुदेवाय विद्महे
    सुधाहस्ताय धीमहि । तन्नो धन्वन्तरिः प्रचोदयात् । तारकमन्त्रम् ॐ धं धन्वन्तरये नमः ।
