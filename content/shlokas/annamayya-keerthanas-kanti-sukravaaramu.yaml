id: annamayya-keerthanas-kanti-sukravaaramu
category: stotram
name:
  english: Annamayya Keerthanas Kanti Sukravaaramu
content:
  english: pallavi kanti shukravaramu gadiya ledinta | anti alamelmanga andanunde svamini || sòmmulanni
    kadapètti sòmputo gonamugatti | kammani kadambamu kappu panniru | cèmmatonu veshtuvalu ròmmutala mòlajutti
    | tummèda maicayatona nèmmadinunde svamini || kanti shukravaramu gadiya ledinta paccakappurame nuripasidi
    ginnèlaninci | tècci shirasadiga diganaladi | accèrapadi cudanandari kanulakimpai | niccamallè puvuvalè
    nitutanunde svamini || kanti shukravaramu gadiya ledinta tattupunuge kuricicattalu cericinippu | patti
    karigincu vèndi palyalaninci | dattamuga menu nindapattinci diddi | bittu veduka muriyu cundebittari
    svamini || kanti shukravaramu gadiya ledinta anti alamelmanga andanunde svamini ||
  devanagari: पल्लवि कण्टि शुक्रवारमु गडिय लेडिण्ट । अण्टि अलमेल्मङ्ग अण्डनुण्डे स्वामिनि ॥ सॊम्मुलन्नी
    कडपॆट्टि सॊम्पुतो गोणमुगट्टि । कम्मनि कदम्बमु कप्पु पन्नीरु । चॆम्मतोनु वेष्टुवलु रॊम्मुतल मॊलजुट्टि
    । तुम्मॆद मैचायतोन नॆम्मदिनुण्डे स्वामिनि ॥ कण्टि शुक्रवारमु गडिय लेडिण्ट पच्चकप्पुरमे नूरिपसिडि गिन्नॆलनिञ्चि
    । तॆच्चि शिरसादिग दिगनलदि । अच्चॆरपडि चूडनन्दरि कनुलकिम्पै । निच्चमल्लॆ पूवुवलॆ निटुतानुण्डे स्वामिनि
    ॥ कण्टि शुक्रवारमु गडिय लेडिण्ट तट्टुपुनुगे कूरिचिचट्टलु चेरिचिनिप्पु । पट्टि करिगिञ्चु वॆण्डि पल्यालनिञ्चि
    । दट्टमुग मेनु निण्डपट्टिञ्चि दिद्दि । बिट्टु वेडुक मुरियु चुण्डेबित्तरि स्वामिनि ॥ कण्टि शुक्रवारमु
    गडिय लेडिण्ट अण्टि अलमेल्मङ्ग अण्डनुण्डे स्वामिनि ॥
