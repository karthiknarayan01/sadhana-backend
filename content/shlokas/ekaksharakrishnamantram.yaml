id: ekaksharakrishnamantram
category: mantra
name:
  english: ekaksharakrishnamantram
  devanagari: एकाक्षरकृष्णमन्त्रम्
content:
  english: ekaksharakrishnamantram om purnajnanatmane hridayaya namah | om punaishvaryatmane shirase svaha
    | om purnaparamatmane shikhayai vashat | om purnanandatmane kavacaya hum | om purnatejatmane netrabhyam
    vaushat | om purnashaktyatmane astraya phat | iti digbandhah || ekakshara shrikrishnamahamantrasya
  devanagari: एकाक्षरकृष्णमन्त्रम् ॐ पूर्णज्ञानात्मने हृदयाय नमः । ॐ पूणैश्वर्यात्मने शिरसे स्वाहा । ॐ
    पूर्णपरमात्मने शिखायै वषट् । ॐ पूर्णानन्दात्मने कवचाय हुं । ॐ पूर्णतेजात्मने नेत्राभ्यां वौषट् । ॐ
    पूर्णशक्त्यात्मने अस्त्राय फट् । इति दिग्बन्धः ॥ एकाक्षर श्रीकृष्णमहामन्त्रस्य
meaning: {}
