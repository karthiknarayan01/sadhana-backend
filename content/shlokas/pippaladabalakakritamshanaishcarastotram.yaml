id: pippaladabalakakritamshanaishcarastotram
category: stotram
name:
  english: pippaladabalakakritamshanaishcarastotram
  devanagari: पिप्पलादबालककृतंशनैश्चरस्तोत्रम्
content:
  english: pippaladabalakakritam shanaishcarastotram tatah kritanjalirbhutva stutim cakre sa balakah |
    bhayena mahata yuktastatah sampricchya tam munim || 76|| pippalado dvijashreshthah pranipatya muhurmuhuh
    | namaste krodhasamsthaya pingalaya namo'stu te || 77|| namaste vasurupaya krishnaya ca namo'stu te
    | namaste raudradehaya namaste cantakaya ca || 78|| namaste yamasamjnaya namaste sauraye vibho | namaste
    mandasamjnaya shanaishcara namo'stu te || 79|| prasadam kuru devesha dinasya pranatasya ca || 8||
    iti shriskandapurane nagarakhande catissaptaticamadhikashatatama
  devanagari: पिप्पलादबालककृतं शनैश्चरस्तोत्रम् ततः कृताञ्जलिर्भूत्वा स्तुतिं चक्रे स बालकः । भयेन महता
    युक्तस्ततः सम्पृच्छ्य तं मुनिम् ॥ ७६॥ पिप्पलादो द्विजश्रेष्ठाः प्रणिपत्य मुहुर्मुहुः । नमस्ते क्रोधसंस्थाय
    पिङ्गलाय नमोऽस्तु ते ॥ ७७॥ नमस्ते वसुरूपाय कृष्णाय च नमोऽस्तु ते । नमस्ते रौद्रदेहाय नमस्ते चान्तकाय
    च ॥ ७८॥ नमस्ते यमसंज्ञाय नमस्ते सौरये विभो । नमस्ते मन्दसंज्ञाय शनैश्चर नमोऽस्तु ते ॥ ७९॥ प्रसादं
    कुरु देवेश दीनस्य प्रणतस्य च ॥ ८॥ इति श्रीस्कन्दपुराणे नागरखण्डे चतिस्सप्ततिचमाधिकशततमा
meaning: {}
