id: svastivacanam
category: veda
name:
  english: svastivacanam
  devanagari: स्वस्तिवाचनम्
content:
  english: m || nisvarah om shri ganeshaya namah || a no bhadrah kratavo yantu vishvato'dabdhaso aparitasa
    udbhidah | deva no yatha sadamid vridhe asannaprayuvo rakshitaro divedive || devanam bhadra sumatirrijuyatam
    devanam ratirabhi no ni vartatam | devanam sakhyamupa sedima vayam deva na ayuh pratirantu jivase
    || tanpurvaya nivida humahe vayam bhagam mitramaditim dakshamasridham | aryamanam varunam somamashvina
    sarasvati nah subhaga mayaskarat || tanno vato mayobhuvatu bheshajam tanmata prithivi tatpita dyauh
    | tad gravanah somasuto mayobhuvastadashvina sha
  devanagari: म् ॥ निस्वरः ॐ श्री गणेशाय नमः ॥ आ नो भद्राः क्रतवो यन्तु विश्वतोऽदब्धासो अपरीतास उद्भिदः
    । देवा नो यथा सदमिद् वृधे असन्नप्रायुवो रक्षितारो दिवेदिवे ॥ देवानां भद्रा सुमतिरृजूयतां देवानां रातिरभि
    नो नि वर्तताम् । देवानां सख्यमुप सेदिमा वयं देवा न आयुः प्रतिरन्तु जीवसे ॥ तान्पूर्वया निविदा हूमहे
    वयं भगं मित्रमदितिं दक्षमस्रिधम् । अर्यमणं वरुणं सोममश्विना सरस्वती नः सुभगा मयस्करत् ॥ तन्नो वातो
    मयोभुवातु भेषजं तन्माता पृथिवी तत्पिता द्यौः । तद् ग्रावाणः सोमसुतो मयोभुवस्तदश्विना श
