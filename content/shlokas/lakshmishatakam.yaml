id: lakshmishatakam
category: shataka
name:
  english: lakshmishatakam
  devanagari: लक्ष्मीशतकम्
content:
  english: lakshmishatakam anandam dishatu shrihastigirau svastida sada mahyam | ya kautukam vidhatte
    sakritenavalokanena hareh || 1|| yannama kirtaniyam shrirityadau priyam harernamnam | sa me samastajanani
    santatamudayaya bhuyase bhuyat || 2|| shrivaradeshvaradayite vanchami tvam yathamati stotum | svalpo'pi
    dimbhajalpo matuh pritim katham na sanjanayet || 3|| muraripumohanadhamne murtivinirdhutavishphuraddhemne
    | divishadameyavibhumne lakshminamne param namo bhumne || 4|| karigirinayakakante dantajanasvantapankajanishante
    | mayi bhavamaranashrante karunam sharanagate kuru pragunam || 5|| vacamakritrimanamapi munimanasamagocare
    devi
  devanagari: लक्ष्मीशतकम् आनन्दं दिशतु श्रीहस्तिगिरौ स्वस्तिदा सदा मह्यम् । या कौतुकं विधत्ते साकृतेनावलोकनेन
    हरेः ॥ १॥ यन्नाम कीर्तनीयं श्रीरित्यादौ प्रियं हरेर्नाम्नाम् । सा मे समस्तजननी सन्ततमुदयाय भूयसे भूयात्
    ॥ २॥ श्रीवरदेश्वरदयिते वाञ्छामि त्वां यथामति स्तोतुम् । स्वल्पोऽपि डिम्भजल्पो मातुः प्रीतिं कथं न
    सञ्जनयेत् ॥ ३॥ मुररिपुमोहनधाम्ने मूर्तिविनिर्धूतविष्फुरद्धेम्ने । दिविषदमेयविभूम्ने लक्ष्मीनाम्ने
    परं नमो भुम्ने ॥ ४॥ करिगिरिनायककान्ते दान्तजनस्वान्तपङ्कजनिशान्ते । मयि भवमरणाश्रान्ते करुणां शरणागते
    कुरु प्रगुणाम् ॥ ५॥ वाचामकृत्रिमाणामपि मुनिमनसामगोचरे देवि
