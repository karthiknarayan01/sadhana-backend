id: sri-srisaila-mallikarjuna-suprabhatam
category: stotram
name:
  english: SrI Srisaila Mallikarjuna Suprabhatam
content:
  english: pratassmarami gananathamanathabandhum sindurapuraparishobhitagandayugmam | uddandavighnaparikhandanacandadanda
    makhandaladisuranayakavrindavandyam || || kalabhyam cudalankritashashikalabhyam nijatapah phalabhyam
    bhakteshu prakatitaphalabhyam bhavatu me | shivabhyamastikatribhuvanashivabhyam hridi puna rbhavabhyamanandasphuradanubhavabhyam
    natiriyam || || namaste namaste mahadeva namaste namaste dayapurnasindho namaste namaste prapannatmabandho
    namaste namaste namaste mahesha || || shashvacchrigirimurdhani trijagatam rakshakritau lakshitam sakshadakshatasatkatakshasaranishrimatsudhavarshinim
    | somardhankitamastakam pranamatam nissimasampatpradam sushlokam bhramarambikam smitamukhim shambhossakhim
    tvam stumah || lilalavakulitadaityakulapahare shrimallikarjuna vibho shrimallikarjuna vibho durnitidaityadalanodyata
    shrimallikarjuna vibho gandharvayakshasurakinnaragitakirte gandavalambiphanikundalamanditasya shrimallikarjuna
    vibho nagabhedin | narayanipriya || srishtam tvayaiva jagadetadasheshamisha rakshavidhishca vidhigocara
    tavakinah | samharashaktirapi shankara kinkari te shrishailashekhara vibho || ekastvameva bahudha
    bhava bhasi loke nishshankadhirvrishabhaketana || patalagangajalamajjananirmalangah bhasmatripundrasamalankritaphalabhagah
    | gayanti devamunibhaktajana bhavantam shrimallikarjuna vibho || sarasvatambuyutabhogavatishritayah
    brahmeshavishnugiricumbitakrishnavenyah | sopanamargamadhiruhya bhajanti bhaktah shrimallikarjuna
    vibho || shrimallikarjunamaheshvarasuprabhata stotram pathanti bhuvi ye manujah prabhate | te sarva
    saukhyamanubhuya paranavapyam shrishambhavam padamavapya mudam labhante || || iti shrimallikarjunasuprabhatam
    sampurnam |
  devanagari: प्रातस्स्मरामि गणनाथमनाथबन्धुं सिन्दूरपूरपरिशोभितगण्डयुग्मम् । उद्दण्डविघ्नपरिखण्डनचण्डदण्ड
    माखण्डलादिसुरनायकवृन्दवन्द्यम् ॥ ॥ कलाभ्यां चूडालङ्कृतशशिकलाभ्यां निजतपः फलाभ्यां भक्तेषु प्रकटितफलाभ्यां
    भवतु मे । शिवाभ्यामास्तीकत्रिभुवनशिवाभ्यां हृदि पुन र्भवाभ्यामानन्दस्फुरदनुभवाभ्यां नतिरियम् ॥ ॥ नमस्ते
    नमस्ते महादेव नमस्ते नमस्ते दयापूर्णसिन्धो नमस्ते नमस्ते प्रपन्नात्मबन्धो नमस्ते नमस्ते नमस्ते महेश
    ॥ ॥ शश्वच्छ्रीगिरिमूर्धनि त्रिजगतां रक्षाकृतौ लक्षितां साक्षादक्षतसत्कटाक्षसरणिश्रीमत्सुधावर्षिणीम्
    । सोमार्धाङ्कितमस्तकां प्रणमतां निस्सीमसम्पत्प्रदां सुश्लोकां भ्रमराम्बिकां स्मितमुखीं शम्भोस्सखीं
    त्वां स्तुमः ॥ लीलालवाकुलितदैत्यकुलापहारे श्रीमल्लिकार्जुन विभो श्रीमल्लिकार्जुन विभो दुर्नीतिदैत्यदलनोद्यत
    श्रीमल्लिकार्जुन विभो गन्धर्वयक्षसुरकिन्नरगीतकीर्ते गण्डावलम्बिफणिकुण्डलमण्डितास्य श्रीमल्लिकार्जुन
    विभो नागभेदिन् । नारायणीप्रिय ॥ सृष्टं त्वयैव जगदेतदशेषमीश रक्षाविधिश्च विधिगोचर तावकीनः । संहारशक्तिरपि
    शङ्कर किङ्करी ते श्रीशैलशेखर विभो ॥ एकस्त्वमेव बहुधा भव भासि लोके निश्शङ्कधीर्वृषभकेतन ॥ पातालगाङ्गजलमज्जननिर्मलाङ्गाः
    भस्मत्रिपुण्ड्रसमलङ्कृतफालभागाः । गायन्ति देवमुनिभक्तजना भवन्तं श्रीमल्लिकार्जुन विभो ॥ सारस्वताम्बुयुतभोगवतीश्रितायाः
    ब्रह्मेशविष्णुगिरिचुम्बितकृष्णवेण्याः । सोपानमार्गमधिरुह्य भजन्ति भक्ताः श्रीमल्लिकार्जुन विभो ॥ श्रीमल्लिकार्जुनमहेश्वरसुप्रभात
    स्तोत्रं पठन्ति भुवि ये मनुजाः प्रभाते । ते सर्व सौख्यमनुभूय परानवाप्यं श्रीशाम्भवं पदमवाप्य मुदं
    लभन्ते ॥ ॥ इति श्रीमल्लिकार्जुनसुप्रभातं सम्पूर्णम् ।
