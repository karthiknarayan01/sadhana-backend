id: rishibhihkritam1vishnustotram
category: stotram
name:
  english: rishibhihkritam1vishnustotram
  devanagari: ऋषिभिःकृतं१विष्णुस्तोत्रम्
content:
  english: rishibhih kritam 1 vishnustotram rishaya ucuh | yo veda sarvam bhuvanam bhavishyadyajjayamanam
    ca guhanivishtam | lokatrayam citravicitrarupamante samaste ca yamavivesha || 24|| yadaksharam shashvatamaprameyam
    yam vedavedyamrishayo vadanti | yamashritah svepsitamapnuvanti tadvastu satyam sharanam vrajamah ||
    25|| bhutam mahabhutajagatpradhanam na vindate yogino vishnurupam | tadvaktumete rishayo'tra yatah
    satyam vadasveha jagannivasa || 26|| tvamantaratma'khiladehabhajam tvameva sarvam tvayi sarvamisha
    | tatha'pi jananti na ke'pi kutrapyaho bhavantam prakritiprabhavat | antarbahih sarvata eva santam
    vishvatmana samparivartamanam || 27|| iti brahmapurane shadvimshadhikashatatamadhyayantargatam rishibhih
    kritam vishnustotram samaptam | brahmapurana | adhyaya 126
  devanagari: ऋषिभिः कृतं १ विष्णुस्तोत्रम् ऋषय ऊचुः । यो वेद सर्वं भुवनं भविष्यद्यज्जायमानं च गुहानिविष्टम्
    । लोकत्रयं चित्रविचित्ररूपमन्ते समस्ते च यमाविवेश ॥ २४॥ यदक्षरं शाश्वतमप्रमेयं यं वेदवेद्यमृषयो वदन्ति
    । यमाश्रिताः स्वेप्सितमाप्नुवन्ति तद्वस्तु सत्यं शरणं व्रजामः ॥ २५॥ भूतं महाभूतजगत्प्रधानं न विन्दते
    योगिनो विष्णुरूपम् । तद्वक्तुमेते ऋषयोऽत्र याताः सत्यं वदस्वेह जगन्निवास ॥ २६॥ त्वमन्तरात्माऽखिलदेहभाजां
    त्वमेव सर्वं त्वयि सर्वमीश । तथाऽपि जानन्ति न केऽपि कुत्राप्यहो भवन्तं प्रकृतिप्रभावात् । अन्तर्बहिः
    सर्वत एव सन्तं विश्वात्मना सम्परिवर्तमानम् ॥ २७॥ इति ब्रह्मपुराणे षड्विंशाधिकशततमाध्यायान्तर्गतं ऋषिभिः
    कृतं विष्णुस्तोत्रं समाप्तम् । ब्रह्मपुराण । अध्याय १२६
