id: mahadevakritam1vishnustotram
category: stotram
name:
  english: mahadevakritam1vishnustotram
  devanagari: महादेवकृतं१विष्णुस्तोत्रम्
content:
  english: 60|| kotayashcaturasyasya palarddham mama catula | yadapangavilasottham tasmai kalatmane namah
    || 61|| ekaikaromakalitabrahmandaganasamvritam | manatitam vapuryasya tasmai vishvatmane namah ||
    62|| svakalaparimanena vedhasah pralayodbhavau | manvantaradighatanakalanaya namo'stu te || 63|| srishto'ham
    tamasa natha tvatprabhavanabhijnakah | tatkshamasvaparadham me trahi mam sharanagatam || 64|| iti
    shriskandapurane vaishnavakhande purushottamajagannathamahatmye dvadashadhyayantargatam mahadevakritam
    vishnustotram samaptam | skandapurana | vaishnavakhanda | purushottamakhanda | adhyaya 12
  devanagari: ६०॥ कोटयश्चतुरास्यस्य पलार्द्धं मम चातुल । यदपाङ्गविलासोत्थं तस्मै कालात्मने नमः ॥ ६१॥ एकैकरोमाकलितब्रह्माण्डगणसंवृतम्
    । मानातीतं वपुर्यस्य तस्मै विश्वात्मने नमः ॥ ६२॥ स्वकालपरिमाणेन वेधसः प्रलयोद्भवौ । मन्वन्तरादिघटनाकलनाय
    नमोऽस्तु ते ॥ ६३॥ सृष्टोऽहं तमसा नाथ त्वत्प्रभावानभिज्ञकः । तत्क्षमस्वापराधं मे त्राहि मां शरणागतम्
    ॥ ६४॥ इति श्रीस्कन्दपुराणे वैष्णवखण्डे पुरुषोत्तमजगन्नाथमाहात्म्ये द्वादशाध्यायान्तर्गतं महादेवकृतं
    विष्णुस्तोत्रं समाप्तम् । स्कन्दपुराण । वैष्णवखण्ड । पुरुषोत्तमखण्ड । अध्याय १२
meaning: {}
