id: nitya-sandhya-vandanam-krishna-yajurvediya
category: stotram
name:
  english: Nitya Sandhya Vandanam (Krishna Yajurvediya)
content:
  english: sharira shuddhi apavitrah pavitro va sarvavastha tpundarikaksham sa bahyabhyantara shshucih
    || pundarikaksha pundarikakshaya namah | acamanah om acamya o ntrivikramaya namah om om shridharaya
    namah om hrishikeshaya namah mpurushottamaya namah om adhokshajaya namah o netre shrotre ca sprishtva
    hastam shirasi nikshipya om haraye namah om shrikrishnaya namah om shrikrishna parabrahmane namo namah
    etanyuccarya upyakta prakara nkrite angani shuddhani bhaveyuh bhutoccatana uttishthantu | bhuta pishacah
    | ye te bhumibharakah | ye teshamavirodhena | brahmakarma samarabhe | o mbhurbhuvassuvah | daivi gayatri
    candah pranayame viniyogah ngayatri mantramuccharet mbhuvah | ogm suvah | o ntapah | ogm satyam |
    o nyam bhargo devasya dhimahi | dhiyo yo nah pracodaya t || omapo jyoti raso samasta durita kshayadvara
    shri parameshvara muddisya shri parameshvara prityartham shri mahavishno rajnaya samasta devata brahmana
    harihara gurucarana sannithau sayam sandhyam upasishe | marjanah om apohishtha mayobhuvah | ta na
    urje dadhatana | maheranaya cakshase | yo vah shivatamo rasah | tasya bhajayate ha nah | ushatiriva
    matarah | tasma aranga mama vah | yasya kshayaya jinvatha | apo janayatha ca nah | pratah kala mantracamanah
    manyukritebhyah | papebhyo rakshantam | yadratrya papa makar sham | manasa vaca hastabhyam | padbhya
    mudarena shinca | ratri stadavalumpatu | yatkinca durita mma mamrita yo nau | surye jyotishi juhomi
    svaha madhyahna kala mantracamanah apah punantu prithivi mprithivi puta punatu mam | punantu brahmanaspati
    rbrahma puta punatu mam | yaducchishta mabho jyam yadva dushcarita 'satanca pratigrahagg svaha sayankala
    mantracamanah agni shca ma manyu shca manyupataya shca manyukritebhyah | papebhyo rakshantam | yadahna
    papa makar sham | manasa vaca hastabhyam | padbhya mudarena shinca | aha stadavalumpatu | ya tkinca
    durita mma mamrita yonau | satye jyotishi juhomi svaha || shri krishna parabrahmane namo namah dvitiya
    marjanah dadhi krav nno akarisham | jishno rashvasya vajinah | surabhino mukhakaratprana ayugmshi
    tarishat || suryapakshe lokayatra nirvahaka ityarthah om apo hishtha mayobhuvah | ta na urje dadhatana
    | maheranaya cakshase | yo vah shivatamo rasah | tasya bhajayate ha nah | ushatiriva matarah | tasma
    aranga mama vah | yasya kshayaya jinvatha | apo janayatha ca nah || punah marjanah hiranyavarna shshucayah
    pavakah ya sujatah kashyapo ya svindrah | agnim ya~ garbhandadhire virupa stana apashshagg syona bhavantu
    | ya sagm raja varuno yati madhye satyanrite avapashya njananam | madhu shcutashshucayo yah pavaka
    stana apashshagg syona bhavantu | yasa ndeva divi krinvanti bhaksham ya~ antarikshe bahutha bhavanti
    | yah prithivi mpayasondanti shshukrastana apashagg syona bhavantu | ya shshivena ma cakshusha pashyatapashshivaya
    tanu vopasprishata tvaca mme | sarvagm agnigm rapsushado huve vo mayi varco bala mojo nidhatta ||
    shana mantrah papavimocanam hastena jalamadaya nishshvasya vamato nikshitapet drupada diva muncatu
    | drupada dive nmumucanah | svinna ssnatvi mala divah | puta mpavitrene vajyam apa shshundantu mainasah
    || shri krishna parabrahmane namo namah pranayamamya laghusankalpah purvokta evanguna visheshana vishishthayam
    shubhatithau mamopatta durita kshayadvara shri parameshvara muddishya shri parameshvara prityartha
    mpratassandhyanga yatha kalocita arghyapradana nkarishye || pratah kalarghya mantram o mbhurbhuvassuvah
    || tathsaviturvare mbhargo devasya dhimahi | dhiyo yo nah pracodaya || madhyahnarghya mantram om hagm
    sashshucisha dvasurantarikshasa ddota vedishadatithi rduronasat | nrisha dvarasa dritasa dvyoma sadabja
    goja ritaja adrija ritam nkalarghya mantram o mbhurbhuvassuvah || tathsaviturvare mbhargo devasya
    dhimahi | dhiyo yo nah pracodaya mbhuvah | ogm suvah | o ntapah | ogm satyam | o nyam bhargo devasya
    dhimahi | dhiyo yo nah pracodaya t || omapo jyoti raso kalatikramana prayashcittam acamya purvokta
    evanguna visheshana vishishthayam shubhatithau mamopatta durita kshayadvara shri parameshvara muddishya
    shri parameshvara prityartha nkalatikrama doshapariharartha ncaturtha arghyapradana mbhurbhuvassuvah
    || tathsaviturvare mbhargo devasya dhimahi | dhiyo yo nah pracodaya mbhuvah | ogm suvah | o ntapah
    | ogm satyam | o nyam bhargo devasya dhimahi | dhiyo yo nah pracodaya t || omapo jyoti raso sajala
    pradakshinam om udyantamastam thsakalambhadramashnute asavadityo brahmeti || brahmaiva san brahmapyeti
    ya evam ve~da || asavadityo brahma || tkalatikramane purvavat pashcat hastena jalamadaya pradakshina
    dviracamya pranayama traya sandhyanga tarpanam acamya shri krishna parabrahmane namo namah pratahkala
    tarpanam mama upatta samasta duritakshayadvara shri parameshvara prityardha ntarpayami || madhyahna
    tarpanam sandhya ntarpayami || sayankala tarpanam sandhya gayatri avahana omityekakshara mbrahma |
    agnirdevata brahma ityar mparamatmam sarupam | sayujyam ayatu varada devi akshara mbrahmasammitam
    | gayatri mbrahma jushasva me | yadahna tpratimucyate | yadratriya tpratimucyate | sarva varne mahadevi
    sandhyavidye sarasvati || ojo 'si balamasi bhrajo ndhamanamasi vishvamasi vishvayu mavahayami savitri
    mavahayami sarasvati mavahayami gayatriya gayatri cchando vishvamitrarishi ssavita devata 'gnirmukham
    brahma shiro vishnur shshikha prithivi yonih pranapana vyanodana samana saprana shvetavarna sankhyayana
    sagotra gayatri caturvigm shatyakshara tripada shatkukshih panca shopanayane viniyogah | o mbhuvah
    | ogm suvah | o ntapah | ogm satyam | o nyam bhargo devasya dhimahi | dhiyo yo nah pracodaya t ||
    omapo jyoti raso shri krishna parabrahmane namo namah gayatri japasankalpah purvokta evanguna visheshana
    vishishthayam shubhatithau mamopatta durita kshayadvara shri parameshvara muddisya shri parameshvara
    prityartham sandhyanga yathashakti gayatri mahamantra japa nkarishye || karanyasah o ntathsavituh
    brahmatmane angushtabhya nyam vishnavatmane tarjanibhya nnamah | bhargo devasya rudratmane madhyamabhya
    nnamah | dhimahi satyatmane anamikabhya nnamah | dhiyo yo nah jnanatmane kanishtikabhya thsarvatmane
    karatala karaprishtabhya nnamah | anganyasah o ntathsavituh brahmatmane hridayaya namah | vare nyam
    vishnavatmane shirase svaha | bhargo devasya rudratmane shikhayai vashat | dhimahi satyatmane kavacaya
    hum | dhiyo yo nah jnanatmane netratrayaya vaushat | pracodaya thsarvatmane astrayaphat | o mbhurbhuvassuvaromiti
    digbhandhah | dhyanam muktavidruma hemanila dhavalaccayai strikshanaih | yuktaminduni baddha ntatvartha
    varnatmikam | gayatrim va~radabhayankusha kashashshubhrankapalangadam | shankhancakra madharavinda
    yugalam hastairvahanti mbhaje || caturvimshati mudra pradar shanam sumukham samputincaiva vitatam
    ntrimukhancaiva catuh panca mukha nca grathitam sammukhonmukham | pralamba ncaiva matsyah kurmo varahakam
    | simhakranta ntatha | caturvimshati mudra vai gayatryam supratishthitah | itimudra na janati gayatri
    nishphala bhavet ndhiyo dharmadigocarah | prerayettasya yadbhargasta dvarenya mupasmahe || gayatri
    mantram o mbhurbhuvassuvah || tathsaviturvare nyam bhargo devasya dhimahi | dhiyo yo nah pracodaya
    t || tatsat brahmarpanamastu japavasanam acamya shri krishna parabrahmane namo namah mama upatta samasta
    duritakshayadvara shri parameshvara prityartha mpratassandyanga gayatri mahamantra japavasana nkarishye
    | karanyasah o ntathsavituh brahmatmane angushtabhya nyam vishnavatmane tarjanibhya nnamah | bhargo
    devasya rudratmane madhyamabhya nnamah | dhimahi satyatmane anamikabhya nnamah | dhiyo yo nah jnanatmane
    kanishtikabhya thsarvatmane karatala karaprishtabhya nnamah | anganyasah o ntathsavituh brahmatmane
    hridayaya namah | vare nyam vishnavatmane shirase svaha | bhargo devasya rudratmane shikhayai vashat
    | dhimahi satyatmane kavacaya hum | dhiyo yo nah jnanatmane netratrayaya vaushat | pracodaya thsarvatmane
    astrayaphat | o mbhurbhuvassuvaromiti digvimokah | dhyanam muktavidruma hemanila dhavalaccayai strikshanaih
    | yuktaminduni baddha ntatvartha varnatmikam | gayatrim va~radabhayankusha kashashshubhrankapalangadam
    | shankhancakra madharavinda yugalam hastairvahanti surabhirjnana cakre ca yonih kurmo nniryana mudra
    cetyashta mudrah prakirtitah || yo deva ssavita ndhiyo dharmadigocarah | prerayettasya yadbhargasta
    dvarenya mupasmahe || gururbrahma gururvishnuh gururdevò maheshvarah | gurussaksha tparabrahma tasmai
    shri gurave namah || o ntatsadbrahmarpanamastu | acamya shri krishna parabrahmane namo namah dvih
    parimujya | sakridupa sprishya | yatsavya mpanim | padam | prokshati shirah | cakshushi | nasike |
    shrotre | hridayamalabhya | pratahkala suryopasthanam o shani dhrita shravo devasya sana sim | satya
    ncitrashra vastamam | mitro janan yatayati prajana nmitro dadhara prithivi mutadyam | mitrah krishti
    ranimisha 'bhi cashte satyaya havya nghritavadvidhema | prasamittra martyo astu prayasva nyasta aditya
    shikshati vratena | na hanyate na jiyate tvotonaina magmho ashno tyantito na durat || madhyahna suryopasthanam
    om a satyena rajasa vartamano niveshaya nnamrita mmartyanca | hiranyayena savita rathena 'devo yati
    bhuvana nipashyan || udvaya ntamasa spari pashyanto jyoti ruttaram | devandevatra surya maganma jyoti
    ruttamam || udutyam jatavedasa va~hanti ketavah | drishe vishva ya surya ndevana mudaga danika rmitrasya
    varuna syagneh | apra dyava prithivi antarikshagm surya atma jagata stasthushashca || taccakshu ccukra
    muccarat | pashyema sharadashshata njivema sharadashshatam nandama sharadashshata mmodama sharadashshatam
    bhavama sharadashshatagm shrinavama sharadashshatam pabravama sharadashshatamajitasyama sharadashshata
    ndrishe || ya udaganmahato dvibhrajamana ssarirasya madhyathsama vrishabho lohitakshasuryo vipashcinmanasa
    punatu || sayankala suryopasthanam om imamme varuna shridhi hava madya ca mridaya | tva mavasyu racake
    || tatva yami brahmana vandamana sta dasha ste yajamano havirbhih | ahedamano varuneha bodhyurushagm
    samana ayuh pramoshih || yacciddhite vishoyatha pradeva varunavratam | minimasidya vidyavi | yatkincedam
    shcaramasi | acitti yattava dharmayuyopi stasma denaso devaririshah | kitavaso yadriripurnadivi yadvagha
    satyamutayanna vidma | sarvatavishya shidhirevadeva 'thatesyama varuna priyasah || nnamah pracyai
    dishe yashca devata etasya mprativasantye tabhyashca namah | o nnamo dakshinayai dishe yashca devata
    etasya mprativasantye tabhyashca namah | o cyai dishe yashca devata etasya mprativasantye tabhyashca
    namah | o cyai dishe yashca devata etasya mprativasantye tabhyashca namah | o nnama urdhvayai dishe
    yashca devata etasya mprativasantye tabhyashca namah | o 'dharayai dishe yashca devata etasya mprativasantye
    tabhyashca namah | o 'vantarayai dishe yashca devata etasya mprativasantye tabhyashca namah | muni
    namaskarah namo ganga yamunayo rmadhye ye vasanti te me prasannatmana shciranjivitam vardhayanti namo
    ganga yamunayo rmunibhyashca namo namo ganga yamunayo rmunibhyashca namah || sandhyadevata namaskarah
    sandhyayai namah | savitryai namah | gayatryai namah | sarasvatyai namah | sarvabhyo devatabhyo namah
    | devebhyo namah | rishibhyo namah | munibhyo namah | gurubhyo namah | pitribhyo namah | kamo rnamo
    namah | manyu rakar rnamo namah | prithivyapastejo vayurakashat namah || nnamo bhagavate vasudevaya
    | yagm sada sarvabhutani carani sthavarani ca | saya mprata rnamasyanti sa ma sandhya 'bhirakshatu
    || shivaya vishnurupaya shivarupaya vishnave | shivasya hridayam vi~shnurvishnoshca hridayam shivah
    || yatha shivamayo vishnurevam nna pashyami tatha me svastirayushi || namo brahmanya devaya go brahmana
    hitaya ca | jagaddhitaya krishnaya govindaya namo namah || gayatri udvasana uttame shikhare jate bhumya
    mparvatamurthani | brahmane 'bhyanujnata gaccadevi yathasukham | stuto maya varada vedamata pracodayanti
    pavane dvijata | ayuh prithivya 'stvanantaya sahasramurtaye sahasra padakshi shiroru bahave | sahasra
    namne purushaya shashvate sahasrakoti yuga dharine namah || bhumyakashabhi vandanam ida ndyava prithivi
    satyamastu | pita rmataryadi hopa briveva ndevana mavame avobhih | vidya mesham njiradanum || akashatpatita
    ya~tha gacchati sagaram | sarvadeva namaskarah keshava mpratigacchati || shri keshava mpratigacchatyonnama
    iti | sarvavedeshu yatpunyam | sarvatirtheshu yatphalam | tatphala mpurusha apnoti stutvadeva njanardhanam
    || stutvadeva nte jagatrayam | sarvabhuta nivaso 'stute || shri vasudeva namo mbho abhivadaye || acamya
    ishvararpanam kayena vaca manasendriyairva buddhya ''tmana va prakrite ssvabhavat | karomi yadyatsakala
    mparasmai shrimannarayanayeti samarpayami || harih o ntatsat | tatsarvam shri parameshvararpanamastu
    |
  devanagari: शरीर शुद्धि अपवित्रः पवित्रो वा सर्वावस्था त्पुण्डरीकाक्षं स बाह्याभ्यन्तर श्शुचिः ॥ पुण्डरीकाक्ष
    पुण्डरीकाक्षाय नमः । आचमनः ॐ आचम्य ओ न्त्रिविक्रमाय नमः ॐ ॐ श्रीधराय नमः ॐ हृषीकेशाय नमः म्पुरुषोत्तमाय
    नमः ॐ अधोक्षजाय नमः ओ नेत्रे श्रोत्रे च स्पृष्ट्वा हस्तं शिरसि निक्षिप्य ॐ हरये नमः ॐ श्रीकृष्णाय
    नमः ॐ श्रीकृष्ण परब्रह्मणे नमो नमः एतान्युच्चार्य उप्यक्त प्रकार ङ्कृते अङ्गानि शुद्धानि भवेयुः भूतोच्चाटन
    उत्तिष्ठन्तु । भूत पिशाचाः । ये ते भूमिभारकाः । ये तेषामविरोधेन । ब्रह्मकर्म समारभे । ओ म्भूर्भुवस्सुवः
    । दैवी गायत्री चन्दः प्राणायामे विनियोगः ङ्गायत्री मन्त्रमुच्छरेत् म्भुवः । ओग्ं सुवः । ओ न्तपः ।
    ओग्ं स॒त्यम् । ओ ण्यं॒ भर्गो॑ दे॒वस्य॑ धीमहि । धियो॒ यो नः॑ प्रचोदया त् ॥ ओमापो॒ ज्योती॒ रसो॒ समस्त
    दुरित क्षयद्वारा श्री परमेश्वर मुद्दिस्य श्री परमेश्वर प्रीत्यर्थम् श्री महाविष्णो राज्ञया समस्त देवता
    ब्राह्मण हरिहर गुरुचरण सन्निथौ सायं सन्ध्यां उपासिषे । मार्जनः ॐ आपो॒हिष्ठा म॑यो॒भुवः॑ । ता न॑ ऊ॒र्जे
    द॑धातन । म॒हेरणा॑य॒ चक्ष॑से । यो वः॑ शि॒वत॑मो॒ रसः॑ । तस्य॑ भाजयते॒ ह नः॒ । उ॒श॒तीरि॑व मा॒तरः॑ । तस्मा॒
    अर॑ङ्ग माम वः । यस्य॒ क्षया॑य॒ जिन्व॑थ । आपो॑ ज॒नय॑था च नः । प्रातः काल मन्त्राचमनः मन्यु॑कृते॒भ्यः
    । पापेभ्यो॑ रक्ष॒न्ताम् । यद्रात्र्या पाप॑ मका॒र् षम् । मनसा वाचा॑ ह॒स्ताभ्याम् । पद्भ्या मुदरे॑ण
    शि॒ञ्चा । रात्रि॒ स्तद॑वलु॒म्पतु । यत्किञ्च॑ दुरि॒त म्मा ममृ॑त यो॒ नौ । सूर्ये ज्योतिषि जुहो॑मि स्वा॒हा
    मध्याह्न काल मन्त्राचमनः आपः॑ पुनन्तु पृथि॒वी म्पृ॑थि॒वी पू॒ता पु॑नातु॒ माम् । पु॒नन्तु॒ ब्रह्म॑ण॒स्पति॒
    र्ब्रह्मा॑ पू॒ता पु॑नातु॒ माम् । यदुच्छि॑ष्ट॒ मभो ज्यं॒ यद्वा॑ दु॒श्चरि॑त॒ ऽस॒ताञ्च॑ प्रति॒ग्रह॒ग्ग्॒
    स्वाहा सायङ्काल मन्त्राचमनः अग्नि श्च मा मन्यु श्च मन्युपतय श्च मन्यु॑कृतेभ्यः । पापेभ्यो॑ रक्ष॒न्ताम्
    । यदह्ना पाप॑ मका॒र् षम् । मनसा वाचा॑ हस्ता॒भ्याम् । पद्भ्या मुदरे॑ण शि॒ञ्चा । अह स्तद॑वलु॒म्पतु ।
    य त्किञ्च॑ दुरि॒त म्मा ममृ॑त यो॒नौ । सत्ये ज्योतिषि जुहोमि स्वा॒हा ॥ श्री कृष्ण परब्रह्मणे नमो नमः
    द्वितीय मार्जनः द॒धि॒ क्राव् ण्णो॑ अकारिषम् । जि॒ष्णो रश्व॑स्य वा॒जि॑नः । सु॒रभिनो॒ मुखा॑कर॒त्प्रण॒
    आयूग्ं॑षि तारिषत् ॥ सूर्यपक्षे लोकयात्रा निर्वाहक इत्यर्थः ॐ आपो॒ हिष्ठा म॑यो॒भुवः॑ । ता न॑ ऊ॒र्जे
    द॑धातन । म॒हेरणा॑य॒ चक्ष॑से । यो वः॑ शि॒वत॑मो॒ रसः॑ । तस्य॑ भाजयते॒ ह नः॒ । उ॒श॒तीरि॑व मा॒तरः॑ । तस्मा॒
    अर॑ङ्ग माम वः । यस्य॒ क्षया॑य॒ जिन्व॑थ । आपो॑ ज॒नय॑था च नः ॥ पुनः मार्जनः हिर॑ण्यवर्णा॒ श्शुच॑यः पाव॒काः
    या सु॑जा॒तः क॒श्यपो॒ या स्विन्द्रः॑ । अ॒ग्निं याँ गर्भ॑न्दधि॒रे विरू॑पा॒ स्तान॒ आप॒श्शग्ग् स्यो॒ना
