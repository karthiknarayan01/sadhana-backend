id: ashtavakra-gita-chapter-11
category: stotram
name:
  english: Ashtavakra Gita Chapter 11
content:
  english: ashtavakra uvaca || bhavabhavavikarashca svabhavaditi nishcayi | nirvikaro gatakleshah sukhenaivopashamyati
    || || ishvarah sarvanirmata nehanya iti nishcayi | antargalitasarvashah shantah kvapi na sajjate ||
    || apadah sampadah kale daivadeveti nishcayi | triptah svasthendriyo nityam na vanchati na shocati
    || || sukhaduhkhe janmamrityu daivadeveti nishcayi | sadhyadarshi nirayasah kurvannapi na lipyate
    || || cintaya jayate duhkham nanyatheheti nishcayi | taya hinah sukhi shantah sarvatra galitasprihah
    || || naham deho na me deho bodho'hamiti nishcayi | kaivalyamiva samprapto na smaratyakritam kritam
    || || abrahmastambaparyantamahameveti nishcayi | nirvikalpah shucih shantah praptapraptavinirvritah
    || || nanashcaryamidam vishvam na kinciditi nishcayi | nirvasanah sphurtimatro na kincidiva shamyati
    ||
  devanagari: अष्टावक्र उवाच ॥ भावाभावविकारश्च स्वभावादिति निश्चयी । निर्विकारो गतक्लेशः सुखेनैवोपशाम्यति
    ॥ ॥ ईश्वरः सर्वनिर्माता नेहान्य इति निश्चयी । अन्तर्गलितसर्वाशः शान्तः क्वापि न सज्जते ॥ ॥ आपदः सम्पदः
    काले दैवादेवेति निश्चयी । तृप्तः स्वस्थेन्द्रियो नित्यं न वाञ्छति न शोचति ॥ ॥ सुखदुःखे जन्ममृत्यू
    दैवादेवेति निश्चयी । साध्यादर्शी निरायासः कुर्वन्नपि न लिप्यते ॥ ॥ चिन्तया जायते दुःखं नान्यथेहेति
    निश्चयी । तया हीनः सुखी शान्तः सर्वत्र गलितस्पृहः ॥ ॥ नाहं देहो न मे देहो बोधोऽहमिति निश्चयी । कैवल्यमिव
    सम्प्राप्तो न स्मरत्यकृतं कृतम् ॥ ॥ आब्रह्मस्तम्बपर्यन्तमहमेवेति निश्चयी । निर्विकल्पः शुचिः शान्तः
    प्राप्ताप्राप्तविनिर्वृतः ॥ ॥ नानाश्चर्यमिदं विश्वं न किञ्चिदिति निश्चयी । निर्वासनः स्फूर्तिमात्रो
    न किञ्चिदिव शाम्यति ॥
