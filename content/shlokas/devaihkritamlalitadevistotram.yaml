id: devaihkritamlalitadevistotram
category: stotram
name:
  english: devaihkritamlalitadevistotram
  devanagari: देवैःकृतंललितादेवीस्तोत्रम्
content:
  english: devaih kritam lalitadevistotram deva ucuh | jaya devi jaganmatarjaya devi paratpare | jaya
    kalyananilaye jaya kamakalatmike || 1|| jayakari ca vamakshi jaya kamakshi sundari | jayakhilasuraradhye
    jaya kameshi manade || 2|| jaya brahmamaye devi brahmatmakarasatmike | jaya narayani pare nanditasheshavishtape
    || 3|| jaya shrikanthadayite jaya shrilalitambike | jaya shrivijaye devi vijayashrisamriddhide ||
    4|| jatasya jayamanasya ishtapurtasya hetave | namastasyai trijagatam palayitryai paratpare || 5||
    kalamuhurtakashthaharmasartusharadatmane | namah sahasrashirshayai sahasramukhalocane || 6|| namah
    sahasrahastabjapadapankajashobhite | anoranutare devi mahato'pi mahiyasi || 7|| paratparatare matastejastejiyasamapi
    | atalam tu bhavetpadau vitalam januni tava || 8|| rasatalam katideshah kukshiste dharani bhavet |
    hridayam tu bhuvarlokah svaste mukhamudahritam || 9|| drishashcandrarkadahana dishaste bahavo'mbike
    | marutastu tavocchvasa vacaste shrutayo'khilah || 10|| krida te lokaracana sakha te cinmayah shivah
    | aharaste sadanando vasaste hridaye satam || 11|| drishyadrishyasvarupani rupani bhuvanani te | shiroruha
    ghanaste tu tarakah kusumani te || 12|| dharmadya bahavaste syuradharmadyayudhani te | yamashca niyamashcaiva
    karapadaruhastatha || 13|| stanau svahasvadhakarau lokojjivanakarakau | pranayamastu te nasa rasana
    te sarasvati || 14|| pratyaharastvindriyani dhyanam te dhistu sattama | manaste dharanashaktirhridayam
    te samadhikah || 15|| mahiruhaste'ngaruhah prabhatam vasanam tava | bhutam bhavyam bhavishyacca nityam
    ca tava vigrahah || 16|| yajnarupa jagaddhatri vishvarupa ca pavani | adau ya tu dayabhuta sasarja
    nikhilah prajah || 17|| hridayasthapi lokanamadrishya mohanatmika || 18|| namarupavibhagam ca ya karoti
    svalilaya | tanyadhishthaya tishthanti teshvasaktarthakamada | namastasyai mahadevyai sarvashaktyai
    namo namah || 19|| yadajnaya pravartante vahnisuryendumarutah | prithivyadini bhutani tasyai devyai
    namo namah || 20|| ya sasarjadidhataram sargadavadibhuridam | dadhara svayamevaika tasyai devyai namo
    namah || 21|| yatha dhrita tu dharini yayakashamameyaya | yasyamudeti savita tasyai devyai namo namah
    || 22|| yatrodeti jagatkritsnam yatra tishthati nirbharam | yatrantameti kale tu tasyai devyai namo
    namah || 23|| namo namaste rajase bhavayai namo namah sattvikasamsthitayai | namo namaste tamase harayai
    namo namo nirgunatah shivayai || 24|| namo namaste jagadekamatre namo namaste jagadekapitre | namo
    namaste'khilarupatantre namo namaste'khilayantrarupe || 25|| namo namo lokagurupradhane namo namaste'khilavagvibhutyai
    | namo'stu lakshmyai jagadekatushtyai namo namah shambhavi sarvashaktyai || 26|| anadimadhyantamapancabhautikam
    hyavanmanogamyamatarkyavaibhavam | arupamadvandvamadrishtagocaram prabhavamagryam kathamamba varnaye
    || 27|| prasida vishveshvari vishvavandite prasida vidyeshvari vedarupini | prasida mayamayi mantravigrahe
    prasida sarveshvari sarvarupini || 28|| iti statva mahadevim devah sarve savasavah | bhuyo bhuyo namaskritya
    sharanam jagamuranjasa || 29|| tatah prasanna sa devi pranatam vikshya vasavam | varena cchandayamasa
    varadakhiladehinam || 30|| iti brahmandapurane uttarabhage trayodashadhyayantargatam devaih kritam
    lalitadevistotram samaptam | brahmandapurana | uttarabhaga | lalita | adhyaya 13
  devanagari: देवैः कृतं ललितादेवीस्तोत्रम् देवा ऊचुः । जय देवि जगन्मातर्जय देवि परात्परे । जय कल्याणनिलये
    जय कामकलात्मिके ॥ १॥ जयकारि च वामाक्षि जय कामाक्षि सुन्दरि । जयाखिलसुराराध्ये जय कामेशि मानदे ॥ २॥
    जय ब्रह्ममये देवि ब्रह्मात्मकरसात्मिके । जय नारायणि परे नन्दिताशेषविष्टपे ॥ ३॥ जय श्रीकण्ठदयिते जय
    श्रीललिताम्बिके । जय श्रीविजये देवि विजयश्रीसमृद्धिदे ॥ ४॥ जातस्य जायमानस्य इष्टापूर्तस्य हेतवे ।
    नमस्तस्यै त्रिजगतां पालयित्र्यै परात्परे ॥ ५॥ कलामुहूर्तकाष्ठाहर्मासर्तुशरदात्मने । नमः सहस्रशीर्षायै
    सहस्रमुखलोचने ॥ ६॥ नमः सहस्रहस्ताब्जपादपङ्कजशोभिते । अणोरणुतरे देवि महतोऽपि महीयसि ॥ ७॥ परात्परतरे
    मातस्तेजस्तेजीयसामपि । अतलं तु भवेत्पादौ वितलं जानुनी तव ॥ ८॥ रसातलं कटीदेशः कुक्षिस्ते धरणी भवेत्
    । हृदयं तु भुवर्लोकः स्वस्ते मुखमुदाहृतम् ॥ ९॥ दृशश्चन्द्रार्कदहना दिशस्ते बाहवोऽम्बिके । मरुतस्तु
    तवोच्छ्वासा वाचस्ते श्रुतयोऽखिलाः ॥ १०॥ क्रीडा ते लोकरचना सखा ते चिन्मयः शिवः । आहारस्ते सदानन्दो
    वासस्ते हृदये सताम् ॥ ११॥ दृश्यादृश्यस्वरूपाणि रूपाणि भुवनानि ते । शिरोरुहा घनास्ते तु तारकाः कुसुमानि
    ते ॥ १२॥ धर्माद्या बाहवस्ते स्युरधर्माद्यायुधानि ते । यमाश्च नियमाश्चैव करपादरुहास्तथा ॥ १३॥ स्तनौ
    स्वाहास्वधाकरौ लोकोज्जीवनकारकौ । प्राणायामस्तु ते नासा रसना ते सरस्वती ॥ १४॥ प्रत्याहारस्त्विन्द्रियाणि
    ध्यानं ते धीस्तु सत्तमा । मनस्ते धारणाशक्तिर्हृदयं ते समाधिकः ॥ १५॥ महीरुहास्तेऽङ्गरुहाः प्रभातं वसनं
    तव । भूतं भव्यं भविष्यच्च नित्यं च तव विग्रहः ॥ १६॥ यज्ञरूपा जगद्धात्री विश्वरूपा च पावनी । आदौ या
    तु दयाभूता ससर्ज निखिलाः प्रजाः ॥ १७॥ हृदयस्थापि लोकानामदृश्या मोहनात्मिका ॥ १८॥ नामरूपविभागं च या
    करोति स्वलीलया । तान्यधिष्ठाय तिष्ठन्ती तेष्वसक्तार्थकामदा । नमस्तस्यै महादेव्यै सर्वशक्त्यै नमो नमः
    ॥ १९॥ यदाज्ञया प्रवर्तन्ते वह्निसूर्येन्दुमारुताः । पृथिव्यादीनि भूतानि तस्यै देव्यै नमो नमः ॥ २०॥
    या ससर्जादिधातारं सर्गादावादिभूरिदम् । दधार स्वयमेवैका तस्यै देव्यै नमो नमः ॥ २१॥ यथा धृता तु धरिणी
    ययाकाशममेयया । यस्यामुदेति सविता तस्यै देव्यै नमो नमः ॥ २२॥ यत्रोदेति जगत्कृत्स्नं यत्र तिष्ठति निर्भरम्
    । यत्रान्तमेति काले तु तस्यै देव्यै नमो नमः ॥ २३॥ नमो नमस्ते रजसे भवायै नमो नमः सात्त्विकसंस्थितायै
    । नमो नमस्ते तमसे हरायै नमो नमो निर्गुणतः शिवायै ॥ २४॥ नमो नमस्ते जगदेकमात्रे नमो नमस्ते जगदेकपित्रे
    । नमो नमस्तेऽखिलरूपतन्त्रे नमो नमस्तेऽखिलयन्त्ररूपे ॥ २५॥ नमो नमो लोकगुरुप्रधाने नमो नमस्तेऽखिलवाग्विभूत्यै
    । नमोऽस्तु लक्ष्म्यै जगदेकतुष्ट्यै नमो नमः शाम्भवि सर्वशक्त्यै ॥ २६॥ अनादिमध्यान्तमपाञ्चभौतिकं ह्यवाङ्मनोगम्यमतर्क्यवैभवम्
    । अरूपमद्वन्द्वमदृष्टगोचरं प्रभावमग्र्यं कथमम्ब वर्णये ॥ २७॥ प्रसीद विश्वेश्वरि विश्ववन्दिते प्रसीद
    विद्येश्वरि वेदरूपिणि । प्रसीद मायामयि मन्त्राविग्रहे प्रसीद सर्वेश्वरि सर्वरूपिणि ॥ २८॥ इति स्तत्वा
    महादेवीं देवाः सर्वे सवासवाः । भूयो भूयो नमस्कृत्य शरणं जगमुरञ्जसा ॥ २९॥ ततः प्रसन्ना सा देवी प्रणतं
    वीक्ष्य वासवम् । वरेण च्छन्दयामास वरदाखिलदेहिनाम् ॥ ३०॥ इति ब्रह्माण्डपुराणे उत्तरभागे त्रयोदशाध्यायान्तर्गतं
    देवैः कृतं ललितादेवीस्तोत्रं समाप्तम् । ब्रह्माण्डपुराण । उत्तरभाग । ललिता । अध्याय १३
