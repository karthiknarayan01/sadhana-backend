id: namavali-81
category: stotram
name:
  english: namavali
  devanagari: नामावली
content:
  english: makutam kutilagrakesham shastaramishtavaradam pranato'sti nityam || om mahashastre namah |
    om vishvashastre namah | om lokashastre namah | om dharmashastre namah | om vedashastre namah | om
    kalashastre namah | om gajadhipaya namah | om gajarudhaya namah | om ganadhyakshaya namah | om vyaghrarudhaya
    namah | 10 om mahadyutaye namah | om goptre namah | om girvanasamsevyaya namah | om gatatankaya namah
    | om ganagranye namah | om rigvedarupaya namah | om nakshatraya namah | om candrarupaya namh | om
    balahakaya namah | om durvashyamaya namah | om maharupaya namah | om kruradrishtaye namah | 20 om
    anamayaya namah | om trinetraya namah | om utpalakaraya namah | om kalahantre namah | om naradhipaya
    namah | om khandendumauḻitanayaya namah | om kalharakusumapriyaya namah | om madanaya namah | om madhavasutaya
    namah | om mandarakusumarcitaya namah | om mahabalaya namah | om mahotsahaya namah | om mahapapavinashanaya
    namah | om mahashuraya namah | om mahadhiraya namah | om mahasarpavibhushanaya namah | om asihastaya
    namah | om sharadharaya namah | 40 om halahaladharatmajaya namah | om arjuneshaya namah | om agni
    nayanaya namah | om anangamadanaturaya namah | om dushtagrahadhipaya namah | om shridaya namah | om
    shishtarakshanadikshitaya namah | om kasturitilakaya namah | om rajashekharaya namah | om rajasattamaya
    namah | 50 om rajarajarcitaya namah | om vishnuputraya namah | om vanajanadhipaya namah | om varcaskaraya
    namah | om vararucaye namah | om varadaya namah | om vayuvahanaya namah | om vajrakayaya namah | om
    khadgapanaye namah | om vajrahastaya namah | 60 om baloddhataya namah | om trilokajnaya namah | om
    atibalaya namah | om pushkalaya namah | om vrittapavanaya namah | om purnadhavaya namah | om pushkaleshaya
    namah | om pashahastaya namah | om bhayapahaya namah | om phatkararupaya namah | 70 om papaghnaya
    namah | om pashandarudhirashanaya namah | om pancapandavasantratre namah | om parapancaksharashritaya
    namah | om pancavaktrasutaya namah | om pujyaya namah | om panditaya namah | om parameshvaraya namah
    | om bhavatapaprashamanaya namah | om bhaktabhishtapradayakaya namah | 80 om kavaye namah | om kavinamadhipaya
    namah | om kripaḻave namah | om kleshanashanaya namah | om samaya namah | om arupaya namah | om senanye
    namah | om bhaktasampatpradayakaya namah | om vyaghracarmadharaya namah | om shuline namah | om kapaline
    namah | om venuvadanaya namah | om kambukanthaya namah | om kalaravaya namah | om kiritadivibhushanaya
    namah | om dhurjataye namah | om viranilayaya namah | om viraya namah | om virenduvanditaya namah
    | om vishvarupaya namah | 100 om vrishapataye namah | om vividharthaphalapradaya namah | om dirghanasaya
    namah | om mahabahave namah | om caturbahave namah | om jatadharaya namah | om sanakadimunishreshthastutyaya
    namah | om hariharatmajaya namah || 108 iti shrihariharaputrashtottarashatanamavalih sampurnam ||
  devanagari: मकुटं कुटिलाग्रकेशम् शास्तारमिष्टवरदं प्रणतोऽस्ति नित्यम् ॥ ॐ महाशास्त्रे नमः । ॐ विश्वशास्त्रे
    नमः । ॐ लोकशास्त्रे नमः । ॐ धर्मशास्त्रे नमः । ॐ वेदशास्त्रे नमः । ॐ कालशस्त्रे नमः । ॐ गजाधिपाय नमः
    । ॐ गजारूढाय नमः । ॐ गणाध्यक्षाय नमः । ॐ व्याघ्रारूढाय नमः । १० ॐ महाद्युतये नमः । ॐ गोप्त्रे नमः
    । ॐ गीर्वाणसंसेव्याय नमः । ॐ गतातङ्काय नमः । ॐ गणाग्रण्ये नमः । ॐ ऋग्वेदरूपाय नमः । ॐ नक्षत्राय नमः
    । ॐ चन्द्ररूपाय नाम्ः । ॐ बलाहकाय नमः । ॐ दूर्वाश्यामाय नमः । ॐ महारूपाय नमः । ॐ क्रूरदृष्टये नमः
    । २० ॐ अनामयाय नमः । ॐ त्रिनेत्राय नमः । ॐ उत्पलकराय नमः । ॐ कालहन्त्रे नमः । ॐ नराधिपाय नमः । ॐ खण्डेन्दुमौळितनयाय
    नमः । ॐ कल्हारकुसुमप्रियाय नमः । ॐ मदनाय नमः । ॐ माधवसुताय नमः । ॐ मन्दारकुसुमार्चिताय नमः । ॐ महाबलाय
    नमः । ॐ महोत्साहाय नमः । ॐ महापापविनाशनाय नमः । ॐ महाशूराय नमः । ॐ महाधीराय नमः । ॐ महासर्पविभूषणाय
    नमः । ॐ असिहस्ताय नमः । ॐ शरधराय नमः । ४० ॐ हालाहलधरात्मजाय नमः । ॐ अर्जुनेशाय नमः । ॐ अग्नि नयनाय
    नमः । ॐ अनङ्गमदनातुराय नमः । ॐ दुष्टग्रहाधिपाय नमः । ॐ श्रीदाय नमः । ॐ शिष्टरक्षणदीक्षिताय नमः । ॐ
    कस्तूरीतिलकाय नमः । ॐ राजशेखराय नमः । ॐ राजसत्तमाय नमः । ५० ॐ राजराजार्चिताय नमः । ॐ विष्णुपुत्राय
    नमः । ॐ वनजनाधिपाय नमः । ॐ वर्चस्कराय नमः । ॐ वररुचये नमः । ॐ वरदाय नमः । ॐ वायुवाहनाय नमः । ॐ वज्रकायाय
    नमः । ॐ खड्गपाणये नमः । ॐ वज्रहस्ताय नमः । ६० ॐ बलोद्धताय नमः । ॐ त्रिलोकज्ञाय नमः । ॐ अतिबलाय नमः
    । ॐ पुष्कलाय नमः । ॐ वृत्तपावनाय नमः । ॐ पूर्णाधवाय नमः । ॐ पुष्कलेशाय नमः । ॐ पाशहस्ताय नमः । ॐ भयापहाय
    नमः । ॐ फट्काररूपाय नमः । ७० ॐ पापघ्नाय नमः । ॐ पाषण्डरुधिराशनाय नमः । ॐ पञ्चपाण्डवसन्त्रात्रे नमः
    । ॐ परपञ्चाक्षराश्रिताय नमः । ॐ पञ्चवक्त्रसुताय नमः । ॐ पूज्याय नमः । ॐ पण्डिताय नमः । ॐ परमेश्वराय
    नमः । ॐ भवतापप्रशमनाय नमः । ॐ भक्ताभीष्टप्रदायकाय नमः । ८० ॐ कवये नमः । ॐ कवीनामधिपाय नमः । ॐ कृपाळवे
    नमः । ॐ क्लेशनाशनाय नमः । ॐ समाय नमः । ॐ अरूपाय नमः । ॐ सेनान्ये नमः । ॐ भक्तसम्पत्प्रदायकाय नमः ।
    ॐ व्याघ्रचर्मधराय नमः । ॐ शूलिने नमः । ॐ कपालिने नमः । ॐ वेणुवादनाय नमः । ॐ कम्बुकण्ठाय नमः । ॐ कलरवाय
    नमः । ॐ किरीटादिविभूषणाय नमः । ॐ धूर्जटये नमः । ॐ वीरनिलयाय नमः । ॐ वीराय नमः । ॐ वीरेन्दुवन्दिताय
    नमः । ॐ विश्वरूपाय नमः । १०० ॐ वृषपतये नमः । ॐ विविधार्थफलप्रदाय नमः । ॐ दीर्घनासाय नमः । ॐ महाबाहवे
    नमः । ॐ चतुर्बाहवे नमः । ॐ जटाधराय नमः । ॐ सनकादिमुनिश्रेष्ठस्तुत्याय नमः । ॐ हरिहरात्मजाय नमः ॥ १०८
    इति श्रीहरिहरपुत्राष्टोत्तरशतनामावलिः सम्पूर्णम् ॥
