id: sarveshvarividya
category: stotram
name:
  english: sarveshvarividya
  devanagari: सर्वेश्वरीविद्या
content:
  english: navadurgadhyanam sarvocitabhishtasiddhihetave purusharthacatushtayasiddhyarthe pathe viniyogah
    || atha dhyanam | durga cashtabhuji trilokajanani raktambaralankrita tasminchailaguhantare budhajanai
    hyaradhita sarvada | cittahladakari sadasukhakari samrajyasandayini ardhangi girirajarajatanaya rakshantu
    bhaktan sada || atha sarveshvarividyastotram | om namashcandikayai | kalika kalarupa ca yamadandavidarini
    | dakshineshi trinetra ca digambaryai namo'stu te || 1|| shankararddhasanagata jagritavyomacarini
    | shulakhatvangadharinyai kalikayai namo'stu te || 2|| digvastra krishnavarna ca jvaladagnisamaprabha
    | daityahantri shavarudha mokshadayai namo'stu te || 3|| shmashanasthananilaya muktakeshi smitanana
    | rogapaharini devi raktabhojyai namo'stu te || 4|| tanoti jagatah saram papaughan parishamyati |
    sa tara bhimarupa ca sarvabhishtaprada bhavet || 5|| tara trailokyajanani nagamala samashrita | adbhuta
    jnanadatri ca srishtisthityantakarini || 6|| patalabjairarcita sa nila bhima sarasvati | vivastra
    daityasamhantri dhanada nirgunamala || 7|| shiva shivapriya caiva shambhudhatri mahojjvala | trailokyapalini
    devi sa tara paripatu me || 8|| shodashi saumyavadana brahmavishnushivanuta | hatakairbhushanairdivyaih
    sarvalankarabhushita || 9|| vishalanetra sukuca dadimopamadantura | shodashangi komalangi mandahasa
    sada shubha || 10|| katipradeshasukshmangi vrittapinapayodhara | padmahasta ca kanyabhih shodashabhih
    sadavrita || 11|| sarvasampatkari devi shodashi surasundari | anandavarddhini bhama vishvayone namo'stu
    te || 12|| tridevajanani vandya raktacandanacarcita | keyurangadabhushangi minakshi kokilasvara ||
    13|| bhuvaneshi jaganmata tridashaih sarvadarcita | ishvari bhogada ramya shivaparyankashayini ||
    14|| japakusumasampujya padmasanasamashrita | candrasuryagninetra ca varada mokshadayini || 15|| raktavastra
    mahavidya mahadevi tu shankari | prayacchatu mamabhishtan sarvada bhuvaneshvari || 16|| raktapa sa
    karalasya virupa vikatanana | bhairavi candika devi candamundavinashini || 17|| yoginivrindaghoraishca
    sadapujya jayaprada | mundamalavritangi sa prasanna bhairavi bhavet || 18|| citavahnisamarudha papaughadurvidarini
    | kaushiki vasudha tivra bhairavi caparajita || 19|| surasuraradhita ca nijabhaktartinashini | bhairavi
    pancami vidya sarvatah paripatu mam || 20|| chinnamastadbhuta ghora sumedharshisupujita | svaraktapa
    vishalakshi vastrahina mahabhuja || 21|| tyagavatsalyasampurna shatrunasharthatatpara | manojavapriyarudha
    krishna bhima jayamara || 22|| vetalaganasamrajni prajnavardhanakarini | khatvangamundadharinyai vishirshayai
    namo namah || 23|| kundali kundaleshani jayadiyoginivrita | chinnashirsha sada patu mahabhogapradayini
    || 24|| vriddha dhumra shurpahasta pracandabhimavikrama | virupa kutila tikshna shvetakeshi bhayankari
    || 25|| yasya japena homena smaranenaiva cedapi | nashyanti shatravah sarve tatha duritanashanam ||
    26|| gardabhasanasamrudha daridra bhoganashini | jyeshthalakshmistatha dhumavati apannivarini || 27||
    vishvarupam ripudhvamsakarinim kleshaharinim | sarvabhutaniyantrim tam dhumadevim namamyaham || 28||
    vishnoh samharikashaktirbagaleti pracakshate | shatrunashaya vande tamacyutam bagalamukhim || 29||
    pitambara pitavarna pitapushpopashobhita | stambhini dravini caiva bagale tvam nato'smyaham || 30||
    pretasanopasamvishta haridraketakipriya | sudhasamudradvipastha tatra santrasayan ripun || 31|| shatkarmasiddhidam
    devim komalam bhimavikramam | svarnavarnam svayantejam tam namamyahamadarat || 32|| matangi navami
    vidya matangamunipujita | gajarudha mattacitta madhupa cittamohini || 33|| madhukapushpasampujya yogada
    bhogada jaya | kakapakshakiritangi raktabharanalankrita || 34|| buddhyahankaracittadinmohayitva hasanmukhi
    | sa nijecchanusarena bhramayatyeva mayaya || 35|| manurajyaprada mandahasa mandehanashini | matangi
    vishvajanani prasanna syanmamopari || 36|| bhargavi sindhusambhuta kamalasanasamsthita | shakradibhih
    pujita ca shridevi vishnuvallabha || 37|| ulukasanasamrudha yatulaishvaryadayini | keshavarddhasanagata
    raktavastra shucismita || 38|| dashami kamala vidya sarvarthaparipalini | sindhuja aruna bhadra padmapushpavilasini
    || 39|| candraprabha kardamamba svarnavrishtikari sada | shrividya parameshani daridryattrahi vegatah
    || 40|| dakshayanidehasamashritastatha dashakriti rupagunairvibhajitah | tah sarvavidyah pranamamyaham
    sada yacchantu mahyam hridi purvavanchitam || 41|| nagendraja parvati ca aparna shivaragini | ganeshajanani
    devi shailaputri sadavatu || 42|| shiva shivapriya caikavira yogindrapujita | kailashavasini devi
    shailaja parirakshatu || 43|| brahmarupa ca vedajna shrutisanghatakarini | savitri brahmavidya sa
    parama prakriti para || 44|| paravidyam paravanim paradhyanaikagaminim | akshamalankushadharam namami
    brahmacarinim || 45|| shabdabrahmamayi devi hyakshara ravakarini | omkareshi caturvani caturdinkirtivistara
    || 46|| candraghantam svayamshabdam daityakarnavidarinim | purnendusamasaumyam tam sarvadam pranamamyaham
    || 47|| asankhyakotibrahmandasambhutisthitikarini | kushmanda sa mahamaya sarvada suprasidatu || 48||
    svodare vishvamakhilam dharayantim tu sarvada | vina shramena vande tam kushmandam vishvadharinim
    || 49|| mahasenasya janani devasainyaprakashini | simharudha vishalakshi sa nashyedduritam mama ||
    50|| balagrahabhibhutanam sarvopadravanashikam | sarvabhishtapradam devim namami shambhuvallabham
    || 51|| muladharasthite padme caturvarnasamashrita | katyayani yogagamya kalyanam vidadhatu me ||
    52|| mrigendrasanamarudha katyayanatanudbhava | sarvabhutaniyantri sa sarvada varada bhavet || 53||
    gardabhasanasamrudha muktakeshi mahodari | carmashatim samavritya kvacidvastrairniravrita || 54||
    kalasya harini bhutadravini vikatanana | ajeya kalaratrih sarvashubhebhyo'bhirakshatu || 55|| vrisharudha
    shashankanga trinetra shvetavasasa | mandarapushpasampujya shulatankadhara shiva || 56|| mahagauriti
    sa jneya pujya kaivalyadayini | vibhratim jnanamudranca dasishta jnananirmalam || 57|| cakreshvari
    rajavidya guhya gopya sarasvati | vibudhairvandita divyamalyambaradhara priya || 58|| yogindravrindasamsevyam
    sarvabhishtaikadayinim | sarvalokastutam siddhidatrim tam pranamamyaham || 59|| nigraha uvaca | imam
    sarveshvarim vidyam yo'dhite pratyaham narah | sarvaishvaryamavapnotyayutavrittiryadi krita || 60||
    gurupushye ravipushye'mayam vapi nishagate | shaktipithe siddhapithe navaratre visheshatah || 61||
    prapnoti dravinam jnanam santatim preyasim tatha | athava muktimapnoti nishkamo yadi sampathet ||
    62|| nigrahacarya ne kaha
  devanagari: नवदुर्गाध्यानं सर्वोचिताभीष्टसिद्धिहेतवे पुरुषार्थचतुष्टयसिद्ध्यर्थे पाठे विनियोगः ॥ अथ
    ध्यानम् । दुर्गा चाष्टभुजी त्रिलोकजननी रक्ताम्बरालङ्कृता तस्मिञ्छैलगुहान्तरे बुधजनै ह्याराधिता सर्वदा
    । चित्ताह्लादकरी सदासुखकरी साम्राज्यसन्दायिनी अर्धाङ्गी गिरिराजराजतनया रक्षन्तु भक्तान् सदा ॥ अथ सर्वेश्वरीविद्यास्तोत्रम्
    । ॐ नमश्चण्डिकायै । कालिका कालरूपा च यमदण्डविदारिणी । दक्षिणेशी त्रिनेत्रा च दिगम्बर्यै नमोऽस्तु ते
    ॥ १॥ शङ्करार्द्धासनगता जागृतव्योमचारिणी । शूलखट्वाङ्गधारिण्यै कालिकायै नमोऽस्तु ते ॥ २॥ दिग्वस्त्रा
    कृष्णवर्णा च ज्वलदग्निसमप्रभा । दैत्यहन्त्री शवारूढा मोक्षदायै नमोऽस्तु ते ॥ ३॥ श्मशानस्थाननिलया मुक्तकेशी
    स्मितानना । रोगापहारिणी देवि रक्तभोज्यै नमोऽस्तु ते ॥ ४॥ तनोति जगतः सारं पापौघान् परिशाम्यति । सा
    तारा भीमरूपा च सर्वाभीष्टप्रदा भवेत् ॥ ५॥ तारा त्रैलोक्यजननी नागमाला समाश्रिता । अद्भुता ज्ञानदात्री
    च सृष्टिस्थित्यन्तकारिणी ॥ ६॥ पाटलाब्जैरर्चिता सा नीला भीमा सरस्वती । विवस्त्रा दैत्यसंहन्त्री धनदा
    निर्गुणामला ॥ ७॥ शिवा शिवप्रिया चैव शम्भुधात्री महोज्ज्वला । त्रैलोक्यपालिनी देवी सा तारा परिपातु
    मे ॥ ८॥ षोडशी सौम्यवदना ब्रह्मविष्णुशिवानुता । हाटकैर्भूषणैर्दिव्यैः सर्वालङ्कारभूषिता ॥ ९॥ विशालनेत्रा
    सुकुचा दाडिमोपमदन्तुरा । षोडशाङ्गी कोमलाङ्गी मन्दहासा सदा शुभा ॥ १०॥ कटिप्रदेशसूक्ष्माङ्गी वृत्तपीनपयोधरा
    । पद्महस्ता च कन्याभिः षोडशाभिः सदावृता ॥ ११॥ सर्वसम्पत्करी देवी षोडशी सुरसुन्दरी । आनन्दवर्द्धिनी
    भामा विश्वयोने नमोऽस्तु ते ॥ १२॥ त्रिदेवजननी वन्द्या रक्तचन्दनचर्चिता । केयूराङ्गदभूषाङ्गी मीनाक्षी
    कोकिलस्वरा ॥ १३॥ भुवनेशी जगन्माता त्रिदशैः सर्वदार्चिता । ईश्वरी भोगदा रम्या शिवपर्यङ्कशायिनी ॥ १४॥
    जपाकुसुमसम्पूज्या पद्मासनसमाश्रिता । चन्द्रसूर्याग्निनेत्रा च वरदा मोक्षदायिनी ॥ १५॥ रक्तवस्त्रा महाविद्या
    महादेवी तु शाङ्करी । प्रयच्छतु ममाभीष्टान् सर्वदा भुवनेश्वरी ॥ १६॥ रक्तपा सा करालास्या विरूपा विकटानना
    । भैरवी चण्डिका देवी चण्डमुण्डविनाशिनी ॥ १७॥ योगिनीवृन्दघोरैश्च सदापूज्या जयप्रदा । मुण्डमालावृताङ्गी
    सा प्रसन्ना भैरवी भवेत् ॥ १८॥ चितावह्निसमारूढा पापौघदुर्विदारिणी । कौशिकी वसुधा तीव्रा भैरवी चापराजिता
    ॥ १९॥ सुरासुराराधिता च निजभक्तार्तिनाशिनी । भैरवी पञ्चमी विद्या सर्वतः परिपातु माम् ॥ २०॥ छिन्नमस्ताद्भुता
    घोरा सुमेधर्षिसुपूजिता । स्वरक्तपा विशालाक्षी वस्त्रहीना महाभुजा ॥ २१॥ त्यागवात्सल्यसम्पूर्णा शत्रुनाशार्थतत्परा
    । मनोजवप्रियारूढा कृष्णा भीमा जयामरा ॥ २२॥ वेतालगणसाम्राज्ञी प्रज्ञावर्धनकारिणी । खट्वाङ्गमुण्डधारिण्यै
    विशीर्षायै नमो नमः ॥ २३॥ कुण्डली कुण्डलेशानी जयादियोगिनीवृता । छिन्नशीर्षा सदा पातु महाभोगप्रदायिनी
    ॥ २४॥ वृद्धा धूम्रा शूर्पहस्ता प्रचण्डभीमविक्रमा । विरूपा कुटिला तीक्ष्णा श्वेतकेशी भयङ्करी ॥ २५॥
    यस्या जपेन होमेन स्मरणेनैव चेदपि । नश्यन्ति शत्रवः सर्वे तथा दुरितनाशनम् ॥ २६॥ गर्दभासनसंरूढा दरिद्रा
    भोगनाशिनी । ज्येष्ठालक्ष्मीस्तथा धूमावती आपन्निवारिणी ॥ २७॥ विश्वरूपां रिपुध्वंसकारिणीं क्लेशहारिणीम्
    । सर्वभूतनियन्त्रीं तां धूमादेवीं नमाम्यहम् ॥ २८॥ विष्णोः संहारिकाशक्तिर्बगलेति प्रचक्षते । शत्रुनाशाय
    वन्दे तामच्युतां बगलामुखीम् ॥ २९॥ पीताम्बरा पीतवर्णा पीतपुष्पोपशोभिता । स्तम्भिनी द्राविणी चैव बगले
    त्वां नतोऽस्म्यहम् ॥ ३०॥ प्रेतासनोपसंविष्टा हरिद्राकेतकीप्रिया । सुधासमुद्रद्वीपस्था तत्र सन्त्रासयन्
    रिपून् ॥ ३१॥ षट्कर्मसिद्धिदां देवीं कोमलां भीमविक्रमाम् । स्वर्णवर्णां स्वयन्तेजां तां नमाम्यहमादरात्
    ॥ ३२॥ मातङ्गी नवमी विद्या मतङ्गमुनिपूजिता । गजारूढा मत्तचित्ता मधुपा चित्तमोहिनी ॥ ३३॥ मधूकपुष्पसम्पूज्या
    योगदा भोगदा जया । काकपक्षकिरीटाङ्गी रक्ताभरणलङ्कृता ॥ ३४॥ बुद्ध्यहङ्कारचित्तादीन्मोहयित्वा हसन्मुखी
    । सा निजेच्छानुसारेण भ्रामयत्येव मायया ॥ ३५॥ मनुराज्यप्रदा मन्दहासा मन्देहनाशिनी । मातङ्गी विश्वजननी
    प्रसन्ना स्यान्ममोपरि ॥ ३६॥ भार्गवी सिन्धुसम्भूता कमलासनसंस्थिता । शक्रादिभिः पूजिता च श्रीदेवी विष्णुवल्लभा
    ॥ ३७॥ उलूकासनसंरूढा यातुलैश्वर्यदायिनी । केशवार्द्धासनगता रक्तवस्त्रा शुचिस्मिता ॥ ३८॥ दशमी कमला विद्या
    सर्वार्थपरिपालिनी । सिन्धुजा अरुणा भद्रा पद्मपुष्पविलासिनी ॥ ३९॥ चन्द्रप्रभा कर्दमाम्बा स्वर्णवृष्टिकरी
    सदा । श्रीविद्या परमेशानी दारिद्र्यात्त्राहि वेगतः ॥ ४०॥ दाक्षायणीदेहसमाश्रितास्तथा दशाकृती रूपगुणैर्विभाजिताः
    । ताः सर्वविद्याः प्रणमाम्यहं सदा यच्छन्तु मह्यं हृदि पूर्ववाञ्छितम् ॥ ४१॥ नगेन्द्रजा पार्वती च अपर्णा
    शिवरागिणी । गणेशजननी देवि शैलपुत्री सदावतु ॥ ४२॥ शिवा शिवप्रिया चैकवीरा योगीन्द्रपूजिता । कैलाशवासिनी
    देवी शैलजा परिरक्षतु ॥ ४३॥ ब्रह्मरूपा च वेदज्ञा श्रुतिसङ्घातकारिणी । सावित्री ब्रह्मविद्या सा परमा
    प्रकृति परा ॥ ४४॥ पराविद्यां परावाणीं परध्यानैकगामिनीम् । अक्षमालाङ्कुशधरां नमामि ब्रह्मचारिणीम् ॥
    ४५॥ शब्दब्रह्ममयी देवी ह्यक्षरा रावकारिणी । ॐकारेशी चतुर्वाणी चतुर्दिङ्कीर्तिविस्तरा ॥ ४६॥ चन्द्रघण्टां
    स्वयंशब्दां दैत्यकर्णविदारिणीम् । पूर्णेन्दुसमसौम्यां तां सर्वदां प्रणमाम्यहम् ॥ ४७॥ असङ्ख्यकोटिब्रह्माण्डसम्भूतिस्थितिकारिणी
    । कूष्माण्डा सा महामाया सर्वदा सुप्रसीदतु ॥ ४८॥ स्वोदरे विश्वमखिलं धारयन्तीं तु सर्वदा । विना श्रमेण
    वन्दे तां कूष्माण्डां विश्वधारिणीम् ॥ ४९॥ महासेनस्य जननी देवसैन्यप्रकाशिनी । सिंहारूढा विशालाक्षी
    सा नश्येद्दुरितं मम ॥ ५०॥ बालग्रहाभिभूतानां सर्वोपद्रवनाशिकाम् । सर्वाभीष्टप्रदां देवीं नमामि शम्भुवल्लभाम्
    ॥ ५१॥ मूलाधारस्थिते पद्मे चतुर्वर्णसमाश्रिता । कात्यायनी योगगम्या कल्याणं विदधातु मे ॥ ५२॥ मृगेन्द्रासनमारूढा
    कात्यायनतनूद्भवा । सर्वभूतनियन्त्री सा सर्वदा वरदा भवेत् ॥ ५३॥ गर्दभासनसंरूढा मुक्तकेशी महोदरी । चर्मशाटीं
    समावृत्य क्वचिद्वस्त्रैर्निरावृता ॥ ५४॥ कालस्य हारिणी भूतद्राविणी विकटानना । अजेया कालरात्रिः सर्वाशुभेभ्योऽभिरक्षतु
    ॥ ५५॥ वृषारूढा शशाङ्काङ्गा त्रिनेत्रा श्वेतवाससा । मन्दारपुष्पसम्पूज्या शूलटङ्कधरा शिवा ॥ ५६॥ महागौरीति
    सा ज्ञेया पूज्या कैवल्यदायिनी । विभ्रतीं ज्ञानमुद्राञ्च दासिष्ट ज्ञाननिर्मलम् ॥ ५७॥ चक्रेश्वरी राजविद्या
    गुह्या गोप्या सरस्वती । विबुधैर्वन्दिता दिव्यमाल्याम्बरधरा प्रिया ॥ ५८॥ योगीन्द्रवृन्दसंसेव्यां सर्वाभीष्टैकदायिनीम्
    । सर्वलोकस्तुतां सिद्धिदात्रीं तां प्रणमाम्यहम् ॥ ५९॥ निग्रह उवाच । इमां सर्वेश्वरीं विद्यां योऽधीते
    प्रत्यहं नरः । सर्वैश्वर्यमवाप्नोत्ययुतावृत्तिर्यदि कृता ॥ ६०॥ गुरुपुष्ये रविपुष्येऽमायां वापि निशागते
    । शक्तिपीठे सिद्धपीठे नवरात्रे विशेषतः ॥ ६१॥ प्राप्नोति द्रविणं ज्ञानं सन्ततिं प्रेयसीं तथा । अथवा
    मुक्तिमाप्नोति निष्कामो यदि सम्पठेत् ॥ ६२॥ निग्रहाचार्य ने कहा
