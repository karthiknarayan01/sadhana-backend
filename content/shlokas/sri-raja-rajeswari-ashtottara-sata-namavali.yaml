id: sri-raja-rajeswari-ashtottara-sata-namavali
category: stotram
name:
  english: Sri Raja Rajeswari Ashtottara Sata Namavali
content:
  english: om bhuvaneshvaryai namah | om rajeshvaryai namah | om rajarajeshvaryai namah | om kameshvaryai
    namah | om balatripurasundaryai namah | om sarveshvaryai namah | om kalyanyai namah | om sarvasankshobhinyai
    namah | om sarvalokasharirinyai namah | om saugandhikaparimalayai namah | | om mantrine namah | om
    mantrarupinyai namah | om prakrityai namah | om vikrityai namah | om adityai namah | om saubhagyavatyai
    namah | om padmavatyai namah | om bhagavatyai namah | om shrimatyai namah | om satyavatyai namah |
    | om priyakrityai namah | om mayayai namah | om sarvamangalayai namah | om sarvalokamohadhishanyai
    namah | om kinkaribhutagirvanyai namah | om parabrahmasvarupinyai namah | om puranagamarupinyai namah
    | om pancapranavarupinyai namah | om sarvagraharupinyai namah | om raktagandhakasturivilepyai namah
    | | om nayikayai namah | om sharanyayai namah | om nikhilavidyeshvaryai namah | om janeshvaryai namah
    | om bhuteshvaryai namah | om sarvasakshinyai namah | om kshemakarinyai namah | om punyayai namah
    | om sarvarakshinyai namah | om sakaladharminyai namah | | om vishvakarminyai namah | om suramunidevanutayai
    namah | om sarvalokaradhyayai namah | om padmasanasinayai namah | om yogishvaramanodhyeyayai namah
    | om caturbhujayai namah | om sarvarthasadhanadhishayai namah | om purvayai namah | om nityayai namah
    | om paramanandayai namah | | om kalayai namah | om anangayai namah | om vasundharayai namah | om
    shubhadayai namah | om trikalajnanasampannayai namah | om pitambaradharayai namah | om anantayai namah
    | om bhaktavatsalayai namah | om padapadmayai namah | om jagatkarinyai namah | | om avyayayai namah
    | om lilamanushavigrahayai namah | om sarvamayayai namah | om mrityunjayayai namah | om kotisuryasamaprabhayai
    namah | om pavitrayai namah | om pranadayai namah | om vimalayai namah | om mahabhushayai namah |
    om sarvabhutahitapradayai namah | | om padmalayayai namah | om sudhayai namah | om svangayai namah
    | om padmaragakiritinyai namah | om sarvapapavinashinyai namah | om sakalasampatpradayinyai namah
    | om padmagandhinyai namah | om sarvavighnakleshadhvamsinyai namah | om hemamalinyai namah | om vishvamurtyai
    namah | | om agnikalpayai namah | om pundarikakshinyai namah | om mahashaktyai namah | om buddhyai
    namah | om bhuteshvaryai namah | om adrishyayai namah | om shubhekshanayai namah | om sarvadharminyai
    namah | om pranayai namah | om shreshthayai namah | om shantayai namah | om tattvayai namah | om sarvajananyai
    namah | om sarvalokavasinyai namah | om kaivalyarekhinyai namah | om bhaktaposhanavinodinyai namah
    | om daridryanashinyai namah | om sarvopadravavarinyai namah | om samhridanandalaharyai namah | om
    caturdashantakonasthayai namah | | om sarvatmayai namah | om satyavaktre namah | om nyayayai namah
    | om dhanadhanyanidhyai namah | om kayakrityai namah | om anantajityai namah | om anantagunarupinyai
    namah | om sthireshvaryai namah | | iti shri rajarajeshvaryashtottarashatanamavalih ||
  devanagari: ॐ भुवनेश्वर्यै नमः । ॐ राजेश्वर्यै नमः । ॐ राजराजेश्वर्यै नमः । ॐ कामेश्वर्यै नमः । ॐ बालात्रिपुरसुन्दर्यै
    नमः । ॐ सर्वेश्वर्यै नमः । ॐ कल्याण्यै नमः । ॐ सर्वसङ्क्षोभिण्यै नमः । ॐ सर्वलोकशरीरिण्यै नमः । ॐ
    सौगन्धिकपरिमलायै नमः । । ॐ मन्त्रिणे नमः । ॐ मन्त्ररूपिण्यै नमः । ॐ प्रकृत्यै नमः । ॐ विकृत्यै नमः
    । ॐ अदित्यै नमः । ॐ सौभाग्यवत्यै नमः । ॐ पद्मावत्यै नमः । ॐ भगवत्यै नमः । ॐ श्रीमत्यै नमः । ॐ सत्यवत्यै
    नमः । । ॐ प्रियकृत्यै नमः । ॐ मायायै नमः । ॐ सर्वमङ्गलायै नमः । ॐ सर्वलोकमोहाधीशान्यै नमः । ॐ किङ्करीभूतगीर्वाण्यै
    नमः । ॐ परब्रह्मस्वरूपिण्यै नमः । ॐ पुराणागमरूपिण्यै नमः । ॐ पञ्चप्रणवरूपिण्यै नमः । ॐ सर्वग्रहरूपिण्यै
    नमः । ॐ रक्तगन्धकस्तुरीविलेप्यै नमः । । ॐ नायिकायै नमः । ॐ शरण्यायै नमः । ॐ निखिलविद्येश्वर्यै नमः
    । ॐ जनेश्वर्यै नमः । ॐ भूतेश्वर्यै नमः । ॐ सर्वसाक्षिण्यै नमः । ॐ क्षेमकारिण्यै नमः । ॐ पुण्यायै नमः
    । ॐ सर्वरक्षिण्यै नमः । ॐ सकलधर्मिण्यै नमः । । ॐ विश्वकर्मिण्यै नमः । ॐ सुरमुनिदेवनुतायै नमः । ॐ सर्वलोकाराध्यायै
    नमः । ॐ पद्मासनासीनायै नमः । ॐ योगीश्वरमनोध्येयायै नमः । ॐ चतुर्भुजायै नमः । ॐ सर्वार्थसाधनाधीशायै
    नमः । ॐ पूर्वायै नमः । ॐ नित्यायै नमः । ॐ परमानन्दायै नमः । । ॐ कलायै नमः । ॐ अनङ्गायै नमः । ॐ वसुन्धरायै
    नमः । ॐ शुभदायै नमः । ॐ त्रिकालज्ञानसम्पन्नायै नमः । ॐ पीताम्बरधरायै नमः । ॐ अनन्तायै नमः । ॐ भक्तवत्सलायै
    नमः । ॐ पादपद्मायै नमः । ॐ जगत्कारिण्यै नमः । । ॐ अव्ययायै नमः । ॐ लीलामानुषविग्रहायै नमः । ॐ सर्वमायायै
    नमः । ॐ मृत्युञ्जयायै नमः । ॐ कोटिसूर्यसमप्रभायै नमः । ॐ पवित्रायै नमः । ॐ प्राणदायै नमः । ॐ विमलायै
    नमः । ॐ महाभूषायै नमः । ॐ सर्वभूतहितप्रदायै नमः । । ॐ पद्मालयायै नमः । ॐ सुधायै नमः । ॐ स्वाङ्गायै
    नमः । ॐ पद्मरागकिरीटिण्यै नमः । ॐ सर्वपापविनाशिन्यै नमः । ॐ सकलसम्पत्प्रदायिन्यै नमः । ॐ पद्मगन्धिन्यै
    नमः । ॐ सर्वविघ्नक्लेशध्वंसिन्यै नमः । ॐ हेममालिन्यै नमः । ॐ विश्वमूर्त्यै नमः । । ॐ अग्निकल्पायै
    नमः । ॐ पुण्डरीकाक्षिण्यै नमः । ॐ महाशक्त्यै नमः । ॐ बुद्ध्यै नमः । ॐ भूतेश्वर्यै नमः । ॐ अदृश्यायै
    नमः । ॐ शुभेक्षणायै नमः । ॐ सर्वधर्मिण्यै नमः । ॐ प्राणायै नमः । ॐ श्रेष्ठायै नमः । ॐ शान्तायै नमः
    । ॐ तत्त्वायै नमः । ॐ सर्वजनन्यै नमः । ॐ सर्वलोकवासिन्यै नमः । ॐ कैवल्यरेखिन्यै नमः । ॐ भक्तपोषणविनोदिन्यै
    नमः । ॐ दारिद्र्यनाशिन्यै नमः । ॐ सर्वोपद्रववारिण्यै नमः । ॐ संहृदानन्दलहर्यै नमः । ॐ चतुर्दशान्तकोणस्थायै
    नमः । । ॐ सर्वात्मायै नमः । ॐ सत्यवक्त्रे नमः । ॐ न्यायायै नमः । ॐ धनधान्यनिध्यै नमः । ॐ कायकृत्यै
    नमः । ॐ अनन्तजित्यै नमः । ॐ अनन्तगुणरूपिण्यै नमः । ॐ स्थिरेश्वर्यै नमः । । इति श्री राजराजेश्वर्यष्टोत्तरशतनामावलिः
    ॥
