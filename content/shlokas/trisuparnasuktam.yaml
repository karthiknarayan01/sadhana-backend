id: trisuparnasuktam
category: sukta
name:
  english: trisuparnasuktam
  devanagari: त्रिसुपर्णसूक्तम्
content:
  english: sah shucishadvasurantarikshasaddhota vedishadatithirduronasat | nrishadvarasadritasadvyomasadabja
    goja ritaja adrija ritam brihat || 3|| rice tva rice tva samitsravanti sarito na dhenah | antarhrida
    manasa puyamanah | ghritasya dhara abhicakashimi || 4|| hiranyayo vetaso madhya asam | tasmintsuparno
    madhukrit kulayi bhajannaste madhu devatabhyah | tasyasate harayah sapta tire svadham duhana amritasya
    dharam || 5|| ya idam trisuparnamayacitam brahmanaya dadyat | virahatyam va ete ghnanti | ye brahmanastrisuparnam
    pathanti | te somam prapnuvanti | asahasrat panktim punanti | om || 6|| om sham no mitrah sham varunah
    | sham no bhavatyaryama | sham na indro brihaspatih | sham no vishnururukramah | namo brahmane | namaste
    vayo | tvameva pratyaksham brahmasi | tvameva pratyaksham brahmavadisham | ritamavadisham | satyamavadisham
    | tanmamavit | tadvaktaramavit | avinmam | avidvaktaram || om saha navavatu | saha nau bhunaktu |
    saha viryam karavavahai | tejasvi navadhitamastu | ma vidvishavahai || om shantih shantih shantih
    ||
  devanagari: सः शुचिषद्वसुरन्तरिक्षसद्धोता वेदिषदतिथिर्दुरोणसत् । नृषद्वरसदृतसद्व्योमसदब्जा गोजा ऋतजा
    अद्रिजा ऋतं बृहत् ॥ ३॥ ऋचे त्वा ऋचे त्वा समित्स्रवन्ति सरितो न धेनाः । अन्तर्हृदा मनसा पूयमानाः ।
    घृतस्य धारा अभिचाकशीमि ॥ ४॥ हिरण्ययो वेतसो मध्य आसाम् । तस्मिन्त्सुपर्णो मधुकृत् कुलायी भजन्नास्ते
    मधु देवताभ्यः । तस्यासते हरयः सप्त तीरे स्वधां दुहाना अमृतस्य धाराम् ॥ ५॥ य इदं त्रिसुपर्णमयाचितं
    ब्राह्मणाय दद्यात् । वीरहत्यां वा एते घ्नन्ति । ये ब्राह्मणास्त्रिसुपर्णं पठन्ति । ते सोमं प्राप्नुवन्ति
    । आसहस्रात् पङ्क्तिं पुनन्ति । ॐ ॥ ६॥ ॐ शं नो मित्रः शं वरुणः । शं नो भवत्यर्यमा । शं न इन्द्रो बृहस्पतिः
    । शं नो विष्णुरुरुक्रमः । नमो ब्रह्मणे । नमस्ते वायो । त्वमेव प्रत्यक्षं ब्रह्मासि । त्वामेव प्रत्यक्षं
    ब्रह्मावादिषम् । ऋतमवादिषम् । सत्यमवादिषम् । तन्मामावीत् । तद्वक्तारमावीत् । आवीन्माम् । आवीद्वक्तारम्
    ॥ ॐ सह नाववतु । सह नौ भुनक्तु । सह वीर्यं करवावहै । तेजस्वि नावधीतमस्तु । मा विद्विषावहै ॥ ॐ शान्तिः
    शान्तिः शान्तिः ॥
