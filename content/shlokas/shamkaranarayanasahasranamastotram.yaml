id: shamkaranarayanasahasranamastotram
category: sahasranama
name:
  english: shamkaranarayanasahasranamastotram
  devanagari: शंकरनारायणसहस्रनामस्तोत्रम्
content:
  english: om shankarah shridharah shridah shrikarah shridabandhavah | shrivatsakaustubhadharah shrinathangaparishkritah
    || 1|| shrisadopasyapadabjah shrinidhih shrivibhavanah | shrikanthah shashvatah shantah sharngi sharvahshubhodayah
    || 2|| shashankashekharah shyamah shuli shankhadharah shivah | shucih shucikarah shriman sharanagatapalakah
    || 3|| shipivishtah shivanutah sheshashayi shubhankarah | shivetaraghnah shantatma shantidah shaktibhritpita
    || 4|| shrutigamyashyatadhritih shatanandah shrutisthitih | shambararipita shurah shasitasheshapatakah
    || 5|| shabarah shivadah shishtah shishteshtah shishtarakshakah | sharanyah sharajanmatma shashankarnyarkakotibhah
    || 6|| sharvarishadharah shaurih shishirah shrotriyapriyah | shambhuh shakrartiharanah shailavasah
    shucismitah || 7|| shivarambhah shivatamah sharabhah shaishavakritih | sharadghanasamacchayah shishupalashiroharah
    || 8|| shadaksharatma patkonah sudarshanakarambujah | shadbhavadharmarahitah padgunaishvaryasamyutah
    || 9|| shadangarupi patkoshah shattrimshah shanmukhashrayah | shodashastripriyah padjapramukhah svararanjitah
    || 10|| padvimshakah shadadharanilayah patkalatmakah | sarvajnah sarvagah sakshi sarvapujyah sureshvarah
    || 11|| sarvagah sarvabhritsarvah sarveshah sarvashaktiman | sarvadharah sarvasarah sarvatma sarvabhavanah
    || 12|| sarvavasah sarvashasta sarvadriksarvatomukhah | sarvajit sarvatobhadrah sarvarthah sarvaduhkhaha
    || 13|| sarvanandassarvarupah sarangah sarvakaranah | sarvatishayi sutratma sutrakrit sadgunahsukhi
    || 14|| sukshmah saudaminikantah sindhushayi sanatanah | sankarshanah surasakhah svarnadijanakah svarat
    || 15|| sevyasevitapadabjah satyagopta sadatmakah | sampatpradah samah satyasankalpah satyakamaha
    || 16|| satyasandhah satyarupi satyavedyassadagatih | sthanuh satyeshvarah sthulah sthavishthah subhagah
    sthirah || 17|| samudrah sammatah svami sarvapatakabhanjanah | smritaghahari saubhagyadayakah sadasatpatih
    || 18|| svarnadhyakshah svarnabhushah svahakarah sudhakarah | sandhyarunajatajutah samsararnavatarakah
    || 19|| stutyah sabhapatih svasthah sudhamshuravilocanah | sarasiruhamadhyasthah sundarah sundarishvarah
    || 20|| sudhakumbhadharassomah sarvavyapi sadashivah | sarvavedantasamvedyah sushilah sadhukirtidah
    || 21|| sudarshanah sukhakarah sumanah suryatapanah | sambassomadharah saumyah sambhavyah svastikrit
    svarah || 22|| sahasrashirsha sumukhah sahasrakshah sahasrapat | svabhaktajanakalyanah sarvalokeshvareshvarah
    || 23|| suvarnah suryabimbasthah satyah samvatsaratmakah | sarvastradhari sangramavijayi sarvashastravit
    || 24|| sahasrabahuh sarasah sarvasatvavalambanah | svabhuh sitapatih surih sarvashastrarthakovidah
    || 25|| svabhavodaracaritah saccidanandavigrahah | sarisripendrakatakah surendratmajasarathih || 26||
    sarvamsahah sarvadhama sanakadimuniditah | smararih smeravadanah srishtisthityantakaranah || 27||
    sairandhripujitapadah samaganadhikapriyah | sindhurendrajinadharah sirapanih samiranah || 28|| sadgatih
    sangarahitah sadhukrit satpatishvarah | hamso harihhayarudho hrishikesho havishpatih || 29|| hiranyagarbhabhurhota
    havirbhokta hiranmayah | harikesho harohari havyavaho harishvarah || 30|| haryaksharupi hitakrit hayagrivo
    hatantakah | haritpalo hiranyaksharipurhariharatmakah || 31|| hastindravarado hamsavahano harinankadhrik
    | hemamshuko hemamali hemango hemakundalah || 32|| halahalankitagaḻo hali hanivivarjitah | ḻapancalakshabhutesho
    ḻaptejovayukheshvarah || 33|| kshamabhrit kshapanah kshemah kshetrajnah kshetranayakah | kshaumambarah
    kshaudravakca kshaḻitaghah kshitishvarah || 34|| kshemankarah kshveḻaharah kshirambunidhiketanah |
    anantalakshanonantos nishos nihos vyayoparah || 35|| atindriyo bhayoscintyoscalodbhuta parakramah
    | animadigunadharosgraganyoscintyashaktiman || 36|| abhiramosnavadyangosnirdeshyosmritavigrahah |
    ajodritanayanathosprameyosmita vikramah || 37|| asheshadevatanatho ghorosvidyadhinashanah | apratarkyoparicchedyojatah
    shatruranamayah || 38|| anadimadhyanidhanosnangashatruradhokshajah | akalmashobhirupobhiramosnarghya
    gunoscyutah || 39|| akaradikshakarantamatrikavitavigrahah | anandarupa ananda anandaghana ashrayah
    || 40|| aradhya ayatapanga apannartivinashanah | indradidevatadhisha ishtapurtiphalapradah || 41||
    itihasapuranajna icchashaktiparayanah | iḻapatiriḻanatha indirajanirindubhah || 42|| indivaradaḻashyama
    iddhateja ibhananah | isha ishvara ishana itibhitinivaranah || 43|| ikshakritajagatsrishtiridya ihavivarjitah
    | utkrishtashaktirutkrishta uditambaramarganah || 44|| upendra uragakalpa utpattisthitinashakrit |
    umapatiradaranga ushna utpattivarjitah || 45|| ushnamshurujvalaguna unnatamsa urukramah | upaplavabhidudgitha
    umapriya udadravah || 46|| utsahashaktiruddamakirtiruddhritabhudharah | urdhvareta urdhvapadah urvikritacaracarah
    || 47|| riddhikarta ritukaro rinatrayavimocanah | rigyajuhsamavedatma rijumargapradarshanah || 48||
    eka ekantanilaya ejitasheshapatakah | enankacuda ekatma edhaniyassukhakarah || 49|| ainkara aishvaryakara
    aihikamushmikapradah | onkaramurtironkara onkararthaprakashakah || 50|| audaryanidhiraunnatyaprada
    aushadhanayakah | ambikapatirambhojadrigambujasamadyutih || 51|| anjanasutasenavyanghrirandhakashnongadashrayah
    | ambaratmanganartha0go ambarishavarapradah || 52|| asthimalokshayanidhirashtaishvaryapradoksharah
    | ashtangayogasadhyoshtamurtirashtavasustutah || 53|| kapardi kaustubhadharah kalakalah kalanidhih
    | karpuradhavaḻah krishnah kapali kamsamardanah || 54|| kailasavasi kamathah krittivasah kripanidhih
    | kameshah keshavah kulyah kaivalyaphaladayakah || 55|| kuberabandhuh kaunteyasarathih kanakarcitah
    | kaitabharih kratudhvamsi kratubhukkratupalakah || 56|| kalpaharahitah karta karmabandhaharah kritih
    | kodandapanih kavaci kundalikaḻabhushanah || 57|| kiratavigrahah kalki kinkinijalabhushanah | kausheyavasanah
    krantah kushalah kirtivardhanah || 58|| krishanuretah kaḻiyabhanjanah ksheshanashanah | kadambavasi
    kalyanadayi kamalalocanah || 59|| kupyah kukshisthabhuvanah krantasheshacaracarah | kotivaishravanashridah
    kotimanmathasundarah || 60|| kotindujagadanandi kotibrahmandapalakah | kotisuryapratikashah kotiyajna
    samahvayuh || 61|| kotibrahmasrigaishvaryah kotishaktiparivritah | khandendushekharah khandi khatvangi
    khagavahanah || 62|| khyatitah khyatiman khasthah khecarah khecareditah | khararih khandaparashuh
    khandendunitilojvalah || 63|| khanditapranataghaughah khedahrit khetakayudhah | gangadharo giridharo
    giridhvani gadadharah || 64|| gangaprabodho govindo gaurisho garudadhvajah | girisho gopatirgopta
    gomanto gokshigauravah || 65|| govardhanadharo gopyo giribandhurguhashrayah | gambhiro gaganakaro
    gadyapadyaparishkritah || 66|| gariyan gramanirganyo gopalo godhanapradah | gururganapriyo goshthi
    gunatito gunagranih || 67|| gayatrivallabho geyo gandharvakulavanditah | grahapidaharo godho gatibhrashtagatipadah
    || 68|| ghanaghano ghanashyamo ghantakarnavarapradah | ghantavibhushano ghoro ghasmaro ghasrinantakah
    || 69|| ghrinirghrinanidhirghosho ghatitakhilapatakah | ghurnitasheshabhuvano ghatakesho ghritapriyah
    || 70|| nantasarasvaramayo nantasamarthatatvavit | candrapidashcandrapanih candrakantashcaturbhujah
    || 71|| caracarapita candashcandishashcandavikramah | cidrupashcetanadhishashcintitarthapradayakah
    || 72|| cirantanashciraradhyashcitraveshashcidambarah | cidghanashcinmayashcitrah cidanandashcidambudhih
    || 73|| candrayudhashcandramukhashcandrikadhavaḻasmitah | citrabhanushcitrarupah citraviryashcaracarah
    || 74|| citrakarmashcitragatih candrashcanuramardanah | caturah caturasyedyah caturvargaphalapradah
    || 75|| carvangashcarvanaparashcarucandanacarcitah | camikaragrihantasthashcamaranilasevitah || 76||
    cintamanishchinnatapashcurnitapanmahacalah | chandomayah chinnapashah chandogashchinnasamshayah ||
    77|| cheditasurashastrastrah cheditakhilapatakah | chaditatmaprabhavashca chatrikritaphanishvarah
    || 78|| jagaddharta jagadbharta jagajjyeshtho janardanah | jagatprano jagadbhavyo jagajyotirjaganmayah
    || 79|| jagadbhandhurjagatsakshi jagadadirjagatpatih | janhujalankritajato jahnavijanako jayah ||
    80|| jaitro jalandharaharo jaramrityu nivaranah | janakivallabho jeta jitakrodho jitendriyah || 81||
    jitatma jitapanceshurjitasurjiviteshvarah | jadyahari janmaharo jyotirmurtirjaleshvarah || 82|| jhallarivadyamudito
    jhashaketanadarpaha | jnanagamyo jnanapalo jnanatma jnanasagarah || 83|| jnatrijnanashleyarupo jnanado
    jnanadipakah | tankakshasutrahastabjashtankikritarasatalah || 84|| thakarayuktamantredyashtantamantraprasadakah
    | damaruvyasahastagro dimbikasuranashanah || 85|| dakiniganasamvito dolakhelanalalasah | dindirapunjadhavaḻo
    dindimadhvanisevitah || 86|| dhakkaninadasamprito dundhivighneshapujitah | napancalakshasamprito nantavyakaranarthavit
    || 87|| trigunatma trikalajnastripurarivikramah | trilocanastirthapadastrilokeshastrayimayah || 88||
    trayivedyastrayishvasastrishuli tarkshyaketanah | tejomandaladurdharshastapatrayanivaranah || 89||
    stutyah stotrapriyastushtastapastomaphalapradah | tapanastapasastapahari tapasavallabhah || 90|| tarakastatankaratistarakabrahmamantravit
    | thabijamantrasantushtasthavarnapratipadakah || 91|| durvasa daupadivandyo duhkhabdi badabanalah
    | daityarirdakshinamurtirdugdhambhonidhisamshrayah || 92|| daridryavanadavagnirdattatreyo durasadah
    | devadevo dridhaprajnodanto durlabhadarshanah || 93|| damodaro danashilo dayaḻurdinavatsalah | daksho
    dakshadhvaradhvamsi duhshasanakulantakah || 94|| durantamahima duro dushparo dushtradharshanah | durjneyo
    durjayo dirghabahurdushtanibarhanah || 95|| digisho ditisampujyo digvasa divishaspatih | dashakanthasurashrenipujitanghrisaroruhah
    || 96|| dandakaranyasancari dandapanisamarcitah | danditasuradordando dashashcandananandanah || 97||
    daharakashamadhyastho dehakridbhayanashanah | darahaso dayamurtirdivyakirtirdivaspatih || 98|| dhyanagamyo
    dhyeyamurtirdhyanatito dhurandharah | dhanvi dharmo dhanadhyaksho dhyatripapanishudanah || 99|| dhrishtirdhritiprado
    dhata dharmiko dharmapalakah | dhurjatirdhenukaripurdhatturakusumapriyah || 100|| dhushpatirdhutapapaugho
    dhanado dhanyasevitah | natesho natyakushalo nilakantho niramayah || 101|| nityado nityasantushto
    nityanando nirashrayah | nirvikaro niradharo nishprapanco niruttarah || 102|| niranjano nirvikalpo
    nirlepo nirupadravah | naro niyantrakalyano narasimho nareshtadah || 103|| narayano naradhisho nivrittatmanigudhagah
    | nandisho nandatanayo nakesho narakantakah || 104|| pinaki pankajakarah purnah purnarthakarakah |
    puranapurushah punyah patuh pashupatih parah || 105|| priyamvadah priyakarah pranavah pranavarthakah
    | paramatma parabrahma paranjyotih parantapah || 106|| pararthah paramarthajnah paratattvavabodhakah
    | paranandah paravyaktah parandhama parodayah || 107|| padmarcitah padmanabhah padmeshah padmabandhavah
    | pareshah parthavaradah pashupashavimocakah || 108|| parvatishah pitavasah purandarasurarcitah |
    pundarikajinadharah pundarikadaḻekshanah || 109|| pundarikapuradhyakshah pundarikasamaprabhah | punyashilah
    punyakirtih punyagamyah purantakah || 110|| putanajivitaharah putanama puratanah | phanibhushah phanipatih
    phanikundalamanditah || 111|| phanindrashayi phalakshah phalabhuk phaladayakah | brahmangaha balidhvamsi
    brahmavid brahmavittamah || 112|| brahmajyotirbrahmakritih brahmanyo brahmavanditah | brahmendravarado
    brahmaparago brahmavatsalah || 113|| brahmandavigraho brahma brihattejo brihattapah | bahushaktirbalarupo
    balonmathirbalotkatah || 114|| bandhuro banavarado budhyo bodhatmako budhah | bhago bhutapatirbhimo
    bhishmamuktiprado bhavah || 115|| bhagyado bhagavan bhogi bhavo bhitabhayapahah | bhaganetraharo bhadro
    bhasmoddhuḻitavigrahah || 116|| bhasmashayi bhavanisho bhutatma bhutanayakah | bhargavo bhargavaguruh
    bhuktimuktiphalapradah || 117|| bhavapriyo bhavadveshi bhokta bhuvanapalakah | maheshvaro mahayogi
    mahaviro mahamanah || 118|| mahakarma mahakirtirmahauja mahimoddhatah | mahaushadhirmahibharta mahodaro
    mahamatih || 119|| mahanando mahapunyo mahabhagyo mahagunah | maharatho mahadhanvi mahavidyo mahodayah
    || 120|| 120|| mahapatakavidhvamsi mahoragavarapradah | mahalingo mahasha
  devanagari: ॐ शङ्करः श्रीधरः श्रीदः श्रीकरः श्रीदबान्धवः । श्रीवत्सकौस्तुभधरः श्रीनाथाङ्गपरिष्कृतः ॥
    १॥ श्रीसदोपास्यपादाब्जः श्रीनिधिः श्रीविभावनः । श्रीकण्ठः शाश्वतः शान्तः शार्ङ्गी शर्वःशुभोदयः ॥ २॥
    शशाङ्कशेखरः श्यामः शूली शङ्खधरः शिवः । शुचिः शुचिकरः श्रीमान् शरणागतपालकः ॥ ३॥ शिपिविष्टः शिवनुतः
    शेषशायी शुभङ्करः । शिवेतरघ्नः शान्तात्मा शान्तिदः शक्तिभृत्पिता ॥ ४॥ श्रुतिगम्यश्यतधृतिः शतानन्दः
    श्रुतिस्थितिः । शम्बरारिपिता शूरः शासिताशेषपातकः ॥ ५॥ शबरः शिवदः शिष्टः शिष्टेष्टः शिष्टरक्षकः । शरण्यः
    शरजन्मात्मा शशाङ्कर्न्यर्ककोटिभः ॥ ६॥ शर्वरीशधरः शौरिः शिशिरः श्रोत्रियप्रियः । शम्भुः शक्रार्तिहरणः
    शैलावासः शुचिस्मितः ॥ ७॥ शिवारम्भः शिवतमः शरभः शैशवाकृतिः । शरद्घनसमच्छायः शिशुपालशिरोहरः ॥ ८॥ षडक्षरात्मा
    पट्कोणः सुदर्शनकराम्बुजः । षड्भावधर्मरहितः पड्गुणैश्वर्यसंयुतः ॥ ९॥ षडङ्गरूपी पट्कोशः षट्त्रिंशः षण्मुखाश्रयः
    । षोडशस्त्रीप्रियः पड्जप्रमुखः स्वररञ्जितः ॥ १०॥ पड्विंशकः षडाधारनिलयः पट्कलात्मकः । सर्वज्ञः सर्वगः
    साक्षी सर्वपूज्यः सुरेश्वरः ॥ ११॥ सर्वगः सर्वभृत्सर्वः सर्वेशः सर्वशक्तिमान् । सर्वाधारः सर्वसारः
    सर्वात्मा सर्वभावनः ॥ १२॥ सर्वावासः सर्वशास्ता सर्वदृक्सर्वतोमुखः । सर्वजित् सर्वतोभद्रः सर्वार्थः
    सर्वदुःखहा ॥ १३॥ सर्वानन्दस्सर्वरूपः सारङ्गः सर्वकारणः । सर्वातिशायी सूत्रात्मा सूत्रकृत् सद्गुणःसुखी
    ॥ १४॥ सूक्ष्मः सौदामिनीकान्तः सिन्धुशायी सनातनः । सङ्कर्षणः सुरसखः स्वर्णदीजनकः स्वराट् ॥ १५॥ सेव्यसेवितपादाब्जः
    सत्यगोप्ता सदात्मकः । सम्पत्प्रदः समः सत्यसङ्कल्पः सत्यकामहा ॥ १६॥ सत्यसन्धः सत्यरूपी सत्यवेद्यस्सदागतिः
    । स्थाणुः सत्येश्वरः स्थूलः स्थविष्ठः सुभगः स्थिरः ॥ १७॥ समुद्रः सम्मतः स्वामी सर्वपातकभञ्जनः । स्मृताघहारी
    सौभाग्यदायकः सदसत्पतिः ॥ १८॥ स्वर्णाध्यक्षः स्वर्णभूषः स्वाहाकारः सुधाकरः । सन्ध्यारुणजटाजूटः संसारार्णवतारकः
    ॥ १९॥ स्तुत्यः सभापतिः स्वस्थः सुधांशुरविलोचनः । सरसीरुहमध्यस्थः सुन्दरः सुन्दरीश्वरः ॥ २०॥ सुधाकुम्भधरस्सोमः
    सर्वव्यापी सदाशिवः । सर्ववेदान्तसंवेद्यः सुशीलः साधुकीर्तिदः ॥ २१॥ सुदर्शनः सुखकरः सुमनाः सूर्यतापनः
    । साम्बस्सोमधरः सौम्यः सम्भाव्यः स्वस्तिकृत् स्वरः ॥ २२॥ सहस्रशीर्षा सुमुखः सहस्राक्षः सहस्रपात् ।
    स्वभक्तजनकल्याणः सर्वलोकेश्वरेश्वरः ॥ २३॥ सुवर्णः सूर्यबिम्बस्थः सत्यः संवत्सरात्मकः । सर्वास्त्रधारी
    सङ्ग्रामविजयी सर्वशास्त्रवित् ॥ २४॥ सहस्रबाहुः सरसः सर्वसत्वावलम्बनः । स्वभूः सीतापतिः सूरिः सर्वशास्त्रार्थकोविदः
    ॥ २५॥ स्वभावोदारचरितः सच्चिदानन्दविग्रहः । सरीसृपेन्द्रकटकः सुरेन्द्रात्मजसारथिः ॥ २६॥ सर्वंसहः सर्वधामा
    सनकादिमुनीडितः । स्मरारिः स्मेरवदनः सृष्टिस्थित्यन्तकारणः ॥ २७॥ सैरन्ध्रीपूजितपदः सामगानाधिकप्रियः
    । सिन्धुरेन्द्राजिनधरः सीरपाणिः समीरणः ॥ २८॥ सद्गतिः सङ्गरहितः साधुकृत् सत्पतीश्वरः । हंसो हरिःहयारूढो
    हृषीकेशो हविष्पतिः ॥ २९॥ हिरण्यगर्भभूर्होता हविर्भोक्ता हिरण्मयः । हरिकेशो हरोहारी हव्यवाहो हरीश्वरः
    ॥ ३०॥ हर्यक्षरूपी हितकृत् हयग्रीवो हतान्तकः । हरित्पालो हिरण्याक्षरिपुर्हरिहरात्मकः ॥ ३१॥ हस्तीन्द्रवरदो
    हंसवाहनो हरिणाङ्कधृक् । हेमांशुको हेममाली हेमाङ्गो हेमकुण्डलः ॥ ३२॥ हालाहलाङ्कितगळो हली हानिविवर्जितः
    । ळपञ्चलक्षभूतेशो ळाप्तेजोवायुखेश्वरः ॥ ३३॥ क्षमाभृत् क्षपणः क्षेमः क्षेत्रज्ञः क्षेत्रनायकः । क्षौमाम्बरः
    क्षौद्रवाक्च क्षाळिताघः क्षितीश्वरः ॥ ३४॥ क्षेमङ्करः क्ष्वेळहरः क्षीराम्बुनिधिकेतनः । अनन्तलक्षणोनन्तोस्
    नीशोस् नीहोस् व्ययोपरः ॥ ३५॥ अतीन्द्रियो भयोस्चिन्त्योस्चलोद्भुत पराक्रमः । अणिमादिगुणाधारोस्ग्रगण्योस्चिन्त्यशक्तिमान्
    ॥ ३६॥ अभिरामोस्नवद्याङ्गोस्निर्देश्योस्मृतविग्रहः । अजोद्रितनयानाथोस्प्रमेयोस्मित विक्रमः ॥ ३७॥ अशेषदेवतानाथो
    घोरोस्विद्याधिनाशनः । अप्रतर्क्योपरिच्छेद्योजातः शत्रुरनामयः ॥ ३८॥ अनादिमध्यनिधनोस्नङ्गशत्रुरधोक्षजः
    । अकल्मषोभिरूपोभिरामोस्नर्घ्य गुणोस्च्युतः ॥ ३९॥ अकारादिक्षकारान्तमातृकावीतविग्रहः । आनन्दरूप आनन्द
    आनन्दघन आश्रयः ॥ ४०॥ आराध्य आयतापाङ्ग आपन्नार्तिविनाशनः । इन्द्रादिदेवताधीश इष्टापूर्तिफलप्रदः ॥ ४१॥
    इतिहासपुराणज्ञ इच्छाशक्तिपरायणः । इळापतिरिळानाथ इन्दिराजानिरिन्दुभाः ॥ ४२॥ इन्दीवरदळश्याम इद्धतेजा
    इभाननः । ईश ईश्वर ईशान ईतिभीतिनिवारणः ॥ ४३॥ ईक्षाकृतजगत्सृष्टिरीड्य ईहाविवर्जितः । उत्कृष्टशक्तिरुत्कृष्ट
    उदिताम्बरमार्गणः ॥ ४४॥ उपेन्द्र उरगाकल्प उत्पत्तिस्थितिनाशकृत् । उमापतिरादाराङ्ग उष्ण उत्पत्तिवर्जितः
    ॥ ४५॥ उष्णांशुरुज्वलगुण उन्नतांस उरुक्रमः । उपप्लवभिदुद्गीथ उमाप्रिय उदद्रवः ॥ ४६॥ उत्साहशक्तिरुद्दामकीर्तिरुद्धृतभूधरः
    । ऊर्ध्वरेता ऊर्ध्वपदः ऊर्वीकृतचराचरः ॥ ४७॥ ऋद्धिकर्ता ऋतुकरो ऋणत्रयविमोचनः । ऋग्यजुःसामवेदात्मा ऋजुमार्गप्रदर्शनः
    ॥ ४८॥ एक एकान्तनिलय एजिताशेषपातकः । एणाङ्कचूड एकात्मा एधनीयस्सुखाकरः ॥ ४९॥ ऐङ्कार ऐश्वर्यकर ऐहिकामुष्मिकप्रदः
    । ओङ्कारमूर्तिरोङ्कार ओङ्कारार्थप्रकाशकः ॥ ५०॥ औदार्यनिधिरौन्नत्यप्रद औषधनायकः । अम्बिकापतिरम्भोजदृगम्बुजसमद्युतिः
    ॥ ५१॥ अञ्जनासुतसेनव्याङ्घ्रिरन्धकष्नोङ्गदाश्रयः । अम्बरात्माङ्गनार्था०गो अम्बरीषवरप्रदः ॥ ५२॥ अस्थिमालोक्षयनिधिरष्टैश्वर्यप्रदोक्षरः
    । अष्टाङ्गयोगसाध्योष्टमूर्तिरष्टवसुस्तुतः ॥ ५३॥ कपर्दी कौस्तुभधरः कालकालः कलानिधिः । कर्पूरधवळः कृष्णः
    कपाली कंसमर्दनः ॥ ५४॥ कैलासवासी कमठः कृत्तिवासः कृपानिधिः । कामेशः केशवः कुल्यः कैवल्यफलदायकः ॥ ५५॥
    कुबेरबन्धुः कौन्तेयसारथिः कनकार्चितः । कैटभारिः क्रतुध्वंसी क्रतुभुक्क्रतुपालकः ॥ ५६॥ कल्पहारहितः
    कर्ता कर्मबन्धहरः कृतिः । कोदण्डपाणिः कवची कुण्डलीकळभूषणः ॥ ५७॥ किरातविग्रहः कल्की किङ्किणीजालभूषणः
    । कौशेयवसनः क्रान्तः कुशलः कीर्तिवर्धनः ॥ ५८॥ कृशानुरेताः काळीयभञ्जनः क्षेशनाशनः । कदम्बवासी कल्याणदायी
    कमललोचनः ॥ ५९॥ कुप्यः कुक्षिस्थभुवनः क्रान्ताशेषचराचरः । कोटिवैश्रवणश्रीदः कोटिमन्मथसुन्दरः ॥ ६०॥
    कोटीन्दुजगदानन्दी कोटिब्रह्माण्डपालकः । कोटिसूर्यप्रतीकाशः कोटियज्ञ समाह्वयुः ॥ ६१॥ कोटिब्रह्मसृगैश्वर्यः
    कोटिशक्तिपरीवृतः । खण्डेन्दुशेखरः खण्डी खट्वाङ्गी खगवाहनः ॥ ६२॥ ख्यातितः ख्यातिमान् खस्थः खेचरः खेचरेडितः
    । खरारिः खण्डपरशुः खण्डेन्दुनिटिलोज्वलः ॥ ६३॥ खण्डितप्रणताघौघः खेदहृत् खेटकायुधः । गङ्गाधरो गिरिधरो
    गिरिध्वनी गदाधरः ॥ ६४॥ गङ्गाप्रबोधो गोविन्दो गौरीशो गरुडध्वजः । गिरीशो गोपतिर्गोप्ता गोमान्तो गोक्षिगौरवः
    ॥ ६५॥ गोवर्धनधरो गोप्यो गिरिबन्धुर्गुहाश्रयः । गम्भीरो गगनाकारो गद्यपद्यपरिष्कृतः ॥ ६६॥ गरीयान् ग्रामणिर्गण्यो
    गोपालो गोधनप्रदः । गुरुर्गानप्रियो गोष्ठी गुणातीतो गुणाग्रणिः ॥ ६७॥ गायत्रीवल्लभो गेयो गन्धर्वकुलवन्दितः
    । ग्रहपीडाहरो गोधो गतिभ्रष्टगतिपदः ॥ ६८॥ घनाघनो घनश्यामो घण्टाकर्णवरप्रदः । घण्टाविभूषणो घोरो घस्मरो
    घसृणान्तकः ॥ ६९॥ घृणीर्घृणानिधिर्घोषो घातिताखिलपातकः । घूर्णिताशेषभुवनो घटकेशो घृतप्रियः ॥ ७०॥ ङान्तसारस्वरमयो
    ङान्तसामार्थतत्ववित् । चन्द्रपीडश्चन्द्रपाणिः चन्द्रकान्तश्चतुर्भुजः ॥ ७१॥ चराचरपिता चण्डश्चण्डीशश्चण्डविक्रमः
    । चिद्रूपश्चेतनाधीशश्चिन्तितार्थप्रदायकः ॥ ७२॥ चिरन्तनश्चिराराध्यश्चित्रवेषश्चिदम्बरः । चिद्घनश्चिन्मयश्चित्रः
    चिदानन्दश्चिदम्बुधिः ॥ ७३॥ चन्द्रायुधश्चन्द्रमुखश्चन्द्रिकाधवळस्मितः । चित्रभानुश्चित्ररूपः चित्रवीर्यश्चराचरः
    ॥ ७४॥ चित्रकर्माश्चित्रगतिः चन्द्रश्चाणूरमर्दनः । चतुरः चतुरास्येड्यः चतुर्वर्गफलप्रदः ॥ ७५॥ चार्वङ्गश्चर्वणपरश्चारुचन्दनचर्चितः
    । चामीकरगृहान्तस्थश्चामरानिलसेवितः ॥ ७६॥ चिन्तामणिश्छिन्नतपश्चूर्णितापन्महाचलः । छन्दोमयः छिन्नपाशः
    छन्दोगश्छिन्नसंशयः ॥ ७७॥ छेदितासुरशस्त्रास्त्रः छेदिताखिलपातकः । छादितात्मप्रभावश्च छत्रीकृतफणीश्वरः
    ॥ ७८॥ जगद्धर्ता जगद्भर्ता जगज्ज्येष्ठो जनार्दनः । जगत्प्राणो जगद्भाव्यो जगज्योतिर्जगन्मयः ॥ ७९॥ जगद्भन्धुर्जगत्साक्षी
    जगदादिर्जगत्पतिः । जन्हुजालङ्कृतजटो जाह्नवीजनको जयः ॥ ८०॥ जैत्रो जलन्धरहरो जरामृत्यु निवारणः । जानकीवल्लभो
    जेता जितक्रोधो जितेन्द्रियः ॥ ८१॥ जितात्मा जितपञ्चेषुर्जितासुर्जीवितेश्वरः । जाड्यहारी जन्महरो ज्योतिर्मूर्तिर्जलेश्वरः
    ॥ ८२॥ झल्लरीवाद्यमुदितो झषकेतनदर्पहा । ज्ञानगम्यो ज्ञानपालो ज्ञानात्मा ज्ञानसागरः ॥ ८३॥ ज्ञातृज्ञानश्लेयरूपो
    ज्ञानदो ज्ञानदीपकः । टङ्काक्षसूत्रहस्ताब्जष्टङ्कीकृतरसातलः ॥ ८४॥ ठकारयुक्तमन्त्रेड्यष्टान्तमन्त्रप्रसादकः
    । डमरुव्यसहस्ताग्रो डिम्बिकासुरनाशनः ॥ ८५॥ डाकिनीगणसंवीतो डोलाखेलनलालसः । डिण्डीरपुञ्जधवळो डिण्डिमध्वनिसेवितः
    ॥ ८६॥ ढक्कानिनादसंप्रीतो डुण्ढिविघ्नेशपूजितः । णपञ्चलक्षसंप्रीतो णान्तव्याकरणार्थवित् ॥ ८७॥ त्रिगुणात्मा
    त्रिकालज्ञस्त्रिपुरारिविक्रमः । त्रिलोचनस्तीर्थपादास्त्रिलोकेशस्त्रयीमयः ॥ ८८॥ त्रयीवेद्यस्त्रयीश्वासस्त्रिशूली
    तार्क्ष्यकेतनः । तेजोमण्डलदुर्धर्षस्तापत्रयनिवारणः ॥ ८९॥ स्तुत्यः स्तोत्रप्रियस्तुष्टस्तपस्तोमफलप्रदः
    । तपनस्तापसस्तापहारी तापसवल्लभः ॥ ९०॥ तारकस्ताटङ्कारातिस्तारकब्रह्ममन्त्रवित् । थबीजमन्त्रसन्तुष्टस्थवर्णप्रतिपादकः
    ॥ ९१॥ दुर्वासा दौपदीवन्द्यो दुःखाब्दि बडबानलः । दैत्यारिर्दक्षिणामूर्तिर्दुग्धाम्भोनिधिसंश्रयः ॥ ९२॥
    दारिद्र्यवनदावाग्निर्दत्तात्रेयो दुरासदः । देवदेवो दृढप्रज्ञोदान्तो दुर्लभदर्शनः ॥ ९३॥ दामोदरो दानशीलो
    दयाळुर्दीनवत्सलः । दक्षो दक्षाध्वरध्वंसी दुःशासनकुलान्तकः ॥ ९४॥ दुरन्तमहिमा दूरो दुष्पारो दुष्ट्रधर्षणः
    । दुर्ज्ञेयो दुर्जयो दीर्घबाहुर्दुष्टनिबर्हणः ॥ ९५॥ दिगीशो दितिसम्पूज्यो दिग्वासा दिविषस्पतिः । दशकण्ठासुरश्रेणिपूजिताङ्घ्रिसरोरुहः
    ॥ ९६॥ दण्डकारण्यसञ्चारी दण्डपाणिसमर्चितः । दण्डितासुरदोर्दण्डो दशश्चन्दननन्दनः ॥ ९७॥ दहराकाशमध्यस्थो
    देहकृद्भयनाशनः । दरहासो दयामूर्तिर्दिव्यकीर्तिर्दिवस्पतिः ॥ ९८॥ ध्यानगम्यो ध्येयमूर्तिर्ध्यानातीतो
    धुरन्धरः । धन्वी धर्मो धनाध्यक्षो ध्यातृपापनिषूदनः ॥ ९९॥ धृष्टिर्धृतिप्रदो धाता धार्मिको धर्मपालकः
    । धूर्जटिर्धेनुकरिपुर्धत्तूरकुसुमप्रियः ॥ १००॥ धूष्पतिर्धूतपापौघो धनदो धन्यसेवितः । नटेशो नाट्यकुशलो
    नीलकण्ठो निरामयः ॥ १०१॥ नित्यदो नित्यसन्तुष्टो नित्यानन्दो निराश्रयः । निर्विकारो निराधारो निष्प्रपञ्चो
    निरुत्तरः ॥ १०२॥ निरञ्जनो निर्विकल्पो निर्लेपो निरुपद्रवः । नरो नियन्त्रकल्याणो नरसिंहो नरेष्टदः ॥
    १०३॥ नारायणो नराधीशो निवृत्तात्मानिगूढगः । नन्दीशो नन्दतनयो नाकेशो नरकान्तकः ॥ १०४॥ पिनाकी पङ्कजकरः
    पूर्णः पूर्णार्थकारकः । पुराणपुरुषः पुण्यः पटुः पशुपतिः परः ॥ १०५॥ प्रियंवदः प्रियकरः प्रणवः प्रणवार्थकः
    । परमात्मा परब्रह्मा परञ्ज्योतिः परन्तपः ॥ १०६॥ परार्थः परमार्थज्ञः परतत्त्वावबोधकः । परानन्दः पराव्यक्तः
    परन्धामा परोदयः ॥ १०७॥ पद्मार्चितः पद्मनाभः पद्मेशः पद्मबान्धवः । परेशः पार्थवरदः पशुपाशविमोचकः ॥
    १०८॥ पार्वतीशः पीतवासाः पुरन्दरसुरार्चितः । पुण्डरीकाजिनधरः पुण्डरीकदळेक्षणः ॥ १०९॥ पुण्डरीकपुराध्यक्षः
    पुण्डरीकसमप्रभः । पुण्यशीलः पुण्यकीर्तिः पुण्यगम्यः पुरान्तकः ॥ ११०॥ पूतनाजीवितहरः पूतनामा पुरातनः
    । फणिभूषः फणिपतिः फणिकुण्डलमण्डितः ॥ १११॥ फणीन्द्रशायी फालाक्षः फलभुक् फलदायकः । ब्रह्माङ्गहा बलिध्वंसी
    ब्रह्मविद् ब्रह्मवित्तमः ॥ ११२॥ ब्रह्मज्योतिर्ब्रह्मकृतिः ब्रह्मण्यो ब्रह्मवन्दितः । ब्रह्मेन्द्रवरदो
    ब्रह्मपारगो ब्रह्मवत्सलः ॥ ११३॥ ब्रह्माण्डविग्रहो ब्रह्म बृहत्तेजो बृहत्तपः । बहुशक्तिर्बालरूपो बलोन्माथिर्बलोत्कटः
    ॥ ११४॥ बन्धुरो बाणवरदो बुध्यो बोधात्मको बुधः । भगो भूतपतिर्भीमो भीष्ममुक्तिप्रदो भवः ॥ ११५॥ भाग्यदो
    भगवान् भोगी भवो भीतभयापहः । भगनेत्रहरो भद्रो भस्मोद्धूळितविग्रहः ॥ ११६॥ भस्मशायी भवानीशो भूतात्मा
    भूतनायकः । भार्गवो भार्गवगुरुः भुक्तिमुक्तिफलप्रदः ॥ ११७॥ भवप्रियो भवद्वेषी भोक्ता भुवनपालकः । महेश्वरो
    महायोगी महावीरो महामनाः ॥ ११८॥ महाकर्मा महाकीर्तिर्महौजा महिमोद्धतः । महौषधिर्महीभर्ता महोदारो महामतिः
    ॥ ११९॥ महानन्दो महापुण्यो महाभाग्यो महागुणः । महारथो महाधन्वी महाविद्यो महोदयः ॥ १२०॥ १२०॥ महापातकविध्वंसी
    महोरगवरप्रदः । महालिङ्गो महाश
