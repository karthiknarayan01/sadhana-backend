id: bhashyakaramangalam
category: stotram
name:
  english: bhashyakaramangalam
  devanagari: भाष्यकारमन्गलम्
content:
  english: shribhashyakaramangalam shrivadibhikaragurubhiranugrihitam || shrih || || shrimate ramanujaya
    namah || || shrivadibhikaragurave namah || shriparankushapadabjasurabhikritamaulaye | shrivatsacihnanathaya
    yatirajaya mangalam || 1|| nathapadmaksharamaryapadapankajasevine | sevyaya sarvayaminam yatirajaya
    mangalam || 2|| purnaya purnakarunapatrayamitatejase | maladharapriyayastu yati rajaya mangalam ||
    3|| samsevya yamunacaryamekalavyosmyaham guroh | ityevam vadate nityam yatirajaya mangalam || 4||
    shrikancipurnamishroktarahasyarthavide sada | devarajapriyayastu yatirajaya mangalam || shrimadgoshthipuripurnadivyajnam
    kurvate muda | shlokaryam grihnate tasmat yatirajaya mangalam || 6|| kureshakurukanathadasharathyadideshikah
    | yacchishya bhanti te tasmai yatirajaya mangalam || 7|| caramashlokatattvartham jnatvaryajnam vilanghya
    ca | dishate tam svakiyebhyah yatirajaya mangalam || 8|| shrishailapurnakripaya shriramayanamarthatah
    | bhaktya yena shrutam tasmai yatirajaya mangalam || 9|| shankaradikudrishtinam bahyanam nidhanaya
    ca | shribhashyam kurvate tasmai yatirajaya mangalam || 10|| kurvannupanishadbhashyam jagadraksham
    karoti yah | dayayah paratantraya bhashyakaraya mangalam || 11|| dramidopanishadvyakhyam kalayeti
    kripabalat | shasate kurukesham tam bhashyakaraya mangalam || 12|| gatva tu sharadapitham vrittim
    bodhayanasya ca | avalokyagatayastu bhashyakaraya mangalam || 13|| paramanumrishavadivadasamharakarine
    | tasmai bhagavate shrimadbhashyakaraya mangalam || 14|| shrimatkurangapurnaya shribhashyam vadate
    svayam | pitre sampatsutasyapi bhashyakaraya mangalam || 15|| dattva vrishagirishasya shankhacakre
    ramapateh paramapritiyuktaya bhashyakaraya mangalam || 16|| sannyasam kurvate kancyamanantasarasitate
    | varade nyastabharaya bhashyakaraya mangalam || 17|| shrimanmahabhutapure shrimatkeshavayajvanah
    | kantimatyam prasutaya yatirajaya mangalam || 18|| shesho va sainyanatho va shripatirveti sattvikaih
    | vitarkyaya mahaprajnaih yatirajaya mangalam || 19|| prakrishtagunapurnaya prapyaya svanghrisevinam
    | prapannasarthavahaya yatirajaya mangalam || 20|| vedatmakapramanena sattvikaishca pramatribhih |
    prameyena saha shriman vardhatam yatishekharah || 21|| iti shrivadibhikaragurubhiranugrihitam shribhashyakaramangalam
    sampurnam | || shrivadibhikaragurave namah ||
  devanagari: श्रीभाष्यकारमङ्गलम् श्रीवादिभीकरगुरुभिरनुगृहीतं ॥ श्रीः ॥ ॥ श्रीमते रामानुजाय नमः ॥ ॥ श्रीवादिभीकरगुरवे
    नमः ॥ श्रीपराङ्कुशपादाब्जसुरभीकृतमौलये । श्रीवत्सचिह्ननाथाय यतिराजाय मङ्गलम् ॥ १॥ नाथपद्माक्षरामार्यपादपङ्कजसेविने
    । सेव्याय सर्वयमिनां यतिराजाय मङ्गलम् ॥ २॥ पूर्णाय पूर्णकरुणापात्रायामिततेजसे । मालाधरप्रियायास्तु
    यति राजाय मङ्गलम् ॥ ३॥ संसेव्य यामुनाचार्यमेकलव्योस्म्यहं गुरोः । इत्येवं वदते नित्यं यतिराजाय मङ्गलम्
    ॥ ४॥ श्रीकाञ्चीपूर्णमिश्रोक्तरहस्यार्थविदे सदा । देवराजप्रियायास्तु यतिराजाय मङ्गलम् ॥ श्रीमद्गोष्ठीपुरीपूर्णदिव्याज्ञां
    कुर्वते मुदा । श्लोकार्यं गृह्णते तस्मात् यतिराजाय मङ्गलम् ॥ ६॥ कूरेशकुरुकानाथदाशरथ्यादिदेशिकाः ।
    यच्छिष्या भान्ति ते तस्मै यतिराजाय मङ्गलम् ॥ ७॥ चरमश्लोकतत्त्वार्थं ज्ञात्वार्याज्ञां विलङ्घ्य च ।
    दिशते तं स्वकीयेभ्यः यतिराजाय मङ्गलम् ॥ ८॥ श्रीशैलपूर्णकृपया श्रीरामायणमर्थतः । भक्त्या येन श्रुतं
    तस्मै यतिराजाय मङ्गलम् ॥ ९॥ शङ्करादिकुदृष्टीनां बाह्यानां निधनाय च । श्रीभाष्यं कुर्वते तस्मै यतिराजाय
    मङ्गलम् ॥ १०॥ कुर्वन्नुपनिषद्भाष्यं जगद्रक्षां करोति यः । दायायाः परतन्त्राय भाष्यकाराय मङ्गलम् ॥
    ११॥ द्रमिडोपनिषद्व्याख्यां कालयेति कृपाबलात् । शासते कुरुकेशं तं भाष्यकाराय मङ्गलम् ॥ १२॥ गत्वा तु
    शारदापीठं वृत्तिं बोधायनस्य च । अवलोक्यागतायास्तु भाष्यकाराय मङ्गलम् ॥ १३॥ परमाणुमृषावादिवादसंहारकारिणे
    । तस्मै भगवते श्रीमद्भाष्यकाराय मङ्गलम् ॥ १४॥ श्रीमत्कुरङ्गपूर्णाय श्रीभाष्यं वदते स्वयम् । पित्रे
    सम्पत्सुतस्यापि भाष्यकाराय मङ्गलम् ॥ १५॥ दत्त्वा वृषगिरीशस्य शङ्खचक्रे रमापतेः परमप्रीतियुक्ताय भाष्यकाराय
    मङ्गलम् ॥ १६॥ सन्न्यासं कुर्वते काञ्च्यामनन्तसरसीतटे । वरदे न्यस्तभाराय भाष्यकाराय मङ्गलम् ॥ १७॥ श्रीमन्महाभूतपुरे
    श्रीमत्केशवयज्वनः । कान्तिमत्यां प्रसूताय यतिराजाय मङ्गलम् ॥ १८॥ शेषो वा सैन्यनाथो वा श्रीपतिर्वेति
    सात्त्विकैः । वितर्क्याय महाप्राज्ञैः यतिराजाय मङ्गलम् ॥ १९॥ प्रकृष्टगुणपूर्णाय प्राप्याय स्वाङ्घ्रिसेविनाम्
    । प्रपन्नसार्थवाहाय यतिराजाय मङ्गलम् ॥ २०॥ वेदात्मकप्रमाणेन सात्त्विकैश्च प्रमातृभिः । प्रमेयेण सह
    श्रीमान् वर्धतां यतिशेखरः ॥ २१॥ इति श्रीवादिभीकरगुरुभिरनुगृहीतं श्रीभाष्यकारमङ्गलं सम्पूर्णम् । ॥
    श्रीवादिभीकरगुरवे नमः ॥
