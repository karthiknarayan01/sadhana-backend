id: shukrakavac
category: kavacha
name:
  english: shukrakavac
  devanagari: शुक्रकवच्
content:
  english: shukrakavacam shriganeshaya namah | om asya shrishukrakavacastotramantrasya bharadvaja rishih
    | anushtupchandah | shrishukro devata | shukraprityarthe jape viniyogah || mrinalakundendupayojasuprabham
    pitambaram prasritamakshamalinam | samastashastrarthavidhim mahantam dhyayetkavim vanchitamarthasiddhaye
    || 1|| om shiro me bhargavah patu bhalam patu grahadhipah | netre daityaguruh patu shrotre me candanadyutih
    || 2|| patu me nasikam kavyo vadanam daityavanditah | vacanam coshanah patu kantham shrikanthabhaktiman
    || 3|| bhujau tejonidhih patu kukshim patu manovrajah | nabhim bhrigusutah patu madhyam patu mahipriyah
    || 4|| katim me patu vishvatma uru me surapujitah | janum jadyaharah patu janghe jnanavatam varah
    || 5|| gulphau gunanidhih patu patu padau varambarah | sarvanyangani me patu svarnamalaparishkritah
    || 6|| ya idam kavacam divyam pathati shraddhayanvitah | na tasya jayate pida bhargavasya prasadatah
    || 7|| || iti shribrahmandapurane shukrakavacam sampurnam ||
  devanagari: शुक्रकवचम् श्रीगणेशाय नमः । ॐ अस्य श्रीशुक्रकवचस्तोत्रमन्त्रस्य भारद्वाज ऋषिः । अनुष्टुप्छन्दः
    । श्रीशुक्रो देवता । शुक्रप्रीत्यर्थे जपे विनियोगः ॥ मृणालकुन्देन्दुपयोजसुप्रभं पीताम्बरं प्रसृतमक्षमालिनम्
    । समस्तशास्त्रार्थविधिं महान्तं ध्यायेत्कविं वाञ्छितमर्थसिद्धये ॥ १॥ ॐ शिरो मे भार्गवः पातु भालं पातु
    ग्रहाधिपः । नेत्रे दैत्यगुरुः पातु श्रोत्रे मे चन्दनद्युतिः ॥ २॥ पातु मे नासिकां काव्यो वदनं दैत्यवन्दितः
    । वचनं चोशनाः पातु कण्ठं श्रीकण्ठभक्तिमान् ॥ ३॥ भुजौ तेजोनिधिः पातु कुक्षिं पातु मनोव्रजः । नाभिं
    भृगुसुतः पातु मध्यं पातु महीप्रियः ॥ ४॥ कटिं मे पातु विश्वात्मा ऊरू मे सुरपूजितः । जानुं जाड्यहरः
    पातु जङ्घे ज्ञानवतां वरः ॥ ५॥ गुल्फौ गुणनिधिः पातु पातु पादौ वराम्बरः । सर्वाण्यङ्गानि मे पातु स्वर्णमालापरिष्कृतः
    ॥ ६॥ य इदं कवचं दिव्यं पठति श्रद्धयान्वितः । न तस्य जायते पीडा भार्गवस्य प्रसादतः ॥ ७॥ ॥ इति श्रीब्रह्माण्डपुराणे
    शुक्रकवचं सम्पूर्णम् ॥
