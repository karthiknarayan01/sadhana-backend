id: padmavatiparinayataravali
category: stotram
name:
  english: padmavatiparinayataravali
  devanagari: पद्मावतीपरिणयतारावली
content:
  english: rinu mama vacanam yahi shighram pita me | aganta kim vivikte vasasi ciramiti shlishtamuccarya
    parshve jnatva gudham sakhinam sthitimatha niragallajjita tah prapede || 10|| yate rajivanetre svayamatha
    sakalassvassakhista vihaya sviyam prapyavarodham hridi tamanupadam cintayantyekarupam | dina kandarpativrapraharanavikalasvantaranga
    krishangi no naktam no diva va svapiti viharati snati bhunkte sma padma || 11|| cetastasya viditva
    sa ca hayamadhiruhyashu geham prapannah kricchrenatitya kakshyah kathamapi shayanagaramabhyetya talpe
    | tamevantardadhano dishidishi puratah parshvatashcapi padmam padmakshimikshamanah pratikalamamuha
    ccintayamstadgunaughan || 12|| ehyehyuttishtha sheshe kimidamupanatam nasti te kim bubhuksha bhunkshva
    pratashca samyanna hi bata bhavata bhuktamityamananti | asina''racca kim te hridayagatamaho kim nu
    va sundarim te drishtva mugdham manaste kuta iti vakula me'bhidhatsvetyapricchat || 13|| matah kantaradeshe
    dviradamanusarannekato daivayogat atmiyabhissakhibhissaha kusumavane parijatapacayam | kurvantim vyomanamno
    nripakulatilakasyatmajamambujakshim adraksham tatkatakshairapahritamabhavanmanmanashcetyavadit ||
    14|| tatah netum sambhojya tam dragatha kritashapatha prasthita tannagaryah madhyemargam mahesham
    kalashajamunina pujitam sampranamya | prapyanujnam maharshermahitagunanidhervyasasunoshshukasya
  devanagari: ृणु मम वचनं याहि शीघ्रं पिता मे । आगन्ता किं विविक्ते वससि चिरमिति श्लिष्टमुच्चार्य पार्श्वे
    ज्ञात्वा गूढां सखीनां स्थितिमथ निरगाल्लज्जिता ताः प्रपेदे ॥ १०॥ याते राजीवनेत्रे स्वयमथ सकलास्स्वास्सखीस्ता
    विहाय स्वीयं प्राप्यावरोधं हृदि तमनुपदं चिन्तयन्त्येकरूपम् । दीना कन्दर्पतीव्रप्रहरणविकलस्वान्तरङ्गा
    कृशाङ्गी नो नक्तं नो दिवा वा स्वपिति विहरति स्नाति भुङ्क्ते स्म पद्मा ॥ ११॥ चेतस्तस्या विदित्वा स
    च हयमधिरुह्याशु गेहं प्रपन्नः कृच्छ्रेणातीत्य कक्ष्याः कथमपि शयनागारमभ्येत्य तल्पे । तामेवान्तर्दधानो
    दिशिदिशि पुरतः पार्श्वतश्चापि पद्मां पद्माक्षीमीक्षमाणः प्रतिकलममुह च्चिन्तयंस्तद्गुणौघान् ॥ १२॥ एह्येह्युत्तिष्ठ
    शेषे किमिदमुपनतं नास्ति ते किं बुभुक्षा भुङ्क्ष्व प्रातश्च सम्यङ्न हि बत भवता भुक्तमित्यामनन्ती ।
    आसीनाऽऽराच्च किं ते हृदयगतमहो किं नु वा सुन्दरीं ते दृष्ट्वा मुग्धं मनस्ते कुत इति वकुला मेऽभिधत्स्वेत्यपृच्छत्
    ॥ १३॥ मातः कान्तारदेशे द्विरदमनुसरन्नेकतो दैवयोगात् आत्मीयाभिस्सखीभिस्सह कुसुमवने पारिजातापचायम् ।
    कुर्वन्तीं व्योमनाम्नो नृपकुलतिलकस्यात्मजामम्बुजाक्षीम् अद्राक्षं तत्कटाक्षैरपहृतमभवन्मन्मनश्चेत्यवादीत्
    ॥ १४॥ ततः नेतुं सम्भोज्य तं द्रागथ कृतशपथा प्रस्थिता तन्नगर्याः मध्येमार्गं महेशं कलशजमुनिना पूजितं
    सम्प्रणम्य । प्राप्यानुज्ञां महर्षेर्महितगुणनिधेर्व्याससूनोश्शुकस्या
