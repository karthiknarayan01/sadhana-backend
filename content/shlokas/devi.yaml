id: devi
category: upanishad
name:
  english: devi
  devanagari: देवि
content:
  english: vyashema devahitam yadayuh || svasti na indro vriddhashravah svasti nah pusha vishvavedah |
    svasti nastarkshyo arishtanemih svasti no brihaspatirdadhhatu || om shantih shantih shantih || harih
    om || sarve vai deva devimupatasthuh | kasi tvam mahadevi | sabravidaham brahmasvarupini | mattah
    prakritipurushatmakam jagacchunyam cashunyam ca | ahamanandananandah vijnanavijnane aham | brahma
    brahmani veditavye | ityahatharvani shrutih || 1|| aham pancabhutanyapancabhutani | ahamakhilam jagat
    | vedo'hamavedo'ham | vidyahamavidyaham | ajahamanajaham | adhashcordhvam ca tiryakcaham | aham rudrebhirvasubhishcaramyahamadityairuta
    vishvadevaih | aham mitravarunavubhau bibharmyahamindragni ahamashvinavubhau | aham somam tvashtaram
    pushanam bhagam dadhamyaham | vishnumurukramam brahmanamuta prajapatim dadhami | aham dadhami dravinam
    havishmate supravye 3 yajamanaya sunvate || 2|| aham rashtri sangamani vasunamaham suve pitaramasya
    murdhanmama yonirapsvantah samudre | ya evam veda sa devipadamapnoti | te deva abruvan | namo devyai
    mahadevyai shivayai satatam namah | namah prakrityai bhadrayai niyatah pranatah sma tam || 3|| tamagnivarnam
    tapasa jvalantim vairocanim karmaphaleshu jushtam | durgam devim sharanamaham prapadye sutaram nashayate
    tamah || 4|| devim vacamajanayanta devastam vishvarupah pashavo vadanti | sa no mandreshamurjam duhana
    dhenurvagasmanupasushtutaitu || 5|| kalaratrim brahmastutam vaishnavim skandamataram | sarasvatimaditim
    dakshaduhitaram namamah pavanam shivam || 6|| mahalakshmishca vidmahe sarvasiddhishca dhimahi | tanno
    devi pracodayat || 7|| aditirhyajanishta daksha ya duhita tava | tam deva anvajayanta bhadra amritabandhavah
    || 8|| kamo yonih kamakala vajrapanirguha hasa | matarishvabhramindrah punarguha sakala mayaya ca
    punah kosha vishvamata divi dyom || 9|| eshatmashaktih | esha vishvamohini pashankushadhanurbanadhara
    | esha shrimahavidya | ya evam veda sa shokam tarati | namaste astu bhagavati bhavati matarasmanpatu
    sarvatah | saishashtau vasavah | saishaikadasha rudrah | saisha dvadashadityah | saisha vishvedevah
    somapa asomapashca | saisha yatudhanu asura rakshamsi pishacayakshah siddhah | saisha sattvarajastamamsi
    | saisha prajapatindramanavah | saisha graha nakshatrajyotimshi kalakashthadikalarupini | tamaham
    pranaumi nityam | tapapaharinim devim bhuktimuktipradayinim | anantam vijayam shuddham sharanyam shivadam
    shivam || 10|| viyadakarasamyuktam vitihotrasamanvitam | ardhendulasitam devya bijam sarvarthasadhakam
    || 11|| evamekaksharam mantram yatayah shuddhacetasah | dhyayanti paramanandamaya jnanamburashayah
    || 12|| vanmaya brahmabhutasmatshashtham vaktrasamanvitam | suryo vamashrotrabinduh samyutashtakatritiyakah
    || 13|| narayanena samyukto vayushcadharasamyutah | vicce navarnako'rnah syanmahadanandadayakah ||
    14|| hritpundarikamadhyastham pratahsuryasamaprabham | pashankushadharam saumyam varadabhayahastakam
    | trinetram raktavasanam bhaktakamadugham bhaje || 15|| namami tvamaham devim mahabhayavinashinim
    | mahadurgaprashamanim mahakarunyarupinim || 16|| yasyah svarupam brahmadayo na jananti tasmaducyate'jneya
    | yasya anto na vidyate tasmaducyate'nanta | yasya grahanam nopalabhyate tasmaducyate'lakshya | yasya
    jananam nopalabhyate tasmaducyate'ja | ekaiva sarvatra vartate tasmaducyata eka | ekaiva vishvarupini
    tasmaducyate naika 'ta evocyate'jneyanantalakshyajaika naiketi | mantranam matrika devi shabdanam
    jnanarupini | jnananam cinmayatita shunyanam shunyasakshini || 17|| yasyah parataram nasti saisha
    durga prakirtita |
  devanagari: व्यशेम देवहितं यदायुः ॥ स्वस्ति न इन्द्रो वृद्धश्रवाः स्वस्ति नः पूषा विश्ववेदाः । स्वस्ति
    नस्तार्क्ष्यो अरिष्टनेमिः स्वस्ति नो बृहस्पतिर्दध्हातु ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ हरिः ॐ ॥ सर्वे
    वै देवा देवीमुपतस्थुः । कासि त्वं महादेवि । साब्रवीदहं ब्रह्मस्वरूपिणी । मत्तः प्रकृतिपुरुषात्मकं
    जगच्छून्यं चाशून्यं च । अहमानन्दानानन्दाः विज्ञानाविज्ञाने अहम् । ब्रह्मा ब्रह्मणि वेदितव्ये । इत्याहाथर्वणि
    श्रुतिः ॥ १॥ अहं पञ्चभूतान्यपञ्चभूतानि । अहमखिलं जगत् । वेदोऽहमवेदोऽहम् । विद्याहमविद्याहम् । अजाहमनजाहम्
    । अधश्चोर्ध्वं च तिर्यक्चाहम् । अहं रुद्रेभिर्वसुभिश्चराम्यहमादित्यैरुत विश्वदेवैः । अहं मित्रावरुणावुभौ
    बिभर्म्यहमिन्द्राग्नी अहमश्विनावुभौ । अहं सोमं त्वष्टारं पूषणं भगं दधाम्यहम् । विष्णुमुरुक्रमं ब्रह्माणमुत
    प्रजापतिं दधामि । अहं दधामि द्रविणं हविष्मते सुप्राव्ये ३ यजमानाय सुन्वते ॥ २॥ अहं राष्ट्री सङ्गमनी
    वसूनामहं सुवे पितरमस्य मूर्धन्मम योनिरप्स्वन्तः समुद्रे । य एवं वेद स देवीपदमाप्नोति । ते देवा अब्रुवन्
    । नमो देव्यै महादेव्यै शिवायै सततं नमः । नमः प्रकृत्यै भद्रायै नियताः प्रणताः स्म ताम् ॥ ३॥ तामग्निवर्णां
    तपसा ज्वलन्तीं वैरोचनीं कर्मफलेषु जुष्टाम् । दुर्गां देवीं शरणमहं प्रपद्ये सुतरां नाशयते तमः ॥ ४॥
    देवीं वाचमजनयन्त देवास्तां विश्वरूपाः पशवो वदन्ति । सा नो मन्द्रेशमूर्जं दुहाना धेनुर्वागस्मानुपसुष्टुतैतु
    ॥ ५॥ कालरात्रिं ब्रह्मस्तुतां वैष्णवीं स्कन्दमातरम् । सरस्वतीमदितिं दक्षदुहितरं नमामः पावनां शिवाम्
    ॥ ६॥ महालक्ष्मीश्च विद्महे सर्वसिद्धिश्च धीमहि । तन्नो देवी प्रचोदयात् ॥ ७॥ अदितिर्ह्यजनिष्ट दक्ष
    या दुहिता तव । तां देवा अन्वजायन्त भद्रा अमृतबन्धवः ॥ ८॥ कामो योनिः कामकला वज्रपाणिर्गुहा हसा । मातरिश्वाभ्रमिन्द्रः
    पुनर्गुहा सकला मायया च पुनः कोशा विश्वमाता दिवि द्योम् ॥ ९॥ एषात्मशक्तिः । एषा विश्वमोहिनी पाशाङ्कुशधनुर्बाणधरा
    । एषा श्रीमहाविद्या । य एवं वेद स शोकं तरति । नमस्ते अस्तु भगवति भवति मातरस्मान्पातु सर्वतः । सैषाष्टौ
    वसवः । सैषैकादश रुद्राः । सैषा द्वादशादित्याः । सैषा विश्वेदेवाः सोमपा असोमपाश्च । सैषा यातुधानु असुरा
    रक्षांसि पिशाचयक्षाः सिद्धाः । सैषा सत्त्वरजस्तमांसि । सैषा प्रजापतीन्द्रमनवः । सैषा ग्रहा नक्षत्रज्योतींषि
    कलाकाष्ठादिकालरूपिणी । तामहं प्रणौमि नित्यम् । तापापहारिणीं देवीं भुक्तिमुक्तिप्रदायिनीम् । अनन्तां
    विजयां शुद्धां शरण्यां शिवदां शिवाम् ॥ १०॥ वियदाकारसंयुक्तं वीतिहोत्रसमन्वितम् । अर्धेन्दुलसितं देव्या
    बीजं सर्वार्थसाधकम् ॥ ११॥ एवमेकाक्षरं मन्त्रं यतयः शुद्धचेतसः । ध्यायन्ति परमानन्दमया ज्ञानाम्बुराशयः
    ॥ १२॥ वाङ्मया ब्रह्मभूतस्मात्षष्ठं वक्त्रसमन्वितम् । सूर्यो वामश्रोत्रबिन्दुः संयुताष्टकतृतीयकः ॥
    १३॥ नारायणेन संयुक्तो वायुश्चाधरसंयुतः । विच्चे नवार्णकोऽर्णः स्यान्महदानन्ददायकः ॥ १४॥ हृत्पुण्डरीकमध्यस्थां
    प्रातःसूर्यसमप्रभाम् । पाशाङ्कुशधरां सौम्यां वरदाभयहस्तकाम् । त्रिनेत्रां रक्तवसनां भक्तकामदुघां भजे
    ॥ १५॥ नमामि त्वामहं देवीं महाभयविनाशिनीम् । महादुर्गप्रशमनीं महाकारुण्यरूपिणीम् ॥ १६॥ यस्याः स्वरूपं
    ब्रह्मादयो न जानन्ति तस्मादुच्यतेऽज्ञेया । यस्या अन्तो न विद्यते तस्मादुच्यतेऽनन्ता । यस्या ग्रहणं
    नोपलभ्यते तस्मादुच्यतेऽलक्ष्या । यस्या जननं नोपलभ्यते तस्मादुच्यतेऽजा । एकैव सर्वत्र वर्तते तस्मादुच्यत
    एका । एकैव विश्वरूपिणी तस्मादुच्यते नैका ऽत एवोच्यतेऽज्ञेयानन्तालक्ष्याजैका नैकेति । मन्त्राणां मातृका
    देवी शब्दानां ज्ञानरूपिणी । ज्ञानानां चिन्मयातीता शून्यानां शून्यसाक्षिणी ॥ १७॥ यस्याः परतरं नास्ति
    सैषा दुर्गा प्रकीर्तिता ।
