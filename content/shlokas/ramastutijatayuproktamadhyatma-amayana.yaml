id: ramastutijatayuproktamadhyatma-amayana
category: stotram
name:
  english: ramastutijatayuproktamadhyatmaṟamayana
  devanagari: रामस्तुतिजटायुप्रोक्तमाध्यत्मऱमयन
content:
  english: ravibhasuramabhishtapradam sharanadam | surapadamularacitanilayam surasancayasevyam pranato'smyaham
    ramam || 3|| bhavakananadavadahananamadheyam bhavapankajabhavamukhadaivatam devam | danujapatikotisahasravinasham
    manujakaram harim pranato'smyaham ramam || 4|| bhavabhavanaharam bhagavatsvarupinam bhavabhivirahitam
    munisevitam param | bhavasagarataranamghripotakam nityam bhavanashayanisham pranato'smyaham ramam
    || 5|| girishagirisutahridayambujavasam girinayakadharam giripaksharisevyam | surasancayadanujendrasevitapadam
    surapamaninibham pranato'smyaham ramam || 6|| paradararthaparivarjitamanishinam parapurushagunabhutisantushtatmanam
    | paralokaikahitaniratatmanam sevyam paramanandamayam pranato'smyaham ramam || 7|| smitasundaravikasitavaktrambhoruham
    smritigocaramasitambudakalevaram | sitapankajacarunayanam raghuvaram kshitinandinivaram pranato'smyaham
    ramam || 8|| jalapatraughasthitaravimandalasamam sakalacaracarajivantahsthitam | paripurnatmanamadvayamavyayamekam
    paramam paraparam pranato'smyaham ramam || 9|| vidhimadhavashambhurupabhedena guna
  devanagari: रविभासुरमभीष्टप्रदं शरणदम् । सुरपादमूलरचितनिलयं सुरसञ्चयसेव्यं प्रणतोऽस्म्यहं रामम् ॥ ३॥
    भवकाननदवदहननामधेयं भवपङ्कजभवमुखदैवतं देवम् । दनुजपतिकोटिसहस्रविनाशं मनुजाकारं हरिं प्रणतोऽस्म्यहं
    रामम् ॥ ४॥ भवभावनाहरं भगवत्स्वरूपिणं भवभीविरहितं मुनिसेवितं परम् । भवसागरतरणांघ्रिपोतकं नित्यं भवनाशायानिशं
    प्रणतोऽस्म्यहं रामम् ॥ ५॥ गिरिशगिरिसुताहृदयांबुजावासं गिरिनायकधरं गिरिपक्षारिसेव्यम् । सुरसञ्चयदनुजेन्द्रसेवितपादं
    सुरपमणिनिभं प्रणतोऽस्म्यहं रामम् ॥ ६॥ परदारार्थपरिवर्जितमनीषिणां परपूरुषगुणभूतिसन्तुष्टात्मनाम् ।
    परलोकैकहितनिरतात्मनां सेव्यं परमानन्दमयं प्रणतोऽस्म्यहं रामम् ॥ ७॥ स्मितसुन्दरविकसितवक्त्रांभोरुहं
    स्मृतिगोचरमसितांबुदकलेवरम् । सितपङ्कजचारुनयनं रघुवरं क्षितिनन्दिनीवरं प्रणतोऽस्म्यहं रामम् ॥ ८॥ जलपात्रौघस्थितरविमण्डलसमं
    सकलचराचरजीवान्तःस्थितम् । परिपूर्णात्मानमद्वयमव्ययमेकं परमं परापरं प्रणतोऽस्म्यहं रामम् ॥ ९॥ विधिमाधवशम्भुरूपभेदेन
    गुण
