id: brahmakritam11vishnustotram
category: stotram
name:
  english: brahmakritam11vishnustotram
  devanagari: ब्रह्मकृतं११विष्णुस्तोत्रम्
content:
  english: manantashaktim purusham yamahuh | kalo bhavanakshipatisha vishvam sroto yathantah patitam gabhiram
    || 27|| tvam vai prajanam sthirajangamanam prajapatinamasi sambhavishnuh | divaukasam deva divashcyutanam
    parayanam nauriva majjato'psu || 28|| iti shrimadbhagavatamahapurane ashtamamaskandhe saptadashadhyayantargatam
    brahmakritam vishnustotram samaptam | bhagavatapurana | adhyaya 8
  devanagari: मनन्तशक्तिं पुरुषं यमाहुः । कालो भवानाक्षिपतीश विश्वं स्रोतो यथान्तः पतितं गभीरम् ॥ २७॥
    त्वं वै प्रजानां स्थिरजङ्गमानां प्रजापतीनामसि सम्भविष्णुः । दिवौकसां देव दिवश्च्युतानां परायणं नौरिव
    मज्जतोऽप्सु ॥ २८॥ इति श्रीमद्भागवतमहापुराणे अष्टममस्कन्धे सप्तदशाध्यायान्तर्गतं ब्रह्मकृतं विष्णुस्तोत्रं
    समाप्तम् । भागवतपुराण । अध्याय ८
meaning: {}
