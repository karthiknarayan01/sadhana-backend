id: tyagaraja-keerthanas-gandhamu-puyaruga
category: stotram
name:
  english: Tyagaraja Keerthanas Gandhamu Puyaruga
content:
  english: gandhamu puyyaruga panniru gandhamu puyyaruga anu pallavi andamayina yadunandanupai kundaradana
    liravòndaga parimala ||gandhamu|| tilakamu diddaruga kasturi tilakamu diddaruga kalakalamanu mukhakalagani
    sòkkucu balukula namritamu lòlikèdu svamiki ||gandhamu|| celamu gattaruga bangaru celamu gattaruga
    malimito gopalabalulato nala mepina vishalanayanuniki ||gandhamu|| haratulèttaruga mutyala haratulèttaruga
    narimanulaku varamu yauvana varaka yòsagèdu varijakshuniki ||gandhamu|| pujalu seyaruga manasara pujalu
    seyaruga jajulu mari virajajulu davanamu rajita tyagaraja nutuniki ||gandhamu||
  devanagari: गन्धमु पुय्यरुगा पन्नीरु गन्धमु पुय्यरुगा अनु पल्लवि अन्दमयिन यदुनन्दनुपै कुन्दरदन लिरवॊन्दग
    परिमल ॥गन्धमु॥ तिलकमु दिद्दरुगा कस्तूरि तिलकमु दिद्दरुगा कलकलमनु मुखकलगनि सॊक्कुचु बलुकुल नमृतमु लॊलिकॆडु
    स्वामिकि ॥गन्धमु॥ चेलमु गट्टरुगा बङ्गारु चेलमु गट्टरुगा मालिमितो गोपालबालुलतो नाल मेपिन विशालनयनुनिकि
    ॥गन्धमु॥ हारतुलॆत्तरुगा मुत्याल हारतुलॆत्तरुगा नारीमणुलकु वारमु यौवन वारक यॊसगॆडु वारिजाक्षुनिकि ॥गन्धमु॥
    पूजलु सेयरुगा मनसार पूजलु सेयरुगा जाजुलु मरि विरजाजुलु दवनमु राजित त्यागराज नुतुनिकि ॥गन्धमु॥
