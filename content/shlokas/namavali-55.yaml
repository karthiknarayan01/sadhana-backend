    ॐ किङ्किणीकटये नमः । ॐ अमर्षणाय नमः । ॐ क्रूराय नमः । ५० ॥ ॐ विष्णुबाणधराय नमः । ॐ नृसिह्मान्त्यवसानाय
    नमः । ॐ क्रोडदंष्ट्राविधारिणे नमः । ॐ गजदन्तगदाय नमः । ॐ गोडजिनाम्बरवाससे नमः । ॐ तरुणाय नमः । ॐ शरण्याय
