id: annamayya-keerthanas-sarvaantaraatmudavu
category: stotram
name:
  english: Annamayya Keerthanas Sarvaantaraatmudavu
content:
  english: adi pallavi sarvantaratmudavu sharanagatuda nenu | sarvantaratmudavu sharanagatuda nenu | vurakunnajivuniki
    vòkkòkka svatantramicci | koretiyaparadhalu kònni vesi | nerakunte narakamu nericite svargamantu |
    duruvesevintekaka doshamèvvaridayya || sarvantaratmudavu sharanagatuda nenu | sarvaparadhinaiti calujalunayya
    || caranam manasu cudavalasi mayalu nive kappi | janulaku vishayalu cavulucupi | kanugònte mokshamicci
    kanakuntè karmamicci | ghanamu sesevindu kartalèvvarayya || sarvantaratmudavu sharanagatuda nenu |
    sarvaparadhinaiti calujalunayya || caranam vunnaru pranulèlla nòkkanigarbhamulone | kannakanna bhramatale
    kalpinci | yinnita shrivenkatesha yelitivi mammu nittè | ninnu nannu nèncukunte nike tèliyunayya ||
    sarvantaratmudavu sharanagatuda nenu | sarvaparadhinaiti calujalunayya ||
  devanagari: आदि पल्लवि सर्वान्तरात्मुडवु शरणागतुड नेनु । सर्वान्तरात्मुडवु शरणागतुड नेनु । वूरकुन्नजीवुनिकि
    वॊक्कॊक्क स्वतन्त्रमिच्चि । कोरेटियपराधालु कॊन्नि वेसि । नेरकुण्टे नरकमु नेरिचिते स्वर्गमण्टू । दूरुवेसेविन्तेकाक
    दोषमॆव्वरिदय्या ॥ सर्वान्तरात्मुडवु शरणागतुड नेनु । सर्वापराधिनैति चालुजालुनय्या ॥ चरणं मनसु चूडवलसि
    मायलु नीवे कप्पि । जनुलकु विषयालु चवुलुचूपि । कनुगॊण्टे मोक्षमिच्चि कानकुण्टॆ कर्ममिच्चि । घनमु सेसेविन्दु
    कर्तलॆव्वरय्या ॥ सर्वान्तरात्मुडवु शरणागतुड नेनु । सर्वापराधिनैति चालुजालुनय्या ॥ चरणं वुन्नारु प्राणुलॆल्ला
    नॊक्कनीगर्भमुलोने । कन्नकन्न भ्रमतले कल्पिञ्चि । यिन्निटा श्रीवेङ्कटेश येलितिवि मम्मु निट्टॆ । निन्नु
    नन्नु नॆञ्चुकुण्टे नीके तॆलियुनय्या ॥ सर्वान्तरात्मुडवु शरणागतुड नेनु । सर्वापराधिनैति चालुजालुनय्या
    ॥
