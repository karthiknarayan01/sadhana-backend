id: kytb-2-6-sautramanih-kaukili-hotram-cha-krishna-yajurveda-taittiriya-brahmana-patha-svadvim-tva
category: stotram
name:
  english: KYTB 2.6 Sautramanih Kaukili Hotram Cha - Krishna Yajurveda Taittiriya Brahmana Patha - Svadvim
    Tva
content:
  english: krishna yajurvediya taittiriya brahmane dvitiyashtake shashthah prapathakah sautramanih kaukili
    hotra shri gurubhyo namah | harih om || anuvakam ntivrena | amrita mmadhumata | srijami sagm somena
    | somo mpacyasva | sarasvatyai pacyasva | indraya sutramne pacyasva || paritoshincata sutam | somo
    ya uttamagm havih || || dadhanva yo naryo aphsvantara | sushava somamadribhih || punatu te parisruta
    m | somagm suryasya duhita | varena shashvata tana | vayuh putah pavitrena | prankhsomo atidrutah
    | indrasya yujya || vayuh putah pavitrena | pratyankhsomo atidrutah || || indrasya yujya mpavate teja
    indriyam | suraya somah suta asuto madaya | shukrena deva devatah piprigdhi | rasenannam ya~jamanaya
    dhehi || kuvidanga yavamanto yava ncit | yatha dantyanupurvam vi~yuya | ihehaisha nkrinuta bhojanani
    | ye barahisho namovrikti nna jagmuh || upayama || sarasvatya indraya sutramne || esha te yonistejase
    tva | viryaya tva balaya tva || tejo 'si tejo mayi dhehi | viryamasi virya mmayi dhehi | balamasi
    bala mmayi dhehi || nana hi va ndevahitagm sadah kritam | ma sagmsrikshatha mparame vyomann | sura
    tvamasi shushmini soma eshah | ma ma higmsi ntejah | sarasvatam m || esha te yonirmodaya tva | anandaya
    tva mahase tva || ojo 'syojo mayi dhehi | manyurasi manyu 'si maho mayi dhehi | saho 'si saho mayi
    dhehi || ya vyaghram vi~shucika | ubhau vrika nca rakshati | shyena mpatatrinagm sigmham | sema mpatvagmhasah
    || sa mma bhadrena prinkta | vipricah stha vi ma papmana prinkta || pratyankhsomo atidruto grahopasthanam
    somo raja 'mritagm sutah | rijishenajahanmrityum | ritena satyamindriyam | vipanagm shukramandhasah
    | indrasyendriyam | ida mmadhu || somamadbhyo vyapibat | chandasa hagmsa shshucishat | ritena satyamindriyam
    | adbhyah ngiraso dhiya | ritena satyamindriyam | anna m | brahmana vyapiba tkshatram | ritena satyamindriyam
    || reto mutram mpravishadindriyam | garbho jarayuna njahati janmana | ritena satyamindriyam || ||
    vedena rupe vyakarot | satasati prajapatih | ritena satyamindriyam || somena somau vyapibat | sutasutau
    prajapatih | ritena satyamindriyam | drishtva rupe vyakarot | satyanrite prajapatih | ashraddha 'dadhat
    | shraddhagm satye prajapatih | ritena satyamindriyam || drishtva parisruto rasa m | shukrena shukram
    mprajapatih | ritena satyamindriyam | vipanagm shukramandhasah | indrasyendriyam | ida jjanmanartena
    satyamindriyagg shraddhagm satye prajapatirashtau ca somo raja vipanagm somamadbhyo ve~dena satasati
    somena sutasutau drishtva rupe drishtva parisruto rasam m | yajnagm hinvanti mahisha namobhih | dadhana
    ndivi devatasu | mademendram ssvarkah || yaste rasa ssambhrita oshadhishu | somasya shushma ssuraya
    sutasya | tena jinva yajamana magnim || yamashvina namucerasuradadhi | sarasvatyasanodindriyaya ||
    m | somagm rajanamiha bhakshayami || yadatra riptagm rasinah sutasya | yadindro apibacchacibhih |
    aha ntadasya manasa shivena | somagm rajanamiha bhakshayami || pitribhyah svadhavibhyah svadha namah
    | pitamahebhyah svadhavibhyah svadha namah | prapitamahebhya ssvadhavibhyah svadha namah | aksha ||
    amimadanta pitarah | atitripanta pitarah | amimrijanta pitarah | pitara shshundhaddhvam || punantu
    ma pitarah somyasah | punantu ma pitamahah | punantu prapitamahah | pavitrena shatayusha | punantu
    ma pitamahah | punantu prapitamahah || || pavitrena shatayusha || vishvamayu rvyashnavai | agna ayugmshi
    pavasa a suvorjamisha nca nah | are badhasva ducchuna m || agne pavasva svapa asme varcah suvirya
    ssuvarjanah | pavitrena vicar shanih | yah pota sa punatu ma || punantu ma devajanah | punantu mana
    vo dhiya | punantu vishva ayavah ||| jatavedah pavitravat | pavitrena punahi ma | shukrena deva didyat
    | agne kratva kratugmranu || yatte pavitra marcishi | agne vitatamantara | brahma tena punimahe |||
    ubhabhya ndeva savitah | pavitrena savena ca | ida mbrahma punimahe || vaishvadevi punati devyaga
    stanuvo vitaprishthah | taya madanta ssadhamadyeshu | vayagg syama patayo rayinam |||| ye samana ssamanasah
    | pitaro yamarajye ssvadha namah | yajno deveshu kalpatam || ssamanasah | jiva jiveshu mamakah | teshag
    shrirmayi kalpatam | asmil ~loke shatagm samah || dve sruti ashrinava ndevanamuta martyanam | yabhyamidam
    thsameti | yadantara pitara nca || idagm havih prajanana mme astu | dashaviragm sarvaganagg | atmasani
    prajasani | pashusanyabhayasani lokasani | agnih praja mpayo reto asmasu dhatta | rayasposha mishamurjamasmasu
    didhara shatayusha punantu ma pitamahah punantu prapitamahah upahomah sisena tantra mmanasa manishinah
    | urnasutrena kavayo vayanti | ashvina yajnagm savita sarasvati | indrasya rupam va~runo bhishajyann
    || tadasya rupamamritagm shacibhih | tisro dadhurdevata ssagmraranah | lomani shashpai rbahudha na
    tokmabhih | tvagasya magmsamabhavanna lajah || tadashvina bhishaja rudravartani | sarasvati vayati
    pesho antarah || mmasaraih | karotarena dadhato gava ntvaci || sarasvati manasa peshalam va~su | nasatyabhyam
    mparisruta na rohitam | nagnahurdhirastasara nna vema || payasa shukramamrita jjanayanti retah | apamati
    mbadhamanah | uvaddhyam || indrah sutrama hridayena satyam | purodashena savita jajana | yakri va~runo
    bhishajyann | matasne vayavyai rna minati pittam || antrani sthali madhu pinvamana | guda patrani
    sudugha na dhenuh | shyenasya patra nna pliha shacibhih | asandi nabhirudara nna mata || kumbho vanishthurjanita
    shacibhih | yasminnagre yonya shshatadhara uthsah | duhe na kumbhig mpitribhyah || mukhagm sadasya
    shira ithsadena | jihva pavitramashvina sagm sarasvati | cappa nna payurbhishagasya valah | vastirna
    shepo harasa tarasvi || ashvibhya bhyam | chagena tejo havisha shritena | pakshmani godhumaih kvalairutani
    | pesho na shuklamasitam || avirna mesho nasi viryaya | pranasya pantha amrito graha bhyam | sarasvatyupavakai
    rvyanam | nasyani barahi rjajana || indrasya rupamrishabho balaya | karna bhyag shrotramamrita bhyam
    | yava na barahi rbhruvi kesarani | karkandhu jajne madhu saragha t || atmannupasthe na vrikasya loma
    | mukhe shmashruni na vya | sigmhasya loma tvishi rindriyani || anga thsarasvati | indrasya rupagm
    shatamanamayuh | candrena jyotiramrita ndadhana || sarasvati yonya ngarbhamantah | ashvibhya mbibharti
    | apagm rasena varuno na samna | indragg shriyai janayannaphsu raja || tejah pashunagm havirindriyavat
    | parisruta payasa saragha mbhishaja sarasvatya sutasutabhya rdevaih || kshatrasya nabhirasi | kshatrasya
    yonirasi || syonamasida | sushadamasida | ma tva higmsit | ma ma higmsit || nishasada dhritavrato
    varunah | pastya jyaya sukratuh || devasya tva savituh prasave | ashvino rbhaishajyena | tejase brahmavarcasayabhishincami
    || devasya tva savituh prasave | ashvino bhyam | sarasvatyai bhaishajyena || || viryayannadyayabhishincami
    || devasya tva savituh prasave | ashvino bhyam | indrasyendriyena | shriyai yashase balayabhishincami
    || ko tva kaya tva || sushloka~ n || shiro me shrih || shca shmashruni | raja me prano m | samrat
    cakshuh | viratchrotra m | jihva me bhadram | vammahah | mano manyuh | svaradbhamah | modah pramoda
    angulirangani || mme sahah | bahu me balamindriyam | hastau me karma virya m | atma kshatramuro mama
    | prishtirme rashtramudaramagmsau | grivashca shronyau | uru aratni januni | visho me 'ngani sarvatah
    | nabhirme cittam || anandanandavandau me 'smi | vishi raja pratishthitah || prati kshatre pratitishthami
    rashtre | pratyashveshu pratitishthami goshu | pratyangeshu pratitishthamyatmann | prati praneshu
    pratitishthami pushte | prati dyavaprithivyoh | pratitishthami yajne || || traya deva ekadasha | trayastrigmsha
    ssuradhasah | brihaspati purohitah | devasya savitu ssave | deva devairavantu ma | prathama dvitiyaih
    ya~jnena |yajno yajurbhih || || yajugmshi samabhih | sama nyrigbhih | rico yajyabhih | yajya vashatkaraih
    | vashatkara ahutibhih | ahutayo me kaman || lomani prayatirmama | tvamma anatiragatih | magmsa mma
    upanatih | va svasthi | majja ma anatih || sarasvatyai bhaishajyena ddeva devahedanam | devasashcakrima
    vayam | agnirma tasmadenasah | vishva nmuncatvagmhasah || yadi diva yadi nakta m | enagmsi cakrima
    vayam | vayurma tasmadenasah | vishva nmuncatvagmhasah || yadi jagra | enagmsi cakrima vayam || ||
    suryo ma tasmadenasah | vishva nmuncatvagmhasah || yadgrame yadaranye | ya ya~dindriye | yacchudre
    yadarye | enashcakrima vayam | yadekasyadhi dharmani | tasyavayajanamasi || yadapo aghniya varuneti
    shapamahe | tato varuna no munca || || avabhritha nicankuna nicerurasi nicankuna | ava devai 'yat
    | ava martyairmartyakritam | urora no deva rishaspahi || sumitra na apa oshadhaya ssantu | durmitrastasmai
    bhuyasuh | yo ndvishmah || drupadadive nmumucanah | svinna ssnatvi maladiva || m | apah shundhantu
    mainasah || udvaya ntamasaspari | pashyanto jyotiruttaram | deva m | aganma jyotiruttamam || pratiyuto
    varunasya pashah | pratyasto varunasya pashah || edho 'syedhishimahi | samidasi || 'si tejo mayi dhehi
    || apo anvacarisham | rasena samasrikshmahi | payasvagm agna a mma sagmsrija varcasa | prajaya ca
    dhanena ca || samavavarti prithivi | samushah | samu suryah | samu vishvamida njagat | vaishvanara
    jyoti svapna enagmsi cakrima vayam aindre prashnau prayajanamekadasha maitravarunapraishah hota yaksha
    midaspade | nabha prithivya adhi | divo var thsamiddhyate | ojishthashcar shanisahan | vetvajyasya
    hotaryaja || hota yakshattanunapatam | utibhi maparajitam | indra ndevagm suvarvida rmadhumattamaih
    | narashagmsena tejasa || || vetvajyasya hotaryaja || hota yakshadidabhi miditam | ajuhvana mamartyam
    | devo devai ryah | vajrahastah purandarah | vetvajyasya hotaryaja || hota yaksha nnishadvaram | vrishabha
    nnaryapasam | vasubhi rudrairadityaih | sayugbhi || vetvajyasya hotaryaja || hota yakshadojo na virya
    m | saho dvara indramavardhayann | suprayana vishrayantamritavridhah | dvara indraya midhushe | viyantvajyasya
    hotaryaja || hota yakshadushe indrasya dhenu | sudughe matarau mahi | savatarau na tejasi | vathsamindra
    || vitamajyasya hotaryaja || hota yaksha ddaivya hotara | bhishaja sakhaya | havishendra mbhishajyatah
    | kavi devau pracetasau | indraya dhatta indriyam | vitamajyasya hotaryaja || hota yakshattisro devih
    | trayastridhatavo 'pasah | ida sarasvati bharati || havishmatih | viyantvajyasya hotaryaja || hota
    yakshattvashtara ndevam | bhishajagm suyaja m | pururupagm suretasa m | indraya tvashta dadhadindriyani
    | vetvajyasya hotaryaja || hota yaksha m | shamitaragm shatakratum | dhiyo joshtara || maddhva samanjanpathibhih
    sugebhih | svadati havya mmadhuna ghritena | vetvajyasya hotaryaja || hota yakshadindragg svaha ''jyasya
    | svaha medasah | svaha m | svaha svahakritinam | svaha havyasu ktinam | svaha devagm a jyapan | svahendragm
    hotrajjushanah | indra ajyasya viyantu | hotaryaja || rbarhishyoja ushe daivya tisrastvashtaram ncaturvetveko
    viyantu dvirvitameko viyantu dvirvetveko viyantu hotaryaja aindre prashnau prayajayajyah samiddha
    indra ushasamanike | puroruca purvakridvavridhanah | tribhirdevaistrigmshata vajrabahuh | jaghana
    vritram vi~ duro vavara || narashagmsah prati shuro mimanah | tanunapat prati yajnasya dhama | gobhi
    nmadhuna samanjann | hiranyaishcandri yajati pracetah || idito devair harivagm abhishtih | ajuhvano
    havisha shardhamanah || || puradamro maghavan vajrabahuh | ayatu yajnamupa no jushanah || jushano
    barahir harivanna indrah | pracinagm sidatpradisha prithivyah | uruvyacah prathamanagg syonam | adityairaktam
    ndurah kavashyo dhavamanah | vrishanam | dvaro devirabhito vishrayantam | suvira vira mprathamana
    mahobhih || || ushasa nakta brihati brihanta m | payasvati sudughe shuramindra m | peshasvati tantuna
    sam vya~yanti | devana ssurukme || daivya mimana manasa purutra | hotaravindra yajnasya madhuna dadhana
    | pracina havisha vridhatah || tisro devir havisha vardhamanah | indra mpayasa sarasvati | ida devi
    bharati vishvatu rtih || tvashta dadhadindraya shushma 'cishturyashase puruni | vrisha yajan vrishana
    mbhuriretah | murdhan yajnasya samanaktu devan || vanaspati | tmanya samanjanchamita na devah | indrasya
    havyairjathara mprinanah | svadati havya mmadhuna ghritena || stokanamindu mprati shura indrah | vrishayamano
    vrishabha sturashat | ghritaprusha madhuna havyamundann | murdhan yajnasya jushatag svaha r ghritena
    catvari ca aindre prashnau vapadinam ya~jyanuvakyah acar shanipra vrishabho jananam | raja krishtina
    mpuruhuta indrah | stuta shshravasyannavasopamadrik | yuktva hari vrishana ''ya vivesha yanma dhishana
    jajana stavai pura paryadindra mahnah | agmhaso yatra piparadyatha no naveva yanta mubhaye havante
    |||| tagm sadhricirutayo vrishniyani | paugg syani niyutah sashcurindra nna sindhava ukthashushmah
    | uruvyacasagimra avishanti |||| satyamittanna tvavagm anyo asti | indra devo na martyo jyayan | ahannahi
    mparishayanamarnah | avasrijo 'po accha samudram || prasasahishe puruhuta shatrun | jyeshthaste shushma
    iha ratirastu | indrabhara dakshinena vasuni | pati ssindhunamasi revatinam || sa shevridhamadhidha
    dyumnamasme | mahi kshatra njanashadindra tavya m | raksha ca no maghonah pahi surin | raye ca na
    ssvapatya ishe dhah aindre prashnau anuyajanamekadasha maitravarunapraishah deva mbarhirindragm sudeva
    ve~dyamavardhayat | vasto rbhritam | raya barhishmato 'tyagat | vasuvane vasudheyasya vetu yaja ||
    devirdvara indragm sanghate | vidviryamannavardhayann | a vathsena tarunena kumarena ca mivita aparvanam
    | renukakata nnudantam | vasuvane vasudheyasya viyantu yaja || || devi ushasa nakta ya~jne prayatyahvetam
    | daivirvishah prayasishtam | suprite sudhite abhutam | vasuvane vasudheyasya vitam ya~ja || devi
    joshtri vasudhiti | devamindramavardhatam | aya 'gha dveshagmsi | a dvasu varyani | yajamanaya shikshite
    || || vasuvane vasudheyasya vitam ya~ja || devi urjahuti dughe sudughe | payasendramavardhatam | ishamurjamanya
    'va kshit | sagdhigm sapitimanya | navena purva ndayamane | puranena nava murjamurjahuti vasu varyani
    | yajamanaya shikshite | vasuvane vasudheyasya vitam || deva daivya hotara | devamindramavardhatam
    | hataghashagm savabha va~su varyani | yajamanaya shikshitau | vasuvane vasudheyasya vitam ya~ja ||
    devistisrastisro devih | patimindramavardhayann | asprikshadbharati diva m | rudrairyajnagm sarasvati
    | ida vasumati grihan || || vasuvane vasudheyasya viyantu yaja || deva indro narashagmsah | trivarutha
    strivandhurah | devamindramavardhayat | shatena shitiprishthanamahitah | sahasrena pravartate | mitravarunedasya
    hotramar hatah | brihaspatih stotram | ashvina ''ddhvaryavam | vasuvane vasudheyasya vetu yaja ||
    || deva indro vanaspatih | hiranyaparno madhushakha ssupippalah | devamindramavardhayat | divamagrenaprat
    | a mprithivimadrigmhit | vasuvane vasudheyasya vetu yaja || deva mbarahirvaritinam | devamindramavardhayat
    | svasastha mindrenasannam | anya barhig shyabhyabhut | vasuvane vasudheyasya vetu yaja || devo agni
    ssvishtakrit | devamindramavardhayat | svishta thsvishtakrit | svishtamadya karotu nah | vasuvane
    vasudheyasya vetu yaja || shikshite vasuvane vasudheyasya vitam rdevirdvaro devi ushasa nakta devi
    joshtri devi urjahuti deva daivya hotara shikshitau devistisrastisro devih pati ndeva indro narashagmso
    deva indro vanaspati mbarhirvaritina ddevam | vetu viyantu caturvitameko viyantu caturvetu | avardhayadavardhaya
    ntriravardhatameko 'vardhayagg shcaturavardhayat | vastora vathsena daivirayavishagm hatasprikshacchatena
    divamindragg svasasthagg svishtam | shikshite shikshite shikshitau | anuvakam pashutraye praya jartha
    maitravarunapraishah hota yaksha midaspade | ashvinendragm sarasvatim | ajo dhumro na godhumaih kvalairbheshajam
    | madhu shashpairna teja indriyam | paya ssomah parisruta ghrita mmadhu | viyantvajyasya hotaryaja
    || hota yakshattanunapa thsarasvati | avirmesho na bheshajam | patha madhumata ''bharann | ashvinendraya
    virya ssomah parisruta ghrita mmadhu | viyantvajyasya hotaryaja || hota yakshannarashagmsana m | patigm
    surayai bheshajam | mesha ssarasvati bhishak | ratho na candryashvino rvapa indrasya virya m | badarairupavakabhi
    ssomah parisruta ghrita mmadhu | viyantvajyasya hotaryaja || || hota yakshadidedita ajuhvana ssarasvatim
    | indra mbalena vardhayann | rishabhena gave ndriyam | ashvinendraya virya karkandhubhih | madhu lajairna
    masaram | paya ssomah parisruta ghrita mmadhu | viyantvajyasya hotaryaja || hota yaksha 'rnamradah
    | bhishannasatya || 'shva shishumati | bhishagdhenu ssarasvati | bhishagduha indraya bheshajam | paya
    ssomah parisruta ghrita mmadhu | viyantvajyasya hotaryaja || hota yakshadduro dishah | kavashyo na
    vyacasvatih | ashvibhya nna duro dishah | indro na rodasi dughe || ashvinendraya bheshajam | shukra
    nna jyotirindriyam | paya ssomah parisruta ghrita mmadhu | viyantvajyasya hotaryaja || hota yaksha
    thsupeshasoshe nakta | ashvina sanjanane | samanjate sarasvatya | tvishimindre na bheshajam | shyeno
    na rajasa hrida | paya ssomah parisruta ghrita || viyantvajyasya hotaryaja || hota yakshaddaivya hotara
    bhishaja nna jagrivi diva nakta nna bheshajaih | shushagm sarasvati bhishak | sisena duha indriyam
    | paya ssomah parisruta ghrita mmadhu | viyantvajyasya hotaryaja || hota yaksha ttisro devirna bheshajam
    | trayastridhatavo 'pasah | rupamindre hiranyaya || ashvineda na bharati | vaca sarasvati | maha indraya
    dadhurindriyam | paya ssomah parisruta ghrita mmadhu | viyantvajyasya hotaryaja || hota yakshattvashtara
    nna sarasvatim | ojo na jutirindriyam | vriko na rabhaso bhishak | yasha || shriya na masaram | paya
    ssomah parisruta ghrita mmadhu | viyantvajyasya hotaryaja || hota yaksha m | shamitaragm shatakratum
    | bhima nna manyugm rajanam m | sarasvati bhishak | indraya duha indriyam | paya ssomah parisruta
    ghrita mmadhu | viyantvajyasya hotaryaja || || hota yakshadagnigg m | svaha medasa mprithak | svaha
    chagamashvibhya m | svaha meshagm sarasvatyai | svahar mindraya sigmhaya sahasendriyam | svaha nna
    bheshajam | svaha somamindriyam | svahendragm sutramanagm savitaram m | svaha vanaspati mpatho na
    bheshajam | svaha devagm a 'gnigm hotrajjushano agni ssomah parisruta ghrita mmadhu | viyantvajyasya
    hotaryaja || hota yakshadashvina sarasvatimindragm sutramanam | ime soma ssuramanah | chagairna meshair
    ssutah | shashpairna tokmabhih | lajairmahasvantah | mada masarena parishkritah | shukrah payasvanto
    | prasthita vo madhushcutah | tanashvina sarasvatindrah sutrama vritraha | jushantagm saumya mmadhu
    | pibantu madantu viyantu soma ~viyantvajyasya hotaryaja ~viyantvajyasya hotaryaja 'gnigm shat | tanunapa
    thsapta | narashagmsamrishih | idedito yavairashtau | barhi 'shvina shukrannava | supeshasoshe naktamrishih|
    daivya hotara sisena rasah | tisrastvashtaramashtavashtau | vanaspatimrishih | agni ntrayodasha |
    ashvina dvadasha trayodasha | samidha ryavairashvina tvishimashvina na bheshajagm rupamashvina bhima
    pashutraye prayajayajya apriyah samiddho agnirashvina | tapto gharmo virat thsutah | duhe dhenu ssarasvati
