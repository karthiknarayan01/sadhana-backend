id: vith-vedic-accents
category: upanishad
name:
  english: vith Vedic accents
  devanagari: विथ् Vएदिच् अच्चेन्त्स्
content:
  english: t pramu̱cyate | sa̱yama̭dhiya̱no̱ divasakritam papa̭m nasha̱yati | pra̱tara̭dhiya̱no̱ ratrikritam
    papa̭m nasha̱yati | sayam pratah pra̭yunja̱no̱ papo'pa̭po bha̱vati | sarvatradhiyano'pavi̭ghno bha̱vati
    | dharmarthakamamoksha̭m ca vi̱ndati | idamatharvashirshamashishyaya̭ na de̱yam | yo yadi mo̭had da̱syati
    sa papi̭yan bha̱vati | sahasravartanadyam yam kama̭madhi̱te tam tamanḙna sa̱dhayet || 11|| anena
    ganapatima̭bhishi̱ncati sa va̭gmi bha̱vati | caturthyamana̭shnan ja̱pati sa vidya̭van bha̱vati | ityatharva̭nava̱kyam
    | brahmadyavara̭nam vi̱dyanna bibheti kada̭cane̱ti || 12|| yo durvankṷrairya̱jati sa vaishravanopa̭mo
    bha̱vati | yo la̭jairya̱jati sa yasho̭van bha̱vati | sa medha̭van bha̱vati | yo modakasahasrḙna ya̱jati
    sa vanchitaphalama̭vapno̱ti | yah sajya sami̭dbhirya̱jati sa sarvam labhate sa sa̭rvam la̱bhate ||
    13|| ashtau brahmanan samyag gra̭hayi̱tva suryavarca̭svi bha̱vati | suryagrahe ma̭hana̱dyam pratimasannidhau
    va ja̱ptva siddhama̭ntro bha̱vati | mahavighna
  devanagari: त् प्रमु॒च्यते । सा॒यम॑धीया॒नो॒ दिवसकृतं पापं॑ नाश॒यति । प्रा॒तर॑धीया॒नो॒ रात्रिकृतं पापं॑
    नाश॒यति । सायं प्रातः प्र॑युञ्जा॒नो॒ पापोऽपा॑पो भ॒वति । सर्वत्राधीयानोऽपवि॑घ्नो भ॒वति । धर्मार्थकाममोक्षं॑
    च वि॒न्दति । इदमथर्वशीर्षमशिष्याय॑ न दे॒यम् । यो यदि मो॑हाद् दा॒स्यति स पापी॑यान् भ॒वति । सहस्रावर्तनाद्यं
    यं काम॑मधी॒ते तं तमने॑न सा॒धयेत् ॥ ११॥ अनेन गणपतिम॑भिषि॒ञ्चति स वा॑ग्मी भ॒वति । चतुर्थ्यामन॑श्नन्
    ज॒पति स विद्या॑वान् भ॒वति । इत्यथर्व॑णवा॒क्यम् । ब्रह्माद्यावर॑णं वि॒द्यान्न बिभेति कदा॑चने॒ति ॥ १२॥
    यो दूर्वाङ्कु॑रैर्य॒जति स वैश्रवणोप॑मो भ॒वति । यो ला॑जैर्य॒जति स यशो॑वान् भ॒वति । स मेधा॑वान् भ॒वति
    । यो मोदकसहस्रे॑ण य॒जति स वाञ्छितफलम॑वाप्नो॒ति । यः साज्य समि॑द्भिर्य॒जति स सर्वं लभते स स॑र्वं ल॒भते
    ॥ १३॥ अष्टौ ब्राह्मणान् सम्यग् ग्रा॑हयि॒त्वा सूर्यवर्च॑स्वी भ॒वति । सूर्यग्रहे म॑हान॒द्यां प्रतिमासन्निधौ
    वा ज॒प्त्वा सिद्धम॑न्त्रो भ॒वति । महाविघ्ना
