id: narayana-kavaca
category: kavacha
name:
  english: narayana-kavaca
  devanagari: नरयन-कवच
content:
  english: rinu || 3|| vishvarupa uvaca | dhautanghripaniracamya sapavitra udanmukhah | kritasvangakaranyaso
    mantrabhyam vagyatah shucih || 4|| narayanamayam varma sannahyedbhaya agate | padayorjanunorurvorudare
    hridyathorasi || 5|| mukhe shirasyanupurvyadonkaradini vinyaset | om namo narayanayeti viparyayamathapi
    va || 6|| karanyasam tatah kuryaddvadashaksharavidyaya | pranavadiyakarantamangulyangushthaparvasu
    || 7|| nyaseddhridaya onkaram vikaramanu murdhani | shakaram tu bhruvormadhye nakaram shikhaya dishet
    || 8|| vekaram netrayoryunjyannakaram sarvasandhishu | makaramastramuddishya mantramurtirbhavedbudhah
    || 9|| savisargam phadantam tat sarvadikshu vinirdishet | om vishnave nama iti || 10|| atmanam paramam
    dhyayeddhyeyam shatshaktibhiryutam | vidyatejastapomurtimimam mantramudaharet || 11|| om harirvidadhyanmama
    sarvaraksham nyastanghripadmah patagendraprishthe | dararicarmasigadeshucapa
  devanagari: ृणु ॥ ३॥ विश्वरूप उवाच । धौताङ्घ्रिपाणिराचम्य सपवित्र उदङ्मुखः । कृतस्वाङ्गकरन्यासो मन्त्राभ्यां
    वाग्यतः शुचिः ॥ ४॥ नारायणमयं वर्म सन्नह्येद्भय आगते । पादयोर्जानुनोरूर्वोरुदरे हृद्यथोरसि ॥ ५॥ मुखे
    शिरस्यानुपूर्व्यादोङ्कारादीनि विन्यसेत् । ॐ नमो नारायणायेति विपर्ययमथापि वा ॥ ६॥ करन्यासं ततः कुर्याद्द्वादशाक्षरविद्यया
    । प्रणवादियकारान्तमङ्गुल्यङ्गुष्ठपर्वसु ॥ ७॥ न्यसेद्धृदय ओङ्कारं विकारमनु मूर्धनि । षकारं तु भ्रुवोर्मध्ये
    णकारं शिखया दिशेत् ॥ ८॥ वेकारं नेत्रयोर्युञ्ज्यान्नकारं सर्वसन्धिषु । मकारमस्त्रमुद्दिश्य मन्त्रमूर्तिर्भवेद्बुधः
    ॥ ९॥ सविसर्गं फडन्तं तत् सर्वदिक्षु विनिर्दिशेत् । ॐ विष्णवे नम इति ॥ १०॥ आत्मानं परमं ध्यायेद्ध्येयं
    षट्शक्तिभिर्युतम् । विद्यातेजस्तपोमूर्तिमिमं मन्त्रमुदाहरेत् ॥ ११॥ ॐ हरिर्विदध्यान्मम सर्वरक्षां न्यस्ताङ्घ्रिपद्मः
    पतगेन्द्रपृष्ठे । दरारिचर्मासिगदेषुचाप
