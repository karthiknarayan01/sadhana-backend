id: angaraka-ashtottara-sata-nama-stotram
category: stotram
name:
  english: Angaraka Ashtottara Sata Nama Stotram
content:
  english: mahisuto mahabhago mangalo mangalapradah | mahaviro mahashuro mahabalaparakramah || || maharaudro
    mahabhadro mananiyo dayakarah | manado'marshanah krurastapapapavivarjitah || || supratipah sutamrakshah
    subrahmanyah sukhapradah | vakrastambhadigamano varenyo varadah sukhi || || virabhadro virupaksho
    vidurastho vibhavasuh | nakshatracakrasancari kshatrapah kshatravarjitah || || kshayavriddhivinirmuktah
    kshamayukto vicakshanah | akshinaphaladah cakshurgocarah shubhalakshanah || || vitarago vitabhayo
    vijvaro vishvakaranah | nakshatrarashisancaro nanabhayanikrintanah || || kamaniyo dayasarah kanatkanakabhushanah
    | bhayaghno bhavyaphalado bhaktabhayavarapradah || || shatruhanta shamopetah sharanagataposhakah |
    sahasah sadguna'dhyakshah sadhuh samaradurjayah || || dushtadurah shishtapujyah sarvakashtanivarakah
    | dushceshtavarako duhkhabhanjano durdharo harih || || duhsvapnahanta durdharsho dushtagarvavimocakah
    | bharadvajakulodbhuto bhusuto bhavyabhushanah || || raktambaro raktavapurbhaktapalanatatparah | caturbhujo
    gadadhari meshavaho'mitashanah || || shaktishuladharah shaktah shastravidyavisharadah | tarkikastamasadharastapasvi
    tamralocanah || || taptakancanasankasho raktakinjalkasannibhah | gotradhidevo gomadhyacaro gunavibhushanah
    || || asrigangarako'vantideshadhisho janardanah | suryayamyapradeshastho yauvano yamyadinmukhah ||
    || trikonamandalagatastridashadhipasannutah | shucih shucikarah shuro shucivashyah shubhavahah ||
    || meshavrishcikarashisho medhavi mitabhashanah | sukhapradah surupakshah sarvabhishtaphalapradah
    || || iti shri angarakashtottarashatanama stotram |
  devanagari: महीसुतो महाभागो मङ्गलो मङ्गलप्रदः । महावीरो महाशूरो महाबलपराक्रमः ॥ ॥ महारौद्रो महाभद्रो
    माननीयो दयाकरः । मानदोऽमर्षणः क्रूरस्तापपापविवर्जितः ॥ ॥ सुप्रतीपः सुताम्राक्षः सुब्रह्मण्यः सुखप्रदः
    । वक्रस्तम्भादिगमनो वरेण्यो वरदः सुखी ॥ ॥ वीरभद्रो विरूपाक्षो विदूरस्थो विभावसुः । नक्षत्रचक्रसञ्चारी
    क्षत्रपः क्षात्रवर्जितः ॥ ॥ क्षयवृद्धिविनिर्मुक्तः क्षमायुक्तो विचक्षणः । अक्षीणफलदः चक्षुर्गोचरः
    शुभलक्षणः ॥ ॥ वीतरागो वीतभयो विज्वरो विश्वकारणः । नक्षत्रराशिसञ्चारो नानाभयनिकृन्तनः ॥ ॥ कमनीयो दयासारः
    कनत्कनकभूषणः । भयघ्नो भव्यफलदो भक्ताभयवरप्रदः ॥ ॥ शत्रुहन्ता शमोपेतः शरणागतपोषकः । साहसः सद्गुणाऽध्यक्षः
    साधुः समरदुर्जयः ॥ ॥ दुष्टदूरः शिष्टपूज्यः सर्वकष्टनिवारकः । दुश्चेष्टवारको दुःखभञ्जनो दुर्धरो हरिः
    ॥ ॥ दुःस्वप्नहन्ता दुर्धर्षो दुष्टगर्वविमोचकः । भरद्वाजकुलोद्भूतो भूसुतो भव्यभूषणः ॥ ॥ रक्ताम्बरो
    रक्तवपुर्भक्तपालनतत्परः । चतुर्भुजो गदाधारी मेषवाहोऽमिताशनः ॥ ॥ शक्तिशूलधरः शक्तः शस्त्रविद्याविशारदः
    । तार्किकस्तामसाधारस्तपस्वी ताम्रलोचनः ॥ ॥ तप्तकाञ्चनसङ्काशो रक्तकिञ्जल्कसन्निभः । गोत्राधिदेवो गोमध्यचरो
    गुणविभूषणः ॥ ॥ असृगङ्गारकोऽवन्तीदेशाधीशो जनार्दनः । सूर्ययाम्यप्रदेशस्थो यौवनो याम्यदिङ्मुखः ॥ ॥ त्रिकोणमण्डलगतस्त्रिदशाधिपसन्नुतः
    । शुचिः शुचिकरः शूरो शुचिवश्यः शुभावहः ॥ ॥ मेषवृश्चिकराशीशो मेधावी मितभाषणः । सुखप्रदः सुरूपाक्षः
    सर्वाभीष्टफलप्रदः ॥ ॥ इति श्री अङ्गारकाष्टोत्तरशतनाम स्तोत्रम् ।
