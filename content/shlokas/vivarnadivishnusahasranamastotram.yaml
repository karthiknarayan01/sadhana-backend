    vishrananagunakrantakamadhenusuradrumah | vibudhadvipasankrantagatigambhiryasadgunah || 134|| vidhumandalasankrantamukhakanjaprabhakalah
    | vibudhashvopasankrantavaishadyavishadashravah || 135|| vibudhaharasankrantamadhuryamadhuradharah
    | vibudhakshitivamakshikrantasaundaryavigrahah || 136|| visharatnopasankrantateja vishvapramanadit
