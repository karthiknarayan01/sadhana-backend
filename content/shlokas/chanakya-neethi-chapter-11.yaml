id: chanakya-neethi-chapter-11
category: stotram
name:
  english: Chanakya Neethi - Chapter 11
content:
  english: datritvam priyavaktritvam dhiratvamucitajnata | abhyasena na labhyante catvarah sahaja gunah
    || || atmavargam parityajya paravargam samashrayet | svayameva layam yati yatha rajanyadharmatah ||
    || hasti sthulatanuh sa cankushavashah kim hastimatro'nkusho dipe prajvalite pranashyati tamah kim
    dipamatram tamah | vajrenapi hatah patanti girayah kim vajramatram naga stejo yasya virajate sa balavansthuleshu
    kah pratyayah || || kalau dashasahasrani haristyajati medinim | tadardham jahnavitoyam tadardham gramadevatah
    || || grihasaktasya no vidya no daya mamsabhojinah | dravyalubdhasya no satyam strainasya na pavitrata
    || || na durjanah sadhudashamupaiti bahuprakarairapi shikshyamanah | amulasiktah payasa ghritena na
    nimbavriksho madhuratvameti || || antargatamalo dushtastirthasnanashatairapi | na shudhyati yatha
    bhandam suraya dahitam ca sat || || na vetti yo yasya gunaprakarsham sa tam sada nindati natra citram
    | yatha kirati karikumbhalabdham muktam parityajya bibharti gunjam || || ye tu samvatsaram purnam
    nityam maunena bhunjate | yugakotisahasram taih svargaloke mahiyate || || kamakrodhau tatha lobham
    svadushringarakautuke | atinidratiseve ca vidyarthi hyashta varjayet || || akrishtaphalamulena vanavasaratah
    sada | kurute'harahah shraddhamrishirviprah sa ucyate || || ekaharena santushtah shatkarmaniratah
    sada | ritukalabhigami ca sa vipro dvija ucyate || || laukike karmani ratah pashunam paripalakah |
    vanijyakrishikarma yah sa vipro vaishya ucyate || || lakshaditailanilinam kausumbhamadhusarpisham
    | vikreta madyamamsanam sa viprah shudra ucyate || || parakaryavihanta ca dambhikah svarthasadhakah
    | chali dveshi mriduh kruro vipro marjara ucyate || || vapikupatadaganamaramasuraveshmanam | ucchedane
    nirashankah sa vipro mleccha ucyate || || devadravyam gurudravyam paradarabhimarshanam | nirvahah
    sarvabhuteshu viprashcandala ucyate || || deyam bhojyadhanam dhanam sukritibhirno sancayastasya vai
    shrikarnasya baleshca vikramapateradyapi kirtih sthita | asmakam madhudanabhogarahitam natham ciratsancitam
    nirvanaditi naijapadayugalam dharshantyaho makshikah ||
  devanagari: दातृत्वं प्रियवक्तृत्वं धीरत्वमुचितज्ञता । अभ्यासेन न लभ्यन्ते चत्वारः सहजा गुणाः ॥ ॥ आत्मवर्गं
    परित्यज्य परवर्गं समाश्रयेत् । स्वयमेव लयं याति यथा राजान्यधर्मतः ॥ ॥ हस्ती स्थूलतनुः स चाङ्कुशवशः
    किं हस्तिमात्रोऽङ्कुशो दीपे प्रज्वलिते प्रणश्यति तमः किं दीपमात्रं तमः । वज्रेणापि हताः पतन्ति गिरयः
    किं वज्रमात्रं नगा स्तेजो यस्य विराजते स बलवान्स्थूलेषु कः प्रत्ययः ॥ ॥ कलौ दशसहस्राणि हरिस्त्यजति
    मेदिनीम् । तदर्धं जाह्नवीतोयं तदर्धं ग्रामदेवताः ॥ ॥ गृहासक्तस्य नो विद्या नो दया मांसभोजिनः । द्रव्यलुब्धस्य
    नो सत्यं स्त्रैणस्य न पवित्रता ॥ ॥ न दुर्जनः साधुदशामुपैति बहुप्रकारैरपि शिक्ष्यमाणः । आमूलसिक्तः
    पयसा घृतेन न निम्बवृक्षो मधुरत्वमेति ॥ ॥ अन्तर्गतमलो दुष्टस्तीर्थस्नानशतैरपि । न शुध्यति यथा भाण्डं
    सुराया दाहितं च सत् ॥ ॥ न वेत्ति यो यस्य गुणप्रकर्षं स तं सदा निन्दति नात्र चित्रम् । यथा किराती करिकुम्भलब्धां
    मुक्तां परित्यज्य बिभर्ति गुञ्जाम् ॥ ॥ ये तु संवत्सरं पूर्णं नित्यं मौनेन भुञ्जते । युगकोटिसहस्रं
    तैः स्वर्गलोके महीयते ॥ ॥ कामक्रोधौ तथा लोभं स्वादुशृङ्गारकौतुके । अतिनिद्रातिसेवे च विद्यार्थी ह्यष्ट
    वर्जयेत् ॥ ॥ अकृष्टफलमूलेन वनवासरतः सदा । कुरुतेऽहरहः श्राद्धमृषिर्विप्रः स उच्यते ॥ ॥ एकाहारेण सन्तुष्टः
    षट्कर्मनिरतः सदा । ऋतुकालाभिगामी च स विप्रो द्विज उच्यते ॥ ॥ लौकिके कर्मणि रतः पशूनां परिपालकः । वाणिज्यकृषिकर्मा
    यः स विप्रो वैश्य उच्यते ॥ ॥ लाक्षादितैलनीलीनां कौसुम्भमधुसर्पिषाम् । विक्रेता मद्यमांसानां स विप्रः
    शूद्र उच्यते ॥ ॥ परकार्यविहन्ता च दाम्भिकः स्वार्थसाधकः । छली द्वेषी मृदुः क्रूरो विप्रो मार्जार उच्यते
    ॥ ॥ वापीकूपतडागानामारामसुरवेश्मनाम् । उच्छेदने निराशङ्कः स विप्रो म्लेच्छ उच्यते ॥ ॥ देवद्रव्यं गुरुद्रव्यं
    परदाराभिमर्शनम् । निर्वाहः सर्वभूतेषु विप्रश्चाण्डाल उच्यते ॥ ॥ देयं भोज्यधनं धनं सुकृतिभिर्नो सञ्चयस्तस्य
    वै श्रीकर्णस्य बलेश्च विक्रमपतेरद्यापि कीर्तिः स्थिता । अस्माकं मधुदानभोगरहितं नाथं चिरात्सञ्चितं
    निर्वाणादिति नैजपादयुगलं धर्षन्त्यहो मक्षिकाः ॥
