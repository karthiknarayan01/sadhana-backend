id: gopalashtottarashatanamavalih
category: stotram
name:
  english: gopalashtottarashatanamavalih
  devanagari: गोपालाष्टोत्तरशतनामावलिः
content:
  english: shri gopalashtottarashatanamavalih om shri gopalabalatanayaya namah | om shri gopaya namah
    | om shri gokulanayakaya namah | om shri gopalaya namah | om shri gokulanandanaya namah | om shri
    gopasamrakshanotsukaya namah | om shri govatsarupine namah | om shri goposhiane namah | om shri gopikasutarupabhrite
    namah | om shri gopibhritadadhikshirashikyabhajanalunthakaya namah | 10 om shri gopikagandasamsaktashrimadvadanapamkajaya
    namah | om shri gopikasamgamollasaya namah | om shri gopikakucamardanaya namah | om shri gopika'kshyamjanasaktamamjuladharapallavaya
    namah | om shri gopikaradanasandashtaraktimadharavidrumaya namah | om shri gopipinakucadvandva mardanatyantanirdayaya
    namah | om shri gopikaganasamsaktaya namah | om shri gopikanartanotsukaya namah | om shri gopisambhashanarataya
    namah | om shri gopakridamahotsavaya namah | 20 om shri gopivastrapaharine namah | om shri gopikritanakhakshataya
    namah | om shri gopikasahabhoktre namah | om shri gopikapadasevakaya namah | om shri gopikadhavarupaya
    namah | om shri gopastriveshamurtibhrite namah | om shri gopigananusaranamuraḻiganaramjakaya namah
    | om shri gopikapunyanivahaya namah | om shri gopikajanavallabhaya namah | om shri gopikadattasupannadadhikshiraghritashaya
    namah | 30 om shri gopicarcitatambulagrahanotsukamanasaya namah | om shri gopibhuktavashishtannasampuritanijodaraya
    namah | om shri gopimukhabjamartandaya namah | om shri gopinayanagocaraya namah | om shri gopastripamcavishikhaya
    namah | om shri gopikahridayalayaya namah | om shri gopihridabjabhramaraya namah | om shri gopicaritraganavate
    namah | om shri gopastriparamapritaya namah | om shri gopikadhyananishtavate namah | 40 om shri gopastrimadhyasamsthitaya
    namah | om shri gopanarimanoharine namah | om shri gopastridattabhushanaya namah | om shri gopisaudaminimeghaya
    namah | om shri gopiniradhicandramase namah | om shri gopikalamkritatyantasukshmacchoshnishakamcukaya
    namah | om shri gopibhujopadhanaya namah | om shri gopicittaphalapradaya namah | om shri gopikasamgamashrantaya
    namah | 50 om shri gopihridayasamsthitaya namah | om shri gopipullamukhambhojamadhvasvadanabambharaya
    namah | om shri gopastridantapidyaya namah | om shri gopisallapa sadaraya namah | om shri gopivamamkasamrudhaya
    namah | om shri gopikabhyamjanodyataya namah | om shri gopibhavaparijnatre namah | om shri gopastridarshanonmishaya
    namah | om shri gopikasutapritaya namah | om shri gopikalinganotsukaya namah | 60 om shri govardhanacaloddharte
    namah | om shri godohanalasatkaraya namah | om shri govrindavitaya namah | om shri govindaya namah
    | om shri gopikagopagovritaya namah | om shri gopalanganasamcarine namah | om shri gopabalanuramjakaya
    namah | om shri govrataya namah | om shri gopikartipradaya namah | om shri gonamabhushine namah |
    70 om shri gogoptre namah | om shri gopamanasaranjakaya namah | om shri gosahasralimadhyasthaya namah
    | om shri gopabalashatavritaya namah | om shri govrindabhashavijatre namah | om shri gopadravyapaharakaya
    namah | om shri gopaveshaya namah | om shri gopanathaya namah | om shri gopabhushanasambhramaya namah
    | om shri gopadasaya namah | 80 om shri gopapujyaya namah | om shri gopalakashubhapradaya namah |
    om shri gopanetre namah | om shri gopasakhaya namah | om shri gopasamkatamocakaya namah | om shri
    gopamatre namah | om shri gopapitre namah | om shri gopabhratre namah | om shri gopanaya namah | om
    shri gopabandhave namah | 90 om shri gopapunyaya namah | om shri gopasamtanabhuruhaaya namah | om
    shri gopalanitadadhyannabhoktre namah | om shri gopalaranjakaya namah | om shri gopalapranadhatre
    namah | om shri gopagopijanavritaya namah | om shri gokulotsavasamtoshaya namah | om shri godadhikshiracorakaya
    namah | om shri govardhanarataya namah | om shri gopigopahvanakritadaraya namah | 100 om shri gograsadharine
    namah | om shri gokamdunivarananakhavalaye namah | om shri gohitaya namah | om shri gokularadhyaya
    namah | om shri gogopijanavallabhaya namah | om shrimate namah | 106 || shri gopalashtottarashatanamavalih
    sampurna || || om tatsat ||
  devanagari: श्री गोपालाष्टोत्तरशतनामावलिः ॐ श्री गोपालबालतनयाय नमः । ॐ श्री गोपाय नमः । ॐ श्री गोकुलनायकाय
    नमः । ॐ श्री गोपालाय नमः । ॐ श्री गोकुलनन्दनाय नमः । ॐ श्री गोपसंरक्षणोत्सुकाय नमः । ॐ श्री गोवत्सरूपिणे
    नमः । ॐ श्री गोपोषिअणे नमः । ॐ श्री गोपिकासुतरूपभृते नमः । ॐ श्री गोपीभृतदधिक्षीरशिक्यभाजनलुण्ठकाय
    नमः । १० ॐ श्री गोपिकागण्डसंसक्तश्रीमद्वदनपंकजाय नमः । ॐ श्री गोपिकासंगमोल्लासाय नमः । ॐ श्री गोपिकाकुचमर्दनाय
    नमः । ॐ श्री गोपिकाऽक्ष्यंजनासक्तमंजुलाधरपल्लवाय नमः । ॐ श्री गोपिकारदनसन्दष्टरक्तिमाधरविद्रुमाय नमः
    । ॐ श्री गोपीपीनकुचद्वन्द्व मर्दनात्यन्तनिर्दयाय नमः । ॐ श्री गोपिकागानसंसक्तय नमः । ॐ श्री गोपिकानर्तनोत्सुकाय
    नमः । ॐ श्री गोपीसंभाषणरताय नमः । ॐ श्री गोपक्रीडामहोत्सवाय नमः । २० ॐ श्री गोपीवस्त्रापहारिणे नमः
    । ॐ श्री गोपीकृतनखक्षताया नमः । ॐ श्री गोपिकासहभोक्त्रे नमः । ॐ श्री गोपिकापादसेवकाय नमः । ॐ श्री
    गोपिकाधवरूपाय नमः । ॐ श्री गोपस्त्रीवेषमूर्तिभृते नमः । ॐ श्री गोपीगानानुसरणमुरळीगानरंजकाय नमः । ॐ
    श्री गोपिकापुण्यनिवहाय नमः । ॐ श्री गोपिकाजनवल्लभाय नमः । ॐ श्री गोपिकादत्तसूपान्नदधिक्षीरघृताशाय
    नमः । ३० ॐ श्री गोपीचर्चिततांबूलग्रहणोत्सुकमानसाय नमः । ॐ श्री गोपीभुक्तावशिष्टान्नसंपूरितनिजोदराय
    नमः । ॐ श्री गोपीमुखाब्जमार्ताण्डाय नमः । ॐ श्री गोपीनयनगोचराय नमः । ॐ श्री गोपस्त्रीपंचविशिखाय नमः
    । ॐ श्री गोपिकाहृदयालयाय नमः । ॐ श्री गोपीहृदब्जभ्रमराय नमः । ॐ श्री गोपीचरित्रगानवते नमः । ॐ श्री
    गोपस्त्रीपरमप्रीताय नमः । ॐ श्री गोपिकाध्याननिष्टावते नमः । ४० ॐ श्री गोपस्त्रीमध्यसंस्थिताय नमः ।
    ॐ श्री गोपनारीमनोहारिणे नमः । ॐ श्री गोपस्त्रीदत्तभूषणाय नमः । ॐ श्री गोपीसौदामिनीमेघाय नमः । ॐ श्री
    गोपीनीरधिचन्द्रमसे नमः । ॐ श्री गोपिकालंकृतात्यन्तसूक्ष्माच्छोष्णीषकंचुकाय नमः । ॐ श्री गोपीभुजोपधानाय
    नमः । ॐ श्री गोपीचित्तफलप्रदाय नमः । ॐ श्री गोपिकासंगमश्रान्ताय नमः । ५० ॐ श्री गोपीहृदयसंस्थिताय
    नमः । ॐ श्री गोपीपुल्लमुखांभोजमध्वास्वादनबंभराय नमः । ॐ श्री गोपस्त्रीदन्तपीड्याय नमः । ॐ श्री गोपिसल्लाप
    सादराय नमः । ॐ श्री गोपीवामांकसंरूढाय नमः । ॐ श्री गोपिकाभ्यंजनोद्यताय नमः । ॐ श्री गोपीभावपरिज्ञात्रे
    नमः । ॐ श्री गोपस्त्रीदर्शनोन्मीषाय नमः । ॐ श्री गोपिकासुतप्रीताय नमः । ॐ श्री गोपिकालिङ्गनोत्सुकाय
    नमः । ६० ॐ श्री गोवर्धनाचलोद्धर्ते नमः । ॐ श्री गोदोहनलसत्कराय नमः । ॐ श्री गोवृन्दवीताय नमः । ॐ श्री
    गोविन्दाय नमः । ॐ श्री गोपिकागोपगोवृताय नमः । ॐ श्री गोपालाङ्गणसंचारिणे नमः । ॐ श्री गोपबालानुरंजकाय
    नमः । ॐ श्री गोव्रताय नमः । ॐ श्री गोपिकार्तिप्रदाय नमः । ॐ श्री गोनामभूषिणे नमः । ७० ॐ श्री गोगोप्त्रे
    नमः । ॐ श्री गोपमानसरञ्जकाय नमः । ॐ श्री गोसहस्रालिमध्यस्थाय नमः । ॐ श्री गोपबालशतावृताय नमः । ॐ श्री
    गोवृन्दभाषाविजात्रे नमः । ॐ श्री गोपद्रव्यापहारकाय नमः । ॐ श्री गोपवेषाय नमः । ॐ श्री गोपनाथाय नमः
    । ॐ श्री गोपभूषणसंभ्रमाय नमः । ॐ श्री गोपदासाय नमः । ८० ॐ श्री गोपपूज्याय नमः । ॐ श्री गोपालकशुभप्रदाय
    नमः । ॐ श्री गोपनेत्रे नमः । ॐ श्री गोपसखाय नमः । ॐ श्री गोपसंकटमोचकाय नमः । ॐ श्री गोपमात्रे नमः
    । ॐ श्री गोपपित्रे नमः । ॐ श्री गोपभ्रात्रे नमः । ॐ श्री गोपनाय नमः । ॐ श्री गोपबन्धवे नमः । ९० ॐ
    श्री गोपपुण्याय नमः । ॐ श्री गोपसंतानभूरुहाअय नमः । ॐ श्री गोपालानीतदध्यन्नभोक्त्रे नमः । ॐ श्री गोपालरञ्जकाय
    नमः । ॐ श्री गोपालप्राणधात्रे नमः । ॐ श्री गोपगोपीजनावृताय नमः । ॐ श्री गोकुलोत्सवसंतोषाय नमः । ॐ
    श्री गोदधिक्षीरचोरकाय नमः । ॐ श्री गोवर्धनरताय नमः । ॐ श्री गोपीगोपाह्वानकृतादराय नमः । १०० ॐ श्री
    गोग्रासधारिणे नमः । ॐ श्री गोकंडूनिवारणनखावलये नमः । ॐ श्री गोहिताय नमः । ॐ श्री गोकुलाराध्याय नमः
    । ॐ श्री गोगोपीजनवल्लभाय नमः । ॐ श्रीमते नमः । १०६ ॥ श्री गोपालाष्टोत्तरशतनामावलिः संपूर्णा ॥ ॥ ॐ
    तत्सत् ॥
