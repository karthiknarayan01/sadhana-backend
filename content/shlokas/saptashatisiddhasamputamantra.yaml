id: saptashatisiddhasamputamantra
category: mantra
name:
  english: saptashatisiddhasamputamantra
  devanagari: सप्तशतीसिद्धसम्पुटमन्त्र
content:
  english: samasta vidyaom ki aur samasta striyom mem matribhava ki prapti ke liye vidya samastastava
    devi bhedah striyah samastah sakala jagatsu | tvaikaya puritamambayaitat | ka te stutih stavyapara
    parokttih || 20
  devanagari: समस्त विद्याओं की और् समस्त स्त्रियों में मातृभाव की प्राप्ति के लिये विद्या समस्तास्तव
    देवि भेदाः स्त्रियः समस्ताः सकला जगत्सु । त्वैकया पूरितमम्बयैतत् । का ते स्तुतिः स्तव्यपरा परोक्त्तिः
    ॥ २०
meaning: {}
