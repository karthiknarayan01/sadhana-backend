id: shiva-sankalpa-upanishad-shiva-sankalpamastu
category: stotram
name:
  english: Shiva Sankalpa Upanishad (Shiva Sankalpamastu)
content:
  english: yenedam bhutam bhuvanam bhavishyat parigrihitamamritena sarvam | yena yajnastayate saptahota
    tanme manah shivasankalpamastu || || yena karmani pracaranti dhira yato vaca manasa caru yanti | yatsammitamanu
    samyanti praninastanme manah shivasankalpamastu || || yena karmanyapaso manishino yajne krinvanti
    vidatheshu dhirah | yadapurvam yakshamantah prajanam tanme manah shivasankalpamastu || || yatprajnanamuta
    ceto dhritishca yajjyotirantaramritam prajasu | yasmanna rite kincana karma kriyate tanme manah shivasankalpamastu
    || || susharathirashvaniva yanmanushyanneniyate'bhishubhirvajina iva | hritpratishtham yadajiram javishtham
    tanme manah shivasankalpamastu || || yasminnricah sama yajushi yasmin pratishthita rathanabhavivarah
    | yasmimshcittam sarvamotam prajanam tanme manah shivasankalpamastu || || yadatra shashtham trishatam
    suviram yajnasya guhyam navanavamayyam | dasha panca trimshatam yatparam ca tanme manah shivasankalpamastu
    || || yajjagrato duramudaiti daivam tadu suptasya tathaivaiti | durangamam jyotisham jyotirekam tanme
    manah shivasankalpamastu || || yena dyauh prithivi cantariksham ca ye parvatah pradisho dishashca
    | yenedam jagadvyaptam prajanam tanme manah shivasankalpamastu || || yenedam vishvam jagato babhuva
    ye deva api mahato jatavedah | tadevagnistamaso jyotirekam tanme manah shivasankalpamastu || || ye
    mano hridayam ye ca deva ye divya apo ye suryarashmih | te shrotre cakshushi sancarantam tanme manah
    shivasankalpamastu || || acintyam caprameyam ca vyaktavyaktaparam ca yat | sukshmatsukshmataram jneyam
    tanme manah shivasankalpamastu || || eka ca dasha shatam ca sahasram cayutam ca niyutam ca prayutam
    carbudam ca nyarbudam ca | samudrashca madhyam cantashca parardhashca tanme manah shivasankalpamastu
    || || ye panca pancadasha shatam sahasramayutam nyarbudam ca | te'gnicityeshtakastam shariram tanme
    manah shivasankalpamastu || || vedahametam purusham mahantamadityavarnam tamasah parastat | yasya
    yonim paripashyanti dhirastanme manah shivasankalpamastu || || yasyedam dhirah punanti kavayo brahmanametam
    tva vrinuta indum | sthavaram jangamam dyaurakasham tanme manah shivasankalpamastu || || parat parataram
    caiva yatparaccaiva yatparam | yatparat parato jneyam tanme manah shivasankalpamastu || || parat parataro
    brahma tatparat parato harih | tatparat parato'dhishastanme manah shivasankalpamastu || || ya vedadishu
    gayatri sarvavyapi maheshvari | rigyajussamatharvaishca tanme manah shivasankalpamastu || || yo vai
    devam mahadevam pranavam purushottamam | yah sarve sarvavedaishca tanme manah shivasankalpamastu ||
    || prayatah pranavonkaram pranavam purushottamam | onkaram pranavatmanam tanme manah shivasankalpamastu
    || || yo'sau sarveshu vedeshu pathyate hyaja ishvarah | akayo nirguno hyatma tanme manah shivasankalpamastu
    || || gobhirjushtam dhanena hyayusha ca balena ca | prajaya pashubhih pushkaraksham tanme manah shivasankalpamastu
    || yajamahe sugandhim pushtivardhanam | urvarukamiva bandhananmrityormukshiya ma'mritattanme manah
    shivasankalpamastu || || kailasashikhare ramye shankarasya shivalaye | devatastatra modante tanme
    manah shivasankalpamastu || || vishvatashcakshuruta vishvatomukho vishvatohasta uta vishvataspat |
    sambahubhyam namati sampatatrairdyavaprithivi janayan deva ekastanme manah shivasankalpamastu || ||
    caturo vedanadhiyita sarvashastramayam viduh | itihasapurananam tanme manah shivasankalpamastu ||
    || ma no mahantamuta ma no arbhakam ma na ukshantamuta ma na ukshitam | ma no vadhih pitaram mota
    mataram priya ma nah tanuvo rudra ririshastanme manah shivasankalpamastu || || ma nastoke tanaye ma
    na ayushi ma no goshu ma no ashveshu ririshah | viranma no rudra bhamito vadhirhavishmantah namasa
    vidhema te tanme manah shivasankalpamastu || || ritam satyam param brahma purusham krishnapingalam
    | urdhvaretam virupaksham vishvarupaya vai namo namah tanme manah shivasankalpamastu || || kadrudraya
    pracetase midhushtamaya tavyase | vocema shantamam hride | sarvo hyesha rudrastasmai rudraya namo
    astu tanme manah shivasankalpamastu || || brahma jajnanam prathamam purastat vi simatah suruco vena
    avah | sa budhniya upama asya vishthah satashca yonim asatashca vivastanme manah shivasankalpamastu
    || || yah pranato nimishato mahitvaika idraja jagato babhuva | ya ishe asya dvipadashcatushpadah kasmai
    devaya havisha vidhema tanme manah shivasankalpamastu || || ya atmada balada yasya vishve upasate
    prashisham yasya devah | yasya chaya'mritam yasya mrityuh kasmai devaya havisha vidhema tanme manah
    shivasankalpamastu || || yo rudro agnau yo apsu ya oshadhishu yo rudro vishva bhuvana''vivesha | tasmai
    rudraya namo astu tanme manah shivasankalpamastu || || gandhadvaram duradharsham nityapushtam karishinim
    | ishvarim sarvabhutanam tamihopahvaye shriyam tanme manah shivasankalpamastu || || ya idam shivasankalpam
    sada dhyayanti brahmanah | te param moksham gamishyanti tanme manah shivasankalpamastu || || iti shivasankalpamantrah
    samaptah | iti shivasankalpopanishat samapta |
  devanagari: येनेदं भूतं भुवनं भविष्यत् परिगृहीतममृतेन सर्वम् । येन यज्ञस्तायते सप्तहोता तन्मे मनः शिवसङ्कल्पमस्तु
    ॥ ॥ येन कर्माणि प्रचरन्ति धीरा यतो वाचा मनसा चारु यन्ति । यत्सम्मितमनु संयन्ति प्राणिनस्तन्मे मनः
    शिवसङ्कल्पमस्तु ॥ ॥ येन कर्माण्यपसो मनीषिणो यज्ञे कृण्वन्ति विदथेषु धीराः । यदपूर्वं यक्षमन्तः प्रजानां
    तन्मे मनः शिवसङ्कल्पमस्तु ॥ ॥ यत्प्रज्ञानमुत चेतो धृतिश्च यज्ज्योतिरन्तरमृतं प्रजासु । यस्मान्न ऋते
    किञ्चन कर्म क्रियते तन्मे मनः शिवसङ्कल्पमस्तु ॥ ॥ सुषारथिरश्वानिव यन्मनुष्यान्नेनीयतेऽभीशुभिर्वाजिन
    इव । हृत्प्रतिष्ठं यदजिरं जविष्ठं तन्मे मनः शिवसङ्कल्पमस्तु ॥ ॥ यस्मिन्नृचः साम यजूषि यस्मिन् प्रतिष्ठिता
    रथनाभाविवाराः । यस्मिंश्चित्तं सर्वमोतं प्रजानां तन्मे मनः शिवसङ्कल्पमस्तु ॥ ॥ यदत्र षष्ठं त्रिशतं
    सुवीरं यज्ञस्य गुह्यं नवनावमाय्यं । दश पञ्च त्रिंशतं यत्परं च तन्मे मनः शिवसङ्कल्पमस्तु ॥ ॥ यज्जाग्रतो
    दूरमुदैति दैवं तदु सुप्तस्य तथैवैति । दूरङ्गमं ज्योतिषां ज्योतिरेकं तन्मे मनः शिवसङ्कल्पमस्तु ॥ ॥
    येन द्यौः पृथिवी चान्तरिक्षं च ये पर्वताः प्रदिशो दिशश्च । येनेदं जगद्व्याप्तं प्रजानां तन्मे मनः
    शिवसङ्कल्पमस्तु ॥ ॥ येनेदं विश्वं जगतो बभूव ये देवा अपि महतो जातवेदाः । तदेवाग्निस्तमसो ज्योतिरेकं
    तन्मे मनः शिवसङ्कल्पमस्तु ॥ ॥ ये मनो हृदयं ये च देवा ये दिव्या आपो ये सूर्यरश्मिः । ते श्रोत्रे चक्षुषी
    सञ्चरन्तं तन्मे मनः शिवसङ्कल्पमस्तु ॥ ॥ अचिन्त्यं चाप्रमेयं च व्यक्ताव्यक्तपरं च यत् । सूक्ष्मात्सूक्ष्मतरं
    ज्ञेयं तन्मे मनः शिवसङ्कल्पमस्तु ॥ ॥ एका च दश शतं च सहस्रं चायुतं च नियुतं च प्रयुतं चार्बुदं च न्यर्बुदं
    च । समुद्रश्च मध्यं चान्तश्च परार्धश्च तन्मे मनः शिवसङ्कल्पमस्तु ॥ ॥ ये पञ्च पञ्चदश शतं सहस्रमयुतं
    न्यर्बुदं च । तेऽग्निचित्येष्टकास्तं शरीरं तन्मे मनः शिवसङ्कल्पमस्तु ॥ ॥ वेदाहमेतं पुरुषं महान्तमादित्यवर्णं
    तमसः परस्तात् । यस्य योनिं परिपश्यन्ति धीरास्तन्मे मनः शिवसङ्कल्पमस्तु ॥ ॥ यस्येदं धीराः पुनन्ति कवयो
    ब्रह्माणमेतं त्वा वृणुत इन्दुम् । स्थावरं जङ्गमं द्यौराकाशं तन्मे मनः शिवसङ्कल्पमस्तु ॥ ॥ परात् परतरं
    चैव यत्पराच्चैव यत्परम् । यत्परात् परतो ज्ञेयं तन्मे मनः शिवसङ्कल्पमस्तु ॥ ॥ परात् परतरो ब्रह्मा तत्परात्
    परतो हरिः । तत्परात् परतोऽधीशस्तन्मे मनः शिवसङ्कल्पमस्तु ॥ ॥ या वेदादिषु गायत्री सर्वव्यापी महेश्वरी
    । ऋग्यजुस्सामाथर्वैश्च तन्मे मनः शिवसङ्कल्पमस्तु ॥ ॥ यो वै देवं महादेवं प्रणवं पुरुषोत्तमम् । यः सर्वे
    सर्ववेदैश्च तन्मे मनः शिवसङ्कल्पमस्तु ॥ ॥ प्रयतः प्रणवोङ्कारं प्रणवं पुरुषोत्तमम् । ओङ्कारं प्रणवात्मानं
    तन्मे मनः शिवसङ्कल्पमस्तु ॥ ॥ योऽसौ सर्वेषु वेदेषु पठ्यते ह्यज इश्वरः । अकायो निर्गुणो ह्यात्मा तन्मे
    मनः शिवसङ्कल्पमस्तु ॥ ॥ गोभिर्जुष्टं धनेन ह्यायुषा च बलेन च । प्रजया पशुभिः पुष्कराक्षं तन्मे मनः
    शिवसङ्कल्पमस्तु ॥ यजामहे सुगन्धिं पुष्टिवर्धनम् । उर्वारुकमिव बन्धनान्मृत्योर्मुक्षीय माऽमृतात्तन्मे
    मनः शिवसङ्कल्पमस्तु ॥ ॥ कैलासशिखरे रम्ये शङ्करस्य शिवालये । देवतास्तत्र मोदन्ते तन्मे मनः शिवसङ्कल्पमस्तु
    ॥ ॥ विश्वतश्चक्षुरुत विश्वतोमुखो विश्वतोहस्त उत विश्वतस्पात् । सम्बाहुभ्यां नमति सम्पतत्रैर्द्यावापृथिवी
    जनयन् देव एकस्तन्मे मनः शिवसङ्कल्पमस्तु ॥ ॥ चतुरो वेदानधीयीत सर्वशास्त्रमयं विदुः । इतिहासपुराणानां
    तन्मे मनः शिवसङ्कल्पमस्तु ॥ ॥ मा नो महान्तमुत मा नो अर्भकं मा न उक्षन्तमुत मा न उक्षितम् । मा नो वधीः
    पितरं मोत मातरं प्रिया मा नः तनुवो रुद्र रीरिषस्तन्मे मनः शिवसङ्कल्पमस्तु ॥ ॥ मा नस्तोके तनये मा न
    आयुषि मा नो गोषु मा नो अश्वेषु रीरिषः । वीरान्मा नो रुद्र भामितो वधीर्हविष्मन्तः नमसा विधेम ते तन्मे
    मनः शिवसङ्कल्पमस्तु ॥ ॥ ऋतं सत्यं परं ब्रह्म पुरुषं कृष्णपिङ्गलम् । ऊर्ध्वरेतं विरूपाक्षं विश्वरूपाय
    वै नमो नमः तन्मे मनः शिवसङ्कल्पमस्तु ॥ ॥ कद्रुद्राय प्रचेतसे मीढुष्टमाय तव्यसे । वोचेम शन्तमं हृदे
    । सर्वो ह्येष रुद्रस्तस्मै रुद्राय नमो अस्तु तन्मे मनः शिवसङ्कल्पमस्तु ॥ ॥ ब्रह्म जज्ञानं प्रथमं पुरस्तात्
    वि सीमतः सुरुचो वेन आवः । स बुध्निया उपमा अस्य विष्ठाः सतश्च योनिं असतश्च विवस्तन्मे मनः शिवसङ्कल्पमस्तु
    ॥ ॥ यः प्राणतो निमिषतो महित्वैक इद्राजा जगतो बभूव । य ईशे अस्य द्विपदश्चतुष्पदः कस्मै देवाय हविषा
    विधेम तन्मे मनः शिवसङ्कल्पमस्तु ॥ ॥ य आत्मदा बलदा यस्य विश्वे उपासते प्रशिषं यस्य देवाः । यस्य छायाऽमृतं
    यस्य मृत्युः कस्मै देवाय हविषा विधेम तन्मे मनः शिवसङ्कल्पमस्तु ॥ ॥ यो रुद्रो अग्नौ यो अप्सु य ओषधीषु
    यो रुद्रो विश्वा भुवनाऽऽविवेश । तस्मै रुद्राय नमो अस्तु तन्मे मनः शिवसङ्कल्पमस्तु ॥ ॥ गन्धद्वारां
    दुराधर्षां नित्यपुष्टां करीषिणीम् । ईश्वरीं सर्वभूतानां तामिहोपह्वये श्रियं तन्मे मनः शिवसङ्कल्पमस्तु
    ॥ ॥ य इदं शिवसङ्कल्पं सदा ध्यायन्ति ब्राह्मणाः । ते परं मोक्षं गमिष्यन्ति तन्मे मनः शिवसङ्कल्पमस्तु
    ॥ ॥ इति शिवसङ्कल्पमन्त्राः समाप्ताः । इति शिवसङ्कल्पोपनिषत् समाप्ता ।
