    आयसु देइअ देव अब सबि सुधारी मोरि ॥ ॥ प्रभु पद पदुम पराग दोहाई। सत्य सुकृत सुख सीवँ सुहाई ॥ सो करि
    कहुँ हिए अपने की। रुचि जागत सोवत सपने की ॥ सहज सनेहँ स्वामि सेवकाई। स्वारथ छल फल चारि बिहाई ॥ अग्या
    सम न सुसाहिब सेवा। सो प्रसादु जन पावै देवा ॥ अस कहि प्रेम बिबस भे भारी। पुलक सरीर बिलोचन बारी ॥ प्रभु
    पद कमल गहे अकुलाई। समु सनेहु न सो कहि जाई ॥ कृपासिन्धु सनमानि सुबानी। बैठाए समीप गहि पानी ॥ भरत बिनय
    सुनि देखि सुभ् । सिथिल सनेहँ सभा रघुर् रघुराउ सिथिल सनेहँ साधु समाज मुनि मिथिला धनी। मन महुँ सराहत
    भरत भायप भगति की महिमा घनी ॥ भरतहि प्रसंसत बिबुध बरषत सुमन मानस मलिन से। तुलसी बिकल सब लोग सुनि सकुचे
    निसागम नलिन से ॥ सो देखि दुखारी दीन दुहु समाज नर नारि सब। मघवा महा मलीन मुए मारि मङ्गल चहत ॥ ॥ कपट
    कुचालि सीवँ सुरराजू। पर अकाज प्रिय आपन काजू ॥ काक समान पाकरिपु रीती। छली मलीन कतहुँ न प्रतीती ॥ प्रथम
    कुमत करि कपटु सँकेला। सो उचाटु सब कें सिर मेला ॥ सुरमायाँ सब लोग बिमोहे। राम प्रेम अतिसय न बिछोहे
    ॥ भय उचाट बस मन थिर नाहीं। छन बन रुचि छन सदन सोहाहीम् ॥ दुबिध मनोगति प्रजा दुखारी। सरित सिन्धु सङ्गम
    जनु बारी ॥ दुचित कतहुँ परितोषु न लहहीं। एक एक सन मरमु न कहहीम् ॥ लखि हियँ हँसि कह कृपानिधानू। सरिस
    स्वान मघवान जुबानू ॥ दो भरतु जनकु मुनिजन सचिव साधु सचेत बिहाइ। लागि देवमाया सबहि जथाजोगु जनु पाइ ॥
    ॥ कृपासिन्धु लखि लोग दुखारे। निज सनेहँ सुरपति छल भारे ॥ सभा राउ गुर महिसुर मन्त्री। भरत भगति सब कै
    मति जन्त्री ॥ रामहि चितवत चित्र लिखे से। सकुचत बोलत बचन सिखे से ॥ भरत प्रीति नति बिनय बड़आई। सुनत
    सुखद बरनत कठिनाई ॥ जासु बिलोकि भगति लवलेसू। प्रेम मगन मुनिगन मिथिलेसू ॥ महिमा तासु कहै किमि तुलसी।
    भगति सुभायँ सुमति हियँ हुलसी ॥ आपु छोटि महिमा बड़इ जानी। कबिकुल कानि मानि सकुचानी ॥ कहि न सकति गुन
    रुचि अधिकाई। मति गति बाल बचन की नाई ॥ दो भरत बिमल जसु बिमल बिधु सुमति चकोरकुमारि। उदित बिमल जन हृदय
    नभ एकटक रही निहारि ॥ ॥ भरत सुभाउ न सुगम निगमहूँ। लघु मति चापलता कबि छमहूँ ॥ कहत सुनत सति भाउ भरत को।
    सीय राम पद होइ न रत को ॥ सुमिरत भरतहि प्रेमु राम को। जेहि न सुलभ तेहि सरिस बाम को ॥ देखि दयाल दसा
    सबही की। राम सुजान जानि जन जी की ॥ धरम धुरीन धीर नय नागर। सत्य सनेह सील सुख सागर ॥ देसु काल लखि समु
    समाजू। नीति प्रीति पालक रघुराजू ॥ बोले बचन बानि सरबसु से। हित परिनाम सुनत ससि रसु से ॥ तात भरत तुम्ह
    धरम धुरीना। लोक बेद बिद प्रेम प्रबीना ॥ दो करम बचन मानस बिमल तुम्ह समान तुम्ह तात। गुर समाज लघु बन्धु
    गुन कुसमयँ किमि कहि जात ॥ ॥ जानहु तात तरनि कुल रीती। सत्यसन्ध पितु कीरति प्रीती ॥ समु समाजु लाज गुरुजन
    की। उदासीन हित अनहित मन की ॥ तुम्हहि बिदित सबही कर करमू। आपन मोर परम हित धरमू ॥ मोहि सब भाँति भरोस
    तुम्हारा। तदपि कहुँ अवसर अनुसारा ॥ तात तात बिनु बात हमारी। केवल गुरुकुल कृपाँ सँभारी ॥ नतरु प्रजा
    परिजन परिवारू। हमहि सहित सबु होत खुआरू ॥ जौं बिनु अवसर अथवँ दिनेसू। जग केहि कहहु न होइ कलेसू ॥ तस
    उतपातु तात बिधि कीन्हा। मुनि मिथिलेस राखि सबु लीन्हा ॥ दो राज काज सब लाज पति धरम धरनि धन धाम। गुर
    प्रभाउ पालिहि सबहि भल होइहि परिनाम ॥ ॥ सहित समाज तुम्हार हमारा। घर बन गुर प्रसाद रखवारा ॥ मातु पिता
    गुर स्वामि निदेसू। सकल धरम धरनीधर सेसू ॥ सो तुम्ह करहु करावहु मोहू। तात तरनिकुल पालक होहू ॥ साधक एक
    सकल सिधि देनी। कीरति सुगति भूतिमय बेनी ॥ सो बिचारि सहि सङ्कटु भारी। करहु प्रजा परिवारु सुखारी ॥ बाँटी
    बिपति सबहिं मोहि भाई। तुम्हहि अवधि भरि बड़इ कठिनाई ॥ जानि तुम्हहि मृदु कहुँ कठोरा। कुसमयँ तात न अनुचित
    मोरा ॥ होहिं कुठायँ सुबन्धु सुहाए। ओड़इअहिं हाथ असनिहु के घाए ॥ दो सेवक कर पद नयन से मुख सो साहिबु
    होइ। तुलसी प्रीति कि रीति सुनि सुकबि सराहहिं सोइ ॥ ॥ सभा सकल सुनि रघुबर बानी। प्रेम पयोधि अमिअ जनु
    सानी ॥ सिथिल समाज सनेह समाधी। देखि दसा चुप सारद साधी ॥ भरतहि भयु परम सन्तोषू। सनमुख स्वामि बिमुख दुख
    दोषू ॥ मुख प्रसन्न मन मिटा बिषादू। भा जनु गूँगेहि गिरा प्रसादू ॥ कीन्ह सप्रेम प्रनामु बहोरी। बोले
    पानि पङ्करुह जोरी ॥ नाथ भयु सुखु साथ गे को। लहेउँ लाहु जग जनमु भे को ॥ अब कृपाल जस आयसु होई। करौं
    सीस धरि सादर सोई ॥ सो अवलम्ब देव मोहि देई। अवधि पारु पावौं जेहि सेई ॥ दो देव देव अभिषेक हित गुर अनुसासनु
    पाइ। आनेउँ सब तीरथ सलिलु तेहि कहँ काह रजाइ ॥ ॥ एकु मनोरथु बड़ मन माहीं। सभयँ सकोच जात कहि नाहीम् ॥
    कहहु तात प्रभु आयसु पाई। बोले बानि सनेह सुहाई ॥ चित्रकूट सुचि थल तीरथ बन। खग मृग सर सरि निर्झर गिरिगन
    ॥ प्रभु पद अङ्कित अवनि बिसेषी। आयसु होइ त आवौं देखी ॥ अवसि अत्रि आयसु सिर धरहू। तात बिगतभय कानन चरहू
    ॥ मुनि प्रसाद बनु मङ्गल दाता। पावन परम सुहावन भ्राता ॥ रिषिनायकु जहँ आयसु देहीं। राखेहु तीरथ जलु थल
    तेहीम् ॥ सुनि प्रभु बचन भरत सुख पावा। मुनि पद कमल मुदित सिरु नावा ॥ दो भरत राम सम्बादु सुनि सकल सुमङ्गल
    मूल। सुर स्वारथी सराहि कुल बरषत सुरतरु फूल ॥ ॥ धन्य भरत जय राम गोसाईं। कहत देव हरषत बरिआई। मुनि मिथिलेस
    सभाँ सब काहू। भरत बचन सुनि भयु उछाहू ॥ भरत राम गुन ग्राम सनेहू। पुलकि प्रसंसत राउ बिदेहू ॥ सेवक स्वामि
    सुभाउ सुहावन। नेमु पेमु अति पावन पावन ॥ मति अनुसार सराहन लागे। सचिव सभासद सब अनुरागे ॥ सुनि सुनि राम
    भरत सम्बादू। दुहु समाज हियँ हरषु बिषादू ॥ राम मातु दुखु सुखु सम जानी। कहि गुन राम प्रबोधीं रानी ॥
    एक कहहिं रघुबीर बड़आई। एक सराहत भरत भलाई ॥ दो अत्रि कहेउ तब भरत सन सैल समीप सुकूप। राखिअ तीरथ तोय
    तहँ पावन अमिअ अनूप ॥ ॥ भरत अत्रि अनुसासन पाई। जल भाजन सब दिए चलाई ॥ सानुज आपु अत्रि मुनि साधू। सहित
    गे जहँ कूप अगाधू ॥ पावन पाथ पुन्यथल राखा। प्रमुदित प्रेम अत्रि अस भाषा ॥ तात अनादि सिद्ध थल एहू। लोपेउ
    काल बिदित नहिं केहू ॥ तब सेवकन्ह सरस थलु देखा। किन्ह सुजल हित कूप बिसेषा ॥ बिधि बस भयु बिस्व उपकारू।
    सुगम अगम अति धरम बिचारू ॥ भरतकूप अब कहिहहिं लोगा। अति पावन तीरथ जल जोगा ॥ प्रेम सनेम निमज्जत प्रानी।
    होइहहिं बिमल करम मन बानी ॥ दो कहत कूप महिमा सकल गे जहाँ रघुराउ। अत्रि सुनायु रघुबरहि तीरथ पुन्य प्रभाउ
    ॥ ॥ कहत धरम इतिहास सप्रीती। भयु भोरु निसि सो सुख बीती ॥ नित्य निबाहि भरत दौ भाई। राम अत्रि गुर आयसु
    पाई ॥ सहित समाज साज सब सादें। चले राम बन अटन पयादेम् ॥ कोमल चरन चलत बिनु पनहीं। भि मृदु भूमि सकुचि
    मन मनहीम् ॥ कुस कण्टक काँकरीं कुराईं। कटुक कठोर कुबस्तु दुराईम् ॥ महि मञ्जुल मृदु मारग कीन्हे। बहत
    समीर त्रिबिध सुख लीन्हे ॥ सुमन बरषि सुर घन करि छाहीं। बिटप फूलि फलि तृन मृदुताहीम् ॥ मृग बिलोकि खग
    बोलि सुबानी। सेवहिं सकल राम प्रिय जानी ॥ दो सुलभ सिद्धि सब प्राकृतहु राम कहत जमुहात। राम प्रान प्रिय
    भरत कहुँ यह न होइ बड़इ बात ॥ ॥ एहि बिधि भरतु फिरत बन माहीं। नेमु प्रेमु लखि मुनि सकुचाहीम् ॥ पुन्य
    जलाश्रय भूमि बिभागा। खग मृग तरु तृन गिरि बन बागा ॥ चारु बिचित्र पबित्र बिसेषी। बूझत भरतु दिब्य सब
    देखी ॥ सुनि मन मुदित कहत रिषिर् । हेतु नाम गुन पुन्य प्रभ् ॥ कतहुँ निमज्जन कतहुँ प्रनामा। कतहुँ बिलोकत
    मन अभिरामा ॥ कतहुँ बैठि मुनि आयसु पाई। सुमिरत सीय सहित दौ भाई ॥ देखि सुभाउ सनेहु सुसेवा। देहिं असीस
    मुदित बनदेवा ॥ फिरहिं गेँ दिनु पहर अढ़आई। प्रभु पद कमल बिलोकहिं आई ॥ दो देखे थल तीरथ सकल भरत पाँच
    दिन माझ। कहत सुनत हरि हर सुजसु गयु दिवसु भि साँझ ॥ ॥ भोर न्हाइ सबु जुरा समाजू। भरत भूमिसुर तेरहुति
    राजू ॥ भल दिन आजु जानि मन माहीं। रामु कृपाल कहत सकुचाहीम् ॥ गुर नृप भरत सभा अवलोकी। सकुचि राम फिरि
    अवनि बिलोकी ॥ सील सराहि सभा सब सोची। कहुँ न राम सम स्वामि सँकोची ॥ भरत सुजान राम रुख देखी। उठि सप्रेम
    धरि धीर बिसेषी ॥ करि दण्डवत कहत कर जोरी। राखीं नाथ सकल रुचि मोरी ॥ मोहि लगि सहेउ सबहिं सन्तापू। बहुत
    भाँति दुखु पावा आपू ॥ अब गोसाइँ मोहि देउ रजाई। सेवौं अवध अवधि भरि जाई ॥ दो जेहिं उपाय पुनि पाय जनु
    देखै दीनदयाल। सो सिख देइअ अवधि लगि कोसलपाल कृपाल ॥ ॥ पुरजन परिजन प्रजा गोसाई। सब सुचि सरस सनेहँ सगाई
    ॥ राउर बदि भल भव दुख दाहू। प्रभु बिनु बादि परम पद लाहू ॥ स्वामि सुजानु जानि सब ही की। रुचि लालसा रहनि
    जन जी की ॥ प्रनतपालु पालिहि सब काहू। देउ दुहू दिसि ओर निबाहू ॥ अस मोहि सब बिधि भूरि भरोसो। किएँ बिचारु
    न सोचु खरो सो ॥ आरति मोर नाथ कर छोहू। दुहुँ मिलि कीन्ह ढीठु हठि मोहू ॥ यह बड़ दोषु दूरि करि स्वामी।
    तजि सकोच सिखिअ अनुगामी ॥ भरत बिनय सुनि सबहिं प्रसंसी। खीर नीर बिबरन गति हंसी ॥ दो दीनबन्धु सुनि बन्धु
    के बचन दीन छलहीन। देस काल अवसर सरिस बोले रामु प्रबीन ॥ ॥ तात तुम्हारि मोरि परिजन की। चिन्ता गुरहि
    नृपहि घर बन की ॥ माथे पर गुर मुनि मिथिलेसू। हमहि तुम्हहि सपनेहुँ न कलेसू ॥ मोर तुम्हार परम पुरुषारथु।
    स्वारथु सुजसु धरमु परमारथु ॥ पितु आयसु पालिहिं दुहु भाई। लोक बेद भल भूप भलाई ॥ गुर पितु मातु स्वामि
    सिख पालें। चलेहुँ कुमग पग परहिं न खालेम् ॥ अस बिचारि सब सोच बिहाई। पालहु अवध अवधि भरि जाई ॥ देसु कोसु
    परिजन परिवारू। गुर पद रजहिं लाग छरुभारू ॥ तुम्ह मुनि मातु सचिव सिख मानी। पालेहु पुहुमि प्रजा रजधानी
    ॥ दो मुखिआ मुखु सो चाहिऐ खान पान कहुँ एक। पालि पोषि सकल अँग तुलसी सहित बिबेक ॥ ॥ राजधरम सरबसु एतनोई।
    जिमि मन माहँ मनोरथ गोई ॥ बन्धु प्रबोधु कीन्ह बहु भाँती। बिनु अधार मन तोषु न साँती ॥ भरत सील गुर सचिव
    समाजू। सकुच सनेह बिबस रघुराजू ॥ प्रभु करि कृपा पाँवरीं दीन्हीं। सादर भरत सीस धरि लीन्हीम् ॥ चरनपीठ
    करुनानिधान के। जनु जुग जामिक प्रजा प्रान के ॥ सम्पुट भरत सनेह रतन के। आखर जुग जुन जीव जतन के ॥ कुल
    कपाट कर कुसल करम के। बिमल नयन सेवा सुधरम के ॥ भरत मुदित अवलम्ब लहे तें। अस सुख जस सिय रामु रहे तेम्
    ॥ दो मागेउ बिदा प्रनामु करि राम लिए उर लाइ। लोग उचाटे अमरपति कुटिल कुअवसरु पाइ ॥ ॥ सो कुचालि सब कहँ
    भि नीकी। अवधि आस सम जीवनि जी की ॥ नतरु लखन सिय सम बियोगा। हहरि मरत सब लोग कुरोगा ॥ रामकृपाँ अवरेब
    सुधारी। बिबुध धारि भि गुनद गोहारी ॥ भेण्टत भुज भरि भाइ भरत सो। राम प्रेम रसु कहि न परत सो ॥ तन मन
    बचन उमग अनुरागा। धीर धुरन्धर धीरजु त्यागा ॥ बारिज लोचन मोचत बारी। देखि दसा सुर सभा दुखारी ॥ मुनिगन
    गुर धुर धीर जनक से। ग्यान अनल मन कसें कनक से ॥ जे बिरञ्चि निरलेप उपाए। पदुम पत्र जिमि जग जल जाए ॥
    दो तेउ बिलोकि रघुबर भरत प्रीति अनूप अपार। भे मगन मन तन बचन सहित बिराग बिचार ॥ ॥ जहाँ जनक गुर मति भोरी।
    प्राकृत प्रीति कहत बड़इ खोरी ॥ बरनत रघुबर भरत बियोगू। सुनि कठोर कबि जानिहि लोगू ॥ सो सकोच रसु अकथ
    सुबानी। समु सनेहु सुमिरि सकुचानी ॥ भेण्टि भरत रघुबर समुझाए। पुनि रिपुदवनु हरषि हियँ लाए ॥ सेवक सचिव
    भरत रुख पाई। निज निज काज लगे सब जाई ॥ सुनि दारुन दुखु दुहूँ समाजा। लगे चलन के साजन साजा ॥ प्रभु पद
    पदुम बन्दि दौ भाई। चले सीस धरि राम रजाई ॥ मुनि तापस बनदेव निहोरी। सब सनमानि बहोरि बहोरी ॥ दो लखनहि
    भेण्टि प्रनामु करि सिर धरि सिय पद धूरि। चले सप्रेम असीस सुनि सकल सुमङ्गल मूरि ॥ ॥ सानुज राम नृपहि
    सिर नाई। कीन्हि बहुत बिधि बिनय बड़आई ॥ देव दया बस बड़ दुखु पायु। सहित समाज काननहिं आयु ॥ पुर पगु धारिअ
    देइ असीसा। कीन्ह धीर धरि गवनु महीसा ॥ मुनि महिदेव साधु सनमाने। बिदा किए हरि हर सम जाने ॥ सासु समीप
    गे दौ भाई। फिरे बन्दि पग आसिष पाई ॥ कौसिक बामदेव जाबाली। पुरजन परिजन सचिव सुचाली ॥ जथा जोगु करि बिनय
    प्रनामा। बिदा किए सब सानुज रामा ॥ नारि पुरुष लघु मध्य बड़एरे। सब सनमानि कृपानिधि फेरे ॥ दो भरत मातु
    पद बन्दि प्रभु सुचि सनेहँ मिलि भेण्टि। बिदा कीन्ह सजि पालकी सकुच सोच सब मेटि ॥ ॥ परिजन मातु पितहि
    मिलि सीता। फिरी प्रानप्रिय प्रेम पुनीता ॥ करि प्रनामु भेण्टी सब सासू। प्रीति कहत कबि हियँ न हुलासू
    ॥ सुनि सिख अभिमत आसिष पाई। रही सीय दुहु प्रीति समाई ॥ रघुपति पटु पालकीं मगाईं। करि प्रबोधु सब मातु
    चढ़आई ॥ बार बार हिलि मिलि दुहु भाई। सम सनेहँ जननी पहुँचाई ॥ साजि बाजि गज बाहन नाना। भरत भूप दल कीन्ह
    पयाना ॥ हृदयँ रामु सिय लखन समेता। चले जाहिं सब लोग अचेता ॥ बसह बाजि गज पसु हियँ हारें। चले जाहिं परबस
    मन मारेम् ॥ दो गुर गुरतिय पद बन्दि प्रभु सीता लखन समेत। फिरे हरष बिसमय सहित आए परन निकेत ॥ ॥ बिदा
    कीन्ह सनमानि निषादू। चलेउ हृदयँ बड़ बिरह बिषादू ॥ कोल किरात भिल्ल बनचारी। फेरे फिरे जोहारि जोहारी
    ॥ प्रभु सिय लखन बैठि बट छाहीं। प्रिय परिजन बियोग बिलखाहीम् ॥ भरत सनेह सुभाउ सुबानी। प्रिया अनुज सन
    कहत बखानी ॥ प्रीति प्रतीति बचन मन करनी। श्रीमुख राम प्रेम बस बरनी ॥ तेहि अवसर खग मृग जल मीना। चित्रकूट
    चर अचर मलीना ॥ बिबुध बिलोकि दसा रघुबर की। बरषि सुमन कहि गति घर घर की ॥ प्रभु प्रनामु करि दीन्ह भरोसो।
    चले मुदित मन डर न खरो सो ॥ दो सानुज सीय समेत प्रभु राजत परन कुटीर। भगति ग्यानु बैराग्य जनु सोहत धरें
    सरीर ॥ ॥ मुनि महिसुर गुर भरत भुआलू। राम बिरहँ सबु साजु बिहालू ॥ प्रभु गुन ग्राम गनत मन माहीं। सब चुपचाप
    चले मग जाहीम् ॥ जमुना उतरि पार सबु भयू। सो बासरु बिनु भोजन गयू ॥ उतरि देवसरि दूसर बासू। रामसखाँ सब
    कीन्ह सुपासू ॥ सी उतरि गोमतीं नहाए। चौथें दिवस अवधपुर आए। जनकु रहे पुर बासर चारी। राज काज सब साज सँभारी
    ॥ सौम्पि सचिव गुर भरतहि राजू। तेरहुति चले साजि सबु साजू ॥ नगर नारि नर गुर सिख मानी। बसे सुखेन राम
    रजधानी ॥ दो राम दरस लगि लोग सब करत नेम उपबास। तजि तजि भूषन भोग सुख जिअत अवधि कीं आस ॥ ॥ सचिव सुसेवक
    भरत प्रबोधे। निज निज काज पाइ पाइ सिख ओधे ॥ पुनि सिख दीन्ह बोलि लघु भाई। सौम्पी सकल मातु सेवकाई ॥ भूसुर
    बोलि भरत कर जोरे। करि प्रनाम बय बिनय निहोरे ॥ ऊँच नीच कारजु भल पोचू। आयसु देब न करब सँकोचू ॥ परिजन
    पुरजन प्रजा बोलाए। समाधानु करि सुबस बसाए ॥ सानुज गे गुर गेहँ बहोरी। करि दण्डवत कहत कर जोरी ॥ आयसु
    होइ त रहौं सनेमा। बोले मुनि तन पुलकि सपेमा ॥ समुझव कहब करब तुम्ह जोई। धरम सारु जग होइहि सोई ॥ दो सुनि
    सिख पाइ असीस बड़इ गनक बोलि दिनु साधि। सिङ्घासन प्रभु पादुका बैठारे निरुपाधि ॥ ॥ राम मातु गुर पद सिरु
    नाई। प्रभु पद पीठ रजायसु पाई ॥ नन्दिगावँ करि परन कुटीरा। कीन्ह निवासु धरम धुर धीरा ॥ जटाजूट सिर मुनिपट
    धारी। महि खनि कुस साँथरी सँवारी ॥ असन बसन बासन ब्रत नेमा। करत कठिन रिषिधरम सप्रेमा ॥ भूषन बसन भोग
    सुख भूरी। मन तन बचन तजे तिन तूरी ॥ अवध राजु सुर राजु सिहाई। दसरथ धनु सुनि धनदु लजाई ॥ तेहिं पुर बसत
    भरत बिनु रागा। चञ्चरीक जिमि चम्पक बागा ॥ रमा बिलासु राम अनुरागी। तजत बमन जिमि जन बड़भागी ॥ दो राम
    पेम भाजन भरतु बड़ए न एहिं करतूति। चातक हंस सराहिअत टेङ्क बिबेक बिभूति ॥ ॥ देह दिनहुँ दिन दूबरि होई।
    घटि तेजु बलु मुखछबि सोई ॥ नित नव राम प्रेम पनु पीना। बढ़त धरम दलु मनु न मलीना ॥ जिमि जलु निघटत सरद
    प्रकासे। बिलसत बेतस बनज बिकासे ॥ सम दम सञ्जम नियम उपासा। नखत भरत हिय बिमल अकासा ॥ ध्रुव बिस्वास अवधि
    राका सी। स्वामि सुरति सुरबीथि बिकासी ॥ राम पेम बिधु अचल अदोषा। सहित समाज सोह नित चोखा ॥ भरत रहनि समुझनि
    करतूती। भगति बिरति गुन बिमल बिभूती ॥ बरनत सकल सुकचि सकुचाहीं। सेस गनेस गिरा गमु नाहीम् ॥ दो नित पूजत
    प्रभु पाँवरी प्रीति न हृदयँ समाति ॥ मागि मागि आयसु करत राज काज बहु भाँति ॥ ॥ पुलक गात हियँ सिय रघुबीरू।
    जीह नामु जप लोचन नीरू ॥ लखन राम सिय कानन बसहीं। भरतु भवन बसि तप तनु कसहीम् ॥ दौ दिसि समुझि कहत सबु
    लोगू। सब बिधि भरत सराहन जोगू ॥ सुनि ब्रत नेम साधु सकुचाहीं। देखि दसा मुनिराज लजाहीम् ॥ परम पुनीत भरत
    आचरनू। मधुर मञ्जु मुद मङ्गल करनू ॥ हरन कठिन कलि कलुष कलेसू। महामोह निसि दलन दिनेसू ॥ पाप पुञ्ज कुञ्जर
    मृगराजू। समन सकल सन्ताप समाजू। जन रञ्जन भञ्जन भव भारू। राम सनेह सुधाकर सारू ॥ छं सिय राम प्रेम पियूष
    पूरन होत जनमु न भरत को। मुनि मन अगम जम नियम सम दम बिषम ब्रत आचरत को ॥ दुख दाह दारिद दम्भ दूषन सुजस
    मिस अपहरत को। कलिकाल तुलसी से सठन्हि हठि राम सनमुख करत को ॥ सो भरत चरित करि नेमु तुलसी जो सादर सुनहिं।
    सीय राम पद पेमु अवसि होइ भव रस बिरति ॥ इक्कीसवाँ विश्राम इति श्रीमद्रामचरितमानसे सकलकलिकलुषविध्वंसने
    द्वितीयः सोपानः समाप्तः।
