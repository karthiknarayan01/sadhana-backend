id: anandalahari
category: stotram
name:
  english: anandalahari
  devanagari: आनन्दलहरी
content:
  english: stvaya tu shrimatya sadayamavalokyo'hamadhuna | payodah paniyam dishati madhuram catakamukhe
    bhrisham shanke kairva vidhibhiranunita mama matih||9|| kripapangalokam vitara tarasa sadhucarite
    na te yuktopeksha mayi sharanadikshamupagate | na cedishtam dadyadanupadamaho kalpalatika visheshah
    samanyaih kathamitaravalliparikaraih||10|| mahantam vishvasam tava caranapankeruhayuge nidhayanyannaivashritamiha
    maya daivatamume | tathapi tvacceto yadi mayi na jayeta sadayam niralambo lambodarajanani kam yami
    sharanam||11|| ayah sparshe lagnam sapadi labhate hemapadavim yatha rathyapathah shuci bhavati gangaughamilitam
    | tatha tattatpapairatimalinamantarmama yadi tvayi premna saktam kathamiva na jayeta vimalam||12||
    tvadanyasmadicchavishayaphalalabhe na niyama
  devanagari: स्त्वया तु श्रीमत्या सदयमवलोक्योऽहमधुना । पयोदः पानीयं दिशति मधुरं चातकमुखे भृशं शङ्के कैर्वा
    विधिभिरनुनीता मम मतिः॥९॥ कृपापाङ्गालोकं वितर तरसा साधुचरिते न ते युक्तोपेक्षा मयि शरणदीक्षामुपगते
    । न चेदिष्टं दद्यादनुपदमहो कल्पलतिका विशेषः सामान्यैः कथमितरवल्लीपरिकरैः॥१०॥ महान्तं विश्वासं तव चरणपङ्केरुहयुगे
    निधायान्यन्नैवाश्रितमिह मया दैवतमुमे । तथापि त्वच्चेतो यदि मयि न जायेत सदयं निरालंबो लंबोदरजननि कं
    यामि शरणम्॥११॥ अयः स्पर्शे लग्नं सपदि लभते हेमपदवीं यथा रथ्यापाथः शुचि भवति गङ्गौघमिलितम् । तथा तत्तत्पापैरतिमलिनमन्तर्मम
    यदि त्वयि प्रेंणा सक्तं कथमिव न जायेत विमलम्॥१२॥ त्वदन्यस्मादिच्छाविषयफललाभे न नियम
