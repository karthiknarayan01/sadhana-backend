id: dharmakritamdevistotram
category: stotram
name:
  english: dharmakritamdevistotram
  devanagari: धर्मकृतंदेवीस्तोत्रम्
content:
  english: dharmakritam devistotram dharma uvaca | matarjanihi mam dharmam jnaninanca gurorgurum | parastrimatribuddhishca
    kurvantam satatam sati || 25|| aham tavantaram jnatumagatastava sannidhim | tavahanca mano jane tathapi
    vidhinoditah || 26|| kritam me damanam sadhvi na viruddham yathocitam | shastih samutpathasthanamishvarena
    vinirmita || 27|| svayam pradata sarvebhyah sukhaduhkhavarankshamah | sampadam vipadam yo hi namastasmai
    shivaya hi || 28|| shatrum mitram samvidhatum pritinca kalaham kshamah | srashtum nashtum ca yassrishtim
    namastasmai shivaya hi || 29|| yena shuklikritam kshiram jale shaityam kritampura | dahikrito hutashashca
    namastasmai shivaya hi || 30|| prakritirnirmita yena taptvati mahadaditah | brahmavishnumaheshadya
    namastasmai shivaya hi || 31|| iti shrishivapurane rudrasamhitayam partikhande pancatrimshadhyayantargatam
    dharmakritam shivastotram samaptam | shivapurana | rudrasamhita 3 | parvatikhanda | adhyaya 35
  devanagari: धर्मकृतं देवीस्तोत्रम् धर्म उवाच । मातर्जानीहि मां धर्मं ज्ञानिनाञ्च गुरोर्गुरुम् । परस्त्रीमातृबुद्धिश्च
    कुर्वन्तं सततं सति ॥ २५॥ अहं तवान्तरं ज्ञातुमागतस्तव सन्निधिम् । तवाहञ्च मनो जाने तथापि विधिनोदितः
    ॥ २६॥ कृतं मे दमनं साध्वि न विरुद्धं यथोचितम् । शास्तिः समुत्पथस्थानामीश्वरेण विनिर्मिता ॥ २७॥ स्वयं
    प्रदाता सर्वेभ्यः सुखदुःखवरान्क्षमः । सम्पदं विपदं यो हि नमस्तस्मै शिवाय हि ॥ २८॥ शत्रुं मित्रं संविधातुं
    प्रीतिञ्च कलहं क्षमः । स्रष्टुं नष्टुं च यस्सृष्टिं नमस्तस्मै शिवाय हि ॥ २९॥ येन शुक्लीकृतं क्षीरं
    जले शैत्यं कृतम्पुरा । दाहीकृतो हुताशश्च नमस्तस्मै शिवाय हि ॥ ३०॥ प्रकृतिर्निर्मिता येन तप्त्वाति
    महदादितः । ब्रह्मविष्णुमहेशाद्या नमस्तस्मै शिवाय हि ॥ ३१॥ इति श्रीशिवपुराणे रुद्रसंहितायां पार्तीखण्डे
    पञ्चत्रिंशाध्यायान्तर्गतं धर्मकृतं शिवस्तोत्रं समाप्तम् । शिवपुराण । रुद्रसंहिता ३ । पार्वतीखण्ड ।
    अध्याय ३५
