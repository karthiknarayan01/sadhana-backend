id: munibhihkritamkurmastotram
category: stotram
name:
  english: munibhihkritamkurmastotram
  devanagari: मुनिभिःकृतंकूर्मस्तोत्रम्
content:
  english: munibhih kritam kurmastotram suta uvaca | etavaduktva bhagavan virarama janardanah | tushtuvurmunayo
    vishnum shakrena saha madhavam || 1|| munayah ucuh | namaste kurmarupaya vishnave paramatmane | narayanaya
    vishvaya vasudevaya te namah || 2|| namo namaste krishnaya govindaya namo namah | madhavaya namastubhyam
    namo yajneshvaraya ca || 3|| sahasrashirase tubhyam sahasrakshaya te namah | namah sahasrahastaya
    sahasracaranaya ca || 4|| om namo jnanarupaya paramatmasvarupine | anandaya namastubhyam mayatitaya
    te namah || 5|| namo gudhashariraya nirgunaya namo'stu te | purushaya puranaya sattamatrasvarupine
    || 6|| namah sankhyaya yogaya kevalaya namo'stu te | dharmajnanadhigamyaya nishkalaya namo'stu te
    || 7|| namaste vyomarupaya mahayogeshvaraya ca | paravaranam prabhave vedavedyaya te namah || 8||
    namo buddhaya shuddhaya namo yuktaya hetave | namo namo namastubhyam mayine vedhase namah || 9|| namo'stu
    te varahaya narasimhaya te namah | vamanaya namastubhyam hrishikeshaya te namah || 10|| svargapavargadatre
    ca namo'pratihatatmane | namo yogadhigamyaya yogine yogadayine || 11|| devanam pataye tubhyam devarttishamanaya
    te | bhagavamstvatprasadena sarvasamsaranashanam || 12|| asmabhirviditam jnanam yajjnatvamritamashnute
    | shrutastu vividha dharma vamsha manvantarani ca || 13|| sargashca pratisargashca brahmandasyasya
    vistarah | tvam hi sarvajagatsakshi vishvo narayanah parah || 14|| tratumarhasyanantatma tvameva sharanam
    gatah | iti kurmapurane uttarabhage shatcatvarimshadhyayantargatam munibhih kritam kurmastotram samaptam
    | kurmapurane uttarabhage 46
  devanagari: मुनिभिः कृतं कूर्मस्तोत्रम् सूत उवाच । एतावदुक्त्वा भगवान् विरराम जनार्दनः । तुष्टुवुर्मुनयो
    विष्णुं शक्रेण सह माधवम् ॥ १॥ मुनयः ऊचुः । नमस्ते कूर्मरूपाय विष्णवे परमात्मने । नारायणाय विश्वाय
    वासुदेवाय ते नमः ॥ २॥ नमो नमस्ते कृष्णाय गोविन्दाय नमो नमः । माधवाय नमस्तुभ्यं नमो यज्ञेश्वराय च ॥
    ३॥ सहस्रशिरसे तुभ्यं सहस्राक्षाय ते नमः । नमः सहस्रहस्ताय सहस्रचरणाय च ॥ ४॥ ॐ नमो ज्ञानरूपाय परमात्मस्वरूपिणे
    । आनन्दाय नमस्तुभ्यं मायातीताय ते नमः ॥ ५॥ नमो गूढशरीराय निर्गुणाय नमोऽस्तु ते । पुरुषाय पुराणाय सत्तामात्रस्वरूपिणे
    ॥ ६॥ नमः साङ्ख्याय योगाय केवलाय नमोऽस्तु ते । धर्मज्ञानाधिगम्याय निष्कलाय नमोऽस्तु ते ॥ ७॥ नमस्ते
    व्योमरूपाय महायोगेश्वराय च । परावराणां प्रभवे वेदवेद्याय ते नमः ॥ ८॥ नमो बुद्धाय शुद्धाय नमो युक्ताय
    हेतवे । नमो नमो नमस्तुभ्यं मायिने वेधसे नमः ॥ ९॥ नमोऽस्तु ते वराहाय नारसिंहाय ते नमः । वामनाय नमस्तुभ्यं
    हृषीकेशाय ते नमः ॥ १०॥ स्वर्गापवर्गदात्रे च नमोऽप्रतिहतात्मने । नमो योगाधिगम्याय योगिने योगदायिने
    ॥ ११॥ देवानां पतये तुभ्यं देवार्त्तिशमनाय ते । भगवंस्त्वत्प्रसादेन सर्वसंसारनाशनम् ॥ १२॥ अस्माभिर्विदितं
    ज्ञानं यज्ज्ञात्वामृतमश्नुते । श्रुतास्तु विविधा धर्मा वंशा मन्वन्तराणि च ॥ १३॥ सर्गश्च प्रतिसर्गश्च
    ब्रह्माण्डस्यास्य विस्तरः । त्वं हि सर्वजगत्साक्षी विश्वो नारायणः परः ॥ १४॥ त्रातुमर्हस्यनन्तात्मा
    त्वामेव शरणं गताः । इति कूर्मपुराणे उत्तरभागे षट्चत्वारिंशाध्यायान्तर्गतं मुनिभिः कृतं कूर्मस्तोत्रं
    समाप्तम् । कूर्मपुराणे उत्तरभागे ४६
