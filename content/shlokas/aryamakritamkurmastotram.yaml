id: aryamakritamkurmastotram
category: stotram
name:
  english: aryamakritamkurmastotram
  devanagari: अर्यमाकृतंकूर्मस्तोत्रम्
content:
  english: rupakritau kavibhih kalpiteyam | sankhya yaya tattvadrishapaniyate tasmai namah sankhyanidarshanaya
    te iti || 33|| iti shrimadbhagavatamahapurane pancamaskandhe ashtadashadhyayantargatam aryamakritam
    kurmastotram samaptam | bhagavatapurana | adhyaya 5
  devanagari: रूपाकृतौ कविभिः कल्पितेयम् । सङ्ख्या यया तत्त्वदृशापनीयते तस्मै नमः साङ्ख्यनिदर्शनाय ते
    इति ॥ ३३॥ इति श्रीमद्भागवतमहापुराणे पञ्चमस्कन्धे अष्टादशाध्यायान्तर्गतं अर्यमाकृतं कूर्मस्तोत्रं समाप्तम्
    । भागवतपुराण । अध्याय ५
meaning: {}
