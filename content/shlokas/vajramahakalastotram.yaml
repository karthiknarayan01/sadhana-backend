id: vajramahakalastotram
category: stotram
name:
  english: vajramahakalastotram
  devanagari: वज्रमहाकालस्तोत्रम्
content:
  english: vighnahanta pratidivasamasau praptasambodhilabhah | hum phat humphataninadaistribhuvanakuharam
    purayan purnashaktih payacchrikshetrapalah kapilatarajatajutakleshangabharah || 4|| kham kham kham
    khangapanirlalalalalalito rupato raktapanih ram ram ram raktanetro ru ru rudhirakarashcarcitashcandavegah
    | krum krum krum krodhadrishtih kuha kuha kutilah kuncitasheshadushtah dam dam dam damarango damarukasahito
    rakshatat kshetrapalah || 5|| yam yam yam yati vishvam yamaniyamayuto yamino'yamino va vam vam vam
    vatavego jhatiti karakadhrit praptalokopacarah | bhrum bhrum bhrum bhishanango bhrikutikritabhayo
    muktivan sadhakanam ksham ksham ksham kshemakari kshapayatu duritam rakshatat kshetrapalah || 6||
    klam klam klam krantimurtistribhuvanamanisham kledayan sarvada yah pam pam pam pashahastah parashudhritakarah
    palayan palaniyan | mudranam mantramurtistvamabhimataphalado mantrinam mantratulyah kshetranam palako'sau
    sakalajitatanuh patu yushmamshcirayuh || 7|| klim klim klim krittivasa kritaripuniyamah kleshitanam
    sadeshah kam kam kam kapalamali kalikalushaharah kalavrindabhakayah | cam cam cam candavegah pracaritasamayah
    kalabhutaikalokah sam sam sam samyatatma samayashubhaphalam lakshyatam patu yushman || 8|| mantranam
    manrakayo niyatayamadyutih satpathe shuddhatire acaryah sadhako va japati ca niyatam punyavan jayate'sau
    | ayuh shrih kirtilakshmirdhritibalamatulam shantipushti prabha ca sarvajnatvam ca nityam dinanishamatulam
    nashyate vighnajatam || 9|| iti acaryanagarjunakritam shrivajramahakalastotram sampurnam ||
  devanagari: विघ्नहन्ता प्रतिदिवसमसौ प्राप्तसम्बोधिलाभः । हुं फट् हुम्फटनिनादैस्त्रिभुवनकुहरं पूरयन्
    पूर्णशक्तिः पायाच्छ्रीक्षेत्रपालः कपिलतरजटाजूटक्लेशाङ्गभारः ॥ ४॥ खं खं खं खङ्गपाणिर्ललललललितो रूपतो
    रक्तपाणिः रं रं रं रक्तनेत्रो रु रु रुधिरकरश्चर्चितश्चण्डवेगः । क्रुं क्रुं क्रुं क्रोधदृष्टिः कुह
    कुह कुटिलः कुञ्चिताशेषदुष्टः डं डं डं डामराङ्गो डमरुकसहितो रक्षतात् क्षेत्रपालः ॥ ५॥ यं यं यं याति
    विश्वं यमनियमयुतो यामिनोऽयामिनो वा वं वं वं वातवेगो झटिति करकधृत् प्राप्तलोकोपचारः । भ्रूं भ्रूं भ्रूं
    भीषणाङ्गो भृकुटिकृतभयो मुक्तिवान् साधकानां क्षं क्षं क्षं क्षेमकारी क्षपयतु दुरितं रक्षतात् क्षेत्रपालः
    ॥ ६॥ क्लां क्लां क्लां क्रान्तिमूर्तिस्त्रिभुवनमनिशं क्लेदयन् सर्वदा यः पं पं पं पाशहस्तः परशुधृतकरः
    पालयन् पालनीयान् । मुद्राणां मन्त्रमूर्तिस्त्वमभिमतफलदो मन्त्रिणां मन्त्रतुल्यः क्षेत्राणां पालकोऽसौ
    सकलजिततनुः पातु युष्मांश्चिरायुः ॥ ७॥ क्लीं क्लीं क्लीं कृत्तिवासा कृतरिपुनियमः क्लेशितानां सदेशः
    कं कं कं कपालमाली कलिकलुषहरः कालवृन्दाभकायः । चं चं चं चण्डवेगः प्रचरितसमयाः कालभूतैकलोकः सं सं सं
    संयतात्मा समयशुभफलं लक्ष्यतां पातु युष्मान् ॥ ८॥ मन्त्राणां मन्रकायो नियतयमद्युतिः सत्पथे शूद्धतीरे
    आचार्यः साधको वा जपति च नियतं पुण्यवान् जायतेऽसौ । आयुः श्रीः कीर्तिलक्ष्मीर्धृतिबलमतुलं शान्तिपुष्टी
    प्रभा च सर्वज्ञत्वं च नित्यं दिननिशमतुलं नश्यते विघ्नजातम् ॥ ९॥ इति आचार्यनागार्जुनकृतं श्रीवज्रमहाकालस्तोत्रं
    सम्पूर्णम् ॥
