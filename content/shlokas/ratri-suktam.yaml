id: ratri-suktam
category: stotram
name:
  english: Ratri Suktam
  devanagari: रात्रिसूक्तम् (ऋग्वेद १०।१२७, परिशिष्ट)
content:
  english: rigvedasamhitayam dashamam mandalam, 127 saptavimshatyuttarashatatamam suktam | rishih- kushikah
    saubharo ratrirva bharadvaji | devata- ratristavah | chandah- 1, 3, 6 viradgayatri; 2 padanicridgayatri;
    4, 5, 8 gayatri; 7 nicridgayatri | svarah-shadjah | om ratri vyakhyadayati purutra devya1kshabhih
    | vishva adhi shriyo'dhita || 10|127|01 orvapra amartya nivato devyu1dvatah | jyotisha badhate tamah
    || 10|127|02 niru svasaramaskritoshasam devyayati | apedu hasate tamah || 10|127|03 sa no adya yasya
    vayam ni te yamannavikshmahi | vrikshe na vasatim vayah || 10|127|04 ni gramaso avikshata ni padvanto
    ni pakshinah | ni shyenasashcidarthinah || 10|127|05 yavaya vrikyam1 vrikam yavaya stenamurmye | atha
    nah sutara bhava || 10|127|06 upa ma pepishattamah krishnam vyaktamasthita | usha rineva yataya ||
    10|127|07 upa te ga ivakaram vrinishva duhitardivah | ratri stomam na jigyushe || 10|127|08 || parishishtam
    || a ratri parthivam rajah pitarah prayu dhamabhih | divah satamsi brihati vi tishtha sa a tvesham
    vartate tamah || 1 ye te ratri nricakshaso yuktaso navatirnava | ashitih samtvashta uto te sapta saptatih
    || 2 ratrim prapatye jananim sarvabhutaniveshanim | bhadram bhagavatim krishnam vishvasya jagato nisham
    || 3 samveshinim samyaminim grahanakshatramalinim | prapanno'ham shivam ratrim bhadre paramashimahi
    (bhadre paramashimahyom namah) || 4 stoshyami prayato devim sharanyam bahvricapriyam | sahasrasamhitam
    durgam jatavedase sunavama somam || 5 shantyartham tad dvijatinarishibhih somapashritah | rikvede
    tvam sammutpana'ratriyato ni dahati vedah || 6 ye tvam devi pra patyanti brahmana havyavahanim | avitya
    bahuvitya va sanah parshadati durgani vishva || 7 ye aknivarnam shubham saumyam kirtayishyanti ye
    dvijah| tamstarayati durgani naveva sindhum duritatyagnih || 8 durgeshu vishame ghore sangrame ripusankate
    | agnicoranipateshu dushthagrahanivarini dushthagrahanivarinyonnamah || 9 durgeshu vishmeshu tvam
    sangrameshu vaneshu ca | mohayitva 'prapatyamnte tesham me abhayam kuru | tesham me abhayam kuruvonnamah
    || 10 keshinim sarvabhutanam pancamiti ca nama ca | sa mam sama nisha devi sarvatah pari rakshatu
    | sarvatah pari rakshatvonnamah || 11 tamagnivarnam tapasa jvalamtim vairocanim karmaphaleshu jushtam
    | durgam devim sharanamaham prapadye sutarasi tarase namah | sutarasi tarase namah || 12 durga durgeshu
    sthaneshu sham no devirabhishtaye | ya imam durgastavam punyam ratrauratrau sada pathet || 13 ratrih
    kushikasobharo ratrirva bharadvaji ratristavo gayatri | ratarisuktam japennityam tatkalamupapadyate
    || 14 ulukayatum shishilukayatum jahi shvayatumuta kokayatum | suparnayatumuta gridhrayatum drishadeva
    pramrina raksha indra || 15 pishangabhrishatimambhrinam pishacimindra sam mrina | sarvam raksho nibarhaya
    || 16 himasya tva jarayuna shale pari vyayamasi | (uta hrado hi no dhiyognirdadatu bheshajam) || 17
    shishitahrado hi no dhiyognirdadatu bheshajam | antikamagnimajanaya durvadah shishilagamat || 18 ajataputrapakshaya
    hridayam mama duyate | vipulam vanam bahvakasham cara jatavedah kamaya || 19 mam ca raksha putramshca
    sharanamabhut tava | pingaksha lohitagriva krishnavarna namostu te ||20 asmannibarharasyenam sagarasyormayo
    yatha | indrah kshatram dadatu varunamabhi shimcatu || 21 shatravo nidhanam yantu jaya tvam brahmatejasa
    || 22 kapilajatim sarvabhaksham cagnim pratyaksha daivatam || 23 varunam ca vashamyagre mama putramshca
    rakshatu (mama putramshca rakshatvonnamah) || 24 sagram varshashatam jiva piba khada ca moda ca ||
    25 du:khitamshca dvijamshcaiva prajam ca pashu palaya || 26 yavadadityastapati yavadbhrajati candramah
    | yavadvayuh plavayati tavajjiva jaya jaya || 27 yena kena prakarena ko hi nama nu jivati | pareshamupakarartham
    yajjivati sa jivati | etam vaishvanarim sarvadevannamostu te || 28 na corabhayam na ca sarpabhayam
    na ca vyaghrabhayam na ca mrityubhayam | yasyapamrityurna ca mrityuh sarvam labhate sarvam jayate
    || 29 om shantih shantih shantih || || iti parishishtam || ratrisuktam
  devanagari: ऋग्वेदसंहितायां दशमं मण्डलं, १२७ सप्तविंशत्युत्तरशततमं सूक्तम् । ऋषिः- कुशिकः सौभरो रात्रिर्वा
    भारद्वाजी । देवता- रात्रिस्तवः । छन्दः- १, ३, ६ विराड्गायत्री; २ पादनिचृद्गायत्री; ४, ५, ८ गायत्री;
    ७ निचृद्गायत्री । स्वरः-षड्जः । ॐ रात्री व्यख्यदायती पुरुत्रा देव्य१क्षभिः । विश्वा अधि श्रियोऽधित
    ॥ १०।१२७।०१ ओर्वप्रा अमर्त्या निवतो देव्यु१द्वतः । ज्योतिषा बाधते तमः ॥ १०।१२७।०२ निरु स्वसारमस्कृतोषसं
    देव्यायती । अपेदु हासते तमः ॥ १०।१२७।०३ सा नो अद्य यस्या वयं नि ते यामन्नविक्ष्महि । वृक्षे न वसतिं
    वयः ॥ १०।१२७।०४ नि ग्रामासो अविक्षत नि पद्वन्तो नि पक्षिणः । नि श्येनासश्चिदर्थिनः ॥ १०।१२७।०५ यावया
    वृक्यं१ वृकं यवय स्तेनमूर्म्ये । अथा नः सुतरा भव ॥ १०।१२७।०६ उप मा पेपिशत्तमः कृष्णं व्यक्तमस्थित
    । उष ऋणेव यातय ॥ १०।१२७।०७ उप ते गा इवाकरं वृणीष्व दुहितर्दिवः । रात्रि स्तोमं न जिग्युषे ॥ १०।१२७।०८
    ॥ परिशिष्टम् ॥ आ रात्रि पार्थिवं रजः पितरः प्रायु धामभिः । दिवः सताम्सि बृहती वि तिष्ठ स आ त्वेषं
    वर्तते तमः ॥ १ ये ते रात्रि नृचक्षसो युक्तासो नवतिर्नव । अशीतिः संत्वष्टा उतो ते सप्त सप्ततीः ॥ २
    रात्रीं प्रपत्ये जननीं सर्वभूतनिवेशनीम् । भद्रां भगवतीं कृष्णां विश्वस्य जगतो निशाम् ॥ ३ सम्वेशिनीं
    संयमिनीं ग्रहनक्षत्रमालिनीम् । प्रपन्नोऽहं शिवां रात्रीं भद्रे पारमशीमहि (भद्रे पारमशीमह्यों नमः)
    ॥ ४ स्तोष्यामि प्रयतो देवीं शरण्यां बह्वृचप्रियाम् । सहस्रसंहितां दुर्गाम् जातवेदसे सुनवाम सोमम् ॥
    ५ शान्त्यर्थं तद् द्विजातीनाऋषिभिः सोमपाश्रिताः । ऋक्वेदे त्वं संमूत्पनाऽरात्रीयतो नि दहाति वेदः ॥
    ६ ये त्वां देवि प्र पत्यन्ति ब्राह्मणा हव्यवाहनीम् । अवित्या बहुवित्या वा सनः पर्षदति दुर्गाणि विश्वा
    ॥ ७ ये अक्निवर्णां शुभां सौम्यां कीर्तयिष्यन्ति ये द्विजाः। ताम्स्तारयति दुर्गाणि नावेव सिन्धुं दुरितात्यग्निः
    ॥ ८ दुर्गेषु विषमे घोरे सङ्ग्रामे रिपुसङ्कटे । अग्निचोरनिपातेषु दुष्ठग्रहनिवारिणि दुष्ठग्रहनिवारिण्योन्नमः
    ॥ ९ दुर्गेषु विष्मेषु त्वं सङ्ग्रामेषु वनेषु च । मोहयित्वा 'प्रपत्यम्न्ते तेषां मे अभयं कुरु । तेषां
    मे अभयं कुरुवोन्नमः ॥ १० केशिनीं सर्वभूतानां पञ्चमीति च नाम च । सा मां समा निशा देवी सर्वतः परि रक्षतु
    । सर्वतः परि रक्षत्वोन्नमः ॥ ११ तामग्निवर्णां तपसा ज्वलम्तीं वैरोचनीं कर्मफलेषु जुष्टां । दुर्गां
    देवीं शरणमहं प्रपद्ये सुतरसि तरसे नमः । सुतरसि तरसे नमः ॥ १२ दुर्गा दुर्गेषु स्थानेषु शं नो देवीरभिष्टये
    । य इमं दुर्गास्तवं पुण्यं रात्रौरात्रौ सदा पठेत् ॥ १३ रात्रिः कुशिकसोभरो रात्रिर्वा भारद्वाजी रात्रिस्तवो
    गायत्री । रातरीसूक्तं जपेन्नित्यं तत्कालमुपपद्यते ॥ १४ उलूकयातुं शीशीलूकयातुं जहि श्वयातुमुत कोकयातुम्
    । सुपर्णयातुमुत गृध्रयातुं दृषदेव प्रमृण रक्ष इन्द्र ॥ १५ पिशङ्गभृषटिमम्भृणं पिशाचिमिन्द्र सं मृण
    । सर्वं रक्षो निबर्हय ॥ १६ हिमस्य त्वा जरायुणा शाले परि व्ययामसि । (उत ह्रदो हि नो धियोग्निर्ददातु
    भेषजम्) ॥ १७ शीशीतह्रदो हि नो धियोग्निर्ददातु भेषजम् । अन्तिकामग्निमजनय दूर्वादः शीशीलागमत् ॥ १८ अजातपुत्रपक्षाया
    हृदयं मम दूयते । विपुलं वनं बह्वाकाशं चर जातवेदः कामाय ॥ १९ मां च रक्ष पुत्रांश्च शरणमभूत् तव । पिङ्गाक्ष
    लोहितग्रीव कृष्णवर्ण नमोस्तु ते ॥२० अस्मान्निबर्हरस्येनां सागरस्योर्मयो यथा । इन्द्रः क्षत्रं ददातु
    वरूणमभि षिम्चतु ॥ २१ शत्रवो निधनं यान्तु जय त्वं ब्रह्मतेजसा ॥ २२ कपिलजटीं सर्वभक्षं चाग्निं प्रत्यक्ष
    दैवतम् ॥ २३ वरुणं च वशाम्यग्रे मम पुत्रांश्च रक्षतु (मम पुत्रांश्च रक्षत्वोन्नमः) ॥ २४ साग्रं वर्षशतं
    जीव पिब खाद च मोद च ॥ २५ दु:खितांश्च द्विजांश्चैव प्रजां च पशु पालय ॥ २६ यावदादित्यस्तपति यावद्भ्राजति
    चन्द्रमाः । यावद्वायुः प्लवायति तावज्जीव जया जय ॥ २७ येन केन प्रकारेण को हि नाम नु जीवति । परेषामुपकारार्थं
    यज्जीवति स जीवति । एतां वैश्वानरीं सर्वदेवान्नमोस्तु ते ॥ २८ न चोरभयं न च सर्पभयं न च व्याघ्रभयं न
    च मृत्युभयम् । यस्यापमृत्युर्न च मृत्युः सर्वम् लभते सर्वं जयते ॥ २९ ॐ शान्तिः शान्तिः शान्तिः ॥ ॥
    इति परिशिष्टम् ॥ रात्रिसूक्तं
