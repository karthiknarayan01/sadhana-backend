id: shivananda-lahari
category: stotram
name:
  english: Shivananda Lahari
content:
  english: phalabhyam bhakteshu prakatita phalabhyam bhavatu me | shivabhya sphuradanubhavabhyam natiriyam
    || || galanti shambho tvaccarita saritah kilbisharajo dalanti dhikulya saranishu patanti vijayatam
    | dishanti samsara paritapopashamanam vasanti maccetohradabhuvi shivanandalahari || || trayivedyam
    hridyam tripura haramadyam trinayanam jatabharodaram caladuragaharam mrigadharam | mahadevam devam
    mayi sadayabhavam pashupatim cidalambam sambam shivamati || sahasram vartante jagati vibudhah kshudraphalada
    na manye svapne va tadanusaranam tatkritaphalam | hari bhajamasulabham ciram yace shambho shiva tava
    padambhoja || smritau shastre vaidye shakuna ganaphanitau purane mantre va stuti hasyeshvacaturah
    | katham rajnam pritirbhavati mayi ko'ham pashupate pashum mam sarvajna prathita kripaya palaya vibho
    || 'pyanurapi ca dhumo'gniracalah pato va tanturva pariharati kim ghorashamanam | vritha kanthakshobham
    vahasi tarasa tarkavacasa padambhojam shambhorbhaja paramasaukhyam vraja sudhih || || manaste padabje
    nivasatu vacah stotraphanitau karau cabhyarcayam shrutirapi katha karnanavidhau | tava dhyane buddhirnayanayugalam
    murtivibhave granthankairva paramashiva jane paramatah || || yatha buddhih shuktau rajatamiti kacashmani
    mani rjale paishte kshiram bhavati mrigatrishna su salilam | tatha devabhrantya bhajati bhavadanyam
    jadajano mahadevesham tvam manasi ca na matva pashupate || || gabhire kasare vishati vijane ghoravipine
    vishale shaile ca bhramati kusumartham jadamatih | samarpyaikam cetah sarasijamu navasthatum jana
    iha na janati kimaho || || naratvam devatvam nagavana mrigatvam mashakata pashutvam kitatvam bhavatu
    vihagatvadi jananam | sada tvatpadabja viharasaktam ceddhridayamiha kim tena vapusha || || vaturva
    gehi va yatirapi jati va taditaro naro va yah kashcidbhavatu bhava kim tena bhavati | yadiyam hritpadmam
    yadi bhavadadhinam pashupate tadiyastvam shambho bhavasi bhavabharam ca vahasi || || guhayam gehe
    va bahirapi vane va'drishikhare jale va vahnau va vasatu vasateh kim vada phalam | sada yasyaivantah
    karanamapi shambho tava pade sthitam cedyogo'sau sa ca paramayogi sa ca sukhi || bhajanadure jadadhiya
    bhramantam mamandham paramakripaya patumucitam | madanyah ko dinastava kripana rakshatinipunah tvadanyah
    stvadanyah ko va me trijagati sharanyah pashupate || || prabhustvam dinanam khalu paramabandhuh pashupate
    pramukhyo'ham teshamapi kimuta bandhutvamanayoh | tvayaiva kshantavyah shiva madaparadhashca sakalah
    prayatna tkartavyam madavanamiyam bandhusaranih || || upeksha no cetkim na harasi bhavaddhyana mashakto
    yadi bhavan | shirastadvaidhatram nanakhalu suvrittam pashupate katham va niryatnam karanakha rbhavatu
    bhavata tatparashira shcatushkam samrakshyam sa khalu bhuvi dainyam likhitavan | vicarah ko va mam
    vishada kripaya pati shiva te katakshavyaparah svayamapi ca dinavanaparah || || phaladva punyanam
    mayi karunaya va tvayi vibho prasanne'pi svamin bhavadamala yugalam | katham pashyeyam mam sthagayati
    namah sambhramajusham nilimpanam shreni || tvameko lokanam paramaphalado divyapadavim vahantastvanmulam
    punarapi bhajante harimukhah | kiyadva dakshinyam tava shiva madasha ca kiyati kada va madraksham
    vahasi karuna ghatake durante samsare duritanilaye duhkhajanake | madayasam kim na vyapanayasi kasyopa
    kritaye vadeyam pritishcettava shiva kritarthah khalu vayam || || sada mohatavyam carati yuvatinam
    kucagirau natatyasha svatati jhatiti svairamabhitah | kapalin bhiksho me hridaya capalam dridham bhaktya
    baddhva shiva bhavadadhinam kuru vibho || nibaddham sagamanam vicitram padmadhyam pratidivasa ghatitam
    | smarare maccetah patakutim prapya vishadam jaya svamin shaktya saha shiva ganaih sevita vibho ||
    || pralobhadyairarthaharana pralobhadyaih arthaharana praveshodyuktah san bhramati bahudha taskarapate
    | imam cetashcoram kathamiha sahe shankara vibho tavadhinam kritva mayi niraparadhe kuru kripam ||
    || karomi tvatpujam sapadi sukhado me bhava vibho vidhitvam vishnutvam dishasi khalu tasyah phalamiti
    | punashca tvam drashtum divi bhuvi vahanpakshi madrishtva tatkhedam kathamiha sahe shankara vibho
    || || kada va kailase kanakamanisaudhe saha ganai rvasan shambhoragre sphuta murdhanjaliputah | vibho
    samba svami nparamashiva pahiti nigada nvidhatrinam kalpan kshanamiva vineshyami sukhatah || vacobhirniyaminam
    gananam kelibhirmadakalamahokshasya kakudi | sthitam nilagrivam trinayana vapusham kada tvam pashyeyam
    karadhrita || kada va tvam drishtva girisha tava bhavyanghri yugalam grihitva hastabhyam shirasi nayane
    vakshasi vahan | samashlishya ghraya sphuta jalaja gandhan parimala nalabhyam brahmadyairmudamanubhavishyami
    hridaye || karasthe hemadrau girisha nikatasthe dhanapatau grihasthe svarbhuja mara surabhi cintamanigane
    | shirahsthe shitamshau caranayugalasthe'khilashubhe kamartham dasye'ham bhavatu bhavadartham mama
    manah || || sarupyam tava pujane shiva mahadeveti sankirtane samipyam shivabhakti sambhashane || salokyam
    ca caracaratmakatanudhyane bhavanipate sayujyam mama siddhamatra bhavati svamin kritartho'smyaham
    || || tvatpadambujamarcayami paramam tvam cintayamyanvaham tvamisham sharanam vrajami vacasa tvameva
    yace vibho | viksham me disha cakshushim sakarunam divyaishciram prarthitam shambho lokaguro madiyamanasah
    saukhyopadesham kuru || || vastroddhutavidhau sahasrakarata pushparcane vishnuta gandhe gandhavahatmata'nnapacane
    barhirmukhadhyakshata | patre kancanagarbhatasti mayi cedbalenducudamane shushrusham karavani te pashupate
    svamimstrilokiguro || || nalam va paramopakarakamidam tvekam pashunam pate pashyan kukshigatamshcaracaraganan
    bahyasthitan rakshitum | sarvamartyapalayanaushadhamatijvalakaram bhikaram nikshiptam garalam gale
    na gilitam nodgirnameva tvaya || || jvalograh sakalamaratibhayadah kshvelah katham va tvaya drishtah
    kim ca kare dhritah karatale kim pakvajambuphalam | jihvayam nihitashca siddhaghutika va kanthadeshe
    bhritah kim te nilamanirvibhushanamayam shambho mahatman vada || || nalam va sakrideva deva bhavatah
    seva natirva nutih puja va smaranam kathashravanamapyalokanam madrisham | svaminnasthiradevatanusaranayasena
    kim labhyate ka va muktiritah kuto bhavati cetkim prarthaniyam tada || || kim brumastava sahasam pashupate
    kasyasti shambho bhava ddhairyam cedrishamatmanah sthitiriyam canyaih katham labhyate | bhrashyaddevaganam
    trasanmuniganam nashyatprapancam layam pashyannirbhaya eka eva viharatyanandasandro bhavan || || yogakshemadhurandharasya
    sakalashreyahpradodyogino drishtadrishtamatopadeshakritino bahyantaravyapinah | sarvajnasya dayakarasya
    bhavatah kim veditavyam maya shambho tvam paramantaranga iti me citte smaramyanvaham || || bhakto
    bhaktigunavrite mudamritapurne prasanne manah kumbhe samba tavanghripallavayugam samsthapya samvitphalam
    | sattvam mantramudirayannijashariragarashuddhim vahan punyaham prakatikaromi ruciram kalyanamapadayan
    || || amnayambudhimadarena sumanahsanghah samudyanmano manthanam dridhabhaktirajjusahitam kritva mathitva
    tatah | somam kalpatarum suparvasurabhim cintamanim dhimatam nityanandasudham nirantararamasaubhagyamatanvate
    || || prakpunyacalamargadarshitasudhamurtih prasannah shivah somah sadganasevito mrigadharah purnastamomocakah
    | cetah pushkaralakshito bhavati cedanandapathonidhih pragalbhyena vijrimbhate sumanasam vrittistada
    jayate || || dharmo me caturanghrikah sucaritah papam vinasham gatam kamakrodhamadadayo vigalitah
    kalah sukhavishkritah | jnananandamahaushadhih suphalita kaivalyanathe sada manye manasapundarikanagare
    rajavatamse sthite || || dhiyantrena vacoghatena kavitakulyopakulyakramai kavitakulyopakulyakramaih
    ranitaishca sadashivasya caritambhorashidivyamritaih | hritkedarayutashca bhaktikalamah saphalyamatanvate
    durbhikshanmama sevakasya bhagavanvishvesha bhitih kutah || || papotpatavimocanaya ruciraishvaryaya
    mrityunjaya stotradhyananatipradakshinasaparyalokanakarnane | jihvacittashironghrihastanayanashrotrairaham
    prarthito mamajnapaya tannirupaya muhurmameva ma me'vacah || || gambhiryam parikhapadam ghanadhritih
    prakara udyadguna stomashcaptabalam ghanendriyacayo dvarani dehe sthitah | vidya vastusamriddhirityakhilasamagrisamete
    sada durgatipriyadeva mamakamanodurge nivasam kuru || || ma gaccha tvamitastato girisha bho mayyeva
    vasam kuru svaminnadikirata mamakamanahkantarasimantare | vartante bahusho mriga madajusho matsaryamohadaya
    stanhatva mrigayavinodarucita labham ca samprapsyasi || || karalagnamrigah karindrabhango ghanashardulavikhandano'stajantuh
    | girisho vishadakritishca cetah kuhare pancamukho'sti me kuto bhih || || chandah shakhishikhanvitair
    dvijavaraih samsevite shashvate saukhyapadini khedabhedini sudhasaraih phalairdipite | cetahpakshishikhamane
    tyaja vritha sancaramanyairalam nityam shankara padapadmayugalinide viharam kuru || || akirne nakharajikantivibhavai
    radhaute'pi ca padmaragalalite hamsavrajairashrite | nityam bhaktivadhuganaishca rahasi svecchaviharam
    kuru sthitva manasarajahamsa girijanathanghrisaudhantare || || shambhudhyana vasantasangini hridarame'ghajirnacchadah
    srasta bhaktilatacchata vilasitah punyapravalashritah | dipyante gunakoraka japavacahpushpani sadvasana
    jnanananda sudhamarandalahari samvitphalabhyunnatih || || nityanandarasalayam suramunisvantambujatashrayam
    svaccham saddvijasevitam kalushahritsadvasana vishkritam | shambhudhyana sarovaram vraja manoham savatamsa
    sthiram kim kshudra shrayapalvala bhramana sanjatashramam prapsyasi || || anandamrita purita harapadam
    bhoja lavalodyata sthairyopaghnamupetya bhaktilatika shakhopa shakhanvita | uccai rmanasa kayamana
    patalimakramya nishkalmasha nityabhishta phalaprada bhavatu me satkarma samvardhita || rambha vijrimbhitam
    shrutishirah sthanantaradhishthitam saprema bhramarabhirama masakrit sadvasana shobhitam | bhogindra
    bharanam samastasumanah pujyam gunavishkritam seve shrigiri mallikarjuna mahalingam shivalingitam
    || || bhringiccha natanotkatah karimadagrahi sphuran madhava hlado nadayuto mahasitavapuh panceshuna
    cadritah | satpakshah sumano vaneshu sa punah sakshanmadiye mano rajive bhramaradhipo viharatam shrishailavasi
    vibhuh || || karunyamrita varshinam ghanavipadgrishmac chidakarmatham vidyasasya phalodayaya sumanah
    samsevya micchakritim | nrityad bhakta mayuramadri nilayam cancajjatamandalam shambho vanchati nilakandhara
    sada tvam me manashcatakah || || akashena shikhi samastaphaninam netra kalapi nata nugrahi pranavopadeshaninadaih
    kekiti yo giyate | shyamam shailasamudbhavam ghanarucim drishtva natantam muda vedantopavane vihararasikam
    tam nilakantham bhaje || || sandhya gharmadinatyayo harikaraghata prabhutanaka dhvano varidagarjitam
    divishadam drishticchata cancala | bhaktanam paritoshabashpa vitatir vrishtir mayuri shiva yasminnujjvala
    tandavam vijayate tam nilakantham bhaje || || adyayamita tejase shrutipadairvedyaya sadhyaya te vidyanandamayatmane
    trijagatah samrakshanodyogine | dhyeyayakhilayogibhih suraganairgeyaya mayavine samyaktandava sambhramaya
    jatine seyam natih shambhave || || nityaya trigunatmane purajite katyayani shreyase satyayadi kutumbine
    munimanah pratyaksha cinmurtaye | mayasrishta jagattrayaya sakalamnayantasancarine sayam tandava sambhramaya
    jatine seyam natih shambhave || || nityam svodaraposhanaya sakalanuddishya vittashaya vyartham paryatanam
    karomi bhavatah sevam na jane vibho | majjanmantara punya paka balatastvam sharva sarvantara stishthasyeva
    hi tena va pashupate te rakshaniyo'smyaham || || eko varija bandhavah kshitinabho vyaptam tamo mandalam
    bhittva locana gocaro'pi bhavati tvam koti suryaprabhah | vedyah kim na bhavasyaho ghanataram kidrigbhavenmattama
    vyapaniya me pashupate sakshatprasanno bhava || || hamsah padmavanam samicchati yatha nilambudam catakah
    kokah kokanadapriyam pratidinam candram cakorastatha | ceto vanchati mamakam pashupate cinmargamrigyam
    vibho gaurinatha bhavatpadabja yugalam kaivalya saukhyapradam || || rodhastoyahritah shramena pathikashchayam
    tarorvrishtito bhitah svasthagriham grihasthamatithir dinah prabhum dharmikam | dipam santamasakulashca
    shikhinam shita vritastvam tatha cetah sarvabhayapaham vraja sukham shambhoh padambhoruham || santatih
    ayaskantopalam sucika sadhvi naijavibhum lata kshitiruham sindhuh sarid vallabham | prapnotiha yatha
    tatha pashupateh padaravinda dvayam cetovritti rupetya tishthati sada sa bhakti rityucyate || || anandashrubhiratanoti
    pulakam nairmalyatashchadanam vaca shankhamukhe sthitaishca jatharapurtim caritramritaih | rudrakshai
    rbhasitena deva vapusho raksham bhavadbhavana paryanke viniveshya bhaktijanani bhaktarbhakam rakshati
    || || margavartitapaduka pashupaterangasya kurcayate gandushambunishecanam puraripordivyabhishekayate
    | kinci sheshakabalam navyopaharayate bhaktih kim na karotyaho vanacaro bhaktavatamsayate || || vakshastadanamantakasya
    kathinapasmarasammardanam bhubhritparyatanam namatsurashirahkotirasangharshanam | karmedam mridulasya
    tavakapadadvandvasya kim vocitam maccetomanipadukaviharanam shambho sadangikuru || || vakshastadanashankaya
    vicalito vaivasvato nirjarah kotirojjvalaratnadipakalikanirajanam kurvate | drishtva muktivadhustanoti
    nibhritashlesham bhavanipate yaccetastava padapadmabhajanam tasyeha kim durlabham || || kridartham
    srijasi prapancamakhilam kridamrigaste janah yatkarmacaritam maya ca bhavatah prityai bhavatyeva tat
    | shambho svasya kutuhalasya karanam macceshtitam nishcitam tasmanmamakarakshanam pashupate kartavyameva
    tvaya || || bahuvidhaparitoshabashpapura sphutapulakankitacarubhogabhumim | cirapadaphalakankshisevyamanam
    paramasadashivabhavanam prapadye || || amitamudamritam muhurduhantim vimalabhavatpadagoshthamavasantim
    | sadaya pashupate supunyapakam mama paripalaya bhaktidhenumekam || || jadata pashuta kalankita kutilacaratvam
    ca nasti mayi deva | asti yadi rajamaule bhavadabharanasya nasmi kim patram || || arahasi rahasi svatantrabuddhya
    varivasitum sulabhah prasannamurtih | aganitaphaladayakah prabhurme jagadadhiko hridi rajashekharo'sti
    || || arudhabhaktigunakuncitabhavacapa yuktaih shivasmaranabanaganairamoghaih | nirjitya kilbisharipunvijayi
    sudhindrah sanandamavahati susthirarajalakshmim || || dhyananjanena samavekshya tamahpradesham bhittva
    mahabalibhirishvaranamamantraih | divyashritam bhujagabhushanamudvahanti ye padapadmamiha te shiva
    te kritarthah || || bhudaratamudavahadyadapekshaya shri bhudara eva kimatah sumate labhasva | kedaramakalitamuktimahaushadhinam
    padaravindabhajanam parameshvarasya || || ashapashakleshadurvasanadi bhedodyuktairdivyagandhairamandaih
    | ashashatikasya padaravindam cetahpetim vasitam me tanotu || || kalyaninam sarasacitragatim savegam
    sarvengitajnamanagham dhruvalakshanadhyam | cetasturangamadhiruhya cara smarare netah samastajagatam
    vrishabhadhirudha || || bhaktirmaheshapadapushkaramavasanti kadambiniva kurute paritoshavarsham |
    sampurito bhavati yasya manastataka stajjanmasasyamakhilam saphalam ca nanyat || || buddhih sthira
    bhavitumishvarapadapadma sakta vadhurvirahiniva sada smaranti | sadbhavanasmaranadarshanakirtanadi
    sammohiteva shivamantrajapena vinte || || sadupacaravidhishvanubodhitam savinayam suhridam samupashritam
    | mama samuddhara buddhimimam prabho varagunena navodhavadhumiva || || nityam yogimanah sarojadalasancarakshamastvatkramah
    shambho tena katham kathorayamaradvakshahkavatakshatih | atyantam mridulam tvadanghriyugalam ha me
    manashcintaya tyetallocanagocaram kuru vibho hastena samvahaye || || eshyatyesha janim mano'sya kathinam
    tasminnataniti ma drakshayai girisimni komalapadanyasah purabhyasitah | no ceddivyagrihantareshu sumanastalpeshu
    vedyadishu prayah satsu shilataleshu natanam shambho kimartham tava || || kancitkalamumamahesha bhavatah
    padaravindarcanaih kanciddhyanasamadhibhishca natibhih kancitkathakarnanaih | kancitkancidavekshanaishca
    nutibhih kanciddashamidrishim yah prapnoti muda tvadarpitamana jivan sa muktah khalu || || banatvam
    vrishabhatvamardhavapusha bharyatvamaryapate ghonitvam sakhita mridangavahata cetyadi rupam dadhau
    | tvatpade nayanarpanam ca kritavamstvaddehabhago harih pujyatpujyatarah sa eva hi na cetko va tadanyo'dhikah
    || || jananamritiyutanam sevaya devatanam na bhavati sukhaleshah samshayo nasti tatra | ajanimamritarupam
    sambamisham bhajante ya iha paramasaukhyam te hi dhanya labhante || || shiva tava paricaryasannidhanaya
    gaurya bhava mama gunadhuryam buddhikanyam pradasye | sakalabhuvanabandho saccidanandasindho sadaya
    hridayagehe sarvada samvasa tvam || || jaladhimathanadaksho naiva patalabhedi na ca vanamrigayayam
    naiva lubdhah pravinah | ashanakusumabhushavastramukhyam saparyam kathaya kathamaham te kalpayanindumaule
    || || pujadravyasamriddhayo viracitah pujam katham kurmahe pakshitvam na ca va kititvamapi na praptam
    maya durlabham | jane mastakamanghripallavamumajane na te'ham vibho na jnatam hi pitamahena harina
    tattvena tadrupina || || ashanam garalam phani kalapo vasanam carma ca vahanam mahokshah | mama dasyasi
    kim kimasti shambho tava padambujabhaktimeva dehi || || yada kritambhonidhisetubandhanah karasthaladhahkritaparvatadhipah
    | bhavani te langhitapadmasambhava stada shivarcastavabhavanakshamah || || natibhirnutibhistvamisha
    puja vidhibhirdhyanasamadhibhirna tushtah | dhanusha musalena cashmabhirva vada te pritikaram tatha
    karomi || || vacasa caritam vadami shambho rahamudyogavidhasu te'prasaktah | manasakritimishvarasya
    seve shirasa caiva sadashivam namami || || adyavidya hridgata nirgatasi dvidya hridya hridgata tvatprasadat
    | seve nityam shrikaram tvatpadabjam bhave mukterbhajanam rajamaule || || durikritani duritani duraksharani
    daurbhagyaduhkhadurahankritidurvacamsi | saram tvadiyacaritam nitaram pibantam gaurisha mamiha samuddhara
    satkatakshaih || || somakaladharamaulau komalaghanakandhare mahamahasi | svamini girijanathe mamakahridayam
    nirantaram ramatam || || sa rasana te nayane taveva karau sa eva kritakrityah | ya ye yau yo bhargam
    vadatikshete sadarcatah smarati || vatikathinam te mano bhavanisha | iti vicikitsam santyaja shiva
    kathamasidgirau tatha veshah || dhairyankushena nibhritam rabhasadakrishya bhaktishrinkhalaya | purahara
    caranalane hridayamadebham badhana cidyantraih || || pracaratyabhitah pragalbhavrittya madavanesha
    manah kari gariyan | parigrihya nayena bhaktirajjva parama sthanu padam dridham nayamum || || sarvalankarayuktam
    saralapadayutam sadhuvrittam suvarnam sadbhih samstuyamanam sarasagunayutam lakshitam lakshanadhyam
    | udyadbhushavisheshamupagatavinayam dyotamanartharekham kalyanim deva gauripriya mama kavitakanyakam
    tvam grihana || || idam te yuktam va paramashiva karunyajaladhe gatau tiryagrupam tava padashirodarshanadhiya
    | haribrahmanau tau divi bhuvi carantau shramayutau katham shambho svaminkathaya mama vedyo'si puratah
    || || stotrenalamaham pravacmi na mrisha deva virincadayah stutyanam gananaprasangasamaye tvamagraganyam
    viduh | mahatmyagravicaranaprakarane dhanatushastomava ddhutastvam viduruttamottamaphalam shambho
    bhavatsevakah || || iti shrimatparamahamsaparivrajakacaryasya shrigovindabhagavatpujyapadashishyasya
    shrimacchankarabhagavatah kritau shivanandalahari ||
  devanagari: फलाभ्यां भक्तेषु प्रकटित फलाभ्यां भवतु मे । शिवाभ्या स्फुरदनुभवाभ्यां नतिरियम् ॥ ॥ गलन्ती
    शम्भो त्वच्चरित सरितः किल्बिषरजो दलन्ती धीकुल्या सरणिषु पतन्ती विजयताम् । दिशन्ती संसार परितापोपशमनं
    वसन्ती मच्चेतोह्रदभुवि शिवानन्दलहरी ॥ ॥ त्रयीवेद्यं हृद्यं त्रिपुर हरमाद्यं त्रिनयनं जटाभारोदारं चलदुरगहारं
    मृगधरम् । महादेवं देवं मयि सदयभावं पशुपतिं चिदालम्बं साम्बं शिवमति ॥ सहस्रं वर्तन्ते जगति विबुधाः
    क्षुद्रफलदा न मन्ये स्वप्ने वा तदनुसरणं तत्कृतफलम् । हरि भाजामसुलभं चिरं याचे शम्भो शिव तव पदाम्भोज
    ॥ स्मृतौ शास्त्रे वैद्ये शकुन गानफणितौ पुराणे मन्त्रे वा स्तुति हास्येष्वचतुरः । कथं राज्ञां प्रीतिर्भवति
    मयि कोऽहं पशुपते पशुं मां सर्वज्ञ प्रथित कृपया पालय विभो ॥ ऽप्यणुरपि च धूमोऽग्निरचलः पटो वा तन्तुर्वा
    परिहरति किं घोरशमनम् । वृथा कण्ठक्षोभं वहसि तरसा तर्कवचसा पदाम्भोजं शम्भोर्भज परमसौख्यं व्रज सुधीः
    ॥ ॥ मनस्ते पादाब्जे निवसतु वचः स्तोत्रफणितौ करौ चाभ्यर्चायां श्रुतिरपि कथा कर्णनविधौ । तव ध्याने बुद्धिर्नयनयुगलं
    मूर्तिविभवे ग्रन्थान्कैर्वा परमशिव जाने परमतः ॥ ॥ यथा बुद्धिः शुक्तौ रजतमिति काचाश्मनि मणि र्जले पैष्टे
    क्षीरं भवति मृगतृष्णा सु सलिलम् । तथा देवभ्रान्त्या भजति भवदन्यं जडजनो महादेवेशं त्वां मनसि च न मत्वा
    पशुपते ॥ ॥ गभीरे कासारे विशति विजने घोरविपिने विशाले शैले च भ्रमति कुसुमार्थं जडमतिः । समर्प्यैकं
    चेतः सरसिजमु नावस्थातुं जन इह न जानाति किमहो ॥ ॥ नरत्वं देवत्वं नगवन मृगत्वं मशकता पशुत्वं कीटत्वं
    भवतु विहगत्वादि जननम् । सदा त्वत्पादाब्ज विहारासक्तं चेद्धृदयमिह किं तेन वपुषा ॥ ॥ वटुर्वा गेही वा
    यतिरपि जटी वा तदितरो नरो वा यः कश्चिद्भवतु भव किं तेन भवति । यदीयं हृत्पद्मं यदि भवदधीनं पशुपते तदीयस्त्वं
    शम्भो भवसि भवभारं च वहसि ॥ ॥ गुहायां गेहे वा बहिरपि वने वाऽद्रिशिखरे जले वा वह्नौ वा वसतु वसतेः किं
    वद फलम् । सदा यस्यैवान्तः करणमपि शम्भो तव पदे स्थितं चेद्योगोऽसौ स च परमयोगी स च सुखी ॥ भजनदूरे जडधिया
    भ्रमन्तं मामन्धं परमकृपया पातुमुचितम् । मदन्यः को दीनस्तव कृपण रक्षातिनिपुणः त्वदन्यः स्त्वदन्यः को
    वा मे त्रिजगति शरण्यः पशुपते ॥ ॥ प्रभुस्त्वं दीनानां खलु परमबन्धुः पशुपते प्रमुख्योऽहं तेषामपि किमुत
    बन्धुत्वमनयोः । त्वयैव क्षन्तव्याः शिव मदपराधाश्च सकलाः प्रयत्ना त्कर्तव्यं मदवनमियं बन्धुसरणिः ॥
    ॥ उपेक्षा नो चेत्किं न हरसि भवद्ध्यान मशक्तो यदि भवान् । शिरस्तद्वैधात्रं ननखलु सुवृत्तं पशुपते कथं
    वा निर्यत्नं करनख र्भवतु भवता तत्परशिर श्चतुष्कं संरक्ष्यं स खलु भुवि दैन्यं लिखितवान् । विचारः को
    वा मां विशद कृपया पाति शिव ते कटाक्षव्यापारः स्वयमपि च दीनावनपरः ॥ ॥ फलाद्वा पुण्यानां मयि करुणया
    वा त्वयि विभो प्रसन्नेऽपि स्वामिन् भवदमल युगलम् । कथं पश्येयं मां स्थगयति नमः सम्भ्रमजुषां निलिम्पानां
    श्रेणि ॥ त्वमेको लोकानां परमफलदो दिव्यपदवीं वहन्तस्त्वन्मूलां पुनरपि भजन्ते हरिमुखाः । कियद्वा दाक्षिण्यं
    तव शिव मदाशा च कियती कदा वा मद्रक्षां वहसि करुणा घटके दुरन्ते संसारे दुरितनिलये दुःखजनके । मदायासं
    किं न व्यपनयसि कस्योप कृतये वदेयं प्रीतिश्चेत्तव शिव कृतार्थाः खलु वयम् ॥ ॥ सदा मोहाटव्यां चरति युवतीनां
    कुचगिरौ नटत्याशा स्वटति झटिति स्वैरमभितः । कपालिन् भिक्षो मे हृदय चपलं दृढं भक्त्या बद्ध्वा शिव भवदधीनं
    कुरु विभो ॥ निबद्धां सगमनां विचित्रां पद्माढ्यां प्रतिदिवस घटिताम् । स्मरारे मच्चेतः पटकुटीं प्राप्य
    विशदां जय स्वामिन् शक्त्या सह शिव गणैः सेवित विभो ॥ ॥ प्रलोभाद्यैरर्थाहरण प्रलोभाद्यैः अर्थाहरण प्रवेशोद्युक्तः
    सन् भ्रमति बहुधा तस्करपते । इमं चेतश्चोरं कथमिह सहे शङ्कर विभो तवाधीनं कृत्वा मयि निरपराधे कुरु कृपाम्
    ॥ ॥ करोमि त्वत्पूजां सपदि सुखदो मे भव विभो विधित्वं विष्णुत्वं दिशसि खलु तस्याः फलमिति । पुनश्च त्वां
    द्रष्टुं दिवि भुवि वहन्पक्षि मदृष्ट्वा तत्खेदं कथमिह सहे शङ्कर विभो ॥ ॥ कदा वा कैलासे कनकमणिसौधे सह
    गणै र्वसन् शम्भोरग्रे स्फुट मूर्धाञ्जलिपुटः । विभो साम्ब स्वामि न्परमशिव पाहीति निगद न्विधातॄणां कल्पान्
    क्षणमिव विनेष्यामि सुखतः ॥ वचोभिर्नियमिनां गणानां केलीभिर्मदकलमहोक्षस्य ककुदि । स्थितं नीलग्रीवं त्रिनयन
    वपुषं कदा त्वां पश्येयं करधृत ॥ कदा वा त्वां दृष्ट्वा गिरिश तव भव्याङ्घ्रि युगलं गृहीत्वा हस्ताभ्यां
    शिरसि नयने वक्षसि वहन् । समाश्लिष्या घ्राय स्फुट जलज गन्धान् परिमला नलभ्यां ब्रह्माद्यैर्मुदमनुभविष्यामि
    हृदये ॥ करस्थे हेमाद्रौ गिरिश निकटस्थे धनपतौ गृहस्थे स्वर्भूजा मर सुरभि चिन्तामणिगणे । शिरःस्थे शीतांशौ
    चरणयुगलस्थेऽखिलशुभे कमर्थं दास्येऽहं भवतु भवदर्थं मम मनः ॥ ॥ सारूप्यं तव पूजने शिव महादेवेति सङ्कीर्तने
    सामीप्यं शिवभक्ति सम्भाषणे ॥ सालोक्यं च चराचरात्मकतनुध्याने भवानीपते सायुज्यं मम सिद्धमत्र भवति स्वामिन्
    कृतार्थोऽस्म्यहम् ॥ ॥ त्वत्पादाम्बुजमर्चयामि परमं त्वां चिन्तयाम्यन्वहं त्वामीशं शरणं व्रजामि वचसा
    त्वामेव याचे विभो । वीक्षां मे दिश चाक्षुषीं सकरुणां दिव्यैश्चिरं प्रार्थितां शम्भो लोकगुरो मदीयमनसः
    सौख्योपदेशं कुरु ॥ ॥ वस्त्रोद्धूतविधौ सहस्रकरता पुष्पार्चने विष्णुता गन्धे गन्धवहात्मताऽन्नपचने बर्हिर्मुखाध्यक्षता
    । पात्रे काञ्चनगर्भतास्ति मयि चेद्बालेन्दुचूडामणे शुश्रूषां करवाणि ते पशुपते स्वामिंस्त्रिलोकीगुरो
    ॥ ॥ नालं वा परमोपकारकमिदं त्वेकं पशूनां पते पश्यन् कुक्षिगतांश्चराचरगणान् बाह्यस्थितान् रक्षितुम्
    । सर्वामर्त्यपलायनौषधमतिज्वालाकरं भीकरं निक्षिप्तं गरलं गले न गिलितं नोद्गीर्णमेव त्वया ॥ ॥ ज्वालोग्रः
    सकलामरातिभयदः क्ष्वेलः कथं वा त्वया दृष्टः किं च करे धृतः करतले किं पक्वजम्बूफलम् । जिह्वायां निहितश्च
    सिद्धघुटिका वा कण्ठदेशे भृतः किं ते नीलमणिर्विभूषणमयं शम्भो महात्मन् वद ॥ ॥ नालं वा सकृदेव देव भवतः
    सेवा नतिर्वा नुतिः पूजा वा स्मरणं कथाश्रवणमप्यालोकनं मादृशाम् । स्वामिन्नस्थिरदेवतानुसरणायासेन किं
    लभ्यते का वा मुक्तिरितः कुतो भवति चेत्किं प्रार्थनीयं तदा ॥ ॥ किं ब्रूमस्तव साहसं पशुपते कस्यास्ति
    शम्भो भव द्धैर्यं चेदृशमात्मनः स्थितिरियं चान्यैः कथं लभ्यते । भ्रश्यद्देवगणं त्रसन्मुनिगणं नश्यत्प्रपञ्चं
    लयं पश्यन्निर्भय एक एव विहरत्यानन्दसान्द्रो भवान् ॥ ॥ योगक्षेमधुरन्धरस्य सकलश्रेयःप्रदोद्योगिनो दृष्टादृष्टमतोपदेशकृतिनो
    बाह्यान्तरव्यापिनः । सर्वज्ञस्य दयाकरस्य भवतः किं वेदितव्यं मया शम्भो त्वं परमान्तरङ्ग इति मे चित्ते
    स्मराम्यन्वहम् ॥ ॥ भक्तो भक्तिगुणावृते मुदमृतापूर्णे प्रसन्ने मनः कुम्भे साम्ब तवाङ्घ्रिपल्लवयुगं
    संस्थाप्य संवित्फलम् । सत्त्वं मन्त्रमुदीरयन्निजशरीरागारशुद्धिं वहन् पुण्याहं प्रकटीकरोमि रुचिरं कल्याणमापादयन्
    ॥ ॥ आम्नायाम्बुधिमादरेण सुमनःसङ्घाः समुद्यन्मनो मन्थानं दृढभक्तिरज्जुसहितं कृत्वा मथित्वा ततः । सोमं
    कल्पतरुं सुपर्वसुरभिं चिन्तामणिं धीमतां नित्यानन्दसुधां निरन्तररमासौभाग्यमातन्वते ॥ ॥ प्राक्पुण्याचलमार्गदर्शितसुधामूर्तिः
    प्रसन्नः शिवः सोमः सद्गणसेवितो मृगधरः पूर्णस्तमोमोचकः । चेतः पुष्करलक्षितो भवति चेदानन्दपाथोनिधिः
    प्रागल्भ्येन विजृम्भते सुमनसां वृत्तिस्तदा जायते ॥ ॥ धर्मो मे चतुरङ्घ्रिकः सुचरितः पापं विनाशं गतं
    कामक्रोधमदादयो विगलिताः कालाः सुखाविष्कृताः । ज्ञानानन्दमहौषधिः सुफलिता कैवल्यनाथे सदा मान्ये मानसपुण्डरीकनगरे
    राजावतंसे स्थिते ॥ ॥ धीयन्त्रेण वचोघटेन कविताकुल्योपकुल्याक्रमै कविताकुल्योपकुल्याक्रमैः रानीतैश्च
    सदाशिवस्य चरिताम्भोराशिदिव्यामृतैः । हृत्केदारयुताश्च भक्तिकलमाः साफल्यमातन्वते दुर्भिक्षान्मम सेवकस्य
    भगवन्विश्वेश भीतिः कुतः ॥ ॥ पापोत्पातविमोचनाय रुचिरैश्वर्याय मृत्युञ्जय स्तोत्रध्याननतिप्रदक्षिणसपर्यालोकनाकर्णने
    । जिह्वाचित्तशिरोङ्घ्रिहस्तनयनश्रोत्रैरहं प्रार्थितो मामाज्ञापय तन्निरूपय मुहुर्मामेव मा मेऽवचः ॥
    ॥ गाम्भीर्यं परिखापदं घनधृतिः प्राकार उद्यद्गुण स्तोमश्चाप्तबलं घनेन्द्रियचयो द्वाराणि देहे स्थितः
    । विद्या वस्तुसमृद्धिरित्यखिलसामग्रीसमेते सदा दुर्गातिप्रियदेव मामकमनोदुर्गे निवासं कुरु ॥ ॥ मा गच्छ
    त्वमितस्ततो गिरिश भो मय्येव वासं कुरु स्वामिन्नादिकिरात मामकमनःकान्तारसीमान्तरे । वर्तन्ते बहुशो मृगा
    मदजुषो मात्सर्यमोहादय स्तान्हत्वा मृगयाविनोदरुचिता लाभं च सम्प्राप्स्यसि ॥ ॥ करलग्नमृगः करीन्द्रभङ्गो
    घनशार्दूलविखण्डनोऽस्तजन्तुः । गिरिशो विशदाकृतिश्च चेतः कुहरे पञ्चमुखोऽस्ति मे कुतो भीः ॥ ॥ छन्दः शाखिशिखान्वितैर्
    द्विजवरैः संसेविते शाश्वते सौख्यापादिनि खेदभेदिनि सुधासारैः फलैर्दीपिते । चेतःपक्षिशिखामणे त्यज वृथा
    सञ्चारमन्यैरलं नित्यं शङ्कर पादपद्मयुगलीनीडे विहारं कुरु ॥ ॥ आकीर्णे नखराजिकान्तिविभवै राधौतेऽपि च
    पद्मरागललिते हंसव्रजैराश्रिते । नित्यं भक्तिवधूगणैश्च रहसि स्वेच्छाविहारं कुरु स्थित्वा मानसराजहंस
    गिरिजानाथाङ्घ्रिसौधान्तरे ॥ ॥ शम्भुध्यान वसन्तसङ्गिनि हृदारामेऽघजीर्णच्छदाः स्रस्ता भक्तिलताच्छटा
    विलसिताः पुण्यप्रवालश्रिताः । दीप्यन्ते गुणकोरका जपवचःपुष्पाणि सद्वासना ज्ञानानन्द सुधामरन्दलहरी संवित्फलाभ्युन्नतिः
    ॥ ॥ नित्यानन्दरसालयं सुरमुनिस्वान्ताम्बुजाताश्रयं स्वच्छं सद्द्विजसेवितं कलुषहृत्सद्वासना विष्कृतम्
    । शम्भुध्यान सरोवरं व्रज मनोहं सावतंस स्थिरं किं क्षुद्रा श्रयपल्वल भ्रमण सञ्जातश्रमं प्राप्स्यसि
    ॥ ॥ आनन्दामृत पूरिता हरपदां भोजा लवालोद्यता स्थैर्योपघ्नमुपेत्य भक्तिलतिका शाखोप शाखान्विता । उच्चै
    र्मानस कायमान पटलीमाक्रम्य निष्कल्मषा नित्याभीष्ट फलप्रदा भवतु मे सत्कर्म संवर्धिता ॥ रम्भ विजृम्भितं
    श्रुतिशिरः स्थानान्तराधिष्ठितं सप्रेम भ्रमराभिराम मसकृत् सद्वासना शोभितम् । भोगीन्द्रा भरणं समस्तसुमनः
    पूज्यं गुणाविष्कृतं सेवे श्रीगिरि मल्लिकार्जुन महालिङ्गं शिवालिङ्गितम् ॥ ॥ भृङ्गीच्छा नटनोत्कटः करिमदग्राही
    स्फुरन् माधवा ह्लादो नादयुतो महासितवपुः पञ्चेषुणा चादृतः । सत्पक्षः सुमनो वनेषु स पुनः साक्षान्मदीये
    मनो राजीवे भ्रमराधिपो विहरतां श्रीशैलवासी विभुः ॥ ॥ कारुण्यामृत वर्षिणं घनविपद्ग्रीष्मच् छिदाकर्मठं
    विद्यासस्य फलोदयाय सुमनः संसेव्य मिच्छाकृतिम् । नृत्यद् भक्त मयूरमद्रि निलयं चञ्चज्जटामण्डलं शम्भो
    वाञ्छति नीलकन्धर सदा त्वां मे मनश्चातकः ॥ ॥ आकाशेन शिखी समस्तफणिनां नेत्रा कलापी नता नुग्राहि प्रणवोपदेशनिनदैः
    केकीति यो गीयते । श्यामां शैलसमुद्भवां घनरुचिं दृष्ट्वा नटन्तं मुदा वेदान्तोपवने विहाररसिकं तं नीलकण्ठं
    भजे ॥ ॥ सन्ध्या घर्मदिनात्ययो हरिकराघात प्रभूतानक ध्वानो वारिदगर्जितं दिविषदां दृष्टिच्छटा चञ्चला
    । भक्तानां परितोषबाष्प विततिर् वृष्टिर् मयूरी शिवा यस्मिन्नुज्ज्वल ताण्डवं विजयते तं नीलकण्ठं भजे
    ॥ ॥ आद्यायामित तेजसे श्रुतिपदैर्वेद्याय साध्याय ते विद्यानन्दमयात्मने त्रिजगतः संरक्षणोद्योगिने ।
    ध्येयायाखिलयोगिभिः सुरगणैर्गेयाय मायाविने सम्यक्ताण्डव सम्भ्रमाय जटिने सेयं नतिः शम्भवे ॥ ॥ नित्याय
    त्रिगुणात्मने पुरजिते कात्यायनी श्रेयसे सत्यायादि कुटुम्बिने मुनिमनः प्रत्यक्ष चिन्मूर्तये । मायासृष्ट
    जगत्त्रयाय सकलाम्नायान्तसञ्चारिणे सायं ताण्डव सम्भ्रमाय जटिने सेयं नतिः शम्भवे ॥ ॥ नित्यं स्वोदरपोषणाय
    सकलानुद्दिश्य वित्ताशया व्यर्थं पर्यटनं करोमि भवतः सेवां न जाने विभो । मज्जन्मान्तर पुण्य पाक बलतस्त्वं
    शर्व सर्वान्तर स्तिष्ठस्येव हि तेन वा पशुपते ते रक्षणीयोऽस्म्यहम् ॥ ॥ एको वारिज बान्धवः क्षितिनभो
    व्याप्तं तमो मण्डलं भित्त्वा लोचन गोचरोऽपि भवति त्वं कोटि सूर्यप्रभः । वेद्यः किं न भवस्यहो घनतरं
    कीदृग्भवेन्मत्तम व्यपनीय मे पशुपते साक्षात्प्रसन्नो भव ॥ ॥ हंसः पद्मवनं समिच्छति यथा नीलाम्बुदं चातकः
    कोकः कोकनदप्रियं प्रतिदिनं चन्द्रं चकोरस्तथा । चेतो वाञ्छति मामकं पशुपते चिन्मार्गमृग्यं विभो गौरीनाथ
    भवत्पदाब्ज युगलं कैवल्य सौख्यप्रदम् ॥ ॥ रोधस्तोयहृतः श्रमेण पथिकश्छायां तरोर्वृष्टितो भीतः स्वस्थगृहं
    गृहस्थमतिथिर् दीनः प्रभुं धार्मिकम् । दीपं सन्तमसाकुलश्च शिखिनं शीता वृतस्त्वं तथा चेतः सर्वभयापहं
    व्रज सुखं शम्भोः पदाम्भोरुहम् ॥ सन्ततिः अयस्कान्तोपलं सूचिका साध्वी नैजविभुं लता क्षितिरुहं सिन्धुः
    सरिद् वल्लभम् । प्राप्नोतीह यथा तथा पशुपतेः पादारविन्द द्वयं चेतोवृत्ति रुपेत्य तिष्ठति सदा सा भक्ति
    रित्युच्यते ॥ ॥ आनन्दाश्रुभिरातनोति पुलकं नैर्मल्यतश्छादनं वाचा शङ्खमुखे स्थितैश्च जठरापूर्तिं चरित्रामृतैः
    । रुद्राक्षै र्भसितेन देव वपुषो रक्षां भवद्भावना पर्यङ्के विनिवेश्य भक्तिजननी भक्तार्भकं रक्षति ॥
    ॥ मार्गावर्तितपादुका पशुपतेरङ्गस्य कूर्चायते गण्डूषाम्बुनिषेचनं पुररिपोर्दिव्याभिषेकायते । किञ्चि
    शेषकबलं नव्योपहारायते भक्तिः किं न करोत्यहो वनचरो भक्तावतंसायते ॥ ॥ वक्षस्ताडनमन्तकस्य कठिनापस्मारसम्मर्दनं
    भूभृत्पर्यटनं नमत्सुरशिरःकोटीरसङ्घर्षणम् । कर्मेदं मृदुलस्य तावकपदद्वन्द्वस्य किं वोचितं मच्चेतोमणिपादुकाविहरणं
    शम्भो सदाङ्गीकुरु ॥ ॥ वक्षस्ताडनशङ्कया विचलितो वैवस्वतो निर्जराः कोटीरोज्ज्वलरत्नदीपकलिकानीराजनं कुर्वते
    । दृष्ट्वा मुक्तिवधूस्तनोति निभृताश्लेषं भवानीपते यच्चेतस्तव पादपद्मभजनं तस्येह किं दुर्लभम् ॥ ॥ क्रीडार्थं
    सृजसि प्रपञ्चमखिलं क्रीडामृगास्ते जनाः यत्कर्माचरितं मया च भवतः प्रीत्यै भवत्येव तत् । शम्भो स्वस्य
    कुतूहलस्य करणं मच्चेष्टितं निश्चितं तस्मान्मामकरक्षणं पशुपते कर्तव्यमेव त्वया ॥ ॥ बहुविधपरितोषबाष्पपूर
    स्फुटपुलकाङ्कितचारुभोगभूमिम् । चिरपदफलकाङ्क्षिसेव्यमानां परमसदाशिवभावनां प्रपद्ये ॥ ॥ अमितमुदमृतं
    मुहुर्दुहन्तीं विमलभवत्पदगोष्ठमावसन्तीम् । सदय पशुपते सुपुण्यपाकां मम परिपालय भक्तिधेनुमेकाम् ॥ ॥
    जडता पशुता कलङ्किता कुटिलचरत्वं च नास्ति मयि देव । अस्ति यदि राजमौले भवदाभरणस्य नास्मि किं पात्रम्
    ॥ ॥ अरहसि रहसि स्वतन्त्रबुद्ध्या वरिवसितुं सुलभः प्रसन्नमूर्तिः । अगणितफलदायकः प्रभुर्मे जगदधिको हृदि
    राजशेखरोऽस्ति ॥ ॥ आरूढभक्तिगुणकुञ्चितभावचाप युक्तैः शिवस्मरणबाणगणैरमोघैः । निर्जित्य किल्बिषरिपून्विजयी
    सुधीन्द्रः सानन्दमावहति सुस्थिरराजलक्ष्मीम् ॥ ॥ ध्यानाञ्जनेन समवेक्ष्य तमःप्रदेशं भित्त्वा महाबलिभिरीश्वरनाममन्त्रैः
    । दिव्याश्रितं भुजगभूषणमुद्वहन्ति ये पादपद्ममिह ते शिव ते कृतार्थाः ॥ ॥ भूदारतामुदवहद्यदपेक्षया श्री
    भूदार एव किमतः सुमते लभस्व । केदारमाकलितमुक्तिमहौषधीनां पादारविन्दभजनं परमेश्वरस्य ॥ ॥ आशापाशक्लेशदुर्वासनादि
    भेदोद्युक्तैर्दिव्यगन्धैरमन्दैः । आशाशाटीकस्य पादारविन्दं चेतःपेटीं वासितां मे तनोतु ॥ ॥ कल्याणिनं
    सरसचित्रगतिं सवेगं सर्वेङ्गितज्ञमनघं ध्रुवलक्षणाढ्यम् । चेतस्तुरङ्गमधिरुह्य चर स्मरारे नेतः समस्तजगतां
    वृषभाधिरूढ ॥ ॥ भक्तिर्महेशपदपुष्करमावसन्ती कादम्बिनीव कुरुते परितोषवर्षम् । सम्पूरितो भवति यस्य मनस्तटाक
    स्तज्जन्मसस्यमखिलं सफलं च नान्यत् ॥ ॥ बुद्धिः स्थिरा भवितुमीश्वरपादपद्म सक्ता वधूर्विरहिणीव सदा स्मरन्ती
    । सद्भावनास्मरणदर्शनकीर्तनादि सम्मोहितेव शिवमन्त्रजपेन विन्ते ॥ ॥ सदुपचारविधिष्वनुबोधितां सविनयां
    सुहृदं समुपाश्रिताम् । मम समुद्धर बुद्धिमिमां प्रभो वरगुणेन नवोढवधूमिव ॥ ॥ नित्यं योगिमनः सरोजदलसञ्चारक्षमस्त्वत्क्रमः
    शम्भो तेन कथं कठोरयमराड्वक्षःकवाटक्षतिः । अत्यन्तं मृदुलं त्वदङ्घ्रियुगलं हा मे मनश्चिन्तय त्येतल्लोचनगोचरं
    कुरु विभो हस्तेन संवाहये ॥ ॥ एष्यत्येष जनिं मनोऽस्य कठिनं तस्मिन्नटानीति म द्रक्षायै गिरिसीम्नि कोमलपदन्यासः
    पुराभ्यासितः । नो चेद्दिव्यगृहान्तरेषु सुमनस्तल्पेषु वेद्यादिषु प्रायः सत्सु शिलातलेषु नटनं शम्भो
    किमर्थं तव ॥ ॥ कञ्चित्कालमुमामहेश भवतः पादारविन्दार्चनैः कञ्चिद्ध्यानसमाधिभिश्च नतिभिः कञ्चित्कथाकर्णनैः
    । कञ्चित्कञ्चिदवेक्षणैश्च नुतिभिः कञ्चिद्दशामीदृशीं यः प्राप्नोति मुदा त्वदर्पितमना जीवन् स मुक्तः
    खलु ॥ ॥ बाणत्वं वृषभत्वमर्धवपुषा भार्यात्वमार्यापते घोणित्वं सखिता मृदङ्गवहता चेत्यादि रूपं दधौ ।
    त्वत्पादे नयनार्पणं च कृतवांस्त्वद्देहभागो हरिः पूज्यात्पूज्यतरः स एव हि न चेत्को वा तदन्योऽधिकः ॥
    ॥ जननमृतियुतानां सेवया देवतानां न भवति सुखलेशः संशयो नास्ति तत्र । अजनिममृतरूपं साम्बमीशं भजन्ते य
    इह परमसौख्यं ते हि धन्या लभन्ते ॥ ॥ शिव तव परिचर्यासन्निधानाय गौर्या भव मम गुणधुर्यां बुद्धिकन्यां
    प्रदास्ये । सकलभुवनबन्धो सच्चिदानन्दसिन्धो सदय हृदयगेहे सर्वदा संवस त्वम् ॥ ॥ जलधिमथनदक्षो नैव पातालभेदी
    न च वनमृगयायां नैव लुब्धः प्रवीणः । अशनकुसुमभूषावस्त्रमुख्यां सपर्यां कथय कथमहं ते कल्पयानीन्दुमौले
    ॥ ॥ पूजाद्रव्यसमृद्धयो विरचिताः पूजां कथं कुर्महे पक्षित्वं न च वा किटित्वमपि न प्राप्तं मया दुर्लभम्
    । जाने मस्तकमङ्घ्रिपल्लवमुमाजाने न तेऽहं विभो न ज्ञातं हि पितामहेन हरिणा तत्त्वेन तद्रूपिणा ॥ ॥ अशनं
    गरलं फणी कलापो वसनं चर्म च वाहनं महोक्षः । मम दास्यसि किं किमस्ति शम्भो तव पादाम्बुजभक्तिमेव देहि
    ॥ ॥ यदा कृताम्भोनिधिसेतुबन्धनः करस्थलाधःकृतपर्वताधिपः । भवानि ते लङ्घितपद्मसम्भव स्तदा शिवार्चास्तवभावनक्षमः
    ॥ ॥ नतिभिर्नुतिभिस्त्वमीश पूजा विधिभिर्ध्यानसमाधिभिर्न तुष्टः । धनुषा मुसलेन चाश्मभिर्वा वद ते प्रीतिकरं
    तथा करोमि ॥ ॥ वचसा चरितं वदामि शम्भो रहमुद्योगविधासु तेऽप्रसक्तः । मनसाकृतिमीश्वरस्य सेवे शिरसा चैव
    सदाशिवं नमामि ॥ ॥ आद्याविद्या हृद्गता निर्गतासी द्विद्या हृद्या हृद्गता त्वत्प्रसादात् । सेवे नित्यं
    श्रीकरं त्वत्पदाब्जं भावे मुक्तेर्भाजनं राजमौले ॥ ॥ दूरीकृतानि दुरितानि दुरक्षराणि दौर्भाग्यदुःखदुरहङ्कृतिदुर्वचांसि
    । सारं त्वदीयचरितं नितरां पिबन्तं गौरीश मामिह समुद्धर सत्कटाक्षैः ॥ ॥ सोमकलाधरमौलौ कोमलघनकन्धरे महामहसि
    । स्वामिनि गिरिजानाथे मामकहृदयं निरन्तरं रमताम् ॥ ॥ सा रसना ते नयने तावेव करौ स एव कृतकृत्यः । या
    ये यौ यो भर्गं वदतीक्षेते सदार्चतः स्मरति ॥ वतिकठिनं ते मनो भवानीश । इति विचिकित्सां सन्त्यज शिव कथमासीद्गिरौ
    तथा वेशः ॥ धैर्याङ्कुशेन निभृतं रभसादाकृष्य भक्तिशृङ्खलया । पुरहर चरणालाने हृदयमदेभं बधान चिद्यन्त्रैः
    ॥ ॥ प्रचरत्यभितः प्रगल्भवृत्त्या मदवानेष मनः करी गरीयान् । परिगृह्य नयेन भक्तिरज्ज्वा परम स्थाणु पदं
    दृढं नयामुम् ॥ ॥ सर्वालङ्कारयुक्तां सरलपदयुतां साधुवृत्तां सुवर्णां सद्भिः संस्तूयमानां सरसगुणयुतां
    लक्षितां लक्षणाढ्याम् । उद्यद्भूषाविशेषामुपगतविनयां द्योतमानार्थरेखां कल्याणीं देव गौरीप्रिय मम कविताकन्यकां
    त्वं गृहाण ॥ ॥ इदं ते युक्तं वा परमशिव कारुण्यजलधे गतौ तिर्यग्रूपं तव पदशिरोदर्शनधिया । हरिब्रह्माणौ
    तौ दिवि भुवि चरन्तौ श्रमयुतौ कथं शम्भो स्वामिन्कथय मम वेद्योऽसि पुरतः ॥ ॥ स्तोत्रेणालमहं प्रवच्मि
    न मृषा देवा विरिञ्चादयः स्तुत्यानां गणनाप्रसङ्गसमये त्वामग्रगण्यं विदुः । माहात्म्याग्रविचारणप्रकरणे
    धानातुषस्तोमव द्धूतास्त्वां विदुरुत्तमोत्तमफलं शम्भो भवत्सेवकाः ॥ ॥ इति श्रीमत्परमहंसपरिव्राजकाचार्यस्य
    श्रीगोविन्दभगवत्पूज्यपादशिष्यस्य श्रीमच्छङ्करभगवतः कृतौ शिवानन्दलहरी ॥
