id: kytb-2-5-upahoma-sheshah-krishna-yajurveda-taittiriya-brahmana-patha-prano-rakshati
category: stotram
name:
  english: KYTB 2.5 Upahoma Sheshah - Krishna Yajurveda Taittiriya Brahmana Patha - Prano Rakshati
content:
  english: krishna yajurvediya taittiriya brahmane dvitiyashtake pancamah prapathakah shri gurubhyo namah
    | harih om || upahomah prano rakshati vishvamejat | iryo bhutva bahudha bahuni | sa ithsarvam vya~nashe
    || yo devo deveshu vibhurantah | avriduda tkshetriyaddhvagadvrisha mmanaso pashikshata | agra midamattu
    no havih || manasashcittedam | bhuta nca gupyate | taddhi deveshvagriyam || || a na etu purashcaram
    | saha devairimagm hava shshreyasi shreyasi | karman mme vagidagm havih | viraddevi purohita | havyavadana
    payini || yaya rupani bahudha vadanti | peshagmsi devah parame janitre | sano viradanapasphuranti
    || || vagdevi jushatamidagm havih || cakshu njyotiramrite nyaktam | asya vijnanaya bahudha nidhiyate
    | tasya sumna mashimahi | ma no hasi dvicakshanam || ayurinnah prati shcakshusha vayam | jiva jyotirashimahi
    | suvarjyoti m || shrotrena bhadra muta shrinvanti satyam | shrotrena vaca mbahudhodya manam | shrotrena
    modashca mahashca shruyate | shrotrena sarva disha ashrinomi || yena pracya uta dakshina | praticyai
    disha shshrinvantyuttarat | tadicchrotra mbahudhodyamanam | aranna nemih pari sarva upahomah udehi
    vajinyo asyaphsvantah | idagm rashtramavisha sunritavat | yo rohito vishvamida njajana | sa no rashtreshu
    sudhitandadhatu || rohagm rohagm rohita aruroha | prajabhirvriddhi ssagmrabdho avidathshadurvih |
    gatu mprapashyanniha rashtramahah drashtramiha rohitah | mridho vya ndyavaprithivi shakvaribhih |
    rashtra nduhathamiha revatibhih || vimamar sha rohito vishvarupah | samacakranah praruho ruhashca
    | divagantvaya mahata mahimna | vi no rashtramunattu payasa svena || yaste vishastapasa sambabhuvuh
    | gayatram va~thsamanu tasta aguh | tastva vishantu mahasa svena | sa mmata putro abhyetu rohitah
    || || yuyamugra marutah prishnimatarah | indrena sayuja pramrinitha shatrun | a vo rohito ashrinodabhidyavah
    | trisaptaso maruta ssvadusammudah || rohito dyavaprithivi jajana | tasmiggstantu mparameshthi tatana
    | tasminchishriye aja ekapat | adrigm haddyavaprithivi balena || rohito dyavaprithivi adrigmhat |
    tena suvah stabhita || so antarikshe rajaso vimanah | tena deva ssuvaranvavindann || susheva ntva
    bhanavo didivagmsa m | samagraso juhvo jatavedah | ukshanti tva vajinama ghritena | sagmsamagne yuvase
    bhojanani || agne shardha mahate saubhagaya | tava dyumna nyuttamani santu | sa spatyagm suyamamakrinushva
    | shatruyatamabhitishtha mahasi || upahomah punarna indro maghava dadatu | dhanani shakro dhanyah
    suradhah ya~cito manah | shrushti no asya havisho jushanah || yani no jina ndhanani | jahartha shura
    manyuna | indranuvinda nastani | anena havisha punah || indra asha bhyah pari | sarvabhyo tyai tva
    kamaya tva samridhe tva | puro dadhe amritatvaya jivase || akutimasyavase | kamamasya samriddhyai
    | indrasya yunjate dhiyah || akuti mmanasah puro dadhe | yajnasya mata suhava me astu | yadicchami
    manasa sakamah | videyamenaddhridaye nivishtam || || sedagniragnigm ratye tyanyan | yatra vaji tanayo
    vidupanih | sahasrapatha akshara sameti || ashana ntva ''shapalebhyah | caturbhyo amrite mbhutasyaddhyakshebhyah
    | vidhema havisha vayam || vishva asha madhuna sagmsrijami | anamiva apa oshadhayo bhavantu | ayam
    ya~jamano mridho vyasyatam || || agribhitah pashavah santu sarve ssomo varuno mitra indrah | brihaspatih
    savita ya ssahasri | pusha no gobhiravasa sarasvati | tvashta rupani samanaktu yajnaih || tvashta
    rupani dadhati sarasvati | pusha bhagagm savita no dadatu | brihaspati rdadadindrah sahasra m | mitro
    data varuna upahomah a no bhara bhagamindra dyumanta m | ni te deshnasya dhimahi prareke | urva iva
    paprathe kamo asme | tamaprina vasupate vasunam || ima mmandaya gobhirashvaih | candravata radhasa
    paprathashca | suvaryavo matibhistubhyam | indraya vahah kushikaso akrann || indrasya nu viryani pravocam
    | yani cakara prathamani vajri || nnahimanvapastatarda | pra vakshana abhina tparvatanam || ahannahi
    mparvate shishriyanam | tvashta 'smai vajragg svarya ntataksha | vashra iva dhenava ssyandamanah |
    anjah samudra mavajagmurapah || vrishayamano m | trikadrukeshva thsutasya | a sayaka mprathamaja mahinam
    || prathamaja mahinam | anmayinamaminah prota mayah | a m | tadikna shatrunna kilavivithse || ahan
    vritram m | indro vajrena mahata vadhena | skandhagmsiva kulishena vivrikna | ahih shayata upaprik
    prithivyam || ayoddhyeva durmada a hi juhve | mahavira || natarirasya samritim pipisha indrashatruh
    || vishvo vihaya aratih | vasurdadhe haste dakshine | taranirna shishrathat | shravasyaya na shishrathat
    | vishvasma idishuddhyase | devatra havyamuhishe | vishvasma ithsukrite varamrinvati | agni rdvara
    vyrinvati || || udujjihano abhi kamamirayann | praprincan vishva bhuvanani purvatha | a ketuna sushamiddho
    yajishthah | kama nno agne abhiharya digbhyah || jushano havyamamriteshu dudhyah | a no rayi m | nidhehi
    yakshadamriteshu bhushann || ashvina yajnamagatam | dashushah purudagmsasa | pusha rakshatu no rayim
    || ya~jnamashvina vardhayanta | imau rayim ya~jamanaya dhattam | imau pashu vi~shvato nah | pusha
    nah patu sadama prayucchann || pra te mahe sarasvati | subhage vajinivati | satyavace bhare matim
    || ida thsarasvati | satyavace prabharema havigmshi | imani te durita saubhagani | tebhirvayagm subhagasa
    upahomah yajno rayo yajna ishe vasunam | yajna ssasyanamuta sukshitinam | yajna ishtah purvacitti
    ndadhatu | yajno brahmanvagm apyetu devan || ayam ve~dih svapatya suvira mbarhirati barahig vi~shve
    avantu devah || bhaga eva bhagavagm astu devah | tena vaya ntva bhaga sarva ijjohavimi | sa no bhaga
    pura eta bhaveha || bhaga praneta rbhaga satyaradhah | bhagema ndhiyamudava dadannah | bhaga prano
    janaya gobhirashvaih rnrivantah syama || shashvati ssama upayanti lokah | shashvati ssama upayantyapah
    | ishta mpurtagm shashvatinagm samanagm shashvatena | havisheshtva 'nantam || iyameva sa ya prathama
    vyaucchat | sa rupani kurute panca devi || dve svasarau vayatastantrametat | sanatanam vi~tatagm shanmayukham
    | avanyag n kirato dhatto anyan | navaprijyate na gamate anta m || a vo yantudavahaso adya | vrishtim
    ye~ vishve maruto junanti | ayam || dharavara maruto dhrishnuvojasah | mriga na bhimastavishebhi rurmibhih
    | agnayo na shushucana rijishinah | bhrumi ndhamanta upa ga avrinvata || vicakrame prithivimesha etam
    | kshetraya vishnu rmanushe dashasyann | dhruvaso asya kirayo janasah | urukshitigm sujanima cakara
    || trirdevah prithivimesha etam | vicakrame shatarcasa mmahitva | pra vishnu rastu tavasasta viyan
    | tveshagg hyasya sthavirasya nama |||| avedhasa m | brihaspatigm sadane sadayaddhvam | sadadyoni
    m | hiranyavarnamarushagm sapema || sa hi shucih shatapatra ssa svavesha rishvah | puru sakhibhya
    a suti nkarishthah || pushaggstava vrate vayam | na rishyema kada cana | stotarasta iha smasi || yaste
    pushannavo anta ssamudre | hiranyayirantarikshe caranti | yabhiryasi dutyagm suryasya | kamena krita
    shshrava icchamanah || || aranyanyaranyanyasau | ya preva nashyasi | katha grama nna pricchasi | na
    tva bhiriva vindati || vrisharavaya vadate | yadupavati ciccikah | aghatibhiriva dhavayann | aranyani
    rmahiyate || uta gava ivadann | uto veshmeva drishyate || ssayam | shakatiriva sarjati || gamangaisha
    ahvayati | darvangaisha upavadhit | vasannaranyanyagm sayam | akrukshaditi manyate || na va aranyanir
    hanti | anyashcennabhigacchati | svadoh phalasya jagdhva | yatra kama nnipadyate || anjanagandhigm
    surabhim | bahvannamakrishivalam | praha m | aranyanimashagm nipadyate catvari ca upahomah vartrahatyaya
    shavase | pritana sahyaya ca | indratva ''vartayamasi || subrahmanam mprithubuddhnamindra | shrutar
    || kshetriyai tva nir rityai tva | druho muncami varunasya pasha mbrahmane tva karomi || || shive
    te dyavaprithivi ubhe ime || sha ssahadbhirastu | sha ndyavaprithivi sahaushadhibhih | shamantarikshagm
    saha vatena te | sha nte catasrah pradisho bhavantu || ya daivishcatasrah pradishah | vatapatnirabhi
    suryo vicashte | tasa ntva jarasa adadhami | pra yakshma etu nir mparacaih || amoci yakshma || druhah
    pashannir rityai codamoci | aha avartimavida thsyonam | apyabhu dbhadre sukritasya loke || suryamrita
    ntamaso grahya yat | deva amunca nnasrijanvyenasah | evamahamima triyajjamishagmsat | druho muncami
    varunasya pasha t || brihaspate yuvamindrashca vasvah | divyasyeshathe uta parthivasya | dhattagm
    rayigg stuvate kiraye cit || ssada nah || devayudhamindramajohuvanah | vishvavridhamabhi ye rakshamanah
    | yena hata dirghamaddhvanamayann | anantamarthamanivar thsyamanah || yatte sujate himavathsu bheshajam
    | mayobhu 'si | tato no dehi sibale || ado giribhyo adhi yatpradhavasi | sagmshobhamana kanyeva shubhre
    || ntva mudgala havisha vardhayanti | sa nah sibale rayimabhajayeha || purva nupashyanjanmabhih |
    janmanyavaraih parani | vedani deva ayamasmiti mam | ahagm hitva sharira t || pranapanau cakshu mmanasi
    sambhritam | hitva sharira va~yamashnavamahai || ima eva ta ushaso yah prathama vyaucchann | ta devyah
    kurvate panca rupa | shashvatirnavaprijyanti | na gamantyanta 'shnavamahai catvari ca ''dhitena |
    rudranamurmya | adityana ntejasa | vishvesha nkratuna | marutamemna juhomi svaha rahamagamam | indrasakha
    svayudhah | asvashasu dushshahah || idam va~rco agnina dattamaga || dirghayutvaya shatasharadaya |
    pratigribhnami mahate viryaya || ayurasi vishvayurasi | sarvayurasi sarvamayurasi | sarva mma ayurbhuyat
    | sarvamayurgesham || bhurbhuva rdharmenannadah | mrityu rdharmenannapatih | brahma kshatragg || prajapatih
    praneta | brihaspatih pura eta | yamah panthah 'nnapatih | annadyamasmin yajne yajamanaya dadatu svaha
    || somo raja rajapatih | rajyamasmin yajne yajamanaya dadatu svaha tthsamratpatih | samra yajne yajamanaya
    dadatu svaha nkshatrapatih | kshatramasmin yajne yajamanaya dadatu svaha mbalapatih | balamasmin yajne
    yajamanaya dadatu svaha rbrahma brahmapatih | brahmasmin yajne yajamanaya dadatu svaha || savita rashtragm
    rashtrapatih | rashtramasmin yajne yajamanaya dadatu svaha vi~tpatih | vishamasmin yajne yajamanaya
    dadatu svaha || sarasvati pushtih pushtipatni | pushtimasmin yajne yajamanaya dadatu svaha mmithunanagm
    rupakri drupapatih | rupenasmin yajne yajamanaya pashu yajne yajamanaya dadatu svaha yajne yajamanaya
    dadatu svaha catvari ca ssomo varuno mitra indro brihaspatih savita pusha sarasvati tvashta dasha
    mpahi ya rijishi tarutrah | ya shshipravan vrishabho yo matinam | yo go dvajrabhridyo harishthah |
    sa indra citragm abhitrindhi vajan || a te shushmo vrishabha etu pashcat | ottaradadharaga purasta
    t | a vishvato abhi same tvarvam | indra dyumnagm suvarvaddhehyasme || proshvasmai puroratham | indraya
    shushamarcata || || abhike cidu lokakrit | sange samathsu vritraha | asmaka mbodhi codita | nabhanta
    m | jyaka adhi dhanvasu || indram yajne havamahe | avajairupa no gamat || indraya shunasiraya | sruca
    juhuta no havih || mprati medhirah || pra havyani ghritavantyasmai | haryashvaya bharata sajoshah
    rbrahmana vavridhanah | shunasiri havirida njushasva || vayah suparna upasedurindra m | priyamedha
    rishayo nadhamanah | apa dhvantamu rnuhi purdhi cakshuh | mumugdhyasma nnidhayeva baddhan || brihadindraya
    gayata || || maruto vritrahantamam | yena jyoti rajanayannritavridhah | deva ndevaya jagrivi || ka
    mihaikah ka ime patangah | manthalah kuli pari ma patanti | anavritainan pradhamantu devah | sauparna
    ncakshustanuva videya || eva vandasva varuna m | namasya dhiramamritasya gopam | sa na shsharma trivarutham
    ssada nah || nake suparnamupa yat patantam | hrida venanto abhyacakshata tva | hiranyapaksham va~runasya
    dutam | yamasya yonau shakuna nno devirabhishtaye | apo bhavantu pitaye yo~rabhisravantu nah || ishana
    varyanam | kshayanti || apo yacami bheshajam || aphsu me somo abravit | anta rvishvani bheshaja |
    agni nca vishvashambhuvam | apashca vishvabheshajih || yadaphsu te sarasvati | goshvashveshu yanmadhu
    | tena me vajinivati | mukhamangdhi sarasvati || ya sarasvati vaishambhalya || ste bhuyishthabhajo
    bhuyasma || aha ntvadasmi madasi tvametat | mamasi yonistava yonirasmi | mamaiva sanvaha havyanyagne
    | putrah pitre lokakrijjatavedah || ihaiva santatra santa ntva 'gne | pranena vaca manasa bibharmi
    | tiro ma santamayurma prahasit || || jyotisha tva vaishvanarenopatishthe || aya ritviyah | yato jato
    arocathah | ta njanannagna aroha | atha no vardhaya rayim || ya te agne yajniya tanustaye m | accha
    vasuni krinvannasme narya puruni | yajno bhutva yajnamasida svam m | jatavedo bhuva ajayamana ssakshaya
    ehi || upavaroha jatavedah punastvam || va~ha nah prajanann | ayuh prajagm rayimasmasu dhehi | ajasro
    didihi no durone || tamindra njohavimi maghavanamugram | satradadhana mapratishkutagm shavagmsi |
    magmhishtho girbhira ca yajniyo 'vavartat | raye no vishva supatha krinotu vajri || trikadrukeshu
    mahisho yavashira ntuvishushmastripat | somamapiba mmamada mahi karma kartave mahamurum || ssatyamindugm
    satya indrah || vidadyati sarama rugnamadreh | mahi pathah purvyagm saddhriyakkah | agra thsupadyaksharanam
    | accha rava mprathama janati ga dgavyagm sarama dridhamurvam | yena nuka mmanushi bhojate vit | a
    ye vishva svapatyani cakruh | krinvanaso amritatvaya gatum || tva nnribhirnripate devahutau || ||
    bhurini vritva haryashva hagmsi | tva ncasvapayo dabhitaye suhantu || eva pahi pratnatha mandatu tva
    | shrudhi brahma vavridhasvota girbhih | avi nkrinuhi pipihishah | jahi shatrugmrabhi ga indra trindhi
    || agne badhasva vimridho nudasva | apamiva apa rakshagmsi sedha | asma dbrihato divo nah || ssrijeha
    || yajna pratitishtha sumatau susheva a tva | vasuni purudha vishantu | dirghamayu ryajamanaya krinvann
    | athamritena jaritaramangdhi || indrah shunava va~thsarasya pratimanametat | arkasya jyotistadidasa
    jyeshtha va~thsaragm shunavathsirametat || indrasya radhah prayata vi~mimanameti | dvadashare pratitishthati
    || ashvayanto gavyanto vajayantah | havamahe tvopaganta va u | abhushantastva sumatau navayam | vayamindra
    tva shunagm huvema || jyotisha tva pancacatvarigmshat || harih om || || krishna yajurvediya taittiriya
    brahmane dvitiyashtake pancamah prapathaka
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय ब्राह्मणे द्वितीयाष्टके पञ्चमः प्रपाठकः श्री गुरुभ्यो नमः । ह॒रिः॒
    ओम् ॥ उपहोमाः प्रा॒णो र॑क्षति॒ विश्व॒मेज॑त् । इर्यो॑ भू॒त्वा ब॑हु॒धा ब॒हूनि॑ । स इथ्सर्वं॒ व्याँ॑नशे
    ॥ यो दे॒वो दे॒वेषु॑ वि॒भूर॒न्तः । आवृ॑दू॒दा त्क्षेत्रिय॑द्ध्व॒गद्वृषा म्मन॒सो प॑शिक्षत । अग्र॑ मि॒दम॑त्तु
    नो ह॒विः ॥ मन॑स॒श्चित्ते॒दम् । भू॒त ञ्च गुप्यते । तद्धि दे॒वेष्व॑ग्रि॒यम् ॥ ॥ आ न॑ एतु पुरश्च॒रम्
    । स॒ह दे॒वैरि॒मग्ं हव श्श्रेय॑सि श्रेयसि । कर्म॑न् म्मे॒ वागि॒दग्ं ह॒विः । वि॒राड्दे॒वी पु॒रोहि॑ता
    । ह॒व्य॒वाडन॑ पायिनी ॥ यया॑ रू॒पाणि॑ बहु॒धा वद॑न्ति । पेशाग्ं॑सि दे॒वाः प॑र॒मे ज॒नित्रे । सानो॑ वि॒राडन॑पस्फुरन्ती
    ॥ ॥ वाग्दे॒वी जु॑षतामि॒दग्ं ह॒विः ॥ चक्षु॑ ञ्ज्योति॑र॒मृते॒ न्य॑क्तम् । अ॒स्य वि॒ज्ञाना॑य बहु॒धा निधी॑यते
    । तस्य॑ सु॒म्न म॑शीमहि । मा नो॑ हासी द्विचक्ष॒णम् ॥ आयु॒रिन्नः॒ प्रती श्चक्षु॑षा व॒यम् । जी॒वा ज्योति॑रशीमहि
    । सुव॒र्ज्योति॑ म् ॥ श्रोत्रे॑ण भ॒द्र मु॒त शृ॑ण्वन्ति स॒त्यम् । श्रोत्रे॑ण॒ वाच॑ म्बहु॒धोद्य मा॑नाम्
    । श्रोत्रे॑ण॒ मोद॑श्च॒ मह॑श्च श्रूयते । श्रोत्रे॑ण॒ सर्वा॒ दिश॒ आशृ॑णोमि ॥ येन॒ प्राच्या॑ उ॒त द॑क्षि॒णा
    । प्र॒तीच्यै॑ दि॒श श्शृ॒ण्वन्त्यु॑त्त॒रात् । तदिच्छ्रोत्र॑ म्बहु॒धोद्यमा॑नम् । अ॒रान्न ने॒मिः परि॒
    सर्व॑ उपहोमाः उ॒देहि॑ वाजि॒न्यो अ॑स्य॒फ्स्व॑न्तः । इ॒दग्ं रा॒ष्ट्रमावि॑श सू॒नृता॑वत् । यो रोहि॑तो॒
    विश्व॑मि॒द ञ्ज॒जान॑ । स नो॑ रा॒ष्ट्रेषु॒ सुधि॑तान्दधातु ॥ रोहग्ं॑ रोह॒ग्ं॒ रोहि॑त॒ आरु॑रोह । प्र॒जाभि॒र्वृद्धि॑
    स्सग्ंर॑ब्धो अविद॒थ्षडु॒र्वीः । गा॒तु म्प्र॒पश्य॑न्नि॒ह रा॒ष्ट्रमाहाः द्रा॒ष्ट्रमि॒ह रोहि॑तः । मृधो॒
    व्या न्द्यावापृथिवी॒ शक्व॑रीभिः । रा॒ष्ट्र न्दु॑हाथामि॒ह रे॒वती॑भिः ॥ विम॑मर् श॒ रोहि॑तो वि॒श्वरू॑पः
    । स॒मा॒च॒क्रा॒णः प्र॒रुहो॒ रुह॑श्च । दिव॑ग॒न्त्वाय॑ मह॒ता म॑हि॒म्ना । वि नो॑ रा॒ष्ट्रमु॑नत्तु॒ पय॑सा॒
