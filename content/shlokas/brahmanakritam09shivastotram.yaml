id: brahmanakritam09shivastotram
category: stotram
name:
  english: brahmanakritam09shivastotram
  devanagari: ब्रह्मणाकृतं०९शिवस्तोत्रम्
content:
  english: brahmana kritam 9 shivastotram brahmovaca | devadeva mahadeva bhaktanugrahakaraka | prasida
    parameshana sarvadevahitaprada || 12|| prasida jagatam natha prasidanandadayaka | prasida shankara
    svamin prasida parameshvara || 13|| om karaya namastubhyamakaraparataraka | prasida sarvadevesha tripuraghna
    maheshvara || 14|| nanavacyaya devaya varanapriya shankara | agunaya namastubhyam prakriteh purushatpara
    || 15|| nirvikaraya nityaya nityatriptaya bhasvate | niranjanaya divyaya trigunaya namo'stu te ||
    16|| sagunaya namastubhyam svargeshaya namo'stu te | sadashivaya shantaya maheshaya pinakine || 17||
    sarvajnaya sharanyaya sadyojataya te namah | vamadevaya rudraya tadapyapurushaya ca || 18|| aghoraya
    susevyaya bhaktadhinaya te namah | ishanaya varenyaya bhaktanandapradayine || 19|| raksha raksha mahadeva
    bhitannassakalamaran | dagdhva ca tripuram sarve kritartha amarah kritah || 5
  devanagari: ब्रह्मणा कृतं ९ शिवस्तोत्रम् ब्रह्मोवाच । देवदेव महादेव भक्तानुग्रहकारक । प्रसीद परमेशान
    सर्वदेवहितप्रद ॥ १२॥ प्रसीद जगतां नाथ प्रसीदानन्ददायक । प्रसीद शङ्कर स्वामिन् प्रसीद परमेश्वर ॥ १३॥
    ॐ काराय नमस्तुभ्यमाकारपरतारक । प्रसीद सर्वदेवेश त्रिपुरघ्न महेश्वर ॥ १४॥ नानावाच्याय देवाय वरणप्रिय
    शङ्कर । अगुणाय नमस्तुभ्यं प्रकृतेः पुरुषात्पर ॥ १५॥ निर्विकाराय नित्याय नित्यतृप्ताय भास्वते । निरञ्जनाय
    दिव्याय त्रिगुणाय नमोऽस्तु ते ॥ १६॥ सगुणाय नमस्तुभ्यं स्वर्गेशाय नमोऽस्तु ते । सदाशिवाय शान्ताय महेशाय
    पिनाकिने ॥ १७॥ सर्वज्ञाय शरण्याय सद्योजाताय ते नमः । वामदेवाय रुद्राय तदाप्यपुरुषाय च ॥ १८॥ अघोराय
    सुसेव्याय भक्ताधीनाय ते नमः । ईशानाय वरेण्याय भक्तानन्दप्रदायिने ॥ १९॥ रक्ष रक्ष महादेव भीतान्नस्सकलामरान्
    । दग्ध्वा च त्रिपुरं सर्वे कृतार्था अमराः कृताः ॥ ५
