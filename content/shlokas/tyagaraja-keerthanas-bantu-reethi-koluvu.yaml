id: tyagaraja-keerthanas-bantu-reethi-koluvu
category: stotram
name:
  english: Tyagaraja Keerthanas Bantu Reethi Koluvu
content:
  english: deshadi pallavi bantu riti kòluviya vayya rama anupallavi tunta vinti vani mòdalaina madadula
    batti nela kulajeyu nija bantu riti kòluviya vayya rama ghana kancukamu rama bhaktudane mudrabillayu
    rama namamane tyagarajunike bantu riti kòluviya vayya rama
  devanagari: देशादि पल्लवि बण्टु रीति कॊलुवीय वय्य राम अनुपल्लवि तुण्ट विण्टि वानि मॊदलैन मदादुल बट्टि
    नेल कूलजेयु निज बण्टु रीति कॊलुवीय वय्य राम घन कञ्चुकमु राम भक्तुडने मुद्रबिल्लयु राम नाममने त्यागराजुनिके
    बण्टु रीति कॊलुवीय वय्य राम
meaning: {}
