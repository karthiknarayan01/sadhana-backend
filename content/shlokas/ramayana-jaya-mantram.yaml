id: ramayana-jaya-mantram
category: stotram
name:
  english: Ramayana Jaya Mantram
content:
  english: jayatyatibalo ramo lakshmanashca mahabalah raja jayati sugrivo raghavenabhipalitah | dasoham
    kosalendrasya ramasyaklishtakarmanah hanuman shatrusainyanam nihanta marutatmajah || na ravana sahasram
    me yuddhe pratibalam bhavet shilabhistu praharatah padapaishca sahasrashah | ardhayitva purim lankamabhivadya
    ca maithilim samriddhardho gamishyami mishatam sarvarakshasam ||
  devanagari: जयत्यतिबलो रामो लक्ष्मणश्च महाबलः राजा जयति सुग्रीवो राघवेणाभिपालितः । दासोहं कोसलेन्द्रस्य
    रामस्याक्लिष्टकर्मणः हनुमान् शत्रुसैन्यानां निहन्ता मारुतात्मजः ॥ न रावण सहस्रं मे युद्धे प्रतिबलं
    भवेत् शिलाभिस्तु प्रहरतः पादपैश्च सहस्रशः । अर्धयित्वा पुरीं लङ्कामभिवाद्य च मैथिलीं समृद्धार्धो गमिष्यामि
    मिषतां सर्वरक्षसाम् ॥
