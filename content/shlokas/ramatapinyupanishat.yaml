id: ramatapinyupanishat
category: upanishad
name:
  english: ramatapinyupanishat
  devanagari: रामतापिन्युपनिषत्
content:
  english: jivavaci namo nama catmarameti giyate | tadatmika ya caturthi tatha mayeti giyate || 1|| mantroyam
    vacako ramo ramo vacyah syadyogaetayoh | phalatashcaiva sarvesham sadhakanam na samshayah || 2|| yatha
    nami vacakena namna yo'bhimukho bhavet | tatha bijatmako mantro mantrino'bhimukho bhavet || 3|| bijashaktim
    nyaseddakshavamayoh stanayorapi | kilo madhye vina bhavyah svavanchaviniyogavan || 4|| sarveshameva
    mantranamesha sadharanah kramah | atra ramo'nantarupastejasa vahnina samah || 5|| sattvanushnaguvishvashcedagnishomatmakam
    jagat | utpannah sitaya bhati candrashcandrikaya yatha || 6|| prakritya sahitah shyamah pitavasa jatadharah
    | dvibhujah kundali ratnamali dhiro dhanurdharah || 7|| prasannavadano jeta ghrishtyashtakavibhushitah
    | prakritya parameshvarya jagadyonyankitankabhrit || 8|| hemabhaya dvibhujaya sarvalankritaya cita
    | shlishtah kamaladharinya pushtah kosalajatmajah || 9|| dakshine lakshmanenatha sadhanushpanina punah
    | hemabhenanujenaiva tatha konatrayam bhavet || 10|| tathaiva tasya mantrasya yasyanushca svanentaya
    | evam trikonarupam syattam deva ye samayayuh || 11|| stutim cakrushca jagatah patim kalpatarau sthitam
    | kamarupaya ramaya namo mayamayaya ca || 12|| namo vedadirupaya onkaraya namo namah | ramadharaya
    ramaya shriramayatmamurtaye || 13|| janakidehabhushaya rakshoghnaya shubhangine | bhadraya raghuviraya
    dashasyantakarupine || 14|| ramabhadra maheshvasa raghuvira nripottama | bho dashasyantakasmakam raksham
    dehi shriyam ca te || 15|| tvamaishvaryam dapayatha sampratyashvarimaranam | kurviti stutya devadyastena
    sardham sukham sthitah || 16|| stuvantyevam hi rishayastada ravana asurah | ramapatnim vanastham yah
    svanivrittyarthamadade || 17|| sa ravana iti khyato yadva ravacca ravanah | tadvyajenekshitum sitam
    ramo lakshmana eva ca || 18|| viceratustada bhumau devim samdrishya casuram | hatva kabandham shabarim
    gatva tasyajnaya taya || 19|| pujito vayuputrena bhaktena ca kapishvaram | ahuya shamsatam sarvamadyantam
    ramalakshmanau || 20|| sa tu rame shankitah sanpratyayartham ca dundubheh | vigraham darshayamasa
    yo ramastamacikshipat || 21|| sapta salanvibhidyashu modate raghavastada | tena hrishtah kapindro'sau
    saramastasya pattanam || 22|| jagamagarjadanujo valino vegato grihat | tada vali nirjagama tam valinamathahave
    || 23|| nihatya raghavo rajye sugrivam sthapayattatah | harinahuya sugrivastvaha cashavido'dhuna ||
    24|| adaya maithilimadya dadatashvashu gacchata | tatastatara hanumanabdhim lankam samayayau || 25||
    sitam drishtva'suranhatva puram dagdhva tatha svayam | agatya ramena saha nyavedayata tattvatah ||
    26|| tada ramah krodharupi tanahuyatha vanaran | taih sardhamadayastrani purim lankam samayayau ||
    27|| tam drishtva udadhishena sardham yuddhamakarayat | ghatashrotrasahasrakshajidbhyam yuktam tamahave||
    28|| hatva bibhishanam tatra sthapyatha janakatmajam | adayankasthitam kritva svapuram tairjagama
    sah || 29|| tatah simhasanasthah san dvibhujo raghunandanah | dhanurdharah prasannatma sarvabharanabhushitah
    || 30|| mudram jnanamayim yamye vame tejaprakashinim | dhritva vyakhyananiratashcinmayah parameshvarah
    || 31|| udagdakshinayoh svasya shatrughnabharatau tatah | hanumantam ca shrotaramagratah syattrikonagam
    || 32|| bharatadhastu sugrivam shatrughnadho bibhishanam | pashcime lakshmanam tasya dhritacchratram
    sacamaram || 33|| tadadhastau talavrintakarau tryasram punarbhavet | evam shatkonamadau svadirghangairesha
    samyutah || 34|| dvitiyam vasudevadyairagneyadishu samyutah | tritiyam vayusunum ca sugrivam bharatam
    tatha || 35|| bibhishanam lakshmanam ca angadam carimardanam | jambavantam ca tairyuktastato dhrishtirjayantakah
    || 36|| vijayashca surashtrashca rashtravardhana eva ca | ashoko dharmapalashca sumantrashcaibhiravritah
    || 37|| tatah sahasradrigvahnirdharmajno varuno'nilah | indvishadhatranantashca dashabhishcaibhiravritah
    || 38|| bahistadayudhaih pujyo niladibhiralankritah | vasishthavamadevadimunibhih samupasitah || 39||
    evamuddeshatah proktam nirdeshastasya cadhuna | trirekhaputamalikhya madhye taradvayam likhet || 40||
    tanmadhye bijamalikhya tadadhah sadhyamalikhet | dvitiyantam ca tasyordhvam shashthyantam sadhakam
    tatha || 41|| kuru dvayam ca tatparshve likhedbijantare ramam | tatsarvam pranavabhyam ca veshtayecchuddhabuddhiman
    || 42|| dirghabhaji shadasre tu likhedbijam hridadibhih | konaparshve ramamaye tadagre'nangamalikhet
    || 43|| krodham konagrantareshu likhya mantryabhito giram | vrittatrayam sashtapatram saroje vilikhetsvaran
    || 44|| kesare cashtapatre ca vargashtakamathalikhet | teshu malamanorvarnanvilikhedurmisamkhyaya
    || 45|| ante pancaksharanyevam punarashtadalam likhet | teshu narayanashtarnamlikhya tatkesare ramam
    || 46|| tadbahirdvadashadalam vilikheddvadashaksharam | athom namo bhagavate vasudevaya ityayam ||
    47|| adikshantankesareshu vrittakarena samlikhet | tadbahih shodashadalam likhya tatkesare hriyam
    || 48|| varmastranatisamyuktam daleshu dvadashaksharam | tatsandhishvirajadinam mantranmantri samalikhet
    || 49|| hram sram bhram vram lu am shram jram ca likhetsamyaktato bahih | dvatrimsharam mahapadmam
    nadabindusamayutam || 50|| vilikhenmantrarajarnamsteshu patreshu yatnatah | dhyayedashtavasunekadasharudramshca
    tatra vai || 51|| dvadashenamshca dhataram vashatkaram ca tadbahih | bhugriham vajrashuladhyam rekhatrayasamanvitam
    || 52|| dvaropatam ca rashyadibhushitam phanisamyutam | ananto vasukishcaiva takshah karkotapadmakah
    || 53|| mahapadmashca shankhashca guliko'shtau prakirtitah | evam mandalamalikhya tasya dikshu vidikshu
    ca || 54|| narasimham ca varaham likhenmantradvayam tatha | kuto rephanugrahendunadashaktyadibhiryutah
    || 55|| yo nrisimhah samakhyato grahamaranakarmani | antyanghrishaviyadbindunadairbijam ca saukaram
    || 56|| humkaram catra ramasya malamantro'dhuneritah | taro natishca nidrayah smritirbhedashca kamika
    || 57|| rudrena samyuta vahnimedhamaravibhushita | dirgha krurayuta hladinyatho dirghasamayuta ||
    58|| kshudha krodhinyamogha ca vishvamapyatha medhaya | yukta dirghajvalini ca susukshma mrityurupini
    || 59|| sapratishtha hladini tvakkshvelapritishca samara | jyotistikshnagnisamyukta shvetanusvarasamyuta
    || 60|| kamikapancamulantastantanto thanta ityatha | sa sananto dirghayuto vayuh sukshmayuto vishah
    || 61|| kamika kamaka rudrayuktatho'tha sthiratapa | tapini dirghayukta bhuranalo'nantago'nilah ||
    62|| narayanatmakah kalah pranambho vidyaya yutah | pitaratistatha lanto yonya yuktastato natih ||
    63|| saptacatvarimshadvarnagunantah saguna
  devanagari: जीववाची नमो नाम चात्मारामेति गीयते । तदात्मिका या चतुर्थी तथा मायेति गीयते ॥ १॥ मन्त्रोयं
    वाचको रामो रामो वाच्यः स्याद्योगएतयोः । फलतश्चैव सर्वेषां साधकानां न संशयः ॥ २॥ यथा नामी वाचकेन नाम्ना
    योऽभिमुखो भवेत् । तथा बीजात्मको मन्त्रो मन्त्रिणोऽभिमुखो भवेत् ॥ ३॥ बीजशक्तिं न्यसेद्दक्षवामयोः स्तनयोरपि
    । कीलो मध्ये विना भाव्यः स्ववाञ्च्हाविनियोगवान् ॥ ४॥ सर्वेषामेव मन्त्राणामेष साधारणः क्रमः । अत्र
    रामोऽनन्तरूपस्तेजसा वह्निना समः ॥ ५॥ सत्त्वनुष्णगुविश्वश्चेदग्नीषोमात्मकं जगत् । उत्पन्नः सीतया भाति
    चन्द्रश्चन्द्रिकया यथा ॥ ६॥ प्रकृत्या सहितः श्यामः पीतवासा जटाधरः । द्विभुजः कुण्डली रत्नमाली धीरो
    धनुर्धरः ॥ ७॥ प्रसन्नवदनो जेता घृष्ट्यष्टकविभूषितः । प्रकृत्या परमेश्वर्या जगद्योन्याङ्किताङ्कभृत्
    ॥ ८॥ हेमाभया द्विभुजया सर्वालङ्कृतया चिता । श्लिष्टः कमलधारिण्या पुष्टः कोसलजात्मजः ॥ ९॥ दक्षिणे लक्ष्मणेनाथ
    सधनुष्पाणिना पुनः । हेमाभेनानुजेनैव तथा कोणत्रयं भवेत् ॥ १०॥ तथैव तस्य मन्त्रस्य यस्याणुश्च स्वङेन्तया
    । एवं त्रिकोणरूपं स्यात्तं देवा ये समाययुः ॥ ११॥ स्तुतिं चक्रुश्च जगतः पतिं कल्पतरौ स्थितम् । कामरूपाय
    रामाय नमो मायामयाय च ॥ १२॥ नमो वेदादिरूपाय ओङ्काराय नमो नमः । रमाधराय रामाय श्रीरामायात्ममूर्तये ॥
    १३॥ जानकीदेहभूषाय रक्षोघ्नाय शुभाङ्गिने । भद्राय रघुवीराय दशास्यान्तकरूपिणे ॥ १४॥ रामभद्र महेश्वास
    रघुवीर नृपोत्तम । भो दशास्यान्तकास्माकं रक्षां देहि श्रियं च ते ॥ १५॥ त्वमैश्वर्यं दापयाथ संप्रत्याश्वरिमारणम्
    । कुर्विति स्तुत्य देवाद्यास्तेन सार्धं सुखं स्थिताः ॥ १६॥ स्तुवन्त्येवं हि ऋषयस्तदा रावण आसुरः ।
    रामपत्नीं वनस्थां यः स्वनिवृत्त्यर्थमाददे ॥ १७॥ स रावण इति ख्यातो यद्वा रावाच्च रावणः । तद्व्याजेनेक्षितुं
    सीतां रामो लक्ष्मण एव च ॥ १८॥ विचेरतुस्तदा भूमौ देवीं संदृश्य चासुरम् । हत्वा कबन्धं शबरीं गत्वा तस्याज्ञया
    तया ॥ १९॥ पूजितो वायुपुत्रेण भक्तेन च कपीश्वरम् । आहूय शंसतां सर्वमाद्यन्तं रामलक्ष्मणौ ॥ २०॥ स तु
    रामे शङ्कितः सन्प्रत्ययार्थं च दुन्दुभेः । विग्रहं दर्शयामास यो रामस्तमचिक्षिपत् ॥ २१॥ सप्त सालान्विभिद्याशु
    मोदते राघवस्तदा । तेन हृष्टः कपीन्द्रोऽसौ सरामस्तस्य पत्तनम् ॥ २२॥ जगामागर्जदनुजो वालिनो वेगतो गृहात्
    । तदा वाली निर्जगाम तं वालिनमथाहवे ॥ २३॥ निहत्य राघवो राज्ये सुग्रीवं स्थापयत्ततः । हरीनाहूय सुग्रीवस्त्वाह
    चाशाविदोऽधुना ॥ २४॥ आदाय मैथिलीमद्य ददताश्वाशु गच्च्हत । ततस्ततार हनुमानब्धिं लङ्कां समाययौ ॥ २५॥
    सीतां दृष्ट्वाऽसुरान्हत्वा पुरं दग्ध्वा तथा स्वयम् । आगत्य रामेण सह न्यवेदयत तत्त्वतः ॥ २६॥ तदा रामः
    क्रोधरूपी तानाहूयाथ वानरान् । तैः सार्धमादायास्त्राणि पुरीं लङ्कां समाययौ ॥ २७॥ तां दृष्ट्वा उदधीशेन
    सार्धं युद्धमकारयत् । घटश्रोत्रसहस्राक्षजिद्भ्यां युक्तं तमाहवे॥ २८॥ हत्वा बिभीषणं तत्र स्थाप्याथ
    जनकात्मजाम् । आदायाङ्कस्थितां कृत्वा स्वपुरं तैर्जगाम सः ॥ २९॥ ततः सिंहासनस्थः सन् द्विभुजो रघुनन्दनः
    । धनुर्धरः प्रसन्नात्मा सर्वाभरणभूषितः ॥ ३०॥ मुद्रां ज्ञानमयीं याम्ये वामे तेजप्रकाशिनीम् । धृत्वा
    व्याख्याननिरतश्चिन्मयः परमेश्वरः ॥ ३१॥ उदग्दक्षिणयोः स्वस्य शत्रुघ्नभरतौ ततः । हनूमन्तं च श्रोतारमग्रतः
    स्यात्त्रिकोणगम् ॥ ३२॥ भरताधस्तु सुग्रीवं शत्रुघ्नाधो बिभीषणम् । पश्चिमे लक्ष्मणं तस्य धृतच्च्ह्रत्रं
    सचामरम् ॥ ३३॥ तदधस्तौ तालवृन्तकरौ त्र्यस्रं पुनर्भवेत् । एवं षट्कोणमादौ स्वदीर्घाङ्गैरेष संयुतः ॥
    ३४॥ द्वितीयं वासुदेवाद्यैराग्नेयादिषु संयुतः । तृतीयं वायुसूनुं च सुग्रीवं भरतं तथा ॥ ३५॥ बिभीषणं
    लक्ष्मणं च अङ्गदं चारिमर्दनम् । जाम्बवन्तं च तैर्युक्तस्ततो धृष्टिर्जयन्तकः ॥ ३६॥ विजयश्च सुराष्ट्रश्च
    राष्ट्रवर्धन एव च । अशोको धर्मपालश्च सुमन्त्रश्चैभिरावृतः ॥ ३७॥ ततः सहस्रदृग्वह्निर्धर्मज्ञो वरुणोऽनिलः
    । इन्द्वीशधात्रनन्ताश्च दशभिश्चैभिरावृतः ॥ ३८॥ बहिस्तदायुधैः पूज्यो नीलादिभिरलङ्कृतः । वसिष्ठवामदेवादिमुनिभिः
    समुपासितः ॥ ३९॥ एवमुद्देशतः प्रोक्तं निर्देशस्तस्य चाधुना । त्रिरेखापुटमालिख्य मध्ये तारद्वयं लिखेत्
    ॥ ४०॥ तन्मध्ये बीजमालिख्य तदधः साध्यमालिखेत् । द्वितीयान्तं च तस्योर्ध्वं षष्ठ्यन्तं साधकं तथा ॥ ४१॥
    कुरु द्वयं च तत्पार्श्वे लिखेद्बीजान्तरे रमाम् । तत्सर्वं प्रणवाभ्यां च वेष्टयेच्छुद्धबुद्धिमान् ॥
    ४२॥ दीर्घभाजि षडस्रे तु लिखेद्बीजं हृदादिभिः । कोणपार्श्वे रमामाये तदग्रेऽनङ्गमालिखेत् ॥ ४३॥ क्रोधं
    कोणाग्रान्तरेषु लिख्य मन्त्र्यभितो गिरम् । वृत्तत्रयं साष्टपत्रं सरोजे विलिखेत्स्वरान् ॥ ४४॥ केसरे
    चाष्टपत्रे च वर्गाष्टकमथालिखेत् । तेषु मालामनोर्वर्णान्विलिखेदूर्मिसंख्यया ॥ ४५॥ अन्ते पञ्चाक्षराण्येवं
    पुनरष्टदलं लिखेत् । तेषु नारायणाष्टार्णांलिख्य तत्केसरे रमाम् ॥ ४६॥ तद्बहिर्द्वादशदलं विलिखेद्द्वादशाक्षरम्
    । अथों नमो भगवते वासुदेवाय इत्ययम् ॥ ४७॥ आदिक्षान्तान्केसरेषु वृत्ताकारेण संलिखेत् । तद्बहिः षोडशदलं
    लिख्य तत्केसरे हृयम् ॥ ४८॥ वर्मास्त्रनतिसंयुक्तं दलेषु द्वादशाक्षरम् । तत्सन्धिष्विरजादीनां मन्त्रान्मन्त्री
    समालिखेत् ॥ ४९॥ ह्रं स्रं भ्रं व्रं लू अं श्रं ज्रं च लिखेत्सम्यक्ततो बहिः । द्वात्रिंशारं महापद्मं
    नादबिन्दुसमायुतम् ॥ ५०॥ विलिखेन्मन्त्रराजार्णांस्तेषु पत्रेषु यत्नतः । ध्यायेदष्टवसूनेकादशरुद्रांश्च
    तत्र वै ॥ ५१॥ द्वादशेनांश्च धातारं वषट्कारं च तद्बहिः । भूगृहं वज्रशूलाढ्यं रेखात्रयसमन्वितम् ॥ ५२॥
    द्वारोपतं च राश्यादिभूषितं फणिसंयुतम् । अनन्तो वासुकिश्चैव तक्षः कर्कोटपद्मकः ॥ ५३॥ महापद्मश्च शङ्खश्च
    गुलिकोऽष्टौ प्रकीर्तिताः । एवं मण्डलमालिख्य तस्य दिक्षु विदिक्षु च ॥ ५४॥ नारसिंहं च वाराहं लिखेन्मन्त्रद्वयं
    तथा । कूटो रेफानुग्रहेन्दुनादशक्त्यादिभिर्युतः ॥ ५५॥ यो नृसिंहः समाख्यातो ग्रहमारणकर्मणि । अन्त्याङ्घ्रीशवियद्बिन्दुनादैर्बीजं
    च सौकरम् ॥ ५६॥ हुंकारं चात्र रामस्य मालमन्त्रोऽधुनेरितः । तारो नतिश्च निद्रायाः स्मृतिर्भेदश्च कामिका
    ॥ ५७॥ रुद्रेण संयुता वह्निमेधामरविभूषिता । दीर्घा क्रूरयुता ह्लादिन्यथो दीर्घसमायुता ॥ ५८॥ क्षुधा
    क्रोधिन्यमोघा च विश्वमप्यथ मेधया । युक्ता दीर्घज्वालिनी च सुसूक्ष्मा मृत्युरूपिणी ॥ ५९॥ सप्रतिष्ठा
    ह्लादिनी त्वक्क्ष्वेलप्रीतिश्च सामरा । ज्योतिस्तीक्ष्णाग्निसंयुक्ता श्वेतानुस्वारसंयुता ॥ ६०॥ कामिकापञ्चमूलान्तस्तान्तान्तो
    थान्त इत्यथ । स सानन्तो दीर्घयुतो वायुः सूक्ष्मयुतो विषः ॥ ६१॥ कामिका कामका रुद्रयुक्ताथोऽथ स्थिरातपा
    । तापिनी दीर्घयुक्ता भूरनलोऽनन्तगोऽनिलः ॥ ६२॥ नारायणात्मकः कालः प्राणाम्भो विद्यया युतः । पीतारातिस्तथा
    लान्तो योन्या युक्तस्ततो नतिः ॥ ६३॥ सप्तचत्वारिंशद्वर्णगुणान्तः सगुण
