id: namavali-49
category: stotram
name:
  english: namavali)
  devanagari: नामावली)
content:
  english: atha namavalih | om shrishankaracaryavaryaya namah | om brahmajnanapradayakaya namah | om ajnanatimiradityaya
    namah | om sujnanambudhicandramase namah | om varnashramapratishthatre namah | om shrimate namah |
    om muktipradayakaya namah | om shishyopadeshanirataya namah | om bhaktabhishtapradayakaya namah |
    om sukshmatattvarahasyajnaya namah | 10 om karyakaryaprabodhakaya namah | om jnanamudrancitakaraya
    namah | om shishyahrittapaharakaya namah | om parivrajyashramoddhartre namah | om sarvatantrasvatantradhiye
    namah | om advaitasthapanacaryaya namah | om sakshacchankararupabhrite namah | om shanmatasthapanacaryaya
    namah | om trayimargaprakashakaya namah | om vedavedantatattvajnaya namah | 20 om durvadimatakhandanaya
    namah | om vairagyanirataya namah | om shantaya namah | om samsararnavatarakaya namah | om prasannavadanambhojaya
    namah | om paramarthaprakashakaya namah | om puranasmritisarajnaya namah | om nityatriptaya namah
    | om mahate namah | om shucaye namah | 30 om nityanandaya namah | om niratankaya namah | om nissangaya
    namah | om nirmalatmakaya namah | om nirmamaya namah | om nirahankaraya namah | om vishvavandyapadambujaya
    namah | om sattvapradhanaya namah | om sadbhavaya namah | om sankhyatitagunojjvalaya namah | 40 om
    anaghaya namah | om sarahridayaya namah | om sudhiye namah | om sarasvatapradaya namah | om satyatmane
    namah | om punyashilaya namah | om sankhyayogavicakshanaya namah | om taporashaye namah | om mahatejase
    namah | om gunatrayavibhagavide namah | 50 om kalighnaya namah | om kaladharmajnaya namah | om tamogunanivarakaya
    namah | om bhagavate namah | om bharatijetre namah | om sharadahvanapanditaya namah | om dharmadharmavibhagajnaya
    namah | om lakshyabhedapradarshakaya namah | om nadabindukalabhijnaya namah | om yogihritpadmabhaskaraya
    namah | 60 om atindriyajnananidhaye namah | om nityanityavivekavate namah | om cidanandaya namah |
    om cinmayatmane namah | om parakayapraveshakrite namah | om amanushacaritradhyaya namah | om kshemadayine
    namah | om kshamakaraya namah | om bhavyaya namah | om bhadrapradaya namah | 70 om bhurimahimne namah
    | om vishvaranjakaya namah | om svaprakashaya namah | om sadadharaya namah | om vishvabandhave namah
    | om shubhodayaya namah | om vishalakirtaye namah | om vagishaya namah | om sarvalokahitotsukaya namah
    | om kailasayatrasampraptacandramauliprapujakaya namah | 80 om kancyam shricakrarajakhyayantrasthapanadikshitaya
    namah | om shricakratmakatatankaposhitambamanorathaya namah | om shribrahmasutropanishadbhashyadigranthakalpakaya
    namah | om caturdikcaturamnayapratishthatre namah | om mahamataye namah | om dvisaptatimatocchettre
    namah | om sarvadigvijayaprabhave namah | om kashayavasanopetaya namah | om bhasmoddhulitavigrahaya
    namah | om jnanatmakaikadandadhyaya namah | 90 om kamandalulasatkaraya namah | om vyasasandarshanapritaya
    namah | om bhagavatpadasamjnakaya namah | om catushshashtikalabhijnaya namah | om brahmarakshasamokshadaya
    namah | om saundaryalaharimukhyabahustotravidhayakaya namah | om shrimanmandanamishrakhyasvayambhujayasannutaya
    namah | om totakacaryasampujyaya namah | om padmapadarcitanghrikaya namah | om hastamalakayogindrabrahmajnanapradayakaya
    namah | 100 om sureshvaradishatshishyasamnyasashramadayakaya namah | om nirvyajakarunamurtaye namah
    | om jagatpujyaya namah | om jagadgurave namah | om bheripatahavadyadirajalakshanalakshitaya namah
    | om sakritsmaranasantushtaya namah | om sarvajnaya namah | om jnanadayakaya namah | 108 iti shrishankaracaryashtottarashata
    sarthanamavalih samapta
  devanagari: अथ नामावलिः । ॐ श्रीशङ्कराचार्यवर्याय नमः । ॐ ब्रह्मज्ञानप्रदायकाय नमः । ॐ अज्ञानतिमिरादित्याय
    नमः । ॐ सुज्ञानाम्बुधिचन्द्रमसे नमः । ॐ वर्णाश्रमप्रतिष्ठात्रे नमः । ॐ श्रीमते नमः । ॐ मुक्तिप्रदायकाय
    नमः । ॐ शिष्योपदेशनिरताय नमः । ॐ भक्ताभीष्टप्रदायकाय नमः । ॐ सूक्ष्मतत्त्वरहस्यज्ञाय नमः । १० ॐ कार्याकार्यप्रबोधकाय
    नमः । ॐ ज्ञानमुद्राञ्चितकराय नमः । ॐ शिष्यहृत्तापहारकाय नमः । ॐ परिव्राज्याश्रमोद्धर्त्रे नमः । ॐ
    सर्वतन्त्रस्वतन्त्रधिये नमः । ॐ अद्वैतस्थापनाचार्याय नमः । ॐ साक्षाच्छङ्कररूपभृते नमः । ॐ षण्मतस्थापनाचार्याय
    नमः । ॐ त्रयीमार्गप्रकाशकाय नमः । ॐ वेदवेदान्ततत्त्वज्ञाय नमः । २० ॐ दुर्वादिमतखण्डनाय नमः । ॐ वैराग्यनिरताय
    नमः । ॐ शान्ताय नमः । ॐ संसारार्णवतारकाय नमः । ॐ प्रसन्नवदनाम्भोजाय नमः । ॐ परमार्थप्रकाशकाय नमः ।
    ॐ पुराणस्मृतिसारज्ञाय नमः । ॐ नित्यतृप्ताय नमः । ॐ महते नमः । ॐ शुचये नमः । ३० ॐ नित्यानन्दाय नमः
    । ॐ निरातङ्काय नमः । ॐ निस्सङ्गाय नमः । ॐ निर्मलात्मकाय नमः । ॐ निर्ममाय नमः । ॐ निरहङ्काराय नमः ।
    ॐ विश्ववन्द्यपदाम्बुजाय नमः । ॐ सत्त्वप्रधानाय नमः । ॐ सद्भावाय नमः । ॐ सङ्ख्यातीतगुणोज्ज्वलाय नमः
    । ४० ॐ अनघाय नमः । ॐ सारहृदयाय नमः । ॐ सुधिये नमः । ॐ सारस्वतप्रदाय नमः । ॐ सत्यात्मने नमः । ॐ पुण्यशीलाय
    नमः । ॐ साङ्ख्ययोगविचक्षणाय नमः । ॐ तपोराशये नमः । ॐ महातेजसे नमः । ॐ गुणत्रयविभागविदे नमः । ५० ॐ
    कलिघ्नाय नमः । ॐ कालधर्मज्ञाय नमः । ॐ तमोगुणनिवारकाय नमः । ॐ भगवते नमः । ॐ भारतीजेत्रे नमः । ॐ शारदाह्वानपण्डिताय
    नमः । ॐ धर्माधर्मविभागज्ञाय नमः । ॐ लक्ष्यभेदप्रदर्शकाय नमः । ॐ नादबिन्दुकलाभिज्ञाय नमः । ॐ योगिहृत्पद्मभास्कराय
    नमः । ६० ॐ अतीन्द्रियज्ञाननिधये नमः । ॐ नित्यानित्यविवेकवते नमः । ॐ चिदानन्दाय नमः । ॐ चिन्मयात्मने
    नमः । ॐ परकायप्रवेशकृते नमः । ॐ अमानुषचरित्राढ्याय नमः । ॐ क्षेमदायिने नमः । ॐ क्षमाकराय नमः । ॐ भव्याय
    नमः । ॐ भद्रप्रदाय नमः । ७० ॐ भूरिमहिम्ने नमः । ॐ विश्वरञ्जकाय नमः । ॐ स्वप्रकाशाय नमः । ॐ सदाधाराय
    नमः । ॐ विश्वबन्धवे नमः । ॐ शुभोदयाय नमः । ॐ विशालकीर्तये नमः । ॐ वागीशाय नमः । ॐ सर्वलोकहितोत्सुकाय
    नमः । ॐ कैलासयात्रासंप्राप्तचन्द्रमौलिप्रपूजकाय नमः । ८० ॐ काञ्च्यां श्रीचक्रराजाख्ययन्त्रस्थापनदीक्षिताय
    नमः । ॐ श्रीचक्रात्मकताटङ्कपोषिताम्बामनोरथाय नमः । ॐ श्रीब्रह्मसूत्रोपनिषद्भाष्यादिग्रन्थकल्पकाय नमः
    । ॐ चतुर्दिक्चतुराम्नायप्रतिष्ठात्रे नमः । ॐ महामतये नमः । ॐ द्विसप्ततिमतोच्छेत्त्रे नमः । ॐ सर्वदिग्विजयप्रभवे
    नमः । ॐ काषायवसनोपेताय नमः । ॐ भस्मोद्धूलितविग्रहाय नमः । ॐ ज्ञानात्मकैकदण्डाढ्याय नमः । ९० ॐ कमण्डलुलसत्कराय
    नमः । ॐ व्याससन्दर्शनप्रीताय नमः । ॐ भगवत्पादसंज्ञकाय नमः । ॐ चतुष्षष्टिकलाभिज्ञाय नमः । ॐ ब्रह्मराक्षसमोक्षदाय
    नमः । ॐ सौन्दर्यलहरीमुख्यबहुस्तोत्रविधायकाय नमः । ॐ श्रीमन्मण्डनमिश्राख्यस्वयम्भूजयसन्नुताय नमः ।
    ॐ तोटकाचार्यसम्पूज्याय नमः । ॐ पद्मपादार्चिताङ्घ्रिकाय नमः । ॐ हस्तामलकयोगीन्द्रब्रह्मज्ञानप्रदायकाय
    नमः । १०० ॐ सुरेश्वरादिषट्शिष्यसंन्यासाश्रमदायकाय नमः । ॐ निर्व्याजकरुणामूर्तये नमः । ॐ जगत्पूज्याय
    नमः । ॐ जगद्गुरवे नमः । ॐ भेरीपटहवाद्यादिराजलक्षणलक्षिताय नमः । ॐ सकृत्स्मरणसन्तुष्टाय नमः । ॐ सर्वज्ञाय
    नमः । ॐ ज्ञानदायकाय नमः । १०८ इति श्रीशङ्कराचार्याष्टोत्तरशत सार्थनामावलिः समाप्ता
