id: mooka-pancha-sathi-5-mandasmitha-satakam
category: stotram
name:
  english: Mooka Pancha Sathi 5 - Mandasmitha Satakam
content:
  english: badhnimo vayamanjalim pratidinam bandhacchide dehinam kandarpagamatantramulagurave kalyanakelibhuve
    | kamakshya ghanasarapunjarajase kamadruhashcakshusham mandarastabakaprabhamadamushe mandasmitajyotishe
    || || sadhrice navamallikasumanasam nasagramuktamane racaryaya mrinalakandamahasam naisargikaya dvishe
    | svardhunya saha yudhvena himarucerardhasanadhyasine kamakshyah smitamanjaridhavalimadvaitaya tasmai
    namah || || karpuradyuticaturimatitaramalpiyasim kurvati daurbhagyodayameva samvidadhati daushakarinam
    tvisham | kshullaneva manojnamallinikaranphullanapi vyanjati kamakshya mridulasmitamshulahari kamaprasurastu
    me || || ya pinastanamandalopari lasatkarpuralepayate ya nilekshanaratrikantitatishu jyotsnaprarohayate
    | ya saundaryadhunitarangatatishu vyalolahamsayate kamakshyah shishirikarotu hridayam sa me smitapracuri
    || || yesham gacchati purvapakshasaranim kaumudvatah shvetima yesham santatamarurukshati tulakakshyam
    sharaccandramah | yeshamicchati kamburapyasulabhamantevasatprakriyam kamakshya mamatam harantu mama
    te hasatvishamankurah || || ashasimasu santatam vidadhati naishakarim vyakriyam kashanamabhimanabhangakalanakaushalyamabibhrati
    | ishanena vilokita sakutukam kamakshi te kalmasha kleshapayakari cakasti lahari mandasmitajyotisham
    || || arudhasya samunnatastanatatisamrajyasimhasanam kandarpasya vibhorjagattrayaprakatyamudranidheh
    | yasyashcamaracaturim kalayate rashmicchata cancala sa mandasmitamanjari bhavatu nah kamaya kamakshi
    te || || shambhorya parirambhasambhramavidhau nairmalyasimanidhih gairvaniva tarangini kritamridusyandam
    kalindatmajam | kalmashikurute kalankasushamam kanthasthalicumbinim kamakshyah smitakandali bhavatu
    nah kalyanasandohini || || jetum haralatamiva stanatatim sanjagmushi santatam gantum nirmalatamiva
    dvigunitam magna kripastrotasi | labdhum vismayaniyatamiva haram ragakulam kurvati manjuste smitamanjari
    bhavabhayam mathnatu kamakshi me || || shvetapi prakatam nishakararucam malinyamatanvati shitapi smarapavakam
    pashupateh sandhukshayanti sada | svabhavyadadharashritapi namatamuccairdishanti gatim kamakshi sphutamantara
    sphuratu nastvanmandahasaprabha || || vaktrashrisarasijale taralitabhruvallikallolite kalimna dadhati
    katakshajanusha madhuvratim vyapritim | nirnidramalapundarikakuhanapandityamabibhrati kamakshyah smitacaturi
    mama manah kataryamunmulayet || || nityam badhitabandhujivamadharam maitrijusham pallavaih shuddhasya
    dvijamandalasya ca tiraskartaramapyashrita | ya vaimalyavati sadaiva namatam cetah punitetaram kamakshya
    hridayam prasadayatu me sa mandahasaprabha || || druhyanti tamase muhuh kumudinisahayyamabibhrati
    yanti candrakishorashekharavapuhsaudhangane prenkhanam | jnanambhonidhivicikam sumanasam kulankasham
    kurvati kamakshyah smitakaumudi haratu me samsaratapodayam || || kashmiradravadhatukardamaruca kalmashatam
    bibhrati hamsaudhairiva kurvati paricitim harikritairmauktikaih | vakshojanmatusharashailakatake sancaramatanvati
    kamakshya mridulasmitadyutimayi bhagirathi bhasate || || kamborvamshaparampara iva kripasantanavallibhuvah
    samphullastabaka iva prasrimara murtah prasada iva | vakpiyushakana iva tripathagaparyayabheda iva
    bhrajante tava mandahasakiranah kancipurinayike || || vakshoje ghanasarapatraracanabhangisapatnayita
    kanthe mauktikaharayashtikiranavyaparamudrayita | oshthashrinikurumbapallavapute prenkhatprasunayita
    kamakshi sphuratam madiyahridaye tvanmandahasaprabha || || yesham bindurivopari pracalito nasagramuktamanih
    yesham dina ivadhikanthamayate harah karalambanam | yesham bandhurivoshthayorarunima dhatte svayam
    ranjanam kamakshyah prabhavantu te mama shivollasaya hasankurah || || ya jadyambunidhim kshinoti bhajatam
    vairayate kairavaih nityam yam niyamena ya ca yatate kartum trinetrotsavam | bimbam candramasam ca
    vancayati ya garvena sa tadrishi kamakshi smitamanjari tava katham jyotsnetyasau kirtyate || || arudha
    rabhasatpurah purariporashleshanopakrame ya te matarupaiti divyatatinishankakari tatkshanam | oshthau
    vepayati bhruvau kutilayatyanamrayatyananam tam vande mriduhasapurasushamamekamranathapriye || ||
    vaktrendostava candrika smitatatirvalgu sphuranti satam syaccedyuktimidam cakoramanasam kamakshi kautuhalam
    | etaccitramaharnisham yadadhikamesha rucim gahate bimboshthadyumaniprabhasvapi ca yadbibbokamalambate
    || || sadrishyam kalashambudhervahati yatkamakshi mandasmitam shobhamoshtharucamba vidrumabhavametadbhidam
    brumahe | ekasmaduditam pura kila papau sharvah puranah puman etanmadhyasamudbhavam rasayate madhuryarupam
    rasam || || uttungastanakumbhashailakatake vistarikasturika patrashrijushi cancalah smitarucah kamakshi
    te komalah | sandhyadidhitiranjita iva muhuh sandradharajyotisha vyalolamalasharadabhrashakalavyaparamatanvate
    || || kshiram durata eva tishthatu katham vaimalyamatradidam mataste sahapathavithimayatam mandasmitairmanjulaih
    | kim ceyam tu bhidasti dohanavashadekam tu sanjayate kamakshi svayamarthitam pranamatamanyattu doduhyate
    || || karpurairamritairjagajjanani te kamakshi candratapaih muktaharagunairmrinalavalayairmugdhasmitashririyam
    | shrikancipuranayike samataya samstuyate sajjanaih tattadrinmama tapashantividhaye kim devi mandayate
    || || madhyegarbhitamanjuvakyalaharimadhvijharishitala mandarastabakayate janani te mandasmitamshucchata
    | yasya vardhayitum muhurvikasanam kamakshi kamadruho valgurvikshanavibhramavyatikaro vasantamasayate
    || || bimboshthadyutipunjaranjitarucistvanmandahasacchata | kalyanam girisarvabhaumatanaye kallolayatvashu
    me | phullanmallipinaddhahallakamayi maleva ya peshala shrikancishvari maramarditururomadhye muhurlambate
    || || bibhrana sharadabhravibhramadasham vidyotamanapyaso kamakshi smitamanjari kirati te karunyadhararasam
    | ashcaryam shishirikaroti jagatishcalokya cainamaho kamam khelati nilakanthahridayam kautuhalandolitam
    || || prenkhatpraudhakatakshakunjakuhareshvatyacchagucchayitam vaktrenducchavisindhuvicinicaye phenapratanayitam
    | nairantaryavijrimbhitastanatate naicolapattayitam kalushyam kabalikarotu mama te kamakshi mandasmitam
    || || piyusham tava mantharasmitamiti vyarthaiva sapapratha kamakshi dhruvamidrisham yadi bhavedetatkatham
    va shive | mandarasya kathalavam na sahate mathnati mandakini mindum nindati kirtite'pi kalashipathodhimirshyayate
    || || vishvesham nayanotsavam vitanutam vidyotatam candrama vikhyato madanantakena mukutimadhye ca
    sammanyatam | ah kim jatamanena hasasushamamalokya kamakshi te kalankimavalambate khalu dasham kalmashahino'pyasau
    || || cetah shitalayantu nah pashupateranandajivatavo namranam nayanadhvasimasu sharaccandratapopakramah
    | samsarakhyasaroruhakarakhalikare tusharotkarah kamakshi smarakirtibijanikarastvanmandahasankurah
    || || karmaughakhyatamahkacakacikarankamakshi sancintaye tvanmandasmitarocisham tribhuvanakshemankaranankuran
    | ye vaktram shishirashriyo vikasitam candratapambhoruha dveshoddheshonacaturimiva tiraskartum parishkurvate
    || || kuryurnah kulashailarajatanaye kulankasham mangalam kundaspardhanacuncavastava shive mandasmitaprakramah
    | ye kamakshi samastasakshinayanam santoshayantishvaram karpuraprakara iva prasrimarah pumsamasadharanah
    || || kamrena snapayasva karmakuhanacorena maragama vyakhyashikshanadikshitena vidushamakshinalakshmipusha
    | kamakshi smitakandalena kalushasphotakriyacuncuna karunyamritavicikaviharanapracuryadhuryena mam
    || || tvanmandasmitakandalasya niyatam kamakshi shankamahe bimbah kashcana nutanah pracalito naishakarah
    shikarah | kinca kshirapayonidhih pratinidhih svarvahinivicika bibvoko'pi vidamba eva kuhana mallimatallirucah
    || || dushkarmarkanisargakarkashamahassamparkatapatam mila tpankam shankaravallabhe mama manah kancipuralankriye
    | amba tvanmridulasmitamritarase manktva vidhuya vyatha manandodayasaudhashringapadavimarodhumakankshati
    || || namranam nagarajashekharasute nakalayanam purah kamakshi tvaraya vipatprashamena karunyadharah
    kiran | agacchantamanugraham prakatayannanandabijani te nasire mriduhasa eva tanute nathe sudhashitalah
    || || kamakshi prathamanavibhramanidhih kandarpadarpaprasuh mugdhaste mriduhasa eva girije mushnatu
    me kilbisham | yam drashtum vihite karagraha ume shambhustrapamilitam svairam karayati sma tandavavinodanandina
    tanduna || || kshunnam kenacideva dhiramanasa kutrapi nanajanaih karmagranthiniyantritairasugamam
    kamakshi samanyatah | mugdhairdrushtumashakyameva manasa mudhasaya me mauktikam margam darshayatu
    pradipa iva te mandasmitashririyam || || jyotsnakantibhireva nirmalataram naishakaram mandalam hamsaireva
    sharadvilasasamaye vyakocamambhoruham | svacchaireva vikasvarairudugunaih kamakshi bimbam divah punyaireva
    mridusmitaistava mukham pushnati shobhabharam || || managranthividhuntudena rabhasadasvadyamane nava
    premadambarapurnimahimakare kamakshi te tatkshanam | alokya smitacandrikam punarimamunmilanam jagmushim
    cetah shilayate cakoracaritam candrardhacudamaneh || || kamakshi smitamanjarim tava bhaje yasyastvishamankura
    napinastanapanalalasataya nishshankamankeshayah | urdhvam vikshya vikarshati prasrimaranuddamaya shundaya
    sunusute bisashankayashu kuhanadantavalagramanih || || gadhashleshavimardasambhramavashaduddamamuktaguna
    pralambe kucakumbhayorvigalite dakshadvisho vakshasi | ya sakhyena pinahyati pracuraya bhasa tadiyam
    dasham sa me khelatu kamakoti hridaye sandrasmitamshucchata || || mandare tava mantharasmitarucam
    matsaryamalokyate kamakshi smarashasane ca niyato ragodayo lakshyate | candrishu dyutimanjarishu ca
    mahandveshankuro drishyate shuddhanam kathamidrishi girisute'tishuddha dasha kathyatam || || piyusham
    khalu piyate surajanairdugdhambudhirmathyate maheshaishca jatakalapanigadairmandakini nahyate | shitamshuh
    paribhuyate ca tamasa tasmadanetadrishi kamakshi smitamanjari tava vacovaidagdhyamullanghate || ||
    ashanke tava mandahasalaharimanyadrishim candrika mekamreshakutumbini pratipadam yasyah prabhasangame
    | vakshojamburuhe na te racayatah kanciddasham kaunmali masyambhoruhamamba kinca shanakairalambate
    phullatam || || astirnadharakantipallavacaye patam muhurjagmushi maradrohini kandalatsmarasharajvalavalirvyanjati
    | nindanti ghanasaraharavalayajyotsnamrinalani te kamakshi smitacaturi virahiniritim jagahetaram ||
    || suryalokavidhau vikasamadhikam yanti haranti tama ssandoham namatam nijasmaranato doshakaradveshini
    | niryanti vadanaravindakuharannirdhutajadya nrinam shrikamakshi tava smitadyutimayi citriyate candrika
    || || kunthikuryurami kubodhaghatanamasmanmanomathinim shrikamakshi shivankarastava shive shrimandahasankurah
    | ye tanvanti nirantaram tarunimastamberamagramani kumbhadvandvavidambini stanatate muktakuthadambaram
    || || prenkhantah sharadambuda iva shanaih premanilaih prerita majjanto mandanarikanthasushamasindhau
    muhurmantharam | shrikamakshi tava smitamshunikarah shyamayamanashriyo nilambhodharanaipunim tata
    ito nirnidrayantyanjasa || || vyaparam caturananaikavihritau vyakurvati kurvati rudrakshagrahanam
    maheshi satatam vagurmikallolita | utphullam dhavalaravindamadharikritya sphuranti sada shrikamakshi
    sarasvati vijayate tvanmandahasaprabha || || karpuradyutitaskarena mahasa kalmashayatyananam shrikancipuranayike
    patiriva shrimandahaso'pi te | alingatyatipivaram stanatatim bimbadharam cumbati praudham ragabharam
    vyanakti manaso dhairyam dhunitetaram || || vaishadyena ca vishvatapaharanakridapatiyastaya pandityena
    pacelimena jagatam netrotsavotpadena | kamakshi smitakandalaistava tulamarodhumudyogini jyotsnasau
    jalarashiposhanataya dushyam prapanna dasham || || lavanyambujinimrinalavalayaih shringaragandhadvipa
    gramanyah shruticamaraistarunimasvarajyatejonkuraih | anandamritasindhuviciprishatairasyabjahamsaistava
    shrikamakshi mathana mandahasitairmatkam manahkalmasham || || uttungastanamandaliparicalanmanikyaharacchata
    cancacchonimapunjamadhyasaranim matah parishkurvati | ya vaidagdhyamupaiti shankarajatakantaravatipata
    tsvarvapipayasah smitadyutirasau kamakshi te manjula || || sannamaikajusha janena sulabham samsucayanti
    shanai ruttungasya ciradanugrahatarorutpatsyamanam phalam | prathamyena vikasvara kusumavatpragalbhyamabhyeyushi
    kamakshi smitacaturi tava mama kshemankari kalpatam || || dhanushkagrasarasya lolakutilabhrulekhaya
    bibhrato lilalokashilimukham navavayassamrajyalakshmipushah | jetum manmathamardinam janani te kamakshi
    hasah svayam valgurvibhramabhubhrito vitanute senapatiprakriyam || || yannakampata kalakutakabalikare
    cucumbe na yad glanya cakshushi rushitanalashikhe rudrasya tattadrisham | ceto yatprasabham smarajvarashikhijvalena
    lelihyate tatkamakshi tava smitamshukalikahelabhavam prabhavam || || sambhinneva suparvalokatatini
    vicicayairyamunaih sammishreva shashankadiptilahari nilairmahaniradaih | kamakshi sphurita tava smitarucih
    kalanjanaspardhina kalimna kacarocisham vyatikare kanciddashamashnute || || janimo jagadishvarapranayini
    tvanmandahasaprabham shrikamakshi sarojinimabhinavamesha yatah sarvada | asyendoravalokena pashupaterabhyeti
    samphullatam tandralustadabhava eva tanute tadvaiparityakramam || || yanti lohitimanamabhratatini
    dhatucchatakardamaih bhanti balagabhastimalikiranairmeghavali sharadi | bimboshthadyutipunjacumbanakalashonayamanena
    te kamakshi smitarocisha samadashamarodhumakankshate || || shrikamakshi mukhendubhushanamidam mandasmitam
    tavakam netranandakaram tatha himakaro gacchedyatha tigmatam | shitam devi tatha yatha himajalam santapamudraspadam
    shvetam kinca tatha yatha malinatam dhatte ca muktamanih || || tvanmandasmitamanjarim prasrimaram
    kamakshi candratapam santah santatamamanantyamalata tallakshanam lakshyate | asmakam na dhunoti tapakamadhikam
    dhunoti nabhyantaram dhvantam tatkhalu duhkhino vayamidam kenoti no vidmahe || || namrasya pranayaprarudhakalahacchedaya
    padabjayoh mandam candrakishorashekharamaneh kamakshi ragena te | bandhukaprasavashriyam jitavato
    bamhiyasim tadrishim bimboshthasya rucim nirasya hasitajyotsna vayasyayate || || muktanam parimocanam
    vidadhatastatpritinishpadini bhuyo durata eva dhutamarutastatpalanam tanvati | udbhutasya jalantaradaviratam
    tadduratam jagmushi kamakshi smitamanjari tava katham kambostulamashnute || || shrikamakshi tava smitadyutijharivaidagdhyalilayitam
    pashyanto'pi nirantaram suvimalammanya jaganmandale | lokam hasayitum kimarthamanisham prakashyamatanvate
    mandaksham virahayya mangalataram mandaracandradayah || || kshirabdherapi shailarajatanaye tvanmandahasasya
    ca shrikamakshi valakshimodayanidheh kincidbhidam brumahe | ekasmai purushaya devi sa dadau lakshmim
    kadacitpura sarvebhyo'pi dadatyasau tu satatam lakshmim ca vagishvarim || || shrikancipuraratnadipakalike
    tanyeva menatmaje cakorani kulani devi sutaram dhanyani manyamahe | kampatirakutumbacankramakalacuncuni
    cancuputaih nityam yani tava smitendumahasamasvadamatanvate || || shaityaprakramamashrito'pi namatam
    jadyapratham dhunayan nairmalyam paramam gato'pi girisham ragakulam carayan | lilalapapurassaro'pi
    satatam vacamyamanprinayan kamakshi smitarocisham tava samullasah katham varnyate || || shronicancalamekhalamukharitam
    lilagatam mantharam bhruvallicalanam katakshavalanam mandakshavikshacanam | yadvaidagdhyamukhena manmatharipum
    sammohayantyanjasa shrikamakshi tava smitaya satatam tasmai namsakurmahe || || shrikamakshi manojnamandahasitajyotishprarohe
    tava sphitashvetimasarvabhaumasaranipragalbhyamabhyeyushi | candro'yam yuvarajatam kalayate cetidhuram
    candrika shuddha sa ca sudhajhari sahacarisadharmyamalambate || || jyotsna kim tanute phalam tanumatamaushnyaprashantim
    vina tvanmandasmitarocisha tanumatam kamakshi rocishnuna | santapo vinivaryate navavayahpracuryamankuryate
    saundaryam paripuryate jagati sa kirtishca sancaryate || || vaimalyam kumudashriyam himarucah kantyaiva
    sandhukshyate jyotsnarocirapi pradoshasamayam prapyaiva sampadyate | svacchatvam navamauktikasya paramam
    samskarato drishyate kamakshyah smitadidhitervishadima naisargiko bhasate || || prakashyam parameshvarapranayini
    tvanmandahasashriyah shrikamakshi mama kshinotu mamatavaicakshanimakshayam | yadbhityeva niliyate
    himakaro meghodare shuktika garbhe mauktikamandali ca sarasimadhye mrinali ca sa || || herambe ca
    guhe harshabharitam vatsalyamankurayat maradrohini purushe sahabhuvam premankuram vyanjayat | anamreshu
    janeshu purnakarunavaidagdhyamuttalayat kamakshi smitamanjasa tava kathankaram maya kathyate || ||
    sankruddhadvijarajako'pyaviratam kurvandvijaih sangamam vanipaddhatidurago'pi satatam tatsahacaryam
    vahan | ashrantam pashudurlabho'pi kalayanpatyau pashunam ratim shrikamakshi tava smitamritarasasyando
    mayi spandatam || || shrikamakshi maheshvare nirupamapremankuraprakramamam nityam yah prakatikaroti
    sahajamunnidrayanmadhurim | tattadriktava mandahasamahima matah katham manitam tanmurdhna suranimnagam
    ca kalikamindoshca tam nindati || || ye madhuryaviharamantapabhuvo ye shaityamudrakara ye vaishadyadashavisheshasubhagaste
    mandahasankurah | kamakshyah sahajam gunatrayamidam paryayatah kurvatam vanigumphanadambare ca hridaye
    kirtiprarohe ca me || || kamakshya mridulasmitamshunikara dakshantake vikshane mandakshagrahila himadyutimayukhakshepadikshankurah
    | dakshyam pakshmalayantu makshikagudadrakshabhavam vakshu me sukshmam mokshapatham nirikshitumapi
    prakshalayeyurmanah || || jatya shitashitalani madhuranyetani putani te ganganiva payamsi devi patalanyalpasmitajyotisham
    | enahpankaparamparamalinitamekamranathapriye prajnanatsutaram madiyadhishanam prakshalayantu kshanat
    || || ashrantam paratantritah pashupatistvanmandahasankuraih shrikamakshi tadiyavarnasamatasangena
    shankamahe | indum nakadhunim ca shekharayate malam ca dhatte navaih vaikunthairavakunthanam ca kurute
    dhulicayairbhasmanaih || || shrikancipuradevate mriduvacassaurabhyamudraspadam praudhapremalatanavinakusumam
    mandasmitam tavakam | mandam kandalati priyasya vadanaloke samabhashane shlakshne kunmalati prarudhapulake
    cashloshane phullati || || kim traisrotasamambike parinatam srotashcaturtham navam piyushasya samastatapaharanam
    kimva dvitiyam vapuh | kimsvittvannikatam gatam madhurimabhyasaya gavyam payah shrikancipuranayakapriyatame
    mandasmitam tavakam || || bhusha vaktrasaroruhasya sahaja vacam sakhi shashvati nivi vibhramasantateh
    pashupateh saudhi drisham parana | jivaturmadanashriyah shashiruceruccatani devata shrikamakshi giramabhumimayate
    hasaprabhamanjari || || sutih shvetimakandalasya vasatih shringarasarashriyah purtih suktijharirasasya
    lahari karunyapathonidheh | vati kacana kausumi madhurimasvarajyalakshmyastava shrikamakshi mamastu
    mangalakari hasaprabhacaturi || || jantunam janiduhkhamrityulaharisantapanam krintatah praudhanugrahapurnashitalaruco
    nityodayam bibhratah | shrikamakshi visritvara iva kara hasankuraste hatha dalokena nihanyurandhatamasastomasya
    me santatim || || uttungastanamandalasya vilasallavanyalilanati rangasya sphutamurdhvasimani muhuh
    prakashyamabhyeyushi | shrikamakshi tava smitadyutitatirbimboshthakantyankuraih citram vidrumamudritam
    vitanute mauktim vitanashriyam || || svabhavyattava vaktrameva lalitam santoshasampadanam shambhoh
    kim punarancitasmitarucah pandityapatrikritam | ambhojam svata eva sarvajagatam cakshuhpriyambhavukam
    kamakshi sphurite sharadvikasite kidrigvidham bhrajate || || pumbhirnirmalamanasaurvidadhate maitrim
    dridham nirmalam labdhva karmalayam ca nirmalataram kirtim labhantetaram | suktim pakshmalayanti nirmalatamam
    yattavakah sevakah tatkamakshi tava smitasya kalaya nairmalyasimanidheh || || akarshannayanani nakisadasam
    shaityena samstambhaya nnindum kinca vimohayanpashupatim vishvartimuccatayan | himsatsamsritidambaram
    tava shive hasahvayo mantrikah shrikamakshi madiyamanasatamovidveshane ceshtatam || || kshepiyah kshapayantu
    kalmashabhayanyasmakamalpasmita jyotirmandalacankramastava shive kamakshi rocishnavah | pidakarmathakarmagharmasamayavyaparatapanala
    shripata navaharshavarshanasudhasrotasvinishikarah || || shrikamakshi tava smitaindavamahahpure parimphurjati
    praudham varidhicaturim kalayate bhaktatmanam pratibham | daurgatyaprasarastamahpatalikasadharmyamabibhrate
    sarvam kairavasahacaryapadaviritim vidhatte param || || mandaradishu manmatharimahishi prakashyaritim
    nijam kadacitkataya vishankya bahusho vaishadyamudragunah | satatyena tava smite vitanute svairasanavasanam
    || || indhane bhavavitihotranivahe karmaughacandanila praudhimna bahulikrite nipatitam santapacintakulam
    | matarmam parishinca kincidamalaih piyushavarshairiva shrikamakshi tava smitadyutikanaih shaishiryalilakaraih
    || || bhashaya rasanagrakhelanajushah shringaramudrasakhi lilajatarateh sukhena niyamasnanaya menatmaje
    | shrikamakshi sudhamayiva shishira srotasvini tavaki gadhanandatarangita vijayate hasaprabhacaturi
    || || santapam viralikarotu sakalam kamakshi maccetana majjanti madhurasmitamaradhunikallolajaleshu
    te | nairantaryamupetya manmathamarulloleshu yeshu sphutam premenduh pratibimbito vitanute kautuhalam
    dhurjateh || || cetahkshirapayodhimantharacaladragakhyamanthacala kshobhavyapritisambhavam janani
    te mandasmitashrisudham | svadamsvadamuditakautukarasa netratrayi shankari shrikamakshi nirantaram
    parinamatyanandavicimayi || || aloke tava pancasayakariporuddamakautuhala prenkhanmarutaghattanapracalitadanandadugdhambudheh
    | kacidvicirudancati pratinava samvitprarohatmika tam kamakshi kavishvarah smitamiti vyakurvate sarvada
    || || suktih shilayate kimadritanaye mandasmitatte muhuh madhuryagamasampradayamathava sukternu mandasmitam
    | ittham kamapi gahate mama manah sandehamargabhramim shrikamakshi na paramarthyasaranisphurtau nidhatte
    padam || || kridalolakripasaroruhamukhisaudhanganebhyah kavi shrenivakparipatikamritajharisutigrihebhyah
    shive | nirvanankurasarvabhaumapadavisimhasanebhyastava shrikamakshi manojnamandahasitajyotishkanebhyo
    namah || || aryameva vibhavayanmanasi yah padaravindam purah pashyannarabhate stutim sa niyatam labdhva
    katakshacchavim | kamakshya mridulasmitamshulaharijyotsnavayasyanvitam arohatyapavargasaudhavalabhimanandavicimayim
    || || || iti mandasmitashatakam sampurnam || || iti shri mukapancashati sampurna || ||aum tat sat
    ||
  devanagari: बध्नीमो वयमञ्जलिं प्रतिदिनं बन्धच्छिदे देहिनां कन्दर्पागमतन्त्रमूलगुरवे कल्याणकेलीभुवे ।
    कामाक्ष्या घनसारपुञ्जरजसे कामद्रुहश्चक्षुषां मन्दारस्तबकप्रभामदमुषे मन्दस्मितज्योतिषे ॥ ॥ सध्रीचे
    नवमल्लिकासुमनसां नासाग्रमुक्तामणे राचार्याय मृणालकाण्डमहसां नैसर्गिकाय द्विषे । स्वर्धुन्या सह युध्वेन
    हिमरुचेरर्धासनाध्यासिने कामाक्ष्याः स्मितमञ्जरीधवलिमाद्वैताय तस्मै नमः ॥ ॥ कर्पूरद्युतिचातुरीमतितरामल्पीयसीं
    कुर्वती दौर्भाग्योदयमेव संविदधती दौषाकरीणां त्विषाम् । क्षुल्लानेव मनोज्ञमल्लिनिकरान्फुल्लानपि व्यञ्जती
    कामाक्ष्या मृदुलस्मितांशुलहरी कामप्रसूरस्तु मे ॥ ॥ या पीनस्तनमण्डलोपरि लसत्कर्पूरलेपायते या नीलेक्षणरात्रिकान्तिततिषु
    ज्योत्स्नाप्ररोहायते । या सौन्दर्यधुनीतरङ्गततिषु व्यालोलहंसायते कामाक्ष्याः शिशिरीकरोतु हृदयं सा मे
    स्मितप्राचुरी ॥ ॥ येषां गच्छति पूर्वपक्षसरणिं कौमुद्वतः श्वेतिमा येषां सन्ततमारुरुक्षति तुलाकक्ष्यां
    शरच्चन्द्रमाः । येषामिच्छति कम्बुरप्यसुलभामन्तेवसत्प्रक्रियां कामाक्ष्या ममतां हरन्तु मम ते हासत्विषामङ्कुराः
    ॥ ॥ आशासीमसु सन्ततं विदधती नैशाकरीं व्याक्रियां काशानामभिमानभङ्गकलनाकौशल्यमाबिभ्रती । ईशानेन विलोकिता
    सकुतुकं कामाक्षि ते कल्मष क्लेशापायकरी चकास्ति लहरी मन्दस्मितज्योतिषाम् ॥ ॥ आरूढस्य समुन्नतस्तनतटीसाम्राज्यसिंहासनं
    कन्दर्पस्य विभोर्जगत्त्रयप्राकट्यमुद्रानिधेः । यस्याश्चामरचातुरीं कलयते रश्मिच्छटा चञ्चला सा मन्दस्मितमञ्जरी
    भवतु नः कामाय कामाक्षि ते ॥ ॥ शम्भोर्या परिरम्भसम्भ्रमविधौ नैर्मल्यसीमानिधिः गैर्वाणीव तरङ्गिणी कृतमृदुस्यन्दां
    कलिन्दात्मजाम् । कल्माषीकुरुते कलङ्कसुषमां कण्ठस्थलीचुम्बिनीं कामाक्ष्याः स्मितकन्दली भवतु नः कल्याणसन्दोहिनी
    ॥ ॥ जेतुं हारलतामिव स्तनतटीं सञ्जग्मुषी सन्ततं गन्तुं निर्मलतामिव द्विगुणितां मग्ना कृपास्त्रोतसि
    । लब्धुं विस्मयनीयतामिव हरं रागाकुलं कुर्वती मञ्जुस्ते स्मितमञ्जरी भवभयं मथ्नातु कामाक्षि मे ॥ ॥ श्वेतापि
    प्रकटं निशाकररुचां मालिन्यमातन्वती शीतापि स्मरपावकं पशुपतेः सन्धुक्षयन्ती सदा । स्वाभाव्यादधराश्रितापि
    नमतामुच्चैर्दिशन्ती गतिं कामाक्षि स्फुटमन्तरा स्फुरतु नस्त्वन्मन्दहासप्रभा ॥ ॥ वक्त्रश्रीसरसीजले तरलितभ्रूवल्लिकल्लोलिते
    कालिम्ना दधती कटाक्षजनुषा माधुव्रतीं व्यापृतिम् । निर्निद्रामलपुण्डरीककुहनापाण्डित्यमाबिभ्रती कामाक्ष्याः
    स्मितचातुरी मम मनः कातर्यमुन्मूलयेत् ॥ ॥ नित्यं बाधितबन्धुजीवमधरं मैत्रीजुषं पल्लवैः शुद्धस्य द्विजमण्डलस्य
    च तिरस्कर्तारमप्याश्रिता । या वैमल्यवती सदैव नमतां चेतः पुनीतेतरां कामाक्ष्या हृदयं प्रसादयतु मे सा
    मन्दहासप्रभा ॥ ॥ द्रुह्यन्ती तमसे मुहुः कुमुदिनीसाहाय्यमाबिभ्रती यान्ती चन्द्रकिशोरशेखरवपुःसौधाङ्गणे
    प्रेङ्खणम् । ज्ञानाम्भोनिधिवीचिकां सुमनसां कूलङ्कषां कुर्वती कामाक्ष्याः स्मितकौमुदी हरतु मे संसारतापोदयम्
    ॥ ॥ काश्मीरद्रवधातुकर्दमरुचा कल्माषतां बिभ्रती हंसौधैरिव कुर्वती परिचितिं हारीकृतैर्मौक्तिकैः । वक्षोजन्मतुषारशैलकटके
    सञ्चारमातन्वती कामाक्ष्या मृदुलस्मितद्युतिमयी भागीरथी भासते ॥ ॥ कम्बोर्वंशपरम्परा इव कृपासन्तानवल्लीभुवः
    सम्फुल्लस्तबका इव प्रसृमरा मूर्ताः प्रसादा इव । वाक्पीयूषकणा इव त्रिपथगापर्यायभेदा इव भ्राजन्ते तव
    मन्दहासकिरणाः काञ्चीपुरीनायिके ॥ ॥ वक्षोजे घनसारपत्ररचनाभङ्गीसपत्नायिता कण्ठे मौक्तिकहारयष्टिकिरणव्यापारमुद्रायिता
    । ओष्ठश्रीनिकुरुम्बपल्लवपुटे प्रेङ्खत्प्रसूनायिता कामाक्षि स्फुरतां मदीयहृदये त्वन्मन्दहासप्रभा ॥
    ॥ येषां बिन्दुरिवोपरि प्रचलितो नासाग्रमुक्तामणिः येषां दीन इवाधिकण्ठमयते हारः करालम्बनम् । येषां बन्धुरिवोष्ठयोररुणिमा
    धत्ते स्वयं रञ्जनं कामाक्ष्याः प्रभवन्तु ते मम शिवोल्लासाय हासाङ्कुराः ॥ ॥ या जाड्याम्बुनिधिं क्षिणोति
    भजतां वैरायते कैरवैः नित्यं यां नियमेन या च यतते कर्तुं त्रिणेत्रोत्सवम् । बिम्बं चान्द्रमसं च वञ्चयति
    या गर्वेण सा तादृशी कामाक्षि स्मितमञ्जरी तव कथं ज्योत्स्नेत्यसौ कीर्त्यते ॥ ॥ आरुढा रभसात्पुरः पुररिपोराश्लेषणोपक्रमे
    या ते मातरुपैति दिव्यतटिनीशङ्काकरी तत्क्षणम् । ओष्ठौ वेपयति भ्रुवौ कुटिलयत्यानम्रयत्याननं तां वन्दे
    मृदुहासपूरसुषमामेकाम्रनाथप्रिये ॥ ॥ वक्त्रेन्दोस्तव चन्द्रिका स्मितततिर्वल्गु स्फुरन्ती सतां स्याच्चेद्युक्तिमिदं
    चकोरमनसां कामाक्षि कौतूहलम् । एतच्चित्रमहर्निशं यदधिकामेषा रुचिं गाहते बिम्बोष्ठद्युमणिप्रभास्वपि
    च यद्बिब्बोकमालम्बते ॥ ॥ सादृश्यं कलशाम्बुधेर्वहति यत्कामाक्षि मन्दस्मितं शोभामोष्ठरुचाम्ब विद्रुमभवामेताद्भिदां
    ब्रूमहे । एकस्मादुदितं पुरा किल पपौ शर्वः पुराणः पुमान् एतन्मध्यसमुद्भवं रसयते माधुर्यरूपं रसम् ॥
    ॥ उत्तुङ्गस्तनकुम्भशैलकटके विस्तारिकस्तूरिका पत्रश्रीजुषि चञ्चलाः स्मितरुचः कामाक्षि ते कोमलाः । सन्ध्यादीधितिरञ्जिता
    इव मुहुः सान्द्राधरज्योतिषा व्यालोलामलशारदाभ्रशकलव्यापारमातन्वते ॥ ॥ क्षीरं दूरत एव तिष्ठतु कथं वैमल्यमात्रादिदं
    मातस्ते सहपाठवीथिमयतां मन्दस्मितैर्मञ्जुलैः । किं चेयं तु भिदास्ति दोहनवशादेकं तु सञ्जायते कामाक्षि
    स्वयमर्थितं प्रणमतामन्यत्तु दोदुह्यते ॥ ॥ कर्पूरैरमृतैर्जगज्जननि ते कामाक्षि चन्द्रातपैः मुक्ताहारगुणैर्मृणालवलयैर्मुग्धस्मितश्रीरियम्
    । श्रीकाञ्चीपुरनायिके समतया संस्तूयते सज्जनैः तत्तादृङ्मम तापशान्तिविधये किं देवि मन्दायते ॥ ॥ मध्येगर्भितमञ्जुवाक्यलहरीमाध्वीझरीशीतला
    मन्दारस्तबकायते जननि ते मन्दस्मितांशुच्छटा । यस्या वर्धयितुं मुहुर्विकसनं कामाक्षि कामद्रुहो वल्गुर्वीक्षणविभ्रमव्यतिकरो
    वासन्तमासायते ॥ ॥ बिम्बोष्ठद्युतिपुञ्जरञ्जितरुचिस्त्वन्मन्दहासच्छटा । कल्याणं गिरिसार्वभौमतनये कल्लोलयत्वाशु
    मे । फुल्लन्मल्लिपिनद्धहल्लकमयी मालेव या पेशला श्रीकाञ्चीश्वरि मारमर्दितुरुरोमध्ये मुहुर्लम्बते ॥
    ॥ बिभ्राणा शरदभ्रविभ्रमदशां विद्योतमानाप्यसो कामाक्षि स्मितमञ्जरी किरति ते कारुण्यधारारसम् । आश्चर्यं
    शिशिरीकरोति जगतीश्चालोक्य चैनामहो कामं खेलति नीलकण्ठहृदयं कौतूहलान्दोलितम् ॥ ॥ प्रेङ्खत्प्रौढकटाक्षकुञ्जकुहरेष्वत्यच्छगुच्छायितं
    वक्त्रेन्दुच्छविसिन्धुवीचिनिचये फेनप्रतानायितम् । नैरन्तर्यविजृम्भितस्तनतटे नैचोलपट्टायितं कालुष्यं
    कबलीकरोतु मम ते कामाक्षि मन्दस्मितम् ॥ ॥ पीयूषं तव मन्थरस्मितमिति व्यर्थैव सापप्रथा कामाक्षि ध्रुवमीदृशं
    यदि भवेदेतत्कथं वा शिवे । मन्दारस्य कथालवं न सहते मथ्नाति मन्दाकिनी मिन्दुं निन्दति कीर्तितेऽपि कलशीपाथोधिमीर्ष्यायते
    ॥ ॥ विश्वेषां नयनोत्सवं वितनुतां विद्योततां चन्द्रमा विख्यातो मदनान्तकेन मुकुटीमध्ये च सम्मान्यताम्
    । आः किं जातमनेन हाससुषमामालोक्य कामाक्षि ते कालङ्कीमवलम्बते खलु दशां कल्माषहीनोऽप्यसौ ॥ ॥ चेतः शीतलयन्तु
    नः पशुपतेरानन्दजीवातवो नम्राणां नयनाध्वसीमसु शरच्चन्द्रातपोपक्रमाः । संसाराख्यसरोरुहाकरखलीकारे तुषारोत्कराः
    कामाक्षि स्मरकीर्तिबीजनिकरास्त्वन्मन्दहासाङ्कुराः ॥ ॥ कर्मौघाख्यतमःकचाकचिकरान्कामाक्षि सञ्चिन्तये
    त्वन्मन्दस्मितरोचिषां त्रिभुवनक्षेमङ्करानङ्कुरान् । ये वक्त्रं शिशिरश्रियो विकसितं चन्द्रातपाम्भोरुह
    द्वेषोद्धेषोणचातुरीमिव तिरस्कर्तुं परिष्कुर्वते ॥ ॥ कुर्युर्नः कुलशैलराजतनये कूलङ्कषं मङ्गलं कुन्दस्पर्धनचुञ्चवस्तव
    शिवे मन्दस्मितप्रक्रमाः । ये कामाक्षि समस्तसाक्षिनयनं सन्तोषयन्तीश्वरं कर्पूरप्रकरा इव प्रसृमराः पुंसामसाधारणाः
    ॥ ॥ कम्रेण स्नपयस्व कर्मकुहनाचोरेण मारागम व्याख्याशिक्षणदीक्षितेन विदुषामक्षीणलक्ष्मीपुषा । कामाक्षि
    स्मितकन्दलेन कलुषस्फोटक्रियाचुञ्चुना कारुण्यामृतवीचिकाविहरणप्राचुर्यधुर्येण माम् ॥ ॥ त्वन्मन्दस्मितकन्दलस्य
    नियतं कामाक्षि शङ्कामहे बिम्बः कश्चन नूतनः प्रचलितो नैशाकरः शीकरः । किञ्च क्षीरपयोनिधिः प्रतिनिधिः
    स्वर्वाहिनीवीचिका बिब्वोकोऽपि विडम्ब एव कुहना मल्लीमतल्लीरुचः ॥ ॥ दुष्कर्मार्कनिसर्गकर्कशमहस्सम्पर्कतपतं
    मिल त्पङ्कं शङ्करवल्लभे मम मनः काञ्चीपुरालङ्क्रिये । अम्ब त्वन्मृदुलस्मितामृतरसे मङ्क्त्वा विधूय व्यथा
    मानन्दोदयसौधशृङ्गपदवीमारोढुमाकाङ्क्षति ॥ ॥ नम्राणां नगराजशेखरसुते नाकालयानां पुरः कामाक्षि त्वरया
    विपत्प्रशमेन कारुण्यधाराः किरन् । आगच्छन्तमनुग्रहं प्रकटयन्नानन्दबीजानि ते नासीरे मृदुहास एव तनुते
    नाथे सुधाशीतलः ॥ ॥ कामाक्षि प्रथमानविभ्रमनिधिः कन्दर्पदर्पप्रसूः मुग्धस्ते मृदुहास एव गिरिजे मुष्णातु
    मे किल्बिषम् । यं द्रष्टुं विहिते करग्रह उमे शम्भुस्त्रपामीलितं स्वैरं कारयति स्म ताण्डवविनोदानन्दिना
    तण्डुना ॥ ॥ क्षुण्णं केनचिदेव धीरमनसा कुत्रापि नानाजनैः कर्मग्रन्थिनियन्त्रितैरसुगमं कामाक्षि सामान्यतः
    । मुग्धैर्द्रुष्टुमशक्यमेव मनसा मूढसय मे मौक्तिकं मार्गं दर्शयतु प्रदीप इव ते मन्दस्मितश्रीरियम् ॥
    ॥ ज्योत्स्नाकान्तिभिरेव निर्मलतरं नैशाकरं मण्डलं हंसैरेव शरद्विलाससमये व्याकोचमम्भोरुहम् । स्वच्छैरेव
    विकस्वरैरुडुगुणैः कामाक्षि बिम्बं दिवः पुण्यैरेव मृदुस्मितैस्तव मुखं पुष्णाति शोभाभरम् ॥ ॥ मानग्रन्थिविधुन्तुदेन
    रभसादास्वाद्यमाने नव प्रेमाडम्बरपूर्णिमाहिमकरे कामाक्षि ते तत्क्षणम् । आलोक्य स्मितचन्द्रिकां पुनरिमामुन्मीलनं
    जग्मुषीं चेतः शीलयते चकोरचरितं चन्द्रार्धचूडामणेः ॥ ॥ कामाक्षि स्मितमञ्जरीं तव भजे यस्यास्त्विषामङ्कुरा
    नापीनस्तनपानलालसतया निश्शङ्कमङ्केशयः । ऊर्ध्वं वीक्ष्य विकर्षति प्रसृमरानुद्दामया शुण्डया सूनुसुते
    बिसशङ्कयाशु कुहनादन्तावलग्रामणीः ॥ ॥ गाढाश्लेषविमर्दसम्भ्रमवशादुद्दाममुक्तागुण प्रालम्बे कुचकुम्भयोर्विगलिते
    दक्षद्विषो वक्षसि । या सख्येन पिनह्यति प्रचुरया भासा तदीयां दशां सा मे खेलतु कामकोटि हृदये सान्द्रस्मितांशुच्छटा
    ॥ ॥ मन्दारे तव मन्थरस्मितरुचां मात्सर्यमालोक्यते कामाक्षि स्मरशासने च नियतो रागोदयो लक्ष्यते । चान्द्रीषु
    द्युतिमञ्जरीषु च महान्द्वेषाङ्कुरो दृश्यते शुद्धानां कथमीदृशी गिरिसुतेऽतिशुद्धा दशा कथ्यताम् ॥ ॥ पीयूषं
    खलु पीयते सुरजनैर्दुग्धाम्बुधिर्मथ्यते माहेशैश्च जटाकलापनिगडैर्मन्दाकिनी नह्यते । शीतांशुः परिभूयते
    च तमसा तस्मादनेतादृशी कामाक्षि स्मितमञ्जरी तव वचोवैदग्ध्यमुल्लङ्घते ॥ ॥ आशङ्के तव मन्दहासलहरीमन्यादृशीं
    चन्द्रिका मेकाम्रेशकुटुम्बिनि प्रतिपदं यस्याः प्रभासङ्गमे । वक्षोजाम्बुरुहे न ते रचयतः काञ्चिद्दशां
    कौङ्मली मास्याम्भोरुहमम्ब किञ्च शनकैरालम्बते फुल्लताम् ॥ ॥ आस्तीर्णाधरकान्तिपल्लवचये पातं मुहुर्जग्मुषी
    मारद्रोहिणि कन्दलत्स्मरशरज्वालावलीर्व्यञ्जती । निन्दन्ती घनसारहारवलयज्योत्स्नामृणालानि ते कामाक्षि
    स्मितचातुरी विरहिणीरीतिं जगाहेतराम् ॥ ॥ सूर्यालोकविधौ विकासमधिकं यान्ती हरन्ती तम स्सन्दोहं नमतां
    निजस्मरणतो दोषाकरद्वेषिणी । निर्यान्ती वदनारविन्दकुहरान्निर्धूतजाड्या नृणां श्रीकामाक्षि तव स्मितद्युतिमयी
    चित्रीयते चन्द्रिका ॥ ॥ कुण्ठीकुर्युरमी कुबोधघटनामस्मन्मनोमाथिनीं श्रीकामाक्षि शिवङ्करास्तव शिवे श्रीमन्दहासाङ्कुराः
    । ये तन्वन्ति निरन्तरं तरुणिमस्तम्बेरमग्रामणी कुम्भद्वन्द्वविडम्बिनि स्तनतटे मुक्ताकुथाडम्बरम् ॥ ॥
    प्रेङ्खन्तः शरदम्बुदा इव शनैः प्रेमानिलैः प्रेरिता मज्जन्तो मन्दनारिकण्ठसुषमासिन्धौ मुहुर्मन्थरम्
    । श्रीकामाक्षि तव स्मितांशुनिकराः श्यामायमानश्रियो नीलाम्भोधरनैपुणीं तत इतो निर्निद्रयन्त्यञ्जसा ॥
    ॥ व्यापारं चतुराननैकविहृतौ व्याकुर्वती कुर्वती रुद्राक्षग्रहणं महेशि सततं वागूर्मिकल्लोलिता । उत्फुल्लं
    धवलारविन्दमधरीकृत्य स्फुरन्ती सदा श्रीकामाक्षि सरस्वती विजयते त्वन्मन्दहासप्रभा ॥ ॥ कर्पूरद्युतितस्करेण
    महसा कल्माषयत्याननं श्रीकाञ्चीपुरनायिके पतिरिव श्रीमन्दहासोऽपि ते । आलिङ्गत्यतिपीवरां स्तनतटीं बिम्बाधरं
    चुम्बति प्रौढं रागभरं व्यनक्ति मनसो धैर्यं धुनीतेतराम् ॥ ॥ वैशद्येन च विश्वतापहरणक्रीडापटीयस्तया पाण्डित्येन
    पचेलिमेन जगतां नेत्रोत्सवोत्पादेन । कामाक्षि स्मितकन्दलैस्तव तुलामारोढुमुद्योगिनी ज्योत्स्नासौ जलराशिपोषणतया
    दूष्यां प्रपन्ना दशाम् ॥ ॥ लावण्याम्बुजिनीमृणालवलयैः शृङ्गारगन्धद्विप ग्रामण्यः श्रुतिचामरैस्तरुणिमस्वाराज्यतेजोङ्कुरैः
    । आनन्दामृतसिन्धुवीचिपृषतैरास्याब्जहंसैस्तव श्रीकामाक्षि मथान मन्दहसितैर्मत्कं मनःकल्मषम् ॥ ॥ उत्तुङ्गस्तनमण्डलीपरिचलन्माणिक्यहारच्छटा
    चञ्चच्छोणिमपुञ्जमध्यसरणिं मातः परिष्कुर्वती । या वैदग्ध्यमुपैति शङ्करजटाकान्तारवाटीपत त्स्वर्वापीपयसः
    स्मितद्युतिरसौ कामाक्षि ते मञ्जुला ॥ ॥ सन्नामैकजुषा जनेन सुलभं संसूचयन्ती शनै रुत्तुङ्गस्य चिरादनुग्रहतरोरुत्पत्स्यमानं
    फलम् । प्राथम्येन विकस्वरा कुसुमवत्प्रागल्भ्यमभ्येयुषी कामाक्षि स्मितचातुरी तव मम क्षेमङ्करी कल्पताम्
    ॥ ॥ धानुष्काग्रसरस्य लोलकुटिलभ्रूलेखया बिभ्रतो लीलालोकशिलीमुखं नववयस्साम्राज्यलक्ष्मीपुषः । जेतुं
    मन्मथमर्दिनं जननि ते कामाक्षि हासः स्वयं वल्गुर्विभ्रमभूभृतो वितनुते सेनापतिप्रक्रियाम् ॥ ॥ यन्नाकम्पत
    कालकूटकबलीकारे चुचुम्बे न यद् ग्लान्या चक्षुषि रूषितानलशिखे रुद्रस्य तत्तादृशम् । चेतो यत्प्रसभं स्मरज्वरशिखिज्वालेन
    लेलिह्यते तत्कामाक्षि तव स्मितांशुकलिकाहेलाभवं प्राभवम् ॥ ॥ सम्भिन्नेव सुपर्वलोकतटिनी वीचीचयैर्यामुनैः
    सम्मिश्रेव शशाङ्कदीप्तिलहरी नीलैर्महानीरदैः । कामाक्षि स्फुरिता तव स्मितरुचिः कालाञ्जनस्पर्धिना कालिम्ना
    कचरोचिषां व्यतिकरे काञ्चिद्दशामश्नुते ॥ ॥ जानीमो जगदीश्वरप्रणयिनि त्वन्मन्दहासप्रभां श्रीकामाक्षि
    सरोजिनीमभिनवामेषा यतः सर्वदा । आस्येन्दोरवलोकेन पशुपतेरभ्येति सम्फुल्लतां तन्द्रालुस्तदभाव एव तनुते
    तद्वैपरीत्यक्रमम् ॥ ॥ यान्ती लोहितिमानमभ्रतटिनी धातुच्छटाकर्दमैः भान्ती बालगभस्तिमालिकिरणैर्मेघावली
    शारदी । बिम्बोष्ठद्युतिपुञ्जचुम्बनकलाशोणायमानेन ते कामाक्षि स्मितरोचिषा समदशामारोढुमाकाङ्क्षते ॥ ॥
    श्रीकामाक्षि मुखेन्दुभूषणमिदं मन्दस्मितं तावकं नेत्रानन्दकरं तथा हिमकरो गच्छेद्यथा तिग्मताम् । शीतं
    देवि तथा यथा हिमजलं सन्तापमुद्रास्पदं श्वेतं किञ्च तथा यथा मलिनतां धत्ते च मुक्तामणिः ॥ ॥ त्वन्मन्दस्मितमञ्जरीं
    प्रसृमरां कामाक्षि चन्द्रातपं सन्तः सन्ततमामनन्त्यमलता तल्लक्षणं लक्ष्यते । अस्माकं न धुनोति तापकमधिकं
    धूनोति नाभ्यन्तरं ध्वान्तं तत्खलु दुःखिनो वयमिदं केनोति नो विद्महे ॥ ॥ नम्रस्य प्रणयप्ररूढकलहच्छेदाय
    पादाब्जयोः मन्दं चन्द्रकिशोरशेखरमणेः कामाक्षि रागेण ते । बन्धूकप्रसवश्रियं जितवतो बंहीयसीं तादृशीं
    बिम्बोष्ठस्य रुचिं निरस्य हसितज्योत्स्ना वयस्यायते ॥ ॥ मुक्तानां परिमोचनं विदधतस्तत्प्रीतिनिष्पादिनी
    भूयो दूरत एव धूतमरुतस्तत्पालनं तन्वती । उद्भूतस्य जलान्तरादविरतं तद्दूरतां जग्मुषी कामाक्षि स्मितमञ्जरी
    तव कथं कम्बोस्तुलामश्नुते ॥ ॥ श्रीकामाक्षि तव स्मितद्युतिझरीवैदग्ध्यलीलायितं पश्यन्तोऽपि निरन्तरं
    सुविमलम्मन्या जगन्मण्डले । लोकं हासयितुं किमर्थमनिशं प्राकाश्यमातन्वते मन्दाक्षं विरहय्य मङ्गलतरं
    मन्दारचन्द्रादयः ॥ ॥ क्षीराब्धेरपि शैलराजतनये त्वन्मन्दहासस्य च श्रीकामाक्षि वलक्षिमोदयनिधेः किञ्चिद्भिदां
    ब्रूमहे । एकस्मै पुरुषाय देवि स ददौ लक्ष्मीं कदाचित्पुरा सर्वेभ्योऽपि ददात्यसौ तु सततं लक्ष्मीं च
    वागीश्वरीम् ॥ ॥ श्रीकाञ्चीपुररत्नदीपकलिके तान्येव मेनात्मजे चाकोराणि कुलानि देवि सुतरां धन्यानि मन्यामहे
    । कम्पातीरकुटुम्बचङ्क्रमकलाचुञ्चूनि चञ्चूपुटैः नित्यं यानि तव स्मितेन्दुमहसामास्वादमातन्वते ॥ ॥ शैत्यप्रक्रममाश्रितोऽपि
    नमतां जाड्यप्रथां धूनयन् नैर्मल्यं परमं गतोऽपि गिरिशं रागाकुलं चारयन् । लीलालापपुरस्सरोऽपि सततं वाचंयमान्प्रीणयन्
    कामाक्षि स्मितरोचिषां तव समुल्लासः कथं वर्ण्यते ॥ ॥ श्रोणीचञ्चलमेखलामुखरितं लीलागतं मन्थरं भ्रूवल्लीचलनं
    कटाक्षवलनं मन्दाक्षवीक्षाचणम् । यद्वैदग्ध्यमुखेन मन्मथरिपुं सम्मोहयन्त्यञ्जसा श्रीकामाक्षि तव स्मिताय
    सततं तस्मै नम्सकुर्महे ॥ ॥ श्रीकामाक्षि मनोज्ञमन्दहसितज्योतिष्प्ररोहे तव स्फीतश्वेतिमसार्वभौमसरणिप्रागल्भ्यमभ्येयुषि
    । चन्द्रोऽयं युवराजतां कलयते चेटीधुरं चन्द्रिका शुद्धा सा च सुधाझरी सहचरीसाधर्म्यमालम्बते ॥ ॥ ज्योत्स्ना
    किं तनुते फलं तनुमतामौष्ण्यप्रशान्तिं विना त्वन्मन्दस्मितरोचिषा तनुमतां कामाक्षि रोचिष्णुना । सन्तापो
    विनिवार्यते नववयःप्राचुर्यमङ्कूर्यते सौन्दर्यं परिपूर्यते जगति सा कीर्तिश्च सञ्चार्यते ॥ ॥ वैमल्यं
    कुमुदश्रियां हिमरुचः कान्त्यैव सन्धुक्ष्यते ज्योत्स्नारोचिरपि प्रदोषसमयं प्राप्यैव सम्पद्यते । स्वच्छत्वं
    नवमौक्तिकस्य परमं संस्कारतो दृश्यते कामाक्ष्याः स्मितदीधितेर्विशदिमा नैसर्गिको भासते ॥ ॥ प्राकाश्यं
    परमेश्वरप्रणयिनि त्वन्मन्दहासश्रियः श्रीकामाक्षि मम क्षिणोतु ममतावैचक्षणीमक्षयाम् । यद्भीत्येव निलीयते
    हिमकरो मेघोदरे शुक्तिका गर्भे मौक्तिकमण्डली च सरसीमध्ये मृणाली च सा ॥ ॥ हेरम्बे च गुहे हर्षभरितं वात्सल्यमङ्कूरयत्
    मारद्रोहिणि पूरुषे सहभुवं प्रेमाङ्कुरं व्यञ्जयत् । आनम्रेषु जनेषु पूर्णकरुणावैदग्ध्यमुत्तालयत् कामाक्षि
    स्मितमञ्जसा तव कथङ्कारं मया कथ्यते ॥ ॥ सङ्क्रुद्धद्विजराजकोऽप्यविरतं कुर्वन्द्विजैः सङ्गमं वाणीपद्धतिदूरगोऽपि
    सततं तत्साहचर्यं वहन् । अश्रान्तं पशुदुर्लभोऽपि कलयन्पत्यौ पशूनां रतिं श्रीकामाक्षि तव स्मितामृतरसस्यन्दो
    मयि स्पन्दताम् ॥ ॥ श्रीकामाक्षि महेश्वरे निरुपमप्रेमाङ्कुरप्रक्रममं नित्यं यः प्रकटीकरोति सहजामुन्निद्रयन्माधुरीम्
    । तत्तादृक्तव मन्दहासमहिमा मातः कथं मानितां तन्मूर्ध्ना सुरनिम्नगां च कलिकामिन्दोश्च तां निन्दति ॥
    ॥ ये माधुर्यविहारमण्टपभुवो ये शैत्यमुद्राकरा ये वैशद्यदशाविशेषसुभगास्ते मन्दहासाङ्कुराः । कामाक्ष्याः
    सहजं गुणत्रयमिदं पर्यायतः कुर्वतां वाणीगुम्फनडम्बरे च हृदये कीर्तिप्ररोहे च मे ॥ ॥ कामाक्ष्या मृदुलस्मितांशुनिकरा
    दक्षान्तके वीक्षणे मन्दाक्षग्रहिला हिमद्युतिमयूखाक्षेपदीक्षाङ्कुराः । दाक्ष्यं पक्ष्मलयन्तु माक्षिकगुडद्राक्षाभवं
    वाक्षु मे सूक्ष्मं मोक्षपथं निरीक्षितुमपि प्रक्षालयेयुर्मनः ॥ ॥ जात्या शीतशीतलानि मधुराण्येतानि पूतानि
    ते गाङ्गानीव पयांसि देवि पटलान्यल्पस्मितज्योतिषाम् । एनःपङ्कपरम्परामलिनितामेकाम्रनाथप्रिये प्रज्ञानात्सुतरां
    मदीयधिषणां प्रक्षालयन्तु क्षणात् ॥ ॥ अश्रान्तं परतन्त्रितः पशुपतिस्त्वन्मन्दहासाङ्कुरैः श्रीकामाक्षि
    तदीयवर्णसमतासङ्गेन शङ्कामहे । इन्दुं नाकधुनीं च शेखरयते मालां च धत्ते नवैः वैकुण्ठैरवकुण्ठनं च कुरुते
    धूलीचयैर्भास्मनैः ॥ ॥ श्रीकाञ्चीपुरदेवते मृदुवचस्सौरभ्यमुद्रास्पदं प्रौढप्रेमलतानवीनकुसुमं मन्दस्मितं
    तावकम् । मन्दं कन्दलति प्रियस्य वदनालोके समाभाषणे श्लक्ष्णे कुङ्मलति प्ररूढपुलके चाश्लोषणे फुल्लति
    ॥ ॥ किं त्रैस्रोतसमम्बिके परिणतं स्रोतश्चतुर्थं नवं पीयूषस्य समस्ततापहरणं किंवा द्वितीयं वपुः । किंस्वित्त्वन्निकटं
    गतं मधुरिमाभ्यासाय गव्यं पयः श्रीकाञ्चीपुरनायकप्रियतमे मन्दस्मितं तावकम् ॥ ॥ भूषा वक्त्रसरोरुहस्य
    सहजा वाचां सखी शाश्वती नीवी विभ्रमसन्ततेः पशुपतेः सौधी दृशां पारणा । जीवातुर्मदनश्रियः शशिरुचेरुच्चाटनी
    देवता श्रीकामाक्षि गिरामभूमिमयते हासप्रभामञ्जरी ॥ ॥ सूतिः श्वेतिमकन्दलस्य वसतिः शृङ्गारसारश्रियः पूर्तिः
    सूक्तिझरीरसस्य लहरी कारुण्यपाथोनिधेः । वाटी काचन कौसुमी मधुरिमस्वाराज्यलक्ष्म्यास्तव श्रीकामाक्षि
    ममास्तु मङ्गलकरी हासप्रभाचातुरी ॥ ॥ जन्तूनां जनिदुःखमृत्युलहरीसन्तापनं कृन्ततः प्रौढानुग्रहपूर्णशीतलरुचो
    नित्योदयं बिभ्रतः । श्रीकामाक्षि विसृत्वरा इव करा हासाङ्कुरास्ते हठा दालोकेन निहन्युरन्धतमसस्तोमस्य
    मे सन्ततिम् ॥ ॥ उत्तुङ्गस्तनमण्डलस्य विलसल्लावण्यलीलानटी रङ्गस्य स्फुटमूर्ध्वसीमनि मुहुः प्राकाश्यमभ्येयुषी
    । श्रीकामाक्षि तव स्मितद्युतिततिर्बिम्बोष्ठकान्त्यङ्कुरैः चित्रां विद्रुममुद्रितां वितनुते मौक्तीं
    वितानश्रियम् ॥ ॥ स्वाभाव्यात्तव वक्त्रमेव ललितं सन्तोषसम्पादनं शम्भोः किं पुनरञ्चितस्मितरुचः पाण्डित्यपात्रीकृतम्
    । अम्भोजं स्वत एव सर्वजगतां चक्षुःप्रियम्भावुकं कामाक्षि स्फुरिते शरद्विकसिते कीदृग्विधं भ्राजते ॥
    ॥ पुम्भिर्निर्मलमानसौर्विदधते मैत्रीं दृढं निर्मलां लब्ध्वा कर्मलयं च निर्मलतरां कीर्तिं लभन्तेतराम्
    । सूक्तिं पक्ष्मलयन्ति निर्मलतमां यत्तावकाः सेवकाः तत्कामाक्षि तव स्मितस्य कलया नैर्मल्यसीमानिधेः
    ॥ ॥ आकर्षन्नयनानि नाकिसदसां शैत्येन संस्तम्भय न्निन्दुं किञ्च विमोहयन्पशुपतिं विश्वार्तिमुच्चाटयन्
    । हिंसत्संसृतिडम्बरं तव शिवे हासाह्वयो मान्त्रिकः श्रीकामाक्षि मदीयमानसतमोविद्वेषणे चेष्टताम् ॥ ॥
    क्षेपीयः क्षपयन्तु कल्मषभयान्यस्माकमल्पस्मित ज्योतिर्मण्डलचङ्क्रमास्तव शिवे कामाक्षि रोचिष्णवः । पीडाकर्मठकर्मघर्मसमयव्यापारतापानल
    श्रीपाता नवहर्षवर्षणसुधास्रोतस्विनीशीकराः ॥ ॥ श्रीकामाक्षि तव स्मितैन्दवमहःपूरे परिम्फूर्जति प्रौढां
    वारिधिचातुरीं कलयते भक्तात्मनां प्रातिभम् । दौर्गत्यप्रसरास्तमःपटलिकासाधर्म्यमाबिभ्रते सर्वं कैरवसाहचर्यपदवीरीतिं
    विधत्ते परम् ॥ ॥ मन्दारादिषु मन्मथारिमहिषि प्राकाश्यरीतिं निजां कादाचित्कतया विशङ्क्य बहुशो वैशद्यमुद्रागुणः
    । सातत्येन तव स्मिते वितनुते स्वैरासनावासनाम् ॥ ॥ इन्धाने भववीतिहोत्रनिवहे कर्मौघचण्डानिल प्रौढिम्ना
    बहुलीकृते निपतितं सन्तापचिन्ताकुलम् । मातर्मां परिषिञ्च किञ्चिदमलैः पीयूषवर्षैरिव श्रीकामाक्षि तव
    स्मितद्युतिकणैः शैशिर्यलीलाकरैः ॥ ॥ भाषाया रसनाग्रखेलनजुषः शृङ्गारमुद्रासखी लीलाजातरतेः सुखेन नियमस्नानाय
    मेनात्मजे । श्रीकामाक्षि सुधामयीव शिशिरा स्रोतस्विनी तावकी गाढानन्दतरङ्गिता विजयते हासप्रभाचातुरी
    ॥ ॥ सन्तापं विरलीकरोतु सकलं कामाक्षि मच्चेतना मज्जन्ती मधुरस्मितामरधुनीकल्लोलजालेषु ते । नैरन्तर्यमुपेत्य
    मन्मथमरुल्लोलेषु येषु स्फुटं प्रेमेन्दुः प्रतिबिम्बितो वितनुते कौतूहलं धूर्जटेः ॥ ॥ चेतःक्षीरपयोधिमन्थरचलद्रागाख्यमन्थाचल
    क्षोभव्यापृतिसम्भवां जननि ते मन्दस्मितश्रीसुधाम् । स्वादंस्वादमुदीतकौतुकरसा नेत्रत्रयी शाङ्करी श्रीकामाक्षि
    निरन्तरं परिणमत्यानन्दवीचीमयी ॥ ॥ आलोके तव पञ्चसायकरिपोरुद्दामकौतूहल प्रेङ्खन्मारुतघट्टनप्रचलितादानन्ददुग्धाम्बुधेः
    । काचिद्वीचिरुदञ्चति प्रतिनवा संवित्प्ररोहात्मिका तां कामाक्षि कवीश्वराः स्मितमिति व्याकुर्वते सर्वदा
    ॥ ॥ सूक्तिः शीलयते किमद्रितनये मन्दस्मितात्ते मुहुः माधुर्यागमसम्प्रदायमथवा सूक्तेर्नु मन्दस्मितम्
    । इत्थं कामपि गाहते मम मनः सन्देहमार्गभ्रमिं श्रीकामाक्षि न पारमार्थ्यसरणिस्फूर्तौ निधत्ते पदम् ॥
    ॥ क्रीडालोलकृपासरोरुहमुखीसौधाङ्गणेभ्यः कवि श्रेणीवाक्परिपाटिकामृतझरीसूतीगृहेभ्यः शिवे । निर्वाणाङ्कुरसार्वभौमपदवीसिंहासनेभ्यस्तव
    श्रीकामाक्षि मनोज्ञमन्दहसितज्योतिष्कणेभ्यो नमः ॥ ॥ आर्यामेव विभावयन्मनसि यः पादारविन्दं पुरः पश्यन्नारभते
    स्तुतिं स नियतं लब्ध्वा कटाक्षच्छविम् । कामाक्ष्या मृदुलस्मितांशुलहरीज्योत्स्नावयस्यान्विताम् आरोहत्यपवर्गसौधवलभीमानन्दवीचीमयीम्
    ॥ ॥ ॥ इति मन्दस्मितशतकं सम्पूर्णम् ॥ ॥ इति श्री मूकपञ्चशती सम्पूर्णा ॥ ॥औं तत् सत् ॥
