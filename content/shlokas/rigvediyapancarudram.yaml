id: rigvediyapancarudram
category: veda
name:
  english: rigvediyapancarudram
  devanagari: ऋग्वेदीयपन्चरुद्रम्
content:
  english: rasenabhishincati || om shambha̭ve̱ nama̭h | nama̭ste astu bhagavanvishveshva̱raya̭ mahade̱vaya̭
    tryamba̱kaya̭ tripuranta̱kaya̭ trikagnika̱laya̭ kalagniru̱draya̭ nilaka̱nthaya̭ mrityunja̱yaya̭ sarveshva̱raya̭
    sadashi̱vaya̭ shrimanmahade̱vaya̱ nama̭h || om yadaksharapadabhrashtam matrahinam ca yadbhavet | tatsarvam
    kshamyatam deva prasida parameshvara || om shanti̱h shanti̱h shanti̭h || anena shri rudrabhishekakarmana
    shri bhavanishankara maharudrah priyatam na mama | iti shririgvediya pancarudram samapta | || om shri
    samba sadashivarpanamastu || shririgvediya pancarudram || om shri ganeshaya namah || ganapati stutih
    nihsvarah harih om gananam tva ganapatim havamahe kavim kavinamupamashravastamam | jyeshtharajam brahmanam
    brahmanaspata a nah sha
  devanagari: रसेनाभिषिञ्चति ॥ ॐ शम्भ॑वे॒ नमः॑ । नम॑स्ते अस्तु भगवन्विश्वेश्व॒राय॑ महादे॒वाय॑ त्र्यम्ब॒काय॑
    त्रिपुरान्त॒काय॑ त्रिकाग्निका॒लाय॑ कालाग्निरु॒द्राय॑ नीलक॒ण्ठाय॑ मृत्युञ्ज॒याय॑ सर्वेश्व॒राय॑ सदाशि॒वाय॑
    श्रीमन्महादे॒वाय॒ नमः॑ ॥ ॐ यदक्षरपदभ्रष्टं मात्राहीनं च यद्भवेत् । तत्सर्वं क्षम्यतां देव प्रसीद परमेश्वर
    ॥ ॐ शान्तिः॒ शान्तिः॒ शान्तिः॑ ॥ अनेन श्री रुद्राभिषेककर्मणा श्री भवानीशङ्कर महारुद्राः प्रीयतां न
    मम । इति श्रीऋग्वेदीय पञ्चरुद्रं समाप्ता । ॥ ॐ श्री साम्ब सदाशिवार्पणमस्तु ॥ श्रीऋग्वेदीय पञ्चरुद्रम्
    ॥ ॐ श्री गणेशाय नमः ॥ गणपति स्तुतिः निःस्वरः हरिः ॐ गणानां त्वा गणपतिं हवामहे कविं कवीनामुपमश्रवस्तमम्
    । ज्येष्ठराजं ब्रह्मणां ब्रह्मणस्पत आ नः श
