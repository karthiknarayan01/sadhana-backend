id: krishnastotramahadevabvp
category: stotram
name:
  english: krishnastotramahadevaBVP
  devanagari: क्रिश्नस्तोत्रमहादेवBVP
content:
  english: param brahma param dhama param jyotih sanatanam | nirliptam paramatmanam namamyakhilakaranam
    || 1|| sthulatsthulatamam devam sukshmatsukshmatamam param | sarvadrishyamadrishyam ca svecchacaram
    namamyaham || 2|| sakaram ca nirakaram sagunam nirgunam prabhum | sarvadharam ca sarvam ca sveccharupam
    namamyaham || 3|| ativa kamaniyam ca rupam nirupamam vibhum | karalarupamatyantam bibhratam pranamamyaham
    || 4|| karmanah karmarupam tam sakshinam sarvakarmanah | phalam ca phaladataram sarvarupam namamyaham
    || 5|| srashta pata ca samharta kalaya murtibhedatah | nanamurtih kalamshena yah pumamstam namamyaham
    || 6|| svayam prakritirupashca mayaya ca svayam puman | tayoh param svayam shashvattannamami paratparam
    || 7|| stripunnapumsakam rupam yo bibharti svamayaya | svayam maya svayam mayi yo devastam namamyaham
    || 8|| tarakam sarvaduhkhanam sarvakaranakaranam | dharakam sarvavishvanam sarvabijam namamyaham ||
    9|| tejasvinam raviryo hi sarvajatishu vadavah | nakshatranam ca yashcandrastam namami jagatprabhum
    || 10|| rudranam vaishnavanam ca jnaninam yo hi shankarah | naganam yo hi sheshashca tam namami jagatpatim
    || 11|| prajapatinam yo brahma siddhanam kapilah svayam | sanatkumaro munishu tam namami jagadgurum
    || 12|| devanam yo hi vishnushca devinam prakritih svayam | svayambhuvo manunam yo manaveshu vaishnavah
    | narinam shatarupa ca bahurupam namamyaham || 13|| ritunam yo vasantashca masanam margashirshakah
    | ekadashi tithinam ca namamyakhilarupinam || 14|| sagarah saritam yashca parvatanam himalayah | vasundhara
    sahishnunam tam sarvam pranamamyaham || 15|| patranam tulasipatram darurupeshu candanam | vrikshanam
    kalpavriksho yastam namami jagatpatim || 16|| pushpanam parijatashca sasyanam dhanyameva ca | amritam
    bhakshyavastunam nanarupam namamyaham || 17|| airavato gajendranam vainateyashca pakshinam | kamadhenushca
    dhenunam sarvarupam namamyaham || 18|| taijasanam suvarnam ca dhanyanam yava eva ca | yah kesari pashunam
    ca vararupam namamyaham || 19|| yakshanam ca kubero yo grahanam ca brihaspatih | dikpalanam mahendrashca
    tam namami param varam || 20|| vedasanghashca shastranam panditanam sarasvati | aksharanamakaro yastam
    pradhanam namamyaham || 21|| mantranam vishnumantrashca tirthanam jahnavi svayam | indriyanam mano
    yo hi sarvashreshtham namamyaham || 22|| sudarshanam ca shastranam vyadhinam vaishnavo jvarah | tejasam
    brahmatejashca varenyam tam namamyaham || 23|| balam yo vai balavatam mano vai shighragaminam | kalah
    kalayatam yo hi tam namami vilakshanam || 24|| jnanadata gurunam ca matrirupashca bandhushu | mitreshu
    janmadata yastam saram pranamamyaham || 25|| shilpinam vishvakarma yah kamadevashca rupinam | pativrata
    ca patninam namasyam tam namamyaham || 26|| priyeshu putrarupo yo nriparupo nareshu ca | shalagramashca
    yantranam tam vishishtam namamyaham || 27|| dharmah kalyanabijanam vedanam samavedakah | dharmanam
    satyarupo yo vishishtam tam namamyaham || 28|| jale shaityasvarupo yo gandharupashca bhumishu | shabdarupashca
    gagane tam pranamyam namamyaham || 29|| kratunam rajasuyo yo gayatri chandasam ca yah | gandharvanam
    citrarathastam garishtham namamyaham || 30|| kshirasvarupo gavyanam pavitranam ca pavakah | punyadanam
    ca yah stotram tam namami shubhapradam || 31|| trinanam kusharupo yo vyadhirupashca vairinam | gunanam
    shantarupo yashcitrarupam namamyaham || 32|| tejorupo jnanarupah sarvarupashca yo mahan | sarvanirvacaniyam
    ca tam namami svayam vibhum || 33|| sarvadhareshu yo vayuryatha''tma nityarupinam | akasho vyapakanam
    yo vyapakam tam namamyaham || 34|| vedanivarcaniyam yanna stotum panditah kshamah | yadanirvacaniyam
    ca ko va tatstotumishvarah || 35|| veda na shakta yam stotum jadibhuta sarasvati | tam ca vanmanasaparam
    ko vidvanstotumishvarah || 36|| shuddhatejassvarupam ca bhakta'nugrahavigraham | ativa kamaniyam ca
    shyamarupam namamyaham || 37|| dvibhujam muralivaktram kishoram sasmitam muda | shashvadgopanganabhishca
    vikshyamanam namamyaham || 38|| radhaya dattatambulam bhuktavantam manoharam | ratnasimhasanastham
    ca tamisham pranamamyaham || 39|| ratnabhushanabhushadhyam sevitam shvetacamaraih | parshadapravarairgopakumaraistam
    namamyaham || 40|| vrindavanantare ramye rasollasasamutsukam | rasamandalamadhyastham namami rasikeshvaram
    || 41|| shatasha
  devanagari: परं ब्रह्म परं धाम परं ज्योतिः सनातनम् । निर्लिप्तं परमात्मानं नमाम्यखिलकारणम् ॥ १॥ स्थूलात्स्थूलतमं
    देवं सूक्ष्मात्सूक्ष्मतमं परम् । सर्वदृश्यमदृश्यं च स्वेच्छाचारं नमाम्यहम् ॥ २॥ साकारं च निराकारं
    सगुणं निर्गुणं प्रभुम् । सर्वाधारं च सर्वं च स्वेच्छारूपं नमाम्यहम् ॥ ३॥ अतीव कमनीयं च रूपं निरुपमं
    विभुम् । करालरूपमत्यन्तं बिभ्रतं प्रणमाम्यहम् ॥ ४॥ कर्मणः कर्मरूपं तं साक्षिणं सर्वकर्मणः । फलं च
    फलदातारं सर्वरूपं नमाम्यहम् ॥ ५॥ स्रष्टा पाता च संहर्ता कलया मूर्तिभेदतः । नानामूर्तिः कलांशेन यः
    पुमांस्तं नमाम्यहम् ॥ ६॥ स्वयं प्रकृतिरूपश्च मायया च स्वयं पुमान् । तयोः परं स्वयं शश्वत्तन्नमामि
    परात्परम् ॥ ७॥ स्त्रीपुन्नपुंसकं रूपं यो बिभर्ति स्वमायया । स्वयं माया स्वयं मायी यो देवस्तं नमाम्यहम्
    ॥ ८॥ तारकं सर्वदुःखानां सर्वकारणकारणम् । धारकं सर्वविश्वानां सर्वबीजं नमाम्यहम् ॥ ९॥ तेजस्विनां रविर्यो
    हि सर्वजातिषु वाडवः । नक्षत्राणां च यश्चन्द्रस्तं नमामि जगत्प्रभुम् ॥ १०॥ रुद्राणां वैष्णवानां च ज्ञानिनां
    यो हि शङ्करः । नागानां यो हि शेषश्च तं नमामि जगत्पतिम् ॥ ११॥ प्रजापतीनां यो ब्रह्मा सिद्धानां कपिलः
    स्वयम् । सनत्कुमारो मुनिषु तं नमामि जगद्गुरुम् ॥ १२॥ देवानां यो हि विष्णुश्च देवीनां प्रकृतिः स्वयम्
    । स्वायम्भुवो मनूनां यो मानवेषु वैष्णवः । नारीणां शतरूपा च बहुरूपं नमाम्यहम् ॥ १३॥ ऋतूनां यो वसन्तश्च
    मासानां मार्गशीर्षकः । एकादशी तिथीनां च नमाम्यखिलरूपिणम् ॥ १४॥ सागरः सरितां यश्च पर्वतानां हिमालयः
    । वसुन्धरा सहिष्णूनां तं सर्वं प्रणमाम्यहम् ॥ १५॥ पत्राणां तुलसीपत्रं दारुरूपेषु चन्दनम् । वृक्षाणां
    कल्पवृक्षो यस्तं नमामि जगत्पतिम् ॥ १६॥ पुष्पाणां पारिजातश्च सस्यानां धान्यमेव च । अमृतं भक्ष्यवस्तुनां
    नानारूपं नमाम्यहम् ॥ १७॥ ऐरावतो गजेन्द्राणां वैनतेयश्च पक्षिणाम् । कामधेनुश्च धेनूनां सर्वरूपं नमाम्यहम्
    ॥ १८॥ तैजसानां सुवर्णं च धान्यानां यव एव च । यः केसरी पशूनां च वररूपं नमाम्यहम् ॥ १९॥ यक्षाणां च कुबेरो
    यो ग्रहाणां च बृहस्पतिः । दिक्पालानां महेन्द्रश्च तं नमामि परं वरम् ॥ २०॥ वेदसङ्घश्च शास्त्राणां पण्डितानां
    सरस्वती । अक्षराणामकारो यस्तं प्रधानं नमाम्यहम् ॥ २१॥ मन्त्राणां विष्णुमन्त्रश्च तीर्थानां जाह्नवी
    स्वयम् । इन्द्रियाणां मनो यो हि सर्वश्रेष्ठं नमाम्यहम् ॥ २२॥ सुदर्शनं च शस्त्राणां व्याधिनां वैष्णवो
    ज्वरः । तेजसां ब्रह्मतेजश्च वरेण्यं तं नमाम्यहम् ॥ २३॥ बलं यो वै बलवतां मनो वै शीघ्रगामिनाम् । कालः
    कलयतां यो हि तं नमामि विलक्षणम् ॥ २४॥ ज्ञानदाता गुरूणां च मातृरूपश्च बन्धुषु । मित्रेषु जन्मदाता यस्तं
    सारं प्रणमाम्यहम् ॥ २५॥ शिल्पिनां विश्वकर्मा यः कामदेवश्च रूपिणाम् । पतिव्रता च पत्नीनां नमस्यं तं
    नमाम्यहम् ॥ २६॥ प्रियेषु पुत्ररूपो यो नृपरूपो नरेषु च । शालग्रामश्च यन्त्राणां तं विशिष्टं नमाम्यहम्
    ॥ २७॥ धर्मः कल्याणबीजानां वेदानां सामवेदकः । धर्माणां सत्यरूपो यो विशिष्टं तं नमाम्यहम् ॥ २८॥ जले
    शैत्यस्वरूपो यो गन्धरूपश्च भूमिषु । शब्दरूपश्च गगने तं प्रणम्यं नमाम्यहम् ॥ २९॥ क्रतूनां राजसूयो यो
    गायत्री छन्दसां च यः । गन्धर्वाणां चित्ररथस्तं गरिष्ठं नमाम्यहम् ॥ ३०॥ क्षीरस्वरूपो गव्यानां पवित्राणां
    च पावकः । पुण्यदानां च यः स्तोत्रं तं नमामि शुभप्रदम् ॥ ३१॥ तृणानां कुशरूपो यो व्याधिरूपश्च वैरिणाम्
    । गुणानां शान्तरूपो यश्चित्ररूपं नमाम्यहम् ॥ ३२॥ तेजोरूपो ज्ञानरूपः सर्वरूपश्च यो महान् । सर्वानिर्वचनीयं
    च तं नमामि स्वयं विभुम् ॥ ३३॥ सर्वाधारेषु यो वायुर्यथाऽऽत्मा नित्यरूपिणाम् । आकाशो व्यापकानां यो व्यापकं
    तं नमाम्यहम् ॥ ३४॥ वेदानिवर्चनीयं यन्न स्तोतुं पण्डितः क्षमः । यदनिर्वचनीयं च को वा तत्स्तोतुमीश्वरः
    ॥ ३५॥ वेदा न शक्ता यं स्तोतुं जडीभूता सरस्वती । तं च वाङ्मनसापारं को विद्वान्स्तोतुमीश्वरः ॥ ३६॥ शुद्धतेजस्स्वरूपं
    च भक्ताऽनुग्रहविग्रहम् । अतीव कमनीयं च श्यामरूपं नमाम्यहम् ॥ ३७॥ द्विभुजं मुरलीवक्त्रं किशोरं सस्मितं
    मुदा । शश्वद्गोपाङ्गनाभिश्च वीक्ष्यमाणं नमाम्यहम् ॥ ३८॥ राधया दत्तताम्बूलं भुक्तवन्तं मनोहरम् । रत्नसिंहासनस्थं
    च तमीशं प्रणमाम्यहम् ॥ ३९॥ रत्नभूषणभूषाढ्यं सेवितं श्वेतचामरैः । पार्षदप्रवरैर्गोपकुमारैस्तं नमाम्यहम्
    ॥ ४०॥ वृन्दावनान्तरे रम्ये रासोल्लाससमुत्सुकम् । रासमण्डलमध्यस्थं नमामि रसिकेश्वरम् ॥ ४१॥ शतश
