id: manasadevivashikaranastotram
category: stotram
name:
  english: manasadevivashikaranastotram
  devanagari: मनसादेवीवशीकरणस्तोत्रम्
content:
  english: shrimanasadevivashikaranastotram asya shrimanasavashikaranastotrasya kashyapa rishih | anushtupchandah
    | shrimanasadevi devata | sarvajanahridayaprasadanasiddhyarthe jape viniyogah || dhyanam | raktavarnam
    caturbahum padmayugmavirajitam | abhayam nagahastam tam padmavatim bhajamyaham || 1|| kashyapatmajamambam
    tam dharmendragrihinim shivam | jagatkarupriyam devim siddhayoginimashraye || 2|| atha stotram | namo
    manase devi namah siddhipradayini | namo nageshvari shubhre namaste bhaktavatsale || 3|| manoharini
    me devi manovrittiprakashini | manobhishtaprade matah prasanna bhava sarvada || 4|| hridayani prasadena
    saumyabhavena sundari | snehayuktani kuru me karunamritavarshini || 5|| dveshadaham vinirdahya maitribhavam
    prayaccha me | kalahakshayakartri tvam shantida sharanam mama || 6|| katuvakyam madhuram kuru krodham
    shamaya sundari | duritani vinirhritya sauhardam samprayaccha me || 7|| yatra me viphalam vakyam tatra
    siddhim prayaccha me | satyayuktam hitam vakyam janacitte niveshaya || 8|| mandahasamukhi devi mridudrishtivilocane
    | saumyabhavaprada bhutva mama karyam prasadhaya || 9|| nagamalavrite devi padmahaste dayanidhe |
    bhaktacitte vasa nityam mama cittam vishodhaya || 10|| abhimanam madam krodham matsaram ca vinashaya
    | dayam kshamam ca saushilyam hridaye me niveshaya || 11|| yatha padmam ravau nityam vikasam yati
    sundaram | tatha janamano devi saumyabhavena vikasaya || 12|| tvatprasadatsada matah sneho maitri
    ca vardhatam | hitam vacah priyam bhavam sarvesham hridi dipaya || 13|| manase manaseshani mangalacandike
    shive | prasida karunasindho namaste naganayike || 14|| phalashrutih | idam stotram pathennityam shraddhabhaktisamanvitah
    | sauhardam labhate nityam janamanyatameva ca || 15|| krodhadveshau kshayam yatah snehah sampravivardhate
    | manasadevyah prasadena mangalam jayate dhruvam || 16|| || iti shrimanasadevivashikaranastotram sampurnam
    ||
  devanagari: श्रीमनसादेवीवशीकरणस्तोत्रम् अस्य श्रीमानसावशीकरणस्तोत्रस्य कश्यप ऋषिः । अनुष्टुप्छन्दः ।
    श्रीमानसादेवी देवता । सर्वजनहृदयप्रसादनसिद्ध्यर्थे जपे विनियोगः ॥ ध्यानम् । रक्तवर्णां चतुर्बाहुं
    पद्मयुग्मविराजिताम् । अभयं नागहस्तां तां पद्मावतीं भजाम्यहम् ॥ १॥ काश्यपात्मजमम्बां तां धर्मेन्द्रगृहिणीं
    शिवाम् । जगत्कारुप्रियां देवीं सिद्धयोगिनिमाश्रये ॥ २॥ अथ स्तोत्रम् । नमो मानसे देवि नमः सिद्धिप्रदायिनि
    । नमो नागेश्वरि शुभ्रे नमस्ते भक्तवत्सले ॥ ३॥ मनोहारिणि मे देवि मनोवृत्तिप्रकाशिनि । मनोभीष्टप्रदे
    मातः प्रसन्ना भव सर्वदा ॥ ४॥ हृदयानि प्रसादेन सौम्यभावेन सुन्दरि । स्नेहयुक्तानि कुरु मे करुणामृतवर्षिणि
    ॥ ५॥ द्वेषदाहं विनिर्दह्य मैत्रीभावं प्रयच्छ मे । कलहक्षयकर्त्री त्वं शान्तिदा शरणं मम ॥ ६॥ कटुवाक्यं
    मधुरं कुरु क्रोधं शमय सुन्दरि । दुरितानि विनिर्हृत्य सौहार्दं सम्प्रयच्छ मे ॥ ७॥ यत्र मे विफलं वाक्यं
    तत्र सिद्धिं प्रयच्छ मे । सत्ययुक्तं हितं वाक्यं जनचित्ते निवेशय ॥ ८॥ मन्दहासमुखी देवि मृदुदृष्टिविलोचने
    । सौम्यभावप्रदा भूत्वा मम कार्यं प्रसाधय ॥ ९॥ नागमालावृते देवि पद्महस्ते दयानिधे । भक्तचित्ते वस नित्यं
    मम चित्तं विशोधय ॥ १०॥ अभिमानं मदं क्रोधं मत्सरं च विनाशय । दयां क्षमां च सौशील्यं हृदये मे निवेशय
    ॥ ११॥ यथा पद्मं रवौ नित्यं विकासं याति सुन्दरम् । तथा जनमनो देवि सौम्यभावेन विकासय ॥ १२॥ त्वत्प्रसादात्सदा
    मातः स्नेहो मैत्री च वर्धताम् । हितं वचः प्रियं भावं सर्वेषां हृदि दीपय ॥ १३॥ मानसे मानसेशानि मङ्गलचण्डिके
    शिवे । प्रसीद करुणासिन्धो नमस्ते नागनायिके ॥ १४॥ फलश्रुतिः । इदं स्तोत्रं पठेन्नित्यं श्रद्धाभक्तिसमन्वितः
    । सौहार्दं लभते नित्यं जनमान्यतमेव च ॥ १५॥ क्रोधद्वेषौ क्षयं यातः स्नेहः सम्प्रविवर्धते । मानसादेव्याः
    प्रसादेन मङ्गलं जायते ध्रुवम् ॥ १६॥ ॥ इति श्रीमनसादेवीवशीकरणस्तोत्रं सम्पूर्णम् ॥
