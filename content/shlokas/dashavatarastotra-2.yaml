id: dashavatarastotra-2
category: stotram
name:
  english: dashavatarastotra 2
  devanagari: दशावतारस्तोत्र २
content:
  english: dashavatarastotram 2 yasyaliyata shalkasimni jaladhih prishthe jaganmandalam damshtrayam dharani
    nakhe ditisutadhishah pade rodasi | krodhe kshatraganah sharedashamukhah panau pralambasuro dhyane
    vishvamasavadharmikakulam kasmaicidasmai namah || 1|| pathinah kamathah kitirnaraharih kharvakritirbhargavo
    ramah kamsanishudano dashabalah kalki ca narayanah | yushmakam sa vibhutaye'stu bhagavanseturbhavambhonidhau
    uttaraya yuge yuge yugapatistrailokyanatho harih || 2|| veda yena samuddhata vasumati prishthe dhritapyuddhrita
    daityesho nakharairhatah phanipaterlaukam valihprapitah | kshma'kshatra jagati dashasyarahita mata
    krita rohini himsa doshavati dharapyayavana payatsa narayanah || 2|| || iti dashavatarastotram ||
  devanagari: दशावतारस्तोत्रम् २ यस्यालीयत शल्कसीम्नि जलधिः पृष्ठे जगन्मण्डलं दंष्ट्रायां धरणी नखे दितिसुताधीशः
    पदे रोदसी । क्रोधे क्षत्रगणः शरेदशमुखः पाणौ प्रलम्बासुरो ध्याने विश्वमसावधार्मिककुलं कस्मैचिदस्मै
    नमः ॥ १॥ पाठीनः कमठः किटिर्नरहरिः खर्वाकृतिर्भार्गवो रामः कंसनिषूदनो दशबलः कल्की च नारायणः । युष्माकं
    स विभूतयेऽस्तु भगवान्सेतुर्भवाम्भोनिधौ उत्ताराय युगे युगे युगपतिस्त्रैलोक्यनाथो हरिः ॥ २॥ वेदा येन
    समुद्धता वसुमती पृष्ठे धृताप्युद्धृता दैत्येशो नखरैर्हतः फणिपतेर्लौकम् वलिःप्रापितः । क्ष्माऽक्षत्रा
    जगती दशास्यरहिता माता कृता रोहिणी हिंसा दोषवती धराप्ययवना पायात्स नारायणः ॥ २॥ ॥ इति दशावतारस्तोत्रम्
    ॥
