    dhari dharani| karahim bhalu kapi adbhuta karani || gahi pada darahim sagara mahim| makara uraga jhasha
    dhari dhari khahim || do kachu mare kachu ghayala kachu garha carhae parai| garjahim bhalu balimukha
    ripu dala bala bicalai || || nisa jani kapi cariu ani| ae jaha~ kosala dhani || rama kripa kari citava
    sabahi| bhe bigatashrama banara tabahi || uha~ dasanana saciva ha~kare| saba sana kahesi subhata je
    mare || adha kataku kapinha sanghara| kahahu begi ka karia bicara || malyavanta ati jaratha nisacara|
    ravana matu pita mantri bara || bola bacana niti ati pavana| sunahu tata kachu mora sikhavana || jaba
    te tumha sita hari ani| asaguna hohim na jahim bakhani || beda purana jasu jasu gayo| rama bimukha
    kahu~ na sukha payo || do hiranyaccha bhrata sahita madhu kaitabha balavana| jehi mare soi avatareu
    kripasindhu bhagavana || pacisava~ vishrama kalarupa khala bana dahana gunagara ghanabodha| siva biranci
    jehi sevahim tasom kavana birodha || || parihari bayaru dehu baidehi| bhajahu kripanidhi parama sanehi
    || take bacana bana sama lage| karia muha kari jahi abhage || burha bhesi na ta marateu~ tohi| aba
    jani nayana dekhavasi mohi || tehi apane mana asa anumana| badhyo cahata ehi kripanidhana || so uthi
    gayu kahata durbada| taba sakopa boleu ghananada || kautuka prata dekhiahu mora| karihu~ bahuta kahaum
    ka thora || suni suta bacana bharosa ava| priti sameta anka baithava || karata bicara bhayu bhinusara|
    lage kapi puni cahu~ duara || ko'pi kapinha durghata garhau ghera| nagara kolahalu bhayu ghanera ||
    bibidhayudha dhara nisicara dhae| garha te parbata sikhara dhahae || cham dhahe mahidhara sikhara
    kotinha bibidha bidhi gola cale| ghaharata jimi pabipata garjata janu pralaya ke badale || markata
    bikata bhata jutata katata na latata tana jarjara bhe| gahi saila tehi garha para calavahim jaha~
    so taha~ nisicara he || do meghanada suni shravana asa garhau puni chenka ai| utaryo bira durga tem
    sanmukha calyo bajai || || kaha~ kosaladhisa dvau bhrata| dhanvi sakala loka bikhyata || kaha~ nala
    nila dubida sugriva| angada hanumanta bala simva || kaha~ bibhishanu bhratadrohi| aju sabahi hathi
    maru~ ohi || asa kahi kathina bana sandhane| atisaya krodha shravana lagi tane || sara samuha so charaai
    laga| janu sapaccha dhavahim bahu naga || jaha~ taha~ parata dekhiahim banara| sanmukha hoi na sake
    tehi avasara || jaha~ taha~ bhagi cale kapi richa| bisari sabahi juddha kai icha || so kapi bhalu
    na rana maha~ dekha| kinhesi jehi na prana avasesha || do dasa dasa sara saba maresi pare bhumi kapi
    bira| simhanada kari garja meghanada bala dhira || || dekhi pavanasuta kataka bihala| krodhavanta
    janu dhayu kala || mahasaila eka turata upara| ati risa meghanada para dara || avata dekhi gayu nabha
    soi| ratha sarathi turaga saba khoi || bara bara pacara hanumana| nikata na ava maramu so jana ||
    raghupati nikata gayu ghananada| nana bha~ti karesi durbada || astra sastra ayudha saba dare| kautukahim
    prabhu kati nivare || dekhi pratapa murha khisiana| karai laga maya bidhi nana || jimi kau karai garura
    saim khela| darapavai gahi svalpa sapela || do jasu prabala maya bala siva biranci bara chota| tahi
    dikhavi nisicara nija maya mati khota || || nabha carhai barasha bipula angara| mahi te pragata hohim
    jaladhara || nana bha~ti pisaca pisaci| maru katu dhuni bolahim naci || bishta puya rudhira kaca haraa|
    barashi kabahu~ upala bahu charaa || barashi dhuri kinhesi a~dhiara| sujha na apana hatha pasara ||
    kapi akulane maya dekhem| saba kara marana bana ehi lekhem || kautuka dekhi rama musukane| bhe sabhita
    sakala kapi jane || eka bana kati saba maya| jimi dinakara hara timira nikaya || kripadrishti kapi
    bhalu biloke| bhe prabala rana rahahim na roke || do ayasu magi rama pahim angadadi kapi satha| lachimana
    cale kruddha hoi bana sarasana hatha || || chataja nayana ura bahu bisala| himagiri nibha tanu kachu
    eka lala || iha~ dasanana subhata pathae| nana astra sastra gahi dhae || bhudhara nakha bitapayudha
    dhari| dhae kapi jaya rama pukari || bhire sakala jorihi sana jori| ita uta jaya iccha nahim thori
    || muthikanha latanha datanha katahim| kapi jayasila mari puni datahim || maru maru dharu dharu dharu
    maru| sisa tori gahi bhuja uparu || asi rava puri rahi nava khanda| dhavahim jaha~ taha~ runda pracanda
    || dekhahim kautuka nabha sura brinda| kabahu~ka bisamaya kabahu~ ananda || do rudhira gara bhari
    bhari jamyo upara dhuri uraai| janu a~gara rasinha para mritaka dhuma rahyo chai || || ghayala bira
    birajahim kaise| kusumita kimsuka ke taru jaise || lachimana meghanada dvau jodha| bhirahim parasapara
    kari ati krodha || ekahi eka saki nahim jiti| nisicara chala bala kari aniti || krodhavanta taba bhayu
    ananta| bhanjeu ratha sarathi turanta || nana bidhi prahara kara sesha| racchasa bhayu prana avasesha
    || ravana suta nija mana anumana| sankatha bhayu harihi mama prana || biraghatini charaisi sa~gi|
    teja punja lachimana ura lagi || murucha bhi sakti ke lagem| taba cali gayu nikata bhaya tyagem ||
    do meghanada sama koti sata jodha rahe uthai| jagadadhara sesha kimi uthai cale khisiai || || sunu
    girija krodhanala jasu| jari bhuvana caridasa asu || saka sangrama jiti ko tahi| sevahim sura nara
    aga jaga jahi || yaha kautuhala jani soi| ja para kripa rama kai hoi || sandhya bhi phiri dvau bahani|
    lage sa~bharana nija nija ani || byapaka brahma ajita bhuvanesvara| lachimana kaha~ bujha karunakara
    || taba lagi lai ayu hanumana| anuja dekhi prabhu ati dukha mana || jamavanta kaha baida sushena|
    lanka~ rahi ko pathi lena || dhari laghu rupa gayu hanumanta| aneu bhavana sameta turanta || do rama
    padarabinda sira nayu ai sushena| kaha nama giri aushadhi jahu pavanasuta lena || || rama carana sarasija
    ura rakhi| cala prabhanjana suta bala bhashi || uha~ duta eka maramu janava| ravana kalanemi griha
    ava || dasamukha kaha maramu tehim suna| puni puni kalanemi siru dhuna || dekhata tumhahi nagaru jehim
    jara| tasu pantha ko rokana para || bhaji raghupati karu hita apana| cha~rahu natha mrisha jalpana
    || nila kanja tanu sundara syama| hridaya~ rakhu locanabhirama || maim taim mora murhata tyagu| maha
    moha nisi sutata jagu || kala byala kara bhacchaka joi| sapanehu~ samara ki jitia soi || do suni dasakantha
    risana ati tehim mana kinha bicara| rama duta kara maraum baru yaha khala rata mala bhara || || asa
    kahi cala racisi maga maya| sara mandira bara baga banaya || marutasuta dekha subha ashrama| munihi
    bujhi jala piyaum jai shrama || racchasa kapata besha taha~ soha| mayapati dutahi caha moha || jai
    pavanasuta nayu matha| laga so kahai rama guna gatha || hota maha rana ravana ramahim| jitahahim rama
    na samsaya ya mahim || iha~ bhe~ maim dekheu~ bhai| gyana drishti bala mohi adhikai || maga jala tehim
    dinha kamandala| kaha kapi nahim aghau~ thorem jala || sara majjana kari atura avahu| diccha deu~
    gyana jehim pavahu || do sara paithata kapi pada gaha makarim taba akulana| mari so dhari divya tanu
    cali gagana carhai jana || || kapi tava darasa bhiu~ nishpapa| mita tata munibara kara sapa || muni
    na hoi yaha nisicara ghora| manahu satya bacana kapi mora || asa kahi gi apachara jabahim| nisicara
    nikata gayu kapi tabahim || kaha kapi muni guradachina lehu| pachem hamahi mantra tumha dehu || sira
    langura lapeti pachara| nija tanu pragatesi marati bara || rama rama kahi charaesi prana| suni mana
    harashi caleu hanumana || dekha saila na aushadha cinha| sahasa kapi upari giri linha || gahi giri
    nisi nabha dhavata bhayu| avadhapuri upara kapi gayu || do dekha bharata bisala ati nisicara mana
    anumani| binu phara sayaka mareu capa shravana lagi tani || || pareu muruchi mahi lagata sayaka| sumirata
    rama rama raghunayaka || suni priya bacana bharata taba dhae| kapi samipa ati atura ae || bikala biloki
    kisa ura lava| jagata nahim bahu bha~ti jagava || mukha malina mana bhe dukhari| kahata bacana bhari
    locana bari || jehim bidhi rama bimukha mohi kinha| tehim puni yaha daruna dukha dinha || jaum morem
    mana baca aru kaya| priti rama pada kamala amaya || tau kapi hau bigata shrama sula| jaum mo para
    raghupati anukula || sunata bacana uthi baitha kapisa| kahi jaya jayati kosaladhisa || so linha kapihi
    ura lai pulakita tanu locana sajala| priti na hridaya~ samai sumiri rama raghukula tilaka || || tata
    kusala kahu sukhanidhana ki| sahita anuja aru matu janaki || kapi saba carita samasa bakhane| bhe
    dukhi mana mahu~ pachitane || ahaha daiva maim kata jaga jayu~| prabhu ke ekahu kaja na ayu~ || jani
    kuavasaru mana dhari dhira| puni kapi sana bole balabira || tata gaharu hoihi tohi jata| kaju nasaihi
    hota prabhata || carhau mama sayaka saila sameta| pathavaum tohi jaha~ kripaniketa || suni kapi mana
    upaja abhimana| morem bhara calihi kimi bana || rama prabhava bicari bahori| bandi carana kaha kapi
    kara jori || do tava pratapa ura rakhi prabhu jehu~ natha turanta| asa kahi ayasu pai pada bandi caleu
    hanumanta || || bharata bahu bala sila guna prabhu pada priti apara| mana mahu~ jata sarahata puni
    puni pavanakumara || || uha~ rama lachimanahim nihari| bole bacana manuja anusari || ardha rati gi
    kapi nahim ayu| rama uthai anuja ura layu || sakahu na dukhita dekhi mohi k | bandhu sada tava mridula
    subh || mama hita lagi tajehu pitu mata| sahehu bipina hima atapa bata || so anuraga kaha~ aba bhai|
    uthahu na suni mama baca bikalai || jaum janateu~ bana bandhu bichohu| pita bacana manateu~ nahim
    ohu || suta bita nari bhavana parivara| hohim jahim jaga barahim bara || asa bicari jiya~ jagahu tata|
    mili na jagata sahodara bhrata || jatha pankha binu khaga ati dina| mani binu phani karibara kara
    hina || asa mama jivana bandhu binu tohi| jaum jara daiva jiavai mohi || jaihu~ avadha kavana muhu
    lai| nari hetu priya bhai ga~vai || baru apajasa sahateu~ jaga mahim| nari hani bisesha chati nahim
    || aba apaloku soku suta tora| sahihi nithura kathora ura mora || nija janani ke eka kumara| tata
    tasu tumha prana adhara || saumpesi mohi tumhahi gahi pani| saba bidhi sukhada parama hita jani ||
    utaru kaha daihu~ tehi jai| uthi kina mohi sikhavahu bhai || bahu bidhi sicata soca bimocana| stravata
    salila rajiva dala locana || uma eka akhanda raghurai| nara gati bhagata kripala dekhai || so prabhu
    pralapa suni kana bikala bhe banara nikara| ai gayu hanumana jimi karuna maha~ bira rasa || || harashi
    rama bhenteu hanumana| ati kritagya prabhu parama sujana || turata baida taba kinha upai| uthi baithe
    lachimana harashai || hridaya~ lai prabhu bhenteu bhrata| harashe sakala bhalu kapi brata || kapi
    puni baida taha~ pahu~cava| jehi bidhi tabahim tahi li ava || yaha brittanta dasanana suneu| ati bishada
    puni puni sira dhuneu || byakula kumbhakarana pahim ava| bibidha jatana kari tahi jagava || jaga nisicara
    dekhia kaisa| manahu~ kalu deha dhari baisa || kumbhakarana bujha kahu bhai| kahe tava mukha rahe
    sukhai || katha kahi saba tehim abhimani| jehi prakara sita hari ani || tata kapinha saba nisicara
    mare| mahamaha jodha sanghare || durmukha suraripu manuja ahari| bhata atikaya akampana bhari || apara
    mahodara adika bira| pare samara mahi saba ranadhira || do suni dasakandhara bacana taba kumbhakarana
    bilakhana| jagadamba hari ani aba satha cahata kalyana || || bhala na kinha taim nisicara naha| aba
    mohi ai jagaehi kaha || ajahu~ tata tyagi abhimana| bhajahu rama hoihi kalyana || haim dasasisa manuja
    raghunayaka| jake hanumana se payaka || ahaha bandhu taim kinhi khotai| prathamahim mohi na sunaehi
    ai || kinhehu prabhu birodha tehi devaka| siva biranci sura jake sevaka || narada muni mohi gyana
    jo kaha| kahateu~ tohi samaya nirabaha || aba bhari anka bhentu mohi bhai| locana suphala karau maim
    jai || syama gata sarasiruha locana| dekhaum jai tapa traya mocana || do rama rupa guna sumirata magana
    bhayu chana eka| ravana mageu koti ghata mada aru mahisha aneka || || mahisha khai kari madira pana|
    garja bajraghata samana || kumbhakarana durmada rana ranga| cala durga taji sena na sanga || dekhi
    bibhishanu agem ayu| pareu carana nija nama sunayu || anuja uthai hridaya~ tehi layo| raghupati bhakta
    jani mana bhayo || tata lata ravana mohi mara| kahata parama hita mantra bicara || tehim galani raghupati
    pahim ayu~| dekhi dina prabhu ke mana bhayu~ || sunu suta bhayu kalabasa ravana| so ki mana aba parama
    sikhavana || dhanya dhanya taim dhanya bibhishana| bhayahu tata nisicara kula bhushana || bandhu bamsa
    taim kinha ujagara| bhajehu rama sobha sukha sagara || do bacana karma mana kapata taji bhajehu rama
    ranadhira| jahu na nija para sujha mohi bhayu~ kalabasa bira| || bandhu bacana suni cala bibhishana|
    ayu jaha~ trailoka bibhushana || natha bhudharakara sarira| kumbhakarana avata ranadhira || etana
    kapinha suna jaba kana| kilakilai dhae balavana || lie uthai bitapa aru bhudhara| katakatai darahim
    ta upara || koti koti giri sikhara prahara| karahim bhalu kapi eka eka bara || mur yo na mana tanu
    tar yo na tar yo| jimi gaja arka phalani ko maryo || taba marutasuta muthika hanyo| par yo dharani
    byakula sira dhunyo || puni uthi tehim mareu hanumanta| ghurmita bhutala pareu turanta || puni nala
    nilahi avani pacharesi| jaha~ taha~ pataki pataki bhata daresi || cali balimukha sena parai| ati bhaya
    trasita na kau samuhai || do angadadi kapi muruchita kari sameta sugriva| ka~kha dabi kapiraja kahu~
    cala amita bala simva || || uma karata raghupati naralila| khelata garura jimi ahigana mila || bhrikuti
    bhanga jo kalahi khai| tahi ki sohi aisi larai || jaga pavani kirati bistarihahim| gai gai bhavanidhi
    nara tarihahim || murucha gi marutasuta jaga| sugrivahi taba khojana laga || sugrivahu kai murucha
    biti| nibuka gayu tehi mritaka pratiti || katesi dasana nasika kana| garaji akasa calu tehim jana
    || gaheu carana gahi bhumi pachara| ati laghava~ uthi puni tehi mara || puni ayasu prabhu pahim balavana|
    jayati jayati jaya kripanidhana || naka kana kate jiya~ jani| phira krodha kari bhi mana glani ||
    sahaja bhima puni binu shruti nasa| dekhata kapi dala upaji trasa || do jaya jaya jaya raghubamsa
    mani dhae kapi dai huha| ekahi bara tasu para charaenhi giri taru juha || || kumbhakarana rana ranga
    biruddha| sanmukha cala kala janu kruddha || koti koti kapi dhari dhari khai| janu tirai giri guha~
    samai || kotinha gahi sarira sana marda| kotinha miji milava mahi garda || mukha nasa shravananhi
    kim bata| nisari parahim bhalu kapi thata || rana mada matta nisacara darpa| bisva grasihi janu ehi
    bidhi arpa || mure subhata saba phirahim na phere| sujha na nayana sunahim nahim tere || kumbhakarana
    kapi phauja bidari| suni dhai rajanicara dhari || dekhi rama bikala katakai| ripu anika nana bidhi
    ai || do sunu sugriva bibhishana anuja sa~bharehu saina| maim dekhu~ khala bala dalahi bole rajivanaina
    || || kara saranga saji kati bhatha| ari dala dalana cale raghunatha || prathama kinha prabhu dhanusha
    ta~kora| ripu dala badhira bhayu suni sora || satyasandha cha~rae sara laccha| kalasarpa janu cale
    sapaccha || jaha~ taha~ cale bipula naraca| lage katana bhata bikata pisaca || katahim carana ura
    sira bhujadanda| bahutaka bira hohim sata khanda || ghurmi ghurmi ghayala mahi parahim| uthi sambhari
    subhata puni larahim || lagata bana jalada jimi gajahim| bahutaka dekhi kathina sara bhajahim || runda
    pracanda munda binu dhavahim| dharu dharu maru maru dhuni gavahim || do chana mahu~ prabhu ke sayakanhi
    kate bikata pisaca| puni raghubira nishanga mahu~ prabise saba naraca || || kumbhakarana mana dikha
    bicari| hati dhana majha nisacara dhari || bha ati kruddha mahabala bira| kiyo mriganayaka nada ga~bhira
    || ko'pi mahidhara lei upari| dari jaha~ markata bhata bhari || avata dekhi saila prabhu bhare| saranhi
    kati raja sama kari dare || | puni dhanu tani ko'pi raghunayaka| cha~rae ati karala bahu sayaka ||
    tanu mahu~ prabisi nisari sara jahim| jimi damini ghana majha samahim || sonita stravata soha tana
    kare| janu kajjala giri geru panare || bikala biloki bhalu kapi dhae| biha~sa jabahim nikata kapi
    ae || do mahanada kari garja koti koti gahi kisa| mahi pataki gajaraja iva sapatha kari dasasisa ||
    || bhage bhalu balimukha jutha| briku biloki jimi mesha barutha || cale bhagi kapi bhalu bhavani|
    bikala pukarata arata bani || yaha nisicara dukala sama ahi| kapikula desa parana aba cahi || kripa
    baridhara rama kharari| pahi pahi pranatarati hari || sakaruna bacana sunata bhagavana| cale sudhari
    sarasana bana || rama sena nija pachaim ghali| cale sakopa maha balasali || khainci dhanusha sara
    sata sandhane| chute tira sarira samane || lagata sara dhava risa bhara| kudhara dagamagata dolati
    dhara || linha eka tehim saila upati| raghukula tilaka bhuja soi kati || dhava bama bahu giri dhari|
    prabhu sau bhuja kati mahi pari || katem bhuja soha khala kaisa| pacchahina mandara giri jaisa ||
    ugra bilokani prabhuhi biloka| grasana cahata manahu~ treloka || do kari cikkara ghora ati dhava badanu
    pasari| gagana siddha sura trasita ha ha heti pukari || || sabhaya deva karunanidhi janyo| shravana
    prajanta sarasanu tanyo || bisikha nikara nisicara mukha bhareu| tadapi mahabala bhumi na pareu ||
    saranhi bhara mukha sanmukha dhava| kala trona sajiva janu ava || taba prabhu ko'pi tibra sara linha|
    dhara te bhinna tasu sira kinha || so sira pareu dasanana agem| bikala bhayu jimi phani mani tyagem
    || dharani dhasi dhara dhava pracanda| taba prabhu kati kinha dui khanda || pare bhumi jimi nabha
    tem bhudhara| hetha dabi kapi bhalu nisacara || tasu teja prabhu badana samana| sura muni sabahim
    acambhava mana || sura dundubhim bajavahim harashahim| astuti karahim sumana bahu barashahim || kari
    binati sura sakala sidhae| tehi samaya devarishi ae || gaganopari hari guna gana gae| rucira birarasa
    prabhu mana bhae || begi hatahu khala kahi muni ge| rama samara mahi sobhata bhe || cham sangrama
    bhumi biraja raghupati atula bala kosala dhani| shrama bindu mukha rajiva locana aruna tana sonita
    kani || bhuja jugala pherata sara sarasana bhalu kapi cahu disi bane| kaha dasa tulasi kahi na saka
    chabi sesha jehi anana ghane || do nisicara adhama malakara tahi dinha nija dhama| girija te nara
    mandamati je na bhajahim shrirama || || dina kem anta phirim dau ani| samara bhi subhatanha shrama
    ghani || rama kripa~ kapi dala bala barhaa| jimi trina pai laga ati darhaa || chijahim nisicara dinu
    aru rati| nija mukha kahem sukrita jehi bha~ti || bahu bilapa dasakandhara kari| bandhu sisa puni
    puni ura dhari || rovahim nari hridaya hati pani| tasu teja bala bipula bakhani || meghanada tehi
    avasara ayu| kahi bahu katha pita samujhayu || dekhehu kali mori manusai| abahim bahuta ka karaum
    baraai || ishtadeva saim bala ratha payu~| so bala tata na tohi dekhayu~ || ehi bidhi jalpata bhayu
    bihana| cahu~ duara lage kapi nana || ita kapi bhalu kala sama bira| uta rajanicara ati ranadhira
    || larahim subhata nija nija jaya hetu| barani na jai samara khagaketu || do meghanada mayamaya ratha
    carhai gayu akasa || garjeu attahasa kari bhi kapi katakahi trasa || || sakti sula taravari kripana|
    astra sastra kulisayudha nana || daraha parasu parigha pashana| lageu brishti karai bahu bana || dasa
    disi rahe bana nabha chai| manahu~ magha megha jhari lai || dharu dharu maru sunia dhuni kana| jo
    mari tehi kau na jana || gahi giri taru akasa kapi dhavahim| dekhahi tehi na dukhita phiri avahim
    || avaghata ghata bata giri kandara| maya bala kinhesi sara panjara || jahim kaha~ byakula bhe bandara|
    surapati bandi pare janu mandara || marutasuta angada nala nila| kinhesi bikala sakala balasila ||
    puni lachimana sugriva bibhishana| saranhi mari kinhesi jarjara tana || puni raghupati saim jujhe
    laga| sara cha~rai hoi lagahim naga || byala pasa basa bhe kharari| svabasa ananta eka abikari ||
    nata iva kapata carita kara nana| sada svatantra eka bhagavana || rana sobha lagi prabhuhim ba~dhayo|
    nagapasa devanha bhaya payo || do girija jasu nama japi muni katahim bhava pasa| so ki bandha tara
    avi byapaka bisva nivasa || || carita rama ke saguna bhavani| tarki na jahim buddhi bala bani || asa
    bicari je tagya biragi| ramahi bhajahim tarka saba tyagi || byakula kataku kinha ghananada| puni bha
    pragata kahi durbada || jamavanta kaha khala rahu tharhaa| suni kari tahi krodha ati barhaa || burha
    jani satha cha~raeu~ tohi| lagesi adhama pacarai mohi || asa kahi tarala trisula calayo| jamavanta
    kara gahi soi dhayo || marisi meghanada kai chati| para bhumi ghurmita suraghati || puni risana gahi
    carana phirayau| mahi pachari nija bala dekharayo || bara prasada so mari na mara| taba gahi pada
    lanka para dara || iha~ devarishi garura pathayo| rama samipa sapadi so ayo || do khagapati saba dhari
    khae maya naga barutha| maya bigata bhe saba harashe banara jutha| || gahi giri padapa upala nakha
    dhae kisa risai| cale tamicara bikalatara garha para carhae parai || || meghanada ke muracha jagi|
    pitahi biloki laja ati lagi || turata gayu giribara kandara| karaum ajaya makha asa mana dhara ||
    iha~ bibhishana mantra bicara| sunahu natha bala atula udara || meghanada makha kari apavana| khala
    mayavi deva satavana || jaum prabhu siddha hoi so paihi| natha begi puni jiti na jaihi || suni raghupati
    atisaya sukha mana| bole angadadi kapi nana || lachimana sanga jahu saba bhai| karahu bidhamsa jagya
    kara jai || tumha lachimana marehu rana ohi| dekhi sabhaya sura dukha ati mohi || marehu tehi bala
    buddhi upai| jehim chijai nisicara sunu bhai || jamavanta sugriva bibhishana| sena sameta rahehu tiniu
    jana || jaba raghubira dinhi anusasana| kati nishanga kasi saji sarasana || prabhu pratapa ura dhari
    ranadhira| bole ghana iva gira ga~bhira || jaum tehi aju badhem binu avaum| tau raghupati sevaka na
    kahavaum || jaum sata sankara karahim sahai| tadapi hatu~ raghubira dohai || do raghupati carana nai
    siru caleu turanta ananta| angada nila mayanda nala sanga subhata hanumanta || || jai kapinha so dekha
    baisa| ahuti deta rudhira aru bhaimsa || kinha kapinha saba jagya bidhamsa| jaba na uthi taba karahim
    prasamsa || tadapi na uthi dharenhi kaca jai| latanhi hati hati cale parai || lai trisula dhava kapi
    bhage| ae jaha~ ramanuja age || ava parama krodha kara mara| garja ghora rava barahim bara || ko'pi
    marutasuta angada dhae| hati trisula ura dharani girae || prabhu kaha~ cha~raesi sula pracanda| sara
    hati krita ananta juga khanda || uthi bahori maruti jubaraja| hatahim ko'pi tehi ghau na baja || phire
    bira ripu mari na mara| taba dhava kari ghora cikara || avata dekhi kruddha janu kala| lachimana charae
    bisikha karala || dekhesi avata pabi sama bana| turata bhayu khala antaradhana || bibidha besha dhari
    kari larai| kabahu~ka pragata kabahu~ duri jai || dekhi ajaya ripu darape kisa| parama kruddha taba
    bhayu ahisa || lachimana mana asa mantra drirhaava| ehi papihi maim bahuta khelava || sumiri kosaladhisa
    pratapa| sara sandhana kinha kari dapa || charaa bana majha ura laga| marati bara kapatu saba tyaga
    || do ramanuja kaha~ ramu kaha~ asa kahi cha~raesi prana| dhanya dhanya tava janani kaha angada hanumana
    || || binu prayasa hanumana uthayo| lanka dvara rakhi puni ayo || tasu marana suni sura gandharba|
    carhai bimana ae nabha sarba || barashi sumana dundubhim bajavahim| shriraghunatha bimala jasu gavahim
    || jaya ananta jaya jagadadhara| tumha prabhu saba devanhi nistara || astuti kari sura siddha sidhae|
    lachimana kripasindhu pahim ae || suta badha suna dasanana jabahim| muruchita bhayu pareu mahi tabahim
    || mandodari rudana kara bhari| ura tarana bahu bha~ti pukari || nagara loga saba byakula soca| sakala
    kahahim dasakandhara poca || do taba dasakantha bibidha bidhi samujhaim saba nari| nasvara rupa jagata
    saba dekhahu hridaya~ bicari || || tinhahi gyana upadesa ravana| apuna manda katha subha pavana ||
    para upadesa kusala bahutere| je acarahim te nara na ghanere || nisa sirani bhayu bhinusara| lage
    bhalu kapi carihu~ dvara || subhata bolai dasanana bola| rana sanmukha ja kara mana dola || so abahim
    baru jau parai| sanjuga bimukha bhe~ na bhalai || nija bhuja bala maim bayaru barhaava| dehu~ utaru
    jo ripu carhai ava || asa kahi maruta bega ratha saja| baje sakala jujh baja || cale bira saba atulita
    bali| janu kajjala kai a~dhi cali || asaguna amita hohim tehi kala| gani na bhujabala garba bisala
    || cham ati garba gani na saguna asaguna stravahim ayudha hatha te| bhata girata ratha te baji gaja
    cikkarata bhajahim satha te || gomaya gidha karala khara rava svana bolahim ati ghane| janu kaladuta
    uluka bolahim bacana parama bhayavane || do tahi ki sampati saguna subha sapanehu~ mana bishrama|
    bhuta droha rata mohabasa rama bimukha rati kama || || caleu nisacara kataku apara| caturangini ani
    bahu dhara || bibidha bha~ti bahana ratha jana| bipula barana pataka dhvaja nana || cale matta gaja
    jutha ghanere| prabita jalada maruta janu prere || barana barada biradaita nikaya| samara sura janahim
    bahu maya || ati bicitra bahini biraji| bira basanta sena janu saji || calata kataka digasidhumra
    dagahim| chubhita payodhi kudhara dagamagahim || uthi renu rabi gayu chapai| maruta thakita basudha
    akulai || panava nisana ghora rava bajahim| pralaya samaya ke ghana janu gajahim || bheri naphiri
    baja sahanai| maru raga subhata sukhadai || kehari nada bira saba karahim| nija nija bala paurusha
    uccarahim || kahi dasanana sunahu subhatta| mardahu bhalu kapinha ke thatta || haum marihu~ bhupa
    dvau bhai| asa kahi sanmukha phauja rengai || yaha sudhi sakala kapinha jaba pai| dhae kari raghubira
    dohai || cham dhae bisala karala markata bhalu kala samana te| manahu~ sapaccha uraahim bhudhara brinda
    nana bana te || nakha dasana saila mahadrumayudha sabala sanka na manahim| jaya rama ravana matta
    gaja mrigaraja sujasu bakhanahim || do duhu disi jaya jayakara kari nija nija jori jani| bhire bira
    ita ramahi uta ravanahi bakhani || || ravanu rathi biratha raghubira| dekhi bibhishana bhayu adhira
    || adhika priti mana bha sandeha| bandi carana kaha sahita saneha || natha na ratha nahim tana pada
    trana| kehi bidhi jitaba bira balavana || sunahu sakha kaha kripanidhana| jehim jaya hoi so syandana
    ana || sauraja dhiraja tehi ratha caka| satya sila drirha dhvaja pataka || bala bibeka dama parahita
    ghore| chama kripa samata raju jore || isa bhajanu sarathi sujana| birati carma santosha kripana ||
    dana parasu budhi sakti pracanraa| bara bigyana kathina kodanda || amala acala mana trona samana|
    sama jama niyama silimukha nana || kavaca abheda bipra gura puja| ehi sama bijaya upaya na duja ||
    sakha dharmamaya asa ratha jakem| jitana kaha~ na katahu~ ripu takem || do maha ajaya samsara ripu
    jiti saki so bira| jakem asa ratha hoi drirha sunahu sakha matidhira || || suni prabhu bacana bibhishana
    harashi gahe pada kanja| ehi misa mohi upadesehu rama kripa sukha punja || || uta pacara dasakandhara
    ita angada hanumana| larata nisacara bhalu kapi kari nija nija prabhu ana || || sura brahmadi siddha
    muni nana| dekhata rana nabha carhae bimana || hamahu uma rahe tehi sanga| dekhata rama carita rana
    ranga || subhata samara rasa duhu disi mate| kapi jayasila rama bala tate || eka eka sana bhirahim
    pacarahim| ekanha eka mardi mahi parahim || marahim katahim dharahim pacharahim| sisa tori sisanha
    sana marahim || udara bidarahim bhuja uparahim| gahi pada avani pataki bhata darahim || nisicara bhata
    mahi garahi bhalu| upara dhari dehim bahu balu || bira balimukha juddha biruddhe| dekhiata bipula
    kala janu kruddhe || cham kruddhe kritanta samana kapi tana stravata sonita rajahim| mardahim nisacara
    kataka bhata balavanta ghana jimi gajahim || marahim capetanhi dati datanha kati latanha mijahim|
    cikkarahim markata bhalu chala bala karahim jehim khala chijahim || dhari gala pharahim ura bidarahim
    gala a~tavari melahim| prahaladapati janu bibidha tanu dhari samara angana khelahim || dharu maru
    katu pacharu ghora gira gagana mahi bhari rahi| jaya rama jo trina te kulisa kara kulisa te kara trina
    sahi || do nija dala bicalata dekhesi bisa bhuja~ dasa capa| ratha carhai caleu dasanana phirahu phirahu
    kari dapa || || dhayu parama kruddha dasakandhara| sanmukha cale huha dai bandara || gahi kara padapa
    upala pahara| darenhi ta para ekahim bara || lagahim saila bajra tana tasu| khanda khanda hoi phutahim
    asu || cala na acala raha ratha ropi| rana durmada ravana ati kopi || ita uta jhapati dapati kapi
    jodha| mardai laga bhayu ati krodha || cale parai bhalu kapi nana| trahi trahi angada hanumana ||
    pahi pahi raghubira gosai| yaha khala khai kala ki nai || tehi dekhe kapi sakala parane| dasahu~ capa
    sayaka sandhane || cham sandhani dhanu sara nikara charaesi uraga jimi urai lagahim| rahe puri sara
    dharani gagana disi bidasi kaha~ kapi bhagahim || bhayo ati kolahala bikala kapi dala bhalu bolahim
    ature| raghubira karuna sindhu arata bandhu jana racchaka hare || do nija dala bikala dekhi kati kasi
    nishanga dhanu hatha| lachimana cale kruddha hoi nai rama pada matha || || re khala ka marasi kapi
    bhalu| mohi biloku tora maim kalu || khojata raheu~ tohi sutaghati| aju nipati juraavu~ chati || asa
    kahi charaesi bana pracanda| lachimana kie sakala sata khanda || kotinha ayudha ravana dare| tila
    pravana kari kati nivare || puni nija bananha kinha prahara| syandanu bhanji sarathi mara || sata
    sata sara mare dasa bhala| giri sringanha janu prabisahim byala || puni sata sara mara ura mahim|
    pareu dharani tala sudhi kachu nahim || utha prabala puni murucha jagi| charaisi brahma dinhi jo sa~gi
    || cham so brahma datta pracanda sakti ananta ura lagi sahi| paryo bira bikala uthava dasamukha atula
    bala mahima rahi || brahmanda bhavana biraja jakem eka sira jimi raja kani| tehi caha uthavana murha
    ravana jana nahim tribhuana dhani || do dekhi pavanasuta dhayu bolata bacana kathora| avata kapihi
    hanyo tehim mushti prahara praghora || || janu teki kapi bhumi na gira| utha sa~bhari bahuta risa
    bhara || muthika eka tahi kapi mara| pareu saila janu bajra prahara || murucha gai bahori so jaga|
    kapi bala bipula sarahana laga || dhiga dhiga mama paurusha dhiga mohi| jaum taim jiata rahesi suradrohi
    || asa kahi lachimana kahu~ kapi lyayo| dekhi dasanana bisamaya payo || kaha raghubira samujhu jiya~
    bhrata| tumha kritanta bhacchaka sura trata || sunata bacana uthi baitha kripala| gi gagana so sakati
    karala || puni kodanda bana gahi dhae| ripu sanmukha ati atura ae || cham atura bahori bibhanji syandana
    suta hati byakula kiyo| gir yo dharani dasakandhara bikalatara bana sata bedhyo hiyo || sarathi dusara
    ghali ratha tehi turata lanka lai gayo| raghubira bandhu pratapa punja bahori prabhu carananhi nayo
    || do uha~ dasanana jagi kari karai laga kachu jagya| rama birodha bijaya caha satha hatha basa ati
    agya || || iha~ bibhishana saba sudhi pai| sapadi jai raghupatihi sunai || natha kari ravana eka jaga|
    siddha bhe~ nahim marihi abhaga || pathavahu natha begi bhata bandara| karahim bidhamsa ava dasakandhara
    || prata hota prabhu subhata pathae| hanumadadi angada saba dhae || kautuka kudi carhae kapi lanka|
    paithe ravana bhavana asanka || jagya karata jabahim so dekha| sakala kapinha bha krodha bisesha ||
    rana te nilaja bhaji griha ava| iha~ ai baka dhyana lagava || asa kahi angada mara lata| citava na
    satha svaratha mana rata || cham nahim citava jaba kari kopa kapi gahi dasana latanha marahim| dhari
    kesa nari nikari bahera te'tidina pukarahim || taba utheu kruddha kritanta sama gahi carana banara
    dari| ehi bica kapinha bidhamsa krita makha dekhi mana mahu~ hari || do jagya bidhamsi kusala kapi
    ae raghupati pasa| caleu nisacara krurddha hoi tyagi jivana kai asa || || calata hohim ati asubha
    bhayankara| baithahim gidha uraai siranha para || bhayu kalabasa kahu na mana| kahesi bajavahu juddha
    nisana || cali tamicara ani apara| bahu gaja ratha padati asavara || prabhu sanmukha dhae khala kaimsem|
    salabha samuha anala kaha~ jaimsem || iha~ devatanha astuti kinhi| daruna bipati hamahi ehim dinhi
    || aba jani rama khelavahu ehi| atisaya dukhita hoti baidehi || deva bacana suni prabhu musakana|
    uthi raghubira sudhare bana| jata juta drirha ba~dhai mathe| sohahim sumana bica bica gathe || aruna
    nayana barida tanu syama| akhila loka locanabhirama || katitata parikara kasyo nishanga| kara kodanda
    kathina saranga || cham saranga kara sundara nishanga silimukhakara kati kasyo| bhujadanda pina manoharayata
    ura dharasura pada lasyo || kaha dasa tulasi jabahim prabhu sara capa kara pherana lage| brahmanda
    diggaja kamatha ahi mahi sindhu bhudhara dagamage || do sobha dekhi harashi sura barashahim sumana
    apara| jaya jaya jaya karunanidhi chabi bala guna agara || || ehim bica nisacara ani| kasamasata ai
    ati ghani| dekhi cale sanmukha kapi bhatta| pralayakala ke janu ghana ghatta || bahu kripana taravari
    camankahim| janu daha~ disi daminim damankahim || gaja ratha turaga cikara kathora| garjahim manahu~
    balahaka ghora || kapi langura bipula nabha chae| manahu~ indradhanu ue suhae || uthi dhuri manahu~
    jaladhara| bana bunda bhai brishti apara || duhu~ disi parbata karahim prahara| bajrapata janu barahim
    bara || raghupati ko'pi bana jhari lai| ghayala bhai nisicara samudai || lagata bana bira cikkarahim|
    ghurmi ghurmi jaha~ taha~ mahi parahim || stravahim saila janu nirjhara bhari| sonita sari kadara
    bhayakari || cham kadara bhayankara rudhira sarita cali parama apavani| dau kula dala ratha reta cakra
    abarta bahati bhayavani || jala jantugaja padacara turaga khara bibidha bahana ko gane| sara sakti
    tomara sarpa capa taranga carma kamatha ghane || do bira parahim janu tira taru majja bahu baha phena|
    kadara dekhi darahim taha~ subhatanha ke mana cena || || majjahi bhuta pisaca betala| pramatha maha
    jhotinga karala || kaka kanka lai bhuja uraahim| eka te chini eka lai khahim || eka kahahim aisiu
    saunghai| sathahu tumhara daridra na jai || kaha~rata bhata ghayala tata gire| jaha~ taha~ manahu~
    ardhajala pare || khaincahim gidha a~ta tata bhe| janu bamsi khelata cita de || bahu bhata bahahim
    carhae khaga jahim| janu navari khelahim sari mahim || jogini bhari bhari khappara sancahim| bhuta
    pisaca badhu nabha nancahim || bhata kapala karatala bajavahim| camunda nana bidhi gavahim || jambuka
    nikara katakkata kattahim| khahim huahim aghahim dapattahim || kotinha runda munda binu dollahim|
    sisa pare mahi jaya jaya bollahim || cham bollahim jo jaya jaya munda runda pracanda sira binu dhavahim|
    khapparinha khagga alujjhi jujjhahim subhata bhatanha dhahavahim || banara nisacara nikara mardahim
    rama bala darpita bhe| sangrama angana subhata sovahim rama sara nikaranhi he || do ravana hridaya~
    bicara bha nisicara sanghara| maim akela kapi bhalu bahu maya karaum apara || || devanha prabhuhi
    payadem dekha| upaja ura ati chobha bisesha || surapati nija ratha turata pathava| harasha sahita
    matali lai ava || teja punja ratha dibya anupa| harashi carhae kosalapura bhupa || cancala turaga
    manohara cari| ajara amara mana sama gatikari || ratharurha raghunathahi dekhi| dhae kapi balu pai
    biseshi || sahi na jai kapinha kai mari| taba ravana maya bistari || so maya raghubirahi ba~ci| lachimana
    kapinha so mani sa~ci || dekhi kapinha nisacara ani| anuja sahita bahu kosaladhani || cham bahu rama
    lachimana dekhi markata bhalu mana ati apadare| janu citra likhita sameta lachimana jaha~ so taha~
    citavahim khare || nija sena cakita biloki ha~si sara capa saji kosala dhani| maya hari hari nimisha
    mahu~ harashi sakala markata ani || do bahuri rama saba tana citi bole bacana ga~bhira| dvandajuddha
    dekhahu sakala shramita bhe ati bira || || asa kahi ratha raghunatha calava| bipra carana pankaja
    siru nava || taba lankesa krodha ura chava| garjata tarjata sanmukha dhava || jitehu je bhata sanjuga
    mahim| sunu tapasa maim tinha sama nahim || ravana nama jagata jasa jana| lokapa jakem bandikhana
    || khara dushana biradha tumha mara| badhehu byadha iva bali bicara || nisicara nikara subhata sangharehu|
    kumbhakarana ghananadahi marehu || aju bayaru sabu leu~ nibahi| jaum rana bhupa bhaji nahim jahim
    || aju karu~ khalu kala havale| parehu kathina ravana ke pale || suni durbacana kalabasa jana| biha~si
    bacana kaha kripanidhana || satya satya saba tava prabhutai| jalpasi jani dekhau manusai || cham jani
    jalpana kari sujasu nasahi niti sunahi karahi chama| samsara maha~ purusha tribidha patala rasala
    panasa sama || eka sumanaprada eka sumana phala eka phali kevala lagahim| eka kahahim kahahim karahim
    apara eka karahim kahata na bagahim || do rama bacana suni biha~sa mohi sikhavata gyana| bayaru karata
    nahim taba dare aba lage priya prana || || kahi durbacana kruddha dasakandhara| kulisa samana laga
    cha~raai sara || nanakara silimukha dhae| disi aru bidisa gagana mahi chae || pavaka sara cha~raeu
    raghubira| chana mahu~ jare nisacara tira || charaisi tibra sakti khisiai| bana sanga prabhu pheri
    calai || kotika cakra trisula pabarai| binu prayasa prabhu kati nivarai || niphala hohim ravana sara
    kaisem| khala ke sakala manoratha jaisem || taba sata bana sarathi maresi| pareu bhumi jaya rama pukaresi
    || rama kripa kari suta uthava| taba prabhu parama krodha kahu~ pava || cham bhe kruddha juddha biruddha
    raghupati trona sayaka kasamase| kodanda dhuni ati canda suni manujada saba maruta grase || ma~dodari
    ura kampa kampati kamatha bhu bhudhara trase| cikkarahim diggaja dasana gahi mahi dekhi kautuka sura
    ha~se || do taneu capa shravana lagi cha~rae bisikha karala| rama maragana gana cale lahalahata janu
    byala || || cale bana sapaccha janu uraga| prathamahim hateu sarathi turaga || ratha bibhanji hati
    ketu pataka| garja ati antara bala thaka || turata ana ratha carhai khisiana| astra sastra cha~raesi
    bidhi nana || biphala hohim saba udyama take| jimi paradroha nirata manasa ke || taba ravana dasa
    sula calava| baji cari mahi mari girava || turaga uthai ko'pi raghunayaka| khainci sarasana cha~rae
    sayaka || ravana sira saroja banacari| cali raghubira silimukha dhari || dasa dasa bana bhala dasa
    mare| nisari ge cale rudhira panare || stravata rudhira dhayu balavana| prabhu puni krita dhanu sara
    sandhana || tisa tira raghubira pabare| bhujanhi sameta sisa mahi pare || katatahim puni bhe nabine|
    rama bahori bhuja sira chine || prabhu bahu bara bahu sira he| katata jhatiti puni nutana bhe || puni
    puni prabhu katata bhuja sisa| ati kautuki kosaladhisa || rahe chai nabha sira aru bahu| manahu~ amita
    ketu aru rahu || cham janu rahu ketu aneka nabha patha stravata sonita dhavahim| raghubira tira pracanda
    lagahim bhumi girana na pavahim || eka eka sara sira nikara chede nabha urata imi sohahim| janu ko'pi
    dinakara kara nikara jaha~ taha~ bidhuntuda pohahim || do jimi jimi prabhu hara tasu sira timi timi
    hohim apara| sevata bishaya bibardha jimi nita nita nutana mara || || dasamukha dekhi siranha kai
    barhai| bisara marana bhi risa garhai || garjeu murha maha abhimani| dhayu dasahu sarasana tani ||
    samara bhumi dasakandhara kopyo| barashi bana raghupati ratha topyo || danda eka ratha dekhi na pareu|
    janu nihara mahu~ dinakara dureu || hahakara suranha jaba kinha| taba prabhu ko'pi karamuka linha
    || sara nivari ripu ke sira kate| te disi bidisa gagana mahi pate || kate sira nabha maraga dhavahim|
    jaya jaya dhuni kari bhaya upajavahim || kaha~ lachimana sugriva kapisa| kaha~ raghubira kosaladhisa
    || cham kaha~ ramu kahi sira nikara dhae dekhi markata bhaji cale| sandhani dhanu raghubamsamani ha~si
    saranhi sira bedhe bhale || sira malika kara kalika gahi brinda brindanhi bahu milim| kari rudhira
    sari majjanu manahu~ sangrama bata pujana calim || do puni dasakantha kruddha hoi cha~rai sakti pracanda|
    cali bibhishana sanmukha manahu~ kala kara danda || || avata dekhi sakti ati ghora| pranatarati bhanjana
    pana mora || turata bibhishana pachem mela| sanmukha rama saheu soi sela || lagi sakti murucha kachu
    bhi| prabhu krita khela suranha bikali || dekhi bibhishana prabhu shrama payo| gahi kara gada kruddha
    hoi dhayo || re kubhagya satha manda kubuddhe| taim sura nara muni naga biruddhe || sadara siva kahu~
    sisa carhaae| eka eka ke kotinha pae || tehi karana khala aba lagi ba~cyo| aba tava kalu sisa para
    nacyo || rama bimukha satha cahasi sampada| asa kahi hanesi majha ura gada || cham ura majha gada
    prahara ghora kathora lagata mahi par yo| dasa badana sonita stravata puni sambhari dhayo risa bhar
    yo || dvau bhire atibala mallajuddha biruddha eku ekahi hanai| raghubira bala darpita bibhishanu ghali
    nahim ta kahu~ ganai || do uma bibhishanu ravanahi sanmukha citava ki kau| so aba bhirata kala jyom
    shriraghubira prabhau || || dekha shramita bibhishanu bhari| dhayu hanumana giri dhari || ratha turanga
    sarathi nipata| hridaya majha tehi maresi lata || tharha raha ati kampita gata| gayu bibhishanu jaha~
    janatrata || puni ravana kapi hateu pacari| caleu gagana kapi pu~cha pasari || gahisi pu~cha kapi
    sahita uraana| puni phiri bhireu prabala hanumana || larata akasa jugala sama jodha| ekahi eku hanata
    kari krodha || sohahim nabha chala bala bahu karahim| kajjala giri sumeru janu larahim || budhi bala
    nisicara pari na par yo| taba maruta suta prabhu sambhar yo || cham sambhari shriraghubira dhira pacari
    kapi ravanu hanyo| mahi parata puni uthi larata devanha jugala kahu~ jaya jaya bhanyo || hanumanta
    sankata dekhi markata bhalu krodhatura cale| rana matta ravana sakala subhata pracanda bhuja bala
    dalamale || do taba raghubira pacare dhae kisa pracanda| kapi bala prabala dekhi tehim kinha pragata
    pashanda || || antaradhana bhayu chana eka| puni pragate khala rupa aneka || raghupati kataka bhalu
    kapi jete| jaha~ taha~ pragata dasanana tete || dekhe kapinha amita dasasisa| jaha~ taha~ bhaje bhalu
    aru kisa || bhage banara dharahim na dhira| trahi trahi lachimana raghubira || daha~ disi dhavahim
    kotinha ravana| garjahim ghora kathora bhayavana || dare sakala sura cale parai| jaya kai asa tajahu
    aba bhai || saba sura jite eka dasakandhara| aba bahu bhe takahu giri kandara || rahe biranci sambhu
    muni gyani| jinha jinha prabhu mahima kachu jani || cham jana pratapa te rahe nirbhaya kapinha ripu
    mane phure| cale bicali markata bhalu sakala kripala pahi bhayature || hanumanta angada nila nala
    atibala larata rana ba~kure| mardahim dasanana koti kotinha kapata bhu bhata ankure || do sura banara
    dekhe bikala ha~syo kosaladhisa| saji saranga eka sara hate sakala dasasisa || || prabhu chana mahu~
    maya saba kati| jimi rabi ue~ jahim tama phati || ravanu eku dekhi sura harashe| phire sumana bahu
    prabhu para barashe || bhuja uthai raghupati kapi phere| phire eka ekanha taba tere || prabhu balu
    pai bhalu kapi dhae| tarala tamaki sanjuga mahi ae || astuti karata devatanhi dekhem| bhayu~ eka maim
    inha ke lekhem || sathahu sada tumha mora marayala| asa kahi ko'pi gagana para dhayala || hahakara
    karata sura bhage| khalahu jahu kaha~ morem age || dekhi bikala sura angada dhayo| kudi carana gahi
    bhumi girayo || cham gahi bhumi par yo lata mar yo balisuta prabhu pahim gayo| sambhari uthi dasakantha
    ghora kathora rava garjata bhayo || kari dapa capa carhaai dasa sandhani sara bahu barashi| kie sakala
    bhata ghayala bhayakula dekhi nija bala harashi || do taba raghupati ravana ke sisa bhuja sara capa|
    kate bahuta barhae puni jimi tiratha kara papa| || sira bhuja barhai dekhi ripu keri| bhalu kapinha
    risa bhi ghaneri || marata na murha kateu bhuja sisa| dhae ko'pi bhalu bhata kisa || balitanaya maruti
    nala nila| banararaja dubida balasila || bitapa mahidhara karahim prahara| soi giri taru gahi kapinha
    so mara || eka nakhanhi ripu bapusha bidari| bhagi calahim eka latanha mari || taba nala nila siranhi
    carhai gayu| nakhanhi lilara bidarata bhayu || rudhira dekhi bishada ura bhari| tinhahi dharana kahu~
    bhuja pasari || gahe na jahim karanhi para phirahim| janu juga madhupa kamala bana carahim || ko'pi
    kudi dvau dharesi bahori| mahi patakata bhaje bhuja marori || puni sakopa dasa dhanu kara linhe| saranhi
    mari ghayala kapi kinhe || hanumadadi muruchita kari bandara| pai pradosha harasha dasakandhara ||
    muruchita dekhi sakala kapi bira| jamavanta dhayu ranadhira || sanga bhalu bhudhara taru dhari| marana
    lage pacari pacari || bhayu kruddha ravana balavana| gahi pada mahi pataki bhata nana || dekhi bhalupati
    nija dala ghata| ko'pi majha ura maresi lata || cham ura lata ghata pracanda lagata bikala ratha te
    mahi para| gahi bhalu bisahu~ kara manahu~ kamalanhi base nisi madhukara || muruchita biloki bahori
    pada hati bhalupati prabhu pahim gayau| nisi jani syandana ghali tehi taba suta jatanu karata bhayo
    || do murucha bigata bhalu kapi saba ae prabhu pasa| nisicara sakala ravanahi gheri rahe ati trasa
    || chabbisava~ vishrama tehi nisi sita pahim jai| trijata kahi saba katha sunai || sira bhuja barhai
    sunata ripu keri| sita ura bhi trasa ghaneri || mukha malina upaji mana cinta| trijata sana boli taba
    sita || hoihi kaha kahasi kina mata| kehi bidhi marihi bisva dukhadata || raghupati sara sira katehu~
    na mari| bidhi biparita carita saba kari || mora abhagya jiavata ohi| jehim hau hari pada kamala bichohi
    || jehim krita kapata kanaka mriga jhutha| ajahu~ so daiva mohi para rutha || jehim bidhi mohi dukha
    dusaha sahae| lachimana kahu~ katu bacana kahae || raghupati biraha sabisha sara bhari| taki taki
    mara bara bahu mari || aisehu~ dukha jo rakha mama prana| soi bidhi tahi jiava na ana || bahu bidhi
    kara bilapa janaki| kari kari surati kripanidhana ki || kaha trijata sunu rajakumari| ura sara lagata
    mari surari || prabhu tate ura hati na tehi| ehi ke hridaya~ basati baidehi || cham ehi ke hridaya~
    basa janaki janaki ura mama basa hai| mama udara bhuana aneka lagata bana saba kara nasa hai || suni
    bacana harasha bishada mana ati dekhi puni trijata~ kaha| aba marihi ripu ehi bidhi sunahi sundari
    tajahi samsaya maha || do katata sira hoihi bikala chuti jaihi tava dhyana| taba ravanahi hridaya
    mahu~ marihahim ramu sujana || || asa kahi bahuta bha~ti samujhai| puni trijata nija bhavana sidhai
    || rama subhau sumiri baidehi| upaji biraha bitha ati tehi || nisihi sasihi nindati bahu bha~ti| juga
    sama bhi sirati na rati || karati bilapa manahim mana bhari| rama biraha~ janaki dukhari || jaba ati
    bhayu biraha ura dahu| pharakeu bama nayana aru bahu || saguna bicari dhari mana dhira| aba milihahim
    kripala raghubira || iha~ ardhanisi ravanu jaga| nija sarathi sana khijhana laga || satha ranabhumi
    charaaisi mohi| dhiga dhiga adhama mandamati tohi || tehim pada gahi bahu bidhi samujhava| bhauru
    bhe~ ratha carhai puni dhava || suni agavanu dasanana kera| kapi dala kharabhara bhayu ghanera ||
    jaha~ taha~ bhudhara bitapa upari| dhae katakatai bhata bhari || cham dhae jo markata bikata bhalu
    karala kara bhudhara dhara| ati kopa karahim prahara marata bhaji cale rajanicara || bicalai dala
    balavanta kisanha gheri puni ravanu liyo| cahu~ disi capetanhi mari nakhanhi bidari tanu byakula kiyo
    || do dekhi maha markata prabala ravana kinha bicara| antarahita hoi nimisha mahu~ krita maya bistara
    || jaba kinha tehim pashanda| bhe pragata jantu pracanda || betala bhuta pisaca| kara dharem dhanu
    naraca || || jogini gahem karabala| eka hatha manuja kapala || kari sadya sonita pana| nacahim karahim
    bahu gana || || dharu maru bolahim ghora| rahi puri dhuni cahu~ ora || mukha bai dhavahim khana| taba
    lage kisa parana || || jaha~ jahim markata bhagi| taha~ barata dekhahim agi || bhe bikala banara bhalu|
    puni laga barashai balu || || jaha~ taha~ thakita kari kisa| garjeu bahuri dasasisa || lachimana kapisa
    sameta| bhe sakala bira aceta || || ha rama ha raghunatha| kahi subhata mijahim hatha || ehi bidhi
    sakala bala tori| tehim kinha kapata bahori || || pragatesi bipula hanumana| dhae gahe pashana ||
    tinha ramu ghere jai| cahu~ disi barutha banai || || marahu dharahu jani jai| katakatahim pu~cha uthai
    || daha~ disi la~gura biraja| tehim madhya kosalaraja || tehim madhya kosalaraja sundara syama tana
    sobha lahi| janu indradhanusha aneka ki bara bari tunga tamalahi || prabhu dekhi harasha bishada ura
    sura badata jaya jaya jaya kari| raghubira ekahi tira ko'pi nimesha mahu~ maya hari || || maya bigata
    kapi bhalu harashe bitapa giri gahi saba phire| sara nikara charae rama ravana bahu sira puni mahi
    gire || shrirama ravana samara carita aneka kalpa jo gavahim| sata sesha sarada nigama kabi teu tadapi
    para na pavahim || take guna gana kachu kahe jaramati tulasidasa| jimi nija bala anurupa te machi
    urai akasa || || kate sira bhuja bara bahu marata na bhata lankesa| prabhu krirata sura siddha muni
    byakula dekhi kalesa || || katata barhahim sisa samudai| jimi prati labha lobha adhikai || mari na
    ripu shrama bhayu bisesha| rama bibhishana tana taba dekha || uma kala mara jakim icha| so prabhu
    jana kara priti paricha || sunu sarabagya caracara nayaka| pranatapala sura muni sukhadayaka || nabhikunda
    piyusha basa yakem| natha jiata ravanu bala takem || sunata bibhishana bacana kripala| harashi gahe
    kara bana karala || asubha hona lage taba nana| rovahim khara srikala bahu svana || bolahi khaga jaga
    arati hetu| pragata bhe nabha jaha~ taha~ ketu || dasa disi daha hona ati laga| bhayu paraba binu
    rabi uparaga || mandodari ura kampati bhari| pratima stravahim nayana maga bari || cham pratima rudahim
    pabipata nabha ati bata baha dolati mahi| barashahim balahaka rudhira kaca raja asubha ati saka ko
    kahi || utapata amita biloki nabha sura bikala bolahi jaya je| sura sabhaya jani kripala raghupati
    capa sara jorata bhe || do khaici sarasana shravana lagi charae sara ekatisa| raghunayaka sayaka cale
    manahu~ kala phanisa || || sayaka eka nabhi sara sosha| apara lage bhuja sira kari rosha || lai sira
    bahu cale naraca| sira bhuja hina runda mahi naca || dharani dhasi dhara dhava pracanda| taba sara
    hati prabhu krita dui khanda || garjeu marata ghora rava bhari| kaha~ ramu rana hataum pacari || doli
    bhumi girata dasakandhara| chubhita sindhu sari diggaja bhudhara || dharani pareu dvau khanda barhaai|
    capi bhalu markata samudai || mandodari agem bhuja sisa| dhari sara cale jaha~ jagadisa || prabise
    saba nishanga mahu jai| dekhi suranha dundubhim bajai || tasu teja samana prabhu anana| harashe dekhi
    sambhu caturanana || jaya jaya dhuni puri brahmanda| jaya raghubira prabala bhujadanda || barashahi
    sumana deva muni brinda| jaya kripala jaya jayati mukunda || cham jaya kripa kanda mukanda dvanda
    harana sarana sukhaprada prabho| khala dala bidarana parama karana karunika sada bibho || sura sumana
    barashahim harasha sankula baja dundubhi gahagahi| sangrama angana rama anga ananga bahu sobha lahi
    || sira jata mukuta prasuna bica bica ati manohara rajahim| janu nilagiri para taraita patala sameta
    uraugana bhrajahim || bhujadanda sara kodanda pherata rudhira kana tana ati bane| janu rayamunim tamala
    para baithim bipula sukha apane || do kripadrishti kari prabhu abhaya kie sura brinda| bhalu kisa
    saba harashe jaya sukha dhama mukanda || || pati sira dekhata mandodari| muruchita bikala dharani
    khasi pari || jubati brinda rovata uthi dhaim| tehi uthai ravana pahim ai || pati gati dekhi te karahim
    pukara| chute kaca nahim bapusha sa~bhara || ura tarana karahim bidhi nana| rovata karahim pratapa
    bakhana || tava bala natha dola nita dharani| teja hina pavaka sasi tarani || sesha kamatha sahi sakahim
    na bhara| so tanu bhumi pareu bhari chara || baruna kubera suresa samira| rana sanmukha dhari kahu~
    na dhira || bhujabala jitehu kala jama saim| aju parehu anatha ki naim || jagata bidita tumhari prabhutai|
    suta parijana bala barani na jai || rama bimukha asa hala tumhara| raha na kau kula rovanihara ||
    tava basa bidhi prapanca saba natha| sabhaya disipa nita navahim matha || aba tava sira bhuja jambuka
    khahim| rama bimukha yaha anucita nahim || kala bibasa pati kaha na mana| aga jaga nathu manuja kari
    jana || cham janyo manuja kari danuja kanana dahana pavaka hari svayam| jehi namata siva brahmadi
    sura piya bhajehu nahim karunamayam || ajanma te paradroha rata papaughamaya tava tanu ayam| tumhahu
    diyo nija dhama rama namami brahma niramayam || do ahaha natha raghunatha sama kripasindhu nahim ana|
    jogi brinda durlabha gati tohi dinhi bhagavana || || mandodari bacana suni kana| sura muni siddha
    sabanhi sukha mana || aja mahesa narada sanakadi| je munibara paramarathabadi || bhari locana raghupatihi
    nihari| prema magana saba bhe sukhari || rudana karata dekhim saba nari| gayu bibhishanu mana dukha
    bhari || bandhu dasa biloki dukha kinha| taba prabhu anujahi ayasu dinha || lachimana tehi bahu bidhi
    samujhayo| bahuri bibhishana prabhu pahim ayo || kripadrishti prabhu tahi biloka| karahu kriya parihari
    saba soka || kinhi kriya prabhu ayasu mani| bidhivata desa kala jiya~ jani || do mandodari adi saba
    dei tilanjali tahi| bhavana gi raghupati guna gana baranata mana mahi || || ai bibhishana puni siru
    nayo| kripasindhu taba anuja bolayo || tumha kapisa angada nala nila| jamavanta maruti nayasila ||
    saba mili jahu bibhishana satha| sarehu tilaka kaheu raghunatha || pita bacana maim nagara na avu~|
    apu sarisa kapi anuja pathavu~ || turata cale kapi suni prabhu bacana| kinhi jai tilaka ki racana
    || sadara simhasana baithari| tilaka sari astuti anusari || jori pani sabahim sira nae| sahita bibhishana
    prabhu pahim ae || taba raghubira boli kapi linhe| kahi priya bacana sukhi saba kinhe || cham kie
    sukhi kahi bani sudha sama bala tumharem ripu hayo| payo bibhishana raja tihu~ pura jasu tumharo nita
    nayo || mohi sahita subha kirati tumhari parama priti jo gaihaim| samsara sindhu apara para prayasa
    binu nara paihaim || do prabhu ke bacana shravana suni nahim aghahim kapi punja| bara bara sira navahim
    gahahim sakala pada kanja || || puni prabhu boli liyu hanumana| lanka jahu kaheu bhagavana || samacara
    janakihi sunavahu| tasu kusala lai tumha cali avahu || taba hanumanta nagara mahu~ ae| suni nisicari
    nisacara dhae || bahu prakara tinha puja kinhi| janakasuta dekhai puni dinhi || durahi te pranama
    kapi kinha| raghupati duta janakim cinha || kahahu tata prabhu kripaniketa| kusala anuja kapi sena
    sameta || saba bidhi kusala kosaladhisa| matu samara jityo dasasisa || abicala raju bibhishana payo|
    suni kapi bacana harasha ura chayo || cham ati harasha mana tana pulaka locana sajala kaha puni puni
    rama| ka deu~ tohi treloka mahu~ kapi kimapi nahim bani sama || sunu matu maim payo akhila jaga raju
    aju na samsayam| rana jiti ripudala bandhu juta pasyami ramamanamayam || do sunu suta sadaguna sakala
    tava hridaya~ basahu~ hanumanta| sanukula kosalapati rahahu~ sameta ananta || || aba soi jatana karahu
    tumha tata| dekhaum nayana syama mridu gata || taba hanumana rama pahim jai| janakasuta kai kusala
    sunai || suni sandesu bhanukulabhushana| boli lie jubaraja bibhishana || marutasuta ke sanga sidhavahu|
    sadara janakasutahi lai avahu || turatahim sakala ge jaha~ sita| sevahim saba nisicarim binita ||
    begi bibhishana tinhahi sikhayo| tinha bahu bidhi majjana karavayo || bahu prakara bhushana pahirae|
    sibika rucira saji puni lyae || ta para harashi carhai baidehi| sumiri rama sukhadhama sanehi || betapani
    racchaka cahu~ pasa| cale sakala mana parama hulasa || dekhana bhalu kisa saba ae| racchaka ko'pi
    nivarana dhae || kaha raghubira kaha mama manahu| sitahi sakha payadem anahu || dekhahu~ kapi janani
    ki naim| bihasi kaha raghunatha gosai || suni prabhu bacana bhalu kapi harashe| nabha te suranha sumana
    bahu barashe || sita prathama anala mahu~ rakhi| pragata kinhi caha antara sakhi || do tehi karana
    karunanidhi kahe kachuka durbada| sunata jatudhanim saba lagim karai bishada || || prabhu ke bacana
    sisa dhari sita| boli mana krama bacana punita || lachimana hohu dharama ke negi| pavaka pragata karahu
    tumha begi || suni lachimana sita kai bani| biraha bibeka dharama niti sani || locana sajala jori
    kara dou| prabhu sana kachu kahi sakata na ou || dekhi rama rukha lachimana dhae| pavaka pragati katha
    bahu lae || pavaka prabala dekhi baidehi| hridaya~ harasha nahim bhaya kachu tehi || jaum mana baca
    krama mama ura mahim| taji raghubira ana gati nahim || tau krisanu saba kai gati jana| mo kahu~ hau
    shrikhanda samana || cham shrikhanda sama pavaka prabesa kiyo sumiri prabhu maithili| jaya kosalesa
    mahesa bandita carana rati ati nirmali || pratibimba aru laukika kalanka pracanda pavaka mahu~ jare|
    prabhu carita kahu~ na lakhe nabha sura siddha muni dekhahim khare || || dhari rupa pavaka pani gahi
    shri satya shruti jaga bidita jo| jimi chirasagara indira ramahi samarpi ani so || so rama bama bibhaga
    rajati rucira ati sobha bhali| nava nila niraja nikata manahu~ kanaka pankaja ki kali || barashahim
    sumana harashi suna bajahim gagana nisana| gavahim kinnara surabadhu nacahim carhaim bimana || ||
    janakasuta sameta prabhu sobha amita apara| dekhi bhalu kapi harashe jaya raghupati sukha sara ||
    || taba raghupati anusasana pai| matali caleu carana siru nai || ae deva sada svarathi| bacana kahahim
    janu paramarathi || dina bandhu dayala raghuraya| deva kinhi devanha para daya || bisva droha rata
    yaha khala kami| nija agha gayu kumaragagami || tumha samarupa brahma abinasi| sada ekarasa sahaja
    udasi || akala aguna aja anagha anamaya| ajita amoghasakti karunamaya || mina kamatha sukara narahari|
    bamana parasurama bapu dhari || jaba jaba natha suranha dukhu payo| nana tanu dhari tumhi~ nasayo
    || yaha khala malina sada suradrohi| kama lobha mada rata ati kohi || adhama siromani tava pada pava|
    yaha hamare mana bisamaya ava || hama devata parama adhikari| svaratha rata prabhu bhagati bisari
    || bhava prabaha~ santata hama pare| aba prabhu pahi sarana anusare || do kari binati sura siddha
    saba rahe jaha~ taha~ kara jori| ati saprema tana pulaki bidhi astuti karata bahori || jaya rama sada
    sukhadhama hare| raghunayaka sayaka capa dhare || bhava barana darana simha prabho| guna sagara nagara
    natha bibho || tana kama aneka anupa chabi| guna gavata siddha munindra kabi || jasu pavana ravana
    naga maha| khaganatha jatha kari kopa gaha || jana ranjana bhanjana soka bhayam| gatakrodha sada prabhu
    bodhamayam || avatara udara apara gunam| mahi bhara bibhanjana gyanaghanam || aja byapakamekamanadi
    sada| karunakara rama namami muda || raghubamsa bibhushana dushana ha| krita bhupa bibhishana dina
    raha || guna gyana nidhana amana ajam| nita rama namami bibhum birajam || bhujadanda pracanda pratapa
    balam| khala brinda nikanda maha kusalam || binu karana dina dayala hitam| chabi dhama namami rama
    sahitam || bhava tarana karana kaja param| mana sambhava daruna dosha haram || sara capa manohara
    trona dharam| jarajaruna locana bhupabaram || sukha mandira sundara shriramanam| mada mara mudha mamata
    samanam || anavadya akhanda na gocara go| sabarupa sada saba hoi na go || iti beda badanti na dantakatha|
    rabi atapa bhinnamabhinna jatha || kritakritya bibho saba banara e| nirakhanti tavanana sadara e ||
    dhiga jivana deva sarira hare| tava bhakti bina bhava bhuli pare || aba dina dayala daya kariai| mati
    mori bibhedakari hariai || jehi te biparita kriya kariai| dukha so sukha mani sukhi cariai || khala
    khandana mandana ramya chama| pada pankaja sevita sambhu uma || nripa nayaka de baradanamidam| caranambuja
    prema sada subhadam || do binaya kinhi caturanana prema pulaka ati gata| sobhasindhu bilokata locana
    nahim aghata || || tehi avasara dasaratha taha~ ae| tanaya biloki nayana jala chae || anuja sahita
    prabhu bandana kinha| asirabada pita~ taba dinha || tata sakala tava punya prabh | jityom ajaya nisacara
    r || suni suta bacana priti ati barhai| nayana salila romavali tharhai || raghupati prathama prema
    anumana| citi pitahi dinheu drirha gyana || tate uma moccha nahim payo| dasaratha bheda bhagati mana
    layo || sagunopasaka moccha na lehim| tinha kahu~ rama bhagati nija dehim || bara bara kari prabhuhi
    pranama| dasaratha harashi ge suradhama || do anuja janaki sahita prabhu kusala kosaladhisa| sobha
    dekhi harashi mana astuti kara sura isa || jaya rama sobha dhama| dayaka pranata bishrama || dhrita
    trona bara sara capa| bhujadanda prabala pratapa || || jaya dushanari kharari| mardana nisacara dhari
    || yaha dushta mareu natha| bhe deva sakala sanatha || || jaya harana dharani bhara| mahima udara
    apara || jaya ravanari kripala| kie jatudhana bihala || || lankesa ati bala garba| kie basya sura
    gandharba || muni siddha nara khaga naga| hathi pantha saba kem laga || || paradroha rata ati dushta|
    payo so phalu papishta || aba sunahu dina dayala| rajiva nayana bisala || || mohi raha ati abhimana|
    nahim kau mohi samana || aba dekhi prabhu pada kanja| gata mana prada dukha punja || || kau brahma
    nirguna dhyava| abyakta jehi shruti gava || mohi bhava kosala bhupa| shrirama saguna sarupa || ||
    baidehi anuja sameta| mama hridaya~ karahu niketa || mohi janie nija dasa| de bhakti ramanivasa ||
    || de bhakti ramanivasa trasa harana sarana sukhadayakam| sukha dhama rama namami kama aneka chabi
    raghunayakam || sura brinda ranjana dvanda bhanjana manuja tanu atulitabalam| brahmadi sankara sebya
    rama namami karuna komalam || do aba kari kripa biloki mohi ayasu dehu kripala| kaha karaum suni priya
    bacana bole dinadayala || || sunu surapati kapi bhalu hamare| pare bhumi nisacaranhi je mare || mama
    hita lagi taje inha prana| sakala jiau suresa sujana || sunu khagesa prabhu kai yaha bani| ati agadha
    janahim muni gyani || prabhu saka tribhuana mari jiai| kevala sakrahi dinhi baraai || sudha barashi
    kapi bhalu jiae| harashi uthe saba prabhu pahim ae || sudhabrishti bhai duhu dala upara| jie bhalu
    kapi nahim rajanicara || ramakara bhe tinha ke mana| mukta bhe chute bhava bandhana || sura amsika
    saba kapi aru richa| jie sakala raghupati kim icha || rama sarisa ko dina hitakari| kinhe mukuta nisacara
    jhari || khala mala dhama kama rata ravana| gati pai jo munibara pava na || do sumana barashi saba
    sura cale carhai carhai rucira bimana| dekhi suavasaru prabhu pahim ayu sambhu sujana || || parama
    priti kara jori juga nalina nayana bhari bari| pulakita tana gadagada gira~ binaya karata tripurari
    || mamabhirakshaya raghukula nayaka| dhrita bara capa rucira kara sayaka || moha maha ghana patala
    prabhanjana| samsaya bipina anala sura ranjana || || aguna saguna guna mandira sundara| bhrama tama
    prabala pratapa divakara || kama krodha mada gaja pancanana| basahu nirantara jana mana kanana ||
    || bishaya manoratha punja kanja bana| prabala tushara udara para mana || bhava baridhi mandara paramam
    dara| baraya taraya samsriti dustara || || syama gata rajiva bilocana| dina bandhu pranatarati mocana
    || anuja janaki sahita nirantara| basahu rama nripa mama ura antara || || muni ranjana mahi mandala
    mandana| tulasidasa prabhu trasa bikhandana || natha jabahim kosalapurim hoihi tilaka tumhara| kripasindhu
    maim auba dekhana carita udara || || kari binati jaba sambhu sidhae| taba prabhu nikata bibhishanu
    ae || nai carana siru kaha mridu bani| binaya sunahu prabhu sara~gapani || sakula sadala prabhu ravana
    mar yo| pavana jasa tribhuvana bistar yo || dina malina hina mati jati| mo para kripa kinhi bahu bha~ti
    || aba jana griha punita prabhu kije| majjanu karia samara shrama chije || dekhi kosa mandira sampada|
    dehu kripala kapinha kahu~ muda || saba bidhi natha mohi apanaia| puni mohi sahita avadhapura jaia
    || sunata bacana mridu dinadayala| sajala bhe dvau nayana bisala || do tora kosa griha mora saba satya
    bacana sunu bhrata| bharata dasa sumirata mohi nimisha kalpa sama jata || || tapasa besha gata krisa
    japata nirantara mohi| dekhaum begi so jatanu karu sakha nihoru~ tohi || || bitem avadhi jau~ jaum
    jiata na pavu~ bira| sumirata anuja priti prabhu puni puni pulaka sarira || || karehu kalpa bhari
    raju tumha mohi sumirehu mana mahim| puni mama dhama paihahu jaha~ santa saba jahim || || sunata bibhishana
    bacana rama ke| harashi gahe pada kripadhama ke || banara bhalu sakala harashane| gahi prabhu pada
    guna bimala bakhane || bahuri bibhishana bhavana sidhayo| mani gana basana bimana bharayo || lai pushpaka
    prabhu agem rakha| ha~si kari kripasindhu taba bhasha || carhai bimana sunu sakha bibhishana| gagana
    jai barashahu pata bhushana || nabha para jai bibhishana tabahi| barashi die mani ambara sabahi ||
    joi joi mana bhavi soi lehim| mani mukha meli dari kapi dehim || ha~se ramu shri anuja sameta| parama
    kautuki kripa niketa || do muni jehi dhyana na pavahim neti neti kaha beda| kripasindhu soi kapinha
    sana karata aneka binoda || || uma joga japa dana tapa nana makha brata nema| rama kripa nahi karahim
    tasi jasi nishkevala prema || || bhalu kapinha pata bhushana pae| pahiri pahiri raghupati pahim ae
    || nana jinasa dekhi saba kisa| puni puni ha~sata kosaladhisa || citi sabanhi para kinhi daya| bole
    mridula bacana raghuraya || tumharem bala maim ravanu mar yo| tilaka bibhishana kaha~ puni sar yo
    || nija nija griha aba tumha saba jahu| sumirehu mohi darapahu jani kahu || sunata bacana premakula
    banara| jori pani bole saba sadara || prabhu joi kahahu tumhahi saba soha| hamare hota bacana suni
    moha || dina jani kapi kie sanatha| tumha treloka isa raghunatha || suni prabhu bacana laja hama marahim|
    masaka kahu~ khagapati hita karahim || dekhi rama rukha banara richa| prema magana nahim griha kai
    icha || do prabhu prerita kapi bhalu saba rama rupa ura rakhi| harasha bishada sahita cale binaya
    bibidha bidhi bhashi || || kapipati nila richapati angada nala hanumana| sahita bibhishana apara je
    juthapa kapi balavana || kahi na sakahim kachu prema basa bhari bhari locana bari| sanmukha citavahim
    rama tana nayana nimesha nivari || || ' atisaya priti dekha raghurai| linhe sakala bimana carhaai
    || mana mahu~ bipra carana siru nayo| uttara disihi bimana calayo || calata bimana kolahala hoi| jaya
    raghubira kahi sabu koi || simhasana ati ucca manohara| shri sameta prabhu baithai ta para || rajata
    ramu sahita bhamini| meru sringa janu ghana damini || rucira bimanu caleu ati atura| kinhi sumana
    brishti harashe sura || parama sukhada cali tribidha bayari| sagara sara sari nirmala bari || saguna
    hohim sundara cahu~ pasa| mana prasanna nirmala nabha asa || kaha raghubira dekhu rana sita| lachimana
    iha~ hatyo i~drajita || hanumana angada ke mare| rana mahi pare nisacara bhare || kumbhakarana ravana
    dvau bhai| iha~ hate sura muni dukhadai || do iha~ setu ba~dhyo aru thapeu~ siva sukha dhama| sita
    sahita kripanidhi sambhuhi kinha pranama || || jaha~ jaha~ kripasindhu bana kinha basa bishrama| sakala
    dekhae janakihi kahe sabanhi ke nama || || turata bimana taha~ cali ava| dandaka bana jaha~ parama
    suhava || kumbhajadi muninayaka nana| ge ramu saba kem asthana || sakala rishinha sana pai asisa|
    citrakuta ae jagadisa || taha~ kari muninha kera santosha| cala bimanu taha~ te cokha || bahuri rama
    janakihi dekhai| jamuna kali mala harani suhai || puni dekhi surasari punita| rama kaha pranama karu
    sita || tirathapati puni dekhu prayaga| nirakhata janma koti agha bhaga || dekhu parama pavani puni
    beni| harani soka hari loka niseni || puni dekhu avadhapuri ati pavani| tribidha tapa bhava roga nasavani
    || | do sita sahita avadha kahu~ kinha kripala pranama| sajala nayana tana pulakita puni puni harashita
    rama || || puni prabhu ai tribenim harashita majjanu kinha| kapinha sahita bipranha kahu~ dana bibidha
    bidhi dinha || || prabhu hanumantahi kaha bujhai| dhari batu rupa avadhapura jai || bharatahi kusala
    hamari sunaehu| samacara lai tumha cali aehu || turata pavanasuta gavanata bhayu| taba prabhu bharadvaja
    pahim gayu || nana bidhi muni puja kinhi| astuti kari puni asisha dinhi || muni pada bandi jugala
    kara jori| carhai bimana prabhu cale bahori || iha~ nishada suna prabhu ae| nava nava kaha~ loga bolae
    || surasari naghi jana taba ayo| utareu tata prabhu ayasu payo || taba sita~ puji surasari| bahu prakara
    puni carananhi pari || dinhi asisa harashi mana ganga| sundari tava ahivata abhanga || sunata guha
    dhayu premakula| ayu nikata parama sukha sankula || prabhuhi sahita biloki baidehi| pareu avani tana
    sudhi nahim tehi || priti parama biloki raghurai| harashi uthai liyo ura lai || cham liyo hridaya~
    lai kripa nidhana sujana raya~ ramapati| baithari parama samipa bujhi kusala so kara binati| aba kusala
    pada pankaja biloki biranci sankara sebya je| sukha dhama puranakama rama namami rama namami te ||
    || saba bha~ti adhama nishada so hari bharata jyom ura laiyo| matimanda tulasidasa so prabhu moha
    basa bisaraiyo || yaha ravanari caritra pavana rama pada ratiprada sada| kamadihara bigyanakara sura
    siddha muni gavahim muda || samara bijaya raghubira ke carita je sunahim sujana| bijaya bibeka bibhuti
    nita tinhahi dehim bhagavana || || yaha kalikala malayatana mana kari dekhu bicara| shriraghunatha
    nama taji nahina ana adhara || sattaisava~ vishrama iti shrimadramacaritamanase sakalakalikalushavidhvamsane
    shashthah sopanah samaptah|
  devanagari: श्री गणेशाय नमः श्री जानकीवल्लभो विजयते श्री रामचरितमानस षष्ठ सोपान रामं कामारिसेव्यं भवभयहरणं
    कालमत्तेभसिंहं योगीन्द्रं ज्ञानगम्यं गुणनिधिमजितं निर्गुणं निर्विकारम्। मायातीतं सुरेशं खलवधनिरतं
    ब्रह्मवृन्दैकदेवं वन्दे कन्दावदातं सरसिजनयनं देवमुर्वीशरूपम् ॥ ॥ शङ्खेन्द्वाभमतीवसुन्दरतनुं शार्दूलचर्माम्बरं
    कालव्यालकरालभूषणधरं गङ्गाशशाङ्कप्रियम्। काशीशं कलिकल्मषौघशमनं कल्याणकल्पद्रुमं नौमीड्यं गिरिजापतिं
    गुणनिधिं कन्दर्पहं शङ्करम् ॥ ॥ यो ददाति सतां शम्भुः कैवल्यमपि दुर्लभम्। खलानां दण्डकृद्योऽसौ शङ्करः
    शं तनोतु मे ॥ लव निमेष परमानु जुग बरष कलप सर चण्ड। भजसि न मन तेहि राम को कालु जासु कोदण्ड ॥ सो सिन्धु
    बचन सुनि राम सचिव बोलि प्रभु अस कहेउ। अब बिलम्बु केहि काम करहु सेतु उतरै कटकु ॥ सुनहु भानुकुल केतु
    जामवन्त कर जोरि कह। नाथ नाम तव सेतु नर चढ़इ भव सागर तरिहिम् ॥ यह लघु जलधि तरत कति बारा। अस सुनि पुनि
    कह पवनकुमारा ॥ प्रभु प्रताप बड़वानल भारी। सोषेउ प्रथम पयोनिधि बारी ॥ तब रिपु नारी रुदन जल धारा। भरेउ
    बहोरि भयु तेहिं खारा ॥ सुनि अति उकुति पवनसुत केरी। हरषे कपि रघुपति तन हेरी ॥ जामवन्त बोले दौ भाई।
    नल नीलहि सब कथा सुनाई ॥ राम प्रताप सुमिरि मन माहीं। करहु सेतु प्रयास कछु नाहीम् ॥ बोलि लिए कपि निकर
    बहोरी। सकल सुनहु बिनती कछु मोरी ॥ राम चरन पङ्कज उर धरहू। कौतुक एक भालु कपि करहू ॥ धावहु मर्कट बिकट
    बरूथा। आनहु बिटप गिरिन्ह के जूथा ॥ सुनि कपि भालु चले करि हूहा। जय रघुबीर प्रताप समूहा ॥ दो अति उतङ्ग
    गिरि पादप लीलहिं लेहिं उठाइ। आनि देहिं नल नीलहि रचहिं ते सेतु बनाइ ॥ ॥ सैल बिसाल आनि कपि देहीं। कन्दुक
    इव नल नील ते लेहीम् ॥ देखि सेतु अति सुन्दर रचना। बिहसि कृपानिधि बोले बचना ॥ परम रम्य उत्तम यह धरनी।
    महिमा अमित जाइ नहिं बरनी ॥ करिहुँ इहाँ सम्भु थापना। मोरे हृदयँ परम कलपना ॥ सुनि कपीस बहु दूत पठाए।
    मुनिबर सकल बोलि लै आए ॥ लिङ्ग थापि बिधिवत करि पूजा। सिव समान प्रिय मोहि न दूजा ॥ सिव द्रोही मम भगत
    कहावा। सो नर सपनेहुँ मोहि न पावा ॥ सङ्कर बिमुख भगति चह मोरी। सो नारकी मूढ़ मति थोरी ॥ दो सङ्कर प्रिय
    मम द्रोही सिव द्रोही मम दास। ते नर करहि कलप भरि धोर नरक महुँ बास ॥ ॥ जे रामेस्वर दरसनु करिहहिं। ते
    तनु तजि मम लोक सिधरिहहिम् ॥ जो गङ्गाजलु आनि चढ़आइहि। सो साजुज्य मुक्ति नर पाइहि ॥ होइ अकाम जो छल तजि
    सेइहि। भगति मोरि तेहि सङ्कर देइहि ॥ मम कृत सेतु जो दरसनु करिही। सो बिनु श्रम भवसागर तरिही ॥ राम बचन
    सब के जिय भाए। मुनिबर निज निज आश्रम आए ॥ गिरिजा रघुपति कै यह रीती। सन्तत करहिं प्रनत पर प्रीती ॥ बाँधा
    सेतु नील नल नागर। राम कृपाँ जसु भयु उजागर ॥ बूड़हिं आनहि बोरहिं जेई। भे उपल बोहित सम तेई ॥ महिमा यह
    न जलधि कि बरनी। पाहन गुन न कपिन्ह कि करनी ॥ दो श्री रघुबीर प्रताप ते सिन्धु तरे पाषान। ते मतिमन्द
    जे राम तजि भजहिं जाइ प्रभु आन ॥ ॥ बाँधि सेतु अति सुदृढ़ बनावा। देखि कृपानिधि के मन भावा ॥ चली सेन
    कछु बरनि न जाई। गर्जहिं मर्कट भट समुदाई ॥ सेतुबन्ध ढिग चढ़इ रघुराई। चितव कृपाल सिन्धु बहुताई ॥ देखन
    कहुँ प्रभु करुना कन्दा। प्रगट भे सब जलचर बृन्दा ॥ मकर नक्र नाना झष ब्याला। सत जोजन तन परम बिसाला ॥
    ऐसेउ एक तिन्हहि जे खाहीं। एकन्ह कें डर तेपि डेराहीम् ॥ प्रभुहि बिलोकहिं टरहिं न टारे। मन हरषित सब
    भे सुखारे ॥ तिन्ह की ओट न देखिअ बारी। मगन भे हरि रूप निहारी ॥ चला कटकु प्रभु आयसु पाई। को कहि सक कपि
    दल बिपुलाई ॥ दो सेतुबन्ध भि भीर अति कपि नभ पन्थ उड़आहिं। अपर जलचरन्हि ऊपर चढ़इ चढ़इ पारहि जाहिम् ॥
    ॥ अस कौतुक बिलोकि द्वौ भाई। बिहँसि चले कृपाल रघुराई ॥ सेन सहित उतरे रघुबीरा। कहि न जाइ कपि जूथप भीरा
    ॥ सिन्धु पार प्रभु डेरा कीन्हा। सकल कपिन्ह कहुँ आयसु दीन्हा ॥ खाहु जाइ फल मूल सुहाए। सुनत भालु कपि
    जहँ तहँ धाए ॥ सब तरु फरे राम हित लागी। रितु अरु कुरितु काल गति त्यागी ॥ खाहिं मधुर फल बटप हलावहिं।
    लङ्का सन्मुख सिखर चलावहिम् ॥ जहँ कहुँ फिरत निसाचर पावहिं। घेरि सकल बहु नाच नचावहिम् ॥ दसनन्हि काटि
    नासिका काना। कहि प्रभु सुजसु देहिं तब जाना ॥ जिन्ह कर नासा कान निपाता। तिन्ह रावनहि कही सब बाता ॥
    सुनत श्रवन बारिधि बन्धाना। दस मुख बोलि उठा अकुलाना ॥ दो बान्ध्यो बननिधि नीरनिधि जलधि सिन्धु बारीस।
    सत्य तोयनिधि कम्पति उदधि पयोधि नदीस ॥ ॥ निज बिकलता बिचारि बहोरी। बिहँसि गयु ग्रह करि भय भोरी ॥ मन्दोदरीं
    सुन्यो प्रभु आयो। कौतुकहीं पाथोधि बँधायो ॥ कर गहि पतिहि भवन निज आनी। बोली परम मनोहर बानी ॥ चरन नाइ
    सिरु अञ्चलु रोपा। सुनहु बचन पिय परिहरि कोपा ॥ नाथ बयरु कीजे ताही सों। बुधि बल सकिअ जीति जाही सोम्
    ॥ तुम्हहि रघुपतिहि अन्तर कैसा। खलु खद्योत दिनकरहि जैसा ॥ अतिबल मधु कैटभ जेहिं मारे। महाबीर दितिसुत
    सङ्घारे ॥ जेहिं बलि बाँधि सहजभुज मारा। सोइ अवतरेउ हरन महि भारा ॥ तासु बिरोध न कीजिअ नाथा। काल करम
    जिव जाकें हाथा ॥ दो रामहि सौपि जानकी नाइ कमल पद माथ। सुत कहुँ राज समर्पि बन जाइ भजिअ रघुनाथ ॥ ॥ नाथ
    दीनदयाल रघुराई। बाघु सनमुख गेँ न खाई ॥ चाहिअ करन सो सब करि बीते। तुम्ह सुर असुर चराचर जीते ॥ सन्त
    कहहिं असि नीति दसानन। चौथेम्पन जाइहि नृप कानन ॥ तासु भजन कीजिअ तहँ भर्ता। जो कर्ता पालक संहर्ता ॥
    सोइ रघुवीर प्रनत अनुरागी। भजहु नाथ ममता सब त्यागी ॥ मुनिबर जतनु करहिं जेहि लागी। भूप राजु तजि होहिं
    बिरागी ॥ सोइ कोसलधीस रघुराया। आयु करन तोहि पर दाया ॥ जौं पिय मानहु मोर सिखावन। सुजसु होइ तिहुँ पुर
    अति पावन ॥ दो अस कहि नयन नीर भरि गहि पद कम्पित गात। नाथ भजहु रघुनाथहि अचल होइ अहिवात ॥ ॥ तब रावन मयसुता
