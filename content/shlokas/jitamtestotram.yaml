id: jitamtestotram
category: stotram
name:
  english: jitamtestotram
  devanagari: जितम्तेस्तोत्रम्
content:
  english: rinu tvam purushottama | naranarayanabhyam ca shvetadvipanivasibhih || 2|| naradadyairmuniganaih
    sanakadyaishca yogibhih | brahmeshadyaissuraganaih pancakalaparayanaih || 3|| pujyase pundarikaksha
    divyamantrairmaharshibhih | pashandadharmasankirne bhagavadbhaktivarjite || 4|| kalau jato'smi devesha
    sarvadharmabahishkrite | katham tvamasamacarah papaprasavabhuraham || 5|| arcayami dayasindho pahi
    mam sharanagatam | tapatrayadavagnau mam dahyamanam sada vibho || 6|| trahi mam pundarikaksha kevalam
    kripaya tava | janmamrityujaravyadhiduhkhasantaptadehinam || 7|| palayashu drisha deva tava karunyagarbhaya
    | indriyani maya jetumashakyam purushottama || 8|| shariram mama devesha vyadhibhih paripiditam |
    mano me pundarikaksha vishayan eva dhavati || 9|| vani mama hrishikesha mithyaparushyadushita | evam
    sadhanahino'ham kim karishyami keshava || 10|| raksha mam kripaya krishna bhavabdhau patitam sada
    | aparadhashatam caiva sahasramayutam tatha | arbudam capyasankhyeyam karunabdhe kshamasva me || 11||
    yac caparadham kritavan ajnanatpurushottama | madbhakta iti devesha tatsarvam kshantumarhasi || 12||
    ajnatvadapyashaktatvadalasyaddushtabhavanat | kritaparadham kripanam kshantumarhasi mam vibho || 13||
    aparadhasahasrani kriyante'harnisham maya | tani sarvani me deva kshamasva madhusudana || 14|| yajjanmanah
    prabhriti mohavashangatena nanaparadhashatamacaritam maya te | antarbahishca sakalam tava pashyato
    me kshantum tvamarhasi hare karunavashena || 15|| karmana manasa vaca ya ceshta mama nityashah | keshavaradhane
    sa syajjanmajanmantareshvapi || 16|| caturtham jitantestotram jitante pundarikaksha namaste vishvabhavana
    | namaste vasudevaya shantanantacidatmane || 1|| adhyakshaya svatantraya nirapekshaya shasate | acyutayavikaraya
    tejasam nidhaye namah || 2|| pradhanapurusheshaya namaste purushottama | kleshakarmadyasamsprishta
    purnashadgunyamurtaye || 3|| tribhirjnanabalaishvaryaviryashaktyantaratmane | triyugaya namaste'stu
    namaste caturatmane || 4|| catuhpancanavavyuha dashadvadashamurtaye | anekamurtaye tubhyamamurtayaikamurtaye
    || 5|| narayana namaste'stu pundarikayatekshana | subhrulalata sunasa susmitadharapallava || 6|| pinavrittayatabhuja
    shrivatsakritalakshana | tanumadhya vishalaksha padmanabha namo'stu te || 7|| vilasavikramakrantatrailokyacaranambuja
    | namaste pitavasana sphuranmakarakundala || 8|| sphuratkiritakeyura harakaustubhabhushana | pancayudha
    namaste'stu namaste pancakalika || 9|| pancakalaparaikantiyogakshemamahaprabho | nityajnanabalaishvaryabhogopakaranacyuta
    || 10|| namaste brahmarudradilokayatraparicchada | janmaprabhriti daso'smi shishyo'smi tanayo'smi
    te || 11|| tvam ca svami gururmata pita ca mama madhava | api tvam bhagavan brahma sharvashshakro
    maharshayah | drashtum yashtumapi stotum na hi smartumapishate || 12|| tapatrayamahagrahabhishane
    bhavasagare | majjatam natha nauresha pranatistvatpadarpita || 13|| anathaya jagannatha sharanya sharanarthine
    | prasida sidate mahyam namaste bhaktavatsala || 14|| mantrahinam kriyahinam bhaktihinam yadarcanam
    | tatkshantavyam prapannanamaparadhasaho hyasi || 15|| ajnanadyadi va jnanadashubham yatkritam maya
    | kshantavyam tadasheshena dasyena ca grihana mam || 16|| sarveshu deshakaleshu sarvavasthasu cacyuta
    | kinkaro'smi hrishikesha bhuyo bhuyo'smi kinkarah || 17|| pancamam jitantestotram jitante pundarikaksha
    namaste vishvabhavana | namaste'stu hrishikesha mahapurusha purvaja || 1|| namaste vasudevaya shantanantacidatmane
    | ajitaya namastubhyam shadgunyanidhaye namah || 2|| mahavibhutisamsthaya namaste purushottama | sahasrashirase
    tubhyam sahasracaranaya te || 3|| sahasrabahave tubhyam sahasranayanaya te | amurtaya namastubhyamekamurtaya
    te namah || 4|| anekamurtaye tubhyamaksharaya ca te namah | vyapine vedavedyaya namaste paramatmane
    || 5|| cinmatrarupine tubhyam namastrayyantamurtaye | anishthaya sthavishthaya mahishthaya ca te namah
    || 6|| nedishthaya yavishthaya sarvantaryamine namah | varshishthaya japishthaya kanishthaya ca te
    namah || 7|| pancatmane namastubhyam sarvantaryamine namah | kalpana'podharupaya srishtisthityantahetave
    || 8|| namaste gunarupaya gunarupativartine | vyastaya ca samastaya samastavyastarupine || 9|| adimadhyantashunyaya
    tattvasthaya namo namah | pranavapratipadyaya namah pranavarupine || 10|| lokayatraprasiddhyartham
    srishtabrahmadirupine | namastubhyam nrisimhadimurtibhedaya vishnave || 11|| vipakaih karmabhih kshobhairasprishtavapushe
    namah | namo brahmanyadevaya tejasam nidhaye namah || 12|| nityasadharananekalokarakshaparicchide
    | saccidanandarupaya varenyaya namo namah || 13|| yajamanaya yajnaya yashtavyaya namo namah | ijyaphalatmane
    tubhyam nama ijyadishiline || 14|| namah paramahamsaya namassattvagunaya ca | sthitaya paramavyomni
    bhuyo bhuyo namo namah || 15|| samsare vishayavartasankule ca mahabhaye | aparadustare'gadhe patitam
    karmabhissvakaih || 16|| anathamagatim bhirum dayaya paraya hare | mamuttara dayasindho sindhurasmatsudustarat
    || 17|| mantrahinam kriyahinam bhaktihinam yadarcanam tatsarvam kshamyatam deva dinam mamatmasatkuru
    || 18|| aham hitam na janami tvam vrajamyeva kevalam | budhvaivam naya govinda muktyupayena vartmana
    || 19|| tvameva vetsi shreyo me nedametadititi ca | buddhiyogam ca me dehi yena tvamupayamyaham ||
    20|| shashthamam jitantestotram jitante pundarikaksha namaste vishvabhavana | namaste'stu hrishikesha
    mahapurusha purvaja || 1|| shrimaddvaravatinatha vardhatam vijayi bhavan | divyam tvadiyamaishvaryam
    nirmaryadavijrimbhitam || 2|| devibhushayudhairnityairmuktairmokshaikalakshanaih | sattvottaraistvadiyaishca
    sangasthabhirasastava || 3|| prakaragopuravaraprasadamanimandapah | shalimudgatiladinam shalashailakulojjvala
    || 4|| ratnakancanakausheyakshaumakramukashalikah | shayyagrihani paryankavaryassthulasanani ca ||
    5|| kanatkanakabhringarapatadgrahakalacikah | chatracamaramukhyashca santu nityah paricchadah || 6||
    astu nistulamavyagram nityamabhyarcanam tava | pakshe pakshe vijrimbhantam masi masi mahotsavah ||
    7|| manikancanacitrani bhushananyambarani ca | kashmirasarakasturi karpuradyanulepanam || 8|| komalani
    ca damani kausumaissaurabhodgamaih | dhupah karpuradipashca santu nityah paricchadah || 9|| nrittagitayutam
    vadyam nityamatra vivardhatam | shrotreshu nassudhadharah kalpantam kahalasvanah || 10|| kandamulaphalodagram
    kale kale caturvidham | supapupaghritakshirasharkarasahitam havih || 11|| ghanasarashirodagram kramukashtadalanvitam
    | vimalani ca tambuladalani svikuru prabho || 12|| pritibhitiyuto bhuyannityam parijanastava | bhaktimantopabhunjantu
    paurajanapadaissaha || 13|| dharanidhanaratnani vitarantu ciram tava | kainkaryamakhilam sarve kurvantu
    kshonipalakah || 14|| premadigdhadrisham smeram prekshamanastvadananam | mahantassantatam santo mangalani
    prayunjatam | papamevamavannityam palayan kushali bhavan || 15|| iti shri jitantestotram sampurnam
    |
  devanagari: ृणु त्वं पुरुषोत्तम । नरनारायणाभ्यां च श्वेतद्वीपनिवासिभिः ॥ २॥ नारदाद्यैर्मुनिगणैः सनकाद्यैश्च
    योगिभिः । ब्रह्मेशाद्यैस्सुरगणैः पञ्चकालपरायणैः ॥ ३॥ पूज्यसे पुण्डरीकाक्ष दिव्यमन्त्रैर्महर्षिभिः
    । पाषण्डधर्मसङ्कीर्णे भगवद्भक्तिवर्जिते ॥ ४॥ कलौ जातोऽस्मि देवेश सर्वधर्मबहिष्कृते । कथं त्वामसमाचारः
    पापप्रसवभूरहम् ॥ ५॥ अर्चयामि दयासिन्धो पाहि मां शरणागतम् । तापत्रयदवाग्नौ मां दह्यमानं सदा विभो ॥
    ६॥ त्राहि मां पुण्डरीकाक्ष केवलं कृपया तव । जन्ममृत्युजराव्याधिदुःखसन्तप्तदेहिनम् ॥ ७॥ पालयाशु दृशा
    देव तव कारुण्यगर्भया । इन्द्रियाणि मया जेतुमशक्यं पुरुषोत्तम ॥ ८॥ शरीरं मम देवेश व्याधिभिः परिपीडितम्
    । मनो मे पुण्डरीकाक्ष विषयान् एव धावति ॥ ९॥ वाणी मम हृषीकेश मिथ्यापारुष्यदूषिता । एवं साधनहीनोऽहं
    किं करिष्यामि केशव ॥ १०॥ रक्ष मां कृपया कृष्ण भवाब्धौ पतितं सदा । अपराधशतं चैव सहस्रमयुतं तथा । अर्बुदं
    चाप्यसङ्ख्येयं करुणाब्धे क्षमस्व मे ॥ ११॥ यच् चापराधं कृतवान् अज्ञानात्पुरुषोत्तम । मद्भक्त इति देवेश
    तत्सर्वं क्षन्तुमर्हसि ॥ १२॥ अज्ञत्वादप्यशक्तत्वादालस्याद्दुष्टभावनात् । कृतापराधं कृपणं क्षन्तुमर्हसि
    मां विभो ॥ १३॥ अपराधसहस्राणि क्रियन्तेऽहर्निशं मया । तानि सर्वाणि मे देव क्षमस्व मधुसूदन ॥ १४॥ यज्जन्मनः
    प्रभृति मोहवशङ्गतेन नानापराधशतमाचरितं मया ते । अन्तर्बहिश्च सकलं तव पश्यतो मे क्षन्तुं त्वमर्हसि हरे
    करुणावशेन ॥ १५॥ कर्मणा मनसा वाचा या चेष्टा मम नित्यशः । केशवाराधने सा स्याज्जन्मजन्मान्तरेष्वपि ॥
    १६॥ चतुर्थं जितन्तेस्तोत्रम् जितन्ते पुण्डरीकाक्ष नमस्ते विश्वभावन । नमस्ते वासुदेवाय शान्तानन्तचिदात्मने
    ॥ १॥ अध्यक्षाय स्वतन्त्राय निरपेक्षाय शासते । अच्युतायाविकाराय तेजसां निधये नमः ॥ २॥ प्रधानपुरुषेशाय
    नमस्ते पुरुषोत्तम । क्लेशकर्माद्यसंस्पृष्ट पूर्णषाड्गुण्यमूर्तये ॥ ३॥ त्रिभिर्ज्ञानबलैश्वर्यवीर्यशक्त्यन्तरात्मने
    । त्रियुगाय नमस्तेऽस्तु नमस्ते चतुरात्मने ॥ ४॥ चतुःपञ्चनवव्यूह दशद्वादशमूर्तये । अनेकमूर्तये तुभ्यममूर्तायैकमूर्तये
    ॥ ५॥ नारायण नमस्तेऽस्तु पुण्डरीकायतेक्षण । सुभ्रूललाट सुनस सुस्मिताधरपल्लव ॥ ६॥ पीनवृत्तायतभुज श्रीवत्सकृतलक्षण
    । तनुमध्य विशालाक्ष पद्मनाभ नमोऽस्तु ते ॥ ७॥ विलासविक्रमाक्रान्तत्रैलोक्यचरणाम्बुज । नमस्ते पीतवसन
    स्फुरन्मकरकुण्डल ॥ ८॥ स्फुरत्किरीटकेयूर हारकौस्तुभभूषण । पञ्चायुध नमस्तेऽस्तु नमस्ते पाञ्चकालिक ॥
    ९॥ पञ्चकालपरैकान्तियोगक्षेममहाप्रभो । नित्यज्ञानबलैश्वर्यभोगोपकरणाच्युत ॥ १०॥ नमस्ते ब्रह्मरुद्रादिलोकयात्रापरिच्छद
    । जन्मप्रभृति दासोऽस्मि शिष्योऽस्मि तनयोऽस्मि ते ॥ ११॥ त्वं च स्वामी गुरुर्माता पिता च मम माधव । अपि
    त्वां भगवन् ब्रह्मा शर्वश्शक्रो महर्षयः । द्रष्टुं यष्टुमपि स्तोतुं न हि स्मर्तुमपीशते ॥ १२॥ तापत्रयमहाग्राहभीषणे
    भवसागरे । मज्जतां नाथ नौरेषा प्रणतिस्त्वत्पदार्पिता ॥ १३॥ अनाथाय जगन्नाथ शरण्य शरणार्थिने । प्रसीद
    सीदते मह्यं नमस्ते भक्तवत्सल ॥ १४॥ मन्त्रहीनं क्रियाहीनं भक्तिहीनं यदर्चनम् । तत्क्षन्तव्यं प्रपन्नानामपराधसहो
    ह्यसि ॥ १५॥ अज्ञानाद्यदि वा ज्ञानादशुभं यत्कृतं मया । क्षन्तव्यं तदशेषेण दास्येन च गृहाण माम् ॥ १६॥
    सर्वेषु देशकालेषु सर्वावस्थासु चाच्युत । किङ्करोऽस्मि हृषीकेश भूयो भूयोऽस्मि किङ्करः ॥ १७॥ पञ्चमं
    जितन्तेस्तोत्रम् जितन्ते पुण्डरीकाक्ष नमस्ते विश्वभावन । नमस्तेऽस्तु हृषीकेश महापुरुष पूर्वज ॥ १॥
    नमस्ते वासुदेवाय शान्तानन्तचिदात्मने । अजिताय नमस्तुभ्यं षाड्गुण्यनिधये नमः ॥ २॥ महाविभूतिसंस्थाय
    नमस्ते पुरुषोत्तम । सहस्रशिरसे तुभ्यं सहस्रचरणाय ते ॥ ३॥ सहस्रबाहवे तुभ्यं सहस्रनयनाय ते । अमूर्ताय
    नमस्तुभ्यमेकमूर्ताय ते नमः ॥ ४॥ अनेकमूर्तये तुभ्यमक्षराय च ते नमः । व्यापिने वेदवेद्याय नमस्ते परमात्मने
    ॥ ५॥ चिन्मात्ररूपिणे तुभ्यं नमस्त्रय्यन्तमूर्तये । अणिष्ठाय स्थविष्ठाय महिष्ठाय च ते नमः ॥ ६॥ नेदिष्ठाय
    यविष्ठाय सर्वान्तर्यामिणे नमः । वर्षिष्ठाय जपिष्ठाय कनिष्ठाय च ते नमः ॥ ७॥ पञ्चात्मने नमस्तुभ्यं सर्वान्तर्यामिणे
    नमः । कल्पनाऽपोढरूपाय सृष्टिस्थित्यन्तहेतवे ॥ ८॥ नमस्ते गुणरूपाय गुणरूपातिवर्तिने । व्यस्ताय च समस्ताय
    समस्तव्यस्तरूपिणे ॥ ९॥ आदिमध्यान्तशून्याय तत्त्वस्थाय नमो नमः । प्रणवप्रतिपाद्याय नमः प्रणवरूपिणे
    ॥ १०॥ लोकयात्राप्रसिद्ध्यर्थं सृष्टब्रह्मादिरूपिणे । नमस्तुभ्यं नृसिंहादिमूर्तिभेदाय विष्णवे ॥ ११॥
    विपाकैः कर्मभिः क्षोभैरस्पृष्टवपुषे नमः । नमो ब्रह्मण्यदेवाय तेजसां निधये नमः ॥ १२॥ नित्यसाधारणानेकलोकरक्षापरिच्छिदे
    । सच्चिदानन्दरूपाय वरेण्याय नमो नमः ॥ १३॥ यजमानाय यज्ञाय यष्टव्याय नमो नमः । इज्याफलात्मने तुभ्यं
    नम इज्यादिशीलिने ॥ १४॥ नमः परमहंसाय नमस्सत्त्वगुणाय च । स्थिताय परमव्योम्नि भूयो भूयो नमो नमः ॥ १५॥
    संसारे विषयावर्तसङ्कुले च महाभये । अपारदुस्तरेऽगाधे पतितं कर्मभिस्स्वकैः ॥ १६॥ अनाथमगतिं भीरुं दयया
    परया हरे । मामुत्तर दयासिन्धो सिन्धुरस्मात्सुदुस्तरात् ॥ १७॥ मन्त्रहीनं क्रियाहीनं भक्तिहीनं यदर्चनं
    तत्सर्वं क्षम्यतां देव दीनं मामात्मसात्कुरु ॥ १८॥ अहं हितं न जानामि त्वां व्रजाम्येव केवलम् । बुध्वैवं
    नय गोविन्द मुक्त्युपायेन वर्त्मना ॥ १९॥ त्वमेव वेत्सि श्रेयो मे नेदमेतदितीति च । बुद्धियोगं च मे देहि
    येन त्वामुपयाम्यहम् ॥ २०॥ षष्ठमं जितन्तेस्तोत्रम् जितन्ते पुण्डरीकाक्ष नमस्ते विश्वभावन । नमस्तेऽस्तु
    हृषीकेश महापुरुष पूर्वज ॥ १॥ श्रीमद्द्वारवतीनाथ वर्धतां विजयी भवान् । दिव्यं त्वदीयमैश्वर्यं निर्मर्यादविजृम्भितम्
    ॥ २॥ देवीभूषायुधैर्नित्यैर्मुक्तैर्मोक्षैकलक्षणैः । सत्त्वोत्तरैस्त्वदीयैश्च सङ्गस्थाभिरसस्तव ॥ ३॥
    प्राकारगोपुरवरप्रासादमणिमण्डपाः । शालिमुद्गतिलादीनां शालाशैलकुलोज्ज्वला ॥ ४॥ रत्नकाञ्चनकौशेयक्षौमक्रमुकशालिकाः
    । शय्यागृहाणि पर्यङ्कवर्यास्स्थूलासनानि च ॥ ५॥ कनत्कनकभृङ्गारपतद्ग्रहकलाचिकाः । छत्रचामरमुख्याश्च
    सन्तु नित्याः परिच्छदाः ॥ ६॥ अस्तु निस्तुलमव्यग्रं नित्यमभ्यर्चनं तव । पक्षे पक्षे विजृम्भन्तां मासि
    मासि महोत्सवाः ॥ ७॥ मणिकाञ्चनचित्राणि भूषणान्यम्बराणि च । काश्मीरसारकस्तूरि कर्पूराद्यनुलेपनम् ॥ ८॥
    कोमलानि च दामानि कौसुमैस्सौरभोद्गमैः । धूपाः कर्पूरदीपाश्च सन्तु नित्याः परिच्छदाः ॥ ९॥ नृत्तगीतयुतं
    वाद्यं नित्यमत्र विवर्धताम् । श्रोत्रेषु नस्सुधाधाराः कल्पन्तां काहलस्वनाः ॥ १०॥ कन्दमूलफलोदग्रं काले
    काले चतुर्विधम् । सूपापूपघृतक्षीरशर्करासहितं हविः ॥ ११॥ घनसारशिरोदग्रं क्रमुकाष्टदलान्वितम् । विमलानि
    च ताम्बूलदलानि स्वीकुरु प्रभो ॥ १२॥ प्रीतिभीतियुतो भूयान्नित्यं परिजनस्तव । भक्तिमन्तोपभुञ्जन्तु पौरजानपदैस्सह
    ॥ १३॥ धरणीधनरत्नानि वितरन्तु चिरं तव । कैङ्कर्यमखिलं सर्वे कुर्वन्तु क्षोणिपालकाः ॥ १४॥ प्रेमदिग्धदृशं
    स्मेरं प्रेक्षमाणास्त्वदाननम् । महान्तस्सन्ततं सन्तो मङ्गलानि प्रयुञ्जताम् । पापमेवमवन्नित्यं पालयन्
    कुशली भवान् ॥ १५॥ इति श्री जितन्तेस्तोत्रं सम्पूर्णम् ।
