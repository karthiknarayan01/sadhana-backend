id: brahmadidevaihkritamshrikrishnastotram
category: stotram
name:
  english: brahmadidevaihkritamshrikrishnastotram
  devanagari: ब्रह्मादिदेवैःकृतंश्रीकृष्णस्तोत्रम्
content:
  english: rvyuhe'rcitah savanashah svaratikramaya || 10|| yashcintyate prayatapanibhiradhvaragnau trayya
    niruktavidhinesha havirgrihitva | adhyatmayoga uta yogibhiratmamayam jijnasubhih paramabhagavataih
    parishtah || 11|| paryushtaya tava vibho vanamalayeyam samspardhini bhagavati pratipatnivacchrih |
    yah supranitamamuyarhanamadadanno bhuyatsadanghrirashubhashayadhumaketuh || 12|| ketustrivikramayutastripatatpatako
    yaste bhayabhayakaro'suradevacamvoh | svargaya sadhushu khaleshvitaraya bhuman padah punatu bhagavan
    bhajatamagham nah || 13|| nasyotagava iva yasya vashe bhavanti brahmadayastanubhrito mithurardyamanah
    | kalasya te prakritipurushayoh parasya sham nastanotu caranah purushottamasya || 14|| asyasi heturudayasthitisamyamana
  devanagari: र्व्यूहेऽर्चितः सवनशः स्वरतिक्रमाय ॥ १०॥ यश्चिन्त्यते प्रयतपाणिभिरध्वराग्नौ त्रय्या निरुक्तविधिनेश
    हविर्गृहीत्वा । अध्यात्मयोग उत योगिभिरात्ममायां जिज्ञासुभिः परमभागवतैः परीष्टः ॥ ११॥ पर्युष्टया तव
    विभो वनमालयेयं संस्पर्धिनी भगवती प्रतिपत्निवच्छ्रीः । यः सुप्रणीतममुयार्हणमाददन्नो भूयात्सदाङ्घ्रिरशुभाशयधूमकेतुः
    ॥ १२॥ केतुस्त्रिविक्रमयुतस्त्रिपतत्पताको यस्ते भयाभयकरोऽसुरदेवचम्वोः । स्वर्गाय साधुषु खलेष्वितराय
    भूमन् पादः पुनातु भगवन् भजतामघं नः ॥ १३॥ नस्योतगाव इव यस्य वशे भवन्ति ब्रह्मादयस्तनुभृतो मिथुरर्द्यमानाः
    । कालस्य ते प्रकृतिपूरुषयोः परस्य शं नस्तनोतु चरणः पुरुषोत्तमस्य ॥ १४॥ अस्यासि हेतुरुदयस्थितिसंयमाना
