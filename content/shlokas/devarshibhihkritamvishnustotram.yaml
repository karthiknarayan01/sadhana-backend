id: devarshibhihkritamvishnustotram
category: stotram
name:
  english: devarshibhihkritamvishnustotram
  devanagari: देवर्षिभिःकृतंविष्णुस्तोत्रम्
content:
  english: devarshibhih kritam vishnustotram devarshaya ucuh | jaya deva jayananta jaya vishno jaya'cyuta
    | jaya matsya namastubhyam jaya kurma dharadhara || 256|| varahaya namastubhyam narasimha namo namah
    | jamadagnya namastubhyam jaya rama salakshmana || 257|| jaya krishna jagannatha jaya devakinandana
    | namami buddham krishnam ca kalkinam pranamamyaham || 258|| iti shriskandapurane prabhasakhande vastrapathakshetramahatmye
    ashtadashadhyayantargatam devarshibhih kritam vishnustotram samaptam | skandapurana | prabhasakhanda
    | vastrapathakhanda | adhyaya 18
  devanagari: देवर्षिभिः कृतं विष्णुस्तोत्रम् देवर्षय ऊचुः । जय देव जयानन्त जय विष्णो जयाऽच्युत । जय मत्स्य
    नमस्तुभ्यं जय कूर्म धराधर ॥ २५६॥ वराहाय नमस्तुभ्यं नरसिंह नमो नमः । जामदग्न्य नमस्तुभ्यं जय राम सलक्ष्मण
    ॥ २५७॥ जय कृष्ण जगन्नाथ जय देवकिनन्दन । नमामि बुद्धं कृष्णं च कल्किनं प्रणमाम्यहम् ॥ २५८॥ इति श्रीस्कन्दपुराणे
    प्रभासखण्डे वस्त्रापथक्षेत्रमाहात्म्ये अष्टादशाध्यायान्तर्गतं देवर्षिभिः कृतं विष्णुस्तोत्रं समाप्तम्
    । स्कन्दपुराण । प्रभासखण्ड । वस्त्रापथखण्ड । अध्याय १८
meaning: {}
