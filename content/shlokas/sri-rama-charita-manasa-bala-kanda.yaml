    रूप नाम आधीना। रूप ग्यान नहिं नाम बिहीना ॥ रूप बिसेष नाम बिनु जानें। करतल गत न परहिं पहिचानेम् ॥ सुमिरिअ
    नाम रूप बिनु देखें। आवत हृदयँ सनेह बिसेषेम् ॥ नाम रूप गति अकथ कहानी। समुझत सुखद न परति बखानी ॥ अगुन
