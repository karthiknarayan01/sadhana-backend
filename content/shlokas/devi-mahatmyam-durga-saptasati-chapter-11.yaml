id: devi-mahatmyam-durga-saptasati-chapter-11
category: stotram
name:
  english: Devi Mahatmyam Durga Saptasati Chapter 11
content:
  english: narayanistutirnama ekadasho'dhyayah || dhyanam om balarkavidyutim indukiritam tungakucam nayanatrayayuktam
    | smeramukhim varadankushapashabhitikaram prabhaje bhuvaneshim || rishiruvaca|| || devya hate tatra
    mahasurendre sendrah sura vahnipurogamastam| katyayanim tushtuvurishtalabha dvikasivaktrabja vikasitashah
    || || devi prapannartihare prasida prasida matarjagato'bhilasya| prasidavishveshvari pahivishvam tvamishvari
    devi caracarasya || || adhara bhuta jagatastvameka mahisvarupena yatah sthitasi apam svarupa sthitaya
    tvayaita dapyayate kritsnamalanghya virye || || tvam vaishnavishaktiranantavirya vishvasya bijam paramasi
    maya| sammohitam devisamasta metat ttvam vai prasanna bhuvi muktihetuh || || vidyah samastastava devi
    bhedah| striyah samastah sakala jagatsu| tvayaikaya puritamambayaitat kate stutih stavyaparaparoktih
    || || sarva bhuta yada devi bhukti muktipradayini| tvam stuta stutaye ka va bhavantu paramoktayah
    || || sarvasya buddhirupena janasya hridi samsthite| svargapavargade devi narayani namo'stute || ||
    kalakashthadirupena parinama pradayini| vishvasyoparatau shakte narayani namostute || || sarva mangala
    mangalye shive sarvartha sadhike| sharanye trayambake gauri narayani namo'stute || || srishtisthitivinashanam
    shaktibhute sanatani| gunashraye gunamaye narayani namo'stute || || sharanagata dinarta paritranaparayane|
    sarvasyartihare devi narayani namo'stute || || hamsayukta vimanasthe brahmani rupadharini| kaushambhah
    ksharike devi narayani namo'stute|| || trishulacandrahidhare mahavrishabhavahini| maheshvari svarupena
    narayani namo'stute|| || mayura kukkutavrite mahashaktidhare'naghe| kaumarirupasamsthane narayani
    namostute|| || shankhacakragadasharngagrihitaparamayudhe| prasida vaishnavirupenarayani namo'stute||
    || grihitogramahacakre damshtroddhritavasundhare| varaharupini shive narayani namostute|| || nrisimharupenogrena
    hantum daityan kritodyame| trailokyatranasahite narayani namo'stute|| || kiritini mahavajre sahasranayanojjvale|
    vritrapranahare caindri narayani namo'stute|| || shivadutisvarupena hatadaitya mahabale| ghorarupe
    maharave narayani namo'stute|| || damshtrakarala vadane shiromalavibhushane| camunde mundamathane
    narayani namo'stute|| || lakshmi lajje mahavidhye shraddhe pushti svadhe dhruve| maharatri mahamaye
    narayani namo'stute|| || medhe sarasvati vare bhuti babhravi tamasi| niyate tvam prasideshe narayani
    namo'stute|| || sarvasvarupe sarveshe sarvashaktisamanvite| bhayebhyastrahi no devi durge devi namo'stute||
    || etatte vadanam saumyam locanatrayabhushitam| patu nah sarvabhutebhyah katyayini namo'stute|| ||
    jvalakaralamatyugramasheshasurasudanam| trishulam patu no bhitirbhadrakali namo'stute|| || hinasti
    daityatejamsi svanenapurya ya jagat| sa ghanta patu no devi papebhyo nah sutaniva|| || asurasrigvasapankacarcitaste
    karojvalah| shubhaya khadgo bhavatu candike tvam nata vayam|| || roganasheshanapahamsi tushta rushta
    tu kama sakalanabhishtan tvamashritanam na vipannaranam| tvamashrita shrayatam prayanti|| || etatkritam
    yatkadanam tvayadya darmadvisham devi mahasuranam| rupairanekairbhahudhatmamurtim kritvambhike tatprakaroti
    kanya|| || vidyasu shastreshu viveka dipe shvadyeshu vakyeshu ca ka tvadanya mamatvagarte'ti mahandhakare
    vibhramayatyetadativa vishvam|| || rakshamsi yatro gravishashca naga yatrarayo dasyubalani yatra|
    davanalo yatra tathabdhimadhye tatra sthita tvam paripasi vishvam|| || vishveshvari tvam paripasi
    vishvam vishvatmika dharayasiti vishvam| vishveshavandhya bhavati bhavanti vishvashraya yetvayi bhaktinamrah||
    || devi prasida paripalaya no'ri bhiternityam yathasuravadadadhunaiva sadyah| papani sarva jagatam
    prashamam nayashu utpatapakajanitamshca mahopasargan|| || pranatanam prasida tvam devi vishvarti harini|
    trailokyavasinamidye lokanam varada bhava|| || varadaham suragana param yanmanaseccatha| tam vrinudhvam
    prayacchami jagatamupakarakam|| || sarvabadha prashamanam trailokyasyakhileshvari| evameva tvayakarya
    masmadvairi vinashanam|| || vaivasvate'ntare prapte ashtavimshatime yuge| shumbho nishumbhashcaivanyavutpatsyete
    mahasurau|| || nandagopagrihe jata yashodagarbha sambhava| tatastaunashayishyami vindhyacalanivasini||
    || punarapyatiraudrena rupena prithivitale| avatirya havishyami vaipracittamstu danavan|| || bhakshya
    yantyashca tanugran vaipracittan mahasuran| raktadanta bhavishyanti dadimikusumopamah|| || tato mam
    devatah svarge martyaloke ca manavah| stuvanto vyaharishyanti satatam raktadantikam|| || bhuyashca
    shatavarshikyam anavrishtyamanambhasi| munibhih samstuta bhumau sambhavishyamyayonija|| || tatah shatena
    netranam nirikshishyamyaham munin kirtiyishyanti manujah shatakshimiti mam tatah|| || tato' hamakhilam
    lokamatmadehasamudbhavaih| bharishyami surah shakairavrishteh prana dharakaih|| || shakambhariti vikhyatim
    tada yasyamyaham bhuvi| tatraiva ca vadhishyami durgamakhyam mahasuram|| || durgadeviti vikhyatam
    tanme nama bhavishyati| punashcaham yadabhimam rupam kritva himacale|| || rakshamsi kshayayishyami
    muninam trana karanat| tada mam munayah sarve stoshyantyana mramurtayah|| || bhimadeviti vikhyatam
    tanme nama bhavishyati| yadarunakhyastrailòkye mahabadham karishyati|| || tadaham bhramaram rupam
    kritvasajkhyeyashatpadam| trailokyasya hitarthaya vadhishyami mahasuram|| || bhramaritica mam loka
    stadastoshyanti sarvatah| ittham yada yada badha danavottha bhavishyati|| || tada tadavatiryaham karishyamyarisankshayam
    || || || svasti shri markandeya purane savarnike manvantare devi mahatmye narayanistutirnama ekadasho'dhyayah
    samaptam || ahuti om klim jayanti sangayai sashaktikayai saparivarayai savahanayai lakshmibijadhishtayai
    garudavahanyai narayani devyai mahahutim samarpayami namah svaha ||
  devanagari: नारायणीस्तुतिर्नाम एकादशोऽध्यायः ॥ ध्यानं ॐ बालार्कविद्युतिं इन्दुकिरीटां तुङ्गकुचां नयनत्रययुक्ताम्
    । स्मेरमुखीं वरदाङ्कुशपाशभीतिकरां प्रभजे भुवनेशीम् ॥ ऋषिरुवाच॥ ॥ देव्या हते तत्र महासुरेन्द्रे सेन्द्राः
    सुरा वह्निपुरोगमास्ताम्। कात्यायनीं तुष्टुवुरिष्टलाभा द्विकासिवक्त्राब्ज विकासिताशाः ॥ ॥ देवि प्रपन्नार्तिहरे
    प्रसीद प्रसीद मातर्जगतोऽभिलस्य। प्रसीदविश्वेश्वरि पाहिविश्वं त्वमीश्वरी देवि चराचरस्य ॥ ॥ आधार भूता
    जगतस्त्वमेका महीस्वरूपेण यतः स्थितासि अपां स्वरूप स्थितया त्वयैत दाप्यायते कृत्स्नमलङ्घ्य वीर्ये ॥
    ॥ त्वं वैष्णवीशक्तिरनन्तवीर्या विश्वस्य बीजं परमासि माया। सम्मोहितं देविसमस्त मेतत् त्त्वं वै प्रसन्ना
    भुवि मुक्तिहेतुः ॥ ॥ विद्याः समस्तास्तव देवि भेदाः। स्त्रियः समस्ताः सकला जगत्सु। त्वयैकया पूरितमम्बयैतत्
    काते स्तुतिः स्तव्यपरापरोक्तिः ॥ ॥ सर्व भूता यदा देवी भुक्ति मुक्तिप्रदायिनी। त्वं स्तुता स्तुतये
    का वा भवन्तु परमोक्तयः ॥ ॥ सर्वस्य बुद्धिरूपेण जनस्य हृदि संस्थिते। स्वर्गापवर्गदे देवि नारायणि नमोऽस्तुते
    ॥ ॥ कलाकाष्ठादिरूपेण परिणाम प्रदायिनि। विश्वस्योपरतौ शक्ते नारायणि नमोस्तुते ॥ ॥ सर्व मङ्गल माङ्गल्ये
    शिवे सर्वार्थ साधिके। शरण्ये त्रयम्बके गौरी नारायणि नमोऽस्तुते ॥ ॥ सृष्टिस्थितिविनाशानां शक्तिभूते
    सनातनि। गुणाश्रये गुणमये नारायणि नमोऽस्तुते ॥ ॥ शरणागत दीनार्त परित्राणपरायणे। सर्वस्यार्तिहरे देवि
    नारायणि नमोऽस्तुते ॥ ॥ हंसयुक्त विमानस्थे ब्रह्माणी रूपधारिणी। कौशाम्भः क्षरिके देवि नारायणि नमोऽस्तुते॥
    ॥ त्रिशूलचन्द्राहिधरे महावृषभवाहिनि। माहेश्वरी स्वरूपेण नारायणि नमोऽस्तुते॥ ॥ मयूर कुक्कुटवृते महाशक्तिधरेऽनघे।
    कौमारीरूपसंस्थाने नारायणि नमोस्तुते॥ ॥ शङ्खचक्रगदाशार्ङ्गगृहीतपरमायुधे। प्रसीद वैष्णवीरूपेनारायणि
    नमोऽस्तुते॥ ॥ गृहीतोग्रमहाचक्रे दंष्त्रोद्धृतवसुन्धरे। वराहरूपिणि शिवे नारायणि नमोस्तुते॥ ॥ नृसिंहरूपेणोग्रेण
    हन्तुं दैत्यान् कृतोद्यमे। त्रैलोक्यत्राणसहिते नारायणि नमोऽस्तुते॥ ॥ किरीटिनि महावज्रे सहस्रनयनोज्ज्वले।
    वृत्रप्राणहारे चैन्द्रि नारायणि नमोऽस्तुते॥ ॥ शिवदूतीस्वरूपेण हतदैत्य महाबले। घोररूपे महारावे नारायणि
    नमोऽस्तुते॥ ॥ दंष्त्राकराल वदने शिरोमालाविभूषणे। चामुण्डे मुण्डमथने नारायणि नमोऽस्तुते॥ ॥ लक्ष्मी
    लज्जे महाविध्ये श्रद्धे पुष्टि स्वधे ध्रुवे। महारात्रि महामाये नारायणि नमोऽस्तुते॥ ॥ मेधे सरस्वति
    वरे भूति बाभ्रवि तामसि। नियते त्वं प्रसीदेशे नारायणि नमोऽस्तुते॥ ॥ सर्वस्वरूपे सर्वेशे सर्वशक्तिसमन्विते।
    भयेभ्यस्त्राहि नो देवि दुर्गे देवि नमोऽस्तुते॥ ॥ एतत्ते वदनं सौम्यं लोचनत्रयभूषितम्। पातु नः सर्वभूतेभ्यः
    कात्यायिनि नमोऽस्तुते॥ ॥ ज्वालाकरालमत्युग्रमशेषासुरसूदनम्। त्रिशूलं पातु नो भीतिर्भद्रकालि नमोऽस्तुते॥
    ॥ हिनस्ति दैत्यतेजांसि स्वनेनापूर्य या जगत्। सा घण्टा पातु नो देवि पापेभ्यो नः सुतानिव॥ ॥ असुरासृग्वसापङ्कचर्चितस्ते
    करोज्वलः। शुभाय खड्गो भवतु चण्डिके त्वां नता वयम्॥ ॥ रोगानशेषानपहंसि तुष्टा रुष्टा तु कामा सकलानभीष्टान्
    त्वामाश्रितानां न विपन्नराणां। त्वामाश्रिता श्रयतां प्रयान्ति॥ ॥ एतत्कृतं यत्कदनं त्वयाद्य दर्मद्विषां
    देवि महासुराणाम्। रूपैरनेकैर्भहुधात्ममूर्तिं कृत्वाम्भिके तत्प्रकरोति कान्या॥ ॥ विद्यासु शास्त्रेषु
    विवेक दीपे ष्वाद्येषु वाक्येषु च का त्वदन्या ममत्वगर्तेऽति महान्धकारे विभ्रामयत्येतदतीव विश्वम्॥ ॥
    रक्षांसि यत्रो ग्रविषाश्च नागा यत्रारयो दस्युबलानि यत्र। दावानलो यत्र तथाब्धिमध्ये तत्र स्थिता त्वं
    परिपासि विश्वम्॥ ॥ विश्वेश्वरि त्वं परिपासि विश्वं विश्वात्मिका धारयसीति विश्वम्। विश्वेशवन्ध्या भवती
    भवन्ति विश्वाश्रया येत्वयि भक्तिनम्राः॥ ॥ देवि प्रसीद परिपालय नोऽरि भीतेर्नित्यं यथासुरवदादधुनैव सद्यः।
    पापानि सर्व जगतां प्रशमं नयाशु उत्पातपाकजनितांश्च महोपसर्गान्॥ ॥ प्रणतानां प्रसीद त्वं देवि विश्वार्ति
    हारिणि। त्रैलोक्यवासिनामीड्ये लोकानां वरदा भव॥ ॥ वरदाहं सुरगणा परं यन्मनसेच्चथ। तं वृणुध्वं प्रयच्छामि
    जगतामुपकारकम्॥ ॥ सर्वबाधा प्रशमनं त्रैलोक्यस्याखिलेश्वरि। एवमेव त्वयाकार्य मस्मद्वैरि विनाशनम्॥ ॥
    वैवस्वतेऽन्तरे प्राप्ते अष्टाविंशतिमे युगे। शुम्भो निशुम्भश्चैवान्यावुत्पत्स्येते महासुरौ॥ ॥ नन्दगोपगृहे
    जाता यशोदागर्भ सम्भवा। ततस्तौनाशयिष्यामि विन्ध्याचलनिवासिनी॥ ॥ पुनरप्यतिरौद्रेण रूपेण पृथिवीतले। अवतीर्य
    हविष्यामि वैप्रचित्तांस्तु दानवान्॥ ॥ भक्ष्य यन्त्याश्च तानुग्रान् वैप्रचित्तान् महासुरान्। रक्तदन्ता
    भविष्यन्ति दाडिमीकुसुमोपमाः॥ ॥ ततो मां देवताः स्वर्गे मर्त्यलोके च मानवाः। स्तुवन्तो व्याहरिष्यन्ति
    सततं रक्तदन्तिकाम्॥ ॥ भूयश्च शतवार्षिक्यां अनावृष्ट्यामनम्भसि। मुनिभिः संस्तुता भूमौ सम्भविष्याम्ययोनिजा॥
    ॥ ततः शतेन नेत्राणां निरीक्षिष्याम्यहं मुनीन् कीर्तियिष्यन्ति मनुजाः शताक्षीमिति मां ततः॥ ॥ ततोऽ हमखिलं
    लोकमात्मदेहसमुद्भवैः। भरिष्यामि सुराः शाकैरावृष्टेः प्राण धारकैः॥ ॥ शाकम्भरीति विख्यातिं तदा यास्याम्यहं
    भुवि। तत्रैव च वधिष्यामि दुर्गमाख्यं महासुरम्॥ ॥ दुर्गादेवीति विख्यातं तन्मे नाम भविष्यति। पुनश्चाहं
    यदाभीमं रूपं कृत्वा हिमाचले॥ ॥ रक्षांसि क्षययिष्यामि मुनीनां त्राण कारणात्। तदा मां मुनयः सर्वे स्तोष्यन्त्यान
    म्रमूर्तयः॥ ॥ भीमादेवीति विख्यातं तन्मे नाम भविष्यति। यदारुणाख्यस्त्रैलॊक्ये महाबाधां करिष्यति॥ ॥
    तदाहं भ्रामरं रूपं कृत्वासज्ख्येयषट्पदम्। त्रैलोक्यस्य हितार्थाय वधिष्यामि महासुरम्॥ ॥ भ्रामरीतिच
    मां लोका स्तदास्तोष्यन्ति सर्वतः। इत्थं यदा यदा बाधा दानवोत्था भविष्यति॥ ॥ तदा तदावतीर्याहं करिष्याम्यरिसङ्क्षयम्
    ॥ ॥ ॥ स्वस्ति श्री मार्कण्डेय पुराणे सावर्निके मन्वन्तरे देवि महत्म्ये नारायणीस्तुतिर्नाम एकादशोऽध्यायः
    समाप्तम् ॥ आहुति ॐ क्लीं जयन्ती साङ्गायै सशक्तिकायै सपरिवारायै सवाहनायै लक्ष्मीबीजाधिष्तायै गरुडवाहन्यै
    नारयणी देव्यै महाहुतिं समर्पयामि नमः स्वाहा ॥
