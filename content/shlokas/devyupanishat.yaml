id: devyupanishat
category: upanishad
name:
  english: devyupanishat
  devanagari: देव्युपनिषत्
content:
  english: upanishad devi upanishat || atha devyupanishat || atharvavediya shaktopanishat || shridevyupanishadvidyavedyaparasukhakriti
    | traipadam brahmacaitanyam ramacandrapadam bhaje || om bhadram karnebhih shrinuyama devah bhadram
    pashyemakshabhiryajatrah | sthirairangaistushtuva~sastanubhirvyashema devahitam yadayuh || svasti
    na indro vriddhashravah svasti nah pusha vishvavedah | svasti nastarkshyo arishtanemih svasti no brihaspatirdadhatu
    || om shantih shantih shantih || sarve vai deva devimupatasthuh | kasi tvam mahadevi || 1 || sabravidaham
    brahmasvarupini | mattah prakritipurushatmakam jagacchunyam cashunyam ca | ahamanandananandah vijnanavijnane'ham
    | brahma brahmani veditavye | ityahatharvani shrutih || 2 || aham pancabhutanyapancabhutani | ahamakhilam
    jagat | vedo'hamavedo'ham | vidyahamavidyaham | ajahamanajaham | adhashcordhvam ca tiryakcaham ||
    3 || aham rudrebhirvasubhishcaramyahamadityairuta vishvadevaih | aham mitravarunavubhau bibharmyahamindragni
    ahamashvinavubhau || 4 || aham somam tvashtaram pushanam bhagam dadhamyaham | vishnumurukramam brahmanamuta
    prajapatim dadhami || 5 || aham dadhami dravinam havishmate supravye3yajamanaya sunvate | aham rashtri
    sangamani vasunamaham suve pitaramasya murdhan || 6 || mama yonirapsvantah samudre | ya evam veda
    sa devipadamapnoti || 7 || te deva abruvan | namo devyai mahadevyai shivayai satatam namah | namah
    prakrityai bhadrayai niyatah pranatah sma tam || 8 || tamagnivarnam tapasa jvalantim vairocanim karmaphaleshu
    jushtam | durgam devim sharanamaham prapadye sutaram nashayate tamah || 9 || devim vacamajanayanta
    devastam vishvarupah pashavo vadanti | sa no mandreshamurjam duhana dhenurvagasmanupasushtutaitu ||
    10 || kalaratrim brahmastutam vaishnavim skandamataram | sarasvatimaditim dakshaduhitaram namamah
    pavanam shivam || 11 || mahalakshmishca vidmahe sarvasiddhishca dhimahi | tanno devi pracodayat ||
    12 || aditirhyajanishta daksha ya duhita tava | tam deva anvajayanta bhadra amritabandhavah || 13
    || kamo yonih kamakala vajrapanirguha hasa matarishvabhramindrah | punarguha sakala mayaya ca purucyesha
    vishvamata''dividyom || 14 || eshatmashaktih | esha vishvamohini pashankushadhanurbanadhara | esha
    shrimahavidya || 15 || ya evam veda sa shokam tarati || 16 || namaste astu bhagavati bhavati matarasmanpatu
    sarvatah || 17 || saishashtau vasavah | saishaikadasha rudrah | saisha dvadashadityah | saisha vishvedevah
    somapa asomapashca | saisha yatudhana asura rakshamsi pishaca yakshah siddhah | saisha sattvarajastamamsi
    | saisha brahmavishnurudrarupini | saisha prajapatindramanavah | saisha graha nakshatrajyotimshi kalakashthadikalarupini
    | tamaham pranaumi nityam || 18 || tapapaharinim devim bhuktimuktipradayinim | anantam vijayam shuddham
    sharanyam shivadam shivam || 19 || viyadakarasamyuktam vitihotrasamanvitam | ardhendulasitam devya
    bijam sarvarthasadhakam || 20 || evamekaksharam mantram yatayah shuddhacetasah | dhyayanti paramanandamaya
    jnanamburashayah || 21 || vanmaya brahmabhustasmatshashtham vaktrasamanvitam | suryo'vamashrotrabinduh
    samyuktashtattritiyakah || 22 || narayanena samyukto vayushcadharasamyutah | vicce navarnako'rnah
    syanmahadanandadayakah || 23 || hritpundarikamadhyastham pratahsuryasamaprabham | pashankushadharam
    saumyam varadabhayahastakam | trinetram raktavasanam bhaktakamadugham bhaje || 24 || namami tvamaham
    devim mahabhayavinashinim | mahadurgaprashamanim mahakarunyarupinim || 25 || yasyah svarupam brahmadayo
    na jananti tasmaducyate'jneya | yasya anto na vidyate tasmaducyate'nanta | yasya grahanam nopalabhyate
    tasmaducyate'lakshya | yasya jananam nopalabhyate tasmaducyate'ja | ekaiva sarvatra vartate tasmaducyata
    eka | ekaiva vishvarupini tasmaducyate naika | ata evocyate'jneya'nanta'lakshya'jaika naiketi || 26
    || mantranam matrika devi shabdanam jnanarupini | jnananam cinmayatita shunyanam shunyasakshini ||
    27 || yasyah parataram nasti saisha durga prakirtita | tam durgam durgamam devim duracaravighatinim
    | namami bhavabhito'ham samsararnavatarinim || 28 || idamatharvashirsham yo'dhite pancatharvashirshajapaphalamavapnoti
    | idamatharvashirsham jnatva yo'rcam sthapayati || 29 || shatalaksham prajaptvapi narcasiddhim ca
    vindati | shatamashtottaram casyah purashcaryavidhih smritah || 30 || dashavaram pathedyastu sadyah
    papaih pramucyate | mahadurgani tarati mahadevyah prasadatah || 31 || prataradhiyano ratrikritam papam
    nashayati | sayamadhiyano divasakritam papam nashayati | tatsayam pratah prayunjanah papo'papo bhavati
    | nishithe turiyasandhyayam japtva vaksiddhirbhavati | nutanapratimayam japtva devatasannidhyam bhavati
    | pranapratishthayam japtva prananam pratishtha bhavati | bhaumashvinyam mahadevisannidhau japtva
    mahamrityum tarati| ya evam vedetyupanishat || 32 || om bhadram karnebhih shrinuyama devah bhadram
    pashyemakshabhiryajatrah | sthirairangaistushtuva~sastanubhirvyashema devahitam yadayuh || svasti
    na indro vriddhashravah svasti nah pusha vishvavedah | svasti nastarkshyo arishtanemih svasti no brihaspatirdadhatu
    || om shantih shantih shantih || || iti shridevyupanishatsamapta || adhikadhyayanaya
  devanagari: उपनिषद् देवी उपनिषत् ॥ अथ देव्युपनिषत् ॥ अथर्ववेदीय शाक्तोपनिषत् ॥ श्रीदेव्युपनिषद्विद्यावेद्यापारसुखाकृति
    । त्रैपदं ब्रह्मचैतन्यं रामचन्द्रपदं भजे ॥ ॐ भद्रं कर्णेभिः शृणुयाम देवाः भद्रं पश्येमाक्षभिर्यजत्राः
    । स्थिरैरङ्गैस्तुष्टुवाँसस्तनूभिर्व्यशेम देवहितं यदायुः ॥ स्वस्ति न इन्द्रो वृद्धश्रवाः स्वस्ति नः
    पूषा विश्ववेदाः । स्वस्ति नस्तार्क्ष्यो अरिष्टनेमिः स्वस्ति नो बृहस्पतिर्दधातु ॥ ॐ शान्तिः शान्तिः
    शान्तिः ॥ सर्वे वै देवा देवीमुपतस्थुः । कासि त्वं महादेवि ॥ १ ॥ साब्रवीदहं ब्रह्मस्वरूपिणी । मत्तः
    प्रकृतिपुरुषात्मकं जगच्छून्यं चाशून्यं च । अहमानन्दानानन्दाः विज्ञानाविज्ञानेऽहम् । ब्रह्मा ब्रह्मणी
    वेदितव्ये । इत्याहाथर्वणी श्रुतिः ॥ २ ॥ अहं पञ्चभूतान्यपञ्चभूतानि । अहमखिलं जगत् । वेदोऽहमवेदोऽहम्
    । विद्याहमविद्याहम् । अजाहमनजाहम् । अधश्चोर्ध्वं च तिर्यक्चाहम् ॥ ३ ॥ अहं रुद्रेभिर्वसुभिश्चराम्यहमादित्यैरुत
    विश्वदेवैः । अहं मित्रावरुणावुभौ बिभर्म्यहमिन्द्राग्नी अहमश्विनावुभौ ॥ ४ ॥ अहं सोमं त्वष्टारं पूषणं
    भगं दधाम्यहम् । विष्णुमुरुक्रमं ब्रह्माणमुत प्रजापतिं दधामि ॥ ५ ॥ अहं दधामि द्रविणं हविष्मते सुप्राव्ये३यजमानाय
    सुन्वते । अहं राष्ट्री सङ्गमनी वसूनामहं सुवे पितरमस्य मूर्धन् ॥ ६ ॥ मम योनिरप्स्वन्तः समुद्रे । य
    एवं वेद स देवीपदमाप्नोति ॥ ७ ॥ ते देवा अब्रुवन् । नमो देव्यै महादेव्यै शिवायै सततं नमः । नमः प्रकृत्यै
    भद्रायै नियताः प्रणताः स्म ताम् ॥ ८ ॥ तामग्निवर्णां तपसा ज्वलन्तीं वैरोचनीं कर्मफलेषु जुष्टाम् । दुर्गां
    देवीं शरणमहं प्रपद्ये सुतरां नाशयते तमः ॥ ९ ॥ देवीं वाचमजनयन्त देवास्तां विश्वरूपाः पशवो वदन्ति ।
    सा नो मन्द्रेषमूर्जं दुहाना धेनुर्वागस्मानुपसुष्टुतैतु ॥ १० ॥ कालरात्रिं ब्रह्मस्तुतां वैष्णवीं स्कन्दमातरम्
    । सरस्वतीमदितिं दक्षदुहितरं नमामः पावनां शिवाम् ॥ ११ ॥ महालक्ष्मीश्च विद्महे सर्वसिद्धिश्च धीमहि ।
    तन्नो देवी प्रचोदयात् ॥ १२ ॥ अदितिर्ह्यजनिष्ट दक्ष या दुहिता तव । तां देवा अन्वजायन्त भद्रा अमृतबन्धवः
    ॥ १३ ॥ कामो योनिः कामकला वज्रपाणिर्गुहा हसा मातरिश्वाभ्रमिन्द्रः । पुनर्गुहा सकला मायया च पुरूच्येषा
    विश्वमाताऽऽदिविद्योम् ॥ १४ ॥ एषात्मशक्तिः । एषा विश्वमोहिनी पाशाङ्कुशधनुर्बाणधरा । एषा श्रीमहाविद्या
    ॥ १५ ॥ य एवं वेद स शोकं तरति ॥ १६ ॥ नमस्ते अस्तु भगवति भवती मातरस्मान्पातु सर्वतः ॥ १७ ॥ सैषाष्टौ
    वसवः । सैषैकादश रुद्राः । सैषा द्वादशादित्याः । सैषा विश्वेदेवाः सोमपा असोमपाश्च । सैषा यातुधाना असुरा
    रक्षांसि पिशाचा यक्षाः सिद्धाः । सैषा सत्त्वरजस्तमांसि । सैषा ब्रह्मविष्णुरुद्ररूपिणी । सैषा प्रजापतीन्द्रमनवः
    । सैषा ग्रहा नक्षत्रज्योतींषि कलाकाष्ठादिकालरूपिणी । तामहं प्रणौमि नित्यम् ॥ १८ ॥ तापापहारिणीं देवीं
    भुक्तिमुक्तिप्रदायिनीम् । अनन्तां विजयां शुद्धां शरण्यां शिवदां शिवाम् ॥ १९ ॥ वियदाकारसंयुक्तं वीतिहोत्रसमन्वितम्
    । अर्धेन्दुलसितं देव्या बीजं सर्वार्थसाधकम् ॥ २० ॥ एवमेकाक्षरं मन्त्रं यतयः शुद्धचेतसः । ध्यायन्ति
    परमानन्दमया ज्ञानाम्बुराशयः ॥ २१ ॥ वाङ्माया ब्रह्मभूस्तस्मात्षष्ठं वक्त्रसमन्वितम् । सूर्योऽवामश्रोत्रबिन्दुः
    संयुक्ताष्टात्तृतीयकः ॥ २२ ॥ नारायणेन संयुक्तो वायुश्चाधरसंयुतः । विच्चे नवार्णकोऽर्णः स्यान्महदानन्ददायकः
    ॥ २३ ॥ हृत्पुण्डरीकमध्यस्थां प्रातःसूर्यसमप्रभाम् । पाशाङ्कुशधरां सौम्यां वरदाभयहस्तकाम् । त्रिनेत्रां
    रक्तवसनां भक्तकामदुघां भजे ॥ २४ ॥ नमामि त्वामहं देवीं महाभयविनाशिनीम् । महादुर्गप्रशमनीं महाकारुण्यरूपिणीम्
    ॥ २५ ॥ यस्याः स्वरूपं ब्रह्मादयो न जानन्ति तस्मादुच्यतेऽज्ञेया । यस्या अन्तो न विद्यते तस्मादुच्यतेऽनन्ता
    । यस्या ग्रहणं नोपलभ्यते तस्मादुच्यतेऽलक्ष्या । यस्या जननं नोपलभ्यते तस्मादुच्यतेऽजा । एकैव सर्वत्र
    वर्तते तस्मादुच्यत एका । एकैव विश्वरूपिणी तस्मादुच्यते नैका । अत एवोच्यतेऽज्ञेयाऽनन्ताऽलक्ष्याऽजैका
    नैकेति ॥ २६ ॥ मन्त्राणां मातृका देवी शब्दानां ज्ञानरूपिणी । ज्ञानानां चिन्मयातीता शून्यानां शून्यसाक्षिणी
    ॥ २७ ॥ यस्याः परतरं नास्ति सैषा दुर्गा प्रकीर्तिता । तां दुर्गां दुर्गमां देवीं दुराचारविघातिनीम्
    । नमामि भवभीतोऽहं संसारार्णवतारिणीम् ॥ २८ ॥ इदमथर्वशीर्षं योऽधीते पञ्चाथर्वशीर्षजपफलमवाप्नोति । इदमथर्वशीर्षं
    ज्ञात्वा योऽर्चां स्थापयति ॥ २९ ॥ शतलक्षं प्रजप्त्वापि नार्चासिद्धिं च विन्दति । शतमष्टोत्तरं चास्याः
    पुरश्चर्याविधिः स्मृतः ॥ ३० ॥ दशवारं पठेद्यस्तु सद्यः पापैः प्रमुच्यते । महादुर्गाणि तरति महादेव्याः
    प्रसादतः ॥ ३१ ॥ प्रातरधीयानो रात्रिकृतं पापं नाशयति । सायमधीयानो दिवसकृतं पापं नाशयति । तत्सायं प्रातः
    प्रयुञ्जानः पापोऽपापो भवति । निशीथे तुरीयसन्ध्यायां जप्त्वा वाक्सिद्धिर्भवति । नूतनप्रतिमायां जप्त्वा
    देवतासान्निध्यं भवति । प्राणप्रतिष्ठायां जप्त्वा प्राणानां प्रतिष्ठा भवति । भौमाश्विन्यां महादेवीसन्निधौ
    जप्त्वा महामृत्युं तरति। य एवं वेदेत्युपनिषत् ॥ ३२ ॥ ॐ भद्रं कर्णेभिः शृणुयाम देवाः भद्रं पश्येमाक्षभिर्यजत्राः
    । स्थिरैरङ्गैस्तुष्टुवाँसस्तनूभिर्व्यशेम देवहितं यदायुः ॥ स्वस्ति न इन्द्रो वृद्धश्रवाः स्वस्ति नः
    पूषा विश्ववेदाः । स्वस्ति नस्तार्क्ष्यो अरिष्टनेमिः स्वस्ति नो बृहस्पतिर्दधातु ॥ ॐ शान्तिः शान्तिः
    शान्तिः ॥ ॥ इति श्रीदेव्युपनिषत्समाप्ता ॥ अधिकाध्ययनाय
