id: devadanavadikritamshivastotram
category: stotram
name:
  english: devadanavadikritamshivastotram
  devanagari: देवदानवादिकृतंशिवस्तोत्रम्
content:
  english: devadanavadikritam shivastotram devadanava ucuh | namastubhyam virupaksha namaste divyacakshushe
    | namah pinakahastaya vajrahastaya dhanvine || 28|| namastrishulahastaya dandahastaya dhurjate | namastrailokyanathaya
    bhutagramasharirine || 29|| namah surarihantre ca somagnyarkagryacakshushe | brahmane caiva rudraya
    namaste vishnurupine || 30|| brahmane vedarupaya namaste devarupine | sankhyayogaya bhutanam namaste
    shambhavaya te || 31|| manmathangavinashaya namah kalakshayankara | ramhase devadevaya namaste vasuretase
    || 32|| ekaviraya sarvaya namah pingakapardine | umabhartre namastubhyam yajnatripuraghatine || 33||
    shuddhabodhaprabuddhaya muktakaivalyarupine | lokatrayavidhatre ca varunendragnirupine || 34|| rigyajuhsamavedaya
    purushayeshvaraya ca | agryaya caiva cograya vipraya shruticakshushe || 35|| rajase caiva sattvaya
    tamase timiratmane | anityanityabhavaya namo nityacaratmane || 36|| vyaktaya caivavyaktaya vyaktavyaktaya
    vai namah | bhaktanamartinashaya priyanarayanaya ca || 37|| umapriyaya sharvaya nandivaktrancitaya
    ca | ritumanvantakalpaya pakshamasadinatmane || 38|| nanarupaya mundaya varuthaprithudandine | namah
    kapalahastaya digvasaya shikhandine || 39|| dhanvine rathine caiva yataye brahmacarine | ityevamadicaritaih
    stutam tubhyam namo namah || 40|| iti matsyapurane pancashadadhikadvishatatamadhyayantargatam devadanavadikritam
    shivastotram samaptam | matsyapurana | adhyaya 250
  devanagari: देवदानवादिकृतं शिवस्तोत्रम् देवदानवा ऊचुः । नमस्तुभ्यं विरूपाक्ष नमस्ते दिव्यचक्षुषे । नमः
    पिनाकहस्ताय वज्रहस्ताय धन्विने ॥ २८॥ नमस्त्रिशूलहस्ताय दण्डहस्ताय धूर्जटे । नमस्त्रैलोक्यनाथाय भूतग्रामशरीरिणे
    ॥ २९॥ नमः सुरारिहन्त्रे च सोमाग्न्यर्काग्र्यचक्षुषे । ब्रह्मणे चैव रुद्राय नमस्ते विष्णुरूपिणे ॥ ३०॥
    ब्रह्मणे वेदरूपाय नमस्ते देवरूपिणे । साङ्ख्ययोगाय भूतानां नमस्ते शम्भवाय ते ॥ ३१॥ मन्मथाङ्गविनाशाय
    नमः कालक्षयङ्कर । रंहसे देवदेवाय नमस्ते वसुरेतसे ॥ ३२॥ एकवीराय सर्वाय नमः पिङ्गकपर्दिने । उमाभर्त्रे
    नमस्तुभ्यं यज्ञत्रिपुरघातिने ॥ ३३॥ शुद्धबोधप्रबुद्धाय मुक्तकैवल्यरूपिणे । लोकत्रयविधात्रे च वरुणेन्द्राग्निरूपिणे
    ॥ ३४॥ ऋग्यजुःसामवेदाय पुरुषायेश्वराय च । अग्र्याय चैव चोग्राय विप्राय श्रुतिचक्षुषे ॥ ३५॥ रजसे चैव
    सत्त्वाय तमसे तिमिरात्मने । अनित्यनित्यभावाय नमो नित्यचरात्मने ॥ ३६॥ व्यक्ताय चैवाव्यक्ताय व्यक्ताव्यक्ताय
    वै नमः । भक्तानामार्तिनाशाय प्रियनारायणाय च ॥ ३७॥ उमाप्रियाय शर्वाय नन्दिवक्त्राञ्चिताय च । ऋतुमन्वन्तकल्पाय
    पक्षमासदिनात्मने ॥ ३८॥ नानारूपाय मुण्डाय वरूथपृथुदण्डिने । नमः कपालहस्ताय दिग्वासाय शिखण्डिने ॥ ३९॥
    धन्विने रथिने चैव यतये ब्रह्मचारिणे । इत्येवमादिचरितैः स्तुतं तुभ्यं नमो नमः ॥ ४०॥ इति मत्स्यपुराणे
    पञ्चाशदधिकद्विशततमाध्यायान्तर्गतं देवदानवादिकृतं शिवस्तोत्रं समाप्तम् । मत्स्यपुराण । अध्याय २५०
