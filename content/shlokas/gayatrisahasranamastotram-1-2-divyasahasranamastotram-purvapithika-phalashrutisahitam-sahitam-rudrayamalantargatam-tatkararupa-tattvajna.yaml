id: gayatrisahasranamastotram-1-2-divyasahasranamastotram-purvapithika-phalashrutisahitam-sahitam-rudrayamalantargatam-tatkararupa-tattvajna
category: sahasranama
name:
  english: gayatrisahasranamastotram 1-2 divyasahasranamastotram purvapithika phalashrutisahitam sahitam
    (rudrayamalantargatam tatkararupa tattvajna)
  devanagari: गायत्रीसहस्रनामस्तोत्रम् १-२ दिव्यसहस्रनामस्तोत्रं पूर्वपीठिका फलश्रुतिसहितम् सहितम् (रुद्रयामलान्तर्गतं
    तत्काररूपा तत्त्वज्ञा)
content:
  english: yokararupa yodhadhyayodhri yodhasutatpara || 124|| yogini yoginisevya yogajnanaprabodhini |
    yogeshvaraprananatha yogishvarahridisthita || 125|| yoga yogakshemakartri yogakshemavidhayini | yogarajeshvararadhya
    yoganandasvarupini || 126|| nakararupa nadeshi namaparayanapriya | navasiddhisamaradhya narayanamanohari
    || 127|| narayani navadhara navabrahmarcitanghrika | nagendratanayaradhya namarupavivarjita || 128||
    narasimharcitapada navabandhavimocani | navagraharcitapada navamipujanapriya || 129|| naimittikarthaphalada
    nanditarivinashini | navapithasthita nada navarshiganasevita || 130|| navasutravidhanajna naimisharanyavasini
    | navacandanadigdhangi navakunkumadharini || 131|| navavastraparidhana navaratnavibhushana | navyabhasmavidagdhangi
    navacandrakaladhara || 132|| prakararupa praneshi pranasamrakshanipara | pranasanjivini pracya pranipranaprabodhini
    || 133|| prajna prajna prabhapushpa pratici prabhuda priya | pracina pranicittastha prabha prajnanarupini
    || 134|| prabhatakarmasantushta pranayamaparayana | prayajna pranava prana pravrittih prakritih para
    || 135|| prabandha prathama caiva praga prarabdhanashini | prabodhanirata prekshya prabandha pranasakshini
    || 136|| prayagatirthanilaya pratyakshaparameshvari | pranavadyantanilaya pranavadih prajeshvari ||
    137|| cokararupa coraghni corabadhavinashini | caitanyacetanastha ca catura ca camatkritih || 138||
    cakravartikuladhara cakrini cakradharini | cittaceya cidananda cidrupa cidvilasini || 139|| cintacittaprashamani
    cintitarthaphalaprada | campeyi campakaprita candi candattahasini || 140|| candeshvari candamata candamundavinashini
    | cakorakshi ciraprita cikura cikuralaka || 141|| caitanyarupini caitri cetana cittasakshini | citra
    citravicitrangi citraguptaprasadini || 142|| calana cakrasamstha ca campeyi calacitrini | candramandalamadhyastha
    candrakotisushitala || 143|| candranujasamaradhya candra candamahodari | carcitarishcandramata candrakanta
    caleshvari || 144|| caracaranivasi ca cakrapanisahodari | dakararupa dattashridaridryacchedakarini
    || 145|| dattatreyasya varada darya ca dinavatsala | daksharadhya dakshakanya dakshayajnavinashini
    || 146|| daksha dakshayani diksha drishta dakshavaraprada | dakshina dakshinaradhya dakshinamurtirupini
    || 147|| dayavati damasvanta danujarirdayanidhih | dantashobhanibha devi damana dadimastana || 148||
    danda ca damayatri ca dandini damanapriya | dandakaranyanilaya dandakarivinashini || 149|| damshtrakaralavadana
    dandashobha darodari | daridrarishtashamani damya damanapujita || 150|| danavarcita padashrirdravina
    dravini daya | damodari danavarirdamodarasahodari || 151|| datri danapriya damni danashrirdvijavandita
    | dantiga dandini durva dadhidugdhasvarupini || 152|| dadimibijasandoha dantapanktivirajita | darpana
    darpanasvaccha drumamandalavasini || 153|| dashavatarajanani dashadigdaivapujita | dama dashadisha
    drishya dashadasi dayanidhih || 154|| deshakalaparijnana deshakalavishodhini | dashamyadikalaradhya
    dashakalavirodhini | dashamyadikalaradhya dashagrivavirodhini || 155|| dashaparadhashamani dashavrittiphalaprada
    | yatkararupini yajni yadavi yadavarcita || 156|| yayatipujanaprita yajniki yajakapriya | yajamana
    yaduprita yamapujaphalaprada || 157|| yashasvini yamaradhya yamakanya yatishvari | yamadiyogasantushta
    yogindrahridaya yama || 158|| yamopadhivinirmukta yashasyavidhisannuta | yaviyasi yuvaprita yatrananda
    yatishvari || 159|| yogapriya yogagamya yogadhyeya yathecchaga | yogapriya yajnaseni yogarupa yatheshtada
    || 160|| phalashrutih
  devanagari: योकाररूपा योधाढ्यायोध्री योधसुतत्परा ॥ १२४॥ योगिनी योगिनीसेव्या योगज्ञानप्रबोधिनी । योगेश्वरप्राणानाथा
    योगीश्वरहृदिस्थिता ॥ १२५॥ योगा योगक्षेमकर्त्री योगक्षेमविधायिनी । योगराजेश्वराराध्या योगानन्दस्वरूपिणी
    ॥ १२६॥ नकाररूपा नादेशी नामपारायणप्रिया । नवसिद्धिसमाराध्या नारायणमनोहरी ॥ १२७॥ नारायणी नवाधारा नवब्रह्मार्चिताङ्घ्रिका
    । नगेन्द्रतनयाराध्या नामरूपविवर्जिता ॥ १२८॥ नरसिंहार्चितपदा नवबन्धविमोचनी । नवग्रहार्चितपदा नवमीपूजनप्रिया
    ॥ १२९॥ नैमित्तिकार्थफलदा नन्दितारिविनाशिनी । नवपीठस्थिता नादा नवर्षिगणसेविता ॥ १३०॥ नवसूत्राविधानज्ञा
    नैमिशारण्यवासिनी । नवचन्दनदिग्धाङ्गी नवकुङ्कुमधारिणी ॥ १३१॥ नववस्त्रपरीधाना नवरत्नविभूषणा । नव्यभस्मविदग्धाङ्गी
    नवचन्द्रकलाधरा ॥ १३२॥ प्रकाररूपा प्राणेशी प्राणसंरक्षणीपरा । प्राणसञ्जीविनी प्राच्या प्राणिप्राणप्रबोधिनी
    ॥ १३३॥ प्रज्ञा प्राज्ञा प्रभापुष्पा प्रतीची प्रभुदा प्रिया । प्राचीना प्राणिचित्तस्था प्रभा प्रज्ञानरूपिणी
    ॥ १३४॥ प्रभातकर्मसन्तुष्टा प्राणायामपरायणा । प्रायज्ञा प्रणवा प्राणा प्रवृत्तिः प्रकृतिः परा ॥ १३५॥
    प्रबन्धा प्रथमा चैव प्रगा प्रारब्धनाशिनी । प्रबोधनिरता प्रेक्ष्या प्रबन्धा प्राणसाक्षिणी ॥ १३६॥ प्रयागतीर्थनिलया
    प्रत्यक्षपरमेश्वरी । प्रणवाद्यन्तनिलया प्रणवादिः प्रजेश्वरी ॥ १३७॥ चोकाररूपा चोरघ्नी चोरबाधाविनाशिनी
    । चैतन्यचेतनस्था च चतुरा च चमत्कृतिः ॥ १३८॥ चक्रवर्तिकुलाधारा चक्रिणी चक्रधारिणी । चित्तचेया चिदानन्दा
    चिद्रूपा चिद्विलासिनी ॥ १३९॥ चिन्ताचित्तप्रशमनी चिन्तितार्थफलप्रदा । चाम्पेयी चम्पकप्रीता चण्डी चण्डाट्टहासिनी
    ॥ १४०॥ चण्डेश्वरी चण्डमाता चण्डमुण्डविनाशिनी । चकोराक्षी चिरप्रीता चिकुरा चिकुरालका ॥ १४१॥ चैतन्यरूपिणी
    चैत्री चेतना चित्तसाक्षिणी । चित्रा चित्रविचित्राङ्गी चित्रगुप्तप्रसादिनी ॥ १४२॥ चलना चक्रसंस्था च
    चाम्पेयी चलचित्रिणी । चन्द्रमण्डलमध्यस्था चन्द्रकोटिसुशीतला ॥ १४३॥ चन्द्रानुजसमाराध्या चन्द्रा चण्डमहोदरी
    । चर्चितारिश्चन्द्रमाता चन्द्रकान्ता चलेश्वरी ॥ १४४॥ चराचरनिवासी च चक्रपाणिसहोदरी । दकाररूपा दत्तश्रीदारिद्र्यच्छेदकारिणी
    ॥ १४५॥ दत्तात्रेयस्य वरदा दर्या च दीनवत्सला । दक्षाराध्या दक्षकन्या दक्षयज्ञविनाशिनी ॥ १४६॥ दक्षा
    दाक्षायणी दीक्षा दृष्टा दक्षवरप्रदा । दक्षिणा दक्षिणाराध्या दक्षिणामूर्तिरूपिणी ॥ १४७॥ दयावती दमस्वान्ता
    दनुजारिर्दयानिधिः । दन्तशोभनिभा देवी दमना दाडिमस्तना ॥ १४८॥ दण्डा च दमयत्री च दण्डिनी दमनप्रिया ।
    दण्डकारण्यनिलया दण्डकारिविनाशिनी ॥ १४९॥ दंष्ट्राकरालवदना दण्डशोभा दरोदरी । दरिद्रारिष्टशमनी दम्या
    दमनपूजिता ॥ १५०॥ दानवार्चित पादश्रीर्द्रविणा द्राविणी दया । दामोदरी दानवारिर्दामोदरसहोदरी ॥ १५१॥ दात्री
    दानप्रिया दाम्नी दानश्रीर्द्विजवन्दिता । दन्तिगा दण्डिनी दूर्वा दधिदुग्धस्वरूपिणी ॥ १५२॥ दाडिमीबीजसन्दोहा
    दन्तपङ्क्तिविराजिता । दर्पणा दर्पणस्वच्छा द्रुममण्डलवासिनी ॥ १५३॥ दशावतारजननी दशदिग्दैवपूजिता । दमा
    दशदिशा दृश्या दशदासी दयानिधिः ॥ १५४॥ देशकालपरिज्ञाना देशकालविशोधिनी । दशम्यादिकलाराध्या दशकालविरोधिनी
    । दशम्यादिकलाराध्य दशग्रीवविरोधिनी ॥ १५५॥ दशापराधशमनी दशवृत्तिफलप्रदा । यात्काररूपिणी याज्ञी यादवी
    यादवार्चिता ॥ १५६॥ ययातिपूजनप्रीता याज्ञिकी याजकप्रिया । यजमाना यदुप्रीता यामपूजाफलप्रदा ॥ १५७॥ यशस्विनी
    यमाराध्या यमकन्या यतीश्वरी । यमादियोगसन्तुष्टा योगीन्द्रहृदया यमा ॥ १५८॥ यमोपाधिविनिर्मुक्ता यशस्यविधिसन्नुता
    । यवीयसी युवप्रीता यात्रानन्दा यतीश्वरी ॥ १५९॥ योगप्रिया योगगम्या योगध्येया यथेच्छगा । योगप्रिया यज्ञसेनी
    योगरूपा यथेष्टदा ॥ १६०॥ फलश्रुतिः
