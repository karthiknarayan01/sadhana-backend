id: gita-govindam-chapter-4-snigdha-madhusudana
category: stotram
name:
  english: Gita Govindam Chapter 4 - Snigdha Madhusudana
content:
  english: '|| caturthah sargah || || snigdhamadhusudanah || yamunatiravaniranikunje mandamasthitam |
    praha premabharodbhrantam madhavam radhikasakhi || || nindati candanamindukiranamanu vindati khedamadhiram
    | vyalanilayamilanena garalamiva kalayati malayasamiram || sa virahe tava dina madhava manasijavishikhabhayadiva
    bhavanaya tvayi lina || || aviralanipatitamadanasharadiva bhavadavanaya vishalam | svahridayarmani
    varma karoti sajalanalinidalajalam || || kusumavishikhasharatalpamanalpavilasakalakamaniyam | vratamiva
    tava parirambhasukhaya karoti kusumashayaniyam || || vahati ca galitavilocanajalabharamananakamalamudaram
    | vidhumiva vikatavidhuntudadantadalanagalitamritadharam || || vilikhati rahasi kurangamadena bhavantamasamasharabhutam
    | pranamati makaramadho vinidhaya kare ca sharam navacutam || || pratipadamidamapi nigatati madhava
    tava carane patitaham | tvayi vimukhe mayi sapadi sudhanidhirapi tanute tanudaham || || dhyanalayena
    purah parikalpya bhavantamativa durapam | vilapati hasati vishidati roditi cancati muncati tapam ||
    || shrijayadevabhanitamidamadhikam yadi manasa nataniyam | harivirahakulaballavayuvatisakhivacanam
    pathaniyam || || avaso vipinayate priyasakhimalapi jalayate tapo''pi shvasitena davadahanajvalakalapayate
    | sapi tvadvirahena hanta harinirupayate ha katham kandarpo''pi yamayate viracayanshardulavikriditam
    || || stanavinihitamapi haramudaram | sa manute krishatanuratibharam || radhika virahe tava keshava
    || || sarasamasrinamapi malayajapankam | pashyati vishamiva vapushi sashankam || || shvasitapavanamanupamaparinaham
    | madanadahanamiva vahati sadaham || || dishi dishi kirati sajalakanajalam | nayananalinamiva vigalitanalam
    || || nayanavishayamapi kisalayatalpam | kalayati vihitahutashavikalpam || || tyajati na panitalena
    kapolam | balashashinamiva sayamalolam || || haririti haririti japati sakamam | virahavihitamaranena
    nikamam || || shrijayadevabhanitamiti gitam | sukhayatu keshavapadamupunitam || || sa romancati sitkaroti
    vilapatyutkmpate tamyati dhyayatyudbhramati pramilati patatyudyati murcchatyapi | etavatyatanujvare
    varatanurjivenna kim te rasat svarvaidyapratima prasidasi yadi tyakto''nyatha nantakah || || smaraturam
    daivatavaidyahridya tvadangasangamritamatrasadhyam | vimuktabadham kurushe na radha mupendra vajradapi
    daruno''si || || kandarpajvarasanjvarasturatanorashcaryamasyashciram cetashcandanacandramahkamalinicintasu
    santamyati | kintu klantivashena shitalatanum tvamekameva priyam dhyayanti rahasi sthita kathamapi
    kshina kshanam praniti || || kshanamapi virahah pura na sehe nayananimilanakhinnaya yaya te | shvasiti
    kathamasau rasalashakham ciravirahena vilokya pushpitagram || || || iti gitagovinde snigdhamadhavo
    nama caturthah sargah ||'
  devanagari: ॥ चतुर्थः सर्गः ॥ ॥ स्निग्धमधुसूदनः ॥ यमुनातीरवानीरनिकुञ्जे मन्दमास्थितम् । प्राह प्रेमभरोद्भ्रान्तं
    माधवं राधिकासखी ॥ ॥ निन्दति चन्दनमिन्दुकिरणमनु विन्दति खेदमधीरम् । व्यालनिलयमिलनेन गरलमिव कलयति मलयसमीरम्
    ॥ सा विरहे तव दीना माधव मनसिजविशिखभयादिव भावनया त्वयि लीना ॥ ॥ अविरलनिपतितमदनशरादिव भवदवनाय विशालम्
    । स्वहृदयर्मणी वर्म करोति सजलनलिनीदलजालम् ॥ ॥ कुसुमविशिखशरतल्पमनल्पविलासकलाकमनीयम् । व्रतमिव तव परिरम्भसुखाय
    करोति कुसुमशयनीयम् ॥ ॥ वहति च गलितविलोचनजलभरमाननकमलमुदारम् । विधुमिव विकटविधुन्तुददन्तदलनगलितामृतधारम्
    ॥ ॥ विलिखति रहसि कुरङ्गमदेन भवन्तमसमशरभूतम् । प्रणमति मकरमधो विनिधाय करे च शरं नवचूतम् ॥ ॥ प्रतिपदमिदमपि
    निगतति माधव तव चरणे पतिताहम् । त्वयि विमुखे मयि सपदि सुधानिधिरपि तनुते तनुदाहम् ॥ ॥ ध्यानलयेन पुरः
    परिकल्प्य भवन्तमतीव दुरापम् । विलपति हसति विषीदति रोदिति चञ्चति मुञ्चति तापम् ॥ ॥ श्रीजयदेवभणितमिदमधिकं
    यदि मनसा नटनीयम् । हरिविरहाकुलबल्लवयुवतिसखीवचनं पठनीयम् ॥ ॥ आवासो विपिनायते प्रियसखीमालापि जालायते
    तापोऽपि श्वसितेन दावदहनज्वालाकलापायते । सापि त्वद्विरहेण हन्त हरिणीरूपायते हा कथं कन्दर्पोऽपि यमायते
    विरचयञ्शार्दूलविक्रीडितम् ॥ ॥ स्तनविनिहितमपि हारमुदारम् । सा मनुते कृशतनुरतिभारम् ॥ राधिका विरहे तव
    केशव ॥ ॥ सरसमसृणमपि मलयजपङ्कम् । पश्यति विषमिव वपुषि सशङ्कम् ॥ ॥ श्वसितपवनमनुपमपरिणाहम् । मदनदहनमिव
    वहति सदाहम् ॥ ॥ दिशि दिशि किरति सजलकणजालम् । नयननलिनमिव विगलितनालम् ॥ ॥ नयनविषयमपि किसलयतल्पम् । कलयति
    विहितहुताशविकल्पम् ॥ ॥ त्यजति न पाणितलेन कपोलम् । बालशशिनमिव सायमलोलम् ॥ ॥ हरिरिति हरिरिति जपति सकामम्
    । विरहविहितमरणेन निकामम् ॥ ॥ श्रीजयदेवभणितमिति गीतम् । सुखयतु केशवपदमुपुनीतम् ॥ ॥ सा रोमाञ्चति सीत्करोति
    विलपत्युत्क्म्पते ताम्यति ध्यायत्युद्भ्रमति प्रमीलति पतत्युद्याति मूर्च्छत्यपि । एतावत्यतनुज्वरे वरतनुर्जीवेन्न
    किं ते रसात् स्वर्वैद्यप्रतिम प्रसीदसि यदि त्यक्तोऽन्यथा नान्तकः ॥ ॥ स्मरातुरां दैवतवैद्यहृद्य त्वदङ्गसङ्गामृतमात्रसाध्याम्
    । विमुक्तबाधां कुरुषे न राधा मुपेन्द्र वज्रादपि दारुणोऽसि ॥ ॥ कन्दर्पज्वरसञ्ज्वरस्तुरतनोराश्चर्यमस्याश्चिरं
    चेतश्चन्दनचन्द्रमःकमलिनीचिन्तासु सन्ताम्यति । किन्तु क्लान्तिवशेन शीतलतनुं त्वामेकमेव प्रियं ध्यायन्ती
    रहसि स्थिता कथमपि क्षीणा क्षणं प्राणिति ॥ ॥ क्षणमपि विरहः पुरा न सेहे नयननिमीलनखिन्नया यया ते । श्वसिति
    कथमसौ रसालशाखां चिरविरहेण विलोक्य पुष्पिताग्राम् ॥ ॥ ॥ इति गीतगोविन्दे स्निग्धमाधवो नाम चतुर्थः सर्गः
    ॥
