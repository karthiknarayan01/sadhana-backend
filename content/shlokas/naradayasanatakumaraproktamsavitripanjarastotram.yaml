id: naradayasanatakumaraproktamsavitripanjarastotram
category: stotram
name:
  english: naradayasanatakumaraproktamsavitripanjarastotram
  devanagari: नारदायसनतकुमारप्रोक्तंसावित्रीपन्जरस्तोत्रम्
content:
  english: 154|| pathaniyam prayatnena bhuktim muktim samicchata | iti naradapurane uttarabhage tryashititamadhyayantargatam
    naradaya sanatakumaraproktam savitripanjarastotram samaptam | brihannaradiya
  devanagari: १५४॥ पठनीयं प्रयत्नेन भुक्तिं मुक्तिं समिच्छता । इति नारदपुराणे उत्तरभागे त्र्यशीतितमाध्यायान्तर्गतं
    नारदाय सनतकुमारप्रोक्तं सावित्रीपञ्जरस्तोत्रं समाप्तम् । बृहन्नारदीय
meaning: {}
