id: hindi-2
category: upanishad
name:
  english: hindi
  devanagari: ःइन्दि
content:
  english: '| sukshmam shariram vai vipra ityahurvedaparagah || 67|| militah panca pranashca pancakarmendriyaih
    saha | dhruvam pranamaya kosha ityakhyamapnuvantyaho || 68|| ekameva manah pancajnanendriya samanvitam
    | namna manomayah kosho nunabhakhyayate budhaih || 69|| ekai milita buddhih pancajnanendriyaih saha
    | vijnanamayakoshakhyam bhajate natra samshayah || 70|| karanakhyavapurbhuta''vidyayam nanvavasthitam
    | sattvam malinyasanjushtam svarupajnanameva hi || 71|| priyamodapramodairvai bhavairebhiryutanca
    sat | anandamayanama''sau koshah samprocyate budhaih || 72|| caturvimshatitattvanam yato''styetaddhi
    karanam | atastadeva samproktam shariram karanabhidham || 73|| ebhishca pancabhih koshaih sambaddhamadhuna
    maya | shruyatam procyamanam tadavasthatrayalakshanam || 74|| jagratsvapnasushuptyakhyamavasthatrayamastyaho
    | pancajnanendriyairyatra shrotraprabhritibhirdvijah || 75|| shabdadivishayah samyajjnayante jagradasti
    sa | sthuladehabhimanyatma vishva ityucyate budhaih || 76|| yatra jagradavasthayam yacca drishtam
    shrutanca yat | tajjanyairvasanapunjaih prapancah sampratiyate || 77|| svapnavastha''sti sa jagratsushuptyantaravarttinim
    | sukshmadehabhimanyatma procyate taijasabhidhah || 78|| na maya kimapi jnatam sukham nidra''nvabhavi
    ca | iti jagradavasthayamanubhutismritirhi ya || 79|| sa sushuptyabhidhavastha kirtyate tattvakovidaih
    | atma karanadehasyabhimani prajna ucyate || 80|| samashtih sthuladehanam virannamna''bhidhiyate |
    atah sthulasharirasyadhidevo vishvanamakah || 81|| sukshmarajyasthadevanam sukshmadehavalambinam |
    tejomayam shariram syandyato nunam maharshayah || 82|| sukshmadehabhimanyasti devo''tastaijasabhidhah
    | sukshmad yato''tisukshmavai shariram karanam tatah || 83|| devah karanadehasyabhimani prajna ucyate
    | caturvishatitattvani varnayami nishamyatam || 84|| naikadhainani naike nu varnayanti maharshayah
    | matantaranam sarvesham siddhante na tu bhinnata || 85|| shrotratvacau tatha cakshurasana ghranameva
    ca | pancajnanendriyanyahurvijna vedantaparagah || 86|| vakupanipadapayupasthakhyani dvijasattamah
    | panca karmendriyanyahustattvanveshanatatparah || 87|| pranapanau samanashcodanavyanau tathaiva ca
    | pranah panca samakhyatah pranatattvanucintakaih || 88|| hridi prano gude''panah samano nabhimandale
    | udanah kanthadeshe syadvyanah sarvashariragah || 89|| shabdah sparshastatha rupam raso gandhastathaiva
    ca | tanmatranyapi pancaiva bruvate tadvido janah || 90|| mano buddhistatha cittamahankarastathaiva
    ca | antahkaranabhedah syushcatvaro natra samshayah || 91|| caturvimshatitattvati santyetanyeva sattamah
    | pancavimshatamam tattvamahamevasmyasamshayam || 92|| viprah purusharupena naiva karyo''tra vismayah
    | tattvatitam param tattvam tattvajna ma~ bruvantyatah || 93|| vishaya indriyananca varnyante''tah
    param maya | samahitairbhavadbhiste shruyantam viprapungavah'
  devanagari: । सूक्ष्मं शरीरं वै विप्रा इत्याहुर्वेदपारगाः ॥ ६७॥ मिलिताः पञ्च प्राणाश्च पञ्चकर्मेन्द्रियैः
    सह । ध्रुवं प्राणमय कोश इत्याख्यामाप्नुवन्त्यहो ॥ ६८॥ एकमेव मनः पञ्चज्ञानेन्द्रिय समन्वितम् । नाम्ना
    मनोमयः कोशो नूनभाख्यायते बुधैः ॥ ६९॥ एकै मिलिता बुद्धिः पञ्चज्ञानेन्द्रियैः सह । विज्ञानमयकोशाख्यां
    भजते नात्र संशयः ॥ ७०॥ कारणाख्यवपुर्भूताऽविद्यायां नन्ववस्थितम् । सत्त्वं मालिन्यसञ्जुष्टं स्वरूपाज्ञानमेव
    हि ॥ ७१॥ प्रियमोदप्रमोदैर्वै भावैरेभिर्युतञ्च सत् । आनन्दमयनामाऽसौ कोशः सम्प्रोच्यते बुधैः ॥ ७२॥ चतुर्विंशतितत्त्वानां
    यतोऽस्त्येतद्धि कारणम् । अतस्तदेव सम्प्रोक्तं शरीरं कारणाभिधम् ॥ ७३॥ एभिश्च पञ्चभिः कोषैः सम्बद्धमधुना
    मया । श्रूयतां प्रोच्यमानं तदवस्थात्रयलक्षणम् ॥ ७४॥ जाग्रत्स्वप्नसुषुप्त्याख्यमवस्थात्रयमस्त्यहो ।
    पञ्चज्ञानेन्द्रियैर्यत्र श्रोत्रप्रभृतिभिर्द्विजाः ॥ ७५॥ शब्दादिविषयाः सम्यज्ज्ञायन्ते जाग्रदस्ति
    सा । स्थूलदेहाभिमान्यात्मा विश्व इत्युच्यते बुधैः ॥ ७६॥ यत्र जाग्रदवस्थायां यच्च दृष्टं श्रुतञ्च यत्
    । तज्जन्यैर्वासनापुञ्जैः प्रपञ्चः सम्प्रतीयते ॥ ७७॥ स्वप्नावस्थाऽस्ति सा जाग्रत्सुषुप्त्यन्तरवर्त्तिनीम्
    । सूक्ष्मदेहाभिमान्यात्मा प्रोच्यते तैजसाभिधः ॥ ७८॥ न मया किमपि ज्ञातं सुखं निद्राऽन्वभावि च । इति
    जाग्रदवस्थायामानुभूतिस्मृतिर्हि या ॥ ७९॥ सा सुषुप्त्यभिधावस्था कीर्त्यते तत्त्वकोविदैः । आत्मा कारणदेहस्याभिमानी
    प्राज्ञ उच्यते ॥ ८०॥ समष्टिः स्थूलदेहानां विराण्नाम्नाऽभिधीयते । अतः स्थूलशरीरस्याधिदेवो विश्वनामकः
    ॥ ८१॥ सूक्ष्मराज्यस्थदेवानां सूक्ष्मदेहावलम्बिनाम् । तेजोमयं शरीरं स्यान्द्यतो नूनं महर्षयः ॥ ८२॥
    सूक्ष्मदेहाभिमान्यस्ति देवोऽतस्तैजसाभिधः । सूक्ष्माद् यतोऽतिसूक्ष्मवै शरीरं कारणं ततः ॥ ८३॥ देवः कारणदेहस्याभिमानी
    प्राज्ञ उच्यते । चतुर्विशतितत्त्वानि वर्णयामि निशम्यताम् ॥ ८४॥ नैकधैनानि नैके नु वर्णयन्ति महर्षयः
    । मतान्तराणां सर्वेषां सिद्धान्ते न तु भिन्नता ॥ ८५॥ श्रोत्रत्वचौ तथा चक्षुरसना घ्राणमेव च । पञ्चज्ञानेन्द्रियाण्याहुर्विज्ञा
    वेदान्तपारगाः ॥ ८६॥ वाकूपाणिपादपायूपस्थाख्यानि द्विजसत्तमाः । पञ्च कर्मेन्द्रियाण्याहुस्तत्त्वान्वेषणतत्पराः
    ॥ ८७॥ प्राणापानौ समानश्चोदानव्यानौ तथैव च । प्राणाः पञ्च समाख्याताः प्राणतत्त्वानुचिन्तकैः ॥ ८८॥ हृदि
    प्राणो गुदेऽपानः समानो नाभिमण्डले । उदानः कण्ठदेशे स्याद्व्यानः सर्वशरीरगः ॥ ८९॥ शब्दः स्पर्शस्तथा
    रूपं रसो गन्धस्तथैव च । तन्मात्राण्यपि पञ्चैव ब्रुवते तद्विदो जनाः ॥ ९०॥ मनो बुद्धिस्तथा चित्तमहङ्कारस्तथैव
    च । अन्तःकरणभेदाः स्युश्चत्वारो नात्र संशयः ॥ ९१॥ चतुर्विंशतितत्त्वाति सन्त्येतान्येव सत्तमाः । पञ्चविंशतमं
    तत्त्वमहमेवास्म्यसंशयम् ॥ ९२॥ विप्राः पुरुषरूपेण नैव कार्योऽत्र विस्मयः । तत्त्वातीतं परं तत्त्वं
    तत्त्वज्ञा माँ ब्रुवन्त्यतः ॥ ९३॥ विषया इन्द्रियाणाञ्च वर्ण्यन्तेऽतः परं मया । समाहितैर्भवद्भिस्ते
    श्रूयन्तां विप्रपुङ्गवाः
