    ssakhinamavita jaritrinam | shata nna utyabhi pramandase vrishann | kaya stotribhya abhara || || indro
    vishvasya rajati | sha nno astu dvipade sha nno bhavatvaryama | sha nna indro brihaspati nno vishnururukramah
    || nno vatah pavatagm sha nnastapatu suryah | sha nnah kanikradaddevah parjanyo abhivar shshagm ratrih
    pratidhiyatam | sha nna indragni bhavatamavobhi nna indravaruna ratahavya | sha nna indrapushana vajasatau
    shamindrasoma suvitaya sham nno devirabhishtaya apo bhavantu pitaye | sham yo~rabhisravantu nah ||
    || syona prithivi no bhavanrikshara niveshani | yaccha na || apo hi shtha mayobhuvasta na urje dadhatana
    | mahe ranaya cakshase || || yo vah shivatamo rasastasya bhajayateha nah | ushatiriva matarah || ||
    tasma aram gamama vo yasya kshayaya jinvatha | apo janayatha ca nah || shantirantarikshagm shantih
    prithivi shantirapa shshantih | vanaspataya shshantirvishve deva shshantirbrahma shanti ssarvagm shantih
    shantireva shanti ssa ma shantiredhi || || drite drigmha ma mitrasya ma cakshusha sarvani bhutani
    samikshantam | mitrasyaha ncakshusha sarvani bhutani samikshe | mitrasya cakshusha samikshamahe ||
    || drite drigmha ma mitrasya ma cakshusha sarvani bhutani samikshantam | jyokte sandrishi jivyasam
    jyokte sandrishi jivyasam || || namaste harase shocishe namaste astvarcishe | anya nste asmattapantu
    hetayah pavako asmabhyagm shivo bhava || || namaste astu vidyute namaste stanayitnave | namaste bhagavannastu
    yata ssamihase tato no abhaya nnah kuru prajabhyo || sumitriya na apa oshadhaya ssantu durmitriyastasmai
    santuyo || taccakshurdevahita mpurastacchukramuccarat | pashyema sharadah shata njivema sharadah shatagm
    shrinuyama sharadah shatam prabravama sharadah shatamadina mbhuyashca sharadah shatat || || iti rudre
    shantyadhyayah || svasti prarthana mantrah harih om om svasti na indro vriddhashravah | svasti nah
    pusha vishvavedah | svasti nastarkshyo arishtanemih | svasti no brihaspatirdadhatu || mpaya oshadhishu
    payo divyantarikshe payo dhah | payasvatih pradishah santu mahyam || || om vishno raratamasi vishno
    shshnaptre stho vishno ssyurasi vishnordhruvo ''si | vaishnavamasi vishnave tva || || om agnirdevata
    vato devata suryo devata candrama devata vasavo devata rudra devataditya devata maruto devata vishvedeva
    devata brihaspatirdevatendro devata varuno devata || mprapadyami sadyojataya vai namo namah | bhave
    bhave natibhave bhavasva mam | bhavodbhavaya namah || || vamadevaya namo jyeshthaya namah shreshthaya
    namo rudraya namah kalaya namah kalavikaranaya namo balavikaranaya namo balaya namo balapramathanaya
    namah sarvabhutadamanaya namo manonmanaya namah || ''tha ghorebhyo ghoraghoratarebhyah | sarvebhya
    ssarva sharvebhyo namaste ''stu rudrarupebhyah || sarvatah sharva sarvebhyo tatpurushaya vidmahe mahadevaya
    dhimahi | tanno rudrah pracodayat || || ishanassarvavidyanamishvara ssarvabhutanam | brahmadhipatirbrahmano
    ''dhipatirbrahma shivo me || om shivo namasi svadhitiste pita namaste astu ma ma higmsih | nivartayamyayushe
    ''nnadyaya prajananaya rayasposhaya suprajastvaya suviryaya || || om vishvani deva savitarduritani
    parasuva | yadbhadra shshantirantarikshagm shantih prithivi shantirapa shshantih | vanaspataya shshantirvishvedeva
    shshantirbrahma shanti shshantireva shanti ssa ma shantiredhi || va~ esha vedanagmraso yatsamah |
    sarveshamevainametad vedanagm rasenabhishincati || shshantih || anena shri rudrabhishekakarmana shri
    bhavanishankara maharudrah priyata nna mama | iti shrishuklayajurvediya rudrashtadhyayi samapta |
    || om samba sadashivarpanamastu ||'
  devanagari: ॥ ॐ श्री गणेशाय नमः ॥ ॐ ध्यानम् वन्दे सिद्धिप्रदं देवं गणेशं प्रियपालकम् । विश्वगर्भं च
    विघ्नेशं अनादिं मङ्गलं विभूम् ॥ अथ ध्यानम् ध्यायेन्नित्यं महेशं रजतगिरिनिभं चारु चन्द्रवतंसम् । रत्नाकल्पोज्ज्वलाङ्गं
    परशुमृगवराभीतिहस्तं प्रसन्नम् ॥ ॥ पद्मासीनं समन्तात्स्तुतममरगणैर्व्याघ्रकृतिं वसानम् । विश्वाद्यं
    विश्ववन्द्यं निखिलभयहरं पञ्चवक्त्रं त्रिनेत्रम् ॥ शिव सङ्कल्प सूक्तम् हरिः॑ ॐ ग॒णानां॑ त्वा ग॒णप॑तिग्ं
    हवामहे प्रि॒याणां॑ त्वा प्रि॒यप॑तिग्ं हवामहे नि॒धीनां॑ त्वा॑ निधि॒पति॑ग्ं हवामहे वसो मम । आहम॑जानि
    गर्भ॒धमा त्वम॑जासि गर्भ॒धम् ॥ ॥ गा॒य॒त्री त्रि॒ष्टुब्जग॑त्यनु॒ष्टुप्प॒ङ्क्त्या स॒ह । बृ॒ह॒त्युष्णिहा॑
    क॒कुप्सू॒चीभिः॑ शम्यन्तु त्वा ॥ ॥ द्विप॑दा॒याश्चतु॑ष्पदा॒स्त्रिप॑दा॒याश्च॒षट्प॑दाः । विच्छ॑न्दा॒ याश्च॒
    सच्छ॑न्दा स्सू॒चीभिः॑ शम्यन्तु त्वा ॥ स्स॒हच्छ॑न्दस आ॒वृतः॑ स॒हप्र॑मा॒ ऋष॑य स्स॒प्त दै॑व्याः । पूर्वे॑षां॒
    पन्था॑मनु॒दृश्य॒ धीरा॑ अ॒न्वाले॑भिरे र॒थ्यो न र॒श्मीन् ॥ ॥ यज्जाग्र॑तो दू॒रमु॒दैति॒ दैवं॒ तदु॑ सु॒प्तस्य॒
    तथै॒वैति॑ । दू॒र॒ङ्ग॒म ञ्ज्योति॑षां॒ ज्योति॒रेकं॒ तन्मे॒ मनः॑ शि॒वस॑ङ्कल्पमस्तु ॥ ॥ येन॒ कर्मा॑ण्य॒पसो॑
    मनी॒षिणो॑ य॒ज्ञे कृ॒ण्वन्ति॑ वि॒दथे॑षु॒ धीराः॑ । यद॑पू॒र्वं यँ॒क्षम॒न्तः प्र॒जानां॒ तन्मे॒ मनः॑ शि॒वस॑ङ्कल्पमस्तु
    ॥ ॥ यत्प्र॒ज्ञान॑मु॒त चेतो॒ धृति॑श्च॒ यज्ज्योति॑र॒न्तर॒मृतं॑ प्र॒जासु॑ । यस्मा॒न्न ञ्च॒न कर्म॑ क्रि॒यते॒
    तन्मे॒ मनः॑ शि॒वस॑ङ्कल्पमस्तु ॥ म्भवि॒ष्यत्परि॑गृहीतम॒मृते॑न॒ सर्व॑म् । येन॑ य॒ज्ञस्ता॒यते॑ स॒प्तहो॑ता॒
