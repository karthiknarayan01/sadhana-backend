id: vishnukritamshivastotram-2
category: stotram
name:
  english: vishnukritamshivastotram 2
  devanagari: विष्णुकृतंशिवस्तोत्रम् २
content:
  english: namami vishveshvaramadidevam namami vishvottamamishamekam | namami sarvadhikamaprameyam namami
    shambhum girijasahayam || 550|| namami kalantakamugramisham namami khatvangadharam mahesham namami
    somanalabhaskaraksham namami vahikritasanmahoksham | namami sarvadhikakanthabhusham namami nanavidhadivyavesham
    namami shuddhottamabhutibhusham namami samrakshitabhutashesham || 552|| namami sarvangamavedyamadyam
    namami mayarahitam vishuddham | namami lokaikanidanabhutam namami nanavidhasrishtihetum || 553|| namami
    nageshasamarcitanghrim namami shuddhendukalavatamsam | namamyanekenduraviprabhasam namami nityam karunardrabhavam
    || 554|| namami ramyottamavaktracandram namami dirghoruhiranyabahum | namami shantacchahiranyarupam
    namami divyoruhiranyavarnam || 555|| namami somam vrisharajaketum namami sharvam varadharmasetum |
    namami bhimam jagadekanatham namami rudram janamokshahetum || 556|| namami vireshvaramugraviryam namami
    devam bhavanilakantham | namami sarvatiharam suresham namami dirghorujatakalapam || 557|| shiva eva
    sharanyapunyamurtih shiva evakhiladevacakravarti | shiva eva vidaritamarartih shiva evakhilavedagitakirtih
    || 558|| tvadanyam sharanyam varenyam na jane na jane shivameyakudhredjajane | tvadanyo na devastvadanyau
    na devastvadanyo na devastvadanyo na devah || 559|| tvameva prabhuh sarvalokaikanathastvamishastvamaradhyabhutastvameva
    | tvadanyo na pujyastvadanyo na pujyastvamevasi pujyastvamevasi sevyah || 560|| tvadanyatparam vastu
    mastyeva loke tvadanyo na vedantavedyah pareshah | tvamevasi sarvam tvadanyanna kinciddhruvam satyametaddhruvam
    satyametat || 561|| shivatparam neti vadanti vedah shivatparam neti vadanti devah | shivatparam neti
    vadanti siddhah shivatparam neti vadanti shuddhah || 562|| shiva evakhilaradhyah shiva eva jagatprabhuh
    | na shivatparamastyekam satyam satyam mayocyate || 563|| shivajnayaiva suryo'yam tapati prativasaram
    | shivajnayaiva candro'yam dipayatyakhila dishah || 564|| shivajnayaiva shailendrah phanidikkarinah
    sada | dhritva tishthanti prithivim bhotya kampitamanasah || 565|| shivajnayaiva nitaram prajvalatyanalah
    sada | shivajnayaiva vantyete vayavah sukhahetavah || 566|| shivasyaiva prasadena devendrah sarvapalakah
    | shivasyaiva prasadena sarjako'pi prajapatih || 567|| shivasyaiva prasadena maya praptam param padam
    | shivasyaiva prasadena shambhuh shambhutvamaptavan || 568|| || iti shivarahasyantargate vishnukritam
    shivastotram sampurnam ||
  devanagari: नमामि विश्वेश्वरमादिदेवं नमामि विश्वोत्तममीशमेकम् । नमामि सर्वाधिकमप्रमेयं नमामि शम्भुं
    गिरिजासहायम् ॥ ५५०॥ नमामि कालान्तकमुग्रमीशं नमामि खट्वाङ्गधरं महेशम् नमामि सोमानलभास्कराक्षं नमामि
    वाहीकृतसन्महोक्षम् । नमामि सर्वाधिककण्ठभूषं नमामि नानाविधदिव्यवेषम् नमामि शुद्धोत्तमभूतिभूषं नमामि
    संरक्षितभूतशेषम् ॥ ५५२॥ नमामि सर्वाङ्गमवेद्यमाद्यं नमामि मायारहितं विशुद्धम् । नमामि लोकैकनिदानभूतं
    नमामि नानाविधसृष्टिहेतुम् ॥ ५५३॥ नमामि नागेशसमर्चिताङ्घ्रिं नमामि शुद्धेन्दुकलावतंसम् । नमाम्यनेकेन्दुरविप्रभासं
    नमामि नित्यं करुणार्द्रभावम् ॥ ५५४॥ नमामि रम्योत्तमवक्त्रचन्द्रं नमामि दीर्घोरुहिरण्यबाहुम् । नमामि
    शान्ताच्छहिरण्यरूपं नमामि दिव्योरुहिरण्यवर्णम् ॥ ५५५॥ नमामि सोमं वृषराजकेतुं नमामि शर्वं वरधर्मसेतुम्
    । नमामि भीमं जगदेकनाथं नमामि रुद्रं जनमोक्षहेतुम् ॥ ५५६॥ नमामि वीरेश्वरमुग्रवीर्यं नमामि देवं भवनीलकण्ठम्
    । नमामि सर्वातिहरं सुरेशं नमामि दीर्घोरुजटाकलापम् ॥ ५५७॥ शिव एव शरण्यपुण्यमूर्तिः शिव एवाखिलदेवचक्रवर्ती
    । शिव एव विदारितामरार्तिः शिव एवाखिलवेदगीतकीर्तिः ॥ ५५८॥ त्वदन्यं शरण्यं वरेण्यं न जाने न जाने शिवामेयकुध्रेड्जजाने
    । त्वदन्यो न देवस्त्वदन्यौ न देवस्त्वदन्यो न देवस्त्वदन्यो न देवः ॥ ५५९॥ त्वमेव प्रभुः सर्वलोकैकनाथस्त्वमीशस्त्वमाराध्यभूतस्त्वमेव
    । त्वदन्यो न पूज्यस्त्वदन्यो न पूज्यस्त्वमेवासि पूज्यस्त्वमेवासि सेव्यः ॥ ५६०॥ त्वदन्यत्परं वस्तु
    मास्त्येव लोके त्वदन्यो न वेदान्तवेद्यः परेशः । त्वमेवासि सर्वं त्वदन्यन्न किञ्चिद्ध्रुवं सत्यमेतद्ध्रुवं
    सत्यमेतत् ॥ ५६१॥ शिवात्परं नेति वदन्ति वेदाः शिवात्परं नेति वदन्ति देवाः । शिवात्परं नेति वदन्ति सिद्धाः
    शिवात्परं नेति वदन्ति शुद्धाः ॥ ५६२॥ शिव एवाखिलाराध्यः शिव एव जगत्प्रभुः । न शिवात्परमस्त्येकं सत्यं
    सत्यं मयोच्यते ॥ ५६३॥ शिवाज्ञयैव सूर्योऽयं तपति प्रतिवासरम् । शिवाज्ञयैव चन्द्रोऽयं दीपयत्यखिला दिशः
    ॥ ५६४॥ शिवाज्ञयैव शैलेन्द्राः फणिदिक्करिणः सदा । धृत्वा तिष्ठन्ति पृथिवीं भोत्या कम्पितमानसाः ॥ ५६५॥
    शिवाज्ञयैव नितरां प्रज्वलत्यनलः सदा । शिवाज्ञयैव वान्त्येते वायवः सुखहेतवः ॥ ५६६॥ शिवस्यैव प्रसादेन
    देवेन्द्रः सर्वपालकः । शिवस्यैव प्रसादेन सर्जकोऽपि प्रजापतिः ॥ ५६७॥ शिवस्यैव प्रसादेन मया प्राप्तं
    परं पदम् । शिवस्यैव प्रसादेन शम्भुः शम्भुत्वमाप्तवान् ॥ ५६८॥ ॥ इति शिवरहस्यान्तर्गते विष्णुकृतं शिवस्तोत्रं
    सम्पूर्णम् ॥
