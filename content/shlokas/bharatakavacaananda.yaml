id: bharatakavacaananda
category: kavacha
name:
  english: bharatakavacaananda
  devanagari: भरतकवचआनन्द
content:
  english: jamata mama netre sada'tra hi | kapole mandavikantah karnamule smitananah || 4|| nasagram me
    sada patu kaikeyitoshavardhanah | udarango mukham patu vanim patu jatadharah || 5|| patu pushkaratato
    me jihvam dantan prabhamayah | cibukam valkaladharah kantham patu varananah || 6|| skandhau patu jitaratirbhujau
    shatrughnavanditah | karau kavacadhari ca nakhan khadgadharo'vatu || 7|| kukshim ramanujah patu vakshah
    shriramavallabhah | parshve raghavaparshvasthah patu prishtham subhashanah || 8|| jatharam ca dhanurdhari
    nabhim sharakaro'vatu | katim padmekshanah patu guhyam ramaikamanasah || 9|| ramamitrah patu lingamuru
    shriramasevakah | nandigramasthitah patu januni mama sarvada || 10|| shriramapadukadhari patu janghe
    sada mama | gulphau shriramabandhushca padau patu surarcitah || 11|| ramajnapalakah patu mamanganyatra
    sarvada | mama padanguḻih patu raghuvamshasubhushanah || 12|| romani patu me ramyah patu ratrau sudhirmama
    |
  devanagari: जामाता मम नेत्रे सदाऽत्र हि । कपोले माण्डवीकान्तः कर्णमूले स्मिताननः ॥ ४॥ नासाग्रं मे सदा
    पातु कैकेयीतोषवर्धनः । उदाराङ्गो मुखं पातु वाणीं पातु जटाधरः ॥ ५॥ पातु पुष्करतातो मे जिह्वां दन्तान्
    प्रभामयः । चिबुकं वल्कलधरः कण्ठं पातु वराननः ॥ ६॥ स्कन्धौ पातु जितारातिर्भुजौ शत्रुघ्नवन्दितः । करौ
    कवचधारी च नखान् खड्गधरोऽवतु ॥ ७॥ कुक्षिं रामानुजः पातु वक्षः श्रीरामवल्लभः । पार्श्वे राघवपार्श्वस्थः
    पातु पृष्ठं सुभाषणः ॥ ८॥ जठरं च धनुर्धारी नाभिं शरकरोऽवतु । कटिं पद्मेक्षणः पातु गुह्यं रामैकमानसः
    ॥ ९॥ राममित्रः पातु लिङ्गमूरू श्रीरामसेवकः । नन्दिग्रामस्थितः पातु जानुनी मम सर्वदा ॥ १०॥ श्रीरामपादुकाधारी
    पातु जङ्घे सदा मम । गुल्फौ श्रीरामबन्धुश्च पादौ पातु सुरार्चितः ॥ ११॥ रामाज्ञापालकः पातु ममाङ्गान्यत्र
    सर्वदा । मम पादाङ्गुळीः पातु रघुवंशसुभूषणः ॥ १२॥ रोमाणि पातु मे रम्यः पातु रात्रौ सुधीर्मम ।
