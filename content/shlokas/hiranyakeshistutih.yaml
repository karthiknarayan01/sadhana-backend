id: hiranyakeshistutih
category: stotram
name:
  english: hiranyakeshistutih
  devanagari: हिरण्यकेशीस्तुतिः
content:
  english: 78 hiranyakeshah kamapashyamedya hiranyakeshya yadricoktatattvam | adityavarnam tadavekshanarhamadityavanmam
    vidadhatu shuddham || 1|| iti shrivasudevanandasarasvativiracita hiranyakeshistutih samapta |
  devanagari: ७८ हिरण्यकेशाः कमपाश्यमेद्य हिरण्यकेश्या यदृचोक्ततत्त्वम् । आदित्यवर्णं तदवेक्षणार्हमादित्यवन्मां
    विदधातु शुद्धम् ॥ १॥ इति श्रीवासुदेवानन्दसरस्वतीविरचिता हिरण्यकेशीस्तुतिः समाप्ता ।
meaning: {}
