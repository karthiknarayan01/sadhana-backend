id: dattatreyamahamantrah
category: mantra
name:
  english: dattatreyamahamantrah
  devanagari: दत्तात्रेयमहामन्त्रः
content:
  english: om asya shridattatreya mahamantrasya bhagavan sadashiva rishih | gayatri chandah | shridattatreyo
    devata | caturvimshativishnumurtibijani bijam | yogamaya shaktih | dattatreyah kilakam | mama shridattaprasadasiddhyarthe
    vishnutattvaikyapraptyarthe caturvidhapurusharthasiddhyarthe ca jape viniyogah || rishyadinyasah |
    sadashivarishaye namah shirasi | gayatrichandase namah mukhe | shridattatreyadevatayai namah hridaye
    | caturvimshativishnubijaya namah guhye | yogamayashaktaye namah padayoh | dattatreyakilakaya namah
    nabhau | caturvidhapurusharthasiddhyarthe viniyogaya namah sarvange || karanyasah | kam nam mam gam
    angushthabhyam namah | vim mam trim vam tarjanibhyam svaha | shrim hrim pam dam madhyamabhyam vashat
    | sam vam pram am anamikabhyam hum | pum ksham nrim am kanishthikabhyam vaushat | jam um ham klim
    dattatreyaya namah karatalakaraprishthabhyam phat || shadanganyasah | kam nam mam gam hridayaya namah
    | vim mam trim vam shirase svaha | shrim hrim pam dam shikhayai vashat | sam vam pram am kavacaya
    hum | pum ksham nrim am netratrayaya vaushat | jam um ham klim dattatreyaya namah astraya phat ||
    dhyanam
  devanagari: ॐ अस्य श्रीदत्तात्रेय महामन्त्रस्य भगवान् सदाशिव ऋषिः । गायत्री छन्दः । श्रीदत्तात्रेयो
    देवता । चतुर्विंशतिविष्णुमूर्तिबीजानि बीजम् । योगमाया शक्तिः । दत्तात्रेयः कीलकम् । मम श्रीदत्तप्रसादसिद्ध्यर्थे
    विष्णुतत्त्वैक्यप्राप्त्यर्थे चतुर्विधपुरुषार्थसिद्ध्यर्थे च जपे विनियोगः ॥ ऋष्यादिन्यासः । सदाशिवऋषये
    नमः शिरसि । गायत्रीछन्दसे नमः मुखे । श्रीदत्तात्रेयदेवतायै नमः हृदये । चतुर्विंशतिविष्णुबीजाय नमः
    गुह्ये । योगमायाशक्तये नमः पादयोः । दत्तात्रेयकीलकाय नमः नाभौ । चतुर्विधपुरुषार्थसिद्ध्यर्थे विनियोगाय
    नमः सर्वाङ्गे ॥ करन्यासः । कं नं मं गं अङ्गुष्ठाभ्यां नमः । विं मं त्रिं वं तर्जनीभ्यां स्वाहा । श्रीं
    ह्रीं पं दं मध्यमाभ्यां वषट् । सं वं प्रं अं अनामिकाभ्यां हुम् । पुं क्षं नृं अं कनिष्ठिकाभ्यां वौषट्
    । जं उं हं क्लीं दत्तात्रेयाय नमः करतलकरपृष्ठाभ्यां फट् ॥ षडङ्गन्यासः । कं नं मं गं हृदयाय नमः । विं
    मं त्रिं वं शिरसे स्वाहा । श्रीं ह्रीं पं दं शिखायै वषट् । सं वं प्रं अं कवचाय हुम् । पुं क्षं नृं
    अं नेत्रत्रयाय वौषट् । जं उं हं क्लीं दत्तात्रेयाय नमः अस्त्राय फट् ॥ ध्यानम्
