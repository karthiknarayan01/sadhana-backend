id: kyts-jata-7-4-bruhaspati-rakaamayata-krishna-yajurveda-taittiriya-samhita
category: stotram
name:
  english: KYTS Jata 7.4 Bruhaspati Rakaamayata - Krishna Yajurveda Taittiriya Samhita
content:
  english: brihaspati rakamayata kamayata brihaspati rbrihaspati rakamayata | akamayata shracchradakamayata
    kamayata shrat | me deva deva me me devah | ndeva deva dadhirann | purodha mititi purodha iti sa sa
    ititi sah | sa eta metagm sa sa etam | ncaturvigmshatiratra ncaturvigmshatiratra meta meta ncaturvigmshatiratram
    | caturvigmshatiratra mapashya dapashyac caturvigmshatiratra ncaturvigmshatiratra mapashyat | caturvigmshatiratramiti
    caturvigmshati a 'hara daharada 'harat | ttena tena hara dahara tena yajata yajata tena tena yajata
    | ayajata tata stato 'yajata yajata tatah | tato vai vai tata stato vai | vai tasmai tasmai vai vai
    tasmai ttasmai tasmai shrat | deva adadhata dadhata deva deva adadhata | adadhata gaccha dagaccha
    dadadhata dadhata gacchat | mpurodha magaccha dagaccha vi~dvagmso vidvagmsa eva mevam vidvagmsa shcaturvigmshatiratra
    ncaturvigmshatiratram vi~dvagmso vidvagmsa shcaturvigmshatiratram | caturvigmshatiratra masata asate
    caturvigmshatiratra ncaturvigmshatiratra masate | caturvigmshatiratramiti caturvigmshati asate shracchradasata
    asate shrat | ebhyo manushya manushya ebhya ebhyo manushyah manushya dadhate dadhate manushya manushya
    dadhate | dadhate gacchanti gacchanti dadhate dadhate gacchanti | ngacchanti gacchanti purodham |
    ayu riti tyayu rayu riti | iti tryaha stryaha ititi tryahah | tryaha bhavanti bhavanti tryaha stryaha
    bhavanti | mbhavanti bhavantiyam | rvava vava jyotih | jyoti rantariksha mantariksha rjyoti rantariksham
    | rgau rantariksha mantariksha asa vayu rayu rasa vasa vayuh | ayu rima nima nayu rayu riman | ||
    imanevaive manima neva | eva lokan ~loka nevaiva lokan | loka nabhyaroha ntyabhyarohanti lokan ~loka
    nabhyarohanti | abhyaroha ntyabhipurva mabhipurva mabhyaroha ntyabhyaroha abhyarohantityabhi ntryaha
    stryaha abhipurva mabhipurva tryaha bhavanti bhavanti tryaha stryaha bhavanti | bhava ntyabhipurva
    mabhipurva mbhavanti bhava ntyabhipurvam | abhipurva mevai vabhipurva mabhipurva meva | eva suvargagm
    suvarga mevaiva suvargam | suvargam ~lokam ~lokagm suvargagm suvargam ~lokam | loka mabhyaroha ntyabhyarohanti
    lokam ~loka mabhyarohanti | abhyaroha ntyasatra masatra mabhyaroha ntyabhyaroha ntyasatram | abhyarohantityabhi
    vai~ va asatra masatram yadachandoma machandomam dyadachandoma machandomam achandomamityachandah yac
    chandoma shchandoma ya chandoma bhavanti bhavanti chandoma shchandoma bhavanti | chandoma iti chandah
    bhavanti tena tena bhavanti bhavanti tena | ntena tena satram | devata evaiva devata devata eva |
    eva prishthaih prishthai revaiva prishthaih | prishthai ravava prishthaih prishthai rava | ava rundhate
    rundhate 'vava rundhate | nrundhate rundhate pashun | pashun chandomai shchandomaih pashu npashun
    chandomaih | chandomai roja oja shchandomai shchandomai rojah | chandomairiti chandah ojo vai va oja
    ojo vai | mprishthani prishthani viryam prishthani pashavah pashavah prishthani prishthani pashavah
    | pashava shchandoma shchandomah pashavah pashava shchandomah | chandoma oja syojasi chandoma shchandoma
    ojasi | chandoma iti chandah oja syevaivauja syoja syeva | eva virye virya evaiva virye virye pashushu
    pashushu virye virye pashushu | pashushu prati prati pashushu pashushu prati | prati tishthanti tishthanti
    prati prati tishthanti | tishthanti brihadrathantarabhya ntishthanti tishthanti brihadrathantarabhya
    brihadrathantarabhyam ya~nti yanti brihadrathantarabhya mbrihadrathantarabhyam brihadrathantarabhyamiti
    brihat vava rathantaragm rathantaram va~va vava rathantaram | rathantara masa vasau rathantaragm rathantara
    masau | dbriha dasa vasau brihat | briha dabhya mabhya abhya mevai vabhya mabhya meva | eva yanti
    yantyevaiva yanti | || ntyatho atho yanti yantyatho atho anayo ranayo ratho atho anayoh anayo revai
    vanayo ranayo reva | eva prati pratyevaiva prati | prati tishthanti tishthanti prati prati tishthanti
    | tishthantyete ete tishthanti tishthantyete | ete vai va ete ete vai | vai yajnasya yajnasya vai
    vai yajnasya | njasayani anjasayani yajnasya yajnasya anjasayani sruti sruti anjasayani anjasayani
    sruti | anjasayani ityanjasa ntabhyag sruti sruti tabhya sruti iti sruti | tabhya mevaiva tabhya eva
    suvargagm suvarga mevaiva suvargam | suvargam ~lokam ~lokagm suvargagm suvargam ~lokam | ya~nti yanti
    lokam ~lokam yanti caturvigmshatiratra shcaturvigmshatiratro yanti yanti caturvigmshatiratrah | caturvigmshatiratro
    bhavati bhavati caturvigmshatiratra shcaturvigmshatiratro bhavati | caturvigmshatiratra iti caturvigmshati
    bhavati caturvigmshati shcaturvigmshati rbhavati bhavati caturvigmshatih | caturvigmshati rardhamasa
    ardhamasa shcaturvigmshati shcaturvigmshati rardhamasah | caturvigmshatiriti catuh 'rdhamasa ardhamasa
    ardhamasa ityardha suvargo loko loka eva suvarge suvarga evaiva suvarge | suvarge loke loke suvarge
    suvarge loke | loke prati prati loke loke prati | prati tishthanti tishthanti prati prati tishthanti
    | tishthantyatho atho tishthanti tishthantyatho atho caturvigmshatyakshara caturvigmshatyakshara 'tho
    atho caturvigmshatyakshara | caturvigmshatyakshara gayatri gayatri caturvigmshatyakshara caturvigmshatyakshara
    gayatri | caturvigmshatyakshareti caturvigmshati gayatri gayatri | gayatri brahmavarcasa ngayatri
    gayatri brahmavarcasam | ngayatriya gayatriya brahmavarcasa brahmavarcasamiti brahma gayatriyaivaiva
    gayatriya gayatriyaiva | mbrahmavarcasa mevaiva brahmavarcasam | brahmavarcasa mavava brahmavarcasa
    mbrahmavarcasa mava | brahmavarcasamiti brahma ava rundhate rundhate 'vava rundhate | rundhate 'tiratra
    vatiratrau rundhate rundhate 'tiratrau | atiratra vabhito 'bhito 'tiratra vatiratra vabhitah | atiratravityati
    abhito bhavato bhavato 'bhito 'bhito bhavatah | bhavato brahmavarcasasya brahmavarcasasya bhavato
    bhavato brahmavarcasasya | brahmavarcasasya parigrihityai parigrihityai brahmavarcasasya brahmavarcasasya
    parigrihityai | brahmavarcasasyeti brahma parigrihitya iti pari yatha vai vai yatha yatha vai | vai
    manushya manushya vai vai manushyah mmanushya manushya evam | ndeva deva eva meva deva agre 'gre deva
    deva agre nnagre 'gra asann | te 'kamayanta kamayanta te te 'kamayanta | akamayanta varti mavarti
    makamayanta kamayanta vartim | mpapmana mavarti mavarti mrityu mapahatya pahatya mrityu mmrityu mapahatya
    | ndaivi mapahatya pahatya daivi daivigm sagmsadagm sagmsada ngacchema gacchema sagmsadagm sagmsada
    gacchemetiti gacchema gacchemeti | iti te ta ititi te | ncaturvigmshatiratra ncaturvigmshatiratra
    meta meta ncaturvigmshatiratram | caturvigmshatiratra mapashya shcaturvigmshatiratra ncaturvigmshatiratra
    mapashyann | caturvigmshatiratramiti caturvigmshati tena yajanta yajanta tena tena yajanta | ayajanta
    tata stato 'yajanta yajanta tatah | tato vai vai tata stato vai | te 'varti mavarti mpapmana mavarti
    mavarti mrityu mapahatya pahatya mrityu mmrityu mapahatya | ndaivi mapahatya pahatya daivi daivigm
    sagmsadagm sagmsada nthsagmsadagm sagmsada magacchann | vi~dvagmso vidvagmsa eva mevam vidvagmsa shcaturvigmshatiratra
    ncaturvigmshatiratram vi~dvagmso vidvagmsa shcaturvigmshatiratram | caturvigmshatiratra masata asate
    caturvigmshatiratra ncaturvigmshatiratra masate | caturvigmshatiratramiti caturvigmshati asate 'varti
    mavarti masata asate 'vartim | avarti mevai vavarti mavarti meva | mpapmana mevaiva papmana papmana
    mapahatya pahatya papmana mpapmana mapahatya | apahatya shriyagg shriya mapahatya pahatya shriya ngacchanti
    gacchanti shriyagg shriya rgacchanti gacchanti shrih | hi manushyasya manushyasya hi hi manushyasya
    | manushyasya daivi daivi manushyasya manushyasya daivi ddaivi daivi sagmsat | thsagmsaj jyotih |
    jyoti ratiratro 'tiratro jyoti rjyoti ratiratrah | atiratro bhavati bhava tyatiratro 'tiratro bhavati
    | bhavati suvargasya suvargasya bhavati bhavati suvargasya | suvargasya lokasya lokasya suvargasya
    suvargasya lokasya | suvargasyeti suvah lokasya nukhyatya anukhyatyai lokasya lokasya nukhyatyai |
    anukhyatyai prishthyah prishthyo 'nukhyatya anukhyatyai prishthyah | anukhyatya ityanu prishthya shshadaha
    shshadahah prishthyah prishthya shshadahah | shadaho bhavati bhavati shadaha shshadaho bhavati | va
    ritava ritavo vai va ritavah | va~thsara ritava ritavah sam masa ardhamasa ardhamasa masa masa ardhamasah
    | ardhamasa ritava ritavo 'rdhamasa ardhamasa ritavah | ardhamasa ityardha ritavah pravishya pravishya
    r tava ritavah pravishya | mpravishya pravishya daivi daivigm sagmsadagm sagmsada nthsagmsadagm sagmsada
    magacchann | vi~dvagmso vidvagmsa eva mevam vidvagmsa shcaturvigmshatiratra ncaturvigmshatiratram
    vi~dvagmso vidvagmsa shcaturvigmshatiratram | caturvigmshatiratra masata asate caturvigmshatiratra
    ncaturvigmshatiratra masate | caturvigmshatiratramiti caturvigmshati va~thsara masata asate sam eva
    pravishya pravishyaivaiva pravishya | pravishya vasyasim mpravishya pravishya vasyasim | vasyasigm
    sagmsadagm sagmsadam va~syasigm sagmsada ngacchanti gacchanti sagmsadagm sagmsada gacchanti traya
    strayo gacchanti gacchanti trayah | traya strayastrigmsha strayastrigmsha straya straya strayastrigmshah
    | trayastrigmsha avasta davasta ttrayastrigmsha strayastrigmsha avasta trayastrigmsha iti trayah dbhavanti
    bhavantyavasta davasta bhavanti traya strayo bhavanti bhavanti trayah | traya strayastrigmsha strayastrigmsha
    straya straya strayastrigmshah | trayastrigmshah parasta ttrayastrigmsha strayastrigmshah parasta
    trayastrigmsha iti trayah ttrayastrigmshai strayastrigmshaih parasta ttrayastrigmshaih | trayastrigmshai
    revaiva trayastrigmshai straya strigmshaireva | trayastrigmshairiti trayah evobhayata ubhayata evaivobhayatah
    | ubhayato 'varti mavarti mubhayata ubhayato 'vartim | mpapmana mavarti mavarti papmana mapahatya
    pahatya papmana mpapmana mapahatya | ndaivi mapahatya pahatya daivi daivigm sagmsadagm sagmsada mmaddhyato
    maddhyata ssagmsadagm sagmsada maddhyato gacchanti gacchanti maddhyato maddhyato gacchanti | || gacchanti
    prishthani prishthani gacchanti gacchanti prishthani | prishthani hi hi prishthani prishthani hi |
    hi daivi daivi hi hi daivi ddaivi daivi sagmsat | sagmsaj jami jami sagmsa jami vai vai jami jami
    vai | tkurvanti kurvantyeta deta tkurvanti kurvanti yat | traya strayastrigmsha strayastrigmsha straya
    straya strayastrigmshah | trayastrigmsha anvanco 'nvanca strayastrigmsha strayastrigmsha anvancah
    | trayastrigmsha iti trayah anvanco maddhye maddhye 'nvanco 'nvanco maddhye maddhye 'nirukto 'nirukto
    maddhye maddhye 'niruktah | anirukto bhavati bhava tyanirukto 'nirukto bhavati | bhavati tena tena
    bhavati bhavati tena | tena ja myajami tena tena jami | myurdhva nyurdhva nyaja myaja urdhvani prishthani
    prishtha nyurdhva nyurdhvani prishthani | prishthani bhavanti bhavanti prishthani prishthani bhavanti
    | bhavantyurdhva urdhva bhavanti bhavantyurdhvah | urdhva shchandoma shchandoma urdhva urdhva shchandomah
    | chandoma ubhabhya mubhabhya nchandoma shchandoma ubhabhya chandoma iti chandah ubhabhyagm rupabhyagm
    rupabhya mubhabhya mubhabhyagm rupabhya rupabhyagm suvargagm suvargagm rupabhyagm rupabhyagm suvargam
    | suvargam ~lokam ~lokagm suvargagm suvargam ~lokam | ya~nti yanti lokam ~lokam yantyasatra masatram
    ya~nti yantyasatram | vai~ va asatra masatram yadachandoma machandomam dyadachandoma machandomam achandomamityachandah
    yac chandoma shchandoma ya chandoma bhavanti bhavanti chandoma shchandoma bhavanti | chandoma iti
    chandah bhavanti tena tena bhavanti bhavanti tena | ntena tena satram | devata evaiva devata devata
    eva | eva prishthaih prishthai revaiva prishthaih | prishthai ravava prishthaih prishthai rava | ava
    rundhate rundhate 'vava rundhate | nrundhate rundhate pashun | pashun chandomai shchandomaih pashu
    npashun chandomaih | chandomai roja oja shchandomai shchandomai rojah | chandomairiti chandah ojo
    vai va oja ojo vai | mprishthani prishthani viryam prishthani pashavah pashavah prishthani prishthani
    pashavah | pashava shchandoma shchandomah pashavah pashava shchandomah | || chandoma ojasyo jasi chandoma
    shchandoma ojasi | chandoma iti chandah oja syevaivauja syojasyeva | eva virye virya evaiva virye
    virye pashushu pashushu virye virye pashushu | pashushu prati prati pashushu pashushu prati | prati
    tishthanti tishthanti prati prati tishthanti | tishthanti traya straya stishthanti tishthanti trayah
    | traya strayastrigmsha strayastrigmsha straya straya strayastrigmshah | trayastrigmsha avasta davasta
    ttrayastrigmsha strayastrigmsha avasta trayastrigmsha iti trayah dbhavanti bhavantyavasta davasta
    bhavanti traya strayo bhavanti bhavanti trayah | traya strayastrigmsha strayastrigmsha straya straya
    strayastrigmshah | trayastrigmshah parasta ttrayastrigmsha straya strigmshah parasta trayastrigmsha
    iti trayah nmaddhye maddhye parasta maddhye prishthani prishthani maddhye maddhye prishthani | prishtha
    nyura urah prishthani prishtha nyurah | uro vai va ura uro vai | vai trayastrigmsha straya strigmsha
    vai vai traya strigmshah | trayastrigmsha atma ''tma trayastrigmsha strayastrigmsha atma | trayastrigmsha
    iti trayah atma prishthani prishtha nyatma ''tma prishthani | prishtha nyatmana atmane prishthani
    prishtha nyatmane atmana evai vatmana atmana eva | dyajamana yajamana sta shsharma sharma yajamana
    yajamana sharma nahyante nahyante sharma sharma nahyante | rtyai nahyante nahyante 'na rtyai brihadrathantarabhya
    mbrihadrathantarabhya mana rtyai brihadrathantarabhya brihadrathantarabhyam ya~nti yanti brihadrathantarabhya
    mbrihadrathantarabhyam brihadrathantarabhyamiti brihat vava rathantaragm rathantaram va~va vava rathantaram
    | rathantara masa vasau rathantaragm rathantara masau | dbriha dasa vasau brihat | briha dabhya mabhya
    abhya mevai vabhya mabhya meva | eva yanti yantyevaiva yanti | yantyatho atho yanti yantyatho atho
    anayo ranayo ratho atho anayoh anayo revai vanayo ranayo reva | eva prati pratyevaiva prati | prati
    tishthanti tishthanti prati prati tishthanti | tishthantyete ete tishthanti tishthantyete | ete vai
    va ete ete vai | vai yajnasya yajnasya vai vai yajnasya | njasayani anjasayani yajnasya yajnasya anjasayani
    sruti sruti anjasayani anjasayani sruti | anjasayani ityanjasa ntabhyag sruti sruti tabhya sruti iti
    sruti | tabhya mevaiva tabhya eva suvargagm suvarga mevaiva suvargam | || suvargam ~lokam ~lokagm
    suvargagm suvargam ~lokam | ya~nti yanti lokam ~lokam nco yanti yanti para va eta ete vai va ete |
    ete suvargagm suvarga meta ete suvargam | suvargam ~lokam ~lokagm suvargagm suvargam ~lokam | loka
    mabhyaroha ntyabhyarohanti lokam ~loka mabhyarohanti | abhyarohanti ye ye 'bhyaroha ntyabhyarohanti
    ye | abhyarohantityabhi ye paracinani paracinani ye ye paracinani | paracinani prishthani prishthani
    paracinani paracinani prishthani | ntyupayanti prishthani prishtha nyupayanti | mpratyam mupaya ntyupayanti
    pratyam | nkhshadaha shshadahah pratya shadaho bhavati bhavati shadaha shshadaho bhavati | bhavati
    pratyavarudhyai pratyavarudhyai bhavati bhavati pratyavarudhyai | pratyavarudhya atho atho pratyavarudhyai
    pratyavarudhya atho pratyavarudhya iti prati atho pratishthityai pratishthitya atho atho pratishthityai
    | pratishthitya ubhayo rubhayoh pratishthityai pratishthitya ubhayoh pratishthitya iti prati rlokayo
    rubhayo rubhayo riddhvodu driddhva r ttishthanti tishtha ntyudu tishthanti trivrita strivrita stishthanti
    tishthanti trivritah | trivrito 'dhyadhi trivrita strivrito 'dhi | ntrivrita madhyadhi trivrita trivrita
    mupopa trivrita upa yanti yantyupopa yanti | yanti stomanag stomanam ya~nti yanti stomanam | stomanagm
    sampattyai sampattyai stomanag stomanagm sampattyai | sampattyai prabhavaya prabhavaya sampattyai
    sampattyai prabhavaya | sampattya iti sam rjyotih prabhavaya prabhavaya jyotih | jyoti ragnishtomo
    'gnishtomo jyoti rjyoti ragnishtomah | agnishtomo bhavati bhava tyagnishtomo 'gnishtomo bhavati |
    agnishtoma ityagni mbhavati bhava tyayam | vava sa sa vava vava sah | asma devai vasma dasma deva
    | eva tena tenaivaiva tena | na yanti yanti na na yanti | yanti caturvigmshatiratra shcaturvigmshatiratro
    yanti yanti caturvigmshatiratrah | caturvigmshatiratro bhavati bhavati caturvigmshatiratra shcaturvigmshatiratro
    bhavati | caturvigmshatiratra iti caturvigmshati bhavati caturvigmshati shcaturvigmshati rbhavati
    bhavati caturvigmshatih | caturvigmshati rardhamasa ardhamasa shcaturvigmshati shcaturvigmshati rardhamasah
    | caturvigmshatiriti catuh 'rdhamasa ardhamasa ardhamasa ityardha suvargo loko loka eva suvarge suvarga
    evaiva suvarge | suvarge loke loke suvarge suvarge loke | loke prati prati loke loke prati | prati
    tishthanti tishthanti prati prati tishthanti | tishthantyatho atho tishthanti tishthantyatho atho
    caturvigmshatyakshara caturvigmshatyakshara 'tho atho caturvigmshatyakshara | caturvigmshatyakshara
    gayatri gayatri caturvigmshatyakshara caturvigmshatyakshara gayatri | caturvigmshatyakshareti caturvigmshati
    gayatri gayatri | gayatri brahmavarcasa ngayatri gayatri brahmavarcasam | ngayatriya gayatriya brahmavarcasa
    brahmavarcasamiti brahma gayatri yaivaiva gayatriya gayatri yaiva | mbrahmavarcasa mevaiva brahmavarcasam
    | brahmavarcasa mavava brahmavarcasa mbrahmavarcasa mava | brahmavarcasamiti brahma ava rundhate rundhate
    'vava rundhate | rundhate 'tiratra vatiratrau rundhate rundhate 'tiratrau | atiratra vabhito 'bhito
    'tiratra vatiratra vabhitah | atiratravityati abhito bhavato bhavato 'bhito 'bhito bhavatah | bhavato
    brahmavarcasasya brahmavarcasasya bhavato bhavato brahmavarcasasya | brahmavarcasasya parigrihityai
    parigrihityai brahmavarcasasya brahmavarcasasya parigrihityai | brahmavarcasyeti brahma parigrihitya
    iti pari riksha vai va riksha rksha vai | iya malomaka 'lomakeya miya malomaka alomaka ''si dasi dalomaka
    'lomaka ''sit | sa 'kamayata kamayata sa sa 'kamayata | akamayatau shadhibhi roshadhibhi rakamayata
    kamayatau shadhibhih | rvanaspatibhi roshadhibhi roshadhibhi vanaspatibhih pra pra vanaspatibhi rvanaspatibhih
    pra | vanaspatibhiriti vanaspati pra jayeya jayeya pra pra jayeya | jayeyetiti jayeya jayeyeti | iti
    sa setiti sa | ntrigmshata meta eta strigmshata trigmshatagm ratri ratri ntrigmshatagm ratrih ratri
    rapashya dapashya dratri ratri rapashyat | ttata stato 'pashya dapashya tato vai vai tata stato vai
    | iya moshadhibhi roshadhibhi riya miya moshadhibhih | rvanaspatibhi roshadhibhi roshadhibhi vanaspatibhih
    pra pra vanaspatibhi rvanaspatibhih pra | vanaspatibhiriti vanaspati pra jayata jayata pra pra jayata
    | ajayata ye ye 'jayata jayata ye | ye prajakamah prajakama ye ye prajakamah | prajakamah pashukamah
    pashukamah prajakamah prajakamah pashukamah | prajakama iti praja ssyuh pashukamah pashukama pashukama
    iti pashu ta eta eta ste ta etah | nneta eta asirann | eva jayante jayanta evaiva jayante | prajaya
    jayante jayante prajaya prajaya pashubhih pashubhih prajaya mpashubhih pashubhi riyam | va akshuddhya
