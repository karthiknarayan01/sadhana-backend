id: kena-upanishad-part-3
category: stotram
name:
  english: Kena Upanishad - Part 3
content:
  english: brahma ha devebhyo vijigye tasya ha brahmano vijaye deva amahiyanta || || ta aikshantasmakamevayam
    mmahimeti | taddhaisham vi~jajnau tebhyo ha pradurbabhuva tanna vyajanata kimidam 'gnimabruvanjataveda
    etadvijanihi kimidam || tadabhyadravattamabhyavadatko 'sityagnirva ahamasmityabravijjataveda va ahamasmiti
    || || tasminstvayi kim vi~ryamityapidam sarva nnidadhavetaddaheti | tadupapreyaya sarvajavena tanna
    shashaka dagdhum sa tata eva nivavrite naitadashakam || atha vayumabruvanvayavetadvijanihi kimetadyakshamiti
    tatheti || || tadabhyadravattamabhyavadatko 'siti vayurva ahamasmityabravinmatarishva va ahamasmiti
    || || tasminstvayi kim vi~ryamityapidam sarvamadadiya yadida nnidadhavetadadatsveti tadupapreyaya
    sarvajavena tanna shashakadatum sa tata eva nivavrite naitadashakam || athendramabruvanmaghavannetadvijanihi
    kimetadyakshamiti tatheti tadabhyadravattasmattirodadhe || || sa tasminnevakashe striyamajagama bahushobhamanamumam
    haimavati ntagmhovaca kimetadyakshamiti || || || iti kenopanishadi tritiyah khandah ||
  devanagari: ब्रह्म ह देवेभ्यो विजिग्ये तस्य ह ब्रह्मणो विजये देवा अमहीयन्त ॥ ॥ त ऐक्षन्तास्माकमेवायं
    म्महिमेति । तद्धैषां विँजज्ञौ तेभ्यो ह प्रादुर्बभूव तन्न व्यजानत किमिदं ऽग्निमब्रुवञ्जातवेद एतद्विजानीहि
    किमिदं ॥ तदभ्यद्रवत्तमभ्यवदत्को ऽसीत्यग्निर्वा अहमस्मीत्यब्रवीज्जातवेदा वा अहमस्मीति ॥ ॥ तस्मिन्स्त्वयि
    किं वीँर्यमित्यपीदं सर्व न्निदधावेतद्दहेति । तदुपप्रेयाय सर्वजवेन तन्न शशाक दग्धुं स तत एव निववृते
    नैतदशकं ॥ अथ वायुमब्रुवन्वायवेतद्विजानीहि किमेतद्यक्षमिति तथेति ॥ ॥ तदभ्यद्रवत्तमभ्यवदत्को ऽसीति वायुर्वा
    अहमस्मीत्यब्रवीन्मातरिश्वा वा अहमस्मीति ॥ ॥ तस्मिन्स्त्वयि किं वीँर्यमित्यपीदं सर्वमाददीय यदिद न्निदधावेतदादत्स्वेति
    तदुपप्रेयाय सर्वजवेन तन्न शशाकादातुं स तत एव निववृते नैतदशकं ॥ अथेन्द्रमब्रुवन्मघवन्नेतद्विजानीहि
    किमेतद्यक्षमिति तथेति तदभ्यद्रवत्तस्मात्तिरोदधे ॥ ॥ स तस्मिन्नेवाकाशे स्त्रियमाजगाम बहुशोभमानामुमां
    हैमवती न्ताग्ंहोवाच किमेतद्यक्षमिति ॥ ॥ ॥ इति केनोपनिषदि तृतीयः खण्डः ॥
