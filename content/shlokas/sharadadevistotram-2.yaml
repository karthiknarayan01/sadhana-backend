id: sharadadevistotram-2
category: stotram
name:
  english: sharadadevistotram 2
  devanagari: शारदादेवीस्तोत्रम् २
content:
  english: nyastapadabjayugma madhuravacanagarbham bibhrati kanthavinam | ruciravimalakantirjnanabhaktipradatri
    nikhilabhuvana pujya sharada sharadaiva || 6|| jayatu jayatu devi dhyanagambhiramurti
  devanagari: न्यस्तपादाब्जयुग्मा मधुरवचनगर्भां बिभ्रती कण्ठवीणाम् । रुचिरविमलकान्तिर्ज्ञानभक्तिप्रदात्री
    निखिलभुवन पूज्या शारदा शारदैव ॥ ६॥ जयतु जयतु देवी ध्यानगम्भीरमूर्ति
meaning: {}
