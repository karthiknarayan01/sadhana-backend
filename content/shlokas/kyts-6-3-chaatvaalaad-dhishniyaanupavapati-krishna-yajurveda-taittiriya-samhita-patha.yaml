    सम॑र्धय॒त्यथो॒ ओष॑धीष्वे॒व प॒शू न्प्रति॑ष्ठापयति॒ स्वाहा॑कृतीभ्यः॒ प्रेष्येत्या॑ह य॒ज्ञस्य॒ समि॑ष्ट्यै
    प्राणापा॒नौ वा ए॒तौ प॑शू॒नां त्पृ॑षदा॒ज्यमा॒त्मा व॒पा पृ॑षदा॒ज्यम॑भि॒घार्य॑ व॒पाम॒भि घा॑रयत्या॒त्मन्ने॒व
    प॑शू॒ना म्प्रा॑णापा॒नौ द॑धाति॒ स्वाहो॒र्ध्वन॑भस ङ्ग॑च्छत॒मित्या॑हो॒र्ध्वन॑भा ह स्म॒ वै मा॑रु॒तो दे॒वानां
    वँपा॒श्रप॑णी॒ प्र ह॑रति॒ तेनै॒वैने॒ प्र ह॑रति॒ विषू॑ची॒ प्र ह॑रति॒ तस्मा॒ द्विष्व॑ञ्चौ प्राणापा॒नौ
    ॥ प॒शुमा॒लभ्य॑ पुरो॒डाश॒ न्निर्व॑पति॒ समे॑धमे॒वैन॒मा ल॑भते व॒पया प्र॒चर्य॑ पुरो॒डाशे॑न॒ प्र च॑र॒त्यूर्ग्वै
    पु॑रो॒डाश॒ ऊर्ज॑मे॒व प॑शू॒ना म्म॑द्ध्य॒तो द॑धा॒त्यथो॑ प॒शोरे॒व छि॒द्रमपि॑ दधाति पृषदा॒ज्यस्यो॑प॒हत्य॒
    त्रिः पृ॑च्छति शृ॒तग्ं ह॒वी श्श॑मित॒रिति॒ त्रिष॑त्या॒ हि दे॒वा यो ऽशृ॑तग्ं शृ॒तमाह॒ स एन॑सा प्राणापा॒नौ
    वा ए॒तौ प॑शू॒नां म्प॒शोः खलु॒ वा आल॑ब्धस्य॒ हृद॑यमा॒त्मा त्पृ॑षदा॒ज्येन॒ हृद॑य मभिघा॒रय॑त्या॒त्मन्ने॒व
    प॑शू॒ना म्प्रा॑णापा॒नौ द॑धाति प॒शुना॒ वै दे॒वा ऽमन्यन्त मनु॒ष्या॑ नो॒ ऽन्वाभ॑विष्य॒न्तीति॒ तस्य॒ शिरः॑
    छि॒त्त्वा मेध॒ त्प्र॒क्षस्य॑ प्रक्ष॒त्वं र्भव॑ति॒ समे॑धस्यै॒व वैँ ह्रि॒यमा॑ण॒ग्ं॒ रक्षा॒ग्॒स्यनु॑
    सचन्ते ञ्च हरति॒ रक्ष॑सा॒मप॑हत्यै प॒शोर्वा आल॑ब्धस्य॒ मनो ऽप॑ क्रामति म॒नोता॑यै ह॒विषो॑ ऽवदी॒यमा॑न॒स्यानु॑
    ब्रू॒हीत्या॑ह॒ मन॑ ए॒वास्याव॑ रुन्ध॒ एका॑दशाव॒दाना॒न्यव॑ द्यति॒ दश॒ वै प॒शोः प्रा॒णा आ॒त्मैका॑द॒शो
    यावा॑ने॒व प॒शुस्तस्या ऽव॑ द्य॒त्यथ॑ जि॒ह्वाया॒ अथ॒ वक्ष॑सो॒ यद्वै हृद॑येनाभि॒गच्छ॑ति॒ तज्जि॒ह्वया॑
    वदति॒ यज्जि॒ह्वया॒ वद॑ति॒ तदुर॒सो ऽधि॒ निर्व॑दत्ये॒तद्वै प॒शोर्य॑थापू॒र्वं यँस्यै॒वम॑व॒दाय॑ यथा॒काम॒
    मुत्त॑रेषामव॒द्यति॑ यथा पू॒र्वमे॒वास्य॑ प॒शोरव॑त्त म्भवति मद्ध्य॒तो गु॒दस्याव॑ द्यति मद्ध्य॒तो हि
    प्रा॒ण उ॑त्त॒मस्याव॑ द्य त्युत्त॒मो हि प्रा॒णो यदीत॑रं॒ मु॒भय॑मे॒वाजा॑मि॒ जाय॑मानो॒ वै ब्रा ऋ॑ण॒वा
    जा॑यते ब्रह्म॒चर्ये॒णर् षि॑भ्यो य॒ज्ञेन॑ दे॒वेभ्यः॑ प्र॒जया॑ पि॒तृभ्य॑ ए॒ष वा अ॑नृ॒णो यः पु॒त्री यज्वा
    ब्रह्मचारिवा॒सी तद॑व॒दानै॑ ऽव॑ दयते॒ तद॑व॒दाना॑ना न्ते दे॒वा अ॒ग्निम॑ब्रुव॒ न्त्वया॑ वी॒रेणासु॑रान॒भि
    भ॑वा॒मेति॒ वृँणै प॒शोरु॑द्धा॒रमुद्ध॑रा॒ इति॒ स ए॒तमु॑द्धा॒रमुद॑हरत॒ दोः पू ञ्जघना॒र्धस्य॒ ततो॑ दे॒वा
    अभ॑व॒ त्त्र्य॒ङ्गाणाग्ं॑ समव॒द्यति॒ भ्रातृ॑व्याभिभूत्यै॒ भव॑त्या॒त्मना॒ परा ऽस्य॒ भ्रातृ॑व्यो भवत्यक्ष्ण॒या
    ऽव॑ द्यति॒ तस्मा॑दक्ष्ण॒या प॒शवो ऽङ्गा॑नि॒ प्र ह॑रन्ति॒ प्रति॑ष्ठित्यै ॥ मेद॑सा॒ स्रुचौ॒ प्रोर्णो॑ति॒
    मेदो॑रूपा॒ वै प॒शवो॑ रू॒पमे॒व प॒शुषु॑ दधाति यू॒षन्न॑व॒धाय॒ प्रोर्णो॑ति॒ रसो॒ वा ए॒ष प॑शू॒नां यँद्यू
    रस॑मे॒व प॒शुषु॑ दधाति पा॒र् म्प्रयौ॑ति॒ मद्ध्यं॒ श्वग्ं रस॑ ए॒ष प॑शू॒नां म्प्र॒यौति॑ मद्ध्य॒त ए॒व
    प॑शू॒नाग्ं रस॑ ज्ञ॒म्पय॑न्त्यै॒न्द्रः खलु॒ वै दे॒वत॑या प्रा॒ण ऐ॒न्द्रो॑ ऽपा॒न ऐ॒न्द्रः प्रा॒णो अङ्गे॑अङ्गे॒
    नि दे द्ध्य॒दित्या॑ह प्राणापा॒नावे॒व प॒शुषु॑ दधाति॒ देव॑ त्वष्ट॒र्भूरि॑ ते॒ सग्ं स॑मे॒त्वित्या॑ह त्वा॒ष्ट्रा
    हि दे॒वत॑या प॒शवो॒ विषु॑रूपा॒ य थ्सल॑क्ष्माणो॒ भव॒थेत्या॑ह॒ विषु॑रूपा॒ ह्ये॑ते सन्त॒ हि॒ भव॑न्ति देव॒त्रा
    यन्त॒ ऽनु॑ त्वा मा॒ता पि॒तरो॑ मद॒न्त्वित्या॒हा म्मा॒त्रा पि॒त्रा सु॑व॒र्गं ङ्ग॑मयत्यर्ध॒र्चे व॑साहो॒म
    ञ्जु॑होत्य॒सौ वा अ॑र्ध॒र्च इ॒यम॑र्ध॒र्च इ॒मे ए॒व रसे॑नानक्ति॒ दिशो॑ जुहोति॒ दिश॑ ए॒व रसे॑नान॒क्त्यथो॑
    दि॒ग्भ्य ए॒वोर्ज॒ग्ं॒ रस॒मव॑ रुन्धे प्राणापा॒नौ वा ए॒तौ प॑शू॒नां वै दे॒वत॑या प॒शवो॒ य ऽनु॑ ब्रूहि॒
    वन॒स्पत॑ये॒ प्रेष्येति॑ प्राणापा॒नावे॒व प॒शुषु॑ दधात्य॒न्यस्या न्यस्य समव॒त्तग्ं स॒मव॑द्यति॒ तस्मा॒न्नाना॑रूपाः
    प॒शवो॑ यू॒ष्णोप॑ सिञ्चति॒ रसो॒ वा ए॒ष प॑शू॒नां यँद्यू रस॑मे॒व प॒शुषु॑ दधा॒तीडा॒मुप॑ ह्वयते प॒शवो॒
    वा इडा॑ प॒शूने॒वोप॑ ह्वयते च॒तुरुप॑ ह्वयते॒ चतु॑ष्पादो॒ हि प॒शवो॒ य स्स्या॒दित्य॑मे॒दस्क॒ न्तस्मा॒
    आ द॑द्ध्या॒न्मेदो॑रूपा॒ वै प॒शवो॑ रू॒पेणै॒वैन॑ म्प॒शुभ्यो॒ निर्भ॑जत्यप॒शुरे॒व भ॑वति॒ य थ्स्या॒दिति॒
    मेद॑स्व॒ त्तस्मा॒ आ द॑द्ध्या॒न्मेदो॑रूपा॒ वै प॒शवो॑ रू॒पेणै॒वास्मै॑ प॒शूनव॑ रुन्धे पशु॒माने॒व भ॑वति
    प्र॒जाप॑तिर्य॒ज्ञम॑सृजत॒ स आज्य॑ म्पु॒रस्ता॑दसृजत प॒शु म्म॑द्ध्य॒तः पृ॑षदा॒ज्य त्तस्मा॒दाज्ये॑न प्रया॒जा
    इ॑ज्यन्ते प॒शुना॑ मद्ध्य॒तः पृ॑षदा॒ज्येना॑ स्तस्मा॑दे॒तन्मि॒श्रमि॑व पश्चा य॑जति॒ दश॒ वै प॒शोः प्रा॒णा
    आ॒त्मैका॑द॒शो यावा॑ने॒व प॒शुस्तमनु॑ यजति॒ घ्नन्ति॒ वा ए॒त ज्ञ॒पय॑न्ति वा प्राणापा॒नौ खलु॒ वा ए॒तौ
    प॑शू॒नां त्पृ॑षदा॒ज्येना॑ नूया॒जान् यज॑ति प्राणापा॒नावे॒व प॒शुषु॑ दधाति ॥ ॥ हरिः॑ ओम् ॥ ॥ कृष्ण यजुर्वेदीय
    तैत्तिरीय संहितायां षष्ठकाण्डे तृतीयः प्रश्न
