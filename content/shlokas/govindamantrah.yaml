id: govindamantrah
category: mantra
name:
  english: govindamantrah
  devanagari: गोविन्दमन्त्रः
content:
  english: govindamantrah || viniyogah || asya shrigovindamantrasya trailokyamohanakhya rishih | gayatri
    chandah | trailokyamohano devata | abhishtasiddhyarthe jape viniyogah || || rishyadinyasah || trailokyamohanakhyarishaye
    namah shirasi | gayatrichandase namah mukhe | trailokyamohanadevatayai namah hridi | viniyogaya namah
    sarvange || || karanyasah || om klam angushthabhyam namah | om klim tarjanibhyam namah | om klum madhyamabhyam
    namah | om klaim anamikabhyam namah | om klaum kanishthikabhyam namah | om klah karatalakaraprishthabhyam
    namah || || shadanganyasah || om klam hridayaya namah | om klim shirase svaha | om klum shikhayai
    vashat | om klaim kavacaya hum | om klaum netratrayaya vaushat | om klah astraya phat || || dhyanam
    || kalpadrumamulasamsthitavaram rajopavishtam harim pushpeshukshusharam sarojamapi ca pashankushau
    bibhratam | cakram shankhagadam ca dharayadurahsamshlishtalakshmipriyam nanabhushanaraktacandanayutam
    pitambaram samsmaret || muktaharavirajamanavapusham shrivatsakaustubhabhritam mandasmeramukhambujam
    madhuripum bhakteshtasiddhipradam | shrilakshmyalingitavamabhagamamalam nilambudashyamalam vande hrishikeshamishamavyayapadam
    sarvarthasiddhipradam || || mantrah || klim hrishikeshaya namah || iti shrigovindamantrah sampurnah
    |
  devanagari: गोविन्दमन्त्रः ॥ विनियोगः ॥ अस्य श्रीगोविन्दमन्त्रस्य त्रैलोक्यमोहनाख्य ऋषिः । गायत्री छन्दः
    । त्रैलोक्यमोहनो देवता । अभीष्टसिद्ध्यर्थे जपे विनियोगः ॥ ॥ ऋष्यादिन्यासः ॥ त्रैलोक्यमोहनाख्यऋषये
    नमः शिरसि । गायत्रीछन्दसे नमः मुखे । त्रैलोक्यमोहनदेवतायै नमः हृदि । विनियोगाय नमः सर्वाङ्गे ॥ ॥ करन्यासः
    ॥ ॐ क्लां अङ्गुष्ठाभ्यां नमः । ॐ क्लीं तर्जनीभ्यां नमः । ॐ क्लूं मध्यमाभ्यां नमः । ॐ क्लैं अनामिकाभ्यां
    नमः । ॐ क्लौं कनिष्ठिकाभ्यां नमः । ॐ क्लः करतलकरपृष्ठाभ्यां नमः ॥ ॥ षडङ्गन्यासः ॥ ॐ क्लां हृदयाय नमः
    । ॐ क्लीं शिरसे स्वाहा । ॐ क्लूं शिखायै वषट् । ॐ क्लैं कवचाय हुं । ॐ क्लौं नेत्रत्रयाय वौषट् । ॐ क्लः
    अस्त्राय फट् ॥ ॥ ध्यानम् ॥ कल्पद्रुममूलसंस्थितवरं राजोपविष्टं हरिं पुष्पेषुक्षुशरं सरोजमपि च पाशाङ्कुशौ
    बिभ्रतम् । चक्रं शङ्खगदां च धारयदुरःसंश्लिष्टलक्ष्मीप्रियं नानाभूषणरक्तचन्दनयुतं पीताम्बरं संस्मरेत्
    ॥ मुक्ताहारविराजमानवपुषं श्रीवत्सकौस्तुभभृतं मन्दस्मेरमुखाम्बुजं मधुरिपुं भक्तेष्टसिद्धिप्रदम् । श्रीलक्ष्म्यालिङ्गितवामभागममलं
    नीलाम्बुदश्यामलं वन्दे हृषीकेशमीशमव्ययपदं सर्वार्थसिद्धिप्रदम् ॥ ॥ मन्त्रः ॥ क्लीं हृषीकेशाय नमः ॥
    इति श्रीगोविन्दमन्त्रः सम्पूर्णः ।
