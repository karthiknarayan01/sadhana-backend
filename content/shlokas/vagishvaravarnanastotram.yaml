id: vagishvaravarnanastotram
category: stotram
name:
  english: vagishvaravarnanastotram
  devanagari: वागीश्वरवर्णनास्तोत्रम्
content:
  english: vagishvaravarnanastotram brahmadidevamanujasurapujitangam jnanadisarvanilayam gunarajavantam
    | jnanadhipam gunamayam gunavriddhimantam vagishvaram suragurum satatam namami || 1|| vedadishastraracanakhilamantravijnam
    stotraih kathadibhirasheshasugitashabdam | yam kiryayanti munayo naravanyabhijnam vagishvaram suragurum
    satatam namami || 2|| jnanapradhanakashariramacintyabuddhim vacaspatim divi bhuvi stutakirtidam tam
    | jnaneshvaram tribhuvaneshacaracaram tam vagishvaram suragurum satatam namami || 3|| ratnadishilpaparikalpanapurnajneyam
    citram vicitritagunam janamananiyam | sarvajnakarakadharad hridi brahmapunjam vagishvaram suragurum
    satatam namami || 4|| caryavidhau ratipatim sthiradhairyabodhim dhyanadhipam vividhina sukharanjaniyam
    | vidyapratishthitagurum bhuvanetipurnam vagishvaram suragurum satatam namami || 5|| vanipatim bhujacatushtayabanacapam
    pustam kripanamanisham kramasho dadhanam | sarveshtadam jagati yaccanaravindam vagishvaram suragurum
    satatam namami || 6|| iti shrivagishvaravarnanastotram sampurnam ||
  devanagari: वागीश्वरवर्णनास्तोत्रम् ब्रह्मादिदेवमनुजासुरपूजिताङ्गं ज्ञानादिसर्वनिलयं गुणराजवन्तम् ।
    ज्ञानाधिपं गुणमयं गुणवृद्धिमन्तं वागीश्वरं सुरगुरुं सततं नमामि ॥ १॥ वेदादिशास्त्ररचनाखिलमन्त्रविज्ञं
    स्तोत्रैः कथादिभिरशेषसुगीतशब्दम् । यं कीर्ययन्ति मुनयो नरवाण्यभिज्ञं वागीश्वरं सुरगुरुं सततं नमामि
    ॥ २॥ ज्ञानप्रधानकशरीरमचिन्त्यबुद्धिं वाचस्पतिं दिवि भुवि स्तुतकीर्तिदं तम् । ज्ञानेश्वरं त्रिभुवनेशचराचरं
    तं वागीश्वरं सुरगुरुं सततं नमामि ॥ ३॥ रत्नादिशिल्पपरिकल्पनपूर्णज्ञेयं चित्रं विचित्रितगुणं जनमाननीयम्
    । सर्वज्ञकारकधराद् हृदि ब्रह्मपुञ्जं वागीश्वरं सुरगुरुं सततं नमामि ॥ ४॥ चर्याविधौ रतिपतिं स्थिरधैर्यबोधिं
    ध्यानाधिपं विविधिना सुखरञ्जनीयम् । विद्याप्रतिष्ठितगुरुं भुवनेतिपूर्णं वागीश्वरं सुरगुरुं सततं नमामि
    ॥ ५॥ वाणीपतिं भुजचतुष्टयबाणचापं पुस्तं कृपाणमनिशं क्रमशो दधानम् । सर्वेष्टदं जगति यच्चणारविन्दं वागीश्वरं
    सुरगुरुं सततं नमामि ॥ ६॥ इति श्रीवागीश्वरवर्णनास्तोत्रं सम्पूर्णम् ॥
