id: devarshik-itamgajananastotram
category: stotram
name:
  english: devarshikṟitamgajananastotram
  devanagari: देवर्षिक्ऱितंगजाननस्तोत्रम्
content:
  english: vihinamevam gajananam bhaktiyutam bhajamah || 17|| manovacohinataya susamstham nivrittimatram
    hyajamavyayam tam | tatha'pi devam purasamsthitam tam gajananam bhaktiyutam bhajamah || 18|| vayam
    sudhanya ganapastavena tathaiva martyarcanatastathaiva | ganesharupashca kritastvaya tam gajananam
    bhaktiyutam bhajamah || 19|| gajakhyabijam pravadanti vedastadeva cihnena ca yoginastvam | gacchanti
    tenaiva gajananam tam gajananam bhaktiyutam bhajamah || 20|| puranavedah shivavishnukadyamarah shukadya
    ganapastave vai | vikunthitah kim ca vayam stavamo gajananam bhaktiyutam bhajamah || 21|| mudgala
    uvaca || evam stutva ganeshanam nemuh sarve punah punah | tanutthapya vaco ramyam gajanana uvaca ha
    || 22|| gajanana uvaca || varam bruta mahabhaga devah sarshiganah param | stotrena pritisamyukto dasyami
    vamchitam param || 23|| gajananavacah shrutva harshayukta surarshayah | jagustam bhaktibhavena sashrunetra
    prajapate || 24|| devarshaya ucuh || yadi gajanana svamin prasanno varado'si me | tada bhaktim dridham
    dehi lobhahinam tvadiyakam || 25|| lobhasurasya devesha krita shantih sukhaprada | taya gajadidam
    sarvam varayuktam kritam tvaya || 26|| adhuna devadevesha
  devanagari: विहीनमेवं गजाननं भक्तियुतं भजामः ॥ १७॥ मनोवचोहीनतया सुसंस्थं निवृत्तिमात्रं ह्यजमव्ययं तम्
    । तथाऽपि देवं पुरसंस्थितं तं गजाननं भक्तियुतं भजामः ॥ १८॥ वयं सुधन्या गणपस्तवेन तथैव मर्त्यार्चनतस्तथैव
    । गणेशरूपाश्च कृतास्त्वया तं गजाननं भक्तियुतं भजामः ॥ १९॥ गजाख्यबीजं प्रवदन्ति वेदास्तदेव चिह्नेन
    च योगिनस्त्वाम् । गच्छन्ति तेनैव गजाननं तं गजाननं भक्तियुतं भजामः ॥ २०॥ पुराणवेदाः शिवविष्णुकाद्यामराः
    शुकाद्या गणपस्तवे वै । विकुण्ठिताः किं च वयं स्तवामो गजाननं भक्तियुतं भजामः ॥ २१॥ मुद्गल उवाच ॥ एवं
    स्तुत्वा गणेशानं नेमुः सर्वे पुनः पुनः । तानुत्थाप्य वचो रम्यं गजानन उवाच ह ॥ २२॥ गजानन उवाच ॥ वरं
    ब्रूत महाभागा देवाः सर्षिगणाः परम् । स्तोत्रेण प्रीतिसंयुक्तो दास्यामि वांछितं परम् ॥ २३॥ गजाननवचः
    श्रुत्वा हर्षयुक्ता सुरर्षयः । जगुस्तं भक्तिभावेन साश्रुनेत्रा प्रजापते ॥ २४॥ देवर्षय ऊचुः ॥ यदि गजानन
    स्वामिन् प्रसन्नो वरदोऽसि मे । तदा भक्तिं दृढां देहि लोभहीनां त्वदीयकाम् ॥ २५॥ लोभासुरस्य देवेश कृता
    शान्तिः सुखप्रदा । तया गजदिदं सर्वं वरयुक्तं कृतं त्वया ॥ २६॥ अधुना देवदेवेश
