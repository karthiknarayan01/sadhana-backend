id: kyts-3-2-yo-vai-pavamanaanaam-krishna-yajurveda-taittiriya-samhita-patha
category: stotram
name:
  english: KYTS 3.2 Yo Vai Pavamanaanaam - Krishna Yajurveda Taittiriya Samhita Patha
content:
  english: krishna yajurvediya taittiriya samhitaya ntritiyakande dvitiyah prashnah shri gurubhyo namah
    | harih om || yo vai pavamananamanvarohan 'nu pavamanana rohati na pavamanebhyo 'va cchidyate shyeno
    'si gayatrachanda anu tva ''rabhe svasti ma sa 'si trishtupchanda anu tva ''rabhe svasti ma sa 'si
    jagatichanda anu tva ''rabhe svasti ma samparayetyahaite vai pavamananamanvarohastan 'nu pavamanana
    rohati na pavamanebhyo 'va cchidyate yo vai pavamanasya santatim ve~da sarvamayureti na pura ''yushah
    pra miyate pashuma mpavamanasya graha grihyante 'grihita dronakalasha adhavaniyah putabhri yadagrihitvopakurya
    maddhvaryoh prano 'si prajapataye tveti dronakalashamabhi mrishedindraya tvetyadhavaniyam bhyastva
    devebhya iti putabhrita ntanoti sarvamayureti na pura ''yushah pramiyate pashuma trini vava savananyatha
    tritiyagm savanamava lumpantyanagmshu kurvanta upagmshugmhutvopagmshupatre 'gmshumavasya tantritiyasavane
    'pisrijyabhi shunuyadyada pyayayati tenagmshumadyadabhishunoti tenarjishi sarva thsavananyagmshumanti
    shukravanti samavadviryani karoti dvau samudrau vitatavajuryau paryavartete jathareva padah | tayoh
    pashyanto ati yantyanya 'ti yantyanyam || dve dradhasi satati vasta ekah keshi vishva bhuvanani vidvan
    | tirodhayaityasitam shshukrama datte anuhaya jaryai || deva vai yadyajne 'kurvata tadasura akurvata
    te deva eta ntamatanvatagnihotram vra~tamakurvata tasma njuhvati paurnamasam mpashumakurvata dar mpashumakurvata
    vaishvadeva makurvata varunapraghasa nmaddhyadinnagm savanagm sakamedha stritiyasavanamakurvata tameshamasura
    yajna 'bruvannaddhvartavya va ime deva abhuvanniti tadaddhvarasya thsomena yajate bhavatyatmana para
    'sya bhratrivyo bhavati || nparibhurmagm saha brahmavarcasena sa nah pavasva sha njanaya shamarvate
    shagm rajannoshadhibhyo 'cchinnasya te rayipate suviryasya rayasposhasya daditarah syama | tasya me
    rasva tasya te bhakshiya tasya ta idamunmrije || pranaya me varcoda varcase pavasva panaya vyanaya
    vace mme varcodau varcase pavethag shrotraya ''tmane 'nge bhya ayushe viryaya vishnorindrasya vishvesha
    njatharamasi varcoda me varcase pavasva ko ntva somenatitripam ntva somenamimadagm suprajah prajaya
    bhuyasagm suviro virai ssuvarca varcasa suposhah poshai bhyo me rupebhyo varcoda varcase pavasva tasya
    me rasva tasya te bhakshiya tasya ta idamunmrije || bubhushannave kshetaisha vai patriyah prajapatiryajnah
    prajapatistameva tarpayati sa ena 'bhi pavate brahmavarcasakamo kshetaisha vai patriyah prajapatiryajnah
    prajapatistameva tarpayati sa ena ntripto brahmavarcasenabhi pavata amaya kshetaisha vai patriyah
    prajapatiryajnah prajapatistameva tarpayati sa ena kshetaisha vai patriyah prajapatiryajnah prajapatistameva
    tarpayati sa ena ntriptah pranapanabhyam va~co dakshakratubhya ncakshurbhyag shrotra shurvedih parashurnah
    svastih | yajniya yajnakritah stha te masmin yajna upa hvayaddhvamupa ma dyavaprithivi hvayetamupa
    ssomo agnirupa deva upa yajna upa ma hotra upahave hvayanta 'gnaye makhaghnemakhasya ma yasho 'ryadityahavaniyamupa
    tishthate yajno vai makho ntasma eva namaskritya sadah prasarpatyatmano rtyai namo rudraya makhaghne
    namaskritya ma pahityagni ntasma eva namaskritya sadah prasarpatyatmano rtyai nama indraya makhaghna
    indriya mma nirvadhiriti hotriyamashishamevaitama sha staindriyasya viryasyanirghataya ya vai ssadasyartimarpayanti
    yasta vidva nprasarpati na sadasyartimarcchati namo 'gnaye makhaghna ityahaita vai devata 'rpayanti
    ta ya evam nprasarpati na sadasyartimarcchati ddridhe sthah shithire samici ma 'gmhasaspatagm suryo
    ma devo divyadagmhasaspatu vayurantariksha dagnih prithivya yamah pitribhya ncakshushe namo dive namah
    prithivya ahe daidhishavyodatastishtha 'nyasya sadane sida yo tpakatara unnivata ududvatashca gesha
    dyavaprithivi adyahna ssado vai prasarpanta 'nu prasarpanti ta enamishvara higmsito ssadah prasripya
    dakshinardha 'ganta pitarah pitrimanaham yu~shmabhirbhuyasagm suprajaso maya yuya mbhuyasteti tebhya
    eva namaskritya sadah prasarpatyatmano bhakshehi ma ''visha dirghayutvaya shantanutvaya rayasposhaya
    varcase suprajastvayehi vaso puro vaso priyo me hrido stva bahubhyagm saghyasa ntva deva soma sucaksha
    ava khyesha 'bhibhutih keturyajnanam va~gjushana somasya tripyatu mandra svarvacyaditiranahata shir
    shni vagjushana somasya tripyatvehi vishvacar ssvasti ma harivarna pracara kratve dakshaya rayasposhaya
    suviratayai ma ma rajan vi bibhisho ma me hardi tvisha vadhih | vrishane shushmaya ''yushe varcase
    || vasuma dganasya soma deva te matividah pratassavanasya gayatrachandasa indrapitasya narashagmsapitasya
    pitripitasya madhumata upahutasyopahuto bhakshayami rudrava dganasya soma deva te mativido maddhyandinasya
    savanasya trishtupchandasa indrapitasya narashagm sapitasya pitripitasya madhumata upahutasyopahuto
    bhakshayamyadityava dganasya soma deva te matividastritiyasya savanasya jagatichandasa indrapitasya
    narashagm sapitasya pitripitasya madhumata upahutasyopahuto bhakshayami || apyayasva sametu te vishvatah
    soma vrishniyam | bhava vajasya sangathe || hinva me gatra harivo gana nme ma vititrishah | shivo
    me saptarshinupa tishthasva ma me gah || apama somamamrita abhuma shma jyotiravidama devan | kimasman
    krinavadaratih kimu dhurtiramrita martyasya || yanma atmano minda shanih || punaragnishcakshuradat
    punarindro brihaspatih | punarme ashvina yuva ncakshura dhattamakshyoh || ishtayajushaste deva soma
    stutastomasya shastokthasya harivata indrapitasya madhumata upahutasyopahuto bhakshayami || apurya
    ''ma purayata prajaya ca dhanena ca || eta tte tata ye ca tvamanveta tte pitamaha prapitamaha ye ca
    tvamanvatra pitaro yathabhaga nnamo vah pitaro rasaya namo vah pitara shshushmaya namo vah pitaro
    jivaya namo vah pitara ssvadhayai namo vah pitaro manyave namo vah pitaro ghoraya pitaro namo vo ya
    etasmin ~lokestha yushmag 'nu ya etasmin ~loke stha yuya va~sishtha bhuyasta ye mprajapate na tvadetanyanyo
    vishva jatani parita babhuva | tkamaste juhumastanno astu vayagg syama patayo rayinam || devakritasyainaso
    'vayajanamasi manushyakritasyainaso 'vayajanamasi pitrikritasyainaso 'vayajanamasyaphsu dhautasya
    soma deva te nribhih sutasyeshta yajusha sstutastomasya shastokthasya yo bhakshoashvasaniryo gosanistasya
    te pitribhirbhaksha pahutasyopahuto bhakshayami || trishtupchandasa indrapitasya narashagm sapitasya
    jivaya namo vah pitaro catushcatvarigmshacca riddhyasamadya prishatina 'si vishnorhridayamasyekamisha
    vishnustva 'nu vicakrame bhutirdaddhna ghritena vardhata ntasya meshtasya vitasya dravinama gamyajjyotirasi
    vaishvanara ya~vati dyavaprithivi mahitva yavacca sapta sindhavo vitasthuh | tavantamindra te grahagm
    sahorja grihnamyastritam || ya tkrishnashakunah prishadajyamavamrishecchudra asya pramayuka ssyuryacchva
    'vamrisheccatushpado 'sya pashavah pramayuka dyajamanah pramayuka tpashavo vai prishadajya mpashavo
    va etasya skandanti yasya prishadajyagg mpunargrihnati pashunevasmai punargrihnati prano vai prishadajya
    etasya skandati yasya prishadajyagg mpunargrihnati pranamevasmai punargrihnati hiranyamavadhaya grihnatyamritam
    mpranah prishadajyamamritamevasya prane dadhati shatamana mbhavati shatayuh purusha shshatendriya
    ayushyevendriye pratitishthatyashvamava ghrapayati prajapatyo va ashvah prajapatyah prana ssvadevasmai
    yoneh nnirmimite vi va etasya yajnashchidyate yasya prishadajyagg skandati vaishnavyarca punargrihnati
    yajno vai vishnuryajnenaiva yajnagm sa tpra ca suva pra ca yaja brihaspatirbrahma ''yushmatya rico
    ma gata tanupa thsamnah satya va ashishah santu satya akutaya rita nca vadata stuta devasya savituh
    prasave stutasya stutamasyurja ngamyacchastrasya shastra nduhama ma shastrasya shastra dindriyavanto
    vanamahe dhukshimahi prajamisha '' gamyat || yajno babhuva sa a babhuva saprajajne sa vavridhe | sa
    devanamadhi patirbabhuva so asmagm adhipatin karotu vayagg syama patayo rayinam || yajno va vai nduhe
    yajnapatirva yajna sstutashastrayordohama vidvan ya~jno duhe sa ishtva papiya nbhavati ya enayordoham
    nduhe sa ishtva vasiya nbhavati stutasya stutamasyurja ngamyacchastrasya shastramasyurja nduha ma
    ma shastrasya shastra ngamyadityahaisha vai stutashastrayordohastam yajate duha eva yajnamishtva vasiya
    shyenaya patvane svaha vatthsvayamabhigurtaya namo vishtambhaya dharmane svaha vatthsvayamabhigurtaya
    namah paridhaye janaprathanaya svaha vatthsvayamabhigurtaya nama urje hotranag svaha vatthsvayamabhigurtaya
    namah payase hotranag svaha vatthsvayamabhigurtaya namah prajapataye manave svaha vatthsvayamabhigurtaya
    nama ritamritapa ssuvarvatthsvaha vatthsvayamabhigurtaya namastrimpantagm hotra madho rghritasya yajnapatimrishaya
    enasa ''huh | praja nirbhakta anutapyamana madhavyau stokavapa tau raradha || sa nnastabhyagm srijatuvishvakarma
    ghora rishayo namo astvebhyah | cakshusha esha mmanasashca sandhau brihaspataye mahi sha ddyumannamah
    || namo vishvakarmane sa u patvasmanananyan nmanyamanah | pranasya vidvan thsamare na dhira enashcakriva
    nmahi baddha esham || tam pra munca svastaye npra munca svastaye ye bhakshayanto na vasu nyanrihuh
    | yanagnayo 'nvatapyanta dhishniya iya nteshamavaya durishtyai svishti nkrinotu vishvakarma || namah
    pitribhyo abhi ye no akhyan yajnakrito yajnakama ssudeva akama vo dakshina nna ninima ma nastasma
    denasah papayishta | yavanto vai sadasya ste sarve dakshinya stebhyo yo dakshina nayedaibhyo vrishcyeta
    ya shvakarmanani juhoti sadasyaneva ta tprinatyasme devaso vapushe cikithsata yamashira dampati vamamashnutah
    | puma nputro jayate vindate vasvatha vishve arapa edhate grihah || ashirdaya dampati vamamashnutamarishto
    rayah sacatagm samokasa | ya a nkumbhya saheshtena yamannamati njahatu sah || sarpirgrivi pivaryasya
    jaya pivanah putra akrishaso asya | sahajanirya ssumakhasyamana indraya ''shiragm saha kumbhya t ||
    ashirma urjamuta suprajastvamisha ndadhatu dravinagm savarcasam | sa njayan kshetrani sahasa 'hamindra
    krinvano anyagm adharan thsapatnan || bhutamasi bhute ma dha mukhamasi mukha ndyavaprithivibhya ntva
    parigrihnami vishve pracyavayantu divi deva ndrigmhantarikshe vayagmsi prithivya ssarvamijjagadayakshmagm
    sumana asat | yatha na indra idvishah kevali ssamanasah karat | yatha na shcatvarigmshacca 'ddhvaryumabhyahvayate
    vajramenamabhi pravartayatyukthasha ityaha pratassavana mpratigirya trinyetanyaksharani tripada gayatri
    gayatra ngayatriyaiva pratassavane vajramantardhatta uktham va~cityaha maddhyadinnagm savana mpratigirya
    catvaryetanya ksharani catushpada trishtu mmaddhyadinnagm savana ntrishtubhaiva maddhyandine savane
    vajramantardhatta va~cindrayetyaha va~cindrayetyaha tritiyasavana mpratigirya saptaitanyaksharani
    saptapada shakvari shakvaro vajro vajrenaiva tritiyasavane vajramantardhatte brahmavadino vadanti
    sa tva addhvaryu ssyadyo yathasavana mpratigare chandagmsi sampadaye mmaddhyandine savane pashug stritiyasavana
    ityukthasha ityaha pratassavana mpratigirya trinyetanyaksharani tripada gayatri gayatra mpratassavana
    eva pratigare chandagmsi sampadayatyatho tejo vai gayatri tejah prata nteja eva pratassavana atma
    va~cityaha maddhyandinagm savana mpratigirya catvaryetanyaksharani catushpada trishtu mmaddhyandinagm
    savana mmaddhyadinna eva savane pratigare chandagmsi sampadayatyatho indriyam vai~ trishtugindriya
    mmaddhyadinnagm savana mindriyameva maddhyandine savana atma va~cindrayetyaha tritiyasavana mpratigirya
    saptaitanyaksharani saptapada shakvari shakvarah pashavo jagata ntritiyasavana eva pratigare chandagmsi
    sampadayatyatho pashavo vai jagati pashavastritiyasavana mpashuneva tritiyasavana atma ndhatte yadvai
    hota 'ddhvaryumabhyahvayata avyamasmi dgriha a veviranchogmsa moda iveti pratyahvayate tenaiva tadapa
    hate yatha va ayata mpratikshata evamaddhvaryuh pratigara kshate yadabhi pratigriniyadyatha ''yataya
    samricchate tadrigeva tadyadardharcallupyeta yatha dhavadbhyo hiyate tadrigeva ta tprabahugva ritvijamudgitha
    udgitha evo mricah pranava ukthashagmsina npratigrinatyannada eva bhavatya 'savaddhvaryuryadasina
    shshagm satyasya eva taddhota naityasta iva hiyamatho imameva tena yajamano duhe ya npratigrinatyamushya
    eva tadaddhvaryurnaiti tadaddhvaryurnaiti tishthativa hyasavatho tishthativa hyasavatho amumeva tena
    yajamano duhe yadasina shshagmsati tasmaditah pradana ndeva upa jivanti ya npratigrinati tasmadamutah
    pradana mmanushya upa jivanti ya npratigrinati tasma tpracinagm reto dhiyate praticih praja jayante
    yadvai hota 'ddhvaryumabhyahvayate vajramenamabhi pravartayati parama vartate vajrameva tanni karoti
    || savane vajramantardhatte trinyetanyaksharani mmadhyandinagm savanam 'si vakshasadasi vakpabhya
    ntva kratupabhyamasya yajnasya dhruvasya 'syritasadasi cakshushpabhya ntva kratupabhyamasya yajnasya
    dhruvasya ngrihnamyupayamagrihito 'si shrutasadasi shrotrapabhya ntva kratupabhyamasya yajnasya dhruvasya
    ngrihnami devebhyastva vishvadevebhyastva vishve bhyastva devebhyo vishnavurukramaisha te somastagm
    rakshasva nte dushcaksha ma 'va khyanmayi vasuh purovasurvakpa vaca mme pahi mayi vasurvidadvasushcakshushpashcakshu
    rme pahi mayi vasuh sam mme pahi bhurasi shreshtho rashmina mme pahi dhurasi shreshtho rashminamapanapa
    apana mme pahi yo na indravayu mitravaruna vashvinavabhidasati bhratrivya utpipite shubhaspati idamaha
    'hamuttamashcetayani || pra so agne tavotibhih suvirabhistarati vajakarmabhih | yasya tvagm sakhyamavitha
    || pra hotre purvyam 'gnaye bharata brihat | vipa njyotigmshi bibhrate na vedhase || agne tri te vajina
    tri shadhastha tisraste jihva ritajata purvih | tisra u te tanuvo devavatastabhirnah pahi giro aprayucchann
    || sam vishnu apasaspare asya | jushetham nca dhattamarishtairnah pathibhih parayanta || ubha jigyathurna
    para jayethe na para jigye katarashcanainoh | indrashca vishno yadapaspridhetha vi~ tadairayetham
    || trinyayugmshi tava jatavedastisra ajanirushasaste agne | tabhirdevanamavo yakshi vidvanatha yo~h
    || agnistrini tridhatunya ksheti vidatha kavih | sa trigmrekadashagm iha || yakshacca piprayacca no
    vipro dutah parishkritah | nabhantamanyake same || indravishnu drigmhita shshambarasya nava puro navati
    nca sakagm hatho apratyasurasya viran || uta mata mahisha manvavenadami tva jahati putra devah | atha
    dvritramindro hanishyan thsakhe vishno vitaram || harih om || || krishna yajurvediya taittiriya samhitaya
    ntritiyakande dvitiyah prashna
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय संहिताया न्तृतीयकाण्डे द्वितीयः प्रश्नः श्री गुरुभ्यो नमः । ह॒रिः॒
    ओम् ॥ यो वै पव॑मानानामन्वारो॒हान् ऽनु॒ पव॑माना॒ना रो॑हति॒ न पव॑माने॒भ्यो ऽव॑ च्छिद्यते श्ये॒नो॑ ऽसि
    गाय॒त्रछ॑न्दा॒ अनु॒ त्वा ऽऽर॑भे स्व॒स्ति मा॒ स ऽसि त्रि॒ष्टुप्छ॑न्दा॒ अनु॒ त्वा ऽऽर॑भे स्व॒स्ति मा॒
    स ऽसि॒ जग॑तीछन्दा॒ अनु॒ त्वा ऽऽर॑भे स्व॒स्ति मा॒ सम्पा॑र॒येत्या॑है॒ते वै पव॑मानानामन्वारो॒हास्तान्
    ऽनु॒ पव॑माना॒ना रो॑हति॒ न पव॑माने॒भ्यो ऽव॑ च्छिद्यते॒ यो वै पव॑मानस्य॒ सन्त॑तिं॒ वेँद॒ सर्व॒मायु॑रेति॒
    न पु॒रा ऽऽयु॑षः॒ प्र मी॑यते पशु॒मा म्पव॑मानस्य॒ ग्रहा॑ गृह्य॒न्ते ऽगृ॑हीता द्रोणकल॒श आ॑धव॒नीयः॑ पूत॒भृ
    यदगृ॑हीत्वोपाकु॒र्या मद्ध्व॒र्योः प्रा॒णो ऽसि प्र॒जाप॑तये॒ त्वेति॑ द्रोणकल॒शम॒भि मृ॑शे॒दिन्द्रा॑य॒
    त्वेत्या॑धव॒नीयं॒ भ्यस्त्वा दे॒वेभ्य॒ इति॑ पूत॒भृत॒ न्त॑नोति॒ सर्व॒मायु॑रेति॒ न पु॒रा ऽऽयु॑षः॒ प्रमी॑यते
    पशु॒मा त्रीणि॒ वाव सव॑ना॒न्यथ॑ तृ॒तीय॒ग्ं॒ सव॑न॒मव॑ लुम्पन्त्यन॒ग्ं॒शु कु॒र्वन्त॑ उपा॒ग्ं॒शुग्ंहु॒त्वोपाग्ं॑शुपा॒त्रे
    ऽग्ं॑शुम॒वास्य॒ तन्तृ॑तीयसव॒ने॑ ऽपि॒सृज्या॒भि षु॑णुया॒द्यदा प्या॒यय॑ति॒ तेनाग्ं॑शु॒मद्यद॑भिषु॒णोति॒
    तेन॑र्जी॒षि सर्वा थ्सव॑नान्यग्ंशु॒मन्ति॑ शु॒क्रव॑न्ति स॒माव॑द्वीर्याणि करोति॒ द्वौ स॑मु॒द्रौ वित॑तावजू॒र्यौ
    प॒र्याव॑र्तेते ज॒ठरे॑व॒ पादाः । तयोः॒ पश्य॑न्तो॒ अति॑ यन्त्य॒न्य ऽति॑ यन्त्य॒न्यम् ॥ द्वे द्रध॑सी
    स॒तती॑ वस्त॒ एकः॑ के॒शी विश्वा॒ भुव॑नानि वि॒द्वान् । ति॒रो॒धायै॒त्यसि॑तं॒ श्शु॒क्रमा द॑त्ते अनु॒हाय॑
    जा॒र्यै ॥ दे॒वा वै यद्य॒ज्ञे ऽकु॑र्वत॒ तदसु॑रा अकुर्वत॒ ते दे॒वा ए॒त न्तम॑तन्वताग्निहो॒त्रं व्रँ॒तम॑कुर्वत॒
    तस्मा॒ ञ्जुह्व॑ति पौर्णमा॒सं म्प॒शुम॑कुर्वत दा॒र् म्प॒शुम॑कुर्वत वैश्वदे॒व म॑कुर्वत वरुणप्रघा॒सा न्माद्ध्य॑दिन्न॒ग्ं॒
    सव॑नग्ं साकमे॒धा स्तृतीयसव॒नम॑कुर्वत॒ तमे॑षा॒मसु॑रा य॒ज्ञ ऽब्रुवन्नद्ध्वर्त॒व्या वा इ॒मे दे॒वा अ॑भूव॒न्निति॒
