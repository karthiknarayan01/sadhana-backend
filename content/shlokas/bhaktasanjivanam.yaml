id: bhaktasanjivanam
category: stotram
name:
  english: bhaktasanjivanam
  devanagari: भक्तसन्जिवनम्
content:
  english: bhakta sanjivanam bhakta sanjivanam bhasma vibhushanam bhava bhanjana jaya bhuta ganadhipa
    || nartana lalasa navaraja mriduhasa kirtanapriya jaya bhuta ganadhipa || kalatala navamanigana krita
    bhushana kalapancita jaya bhuta ganadhipa ||
  devanagari: भक्त सञ्जीवनम् भक्त सञ्जीवनं भस्म विभूषणं भव भञ्जना जय भूत गणाधिप ॥ नर्तन लालस नवरज मृदुहास
    कीर्तनप्रिय जय भूत गणाधिपा ॥ कलतल नवमणिगण कृत भूषण कलपाञ्चित जय भूत गणाधिप ॥
meaning: {}
