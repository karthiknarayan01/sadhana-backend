id: kyts-5-5-yadekena-saggsthaapayati-krishna-yajurveda-taittiriya-samhita-patha
category: stotram
name:
  english: KYTS 5.5 Yadekena Saggsthaapayati - Krishna Yajurveda Taittiriya Samhita Patha
content:
  english: krishna yajurvediya taittiriya samhitaya mpancamakande pancamah prashnah shri gurubhyo namah
    | harih om || yadekena sagg sthapayati yajnasya santatya avicchedayaindrah pashavo ye mushkara yadaindra
    'gnibhya alabhyante devata strishtubho yajyanuvakyah ssamriddhyai na devata ndadhati vayave niyutvate
    tuparama labhate tejo 'gnervayustejasa esha a labhyate tasma rvati tadriyanna 'nveti yanna niyutvate
    syadunma dyajamano niyutvate bhavati yajamanasya 'nunmadaya vayumati shvetavati yajyanuvakye bhavata
    ssatejastvaya hiranyagarbha ssamavartatagra ityagharama gharayati prajapatirvai hiranyagarbhah prajapate
    ranurupatvaya sarvani va esha rupani pashuna mpratya labhyate yacchmashrunasta tpurushanagm rupam
    ya~davya iva shaphastadavinam dvayavyo bhavatyeta mevainamabhi sanjananah pashava upa tishthante vayavyah
    karya dvayavyah pashurbhavati tena vayornaiti ya tprajapatyah purodasho bhavati tena prajapaternaiti
    ya ddvadashakapalastena vaishvanarannaitya nnirvapati dikshishyamano ssarva devata vishnuryajno devata
    'gniravamo devatanam evobhayatah parigrihya yajamano 'va rundhe purodashena vai deva amushmin ~loka
    a 'mushmin ~loka riddhnuyamiti sa purodasha 'mushminneva loka riddhnoti yadashtakapala ttrikapalastena
    vaishnava ssamriddhyai yah kamayetasmin ~loka riddhnuyamiti sa caru nkurvitagnerghritam 'sminneva
    loka riddhnotyadityo bhavati yam va~ aditirasyameva prati tishthatyatho asyamevadhi yajna ncinute
    yatha sami garbho 'vapadyate tadrigeva tadartimarcche mpurastannirvape kala agate vijayata evameva
    sam va~thsaramaptva kala agate ''rtimarcchatyesha va agneh priya tanurya shvanarah priyamevasya tanuvamava
    rundhe trinyetani havigmshi bhavanti traya ime loka esham lo~kanagm rohaya || rnirvapati devata thsa
    yo metah punah sancinavaditi ta ntaccityasya cityatvam ncinuta riddhnotyeva kasmai kamagnishciyata
    ityahuragniva nasaniti va agnishciyate 'gnivaneva bhavati kasmai kamagnishciyata ityahurdeva ma vedanniti
    va agnishciyate vidurena ndevah kasmai kamagnishciyata ityahurgrihyasaniti va agnishciyate grihyeva
    bhavati kasmai kamagnishciyata ityahuh pashumanasaniti va agni ciyate pashumaneva shciyate pashumaneva
    bhavati kasmai kamagnishciyata ityahu ssapta ma purusha upa jivaniti va agnishciyate trayah prancastrayah
    pratyanca atma saptama etavanta evainamamushmin ~loka upa jivanti prajapatiragnimacikishata ta mprithivyabravinna
    mayyagni 'ti ma dhakshyati sa tva 'tidahyamana vi dhavishye tva natidhakshyatiti sa imamabhyamrisha
    tprajapatistva sadayatu taya devataya ddhruva sidetimameveshtaka ncinvita tadabhi mrishe tprajapatistva
    sadayatu taya devataya 'natidahaya prajapatirakamayata prajayeyeti sa etamukhyamapashya va~thsaramabibhastato
    vai sa prajayata tasma mbharyah praiva jayate tam npra tvamajanishtha vaya mprajayamaha iti tam va~subhyah
    prayaccha trini ca shatanyasrijanta trayastrigmshata mbharyah praiva jayate ta mprajayamaha iti tagm
    rudrebhyah prayaccha nyabibharustena trini ca shatanyasrijanta trayastrigmshata mbharyah praiva jayate
    tanaditya abruva mpra jayamaha iti tamadityebhyah prayaccha nyabibharustena trini ca shatanyasrijanta
    trayastrigmshata mbharyah praiva jayate tena vai te sahasramasrijantokhagm sahasratamim ya~ evamukhyagm
    sahasram pashumanasaniti va agni tprajapatistva sadayatu taya devataya 'ngirasva dhruva sida tanaditya
    abruva yajusha va esha kriyate yajusha pacyate yajusha vi mucyate yadukha sa va eshaitar mni sa na
    punah prayujyetyahuragne yukshva hi ye tava yukshva hi devahutamagm ityukhaya njuhoti tenaivaina mpunah
    prayunkte tenayatayamni yo va agnim yo~ga agate yunakti yunkte yunjaneshvagne yukshva hi ye tava yukshva
    hi devahutamagm ityahaisha va agneryogastenaivainam yu~nakti yunkte yunjaneshu brahmavadino vadanti
    nyannagnishcetavya va~ esha pratimaya ciyate yadagniryannyanca tprishtita enamahutaya riccheyuryaduttana
    nna patitugm shaknuyadasuvargyo purushashirshamupa dadhati mpurushashirshamupa dadhati mukhata evainamahutaya
    ricchanti nottana ncinute suvargyo 'sya bhavati saurya juhoti cakshurevasmi nprati dadhati dvirjuhoti
    dve hi cakshushi samanya juhoti samanagm hi cakshu ssamriddhyai devasura nnyadadhata taddeva vamabhrita
    'vrinjata tadvamabhrito vamabhrittvam ya~dvamabhrita mupadadhati vamameva taya vasu yajamano bhratrivyasya
    vrinkte hiranyamurdhni bhavati jyotirvai hiranya njyotishaivasya jyotirvamam vri~nkte dviyajurbhavati
    pratishthityai || apo varunasya patnaya asa nta agnirabhyaddhyaya vai~ viradasau svarad ya dvirajavupadadhatime
    evopa dhatte yadva asau retah sincati tadasya tpra jayate ta oshadhayo virudho bhavanti ta agniratti
    ya evam 'nnado bhavati yo retasvi sya ntasya cityamubhe upa daddhyadime evasmai samici retah sincato
    ya ntasya cityamanyamupa daddhyaduttamayamanyagm reta evasya siktamabhyamubhayatah pari grihnati sam
    cana pratyavarohenna ncana pratyavarohenna hime kancana pratyavarohatastadenayorvratam 'mushmin ~loke
    bhavati ya sha 'mushmin ~loke bhavati citti njuhomi manasa ghritena yatha deva iha tra ritavridhah
    samudrasya vayunasya patman juhomi vishvakarmane vishva 'martyagm haviriti svayamatrinnamupadhaya
    juho 'mushmin ~loke bhavati ya evam ve~da suvargaya va esha lokaya ciyate yadagnistasya yadayathapurva
    nkriyate 'suvargyamasya ta 'gnishcitimupadhayabhi mrisheccittimacitti nprishtheva vita vrijina ca
    marta ssvapatyaya deva diti ditimurushyeti yathapurvamevainamupa dhatte prancamena npatu tasmai namah
    prajapati rudro varuno 'gnirdisha npatu tasmai nama eta vai devata etesha stabhyo va esha a vrishcyate
    yah pashushirshanyupa dadhati hiranyeshtaka upa dadhatyetabhya eva devata bhyo namaskaroti brahmavadino
    vadantyagnau gramya vadantyagnau gramya ''ranyanarpayati ki ntata ucchigmshatiti yaddhiranyeshtaka
    upadadha vai~ hiranyamamritenaiva gramyebhyah pashubhyo bheshaja nkaroti nainan hinasti prano vai
    prathama svayamatrinna vyano dvitiya svayamatrinnamupadhaya pranenaiva pranagm samardhayati vyanya
    samardhayati vyanyat ddvitiyamupadhaya vyanenaiva vyanagm samardhayatyapa n yattritiyamupadhaya panenaivapanagm
    samardhayatyatho pranairevainagm samindhe bhurbhuva ssuvariti svayamatrinna upa dadhatime vai loka
    ssvayamatrinna etabhih khaluvai vyahritibhih prajapatih pra 'jayata yadetabhirvyahritibhi ssvayamatrinna
    upadadhatimaneva lokanupadhayaishu lokeshvadhi prajayate pranaya vyanayapanaya vace tva cakshushe
    tva taya devataya ddhruva sidagnina vai deva ssvayamatrinna apashya nta dikshupadadhata tena sarvatashcakshusha
    suvargam lo~kamayan yaccatasra ssvayamatrinna dikshupadadhati sarvatashcakshushaiva tadagnina yajamana
    agna a yahi vitaya ityaha vri~nimaha ityaha hutvaivainam ssamiddhyata ityaha samindha evainamagnirvritrani
    janghanadityaha samiddha evasminnindriya mmanamaha ityaha manuta evainametani va ahnagm rupa ncinute
    'vahnagm rupani rundhe brahmavadino vadanti kasma mniranya ishtaka ayatayamni loka ndragni hi bar
    haspatyeti bruyadindragni ca hi devana yatayamano 'nucaravati bhavatyajamitvaya 'nu caratyatma vai
    loka mprina prano 'nushtu ssarvanyanganyanu carati ta asya sudadohasa ssomagg shrinanti prishnaya
    ityahannam vai~ prishnyannamevava rundhe 'rko va agnirarko 'nnamannamevava rundhe janma vi~shastrishva
    rocane diva ityahemanevasmai lokan jyotishmatah karoti yo va ishtakana ve~da pratyeva tishthati taya
    devataya ddhruva sidetyahaisha va ishtakana ve~da pratyevatishthati || suvargaya va esha lokaya ciyate
    yadagnirvajra ekadashini yadagnavekadashini dvajrenainagm suvargallokadantardaddhyadyanna minuya thsvarubhih
    pashun vyardhayedekayupa va~jrena suvargallokadantardadhati na svarubhih pashun vyardhayati vi va
    esha indriyena viryenardhyate yo nnadhikramatyaindriya nnadhikramatyaindriya mpratishtakamupa daddhyannendriyena
    viryena vyriddhyate rudro va esha yadagnistasya tisra pratici tirashcyanuci tabhyo va esha a vrishcyate
    yo ncitva tisridhanvamayacita mbrahmanaya dadya ttabhya eva namaskarotyatho tabhya eva nnishkrinite
    yatte rudra puro dvato anu vatu te tasmai te rudra sam va~thsarena namaskaromi yatte rudra dakshina
    dhanusta dvato anu vatu te tasmai te rudra parivathsarena namaskaromi yatte rudra pashcaddhanusta
    dvato anu vatu te tasmai te rudredavathsarena namaskaromi yatte rudrottara dvato anu vatu te tasmai
    te rudreduvathsarena namaskaromi yatte rudropari dhanusta dvato anu vatu te tasmai te rudra vathsarena
    namaskaromi rudro va esha yadagni hi sancitametairupa tishthate namaskarai revainagm shamayati ye
    pravishtah prithivimanu | tesha ntvamasyuttamah prano jivatave suva || apa 'gne dakshinabhirapa 'gne
    svagakarenetyahai sha va agneraptistayaivainamapnoti || gayatrena purastadupa tishthate pranamevasmi
    mpakshavoja evasmi ndadhatyritusthayajna yajniyena pucchamritushveva prati tishthati prishthairupa
    tishthate tejo vai prishthani teja evasmi ndadhati prajapatiragnimasrijata so dvaravantiyasya varavantiyatvagg
    shyaitena shyeti akuruta tacchyaitasya shyaitatvam dvaravantiyenopatishthate dvaravantiyenopatishthate
    varayata evainagg shyaitena shyeti kurute prajapater mpratyupa tishthate premanamevasya gacchati pracya
    tva disha sadayami gayatrena chandasa shshira upa dadhami dakshinaya tva disha sadayami traishtubhena
    chandasendrena devataya 'gneh pakshenagneh pakshamupa dadhami praticya tva disha sadayami jagatena
    chandasa savitra devataya 'gneh pucchenagneh pucchamupa dadhamyudi cya tva disha sadayamyanushtubhena
    chandasa mitravarunabhyam evataya 'gneh pakshenagneh pakshamupa dadhamyurdhvaya tva disha sadayami
    panktena chandasa brihaspatina devataya 'gneh prishthenagneh prishthamupa dadhami yo va apa 'mushmin
    ~loke bhavati ya 'mushmin ~loke bhavatyatmeshtaka upa dadhatyesha va agneratma satmanamevagni 'mushmin
    ~loke bhavati ya evam tva disha sadayami agna udadhe ya ta ishuryuva nama taya no mrida tasya sta
    upa jivanto bhuyasmagne duddhra gahya kigmshila vanya ya ta ishuryuva nama taya no mrida tasya sta
    upa jivanto bhuyasma panca va ete 'gnayo yaccitaya udadhireva nama prathamo duddhro dvitiyo gahyastritiyah
    kigmshilashcaturtho vanyah pancamastebhyo yadahutirna juhuyadaddhvaryu nca pra daheyuryadeta ahutirjuhoti
    bhagadheyenaivaina ''rtimarcchatyaddhvaryurna yajamano vamma asa 'kshyoshcakshuh karnayo 'rishta vishvanyangani
    tanu stanuva me saha namaste astu ma ma higmsirapa va etasma tpranah kramanti yo ncinvannadhi kramati
    vamma asa nnasoh prana ityaha prananeva ndhatte yo rudro agnau yo aphsu ya oshadhishu yo rudro vishva
    bhuvana ''vivesha tasmai rudraya namo astvahutibhaga va anye rudra havirbhaga rudra havirbhagah anye
    shatarudriyagm anye shatarudriyagm hutva gavidhuka ncarumetena yajusha caramayamishtakaya dbhagadheyenaivainagm
    shamayati tasya tvai shatarudriyagm hutamityahuryasyaitadagnau kriyata iti vasavastva rudraih purasta
    tpantu pitarastva yamarajanah pitribhirdakshinatah pa ntvadityastva vishvai ntu dyutanastva maruto
    marudbhiruttaratah patu devastvendrajyeshtha varunarajano 'dhasta parishtacca pantu na va etena puto
    na meddhyo na prokshito yadenamatah pracina thsancitamajyena prokshati tena putastena meddhyastena
    prokshitah || samici namasi praci diktasya ste 'gniradhipati rasito rakshita yashcadhipati ryashca
    gopta tabhya nnamastauno mridayata ndvishmo yashca no dveshti tam njambhe dadhamyojasvini namasi dakshina
    di 'dhipatih pridakuh praci namasi pratici di ssvajo 'vasthava nama radhipatni namasi brihati di shshvitro
    vashini namasiya 'dhipatih kalmasha grivo rakshita yashcadhipati ryashca gopta tabhya nnamastau no
    mridayata njambhe dadhamyeta vai devata agni ncitagm rakshanti tabhyo yadahutirna juhuya nca dhyayeyuryadeta
    ahutirjuhoti bhagadheyenaivaina marcchatyaddhvaryurna yajamano hetayo nama stha tesham vah ~puro griha
    agnirva ishava vo~ dakshina grihah pitaro va ishava ssagaro vajrino nama stha tesham ssvapno va ishavo
    gahvaro 'vasthavano nama stha tesham dgriha apo va ishava 'dhipatayo nama stha tesham va~ upari griha
    varsham 'vasvan kravya nama stha parthiva va~ ishavo 'nimisho vatanama ntebhyo vo namaste no mridayata
    te ya ndvishmo yashca no dveshti tam vo~ jambhe dadhami hutado va anye deva ahutado 'nye tanagnicidevobhaya
    nprinati daddhna madhumishrenaita ahutirjuhoti bhagadheyenaivaina nprinatyatho khalvahurishtaka vai
    deva ahutada i njuhotyaparivargamevaina mprapyatamagne sarirasya maddhye njushasva madhumantamurva
    samudriyagm sadanama vishasva || yo va agni mprayujya na vimuncati yatha nparabhavatyevamasyagnih
    para bhavati ta ndhayapamityajyasya purnag njuhotyesha va agnervimoko vimucyaivasma annamapi dadhati
    tasmadahuryashcaivam ve~da yashca na sudhayagm ha vai vaji suhito dadhatityagnirvava vaji tameva ta
    mpritah prinati vasiya indraya rajne sukaro varunaya rajne krishno yamaya rajna rishya rishabhaya
    rajne gavaya rdulaya rajne gaurah purusharajaya markatah kshiprashyenasya vartika nilangoh krimi ssomasya
    rajnah kulunga shshigmshumaro himavato hasti || mayuh prajapatya ulo hali kshno vrishadagmshaste dhatu
    ssarasvatyai sharih shyeta purushava khsarasvate shukah shyetah purushavagaranyo shshaka te paushna
    vace krauncah || nnaptre jasho nakro makarah kulikayaste ngarajo bhagaya kushitaka ati vahaso darvida
    te vayavya digbhyashcakravakah || ssrijaya shayandakaste maitra mrityave svajah kumbhinasah pushkarasado
    lohitahiste tvashtrah pratishrutkayai vahasah || purushamrigashcandramase godha kalaka darvaghataste
    vanaspatinamenyahne krishno ratriyai pikah kshvinka nilashir 'ryamne dhatuh katkatah || shyo mayurah
    shyenaste gandharvanam nkapinjalo rudrana tkundrinaci golattika ta aphsarasa shvadevah pitvo nyankuh
    kashaste nkashyapah kvayih kutarurdatyauhaste sinivalyai brihaspataye shitputah || shaka bhaumi pantrah
    kasho manthilavaste pitrina va~thsaraya lopa kapota uluka ritah krikavakuh savitrah || ruru raudrah
    krikalasa shshakunih pippaka te sharavyayai harino maruto brahmane shargastarakshuh krishna shshva
    caturaksho gardabhasta itarajananamagnaye dhunkshna ntariksha udro madguh plavaste 'pamadityai hagmsasacirindranyai
    kir sha griddhrah shitikakshi va rdhranasaste divya dyavaprithivya rjanyo hagmso vriko vrishadagmshasta
    aindra apamudro ssigmho nakulo vyaghraste mahendraya kamaya parasvan || agneyah krishnagriva ssarasvati
    meshi babhru shshitiprishtho bar 'runo marutah kalmasha aindragna ssagmhito 'dhorama ssavitro varunah
    petvah || ashvastuparo gomrigaste prajapatya a gneyau krishnagrivau tvashtrau lomashasakthau shitiprishthau
    bar haspatyau dhatre prishodara ssauryo balakshah petvah || 'nikavate rohitanji nadhoramau savitrau
    paushnau rajatanabhi vaishvadevau pishangau tuparau marutah kalmasha agneyah krishno ssarasvati meshi
    varunah krishna ekashitipa devastvendrajyeshtha || harih om || || krishna yajurvediya taittiriya samhitaya
    mpancamakande pancamah prashna
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय संहिताया म्पञ्चमकाण्डे पञ्चमः प्रश्नः श्री गुरुभ्यो नमः । ह॒रिः॒
    ओम् ॥ यदेके॑न सग्ग् स्था॒पय॑ति य॒ज्ञस्य॒ सन्त॑त्या॒ अवि॑च्छेदायै॒न्द्राः प॒शवो॒ ये मु॑ष्क॒रा यदै॒न्द्रा
    ऽग्निभ्य॑ आल॒भ्यन्ते॑ दे॒वता स्त्रि॒ष्टुभो॑ याज्यानुवा॒क्याः स्समृ॑द्ध्यै॒ न दे॒वता न्दधाति वा॒यवे॑
    नि॒युत्व॑ते तूप॒रमा ल॑भते॒ तेजो॒ ऽग्नेर्वा॒युस्तेज॑स ए॒ष आ ल॑भ्यते॒ तस्मा र्वाति॑ त॒द्रिय॑ङ्ङ॒ ऽन्वे॑ति॒
    यन्न नि॒युत्व॑ते॒ स्यादुन्मा द्यज॑मानो नि॒युत्व॑ते भवति॒ यज॑मान॒स्या ऽनु॑न्मादाय वायु॒मती श्वे॒तव॑ती
    याज्यानुवा॒क्ये॑ भवत स्सतेज॒स्त्वाय॑ हिरण्यग॒र्भ स्सम॑वर्त॒ताग्र॒ इत्या॑घा॒रमा घा॑रयति प्र॒जाप॑ति॒र्वै
    हि॑रण्यग॒र्भः प्र॒जाप॑ते रनुरूप॒त्वाय॒ सर्वा॑णि॒ वा ए॒ष रू॒पाणि॑ पशू॒ना म्प्रत्या ल॑भ्यते॒ यच्छ्म॑श्रु॒णस्त
    त्पुरु॑षाणाग्ं रू॒पं यँदव्या॑ इव श॒फास्तदवी॑नां॒ द्वा॑य॒व्यो॑ भव॑त्ये॒त मे॒वैन॑म॒भि स॑ञ्जाना॒नाः प॒शव॒
    उप॑ तिष्ठन्ते वाय॒व्यः॑ का॒र्या द्वा॑य॒व्यः॑ प॒शुर्भव॑ति॒ तेन॑ वा॒योर्नैति॒ य त्प्रा॑जाप॒त्यः पु॑रो॒डाशो॒
    भव॑ति॒ तेन॑ प्र॒जाप॑ते॒र्नैति॒ य द्द्वाद॑शकपाल॒स्तेन॑ वैश्वान॒रान्नैत्या न्निर्व॑पति दीक्षि॒ष्यमा॑णो
    स्सर्वा॑ दे॒वता॒ विष्णु॑र्य॒ज्ञो दे॒वता ऽग्निर॑व॒मो दे॒वता॑नां॒ ए॒वोभ॒यतः॑ परि॒गृह्य॒ यज॑मा॒नो ऽव॑
    रुन्धे पुरो॒डाशे॑न॒ वै दे॒वा अ॒मुष्मि॑न् ँलो॒क आ ऽमुष्मि॑न् ँलो॒क ऋ॑द्ध्नुया॒मिति॒ स पु॑रो॒डाश॑ ऽमुष्मि॑न्ने॒व
    लो॒क ऋ॑द्ध्नोति॒ यद॒ष्टाक॑पाल॒ त्त्रि॑कपा॒लस्तेन॑ वैष्ण॒व स्समृ॑द्ध्यै॒ यः का॒मये॑ता॒स्मिन् ँलो॒क
    ऋ॑द्ध्नुया॒मिति॒ स च॒रु ङ्कु॑र्वीता॒ग्नेर्घृ॒तं ऽस्मिन्ने॒व लो॒क ऋ॑द्ध्नोत्यादि॒त्यो भ॑वती॒ यं वाँ
