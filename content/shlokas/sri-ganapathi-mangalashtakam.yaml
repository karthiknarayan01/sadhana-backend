id: sri-ganapathi-mangalashtakam
category: stotram
name:
  english: Sri Ganapathi Mangalashtakam
content:
  english: gajananaya gangeyasahajaya sadatmane | gauripriyatanujaya ganeshayastu mangalam || || nagayajnopavitaya
    natavighnavinashine | nandyadigananathaya nayakayastu mangalam || || ibhavaktraya cendradivanditaya
    cidatmane | ishanapremapatraya ceshtadayastu mangalam || || sumukhaya sushundagrokshiptamritaghataya
    ca | surabrindanishevyaya sukhadayastu mangalam || || caturbhujaya candrardhavilasanmastakaya ca |
    caranavanatanartha taranayastu mangalam || || vakratundaya vatave vandyaya varadaya ca | virupakshasutayastu
    vighnanashaya mangalam || || pramodamodarupaya siddhivijnanarupine | prakrishtapapanashaya phaladayastu
    mangalam || || mangalam gananathaya mangalam harasunave | mangalam vighnarajaya vighnahartrestu mangalam
    || || shlokashtakamidam punyam mangalapradamadarat | pathitavyam prayatnena sarvavighnanivrittaye
    || || iti shri ganapati mangalashtakam |
  devanagari: गजाननाय गाङ्गेयसहजाय सदात्मने । गौरीप्रियतनूजाय गणेशायास्तु मङ्गलम् ॥ ॥ नागयज्ञोपवीताय नतविघ्नविनाशिने
    । नन्द्यादिगणनाथाय नायकायास्तु मङ्गलम् ॥ ॥ इभवक्त्राय चेन्द्रादिवन्दिताय चिदात्मने । ईशानप्रेमपात्राय
    चेष्टदायास्तु मङ्गलम् ॥ ॥ सुमुखाय सुशुण्डाग्रोक्षिप्तामृतघटाय च । सुरबृन्दनिषेव्याय सुखदायास्तु मङ्गलम्
    ॥ ॥ चतुर्भुजाय चन्द्रार्धविलसन्मस्तकाय च । चरणावनतानर्थ तारणायास्तु मङ्गलम् ॥ ॥ वक्रतुण्डाय वटवे वन्द्याय
    वरदाय च । विरूपाक्षसुतायास्तु विघ्ननाशाय मङ्गलम् ॥ ॥ प्रमोदामोदरूपाय सिद्धिविज्ञानरूपिणे । प्रकृष्टपापनाशाय
    फलदायास्तु मङ्गलम् ॥ ॥ मङ्गलं गणनाथाय मङ्गलं हरसूनवे । मङ्गलं विघ्नराजाय विघ्नहर्त्रेस्तु मङ्गलम्
    ॥ ॥ श्लोकाष्टकमिदं पुण्यं मङ्गलप्रदमादरात् । पठितव्यं प्रयत्नेन सर्वविघ्ननिवृत्तये ॥ ॥ इति श्री गणपति
    मङ्गलाष्टकम् ।
