id: dharmashastasahasranamastotra
category: stotram
name:
  english: dharmashastasahasranamastotra
  devanagari: धर्मशास्तासहस्रनामस्तोत्र
content:
  english: om ghrum namah paraya goptre namah || om namo bhagavate bhutanathaya | om shivaputro mahatejah
    shivakaryadhurandharah | shivapradashshivajnani shaivadharmasurakshakah || 1|| shankhadhari suradhyakshashcandramaulissurottamah
    | kameshah kamatejasvi kamadiphalasamyutah || 2|| kalyanah komalangashca kalyanaphaladayakah | karunabdhih
    karmadakshah karunarasasagarah || 3|| jagatpriyo jagadraksho jagadanandadayakah | jayadi shaktisamsevyo
    janahlado jigishukah || 4|| jitendriyo jitakrodho jitadevarisancayah | jaiminyadirshisamsevyo jaramarananashakah
    || 5|| janardanasuto jyeshtho jyeshthadiganasevitah | janmahino jitamitro janakenabhipujitah || 6||
    parameshthi pashupatih pankajasanapujitah | purahanta puratrata paramaishvaryadayakah || 7|| pavanadi
    suraih sevyah pancabrahmaparayanah | parvatitanayo brahma paranandah paratparah || 8|| brahmishto
    jnananirato gunagunanirupakah | gunadhyaksho gunanidhih gopalenabhipujitah || 9|| gorakshako godhanado
    gajarudho gajapriyah | gajagrivo gajaskandho gabhastirgopatih prabhuh || 10|| gramapalo gajadhyaksho
    diggajenabhipujitah | ganadhyaksho ganapatirgavam patiraharpatih || 11|| jatadharo jalanibho jaiminyadirshipujitah
    | jalandharanihanta ca shonakshashshonavasakah || 12|| suradhipashshokahanta shobhakshassuryataijasah
    | surarcitassurairvandyah shonangah shalmalipatih || 13|| sujyotishsharaviraghnah sharaccandranibhananah
    | sanakadimunidhyeyah sarvajnanaprado vibhuh || 14|| halayudho hamsanibho hahahuhu mukhastutah | hariharapriyo
    hamso haryakshasanatatparah || 15|| pavanah pavakanibho bhaktapapavinashanah | bhasitango bhayatrata
    bhanuman bhayanashanah || 16|| tripundrakastrinayanah tripundrangitamastakah | tripuraghno devavaro
    devarikulanashakah || 17|| devasenadhipastejastejorashirdashananah | daruno doshahanta ca dordando
    dandanayakah || 18|| dhanushpanirdharadhyaksho dhaniko dharmavatsalah | dharmajno dharmanirato dhanushshastraparayanah
    || 19|| sthulakarnah sthulatanuh sthulakshah sthulabahukah | tanuttamastanutranastarakastejasampatih
    || 20|| yogishvaro yoganidhiryogesho yogasamsthitah | mandaravatikamatto malayacalavasabhuh || 21||
    mandarakusumaprakhyo mandamarutasevitah | mahabhashca mahavaksha manoharamadarcitah || 22|| mahonnato
    mahakayo mahanetro mahahanuh | marutpujyo manadhano mohano mokshadayakah || 23|| mitro medha mahaujasvi
    mahavarshapradayakah | bhashako bhashyashastrajno bhanuman bhanutaijasah || 24|| bhishagbhavaniputrashca
    bhavataranakaranah | nilambaro nilanibho nilagrivo niranjanah || 25|| netratrayo nishadajno nanaratnopashobhitah
    | ratnaprabho ramaputro ramaya paritoshitah || 26|| rajasevyo rajadhanah ranadordandamanditah | ramano
    renukasevyo rajanicaradaranah || 27|| ishana ibharatsevya ishanatrayanashanah | idavaso hemanibho
    haimaprakarashobhitah || 28|| hayapriyohayagrivo hamso hariharatmajah | hatakasphatikaprakhyo hamsarudhena
    sevitah || 29|| vanavaso vanadhyaksho vamadevo varananah | vaivasvatapatirvishnuh viradrupo vishampatih
    || 30|| venunado varagrivo varabhayakaranvitah | varcasvi vipulagrivo vipulaksho vinodavan || 31||
    vainavaranyavasashca vamadevenasevitah | vetrahasto vedavidhirvamshadevo varangakah || 32|| hrinkaro
    hrimmana hrishto hiranyah hemasambhavah | hutasho hutanishpanno hu~karakritisuprabhah || 33|| havyavaho
    havyakarashcattahaso'parahatah | anurupo rupakarashcajaro'tanurupakah || 34|| hamsamantrashca hutabhuk
    hemambarassulakshanah | nipapriyo nilavasah nidhipalo niratapah || 35|| krodahastastapastrata taporakshastapahvayah
    | murtabhishikto mani ca mantrarupoh mrido manuh || 36|| medhavi medaso mushnuh makaro makaralayah
    | marttando manjukeshashca masapalo mahaushadhih || 37|| shrotriyashshobhamanashca savita sarvadeshikah
    | candrahasashshmashshktah shashibhasashshamadhikah || 38|| sudantassukapolashca shadvarnassampado'dhipah
    | garalah kalakanthashca goneta gomukhaprabhuh || 39|| kaushikah kaladevashca kroshakah krauncabhedakah
    | kriyakarah kripalushca karavirakareruhah || 40|| kandarpadarpahari ca kamadata kapalakah | kailasavaso
    varado virocano vibhavasuh || 41|| babhruvaho baladhyakshah phanamanivibhushanah | sundarassumukhah
    svacchah saphasashca saphakarah || 42|| sharanivrittashshakraptah sharanagatapalakah | tikshnadamshtro
    dirghajihvah pingalakshah pishacaha || 43|| abhedyashcangadardhyashca bhojapalo'tha bhupatih | gridhranaso'vishahyashca
    digdeho dainyadahakah || 44|| badavapuritamukho vyapako vishamocakah | vasantassamarakruddhah pungavah
    pangajasanah || 45|| vishvadarpo nishcitajno nagabharanabhushitah | bharato bhairavakaro bharano vamanakriyah
    || 46|| simhasyassimharupashca senapatissakarakah | sanatanassiddharupi siddhadharmaparayanah || 47||
    adityarupashcapadharashcamritabdhinivasabhuh | yuvarajo yogivarya ushasteja uduprabhah || 48|| devadidevo
    daivajnastamroshthastamralocanah | pingalakshah picchacudah phanamanivibhushitah || 49|| bhujangabhushano
    bhogo bhoganandakaro'vyayah | pancahastena sampujyah pancabanenasevitah || 50|| bhavashsharvo bhanumayah
    prajapatyasvarupakah | svacchandashchandashshastrajno danto devo manuh prabhuh || 51|| dashabhukca
    dashadhyaksho danavanam vinashanah | sahasrakshashsharotpannah shatanandasamagamah || 52|| gridhradrivaso
    gambhiro gandhagrahoganeshvarah | gomedho gandhakavaso gokulaih parivaritah || 53|| pariveshah padajnani
    priyangudrumavasakah | guhavaso guruvaro vandaniyo vadanyakah || 54|| vrittakaro venupanirvinadandadharoharah
    | haimidyo hotrusubhago hautrajnashcaujasam patih || 55|| pavamanah prajatantuprado dandavinashanah
    | nimidyo nimishardhajno nimishakarakaranah || 56|| ligudabho lidakaro lakshmivandyo varaprabhuh |
    idajnah pingalavasah sushumnamadhyasambhavah || 57|| bhikshatano bhimavarca varakirtissabheshvarah
    | vaco'tito varanidhih parivettapramanakah || 58|| aprameyo'niruddhashcapyanantadityasuprabhah | veshapriyo
    vishagraho varadanakarottamah || 59|| vipino vedasarashca vedantaih paritoshitah | vakragamo varcavaca
    baladata vimanavan || 60|| vajrakanto vamshakaro vaturakshavisharadah | vaprakrido viprapujyo velarashishcalalakah
    || 61|| kolahalah krodanetrahkrodasyashca kapalabhrit | kunjaredyo manjuvasahkriyamanah kriyapradah
    || 62|| kridanathah kilahastah kroshamano baladhikah | kanako hotribhagi ca khavasah khacarah khagah
    || 63|| ganako gunanirdushto gunatyagi kushadhipah | patalah patradhari ca palashah putravardhanah
    || 64|| pitrisaccaritah preshthah papabhasmah punashcucih | bhalanetrah phullakeshah phullakalharabhushitah
    || 65|| phanisevyah pattabhadrah paturvagmi vayo'dhikah | coranatyashcoraveshashcoraghnashcauryavardhanah
    || 66|| cancalakshashcamarako maricirmadagamikah | mridabho meshavahashca maithilyo mocakomanuh ||
    67|| manurupo mantradevo mantrarashirmahadridhah | sthupijno dhanadata ca devavandyashcataranah ||
    68|| yajnapriyo yamadhyaksha ibhakrida ibhekshanah | dadhipriyo duradharsho darupalo danujaha || 69||
    damodarodamadharo dakshinamurtirupakah | shacipujyashshankhakarnashcandracudo manupriyah || 70|| gudarupo
    gudakeshah kuladharmaparayanah | kalakantho gadhagatro gotrarupah kuleshvarah || 71|| anandabhairavaradhyo
    hayamedhaphalapradah | dadhyannasaktahridayo gudannapritamanasah || 72|| ghritannasaktahridayo gaurango
    garvabhanjakah | ganeshapujyo gaganah gananam patirurjitah || 73|| chadmahinashshashiradah shatrunam
    patirangirah |
  devanagari: ओं घ्रूं नमः पराय गोप्त्रे नमः ॥ ॐ नमो भगवते भूतनाथाय । ॐ शिवपुत्रो महातेजाः शिवकार्यधुरन्धरः
    । शिवप्रदश्शिवज्ञानी शैवधर्मसुरक्षकः ॥ १॥ शङ्खधारी सुराध्यक्षश्चन्द्रमौलिस्सुरोत्तमः । कामेशः कामतेजस्वी
    कामादिफलसंयुतः ॥ २॥ कल्याणः कोमलाङ्गश्च कल्याणफलदायकः । करुणाब्धिः कर्मदक्षः करुणारससागरः ॥ ३॥ जगत्प्रियो
    जगद्रक्षो जगदानन्ददायकः । जयादि शाक्तिसंसेव्यो जनाह्लादो जिगीषुकः ॥ ४॥ जितेन्द्रियो जितक्रोधो जितदेवारिसञ्चयः
    । जैमिन्यादिर्षिसंसेव्यो जरामरणनाशकः ॥ ५॥ जनार्दनसुतो ज्येष्ठो ज्येष्ठादिगणसेवितः । जन्महीनो जितामित्रो
    जनकेनाभिपूजितः ॥ ६॥ परमेष्ठी पशुपतिः पङ्कजासनपूजितः । पुरहन्ता पुरत्राता परमैश्वर्यदायकः ॥ ७॥ पवनादि
    सुरैः सेव्यः पञ्चब्रह्मपरायणः । पार्वतीतनयो ब्रह्म परानन्दः परात्परः ॥ ८॥ ब्रह्मिष्टो ज्ञाननिरतो गुणागुणनिरुपकः
    । गुणाध्यक्षो गुणनिधिः गोपालेनाभिपुजितः ॥ ९॥ गोरक्षको गोधनदो गजारुढो गजप्रियः । गजग्रिवो गजस्कन्धो
    गभस्तिर्गोपतिः प्रभुः ॥ १०॥ ग्रामपालो गजाध्यक्षो दिग्गजेनाभिपूजितः । गणाध्यक्षो गणपतिर्गवां पतिरहर्पतिः
    ॥ ११॥ जटाधरो जलनिभो जैमिन्यादिर्षिपूजितः । जलन्धरनिहन्ता च शोणाक्षश्शोणवासकः ॥ १२॥ सुराधिपश्शोकहन्ता
    शोभाक्षस्सुर्यतैजसः । सुरार्चितस्सुरैर्वन्द्यः शोणाङ्गः शाल्मलीपतिः ॥ १३॥ सुज्योतिश्शरवीरघ्नः शरच्चन्द्रनिभाननः
    । सनकादिमुनिध्येयः सर्वज्ञानप्रदो विभुः ॥ १४॥ हलायुधो हंसनिभो हाहाहूहू मुखस्तुतः । हरिहरप्रियो हंसो
    हर्यक्षासनतत्परः ॥ १५॥ पावनः पावकनिभो भक्तपापविनाशनः । भसिताङ्गो भयत्राता भानुमान् भयनाशनः ॥ १६॥ त्रिपुण्ड्रकस्त्रिनयनः
    त्रिपुण्ड्राङ्गितमस्तकः । त्रिपुरघ्नो देववरो देवारिकुलनाशकः ॥ १७॥ देवसेनाधिपस्तेजस्तेजोराशिर्दशाननः
    । दारुणो दोषहन्ता च दोर्दण्डो दण्डनायकः ॥ १८॥ धनुष्पाणिर्धराध्यक्षो धनिको धर्मवत्सलः । धर्मज्ञो धर्मनिरतो
    धनुश्शास्त्रपरायणः ॥ १९॥ स्थूलकर्णः स्थूलतनुः स्थूलाक्षः स्थूलबाहुकः । तनूत्तमस्तनुत्राणस्तारकस्तेजसाम्पतिः
    ॥ २०॥ योगीश्वरो योगनिधिर्योगेशो योगसंस्थितः । मन्दारवाटिकामत्तो मलयाचलवासभूः ॥ २१॥ मन्दारकुसुमप्रख्यो
    मन्दमारुतसेवितः । महाभश्च महावक्षा मनोहरमदार्चितः ॥ २२॥ महोन्नतो महाकायो महानेत्रो महाहनुः । मरुत्पूज्यो
    मानधनो मोहनो मोक्षदायकः ॥ २३॥ मित्रो मेधा महौजस्वी महावर्षप्रदायकः । भाषको भाष्यशास्त्रज्ञो भानुमान्
    भानुतैजसः ॥ २४॥ भिषग्भवानीपुत्रश्च भवतारणकारणः । नीलाम्बरो नीलनिभो नीलग्रीवो निरञ्जनः ॥ २५॥ नेत्रत्रयो
    निषादज्ञो नानारत्नोपशोभितः । रत्नप्रभो रमापुत्रो रमया परितोषितः ॥ २६॥ राजसेव्यो राजधनः रणदोर्दण्डमण्डितः
    । रमणो रेणुकासेव्यो राजनीचरदारणः ॥ २७॥ ईशान इभराट्सेव्य ईषणात्रयनाशनः । इडावासो हेमनिभो हैमप्राकारशोभितः
    ॥ २८॥ हयप्रियोहयग्रीवो हंसो हरिहरात्मजः । हाटकस्फटिकप्रख्यो हंसारूढेन सेवितः ॥ २९॥ वनवासो वनाध्यक्षो
    वामदेवो वराननः । वैवस्वतपतिर्विष्णुः विराड्रूपो विशाम्पतिः ॥ ३०॥ वेणुनादो वरग्रिवो वराभयकरान्वितः
    । वर्चस्वी विपुलग्रीवो विपुलाक्षो विनोदवान् ॥ ३१॥ वैणवारण्यवासश्च वामदेवेनसेवितः । वेत्रहस्तो वेदविधिर्वंशदेवो
    वराङ्गकः ॥ ३२॥ ह्रीङ्कारो ह्रीम्मना हृष्टो हिरण्यः हेमसम्भवः । हूताशो हूतनिष्पन्नो हूँकाराकृतिसुप्रभः
    ॥ ३३॥ हव्यवाहो हव्यकरश्चाट्टहासोऽपराहतः । अणुरूपो रूपकरश्चाजरोऽतनुरूपकः ॥ ३४॥ हंसमन्त्रश्च हुतभुक्
    हेमाम्बरस्सुलक्षणः । नीपप्रियो नीलवासाः निधिपालो निरातपः ॥ ३५॥ क्रोडहस्तस्तपस्त्राता तपोरक्षस्तपाह्वयः
    । मूर्ताभिषिक्तो मानी च मन्त्ररूपोः मृडो मनुः ॥ ३६॥ मेधावी मेदसो मुष्णुः मकरो मकरालयः । मार्त्ताण्डो
    मञ्जुकेशश्च मासपालो महौषधिः ॥ ३७॥ श्रोत्रियश्शोभमानश्च सविता सर्वदेशिकः । चन्द्रहासश्श्मश्श्क्तः शशिभासश्शमाधिकः
    ॥ ३८॥ सुदन्तस्सुकपोलश्च षड्वर्णस्सम्पदोऽधिपः । गरलः कालकण्ठश्च गोनेता गोमुखप्रभुः ॥ ३९॥ कौशिकः कालदेवश्च
    क्रोशकः क्रौञ्चभेदकः । क्रियाकरः कृपालुश्च करवीरकरेरुहः ॥ ४०॥ कन्दर्पदर्पहारी च कामदाता कपालकः । कैलासवासो
    वरदो विरोचनो विभावसुः ॥ ४१॥ बभ्रुवाहो बलाध्यक्षः फणामणिविभुषणः । सुन्दरस्सुमुखः स्वच्छः सफासश्च सफाकरः
    ॥ ४२॥ शरानिवृत्तश्शक्राप्तः शरणागतपालकः । तीक्ष्णदंष्ट्रो दीर्घजिह्वः पिङ्गलाक्षः पिशाचहा ॥ ४३॥ अभेद्यश्चाङ्गदार्ढ्यश्च
    भोजपालोऽथ भूपतिः । गृध्रनासोऽविषह्यश्च दिग्देहो दैन्यदाहकः ॥ ४४॥ बाडवापूरितमुखो व्यापको विषमोचकः ।
    वसन्तस्समरक्रुद्धः पुङ्गवः पङ्गजासनः ॥ ४५॥ विश्वदर्पो निश्चितज्ञो नागाभरणभूषितः । भरतो भैरवाकारो भरणो
    वामनक्रियः ॥ ४६॥ सिंहास्यस्सिंहरूपश्च सेनापतिस्सकारकः । सनातनस्सिद्धरूपी सिद्धधर्मपरायणः ॥ ४७॥ आदित्यरूपश्चापधरश्चामृताब्धिनिवासभूः
    । युवराजो योगिवर्य उषस्तेजा उडुप्रभः ॥ ४८॥ देवादिदेवो दैवज्ञस्ताम्रोष्ठस्ताम्रलोचनः । पिङ्गलाक्षः
    पिच्छचूडः फणामणिविभूषितः ॥ ४९॥ भुजङ्गभूषणो भोगो भोगानन्दकरोऽव्ययः । पञ्चहस्तेन सम्पूज्यः पङ्चबाणेनसेवितः
    ॥ ५०॥ भवश्शर्वो भानुमयः प्राजापत्यस्वरुपकः । स्वच्छन्दश्छन्दश्शस्त्रज्ञो दान्तो देवो मनुः प्रभुः ॥
    ५१॥ दशभुक्च दशाध्यक्षो दानवानां विनाशनः । सहस्राक्षश्शरोत्पन्नः शतानन्दसमागमः ॥ ५२॥ गृध्राद्रिवासो
    गम्भिरो गन्धग्राहोगणेश्वरः । गोमेधो गण्ढकावासो गोकुलैः परिवारितः ॥ ५३॥ परिवेषः पदज्ञानी प्रियङ्गुद्रुमवासकः
    । गुहावासो गुरुवरो वन्दनीयो वदान्यकः ॥ ५४॥ वृत्ताकारो वेणुपाणीर्वीणादण्डधरोहरः । हैमीड्यो होत्रुसुभगो
    हौत्रज्ञश्चौजसां पतिः ॥ ५५॥ पवमानः प्रजातन्तुप्रदो दण्डविनाशनः । निमीड्यो निमिषार्धज्ञो निमिषाकारकारणः
    ॥ ५६॥ लिगुडाभो लिडाकारो लक्ष्मीवन्द्यो वरप्रभुः । इडाज्ञः पिङ्गलावासः सुषुम्नामध्यसम्भवः ॥ ५७॥ भिक्षाटनो
    भीमवर्चा वरकीर्तिस्सभेश्वरः । वाचोऽतीतो वरनिधिः परिवेत्ताप्रमाणकः ॥ ५८॥ अप्रमेयोऽनिरुद्धश्चाप्यनन्तादित्यसुप्रभः
    । वेषप्रियो विषग्राहो वरदानकरोत्तमः ॥ ५९॥ विपिनो वेदसारश्च वेदान्तैः परितोषितः । वक्रागमो वर्चवचा
    बलदाता विमानवान् ॥ ६०॥ वज्रकान्तो वंशकरो वटुरक्षाविशारदः । वप्रक्रीडो विप्रपूज्यो वेलाराशिश्चलालकः
    ॥ ६१॥ कोलाहलः क्रोडनेत्रःक्रोडास्यश्च कपालभृत् । कुञ्जरेड्यो मञ्जुवासाःक्रियामानः क्रियाप्रदः ॥ ६२॥
    क्रीडानाथः कीलहस्तः क्रोशमानो बलाधिकः । कनको होतृभागी च खवासः खचरः खगः ॥ ६३॥ गणको गुणनिर्दुष्टो गुणत्यागी
    कुशाधिपः । पाटलः पत्रधारी च पलाशः पुत्रवर्धनः ॥ ६४॥ पितृसच्चरितः प्रेष्ठः पापभस्मः पुनश्चुचिः । भालनेत्रः
    फुल्लकेशः फुल्लकल्हारभूषितः ॥ ६५॥ फणिसेव्यः पट्टभद्रः पटुर्वाग्मी वयोऽधिकः । चोरनाट्यश्चोरवेषश्चोरघ्नश्चौर्यवर्धनः
    ॥ ६६॥ चञ्चलाक्षश्चामरको मरीचिर्मदगामिकः । मृडाभो मेषवाहश्च मैथिल्यो मोचकोमनुः ॥ ६७॥ मनुरूपो मन्त्रदेवो
    मन्त्रराशिर्महादृढः । स्थूपिज्ञो धनदाता च देववन्द्यश्चतारणः ॥ ६८॥ यज्ञप्रियो यमाध्यक्ष इभक्रीड इभेक्षणः
    । दधिप्रियो दुराधर्षो दारुपालो दनूजहा ॥ ६९॥ दामोदरोदामधरो दक्षिणामूर्तिरूपकः । शचीपूज्यश्शङ्खकर्णश्चन्द्रचूडो
    मनुप्रियः ॥ ७०॥ गुडरूपो गुडाकेशः कुलधर्मपरायणः । कालकण्ठो गाढगात्रो गोत्ररूपः कुलेश्वरः ॥ ७१॥ आनन्दभैरवाराध्यो
    हयमेधफलप्रदः । दध्यन्नासक्तहृदयो गुडान्नप्रीतमानसः ॥ ७२॥ घृतान्नासक्तहृदयो गौराङ्गो गर्वभञ्जकः । गणेशपूज्यो
    गगनः गणानां पतिरूर्जितः ॥ ७३॥ छद्महीनश्शशिरदः शत्रूणां पतिरङ्गिराः ।
