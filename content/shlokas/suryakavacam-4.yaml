id: suryakavacam-4
category: kavacha
name:
  english: suryakavacam 4
  devanagari: सूर्यकवचम् ४
content:
  english: shrisuryakavacam 4 ghrinirme shirshakam patu suryah patu lalatakam | adityahpatu netre dve
    shrotre patu divakarah || 1|| nasikam ca trayipatu patu gandasthale ravih | patuttaroshthamushnamshuradharoshthamaharpatih
    || 2|| dantanpatu jagaccakshuh jihvam patu vibhavasuh | vaktram patu sahasramshuh cibukam patu shankarah
    || 3|| parshe patu patangashca prishtham patu prabhakarah | kukshim dinamanih patu madhyam patu prajeshvarah
    || 4|| patvamshumali nabhim me katim patvamaragranih | uru patu grahapatih januni patu sarvagah ||
    5|| janghe dhamanidhih patu gulphau patu prabhakarah | martandah patu padau me patu mitro'khilam vapuh
    || 6|| phalashrutih | idamadityanamakhyam kavacam dharayetsudhih | sadirghayussada bhogi sthirasampadvijayate
    || 7|| dharmasancarino loke trayishri suryavarmana | avritam purusham drashtumashakta bhayavihvalah
    || 8|| mitrayantodbhavantastam tiraskartum tadakshamam | virodhinastu sarvatra tadacaranatatparah
    || 9|| daridryam caiva daurbhagyam marakastviha dahyate | suryeti surarajeti mitreti sumanassmaran
    || 10|| pumanna prapnuyadduhkham shashvatam sukhamashnute | sarvonnatagunadharam suryenashu prakalpitam
    || 11|| kavacam dharayedyastu tasya syadakhilam vasham | sada gadadharasyapi chettum kim ca tadakshayam
    || 12|| tasya haste ca sarvapi siddhih pratyayadayinih | sukhasvape yada surah svasya varmopavishtavan
    || 13|| yajnavalkyo stavan sapta samaksham hridaye muda | sa ghrinissurya adityastapanassavita ravih
    || 14|| karmasakshi dinamanirmitro bhanurvibhurharih | dvadashaitani namani trisandhyam yah pathennarah
    || 15|| tasya mrityubhayam nasti saputro vijayi bhavet | dvabhyam tribhistribhirva
  devanagari: श्रीसूर्यकवचम् ४ घृणिर्मे शीर्षकं पातु सूर्यः पातु ललाटकम् । आदित्यःपातु नेत्रे द्वे श्रोत्रे
    पातु दिवाकरः ॥ १॥ नासिकां च त्रयीपातु पातु गण्डस्थले रविः । पातूत्तरोष्ठमुष्णांशुरधरोष्ठमहर्पतिः ॥
    २॥ दन्तान्पातु जगच्चक्षुः जिह्वां पातु विभावसुः । वक्त्रं पातु सहस्रांशुः चिबुकं पातु शङ्करः ॥ ३॥
    पार्शे पातु पतङ्गश्च पृष्ठं पातु प्रभाकरः । कुक्षिं दिनमणिः पातु मध्यं पातु प्रजेश्वरः ॥ ४॥ पात्वंशुमाली
    नाभिं मे कटिं पात्वमराग्रणीः । ऊरू पातु ग्रहपतिः जानुनी पातु सर्वगः ॥ ५॥ जङ्घे धामनिधिः पातु गुल्फौ
    पातु प्रभाकरः । मार्ताण्डः पातु पादौ मे पातु मित्रोऽखिलं वपुः ॥ ६॥ फलश्रुतिः । इदमादित्यनामाख्यं कवचं
    धारयेत्सुधीः । सदीर्घायुस्सदा भोगी स्थिरसम्पद्विजायते ॥ ७॥ धर्मसञ्चारिणो लोके त्रयीश्री सूर्यवर्मणा
    । आवृतं पुरुषं द्रष्टुमशक्ता भयविह्वलाः ॥ ८॥ मित्रयन्तोद्भवन्तस्तं तिरस्कर्तुं तदक्षमम् । विरोधिनस्तु
    सर्वत्र तदाचरणतत्पराः ॥ ९॥ दारिद्र्यं चैव दौर्भाग्यं मारकस्त्विह दह्यते । सूर्येति सुरराजेति मित्रेति
    सुमनास्स्मरन् ॥ १०॥ पुमान्न प्राप्नुयाद्दुःखं शाश्वतं सुखमश्नुते । सर्वोन्नतगुणाधारं सूर्येणाशु प्रकल्पितम्
    ॥ ११॥ कवचं धारयेद्यस्तु तस्य स्यादखिलं वशम् । सदा गदाधरस्यापि छेत्तुं किं च तदक्षयम् ॥ १२॥ तस्य हस्ते
    च सर्वापि सिद्धीः प्रत्ययदायिनीः । सुखस्वपे यदा सूरः स्वस्य वर्मोपविष्टवान् ॥ १३॥ याज्ञवल्क्यो स्तवान्
    सप्त समक्षं हृदये मुदा । स घृणिस्सूर्य आदित्यस्तपनस्सविता रविः ॥ १४॥ कर्मसाक्षी दिनमणिर्मित्रो भानुर्विभुर्हरिः
    । द्वादशैतानि नामानि त्रिसन्ध्यं यः पठेन्नरः ॥ १५॥ तस्य मृत्युभयं नास्ति सपुत्रो विजयी भवेत् । द्वाभ्यां
    त्रिभिस्त्रिभिर्व
