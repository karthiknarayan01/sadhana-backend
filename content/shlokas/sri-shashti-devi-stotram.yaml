id: sri-shashti-devi-stotram
category: stotram
name:
  english: Sri Shashti Devi Stotram
content:
  english: dhyanam shrimanmataramambikam vidhimanojatam sadabhishtadam skandeshtam ca jagatprasum vijayadam
    satputra saubhagyadam | sadratnabharananvitam sakarunam shubhram shubham suprabham shashthamsham prakriteh
    param bhagavatim shridevasenam bhaje || || shashthamsham prakriteh shuddham supratishtham ca suvratam
    suputradam ca shubhadam dayarupam jagatprasum | shvetacampakavarnabham raktabhushanabhushitam pavitrarupam
    paramam devasena param bhaje || || stotram namo devyai mahadevyai siddhyai shantyai namo namah | shubhayai
    devasenayai shashthidevyai namo namah || || varadayai putradayai dhanadayai namo namah | sukhadayai
    mokshadayai shashthidevyai namo namah || || srishtyai shashthamsharupayai siddhayai ca namo namah
    | mayayai siddhayoginyai shashthidevyai namo namah || || sarayai sharadayai ca paradevyai namo namah
    | baladhishtatridevyai ca shashthidevyai namo namah || || kalyanadayai kalyanyai phaladayai ca karmanam
    | pratyakshayai sarvabhaktanam shashthidevyai namo namah || || pujyayai skandakantayai sarvesham sarvakarmasu
    | devarakshanakarinyai shashthidevyai namo namah || || shuddhasattvasvarupayai vanditayai nrinam sada
    | himsakrodhavarjitayai shashthidevyai namo namah || || dhanam dehi priyam dehi putram dehi sureshvari
    | manam dehi jayam dehi dvisho jahi maheshvari || || dharmam dehi yasho dehi shashthidevi namo namah
    | dehi bhumim prajam dehi vidyam dehi supujite | kalyanam ca jayam dehi shashthidevyai namo namah
    || || phalashriti iti devim ca samstutya labhetputram priyavratam | yashashvinam ca rajendram shashthidevi
    prasadatah || || shashthistotramidam brahman yah shrinoti tu vatsaram | aputro labhate putram varam
    sucira jivanam || || varshamekam ca ya bhaktya samstutyedam shrinoti ca | sarvapapadvinirmukta mahavandhya
    prasuyate || || viram putram ca guninam vidyavantam yashasvinam | sucirayushyavantam ca sute devi
    prasadatah || || kakavandhya ca ya nari mritavatsa ca ya bhavet | varsham shritva labhetputram shashthidevi
    prasadatah || || rogayukte ca bale ca pitamata shrinoti cet | masena mucyate rogan shashthidevi prasadatah
    || || jaya devi jaganmatah jagadanandakarini | prasida mama kalyani namaste shashthidevate || || iti
    shri shashthidevi stotram |
  devanagari: ध्यानम् श्रीमन्मातरमम्बिकां विधिमनोजातां सदाभीष्टदां स्कन्देष्टां च जगत्प्रसूं विजयदां सत्पुत्र
    सौभाग्यदाम् । सद्रत्नाभरणान्वितां सकरुणां शुभ्रां शुभां सुप्रभां षष्ठांशां प्रकृतेः परं भगवतीं श्रीदेवसेनां
    भजे ॥ ॥ षष्ठांशां प्रकृतेः शुद्धां सुप्रतिष्ठां च सुव्रतां सुपुत्रदां च शुभदां दयारूपां जगत्प्रसूम्
    । श्वेतचम्पकवर्णाभां रक्तभूषणभूषितां पवित्ररूपां परमं देवसेना परां भजे ॥ ॥ स्तोत्रम् नमो देव्यै महादेव्यै
    सिद्ध्यै शान्त्यै नमो नमः । शुभायै देवसेनायै षष्ठीदेव्यै नमो नमः ॥ ॥ वरदायै पुत्रदायै धनदायै नमो नमः
    । सुखदायै मोक्षदायै षष्ठीदेव्यै नमो नमः ॥ ॥ सृष्ट्यै षष्ठांशरूपायै सिद्धायै च नमो नमः । मायायै सिद्धयोगिन्यै
    षष्ठीदेव्यै नमो नमः ॥ ॥ सारायै शारदायै च परादेव्यै नमो नमः । बालाधिष्टातृदेव्यै च षष्ठीदेव्यै नमो
    नमः ॥ ॥ कल्याणदायै कल्याण्यै फलदायै च कर्मणाम् । प्रत्यक्षायै सर्वभक्तानां षष्ठीदेव्यै नमो नमः ॥ ॥
    पूज्यायै स्कन्दकान्तायै सर्वेषां सर्वकर्मसु । देवरक्षणकारिण्यै षष्ठीदेव्यै नमो नमः ॥ ॥ शुद्धसत्त्वस्वरूपायै
    वन्दितायै नृणां सदा । हिंसाक्रोधवर्जितायै षष्ठीदेव्यै नमो नमः ॥ ॥ धनं देहि प्रियां देहि पुत्रं देहि
    सुरेश्वरि । मानं देहि जयं देहि द्विषो जहि महेश्वरि ॥ ॥ धर्मं देहि यशो देहि षष्ठीदेवी नमो नमः । देहि
    भूमिं प्रजां देहि विद्यां देहि सुपूजिते । कल्याणं च जयं देहि षष्ठीदेव्यै नमो नमः ॥ ॥ फलशृति इति देवीं
    च संस्तुत्य लभेत्पुत्रं प्रियव्रतम् । यशश्विनं च राजेन्द्रं षष्ठीदेवि प्रसादतः ॥ ॥ षष्ठीस्तोत्रमिदं
    ब्रह्मान् यः शृणोति तु वत्सरम् । अपुत्रो लभते पुत्रं वरं सुचिर जीवनम् ॥ ॥ वर्षमेकं च या भक्त्या संस्तुत्येदं
    शृणोति च । सर्वपापाद्विनिर्मुक्ता महावन्ध्या प्रसूयते ॥ ॥ वीरं पुत्रं च गुणिनं विद्यावन्तं यशस्विनम्
    । सुचिरायुष्यवन्तं च सूते देवि प्रसादतः ॥ ॥ काकवन्ध्या च या नारी मृतवत्सा च या भवेत् । वर्षं शृत्वा
    लभेत्पुत्रं षष्ठीदेवि प्रसादतः ॥ ॥ रोगयुक्ते च बाले च पितामाता शृणोति चेत् । मासेन मुच्यते रोगान्
    षष्ठीदेवि प्रसादतः ॥ ॥ जय देवि जगन्मातः जगदानन्दकारिणि । प्रसीद मम कल्याणि नमस्ते षष्ठीदेवते ॥ ॥ इति
    श्री षष्ठीदेवि स्तोत्रम् ।
