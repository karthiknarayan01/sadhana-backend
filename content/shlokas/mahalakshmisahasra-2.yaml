id: mahalakshmisahasra-2
category: sahasranama
name:
  english: mahalakshmisahasra
  devanagari: महालक्ष्मिसहस्र
content:
  english: rinushvavahito bhutva paramaishvaryabhutidam | devyakhyasmritimatrena daridryam yati bhasmatam
    || 31|| atha mahalakshmisahasranamastotram athava kamalasahasranamastotram | shrih padma prakritih
    sattva shanta cicchaktiravyaya | kevala nishkala shuddha vyapini vyomavigraha || 1|| vyomapadmakritadhara
    para vyomamritodbhava | nirvyoma vyomamadhyastha pancavyomapadashrita || 2|| acyuta vyomanilaya paramanandarupini
    | nityashuddha nityatripta nirvikara nirikshana || 3|| jnanashaktih kartrishaktirbhoktrishaktih shikhavaha
    | snehabhasa nirananda vibhutirvimalacala || 4|| ananta vaishnavi vyakta vishvananda vikasini | shaktirvibhinnasarvartih
    samudraparitoshini || 5|| murtih sanatani hardi nistaranga niramaya | jnanajneya jnanagamya jnanajneyavikasini
    || 6|| svacchandashaktirgahana nishkamparcih sunirmala | svarupa sarvaga para brimhini sugunorjita
    || 7|| akalanka niradhara nihsankalpa nirashraya | asankirna sushanta ca shashvati bhasuri sthira
    || 8|| anaupamya nirvikalpa niyantri yantravahini | abhedya bhedini bhinna bharati vaikhari khaga
    || 9|| agrahya grahika gudha gambhira vishvagopini | anirdeshya pratihata nirbija pavani para || 10||
    apratarkya parimita bhavabhrantivinashini | eka dvirupa trividha asankhyata sureshvari || 11|| supratishtha
    mahadhatri sthitirvriddhirdhruva gatih | ishvari mahima riddhih pramoda ujjvalodyama || 12|| akshaya
    varddhamana ca suprakasha vihangama | niraja janani nitya jaya rocishmati shubha || 13|| taponuda
    ca jvala ca sudiptishcamshumalini | aprameya tridha sukshma para nirvanadayini || 14|| avadata sushuddha
    ca amoghakhya parampara | sandhanaki shuddhavidya sarvabhutamaheshvari || 15|| lakshmistushtirmahadhira
    shantirapurananava | anugraha shaktiradya jagajjyeshtha jagadvidhih || 16|| satya prahva kriya yogya
    aparna hladini shiva | sampurnahladini shuddha jyotishmatyamritavaha || 17|| rajovatyarkapratibha''karshini
    karshini rasa | para vasumati devi kantih shantirmatih kala || 18|| kala kalankarahita vishaloddipani
    ratih | sambodhini harini ca prabhava bhavabhutida || 19|| amritasyandini jiva janani khandika sthira
    | dhuma kalavati purna bhasura sumatirasa || 20|| shuddha dhvanih sritih srishtirvikritih krishtireva
    ca | prapani pranada prahva vishva panduravasini || 21|| avanirvajranalika citra brahmandavasini |
    anantarupanantatmanantasthanantasambhava || 22|| mahashaktih pranashaktih pranadatri ritambhara |
    mahasamuha nikhila icchadhara sukhavaha || 23|| pratyakshalakshmirnishkampa prarohabuddhigocara |
    nanadeha mahavarta bahudehavikasini || 24|| sahasrani pradhana ca nyayavastuprakashika | sarvabhilashapurneccha
    sarva sarvarthabhashini || 25|| nanasvarupaciddhatri shabdapurva puratani | vyaktavyakta jivakesha
    sarvecchaparipurita || 26|| sankalpasiddha sankhyeya tattvagarbha dharavaha | bhutarupa citsvarupa
    triguna gunagarvita || 27|| prajapatishvari raudri sarvadhara sukhavaha | kalyanavahika kalya kalikalmashanashini
    || 28|| nirupodbhinnasantana suyantra trigunalaya | mahamaya yogamaya mahayogeshvari priya || 29||
    mahastri vimala kirtirjaya lakshmirniranjana | prakritirbhagavanmaya shaktirnidra yashaskari || 30||
    cinta buddhiryashah prajna shantih supritivarddhini | pradyumnamata sadhvi ca sukhasaubhagyasiddhida
    || 31|| kashtha nishtha pratishtha ca jyeshtha shreshtha jayavaha | sarvatishayini pritirvishvashaktirmahabala
    || 32|| varishtha vijaya vira jayanti vijayaprada | hridgriha gopini guhya ganagandharvasevita ||
    33|| yogishvari yogamaya yogini yogasiddhida | mahayogeshvaravrita yoga yogeshvarapriya || 34|| brahmendrarudranamita
    surasuravaraprada | trivartmaga trilokastha trivikramapadodbhava || 35|| sutara tarini tara durga
    santarini para | sutarini tarayanti bhuritareshvaraprabha || 36|| guhyavidya yajnavidya mahavidya
    sushobhita | adhyatmavidya vighneshi padmastha parameshthini || 37|| anvikshiki trayi varta dandanitirnayatmika
    | gauri vagishvari goptri gayatri kamalodbhava || 38|| vishvambhara vishvarupa vishvamata vasuprada
    | siddhih svaha svadha svastih sudha sarvarthasadhini || 39|| iccha srishtirdyutirbhutih kirtih shraddha
    dayamatih | shrutirmedha dhritirhrih shrirvidya vibudhavandita || 40|| anasuya ghrina nitirnirvritih
    kamadhukkara | pratijna santatirbhutirdyauh prajna vishvamanini || 41|| smritirvagvishvajanani pashyanti
    madhyama sama | sandhya medha prabha bhima sarvakara sarasvati || 42|| kanksha maya mahamaya mohini
    madhavapriya | saumyabhoga mahabhoga bhogini bhogadayini || 43|| sudhautakanakaprakhya suvarnakamalasana
    | hiranyagarbha sushroni harini ramani rama || 44|| candra hiranmayi jyotsna ramya shobha shubhavaha
    | trailokyamandana nari nareshvaravararcita || 45|| trailokyasundari rama mahavibhavavahini | padmastha
    padmanilaya padmamalavibhushita || 46|| padmayugmadhara kanta divyabharanabhushita | vicitraratnamukuta
    vicitrambarabhushana || 47|| vicitramalyagandhadhya vicitrayudhavahana | mahanarayani devi vaishnavi
    viravandita || 48|| kalasankarshini ghora tattvasankarshinikala | jagatsampurani vishva mahavibhavabhushana
    || 49|| varuni varada vyakhya ghantakarnavirajita | nrisimhi bhairavi brahmi bhaskari vyomacarini
    || 50|| aindri kamadhenuh srishtih kamayonirmahaprabha | drishta kamya vishvashaktirbijagatyatmadarshana
    || 51|| garudarudhahridaya candri shrirmadhuranana | mahograrupa varahi narasimhi hatasura || 52||
    yugantahutabhugjvala karala pingalakala | trailokyabhushana bhima shyama trailokyamohini || 53|| mahotkata
    maharakta mahacanda mahasana | shankhini lekhini svastha likhita khecareshvari || 54|| bhadrakali
    caikavira kaumari bhavamalini | kalyani kamadhugjvalamukhi cotpalamalika || 55|| balika dhanada surya
    hridayotpalamalika | ajita varshini ritirbharunda garudasana || 56|| vaishvanari mahamaya mahakali
    vibhishana | mahamandaravibhava shivananda ratipriya || 57|| udritih padmamala ca dharmavega vibhavani
    | satkriya devasena ca hiranyarajatashraya || 58|| sahasavartamana ca hastinadaprabodhini | hiranyapadmavarna
    ca haribhadra sudurddhara || 59|| surya hiranyaprakatasadrishi hemamalini | padmanana nityapushta
    devamata mritodbhava || 60|| mahadhana ca ya sha
  devanagari: ृणुष्वावहितो भूत्वा परमैश्वर्यभूतिदम् । देव्याख्यास्मृतिमात्रेण दारिद्र्यं याति भस्मताम्
    ॥ ३१॥ अथ महालक्ष्मीसहस्रनामस्तोत्रम् अथवा कमलासहस्रनामस्तोत्रम् । श्रीः पद्मा प्रकृतिः सत्त्वा शान्ता
    चिच्छक्तिरव्यया । केवला निष्कला शुद्धा व्यापिनी व्योमविग्रहा ॥ १॥ व्योमपद्मकृताधारा परा व्योमामृतोद्भवा
    । निर्व्योमा व्योममध्यस्था पञ्चव्योमपदाश्रिता ॥ २॥ अच्युता व्योमनिलया परमानन्दरूपिणी । नित्यशुद्धा
    नित्यतृप्ता निर्विकारा निरीक्षणा ॥ ३॥ ज्ञानशक्तिः कर्तृशक्तिर्भोक्तृशक्तिः शिखावहा । स्नेहाभासा निरानन्दा
    विभूतिर्विमलाचला ॥ ४॥ अनन्ता वैष्णवी व्यक्ता विश्वानन्दा विकासिनी । शक्तिर्विभिन्नसर्वार्तिः समुद्रपरितोषिणी
    ॥ ५॥ मूर्तिः सनातनी हार्दी निस्तरङ्गा निरामया । ज्ञानज्ञेया ज्ञानगम्या ज्ञानज्ञेयविकासिनी ॥ ६॥ स्वच्छन्दशक्तिर्गहना
    निष्कम्पार्चिः सुनिर्मला । स्वरूपा सर्वगा पारा बृंहिणी सुगुणोर्जिता ॥ ७॥ अकलङ्का निराधारा निःसङ्कल्पा
    निराश्रया । असङ्कीर्णा सुशान्ता च शाश्वती भासुरी स्थिरा ॥ ८॥ अनौपम्या निर्विकल्पा नियन्त्री यन्त्रवाहिनी
    । अभेद्या भेदिनी भिन्ना भारती वैखरी खगा ॥ ९॥ अग्राह्या ग्राहिका गूढा गम्भीरा विश्वगोपिनी । अनिर्देश्या
    प्रतिहता निर्बीजा पावनी परा ॥ १०॥ अप्रतर्क्या परिमिता भवभ्रान्तिविनाशिनी । एका द्विरूपा त्रिविधा असङ्ख्याता
    सुरेश्वरी ॥ ११॥ सुप्रतिष्ठा महाधात्री स्थितिर्वृद्धिर्ध्रुवा गतिः । ईश्वरी महिमा ऋद्धिः प्रमोदा उज्ज्वलोद्यमा
    ॥ १२॥ अक्षया वर्द्धमाना च सुप्रकाशा विहङ्गमा । नीरजा जननी नित्या जया रोचिष्मती शुभा ॥ १३॥ तपोनुदा
    च ज्वाला च सुदीप्तिश्चांशुमालिनी । अप्रमेया त्रिधा सूक्ष्मा परा निर्वाणदायिनी ॥ १४॥ अवदाता सुशुद्धा
    च अमोघाख्या परम्परा । सन्धानकी शुद्धविद्या सर्वभूतमहेश्वरी ॥ १५॥ लक्ष्मीस्तुष्टिर्महाधीरा शान्तिरापूरणानवा
    । अनुग्रहा शक्तिराद्या जगज्ज्येष्ठा जगद्विधिः ॥ १६॥ सत्या प्रह्वा क्रिया योग्या अपर्णा ह्लादिनी शिवा
    । सम्पूर्णाह्लादिनी शुद्धा ज्योतिष्मत्यमृतावहा ॥ १७॥ रजोवत्यर्कप्रतिभाऽऽकर्षिणी कर्षिणी रसा । परा
    वसुमती देवी कान्तिः शान्तिर्मतिः कला ॥ १८॥ कला कलङ्करहिता विशालोद्दीपनी रतिः । सम्बोधिनी हारिणी च
    प्रभावा भवभूतिदा ॥ १९॥ अमृतस्यन्दिनी जीवा जननी खण्डिका स्थिरा । धूमा कलावती पूर्णा भासुरा सुमतीरसा
    ॥ २०॥ शुद्धा ध्वनिः सृतिः सृष्टिर्विकृतिः कृष्टिरेव च । प्रापणी प्राणदा प्रह्वा विश्वा पाण्डुरवासिनी
    ॥ २१॥ अवनिर्वज्रनलिका चित्रा ब्रह्माण्डवासिनी । अनन्तरूपानन्तात्मानन्तस्थानन्तसम्भवा ॥ २२॥ महाशक्तिः
    प्राणशक्तिः प्राणदात्री ऋतम्भरा । महासमूहा निखिला इच्छाधारा सुखावहा ॥ २३॥ प्रत्यक्षलक्ष्मीर्निष्कम्पा
    प्ररोहाबुद्धिगोचरा । नानादेहा महावर्ता बहुदेहविकासिनी ॥ २४॥ सहस्राणी प्रधाना च न्यायवस्तुप्रकाशिका
    । सर्वाभिलाषपूर्णेच्छा सर्वा सर्वार्थभाषिणी ॥ २५॥ नानास्वरूपचिद्धात्री शब्दपूर्वा पुरातनी । व्यक्ताव्यक्ता
    जीवकेशा सर्वेच्छापरिपूरिता ॥ २६॥ सङ्कल्पसिद्धा साङ्ख्येया तत्त्वगर्भा धरावहा । भूतरूपा चित्स्वरूपा
    त्रिगुणा गुणगर्विता ॥ २७॥ प्रजापतीश्वरी रौद्री सर्वाधारा सुखावहा । कल्याणवाहिका कल्या कलिकल्मषनाशिनी
    ॥ २८॥ नीरूपोद्भिन्नसन्ताना सुयन्त्रा त्रिगुणालया । महामाया योगमाया महायोगेश्वरी प्रिया ॥ २९॥ महास्त्री
    विमला कीर्तिर्जया लक्ष्मीर्निरञ्जना । प्रकृतिर्भगवन्माया शक्तिर्निद्रा यशस्करी ॥ ३०॥ चिन्ता बुद्धिर्यशः
    प्रज्ञा शान्तिः सुप्रीतिवर्द्धिनी । प्रद्युम्नमाता साध्वी च सुखसौभाग्यसिद्धिदा ॥ ३१॥ काष्ठा निष्ठा
    प्रतिष्ठा च ज्येष्ठा श्रेष्ठा जयावहा । सर्वातिशायिनी प्रीतिर्विश्वशक्तिर्महाबला ॥ ३२॥ वरिष्ठा विजया
    वीरा जयन्ती विजयप्रदा । हृद्गृहा गोपिनी गुह्या गणगन्धर्वसेविता ॥ ३३॥ योगीश्वरी योगमाया योगिनी योगसिद्धिदा
    । महायोगेश्वरवृता योगा योगेश्वरप्रिया ॥ ३४॥ ब्रह्मेन्द्ररुद्रनमिता सुरासुरवरप्रदा । त्रिवर्त्मगा त्रिलोकस्था
    त्रिविक्रमपदोद्भवा ॥ ३५॥ सुतारा तारिणी तारा दुर्गा सन्तारिणी परा । सुतारिणी तारयन्ती भूरितारेश्वरप्रभा
    ॥ ३६॥ गुह्यविद्या यज्ञविद्या महाविद्या सुशोभिता । अध्यात्मविद्या विघ्नेशी पद्मस्था परमेष्ठिनी ॥ ३७॥
    आन्वीक्षिकी त्रयी वार्ता दण्डनीतिर्नयात्मिका । गौरी वागीश्वरी गोप्त्री गायत्री कमलोद्भवा ॥ ३८॥ विश्वम्भरा
    विश्वरूपा विश्वमाता वसुप्रदा । सिद्धिः स्वाहा स्वधा स्वस्तिः सुधा सर्वार्थसाधिनी ॥ ३९॥ इच्छा सृष्टिर्द्युतिर्भूतिः
    कीर्तिः श्रद्धा दयामतिः । श्रुतिर्मेधा धृतिर्ह्रीः श्रीर्विद्या विबुधवन्दिता ॥ ४०॥ अनसूया घृणा नीतिर्निर्वृतिः
    कामधुक्करा । प्रतिज्ञा सन्ततिर्भूतिर्द्यौः प्रज्ञा विश्वमानिनी ॥ ४१॥ स्मृतिर्वाग्विश्वजननी पश्यन्ती
    मध्यमा समा । सन्ध्या मेधा प्रभा भीमा सर्वाकारा सरस्वती ॥ ४२॥ काङ्क्षा माया महामाया मोहिनी माधवप्रिया
    । सौम्याभोगा महाभोगा भोगिनी भोगदायिनी ॥ ४३॥ सुधौतकनकप्रख्या सुवर्णकमलासना । हिरण्यगर्भा सुश्रोणी हारिणी
    रमणी रमा ॥ ४४॥ चन्द्रा हिरण्मयी ज्योत्स्ना रम्या शोभा शुभावहा । त्रैलोक्यमण्डना नारी नरेश्वरवरार्चिता
    ॥ ४५॥ त्रैलोक्यसुन्दरी रामा महाविभववाहिनी । पद्मस्था पद्मनिलया पद्ममालाविभूषिता ॥ ४६॥ पद्मयुग्मधरा
    कान्ता दिव्याभरणभूषिता । विचित्ररत्नमुकुटा विचित्राम्बरभूषणा ॥ ४७॥ विचित्रमाल्यगन्धाढ्या विचित्रायुधवाहना
    । महानारायणी देवी वैष्णवी वीरवन्दिता ॥ ४८॥ कालसङ्कर्षिणी घोरा तत्त्वसङ्कर्षिणीकला । जगत्सम्पूरणी विश्वा
    महाविभवभूषणा ॥ ४९॥ वारुणी वरदा व्याख्या घण्टाकर्णविराजिता । नृसिंही भैरवी ब्राह्मी भास्करी व्योमचारिणी
    ॥ ५०॥ ऐन्द्री कामधेनुः सृष्टिः कामयोनिर्महाप्रभा । दृष्टा काम्या विश्वशक्तिर्बीजगत्यात्मदर्शना ॥ ५१॥
    गरुडारूढहृदया चान्द्री श्रीर्मधुरानना । महोग्ररूपा वाराही नारसिंही हतासुरा ॥ ५२॥ युगान्तहुतभुग्ज्वाला
    कराला पिङ्गलाकला । त्रैलोक्यभूषणा भीमा श्यामा त्रैलोक्यमोहिनी ॥ ५३॥ महोत्कटा महारक्ता महाचण्डा महासना
    । शङ्खिनी लेखिनी स्वस्था लिखिता खेचरेश्वरी ॥ ५४॥ भद्रकाली चैकवीरा कौमारी भवमालिनी । कल्याणी कामधुग्ज्वालामुखी
    चोत्पलमालिका ॥ ५५॥ बालिका धनदा सूर्या हृदयोत्पलमालिका । अजिता वर्षिणी रीतिर्भरुण्डा गरुडासना ॥ ५६॥
    वैश्वानरी महामाया महाकाली विभीषणा । महामन्दारविभवा शिवानन्दा रतिप्रिया ॥ ५७॥ उद्रीतिः पद्ममाला च धर्मवेगा
    विभावनी । सत्क्रिया देवसेना च हिरण्यरजताश्रया ॥ ५८॥ सहसावर्तमाना च हस्तिनादप्रबोधिनी । हिरण्यपद्मवर्णा
    च हरिभद्रा सुदुर्द्धरा ॥ ५९॥ सूर्या हिरण्यप्रकटसदृशी हेममालिनी । पद्मानना नित्यपुष्टा देवमाता मृतोद्भवा
    ॥ ६०॥ महाधना च या श
