id: vishnusuktam-rigveda-1-22-154-155-156-6-69-7-99-100
category: sukta
name:
  english: vishnusuktam (rigveda 1|22,154,155,156 6|69, 7|99,100)
  devanagari: विष्णुसूक्तम् (ऋग्वेद १।२२,१५४,१५५,१५६ ६।६९, ७।९९,१००)
content:
  english: 4 nishadah | bhava mitro na shevyo ghritasutirvibhutadyumna evaya u saprathah | adha te vishno
    vidusha cidardhyah stomo yajnashca radhyo havishmata || 1
  devanagari: ४ निषादः । भवा मित्रो न शेव्यो घृतासुतिर्विभूतद्युम्न एवया उ सप्रथाः । अधा ते विष्णो विदुषा
    चिदर्ध्यः स्तोमो यज्ञश्च राध्यो हविष्मता ॥ १
meaning: {}
