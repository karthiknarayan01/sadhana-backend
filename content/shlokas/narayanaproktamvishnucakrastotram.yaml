id: narayanaproktamvishnucakrastotram
category: stotram
name:
  english: narayanaproktamvishnucakrastotram
  devanagari: नारायणप्रोक्तंविष्णुचक्रस्तोत्रम्
content:
  english: narayanaproktam vishnucakrastotram namo vishnusvarupaya vishnucakraya te namah || 39|| grihanarghyam
    maya dattam sarvakamaprado bhava | agniyoniryajnadeho vishnubalashca muktidah || 40|| vishnucakradharo'bdhistvam
    cakratirthanvitah sada | snanam karomi tirthe'tra muktim dehi rathangadhrik || 41|| mridam shirasi
    dhritva ca snatva bhajan harim tada | santarpya devatah pitrin naran harim ca parshadan || 42|| arghayitva
    tatha krishnam sahasrashvayajeh phalam | snanamatrena labhyeta cakratirthe vidhanatah || 43|| iti
    shrilakshminarayaniyasamhitayam prathame kritayugasantane 220
  devanagari: नारायणप्रोक्तं विष्णुचक्रस्तोत्रम् नमो विष्णुस्वरूपाय विष्णुचक्राय ते नमः ॥ ३९॥ गृहाणार्घ्यं
    मया दत्तं सर्वकामप्रदो भव । अग्नियोनिर्यज्ञदेहो विष्णुबलश्च मुक्तिदः ॥ ४०॥ विष्णुचक्रधरोऽब्धिस्त्वं
    चक्रतीर्थान्वितः सदा । स्नानं करोमि तीर्थेऽत्र मुक्तिं देहि रथाङ्गधृक् ॥ ४१॥ मृदं शिरसि धृत्वा च स्नात्वा
    भजन् हरिं तदा । सन्तर्प्य देवताः पितॄन् नरान् हरिं च पार्षदान् ॥ ४२॥ अर्घयित्वा तथा कृष्णं सहस्राश्वयजेः
    फलम् । स्नानमात्रेण लभ्येत चक्रतीर्थे विधानतः ॥ ४३॥ इति श्रीलक्ष्मीनारायणीयसंहितायां प्रथमे कृतयुगसन्ताने
    २२०
meaning: {}
