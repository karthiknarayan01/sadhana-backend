id: cakropanishat
category: upanishad
name:
  english: cakropanishat
  devanagari: चक्रोपनिषत्
content:
  english: shricakropanishat om athaha vai shricakre nityakrante | gaurirmiyaya salilani takshatyekapadi
    dvipadi sa catushpadi | ashtapadi navapadi babhuvushi sahasrakshara parame vyoman || iti pratyaham
    sasangati sahasram kalashan sthapya shatam va nava va sarvabhave purnabhishekam caret | ashtashtakam
    caret | pancapancakam va caret | sarvabhave shatam pujayet | amritatvam gacchati | shricakranyasam
    caret | sa vyapakatvam gacchati | muladharadbilantam kramena nyaset | svaratcakram viratcakram samatcakram
    virajyacakram vishvarupacakram shatrujiccakram kramena saptakalamayam nyaset | sa shivo bhavet | sa
    kavirbhavet | sa sarvasiddhishvaro bhavet | sa navanathadhishthito bhavet | sa bhuvanaradhito bhavet
    | nirvikalpena manasa yashcarecchaktidehe sa kalirupo bhavet | vina shaktim na moksho na jnanam na
    satyam na dharmo na tapo na harirna haro na virincih | sarvam shaktiyuktam bhavet | tatsamyogat siddhishvaro
    bhavet | iti shivam ||
  devanagari: श्रीचक्रोपनिषत् ॐ अथाह वै श्रीचक्रे नित्याक्रान्ते । गौरीर्मियाय सलिलानि तक्षत्येकपदी द्विपदी
    सा चतुष्पदी । अष्टापदी नवपदी बभूवुषी सहस्राक्षरा परमे व्योमन् ॥ इति प्रत्यहं ससङ्गति सहस्रं कलशान्
    स्थाप्य शतं वा नव वा सर्वाभावे पूर्णाभिषेकं चरेत् । अष्टाष्टकं चरेत् । पञ्चपञ्चकं वा चरेत् । सर्वाभावे
    शतं पूजयेत् । अमृतत्वं गच्छति । श्रीचक्रन्यासं चरेत् । स व्यापकत्वं गच्छति । मूलाधाराद्बिलान्तं क्रमेण
    न्यसेत् । स्वराट्चक्रं विराट्चक्रं समाट्चक्रं विराज्यचक्रं विश्वरूपचक्रं शत्रुजिच्चक्रं क्रमेण सप्तकलामयं
    न्यसेत् । स शिवो भवेत् । स कविर्भवेत् । स सर्वसिद्धीश्वरो भवेत् । स नवनाथाधिष्ठितो भवेत् । स भुवनाराधितो
    भवेत् । निर्विकल्पेन मनसा यश्चरेच्छक्तिदेहे स कालीरूपो भवेत् । विना शक्तिं न मोक्षो न ज्ञानं न सत्यं
    न धर्मो न तपो न हरिर्न हरो न विरिञ्चिः । सर्वं शक्तियुक्तं भवेत् । तत्संयोगात् सिद्धीश्वरो भवेत् ।
    इति शिवम् ॥
