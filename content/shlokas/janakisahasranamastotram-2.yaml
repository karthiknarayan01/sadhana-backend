id: janakisahasranamastotram-2
category: sahasranama
name:
  english: janakisahasranamastotram
  devanagari: जानकीसहस्रनामस्तोत्रम्
content:
  english: janaki sahasranamastotram shrijanakicaritamrite saptashititamo'dhyayah || 87|| atha shriyogeshvarakavi
    dvara varnitam shrijanakisahasranamastotram | shrikaviruvaca | nilendivaralocanam janakajam vismerabimbadharam
    brahmavishnumaheshasevyacaranam divyatsuvarnaprabham | savye shrimithileshituh sunayanakrode muda
    rajitam vande bandhugananvitamanucarivrindaih samaradhitam || 1|| om akalpa'kalmasha'kama akaya'karacarcita
    | akarana'kopapujya akruraika'kshana'kshara || 2|| agada'guna'graganya acalaputrika'cala | acyuta'ja'jeyabuddhirajnatagatisattama
    || 3|| anoraniyasyatarkya atindriyacaya'tula | adabhramahima'drishya advitiyakshamanidhih || 4|| advitiyadayamurtiradvitiyanahankritih
    | adinavuddhiradvaita adhrita'dhokshaja'nagha || 5|| anantavigraha'nanta anantaishvaryasamyuta | ananyabhavasantushta
    anarthaughanivarini || 6|| anavadya'namarupa anirdeshyasvarupini | anirvacyasukhambhodhiranirvacyanghrimardava
    || 7|| anirvinna'nukulaika anukampaikavigraha | anuttama'nuttamatma anuragarbharancita || 8|| aparamahima'parabhavavaridhitarini
    | apurvacarita'purvasiddhanta'purvasaubhaga || 9|| aprakrishta'pratidvandvavikrama'pratimadyutih |
    apratima'pramattatma aprameyasukhakritih || 10|| aprakritagunaishvaryavishvamohanavigraha | abhivadya'mala'mana
    amita'mritarupini || 11|| amrita'mritadrishtishca amritasha'mritodbhava | ayonisambhava'raudra alola'vaniputrika
    || 12|| avara'varnyamadhuryya avarnyakarunavadhih | avicintya'vishishtatma avyakta'vyayashemushi ||
    13|| avyajakarunamurtirashoka'sankhyaka'sama | asammita''ptasankalpa atmajnanavibhakari || 14|| atmodbhava''tmamarmajna
    atmalabhapradayini | atmavatyadikartryadiradharaparamalaya || 15|| adhyeyanghrisarojanka anandamritavarshini
    | amnayavedyacarana ashritatranatatpara || 16|| asaktyapahritasaktirasyasparddhividhuvraja | ahladasupamasindhurinavamshyaparapriya
    || 17|| indupurnollasadvaktra ibharajasutagatih | iyattvarahitervalvi prapannasakalapadam || 18||
    ishta samastadevanamipsitarthapradayini | ishvari sarvalokanamucchinnashrittasamshaya || 19|| ujjvalaikasamaradhya
    utphullendivarekshana | uttarottanahastabja uttamotsangabhushana || 20|| udarakirttanodaracaritodaravandana
    | udarajapapathejya udaradhyanasamstava || 21|| udaravallabhodaravikshanasmitabhashita | udarashrinamarupaliladhamagunavraja
    || 22|| udaraliganodaropasaka ritarupini | ribhuvandyanghrirrikara lriputri lrisvarupini || 23|| ekaikasharanam
    pumsamaikyabhavaprasadita | okahpradhanikaujo'vdhiraudaryautkarshya vishruta || 24|| kamala kamalaradhya
    karanam kalabhashini | kaladhara kalabhijna kalamurtih kalavadhih || 25|| kalpavrikshashraya kalpya
    kalmashaughanivarini | kalyanadatri kalyanaprakritih kamacarini || 26|| kamada kamyasamsaktih karanadvayakaranam
    | karunyardravishalakshi kalacakrapravartika || 27|| kinashabhayamulaghni kunjakelisukhaprada | kunjaradhishagatika
    kritajnarcya kritagama || 28|| kripapiyushajaladhih komalarcyapadambuja | kaushalyapratimambhodhih
    kaushalyasutavallabha || 29|| khararihridayatulyaparamotsavarupini | khalanyamatisandatri khavasishadivandita
    || 30|| khelamatrajagatsrishtirgananatharccita gatih | gataishvaryasmayashreshtha gabhira gamyabhavana
    || 31|| gahanagrya girgirvanahitasadhanatatpara | gupta guheshaya guhya geyodarayashastatih || 32||
    gopaniyapadasaktirgoptri govidanuttama | grahaniyashubhadarsha glaupunjabhanakhacchavih || 33|| ghanashyamatmanilaya
    gharmadyutikulasnusha | ghrinaluka nasvarupa caturatma caturgatih || 34|| caturbhava caturvyuha caturvargapradayini
    | caturvedavidam shreshtha capalasatkritadyutih || 35|| candrakalasamaradhya candrabimbopamanana |
    carushiladibhih sevya carusampavanasmita || 36|| carurupagunopeta carusmaranamangala | carvangi cidalankara
    cidanandasvarupini || 37|| chavikshubdharatih chinnapranatasheshasamshaya | jagatkshemavidhanajna
    jagatsetunibandhini || 38|| jagadadirjagadatmapreyasi jagadatmika | jagadalayavrindeshi jagadalayasanghasuh
    || 39|| jagadudbhavadikartri jagadekaparayanam | jagannetri jaganmata jaganmangalyamangala || 40||
    jaganmohanamadhuryamanomohanavigraha | jatushobhipadambhoja janakanandavardhini || 41|| janakalyanasaktatma
    janani sarvadehinam | jananihridayananda janabadhanivarini || 42|| janasantapashamani janitri sukhasampadam
    | janeshvaredya janmantatrasanirnashacintana || 43|| japaniya jayaghosharadhyamana jayaprada | jaya
    jayavaha janmajaramrityubhayatiga || 44|| jalakelimahaprajna jalajasanavandita | jalajarunahastanghrirjalajayatalocana
    || 45|| javanatamanovega jadyadhvantanivarini | janaki jitamayaika jitamitra jitacchavih || 46|| jitadvandva
    jitamarsha jivamuktipradayini | jivanam paramaradhya jiveshi jetrisadgatih || 47|| jetri jnanada jnanapathodhirjnaninam
    gatih | jneya''tmahitakamanam jyeshtha jyotsnadhipanana || 48|| jvaratiga jvalatkantirjvalamalasamakula
    | jhanannupurapadabja jhampakeshaprasadita || 49|| jhapaketupriyayuthasancitacchavimohini | jhatavatotsavadhara
    narupa tuntuketara || 50|| thatmika dambarotkrishta damaradhishagamini | dhundhishtadevata dhakkamanjunadapraharshita
    || 51|| nakara tadidoghabhadiptangi tattvarupini | tattvakushala tattvatma tattvadistanumadhyama ||
    52|| tantupravarddhini tanvi tapaniyanibhadyutih | tapomurtistapovasa tamasah paratah para || 53||
    tamoghni tapashamani tarini tushtamanasa | tushtipradayika tripta triptistriptyekakarini || 54|| tejahsvarupini
    tejovrisha toyabhavarcita | trikalajna trilokeshi thai thai shabdapramodini || 55|| daksha danujadarpaghni
    damitashritakantaka | dambhadimalamulaghni dayardrakshi dayamayi || 56|| dashasyandanajapreshtha dakshinyakhilapujita
    | danta daridryashamani divyadhyeyashubhakritih || 57|| divyatma divyacarita divyodaragunanvita |
    divya divyatmavibhava dinoddharanatatpara || 58|| diptangi diptamahima dipyamanamukhambuja | durasada
    duraradhya duritaghni durmarshana || 59|| durjneya dushprakritighni duhsvapnadipranashini | dyutirdyutimati
    devacudamaniprabhupriya || 60|| devatahitada dainyabhavacirasutoshita | dharakanya dharananda dharamodavivardhini
    || 61|| dhararatnam dharmanidhirdharma setunibandhini | dharmashastranuga dhamaparibhutatadiddyutih
    || 62|| dhritirdhruva natiprita nayashastravisharada | namanirdhutaniraya nigamantapratishthita ||
    63|| nigamairgitacarita nityamuktanishevita | nidhirnimikulottamsa nimittajnanisattama || 64|| niyatendriyasambhavya
    niyatatma niranjana | nirakara niratanka niradhara niramaya || 65|| nirvyajakarunamurtinitih pankeruhekshana
    | patitoddharini padmagandheshta padmajarccita || 66|| padmapada padmavaktra padmini parameshvari
    | parabrahma paraspashta parashaktih parigraha || 67|| paritratri parishlaghya parepta paryavasthita
    | pavitram patavadhara pativratyadhurandhara || 68|| papipapaughasamhartri parijatasumarccita | pavananuttamadarsha
    pavani punyadarshana || 69|| punyashravanacarita punyashlokavariyasi | pushpalankarasampanna pushtih
    pushtipradayini || 70|| putatma putasarveha pujyapadambujadvaya | purna purnenduvadana prakritih prakriteh
    para || 71|| prakrishtatma pranamyanghrih pranayatishayapriya | pranatatulyavatsalya pranatadhvastasamsritih
    || 72|| pranavini pratishthatri prathama prathita pradhih | prapannarakshanodyoga pravittam pravisharada
    || 73|| prahvi pranaprada prananilaya pranavallabha | pranatmika prarthaniya priyamohanadarshana ||
    74|| priyarha prititattvajna pritida pritivardhini | prejya premarata premavallabhativavallabha ||
    75|| premavaram nidhih premavigraha premavaibhava | premashaktyekavivasha premasamsadhyadarshana ||
    76|| premaikahatakagara premaikadbhutavigraha | phanindravarnyavibhava phalarupa sukarmanam || 77||
    buddhida budhamrigyanghrikamala bodhavaridhih | brahmalekhatiga brahmavettri brahmandavrindasuh ||
    78|| bhaktatranavidhanajna bhaktisamsadhyadarshana | bhajaniyagunopeta bhayaghni bhavatarini || 79||
    bhavapujya bhavaradhya bhavotpatyadikarini | bhagyaikasamshodhayitri bhavaikaparitoshita || 80|| bhutaprasutirbhutatma
    bhutadirbhutidayini | bhutimatsamupasyanghrirbhusuta bhrantiharini || 81|| mangalasheshamangalya mangalaikamahanidhih
    | madhura madhurakara mananiyagunavalih || 82|| manojava manojnangi manoramagunanvita | manah svarupa
    mahati mahaniyagunambudhih || 83|| mahaddhryeka mahakirtirmahakosha mahakratuh | mahakrama mahagarta
    mahachavirmahadyutih || 84|| mahadrishtirmahadhamni mahanandasvarupini | mahanayakasammatya mahanaipunyavaridhih
    || 85|| mahapujya mahaprajna mahaprejya mahaphala | mahabhaga mahabhoga mahamatimatam vara || 86||
    mahamadhuryasampanna mahamayasvarupini | mahayogaprasadhyaika mahayogeshvarapriya || 87|| maharatirmahalakshmirmahavidyasvarupini
    | mahashaktirmahashreshtha mahashlaghyayasho'nvita || 88|| mahasiddhirmahasevya mahasaubhagyadayini
    | mahahavirmaharharha mahishtatma mahiyasi || 89|| mahishaja mahotkarsha mahotsaha mahodaya | mahodara
    maheshadisamalabhvyanghripankaja || 90|| mata samasta jagatam madhurijitamadhuri | manyaparamasammanya
    ma mitakokilasvana || 91|| mithileshakratudbhuta mithileshvaranandini | minakshi muktivarada munisevyapadambuja
    || 92|| munindravarnyamahima mulaprakritisamjnita | mriganetra mrigankabhavadana mridubhashini ||
    93|| mridula mudulacara mridusamohanekshana | mridusvabhavasampanna mridvi medhasamudbhava || 94||
    medheshi maithili modavarshini maudhyabhanjika | yatacittendriyagrama yukta yuktatmabhashita || 95||
    yogada yoganilaya yogastha yoginam gatih | yoginam samupalabhya yogirajapriyatmaja || 96|| raktotpalalasaddhasta
    raghunandanavallabha | raghunathasvabhavajna raghuvirasukhe rata || 97|| ratisaundaryadarpaghni ratishehaharasmritih
    | ravimandaladhyastha ravivamshenduhritsthita || 98|| rasajna rasabhavajna rasanandavivardhini | ramaniyagunagrama
    ramaradhya ramalaya || 99|| ramyaramyanidhi ramyashesha rasamayakritih | rasaputri rasasakta rasikanam
    paragatih || 100|| rasikendrapriya rakadhipapunjanibhanana | raghavendraprabhavajna radha rasaraseshvari
    || 101|| rasalilakalapajna rasanandapradayini | raseshi rupadakshinyamandita lakshmanarccita || 102||
    lalanadarshacarita lalanadharmadipika | lalamaikanamarupaliladhamagunadika || 103|| lalitambhojapatrakshi
    lalitasheshaceshtita | lavanyajitapathodhirlakritirlinarakshika || 104|| lilabhumadhavapreshtha lokakalyanatatpara
    | lokatrayamaharajnilokamrigyanghripankaja || 105|| lokajna lokasharanam lokapavanapavani | lokapragitamahima
    lokanuttamadarshana || 106|| lokalayakalapamba lokotpatyadikarini | lokeshakanta lokeshi lokaikapriyakankshini
    || 107|| locanadindriyavratashaktisancarakarini | lopayitri lobhahara lomashadikabhavita || 108||
    vatsara vatsalotkrishta vadanya vanajekshana | vanamalancita vabhvri varaniyapadashraya || 109|| varadadhirajakanta
    varada varavarnini | varabodha vararohabhushita varnanatiga || 110|| varnabhava varnashreshtha varnashramavidhayini
    | varnyanavadyacitkelirvarddhini sukhasampadam || 111|| vashakridvashagashreshtha vashya vasupradayini
    | bahushruto vacyakirtirvarijasanavandita || 112 || vikalmasha viksharatma vigateha vijetrika | vijnanadatri
    vijnanamayaprakritavigraha || 113|| vijna vijvara vidita vidisha vidyaya'nvita | vidyavatpungavotkrishta
    vidhatri vidhiketana || 114 || vidhidurjneyamahima vidhupurnamukhambuja | vinayarha vinitatma vipakvatma
    vipaddhara || 115|| vimatsara vimalarcya vimuktatma vimuktida | vimohini viyanmurtirviratipradacintana
    || 116|| virama vilasatkshantirvibudharshiganarcita | vivekaparamadhara vivekavadupasita || 117||
    vishadashlokasampujya vishalendivarekshana | vishishtatma visheshajna vishvalilaprasarini || 118||
    vishvatah panipadasya vishvamatraikadharini | vishvabharani vishvatma vishvalayavrajeshvari || 119||
    vishvasarupa vishvesham sakshini vistritottama | vinavani vitabhrantih vitaragasmayadika || 120||
    vitashankasamaradhya vitasampurnasadhvasa | budharadhyanghrikamala vripapa vedakaranam || 121|| vedaga
    vedanihshvasa vedapranutavaibhava | vedapratipadyatattva vedavedantakovida || 122|| vedarakshavidhanajna
    vedasaramayakritih | vedantavedya vedanta vaidehi vaibhavarnava || 123|| vankacikura vankabhrurvankakarshanavikshana
    | shaktivrajeshvari shaktih shatamurtih shatodita || 124|| shabdabrahmatiga shabdavigraha shamadayini
    | shamitashritasanklesha shamibhaktyashutoshita || 125|| shampadamollasatkantih shampradadhyanasamstava
    | shammayasheshakainkaryya sharanam sarvadehinam || 126|| sharanagatasantratri sharanyaika'sudharinam
    | shabarimanadapreshtha shanta shantipradayini || 127|| shashvatacintaniyanghrikamala shashvatasthira
    | shashvati shasikotkrishta shirodharyakarambuja || 128|| shishira shilasampanna shucigamyanghricintana
    | shuciprapyapadasaktih shuddhantahkaranalaya || 129|| shuddha shuddhipradadhyana shulatrayanivarini
    | shailarajasutadishta shobhasagara satkrita || 130|| shauryapathonidhih shyama shrayaniyapadambuja
    | shravaniyayashogatha shrikari shripradayini || 131|| shrimaduttamsamahita shrimayi shrimahanidhih
    | shrilakshmyadibhih sevya shrivasa shrisamudbhava || 132|| shrih shrutigitacarita shrutyantapratipadita
    | shreyogunerana shreyonidhih shreyomayasmritih || 133|| shrotriyaikasamaradhya shlakshnasunritabhashini
    | shlaghaniyamahakirtih shlilacaritryavishruta || 134|| shlokalokarcitabjanghrih shvasanadhishasatkrita
    | shvetadhamollasadvaktra shatcaturvasvilodita || 135 || shadatita shadadhara shadarddhakshahridisthita
    | sakhimandalamadhyastha saguna sankshayojjhita || 136|| sankhyatitaguna sangamukta sangitakovida
    | sangirnapranatatrana sangrahanugrahe rata || 137|| sakhyashighrasamasadya sajjanopasitanghrika |
    satataradhyacarana satitvadarshadayini || 138|| sativrindashiroratnam satishajasrabhavita | sattama
    satyadharmaikapalika satyarupini || 139|| satyasancintana satyasandha satyapatisnusha | satya satradharagarbhodbhuta
    satvavadagranih || 140|| sadacara sadasevya sadrishatitashemushi | sanatani sadanamya santoshaikapradayini
    || 141|| sandehapahara sandhih sannishevyasamashrita | sannutyasheshacarita sabhyalokasabhajita ||
    142|| samagrajnanavairagyadharmashriryashonidhih | samagraishvaryasampanna samatitagunopama || 143||
    samadrishtih samarcyaika samarthagra samardhaka | samavishvamanojnangi samavekshyanghrilanchana ||
    144|| samakarnyayashogatha samahartri samahita | samanatma samaradhya samalambyanghripankaja || 145||
    samavarta samasevya samarha samitinjaya | samikshyavyajakaruna savibhavyasuvigraha || 146|| sarayupulinakrida
    sarala sarasekshana | sargasthityantaprabhava sarvakamapradayini || 147|| sarvakaryabudha sarvacchadmajna
    sarvajanmada | sarvajivahita sarvajnaninam jneyasattama || 148|| sarvajnananidhih sarvajnanavadbhirupasita
    | sarvajna sarvajyeshthadih sarvatirthamayasmritih || 149|| sarvato'kshyasyahastanghrikamala sarvadarshana
    | sarvadivyagunopeta sarvaduhkhaharasmita || 150|| sarvadevanuta sarvadharmatattvavidam vara | sarvadharmanidhih
    sarvanayakottamanayika || 151|| sarvanitirahasyajna sarvanaipunyamandita | sarvapapaharadhyana sarvapavanapavani
    || 152|| sarvabhaktavanabhijna sarvabhaktimatam gatih | sarvabhavapadatita sarvabhavaprapurika ||
    153|| sarvabhaktipradotkrishta sarvabhutahite rata | sarvabhutashayabhijna sarvabhritasudharini ||
    154|| sarvamangalamangalya sarvamandanamandana | sarvamedhavinam shreshtha sarvamodamayekshana ||
    155|| sarvamohacchidasaktih sarvamohanamohini | sarvamaulimanipreshtha sarvayajnaphalaprada || 156||
    sarvayajnavratasnata sarvayogavinihsrita | sarvaramyagunagara sarvalakshanalakshita || 157|| sarvalavanyajaladhih
    sarvalilaprasarini | sarvalokanamaskarya sarvalokeshvarapriya || 158|| sarvalokeshvari sarvalaukiketaravaibhava
    | sarvavidyavratasnata sarvavaibhavakaranam || 159|| sarvashaktimatamishta sarvashaktimaheshvari |
    sarvashatruhara sarvasharanam sarvasharmada || 160|| sarvashreyaskari sarvasaha sarvasadarcita | sarvasadbhavanadhara
    sarvasadbhavaposhini || 161|| sarvasaukhyaprada sarvasaubhagyaikapradayini | saketaparamasthana saketaparamotsava
    || 162|| saketadhipatipreshtha saketanandavarshini | sakshanchrih sakshini sarvadehinam sarvakarmanam
    || 163|| saghapranijanarushta satapatrottamasana | sadhanatitasampraptih sadhya sadhvijanapriya ||
    164|| samaga samagodgita saphalyaikapradayini | samarthyajagadadharamohini samyadayini || 165|| sarajna
    siddhasankalpa siddhasevyapadambuja | siddhartha siddhida siddhirupini siddhisadhanam || 166 | sita
    simantinishreshtha siradhvajanripatmaja | sukataksha sukirtidya sukritinam mahaphala || 167|| sukeshisukhamulaika
    sukhasandohadarshana | sugama sughanajnana sucarvi sujavottama || 168|| sujna sutanvi sudati
  devanagari: जानकी सहस्रनामस्तोत्रम् श्रीजानकीचरितामृते सप्ताशीतितमोऽध्यायः ॥ ८७॥ अथ श्रीयोगेश्वरकवि
    द्वारा वर्णितं श्रीजानकीसहस्रनामस्तोत्रम् । श्रीकविरुवाच । नीलेन्दीवरलोचनां जनकजां विस्मेरबिम्बाधरां
    ब्रह्माविष्णुमहेशसेव्यचरणां दीव्यत्सुवर्णप्रभाम् । सव्ये श्रीमिथिलेशितुः सुनयनाक्रोडे मुदा राजितां
    वन्दे बन्धुगणान्वितामनुचरीवृन्दैः समाराधिताम् ॥ १॥ ॐ अकल्पाऽकल्मषाऽकामा अकायाऽकारचर्चिता । अकारणाऽकोपपूज्या
    अक्रूरैकाऽक्षणाऽक्षरा ॥ २॥ अगदाऽगुणाऽग्रगण्या अचलापुत्रिकाऽचला । अच्युताऽजाऽजेयबुद्धिरज्ञातगतिसत्तमा
    ॥ ३॥ अणोरणीयस्यतर्क्या अतीन्द्रियचयाऽतुला । अदभ्रमहिमाऽदृश्या अद्वितीयक्षमानिधिः ॥ ४॥ अद्वितीयदयामूर्तिरद्वितीयानहङ्कृतिः
    । अदीनवुद्धिरद्वैता अधृताऽधोक्षजाऽनघा ॥ ५॥ अनन्तविग्रहाऽनन्ता अनन्तैश्वर्यसंयुता । अनन्यभावसन्तुष्टा
    अनर्थौघनिवारिणी ॥ ६॥ अनवद्याऽनामरूपा अनिर्देश्यस्वरूपिणी । अनिर्वाच्यसुखाम्भोधिरनिर्वाच्याङ्घ्रिमार्दवा
    ॥ ७॥ अनिर्विण्णाऽनुकूलैका अनुकम्पैकविग्रहा । अनुत्तमाऽनुत्तमात्मा अनुरागर्भराञ्चिता ॥ ८॥ अपारमहिमाऽपारभववारिधितारिणी
    । अपूर्वचरिताऽपूर्वसिद्धान्ताऽपूर्वसौभगा ॥ ९॥ अप्रकृष्टाऽप्रतिद्वन्द्वविक्रमाऽप्रतिमद्युतिः । अप्रतिमाऽप्रमत्तात्मा
    अप्रमेयसुखाकृतिः ॥ १०॥ अप्राकृतगुणैश्वर्यविश्वमोहनविग्रहा । अभिवाद्याऽमलाऽमाना अमिताऽमृतरूपिणी ॥ ११॥
    अमृताऽमृतदृष्टिश्च अमृताशाऽमृतोद्भवा । अयोनिसम्भवाऽरौद्रा अलोलाऽवनिपुत्रिका ॥ १२॥ अवराऽवर्ण्यमाधुर्य्या
    अवर्ण्यकरुणावधिः । अविचिन्त्याऽविशिष्टात्मा अव्यक्ताऽव्ययशेमुषी ॥ १३॥ अव्याजकरुणामूर्तिरशोकाऽसङ्ख्यकाऽसमा
    । असम्मिताऽऽप्तसङ्कल्पा आत्मज्ञानविभाकरी ॥ १४॥ आत्मोद्भवाऽऽत्ममर्मज्ञा आत्मलाभप्रदायिनी । आत्मवत्यादिकर्त्र्यादिराधारपरमालया
    ॥ १५॥ आध्येयाङ्घ्रिसरोजाङ्का आनन्दामृतवर्षिणी । आम्नायवेद्यचरणा आश्रितत्राणतत्परा ॥ १६॥ आसक्त्यपहृतासक्तिरास्यस्पर्द्धिविधुव्रजा
    । आह्लादसूपमासिन्धुरिनवंश्यपरप्रिया ॥ १७॥ इन्दुपूर्णोल्लसद्वक्त्रा इभराजसुतागतिः । इयत्त्वरहितेर्वाल्वी
    प्रपन्नसकलापदाम् ॥ १८॥ इष्टा समस्तदेवानामीप्सितार्थप्रदायिनी । ईश्वरी सर्वलोकानामुच्छिन्नाश्रित्तसंशया
    ॥ १९॥ उज्ज्वलैकसमाराध्या उत्फुल्लेन्दीवरेक्षणा । उत्तरोत्तानहस्ताब्जा उत्तमोत्सङ्गभूषणा ॥ २०॥ उदारकीर्त्तनोदारचरितोदारवन्दना
    । उदारजपपाठेज्या उदारध्यानसंस्तवा ॥ २१॥ उदारवल्लभोदारवीक्षणस्मितभाषिता । उदारश्रीनामरूपलीलाधामगुणव्रजा
    ॥ २२॥ उदारालिगणोदारोपासका ॠतरूपिणी । ॠभुवन्द्याङ्घ्रिरॄकारा लॄपुत्री लॄस्वरूपिणी ॥ २३॥ एकैकशरणं पुंसामैक्यभावप्रसादिता
    । ओकःप्रधानिकौजोऽव्धिरौदार्यौत्कर्ष्य विश्रुता ॥ २४॥ कमला कमलाराध्या करणं कलभाषिणी । कलाधारा कलाभिज्ञा
    कलामूर्तिः कलावधिः ॥ २५॥ कल्पवृक्षाश्रया कल्प्या कल्मषौघनिवारिणी । कल्याणदात्री कल्याणप्रकृतिः कामचारिणी
    ॥ २६॥ कामदा काम्यसंसक्तिः कारणाद्वयकारणम् । कारुण्यार्द्रविशालाक्षी कालचक्रप्रवर्तिका ॥ २७॥ कीनाशभयमूलघ्नी
    कुञ्जकेलिसुखप्रदा । कुञ्जराधीशगतिका कृतज्ञार्च्या कृतागमा ॥ २८॥ कृपापीयूषजलधिः कोमलार्च्यपदाम्बुजा
    । कौशल्याप्रतिमाम्भोधिः कौशल्यासुतवल्लभा ॥ २९॥ खरारिहृदयातुल्यपरमोत्सवरूपिणी । खलान्यमतिसन्दात्री
    खवासीशादिवन्दिता ॥ ३०॥ खेलमात्रजगत्सृष्टिर्गणनाथार्च्चिता गतिः । गतैश्वर्यस्मयश्रेष्ठा गभीरा गम्यभावना
    ॥ ३१॥ गहनाग्र्या गीर्गीर्वाणहितसाधनतत्परा । गुप्ता गुहेशया गुह्या गेयोदारयशस्ततिः ॥ ३२॥ गोपनीयपदासक्तिर्गोप्त्री
    गोविदनुत्तमा । ग्रहणीयशुभादर्शा ग्लौपुञ्जाभनखच्छविः ॥ ३३॥ घनश्यामात्मनिलया घर्मद्युतिकुलस्नुषा । घृणालुका
    ङस्वरूपा चतुरात्मा चतुर्गतिः ॥ ३४॥ चतुर्भावा चतुर्व्यूहा चतुर्वर्गप्रदायिनी । चतुर्वेदविदां श्रेष्ठा
    चपलासत्कृतद्युतिः ॥ ३५॥ चन्द्रकलासमाराध्या चन्द्रबिम्बोपमानना । चारुशीलादिभिः सेव्या चारुसम्पावनास्मिता
    ॥ ३६॥ चारुरूपगुणोपेता चारुस्मरणमङ्गला । चार्वङ्गी चिदलङ्कारा चिदानन्दस्वरूपिणी ॥ ३७॥ छविक्षुब्धरतिः
    छिन्नप्रणताशेषसंशया । जगत्क्षेमविधानज्ञा जगत्सेतुनिबन्धिनी ॥ ३८॥ जगदादिर्जगदात्मप्रेयसी जगदात्मिका
    । जगदालयवृन्देशी जगदालयसङ्घसूः ॥ ३९॥ जगदुद्भवादिकर्त्री जगदेकपरायणम् । जगन्नेत्री जगन्माता जगन्माङ्गल्यमङ्गला
    ॥ ४०॥ जगन्मोहनमाधुर्यमनोमोहनविग्रहा । जतुशोभिपदाम्भोजा जनकानन्दवर्धिनी ॥ ४१॥ जनकल्याणसक्तात्मा जननी
    सर्वदेहिनाम् । जननीहृदयानन्दा जनबाधानिवारिणी ॥ ४२॥ जनसन्तापशमनी जनित्री सुखसम्पदाम् । जनेश्वरेड्या
    जन्मान्तत्रासनिर्णाशचिन्तना ॥ ४३॥ जपनीया जयघोषाराध्यमाना जयप्रदा । जया जयावहा जन्मजरामृत्युभयातिगा
    ॥ ४४॥ जलकेलिमहाप्राज्ञा जलजासनवन्दिता । जलजारुणहस्ताङ्घ्रिर्जलजायतलोचना ॥ ४५॥ जवानतमनोवेगा जाड्यध्वान्तनिवारिणी
    । जानकी जितमायैका जितामित्रा जितच्छविः ॥ ४६॥ जितद्वन्द्वा जितामर्षा जीवमुक्तिप्रदायिनी । जीवानां परमाराध्या
    जीवेशी जेतृसद्गतिः ॥ ४७॥ जेत्री ज्ञानदा ज्ञानपाथोधिर्ज्ञानिनां गतिः । ज्ञेयाऽऽत्महितकामानां ज्येष्ठा
    ज्योत्स्नाधिपानना ॥ ४८॥ ज्वरातिगा ज्वलत्कान्तिर्ज्वालामालासमाकुला । झणन्नूपुरपादाब्जा झम्पाकेशप्रसादिता
    ॥ ४९॥ झपकेतुप्रियायूथसञ्चितच्छविमोहिनी । झाटवाटोत्सवाधारा ञरूपा टुण्टुकेतरा ॥ ५०॥ ठात्मिका डम्बरोत्कृष्टा
    दामराधीशगामिनी । ढुण्ढीष्टदेवता ढक्कामञ्जुनादप्रहर्षिता ॥ ५१॥ णकारा तडिदोघाभदीप्ताङ्गी तत्त्वरूपिणी
    । तत्त्वकुशला तत्त्वात्मा तत्त्वादिस्तनुमध्यमा ॥ ५२॥ तन्तुप्रवर्द्धिनी तन्वी तपनीयनिभद्युतिः । तपोमूर्तिस्तपोवासा
    तमसः परतः परा ॥ ५३॥ तमोघ्नी तापशमनी तारिणी तुष्टमानसा । तुष्टिप्रदायिका तृप्ता तृप्तिस्तृप्त्येककारिणी
    ॥ ५४॥ तेजःस्वरूपिणी तेजोवृषा तोयभवार्चिता । त्रिकालज्ञा त्रिलोकेशी थै थै शब्दप्रमोदिनी ॥ ५५॥ दक्षा
    दनुजदर्पघ्नी दमिताश्रितकण्टका । दम्भादिमलमूलघ्नी दयार्द्राक्षी दयामयी ॥ ५६॥ दशस्यन्दनजप्रेष्ठा दाक्षिण्याखिलपूजिता
    । दान्ता दारिद्र्यशमनी दिव्यध्येयशुभाकृतिः ॥ ५७॥ दिव्यात्मा दिव्यचरिता दिव्योदारगुणान्विता । दिव्या
    दिव्यात्मविभवा दीनोद्धरणतत्परा ॥ ५८॥ दीप्ताङ्गी दीप्तमहिमा दीप्यमानमुखाम्बुजा । दुरासदा दुराराध्या
    दुरितघ्नी दुर्मर्षणा ॥ ५९॥ दुर्ज्ञेया दुष्प्रकृतिघ्नी दुःस्वप्नादिप्रणाशिनी । द्युतिर्द्युतिमति देवचूडामणिप्रभुप्रिया
    ॥ ६०॥ देवताहितदा दैन्यभावाचिरसुतोषिता । धराकन्या धरानन्दा धरामोदविवर्धिनी ॥ ६१॥ धरारत्नं धर्मनिधिर्धर्म
    सेतुनिबन्धिनी । धर्मशास्त्रानुगा धामपरिभूततडिद्द्युतिः ॥ ६२॥ धृतिर्ध्रुवा नतिप्रीता नयशास्त्रविशारदा
    । नामनिर्धूतनिरया निगमान्तप्रतिष्ठिता ॥ ६३॥ निगमैर्गीतचरिता नित्यमुक्तनिषेविता । निधिर्निमिकुलोत्तंसा
    निमित्तज्ञानिसत्तमा ॥ ६४॥ नियतेन्द्रियसम्भाव्या नियतात्मा निरञ्जना । निराकारा निरातङ्का निराधारा निरामया
    ॥ ६५॥ निर्व्याजकरुणामूर्तिनीतिः पङ्केरुहेक्षणा । पतितोद्धारिणी पद्मगन्धेष्टा पद्मजार्च्चिता ॥ ६६॥
    पद्मपादा पद्मवक्त्रा पद्मिनी परमेश्वरी । परब्रह्म परस्पष्टा पराशक्तिः परिग्रहा ॥ ६७॥ परित्रात्री परिश्लाघ्या
    परेप्टा पर्यवस्थिता । पवित्रं पाटवाधारा पातिव्रत्यधुरन्धरा ॥ ६८॥ पापिपापौघसंहर्त्री पारिजातसुमार्च्चिता
    । पावनानुत्तमादर्शा पावनी पुण्यदर्शना ॥ ६९॥ पुण्यश्रवणचरिता पुण्यश्लोकवरीयसी । पुष्पालङ्कारसम्पन्ना
    पुष्टिः पुष्टिप्रदायिनी ॥ ७०॥ पूतात्मा पूतसर्वेहा पूज्यपादाम्बुजद्वया । पूर्णा पूर्णेन्दुवदना प्रकृतिः
    प्रकृतेः परा ॥ ७१॥ प्रकृष्टात्मा प्रणम्याङ्घ्रिः प्रणयातिशयप्रिया । प्रणतातुल्यवात्सल्य प्रणतध्वस्तसंसृतिः
    ॥ ७२॥ प्रणविनी प्रतिष्ठात्री प्रथमा प्रथिता प्रधीः । प्रपन्नरक्षणोद्योगा प्रवित्तं प्रविशारदा ॥ ७३॥
    प्रह्वी प्राणप्रदा प्राणनिलया प्राणवल्लभा । प्राणात्मिका प्रार्थनीया प्रियमोहनदर्शना ॥ ७४॥ प्रियार्हा
    प्रीतितत्त्वज्ञा प्रीतिदा प्रीतिवर्धिनी । प्रेज्या प्रेमरता प्रेमवल्लभातीववल्लभा ॥ ७५॥ प्रेमवारां
    निधिः प्रेमविग्रहा प्रेमवैभवा । प्रेमशक्त्येकविवशा प्रेमसंसाध्यदर्शना ॥ ७६॥ प्रेमैकहाटकागारा प्रेमैकाद्भुतविग्रहा
    । फणीन्द्रावर्ण्यविभवा फलरूपा सुकर्मणाम् ॥ ७७॥ बुद्धिदा बुधमृग्याङ्घ्रिकमला बोधवारिधिः । ब्रह्मलेखातिगा
    ब्रह्मवेत्त्री ब्रह्माण्डवृन्दसूः ॥ ७८॥ भक्तत्राणविधानज्ञा भक्तिसंसाध्यदर्शना । भजनीयगुणोपेता भयघ्नी
    भवतारिणी ॥ ७९॥ भवपूज्या भवाराध्या भवोत्पत्यादिकारिणी । भाग्यैकसंशोधयित्री भावैकपरितोषिता ॥ ८०॥ भूतप्रसूतिर्भूतात्मा
    भूतादिर्भूतिदायिनी । भूतिमत्समुपास्याङ्घ्रिर्भूसुता भ्रान्तिहारिणी ॥ ८१॥ मङ्गलाशेषमाङ्गल्या मङ्गलैकमहानिधिः
    । मधुरा मधुराकारा मननीयगुणावलिः ॥ ८२॥ मनोजवा मनोज्ञाङ्गी मनोरमगुणान्विता । मनः स्वरूपा महती महनीयगुणाम्बुधिः
    ॥ ८३॥ महद्ध्र्येका महाकीर्तिर्महाकोशा महाक्रतुः । महाक्रमा महागर्ता महाछविर्महाद्युतिः ॥ ८४॥ महादृष्टिर्महाधाम्नी
    महानन्दस्वरूपिणी । महानायकसम्मात्या महानैपुण्यवारिधिः ॥ ८५॥ महापूज्या महाप्राज्ञा महाप्रेज्या महाफला
    । महाभागा महाभोगा महामतिमतां वरा ॥ ८६॥ महामाधुर्यसम्पन्ना महामायास्वरूपिणी । महायोगप्रसाध्यैका महायोगेश्वरप्रिया
    ॥ ८७॥ महारतिर्महालक्ष्मीर्महाविद्यास्वरूपिणी । महाशक्तिर्महाश्रेष्ठा महाश्लाघ्ययशोऽन्विता ॥ ८८॥ महासिद्धिर्महासेव्या
    महासौभाग्यदायिनी । महाहविर्महार्हार्हा महिष्टात्मा महीयसी ॥ ८९॥ महीशजा महोत्कर्षा महोत्साहा महोदया
    । महोदारा महेशादिसमालभ्व्याङ्घ्रिपङ्कजा ॥ ९०॥ माता समस्त जगतां माधुरीजितमाधुरी । मान्यपरमसम्मान्या
    मा मितकोकिलस्वना ॥ ९१॥ मिथिलेशक्रतूद्भूता मिथिलेश्वरनन्दिनी । मीनाक्षी मुक्तिवरदा मुनिसेव्यपदाम्बुजा
    ॥ ९२॥ मुनीन्द्रावर्ण्यमहिमा मूलप्रकृतिसंज्ञिता । मृगनेत्रा मृगाङ्काभवदना मृदुभाषिणी ॥ ९३॥ मृदुला मूदुलाचारा
    मृदुसमोहनेक्षणा । मृदुस्वभावसम्पन्ना मृद्वी मेधसमुद्भवा ॥ ९४॥ मेधेशी मैथिली मोदवर्षिणी मौढ्यभञ्जिका
    । यतचित्तेन्द्रियग्रामा युक्ता युक्तात्मभाषिता ॥ ९५॥ योगदा योगनिलया योगस्था योगिनां गतिः । योगिनां
    समुपालभ्या योगिराजप्रियात्मजा ॥ ९६॥ रक्तोत्पललसद्धस्ता रघुनन्दनवल्लभा । रघुनाथस्वभावज्ञा रघुवीरसुखे
    रता ॥ ९७॥ रतिसौन्दर्यदर्पघ्नी रतीशेहाहरस्मृतिः । रविमण्डलध्यस्था रविवंशेन्दुहृत्स्थिता ॥ ९८॥ रसज्ञा
    रसभावज्ञा रसानन्दविवर्धिनी । रमणीयगुणग्रामा रमाराध्या रमालया ॥ ९९॥ रम्यरम्यनिधी रम्याशेषा रसमयाकृतिः
    । रसापुत्री रसासक्ता रसिकानां परागतिः ॥ १००॥ रसिकेन्द्रप्रिया राकाधिपपुञ्जनिभानना । राघवेन्द्रप्रभावज्ञा
    राधा रासरसेश्वरी ॥ १०१॥ रासलीलाकलापज्ञा रासानन्दप्रदायिनी । रासेशी रूपदाक्षिण्यमण्डिता लक्ष्मणार्च्चिता
    ॥ १०२॥ ललनादर्शचरिता ललनाधर्मदीपिका । ललामैकनामरूपलीलाधामगुणादिका ॥ १०३॥ ललिताम्भोजपत्राक्षी ललिताशेषचेष्टिता
    । लावण्यजितपाथोधिर्लाकृतिर्लीनरक्षिका ॥ १०४॥ लीलाभूमाधवप्रेष्ठा लोककल्याणतत्परा । लोकत्रयमहाराज्ञीलोकमृग्याङ्घ्रिपङ्कजा
    ॥ १०५॥ लोकज्ञा लोकशरणं लोकपावनपावनी । लोकप्रगीतमहिमा लोकानुत्तमदर्शना ॥ १०६॥ लोकालयकलापाम्बा लोकोत्पत्यादिकारिणी
    । लोकेशकान्ता लोकेशी लोकैकप्रियकाङ्क्षिणी ॥ १०७॥ लोचनादीन्द्रियव्रातशक्तिसञ्चारकारिणी । लोपयित्री
    लोभहरा लोमशादिकभाविता ॥ १०८॥ वत्सरा वत्सलोत्कृष्टा वदान्या वनजेक्षणा । वनमालाञ्चिता वभ्व्री वरणीयपदाश्रया
    ॥ १०९॥ वरदाधिराजकान्ता वरदा वरवर्णिनी । वरबोधा वरारोहाभूषिता वर्णनातिगा ॥ ११०॥ वर्णाभावा वर्णश्रेष्ठा
    वर्णाश्रमविधायिनी । वर्ण्यानवद्यचित्केलिर्वर्द्धिनी सुखसम्पदाम् ॥ १११॥ वशकृद्वशगश्रेष्ठा वश्या वसुप्रदायिनी
    । बहुश्रुतो वाच्यकीर्तिर्वारिजासनवन्दिता ॥ ११२ ॥ विकल्मषा विक्षरात्मा विगतेहा विजेतृका । विज्ञानदात्री
    विज्ञानमयाप्राकृतविग्रहा ॥ ११३॥ विज्ञा विज्वरा विदिता विदिशा विद्ययाऽन्विता । विद्यावत्पुङ्गवोत्कृष्टा
    विधात्री विधिकेतना ॥ ११४ ॥ विधिदुर्ज्ञेयमहिमा विधुपूर्णमुखाम्बुजा । विनयार्हा विनीतात्मा विपक्वात्मा
    विपद्धरा ॥ ११५॥ विमत्सरा विमलार्च्या विमुक्तात्मा विमुक्तिदा । विमोहिनी वियन्मूर्तिर्विरतिप्रदचिन्तना
    ॥ ११६॥ विरामा विलसत्क्षान्तिर्विबुधर्षिगणार्चिता । विवेकपरमाधारा विवेकवदुपासिता ॥ ११७॥ विशदश्लोकसम्पूज्या
    विशालेन्दीवरेक्षणा । विशिष्टात्मा विशेषज्ञा विश्वलीलाप्रसारिणी ॥ ११८॥ विश्वतः पाणिपादास्या विश्वमात्रैकधारिणी
    । विश्वभरणी विश्वात्मा विश्वालयव्रजेश्वरी ॥ ११९॥ विश्वासरूपा विश्वेषां साक्षिणी विस्तृतोत्तमा । वीणावाणी
    वीतभ्रान्तिः वीतरागस्मयादिका ॥ १२०॥ वीतशङ्कासमाराध्या वीतसम्पूर्णसाध्वसा । बुधाराध्याङ्घ्रिकमला वृपपा
    वेदकारणम् ॥ १२१॥ वेदगा वेदनिःश्वासा वेदप्रणुतवैभवा । वेदप्रतिपाद्यतत्त्वा वेदवेदान्तकोविदा ॥ १२२॥
    वेदरक्षाविधानज्ञा वेदसारमयाकृतिः । वेदान्तवेद्या वेदान्ता वैदेही वैभवार्णवा ॥ १२३॥ वङ्कचिकुरा वङ्कभ्रूर्वङ्काकर्षणवीक्षणा
    । शक्तिव्रजेश्वरी शक्तिः शतमूर्तिः शतोदिता ॥ १२४॥ शब्दब्रह्मातिगा शब्दविग्रहा शमदायिनी । शमिताश्रितसङ्क्लेशा
    शमिभक्त्याशुतोषिता ॥ १२५॥ शम्पादामोल्लसत्कान्तिः शम्प्रदध्यानसंस्तवा । शम्मयाशेषकैङ्कर्य्या शरणं सर्वदेहिनाम्
    ॥ १२६॥ शरणागतसन्त्रात्री शरण्यैकाऽसुधारिणाम् । शबरीमानदप्रेष्ठा शान्ता शान्तिप्रदायिनी ॥ १२७॥ शाश्वतचिन्तनीयाङ्घ्रिकमला
    शाश्वतस्थिरा । शाश्वती शासिकोत्कृष्टा शिरोधार्यकराम्बुजा ॥ १२८॥ शिशिरा शीलसम्पन्ना शुचिगम्याङ्घ्रिचिन्तना
    । शुचिप्राप्यपदासक्तिः शुद्धान्तःकरणालया ॥ १२९॥ शुद्धा शुद्धिप्रदध्याना शूलत्रयनिवारिणी । शैलराजसुतादीष्टा
    शोभासागर सत्कृता ॥ १३०॥ शौर्यपाथोनिधिः श्यामा श्रयणीयपदाम्बुजा । श्रवणीययशोगाथा श्रीकरी श्रीप्रदायिनी
    ॥ १३१॥ श्रीमदुत्तंसमहिता श्रीमयी श्रीमहानिधिः । श्रीलक्ष्म्यादिभिः सेव्या श्रीवासा श्रीसमुद्भवा ॥
    १३२॥ श्रीः श्रुतिगीतचरिता श्रुत्यन्तप्रतिपादिता । श्रेयोगुणेरणा श्रेयोनिधिः श्रेयोमयस्मृतिः ॥ १३३॥
    श्रोत्रियैकसमाराध्या श्लक्ष्णसूनृतभाषिणी । श्लाघनीयमहाकीर्तिः श्लीलचारित्र्यविश्रुता ॥ १३४॥ श्लोकलोकार्चिताब्जाङ्घ्रिः
    श्वसनाधीशसत्कृता । श्वेतधामोल्लसद्वक्त्रा षट्चतुर्वस्विलोदिता ॥ १३५ ॥ षडतीता षडाधारा षडर्द्धाक्षहृदिस्थिता
    । सखीमण्डलमध्यस्था सगुणा सङ्क्षयोज्झिता ॥ १३६॥ सङ्ख्यातीतगुणा सङ्गमुक्ता सङ्गीतकोविदा । सङ्गीर्णप्रणतत्राणा
    सङ्ग्रहानुग्रहे रता ॥ १३७॥ सख्यशीघ्रसमासाद्या सज्जनोपासिताङ्घ्रिका । सतताराध्यचरणा सतीत्वादर्शदायिनी
    ॥ १३८॥ सतीवृन्दशिरोरत्नं सतीशाजस्रभाविता । सत्तमा सत्यधर्मैकपालिका सत्यरूपिणी ॥ १३९॥ सत्यसञ्चिन्तना
    सत्यसन्धा सत्यापतिस्नुषा । सत्या सत्रधरागर्भोद्भूता सत्ववदग्रणीः ॥ १४०॥ सदाचारा सदासेव्या सदृशातीतशेमुषी
    । सनातनी सदानम्या सन्तोषैकप्रदायिनी ॥ १४१॥ सन्देहापहरा सन्धिः सन्निषेव्यसमाश्रिता । सन्नुत्याशेषचरिता
    सभ्यलोकसभाजिता ॥ १४२॥ समग्रज्ञानवैराग्यधर्मश्रीर्यशोनिधिः । समग्रैश्वर्यसम्पन्ना समतीतगुणोपमा ॥ १४३॥
    समदृष्टिः समर्च्यैका समर्थाग्रा समर्धका । समविश्वमनोज्ञाङ्गी समवेक्ष्याङ्घ्रिलाञ्छना ॥ १४४॥ समाकर्ण्ययशोगाथा
    समाहर्त्री समाहिता । समानात्मा समाराध्या समालम्ब्याङ्घ्रिपङ्कजा ॥ १४५॥ समावर्ता समासेव्या समार्हा
    समितिञ्जया । समीक्ष्याव्याजकरुणा सविभाव्यसुविग्रहा ॥ १४६॥ सरयूपुलिनाक्रीडा सरला सरसेक्षणा । सर्गस्थित्यन्तप्रभवा
    सर्वकामप्रदायिनी ॥ १४७॥ सर्वकार्यबुधा सर्वच्छद्मज्ञा सर्वजन्मदा । सर्वजीवहिता सर्वज्ञानिनां ज्ञेयसत्तमा
    ॥ १४८॥ सर्वज्ञाननिधिः सर्वज्ञानवद्भिरुपासिता । सर्वज्ञा सर्वज्येष्ठादिः सर्वतीर्थमयस्मृतिः ॥ १४९॥
    सर्वतोऽक्ष्यास्यहस्ताङ्घ्रिकमला सर्वदर्शना । सर्वदिव्यगुणोपेता सर्वदुःखहरस्मिता ॥ १५०॥ सर्वदेवनुता
    सर्वधर्मतत्त्वविदां वरा । सर्वधर्मनिधिः सर्वनायकोत्तमनायिका ॥ १५१॥ सर्वनीतिरहस्यज्ञा सर्वनैपुण्यमण्डिता
    । सर्वपापहरध्याना सर्वपावनपावनी ॥ १५२॥ सर्वभक्तावनाभिज्ञा सर्वभक्तिमतां गतिः । सर्वभावपदातीता सर्वभावप्रपूरिका
    ॥ १५३॥ सर्वभक्तिप्रदोत्कृष्टा सर्वभूतहिते रता । सर्वभूताशयाभिज्ञा सर्वभृतसुधारिणी ॥ १५४॥ सर्वमङ्गलमाङ्गल्या
    सर्वमण्डनमण्डना । सर्वमेधाविनां श्रेष्ठा सर्वमोदमयेक्षणा ॥ १५५॥ सर्वमोहच्छिदासक्तिः सर्वमोहनमोहिनी
    । सर्वमौलिमणिप्रेष्ठा सर्वयज्ञफलप्रदा ॥ १५६॥ सर्वयज्ञव्रतस्नाता सर्वयोगविनिःसृता । सर्वरम्यगुणागारा
    सर्वलक्षणलक्षिता ॥ १५७॥ सर्वलावण्यजलधिः सर्वलीलाप्रसारिणी । सर्वलोकनमस्कार्या सर्वलोकेश्वरप्रिया ॥
    १५८॥ सर्वलोकेश्वरी सर्वलौकिकेतरवैभवा । सर्वविद्याव्रतस्नाता सर्ववैभवकारणम् ॥ १५९॥ सर्वशक्तिमतामिष्टा
    सर्वशक्तिमहेश्वरी । सर्वशत्रुहरा सर्वशरणं सर्वशर्मदा ॥ १६०॥ सर्वश्रेयस्करी सर्वसहा सर्वसदर्चिता ।
    सर्वसद्भावनाधारा सर्वसद्भावपोषिणी ॥ १६१॥ सर्वसौख्यप्रदा सर्वसौभाग्यैकप्रदायिनी । साकेतपरमस्थाना साकेतपरमोत्सवा
    ॥ १६२॥ साकेताधिपतिप्रेष्ठा साकेतानन्दवर्षिणी । साक्षान्छ्रीः साक्षिणी सर्वदेहिनां सर्वकर्मणाम् ॥ १६३॥
    साघप्राणिजनारुष्टा सातपत्रोत्तमासना । साधनातीतसम्प्राप्तिः साध्या साध्वीजनप्रिया ॥ १६४॥ सामगा सामगोद्गीता
    साफल्यैकप्रदायिनी । सामर्थ्यजगदाधारमोहिनी साम्यदायिनी ॥ १६५॥ सारज्ञा सिद्धसङ्कल्पा सिद्धसेव्यपदाम्बुजा
    । सिद्धार्था सिद्धिदा सिद्धिरूपिणी सिद्धिसाधनम् ॥ १६६ । सीता सीमन्तिनीश्रेष्ठा सीरध्वजनृपात्मजा ।
    सुकटाक्षा सुकीर्तीड्या सुकृतीनां महाफला ॥ १६७॥ सुकेशीसुखमूलैका सुखसन्दोहदर्शना । सुगमा सुघनज्ञाना
    सुचार्वी सुजवोत्तमा ॥ १६८॥ सुज्ञा सुतन्वी सुदती
