id: kyts-jata-7-3-prajavam-vaa-etena-yanti-krishna-yajurveda-taittiriya-samhita
category: stotram
name:
  english: KYTS Jata 7.3 Prajavam Vaa Etena Yanti - Krishna Yajurveda Taittiriya Samhita
content:
  english: va ete naitena vai va etena | etena yanti yantyete naitena yanti | dyanti yanti yat | mpapavahiya
    maha rahah papavahiya papavahiyamiti papa va ete naitena vai va etena | etena bhavanti bhava ntyete
    naitena bhavanti | dbhavanti bhavanti yat | yata mapathena pathena yatam apathena pratipadyate pratipadyate
    'pathena pathena pratipadyate | pratipadyate yo yah pratipadyate pratipadyate yah | pratipadyata iti
    prati sthanugm hanti hanti sthanugg hanti yo yo hanti hanti yah | nnyeti nyeti bhresha nyeti sa sa
    nyeti nyeti sah | sa hiyate hiyate sa sa hiyate | hiyate sa sa hiyate hiyate sah | vai dashame dashame
    vai vai dashame | ndashame dashame 'hann | nnavivakye 'vivakye 'ha avivakya upahanyata upahanyate
    'vivakye 'vivakya upahanyate upahanyate sa sa upahanyata upahanyate sah | sa hiyate hiyate sa sa hiyate
    | hiyate tasmai tasmai hiyate hiyate tasmai tasmai yo ya stasmai tasmai yah | ya upahatayo pahataya
    yo ya upahataya | upahataya vyaha vyahopahata yopahataya vyaha | vya~ha vyaha tam | nvarabhyai vaiva
    nvarabhya | anvarabhya sagm sa manvarabhya sa mashnute 'shnute sagm sa mashnute | shnute 'shnute 'tha
    | atha yo yo 'thatha yah | yo vyaha vyaha yo yo vyaha | vyaha sa sa vyaha vyaha sah | sa hiyate hiyate
    sa sa hiyate | || ddhiyate hiyate tasma ddashame dashame tasma ndashame dashame 'hann | nnavivakye
    'vivakye 'ha avivakya upahatayo pahataya vivakye 'vivakya upahataya | upahataya na nopahatayo pahataya
    na | vyucya matho atho vyucyam atho khalu khalvatho atho khalu | khalvahu rahuh khalu khalvahuh |
    ryajnasya yajna syahu rahu yajnasya vai vai yajnasya yajnasya vai | vai samriddhena samriddhena vai
    vai samriddhena | samriddhena deva deva ssamriddhena samriddhena devah | ssuvargagm suvarga suvargam
    ~lokam ~lokagm suvargagm suvargam ~lokam | nnayan ~lokam ~loka mayann | yajnasya yajnasyaya yajnasya
    vyriddhena vyriddhena yajnasya yajnasya vyriddhena | vyriddhena sura nasuran vyriddhena vyriddhena
    suran | npara para 'sura nasura npara para 'bhavayann | khalu vai vai khalu khalu vai | vai yajnasya
    yajnasya vai vai yajnasya | yajnasya samriddhagm samriddham ya~jnasya yajnasya samriddham | thsamriddhagm
    samriddha dyajamanasya yajamanasya ta dyajamanasya yajamanasya yat | dbhratrivyasya bhratrivyasya
    ta bhratrivyasya sa sa bhratrivyasya bhratrivyasya sah | vai dashame dashame vai vai dashame | ndashame
    dashame 'hann | nnavivakye 'vivakye 'ha avivakya upahanyata upahanyate 'vivakye 'vivakya upahanyate
    upahanyate sa sa upahanyata upahanyate sah | eva tya tyevaivati | ati recayati recaya tya tyati recayati
    | recayati te te recayati recayati te | ye bahya bahya ye ye bahyah bahya drishikavo drishikavo bahya
    bahya drishikavah | rdrishikavo drishikava yadi tatra tatra yadi yadi tatra | tatra na na tatra tatra
    na | vindeyu rantassadasa dantassadasa rvindeyu rantassadasat | vyu~cya mantassadasa dantassadasa
    antassadasadityantah ya~di yadi vyucyam yadi tatra tatra yadi yadi tatra | tatra na na tatra tatra
    na | rgrihapatina grihapatina vindeyu grihapatina vyucyam ngrihapatina grihapatina vyucya vyucya mevaiva
    vyucyam atha vai va athatha vai | ssarparajniya eta deta sarparajniya rigbhir ssarparajniya rigbhih
    | sarparajniya iti sarpa stuvantiya miyagg stuvanti stuvantiyam | ssarpato vai vai sarpatah | sarpato
    rajni rajni sarpata drajni rajni yat | carca ntyarcanti ca carcanti | dya darca ntyarcanti yat | anricu
    stena tena nricura nricu stena | iyagm sarparajni sarparajniya miyagm sarparajni | sarparajni te te
    sarparajni sarparajni te | sarparajniti sarpa ca vaca vaca ca ca vaca | vaca ''nricu ranricu rvaca
    vaca ''nricuh | dyadanricu ranricu 'rcitaro 'todhya todhyarcitarah | 'rcitara stat | || ubhaya maptva
    ''ptvobhaya mubhaya maptva | aptva 'varuddhya varuddhya ptva ''ptva 'varuddhya | avaruddhyo duda varuddhya
    varuddhyot | ttishthama tishthamodu tishthametiti tishthama tishtha meti | iti tabhi sta bhirititi
    tabhih | rmanasa manasa tabhi stabhi manasa stuvate stuvate manasa manasa stuvate | stuvate na na
    stuvate stuvate na | 'shvaratha ima mima mashvarathah | ashvaratho na na shvaratho 'shvatariratho
    na na shvatarirathah | ashvatariratha ityashvatari arhati mano mano 'r mano vai vai mano mano vai
    | ssadya ima mimagm sadyah | arhati mano mano 'r mmano manah paribhavitum | paribhavitu mathatha paribhavitu
    paribhavitumiti pari atha brahma brahma thatha brahma | brahma vadanti vadanti brahma brahma vadanti
    | vadanti parimitah parimita vadanti vadanti parimitah | parimita vai vai parimitah parimita vai |
    va rica rico vai va ricah | ricah parimitani parimita nyrica ricah parimitani | parimitani samani
    samani parimitani parimitani samani | samani parimitani parimitani samani samani parimitani | parimitani
    yajugmshi yajugmshi parimitani parimitani yajugmshi | yajug shyathatha yajugmshi yajug shyatha | athai
    tasyai tasya thathaitasya | etasyaivaivai tasyai tasyaiva | evanto 'nta evai vantah | anto na nanto
    'nto na | na styasti na nasti | dyada styasti yat | dbrahma brahma tat | tpratigrinate pratigrinate
    ta pratigrinata a pratigrinate pratigrinata a | pratigrinata iti prati a cakshita cakshita cakshita
    | cakshita sa sa cakshita cakshita sah | sa pratigarah pratigara pratigara iti prati brahmavadino
    vadanti vadanti brahmavadino brahmavadino vadanti | brahmavadina iti brahma va~danti vadanti kim |
    ndvadashahasya dvadashahasya ki dvadashahasya prathamena prathamena dvadashahasya dvadashahasya prathamena
    | dvadashahasyeti dvadasha prathame nahna 'hna prathamena prathame nahna tvija mritvija mahna 'hna
    r ya~jamano yajamana ritvija mritvijam yajamano vrinkte vrinkte yajamano yajamano vrinkte | vrinkta
    ititi vrinkte vrinkta iti | iti teja steja ititi tejah | teja indriya mindriya nteja steja indriyam
    | ndriya mindriya miti | ndvitiyena dvitiyena ki dvitiyenetiti dvitiyena dvitiye neti | nprananititi
    pranan | prana nannadya mannadya annadya miti tyannadya mannadya miti | ntritiyena tritiyena ki tritiye
    netiti tritiyena tritiye neti | stri nititi trin | iman ~lokan ~loka nima niman ~lokan | lokanititi
    lokan ~lokaniti | ncaturthena caturthena ki caturthe netiti caturthena caturthe neti | iti catushpada
    shcatushpada ititi catushpadah | shcatushpada shcatushpadah pashun | catushpada iti catuh mpancamena
    pancamena ki pancame netiti pancamena pancame neti | kshara mititi panca pankti mititi pankti kigm
    shashthena shashthena ki shashthe netiti shashthena shashthe neti | rituniti tyritu nrituniti | kigm
    saptamena saptamena ki nkigm saptamena | saptame netiti saptamena saptame neti | iti saptapadagm saptapada
    mititi saptapadam | saptapadagm shakvarigm shakvarigm saptapadagm saptapadagm shakvarim | saptapadamiti
    sapta shakvari mititi shakvarigm shakvari miti | nkimi titi kim | || ashtamene tityashtamena ityashtakshara
    mashtakshara miti tyashtaksharam | ngayatri mashtakshara mashtakshara ashtaksharamityashta gayatri
    mititi gayatri nnavamena navamena ki navame netiti navamena navame neti | ntrivrita mititi trivrita
    trivritagg stomagg stoma ntrivritagg stoma stoma mititi stomagg stoma miti | ndashamena dashamena
    ki dashame netiti dashamena dashame neti | viraja mititi virajam kimekadashe naikadashena ki ekadashene
    tityekadashe naikadashe neti | ityekadashakshara mekadashakshara miti tyekadashaksharam | ntrishtubha
    mekadashakshara mekadashakshara ekadashaksharamityekadasha trishtubha mititi trishtubha ntrishtubha
    miti | ndvadashena dvadashena ki dvadashe netiti dvadashena dvadashe neti | ndvadashakshara mititi
    dvadashaksharam | dvadashaksharamiti dvadasha jagati mititi jagati ityetava detava ditityetavat |
    dvai va etava detava va astyasti vai va asti | dyavada styasti yavat | eva stya styevai vasti | ttada
    styasti tat | vri~nkte vrinkta esha mesham esha vai va esha esha vai | va apta apto vai va aptah |
    apto dvadashaho dvadashaha apta apto dvadashahah | ddvadashaho dvadashaho yat | dvadashaha iti dvadasha
    ttrayodasharatra strayodasharatro ya ntrayodasharatra strayodasharatra trayodasharatra iti trayodasha
    samanagm hi hi samanagm samanagm hi | hyeta detaddhi hyetat | eta daha raha reta deta dahah | tprayaniyah
    prayaniyo ya prayaniya shca ca prayaniyah prayaniya shca | prayaniya iti pra codayaniya udayaniya
    shca codayaniyah | udayaniya shca codayaniya udayaniya shca | ca tryatiratra stryatiratra shca ca
    tryatiratrah | tryatiratro bhavati bhavati tryatiratra stryatiratro bhavati | tryatiratra iti tri
    bhavati traya strayo bhavati bhavati trayah | traya ima ime traya straya ime | ime loka loka ima ime
    lokah | loka esha mesham ~loka loka esham | m ~lokana mesha mesham ~lokana lokana maptya aptyai lokana
    m ~lokana maptyai pranah prana aptya aptyai prano vai vai pranah prano vai | vai prathamah prathamo
    vai vai prathamah | prathamo 'tiratro 'tiratrah prathamah prathamo 'tiratrah | atiratro vyano vyano
    'tiratro 'tiratro vyanah | vyano vyano dvitiyah | dvitiyo 'pano 'pano dvitiyo apana stritiya stritiyo
    'pano 'pana stritiyah | tritiyah pranapanodaneshu pranapanodaneshu tritiya stritiyah pranapanodaneshu
    | pranapanodane shvevaiva pranapanodaneshu pranapanodane shveva | pranapanodaneshviti pranapana eva
    nnadye 'nnadya evaiva nnadye annadye prati pratyannadye 'nnadye prati | prati tishthanti tishthanti
    prati prati tishthanti | tishthanti sarvagm sarva ntishthanti tishthanti sarva ssarvagm sarva mayuh
    | ryanti yantyayu rayu yanti ye ye yanti yanti ye | vi~dvagmso vidvagmsa eva mevam vidvagmsa strayodasharatra
    vi~dvagmso vidvagmsa strayodasharatram | trayodasharatra masata asate trayodasharatra ntrayodasharatra
    masate | trayodasharatramiti trayodasha ttadasata asate tat | rvag vagahu rahu vag vai vai vag vag
    vai | va eshaisha vai va esha | esha vitata vitataishaisha vitata | dvitata vitata yat | ddvadashaho
    dvadashaho ya ndvadashaho dvadashaha stam | dvadashaha iti dvadasha vi cchindyu shchindyu rvi vi cchindyuh
    | dyac chindyu shchindyu nmaddhye maddhye ya maddhye 'tiratra matiratra mmaddhye maddhye 'tiratram
    | nkuryuh kuryu ratiratra matiratra kuryu rupadasu kopadasuka kuryuh kuryu rupadasuka | upadasuka
    grihapate rgrihapate rupadasu kopadasuka grihapateh | rvag vag grihapate sya duparishta duparishta
    thsya duparishtat | uparishtac chandomana nchandomana muparishta duparishtac chandomana chandomanamiti
    chandah nkurvanti kurvanti mahavrata kurvanti santatagm santata nkurvanti kurvanti santatam | santata
    mevaiva santatagm santata meva | ava rundhate rundhate 'vava rundhate | rundhate 'nupadasuka 'nupadasuka
    rundhate rundhate 'nupadasuka | anupadasuka grihapate rgrihapate ranupadasuka 'nupadasuka grihapateh
    | rvag vag grihapate vag bhavati bhavati vag vag bhavati | bhavati pashavah pashavo bhavati bhavati
    pashavah | pashavo vai vai pashavah pashavo vai | vai chandoma shchandoma vai vai chandomah | chandoma
    anna manna nchandoma shchandoma anna chandoma iti chandah mmahavrata manna manna yaduparishta duparishta
    uparishtac chandomana nchandomana muparishta duparishtac chandomana chandomanamiti chandah nkurvanti
    kurvanti mahavrata kurvanti pashushu pashushu kurvanti kurvanti pashushu | pashushu ca ca pashushu
    pashushu ca | eva nnadye 'nnadya evaiva nnadye annadye ca cannadye 'nnadye ca | ca prati prati ca
    ca prati | prati tishthanti tishthanti prati prati tishthanti | tishthantiti tishthanti | || aditya
    akamayanta kamayanta ditya aditya akamayanta | akamayantobhayo rubhayo rakamayanta kamayantobhayoh
    rlokayo rubhayo rubhayo riddhnuyama rdhnuyama lokayo riddhnuyame tityriddhnuyama rdhnuyameti | iti
    te ta ititi te | ncaturdasharatra meta meta ncaturdasharatram | caturdasharatra mapashya ncaturdasharatra
    mapashyann | caturdasharatramiti caturdasha tena yajanta yajanta tena tena yajanta | ayajanta tata
    stato 'yajanta yajanta tatah | tato vai vai tata stato vai | ta ubhayo rubhayo ste ta ubhayoh rlokayo
    rubhayo rubhayo nnardhnuvan ~lokayo rlokayo rardhnuvann | nnamushmiggshca camushminn | amushmiggshca
    camushmi nnamushmiggshca | vi~dvagmso vidvagmsa eva mevam vidvagmsa shcaturdasharatra vi~dvagmso vidvagmsa
    shcaturdasharatram | caturdasharatra masata asate caturdasharatra ncaturdasharatra masate | caturdasharatramiti
    caturdasha asata ubhayo rubhayo rasata asata ubhayoh ubhayo revai vobhayo rubhayo reva | rlokayo revaiva
    lokayoh ntyriddhnuvanti lokayo riddhnuva ntyasmi nnriddhnuva ntyriddhnuva ntyasminn | nnamushmiggshca
    camushminn | amushmiggshca camushmi nnamushmiggshca | ca caturdasharatra shcaturdasharatra shca ca
    caturdasharatrah | caturdasharatro bhavati bhavati caturdasharatra shcaturdasharatro bhavati | caturdasharatra
    iti caturdasha bhavati sapta sapta bhavati bhavati sapta | sapta gramya gramya ssapta sapta gramyah
    | gramya oshadhaya oshadhayo gramya gramya oshadhayah | ssapta saptaushadhaya oshadhaya sapta ranya
    aranya ssapta sapta ranyah | aranya ubhayisha mubhayisha maranya aranya ubhayisham | ubhayisha mavaruddhya
    avaruddhya ubhayisha mubhayisha mavaruddhyai | dyadavaruddhya avaruddhyai yat | tparacinani paracinani
    ya paracinani prishthani prishthani paracinani paracinani prishthani | prishthani bhavanti bhavanti
    prishthani prishthani bhavanti | || mbhavanti bhava ntyamum | amu mevai vamu mamu meva | eva tai stai
    revaiva taih | loka mabhyabhi lokam ~loka mabhi | abhi jayanti jaya ntyabhyabhi jayanti | dyaj jayanti
    jayanti yat | tpraticinani praticinani ya praticinani prishthani prishthani praticinani praticinani
    prishthani | prishthani bhavanti bhavanti prishthani prishthani bhavanti | mbhavanti bhavantimam |
    ima mevaivema mima meva | eva tai stai revaiva taih | loka mabhyabhi lokam ~loka mabhi | abhi jayanti
    jaya ntyabhyabhi jayanti | jayanti trayastrigmshau trayastrigmshau jayanti jayanti trayastrigmshau
    | trayastrigmshau maddhyato maddhyata strayastrigmshau trayastrigmshau maddhyatah | trayastrigmshaviti
    trayah sstomau stomau maddhyato maddhyata sstomau stomau bhavatah | eva gacchanti gaccha ntyevaiva
    gacchanti | gaccha ntyadhiraja vadhirajau gacchanti gaccha ntyadhirajau | adhirajau bhavato bhavato
    'dhiraja vadhirajau bhavatah | bhavato 'dhiraja adhiraja bhavato bhavato 'dhirajah | adhiraja evaiva
    dhiraja adhiraja eva | eva samananagm samanana mevaiva samanana mbhavanti bhavanti samananagm samanana
    bhava ntyatiratra vatiratrau bhavanti bhava ntyatiratrau | atiratra vabhito 'bhito 'tiratra vatiratra
    vabhitah | atiratravityati abhito bhavato bhavato 'bhito 'bhito bhavatah | bhavatah parigrihityai
    parigrihityai bhavato bhavatah parigrihityai | parigrihitya iti pari ssuvargagm suvarga mprajapatih
    prajapati prajapatiriti praja suvargam ~lokam ~lokagm suvargagm suvargam ~lokam | loka maidai llokam
    ~loka mai deva anvanu deva deva anu | tanaditya aditya stag aditya shca caditya aditya shca | ca pashavah
    pashava shca ca pashavah | pashava shca ca pashavah pashava shca | te deva deva ste te devah | ndeva
    deva abruvann | pashu nupajivish mopajivishma pashu npashu nupajivishma | upajivishma te ta upajivi
    shmopajivishma te | upajivishmetyupa ta ima ime te ta ime | anvagmannityanu iti tebhya stebhya ititi
    tebhyah | ntebhya stebhya etam | ncaturdasharatra meta meta ncaturdasharatram | mprati prati caturdasharatra
    caturdasharatramiti caturdasha nprati pratyauhann | ta aditya aditya ste ta adityah | adityah prishthaih
    prishthai raditya adityah prishthaih | ssuvargagm suvarga suvargam ~lokam ~lokagm suvargagm suvargam
    ~lokam | loka ma lokam ~loka ma | ntryahabhya maroha tryahabhya masmi ntryahabhya masminn | tryahabhyamiti
    tri asmin ~loke loke npashun ~loke loke pashun | nprati prati pashu nprati pratyauhann | nprishthaih
    prishthai rauha prishthai raditya adityah prishthaih prishthai radityah | nnaditya aditya amushminn
    | amushmin ~loke loke 'mushmi nnamushmin ~loke | nnardhnuvan ~loke loka ardhnuvann | ntryahabhya mardhnuva
    tryahabhya masmi ntryahabhya masminn | tryahabhyamiti tri asmin ~loke loke nnasmin ~loke | || loke
    pashavah pashavo loke loke pashavah | pashavo ye ye pashavah pashavo ye | vi~dvagmso vidvagmsa eva
    mevam vidvagmsa shcaturdasharatra vi~dvagmso vidvagmsa shcaturdasharatram | caturdasharatra masata
    asate caturdasharatra ncaturdasharatra masate | caturdasharatramiti caturdasha asata ubhayo rubhayo
    rasata asata ubhayoh ubhayo revaivobhayo rubhayo reva | rlokayo revaiva lokayoh riddhnuva ntyriddhnuvanti
    lokayo riddhnuva ntyasmi nnriddhnuva ntyriddhnuva ntyasminn | nnamushmiggshca camushminn | amushmiggshca
    camushmi nnamushmiggshca | ca prishthaih prishthaishca ca prishthaih | prishthai revaiva prishthaih
    prishthai reva | nnevaiva mushminn | amushmin ~loke loke 'mushmi nnamushmin ~loke | loka riddhnuva
    ntyriddhnuvanti loke loka riddhnuvanti | riddhnuvanti tryahabhya ntryahabhya mriddhnuva ntyriddhnuvanti
    tryahabhya tryahabhya masmi ntryahabhya masminn | tryahabhyamiti tri asmin ~loke loke rloke loke jyotih
    | ayu riti tyayu rayu riti | iti tryaha stryaha ititi tryahah | tryaho bhavati bhavati tryaha stryaho
    bhavati | rvava vava jyotih | jyoti rantariksha mantariksha rjyoti rantariksham | rgaurantariksha
    mantariksha asa vayu rayu rasa vasa vayuh | ayu rima nima nayu rayu riman | ima nevaivema nima neva
    | eva lokan ~loka nevaiva lokan | loka nabhyaroha ntyabhyarohanti lokan ~loka nabhyarohanti | dyadabhyaroha
    ntyabhyarohanti yat | abhyarohantityabhi anyatah prishthani prishtha nyanyato 'nyatah prishthani |
    ssyuh prishthani prishthani syuh | maddhye prishthani prishthani maddhye maddhye prishthani | prishthani
    bhavanti bhavanti prishthani prishthani bhavanti | bhavanti savivadhatvaya savivadhatvaya bhavanti
    bhavanti savivadhatvaya | savivadhatva yauja ojah savivadhatvaya savivadhatva yaujah | savivadhatvayeti
    savivadha ojo vai va oja ojo vai | mprishthani prishthani viryam prishtha nyoja ojah prishthani prishtha
    nyojah | oja evai vauja oja eva | vi~rya mevaiva virya mmaddhyato maddhyato viryam maddhyato dadhate
    dadhate maddhyato maddhyato dadhate | dadhate brihadrathantarabhya ndadhate dadhate brihadrathantarabhya
    brihadrathantarabhyam ya~nti yanti brihadrathantarabhya mbrihadrathantarabhyam brihadrathantarabhyamiti
    brihat vava rathantaragm rathantaram va~va vava rathantaram | rathantara masa vasau rathantaragm rathantara
    masau | dbriha dasa vasau brihat | briha dabhya mabhya abhya mevai vabhya mabhya meva | eva yanti
    yantyevaiva yanti | yantyatho atho yanti yantyatho atho anayo ranayo ratho atho anayoh anayo revai
    vanayo ranayo reva | eva prati pratyevaiva prati | prati tishthanti tishthanti prati prati tishthanti
    | tishthantyete ete tishthanti tishthantyete | ete vai va ete ete vai | vai yajnasya yajnasya vai
    vai yajnasya | njasayani anjasayani yajnasya yajnasya anjasayani sruti sruti anjasayani anjasayani
    sruti | anjasayani ityanjasa ntabhyag sruti sruti tabhya sruti iti sruti | tabhya mevaiva tabhya eva
    suvargagm suvarga mevaiva suvargam | suvargam ~lokam ~lokagm suvargagm suvargam ~lokam | ya~nti yanti
    lokam ~lokam nco yanti yanti para va eta ete vai va ete | ete suvargagm suvarga meta ete suvargam
    | suvargam ~lokam ~lokagm suvargagm suvargam ~lokam | loka mabhyaroha ntyabhyarohanti lokam ~loka
