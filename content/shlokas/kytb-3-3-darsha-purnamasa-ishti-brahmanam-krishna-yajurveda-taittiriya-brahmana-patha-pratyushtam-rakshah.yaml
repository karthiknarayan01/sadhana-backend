id: kytb-3-3-darsha-purnamasa-ishti-brahmanam-krishna-yajurveda-taittiriya-brahmana-patha-pratyushtam-rakshah
category: stotram
name:
  english: KYTB 3.3 Darsha Purnamasa Ishti Brahmanam - Krishna Yajurveda Taittiriya Brahmana Patha - Pratyushtam
    Rakshah
content:
  english: krishna yajurvediya taittiriya brahmane tritiyashtake tritiyah prapathakah shapurnamaseshtibrahmanam
    o shri gurubhyo namah | harih om || anuvakam strukhsammargah pratyushtagm rakshah pratyushta arataya
    ityaha | rakshasa mapahatyai | agnervastejishthena tejasa nishtapamityaha meddhyatvaya | sruca | pumagm
    samevabhya shyati mithunatvaya | atha juhum | athopabhrita m | atha dhruvam | asau vai juhuh || ||
    antarikshamupabhrit | prithivi dhruva | ime vai loka ssrucah | vrishtih samamrjanani | vrishtirva
    iman ~lokananupurva nkalpayati | te tatah klripta ssamedhante | samedhante 'sma ime lokah prajaya
    pashubhih | ya evam ve~da || yadi kamayeta var shukah parjanyah syaditi | agrata || vrishtimeva niyacchati
    | avacina gra hi vrishtih | yadi kamayetavar ssyaditi | mulata ssammrijyat | vrishtimevodyacchati
    | tadu va ahuh | agrata evoparishta thsammrijyat | mulato m | agrairantaratah | evamiva hyannamadyate
    | atho agradva oshadhinamurja mpraja upajivanti | urja eva nnadyasyavaruddhyai | adhasta m | dandamuttamatah
    | mulena mula mpratishthityai | tasmadaratnau prancyuparishta llomani | pratyancyadhasta || srugghyesha
    || prano vai sruvah | juhurdakshino hastah | upabhrithsavyah | atma dhruva | annagm samamrjanani |
    mukhato vai prano 'pano bhutva | atmanamanna mpravishya | bahyatastanuvagm shubhayati | tasma thsruvamevagre
    samma shti || mukhato hi prano 'pano bhutva | atmanamanna mavishati | tau pranapanau | avyardhukah
    pranapanabhya sammarjananamagnau praharanam diva shshilpamavatatam | prithivyah kakubhi shritam |
    tena vayagm sahasraval nnashayamasi svaheti srukhsamamrjananyagnau praharati | apo vai darbhah | rupamevaishameta
    vya~cashte || anushtubharca | anushtubhah prajapatih | prajapatyo vedah | vedasyagragg srukhsamamrjanani
    || || svenaivainani chandasa | svaya devataya samardhayati | atho rigvava yosha | tanmithunam | mithunamevasya
    ta dyajne karoti prajananaya | prajayate prajaya pashubhi ryajamanah || tanyeke vrithaivapa syanti
    | tattatha na karya m | arabdhasya yajniyasya karmana 'bhitishtheyuh | na ta tpashubhyah kam | adbhirma
    rjayitvotkare nyasyet | yadvai yajniyasya karmano ssantishthate | utkaro vava tasya pratishtha | etagm
    hi tasmai ssamabharann | yadadbhirmarjayati | tena shantam | yadutkare nyasyati | pratishthamevainani
    ta || pratitishthati prajaya pashubhiryajamanah || atho thsrukhsamamrjanani | stambasho va oshadhayah
    | tasa njaratkakshe pashavo na ramante | apriyo hyesha njaratkakshah | yavadapriyo ha vai jaratkakshah
    pashunam | tavadapriyah pashuna mbhavati | yasyaitanyanyatragne rdadhati | navadavyasu va oshadhishu
    pashavo ramante || mpriyah | yavatpriyo ha vai navadavah pashunam | tavatpriyah pashuna mbhavati |
    yasyaitanyagnau praharanti | tasmadetanyagnaveva praharet | yatarasmin thsammrijyat | pashuna || yo
    bhutanamadhipatih | rudrastanticaro vrisha mma higmsih | etadastu huta ntava svahetyagni samamrjananyagnau
    praharati | esha va etesham yo~nih | esha pratishtha | svamevainani yoni ngamayati | pratitishthati
    prajaya pashubhiryajamanah || vedasyagragg srukhsamamrjanani patnisannahanam ayajno va eshah | yo
    'patnikah | na prajah prajayerann | patnyanva ste | yajnamevakah | prajana ttishthanti sanamhyeta
    | priya njnatigm rundhyat | asina sannahyate | asina hyesha virya pracyanvasita | anaya samada ddakshinata
    udicyanva ste | atmano gopithaya || ashasana saumanasamityaha | meddhyamevaina nkritva | ashisha samardhayati
    | agneranuvrata bhutva sannahye sukritaya kamityaha | etadvai patniyai vratopanayanam || vra~tamupanayati
    | tasmadahuh | yashcaivam ve~da yashcana | yoktrameva yute | yamanvaste | tasyamushmin ~loke bhavatiti
    yoktrena | ya m | sa yogah | yadaste || yogakshemasya klriptyai nkriyata ashih kame yujyata iti |
    ashisha ssamriddhyai | granthi ngrathnati | ashisha evasya mparigrihnati | puman vai granthih | stri
    patni nmithunam | mithunamevasya ta dyajne karoti prajananaya | prajayate prajaya pashubhi || atho
    ardho va esha atmanah | ya | yajnasya dhritya ashithilambhavaya || suprajasastva vayagm supatnirupasedimetyaha
    | yajnameva ta nmithuni karoti | une ndhiyata iti praja 'syoshadhinagm rasa ityaha | rupamevasyai
    vya~cashte | tasya te 'kshiyamanasya nirvapami devayajyaya ityaha | ashishamevaitamasha nca vai madhu
    ca prajapatirasit | yato maddhvasit | tatah praja asrijata | tasma nmadhushi prajananamivasti | tasma
    nmadhusha na pracaranti | yatayama hi | ajyena pracaranti | yajno va ajya m | yajnenaiva yajna mpracarantyayatayamatvaya
    | patnyave || mithunatvaya praja tyai | yadvai patni yajnasya karoti | mithuna ntat | atho patniya
    evaisha yajnasya 'navacchittyai || ameddhyam tpatnyavekshate | gar hapatye 'dhishrayati meddhyatvaya
    | ahavaniya mabhyuddravati | yajnasya santatyai | tejo || tejo va agnih | teja ajya ssamardhayati
    | agniste tejo ma vinaidityahahigmsayai | sphyasya vartman th sadayati | yajnasya santatyai | agnerjihva
    'si subhurdevanamityaha | yatha yajurevaitat | dhamnedhamne devebhyo yajusheyajushe bhavetyaha | ashishamevaitamasha
    || tadva atah pavitra tpunati | yajamano va ajya m | pranapanau pavitre | yajamana eva pranapanau
    dadhati | punarahara m | evamiva hi pranapanau sacamratah | shukramasi jyotirasi tejo 'sityaha | rupamevasyai
    ta vya~cashte | triryajusha | traya ime lokah || | trih | tryavriddhi yajnah | atho meddhyatvaya |
    athajyavatibhyamapah | rupamevasameta ndadhati | api va utahuh | yatha ha vai yosha suvarnagm hiranya
    mbibhrati rupanyaste hiti | apo vai sarva devatah rmimagmsa | jami syat | ya 'pa utpuniyat | chandasa
    'pa utpunatyajamitvaya | atho mithunatvaya | savitriyarca | savitriprasuta mme karmasaditi | savitriprasutamevasya
    karma bhavati | paccho gayatriya trih shamriddhatvaya | adbhirevaushadhi ssannayati | oshadhibhih
    pashun | pashubhiryajamanam | shukra njyotistva jyotishyarcistva 'rcishityaha sarvatvaya | parya ptya
    anantarayaya || ajyagrahanam devasura ya~tta asann | sa etamindra ajyasyavakasha kshata | tato deva
    abhavann | para mavekshate | bhavatyatmana 'sya bhratrivyo bhavati | brahmavadino vadanti | yadajyenanyani
    havig || atha kenajyamiti | satyeneti bruyat | cakshurvai satyam | satyenaivainada bhigharayati |
    ishvaro va esho 'ndho bhavitoh | yashcakshusha ''jyamavekshate | nimilyave ksheta | dadharatmancakshuh
    | abhyajya || chandagmsi va ajya m | chandagsyeva prinati | caturjuhva ngrihnati | catushpadah pashavah
    | pashunevavarundhe | ashtavupabhriti | ashtakshara gayatri | gayatrah pranah | pranameva pashushu
    dadhati | caturdhruvaya || catushpadah pashavah | pashushve pratitishthati | yajamanadevatya vai juhuh
    | bhratrivyadevatyopabhrit | caturjuhva ngrihnanbhuyo grihniyat | ashtavupabhriti grihnan kaniyah
    | yajamanayaiva bhratrivyamupasti nkaroti || gaurvai srucah | caturjuhva ngrihnati | tasmaccatushpadi
    || || ashtavupabhriti | tasmadashtashapha | caturdhruvaya m | tasmaccatuh stana | gameva ta ngrihnati
    | prayajebhyastat | yadupabhriti | prayajanuyajebhyastat | sarvasmai va eta dyajnaya grihyate | yaddhruvayamajya
    prayajanuyajebhyasta strukhsadanam apo deviragrepuvo agreguva ityaha | rupamevasameta vya~cashte |
    agra imam nnayatagre yajnapatimityaha | agra eva yajna nnayanti | agre yajnapatim | yushmanindro 'vrinita
    vritraturye yuyamindramavriniddhvam vri~traturya ityaha | vritragm ha hanishyannindra apo vavre |
    apo hendram vya~cashte | prokshita || tenapah prokshitah || agni rdevebhyo nilayata | krishno rupa
    nkritva | sa vanaspati npravishat | krishno tva svahetyaha | agnaya evaina nkaroti | atho agnereva
    medhamavarundhe || vedirasi barhishe tva svahetyaha | praja vai barhih | prithivi vedih || || praja
    eva prithivya mpratishthapayati | barhirasi srugbhyastva svahetyaha | praja vai barhih | yajamana
    ssrucah | yajamanameva prajasu pratishthapayati || dive tva 'ntarikshaya tva prithivyai tveti barhirasadya
    prokshati | ebhya evainam lo~kebhyah prokshati | atha tatah saha sruca purasta mpratyukshati | praja
    vai barhih | yatha sutyai kala apah purasta || tadrigeva tat || svadha pitribhya ityaha | svadhakaro
    hi pitrinam | urgbhava bar hishadbhya iti dakshinayai shronerottarasyai ninayati santatyai | masa
    vai pitaro bar hishadah | masaneva prinati | masa va oshadhi rvardhayanti | masah pacanti samriddhyai
    | anatiskandan ngacchatetyaha | prithivyamevorja tprithivya urja bhunjate | granthim vi~sragmsayati
    | prajanayatyeva tat | urdhva mpratyancamayacchati | tasma tpracinagm reto dhiyate | praticih praja
    jayante || vishno 'sityaha | yajno vai vishnuh || ngrihnati | mukhyamevaina ngrihnati | prajapatina
    yajnamukhena sammitam | iyanta ngrihnati | yajnaparusha sammitam | iyanta ngrihnati | etavadvai purushe
    virya m | virya sammitam || ngrihnati | aparimitasyavaruddhyai | tasmi npavitre apisrijati | yajamano
    vai prastarah | pranapanau pavitre | yajamana eva pranapanau dadhati || urna ntva strinamityaha |
    yathayajurevai tat | svasastha ndevebhya ityaha | devebhya evaina sstrinati | praja vai barhih | prithivi
    vedih | praja eva prithivya mpratishthapayati || anatidrishnagg strinati | prajayaivaina npari dadhati
    | yajamano vai prastarah | yajamana eva ta npari dadhati || gandharvo 'si vishvavasurityaha || ryajamane
    dadhati | indrasya bahurasi dakshina ityaha | indriyameva yajamane dadhati | mitravarunau tvottaratah
    paridhattamityaha | pranapanau mitravarunau | pranapana ndadhati | suryastva purasta tpatvityaha |
    rakshasa shcidabhishastya ityaha | aparimitadevaina ntva kava ityaha | agnimeva hotrena samardhayati
    | dyumantagm samidhimahityaha samiddhyai | agne brihantamaddhvara ityaha vriddhyai | visho yantre
    stha ityaha | visham gre nidadhati pratishthityai | vasunagm rudrana madityanagm sadasi sidetyaha
    | devatanameva sadane prastaragm sadayati || juhurasi ghritaci namnetyaha || || asau vai juhuh | antarikshamupabhrit
    | prithivi dhruva | tasametadeva priya dghritacityaha | priyenaivaina namna sadayati || eta asadan
    thsukritasya loka ityaha | satyam vai~ sukritasya lokah | satya evaina ssukritasya loke sadayati |
    ta vishno pahityaha | yajno vai vishnuh | yajnasya dhrityai ya~jnaniyamityaha | yajnaya yajamanayatmane
    | tebhya evashishamashaste loke sadayati shatca agharah agnina vai hotra nabhyabhavann | agnaye samiddhyamanaya
    nubruhityaha bhratrivyabhibhutyai | ekavigmshati middhmadaruni bhavanti | ekavigmsho vai purushah
    | purushasyaptyai | pancadasheddhmadarunya bhyadadhati | pancadasha va ardhamasasya ratrayah | ardhamasasha
    || urdhve samidhavadadhati | anuyajebhyah samidhamatishinashti | shatthsa mpadyante | shadva ritavah
    | rituneva prinati | vedenopavajayati | prajapatyo vai vedah | prajapatyah pranah | yajamana ahavaniyah
    | yajamana eva prana || trirupavajayati | trayo vai pranah | prananevasmi ndadhati | vedenopayatya
    sruvena prajapatya magharayati | yajno vai prajapatih | yajnameva prajapati mmukhata arabhate | atho
    | sarva eva devatah prinati || agnimagni ssammriddhityaha | tryavriddhi yajnah || || atho rakshasamapahatyai
    | paridhin shti | punatyevainan | tristri shti | tryavriddhi yajnah | atho meddhyatvaya | atho ete
    vai devashvah | devashvaneva ta shti | suvargasya lokasya samashtyai | asino || tishthannanyam | yatha
    va~ yunjyat | evameva tadaddhvaryu yu~nakti | suvargasya lokasyabhyu ngramyah pashavah | ya evam ve~da
    || bhuvanamasi viprathasvetyaha | yajno vai bhuvanam | yajna eva yajamana mprajaya pashubhih prathayati
    | agne yashtarida || agnirvai devanam | tasma eva namaskaroti || juhvehyagnistva hvayati devayajyaya
    upabhridehi devastva savita hvayati devayajyaya ityaha | agneyi vai juhuh | savitryupabhrit | tabhyamevaine
    prasuta adatte || agnavishnu ma vamavakramishamityaha | agnih purasta t | vishnuryajnah pashcat ||
    || tabhyameva prati procyatyakramati | vijihatha ptamityahahigmsayai | loka mme lokakritau krinutamityaha
    | ashishamevaitamasha ssthanamasityaha | yajno vai vishnuh | eta dyajnah | devanamevaparajita ayatane
    tishthati || ita indro akrino dviryanityaha || || indriyameva yajamane dadhati | samarabhyordhvo addhvaro
    divisprishamityaha vriddhyai magharyamanamanu samarabhya | etasmin kale deva lo~kamayann | sakshadeva
    yajamana lo~kameti | atho samriddhenaiva yajnena yajamana lo~kameti | ahruto yajno yajnapaterityahana
    rtyai | indravan thsvahetyaha | indriyameva yajamane dadhati | brihadbha ityaha || || suvargo vai
    loko brihadbhah | suvargasya lokasya samashtyai || yajamanadevatya vai juhuh | bhratrivyadevatyopabhrit
    | prana agharah | ya ndaddhyat | asaggspar shayannatyakramati | yajamana eva prana 'gne dushcaritada
    ma sucarite bhajetyaha || || agnirvava pavitra ndushcaritam | rijukarmagm satyagm sucaritam | agnirevainam
    ddushcaritatpati | rijukarme satye sucarite bhajati | tasmadevamasha ste | atmano gopithaya || shiro
    va eta dyajnasya | yadagharah | atma dhruva || magharya dhruvagm samanakti | atmanneva yajnasya shirah
    pratidadhati | dvi ssamanakti | dvau hi pranapanau | tadahuh | trireva samanjyat | tridhatu hi shira
    iti | shira ivaita dyajnasya | atho trayo vai pranah | prananevasmi ndadhati || makhasya shiro 'si
    sanjyotisha jyotiranktamityaha | jyotirevasma uparishta ddadhati | suvargasya lokasyanukhyatyai ||
    idabhakshanam dhishniya va ete nyupyante | yadbrahma | yaddhota | yadaddhvaryuh | yadagnit | ya yadantareyat
    | yajamanasya pranan ssyat | purodashamapagrihya sancaratyaddhvaryuh || || yajamanayaiva tallokagm
    shigmshati | nasya pranan shati | na pramayuko bhavati | purasta tpratyannasinah | idaya idamadadhati
    | hastyagm hotre | pashavah purushah | pashushveva pashu npratishthapayati | idayai va esha prajatih
    || 'nu prajayate | dvirangulavanakti parvanoh | dvipa dyajamanah pratishthityai | sakridupastrinati
    | dviradadhati | sakridabhigharayati | catu ssampadyate | catvari vai pashoh pratishthanani | yavaneva
    pashuh | tamupahvayate || || mukhamiva pratyupahvayeta | samunkhaneva pashunupahvayate | pashavo va
    ida | addhvaryuna ca yajamanena ca | upahutah pashumanasanityaha | upa hyenau hvayate hota mupahave
    | upahutah pashuma vai~ hastyamidamadadhati | vaca m | yamupahvayate | prananagm sa | vaca shcavarundhe
    || atha va etar hyupahutayamidayam | purodashasyaiva bar hishado mimagmsa | yajamana ndeva abruvann
    | havirno nirvapeti | nahamabhago nirvaphsyamityabravit || 'bhagaya 'nuvakshyatheti vagabravit | nahamabhaga
    puro 'nuvakya bhavishyamiti puro | nahamabhaga yajya bhavishyamiti yajya 'bhagena vashatkarishyatheti
    vashatkarah | ya nkaroti | taneva ta dbhaginah karoti | caturdha karoti | catasro dishah | dikshveva
    pratitishthati | barhishada || yajamano vai purodashah | praja barhih | yajamanameva prajasu pratishthapayati
    | tasmadasthna 'nyah prajah pratitishthanti | magmsenanyah | atho khalvahuh | dakshina va eta havi
    ntarvedyavaruddhyante | ya nkarotiti | caturdha karoti | catvaro hyete havi ryajnasyartvijah || 'ddhvaryuragnit
    | tamabhimrishet | ida mbrahmanah | idagm hotuh | idamaddhvaryoh | idamagnidha iti | yathaivada 'ddhvare
    | adeshamritvigbhyo dakshina niyante | tadrigeva tat | agnidhe || agnimukha hyriddhih | agnimukhamevardhim
    ya~jamana riddhnoti || sakridupastirya dviradadhat | upastirya dvirabhigharayati | shat thsampadyante
    | shadva ritavah | rituneva prinati | vedena brahmane mpariharati | prajapatyo vai vedah | prajapatyo
    brahma || || savita yajnasya prasu tyai | atha kamamanyena | tato hotre dyajnasya | yaddhota | maddhyata
    eva yajna | pratishtha va esha yajnasya | yadaddhvaryuh | tasma ryajnasyaitamevavritamanu || || anya
    dakshina niyante | yajnasya pratishthityai | agnimagni thsammriddhityaha | paramiva hyetar hi yajnah
    || ishita daivya hotara ityaha | ishitagm hi karma kriyate | bhadravacyaya preshito manusha ssuktavakaya
    sukta bruhityaha | ashishamevaitamasha ste | svaga daivya hotribhya ityaha | yajnameva tathsvaga karoti
    | svasti rmanushebhya ityaha | ashishamevaitamasha rbruhityaha | sham mbhagadheyena samardhayati ||
    prastarapraharadikam atha srucavanushtugbhyam vyu~hati | pratishtha va anushtuk | annam va~jah pratishthityai
    | annadyasyavaruddhyai | praci njuhumuhati | jataneva bhratrivya npranudate | praticimupabhrita m
    | janishyamananeva pratinudate | sa vishuca evapohya sapatnan yajamanah | asmin ~loke pratitishthati
    || m | dvipratishtho hi || vasubhyastva rudrebhyastva ''dityebhyastvetyaha | yathayajurevai tat |
    srukshu prastaramanakti | ime vai loka ssrucah | yajamanah prastarah | yajamanameva tejasa 'nakti
    | traya ime lokah || 'nakti | abhipurvamanakti | abhipurvameva yajamana 'nakti || aktagm rihana ityaha
    | tejo va ajya m | yajamanah prastarah | yajamanameva tejasa 'nakti | viyantu vaya ityaha | vaya evaina
    nkritva | suvargam mma nirmrikshamityaha | prajayai gopithaya || apyayantamapa oshadhaya ityaha |
    apa evaushadhirapyayayati | maruta ssthetyaha | maruto vai vrishtya ishate | vrishtimevavarundhe |
    diva ngaccha tato no vrishtimerayetyaha | vrishtirvai dyauh | vrishtimevavarundhe || || yavadva addhvaryuh
    prastara mpraharati | tavadasyayurmiyate | ayushpa agne 'syayurme pahityaha | ayurevatman dhatte |
    yavadva addhvaryuh prastara mpraharati | tavadasya cakshurmiyate | cakshushpa agne 'si cakshurme pahityaha
    | cakshurevatman 'sityaha pratishthityai || ya mparyadhattha ityaha || || yathayajurevaitat | agne
    deva panibhi rviyamana ityaha | agnaya evaina mbharamityaha | sajatanevasma anukankaroti | nedesha
    tvadapacetayata ityahanukhyatyai || yajnasya patha upa samitamityaha | bhumanamevopaiti | paridhin
    praharati | yajnasya samishtyai || mprasravayati | yadeva tatra kruram | tat tena shamayati | juhvamupabhrita
    m | yajamanadevatya vai juhuh | bhratrivyadevatyopabhrit | yajamanayaiva bhratrivyamupasti nkaroti
    || saggsravabhaga ssthetyaha | vasavo vai rudra aditya ssaggsravabhagah | tesha || taneva tena prinati
    | vaishvadevyarca | ete hi vishve devah | trishtug vai~ trishtuk | indriyameva yajamane dadhati ||
    agnervamapannagrihasya sadasi sadayamityaha | iyam va~ agnirapannagrihah | asya evaine sadane sadayati
    | sumnaya sumnini sumne ma dhattamityaha || || praja vai pashavah sumnam | prajameva pashunatmandhatte
    | dhuri dhuryau patamityaha | jayapatyo rgopithaya || agne 'shitatano ityaha | yathayajurevaitat |
    pahi ma 'dya divah pahi prasityai pahi durishtyai pahi duradmanyai pahi dushcaritadityaha | ashishamevaitamasha
    nkrinu sushada yonigg svaheti vri~shcananyanvaharyapacane 'bhyadhaya phalikaranahoma njuhoti | atiriktani
    va iddhma sam || atiriktah phalikaranah | atiriktamajyoccheshanam | atirikta evatirikta ndadhati |
    atho atirikte rdevebhyo nilayata | tam ve~denanvavindann | vedena vedim vi~viduh prithivim | sa paprathe
    prithivi parthivani | garbha mbibharti bhuvaneshvantah | tato yajno jayate vishvadaniriti purasta
