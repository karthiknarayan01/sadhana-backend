id: narayaniyam-dashaka-15
category: stotram
name:
  english: Narayaniyam Dashaka 15
content:
  english: matiriha gunasakta bandhakritteshvasakta tvamritakriduparundhe bhaktiyogastu saktim | mahadanugamalabhya
    bhaktirevatra sadhya kapilatanuriti tvam devahutyai nyagadih || || prakritimahadahankarashca matrashca
    bhuta nyapi hridapi dashakshi purushah pancavimshah | iti viditavibhago mucyate'sau prakritya kapilatanuriti
    tvam devahutyai nyagadih || || prakritigatagunaughairnajyate purusho'yam yadi tu sajati tasyam tat
    gunastam bhajeran | madanubhajanatattvalocanaih sa'pyapeyat kapilatanuriti tvam devahutyai nyagadih
    || || vimalamatirupattairasanadyairmadangam garudasamadhirudham divyabhushayudhankam | rucitulitatamalam
    shilayetanuvelam kapilatanuriti tvam devahutyai nyagadih || || mama gunaganalilakarnanaih kirtanadyai
    rmayi surasaridoghaprakhyacittanuvrittih | bhavati paramabhaktih sa hi mrityorvijetri kapilatanuriti
    tvam devahutyai nyagadih || || ahaha bahulahimsasancitarthaih kutumbam pratidinamanupushnan strijito
    balalali | vishati hi grihasakto yatanam mayyabhaktah kapilatanurititvam devahutyai nyagadih || ||
    yuvatijatharakhinno jatabodho'pyakande prasavagalitabodhah pidayollanghya balyam | punarapi bata muhyatyeva
    tarunyakale kapilatanuriti tvam devahutyai nyagadih || || pitrisuraganayaji dharmiko yo grihasthah
    sa ca nipatati kale dakshinadhvopagami | mayi nihitamakamam karma tudakpathartham kapiltanuriti tvam
    devahutyai nyagadih || || iti suviditavedyam deva he devahutim kritanutimanugrihya tvam gato yogisanghaih
    | vimalamatiratha'sau bhaktiyogena mukta tvamapi janahitartham vartase pragudicyam || || parama kimu
    bahuktya tvatpadambhojabhaktim sakalabhayavinetrim sarvakamopanetrim | vadasi khalu dridham tvam tadvidhuyamayan
    me gurupavanapuresha tvayyupadhatsva bhaktim ||
  devanagari: मतिरिह गुणसक्ता बन्धकृत्तेष्वसक्ता त्वमृतकृदुपरुन्धे भक्तियोगस्तु सक्तिम् । महदनुगमलभ्या
    भक्तिरेवात्र साध्या कपिलतनुरिति त्वं देवहूत्यै न्यगादीः ॥ ॥ प्रकृतिमहदहङ्काराश्च मात्राश्च भूता न्यपि
    हृदपि दशाक्षी पूरुषः पञ्चविंशः । इति विदितविभागो मुच्यतेऽसौ प्रकृत्या कपिलतनुरिति त्वं देवहूत्यै न्यगादीः
    ॥ ॥ प्रकृतिगतगुणौघैर्नाज्यते पूरुषोऽयं यदि तु सजति तस्यां तत् गुणास्तं भजेरन् । मदनुभजनतत्त्वालोचनैः
    साऽप्यपेयात् कपिलतनुरिति त्वं देवहूत्यै न्यगादीः ॥ ॥ विमलमतिरुपात्तैरासनाद्यैर्मदङ्गं गरुडसमधिरूढं
    दिव्यभूषायुधाङ्कम् । रुचितुलिततमालं शीलयेतानुवेलं कपिलतनुरिति त्वं देवहूत्यै न्यगादीः ॥ ॥ मम गुणगणलीलाकर्णनैः
    कीर्तनाद्यै र्मयि सुरसरिदोघप्रख्यचित्तानुवृत्तिः । भवति परमभक्तिः सा हि मृत्योर्विजेत्री कपिलतनुरिति
    त्वं देवहूत्यै न्यगादीः ॥ ॥ अहह बहुलहिंसासञ्चितार्थैः कुटुम्बं प्रतिदिनमनुपुष्णन् स्त्रीजितो बाललाली
    । विशति हि गृहसक्तो यातनां मय्यभक्तः कपिलतनुरितित्वं देवहूत्यै न्यगादीः ॥ ॥ युवतिजठरखिन्नो जातबोधोऽप्यकाण्डे
    प्रसवगलितबोधः पीडयोल्लङ्घ्य बाल्यम् । पुनरपि बत मुह्यत्येव तारुण्यकाले कपिलतनुरिति त्वं देवहूत्यै
    न्यगादीः ॥ ॥ पितृसुरगणयाजी धार्मिको यो गृहस्थः स च निपतति काले दक्षिणाध्वोपगामी । मयि निहितमकामं कर्म
    तूदक्पथार्थं कपिल्तनुरिति त्वं देवहूत्यै न्यगादीः ॥ ॥ इति सुविदितवेद्यां देव हे देवहूतिं कृतनुतिमनुगृह्य
    त्वं गतो योगिसङ्घैः । विमलमतिरथाऽसौ भक्तियोगेन मुक्ता त्वमपि जनहितार्थं वर्तसे प्रागुदीच्याम् ॥ ॥
    परम किमु बहूक्त्या त्वत्पदाम्भोजभक्तिं सकलभयविनेत्रीं सर्वकामोपनेत्रीम् । वदसि खलु दृढं त्वं तद्विधूयामयान्
    मे गुरुपवनपुरेश त्वय्युपाधत्स्व भक्तिम् ॥
