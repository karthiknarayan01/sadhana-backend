id: bhavanikavac
category: kavacha
name:
  english: bhavanikavac
  devanagari: भवानीकवच्
content:
  english: raksha mahamaye padme padmalaye shive || 8|| vanchitam purayitva tu bhavani patu sarvada |
    ya idam kavacam devya janati saca mantravit || 9|| rajadvare shmashane ca bhutapretopacarike | bandhane
    ca mahaduhkhe pathecchatrusamagame || 10|| smaranatkavacasyasya nirbhayo jayate narah | prayogamupacarasya
    bhavanyah kartumicchati || 11|| kavacam prapathedadau tatah siddhimavapnuyat | bhurjapatre likhitva
    tu kavacam yastudharayet || 12|| dehe ca yatra kutrapi sarva siddhirbhavennarah | shastrastrasya bhayam
    naiva bhutadi bhayanashanam || 13|| guru bhaktim samasadya bhavanyastavanam kuru | sahasra nama pathane
    kavacam prathamam guru || 14|| nandine kathitam devi tavagre ca prakashitam | saganta jayate devi
    nanyatha girinandini || 15|| idam kavacamajnatva bhavanim stautiyo narah | kalpa koti shatenapi nabhavetsiddhidayini
    || 16|| || iti shribhavani trailokyamohanakavacam sampurnam ||
  devanagari: रक्ष महामाये पद्मे पद्मालये शिवे ॥ ८॥ वाञ्छितं पूरयित्वा तु भवानी पातु सर्वदा । य इदं कवचं
    देव्या जानाति सच मन्त्रवित् ॥ ९॥ राजद्वारे श्मशाने च भूतप्रेतोपचारिके । बन्धने च महादुःखे पठेच्छत्रुसमागमे
    ॥ १०॥ स्मरणात्कवचस्यास्य निर्भयो जायते नरः । प्रयोगमुपचारस्य भवान्याः कर्तुमिच्छति ॥ ११॥ कवचं प्रपठेदादौ
    ततः सिद्धिमवाप्नुयात् । भूर्जपत्रे लिखित्वा तु कवचं यस्तुधारयेत् ॥ १२॥ देहे च यत्र कुत्रापि सर्व सिद्धिर्भवेन्नरः
    । शस्त्रास्त्रस्य भयं नैव भूतादि भयनाशनम् ॥ १३॥ गुरु भक्तिं समासाद्य भवान्यास्तवनं कुरु । सहस्र नाम
    पठने कवचं प्रथमं गुरु ॥ १४॥ नन्दिने कथितं देवि तवाग्रे च प्रकाशितम् । सागन्ता जायते देवि नान्यथा गिरिनन्दिनि
    ॥ १५॥ इदं कवचमज्ञात्वा भवानीं स्तौतियो नरः । कल्प कोटि शतेनापि नभवेत्सिद्धिदायिनी ॥ १६॥ ॥ इति श्रीभवानी
    त्रैलोक्यमोहनकवचं सम्पूर्णम् ॥
