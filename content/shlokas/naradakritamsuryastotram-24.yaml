id: naradakritamsuryastotram-24
category: stotram
name:
  english: naradakritamsuryastotram 24
  devanagari: नारदकृतंसूर्यस्तोत्रम् २४
content:
  english: naradakritam suryastotram 24 krishnajinaparicchinne hyupavishto varasane | rishitoyatate ramye
    pratishthapya mahamunih || 16|| suryasya pratimam ramyam sarvadaridryanashinim | tushtava vividhaih
    stotrairadityam timirapaham || 17|| namaste riksvarupaya samnam dhamaga te namah | jnanaikarupadehaya
    nirdhutatamase namah || 18|| shuddhajyotihsvarupaya nirmurtayamalatmane | varishthaya varenyaya sarvasmai
    paramatmane || 19|| namo'khilajagadvyapisvarupanandamurtaye | sarvakaranabhutaya nishthayai jnanacetasam
    || 20|| namah sarvasvarupaya prakashalakshyarupine | bhaskaraya namastubhyam tatha dinakrite namah
    || 21|| ishvara uvaca | evam samstuvatastasya puratastasya cetasa | pradurbabhuva deveshi jagaccakshuh
    sanatanah || 22 iti shriskandapurane prabhasakhande prabhasakshetramahatmye tryadhikatrishatatamadhyayantargatam
    naradakritam suryastotram samaptam | skandapurana | prabhasakhanda | adhyaya 305
  devanagari: नारदकृतं सूर्यस्तोत्रम् २४ कृष्णाजिनपरिच्छिन्ने ह्युपविष्टो वरासने । ऋषितोयातटे रम्ये प्रतिष्ठाप्य
    महामुनिः ॥ १६॥ सूर्यस्य प्रतिमां रम्यां सर्वदारिद्र्यनाशिनीम् । तुष्टाव विविधैः स्तोत्रैरादित्यं तिमिरापहम्
    ॥ १७॥ नमस्ते ऋक्स्वरूपाय साम्नां धामग ते नमः । ज्ञानैकरूपदेहाय निर्धूततमसे नमः ॥ १८॥ शुद्धज्योतिःस्वरूपाय
    निर्मूर्तायामलात्मने । वरिष्ठाय वरेण्याय सर्वस्मै परमात्मने ॥ १९॥ नमोऽखिलजगद्व्यापिस्वरूपानन्दमूर्तये
    । सर्वकारणभूताय निष्ठायै ज्ञानचेतसाम् ॥ २०॥ नमः सर्वस्वरूपाय प्रकाशालक्ष्यरूपिणे । भास्कराय नमस्तुभ्यं
    तथा दिनकृते नमः ॥ २१॥ ईश्वर उवाच । एवं संस्तुवतस्तस्य पुरतस्तस्य चेतसा । प्रादुर्बभूव देवेशि जगच्चक्षुः
    सनातनः ॥ २२ इति श्रीस्कन्दपुराणे प्रभासखण्डे प्रभासक्षेत्रमाहात्म्ये त्र्यधिकत्रिशततमाध्यायान्तर्गतं
    नारदकृतं सूर्यस्तोत्रं समाप्तम् । स्कन्दपुराण । प्रभासखण्ड । अध्याय ३०५
