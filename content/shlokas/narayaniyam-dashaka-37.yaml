id: narayaniyam-dashaka-37
category: stotram
name:
  english: Narayaniyam Dashaka 37
content:
  english: sandranandatano hare nanu pura daivasure sangare tvatkritta api karmasheshavashato ye te na
    yata gatim | tesham bhutalajanmanam ditibhuvam bharena durardita bhumih prapa virincamashritapadam
    devaih puraivagataih || || ha ha durjanabhuribharamathitam pathonidhau patuka metam palaya hanta me
    vivashatam sampriccha devaniman | ityadipracurapralapavivashamalokya dhata mahim devanam vadanani
    vikshya parito dadhyau bhavantam hare || || uce cambujabhuramunayi surah satyam dharitrya vaco nanvasya
    bhavatam ca rakshanavidhau daksho hi lakshmipatih | sarve sharvapurassara vayamito gatva payovaridhim
    natva tam stumahe javaditi yayuh sakam tavaketanam || || te mugdhanilashalidugdhajaladhestiram gatah
    sangata yavattvatpadacintanaikamanasastavat sa pathojabhuh | tvadvacam hridaye nishamya sakalananandayannuciva
    nakhyatah paramatmana svayamaham vakyam tadakarnyatam || || jane dinadashamaham divishadam bhumeshca
    bhimairnripai statkshepaya bhavami yadavakule so'ham samagratmana | deva vrishnikule bhavantu kalaya
    devanganashcavanau matsevarthamiti tvadiyavacanam pathojabhurucivan || || shrutva karnarasayanam tava
    vacah sarveshu nirvapita svanteshvisha gateshu tavakakripapiyushatriptatmasu | vikhyate madhurapure
    kila bhavatsannidhyapunyottare dhanyam devakanandanamudavahadraja sa shuratmajah || || udvahavasitau
    tadiyasahajah kamso'tha sammanaya nnetau sutataya gatah pathi rathe vyomotthaya tvadgira | asyastvamatidushtamashtamasuto
    hanteti hanteritah santrasat sa tu hantumantikagatam tanvim kripanimadhat || || grihnanashcikureshu
    tam khalamatih shaureshciram santvanai rno muncan punaratmajarpanagira prito'tha yato grihan | adyam
    tvatsahajam tatha'rpitamapi snehena nahannasau dushtanamapi deva pushtakaruna drishta hi dhirekada
    || || tavattvanmanasaiva naradamunih proce sa bhojeshvaram yuyam nanvasurah surashca yadavo janasi
    kim na prabho | mayavi sa harirbhavadvadhakrite bhavi suraprarthana dityakarnya yadunadudhunadasau
    shaureshca sununahan || || prapte saptamagarbhatamahipatau tvatprerananmayaya nite madhava rohinim
    tvamapi bhohsaccitsukhaikatmakah | devakya jatharam viveshitha vibho samstuyamanah suraih sa tvam
    krishna vidhuya rogapatalim bhaktim param dehi me ||
  devanagari: सान्द्रानन्दतनो हरे ननु पुरा दैवासुरे सङ्गरे त्वत्कृत्ता अपि कर्मशेषवशतो ये ते न याता गतिम्
    । तेषां भूतलजन्मनां दितिभुवां भारेण दूरार्दिता भूमिः प्राप विरिञ्चमाश्रितपदं देवैः पुरैवागतैः ॥ ॥
    हा हा दुर्जनभूरिभारमथितां पाथोनिधौ पातुका मेतां पालय हन्त मे विवशतां सम्पृच्छ देवानिमान् । इत्यादिप्रचुरप्रलापविवशामालोक्य
    धाता महीं देवानां वदनानि वीक्ष्य परितो दध्यौ भवन्तं हरे ॥ ॥ ऊचे चाम्बुजभूरमूनयि सुराः सत्यं धरित्र्या
    वचो नन्वस्या भवतां च रक्षणविधौ दक्षो हि लक्ष्मीपतिः । सर्वे शर्वपुरस्सरा वयमितो गत्वा पयोवारिधिं नत्वा
    तं स्तुमहे जवादिति ययुः साकं तवाकेतनम् ॥ ॥ ते मुग्धानिलशालिदुग्धजलधेस्तीरं गताः सङ्गता यावत्त्वत्पदचिन्तनैकमनसस्तावत्
    स पाथोजभूः । त्वद्वाचं हृदये निशम्य सकलानानन्दयन्नूचिवा नाख्यातः परमात्मना स्वयमहं वाक्यं तदाकर्ण्यताम्
    ॥ ॥ जाने दीनदशामहं दिविषदां भूमेश्च भीमैर्नृपै स्तत्क्षेपाय भवामि यादवकुले सोऽहं समग्रात्मना । देवा
    वृष्णिकुले भवन्तु कलया देवाङ्गनाश्चावनौ मत्सेवार्थमिति त्वदीयवचनं पाथोजभूरूचिवान् ॥ ॥ श्रुत्वा कर्णरसायनं
    तव वचः सर्वेषु निर्वापित स्वान्तेष्वीश गतेषु तावककृपापीयूषतृप्तात्मसु । विख्याते मधुरापुरे किल भवत्सान्निध्यपुण्योत्तरे
    धन्यां देवकनन्दनामुदवहद्राजा स शूरात्मजः ॥ ॥ उद्वाहावसितौ तदीयसहजः कंसोऽथ सम्मानय न्नेतौ सूततया गतः
    पथि रथे व्योमोत्थया त्वद्गिरा । अस्यास्त्वामतिदुष्टमष्टमसुतो हन्तेति हन्तेरितः सन्त्रासात् स तु हन्तुमन्तिकगतां
    तन्वीं कृपाणीमधात् ॥ ॥ गृह्णानश्चिकुरेषु तां खलमतिः शौरेश्चिरं सान्त्वनै र्नो मुञ्चन् पुनरात्मजार्पणगिरा
    प्रीतोऽथ यातो गृहान् । आद्यं त्वत्सहजं तथाऽर्पितमपि स्नेहेन नाहन्नसौ दुष्टानामपि देव पुष्टकरुणा दृष्टा
    हि धीरेकदा ॥ ॥ तावत्त्वन्मनसैव नारदमुनिः प्रोचे स भोजेश्वरं यूयं नन्वसुराः सुराश्च यदवो जानासि किं
    न प्रभो । मायावी स हरिर्भवद्वधकृते भावी सुरप्रार्थना दित्याकर्ण्य यदूनदूधुनदसौ शौरेश्च सूनूनहन् ॥
    ॥ प्राप्ते सप्तमगर्भतामहिपतौ त्वत्प्रेरणान्मायया नीते माधव रोहिणीं त्वमपि भोःसच्चित्सुखैकात्मकः ।
    देवक्या जठरं विवेशिथ विभो संस्तूयमानः सुरैः स त्वं कृष्ण विधूय रोगपटलीं भक्तिं परां देहि मे ॥
