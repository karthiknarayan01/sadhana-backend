id: margasahayalingastuti
category: stotram
name:
  english: margasahayalingastuti
  devanagari: मार्गसहायलिन्गस्तुति
content:
  english: shrimargasahayalingastutih || shrimadappayyadikshitendraviracita || payonaditiranivasalingam
    balarkakotipratimam trinetram | padmasanenarcitadivyalingam vandamahe margasahayalingam || 1|| gangatarangollasaduttamangam
    gajendracarmambarabhushitangam | gaurimukhambhojavilolabhringam vandamahe margasahayalingam || 2||
    sukankanibhutamahabhujangam samjnanasampurnanijantarangam | suryendu bimbanalabhushitangam vandamahe
    margasahayalingam || 3|| bhaktipriyam bhavavilolabhringam bhaktanukulamalabhushitangam | bhavaikalokantaramadilingam
    vandamahe margasahayalingam || 4|| samapriyam saumyamaheshalingam samapradam saumyakatakshalingam
    | vamangasaundaryavilolitangam vandamahe margasahayalingam || 5|| pancaksharibhutasahasralingam pancamritasnanaparayanangam
    | pancamritambhojavilolabhringam vandamahe margasahayalingam || 6|| vande suraradhitapadapadmam shrishyamavalliramanam
    mahesham | vande mahamerusharasanam shivam vande sada margasahayalingam || 7|| || iti shrimargasahayalingastutih
    sampurna || || om tatsat ||
  devanagari: श्रीमार्गसहायलिङ्गस्तुतिः ॥ श्रीमदप्पय्यदीक्षितेन्द्रविरचिता ॥ पयोनदीतीरनिवासलिङ्गं बालार्ककोटिप्रतिमं
    त्रिनेत्रम् । पद्मासनेनार्चितदिव्यलिङ्गं वन्दामहे मार्गसहायलिङ्गम् ॥ १॥ गङ्गातरङ्गोल्लसदुत्तमाङ्गं
    गजेन्द्रचर्माम्बरभूषिताङ्गम् । गौरीमुखाम्भोजविलोलभृङ्गं वन्दामहे मार्गसहायलिङ्गम् ॥ २॥ सुकङ्कणीभूतमहाभुजङ्गं
    संज्ञानसम्पूर्णनिजान्तरङ्गम् । सूर्येन्दु बिम्बानलभूषिताङ्गं वन्दामहे मार्गसहायलिङ्गम् ॥ ३॥ भक्तिप्रियं
    भावविलोलभृङ्गं भक्तानुकूलामलभूषिताङ्गम् । भावैकलोकान्तरमादिलिङ्गं वन्दामहे मार्गसहायलिङ्गम् ॥ ४॥ सामप्रियं
    सौम्यमहेशलिङ्गं सामप्रदं सौम्यकटाक्षलिङ्गम् । वामाङ्गसौन्दर्यविलोलिताङ्गं वन्दामहे मार्गसहायलिङ्गम्
    ॥ ५॥ पञ्चाक्षरीभूतसहस्रलिङ्गं पञ्चामृतस्नानपरायणाङ्गम् । पञ्चामृताम्भोजविलोलभृङ्गं वन्दामहे मार्गसहायलिङ्गम्
    ॥ ६॥ वन्दे सुराराधितपादपद्मं श्रीश्यामवल्लीरमणं महेशम् । वन्दे महामेरुशरासनं शिवं वन्दे सदा मार्गसहायलिङ्गम्
    ॥ ७॥ ॥ इति श्रीमार्गसहायलिङ्गस्तुतिः सम्पूर्णा ॥ ॥ ॐ तत्सत् ॥
