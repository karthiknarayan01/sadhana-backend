id: gosahasranamastotram-svamiramabhadracaryaviracitam
category: sahasranama
name:
  english: gosahasranamastotram (svamiramabhadracaryaviracitam)
  devanagari: गोसहस्रनामस्तोत्रम् (स्वामिरामभद्राचार्यविरचितम्)
content:
  english: ringi sanamraka || 39|| kamrakantih kamramaha kamra kamrashiroruha | kamrasvara kamragatri
    kamramurdha sukamradrik || 40|| kanta kantalaka kantuh kanta kandhih sukamada | kakshi kanjambika
    kanja kanjanabhih kaka kuka || 41|| bhumipa bhumijapujya bhumishtha bhumipavani | bhumipeshta bhumimayi
    bhumibhridbhumibhavini || 42|| bhuma bhumanata bhaumi bhaumabha bhaumadoshaha | bhumibharahari bhumipapahridbhumibhushana
    || 43|| bhutirbhutajanirbhavya vibhutirbhutabhavani | bhutatma bhutajanani bhutasaukhya vibhutida
    || 44|| mangalya mangalamukhi mangali manjumangala | mangaleha mangaliki mangalatma sumangala || 45||
    manjurmanjutanurbabhrurmanjviha manjulastani | manjudugdha manjudadhirmanjusarpih sumanjula || 46||
    madhurmadhumayi madhvi madhvika madhudohini | madhusurmadhuda madhvajanani madhuhritpriya || 47||
    madhura madhuralapa madhuri madhuramayi | madhurabha sumadhura madhurashrurmadhuvrata || 48|| manmathaghni
    madakari madanadvinmadalasa | madyanti madyashamani madaneshapatistuta || 49|| haritpriya harijjagdhi
    harikantirhariprada | harishena harimati harihasa harispriha || 50|| harshita harita hrishta hariloma
    harinmayi | harinatha harimukhi harishraddha haristani || 51|| shubhrakantih shubhratanuh shubhrabha
    shubhravatsaka | shubhrajyotsna shubhraratih shubhreksha shubhrasangraha || 52|| daya kripa krishih
    krishtirvrishtirdrishtih katha'shlatha | avyatha karuna krantih shantida shantivigraha || 53|| utsuka
    sotsavotkantha vatsala vatsapalika | lalika lalana lalya lalita lalita hita || 54|| lakshana lakshita
    lakshya labhya labha sulambhana | labdhavya lambhaniyarya labdha sallabhabhavita || 55|| bhamita bhamaga'bhama
    bhamya bhamavati sati | shashvati sadhuga sadhya sadhika'sadhvasa'sama || 56|| sadhana sadhita sadhuh
    shuddha shuddhapayah spriha | spriharha sprihavih sprihya sprishya sparsha shubhasprishih || 57||
    vara varenya varada vararha varavarnini | varnana varnita varya vararoha varaprada || 58|| shanta
    shantipriya'shantih shantarosha shamapriya | shamaprada'shama shamya shamashila shamatmika || 59||
    kshama'kshama kshamih kshamya'kshantih kshanta kshamamayi | kshamavati kshamishreshtha kshamabhusha
    kshamanidhih || 60|| dhishnya dhrishya'dhritirdhrishta dhritakshira dhritabhaya | dhritabhama dhritaghrita
    dhritagavya dhritastani || 61|| madhurmadhumatimadhvimadhuda madhuga'mada | madhuvarca madhumaha madhusarpirmadhutvaca
    || 62|| mana manadhana'manya manini manada'madhuh | mandaga mandama manda mandarava sumadhyama ||
    63|| komala komalaprapya komalangi sukomala | komalanga komalika komalaujah sakomala || 64|| kumutkumudvati
    kavya kavya havya haristuta | harishta harinamyanghrirharivandya haripriya || 65|| harida harima harsha
    harshini harshada harih | haribha harini hridya harisha harighasabhak || 66|| vidhirvidhatri vidhida
    vidhivashya vidhipriya | vidhivandya vidhinuta vidhipujya vidhayini || 67|| vidhiha vidhima vaidhi
    vidhidrishta vidhistani | vidhidhulirvidhikhura vidhinamya vidhisnuta || 68|| nirmala vimalaprajna
    vishada vishadasnuta | visada vishada vijna vishaghni vishanashini || 69|| vishama vishamakara vaishami
    vishamatmika | vishamabha vishamini vishameshta vishodhini || 70|| vidya vedya vedamayi vedita vedana
    vidih | vedaga vedada vedi vitta vittapriya vida || 71|| bahudugdha bahudadhirbahusarpirbahushrutih
    | bahugomayika bahvi bahveshta bahudohini || 72|| bahvasha bahunuta bahula bahuvandita | bahuprarthya
    bahujana bahulokanamaskrita || 73|| bhayaghni bhayaha'bhitirbhayada bhayabhanjini | bhayanasha bhayahari
    bhayakridbhayavardhini || 74|| abhaya'bhayasamskara abhayabha'bhayatmika | abhayeshta'bhayakari abhayedya'bhayashrutih
    || 75|| ashrita amritasyanda amritasya'mritashravah | amritesha'mritapaya amritatma'mritaprada ||
    76|| amritasravinidevi daivi devatmika rucih | dyaurdivya divyacarita divyatma divyavigraha || 77||
    devabha devamahita devatma devapujita | deveshta devavinata devedya devavallabha || 78|| shasya shasyaprada
    shasyashalini shasyamalini | shasyapriya shasyadoha shasyasarpih sushasyika || 79|| siddha siddhapriya
    siddhih siddhistha siddhidayini | siddhashloka siddhanata siddhamata susiddhida || 80|| sabhya sadhyaganastutya
    sadhyasevya yashasvini | yashodhara yashomayi yashorashiryashodhana || 81|| yashahpriya yashahputa
    yashodugdha yashoghrita | yashodadhiryashassyanda yashogomayini nidhih || 82|| yatushila yatumayi
    yatudhanavinashini | yatucitta yatumatiryatvatma yatubuddhibhak || 83|| baddha baddhajanaprarthya
    baddhapada'vadhaprada | baddharajjurbaddhatanurbaddhanghrirbaddhamokshini || 84|| bandhana bandhanashlaghya
    bandhaha bandhamocini | bandhamoksha bandhadhana vishva visva visheshini || 85|| adityabhagini rudramata
    vasusuta'suta | amritaprasuramritakshirinyamritini suga || 86|| vishvamata vishvadevi vishvadeva virocana
    | vishvatirtha vishvagandha vishvamaya vibhupriya || 87|| vishnupujya vishnutanurvaishnavi vishnubhavini
    | vishnumata vishnumayi vishnuda vishnuvallabha || 88|| brahmaputa brahmamayi brahmabhurbrahmadayini
    | brahmabhuta brahmatanurbrahmajna brahmavallika || 89|| mahamata mahamaya mahabhutirmahatanuh | mahamatya
    mahadevi mahalakshmirmahamaha || 90|| mahakhura mahapada mahoraska mahodari | mahaskandha mahasha
  devanagari: ृङ्गी सनम्रका ॥ ३९॥ कम्रकान्तिः कम्रमहा कम्रा कम्रशिरोरुहा । कम्रस्वरा कम्रगात्री कम्रमूर्धा
    सुकम्रदृक् ॥ ४०॥ कान्ता कान्तालका कन्तुः कन्ता कन्धिः सुकामदा । काक्षी कञ्जाम्बिका कञ्जा कञ्जनाभिः
    कका कुका ॥ ४१॥ भूमिपा भूमिजापूज्या भूमिष्ठा भूमिपावनी । भूमिपेष्टा भूमिमयी भूमिभृद्भूमिभाविनी ॥ ४२॥
    भूमा भूमनता भौमी भौमभा भौमदोषहा । भूमिभारहरी भूमिपापहृद्भूमिभूषणा ॥ ४३॥ भूतिर्भूतजनिर्भाव्या विभूतिर्भूतभावनी
    । भूतात्मा भूतजननी भूतसौख्या विभूतिदा ॥ ४४॥ मङ्गल्या मङ्गलमुखी माङ्गली मञ्जुमङ्गला । मङ्गलेहा माङ्गलिकी
    मङ्गलात्मा सुमङ्गला ॥ ४५॥ मञ्जुर्मञ्जुतनुर्बभ्रूर्मञ्ज्वीहा मञ्जुलस्तनी । मञ्जुदुग्धा मञ्जुदधिर्मञ्जुसर्पिः
    सुमञ्जुला ॥ ४६॥ मधुर्मधुमयी माध्वी माध्वीका मधुदोहिनी । मधुसूर्मधुदा मध्वजननी मधुहृत्प्रिया ॥ ४७॥
    मधुरा मधुरालापा माधुरी मधुरामयी । मधुराभा सुमधुरा मधुरश्रुर्मधुव्रता ॥ ४८॥ मन्मथघ्नी मदकरी मदनद्विण्मदालसा
    । माद्यन्ती मद्यशमनी मदनेशपतिस्तुता ॥ ४९॥ हरित्प्रिया हरिज्जग्धी हरिकान्तिर्हरिप्रदा । हरिषेणा हरिमती
    हरिहासा हरिस्पृहा ॥ ५०॥ हर्षिता हरिता हृष्टा हरिलोमा हरिन्मयी । हरिनाथा हरिमुखी हरिश्रद्धा हरिस्तनी
    ॥ ५१॥ शुभ्रकान्तिः शुभ्रतनुः शुभ्राभा शुभ्रवत्सका । शुभ्रज्योत्स्ना शुभ्ररतिः शुभ्रेक्षा शुभ्रसङ्ग्रहा
    ॥ ५२॥ दया कृपा कृषिः कृष्टिर्वृष्टिर्दृष्टिः कथाऽश्लथा । अव्यथा करुणा क्रान्तिः शान्तिदा शान्तिविग्रहा
    ॥ ५३॥ उत्सुका सोत्सवोत्कण्ठा वत्सला वत्सपालिका । लालिका ललना लाल्या लालिता ललिता हिता ॥ ५४॥ लक्षणा
    लक्षिता लक्ष्या लभ्या लाभा सुलम्भना । लब्धव्या लम्भनीयार्या लब्धा सल्लाभभाविता ॥ ५५॥ भामिता भामगाऽभामा
    भाम्या भामवती सती । शाश्वती साधुगा साध्या साधिकाऽसाध्वसाऽसमा ॥ ५६॥ साधना साधिता साधुः शुद्धा शुद्धपयाः
    स्पृहा । स्पृहार्हा स्पृहविः स्पृह्या स्पृश्या स्पर्शा शुभस्पृशिः ॥ ५७॥ वरा वरेण्या वरदा वरार्हा वरवर्णिनी
    । वर्णना वर्णिता वर्या वरारोहा वरप्रदा ॥ ५८॥ शान्ता शान्तिप्रियाऽशान्तिः शान्तरोषा शमप्रिया । शमप्रदाऽशमा
    शाम्या शमशीला शमात्मिका ॥ ५९॥ क्षामाऽक्षमा क्षमिः क्षाम्याऽक्षान्तिः क्षान्ता क्षमामयी । क्षमावती
    क्षमिश्रेष्ठा क्षमाभूषा क्षमानिधिः ॥ ६०॥ धिष्ण्या धृष्याऽधृतिर्धृष्टा धृतक्षीरा धृताभया । धृतभामा
    धृतघृता धृतगव्या धृतस्तनी ॥ ६१॥ मधूर्मधुमतीमाध्वीमधुदा मधुगाऽमदा । मधुवर्चा मधुमहा मधुसर्पिर्मधुत्वचा
    ॥ ६२॥ माना मानधनाऽमान्या मानिनी मानदाऽमधुः । मन्दगा मन्दमा मन्दा मन्दरावा सुमध्यमा ॥ ६३॥ कोमला कोमलप्राप्या
    कोमलाङ्गी सुकोमला । कोमलाङ्गा कोमलिका कोमलौजाः सकोमला ॥ ६४॥ कुमुत्कुमुद्वती काव्या कव्या हव्या हरिस्तुता
    । हरीष्टा हरिनम्याङ्घ्रिर्हरिवन्द्या हरिप्रिया ॥ ६५॥ हरिदा हरिमा हर्षा हर्षिणी हर्षदा हरिः । हरिभा
    हरिणी हृद्या हरीशा हरिघासभाक् ॥ ६६॥ विधिर्विधात्री विधिदा विधिवश्या विधिप्रिया । विधिवन्द्या विधिनुता
    विधिपूज्या विधायिनी ॥ ६७॥ विधिहा विधिमा वैधी विधिदृष्टा विधिस्तनी । विधिधूलिर्विधिखुरा विधिनम्या विधिस्नुता
    ॥ ६८॥ निर्मला विमलप्रज्ञा विशदा विशदस्नुता । विसदा विषदा विज्ञा विषघ्नी विषनाशिनी ॥ ६९॥ विषमा विषमाकारा
    वैषमी विषमात्मिका । विषमाभा विषमिणी विषमेष्टा विशोधिनी ॥ ७०॥ विद्या वेद्या वेदमयी वेदिता वेदना विदिः
    । वेदगा वेददा वेदी वित्ता वित्तप्रिया विदा ॥ ७१॥ बहुदुग्धा बहुदधिर्बहुसर्पिर्बहुश्रुतिः । बहुगोमयिका
    बह्वी बह्वेष्टा बहुदोहिनी ॥ ७२॥ बह्वाशा बहुनुता बहुला बहुवन्दिता । बहुप्रार्थ्या बहुजना बहुलोकनमस्कृता
    ॥ ७३॥ भयघ्नी भयहाऽभीतिर्भयदा भयभञ्जिनी । भयनाशा भयहरी भयकृद्भयवर्धिनी ॥ ७४॥ अभयाऽभयसंस्कारा अभयाभाऽभयात्मिका
    । अभयेष्टाऽभयकरी अभयेड्याऽभयश्रुतिः ॥ ७५॥ अश्रिता अमृतस्यन्दा अमृतास्याऽमृतश्रवाः । अमृतेशाऽमृतपया
    अमृतात्माऽमृतप्रदा ॥ ७६॥ अमृतस्राविनीदेवी दैवी देवात्मिका रुचिः । द्यौर्दिव्या दिव्यचरिता दिव्यात्मा
    दिव्यविग्रहा ॥ ७७॥ देवाभा देवमहिता देवात्मा देवपूजिता । देवेष्टा देवविनता देवेड्या देववल्लभा ॥ ७८॥
    शस्या शस्यप्रदा शस्यशालिनी शस्यमालिनी । शस्यप्रिया शस्यदोहा शस्यसर्पिः सुशस्यिका ॥ ७९॥ सिद्धा सिद्धप्रिया
    सिद्धिः सिद्धिस्था सिद्धिदायिनी । सिद्धश्लोका सिद्धनता सिद्धमाता सुसिद्धिदा ॥ ८०॥ सभ्या साध्यगणस्तुत्या
    साध्यसेव्या यशस्विनी । यशोधरा यशोमयी यशोराशिर्यशोधना ॥ ८१॥ यशःप्रिया यशःपूता यशोदुग्धा यशोघृता । यशोदधिर्यशस्स्यन्दा
    यशोगोमयिनी निधिः ॥ ८२॥ यतुशीला यतुमयी यातुधानविनाशिनी । यतुचित्ता यतुमतिर्यत्वात्मा यतुबुद्धिभाक्
    ॥ ८३॥ बद्धा बद्धजनप्रार्थ्या बद्धपादाऽवधप्रदा । बद्धरज्जुर्बद्धतनुर्बद्धाङ्घ्रिर्बद्धमोक्षिणी ॥ ८४॥
    बन्धना बन्धनश्लाघ्या बन्धहा बन्धमोचिनी । बन्धमोक्षा बन्धधना विश्वा विस्वा विशेषिणी ॥ ८५॥ आदित्यभगिनी
    रुद्रमाता वसुसुताऽसुता । अमृतप्रसूरमृतक्षीरिण्यमृतिनी सुगा ॥ ८६॥ विश्वमाता विश्वदेवी विश्वदेवा विरोचना
    । विश्वतीर्था विश्वगन्धा विश्वमाया विभुप्रिया ॥ ८७॥ विष्णुपूज्या विष्णुतनुर्वैष्णवी विष्णुभाविनी ।
    विष्णुमाता विष्णुमयी विष्णुदा विष्णुवल्लभा ॥ ८८॥ ब्रह्मपूता ब्रह्ममयी ब्रह्मभूर्ब्रह्मदायिनी । ब्रह्मभूता
    ब्रह्मतनुर्ब्रह्मज्ञा ब्रह्मवल्लिका ॥ ८९॥ महामाता महामाया महाभूतिर्महातनुः । महामात्या महादेवी महालक्ष्मीर्महामहा
    ॥ ९०॥ महाखुरा महापादा महोरस्का महोदरी । महास्कन्धा महाश
