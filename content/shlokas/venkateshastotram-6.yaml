id: venkateshastotram-6
category: stotram
name:
  english: venkateshastotram 6
  devanagari: वेन्कटेशस्तोत्रम् ६
content:
  english: shrimadratnamahahprarohanikarairnirajitashripadam | anandakhyavimanadivyanilaye lakshmya saha
    kriditam sakshanmanmathamanmatham gunanidhim shrivenkatesham bhaje || 4|| shripadau caranagataih prathamato
    yasyavagahyau janaih dedipravamritayitaviva shishormatuh stanau shripateh | gotrayam vipine vrishadrishikhare
    citte'pyananyatmanam vedante samamahitau tamatulam shrivenkatesham bhaje || 5|| atyantapriyadarshanam
    kamalaya prarudhavakshahsthalam nanabhushanabhushitam pravilasatpitambaraprojjvalam | sarvabhishtavarapradam
    pranamatam jajvalyamanaprabham balarkojjvaladivyaratnamakutam shrovenkatesham bhaje || 6|| ambhojamritasindhujatakalashapraspardhidivyananam
    subhrusundaramadhyacandravilasatbhalam manojnasmitam | akarnayatalocanam manimayashriharabhushojjvalam
    shrivatsankitavakshasam shritanidhi shrivenkatesham bhaje || 7|| sarvajnam kalikalmashagnamamalam
    lakshminivasorasam shaktam sannatavatsalam vidhimukhairdevaih sada vanditam | samsararnavatarakanghriyugaḻam
    kandarpakotiprabham shadgunyatmakadivyamangalatanum shrivenkatesham bhaje || 8|| andhah pashyati duhkhinastu
    sukhino mukah pravakti sphutam | pangurdhavati vegatastu labhate vandhya ca bhavyam mutam | artashcapi
    niramayastu badhirah sha
  devanagari: श्रीमद्रत्नमहःप्ररोहनिकरैर्नीराजितश्रीपदम् । आनन्दाख्यविमानदिव्यनिलये लक्ष्म्या सह क्रीडितं
    साक्षान्मन्मथमन्मथं गुणनिधिं श्रीवेङ्कटेशं भजे ॥ ४॥ श्रीपादौ चरणागतैः प्रथमतो यस्यावगाह्यौ जनैः देदीप्रावमृतायिताविव
    शिशोर्मातुः स्तनौ श्रीपतेः । गोत्रायां विपिने वृषाद्रिशिखरे चित्तेऽप्यनन्यात्मनां वेदान्ते सममाहितौ
    तमतुलं श्रीवेङ्कटेशं भजे ॥ ५॥ अत्यन्तप्रियदर्शनं कमलया प्रारुढवक्षःस्थलं नानाभूषणभूषितं प्रविलसत्पीताम्बरप्रोज्ज्वलम्
    । सर्वाभीष्टवरप्रदं प्रणमतां जाज्वल्यमानप्रभं बालार्कोज्ज्वलदिव्यरत्नमकुटं श्रोवेङ्कटेशं भजे ॥ ६॥
    अम्भोजामृतसिन्धुजातकलशप्रस्पर्धिदिव्याननं सुभ्रूसुन्दरमध्यचन्द्रविलसत्भालं मनोज्ञस्मितम् । आकर्णायतलोचनं
    मणिमयश्रीहारभूषोज्ज्वलं श्रीवत्साङ्कितवक्षसं श्रितनिधि श्रीवेङ्कटेशं भजे ॥ ७॥ सर्वज्ञं कलिकल्मषग्नममलं
    लक्ष्मीनिवासोरसं शक्तं सन्नतवत्सलं विधिमुखैर्देवैः सदा वन्दितम् । संसारार्णवतारकाङ्घ्रियुगळं कन्दर्पकोटिप्रभं
    षाड्गुण्यात्मकदिव्यमङ्गलतनुं श्रीवेङ्कटेशं भजे ॥ ८॥ अन्धः पश्यति दुःखिनस्तु सुखिनो मूकः प्रवक्ति स्फुटम्
    । पङ्गुर्धावति वेगतस्तु लभते वन्ध्या च भव्यं मुतम् । आर्ताश्चापि निरामयास्तु बधिराः श
