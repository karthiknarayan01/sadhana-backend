id: kanakadhara-stotram
category: stotram
name:
  english: Kanakadhara Stotram
  devanagari: कनकधारास्तोत्रम् (शङ्कराचार्यविरचितम्)
content:
  english: vande vandarumandaramindiranandakandalam | amandanandasandohabandhuram sindhurananam || angam
    hareh pulakabhushanamashrayanti bhringanganeva mukulabharanam tamalam | angikritakhilavibhutirapangalila
    mangalyada'stu mama mangaladevatayah || 1|| mugdha muhurvidadhati vadane murareh prematrapapranihitani
    gatagatani | mala drishormadhukariva mahotpale ya sa me shriyam dishatu sagarasambhavayah || 2|| vishvamarendrapadavibhramadanadaksham
    anandaheturadhikam muravidvisho'pi | ishannishidatu mayi kshanamikshanardham indivarodarasahodaramindirayah
    || 3|| amilitakshamadhigamya muda mukundam anandakandamanimeshamanangatantram | akekarasthitakaninikapakshmanetram
    bhutyai bhavenmama bhujangashayanganayah || 4|| bahvantare madhujitah shritakaustubhe ya haravaliva
    harinilamayi vibhati | kamaprada bhagavato'pi katakshamala kalyanamavahatu me kamalalayayah || 5||
    kalambudalilalitorasi kaitabhareh dharadhare sphurati ya tadidanganeva | matussamastajagatam mahaniyamurtih
    bhadrani me dishatu bhargavanandanayah || 6|| praptam padam prathamatah khalu yatprabhavat mangalyabhaji
    madhumathini manmathena | mayyapatettadiha mantharamikshanardham mandalasam ca makaralayakanyakayah
    || 7|| dadyaddayanupavano dravinambudharam asminnakincanavihangashishau vishanne | dushkarmagharmamapaniya
    ciraya duram narayanapranayininayanambuvahah || 8|| ishtavishishtamatayo'pi yaya dayardra- drishtya
    trivishtapapadam sulabham labhante | drishtih prahrishtakamalodaradiptirishtam pushtim krishishta
    mama pushkaravishtarayah || 9|| girdevateti garudadhvajasundariti (garudadhvajabhaminiti) shakambhariti
    shashishekharavallabheti | srishtisthitipralayakelishu samsthitayai tasyai namastribhuvanaikagurostarunyai
    || 10|| shrutyai namo'stu shubhakarmaphalaprasutyai ratyai namo'stu ramaniyagunarnavayai | shaktyai
    namo'stu shatapatraniketanayai pushtyai namo'stu purushottamavallabhayai || 11|| namo'stu nalikanibhananayai
    namo'stu dugdhodadhijanmabhumyai | namo'stu somamritasodarayai namo'stu narayanavallabhayai || 12||
    sampatkarani sakalendriyanandanani samrajyadanavibhavani saroruhakshi | (saroruhani) tvadvandanani
    duritaharanodyatani (duritottaranodyatani, duritoddharanodyatani) mameva mataranisham kalayantu manye
    || 13|| yatkatakshasamupasanavidhih sevakasya sakalarthasampadah | santanoti vacanangamanasaih tvam
    murarihridayeshvarim bhaje || 14|| sarasijanilaye sarojahaste dhavalatamamshukagandhamalyashobhe |
    bhagavati harivallabhe manojne tribhuvanabhutikari prasida mahyam || 15|| dig hastibhih kanakakumbhamukhavasrishta-
    svarvahinivimalacarujalaplutangim | pratarnamami jagatam jananimashesha- lokadhinathagrihinimamritabdhiputrim
    || 16|| kamale kamalakshavallabhe tvam karunapuratarangitairapangaih | avalokaya mamakincananam prathamam
    patramakritrimam dayayah || 17|| stuvanti ye stutibhiramibhiranvaham trayimayim tribhuvanamataram
    ramam | gunadhika gurutarabhagyabhagino bhavanti te bhuvi budhabhavitashayah || 18|| || iti shrimacchankaracaryakrita
    shri kanakadharastotram sampurnam || namo'stu hemambujapithikayai namo'stu bhumandalanayikayai | namo'stu
    devadidayaparayai namo'stu sharngayudhavallabhayai || 19|| namo'stu devyai bhrigunandanayai namo'stu
    vishnorurasi sthitayai | namo'stu lakshmyai kamalalayayai namo'stu damodaravallabhayai || 20|| namo'stu
    kantyai kamalekshanayai namo'stu bhutyai bhuvanaprasutyai | namo'stu devadibhirarcitayai namo'stu
    nandatmajavallabhayai || 21|| devi prasida jagadishvari lokamatah kalyanagatri kamalekshanajivanathe
    | daridryabhitihridayam sharanagatam mam alokaya pratidinam sadayairapangaih || 22|| bilvatavimadhyalasatsaroje
    sahasrapatre sukhasannivishtam | ashtapadambhoruhapanipadmam suvarnavarnam pranamami lakshmim || 23||
    kamalasanapanina lalate likhitamaksharapanktimasya jantoh | parimarjaya mataranghrina te dhanikadvaranivasa
    duhkhadogdhrim || 24|| ambhoruham janmagriham bhavatya vakshahsthalam bhartrigriham murareh | karunyatah
    kalpaya padmavase lilagriham me hridayaravindam || 25|| suvarnadharastotram yacchankaracaryanirmitam
    | trisandhyam yah pathennityam sa kubera samo bhavet || ayam stavah svamina shankarabhagavatpadena
    brahmavratasthena kalatinamni svagrama evakincanyaparikhinnaya dvijagrihinya nirdhanatvamarjanaya
    niramayi | tena stavena prita lakshmirvipram vipuladhanadanenaprinayaditi shankaravijayatah samadhigamyate,
    sa munirmurajitkutumbinim padacitrairnavanita komalaih | madhurairupatasthivam- stavaih ityadina ||
    ete shrimanmaturabhyarthanaya stavametamatanishateti kalatigramanikatavartinam vidusham matam | tadarabhya
    karnakarnikaya tathanushrutam | Volume 18 page 70| Verses 19 through 25 are ekshtra, found in other
    printed tekshts|
  devanagari: वन्दे वन्दारुमन्दारमिन्दिरानन्दकन्दलम् । अमन्दानन्दसन्दोहबन्धुरं सिन्धुराननम् ॥ अङ्गं हरेः
    पुलकभूषणमाश्रयन्ती भृङ्गाङ्गनेव मुकुलाभरणं तमालम् । अङ्गीकृताखिलविभूतिरपाङ्गलीला माङ्गल्यदाऽस्तु मम
    मङ्गलदेवतायाः ॥ १॥ मुग्धा मुहुर्विदधती वदने मुरारेः प्रेमत्रपाप्रणिहितानि गतागतानि । माला दृशोर्मधुकरीव
    महोत्पले या सा मे श्रियं दिशतु सागरसम्भवायाः ॥ २॥ विश्वामरेन्द्रपदविभ्रमदानदक्षं आनन्दहेतुरधिकं मुरविद्विषोऽपि
    । ईषन्निषीदतु मयि क्षणमीक्षणार्धम् इन्दीवरोदरसहोदरमिन्दिरायाः ॥ ३॥ आमीलिताक्षमधिगम्य मुदा मुकुन्दं
    आनन्दकन्दमनिमेषमनङ्गतन्त्रम् । आकेकरस्थितकनीनिकपक्ष्मनेत्रं भूत्यै भवेन्मम भुजङ्गशयाङ्गनायाः ॥ ४॥
    बाह्वन्तरे मधुजितः श्रितकौस्तुभे या हारावलीव हरिनीलमयी विभाति । कामप्रदा भगवतोऽपि कटाक्षमाला कल्याणमावहतु
    मे कमलालयायाः ॥ ५॥ कालाम्बुदालिललितोरसि कैटभारेः धाराधरे स्फुरति या तडिदङ्गनेव । मातुस्समस्तजगतां
    महनीयमूर्तिः भद्राणि मे दिशतु भार्गवनन्दनायाः ॥ ६॥ प्राप्तं पदं प्रथमतः खलु यत्प्रभावात् माङ्गल्यभाजि
    मधुमाथिनि मन्मथेन । मय्यापतेत्तदिह मन्थरमीक्षणार्धं मन्दालसं च मकरालयकन्यकायाः ॥ ७॥ दद्याद्दयानुपवनो
    द्रविणाम्बुधारां अस्मिन्नकिञ्चनविहङ्गशिशौ विषण्णे । दुष्कर्मघर्ममपनीय चिराय दूरं नारायणप्रणयिनीनयनाम्बुवाहः
    ॥ ८॥ इष्टाविशिष्टमतयोऽपि यया दयार्द्र- दृष्ट्या त्रिविष्टपपदं सुलभं लभन्ते । दृष्टिः प्रहृष्टकमलोदरदीप्तिरिष्टां
    पुष्टिं कृषीष्ट मम पुष्करविष्टरायाः ॥ ९॥ गीर्देवतेति गरुडध्वजसुन्दरीति (गरुडध्वजभामिनीति) शाकम्भरीति
    शशिशेखरवल्लभेति । सृष्टिस्थितिप्रलयकेलिषु संस्थितायै तस्यै नमस्त्रिभुवनैकगुरोस्तरुण्यै ॥ १०॥ श्रुत्यै
    नमोऽस्तु शुभकर्मफलप्रसूत्यै रत्यै नमोऽस्तु रमणीयगुणार्णवायै । शक्त्यै नमोऽस्तु शतपत्रनिकेतनायै पुष्ट्यै
    नमोऽस्तु पुरुषोत्तमवल्लभायै ॥ ११॥ नमोऽस्तु नालीकनिभाननायै नमोऽस्तु दुग्धोदधिजन्मभूम्यै । नमोऽस्तु
    सोमामृतसोदरायै नमोऽस्तु नारायणवल्लभायै ॥ १२॥ सम्पत्कराणि सकलेन्द्रियनन्दनानि साम्राज्यदानविभवानि सरोरुहाक्षि
    । (सरोरुहाणि) त्वद्वन्दनानि दुरिताहरणोद्यतानि (दुरितोत्तरणोद्यतानि, दुरितोद्धरणोद्यतानि) मामेव मातरनिशं
    कलयन्तु मान्ये ॥ १३॥ यत्कटाक्षसमुपासनाविधिः सेवकस्य सकलार्थसम्पदः । सन्तनोति वचनाङ्गमानसैः त्वां मुरारिहृदयेश्वरीं
    भजे ॥ १४॥ सरसिजनिलये सरोजहस्ते धवलतमांशुकगन्धमाल्यशोभे । भगवति हरिवल्लभे मनोज्ञे त्रिभुवनभूतिकरि प्रसीद
    मह्यम् ॥ १५॥ दिग् हस्तिभिः कनककुम्भमुखावसृष्ट- स्वर्वाहिनीविमलचारुजलप्लुताङ्गीम् । प्रातर्नमामि जगतां
    जननीमशेष- लोकाधिनाथगृहिणीममृताब्धिपुत्रीम् ॥ १६॥ कमले कमलाक्षवल्लभे त्वं करुणापूरतरङ्गितैरपाङ्गैः
    । अवलोकय मामकिञ्चनानां प्रथमं पात्रमकृत्रिमं दयायाः ॥ १७॥ स्तुवन्ति ये स्तुतिभिरमीभिरन्वहं त्रयीमयीं
    त्रिभुवनमातरं रमाम् । गुणाधिका गुरुतरभाग्यभागिनो भवन्ति ते भुवि बुधभाविताशयाः ॥ १८॥ ॥ इति श्रीमच्छङ्कराचार्यकृत
    श्री कनकधारास्तोत्रं सम्पूर्णम् ॥ नमोऽस्तु हेमाम्बुजपीठिकायै नमोऽस्तु भूमण्डलनायिकायै । नमोऽस्तु देवादिदयापरायै
    नमोऽस्तु शार्ङ्गायुधवल्लभायै ॥ १९॥ नमोऽस्तु देव्यै भृगुनन्दनायै नमोऽस्तु विष्णोरुरसि स्थितायै । नमोऽस्तु
    लक्ष्म्यै कमलालयायै नमोऽस्तु दामोदरवल्लभायै ॥ २०॥ नमोऽस्तु कान्त्यै कमलेक्षणायै नमोऽस्तु भूत्यै भुवनप्रसूत्यै
    । नमोऽस्तु देवादिभिरर्चितायै नमोऽस्तु नन्दात्मजवल्लभायै ॥ २१॥ देवि प्रसीद जगदीश्वरि लोकमातः कल्याणगात्रि
    कमलेक्षणजीवनाथे । दारिद्र्यभीतिहृदयं शरणागतं माम् आलोकय प्रतिदिनं सदयैरपाङ्गैः ॥ २२॥ बिल्वाटवीमध्यलसत्सरोजे
    सहस्रपत्रे सुखसन्निविष्टाम् । अष्टापदाम्भोरुहपाणिपद्मां सुवर्णवर्णां प्रणमामि लक्ष्मीम् ॥ २३॥ कमलासनपाणिना
    ललाटे लिखितमक्षरपङ्क्तिमस्य जन्तोः । परिमार्जय मातरङ्घ्रिणा ते धनिकद्वारनिवास दुःखदोग्ध्रीम् ॥ २४॥
    अम्भोरुहं जन्मगृहं भवत्या वक्षःस्थलं भर्तृगृहं मुरारेः । कारुण्यतः कल्पय पद्मवासे लीलागृहं मे हृदयारविन्दम्
    ॥ २५॥ सुवर्णधारास्तोत्रं यच्छङ्कराचार्यनिर्मितम् । त्रिसन्ध्यं यः पठेन्नित्यं स कुबेर समो भवेत् ॥
    अयं स्तवः स्वामिना शङ्करभगवत्पादेन ब्रह्मव्रतस्थेन कालटिनाम्नि स्वग्राम एवाकिञ्चन्यपरिखिन्नाया द्विजगृहिण्या
    निर्धनत्वमार्जनाय निरमायि । तेन स्तवेन प्रीता लक्ष्मीर्विप्रं विपुलधनदानेनाप्रीणयदिति शङ्करविजयतः
    समाधिगम्यते, स मुनिर्मुरजित्कुटुम्बिनीं पदचित्रैर्नवनीत कोमलैः । मधुरैरूपतस्थिवां- स्तवैः इत्यादिना
    ॥ एते श्रीमन्मातुरभ्यर्थनया स्तवमेतमतनिषतेति कालटिग्रामनिकटवर्तिनां विदुषां मतम् । तदारभ्य कर्णाकर्णिकया
    तथानुश्रुतम् । Vओलुमे १८ पगे ७०। Vएर्सेस् १९ थ्रोउघ् २५ अरे एक्ष्त्र, फ़ोउन्द् इन् ओथेर् प्रिन्तेद्
    तेक्ष्त्स्।
