id: tyagaraja-pancharatna-keerthanas-samayaniki-tagu-mataladene
category: stotram
name:
  english: Tyagaraja Pancharatna Keerthanas Samayaniki Tagu Mataladene
content:
  english: shri tyagarajacaryulu ragam adi sadhincène o manasa bodhincina sanmargavasanamula bònku jesi
    ta battinapattu sadhincène o manasa samayaniki tagu mataladène devaki vasudevula negincinatu samayaniki
    tagu mataladène rangeshudu sadganga janakudu sangita sampradayakudu samayaniki tagu mataladène gopi
    jana manoradha mòsanga lekane geliyu jese vadu samayaniki tagu mataladène sarasarudu sanaka sanandana
    sanmuni sevyudu sakaladharudu samayaniki tagu mataladène vanitala sada sòkka jeyucunu mròkka jese
    paramatmudaniyu gaka yashoda tanayudancu mudambunanu muddu bètta navvucundu hari samayaniki tagu mataladène
    parama bhakta vatsaludu suguna paravarundajanma mana ghudi kali badhalu dircu vadanucune hridambujamuna
    jucu cundaga samayaniki tagu mataladène hare ramacandra raghukulesha mridu subhasha shesha shayana
    para nari sodaraja viraja turagaraja rajanuta niramaya paghana sarasiruha dalaksha yanucu vedukònna
    nannu ta brovakanu samayaniki tagu mataladène shri venkatesha suprakasha sarvonnata sajjana manasa
    niketana kanakambara dhara lasan makuta kundala virajita hare yanucu ne pògadaga tyagaraja geyudu
    manavendrudaina ramacandrudu samayaniki tagu mataladène sadbhaktula nadata litlanène amarikaga na
    puja kònène aluga vaddanane vimukhulato jera bokumanène vèta galigina talukòmmanane damashamadi sukha
    dayakudagu shri tyagaraja nutudu cènta rakane sadhincène o manasa
  devanagari: श्री त्यागराजाचार्युलु रागं आदि साधिञ्चॆने ओ मनसा बोधिञ्चिन सन्मार्गवसनमुल बॊङ्कु जेसि ता
    बट्टिनपट्टु साधिञ्चॆने ओ मनसा समयानिकि तगु माटलाडॆने देवकी वसुदेवुल नेगिञ्चिनटु समयानिकि तगु माटलाडॆने
    रङ्गेशुडु सद्गङ्गा जनकुडु सङ्गीत साम्प्रदायकुडु समयानिकि तगु माटलाडॆने गोपी जन मनोरध मॊसङ्ग लेकने
    गेलियु जेसे वाडु समयानिकि तगु माटलाडॆने सारासारुडु सनक सनन्दन सन्मुनि सेव्युडु सकलाधारुडु समयानिकि
    तगु माटलाडॆने वनितल सदा सॊक्क जेयुचुनु म्रॊक्क जेसे परमात्मुडनियु गाक यशोद तनयुडञ्चु मुदम्बुननु मुद्दु
    बॆट्ट नव्वुचुण्डु हरि समयानिकि तगु माटलाडॆने परम भक्त वत्सलुडु सुगुण पारावारुण्डाजन्म मन घूडि कलि
    बाधलु दीर्चु वाडनुचुने हृदम्बुजमुन जूचु चुण्डग समयानिकि तगु माटलाडॆने हरे रामचन्द्र रघुकुलेश मृदु
    सुभाश शेष शयन पर नारि सोदराज विराज तुरगराज राजनुत निरामय पाघन सरसीरुह दलाक्ष यनुचु वेडुकॊन्न नन्नु
    ता ब्रोवकनु समयानिकि तगु माटलाडॆने श्री वेङ्कटेश सुप्रकाश सर्वोन्नत सज्जन मानस निकेतन कनकाम्बर धर
    लसन् मकुट कुण्डल विराजित हरे यनुचु ने पॊगडगा त्यागराज गेयुडु मानवेन्द्रुडैन रामचन्द्रुडु समयानिकि
    तगु माटलाडॆने सद्भक्तुल नडत लिट्लनॆने अमरिकगा ना पूज कॊनॆने अलुग वद्दनने विमुखुलतो जेर बोकुमनॆने वॆत
    गलिगिन तालुकॊम्मनने दमशमादि सुख दायकुडगु श्री त्यागराज नुतुडु चॆन्त राकने साधिञ्चॆने ओ मनसा
