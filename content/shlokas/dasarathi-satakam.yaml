    घटिम्पजेसितिवॆ दाशरथी करुणापयोनिधी ॥ कॊञ्जकतर्क वादमनु गुद्दलिचे बरतत्त्वभूस्धलिन् रञ्जिलद्रव्वि कङ्गॊननि
