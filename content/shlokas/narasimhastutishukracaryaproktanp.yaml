id: narasimhastutishukracaryaproktanp
category: stotram
name:
  english: narasimhastutishukracaryaproktanP
  devanagari: नरसिंहस्तुतिशुक्राचार्यप्रोक्तण्P
content:
  english: narasimhastuti shukracaryaprokta narasimhapurane markandeya uvaca vamanena sa viddhaksho bahutirtheshu
    bhargavah | jahnavisalile sthitva devamabhyarcya vamanam || 1|| urdhvabahuh sa devesham shamkhacakragadadharam
    | hridi samcintya tushtava narasimham sanatanam || 2|| shukra uvaca namami devam vishvesham vamanam
    vishnurupinam | balidarpaharam shantam shashvatam purushottamam || 3|| dhiram shuram mahadevam shankhacakragadadharam
    | vishuddham jnanasampannam namami harimacyutam || 4|| sarvashaktimayam devam sarvagam sarvabhavanam
    | anadimajaram nityam namami garudadhvajam || 5|| surasurairbhaktimadbhih stuto narayanah sada | pujitam
    ca hrishikesham tam namami jagadgurum || 6|| hridi samkalpya yadrupam dhyayanti yatayah sada | jyotirupamanaupamyam
    narasimham namamyaham || 7|| na jananti param rupam brahmadya devataganah | yasyavatararupani samarcanti
    namami tam || 8|| etatsamastam yenadau srishtam dushtavadhatpunah | tratam yatra jagallinam tam namami
    janardanam || 9|| bhaktairabhyarcito yastu nityam bhaktapriyo hi yah | tam devamamalam divyam pranamami
    jagatpatim || 10|| durlabham capi bhaktanam yah prayacchati toshitah | tam sarvasakshinam vishnum
    pranamami sanatanam || 11|| narasimhapurane adhyaya 55 shloka 2
  devanagari: नरसिंहस्तुती शुक्राचार्यप्रोक्त नरसिंहपुराणे मार्कण्डेय उवाच वामनेन स विद्धाक्षो बहुतीर्थेषु
    भार्गवः । जाह्नवीसलिले स्थित्वा देवमभ्यर्च्य वामनम् ॥ १॥ ऊर्ध्वबाहुः स देवेशं शंखचक्रगदाधरम् । हृदि
    संचिन्त्य तुष्टाव नरसिंहं सनातनम् ॥ २॥ शुक्र उवाच नमामि देवं विश्वेशं वामनं विष्णुरूपिणम् । बलिदर्पहरं
    शान्तं शाश्वतं पुरुषोत्तमम् ॥ ३॥ धीरं शूरं महादेवं शङ्खचक्रगदाधरम् । विशुद्धं ज्ञानसम्पन्नं नमामि
    हरिमच्युतम् ॥ ४॥ सर्वशक्तिमयं देवं सर्वगं सर्वभावनम् । अनादिमजरं नित्यं नमामि गरुडध्वजम् ॥ ५॥ सुरासुरैर्भक्तिमद्भिः
    स्तुतो नारायणः सदा । पूजितं च हृषीकेशं तं नमामि जगद्गुरुम् ॥ ६॥ हृदि संकल्प्य यद्रूपं ध्यायन्ति यतयः
    सदा । ज्योतीरूपमनौपम्यं नरसिंहं नमाम्यहम् ॥ ७॥ न जानन्ति परं रूपं ब्रह्माद्या देवतागणाः । यस्यावताररूपाणि
    समर्चन्ति नमामि तम् ॥ ८॥ एतत्समस्तं येनादौ सृष्टं दुष्टवधात्पुनः । त्रातं यत्र जगल्लीनं तं नमामि जनार्दनम्
    ॥ ९॥ भक्तैरभ्यर्चितो यस्तु नित्यं भक्तप्रियो हि यः । तं देवममलं दिव्यं प्रणमामि जगत्पतिम् ॥ १०॥ दुर्लभं
    चापि भक्तानां यः प्रयच्छति तोषितः । तं सर्वसाक्षिणं विष्णुं प्रणमामि सनातनम् ॥ ११॥ नरसिंहपुराणे अध्याय
    ५५ श्लोक २
