id: yogataravali
category: stotram
name:
  english: yogataravali
  devanagari: योगतारावली
content:
  english: yogataravali vande gurunam caranaravinde sandarshitasvatmasukhavabodhe | janasya ye jangalikayamane
    samsarahalahalamohashantyai || 1|| sadashivoktani sapadalakshalayavadhanani vasanti loke | nadanusandhanasamadhimekam
    manyamahe manyatamam layanam || 2|| sarecapurairanilasya kumbhaih sarvasu nadishu vishodhitasu | anahatakhyo
    bahubhih prakarairantah pravarteta sada ninadah || 3|| nadanusandhana namo'stu tubhyam tvam sadhanam
    tattvapadasya jane | bhavatprasadatpavanena sakam viliyate vishnupade mano me || 4|| jalandharodyananamulabandhanjalpanti
    kanthodarapayumulan | bandhatraye'sminpariciyamane bandhah kuto darunakalapashat || 5|| odyanajalandharamulabandhairunnidritayamuraganganayam
    | pratyanmukhatvatpravishansushumnam gamagamau muncati gandhavahah || 6|| utthapitadharahutashanolkairakuncanaih
    shashvadapanavayoh | santapitaccandramasah patantim piyushadharam pibatiha dhanyah || 7|| bandhatrayabhyasavipakajatam
    vivarjitam recakapurakabhyam | vishoshayantim vishayapravaham vidyam bhaje kevalakumbharupam || 8||
    anahate cetasi savadhanairabhyasashurairanubhuyamana | samstambhitashvasamanahpracara sa jrimbhate
    kevalakumbhakashrih || 9|| sahasrashah santu hatheshu kumbhah sambhavyate kevalakumbha eva | kumbhottame
    yatra tu recapurau pranasya na prakritavaikritakhyau || 10|| trikutanamni stimite'ntarange khe stambhite
    kevalakumbhakena | prananilo bhanushashankanadyau vihaya sadyo vilayam prayati || 11|| pratyahritah
    kevalakumbhakena prabuddhakundalyupabhuktasheshah | pranah praticinapathena mandam viliyate vishnupadantarale
    || 12|| nirankushanam shvasanodgamanam nirodhanaih kevalakumbhakakhyaih | udeti sarvendriyavrittishunyo
    marullayah ko'pi mahamatinam || 13|| na drishtilakshyani na cittabandho na deshakalau na ca vayurodhah
    | na dharanadhyanaparishramo va samedhamane sati rajayoge || 14|| asheshadrishyojjhitadrinmayanamavasthitanamiha
    rajayoge | na jagaro napi sushuptibhavo na jivitam no maranam vicitram || 15|| ahammamatvadvyapahaya
    sarva shrirajayoge sthiramanasanam | na drashtrita nasti ca drishyabhavah sa jrimbhate kevalasamvideva
    || 16|| netre yayonmeshanimeshashunye vayuryaya varjitarecapurah | manashca sankalpavikalpashunyam
    manonmani sa mayi sannidhattam || 17|| cittendriyanam ciranigrahena shvasapracare shamite yamindrah
    | nivatadipa iva nishcalangah manonmanimagnadhiyo bhavanti || 18|| unmanyavasthadhigamaya vidvan upayamekam
    tava nirdishamah | pashyannudasinataya prapancam sankalpamunmulaya savadhanah || 19|| prasahya sankalpaparamparanam
    sambhedane santatasavadhanam | alambanashadapaciyamanam shanaih shanaih shantimupaiti cetah || 20||
    nishvasalopairnibhritaih sharirairnetrambujairardhanimilitaishca | avirbhavantimamanaskamudramalokayamo
    munipungavanam || 21|| ami yamindrah sahajamanaska
  devanagari: योगतारावली वन्दे गुरूणां चरणारविन्दे सन्दर्शितस्वात्मसुखावबोधे । जनस्य ये जाङ्गलिकायमाने
    संसारहालाहलमोहशान्त्यै ॥ १॥ सदाशिवोक्तानि सपादलक्षलयावधानानि वसन्ति लोके । नादानुसन्धानसमाधिमेकं मन्यामहे
    मान्यतमं लयानाम् ॥ २॥ सरेचपूरैरनिलस्य कुम्भैः सर्वासु नाडीषु विशोधितासु । अनाहताख्यो बहुभिः प्रकारैरन्तः
    प्रवर्तेत सदा निनादः ॥ ३॥ नादानुसन्धान नमोऽस्तु तुभ्यं त्वां साधनं तत्त्वपदस्य जाने । भवत्प्रसादात्पवनेन
    साकं विलीयते विष्णुपदे मनो मे ॥ ४॥ जालन्धरोड्याणनमूलबन्धाञ्जल्पन्ति कण्ठोदरपायुमूलान् । बन्धत्रयेऽस्मिन्परिचीयमाने
    बन्धः कुतो दारुणकालपाशात् ॥ ५॥ ओड्याणजालन्धरमूलबन्धैरुन्निद्रितायामुरगाङ्गनायाम् । प्रत्यङ्मुखत्वात्प्रविशन्सुषुम्नां
    गमागमौ मुञ्चति गन्धवाहः ॥ ६॥ उत्थापिताधारहुताशनोल्कैराकुञ्चनैः शश्वदपानवायोः । सन्तापिताच्चन्द्रमसः
    पतन्तीं पीयूषधारां पिबतीह धन्यः ॥ ७॥ बन्धत्रयाभ्यासविपाकजातां विवर्जितां रेचकपूरकाभ्याम् । विशोषयन्तीं
    विषयप्रवाहं विद्यां भजे केवलकुम्भरूपाम् ॥ ८॥ अनाहते चेतसि सावधानैरभ्यासशूरैरनुभूयमाना । संस्तम्भितश्वासमनःप्रचारा
    सा जृम्भते केवलकुम्भकश्रीः ॥ ९॥ सहस्रशः सन्तु हठेषु कुम्भाः सम्भाव्यते केवलकुम्भ एव । कुम्भोत्तमे
    यत्र तु रेचपूरौ प्राणस्य न प्राकृतवैकृताख्यौ ॥ १०॥ त्रिकूटनाम्नि स्तिमितेऽन्तरङ्गे खे स्तम्भिते केवलकुम्भकेन
    । प्राणानिलो भानुशशाङ्कनाड्यौ विहाय सद्यो विलयं प्रयाति ॥ ११॥ प्रत्याहृतः केवलकुम्भकेन प्रबुद्धकुण्डल्युपभुक्तशेषः
    । प्राणः प्रतीचीनपथेन मन्दं विलीयते विष्णुपदान्तराले ॥ १२॥ निरङ्कुशानां श्वसनोद्गमानां निरोधनैः केवलकुम्भकाख्यैः
    । उदेति सर्वेन्द्रियवृत्तिशून्यो मरुल्लयः कोऽपि महामतीनाम् ॥ १३॥ न दृष्टिलक्ष्याणि न चित्तबन्धो न
    देशकालौ न च वायुरोधः । न धारणाध्यानपरिश्रमो वा समेधमाने सति राजयोगे ॥ १४॥ अशेषदृश्योज्झितदृङ्मयानामवस्थितानामिह
    राजयोगे । न जागरो नापि सुषुप्तिभावो न जीवितं नो मरणं विचित्रम् ॥ १५॥ अहम्ममत्वाद्व्यपहाय सर्व श्रीराजयोगे
    स्थिरमानसानाम् । न द्रष्टृता नास्ति च दृश्यभावः सा जृम्भते केवलसंविदेव ॥ १६॥ नेत्रे ययोन्मेषनिमेषशून्ये
    वायुर्यया वर्जितरेचपूरः । मनश्च सङ्कल्पविकल्पशून्यं मनोन्मनी सा मयि सन्निधत्ताम् ॥ १७॥ चित्तेन्द्रियाणां
    चिरनिग्रहेण श्वासप्रचारे शमिते यमीन्द्राः । निवातदीपा इव निश्चलाङ्गाः मनोन्मनीमग्नधियो भवन्ति ॥ १८॥
    उन्मन्यवस्थाधिगमाय विद्वन् उपायमेकं तव निर्दिशामः । पश्यन्नुदासीनतया प्रपञ्चं सङ्कल्पमुन्मूलय सावधानः
    ॥ १९॥ प्रसह्य सङ्कल्पपरंपराणां संभेदने सन्ततसावधानम् । आलम्बनाशादपचीयमानं शनैः शनैः शान्तिमुपैति चेतः
    ॥ २०॥ निश्वासलोपैर्निभृतैः शरीरैर्नेत्राम्बुजैरर्धनिमीलितैश्च । आविर्भवन्तीममनस्कमुद्रामालोकयामो मुनिपुङ्गवानाम्
    ॥ २१॥ अमी यमीन्द्राः सहजामनस्का
