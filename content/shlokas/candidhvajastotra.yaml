id: candidhvajastotra
category: stotram
name:
  english: candidhvajastotra
  devanagari: चण्डीध्वजस्तोत्र
content:
  english: pradayini | rajyam dehi dhanam dehi samrajyam dehi me sada || 3 || namaste'stu mahakali parabrahmasvarupini
    | rajyam dehi dhanam dehi samrajyam dehi me sada || 4 || namaste'stu mahalakshmi parabrahmasvarupini
    | rajyam dehi dhanam dehi samrajyam dehi me sada || 5 || mahasarasvati devi parabrahmasvarupini |
    rajyam dehi dhanam dehi samrajyam dehi me sada || 6 || namo brahmi namaste'stu parabrahmasvarupini
    | rajyam dehi dhanam dehi samrajyam dehi me sada || 7 || namo maheshvari devi parabrahmasvarupini
    | rajyam dehi dhanam dehi samrajyam dehi me sada || 8 || namaste'stu ca kaumari parabrahmasvarupini
    | rajyam dehi dhanam dehi samrajyam dehi me sada || 9 || namaste vaishnavi devi parabrahmasvarupini
    | rajyam dehi dhanam dehi samrajyam dehi me sada || 10 || namaste'stu ca varahi parabrahmasvarupini
    | rajyam dehi dhanam dehi samrajyam dehi me sada || 11 || narasimhi namaste'stu parabrahmasvarupini
    | rajyam dehi dhanam dehi samrajyam dehi me sada || 12 || namo namaste indrani parabrahmasvarupini
    | rajyam dehi dhanam dehi samrajyam dehi me sada || 13 || namo namaste camunde parabrahmasvarupini
    | rajyam dehi dhanam dehi samrajyam dehi me sada || 14 || namo namaste nandayai parabrahmasvarupini
    | rajyam dehi dhanam dehi samrajyam dehi me sada || 15 || raktadante namaste'stu parabrahmasvarupini
    | rajyam dehi dhanam dehi samrajyam dehi me sada || 16 || namaste'stu mahadurge parabrahmasvarupini
    | rajyam dehi dhanam dehi samrajyam dehi me sada || 17 || shakambhari namaste'stu parabrahmasvarupini
    | rajyam dehi dhanam dehi samrajyam dehi me sada || 18 || shivaduti namaste'stu parabrahmasvarupini
    | rajyam dehi dhanam dehi samrajyam dehi me sada || 19 || namaste bhramari devi parabrahmasvarupini
    | rajyam dehi dhanam dehi samrajyam dehi me sada || 20 || namo navagraharupe parabrahmasvarupini |
    rajyam dehi dhanam dehi samrajyam dehi me sada || 21 || navakuta mahadevi parabrahmasvarupini | rajyam
    dehi dhanam dehi samrajyam dehi me sada || 22 || svarnapurne namaste'stu parabrahmasvarupini | rajyam
    dehi dhanam dehi samrajyam dehi me sada || 23 || shrisundari namaste'stu parabrahmasvarupini | rajyam
    dehi dhanam dehi samrajyam dehi me sada || 24 || namo bhagavati devi parabrahmasvarupini | rajyam
    dehi dhanam dehi samrajyam dehi me sada || 25 || divyayogini namaste parabrahmasvarupini | rajyam
    dehi dhanam dehi samrajyam dehi me sada || 26 || namaste'stu mahadevi parabrahmasvarupini | rajyam
    dehi dhanam dehi samrajyam dehi me sada || 27 || namo namaste savitri parabrahmasvarupini | rajyam
    dehi dhanam dehi samrajyam dehi me sada || 28 || jayalakshmi namaste'stu parabrahmasvarupini | rajyam
    dehi dhanam dehi samrajyam dehi me sada || 29 || mokshalakshmi namaste'stu parabrahmasvarupini | rajyam
    dehi dhanam dehi samrajyam dehi me sada || 30 || candidhvajamidam stotram sarvakamaphalapradam | rajate
    sarvajantunam vashikarana sadhanam || 32 || || shricandidhvaja stotram ||
  devanagari: प्रदायिनि । राज्यं देहि धनं देहि साम्राज्यं देहि मे सदा ॥ ३ ॥ नमस्तेऽस्तु महाकाली परब्रह्मस्वरूपिणि
    । राज्यं देहि धनं देहि साम्राज्यं देहि मे सदा ॥ ४ ॥ नमस्तेऽस्तु महालक्ष्मी परब्रह्मस्वरूपिणि । राज्यं
    देहि धनं देहि साम्राज्यं देहि मे सदा ॥ ५ ॥ महासरस्वती देवी परब्रह्मस्वरूपिणि । राज्यं देहि धनं देहि
    साम्राज्यं देहि मे सदा ॥ ६ ॥ नमो ब्राह्मी नमस्तेऽस्तु परब्रह्मस्वरूपिणि । राज्यं देहि धनं देहि साम्राज्यं
    देहि मे सदा ॥ ७ ॥ नमो महेश्वरी देवि परब्रह्मस्वरूपिणि । राज्यं देहि धनं देहि साम्राज्यं देहि मे सदा
    ॥ ८ ॥ नमस्तेऽस्तु च कौमारी परब्रह्मस्वरूपिणि । राज्यं देहि धनं देहि साम्राज्यं देहि मे सदा ॥ ९ ॥ नमस्ते
    वैष्णवी देवि परब्रह्मस्वरूपिणि । राज्यं देहि धनं देहि साम्राज्यं देहि मे सदा ॥ १० ॥ नमस्तेऽस्तु च
    वाराही परब्रह्मस्वरूपिणि । राज्यं देहि धनं देहि साम्राज्यं देहि मे सदा ॥ ११ ॥ नारसिंही नमस्तेऽस्तु
    परब्रह्मस्वरूपिणि । राज्यं देहि धनं देहि साम्राज्यं देहि मे सदा ॥ १२ ॥ नमो नमस्ते इन्द्राणी परब्रह्मस्वरूपिणि
    । राज्यं देहि धनं देहि साम्राज्यं देहि मे सदा ॥ १३ ॥ नमो नमस्ते चामुण्डे परब्रह्मस्वरूपिणि । राज्यं
    देहि धनं देहि साम्राज्यं देहि मे सदा ॥ १४ ॥ नमो नमस्ते नन्दायै परब्रह्मस्वरूपिणि । राज्यं देहि धनं
    देहि साम्राज्यं देहि मे सदा ॥ १५ ॥ रक्तदन्ते नमस्तेऽस्तु परब्रह्मस्वरूपिणि । राज्यं देहि धनं देहि
    साम्राज्यं देहि मे सदा ॥ १६ ॥ नमस्तेऽस्तु महादुर्गे परब्रह्मस्वरूपिणि । राज्यं देहि धनं देहि साम्राज्यं
    देहि मे सदा ॥ १७ ॥ शाकम्भरी नमस्तेऽस्तु परब्रह्मस्वरूपिणि । राज्यं देहि धनं देहि साम्राज्यं देहि मे
    सदा ॥ १८ ॥ शिवदूति नमस्तेऽस्तु परब्रह्मस्वरूपिणि । राज्यं देहि धनं देहि साम्राज्यं देहि मे सदा ॥ १९
    ॥ नमस्ते भ्रामरी देवि परब्रह्मस्वरूपिणि । राज्यं देहि धनं देहि साम्राज्यं देहि मे सदा ॥ २० ॥ नमो नवग्रहरूपे
    परब्रह्मस्वरूपिणि । राज्यं देहि धनं देहि साम्राज्यं देहि मे सदा ॥ २१ ॥ नवकूट महादेवि परब्रह्मस्वरूपिणि
    । राज्यं देहि धनं देहि साम्राज्यं देहि मे सदा ॥ २२ ॥ स्वर्णपूर्णे नमस्तेऽस्तु परब्रह्मस्वरूपिणि ।
    राज्यं देहि धनं देहि साम्राज्यं देहि मे सदा ॥ २३ ॥ श्रीसुन्दरी नमस्तेऽस्तु परब्रह्मस्वरूपिणि । राज्यं
    देहि धनं देहि साम्राज्यं देहि मे सदा ॥ २४ ॥ नमो भगवती देवि परब्रह्मस्वरूपिणि । राज्यं देहि धनं देहि
    साम्राज्यं देहि मे सदा ॥ २५ ॥ दिव्ययोगिनी नमस्ते परब्रह्मस्वरूपिणि । राज्यं देहि धनं देहि साम्राज्यं
    देहि मे सदा ॥ २६ ॥ नमस्तेऽस्तु महादेवि परब्रह्मस्वरूपिणि । राज्यं देहि धनं देहि साम्राज्यं देहि मे
    सदा ॥ २७ ॥ नमो नमस्ते सावित्री परब्रह्मस्वरूपिणि । राज्यं देहि धनं देहि साम्राज्यं देहि मे सदा ॥ २८
    ॥ जयलक्ष्मी नमस्तेऽस्तु परब्रह्मस्वरूपिणि । राज्यं देहि धनं देहि साम्राज्यं देहि मे सदा ॥ २९ ॥ मोक्षलक्ष्मी
    नमस्तेऽस्तु परब्रह्मस्वरूपिणि । राज्यं देहि धनं देहि साम्राज्यं देहि मे सदा ॥ ३० ॥ चण्डीध्वजमिदं स्तोत्रं
    सर्वकामफलप्रदम् । राजते सर्वजन्तूनां वशीकरण साधनम् ॥ ३२ ॥ ॥ श्रीचण्डीध्वज स्तोत्रम् ॥
