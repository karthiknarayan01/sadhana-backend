    ल॑भे॒तान्न॑कामो वैश्वदे॒वं विँश्वा॑ने॒व दे॒वान् थ्स्वेन॑ भाग॒धेये॒नोप॑ धावति॒ त ए॒वास्मा॒ अन्नं॒ प्रय॑च्छन्त्यन्ना॒द
    ए॒व भ॑वति॒ छन्द॑सां॒ वाँ ए॒ष रसो॒ यद्व॒शा रस॑ इव॒ खलु॒ वा अन्न॒ ञ्छन्द॑सामे॒व रसे॑न॒ रस॒मन्न॒मव॑ रुन्धे
    वैश्वदे॒वी म्ब॑हुरू॒पामा ल॑भेत॒ ग्राम॑कामो वैश्वदे॒वा वै स॑जा॒ता विश्वा॑ने॒व दे॒वान् थ्स्वेन॑ भाग॒धेये॒नोप॑
    धावति॒ त ए॒वास्मै॑ सजा॒ता न्प्र य॑च्छन्ति ग्रा॒म्ये॑व भ॑वति॒ छन्द॑सां॒ वाँ ए॒ष रसो॒ यद्व॒शा रस॑ इव॒
    खलु॒ वै स॑जा॒ता श्छन्द॑सामे॒व रसे॑न॒ रसग्ं॑ सजा॒तानव॑ रुन्धे बार् मु॑क्षव॒शमा ल॑भेत ब्रह्मवर्च॒सका॑मो॒
    बृह॒स्पति॑मे॒व स्वेन॑ भाग॒धेये॒नोप॑ धावति॒ स ए॒वा द॒धा॒ति॒ ब्र॒ह्म॒व॒र्च॒स्ये॑व द॑धाति ब्रह्मवर्च॒स्ये॑व
    भ॑वति॒ वशं॒ वाँ ए॒ष च॑रति॒ यदु॒क्षावश॑ इव॒ खलु॒ वै ब्र॑ह्मवर्च॒सं म्ब्रह्मवर्च॒समव॑ रुन्धेरौ॒द्रीग्ंरोहि॑णी॒मा
    ल॑भेताभि॒चर॑ न्रु॒द्रमे॒व स्वेन॑ भाग॒धेये॒नोप॑ धावति॒ तस्मा॑ ए॒वैन॒मा वृ॑श्चति ता॒जगार्ति॒मार्च्छ॑ति॒
    रोहि॑णी भवति रौ॒द्री ह्ये॑षा दे॒वत॑या॒ समृ॑द्ध्यै॒ स्फ्यो यूपो॑ भवति॒ वज्रो॒ वै स्फ्यो वज्र॑मे॒वास्मै॒
    प्र ह॑रति शर॒मय॑ वैँभी॑दक इ॒द्ध्मो भि॒नत्त्ये॒वैन एका॒न्नविग्ं॑श॒तिश्च॑ अ॒सावा॑दि॒त्यो न व्य॑रोचत॒
    तस्मै॑ दे॒वाः प्राय॑श्चित्तिमैच्छ॒ न्तस्मा॑ ए॒ताग्ं सौ॒रीग् ऽल॑भन्त॒ तयै॒वास्मि॒ न्रुच॑मदधु॒र्यो ब्र॑ह्मवर्च॒सका॑म॒
    त्तस्मा॑ ए॒ताग्ं सौ॒रीग् वँ॒शामा ल॑भेता॒मुमे॒वा ऽऽदि॒त्यग्ग् स्वेन॑ भाग॒धेये॒नोप॑ धावति॒ स ए॒वास्मि॑
    न्द॑धाति ब्रह्मवर्च॒स्ये॑व भ॑वति बै॒ल्॒ ऽजा॑यत॒ ततो॑ बि॒ल्व॑ उद॑तिष्ठ॒ न्ये॒व ब्र॑ह्मवर्च॒समव॑ रुन्धे
    ब्राह्मणस्प॒त्या म्ब॑भ्रुक॒र्णीमा ल॑भेता द्वरु॑णेनै॒व भ्रातृ॑व्य ङ्ग्राहयि॒त्वा ब्रह्म॑णा स्तृणुते
    बभ्रुक॒र्णी भ॑वत्ये॒तद्वै ब्रह्म॑णो रू॒पग्ं समृ॑द्ध्यै॒ स्फ्यो यूपो॑ भवति॒ वज्रो॒ वै स्फ्यो वज्र॑मे॒वास्मै॒
    प्र ह॑रति शर॒मय॑ वैँभी॑दक इ॒द्ध्मो भि॒नत्त्ये॒वैनं॑ द्विष्णु॒र्वै य॒ज्ञो विष्णु॑मे॒व स्वेन॑ भाग॒धेये॒नोप॑
    धावति॒ स ए॒वास्मै॑ य॒ज्ञ म्प्र य॑च्छ॒त्युपै॑नं यँ॒ज्ञो न॑मति वाम॒नो भ॑वति वैष्ण॒वो ह्ये॑ष दे॒वत॑या॒
    समृ॑द्ध्यै त्वा॒ष्ट्रं वँ॑ड॒ब मा ल॑भेत प॒शुका॑म॒स्त्वष्टा॒ वै प॑शू॒ना प्रजनयि॒ता त्वष्टा॑रमे॒व स्वेन॑
    भाग॒धेये॒नोप॑ धावति॒ स ए॒वास्मै॑ प॒शू न्प्र ज॑नयति प्र॒जा हि वा ए॒तस्मि॑ न्प॒शवः॒ प्रवि॑ष्टा॒ अथै॒ष
    पुमा॒न्थ् स्सा॒क्षादे॒व प्र॒जा म्प॒शूनव॑ रुन्धे मै॒त्रग्ग् श्वे॒तमा ल॑भेत सङ्ग्रा॒मे सं यँ॑त्ते सम॒यका॑मो
    मि॒त्रमे॒व स्वेन॑ भाग॒धेये॒नोप॑ धावति॒ स ए॒वैन॑ विशा॒लो भ॑वति॒ व्यव॑साययत्ये॒वैन॑ ङ्कृ॒ष्णमा ल॑भेत॒
    वृष्टि॑कामः प्र॒जाप॑ति॒र्वै वृष्ट्या॑ ईशे प्र॒जाप॑तिमे॒व स्वेन॑ भाग॒धेये॒नोप॑ धावति॒ स ए॒वास्मै॑ प॒र्जन्यं॑
    षयति कृ॒ष्णो भ॑वत्ये॒तद्वै वृष्ट्यै॑ रू॒पग्ं रू॒पेणै॒व वृष्टि॒मव॑ रुन्धे श॒बलो॑ भवति वि॒द्युत॑मे॒वास्मै॑
    जनयि॒त्वा व॑र् षयत्यवाशृ॒ङ्गो भ॑वति॒ वृष्टि॑मे॒वास्मै॒ नि य॑च्छति ॥ वरु॑णग्ं सुषुवा॒णम॒न्नाद्य॒ स्वायै॑
    दे॒वता॑या॒ आल॑भत॒ ततो॒ वै तम॒न्ना म॒न्नाद्या॑य॒ सन्त॑म॒न्नाद्य॒ वँ॒शामा ल॑भेत॒ वरु॑णमे॒व स्वेन॑ भाग॒धेये॒नोप॑
    धावति॒ स ए॒वास्मा॒ अन्न॒ म्प्र य॑च्छत्यन्ना॒द म्प्र य॑च्छत्यन्ना॒दः ए॒व भ॑वति कृ॒ष्णा भ॑वति वारु॒णी
    ह्ये॑षा दे॒वत॑या॒ समृ॑द्ध्यै मै॒त्रग्ग् श्वे॒तमा ल॑भेत वारु॒ण वँन्न॑कामो मै॒त्रीर्वा ओष॑धयो वारु॒णीरापो॒
    ञ्च॒ खलु॒ वा ओष॑धीना ञ्च॒ रस॒मुप॑ जीवामो मि॒त्रावरु॑णावे॒व स्वेन॑ भाग॒धेये॒नोप॑ धावति॒ तावे॒वास्मा॒
    अन्न॒ व॑रुद्ध्यै॒विशा॑खो॒ यूपो॑ भवति॒ द्वे ह्ये॑ते दे॒वते॒ समृ॑द्ध्यै मै॒त्रग्ग् श्वे॒तमा ल॑भेत वारु॒ण
    न्मै॒त्रो भव॑ति मि॒त्रेणै॒वा ऽस्मै॒ वरु॑णग्ं शमयति॒ य न्मु॑ञ्चत्यु॒त यदी॒तासु॒र्भव॑ति॒ जीव॑त्ये॒व
    दे॒वा वै पुष्टि॒ मा॒वयो॒र्वा ए॒षा मैतस्यां ँवदद्ध्व॒मिति॒ साश्विनो॑रे॒वाभ॑व॒द्यः पुष्टि॑काम॒ ऽश्विना॑वे॒व
    स्वेन॑ भाग॒धेये॒नोप॑ धावति॒ तावे॒वास्मि॒ न्धत्तः॒ पुष्य॑ति प्र॒जया॑ प॒शुभिः॑ ॥ न्धू॒म्रल॑लाम॒ मा ल॑भेत॒
    यो दुर्ब्रा द॒श्विनौ॒ वै दे॒वाना॒ न्तौ प॒श्चा सो॑मपी॒थ वे॒तस्य॑ दे॒वता॒ यो दुर्ब्रा म्पिपा॑सत्य॒श्विना॑वे॒व
    स्वेन॑ भाग॒धेये॒नोप॑ धावति॒ म्प्र य॑च्छत॒ उपै॑नग्ं सोमपी॒थो न॑मति॒ य द्धू॒म्रो भव॑ति धूम्रि॒माण॑ भवति
    मुख॒त ए॒वास्मि॒ न्तेजो॑ दधाति वाय॒व्य॑ ङ्गोमृ॒गमा ल॑भेत॒ यमज॑घ्निवाग्ं समभि॒शग्ं से॑यु॒रपू॑ता॒ वा
    ए॒तं वाँगृ॑च्छति॒ यमज॑घ्निवाग्ं समभि॒शग्ं स॑न्ति॒ नैष ग्रा॒म्यः प॒शुर्नार॒ण्यो य द्गो॑मृ॒गो नेवै॒ष
    ग्रामे॒ नार॑ण्ये॒ यमज॑घ्निवाग्ं समभि॒शग्ं स॑न्ति वा॒युर्वै दे॒वाना वाँ॒युमे॒व स्वेन॑ भाग॒धेये॒नोप॑
    धावति॒ स ए॒वै म्पवयति॒ परा॑ची॒ वा ए॒तस्मै व्यु॒च्छन्ती॒ व्यु॑च्छति॒ तमः॑ पा॒प्मान॒ ऽऽश्वि॒ने श॒स्यमा॑ने॒
    सूर्यो॒ ना म्ब॑हुरू॒पमा ल॑भेता॒ स्वेन॑ भाग॒धेये॒नोप॑ धावति॒ स ए॒वास्मा॒ त्तमः॑ पा॒प्मान॒मप॑ हन्ति
    प्र॒तीच्य॑स्मै व्यु॒च्छन्ती॒ व्यु॑च्छ॒त्यप॒ तमः॑ पा॒प्मानग्ं॑ हते ॥ मरु॑तो॒ यद्ध॑ वो दि॒वो श्शर्म॑
    ॥ भरे॒ष्विन्द्रग्ं॑ सु॒हवग्ं॑ हवामहे ऽग्ंहो॒मुचग्ं॑ सु॒कृत॒ वँरु॑णग्ं सा॒तये॒ भग॒ न्द्यावा॑पृथि॒वी
    म॒रुतः॑ स्व॒स्तये ॥ म॒मत्तु॑ नः॒ परि॑ज्मा वस॒र्॒हा म॒मत्तु॒ वातो॑ अ॒पां वृँष॑ण्वान्न् । शि॒शी॒तमि॑न्द्रापर्वता
    यु॒व न्न॒स्तन्नो॒ विश्वे॑ वरिवस्यन्तु दे॒वाः ॥ प्रि॒या वो॒ नाम॑ त्तृ॒पन्म॑रुतो वावशा॒नाः ॥ श्रि॒यसे॒
    क म्मि॑मिक्षिरे॒ ते र॒श्मिभि॒स्त ऋक्व॑भि स्सुखा॒दयः॑ । ते वाशी॑मन्त इ॒ष्मिणो॒ अभी॑रवो वि॒द्रे प्रि॒यस्य॒
    मारु॑तस्य॒ धाम्नः॑ ॥ अ॒ग्निः प्र॑थ॒मो वसु॑भिर्नो अव्या॒ थ्सोमो॑ रु॒द्रेभि॑र॒भि र॑क्षत॒ त्मना । इन्द्रो॑
    म॒रुद्भि॑र् ऋतु॒धा कृ॑णोत्वादि॒त्यैर्नो॒ वरु॑ण॒ न्नो॑ दे॒वो वसु॑भिर॒ग्नि सोम॑स्त॒नूभी॑ रु॒द्रिया॑भिः
    । सोम॑स्त॒नूभी॑ रु॒द्रिया॑भिः । समिन्द्रो॑ म॒रुद्भि॑ र्य॒ज्ञियै॒ स्समा॑दि॒त्यैर्नो॒ वरु॑णो अजिज्ञिपत्
    ॥ यथा॑ स्स॒मजा॑नता॒भि । ए॒वा त्रि॑णाम॒न्न हृ॑णीयमाना॒ विश्वे॑ दे॒वा स्सम॑नसो भवन्तु ॥ कुत्रा॑ चि॒द्यस्य॒
    समृ॑तौ र॒ण्वा नरो॑ नृ॒षद॑ने । अर् द्यमि॑न्ध॒ते स॑ञ्ज॒नय॑न्ति ज॒न्तवः॑ ॥ सं यँदि॒षो वना॑महे॒ सग्ं ह॒व्या
    मानु॑षाणाम् । उ॒त द्यु॒म्नस्य॒ शव॑स ऋ॒तस्य॑ र॒श्मिमा द॑दे । ऋ॒तस्य॑ र॒श्मिमा द॑दे ॥ य॒ज्ञो दे॒वाना॒
    म्प्रत्ये॑ति सु॒म्नमादि॑त्यासो॒ भव॑ता मृड॒यन्तः॑ । आ वो॒ ऽर्वाची॑ सुम॒तिर्व॑वृत्याद॒ग्ं॒ होश्चि॒द्या
    व॑रिवो॒वित्त॒रा स्सू॒यव॑सा अद॑ब्ध॒ उप॑ क्षेति वृ॒द्धव॑या स्सु॒वीरः॑ । नकि॒ष्टं घ्न॒न्त्यन्ति॑तो॒ न
    दू॒राद्य आ॑दि॒त्याना॒ म्भव॑ति॒ प्रणी॑तौ ॥ धा॒रय॑न्त आदि॒त्यासो॒ जग॒थ्स्था दे॒वा विश्व॑स्य॒ भुव॑नस्य
    गो॒पाः । दी॒र्घाधि॑यो॒ रक्ष॑माणा श्चय॑माना ऋ॒णानि॑ ॥ ति॒स्रो भूमी न्त्रीणि॑ व्र॒ता वि॒दथे॑ अ॒न्तरे॑षाम्
    । ऋ॒तेना॑ ऽऽदित्या॒ महि॑ वो महि॒त्व न्तद॑र्यमन् वरुण मित्र॒ चारु॑ ॥ त्यान्नु क्ष॒त्रिया॒ग्ं॒ अव॑ आदि॒त्यान्
    या॑चिषामहे । सु॒मृ॒डी॒काग्ं अ॒भिष्ट॑ये ॥ न द॑क्षि॒णा विचि॑किते॒ न स॒व्या न प्रा॒चीन॑मादित्या॒ नोत
    प॒श्चा । पा॒क्या॑ चिद्वसवो धी॒र्या॑ चि द्यु॒ष्मानी॑तो॒ अभ॑य॒ ञ्ज्योति॑रश्याम् ॥ आ॒दि॒त्याना॒मव॑सा॒
    नूत॑नेन सक्षी॒महि॒ शर्म॑णा॒ शन्त॑मेन । अ॒ना॒गा॒स्त्वे अ॑दिति॒त्वे तु॒रास॑ इ॒मं न्द॑धतु॒ श्रोष॑माणाः
    ॥ इ॒म म्मे॑ वरुण श्रुधी॒ हव॑म॒द्या च॑ मृडय । त्वाम॑व॒स्युरा च॑के ॥ तत्त्वा॑ यामि॒ ब्रह्म॑णा॒ वन्द॑मान॒
    स्ते॒ यज॑मानो ह॒विर्भिः॑ । अहे॑डमानो वरुणे॒ह बो॒द्ध्युरु॑शग्ंस॒ मा न॒ आयुः॒ प्रमो॑षीः ॥ प्रा॒जप॑ति॒स्ता
    वरु॑णं ॥ हरिः॑ ओम् ॥ ॥ कृष्ण यजुर्वेदीय तैत्तिरीय संहिताया न्द्वितीयकाण्डे प्रथमः प्रश्न
