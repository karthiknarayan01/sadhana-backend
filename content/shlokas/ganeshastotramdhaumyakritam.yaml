id: ganeshastotramdhaumyakritam
category: stotram
name:
  english: ganeshastotramdhaumyakritam
  devanagari: गणेशस्तोत्रम्धौम्यकृतं
content:
  english: rinu sarvajnasattama || 8|| ganeshaya namastubhyam yogashantipradayine | shantinam shantirupaya
    herambaya namo namah || 9|| anamayaya jyeshthaya jyeshthapadapradayine | jyeshthanam jyeshtharupaya
    vighneshaya namo namah || 10|| namarupatmakeshveva shaktirupaya te namah | atmasu ravaye tubhyam sameshu
    vishnave namah || 11|| avyakteshu maheshaya samyogeshu nijatmane | nivrittishu hyayogaya kalamshena
    namo namah || 12|| yogeshu shantirupaya brahmanaspataye namah | adimadhyantabhedaistu khelakaya namo
    namah || 13|| nanamayapracalaya siddhibuddhipate namah | svanandavasine tubhyam bhaktarakshanatatpara
    || 14|| kim staumi tvam ganadhisha veda yogina eva ca | na samartha ato natha pranamami gajananam
    || 15|| evamuktva ganadhisham papata'sau dharatale | dandavadgananathasya padau grihya mahamunih ||
    16|| tamutthapya svayam praha ganesho brahmanam patih | varan varaya dhaumya tvam dasyami stotratoshitah
    || 17|| stotram tvaya kritam me yat pathate sha
  devanagari: ृणु सर्वज्ञसत्तम ॥ ८॥ गणेशाय नमस्तुभ्यं योगशान्तिप्रदायिने । शान्तीनां शान्तिरूपाय हेरम्बाय
    नमो नमः ॥ ९॥ अनामयाय ज्येष्ठाय ज्येष्ठपदप्रदायिने । ज्येष्ठानां ज्येष्ठरूपाय विघ्नेशाय नमो नमः ॥ १०॥
    नामरूपात्मकेष्वेव शक्तिरूपाय ते नमः । आत्मसु रवये तुभ्यं समेषु विष्णवे नमः ॥ ११॥ अव्यक्तेषु महेशाय
    संयोगेषु निजात्मने । निवृत्तिषु ह्ययोगाय कलांशेन नमो नमः ॥ १२॥ योगेषु शान्तिरूपाय ब्रह्मणस्पतये नमः
    । आदिमध्यान्तभेदैस्तु खेलकाय नमो नमः ॥ १३॥ नानामायाप्रचालाय सिद्धिबुद्धिपते नमः । स्वानन्दवासिने तुभ्यं
    भक्तरक्षणतत्पर ॥ १४॥ किं स्तौमि त्वां गणाधीश वेदा योगिन एव च । न समर्था अतो नाथ प्रणमामि गजाननम् ॥
    १५॥ एवमुक्त्वा गणाधीशं पपाताऽसौ धरातले । दण्डवद्गणनाथस्य पादौ गृह्य महामुनिः ॥ १६॥ तमुत्थाप्य स्वयं
    प्राह गणेशो ब्रह्मणां पतिः । वरान् वरय धौम्य त्वं दास्यामि स्तोत्रतोषितः ॥ १७॥ स्तोत्रं त्वया कृतं
    मे यत् पठते श
