id: sri-bagalamukhi-stotram-2
category: stotram
name:
  english: Sri Bagalamukhi Stotram - 2
content:
  english: asya shribagalamukhimahamantrasya narado bhagavan rishih atijagatichandah shri bagalamukhi
    devata lam bijam im shaktih lam kilakam mama durasthanam samipasthanam gati mati vaktsambhanarthe
    jape viniyogah om hrim angushthabhyam namah bagalamukhi tarjanibhyam namah sarvadushtanam madhyamabhyam
    namah vacam mukham padam stambhaya anamikabhyam namah jihvam kilaya buddhim vinashaya kanishthikabhyam
    namah hrim om svaha karatalakaraprishtabhyam namah om hrim hridayaya namah bagalamukhi shirase svaha
    sarvadushtanam shikhayai vashat vacam mukham padam stambhaya kavaca hum jihvam kilaya buddhim vinashaya
    netratrayaya vaushat hrim om svaha astraya phat bhurbhuvassuvaromiti digbandhah | dhyanam | pitambaram
    trinetram ca dvibhujam dahanojvalam | shilaparvatahastam ca ripukampam mahotkatam || || gambhiram
    ca madonmattam svarnakantisamaprabham | vairinirdalanarthaya smarettam bagalamukhim || || caturbhujam
    trinayanam kamalasanasamsthitam | dakshine mudgaram pasham vame jihvam ca vajrakam || || pitambaradharam
    sandram dridhapinayodharam | vairivaktsambhinim devim smarami bagalamukhim || || hemakundalabhushangim
    shitacandrardhashekharim | pitabhushanabhushadhyam svarnasimhasanesthitam || || trishuladharinimambam
    sarvasaubhagyadayinim | sarvashringaraveshadhyam bhajettam bagalamukhim || || madhye sudhabdhimanimantapa
    ratna vedyam simhasanoparigatam paripitavarnam | pitambarabharanamalyavibhushitangim devim namami
    dhrita mudgaravairi jihvam || || calatkanakakundalollasitacarugandasthalam lasatkanakacampaka dyutimadardhendu
    bimbancitam | sadahitavipakshakam dalitavairi jihvancalam namami bagalamukhim dhimatam vanmanasstambhinim
    || || piyusho dadhimadhyacaru vilasadratnojvale mantape yasimhasana maulipatitaripu pretasanadhyasinim
    | svarnabham karapiditarirashanam bhramyadgadam bibhratim yastvam pashyati tasya yanti vilayam sadyohi
    sarvapadah || || devi tvaccaranambujarcanakrite yah pitapushpanjalim mudram vamakare nidhaya ca punarmantri
    manojnaksharim | pithadhyanaparopi kumbhakavashadbijam smaretprarthitam tasya mitracayasya samsadi
    mukha stambho bhavettatkshanat || om hrim bagalamukhi sarvadushtanam vacam mukham padam stambhaya
    jihvam kilaya buddhim vinashaya hrim om svaha mantrastavadayam vipakshadalane stotram pavitram ca
    te yantramvadini yantrinam trijagatam jaitram sa citram ca tat | shrimatarbagaleti nama lalitam yasyasti
    jantormukhe tannamasmaranena vagbhavamukha stambhobhavettatkshanat || || dushtastambhanamugravighnashamanam
    daridryavidravanam bhubhrittsambhanakaranam mrigadrisham cetassamakarshanam | saubhagyaikaniketanam
    mama drisham karunyapurnekshane mrityormaranamavirastu purato matastvadiyam vapuh || || sankhyagre
    coradanda praharanasamaye bandhane vairimadhye vidyavade vivade prakatitanripatau yuddhakale nishayam
    | vashye ca stambhane va ripuvadhasamaye pranabadhe rane va gacchantishtam trikalam tava pathanamidam
    karayedashu dhirah || || matarbhanjaya madvipakshavadanam jihvam ca sankilaya brahmim mudraya mudrayashudhishanamanghryorgatim
    stambhaya | shatrun curnaya curnayashu gadaya gaurangi pitambare vighnaugham bagale hara pratidinam
    kaumari vamekshane || || matarbhairavi bhadrakali vijaye varahi vishvashraye shrinitye bagale maheshi
    samaye rame surame rame | matangi tripure paratparatare svargapavargaprade vandeham sharanagatosmikripaya
    vishveshvari trahi mam || || tvam vidya parama trilokajanani vyoshananam chedini yoshakarshanakarini
    ca sumahabandhaikasambhedini | dushtoccatanakarini ripumanassandohasandayini jihvakilanabhairavi vijayate
    brahmastrasarayani || || yah kritam japasankhyanam cintitam parameshvari | shatrunam buddhinashaya
    grihana madanugrahat || || vaiduryaharaparishobhitahemamalam madhyetipina kucayordhritapitavastram
    | vyaghradhirudha paripurita ratnashobham nityam smarami bagalam ripuvaktra kilam || || ekagra manaso
    bhutva stoshyatyambam sushobhanam | rajanya racitam malam kare dhritva japecchucih || || vame panau
    tu pasham ca tasyadhastaddhridham shubham | dakshe kare'kshasutram ca adhahpadmam ca dharinim || ||
    camunde candikoshtre hutavahadayite shyamale shribhujangi durge pratyangiradye muraripubhagini bhargavivamanetre
    | nanarupaprabhede sthitilayajananam palayadbhargahridye vishvadye vishvajaitri tripurah bagale vishvavandye
    tvameka || || cakram khadgam musalamabhayam dakshinabhishca dorbhih shankham khetam halamapi ca gadam
    bibhratim vamadorbhih | simharudhamayuganayanam shyamalam kanjavaktram vande devim sakalavaradam pancamim
    matrimadhyam || || dvatrimshadayutayutaishcaturashtahastai rashtottaraishshatakaraishca sahasrahastaih
    | sarvayudhairayuta bahubhiranvitam tam devim bhajami bagalam rasanagrahastam || || sarvatashshubhakaram
    dvibhujam tam kambuhema navakundala karnam | shatrunirdalanakaranakopam cintayami bagalam hridayabje
    || || jihvagramadaya karena devim vamena shatrun paripidayantim | gadabhighatena ca dakshinena pitambaradhyam
    dvibhujam namami || || vande varijalocanam vasukaram pitambaradambaram pitambhoruhasamsthitam trinayanam
    pitangaragojjvalam | shabdabrahmamayim mahakavijayim trailokyasammohanim vidyutkoti nibham prasanna
    bagalam pratyarthivaktsambhinim || || duhkhena va yadi sukhena ca va tvadiyam stutva'tha namabagale
    samupaiti vashyam | nishcitya shatrumabalam vijayam tvadanghri padmarcakasya bhavatiti kimatra citram
    || || vimohitajagattrayam vashagatavanavallabham bhajami bagalamukhim bhavasukhaikasandhayinim | geham
    natati garvitah pranamati strisangamo mokshati dveshi mitrati papakritsukritati kshmavallabhodhavati
    || || mrityurvaidhritidushanam sugunati tvatpadasamsevanat tvam vande bhavabhitibhanjanakarim gaurim
    girishapriyam | nityam yastu manoharam stavamidam divyam pathetsadaram dhritva yantramidam tathaiva
    samare bahvoh kare va gale || || rajano varayoshitothakarinassarvamrigendra vashah stotrairyanti vimohita
    ripugana lakshmih sthira siddhayah | nirnidre bagale samudranilaye raudryadi vanmudrike bhadre rudramanohare
    tribhuvanatrane daridrapahe || || sadratnakara bhumigojvala kari nistandri candranane niharadrisute
    nisargasarale vidye suradye namah | devi tasya niramayatmajamukhanyayumshi dadyadidam ye nityam prajapanti
    bhakti bharitastebhyasstavam nishcitam || || nunam shreyo vashyamarogyatam ca praptassarvam bhutale
    sadhakastu | bhaktya nityam stotrametatpathanvai vidyam kirtim vamshavriddhim ca vindet || || iti
    shrirudrayamale shribagalamukhistotram ||
  devanagari: अस्य श्रीबगलामुखीमहामन्त्रस्य नारदो भगवान् ऋषिः अतिजगतीछन्दः श्री बगलामुखी देवता लां बीजं
    इं शक्तिः लं कीलकं मम दूरस्थानां समीपस्थानां गति मति वाक्त्सम्भनार्थे जपे विनियोगः ॐ ह्रीं अङ्गुष्ठाभ्यां
    नमः बगलामुखी तर्जनीभ्यां नमः सर्वदुष्टानां मध्यमाभ्यां नमः वाचं मुखं पदं स्तम्भय अनामिकाभ्यां नमः
    जिह्वां कीलय बुद्धिं विनाशय कनिष्ठिकाभ्यां नमः ह्रीं ॐ स्वाहा करतलकरपृष्टाभ्यां नमः ॐ ह्रीं हृदयाय
    नमः बगलामुखी शिरसे स्वाहा सर्वदुष्टानां शिखायै वषत् वाचं मुखं पदं स्तम्भय कवचा हुं जिह्वां कीलय बुद्धिं
    विनाशय नेत्रत्रयाय वौषट् ह्रीं ॐ स्वाहा अस्त्राय फट् भूर्भुवस्सुवरोमिति दिग्बन्धः । ध्यानम् । पीताम्बरां
    त्रिणेत्रां च द्विभुजां दहनोज्वलाम् । शिलापर्वतहस्तां च रिपुकम्पां महोत्कटाम् ॥ ॥ गम्भीरां च मदोन्मत्तां
    स्वर्णकान्तिसमप्रभाम् । वैरिनिर्दलनार्थाय स्मरेत्तां बगलामुखीम् ॥ ॥ चतुर्भुजां त्रिणयनां कमलासनसंस्थिताम्
    । दक्षिणे मुद्गरं पाशं वामे जिह्वां च वज्रकम् ॥ ॥ पीताम्बरधरां सान्द्रां दृढपीनयोधराम् । वैरिवाक्त्सम्भिनीं
    देवीं स्मरामि बगलामुखीम् ॥ ॥ हेमकुण्डलभूषाङ्गीं शीतचन्द्रार्धशेखरीम् । पीतभूषणभूषाढ्यां स्वर्णसिंहासनेस्थिताम्
    ॥ ॥ त्रिशूलधारिणीमम्बां सर्वसौभाग्यदायिनीम् । सर्वशृङ्गारवेषाढ्यां भजेत्तां बगलामुखीम् ॥ ॥ मध्ये सुधाब्धिमणिमण्टप
    रत्न वेद्यां सिंहासनोपरिगतां परिपीतवर्णाम् । पीताम्बराभरणमाल्यविभूषिताङ्गीं देवीं नमामि धृत मुद्गरवैरि
    जिह्वाम् ॥ ॥ चलत्कनककुण्डलोल्लसितचारुगण्डस्थलां लसत्कनकचम्पक द्युतिमदर्धेन्दु बिम्बाञ्चिताम् । सदाहितविपक्षकां
    दलितवैरि जिह्वाञ्चलां नमामि बगलामुखीं धीमतां वाङ्मनस्स्तम्भिनीम् ॥ ॥ पीयूषो दधिमध्यचारु विलसद्रत्नोज्वले
    मण्टपे यासिंहासन मौलिपातितरिपु प्रेतासनाध्यासिनीम् । स्वर्णाभां करपीडितारिरशनां भ्राम्यद्गदां बिभ्रतीं
    यस्त्वां पश्यति तस्य यान्ति विलयं सद्योहि सर्वापदः ॥ ॥ देवि त्वच्चरणाम्बुजार्चनकृते यः पीतपुष्पाञ्जलिं
    मुद्रां वामकरे निधाय च पुनर्मन्त्री मनोज्ञाक्षरीम् । पीठध्यानपरोपि कुम्भकवशाद्बीजं स्मरेत्प्रार्थितं
    तस्या मित्रचयस्य संसदि मुख स्तम्भो भवेत्तत्क्षणात् ॥ ॐ ह्रीं बगलामुखि सर्वदुष्टानां वाचं मुखं पदं
    स्तम्भय जिह्वां कीलय बुद्धिं विनाशय ह्रीं ॐ स्वाहा मन्त्रस्तावदयं विपक्षदलने स्तोत्रं पवित्रं च ते
    यन्त्रंवादिनि यन्त्रिणं त्रिजगतां जैत्रं स चित्रं च तत् । श्रीमातर्बगलेति नाम ललितं यस्यास्ति जन्तोर्मुखे
    तन्नामस्मरणेन वाग्भवमुख स्तम्भोभवेत्तत्क्षणात् ॥ ॥ दुष्टस्तम्भनमुग्रविघ्नशमनं दारिद्र्यविद्रावणं भूभृत्त्सम्भनकारणं
    मृगदृशां चेतस्समाकर्षणम् । सौभाग्यैकनिकेतनं मम दृशां कारुण्यपूर्णेक्षणे मृत्योर्मारणमाविरस्तु पुरतो
    मातस्त्वदीयं वपुः ॥ ॥ सङ्ख्याग्रे चोरदण्ड प्रहरणसमये बन्धने वैरिमध्ये विद्यावादे विवादे प्रकटितनृपतौ
    युद्धकाले निशायाम् । वश्ये च स्तम्भने वा रिपुवधसमये प्राणबाधे रणे वा गच्छन्तीष्टं त्रिकालं तव पठनमिदं
    कारयेदाशु धीरः ॥ ॥ मातर्भञ्जय मद्विपक्षवदनं जिह्वां च सङ्कीलय ब्राह्मीं मुद्रय मुद्रयाशुधिषणामङ्घ्र्योर्गतिं
    स्तम्भय । शत्रून् चूर्णय चूर्णयाशु गदया गौराङ्गि पीताम्बरे विघ्नौघं बगले हर प्रतिदिनं कौमारि वामेक्षणे
    ॥ ॥ मातर्भैरवि भद्रकालि विजये वाराहि विश्वाश्रये श्रीनित्ये बगले महेशि समये रामे सुरामे रमे । मातङ्गि
    त्रिपुरे परात्परतरे स्वर्गापवर्गप्रदे वन्देहं शरणागतोस्मिकृपया विश्वेश्वरी त्राहि माम् ॥ ॥ त्वं विद्या
    परमा त्रिलोकजननी व्योषाननं छेदिनी योषाकर्षणकारिणी च सुमहाबन्धैकसम्भेदिनी । दुष्टोच्चाटनकारिणी रिपुमनस्सन्दोहसन्दायिनी
    जिह्वाकीलनभैरवी विजयते ब्रह्मास्त्रसारायणी ॥ ॥ यः कृतं जपसङ्ख्यानां चिन्तितं परमेश्वरी । शत्रूणां
    बुद्धिनाशाय गृहाण मदनुग्रहात् ॥ ॥ वैडूर्यहारपरिशोभितहेममालां मध्येतिपीन कुचयोर्धृतपीतवस्त्राम् । व्याघ्राधिरूढ
    परिपूरित रत्नशोभां नित्यं स्मरामि बगलां रिपुवक्त्र कीलाम् ॥ ॥ एकाग्र मानसो भूत्वा स्तोष्यत्यम्बां
    सुशोभनाम् । रजन्या रचितां मालां करे धृत्वा जपेच्छुचिः ॥ ॥ वामे पाणौ तु पाशं च तस्याधस्ताद्धृढं शुभम्
    । दक्षे करेऽक्षसूत्रं च अधःपद्मं च धारिणीम् ॥ ॥ चामुण्डे चण्डिकोष्ट्रे हुतवहदयिते श्यामले श्रीभुजङ्गी
    दुर्गे प्रत्यङ्गिराद्ये मुररिपुभगिनी भार्गवीवामनेत्रे । नानारूपप्रभेदे स्थितिलयजननं पालयद्भर्गहृद्ये
    विश्वाद्ये विश्वजैत्री त्रिपुरः बगले विश्ववन्द्ये त्वमेका ॥ ॥ चक्रं खड्गं मुसलमभयं दक्षिणाभिश्च दोर्भिः
    शङ्खं खेटं हलमपि च गदां बिभ्रतीं वामदोर्भिः । सिंहारूढामयुगनयनां श्यामलां कञ्जवक्त्रां वन्दे देवीं
    सकलवरदां पञ्चमीं मातृमध्याम् ॥ ॥ द्वात्रिंशदायुतयुतैश्चतुरष्टहस्तै रष्टोत्तरैश्शतकरैश्च सहस्रहस्तैः
    । सर्वायुधैरयुत बाहुभिरन्वितां तां देवीं भजामि बगलां रसनाग्रहस्ताम् ॥ ॥ सर्वतश्शुभकरां द्विभुजां तां
    कम्बुहेम नवकुण्डल कर्णाम् । शत्रुनिर्दलनकारणकोपां चिन्तयामि बगलां हृदयाब्जे ॥ ॥ जिह्वाग्रमादाय करेण
    देवीं वामेन शत्रून् परिपीडयन्तीम् । गदाभिघातेन च दक्षिणेन पीताम्बराढ्यां द्विभुजां नमामि ॥ ॥ वन्दे
    वारिजलोचनां वसुकरां पीताम्बराडम्बरां पीताम्भोरुहसंस्थितां त्रिनयनां पीताङ्गरागोज्ज्वलाम् । शब्दब्रह्ममयीं
    महाकविजयीं त्रैलोक्यसम्मोहनीं विद्युत्कोटि निभां प्रसन्न बगलां प्रत्यर्थिवाक्त्सम्भिनीम् ॥ ॥ दुःखेन
    वा यदि सुखेन च वा त्वदीयं स्तुत्वाऽथ नामबगले समुपैति वश्यम् । निश्चित्य शत्रुमबलं विजयं त्वदङ्घ्रि
    पद्मार्चकस्य भवतीति किमत्र चित्रम् ॥ ॥ विमोहितजगत्त्रयां वशगतावनवल्लभां भजामि बगलामुखीं भवसुखैकसन्धायिनीम्
    । गेहं नातति गर्वितः प्रणमति स्त्रीसङ्गमो मोक्षति द्वेषी मित्रति पापकृत्सुकृतति क्ष्मावल्लभोधावति
    ॥ ॥ मृत्युर्वैधृतिदूषणं सुगुणति त्वत्पादसंसेवनात् त्वां वन्दे भवभीतिभञ्जनकरीं गौरीं गिरीशप्रियाम्
    । नित्यं यस्तु मनोहरं स्तवमिदं दिव्यं पठेत्सादरं धृत्वा यन्त्रमिदं तथैव समरे बाह्वोः करे वा गले ॥
    ॥ राजानो वरयोषितोथकरिणस्सर्वामृगेन्द्रा वशाः स्तोत्रैर्यान्ति विमोहिता रिपुगणा लक्ष्मीः स्थिरा सिद्धयः
    । निर्निद्रे बगले समुद्रनिलये रौद्र्यादि वाङ्मुद्रिके भद्रे रुद्रमनोहरे त्रिभुवनत्राणे दरिद्रापहे
    ॥ ॥ सद्रत्नाकर भूमिगोज्वल करी निस्तन्द्रि चान्द्रानने नीहाराद्रिसुते निसर्गसरले विद्ये सुराद्ये नमः
    । देवी तस्य निरामयात्मजमुखान्यायूंषि दद्यादिदं ये नित्यं प्रजपन्ति भक्ति भरितास्तेभ्यस्स्तवं निश्चितम्
    ॥ ॥ नूनं श्रेयो वश्यमारोग्यतां च प्राप्तस्सर्वं भूतले साधकस्तु । भक्त्या नित्यं स्तोत्रमेतत्पठन्वै
    विद्यां कीर्तिं वंशवृद्धिं च विन्देत् ॥ ॥ इति श्रीरुद्रयामले श्रीबगलामुखीस्तोत्रम् ॥
