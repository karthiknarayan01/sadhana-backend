    मि॒त्र इन्द्र॒ आपो॒ ब्रह्म॑ य॒मो॑ प्र॒जाप॑तिः प्र॒जायै॑ पौर्णमा॒स्या अ॑मावा॒स्या॑या॒ आग॑त्यै॒ विश्वे॒
    जित्या॑ अ॒श्विनौ॒ श्रुत्यै स्स ए॒तदाप॒स्ताः । पि॒तरो॒ विश्वे॒ वस॑वो ऽकामयन्त॒मेति॒ त ए॒त ऽकामयन्त॒
    मेति॒ ता ए॒त न्निर॑वपन्न् । इ॒न्द्रा॒ग्नी अ॒श्विना॑वकामयेतां॒ न्निर॑वपदाम् । अ॒हो॒रा॒त्रे वा अ॑कामयेता॒मिति॒
    ते ए॒त न्निर॑वपताम् । अ॒न्यत्रा॑कामयत॒मिति॒ स ए॒त न्निर॑वपत् । इ॒न्द्रा॒ग्नी श्रैष्ठ्य॒मिन्द्रो॒ ज्यैष्ठ्य॒मिन्द्रो॑
    दृ॒ढः । आहि॒ ऽदि॑त्यै॒ विष्ण॑वे प्रति॒ष्ठायै म् । अ॒ग्निर्नो॑ रीरिषद॒न्यत्र॑ रीरिषः वि॒दुषो॑ ह॒विषा॒
    य उ॑ चैनदे॒वं वेँद॑ । इष्टि॑भि॒र्य उ॑ चैना ए॒वं वेँद॑ । अ॒न्यत्र॑ ब्राह्म॒णे य उ॑ चैनमे॒वं थ्स्तर्तिन्ग्
