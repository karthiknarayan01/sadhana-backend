id: sudarshana-shatkam
category: stotram
name:
  english: Sudarshana Shatkam
content:
  english: sahasradityasankasham sahasravadanam param | sahasradossahasraram prapadye'ham sudarshanam
    || || hasantam harakeyura makutangadabhushanaih | shobhanairbhushitatanum prapadye'ham sudarshanam
    || || srakarasahitam mantram vadanam shatrunigraham | sarvarogaprashamanam prapadye'ham sudarshanam
    || || ranatkinkinijalena rakshasaghnam mahadbhutam | vyuptakesham virupaksham prapadye'ham sudarshanam
    || || hunkarabhairavam bhimam pranatartiharam prabhum | sarvapapaprashamanam prapadye'ham sudarshanam
    || || phatkarastamanirdeshya divyamantrenasamyutam | shivam prasannavadanam prapadye'ham sudarshanam
    || || etaishshadbhih stuto devah prasannah shrisudarshanah | raksham karoti sarvatma sarvatra vijayi
    bhavet ||
  devanagari: सहस्रादित्यसङ्काशं सहस्रवदनं परम् । सहस्रदोस्सहस्रारं प्रपद्येऽहं सुदर्शनम् ॥ ॥ हसन्तं हारकेयूर
    मकुटाङ्गदभूषणैः । शोभनैर्भूषिततनुं प्रपद्येऽहं सुदर्शनम् ॥ ॥ स्राकारसहितं मन्त्रं वदनं शत्रुनिग्रहम्
    । सर्वरोगप्रशमनं प्रपद्येऽहं सुदर्शनम् ॥ ॥ रणत्किङ्किणिजालेन राक्षसघ्नं महाद्भुतम् । व्युप्तकेशं विरूपाक्षं
    प्रपद्येऽहं सुदर्शनम् ॥ ॥ हुङ्कारभैरवं भीमं प्रणातार्तिहरं प्रभुम् । सर्वपापप्रशमनं प्रपद्येऽहं सुदर्शनम्
    ॥ ॥ फट्कारास्तमनिर्देश्य दिव्यमन्त्रेणसंयुतम् । शिवं प्रसन्नवदनं प्रपद्येऽहं सुदर्शनम् ॥ ॥ एतैष्षड्भिः
    स्तुतो देवः प्रसन्नः श्रीसुदर्शनः । रक्षां करोति सर्वात्मा सर्वत्र विजयी भवेत् ॥
