id: bhaktamanorathasiddhipradamganeshastotram
category: stotram
name:
  english: bhaktamanorathasiddhipradamganeshastotram
  devanagari: भक्तमनोरथसिद्धिप्रदंगणेशस्तोत्रम्
content:
  english: bhaktamanorathasiddhipradam ganeshastotram shriganeshaya namah || skanda uvaca | namaste yogarupaya
    samprajnatasharirine | asamprajnatamurdhne te tayoryogamayaya ca || 1|| vamangabhrantirupa te siddhih
    sarvaprada prabho | bhrantidharakarupa vai buddhiste dakshinangake || 2|| mayasiddhistatha devo mayiko
    buddhisamjnitah | tayoryoge ganeshana tvam sthito'si namo'stu te || 3|| jagadrupo gakarashca nakaro
    brahmavacakah | tayoryoge hi ganapo nama tubhyam namo namah || 4|| caturvidham jagatsarvam brahma
    tatra tadatmakam | hastashcatvara evam te caturbhuja namo'stu te || 5|| svasamvedyam ca yadbrahma
    tatra khelakaro bhavan | tena svanandavasi tvam svanandapataye namah || 6|| dvamdvam carasi bhaktanam
    tesham hridi samasthitah | cauravattena te'bhudvai mushako vahanam prabho || 7|| jagati brahmani sthitva
    bhoganbhumkshi svayogagah | jagadbhirbrahmabhistena ceshtitam jnayate na ca || 8|| cauravadbhogakarta
    tvam tena te vahanam param | mushako mushakarudho herambaya namo namah || 9|| kim staumi tvam ganadhisha
    yogashantidharam param | vedadayo yayuh shantimato devam namamyaham || 10|| iti stotram samakarnya
    ganeshastamuvaca ha | varam vrinu mahabhaga dasyami durlabham hyapi || 11|| tvaya kritamidam stotram
    yogashantipradam bhavet | mayi bhaktikaram skamda sarvasiddhipradam tatha || 12|| yam yamicchasi tam
    tam vai dasyami stotrayamtritah | pathate sha
  devanagari: भक्तमनोरथसिद्धिप्रदं गणेशस्तोत्रम् श्रीगणेशाय नमः ॥ स्कन्द उवाच । नमस्ते योगरूपाय सम्प्रज्ञातशरीरिणे
    । असम्प्रज्ञातमूर्ध्ने ते तयोर्योगमयाय च ॥ १॥ वामाङ्गभ्रान्तिरूपा ते सिद्धिः सर्वप्रदा प्रभो । भ्रान्तिधारकरूपा
    वै बुद्धिस्ते दक्षिणाङ्गके ॥ २॥ मायासिद्धिस्तथा देवो मायिको बुद्धिसंज्ञितः । तयोर्योगे गणेशान त्वं
    स्थितोऽसि नमोऽस्तु ते ॥ ३॥ जगद्रूपो गकारश्च णकारो ब्रह्मवाचकः । तयोर्योगे हि गणपो नाम तुभ्यं नमो नमः
    ॥ ४॥ चतुर्विधं जगत्सर्वं ब्रह्म तत्र तदात्मकम् । हस्ताश्चत्वार एवं ते चतुर्भुज नमोऽस्तु ते ॥ ५॥ स्वसंवेद्यं
    च यद्ब्रह्म तत्र खेलकरो भवान् । तेन स्वानन्दवासी त्वं स्वानन्दपतये नमः ॥ ६॥ द्वंद्वं चरसि भक्तानां
    तेषां हृदि समास्थितः । चौरवत्तेन तेऽभूद्वै मूषको वाहनं प्रभो ॥ ७॥ जगति ब्रह्मणि स्थित्वा भोगान्भुंक्षि
    स्वयोगगः । जगद्भिर्ब्रह्मभिस्तेन चेष्टितं ज्ञायते न च ॥ ८॥ चौरवद्भोगकर्ता त्वं तेन ते वाहनं परम् ।
    मूषको मूषकारूढो हेरम्बाय नमो नमः ॥ ९॥ किं स्तौमि त्वां गणाधीश योगशान्तिधरं परम् । वेदादयो ययुः शान्तिमतो
    देवं नमाम्यहम् ॥ १०॥ इति स्तोत्रं समाकर्ण्य गणेशस्तमुवाच ह । वरं वृणु महाभाग दास्यामि दुर्लभं ह्यपि
    ॥ ११॥ त्वया कृतमिदं स्तोत्रं योगशान्तिप्रदं भवेत् । मयि भक्तिकरं स्कंद सर्वसिद्धिप्रदं तथा ॥ १२॥ यं
    यमिच्छसि तं तं वै दास्यामि स्तोत्रयंत्रितः । पठते श
