id: vighneshvar108shtr
category: stotram
name:
  english: vighneshvar108shtr
  devanagari: विघ्नेश्वर्१०८ष्त्र्
content:
  english: shrivighneshvarashtottarashatanamastotram om vinayako vighnarajo gauriputro ganeshvarah | skandagrajo'vyayo
    puto daksho'dhyaksho dvijapriyah || 1|| agnigarbhacchidindrashriprado vanibalapradah | sarvasiddhipradashsharvatanayah
    sharvaripriyah || 2|| sarvatmakah srishtikarta devo'nekarcitashshivah | shuddho buddhipriyashshanto
    brahmacari gajananah || 3|| dvaimatreyo munistutyo bhaktavighnavinashanah | ekadantashcaturbahushcaturashshaktisamyutah
    || 4|| lambodarashshurpakarno harirbrahma viduttamah | kalo grahapatih kami somasuryagnilocanah ||
    5|| pashankushadharashcando gunatito niranjanah | akalmashassvayamsiddhassiddharcitapadambujah ||
    6|| bijapuraphalasakto varadashshashvatah kritih | dvijapriyo vitabhayo gadi cakrikshucapadhrit ||
    7|| vidvatpriyo shrido'jotpalakarah shripatih stutiharshitah | kuladribhetta jatilah kalikalmashanashanah
    || 8|| candracudamanih kantah papahari samahitah | ashritashshrikarassaumyo bhaktavanchitadayakah
    || 9|| shantah kaivalyasukhadassaccidanandavigrahah | jnani dayayuto danto brahma dveshavivarjitah
    ||10|| pramattadaityabhayadah shrikantho vibudheshvarah | ramarcitovidhirnagarajayajnopavitakah ||11||
    sthulakanthah svayankarta samaghoshapriyah parah | sthulatundo'granirdhiro vagishassiddhidayakah ||
    12|| durvabilvapriyo'vyaktamurtiradbhutamurtiman | shailendratanujotsangakhelanotsukamanasah || 13||
    svalavanyasudhasaro jitamanmathavigrahah | samastajagadadharo mayi mushakavahanah ||14|| hrishtastushtah
    prasannatma sarvasiddhipradayakah | ashtottarashatenaivam namnam vighneshvaram vibhum || 15|| tushtava
    shankarah putram tripuram hantumutyatah | yah pujayedanenaiva bhaktya siddhivinayakam ||16|| durvadalairbilvapatraih
    pushpairva candanakshataih | sarvankamanavapnoti sarvavighnaih pramucyate || iti shrivighneshvarashtottarashatanamastotram
    sampurnam | vinayakashtottarashatanamastotram
  devanagari: श्रीविघ्नेश्वराष्टोत्तरशतनामस्तोत्रम् ॐ विनायको विघ्नराजो गौरीपुत्रो गणेश्वरः । स्कन्दाग्रजोऽव्ययो
    पूतो दक्षोऽध्यक्षो द्विजप्रियः ॥ १॥ अग्निगर्भच्छिदिन्द्रश्रीप्रदो वाणीबलप्रदः । सर्वसिद्धिप्रदश्शर्वतनयः
    शर्वरीप्रियः ॥ २॥ सर्वात्मकः सृष्टिकर्ता देवोऽनेकार्चितश्शिवः । शुद्धो बुद्धिप्रियश्शान्तो ब्रह्मचारी
    गजाननः ॥ ३॥ द्वैमात्रेयो मुनिस्तुत्यो भक्तविघ्नविनाशनः । एकदन्तश्चतुर्बाहुश्चतुरश्शक्तिसंयुतः ॥ ४॥
    लम्बोदरश्शूर्पकर्णो हरिर्ब्रह्म विदुत्तमः । कालो ग्रहपतिः कामी सोमसूर्याग्निलोचनः ॥ ५॥ पाशाङ्कुशधरश्चण्डो
    गुणातीतो निरञ्जनः । अकल्मषस्स्वयंसिद्धस्सिद्धार्चितपदाम्बुजः ॥ ६॥ बीजपूरफलासक्तो वरदश्शाश्वतः कृतिः
    । द्विजप्रियो वीतभयो गदी चक्रीक्षुचापधृत् ॥ ७॥ विद्वत्प्रियो श्रीदोऽजोत्पलकरः श्रीपतिः स्तुतिहर्षितः
    । कुलाद्रिभेत्ता जटिलः कलिकल्मषनाशनः ॥ ८॥ चन्द्रचूडामणिः कान्तः पापहारी समाहितः । आश्रितश्श्रीकरस्सौम्यो
    भक्तवाञ्छितदायकः ॥ ९॥ शान्तः कैवल्यसुखदस्सच्चिदानन्दविग्रहः । ज्ञानी दयायुतो दान्तो ब्रह्म द्वेषविवर्जितः
    ॥१०॥ प्रमत्तदैत्यभयदः श्रीकण्ट्ःओ विबुधेश्वरः । रमार्चितोविधिर्नागराजयज्ञोपवीतकः ॥११॥ स्थूलकण्ठः स्वयङ्कर्ता
    सामघोषप्रियः परः । स्थूलतुण्डोऽग्रणीर्धीरो वागीशस्सिद्धिदायकः ॥ १२॥ दूर्वाबिल्वप्रियोऽव्यक्तमूर्तिरद्भुतमूर्तिमान्
    । शैलेन्द्रतनुजोत्सङ्गखेलनोत्सुकमानसः ॥ १३॥ स्वलावण्यसुधासारो जितमन्मथविग्रहः । समस्तजगदाधारो मायी
    मूषकवाहनः ॥१४॥ हृष्टस्तुष्टः प्रसन्नात्मा सर्वसिद्धिप्रदायकः । अष्टोत्तरशतेनैवं नाम्नां विघ्नेश्वरं
    विभुं ॥ १५॥ तुष्टाव शङ्करः पुत्रं त्रिपुरं हन्तुमुत्यतः । यः पूजयेदनेनैव भक्त्या सिद्धिविनायकम् ॥१६॥
    दूर्वादलैर्बिल्वपत्रैः पुष्पैर्वा चन्दनाक्षतैः । सर्वान्कामानवाप्नोति सर्वविघ्नैः प्रमुच्यते ॥ इति
    श्रीविघ्नेश्वराष्टोत्तरशतनामस्तोत्रं सम्पूर्णम् । विनायकाष्टोत्तरशतनामस्तोत्रम्
