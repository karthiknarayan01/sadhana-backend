id: kamakshistotram-3
category: stotram
name:
  english: kamakshistotram 3
  devanagari: कामाक्षीस्तोत्रम् ३
content:
  english: sakshinim kamakshim shubhalakshanaih sulalitam vande maheshapriyam || 5|| onkaranganadipikam
    upanishatprasadaparavatim amnayambudhicandrikam adhatamahpradhvamsahamsaprabham | kancipattanapanjara''ntarashukim
    karunyakallolinim kamakshim shivakamarajamahishim vande maheshapriyam || 6|| hrinkaratmakavarnamatrapathanad
    aindrim shriyam tanvatim cinmatram bhuvaneshvarim anudinam bhikshapradanakshamam | vishvaghaughanivarinim
    vimalinim vishvambharam matrikam kamakshim paripurnacandravadanam vande maheshapriyam || 7|| vagdeviti
    ca yam vadanti munayah kshirabdhikanyeti ca kshonibhrittanayeti ca shrutigiro yam amananti sphutam
    | ekanekaphalapradam bahuvidha''karastanustanvatim kamakshim sakalartibhanjanaparam vande maheshapriyam
    || 8|| mayamadimkaranam trijagatam aradhitanghridvayam anandamritavarirashinilayam vidyam vipashciddhiyam
    | mayamanusharupinim manilasanmadhyam mahamatrikam kamakshim karirajamandagamanam vande maheshapriyam
    || 9|| kanta kamadugha karindragamana kamarivamankaga
  devanagari: साक्षिणीं कामाक्षीं शुभलक्षणैः सुललितां वन्दे महेशप्रियाम् ॥ ५॥ ओङ्काराङ्गणदीपिकां उपनिषत्प्रासादपारावतीम्
    आम्नायाम्बुधिचन्द्रिकां अधतमःप्रध्वंसहंसप्रभाम् । काञ्चीपट्टणपञ्जराऽऽन्तरशुकीं कारुण्यकल्लोलिनीं कामाक्षीं
    शिवकामराजमहिषीं वन्दे महेशप्रियाम् ॥ ६॥ ह्रीङ्कारात्मकवर्णमात्रपठनाद् ऐन्द्रीं श्रियं तन्वतीं चिन्मात्रां
    भुवनेश्वरीं अनुदिनं भिक्षाप्रदानक्षमाम् । विश्वाघौघनिवारिणीं विमलिनीं विश्वम्भरां मातृकां कामाक्षीं
    परिपूर्णचन्द्रवदनां वन्दे महेशप्रियाम् ॥ ७॥ वाग्देवीति च यां वदन्ति मुनयः क्षीराब्धिकन्येति च क्षोणीभृत्तनयेति
    च श्रुतिगिरो यां आमनन्ति स्फुटम् । एकानेकफलप्रदां बहुविधाऽऽकारास्तनूस्तन्वतीं कामाक्षीं सकलार्तिभञ्जनपरां
    वन्दे महेशप्रियाम् ॥ ८॥ मायामादिम्कारणं त्रिजगतां आराधिताङ्घ्रिद्वयाम् आनन्दामृतवारिराशिनिलयां विद्यां
    विपश्चिद्धियाम् । मायामानुषरूपिणीं मणिलसन्मध्यां महामातृकां कामाक्षीं करिराजमन्दगमनां वन्दे महेशप्रियाम्
    ॥ ९॥ कान्ता कामदुघा करीन्द्रगमना कामारिवामाङ्कगा
