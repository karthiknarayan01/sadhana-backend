id: sankshepa-ramayanam
category: stotram
name:
  english: Sankshepa Ramayanam
  devanagari: सङ्क्षेपरामायणम्
content:
  english: shuklambaradharam vishnum shashivarnam caturbhujam prasannavadanam dhyayet sarvavighnopashantaye
    vagishadyah sumanasah sarvarthanamupakrame yam natva kritakrityah syustam namami gajananam gururbrahma
    gururvishnurgururdevo maheshvarah guruh sakshat param brahma tasmai shri sadashivasamarambham shankaracaryamadhyamam
    asmadacaryaparyantam vande guruparamparam akhandamandalakaram vyaptam yena caracaram tatpadam darshitam
    yena tasmai shri dorbhiryukta caturbhih sphatikamaninibhairakshamalam dadhana hastenaikena padmam
    sitamapi ca shukam pustakam caparena bhasa kundendushankhasphatikamaninibha bhasamana'samana sa me
    vagdevateyam nivasatu vadane sarvada suprasanna kujantam rama rameti madhuram madhuraksharam aruhya
    kavitashakham vande valmikikokilam valmikermunisimhasya kavitavanacarinah shrinvan ramakathanadam
    ko na yati param gatim yah piban satatam ramacaritamritasagaram atriptastam munim vande pracetasamakalmasham
    ratnam vande'nilatmajam anjananandanam viram janakishokanashanam kapishamakshahantaram vande lankabhayankaram
    ullanghya sindhoh salilam salilam yah shokavahnim janakatmajayah adaya tenaiva dadaha lankam namami
    tam pranjaliranjaneyam anjaneyamatipatalananam kancanadri vasinam bhavayami pavamana yatra yatra raghunathakirtanam
    tatra tatra kritamastakanjalim bashpavariparipurnalocanam marutim namata rakshasantakam manojavam
    marutatulyavegam jitendriyam buddhimatam varishtham vatatmajam vanarayuthamukhyam shriramadutam shirasa
    namami yah karnanjalisamputairaharahah samyak pibatyadarat valmikervadanaravindagalitam ramayanakhyam
    madhu samsaram sa vihaya gacchati puman vishnoh padam shashvatam raghuvaracaritam munipranitam dashashirasashca
    vadham nishamayadhvam girisambhuta ramasagaragamini punatu bhuvanam punya ramayanamahanadi shlokasarajalakirnam
    sargakallolasankulam kandagrahamahaminam vande ramayanarnavam vedavedye pare pumsi jate dasharathatmaje
    vedah pracetasadasit sakshadramayanatmana vaidehisahitam suradrumatale haime mahamandape madhye pushpakamasane
    manimaye virasane susthitam agre vacayati prabhanjanasute tattvam munibhyah param vyakhyantam bharatadibhih
    parivritam ramam bhaje shyamalam vame bhumisuta purashca hanuman pashcat sumitrasutah shatrughno bharatashca
    parshvadalayorvayvadikoneshu ca sugrivashca vibhishanashca yuvarat tarasuto jambavan madhye nilasarojakomalarucim
    ramam bhaje shyamalam ramam ramanujam sitam bharatam bharatanujam sugrivam vayusunum ca pranamami
    punah punah namo'stu ramaya salakshmanaya devyai ca tasyai janakatmajayai namo'stu rudrendrayamanilebhyo
    namo'stu candrarkamarudganebhyah tapah svadhyayaniratam tapasvi vagvidam varam naradam paripapraccha
    valmikirmunipungavam ko nvasmin sampratam loke gunavan kashca viryavan dharmajnashca kritajnashca
    satyavakyo dridhavratah caritrena ca ko yuktah sarvabhuteshu ko hitah vidvan kah kah samarthashca
    kashcaikapriyadarshanah atmavan ko jitakrodho matiman ko'nasuyakah kasya bibhyati devashca jataroshasya
    samyuge etadicchamyaham shrotum param kautuhalam hi me maharshe tvam samartho'si jnatumevamvidham
    naram shrutva caitat trilokajno valmikernarado vacah shruyatamiti ca''mantrya prahrishto vakyamabravit
    bahavo durlabhashcaiva ye tvaya kirtita gunah mune vakshyamyaham bud dhva tairyuktah shruyatam narah
    ikshvakuvamshaprabhavo ramo nama janaih shrutah niyatatma mahaviryo dyutiman dhritiman vashi buddhiman
    nitiman vagmi shrimanchatrunibarhanah vipulamso mahabahuh kambugrivo mahahanuh mahorasko maheshvaso
    gudhajatrurarindamah ajanubahuh sushirah sulalatah suvikramah samah samavibhaktangah snigdhavarnah
    pratapavan pinavaksha vishalaksho lakshmivanchubhalakshanah dharmajnah satyasandhashca prajanam ca
    hite ratah yashasvi jnanasampannah shucirvashyah samadhiman prajapatisamah shriman dhata ripunishudanah
    rakshita jivalokasya dharmasya parirakshita rakshita svasya dharmasya svajanasya ca rakshita vedavedangatattvajno
    dhanurvede ca nishthitah sarvashastrarthatattvajno smritiman pratibhanavan sarvalokapriyah sadhuradinatma
    vicakshanah sarvada'bhigatah sadbhih samudra iva sindhubhih aryah sarvasamashcaiva sadaiva priyadarshanah
    sa ca sarvagunopetah kausalyanandavardhanah samudra iva gambhirye dhairyena himavaniva vishnuna sadrisho
    virye somavat priyadarshanah kalagnisadrishah krodhe kshamaya prithivisamah dhanadena samastyage satye
    dharma ivaparah tamevangunasampannam ramam satyaparakramam jyeshtham shreshthagunairyuktam priyam
    dasharathah sutam prakritinam hitairyuktam prakritipriyakamyaya yauvarajyena samyoktum aicchat pritya
    mahipatih tasyabhishekasambharan drishtva bharya'tha kaikayi purvam dattavara devi varamenamayacata
    vivasanam ca ramasya bharatasyabhishecanam sa satyavacanadraja dharmapashena samyatah vivasayamasa
    sutam ramam dasharathah priyam sa jagama vanam virah pratijnamanupalayan piturvacananirdeshat kaikeyyah
    priyakaranat tam vrajantam priyo bhrata lakshmano'nujagama ha snehad vinayasampannah sumitranandavardhanah
    bhrataram dayito bhratuh saubhratramanudarshayan ramasya dayita bharya nityam pranasama hita janakasya
    kule jata devamayeva nirmita sarvalakshanasampanna narinamuttama vadhuh sita'pyanugata ramam shashinam
    rohini yatha paurairanugato duram pitra dasharathena ca shringaverapure sutam gangakule vyasarjayat
    guhamasadya dharmatma nishadadhipatim priyam guhena sahito ramo lakshmanena ca sitaya te vanena vanam
    gatva nadistirtva bahudakah citrakutamanuprapya bharadvajasya shasanat ramyamavasatham kritva ramamana
    vane trayah devagandharvasankashastatra te nyavasan sukham citrakutam gate rame putrashokaturastatha
    raja dasharathah svargam jagama vilapan sutam mrite tu tasmin bharato vasishthapramukhairdvijaih niyujyamano
    rajyaya naicchad rajyam mahabalah sa jagama vanam viro ramapadaprasadakah gatva tu sa mahatmanam ramam
    satyaparakramam ayacad bhrataram ramam aryabhavapuraskritah tvameva raja dharmajna iti ramam vaco'bravit
    ramo'pi paramodarah sumukhah sumahayashah na cecchat pituradeshad rajyam ramo mahabalah paduke casya
    rajyaya nyasam dattva punah punah nivartayamasa tato bharatam bharatagrajah sa kamamanavapyaiva ramapadavupasprishan
    nandigrame'karod rajyam ramagamanakankshaya gate tu bharate shriman satyasandho jitendriyah ramastu
    punaralakshya nagarasya janasya ca tatra''gamanamekagro dandakan pravivesha ha pravishya tu maharanyam
    ramo rajivalocanah viradham rakshasam hatva sharabhangam dadarsha ha sutikshnam capyagastyam ca agastyabhrataram
    tatha agastyavacanaccaiva jagrahaindram sharasanam khadgam ca paramapritastuni cakshayasayakau vasatastasya
    ramasya vane vanacaraih saha rishayo'bhyagaman sarve vadhayasurarakshasam sa tesham prati shushrava
    rakshasanam tada vane pratijnatashca ramena vadhah samyati rakshasam rishinamagnikalpanam dandakaranyavasinam
    tena tatraiva vasata janasthananivasini virupita shurpanakha rakshasi kamarupini tatah shurpanakhavakyadudyuktan
    sarvarakshasan kharam trishirasam caiva dushanam caiva rakshasam nijaghana rane ramastesham caiva
    padanugan vane tasmin nivasata janasthananivasinam rakshasam nihatanyasan sahasrani caturdasha tato
    jnativadham shrutva ravanah krodhamurcchitah sahayam varayamasa maricam nama rakshasam varyamanah
    subahusho maricena sa ravanah na virodho balavata kshamo ravana tena te anadritya tu tadvakyam ravanah
    kalacoditah jagama sahamaricastasya''shramapadam tada tena mayavina duramapavahya nripatmajau jahara
    bharyam ramasya gridhram hatva jatayusham gridhram ca nihatam drishtva hritam shrutva ca maithilim
    raghavah shokasantapto vilalapa''kulendriyah tatastenaiva shokena gridhram dagdhva jatayusham margamano
    vane sitam rakshasam sandadarsha ha kabandham nama rupena vikritam ghoradarshanam tam nihatya mahabahurdadaha
    svargatashca sah sa casya kathayamasa shabarim dharmacarinim shramanim dharmanipunam abhigaccheti
    raghava so'bhyagacchan mahatejah shabarim shatrusudanah shabarya pujitah samyag ramo dasharathatmajah
    pampatire hanumata sangato vanarena ha hanumadvacanaccaiva sugrivena samagatah sugrivaya ca tatsarvam
    shamsad ramo mahabalah aditastad yatha vrittam sitayashca visheshatah sugrivashcapi tatsarvam shrutva
    ramasya vanarah cakara sakhyam ramena pritashcaivagnisakshikam tato vanararajena vairanukathanam prati
    ramaya''veditam sarvam pranayadduhkhitena ca pratijnatam ca ramena tada valivadham prati valinashca
    balam tatra kathayamasa vanarah sugrivah shankitashcasinnityam viryena raghave raghavah pratyayartham
    tu dundubheh kayamuttamam darshayamasa sugrivo mahaparvatasannibham utsmayitva mahabahuh prekshya
    casthi mahabalah padangushthena cikshepa sampurnam dashayojanam bibheda ca punah salan saptaikena
    maheshuna girim rasatalam caiva janayan pratyayam tada tatah pritamanastena vishvastah sa mahakapih
    kishkindham ramasahito jagama ca guham tada tato'garjaddharivarah sugrivo hemapingalah tena nadena
    mahata nirjagama harishvarah anumanya tada taram sugrivena samagatah nijaghana ca tatrainam sharenaikena
    raghavah tatah sugrivavacanaddhatva valinamahave sugrivameva tadrajye raghavah pratyapadayat sa ca
    sarvan samaniya vanaran vanararshabhah dishah prasthapayamasa didrikshurjanakatmajam tato gridhrasya
    vacanat sampaterhanuman bali shatayojanavistirnam pupluve lavanarnavam tatra lankam samasadya purim
    ravanapalitam dadarsha sitam dhyayantimashokavanikam gatam nivedayitva'bhijnanam pravrittim vinivedya
    ca samashvasya ca vaidehim mardayamasa toranam panca senagragan hatva sapta mantrisutanapi shuramaksham
    ca nishpishya grahanam samupagamat astrenonmuktamatmanam jnatva paitamahad varat marshayan rakshasan
    viro yantrinastan yadricchaya tato dagdhva purim lankam rite sitam ca maithilim ramaya priyamakhyatum
    punarayan mahakapih so'bhigamya mahatmanam kritva ramam pradakshinam nyavedayadameyatma drishta siteti
    tattvatah tatah sugrivasahito gatva tiram mahodadheh samudram kshobhayamasa sharairadityasannibhaih
    darshayamasa ca''tmanam samudrah saritam patih samudravacanaccaiva nalam setumakarayat tena gatva
    purim lankam hatva ravanamahave ramah sitamanuprapya param vridamupagamat tamuvaca tato ramah parusham
    janasamsadi amrishyamana sa sita vivesha jvalanam sati tato'gnivacanat sitam jnatva vigatakalmasham
    karmana tena mahata trailokyam sacaracaram sadevarshiganam tushtam raghavasya mahatmanah babhau ramah
    samprahrishtah pujitah sarvadaivataih abhishicya ca lankayam rakshasendram vibhishanam kritakrityastada
    ramo vijvarah pramumoda ha devatabhyo varan prapya samutthapya ca vanaran ayodhyam prasthito ramah
    pushpakena suhrid bharadvajashramam gatva ramah satyaparakramah bharatasyantike ramo hanumantam vyasarjayat
    punarakhyayikam jalpan sugrivasahitastada pushpakam tat samaruhya nandigramam yayau tada nandigrame
    jatam hitva bhratribhih sahito'naghah ramah sitamanuprapya rajyam punaravaptavan prahrishtamudito
    lokastushtah pushtah sudharmikah niramayo hyarogashca durbhikshabhayavarjitah na putramaranam kecid
    drakshyanti purushah kvacit naryashcavidhava nityam bhavishyanti pativratah na cagnijam bhayam kincinnapsu
    majjanti jantavah na vatajam bhayam kincinnapi jvarakritam tatha na capi kshudbhayam tatra na taskarabhayam
    tatha nagarani ca rashtrani dhanadhanyayutani ca nityam pramuditah sarve yatha kritayuge tatha ashvamedhashatairishtva
    tatha bahusuvarnakaih gavam kotyayutam dattva vidvad asankhyeyam dhanam dattva brahmanebhyo mahayashah
    rajavamshanchatagunan sthapayishyati raghavah caturvarnyam ca loke'smin sve sve dharme niyokshyati
    dashavarshasahasrani dashavarshashatani ca ramo rajyamupasitva brahmalokam gamishyati idam pavitram
    papaghnam punyam vedaishca sammitam yah pathedramacaritam sarvapapaih pramucyate etadakhyanamayushyam
    pathan ramayanam narah saputrapautrah saganah pretya svarge mahiyate pathan dvijo vagrishabhatvamiyat
    syat kshatriyo bhumipatitvamiyat vanigjanah panyaphalatvamiyat janashca shudro'pi mahattvamiyat ||ityarshe
    shrimadramayane valmikiye adikavye balakande prathamah sargah|| svasti prajabhyah paripalayantam nyayena
    margena mahim mahishah gobrahmanebhyah shubhamastu nityam lokah samastah sukhino bhavantu kale varshatu
    parjanyah prithivi sasyashalini desho'yam kshobharahito brahmanah santu nirbhayah aputrah putrinah
    santu putrinah santu pautrinah adhanah sadhanah santu jivantu sharadam shatam caritam raghunathasya
    shatakoti ekaikamaksharam pumsam mahapatakanashanam shrinvan ramayanam bhaktya yah padam padameva
    va sa yati brahmanah sthanam brahmana pujyate sada ramaya ramabhadraya ramacandraya vedhase raghunathaya
    nathaya sitayah pataye namah yanmangalam sahasrakshe sarvadevanamaskrite vritranashe samabhavat tatte
    bhavatu mangalam yanmangalam suparnasya vinata'kalpayat pura amritam prarthayanasya tatte bhavatu
    mangalam amritotpadane daityan ghnato vajradharasya yat aditirmangalam pradat tatte bhavatu mangalam
    trin vikraman prakramato vishnoramitatejasah yadasinmangalam rama tatte bhavatu mangalam rishayah
    sagara dvipa veda loka dishashca te mangalani mahabaho dishantu tava sarvada mangalam kosalendraya
    mahaniyagunatmane cakravartitanujaya sarvabhaumaya mangalam kayena vaca manasendriyairva dhya''tmana
    va prakriteh svabhavat karomi yadyat sakalam parasmai narayanayeti samarpayami
  devanagari: शुक्लाम्बरधरं विष्णुं शशिवर्णं चतुर्भुजम् प्रसन्नवदनं ध्यायेत् सर्वविघ्नोपशान्तये वागीशाद्याः
    सुमनसः सर्वार्थानामुपक्रमे यं नत्वा कृतकृत्याः स्युस्तं नमामि गजाननम् गुरुर्ब्रह्मा गुरुर्विष्णुर्गुरुर्देवो
    महेश्वरः गुरुः साक्षात् परं ब्रह्म तस्मै श्री सदाशिवसमारम्भां शङ्कराचार्यमध्यमाम् अस्मदाचार्यपर्यन्तां
    वन्दे गुरुपरम्पराम् अखण्डमण्डलाकारं व्याप्तं येन चराचरम् तत्पदं दर्शितं येन तस्मै श्री दोर्भिर्युक्ता
    चतुर्भिः स्फटिकमणिनिभैरक्षमालां दधाना हस्तेनैकेन पद्मं सितमपि च शुकं पुस्तकं चापरेण भासा कुन्देन्दुशङ्खस्फटिकमणिनिभा
    भासमानाऽसमाना सा मे वाग्देवतेयं निवसतु वदने सर्वदा सुप्रसन्ना कूजन्तं राम रामेति मधुरं मधुराक्षरम्
    आरुह्य कविताशाखां वन्दे वाल्मीकिकोकिलम् वाल्मीकेर्मुनिसिंहस्य कवितावनचारिणः शृण्वन् रामकथानादं को
    न याति परां गतिम् यः पिबन् सततं रामचरितामृतसागरम् अतृप्तस्तं मुनिं वन्दे प्राचेतसमकल्मषम् रत्नं वन्देऽनिलात्मजम्
    अञ्जनानन्दनं वीरं जानकीशोकनाशनम् कपीशमक्षहन्तारं वन्दे लङ्काभयङ्करम् उल्लङ्घ्य सिन्धोः सलिलं सलीलं
    यः शोकवह्निं जनकात्मजायाः आदाय तेनैव ददाह लङ्कां नमामि तं प्राञ्जलिराञ्जनेयम् आञ्जनेयमतिपाटलाननं काञ्चनाद्रि
    वासिनं भावयामि पवमान यत्र यत्र रघुनाथकीर्तनं तत्र तत्र कृतमस्तकाञ्जलिम् बाष्पवारिपरिपूर्णलोचनं मारुतिं
    नमत राक्षसान्तकम् मनोजवं मारुततुल्यवेगं जितेन्द्रियं बुद्धिमतां वरिष्ठम् वातात्मजं वानरयूथमुख्यं श्रीरामदूतं
    शिरसा नमामि यः कर्णाञ्जलिसम्पुटैरहरहः सम्यक् पिबत्यादरात् वाल्मीकेर्वदनारविन्दगलितं रामायणाख्यं मधु
    संसारं स विहाय गच्छति पुमान् विष्णोः पदं शाश्वतम् रघुवरचरितं मुनिप्रणीतं दशशिरसश्च वधं निशामयध्वम्
    गिरिसम्भूता रामसागरगामिनी पुनातु भुवनं पुण्या रामायणमहानदी श्लोकसारजलाकीर्णं सर्गकल्लोलसङ्कुलम् काण्डग्राहमहामीनं
    वन्दे रामायणार्णवम् वेदवेद्ये परे पुंसि जाते दशरथात्मजे वेदः प्राचेतसादासीत् साक्षाद्रामायणात्मना
    वैदेहीसहितं सुरद्रुमतले हैमे महामण्डपे मध्ये पुष्पकमासने मणिमये वीरासने सुस्थितम् अग्रे वाचयति प्रभञ्जनसुते
    तत्त्वं मुनिभ्यः परं व्याख्यान्तं भरतादिभिः परिवृतं रामं भजे श्यामलम् वामे भूमिसुता पुरश्च हनुमान्
    पश्चात् सुमित्रासुतः शत्रुघ्नो भरतश्च पार्श्वदलयोर्वाय्वादिकोणेषु च सुग्रीवश्च विभीषणश्च युवराट् तारासुतो
    जाम्बवान् मध्ये नीलसरोजकोमलरुचिं रामं भजे श्यामलम् रामं रामानुजं सीतां भरतं भरतानुजम् सुग्रीवं वायुसूनुं
    च प्रणमामि पुनः पुनः नमोऽस्तु रामाय सलक्ष्मणाय देव्यै च तस्यै जनकात्मजायै नमोऽस्तु रुद्रेन्द्रयमानिलेभ्यो
    नमोऽस्तु चन्द्रार्कमरुद्गणेभ्यः तपः स्वाध्यायनिरतं तपस्वी वाग्विदां वरम् नारदं परिपप्रच्छ वाल्मीकिर्मुनिपुङ्गवम्
    को न्वस्मिन् साम्प्रतं लोके गुणवान् कश्च वीर्यवान् धर्मज्ञश्च कृतज्ञश्च सत्यवाक्यो दृढव्रतः चारित्रेण
    च को युक्तः सर्वभूतेषु को हितः विद्वान् कः कः समर्थश्च कश्चैकप्रियदर्शनः आत्मवान् को जितक्रोधो मतिमान्
    कोऽनसूयकः कस्य बिभ्यति देवाश्च जातरोषस्य संयुगे एतदिच्छाम्यहं श्रोतुं परं कौतूहलं हि मे महर्षे त्वं
    समर्थोऽसि ज्ञातुमेवंविधं नरम् श्रुत्वा चैतत् त्रिलोकज्ञो वाल्मीकेर्नारदो वचः श्रूयतामिति चाऽऽमन्त्र्य
    प्रहृष्टो वाक्यमब्रवीत् बहवो दुर्लभाश्चैव ये त्वया कीर्तिता गुणाः मुने वक्ष्याम्यहं बुद् ध्वा तैर्युक्तः
    श्रूयतां नरः इक्ष्वाकुवंशप्रभवो रामो नाम जनैः श्रुतः नियतात्मा महावीर्यो द्युतिमान् धृतिमान् वशी बुद्धिमान्
    नीतिमान् वाग्मी श्रीमाञ्छत्रुनिबर्हणः विपुलांसो महाबाहुः कम्बुग्रीवो महाहनुः महोरस्को महेष्वासो गूढजत्रुररिन्दमः
    आजानुबाहुः सुशिराः सुललाटः सुविक्रमः समः समविभक्ताङ्गः स्निग्धवर्णः प्रतापवान् पीनवक्षा विशालाक्षो
    लक्ष्मीवाञ्छुभलक्षणः धर्मज्ञः सत्यसन्धश्च प्रजानां च हिते रतः यशस्वी ज्ञानसम्पन्नः शुचिर्वश्यः समाधिमान्
    प्रजापतिसमः श्रीमान् धाता रिपुनिषूदनः रक्षिता जीवलोकस्य धर्मस्य परिरक्षिता रक्षिता स्वस्य धर्मस्य
    स्वजनस्य च रक्षिता वेदवेदाङ्गतत्त्वज्ञो धनुर्वेदे च निष्ठितः सर्वशास्त्रार्थतत्त्वज्ञो स्मृतिमान्
    प्रतिभानवान् सर्वलोकप्रियः साधुरदीनात्मा विचक्षणः सर्वदाऽभिगतः सद्भिः समुद्र इव सिन्धुभिः आर्यः सर्वसमश्चैव
    सदैव प्रियदर्शनः स च सर्वगुणोपेतः कौसल्यानन्दवर्धनः समुद्र इव गाम्भीर्ये धैर्येण हिमवानिव विष्णुना
    सदृशो वीर्ये सोमवत् प्रियदर्शनः कालाग्निसदृशः क्रोधे क्षमया पृथिवीसमः धनदेन समस्त्यागे सत्ये धर्म
    इवापरः तमेवङ्गुणसम्पन्नं रामं सत्यपराक्रमम् ज्येष्ठं श्रेष्ठगुणैर्युक्तं प्रियं दशरथः सुतम् प्रकृतीनां
    हितैर्युक्तं प्रकृतिप्रियकाम्यया यौवराज्येन संयोक्तुम् ऐच्छत् प्रीत्या महीपतिः तस्याभिषेकसम्भारान्
    दृष्ट्वा भार्याऽथ कैकयी पूर्वं दत्तवरा देवी वरमेनमयाचत विवासनं च रामस्य भरतस्याभिषेचनम् स सत्यवचनाद्राजा
    धर्मपाशेन संयतः विवासयामास सुतं रामं दशरथः प्रियम् स जगाम वनं वीरः प्रतिज्ञामनुपालयन् पितुर्वचननिर्देशात्
    कैकेय्याः प्रियकारणात् तं व्रजन्तं प्रियो भ्राता लक्ष्मणोऽनुजगाम ह स्नेहाद् विनयसम्पन्नः सुमित्रानन्दवर्धनः
    भ्रातरं दयितो भ्रातुः सौभ्रात्रमनुदर्शयन् रामस्य दयिता भार्या नित्यं प्राणसमा हिता जनकस्य कुले जाता
    देवमायेव निर्मिता सर्वलक्षणसम्पन्ना नारीणामुत्तमा वधूः सीताऽप्यनुगता रामं शशिनं रोहिणी यथा पौरैरनुगतो
    दूरं पित्रा दशरथेन च शृङ्गवेरपुरे सूतं गङ्गाकूले व्यसर्जयत् गुहमासाद्य धर्मात्मा निषादाधिपतिं प्रियम्
    गुहेन सहितो रामो लक्ष्मणेन च सीतया ते वनेन वनं गत्वा नदीस्तीर्त्वा बहूदकाः चित्रकूटमनुप्राप्य भरद्वाजस्य
    शासनात् रम्यमावसथं कृत्वा रममाणा वने त्रयः देवगन्धर्वसङ्काशास्तत्र ते न्यवसन् सुखम् चित्रकूटं गते
    रामे पुत्रशोकातुरस्तथा राजा दशरथः स्वर्गं जगाम विलपन् सुतम् मृते तु तस्मिन् भरतो वसिष्ठप्रमुखैर्द्विजैः
    नियुज्यमानो राज्याय नैच्छद् राज्यं महाबलः स जगाम वनं वीरो रामपादप्रसादकः गत्वा तु स महात्मानं रामं
    सत्यपराक्रमम् अयाचद् भ्रातरं रामम् आर्यभावपुरस्कृतः त्वमेव राजा धर्मज्ञ इति रामं वचोऽब्रवीत् रामोऽपि
    परमोदारः सुमुखः सुमहायशाः न चेच्छत् पितुरादेशाद् राज्यं रामो महाबलः पादुके चास्य राज्याय न्यासं दत्त्वा
    पुनः पुनः निवर्तयामास ततो भरतं भरताग्रजः स काममनवाप्यैव रामपादावुपस्पृशन् नन्दिग्रामेऽकरोद् राज्यं
    रामागमनकाङ्क्षया गते तु भरते श्रीमान् सत्यसन्धो जितेन्द्रियः रामस्तु पुनरालक्ष्य नागरस्य जनस्य च तत्राऽऽगमनमेकाग्रो
    दण्डकान् प्रविवेश ह प्रविश्य तु महारण्यं रामो राजीवलोचनः विराधं राक्षसं हत्वा शरभङ्गं ददर्श ह सुतीक्ष्णं
    चाप्यगस्त्यं च अगस्त्यभ्रातरं तथा अगस्त्यवचनाच्चैव जग्राहैन्द्रं शरासनम् खड्गं च परमप्रीतस्तूणी चाक्षयसायकौ
    वसतस्तस्य रामस्य वने वनचरैः सह ऋषयोऽभ्यागमन् सर्वे वधायासुररक्षसाम् स तेषां प्रति शुश्राव राक्षसानां
    तदा वने प्रतिज्ञातश्च रामेण वधः संयति रक्षसाम् ऋषीणामग्निकल्पानां दण्डकारण्यवासिनाम् तेन तत्रैव वसता
    जनस्थाननिवासिनी विरूपिता शूर्पणखा राक्षसी कामरूपिणी ततः शूर्पणखावाक्यादुद्युक्तान् सर्वराक्षसान् खरं
    त्रिशिरसं चैव दूषणं चैव राक्षसम् निजघान रणे रामस्तेषां चैव पदानुगान् वने तस्मिन् निवसता जनस्थाननिवासिनाम्
    रक्षसां निहतान्यासन् सहस्राणि चतुर्दश ततो ज्ञातिवधं श्रुत्वा रावणः क्रोधमूर्च्छितः सहायं वरयामास मारीचं
    नाम राक्षसम् वार्यमाणः सुबहुशो मारीचेन स रावणः न विरोधो बलवता क्षमो रावण तेन ते अनादृत्य तु तद्वाक्यं
    रावणः कालचोदितः जगाम सहमारीचस्तस्याऽऽश्रमपदं तदा तेन मायाविना दूरमपवाह्य नृपात्मजौ जहार भार्यां रामस्य
    गृध्रं हत्वा जटायुषम् गृध्रं च निहतं दृष्ट्वा हृतां श्रुत्वा च मैथिलीम् राघवः शोकसन्तप्तो विललापाऽऽकुलेन्द्रियः
    ततस्तेनैव शोकेन गृध्रं दग्ध्वा जटायुषम् मार्गमाणो वने सीतां राक्षसं सन्ददर्श ह कबन्धं नाम रूपेण विकृतं
    घोरदर्शनम् तं निहत्य महाबाहुर्ददाह स्वर्गतश्च सः स चास्य कथयामास शबरीं धर्मचारिणीम् श्रमणीं धर्मनिपुणाम्
    अभिगच्छेति राघव सोऽभ्यगच्छन् महातेजाः शबरीं शत्रुसूदनः शबर्या पूजितः सम्यग् रामो दशरथात्मजः पम्पातीरे
    हनुमता सङ्गतो वानरेण ह हनुमद्वचनाच्चैव सुग्रीवेण समागतः सुग्रीवाय च तत्सर्वं शंसद् रामो महाबलः आदितस्तद्
    यथा वृत्तं सीतायाश्च विशेषतः सुग्रीवश्चापि तत्सर्वं श्रुत्वा रामस्य वानरः चकार सख्यं रामेण प्रीतश्चैवाग्निसाक्षिकम्
    ततो वानरराजेन वैरानुकथनं प्रति रामायाऽऽवेदितं सर्वं प्रणयाद्दुःखितेन च प्रतिज्ञातं च रामेण तदा वालिवधं
    प्रति वालिनश्च बलं तत्र कथयामास वानरः सुग्रीवः शङ्कितश्चासीन्नित्यं वीर्येण राघवे राघवः प्रत्ययार्थं
    तु दुन्दुभेः कायमुत्तमम् दर्शयामास सुग्रीवो महापर्वतसन्निभम् उत्स्मयित्वा महाबाहुः प्रेक्ष्य चास्थि
    महाबलः पादाङ्गुष्ठेन चिक्षेप सम्पूर्णं दशयोजनम् बिभेद च पुनः सालान् सप्तैकेन महेषुणा गिरिं रसातलं
    चैव जनयन् प्रत्ययं तदा ततः प्रीतमनास्तेन विश्वस्तः स महाकपिः किष्किन्धां रामसहितो जगाम च गुहां तदा
    ततोऽगर्जद्धरिवरः सुग्रीवो हेमपिङ्गलः तेन नादेन महता निर्जगाम हरीश्वरः अनुमान्य तदा तारां सुग्रीवेण
    समागतः निजघान च तत्रैनं शरेणैकेन राघवः ततः सुग्रीववचनाद्धत्वा वालिनमाहवे सुग्रीवमेव तद्राज्ये राघवः
    प्रत्यपादयत् स च सर्वान् समानीय वानरान् वानरर्षभः दिशः प्रस्थापयामास दिदृक्षुर्जनकात्मजाम् ततो गृध्रस्य
    वचनात् सम्पातेर्हनुमान् बली शतयोजनविस्तीर्णं पुप्लुवे लवणार्णवम् तत्र लङ्कां समासाद्य पुरीं रावणपालिताम्
    ददर्श सीतां ध्यायन्तीमशोकवनिकां गताम् निवेदयित्वाऽभिज्ञानं प्रवृत्तिं विनिवेद्य च समाश्वास्य च वैदेहीं
    मर्दयामास तोरणम् पञ्च सेनाग्रगान् हत्वा सप्त मन्त्रिसुतानपि शूरमक्षं च निष्पिष्य ग्रहणं समुपागमत्
    अस्त्रेणोन्मुक्तमात्मानं ज्ञात्वा पैतामहाद् वरात् मर्षयन् राक्षसान् वीरो यन्त्रिणस्तान् यदृच्छया ततो
    दग्ध्वा पुरीं लङ्काम् ऋते सीतां च मैथिलीम् रामाय प्रियमाख्यातुं पुनरायान् महाकपिः सोऽभिगम्य महात्मानं
    कृत्वा रामं प्रदक्षिणम् न्यवेदयदमेयात्मा दृष्टा सीतेति तत्त्वतः ततः सुग्रीवसहितो गत्वा तीरं महोदधेः
    समुद्रं क्षोभयामास शरैरादित्यसन्निभैः दर्शयामास चाऽऽत्मानं समुद्रः सरितां पतिः समुद्रवचनाच्चैव नलं
    सेतुमकारयत् तेन गत्वा पुरीं लङ्कां हत्वा रावणमाहवे रामः सीतामनुप्राप्य परां व्रीडामुपागमत् तामुवाच
    ततो रामः परुषं जनसंसदि अमृष्यमाणा सा सीता विवेश ज्वलनं सती ततोऽग्निवचनात् सीतां ज्ञात्वा विगतकल्मषाम्
    कर्मणा तेन महता त्रैलोक्यं सचराचरम् सदेवर्षिगणं तुष्टं राघवस्य महात्मनः बभौ रामः सम्प्रहृष्टः पूजितः
    सर्वदैवतैः अभिषिच्य च लङ्कायां राक्षसेन्द्रं विभीषणम् कृतकृत्यस्तदा रामो विज्वरः प्रमुमोद ह देवताभ्यो
    वरान् प्राप्य समुत्थाप्य च वानरान् अयोध्यां प्रस्थितो रामः पुष्पकेण सुहृद् भरद्वाजाश्रमं गत्वा रामः
    सत्यपराक्रमः भरतस्यान्तिके रामो हनूमन्तं व्यसर्जयत् पुनराख्यायिकां जल्पन् सुग्रीवसहितस्तदा पुष्पकं
    तत् समारुह्य नन्दिग्रामं ययौ तदा नन्दिग्रामे जटां हित्वा भ्रातृभिः सहितोऽनघः रामः सीतामनुप्राप्य राज्यं
    पुनरवाप्तवान् प्रहृष्टमुदितो लोकस्तुष्टः पुष्टः सुधार्मिकः निरामयो ह्यरोगश्च दुर्भिक्षभयवर्जितः न
    पुत्रमरणं केचिद् द्रक्ष्यन्ति पुरुषाः क्वचित् नार्यश्चाविधवा नित्यं भविष्यन्ति पतिव्रताः न चाग्निजं
    भयं किञ्चिन्नाप्सु मज्जन्ति जन्तवः न वातजं भयं किञ्चिन्नापि ज्वरकृतं तथा न चापि क्षुद्भयं तत्र न तस्करभयं
    तथा नगराणि च राष्ट्राणि धनधान्ययुतानि च नित्यं प्रमुदिताः सर्वे यथा कृतयुगे तथा अश्वमेधशतैरिष्ट्वा
    तथा बहुसुवर्णकैः गवां कोट्ययुतं दत्त्वा विद्वद् असङ्ख्येयं धनं दत्त्वा ब्राह्मणेभ्यो महायशाः राजवंशाञ्छतगुणान्
    स्थापयिष्यति राघवः चातुर्वर्ण्यं च लोकेऽस्मिन् स्वे स्वे धर्मे नियोक्ष्यति दशवर्षसहस्राणि दशवर्षशतानि
    च रामो राज्यमुपासित्वा ब्रह्मलोकं गमिष्यति इदं पवित्रं पापघ्नं पुण्यं वेदैश्च सम्मितम् यः पठेद्रामचरितं
    सर्वपापैः प्रमुच्यते एतदाख्यानमायुष्यं पठन् रामायणं नरः सपुत्रपौत्रः सगणः प्रेत्य स्वर्गे महीयते पठन्
    द्विजो वागृषभत्वमीयात् स्यात् क्षत्रियो भूमिपतित्वमीयात् वणिग्जनः पण्यफलत्वमीयात् जनश्च शूद्रोऽपि
    महत्त्वमीयात् ॥इत्यार्षे श्रीमद्रामायणे वाल्मीकीये आदिकाव्ये बालकाण्डे प्रथमः सर्गः॥ स्वस्ति प्रजाभ्यः
    परिपालयन्तां न्यायेन मार्गेण महीं महीशाः गोब्राह्मणेभ्यः शुभमस्तु नित्यं लोकाः समस्ताः सुखिनो भवन्तु
    काले वर्षतु पर्जन्यः पृथिवी सस्यशालिनी देशोऽयं क्षोभरहितो ब्राह्मणाः सन्तु निर्भयाः अपुत्राः पुत्रिणः
    सन्तु पुत्रिणः सन्तु पौत्रिणः अधनाः सधनाः सन्तु जीवन्तु शरदां शतम् चरितं रघुनाथस्य शतकोटि एकैकमक्षरं
    पुंसां महापातकनाशनम् शृण्वन् रामायणं भक्त्या यः पादं पदमेव वा स याति ब्रह्मणः स्थानं ब्रह्मणा पूज्यते
    सदा रामाय रामभद्राय रामचन्द्राय वेधसे रघुनाथाय नाथाय सीतायाः पतये नमः यन्मङ्गलं सहस्राक्षे सर्वदेवनमस्कृते
    वृत्रनाशे समभवत् तत्ते भवतु मङ्गलम् यन्मङ्गलं सुपर्णस्य विनताऽकल्पयत् पुरा अमृतं प्रार्थयानस्य तत्ते
    भवतु मङ्गलम् अमृतोत्पादने दैत्यान् घ्नतो वज्रधरस्य यत् अदितिर्मङ्गलं प्रादात् तत्ते भवतु मङ्गलम् त्रीन्
    विक्रमान् प्रक्रमतो विष्णोरमिततेजसः यदासीन्मङ्गलं राम तत्ते भवतु मङ्गलम् ऋषयः सागरा द्वीपा वेदा लोका
    दिशश्च ते मङ्गलानि महाबाहो दिशन्तु तव सर्वदा मङ्गलं कोसलेन्द्राय महनीयगुणात्मने चक्रवर्तितनूजाय सार्वभौमाय
    मङ्गलम् कायेन वाचा मनसेन्द्रियैर्वा ध्याऽऽत्मना वा प्रकृतेः स्वभावात् करोमि यद्यत् सकलं परस्मै नारायणायेति
    समर्पयामि
