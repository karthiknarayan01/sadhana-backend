id: navagrahamantrah-2
category: mantra
name:
  english: navagrahamantrah
  devanagari: नवग्रहमन्त्रः
content:
  english: tripuratilake om hrim shrim khrim aim glaum grahadhipataye brihaspataye brimthah aimthah shrimthah
    svaha || 5|| atha shukrasya mantrah
  devanagari: त्रिपुरातिलके ॐ ह्रीं श्रीं ख्रीं ऐं ग्लौं ग्रहाधिपतये बृहस्पतये ब्रींठः ऐंठः श्रींठः स्वाहा
    ॥ ५॥ अथ शुक्रस्य मन्त्रः
meaning: {}
