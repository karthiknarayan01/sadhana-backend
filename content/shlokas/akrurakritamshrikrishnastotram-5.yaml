id: akrurakritamshrikrishnastotram-5
category: stotram
name:
  english: akrurakritamshrikrishnastotram 5
  devanagari: अक्रूरकृतंश्रीकृष्णस्तोत्रम् ५
content:
  english: akrurakritam 5 shrikrishnastotram yuvam pradhanapurushau jagaddhetu jaganmayau | bhavadbhyam
    na vina kincitparamasti na caparam || 18|| atmasrishtamidam vishvamanvavishya svashaktibhih | iyate
    bahudha brahman shrutapratyakshagocaram || 19|| yatha hi bhuteshu caracareshu mahyadayo yonishu bhanti
    nana | evam bhavan kevala atmayoni
  devanagari: अक्रूरकृतं ५ श्रीकृष्णस्तोत्रम् युवां प्रधानपुरुषौ जगद्धेतू जगन्मयौ । भवद्भ्यां न विना किञ्चित्परमस्ति
    न चापरम् ॥ १८॥ आत्मसृष्टमिदं विश्वमन्वाविश्य स्वशक्तिभिः । ईयते बहुधा ब्रह्मन् श्रुतप्रत्यक्षगोचरम्
    ॥ १९॥ यथा हि भूतेषु चराचरेषु मह्यादयो योनिषु भान्ति नाना । एवं भवान् केवल आत्मयोनि
meaning: {}
