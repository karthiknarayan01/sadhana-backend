id: shriraghunathashtakam
category: stotram
name:
  english: shriraghunathashtakam
  devanagari: श्रीरघुनाथाष्टकम्
content:
  english: shriraghunathashtakam shri ganeshaya namah | shunasiradhishairavanitalajnaptiditagunam prakritya'jam
    jatam tapanakulacandamshumaparam | site vriddhim taradhipatimiva yantam nijagrihe sasitam sanandam
    pranata raghunatham suranutam || 1|| nihantaram shaivam dhanuriva ivekshum nripagane pathi jyakrishtena
    prabalabhriguvaryasya shamanam | viharam garhasthyam tadanu bhajamanam suvimalam sasitam sanandam
    pranata raghunatham suranutam || 2|| gurorajnam nitva vanamanugatam darasahitam sasaumitrim tyaktvepsitamapi
    suranam nripasukham | virupadrakshasyah priyavirahasantapamanasam sasitam sanandam pranata raghunatham
    suranutam || 3|| viradham svarnitva tadanu ca kabandham suraripum gatam pampatire pavanasutasammelanasukham
    | gatam kishkindhayam viditagunasugrivasacivam sasitam sanandam pranata raghunatham suranutam || 4||
    priyaprekshotkantham jalanidhigatam vanarayutam jale setum baddhva'surakula nihantaramanagham | vishuddhamardhangim
    hutabhuji samikshantamacalam sasitam sanandam pranata raghunatham suranutam || 5|| vimanam caruhya'nujajanakajasevitapada
    mayodhyayam gatva nripapadamavaptaramajaram | suyajnaistriptaram nijamukhasuran shantamanasam sasitam
    sanandam pranata raghunatham suranutam || 6|| prajam samsthataram vihitanijadharme shrutipatham sadacaram
    vedoditamapi ca kartaramakhilam | nrishu premodrekam nikhilamanujanam hitakaram satitam sanandam pranata
    raghunatham suranutam || 7|| tamah kirtyasheshah shravanagadanabhyam dvijamukhastarishyanti jnatva
    jagati khalu gantaramajanam || atastam samsthapya svapuramanunetaramakhilam sasitam sanandam pranata
    raghunatham suranutam || 8|| raghunathashtakam hridyam raghunathena nirmitam | pathatam paparashighnam
    bhuktimuktipradayakam || 9|| || iti pandita shrishivadattamishrashastri viracitam shriraghunathashtakam
    sampurnam ||
  devanagari: श्रीरघुनाथाष्टकम् श्री गणेशाय नमः । शुनासीराधीशैरवनितलज्ञप्तीडितगुणं प्रकृत्याऽजं जातं तपनकुलचण्डांशुमपरम्
    । सिते वृद्धिं ताराधिपतिमिव यन्तं निजगृहे ससीतं सानन्दं प्रणत रघुनाथं सुरनुतम् ॥ १॥ निहन्तारं शैवं
    धनुरिव इवेक्षुं नृपगणे पथि ज्याकृष्टेन प्रबलभृगुवर्यस्य शमनम् । विहारं गार्हस्थ्यं तदनु भजमानं सुविमलं
    ससीतं सानन्दं प्रणत रघुनाथं सुरनुतम् ॥ २॥ गुरोराज्ञां नीत्वा वनमनुगतं दारसहितं ससौमित्रिं त्यक्त्वेप्सितमपि
    सुराणां नृपसुखम् । विरुपाद्राक्षस्याः प्रियविरहसन्तापमनसं ससीतं सानन्दं प्रणत रघुनाथं सुरनुतम् ॥ ३॥
    विराधं स्वर्नीत्वा तदनु च कबन्धं सुररिपुं गतं पम्पातीरे पवनसुतसम्मेलनसुखम् । गतं किष्किन्धायां विदितगुणसुग्रीवसचिवं
    ससीतं सानन्दं प्रणत रघुनाथं सुरनुतम् ॥ ४॥ प्रियाप्रेक्षोत्कण्ठं जलनिधिगतं वानरयुतं जले सेतुं बद्ध्वाऽसुरकुल
    निहन्तारमनघम् । विशुद्धामर्धाङ्गीं हुतभुजि समीक्षन्तमचलं ससीतं सानन्दं प्रणत रघुनाथं सुरनुतम् ॥ ५॥
    विमानं चारुह्याऽनुजजनकजासेवितपद मयोध्यायां गत्वा नृपपदमवाप्तारमजरम् । सुयज्ञैस्तृप्तारं निजमुखसुरान्
    शान्तमनसं ससीतं सानन्दं प्रणत रघुनाथं सुरनुतम् ॥ ६॥ प्रजां संस्थातारं विहितनिजधर्मे श्रुतिपथं सदाचारं
    वेदोदितमपि च कर्तारमखिलम् । नृषु प्रेमोद्रेकं निखिलमनुजानां हितकरं सतीतं सानन्दं प्रणत रघुनाथं सुरनुतम्
    ॥ ७॥ तमः कीर्त्याशेषाः श्रवणगदनाभ्यां द्विजमुखास्तरिष्यन्ति ज्ञात्वा जगति खलु गन्तारमजनम् ॥ अतस्तां
    संस्थाप्य स्वपुरमनुनेतारमखिलं ससीतं सानन्दं प्रणत रघुनाथं सुरनुतम् ॥ ८॥ रघुनाथाष्टकं हृद्यं रघुनाथेन
    निर्मितम् । पठतां पापराशिघ्नं भुक्तिमुक्तिप्रदायकम् ॥ ९॥ ॥ इति पण्डित श्रीशिवदत्तमिश्रशास्त्रि विरचितं
    श्रीरघुनाथाष्टकं सम्पूर्णम् ॥
