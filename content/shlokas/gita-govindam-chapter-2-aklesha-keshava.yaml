id: gita-govindam-chapter-2-aklesha-keshava
category: stotram
name:
  english: Gita Govindam Chapter 2 - Aklesha Keshava
content:
  english: '|| dvitiyah sargah || || akleshakeshavah || viharati vane radha sadharanapranaye harau vigalitanijotkarshadirshyavashena
    gatanyatah | kvacidapi latakunje gunjanmadhuvratamandali mukharashikhare lina dinapyuvaca rahah sakhim
    || || sancaradadharasudhamadhuradhvanimukharitamohanavamsham | calitadrigancalacancalamaulikapolavilolavatamsam
    || rase harimiha vihitavilasam smarati mano mama kritaparihasam || || candrakacarumayurashikhandakamandalavalayitakesham
    | pracurapurandaradhanuranuranjitameduramudirasuvesham || || gopakadambanitambavatimukhacumbanalambhitalobham
    | bandhujivamadhuradharapallavamullasitasmitashobham || || vipulapulakabhujapallavavalayitavallavayuvatisahasram
    | karacaranorasi maniganabhushanakiranavibhinnatamisram || || jaladapatalavaladinduvinandakacandanatilakalalatam
    | pinapayodharaparisaramardananirdayahridayakavatam || || manimayamakaramanoharakundalamanditagandamudaram
    | pitavasanamanugatamunimanujasurasuravaraparivaram || || vishadakadambatale militam kalikalushabhayam
    shamayantam | mamapi kimapi tarangadanangadrisha manasa ramayantam || || shrijayadevabhanitamatisundaramohanamadhuripurupam
    | haricaranasmaranam prati samprati punyavatamanurupam || || ganayati gunagramam bhamam bhramadapi
    nehate vahati ca paritosham dosham vimuncati duratah | yuvatishu valastrishne krishne viharini mam
    vina punarapi mano vamam kamam karoti karomi kim || || nibhritanikunjagriham gataya nishi rahasi niliya
    vasantam | cakitavilokitasakaladisha ratirabhasarasena hasantam || sakhi he keshimathanamudaram ramaya
    maya saha madanamanorathabhavitaya savikaram || || prathamasamagamalajjitaya patucatushatairanukulam
    | mridumadhurasmitabhashitaya shithilikritajaghanadukulam || || kisalayashayananiveshitaya ciramurasi
    mamaiva shayanam | kritaparirambhanacumbanaya parirabhya kritadharapanam || || alasanimilitalocanaya
    pulakavalilalitakapolam | shramajalasakalakalevaraya varamadanamadadatilolam || || kokilakalaravakujitaya
    jitamanasijatantravicaram | shlathakusumakulakuntalaya nakhalikhitaghanastanabharam || || caranaranitamaninupuraya
    paripuritasuratavitanam | mukharavishrinkhalamekhalaya sakacagrahacumbanadanam || || ratisukhasamayarasalasaya
    daramukulitanayanasarojam | nihsahanipatitatanulataya madhusudanamuditamanojam || || shrijayadevabhanitamidamatishayamadhuripunidhuvanashilam
    | sukhamutkanthitagopavadhukathitam vitanotu salilam || || hastasrastavilasavamshamanrijubhruvallimadballavi
    vrindotsaridrigantavikshitamatisvedardragandasthalam | mamudvikshya vilakshitam smitasudhamugdhananam
    kanane govindam vrajasundariganavritam pashyami hrishyami ca || || duralokastokastabakanavakashokalatika
    vikasah kasaropavanapavano''pi vyathayati | api bhramyadbhringiranitaramaniya na mukula prasutishcutanam
    sakhi shikhariniyam sukhayati || || || iti gitagovinde akleshakeshavo nama dvitiyah sargah ||'
  devanagari: ॥ द्वितीयः सर्गः ॥ ॥ अक्लेशकेशवः ॥ विहरति वने राधा साधारणप्रणये हरौ विगलितनिजोत्कर्षादीर्ष्यावशेन
    गतान्यतः । क्वचिदपि लताकुञ्जे गुञ्जन्मधुव्रतमण्डली मुखरशिखरे लीना दीनाप्युवाच रहः सखीम् ॥ ॥ सञ्चरदधरसुधामधुरध्वनिमुखरितमोहनवंशम्
    । चलितदृगञ्चलचञ्चलमौलिकपोलविलोलवतंसम् ॥ रासे हरिमिह विहितविलासं स्मरति मनो मम कृतपरिहासम् ॥ ॥ चन्द्रकचारुमयूरशिखण्डकमण्डलवलयितकेशम्
    । प्रचुरपुरन्दरधनुरनुरञ्जितमेदुरमुदिरसुवेशम् ॥ ॥ गोपकदम्बनितम्बवतीमुखचुम्बनलम्भितलोभम् । बन्धुजीवमधुराधरपल्लवमुल्लसितस्मितशोभम्
    ॥ ॥ विपुलपुलकभुजपल्लववलयितवल्लवयुवतिसहस्रम् । करचरणोरसि मणिगणभूषणकिरणविभिन्नतमिस्रम् ॥ ॥ जलदपटलवलदिन्दुविनन्दकचन्दनतिलकललाटम्
    । पीनपयोधरपरिसरमर्दननिर्दयहृदयकवाटम् ॥ ॥ मणिमयमकरमनोहरकुण्डलमण्डितगण्डमुदारम् । पीतवसनमनुगतमुनिमनुजसुरासुरवरपरिवारम्
    ॥ ॥ विशदकदम्बतले मिलितं कलिकलुषभयं शमयन्तम् । मामपि किमपि तरङ्गदनङ्गदृशा मनसा रमयन्तम् ॥ ॥ श्रीजयदेवभणितमतिसुन्दरमोहनमधुरिपुरूपम्
    । हरिचरणस्मरणं प्रति सम्प्रति पुण्यवतामनुरूपम् ॥ ॥ गणयति गुणग्रामं भामं भ्रमादपि नेहते वहति च परितोषं
    दोषं विमुञ्चति दूरतः । युवतिषु वलस्तृष्णे कृष्णे विहारिणि मां विना पुनरपि मनो वामं कामं करोति करोमि
    किम् ॥ ॥ निभृतनिकुञ्जगृहं गतया निशि रहसि निलीय वसन्तम् । चकितविलोकितसकलदिशा रतिरभसरसेन हसन्तम् ॥ सखि
    हे केशिमथनमुदारं रमय मया सह मदनमनोरथभावितया सविकारम् ॥ ॥ प्रथमसमागमलज्जितया पटुचाटुशतैरनुकूलम् । मृदुमधुरस्मितभाषितया
    शिथिलीकृतजघनदुकूलम् ॥ ॥ किसलयशयननिवेशितया चिरमुरसि ममैव शयानम् । कृतपरिरम्भणचुम्बनया परिरभ्य कृताधरपानम्
    ॥ ॥ अलसनिमीलितलोचनया पुलकावलिललितकपोलम् । श्रमजलसकलकलेवरया वरमदनमदादतिलोलम् ॥ ॥ कोकिलकलरवकूजितया जितमनसिजतन्त्रविचारम्
    । श्लथकुसुमाकुलकुन्तलया नखलिखितघनस्तनभारम् ॥ ॥ चरणरणितमनिनूपुरया परिपूरितसुरतवितानम् । मुखरविशृङ्खलमेखलया
    सकचग्रहचुम्बनदानम् ॥ ॥ रतिसुखसमयरसालसया दरमुकुलितनयनसरोजम् । निःसहनिपतिततनुलतया मधुसूदनमुदितमनोजम्
    ॥ ॥ श्रीजयदेवभणितमिदमतिशयमधुरिपुनिधुवनशीलम् । सुखमुत्कण्ठितगोपवधूकथितं वितनोतु सलीलम् ॥ ॥ हस्तस्रस्तविलासवंशमनृजुभ्रूवल्लिमद्बल्लवी
    वृन्दोत्सारिदृगन्तवीक्षितमतिस्वेदार्द्रगण्डस्थलम् । मामुद्वीक्ष्य विलक्षितं स्मितसुधामुग्धाननं कानने
    गोविन्दं व्रजसुन्दरीगणवृतं पश्यामि हृष्यामि च ॥ ॥ दुरालोकस्तोकस्तबकनवकाशोकलतिका विकासः कासारोपवनपवनोऽपि
    व्यथयति । अपि भ्राम्यद्भृङ्गीरणितरमणीया न मुकुल प्रसूतिश्चूतानां सखि शिखरिणीयं सुखयति ॥ ॥ ॥ इति गीतगोविन्दे
    अक्लेशकेशवो नाम द्वितीयः सर्गः ॥
