id: ganeshastotramshivadattakritam
category: stotram
name:
  english: ganeshastotramshivadattakritam
  devanagari: गणेशस्तोत्रम्शिवदत्तकृतं
content:
  english: shivadattakritam shriganeshastotram || shriganeshaya namah || shivadatta uvaca | ganeshaya
    namastubhyam parasharatmajaya te | shivaputraya sheshasya putraya vai namo namah || 40|| sarvaputraya
    sarvesham matre pitre namo namah | bhratre suhridganayaiva snushadiveshadharine || 41|| anantarupine
    tubhyam nanabhogaviharine | bhogahinaya devaya suraya te namo namah || 42|| aparagunadharaya gunanam
    pataye namah | ganeshaya pareshaya purnanandaya te namah || 43|| adimadhyantarupaishca srashtre patre
    praharine | adimadhyantahinaya sakshine te namo namah || 44|| svanandapataye tubhyam mushakavahanaya
    ca | siddhibuddhipradatre te siddhibuddhipate namah || 45|| yoganam pataye tubhyam yogashantisvarupine
    | gajananaya shantibhyah shantidatre namo namah || 46|| pareshaya mahadinapalakaya namo namah | sarvebhyah
    sukhadatre te vighneshaya namo namah || 47|| kim staumi tvam ganadhyaksha vedah shantim gatastvayi
    | ato namo namo natha tushto bhava mahodara || 48|| rajamsi svasthitastara meghabindumshca manavah
    | ganayet ko'pi te natha na gunan varnitum kshamah || 49|| dhanyo'ham sarvabhavaishca yena drishto
    gajananah | vedantagocare gamyo yogibhishca shivadibhih || 50|| evam stutva ganeshanam nanama munipungavah
    | tamuvaca ganadhishah svabhaktam bhaktalolupah || 51|| shriganesha uvaca | varan vrinu mahabhaga
    ye te citte dadami tan | prasanno'ham ca te bhaktya stotrena munisattama || 52|| shivadatta uvaca
    | bhaktim dehi tvadiyam me dridhamavyabhicarinim | nanyam yace ganadhisha tvatpadapravano hyaham ||
    53||
  devanagari: शिवदत्तकृतं श्रीगणेशस्तोत्रम् ॥ श्रीगणेशाय नमः ॥ शिवदत्त उवाच । गणेशाय नमस्तुभ्यं पराशरात्मजाय
    ते । शिवपुत्राय शेषस्य पुत्राय वै नमो नमः ॥ ४०॥ सर्वपुत्राय सर्वेषां मात्रे पित्रे नमो नमः । भ्रात्रे
    सुहृद्गणायैव स्नुषादिवेषधारिणे ॥ ४१॥ अनन्तरूपिणे तुभ्यं नानाभोगविहारिणे । भोगहीनाय देवाय सुराय ते
    नमो नमः ॥ ४२॥ अपारगुणधाराय गुणानां पतये नमः । गणेशाय परेशाय पूर्णानन्दाय ते नमः ॥ ४३॥ आदिमध्यान्तरूपैश्च
    स्रष्ट्रे पात्रे प्रहारिणे । आदिमध्यान्तहीनाय साक्षिणे ते नमो नमः ॥ ४४॥ स्वानन्दपतये तुभ्यं मूषकवाहनाय
    च । सिद्धिबुद्धिप्रदात्रे ते सिद्धिबुद्धिपते नमः ॥ ४५॥ योगानां पतये तुभ्यं योगशान्तिस्वरूपिणे । गजाननाय
    शान्तिभ्यः शान्तिदात्रे नमो नमः ॥ ४६॥ परेशाय महादीनपालकाय नमो नमः । सर्वेभ्यः सुखदात्रे ते विघ्नेशाय
    नमो नमः ॥ ४७॥ किं स्तौमि त्वां गणाध्यक्ष वेदाः शान्तिं गतास्त्वयि । अतो नमो नमो नाथ तुष्टो भव महोदर
    ॥ ४८॥ रजांसि स्वस्थितास्तारा मेघबिन्दूंश्च मानवः । गणयेत् कोऽपि ते नाथ न गुणान् वर्णितुं क्षमः ॥ ४९॥
    धन्योऽहं सर्वभावैश्च येन दृष्टो गजाननः । वेदान्तागोचरे गम्यो योगिभिश्च शिवादिभिः ॥ ५०॥ एवं स्तुत्वा
    गणेशानं ननाम मुनिपुङ्गवः । तमुवाच गणाधीशः स्वभक्तं भक्तलोलुपः ॥ ५१॥ श्रीगणेश उवाच । वरान् वृणु महाभाग
    ये ते चित्ते ददामि तान् । प्रसन्नोऽहं च ते भक्त्या स्तोत्रेण मुनिसत्तम ॥ ५२॥ शिवदत्त उवाच । भक्तिं
    देहि त्वदीयां मे दृढामव्यभिचारिणीम् । नान्यं याचे गणाधीश त्वत्पादप्रवणो ह्यहम् ॥ ५३॥
