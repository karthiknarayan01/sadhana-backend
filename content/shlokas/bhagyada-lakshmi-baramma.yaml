id: bhagyada-lakshmi-baramma
category: stotram
name:
  english: Bhagyada Lakshmi Baramma
content:
  english: kannada pallavi bhagyada lakshmi baramma nammamma ni sau bhagyada lakshmi baramma || caranam
    hèjjèyè mele hèjjèya nikkuta gèjjè kalgala dhvaniya toruta sajjana sadhu pujèya velègè majjigèyòlagina
    bènnèyantè || kanakavrishtiya karèyuta bare manakamanèya siddhiya torè | dinakarakoti tejadi hòlèyuva
    janakarayana kumari bega || attittagaladè bhaktara manèyali nitya mahotsava nitya sumangala | satyava
    toruva sadhu sajjanara cittadi hòlèyuva putthali bòmbè || sankhye illada bhagyava kòttu kankana kaiya
    tiruvuta barè | kunkumankitè pankaja locanè venkata ramanana binkadarani || sakkèrè tuppada kaluvèharisi
    shukravarada pujèya velègè | akkèrèyulla alagiri ranganana còkka purandara viththalana rani ||
  devanagari: कन्नड पल्लवि भाग्यदा लक्ष्मी बारम्मा नम्मम्म नी सौ भाग्यदा लक्ष्मी बारम्मा ॥ चरणं हॆज्जॆयॆ
    मेले हॆज्जॆय निक्कुत गॆज्जॆ काल्गला ध्वनिय तोरुत सज्जन साधू पूजॆय वेलॆगॆ मज्जिगॆयॊलगिन बॆण्णॆयन्तॆ
    ॥ कनकावृष्टिय करॆयुत बारे मनकामनॆया सिद्धिय तोरॆ । दिनकरकोटी तेजदि हॊलॆयुव जनकरायना कुमारि बेग ॥ अत्तित्तगलदॆ
    भक्तर मनॆयलि नित्य महोत्सव नित्य सुमङ्गल । सत्यव तोरुव साधु सज्जनर चित्तदि हॊलॆयुव पुत्थलि बॊम्बॆ
    ॥ सङ्ख्ये इल्लद भाग्यव कॊट्टु कङ्कण कैया तिरुवुत बारॆ । कुङ्कुमाङ्कितॆ पङ्कज लोचनॆ वेङ्कट रमणन बिङ्कदराणी
    ॥ सक्कॆरॆ तुप्पद कालुवॆहरिसि शुक्रवारदा पूजॆय वेलॆगॆ । अक्कॆरॆयुल्ल अलगिरि रङ्गनन चॊक्क पुरन्दर विठ्ठलन
    राणी ॥
