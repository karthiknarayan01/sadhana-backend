id: shrisuktampauranikam
category: sukta
name:
  english: shrisuktampauranikam
  devanagari: श्रीसूक्तंपौराणीकम्
content:
  english: shriyam tvam madarthamakaraya jatavedah || 1|| yasyam sulakshmyamahamagatayam hiranyago'shvatmajamitradasan
    | labheyamashu hyanapayinim tam madarthamakaraya jatavedah || 2|| pratyahvaye tamahamashvapurvam devim
    shriyam madhyaratham samipam | prabodhinim hastisubrimhitenahuta maya sa kila sevatam mam || 3|| kamsosmitam
    tamihadmavarnamadram suvarnavaranam jvalantim | triptam hi bhaktanatha tarpayantimupahvaye'ham kamalasanastham
    || 4|| loke jvalantim yashasa prabhasam candramudamuta devajushtam | tam padmarupam sharanam prapadye
    shriyam vrine tvom vrajatamalakshmih || 5|| vanaspatiste tapaso'dhijato vriksho'tha bilvastarunarkavarne
    | phalani tasya tvadanugrahena maya alakshmishca nudantu bahyah || 6|| upaitu mam devasakhah kuberah
    sa dakshakanya manina ca kirtih | jato'smi rashtre kila martyaloke kirtim samriddhim ca dadatu mahyam
    || 7|| kshuttritkrishangi malinamalakshmim tavagrajam tamutanashayami | sarvamabhutim hyasamriddhimambe
    grihanca
  devanagari: श्रियं त्वं मदर्थमाकारय जातवेदः ॥ १॥ यस्यां सुलक्ष्म्यामहमागतायां हिरण्यगोऽश्वात्मजमित्रदासान्
    । लभेयमाशु ह्यनपायिनीं तां मदर्थमाकारय जातवेदः ॥ २॥ प्रत्याह्वये तामहमश्वपूर्वां देवीं श्रियं मध्यरथां
    समीपम् । प्रबोधिनीं हस्तिसुबृंहितेनाहूता मया सा किल सेवतां माम् ॥ ३॥ कांसोस्मितां तामिहद्मवर्णामाद्रां
    सुवर्णावरणां ज्वलन्तीम् । तृप्तां हि भक्तानथ तर्पयन्तीमुपह्वयेऽहं कमलासनस्थाम् ॥ ४॥ लोके ज्वलन्तीं
    यशसा प्रभासां चन्द्रामुदामुत देवजुष्टाम् । तां पद्मरूपां शरणं प्रपद्ये श्रियं वृणे त्वों व्रजतामलक्ष्मीः
    ॥ ५॥ वनस्पतिस्ते तपसोऽधिजातो वृक्षोऽथ बिल्वस्तरुणार्कवर्णे । फलानि तस्य त्वदनुग्रहेण माया अलक्ष्मीश्च
    नुदन्तु बाह्याः ॥ ६॥ उपैतु मां देवसखः कुबेरः सा दक्षकन्या मणिना च कीर्तिः । जातोऽस्मि राष्ट्रे किल
    मर्त्यलोके कीर्तिं समृद्धिं च ददातु मह्यम् ॥ ७॥ क्षुत्तृट्कृशाङ्गी मलिनामलक्ष्मीं तवाग्रजां तामुतनाशयामि
    । सर्वामभूतिं ह्यसमृद्धिमम्बे गृहाञ्च
