id: gomantrapathah
category: mantra
name:
  english: gomantrapathah
  devanagari: गोमन्त्रपाठः
content:
  english: gomantrapathah bahule samange hyakutobhaye ca ksheme ca sakhyeva hi bhuyasi ca | yatha pura
    brahmapure savatsa shatakratorvajradharasya yajne || 1|| bhuyashca ya vishnupade sthita ya vibhavasoshcapi
    pathe sthita ya | devashca sarve saha naradena prakurvate sarvasaheti nama || 2|| mantrenaitenabhivandeta
    yo vai vimucyate papakritena karmana | lokanavapnoti purandarasya gavam phalam candramaso dyutim ca
    || 3|| etam hi mantram tridashabhijushtam patheta yah parvasu goshthamadhye | na tasya papam na bhayam
    na shokah sahasranetrasya ca yati lokam || 4|| iti gomantrapathah samaptah | shrisurabhiyagapaddhatih
    |
  devanagari: गोमन्त्रपाठः बहुले समङ्गे ह्यकुतोभये च क्षेमे च सख्येव हि भूयसी च । यथा पुरा ब्रह्मपुरे
    सवत्सा शतक्रतोर्वज्रधरस्य यज्ञे ॥ १॥ भूयश्च या विष्णुपदे स्थिता या विभावसोश्चापि पथे स्थिता या । देवाश्च
    सर्वे सह नारदेन प्रकुर्वते सर्वसहेति नाम ॥ २॥ मन्त्रेणैतेनाभिवन्देत यो वै विमुच्यते पापकृतेन कर्मणा
    । लोकानवाप्नोति पुरन्दरस्य गवां फलं चन्द्रमसो द्युतिं च ॥ ३॥ एतं हि मन्त्रं त्रिदशाभिजुष्टं पठेत यः
    पर्वसु गोष्ठमध्ये । न तस्य पापं न भयं न शोकः सहस्रनेत्रस्य च याति लोकम् ॥ ४॥ इति गोमन्त्रपाठः समाप्तः
    । श्रीसुरभियागपद्धतिः ।
