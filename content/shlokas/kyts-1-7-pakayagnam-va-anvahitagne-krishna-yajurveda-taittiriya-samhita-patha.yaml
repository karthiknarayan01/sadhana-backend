    अवो॑भि स्सुमृडी॒को भ॑वतु वि॒श्ववे॑दाः । बाध॑ता॒ ङ्कृणोतु सु॒वीर्य॑स्य॒ स्स्याम ॥ तस्य॑ व॒यग्ं सु॑म॒तौ
    य॒ज्ञिय॒स्यापि॑ भ॒द्रे सौ॑मन॒से स्या॑म । स सु॒त्रामा॒ स्ववा॒ग्ं॒ इन्द्रो॑ अ॒स्मे आ॒राच्चि॒ स्सध॒माद॒
    इन्द्रे॑ सन्तु तु॒विवा॑जाः । क्षु॒मन्तो॒ याभि॒ र्मदे॑म ॥ प्रोष्व॑स्मै पुरोर॒थमिन्द्रा॑य शू॒षम॑र्चत
    । अ॒भीके॑ चिदु लोक॒कृ थ्स॒ङ्गे स॒मथ्सु॑ वृत्र॒हा । अ॒स्माक॑ म्बोधि चोदि॒ता नभ॑न्ता म् । ज्या॒का अधि॒
    धन्व॑सु ॥ ॥ हरि॑ ओम् ॥ ॥ कृष्ण यजुर्वेदीय तैत्तिरीय संहिताया म्प्रथमकाण्डे सप्तमः प्रश्न
