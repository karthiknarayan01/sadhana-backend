id: dashamahavidyakavacam
category: kavacha
name:
  english: dashamahavidyakavacam
  devanagari: दशमहाविद्याकवचम्
content:
  english: om lam prithvitattvatmakam gandham shrimahavidyaprityarthe samarpayami namah | om ham akashatattvatmakam
    pushpam shrimahavidyaprityarthe samarpayami namah | om yam vayutattvatmakam dhupam shrimahavidyaprityarthe
    aghrapayami namah | om ram agnitattvatmakam dipam shrimahavidyaprityarthe darshayami namah | om vam
    jalatattvatmakam naivedyam shrimahavidyaprityarthe nivedayami namah | om sam sarvatattvatmakam tambulam
    shrimahavidyaprityarthe nivedayami namah || atha shrimahavidyakavacam | om pracyam rakshatu me tara
    kamarupanivasini | agneyyam shodashi patu yamyam dhumavati svayam || 1|| nairrityam bhairavi patu
    varunyam bhuvaneshvari | vayavyam satatam patu chinnamasta maheshvari || 2|| kauberyam patu me devi
    shrividya bagalamukhi | aishanyam patu me nityam mahatripurasundari || 3|| urdhvam rakshatu me vidya
    matangipithavasini | sarvatah patu me nityam kamakhya kalika svayam || 4|| brahmarupa mahavidya sarvavidyamayi
    svayam | shirshe rakshatu me durga bhalam shribhavagehini || 5|| tripura bhruyuge patu sharvani patu
    nasikam | cakshushi candika patu shrotre nilasarasvati || 6|| mukham saumyamukhi patu grivam rakshatu
    parvati | jihvam rakshatu me devi jihvalalanabhishana || 7|| vagdevi vadanam patu vakshah patu maheshvari
    | bahu mahabhuja patu karangulih sureshvari || 8|| prishthatah patu bhimasya katyam devi digambari
    | udaram patu me nityam mahavidya mahodari || 9|| ugratara mahadevi janghoru parirakshatu | gudam
    mushkam ca medhram ca nabhim ca surasundari || 10|| padangulih sada patu bhavani tridasheshvari |
    raktamamsasthimajjadin patu devi shavasana || 11|| mahabhayeshu ghoreshu mahabhayanivarini | patu
    devi mahamaya kamakhyapithavasini || 12|| bhasmacalagata divyasimhasanakritashraya | patu shrikalikadevi
    sarvotpateshu sarvada || 13|| rakshahinam tu yatsthanam kavacenapi varjitam | tatsarvam sarvada patu
    sarvarakshanakarini || 14|| iti shridashamahavidyakavacam sampurnam |
  devanagari: ॐ लं पृथ्वीतत्त्वात्मकं गन्धं श्रीमहाविद्याप्रीत्यर्थे समर्पयामि नमः । ॐ हं आकाशतत्त्वात्मकं
    पुष्पं श्रीमहाविद्याप्रीत्यर्थे समर्पयामि नमः । ॐ यं वायुतत्त्वात्मकं धूपं श्रीमहाविद्याप्रीत्यर्थे
    आघ्रापयामि नमः । ॐ रं अग्नितत्त्वात्मकं दीपं श्रीमहाविद्याप्रीत्यर्थे दर्शयामि नमः । ॐ वं जलतत्त्वात्मकं
    नैवेद्यं श्रीमहाविद्याप्रीत्यर्थे निवेदयामि नमः । ॐ सं सर्वतत्त्वात्मकं ताम्बूलं श्रीमहाविद्याप्रीत्यर्थे
    निवेदयामि नमः ॥ अथ श्रीमहाविद्याकवचम् । ॐ प्राच्यां रक्षतु मे तारा कामरूपनिवासिनी । आग्नेय्यां षोडशी
    पातु याम्यां धूमावती स्वयम् ॥ १॥ नैरृत्यां भैरवी पातु वारुण्यां भुवनेश्वरी । वायव्यां सततं पातु छिन्नमस्ता
    महेश्वरी ॥ २॥ कौबेर्यां पातु मे देवी श्रीविद्या बगलामुखी । ऐशान्यां पातु मे नित्यं महात्रिपुरसुन्दरी
    ॥ ३॥ ऊर्ध्वं रक्षतु मे विद्या मातङ्गीपीठवासिनी । सर्वतः पातु मे नित्यं कामाख्या कालिका स्वयम् ॥ ४॥
    ब्रह्मरूपा महाविद्या सर्वविद्यामयी स्वयम् । शीर्षे रक्षतु मे दुर्गा भालं श्रीभवगेहिनी ॥ ५॥ त्रिपुरा
    भ्रुयुगे पातु शर्वाणी पातु नासिकाम् । चक्षुषी चण्डिका पातु श्रोत्रे निलसरस्वती ॥ ६॥ मुखं सौम्यमुखी
    पातु ग्रीवां रक्षतु पार्वती । जिह्वां रक्षतु मे देवी जिह्वाललनभीषणा ॥ ७॥ वाग्देवी वदनं पातु वक्षः
    पातु महेश्वरी । बाहू महाभुजा पातु कराङ्गुलीः सुरेश्वरी ॥ ८॥ पृष्ठतः पातु भीमास्या कट्यां देवी दिगम्बरी
    । उदरं पातु मे नित्यं महाविद्या महोदरी ॥ ९॥ उग्रतारा महादेवी जङ्घोरू परिरक्षतु । गुदं मुष्कं च मेढ्रं
    च नाभिं च सुरसुन्दरी ॥ १०॥ पादाङ्गुलीः सदा पातु भवानी त्रिदशेश्वरी । रक्तमांसास्थिमज्जादीन् पातु देवी
    शवासना ॥ ११॥ महाभयेषु घोरेषु महाभयनिवारिणी । पातु देवी महामाया कामाख्यापीठवासिनी ॥ १२॥ भस्माचलगता
    दिव्यसिंहासनकृताश्रया । पातु श्रीकालिकादेवी सर्वोत्पातेषु सर्वदा ॥ १३॥ रक्षाहीनं तु यत्स्थानं कवचेनापि
    वर्जितम् । तत्सर्वं सर्वदा पातु सर्वरक्षणकारिणी ॥ १४॥ इति श्रीदशमहाविद्याकवचं सम्पूर्णम् ।
