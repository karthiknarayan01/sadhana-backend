id: navagraha-japamantrah
category: mantra
name:
  english: navagraha japamantrah
  devanagari: नवग्रह जपमन्त्राः
content:
  english: suryaya hridayaya namah | tejomurtaye shirase svaha | varadaya shikhayai vashat | hamsaya kavacaya
    hum | shantaya netratrayaya vaushat | karmasakshine astraya phat | bhurbhuvahsuvaromiti digvimokah
    | dhyanam | dhritapadmadvayam bhanum tejomandalamadhyagam | sarvadhivyadhishamanam chayashlishtatanum
    bhaje || 1|| padmasanah padmakaro dvibahuh padmadyutih saptaturangavahah | divakaro lokaguruh kiriti
    mayi prasadam vidadhatu devah || 2|| dvibhujam padmaharam ca varadam makutanvitam | dhyayeddivakaram
    devam sarvabhishtaphalapradam || 3|| lam prithivyatmane gandham samarpayami | ham akashatmane pushpani
    samarpayami | yam vayvatmane dhupamaghrapayami | ram vahnyatmane dipam darshayami | vam amritatmane
    amritam nivedayami | sam sarvatmane sarvopacaran samarpayami || iti shrisuryamahamantrah | candrah
    atha somamantraprarambhah om asya shrisomamahamantrasya gautama rishih | gayatri chandah | somo devata
    | sam bijam | sim shaktih | sum kilakam | mama shrisomagrahaprasadasiddhyarthe jape viniyogah | somaya
    angushthabhyam namah | nishakaraya tarjanibhyam svaha | kshirodarnavasambhavaya madhyamabhyam vashat
    | lakshmisahodaraya anamikabhyam hum | tarakeshaya kanishthikabhyam vaushat | sudhamurtaye karatalakaraprishthabham
    phat | somaya hridayaya namah | nishakaraya shirase svaha | kshirodarnavasambhavaya shikhayai vashat
    | lakshmisahodaraya kavacaya hum | tarakeshaya netratrayaya vaushat | sudhamurtaye astraya phat |
    bhurbhuvah suvaromiti digbandhah | dhyanam gadadharadharam devam shvetavarnam nishakaram | dhyayedamritasambhutam
    sarvakamaphalapradam || lam prithivyatmane gandham samarpayami | ham akashatmane pushpani samarpayami
    | yam vayvatmane dhupamaghrapayami | ram vahnyatmane dipam darshayami | vam amritatmane amritopaharam
    nivedayami | sam sarvatmane sarvopacaran samarpayami || mulamantrah om apya̭yasva̱ samḙtu te vi̱shvata̭h
    soma̱ vrishni̭yam | bhava̱ vaja̭sya sanga̱the ||
  devanagari: सूर्याय हृदयाय नमः । तेजोमूर्तये शिरसे स्वाहा । वरदाय शिखायै वषट् । हंसाय कवचाय हुम् । शान्ताय
    नेत्रत्रयाय वौषट् । कर्मसाक्षिणे अस्त्राय फट् । भूर्भुवःसुवरोमिति दिग्विमोकः । ध्यानम् । धृतपद्मद्वयं
    भानुं तेजोमण्डलमध्यगम् । सर्वाधिव्याधिशमनं छायाश्लिष्टतनुं भजे ॥ १॥ पद्मासनः पद्मकरो द्विबाहुः पद्मद्युतिः
    सप्ततुरङ्गवाहः । दिवाकरो लोकगुरुः किरीटी मयि प्रसादं विदधातु देवः ॥ २॥ द्विभुजं पद्महारं च वरदं मकुटान्वितम्
    । ध्यायेद्दिवाकरं देवं सर्वाभीष्टफलप्रदम् ॥ ३॥ लं पृथिव्यात्मने गन्धं समर्पयामि । हं आकाशात्मने पुष्पाणि
    समर्पयामि । यं वाय्वात्मने धूपमाघ्रापयामि । रं वह्न्यात्मने दीपं दर्शयामि । वं अमृतात्मने अमृतं निवेदयामि
    । सं सर्वात्मने सर्वोपचारान् समर्पयामि ॥ इति श्रीसूर्यमहामन्त्रः । चन्द्रः अथ सोममन्त्रप्रारंभः ॐ
    अस्य श्रीसोममहामन्त्रस्य गौतम ऋषिः । गायत्री छन्दः । सोमो देवता । सां बीजम् । सीं शक्तिः । सूं कीलकम्
    । मम श्रीसोमग्रहप्रसादसिद्ध्यर्थे जपे विनियोगः । सोमाय अङ्गुष्ठाभ्यां नमः । निशाकराय तर्जनीभ्यां स्वाहा
    । क्षीरोदार्णवसंभवाय मध्यमाभ्यां वषट् । लक्ष्मीसहोदराय अनामिकाभ्यां हुम् । तारकेशाय कनिष्ठिकाभ्यां
    वौषट् । सुधामूर्तये करतलकरपृष्ठाभां फट् । सोमाय हृदयाय नमः । निशाकराय शिरसे स्वाहा । क्षीरोदार्णवसंभवाय
    शिखायै वषट् । लक्ष्मीसहोदराय कवचाय हुम् । तारकेशाय नेत्रत्रयाय वौषट् । सुधामूर्तये अस्त्राय फट् ।
    भूर्भुवः सुवरोमिति दिग्बन्धः । ध्यानम् गदाधरधरं देवं श्वेतवर्णं निशाकरम् । ध्यायेदमृतसंभूतं सर्वकामफलप्रदम्
    ॥ लं पृथिव्यात्मने गन्धं समर्पयामि । हं आकाशात्मने पुष्पाणि समर्पयामि । यं वाय्वात्मने धूपमाघ्रापयामि
    । रं वह्न्यात्मने दीपं दर्शयामि । वं अमृतात्मने अमृतोपहारं निवेदयामि । सं सर्वात्मने सर्वोपचारान्
    समर्पयामि ॥ मूलमन्त्रः ॐ आप्या॑यस्व॒ समे॑तु ते वि॒श्वतः॑ सोम॒ वृष्णि॑यम् । भवा॒ वाज॑स्य सङ्ग॒थे ॥
