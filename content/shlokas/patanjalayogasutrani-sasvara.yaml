id: patanjalayogasutrani-sasvara
category: sutra
name:
  english: patanjalayogasutrani (sasvara)
  devanagari: पातञ्जलयोगसूत्राणि (सस्वर)
content:
  english: 33|| vi̱ta̱rka hi̱msadayah kri̱taka̱ri̱ta̱nu̱mo̱di̱ta lo̱bhakro̱dhamo̱hapu̱rva̱ka mri̱duma̱dhya̱dhi̱ma̱tra
    du̱hkha̱jna̱na̱na̱ntapha̱la iti pra̱tipaksha̭bhava̱nam || 2
  devanagari: ३३॥ वि॒त॒र्का हिं॒सादयः कृ॒तका॒रि॒ता॒नु॒मो॒दि॒ता लो॒भक्रो॒धमो॒हपू॒र्व॒का मृ॒दुम॒ध्या॒धि॒मा॒त्रा
    दुः॒खा॒ज्ञा॒ना॒न॒न्तफ॒ला इति प्र॒तिपक्ष॑भाव॒नम् ॥ २
meaning: {}
