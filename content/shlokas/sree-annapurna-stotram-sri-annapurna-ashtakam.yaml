id: sree-annapurna-stotram-sri-annapurna-ashtakam
category: stotram
name:
  english: Sree Annapurna Stotram (Sri Annapurna Ashtakam)
content:
  english: nityanandakari varabhayakari saundarya ratnakari nirdhutakhila ghora pavanakari pratyaksha
    maheshvari | praleyacala vamsha pavanakari kashipuradhishvari bhiksham dehi kripavalambanakari matannapurneshvari
    || || nana ratna vicitra bhushanakari hemambaradambari muktahara vilambamana vilasat vakshoja kumbhantari
    | kashmiragaru vasita rucikari kashipuradhishvari bhiksham dehi kripavalambanakari matannapurneshvari
    || || yoganandakari ripukshayakari dharmaikya nishthakari candrarkanala bhasamana lahari trailokya
    rakshakari | sarvaishvaryakari tapah phalakari kashipuradhishvari bhiksham dehi kripavalambanakari
    matannapurneshvari || || kailasacala kandaralayakari gauri hyumashankari kaumari nigamartha bijakshari
    | mokshadvara kavatapatanakari kashipuradhishvari bhiksham dehi kripavalambanakari matannapurneshvari
    || dipankuri | shrivishveshamanah prasadanakari kashipuradhishvari bhiksham dehi kripavalambanakari
    matannapurneshvari || || urvisarvajayeshvari bhagavati daneshvari | sakshanmokshakari sada shubhakari
    kashipuradhishvari bhiksham dehi kripavalambanakari matannapurneshvari || samastavarnanakari shambhostribhavakari
    kashmira tripureshvari trinayani vishveshvari sharvari | svargadvara patanakari kashipuradhishvari
    bhiksham dehi kripavalambanakari matannapurneshvari || ratnarucita dakshayini sundari vama svadupayodhara
    priyakari saubhagyamaheshvari | bhaktabhishtakari sada shubhakari kashipuradhishvari bhiksham dehi
    kripavalambanakari matannapurneshvari || bimbadhari candrarkagni pashasankushadhari kashipuradhishvari
    bhiksham dehi kripavalambanakari matannapurneshvari || || kshatratranakari mahabhayakari mata kripasagari
    sarvanandakari sada shivakari vishveshvari shridhari | dakshakrandakari niramayakari kashipuradhishvari
    bhiksham dehi kripavalambanakari matannapurneshvari || || annapurne sadapurne shankara siddhyartham
    bhiksham dehi ca parvati || || mata ca parvatidevi pitadevo maheshvarah | bandhavah shivabhaktashca
    svadesho bhuvanatrayam || mangalye shive sarvartha sadhike | sharanye tryambake gauri narayani namo'stu
    te || || iti shrimatparamahamsaparivrajakacaryasya shrigovindabhagavatpujyapadashishyasya shrimacchankarabhagavatah
    kritau annapurna stotram |
  devanagari: नित्यानन्दकरी वराभयकरी सौन्दर्य रत्नाकरी निर्धूताखिल घोर पावनकरी प्रत्यक्ष माहेश्वरी । प्रालेयाचल
    वंश पावनकरी काशीपुराधीश्वरी भिक्षां देहि कृपावलम्बनकरी मातान्नपूर्णेश्वरी ॥ ॥ नाना रत्न विचित्र भूषणकरी
    हेमाम्बराडम्बरी मुक्ताहार विलम्बमान विलसत् वक्षोज कुम्भान्तरी । काश्मीरागरु वासिता रुचिकरी काशीपुराधीश्वरी
    भिक्षां देहि कृपावलम्बनकरी मातान्नपूर्णेश्वरी ॥ ॥ योगानन्दकरी रिपुक्षयकरी धर्मैक्य निष्ठाकरी चन्द्रार्कानल
    भासमान लहरी त्रैलोक्य रक्षाकरी । सर्वैश्वर्यकरी तपः फलकरी काशीपुराधीश्वरी भिक्षां देहि कृपावलम्बनकरी
    मातान्नपूर्णेश्वरी ॥ ॥ कैलासाचल कन्दरालयकरी गौरी ह्युमाशाङ्करी कौमारी निगमार्थ बीजाक्षरी । मोक्षद्वार
    कवाटपाटनकरी काशीपुराधीश्वरी भिक्षां देहि कृपावलम्बनकरी मातान्नपूर्णेश्वरी ॥ दीपाङ्कुरी । श्रीविश्वेशमनः
    प्रसादनकरी काशीपुराधीश्वरी भिक्षां देहि कृपावलम्बनकरी मातान्नपूर्णेश्वरी ॥ ॥ उर्वीसर्वजयेश्वरी भगवती
    दानेश्वरी । साक्षान्मोक्षकरी सदा शुभकरी काशीपुराधीश्वरी भिक्षां देहि कृपावलम्बनकरी मातान्नपूर्णेश्वरी
    ॥ समस्तवर्णनकरी शम्भोस्त्रिभावाकरी काश्मीरा त्रिपुरेश्वरी त्रिनयनी विश्वेश्वरी शर्वरी । स्वर्गद्वार
    पाटनकरी काशीपुराधीश्वरी भिक्षां देहि कृपावलम्बनकरी मातान्नपूर्णेश्वरी ॥ रत्नरुचिता दाक्षायिणी सुन्दरी
    वामा स्वादुपयोधरा प्रियकरी सौभाग्यमाहेश्वरी । भक्ताभीष्टकरी सदा शुभकरी काशीपुराधीश्वरी भिक्षां देहि
    कृपावलम्बनकरी मातान्नपूर्णेश्वरी ॥ बिम्बाधरी चन्द्रार्काग्नि पाशसाङ्कुशधरी काशीपुराधीश्वरी भिक्षां
    देहि कृपावलम्बनकरी मातान्नपूर्णेश्वरी ॥ ॥ क्षत्रत्राणकरी महाभयकरी माता कृपासागरी सर्वानन्दकरी सदा
    शिवकरी विश्वेश्वरी श्रीधरी । दक्षाक्रन्दकरी निरामयकरी काशीपुराधीश्वरी भिक्षां देहि कृपावलम्बनकरी मातान्नपूर्णेश्वरी
    ॥ ॥ अन्नपूर्णे सदापूर्णे शङ्कर सिद्ध्यर्थं भिक्षां देहि च पार्वति ॥ ॥ माता च पार्वतीदेवी पितादेवो
    महेश्वरः । बान्धवाः शिवभक्ताश्च स्वदेशो भुवनत्रयम् ॥ माङ्गल्ये शिवे सर्वार्थ साधिके । शरण्ये त्र्यम्बके
    गौरि नारायणि नमोऽस्तु ते ॥ ॥ इति श्रीमत्परमहंसपरिव्राजकाचार्यस्य श्रीगोविन्दभगवत्पूज्यपादशिष्यस्य
    श्रीमच्छङ्करभगवतः कृतौ अन्नपूर्णा स्तोत्रम् ।
