id: prajnaparamitastotram
category: stotram
name:
  english: prajnaparamitastotram
  devanagari: प्रज्नापारमितास्तोत्रम्
content:
  english: prajnaparamitastotram om namah shriprajnaparamitayai | nirvikalpe namastubhyam prajnaparamite'mite
    | ya tvam sarvanavadyangi niravadyairnirikshyase || 1|| akashamiva nirlepam nishprapancam niraksharam
    | yastvam pashyati bhavena sa pashyati tathagatam || 2|| tava carye gunadhyaya buddhasya ca jagadguroh
    | na pashyantyantaram santashcandracandrikayoriva || 3|| kripatmakam prapadya tvam buddhadharmapurassaram
    | sukhenayanti mahatmyamatulam bhaktavatsale || 4|| sakridapyashaye shuddhe yastvam vidhivadikshyate
    | tenapi niyatam siddhih prapyate'moghadarshane || 5|| sarveshamapi viranam pararthe niyatatmanam
    | vyapika jagatimenam mata tvamasi vatsala || 6|| ye buddha lokaguravah putrastava kripalavah | tena
    tvamasi kalyani sarvasattvapitamahi || 7|| sarvaparamitabhistvam nirmalabhiranindita | candralekheva
    tarabhiranuprota'si sarvatah || 8|| vineyajanamasadya tatra tatra tathagataih | bahurupa tvamevaika
    nananamabhirikshyase || 9|| prabham prapyeva diptamshoravashyayodavindavah | tvam prapya pralayam
    yanti doshavadashca vadinam || 10|| tvameva trasajanani balanam bhimadarshana | ashvasajanani capi
    vidusham saumyadarshana || 11|| yasya tvayyapyabhishvangastvannathasya na vidyate | tasyamba
  devanagari: प्रज्ञापारमितास्तोत्रम् ॐ नमः श्रीप्रज्ञापारमितायै । निर्विकल्पे नमस्तुभ्यं प्रज्ञापारमितेऽमिते
    । या त्वं सर्वानवद्याङ्गि निरवद्यैर्निरीक्ष्यसे ॥ १॥ आकाशमिव निर्लेपां निष्प्रपञ्चां निरक्षराम् ।
    यस्त्वां पश्यति भावेन स पश्यति तथागतम् ॥ २॥ तव चार्ये गुणाढ्याया बुद्धस्य च जगद्गुरोः । न पश्यन्त्यन्तरं
    सन्तश्चन्द्रचन्द्रिकयोरिव ॥ ३॥ कृपात्मकां प्रपद्य त्वां बुद्धधर्मपुरस्सराम् । सुखेनायान्ति माहात्म्यमतुलं
    भक्तवत्सले ॥ ४॥ सकृदप्याशये शुद्धे यस्त्वां विधिवदीक्ष्यते । तेनापि नियतं सिद्धिः प्राप्यतेऽमोघदर्शने
    ॥ ५॥ सर्वेषामपि वीराणां परार्थे नियतात्मनाम् । व्यापिका जगतीमेनां माता त्वमसि वत्सला ॥ ६॥ ये बुद्धा
    लोकगुरवः पुत्रास्तव कृपालवः । तेन त्वमसि कल्याणि सर्वसत्त्वपितामही ॥ ७॥ सर्वपारमिताभिस्त्वं निर्मलाभिरनिन्दिता
    । चन्द्रलेखेव ताराभिरनुप्रोताऽसि सर्वतः ॥ ८॥ विनेयजनमासाद्य तत्र तत्र तथागतैः । बहुरूपा त्वमेवैका
    नानानामभिरीक्ष्यसे ॥ ९॥ प्रभां प्राप्येव दीप्तांशोरवश्यायोदविन्दवः । त्वां प्राप्य प्रलयं यान्ति दोषावादाश्च
    वादिनाम् ॥ १०॥ त्वमेव त्रासजननी बालानां भीमदर्शना । आश्वासजननी चापि विदुषां सौम्यदर्शना ॥ ११॥ यस्य
    त्वय्यप्यभिष्वङ्गस्त्वन्नाथस्य न विद्यते । तस्याम्ब
