id: sri-sankaracharya-varyam
category: stotram
name:
  english: Sri Sankaracharya Varyam
content:
  english: '|| shrishankaracaryastavah || shrishankaracaryavaryam sarvalokaikavandyam bhaje deshikendram
    dharmapracare''tidaksham yogigovindapadaptasanyasadiksham | durvadigarvapanodam padmapadadishishyalisamsevyapadam
    || shrishankaracaryavaryam shankadridambholililam kinkarasheshashishyali santranashilam | balarkanikashacelam
    bodhitasheshavedanta gudharthajalam || shrishankaracaryavaryam rudrakshamalavibhusham candramaulishvararadhanavaptatosham
    | vidravitasheshadosham bhadrapugapradam bhaktalokasya nityam || shrishankaracaryavaryam papatavicitrabhanum
    jnanadipena hardam tamo varayantam | dvaipayanapritibhajam sarvatapapahamoghabodhapradam tam || shrishankaracaryavaryam
    rajadhirajabhipujyam ramyashringadrivasaikalolam yatidyam | rakendusankashavaktram ratnagarbhebhavaktranghripujanuraktam
    || shrishankaracaryavaryam shribharatitirthagitam shankararyastavam yah pathedbhaktiyuktah | so''vapnuyatsarvamishtam
    shankaracaryavaryaprasadena turnam || shrishankaracaryavaryam'
  devanagari: ॥ श्रीशङ्कराचार्यस्तवः ॥ श्रीशङ्कराचार्यवर्यं सर्वलोकैकवन्द्यं भजे देशिकेन्द्रम् धर्मप्रचारेऽतिदक्षं
    योगिगोविन्दपादाप्तसन्यासदीक्षम् । दुर्वादिगर्वापनोदं पद्मपादादिशिष्यालिसंसेव्यपादम् ॥ श्रीशङ्कराचार्यवर्यं
    शङ्काद्रिदम्भोलिलीलं किङ्कराशेषशिष्यालि सन्त्राणशीलम् । बालार्कनीकाशचेलं बोधिताशेषवेदान्त गूढार्थजालम्
    ॥ श्रीशङ्कराचार्यवर्यं रुद्राक्षमालाविभूषं चन्द्रमौलीश्वराराधनावाप्ततोषम् । विद्राविताशेषदोषं भद्रपूगप्रदं
    भक्तलोकस्य नित्यम् ॥ श्रीशङ्कराचार्यवर्यं पापाटवीचित्रभानुं ज्ञानदीपेन हार्दं तमो वारयन्तम् । द्वैपायनप्रीतिभाजं
    सर्वतापापहामोघबोधप्रदं तम् ॥ श्रीशङ्कराचार्यवर्यं राजाधिराजाभिपूज्यं रम्यशृङ्गाद्रिवासैकलोलं यतीड्यम्
    । राकेन्दुसङ्काशवक्त्रं रत्नगर्भेभवक्त्राङ्घ्रिपूजानुरक्तम् ॥ श्रीशङ्कराचार्यवर्यं श्रीभारतीतीर्थगीतं
    शङ्करार्यस्तवं यः पठेद्भक्तियुक्तः । सोऽवाप्नुयात्सर्वमिष्टं शङ्कराचार्यवर्यप्रसादेन तूर्णम् ॥ श्रीशङ्कराचार्यवर्यं
