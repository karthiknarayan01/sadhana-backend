id: narayaniyam-dashaka-94
category: stotram
name:
  english: Narayaniyam Dashaka 94
content:
  english: shuddha nishkamadharmaih pravaragurugira tatsvarupam param te shuddham dehendriyadivyapagatamakhilavyaptamavedayante
    | nanatvasthaulyakarshyadi tu gunajavapussangato'dhyasitam te vahnerdaruprabhedeshviva mahadanutadiptatashantatadi
    || || acaryakhyadharastharanisamanumilacchishyarupottarara nyavedhodbhasitena sphutataraparibodhagnina
    dahyamane | karmalivasanatatkritatanubhuvanabhrantikantarapure dahyabhavena vidyashikhini ca virate
    tvanmayi khalvavastha || || evam tvatpraptito'nyo nahi khalu nikhilakleshahanerupayo naikantatyantikaste
    krishivadagadashadgunyashatkarmayogah | durvaikalyairakalya api nigamapathastatphalanyapyavapta mattastvam
    vismarantah prasajati patane yantyanantan vishadan|| || tvallokadanyalokah kvanu bhayarahito yat parardhadvayante
    tvadbhitassatyaloke'pi na sukhavasatih padmabhuh padmanabha | evam bhave tvadharmarjitabahutamasam
    ka katha narakanam tanme tvam chindhi bandham varad kripanabandho kripapurasindho || || yatharthyattvanmayasyaiva
    hi mama na vibho vastuto bandhamokshau mayavidyatanubhyam tava tu viracitau svapnabodhopamau tau |
    baddhe jivadvimuktim gatavati ca bhida tavati tavadeko bhunkte dehadrumastho vishayaphalarasannaparo
    nirvyathatma || || jivanmuktatvamevamvidhamiti vacasa kim phalam duradure tannamashuddhabuddherna
    ca laghu manasashshodhanam bhaktito'nyat | tanme vishno krishishthastvayi kritasakalaprarpanam bhaktibharam
    yena syam mankshu kincid guruvacanamilattvatprabodhastvadatma || || shabdbrahmanyapiha prayatitamanasastvam
    na jananti kecit kashtam vandhyashramaste cirataramiha gam bibhrate nishprasutim | yasyam vishvabhiramassakalamalahara
    divyalilavatarah saccitsandram ca rupam tava na nigaditam tam na vacam bhriyasam || || yo yavan yadrisho
    va tvamiti kimapi naivavagacchami bhum nnevancananyabhavastvadanubhajanamevadriye caidyavairin | tvallinganam
    tvadanghripriyajanasadasam darshanasparshanadi rbhuyanme tvatprapujanatinutigunakarmanukirtyadaro'pi
    || || yadyallabhyeta tattattava samupahritam deva daso'smi te'ham tvadgehonmarjanadyam bhavatu mama
    muhuh karma nirmayameva | suryagnibrahmanatmadishu lasitacaturbahumaradhaye tvam tvatpremardratvarupo
    mama satatamabhishyandatam bhaktiyogah || || aikyam te danahomavrataniyamatapassankhyayogairdurapam
    tvatsangenaiva gopyah kila sukrititama prapuranandasandram | bhakteshvanyeshu bhuyassvapi bahumanushe
    bhaktimeva tvamasam tanme tvadbhaktimeva dradhaya hara gadan krishna vatalayesha ||
  devanagari: शुद्धा निष्कामधर्मैः प्रवरगुरुगिरा तत्स्वरूपं परं ते शुद्धं देहेन्द्रियादिव्यपगतमखिलव्याप्तमावेदयन्ते
    । नानात्वस्थौल्यकार्श्यादि तु गुणजवपुस्सङ्गतोऽध्यासितं ते वह्नेर्दारुप्रभेदेष्विव महदणुतादीप्तताशान्ततादि
    ॥ ॥ आचार्याख्याधरस्थारणिसमनुमिलच्छिष्यरूपोत्तरार ण्यावेधोद्भासितेन स्फुटतरपरिबोधाग्निना दह्यमाने ।
    कर्मालीवासनातत्कृततनुभुवनभ्रान्तिकान्तारपूरे दाह्याभावेन विद्याशिखिनि च विरते त्वन्मयी खल्ववस्था ॥
    ॥ एवं त्वत्प्राप्तितोऽन्यो नहि खलु निखिलक्लेशहानेरुपायो नैकान्तात्यन्तिकास्ते कृषिवदगदषाड्गुण्यषट्कर्मयोगाः
    । दुर्वैकल्यैरकल्या अपि निगमपथास्तत्फलान्यप्यवाप्ता मत्तास्त्वां विस्मरन्तः प्रसजति पतने यान्त्यनन्तान्
    विषादान्॥ ॥ त्वल्लोकादन्यलोकः क्वनु भयरहितो यत् परार्धद्वयान्ते त्वद्भीतस्सत्यलोकेऽपि न सुखवसतिः पद्मभूः
    पद्मनाभ । एवं भावे त्वधर्मार्जितबहुतमसां का कथा नारकाणां तन्मे त्वं छिन्धि बन्धं वरद् कृपणबन्धो कृपापूरसिन्धो
    ॥ ॥ याथार्थ्यात्त्वन्मयस्यैव हि मम न विभो वस्तुतो बन्धमोक्षौ मायाविद्यातनुभ्यां तव तु विरचितौ स्वप्नबोधोपमौ
    तौ । बद्धे जीवद्विमुक्तिं गतवति च भिदा तावती तावदेको भुङ्क्ते देहद्रुमस्थो विषयफलरसान्नापरो निर्व्यथात्मा
    ॥ ॥ जीवन्मुक्तत्वमेवंविधमिति वचसा किं फलं दूरदूरे तन्नामाशुद्धबुद्धेर्न च लघु मनसश्शोधनं भक्तितोऽन्यत्
    । तन्मे विष्णो कृषीष्ठास्त्वयि कृतसकलप्रार्पणं भक्तिभारं येन स्यां मङ्क्षु किञ्चिद् गुरुवचनमिलत्त्वत्प्रबोधस्त्वदात्मा
    ॥ ॥ शब्द्ब्रह्मण्यपीह प्रयतितमनसस्त्वां न जानन्ति केचित् कष्टं वन्ध्यश्रमास्ते चिरतरमिह गां बिभ्रते
    निष्प्रसूतिम् । यस्यां विश्वाभिरामास्सकलमलहरा दिव्यलीलावताराः सच्चित्सान्द्रं च रूपं तव न निगदितं
    तां न वाचं भ्रियासम् ॥ ॥ यो यावान् यादृशो वा त्वमिति किमपि नैवावगच्छामि भूम् न्नेवञ्चानन्यभावस्त्वदनुभजनमेवाद्रिये
    चैद्यवैरिन् । त्वल्लिङ्गानां त्वदङ्घ्रिप्रियजनसदसां दर्शनस्पर्शनादि र्भूयान्मे त्वत्प्रपूजानतिनुतिगुणकर्मानुकीर्त्यादरोऽपि
    ॥ ॥ यद्यल्लभ्येत तत्तत्तव समुपहृतं देव दासोऽस्मि तेऽहं त्वद्गेहोन्मार्जनाद्यं भवतु मम मुहुः कर्म निर्मायमेव
    । सूर्याग्निब्राह्मणात्मादिषु लसितचतुर्बाहुमाराधये त्वां त्वत्प्रेमार्द्रत्वरूपो मम सततमभिष्यन्दतां
    भक्तियोगः ॥ ॥ ऐक्यं ते दानहोमव्रतनियमतपस्साङ्ख्ययोगैर्दुरापं त्वत्सङ्गेनैव गोप्यः किल सुकृतितमा प्रापुरानन्दसान्द्रम्
    । भक्तेष्वन्येषु भूयस्स्वपि बहुमनुषे भक्तिमेव त्वमासां तन्मे त्वद्भक्तिमेव द्रढय हर गदान् कृष्ण वातालयेश
    ॥
