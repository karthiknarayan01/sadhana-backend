id: chanakya-neethi-chapter-4
category: stotram
name:
  english: Chanakya Neethi - Chapter 4
content:
  english: ayuh karma ca vittam ca vidya nidhanameva ca | pancaitani hi srijyante garbhasthasyaiva dehinah
    || || sadhubhyaste nivartante putramitrani bandhavah | ye ca taih saha gantarastaddharmatsukritam
    kulam || || darshanadhyanasamsparshairmatsi kurmi ca pakshini | shishum palayate nityam tatha sajjana
    || yavatsvastho hyayam deho yavanmrityushca duratah | tavadatmahitam kuryatpranante kim karishyati
    || || kamadhenuguna vidya hyakale phaladayini | pravase matrisadrishi vidya guptam dhanam smritam
    || || eko'pi gunavanputro nirgunena shatena kim | ekashcandrastamo hanti na ca tarah sahasrashah ||
    || murkhashcirayurjato'pi tasmajjatamrito varah | mritah sa calpaduhkhaya yavajjivam jado dahet ||
    || kugramavasah kulahinaseva kubhojanam krodhamukhi ca bharya | putrashca murkho vidhava ca kanya
    vinagnina shatpradahanti kayam || || kim taya kriyate dhenva ya na dogdhri na garbhini | ko'rthah
    putrena jatena yo na vidvan na bhaktiman || || samsaratapadagdhanam trayo vishrantihetavah | apatyam
    ca kalatram ca satam sangatireva ca || || sakrijjalpanti rajanah sakrijjalpanti panditah | sakritkanyah
    pradiyante trinyetani sakritsakrit || || ekakina tapo dvabhyam pathanam gayanam tribhih | caturbhirgamanam
    kshetram pancabhirbahubhi ranah || || sa bharya ya shucirdaksha sa bharya ya pativrata | sa bharya
    ya patiprita sa bharya satyavadini || || aputrasya griham shunyam dishah shunyastvabandhavah | murkhasya
    hridayam shunyam sarvashunya daridrata || || anabhyase visham shastramajirne bhojanam visham | daridrasya
    visham goshthi vriddhasya taruni visham || || tyajeddharmam dayahinam vidyahinam gurum tyajet | tyajetkrodhamukhim
    bharyam nihsnehanbandhavamstyajet || || adhva jara dehavatam parvatanam jalam jara | amaithunam jara
    strinam vastranamatapo jara || || kah kalah kani mitrani ko deshah kau vyayagamau | kashcaham ka ca
    me shaktiriti cintyam muhurmuhuh || || agnirdevo dvijatinam muninam hridi daivatam | pratima svalpabuddhinam
    sarvatra samadarshinah ||
  devanagari: आयुः कर्म च वित्तं च विद्या निधनमेव च । पञ्चैतानि हि सृज्यन्ते गर्भस्थस्यैव देहिनः ॥ ॥ साधुभ्यस्ते
    निवर्तन्ते पुत्रमित्राणि बान्धवाः । ये च तैः सह गन्तारस्तद्धर्मात्सुकृतं कुलम् ॥ ॥ दर्शनध्यानसंस्पर्शैर्मत्सी
    कूर्मी च पक्षिणी । शिशुं पालयते नित्यं तथा सज्जन ॥ यावत्स्वस्थो ह्ययं देहो यावन्मृत्युश्च दूरतः ।
    तावदात्महितं कुर्यात्प्राणान्ते किं करिष्यति ॥ ॥ कामधेनुगुणा विद्या ह्यकाले फलदायिनी । प्रवासे मातृसदृशी
    विद्या गुप्तं धनं स्मृतम् ॥ ॥ एकोऽपि गुणवान्पुत्रो निर्गुणेन शतेन किम् । एकश्चन्द्रस्तमो हन्ति न च
    ताराः सहस्रशः ॥ ॥ मूर्खश्चिरायुर्जातोऽपि तस्माज्जातमृतो वरः । मृतः स चाल्पदुःखाय यावज्जीवं जडो दहेत्
    ॥ ॥ कुग्रामवासः कुलहीनसेवा कुभोजनं क्रोधमुखी च भार्या । पुत्रश्च मूर्खो विधवा च कन्या विनाग्निना षट्प्रदहन्ति
    कायम् ॥ ॥ किं तया क्रियते धेन्वा या न दोग्ध्री न गर्भिणी । कोऽर्थः पुत्रेण जातेन यो न विद्वान् न भक्तिमान्
    ॥ ॥ संसारतापदग्धानां त्रयो विश्रान्तिहेतवः । अपत्यं च कलत्रं च सतां सङ्गतिरेव च ॥ ॥ सकृज्जल्पन्ति
    राजानः सकृज्जल्पन्ति पण्डिताः । सकृत्कन्याः प्रदीयन्ते त्रीण्येतानि सकृत्सकृत् ॥ ॥ एकाकिना तपो द्वाभ्यां
    पठनं गायनं त्रिभिः । चतुर्भिर्गमनं क्षेत्रं पञ्चभिर्बहुभी रणः ॥ ॥ सा भार्या या शुचिर्दक्षा सा भार्या
    या पतिव्रता । सा भार्या या पतिप्रीता सा भार्या सत्यवादिनी ॥ ॥ अपुत्रस्य गृहं शून्यं दिशः शून्यास्त्वबान्धवाः
    । मूर्खस्य हृदयं शून्यं सर्वशून्या दरिद्रता ॥ ॥ अनभ्यासे विषं शास्त्रमजीर्णे भोजनं विषम् । दरिद्रस्य
    विषं गोष्ठी वृद्धस्य तरुणी विषम् ॥ ॥ त्यजेद्धर्मं दयाहीनं विद्याहीनं गुरुं त्यजेत् । त्यजेत्क्रोधमुखीं
    भार्यां निःस्नेहान्बान्धवांस्त्यजेत् ॥ ॥ अध्वा जरा देहवतां पर्वतानां जलं जरा । अमैथुनं जरा स्त्रीणां
    वस्त्राणामातपो जरा ॥ ॥ कः कालः कानि मित्राणि को देशः कौ व्ययागमौ । कश्चाहं का च मे शक्तिरिति चिन्त्यं
    मुहुर्मुहुः ॥ ॥ अग्निर्देवो द्विजातीनां मुनीनां हृदि दैवतम् । प्रतिमा स्वल्पबुद्धीनां सर्वत्र समदर्शिनः
    ॥
