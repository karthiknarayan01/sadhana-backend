id: shrisuktarthasangrahah
category: sukta
name:
  english: shrisuktarthasangrahah
  devanagari: श्रीसूक्तार्थसन्ग्रहः
content:
  english: shrisuktarthasangrahah hiranyam vishnurakhyatastasya varnastu vaishnavi | lakshmihiranyavarneti
    shruyate kanakaprabha || 1|| harinim tu hareh patnim daridryapariharinim | prapadye'ham haridrabham
    harinakshim hiranmayim || 2|| hiranyaretasah shambhoh shaktih prokta hiranmayi | dhanarthibhirupasyaisha
    jatavedasi sarvada || 3|| caturangabalopetam dhanadhanya sukheshvarim | ashvarudhamaham vande rajalakshmim
    hiranmayim || 4|| devairjushtamudaram ca padminimim bhajamyaham | tvam vrine tvatprasadena mamalakshmirvinashyatu
    || 5|| udyadadityasankasham bilvakananamadhyagam | tanumadhyam shriyam dhyayedalakshmipariharinim
    || 6|| kuberastapasa purvam toshayamasa shankaram | shivartham tu mahalakshmih kuberasya vashe sthita
    || 7|| tasmaddhi bhaktavatsalyam shridevyah prakatikritam | anugrihnati yam yam shristam kubero'nudhavati
    || 8|| khadgam savatacakranca kamalam varameva ca | karaishcaturbhirbibhranam dhyayeccandrananam shriyam
    || 9|| govrindanugatam dhyatva surabhim sasyamalinim | prithulam praninamisham durdharsham shriyamarcayet
    || 10|| tam dhyayet satyasankalpam lakshmim kshiraudanapriyam | khyatam sarveshu bhuteshu tattajjnanabalakriyam
    || 11|| savatsagauriva pritam kardamena tathendiram | kalyani madgrihe nityam nivaset padmamalinim
    || 12|| ciklita shrisuta svamin
  devanagari: श्रीसूक्तार्थसङ्ग्रहः हिरण्यं विष्णुराख्यातस्तस्य वर्णस्तु वैष्णवी । लक्ष्मीहिरण्यवर्णेति
    श्रूयते कनकप्रभा ॥ १॥ हरिणीं तु हरेः पत्नीं दारिद्र्यपरिहारिणीम् । प्रपद्येऽहं हरिद्राभां हरिणाक्षीं
    हिरण्मयीम् ॥ २॥ हिरण्यरेतसः शम्भोः शक्तिः प्रोक्ता हिरण्मयी । धनार्थिभिरूपास्यैषा जातवेदसि सर्वदा
    ॥ ३॥ चतुरङ्गबलोपेतां धनधान्य सुखेश्वरीम् । अश्वारूढामहं वन्दे राजलक्ष्मीं हिरण्मयीम् ॥ ४॥ देवैर्जुष्टामुदारां
    च पद्मिनीमीं भजाम्यहम् । त्वां वृणे त्वत्प्रसादेन ममालक्ष्मीर्विनश्यतु ॥ ५॥ उद्यदादित्यसङ्काशां बिल्वकाननमध्यगाम्
    । तनुमध्यां श्रियं ध्यायेदलक्ष्मीपरिहारिणीम् ॥ ६॥ कुबेरस्तपसा पूर्वं तोषयामास शङ्करम् । शिवार्थं तु
    महालक्ष्मीः कुबेरस्य वशे स्थिता ॥ ७॥ तस्माद्धि भक्तवात्सल्यं श्रीदेव्याः प्रकटीकृतम् । अनुगृह्णाति
    यं यं श्रीस्तं कुबेरोऽनुधावति ॥ ८॥ खड्गं सवातचक्रञ्च कमलं वरमेव च । करैश्चतुर्भिर्बिभ्राणां ध्यायेच्चन्द्राननां
    श्रियम् ॥ ९॥ गोवृन्दानुगतां ध्यात्वा सुरभिं सस्यमालिनीम् । पृथुलां प्राणिनामीशां दुर्धर्षां श्रियमर्चयेत्
    ॥ १०॥ तां ध्यायेत् सत्यसङ्कल्पां लक्ष्मीं क्षीरौदनप्रियाम् । ख्यातां सर्वेषु भूतेषु तत्तज्ज्ञानबलक्रियाम्
    ॥ ११॥ सवत्सागौरिव प्रीतां कर्दमेन तथेन्दिराम् । कल्याणी मद्गृहे नित्यं निवसेत् पद्ममालिनीम् ॥ १२॥
    चिक्लीत श्रीसुत स्वामिन्
