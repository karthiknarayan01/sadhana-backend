id: rahu-graha-pancharatna-stotram
category: stotram
name:
  english: Rahu Graha Pancharatna Stotram
content:
  english: ardhakayam mahaviryam candraditya vimardhanam | simhikagarbha sambhutam tam rahum pranamamyaham
    || || pranamami sada rahum sarpakaram kiritinam | saimhikeyam karalasyam bhaktanamabhaya pradam ||
    || shurpakarasana sthashca gomedhabharanapriyah | mashapriyah kashyaparshi nandanobhujageshvarah ||
    || arogyamayu rakhilamshca manorathardan | tamorupa namastubhyam prasadam kurusarvada || || karalavadanam
    khadga carmashula varanvitam | nilasimhasanam dhyayet rahum tam ca prashantaye ||
  devanagari: अर्धकायं महावीर्यं चन्द्रादित्य विमर्धनम् । सिंहिकागर्भ सम्भूतं तं राहुं प्रणमाम्यहम् ॥
    ॥ प्रणमामि सदा राहुं सर्पाकारं किरीटिनम् । सैंहिकेयं करालास्यं भक्तानामभय प्रदम् ॥ ॥ शूर्पाकारासन
    स्थश्च गोमेधाभरणप्रियः । माषप्रियः काश्यपर्षि नन्दनोभुजगेश्वरः ॥ ॥ आरोग्यमायु रखिलांश्च मनोरथार्दान्
    । तमोरूप नमस्तुभ्यं प्रसादं कुरुसर्वदा ॥ ॥ करालवदनं खड्ग चर्मशूल वरान्वितम् । नीलसिंहासनं ध्यायेत्
    राहुं तं च प्रशान्तये ॥
