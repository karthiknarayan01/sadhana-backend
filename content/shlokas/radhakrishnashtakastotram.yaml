id: radhakrishnashtakastotram
category: stotram
name:
  english: radhakrishnashtakastotram
  devanagari: राधाकृष्णाष्टकस्तोत्रम्
content:
  english: rmudaradhyam pushpamala sushobhitam | smarami radhikakrishnam bhaktavanchapradayakam || 3||
    bhaktom ke uttama manoratha ko pradana karane vale sahacari janom se parama sundara aradhyamana pushpamala
    se sushobhita shriradhakrishna bhagavan ka smarana karate haim || 3|| suravrindaih sada sevyam radhakrishnam
    namamyaham | ananyarasikairdhyayam jagadbijam vrajadhipam || 4|| ananya rasikom ke dvara dhyana kiye
    jane vale aura devaganom ke dvara sada parisevita evam isa sampurna jagat ke ekamatra karana vrajeshvara
    shriradhakrishna bhagavan ko hama abhinamana karate haim || 4|| shrutimantraih samaradhyam giyamanam
    sudhijanaih | radhakrishnam prabhate ca pranamami kripaspadam || 5|| vedamantrom se aradhyamana evam
    vidvajanom dvara jinaka gunagana hota hai
  devanagari: र्मुदाराध्यं पुष्पमाला सुशोभितम् । स्मरामि राधिकाकृष्णं भक्तवाञ्छाप्रदायकम् ॥ ३॥ भक्तों
    के उत्तम मनोरथ को प्रदान करने वाले सहचरी जनों से परम सुन्दर आराध्यमान पुष्पमाला से सुशोभित श्रीराधाकृष्ण
    भगवान् का स्मरण करते हैं ॥ ३॥ सुरवृन्दैः सदा सेव्यं राधाकृष्णं नमाम्यहम् । अनन्यरसिकैर्ध्ययं जगद्बीजं
    व्रजाधिपम् ॥ ४॥ अनन्य रसिकों के द्वारा ध्यान किये जाने वाले और देवगणों के द्वारा सदा परिसेवित एवं
    इस सम्पूर्ण जगत् के एकमात्र कारण व्रजेश्वर श्रीराधाकृष्ण भगवान् को हम अभिनमन करते हैं ॥ ४॥ श्रुतिमन्त्रैः
    समाराध्यं गीयमानं सुधीजनैः । राधाकृष्णं प्रभाते च प्रणमामि कृपास्पदम् ॥ ५॥ वेदमन्त्रों से आराध्यमान
    एवं विद्वजनों द्वारा जिनका गुणगान होता है
