id: ambarishakritam2vishnustotram
category: stotram
name:
  english: ambarishakritam2vishnustotram
  devanagari: अम्बरीषकृतं२विष्णुस्तोत्रम्
content:
  english: 40|| deva tvannamakirtyapi jayante sarvasiddhayah | kautukattvam hi mrigyanti vidvamso buddhishalinah
    || 41|| natha tvatpadasalilam samshrayattapaharakam | tapatrayabhibhutasya bhaktim me'tra dridham
    kuru || 42|| ananyasvamino me'dya nastyanyatprarthaniyakam | pranipatya jagannatha tvam prayace sahasradha
    || 43|| samastapurusharthasya bijam tvatpadapankaje | yavatpranandharayami tavadbhaktirdridhastu me
    || 44|| srishtim vinirmame cemam yaya bhaktya pitamahah | samharatyakhilam rudro lakshmishcaishvaryadayini
    || 45|| dinanukampimstam bhaktim prarthaye nanyamanasah | anadyavidyapanke'sminsudridhe dustaram bhrisham
    || 46|| nimagnasya jagannatha niralambam pranashyatah | mahamahimnastvadbhakternanyadasti parayanam
    || 47|| shrutismrityadisambhinnamargah sammohahetavah | tvadbhaktimapahayete na pravarttitumishvarah
    || 48|| ananyasharanam svaminnanukampaya mam vibho | iti stuvanjagannathapadapadmantike muda || 49||
    papata dandavadbhumau prasideti vadanmuhuh || iti shriskandapurane vaishnavakhande purushottamajagannathamahatmye
    pancamadhyayantargatam ambarishakritam vishnustotram samaptam | skandapurana | vaishnavakhanda | purushottamakhanda
    | adhyaya 5
  devanagari: ४०॥ देव त्वन्नामकीर्त्यापि जायन्ते सर्वसिद्धयः । कौतुकात्त्वां हि मृग्यन्ति विद्वांसो बुद्धिशालिनः
    ॥ ४१॥ नाथ त्वत्पादसलिलं संश्रयात्तापहारकम् । तापत्रयाभिभूतस्य भक्तिं मेऽत्र दृढां कुरु ॥ ४२॥ अनन्यस्वामिनो
    मेऽद्य नास्त्यन्यत्प्रार्थनीयकम् । प्रणिपत्य जगन्नाथ त्वां प्रयाचे सहस्रधा ॥ ४३॥ समस्तपुरुषार्थस्य
    बीजं त्वत्पादपङ्कजे । यावत्प्राणान्धारयामि तावद्भक्तिर्दृढास्तु मे ॥ ४४॥ सृष्टिं विनिर्ममे चेमां यया
    भक्त्या पितामहः । संहरत्यखिलं रुद्रो लक्ष्मीश्चैश्वर्यदायिनी ॥ ४५॥ दीनानुकम्पिंस्तां भक्तिं प्रार्थये
    नान्यमानसः । अनाद्यविद्यापङ्केऽस्मिन्सुदृढे दुस्तरं भृशम् ॥ ४६॥ निमग्नस्य जगन्नाथ निरालम्बं प्रणश्यतः
    । महामहिम्नस्त्वद्भक्तेर्नान्यदस्ति परायणम् ॥ ४७॥ श्रुतिस्मृत्यादिसम्भिन्नमार्गाः सम्मोहहेतवः । त्वद्भक्तिमपहायेते
    न प्रवर्त्तितुमीश्वराः ॥ ४८॥ अनन्यशरणं स्वामिन्ननुकम्पय मां विभो । इति स्तुवञ्जगन्नाथपादपद्मान्तिके
    मुदा ॥ ४९॥ पपात दण्डवद्भूमौ प्रसीदेति वदन्मुहुः ॥ इति श्रीस्कन्दपुराणे वैष्णवखण्डे पुरुषोत्तमजगन्नाथमाहात्म्ये
    पञ्चमाध्यायान्तर्गतं अम्बरीषकृतं विष्णुस्तोत्रं समाप्तम् । स्कन्दपुराण । वैष्णवखण्ड । पुरुषोत्तमखण्ड
    । अध्याय ५
