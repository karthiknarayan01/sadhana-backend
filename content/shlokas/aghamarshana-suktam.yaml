id: aghamarshana-suktam
category: stotram
name:
  english: Aghamarshana Suktam
content:
  english: mme dehi yacitah | yanmaya bhuktamasadhuna mpapebhyashca pratigrahah | yanme manasa vaca karmana
    va dushkrita nkritam | tanna indro varuno brihaspatih savita ca punantu punah punah | namo 'psumate
    nama indraya namo varunaya namo varunyai namo ntadapagacchatat | atyashanadati dyacca ugratpratigraha
    t | tanno varuno raja panina 'hamapapo virajo nirmukto muktakilbishah | nakasya prishtha maruhya gacched
    brahmasalokatam | yashcapsu varunassa punatvaghamar mme gange yamune sarasvati shutudri stomagm sacata
    parushniya | asikniya marudvridhe vitastaya ''rjikiye shrinuhya sushomaya | rita 'dhyajayata | tato
    ratrirajayata tata ssamudro arnavah || samudradarnava dadhi sam va~thsaro ajayata | ahoratrani vidadhadvishvasya
    mishato vashi | suryacandramasau dhata yatha purvamakalpayat | diva matho suvah | yatprithivyagm rajah
    svamantarikshe virodasi | imaggm stadapo varunah punatvaghamar shanah | punantu vasavah punatu varunah
    punatvaghamar shanah | esha bhutasya madhye bhuvanasya gopta | esha punyakritam lo~kanesha mrityor
    hiranmayam | dyavaprithivyor hiranmayagm saggm shritagm suvah || sana ssagmshishadhi | ardra njvalati
    jyotirahamasmi | jyotirjvalati brahmahamasmi | yo 'hamasmi brahmahamasmi | ahamasmi brahmahamasmi
    | ahamevaha | akaryakaryavakirnisteno bhrunaha gurutalpagah | varuno tpramucyate | rajobhumi stvamagm
    rodayasva pravadanti dhirah thsamudrah prathame vidharmanjanaya npraja bhuvanasya raja | vrisha pavitre
    adhisano avye brihatsomo vavridhe suvana induh ||
  devanagari: म्मे॑ देहि॒ याचि॑तः । य॒न्मया॑ भु॒क्तम॒साधू॑ना म्पा॒पेभ्य॑श्च प्र॒तिग्र॑हः । यन्मे॒ मन॑सा
    वा॒चा॒ क॒र्म॒णा वा दु॑ष्कृत॒ ङ्कृतम् । तन्न॒ इन्द्रो॒ वरु॑णो॒ बृह॒स्पतिः॑ सवि॒ता च॑ पुनन्तु॒ पुनः॑
    पुनः । नमो॒ ऽप्सु॒मते॒ नम॒ इन्द्रा॑य॒ नमो॒ वरु॑णाय॒ नमो वारुण्यै॑ नमो॒ न्तदप॑गच्छतात् । अ॒त्या॒श॒नाद॑ती
    द्य॒च्च उ॒ग्रात्प्र॑ति॒ग्रहा त् । तन्नो॒ वरु॑णो रा॒जा॒ पा॒णिना ऽहम॑पा॒पो वि॒रजो॒ निर्मु॒क्तो मु॑क्तकि॒ल्बिषः॑
    । नाक॑स्य पृ॒ष्ठ मारु॑ह्य॒ गच्छे॒द् ब्रह्म॑सलो॒कताम् । यश्चा॒प्सु वरु॑ण॒स्स पु॒नात्व॑घमर् म्मे॑ गङ्गे
    यमुने सरस्वति॒ शुतु॑द्रि॒ स्तोमग्ं॑ सचता॒ परु॒ष्णिया । अ॒सि॒क्नि॒या म॑रुद्वृधे वि॒तस्त॒या ऽऽर्जी॑कीये
    शृणु॒ह्या सु॒षोम॑या । ऋ॒त ऽध्य॑जायत । ततो॒ रात्रि॑रजायत॒ तत॑ स्समु॒द्रो अ॑र्ण॒वः ॥ स॒मु॒द्राद॑र्ण॒वा
    दधि॑ सं वँथ्स॒रो अ॑जायत । अ॒हो॒रा॒त्राणि॑ वि॒दध॒द्विश्व॑स्य मिष॒तो व॒शी । सू॒र्या॒च॒न्द्र॒मसौ॑ धा॒ता
    य॑था पू॒र्वम॑कल्पयत् । दिव॑ मथो॒ सुवः॑ । यत्पृ॑थि॒व्याग्ं रजः॑ स्व॒मान्तरि॑क्षे वि॒रोद॑सी । इ॒माग्ग्ं
    स्तदा॒पो व॑रुणः पु॒नात्व॑घमर् ष॒णः । पु॒नन्तु॒ वस॑वः पु॒नातु॒ वरु॑णः पु॒नात्व॑घमर् ष॒णः । ए॒ष भू॒तस्य॑
    म॒ध्ये भुव॑नस्य गो॒प्ता । ए॒ष पु॒ण्यकृ॑तां लोँ॒का॒ने॒ष मृ॒त्योर् हि॑र॒ण्मयम् । द्यावा॑पृथि॒व्योर्
    हि॑र॒ण्मय॒ग्ं॒ सग्ग्ं श्रि॑त॒ग्ं॒ सुवः॑ ॥ सन॒ स्सग्ंशि॑शाधि । आर्द्र॒ ञ्ज्वल॑ति॒ ज्योति॑र॒हम॑स्मि
    । ज्योति॒र्ज्वल॑ति॒ ब्रह्मा॒हम॑स्मि । यो॑ ऽहम॑स्मि॒ ब्रह्मा॒हम॑स्मि । अ॒हम॑स्मि॒ ब्रह्मा॒हम॑स्मि ।
    अ॒हमे॒वाह । अ॒का॒र्य॒का॒र्य॑वकी॒र्णीस्ते॒नो भ्रू॑ण॒हा गु॑रुत॒ल्पगः । वरु॑णो॒ त्प्रमु॑च्यते । र॒जोभूमि॑
    स्त्व॒माग्ं रोद॑यस्व॒ प्रव॑दन्ति॒ धीराः थ्समु॒द्रः प्र॑थ॒मे विध॑र्मञ्ज॒नय॑ न्प्र॒जा भुव॑नस्य॒ राजा
    । वृषा॑ प॒वित्रे॒ अधि॒सानो॒ अव्ये॑ बृ॒हत्सोमो॑ वावृधे सुवा॒न इन्दुः॑ ॥
