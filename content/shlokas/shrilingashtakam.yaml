id: shrilingashtakam
category: stotram
name:
  english: shrilingashtakam
  devanagari: श्रीलिङ्गाष्टकम्
content:
  english: brahmamurari surarcita lingam nirmalabhasitashobhitalingam | janmajaduhkhavinashakalingam tatpranamami
    sadashivalingam || 1 || devamunipravararcitalingam kamadahanakarunakaralingam | ravanadarpavinashanalingam
    tatpranamami sadashivalingam || 2 || sarvasugandhasulepitalingam buddhivivardhanakaranalingam | siddhasurasuravanditalingam
    tatpranamami sadashivalingam || 3 || kanakamahamanibhushitalingam phanipativeshtitashobhitalingam
    | dakshasuyajnaninashanalingam tatpranamami sadashivalingam || 4 || kunkumacandanalepitalingam pankajaharasushobhitalingam
    | sancitapapavinashanalingam tatpranamami sadashivalingam || 5 || devaganarcitasevitalingam bhavairbhaktibhireva
    ca lingam | dinakarakotiprabhakaralingam tatpranamami sadashivalingam || 6 || ashtadaloparireshtitalingam
    sarvasamudbhavakaranalingam | ashtadaridravinashanalingam tatpranamami sadashivalingam || 7 || suragurusuravarapujitalingam
    suravanapushpasadarcitalingam | paratparam paramatmakalingam tatpranamami sadashivalingam || 8 ||
    lingashtakamidam punyam yah patheshshiva sannidhau | shivalokamavapnoti shivena saha modate ||
  devanagari: ब्रह्ममुरारि सुरार्चित लिङ्गम् निर्मलभासितशोभितलिङ्गम् । जन्मजदुःखविनाशकलिङ्गम् तत्प्रणमामि
    सदाशिवलिङ्गम् ॥ १ ॥ देवमुनिप्रवरार्चितलिङ्गम् कामदहनकरुणाकरलिङ्गम् । रावणदर्पविनाशनलिङ्गम् तत्प्रणमामि
    सदाशिवलिङ्गम् ॥ २ ॥ सर्वसुगन्धसुलेपितलिङ्गम् बुद्धिविवर्धनकारणलिङ्गम् । सिद्धसुरासुरवन्दितलिङ्गम्
    तत्प्रणमामि सदाशिवलिङ्गम् ॥ ३ ॥ कनकमहामणिभूषितलिङ्गम् फणिपतिवेष्टितशोभितलिङ्गम् । दक्षसुयज्ञनिनाशनलिङ्गम्
    तत्प्रणमामि सदाशिवलिङ्गम् ॥ ४ ॥ कुङ्कुमचन्दनलेपितलिङ्गम् पङ्कजहारसुशोभितलिङ्गम् । सञ्चितपापविनाशनलिङ्गम्
    तत्प्रणमामि सदाशिवलिङ्गम् ॥ ५ ॥ देवगणार्चितसेवितलिङ्गम् भावैर्भक्तिभिरेव च लिङ्गम् । दिनकरकोटिप्रभाकरलिङ्गम्
    तत्प्रणमामि सदाशिवलिङ्गम् ॥ ६ ॥ अष्टदलोपरिरेष्टितलिङ्गम् सर्वसमुद्भवकारणलिङ्गम् । अष्टदरिद्रविनाशनलिङ्गम्
    तत्प्रणमामि सदाशिवलिङ्गम् ॥ ७ ॥ सुरगुरुसुरवरपूजितलिङ्गम् सुरवनपुष्पसदार्चितलिङ्गम् । परात्परं परमात्मकलिङ्गं
    तत्प्रणमामि सदाशिवलिङ्गम् ॥ ८ ॥ लिङ्गाष्टकमिदं पुण्यं यः पठेश्शिव सन्निधौ । शिवलोकमवाप्नोति शिवेन
    सह मोदते ॥
