id: navagrahamjyoti
category: stotram
name:
  english: navagrahamjyoti
  devanagari: नवग्रहम्ज्योति
content:
  english: cittapradam sharvanipriyamandiram budhanutam tam karkatesham bhaje || 2|| bhaumam shaktidharam
    trikonanilayam raktangamangarakam | bhudam mangalavasaram grahavaram shrivaidyanatharcakam | kruram
    shanmukhadaivatam mrigagrihoccam raktadhatvishvaram nityam vrishcikamesharashipatimarkendupriyam bhavaye
    || 3|| saumyam simharatham budham kujaripum shricandra
  devanagari: चित्तप्रदं शर्वाणीप्रियमन्दिरं बुधनुतं तं कर्कटेशं भजे ॥ २॥ भौमं शक्तिधरं त्रिकोणनिलयं रक्ताङ्गमङ्गारकम्
    । भूदं मङ्गलवासरं ग्रहवरं श्रीवैद्यनाथार्चकम् । क्रूरं षण्मुखदैवतं मृगगृहोच्चं रक्तधात्वीश्वरं नित्यं
    वृश्चिकमेषराशिपतिमर्केन्दुप्रियं भावये ॥ ३॥ सौम्यं सिंहरथं बुधं कुजरिपुं श्रीचन्द्र
meaning: {}
