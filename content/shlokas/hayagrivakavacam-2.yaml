id: hayagrivakavacam-2
category: kavacha
name:
  english: hayagrivakavacam 2
  devanagari: हयग्रीवकवचम् २
content:
  english: kalashambudhisankasham kamalayatalocanam | kalanidhikritavasam karnikantaravasinam || 1|| jnanamudrakshavalayashankhacakralasatkaram
    | bhushakiranasandohavirajitadigantaram || 2|| vaktrabjanirgatoddamavanisantanashobhitam | devatasarvabhaumam
    tam dhyaye dishtarthasiddhaye || 3|| om hayagrivashshirah patu lalatam candramadhyagah | shastradrishtirdrishau
    patu shabdabrahmatmakashshruti || 1|| ghranam gandhatmakah patu vadanam yajnasambhavah | jihvam vagishvarah
    patu mukundo dantasamhatih || 2|| oshtham brahmatmakah patu patu narayano'dharam | shivatma cibukam
    patu kapolau kamala prabhuh || 3|| vidyatma pithakam patu kantham nadatmako mama | bhujau caturbhujah
    patu karau daityendramardanah || 4|| jnanatma hridayam patu vishvatma tu kucadvayam | madhyamam patu
    sarvatma patu pitambarah katim || 5|| kukshim kukshisthavishvo me balibhango valitrayam | nabhim me
    padmanabho'vyadguhyam guhyarthabodhakrit || 6|| uru damodarah patu januni madhusudanah | patu janghe
    mahavishnurgulbhau patu janardanah || 7|| padau trivikramah patu patu padangulirharih | sarvangam
    sarvagah patu patu romani keshavah || 8|| dhatunnadigatah patu bharyam lakshmipatirmama | putranvishvakutumbi
    me patu bandhunsureshvarah || 9|| mitram mitratmakah patu vahnyatma shatrusamhatih | prananvayvatmakah
    patu kshetram vishvambharatmakah || 10|| varunatma rasanpatu vyomatma hridguhantaram | divaratram
    hrishikeshah patu sarvam jagadguruh || 11|| vishame sankate caiva patu kshemankaro mama | saccidanandarupo
    me jnanam rakshatu sarvada || 12|| pracyam rakshatu sarvatma agneyyam jnanadipakah | yamyam bodhapradah
    patu nairrityam ciddhanaprabhah || 13|| vidyanidhistu varunyam vayavyam cinmayo'vatu | kauberyam vittadah
    patu aishanyam ca jagadguruh || 14|| urdhvam patu jagatsvami patvadhastatparatparah | rakshahinantu
    yatsthanam rakshatvakhilanayakah || 14|| evam nyastashariro'sau sakshadvagishvaro bhavet | ayurarogyamaishvaryam
    sarvashastrapravaktritam || 16|| labhate natra sandeho hayagrivaprasadatah | itidam kirtitam divyam
    kavacam devapujitam || 17|| iti hayagrivatantre atharvanavede mantrakhande purvasamhitayam shrihayagrivakavacam
    sampurnam ||
  devanagari: कलशाम्बुधिसङ्काशं कमलायतलोचनम् । कलानिधिकृतावासं कर्णिकान्तरवासिनम् ॥ १॥ ज्ञानमुद्राक्षवलयशङ्खचक्रलसत्करम्
    । भूषाकिरणसन्दोहविराजितदिगन्तरम् ॥ २॥ वक्त्राब्जनिर्गतोद्दामवाणीसन्तानशोभितम् । देवतासार्वभौमं तं
    ध्याये दिष्टार्थसिद्धये ॥ ३॥ ॐ हयग्रीवश्शिरः पातु ललाटं चन्द्रमध्यगः । शास्त्रदृष्टिर्दृशौ पातु शब्दब्रह्मात्मकश्श्रुती
    ॥ १॥ घ्राणं गन्धात्मकः पातु वदनं यज्ञसम्भवः । जिह्वां वागीश्वरः पातु मुकुन्दो दन्तसंहतीः ॥ २॥ ओष्ठं
    ब्रह्मात्मकः पातु पातु नारायणोऽधरम् । शिवात्मा चिबुकं पातु कपोलौ कमला प्रभुः ॥ ३॥ विद्यात्मा पीठकं
    पातु कण्ठं नादात्मको मम । भुजौ चतुर्भुजः पातु करौ दैत्येन्द्रमर्दनः ॥ ४॥ ज्ञानात्मा हृदयं पातु विश्वात्मा
    तु कुचद्वयम् । मध्यमं पातु सर्वात्मा पातु पीताम्बरः कटिम् ॥ ५॥ कुक्षिं कुक्षिस्थविश्वो मे बलिभङ्गो
    वलित्रयम् । नाभिं मे पद्मनाभोऽव्याद्गुह्यं गुह्यार्थबोधकृत् ॥ ६॥ ऊरू दामोदरः पातु जानुनी मधुसूदनः
    । पातु जङ्घे महाविष्णुर्गुल्भौ पातु जनार्दनः ॥ ७॥ पादौ त्रिविक्रमः पातु पातु पादाङ्गुलीर्हरिः । सर्वाङ्गं
    सर्वगः पातु पातु रोमाणि केशवः ॥ ८॥ धातुन्नाडीगतः पातु भार्यां लक्ष्मीपतिर्मम । पुत्रान्विश्वकुटुम्बी
    मे पातु बन्धून्सुरेश्वरः ॥ ९॥ मित्रं मित्रात्मकः पातु वह्न्यात्मा शत्रुसंहतीः । प्राणान्वाय्वात्मकः
    पातु क्षेत्रं विश्वम्भरात्मकः ॥ १०॥ वरुणात्मा रसान्पातु व्योमात्मा हृद्गुहान्तरम् । दिवारात्रं हृषीकेशः
    पातु सर्वं जगद्गुरुः ॥ ११॥ विषमे सङ्कटे चैव पातु क्षेमङ्करो मम । सच्चिदानन्दरूपो मे ज्ञानं रक्षतु
    सर्वदा ॥ १२॥ प्राच्यां रक्षतु सर्वात्मा आग्नेय्यां ज्ञानदीपकः । याम्यां बोधप्रदः पातु नैरृत्यां चिद्धनप्रभः
    ॥ १३॥ विद्यानिधिस्तु वारुण्यां वायव्यां चिन्मयोऽवतु । कौबेर्यां वित्तदः पातु ऐशान्यां च जगद्गुरुः
    ॥ १४॥ ऊर्ध्वं पातु जगत्स्वामी पात्वधस्तात्परात्परः । रक्षाहीनन्तु यत्स्थानं रक्षत्वखिलनायकः ॥ १४॥
    एवं न्यस्तशरीरोऽसौ साक्षाद्वागीश्वरो भवेत् । आयुरारोग्यमैश्वर्यं सर्वशास्त्रप्रवक्तृताम् ॥ १६॥ लभते
    नात्र सन्देहो हयग्रीवप्रसादतः । इतीदं कीर्तितं दिव्यं कवचं देवपूजितम् ॥ १७॥ इति हयग्रीवतन्त्रे अथर्वणवेदे
    मन्त्रखण्डे पूर्वसंहितायां श्रीहयग्रीवकवचं सम्पूर्णम् ॥
