id: shivashtakam
category: stotram
name:
  english: Shivashtakam
  devanagari: शिवाष्टकम् १ (प्रभुं प्राणनाथं)
content:
  english: '|| atha shri shivashtakam || prabhum prananatham vibhum vishvanatham jagannathanatham sadanandabhajam
    | bhavadbhavyabhuteshvaram bhutanatham shivam shankaram shambhumishanamide || 1|| gale rundamalam
    tanau sarpajalam mahakalakalam ganeshadhipalam | jatajutagangottarangairvishalam shivam shankaram
    shambhumishanamide || 2|| mudamakaram mandanam mandayantam mahamandalam bhasmabhushadharam tam | anadihyaparam
    mahamohaharam shivam shankaram shambhumishanamide || 3|| vatadhonivasam mahattattahasam mahapapanasham
    sadasuprakasham | girisham ganesham mahesham suresham shivam shankaram shambhumishanamide || 4|| girindratmajasamgrahitardhadeham
    girau samsthitam sarvada sannageham | parabrahmabrahmadibhirvandyamanam shivam shankaram shambhumishanamide
    || 5|| kapalam trishulam karabhyam dadhanam padambhojanamraya kamam dadanam | balivardayanam suranam
    pradhanam shivam shankaram shambhumishanamide || 6|| sharaccandragatram gunananda patram trinetram
    pavitram dhaneshasya mitram | aparnakalatram caritram vicitram shivam shankaram shambhumishanamide
    || 7|| haram sarpaharam cita bhuviharam bhavam vedasaram sada nirvikaram | shmashane vasantam manojam
    dahantam shivam shankaram shambhumishanamide || 8|| stavam yah prabhate narah shulapane pathet sarvada
    bhargabhavanuraktah | sa putram dhanam dhanyamitram kalatram vicitram samasadya moksham prayati ||
    9|| || iti shivashtakam sampurnam ||'
  devanagari: ॥ अथ श्री शिवाष्टकम् ॥ प्रभुं प्राणनाथं विभुं विश्वनाथं जगन्नाथनाथं सदानन्दभाजम् । भवद्भव्यभूतेश्वरं
    भूतनाथं शिवं शङ्करं शम्भुमीशानमीडे ॥ १॥ गले रुण्डमालं तनौ सर्पजालं महाकालकालं गणेशाधिपालम् । जटाजूटगङ्गोत्तरङ्गैर्विशालं
    शिवं शङ्करं शम्भुमीशानमीडे ॥ २॥ मुदामाकरं मण्डनं मण्डयन्तं महामण्डलं भस्मभूषाधरं तम् । अनादिह्यपारं
    महामोहहारं शिवं शङ्करं शम्भुमीशानमीडे ॥ ३॥ वटाधोनिवासं महाट्टाट्टहासं महापापनाशं सदासुप्रकाशम् । गिरीशं
    गणेशं महेशं सुरेशं शिवं शङ्करं शम्भुमीशानमीडे ॥ ४॥ गिरिन्द्रात्मजासंग्रहीतार्धदेहं गिरौ संस्थितं सर्वदा
    सन्नगेहम् । परब्रह्मब्रह्मादिभिर्वन्द्यमानं शिवं शङ्करं शम्भुमीशानमीडे ॥ ५॥ कपालं त्रिशूलं कराभ्यां
    दधानं पदाम्भोजनम्राय कामं ददानम् । बलीवर्दयानं सुराणां प्रधानं शिवं शङ्करं शम्भुमीशानमीडे ॥ ६॥ शरच्चन्द्रगात्रं
    गुणानन्द पात्रं त्रिनेत्रं पवित्रं धनेशस्य मित्रम् । अपर्णाकलत्रं चरित्रं विचित्रं शिवं शङ्करं शम्भुमीशानमीडे
    ॥ ७॥ हरं सर्पहारं चिता भूविहारं भवं वेदसारं सदा निर्विकारम् । श्मशाने वसन्तं मनोजं दहन्तं शिवं शङ्करं
    शम्भुमीशानमीडे ॥ ८॥ स्तवं यः प्रभाते नरः शूलपाणे पठेत् सर्वदा भर्गभावानुरक्तः । स पुत्रं धनं धान्यमित्रं
    कलत्रं विचित्रं समासाद्य मोक्षं प्रयाति ॥ ९॥ ॥ इति शिवाष्टकं सम्पूर्णम् ॥
