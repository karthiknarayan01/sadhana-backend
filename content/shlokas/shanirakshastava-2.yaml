id: shanirakshastava-2
category: raksha
name:
  english: shanirakshastava
  devanagari: शनिरक्षास्तव
content:
  english: shrishanirakshastavah || purvapithika || shrinarada uvaca | dhyatva ganapatim raja dharmarajo
    yudhishthirah | dhirah shanaishcarasyemam cakara stavamuttamam || || mulapathah || || viniyogah ||
    om asya shrishanistavarajasya sindhudvipa rishih | gayatri chandah | shrishanaishcara devata | shrishanaishcaraprityarthe
    pathe viniyogah || || rishyadinyasah || shirasi sindhudviparshaye namah | mukhe gayatrichandase namah
    | hridi shrishanaishcaradevatayai namah | sarvange shrishanaishcaraprityarthe viniyogaya namah ||
    || stavah || shiro me bhaskarih patu bhalam chayasuto'vatu | kotaraksho drishau patu shikhikanthanibhah
    shruti || ghranam me bhishanah patu mukham balimukho'vatu | skandhau samvartakah patu bhujo me bhayado'vatu
    || saurirme hridayam patu nabhim shanaishcaro'vatu | graharajah katim patu sarvato ravinandanah ||
    padau mandagatih patu krishnah patvakhilam vapuh || || phalashrutih || rakshametam pathennityam saurernamabalairyutam
    | sukhi putri cirayushca sa bhavennatra samshayah || || iti shrishanirakshastavah ||
  devanagari: श्रीशनिरक्षास्तवः ॥ पूर्वपीठिका ॥ श्रीनारद उवाच । ध्यात्वा गणपतिं राजा धर्मराजो युधिष्ठिरः
    । धीरः शनैश्चरस्येमं चकार स्तवमुत्तमम् ॥ ॥ मूलपाठः ॥ ॥ विनियोगः ॥ ॐ अस्य श्रीशनिस्तवराजस्य सिन्धुद्वीप
    ऋषिः । गायत्री छन्दः । श्रीशनैश्चर देवता । श्रीशनैश्चरप्रीत्यर्थे पाठे विनियोगः ॥ ॥ ऋष्यादिन्यासः
    ॥ शिरसि सिन्धुद्वीपर्षये नमः । मुखे गायत्रीछन्दसे नमः । हृदि श्रीशनैश्चरदेवतायै नमः । सर्वाङ्गे श्रीशनैश्चरप्रीत्यर्थे
    विनियोगाय नमः ॥ ॥ स्तवः ॥ शिरो मे भास्करिः पातु भालं छायासुतोऽवतु । कोटराक्षो दृशौ पातु शिखिकण्ठनिभः
    श्रुती ॥ घ्राणं मे भीषणः पातु मुखं बलिमुखोऽवतु । स्कन्धौ संवर्तकः पातु भुजो मे भयदोऽवतु ॥ सौरिर्मे
    हृदयं पातु नाभिं शनैश्चरोऽवतु । ग्रहराजः कटिं पातु सर्वतो रविनन्दनः ॥ पादौ मन्दगतिः पातु कृष्णः पात्वखिलं
    वपुः ॥ ॥ फलश्रुतिः ॥ रक्षामेतां पठेन्नित्यं सौरेर्नामाबलैर्युतम् । सुखी पुत्री चिरायुश्च स भवेन्नात्र
    संशयः ॥ ॥ इति श्रीशनिरक्षास्तवः ॥
