id: mahaganapatistotra-2
category: stotram
name:
  english: mahaganapatistotra
  devanagari: महागणपतिस्तोत्र
content:
  english: protsaranavirbhavat karnandolanakhelano vijayate devo ganagramanih || 8|| herambam pranamami
    yasya puratah shandilyamule shriya bibhratyamburuhe samam madhuripuste shankhacakre vahan | nyagrodhasya
    tale sahadrisutaya shambhustatha dakshine bibhranah parashum trishulamitaya pashankushabhyam saha
    || 9|| pashcat pippalamashrito ratipatirdevasya ratyotpale bibhratya samamaikshavam dhanurishun paushpan
    vahan panca ca | vame cakragadadharah sa bhagavankrodah priyangostale hastodyacchukashalimamjarikaya
    devya dharanya saha || 10|| shatkonashrishu shatsu shadgajamukhah pashankushabhivaran bibhranah pramadasakhah
    prithumahashonashma
  devanagari: प्रोत्सारणाविर्भवत् कर्णान्दोलनखेलनो विजयते देवो गणग्रामणीः ॥ ८॥ हेरम्बं प्रणमामि यस्य पुरतः
    शाण्डिल्यमूले श्रिया बिभ्रत्याम्बुरूहे समं मधुरिपुस्ते शङ्खचक्रे वहन् । न्यग्रोधस्य तले सहाद्रिसुतया
    शम्भुस्तथा दक्षिणे बिभ्राणः परशुं त्रिशूलमितया पाशाङ्कुशाभ्यां सह ॥ ९॥ पश्चात् पिप्पलमाश्रितो रतिपतिर्देवस्य
    रत्योत्पले बिभ्रत्या सममैक्षवं धनुरिषून् पौष्पान् वहन् पञ्च च । वामे चक्रगदाधरः स भगवान्क्रोडः प्रियङ्गोस्तले
    हस्तोद्यच्छुकशालिमंजरिकया देव्या धरण्या सह ॥ १०॥ षट्कोणाश्रिषु षट्सु षड्गजमुखाः पाशाङ्कुशाभीवरान्
    बिभ्राणाः प्रमदासखाः पृथुमहाशोणाश्म
meaning: {}
