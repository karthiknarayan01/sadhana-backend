id: sri-durga-chandrakala-stuti
category: stotram
name:
  english: Sri Durga Chandrakala Stuti
content:
  english: dhyanam umakante ramakante eshamasi nmatissama | namami dikshitendram stan nayashatka visharadam
    || vedhoharishvarastutyam vihartrim vindhyabhudhare | harapraneshvarim vande hantrim vibudhavidvisham
    || || abhyarthanena sarasiruhasambhavasya tyaktvodita bhagavadakshipidhanalilam | vishveshvari vipadapakamane
    purastat mata mamastu madhukaitabhayornihantri || || prannirjareshu nihatairnijashaktileshaih ekibhavadbhirudita'khilalokaguptyai
    | sampannashastranikara ca tadayudhasthaih mata mamastu mahishantakari purastat || || praleyashailatanaya
    tanukantisampat koshodita kuvalayacchavicarudeha | narayani namadabhipsitakalpavalli supritimavahatu
    shumbhanishumbhahantri || || vishveshvariti mahishantakariti yasyah narayanityapi ca namabhirankitani
    | suktani pankajabhuva ca surarshibhishca drishtani pavakamukhaishca shivam bhaje tam || || utpattidaityahananastavanatmakani
    samrakshakanyakhilabhutahitaya yasyah | suktanyasheshanigamantavidah pathanti tam vishvamataramajasramabhishtavimi
    || || ye vaipracittapunarutthitashumbhamukhyaih durbhikshaghorasamayena ca karitasu | avishkritastrijagadartishu
    rupabhedah tairambika samabhirakshatu mam vipadbhyah || || suktam yadiyamaravindabhavadi drishtam
    avartya devyanupadam surathah samadhih | dvavapyavapaturabhishtamananyalabhyam tamadidevatarunim pranamami
    murdhna || || mahishmatitanubhavam ca rurum ca hantum avishkritairnijarasadavatarabhedaih | ashtadashahatanavahatakotisankhyaih
    amba sada samabhirakshatu mam vipadbhyah || || etaccaritramakhilam likhitam hi yasyah sampujitam sadana
    eva niveshitam va | durgam ca tarayati dustaramapyashesham shreyah prayacchati ca sarvamumam bhaje
    tam || || yatpujanastutinamaskritibhirbhavanti pritah pitamaharameshaharastrayo'pi | teshamapi svakagunairdadati
    vapumshi tamishvarasya tarunim sharanam prapadye || || kantaramadhyadridhalagnataya'vasannah magnashca
    varidhijale ripubhishca ruddhah | yasyah prapadya caranau vipadastaranti sa me sada'stu hridi sarvajagatsavitri
    || || bandhe vadhe mahati mrityubhaye prasakte vittakshaye ca vividhe ya mahopatape | yatpadapujanamiha
    pratikaramahuh sa me samastajanani sharanam bhavani || || banasuraprahitapannagabandhamokshah tadbahudarpadalanadushaya
    ca yogah | pradyumnina drutamalabhyata yatprasadat sa me shiva sakalamapyashubham kshinotu || || papah
    pulastyatanayah punarutthito mam adyapi hartumayamagata ityuditam | yatsevanena bhayamindiraya'vadhutam
    tamadidevatarunim sharanam gato'smi || || yaddhyanajam sukhamavapyamanantapunyaih sakshattamacyuta
    parigrahamashvavapuh | gopanganah kila yadarcanapunyamatrah sa me sada bhagavati bhavatu prasanna
    || || ratrim prapadya iti mantravidah prapannan udbodhya mrityuvadhimanyaphalaih pralobhya | buddhva
    ca tadvimukhatam pratanam nayantim akashamadijananim jagatam bhaje tam || || deshakaleshu dushteshu
    durgacandrakalastutih | sandhyayoranusandheya sarvapadvinivrittaye || || iti shrimadapayyadikshitaviracita
    durgacandrakalastutih ||
  devanagari: ध्यानम् उमाकान्ते रमाकान्ते एषामासी न्मतिस्समा । नमामि दीक्षितेन्द्रां स्तान् नयषट्क विशारदाम्
    ॥ वेधोहरीश्वरस्तुत्यां विहर्त्रीं विन्ध्यभूधरे । हरप्राणेश्वरीं वन्दे हन्त्रीं विबुधविद्विषाम् ॥ ॥
    अभ्यर्थनेन सरसीरुहसम्भवस्य त्यक्त्वोदिता भगवदक्षिपिधानलीलाम् । विश्वेश्वरी विपदपाकमने पुरस्तात् माता
    ममास्तु मधुकैटभयोर्निहन्त्री ॥ ॥ प्राङ्निर्जरेषु निहतैर्निजशक्तिलेशैः एकीभवद्भिरुदिताऽखिललोकगुप्त्यै
    । सम्पन्नशस्त्रनिकरा च तदायुधस्थैः माता ममास्तु महिषान्तकरी पुरस्तात् ॥ ॥ प्रालेयशैलतनया तनुकान्तिसम्पत्
    कोशोदिता कुवलयच्छविचारुदेहा । नारायणी नमदभीप्सितकल्पवल्ली सुप्रीतिमावहतु शुम्भनिशुम्भहन्त्री ॥ ॥ विश्वेश्वरीति
    महिषान्तकरीति यस्याः नारायणीत्यपि च नामभिरङ्कितानि । सूक्तानि पङ्कजभुवा च सुरर्षिभिश्च दृष्टानि पावकमुखैश्च
    शिवां भजे ताम् ॥ ॥ उत्पत्तिदैत्यहननस्तवनात्मकानि संरक्षकाण्यखिलभूतहिताय यस्याः । सूक्तान्यशेषनिगमान्तविदः
    पठन्ति तां विश्वमातरमजस्रमभिष्टवीमि ॥ ॥ ये वैप्रचित्तपुनरुत्थितशुम्भमुख्यैः दुर्भिक्षघोरसमयेन च कारितासु
    । आविष्कृतास्त्रिजगदार्तिषु रूपभेदाः तैरम्बिका समभिरक्षतु मां विपद्भ्यः ॥ ॥ सूक्तं यदीयमरविन्दभवादि
    दृष्टं आवर्त्य देव्यनुपदं सुरथः समाधिः । द्वावप्यवापतुरभीष्टमनन्यलभ्यं तामादिदेवतरुणीं प्रणमामि मूर्ध्ना
    ॥ ॥ माहिष्मतीतनुभवं च रुरुं च हन्तुं आविष्कृतैर्निजरसादवतारभेदैः । अष्टादशाहतनवाहतकोटिसङ्ख्यैः अम्बा
    सदा समभिरक्षतु मां विपद्भ्यः ॥ ॥ एतच्चरित्रमखिलं लिखितं हि यस्याः सम्पूजितं सदन एव निवेशितं वा । दुर्गं
    च तारयति दुस्तरमप्यशेषं श्रेयः प्रयच्छति च सर्वमुमां भजे ताम् ॥ ॥ यत्पूजनस्तुतिनमस्कृतिभिर्भवन्ति
    प्रीताः पितामहरमेशहरास्त्रयोऽपि । तेषामपि स्वकगुणैर्ददती वपूंषि तामीश्वरस्य तरुणीं शरणं प्रपद्ये ॥
    ॥ कान्तारमध्यदृढलग्नतयाऽवसन्नाः मग्नाश्च वारिधिजले रिपुभिश्च रुद्धाः । यस्याः प्रपद्य चरणौ विपदस्तरन्ति
    सा मे सदाऽस्तु हृदि सर्वजगत्सवित्री ॥ ॥ बन्धे वधे महति मृत्युभये प्रसक्ते वित्तक्षये च विविधे य महोपतापे
    । यत्पादपूजनमिह प्रतिकारमाहुः सा मे समस्तजननी शरणं भवानी ॥ ॥ बाणासुरप्रहितपन्नगबन्धमोक्षः तद्बाहुदर्पदलनादुषया
    च योगः । प्राद्युम्निना द्रुतमलभ्यत यत्प्रसादात् सा मे शिवा सकलमप्यशुभं क्षिणोतु ॥ ॥ पापः पुलस्त्यतनयः
    पुनरुत्थितो मां अद्यापि हर्तुमयमागत इत्युदीतम् । यत्सेवनेन भयमिन्दिरयाऽवधूतं तामादिदेवतरुणीं शरणं
    गतोऽस्मि ॥ ॥ यद्ध्यानजं सुखमवाप्यमनन्तपुण्यैः साक्षात्तमच्युत परिग्रहमाश्ववापुः । गोपाङ्गनाः किल यदर्चनपुण्यमात्राः
    सा मे सदा भगवती भवतु प्रसन्ना ॥ ॥ रात्रिं प्रपद्य इति मन्त्रविदः प्रपन्नान् उद्बोध्य मृत्युवधिमन्यफलैः
    प्रलोभ्य । बुद्ध्वा च तद्विमुखतां प्रतनं नयन्तीं आकाशमादिजननीं जगतां भजे ताम् ॥ ॥ देशकालेषु दुष्टेषु
    दुर्गाचन्द्रकलास्तुतिः । सन्ध्ययोरनुसन्धेया सर्वापद्विनिवृत्तये ॥ ॥ इति श्रीमदपय्यदीक्षितविरचिता दुर्गाचन्द्रकलास्तुतिः
    ॥
