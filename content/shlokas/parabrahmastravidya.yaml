id: parabrahmastravidya
category: kavacha
name:
  english: parabrahmastravidya
  devanagari: परब्रह्मास्त्रविद्या
content:
  english: narayanastrapashupatastrabrahmandastravighnastradisarvadivyastrani mama sarvato raksha raksha
    shamaya shamaya mocaya mocaya mardaya mardaya prakataya prakataya ujjvalaya ujjvalaya prajvala prajvala
    sarvaduritakshayam kuru kuru sarvamangalasamriddhim dehi dehi sarvatattvaprakasham kuru kuru svaha
    || kameshvarastra prakataya prakataya mahamaheshvarastra samutthapaya samutthapaya | om ka e i la
    hrim | om ha sa ka ha la hrim | om sa ka la hrim | hasakalahrim hasakshavarayum sarvamantramayarahasyapradipike
    sarvabijasvarupini sarvatattvamaye sarvayogeshvari sarvaguhyantargudhe sarvacakreshvari sarvamantrarajni
    aviravirbhava aviravirbhava sphura sphura prasphura prasphura jvala jvala prajvala prajvala parabrahmamahastrasvarupini
    hum phat svaha || om tapolokam darshaya darshaya | brahmalokam darshaya darshaya | vishnulokam darshaya
    darshaya | indralokam darshaya darshaya | shivalokam darshaya darshaya | gaurilokam darshaya darshaya
    | devalokam darshaya darshaya | golokam darshaya darshaya | om ram rim rum radhike svaha | vaikunthashakte
    mahavidyanilaye paralokam darshaya darshaya | skandalokam darshaya darshaya | maharlokam darshaya
    darshaya | janalokam darshaya darshaya | tapolokam punah prakashaya prakashaya | satyalokam vibhavaya
    vibhavaya | anandalokam samaveshaya samaveshaya | cinmandalam prasaraya prasaraya | paravyoma pradarshaya
    pradarshaya | param dhama prakashaya prakashaya svaha || om bhurbhuvah svaromityekaksharaparipurnaparatattvasvarupine
    namah | om satyalokatita paramavyomadhipate sahasrakotibrahmandaniyantraka sarvalokamaya sarvalokatita
    sarvalokaprakashaka sarvalokasamharaka sarvalokaikasakshin aveshaya aveshaya bodhaya bodhaya calaya
    calaya preraya preraya sarvavaranakshayam kuru kuru sarvagranthin bhindhi bhindhi sarvasamshayan chindhi
    chindhi sarvavighnan dravaya dravaya sarvamayajalam vilapaya vilapaya sarvatattvani prakashitani kuru
    kuru hum phat svaha || om parabrahmane vidmahe parashaktyai dhimahi tanno brahma pracodayat | sarvastracakrasamayukta
    mahajvalamalini mahaghorarupini mahakarunamayi mahashantidayini sarvadikpalasamstute sarvayoginiganasevite
    sarvadevamayi sarvavidyamayi sarvatattvamayi parabrahmamahastre prabuddhe prabuddhe samprabuddhe samprabuddhe
    jagraya jagraya samraksha samraksha palaya palaya vijayam dehi dehi siddhim dehi dehi purnatvam dehi
    dehi paranandam dehi dehi svaha || krom krim krum kuladevi kulavriddhaye gram grim grum devatayai
    kom kom kundalinyai namah | krim trim klim hrim vajradhum hlrim shrim aim kundalini jagraya jagraya
    bodhaya bodhaya sphura sphura prasphura prasphura kampaya kampaya samprakampaya samprakampaya uddipaya
    uddipaya prabodhaya prabodhaya samutthapaya samutthapaya mahashaktirupini mahamaye mahayogeshvari
    mahacidagnimandalamadhyavasini muladharanilaye brahmagranthim bhindhi bhindhi vishnugranthim bhindhi
    bhindhi rudragranthim bhindhi bhindhi sarvanadicakrani vishodhaya vishodhaya sarvapranan samikuru
    samikuru sarvatejo vivardhaya vivardhaya sarvacaitanyam prakashaya prakashaya sarvavaranani daha daha
    sarvamalan paca paca sarvashankan chindhi chindhi sarvasiddhin samprayaccha samprayaccha hum hum phat
    phat svaha || om parabrahmane vidmahe parashaktyai dhimahi tanno brahma pracodayat | kulakundalini
    mahamaye yogamate cidanandarupini sahasrarakamalapraveshini amritadharam sravaya sravaya paramajyotih
    sandarshaya sandarshaya paravyomavesham kuru kuru paramanandam dehi dehi paramashantim dehi dehi parabrahmamahastrasvarupini
    jvala jvala prajvala prajvala hum phat svaha || rigvedayajurvedasamatharvanavedasvarupini vaksiddhim
    dehi dehi medhasiddhim dehi dehi prajnam dehi dehi kavitvam dehi dehi smritim dehi dehi riddhim dehi
    siddhim dehi ashtasiddhirnavanidhishca prasadaya prasadaya aujasam balam viryam tejah shrim pushtim
    ca vivardhaya vivardhaya | shrim hrim shrim mahalakshmyai mahishamardinyai svaha || caturbhuje caturakshi
    lalite pralite tripure tripurambike tripurasundari sarvamangalakarini sarvavidyamaye sarvashaktisvarupini
    sarvamantraprakashini sarvacakranilaye sarvatattvamaye sarvadevamaye sarvanandamaye aviravirbhava
    aviravirbhava prasida prasida palaya palaya raksha raksha jvala jvala prajvala prajvala sarvavighnan
    bhasmi kuru kuru sarvasamriddhim prayaccha prayaccha sarvasaubhagyam vistaraya vistaraya cidanandam
    prakashaya prakashaya hum phat svaha || dram ciranjivane hram bhuvaneshvari krom pishacini brahmarakshamsi
    vetalan mardaya mardaya bhutaganan shamaya shamaya grahapidah utkilaya utkilaya sarvopadravan upashamaya
    upashamaya sarvadurgatim vinashaya vinashaya sarvavighnajalam vidravaya vidravaya sarvabhicaran bhasmi
    kuru kuru sarvaraksham vidhehi vidhehi sarvamangalam prakashaya prakashaya sarvato mam palaya palaya
    jvala jvala prajvala prajvala hum phat svaha || om pram prim prum parabrahmane vidmahe parashaktyai
    dhimahi tanno brahma pracodayat | om lalitadevyai ca vidmahe parabrahmane dhimahi tannah shaktih pracodayat
    | avirbhava avirbhava sannidhehi sannidhehi parameshvari paramatmasvarupini sarvashaktimaye sarvadevamaye
    sarvamantramaye sarvatattvamaye sarvayogamaye sarvanandamaye sarvaprakashamaye sarvarahasyamaye sarvabrahmandanayike
    sarvakaranakaranarupini sarvavighnakshayakari sarvamangalapradayini sarvadaridryadavadahini sarvapapaughabhanjini
    sarvagranthivimocini sarvavaranabhedini sarvasiddhisvarupini sarvadevatahridayavasini sarvalokaikapujite
    sarvacakrapravartini sarvanadivishodhini sarvabhutanukampini sarvarakshakari sarvashatruvinashini
    sarvamohavibhedini sarvacidakashavyapini sarvakalatige sarvavedavedye sarvagamasararupini sarvatantranilaye
    sarvamantrahridaye sarvastraparipalini sarvabrahmandasamrakshini prasida prasida raksha raksha palaya
    palaya purnatvam dehi dehi parajnanam dehi dehi parabhaktim dehi dehi paravairagyam dehi dehi paramaishvaryam
    dehi dehi paranandam dehi dehi svaha || om aim hrim klim shrim sauh tripure tvamehagaccha agaccha
    atraiva nivasam kuru kuru mama hridaye mama praneshu mama buddhau mama citte mama nayaneshu mama vaci
    mama hastayoh mama padayoh mama sarvangeshu ciram tishtha tishtha sannidhehi sannidhehi sphura sphura
    prasphura prasphura jvala jvala prajvala prajvala prakashaya prakashaya purnaya purnaya pavaya pavaya
    bodhaya bodhaya mocaya mocaya anandaya anandaya amritikuru amritikuru paramashakte parameshvari parabrahmasvarupini
    om parabrahmane svaha || athatah sampravakshyami phalamasya mahatmanah | yanna shrutam pura vedairna
    drishtam yogibhirmuhuh || guhyadguhyatama vidya parabrahmastramalika | kameshvarastrodayeti paramparyena
    giyate || yasya udayamatrena bhandadaityo mahasurah | sabalah sacivaih sardham bhasmasadabhavat kshanat
    || brahmastram vaishnavastram ca pashupatyam tathaiva ca | narayanastramugram ca sarvastrani ca nirbalam
    || asyah purah samayanti tejasa paribhutayah | yatharkamandale dipo na prabham dharayetkvacit || na
    devo nasuro vapi na yaksho na ca kinnarah | na vidyadharagandharvo na siddho na mahoragah || na yoginigano
    napi na bhairavagano'pi va | asyah shakteh purah sthatum samartho bhuvanatraye || asyah smaranamatrena
    brahmagranthirvibhidyate | vishnugranthirlayam yati rudragranthirvinashyati || nadisahasrasamyuktam
    dehametadvishudhyati | amritasya pravahashca sahasrare pravartate || yatrayam pathyate nityam taddeshah
    shripuram bhavet | tatra kalo na shaktah syanna mrityurna ca darunam || bhutapretapishacashca vetala
    brahmarakshasah | dakinyah shakinyashcaiva drishtva duram palayate || abhicarah kritah sarve krityayantradikastatha
    | svayameva vinashyanti vahnisamsprishtaparnavat || na grahah pidayantyenam na daridryam na durgatih
    | na rogo na visham tasya na shastram na ca patakam || vagdevi jihvikam tasya lakshmirvakshasi samsthita
    | dakshine vijayah panau vame siddhih pratishthita || rishayah siddhayogindra devadevashca sarvashah
    | adrishtvapi namasyanti mantrasiddhiprabhavatah || yam yam sankalpayedartham dharmayuktam vicakshanah
    | tam tam sampadayedashu natra karya vicarana || shatajanmarjitam papam sahasrajanmasambhavam | ekenaiva
    japenashu dahatyesha hutashanah || avidya nama ratrih syadesha surya ivodita | svayameva prakashante
    vedagamataponidhayah || na tasya punarutpattirna samsarabhramo bhavet | jivanneva param brahma sakshadevanubhuyate
    || nasya tulyam kavacam kincinnasya tulyam mahastrakam | nasya tulyo mahamantro nasya tulya para kriya
    || sahasravartanam proktam purashcaryavidhih shubhah | dashamshahomatarpabhyam gurutoshena siddhidah
    || siddhe'sminnastramaleyam sadhakah purnatam vrajet | na tasya kincidaprapyam trailokye sacaracare
    || gopaniyam prayatnena pranebhyo'pi gariyasi | na deyam dushtabhavaya nastikaya kadacana || bhaktaya
    vinayayuktaya gurubhaktiparaya ca | shuddhacittaya datavyam tena siddhirna samshayah || yah pathetpratarutthaya
    madhyahne sayameva ca | tasya hridyudaye nityam parabrahma prakashate || iti shriparamayogeshvaratantre
    parabrahmastravidya sampurna ||
  devanagari: नारायणास्त्रपाशुपतास्त्रब्रह्माण्डास्त्रविघ्नास्त्रादिसर्वदिव्यास्त्राणि मम सर्वतो रक्ष
    रक्ष शमय शमय मोचय मोचय मर्दय मर्दय प्रकटय प्रकटय उज्ज्वलय उज्ज्वलय प्रज्वल प्रज्वल सर्वदुरितक्षयं
    कुरु कुरु सर्वमङ्गलसमृद्धिं देहि देहि सर्वतत्त्वप्रकाशं कुरु कुरु स्वाहा ॥ कामेश्वरास्त्र प्रकटय प्रकटय
    महामहेश्वरास्त्र समुत्थापय समुत्थापय । ॐ क ए ई ल ह्रीम् । ॐ ह स क ह ल ह्रीम् । ॐ स क ल ह्रीम् । हसकलह्रीं
    हसक्षवरयूं सर्वमन्त्रमयरहस्यप्रदीपिके सर्वबीजस्वरूपिणि सर्वतत्त्वमये सर्वयोगेश्वरि सर्वगुह्यान्तर्गूढे
    सर्वचक्रेश्वरि सर्वमन्त्रराज्ञि आविराविर्भव आविराविर्भव स्फुर स्फुर प्रस्फुर प्रस्फुर ज्वल ज्वल प्रज्वल
    प्रज्वल परब्रह्ममहास्त्रस्वरूपिणि हुं फट् स्वाहा ॥ ॐ तपोलोकं दर्शय दर्शय । ब्रह्मलोकं दर्शय दर्शय
    । विष्णुलोकं दर्शय दर्शय । इन्द्रलोकं दर्शय दर्शय । शिवलोकं दर्शय दर्शय । गौरीलोकं दर्शय दर्शय । देवलोकं
    दर्शय दर्शय । गोलोकं दर्शय दर्शय । ॐ रां रीं रूं राधिके स्वाहा । वैकुण्ठशक्ते महाविद्यानिलये परलोकं
    दर्शय दर्शय । स्कन्दलोकं दर्शय दर्शय । महर्लोकं दर्शय दर्शय । जनलोकं दर्शय दर्शय । तपोलोकं पुनः प्रकाशय
    प्रकाशय । सत्यलोकं विभावय विभावय । आनन्दलोकं समावेशय समावेशय । चिन्मण्डलं प्रसारय प्रसारय । परव्योम
    प्रदर्शय प्रदर्शय । परं धाम प्रकाशय प्रकाशय स्वाहा ॥ ॐ भूर्भुवः स्वरोमित्येकाक्षरपरिपूर्णपरतत्त्वस्वरूपिणे
    नमः । ॐ सत्यलोकातीत परमव्योमाधिपते सहस्रकोटिब्रह्माण्डनियन्त्रक सर्वलोकमय सर्वलोकातीत सर्वलोकप्रकाशक
    सर्वलोकसंहारक सर्वलोकैकसाक्षिन् आवेशय आवेशय बोधय बोधय चालय चालय प्रेरय प्रेरय सर्वावरणक्षयं कुरु कुरु
    सर्वग्रन्थीन् भिन्धि भिन्धि सर्वसंशयान् छिन्धि छिन्धि सर्वविघ्नान् द्रावय द्रावय सर्वमायाजालं विलापय
    विलापय सर्वतत्त्वानि प्रकाशितानि कुरु कुरु हुं फट् स्वाहा ॥ ॐ परब्रह्मणे विद्महे पराशक्त्यै धीमहि
    तन्नो ब्रह्म प्रचोदयात् । सर्वास्त्रचक्रसमायुक्त महाज्वालामालिनि महाघोररूपिणि महाकरुणामयि महाशान्तिदायिनि
    सर्वदिक्पालसंस्तुते सर्वयोगिनीगणसेविते सर्वदेवमयि सर्वविद्यामयि सर्वतत्त्वमयि परब्रह्ममहास्त्रे प्रबुद्धे
    प्रबुद्धे सम्प्रबुद्धे सम्प्रबुद्धे जाग्रय जाग्रय संरक्ष संरक्ष पालय पालय विजयं देहि देहि सिद्धिं
    देहि देहि पूर्णत्वं देहि देहि परानन्दं देहि देहि स्वाहा ॥ क्रों क्रीं क्रूं कुलदेवि कुलवृद्धये ग्रां
    ग्रीं ग्रूं देवतायै कों कों कुण्डलिन्यै नमः । क्रीं त्रीं क्लीं ह्रीं वज्रधूं ह्ल्रीं श्रीं ऐं कुण्डलिनि
    जाग्रय जाग्रय बोधय बोधय स्फुर स्फुर प्रस्फुर प्रस्फुर कम्पय कम्पय सम्प्रकम्पय सम्प्रकम्पय उद्दीपय
    उद्दीपय प्रबोधय प्रबोधय समुत्थापय समुत्थापय महाशक्तिरूपिणि महामाये महायोगेश्वरि महाचिदग्निमण्डलमध्यवासिनि
    मूलाधारनिलये ब्रह्मग्रन्थिं भिन्धि भिन्धि विष्णुग्रन्थिं भिन्धि भिन्धि रुद्रग्रन्थिं भिन्धि भिन्धि
    सर्वनाडीचक्राणि विशोधय विशोधय सर्वप्राणान् समीकुरु समीकुरु सर्वतेजो विवर्धय विवर्धय सर्वचैतन्यं प्रकाशय
    प्रकाशय सर्वावरणानि दह दह सर्वमलान् पच पच सर्वशङ्कान् छिन्धि छिन्धि सर्वसिद्धीन् सम्प्रयच्छ सम्प्रयच्छ
    हुं हुं फट् फट् स्वाहा ॥ ॐ परब्रह्मणे विद्महे पराशक्त्यै धीमहि तन्नो ब्रह्म प्रचोदयात् । कुलकुण्डलिनि
    महामाये योगमाते चिदानन्दरूपिणि सहस्रारकमलप्रवेशिनि अमृतधारां स्रावय स्रावय परमज्योतिः सन्दर्शय सन्दर्शय
    परव्योमावेशं कुरु कुरु परमानन्दं देहि देहि परमशान्तिं देहि देहि परब्रह्ममहास्त्रस्वरूपिणि ज्वल ज्वल
    प्रज्वल प्रज्वल हुं फट् स्वाहा ॥ ऋग्वेदयजुर्वेदसामाथर्वणवेदस्वरूपिणि वाक्सिद्धिं देहि देहि मेधासिद्धिं
    देहि देहि प्रज्ञां देहि देहि कवित्वं देहि देहि स्मृतिं देहि देहि ऋद्धिं देहि सिद्धिं देहि अष्टसिद्धीर्नवनिधीश्च
    प्रसादय प्रसादय औजसं बलं वीर्यं तेजः श्रीं पुष्टिं च विवर्धय विवर्धय । श्रीं ह्रीं श्रीं महालक्ष्म्यै
    महिषमर्दिन्यै स्वाहा ॥ चतुर्भुजे चतुरक्षि ललिते प्रलिते त्रिपुरे त्रिपुराम्बिके त्रिपुरसुन्दरि सर्वमङ्गलकारिणि
    सर्वविद्यामये सर्वशक्तिस्वरूपिणि सर्वमन्त्रप्रकाशिनि सर्वचक्रनिलये सर्वतत्त्वमये सर्वदेवमये सर्वानन्दमये
    आविराविर्भव आविराविर्भव प्रसीद प्रसीद पालय पालय रक्ष रक्ष ज्वल ज्वल प्रज्वल प्रज्वल सर्वविघ्नान् भस्मी
    कुरु कुरु सर्वसमृद्धिं प्रयच्छ प्रयच्छ सर्वसौभाग्यं विस्तारय विस्तारय चिदानन्दं प्रकाशय प्रकाशय हुं
    फट् स्वाहा ॥ द्रां चिरञ्जीवने ह्रां भुवनेश्वरि क्रों पिशाचिनि ब्रह्मरक्षांसि वेतालान् मर्दय मर्दय
    भूतगणान् शमय शमय ग्रहपीडाः उत्कीलय उत्कीलय सर्वोपद्रवान् उपशमय उपशमय सर्वदुर्गतिं विनाशय विनाशय सर्वविघ्नजालं
    विद्रावय विद्रावय सर्वाभिचारान् भस्मी कुरु कुरु सर्वरक्षां विधेहि विधेहि सर्वमङ्गलं प्रकाशय प्रकाशय
    सर्वतो मां पालय पालय ज्वल ज्वल प्रज्वल प्रज्वल हुं फट् स्वाहा ॥ ॐ प्रां प्रीं प्रूं परब्रह्मणे विद्महे
    पराशक्त्यै धीमहि तन्नो ब्रह्म प्रचोदयात् । ॐ ललितादेव्यै च विद्महे परब्रह्मणे धीमहि तन्नः शक्तिः प्रचोदयात्
    । आविर्भव आविर्भव सन्निधेहि सन्निधेहि परमेश्वरि परमात्मस्वरूपिणि सर्वशक्तिमये सर्वदेवमये सर्वमन्त्रमये
    सर्वतत्त्वमये सर्वयोगमये सर्वानन्दमये सर्वप्रकाशमये सर्वरहस्यमये सर्वब्रह्माण्डनायिके सर्वकारणकारणरूपिणि
    सर्वविघ्नक्षयकरी सर्वमङ्गलप्रदायिनि सर्वदारिद्र्यदावदाहिनि सर्वपापौघभञ्जिनि सर्वग्रन्थिविमोचिनि सर्वावरणभेदिनि
    सर्वसिद्धिस्वरूपिणि सर्वदेवताहृदयवासिनि सर्वलोकैकपूजिते सर्वचक्रप्रवर्तिनि सर्वनाडीविशोधिनि सर्वभूतानुकम्पिनि
    सर्वरक्षाकरि सर्वशत्रुविनाशिनि सर्वमोहविभेदिनि सर्वचिदाकाशव्यापिनि सर्वकालातिगे सर्ववेदवेद्ये सर्वागमसाररूपिणि
    सर्वतन्त्रनिलये सर्वमन्त्रहृदये सर्वास्त्रपरिपालिनि सर्वब्रह्माण्डसंरक्षिणि प्रसीद प्रसीद रक्ष रक्ष
    पालय पालय पूर्णत्वं देहि देहि परज्ञानं देहि देहि परभक्तिं देहि देहि परवैराग्यं देहि देहि परमैश्वर्यं
    देहि देहि परानन्दं देहि देहि स्वाहा ॥ ॐ ऐं ह्रीं क्लीं श्रीं सौः त्रिपुरे त्वमेहागच्छ आगच्छ अत्रैव
    निवासं कुरु कुरु मम हृदये मम प्राणेषु मम बुद्धौ मम चित्ते मम नयनेषु मम वाचि मम हस्तयोः मम पादयोः मम
    सर्वाङ्गेषु चिरं तिष्ठ तिष्ठ सन्निधेहि सन्निधेहि स्फुर स्फुर प्रस्फुर प्रस्फुर ज्वल ज्वल प्रज्वल प्रज्वल
    प्रकाशय प्रकाशय पूर्णय पूर्णय पावय पावय बोधय बोधय मोचय मोचय आनन्दय आनन्दय अमृतीकुरु अमृतीकुरु परमशक्ते
    परमेश्वरि परब्रह्मस्वरूपिणि ॐ परब्रह्मणे स्वाहा ॥ अथातः सम्प्रवक्ष्यामि फलमस्य महात्मनः । यन्न श्रुतं
    पुरा वेदैर्न दृष्टं योगिभिर्मुहुः ॥ गुह्याद्गुह्यतमा विद्या परब्रह्मास्त्रमालिका । कामेश्वरास्त्रोदयेति
    परम्पर्येण गीयते ॥ यस्या उदयमात्रेण भण्डदैत्यो महासुरः । सबलः सचिवैः सार्धं भस्मसादभवत् क्षणात् ॥
    ब्रह्मास्त्रं वैष्णवास्त्रं च पाशुपत्यं तथैव च । नारायणास्त्रमुग्रं च सर्वास्त्राणि च निर्बलम् ॥ अस्याः
    पुरः समायान्ति तेजसा परिभूतयः । यथार्कमण्डले दीपो न प्रभां धारयेत्क्वचित् ॥ न देवो नासुरो वापि न यक्षो
    न च किन्नरः । न विद्याधरगन्धर्वो न सिद्धो न महोरगः ॥ न योगिनीगणो नापि न भैरवगणोऽपि वा । अस्याः शक्तेः
    पुरः स्थातुं समर्थो भुवनत्रये ॥ अस्याः स्मरणमात्रेण ब्रह्मग्रन्थिर्विभिद्यते । विष्णुग्रन्थिर्लयं
    याति रुद्रग्रन्थिर्विनश्यति ॥ नाडीसहस्रसंयुक्तं देहमेतद्विशुध्यति । अमृतस्य प्रवाहश्च सहस्रारे प्रवर्तते
    ॥ यत्रायं पाठ्यते नित्यं तद्देशः श्रीपुरं भवेत् । तत्र कालो न शक्तः स्यान्न मृत्युर्न च दारुणम् ॥
    भूतप्रेतपिशाचाश्च वेताला ब्रह्मराक्षसाः । डाकिन्यः शाकिन्यश्चैव दृष्ट्वा दूरं पलायते ॥ अभिचाराः कृताः
    सर्वे कृत्यायन्त्रादिकास्तथा । स्वयमेव विनश्यन्ति वह्निसंस्पृष्टपर्णवत् ॥ न ग्रहाः पीडयन्त्येनं न
    दारिद्र्यं न दुर्गतिः । न रोगो न विषं तस्य न शस्त्रं न च पातकम् ॥ वाग्देवी जिह्विकां तस्य लक्ष्मीर्वक्षसि
    संस्थिता । दक्षिणे विजयः पाणौ वामे सिद्धिः प्रतिष्ठिता ॥ ऋषयः सिद्धयोगीन्द्रा देवदेवाश्च सर्वशः ।
    अदृष्ट्वापि नमस्यन्ति मन्त्रसिद्धिप्रभावतः ॥ यं यं सङ्कल्पयेदर्थं धर्मयुक्तं विचक्षणः । तं तं सम्पादयेदाशु
    नात्र कार्या विचारणा ॥ शतजन्मार्जितं पापं सहस्रजन्मसम्भवम् । एकेनैव जपेनाशु दहत्येषा हुताशनः ॥ अविद्या
    नाम रात्रिः स्यादेषा सूर्य इवोदिता । स्वयमेव प्रकाशन्ते वेदागमतपोनिधयः ॥ न तस्य पुनरुत्पत्तिर्न संसारभ्रमो
    भवेत् । जीवन्नेव परं ब्रह्म साक्षादेवानुभूयते ॥ नास्य तुल्यं कवचं किञ्चिन्नास्य तुल्यं महास्त्रकम्
    । नास्य तुल्यो महामन्त्रो नास्य तुल्या परा क्रिया ॥ सहस्रावर्तनं प्रोक्तं पुरश्चर्याविधिः शुभः । दशांशहोमतर्पाभ्यां
    गुरुतोषेण सिद्धिदः ॥ सिद्धेऽस्मिन्नस्त्रमालेयं साधकः पूर्णतां व्रजेत् । न तस्य किञ्चिदप्राप्यं त्रैलोक्ये
    सचराचरे ॥ गोपनीयं प्रयत्नेन प्राणेभ्योऽपि गरीयसी । न देयं दुष्टभावाय नास्तिकाय कदाचन ॥ भक्ताय विनययुक्ताय
    गुरुभक्तिपराय च । शुद्धचित्ताय दातव्यं तेन सिद्धिर्न संशयः ॥ यः पठेत्प्रातरुत्थाय मध्याह्ने सायमेव
    च । तस्य हृद्युदये नित्यं परब्रह्म प्रकाशते ॥ इति श्रीपरमयोगेश्वरतन्त्रे परब्रह्मास्त्रविद्या सम्पूर्णा
    ॥
