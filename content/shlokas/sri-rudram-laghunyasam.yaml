id: sri-rudram-laghunyasam
category: veda
name:
  english: Sri Rudram Laghunyasam
  devanagari: श्री रुद्रप्रश्नः लघुन्यासः
content:
  english: '|| laghunyasah || om athatmana shivatmana shrirudrarupam dhyayet || shuddhasphatikasankasham
    trinetram pancavaktrakam | gangadharam dashabhujam sarvabharanabhushitam || nilagrivam shashankankam
    nagayajnopavitinam | vyaghracarmottariyam ca varenyamabhayapradam || kamandalvakshasutranam dharinam
    shulapaninam | jvalantam pingalajatashikhamudyotadharinam || vrishaskandhasamarudham umadehardhadharinam
    | amritenaplutam shantam divyabhogasamanvitam || digdevatasamayuktam surasuranamaskritam | nityam
    ca shashvatam shuddham dhruvamaksharamavyayam || sarvavyapinamishanam rudram vai vishvarupinam | evam
    dhyatva dvijasamyak tato yajanamarabhet || om prajanane brahma tishthatu | padayorvishnustishthatu
    | hastayorharastishthatu | bahvorindrastishthatu | jathare''gnistishthatu | hridaye shivastishthatu
    | kanthe vasavastishthantu | vaktre sarasvati tishthatu | nasikayorvayustishthatu | nayanayoshcandradityau
    tishthetam | karnayorashvinau tishthetam | lalate rudrastishthantu | murdhnyadityastishthantu | shirasi
    mahadevastishthatu | shikhayam vamadevastishthatu | prishthe pinaki tishthatu | puratah shuli tishthatu
    | parshvayoh shivashankarau tishthetam | sarvato vayustishthatu | tato bahih sarvato''gnirjvalamala
    parivritastishthatu | sarveshvangeshu sarva devata yathasthanam tishthantu | ma rakshantu | sarvan
    mahajanan rakshantu || om agnirme vaci shritah | vagdhridaye | hridayam mayi | ahamamrite | amritam
    brahmani | vayurme prane shritah | prano hridaye | hridayam mayi | ahamamrite | amritam brahmani |
    suryo me cakshushi shritah | cakshurhridaye | hridayam mayi | ahamamrite | amritam brahmani | candrama
    me manasi shritah | mano hridaye | hridayam mayi | ahamamrite | amritam brahmani | disho me shrotre
    shritah | shrotra hridaye | hridayam mayi | ahamamrite | amritam brahmani | apo me retasi shritah
    | reto hridaye | hridayam mayi | ahamamrite | amritam brahmani | prithivi me sharire shrita | shariragm
    hridaye | hridayam mayi | ahamamrite | amritam brahmani | oshadhivanaspatayo me lomasu shritah | lomani
    hridaye | hridayam mayi | ahamamrite | amritam brahmani | indro me bale shritah | bala hridaye | hridayam
    mayi | ahamamrite | amritam brahmani | parjanyo me murdhni shritah | murdha hridaye | hridayam mayi
    | ahamamrite | amritam brahmani | ishano me manyau shritah | manyurhridaye | hridayam mayi | ahamamrite
    | amritam brahmani | atma ma atmani shritah | atma hridaye | hridayam mayi | ahamamrite | amritam
    brahmani | punarma atma punarayuragat | punah pranah punarakutamagat | vaishvanaro rashmibhirvavridhanah
    | antastishthatvamritasya gopah || asya shri rudradhyaya prashna mahamantrasya aghora rishih, anushtup
    chandah, sankarshanamurtisvarupo yo''savadityah paramapurushah sa esha rudro devata | namah shivayeti
    bijam | shivatarayeti shaktih | mahadevayeti kilakam | shri sambasadashiva prasada siddhyarthe jape
    viniyogah || om agnihotratmane angushthabhyam namah | darshapurnamasatmane tarjanibhyam namah | caturmasyatmane
    madhyamabhyam namah | nirudhapashubandhatmane anamikabhyam namah | jyotishtomatmane kanishthikabhyam
    namah | sarvakratvatmane karatalakaraprishthabhyam namah || agnihotratmane hridayaya namah | darshapurnamasatmane
    shirase svaha | caturmasyatmane shikhayai vashat | nirudhapashubandhatmane kavacaya hum | jyotishtomatmane
    netratrayaya vaushat | sarvakratvatmane astraya phat | bhurbhuvassuvaromiti digbandhah || || dhyanam
    || apataḻanabhah sthalantabhuvanabrahmandamavisphura jjyotih sphatikalingamauḻivilasatpurnenduvantamritaih
    | astokaplutamekamishamanisham rudranuvakanjapan dhyayedipsitasiddhaye dhruvapadam vipro''bhishincecchivam
    || brahmandavyaptadeha bhasitahimaruca bhasamana bhujangaih kanthekalah kapardakalitashashikalashcandakodanda
    hastah || tryaksha rudrakshamalah prakatitavibhavah shambhava murtibheda rudrah shrirudrasuktaprakatitavibhava
    nah prayacchantu saukhyam || shri gurubhyo namah | harih o3m | om gananam tva ganapati havamahe kavim
    kavinamupamashravastamam | jyeshtharajam brahmanam brahmanaspata a nah shrinvannutibhissida sadanam
    || || om shri mahaganapataye namah || om sham ca me mayashca me priyam ca me''nukamashca me kamashca
    me saumanasashca me bhadram ca me shreyashca me vasyashca me yashashca me bhagashca me dravinam ca
    me yanta ca me dharta ca me kshemashca me dhritishca me vishvam ca me mahashca me samvicca me jnatram
    ca me sushca me prasushca me siram ca me layashca ma ritam ca me''mritam ca me''yakshmam ca me''namayacca
    me jivatushca me dirghayutvam ca me''namitram ca me''bhayam ca me sugam ca me shayanam ca me susha
    ca me sudinam ca me || om shantih shantih shantih || || shivopasana mantrah || nidhanapataye namah
    | nidhanapatantikaya namah | urdhvaya namah | urdhvalingaya namah | hiranyaya namah | hiranyalingaya
    namah | suvarnaya namah | survarnalingaya namah | divyaya namah | divyalingaya namah | bhavaya namah
    | bhavalingaya namah | sharvaya namah | sharvalingaya namah | shivaya namah | shivalingaya namah |
    jvalaya namah | jvalalingaya namah | atmaya namah | atmalingaya namah | paramaya namah | paramalingaya
    namah | etathsomasya suryasya sarvalinga sthapayati panimantram pavitram || sadyojatam prapadyami
    sadyojataya vai namo namah | bhave bhave natibhave bhavasva mam | bhavodbhavaya namah || vamadevaya
    namo jyeshthaya namashshreshthaya namo rudraya namah kalaya namah kalavikaranaya namo balavikaranaya
    namo balaya namo balapramathanaya namassarvabhutadamanaya namo manonmanaya namah || aghorebhyo''tha
    ghorebhyo ghoraghoratarebhyah | sarvebhyah sarvasharvebhyo namaste astu rudrarupebhyah || tatpurushaya
    vidmahe mahadevaya dhimahi | tanno rudrah pracodayat || ishanassarvavidyanamishvarassarva bhutanam
    brahma''dhipatirbrahmano''dhipatirbrahma shivo me astu sadashivom || namo hiranyabahave hiranyavarnaya
    hiranyarupaya hiranyapataye''mbikapataya umapataye pashupataye namo namah | rita satyam param brahma
    purusham krishnapingalam | urdhvaretam virupaksham vishvarupaya vai namo namah || sarvo vai rudrastasmai
    rudraya namo astu | purusho vai rudrassanmaho namo namah | vishvam bhutam bhuvanam citram bahudha
    jatam jayamanam ca yat | sarvo hyesha rudrastasmai rudraya namo astu | kadrudraya pracetase midhushtamaya
    tavyase | vo cema shantama hride | sarvo hyesha rudrastasmai rudraya namo astu || dhyanam apatalanabhahsthalantabhuvanabrahmandamavisphura
    jjyotih sphatikalingamaulivilasat purnenduvantamritaih | astokaplutamekamishamanisham rudranuvakanjapan
    dhyayedipsita siddhaye''drutapadam vipro''bhishinjecchivam || brahmandavyaptadeha bhasitahimaruca
    bhasamana bhujangaih kanthe kalah kapardakalita shashikalashcandakodandahastah | tryaksha rudrakshamalah
    pranatabhayaharah shambhava murtibhedah rudrah shrirudrasuktaprakatitavibhava nah prayacchantu saukhyam
    ||'
  devanagari: ॥ लघुन्यासः ॥ ॐ अथात्मान शिवात्मान श्रीरुद्ररूपं ध्यायेत् ॥ शुद्धस्फटिकसङ्काशं त्रिनेत्रं
    पञ्चवक्त्रकम् । गङ्गाधरं दशभुजं सर्वाभरणभूषितम् ॥ नीलग्रीवं शशाङ्काङ्कं नागयज्ञोपवीतिनम् । व्याघ्रचर्मोत्तरीयं
    च वरेण्यमभयप्रदम् ॥ कमण्डल्वक्षसूत्राणां धारिणं शूलपाणिनम् । ज्वलन्तं पिङ्गलजटाशिखामुद्योतधारिणम्
    ॥ वृषस्कन्धसमारूढम् उमादेहार्धधारिणम् । अमृतेनाप्लुतं शान्तं दिव्यभोगसमन्वितम् ॥ दिग्देवतासमायुक्तं
    सुरासुरनमस्कृतम् । नित्यं च शाश्वतं शुद्धं ध्रुवमक्षरमव्ययम् ॥ सर्वव्यापिनमीशानं रुद्रं वै विश्वरूपिणम्
    । एवं ध्यात्वा द्विजसम्यक् ततो यजनमारभेत् ॥ ॐ प्रजनने ब्रह्मा तिष्ठतु । पादयोर्विष्णुस्तिष्ठतु । हस्तयोर्हरस्तिष्ठतु
    । बाह्वोरिन्द्रस्तिष्ठतु । जठरेऽग्निस्तिष्ठतु । हृदये शिवस्तिष्ठतु । कण्ठे वसवस्तिष्ठन्तु । वक्त्रे
    सरस्वती तिष्ठतु । नासिकयोर्वायुस्तिष्ठतु । नयनयोश्चन्द्रादित्यौ तिष्ठेताम् । कर्णयोरश्विनौ तिष्ठेताम्
    । ललाटे रुद्रास्तिष्ठन्तु । मूर्ध्न्यादित्यास्तिष्ठन्तु । शिरसि महादेवस्तिष्ठतु । शिखायां वामदेवस्तिष्ठतु
    । पृष्ठे पिनाकी तिष्ठतु । पुरतः शूली तिष्ठतु । पार्श्वयोः शिवाशङ्करौ तिष्ठेताम् । सर्वतो वायुस्तिष्ठतु
    । ततो बहिः सर्वतोऽग्निर्ज्वालामाला परिवृतस्तिष्ठतु । सर्वेष्वङ्गेषु सर्वा देवता यथास्थानं तिष्ठन्तु
    । मा रक्षन्तु । सर्वान् महाजनान् रक्षन्तु ॥ ॐ अग्निर्मे वाचि श्रितः । वाग्धृदये । हृदयं मयि । अहममृते
    । अमृतं ब्रह्मणि । वायुर्मे प्राणे श्रितः । प्राणो हृदये । हृदयं मयि । अहममृते । अमृतं ब्रह्मणि ।
    सूर्यो मे चक्षुषि श्रितः । चक्षुर्हृदये । हृदयं मयि । अहममृते । अमृतं ब्रह्मणि । चन्द्रमा मे मनसि
    श्रितः । मनो हृदये । हृदयं मयि । अहममृते । अमृतं ब्रह्मणि । दिशो मे श्रोत्रे श्रिताः । श्रोत्र हृदये
    । हृदयं मयि । अहममृते । अमृतं ब्रह्मणि । आपो मे रेतसि श्रिताः । रेतो हृदये । हृदयं मयि । अहममृते ।
    अमृतं ब्रह्मणि । पृथिवी मे शरीरे श्रिता । शरीरग्ं हृदये । हृदयं मयि । अहममृते । अमृतं ब्रह्मणि । ओषधिवनस्पतयो
    मे लोमसु श्रिताः । लोमानि हृदये । हृदयं मयि । अहममृते । अमृतं ब्रह्मणि । इन्द्रो मे बले श्रितः । बल
    हृदये । हृदयं मयि । अहममृते । अमृतं ब्रह्मणि । पर्जन्यो मे मूर्ध्नि श्रितः । मूर्धा हृदये । हृदयं
    मयि । अहममृते । अमृतं ब्रह्मणि । ईशानो मे मन्यौ श्रितः । मन्युर्हृदये । हृदयं मयि । अहममृते । अमृतं
    ब्रह्मणि । आत्मा म आत्मनि श्रितः । आत्मा हृदये । हृदयं मयि । अहममृते । अमृतं ब्रह्मणि । पुनर्म आत्मा
    पुनरायुरागात् । पुनः प्राणः पुनराकूतमागात् । वैश्वानरो रश्मिभिर्वावृधानः । अन्तस्तिष्ठत्वमृतस्य गोपाः
    ॥ अस्य श्री रुद्राध्याय प्रश्न महामन्त्रस्य अघोर ऋषिः, अनुष्टुप् छन्दः, सङ्कर्षणमूर्तिस्वरूपो योऽसावादित्यः
    परमपुरुषः स एष रुद्रो देवता । नमः शिवायेति बीजम् । शिवतरायेति शक्तिः । महादेवायेति कीलकम् । श्री साम्बसदाशिव
    प्रसाद सिद्ध्यर्थे जपे विनियोगः ॥ ॐ अग्निहोत्रात्मने अङ्गुष्ठाभ्यां नमः । दर्शपूर्णमासात्मने तर्जनीभ्यां
    नमः । चातुर्मास्यात्मने मध्यमाभ्यां नमः । निरूढपशुबन्धात्मने अनामिकाभ्यां नमः । ज्योतिष्टोमात्मने
    कनिष्ठिकाभ्यां नमः । सर्वक्रत्वात्मने करतलकरपृष्ठाभ्यां नमः ॥ अग्निहोत्रात्मने हृदयाय नमः । दर्शपूर्णमासात्मने
    शिरसे स्वाहा । चातुर्मास्यात्मने शिखायै वषट् । निरूढपशुबन्धात्मने कवचाय हुम् । ज्योतिष्टोमात्मने नेत्रत्रयाय
    वौषट् । सर्वक्रत्वात्मने अस्त्राय फट् । भूर्भुवस्सुवरोमिति दिग्बन्धः ॥ ॥ ध्यानम् ॥ आपाताळनभः स्थलान्तभुवनब्रह्माण्डमाविस्फुर
    ज्ज्योतिः स्फाटिकलिङ्गमौळिविलसत्पूर्णेन्दुवान्तामृतैः । अस्तोकाप्लुतमेकमीशमनिशं रुद्रानुवाकाञ्जपन्
    ध्यायेदीप्सितसिद्धये ध्रुवपदं विप्रोऽभिषिञ्चेच्छिवम् ॥ ब्रह्माण्डव्याप्तदेहा भसितहिमरुचा भासमाना भुजङ्गैः
    कण्ठेकालाः कपर्दाकलितशशिकलाश्चण्डकोदण्ड हस्ताः ॥ त्र्यक्षा रुद्राक्षमालाः प्रकटितविभवाः शाम्भवा मूर्तिभेदा
    रुद्राः श्रीरुद्रसूक्तप्रकटितविभवा नः प्रयच्छन्तु सौख्यम् ॥ श्री गुरुभ्यो नमः । हरिः ओ३म् । ॐ गणानां
    त्वा गणपति हवामहे कविं कवीनामुपमश्रवस्तमम् । ज्येष्ठराजं ब्रह्मणां ब्रह्मणस्पत आ नः शृण्वन्नूतिभिस्सीद
    सादनम् ॥ ॥ ॐ श्री महागणपतये नमः ॥ ॐ शं च मे मयश्च मे प्रियं च मेऽनुकामश्च मे कामश्च मे सौमनसश्च मे
    भद्रं च मे श्रेयश्च मे वस्यश्च मे यशश्च मे भगश्च मे द्रविणं च मे यन्ता च मे धर्ता च मे क्षेमश्च मे
    धृतिश्च मे विश्वं च मे महश्च मे संविच्च मे ज्ञात्रं च मे सूश्च मे प्रसूश्च मे सीरं च मे लयश्च म ऋतं
    च मेऽमृतं च मेऽयक्ष्मं च मेऽनामयच्च मे जीवातुश्च मे दीर्घायुत्वं च मेऽनमित्रं च मेऽभयं च मे सुगं च
    मे शयनं च मे सूषा च मे सुदिनं च मे ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ ॥ शिवोपासन मन्त्राः ॥ निधनपतये नमः
    । निधनपतान्तिकाय नमः । ऊर्ध्वाय नमः । ऊर्ध्वलिङ्गाय नमः । हिरण्याय नमः । हिरण्यलिङ्गाय नमः । सुवर्णाय
    नमः । सुर्वर्णलिङ्गाय नमः । दिव्याय नमः । दिव्यलिङ्गाय नमः । भवाय नमः । भवलिङ्गाय नमः । शर्वाय नमः
    । शर्वलिङ्गाय नमः । शिवाय नमः । शिवलिङ्गाय नमः । ज्वलाय नमः । ज्वललिङ्गाय नमः । आत्माय नमः । आत्मलिङ्गाय
    नमः । परमाय नमः । परमलिङ्गाय नमः । एतथ्सोमस्य सूर्यस्य सर्वलिङ्ग स्थापयति पाणिमन्त्रं पवित्रम् ॥ सद्योजातं
    प्रपद्यामि सद्योजाताय वै नमो नमः । भवे भवे नातिभवे भवस्व माम् । भवोद्भवाय नमः ॥ वामदेवाय नमो ज्येष्ठाय
    नमश्श्रेष्ठाय नमो रुद्राय नमः कालाय नमः कलविकरणाय नमो बलविकरणाय नमो बलाय नमो बलप्रमथनाय नमस्सर्वभूतदमनाय
    नमो मनोन्मनाय नमः ॥ अघोरेभ्योऽथ घोरेभ्यो घोरघोरतरेभ्यः । सर्वेभ्यः सर्वशर्वेभ्यो नमस्ते अस्तु रुद्ररूपेभ्यः
    ॥ तत्पुरुषाय विद्महे महादेवाय धीमहि । तन्नो रुद्रः प्रचोदयात् ॥ ईशानस्सर्वविद्यानामीश्वरस्सर्व भूतानां
    ब्रह्माऽधिपतिर्ब्रह्मणोऽधिपतिर्ब्रह्मा शिवो मे अस्तु सदाशिवोम् ॥ नमो हिरण्यबाहवे हिरण्यवर्णाय हिरण्यरूपाय
    हिरण्यपतयेऽम्बिकापतय उमापतये पशुपतये नमो नमः । ऋत सत्यं परं ब्रह्म पुरुषं कृष्णपिङ्गलम् । ऊर्ध्वरेतं
    विरूपाक्षं विश्वरूपाय वै नमो नमः ॥ सर्वो वै रुद्रस्तस्मै रुद्राय नमो अस्तु । पुरुषो वै रुद्रस्सन्महो
    नमो नमः । विश्वं भूतं भुवनं चित्रं बहुधा जातं जायमानं च यत् । सर्वो ह्येष रुद्रस्तस्मै रुद्राय नमो
    अस्तु । कद्रुद्राय प्रचेतसे मीढुष्टमाय तव्यसे । वो चेम शन्तम हृदे । सर्वो ह्येष रुद्रस्तस्मै रुद्राय
    नमो अस्तु ॥ ध्यानम् आपातालनभःस्थलान्तभुवनब्रह्माण्डमाविस्फुर ज्ज्योतिः स्फाटिकलिङ्गमौलिविलसत् पूर्णेन्दुवान्तामृतैः
    । अस्तोकाप्लुतमेकमीशमनिशं रुद्रानुवाकाञ्जपन् ध्यायेदीप्सित सिद्धयेऽद्रुतपदं विप्रोऽभिषिञ्जेच्छिवम्
    ॥ ब्रह्माण्डव्याप्तदेहा भसितहिमरुचा भासमाना भुजङ्गैः कण्ठे कालाः कपर्दाकलित शशिकलाश्चण्डकोदण्डहस्ताः
    । त्र्यक्षा रुद्राक्षमालाः प्रणतभयहराः शाम्भवा मूर्तिभेदाः रुद्राः श्रीरुद्रसूक्तप्रकटितविभवा नः प्रयच्छन्तु
    सौख्यम् ॥
