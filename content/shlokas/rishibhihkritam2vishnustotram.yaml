id: rishibhihkritam2vishnustotram
category: stotram
name:
  english: rishibhihkritam2vishnustotram
  devanagari: ऋषिभिःकृतं२विष्णुस्तोत्रम्
content:
  english: 10|| hiranyagarbhagarbhaya jagatah karanatmane | acyutaya namo nityamanantaya namo namah ||
    11|| namo mayapatacchanna jagaddhatre mahatmane | samsarasagarottara jnanapotapradayine | akunthamataye
    dhatre sargasthityanta karmane || 12|| yatha hi vasudeveti prokte nashyati patakam | tatha vilayamabhyetu
    daityo'yam meghavahanah || 13|| yatha vishnuh svabhakteshu papamapnoti samsthitam | tatha vinashamayatu
    daityo'yam papakarmakrit || 14|| smritamatro yatha vishnuh sarvam papam vyapohati | tatha pranashamabhyetu
    daityo'yam meghavahanah || 15|| bhavantu bhadrani samastadoshah prayantu nasham jagato'khilasya |
    abhedyabhaktya parameshvareshe smrite jagaddhatari vasudeve || 16|| ye bhutale ye divi ye'ntarikshe
    rasatale praniganashca kecit | bhavantu te siddhiyuta narottamah smrite jagaddhatari vasudeve || 17||
    ye praninah kutracidatra santi brahmandamadhye paratashca kecit | tesham tu siddhih paramastvanindya
    stute jagaddhatari vasudeve || 18|| iti shriskandapurane prabhasakhande prabhasakshetramahatmye caturashititamadhyayantargatam
    rishibhih kritam vishnustotram samaptam | skandapurana | prabhasakhanda | adhyaya 84
  devanagari: १०॥ हिरण्यगर्भगर्भाय जगतः कारणात्मने । अच्युताय नमो नित्यमनन्ताय नमो नमः ॥ ११॥ नमो मायापटच्छन्न
    जगद्धात्रे महात्मने । संसारसागरोत्तार ज्ञानपोतप्रदायिने । अकुण्ठमतये धात्रे सर्गस्थित्यन्त कर्मणे
    ॥ १२॥ यथा हि वासुदेवेति प्रोक्ते नश्यति पातकम् । तथा विलयमभ्येतु दैत्योऽयं मेघवाहनः ॥ १३॥ यथा विष्णुः
    स्वभक्तेषु पापमाप्नोति संस्थितम् । तथा विनाशमायातु दैत्योऽयं पापकर्मकृत् ॥ १४॥ स्मृतमात्रो यथा विष्णुः
    सर्वं पापं व्यपोहति । तथा प्रणाशमभ्येतु दैत्योऽयं मेघवाहनः ॥ १५॥ भवन्तु भद्राणि समस्तदोषाः प्रयान्तु
    नाशं जगतोऽखिलस्य । अभेद्यभक्त्या परमेश्वरेशे स्मृते जगद्धातरि वासुदेवे ॥ १६॥ ये भूतले ये दिवि येऽन्तरिक्षे
    रसातले प्राणिगणाश्च केचित् । भवन्तु ते सिद्धियुता नरोत्तमाः स्मृते जगद्धातरि वासुदेवे ॥ १७॥ ये प्राणिनः
    कुत्रचिदत्र सन्ति ब्रह्माण्डमध्ये परतश्च केचित् । तेषां तु सिद्धिः परमास्त्वनिन्द्या स्तुते जगद्धातरि
    वासुदेवे ॥ १८॥ इति श्रीस्कन्दपुराणे प्रभासखण्डे प्रभासक्षेत्रमाहात्म्ये चतुरशीतितमाध्यायान्तर्गतं
    ऋषिभिः कृतं विष्णुस्तोत्रं समाप्तम् । स्कन्दपुराण । प्रभासखण्ड । अध्याय ८४
