    आयु॑ष्ट आयु॒र्दा अ॑ग्न॒ आ प्या॑यस्व॒ स न्ते ऽव॑ ते॒ हेड॒ उदु॑त्त॒म म्प्रणो॑ दे॒व्या नो॑ दि॒वो ऽग्ना॑
    विष्णू॒ अग्ना॑विष्णू इ॒म तत्त्वा॑ या॒ म्यु दु॒त्य मू॒र्ध्वो वि॒द्युतं॒ वँसा॑नः । तस्य॒ ज्येष्ठ॑ वँह॑न्ती॒र्॒
    हिर॑ण्यवर्णाः॒ परि॑ यन्ति य॒ह्वीः ॥ स म॒न्या यन्त्युप॑ यन्त्य॒न्या न्न॒द्यः॑ पृणन्ति । तमू॒ शुचि॒ग्ं॒
    शुच॑यो दीदि॒वाग्ं स॑म॒पा म्परि॑तस्थु॒रापः॑ । तमस्मे॑रा युव॒तयो॒ युवा॑न म्मर्मृ॒ज्यमा॑नाः॒ परि॑ य॒न्त्यापः॑
    ॥ स शु॒क्रेण॒ शिक्व॑ना रे॒वद॒ग्निर्दी॒दाया॑नि॒द्ध्मो घृ॒तनि॑र्णिग॒फ्सु ॥ इन्द्रा॒वरु॑णयोर॒हग्ंस॒म्राजो॒रव॒
    आ वृ॑णे । ता नो॑ मृडात ई॒दृशे ॥ इन्द्रा॑वरुणा यु॒वम॑द्ध्व॒राय॑ नो वि॒शे जना॑य॒ महि॒ शर्म॑ यच्छतम्
    । दी॒र्घप्र॑यज्यु॒मति॒ यो व॑नु॒ष्यति॑ व॒य ञ्ज॑येम॒ पृत॑नासु दू॒ढ्यः॑ ॥ आ नो॑मित्रावरुणा॒ न्नो॑ अग्ने॒
    वरु॑णस्य वि॒द्वा ऽव॑ यासि सीष्ठाः । यजि॑ष्ठो॒ वह्नि॑ तम॒ श्शोशु॑चानो॒ विश्वा॒ द्वेषाग्ं॑सि॒ प्रमु॑मुग्ध्य॒स्मत्
    ॥ स त्वन्नो॑ अग्ने ऽव॒मो भ॑वो॒ती नेदि॑ष्ठो अ॒स्या उ॒षसो॒ व्यु॑ष्टौ । अव॑ यक्ष्व नो॒ वरु॑ण॒ग्ं॒ ररा॑णो
    वी॒हि मृ॑डी॒कग्ं सु॒हवो॑ न एधि ॥ प्रप्रा॒यम॒ग्निर्भ॑र॒तस्य॑ शृण्वे॒ वि य थ्सूर्यो॒ न रोच॑ते बृ॒हद्भाः
    । अ॒भि यः पू॒रु म्पृत॑नासु त॒स्थौ दी॒दाय॒ दैव्यो॒ अति॑थि श्शि॒वो नः॑ ॥ प्र ते॑ यक्षि॒ प्र त॑ इयर्मि॒
    मन्म॒ भुवो॒ यथा॒ वन्द्यो॑ नो॒ हवे॑षु । धन्व॑न्निव प्र॒पा अ॑सि॒ त्वम॑ग्न इय॒क्षवे॑ पू॒रवे ॥ वि पाज॑सा॒
    वि ज्योति॑षा ॥ स त्वम॑ग्ने॒ प्रती॑केन॒ प्रत्यो॑ष यातुधा॒न्यः॑ । उ॒रु॒क्षये॑षु॒ दीद्य॑त् ॥ तग्ं सु॒प्रती॑कग्ं
    सु॒दृश॒ग्ग्॒ स्वञ्च॒ मवि॑द्वाग्ंसो वि॒दुष्ट॑रग्ं सपेम । स य॑क्ष॒ द्विश्वा॑ व॒युना॑नि वि॒द्वा र॒मृते॑षु
    वोचत् ॥ अ॒ग्ं॒हो॒मुचे॑ वि॒वेष॒ यन्मा॒ विन॑ इ॒न्द्रे न्द्र॑ क्ष॒त्रमि॑न्द्रि॒याणि॑ शतक्र॒तो ऽनु॑ ते
    दायि ॥ ॥ हरिः॑ ओम् ॥ ॥ कृष्ण यजुर्वेदीय तैत्तिरीय संहिताया न्द्वितीयकाण्डे पञ्चमः प्रश्न
