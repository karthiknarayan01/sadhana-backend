id: shitalakavacam
category: kavacha
name:
  english: shitalakavacam
  devanagari: शीतलाकवचम्
content:
  english: brahmani shishnam patu vrishanam patu kapalini | guhyam guhyeshvari patu janunorjagadishvari
    || 11|| patu gulphau tu kaumari padaprishtham tu vaishnavi | varahi patu padagre aindrani sarvamarmasu
    || 12|| marge rakshatu camunda vane tu vanavasini | jale ca vijaya rakshet vahnau me caparajita ||
    13|| rane kshemakari rakshet sarvatra sarvamangala | bhavani patu bandhun me bharya rakshatu cambika
    || 14|| putran rakshatu mahendri kanyakam patu shambhavi | griheshu sarvakalyani patu nityam maheshvari
    || 15|| purve kadambari patu vahnau shukleshvari tatha | dakshine karalini patu pretarudha tu nairrite
    || 16|| pashahasta pashcime patu vayavye mrigavahini | patu me cottare devi yakshini simhavahini |
    ishane shulini patu urdhve ca khagagamini || 17|| adhastatvaishnavi patu sarvatra narasimhika | prabhate
    sundari patu madhyahne jagadambika || 18|| sayahne candika patu nishithe'tra nishacari | nishante
    khecari patu sarvada divyayogini || 19|| vayau mam patu vetali vahane vajradharini | simha simhasane
    patu shayyam ca bhagamalini || 20|| sarvarogeshu mam patu kalaratrisvarupini | yakshebhyo yakshini
    patu rakshase dakini tatha || 21|| bhutapretapishacebhyo hakini patu mam sada | mantram mantrabhicareshu
    shakini patu mam sada || 22|| sarvatra sarvada patu shridevi girijatmaja | ityetatkathitam guhyam
    shitalakavacamuttamam || 23|| phalashrutih
  devanagari: ब्रह्माणी शिश्नं पातु वृषणं पातु कपालिनी । गुह्यं गुह्येश्वरी पातु जानुनोर्जगदीश्वरी ॥ ११॥
    पातु गुल्फौ तु कौमारी पादपृष्ठं तु वैष्णवी । वाराही पातु पादाग्रे ऐन्द्राणी सर्वमर्मसु ॥ १२॥ मार्गे
    रक्षतु चामुण्डा वने तु वनवासिनी । जले च विजया रक्षेत् वह्नौ मे चापराजिता ॥ १३॥ रणे क्षेमकरी रक्षेत्
    सर्वत्र सर्वमङ्गला । भवानी पातु बन्धून् मे भार्या रक्षतु चाम्बिका ॥ १४॥ पुत्रान् रक्षतु माहेन्द्री
    कन्यकां पातु शाम्भवी । गृहेषु सर्वकल्याणी पातु नित्यं महेश्वरी ॥ १५॥ पूर्वे कादम्बरी पातु वह्नौ शुक्लेश्वरी
    तथा । दक्षिणे करालिनी पातु प्रेतारुढा तु नैरृते ॥ १६॥ पाशहस्ता पश्चिमे पातु वायव्ये मृगवाहिनी । पातु
    मे चोत्तरे देवी यक्षिणी सिंहवाहिनी । ईशाने शूलिनी पातु ऊर्ध्वे च खगगामिनी ॥ १७॥ अधस्तात्वैष्णवी पातु
    सर्वत्र नारसिंहिका । प्रभाते सुन्दरी पातु मध्याह्ने जगदम्बिका ॥ १८॥ सायाह्ने चण्डिका पातु निशीथेऽत्र
    निशाचरी । निशान्ते खेचरी पातु सर्वदा दिव्ययोगिनी ॥ १९॥ वायौ मां पातु वेताली वाहने वज्रधारिणी । सिंहा
    सिंहासने पातु शय्यां च भगमालिनी ॥ २०॥ सर्वरोगेषु मां पातु कालरात्रिस्वरुपिणी । यक्षेभ्यो यक्षिणी पातु
    राक्षसे डाकिनी तथा ॥ २१॥ भूतप्रेतपिशाचेभ्यो हाकिनी पातु मां सदा । मन्त्रं मन्त्राभिचारेषु शाकिनी पातु
    मां सदा ॥ २२॥ सर्वत्र सर्वदा पातु श्रीदेवी गिरिजात्मजा । इत्येतत्कथितं गुह्यं शीतलाकवचमुत्तमम् ॥ २३॥
    फलश्रुतिः
