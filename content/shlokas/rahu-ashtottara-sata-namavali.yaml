id: rahu-ashtottara-sata-namavali
category: stotram
name:
  english: Rahu Ashtottara Sata Namavali
content:
  english: om rahave namah | om saimhikeyaya namah | om vidhuntudaya namah | om surashatrave namah | om
    tamase namah | om phanine namah | om gargyayanaya namah | om suragave namah | om nilajimutasankashaya
    namah | om caturbhujaya namah || || om khadgakhetakadharine namah | om varadayakahastakaya namah |
    om shulayudhaya namah | om meghavarnaya namah | om krishnadhvajapatakavate namah | om dakshinashamukharataya
    namah | om tikshnadamshtradharaya namah | om shurpakarasanasthaya namah | om gomedabharanapriyaya
    namah | om mashapriyaya namah || || om kashyaparshinandanaya namah | om bhujageshvaraya namah | om
    ulkapatajanaye namah | om shuline namah | om nidhipaya namah | om krishnasarparaje namah | om vishajvalavritasyaya
    namah | om ardhashariraya namah | om jadyasampradaya namah | om ravindubhikaraya namah || || om chayasvarupine
    namah | om kathinangakaya namah | om dvishaccakracchedakaya namah | om karalasyaya namah | om bhayankaraya
    namah | om krurakarmane namah | om tamorupaya namah | om shyamatmane namah | om nilalohitaya namah
    | om kiritine namah || || om nilavasanaya namah | om shanisamantavartmagaya namah | om candalavarnaya
    namah | om ashvyarkshabhavaya namah | om meshabhavaya namah | om shanivatphaladaya namah | om shuraya
    namah | om apasavyagataye namah | om uparagakaraya namah | om suryahimamshucchaviharakaya namah ||
    || om nilapushpaviharaya namah | om grahashreshthaya namah | om ashtamagrahaya namah | om kabandhamatradehaya
    namah | om yatudhanakulodbhavaya namah | om govindavarapatraya namah | om devajatipravishtakaya namah
    | om kruraya namah | om ghoraya namah | om shanermitraya namah || || om shukramitraya namah | om agocaraya
    namah | om mane gangasnanadatre namah | om svagrihe prabaladhyakaya namah | om sadgrihe'nyabaladhrite
    namah | om caturthe matrinashakaya namah | om candrayukte candalajanmasucakaya namah | om janmasimhe
    namah | om rajyadatre namah | om mahakayaya namah || || om janmakartre namah | om vidhuripave namah
    | om mattako jnanadaya namah | om janmakanyarajyadatre namah | om janmahanidaya namah | om navame
    pitrihantre namah | om pancame shokadayakaya namah | om dyune kalatrahantre namah | om saptame kalahapradaya
    namah | om shashthe vittadatre namah || || om caturthe vairadayakaya namah | om navame papadatre namah
    | om dashame shokadayakaya namah | om adau yashah pradatre namah | om ante vairapradayakaya namah
    | om kalatmane namah | om gocaracaraya namah | om dhane kakutpradaya namah | om pancame dhrishanashringadaya
    namah | om svarbhanave namah || || om baline namah | om mahasaukhyapradayine namah | om candravairine
    namah | om shashvataya namah | om surashatrave namah | om papagrahaya namah | om shambhavaya namah
    | om pujyakaya namah | om pathinapuranaya namah | om paithinasakulodbhavaya namah || || om dirgha
    krishnaya namah | om ashirase namah | om vishnunetraraye namah | om devaya namah | om danavaya namah
    | om bhaktarakshaya namah | om rahumurtaye namah | om sarvabhishtaphalapradaya namah ||
  devanagari: ॐ राहवे नमः । ॐ सैंहिकेयाय नमः । ॐ विधुन्तुदाय नमः । ॐ सुरशत्रवे नमः । ॐ तमसे नमः । ॐ फणिने
    नमः । ॐ गार्ग्यायणाय नमः । ॐ सुरागवे नमः । ॐ नीलजीमूतसङ्काशाय नमः । ॐ चतुर्भुजाय नमः ॥ ॥ ॐ खड्गखेटकधारिणे
    नमः । ॐ वरदायकहस्तकाय नमः । ॐ शूलायुधाय नमः । ॐ मेघवर्णाय नमः । ॐ कृष्णध्वजपताकावते नमः । ॐ दक्षिणाशामुखरताय
    नमः । ॐ तीक्ष्णदंष्ट्रधराय नमः । ॐ शूर्पाकारासनस्थाय नमः । ॐ गोमेदाभरणप्रियाय नमः । ॐ माषप्रियाय नमः
    ॥ ॥ ॐ कश्यपर्षिनन्दनाय नमः । ॐ भुजगेश्वराय नमः । ॐ उल्कापातजनये नमः । ॐ शूलिने नमः । ॐ निधिपाय नमः
    । ॐ कृष्णसर्पराजे नमः । ॐ विषज्वलावृतास्याय नमः । ॐ अर्धशरीराय नमः । ॐ जाद्यसम्प्रदाय नमः । ॐ रवीन्दुभीकराय
    नमः ॥ ॥ ॐ छायास्वरूपिणे नमः । ॐ कठिनाङ्गकाय नमः । ॐ द्विषच्चक्रच्छेदकाय नमः । ॐ करालास्याय नमः । ॐ
    भयङ्कराय नमः । ॐ क्रूरकर्मणे नमः । ॐ तमोरूपाय नमः । ॐ श्यामात्मने नमः । ॐ नीललोहिताय नमः । ॐ किरीटिणे
    नमः ॥ ॥ ॐ नीलवसनाय नमः । ॐ शनिसामान्तवर्त्मगाय नमः । ॐ चाण्डालवर्णाय नमः । ॐ अश्व्यर्क्षभवाय नमः ।
    ॐ मेषभवाय नमः । ॐ शनिवत्फलदाय नमः । ॐ शूराय नमः । ॐ अपसव्यगतये नमः । ॐ उपरागकराय नमः । ॐ सूर्यहिमांशुच्छविहारकाय
    नमः ॥ ॥ ॐ नीलपुष्पविहाराय नमः । ॐ ग्रहश्रेष्ठाय नमः । ॐ अष्टमग्रहाय नमः । ॐ कबन्धमात्रदेहाय नमः ।
    ॐ यातुधानकुलोद्भवाय नमः । ॐ गोविन्दवरपात्राय नमः । ॐ देवजातिप्रविष्टकाय नमः । ॐ क्रूराय नमः । ॐ घोराय
    नमः । ॐ शनेर्मित्राय नमः ॥ ॥ ॐ शुक्रमित्राय नमः । ॐ अगोचराय नमः । ॐ माने गङ्गास्नानदात्रे नमः । ॐ
    स्वगृहे प्रबलाढ्यकाय नमः । ॐ सद्गृहेऽन्यबलधृते नमः । ॐ चतुर्थे मातृनाशकाय नमः । ॐ चन्द्रयुक्ते चण्डालजन्मसूचकाय
    नमः । ॐ जन्मसिंहे नमः । ॐ राज्यदात्रे नमः । ॐ महाकायाय नमः ॥ ॥ ॐ जन्मकर्त्रे नमः । ॐ विधुरिपवे नमः
