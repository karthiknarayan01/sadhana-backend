    ॐ दुर्धराय नमः । ॐ हरये नमः । ॐ दुःस्वप्नहन्त्रे नमः । ॐ दुर्धर्षाय नमः । ॐ दुष्टगर्वविमोचकाय नमः
    । ॐ भरद्वाजकुलोद्भूताय नमः । ॐ भूसुताय नमः । ॐ भव्यभूषणाय नमः । ॐ रक्ताम्बराय नमः ॥ ॥ ॐ रक्तवपुषे
