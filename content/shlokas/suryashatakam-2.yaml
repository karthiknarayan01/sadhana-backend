id: suryashatakam-2
category: stotram
name:
  english: suryashatakam 2
  devanagari: सूर्यशतकम् २
content:
  english: tsahasrashatkojjvalayojanena | vyasena yuktam ghanagolarupam tasmai namah pankajabandhavaya
    || 83|| savyam suranamapasavyavrittya rakshovaranam gagane carantam | tesham dina manavavatsarena
    prapurayantam ravimashrayami || 84|| namami devam mahitaprabhavam vipakshadavam parishuddhabhavam
    | ranangaganaprotthitashankharavam chayasatikalpitanutnasevam || 85|| samancitahladamuruprasadam sarojapadam
    shritasarvavedam | mrigendranatham kritadaityakhedam samagravadam savitaramide || 86|| namami surya
    nagarajadhairyam kripardracaryam kritapunyakaryam | suparvavaryam sugunaughadhuryam pancasyaviryam
    paripalitaryam || 87|| vande dinesham varahemakesham satkirtikasham satataprakasham | shrimatpradesham
    shritapapanasham prabhavritasham prathitaprajesham || 88|| satyaya nityaya cidatmakaya gudhaya rudhaya
    paratparaya | divyaya bhavyaya divakaraya manyaya dhanyaya namo namaste || 89|| acintyamavyaktamanadimadhyam
    cidrupamanandaghanam prashantam | jyotirmayam yam pravadanti vedah tasmai namaste'stu vikartanaya
    || 90|| durgaganadhishvarashambhuvishnu
  devanagari: त्सहस्रषट्कोज्ज्वलयोजनेन । व्यासेन युक्तं घनगोलरूपं तस्मै नमः पङ्कजबान्धवाय ॥ ८३॥ सव्यं
    सुराणामपसव्यवृत्त्या रक्षोवराणां गगने चरन्तम् । तेषां दिन मानववत्सरेण प्रपूरयन्तं रविमाश्रयामि ॥ ८४॥
    नमामि देवं महितप्रभावं विपक्षदावं परिशुद्धभावम् । रणाङ्गगणप्रोत्थितशङ्खरावं छायासतीकल्पितनूत्नसेवम्
    ॥ ८५॥ समञ्चिताह्लादमुरुप्रसादं सरोजपादं श्रितसर्ववेदम् । मृगेन्द्रनाथं कृतदैत्यखेदं समग्रवादं सवितारमीडे
    ॥ ८६॥ नमामि सूर्य नगराजधैर्यं कृपार्द्रचर्यं कृतपुण्यकार्यम् । सुपर्ववर्यं सुगुणौघधुर्यं पञ्चास्यवीर्यं
    परिपालितार्यम् ॥ ८७॥ वन्दे दिनेशं वरहेमकेशं सत्कीर्तिकाशं सततप्रकाशम् । श्रीमत्प्रदेशं श्रितपापनाशं
    प्रभावृताशं प्रथितप्रजेशम् ॥ ८८॥ सत्याय नित्याय चिदात्मकाय गूढाय रूढाय परात्पराय । दिव्याय भव्याय
    दिवाकराय मान्याय धन्याय नमो नमस्ते ॥ ८९॥ अचिन्त्यमव्यक्तमनादिमध्यं चिद्रूपमानन्दघनं प्रशान्तम् । ज्योतिर्मयं
    यं प्रवदन्ति वेदाः तस्मै नमस्तेऽस्तु विकर्तनाय ॥ ९०॥ दुर्गागणाधीश्वरशम्भुविष्णु
