id: vemkateshavijayastotram
category: stotram
name:
  english: vemkateshavijayastotram
  devanagari: वेंकटेशविजयस्तोत्रम्
content:
  english: deha dayakara sharadanirajacaruvilocana | devashiromani padasaroruha venkatashailapate vijayibhava
    || 2|| anjanashailanivasa niranjana ranjitasarvajananjanamecaka | mamabhishinca kripamritashitalashikaravarshidrisha
    jagadishvara || 3|| vitasamadhika saragunakara kevalasattvatano purushottama | bhimabhavarnavataranakovida
    venkatashailapate vijayibhava || 4|| svamisarovaratiraramakritakelimaharasalalasamanasa | saratapodhanacittaniketana
    venkatashailapate vijayibhava || 5|| ayudhabhushanakotiniveshitashankharathangajitamatasammata | svetaradurghatasanghatanakshama
    venkatashailapate vijayibhava || 6|| pankajana
  devanagari: देह दयाकर शारदनीरजचारुविलोचन । देवशिरोमणि पादसरोरुह वेङ्कटशैलपते विजयीभव ॥ २॥ अञ्जनशैलनिवास
    निरञ्जन रञ्जितसर्वजनाञ्जनमेचक । मामभिषिञ्च कृपामृतशीतलशीकरवर्षिदृशा जगदीश्वर ॥ ३॥ वीतसमाधिक सारगुणाकर
    केवलसत्त्वतनो पुरुषोत्तम । भीमभवार्णवतारणकोविद वेङ्कटशैलपते विजयीभव ॥ ४॥ स्वामिसरोवरतीररमाकृतकेलिमहारसलालसमानस
    । सारतपोधनचित्तनिकेतन वेङ्कटशैलपते विजयीभव ॥ ५॥ आयुधभूषणकोटिनिवेशितशङ्खरथाङ्गजितामतसम्मत । स्वेतरदुर्घटसङ्घटनक्षम
    वेङ्कटशैलपते विजयीभव ॥ ६॥ पङ्कजना
