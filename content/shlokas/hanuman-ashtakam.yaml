id: hanuman-ashtakam
category: stotram
name:
  english: Hanuman Ashtakam
content:
  english: shriraghurajapadabjaniketana pankajalocana mangalarashe candamahabhujadanda surarivikhandanapandita
    pahi dayalo | patakinam ca samuddhara mam mahatam hi satamapi manamudaram tvam bhajato mama dehi dayaghana
    he hanuman svapadambujadasyam || || samsrititapamahanaladagdhatanuruhamarmatanorativelam putradhanasvajanatmagrihadishu
    saktamateratikilbishamurteh | kenacidapyamalena purakritapunyasupunjalavena vibho vai tvam bhajato
    mama dehi dayaghana he hanuman svapadambujadasyam || || samsritikupamanalpamaghoranidaghanidanamajasramashesham
    prapya suduhkhasahasrabhujangavishaikasamakulasarvatanorme | ghoramahakripanapadameva gatasya hare
    patitasya bhavabdhau tvam bhajato mama dehi dayaghana he hanuman svapadambujadasyam || || samsritisindhuvishalakaralamahabalakalajhashagrasanartam
    vyagrasamagradhiyam kripanam ca mahamadanakrasucakrahritasum | kalamaharasanorminipiditamuddhara dinamananyagatim
    mam tvam bhajato mama dehi dayaghana he hanuman svapadambujadasyam || || samsritighoramahagahane carato
    maniranjitapunyasumurteh manmathabhikaraghoramahogramrigapravararditagatrasusandheh | matsaratapavisheshanipiditabahyamateshca
    katham cidameyam tvam bhajato mama dehi dayaghana he hanuman svapadambujadasyam || || samsritivrikshamanekashataghanidanamanantavikarmasushakham
    duhkhaphalam karanadipalashamanangasupushpamacintyasumulam | tam hyadhiruhya hare patitam sharanagatameva
    vimocaya mudham tvam bhajato mama dehi dayaghana he hanuman svapadambujadasyam || || samsritipannagavaktrabhayankaradamshtramahavishadagdhashariram
    pranavinirgamabhitisamakulamandamanathamativa vishannam | mohamahakuhare patitam dayayoddhara mamajitendriyakamam
    tvam bhajato mama dehi dayaghana he hanuman svapadambujadasyam || || indriyanamakacoraganairhritatattvavivekamahadhanarashim
    samsritijalanipatitameva mahabalibhishca vikhanditakayam | tvatpadapadmamanuttamamashritamashu kapishvara
    pahi kripalo tvam bhajato mama dehi dayaghana he hanuman svapadambujadasyam || || brahmamarudganarudramahendrakiritasukotilasatpadapitham
    dasharathim japati kshitimandala esha nidhaya sadaiva hridabje | tasya hanumata eva shivankaramashtakametadanishtaharam
    vai yah satatam hi pathetsa naro labhate'cyutaramapadabjanivasam || || iti shri madhusudanashrama
    shishya'cyutaviracitam shrimaddanumadashtakam |
  devanagari: श्रीरघुराजपदाब्जनिकेतन पङ्कजलोचन मङ्गलराशे चण्डमहाभुजदण्ड सुरारिविखण्डनपण्डित पाहि दयालो
    । पातकिनं च समुद्धर मां महतां हि सतामपि मानमुदारं त्वां भजतो मम देहि दयाघन हे हनुमन् स्वपदाम्बुजदास्यम्
    ॥ ॥ संसृतितापमहानलदग्धतनूरुहमर्मतनोरतिवेलं पुत्रधनस्वजनात्मगृहादिषु सक्तमतेरतिकिल्बिषमूर्तेः । केनचिदप्यमलेन
    पुराकृतपुण्यसुपुञ्जलवेन विभो वै त्वां भजतो मम देहि दयाघन हे हनुमन् स्वपदाम्बुजदास्यम् ॥ ॥ संसृतिकूपमनल्पमघोरनिदाघनिदानमजस्रमशेषं
    प्राप्य सुदुःखसहस्रभुजङ्गविषैकसमाकुलसर्वतनोर्मे । घोरमहाकृपणापदमेव गतस्य हरे पतितस्य भवाब्धौ त्वां
    भजतो मम देहि दयाघन हे हनुमन् स्वपदाम्बुजदास्यम् ॥ ॥ संसृतिसिन्धुविशालकरालमहाबलकालझषग्रसनार्तं व्यग्रसमग्रधियं
    कृपणं च महामदनक्रसुचक्रहृतासुम् । कालमहारसनोर्मिनिपीडितमुद्धर दीनमनन्यगतिं मां त्वां भजतो मम देहि
    दयाघन हे हनुमन् स्वपदाम्बुजदास्यम् ॥ ॥ संसृतिघोरमहागहने चरतो मणिरञ्जितपुण्यसुमूर्तेः मन्मथभीकरघोरमहोग्रमृगप्रवरार्दितगात्रसुसन्धेः
    । मत्सरतापविशेषनिपीडितबाह्यमतेश्च कथं चिदमेयं त्वां भजतो मम देहि दयाघन हे हनुमन् स्वपदाम्बुजदास्यम्
    ॥ ॥ संसृतिवृक्षमनेकशताघनिदानमनन्तविकर्मसुशाखं दुःखफलं करणादिपलाशमनङ्गसुपुष्पमचिन्त्यसुमूलम् । तं ह्यधिरुह्य
    हरे पतितं शरणागतमेव विमोचय मूढं त्वां भजतो मम देहि दयाघन हे हनुमन् स्वपदाम्बुजदास्यम् ॥ ॥ संसृतिपन्नगवक्त्रभयङ्करदंष्ट्रमहाविषदग्धशरीरं
    प्राणविनिर्गमभीतिसमाकुलमन्दमनाथमतीव विषण्णम् । मोहमहाकुहरे पतितं दययोद्धर मामजितेन्द्रियकामं त्वां
    भजतो मम देहि दयाघन हे हनुमन् स्वपदाम्बुजदास्यम् ॥ ॥ इन्द्रियनामकचोरगणैर्हृततत्त्वविवेकमहाधनराशिं संसृतिजालनिपातितमेव
    महाबलिभिश्च विखण्डितकायम् । त्वत्पदपद्ममनुत्तममाश्रितमाशु कपीश्वर पाहि कृपालो त्वां भजतो मम देहि दयाघन
    हे हनुमन् स्वपदाम्बुजदास्यम् ॥ ॥ ब्रह्ममरुद्गणरुद्रमहेन्द्रकिरीटसुकोटिलसत्पदपीठं दाशरथिं जपति क्षितिमण्डल
    एष निधाय सदैव हृदब्जे । तस्य हनूमत एव शिवङ्करमष्टकमेतदनिष्टहरं वै यः सततं हि पठेत्स नरो लभतेऽच्युतरामपदाब्जनिवासम्
    ॥ ॥ इति श्री मधुसूदनाश्रम शिष्याऽच्युतविरचितं श्रीमद्दनुमदष्टकम् ।
