id: narayaniyam-dashaka-9
category: stotram
name:
  english: Narayaniyam Dashaka 9
content:
  english: sthitassa kamalodbhavastava hi nabhipankeruhe kutah svididamambudhavuditamityanalokayan | tadikshanakutuhalat
    pratidisham vivrittanana shcaturvadanatamagadvikasadashtadrishtyambujam || || maharnavavighurnitam
    kamalameva tatkevalam vilokya tadupashrayam tava tanum tu nalokayan | ka esha kamalodare mahati nissahayo
    hyaham kutah svididambujam samajaniti cintamagat || || amushya hi saroruhah kimapi karanam sambhve
    diti sma kritanishcayassa khalu nalarandhradhvana | svayogabalavidyaya samavarudhavan praudhadhi stvadiyamatimohanam
    na tu kalevaram drishtavan || || tatah sakalanalikavivaramargago margayan prayasya shatavatsaram kimapi
    naiva sandrishtavan | nivritya kamalodare sukhanishanna ekagradhih samadhibalamadadhe bhavadanugrahaikagrahi
    || || shatena parivatsarairdridhasamadhibandhollasat prabodhavishadikritah sa khalu padminisambhavah
    | adrishtacaramadbhutam tava hi rupamantardrisha vyacashta paritushtadhirbhujagabhogabhagashrayam
    || || kiritamukutollasatkatakaharakeyurayun manisphuritamekhalam suparivitapitambaram | kalayakusumaprabham
    galatalollasatkaustubham vapustadayi bhavaye kamalajanme darshitam || || shrutiprakaradarshitapracuravaibhava
    shripate hare jaya jaya prabho padamupaishi dishtya drishoh | kurushva dhiyamashu me bhuvananirmitau
    karmatha miti druhinavarnitasvagunabamhima pahi mam || || labhasva bhuvanatrayiracanadakshatamakshatam
    grihana madanugraham kuru tapashca bhuyo vidhe | bhavatvakhilasadhani mayi ca bhaktiratyutkate tyudirya
    giramadadha muditacetasam vedhasam || || shatam kritatapastatah sa khalu divyasamvatsara navapya ca
    tapobalam matibalam ca purvadhikam | udikshya kila kampitam payasi pankajam vayuna bhavadbalavijrimbhitah
    pavanapathasi pitavan || || tavaiva kripaya punassarasijena tenaiva sah prakalpya bhuvanatrayim pravavrite
    prajanirmitau | tathavidhakripabharo gurumarutpuradhishvara tvamashu paripahi mam gurudayokshitairikshitaih
    ||
  devanagari: स्थितस्स कमलोद्भवस्तव हि नाभिपङ्केरुहे कुतः स्विदिदमम्बुधावुदितमित्यनालोकयन् । तदीक्षणकुतूहलात्
    प्रतिदिशं विवृत्तानन श्चतुर्वदनतामगाद्विकसदष्टदृष्ट्यम्बुजाम् ॥ ॥ महार्णवविघूर्णितं कमलमेव तत्केवलं
    विलोक्य तदुपाश्रयं तव तनुं तु नालोकयन् । क एष कमलोदरे महति निस्सहायो ह्यहं कुतः स्विदिदम्बुजं समजनीति
    चिन्तामगात् ॥ ॥ अमुष्य हि सरोरुहः किमपि कारणं सम्भ्वे दिति स्म कृतनिश्चयस्स खलु नालरन्ध्राध्वना ।
    स्वयोगबलविद्यया समवरूढवान् प्रौढधी स्त्वदीयमतिमोहनं न तु कलेवरं दृष्टवान् ॥ ॥ ततः सकलनालिकाविवरमार्गगो
    मार्गयन् प्रयस्य शतवत्सरं किमपि नैव सन्दृष्टवान् । निवृत्य कमलोदरे सुखनिषण्ण एकाग्रधीः समाधिबलमादधे
    भवदनुग्रहैकाग्रही ॥ ॥ शतेन परिवत्सरैर्दृढसमाधिबन्धोल्लसत् प्रबोधविशदीकृतः स खलु पद्मिनीसम्भवः । अदृष्टचरमद्भुतं
    तव हि रूपमन्तर्दृशा व्यचष्ट परितुष्टधीर्भुजगभोगभागाश्रयम् ॥ ॥ किरीटमुकुटोल्लसत्कटकहारकेयूरयुङ् मणिस्फुरितमेखलं
    सुपरिवीतपीताम्बरम् । कलायकुसुमप्रभं गलतलोल्लसत्कौस्तुभं वपुस्तदयि भावये कमलजन्मे दर्शितम् ॥ ॥ श्रुतिप्रकरदर्शितप्रचुरवैभव
    श्रीपते हरे जय जय प्रभो पदमुपैषि दिष्ट्या दृशोः । कुरुष्व धियमाशु मे भुवननिर्मितौ कर्मठा मिति द्रुहिणवर्णितस्वगुणबंहिमा
    पाहि माम् ॥ ॥ लभस्व भुवनत्रयीरचनदक्षतामक्षतां गृहाण मदनुग्रहं कुरु तपश्च भूयो विधे । भवत्वखिलसाधनी
    मयि च भक्तिरत्युत्कटे त्युदीर्य गिरमादधा मुदितचेतसं वेधसम् ॥ ॥ शतं कृततपास्ततः स खलु दिव्यसंवत्सरा
    नवाप्य च तपोबलं मतिबलं च पूर्वाधिकम् । उदीक्ष्य किल कम्पितं पयसि पङ्कजं वायुना भवद्बलविजृम्भितः पवनपाथसी
    पीतवान् ॥ ॥ तवैव कृपया पुनस्सरसिजेन तेनैव सः प्रकल्प्य भुवनत्रयीं प्रववृते प्रजानिर्मितौ । तथाविधकृपाभरो
    गुरुमरुत्पुराधीश्वर त्वमाशु परिपाहि मां गुरुदयोक्षितैरीक्षितैः ॥
