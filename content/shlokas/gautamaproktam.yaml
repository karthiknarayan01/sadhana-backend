id: gautamaproktam
category: upanishad
name:
  english: gautamaproktam
  devanagari: गौतमप्रोक्तम्
content:
  english: gautamah yo vai rudrah sa bhagavanbrahma sakshanmaheshvarah | sarvatantrasvatantrashca tasmai
    vai te namo namah || 22|| yo vai rudrah sa bhagavanvishnubrahmadivanditah | yashca brahma maharudrastasmai
    vai te namo namah || 23|| yo vai rudrah sa bhagavanparvatiramanah prabhuh | yashca vishnurvirupakshastasmai
    vai te namo namah || 24|| yo vai rudrah sa bhagavan ya coma parameshvari | umakanto nirguno'pi tasmai
    vai te namo namah || 25|| yo vai rudrah sa bhagavan yashca sakshadvinayakah | yashca nityo vyapakashca
    tasmai vai te namo namah || 26|| yo vai rudrah sa bhagavan yashca skandah surarcitah | yashca sakshajjagatkarta
    tasmai vai te namo namah || 27|| yo vai rudrah sa bhagavan yashcendrah svargapalakah | yashca svargaprado
    nityam tasmai vai te namo namah || 28|| yo vai rudrah sa bhagavan yashcagnistejasam nidhih | yashca
    tejomayah sakshat tasmai vai te namo namah || 29|| yo vai rudrah sa bhagavan yashca suryo mariciman
    | yashca grahaganadhishastasmai vai te namo namah || 30|| yo vai rudrah sa bhagavan yashca candrastadatmakah
    | candrakotisamaprakhyastasmai vai te namo namah || 31|| yo vai rudrah sa bhagavan bhurbhuvahsvahprabhushca
    yah | yashca bhumeh samuddharta tasmai vai te namo namah || 32|| yo vai rudrah sa bhagavan yastu nityo
    bhuvah prabhuh | bhuvo yastu samuddharta tasmai vai te namo namah || 33|| yo vai rudrah sa bhagavan
    nityo yashca suvah parah | yashcaiva svapatih satyam tasmai vai te namo namah || 34|| yo vai rudrah
    sa bhagavan nityo yashca mahah parah | mahato'pi mahanyastu tasmai vai te namo namah || 35|| yo vai
    rudrah sa bhagavan nityo yashca tapah parah | taporupo'pi yo devastasmai vai te namo namah || 36||
    yo vai rudrah sa bhagavan nityo yashca janah parah | yashca nityam jagadvayapi tasmai vai te namo
    namah || 37|| yo vai rudrah sa bhagavan yashca satyam sadatmakam | satyasvarupah satyam yastasmai
    vai te namo namah || 38|| yo vai rudrah sa bhagavanyashcapastanmayah parah | yashcapam janako bhargastasmai
    vai te namo namah || 39|| yo vai rudrah sa bhagavan yashca tejah prakashakam | bhasa yasya vibhatyarkastasmai
    vai te namo namah || 40|| yo vai rudrah sa bhagavan yashcavayuh sushitalah | yashca vayoshca janakastasmai
    vai te namo namah || 41|| yo vai rudrah sa bhagavan yashvakashah sadatmakah | yashcakashadijanakastasmai
    vai te namo namah || 42|| yo vai rudrah sa bhagavan yashca pranastadatmakah | yasya pranamayo nityastasmai
    vai te namo namah || 43|| yo vai rudrah sa bhagavan yashcakalah kalatmakah | yashcakalakaladharastasmai
    vai te namo namah || 44|| yo vai rudrah sa bhagavan yashca sakshadyamah svayam | yamasyapi niyanta
    yastasmai vai te namo namah || 45|| yo vai rudrah sa bhagavan yashca mrityurvishadadah | yashca mrityunjayah
    sakshattasmai vai te namo namah || 46|| yo vai rudrah sa bhagavan yashcamritamanamayam | amritatma'mritam
    yashca tasmai vai te namo namah || 47|| yo vai rudrah sa bhagavan yashca bhutaganeshvarah | pramathadhipatiryashca
    tasmai vai te namo namah || 48|| yo vai rudrah sa bhagavan yashca sarvacidatmakam | yah sarvaprabhurishanastasmai
    vai te namo namah || 49|| yo vai rudrah sa bhagavan yashca satyam ritam param | yashca satyabhidham
    brahma tasmai vai te namo namah || 50|| yo vai rudrah sa bhagavan yah param brahma nishkalam | yashca
    nityam cidakarastasmai vai te namo namah || 51|| tvameva vishvarupo'si brahmaikastvam maheshvara |
    ekatvadiparardhantastvamevasi sadashiva || 52|| adhashcordhvam ca madhyam ca tvamevasi maheshvara
    | shantih pushtishca tushtishca tvam hutam cahutam shiva || 53|| tvam hi vishvamavishvam ca dattam
    cadattameva ca | tvam kritam cakritam shambho tvam param caparam prabho || 54|| paraparanam parama
    pavitro'si maheshvara | paratparataro yashca tatparatparato'si ca || 55|| sarvasrashta ca bhagavan
    tvam hi sarvasya rakshakah | tvameva bhagavan shambho sarvasamharakarakah || 56|| hantasi narasihmasya
    tvamevasi kritagasah | harerapi niyanta tvam tathaiva brahmano'pi ca || 57|| param brahma tvamevasi
    nirvikara niranjana | nishkalo nishkriyah shantastvamevasi shiva prabho || 58|| tvatta eva samutpanna
    vishnubrahmadayah surah | tvayaiva palita lokastvayaivaite vinashitah || 59|| tvaya vyaptamidam sarvam
    brahmandam sa caracaram | tvameva vyapakah shambho sarvasya jagatah prabhuh || 60|| tvameva svargaphaladastvamevasyapavargadah
    | tvameva sarvalokanam pujyo mukyarthinam prabho || 61|| gatistvameva lokanamagatinam gatih para |
    tvadanya na gatih shambho saccidanandavigraha || 62|| vedairapi na te rupam jnatamasti maheshvara
    | kimanyairmadrishairisha pramanavishaya prabho || 63|| || iti shivarahasyantargate rishigautamaproktah
    rudrastavah sampurnah ||
  devanagari: गौतमः यो वै रुद्रः स भगवान्ब्रह्मा साक्षान्महेश्वरः । सर्वतन्त्रस्वतन्त्रश्च तस्मै वै ते
    नमो नमः ॥ २२॥ यो वै रुद्रः स भगवान्विष्णुब्रह्मादिवन्दितः । यश्च ब्रह्मा महारुद्रस्तस्मै वै ते नमो
    नमः ॥ २३॥ यो वै रुद्रः स भगवान्पार्वतीरमणः प्रभुः । यश्च विष्णुर्विरूपाक्षस्तस्मै वै ते नमो नमः ॥
    २४॥ यो वै रुद्रः स भगवान् या चोमा परमेश्वरी । उमाकान्तो निर्गुणोऽपि तस्मै वै ते नमो नमः ॥ २५॥ यो वै
    रुद्रः स भगवान् यश्च साक्षाद्विनायकः । यश्च नित्यो व्यापकश्च तस्मै वै ते नमो नमः ॥ २६॥ यो वै रुद्रः
    स भगवान् यश्च स्कन्दः सुरार्चितः । यश्च साक्षाज्जगत्कर्ता तस्मै वै ते नमो नमः ॥ २७॥ यो वै रुद्रः स
    भगवान् यश्चेन्द्रः स्वर्गपालकः । यश्च स्वर्गप्रदो नित्यं तस्मै वै ते नमो नमः ॥ २८॥ यो वै रुद्रः स
    भगवान् यश्चाग्निस्तेजसां निधिः । यश्च तेजोमयः साक्षत् तस्मै वै ते नमो नमः ॥ २९॥ यो वै रुद्रः स भगवान्
    यश्च सूर्यो मरीचिमान् । यश्च ग्रहगणाधीशस्तस्मै वै ते नमो नमः ॥ ३०॥ यो वै रुद्रः स भगवान् यश्च चन्द्रस्तदात्मकः
    । चन्द्रकोटिसमप्रख्यस्तस्मै वै ते नमो नमः ॥ ३१॥ यो वै रुद्रः स भगवान् भूर्भुवःस्वःप्रभुश्च यः । यश्च
    भूमेः समुद्धर्ता तस्मै वै ते नमो नमः ॥ ३२॥ यो वै रुद्रः स भगवान् यस्तु नित्यो भुवः प्रभुः । भुवो यस्तु
    समुद्धर्ता तस्मै वै ते नमो नमः ॥ ३३॥ यो वै रुद्रः स भगवान् नित्यो यश्च सुवः परः । यश्चैव स्वपतिः सत्यं
    तस्मै वै ते नमो नमः ॥ ३४॥ यो वै रुद्रः स भगवान् नित्यो यश्च महः परः । महतोऽपि महान्यस्तु तस्मै वै
    ते नमो नमः ॥ ३५॥ यो वै रुद्रः स भगवान् नित्यो यश्च तपः परः । तपोरूपोऽपि यो देवस्तस्मै वै ते नमो नमः
    ॥ ३६॥ यो वै रुद्रः स भगवान् नित्यो यश्च जनः परः । यश्च नित्यं जगद्वयापी तस्मै वै ते नमो नमः ॥ ३७॥
    यो वै रुद्रः स भगवान् यश्च सत्यं सदात्मकम् । सत्यस्वरूपः सत्यं यस्तस्मै वै ते नमो नमः ॥ ३८॥ यो वै
    रुद्रः स भगवान्यश्चापस्तन्मयः परः । यश्चापां जनको भर्गस्तस्मै वै ते नमो नमः ॥ ३९॥ यो वै रुद्रः स भगवान्
    यश्च तेजः प्रकाशकम् । भासा यस्य विभात्यर्कस्तस्मै वै ते नमो नमः ॥ ४०॥ यो वै रुद्रः स भगवान् यश्चवायुः
    सुशीतलः । यश्च वायोश्च जनकस्तस्मै वै ते नमो नमः ॥ ४१॥ यो वै रुद्रः स भगवान् यश्वाकाशः सदात्मकः । यश्चाकाशादिजनकस्तस्मै
    वै ते नमो नमः ॥ ४२॥ यो वै रुद्रः स भगवान् यश्च प्राणस्तदात्मकः । यस्य प्राणमयो नित्यस्तस्मै वै ते
    नमो नमः ॥ ४३॥ यो वै रुद्रः स भगवान् यश्चकालः कलात्मकः । यश्चकालकलाधारस्तस्मै वै ते नमो नमः ॥ ४४॥ यो
    वै रुद्रः स भगवान् यश्च साक्षाद्यमः स्वयम् । यमस्यापि नियन्ता यस्तस्मै वै ते नमो नमः ॥ ४५॥ यो वै रुद्रः
    स भगवान् यश्च मृत्युर्विषाददः । यश्च मृत्युञ्जयः साक्षात्तस्मै वै ते नमो नमः ॥ ४६॥ यो वै रुद्रः स
    भगवान् यश्चामृतमनामयम् । अमृतात्माऽमृतं यश्च तस्मै वै ते नमो नमः ॥ ४७॥ यो वै रुद्रः स भगवान् यश्च
    भूतगणेश्वरः । प्रमथाधिपतिर्यश्च तस्मै वै ते नमो नमः ॥ ४८॥ यो वै रुद्रः स भगवान् यश्च सर्वचिदात्मकम्
    । यः सर्वप्रभुरीशानस्तस्मै वै ते नमो नमः ॥ ४९॥ यो वै रुद्रः स भगवान् यश्च सत्यं ऋतं परम् । यश्च सत्याभिधं
    ब्रह्म तस्मै वै ते नमो नमः ॥ ५०॥ यो वै रुद्रः स भगवान् यः परं ब्रह्म निष्कलम् । यश्च नित्यं चिदाकारस्तस्मै
    वै ते नमो नमः ॥ ५१॥ त्वमेव विश्वरूपोऽसि ब्रह्मैकस्त्वं महेश्वर । एकत्वादिपरार्धान्तस्त्वमेवासि सदाशिव
    ॥ ५२॥ अधश्चोर्ध्वं च मध्यं च त्वमेवासि महेश्वर । शान्तिः पुष्टिश्च तुष्टिश्च त्वं हुतं चाहुतं शिव
    ॥ ५३॥ त्वं हि विश्वमविश्वं च दत्तं चादत्तमेव च । त्वं कृतं चाकृतं शम्भो त्वं परं चापरं प्रभो ॥ ५४॥
    परापराणां परम पवित्रोऽसि महेश्वर । परात्परतरो यश्च तत्परात्परतोऽसि च ॥ ५५॥ सर्वस्रष्टा च भगवान् त्वं
    हि सर्वस्य रक्षकः । त्वमेव भगवन् शम्भो सर्वसंहारकारकः ॥ ५६॥ हन्तासि नरसिह्मस्य त्वमेवासि कृतागसः ।
    हरेरपि नियन्ता त्वं तथैव ब्रह्मणोऽपि च ॥ ५७॥ परं ब्रह्म त्वमेवासि निर्विकार निरञ्जन । निष्कलो निष्क्रियः
    शान्तस्त्वमेवासि शिव प्रभो ॥ ५८॥ त्वत्त एव समुत्पन्ना विष्णुब्रह्मादयः सुराः । त्वयैव पालिता लोकास्त्वयैवैते
    विनाशिताः ॥ ५९॥ त्वया व्याप्तमिदं सर्वं ब्रह्माण्डं स चराचरम् । त्वमेव व्यापकः शम्भो सर्वस्य जगतः
    प्रभुः ॥ ६०॥ त्वमेव स्वर्गफलदस्त्वमेवास्यपवर्गदः । त्वमेव सर्वलोकानां पूज्यो मुक्यर्थिनां प्रभो ॥
    ६१॥ गतिस्त्वमेव लोकानामगतीनां गतिः परा । त्वदन्या न गतिः शम्भो सच्चिदानन्दविग्रह ॥ ६२॥ वेदैरपि न ते
    रूपं ज्ञातमस्ति महेश्वर । किमन्यैर्मादृशैरीश प्रमाणविषय प्रभो ॥ ६३॥ ॥ इति शिवरहस्यान्तर्गते ऋषिगौतमप्रोक्तः
    रुद्रस्तवः सम्पूर्णः ॥
