id: vashyavarahistotram
category: kavacha
name:
  english: vashyavarahistotram
  devanagari: वश्यवाराहीस्तोत्रम्
content:
  english: ashvarudhe raktavarne smitasaumyamukhambuje | rajyastri sarvajantunam vashikarananayike ||
    1|| vashikarana karyartha pura devena nirmitam | tasmad vashyavarahi sarvanme vashamanaya || 2|| yatha
    raja mahajnanam vastram dhanyam mahavasu | mahyam dadati varahi yathatvam vashamanaya || 3|| antarbahishca
    manasi vyapareshu sabhashu ca | yatha mamevam smarati tatha vashyam vasham kuru || 4|| camaram dolikam
    chatram raja cihnani yacchati | abhishtham sampradorajyam yatha devi vasham kuru || 5|| manmathasmaranadrama
    ratiryatu mayasaha | stri ratneshu mahatprema tatha janayakamade || 6|| mriga pakshyadayah sarve mam
    drishtva premamohitah | anugacchati mameva tvatpasadaddayam kuru || 7|| vashikarana karyartha yatra
    yatra prayunjati | sammohanartha varddhitvattatkarya tatra karshaya || 8|| vashamastiti caivatra vashya
    karyeshu drishyate | tatha mam kuru varahi vashya karyapradarshaya || 9|| vashikarana banastram bhaktyapaddhinivaranam
    | tasmat vashyavarahi jagatsarva vasham kuru || 10|| vashyastotramidam devya trisandhyam yah pathennara
    | abhishtam prapnuyad bhakto ramam rajyam yathapivah || 11|| iti atharvashikhayam vashyavarahi stotram
    sampurnam |
  devanagari: अश्वारूढे रक्तवर्णे स्मितसौम्यमुखाम्बुजे । राज्यस्त्री सर्वजन्तूनां वशीकरणनायिके ॥ १॥ वशीकरण
    कार्यार्थ पुरा देवेन निर्मितम् । तस्माद् वश्यवाराही सर्वान्मे वशमानय ॥ २॥ यथा राजा महाज्ञानं वस्त्रं
    धान्यं महावसु । मह्यं ददाति वाराहि यथात्वं वशमानय ॥ ३॥ अन्तर्बहिश्च मनसि व्यापारेषु सभाषु च । यथा
    मामेवं स्मरति तथा वश्यं वशं कुरु ॥ ४॥ चामरं दोलिकां छत्रं राज चिह्नानि यच्छति । अभीष्ठं संप्रदोराज्यं
    यथा देवि वशं कुरु ॥ ५॥ मन्मथस्मरणाद्रामा रतिर्यातु मयासह । स्त्री रत्नेषु महत्प्रेम तथा जनयकामदे ॥
    ६॥ मृग पक्ष्यादयाः सर्वे मां दृष्ट्वा प्रेममोहिताः । अनुगच्छति मामेव त्वत्पसादाद्दयां कुरु ॥ ७॥ वशीकरण
    कार्यार्थ यत्र यत्र प्रयुञ्जति । सम्मोहनार्थ वर्द्धित्वात्तत्कार्य तत्र कर्षय ॥ ८॥ वशमस्तीति चैवात्र
    वश्य कार्येषु दृश्यते । तथा मां कुरु वाराही वश्य कार्यप्रदर्शय ॥ ९॥ वशीकरण बाणास्त्रं भक्त्यापद्धिनिवारणम्
    । तस्मात् वश्यवाराही जगत्सर्व वशं कुरु ॥ १०॥ वश्यस्तोत्रमिदं देव्या त्रिसन्ध्यं यः पठेन्नर । अभीष्टं
    प्राप्नुयाद् भक्तो रमां राज्यं यथापिवः ॥ ११॥ इति अथर्वशिखायां वश्यवाराही स्तोत्रं सम्पूर्णम् ।
