id: narayanastotram-2
category: shataka
name:
  english: narayanastotram
  devanagari: नारायणस्तोत्रम्
content:
  english: pajham sadyahprasutarbhakabhrishashishutopakramam ya gata ca || 16|| vaksho'dhikshobhapaksham
    nagaripunagarinagarinam gariyah saundaryodgarahridyam svahridi bhagavato bhavayedbhaktiyuktah | vidyullolapi
    yasmin salilaghanaghane shyamale premavashya pashyaptasthemasimakashadrishadi lasaddhemalekheva lakshmih
    || 17|| shrivatsankasya vakshah smaratu cirataram bhrataravabdhiputrau bibhradyatnena ratne varamaniramanivargayugmapradhane
    | lakshmisambhogalakshmastanayugalalagatkunkumam kaustubho'sya lajjalopaya yasmimstirayati tarunarkamshusankashabhasa
    || 18|| dhautam lavanyaniraih shishiramapi ramashvasasamjnaih samiraih sandribhutendranilaih sapatimaghatitam
    kuttimam snigdhamugdham | dhyatavyam madhavorahsuratarusumanahsraksphuratpushpatalpe yasminnanandanidram
    bhajati munimano vismritasheshatapam || 19|| durdharsham vairivargaurvitatamatidridham pundarikakshavaksho
    viksheta dhyanadrishtyamaranagaramahadvararakshakavatam | citram yatparshvayosta dhanamapi ghatita
    argala dorganakhya garvenanargalanam samiti ditibhuvam svargamargam dishanti || 20|| udyatpradyotanabho
    manirurasi lasan padmanabhasya bhavyo yaddiptivyaptilupta dyutiramanishiroratnakhadyotarasheh | kim
    vanyaddainyamagadahaha
  devanagari: पझं सद्यःप्रसूतार्भकभृशशिशुतोपक्रमं या गता च ॥ १६॥ वक्षोऽधिक्षोभपक्षं नगरिपुनगरीनागरीणां
    गरीयः सौन्दर्योद्गारहृद्यं स्वहृदि भगवतो भावयेद्भक्तियुक्तः । विद्युल्लोलापि यस्मिन् सलिलघनघने श्यामले
    प्रेमवश्या पश्याप्तस्थेमसीमाकषदृषदि लसद्धेमलेखेव लक्ष्मीः ॥ १७॥ श्रीवत्साङ्कस्य वक्षः स्मरतु चिरतरं
    भ्रातरावब्धिपुत्रौ बिभ्रद्यत्नेन रत्ने वरमणिरमणीवर्गयुग्मप्रधाने । लक्ष्मीसम्भोगलक्ष्मस्तनयुगललगत्कुङ्कुमं
    कौस्तुभोऽस्या लज्जालोपाय यस्मिंस्तिरयति तरुणार्कांशुसङ्काशभासा ॥ १८॥ धौतं लावण्यनीरैः शिशिरमपि रमाश्वाससंज्ञैः
    समीरैः सान्द्रीभूतेन्द्रनीलैः सपटिमघटितं कुट्टिमं स्निग्धमुग्धम् । ध्यातव्यं माधवोरःसुरतरुसुमनःस्रक्स्फुरत्पुष्पतल्पे
    यस्मिन्नानन्दनिद्रां भजति मुनिमनो विस्मृताशेषतापम् ॥ १९॥ दुर्धर्षं वैरिवर्गौर्विततमतिदृढं पुण्डरीकाक्षवक्षो
    वीक्षेत ध्यानदृष्ट्यामरनगरमहाद्वाररक्षाकवाटम् । चित्रं यत्पार्श्वयोस्ता धनमपि घटिता अर्गला दोर्गणाख्या
    गर्वेणानर्गलानां समिति दितिभुवां स्वर्गमार्गं दिशन्ति ॥ २०॥ उद्यत्प्रद्योतनाभो मणिरुरसि लसन् पद्मनाभस्य
    भाव्यो यद्दीप्तिव्याप्तिलुप्ता द्युतिरमणिशिरोरत्नखद्योतराशेः । किं वान्यद्दैन्यमागादहह
