id: jyotirling
category: stotram
name:
  english: jyotirling
  devanagari: ज्योतिर्लिन्ग्
content:
  english: dvadashajyotirlingani saurashtre somanatham ca shrishaile mallikarjunam | ujjayinyam mahakalamonkaramamaleshvaram
    || paralyam vaidyanatham ca dakinyam bhimashankaram | setubandhe tu ramesham nagesham darukavane ||
    varanasyam tu vishvesham tryambakam gautamitate | himalaye tu kedaram ghushmesham ca shivalaye ||
  devanagari: द्वादशज्योतिर्लिङ्गानि सौराष्ट्रे सोमनाथं च श्रीशैले मल्लिकार्जुनम् । उज्जयिन्यां महाकालमोङ्कारममलेश्वरम्
    ॥ परल्यां वैद्यनाथं च डाकिन्यां भीमशङ्करम् । सेतुबन्धे तु रामेशं नागेशं दारुकावने ॥ वाराणस्यां तु
    विश्वेशं त्र्यम्बकं गौतमीतटे । हिमालये तु केदारं घुश्मेशं च शिवालये ॥
meaning: {}
