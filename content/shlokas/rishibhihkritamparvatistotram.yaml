id: rishibhihkritamparvatistotram
category: stotram
name:
  english: rishibhihkritamparvatistotram
  devanagari: ऋषिभिःकृतंपार्वतीस्तोत्रम्
content:
  english: rishibhih kritam parvatistotram 7 rishaya ucuh | jaya devi mahadevi mahamangaladayini | prasida
    sidatam nastvam paritranaya parvati || 23|| shulakhatvangamusalavinishpishtarisainike | prasida sidatam
    nastvam paritranaya parvati || 24|| tvayamba sakala daityah bhakshita ranasankate | prasidata sidatam
    nastvam paritranaya parvati || 25|| tvatkaragralasatshuladalita danavah pura | rakshanayaiva lokanam
    sa kripa kva gatambike || 26|| simhanadavinadena mohita daityadanavah | rakshanayaiva lokanam sa kripa
    kva gatambike || 27|| damshtrakaralavadanam drishtva te murcchitah pare | rakshanayaiva lokanam sa
    kripa kva gatambike || 28|| asman pahi bhayadbhitananathan bhaktavatsale | avilambam dayapatram vidhehi
    bhuvanatrayam || 29|| lilayaiva vihantri tvam daityanam kirtibhanjani | avilambam dayapatram vidhehi
    bhuvanatrayam || 30|| tvadastravitrastabalam daityanam kshanabhanguram | tanudasyasi durge tvam bhaktanam
    hitakamyaya || 31|| tvaya jagadidam vishvam samaye palyate bhayat | tatha nah pahi kalyani prasuh
    putraniva svayam || 32|| tubhyam namah sarvajagatsavitri vitrasya papanamararivargan | aptam janam
    pahi bhavani bhadre rudrani bhadre karune purani || 33|| iti tamraparnimahatmye pancamadhyayantargatam
    rishibhih kritam parvatistotram sampurnam | tamraparnimahatmya | adhyaya 1
  devanagari: ऋषिभिः कृतं पार्वतीस्तोत्रम् ७ ऋषय ऊचुः । जय देवि महादेवि महामङ्गलदायिनि । प्रसीद सीदतां
    नस्त्वं परित्राणाय पार्वति ॥ २३॥ शूलखट्वाङ्गमुसलविनिष्पिष्टारिसैनिके । प्रसीद सीदतां नस्त्वं परित्राणाय
    पार्वति ॥ २४॥ त्वयाम्ब सकला दैत्याः भक्षिता रणसङ्कटे । प्रसीदत सीदतां नस्त्वं परित्राणाय पार्वति ॥
    २५॥ त्वत्कराग्रलसत्शूलदलिता दानवाः पुरा । रक्षणायैव लोकानं सा कृपा क्व गताम्बिके ॥ २६॥ सिंहनादविनादेन
    मोहिता दैत्यदानवाः । रक्षणायैव लोकानां सा कृपा क्व गताम्बिके ॥ २७॥ दंष्ट्राकरालवदनं दृष्ट्वा ते मूर्च्छिताः
    परे । रक्षणायैव लोकानां सा कृपा क्व गताम्बिके ॥ २८॥ अस्मान् पाहि भयाद्भीताननाथान् भक्तवत्सले । अविलम्बं
    दयापात्रं विधेहि भुवनत्रयम् ॥ २९॥ लीलयैव विहन्त्रि त्वं दैत्यानां कीर्तिभञ्जनी । अविलम्बं दयापात्रं
    विधेहि भुवनत्रयम् ॥ ३०॥ त्वदस्त्रवित्रस्तबलं दैत्यानां क्षणभङ्गुरम् । तानुदस्यासि दुर्गे त्वं भक्तानां
    हितकाम्यया ॥ ३१॥ त्वया जगदिदं विश्वं समये पाल्यते भयात् । तथा नः पाहि कल्याणि प्रसूः पुत्रानिव स्वयम्
    ॥ ३२॥ तुभ्यं नमः सर्वजगत्सवित्री वित्रास्य पापानमरारिवर्गान् । आप्तं जनं पाहि भवानि भद्रे रुद्राणि
    भद्रे करुणे पुराणि ॥ ३३॥ इति ताम्रपर्णीमाहात्म्ये पञ्चमाध्यायान्तर्गतं ऋषिभिः कृतं पार्वतीस्तोत्रं
    सम्पूर्णम् । ताम्रपर्णीमाहात्म्य । अध्याय १
