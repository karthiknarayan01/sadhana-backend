id: bhishmakritam2shrikrishnastotram
category: stotram
name:
  english: bhishmakritam2shrikrishnastotram
  devanagari: भीष्मकृतं२श्रीकृष्णस्तोत्रम्
content:
  english: bhishmakritam 2 shrikrishnastotram kritanjalih shucirbhutva vagvidam pravarah prabhum | bhishmah
    paramadharmatma vasudevamathastuvat || 9|| ariradhayishuh krishnam vacam jigamishami yam | taya vyasasamasinya
    priyatam purushottamah || 10|| shucih shucishadam hamsam tatparah parameshthinam | yuktva sarvatmana''tmanam
    tam prapadye prajapatim || 11|| yasminvishvani bhutani tishthanti ca vishanti ca | gunabhutani bhuteshe
    sutre manigana iva || 12|| yasminnitye tate tantau dridhe sragiva tishthati | sadasadgrathitam vishvam
    vishvange vishvakarmani || 13|| harim sahasrashirasam sahasracaranekshanam | prahurnarayanam devam
    yam vishvasya parayanam || 14|| aniyasamaniyamsam sthavishtham ca sthaviyasam | gariyasam garishtham
    ca shreshtham ca shreyasamapi || 15|| yam vakeshvanuvakeshu nishatsupanishatsu ca | grinanti satyakarmanam
    satyam satyeshu samasu || 16|| caturbhishcaturatmanam sattvastham satvatam patim | yam divyairdevamarcanti
    guhyaih paramanamabhih || 17|| yam devam devaki devi vasudevadajijanat | bhaumasya brahmano guptyai
    diptamagnimivaranih || 18|| yamananyo vyapetashiratmanam vitakalmasham | ishtvanantyaya govindam pashyatyatmanyavasthitam
    || 19|| purane purushah prokto brahma prokto yugadishu | kshaye sankarshanah proktastamupasyamupasmahe
    || 20|| ativayvindrakarmanamatisuryagnitejasam | atibuddhindriyatmanam tam prapadye prajapatim ||
    21|| yam vai vishvasya kartaram jagatastasthusham patim | vadanti jagato'dhyakshamaksharam paramam
    padam || 22|| hiranyavarnam yam garbhamaditirdaityanashanam | ekam dvadashadha jajne tasmai suryatmane
    namah || 23|| shukle devanpitrinkrishne tarpayatyamritena yah | yashca raja dvijatinam tasmai somatmane
    namah || 24|| mahatastamasah pare purusham jvalanadyutim | yam jnatva mrityumatyeti tasmai jneyatmane
    namah || 25|| yam brihantam brihatyukthe yamagnau yam mahadhvare | yam viprasangha gayanti tasmai
    vedatmane namah || 26|| rigyajuhsamadhamanam dashardhahavirakritim | yam saptatantum tanvanti tasmai
    yajnatmane namah || 27|| yah suparno yajurnama chandogatrastrivricchirah | rathantarabrihatyakshastasmai
    stotratmane namah || 28|| yah sahasrasave satre jajne vishvasrijamrishih | hiranyavarnah shakunistasmai
    hamsatmane namah || 29|| padangam sandhiparvanam svaravyanjanalakshanam | yamahuraksharam nityam tasmai
    vagatmane namah || 30|| yashcinoti satam setumritenamritayonina | dharmarthavyavaharangaistasmai satyatmane
    namah || 31|| yam prithagdharmacaranah prithagdharmaphalaishinah | prithagdharmaih samarcanti tasmai
    dharmatmane namah || 32|| yam tam vyaktasthamavyaktam vicinvanti maharshayah | kshetre kshetrajnamasinam
    tasmai kshetratmane namah || 33|| yam drigatmanamatmastham vritam shodashabhirgunaih | prahuh saptadasham
    sankhyastasmai sankhyatmane namah || 34|| yam vinidra jitashvasah sattvasthah samyatendriyah | jyotih
    pashyanti yunjanastasmai yogatmane namah || 35|| apunyapunyoparame yam punarbhavanirbhayah | shantah
    samnyasino yanti tasmai mokshatmane namah || 36|| yo'sau yugasahasrante pradiptarcirvibhavasuh | sambhakshayati
    bhutani tasmai ghoratmane namah || 37|| sambhakshya sarvabhutani kritva caikarnavam jagat | balah
    svapiti yashcaikastasmai mayatmane namah || 38|| sahasrashirase tasmai purushayamitatmane | catuhsamudraparyayayoganidratmane
    namah || 39|| ajasya nabhavadhyekam yasminvishvam pratishthitam | pushkaram pushkarakshasya tasmai
    padmatmane namah || 40|| yasya kesheshu jimuta nadyah sarvangasandhishu | kukshau samudrashcatvarastasmai
    toyatmane namah || 41|| yugeshvavartate yom'shairdinartvayanahayanaih | sargapralayayoh karta tasmai
    kalatmane namah || 42|| brahma vaktram bhujau kshatram kritsnamurudaram vishah | padau yasyashritah
    shudrastasmai varnatmane namah || 43|| yasyagnirasyam dyaurmurdha kham nabhishcaranau kshitih | suryashcakshurdishah
    shrotre tasmai lokatmane namah || 44|| vishaye vartamananam yam tam vaisheshikairgunaih | prahurvishayagoptaram
    tasmai goptratmane namah || 45|| annapanendhanamayo rasapranavivardhanah | yo dharayati bhutani tasmai
    pranatmane namah || 46|| parah kalatparo yajnatparah sadasatoshca yah | anadiradirvishvasya tasmai
    vishvatmane namah || 47|| yo mohayati bhutani sneharaganubandhanaih | sargasya rakshanarthaya tasmai
    mohatmane namah || 48|| atmajnanamidam jnanam jnatva pancasvavasthitam | yam jnanino'dhigacchanti
    tasmai jnanatmane namah || 49|| aprameyashariraya sarvato'nantacakshushe | aparaparimeyaya tasmai
    cintyatmane namah || 50|| jatine dandine nityam lambodarasharirine | kamandalunishangaya tasmai brahmatmane
    namah || 51|| shuline tridasheshaya tryambakaya mahatmane | bhasmadigdhordhvalingaya tasmai rudratmane
    namah || 52|| pancabhutatmabhutaya bhutadinidhanatmane | akrodhadrohamohaya tasmai shantatmane namah
    || 53|| yasminsarvam yatah sarvam yah sarvam sarvatashca yah | yashca sarvamayo nityam tasmai sarvatmane
    namah || 54|| vishvakarmannamaste'stu vishvatmanvishvasambhava | apavargo'si bhutanam pancanam paratah
    sthitah || 55|| namaste trishu lokeshu namaste paratastrishu | namaste dikshu sarvasu tvam hi sarvaparayanam
    || 56|| namaste bhagavanvishno lokanam prabhavapyaya | tvam hi karta hrishikesha samharta caparajitah
    || 57|| tena pashyami te divyanbhavanhi trishu vartmasu | tacca pashyami tattvena yatte rupam sanatanam
    || 58|| divam te shirasa vyaptam padbhyam devi vasundhara | vikramena trayo lokah purusho'si sanatanah
    || 59|| atasipushpasankasham pitavasasamacyutam | ye namasyanti govindam na tesham vidyate bhayam
    || 60|| yatha vishnumayam satyam yatha vishnumayam havih | yatha vishnumayam sarvam papma me nashyatam
    tatha || 61|| tvam prapannaya bhaktaya gatimishtam jigishave | yacchreyah pundarikaksha taddhyayasva
    surottama || 62|| iti vidyatapoyonirayonirvishnuriditah | vagyajnenarcito devah priyatam me janardanah
    || 63|| iti mahabharate shantiparvani 47 adhyayantargatam bhishmakritam shrikrishnastotram sampurnam
    | mahabharata | shantiparva | adhyaya 47
  devanagari: भीष्मकृतं २ श्रीकृष्णस्तोत्रम् कृताञ्जलिः शुचिर्भूत्वा वाग्विदां प्रवरः प्रभुम् । भीष्मः
    परमधर्मात्मा वासुदेवमथास्तुवत् ॥ ९॥ आरिराधयिषुः कृष्णं वाचं जिगमिषामि याम् । तया व्याससमासिन्या प्रीयतां
    पुरुषोत्तमः ॥ १०॥ शुचिः शुचिषदं हंसं तत्परः परमेष्ठिनम् । युक्त्वा सर्वात्मनाऽऽत्मानं तं प्रपद्ये
    प्रजापतिम् ॥ ११॥ यस्मिन्विश्वानि भूतानि तिष्ठन्ति च विशन्ति च । गुणभूतानि भूतेशे सूत्रे मणिगणा इव
    ॥ १२॥ यस्मिन्नित्ये तते तन्तौ दृढे स्रगिव तिष्ठति । सदसद्ग्रथितं विश्वं विश्वाङ्गे विश्वकर्मणि ॥ १३॥
    हरिं सहस्रशिरसं सहस्रचरणेक्षणम् । प्राहुर्नारायणं देवं यं विश्वस्य परायणम् ॥ १४॥ अणीयसामणीयांसं स्थविष्ठं
    च स्थवीयसाम् । गरीयसां गरिष्ठं च श्रेष्ठं च श्रेयसामपि ॥ १५॥ यं वाकेष्वनुवाकेषु निषत्सूपनिषत्सु च
    । गृणन्ति सत्यकर्माणं सत्यं सत्येषु सामसु ॥ १६॥ चतुर्भिश्चतुरात्मानं सत्त्वस्थं सात्वतां पतिम् । यं
    दिव्यैर्देवमर्चन्ति गुह्यैः परमनामभिः ॥ १७॥ यं देवं देवकी देवी वसुदेवादजीजनत् । भौमस्य ब्रह्मणो गुप्त्यै
    दीप्तमग्निमिवारणिः ॥ १८॥ यमनन्यो व्यपेताशीरात्मानं वीतकल्मषम् । इष्ट्वानन्त्याय गोविन्दं पश्यत्यात्मन्यवस्थितम्
    ॥ १९॥ पुराणे पुरुषः प्रोक्तो ब्रह्मा प्रोक्तो युगादिषु । क्षये सङ्कर्षणः प्रोक्तस्तमुपास्यमुपास्महे
    ॥ २०॥ अतिवाय्विन्द्रकर्माणमतिसूर्याग्नितेजसम् । अतिबुद्धीन्द्रियात्मानं तं प्रपद्ये प्रजापतिम् ॥ २१॥
    यं वै विश्वस्य कर्तारं जगतस्तस्थुषां पतिम् । वदन्ति जगतोऽध्यक्षमक्षरं परमं पदम् ॥ २२॥ हिरण्यवर्णं
    यं गर्भमदितिर्दैत्यनाशनम् । एकं द्वादशधा जज्ञे तस्मै सूर्यात्मने नमः ॥ २३॥ शुक्ले देवान्पितॄन्कृष्णे
    तर्पयत्यमृतेन यः । यश्च राजा द्विजातीनां तस्मै सोमात्मने नमः ॥ २४॥ महतस्तमसः पारे पुरुषं ज्वलनद्युतिम्
    । यं ज्ञात्वा मृत्युमत्येति तस्मै ज्ञेयात्मने नमः ॥ २५॥ यं बृहन्तं बृहत्युक्थे यमग्नौ यं महाध्वरे
    । यं विप्रसङ्घा गायन्ति तस्मै वेदात्मने नमः ॥ २६॥ ऋग्यजुःसामधामानं दशार्धहविराकृतिम् । यं सप्ततन्तुं
    तन्वन्ति तस्मै यज्ञात्मने नमः ॥ २७॥ यः सुपर्णो यजुर्नाम छन्दोगात्रस्त्रिवृच्छिराः । रथन्तरबृहत्यक्षस्तस्मै
    स्तोत्रात्मने नमः ॥ २८॥ यः सहस्रसवे सत्रे जज्ञे विश्वसृजामृषिः । हिरण्यवर्णः शकुनिस्तस्मै हंसात्मने
    नमः ॥ २९॥ पदाङ्गं सन्धिपर्वाणं स्वरव्यञ्जनलक्षणम् । यमाहुरक्षरं नित्यं तस्मै वागात्मने नमः ॥ ३०॥ यश्चिनोति
    सतां सेतुमृतेनामृतयोनिना । धर्मार्थव्यवहाराङ्गैस्तस्मै सत्यात्मने नमः ॥ ३१॥ यं पृथग्धर्मचरणाः पृथग्धर्मफलैषिणः
    । पृथग्धर्मैः समर्चन्ति तस्मै धर्मात्मने नमः ॥ ३२॥ यं तं व्यक्तस्थमव्यक्तं विचिन्वन्ति महर्षयः । क्षेत्रे
    क्षेत्रज्ञमासीनं तस्मै क्षेत्रात्मने नमः ॥ ३३॥ यं दृगात्मानमात्मस्थं वृतं षोडशभिर्गुणैः । प्राहुः
    सप्तदशं साङ्ख्यास्तस्मै साङ्ख्यात्मने नमः ॥ ३४॥ यं विनिद्रा जितश्वासाः सत्त्वस्थाः संयतेन्द्रियाः
    । ज्योतिः पश्यन्ति युञ्जानास्तस्मै योगात्मने नमः ॥ ३५॥ अपुण्यपुण्योपरमे यं पुनर्भवनिर्भयाः । शान्ताः
    संन्यासिनो यान्ति तस्मै मोक्षात्मने नमः ॥ ३६॥ योऽसौ युगसहस्रान्ते प्रदीप्तार्चिर्विभावसुः । सम्भक्षयति
    भूतानि तस्मै घोरात्मने नमः ॥ ३७॥ सम्भक्ष्य सर्वभूतानि कृत्वा चैकार्णवं जगत् । बालः स्वपिति यश्चैकस्तस्मै
    मायात्मने नमः ॥ ३८॥ सहस्रशिरसे तस्मै पुरुषायामितात्मने । चतुःसमुद्रपर्याययोगनिद्रात्मने नमः ॥ ३९॥
    अजस्य नाभावध्येकं यस्मिन्विश्वं प्रतिष्ठितम् । पुष्करं पुष्कराक्षस्य तस्मै पद्मात्मने नमः ॥ ४०॥ यस्य
    केशेषु जीमूता नद्यः सर्वाङ्गसन्धिषु । कुक्षौ समुद्राश्चत्वारस्तस्मै तोयात्मने नमः ॥ ४१॥ युगेष्वावर्तते
    योंऽशैर्दिनर्त्वयनहायनैः । सर्गप्रलययोः कर्ता तस्मै कालात्मने नमः ॥ ४२॥ ब्रह्म वक्त्रं भुजौ क्षत्रं
    कृत्स्नमूरूदरं विशः । पादौ यस्याश्रिताः शूद्रास्तस्मै वर्णात्मने नमः ॥ ४३॥ यस्याग्निरास्यं द्यौर्मूर्धा
    खं नाभिश्चरणौ क्षितिः । सूर्यश्चक्षुर्दिशः श्रोत्रे तस्मै लोकात्मने नमः ॥ ४४॥ विषये वर्तमानानां यं
    तं वैशेषिकैर्गुणैः । प्राहुर्विषयगोप्तारं तस्मै गोप्त्रात्मने नमः ॥ ४५॥ अन्नपानेन्धनमयो रसप्राणविवर्धनः
    । यो धारयति भूतानि तस्मै प्राणात्मने नमः ॥ ४६॥ परः कालात्परो यज्ञात्परः सदसतोश्च यः । अनादिरादिर्विश्वस्य
    तस्मै विश्वात्मने नमः ॥ ४७॥ यो मोहयति भूतानि स्नेहरागानुबन्धनैः । सर्गस्य रक्षणार्थाय तस्मै मोहात्मने
    नमः ॥ ४८॥ आत्मज्ञानमिदं ज्ञानं ज्ञात्वा पञ्चस्ववस्थितम् । यं ज्ञानिनोऽधिगच्छन्ति तस्मै ज्ञानात्मने
    नमः ॥ ४९॥ अप्रमेयशरीराय सर्वतोऽनन्तचक्षुषे । अपारपरिमेयाय तस्मै चिन्त्यात्मने नमः ॥ ५०॥ जटिने दण्डिने
    नित्यं लम्बोदरशरीरिणे । कमण्डलुनिषङ्गाय तस्मै ब्रह्मात्मने नमः ॥ ५१॥ शूलिने त्रिदशेशाय त्र्यम्बकाय
    महात्मने । भस्मदिग्धोर्ध्वलिङ्गाय तस्मै रुद्रात्मने नमः ॥ ५२॥ पञ्चभूतात्मभूताय भूतादिनिधनात्मने ।
    अक्रोधद्रोहमोहाय तस्मै शान्तात्मने नमः ॥ ५३॥ यस्मिन्सर्वं यतः सर्वं यः सर्वं सर्वतश्च यः । यश्च सर्वमयो
    नित्यं तस्मै सर्वात्मने नमः ॥ ५४॥ विश्वकर्मन्नमस्तेऽस्तु विश्वात्मन्विश्वसम्भव । अपवर्गोऽसि भूतानां
    पञ्चानां परतः स्थितः ॥ ५५॥ नमस्ते त्रिषु लोकेषु नमस्ते परतस्त्रिषु । नमस्ते दिक्षु सर्वासु त्वं हि
    सर्वपरायणम् ॥ ५६॥ नमस्ते भगवन्विष्णो लोकानां प्रभवाप्यय । त्वं हि कर्ता हृषीकेश संहर्ता चापराजितः
    ॥ ५७॥ तेन पश्यामि ते दिव्यान्भावान्हि त्रिषु वर्त्मसु । तच्च पश्यामि तत्त्वेन यत्ते रूपं सनातनम् ॥
    ५८॥ दिवं ते शिरसा व्याप्तं पद्भ्यां देवी वसुन्धरा । विक्रमेण त्रयो लोकाः पुरुषोऽसि सनातनः ॥ ५९॥ अतसीपुष्पसङ्काशं
    पीतवाससमच्युतम् । ये नमस्यन्ति गोविन्दं न तेषां विद्यते भयम् ॥ ६०॥ यथा विष्णुमयं सत्यं यथा विष्णुमयं
    हविः । यथा विष्णुमयं सर्वं पाप्मा मे नश्यतां तथा ॥ ६१॥ त्वां प्रपन्नाय भक्ताय गतिमिष्टां जिगीषवे ।
    यच्छ्रेयः पुण्डरीकाक्ष तद्ध्यायस्व सुरोत्तम ॥ ६२॥ इति विद्यातपोयोनिरयोनिर्विष्णुरीडितः । वाग्यज्ञेनार्चितो
    देवः प्रीयतां मे जनार्दनः ॥ ६३॥ इति महाभारते शान्तिपर्वणि ४७ अध्यायान्तर्गतं भीष्मकृतं श्रीकृष्णस्तोत्रं
    सम्पूर्णम् । महाभारत । शान्तिपर्व । अध्याय ४७
