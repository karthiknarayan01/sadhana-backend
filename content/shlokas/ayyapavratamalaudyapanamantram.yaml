id: ayyapavratamalaudyapanamantram
category: mantra
name:
  english: ayyapavratamalaudyapanamantram
  devanagari: अय्यपव्रतमालाउद्यापनमन्त्रम्
content:
  english: ayyapavratamala udyapanamantram apurvamacalaroha divyadarshanakarana | shastramudratmaka deva
    dehi me vratavimocanam || iti yyapavratamala udyapanamantram ||
  devanagari: अय्यपव्रतमाला उद्यापनमन्त्रम् अपूर्वमचलारोह दिव्यदर्शनकारण । शास्त्रमुद्रात्मक देव देहि
    मे व्रतविमोचनम् ॥ इति य्यपव्रतमाला उद्यापनमन्त्रम् ॥
meaning: {}
