id: narayaniyam-dashaka-31
category: stotram
name:
  english: Narayaniyam Dashaka 31
content:
  english: pritya daityastava tanumahahprekshanat sarvatha'pi tvamaradhyannajita racayannanjalim sanjagada
    | mattah kim te samabhilashitam viprasuno vada tvam vittam bhaktam bhavanamavanim va'pi sarvam pradasye
    || || tamikshanam baligiramupakarnya karunyapurno' pyasyotsekam shamayitumana daityavamsham prashamsan
    | bhumim padatrayaparimitam prarthayamasitha tvam sarvam dehiti tu nigadite kasya hasyam na va syat
    || || vishvesham mam tripadamiha kim yacase balishastvam sarvam bhumim vrinu kimamunetyalapattvam
    sa dripyan | yasmaddarpat tripadaparipurtyakshamah kshepavadan bandham casavagamadatadarho'pi gadhopashantyai
    || || padatrayya yadi na mudito vishtapairnapi tushye dityukte'smin varada bhavate datukame'tha toyam
    | daityacaryastava khalu pariksharthinah preranattam ma ma deyam harirayamiti vyaktamevababhashe ||
    || yacatyevam yadi sa bhagavan purnakamo'smi so'ham dasyamyeva sthiramiti vadan kavyashapto'pi daityah
    | vindhyavalya nijadayitaya dattapadyaya tubhyam citram citram sakalamapi sa prarpayattoyapurvam ||
    || nissandeham ditikulapatau tvayyashesharpanam tad rishayah samarah pushpavarsham | divyam rupam
    tava ca tadidam pashyatam vishvabhaja muccairuccairavridhadavadhikritya vishvandabhandam || || tvatpadagram
    nijapadagatam pundarikodbhavo'sau kunditoyairasicadapunadyajjalam vishvalokan | harshotkarshat subahu
    nanrite khecarairutsave'smin bherim nighnan bhuvanamacarajjambavan bhaktishali || || tavaddaityastvanumatimrite
    bharturarabdhayuddha devopetairbhavadanucaraissangata bhangamapan | kalatma'yam vasati purato yadvashat
    pragjitah smah kim vo yuddhairiti baligira te'tha patalamapuh || || pashairbaddham patagapatina daityamuccairavadi
    starttiyikam disha mama padam kim na vishveshvaro'si | padam murdhni pranaya bhagavannityakampam vadantam
    prahladstam svayamupagato manayannastavittvam || || darpocchittyai vihitamakhilam daitya siddho'si
    punyai rlokaste'stu tridivavijayi vasavatvam ca pashcat | matsayujyam bhaja ca punarityanvagrihna
    balim tam vipraissantanitamakhavarah pahi vatalayesha ||
  devanagari: प्रीत्या दैत्यस्तव तनुमहःप्रेक्षणात् सर्वथाऽपि त्वामाराध्यन्नजित रचयन्नञ्जलिं सञ्जगाद ।
    मत्तः किं ते समभिलषितं विप्रसूनो वद त्वं वित्तं भक्तं भवनमवनीं वाऽपि सर्वं प्रदास्ये ॥ ॥ तामीक्षणां
    बलिगिरमुपाकर्ण्य कारुण्यपूर्णोऽ प्यस्योत्सेकं शमयितुमना दैत्यवंशं प्रशंसन् । भूमिं पादत्रयपरिमितां
    प्रार्थयामासिथ त्वं सर्वं देहीति तु निगदिते कस्य हास्यं न वा स्यात् ॥ ॥ विश्वेशं मां त्रिपदमिह किं
    याचसे बालिशस्त्वं सर्वां भूमिं वृणु किममुनेत्यालपत्त्वां स दृप्यन् । यस्माद्दर्पात् त्रिपदपरिपूर्त्यक्षमः
    क्षेपवादान् बन्धं चासावगमदतदर्होऽपि गाढोपशान्त्यै ॥ ॥ पादत्रय्या यदि न मुदितो विष्टपैर्नापि तुष्ये
    दित्युक्तेऽस्मिन् वरद भवते दातुकामेऽथ तोयम् । दैत्याचार्यस्तव खलु परीक्षार्थिनः प्रेरणात्तं मा मा
    देयं हरिरयमिति व्यक्तमेवाबभाषे ॥ ॥ याचत्येवं यदि स भगवान् पूर्णकामोऽस्मि सोऽहं दास्याम्येव स्थिरमिति
    वदन् काव्यशप्तोऽपि दैत्यः । विन्ध्यावल्या निजदयितया दत्तपाद्याय तुभ्यं चित्रं चित्रं सकलमपि स प्रार्पयत्तोयपूर्वम्
    ॥ ॥ निस्सन्देहं दितिकुलपतौ त्वय्यशेषार्पणं तद् ऋषयः सामराः पुष्पवर्षम् । दिव्यं रूपं तव च तदिदं पश्यतां
    विश्वभाजा मुच्चैरुच्चैरवृधदवधीकृत्य विश्वाण्डभाण्डम् ॥ ॥ त्वत्पादाग्रं निजपदगतं पुण्डरीकोद्भवोऽसौ
    कुण्डीतोयैरसिचदपुनाद्यज्जलं विश्वलोकान् । हर्षोत्कर्षात् सुबहु ननृते खेचरैरुत्सवेऽस्मिन् भेरीं निघ्नन्
    भुवनमचरज्जाम्बवान् भक्तिशाली ॥ ॥ तावद्दैत्यास्त्वनुमतिमृते भर्तुरारब्धयुद्धा देवोपेतैर्भवदनुचरैस्सङ्गता
    भङ्गमापन् । कालात्माऽयं वसति पुरतो यद्वशात् प्राग्जिताः स्मः किं वो युद्धैरिति बलिगिरा तेऽथ पातालमापुः
    ॥ ॥ पाशैर्बद्धं पतगपतिना दैत्यमुच्चैरवादी स्तार्त्तीयीकं दिश मम पदं किं न विश्वेश्वरोऽसि । पादं मूर्ध्नि
    प्रणय भगवन्नित्यकम्पं वदन्तं प्रह्लाद्स्तं स्वयमुपगतो मानयन्नस्तवीत्त्वाम् ॥ ॥ दर्पोच्छित्त्यै विहितमखिलं
    दैत्य सिद्धोऽसि पुण्यै र्लोकस्तेऽस्तु त्रिदिवविजयी वासवत्वं च पश्चात् । मत्सायुज्यं भज च पुनरित्यन्वगृह्णा
    बलिं तं विप्रैस्सन्तानितमखवरः पाहि वातालयेश ॥
