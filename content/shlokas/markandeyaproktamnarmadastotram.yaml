id: markandeyaproktamnarmadastotram
category: stotram
name:
  english: markandeyaproktamnarmadastotram
  devanagari: मार्कण्डेयप्रोक्तंनर्मदास्तोत्रम्
content:
  english: markandeyaproktam narmadastotram narmada saritam shreshtha rudradehadvinihsrita || 27|| tarayetsarvabhutani
    sthavarani carani ca | sarvadevadhidevena ishvarena mahatmana || 28|| lokanam ca hitarthaya mahapunyavatarita
    | manasam vacikam papam snanannashyati karmajam || 29|| rudradehadvinishkranta tena punyatama hi sa
    | pratarutthaya yo nityam bhumimakramya bhaktitah || 30|| etanmantram japettata snanasya labhate phalam
    | namah punyajale devi namah sagaragamini || 31|| namo'stu papanirmoce namo devi varanane || 32||
    namo'stu te rishivarasanghasevite namo'stu te trinayanadehanihsrite | namo'stu te sukritavatam sada
    vare namo'stu te satatapavitrapavani || 33|| iti shriskandapurane avantyakhande revakhande tricatvarimsha
  devanagari: मार्कण्डेयप्रोक्तं नर्मदास्तोत्रम् नर्मदा सरितां श्रेष्ठा रुद्रदेहाद्विनिःसृता ॥ २७॥ तारयेत्सर्वभूतानि
    स्थावराणि चराणि च । सर्वदेवाधिदेवेन ईश्वरेण महात्मना ॥ २८॥ लोकानां च हितार्थाय महापुण्यावतारिता ।
    मानसं वाचिकं पापं स्नानान्नश्यति कर्मजम् ॥ २९॥ रुद्रदेहाद्विनिष्क्रान्ता तेन पुण्यतमा हि सा । प्रातरुत्थाय
    यो नित्यं भूमिमाक्रम्य भक्तितः ॥ ३०॥ एतन्मन्त्रं जपेत्तात स्नानस्य लभते फलम् । नमः पुण्यजले देवि नमः
    सागरगामिनि ॥ ३१॥ नमोऽस्तु पापनिर्मोचे नमो देवि वरानने ॥ ३२॥ नमोऽस्तु ते ऋषिवरसङ्घसेविते नमोऽस्तु ते
    त्रिनयनदेहनिःसृते । नमोऽस्तु ते सुकृतवतां सदा वरे नमोऽस्तु ते सततपवित्रपावनि ॥ ३३॥ इति श्रीस्कन्दपुराणे
    आवन्त्यखण्डे रेवाखण्डे त्रिचत्वारिंशा
