    नमः । ॐ कामेश्यै नमः । ॐ यज्ञरूपिण्यै नमः । ॐ सङ्गीतरसिकायै नमः । ॐ नादप्रियायै नमः । ॐ नीलोत्पलद्युतये
    नमः । ॐ मतङ्गतनयायै नमः । ॐ लक्ष्म्यै नमः । ॐ व्यापिन्यै नमः । ॐ सर्वरञ्जिन्यै नमः । ॐ दिव्यचन्दनदिग्धाङ्ग्यै
    नमः । ॐ यावकार्द्रपदाम्बुजायै नमः । ॐ कस्तूरीतिलकायै नमः । ॐ सुभ्रुवे नमः । ॐ बिम्बोष्ठ्यै नमः । ॐ
    मदालसायै नमः । ॐ विद्याराज्ञ्यै नमः । ॐ भगवत्यै नमः । ॐ सुधापानानुमोदिन्यै नमः । ॐ शङ्खताटङ्किन्यै
    नमः । ॐ गुह्यायै नमः । ॐ योषित्पुरुषमोहिन्यै नमः । ॐ किङ्करीभूतगीर्वाण्यै नमः । ॐ कौलिन्यै नमः । ॐ
    अक्षररूपिण्यै नमः । ॐ विद्युत्कपोलफलिकायै नमः । ॐ मुक्तारत्नविभूषितायै नमः । ॐ सुनासायै नमः । ॐ तनुमध्यायै
    नमः । ॐ श्रीविद्यायै नमः । ॐ भुवनेश्वर्यै नमः । ॐ पृथुस्तन्यै नमः । ॐ ब्रह्मविद्यायै नमः । ॐ सुधासागरवासिन्यै
    नमः । ॐ गुह्यविद्यायै नमः । ॐ अनवद्याङ्ग्यै नमः । ॐ यन्त्रिण्यै नमः । ॐ रतिलोलुपायै नमः । ॐ त्रैलोक्यसुन्दर्यै
    नमः । ॐ रम्यायै नमः । ॐ स्रग्विण्यै नमः । ॐ कीरधारिण्यै नमः । ॐ आत्मैक्यसुमुखीभूतजगदाह्लादकारिण्यै
    नमः । ॐ कल्पातीतायै नमः । ॐ कुण्डलिन्यै नमः । ॐ कलाधारायै नमः । ॐ मनस्विन्यै नमः । ॐ अचिन्त्यानन्तविभवायै
    नमः । ॐ रत्नसिंहासनेश्वर्यै नमः । ॐ पद्मासनायै नमः । ॐ कामकलायै नमः । ॐ स्वयम्भूकुसुमप्रियायै नमः
    । ॐ कल्याण्यै नमः । ॐ नित्यपुष्पायै नमः । ॐ शाम्भवीवरदायिन्यै नमः । ॐ सर्वविद्याप्रदायै नमः । ॐ वाच्यायै
    नमः । ॐ गुह्योपनिषदुत्तमायै नमः । ॐ नृपवश्यकर्यै नमः । ॐ भोक्त्र्यै नमः । ॐ जगत्प्रत्यक्षसाक्षिण्यै
    नमः । ॐ ब्रह्मविष्ण्वीशजनन्यै नमः । ॐ सर्वसौभाग्यदायिन्यै नमः । ॐ गुह्यातिगुह्यगोप्त्र्यै नमः । ॐ
    नित्यक्लिन्नायै नमः । ॐ अमृतोद्भवायै नमः । ॐ कैवल्यदात्र्यै नमः । ॐ वशिन्यै नमः । ॐ सर्वसम्पत्प्रदायिन्यै
    नमः । इति श्री श्यामलाष्टोत्तरशतनामावलिः ।
