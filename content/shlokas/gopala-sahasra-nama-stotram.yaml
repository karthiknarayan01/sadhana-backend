id: gopala-sahasra-nama-stotram
category: stotram
name:
  english: Gopala Sahasra Nama Stotram
  devanagari: गोपालसहस्रनामस्तोत्रम्
content:
  english: parvatyuvaca- kailasashikhare ramye gauri pricchati shankaram | brahmandakhilanathastvam srishtisamharakarakah
    || 1|| tvameva pujyase lokairbrahmavishnusuradibhih | nityam pathasi devesha kasya stotram maheshvara
    || 2|| ashcaryamidamakhyanam jayate mayi shankara | tatpranesha mahaprajna samshayam chindhi me prabho
    || 3|| shrimahadeva uvaca- dhanyasi kritapunyasi parvati pranavallabhe | rahasyatirahasyam ca yatpricchasi
    varanane || 4|| strisvabhavanmahadevi punastvam paripricchasi | gopaniyam gopaniyam gopaniyam prayatnatah
    || 5|| datte ca siddhihanih syattasmadyatnena gopayet | idam rahasyam paramam purusharthapradayakam
    || 6|| dhanaratnaughamanikyam turangam ca gajadikam | dadati smaranadeva mahamokshapradayakam || 7||
    tatte'ham sampravakshyami shrinushvavahita priye | yo'sau niranjano devah citsvarupi janardanah ||
    8|| samsarasagarottarakaranaya nrinam sada | shrirangadikarupena trailokyam vyapya tishthati || 9||
    tato loka mahamudha vishnubhaktivivarjitah | nishcayam nadhigacchanti punarnarayano harih || 10||
    niranjano nirakaro bhaktanam pritikamadah | vrindavanaviharaya gopalam rupamudvahan || 11|| muralivadanadhari
    radhayai pritimavahan | amshamshebhyah samunmilya purnarupakalayutah || 12|| shrikrishnacandro bhagavan
    nandagopavarodyatah | dharanirupinimatriyashodanandadayakah || 13|| dvabhyam prayacito natho devakyam
    vasudevatah | brahmana'bhyarthito devo devairapi sureshvari || 14|| jato'vanyam mukundo'pi muralovedarecika
    | taya sarddham vacah kritva tato jato mahitale || 15|| samsarasarasarvasvam shyamalam mahadujjvalam
    | etajjyotiraham vedyam cintayami sanatanam || 16|| gauratejo vina yastu shyamatejassamarcayet | japedva
    dhyayate vapi sa bhavet pataki shive || 17|| sa brahmaha surapi ca svarnasteyi ca pancamah | etairdoshairvilipyeta
    tejobhedanmahishvari || 18|| tasmajjyotirabhud dvedha radhamadhavarupakam | tasmadidam mahadevi gopalenaiva
    bhashitam || 19|| durvasaso munermohe kartikyam rasamandale | tatah prishtavati radha sandehabhedamatmanah
    || 20|| niranjanatsamutpannam maya'dhitam jaganmayi | shrikrishnena tatah proktam radhayai naradaya
    ca || 21|| tato naradatassarve virala vaishnava janah | kalau jananti deveshi gopaniyam prayatnatah
    || 22|| shathaya kripanayatha dambhikaya sureshvari | brahmahatyamavapnoti tasmadyatnena gopayet ||
    23|| patha karane ki vidhi om asya shrigopalasahasranamastotramahamantrasya shrinarada rishih | anushtup
    chandah | shrigopalo devata | kamo bijam | maya shaktih | candrah kilakam shrikrishnacandra bhaktirupaphalapraptaye
    shrigopalasahasranamastotrajape viniyogah | ya isataraha karem patha om aim klim bijam | shrim hrim
    shaktih | shrivrindavananivasah kilakam | shriradhapriyaparabrahmeti mantrah | dharmadicaturvidhapurusharthasiddhyarthe
    jape viniyogah || atha karadinyasah om klam angushthabhyam namah | om klim tarjanibhyam namah || om
    klum madhyamabhyam namah || om klaim anamikabhyam namah || om klaum kanishthikabhyam namah || om klah
    karatalakaraprishthabhyam namah || atha hridayadinyasah om klam hridayaya namah | om klim shirase
    svaha || om klum shikhayai vashat || om klaim kavacaya hum || om klaum netratrayaya vaushat || om
    klah astraya phat || atha dhyanam kasturitilakam lalatapatale vakshahsthale kaustubham nasagrevaramauktikam
    karatale venum kare kankanam || sarvange haricandanam sulalitam kanthe ca muktavalim gopastripariveshtito
    vijayate gopalacuramanih || 1|| phullendivarakantiminduvadanam barhavatamsapriyam shrivatsankamudarakaustubhadharam
    pitambaram sundaram || gopinam nayanotpalarcitatanum gogopasanghavritam govindam kalavenuvadanaparam
    divyangabhusham bhaje || 2|| sahasranama stotra arambha- om klim devah kamadevah kamabijashiromanih
    | shrigopalo mahipalo sarvavedantaparagah || 1|| var sarvavedangaparagah krishnah kamalapatrakshah
    pundarikah sanatanah | var dharanipalakodhanyah gopatirbhupatih shasta praharta vishvatomukhah ||
    2|| adikarta mahakarta mahakalah pratapavan | jagajjivo jagaddhata jagadbharta jagadvasuh || 3|| matsyo
    bhimah kuhubharta harta varahamurtiman | narayano hrishikesho govindo garudadhvajah || 4|| gokulendro
    mahicandrah sharvaripriyakarakah | kamalamukhalolakshah pundarikah shubhavahah || 5|| durvasah kapilo
    bhaumah sindhusagarasangamah | govindo gopatirgopah kalindipremapurakah || 6|| gopasvami gokulendro
    govardhanavarapradah | nandadigokulatrata data daridryabhanjanah || 7|| sarvamangaladata ca sarvakamapradayakah
    | adikarta mahibharta sarvasagarasindhujah || 8|| gajagami gajoddhari kami kamakalanidhih | kalankarahitashcandro
    bimbasyo bimbasattamah || 9|| malakarah kripakarah kokilasvarabhushanah | ramo nilambaro devo hali
    durdamamardanah || 10|| sahasrakshapuribhetta mahamarivinashanah | shivah shivatamo bhetta balaratiprapujakah
    || 11|| kumarivaradayi ca varenyo minaketanah | naro narayano dhiro radhapatirudaradhih || 12|| shripatih
    shrinidhih shriman mapatih pratirajaha | vrindapatih kulagrami dhami brahma sanatanah || 13|| revatiramano
    ramah priyashcancalalocanah | ramayanashariro'yam ramo ramah shriyahpatih || 14|| sharvarah sharvari
    sharvah sarvatra shubhadayakah | radharadhayitaradhi radhacittapramodakah || 15|| radharatisukhopetah
    radhamohanatatparah | radhavashikaro radhahridayambhojashatpadah || 16|| radhalinganasammohah radhanartanakautukah
    | radhasanjatasamprito radhakamyaphalapradah || 17|| vrindapatih koshanidhih kokashokavinashanah |
    candrapatih candrapatih candakodandabhanjanah || 18|| ramo dasharathi ramah bhriguvamshasamudbhavah
    | atmaramo jitakrodho moho mohandhabhanjanah || 19|| vrishabhanubhavo bhavah kashyapih karunanidhih
    | kolahalo hali hali heli haladharapriyah || 20|| radhamukhabjamartandah bhaskaro ravija vidhuh |
    vidhirvidhata varuno varuno varunipriyah || 21|| rohinihridayanando vasudevatmajo bali | nilambaro
    rauhineyo jarasandhavadho'malah || 22|| nago navambho virudo viraha varado bali | gopatho vijayi vidvan
    shipivishtah sanatanah || 23|| parashuramavacograhi varagrahi shrigalaha | damaghoshopadeshta ca rathagrahi
    sudarshanah || 24|| virapatniyashastrata jaravyadhivighatakah | dvarakavasatattvajnah hutashanavarapradah
    || 25|| yamunavegasamhari nilambaradharah prabhuh | vibhuh sharasano dhanvi ganesho gananayakah ||
    26|| lakshmano lakshano lakshyo rakshovamshavinashanah | vamano vamanibhuto'vamano vamanaruhah ||
    27|| yashodanandanah kartta yamalarjunamuktidah | ulukhali mahamani damabaddhahvayi shami || 28||
    bhaktanukari bhagavan keshavo baladharakah | keshiha madhuha mohi vrishasuravighatakah || 29|| aghasuravinashi
    ca putanamokshadayakah | kubjavinodi bhagavan kamsamrityurmahamakhi || 30|| ashvamedho vajapeyo gomedho
    naramedhavan | kandarpakotilavanyashcandrakotisushitalah || 31|| ravikotipratikasho vayukotimahabalah
    | brahma brahmandakarta ca kamalavanchitapradah || 32|| kamala kamalakshashca kamalamukhalolupah |
    kamalavratadhari ca kamalabhah purandarah || 33|| saubhagyadhikacitto'yam mahamayi madotkatah | tarakarih
    suratrata maricakshobhakarakah || 34|| vishvamitrapriyo danto ramo rajivalocanah | lankadhipakuladhvamsi
    vibhishanavarapradah || 35|| sitanandakaro ramo viro varidhibandhanah | kharadushanasamhari saketapuravasavan
    || 36|| candravalipatih kulah keshikamsavadho'malah | madhavo madhuha madhvi madhviko madhavo vidhuh
    || 37|| munjatavigahamanah dhenukarirdharatmajah | vamshivatavihari ca govardhanavanashrayah || 38||
    tatha talavanoddeshi bhandiravanashankhaha | trinavartakripakari vrishabhanusutapatih || 39|| radhapranasamo
    radhavadanabjamadhuvratah | gopiranjanadaivajnah lilakamalapujitah || 40|| kridakamalasandohah gopikapritiranjanah
    | ranjako ranjano rango rangi rangamahiruhah || 41|| kamah kamaribhakto'yam puranapurushah kavih |
    narado devalo bhimo balo balamukhambujah || 42|| ambujo brahmasakshi ca yogi dattavaro munih | rishabhah
    parvato gramo nadipavanavallabhah || 43|| padmanabhah surajyeshthi brahma rudro'hibhushitah | gananam
    tranakarta ca ganesho grahilo grahi || 44|| ganashrayo ganadhyakshah krodikritajagattrayah | yadavendro
    dvarakendro mathuravallabho dhuri || 45|| bhramarah kuntali kuntisutaraksho mahamakhi | yamunavaradata
    ca kashyapasya varapradah || 46|| shankhacudavadhoddamo gopirakshanatatparah | pancajanyakaro rami
    trirami vanajo jayah || 47|| phalgunah phalgunasakho viradhavadhakarakah | rukminiprananathashca satyabhamapriyankarah
    || 48|| kalpavriksho mahavrikshah danavriksho mahaphalah | ankusho bhusuro bhavo bhramako bhamako
    harih || 49|| saralah shashvato viro yaduvamshi shivatmakah | pradyumno balakarta ca praharta daityaha
    prabhuh || 50|| mahadhani mahaviro vanamalavibhushanah | tulasidamashobhadhyo jalandharavinashanah
    || 51|| shurah suryo mritandashca bhaskaro vishvapujitah | ravistamoha vahnishca badavo vadavanalah
    || 52|| daityadarpavinashi ca garudo garudagrajah | gopinatho mahanatho vrindanatho'virodhakah ||
    53|| prapanci pancarupashca latagulmashca gopatih | ganga ca yamunarupo goda vetravati tatha || 54||
    kaveri narmada tapti gandaki sarayustatha | rajasastamasassattvi sarvangi sarvalocanah || 55|| sudhamayo'mritamayo
    yoginivallabhah shivah | buddho buddhimatam shreshtho vishnurjishnuh shacipatih || 56|| vamshi vamshadharo
    lokah viloko mohanashanah | ravaravo ravo ravo balo balabalahakah || 57|| shivo rudro nalo nilo langali
    langalashrayah | paradah pavano hamso hamsarudho jagatpatih || 58|| mohinimohano mayi mahamayo mahamakhi
    | vrisho vrishakapih kalah kalidamanakarakah || 59|| kubjabhagyaprado virah rajakakshayakarakah |
    komalo varuno raja jalajo jaladharakah || 60|| harakah sarvapapaghnah parameshthi pitamahah | khadgadhari
    kripakari radharamanasundarah || 61|| dvadasharanyasambhogi sheshanagaphanalayah | kamah shyamah sukhashridah
    shripatih shrinidhih kriti || 62|| harirnarayano naro narottama ishupriyah | gopalicittaharta ca kartta
    samsaratarakah || 63|| adidevo mahadevo gaurigururanashrayah | sadhurmadhurvidhurdhata trata'kruraparayanah
    || 64|| rolambi ca hayagrivo vanararirvanashrayah | vanam vani vanadhyakshah mahavandyo mahamunih
    || 65|| syamantakamaniprajno vijno vighnavighatakah | govarddhano varddhaniyah varddhano varddhanapriyah
    || 66|| varddhanyo varddhano varddhi varddhishnuh sumukhapriyah | varddhito vriddhako vriddho vrindarakajanapriyah
    || 67|| gopalaramanibharta sambakushthavinashakah | rukminiharanah premapremi candravalipatih || 68||
    shrikarta vishvabharta ca naro narayano bali | gano ganapatishcaiva dattatreyo mahamunih || 69|| vyaso
    narayano divyo bhavyo bhavukadharakah | shvahshreyasam shivam bhadram bhavukam bhavikam shubham ||
    70|| shubhatmakah shubhah shasta prashasta meghanadaha | brahmanyadevo dinanamuddharakaranakshamah
    || 71|| krishnah kamalapatrakshah krishnah kamalalocanah | krishnah kami sada krishnah samastapriyakarakah
    || 72|| nando nandi mahanandi madi madanakah kili | mili hili gili goli golo golalayo guli || 73||
    gugguli maraki shakhi vatah pippalakah kriti | mlecchaha kalahartta ca yashodayasha eva ca || 74||
    acyutah keshavo vishnuh harih satyo janardanah | hamso narayano lilo nilo bhaktiparayanah || 75||
    janakivallabho ramah viramo vighnanashanah | sahabhanurmahabhanuh virabahurmahodadhih || 76|| samudro'bdhirakuparah
    paravarah saritpatih | gokulanandakari ca pratijnaparipalakah || 77|| sadaramah kriparamah maharamo
    dhanurdharah | parvatah parvatakaro gayo geyo dvijapriyah || 78|| kambalashvataro ramo ramayanapravartakah
    | dyaurdivo divaso divyo bhavyo bhavi bhayapahah || 79|| parvatibhagyasahito bharta lakshmivilasavan
    | vilasi sahasi sarvi garvi garvitalocanah || 80|| murarirlokadharmajnah jivano jivanantakah | yamo
    yamadiyamano yami yamavidhayakah || 81|| vasuli pamsuli pamsuh pandurarjunavallabhah | lalita candrikamali
    mali malambujashrayah || 82|| ambujaksho mahayajnah dakshah cintamanih prabhuh | manirdinamanishcaiva
    kedaro badarishrayah || 83|| badarivanasampritah vyasah satyavatisutah | amararinihanta ca sudhasindhuvidhudayah
    || 84|| candro ravih shivah shuli cakri caiva gadadharah | shrikarta shripatih shridah shridevo devakisutah
    || 85|| shripatih pundarikakshah padmanabho jagatpatih | vasudevo'prameyatma keshavo garudadhvajah
    || 86|| narayanah param dhama devadevo maheshvarah | cakrapanih kalapurno vedavedyo dayanidhih ||
    87|| bhagavan sarvabhutesho gopalah sarvapalakah | ananto nirguno nityo nirvikalpo niranjanah || 88||
    niradharo nirakarah nirabhaso nirashrayah | purushah pranavatito mukundah parameshvarah || 89|| kshanavanih
    sarvabhaumo vaikuntho bhaktavatsalah | vishnurdamodarah krishno madhavo mathurapatih || 90|| devakigarbhasambhuto
    yashodavatsalo harih | shivah sankarshanah shambhurbhutanatho divaspatih || 91|| avyayah sarvadharmajnah
    nirmalo nirupadravah | nirvananayako nityo nilajimutasannibhah || 92|| kalakshayashca sarvajnah kamalarupatatparah
    | hrishikeshah pitavasa vasudevapriyatmajah || 93|| nandagopakumararyah navanitashano vibhuh | puranapurushah
    shreshthah shankhapanih suvikramah || 94|| aniruddhashcakrarathah sharngapanishcaturbhujah | gadadharah
    surartighno govindo nandakayudhah || 95|| vrindavanacarah shaurirvenuvadyavisharadah | trinavartantako
    bhimasahasi bahuvikramah || 96|| shakatasurasamhari bakasuravinashanah | dhenukasurasamhari putanarirnrikesari
    || 97|| pitamaho gurussakshat pratyagatma sadashivah | aprameyah prabhuh prajno'pratarkyah svapnavarddhanah
    || 98|| dhanyo manyo bhavo bhavo dhirah shanto jagadguruh | antaryamishvaro divyo daivajno devasamstutah
    || 99|| kshirabdhishayano dhata lakshmivamllakshmanagrajah | dhatripatirameyatma candrashekharapujitah
    || 100|| lokasakshi jagaccakshuh punyacaritrakirtanah | kotimanmathasaundaryah jaganmohanavigrahah
    || 101|| mandasmitanano gopo gopikapariveshtitah | phullaravindanayanah canurandhranishudanah || 102||
    indivaradalashyamo barhibarhavatamsakah | muralininadahladah divyamalyambaravritah || 103|| sukapolayugah
    subhruyugalah sulalatakah | kambugrivo vishalaksho lakshmivanchubhalakshanah || 104|| pinavakshashcaturbahushcaturmurtistrivikramah
    | kalankarahitah shuddhah dushtashatrunibarhanah || 105|| kiritakundaladharah katakangadamanditah
    | mudrikabharanopetah katisutravirajitah || 106|| manjiraranjitapadah sarvabharanabhushitah | vinyastapadayugalo
    divyamangalavigrahah || 107|| gopikanayananandah purnacandranibhananah | samastajagadanandah sundaro
    lokanandanah || 108|| yamunatirasancari radhamanmathavaibhavah | gopanaripriyo danto gopivastrapaharakah
    || 109|| shringaramurtih shridhama tarako mulakaranam | srishtisamrakshanopayah krurasuravibhanjanah
    || 110|| narakasurasamhari murarirarimardanah | aditeyapriyo daityabhikaro yadushekharah || 111||
    jarasandhakuladhvamsi kamsaratih suvikramah | punyashlokah kirtaniyah yadavendro jagannutah || 112||
    rukminiramanah satyabhamajambavatipriyah | mitravindanagnajitilakshmanasamupasitah || 113|| sudhakarakule
    jato'nantaprabalavikramah | sarvasaubhagyasampanno dvarakapattane sthitah || 114|| bhadrasuryasutanatho
    lilamanushavigrahah | sahasrashodashastrisho bhogamokshaikadayakah || 115|| vedantavedyah samvedyo
    vaidyo brahmandanayakah | govarddhanadharo nathah sarvajivadayaparah || 116|| murtiman sarvabhutatma
    artatranaparayanah | sarvajnah sarvasulabhah sarvashastravisharadah || 117|| shadgunaishvaryasampannah
    purnakamo dhurandharah | mahanubhavah kaivalyadayako lokanayakah || 118|| adimadhyantarahitah shuddhasattvikavigrahah
    | asamanah samastatma sharanagatavatsalah || 119|| utpattisthitisamharakaranam sarvakaranam | gambhirah
    sarvabhavajnah saccidanandavigrahah || 120|| vishvaksenah satyasandhah satyavak satyavikramah | satyavratah
    satyaratah sarvadharmaparayanah || 121|| apannartiprashamanah draupadimanarakshakah | kandarpajanakah
    prajno jagannatakavaibhavah || 122|| bhaktivashyo gunatitah sarvaishvaryapradayakah | damaghoshasutadveshi
    banabahuvikhandanah || 123|| bhishmabhaktiprado divyah kauravanvayanashanah | kaunteyapriyabandhushca
    parthasyandanasarathih || 124|| narasimho mahavirah stambhajato mahabalah | prahladavaradah satyo
    devapujyo'bhayankarah || 125|| upendra indravarajo vamano balibandhanah | gajendravaradah svami sarvadevanamaskritah
    || 126|| sheshaparyankashayanah vainateyaratho jayi | avyahatabalaishvaryasampannah purnamanasah ||
    127|| yogeshvareshvarah sakshi kshetrajno jnanadayakah | yogihritpankajavaso yogamayasamanvitah ||
    128|| nadabindukalatitashcaturvargaphalapradah | sushumnamargasancari dehasyantarasamsthitah || 129||
    dehendriyamanahpranasakshi cetahprasadakah | sukshmah sarvagato dehi jnanadarpanagocarah || 130||
    tattvatrayatmako'vyaktah kundali samupashritah | brahmanyah sarvadharmajnah shanto danto gataklamah
    || 131|| shrinivasah sadanandah vishvamurtirmahaprabhuh | sahasrashirsha purushah sahasrakshah sahasrapat
    || 132|| samastabhuvanadharah samastapranarakshakah | samastasarvabhavajno gopikapranavallabhah ||
    133|| nityotsavo nityasaukhyo nityashrirnityamangalah | vyuharcito jagannathah shrivaikunthapuradhipah
    || 134|| purnanandaghanibhutah gopaveshadharo harih | kalapakusumashyamah komalah shantavigrahah ||
    135|| gopanganavrito'nanto vrindavanasamashrayah | venuvadaratah shreshtho devanam hitakarakah ||
    136|| balakridasamasakto navanitasya taskarah | gopalakaminijarashcaurajarashikhamanih || 137|| paranjyotih
    parakashah paravasah parisphutah | ashtadashaksharo mantro vyapako lokapavanah || 138|| saptakotimahamantrashekharo
    devashekharah | vijnanajnanasandhanastejorashirjagatpatih || 139|| bhaktalokaprasannatma bhaktamandaravigrahah
    | bhaktadaridryadamano bhaktanam pritidayakah || 140|| bhaktadhinamanah pujyah bhaktalokashivankarah
    | bhaktabhishtapradah sarvabhaktaghaughanikrintanah || 141|| aparakarunasindhurbhagavan bhaktatatparah
    || 142|| || iti gopala sahasranamastotram sampurnam || phalashrutih (|| gopalasahasranama mahatmyam
    ||) smaranat paparashinam khandanam mrityunashanam || 1 || vaishnavanam priyakaram maharoganivaranam
    | brahmahatyasurapanam parastrigamanam tatha || 2 || paradravyapaharanam paradveshasamanvitam | manasam
    vacikam kayam yatpapam papasambhavam || 3 || sahasranamapathanat sarvam nashyati tatkshanat | mahadaridryayukto
    yo vaishnavo vishnubhaktiman || 4 || kartikyam sampathedratrau shatamashtottaram kramat | pitambaradharo
    dhiman sugandhaih pushpacandanaih || 5 || pustakam pujayitva tu naivedyadibhireva ca | radhadhyanankito
    dhiro vanamalavibhushitah || 6 || shatamashtottaram devi pathennamasahasrakam | caitrashukle ca krishne
    ca kuhusankrantivasare || 7 || pathitavyam prayatnena trailokyam mohayet kshanat | tulasimalaya yukto
    vaishnavo bhaktitatparah || 8 || ravivare ca shukre ca dvadashyam shraddhavasare | brahmanam pujayitva
    ca bhojayitva vidhanatah || 9 || pathennamasahasram ca tatah siddhih prajayate | mahanishayam satatam
    vaishnavo yah pathet sada || 10 || deshantaragata lakshmih samayati na samshayah | trailokye ca mahadevi
    sundaryah kamamohitah || 11 || mugdhah svayam samayanti vaishnavam ca bhajanti tah | rogi rogat pramucyeta
    baddho mucyeta bandhanat || 12|| gurvini janayetputram kanya vindati satpatim | var garbhini rajano
    vashyatam yanti kim punah kshudramanavah || 13|| sahasranamashravanat pathanat pujanat priye | dharanat
