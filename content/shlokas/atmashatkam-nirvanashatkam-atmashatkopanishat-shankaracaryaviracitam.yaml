id: atmashatkam-nirvanashatkam-atmashatkopanishat-shankaracaryaviracitam
category: upanishad
name:
  english: atmashatkam, nirvanashatkam, atmashatkopanishat (shankaracaryaviracitam)
  devanagari: आत्मषट्कम्, निर्वाणषट्कम्, आत्मषट्कोपनिषत् (शङ्कराचार्यविरचितम्)
content:
  english: manobuddhyahankaracittani naham na ca shrotrajihve na ca ghrananetre | na ca vyoma bhumirna
    tejo na vayushcidanandarupah shivo'ham shivo'ham || 1|| na ca pranasamjno na vai pancavayurna va saptadhaturna
    va pancakoshah | na vakpanipadau na copasthapayu cidanandarupah shivo'ham shivo'ham || 2|| na me dvesharagau
    na me lobhamohau mado naiva me naiva matsaryabhavah |
  devanagari: मनोबुद्ध्यहङ्कारचित्तानि नाहं न च श्रोत्रजिह्वे न च घ्राणनेत्रे । न च व्योम भूमिर्न तेजो
    न वायुश्चिदानन्दरूपः शिवोऽहं शिवोऽहम् ॥ १॥ न च प्राणसंज्ञो न वै पञ्चवायुर्न वा सप्तधातुर्न वा पञ्चकोशः
    । न वाक्पाणिपादौ न चोपस्थपायू चिदानन्दरूपः शिवोऽहं शिवोऽहम् ॥ २॥ न मे द्वेषरागौ न मे लोभमोहौ मदो नैव
    मे नैव मात्सर्यभावः ।
meaning: {}
