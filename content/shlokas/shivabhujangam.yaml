id: shivabhujangam
category: stotram
name:
  english: shivabhujangam
  devanagari: शिवभुजङ्गम्
content:
  english: stvadiyam samastam vibhatiti yasmat | shivadanyatha daivatam nabhijane shivo'ham shivo'ham
    shivo'ham shivo'ham || 36 || yato'jayatedam prapancam vicitram sthitim yati yasminyadevantamante |
    sa karmadihinah svayajjyotiratma shivo'ham shivo'ham shivo'ham shivo'ham || 37 || kirite nishesho
    lalate hutasho bhuje bhogirajo gale kalima ca | tanau kamini yasya tattulyadevam na jane na jane na
    jane na jane || 38 || anena stavenadaradambikesham param bhaktimasadya yam ye namanti | mritau nirbhayaste
    janastam bhajante hridambhojamadhye sadasinamisham || 39 || bhujangapriyakalpa shambho mayaivam bhujangaprayatena
    vrittena klriptam | narah stotrametatpathitvorubhaktya suputrayurarogyamaishvaryameti || 40 || ||shivabhujangam
    sampurnam||
  devanagari: स्त्वदीयं समस्तं विभातीति यस्मात् । शिवादन्यथा दैवतं नाभिजाने शिवोऽहं शिवोऽहं शिवोऽहं शिवोऽहम्
    ॥ ३६ ॥ यतोऽजायतेदं प्रपञ्चं विचित्रं स्थितिं याति यस्मिन्यदेवान्तमन्ते । स कर्मादिहीनः स्वयज्ज्योतिरात्मा
    शिवोऽहं शिवोऽहं शिवोऽहं शिवोऽहम् ॥ ३७ ॥ किरीटे निशेशो ललाटे हुताशो भुजे भोगिराजो गले कालिमा च । तनौ
    कामिनी यस्य तत्तुल्यदेवं न जाने न जाने न जाने न जाने ॥ ३८ ॥ अनेन स्तवेनादरादंबिकेशं परां भक्तिमासाद्य
    यं ये नमन्ति । मृतौ निर्भयास्ते जनास्तं भजन्ते हृदंभोजमध्ये सदासीनमीशम् ॥ ३९ ॥ भुजङ्गप्रियाकल्प शंभो
    मयैवं भुजङ्गप्रयातेन वृत्तेन क्लृप्तम् । नरः स्तोत्रमेतत्पठित्वोरुभक्त्या सुपुत्रायुरारोग्यमैश्वर्यमेति
    ॥ ४० ॥ ॥शिवभुजङ्गं संपूर्णम्॥
