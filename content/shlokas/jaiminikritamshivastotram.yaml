id: jaiminikritamshivastotram
category: stotram
name:
  english: jaiminikritamshivastotram
  devanagari: जैमिनिकृतंशिवस्तोत्रम्
content:
  english: 152|| iti shribrihannaradiyapurane brihadupakhyane uttarabhage vasumohini samvade tryambakeshvaramahatmye
    vedapadastavo nama trisaptatitamo'dhyayah || 73|| brihannaradiyapurana | uttarabhaga | adhyaya 73
  devanagari: १५२॥ इति श्रीबृहन्नारदीयपुराणे बृहदुपाख्याने उत्तरभागे वसुमोहिनी संवादे त्र्यम्बकेश्वरमाहात्म्ये
    वेदपादस्तवो नाम त्रिसप्ततितमोऽध्यायः ॥ ७३॥ बृहन्नारदीयपुराण । उत्तरभाग । अध्याय ७३
meaning: {}
