id: brahmanakritam01durgastotram-14
category: stotram
name:
  english: brahmanakritam01durgastotram 14
  devanagari: ब्रह्मणाकृतं०१दुर्गास्तोत्रम् १४
content:
  english: brahmana kritam 1 durgastotram 14 brahmovaca | vishveshvarim jagaddhatrim sthitisamharakarinim
    | nidram bhagavatim vishnoratulam tejasah prabhuh || 53|| tvam svaha tvam svadha tvam hi vashatkarah
    svaratmika | sudha tvamakshare nitye tridha matratmika sthita || 54|| ardhamatra sthita nitya yanuccarya
    visheshatah | tvameva sandhya savitri tvam devi janani para || 55|| tvayaitaddharyate vishvam tvayaitatsrijyate
    jagat | tvayaitatpalyate devi tvamatsyante ca sarvada || 56|| visrishtau srishtirupa tvam sthitirupa
    ca palane | tatha samhritirupante jagato'sya jaganmaye || 57|| mahavidya mahamaya mahamedha mahasmritih
    | mahamoha ca bhavati mahadevi maheshvari || 58|| prakritistvanca sarvasya gunatrayavibhavini | kalaratrirmaharatrirmoharatrishca
    daruna || 59|| tvam shristvamishvari tvam hristvam buddhirbodhalakshana | lajja pushtistatha tushtistvam
    shantih kshantireva ca || 60|| khadgigani shulini ghora gadini cakrini tatha | shankhini capini banabhushundi
    parighayudha || 61|| saumya saumyatarasheshasaumyebhyastvatisundari | paraparanam parama tvameva parameshvari
    || 62|| yacca kincitkvacidvastu sadasadvakhilatmike | tasya sarvasya ya shiktih sa tvam kim stuyate
    tada || 63|| yaya tvaya jagatstrashta jagatpatyatti yo jagat | so'pi nidravasham nitah kastvam stotumiheshvarah
    || 64|| vishnuh shariragrahanamahamishana eva ca | karitaste yato'tastvam kah stotum shaktiman bhavet
    || 65|| sa tvamittham prabhavaih svairudarairdevi samstuta | mohayaitau duradharshavasuro madhukaitabhau
    || 66|| prabodhanca jagatsvami niyatamacyuto laghu | bodhashca kriyatamasya hantumetau mahasurau ||
    67|| iti markandeyapurane ekashititamadhyayantargatam brahmana kritam durgastotram samaptam | markandeyapurana
    | adhyaya 78|| 81
  devanagari: ब्रह्मणा कृतं १ दुर्गास्तोत्रम् १४ ब्रह्मोवाच । विश्वेश्वरीं जगद्धात्रीं स्थितिसंहारकारिणीम्
    । निद्रां भगवतीं विष्णोरतुलां तेजसः प्रभुः ॥ ५३॥ त्वं स्वाहा त्वं स्वधा त्वं हि वषट्कारः स्वरात्मिका
    । सुधा त्वमक्षरे नित्ये त्रिधा मात्रात्मिका स्थिता ॥ ५४॥ अर्धमात्रा स्थिता नित्या यानुच्चार्या विशेषतः
    । त्वमेव सन्ध्या सावित्री त्वं देवि जननी परा ॥ ५५॥ त्वयैतद्धार्यते विश्वं त्वयैतत्सृज्यते जगत् । त्वयैतत्पाल्यते
    देवि त्वमत्स्यन्ते च सर्वदा ॥ ५६॥ विसृष्टौ सृष्टिरूपा त्वं स्थितिरूपा च पालने । तथा संहृतिरूपान्ते
    जगतोऽस्य जगन्मये ॥ ५७॥ महाविद्या महामाया महामेधा महास्मृतिः । महामोहा च भवती महादेवी महेश्वरी ॥ ५८॥
    प्रकृतिस्त्वञ्च सर्वस्य गुणत्रयविभाविनी । कालरात्रिर्महारात्रिर्मोहरात्रिश्च दारुणा ॥ ५९॥ त्वं श्रीस्त्वमीश्वरी
    त्वं ह्रीस्त्वं बुद्धिर्बोधलक्षणा । लज्जा पुष्टिस्तथा तुष्टिस्त्वं शान्तिः क्षान्तिरेव च ॥ ६०॥ खड्गिगनी
    शूलिनी घोरा गदिनी चक्रिणी तथा । शङ्खिनी चापिनी बाणभुशुण्डी परिघायुधा ॥ ६१॥ सौम्या सौम्यतराशेषसौम्येभ्यस्त्वतिसुन्दरी
    । परापराणां परमा त्वमेव परमेश्वरी ॥ ६२॥ यच्च किञ्चित्क्वचिद्वस्तु सदसद्वाखिलात्मिके । तस्य सर्वस्य
    या शिक्तिः सा त्वं किं स्तूयते तदा ॥ ६३॥ यया त्वया जगत्स्त्रष्टा जगत्पात्यत्ति यो जगत् । सोऽपि निद्रावशं
    नीतः कस्त्वां स्तोतुमिहेश्वरः ॥ ६४॥ विष्णुः शरीरग्रहणमहामीशान एव च । कारितास्ते यतोऽतस्त्वां कः स्तोतुं
    शक्तिमान् भवेत् ॥ ६५॥ सा त्वमित्थं प्रभावैः स्वैरुदारैर्देवि संस्तुता । मोहयैतौ दुराधर्षावसुरो मधुकैटभौ
    ॥ ६६॥ प्रबोधञ्च जगत्स्वामी नीयतामच्युतो लघु । बोधश्च क्रियतामस्य हन्तुमेतौ महासुरौ ॥ ६७॥ इति मार्कण्डेयपुराणे
    एकाशीतितमाध्ययान्तर्गतं ब्रह्मणा कृतं दुर्गास्तोत्रं समाप्तम् । मार्कण्डेयपुराण । अध्याय ७८॥ ८१
