id: narayanaproktamharistotram
category: stotram
name:
  english: narayanaproktamharistotram
  devanagari: नारायणप्रोक्तंहरिस्तोत्रम्
content:
  english: narayanaproktam haristotram satvatanam hridi sakshannarayano vasamyaham | namastasmai pareshaya
    tajjalaya namo namah || 58|| anantashaktyadhishthanantaratma~ste namo namah | adrishyarupine'lakshyavartmane
    brahmane namah || 59|| duritanashane'khilapranirupaya te namah | asannirasananamne sattvatampataye
    namah || 60|| dinanam bandhave tubhyam svadhamni ramsyate namah | nirastatishayasamyagunaishvaryavate
    namah || 61|| ayoginam viduraya svahridisthaya te namah | yatkirtishravadrishyarha smritistotrani
    sarvatha || 6|| kalmashani vidhunvanti tasmai bhadrakrite namah | prapanna yatpadopastya matrasprishim
    vidhuya ca || 63|| nirashaya brahmagatim yanti tasmai ca te namah | shiladanakriyamantrayajnatyagatapovratah
    || 64|| yadarpanamrite kshemam vindanti na hi te namah | shvadamatsyadacarmakridyavana''bhirasankarah
    || 65|| kankashabarajhalladaparadhirganikapivah | kiratakhasaghatashca papashcanye'pi jantavah ||
    66|| yadashritashrayacchighram shuddhyanti te namo namah | avataramayah so'yam sadhusadhvimayah prabhuh
    || 67|| ishesha'jamayo devo narayanah prasidatam | rishipitridevamayo manavasuranagadhrik || 68||
    patipatnimayo devo narayanah prasidatam | naranarisvarupo'yam nriparajnimayah prabhuh || 69|| lokadhamadharadhihrishripatirme
    prasidatam | yatpadadhyanadhautantarhrido vindanti yam prabhum || 70|| tadotaprotasadbuddhya yadrigrupah
    sa drishyate | tatha tam kavayo loke varnayanti paratparam || 71|| brahmavanyam brahmarupo lokavanyam
    rasatmakah | ubhavanyam mishtatikto prasidatam katheshtadah || 72|| iti shrilakshminarayaniyasamhitayam
    prathame kritayugasantane 59
  devanagari: नारायणप्रोक्तं हरिस्तोत्रम् सात्वतानां हृदि साक्षान्नारायणो वसाम्यहम् । नमस्तस्मै परेशाय
    तज्जलाय नमो नमः ॥ ५८॥ अनन्तशक्त्यधिष्ठानान्तरात्मँस्ते नमो नमः । अदृश्यरूपिणेऽलक्ष्यवर्त्मने ब्रह्मणे
    नमः ॥ ५९॥ दुरीतनाशनेऽखिलप्राणिरूपाय ते नमः । असन्निरसननाम्ने सात्त्वताम्पतये नमः ॥ ६०॥ दीनानां बन्धवे
    तुभ्यं स्वधाम्नि रंस्यते नमः । निरस्तातिशयसाम्यगुणैश्वर्यवते नमः ॥ ६१॥ अयोगिनां विदूराय स्वहृदिस्थाय
    ते नमः । यत्कीर्तिश्रवदृश्यार्हा स्मृतिस्तोत्राणि सर्वथा ॥ ६॥ कल्मषाणि विधुन्वन्ति तस्मै भद्रकृते
    नमः । प्रपन्ना यत्पदोपास्त्या मात्रास्पृशिं विधूय च ॥ ६३॥ निराशया ब्रह्मगतिं यान्ति तस्मै च ते नमः
    । शीलदानक्रियामन्त्रयज्ञत्यागतपोव्रताः ॥ ६४॥ यदर्पणमृते क्षेमं विन्दन्ति न हि ते नमः । श्वादमत्स्यादचर्मकृद्यवनाऽऽभीरसङ्कराः
    ॥ ६५॥ कङ्कशबरझल्लादपारधिर्गणिकापिवाः । किरातखसघाताश्च पापाश्चान्येऽपि जन्तवः ॥ ६६॥ यदाश्रिताश्रयाच्छीघ्रं
    शुद्ध्यन्ति ते नमो नमः । अवतारमयः सोऽयं साधुसाध्वीमयः प्रभुः ॥ ६७॥ ईशेशाऽजामयो देवो नारायणः प्रसीदताम्
    । ऋषिपितृदेवमयो मानवासुरनागधृक् ॥ ६८॥ पतिपत्नीमयो देवो नारायणः प्रसीदताम् । नरनारीस्वरूपोऽयं नृपराज्ञीमयः
    प्रभुः ॥ ६९॥ लोकधामधराधीह्रीश्रीपतिर्मे प्रसीदताम् । यत्पादध्यानधौतान्तर्हृदो विन्दन्ति यं प्रभुम्
    ॥ ७०॥ तदोतप्रोतसद्बुद्ध्या यादृग्रूपः स दृश्यते । तथा तं कवयो लोके वर्णयन्ति परात्परम् ॥ ७१॥ ब्रह्मवाण्यां
    ब्रह्मरूपो लोकवाण्यां रसात्मकः । उभवाण्यां मिष्टतिक्तो प्रसीदतां कथेष्टदः ॥ ७२॥ इति श्रीलक्ष्मीनारायणीयसंहितायां
    प्रथमे कृतयुगसन्ताने ५९
