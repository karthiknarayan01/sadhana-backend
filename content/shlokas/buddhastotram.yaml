id: buddhastotram
category: stotram
name:
  english: buddhastotram
  devanagari: बुद्धस्तोत्रम्
content:
  english: buddhastotram om namo buddhaya | namo'stu buddhaya vishuddhabodhaye vishuddhadharmapratibhasabuddhaye
    | saddharmapunyopagatanubuddhaye bhavagrashunyaya vishuddhabuddhaye || 1|| aho aho buddhamanantatejasamaho
    aho sagaramerugulmam | aho aho buddhamanantagocaramaudumbaram pushpamivatidurlabham || 2|| aho mahakarunikastathagatah
    aho aho shakyakulasya ketuh | aho pranamyah sa narendrasuryo yenedrisham bhashitasutramuttamam ||
    3|| anugrahartham sa hi sarvasattvan saddharmacaryamupadishya nunam | shanteshvarah shakyamunistathagatah
    sattvottamah shantapuram pravishtah || 4|| gambhirashantam virajasamadhipadam pravishte jinabuddhagocare
    | shunyashca kayastvatha shravakanam shunya vihara dvipadottamanam || 5|| te sarvadharma prakritishca
    shunya sattva hi shunya nahi jatu vidyate || 6|| nityam ca nityam ca jinam smarami nityam ca shocami
    jinasya darshanam | nityam ca nityam pranidhim karomi sambuddhapujyasya ca darshanartham || 7|| sthapyeha
    nityam dharanishu janu shokabhitapto jinadarshanaya | odantakarunyavinayakastvamativa trishna sugatasya
    darshane || 8|| satam varo yadvijahara nityam dadahi me darshanatoyashitalam | sattvah satrishnastava
    rupadarshane prahladayainan karunajalena || 9|| karunyabhavam kuru natha nayaka dadahi me darshanam
    saumyarupam | tvam pahi tratarjagadekadeshita shunyashca kayastvatha shravakanam || 10|| akashatulya
    gaganasvabhava mayamaricyodakacandrakayah | sarve ca sattvah sukhitasvabhava bhavantu bho nayaka tvatprasadat
    || 11|| iti bodhisattvasamuccayanama kuladevataviracitam buddhastotram sampurnam ||
  devanagari: बुद्धस्तोत्रम् ॐ नमो बुद्धाय । नमोऽस्तु बुद्धाय विशुद्धबोधये विशुद्धधर्मप्रतिभासबुद्धये
    । सद्धर्मपुण्योपगतानुबुद्धये भवाग्रशून्याय विशुद्धबुद्धये ॥ १॥ अहो अहो बुद्धमनन्ततेजसमहो अहो सागरमेरुगुल्मम्
    । अहो अहो बुद्धमनन्तगोचरमौदुम्बरं पुष्पमिवातिदुर्लभम् ॥ २॥ अहो महाकारुणिकस्तथागतः अहो अहो शाक्यकुलस्य
    केतुः । अहो प्रणम्यः स नरेन्द्रसूर्यो येनेदृशं भाषितसूत्रमुत्तमम् ॥ ३॥ अनुग्रहार्थं स हि सर्वसत्त्वान्
    सद्धर्मचर्यामुपदिश्य नूनम् । शान्तेश्वरः शाक्यमुनिस्तथागतः सत्त्वोत्तमः शान्तपुरं प्रविष्टः ॥ ४॥ गम्भीरशान्तं
    विरजासमाधिपदं प्रविष्टे जिनबुद्धगोचरे । शून्याश्च कायास्त्वथ श्रावकाणां शून्या विहारा द्विपदोत्तमानाम्
    ॥ ५॥ ते सर्वधर्मा प्रकृतिश्च शून्या सत्त्वा हि शून्या नहि जातु विद्यते ॥ ६॥ नित्यं च नित्यं च जिनं
    स्मरामि नित्यं च शोचामि जिनस्य दर्शनम् । नित्यं च नित्यं प्रणिधिं करोमि सम्बुद्धपूज्यस्य च दर्शनार्थम्
    ॥ ७॥ स्थाप्येह नित्यं धरणीषु जानु शोकाभितप्तो जिनदर्शनाय । ओदन्तकारुण्यविनायकस्त्वमतीव तृष्णा सुगतस्य
    दर्शने ॥ ८॥ सतां वरो यद्विजहार नित्यं ददाहि मे दर्शनतोयशीतलम् । सत्त्वाः सतृष्णास्तव रूपदर्शने प्रह्लादयैनान्
    करुणाजलेन ॥ ९॥ कारुण्यभावं कुरु नाथ नायक ददाहि मे दर्शनं सौम्यरूपम् । त्वं पाहि त्रातर्जगदेकदेशिता
    शून्याश्च कायास्त्वथ श्रावकाणाम् ॥ १०॥ आकाशतुल्या गगनस्वभावा मायामरीच्योदकचन्द्रकायाः । सर्वे च सत्त्वाः
    सुखितस्वभावा भवन्तु भो नायक त्वत्प्रसादात् ॥ ११॥ इति बोधिसत्त्वसमुच्चयानाम कुलदेवताविरचितं बुद्धस्तोत्रं
    सम्पूर्णम् ॥
