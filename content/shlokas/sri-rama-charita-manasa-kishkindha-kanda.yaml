id: sri-rama-charita-manasa-kishkindha-kanda
category: stotram
name:
  english: Sri Rama Charita Manasa - Kishkindha Kanda
content:
  english: shriganeshaya namah shrijanakivallabho vijayate shriramacaritamanasa caturtha sopana kundendivarasundaravatibalau
    vijnanadhamavubhau shobhadhyau varadhanvinau shrutinutau govipravrindapriyau| mayamanusharupinau raghuvarau
    saddharmavarmaum hitau sitanveshanatatparau pathigatau bhaktipradau tau hi nah || || brahmambhodhisamudbhavam
    kalimalapradhvamsanam cavyayam shrimacchambhumukhendusundaravare samshobhitam sarvada| samsaramayabheshajam
    sukhakaram shrijanakijivanam dhanyaste kritinah pibanti satatam shriramanamamritam || mukti janma
    mahi jani gyana khani agha hani kara jaha~ basa sambhu bhavani so kasi seia kasa na || jarata sakala
    sura brinda bishama garala jehim pana kiya| tehi na bhajasi mana manda ko kripala sankara sarisa ||
    agem cale bahuri raghuraya| rishyamuka paravata niaraya || taha~ raha saciva sahita sugriva| avata
    dekhi atula bala simva || ati sabhita kaha sunu hanumana| purusha jugala bala rupa nidhana || dhari
    batu rupa dekhu taim jai| kahesu jani jiya~ sayana bujhai || pathe bali hohim mana maila| bhagaum
    turata tajaum yaha saila || bipra rupa dhari kapi taha~ gayu| matha nai puchata asa bhayu || ko tumha
    syamala gaura sarira| chatri rupa phirahu bana bira || kathina bhumi komala pada gami| kavana hetu
    bicarahu bana svami || mridula manohara sundara gata| sahata dusaha bana atapa bata || ki tumha tini
    deva maha~ kou| nara narayana ki tumha dou || do jaga karana tarana bhava bhanjana dharani bhara|
    ki tumha akila bhuvana pati linha manuja avatara || || kosalesa dasaratha ke jae | hama pitu bacana
    mani bana ae || nama rama lachimana du bhai| sanga nari sukumari suhai || iha~ hari nisicara baidehi|
    bipra phirahim hama khojata tehi || apana carita kaha hama gai| kahahu bipra nija katha bujhai ||
    prabhu pahicani pareu gahi carana| so sukha uma nahim barana || pulakita tana mukha ava na bacana|
    dekhata rucira besha kai racana || puni dhiraju dhari astuti kinhi| harasha hridaya~ nija nathahi
    cinhi || mora nyau maim pucha saim| tumha puchahu kasa nara ki naim || tava maya basa phiru~ bhulana|
    ta te maim nahim prabhu pahicana || do eku maim manda mohabasa kutila hridaya agyana| puni prabhu
    mohi bisareu dinabandhu bhagavana || || jadapi natha bahu avaguna morem| sevaka prabhuhi parai jani
    bhorem || natha jiva tava maya~ moha| so nistari tumharehim choha || ta para maim raghubira dohai|
    janu~ nahim kachu bhajana upai || sevaka suta pati matu bharosem| rahi asoca bani prabhu posem ||
    asa kahi pareu carana akulai| nija tanu pragati priti ura chai || taba raghupati uthai ura lava| nija
    locana jala sinci juraava || sunu kapi jiya~ manasi jani una| taim mama priya lachimana te duna ||
    samadarasi mohi kaha saba kou| sevaka priya ananyagati sou || do so ananya jakem asi mati na tari
    hanumanta| maim sevaka sacaracara rupa svami bhagavanta || || dekhi pavana suta pati anukula| hridaya~
    harasha biti saba sula || natha saila para kapipati rahi| so sugriva dasa tava ahi || tehi sana natha
    mayatri kije| dina jani tehi abhaya karije || so sita kara khoja karaihi| jaha~ taha~ marakata koti
    pathaihi || ehi bidhi sakala katha samujhai| lie duau jana pithi carhaai || jaba sugriva~ rama kahu~
    dekha| atisaya janma dhanya kari lekha || sadara mileu nai pada matha| bhainteu anuja sahita raghunatha
    || kapi kara mana bicara ehi riti| karihahim bidhi mo sana e priti || do taba hanumanta ubhaya disi
    ki saba katha sunai || pavaka sakhi dei kari jori priti drirhaai || || kinhi priti kachu bica na rakha|
    lachamina rama carita saba bhasha || kaha sugriva nayana bhari bari| milihi natha mithilesakumari
    || mantrinha sahita iha~ eka bara| baitha raheu~ maim karata bicara || gagana pantha dekhi maim jata|
    parabasa pari bahuta bilapata || rama rama ha rama pukari| hamahi dekhi dinheu pata dari || maga rama
    turata tehim dinha| pata ura lai soca ati kinha || kaha sugriva sunahu raghubira| tajahu soca mana
    anahu dhira || saba prakara karihu~ sevakai| jehi bidhi milihi janaki ai || do sakha bacana suni harashe
    kripasidhu balasimva| karana kavana basahu bana mohi kahahu sugriva || || nata bali aru maim dvau
    bhai| priti rahi kachu barani na jai || maya suta mayavi tehi n ~| ava so prabhu hamarem g ~ || ardha
    rati pura dvara pukara| bali ripu bala sahai na para || dhava bali dekhi so bhaga| maim puni gayu~
    bandhu sa~ga laga || giribara guha~ paitha so jai| taba balim mohi kaha bujhai || parikhesu mohi eka
    pakhavara| nahim avaum taba janesu mara || masa divasa taha~ raheu~ kharari| nisari rudhira dhara
    taha~ bhari || bali hatesi mohi marihi ai| sila dei taha~ caleu~ parai || mantrinha pura dekha binu
    saim| dinheu mohi raja bariai || bali tahi mari griha ava| dekhi mohi jiya~ bheda barhaava || ripu
    sama mohi maresi ati bhari| hari linhesi sarbasu aru nari || takem bhaya raghubira kripala| sakala
    bhuvana maim phireu~ bihala || iha~ sapa basa avata nahim| tadapi sabhita rahu~ mana mahi~ || suni
    sevaka dukha dinadayala| pharaki uthim dvai bhuja bisala || do sunu sugriva marihu~ balihi ekahim
    bana| brahma rudra saranagata ge~ na ubarihim prana || || je na mitra dukha hohim dukhari| tinhahi
    bilokata pataka bhari || nija dukha giri sama raja kari jana| mitraka dukha raja meru samana || jinha
    kem asi mati sahaja na ai| te satha kata hathi karata mitai || kupatha nivari supantha calava| guna
    pragate avagunanhi durava || deta leta mana sanka na dhari| bala anumana sada hita kari || bipati
    kala kara sataguna neha| shruti kaha santa mitra guna eha || agem kaha mridu bacana banai| pachem
    anahita mana kutilai || ja kara cita ahi gati sama bhai| asa kumitra pariharehi bhalai || sevaka satha
    nripa kripana kunari| kapati mitra sula sama cari || sakha soca tyagahu bala morem| saba bidhi ghataba
    kaja maim torem || kaha sugriva sunahu raghubira| bali mahabala ati ranadhira || dundubhi asthi tala
    dekharae| binu prayasa raghunatha dhahae || dekhi amita bala barhai priti| bali badhaba inha bhi paratiti
    || bara bara navi pada sisa| prabhuhi jani mana harasha kapisa || upaja gyana bacana taba bola| natha
    kripa~ mana bhayu alola || sukha sampati parivara baraai| saba parihari karihu~ sevakai || e saba
    ramabhagati ke badhaka| kahahim santa taba pada avaradhaka || satru mitra sukha dukha jaga mahim|
    maya krita paramaratha nahim || bali parama hita jasu prasada| milehu rama tumha samana bishada ||
    sapanem jehi sana hoi larai| jagem samujhata mana sakucai || aba prabhu kripa karahu ehi bha~ti| saba
    taji bhajanu karaum dina rati || suni biraga sanjuta kapi bani| bole biha~si ramu dhanupani || jo
    kachu kahehu satya saba soi| sakha bacana mama mrisha na hoi || nata marakata iva sabahi nacavata|
    ramu khagesa beda asa gavata || lai sugriva sanga raghunatha| cale capa sayaka gahi hatha || taba
    raghupati sugriva pathava| garjesi jai nikata bala pava || sunata bali krodhatura dhava| gahi kara
    carana nari samujhava || sunu pati jinhahi mileu sugriva| te dvau bandhu teja bala simva || kosalesa
    suta lachimana rama| kalahu jiti sakahim sangrama || do kaha bali sunu bhiru priya samadarasi raghunatha|
    jaum kadaci mohi marahim tau puni hau~ sanatha || || asa kahi cala maha abhimani| trina samana sugrivahi
    jani || bhire ubhau bali ati tarja | muthika mari mahadhuni garja || taba sugriva bikala hoi bhaga|
    mushti prahara bajra sama laga || maim jo kaha raghubira kripala| bandhu na hoi mora yaha kala ||
    ekarupa tumha bhrata dou| tehi bhrama tem nahim mareu~ sou || kara parasa sugriva sarira| tanu bha
    kulisa gi saba pira || meli kantha sumana kai mala| pathava puni bala dei bisala || puni nana bidhi
    bhi larai| bitapa ota dekhahim raghurai || do bahu chala bala sugriva kara hiya~ hara bhaya mani|
    mara bali rama taba hridaya majha sara tani || || para bikala mahi sara ke lagem| puni uthi baitha
    dekhi prabhu agem || syama gata sira jata banae~| aruna nayana sara capa carhaae~ || puni puni citi
    carana cita dinha| suphala janma mana prabhu cinha || hridaya~ priti mukha bacana kathora| bola citi
    rama ki ora || dharma hetu avatarehu gosai| marehu mohi byadha ki nai || maim bairi sugriva piara|
    avaguna kabana natha mohi mara || anuja badhu bhagini suta nari| sunu satha kanya sama e cari || inhahi
    kuddashti biloki joi| tahi badhem kachu papa na hoi || murha tohi atisaya abhimana| nari sikhavana
    karasi na kana || mama bhuja bala ashrita tehi jani| mara cahasi adhama abhimani || do sunahu rama
    svami sana cala na caturi mori| prabhu ajahu~ maim papi antakala gati tori || || sunata rama ati komala
    bani| bali sisa paraseu nija pani || acala karaum tanu rakhahu prana| bali kaha sunu kripanidhana
    || janma janma muni jatanu karahim| anta rama kahi avata nahim || jasu nama bala sankara kasi| deta
    sabahi sama gati avinasi || mama locana gocara soi ava| bahuri ki prabhu asa banihi banava || cham
    so nayana gocara jasu guna nita neti kahi shruti gavahim| jiti pavana mana go nirasa kari muni dhyana
    kabahu~ka pavahim || mohi jani ati abhimana basa prabhu kaheu rakhu sarirahi| asa kavana satha hathi
    kati surataru bari karihi baburahi || || aba natha kari karuna bilokahu dehu jo bara magu~| jehim
    joni janmaum karma basa taha~ rama pada anuragu~ || yaha tanaya mama sama binaya bala kalyanaprada
    prabhu lijiai| gahi baha~ sura nara naha apana dasa angada kijiai || rama carana drirha priti kari
    bali kinha tanu tyaga| sumana mala jimi kantha te girata na jani naga || || rama bali nija dhama pathava|
    nagara loga saba byakula dhava || nana bidhi bilapa kara tara| chute kesa na deha sa~bhara || tara
    bikala dekhi raghuraya | dinha gyana hari linhi maya || chiti jala pavaka gagana samira| panca racita
    ati adhama sarira || pragata so tanu tava agem sova| jiva nitya kehi lagi tumha rova || upaja gyana
    carana taba lagi| linhesi parama bhagati bara magi || uma daru joshita ki nai| sabahi nacavata ramu
    gosai || taba sugrivahi ayasu dinha| mritaka karma bidhibata saba kinha || rama kaha anujahi samujhai|
    raja dehu sugrivahi jai || raghupati carana nai kari matha| cale sakala prerita raghunatha || do lachimana
    turata bolae purajana bipra samaja| raju dinha sugriva kaha~ angada kaha~ jubaraja || || uma rama
    sama hita jaga mahim| guru pitu matu bandhu prabhu nahim || sura nara muni saba kai yaha riti| svaratha
    lagi karahim saba priti || bali trasa byakula dina rati| tana bahu brana cinta~ jara chati || soi
    sugriva kinha kapir | ati kripala raghubira subh || janatahu~ asa prabhu pariharahim| kahe na bipati
    jala nara parahim || puni sugrivahi linha bolai| bahu prakara nripaniti sikhai || kaha prabhu sunu
    sugriva harisa| pura na jau~ dasa cari barisa || gata grishama barasha ritu ai| rahihu~ nikata saila
    para chai || angada sahita karahu tumha raju| santata hridaya dharehu mama kaju || jaba sugriva bhavana
    phiri ae| ramu prabarashana giri para chae || do prathamahim devanha giri guha rakheu rucira banai|
    rama kripanidhi kachu dina basa karahinge ai || || sundara bana kusumita ati sobha| gunjata madhupa
    nikara madhu lobha || kanda mula phala patra suhae| bhe bahuta jaba te prabhu ae || dekhi manohara
    saila anupa| rahe taha~ anuja sahita surabhupa || madhukara khaga mriga tanu dhari deva| karahim siddha
    muni prabhu kai seva || mangalarupa bhayu bana taba te | kinha nivasa ramapati jaba te || phatika
    sila ati subhra suhai| sukha asina taha~ dvau bhai || kahata anuja sana katha aneka| bhagati birati
    nripaniti bibeka || barasha kala megha nabha chae| garajata lagata parama suhae || do lachimana dekhu
    mora gana nacata barida paikhi| grihi birati rata harasha jasa bishnu bhagata kahu~ dekhi || || ghana
    ghamanda nabha garajata ghora| priya hina darapata mana mora || damini damaka raha na ghana mahim|
    khala kai priti jatha thira nahim || barashahim jalada bhumi niarae~| jatha navahim budha bidya pae~
    || bu~da aghata sahahim giri kaimsem | khala ke bacana santa saha jaisem || chudra nadim bhari calim
    torai| jasa thorehu~ dhana khala itarai || bhumi parata bha dhabara pani| janu jivahi maya lapatani
    || samiti samiti jala bharahim talava| jimi sadaguna sajjana pahim ava || sarita jala jalanidhi mahu~
    jai| hoi acala jimi jiva hari pai || do harita bhumi trina sankula samujhi parahim nahim pantha| jimi
    pakhanda bada tem gupta hohim sadagrantha || || dadura dhuni cahu disa suhai| beda parhahim janu batu
    samudai || nava pallava bhe bitapa aneka| sadhaka mana jasa milem bibeka || arka jabasa pata binu
    bhayu| jasa suraja khala udyama gayu || khojata katahu~ mili nahim dhuri| kari krodha jimi dharamahi
    duri || sasi sampanna soha mahi kaisi| upakari kai sampati jaisi || nisi tama ghana khadyota biraja|
    janu dambhinha kara mila samaja || mahabrishti cali phuti kiarim | jimi sutantra bhe~ bigarahim narim
    || krishi niravahim catura kisana| jimi budha tajahim moha mada mana || dekhiata cakrabaka khaga nahim|
    kalihi pai jimi dharma parahim || ushara barashi trina nahim jama| jimi harijana hiya~ upaja na kama
    || bibidha jantu sankula mahi bhraja| praja barha jimi pai suraja || jaha~ taha~ rahe pathika thaki
    nana| jimi indriya gana upajem gyana || do kabahu~ prabala baha maruta jaha~ taha~ megha bilahim|
    jimi kaputa ke upajem kula saddharma nasahim || || kabahu~ divasa maha~ nibira tama kabahu~ka pragata
    patanga| binasi upaji gyana jimi pai kusanga susanga || || barasha bigata sarada ritu ai| lachimana
    dekhahu parama suhai || phulem kasa sakala mahi chai| janu barasha~ krita pragata burhaai || udita
    agasti pantha jala sosha| jimi lobhahi soshi santosha || sarita sara nirmala jala soha| santa hridaya
    jasa gata mada moha || rasa rasa sukha sarita sara pani| mamata tyaga karahim jimi gyani || jani sarada
    ritu khanjana ae| pai samaya jimi sukrita suhae || panka na renu soha asi dharani| niti nipuna nripa
    kai jasi karani || jala sankoca bikala bhi~ mina| abudha kutumbi jimi dhanahina || binu dhana nirmala
    soha akasa| harijana iva parihari saba asa || kahu~ kahu~ brishti saradi thori| kau eka pava bhagati
    jimi mori || do cale harashi taji nagara nripa tapasa banika bhikhari| jimi haribhagata pai shrama
    tajahi ashrami cari || || sukhi mina je nira agadha| jimi hari sarana na eku badha || phulem kamala
    soha sara kaisa| nirguna brahma saguna bhe~ jaisa || gunjata madhukara mukhara anupa| sundara khaga
    rava nana rupa || cakrabaka mana dukha nisi paikhi| jimi durjana para sampati dekhi || cataka ratata
    trisha ati ohi| jimi sukha lahi na sankaradrohi || saradatapa nisi sasi apahari| santa darasa jimi
    pataka tari || dekhi indu cakora samudai| citavatahim jimi harijana hari pai || masaka damsa bite
    hima trasa| jimi dvija droha kie~ kula nasa || do bhumi jiva sankula rahe ge sarada ritu pai| sadagura
    mile jahim jimi samsaya bhrama samudai || || barasha gata nirmala ritu ai| sudhi na tata sita kai
    pai || eka bara kaisehu~ sudhi janaum| kalahu jita nimisha mahu~ anaum || katahu~ rahu jaum jivati
    hoi| tata jatana kari aneu~ soi || sugrivahu~ sudhi mori bisari| pava raja kosa pura nari || jehim
    sayaka mara maim bali| tehim sara hataum murha kaha~ kali || jasu kripa~ chutahim mada moha| ta kahu~
    uma ki sapanehu~ koha || janahim yaha caritra muni gyani| jinha raghubira carana rati mani || lachimana
    krodhavanta prabhu jana| dhanusha carhaai gahe kara bana || do taba anujahi samujhava raghupati karuna
    simva || bhaya dekhai lai avahu tata sakha sugriva || || iha~ pavanasuta hridaya~ bicara| rama kaju
    sugriva~ bisara || nikata jai carananhi siru nava| carihu bidhi tehi kahi samujhava || suni sugriva~
    parama bhaya mana| bishaya~ mora hari linheu gyana || aba marutasuta duta samuha| pathavahu jaha~
    taha~ banara juha || kahahu pakha mahu~ ava na joi| morem kara ta kara badha hoi || taba hanumanta
    bolae duta| saba kara kari sanamana bahuta || bhaya aru priti niti dekhai| cale sakala carananhi sira
    nai || ehi avasara lachimana pura ae| krodha dekhi jaha~ taha~ kapi dhae || do dhanusha carhaai kaha
    taba jari karu~ pura chara| byakula nagara dekhi taba ayu balikumara || || carana nai siru binati
    kinhi| lachimana abhaya ba~ha tehi dinhi || krodhavanta lachimana suni kana| kaha kapisa ati bhaya~
    akulana || sunu hanumanta sanga lai tara| kari binati samujhau kumara || tara sahita jai hanumana|
    carana bandi prabhu sujasa bakhana || kari binati mandira lai ae| carana pakhari pala~ga baithae ||
    taba kapisa carananhi siru nava| gahi bhuja lachimana kantha lagava || natha bishaya sama mada kachu
    nahim| muni mana moha kari chana mahim || sunata binita bacana sukha pava| lachimana tehi bahu bidhi
    samujhava || pavana tanaya saba katha sunai| jehi bidhi ge duta samudai || do harashi cale sugriva
    taba angadadi kapi satha| ramanuja agem kari ae jaha~ raghunatha || || nai carana siru kaha kara jori|
    natha mohi kachu nahina khori || atisaya prabala deva taba maya| chuti rama karahu jaum daya || bishaya
    basya sura nara muni svami| maim pava~ra pasu kapi ati kami || nari nayana sara jahi na laga| ghora
    krodha tama nisi jo jaga || lobha pa~sa jehim gara na ba~dhaya| so nara tumha samana raghuraya ||
    yaha guna sadhana tem nahim hoi| tumhari kripa~ pava koi koi || taba raghupati bole musakai| tumha
    priya mohi bharata jimi bhai || aba soi jatanu karahu mana lai| jehi bidhi sita kai sudhi pai || do
    ehi bidhi hota batakahi ae banara jutha| nana barana sakala disi dekhia kisa barutha || || banara
    kataka uma mem dekha| so murukha jo karana caha lekha || ai rama pada navahim matha| nirakhi badanu
    saba hohim sanatha || asa kapi eka na sena mahim| rama kusala jehi puchi nahim || yaha kachu nahim
    prabhu ki adhikai| bisvarupa byapaka raghurai || tharhae jaha~ taha~ ayasu pai| kaha sugriva sabahi
    samujhai || rama kaju aru mora nihora| banara jutha jahu cahu~ ora || janakasuta kahu~ khojahu jai|
    masa divasa maha~ aehu bhai || avadhi meti jo binu sudhi pae~| avi banihi so mohi marae~ || do bacana
    sunata saba banara jaha~ taha~ cale turanta | taba sugriva~ bolae angada nala hanumanta || || sunahu
    nila angada hanumana| jamavanta matidhira sujana || sakala subhata mili dacchina jahu| sita sudhi
    pu~cheu saba kahu || mana krama bacana so jatana bicarehu| ramacandra kara kaju sa~varehu || bhanu
    pithi seia ura agi| svamihi sarba bhava chala tyagi || taji maya seia paraloka| mitahim sakala bhava
    sambhava soka || deha dhare kara yaha phalu bhai| bhajia rama saba kama bihai || soi gunagya soi barabhagi
    | jo raghubira carana anuragi || ayasu magi carana siru nai| cale harashi sumirata raghurai || pachem
    pavana tanaya siru nava| jani kaja prabhu nikata bolava || parasa sisa saroruha pani| karamudrika
    dinhi jana jani || bahu prakara sitahi samujhaehu| kahi bala biraha begi tumha aehu || hanumata janma
    suphala kari mana| caleu hridaya~ dhari kripanidhana || jadyapi prabhu janata saba bata| rajaniti
    rakhata suratrata || do cale sakala bana khojata sarita sara giri khoha| rama kaja layalina mana bisara
    tana kara choha || || katahu~ hoi nisicara saim bheta| prana lehim eka eka capeta || bahu prakara
    giri kanana herahim| kau muni milata tahi saba gherahim || lagi trisha atisaya akulane| mili na jala
    ghana gahana bhulane || mana hanumana kinha anumana| marana cahata saba binu jala pana || carhai giri
    sikhara cahu~ disi dekha| bhumi bibira eka kautuka pekha || cakrabaka baka hamsa uraahim| bahutaka
    khaga prabisahim tehi mahim || giri te utari pavanasuta ava| saba kahu~ lai soi bibara dekhava ||
    agem kai hanumantahi linha| paithe bibara bilambu na kinha || do dikha jai upavana bara sara bigasita
    bahu kanja| mandira eka rucira taha~ baithi nari tapa punja || || duri te tahi sabanhi sira nava|
    puchem nija brittanta sunava || tehim taba kaha karahu jala pana| khahu surasa sundara phala nana
    || majjanu kinha madhura phala khae| tasu nikata puni saba cali ae || tehim saba apani katha sunai|
    maim aba jaba jaha~ raghurai || mudahu nayana bibara taji jahu| paihahu sitahi jani pachitahu || nayana
    mudi puni dekhahim bira| tharhae sakala sindhu kem tira || so puni gi jaha~ raghunatha| jai kamala
    pada naesi matha || nana bha~ti binaya tehim kinhi| anapayani bhagati prabhu dinhi || do badaribana
    kahu~ so gi prabhu agya dhari sisa | ura dhari rama carana juga je bandata aja isa || || iha~ bicarahim
    kapi mana mahim| biti avadhi kaja kachu nahim || saba mili kahahim paraspara bata| binu sudhi le~
    karaba ka bhrata || kaha angada locana bhari bari| duhu~ prakara bhi mrityu hamari || iha~ na sudhi
    sita kai pai| uha~ ge~ marihi kapirai || pita badhe para marata mohi| rakha rama nihora na ohi ||
    puni puni angada kaha saba pahim| marana bhayu kachu samsaya nahim || angada bacana sunata kapi bira|
    boli na sakahim nayana baha nira || chana eka soca magana hoi rahe| puni asa vacana kahata saba bhe
    || hama sita kai sudhi linhem bina| nahim jaimhaim jubaraja prabina || asa kahi lavana sindhu tata
    jai| baithe kapi saba darbha dasai || jamavanta angada dukha dekhi| kahim katha upadesa biseshi ||
    tata rama kahu~ nara jani manahu| nirguna brahma ajita aja janahu || do nija iccha prabhu avatari
    sura mahi go dvija lagi| saguna upasaka sanga taha~ rahahim moccha saba tyagi || || ehi bidhi katha
    kahahi bahu bha~ti giri kandara~ suni sampati || bahera hoi dekhi bahu kisa| mohi ahara dinha jagadisa
    || aju sabahi kaha~ bhacchana karu~| dina bahu cale ahara binu maru~ || kabahu~ na mila bhari udara
    ahara| aju dinha bidhi ekahim bara || darape gidha bacana suni kana| aba bha marana satya hama jana
    || kapi saba uthe gidha kaha~ dekhi| jamavanta mana soca biseshi || kaha angada bicari mana mahim|
    dhanya jatayu sama kau nahim || rama kaja karana tanu tyagi | hari pura gayu parama bara bhagi ||
    suni khaga harasha soka juta bani | ava nikata kapinha bhaya mani || tinhahi abhaya kari puchesi jai|
    katha sakala tinha tahi sunai || suni sampati bandhu kai karani| raghupati mahima badhubidhi barani
    || do mohi lai jahu sindhutata deu~ tilanjali tahi | bacana sahai karavi maim paihahu khojahu jahi
    || || anuja kriya kari sagara tira| kahi nija katha sunahu kapi bira || hama dvau bandhu prathama
    tarunai | gagana ge rabi nikata udai || teja na sahi saka so phiri ava | mai abhimani rabi niarava
    || jare pankha ati teja apara | pareu~ bhumi kari ghora cikara || muni eka nama candrama ohi| lagi
    daya dekhi kari mohi || bahu prakara temhi gyana sunava | dehi janita abhimani charaava || treta~
    brahma manuja tanu dharihi| tasu nari nisicara pati harihi || tasu khoja pathihi prabhu duta| tinhahi
    milem taim hoba punita || jamihahim pankha karasi jani cinta | tinhahi dekhai dehesu taim sita ||
    muni ki gira satya bhi aju | suni mama bacana karahu prabhu kaju || giri trikuta upara basa lanka
    | taha~ raha ravana sahaja asanka || taha~ asoka upabana jaha~ rahi || sita baithi soca rata ahi ||
    do maim dekhu~ tumha nahi gighahi dashti apara || budha bhayu~ na ta karateu~ kachuka sahaya tumhara
    || || jo naghi sata jojana sagara | kari so rama kaja mati agara || mohi biloki dharahu mana dhira
    | rama kripa~ kasa bhayu sarira || papiu ja kara nama sumirahim| ati apara bhavasagara tarahim ||
    tasu duta tumha taji kadarai| rama hridaya~ dhari karahu upai || asa kahi garura gidha jaba gayu|
    tinha kem mana ati bisamaya bhayu || nija nija bala saba kahu~ bhasha| para jai kara samsaya rakha
    || jaratha bhayu~ aba kahi richesa| nahim tana raha prathama bala lesa || jabahim tribikrama bhe kharari|
    taba maim taruna raheu~ bala bhari || do bali ba~dhata prabhu badheu so tanu barani na jai| ubhaya
    dhari maha~ dinhi sata pradacchina dhai || || angada kahi jau~ maim para| jiya~ samsaya kachu phirati
    bara || jamavanta kaha tumha saba layaka| pathia kimi saba hi kara nayaka || kahi richapati sunu hanumana|
    ka cupa sadhi rahehu balavana || pavana tanaya bala pavana samana| budhi bibeka bigyana nidhana ||
    kavana so kaja kathina jaga mahim| jo nahim hoi tata tumha pahim || rama kaja lagi taba avatara| sunatahim
    bhayu parvatakara || kanaka barana tana teja biraja| manahu apara girinha kara raja || simhanada kari
    barahim bara| lilahim nashu~ jalanidhi khara || sahita sahaya ravanahi mari| anu~ iha~ trikuta upari
    || jamavanta maim pu~chu~ tohi| ucita sikhavanu dijahu mohi || etana karahu tata tumha jai| sitahi
    dekhi kahahu sudhi ai || taba nija bhuja bala rajiva naina| kautuka lagi sanga kapi sena || cham kapi
    sena sanga sa~ghari nisicara ramu sitahi anihaim| trailoka pavana sujasu sura muni naradadi bakhanihaim
    || jo sunata gavata kahata samujhata parama pada nara pavi| raghubira pada pathoja madhukara dasa
    tulasi gavi || do bhava bheshaja raghunatha jasu sunahi je nara aru nari| tinha kara sakala manoratha
    siddha karihi trisirari || nilotpala tana syama kama koti sobha adhika| sunia tasu guna grama jasu
    nama agha khaga badhika || teisava~ vishrama iti shrimadramacaritamanase sakalakalikalushavidhvamsane
    caturtha sopanah samaptah| kishkindhakanda samapta
  devanagari: श्रीगणेशाय नमः श्रीजानकीवल्लभो विजयते श्रीरामचरितमानस चतुर्थ सोपान कुन्देन्दीवरसुन्दरावतिबलौ
    विज्ञानधामावुभौ शोभाढ्यौ वरधन्विनौ श्रुतिनुतौ गोविप्रवृन्दप्रियौ। मायामानुषरूपिणौ रघुवरौ सद्धर्मवर्मौं
    हितौ सीतान्वेषणतत्परौ पथिगतौ भक्तिप्रदौ तौ हि नः ॥ ॥ ब्रह्माम्भोधिसमुद्भवं कलिमलप्रध्वंसनं चाव्ययं
    श्रीमच्छम्भुमुखेन्दुसुन्दरवरे संशोभितं सर्वदा। संसारामयभेषजं सुखकरं श्रीजानकीजीवनं धन्यास्ते कृतिनः
    पिबन्ति सततं श्रीरामनामामृतम् ॥ मुक्ति जन्म महि जानि ग्यान खानि अघ हानि कर जहँ बस सम्भु भवानि सो कासी
    सेइअ कस न ॥ जरत सकल सुर बृन्द बिषम गरल जेहिं पान किय। तेहि न भजसि मन मन्द को कृपाल सङ्कर सरिस ॥ आगें
    चले बहुरि रघुराया। रिष्यमूक परवत निअराया ॥ तहँ रह सचिव सहित सुग्रीवा। आवत देखि अतुल बल सींवा ॥ अति
    सभीत कह सुनु हनुमाना। पुरुष जुगल बल रूप निधाना ॥ धरि बटु रूप देखु तैं जाई। कहेसु जानि जियँ सयन बुझाई
    ॥ पठे बालि होहिं मन मैला। भागौं तुरत तजौं यह सैला ॥ बिप्र रूप धरि कपि तहँ गयू। माथ नाइ पूछत अस भयू
    ॥ को तुम्ह स्यामल गौर सरीरा। छत्री रूप फिरहु बन बीरा ॥ कठिन भूमि कोमल पद गामी। कवन हेतु बिचरहु बन
    स्वामी ॥ मृदुल मनोहर सुन्दर गाता। सहत दुसह बन आतप बाता ॥ की तुम्ह तीनि देव महँ कोऊ। नर नारायन की तुम्ह
    दोऊ ॥ दो जग कारन तारन भव भञ्जन धरनी भार। की तुम्ह अकिल भुवन पति लीन्ह मनुज अवतार ॥ ॥ कोसलेस दसरथ के
    जाए । हम पितु बचन मानि बन आए ॥ नाम राम लछिमन दू भाई। सङ्ग नारि सुकुमारि सुहाई ॥ इहाँ हरि निसिचर बैदेही।
    बिप्र फिरहिं हम खोजत तेही ॥ आपन चरित कहा हम गाई। कहहु बिप्र निज कथा बुझाई ॥ प्रभु पहिचानि परेउ गहि
    चरना। सो सुख उमा नहिं बरना ॥ पुलकित तन मुख आव न बचना। देखत रुचिर बेष कै रचना ॥ पुनि धीरजु धरि अस्तुति
    कीन्ही। हरष हृदयँ निज नाथहि चीन्ही ॥ मोर न्याउ मैं पूछा साईं। तुम्ह पूछहु कस नर की नाईम् ॥ तव माया
    बस फिरुँ भुलाना। ता ते मैं नहिं प्रभु पहिचाना ॥ दो एकु मैं मन्द मोहबस कुटिल हृदय अग्यान। पुनि प्रभु
    मोहि बिसारेउ दीनबन्धु भगवान ॥ ॥ जदपि नाथ बहु अवगुन मोरें। सेवक प्रभुहि परै जनि भोरेम् ॥ नाथ जीव तव
    मायाँ मोहा। सो निस्तरि तुम्हारेहिं छोहा ॥ ता पर मैं रघुबीर दोहाई। जानुँ नहिं कछु भजन उपाई ॥ सेवक सुत
    पति मातु भरोसें। रहि असोच बनि प्रभु पोसेम् ॥ अस कहि परेउ चरन अकुलाई। निज तनु प्रगटि प्रीति उर छाई
    ॥ तब रघुपति उठाइ उर लावा। निज लोचन जल सीञ्चि जुड़आवा ॥ सुनु कपि जियँ मानसि जनि ऊना। तैं मम प्रिय लछिमन
    ते दूना ॥ समदरसी मोहि कह सब कोऊ। सेवक प्रिय अनन्यगति सोऊ ॥ दो सो अनन्य जाकें असि मति न टरि हनुमन्त।
    मैं सेवक सचराचर रूप स्वामि भगवन्त ॥ ॥ देखि पवन सुत पति अनुकूला। हृदयँ हरष बीती सब सूला ॥ नाथ सैल पर
    कपिपति रही। सो सुग्रीव दास तव अही ॥ तेहि सन नाथ मयत्री कीजे। दीन जानि तेहि अभय करीजे ॥ सो सीता कर
    खोज कराइहि। जहँ तहँ मरकट कोटि पठाइहि ॥ एहि बिधि सकल कथा समुझाई। लिए दुऔ जन पीठि चढ़आई ॥ जब सुग्रीवँ
    राम कहुँ देखा। अतिसय जन्म धन्य करि लेखा ॥ सादर मिलेउ नाइ पद माथा। भैण्टेउ अनुज सहित रघुनाथा ॥ कपि
    कर मन बिचार एहि रीती। करिहहिं बिधि मो सन ए प्रीती ॥ दो तब हनुमन्त उभय दिसि की सब कथा सुनाइ ॥ पावक
    साखी देइ करि जोरी प्रीती दृढ़आइ ॥ ॥ कीन्ही प्रीति कछु बीच न राखा। लछमिन राम चरित सब भाषा ॥ कह सुग्रीव
    नयन भरि बारी। मिलिहि नाथ मिथिलेसकुमारी ॥ मन्त्रिन्ह सहित इहाँ एक बारा। बैठ रहेउँ मैं करत बिचारा ॥
    गगन पन्थ देखी मैं जाता। परबस परी बहुत बिलपाता ॥ राम राम हा राम पुकारी। हमहि देखि दीन्हेउ पट डारी ॥
    मागा राम तुरत तेहिं दीन्हा। पट उर लाइ सोच अति कीन्हा ॥ कह सुग्रीव सुनहु रघुबीरा। तजहु सोच मन आनहु
    धीरा ॥ सब प्रकार करिहुँ सेवकाई। जेहि बिधि मिलिहि जानकी आई ॥ दो सखा बचन सुनि हरषे कृपासिधु बलसींव।
    कारन कवन बसहु बन मोहि कहहु सुग्रीव ॥ ॥ नात बालि अरु मैं द्वौ भाई। प्रीति रही कछु बरनि न जाई ॥ मय सुत
    मायावी तेहि न् ँ। आवा सो प्रभु हमरें ग् ँ ॥ अर्ध राति पुर द्वार पुकारा। बाली रिपु बल सहै न पारा ॥
    धावा बालि देखि सो भागा। मैं पुनि गयुँ बन्धु सँग लागा ॥ गिरिबर गुहाँ पैठ सो जाई। तब बालीं मोहि कहा
    बुझाई ॥ परिखेसु मोहि एक पखवारा। नहिं आवौं तब जानेसु मारा ॥ मास दिवस तहँ रहेउँ खरारी। निसरी रुधिर धार
    तहँ भारी ॥ बालि हतेसि मोहि मारिहि आई। सिला देइ तहँ चलेउँ पराई ॥ मन्त्रिन्ह पुर देखा बिनु साईं। दीन्हेउ
    मोहि राज बरिआई ॥ बालि ताहि मारि गृह आवा। देखि मोहि जियँ भेद बढ़आवा ॥ रिपु सम मोहि मारेसि अति भारी।
    हरि लीन्हेसि सर्बसु अरु नारी ॥ ताकें भय रघुबीर कृपाला। सकल भुवन मैं फिरेउँ बिहाला ॥ इहाँ साप बस आवत
    नाहीं। तदपि सभीत रहुँ मन माहीँ ॥ सुनि सेवक दुख दीनदयाला। फरकि उठीं द्वै भुजा बिसाला ॥ दो सुनु सुग्रीव
    मारिहुँ बालिहि एकहिं बान। ब्रह्म रुद्र सरनागत गेँ न उबरिहिं प्रान ॥ ॥ जे न मित्र दुख होहिं दुखारी।
    तिन्हहि बिलोकत पातक भारी ॥ निज दुख गिरि सम रज करि जाना। मित्रक दुख रज मेरु समाना ॥ जिन्ह कें असि मति
    सहज न आई। ते सठ कत हठि करत मिताई ॥ कुपथ निवारि सुपन्थ चलावा। गुन प्रगटे अवगुनन्हि दुरावा ॥ देत लेत
    मन सङ्क न धरी। बल अनुमान सदा हित करी ॥ बिपति काल कर सतगुन नेहा। श्रुति कह सन्त मित्र गुन एहा ॥ आगें
    कह मृदु बचन बनाई। पाछें अनहित मन कुटिलाई ॥ जा कर चित अहि गति सम भाई। अस कुमित्र परिहरेहि भलाई ॥ सेवक
    सठ नृप कृपन कुनारी। कपटी मित्र सूल सम चारी ॥ सखा सोच त्यागहु बल मोरें। सब बिधि घटब काज मैं तोरेम्
    ॥ कह सुग्रीव सुनहु रघुबीरा। बालि महाबल अति रनधीरा ॥ दुन्दुभी अस्थि ताल देखराए। बिनु प्रयास रघुनाथ
    ढहाए ॥ देखि अमित बल बाढ़ई प्रीती। बालि बधब इन्ह भि परतीती ॥ बार बार नावि पद सीसा। प्रभुहि जानि मन
    हरष कपीसा ॥ उपजा ग्यान बचन तब बोला। नाथ कृपाँ मन भयु अलोला ॥ सुख सम्पति परिवार बड़आई। सब परिहरि करिहुँ
    सेवकाई ॥ ए सब रामभगति के बाधक। कहहिं सन्त तब पद अवराधक ॥ सत्रु मित्र सुख दुख जग माहीं। माया कृत परमारथ
    नाहीम् ॥ बालि परम हित जासु प्रसादा। मिलेहु राम तुम्ह समन बिषादा ॥ सपनें जेहि सन होइ लराई। जागें समुझत
    मन सकुचाई ॥ अब प्रभु कृपा करहु एहि भाँती। सब तजि भजनु करौं दिन राती ॥ सुनि बिराग सञ्जुत कपि बानी।
    बोले बिहँसि रामु धनुपानी ॥ जो कछु कहेहु सत्य सब सोई। सखा बचन मम मृषा न होई ॥ नट मरकट इव सबहि नचावत।
    रामु खगेस बेद अस गावत ॥ लै सुग्रीव सङ्ग रघुनाथा। चले चाप सायक गहि हाथा ॥ तब रघुपति सुग्रीव पठावा।
    गर्जेसि जाइ निकट बल पावा ॥ सुनत बालि क्रोधातुर धावा। गहि कर चरन नारि समुझावा ॥ सुनु पति जिन्हहि मिलेउ
    सुग्रीवा। ते द्वौ बन्धु तेज बल सींवा ॥ कोसलेस सुत लछिमन रामा। कालहु जीति सकहिं सङ्ग्रामा ॥ दो कह बालि
    सुनु भीरु प्रिय समदरसी रघुनाथ। जौं कदाचि मोहि मारहिं तौ पुनि हौँ सनाथ ॥ ॥ अस कहि चला महा अभिमानी।
    तृन समान सुग्रीवहि जानी ॥ भिरे उभौ बाली अति तर्जा । मुठिका मारि महाधुनि गर्जा ॥ तब सुग्रीव बिकल होइ
    भागा। मुष्टि प्रहार बज्र सम लागा ॥ मैं जो कहा रघुबीर कृपाला। बन्धु न होइ मोर यह काला ॥ एकरूप तुम्ह
    भ्राता दोऊ। तेहि भ्रम तें नहिं मारेउँ सोऊ ॥ कर परसा सुग्रीव सरीरा। तनु भा कुलिस गी सब पीरा ॥ मेली
    कण्ठ सुमन कै माला। पठवा पुनि बल देइ बिसाला ॥ पुनि नाना बिधि भी लराई। बिटप ओट देखहिं रघुराई ॥ दो बहु
    छल बल सुग्रीव कर हियँ हारा भय मानि। मारा बालि राम तब हृदय माझ सर तानि ॥ ॥ परा बिकल महि सर के लागें।
    पुनि उठि बैठ देखि प्रभु आगेम् ॥ स्याम गात सिर जटा बनाएँ। अरुन नयन सर चाप चढ़आएँ ॥ पुनि पुनि चिति चरन
    चित दीन्हा। सुफल जन्म माना प्रभु चीन्हा ॥ हृदयँ प्रीति मुख बचन कठोरा। बोला चिति राम की ओरा ॥ धर्म
    हेतु अवतरेहु गोसाई। मारेहु मोहि ब्याध की नाई ॥ मैं बैरी सुग्रीव पिआरा। अवगुन कबन नाथ मोहि मारा ॥ अनुज
    बधू भगिनी सुत नारी। सुनु सठ कन्या सम ए चारी ॥ इन्हहि कुद्दष्टि बिलोकि जोई। ताहि बधें कछु पाप न होई
    ॥ मुढ़ तोहि अतिसय अभिमाना। नारि सिखावन करसि न काना ॥ मम भुज बल आश्रित तेहि जानी। मारा चहसि अधम अभिमानी
    ॥ दो सुनहु राम स्वामी सन चल न चातुरी मोरि। प्रभु अजहूँ मैं पापी अन्तकाल गति तोरि ॥ ॥ सुनत राम अति
    कोमल बानी। बालि सीस परसेउ निज पानी ॥ अचल करौं तनु राखहु प्राना। बालि कहा सुनु कृपानिधाना ॥ जन्म जन्म
    मुनि जतनु कराहीं। अन्त राम कहि आवत नाहीम् ॥ जासु नाम बल सङ्कर कासी। देत सबहि सम गति अविनासी ॥ मम लोचन
    गोचर सोइ आवा। बहुरि कि प्रभु अस बनिहि बनावा ॥ छं सो नयन गोचर जासु गुन नित नेति कहि श्रुति गावहीं।
    जिति पवन मन गो निरस करि मुनि ध्यान कबहुँक पावहीम् ॥ मोहि जानि अति अभिमान बस प्रभु कहेउ राखु सरीरही।
    अस कवन सठ हठि काटि सुरतरु बारि करिहि बबूरही ॥ ॥ अब नाथ करि करुना बिलोकहु देहु जो बर मागूँ। जेहिं जोनि
    जन्मौं कर्म बस तहँ राम पद अनुरागूँ ॥ यह तनय मम सम बिनय बल कल्यानप्रद प्रभु लीजिऐ। गहि बाहँ सुर नर
    नाह आपन दास अङ्गद कीजिऐ ॥ राम चरन दृढ़ प्रीति करि बालि कीन्ह तनु त्याग। सुमन माल जिमि कण्ठ ते गिरत
    न जानि नाग ॥ ॥ राम बालि निज धाम पठावा। नगर लोग सब ब्याकुल धावा ॥ नाना बिधि बिलाप कर तारा। छूटे केस
    न देह सँभारा ॥ तारा बिकल देखि रघुराया । दीन्ह ग्यान हरि लीन्ही माया ॥ छिति जल पावक गगन समीरा। पञ्च
    रचित अति अधम सरीरा ॥ प्रगट सो तनु तव आगें सोवा। जीव नित्य केहि लगि तुम्ह रोवा ॥ उपजा ग्यान चरन तब
    लागी। लीन्हेसि परम भगति बर मागी ॥ उमा दारु जोषित की नाई। सबहि नचावत रामु गोसाई ॥ तब सुग्रीवहि आयसु
    दीन्हा। मृतक कर्म बिधिबत सब कीन्हा ॥ राम कहा अनुजहि समुझाई। राज देहु सुग्रीवहि जाई ॥ रघुपति चरन नाइ
    करि माथा। चले सकल प्रेरित रघुनाथा ॥ दो लछिमन तुरत बोलाए पुरजन बिप्र समाज। राजु दीन्ह सुग्रीव कहँ अङ्गद
    कहँ जुबराज ॥ ॥ उमा राम सम हित जग माहीं। गुरु पितु मातु बन्धु प्रभु नाहीम् ॥ सुर नर मुनि सब कै यह रीती।
    स्वारथ लागि करहिं सब प्रीती ॥ बालि त्रास ब्याकुल दिन राती। तन बहु ब्रन चिन्ताँ जर छाती ॥ सोइ सुग्रीव
    कीन्ह कपिर् । अति कृपाल रघुबीर सुभ् ॥ जानतहुँ अस प्रभु परिहरहीं। काहे न बिपति जाल नर परहीम् ॥ पुनि
    सुग्रीवहि लीन्ह बोलाई। बहु प्रकार नृपनीति सिखाई ॥ कह प्रभु सुनु सुग्रीव हरीसा। पुर न जाउँ दस चारि
    बरीसा ॥ गत ग्रीषम बरषा रितु आई। रहिहुँ निकट सैल पर छाई ॥ अङ्गद सहित करहु तुम्ह राजू। सन्तत हृदय धरेहु
    मम काजू ॥ जब सुग्रीव भवन फिरि आए। रामु प्रबरषन गिरि पर छाए ॥ दो प्रथमहिं देवन्ह गिरि गुहा राखेउ रुचिर
    बनाइ। राम कृपानिधि कछु दिन बास करहिङ्गे आइ ॥ ॥ सुन्दर बन कुसुमित अति सोभा। गुञ्जत मधुप निकर मधु लोभा
    ॥ कन्द मूल फल पत्र सुहाए। भे बहुत जब ते प्रभु आए ॥ देखि मनोहर सैल अनूपा। रहे तहँ अनुज सहित सुरभूपा
    ॥ मधुकर खग मृग तनु धरि देवा। करहिं सिद्ध मुनि प्रभु कै सेवा ॥ मङ्गलरुप भयु बन तब ते । कीन्ह निवास
    रमापति जब ते ॥ फटिक सिला अति सुभ्र सुहाई। सुख आसीन तहाँ द्वौ भाई ॥ कहत अनुज सन कथा अनेका। भगति बिरति
    नृपनीति बिबेका ॥ बरषा काल मेघ नभ छाए। गरजत लागत परम सुहाए ॥ दो लछिमन देखु मोर गन नाचत बारिद पैखि।
    गृही बिरति रत हरष जस बिष्नु भगत कहुँ देखि ॥ ॥ घन घमण्ड नभ गरजत घोरा। प्रिया हीन डरपत मन मोरा ॥ दामिनि
    दमक रह न घन माहीं। खल कै प्रीति जथा थिर नाहीम् ॥ बरषहिं जलद भूमि निअराएँ। जथा नवहिं बुध बिद्या पाएँ
    ॥ बूँद अघात सहहिं गिरि कैंसेम् । खल के बचन सन्त सह जैसेम् ॥ छुद्र नदीं भरि चलीं तोराई। जस थोरेहुँ
    धन खल इतराई ॥ भूमि परत भा ढाबर पानी। जनु जीवहि माया लपटानी ॥ समिटि समिटि जल भरहिं तलावा। जिमि सदगुन
    सज्जन पहिं आवा ॥ सरिता जल जलनिधि महुँ जाई। होई अचल जिमि जिव हरि पाई ॥ दो हरित भूमि तृन सङ्कुल समुझि
    परहिं नहिं पन्थ। जिमि पाखण्ड बाद तें गुप्त होहिं सदग्रन्थ ॥ ॥ दादुर धुनि चहु दिसा सुहाई। बेद पढ़हिं
    जनु बटु समुदाई ॥ नव पल्लव भे बिटप अनेका। साधक मन जस मिलें बिबेका ॥ अर्क जबास पात बिनु भयू। जस सुराज
    खल उद्यम गयू ॥ खोजत कतहुँ मिलि नहिं धूरी। करि क्रोध जिमि धरमहि दूरी ॥ ससि सम्पन्न सोह महि कैसी। उपकारी
    कै सम्पति जैसी ॥ निसि तम घन खद्योत बिराजा। जनु दम्भिन्ह कर मिला समाजा ॥ महाबृष्टि चलि फूटि किआरीम्
    । जिमि सुतन्त्र भेँ बिगरहिं नारीम् ॥ कृषी निरावहिं चतुर किसाना। जिमि बुध तजहिं मोह मद माना ॥ देखिअत
    चक्रबाक खग नाहीं। कलिहि पाइ जिमि धर्म पराहीम् ॥ ऊषर बरषि तृन नहिं जामा। जिमि हरिजन हियँ उपज न कामा
    ॥ बिबिध जन्तु सङ्कुल महि भ्राजा। प्रजा बाढ़ जिमि पाइ सुराजा ॥ जहँ तहँ रहे पथिक थकि नाना। जिमि इन्द्रिय
    गन उपजें ग्याना ॥ दो कबहुँ प्रबल बह मारुत जहँ तहँ मेघ बिलाहिं। जिमि कपूत के उपजें कुल सद्धर्म नसाहिम्
    ॥ ॥ कबहुँ दिवस महँ निबिड़ तम कबहुँक प्रगट पतङ्ग। बिनसि उपजि ग्यान जिमि पाइ कुसङ्ग सुसङ्ग ॥ ॥ बरषा
    बिगत सरद रितु आई। लछिमन देखहु परम सुहाई ॥ फूलें कास सकल महि छाई। जनु बरषाँ कृत प्रगट बुढ़आई ॥ उदित
    अगस्ति पन्थ जल सोषा। जिमि लोभहि सोषि सन्तोषा ॥ सरिता सर निर्मल जल सोहा। सन्त हृदय जस गत मद मोहा ॥
    रस रस सूख सरित सर पानी। ममता त्याग करहिं जिमि ग्यानी ॥ जानि सरद रितु खञ्जन आए। पाइ समय जिमि सुकृत
    सुहाए ॥ पङ्क न रेनु सोह असि धरनी। नीति निपुन नृप कै जसि करनी ॥ जल सङ्कोच बिकल भिँ मीना। अबुध कुटुम्बी
    जिमि धनहीना ॥ बिनु धन निर्मल सोह अकासा। हरिजन इव परिहरि सब आसा ॥ कहुँ कहुँ बृष्टि सारदी थोरी। कौ एक
    पाव भगति जिमि मोरी ॥ दो चले हरषि तजि नगर नृप तापस बनिक भिखारि। जिमि हरिभगत पाइ श्रम तजहि आश्रमी चारि
    ॥ ॥ सुखी मीन जे नीर अगाधा। जिमि हरि सरन न एकु बाधा ॥ फूलें कमल सोह सर कैसा। निर्गुन ब्रह्म सगुन भेँ
    जैसा ॥ गुञ्जत मधुकर मुखर अनूपा। सुन्दर खग रव नाना रूपा ॥ चक्रबाक मन दुख निसि पैखी। जिमि दुर्जन पर
    सम्पति देखी ॥ चातक रटत तृषा अति ओही। जिमि सुख लहि न सङ्करद्रोही ॥ सरदातप निसि ससि अपहरी। सन्त दरस
    जिमि पातक टरी ॥ देखि इन्दु चकोर समुदाई। चितवतहिं जिमि हरिजन हरि पाई ॥ मसक दंस बीते हिम त्रासा। जिमि
    द्विज द्रोह किएँ कुल नासा ॥ दो भूमि जीव सङ्कुल रहे गे सरद रितु पाइ। सदगुर मिले जाहिं जिमि संसय भ्रम
    समुदाइ ॥ ॥ बरषा गत निर्मल रितु आई। सुधि न तात सीता कै पाई ॥ एक बार कैसेहुँ सुधि जानौं। कालहु जीत निमिष
    महुँ आनौम् ॥ कतहुँ रहु जौं जीवति होई। तात जतन करि आनेउँ सोई ॥ सुग्रीवहुँ सुधि मोरि बिसारी। पावा राज
    कोस पुर नारी ॥ जेहिं सायक मारा मैं बाली। तेहिं सर हतौं मूढ़ कहँ काली ॥ जासु कृपाँ छूटहीं मद मोहा।
    ता कहुँ उमा कि सपनेहुँ कोहा ॥ जानहिं यह चरित्र मुनि ग्यानी। जिन्ह रघुबीर चरन रति मानी ॥ लछिमन क्रोधवन्त
    प्रभु जाना। धनुष चढ़आइ गहे कर बाना ॥ दो तब अनुजहि समुझावा रघुपति करुना सींव ॥ भय देखाइ लै आवहु तात
    सखा सुग्रीव ॥ ॥ इहाँ पवनसुत हृदयँ बिचारा। राम काजु सुग्रीवँ बिसारा ॥ निकट जाइ चरनन्हि सिरु नावा। चारिहु
    बिधि तेहि कहि समुझावा ॥ सुनि सुग्रीवँ परम भय माना। बिषयँ मोर हरि लीन्हेउ ग्याना ॥ अब मारुतसुत दूत
    समूहा। पठवहु जहँ तहँ बानर जूहा ॥ कहहु पाख महुँ आव न जोई। मोरें कर ता कर बध होई ॥ तब हनुमन्त बोलाए
    दूता। सब कर करि सनमान बहूता ॥ भय अरु प्रीति नीति देखाई। चले सकल चरनन्हि सिर नाई ॥ एहि अवसर लछिमन पुर
    आए। क्रोध देखि जहँ तहँ कपि धाए ॥ दो धनुष चढ़आइ कहा तब जारि करुँ पुर छार। ब्याकुल नगर देखि तब आयु बालिकुमार
    ॥ ॥ चरन नाइ सिरु बिनती कीन्ही। लछिमन अभय बाँह तेहि दीन्ही ॥ क्रोधवन्त लछिमन सुनि काना। कह कपीस अति
    भयँ अकुलाना ॥ सुनु हनुमन्त सङ्ग लै तारा। करि बिनती समुझाउ कुमारा ॥ तारा सहित जाइ हनुमाना। चरन बन्दि
    प्रभु सुजस बखाना ॥ करि बिनती मन्दिर लै आए। चरन पखारि पलँग बैठाए ॥ तब कपीस चरनन्हि सिरु नावा। गहि भुज
    लछिमन कण्ठ लगावा ॥ नाथ बिषय सम मद कछु नाहीं। मुनि मन मोह करि छन माहीम् ॥ सुनत बिनीत बचन सुख पावा।
    लछिमन तेहि बहु बिधि समुझावा ॥ पवन तनय सब कथा सुनाई। जेहि बिधि गे दूत समुदाई ॥ दो हरषि चले सुग्रीव
    तब अङ्गदादि कपि साथ। रामानुज आगें करि आए जहँ रघुनाथ ॥ ॥ नाइ चरन सिरु कह कर जोरी। नाथ मोहि कछु नाहिन
    खोरी ॥ अतिसय प्रबल देव तब माया। छूटि राम करहु जौं दाया ॥ बिषय बस्य सुर नर मुनि स्वामी। मैं पावँर पसु
    कपि अति कामी ॥ नारि नयन सर जाहि न लागा। घोर क्रोध तम निसि जो जागा ॥ लोभ पाँस जेहिं गर न बँधाया। सो
    नर तुम्ह समान रघुराया ॥ यह गुन साधन तें नहिं होई। तुम्हरी कृपाँ पाव कोइ कोई ॥ तब रघुपति बोले मुसकाई।
    तुम्ह प्रिय मोहि भरत जिमि भाई ॥ अब सोइ जतनु करहु मन लाई। जेहि बिधि सीता कै सुधि पाई ॥ दो एहि बिधि
    होत बतकही आए बानर जूथ। नाना बरन सकल दिसि देखिअ कीस बरुथ ॥ ॥ बानर कटक उमा में देखा। सो मूरुख जो करन
    चह लेखा ॥ आइ राम पद नावहिं माथा। निरखि बदनु सब होहिं सनाथा ॥ अस कपि एक न सेना माहीं। राम कुसल जेहि
    पूछी नाहीम् ॥ यह कछु नहिं प्रभु कि अधिकाई। बिस्वरूप ब्यापक रघुराई ॥ ठाढ़ए जहँ तहँ आयसु पाई। कह सुग्रीव
    सबहि समुझाई ॥ राम काजु अरु मोर निहोरा। बानर जूथ जाहु चहुँ ओरा ॥ जनकसुता कहुँ खोजहु जाई। मास दिवस महँ
    आएहु भाई ॥ अवधि मेटि जो बिनु सुधि पाएँ। आवि बनिहि सो मोहि मराएँ ॥ दो बचन सुनत सब बानर जहँ तहँ चले
    तुरन्त । तब सुग्रीवँ बोलाए अङ्गद नल हनुमन्त ॥ ॥ सुनहु नील अङ्गद हनुमाना। जामवन्त मतिधीर सुजाना ॥ सकल
    सुभट मिलि दच्छिन जाहू। सीता सुधि पूँछेउ सब काहू ॥ मन क्रम बचन सो जतन बिचारेहु। रामचन्द्र कर काजु सँवारेहु
    ॥ भानु पीठि सेइअ उर आगी। स्वामिहि सर्ब भाव छल त्यागी ॥ तजि माया सेइअ परलोका। मिटहिं सकल भव सम्भव सोका
    ॥ देह धरे कर यह फलु भाई। भजिअ राम सब काम बिहाई ॥ सोइ गुनग्य सोई बड़भागी । जो रघुबीर चरन अनुरागी ॥
    आयसु मागि चरन सिरु नाई। चले हरषि सुमिरत रघुराई ॥ पाछें पवन तनय सिरु नावा। जानि काज प्रभु निकट बोलावा
    ॥ परसा सीस सरोरुह पानी। करमुद्रिका दीन्हि जन जानी ॥ बहु प्रकार सीतहि समुझाएहु। कहि बल बिरह बेगि तुम्ह
    आएहु ॥ हनुमत जन्म सुफल करि माना। चलेउ हृदयँ धरि कृपानिधाना ॥ जद्यपि प्रभु जानत सब बाता। राजनीति राखत
    सुरत्राता ॥ दो चले सकल बन खोजत सरिता सर गिरि खोह। राम काज लयलीन मन बिसरा तन कर छोह ॥ ॥ कतहुँ होइ निसिचर
    सैं भेटा। प्रान लेहिं एक एक चपेटा ॥ बहु प्रकार गिरि कानन हेरहिं। कौ मुनि मिलत ताहि सब घेरहिम् ॥ लागि
    तृषा अतिसय अकुलाने। मिलि न जल घन गहन भुलाने ॥ मन हनुमान कीन्ह अनुमाना। मरन चहत सब बिनु जल पाना ॥ चढ़इ
    गिरि सिखर चहूँ दिसि देखा। भूमि बिबिर एक कौतुक पेखा ॥ चक्रबाक बक हंस उड़आहीं। बहुतक खग प्रबिसहिं तेहि
    माहीम् ॥ गिरि ते उतरि पवनसुत आवा। सब कहुँ लै सोइ बिबर देखावा ॥ आगें कै हनुमन्तहि लीन्हा। पैठे बिबर
    बिलम्बु न कीन्हा ॥ दो दीख जाइ उपवन बर सर बिगसित बहु कञ्ज। मन्दिर एक रुचिर तहँ बैठि नारि तप पुञ्ज ॥
    ॥ दूरि ते ताहि सबन्हि सिर नावा। पूछें निज बृत्तान्त सुनावा ॥ तेहिं तब कहा करहु जल पाना। खाहु सुरस
    सुन्दर फल नाना ॥ मज्जनु कीन्ह मधुर फल खाए। तासु निकट पुनि सब चलि आए ॥ तेहिं सब आपनि कथा सुनाई। मैं
    अब जाब जहाँ रघुराई ॥ मूदहु नयन बिबर तजि जाहू। पैहहु सीतहि जनि पछिताहू ॥ नयन मूदि पुनि देखहिं बीरा।
    ठाढ़ए सकल सिन्धु कें तीरा ॥ सो पुनि गी जहाँ रघुनाथा। जाइ कमल पद नाएसि माथा ॥ नाना भाँति बिनय तेहिं
    कीन्ही। अनपायनी भगति प्रभु दीन्ही ॥ दो बदरीबन कहुँ सो गी प्रभु अग्या धरि सीस । उर धरि राम चरन जुग
    जे बन्दत अज ईस ॥ ॥ इहाँ बिचारहिं कपि मन माहीं। बीती अवधि काज कछु नाहीम् ॥ सब मिलि कहहिं परस्पर बाता।
    बिनु सुधि लेँ करब का भ्राता ॥ कह अङ्गद लोचन भरि बारी। दुहुँ प्रकार भि मृत्यु हमारी ॥ इहाँ न सुधि सीता
    कै पाई। उहाँ गेँ मारिहि कपिराई ॥ पिता बधे पर मारत मोही। राखा राम निहोर न ओही ॥ पुनि पुनि अङ्गद कह
    सब पाहीं। मरन भयु कछु संसय नाहीम् ॥ अङ्गद बचन सुनत कपि बीरा। बोलि न सकहिं नयन बह नीरा ॥ छन एक सोच
    मगन होइ रहे। पुनि अस वचन कहत सब भे ॥ हम सीता कै सुधि लिन्हें बिना। नहिं जैंहैं जुबराज प्रबीना ॥ अस
    कहि लवन सिन्धु तट जाई। बैठे कपि सब दर्भ डसाई ॥ जामवन्त अङ्गद दुख देखी। कहिं कथा उपदेस बिसेषी ॥ तात
    राम कहुँ नर जनि मानहु। निर्गुन ब्रह्म अजित अज जानहु ॥ दो निज इच्छा प्रभु अवतरि सुर महि गो द्विज लागि।
    सगुन उपासक सङ्ग तहँ रहहिं मोच्छ सब त्यागि ॥ ॥ एहि बिधि कथा कहहि बहु भाँती गिरि कन्दराँ सुनी सम्पाती
    ॥ बाहेर होइ देखि बहु कीसा। मोहि अहार दीन्ह जगदीसा ॥ आजु सबहि कहँ भच्छन करूँ। दिन बहु चले अहार बिनु
    मरूँ ॥ कबहुँ न मिल भरि उदर अहारा। आजु दीन्ह बिधि एकहिं बारा ॥ डरपे गीध बचन सुनि काना। अब भा मरन सत्य
    हम जाना ॥ कपि सब उठे गीध कहँ देखी। जामवन्त मन सोच बिसेषी ॥ कह अङ्गद बिचारि मन माहीं। धन्य जटायू सम
    कौ नाहीम् ॥ राम काज कारन तनु त्यागी । हरि पुर गयु परम बड़ भागी ॥ सुनि खग हरष सोक जुत बानी । आवा निकट
    कपिन्ह भय मानी ॥ तिन्हहि अभय करि पूछेसि जाई। कथा सकल तिन्ह ताहि सुनाई ॥ सुनि सम्पाति बन्धु कै करनी।
    रघुपति महिमा बधुबिधि बरनी ॥ दो मोहि लै जाहु सिन्धुतट देउँ तिलाञ्जलि ताहि । बचन सहाइ करवि मैं पैहहु
    खोजहु जाहि ॥ ॥ अनुज क्रिया करि सागर तीरा। कहि निज कथा सुनहु कपि बीरा ॥ हम द्वौ बन्धु प्रथम तरुनाई
    । गगन गे रबि निकट उडाई ॥ तेज न सहि सक सो फिरि आवा । मै अभिमानी रबि निअरावा ॥ जरे पङ्ख अति तेज अपारा
    । परेउँ भूमि करि घोर चिकारा ॥ मुनि एक नाम चन्द्रमा ओही। लागी दया देखी करि मोही ॥ बहु प्रकार तेंहि
    ग्यान सुनावा । देहि जनित अभिमानी छड़आवा ॥ त्रेताँ ब्रह्म मनुज तनु धरिही। तासु नारि निसिचर पति हरिही
    ॥ तासु खोज पठिहि प्रभू दूता। तिन्हहि मिलें तैं होब पुनीता ॥ जमिहहिं पङ्ख करसि जनि चिन्ता । तिन्हहि
    देखाइ देहेसु तैं सीता ॥ मुनि कि गिरा सत्य भि आजू । सुनि मम बचन करहु प्रभु काजू ॥ गिरि त्रिकूट ऊपर
    बस लङ्का । तहँ रह रावन सहज असङ्का ॥ तहँ असोक उपबन जहँ रही ॥ सीता बैठि सोच रत अही ॥ दो मैं देखुँ तुम्ह
    नाहि गीघहि दष्टि अपार ॥ बूढ भयुँ न त करतेउँ कछुक सहाय तुम्हार ॥ ॥ जो नाघि सत जोजन सागर । करि सो राम
    काज मति आगर ॥ मोहि बिलोकि धरहु मन धीरा । राम कृपाँ कस भयु सरीरा ॥ पापिउ जा कर नाम सुमिरहीं। अति अपार
    भवसागर तरहीम् ॥ तासु दूत तुम्ह तजि कदराई। राम हृदयँ धरि करहु उपाई ॥ अस कहि गरुड़ गीध जब गयू। तिन्ह
    कें मन अति बिसमय भयू ॥ निज निज बल सब काहूँ भाषा। पार जाइ कर संसय राखा ॥ जरठ भयुँ अब कहि रिछेसा। नहिं
    तन रहा प्रथम बल लेसा ॥ जबहिं त्रिबिक्रम भे खरारी। तब मैं तरुन रहेउँ बल भारी ॥ दो बलि बाँधत प्रभु बाढेउ
    सो तनु बरनि न जाई। उभय धरी महँ दीन्ही सात प्रदच्छिन धाइ ॥ ॥ अङ्गद कहि जाउँ मैं पारा। जियँ संसय कछु
    फिरती बारा ॥ जामवन्त कह तुम्ह सब लायक। पठिअ किमि सब ही कर नायक ॥ कहि रीछपति सुनु हनुमाना। का चुप साधि
    रहेहु बलवाना ॥ पवन तनय बल पवन समाना। बुधि बिबेक बिग्यान निधाना ॥ कवन सो काज कठिन जग माहीं। जो नहिं
    होइ तात तुम्ह पाहीम् ॥ राम काज लगि तब अवतारा। सुनतहिं भयु पर्वताकारा ॥ कनक बरन तन तेज बिराजा। मानहु
    अपर गिरिन्ह कर राजा ॥ सिंहनाद करि बारहिं बारा। लीलहीं नाषुँ जलनिधि खारा ॥ सहित सहाय रावनहि मारी। आनुँ
    इहाँ त्रिकूट उपारी ॥ जामवन्त मैं पूँछुँ तोही। उचित सिखावनु दीजहु मोही ॥ एतना करहु तात तुम्ह जाई। सीतहि
    देखि कहहु सुधि आई ॥ तब निज भुज बल राजिव नैना। कौतुक लागि सङ्ग कपि सेना ॥ छं कपि सेन सङ्ग सँघारि निसिचर
    रामु सीतहि आनिहैं। त्रैलोक पावन सुजसु सुर मुनि नारदादि बखानिहैम् ॥ जो सुनत गावत कहत समुझत परम पद नर
    पावी। रघुबीर पद पाथोज मधुकर दास तुलसी गावी ॥ दो भव भेषज रघुनाथ जसु सुनहि जे नर अरु नारि। तिन्ह कर
    सकल मनोरथ सिद्ध करिहि त्रिसिरारि ॥ नीलोत्पल तन स्याम काम कोटि सोभा अधिक। सुनिअ तासु गुन ग्राम जासु
    नाम अघ खग बधिक ॥ तेईसवाँ विश्राम इति श्रीमद्रामचरितमानसे सकलकलिकलुषविध्वंसने चतुर्थ सोपानः समाप्तः।
    किष्किन्धाकाण्ड समाप्त
