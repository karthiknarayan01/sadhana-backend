id: narayaniyam-dashaka-91
category: stotram
name:
  english: Narayaniyam Dashaka 91
content:
  english: shrikrishna tvatpadopasanamabhayatamam baddhamithyarthadrishte rmartyasyartasya manye vyapasarati
    bhayam yena sarvatmanaiva | yattavat tvatpranitaniha bhajanavidhinasthito mohamarge dhavannapyavritakshah
    skhalati na kuhaciddevadevakhilatman || || bhuman kayena vaca muhurapi manasa tvadbalapreritatma yadyat
    kurve samastam tadiha paratare tvayyasavarpayami | jatyapiha shvapakastvayi nihitamanahkarmavagindriyartha
    prano vishvam punite na tu vimukhamanastvatpadadvipravaryah || || bhitirnama dvitiyadbhavati nanu
    manahkalpitam ca dvitiyam tenaikyabhyasashilo hridayamiha yathashakti buddhya nirundhyam | mayaviddhe
    tu tasmin punarapi na tatha bhati mayadhinatham tam tvam bhaktya mahatya satatamanubhajanisha bhitim
    vijahyam || || bhakterutpattivriddhi tava caranajusham sangamenaiva pumsa masadye punyabhajam shriya
    iva jagati shrimatam sangamena | tatsango deva bhuyanmama khalu satatam tanmukhadunmishadbhi stvanmahatmyaprakarairbhavati
    ca sudridha bhaktiruddhutapapa || || shreyomargeshu bhaktavadhikabahumatirjanmakarmani bhuyo gayan
    kshemani namanyapi tadubhayatah pradrutam pradrutatma | udyaddhasah kadacit kuhacidapi rudan kvapi
    garjan pragaya nnunmadiva pranrityannayi kuru karunam lokabahyashcareyam || || bhutanyetani bhutatmakamapi
    sakalam pakshimatsyan mrigadin martyan mitrani shatrunapi yamitamatistvanmayanyanamani | tvatsevayam
    hi siddhyenmama tava kripaya bhaktidardhyam viraga stvattattvasyavabodho'pi ca bhuvanapate yatnabhedam
    vinaiva || || no muhyan kshuttridadyairbhavasaranibhavaistvannilinashayatva ccintasatatyashali nimishalavamapi
    tvatpadadaprakampah | ishtanishteshu tushtivyasanavirahito mayikatvavabodha jjyotsnabhistvannakhendoradhikashishiritenatmana
    sancareyam || || bhuteshveshu tvadaikyasmritisamadhigatau nadhikaro'dhuna ce ttvatprema tvatkamaitri
    jadamatishu kripa dvitsu bhuyadupeksha | arcayam va samarcakutukamurutarashraddhaya vardhatam me tvatsamsevi
    tathapi drutamupalabhate bhaktalokottamatvam || || avritya tvatsvarupam kshitijalamarudadyatmana vikshipanti
    jivan bhuyishthakarmavalivivashagatin duhkhajale kshipanti | tvanmaya mabhibhunmamayi bhuvanapate
    kalpate tatprashantyai tvatpade bhaktirevetyavadadayi vibho siddhayogi prabuddhah || || duhkhanyalokya
    jantushvalamuditaviveko'hamacaryavarya llabdhva tvadrupatattvam gunacaritakathadyudbhavadbhaktibhuma
    | mayamenam taritva paramasukhamaye tvatpade moditahe tasyayam purvarangah pavanapurapate nashayashesharogan
    ||
  devanagari: श्रीकृष्ण त्वत्पदोपासनमभयतमं बद्धमिथ्यार्थदृष्टे र्मर्त्यस्यार्तस्य मन्ये व्यपसरति भयं येन
    सर्वात्मनैव । यत्तावत् त्वत्प्रणीतानिह भजनविधीनास्थितो मोहमार्गे धावन्नप्यावृताक्षः स्खलति न कुहचिद्देवदेवाखिलात्मन्
    ॥ ॥ भूमन् कायेन वाचा मुहुरपि मनसा त्वद्बलप्रेरितात्मा यद्यत् कुर्वे समस्तं तदिह परतरे त्वय्यसावर्पयामि
    । जात्यापीह श्वपाकस्त्वयि निहितमनःकर्मवागिन्द्रियार्थ प्राणो विश्वं पुनीते न तु विमुखमनास्त्वत्पदाद्विप्रवर्यः
    ॥ ॥ भीतिर्नाम द्वितीयाद्भवति ननु मनःकल्पितं च द्वितीयं तेनैक्याभ्यासशीलो हृदयमिह यथाशक्ति बुद्ध्या
    निरुन्ध्याम् । मायाविद्धे तु तस्मिन् पुनरपि न तथा भाति मायाधिनाथं तं त्वां भक्त्या महत्या सततमनुभजनीश
    भीतिं विजह्याम् ॥ ॥ भक्तेरुत्पत्तिवृद्धी तव चरणजुषां सङ्गमेनैव पुंसा मासाद्ये पुण्यभाजां श्रिय इव
    जगति श्रीमतां सङ्गमेन । तत्सङ्गो देव भूयान्मम खलु सततं तन्मुखादुन्मिषद्भि स्त्वन्माहात्म्यप्रकारैर्भवति
    च सुदृढा भक्तिरुद्धूतपापा ॥ ॥ श्रेयोमार्गेषु भक्तावधिकबहुमतिर्जन्मकर्माणि भूयो गायन् क्षेमाणि नामान्यपि
    तदुभयतः प्रद्रुतं प्रद्रुतात्मा । उद्यद्धासः कदाचित् कुहचिदपि रुदन् क्वापि गर्जन् प्रगाय न्नुन्मादीव
    प्रनृत्यन्नयि कुरु करुणां लोकबाह्यश्चरेयम् ॥ ॥ भूतान्येतानि भूतात्मकमपि सकलं पक्षिमत्स्यान् मृगादीन्
    मर्त्यान् मित्राणि शत्रूनपि यमितमतिस्त्वन्मयान्यानमानि । त्वत्सेवायां हि सिद्ध्येन्मम तव कृपया भक्तिदार्ढ्यं
    विराग स्त्वत्तत्त्वस्यावबोधोऽपि च भुवनपते यत्नभेदं विनैव ॥ ॥ नो मुह्यन् क्षुत्तृडाद्यैर्भवसरणिभवैस्त्वन्निलीनाशयत्वा
    च्चिन्तासातत्यशाली निमिषलवमपि त्वत्पदादप्रकम्पः । इष्टानिष्टेषु तुष्टिव्यसनविरहितो मायिकत्वावबोधा
    ज्ज्योत्स्नाभिस्त्वन्नखेन्दोरधिकशिशिरितेनात्मना सञ्चरेयम् ॥ ॥ भूतेष्वेषु त्वदैक्यस्मृतिसमधिगतौ नाधिकारोऽधुना
    चे त्त्वत्प्रेम त्वत्कमैत्री जडमतिषु कृपा द्विट्सु भूयादुपेक्षा । अर्चायां वा समर्चाकुतुकमुरुतरश्रद्धया
    वर्धतां मे त्वत्संसेवी तथापि द्रुतमुपलभते भक्तलोकोत्तमत्वम् ॥ ॥ आवृत्य त्वत्स्वरूपं क्षितिजलमरुदाद्यात्मना
    विक्षिपन्ती जीवान् भूयिष्ठकर्मावलिविवशगतीन् दुःखजाले क्षिपन्ती । त्वन्माया माभिभून्मामयि भुवनपते कल्पते
    तत्प्रशान्त्यै त्वत्पादे भक्तिरेवेत्यवददयि विभो सिद्धयोगी प्रबुद्धः ॥ ॥ दुःखान्यालोक्य जन्तुष्वलमुदितविवेकोऽहमाचार्यवर्या
    ल्लब्ध्वा त्वद्रूपतत्त्वं गुणचरितकथाद्युद्भवद्भक्तिभूमा । मायामेनां तरित्वा परमसुखमये त्वत्पदे मोदिताहे
    तस्यायं पूर्वरङ्गः पवनपुरपते नाशयाशेषरोगान् ॥
