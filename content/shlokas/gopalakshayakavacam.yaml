id: gopalakshayakavacam
category: kavacha
name:
  english: gopalakshayakavacam
  devanagari: गोपालाक्षयकवचम्
content:
  english: dharmarthakamamoksharthe jape viniyogah | padau rakshatu govindo janghe patu jagatprabhuh ||
    4|| uru dvau keshavah patu kati damodarastatah | vadanam shriharih patu nadidesham ca me'cyutah ||
    5|| vamaparshvam tatha vishnurdakshinam ca sudarshanah | bahumule vasudevo hridayam ca janardanah
    || 6|| kantham patu varahashca krishnashca mukhamandalam | karnau me madhavah patu hrishikeshashca
    nasike || 7|| netre narayanah patu lalatam garudadhvajah | kapolam keshavah patu cakrapanih shirastatha
    || 8|| prabhate madhavah patu madhyahne madhusudanah | dinante daityanashashca ratrau rakshatu candramah
    || 9|| purvasyam pundarikaksho vayavyam ca janardanah | iti te kathitam vatsa sarvamantraughavigraham
    || 10|| tava snehanmaya''khyatam na vaktavyam tu kasyacit | kavacam dharayedyastu sadhako dakshine
    bhuje || 11|| deva manushya gandharva yajnastasya na samshayah | yoshidvamabhuje caiva purusho dakshine
    bhuje || 12|| nibhriyatkavacam punyam sarvasiddhiyuto bhavet | kanthe yo dharayedetat kavacam matsvarupinam
    || 13|| yuddhe jayamavapnoti dyute vade ca sadhakah | sarvatha jayamapnoti nishcitam janmajanmani
    || 14|| aputro labhate putram roganashastatha bhavet | sarvatapapramuktashca vishnulokam sa gacchati
    || 15|| || iti brahmasamhitoktam shrigopalakshayakavacam sampurnam ||
  devanagari: धर्मार्थकाममोक्षार्थे जपे विनियोगः । पादौ रक्षतु गोविन्दो जङ्घे पातु जगत्प्रभुः ॥ ४॥ ऊरू
    द्वौ केशवः पातु कटी दामोदरस्ततः । वदनं श्रीहरिः पातु नाडीदेशं च मेऽच्युतः ॥ ५॥ वामपार्श्वं तथा विष्णुर्दक्षिणं
    च सुदर्शनः । बाहुमूले वासुदेवो हृदयं च जनार्दनः ॥ ६॥ कण्ठं पातु वराहश्च कृष्णश्च मुखमण्डलम् । कर्णौ
    मे माधवः पातु हृषीकेशश्च नासिके ॥ ७॥ नेत्रे नारायणः पातु ललाटं गरुडध्वजः । कपोलं केशवः पातु चक्रपाणिः
    शिरस्तथा ॥ ८॥ प्रभाते माधवः पातु मध्याह्ने मधुसूदनः । दिनान्ते दैत्यनाशश्च रात्रौ रक्षतु चन्द्रमाः
    ॥ ९॥ पूर्वस्यां पुण्डरीकाक्षो वायव्यां च जनार्दनः । इति ते कथितं वत्स सर्वमन्त्रौघविग्रहम् ॥ १०॥ तव
    स्नेहान्मयाऽऽख्यातं न वक्तव्यं तु कस्यचित् । कवचं धारयेद्यस्तु साधको दक्षिणे भुजे ॥ ११॥ देवा मनुष्या
    गन्धर्वा यज्ञास्तस्य न संशयः । योषिद्वामभुजे चैव पुरुषो दक्षिणे भुजे ॥ १२॥ निभृयात्कवचं पुण्यं सर्वसिद्धियुतो
    भवेत् । कण्ठे यो धारयेदेतत् कवचं मत्स्वरूपिणम् ॥ १३॥ युद्धे जयमवाप्नोति द्यूते वादे च साधकः । सर्वथा
    जयमाप्नोति निश्चितं जन्मजन्मनि ॥ १४॥ अपुत्रो लभते पुत्रं रोगनाशस्तथा भवेत् । सर्वतापप्रमुक्तश्च विष्णुलोकं
    स गच्छति ॥ १५॥ ॥ इति ब्रह्मसंहितोक्तं श्रीगोपालाक्षयकवचं सम्पूर्णम् ॥
