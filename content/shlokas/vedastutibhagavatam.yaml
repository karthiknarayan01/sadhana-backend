id: vedastutibhagavatam
category: stotram
name:
  english: vedastutibhagavatam
  devanagari: वेदस्तुतिभागवतम्
content:
  english: 49|| yo'syotprekshaka adimadhyanidhane yo'vyaktajiveshvaro yah srishtvedamanupravishya rishina
    cakre purah shasti tah | yam sampadya jahatyajamanushayi suptah kulayam yatha tam kaivalyanirastayonimabhayam
    dhyayedajasram harim || 10
  devanagari: ४९॥ योऽस्योत्प्रेक्षक आदिमध्यनिधने योऽव्यक्तजीवेश्वरो यः सृष्ट्वेदमनुप्रविश्य ऋषिणा चक्रे
    पुरः शास्ति ताः । यं सम्पद्य जहात्यजामनुशयी सुप्तः कुलायं यथा तं कैवल्यनिरस्तयोनिमभयं ध्यायेदजस्रं
    हरिम् ॥ १०
meaning: {}
