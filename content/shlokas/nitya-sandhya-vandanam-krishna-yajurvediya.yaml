    श॒रद॑श्श॒त न्दृ॒षे ॥ य उद॑गान्मह॒तो द्वि॒भ्राज॑मान स्सरि॒रस्य॒ मध्या॒थ्समा॑ वृष॒भो लो॑हिता॒क्षसूर्यो॑
    विप॒श्चिन्मन॑सा पुनातु ॥ सायङ्काल सूर्योपस्थानं ॐ इ॒मम्मे॑ वरुण शृधी॒ हव॑ म॒द्या च॑ मृडय । त्वा म॑व॒स्यु
    राच॑के ॥ तत्वा॑ यामि॒ ब्रह्म॑णा॒ वन्द॑मान॒ स्त दाशा स्ते॒ यज॑मानो ह॒विर्भिः॑ । अहे॑डमानो वरुणे॒ह बो॒ध्युरु॑श॒ग्ं॒
    समा॑न॒ आयुः॒ प्रमो॑षीः ॥ यच्चि॒द्धिते॒ विशो॑यथा॒ प्रदे॑व वरुणव्र॒तम् । मि॒नी॒मसि॒द्य वि॑द्यवि । यत्किञ्चे॒दं
    श्चरा॑मसि । अचि॑त्ती॒ यत्तव॒ धर्मा॑युयोपि॒ स्तस्मा॒ देन॑सो देवरीरिषः । कि॒त॒वासो॒ यद्रि॑रि॒पुर्नदी॒वि
    यद्वा॑घा स॒त्यमु॒तयन्न वि॒द्म । सर्वा॒ताविष्य॑ शिधि॒रेव॑दे॒वा ऽथा॑तेस्याम वरुण प्रि॒यासः॑ ॥ न्नमः॒
    प्राच्यै॑ दि॒शे याश्च॑ दे॒वता॑ ए॒तस्या॒ म्प्रति॑वसन्त्ये॒ ताभ्य॑श्च॒ नमः॑ । ओ न्नमो दक्षि॑णायै दि॒शे
    याश्च॑ दे॒वता॑ ए॒तस्या॒ म्प्रति॑वसन्त्ये॒ ताभ्य॑श्च॒ नमः॑ । ओ च्यै दि॒शे याश्च॑ दे॒वता॑ ए॒तस्या॒ म्प्रति॑वसन्त्ये॒
    ताभ्य॑श्च॒ नमः॑ । ओ च्यै दि॒शे याश्च॑ दे॒वता॑ ए॒तस्या॒ म्प्रति॑वसन्त्ये॒ ताभ्य॑श्च॒ नमः॑ । ओ न्नम॑
    ऊ॒र्ध्वायै॑ दि॒शे याश्च॑ दे॒वता॑ ए॒तस्या॒ म्प्रति॑वसन्त्ये॒ ताभ्य॑श्च॒ नमः॑ । ओ ऽध॑रायै दि॒शे याश्च॑
    दे॒वता॑ ए॒तस्या॒ म्प्रति॑वसन्त्ये॒ ताभ्य॑श्च॒ नमः॑ । ओ ऽवान्त॒रायै॑ दि॒शे याश्च॑ दे॒वता॑ ए॒तस्या॒
    म्प्रति॑वसन्त्ये॒ ताभ्य॑श्च॒ नमः॑ । मुनि नमस्कारः नमो गङ्गा यमुनयो र्मध्ये ये॑ वस॒न्ति॒ ते मे प्रसन्नात्मान
    श्चिरञ्जीवितं व॑र्धय॒न्ति॒ नमो गङ्गा यमुनयो र्मुनि॑भ्यश्च॒ नमो नमो गङ्गा यमुनयो र्मुनि॑भ्यश्च॒ न॑मः
    ॥ सन्ध्यादेवता नमस्कारः सन्ध्या॑यै॒ नमः॑ । सावि॑त्र्यै॒ नमः॑ । गाय॑त्र्यै॒ नमः॑ । सर॑स्वत्यै॒ नमः॑
    । सर्वा॑भ्यो दे॒वता॑भ्यो॒ नमः॑ । दे॒वेभ्यो॒ नमः॑ । ऋषि॑भ्यो॒ नमः॑ । मुनि॑भ्यो॒ नमः॑ । गुरु॑भ्यो॒ नमः॑
    । पितृ॑भ्यो॒ नमः॑ । कामो र्नमो॒ नमः । मन्यु रकार् र्नमो॒ नमः । पृथिव्यापस्ते॒जो वायु॑राका॒शात् नमः
    ॥ न्नमो भगवते वासु॑देवा॒य । या॒ग्ं सदा॑ सर्वभूता॒नि॒ च॒राणि॑ स्थाव॒राणि॑ च । सा॒य॒ म्प्रा॒त र्न॑मस्य॒न्ति॒
    सा॒ मा॒ सन्ध्या॑ ऽभिरक्षतु ॥ शिवाय विष्णुरूपाय शिवरूपाय विष्णवे । शिवस्य हृदयं विँष्णुर्विष्णोश्च
    हृदयं शिवः ॥ यथा शिवमयो विष्णुरेवं न्न पश्यामि तथा मे स्वस्तिरायुषि ॥ नमो ब्रह्मण्य देवाय गो ब्राह्मण
    हिताय च । जगद्धिताय कृष्णाय गोविन्दाय नमो नमः ॥ गायत्री उद्वासन उ॒त्तमे॑ शिख॑रे जा॒ते॒ भू॒म्या म्प॑र्वत॒मूर्थ॑नि
    । ब्रा॒ह्मणे ऽभ्य॑नुज्ञा॒ता॒ ग॒च्चदे॑वि य॒थासु॑खम् । स्तुतो मया वरदा वे॑दमा॒ता॒ प्रचोदयन्ती पवने द्विजा॒ता
    । आयुः पृथिव्या ऽस्त्वनन्ताय सहस्रमूर्तये सहस्र पादाक्षि शिरोरु बाहवे । सहस्र नाम्ने पुरुषाय शाश्वते
    सहस्रकोटी युग धारिणे नमः ॥ भूम्याकाशाभि वन्दनं इ॒द न्द्या॑वा पृथि॒वी स॒त्यम॑स्तु॒ । पित॒ र्मातर्यदि॒
    होप॑ बृ॒वेवा न्दे॒वाना॑ मवमे अवो॑भिः । विद्या मे॒षं ञ्जी॒रदा॑नुम् ॥ आकाशात्पतित यँथा गच्छति सागरम्
    । सर्वदेव नमस्कारः केशव म्प्रतिगच्छति ॥ श्री केशव म्प्रतिगच्छत्योन्नम इति । सर्ववेदेषु यत्पुण्यम्
    । सर्वतीर्थेषु यत्फलम् । तत्फल म्पुरुष आप्नोति स्तुत्वादेव ञ्जनार्धनम् ॥ स्तुत्वादेव न्ते जगत्रयम्
    । सर्वभूत निवासो ऽस्तुते ॥ श्री वासुदेव नमो म्भो अभिवादये ॥ आचम्य ईश्वरार्पणं कायेन वाचा मनसेन्द्रियैर्वा
    बुद्ध्या ऽऽत्मना वा प्रकृते स्स्वभावात् । करोमि यद्यत्सकल म्परस्मै श्रीमन्नारायणायेति समर्पयामि ॥
    हरिः ओ न्तत्सत् । तत्सर्वं श्री परमेश्वरार्पणमस्तु ।
