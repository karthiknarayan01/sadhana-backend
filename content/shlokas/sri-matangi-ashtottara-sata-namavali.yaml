id: sri-matangi-ashtottara-sata-namavali
category: stotram
name:
  english: Sri Matangi Ashtottara Sata Namavali
content:
  english: om mahamattamatanginisiddhirupayai namah | om yoginyai namah | om bhadrakalyai namah | om ramayai
    namah | om bhavanyai namah | om bhavapritidayai namah | om bhutiyuktayai namah | om bhavaradhitayai
    namah | om bhutisampatkaryai namah | om dhanadhishamatre namah | | om dhanagaradrishtyai namah | om
    dhanesharcitayai namah | om dhiravapivarangyai namah | om prakrishta prabharupinyai namah | om kamarupa
    prahrishtayai namah | om mahakirtidayai namah | om karnanalyai namah | om karalibhagaghorarupayai
    namah | om bhagangyai namah | om bhagahvayai namah | | om bhagapritidayai namah | om bhimarupayai
    namah | om bhavanyai namah | om mahakaushikyai namah | om koshapurnayai namah | om kishori kishorapriyanandihayai
    namah | om mahakaranakaranayai namah | om karmashilayai namah | om kapali prasiddhayai namah | om
    mahasiddhakhandayai namah | | om makarapriyayai namah | om manarupayai namah | om maheshyai namah
    | om mahollasini lasyalila layangyai namah | om kshama kshemashilayai namah | om kshapakarinyai namah
    | om akshayapritidayai namah | om bhutiyukta bhavanyai namah | om bhavaradhitayai namah | om bhutisatyatmikayai
    namah | | om prabhodbhasitayai namah | om bhanubhasvatkarayai namah | om dharadhishamatre namah |
    om dharagaradrishtyai namah | om dharesharcitayai namah | om dhivaradhivarangyai namah | om prakrishtaprabharupinyai
    namah | om pranarupa prakrishtasvarupayai namah | om svarupapriyaya namah | om calatkundalayai namah
    | | om kaminikantayuktayai namah | om kapalacalayai namah | om kalakoddharinyai namah | om kadambapriyayai
    namah | om kotari kotadehayai namah | om kramayai namah | om kirtidayai namah | om karnarupayai namah
    | om kakshmyai namah | om kshamangyai namah | | om kshayapremarupayai namah | om kshapayai namah |
    om kshayakshayai namah | om kshayahvayai namah | om kshayaprantarayai namah | om kshavatkaminyai namah
    | om ksharini kshirapurnayai namah | om shivangyai namah | om shakambhari shakadehayai namah | om
    mahashakayajnayai namah | | om phalaprashakayai namah | om shakahvayai namah | om ashakahvayai namah
    | om shakakhyayai namah | om shakayai namah | om shakakshantaroshayai namah | om suroshayai namah
    | om surekhayai namah | om mahasheshayajnopavitapriyayai namah | om jayantyai namah | | om jayayai
    namah | om jagrati yogyarupayai namah | om jayangyai namah | om japadhyanasantushtasanjnayai namah
    | om jayapranarupayai namah | om jayasvarnadehayai namah | om jayajvaliniyaminyai namah | om yamyarupayai
    namah | om jaganmatrirupayai namah | om jagadrakshanayai namah | | om svadhavaushadantayai namah |
    om vilambavilambayai namah | om shadangayai namah | om mahalambarupasihastayai namah | om padahariniharinyai
    namah | om harinyai namah | om mahamangalayai namah | om mangalapremakirtaye namah | om nishumbhacchidayai
    namah | om shumbhadarpapahayai namah | | om anandabijadimuktisvarupayai namah | om candamundapada
    mukhyacandayai namah | om pracandapracandayai namah | om mahacandavegayai namah | om calaccamarayai
    namah | om camaracandrakirtaye namah | om sucamikara citrabhushojjvalangyai namah | om susangitagitayai
    namah |
  devanagari: ॐ महामत्तमातङ्गिनीसिद्धिरूपायै नमः । ॐ योगिन्यै नमः । ॐ भद्रकाल्यै नमः । ॐ रमायै नमः । ॐ
    भवान्यै नमः । ॐ भवप्रीतिदायै नमः । ॐ भूतियुक्तायै नमः । ॐ भवाराधितायै नमः । ॐ भूतिसम्पत्कर्यै नमः
    । ॐ धनाधीशमात्रे नमः । । ॐ धनागारदृष्ट्यै नमः । ॐ धनेशार्चितायै नमः । ॐ धीरवापीवराङ्ग्यै नमः । ॐ प्रकृष्ट
    प्रभारूपिण्यै नमः । ॐ कामरूप प्रहृष्टायै नमः । ॐ महाकीर्तिदायै नमः । ॐ कर्णनाल्यै नमः । ॐ करालीभगाघोररूपायै
    नमः । ॐ भगाङ्ग्यै नमः । ॐ भगाह्वायै नमः । । ॐ भगप्रीतिदायै नमः । ॐ भीमरूपायै नमः । ॐ भवान्यै नमः ।
    ॐ महाकौशिक्यै नमः । ॐ कोशपूर्णायै नमः । ॐ किशोरी किशोरप्रियानन्दीहायै नमः । ॐ महाकारणाकारणायै नमः
    । ॐ कर्मशीलायै नमः । ॐ कपालि प्रसिद्धायै नमः । ॐ महासिद्धखण्डायै नमः । । ॐ मकारप्रियायै नमः । ॐ मानरूपायै
    नमः । ॐ महेश्यै नमः । ॐ महोल्लासिनी लास्यलीला लयाङ्ग्यै नमः । ॐ क्षमा क्षेमशीलायै नमः । ॐ क्षपाकारिण्यै
    नमः । ॐ अक्षयप्रीतिदायै नमः । ॐ भूतियुक्ता भवान्यै नमः । ॐ भवाराधितायै नमः । ॐ भूतिसत्यात्मिकायै नमः
    । । ॐ प्रभोद्भासितायै नमः । ॐ भानुभास्वत्करायै नमः । ॐ धराधीशमात्रे नमः । ॐ धरागारदृष्ट्यै नमः । ॐ
    धरेशार्चितायै नमः । ॐ धीवराधीवराङ्ग्यै नमः । ॐ प्रकृष्टप्रभारूपिण्यै नमः । ॐ प्राणरूप प्रकृष्टस्वरूपायै
    नमः । ॐ स्वरूपप्रियाय नमः । ॐ चलत्कुण्डलायै नमः । । ॐ कामिनीकान्तयुक्तायै नमः । ॐ कपालाचलायै नमः ।
    ॐ कालकोद्धारिण्यै नमः । ॐ कदम्बप्रियायै नमः । ॐ कोटरी कोटदेहायै नमः । ॐ क्रमायै नमः । ॐ कीर्तिदायै
    नमः । ॐ कर्णरूपायै नमः । ॐ काक्ष्म्यै नमः । ॐ क्षमाङ्ग्यै नमः । । ॐ क्षयप्रेमरूपायै नमः । ॐ क्षपायै
    नमः । ॐ क्षयाक्षायै नमः । ॐ क्षयाह्वायै नमः । ॐ क्षयप्रान्तरायै नमः । ॐ क्षवत्कामिन्यै नमः । ॐ क्षारिणी
    क्षीरपूर्णायै नमः । ॐ शिवाङ्ग्यै नमः । ॐ शाकम्भरी शाकदेहायै नमः । ॐ महाशाकयज्ञायै नमः । । ॐ फलप्राशकायै
    नमः । ॐ शकाह्वायै नमः । ॐ अशकाह्वायै नमः । ॐ शकाख्यायै नमः । ॐ शकायै नमः । ॐ शकाक्षान्तरोषायै नमः
    । ॐ सुरोषायै नमः । ॐ सुरेखायै नमः । ॐ महाशेषयज्ञोपवीतप्रियायै नमः । ॐ जयन्त्यै नमः । । ॐ जयायै नमः
    । ॐ जाग्रती योग्यरूपायै नमः । ॐ जयाङ्ग्यै नमः । ॐ जपध्यानसन्तुष्टसञ्ज्ञायै नमः । ॐ जयप्राणरूपायै नमः
    । ॐ जयस्वर्णदेहायै नमः । ॐ जयज्वालिनीयामिन्यै नमः । ॐ याम्यरूपायै नमः । ॐ जगन्मातृरूपायै नमः । ॐ जगद्रक्षणायै
    नमः । । ॐ स्वधावौषडन्तायै नमः । ॐ विलम्बाविलम्बायै नमः । ॐ षडङ्गायै नमः । ॐ महालम्बरूपासिहस्तायै नमः
    । ॐ पदाहारिणीहारिण्यै नमः । ॐ हारिण्यै नमः । ॐ महामङ्गलायै नमः । ॐ मङ्गलप्रेमकीर्तये नमः । ॐ निशुम्भच्छिदायै
    नमः । ॐ शुम्भदर्पापहायै नमः । । ॐ आनन्दबीजादिमुक्तिस्वरूपायै नमः । ॐ चण्डमुण्डापदा मुख्यचण्डायै नमः
    । ॐ प्रचण्डाप्रचण्डायै नमः । ॐ महाचण्डवेगायै नमः । ॐ चलच्चामरायै नमः । ॐ चामराचन्द्रकीर्तये नमः ।
    ॐ सुचामीकरा चित्रभूषोज्ज्वलाङ्ग्यै नमः । ॐ सुसङ्गीतगीतायै नमः ।
