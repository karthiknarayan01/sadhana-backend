id: shrisuryashtakam
category: stotram
name:
  english: shrisuryashtakam
  devanagari: श्रीसूर्याष्टकम्
content:
  english: adideva namastubhyam prasida mama bhaskara | divakara namastubhyam prabhakara namo'stute ||
    1 || saptashvarathamarudham pracandam kashyapatmajam | shvetapadmadharam devam tam suryam pranamamyaham
    || 2 || lohitam rathamarudham sarvalokapitamaham | mahapapaharam devam tam suryam pranamamyaham ||
    3 || traigunyam ca mahashuram brahmavishnumaheshvaram | mahapapaharam devam tam suryam pranamamyaham
    || 4 || brimhitam tejasam punjam vayurakashameva ca | prabhustvam sarvalokanam tam suryam pranamamyaham
    || 5 || bandhukapushpasankasham harakundalabhushitam | ekacakradharam devam tam suryam pranamamyaham
    || 6 || vishvesham vishvakartaram mahateja
  devanagari: आदिदेव नमस्तुभ्यं प्रसीद मम भास्कर । दिवाकर नमस्तुभ्यं प्रभाकर नमोऽस्तुते ॥ १ ॥ सप्ताश्वरथमारूढं
    प्रचण्डं कश्यपात्मजम् । श्वेतपद्मधरं देवं तं सूर्यं प्रणमाम्यहम् ॥ २ ॥ लोहितं रथमारूढं सर्वलोकपितामहम्
    । महापापहरं देवं तं सूर्यं प्रणमाम्यहम् ॥ ३ ॥ त्रैगुण्यं च महाशूरं ब्रह्मविष्णुमहेश्वरम् । महापापहरं
    देवं तं सूर्यं प्रणमाम्यहम् ॥ ४ ॥ बृंहितं तेजसां पुञ्जं वायुराकाशमेव च । प्रभुस्त्वं सर्वलोकानां तं
    सूर्यं प्रणमाम्यहम् ॥ ५ ॥ बन्धूकपुष्पसङ्काशं हारकुण्डलभूषितम् । एकचक्रधरं देवं तं सूर्यं प्रणमाम्यहम्
    ॥ ६ ॥ विश्वेशं विश्वकर्तारं महातेज
meaning: {}
