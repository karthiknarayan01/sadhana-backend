id: samkhyasutravivaranam
category: sutra
name:
  english: samkhyasutravivaranam
  devanagari: सांख्यसूत्रविवरणम्
content:
  english: sankhyasutravivaranam shrikapilaya namah | prakritim purusham natva samkhyasutre vidhiyate
    | samkshepato vivaranamavivekapanuttaye || iha khalu bhagavan kapilo munirasuraye'nukampaya pancavimshatitattvanyupadishya
    sutrayamasa | ashtau prakritaya ityadi | kah punasta ityucyante | pradhanam mahanahamkarastanmatrani
    ca | pradhanam prakritiravyaktamavyakritam cetyanarthantaram | mahan mahattatvam buddhiradhyavasayalakshanam
    | ahamkaro'bhimanalakshano vaikritikastaijaso bhutadishceti trividhah | tanmatrani tu panca shabdatanmatramakashahetuh
    | sparshatanmatram vayuyonih | rupatanmatram tejoyonih | rasatanmatramapprakritih | gandhatanmatram
    prithivihetuh | iti pancatanmatrani ityashtau prakritayah | ke punarvikarah kati | shodashavikarah
    | ekadashendriyani panca mahabhutani ca | tatra shrotratvakcakshurasanaghranakhyani buddhindriyani
    shabdasparsharuparasagandhalocanavrittini | vakpanipadapayupasthani karmendriyani vacanadanaviharanotsarganandavrittini
    | jnanakriyashaktidvayatmakam sankalpavikalpalakshanam mana ityekadashendriyani | bhutani cakashavayutejahsalilaprithivilakshanani
    panceti shodashavikarah || atha kah purushah ityucyate | purusho'nekastrigunarahito viveki avishayo'sadharano'prasavadharma
    cetanah sakshi kevalo madhyastho drashta'karta ca || atha ke punastrayo guna ityucyante | traigunyam
    sattvam rajastama iti | traya eva gunastraigunyam | sattvam nama patavamardavalaghavaprasannatabhisangaprititushtyanihasantoshadilakshanamanantabhedam
    samasatah sukhavaham | rajo nama shokatapakhedastambhodgamodvegaroshamanadilakshanamanantabhedam samasato
    duhkhavaham | tamo namacchadanavaranabibhatsadainyagauravalasyanidrapramadadilakshanamanantabhedam
    samasato mohatmakam etat traigunyam vyakhyatam || sattvam prakashakam vindyadrajo vindyat pravartakam
    | vinashakam tamo vindyat traigunyam nama sanjnitam || atraha kah sancarah pratisancarashceti | ucyate
    | utpattih sancarah | pralayah pratisancarah | tatrotpattirnamavyaktat samupadishtat sarvajagatah
    parena rupenadhishthanatmakat mahan mahato'hamkarah | sa ca trividhah | vaikritiko bhutadistaijasashceti
    | tatra vaikritadindriyanyutpadyante bhutadestanmatrani taijasadubhayam indriyani tanmatrani ceti
    | tanmatrebhyo bhutani | ayam sancarah | pratisancaro nama bhutani tanmatreshu liyante | tanmatranindriyani
    cahamkare | ahamkaro buddhau | buddhiravyakte | tato'vyaktam tu kvacinna liyate kasmat anutpannatvat
    | ityevam pratisancarah | evametau sancarapratisancarau vyakhyatau || atraha kimvidhamadhyatmamadhibhutamadhidaivatam
    ca | atrocyate | buddhiradhyatmam | bodhayitavyamadhibhutam | brahma tatradidaivatam | ahamkaro'dhyatmam
    | abhimantavyamadhibhutam | rudrastatradhidaivatam | manodhyatmam samkalpamadhibhutam | candrastatradidaivatam
    | shrotramadhyatmam | sparshayitavyamadhibhutam | vayustatradhidaivatam | cakshuradhyatmam | darshayitavyamadhibhutam
    | suryastatradidaivatam | jihvadhyatmam | rasayitavyamadhibhutam | varunastatradhidaivatam | nasadhyatmam
    | ghratavyamadhibhutam | prithivi tatradhidaivatam | vagadhyatmam | vaktavyamadhibhutam | agnistatradhidaivatam
    | paniradhyatmam | adatavyamadhibhutam | indrastatradhidaivatam | padavadhyatmam | gantavyamadhibhutam
    | vishnustatradhidaivatam | payuradhyatmam | utsrashtavyamadhibhutam | mitrastatradhidaivatam | upasthamadhyatmam
    | anandayitavyamadhibhutam | prajapatistatradhidaivatam | evameva trayodashakaranasyadhyatmamadhibhutamadhidaivam
    ca vyakhyatam | kani catvarityata aha ceti | trini gunarupani caturthamadhidaivatamityarthah || catvari
    yo vedayate yathavad gunasvarupanyadhidaivatam ca | vimuktapapma gatadoshasango gunamstu bhunkte na
    gunaih sa bhujyate || atha kasta abhibuddhaya ityucyante | pancabhibuddhayah | buddhirabhimana iccha
    kartavyam tatkriya ceti | abhimukhi buddhirabhibuddhih | idam karaniyametyetadadhyavasayo buddhih
    kriyatmaparamarshasvarupapratyayah | abhimukho mano'ham karomityahamkaro'bhimanah | buddhikriya iccha
    vancha | kartavyam samkalpo manaso vrittih | kriya etadvastusvarupamiti kartavyalocanam yadbuddhindriyanam
    sa kriya | itthametat kartavyamiti yatpravrittih karmendriyanam sa kriyeti | evametaha pancabhibuddhayo
    vyakhyatah || atha kah pancakarmayonayah ucyante | dhritih shraddha sukha avividisha vividisha ceti
    panca karmayonayah | vaci karmani kaye ca pratitiryabhirajyate | tannishthastatpratishthashca dhriteretaddhi
    lakshanam || anasuya brahmacaryam yajanam yajanam tapah | pratigraho'trahomashca shraddhaya lakshanam
    smritam || sukharthi yastu seveta vidyakarmatapamsi ca | prayashcittaparo nityam sukheyam parikirtita
    || vishadhumamurchitavadavividisha | vividisha dhyayinam prajnayonih | ekatvam ca prithaktvam ca nityam
    cedamacetanam | sukshmam satkaryamakshobhyam jneya vividisha hi sa || karyakaranakshamakara vividisha
    prakritika vrittih | dhritih shraddha sukha avividisha catasro bandhaya vividishaika mokshaya iti
    panca karmayonayo vyakhyatah || atraha ke te pancavayavah | ucyante | prano'panah samanashca udano
    vyana eva ca | ityete vayavah panca sharireshu sharirinam || tatra prano nama vayuryo'yam mukhanasikadhishthanaprananat
    kramenananat prana ityabhidhiyate | apano nama vayurnabheradhishthata apanayanadadhogamanaccapana
    ityabhidhiyate | samano nama vayurhridadhishthata samanat samagamanacca samana ityabhidhiyate | udano
    nama vayuh kanthadhishthata urdhvam gamanacca udana ityabhidhiyate | vyano nama vayuh sandhyadhishthata
    pranadijrimbhanacca vyana ityabhidhiyate | iti pancavayavo vyakhyatah || aha ke te pancakarmatmanah
    ucyante | vaikarikastaijaso bhutadishca sanumano niranumanashceti | tatra vaikarikah shubhakarmakarta
    | taijaso'shubhakarmakarta | bhutadirmudhakarmakarta | sanumanah shubhamudhakarmakarta | niranumano'shubhamudhakarmakarta
    | ityete pancakarmakartaro vyakhyatah || aha ka sa pancaparvavidyeti | ucyate | tamo moho mahamohastamisro'ndhatamisrashceti
    | tatra tamomohavubhavetavashtatmakau | mahamoho dashatmakah | tamisrandhatamisrau cashtadashatmakau
    | tatra tamo namashtasu prakritishvavyaktabuddhyahamkarapancatanmatrasanjnitasu anatmasvatmajnanabhimanastama
    ityabhidhiyate | moho namanimadyashtagunaishvaryapraptaye yobhimana utpadyate sa moha ityabhidhiyate
    | mahamoho nama drishtanushravikeshu vishayeshu dashasu nivritteshu mukto'hamiti manyate sa mahamoha
    ityabhidhiyate | tamisro nama ashtagunaishvarye'nimadye dashavidhe ca vishaye pratihatasya duhkhamutpadyate'sau
    tamisra ityabhidhiyate | andhatamisro nama animadyashtagunaishvarye dashavidhe ca vishaye siddhe maranakale
    ca yo vishadah pratyapadyate so'ndhatamisra ityabhidhiyate | evamesha pancaparva'vidya dvishashtibheda
    vyakhyata || atraha kashtavimshatidhashaktih | atrocyate | ekadashendriyavadhah saptadashabuddhivadhah
    | eshashtavimshatidhashaktih | tatrendriyavadhastavat | badhirastvakbadhirah andhah jadajihvah ajighrah
    mukah kunih panguh napumsakah urdhvavayuyuktah amanah | taduktam | badhiryam kushthitandhastvam jadata'jighrata
    tatha | mukata kaunyapangutvam klaibyodavartamattatah || etedindriyadvara buddhereva vadhah | sakshadbuddhivadha
    yatha | navavidhatushtivaikalyat ashtavidhasiddhavaikalyacca saptadashabuddhivadha ityashtavimshatidhashaktih
    || ka punarnavadha tushtih ucyate | catasra adyatmikyastushtayah bahyah panca | adyah prakrityupadanakalabhagyakhyah
    | prakrityaiva muktih kim punah sadhanairiti tushtih prakrityakhya ambho nama | sadhanaih samnyasadibhirupattaistushtih
    sadhanakhya salilam nama | kalenaiva muktyadikam setsyati kim duhkhaih samnyasadisadhanairiti tushtih
    kalakhya'gho nama | ya tu bhagyadeva sarvam setsyati kim sadhanadidhyanadikleshairiti sa bhagyakhya
    tushtirnama | bahyah shabdadivishayavairagyastushtayah arjanarakshanakshayabhogahimsadoshadarshanam
    vairagyahetuh pancavidhastadbhedena pancatushtayah || atha kah siddhayah ucyante | ashtau siddhayah
    | ucyante | adhyayanam taram nama siddhih | tato'rthajnanam sutaram nama | tatastarkenarthaparikshanam
    tarataram nama siddhih | tatah parikshakasamvadanam ramyakam nama | tato vivekakhyatih sadamuditam
    nama | etah panca gaunyah siddhayah | duhkhatrayavighatastastrayo mukhyah siddhayah | pramodamuditamodanamakhyah
    phalamityashtau siddhayah | tushtisiddhinam viparyayat saptadashadha vuddhivadhah || ke punarmaulikarthah
    katidha ucyante | dashadha maulikarthaha | ekatvamarthavattvam pararthyam pradhanasya | anyatvamakartritvam
    bahutvam purushasya | astitvam yogo viyogashcetyubhayayoh | sheshavrittih parishishtatvam pralaye
    tadubhayayoh | taduktam pradhanastitvamekatvamarthavattvam yatharthata | pararthyam ca tatha naikyam
    viyogo yoga eva ca || sheshavrittirakartritvam maulikarthah smrita dasha || iti | atraha ko'nugrahasargah
    | anugrihnati pratyayabhutadisargam yah sargah so'nugrahasargah | tanmatrasarga evasau visheshaparanama
    | ke visheshah kiyantashca | ucyante | lingadehaha sthuladehah sthulabhutani ca | tatra lingam sthuladehat
    purvamutpannamavyahatam sthulanashe'pyanashvaram | mahadahamkarendriyatanmatratmakam | dharmadharmajnanajnanavairagyavairagyaishvaryanaishvaryakhyabhavavasitam
    samsarati | sthulabhutani tu bhugolasamudravahnishishumarabrahmandaviratadini | sthuladehah ke katividhashceti
    ucyate || caturdashavidho bhutasargah | tatrashtavikalpo daivastairyagyonah pancadha manushya ekavidhah
    brahmah prajapatyah paitre gandharvo yaksho rakshasah paishacashca daivasargah pashumrigasarisripasthavarah
    tirashcam sargah | brahmanadijatibhede'pi samsthane visheshabhavat ekavidho manushya iti caturdashavidhah
    sthuladehah | kaha punarbandhah katidha ca | trividho bandhah | kah punasta vidha ucyante | prakritiko
    vaikritiko dakshanikashca bandhah | prakritimatmanam jnatva taccintanat prakritikah atrocyate purnavarshasahasram
    tu tishthantyavyaktacintaka iti | mahadadinatmatvena jnatva taccintanadvaikarikah | atrocyate | dashamanvantaraniha
    tishthantindriyacintakah | bhautikastu shatam purnam sahasram cabhimanikah || bauddha dashasahasrani
    tishthanti vigatajvarah | ami videhah | ishtapurtti dakshina tannimitto dakshanikah atrocyate | svargastha
    narakam yanti narakashca trivishtapamiti | gatagatam kamakama labhanta iti ca | ata eva hi trishvapi
    bandheshu ekaikapaye tatastato moksha iti | trividho mokshah | karmano vikarat prakritashca mokshah
    | yaduktam | prakritena ca bandhena tatha vaikarikena ca | dakshinabhistritiyena vriddho nanyena mucyate
    || iti | atha kutastyanam tattvanam siddhih | pramanaditi brumah | tatra pramanam kim katividhama
    va ucyate trividham pramanam | tisro vidha yasyeti trividham | kasta vidhah | ucyate | drishtamanumanamaptavacanam
    ca | arthasannikrishtendriyajo nishcayo drishtam | indriyani panca cakshuradini manashca | vyaptipakshadharmatajnanapurvakamanumanam
    | tacca trividham | purvavat sheshavat samanyato drishtam ca | purvavadyatha kardamena purvavrittavrishtyanumanam
    | sheshavadyatha | samudratapalamudakam
  devanagari: साङ्ख्यसूत्रविवरणम् श्रीकपिलाय नमः । प्रकृतिं पुरुषं नत्वा सांख्यसूत्रे विधीयते । संक्षेपतो
    विवरणमविवेकापनुत्तये ॥ इह खलु भगवान् कपिलो मुनिरासुरयेऽनुकम्पया पञ्चविंशतितत्त्वान्युपदिश्य सूत्रयामास
    । अष्टौ प्रकृतय इत्यादि । काः पुनस्ता इत्युच्यन्ते । प्रधानं महानहंकारस्तन्मात्राणि च । प्रधानं प्रकृतिरव्यक्तमव्याकृतं
    चेत्यनर्थान्तरम् । महान् महत्तत्वं बुद्धिरध्यवसायलक्षणम् । अहंकारोऽभिमानलक्षणो वैकृतिकस्तैजसो भूतादिश्चेति
    त्रिविधः । तन्मात्राणि तु पञ्च शब्दतन्मात्रमाकाशहेतुः । स्पर्शतन्मात्रं वायुयोनिः । रूपतन्मात्रं तेजोयोनिः
    । रसतन्मात्रमप्प्रकृतिः । गन्धतन्मात्रं पृथिवीहेतुः । इति पञ्चतन्मात्राणि इत्यष्टौ प्रकृतयः । के पुनर्विकाराः
    कति । षोडशविकाराः । एकादशेन्द्रियाणि पञ्च महाभूतानि च । तत्र श्रोत्रत्वक्चक्षूरसनघ्राणाख्यानि बुद्धीन्द्रियाणि
    शब्दस्पर्शरूपरसगन्धालोचनवृत्तीनि । वाक्पाणिपादपायूपस्थानि कर्मेन्द्रियाणि वचनादानविहरणोत्सर्गानन्दवृत्तीनि
    । ज्ञानक्रियाशक्तिद्वयात्मकं सङ्कल्पविकल्पलक्षणं मन इत्येकादशेन्द्रियाणि । भूतानि चाकाशवायुतेजःसलिलपृथिवीलक्षणानि
    पञ्चेति षोडशविकाराः ॥ अथ कः पुरुषः इत्युच्यते । पुरुषोऽनेकस्त्रिगुणरहितो विवेकी अविषयोऽसाधारणोऽप्रसवधर्मा
    चेतनः साक्षी केवलो मध्यस्थो द्रष्टाऽकर्ता च ॥ अथ के पुनस्त्रयो गुणा इत्युच्यन्ते । त्रैगुण्यं सत्त्वं
    रजस्तम इति । त्रय एव गुणास्त्रैगुण्यम् । सत्त्वं नाम पाटवमार्दवलाघवप्रसन्नताभिसङ्गप्रीतितुष्ट्यनीहासन्तोषादिलक्षणमनन्तभेदं
    समासतः सुखावहम् । रजो नाम शोकतापखेदस्तम्भोद्गमोद्वेगरोषमानादिलक्षणमनन्तभेदं समासतो दुःखावहम् । तमो
    नामाच्छादनावरणबीभत्सदैन्यगौरवालस्यनिद्राप्रमादादिलक्षणमनन्तभेदं समासतो मोहात्मकं एतत् त्रैगुण्यं व्याख्यातम्
    ॥ सत्त्वं प्रकाशकं विन्द्याद्रजो विन्द्यात् प्रवर्तकम् । विनाशकं तमो विन्द्यात् त्रैगुण्यं नाम सञ्ज्ञितम्
    ॥ अत्राह कः सञ्चरः प्रतिसञ्चरश्चेति । उच्यते । उत्पत्तिः सञ्चरः । प्रलयः प्रतिसञ्चरः । तत्रोत्पत्तिर्नामाव्यक्तात्
    समुपदिष्टात् सर्वजगतः परेण रूपेणाधिष्ठानात्मकात् महान् महतोऽहंकारः । स च त्रिविधः । वैकृतिको भूतादिस्तैजसश्चेति
    । तत्र वैकृतादिन्द्रियाण्युत्पद्यन्ते भूतादेस्तन्मात्राणि तैजसादुभयम् इन्द्रियाणि तन्मात्राणि चेति
    । तन्मात्रेभ्यो भूतानि । अयं सञ्चरः । प्रतिसञ्चरो नाम भूतानि तन्मात्रेषु लीयन्ते । तन्मात्राणीन्द्रियाणि
    चाहंकारे । अहंकारो बुद्धौ । बुद्धिरव्यक्ते । ततोऽव्यक्तं तु क्वचिन्न लीयते कस्मात् अनुत्पन्नत्वात्
    । इत्येवं प्रतिसञ्चरः । एवमेतौ सञ्चरप्रतिसञ्चरौ व्याख्यातौ ॥ अत्राह किंविधमध्यात्ममधिभूतमधिदैवतं च
    । अत्रोच्यते । बुद्धिरध्यात्मम् । बोधयितव्यमधिभूतम् । ब्रह्मा तत्रादिदैवतम् । अहंकारोऽध्यात्मम् ।
    अभिमन्तव्यमधिभूतम् । रुद्रस्तत्राधिदैवतम् । मनोध्यात्मं संकल्पमधिभूतम् । चन्द्रस्तत्रादिदैवतम् । श्रोत्रमध्यात्मम्
    । स्पर्शयितव्यमधिभूतम् । वायुस्तत्राधिदैवतम् । चक्षुरध्यात्मम् । दर्शयितव्यमधिभूतम् । सूर्यस्तत्रादिदैवतम्
    । जिह्वाध्यात्मम् । रसयितव्यमधिभूतम् । वरुणस्तत्राधिदैवतम् । नासाध्यात्मम् । घ्रातव्यमधिभूतम् । पृथिवी
    तत्राधिदैवतम् । वागध्यात्मम् । वक्तव्यमधिभूतम् । अग्निस्तत्राधिदैवतम् । पाणिरध्यात्मम् । आदातव्यमधिभूतम्
    । इन्द्रस्तत्राधिदैवतम् । पादावध्यात्मम् । गन्तव्यमधिभूतम् । विष्णुस्तत्राधिदैवतम् । पायुरध्यात्मम्
    । उत्स्रष्टाव्यमधिभूतम् । मित्रस्तत्राधिदैवतम् । उपस्थमध्यात्मम् । आनन्दयितव्यमधिभूतम् । प्रजापतिस्तत्राधिदैवतम्
    । एवमेव त्रयोदशकरणस्याध्यात्ममधिभूतमधिदैवं च व्याख्यातम् । कानि चत्वारीत्यत आह चेति । त्रीणि गुणरूपाणि
    चतुर्थमधिदैवतमित्यर्थः ॥ चत्वारि यो वेदयते यथावद् गुणस्वरूपाण्यधिदैवतं च । विमुक्तपाप्मा गतदोषसङ्गो
    गुणांस्तु भुङ्क्ते न गुणैः स भुज्यते ॥ अथ कास्ता अभिबुद्धय इत्युच्यन्ते । पञ्चाभिबुद्धयः । बुद्धिरभिमान
    इच्छा कर्तव्यं तत्क्रिया चेति । अभिमुखी बुद्धिरभिबुद्धिः । इदं करणीयमेत्येतदध्यवसायो बुद्धिः क्रियात्मपरामर्शस्वरूपप्रत्ययः
    । अभिमुखो मानोऽहं करोमीत्यहंकारोऽभिमानः । बुद्धिक्रिया इच्छा वाञ्छा । कर्तव्यं संकल्पो मनसो वृत्तिः
    । क्रिया एतद्वस्तुस्वरूपमिति कर्तव्यालोचनं यद्बुद्धीन्द्रियाणां सा क्रिया । इत्थमेतत् कर्तव्यमिति
    यत्प्रवृत्तिः कर्मेन्द्रियाणां सा क्रियेति । एवमेताह पञ्चाभिबुद्धयो व्याख्याताः ॥ अथ काः पञ्चकर्मयोनयः
    उच्यन्ते । धृतिः श्रद्धा सुखा अविविदिषा विविदिषा चेति पञ्च कर्मयोनयः । वाचि कर्मणि काये च प्रतीतिर्याभिरज्यते
    । तन्निष्ठस्तत्प्रतिष्ठश्च धृतेरेतद्धि लक्षणम् ॥ अनसूया ब्रह्मचर्यं यजनं याजनं तपः । प्रतिग्रहोऽत्रहोमश्च
    श्रद्धाया लक्षणं स्मृतम् ॥ सुखार्थी यस्तु सेवेत विद्याकर्मतपांसि च । प्रायश्चित्तपरो नित्यं सुखेयं
    परिकीर्तिता ॥ विषधूममूर्छितवदविविदिषा । विविदिषा ध्यायिनां प्रज्ञायोनिः । एकत्वं च पृथक्त्वं च नित्यं
    चेदमचेतनम् । सूक्ष्मं सत्कार्यमक्षोभ्यं ज्ञेया विविदिषा हि सा ॥ कार्यकारणक्षमकरा विविदिषा प्राकृतिका
    वृत्तिः । धृतिः श्रद्धा सुखा अविविदिषा चतस्रो बन्धाय विविदिषैका मोक्षाय इति पञ्च कर्मयोनयो व्याख्याताः
    ॥ अत्राह के ते पञ्चवायवः । उच्यन्ते । प्राणोऽपानः समानश्च उदानो व्यान एव च । इत्येते वायवः पञ्च शरीरेषु
    शरीरिणाम् ॥ तत्र प्राणो नाम वायुर्योऽयं मुखनासिकाधिष्ठानप्राणनात् क्रमेणाननात् प्राण इत्यभिधीयते ।
    अपानो नाम वायुर्नाभेरधिष्ठाता अपनयनादधोगमनाच्चापान इत्यभिधीयते । समानो नाम वायुर्हृदधिष्ठाता समनात्
    समगमनाच्च समान इत्यभिधीयते । उदानो नाम वायुः कण्ठाधिष्ठाता ऊर्ध्वं गमनाच्च उदान इत्यभिधीयते । व्यानो
    नाम वायुः सन्ध्यधिष्ठाता प्राणादिजृम्भणाच्च व्यान इत्यभिधीयते । इति पञ्चवायवो व्याख्याताः ॥ आह के
    ते पञ्चकर्मात्मानः उच्यन्ते । वैकारिकस्तैजसो भूतादिश्च सानुमानो निरनुमानश्चेति । तत्र वैकारिकः शुभकर्मकर्ता
    । तैजसोऽशुभकर्मकर्ता । भूतादिर्मूढकर्मकर्ता । सानुमानः शुभमूढकर्मकर्ता । निरनुमानोऽशुभमूढकर्मकर्ता
    । इत्येते पञ्चकर्मकर्तारो व्याख्याताः ॥ आह का सा पञ्चपर्वाविद्येति । उच्यते । तमो मोहो महामोहस्तामिस्रोऽन्धतामिस्रश्चेति
    । तत्र तमोमोहावुभावेतावष्टात्माकौ । महामोहो दशात्मकः । तामिस्रान्धतामिस्रौ चाष्टादशात्माकौ । तत्र
    तमो नामाष्टासु प्रकृतिष्वव्यक्तबुद्ध्यहंकारपञ्चतन्मात्रसञ्ज्ञितासु अनात्मस्वात्मज्ञानाभिमानस्तम इत्यभिधीयते
    । मोहो नामाणिमाद्यष्टागुणैश्वर्यप्राप्तये योभिमान उत्पद्यते स मोह इत्यभिधीयते । महामोहो नाम दृष्टानुश्रविकेषु
    विषयेषु दशसु निवृत्तेषु मुक्तोऽहमिति मन्यते स महामोह इत्यभिधीयते । तामिस्रो नाम अष्टगुणैश्वर्येऽणिमाद्ये
    दशविधे च विषये प्रतिहतस्य दुःखमुत्पद्यतेऽसौ तामिस्र इत्यभिधीयते । अन्धतामिस्रो नाम अणिमाद्यष्टगुणैश्वर्ये
    दशविधे च विषये सिद्धे मरणकाले च यो विषादः प्रत्यपद्यते सोऽन्धतामिस्र इत्यभिधीयते । एवमेषा पञ्चपर्वाऽविद्या
    द्विषष्टिभेदा व्याख्याता ॥ अत्राह काष्टाविंशतिधाशक्तिः । अत्रोच्यते । एकादशेन्द्रियवधाः सप्तदशबुद्धिवधाः
    । एषाष्टाविंशतिधाशक्तिः । तत्रेन्द्रियवधास्तावत् । बधिरस्त्वक्बधिरः अन्धः जडजिह्वः अजिघ्रः मूकः कुणिः
    पङ्गुः नपुंसकः ऊर्ध्ववायुयुक्तः अमनाः । तदुक्तम् । बाधिर्यं कुष्ठितान्धस्त्वं जडताऽजिघ्रता तथा । मूकता
    कौण्यपङ्गुत्वं क्लैब्योदावर्तमत्तताः ॥ एतेदिन्द्रियद्वारा बुद्धेरेव वधाः । साक्षाद्बुद्धिवधा यथा ।
    नवविधतुष्टिवैकल्यात् अष्टविधासिद्धवैकल्याच्च सप्तदशबुद्धिवधा इत्यष्टाविंशतिधाशक्तिः ॥ का पुनर्नवधा
    तुष्टिः उच्यते । चतस्र आद्यात्मिक्यस्तुष्टयः बाह्याः पञ्च । आद्याः प्रकृत्युपादानकालभाग्याख्याः ।
    प्रकृत्यैव मुक्तिः किं पुनः साधनैरिति तुष्टिः प्रकृत्याख्या अम्भो नाम । साधनैः संन्यासादिभिरुपात्तैस्तुष्टिः
    साधानाख्या सलिलं नाम । कालेनैव मुक्त्यादिकं सेत्स्यति किं दुःखैः संन्यासादिसाधनैरिति तुष्टिः कालाख्याऽघो
    नाम । या तु भाग्यादेव सर्वं सेत्स्यति किं साधनादिध्यानादिक्लेशैरिति सा भाग्याख्या तुष्टिर्नाम । बाह्याः
    शब्दादिविषयवैराग्यास्तुष्टयः अर्जनरक्षणक्षयभोगहिंसादोषदर्शनं वैराग्यहेतुः पञ्चविधस्तद्भेदेन पञ्चतुष्टयः
    ॥ अथ काः सिद्धयः उच्यन्ते । अष्टौ सिद्धयः । उच्यन्ते । अध्ययनं तारं नाम सिद्धिः । ततोऽर्थज्ञानं सुतारं
    नाम । ततस्तर्केणार्थपरीक्षणं तारतारं नाम सिद्धिः । ततः परीक्षकसंवादनं रम्यकं नाम । ततो विवेकख्यातिः
    सदामुदितं नाम । एताः पञ्च गौण्यः सिद्धयः । दुःखत्रयविघातास्तास्त्रयो मुख्याः सिद्धयः । प्रमोदमुदितमोदनामाख्याः
    फलमित्यष्टौ सिद्धयः । तुष्टिसिद्धीनां विपर्ययात् सप्तदशधा वुद्धिवधाः ॥ के पुनर्मौलिकार्थाः कतिधा उच्यन्ते
    । दशधा मौलिकार्थाह । एकत्वमर्थवत्त्वं पारार्थ्यं प्रधानस्य । अन्यत्वमकर्तृत्वं बहुत्वं पुरुषस्य ।
    अस्तित्वं योगो वियोगश्चेत्युभययोः । शेषवृत्तिः परिशिष्टत्वं प्रलये तदुभययोः । तदुक्तम् प्रधानास्तित्वमेकत्वमर्थवत्त्वं
    यथार्थता । पारार्थ्यं च तथा नैक्यं वियोगो योग एव च ॥ शेषवृत्तिरकर्तृत्वं मौलिकार्थाः स्मृता दश ॥ इति
    । अत्राह कोऽनुग्रहसर्गः । अनुगृह्णाति प्रत्ययभूतादिसर्गं यः सर्गः सोऽनुग्रहसर्गः । तन्मात्रसर्ग एवासौ
    विशेषापरनामा । के विशेषाः कियन्तश्च । उच्यन्ते । लिङ्गदेहाह स्थूलदेहाः स्थूलभूतानि च । तत्र लिङ्गं
    स्थूलदेहात् पूर्वमुत्पन्नमव्याहतं स्थूलनाशेऽप्यनश्वरम् । महदहंकारेन्द्रियतन्मात्रात्मकम् । धर्माधर्मज्ञानाज्ञानवैराग्यावैराग्यैश्वर्यानैश्वर्याख्यभाववासितं
    संसरति । स्थूलभूतानि तु भूगोलसमुद्रवह्निशिशुमारब्रह्माण्डविराटादीनि । स्थूलदेहाः के कतिविधाश्चेति
    उच्यते ॥ चतुर्दशविधो भूतसर्गः । तत्राष्टाविकल्पो दैवस्तैर्यग्योनः पञ्चधा मानुष्य एकविधः ब्राह्मः प्राजापत्यः
    पैत्रे गान्धर्वो याक्षो राक्षसः पैशाचाश्च दैवसर्गः पशुमृगसरीसृपस्थावराः तिरश्चां सर्गः । ब्राह्मणादिजातिभेदेऽपि
    संस्थाने विशेषाभावात् एकविधो मानुष्य इति चतुर्दशविधाः स्थूलदेहाः । कह पुनर्बन्धः कतिधा च । त्रिविधो
    बन्धः । काः पुनस्ता विधा उच्यन्ते । प्राकृतिको वैकृतिको दाक्षणिकश्च बन्धः । प्रकृतिमात्मानं ज्ञात्वा
    तच्चिन्तनात् प्राकृतिकः अत्रोच्यते पूर्णवर्षसहस्रं तु तिष्ठन्त्यव्यक्तचिन्तका इति । महदादीनात्मत्वेन
    ज्ञात्वा तच्चिन्तनाद्वैकारिकः । अत्रोच्यते । दशमन्वन्तराणीह तिष्ठन्तीन्द्रियचिन्तकाः । भौतिकास्तु
    शतं पूर्णं सहस्रं चाभिमानिकाः ॥ बौद्धा दशसहस्राणि तिष्ठन्ति विगतज्वराः । अमी विदेहाः । इष्टापूर्त्ती
    दक्षिणा तन्निमित्तो दाक्षणिकः अत्रोच्यते । स्वर्गस्था नरकं यान्ति नारकाश्च त्रिविष्टपमिति । गतागतं
    कामकामा लभन्त इति च । अत एव हि त्रिष्वपि बन्धेषु एकैकापाये ततस्ततो मोक्ष इति । त्रिविधो मोक्षः । कर्मणो
    विकारात् प्राकृतश्च मोक्षः । यदुक्तम् । प्राकृतेन च बन्धेन तथा वैकारिकेण च । दक्षिणाभिस्तृतीयेन वृद्धो
    नान्येन मुच्यते ॥ इति । अथ कुतस्त्यानां तत्त्वानां सिद्धिः । प्रमाणादिति ब्रूमः । तत्र प्रमाणं किं
    कतिविधम वा उच्यते त्रिविधं प्रमाणम् । तिस्रो विधा यस्येति त्रिविधम् । कास्ता विधाः । उच्यते । दृष्टमनुमानमाप्तवचनं
    च । अर्थसन्निकृष्टेन्द्रियजो निश्चयो दृष्टम् । इन्द्रियाणि पञ्च चक्षुरादीनि मनश्च । व्याप्तिपक्षधर्मताज्ञानपूर्वकमनुमानम्
    । तच्च त्रिविधम् । पूर्ववत् शेषवत् सामान्यतो दृष्टं च । पूर्ववद्यथा कर्दमेन पूर्ववृत्तवृष्ट्यनुमानम्
    । शेषवद्यथा । समुद्रातपलमुदकं
