id: mrityunjayajapavidhihtryakshari
category: mantra
name:
  english: mrityunjayajapavidhihtryakshari
  devanagari: मृत्युन्जयजपविधिःत्र्यक्षरी
content:
  english: sarvarishtalpamrityunasharthe jape viniyogah | kaholarishaye namah shirase | devigayatricchandase
    namah mukhe | shrimrityunjayadevatayai namah hridi | ju~ bijaya namah guhye | sah shaktaye namah padayoh
    | om kilakaya namah sarvange | iti hridayadinyasah || atha karanyasah
  devanagari: सर्वारिष्टाल्पमृत्युनाशार्थे जपे विनियोगः । कहोलऋषये नमः शिरसे । देवीगायत्रीच्छन्दसे नमः
    मुखे । श्रीमृत्युञ्जयदेवतायै नमः हृदि । जूँ बीजाय नमः गुह्ये । सः शक्तये नमः पादयोः । ॐ कीलकाय नमः
    सर्वाङ्गे । इति हृदयादिन्यासः ॥ अथ करन्यासः
meaning: {}
