id: annamayya-keerthanas-anni-mantramulu
category: stotram
name:
  english: Annamayya Keerthanas Anni Mantramulu
content:
  english: adi pallavi anni mantramulu ninde avahincènu vènnato naku galigè venkateshu mantramu || naradundu
    japiyincè narayana mantramu cerè prahladudu narasimha mantramu | kori vibhishanundu cekònè rama mantramu
    verè naku galigè venkateshu mantramu || anni mantramulu ninde avahincènu rangagu vasudeva mantramu
    dhruvundu japiyincè nanga vimvè krishna mantra marjunundunu | mungita vishnu mantramu mògi shukudu
    pathincè vingadamai naku nabbè venkateshu mantramu || anni mantramulu ninde avahincènu inni mantramula
    kèlla indira nadhundè guri pannina didiyè para brahma mantramu | nannugava kaligè bo naku guru diyyaganu
    vènnèla vantidi shri venkateshu mantramu || anni mantramulu ninde avahincènu
  devanagari: आदि पल्लवि अन्नि मन्त्रमुलु निन्दे आवहिञ्चॆनु वॆन्नतो नाकु गलिगॆ वेङ्कटेशु मन्त्रमु ॥ नारदुण्डु
    जपियिञ्चॆ नारायण मन्त्रमु चेरॆ प्रह्लादुडु नारसिंह मन्त्रमु । कोरि विभीषणुण्डु चेकॊनॆ राम मन्त्रमु
    वेरॆ नाकु गलिगॆ वेङ्कटेशु मन्त्रमु ॥ अन्नि मन्त्रमुलु निन्दे आवहिञ्चॆनु रङ्गगु वासुदेव मन्त्रमु ध्रुवुण्डु
    जपियिञ्चॆ नङ्ग विंवॆ कृष्ण मन्त्र मर्जुनुण्डुनु । मुङ्गिट विष्णु मन्त्रमु मॊगि शुकुडु पठिञ्चॆ विङ्गडमै
    नाकु नब्बॆ वेङ्कटेशु मन्त्रमु ॥ अन्नि मन्त्रमुलु निन्दे आवहिञ्चॆनु इन्नि मन्त्रमुल कॆल्ल इन्दिरा नाधुण्डॆ
    गुरि पन्निन दिदियॆ पर ब्रह्म मन्त्रमु । नन्नुगाव कलिगॆ बो नाकु गुरु डिय्यगानु वॆन्नॆल वण्टिदि श्री
    वेङ्कटेशु मन्त्रमु ॥ अन्नि मन्त्रमुलु निन्दे आवहिञ्चॆनु
