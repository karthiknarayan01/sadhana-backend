id: ekashlokisundarakandam
category: stotram
name:
  english: ekashlokisundarakandam
  devanagari: एकश्लोकीसुन्दरकाण्डम्
content:
  english: ekashloki sundarakandam yasya shrihanumananugraha balattirnambudhirlilaya lankam prapya nishamya
    ramadayitam bhanktva vanam rakshasan | akshadin vinihatya vikshya dashakam dagdhva purim tam punah
    tirnabdhih kapibhiryuto yamanamat tam ramacandrambhaje || iti raghavendrasvamiviracitam ekashloki
    sundarakandam sampurnam |
  devanagari: एकश्लोकी सुन्दरकाण्डम् यस्य श्रीहनुमाननुग्रह बलात्तीर्णाम्बुधिर्लीलया लङ्कां प्राप्य निशाम्य
    रामदयिताम् भङ्क्त्वा वनं राक्षसान् । अक्षादीन् विनिहत्य वीक्ष्य दशकम् दग्ध्वा पुरीं तां पुनः तीर्णाब्धिः
    कपिभिर्युतो यमनमत् तम् रामचन्द्रम्भजे ॥ इति राघवेन्द्रस्वामिविरचितं एकश्लोकी सुन्दरकाण्डं सम्पूर्णम्
    ।
meaning: {}
