    गन्धर्ब सुर मुनि नाग किन्नर दुख टरे ॥ कटकटहिं मर्कट बिकट भट बहु कोटि कोटिन्ह धावहीं। जय राम प्रबल
    प्रताप कोसलनाथ गुन गन गावहीम् ॥ ॥ सहि सक न भार उदार अहिपति बार बारहिं मोही। गह दसन पुनि पुनि कमठ पृष्ट
    कठोर सो किमि सोही ॥ रघुबीर रुचिर प्रयान प्रस्थिति जानि परम सुहावनी। जनु कमठ खर्पर सर्पराज सो लिखत
    अबिचल पावनी ॥ एहि बिधि जाइ कृपानिधि उतरे सागर तीर। जहँ तहँ लागे खान फल भालु बिपुल कपि बीर ॥ ॥ उहाँ
    निसाचर रहहिं ससङ्का। जब ते जारि गयु कपि लङ्का ॥ निज निज गृहँ सब करहिं बिचारा। नहिं निसिचर कुल केर
    उबारा ॥ जासु दूत बल बरनि न जाई। तेहि आएँ पुर कवन भलाई ॥ दूतन्हि सन सुनि पुरजन बानी। मन्दोदरी अधिक
    अकुलानी ॥ रहसि जोरि कर पति पग लागी। बोली बचन नीति रस पागी ॥ कन्त करष हरि सन परिहरहू। मोर कहा अति हित
    हियँ धरहु ॥ समुझत जासु दूत कि करनी। स्त्रवहीं गर्भ रजनीचर धरनी ॥ तासु नारि निज सचिव बोलाई। पठवहु कन्त
    जो चहहु भलाई ॥ तब कुल कमल बिपिन दुखदाई। सीता सीत निसा सम आई ॥ सुनहु नाथ सीता बिनु दीन्हें। हित न तुम्हार
    सम्भु अज कीन्हेम् ॥ दो राम बान अहि गन सरिस निकर निसाचर भेक। जब लगि ग्रसत न तब लगि जतनु करहु तजि टेक
    ॥ ॥ श्रवन सुनी सठ ता करि बानी। बिहसा जगत बिदित अभिमानी ॥ सभय सुभाउ नारि कर साचा। मङ्गल महुँ भय मन
    अति काचा ॥ जौं आवि मर्कट कटकाई। जिअहिं बिचारे निसिचर खाई ॥ कम्पहिं लोकप जाकी त्रासा। तासु नारि सभीत
    बड़इ हासा ॥ अस कहि बिहसि ताहि उर लाई। चलेउ सभाँ ममता अधिकाई ॥ मन्दोदरी हृदयँ कर चिन्ता। भयु कन्त पर
    बिधि बिपरीता ॥ बैठेउ सभाँ खबरि असि पाई। सिन्धु पार सेना सब आई ॥ बूझेसि सचिव उचित मत कहहू। ते सब हँसे
    मष्ट करि रहहू ॥ जितेहु सुरासुर तब श्रम नाहीं। नर बानर केहि लेखे माही ॥ दो सचिव बैद गुर तीनि जौं प्रिय
    बोलहिं भय आस। राज धर्म तन तीनि कर होइ बेगिहीं नास ॥ ॥ सोइ रावन कहुँ बनि सहाई। अस्तुति करहिं सुनाइ
    सुनाई ॥ अवसर जानि बिभीषनु आवा। भ्राता चरन सीसु तेहिं नावा ॥ पुनि सिरु नाइ बैठ निज आसन। बोला बचन पाइ
    अनुसासन ॥ जौ कृपाल पूँछिहु मोहि बाता। मति अनुरुप कहुँ हित ताता ॥ जो आपन चाहै कल्याना। सुजसु सुमति
    सुभ गति सुख नाना ॥ सो परनारि लिलार गोसाईं। तजु चुथि के चन्द कि नाई ॥ चौदह भुवन एक पति होई। भूतद्रोह
    तिष्टि नहिं सोई ॥ गुन सागर नागर नर जोऊ। अलप लोभ भल कहि न कोऊ ॥ दो काम क्रोध मद लोभ सब नाथ नरक के पन्थ।
    सब परिहरि रघुबीरहि भजहु भजहिं जेहि सन्त ॥ ॥ तात राम नहिं नर भूपाला। भुवनेस्वर कालहु कर काला ॥ ब्रह्म
    अनामय अज भगवन्ता। ब्यापक अजित अनादि अनन्ता ॥ गो द्विज धेनु देव हितकारी। कृपासिन्धु मानुष तनुधारी ॥
    जन रञ्जन भञ्जन खल ब्राता। बेद धर्म रच्छक सुनु भ्राता ॥ ताहि बयरु तजि नाइअ माथा। प्रनतारति भञ्जन रघुनाथा
    ॥ देहु नाथ प्रभु कहुँ बैदेही। भजहु राम बिनु हेतु सनेही ॥ सरन गेँ प्रभु ताहु न त्यागा। बिस्व द्रोह
    कृत अघ जेहि लागा ॥ जासु नाम त्रय ताप नसावन। सोइ प्रभु प्रगट समुझु जियँ रावन ॥ दो बार बार पद लागुँ
    बिनय करुँ दससीस। परिहरि मान मोह मद भजहु कोसलाधीस ॥ ॥ मुनि पुलस्ति निज सिष्य सन कहि पठी यह बात। तुरत
    सो मैं प्रभु सन कही पाइ सुअवसरु तात ॥ ॥ माल्यवन्त अति सचिव सयाना। तासु बचन सुनि अति सुख माना ॥ तात
    अनुज तव नीति बिभूषन। सो उर धरहु जो कहत बिभीषन ॥ रिपु उतकरष कहत सठ दोऊ। दूरि न करहु इहाँ हि कोऊ ॥ माल्यवन्त
    गृह गयु बहोरी। कहि बिभीषनु पुनि कर जोरी ॥ सुमति कुमति सब कें उर रहहीं। नाथ पुरान निगम अस कहहीम् ॥
    जहाँ सुमति तहँ सम्पति नाना। जहाँ कुमति तहँ बिपति निदाना ॥ तव उर कुमति बसी बिपरीता। हित अनहित मानहु
    रिपु प्रीता ॥ कालराति निसिचर कुल केरी। तेहि सीता पर प्रीति घनेरी ॥ दो तात चरन गहि मागुँ राखहु मोर
    दुलार। सीत देहु राम कहुँ अहित न होइ तुम्हार ॥ ॥ बुध पुरान श्रुति सम्मत बानी। कही बिभीषन नीति बखानी
    ॥ सुनत दसानन उठा रिसाई। खल तोहि निकट मुत्यु अब आई ॥ जिअसि सदा सठ मोर जिआवा। रिपु कर पच्छ मूढ़ तोहि
    भावा ॥ कहसि न खल अस को जग माहीं। भुज बल जाहि जिता मैं नाही ॥ मम पुर बसि तपसिन्ह पर प्रीती। सठ मिलु
    जाइ तिन्हहि कहु नीती ॥ अस कहि कीन्हेसि चरन प्रहारा। अनुज गहे पद बारहिं बारा ॥ उमा सन्त कि इहि बड़आई।
    मन्द करत जो करि भलाई ॥ तुम्ह पितु सरिस भलेहिं मोहि मारा। रामु भजें हित नाथ तुम्हारा ॥ सचिव सङ्ग लै
    नभ पथ गयू। सबहि सुनाइ कहत अस भयू ॥ दो रामु सत्यसङ्कल्प प्रभु सभा कालबस तोरि। मै रघुबीर सरन अब जाउँ
    देहु जनि खोरि ॥ ॥ अस कहि चला बिभीषनु जबहीं। आयूहीन भे सब तबहीम् ॥ साधु अवग्या तुरत भवानी। कर कल्यान
    अखिल कै हानी ॥ रावन जबहिं बिभीषन त्यागा। भयु बिभव बिनु तबहिं अभागा ॥ चलेउ हरषि रघुनायक पाहीं। करत
    मनोरथ बहु मन माहीम् ॥ देखिहुँ जाइ चरन जलजाता। अरुन मृदुल सेवक सुखदाता ॥ जे पद परसि तरी रिषिनारी। दण्डक
    कानन पावनकारी ॥ जे पद जनकसुताँ उर लाए। कपट कुरङ्ग सङ्ग धर धाए ॥ हर उर सर सरोज पद जेई। अहोभाग्य मै
    देखिहुँ तेई ॥ दो जिन्ह पायन्ह के पादुकन्हि भरतु रहे मन लाइ। ते पद आजु बिलोकिहुँ इन्ह नयनन्हि अब जाइ
    ॥ ॥ एहि बिधि करत सप्रेम बिचारा। आयु सपदि सिन्धु एहिं पारा ॥ कपिन्ह बिभीषनु आवत देखा। जाना कौ रिपु
    दूत बिसेषा ॥ ताहि राखि कपीस पहिं आए। समाचार सब ताहि सुनाए ॥ कह सुग्रीव सुनहु रघुराई। आवा मिलन दसानन
    भाई ॥ कह प्रभु सखा बूझिऐ काहा। कहि कपीस सुनहु नरनाहा ॥ जानि न जाइ निसाचर माया। कामरूप केहि कारन आया
    ॥ भेद हमार लेन सठ आवा। राखिअ बाँधि मोहि अस भावा ॥ सखा नीति तुम्ह नीकि बिचारी। मम पन सरनागत भयहारी
    ॥ सुनि प्रभु बचन हरष हनुमाना। सरनागत बच्छल भगवाना ॥ दो सरनागत कहुँ जे तजहिं निज अनहित अनुमानि। ते
    नर पावँर पापमय तिन्हहि बिलोकत हानि ॥ ॥ कोटि बिप्र बध लागहिं जाहू। आएँ सरन तजुँ नहिं ताहू ॥ सनमुख होइ
    जीव मोहि जबहीं। जन्म कोटि अघ नासहिं तबहीम् ॥ पापवन्त कर सहज सुभ् । भजनु मोर तेहि भाव न क् ॥ जौं पै
    दुष्टहृदय सोइ होई। मोरें सनमुख आव कि सोई ॥ निर्मल मन जन सो मोहि पावा। मोहि कपट छल छिद्र न भावा ॥ भेद
    लेन पठवा दससीसा। तबहुँ न कछु भय हानि कपीसा ॥ जग महुँ सखा निसाचर जेते। लछिमनु हनि निमिष महुँ तेते ॥
    जौं सभीत आवा सरनाई। रखिहुँ ताहि प्रान की नाई ॥ दो उभय भाँति तेहि आनहु हँसि कह कृपानिकेत। जय कृपाल
    कहि चले अङ्गद हनू समेत ॥ ॥ सादर तेहि आगें करि बानर। चले जहाँ रघुपति करुनाकर ॥ दूरिहि ते देखे द्वौ
    भ्राता। नयनानन्द दान के दाता ॥ बहुरि राम छबिधाम बिलोकी। रहेउ ठटुकि एकटक पल रोकी ॥ भुज प्रलम्ब कञ्जारुन
    लोचन। स्यामल गात प्रनत भय मोचन ॥ सिङ्घ कन्ध आयत उर सोहा। आनन अमित मदन मन मोहा ॥ नयन नीर पुलकित अति
    गाता। मन धरि धीर कही मृदु बाता ॥ नाथ दसानन कर मैं भ्राता। निसिचर बंस जनम सुरत्राता ॥ सहज पापप्रिय
    तामस देहा। जथा उलूकहि तम पर नेहा ॥ दो श्रवन सुजसु सुनि आयुँ प्रभु भञ्जन भव भीर। त्राहि त्राहि आरति
    हरन सरन सुखद रघुबीर ॥ ॥ अस कहि करत दण्डवत देखा। तुरत उठे प्रभु हरष बिसेषा ॥ दीन बचन सुनि प्रभु मन
    भावा। भुज बिसाल गहि हृदयँ लगावा ॥ अनुज सहित मिलि ढिग बैठारी। बोले बचन भगत भयहारी ॥ कहु लङ्केस सहित
    परिवारा। कुसल कुठाहर बास तुम्हारा ॥ खल मण्डलीं बसहु दिनु राती। सखा धरम निबहि केहि भाँती ॥ मैं जानुँ
    तुम्हारि सब रीती। अति नय निपुन न भाव अनीती ॥ बरु भल बास नरक कर ताता। दुष्ट सङ्ग जनि देइ बिधाता ॥ अब
    पद देखि कुसल रघुराया। जौं तुम्ह कीन्ह जानि जन दाया ॥ दो तब लगि कुसल न जीव कहुँ सपनेहुँ मन बिश्राम।
    जब लगि भजत न राम कहुँ सोक धाम तजि काम ॥ ॥ तब लगि हृदयँ बसत खल नाना। लोभ मोह मच्छर मद माना ॥ जब लगि
    उर न बसत रघुनाथा। धरें चाप सायक कटि भाथा ॥ ममता तरुन तमी अँधिआरी। राग द्वेष उलूक सुखकारी ॥ तब लगि
    बसति जीव मन माहीं। जब लगि प्रभु प्रताप रबि नाहीम् ॥ अब मैं कुसल मिटे भय भारे। देखि राम पद कमल तुम्हारे
    ॥ तुम्ह कृपाल जा पर अनुकूला। ताहि न ब्याप त्रिबिध भव सूला ॥ मैं निसिचर अति अधम सुभ् । सुभ आचरनु कीन्ह
    नहिं क् ॥ जासु रूप मुनि ध्यान न आवा। तेहिं प्रभु हरषि हृदयँ मोहि लावा ॥ दो अहोभाग्य मम अमित अति राम
    कृपा सुख पुञ्ज। देखेउँ नयन बिरञ्चि सिब सेब्य जुगल पद कञ्ज ॥ ॥ सुनहु सखा निज कहुँ सुभ् । जान भुसुण्डि
    सम्भु गिरिज् ॥ जौं नर होइ चराचर द्रोही। आवे सभय सरन तकि मोही ॥ तजि मद मोह कपट छल नाना। करुँ सद्य तेहि
    साधु समाना ॥ जननी जनक बन्धु सुत दारा। तनु धनु भवन सुह्रद परिवारा ॥ सब कै ममता ताग बटोरी। मम पद मनहि
    बाँध बरि डोरी ॥ समदरसी इच्छा कछु नाहीं। हरष सोक भय नहिं मन माहीम् ॥ अस सज्जन मम उर बस कैसें। लोभी
    हृदयँ बसि धनु जैसेम् ॥ तुम्ह सारिखे सन्त प्रिय मोरें। धरुँ देह नहिं आन निहोरेम् ॥ दो सगुन उपासक परहित
    निरत नीति दृढ़ नेम। ते नर प्रान समान मम जिन्ह कें द्विज पद प्रेम ॥ ॥ सुनु लङ्केस सकल गुन तोरें। तातें
    तुम्ह अतिसय प्रिय मोरेम् ॥ राम बचन सुनि बानर जूथा। सकल कहहिं जय कृपा बरूथा ॥ सुनत बिभीषनु प्रभु कै
    बानी। नहिं अघात श्रवनामृत जानी ॥ पद अम्बुज गहि बारहिं बारा। हृदयँ समात न प्रेमु अपारा ॥ सुनहु देव
    सचराचर स्वामी। प्रनतपाल उर अन्तरजामी ॥ उर कछु प्रथम बासना रही। प्रभु पद प्रीति सरित सो बही ॥ अब कृपाल
    निज भगति पावनी। देहु सदा सिव मन भावनी ॥ एवमस्तु कहि प्रभु रनधीरा। मागा तुरत सिन्धु कर नीरा ॥ जदपि
    सखा तव इच्छा नाहीं। मोर दरसु अमोघ जग माहीम् ॥ अस कहि राम तिलक तेहि सारा। सुमन बृष्टि नभ भी अपारा ॥
    दो रावन क्रोध अनल निज स्वास समीर प्रचण्ड। जरत बिभीषनु राखेउ दीन्हेहु राजु अखण्ड ॥ ॥ जो सम्पति सिव
    रावनहि दीन्हि दिएँ दस माथ। सोइ सम्पदा बिभीषनहि सकुचि दीन्ह रघुनाथ ॥ ॥ अस प्रभु छाड़इ भजहिं जे आना।
    ते नर पसु बिनु पूँछ बिषाना ॥ निज जन जानि ताहि अपनावा। प्रभु सुभाव कपि कुल मन भावा ॥ पुनि सर्बग्य सर्ब
    उर बासी। सर्बरूप सब रहित उदासी ॥ बोले बचन नीति प्रतिपालक। कारन मनुज दनुज कुल घालक ॥ सुनु कपीस लङ्कापति
    बीरा। केहि बिधि तरिअ जलधि गम्भीरा ॥ सङ्कुल मकर उरग झष जाती। अति अगाध दुस्तर सब भाँती ॥ कह लङ्केस सुनहु
    रघुनायक। कोटि सिन्धु सोषक तव सायक ॥ जद्यपि तदपि नीति असि गाई। बिनय करिअ सागर सन जाई ॥ दो प्रभु तुम्हार
    कुलगुर जलधि कहिहि उपाय बिचारि। बिनु प्रयास सागर तरिहि सकल भालु कपि धारि ॥ ॥ सखा कही तुम्ह नीकि उपाई।
    करिअ दैव जौं होइ सहाई ॥ मन्त्र न यह लछिमन मन भावा। राम बचन सुनि अति दुख पावा ॥ नाथ दैव कर कवन भरोसा।
    सोषिअ सिन्धु करिअ मन रोसा ॥ कादर मन कहुँ एक अधारा। दैव दैव आलसी पुकारा ॥ सुनत बिहसि बोले रघुबीरा।
    ऐसेहिं करब धरहु मन धीरा ॥ अस कहि प्रभु अनुजहि समुझाई। सिन्धु समीप गे रघुराई ॥ प्रथम प्रनाम कीन्ह सिरु
    नाई। बैठे पुनि तट दर्भ डसाई ॥ जबहिं बिभीषन प्रभु पहिं आए। पाछें रावन दूत पठाए ॥ दो सकल चरित तिन्ह
    देखे धरें कपट कपि देह। प्रभु गुन हृदयँ सराहहिं सरनागत पर नेह ॥ ॥ प्रगट बखानहिं राम सुभ् । अति सप्रेम
    गा बिसरि दुर् ॥ रिपु के दूत कपिन्ह तब जाने। सकल बाँधि कपीस पहिं आने ॥ कह सुग्रीव सुनहु सब बानर। अङ्ग
    भङ्ग करि पठवहु निसिचर ॥ सुनि सुग्रीव बचन कपि धाए। बाँधि कटक चहु पास फिराए ॥ बहु प्रकार मारन कपि लागे।
    दीन पुकारत तदपि न त्यागे ॥ जो हमार हर नासा काना। तेहि कोसलाधीस कै आना ॥ सुनि लछिमन सब निकट बोलाए।
    दया लागि हँसि तुरत छोडाए ॥ रावन कर दीजहु यह पाती। लछिमन बचन बाचु कुलघाती ॥ दो कहेहु मुखागर मूढ़ सन
    मम सन्देसु उदार। सीता देइ मिलेहु न त आवा काल तुम्हार ॥ ॥ तुरत नाइ लछिमन पद माथा। चले दूत बरनत गुन
    गाथा ॥ कहत राम जसु लङ्काँ आए। रावन चरन सीस तिन्ह नाए ॥ बिहसि दसानन पूँछी बाता। कहसि न सुक आपनि कुसलाता
    ॥ पुनि कहु खबरि बिभीषन केरी। जाहि मृत्यु आई अति नेरी ॥ करत राज लङ्का सठ त्यागी। होइहि जब कर कीट अभागी
    ॥ पुनि कहु भालु कीस कटकाई। कठिन काल प्रेरित चलि आई ॥ जिन्ह के जीवन कर रखवारा। भयु मृदुल चित सिन्धु
    बिचारा ॥ कहु तपसिन्ह कै बात बहोरी। जिन्ह के हृदयँ त्रास अति मोरी ॥ दो की भि भेण्ट कि फिरि गे श्रवन
    सुजसु सुनि मोर। कहसि न रिपु दल तेज बल बहुत चकित चित तोर ॥ ॥ नाथ कृपा करि पूँछेहु जैसें। मानहु कहा
    क्रोध तजि तैसेम् ॥ मिला जाइ जब अनुज तुम्हारा। जातहिं राम तिलक तेहि सारा ॥ रावन दूत हमहि सुनि काना।
    कपिन्ह बाँधि दीन्हे दुख नाना ॥ श्रवन नासिका काटै लागे। राम सपथ दीन्हे हम त्यागे ॥ पूँछिहु नाथ राम
    कटकाई। बदन कोटि सत बरनि न जाई ॥ नाना बरन भालु कपि धारी। बिकटानन बिसाल भयकारी ॥ जेहिं पुर दहेउ हतेउ
    सुत तोरा। सकल कपिन्ह महँ तेहि बलु थोरा ॥ अमित नाम भट कठिन कराला। अमित नाग बल बिपुल बिसाला ॥ दो द्विबिद
    मयन्द नील नल अङ्गद गद बिकटासि। दधिमुख केहरि निसठ सठ जामवन्त बलरासि ॥ ॥ ए कपि सब सुग्रीव समाना। इन्ह
    सम कोटिन्ह गनि को नाना ॥ राम कृपाँ अतुलित बल तिन्हहीं। तृन समान त्रेलोकहि गनहीम् ॥ अस मैं सुना श्रवन
    दसकन्धर। पदुम अठारह जूथप बन्दर ॥ नाथ कटक महँ सो कपि नाहीं। जो न तुम्हहि जीतै रन माहीम् ॥ परम क्रोध
    मीजहिं सब हाथा। आयसु पै न देहिं रघुनाथा ॥ सोषहिं सिन्धु सहित झष ब्याला। पूरहीं न त भरि कुधर बिसाला
    ॥ मर्दि गर्द मिलवहिं दससीसा। ऐसेइ बचन कहहिं सब कीसा ॥ गर्जहिं तर्जहिं सहज असङ्का। मानहु ग्रसन चहत
    हहिं लङ्का ॥ दो सहज सूर कपि भालु सब पुनि सिर पर प्रभु राम। रावन काल कोटि कहु जीति सकहिं सङ्ग्राम ॥
    ॥ राम तेज बल बुधि बिपुलाई। तब भ्रातहि पूँछेउ नय नागर ॥ तासु बचन सुनि सागर पाहीं। मागत पन्थ कृपा मन
    माहीम् ॥ सुनत बचन बिहसा दससीसा। जौं असि मति सहाय कृत कीसा ॥ सहज भीरु कर बचन दृढ़आई। सागर सन ठानी मचलाई
    ॥ मूढ़ मृषा का करसि बड़आई। रिपु बल बुद्धि थाह मैं पाई ॥ सचिव सभीत बिभीषन जाकें। बिजय बिभूति कहाँ जग
    ताकेम् ॥ सुनि खल बचन दूत रिस बाढ़ई। समय बिचारि पत्रिका काढ़ई ॥ रामानुज दीन्ही यह पाती। नाथ बचाइ जुड़आवहु
    छाती ॥ बिहसि बाम कर लीन्ही रावन। सचिव बोलि सठ लाग बचावन ॥ दो बातन्ह मनहि रिझाइ सठ जनि घालसि कुल खीस।
    राम बिरोध न उबरसि सरन बिष्नु अज ईस ॥ ॥ की तजि मान अनुज इव प्रभु पद पङ्कज भृङ्ग। होहि कि राम सरानल
    खल कुल सहित पतङ्ग ॥ ॥ सुनत सभय मन मुख मुसुकाई। कहत दसानन सबहि सुनाई ॥ भूमि परा कर गहत अकासा। लघु तापस
    कर बाग बिलासा ॥ कह सुक नाथ सत्य सब बानी। समुझहु छाड़इ प्रकृति अभिमानी ॥ सुनहु बचन मम परिहरि क्रोधा।
    नाथ राम सन तजहु बिरोधा ॥ अति कोमल रघुबीर सुभ् । जद्यपि अखिल लोक कर र् ॥ मिलत कृपा तुम्ह पर प्रभु करिही।
    उर अपराध न एकु धरिही ॥ जनकसुता रघुनाथहि दीजे। एतना कहा मोर प्रभु कीजे। जब तेहिं कहा देन बैदेही। चरन
    प्रहार कीन्ह सठ तेही ॥ नाइ चरन सिरु चला सो तहाँ। कृपासिन्धु रघुनायक जहाँ ॥ करि प्रनामु निज कथा सुनाई।
    राम कृपाँ आपनि गति पाई ॥ रिषि अगस्ति कीं साप भवानी। राछस भयु रहा मुनि ग्यानी ॥ बन्दि राम पद बारहिं
    बारा। मुनि निज आश्रम कहुँ पगु धारा ॥ दो बिनय न मानत जलधि जड़ गे तीन दिन बीति। बोले राम सकोप तब भय
    बिनु होइ न प्रीति ॥ ॥ लछिमन बान सरासन आनू। सोषौं बारिधि बिसिख कृसानू ॥ सठ सन बिनय कुटिल सन प्रीती।
    सहज कृपन सन सुन्दर नीती ॥ ममता रत सन ग्यान कहानी। अति लोभी सन बिरति बखानी ॥ क्रोधिहि सम कामिहि हरि
    कथा। ऊसर बीज बेँ फल जथा ॥ अस कहि रघुपति चाप चढ़आवा। यह मत लछिमन के मन भावा ॥ सङ्घानेउ प्रभु बिसिख
    कराला। उठी उदधि उर अन्तर ज्वाला ॥ मकर उरग झष गन अकुलाने। जरत जन्तु जलनिधि जब जाने ॥ कनक थार भरि मनि
    गन नाना। बिप्र रूप आयु तजि माना ॥ दो काटेहिं पि कदरी फरि कोटि जतन कौ सीञ्च। बिनय न मान खगेस सुनु डाटेहिं
    पि नव नीच ॥ ॥ सभय सिन्धु गहि पद प्रभु केरे। छमहु नाथ सब अवगुन मेरे ॥ गगन समीर अनल जल धरनी। इन्ह कि
    नाथ सहज जड़ करनी ॥ तव प्रेरित मायाँ उपजाए। सृष्टि हेतु सब ग्रन्थनि गाए ॥ प्रभु आयसु जेहि कहँ जस अही।
    सो तेहि भाँति रहे सुख लही ॥ प्रभु भल कीन्ही मोहि सिख दीन्ही। मरजादा पुनि तुम्हरी कीन्ही ॥ ढोल गवाँर
    सूद्र पसु नारी। सकल ताड़ना के अधिकारी ॥ प्रभु प्रताप मैं जाब सुखाई। उतरिहि कटकु न मोरि बड़आई ॥ प्रभु
    अग्या अपेल श्रुति गाई। करौं सो बेगि जौ तुम्हहि सोहाई ॥ दो सुनत बिनीत बचन अति कह कृपाल मुसुकाइ। जेहि
    बिधि उतरै कपि कटकु तात सो कहहु उपाइ ॥ ॥ नाथ नील नल कपि द्वौ भाई। लरिकाई रिषि आसिष पाई ॥ तिन्ह के परस
    किएँ गिरि भारे। तरिहहिं जलधि प्रताप तुम्हारे ॥ मैं पुनि उर धरि प्रभुताई। करिहुँ बल अनुमान सहाई ॥ एहि
    बिधि नाथ पयोधि बँधाइअ। जेहिं यह सुजसु लोक तिहुँ गाइअ ॥ एहि सर मम उत्तर तट बासी। हतहु नाथ खल नर अघ
    रासी ॥ सुनि कृपाल सागर मन पीरा। तुरतहिं हरी राम रनधीरा ॥ देखि राम बल पौरुष भारी। हरषि पयोनिधि भयु
    सुखारी ॥ सकल चरित कहि प्रभुहि सुनावा। चरन बन्दि पाथोधि सिधावा ॥ छं निज भवन गवनेउ सिन्धु श्रीरघुपतिहि
    यह मत भायू। यह चरित कलि मलहर जथामति दास तुलसी गायू ॥ सुख भवन संसय समन दवन बिषाद रघुपति गुन गना ॥ तजि
    सकल आस भरोस गावहि सुनहि सन्तत सठ मना ॥ दो सकल सुमङ्गल दायक रघुनायक गुन गान। सादर सुनहिं ते तरहिं भव
    सिन्धु बिना जलजान ॥ चौबीसवाँ विश्राम इति श्रीमद्रामचरितमानसे सकलकलिकलुषविध्वंसने पञ्चमः सोपानः समाप्तः
    ।
