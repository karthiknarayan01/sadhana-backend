id: balaramasahasranamastotra
category: stotram
name:
  english: balaramasahasranamastotra
  devanagari: बलरामसहस्रनामस्तोत्र
content:
  english: sadhu sadhu maharaja sadhu te vimalam yashah | yatpricchase paramidam gargoktam devadurlabham
    || 2|| namnam sahasram divyanam vakshyami tava cagratah | gargacaryena gopibhyo dattam krishnatate
    shubhe || 3|| om asya shribalabhadrasahasranamastrotramantrasya gargacarya rishih anushtup chandah
    sankarshanah paramatma devata balabhadra iti bijam revatiti shaktih ananta iti kilakam balabhadraprityarthe
    jape viniyogah || atha dhyanam | sphuradamalakiritam kinkinikankanarham caladalakakapolam kundalashrimukhabjam
    | tuhinagirimanojnam nilameghambaradhyam halamusalavishalam kamapalam samide || 4|| atha stotram |
    om balabhadro ramabhadro ramah sankarshano'cyutah | revatiramano devah kamapalo halayudhah || 5||
    nilambarah shvetavarno baladevo'cyutagrajah | pralambaghno mahaviro rauhineyah pratapavan || 6|| talanko
    musali hali hariryaduvaro bali | sirapanih padmapanirlagudi venuvadanah || 7|| kalindibhedano viro
    balah prabala urdhvagah | vasudevakalanantah sahasravadanah svarat || 8|| vasurvasumatibharta vasudevo
    vasuttamah | yaduttamo yadavendro madhavo vrishnivallabhah || 9|| dvarakesho mathuresho dani mani
    mahamanah | purnah puranah purushah pareshah parameshvarah || 10|| paripurnatamah sakshatparamah purushottamah
    | anantah shashvatah shesho bhagavanprakriteh parah || 11|| jivatma paramatma ca hyantaratma dhruvo'vyayah
    | caturvyuhashcaturvedashcaturmurtishcatushpadah || 12|| pradhanam prakritih sakshi sanghatah sanghavan
    sakhi | mahamana buddhisakhashceto'hankara avritah || 13|| indriyesho devatatma jnanam karma ca sharma
    ca | advitiyo dvitiyashca nirakaro niranjanah || 14|| virat samrat mahaughashca dharah sthasnushcarishnuman
    | phanindrah phanirajashca sahasraphanamanditah || 15|| phanishvarah phani sphurtih phutkari citkarah
    prabhuh | maniharo manidharo vitali sutali tali || 16|| atali sutaleshashca patalashca talatalah |
    rasatalo bhogitalah sphuraddanto mahatalah || 17|| vasukih shankhacudabho devadatto dhananjayah |
    kambalashvo vegataro dhritarashtro mahabhujah || 18|| varunimadamattango madaghurnitalocanah | padmakshah
    padmamali ca vanamali madhushravah || 19|| kotikandarpalavanyo nagakanyasamarcitah | nupuri katisutri
    ca kataki kanakangadi || 20|| mukuti kundali dandi shikhandi khandamandali | kalih kalipriyah kalo
    nivatakavaceshvarah || 21|| samharakridrurdravapuh kalagnih pralayo layah | mahahih paninih shastrabhashyakarah
    patanjalih || 22|| katyayanah pakvimabhah sphotayana urangamah | vaikuntho yajniko yajno vamano harino
    harih || 23|| krishno vishnurmahavishnuh prabhavishnurvisheshavit | hamso yogeshvarah kurmo varaho
    narado munih || 24|| sanakah kapilo matsyah kamatho devamangalah | dattatreyah prithurvriddha rishabho
    bhargavottamah || 25|| dhanvantarirnrisimhashca kalirnarayano narah | ramacandro raghavendrah koshalendro
    raghudvahah || 26|| kakutsthah karunasindhu rajendrah sarvalakshanah | shuro dasharathistrata kausalyanandavarddhanah
    || 27|| saumitrirbharato dhanvi shatrughnah shatrutapanah | nishangi kavaci khadgi shari jyahatakoshthakah
    || 28|| baddhagodhangulitranah shambhukodandabhanjanah | yajnatrata yajnabharta maricavadhakarakah
    || 29|| asuraristatakarirvibhishanasahayakrit | pitrivakyakaro harshi ca viradharirvanecarah || 30||
    munirmunipriyashcitrakutaranyanivasakrit | kabandhaha dandakesho ramo rajivalocanah || 31|| matangavanasancari
    neta pancavatipatih | sugrivah sugrivasakho hanumatpritamanasah || 32|| setubandho ravanarirlankadahanatatparah
    | ravanyarih pushpakastho janakivirahaturah || 33|| ayodhyadhipatih shrima~llavanarih surarcitah |
    suryavamshi candravamshi vamshivadyavisharadah || 34|| gopatirgopavrindesho gopo gopishatavritah |
    gokulesho gopaputro gopalo goganashrayah || 35|| putanarirbakarishca trinavartanipatakah | agharirdhenukarishca
    pralambarirvrajeshvarah || 36|| arishtaha keshishatrurvyomasuravinashakrit | agnipano dugdhapano vrindavanalatashritah
    || 37|| yashomatisuto bhavyo rohinilalitah shishuh | rasamandalamadhyastho rasamandalamandanah ||
    38|| gopikashatayutharthi shankhacudavadhodyatah | govardhanasamuddharta shakrajidvrajarakshakah ||
    39|| vrishabhanuvaro nanda anando nandavardhanah | nandarajasutah shrishah kamsarih kaliyantakah ||
    40|| rajakarirmushtikarih kamsakodandabhanjanah | canurarih kutahanta shalaristoshalantakah || 41||
    kamsabhratrinihanta ca mallayuddhapravartakah | gajahanta kamsahanta kalahanta kalankaha || 42|| magadhariryavanaha
    panduputrasahayakrit | caturbhujah shyamalangah saumyashcaupagavipriyah || 43|| yuddhabhriduddhavasakha
    mantri mantravisharadah | viraha viramathanah shankhacakragadadharah || 44|| revaticittaharta ca revatiharshavarddhanah
    | revatiprananathashca revatipriyakarakah || 45|| jyotirjyotishmatibharta raivatadriviharakrit | dhritinatho
    dhanadhyaksho danadhyaksho dhaneshvarah || 46|| maithilarcitapadabjo manado bhaktavatsalah | duryodhanagururgurvi
    gadashikshakarah kshami || 47|| murarirmadano mando'niruddho dhanvinam varah | kalpavrikshah kalpavrikshi
    kalpavrikshavanaprabhuh || 48|| syamantakamanirmanyo gandivi kauraveshvarah | kumbhandakhandanakarah
    kupakarnapraharakrit || 49|| sevyo raivatajamata madhumadhavasevitah | balishthapushtasarvango hrishtah
    pushtah praharshitah || 50|| varanasigatah kruddhah sarvah paundrakaghatakah | sunandi shikhari shilpi
    dvividanganishudanah || 51|| hastinapurasankarshi rathi kauravapujitah | vishvakarma vishvadharma
    devasharma dayanidhih || 52|| maharajacchatradharo maharajopalakshanah | siddhagitah siddhakathah
    shuklacamaravijitah || 53|| tarakshah kiranasashca bimboshthah susmitacchavih | karindrakaradordandah
    pracando meghamandalah || 54|| kapatavakshah pinamsah padmapadasphuraddyutih | mahavibhutirbhutesho
    bandhamokshi samikshanah || 55|| caidyashatruh shatrusandho dantavaktranishudakah | ajatashatruh papaghno
    haridasasahayakrit || 56|| shalabahuh shalvahanta tirthayayi janeshvarah | naimisharanyayatrarthi
    gomatitiravasakrit || 57|| gandakisnanavansragvi vaijayantivirajitah | amlanapankajadharo vipashi
    shonasamplutah || 58|| prayagatirtharajashca sarayuh setubandhanah | gayashirashca dhanadah paulastyah
    pulahashramah || 59|| gangasagarasangarthi saptagodavaripatih | veni bhimarathi goda tamraparni vatodaka
    || 60|| kritamala mahapunya kaveri ca payasvini | pratici suprabha veni triveni sarayupama || 61||
    krishna pampa narmada ca ganga bhagirathi nadi | siddhashramah prabhasashca bindurbindusarovarah ||
    62|| pushkarah saindhavo jambu naranarayanashramah | kurukshetrapati ramo jamadagnyo mahamunih ||
    63|| ilvalatmajahanta ca sudamasaukhyadayakah | vishvajidvishvanathashca trilokavijayi jayi || 64||
    vasantamalatikarshi gado gadyo gadagrajah | gunarnavo gunanidhirgunapatro gunakarah || 65|| rangavallijalakaro
    nirgunah saguno brihat | drishtah shruto bhavadbhuto bhavishyaccalpavigrahah || 66|| anadiradiranandah
    pratyagdhama nirantarah | gunatitah samah samyah samadrinnirvikalpakah || 67|| gudhavyudho guno gauno
    gunabhaso gunavritah | nityo'ksharo nirvikaro'ksharo'jasrasukho'mritah || 68|| sarvagah sarvavitsarthah
    samabuddhih samaprabhah | akledyo'cchedya apurno'shoshyo'dahyona'nivartakah || 69|| brahma brahmadharo
    brahma jnapako vyapakah kavih | adhyatmako'dhibhutashcadhidaivah svashrayashrayah || 70|| mahavayurmahavirashceshtarupatanusthitah
    | prerako bodhako bodhi trayovimshatiko ganah || 71|| amshamshashca naravesho'vataro bhuparisthitah
    | maharjanastapahsatyam bhurbhuvahsvariti tridha || 72|| naimittikah prakritika atyantikamayo layah
    | sargo visargah sargadirnirodho rodha utiman || 73|| manvantaravatarashca manurmanusuto'naghah |
    svayambhuh shambhavah shankuh svayambhuvasahayakrit || 74|| suralayo devagirirmerurhemarcito girih
    | girisho gananathashca gaurisho girigahvarah || 75|| vindhyastrikuto mainakah suvelah paribhadrakah
    | patangah shishirah kanko jarudhih shailasattamah || 76|| kalanjaro brihatsanurdaribhrinnandikeshvarah
    | santanastarurajashca mandarah parijatakah || 77|| jayantakrijjayantango jayantidigjayakulah | vritraha
    devalokashca shashi kumudabandhavah || 78|| nakshatreshah sudhasindhurmrigah pushyah punarvasuh |
    hasto'bhijicca shravano vaidhritirbhaskarodayah || 79|| aindrah sadhyah shubhah shuklo vyatipato dhruvah
    sitah | shishumaro devamayo brahmaloko vilakshanah || 80|| ramo vaikunthanathashca vyapi vaikunthanayakah
    | shvetadvipo jitapado lokalokacalashritah || 81|| bhumirvaikunthadevashca kotibrahmandakarakah |
    asankhyabrahmandapatirgolokesho gavam patih || 82|| golokadhamadhishano gopikakanthabhushanah | shridharah
    shridharo liladharo giridharo dhuri || 83|| kuntadhari trishuli ca bibhatsi ghargharasvanah | shulasucyarpitagajo
    gajacarmadharo gaji || 84|| antramali mundamali vyali dandakamandaluh | vetalabhridbhutasanghah kushmandaganasamvritah
    || 85|| pramatheshah pashupatirmridanisho mrido vrishah | kritantakalasangharih kutah kalpantabhairavah
    || 86|| shadanano virabhadro dakshayajnavighatakah | kharparashi vishashi ca shaktihastah shivarthadah
    || 87|| pinakatankarakarashcalajjhankaranupurah | panditastarkavidvanvai vedapathi shrutishvarah ||
    88|| vedantakritsankhyashastri mimamsi kananamabhak | kanadirgautamo vadi vado naiyayiko nayah ||
    89|| vaisheshiko dharmashastri sarvashastrarthatattvagah | vaiyakaranakricchando vaiyasah prakritirvacah
    || 90|| parasharisamhitavitkavyakrinnatakapradah | pauranikah smritikaro vaidyo vidyavisharadah ||
    91|| alankaro lakshanartho vyangyaviddhanavaddhvanih | vakyasphotah padasphotah sphotavrittishca sarthavit
    || 92|| sha
  devanagari: साधु साधु महाराज साधु ते विमलं यशः । यत्पृच्छसे परमिदं गर्गोक्तं देवदुर्लभम् ॥ २॥ नाम्नां
    सहस्रं दिव्यानां वक्ष्यामि तव चाग्रतः । गर्गाचार्येण गोपीभ्यो दत्तं कृष्णातटे शुभे ॥ ३॥ ॐ अस्य श्रीबलभद्रसहस्रनामस्त्रोत्रमन्त्रस्य
    गर्गाचार्य ऋषिः अनुष्टुप् छन्दः सङ्कर्षणः परमात्मा देवता बलभद्र इति बीजं रेवतीति शक्तिः अनन्त इति
    कीलकं बलभद्रप्रीत्यर्थे जपे विनियोगः ॥ अथ ध्यानम् । स्फुरदमलकिरीटं किङ्किणीकङ्कणार्हं चलदलककपोलं कुण्डलश्रीमुखाब्जम्
    । तुहिनगिरिमनोज्ञं नीलमेघाम्बराढ्यं हलमुसलविशालं कामपालं समीडे ॥ ४॥ अथ स्तोत्रम् । ॐ बलभद्रो रामभद्रो
    रामः सङ्कर्षणोऽच्युतः । रेवतीरमणो देवः कामपालो हलायुधः ॥ ५॥ नीलाम्बरः श्वेतवर्णो बलदेवोऽच्युताग्रजः
    । प्रलम्बघ्नो महावीरो रौहिणेयः प्रतापवान् ॥ ६॥ तालाङ्को मुसली हली हरिर्यदुवरो बली । सीरपाणिः पद्मपाणिर्लगुडी
    वेणुवादनः ॥ ७॥ कालिन्दीभेदनो वीरो बलः प्रबल ऊर्ध्वगः । वासुदेवकलानन्तः सहस्रवदनः स्वराट् ॥ ८॥ वसुर्वसुमतीभर्ता
    वासुदेवो वसूत्तमः । यदूत्तमो यादवेन्द्रो माधवो वृष्णिवल्लभः ॥ ९॥ द्वारकेशो माथुरेशो दानी मानी महामनाः
    । पूर्णः पुराणः पुरुषः परेशः परमेश्वरः ॥ १०॥ परिपूर्णतमः साक्षात्परमः पुरुषोत्तमः । अनन्तः शाश्वतः
    शेषो भगवान्प्रकृतेः परः ॥ ११॥ जीवात्मा परमात्मा च ह्यन्तरात्मा ध्रुवोऽव्ययः । चतुर्व्यूहश्चतुर्वेदश्चतुर्मूर्तिश्चतुष्पदः
    ॥ १२॥ प्रधानं प्रकृतिः साक्षी सङ्घातः सङ्घवान् सखी । महामना बुद्धिसखश्चेतोऽहङ्कार आवृतः ॥ १३॥ इन्द्रियेशो
    देवातात्मा ज्ञानं कर्म च शर्म च । अद्वितीयो द्वितीयश्च निराकारो निरञ्जनः ॥ १४॥ विराट् सम्राट् महौघश्च
    धारः स्थास्नुश्चरिष्णुमान् । फणीन्द्रः फणिराजश्च सहस्रफणमण्डितः ॥ १५॥ फणीश्वरः फणी स्फूर्तिः फूत्कारी
    चीत्करः प्रभुः । मणिहारो मणिधरो वितली सुतली तली ॥ १६॥ अतली सुतलेशश्च पातालश्च तलातलः । रसातलो भोगितलः
    स्फुरद्दन्तो महातलः ॥ १७॥ वासुकिः शङ्खचूडाभो देवदत्तो धनञ्जयः । कम्बलाश्वो वेगतरो धृतराष्ट्रो महाभुजः
    ॥ १८॥ वारुणीमदमत्ताङ्गो मदघूर्णितलोचनः । पद्माक्षः पद्ममाली च वनमाली मधुश्रवाः ॥ १९॥ कोटिकन्दर्पलावण्यो
    नागकन्यासमर्चितः । नूपुरी कटिसूत्री च कटकी कनकाङ्गदी ॥ २०॥ मुकुटी कुण्डली दण्डी शिखण्डी खण्डमण्डली
    । कलिः कलिप्रियः कालो निवातकवचेश्वरः ॥ २१॥ संहारकृद्रुर्द्रवपुः कालाग्निः प्रलयो लयः । महाहिः पाणिनिः
    शास्त्रभाष्यकारः पतञ्जलिः ॥ २२॥ कात्यायनः पक्विमाभः स्फोटायन उरङ्गमः । वैकुण्ठो याज्ञिको यज्ञो वामनो
    हरिणो हरिः ॥ २३॥ कृष्णो विष्णुर्महाविष्णुः प्रभविष्णुर्विशेषवित् । हंसो योगेश्वरः कूर्मो वाराहो नारदो
    मुनिः ॥ २४॥ सनकः कपिलो मत्स्यः कमठो देवमङ्गलः । दत्तात्रेयः पृथुर्वृद्ध ऋषभो भार्गवोत्तमः ॥ २५॥ धन्वन्तरिर्नृसिंहश्च
    कलिर्नारायणो नरः । रामचन्द्रो राघवेन्द्रः कोशलेन्द्रो रघूद्वहः ॥ २६॥ काकुत्स्थः करुणासिन्धू राजेन्द्रः
    सर्वलक्षणः । शूरो दाशरथिस्त्राता कौसल्यानन्दवर्द्धनः ॥ २७॥ सौमित्रिर्भरतो धन्वी शत्रुघ्नः शत्रुतापनः
    । निषङ्गी कवची खड्गी शरी ज्याहतकोष्ठकः ॥ २८॥ बद्धगोधाङ्गुलित्राणः शम्भुकोदण्डभञ्जनः । यज्ञत्राता यज्ञभर्ता
    मारीचवधकारकः ॥ २९॥ असुरारिस्ताटकारिर्विभीषणसहायकृत् । पितृवाक्यकरो हर्षी च विराधारिर्वनेचरः ॥ ३०॥
    मुनिर्मुनिप्रियश्चित्रकूटारण्यनिवासकृत् । कबन्धहा दण्डकेशो रामो राजीवलोचनः ॥ ३१॥ मतङ्गवनसञ्चारी नेता
    पञ्चवटीपतिः । सुग्रीवः सुग्रीवसखो हनुमत्प्रीतमानसः ॥ ३२॥ सेतुबन्धो रावणारिर्लङ्कादहनतत्परः । रावण्यरिः
    पुष्पकस्थो जानकीविरहातुरः ॥ ३३॥ अयोध्याधिपतिः श्रीमाँल्लवणारिः सुरार्चितः । सूर्यवंशी चन्द्रवंशी वंशीवाद्यविशारदः
    ॥ ३४॥ गोपतिर्गोपवृन्देशो गोपो गोपीशतावृतः । गोकुलेशो गोपपुत्रो गोपालो गोगणाश्रयः ॥ ३५॥ पूतनारिर्बकारिश्च
    तृणावर्तनिपातकः । अघारिर्धेनुकारिश्च प्रलम्बारिर्व्रजेश्वरः ॥ ३६॥ अरिष्टहा केशिशत्रुर्व्योमासुरविनाशकृत्
    । अग्निपानो दुग्धपानो वृन्दावनलताश्रितः ॥ ३७॥ यशोमतिसुतो भव्यो रोहिणीलालितः शिशुः । रासमण्डलमध्यस्थो
    रासमण्डलमण्डनः ॥ ३८॥ गोपिकाशतयूथार्थी शङ्खचूडवधोद्यतः । गोवर्धनसमुद्धर्ता शक्रजिद्व्रजरक्षकः ॥ ३९॥
    वृषभानुवरो नन्द आनन्दो नन्दवर्धनः । नन्दराजसुतः श्रीशः कंसारिः कालियान्तकः ॥ ४०॥ रजकारिर्मुष्टिकारिः
    कंसकोदण्डभञ्जनः । चाणूरारिः कूटहन्ता शलारिस्तोशलान्तकः ॥ ४१॥ कंसभ्रातृनिहन्ता च मल्लयुद्धप्रवर्तकः
    । गजहन्ता कंसहन्ता कालहन्ता कलङ्कहा ॥ ४२॥ मागधारिर्यवनहा पाण्डुपुत्रसहायकृत् । चतुर्भुजः श्यामलाङ्गः
    सौम्यश्चौपगविप्रियः ॥ ४३॥ युद्धभृदुद्धवसखा मन्त्री मन्त्रविशारदः । वीरहा वीरमथनः शङ्खचक्रगदाधरः ॥
    ४४॥ रेवतीचित्तहर्ता च रेवतीहर्षवर्द्धनः । रेवतीप्राणनाथश्च रेवतीप्रियकारकः ॥ ४५॥ ज्योतिर्ज्योतिष्मतीभर्ता
    रैवताद्रिविहारकृत् । धृतिनाथो धनाध्यक्षो दानाध्यक्षो धनेश्वरः ॥ ४६॥ मैथिलार्चितपादाब्जो मानदो भक्तवत्सलः
    । दुर्योधनगुरुर्गुर्वी गदाशिक्षाकरः क्षमी ॥ ४७॥ मुरारिर्मदनो मन्दोऽनिरुद्धो धन्विनां वरः । कल्पवृक्षः
    कल्पवृक्षी कल्पवृक्षवनप्रभुः ॥ ४८॥ स्यमन्तकमणिर्मान्यो गाण्डीवी कौरवेश्वरः । कुम्भाण्डखण्डनकरः कूपकर्णप्रहारकृत्
    ॥ ४९॥ सेव्यो रैवतजामाता मधुमाधवसेवितः । बलिष्ठपुष्टसर्वाङ्गो हृष्टः पुष्टः प्रहर्षितः ॥ ५०॥ वाराणसीगतः
    क्रुद्धः सर्वः पौण्ड्रकघातकः । सुनन्दी शिखरी शिल्पी द्विविदाङ्गनिषूदनः ॥ ५१॥ हस्तिनापुरसङ्कर्षी रथी
    कौरवपूजितः । विश्वकर्मा विश्वधर्मा देवशर्मा दयानिधिः ॥ ५२॥ महाराजच्छत्रधरो महाराजोपलक्षणः । सिद्धगीतः
    सिद्धकथः शुक्लचामरवीजितः ॥ ५३॥ ताराक्षः कीरनासश्च बिम्बोष्ठः सुस्मितच्छविः । करीन्द्रकरदोर्दण्डः प्रचण्डो
    मेघमण्डलः ॥ ५४॥ कपाटवक्षाः पीनांसः पद्मपादस्फुरद्द्युतिः । महविभूतिर्भूतेशो बन्धमोक्षी समीक्षणः ॥
    ५५॥ चैद्यशत्रुः शत्रुसन्धो दन्तवक्त्रनिषूदकः । अजातशत्रुः पापघ्नो हरिदाससहायकृत् ॥ ५६॥ शालबाहुः शाल्वहन्ता
    तीर्थयायी जनेश्वरः । नैमिषारण्ययात्रार्थी गोमतीतीरवासकृत् ॥ ५७॥ गण्डकीस्नानवान्स्रग्वी वैजयन्तीविराजितः
    । अम्लानपङ्कजधरो विपाशी शोणसम्प्लुतः ॥ ५८॥ प्रयागतीर्थराजश्च सरयूः सेतुबन्धनः । गयाशिरश्च धनदः पौलस्त्यः
    पुलहाश्रमः ॥ ५९॥ गङ्गासागरसङ्गार्थी सप्तगोदावरीपतिः । वेणि भीमरथी गोदा ताम्रपर्णी वटोदका ॥ ६०॥ कृतमाला
    महापुण्या कावेरी च पयस्विनी । प्रतीची सुप्रभा वेणी त्रिवेणी सरयूपमा ॥ ६१॥ कृष्णा पम्पा नर्मदा च गङ्गा
    भागीरथी नदी । सिद्धाश्रमः प्रभासश्च बिन्दुर्बिन्दुसरोवरः ॥ ६२॥ पुष्करः सैन्धवो जम्बू नरनारायणाश्रमः
    । कुरुक्षेत्रपती रामो जामदग्न्यो महामुनिः ॥ ६३॥ इल्वलात्मजहन्ता च सुदामासौख्यदायकः । विश्वजिद्विश्वनाथश्च
    त्रिलोकविजयी जयी ॥ ६४॥ वसन्तमालतीकर्षी गदो गद्यो गदाग्रजः । गुणार्णवो गुणनिधिर्गुणपात्रो गुणाकरः ॥
    ६५॥ रङ्गवल्लीजलाकारो निर्गुणः सगुणो बृहत् । दृष्टः श्रुतो भवद्भूतो भविष्यच्चाल्पविग्रहः ॥ ६६॥ अनादिरादिरानन्दः
    प्रत्यग्धामा निरन्तरः । गुणातीतः समः साम्यः समदृङ्निर्विकल्पकः ॥ ६७॥ गूढाव्यूढो गुणो गौणो गुणाभासो
    गुणावृतः । नित्योऽक्षरो निर्विकारोऽक्षरोऽजस्रसुखोऽमृतः ॥ ६८॥ सर्वगः सर्ववित्सार्थः समबुद्धिः समप्रभः
    । अक्लेद्योऽच्छेद्य आपूर्णोऽशोष्योऽदाह्योणऽनिवर्तकः ॥ ६९॥ ब्रह्म ब्रह्मधरो ब्रह्मा ज्ञापको व्यापकः
    कविः । अध्यात्मकोऽधिभूतश्चाधिदैवः स्वाश्रयाश्रयः ॥ ७०॥ महावायुर्महावीरश्चेष्टारूपतनुस्थितः । प्रेरको
    बोधको बोधी त्रयोविंशतिको गणः ॥ ७१॥ अंशांशश्च नरावेशोऽवतारो भूपरिस्थितः । महर्जनस्तपःसत्यं भूर्भुवःस्वरिति
    त्रिधा ॥ ७२॥ नैमित्तिकः प्राकृतिक आत्यन्तिकमयो लयः । सर्गो विसर्गः सर्गादिर्निरोधो रोध ऊतिमान् ॥ ७३॥
    मन्वन्तरावतारश्च मनुर्मनुसुतोऽनघः । स्वयम्भूः शाम्भवः शङ्कुः स्वायम्भुवसहायकृत् ॥ ७४॥ सुरालयो देवगिरिर्मेरुर्हेमार्चितो
    गिरिः । गिरीशो गणनाथश्च गौरीशो गिरिगह्वरः ॥ ७५॥ विन्ध्यस्त्रिकूटो मैनाकः सुवेलः पारिभद्रकः । पतङ्गः
    शिशिरः कङ्को जारुधिः शैलसत्तमः ॥ ७६॥ कालञ्जरो बृहत्सानुर्दरीभृन्नन्दिकेश्वरः । सन्तानस्तरुराजश्च मन्दारः
    पारिजातकः ॥ ७७॥ जयन्तकृज्जयन्ताङ्गो जयन्तीदिग्जयाकुलः । वृत्रहा देवलोकश्च शशी कुमुदबान्धवः ॥ ७८॥ नक्षत्रेशः
    सुधासिन्धुर्मृगः पुष्यः पुनर्वसुः । हस्तोऽभिजिच्च श्रवणो वैधृतिर्भास्करोदयः ॥ ७९॥ ऐन्द्रः साध्यः शुभः
    शुक्लो व्यतीपातो ध्रुवः सितः । शिशुमारो देवमयो ब्रह्मलोको विलक्षणः ॥ ८०॥ रामो वैकुण्ठनाथश्च व्यापी
    वैकुण्ठनायकः । श्वेतद्वीपो जितपदो लोकालोकाचलाश्रितः ॥ ८१॥ भूमिर्वैकुण्ठदेवश्च कोटिब्रह्माण्डकारकः
    । असङ्ख्यब्रह्माण्डपतिर्गोलोकेशो गवां पतिः ॥ ८२॥ गोलोकधामधिषणो गोपिकाकण्ठभूषणः । श्रीधारः श्रीधरो
    लीलाधरो गिरिधरो धुरी ॥ ८३॥ कुन्तधारी त्रिशूली च बीभत्सी घर्घरस्वनः । शूलसूच्यर्पितगजो गजचर्मधरो गजी
    ॥ ८४॥ अन्त्रमाली मुण्डमाली व्याली दण्डकमण्डलुः । वेतालभृद्भूतसङ्घः कूष्माण्डगणसंवृतः ॥ ८५॥ प्रमथेशः
    पशुपतिर्मृडानीशो मृडो वृषः । कृतान्तकालसङ्घारिः कूटः कल्पान्तभैरवः ॥ ८६॥ षडाननो वीरभद्रो दक्षयज्ञविघातकः
    । खर्पराशी विषाशी च शक्तिहस्तः शिवार्थदः ॥ ८७॥ पिनाकटङ्कारकरश्चलज्झङ्कारनूपुरः । पण्डितस्तर्कविद्वान्वै
    वेदपाठी श्रुतीश्वरः ॥ ८८॥ वेदान्तकृत्साङ्ख्यशास्त्री मीमांसी कणनामभाक् । काणादिर्गौतमो वादी वादो नैयायिको
    नयः ॥ ८९॥ वैशेषिको धर्मशास्त्री सर्वशास्त्रार्थतत्त्वगः । वैयाकरणकृच्छन्दो वैयासः प्राकृतिर्वचः ॥
    ९०॥ पाराशरीसंहितावित्काव्यकृन्नाटकप्रदः । पौराणिकः स्मृतिकरो वैद्यो विद्याविशारदः ॥ ९१॥ अलङ्कारो लक्षणार्थो
    व्यङ्ग्यविद्धनवद्ध्वनिः । वाक्यस्फोटः पदस्फोटः स्फोटवृत्तिश्च सार्थवित् ॥ ९२॥ श
