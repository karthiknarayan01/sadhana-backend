id: jagannathakavacam-skandapuranantargatam
category: kavacha
name:
  english: jagannathakavacam (skandapuranantargatam)
  devanagari: जगन्नाथकवचम् (स्कन्दपुराणान्तर्गतम्)
content:
  english: 80|| sarvatra patu mam devah shankhacakragadadharah | narayano manah patu caitanyam garudadhvajah
    || 81|| patu me buddhyahankarau trigunatma janardanah | indriyani sada patu daityavarganikrintanah
    || 82|| evam baddhva ca kavacam nishpapo jayate puman | shodashairupacaraishca manasa kalpitairnarah
    || 83|| iti shriskandapurane vaishnavakhande purushottamajagannathamahatmye trimshadhyayantargatam
    jagannathakavacam samaptam | skandapurana | vaishnavakhanda | purushottamakhanda | adhyaya 30
  devanagari: ८०॥ सर्वत्र पातु मां देवः शङ्खचक्रगदाधरः । नारायणो मनः पातु चैतन्यं गरुडध्वजः ॥ ८१॥ पातु
    मे बुद्ध्यहङ्कारौ त्रिगुणात्मा जनार्दनः । इन्द्रियाणि सदा पातु दैत्यवर्गनिकृन्तनः ॥ ८२॥ एवं बद्ध्वा
    च कवचं निष्पापो जायते पुमान् । षोडशैरुपचारैश्च मनसा कल्पितैर्नरः ॥ ८३॥ इति श्रीस्कन्दपुराणे वैष्णवखण्डे
    पुरुषोत्तमजगन्नाथमाहात्म्ये त्रिंशाध्यायान्तर्गतं जगन्नाथकवचं समाप्तम् । स्कन्दपुराण । वैष्णवखण्ड
    । पुरुषोत्तमखण्ड । अध्याय ३०
meaning: {}
