id: dhenukasurakritamshrikrishnastotram
category: stotram
name:
  english: dhenukasurakritamshrikrishnastotram
  devanagari: धेनुकासुरकृतंश्रीकृष्णस्तोत्रम्
content:
  english: dhenukasurakritam shrikrishnastotram danava uvaca | vamano'si tvamamshena matpituryajnabhikshukah
    | rajyaharta ca shriharta sutalasthaladayakah || 37|| balirbhaktivasho virah sarvesho bhaktavatsalah
    | shighram tvam hindhi mam papam shapadgardabharupinam || 38|| munerdurvasasah shapadidrisham janma
    kutsitam | mrityuruktashca munina tvatto mama jagatpate || 39|| shodasharena cakrena sutikshnenatitejasa
    | jahi mam jagatam natha sadbhaktim kuru mokshada || 40|| tvamamshena varahashca samuddhartum vasundharam
    | vedanam rakshita natha hiranyakshanishudanah || 41|| tvam nrisimhah svayam purno hiranyakashiporvadhe
    | prahladanugraharthaya devanam rakshanaya ca || 42|| tvam ca vedoddharakarta minamshena dayanidhe
    | nripasya jnanadanaya rakshayai suraviprayoh || 43|| sheshadharashca kurmastvamamshena srishtihetave
    | vishvadharashca vishvastvamamshenapi sahasradhrik || 44|| ramo dasharathistvam ca janakyuddharahetave
    | dashakandharahanta ca sindhau setuvidhayakah || 45|| kalaya parashuramashca jamadagnisuto mahan
    | trihsaptakritvo bhupanam nihanta jagatipate || 46|| amshena kapilastvam ca siddhanam ca gurorguruh
    | matrijnanapradata ca yogashastravidhayakah || 47|| amshena jnaninam shreshtho naranarayanavrishi
    | tvam ca dharmasuto bhutva lokavistarakarakah || 48|| adhuna krishnarupastvam paripurnatamah svayam
    | sarveshamavataranam bijarupah sanatanah || 49|| yashodajivano nityo nandaikanandavardhanah | pranadhidevo
    gopinam radhapranadhikapriyah || 50|| vasudevasutah shanto devakiduhkhabhanjanah | ayonisambhavah
    shrimanprithivibharaharakah || 51|| putanayai matrigatim pradata ca kripanidhih | bakakeshipralambanam
    mamapi mokshakarakah || 52|| svecchamaya gunatita bhaktanam bhayabhanjana | prasida radhikanatha prasida
    kuru mokshanam || 53|| he natha gardabhiyoneh samuddhara bhavarnavat | murkhastvadbhaktaputro'ham
    mamuddhartum tvamarhasi || 54|| veda brahmadayo yam ca munindrah stotumakshamah | kim staumi tam gunatitam
    pura daityo'dhuna kharah || 55|| evam kuru kripasindho yena me na bhavejjanuh | drishtva padaravindam
    te kah punarbhavanam vrajet || 56|| brahma stota kharah stota nopahasitumarhasi | sadishvarasya vijnasya
    yogyayogye sama kripa || 57|| ityevamuktva daityendrastasthau ca purato hareh | prasannavadanah shrimanatitushto
    babhuva ha || 58|| idam daityakritam stotram nityam bhaktya ca yah pathet | salokyasarshtisamipyam
    lilaya labhate hareh || 59|| iha loke harerbhaktimante dasyam sudurlabham | vidyam shriyam sukavitam
    putrapautranyasho labhet || 60|| iti brahmavaivartapurane shrikrishnajanmakhande dvavimshadhyayantargatam
    dhanukasurakritam shrikrishnastotram sampurnam | brahmavaivartapurana | shrikrishnajanma
  devanagari: धेनुकासुरकृतं श्रीकृष्णस्तोत्रम् दानव उवाच । वामनोऽसि त्वमंशेन मत्पितुर्यज्ञभिक्षुकः । राज्यहर्ता
    च श्रीहर्ता सुतलस्थलदायकः ॥ ३७॥ बलिर्भक्तिवशो वीरः सर्वेशो भक्तवत्सलः । शीघ्रं त्वं हिन्धि मां पापं
    शापाद्गर्दभरूपिणम् ॥ ३८॥ मुनेर्दुर्वाससः शापादीदृशं जन्म कुत्सितम् । मृत्युरुक्तश्च मुनिना त्वत्तो
    मम जगत्पते ॥ ३९॥ षोडशारेण चक्रेण सुतीक्ष्णेनातितेजसा । जहि मां जगतां नाथ सद्भक्तिं कुरु मोक्षद ॥ ४०॥
    त्वमंशेन वराहश्च समुद्धर्तुं वसुन्धराम् । वेदानां रक्षिता नाथ हिरण्याक्षनिषूदनः ॥ ४१॥ त्वं नृसिंहः
    स्वयं पूर्णो हिरण्यकशिपोर्वधे । प्रह्लादानुग्रहार्थाय देवानां रक्षणाय च ॥ ४२॥ त्वं च वेदोद्धारकर्ता
    मीनांशेन दयानिधे । नृपस्य ज्ञानदानाय रक्षायै सुरविप्रयोः ॥ ४३॥ शेषाधारश्च कूर्मस्त्वमंशेन सृष्टिहेतवे
    । विश्वाधारश्च विश्वस्त्वमंशेनापि सहस्रधृक् ॥ ४४॥ रामो दाशरथिस्त्वं च जानक्युद्धारहेतवे । दशकन्धरहन्ता
    च सिन्धौ सेतुविधायकः ॥ ४५॥ कलया परशुरामश्च जमदग्निसुतो महान् । त्रिःसप्तकृत्वो भूपानां निहन्ता जगतीपते
    ॥ ४६॥ अंशेन कपिलस्त्वं च सिद्धानां च गुरोर्गुरुः । मातृज्ञानप्रदाता च योगशास्त्रविधायकः ॥ ४७॥ अंशेन
    ज्ञानिनां श्रेष्ठो नरनारायणावृषी । त्वं च धर्मसुतो भूत्वा लोकविस्तारकारकः ॥ ४८॥ अधुना कृष्णरूपस्त्वं
    परिपूर्णतमः स्वयम् । सर्वेषामवताराणां बीजरूपः सनातनः ॥ ४९॥ यशोदाजीवनो नित्यो नन्दैकानन्दवर्धनः । प्राणाधिदेवो
    गोपीनां राधाप्राणाधिकप्रियः ॥ ५०॥ वसुदेवसुतः शान्तो देवकीदुःखभञ्जनः । अयोनिसम्भवः श्रीमान्पृथिवीभारहारकः
    ॥ ५१॥ पूतनायै मातृगतिं प्रदाता च कृपानिधिः । बककेशिप्रलम्बानां ममापि मोक्षकारकः ॥ ५२॥ स्वेच्छामय गुणातीत
    भक्तानां भयभञ्जन । प्रसीद राधिकानाथ प्रसीद कुरु मोक्षणम् ॥ ५३॥ हे नाथ गार्दभीयोनेः समुद्धर भवार्णवात्
    । मूर्खस्त्वद्भक्तपुत्रोऽहं मामुद्धर्तुं त्वमर्हसि ॥ ५४॥ वेदा ब्रह्मादयो यं च मुनीन्द्राः स्तोतुमक्षमाः
    । किं स्तौमि तं गुणातीतं पुरा दैत्योऽधुना खरः ॥ ५५॥ एवं कुरु कृपासिन्धो येन मे न भवेज्जनुः । दृष्ट्वा
    पादारविन्दं ते कः पुनर्भवनं व्रजेत् ॥ ५६॥ ब्रह्मा स्तोता खरः स्तोता नोपहासितुमर्हसि । सदीश्वरस्य विज्ञस्य
    योग्यायोग्ये समा कृपा ॥ ५७॥ इत्येवमुक्त्वा दैत्येन्द्रस्तस्थौ च पुरतो हरेः । प्रसन्नवदनः श्रीमानतितुष्टो
    बभूव ह ॥ ५८॥ इदं दैत्यकृतं स्तोत्रं नित्यं भक्त्या च यः पठेत् । सालोक्यसार्ष्टिसामीप्यं लीलया लभते
    हरेः ॥ ५९॥ इह लोके हरेर्भक्तिमन्ते दास्यं सुदुर्लभम् । विद्यां श्रियं सुकवितां पुत्रपौत्रान्यशो लभेत्
    ॥ ६०॥ इति ब्रह्मवैवर्तपुराणे श्रीकृष्णजन्मखण्डे द्वाविंशाध्यायान्तर्गतं धानुकासुरकृतं श्रीकृष्णस्तोत्रं
    सम्पूर्णम् । ब्रह्मवैवर्तपुराण । श्रीकृष्णजन्म
