id: shatparamitastotram
category: stotram
name:
  english: shatparamitastotram
  devanagari: षट्पारमितास्तोत्रम्
content:
  english: shatparamitastotram danabalena samudgatabuddho danabaladhipata narasimhe | danabalekshaka shruyati
    shabdah karunikena pure pravishantam || 1|| shilabalena samudgatabuddho shilabaladhipata narasimhe
    | shilabalekshaka shruyati shabdah karunikena pure pravishantam || 2|| kshantibalena samudgatabuddho
    kshantibaladhipata narasimhe | kshantibalekshaka shruyati shabdah karunikena pure pravishantam ||
    3|| viryabalena samudgatabuddho viryabaladhipata narasimhe | viryabalekshaka shruyati shabdah karunikena
    pure pravishantam || 4|| dhyanabalena samudgatabuddho dhyanabaladhipata narasimhe | dhyanabalekshaka
    shruyati shabdah karunikena pure pravishantam || 5|| prajnabalena samudgatabuddhah prajnabaladhipata
    narasimhe | prajnabalekshaka shruyati shabdah karunikena pure pravishantam || 6|| iti shrishatparamitastotram
    sampurnam ||
  devanagari: षट्पारमितास्तोत्रम् दानबलेन समुद्गतबुद्धो दानबलाधिपता नरसिंहे । दानबलेक्षक श्रूयति शब्दः
    कारुणिकेन पुरे प्रविशन्तम् ॥ १॥ शीलबलेन समुद्गतबुद्धो शीलबलाधिपता नरसिंहे । शीलबलेक्षक श्रूयति शब्दः
    कारुणिकेन पुरे प्रविशन्तम् ॥ २॥ क्षान्तिबलेन समुद्गतबुद्धो क्षान्तिबलाधिपता नरसिंहे । क्षान्तिबलेक्षक
    श्रूयति शब्दः कारुणिकेन पुरे प्रविशन्तम् ॥ ३॥ वीर्यबलेन समुद्गतबुद्धो वीर्यबलाधिपता नरसिंहे । वीर्यबलेक्षक
    श्रुयति शब्दः कारुणिकेन पुरे प्रविशन्तम् ॥ ४॥ ध्यानबलेन समुद्गतबुद्धो ध्यानबलाधिपता नरसिंहे । ध्यानबलेक्षक
    श्रुयति शब्दः कारुणिकेन पुरे प्रविशन्तम् ॥ ५॥ प्रज्ञबलेन समुद्गतबुद्धः प्रज्ञबलाधिपता नरसिंहे । प्रज्ञबलेक्षक
    श्रूयति शब्दः कारुणिकेन पुरे प्रविशन्तम् ॥ ६॥ इति श्रीषट्पारमितास्तोत्रं सम्पूर्णम् ॥
