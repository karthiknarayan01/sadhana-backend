id: brahmastrabagalamukhikavacam
category: kavacha
name:
  english: brahmastrabagalamukhikavacam
  devanagari: ब्रह्मास्त्रबगलामुखीकवचम्
content:
  english: rinu brahman param guhya brahmastrakavacam shubham | yasyoccaranamatrena bhaved vai suryasannibhah
    || 3|| sudarshanam maya dattam kripaya vishnave tatha | tadvat brahmastravidyayah kavacam kavayamyaham
    || 4|| ashtavimshatyastrahetumadyam brahmastramuttamam | sarvatejomayam sarvam samarthyam vigraham
    param || 5|| sarvashatrukshayakaram sarvadaridryanashanam | sarvapacchailarashinamastrakam kulishopamam
    || 6|| na tasya shatravashcapi bhayam cauryabhayam jara | nara naryashca rajendra khaga vyaghradayo'pi
    ca || 7|| tam drishtva vashamayanti kimanyat sadhavo janah | yasya dehe nyased dhiman kavacam bagalamayam
    || 8|| sa eva purusho loke kevalah shankaropamah | na deyam parashishyaya shathaya pishunaya ca ||
    9|| datavyam bhaktiyuktaya gurudasaya dhimate | kavacasya rishih shriman dakshinamurtireva ca || 10||
    asyanushtap chandah syat shribagala casya devata | bijam shrivahnijaya ca shaktih shribagalamukhi
    || 11|| kilakam viniyogashca svakarye sarvasadhake | atha dhyanam | shuddhasvarnanibham ramam pitendukhandashekharam
    | pitagandhanuliptangim pitaratnavibhushanam || 1|| pinonnatakucam snigdham pitalangim supeshalam
    | trilocanam caturhastam gambhiram madavihvalam || 2|| vajrarirasanapashamudgaram dadhatim karaih
    | mahavyaghrasanam devim sarvadevanamaskritam || 3|| prasannam susmitam klinnam supitam pramadottamam
    | subhaktaduhkhaharane dayardram dinavatsalam || 4|| evam dhyatva pareshani bagalakavacam smaret |
    atha rakshakavacam | bagala me shirah patuh lalatam brahmasamstuta | bagala me bhruvau nityam karnayoh
    kleshaharini || 1|| trinetra cakshushi patu stambhini gandayostatha | mohini nasikam patu shridevi
    bagalamukhi || 2|| oshthayordurdhara patu sarvadanteshu cancala | siddhannapurna jihvayam jihvagre
    sharadambike || 3|| akalmasha mukhe patu cibuke bagalamukhi | dhira me kanthadeshe tu kanthagre kalakarshini
    || 4|| shuddhasvarnanibha patu kanthamadhye tatha'mbika | kanthamule mahabhoga skandhau shatruvinashini
    || 5|| bhujau me patu satatam bagala susmita para | bagala me sada patu kurpare kamalodbhava || 6||
    bagala'mba prakoshthau tu manibandhe mahabala | bagalashrirhastayoshca kurukulla karangulim || 7||
    nakheshu vajrahasta ca hridaye brahmavadini | stanau me mandagamana kukshayoryogini tatha || 8|| udaram
    bagala mata nabhim brahmastradevata | pushtim mudgarahasta ca patu no devavandita || 9|| parshvayorhanumadvandya
    pashupashavimocini | karau ramapriya patu uruyugmam maheshvari || 10|| bhagamala tu guhyam me lingam
    kameshvari tatha | lingamule mahaklinna vrishanau patu dutika || 11|| bagala januni patu januyugmam
    ca nityashah | janghe patu jagaddhatri gulphau ravanapujita || 12|| caranau durjaya patu pitamba caranangulih
    | padaprishtham padmahasta padadhashcakradharini || 13|| sarvangam bagala devi patu shribagalamukhi
    | brahmi me purvatah patu maheshi vahnibhagatah || 14|| kaumari dakshine patu vaishnavi svargamargatah
    | urdhvam pashadhara patu shatrujihvadhara hyadhah || 15|| rane rajakule vade mahayoge mahabhaye |
    bagala bhairavi patu nityam klinkararupini || 16|| phalashrutih | ityevam vajrakavacam mahabrahmastrasamjnakam
    | trisandhyam yah pathed dhiman sarvaishvaryamavapnuyat || 1|| na tasya shatravah ke'pi sakhayah sarva
    eva ca | balenakrishya shatrum syat so'pi mitratvamapnuyat || 2|| shatrutve maruta tulyo dhanena dhanadopamah
    | rupena kamatulyah syad ayusha shuladhriksamah || 3|| sanakadisamo dhairye shriya vishnusamo bhavet
    | tattulyo vidyaya brahman yo japet kavacam narah || 4|| nari vapi prayatnena vanchitarthamavapnuyat
    | dvitiya suryavarena yada bhavati padmabhuh || 5|| tasyam jatam shatavritya shighram pratyakshamapnuyat
    | yata turiyam sandhyayam bhushayyayam prayatnatah || 6|| sarvan shatrun kshayam kritva vijayam prapnuyan
    narah | daridryan mucyate ca''shu sthira lakshmirbhaved grihe || 7|| sarvan kamanavapnoti savisho
    nirvisho bhavet | rinam nirmocanam syad vai sahasravartanad vidhe || 8|| bhutapretapishacadipida tasya
    na jayate | dyumanirbhrajate yadvat tadvat syacchriprabhavatah || 9|| sthirabhaya bhavet tasya yah
    smared bagalamukhim | jayadam bodhanam kamamamukam dehi me shive || 10|| japasyante smared yo vai
    so'bhishtaphalamapnuyat | idam kavacamajnatva yo japed bagalamukhim || 11|| na sa siddhimavapnoti
    sakshad vai lokapujitah | tasmat sarvaprayatnena kavacam brahmatejasam || 12|| nityam padambujadhyanan
    maheshanasamo bhavet | iti shridakshinamurtisamhitayam brahmastrabagalamukhikavacam samaptam |
  devanagari: ृणु ब्रह्मन् परं गुह्य ब्रह्मास्त्रकवचं शुभम् । यस्योच्चारणमात्रेण भवेद् वै सूर्यसन्निभः
    ॥ ३॥ सुदर्शनं मया दत्तं कृपया विष्णवे तथा । तद्वत् ब्रह्मास्त्रविद्यायाः कवचं कवयाम्यहम् ॥ ४॥ अष्टाविंशत्यस्त्रहेतुमाद्यं
    ब्रह्मास्त्रमुत्तमम् । सर्वतेजोमयं सर्वं सामर्थ्यं विग्रहं परम् ॥ ५॥ सर्वशत्रुक्षयकरं सर्वदारिद्र्यनाशनम्
    । सर्वापच्छैलराशीनामस्त्रकं कुलिशोपमम् ॥ ६॥ न तस्य शत्रवश्चापि भयं चौर्यभयं जरा । नरा नार्यश्च राजेन्द्र
    खगा व्याघ्रादयोऽपि च ॥ ७॥ तं दृष्ट्वा वशमायान्ति किमन्यत् साधवो जनाः । यस्य देहे न्यसेद् धीमान् कवचं
    बगलामयम् ॥ ८॥ स एव पुरुषो लोके केवलः शङ्करोपमः । न देयं परशिष्याय शठाय पिशुनाय च ॥ ९॥ दातव्यं भक्तियुक्ताय
    गुरुदासाय धीमते । कवचस्य ऋषिः श्रीमान् दक्षिणामूर्तिरेव च ॥ १०॥ अस्यानुष्टप् छन्दः स्यात् श्रीबगला
    चास्य देवता । बीजं श्रीवह्निजाया च शक्तिः श्रीबगलामुखी ॥ ११॥ कीलकं विनियोगश्च स्वकार्ये सर्वसाधके
    । अथ ध्यानम् । शुद्धस्वर्णनिभां रामां पीतेन्दुखण्डशेखराम् । पीतगन्धानुलिप्ताङ्गीं पीतरत्नविभूषणाम्
    ॥ १॥ पीनोन्नतकुचां स्निग्धां पीतलाङ्गीं सुपेशलाम् । त्रिलोचनां चतुर्हस्तां गम्भीरां मदविह्वलाम् ॥
    २॥ वज्रारिरसनापाशमुद्गरं दधतीं करैः । महाव्याघ्रासनां देवीं सर्वदेवनमस्कृताम् ॥ ३॥ प्रसन्नां सुस्मितां
    क्लिन्नां सुपीतां प्रमदोत्तमाम् । सुभक्तदुःखहरणे दयार्द्रां दीनवत्सलाम् ॥ ४॥ एवं ध्यात्वा परेशानि
    बगलाकवचं स्मरेत् । अथ रक्षाकवचम् । बगला मे शिरः पातुः ललाटं ब्रह्मसंस्तुता । बगला मे भ्रुवौ नित्यं
    कर्णयोः क्लेशहारिणी ॥ १॥ त्रिनेत्रा चक्षुषी पातु स्तम्भिनी गण्डयोस्तथा । मोहिनी नासिकां पातु श्रीदेवी
    बगलामुखी ॥ २॥ ओष्ठयोर्दुर्धरा पातु सर्वदन्तेषु चञ्चला । सिद्धान्नपूर्णा जिह्वायां जिह्वाग्रे शारदाम्बिके
    ॥ ३॥ अकल्मषा मुखे पातु चिबुके बगलामुखी । धीरा मे कण्ठदेशे तु कण्ठाग्रे कालकर्षिणी ॥ ४॥ शुद्धस्वर्णनिभा
    पातु कण्ठमध्ये तथाऽम्बिका । कण्ठमूले महाभोगा स्कन्धौ शत्रुविनाशिनी ॥ ५॥ भुजौ मे पातु सततं बगला सुस्मिता
    परा । बगला मे सदा पातु कूर्परे कमलोद्भवा ॥ ६॥ बगलाऽम्बा प्रकोष्ठौ तु मणिबन्धे महाबला । बगलाश्रीर्हस्तयोश्च
    कुरुकुल्ला कराङ्गुलिम् ॥ ७॥ नखेषु वज्रहस्ता च हृदये ब्रह्मवादिनी । स्तनौ मे मन्दगमना कुक्षयोर्योगिनी
    तथा ॥ ८॥ उदरं बगला माता नाभिं ब्रह्मास्त्रदेवता । पुष्टिं मुद्गरहस्ता च पातु नो देववन्दिता ॥ ९॥ पार्श्वयोर्हनुमद्वन्द्या
    पशुपाशविमोचिनी । करौ रामप्रिया पातु ऊरुयुग्मं महेश्वरी ॥ १०॥ भगमाला तु गुह्यं मे लिङ्गं कामेश्वरी
    तथा । लिङ्गमूले महाक्लिन्ना वृषणौ पातु दूतिका ॥ ११॥ बगला जानुनी पातु जानुयुग्मं च नित्यशः । जङ्घे
    पातु जगद्धात्री गुल्फौ रावणपूजिता ॥ १२॥ चरणौ दुर्जया पातु पीताम्बा चरणाङ्गुलीः । पादपृष्ठं पद्महस्ता
    पादाधश्चक्रधारिणी ॥ १३॥ सर्वाङ्गं बगला देवी पातु श्रीबगलामुखी । ब्राह्मी मे पूर्वतः पातु माहेशी वह्निभागतः
    ॥ १४॥ कौमारी दक्षिणे पातु वैष्णवी स्वर्गमार्गतः । ऊर्ध्वं पाशधरा पातु शत्रुजिह्वाधरा ह्यधः ॥ १५॥ रणे
    राजकुले वादे महायोगे महाभये । बगला भैरवी पातु नित्यं क्लीङ्काररूपिणी ॥ १६॥ फलश्रुतिः । इत्येवं वज्रकवचं
    महाब्रह्मास्त्रसंज्ञकम् । त्रिसन्ध्यं यः पठेद् धीमान् सर्वैश्वर्यमवाप्नुयात् ॥ १॥ न तस्य शत्रवः केऽपि
    सखायः सर्व एव च । बलेनाकृष्य शत्रुं स्यात् सोऽपि मित्रत्वमाप्नुयात् ॥ २॥ शत्रुत्वे मरुता तुल्यो धनेन
    धनदोपमः । रूपेण कामतुल्यः स्याद् आयुषा शूलधृक्समः ॥ ३॥ सनकादिसमो धैर्ये श्रिया विष्णुसमो भवेत् । तत्तुल्यो
    विद्यया ब्रह्मन् यो जपेत् कवचं नरः ॥ ४॥ नारी वापि प्रयत्नेन वाञ्छितार्थमवाप्नुयात् । द्वितीया सूर्यवारेण
    यदा भवति पद्मभूः ॥ ५॥ तस्यां जातं शतावृत्या शीघ्रं प्रत्यक्षमाप्नुयात् । याता तुरीयं सन्ध्यायां भूशय्यायां
    प्रयत्नतः ॥ ६॥ सर्वान् शत्रून् क्षयं कृत्वा विजयं प्राप्नुयान् नरः । दारिद्र्यान् मुच्यते चाऽऽशु स्थिरा
    लक्ष्मीर्भवेद् गृहे ॥ ७॥ सर्वान् कामानवाप्नोति सविषो निर्विषो भवेत् । ऋणं निर्मोचनं स्याद् वै सहस्रावर्तनाद्
    विधे ॥ ८॥ भूतप्रेतपिशाचादिपीडा तस्य न जायते । द्युमणिर्भ्राजते यद्वत् तद्वत् स्याच्छ्रीप्रभावतः ॥
    ९॥ स्थिराभया भवेत् तस्य यः स्मरेद् बगलामुखीम् । जयदं बोधनं कामममुकं देहि मे शिवे ॥ १०॥ जपस्यान्ते
    स्मरेद् यो वै सोऽभीष्टफलमाप्नुयात् । इदं कवचमज्ञात्वा यो जपेद् बगलामुखीम् ॥ ११॥ न स सिद्धिमवाप्नोति
    साक्षाद् वै लोकपूजितः । तस्मात् सर्वप्रयत्नेन कवचं ब्रह्मतेजसम् ॥ १२॥ नित्यं पदाम्बुजध्यानान् महेशानसमो
    भवेत् । इति श्रीदक्षिणामूर्तिसंहितायां ब्रह्मास्त्रबगलामुखीकवचं समाप्तम् ।
