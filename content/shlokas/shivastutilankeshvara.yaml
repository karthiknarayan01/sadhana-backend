id: shivastutilankeshvara
category: stotram
name:
  english: shivastutilankeshvara
  devanagari: शिवस्तुतिलन्केश्वर
content:
  english: shrishivastuti lankeshvarakrita shriganeshaya namah | gale kalitakalima prakatitendubhalasthale
    vinatitajatotkaram rucirapanipathoruhe | udancitakapalakam jaghanasimni sandarshitadvipajinamanukshanam
    kimapi dhama vandamahe || 1|| vrishopari parisphuraddhavaladhamadhamashriyam kuberagirigaurimaprabhavagarvanirvasi
    tat | kvacitpunarumakucopacitakunkumai ranjitam gajajinavirajitam vrijinabhangabijam bhaje || 2||
    uditvaravilocanatrayavisritvarajyotisha kalakarakalakaravyatikarena caharnisham | vikasitajatataviviharanotsavaprollasattaramarataranginitaralacudamide
    mridam || 3|| vihaya kamalalayavilasitani vidyunnatividambanapatuni me viharanam vidhattam manah |
    kapardini kumudvatiramanakhandacudamanau katitatapatibhavatkaraticarmani brahmani || 4|| bhavadbhavanadehalivikatatundadandahatitrutanmukutakotibhirmaghavadadibhirbhuyate
    | vrajema bhavadantikam prakritimetya paishacikim kimityamarasampadah pramathanatha nathamahe || 5||
    tvadarcanaparayanapramathakanyakalunthitaprasunasaphaladrumam kamapi shailamashasmahe | alam tatavitardikashayitasiddhisimantiniprakirnasumanomanoramanamerunameruna
    || 6|| na jatu hara yatu me vishayadurvilasam manomanobhavakathastu me na ca manorathatithyabhuh |
    sphuratsurataranginitatakutirakotau vasannaye shiva divanisham tava bhavani pujaparah || 7|| vibhushanasurapagashucitaralavalavalivaladvahalasikaraprakarasekasamvardhita
    | maheshvarasuradrumasphuritasajjatamanjari namajjanaphalaprada mama nu hanta bhuyadiyam || 8|| bahirvishayasangatipratinivartitakshavaleh
    samadhikalitatmanah pashupaterasheshatmanah | shirahsurasarittatikutilakalpakalpadrumam nishakarakalamaham
    batuvimrishyamanam bhaje || 9|| tvadiyasuravahinivimalavaridharavalajjatagahanagahini matiriyam mama
    kramatu | upottamasarittativitapitatavi prollasattapasviparishattulamamalamallikabha prabho || 10||
    iti shrilankeshvaraviracita shivastutih samapta ||
  devanagari: श्रीशिवस्तुती लङ्केश्वरकृत श्रीगणेशाय नमः । गले कलितकालिम प्रकटितेन्दुभालस्थले विनाटितजटोत्करं
    रुचिरपाणिपाथोरुहे । उदञ्चितकपालकं जघनसीम्नि सन्दर्शितद्विपाजिनमनुक्षणं किमपि धाम वन्दामहे ॥ १॥ वृषोपरि
    परिस्फुरद्धवलधामधामश्रियां कुबेरगिरिगौरिमप्रभवगर्वनिर्वासि तत् । क्वचित्पुनरुमाकुचोपचितकुङ्कुमै रञ्जितं
    गजाजिनविराजितं वृजिनभङ्गबीजं भजे ॥ २॥ उदित्वरविलोचनत्रयविसृत्वरज्योतिषा कलाकरकलाकरव्यतिकरेण चाहर्निशम्
    । विकासितजटाटवीविहरणोत्सवप्रोल्लसत्तरामरतरङ्गिणीतरलचूडमीडे मृडम् ॥ ३॥ विहाय कमलालयाविलसितानि विद्युन्नटीविडम्बनपटूनि
    मे विहरणं विधत्तां मनः । कपर्दिनि कुमुद्वतीरमणखण्डचूडामणौ कटीतटपटीभवत्करटिचर्मणि ब्रह्मणि ॥ ४॥ भवद्भवनदेहलीविकटतुण्डदण्डाहतित्रुटन्मुकुटकोटिभिर्मघवदादिभिर्भूयते
    । व्रजेम भवदन्तिकं प्रकृतिमेत्य पैशाचिकीं किमित्यमरसम्पदः प्रमथनाथ नाथामहे ॥ ५॥ त्वदर्चनपरायणप्रमथकन्यकालुण्ठितप्रसूनसफलद्रुमं
    कमपि शैलमाशास्महे । अलं तटवितर्दिकाशयितसिद्धिसीमन्तिनीप्रकीर्णसुमनोमनोरमणमेरुणामेरुणा ॥ ६॥ न जातु
    हर यातु मे विषयदुर्विलासं मनोमनोभवकथास्तु मे न च मनोरथातिथ्यभूः । स्फुरत्सुरतरङ्गिणीतटकुटीरकोटौ वसन्नये
    शिव दिवानिशं तव भवानि पूजापरः ॥ ७॥ विभूषणसुरापगाशुचितरालवालावलीवलद्वहलसीकरप्रकरसेकसंवर्धिता । महेश्वरसुरद्रुमस्फुरितसज्जटामञ्जरी
    नमज्जनफलप्रदा मम नु हन्त भूयादियम् ॥ ८॥ बहिर्विषयसङ्गतिप्रतिनिवर्तिताक्षावलेः समाधिकलितात्मनः पशुपतेरशेषात्मनः
    । शिरःसुरसरित्तटीकुटिलकल्पकल्पद्रुमं निशाकरकलामहं बटुविमृश्यमानां भजे ॥ ९॥ त्वदीयसुरवाहिनीविमलवारिधारावलज्जटागहनगाहिनी
    मतिरियं मम क्रामतु । उपोत्तमसरित्तटीविटपिताटवी प्रोल्लसत्तपस्विपरिषत्तुलाममलमल्लिकाभ प्रभो ॥ १०॥ इति
    श्रीलङ्केश्वरविरचिता शिवस्तुतिः समाप्ता ॥
