    लोपामुद्रायै नमः । ह्रीं लङ्किन्यै नमः । ९५० ह्रीं लाक्षारुणायै नमः । ह्रीं लोककान्तायै नमः । ह्रीं
    ललितायै नमः । ह्रीं ललितप्रियायै नमः । ह्रीं लक्ष्मणप्रेयस्यै नमः । ह्रीं लक्ष्यभेदिन्यै नमः । ह्रीं
    लवणान्तकायै नमः । ह्रीं लतासाधनसम्पूज्यायै नमः । ह्रीं लोहितस्रवमण्डितायै नमः । ह्रीं लोकघ्न्यै नमः
    । ९६० ह्रीं लोकजनन्यै नमः । ह्रीं वामाचारपरायणायै नमः । ह्रीं वाराह्यै नमः । ह्रीं वङ्गदेशस्थायै नमः
    । ह्रीं वज्रिण्यै नमः । ह्रीं वज्रकालिकायै नमः । ह्रीं वज्रज्वालायै नमः । ह्रीं वज्रवाराह्यै नमः ।
    ह्रीं वज्रश
