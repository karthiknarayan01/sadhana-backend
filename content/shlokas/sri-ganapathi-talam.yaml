id: sri-ganapathi-talam
category: stotram
name:
  english: Sri Ganapathi Talam
content:
  english: vikatotkatasundaradantimukham bhujagendrasusarpagadabharanam | gajanilagajendra ganadhipatim
    pranato'smi vinayaka hastimukham || || sura sura ganapati sundarakesham rishi rishi ganapati yajnasamanam
    | bhava bhava ganapati padmashariram jaya jaya ganapati divyanamaste || || gajamukhavaktram girijaputram
    ganagunamitram ganapatimishapriyam || || karadhritaparashum kankanapanim kabalitapadmarucim | surapativandyam
    sundaranrittam suracitamanimakutam || || pranamata devam prakatita talam shadgiri talamidam | tattat
    shadgiri talamidam tattat shadgiri talamidam || || lambodaravara kunjasurakrita kunkumavarnadharam
    | shvetasashringam modakahastam pritisapanasaphalam || || nayanatrayavara nagavibhushita nanaganapatidam
    tattat nayanatrayavara nagavibhushita nanaganapatidam tattat nanaganapati tam tattat nanaganapatidam
    || || dhavalita jaladharadhavalita candram phanimanikiranavibhushita khadgam | tanutanuvishahara shulakapalam
    hara hara shiva shiva ganapatimabhayam || || katatata vigalitamadajala jaladhita ganapativadyamidam
    katatata vigalitamadajala jaladhita ganapativadyamidam tattat ganapativadyamidam tattat ganapativadyamidam
    || || tattadim nam tariku tarijanaku kuku taddi kuku takita dindingu diguna kuku taddi tatta jham
    jham tarita ta jham jham tarita takata jham jham tarita ta jham jham tarita taridanata danajanuta
    janudimita kitataka tarikitatom takita kitataka tarikitatom takita kitataka tarikitatom tam || ||
    takatakita takatakita takatakita tattom shashikalita shashikalita maulinam shulinam | takatakita takatakita
    takatakita tattom vimalashubhakamalajalapadukam paninam | dhittakita dhittakita dhittakita tattom
    pramathaganagunakathitashobhanam shobhitam | dhittakita dhittakita dhittakita tattom prithulabhujasarasija
    vishanakam poshanam | takatakita takatakita takatakita tattom panasaphalakadaliphalamodanam modakam
    | dhittakita dhittakita dhittakita tattom pranataguru shivatanaya ganapati talanam | ganapati talanam
    ganapati talanam ||
  devanagari: विकटोत्कटसुन्दरदन्तिमुखं भुजगेन्द्रसुसर्पगदाभरणम् । गजनीलगजेन्द्र गणाधिपतिं प्रणतोऽस्मि
    विनायक हस्तिमुखम् ॥ ॥ सुर सुर गणपति सुन्दरकेशं ऋषि ऋषि गणपति यज्ञसमानम् । भव भव गणपति पद्मशरीरं जय
    जय गणपति दिव्यनमस्ते ॥ ॥ गजमुखवक्त्रं गिरिजापुत्रं गणगुणमित्रं गणपतिमीशप्रियम् ॥ ॥ करधृतपरशुं कङ्कणपाणिं
    कबलितपद्मरुचिम् । सुरपतिवन्द्यं सुन्दरनृत्तं सुरचितमणिमकुटम् ॥ ॥ प्रणमत देवं प्रकटित तालं षड्गिरि
    तालमिदम् । तत्तत् षड्गिरि तालमिदं तत्तत् षड्गिरि तालमिदम् ॥ ॥ लम्बोदरवर कुञ्जासुरकृत कुङ्कुमवर्णधरम्
    । श्वेतसशृङ्गं मोदकहस्तं प्रीतिसपनसफलम् ॥ ॥ नयनत्रयवर नागविभूषित नानागणपतिदं तत्तत् नयनत्रयवर नागविभूषित
    नानागणपतिदं तत्तत् नानागणपति तं तत्तत् नानागणपतिदम् ॥ ॥ धवलित जलधरधवलित चन्द्रं फणिमणिकिरणविभूषित
    खड्गम् । तनुतनुविषहर शूलकपालं हर हर शिव शिव गणपतिमभयम् ॥ ॥ कटतट विगलितमदजल जलधित गणपतिवाद्यमिदं कटतट
    विगलितमदजल जलधित गणपतिवाद्यमिदं तत्तत् गणपतिवाद्यमिदं तत्तत् गणपतिवाद्यमिदम् ॥ ॥ तत्तदिं नं तरिकु
    तरिजणकु कुकु तद्दि कुकु तकिट डिण्डिङ्गु डिगुण कुकु तद्दि तत्त झं झं तरित त झं झं तरित तकत झं झं तरित
    त झं झं तरित तरिदणत दणजणुत जणुदिमित किटतक तरिकिटतों तकिट किटतक तरिकिटतों तकिट किटतक तरिकिटतों ताम्
    ॥ ॥ तकतकिट तकतकिट तकतकिट तत्तों शशिकलित शशिकलित मौलिनं शूलिनम् । तकतकिट तकतकिट तकतकिट तत्तों विमलशुभकमलजलपादुकं
    पाणिनम् । धित्तकिट धित्तकिट धित्तकिट तत्तों प्रमथगणगुणकथितशोभनं शोभितम् । धित्तकिट धित्तकिट धित्तकिट
    तत्तों पृथुलभुजसरसिज विषाणकं पोषणम् । तकतकिट तकतकिट तकतकिट तत्तों पनसफलकदलिफलमोदनं मोदकम् । धित्तकिट
    धित्तकिट धित्तकिट तत्तों प्रणतगुरु शिवतनय गणपति तालनम् । गणपति तालनं गणपति तालनम् ॥
