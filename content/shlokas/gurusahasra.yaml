id: gurusahasra
category: stotram
name:
  english: gurusahasra
  devanagari: गुरुसहस्र
content:
  english: bhavyo yajnapravarttakah | dyaurdivau divao divyau bhavi bhavabhayapaha || 96|| parvatibhavasahito
    bhartta lakshmivilasavan | vilasi sahasi sarvo gurvi garvitalocanah || 97|| mayacari sudharmajno jivano
    jivanantakah | yamo yamariryamano yami yamavidhayakah || 98|| lalita candrikamali mali malambujashrayah
    | ambujaksho mahayaksho dakshashcintamanih prabhuh || 99|| meroshcaiva ca kedarabadaryyashramamagatah
    | badarivanasantapto vyasah satyavati sutah || 100|| bhramararinihanta ca sudhasindhuvidhudayah |
    candro ravih shivah shuli cakri caiva gadadharah || 101|| sahasranama ca guroh pathitavyam samahitaih
    | smaranatpaparashinam khandanam mrityunashanam || 102|| gurubhaktapriyakaram mahadaridryanashanam
    | brahmahatya surapanam parastrigamanam tatha || 103|| paradravyapaharanam paradoshasamanvitam | manasam
    vacikam kayam yatpapam papasambhavam || 104|| sahasranamapathanatsarvam nashyati tatkshanat | mahadaridryayukto
    yo gururva gurubhaktiman || 105|| kartikyam yah pathedratrau shatamashtottaram pathet | suvarnambaradhari
    ca sugandhapushpacandanaih || 106|| pustakam pujayitva ca naivedyadibhireva ca | mahamayankito dhiro
    padmamalavibhushanah || 107|| pratarashtottaram devi pathannama sahasrakam | caitrashukle ca krishne
    ca kuhusankrantivasare || 108|| pathitavyam prayatnena trailokyam mohayetkshanat | muktanammalaya
    yukto gurubhaktya samanvitah || 109|| ravivare ca shukre ca dvadashyam shraddhavasare | brahmananbhojayitva
    ca pujayitva vidhanatah || 110|| pathannamasahasram ca tatah siddhih prajayate | mahanishayam satatam
    gurau va yah pathetsada || 111|| deshantaragata lakshmih samayati na samshayah | trailokye ca mahalakshmim
    sundaryah kamamohitah || 112|| mugdhah svayam samayanti gauravacca bhajanti tah | rogartto mucyate
    rogatbaddho mucyeta bandhanat || 113|| gurvini vindate putram kanya vindati satpatim | rajano vashatam
    yanti kimpunah kshudramanushah || 114|| sahasranamashravanatpathanatpujanatpriye | dharanatsarvamapnoti
    guravo natra samshayah || 115|| yah pathedgurubhaktah san sa yati paramam padam | krishnenoktam samasadya
    maya proktam pura shivam || 116|| naradaya maya proktam naradena prakashitam | maya tvayi vararohe
  devanagari: भव्यो यज्ञप्रवर्त्तकः । द्यौर्दिवौ दिवओ दिव्यौ भावी भावभयापहा ॥ ९६॥ पार्वतीभावसहितो भर्त्ता
    लक्ष्मीविलासवान् । विलासी सहसी सर्वो गुर्वी गर्वितलोचनः ॥ ९७॥ मायाचारी सुधर्मज्ञो जीवनो जीवनान्तकः
    । यमो यमारिर्यमनो यामी यामविधायकः ॥ ९८॥ ललिता चन्द्रिकामाली माली मालाम्बुजाश्रयः । अम्बुजाक्षो महायक्षो
    दक्षश्चिन्तामणिः प्रभुः ॥ ९९॥ मेरोश्चैव च केदारबदर्य्याश्रममागतः । बदरीवनसन्तप्तो व्यासः सत्यवती सुतः
    ॥ १००॥ भ्रमरारिनिहन्ता च सुधासिन्धुविधूदयः । चन्द्रो रविः शिवः शूली चक्री चैव गदाधरः ॥ १०१॥ सहस्रनाम
    च गुरोः पठितव्यं समाहितैः । स्मरणात्पापराशीनां खण्डनं मृत्युनाशनम् ॥ १०२॥ गुरुभक्तप्रियकरं महादारिद्र्यनाशनम्
    । ब्रह्महत्या सुरापानं परस्त्रीगमनं तथा ॥ १०३॥ परद्रव्यापहरणं परदोषसमन्वितम् । मानसं वाचिकं कायं यत्पापं
    पापसम्भवम् ॥ १०४॥ सहस्रनामपठनात्सर्वं नश्यति तत्क्षणात् । महादारिद्र्ययुक्तो यो गुरुर्वा गुरुभक्तिमान्
    ॥ १०५॥ कार्तिक्यां यः पठेद्रात्रौ शतमष्टोत्तरं पठेत् । सुवर्णाम्बरधारी च सुगन्धपुष्पचन्दनैः ॥ १०६॥
    पुस्तकं पूजयित्वा च नैवेद्यादिभिरेव च । महामायाङ्कितो धीरो पद्ममालाविभूषणः ॥ १०७॥ प्रातरष्टोत्तरं
    देवि पठन्नाम सहस्रकम् । चैत्रशुक्ले च कृष्णे च कुहुसङ्क्रान्तिवासरे ॥ १०८॥ पठितव्यं प्रयत्नेन त्रैलोक्यं
    मोहयेत्क्षणात् । मुक्तानाम्मालया युक्तो गुरुभक्त्या समन्वितः ॥ १०९॥ रविवारे च शुक्रे च द्वादश्यां
    श्राद्धवासरे । ब्राह्मणान्भोजयित्वा च पूजयित्वा विधानतः ॥ ११०॥ पठन्नामसहस्रं च ततः सिद्धिः प्रजायते
    । महानिशायां सततं गुरौ वा यः पठेत्सदा ॥ १११॥ देशान्तरगता लक्ष्मीः समायाति न संशयः । त्रैलोक्ये च महालक्ष्मीं
    सुन्दर्यः काममोहिताः ॥ ११२॥ मुग्धाः स्वयं समायान्ति गौरवाच्च भजन्ति ताः । रोगार्त्तो मुच्यते रोगात्बद्धो
    मुच्येत बन्धनात् ॥ ११३॥ गुर्विणी विन्दते पुत्रं कन्या विन्दति सत्पतिम् । राजानो वशतां यान्ति किम्पुनः
    क्षुद्रमानुषाः ॥ ११४॥ सहस्रनामश्रवणात्पठनात्पूजनात्प्रिये । धारणात्सर्वमाप्नोति गुरवो नात्र संशयः
    ॥ ११५॥ यः पठेद्गुरुभक्तः सन् स याति परमं पदम् । कृष्णेनोक्तं समासाद्य मया प्रोक्तं पुरा शिवम् ॥ ११६॥
    नारदाय मया प्रोक्तं नारदेन प्रकाशितम् । मया त्वयि वरारोहे
