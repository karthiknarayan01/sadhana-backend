id: mrityulangulavidyopanishat
category: upanishad
name:
  english: mrityulangulavidyopanishat
  devanagari: मृत्युलान्गूलविद्योपनिषत्
content:
  english: yajushi mrityulangulavidyopanishat om sahanavavatu || sahanaubhunaktu || saha viryam karavavahai
    || tejasvinavadhitamastu ma vidvishavahai || om shamtih | shamtih || shamtih ||| om ekada mahakailase
    sukhasinam mahadevamupagamya pranipatya bho bhagavan mrityulangulavidyamanubruhityuvaca vasishthah
    | athaha bhagavanmahadevo mrityulangulavidyam vakshyamiti | mrityossamayavabodhanat mrityulangulamityucyate
    | asyah shrimrityulangulavidyayah ulukanangano bhagavanrishih | anushtupchandah | mrityulangulo devata
    | klamityadinyasah | || dhyanam || nilaparvatasankasha rudrakopasamudbhava | kaladandadhara shrimanvaivasvata
    namo'stu te || athato yogavinyaso madhuvadini ahankaro nahankarasya || rita~ satyam param brahma purusham
    krishna pingalam | udhvaretam virupaksham vishvarupaya vai namo namah || lamityadipancapuja | iyam
    vidya sayampratah sandhyayorupasthanatpurvam vistritangushthatarjanimudraya savyam panim bhumau vinyasya
    dakshinabhimukham shishtairjapyate | svantyakala jnanamapi sukaramasya japanushthanena ityapyahushca
    mantrikah || || mulamantrah || om namo bhagavate umapataye varavrishabha phenakapolaya pashupataye
    namo namah || iti smrite mrityulangule brahmaha'brahmaha bhavati | svarnasteyi asteyi bhavati | surapayi
    apayi bhavati | gurutalpagami agami bhavati | abrahmacari subrahmacari bhavati | ekavarena japitva
    ashtottara shatasahasralaksha gayatri japa phalani bhavanti | ashtau brahmanan samyakgrahayitva
  devanagari: याजुषी मृत्युलाङ्गूलविद्योपनिषत् ॐ सहनाववतु ॥ सहनौभुनक्तु ॥ सह वीर्यं करवावहै ॥ तेजस्विनावधीतमस्तु
    मा विद्विषावहै ॥ ॐ शांतिः । शांतिः ॥ शांतिः ॥। ॐ एकदा महाकैलासे सुखासीनं महादेवमुपगम्य प्रणिपत्य भो
    भगवन् मृत्युलाङ्गूलविद्यामनुब्रूहीत्युवाच वसिष्ठः । अथाह भगवान्महादेवो मृत्युलाङ्गुलविद्यां वक्ष्यामीति
    । मृत्योस्समयावबोधनात् मृत्युलाङ्गुलमित्युच्यते । अस्याः श्रीमृत्युलाङ्गूलविद्यायाः उलूकनाङ्गनो भगवानृषिः
    । अनुष्टुप्छन्दः । मृत्युलाङ्गूलो देवता । क्लामित्यादिन्यासाः । ॥ ध्यानम् ॥ नीलपर्वतसङ्काश रुद्रकोपसमुद्भव
    । कालदण्डधर श्रीमन्वैवस्वत नमोऽस्तु ते ॥ अथातो योगविन्यासो मधुवादिनी अहङ्कारो नाहङ्कारस्य ॥ ऋतँ सत्यं
    परं ब्रह्म पुरुषं कृष्ण पिङ्गलम् । ऊध्वरेतं विरूपाक्षं विश्वरूपाय वै नमो नमः ॥ लमित्यादिपञ्चपूजा ।
    इयं विद्या सायम्प्रातः सन्ध्ययोरुपस्थानात्पूर्वं विस्तृताङ्गुष्ठतर्जनीमुद्रया सव्यं पाणिं भूमौ विन्यस्य
    दक्षिणाभिमुखं शिष्टैर्जप्यते । स्वान्त्यकाल ज्ञानमपि सुकरमस्या जपानुष्ठानेन इत्यप्याहुश्च मान्त्रिकाः
    ॥ ॥ मूलमन्त्रः ॥ ॐ नमो भगवते उमापतये वरवृषभ फेनकपोलाय पशुपतये नमो नमः ॥ इति स्मृते मृत्युलाङ्गूले
    ब्रह्महाऽब्रह्महा भवति । स्वर्णस्तेयी अस्तेयी भवति । सुरापायी अपायी भवति । गुरुतल्पगामी अगामी भवति
    । अब्रह्मचारी सुब्रह्मचारी भवति । एकवारेण जपित्वा अष्टोत्तर शतसहस्रलक्ष गायत्री जप फलानि भवन्ति ।
    अष्टौ ब्राह्मणान् सम्यक्ग्राहयित्वा
