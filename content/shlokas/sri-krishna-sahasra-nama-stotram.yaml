id: sri-krishna-sahasra-nama-stotram
category: stotram
name:
  english: Sri Krishna Sahasra Nama Stotram
content:
  english: om asya shrikrishnasahasranamastotramantrasya parashara rishih shrikrishnah paramatma devata
    shrikrishnaprityarthe jape viniyogah || nyasah parasharaya rishaye namah iti shirasi anushtup chandase
    namah iti mukhe gopalakrishnadevatayai namah iti hridaye shrikrishnaya bijaya namah iti guhye shrivallabhaya
    shaktyai namah iti padayoh sharngadharaya kilakaya namah iti sarvange || karanyasah shrikrishna ityarabhya
    shuravamshaikadhirityantani angushthabhyam namah | shaurirityarabhya svabhasodbhasitavraja ityantani
    tarjanibhyam namah | kritatmavidyavinyasa ityarabhya prasthanashakatarudha iti madhyamabhyam namah
    brindavanakritalaya ityarabhya madhurajanavikshita ityanamikabhyam namah rajakapratighataka ityarabhya
    dvarakapurakalpana iti kanishthikabhyam namah dvarakanilaya ityarabhya parashara iti karatalakaraprishthabhyam
    namah evam hridayadinyasah || dhyanam keshancitpremapumsam vigalitamanasam balalilavilasam kesham
    gopalalilankitarasikatanurvenuvadyena devam | kesham vamasamaje janitamanasijo daityadarpapahaivam
    jnatva bhinnabhilasham sa jayati jagatamishvarastadrisho'bhut || || kshirabdhau kritasamstavassuraganairbrahmadibhih
    panditaih prodbhuto vasudevasadmani muda cikrida yo gokule | kamsadhvamsakrite jagama madhuram saramasadvarakam
    gopalo'khilagopikajanasakhah payadapayat sa nah || || phullendivarakantiminduvadanam barhavatamsapriyam
    shrivatsankamudarakaustubhadharam pitambaram sundaram | gopinam nayanotpalarcitatanum gogopasanghavritam
    govindam kalavenuvadanaratam divyangabhusham bhaje || || om | krishnah shrivallabhah sharngi vishvaksenah
    svasiddhidah | kshirodadhama vyuheshah sheshashayi jaganmayah || || bhaktigamyastrayimurtirbharartavasudhastutah
    | devadevo dayasindhurdevadevashikhamanih || || sukhabhavassukhadharo mukundo muditashayah | avikriyah
    kriyamurtiradhyatmasvasvarupavan || || shishtabhilakshyo bhutatma dharmatranarthaceshtitah | antaryami
    kalarupah kalavayavasakshikah || || vasudhayasaharano naradapreranonmukhah | prabhushnurnaradodgito
    lokarakshaparayanah || || rauhineyakritanando yogajnananiyojakah | mahaguhantarnikshiptah puranavapuratmavan
    || || shuravamshaikadhishshaurih kamsashankavishadakrit | vasudevollasacchaktirdevakyashtamagarbhagah
    || || vasudevasutah shrimandevakinandano harih | ashcaryabalah shrivatsalakshmavakshashcaturbhujah
    || || svabhavotkrishtasadbhavah krishnashtamyantasambhavah | prajapatyarkshasambhuto nishithasamayoditah
    || || shankhacakragadapadmapanih padmanibhekshanah | kiriti kaustubhoraskah sphuranmakarakundalah
    || || pitavasa ghanashyamah kuncitancitakuntalah | suvyaktavyaktabharanah sutikagrihabhushanah ||
    || karagarandhakaraghnah pitripragjanmasucakah | vasudevastutah stotram tapatrayanivaranah || || niravadyah
    kriyamurtirnyayavakyaniyojakah | adrishtaceshtah kutastho dhritalaukikavigrahah || || maharshimanasollaso
    mahimangaladayakah | santoshitasuravratah sadhucittaprasadakah || || janakopayanirdeshta devakinayanotsavah
    | pitripaniparishkaro mohitagararakshakah || || svashaktyuddhatitasheshakapatah pitrivahakah | sheshoragaphanacchatrashsheshoktakhyasahasrakah
    || || yamunapuravidhvamsi svabhasodbhasitavrajah | kritatmavidyavinyaso yogamayagrasambhavah || ||
    durganiveditodbhavo yashodatalpashayakah | nandagopotsavasphurtirvrajanandakarodayah || || sujatajatakarma
    shrirgopibhadroktinirvritah | alikanidropagamah putanastanapidanah || || stanyattaputanapranah putanakroshakarakah
    | vinyastarakshagodhuliryashodakaralalitah || || nandaghratashiromadhyah putanasugatipradah | balah
    paryankanidralurmukharpitapadangulih || || anjanasnigdhanayanah paryayankuritasmitah | lilakshastaralalokashshakatasurabhanjanah
    || || dvijoditasvastyayano mantraputajalaplutah | yashodotsangaparyanko yashodamukhavikshakah || ||
    yashodastanyamuditastrinavartadidussahah | trinavartasuradhvamsi matrivismayakarakah || || prashastanamakarano
    janucankramanotsukah | vyalambiculikaratno ghoshagopapraharshanah || || svamukhapratibimbarthi grivavyaghranakhojjvalah
    | pankanuleparuciro mamsalorukatitatah || || ghrishtajanukaradvandvah pratibimbanukarakrit | avyaktavarnavagvrittih
    smitalakshyaradodgamah || || dhatrikarasamalambi praskhalaccitracankramah | anurupavayasyadhyashcarukaumaracapalah
    || || vatsapucchasamakrishto vatsapucchavikarshanah | vismaritanyavyaparo gopagopimudavahah || ||
    akalavatsanirmokta vrajavyakroshasusmitah | navanitamahacoro darakaharadayakah || || pitholukhalasopanah
    kshirabhandavibhedanah | shikyabhandasamakarshi dhvantagarapraveshakrit || || bhusharatnaprakashadhyo
    gopyupalambhabhartsitah | paragadhusarakaro mridbhakshanakritekshanah || || baloktamritkatharambho
    mitrantargudhavigrahah | kritasantrasalolaksho jananipratyayavahah || || matridrishyattavadano vaktralakshyacaracarah
    | yashodalalitasvatma svayam svacchandyamohanah || || savitrisnehasamshlishtah savitristanalolupah
    | navanitarthanaprahvo navanitamahashanah || || mrishakopaprakamposhtho goshthanganavilokanah | dadhimanthaghatibhetta
    kinkinikvanasucitah || || haiyangavinarasiko mrishashrushcauryashankitah | jananishramavijnata damabandhaniyantritah
    || || damakalpashcalapango gadholukhalabandhanah | akrishtolukhalo'nantah kuberasutashapavit || |
    || naradoktiparamarshi yamalarjunabhanjanah | dhanadatmajasanghushto nandamocitabandhanah || || balakodgitanirato
    bahukshepoditapriyah | atmajno mitravashago gopigitagunodayah || || prasthanashakatarudho brindavanakritalayah
    | govatsapalanaikagro nanakridaparicchadah || || kshepanikshepanaprito venuvadyavisharadah | vrishavatsanukarano
    vrishadhvanavidambanah || || niyuddhalilasamhrishtah kujanukritakokilah | upattahamsagamanassarvajanturutanukrit
    || || bhringanukari dadhyannacoro vatsapurassarah | bali bakasuragrahi bakatalupradahakah || || bhitagoparbhakahuto
    bakacancuvidaranah | bakasurarirgopalo balo baladbhutavahah || || balabhadrasamashlishtah kritakridanilayanah
    | kridasetunidhanajnah plavangotplavano'dbhutah || || kandukakridano luptanandadibhavavedanah | sumano'lankritashirah
    svadusnigdhannashikyabhrit || || gunjapralambanacchannah pinchairalakaveshakrit | vanyashanapriyah
    shringaravakaritavatsakah || || manojnapallavottamsapushpasvecchattashatpadah | manjushinjitamanjiracaranah
    karakankanah || || anyonyashasanah kridapatuh paramakaitavah | pratidhvanapramuditah shakhacaturacankramah
    || || aghadanavasamharta vrajavighnavinashanah | vrajasanjivanah shreyonidhirdanavamuktidah || ||
    kalindipulinasinassahabhuktavrajarbhakah | kakshajatharavinyastavenurvallavaceshtitah || || bhujasandhyantaranyastashringavetrah
    shucismitah | vamapanisthadadhyannakabalah kalabhashanah || || angulyantaravinyastaphalah paramapavanah
    | adrishyatarnakanveshi vallavarbhakabhitiha || || adrishtavatsapavrato brahmavijnatavaibhavah | govatsavatsapanveshi
    virat || svasankalpanurupartho vatsavatsaparupadhrik | yathavatsakriyarupo yathasthananiveshanah ||
    || yathavrajarbhakakaro gogopistanyapassukhi | ciradvalohito danto brahmavijnatavaibhavah || || vicitrashaktirvyalinasrishtagovatsavatsapah
    | brahmatrapakaro dhatristutassarvarthasadhakah || || brahma brahmamayo'vyaktastejorupassukhatmakah
    | niruktam vyakritirvyakto niralambanabhavanah || || prabhavishnuratantriko devapakshartharupadhrik
    | akamassarvavedadiraniyasthularupavan || || vyapi vyapyah kripakarta vicitracarasammatah | chandomayah
    pradhanatma murtamurtidvayakritih || || anekamurtirakrodhah parah prakritirakramah | sakalavaranopetassarvadevo
    maheshvarah || || mahaprabhavanah purvavatsavatsapadarshakah | krishnayadavagopalo gopalokanaharshitah
    || || smitekshaharshitabrahma bhaktavatsalavakpriyah | brahmanandashrudhautanghrirlilavaicitryakovidah
    || || balabhadraikahridayo namakaritagokulah | gopalabalako bhavyo rajjuyajnopavitavan || || vrikshacchayahatashantirgopotsangopabarhanah
    | gopasamvahitapado gopavyajanavijitah || | gopaganasukhonnidrah shridamarjitasauhridah | sunandasuhridekatma
    subalapranaranjanah || || talivanakritakrido balapatitadhenukah | gopisaubhagyasambhavyo godhulicchuritalakah
    || || gopivirahasantapto gopikakritamajjanah | pralambabahurutphullapundarikavatamsakah || || vilasalalitasmeragarbhalilavalokanah
    | sragbhushananulepadhyo jananyupahritannabhuk || || varashayyashayo radhapremasallapanirvritah |
    yamunatatasancari vishartavrajaharshadah || || kaliyakrodhajanakah vriddhahikulaveshtitah | kaliyahiphanaranganatah
    kaliyamardanah || || nagapatnistutiprito nanaveshasamriddhikrit | avishvaktadrigatmeshah svadrigatmastutipriyah
    || || sarveshvarassarvagunah prasiddhassarvasatvatah | akunthadhama candrarkadrishtirakashanirmalah
    || || anirdeshyagatirnagavanitapatibhaikshadah | svanghrimudrankanagendramurdha kaliyasamstutah ||
    || abhayo vishvatashcakshuh stutottamagunah prabhuh | ahamatma marutpranah paramatma dyushirshavan
    || || nagopayanahrishtatma hradotsaritakaliyah | balabhadrasukhalapo gopalingananirvritah || || davagnibhitagopalagopta
    davagninashanah | nayanacchadanakridalampato nripaceshtitah || || kakapakshadharassaumyo balavahakakeliman
    | balaghatitadurdharshapralambo balavatsalah || || munjatavyagnishamanah pravritkalavinodavan | shilanyastannabhriddaityasamharta
    shadvalasanah || || sadaptagopikodgitah karnikaravatamsakah | nataveshadharah padmamalanko gopikavritah
    || || gopimanoharapango venuvadanatatparah | vinyastavadanambhojashcarushabdakritananah || || bimbadhararpitodaravenurvishvavimohanah
    | vrajasamvarnitashravyavenunadah shrutipriyah || || gogopagopijanmepsurbrahmendradyabhivanditah |
    gitasnutisaritpuro nadanartitabarhinah || || ragapallavitasthanurgitanamitapadapah | vismaritatrinagrasamrigo
    mrigavilobhitah || || vyaghradihimsrasahajavairaharta sugayanah | gadhodiritagobrindapremotkarnitatarnakah
    || || nishpandayanabrahmadivikshito vishvavanditah | shakhotkarnashakuntaughashchatrayitabalahakah
    || || prasannah paramanandashcitrayitacaracarah | gopikamadano gopikucakunkumamudritah || || gopikanyajalakridahrishto
    gopyamshukapahrit | skandharopitagopastrivasah kundanibhasmitah || || gopinetrotpalashashi gopikayacitamshukah
    | gopinamaskriyadeshta gopyekakaravanditah || || gopyanjalivishesharthi gopakridavilobhitah | shantavasasphuradgopikritanjaliraghapahah
    || || gopikelivilasarthi gopisampurnakamadah | gopastrivastrado gopicittacorah kutuhali || || brindavanapriyo
    gopabandhuryajvannayacita | yajnesho yajnabhavajno yajnapatnyabhivanchitah || || munipatnivitirnannatripto
    munivadhupriyah | dvijapatnyabhibhavajno dvijapatnivarapradah || || pratiruddhasatimokshaprado dvijavimohita
    | munijnanaprado yajvastuto vasavayagavit || || pitriproktakriyarupashakrayaganivaranah | shakra'marshakarashshakravrishtiprashamanonmukhah
    || || govardhanadharo gopagobrindatranatatparah | govardhanagiricchatracandadandabhujargalah || ||
    saptahavidhritadrindro meghavahanagarvaha | bhujagroparivinyastakshmadharakshmabhridacyutah || ||
    svasthanasthapitagirirgopidadhyakshatarcitah | sumanassumanovrishtihrishto vasavavanditah || || kamadhenupayahpurabhishiktassurabhistutah
    | dharanghriroshadhiroma dharmagopta manomayah || || jnanayajnapriyashshastranetrassarvarthasarathih
    | airavatakaranitaviyadgangapluto vibhuh || || brahmabhishikto gogopta sarvalokashubhankarah | sarvavedamayo
    magnanandanveshipitripriyah || || varunodiritatmekshakautuko varunarcitah | varunanitajanako gopajnatatmavaibhavah
    || || svarlokalokasamhrishtagopavargatrivargadah | brahmahridgopito gopadrashta brahmapadapradah ||
    || sharaccandraviharotkah shripatirvashako kshamah | bhayapaho bhartriruddhagopikadhyanagocarah ||
    || gopikanayanasvadyo gopinarmoktinirvritah | gopikamanaharano gopikashatayuthapah || || vaijayantisragakalpo
    gopikamanavardhanah | gopakantasunirdeshta kanto manmathamanmathah || || svatmasyadattatambulah phalitotkrishtayauvanah
    | vallavistanasaktaksho vallavipremacalitah || || gopicelancalasino gopinetrabjashatpadah | rasakridasamasakto
    gopimandalamandanah || || gopihemamanishrenimadhyendramanirujjvalah | vidyadharendushapaghnashshankhacudashiroharah
    || || shankhacudashiroratnasamprinitabalo'naghah | arishtarishtakriddushtakeshidaityanishudanah ||
    || sarasassasmitamukhassusthiro virahakulah | sankarshanarpitapritirakruradhyanagocarah || || akrurasamstuto
    gudho gunavrityupalakshitah | pramanagamyastanmatra'vayavi buddhitatparah || || sarvapramanapramadhissarvapratyayasadhakah
    | purushashca pradhanatma viparyasavilocanah || || madhurajanasamvikshyo rajakapratighatakah | vicitrambarasamvito
    malakaravarapradah || || kubjavakratvanirmokta kubjayauvanadayakah | kubjangaragasurabhih kamsakodandakhandanah
    || || dhirah kuvalayapidamardanah kamsabhitikrit | dantidantayudho rangatrasako mallayuddhavit ||
    || canurahanta kamsarirdevakiharshadayakah | vasudevapadanamrah pitribandhavimocanah || || urvibhayapaho
    bhupa ugrasenadhipatyadah | ajnasthitashacinathassudharmanayanakshamah || || adyo dvijatisatkarta
    shishtacarapradarshakah | sandipanikritabhyastavidyabhyasaikadhissudhih || || gurvabhishtakriyadakshah
    pashcimodadhipujitah | hatapancajanapraptapancajanyo yamarcitah || || dharmarajajayanitaguruputra
    urukramah | guruputrapradashshasta madhurajasabhasadah || || jamadagnyasamabhyarcyo gomantagirisancarah
    | gomantadavashamano garudanitabhushanah || || cakradyayudhasamshobhi jarasandhamadapahah | srigalavanipalaghnassrigalatmajarajyadah
    || || vidhvastakalayavano mucukundavarapradah | ajnapitamahambhodhirdvarakapurakalpanah || || dvarakanilayo
    rukmimanahanta yadudvahah | ruciro rukminijanih pradyumnajanakah prabhuh || || apakritatrilokartiraniruddhapitamahah
    | aniruddhapadanveshi cakri garudavahanah || || banasurapuriroddha rakshajvalanayantrajit | dhutapramathasamrambho
    jitamaheshvarajvarah || || shatcakrashaktinirjeta bhutavetalamohakrit | shambhutrishulajicchambhujrimbhanashshambhusamstutah
    || || indriyatmenduhridayassarvayogeshvareshvarah | hiranyagarbhahridayo mohavartanivartanah || ||
    atmajnananidhirmedha koshastanmatrarupavan | indro'gnivadanah kalanabhassarvagamadhvagah || || turiyasarvadhisakshi
    dvandvaramatmaduragah | ajnataparo vashyashriravyakritaviharavan || || atmapradipo vijnanamatratma
    shriniketanah | banabahuvanacchetta mahendrapritivardhanah || || aniruddhanirodhajno jaleshahritagokulah
    | jaleshavijayi virassatrajidratnayacakah || || prasenanveshanodyukto jambavaddhritaratnadah | jitarksharajatanayaharta
    jambavatipriyah || || satyabhamapriyah kamashshatadhanvashiroharah | kalindipatirakrurabandhurakruraratnadah
    || || kaikeyiramano bhadrabharta nagnajitidhavah | madrimanoharashshaibyapranabandhururukramah ||
    || sushiladayito mitravindanetramahotsavah | lakshmanavallabho ruddhapragjyotishamahapurah || || surapashavriticchedi
    murarih krurayuddhavit | hayagrivashiroharta sarvatma sarvadarshanah || || narakasuravicchetta narakatmajarajyadah|
    prithvistutah prakashatma hridyo yajnaphalapradah || || gunagrahi gunadrashta gudhasvatma vibhutiman
    | kavirjagadupadrashta paramaksharavigrahah || || prapannapalano mali mahadbrahmavivardhanah | vacyavacakashaktyarthassarvavyakritasiddhidah
    || || svayamprabhuranirvedyassvaprakashashcirantanah | nadatma mantrakotisho nanavadanirodhakah ||
    || kandarpakotilavanyah pararthaikaprayojakah | amarikritadevaughah kanyakabandhamocanah || || shodashastrisahasreshah
    kantah kantamanobhavah | kridaratnacalaharta varunacchatrashobhitah || || shakrabhivanditashshakrajananikundalapradah
    | aditiprastutastotro brahmanodghushtaceshtanah || || puranassamyami janmaliptah shadvimshako'rthadah
    | yashasyanitiradyantarahitassatkathapriyah || || brahmabodhah paranandah parijatapaharakah | paundrakapranaharanah
    kashirajanishudanah || || krityagarvaprashamano vicakravadhadikshitah | kamsavidhvamsanassambajanako
    dimbhakardanah || || munirgopta pitrivarapradassavanadikshitah | rathi sarathyanirdeshta phalgunah
    phalgunipriyah || || saptabdhistambhanodbhato harissaptabdhibhedanah | atmaprakashah purnashriradinarayanekshitah
    || || vipraputrapradashcaiva sarvamatrisutapradah | parthavismayakritparthapranavarthaprabodhanah
    || || kailasayatrasumukho badaryashramabhushanah | ghantakarnakriyamaudhyattoshito bhaktavatsalah
    || || munibrindadibhirdhyeyo ghantakarnavarapradah | tapashcaryaparashciravasah pingajatadharah ||
    || pratyakshikritabhuteshashshivastota shivastutah | krishnasvayamvaralokakautuki sarvasammatah ||
    || balasamrambhashamano baladarshitapandavah | yativesharjunabhishtadayi sarvatmagocarah || || subhadraphalgunodvahakarta
    prinitaphalgunah | khandavaprinitarcishmanmayadanavamocanah || || sulabho rajasuyarhayudhishthiraniyojakah
    | bhimarditajarasandho magadhatmajarajyadah || || rajabandhananirmokta rajasuyagrapujanah | caidyadyasahano
    bhishmastutassatvatapurvajah || || sarvatmarthasamaharta mandaracaladharakah | yajnavatarah prahladapratijnapratipalakah
    || || baliyajnasabhadhvamsi driptakshatrakulantakah | dashagrivantako jeta revatipremavallabhah ||
    || sarvavataradhishthata vedabahyavimohanah | kalidoshanirakarta dashanama dridhavratah || || ameyatma
    jagatsvami vagmi caidyashiroharah | draupadiracitastotrah keshavah purushottamah || || narayano madhupatirmadhavo
    doshavarjitah | govindah pundarikaksho vishnushca madhusudanah || || trivikramastrilokesho vamanah
    shridharah puman | hrishikesho vasudevah padmanabho mahahradah || || damodarashcaturvyuhah pancalimanarakshanah
    | salvaghnassamarashlaghi dantavaktranibarhanah || || damodarapriyasakha prithukasvadanapriyah ||
    ghrini damodarah shrido gopipunaravekshakah || || gopikamuktido yogi durvasastriptikarakah | avijnatavrajakirnapandavalokano
    jayi || || parthasarathyaniratah prajnah pandavadutyakrit | viduratithyasantushtah kuntisantoshadayakah
    || || suyodhanatiraskarta duryodhanavikaravit | vidurabhishthuto nityo varshneyo mangalatmakah ||
    || pancavimshatitattveshashcaturvimshatidehabhak | sarvanugrahakassarvadasharhasatatarcitah || ||
    acintyo madhuralapassadhudarshi durasadah | manushyadharmanugatah kauravendrakshayekshita || || upendro
    danavaratirurugito mahadyutih | brahmanyadevah shrutiman gobrahmanahitashayah || || varashilashshivarambhassuvijnanavimurtiman
    | svabhavashuddhassanmitrassusharanyassulakshanah || || dhritarashtragataudrishtipradah karnavibhedanah
    | pratodadhrigvishvarupavismaritadhananjayah || || samaganapriyo dharmadhenurvarnottamo'vyayah | caturyugakriyakarta
    vishvarupapradarshakah || || brahmabodhaparitratapartho bhishmarthacakrabhrit | arjunayasavidhvamsi
    kaladamshtravibhushanah || || sujatanantamahima svapnavyaparitarjunah | akalasandhyaghatanashcakrantaritabhaskarah
    || || dushtapramathanah parthapratijnaparipalakah | sindhurajashirahpatasthanavakta vivekadrik ||
    || subhadrashokaharano dronotsekadivismitah | parthamanyunirakarta pandavotsavadayakah || || angushthakrantakaunteyarathashshakto'hishirshajit
    | kalakopaprashamano bhimasenajayapradah || || ashvatthamavadhayasatratapandusutah kriti | ishikastraprashamano
    draunirakshavicakshanah || || parthapaharitadraunicudamanirabhangurah | dhritarashtraparamrishtabhimapratikritismayah
    || || bhishmabuddhipradashshantashsharaccandranibhananah | gadagrajanma pancalipratijnaparipalakah
    || || gandharikopadrigguptadharmasunuranamayah | prapannartibhayacchetta bhishmashalyavyadhavahah
    || || shantashshantanavodirnasarvadharmasamahitah | smaritabrahmavidyarthapritapartho mahastravit
    || || prasadaparamodaro gangeyasugatipradah | vipakshapakshakshayakritparikshitpranarakshanah || ||
    jagadgururdharmasunorvajimedhapravartakah | vihitarthaptasatkaro masakatparivartadah || || uttankaharshadatmiyadivyarupapradarshakah
    | janakavagatasvoktabharatassarvabhavanah || || asodhayadavodreko vihitaptadipujanah || samudrasthapitashcaryamusalo
    vrishnivahakah || || munishapayudhah padmasanaditridasharthitah | vrishtipratyavaharotkassvadhamagamanotsukah
    || || prabhasalokanodyukto nanavidhanimittakrit | sarvayadavasamsevyassarvotkrishtaparicchadah ||
    || velakananasancari velanilahritashramah | kalatma yadavo'nantasstutisantushtamanasah || || dvijalokanasantushtah
