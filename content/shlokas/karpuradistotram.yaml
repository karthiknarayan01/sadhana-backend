id: karpuradistotram
category: stotram
name:
  english: karpuradistotram
  devanagari: कर्पूरादिस्तोत्रम्
content:
  english: shrikarpuradistotram karpuram madhamantyasvaraparirahitam senduvamakshiyuktam bijam te mataretattripuraharavadhu
    trihkritam ye japanti
  devanagari: श्रीकर्पूरादिस्तोत्रम् कर्पूरं मधमान्त्यस्वरपरिरहितं सेन्दुवामाक्षियुक्तं बीजं ते मातरेतत्त्रिपुरहरवधु
    त्रिःकृतं ये जपन्ति
meaning: {}
