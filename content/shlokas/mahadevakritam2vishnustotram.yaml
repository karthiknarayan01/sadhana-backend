id: mahadevakritam2vishnustotram
category: stotram
name:
  english: mahadevakritam2vishnustotram
  devanagari: महादेवकृतं२विष्णुस्तोत्रम्
content:
  english: martyadayah kimuta shashvadabhadravrittah || 10|| sa tvam samihitamadah sthitijanmanasham bhutehitam
    ca jagato bhavabandhamokshau | vayuryatha vishati kham ca caracarakhyam sarvam tadatmakatayavagamo'varuntse
    || 11|| avatara maya drishta ramamanasya te gunaih | so'ham taddrashtumicchami yatte yoshidvapurdhritam
    || 12|| yena sammohita daityah payitashcamritam surah | taddidrikshava ayatah param kautuhalam hi
    nah || 13|| iti shrimadbhagavatamahapurane ashtamaskandhe dvadashadhyayantargatam mahadevakritam vishnustotram
    samaptam | bhagavatapurana | adhyaya 8
  devanagari: मर्त्यादयः किमुत शश्वदभद्रवृत्ताः ॥ १०॥ स त्वं समीहितमदः स्थितिजन्मनाशं भूतेहितं च जगतो
    भवबन्धमोक्षौ । वायुर्यथा विशति खं च चराचराख्यं सर्वं तदात्मकतयावगमोऽवरुन्त्से ॥ ११॥ अवतारा मया दृष्टा
    रममाणस्य ते गुणैः । सोऽहं तद्द्रष्टुमिच्छामि यत्ते योषिद्वपुर्धृतम् ॥ १२॥ येन सम्मोहिता दैत्याः पायिताश्चामृतं
    सुराः । तद्दिदृक्षव आयाताः परं कौतूहलं हि नः ॥ १३॥ इति श्रीमद्भागवतमहापुराणे अष्टमस्कन्धे द्वादशाध्यायान्तर्गतं
    महादेवकृतं विष्णुस्तोत्रं समाप्तम् । भागवतपुराण । अध्याय ८
