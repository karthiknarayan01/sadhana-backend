id: bhajagovindam
category: stotram
name:
  english: bhajagovindam
  devanagari: भजगोविन्दम्
content:
  english: bhaja govindam bhaja govindam bhaja govindam govindam bhaja mudhamate | samprapte sannihite
    kale nahi nahi rakshati dukrinkarane || 1||
  devanagari: भज गोविन्दं भज गोविन्दं भज गोविन्दं गोविन्दं भज मूढमते । सम्प्राप्ते सन्निहिते काले नहि
    नहि रक्षति डुकृङ्करणे ॥ १॥
meaning: {}
