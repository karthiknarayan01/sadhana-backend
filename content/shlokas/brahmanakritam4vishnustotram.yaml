id: brahmanakritam4vishnustotram
category: stotram
name:
  english: brahmanakritam4vishnustotram
  devanagari: ब्रह्मणाकृतं४विष्णुस्तोत्रम्
content:
  english: brahmana kritam 4 vishnustotram brahmovaca | namami sarvam sarveshamanantamajamavyayam | lokadhamadharadharamaprakashamabhedinam
    || 40|| narayanamaniyamsamasheshanamaniyasam | samastanam garishtham ca bhuradinam gariyasam || 41||
    yatra sarvam yatah sarvamutpannam satpurahsaram | sarvabhutashca yo devah paranamapi yah parah ||
    42|| parah parasmatpurushatparamatmasvarupadhrik | yogibhishcintyate yo'sau muktihetormumukshubhih
    || 43|| sattvadayo na santishe yatra ca prakrita gunah | sa shuddhah sarvashuddhebhyah pumanadyah
    prasidatu || 44|| kalakashthamuhurttadikalasutrasya gocare | yasya shaktirna shuddhasya sa no vishnuh
    prasidatu || 45|| procyate paramesho hi yah shuddho'pyupacaratah | prasidatu sa no vishnuratma yah
    sarvadehinam || 46|| yah karanam ca karyam ca karanasyapi karanam | karyasyapi ca yah karyam prasidatu
    sa no harih || 47|| karyakaryasya yatkaryam tatkaryasyapi yah svayam | tatkaryakaryabhuto yastatashca
    pranatah sma tam || 48|| karanam karanasyapi tasya karanakaranam | tatkarananam hetum tam pranatah
    sma pareshvaram || 49|| bhoktaram bhogyabhutam ca srashtaram srijyameva ca | karyakartrisvarupam tam
    pranatah sma param padam || 50|| vishuddhabodhavannityamajamakshayamavyayam | avyaktamavikaram yattadvishnoh
    paramam padam || 51|| na sthulam na ca sukshmam yanna vishshanagocaram | tatpadam paramam vishnoh
    pranamamah sada'malam || 52|| yasyayutayutamshamsho
  devanagari: ब्रह्मणा कृतं ४ विष्णुस्तोत्रम् ब्रह्मोवाच । नमामि सर्वं सर्वेशमनन्तमजमव्ययम् । लोकधामधराधारमप्रकाशमभेदिनम्
    ॥ ४०॥ नारायणमणीयांसमशेषाणामणीयसाम् । समस्तानां गरिष्ठं च भूरादीनां गरीयसाम् ॥ ४१॥ यत्र सर्वं यतः सर्वमुत्पन्नं
    सत्पुरःसरम् । सर्वभूतश्च यो देवः पराणामपि यः परः ॥ ४२॥ परः परस्मात्पुरुषात्परमात्मस्वरूपधृक् । योगिभिश्चिन्त्यते
    योऽसौ मुक्तिहेतोर्मुमुक्षुभिः ॥ ४३॥ सत्त्वादयो न सन्तीशे यत्र च प्राकृता गुणाः । स शुद्धः सर्वशुद्धेभ्यः
    पुमानाद्यः प्रसीदतु ॥ ४४॥ कलाकाष्ठामुहूर्त्तादिकालासूत्रस्य गोचरे । यस्य शक्तिर्न शुद्धस्य स नो विष्णुः
    प्रसीदतु ॥ ४५॥ प्रोच्यते परमेशो हि यः शुद्धोऽप्युपचारतः । प्रसीदतु स नो विष्णुरात्मा यः सर्वदेहिनाम्
    ॥ ४६॥ यः कारणं च कार्यं च कारणस्यापि कारणम् । कार्यस्यापि च यः कार्यं प्रसीदतु स नो हरिः ॥ ४७॥ कार्यकार्यस्य
    यत्कार्यं तत्कार्यस्यापि यः स्वयम् । तत्कार्यकार्यभूतो यस्ततश्च प्रणताः स्म तम् ॥ ४८॥ कारणं कारणस्यापि
    तस्य कारणकारणम् । तत्कारणानां हेतुं तं प्रणताः स्म परेश्वरम् ॥ ४९॥ भोक्तारं भोग्यभूतं च स्रष्टारं
    सृज्यमेव च । कार्यकर्तृस्वरूपं तं प्रणताः स्म परं पदम् ॥ ५०॥ विशुद्धबोधवन्नित्यमजमक्षयमव्ययम् । अव्यक्तमविकारं
    यत्तद्विष्णोः परमं पदम् ॥ ५१॥ न स्थूलं न च सूक्ष्मं यन्न विश्षणगोचरम् । तत्पदं परमं विष्णोः प्रणमामः
    सदाऽमलम् ॥ ५२॥ यस्यायुतायुतांशांशो
