id: gita-9-22-ananyash-chintayanto
category: gita_shloka
name:
  english: Ananyash Chintayanto Mam
  devanagari: अनन्याश्चिन्तयन्तो माम्
content:
  english: >-
    ananyash chintayanto mam ye janah paryupasate, tesham
    nityabhiyuktanam yoga-kshemam vahamy aham
  devanagari: >-
    अनन्याश्चिन्तयन्तो मां ये जनाः पर्युपासते । तेषां नित्याभियुक्तानां
    योगक्षेमं वहाम्यहम् ॥
meaning:
  english: >-
    For those who worship Me with single-minded devotion, ever united in
    thought, I carry what they lack and preserve what they already have.
source_attribution:
  text_source: Bhagavad Gita, Chapter 9, Verse 22
  translation_source: Original paraphrase written for Sadhana
  license: original_translation
