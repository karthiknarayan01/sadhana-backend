id: bhuvaneshvaryashtottarashatanamastotram-3
category: stotram
name:
  english: bhuvaneshvaryashtottarashatanamastotram 3
  devanagari: भुवनेश्वर्यष्टोत्तरशतनामस्तोत्रम् ३
content:
  english: shridevyuvaca | devadeva mahadeva yogindra vrishabhadhvaja | asyah shribhuvaneshvaryah shatanama
    vada prabho || 1|| shriishana uvaca | sahasrena maheshani kalikale na siddhyati | shatanamnah param
    nama kalau nasti maheshvari || 2|| asya shribhuvaneshvari shatanamastotrasya shaktirrishi viratcchandah
    shribhuvaneshvari devata caturvargasiddhyarthe viniyogah || om adya shribhuvanabhavya bhavabandhavimohini
    | bhagarupa bhagavati bheranda bhagyashalini || 3|| ishvari ishvarananda vandaniya vilasini | uma
    uma ca
  devanagari: श्रीदेव्युवाच । देवदेव महादेव योगीन्द्र वृषभध्वज । अस्याः श्रीभुवनेश्वर्याः शतनाम वद प्रभो
    ॥ १॥ श्रीईशान उवाच । सहस्रेण महेशानि कलिकाले न सिद्ध्यति । शतनाम्नः परं नाम कलौ नास्ति महेश्वरि ॥
    २॥ अस्य श्रीभुवनेश्वरी शतनामस्तोत्रस्य शक्तिरृषि विराट्च्छन्दः श्रीभुवनेश्वरी देवता चतुर्वर्गसिद्ध्यर्थे
    विनियोगः ॥ ॐ आद्या श्रीभुवनाभव्या भवबन्धविमोहिनी । भगरूपा भगवती भेरण्डा भाग्यशालिनी ॥ ३॥ ईश्वरी ईश्वरानन्दा
    वन्दनीया विलासिनी । उमा ऊमा च
meaning: {}
