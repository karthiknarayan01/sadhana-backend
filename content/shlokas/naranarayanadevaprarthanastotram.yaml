id: naranarayanadevaprarthanastotram
category: stotram
name:
  english: naranarayanadevaprarthanastotram
  devanagari: नरनारायणदेवप्रार्थनास्तोत्रम्
content:
  english: shrinaranarayanadevaprarthanastotram avatirya nijaksharatparadiha murtyam badarivane sthitah
    | bhuvi bharatajivasharmane
  devanagari: श्रीनरनारायणदेवप्रार्थनास्तोत्रम् अवतीर्य निजाक्षरात्परादिह मूर्त्यां बदरीवने स्थितः । भुवि
    भारतजीवशर्मणे
meaning: {}
