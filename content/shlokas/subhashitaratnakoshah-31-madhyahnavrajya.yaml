id: subhashitaratnakoshah-31-madhyahnavrajya
category: subhashita
name:
  english: subhashitaratnakoshah/31 madhyahnavrajya
  devanagari: सुभाषितरत्नकोशः/३१ मध्याह्नव्रज्या
content:
  english: tato madhyahnavrajya madhyahne paripunjitais tarutalacchaya mrigaih sevyate kasare sphutitodare
    sunibhritam kitair ahar niyate
  devanagari: ततो मध्याह्नव्रज्या मध्याह्ने परिपुञ्जितैस् तरुतलच्छाया मृगैः सेव्यते कासारे स्फुटितोदरे
    सुनिभृतं कीटैर् अहर् नीयते
meaning: {}
source_attribution:
