id: ganesha-shodasha-namavali-shodashanama-stotram
category: stotram
name:
  english: Ganesha Shodasha Namavali, Shodashanama Stotram
content:
  english: shri vighneshvara shodasha namavalih om sumukhaya namah om ekadantaya namah om kapilaya namah
    om gajakarnakaya namah om lambodaraya namah om vikataya namah om vighnarajaya namah om ganadhipaya
    namah om dhumraketave namah om ganadhyakshaya namah om phalacandraya namah om gajananaya namah om
    vakratundaya namah om shurpakarnaya namah om herambaya namah om skandapurvajaya namah shri vighneshvara
    shodashanama stotram sumukhashcaikadantashca kapilo gajakarnakah | lambodarashca vikato vighnarajo
    ganadhipah || rganadhyaksho phalacandro gajananah | vakratunda || shodashaitani namani yah pathe yadapi
    | vidyarambhe vivahe ca praveshe nirgame tatha | sangrame sarva karyeshu vighnastasya na jayate ||
  devanagari: श्री विघ्नेश्वर षोडश नामावलिः ॐ सुमुखाय नमः ॐ एकदन्ताय नमः ॐ कपिलाय नमः ॐ गजकर्णकाय नमः
    ॐ लम्बोदराय नमः ॐ विकटाय नमः ॐ विघ्नराजाय नमः ॐ गणाधिपाय नमः ॐ धूम्रकेतवे नमः ॐ गणाध्यक्षाय नमः ॐ
    फालचन्द्राय नमः ॐ गजाननाय नमः ॐ वक्रतुण्डाय नमः ॐ शूर्पकर्णाय नमः ॐ हेरम्बाय नमः ॐ स्कन्दपूर्वजाय
    नमः श्री विघ्नेश्वर षोडशनाम स्तोत्रम् सुमुखश्चैकदन्तश्च कपिलो गजकर्णकः । लम्बोदरश्च विकटो विघ्नराजो
    गणाधिपः ॥ र्गणाध्यक्षो फालचन्द्रो गजाननः । वक्रतुण्ड ॥ षोडशैतानि नामानि यः पठे यादपि । विद्यारम्भे
    विवाहे च प्रवेशे निर्गमे तथा । सङ्ग्रामे सर्व कार्येषु विघ्नस्तस्य न जायते ॥
