id: kytb-2-3-hotru-brahmana-sheshah-krishna-yajurveda-taittiriya-brahmana-patha-brahmavadino-vadanti
category: stotram
name:
  english: KYTB 2.3 Hotru Brahmana Sheshah - Krishna Yajurveda Taittiriya Brahmana Patha - Brahmavadino
    Vadanti
content:
  english: krishna yajurvediya taittiriya brahmane dvitiyashtake tritiyah prapathakah shri gurubhyo namah
    | harih om || anuvakam sarvesham hotrimantrana hotrishabdena vyavahara brahmavadino vadanti | ki hotritvamiti
    | yadevaishu caturdha hotarah | tena catur hotarah | tasmaccatur hotara ucyante | taccatur hotritvam
    || somo vai catur hota | agnih pancahota | dhata shaddhota | indrah saptahota || ve~da | ridhnotyeva
    || ya eshameva ve~da | bandhumanbhavati | ya eshameva || pratyeva tishthati || brahmavadino vadanti
    | dashahota catur hota | pancahota shaddhota saptahota | atha kasmaccatur hotara ucyanta iti | indro
    vai catur hota | indrah khalu vai shreshtho devatana mupadeshanat | ya evamindragg shreshtha mbhavati
    | tasmacchreshthamayanta mprathamenaivanubuddhyante | ayamagann | ayamavasaditi | kirtirasya purva
    ''gacchati janatamayatah | atho ena mprathamenaivanu buddhyante | ayamagann | ayamavasaditi || naimittiko
    hotrimantrahomah dakshina nyat | atmanameva samindhe | tejase viryaya | atho mbhutva prati grihnati
    | atmano 'na rtyai || yadyenamart nniraharerann | agni ddashahotaram | caturgrihitenajyena | purasta
    pratyantishthann | pratilomam || prananevasyopadasayati || yadyena mpunarupa shiksheyuh | agni ddashahotaram
    | caturgrihitenajyena | pashca tpramasinah | anuloma mavigraham | prananevasmai kalpayati || prayashcitti
    tyritumukha ritumukhe juhoti | ritunevasmai kalpayati | kalpante || klripta asma ritava ayanti ||
    shaddhota vai bhutva prajapatiridagm sarvamasrijata | sa mano 'dhi gayatrimasrijata | tadgayatrim
    ya~sha arcchat | tama 'labhata | gayatriya adhi chandagsya srijata | chandobhyo thsama yasha arcchat
    | tada 'dhi yajugshyasrijata | yajurbhyo 'labhata | vishnoraddhyoshadhirasrijata | oshadhibhyo 'labhata
    | somadadhi pashunasrijata | pashubhyo ya~sha arcchat | tadena nnati pracyavata | indra iva yashasvi
    bhavati | ya evam 'ti pracyavate || yadva ida thsarvamuttana evangirasah pratyagrihnat | tadena tkinca
    prati grihniyat | ta thsarvamuttanastva ngirasah pratigrihnatvityeva pratigrihniyat | iyam ngirasah
    | anayaivainat prati grihnati | nainagm hinasti || barahisha pratiyadgam va~ | etadvai pashuna ndhama
    | priyenaivaina ndhamna pratyeti || mpushtivedanam yo va avidva nnivartayate | vishir pma 'mushmil
    ~loke bhavati | atha yo vidva nnivartayate | sashir pma 'mushmil ~loke bhavati || devata vai sapta
    pushtikama nyavartayanta | agnishca prithivi ca | vayushcantariksha nca | adityashca dyaushca candramah
    | agnirnyavartayata | sa sahasra || prithivi nyavartayata | saushadhibhi rapushyat | vayurnyavartayata
    | sa maricibhi rapushyat | antariksha nnyavartayata | tadvayobhi rapushyat | adityo nyavartayata |
    sa rashmibhi rapushyat | dyaurnyavartayata | sa nakshatrai rapushyat | candrama nyavartayata | so
    rmasair ritubhih sam 'pushyann | ya evam vi~danni ca vartayate pari ca || pratigrahamantramahimajnanam
    tasya va agner mpratijagrahushah | ardhamindriyasya kramat | tadetenaiva pratyagrihnat | tena vai
    so nnupadhatta | ardhamindriyasyatma nnupadhatte | ya evam mprati grihnati | atha yo 'vidva nprati
    grihnati | ardhamasyendriyasyapa kramati || tasya vai somasya vasah pratijagrahushah | tritiyamindriyasya
    || tadetenaiva pratyagrihnat | tena vai sa tritiyamindriyasyatma nnupadhatta | tritiyamindriyasyatma
    nnupadhatte | ya evam vasah prati grihnati | atha yo nprati grihnati | tritiyamasyendriyasyapa kramati
    || tasya vai rudrasya ga mpratijagrahushah | caturthamindriyasya kramat | tametenaiva pratyagrihnat
    | tena vai sa caturthamindriyasyatma || caturthamindriyasyatma nnupadhatte | ya evam mprati grihnati
    | atha yo nprati grihnati | caturthamasyendriyasyapa kramati || tasya vai varunasyashva mpratijagrahushah
    | pancamamindriyasya kramat | tametenaiva pratyagrihnat | tena vai sa pancamamindriyasyatma nnupadhatta
    | pancamamindriyasyatma nnupadhatte | ya evam mprati grihnati || npratigrihnati | pancamamasyendriyasyapa
    kramati || tasya vai prajapateh purusha mpratijagrahushah | shashthamindriyasya kramat | tametenaiva
    pratyagrihnat | tena vai sa shashthamindriyasyatma nnupadhatta | shashthamindriyasyatma nnupadhatte
    | ya evam mprati grihnati | atha yo nprati grihnati | shashthamasyendriyasyapa || tasya vai manostalpa
    mpratijagrahushah | saptamamindriyasya kramat | tametenaiva pratyagrihnat | tena vai sa saptamamindriya
    nnupadhatta | saptamamindriyasyatma nnupadhatte | ya evam mpratigrihnati | atha yo nprati grihnati
    | saptamamasyendriyasyapa kramati || tasya va uttanasya tpratijagrahushah | ashtamamindriyasya ||
    tadetenaiva pratyagrihnat | tena vai so 'shtamamindriyasyatma nnupadhatte | ashtamamindriyasyatma
    nnupadhatte | ya evam tprati grihnati | atha yo npratigrihnati | ashtamamasyendriyasyapa kramati ||
    yadva ida muttana evangirasah pratya grihnat | tadena nca prati grihniyat | ta ngirasah pratigrihnatvityeva
    prati grihniyat | iyam ngirasah | anayaivainat pratigrihnati | nainagm hinasti || tritiyamindriyasyapa
    caturthamindriyasyatmannupadha shashthamasyendriyasyapakrama tyashtamamindriyasyapa prati grihniyac
    catvari ca hiranyagm somasya vasastadetena rudrasya ga ntametena varunasyashva mprajapateh purusha
    ttanasya tadetenapranadya mpancamagm shashthagm saptamantam | tadetena dve tametenaika ntametena trini
    tadetenaikam prashnottararupo brahmavishayassam va~dah brahmavadino vadanti || ya ssatramasata | kena
    te grihapatina ''rdhnuvann | kena praja asrijanteti | prajapatina vai te grihapatina ''rdhnuvann |
    tena praja asrijanta || yaccatur ssatramasata | kena te grihapatina ''rdhnuvann | kenaushadhi rasrijanteti
    | somena vai te grihapatina ''rdhnuvann || ssatramasata | kena te grihapatina ''rdhnuvann | kenaibhyo
    lokebhyo npranudanta | kenaisha mpashunavrinjateti | agnina vai te grihapatina ''rdhnuvann | tenaibhyo
    lokebhyo pranudanta | tenaisha ssatramasata | kena te grihapatina ''rdhnuvann || kalpayanteti | dhatra
    vai te grihapatina ''rdhnuvann | tenartunakalpayanta || ya ssatramasata | kena te grihapatina ''rdhnuvann
    | kena suvarayann | kenemal ~lokan thsamatanvanniti | aryamna vai te grihapatina ''rdhnuvann | tena
    suvarayann | tenemal ~lokan || ete vai deva grihapatayah | tan vi~dvan | apyanyasya gar hapate dikshate
    | avantarameva satrina mriddhnoti || yo va aryamanam ve~da | danakama asmai praja bhavanti | yajno
    va aryama | aryavasatiriti vai tamahurya mprashagmsanti || arya vasatirbhavati | ya evam 'dhi yajno
    nimirtah | sa ya evam vivadeta | ahameva bhuyo veda | yashcatur vedeti | sa hyeva bhuyo veda | yashcatur
    veda || yo vai catur hotrinagm hotrin veda | sarvasu prajasvannamatti || 'bhijayati | prajapatirvai
    dashahotrinagm hota | agnih pancahotrinagm hota | dhata shaddhotrinagm hota | aryama saptahotrinagm
    hota hotrinagm hotarah | tan ve~da | sarvasu prajasvannamatti | sarva disho sarva dishobhi jayati
    hotriprashamsaprasangena kratunamritvig visheshavyavasthapanam agnihotrasya prashastya nca prajapatih
    praja ssrishtva vyasragmsata | sa hridaya ityahvayat | apah pratyashrinvann | ta agnihotrenaiva yajnakratunopa
    paryavartanta | tah kusindhamupauhann | tasmadagnihotrasya yajnakratoh | eka ritvik || catushkritvo
    || te pratyashrinvann | te dar shapurnamasabhyameva yajnakratunopa paryavartanta | ta upauhagg shcatvaryangani
    | tasma ryajnakratoh | catvara ritvijah || panca kritvo 'hvayat | pashavah pratyashrinvann | te caturmasyaireva
    yajnakratunopa paryavartanta | ta upauhal ~loma chavi mmagmsamasthi majjana || pancartvijah || shatkritvo
    'hvayat | ritavah pratyashrinvann | te pashubandhenaiva yajnakratunopa paryavartanta | ta upauhan
    thstanavandau shishnamava pashubandhasya yajnakratoh | shadritvijah || saptakritvo 'hvayat | hotrah
    pratyashrinvann | ta ssaumyenaivaddhvarena yajnakratunopa paryavartanta || ddhvarasya yajnakratoh
    | sapta hotrah pracirvashatkurvanti || dashakritvo 'hvayat | tapah pratyashrinot | tat ryajnakratubhirupa
    paryavartata | ta va~thsare sarve yajnakratavo 'varuddhyante || tasma hota | pancahota shaddhota saptahota
    | ekahotre baligm haranti | harantyasmai praja balim | ainamapratikhyata raddhvarena yajnakratunopa
    paryavartanta saptahota catvari ca agnihotrasya sarvakraturudbhavasadhanena prashamsa prajapatih purusha
    'gnirabravit | mamaya mannamastviti | so mpradhakshyatiti | sa etag sparananapashyat | tanajuhot |
    tairvai sa atmana masprinot || yadagnihotra njuhoti | ekahotarameva ta pnotyagnihotram || ncatmanah
    sprinoti | adityasya ca sayujya ngacchati || caturunnayati | catur shapurnamasau | catvari catmano
    'ngani sprinoti | adityasya ca sayujya ngacchati || caturunnayati | samitpancami | pancahotarameva
    ta pnoti caturmasyani | loma chavi mmagmsamasthi majjana || tani catmanah sprinoti | adityasya ca
    sayujya ngacchati || caturunnayati | dvirjuhoti | shaddhotarameva ta pnoti pashubandham | stanavandau
    shishnamava mpranam | tani catmanah sprinoti | adityasya ca sayujya ngacchati | caturunnayati | dvirjuhoti
    || thsaptami | saptahotarameva ta maddhvaram | sapta catmanah shir thsprinoti | adityasya ca sayujya
    ngacchati || caturunnayati | dvirjuhoti | dvirnima shti | dvih prashnati | dashahotarameva ta sprinoti
    | adityasya ca sayujya srishtisadhanatvena hotrimantrasamarthya prashamsa apakramata garbhinyah is
    only instruction rakamayata prajayeyeti | sa tapo 'ntarvanabhavat | sa harita thstryantarvatni | harini
    sati shyava bhavati | sa vijayamano garbhenatamyat | sa tantah krishna shshyavo bhavati | tasyasurevajivat
    || 'suranasrijata | tadasurana masuratvam | ya evamasurana ve~da | asumaneva bhavati | nainamasurjahati
    || so thsrishtva pitevamanyata | tadanu pitrinasrijata | tat mpitritvam | ya eva ve~da | pitevaiva
    svana || yantyasya pitaro hava thsrishtva 'manasyat | tadanu manushya nasrijata | tanmanushyana mmanushyatvam
    | ya eva ve~da | manasvyeva bhavati | naina mmanurjahati || tasmai manushya thsasrijanaya | diva devatra
    'bhavat | tadanu devanasrijata | ta ve~da | diva haivasya devatra bhavati || tani va etani catvaryambhagmsi
    | deva manushyah 'surah || teshu sarveshvambho nabha iva bhavati | ya evam devanasrijata sapta ca
    vayurupatvajnanena hotrimantrana is ònly instructiòn brahmavadino vadanti | yo va imam mpavate | yadabhi
    pavate | yadabhi sapam va~te | sarvamayuriyat | na pura ''yushah pramiyeta | pashuman t | vindeta
    prajam || yo va imam mpavate | yadabhi pavate | yadabhi sapam va~te | sarvamayureti | na pura ''yushah
    pramiyate | pashuma prajam || adbhyah pavate | apo || asyah pavate | imamabhi pavate | imamabhi sampavate
    | agneh pavate | agnimabhi pavate | agnimabhi sa mpavate | antariksha tpavate | antarikshamabhi pavate
    | antarikshamabhi sa || adityamabhi pavate | adityamabhi sa mpavate | dyoh pavate | divamabhi pavate
    || divamabhi sa mpavate | digbhyah pavate | disho purastadvati | prana eva bhutva purasta prajah prati
    nandanti | prano hi priyah prajana m | prana iva priyah prajana ve~da | sa va esha prana eva || atha
    ya ddakshinato vati | matarishvaiva bhutva dakshinato vati | tasma vi~dyat | sarva disha avati ||
    'nu vivati | sarva disho va~titi | sa va esha matarishvaiva || atha yat pashcadvati | pavamana eva
    bhutva pashcadvati | putamasma aharanti | putamupaharanti | putamashnati | ya evam ve~da | sa va esha
    pavamana eva || || atha yaduttarato vati | savitaiva bhutvottarato vati | saviteva svana ve~da | sa
    va esha savitaiva || te ya ena mupavadanti | ya evasya purasta ste 'paghnanti | purastaditaran papmanah
    sacante || atha ya ena || ya evasya dakshinatah papmanah | tag ste 'paghnanti | dakshinata itara npapmanah
    sacante || atha ya ena mupavadanti | ya evasya pashcat ste 'paghnanti | pashcaditaran papmanah sacante
    || atha ya enamuttarata ayantamupa vadanti | ya evasyo ttaratah papmanah | tag npapmanah sacante ||
    tasma devam vi~dvan | viva nrityet | preva calet | vyasyevakshyau bhasheta | mantayediva | krathayediva
    | shringayeteva || uta mopavadeyuh | uta me papmana mapahanyuriti || sa ya ndishagm sanimeshyan va~to
    vayat | atha praveyat | pra va dhapayet ngandhamabhi pracyavate | a mpurva kirtirgacchati || danakama
    asmai praja bhavanti | ya evam dakshinata ayantamupa vadan tyuttaratah papmanastag nkamyaprayogah
    prajapati ssomagm rajanamasrijata | ta ntrayo veda anvasrijyanta | tan 'kuruta | atha ha sita savitri
    | somagm rajana ncakame | shraddhamu sa cakame | sa ha pitara mupasasara | tagm hovaca | namaste astu
    bhagavah | upa tva || pra tva padye || somam nkamaye | shraddhamu sa kamayata iti | tasya u ha sthagaramalankara
    nkalpayitva | dashahotara dvyakhyaya | catur ndakshinatah | panca hotara mpashcat | shaddhotara muttaratah
    | saptahotara muparishtat | sambharaishca patnibhishca mukhe va~vraja | tagm hodikshyovaca | upa ma
    ''vartasveti | tagm hovaca | bhoga ntu ma acakshva | eta nma acakshva | yatte panaviti | tasya u ha
    trin npradadau | tasmadu ha striyo bhogamaiva harayante || sa yah kamayeta priya va~ kamayeta priya
    ssyaditi | tasma etagg nkalpayitva | dashahotara dvyakhyaya | catur ndakshinatah | pancahotara mpashcat
    | shaddhotara muttaratah | saptahota ramuparishtat | sambharaishca patnibhishca mukhe vra~jet | priyo
    haiva bhavati || dashahotradimantranamna mpravrittinimittam brahma vadasrijata | tadakamayata | samatmana
    padyeyeti | atma nnityamantrayata | tasmai dashamagm hutah pratyashrinot | sa dashahuto 'bhavat |
    dashahuto ha vai namaishah | tam m | dashahotetyacakshate parokshena | parokshapriya iva hi devah
    || nnityamantrayata | tasmai saptamagm hutah pratyashrinot | sa saptahuto 'bhavat | saptahuto ha vai
    namaishah | tam va~ etagm saptahutagm santa m | saptahotetyacakshate parokshena | parokshapriya iva
    hi devah || atma nnityamantrayata | tasmai shashthagm hutah pratyashrinot | sa shaddhuto || shaddhuto
    ha vai namaishah | tam va~ etagm shaddhutagm santa m | shaddhotetyacakshate parokshena | parokshapriya
    iva hi devah || atma nnityamantrayata | tasmai pancamagm hutah pratya shrinot | sa panca huto 'bhavat
    | pancahuto ha vai namaishah | tam mpancahutagm santa m | pancahotetyacakshate parokshena || || parokshapriya
    iva hi devah || atma nnityamantrayata | tasmai caturthagm hutah pratyashrinot | sa catur huto ha vai
    namaishah | tam hotetyacakshate parokshena | parokshapriya iva hi devah || tamabravit | tvam vai~
    me nedishthagm hutah pratyashraushih | tvayai nanakhyatara iti | tasmannu hainag hotara ityacakshate
    | tasma cchushrushuh putranagm hridyatamah | nedishtho hridyatamah | nedishtho brahmano bhavati |
    ya evam pancahotetyacakshate parokshena brahmavadinah kim prajapatih purusham prajapatirakamayata
    sa tapa brahmavadino yo va imam ya evasya dakshinatah pancashat || harih om || || krishna yajurvediya
    taittiriya brahmane dvitiyashtake tritiyah prapathaka
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय ब्राह्मणे द्वितीयाष्टके तृतीयः प्रपाठकः श्री गुरुभ्यो नमः । ह॒रिः॒
    ओम् ॥ अनुवाकं सर्वेषां होतृमन्त्राणा होतृशब्देन व्यवहार ब्र॒ह्म॒वा॒दिनो॑ वदन्ति । कि होतृ॒त्वमिति॑
    । यदे॒वैषु च॑तु॒र्धा होता॑रः । तेन॒ चतु॑र् होतारः । तस्मा॒च्चतु॑र् होतार उच्यन्ते । तच्चतु॑र् होतृ॒त्वम्
    ॥ सोमो॒ वै चतु॑र् होता । अ॒ग्निः पञ्च॑होता । धा॒ता षड्ढो॑ता । इन्द्रः॑ स॒प्तहो॑ता ॥ वेँद॑ । ऋ॒ध्नोत्ये॒व
    ॥ य ए॑षामे॒व वेँद॑ । बन्धु॑मान्भवति । य ए॑षामे॒व ॥ प्रत्ये॒व ति॑ष्ठति ॥ ब्र॒ह्म॒वा॒दिनो॑ वदन्ति ।
    दश॑होता॒ चतु॑र् होता । पञ्च॑होता॒ षड्ढो॑ता स॒प्तहो॑ता । अथ॒ कस्मा॒च्चतु॑र् होतार उच्यन्त॒ इति॑ । इन्द्रो॒
    वै चतु॑र् होता । इन्द्रः॒ खलु॒ वै श्रेष्ठो॑ दे॒वता॑ना मुप॒देश॑नात् । य ए॒वमिन्द्र॒ग्ग्॒ श्रेष्ठ॑ म्भवति
    । तस्मा॒च्छ्रेष्ठ॑मा॒यन्त॑ म्प्रथ॒मेनै॒वानु॑बुद्ध्यन्ते । अ॒यमागन्न्॑ । अ॒यमवा॑सा॒दिति॑ । की॒र्तिर॑स्य॒
    पूर्वा ऽऽग॑च्छति ज॒नता॑माय॒तः । अथो॑ एन म्प्रथ॒मेनै॒वानु॑ बुद्ध्यन्ते । अ॒यमागन्न्॑ । अ॒यमवा॑सा॒दिति॑
    ॥ नैमित्तिको होतृमन्त्रहोमः दक्षि॑णा न्यात् । आ॒त्मान॑मे॒व समि॑न्धे । तेज॑से वी॒र्या॑य । अथो म्भू॒त्वा
    प्रति॑ गृह्णाति । आ॒त्मनो ऽना र्त्यै ॥ यद्ये॑न॒मार्त् न्नि॒रःअरे॑रन्न् । आग्नी द्दश॑होतारम् । च॒तु॒र्गृ॒ही॒तेनाज्ये॑न
    । पु॒रस्ता प्र॒त्यन्तिष्ठन्न्॑ । प्र॒ति॒लो॒मं ॥ प्रा॒णाने॒वास्योप॑दासयति ॥ यद्ये॑न॒ म्पुन॑रुप॒ शिक्षे॑युः
    । आग्नी द्दश॑होतारम् । च॒तु॒र्गृ॒ही॒तेनाज्ये॑न । प॒श्चा त्प्रांआसी॑नः । अ॒नु॒लो॒म मवि॑ग्राहम् । प्रा॒णाने॒वास्मै॑
