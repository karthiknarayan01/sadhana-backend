id: suryadivyakavacastotram-5
category: kavacha
name:
  english: suryadivyakavacastotram 5
  devanagari: सूर्यदिव्यकवचस्तोत्रम् ५
content:
  english: yam kilakam | shrisuryanarayanaprasadasiddhyarthe jape viniyogah | karanyasah | om shrisuryanarayanaya
    angushthabhyam namah padminivallabhaya tarjanibhyam namah divakaraya madhyamabhyam namah || bhaskaraya
    anamikabhyam namah || martandaya kanishthikabhyam namah || adityaya karatalakaraprishthabhyam namah
    || evam hridanyasah lokatrayeti digbandhah | dhyanam trimurtirupam vishvesham shulamudgaradharinam
    | hiranyavarnam sumukham chayayuktam ravim bhaje || atha stotram | bhaskaro me shirah patu lalatam
    lokabandhavah | kapolau trayimayah patu nasikam vishvarupabhrit || 1|| netre cadhokshajah patu kantham
    saptashvavahanah | martando me bhujau patu kakshau patu divakarah || 2|| patu me hridayam pusha vakshah
    patu tamoharah | kukshim me patu mihiro nabhim vedantagocarah || 3|| dyumanirme katim patu guhyam
    me abjabandhavah | patu me januni suryo uru patvuruvikramah || 4|| citrabhanussada patu januni padminipriyah
    | janghe patu sahasramshuh padau sarvasurarcitah || 5|| sarvangam patu lokesho buddhisiddhigunapradah
    | sahasrabhanurme vidyam patu tejah prabhakarah || 6|| ahoratrau sada patu karmasakshi parantapah
    | adityakavacam punyam yah pathetsatatam shucih || 7|| sarvarogavinirmukto sarvopadravavarjitah |
    tapatrayavihinassan sarvasiddhimavapnuyat || 8|| samvatsarena kalena suvarnatanutam vrajet | kshayapasmarakushthadi
    gulmavyadhivivarjitah || 9|| suryaprasadasiddhatma sarvabhishtaphalam labhet | adityavasare snatva
    kritva payasamuttamam || 10|| arkapatre tu nikshipya danam kuryadvicakshanah | ekabhuktam vratam samyaksamvatsaramathacaret
    | putrapautran labhelloke ciranjivi bhavishyati || 11|| svarbhuvarbhuromiti digvimokah | iti shrihiranyagarbhasamhitayam
    shrisuryanarayanadivyakavacastotram sampurnam |
  devanagari: यां कीलकम् । श्रीसूर्यनारायणप्रसादसिद्ध्यर्थे जपे विनियोगः । करन्यासः । ॐ श्रीसूर्यनारायणाय
    अङ्गुष्ठाभ्यां नमः पद्मिनीवल्लभाय तर्जनीभ्यां नमः दिवाकराय मध्यमाभ्यां नमः ॥ भास्कराय अनामिकाभ्यां
    नमः ॥ मार्ताण्डाय कनिष्ठिकाभ्यां नमः ॥ आदित्याय करतलकरपृष्ठाभ्यां नमः ॥ एवं हृदन्यासः लोकत्रयेति दिग्बन्धः
    । ध्यानं त्रिमूर्तिरूपं विश्वेशं शूलमुद्गरधारिणम् । हिरण्यवर्णं सुमुखं छायायुक्तं रविं भजे ॥ अथ स्तोत्रम्
    । भास्करो मे शिरः पातु ललाटं लोकबान्धवः । कपोलौ त्रयीमयः पातु नासिकां विश्वरूपभृत् ॥ १॥ नेत्रे चाधोक्षजः
    पातु कण्ठं सप्ताश्ववाहनः । मार्ताण्डो मे भुजौ पातु कक्षौ पातु दिवाकरः ॥ २॥ पातु मे हृदयं पूषा वक्षः
    पातु तमोहरः । कुक्षिं मे पातु मिहिरो नाभिं वेदान्तगोचरः ॥ ३॥ द्युमणिर्मे कटिं पातु गुह्यं मे अब्जबान्धवः
    । पातु मे जानुनी सूर्यो ऊरू पात्वुरुविक्रमः ॥ ४॥ चित्रभानुस्सदा पातु जानुनी पद्मिनीप्रियः । जङ्घे
    पातु सहस्रांशुः पादौ सर्वसुरार्चितः ॥ ५॥ सर्वाङ्गं पातु लोकेशो बुद्धिसिद्धिगुणप्रदः । सहस्रभानुर्मे
    विद्यां पातु तेजः प्रभाकरः ॥ ६॥ अहोरात्रौ सदा पातु कर्मसाक्षी परन्तपः । आदित्यकवचं पुण्यं यः पठेत्सततं
    शुचिः ॥ ७॥ सर्वरोगविनिर्मुक्तो सर्वोपद्रववर्जितः । तापत्रयविहीनस्सन् सर्वसिद्धिमवाप्नुयात् ॥ ८॥ संवत्सरेण
    कालेन सुवर्णतनुतां व्रजेत् । क्षयापस्मारकुष्ठादि गुल्मव्याधिविवर्जितः ॥ ९॥ सूर्यप्रसादसिद्धात्मा सर्वाभीष्टफलं
    लभेत् । आदित्यवासरे स्नात्वा कृत्वा पायसमुत्तमम् ॥ १०॥ अर्कपत्रे तु निक्षिप्य दानं कुर्याद्विचक्षणः
    । एकभुक्तं व्रतं सम्यक्संवत्सरमथाचरेत् । पुत्रपौत्रान् लभेल्लोके चिरञ्जीवी भविष्यति ॥ ११॥ स्वर्भुवर्भूरोमिति
    दिग्विमोकः । इति श्रीहिरण्यगर्भसंहितायां श्रीसूर्यनारायणदिव्यकवचस्तोत्रं सम्पूर्णम् ।
