id: vyasaproktamshivastotram
category: stotram
name:
  english: vyasaproktamshivastotram
  devanagari: व्यासप्रोक्तंशिवस्तोत्रम्
content:
  english: shikhinam ciravasasam || 2|| mahadevam haram sthanum varadam bhuvaneshvaram | jagatpradhanamadhikam
    jagatpritamadhishvaram || 3|| jagadyonim jagadbijam jayinam jagato gatim | vishvatmanam vishvasrijam
    vishvamurtim yashasvinam || 4|| vishveshvaram vishvanaram karmanamishvaram prabhum | shambhum svayambhum
    bhutesham bhutabhavyabhavodbhavam || 5|| yogam yogeshvaram sarvam sarvalokeshvareshvaram | sarvashreshtham
    jagacchreshtham varishtham parameshthinam || 6|| lokatraya vidhataramekam lokatrayashrayam | shuddhatmanam
    bhavam bhimam shashankakritashekharam || 7|| shashvatam bhudharam devam sarvavagishvareshvaram | sudurjayam
    jagannatham janmamrityujaratigam || 8|| jnanatmanam jnanagamyam jnanashreshtham sudarvidam | dataram
    caiva bhaktanam prasadavihitan varan || 9|| ye bhakta varadam devam shivam rudramumapatim | ananyabhavena
    sada sarvesham samupasate || 10|| rudraya shitikanthaya kanishthaya suvarcase | kapardine karalaya
    haryakshne varadaya ca || 11|| yamyayavyaktakeshaya sadvritte shankaraya ca | kamyaya harinetraya
    sthanave purushaya ca || 12|| harikeshaya mundaya krishayottaranaya ca | bhaskaraya sutirthaya devadevaya
    ramhase || 13|| bahurupaya sharvaya priyaya priyavasase | ushnishine suvaktraya sahasrakshaya midhushe
    || 14|| girishaya prashantaya pataye ciravasase | hiranyabahave caiva ugraya pataye disham || 15||
    parjanyapataye caiva bhutanam pataye namah | vrikshanam pataye caiva apam ca pataye tatha || 16||
    vrikshairavritakayaya senanye madhyamaya ca | sruvahastaya devaya dhanvine bhargavaya ca || 17|| bahurupaya
    vishvasya pataye ciravasase | sahasrashirase caiva sahasranayanaya ca || 18|| sahasrabahave caiva
    sahasracaranaya ca | umapatim virupaksham dakshayajnanibarhanam | prajanam patimavyagram bhutanam
    patimavyayam || 19|| kapardinam vrishavartam vrishanabham vrishadhvajam | vrishadarpam vrishapatim
    vrishasha
  devanagari: शिखिनं चीरवाससम् ॥ २॥ महादेवं हरं स्थाणुं वरदं भुवनेश्वरम् । जगत्प्रधानमधिकं जगत्प्रीतमधीश्वरम्
    ॥ ३॥ जगद्योनिं जगद्बीजं जयिनं जगतो गतिम् । विश्वात्मानं विश्वसृजं विश्वमूर्तिं यशस्विनम् ॥ ४॥ विश्वेश्वरं
    विश्वनरं कर्माणामीश्वरं प्रभुम् । शम्भुं स्वयम्भुं भूतेशं भूतभव्यभवोद्भवम् ॥ ५॥ योगं योगेश्वरं सर्वं
    सर्वलोकेश्वरेश्वरम् । सर्वश्रेष्ठं जगच्छ्रेष्ठं वरिष्ठं परमेष्ठिनम् ॥ ६॥ लोकत्रय विधातारमेकं लोकत्रयाश्रयम्
    । शुद्धात्मानं भवं भीमं शशाङ्ककृतशेखरम् ॥ ७॥ शाश्वतं भूधरं देवं सर्ववागीश्वरेश्वरम् । सुदुर्जयं जगन्नाथं
    जन्ममृत्युजरातिगम् ॥ ८॥ ज्ञानात्मानां ज्ञानगम्यं ज्ञानश्रेष्ठं सुदर्विदम् । दातारं चैव भक्तानां प्रसादविहितान्
    वरान् ॥ ९॥ ये भक्ता वरदं देवं शिवं रुद्रमुमापतिम् । अनन्यभावेन सदा सर्वेशं समुपासते ॥ १०॥ रुद्राय
    शितिकण्ठाय कनिष्ठाय सुवर्चसे । कपर्दिने करालाय हर्यक्ष्णे वरदाय च ॥ ११॥ याम्यायाव्यक्तकेशाय सद्वृत्ते
    शङ्कराय च । काम्याय हरिनेत्राय स्थाणवे पुरुषाय च ॥ १२॥ हरिकेशाय मुण्डाय कृशायोत्तरणाय च । भास्कराय
    सुतीर्थाय देवदेवाय रंहसे ॥ १३॥ बहुरूपाय शर्वाय प्रियाय प्रियवाससे । उष्णीषिणे सुवक्त्राय सहस्राक्षाय
    मीढुषे ॥ १४॥ गिरिशाय प्रशान्ताय पतये चीरवाससे । हिरण्यबाहवे चैव उग्राय पतये दिशाम् ॥ १५॥ पर्जन्यपतये
    चैव भूतानां पतये नमः । वृक्षाणां पतये चैव अपां च पतये तथा ॥ १६॥ वृक्षैरावृतकायाय सेनान्ये मध्यमाय
    च । स्रुवहस्ताय देवाय धन्विने भार्गवाय च ॥ १७॥ बहुरूपाय विश्वस्य पतये चीरवाससे । सहस्रशिरसे चैव सहस्रनयनाय
    च ॥ १८॥ सहस्रबाहवे चैव सहस्रचरणाय च । उमापतिं विरूपाक्षं दक्षयज्ञनिबर्हणम् । प्रजानां पतिमव्यग्रं
    भूतानां पतिमव्ययम् ॥ १९॥ कपर्दिनं वृषावर्तं वृषनाभं वृषध्वजम् । वृषदर्पं वृषपतिं वृषश
