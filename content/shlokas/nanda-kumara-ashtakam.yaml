id: nanda-kumara-ashtakam
category: stotram
name:
  english: Nanda Kumara Ashtakam
  devanagari: नन्दकुमाराष्टकम् (वल्लभाचार्यविरचितम्)
content:
  english: sundaragopalam uravanamalam nayanavishalam duhkhaharam vrindavanacandramanandakandam paramanandam
    dharanidharam | vallabhaghanashyamam purnakamam atyabhiramam pritikaram bhaja nandakumaram sarvasukhasaram
    tattvavicaram brahmaparam || 1|| sundaravarijavadanam nirjitamadanam anandasadanam mukutadharam gunjakritiharam
    vipinaviharam paramodaram ciraharam | vallabhapatapitam kritaupavitam karanavanitam vibudhavaram bhaja
    nandakumaram sarvasukhasaram tattvavicaram brahmaparam || 2|| shobhitamukhadhulam yamunakulam nipataatulam
    sukhadataram mukhamanditarenum caritadhenum vaditavenum madhurasuram | vallabhamativimalam shubhapadakamalam
    nakharuci amalam timiraharam bhaja nandakumaram sarvasukhasaram tattvavicaram brahmaparam || 3|| shiramukutasudesham
    kuncitakesham natavaravesham kamavaram mayakritamanujam haladharaanujam pratihatadanujam bharaharam
    | vallabhavrajapalam subhagasucalam hitamanukalam bhavavaram bhaja nandakumaram sarvasukhasaram tattvavicaram
    brahmaparam || 4|| indivarabhasam prakatasurasam kusumavikasam vamshidharam hritmanmathamanam rupanidhanam
    kritakalaganam cittaharam | vallabhamriduhasam kunjanivasam vividhavilasam kelikaram bhaja nandakumaram
    sarvasukhasaram tattvavicaram brahmaparam || 5|| atiparamapravinam palitadinam bhaktadhinam karmakaram
    mohanamatidhiram phanibalaviram hataparaviram taralataram | vallabhavrajaramanam varijavadanam haladharashamanam
    shailadharam bhaja nandakumaram sarvasukhasaram tattvavicaram brahmaparam || 6|| jaladharadyutiangam
    lalitatribhangam bahukritarangam rasikavaram gokulaparivaram madanakaram kunjaviharam gudhataram |
    vallabhavrajacandram subhagasuchandam kritaanandam bhrantiharam bhaja nandakumaram sarvasukhasaram
    tattvavicaram brahmaparam || 7|| vanditayugacaranam pavanakaranam jagaduddharanam vimaladharam kaliyashiragamanam
    kritaphaninamanam ghatitayamanam mridulataram | vallabhaduhkhaharanam nirmalacaranam asharanasharanam
    muktikaram bhaja nandakumaram sarvasukhasaram tattvavicaram brahmaparam || 8|| || iti shrimahaprabhuvallabhacaryaviracitam
    shrinandakumarashtakam sampurnam ||
  devanagari: सुन्दरगोपालं उरवनमालं नयनविशालं दुःखहरं वृन्दावनचन्द्रमानन्दकन्दं परमानन्दं धरणिधरम् । वल्लभघनश्यामं
    पूर्णकामं अत्यभिरामं प्रीतिकरं भज नन्दकुमारं सर्वसुखसारं तत्त्वविचारं ब्रह्मपरम् ॥ १॥ सुन्दरवारिजवदनं
    निर्जितमदनं आनन्दसदनं मुकुटधरं गुञ्जाकृतिहारं विपिनविहारं परमोदारं चीरहरम् । वल्लभपटपीतं कृतउपवीतं
    करनवनीतं विबुधवरं भज नन्दकुमारं सर्वसुखसारं तत्त्वविचारं ब्रह्मपरम् ॥ २॥ शोभितमुखधूलं यमुनाकूलं निपटअतूलं
    सुखदतरं मुखमण्डितरेणुं चारितधेनुं वादितवेणुं मधुरसुरम् । वल्लभमतिविमलं शुभपदकमलं नखरुचि अमलं तिमिरहरं
    भज नन्दकुमारं सर्वसुखसारं तत्त्वविचारं ब्रह्मपरम् ॥ ३॥ शिरमुकुटसुदेशं कुञ्चितकेशं नटवरवेशं कामवरं
    मायाकृतमनुजं हलधरअनुजं प्रतिहतदनुजं भारहरम् । वल्लभव्रजपालं सुभगसुचालं हितमनुकालं भाववरं भज नन्दकुमारं
    सर्वसुखसारं तत्त्वविचारं ब्रह्मपरम् ॥ ४॥ इन्दीवरभासं प्रकटसुरासं कुसुमविकासं वंशिधरं हृत्मन्मथमानं
    रूपनिधानं कृतकलगानं चित्तहरम् । वल्लभमृदुहासं कुञ्जनिवासं विविधविलासं केलिकरं भज नन्दकुमारं सर्वसुखसारं
    तत्त्वविचारं ब्रह्मपरम् ॥ ५॥ अतिपरमप्रवीणं पालितदीनं भक्ताधीनं कर्मकरं मोहनमतिधीरं फणिबलवीरं हतपरवीरं
    तरलतरम् । वल्लभव्रजरमणं वारिजवदनं हलधरशमनं शैलधरं भज नन्दकुमारं सर्वसुखसारं तत्त्वविचारं ब्रह्मपरम्
    ॥ ६॥ जलधरद्युतिअङ्गं ललितत्रिभङ्गं बहुकृतरङ्गं रसिकवरं गोकुलपरिवारं मदनाकारं कुञ्जविहारं गूढतरम् ।
    वल्लभव्रजचन्द्रं सुभगसुछन्दं कृतआनन्दं भ्रान्तिहरं भज नन्दकुमारं सर्वसुखसारं तत्त्वविचारं ब्रह्मपरम्
    ॥ ७॥ वन्दितयुगचरणं पावनकरणं जगदुद्धरणं विमलधरं कालियशिरगमनं कृतफणिनमनं घातितयमनं मृदुलतरम् । वल्लभदुःखहरणं
    निर्मलचरणं अशरणशरणं मुक्तिकरं भज नन्दकुमारं सर्वसुखसारं तत्त्वविचारं ब्रह्मपरम् ॥ ८॥ ॥ इति श्रीमहाप्रभुवल्लभाचार्यविरचितं
    श्रीनन्दकुमाराष्टकं सम्पूर्णम् ॥
