id: dakinistotrarudrayamalatantra
category: stotram
name:
  english: dakinistotrarudrayamalatantra
  devanagari: डाकिनीस्तोत्ररुद्रयामलतन्त्र
content:
  english: rinu yogartham savadhanavadharaya | etatstotraprasadena mahalayavasho bhavet || 26|| kalipavana
    stotram | brahmanam hamsasanghayutasharanavadavahanam devavaktra| vidyadanaikahetum timicaranayanagninduphullaravindam
    vagisham vaggatistham matimatavimalam balarkam caruvarnam | dakinyalingitam tam suranaravaradam bhavayenmulapadme
    || 27|| nityam brahmaparayanam sukhamayim dhyayenmuda dakini| raktam gacchavimohinim kulapathe jnanakulajnaninim
    | mulambhoruhamadhyadeshanikate bhuvimbamadhye prabha| hetustham gatimohinim shrutibhujam vidyam bhavahladinim
    || 28|| vidyavastavamalaya galatalapralambashobhakara| dhyatva mulaniketane nijakule yah stauti bhaktya
    sudhih | nanakaravikarasarakiranam kartri vidho yogina| mukhyam mukhyajanasthitam sthitimatim sattvashritamashraye
    || 29|| ya devi navadakini svaramani vijnanini mohini | mam patu pirayakamini bhavavidheranandasindhudbhava
    | me mulam gunabhasini pracayatu shrih kiticakram hi ma| nitya siddhigunodaya suradaya shrisamjnaya
    mohita || 30|| tanmadhye paramakala kulaphala banaprakandakara raka rashashasadasha shashighata lolamala
    komala | sa mata navamalini mama kulam mulambujam sarvada | sa devi lavarakini kaliphalollasaikabijantara
    || 31|| dhatri dhairyavati sati madhumati vidyavati bharati | kalyani kulakanyakadharanararupa hi
    sukshmaspada | mokshastha sthitipujita sthitigata mata shubha yogina| naumi shribhavikashayam shamanagam
    gitodgatam gopanam || 32|| kalkeshim kulapanditam kulapathagranthikriyacchedini| nityam tam gunapanditam
    pracapalam malashatarkarunam | vidyam candagunodayam samudayam trailokyarakshakshara| brahmajnananivasinim
    sitashubhanandaikabijodgatam || 33|| gitarthanubhavapirayam sakalaya siddhaprabhapatalam | kamakhyam
    prabhajami janmanilayam hetupirayam satkriyam | siddhau sadhanatatparam parataram sakararupayitam
    || 34|| brahmajnanam nidanam gunanidhinayanam karananandayanam | brahmanam brahmabijam rajanijayajanam
    yagakaryanuragam || 35|| shokatitam vinitam narajalavacanam sarvavidyavidhijnam | sarat saram tarum
    tam sakalatimiraham hamsagam pujayami || 36|| etatsambandhamargam navanavadalagam vedavedangavijnam
    | mulambhojaprakasham tarunaravishashipronnatakarasaram || 37|| bhavakhyam bhavasiddham jayajayadavidhim
    dhyanagamyam puranam parakhyam paranayam parajanajanitam brahmarupam bhajami || 38|| dakinisahitam
    brahmadhyanam kritva pathet stavam | pathanad dharananmantri yoginam sangatirbhavet || 39|| etatpathanamatrena
    mahapatakanashanam | ekarupam jagannatham vishalanayanambujam || 40|| evam dhyatva pathet stotram
    pathitva yogirad bhavet || 41|| iti shrirudrayamale uttaratantre mahatantroddipane siddhamantraprakarane
    shatcakrasiddhisadhane bhairavabhairavisamvade dakini stotram sampurnam || patalah 30||
  devanagari: ृणु योगार्थं सावधानावधारय । एतत्स्तोत्रप्रसादेन महालयवशो भवेत् ॥ २६॥ कालिपावन स्तोत्रम्
    । ब्रह्माणं हंससङ्घायुतशरणवदावाहनं देववक्त्र। विद्यादानैकहेतुं तिमिचरनयनाग्नीन्दुफुल्लारविन्दम् वागीशं
    वाग्गतिस्थं मतिमतविमलं बालार्कं चारुवर्णम् । डाकिन्यालिङ्गितं तं सुरनरवरदं भावयेन्मूलपद्मे ॥ २७॥ नित्यां
    ब्रह्मपरायणां सुखमयीं ध्यायेन्मुदा डाकिनी। रक्तां गच्छविमोहिनीं कुलपथे ज्ञानाकुलज्ञानिनीम् । मूलाम्भोरुहमध्यदेशनिकटे
    भूविम्बमध्ये प्रभा। हेतुस्थां गतिमोहिनीं श्रुतिभुजां विद्यां भवाह्लादिनीम् ॥ २८॥ विद्यावास्तवमालया
    गलतलप्रालम्बशोभाकरा। ध्यात्वा मूलनिकेतने निजकुले यः स्तौति भक्त्या सुधीः । नानाकारविकारसारकिरणां कर्त्री
    विधो योगिना। मुख्यां मुख्यजनस्थितां स्थितिमतिं सत्त्वाश्रितामाश्रये ॥ २९॥ या देवी नवडाकिनी स्वरमणी
    विज्ञानिनी मोहिनी । मां पातु पिरयकामिनी भवविधेरानन्दसिन्धूद्भवा । मे मूलं गुणभासिनी प्रचयतु श्रीः
    कीतीचक्रं हि मा। नित्या सिद्धिगुणोदया सुरदया श्रीसंज्ञया मोहिता ॥ ३०॥ तन्मध्ये परमाकला कुलफला बाणप्रकाण्डाकरा
    राका राशषसादशा शशिघटा लोलामला कोमला । सा माता नवमालिनी मम कुलं मूलाम्बुजं सर्वदा । सा देवी लवराकिणी
    कलिफलोल्लासैकबीजान्तरा ॥ ३१॥ धात्री धैर्यवती सती मधुमती विद्यावती भारती । कल्याणी कुलकन्यकाधरनरारूपा
    हि सूक्ष्मास्पदा । मोक्षस्था स्थितिपूजिता स्थितिगता माता शुभा योगिना। नौमि श्रीभविकाशयां शमनगां गीतोद्गतां
    गोपनाम् ॥ ३२॥ कल्केशीं कुलपण्डितां कुलपथग्रन्थिक्रियाच्छेदिनी। नित्यां तां गुणपण्डितां प्रचपलां मालाशतार्कारुणाम्
    । विद्यां चण्डगुणोदयां समुदयां त्रैलोक्यरक्षाक्षरा। ब्रह्मज्ञाननिवासिनीं सितशुभानन्दैकबीजोद्गताम्
    ॥ ३३॥ गीतार्थानुभवपिरयां सकलया सिद्धप्रभापाटलाम् । कामाख्यां प्रभजामि जन्मनिलयां हेतुपिरयां सत्क्रियाम्
    । सिद्धौ साधनतत्परं परतरं साकाररूपायिताम् ॥ ३४॥ ब्रह्मज्ञानं निदानं गुणनिधिनयनं कारणानन्दयानम् । ब्रह्माणं
    ब्रह्मबीजं रजनिजयजनं यागकार्यानुरागम् ॥ ३५॥ शोकातीतं विनीतं नरजलवचनं सर्वविद्याविधिज्ञम् । सारात्
    सारं तरुं तं सकलतिमिरहं हंसगं पूजयामि ॥ ३६॥ एतत्सम्बन्धमार्गं नवनवदलगं वेदवेदाङ्गविज्ञम् । मूलाम्भोजप्रकाशं
    तरुणरविशशिप्रोन्नताकारसारम् ॥ ३७॥ भावाख्यं भावसिद्धं जयजयदविधिं ध्यानगम्यं पुराणम् पाराख्यं पारणायं
    परजनजनितं ब्रह्मरूपं भजामि ॥ ३८॥ डाकिनीसहितं ब्रह्मध्यानं कृत्वा पठेत् स्तवम् । पठनाद् धारणान्मन्त्री
    योगिनां सङ्गतिर्भवेत् ॥ ३९॥ एतत्पठनमात्रेण महापातकनाशनम् । एकरूपं जगन्नाथं विशालनयनाम्बुजम् ॥ ४०॥
    एवं ध्यात्वा पठेत् स्तोत्रं पठित्वा योगिराड् भवेत् ॥ ४१॥ इति श्रीरुद्रयामले उत्तरतन्त्रे महातन्त्रोद्दीपने
    सिद्धमन्त्रप्रकरणे षट्चक्रसिद्धिसाधने भैरवभैरवीसंवादे डाकिनी स्तोत्रं सम्पूर्णम् ॥ पटलः ३०॥
