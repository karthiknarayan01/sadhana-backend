id: narayana-kavaca-meaning
category: kavacha
name:
  english: narayana-kavaca meaning
  devanagari: नरयन-कवच मेअनिन्ग्
content:
  english: narayanakavacam sartha om shriganeshaya namah | om namo narayanaya | anganyasah om om namah
    padayoh | om nam namah janunoh | om mom namah urvoh | om nam namah udare | om ram namah hridi | om
    yam namah urasi | om nam namah mukhe | om yam namah shirasi || karanyasah om om namah dakshinatarjanyam
    | om nam namah dakshinamadhyamayam | om mom namah dakshinanamikayam | om bham namah dakshinakanishthikayam
    | om gam namah vamakanishthikayam | om vam namah vamanamikayam | om tem namah vamamadhyamayam | om
    vam namah vamatarjanyam | om sum namah dakshinamgushthordhvaparvani | om dem namah dakshinamgushthaya
    parvani | om vam namah vamamgushthordhvaparvani | om yam namah vamamgushthaya parvani || vishnushadaksharanyasah
    om om namah hridaye | om vim namah murdhani | om sham namah bhruvormadhye | om nam namah shikhayam
    | om vem namah netrayoh | om nam namah sarvasandhishu | om mah astraya phat pracyam | om mah astraya
    phat agneyam | om mah astraya phat dakshinasyam | om mah astraya phat nairritye | om mah astraya phat
    praticyam | om mah astraya phat vayavye | om mah astraya phat udicyam | om mah astraya phat aishanyam
    | om mah astraya phat urdhvayam | om mah astraya phat adharayam ||
  devanagari: नारायणकवचं सार्थ ॐ श्रीगणेशाय नमः । ॐ नमो नारायणाय । अङ्गन्यासः ॐ ॐ नमः पादयोः । ॐ नं नमः
    जानुनोः । ॐ मों नमः ऊर्वोः । ॐ नां नमः उदरे । ॐ रां नमः हृदि । ॐ यं नमः उरसि । ॐ णां नमः मुखे । ॐ
    यं नमः शिरसि ॥ करन्यासः ॐ ॐ नमः दक्षिणतर्जन्याम् । ॐ नं नमः दक्षिणमध्यमायाम् । ॐ मों नमः दक्षिणानामिकायाम्
    । ॐ भं नमः दक्षिणकनिष्ठिकायाम् । ॐ गं नमः वामकनिष्ठिकायाम् । ॐ वं नमः वामानामिकायाम् । ॐ तें नमः वाममध्यमायाम्
    । ॐ वां नमः वामतर्जन्याम् । ॐ सुं नमः दक्षिणांगुष्ठोर्ध्वपर्वणि । ॐ दें नमः दक्षिणांगुष्ठाय पर्वणि
    । ॐ वां नमः वामांगुष्ठोर्ध्वपर्वणि । ॐ यं नमः वामांगुष्ठाय पर्वणि ॥ विष्णुषडक्षरन्यासः ॐ ॐ नमः हृदये
    । ॐ विं नमः मूर्धनि । ॐ षं नमः भ्रुवोर्मध्ये । ॐ णं नमः शिखायाम् । ॐ वें नमः नेत्रयोः । ॐ नं नमः सर्वसन्धिषु
    । ॐ मः अस्त्राय फट् प्राच्याम् । ॐ मः अस्त्राय फट् आग्नेयाम् । ॐ मः अस्त्राय फट् दक्षिणस्याम् । ॐ
    मः अस्त्राय फट् नैरृत्ये । ॐ मः अस्त्राय फट् प्रतीच्याम् । ॐ मः अस्त्राय फट् वायव्ये । ॐ मः अस्त्राय
    फट् उदीच्याम् । ॐ मः अस्त्राय फट् ऐशान्याम् । ॐ मः अस्त्राय फट् ऊर्ध्वायाम् । ॐ मः अस्त्राय फट् अधरायाम्
    ॥
