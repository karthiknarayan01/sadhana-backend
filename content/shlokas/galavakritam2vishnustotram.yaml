id: galavakritam2vishnustotram
category: stotram
name:
  english: galavakritam2vishnustotram
  devanagari: गालवकृतं२विष्णुस्तोत्रम्
content:
  english: galavakritam 2 vishnustotram galava uvaca | sahasrashirasam vishnum matsyarupadharam harim
    | namasyami hrishikesham kurmavaraharupinam || 81|| narasimham vamanakhyam jamadagnyam ca raghavam
    | balabhadram ca krishnam ca kalkim vishnum namamyaham || 82|| vasudevamanadharam pranatartivinashanam
    | adharam sarvabhutanam pranamami janardanam || 83|| sarvajnam sarvakartaram saccidanandavigraham
    | apratarkyamanirdeshyam pranato'smi janardanam || 84|| iti shriskandapurane brahmakhande setukhande
    tritiyadhyayantargatam galavakritam vishnustotram samaptam | skandapurana | brahmakhanda | setukhanda
    | adhyaya 3
  devanagari: गालवकृतं २ विष्णुस्तोत्रम् गालव उवाच । सहस्रशिरसं विष्णुं मत्स्यरूपधरं हरिम् । नमस्यामि
    हृषीकेशं कूर्मवाराहरूपिणम् ॥ ८१॥ नारसिंहं वामनाख्यं जामदग्न्यं च राघवम् । बलभद्रं च कृष्णं च कल्किं
    विष्णुं नमाम्यहम् ॥ ८२॥ वासुदेवमनाधारं प्रणतार्तिविनाशनम् । आधारं सर्वभूतानां प्रणमामि जनार्दनम् ॥
    ८३॥ सर्वज्ञं सर्वकर्तारं सच्चिदानन्दविग्रहम् । अप्रतर्क्यमनिर्देश्यं प्रणतोऽस्मि जनार्दनम् ॥ ८४॥ इति
    श्रीस्कन्दपुराणे ब्रह्मखण्डे सेतुखण्डे तृतीयाध्यायान्तर्गतं गालवकृतं विष्णुस्तोत्रं समाप्तम् । स्कन्दपुराण
    । ब्राह्मखण्ड । सेतुखण्ड । अध्याय ३
meaning: {}
