id: shivastotram-10
category: stotram
name:
  english: shivastotram 10
  devanagari: शिवस्तोत्रम् १०
content:
  english: bho | girisha mahapajjaladherasmanuddhara dhira kripajaladhe || 4|| namaivottama tava padamamalam
    mangaladayakamangaladam | girisha mahapajjaladherasmanuddhara dhira kripajaladhe || 5|| shiva vayamashivam
    na bhajamastvayi sati sashive shivamurtau | girisha mahapajjaladherasmanuddhara dhira kripajaladhe
    || 6|| bhagavan bhavata bhavatapahrita na hritam duritam kim nu kritam | girisha mahapajjaladherasmanuddhara
    dhira kripajaladhe || 7|| sakridapi tava hara namasmaranam kritamaghakulaharamatishubhadam | girisha
    mahapajjaladherasmanuddhara dhira kripajaladhe || 8|| smritamapi tava hara caranadvandvam harati vishadam
    kimu dushtam | girisha mahapajjaladherasmanuddhara dhira kripajaladhe || 9|| hara yadyasmatkritamaparadham
    vividham kripaya harasi tatha | girisha mahapajjaladherasmanuddhara dhira kripajaladhe || 10|| sutamaparadhinamapi
    kritashiksha janakah palayatisha yatha | girisha mahapajjaladherasmanuddhara dhira kripajaladhe ||
    11|| bhavata srishtam jagadiva srishtanasmanayi bhava palaya nityam | girisha mahapajjaladherasmanuddhara
    dhira kripajaladhe || 12|| jagatameko janakastvamato vayamapi jagato na hi bhinnah | girisha mahapajjaladherasmanuddhara
    dhira kripajaladhe || 13|| na hi janimo bhavadanyam shankara dhiram pataram | girisha mahapajaladherasmanuddhara
    dhira kripajaladhe || 14|| deva gajasuraparihritavibhavanasman
  devanagari: भो । गिरिश महापज्जलधेरस्मानुद्धर धीर कृपाजलधे ॥ ४॥ नामैवोत्तम तव पदममलं मङ्गलदायकमङ्गलदम्
    । गिरिश महापज्जलधेरस्मानुद्धर धीर कृपाजलधे ॥ ५॥ शिव वयमशिवं न भजामस्त्वयि सति सशिवे शिवमूर्तौ । गिरिश
    महापज्जलधेरस्मानुद्धर धीर कृपाजलधे ॥ ६॥ भगवन् भवता भवतापहृता न हृतं दुरितं किं नु कृतम् । गिरिश महापज्जलधेरस्मानुद्धर
    धीर कृपाजलधे ॥ ७॥ सकृदपि तव हर नामस्मरणं कृतमघकुलहरमतिशुभदम् । गिरिश महापज्जलधेरस्मानुद्धर धीर कृपाजलधे
    ॥ ८॥ स्मृतमपि तव हर चरणद्वन्द्वं हरति विषादं किमु दुष्टम् । गिरिश महापज्जलधेरस्मानुद्धर धीर कृपाजलधे
    ॥ ९॥ हर यद्यस्मत्कृतमपराधं विविधं कृपया हरसि तथा । गिरिश महापज्जलधेरस्मानुद्धर धीर कृपाजलधे ॥ १०॥
    सुतमपराधिनमपि कृतशिक्ष जनकः पालयतीश यथा । गिरिश महापज्जलधेरस्मानुद्धर धीर कृपाजलधे ॥ ११॥ भवता सृष्टं
    जगदिव सृष्टानस्मानयि भव पालय नित्यम् । गिरिश महापज्जलधेरस्मानुद्धर धीर कृपाजलधे ॥ १२॥ जगतामेको जनकस्त्वमतो
    वयमपि जगतो न हि भिन्नाः । गिरिश महापज्जलधेरस्मानुद्धर धीर कृपाजलधे ॥ १३॥ न हि जानीमो भवदन्यं शङ्कर
    धीरं पातारम् । गिरिश महापजलधेरस्मानुद्धर धीर कृपाजलधे ॥ १४॥ देव गजासुरपरिहृतविभवानस्मान्
