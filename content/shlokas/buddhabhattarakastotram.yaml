id: buddhabhattarakastotram
category: stotram
name:
  english: buddhabhattarakastotram
  devanagari: बुद्धभट्टारकस्तोत्रम्
content:
  english: buddhabhattarakastotram om namo buddhaya | sambuddham pundarikaksham sarvajnam karunatmakam
    | samantabhadram shastaram shakyasimham namamyaham || 1|| shrighanam shrimatim shreshtham shitarashim
    shivankaram | shrimantam shrikaram shantam shantamurtim namamyaham || 2|| nairatmyavadinamindum niravadyam
    nirashrayam | shrutijnam nirmalatmanam nisthulakam namamyaham || 3|| nirodhakam nityajnanam nirvikalpam
    tathagatam | niyatam nidhinakesham nishprapancam namamyaham || 4|| vishveshvaram vimuktijnam vishvarupam
    vinayakam | vishvabrahma susampannam vitaragam namamyaham || 5|| vidyacaranasampannam vishvesham vimalaprabham
    | vinimajnam savishtambham vitamoham namamyaham || 6|| durdantadamakam shantam shuddham shauddhodanim
    munim | sugatam sugatim saumyam shubhrakirtim namamyaham || 7|| yogeshvaram dashabalam lokajnam lokapujitam
    | lokacaryam lokamurtim lokanatham namamyaham || 8|| kanakamurtim karmabdhimakalankam kaladharam |
    kantamurtim dayapatram kanakabham namamyaham || 9|| mahamatim mahaviryam mahavijnam mahabalam | mahamaham
    mahadhairyam mahabahum namamyaham || 10|| adyam pavitram tadbrahmamaparajitamadbhutam | aryam parahitam
    nathamamitabham namamyaham || 11|| devadevam mahadevam divyam vanditamavyayam | pramanabhutam devesham
    divyarupam namamyaham || 12|| paramartham parajyotim paramam parameshvaram | bhavabhavakaram shreshtham
    bhagavantam namamyaham || 13|| caturmaradivijitam tattvajnam shankaram shivam | tattvasaram sadacaram
    sarthavaham namamyaham || 14|| jitendriyam jitaklesham jinendram purushottamam | uttamam satpadam
    brahma punyakshetram namamyaham || 15|| etaih stutva munishreshtham nara vigatakalmashah | prapnuvanti
    padam moksham divyam tvatha sanatanam || 16|| yastvidam pathate nityam pratarutthaya panditah | namnamashtottarashatam
    pavitram papanashanam || 17|| labhate cepsitan bhogan saumanasyena varnitan | vyadhayo'pi na badhyante
    patakam ca vinashyati || 18|| ayurarogyamaishvaryasarvamokshasamanvitah | medhavi ca tatha vagmi jayate
    janmajanmani || 19|| iti buddhabhattarakasya brahmaviracitam stotram sampurnam ||
  devanagari: बुद्धभट्टारकस्तोत्रम् ॐ नमो बुद्धाय । सम्बुद्धं पुण्डरीकाक्षं सर्वज्ञं करुणात्मकम् । समन्तभद्रं
    शास्तारं शाक्यसिंहं नमाम्यहम् ॥ १॥ श्रीघनं श्रीमतिं श्रेष्ठं शीतराशिं शिवङ्करम् । श्रीमन्तं श्रीकरं
    शान्तं शान्तमूर्तिं नमाम्यहम् ॥ २॥ नैरात्म्यवादिनमिन्दुं निरवद्यं निराश्रयम् । श्रुतिज्ञं निर्मलात्मानं
    निस्थूलकं नमाम्यहम् ॥ ३॥ निरोधकं नित्यज्ञानं निर्विकल्पं तथागतम् । नियतं निधिनाकेशं निष्प्रपञ्चं नमाम्यहम्
    ॥ ४॥ विश्वेश्वरं विमुक्तिज्ञं विश्वरूपं विनायकम् । विश्वब्रह्म सुसम्पन्नं वीतरागं नमाम्यहम् ॥ ५॥ विद्याचरणसम्पन्नं
    विश्वेशं विमलप्रभम् । विनिमज्ञं सविष्टम्भं वीतमोहं नमाम्यहम् ॥ ६॥ दुर्दान्तदमकं शान्तं शुद्धं शौद्धोदनिं
    मुनिम् । सुगतं सुगतिं सौम्यं शुभ्रकीर्तिं नमाम्यहम् ॥ ७॥ योगेश्वरं दशबलं लोकज्ञं लोकपूजितम् । लोकाचार्यं
    लोकमूर्तिं लोकनाथं नमाम्यहम् ॥ ८॥ कनकमूर्तिं कर्माब्धिमकलङ्कं कलाधरम् । कान्तमूर्तिं दयापात्रं कनकाभं
    नमाम्यहम् ॥ ९॥ महामतिं महावीर्यं महाविज्ञं महाबलम् । महामहं महाधैर्यं महाबाहुं नमाम्यहम् ॥ १०॥ आद्यं
    पवित्रं तद्ब्रह्ममपराजितमद्भुतम् । आर्यं परहितं नाथममिताभं नमाम्यहम् ॥ ११॥ देवदेवं महादेवं दिव्यं
    वन्दितमव्ययम् । प्रमाणभूतं देवेशं दिव्यरूपं नमाम्यहम् ॥ १२॥ परमार्थं परज्योतिं परमं परमेश्वरम् । भावाभावकरं
    श्रेष्ठं भगवन्तं नमाम्यहम् ॥ १३॥ चतुर्मारादिविजितं तत्त्वज्ञं शङ्करं शिवम् । तत्त्वसारं सदाचारं सार्थवाहं
    नमाम्यहम् ॥ १४॥ जितेन्द्रियं जितक्लेशं जिनेन्द्रं पुरुषोत्तमम् । उत्तमं सत्पदं ब्रह्म पुण्यक्षेत्रं
    नमाम्यहम् ॥ १५॥ एतैः स्तुत्वा मुनिश्रेष्ठं नरा विगतकल्मषाः । प्राप्नुवन्ति पदं मोक्षं दिव्यं त्वथ
    सनातनम् ॥ १६॥ यस्त्विदं पठते नित्यं प्रातरूत्थाय पण्डितः । नाम्नामष्टोत्तरशतं पवित्रं पापनाशनम् ॥
    १७॥ लभते चेप्सितान् भोगान् सौमनस्येन वर्णितान् । व्याधयोऽपि न बाध्यन्ते पातकं च विनश्यति ॥ १८॥ आयुरारोग्यमैश्वर्यसर्वमोक्षसमन्वितः
    । मेधावी च तथा वाग्मी जायते जन्मजन्मनि ॥ १९॥ इति बुद्धभट्टारकस्य ब्रह्माविरचितं स्तोत्रं सम्पूर्णम्
    ॥
