id: urdhvapundropanishat-vaishnava
category: upanishad
name:
  english: urdhvapundropanishat (vaishnava)
  devanagari: ऊर्ध्वपुण्ड्रोपनिषत् (वैष्णव)
content:
  english: ityekavaram || shvetamriddevi papaghne vishnudehasamudbhave | cakrankite namaste'stu dharananmuktida
    bhava || shricurnam shrikaram divyam shriyashcange samudbhavam | pundram ca yasya madhye tu dharyam
    moksharthibhih smritam || tisro rekhah prakurvita vratametattu vaishnavam || yastvevam vijaniyat sa
    narayanasayujyamavapnoti | na ca punah kutra kutra dharyam | matpadakritayashca urdhvapundra nasadayah
    smritah rekhadvadashakasthane | prathamam tu lalatake dvitiyam tu nabhau tritiyam vakshasi caturtham
    kanthe pancamam nabhidakshine shashtham dakshinabahau saptamam tadurdhvaskandhe ashtamam nabhyuttare
    navamam vamabahau dashamam tadurdhvaskandhe ekadasham prishthordhvatah dvadasham kanthaprishthe moksham
    dehi shirasi | narayane mayyacala bhaktistu vardhate | samjnena phalam labdhva tadvishnoh paramam
    padamavapnoti | keshavadidvadashanamabhih brahmacari grihastho yatishca sarvebhyo duhkhebhyo mukto
    bhavati | sarveshu tirtheshu snato bhavati | sarvairdevaih jnato bhavati | ashrotriyah shrotriyo bhavati
    | anupanito'pyupanito bhavati | acakshushah panktim punati | na ca punaravartate na ca punaravartate
    | ityaha bhagavan varaharupi | ya evam vedetyupanishat ||
  devanagari: इत्येकवारम् ॥ श्वेतमृद्देवि पापघ्ने विष्णुदेहसमुद्भवे । चक्राङ्किते नमस्तेऽस्तु धारणान्मुक्तिदा
    भव ॥ श्रीचूर्णं श्रीकरं दिव्यं श्रियश्चाङ्गे समुद्भवम् । पुण्ड्रं च यस्य मध्ये तु धार्यं मोक्षार्थिभिः
    स्मृतम् ॥ तिस्रो रेखाः प्रकुर्वीत व्रतमेतत्तु वैष्णवम् ॥ यस्त्वेवं विजानीयात् स नारायणसायुज्यमवाप्नोति
    । न च पुनः कुत्र कुत्र धार्यम् । मत्पादाकृतयश्च ऊर्ध्वपुण्ड्रा नासादयः स्मृताः रेखाद्वादशकस्थाने ।
    प्रथमं तु ललाटके द्वितीयं तु नाभौ तृतीयं वक्षसि चतुर्थं कण्ठे पञ्चमं नाभिदक्षिणे षष्ठं दक्षिणबाहौ
    सप्तमं तदूर्ध्वस्कन्धे अष्टमं नाभ्युत्तरे नवमं वामबाहौ दशमं तदूर्ध्वस्कन्धे एकादशं पृष्ठोर्ध्वतः द्वादशं
    कण्ठपृष्ठे मोक्षं देहि शिरसि । नारायणे मय्यचला भक्तिस्तु वर्धते । संज्ञेन फलं लब्ध्वा तद्विष्णोः परमं
    पदमवाप्नोति । केशवादिद्वादशनामभिः ब्रह्मचारी गृहस्थो यतिश्च सर्वेभ्यो दुःखेभ्यो मुक्तो भवति । सर्वेषु
    तीर्थेषु स्नातो भवति । सर्वैर्देवैः ज्ञातो भवति । अश्रोत्रियः श्रोत्रियो भवति । अनुपनीतोऽप्युपनीतो
    भवति । आचक्षुषः पङ्क्तिं पुनाति । न च पुनरावर्तते न च पुनरावर्तते । इत्याह भगवान् वराहरूपी । य एवं
    वेदेत्युपनिषत् ॥
meaning: {}
