id: nandakritamshrikrishnastotram
category: stotram
name:
  english: nandakritamshrikrishnastotram
  devanagari: नन्दकृतंश्रीकृष्णस्तोत्रम्
content:
  english: nandakritam shrikrishnastotram nanda uvaca | namo brahmanyadevaya gobrahmanahitaya ca || 204||
    jagaddhitaya krishnaya govindaya namo namah | namo brahmanyadevaya brahmane paramatmane || 205|| anantakotibrahmandadhamadhamne
    namo'stu te | namo matsyadirupanam jivarupaya sakshine || 206|| nirliptaya nirgunaya nirakaraya te
    namah | atisukshmasvarupaya sthulatsthulatamaya ca || 207|| sarveshvaraya sarvaya tejorupa namo'stu
    te | atipratyaksharupaya dhyanasadhyaya yoginam || 208|| brahmavishnumaheshanam vandyaya nityarupine
    | dhamne caturnnam varnanam yugeshveva caturshu ca || 209|| shuklaraktapitashyamabhidhanagunashaline
    | yogine yogarupaya gurave yoginamapi || 210|| siddheshvaraya siddhaya siddhanam gurave namah | yam
    stotumakshamo brahma vishnuryam stotumakshamah || 211|| yam stotumakshamo rudrah shesho yam stotumakshamah
    | yam stotumakshamo dharmo yam stotumakshamo ravih || 212|| yam stotumakshamo lambodarashcapi shadananah
    | yam stotumakshamah sarve munayah sanakadayah || 213|| kapilo na kshamah stotum siddhendranam gurorguruh
    | na shaktau stavanam kartum naranarayanavrishi || 214|| anye jadadhiyah ke va stotum shaktah paratparam
    | veda na shakta no vani na ca lakshmih sarasvati || 215|| na radha stavane shakta kim stuvanti vipashcitah
    | kshamasva nikhilam brahmannaparadham kshanekshane || 216|| raksha mam karunasindho dinabandho bhavarnave
    | pura tirthe tapastaptva putrah praptah sanatanah || 217|| svakiyacaranambhoje bhaktim dasyam ca
    dehi me | brahmatvamamaratvam va salokyadikameva va || 218|| tvatpadambhojadasyasya kalam narhanti
    shodashim | indratvam va suratvam va sampraptim siddhisvargayoh || 219|| rajatvam cirajivitvam sudhiyo
    ganayanti kim | etadyatkathitam sarvam brahmatvadikamishvara || 220|| bhaktasangakshanarddhasya nopama
    te kimarhati | tvadbhakto yastvatsadrishah kastvam tarkitumishvarah || 221|| kshanarddhalapamatrena
    param kartum sa ceshvarah | bhaktasangadbhavatyeva bhaktim kartumanekadha || 222|| tvadbhaktajaladalapajalasekena
    varddhate | abhaktalapatapattu shushkatam yati tatkshanam || 223|| tvadgunasmritisekacca varddhate
    tatkshane sphutam | tvadbhaktyankuramudbhutam sphitam manasajam param || 224|| na nashyam varddhaniyam
    ca nityam nityam kshane kshane | tatah samprapya brahmatvam bhaktasya jivanaya ca || 225|| dadatyeva
    phalam tasmai haridasyamanuttamam | samprapya durlabham dasyam yadi daso babhuva ha || 226|| sunishcayena
    tenaiva jitam sarvam bhayadikam | ityevamuktva bhaktya ca nandastasthau hareh purah || 227|| prasannavadanah
    krishno dadau tasmai tadipsitam | evam nandakritam stotram nityam bhaktya ca yah pathet || 228|| sudridham
    bhaktimapnoti sadyo dasyam labheddhareh || iti shribrahmavaivarte mahapurane shrikrishnajanmakhande
    purve ekavimshadhyayantargatam nandakritam shrikrishnastotram samaptam | brahmavaivartapurana | shrikrishnajanma
  devanagari: नन्दकृतं श्रीकृष्णस्तोत्रम् नन्द उवाच । नमो ब्रह्मण्यदेवाय गोब्राह्मणहिताय च ॥ २०४॥ जगद्धिताय
    कृष्णाय गोविन्दाय नमो नमः । नमो ब्रह्मण्यदेवाय ब्रह्मणे परमात्मने ॥ २०५॥ अनन्तकोटिब्रह्माण्डधामधाम्ने
    नमोऽस्तु ते । नमो मत्स्यादिरूपाणां जीवरूपाय साक्षिणे ॥ २०६॥ निर्लिप्ताय निर्गुणाय निराकाराय ते नमः
    । अतिसूक्ष्मस्वरूपाय स्थूलात्स्थूलतमाय च ॥ २०७॥ सर्वेश्वराय सर्वाय तेजोरूप नमोऽस्तु ते । अतिप्रत्यक्षरूपाय
    ध्यानासाध्याय योगिनाम् ॥ २०८॥ ब्रह्मविष्णुमहेशानां वन्द्याय नित्यरूपिणे । धाम्ने चतुर्ण्णां वर्णानां
    युगेष्वेव चतुर्षु च ॥ २०९॥ शुक्लरक्तपीतश्यामाभिधानगुणशालिने । योगिने योगरूपाय गुरवे योगिनामपि ॥ २१०॥
    सिद्धेश्वराय सिद्धाय सिद्धानां गुरवे नमः । यं स्तोतुमक्षमो ब्रह्मा विष्णुर्यं स्तोतुमक्षमः ॥ २११॥
    यं स्तोतुमक्षमो रुद्रः शेषो यं स्तोतुमक्षमः । यं स्तोतुमक्षमो धर्मो यं स्तोतुमक्षमो रविः ॥ २१२॥ यं
    स्तोतुमक्षमो लम्बोदरश्चापि षडाननः । यं स्तोतुमक्षमाः सर्वे मुनयः सनकादयः ॥ २१३॥ कपिलो न क्षमः स्तोतुं
    सिद्धेन्द्राणां गुरोर्गुरुः । न शक्तौ स्तवनं कर्तुं नरनारायणावृषी ॥ २१४॥ अन्ये जडधियः के वा स्तोतुं
    शक्ताः परात्परम् । वेदा न शक्ता नो वाणी न च लक्ष्मीः सरस्वती ॥ २१५॥ न राधा स्तवने शक्ता किं स्तुवन्ति
    विपश्चितः । क्षमस्व निखिलं ब्रह्मन्नपराधं क्षणेक्षणे ॥ २१६॥ रक्ष मां करुणासिन्धो दीनबन्धो भवार्णवे
    । पुरा तीर्थे तपस्तप्त्वा पुत्रः प्राप्तः सनातनः ॥ २१७॥ स्वकीयचरणाम्भोजे भक्तिं दास्यं च देहि मे ।
    ब्रह्मत्वममरत्वं वा सालोक्यादिकमेव वा ॥ २१८॥ त्वत्पदाम्भोजदास्यस्य कलां नार्हन्ति षोडशीम् । इन्द्रत्वं
    वा सुरत्वं वा सम्प्राप्तिं सिद्धिस्वर्गयोः ॥ २१९॥ राजत्वं चिरजीवित्वं सुधियो गणयन्ति किम् । एतद्यत्कथितं
    सर्वं ब्रह्मत्वादिकमीश्वर ॥ २२०॥ भक्तसङ्गक्षणार्द्धस्य नोपमा ते किमर्हति । त्वद्भक्तो यस्त्वत्सदृशः
    कस्त्वां तर्कितुमीश्वरः ॥ २२१॥ क्षणार्द्धालापमात्रेण पारं कर्तुं स चेश्वरः । भक्तसङ्गाद्भवत्येव भक्तिं
    कर्तुमनेकधा ॥ २२२॥ त्वद्भक्तजलदालापजलसेकेन वर्द्धते । अभक्तालापतापात्तु शुष्कतां याति तत्क्षणम् ॥
    २२३॥ त्वद्गुणस्मृतिसेकाच्च वर्द्धते तत्क्षणे स्फुटम् । त्वद्भक्त्यङ्कुरमुद्भूतं स्फीतं मानसजं परम्
    ॥ २२४॥ न नश्यं वर्द्धनीयं च नित्यं नित्यं क्षणे क्षणे । ततः सम्प्राप्य ब्रह्मत्वं भक्तस्य जीवनाय च
    ॥ २२५॥ ददात्येव फलं तस्मै हरिदास्यमनुत्तमम् । सम्प्राप्य दुर्लभं दास्यं यदि दासो बभूव ह ॥ २२६॥ सुनिश्चयेन
    तेनैव जितं सर्वं भयादिकम् । इत्येवमुक्त्वा भक्त्या च नन्दस्तस्थौ हरेः पुरः ॥ २२७॥ प्रसन्नवदनः कृष्णो
    ददौ तस्मै तदीप्सितम् । एवं नन्दकृतं स्तोत्रं नित्यं भक्त्या च यः पठेत् ॥ २२८॥ सुदृढां भक्तिमाप्नोति
    सद्यो दास्यं लभेद्धरेः ॥ इति श्रीब्रह्मवैवर्ते महापुराणे श्रीकृष्णजन्मखण्डे पूर्वे एकविंशाध्यायान्तर्गतं
    नन्दकृतं श्रीकृष्णस्तोत्रं समाप्तम् । ब्रह्मवैवर्तपुराण । श्रीकृष्णजन्म
