    prabhushnurabhayo'vyayah || 20|| divyabhashapatirdivyah putavak putashasanah | putatma paramajyotirdharmadhyakshyo
    damishvarah || 21|| nirmoho nirmado nihsvo nirdambho nirupadravah | niradharo niraharo nirlobho nishcalo'calah
    || 22|| nishkami nirmamo nishvak nishkalanko niranjanah | nirguno niraso nirbhirnirvyaparo niramayah
