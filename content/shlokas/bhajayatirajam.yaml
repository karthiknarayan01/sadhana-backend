id: bhajayatirajam
category: stotram
name:
  english: bhajayatirajam
  devanagari: भजयतिराजम्
content:
  english: yatirajastotram 1 bhaja yatirajam shrirangeshayajayashrayaketuh shritajanasamrakshanajivatuh
    | bhavabhayajaladhereva hi setuh padmanetuh pranatau hetuh || 1|| bhaja yatirajam bhaja yatirajam
    bhaja yatirajam bhavabhiro | bhaja yatirajam bhaja yatirajam bhaja yatirajam bhavabhiro || bhaja yatirajam
  devanagari: यतिराजस्तोत्रम् १ भज यतिराजम् श्रीरङ्गेशयजयाश्रयकेतुः श्रितजनसंरक्षणजीवातुः । भवभयजलधेरेव
    हि सेतुः पद्मानेतुः प्रणतौ हेतुः ॥ १॥ भज यतिराजं भज यतिराजं भज यतिराजं भवभीरो । भज यतिराजं भज यतिराजं
    भज यतिराजं भवभीरो ॥ भज यतिराजं
meaning: {}
