id: kyta-2-svadhyaya-brahmanam-krishna-yajurveda-taittiriya-aranyaka-patha-saha-vai
category: stotram
name:
  english: KYTA 2 Svadhyaya Brahmanam - Krishna Yajurveda Taittiriya Aranyaka Patha - Saha Vai
content:
  english: krishna yajurvediya taittiriya aranyake dvitiyah prapathakah svadhyayabrahmanam o shri gurubhyo
    namah | harih om || anuvakam nca yajnau pratatavastam ssannahya sahasaivacara nbrahmacaryena tapasaiva
    devaste 'sura amuhyaggste na prajanaggste parabhavante na svargam prasritena vai yajnena deva nna
    prasritenasura prasrito ha vai yajnopavitino yajno 'nupavitino yatkinca brahmano yajnopavityadhite
    yajata eva ta dyajnopavityevadhiyita yajaye dyajeta va yajnasya prasritya va~so va dakshinata upaviya
    dakshina 'va dhatte savyamiti yajnopavitametadeva viparita mpracinavitagm sam rakshagmsi hava puronuvake
    tapo rvarenopamantrayata tani varamavrinitadityo no yoddha iti ta dyodhayaddhvamiti tasmaduttishthantagm
    hava tani rakshagsyadityam yo~dhayanti yavadastamanvaga ttani ha va etani rakshagmsi gayatriya 'bhimantritenambhasa
    shamyanti tadu ha va ete brahmavadinah purvabhimukha 'bhimantrita apa urdhvam vi~kshipanti ta eta
    apo vajribhutva tani rakshagmsi mandeha 'rune dvipe prakshipanti ya mprakramanti tena papmanamava
    dhunvantyudyantamastam mabhiddhyayan kurva mbhadramashnute 'savadityo brahmeti brahmaiva sa nbrahmapyeti
    ya evam devasashcakrima vayam | adityastasma nma muncatartasyartena mamita || deva jivanakamya ya
    nna iha muncata vishve deva ssajoshasah || ritena dyavaprithivi ritena tvagm sarasvati | kritannah
    pahyenaso ya tkincanritamudima || indragni mitravarunau somo dhata brihaspatih | te no muncantvenaso
    yadanyakritamarima || sajatashagmsaduta jamishagm sajjyayasa shshagmsaduta va kaniyasah | anadhrishta
    njatavedo mumugdhi || yadvaca ya murubhyamashthivadbhya shishnairyadanrita ncakrima vayam | agnirma
    tasmadenasa gar hapatyah pramuncatu cakrima yani dushkrita || yena trito arnava nnirbabhuva yena surya
    ntamaso nirmumoca | yenendro vishva ajahadaratistenaha njyotisha jyotiranashana a tkusidamapratitta
    mmayeha yena yamasya nidhina carami | etattadagne anrino bhavami jivanneva prati tatte dadhami ||
    yanmayi mata garbhe sati | enashcakara yatpita | agnirma tasmadenasah || yada pipesha matara m | putrah
    pramudito dhayann | ahigmsitau pitarau maya tat | tadagne anrino bhavami || yadantariksha mprithivimuta
    dyam | yanmatara va~ jihigmsima | agnirma tasmadenasah || yadashasa nishasa yatparashasa | yadenashca
    krima nutanam ya~tpuranam | agnirma tasmadenasah || atikramami duritam ya~denah | jahami ripra | yatra
    yanti sukrito napi dushkritah | tamarohami sukrita nnu lokam || trite deva amrijatai tadenah | trita
    etanmanushyeshu mamrije | tato ma yadi kincidanashe | agnirma tasmadenasah || divi jata aphsu jatah
    | ya jata oshadhibhyah | atho ya agnija apah | ta nah shundhantu shundhanih || yadapo nakta ncarama
    | yadva diva nutanam ya~tpuranam | hiranya varnastata utpunita nah || ima mme varuna shrudhi havamadya
    ca mridaya | tvamavasyura cake || tattva yami brahmana vandamana ste yajamano havirbhih | ahedamano
    varuneha boddhyurushasa ma na ayuh pramoshih || tva nno agne varunasya vidva 'va yasi sishthah | yajishtho
    vahni tama shshoshucano vishva dveshasi pramumugdhyasmat || sa tvanno agne 'vamo bhavoti nedishtho
    asya ushaso vyushtau | ava yakshva no varuna rarano vihi mridika suhavo na edhi || tvamagne aya 'si
    | aya sanmanasa hitah | aya sanahavyamuhishe | aya no dhehi bheshajam | ishto agnirahutah | svahakritah
    pipartu nah | svaga devebhya ida mumugdhi sapta ca thsanva sanjagara jane bhyah | agnirma tasmadindrashca
    sam vi~danau pramuncatam || yaddhasta ncakara kilbishanyakshanam va~gnumupajighnamanah | ugrampashya
    ca rashtrabhricca tanyaphsarasa vanudatta mrinani || ugrapamshye rashtrabhri tkilbishani yadakshavrittamanudattametat
    | nenna rinanrinava ithsamano yamasya loke adhi rajjuraya || ava te hedo varuna namobhirava yajnebhirimahe
    havirbhih | kshayannasmabhyamasura praceto rajannenagmsi shishrathah kritani || uduttamam va~runa
    pashamasmadava shrathaya | atha vayamaditya vrate tava 'nagaso aditaye syama || ima mme varuna shrudhi
    havamadya ca mridaya | tvamavasyura cake || tattva yami brahmana vandamana ste yajamano havirbhih
    | ahedamano varuneha boddhyurushasa ma na ayuh pramoshih || tva nno agne varunasya vidva 'va yasi
    sishthah | yajishtho vahni tama shshoshucano vishva dveshasi pramumugdhyasmat || sa tvanno agne 'vamo
    bhavoti nedishtho asya ushaso vyushtau | ava yakshva no varuna rarano vihi mridika suhavo na edhi
    || sankusuko vikusuko nir ritho yashca nisvanah | te dyakshmamanagaso dura dduramacicatam || niryakshmamacicate
    kritya smathsamricchatai tamasmai prasuvamasi || dushshagmsanushagmsabhya nghanenanughanena ca | tenanyo
    thsamricchatai tamasmai prasuvamasi || sam va~rcasa payasa santanubhiraganmahi manasa sagm shivena
    | tvashta no atra vidadhatu rayo ayushte vishvato dadhadayamagnirvare nyah | punaste prana ayati para
    yakshmagm suvami te || ayurda agne havisho jushano ghritapratiko ghritayoniredhi | ghrita mpitva madhu
    caru gavya mpiteva putramabhi rakshatadimam || imamagna ayushe varcase kridhi tigmamojo varuna sagmshishadhi
    | mateva sma adite sharma yaccha vishve deva jaradashti 'sat || agna ayugmshi pavasa asuvorjamisha
    nca nah | are badhasva ducchuna m || agne pavasva svapa asme varcah suvirya rishih pavamanah pancajanyah
    purohitah | tamimahe mahagayam || agne jata npratyajatanjatavedo nudasva | asme didihi sumana ahedancharmante
    syama trivarutha udbhau || sahasa jata npratyajatanjatavedo nudasva | adhi no bruhi sumanasyamano
    vayagg ssapatnan || agne yo no 'bhito jano vriko varo jighagmsati | tag vri~trahanjahi vasvasmabhyama
    bhara || agne yo no 'bhidasati samano yashca nishtyah | tam nkritva tubhyamagne shshapadashapato yashca
    na t | ushashca tasmai nimrukca sarva mpapagm samuhatam || yo nah sapatno yo rano marto 'bhidasati
    devah | iddhmasyeva prakshayato ma tasyoccheshi kincana || yo mandveshti jatavedo ya ndveshmi yashca
    mam | sarvagstanagne sandaha yag ndveshmi ye ca mam || yo asmabhyamaratiya dyashca no dveshate janah
    | nindadyo asma cca sarvagstanmashmasha kuru || sagmshita mme brahma sagmshitam mme jishnu yasyahamasmi
    purohitah || udesha m | kshinomi brahmana 'mitranunnayami sva~ aham || punarmanah punarayurma aga
    tpunashcakshuh puna mma agat punah pranah punaradhita t | vaishvanaro me 'dabdhastanupa avabadhata
    purohitashcatvari ca vaishvanaraya prativedayamo yadinrinagm sangaro devatasu | sa eta npraveda sa
    no muncatu duritadavadyat || vaishvanarah pavayannah pavitrairya myasham | anajana nmanasa yacamano
    yadatraino ava ta thsuvami || ami ye subhage divi vicritau nama tarake | prehamritasya yacchata dbaddhakamocanam
    || vijihir shva lokan kridhi bandha nmuncasi baddhakam | yoneriva pracyuto garbha npatho anushva ||
    sa prajana npratigribhnita vidva nprajapatih prathamaja ritasya | asmabhirdatta njarasah parastadacchinna
    ntantumanu sancarema || ntantumanveke anu sancaranti yesha mpitryamayanavat | abandhveke dadatah prayaccha
    ssvarga esham || arabhethamanu sagmrabhethagm samana mpanthamavatho ghritena | yadva ya~dagnau tasmai
    gotrayeha jayapati sagmrabhetham || yadantariksha va~ jihigmsima | agnirma tasmadenaso gar ddurita
    yani cakrima || bhumirmata mabhishasta enah | dyaurnah pita pitriyaccha mbhavasi jami mitva ma vivithsi
    lokat || yatra suhardah sukrito madante vihaya roga m | ashlonangairahruta ssvarge tatra pashyema
    pitara nca putram || yadannamadmyanritena deva dasyannada syannuta va karishyann | ya ncakshushyago
    asti yadeva kinca pratijagrahamagnirma tasmadanrina nkrinotu || yadannamadmi bahudha virupam va~so
    hiranyamuta gamajamavi ncakshushyago asti yadeva kinca pratijagrahamagnirma tasmadanrina nkrinotu
    || yanmaya manasa vaca kritamenah kadacana | sarvasma mogdhi tvagm hi vettha yathatatham || shshramana
    urdhvamanthino babhuvusta mayaggste nilaya 'nupravishuh kushmandani tag nchraddhaya ca tapasa ca 'bruvan
    katha nilaya ncaratheti ta rishinabruvannamo vo ssaparyameti tanrishayo nno bruta yenarepasah syameti
    ta etani suktanyapashyan mbabhuvayushte vishvato dadhadityetairajya njuhuta vaishvanaraya prativedayama
    ityupatishthata yadarvacinameno bhrunahatyayastasma nmokshyaddhva iti 'bhavan karmadishvetai 'puta
    iva manyeta yatha bhrunahaivamesha bhavati yo 'yonau retah sincati bhrunahatyayastasma nmucyate yavadeno
    dikshamupaiti dikshita etai ndikshito bhavati yo masa mpunite caturvigmshatigm ratri rdikshito bhavati
    caturvigmshati mpunite dvadasha ratri rdikshito bhavati dvadasha masa rdikshito bhavati shadva ritavah
    sam mpunite tisro ratri rdikshito bhavati tripada gayatri gayatriya evatmana mpunite na magmsamashniyanna
    striyamupeyannoparyasita juguphsetanritatpayo brahmanasya vratam ya~vagu rajanyasyamiksha vaishyasyatho
    saumye 'pyaddhvara etadvrata topadasyamityodana nghritamityanuvratayedatmano ha vai prishnigstapasyamana
    nbrahma svayambhvabhyanar ndevatamupatishthanta yajnakamasta eta 'ddhyagishata tah paya ahutayo devanamabhavan
    dyajugmshi ghritahutayo ya thsamani somahutayo yadatharvangiraso maddhvahutayo yadbra ngatha narashagmsirmedahutayo
    devana nnapahatapapmano deva panca va ete mahayajna ssatati pratayante satati santishthante devayajnah
    pitriyajno bhutayajno manushyayajno brahmayajna iti yadagnau juhotyapi samidha tpitribhyah svadha
    karotyapyapasta dbhutebhyo baligm harati ta ssantishthate yadbra ndadati tanmanushyayajna ssantishthate
    yathsva sama va tadbrahmayajna ssantishthate yadrico 'dhite payasah kulya asya pitri nthsvadha abhivahanti
    ya dyajugmshi ghritasya kulya ya thsamani soma ebhyah pavate yadatharvangiraso madhoh ngatha narashagmsi
    rmedasah kulya asya pitrin thsvadha abhivahanti yadrico 'dhite paya ahutibhireva ta dyajugmshi ghritahutibhirya
    thsamani somahutibhi ryadatharvangiraso maddhvahutibhi ngatha narashagmsi rmedahutibhireva ta ntripta
    ayusha tejasa varcasa shriya yashasa brahmavarcasenannadyena ca tarpayanti || brahmayajnena yakshyamanah
    pracya ndishi gramadachadirdarsha udi vo~dita aditye dakshinata upaviyopavishya hastavavanijya triracameddvih
    parimrijya sakridupasprishya shirashcakshushi nasike shrotre hridayamalabhya ya ttriracamati tena
    ricah prinati yaddvih parimrijati tena yajugmshi ya thsakridupasprishati tena samani yacchirashcakshushi
    nasike shrotre hridayamalabhate tenatharvangiraso npuranani kalpa ngatha narashagmsih prinati darbhana
    mmahadupastiryopastha nkritva pramasina ssvaddhyayamadhiyitapam va~ esha oshadhinagm raso ya ssarasamèva
    brahma kurute dakshinottarau pani kritva sapavitravomiti pratipadyata etadvai yajustrayim mpratyesha
    vagetatparamamakshara 'bhyuktamrico akshare parame vyoman ndeva adhi vishve nisheduryastanna veda
    kimrica karishyati ya ittadvidusta ime samasata iti trineva prayunkta bhurbhuvassvarityahaitadvai
    vaca tprayunktatha savitri ntriranvaha paccho 'navanagm savita shriyah prasavita shriyamevapnot yatho
    prajnatayaiva pratipada chandagmsi pratipadyate || grame manasa svaddhyayamadhiyita diva naktam ve~ti
    ha smaha shauca a 'bala uta vacota tishthannuta vrajannutasina uta shayano ntapasvi punyo bhavati
    ya evam ddhyayamadhite namo brahmane namo astvagnaye namah prithivyai nama oshadhibhyah | namo vace
    namo vacaspataye namo vishnave brihate karomi || maddhyandine prabalamadhiyitasau khalu vavaisha adityo
    yadbra ndevanamudagadanika ncakshurmitrasya varunasyagneh | a 'pra dyavaprithivi antarikshagm surya
    atma jagatastasthushashceti sa va esha yajna ssadyah pratayate sadya ssantishthate tasya prakhsayamavabhritho
    namo brahmana iti paridhaniya ntriranvahapa upasprishya grihaneti tato yatkinca dadati sa dakshina
    || tasya va etasya yajnasya megho havirdhanam vi~dyudagnirvarshagm havi rvashatkaro yadavasphurjati
    so 'nuvashatkaro vayuratma vi~dvanmeghe varshati vidyotamane stanayatyavasphurjati pavamane vayavamavasyayag
    svaddhyayamadhite tapa eva tattapyate tapo hi svaddhyaya ityuttama nnakagm rohatyuttama mbhavati yavantagm
    ha va imam tasya va etasya yajnasya dvavanaddhyayau yada ssamriddhirdaivatani ya evam nmaharatra ushasyudite
    vrajaggstishtha grame va yavattarasagg svaddhyayamadhite sarva n ~lokanjayati sarva 'nu sancarati
    tadesha 'bhyukta || anrina asminnanrinah parasmigg stritiye loke anrina ssyama | ye devayana uta pitriyana
    npatho anrina akshiyemetyagnim mpapma jagraha tandeva ahutibhih papmanamapa ya~jnena yajnasya dakshinabhi
    mbrahmanena brahmanasya chandobhi svaddhyayenapahatapapma svaddhyayo devapavitram thsrijatyabhago
    vaci bhavatyabhago nake tadesha 'bhyukta || yastityaja sakhividagm sakhaya nna tasya vacyapi bhago
    asti | yadigm shrinotyalakagm shrinoti na hi praveda sukritasya panthamiti tasma nkratumadhite tena
    tenasyeshta radityasya sayujya 'bhyukta || ye arvamuta va purane vedam vi~dvagmsamabhito vadantyadityameva
    te parivadanti sarve agni nca hagmsamiti yavatirvai devatasta ssarva vedavidi brahmane vasanti tasma
    dbrahmanebhyo vedavidbhyo divedive namaskuryannashlila rtayedeta eva devatah ricyata iva va esha preva
    ricyate yo yajayati prati va grihnati yajayitva pratigrihya va ve~damadhiyita triratram manvatirecayati
    varo dakshina varenaiva varagg sprinotyatma hi varah || duhe ha va esha chandagmsi yo yajayati sa
    yena yajnakratuna yajaye mparetya shucau deshe sva madhiyannasita tasyanashana ndiksha sthanamupasada
    asanagm sutya vagjuhurmana upabhriddhritirdhruva prano havi ssa va esha yajnah pranadakshino 'vakirni
    pravishati caturdhetyahu rbrahmavadino marutah pranairindra mbrahmavarcasenagnimevetarena sarvena
    tasyaita vi~dancakara sudevah ka shyapo yo brahmacaryavakiredamavasyayagm ratryamagni mpraniyopasamadhaya
    dvirajyasyopaghata njuhoti kamavakirno 'smi kama kamaya svaha kamabhidrugdho 'smi kama kamaya svahetyamritam
    va~ ajyamamritamevatma ndhatte hutva prayatanjalih kavatiryannagnimabhi mantrayeta sa mma sincantu
    maruta ssambrihaspatih | sa ssincatvayusha ca balena cayushmanta nkarota meti prati hasmai marutah
    prana ndadhati pratindro bala mpratyagniritarathsarvagm sarvatanurbhutva sarvamayureti trirabhimantrayeta
    trishatya hi deva yo 'puta iva manyeta sa ittha mabhimantrayeta punita evatmana ndhatte varo dakshina
    varenaiva varagg sprinotyatma hi varah || bhuh prapadye bhuvah prapadye svah prapadye bhurbhuvassvah
    prapadye brahma prapadye brahmakosha mprapadye caturjala mmrityurnavapashyati ta mprapadye parivrito
    varivrito brahmana varmana ntejasa kashyapasya yasmai namastacchiro dharmo murdhana mbrahmottara hanuryajno
    'dhara vishnur hridayagm sam va~thsarah prajananamashvinau purvapadavatrirmaddhya mmitravaruna vaparapadavagnih
    pucchasya prathama ntata indrastatah prajapatirabhaya ncaturthagm sa va esha divya shshishumarastagm
    ha ya evam ve~dapa punarmrityu njayati jayati svargam nnaddhvani pramiyate naphsu pramiyate nagnau
    pramiyate nanapatyah pramiyate laghvanno bhavati dhruvastvamasi dhruvasya kshitamasi tva mbhutanamadhipatirasi
    tva mbhutanag shreshtho mbhutanyupaparyavartante namaste nama namo namah shishukumaraya namah namah
    pracyai dishe yashca devata etasya mprativasantye tabhyashca namo namo dakshinayai dishe yashca devata
    etasya mprativasantye tabhyashca namo namah prati cyai dishe yashca devata etasya mprativasantye tabhyashca
    namo nama udi cyai dishe yashca devata etasya mprativasantye tabhyashca namo nama urdhvayai dishe
    yashca devata etasya mprativasantye tabhyashca namo namo 'dharayai dishe yashca devata etasya mprativasantye
    tabhyashca namo namo 'vantarayai dishe yashca devata etasya mprativasantye tabhyashca namo namo gangayamunayormaddhye
    ye vasanti te me prasannatmanascira va~rdhayanti namo gangayamunayormunibhyashca namo namo gangayamunayormunibhyashca
    namah || yushte catustrigmsha vaishvanaraya shadvigmshati r namah pracyai vigmshatih || harih om ||
    || krishna yajurvediya taittiriya aranyake dvitiyah prapathaka
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय आरण्यके द्वितीयः प्रपाठकः स्वाध्यायब्राह्मणं ओ श्री गुरुभ्यो
    नमः । ह॒रिः॒ ओम् ॥ अनुवाकं ञ्च य॒ज्ञौ प्रत॑तावास्तां स्स॒न्नह्य॒ सह॑सै॒वाच॑र न्ब्रह्म॒चर्ये॑ण॒ तप॑सैव
    दे॒वास्ते ऽसु॑रा अमुह्य॒ग्ग्॒स्ते न प्राजा॑न॒ग्ग्॒स्ते परा॑भव॒न्ते न स्व॒र्गं प्रसृ॑तेन॒ वै य॒ज्ञेन॑
    दे॒वा न्न प्रसृ॑ते॒नासु॑रा॒ प्रसृ॑तो ह॒ वै य॑ज्ञोपवी॒तिनो॑ य॒ज्ञो ऽनु॑पवी॒तिनो॒ यत्किञ्च॑ ब्राह्म॒णो
    य॑ज्ञोपवी॒त्यधी॑ते॒ यज॑त ए॒व त द्यज्ञोपवी॒त्ये॑वाधी॑यीत या॒जये॒ द्यजे॑त वा य॒ज्ञस्य॒ प्रसृ॑त्या॒ वाँसो॑
    वा दक्षिण॒त उ॑प॒वीय॒ दक्षि॑ण ऽव॑ धत्ते स॒व्यमिति॑ यज्ञोपवी॒तमे॒तदे॒व विप॑रीत म्प्राचीनावी॒तग्ं सं॒
    रक्षाग्ं॑सि॒ हवा॑ पुरोनुवा॒के तपो र्व॒रेणो॒पाम॑न्त्रयत॒ तानि॒ वर॑मवृणीतादि॒त्यो नो॒ योद्धा॒ इति॒ ता
    द्योध॑य॒द्ध्वमिति॒ तस्मा॒दुत्ति॑ष्ठन्त॒ग्ं॒ हवा॒ तानि॒ रक्षाग्॑स्यादि॒त्यं योँध॑यन्ति॒ याव॑दस्त॒मन्व॑गा॒
    त्तानि॑ ह॒ वा ए॒तानि॒ रक्षाग्ं॑सि गायत्रि॒या ऽभि॑मन्त्रिते॒नाम्भ॑सा शाम्यन्ति॒ तदु॑ ह॒ वा ए॒ते ब्र॑ह्मवा॒दिनः॑
    पू॒र्वाभि॑मु॒खा ऽभि॑मन्त्रिता॒ आप॑ ऊ॒र्ध्वं विँक्षि॑पन्ति॒ ता ए॒ता आपो॑ व॒ज्रीभू॒त्वा तानि॒ रक्षाग्ं॑सि
    म॒न्देहा ऽरु॑णे द्वी॒पे प्रक्षि॑पन्ति॒ य म्प्रक्र॑मन्ति॒ तेन॑ पा॒प्मान॒मव॑ धून्वन्त्यु॒द्यन्त॑मस्तं॒
    म॑भिद्ध्या॒यन् कु॒र्व म्भ॒द्रम॑श्नुते॒ ऽसावा॑दि॒त्यो ब्र॒ह्मेति॒ ब्रह्मै॒व स न्ब्रह्मा॒प्येति॒ य ए॒वं
