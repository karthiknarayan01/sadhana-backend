id: adigo-bhadradri
category: stotram
name:
  english: Adigo Bhadradri
content:
  english: adi adigo bhadradri gautami idigo cudandi || adigo || mudamuto sita mudita lakshmanudu kadasi
    kòluvaga kaladadè raghupati || || adigo || caru svarna prakara gopura dvaramulato sundaramai yundèdi
    || || adigo || anupamanamai atisundaramai tanaru cakramadi dhaga dhaga mèrisèdi || || adigo || kaliyugamanduna
    nila vaikunthamu nalarucununnadi nayamuga mròkkudi || || adigo || pònnala pògadala pupòda rindlatò
    cènnu miraganu cèlagucununnadi || || adigo || shrikaramuga shriramadasuni prakatamuga broce prabhuvasamu
    ||
  devanagari: आदि अदिगो भद्राद्रि गौतमि इदिगो चूडण्डि ॥ अदिगो ॥ मुदमुतो सीत मुदित लक्ष्मणुडु कदसि कॊलुवगा
    कलडदॆ रघुपति ॥ ॥ अदिगो ॥ चारु स्वर्ण प्राकार गोपुर द्वारमुलतो सुन्दरमै युण्डॆडि ॥ ॥ अदिगो ॥ अनुपमानमै
    अतिसुन्दरमै तनरु चक्रमदि धग धग मॆरिसॆडि ॥ ॥ अदिगो ॥ कलियुगमन्दुन निल वैकुण्ठमु नलरुचुनुन्नदि नयमुग
    म्रॊक्कुडि ॥ ॥ अदिगो ॥ पॊन्नल पॊगडल पूपॊद रिण्ड्लतॊ चॆन्नु मीरगनु चॆलगुचुनुन्नदि ॥ ॥ अदिगो ॥ श्रीकरमुग
    श्रीरामदासुनि प्राकटमुग ब्रोचे प्रभुवासमु ॥
