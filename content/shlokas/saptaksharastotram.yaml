id: saptaksharastotram
category: stotram
name:
  english: saptaksharastotram
  devanagari: सप्ताक्षरस्तोत्रम्
content:
  english: saptaksharastotram om namo lokanathaya matsyendraya vishnave | namami jinanathaya nityanityavidhayine
    | nirambaravilasaya nirvikalpaya te namah || 1|| mokshadata kritamoksho mokshasaukhyapradayakah |
    merumandalamadhyasthamokshadaya namo'stu te || 2|| lolakandarpapashaya lokeshaya mahatmane | lokarakshaya
    devaya lokanathaya te namah || 3|| kanakacalamadhyasthakinnarairupapadyate | kirtihetoh samadhyesha
    kantidam tvamupasmahe || 4|| nathamantrasamujjvalanagabharanadharine | niravadyaya buddhaya bodhidaya
    namo'stu te || 5|| sthanarakshakrita dhira sthanabhrashtaprapalaka | locana
  devanagari: सप्ताक्षरस्तोत्रम् ॐ नमो लोकनाथाय मत्स्येन्द्राय विष्णवे । नमामि जिननाथाय नित्यानित्यविधायिने
    । निरम्बरविलासाय निर्विकल्पाय ते नमः ॥ १॥ मोक्षदाता कृतमोक्षो मोक्षसौख्यप्रदायकः । मेरुमण्डलमध्यस्थमोक्षदाय
    नमोऽस्तु ते ॥ २॥ लोलकन्दर्पपाशाय लोकेशाय महात्मने । लोकरक्षाय देवाय लोकनाथाय ते नमः ॥ ३॥ कनकाचलमध्यस्थकिन्नरैरुपपद्यते
    । कीर्तिहेतोः समाध्येषा कान्तिदं त्वामुपास्महे ॥ ४॥ नाथमन्त्रसमुज्ज्वालनागाभरणधारिणे । निरवद्याय बुद्धाय
    बोधिदाय नमोऽस्तु ते ॥ ५॥ स्थानरक्षाकृता धीर स्थानभ्रष्टप्रपालक । लोचना
meaning: {}
