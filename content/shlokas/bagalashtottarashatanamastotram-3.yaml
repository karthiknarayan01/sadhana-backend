id: bagalashtottarashatanamastotram-3
category: stotram
name:
  english: bagalashtottarashatanamastotram 3
  devanagari: बगलाष्टोत्तरशतनामस्तोत्रम् ३
content:
  english: adhuna kathaya prabho || 1|| shriishvara uvaca | asyah shrivagala devyah shatanamastotrasya
    shrisadashivarishirgayatrichandah shrivagalamukhi devata dharmarthakamamoksharthasiddhaye viniyogah
    | om vashini vashapujya ca valika vasuda vasuh | vagvadini vayorupa balabalavati tatha || 2|| vishama
    vikata vedha vishala vimana vidhih | vidya ca vedarupa ca bandhya ca veshadharini || 3|| veni ca vikata
    veshya nanaveshaparicchada | vayorupa ca vriddha vikala vasumatiti ca || 4|| vagala vamani devi vishnupujya
    vinodini | vaishnavi shishna mata ca varahi brahmani vara || 5|| valavalavati vala vidheshca paripujita
    | vishishta brahmapujya ca nanaveshavinodini || 6|| vaikuntharupini brahmi vidhipujya vidhuntuda |
    vallabha valarupa ca ashesha valadharini || 7|| vedajna vedamata ca vishala nayanojjvala | vedamata
    vimata ca vedagarbha vimokshani || 8|| virupakshi vala vali krishnavimalarupini | varahi ca valaka
    ca valini varnarupini || 9|| gandhini gandharupa ca gayagangaprabha tatha | govardhani ca govindapujita
    ca gadadhari || 10|| gahana guhyarupa ca gorupa gokuleshvari | golokavasini caiva nitya golokarupini
    || 11|| garima ca garishtha nitya govardhanarupini | gangadhari ca govinda govindapujita gada || 12||
    gahana guhyarupa ca tathaiva gandharupini | ganarha ganadaganarupini gana mohini || 13|| nilamala
    manonmatta lalajihva lalatini | anandarupini adya acarya svamshurupini || 14|| murtishca mukhyarupa
    ca mahamokshapradayini | khelat khanjagami ca khela khalakhala tatha || 15|| ishvari ishvararadhya
    akara om svarupini | varna ca vagalamukhyah shatanama itiritam || 16|| ashtottarashatam nama yah pathennityamuttamam
    | sarvasiddhishvaro bhutva deviputro bhavettu sah || 17|| trisandhyam yah pathennityam tasya siddhih
    prajayate | nanyatha phalabhagisyat kalpakotishatairapi || 18|| iti shrikalivilasatantre shodashapatale
    shrivagalamukhyah shatanamastotram samaptam | om tatsat |
  devanagari: अधुना कथय प्रभो ॥ १॥ श्रीईश्वर उवाच । अस्याः श्रीवगला देव्याः शतनामस्तोत्रस्य श्रीसदाशिवऋषिर्गायत्रीछन्दः
    श्रीवगलामुखी देवता धर्मार्थकाममोक्षार्थसिद्धये विनियोगः । ॐ वशिनी वशपूज्या च वलिका वसुदा वसुः । वाग्वादिनी
    वयोरूपा बलाबलवती तथा ॥ २॥ विषमा विकटा वेधा विशाला विमना विधिः । विद्या च वेदरूपा च बन्ध्या च वेषधारिणी
    ॥ ३॥ वेणी च विकटा वेश्या नानावेषपरिच्छदा । वयोरूपा च वृद्धा विकला वसुमतीति च ॥ ४॥ वगला वामनी देवी
    विष्णुपूज्या विनोदिनी । वैष्णवी शिष्ण माता च वाराही ब्राह्मणी वरा ॥ ५॥ वलावलवती वाला विधेश्च परिपूजिता
    । विशिष्टा ब्रह्मपूज्या च नानावेषविनोदिनी ॥ ६॥ वैकुण्ठरूपिणी ब्राह्मी विधिपूज्या विधुन्तुदा । वल्लभा
    वलरूपा च अशेष वलधारिणी ॥ ७॥ वेदज्ञा वेदमाता च विशाल नयनोज्ज्वला । वेदमाता विमाता च वेदगर्भा विमोक्षणी
    ॥ ८॥ विरूपाक्षी वला वाली कृष्णविमलरूपिणी । वाराही च वलाका च वलिनी वर्णरूपिणी ॥ ९॥ गन्धिनी गन्धरूपा
    च गयागङ्गाप्रभा तथा । गोवर्धनी च गोविन्दपूजिता च गदाधरी ॥ १०॥ गहना गुह्यरूपा च गोरूपा गोकुलेश्वरी
    । गोलोकवासिनी चैव नित्या गोलोकरूपिणी ॥ ११॥ गरिमा च गरिष्ठा नित्या गोवर्धनरूपिणी । गङ्गाधरी च गोविन्दा
    गोविन्दपूजिता गदा ॥ १२॥ गहना गुह्यरूपा च तथैव गन्धरूपिणी । गणार्हा गानदागानरूपिणी गण मोहिनी ॥ १३॥
    नीलमाला मनोन्मत्ता ललजिह्वा ललाटिनी । आनन्दरूपिणी आद्या आचार्य स्वांशुरूपिणी ॥ १४॥ मूर्तिश्च मुख्यरूपा
    च महामोक्षप्रदायिनी । खेलत् खञ्जगामी च खेला खलखला तथा ॥ १५॥ ईश्वरी ईश्वराराध्या अकार ॐ स्वरूपिणी ।
    वर्णा च वगलामुख्याः शतनाम इतीरितम् ॥ १६॥ अष्टोत्तरशतं नाम यः पठेन्नित्यमुत्तमम् । सर्वसिद्धीश्वरो
    भूत्वा देवीपुत्रो भवेत्तु सः ॥ १७॥ त्रिसन्ध्यं यः पठेन्नित्यं तस्य सिद्धिः प्रजायते । नान्यथा फलभागीस्यात्
    कल्पकोटिशतैरपि ॥ १८॥ इति श्रीकालीविलासतन्त्रे षोडशपटले श्रीवगलामुख्याः शतनामस्तोत्रं समाप्तम् । ॐ
    तत्सत् ।
