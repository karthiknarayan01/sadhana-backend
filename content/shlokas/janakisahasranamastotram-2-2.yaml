id: janakisahasranamastotram-2-2
category: sahasranama
name:
  english: janakisahasranamastotram 2
  devanagari: जानकीसहस्रनामस्तोत्रम् २
content:
  english: sarvakamarthasiddhyarthe jape viniyogah | om janaki kamala vidya siddhavidya kshamatmaja |
    nirmala bhavani bhavya sarvamangalarupini || 1|| kaulini kulaja kanta aparna bhaktavatsala | sukeshi
    carunetra ca devadanavasevita || 2|| atigupta sarojakshi sakala sarvarupini | bhaktivashya mahogra
    ca sarvatantravisharada || 3|| dharatmaja mahamaya shabdarupa mahotsava | kama ca ramanibhadra yajnotsavavibhushita
    || 4|| candravaktra cakorakshi carunetra sulocana | raghunathapriya devi sharada kulabhushita || 5||
    kulanatha ca divya ca shrimati vishvarupini | ramapriya ramamata ramagopya ca muktida || 6|| caturvargaprada
    saukhya sarvapapavinashini | varahi varuni vidya mahavidya maheshvari || 7|| sati satyavati dhumra
    dhavala dharmarupini | dharmanishtha dharmamayi dharmi dharmanishevita || 8|| balika yuvati vriddha
    nitya nityamayi tatha | gayatri vedamata ca sarvasankatatarini || 9|| hiranya kanaka rakta bhadra
    nilasarasvati | indra cendusvarupa ca divyambaravibhushana || 10|| jaganmata jagaddhatri janani sarvarupini
    | patni camarakeshi ca kundadanta sunasika || 11|| kundotsava kundapriya kundapushpamayi tatha | agneyi
    vayavi jyeshtha varuni varunapriya || 12|| sarvadigvarnita vishva sarveshamupakarini | buddhirmedha
    priya shaktistushtih pushtirdhriti kshama || 13|| abala nishcala lakshmih shraddha pannagashayini
    | ananta mahati cinta hyacintya cinmayi smrita || 14|| rajomayi brahmarupa vishnumaya maheshvari |
    sarvatirthamayi devi daityadanavanashini || 15|| virupa vishvarupa ca mridani mridavallabha | koticandrapratikasha
    kotisuryyasamaprabha || 16|| nadamadhya nadabhava nadodbhuta nadakshika | mantrarupa mantrabhava yantramantramayi
    tatha || 17|| dvipada tripada gotra caturvana ca tryakshari | vareshu rgopita gupta aranyasthiranayika
    || 18|| sthira ca tirtharupa ca vegini vegarupini | vegatmika vegadhara kashyapi kamalekshana || 19||
    shaktirupa shaktidhara shaktashaktavibhedaka | gunagunamayi gamya nirguna sadgunanvita || 20|| gandharvasevita
    nandi purnabrahmasvarupini | katyayani jagaddhatri sthitisamharakarini || 21|| ramajaya ca matangi
    sutunga kadalipriya | pritimanah pritidatri shadvarnashirshabhanjika || 22|| venukanta venubhava vinavadya
    ca shobhana | khandacandra purnacandra sakala nishkala tatha || 23|| tejaska mukhara saumya nihshabda
    shabdarupini | sindurarunarakta ca sindurarunabhushita || 24|| meghasvana ca megha ca bahudandavishobhita
    | jayadhvani rnighora ca kharkhara khagarupini || 25|| khagakhya khagamanya ca tadidrupa taditprabha
    | vajrarupa vajramayi vajratantra ca vidruma || 26|| kadambini rata ratya cancala vimala dhruva |
    astrarupa shastrarupa hyanima dhruvamandala || 27|| tarkavidya vedavidya jyotirvidya visharada | kali
    kalpakala sadhya pandurupa parakrama || 28|| nagakanya nagamata nagapatni phanatmika | shaci satyakala
    nidra sunidra ca sucetana || 29|| sushila kharvarupa ca kharvajangha karatmika | dirghajangha dirgharava
    dirghanasa sukarnika || 30|| karnenapujita'chinna chinna chinnamayi tatha | apada padapapada jnanajnanaparayana
    || 31|| gauri padma ca kalyani urvashi dhvajarupini | pataki ketaki curna dridhavrataparayana || 32||
    tilottama rohini ca badari kavimamini | magha ca bharani purva para'purva ca purvika || 33|| aparvika
    apurva ca apurvaphalabhushita | shankhini shankhahasta ca citrahasta sukomala || 34|| komala patrarupa
    ca gandhari capala kala | rukmini rukmarupa ca kshudha trishna jaratura || 35|| acintya cintita cinta
    manojna manasisthita | anjana tvajana vyanja vyanjaniya jararpita || 36|| ajara nirjara jirna jirnarpitavibhavini
    | kurmarupa sukari ca harini mrigarupini || 37|| kasturi mriganabhih ca karpuragarukunkuma | raghudevarata
    shakta raghudevaratipriya || 38|| paurandari tatha vishnorjaya maheshvari vara | sarveshanjanani nitya
    carvangi janakatmaja || 39|| mahadhira mahamaya mahamoha mahotsava | vaikunthanathapatni ca vimalarunarupini
    || 40|| bhagirathi manobuddhirnityanandamayi saha | mahavyadhihara bhima sarvarogapaharini || 41||
    shankhini cakrini dhatri hastepustakadharini | sampada ca sadacara draupadi drupadatmika || 42|| satamsrishtikari
    saumya daityanam kshayakarini | daraityapranahara dhatri dayamodarasapriya || 43|| kshantih kshemankari
    buddhirbharati bhayanashini | taranistaruni tikshna tikshnadaityavinashini || 44|| datri danapara
    danta dushtadaityavinashini | kriya kriyavati hrishta tushta pushta tathorvashi | vedamana vedakanya
    vedamanya pulomaja || 45|| sukhini sukhadatri ca sarvasaukhyavivardhini | shila shilavati sukshma
    sukshmasukshmavaraprada || 46|| varenya varada vani jnanini jnanadatmaja | bhriguvamshasamudbhuta
    bhargavi bhriguvallabha || 47|| raktambaradhara rama ramani suranayika | mokshada shivada shyama yogadhyanaparayana
    || 48|| yogeshvari yogarupa yoganidra krishodari | amba jambavati caiva satyabhama manoratha || 49||
    raudra raudrasvana raudri raudradaityavinashini | kumari kaushiki kali kamadaityavinashini || 50||
    ramapatni ramarata ramajaya mahodari | vishnupatni vishnubhava vishnujaya ca shulini || 51|| madanantaka
    kanta ca madanantakavallabha | bhutabhavyabhavasprishta pavani paripalini || 52|| adrishya vyaktarupa
    ca drishya shreshtha pravarddhini | apannidhisamudbhuta dharini ca pratishthita || 53|| acyuta cacyutaprana
    pranada vasaveshvari | uttara kshobhana kshema shrigarbha parameshvari || 54|| varada pushtideha ca
    kamini kanjalocana | sharanya varada prita prityananandasvarupini || 55|| patakini dayarambha suramya
    ca sureshvari | shrimati ca shiva nanda trishaktirmokshadayini || 56|| paraparakala kanta shishiracalakanyaka
    | daksha bhagavati dhenuh kamadhenuh kalavati || 57|| suramanya surashreshtha shreshtha praneshvari
    sthira | vajrayudha vrajahasta candi candaparakrama || 58|| tamoghni dhvantasamhantri prayatatma pativrata
    | gauri suvarnavarna ca sthitisamharakarini || 59|| medhavini mahavirya hamsi samsaratarini | ekaneka
    mahejya ca sarvalokaprakashini || 60|| shatcakrabhedini vama karyastha karyaranjita | pranata praninamartiharini
    daityanashini || 61|| aja ca bahuvarna ca purusharthapravartini | ganita gunasampanna nagaja khagavahini
    || 62|| rakta nila sita shyama krishna babhrushca karbura | kshudha trishna jara vriddha taruni karunalaya
    || 63|| candranana mahoshthi ca carumurddhajashobhita | kala kashtha muhurta ca nimesha kalarupini
    || 64|| manini madhavi manya mananiya mahaguna | suvarnavasana nasha cakshusparshavati rasa || 65||
    gandhapriya sugandha ca manojna ca manogata | hasta jyeshtha magha pushya dhanishtha purvaphalguni
    || 66|| mriganabhirmrigakshi ca karpuramodadharini | madhushrirmadhavi valli madhumatta madoddhata
    || 67|| revati ramani citra citraharavibhushana | raktambaradhara kshina raktapushpavatamsini || 68||
    navapushpatmika pushpa pushpasraksuvibhushana | shuklambaradhara dhira mahashveta vasupriya || 69||
    navapushpagrihopeta navapushpopashobhita | candrika candrakantishca suryakantirnishacari || 70|| vijaya
    ca jayanti ca mohini shatrunashini | lajja sarasvati nanda danavendrapramardini || 71|| cadramandalasankasha
    jnananandapravarddhini | rupayauvanasampanna gunashilasamanvita || 72|| sarvaishvaryasamayukta sarvalavanyashobhita
    | shita shitapriya svarga sakala vanadevata | gururupadhara gurvi kalamrityuvinashini || 73|| animadigunopeta
    mahamari ca shantida | catuhsamudrashayana caturvargaphalaprada || 74|| sarvakalodbhava prita sarvakalodbhavodbhava
    | anadinidhana pushtirvrikshamadhyanivasini || 75|| sarvacakreshvari sarva sarvamantramayi sada |
    sahasranayana prana sahasranayanapriya || 76|| sahasrashirsha sumana mandabha sarvabhanjika | gitanrityapriya
    kama santushtirdhanada prada || 77|| mayadhari manirata manisammanatatpara | madhava nandada madhvi
    yashodanandavarddhani || 78|| yajnaprita yajnamayi yajnakarmavibhushana | raja rajakulejya ca rajarajeshvari
    rama || 79|| ramini ramini raka ramanandapradayini | rajanikarapurnasya raktotpalavilocana || 80||
    langali premasantushta langalipranayapriya | laksharuna ca lalana lila lilavati laya || 81|| lankeshvaragunaprita
    lankeshavaradayini || 82|| lavangakusumaprita lavangakusumaprabha | punyada purnima punya punyakotiphalaprada
    || 83|| puranagocara purna'purva praudhavinashini | prahladahridayahladagehini punyacarini || 84||
    phaladatri phalasakta phaladatrivibhushita | vani vilasakarini varangi ca varanana || 85|| vishnorvakshasthalastha
    ca vagmati vindhyagehini | dhira dhairyavati dhrishta dhavalambhojasannibha || 86|| tantradhari tantratari
    tantrakari bhavatura | tapasya talini tirna durvadalasusevita || 87|| karpurapuravadana kalanathasamaprabha
    | kalakelipriyakirna kunjareshvaragamini || 88|| kharva ca khanjanadvandvalocana ravabhushita | khadyota
    iva durlakshya khadyota iva cancala || 89|| calaccakoranayana calatkhanjanalocana | caturvedamayi
    rupa caturvarnamayi bhrita || 90|| jagannathapriya jiva jagannatharata jaya | jamatrivarada jambha
    yamalarjunadharini || 91|| tapasya talini tirna purnanandamayi sada | tarasvarenasahita tarasvaravibhushita
    || 92|| vamshadhvaja vamsharupa nandini kulamadhyaga | phatkarapranaya vriddha citra patakanashini
    || 93|| adhah sthita ca patala adhobhuvanagamini | atala vitala tirna sutala nagashayini || 94|| dvijihva
    bahujihva ca rasana surasevita | shunya ranya varenya ca varishtha ca yugambara || 95|| pratiparvasthita
    devi tithih svaravibhushita | pratima navami caiva yugadhya cakrarupini || 96|| vahagrasta vahabhara
    vahasuryasamanvita | candrajyotsnamara kamya rakamritacara cari || 97|| nagari nagara jyeshtha nagarajasuta
    naga | navinendukala nandi nandikeshvarapujita || 98|| nirajakshi cancalakshi nirajadvandvalocana
    | niraprasurnirabhava niranirmaladehini || 99|| navinaketakikunda
  devanagari: सर्वकामार्थसिद्ध्यर्थे जपे विनियोगः । ॐ जानकी कमला विद्या सिद्धविद्या क्षमात्मजा । निर्मला
    भावनी भव्या सर्वमङ्गलरूपिणी ॥ १॥ कौलिनी कुलजा कान्ता अपर्णा भक्तवत्सला । सुकेशी चारुनेत्रा च देवदानवसेविता
    ॥ २॥ अतिगुप्ता सरोजाक्षी सकला सर्वरूपिणी । भक्तिवश्या महोग्रा च सर्वतन्त्रविशारदा ॥ ३॥ धरात्मजा महामाया
    शब्दरूपा महोत्सवा । कामा च रमणीभद्रा यज्ञोत्सवविभूषिता ॥ ४॥ चन्द्रवक्त्रा चकोराक्षी चारुनेत्रा सुलोचना
    । रघुनाथप्रिया देवी शारदा कुलभूषिता ॥ ५॥ कुलनाथा च दिव्या च श्रीमती विश्वरूपिणी । रामप्रिया राममता
    रामगोप्या च मुक्तिदा ॥ ६॥ चतुर्वर्गप्रदा सौख्या सर्वपापविनाशिनी । वाराही वारुणी विद्या महाविद्या महेश्वरी
    ॥ ७॥ सती सत्यवती धूम्रा धवला धर्मरूपिणी । धर्मनिष्ठा धर्ममयी धर्मी धर्मनिषेविता ॥ ८॥ बालिका युवती
    वृद्धा नित्या नित्यमयी तथा । गायत्री वेदमाता च सर्वसङ्कटतारिणी ॥ ९॥ हिरण्या कनका रक्ता भद्रा नीलसरस्वती
    । इन्द्रा चेन्दुस्वरूपा च दिव्याम्बरविभूषणा ॥ १०॥ जगन्माता जगद्धात्री जननी सर्वरूपिणी । पत्नी चामरकेशी
    च कुन्ददन्ता सुनासिका ॥ ११॥ कुन्दोत्सवा कुन्दप्रिया कुन्दपुष्पमयी तथा । आग्नेयी वायवी ज्येष्ठा वारुणी
    वरुणप्रिया ॥ १२॥ सर्वदिग्वर्णिता विश्वा सर्वेषामुपकारिणी । बुद्धिर्मेधा प्रिया शक्तिस्तुष्टिः पुष्टिर्धृति
    क्षमा ॥ १३॥ अबला निश्चला लक्ष्मीः श्रद्धा पन्नगशायिनी । अनन्ता महती चिन्ता ह्यचिन्त्या चिन्मयी स्मृता
    ॥ १४॥ रजोमयी ब्रह्मरूपा विष्णुमाया महेश्वरी । सर्वतीर्थमयी देवी दैत्यदानवनाशिनी ॥ १५॥ विरूपा विश्वरूपा
    च मृडानी मृडवल्लभा । कोटिचन्द्रप्रतीकाशा कोटिसूर्य्यसमप्रभा ॥ १६॥ नदमध्या नदभवा नदोद्भूता नदाक्षिका
    । मन्त्ररूपा मन्त्रभवा यन्त्रमन्त्रमयी तथा ॥ १७॥ द्विपदा त्रिपदा गोत्रा चतुर्वणा च त्र्यक्षरी । वरेषु
    र्गोपिता गुप्ता अरण्यस्थिरनायिका ॥ १८॥ स्थिरा च तीर्थरूपा च वेगिनी वेगरूपिणी । वेगात्मिका वेगधरा काश्यपी
    कमलेक्षणा ॥ १९॥ शक्तिरूपा शक्तिधरा शक्ताशक्तविभेदका । गुणागुणमयी गम्या निर्गुणा सद्गुणान्विता ॥ २०॥
    गन्धर्वसेविता नन्दी पूर्णब्रह्मस्वरूपिणी । कात्यायनी जगद्धात्री स्थितिसंहारकारिणी ॥ २१॥ रामजाया च
    मातङ्गी सुतुङ्गा कदलीप्रिया । प्रीतिमनाः प्रीतिदात्री षड्वर्णशीर्षभञ्जिका ॥ २२॥ वेणुकान्ता वेणुभवा
    वीणावाद्या च शोभना । खण्डचन्द्रा पूर्णचन्द्रा सकला निष्कला तथा ॥ २३॥ तेजस्का मुखरा सौम्या निःशब्दा
    शब्दरूपिणी । सिन्दूरारुणरक्ता च सिन्दूरारुणभूषिता ॥ २४॥ मेघस्वना च मेघा च बाहुदण्डविशोभिता । जयध्वनि
    र्निघोरा च खर्खरा खगरूपिणी ॥ २५॥ खगाख्या खगमान्या च तडिद्रूपा तडित्प्रभा । वज्ररूपा वज्रमयी वज्रतन्त्रा
    च विद्रुमा ॥ २६॥ कादम्बिनी रता रत्या चञ्चला विमला ध्रुवा । अस्त्ररूपा शस्त्ररूपा ह्यणिमा ध्रुवमण्डला
    ॥ २७॥ तर्कविद्या वेदविद्या ज्योतिर्विद्या विशारदा । काली कल्पकला साध्या पाण्डुरूपा पराक्रमा ॥ २८॥
    नागकन्या नागमाता नागपत्नी फणात्मिका । शची सत्यकला निद्रा सुनिद्रा च सुचेतना ॥ २९॥ सुशीला खर्वरूपा
    च खर्वजङ्घा करात्मिका । दीर्घजङ्घा दीर्घरवा दीर्घनासा सुकर्णिका ॥ ३०॥ कर्णेनपूजिताऽछिन्ना छिन्ना छिन्नमयी
    तथा । आपदा पादपापादा ज्ञानाज्ञानपरायणा ॥ ३१॥ गौरी पद्मा च कल्याणी उर्वशी ध्वजरूपिणी । पताकी केतकी
    चूर्णा दृढव्रतपरायणा ॥ ३२॥ तिलोत्तमा रोहिणी च बदरी कविमामिनी । मघा च भरणी पूर्वा पराऽपूर्वा च पूर्विका
    ॥ ३३॥ अपर्विका अपूर्वा च अपूर्वफलभूषिता । शङ्खिनी शङ्खहस्ता च चित्रहस्ता सुकोमला ॥ ३४॥ कोमला पत्ररूपा
    च गान्धारी चपला कला । रुक्मिणी रुक्मरूपा च क्षुधा तृष्णा जरातुरा ॥ ३५॥ अचिन्त्या चिन्तिता चिन्ता मनोज्ञा
    मनसिस्थिता । अञ्जना त्वाजना व्यञ्जा व्यञ्जनीया जरार्पिता ॥ ३६॥ अजरा निर्जरा जीर्णा जीर्णार्पितविभाविनी
    । कूर्मरूपा सूकरी च हरिणी मृगरूपिणी ॥ ३७॥ कस्तूरी मृगनाभिः च कर्पूरागरुकुङ्कुमा । रघुदेवरता शक्ता
    रघुदेवरतिप्रिया ॥ ३८॥ पौरन्दरी तथा विष्णोर्जाया माहेश्वरी वरा । सर्वेषाञ्जननी नित्या चार्वङ्गी जनकात्मजा
    ॥ ३९॥ महाधीरा महामाया महामोहा महोत्सवा । वैकुण्ठनाथपत्नी च विमलारुणरूपिणी ॥ ४०॥ भागीरथी मनोबुद्धिर्नित्यानन्दमयी
    सहा । महाव्याधिहरा भीमा सर्वरोगापहारिणी ॥ ४१॥ शङ्खिनी चक्रिणी धात्री हस्तेपुस्तकधारिणी । सम्पदा च
    सदाचारा द्रौपदी द्रुपदात्मिका ॥ ४२॥ सतांसृष्टिकरी सौम्या दैत्यानां क्षयकारिणी । दरैत्यप्राणहरा धात्री
    दयामोदरसप्रिया ॥ ४३॥ क्षान्तिः क्षेमङ्करी बुद्धिर्भारती भयनाशिनी । तरणिस्तरुणी तीक्ष्णा तीक्ष्णदैत्यविनाशिनी
    ॥ ४४॥ दात्री दानपरा दान्ता दुष्टदैत्यविनाशिनी । क्रिया क्रियावती हृष्टा तुष्टा पुष्टा तथोर्वशी । वेदमना
    वेदकन्या वेदमान्या पुलोमजा ॥ ४५॥ सुखिनी सुखदात्री च सर्वसौख्यविवर्धिनी । शीला शीलवती सूक्ष्मा सूक्ष्मासूक्ष्मवरप्रदा
    ॥ ४६॥ वरेण्या वरदा वाणी ज्ञानिनी ज्ञानदात्मजा । भृगुवंशसमुद्भूता भार्गवी भृगुवल्लभा ॥ ४७॥ रक्ताम्बरधरा
    रामा रमणी सुरनायिका । मोक्षदा शिवदा श्यामा योगध्यानपरायणा ॥ ४८॥ योगेश्वरी योगरूपा योगनिद्रा कृशोदरी
    । अम्बा जाम्बवती चैव सत्यभामा मनोरथा ॥ ४९॥ रौद्रा रौद्रस्वना रौद्री रौद्रदैत्यविनाशिनी । कुमारी कौशिकी
    काली कामदैत्यविनाशिनी ॥ ५०॥ रामपत्नी रामरता रामजाया महोदरी । विष्णुपत्नी विष्णुभवा विष्णुजाया च शूलिनी
    ॥ ५१॥ मदनान्तक कान्ता च मदनान्तकवल्लभा । भूतभव्यभवस्पृष्टा पावनी परिपालिनी ॥ ५२॥ अदृश्या व्यक्तरूपा
    च दृश्या श्रेष्ठा प्रवर्द्धिनी । अपान्निधिसमुद्भूता धारिणी च प्रतिष्ठिता ॥ ५३॥ अच्युता चाच्युतप्राणा
    प्राणदा वासवेश्वरी । उत्तरा क्षोभणा क्षेमा श्रीगर्भा परमेश्वरी ॥ ५४॥ वरदा पुष्टिदेहा च कामिनी कञ्जलोचना
    । शरण्या वरदा प्रीता प्रीत्यानानन्दस्वरूपिणी ॥ ५५॥ पताकिनी दयारम्भा सुरम्या च सुरेश्वरी । श्रीमती
    च शिवा नन्दा त्रिशक्तिर्मोक्षदायिनी ॥ ५६॥ परापरकला कान्ता शिशिराचलकन्यका । दक्षा भगवती धेनुः कामधेनुः
    कलावती ॥ ५७॥ सुरमान्या सुरश्रेष्ठा श्रेष्ठा प्राणेश्वरी स्थिरा । वज्रायुधा व्रजहस्ता चण्डी चण्डपराक्रमा
    ॥ ५८॥ तमोघ्नी ध्वान्तसंहन्त्री प्रयतात्मा पतिव्रता । गौरी सुवर्णवर्णा च स्थितिसंहारकारिणी ॥ ५९॥ मेधाविनी
    महावीर्या हंसी संसारतारिणी । एकानेका महेज्या च सर्वलोकप्रकाशिनी ॥ ६०॥ षट्चक्रभेदिनी वामा कार्यस्था
    कार्यरञ्जिता । प्रणता प्राणिनामार्तिहारिणी दैत्यनाशिनी ॥ ६१॥ अजा च बहुवर्णा च पुरुषार्थप्रवर्तिनी
    । गणिता गुणसम्पन्ना नगजा खगवाहिनी ॥ ६२॥ रक्ता नीला सिता श्यामा कृष्णा बभ्रुश्च कर्बुरा । क्षुधा तृष्णा
    जरा वृद्धा तरुणी करुणालया ॥ ६३॥ चन्द्रानना महोष्ठी च चारुमूर्द्धजशोभिता । कला काष्ठा मुहूर्ता च निमेषा
    कालरूपिणी ॥ ६४॥ मानिनी माधवी मान्या माननीया महागुणा । सुवर्णवसना नाशा चक्षुस्पर्शवती रसा ॥ ६५॥ गन्धप्रिया
    सुगन्धा च मनोज्ञा च मनोगता । हस्ता ज्येष्ठा मघा पुष्या धनिष्ठा पूर्वफल्गुनी ॥ ६६॥ मृगनाभिर्मृगाक्षी
    च कर्पूरामोदधारिणी । मधुश्रीर्माधवी वल्ली मधुमत्ता मदोद्धता ॥ ६७॥ रेवती रमणी चित्रा चित्रहारविभूषणा
    । रक्ताम्बरधरा क्षीणा रक्तपुष्पावतंसिनी ॥ ६८॥ नवपुष्पात्मिका पुष्पा पुष्पस्रक्सुविभूषणा । शुक्लाम्बरधरा
    धीरा महाश्वेता वसुप्रिया ॥ ६९॥ नवपुष्पगृहोपेता नवपुष्पोपशोभिता । चन्द्रिका चन्द्रकान्तिश्च सूर्यकान्तिर्निशाचरी
    ॥ ७०॥ विजया च जयन्ती च मोहिनी शत्रुनाशिनी । लज्जा सरस्वती नन्दा दानवेन्द्रप्रमर्दिनी ॥ ७१॥ चद्रमण्डलसङ्काशा
    ज्ञानानन्दप्रवर्द्धिनी । रूपयौवनसम्पन्ना गुणशीलसमन्विता ॥ ७२॥ सर्वैश्वर्यसमायुक्ता सर्वलावण्यशोभिता
    । शीता शीतप्रिया स्वर्गा सकला वनदेवता । गुरुरूपधरा गुर्वी कालमृत्युविनाशिनी ॥ ७३॥ अणिमादिगुणोपेता
    महामारी च शान्तिदा । चतुःसमुद्रशयना चतुर्वर्गफलप्रदा ॥ ७४॥ सर्वकालोद्भवा प्रीता सर्वकालोद्भवोद्भवा
    । अनादिनिधना पुष्टिर्वृक्षमध्यनिवासिनी ॥ ७५॥ सर्वचक्रेश्वरी सर्वा सर्वमन्त्रमयी सदा । सहस्रनयना प्राणा
    सहस्रनयनप्रिया ॥ ७६॥ सहस्रशीर्षा सुमना मन्दभा सर्वभञ्जिका । गीतनृत्यप्रिया कामा सन्तुष्टिर्धनदा प्रदा
    ॥ ७७॥ मायाधरी मणिरता मणिसम्मानतत्परा । माधवा नन्ददा मध्वी यशोदानन्दवर्द्धनी ॥ ७८॥ यज्ञप्रीता यज्ञमयी
    यज्ञकर्मविभूषणा । राजा राजकुलेज्या च राजराजेश्वरी रमा ॥ ७९॥ रमिणी रामिणी राका रामानन्दप्रदायिनी ।
    रजनीकरपूर्णास्या रक्तोत्पलविलोचना ॥ ८०॥ लाङ्गली प्रेमसन्तुष्टा लाङ्गलीप्रणयप्रिया । लाक्षारुणा च ललना
    लीला लीलावती लया ॥ ८१॥ लङ्केश्वरगुणप्रीता लङ्केशवरदायिनी ॥ ८२॥ लवङ्गकुसुमप्रीता लवङ्गकुसुमप्रभा ।
    पुण्यदा पूर्णिमा पुण्या पुण्यकोटिफलप्रदा ॥ ८३॥ पुराणगोचरा पूर्णाऽपूर्वा प्रौढविनाशिनी । प्रह्लादहृदयाह्लादगेहिनी
    पुण्यचारिणी ॥ ८४॥ फलदात्री फलासक्ता फलदातृविभूषिता । वाणी विलासकरिणी वराङ्गी च वरानना ॥ ८५॥ विष्णोर्वक्षस्थलस्था
    च वाग्मती विन्ध्यगेहिनी । धीरा धैर्यवती धृष्टा धवलाम्भोजसन्निभा ॥ ८६॥ तन्त्रधारी तन्त्रतारी तन्त्रकारी
    भवातुरा । तपस्या तालिनी तीर्णा दूर्वादलसुसेविता ॥ ८७॥ कर्पूरपूरवदना कलानाथसमप्रभा । कलाकेलिप्रियाकीर्णा
    कुञ्जरेश्वरगामिनी ॥ ८८॥ खर्वा च खञ्जनद्वन्द्वलोचना रवभूषिता । खद्योत इव दुर्लक्ष्या खद्योत इव चञ्चला
    ॥ ८९॥ चलच्चकोरनयना चलत्खञ्जनलोचना । चतुर्वेदमयी रूपा चतुर्वर्णमयी भृता ॥ ९०॥ जगन्नाथप्रिया जीवा जगन्नाथरता
    जया । जामातृवरदा जम्भा यमलार्जुनधारिणी ॥ ९१॥ तपस्या तालिनी तीर्णा पूर्णानन्दमयी सदा । तारस्वरेणसहिता
    तारस्वरविभूषिता ॥ ९२॥ वंशध्वजा वंशरूपा नन्दिनी कुलमध्यगा । फट्कारप्रणया वृद्धा चित्रा पातकनाशिनी ॥
    ९३॥ अधः स्थिता च पाताला अधोभुवनगामिनी । अतला वितला तीर्णा सुतला नागशायिनी ॥ ९४॥ द्विजिह्वा बहुजिह्वा
    च रसना सुरसेविता । शून्या रण्या वरेण्या च वरिष्ठा च युगाम्बरा ॥ ९५॥ प्रतिपर्वस्थिता देवी तिथिः स्वरविभूषिता
    । प्रतिमा नवमी चैव युगाढ्या चक्ररूपिणी ॥ ९६॥ वाहग्रस्ता वाहभरा वाहसूर्यसमन्विता । चन्द्रज्योत्स्नामरा
    काम्या राकामृतचरा चरी ॥ ९७॥ नागरी नागरा ज्येष्ठा नागराजसुता नगा । नवीनेन्दुकला नन्दी नन्दिकेश्वरपूजिता
    ॥ ९८॥ नीरजाक्षी चञ्चलाक्षी नीरजद्वन्द्वलोचना । नीरप्रसूर्नीरभवा नीरनिर्मलदेहिनी ॥ ९९॥ नवीनकेतकीकुन्द
