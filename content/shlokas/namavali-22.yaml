id: namavali-22
category: stotram
name:
  english: namavali
  devanagari: नामावली
content:
  english: shridakshinamurtyashtottarashatanamavalih om vidyarupine namah | om mahayogine namah | om shuddhajnanine
    namah | om pinakadhrite namah | om ratnalankritasarvangine namah | om ratnamaulaye namah | om jatadharaya
    namah | om gangadharine namah | om acalavasine namah | om mahajnanine namah || 10|| om samadhikrite
    namah | om aprameyaya namah | om yoganidhaye namah | om tarakaya namah | om bhaktavatsalaya namah
    | om brahmarupine namah | om jagadvyapine namah | om vishnumurtaye namah | om puratanaya namah | om
    ukshavahaya namah || 20|| om carmavasase namah | om pitambaravibhushanaya namah | om mokshadayine
    namah | om mokshanidhaye namah | om andhakaraye namah | om jagatpataye namah | om vidyadharine namah
    | om shuklatanave namah | om vidyadayine namah | om ganadhipaya namah || 30|| om praudhapasmriti samhartre
    namah | om shashimaulaye namah | om mahasvanaya namah | om samapriyaya namah | om avyayaya namah |
    om sadhave namah | om sarvavedairalankritaya namah | om haste vahnidharaya namah | om shrimate mrigadharine
    namah | om vashankaraya namah || 40|| om yajnanathaya namah | om kratudhvamsine namah | om yajnabhoktre
    namah | om yamantakaya namah | om bhaktanugrahamurtaye namah | om bhaktasevyaya namah | om vrishadhvajaya
    namah | om bhasmoddhulitasarvangaya namah | om akshamaladharaya namah | om mahate namah || 50|| om
    trayimurtaye namah | om parabrahmane namah | om nagarajairalankritaya namah | om shantarupayamahajnanine
    namah | om sarvalokavibhushanaya namah | om ardhanarishvaraya namah | om devaya namah | om munisevyaya
    namah | om surottamaya namah | om vyakhyanadevaya namah || 60|| om bhagavate namah | om ravicandragnilocanaya
    namah | om jagadgurave namah | om mahadevaya namah | om mahanandaparayanaya namah | om jatadharine
    namah | om mahayogine namah | om jnanamalairalankritaya namah | om vyomagangajalasthanaya namah |
    om vishuddhaya namah || 70|| om yataye namah | om urjitaya namah | om tattvamurtaye namah | om mahayogine
    namah | om mahasarasvatapradaya namah | om vyomamurtaye namah | om bhaktanamishtaya namah | om kamaphalapradaya
    namah | om paramurtaye namah | om citsvarupine namah || 80|| om tejomurtaye namah | om anamayaya namah
    | om vedavedangatattvajnaya namah | om catuhshashtikalanidhaye namah | om bhavarogabhayadhvamsine
    namah | om bhaktanamabhayapradaya namah | om nilagrivaya namah | om lalatakshaya namah | om gajacarmane
    namah | om gatipradaya namah || 90|| om aragine namah | om kamadaya namah | om tapasvine namah | om
    vishnuvallabhaya namah | om brahmacarine namah | om samnyasine namah | om grihasthashramakaranaya
    namah | om dantaya namah | om shamavatam shreshthaya namah | om satyarupaya namah || 100|| om dayaparaya
    namah | om yogapattabhiramaya namah | om vinadharine namah | om vicetanaya namah | om matiprajnasudhadharine
    namah | om mudrapustakadharanaya namah | om vetaladi pishacaugha rakshasaugha vinashanaya namah |
    om roganam vinihantre namah | om sureshvaraya namah || 109|| || iti shridakshinamurtyashtottarashatanamavalih
    samapta ||
  devanagari: श्रीदक्षिणामूर्त्यष्टोत्तरशतनामावलिः ॐ विद्यारूपिणे नमः । ॐ महायोगिने नमः । ॐ शुद्धज्ञानिने
    नमः । ॐ पिनाकधृते नमः । ॐ रत्नालङ्कृतसर्वाङ्गिने नमः । ॐ रत्नमौलये नमः । ॐ जटाधराय नमः । ॐ गङ्गाधारिणे
    नमः । ॐ अचलवासिने नमः । ॐ महाज्ञानिने नमः ॥ १०॥ ॐ समाधिकृते नमः । ॐ अप्रमेयाय नमः । ॐ योगनिधये नमः
    । ॐ तारकाय नमः । ॐ भक्तवत्सलाय नमः । ॐ ब्रह्मरूपिणे नमः । ॐ जगद्व्यापिने नमः । ॐ विष्णुमूर्तये नमः
    । ॐ पुरातनाय नमः । ॐ उक्षवाहाय नमः ॥ २०॥ ॐ चर्मवाससे नमः । ॐ पीताम्बरविभूषणाय नमः । ॐ मोक्षदायिने
    नमः । ॐ मोक्षनिधये नमः । ॐ अन्धकारये नमः । ॐ जगत्पतये नमः । ॐ विद्याधारिणे नमः । ॐ शुक्लतनवे नमः ।
    ॐ विद्यादायिने नमः । ॐ गणाधिपाय नमः ॥ ३०॥ ॐ प्रौढापस्मृति संहर्त्रे नमः । ॐ शशिमौलये नमः । ॐ महास्वनाय
    नमः । ॐ सामप्रियाय नमः । ॐ अव्ययाय नमः । ॐ साधवे नमः । ॐ सर्ववेदैरलङ्कृताय नमः । ॐ हस्ते वह्निधराय
    नमः । ॐ श्रीमते मृगधारिणे नमः । ॐ वशङ्कराय नमः ॥ ४०॥ ॐ यज्ञनाथाय नमः । ॐ क्रतुध्वंसिने नमः । ॐ यज्ञभोक्त्रे
    नमः । ॐ यमान्तकाय नमः । ॐ भक्तानुग्रहमूर्तये नमः । ॐ भक्तसेव्याय नमः । ॐ वृषध्वजाय नमः । ॐ भस्मोद्धूलितसर्वाङ्गाय
    नमः । ॐ अक्षमालाधराय नमः । ॐ महते नमः ॥ ५०॥ ॐ त्रयीमूर्तये नमः । ॐ परब्रह्मणे नमः । ॐ नागराजैरलङ्कृताय
    नमः । ॐ शान्तरूपायमहाज्ञानिने नमः । ॐ सर्वलोकविभूषणाय नमः । ॐ अर्धनारीश्वराय नमः । ॐ देवाय नमः । ॐ
    मुनिसेव्याय नमः । ॐ सुरोत्तमाय नमः । ॐ व्याख्यानदेवाय नमः ॥ ६०॥ ॐ भगवते नमः । ॐ रविचन्द्राग्निलोचनाय
    नमः । ॐ जगद्गुरवे नमः । ॐ महादेवाय नमः । ॐ महानन्दपरायणाय नमः । ॐ जटाधारिणे नमः । ॐ महायोगिने नमः
    । ॐ ज्ञानमालैरलङ्कृताय नमः । ॐ व्योमगङ्गाजलस्थानाय नमः । ॐ विशुद्धाय नमः ॥ ७०॥ ॐ यतये नमः । ॐ ऊर्जिताय
    नमः । ॐ तत्त्वमूर्तये नमः । ॐ महायोगिने नमः । ॐ महासारस्वतप्रदाय नमः । ॐ व्योममूर्तये नमः । ॐ भक्तानामिष्टाय
    नमः । ॐ कामफलप्रदाय नमः । ॐ परमूर्तये नमः । ॐ चित्स्वरूपिणे नमः ॥ ८०॥ ॐ तेजोमूर्तये नमः । ॐ अनामयाय
    नमः । ॐ वेदवेदाङ्गतत्त्वज्ञाय नमः । ॐ चतुःषष्टिकलानिधये नमः । ॐ भवरोगभयध्वंसिने नमः । ॐ भक्तनामभयप्रदाय
    नमः । ॐ नीलग्रीवाय नमः । ॐ ललाटाक्षाय नमः । ॐ गजचर्मणे नमः । ॐ गतिप्रदाय नमः ॥ ९०॥ ॐ अरागिणे नमः ।
    ॐ कामदाय नमः । ॐ तपस्विने नमः । ॐ विष्णुवल्लभाय नमः । ॐ ब्रह्मचारिणे नमः । ॐ संन्यासिने नमः । ॐ गृहस्थाश्रमकारणाय
    नमः । ॐ दान्ताय नमः । ॐ शमवतां श्रेष्ठाय नमः । ॐ सत्यरूपाय नमः ॥ १००॥ ॐ दयापराय नमः । ॐ योगपट्टाभिरामाय
    नमः । ॐ वीणाधारिणे नमः । ॐ विचेतनाय नमः । ॐ मतिप्रज्ञासुधाधारिणे नमः । ॐ मुद्रापुस्तकधारणाय नमः ।
    ॐ वेतालादि पिशाचौघ राक्षसौघ विनाशनाय नमः । ॐ रोगाणां विनिहन्त्रे नमः । ॐ सुरेश्वराय नमः ॥ १०९॥ ॥ इति
    श्रीदक्षिणामूर्त्यष्टोत्तरशतनामावलिः समाप्ता ॥
