id: annamayya-keerthanas-vedam-bevvani
category: stotram
name:
  english: Annamayya Keerthanas Vedam Bevvani
content:
  english: pallavi vedam bèvvani vèdakèdivi | adevuni gòniyadudi || caranam alarina caitanyatmaku dèvvadu
    | kaladèvva dècata galadanina | talatu rèvvanini danuviyogadasha | yila natani bhajiyincudi || vedam
    bèvvani vèdakèdivi | adevuni gòniyadudi || caranam kadagi sakalarakshaku dindèvvadu | vadi nintayu
    nèvvanimayamu | pidikita triptulu pitaru lèvvanini | dadavina ghanudatani ganudu || vedam bèvvani
    vèdakèdivi | adevuni gòniyadudi || caranam kadasi sakalalokambula varalu | yidivo kòlicèda rèvvanini
    | tridasha vandyudagu tiruvenkatapati | vèdaki vèdaki sevincudi || vedam bèvvani vèdakèdivi | adevuni
    gòniyadudi ||
  devanagari: पल्लवि वेदं बॆव्वनि वॆदकॆडिवि । आदेवुनि गॊनियाडुडी ॥ चरणं अलरिन चैतन्यात्मकु डॆव्वडु । कलडॆव्व
    डॆचट गलडनिन । तलतु रॆव्वनिनि दनुवियोगदश । यिल नातनि भजियिञ्चुडी ॥ वेदं बॆव्वनि वॆदकॆडिवि । आदेवुनि
    गॊनियाडुडी ॥ चरणं कडगि सकलरक्षकु डिन्दॆव्वडु । वडि निन्तयु नॆव्वनिमयमु । पिडिकिट तृप्तुलु पितरु लॆव्वनिनि
    । दडविन घनुडातनि गनुडु ॥ वेदं बॆव्वनि वॆदकॆडिवि । आदेवुनि गॊनियाडुडी ॥ चरणं कदसि सकललोकम्बुल वारलु
    । यिदिवो कॊलिचॆद रॆव्वनिनि । त्रिदश वन्द्युडगु तिरुवेङ्कटपति । वॆदकि वॆदकि सेविञ्चुडी ॥ वेदं बॆव्वनि
    वॆदकॆडिवि । आदेवुनि गॊनियाडुडी ॥
