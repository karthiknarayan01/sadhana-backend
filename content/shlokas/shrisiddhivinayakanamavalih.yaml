id: shrisiddhivinayakanamavalih
category: stotram
name:
  english: shrisiddhivinayakanamavalih
  devanagari: श्रीसिद्धिविनायकनामावलिः
content:
  english: om vinayakaya namah| vighnarajaya namah| gauriputraya namah| ganeshvaraya namah| skandagrajaya
    namah| avyayaya namah| putaya namah| dakshadhyakshyaya namah| dvijapriyaya namah| agnigarbhacchide
    namah| imdrashripradaya namah| vanibalapradaya namah| sarvasiddhipradayakaya namah| sharvatanayaya
    namah| gauritanujaya namah| sharvaripriyaya namah| sarvatmakaya namah| srishtikartre namah| devanikarcitaya
    namah| shivaya namah| shuddhaya namah| buddhipriyaya namah| shamtaya namah| brahmacarine namah| gajananaya
    namah| dvaimaturaya namah| munistutyaya namah| bhakta vighna vinashanaya namah| ekadamtaya namah|
    caturbahave namah| shaktisamyutaya namah| caturaya namah| lambodaraya namah| shurpakarnaya namah|
    herambaya namah| brahmavittamaya namah| kalaya namah| grahapataye namah| kamine namah| somasuryagnilocanaya
    namah| pashamkushadharaya namah| chandaya namah| gunatitaya namah| niramjanaya namah| akalmashaya
    namah| svayamsiddharcitapadaya namah| bijapurakaraya namah| avyaktaya namah| gadine namah| varadaya
    namah| shashvataya namah| kritine namah| vidvatpriyaya namah| vitabhayaya namah| cakrine namah| ikshucapadhrite
    namah| abjotpalakaraya namah| shridhaya namah| shrihetave namah| stutiharshataya namah| kaladbhrite
    namah| jatine namah| candracudaya namah| amareshvaraya namah| nagayajnopavitine namah| shrikamtaya
    namah| ramarcitapadaya namah| vritine namah| sthulakamtaya namah| trayikartre namah| samghoshapriyaya
    namah| purushottamaya namah| sthulatundaya namah| agrajanyaya namah| gramanye namah| ganapaya namah|
    sthiraya namah| vriddhidaya namah| subhagaya namah| shuraya namah| vagishaya namah| siddhidaya namah|
    durvabilvapriyaya namah| kantaya namah| papaharine namah| kritagamaya namah| samahitaya namah| vakratundaya
    namah| shripradaya namah| saumyaya namah| bhaktakamkshitadaya namah| acyutaya namah| kevalaya namah|
    siddhaya namah| saccidanamdavigrahaya namah| jnanine namah| mayayuktaya namah| dantaya namah| brahmishthaya
    namah| bhayavarcitaya namah| pramattadaityabhayadaya namah| vyaktamurtaye namah| amurtaye namah| parvatishamkarotsamgakhelanotsavalalanaya
    namah| samastajagadadharaya namah| varamushakavahanaya namah| hrishtastutaya namah| prasannatmane
    namah| sarvasiddhipradayakaya namah| ||iti shrisiddhivinayakashtottarashatanamavalih||
  devanagari: ॐ विनायकाय नमः। विघ्नराजाय नमः। गौरीपुत्राय नमः। गणेश्वराय नमः। स्कन्दाग्रजाय नमः। अव्ययाय
    नमः। पूताय नमः। दक्षाध्यक्ष्याय नमः। द्विजप्रियाय नमः। अग्निगर्भच्छिदे नमः। इंद्रश्रीप्रदाय नमः। वाणीबलप्रदाय
    नमः। सर्वसिद्धिप्रदायकाय नमः। शर्वतनयाय नमः। गौरीतनूजाय नमः। शर्वरीप्रियाय नमः। सर्वात्मकाय नमः। सृष्टिकर्त्रे
    नमः। देवानीकार्चिताय नमः। शिवाय नमः। शुद्धाय नमः। बुद्धिप्रियाय नमः। शांताय नमः। ब्रह्मचारिणे नमः।
    गजाननाय नमः। द्वैमातुराय नमः। मुनिस्तुत्याय नमः। भक्त विघ्न विनाशनाय नमः। एकदंताय नमः। चतुर्बाहवे
    नमः। शक्तिसंयुताय नमः। चतुराय नमः। लंबोदराय नमः। शूर्पकर्णाय नमः। हेरंबाय नमः। ब्रह्मवित्तमाय नमः।
    कालाय नमः। ग्रहपतये नमः। कामिने नमः। सोमसूर्याग्निलोचनाय नमः। पाशांकुशधराय नमः। छन्दाय नमः। गुणातीताय
    नमः। निरंजनाय नमः। अकल्मषाय नमः। स्वयंसिद्धार्चितपदाय नमः। बीजापूरकराय नमः। अव्यक्ताय नमः। गदिने नमः।
    वरदाय नमः। शाश्वताय नमः। कृतिने नमः। विद्वत्प्रियाय नमः। वीतभयाय नमः। चक्रिणे नमः। इक्षुचापधृते नमः।
    अब्जोत्पलकराय नमः। श्रीधाय नमः। श्रीहेतवे नमः। स्तुतिहर्षताय नमः। कलाद्भृते नमः। जटिने नमः। चन्द्रचूडाय
    नमः। अमरेश्वराय नमः। नागयज्ञोपवीतिने नमः। श्रीकांताय नमः। रामार्चितपदाय नमः। वृतिने नमः। स्थूलकांताय
    नमः। त्रयीकर्त्रे नमः। संघोषप्रियाय नमः। पुरुषोत्तमाय नमः। स्थूलतुण्डाय नमः। अग्रजन्याय नमः। ग्रामण्ये
    नमः। गणपाय नमः। स्थिराय नमः। वृद्धिदाय नमः। सुभगाय नमः। शूराय नमः। वागीशाय नमः। सिद्धिदाय नमः। दूर्वाबिल्वप्रियाय
    नमः। कान्ताय नमः। पापहारिणे नमः। कृतागमाय नमः। समाहिताय नमः। वक्रतुण्डाय नमः। श्रीप्रदाय नमः। सौम्याय
    नमः। भक्ताकांक्षितदाय नमः। अच्युताय नमः। केवलाय नमः। सिद्धाय नमः। सच्चिदानंदविग्रहाय नमः। ज्ञानिने
    नमः। मायायुक्ताय नमः। दन्ताय नमः। ब्रह्मिष्ठाय नमः। भयावर्चिताय नमः। प्रमत्तदैत्यभयदाय नमः। व्यक्तमूर्तये
    नमः। अमूर्तये नमः। पार्वतीशंकरोत्संगखेलनोत्सवलालनाय नमः। समस्तजगदाधाराय नमः। वरमूषकवाहनाय नमः। हृष्टस्तुताय
    नमः। प्रसन्नात्मने नमः। सर्वसिद्धिप्रदायकाय नमः। ॥इति श्रीसिद्धिविनायकाष्टोत्तरशतनामावलिः॥
