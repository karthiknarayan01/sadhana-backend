id: ratri-suktam
category: stotram
name:
  english: Ratri Suktam
content:
  english: asya shri ratriti suktasya kushika rishih ratrirdevata shrijagadamba prityarthe saptashatipathadau
    jape viniyogah | ratri vyakhyadayati purutra devya kshabhih | vishva adhi shriyo orvapra amartya nivato
    devyu dvatah | jyotisha badhate tamah || niru svasaramaskritoshasa ndevyayati | apedu hasate tamah
    || sa no adya yasya vaya nni te yamannavikshmahi | vrikshe na vasatim ni gramaso avikshata ni padvanto
    ni pakshinah | ni shyenasashcidarthinah || ya~vaya stenamurmye | atha na upa ma pepishattamah krishnam
    vya~ktamasthita | usha rineva yataya || vri~nishva duhitardivah | ratri stoma
  devanagari: अस्य श्री रात्रीति सूक्तस्य कुशिक ऋषिः रात्रिर्देवता श्रीजगदम्बा प्रीत्यर्थे सप्तशतीपाठादौ
    जपे विनियोगः । रात्री॒ व्य॑ख्यदाय॒ती पु॑रु॒त्रा दे॒व्य॒ ॑क्षभिः॑ । विश्वा॒ अधि॒ श्रियो॑ ओर्व॑प्रा॒
    अम॑र्त्या नि॒वतो॑ दे॒व्यु॒ ॑द्वतः॑ । ज्योति॑षा बाधते॒ तमः॑ ॥ निरु॒ स्वसा॑रमस्कृतो॒षस॑ न्दे॒व्या॑य॒ती
    । अपेदु॑ हासते॒ तमः॑ ॥ सा नो॑ अ॒द्य यस्या॑ व॒य न्नि ते॒ याम॒न्नवि॑क्ष्महि । वृ॒क्षे न व॑स॒तिं नि ग्रामा॑सो
    अविक्षत॒ नि प॒द्वन्तो॒ नि प॒क्षिणः॑ । नि श्ये॒नास॑श्चिद॒र्थिनः॑ ॥ यँ॒वय॑ स्ते॒नमू॑र्म्ये । अथा॑ न
    उप॑ मा॒ पेपि॑श॒त्तमः॑ कृ॒ष्णं व्यँ॑क्तमस्थित । उष॑ ऋ॒णेव॑ यातय ॥ वृँणी॒ष्व दु॑हितर्दिवः । रात्रि॒
    स्तोम॒
