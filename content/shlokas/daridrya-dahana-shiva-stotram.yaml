id: daridrya-dahana-shiva-stotram
category: stotram
name:
  english: Daridrya Dahana Shiva Stotram
  devanagari: दारिद्र्यदहनशिवस्तोत्रम्
content:
  english: daridryadahanashivastotram vasishthah 1953 daridryadahanashivastotram vasishthah 1953 daridryadahanashivastotram
    vishveshvaraya narakarnavataranaya karnamritaya shashishekharadharanaya | karpurakantidhavalaya jatadharaya
    daridryaduhkhadahanaya namah shivaya ||1 gauripriyaya rajanishakaladharaya kalantakaya bhujagadhipakankanaya
    | gangadharaya gajarajavimardanaya daridya bhaktipriyaya bhavarogabhayapahaya ugraya durgabhavasagarataranaya
    | jyotirmayaya gunanamasunrityakaya daridrya || carmambaraya shavabhasmavilepanaya bhalekshanaya manikundalamanditaya
    | manjirapadayugalaya jatadharaya daridrya || pancananaya phanirajavibhushanaya hemamshukaya bhuvanatrayamanditaya
    | anandabhumivaradaya tamomayaya daridryam || bhanupriyaya bhavasagarataranaya kalantakaya kamalasanapujitaya
    | netratrayaya shubhalakshanalakshitaya daridrya || ramapriyaya raghunathavarapradaya nagapriyaya
    narakarnavataranaya | punyeshu punyabharitaya surarcitaya daridrya || mukteshvaraya phaladaya ganeshvaraya
    gitapriyaya vrishabheshvaravahanaya | matangacarmavasanaya maheshvaraya daridrya ||8 vasishthena kritam
    stotram sarvaroganivaranam | sarvasampatkaram shighram putrapautrabhivardhanam | trisandhyam yah pathennityam
    sa hi svargamavapnuyat || || iti shrivasishthaviracitam daridryahanastotram sampurnam ||
  devanagari: दारिद्र्यदहनशिवस्तोत्रम् वसिष्ठः १९५३ दारिद्र्यदहनशिवस्तोत्रम् वसिष्ठः १९५३ दारिद्र्यदहनशिवस्तोत्रम्
    विश्वेश्वराय नरकार्णवतारणाय कर्णामृताय शशिशेखरधारणाय । कर्पूरकान्तिधवलाय जटाधराय दारिद्र्यदुःखदहनाय
    नमः शिवाय ॥१ गौरीप्रियाय रजनीशकलाधराय कालान्तकाय भुजगाधिपकङ्कणाय । गङ्गाधराय गजराजविमर्दनाय दारिद्य
    भक्तिप्रियाय भवरोगभयापहाय उग्राय दुर्गभवसागरतारणाय । ज्योतिर्मयाय गुणनामसुनृत्यकाय दारिद्र्य ॥ चर्माम्बराय
    शवभस्मविलेपनाय भालेक्षणाय मणिकुण्डलमण्डिताय । मञ्जिरपादयुगलाय जटाधराय दारिद्र्य ॥ पञ्चाननाय फणिराजविभूषणाय
    हेमांशुकाय भुवनत्रयमण्डिताय । आनन्दभूमिवरदाय तमोमयाय दारिद्र्यम् ॥ भानुप्रियाय भवसागरतारणाय कालान्तकाय
    कमलासनपूजिताय । नेत्रत्रयाय शुभलक्षणलक्षिताय दारिद्र्य ॥ रामप्रियाय रघुनाथवरप्रदाय नागप्रियाय नरकार्णवतारणाय
    । पुण्येषु पुण्यभरिताय सुरार्चिताय दारिद्र्य ॥ मुक्तेश्वराय फलदाय गणेश्वराय गीतप्रियाय वृषभेश्वरवाहनाय
    । मातङ्गचर्मवसनाय महेश्वराय दारिद्र्य ॥८ वसिष्ठेन कृतं स्तोत्रं सर्वरोगनिवारणम् । सर्वसंपत्करं शीघ्रं
    पुत्रपौत्राभिवर्धनम् । त्रिसन्ध्यं यः पठेन्नित्यं स हि स्वर्गमवाप्नुयात् ॥ ॥ इति श्रीवसिष्ठविरचितं
    दारिद्र्यहनस्तोत्रं सम्पूर्णम् ॥
