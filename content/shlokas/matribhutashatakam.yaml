id: matribhutashatakam
category: shataka
name:
  english: matribhutashatakam
  devanagari: मातृभूतशतकम्
content:
  english: viciparibhramaparishramanodanam me | akalpaya tvadabhiradhanaharshabhutam shrimatribhuta shiva
    palaya mam namaste || 59|| bhaktisprisho bhavati tasya na sharma tena tranavratashrutishu va na sakrit
    prapannah | kasmat karoshi karunam na mayi prapanne shrimatribhuta shiva palaya mam namaste || 60||
    yanmam na palayasi tattvadapatavadva yadva madiyaduritadvada natha nadyah | sarveshvaro nanu bhavanata
    eva nantyah shrimatribhuta shiva palaya mam namaste || 61|| vishvadhinetari vipannajanavanasthe nathe
    sati tvayi na yanmama khedabhangah | tatte yashoharamato vinivedayami shrimatribhuta shiva palaya
    mam namaste || 62|| asyodyatassamuparoddhumanatmaninam satyam bhavanaghaphalartyanubhavanasu | neshastu
    sodhumiyadasmyahamartabandhau shrimatribhuta shiva palaya mam namaste || 63|| amajjatah pratipadam
    vipadamburashau driptam mama shvasitumapyanadhishvarasya | kim pashyatastava daya na kiyan viḻambah
    shrimatribhuta shiva palaya mam namaste || 64|| svardhenavo na kati no kati kalpavrikshah bhruvashyatam
    na kati yantyapare'pyudarah | bhaktisprisham tvayi bhaje tamaham bhavantam shrimatribhuta shiva palaya
    mam namaste || 65|| enamupaplavabharairjatilamavastham praptam hi mam parihasanti nitantamanye | tvancenna
    pashyasi dayardradrisha gatih ka shrimatribhuta shiva palaya mam namaste || 66|| shrishashsharah kanakabhumisharashsharaso
    vasastu rupyashikhari dhanadassakha te | tvamashritasya mama kinna dhunoshi dainyam shrimatribhuta
    shiva palaya mam namaste || 67|| atyankurarnamukhakhedamaharnave'smin magnasya shankara mamottaranam
    prakalpya | tvadpujanam ghataya sankshapitantarayam shrimatribhuta shiva palaya mam namaste || 68||
    loke'tivartitumalam tava shasanam kah padmasano bhavatu padmavilocano va | taddurlipim vidhikritamapi
    me vilumpa shrimatribhuta shiva palaya mam namaste || 69|| nissaratamapi vidanvishayeshvamishu nissimasaktirahameshu
    hi gadhamudhah | rakshyastvayaiva karunanidhina prasahya shrimatribhuta shiva palaya mam namaste ||
    70|| mance tarangitamanitvishi pushpakalripte mandasmitam saha kada'mbikaya bhavantam | pashyami pashcimatanupahitopabarham
    shrimatribhuta shiva palaya mam namaste || 71|| mayyatmaninavimukhe malinasvabhave nirvedasagaranimajjanaviplave'smin
    | kasmad bhavasyakarunah karunanidhe tvam shrimatribhuta shiva palaya mam namaste || 72|| rudrakshabhridbhasitabhushanadhanyamurtih
    bhavam vahan pramuditam bhavadekatanam | kalam kshipeyamiti sadhaya kamanam me shrimatribhuta shiva
    palaya mam namaste || 73|| tvam cidghano'syahamasau jadimaikasima duhkhakarah punaraham sukhashevadhistvam
    | yukta na te sthitiriyam tava garbhavase shrimatribhuta shiva palaya mam namaste || 74|| khedam harishyasi
    kada shishiraih katakshaih modam karishyasi kada mridubhirvacobhih | ityutsuko'smi karunam kuru kinkare'smin
    shrimatribhuta shiva palaya mam namaste || 75|| pati prasahya na kimarbhakamatmaninam samyojakairgurujanah
    smara tam kramam tvam | bhaktim baladbhavati kalpaya me dayaḻo shrimatribhuta shiva palaya mam namaste
    || 76|| so'ham na kincidapi sadhu karomi papah tungam padam tvabhilashami tadapyalajjah | tvaddatritasadayatagarimavamarshi
    shrimatribhuta shiva palaya mam namaste || 77|| shakto na kashcidapi shasanamantara te kassevyatam
    tvaditarah kimitah phalam va | svaminnupaimi sharanam karanaistribhistvam shrimatribhuta shiva palaya
    mam namaste || 78|| mrityunjayo'si kamalapativallabho'si tanmrityudainyavipadorapadam tvadiyam | tvamashritasya
    mama kim sadrishi dasheyam shrimatribhuta shiva palaya mam namaste || 79|| kim jamita na bhavato mama
    duhkhadhara
  devanagari: वीचीपरिभ्रमपरिश्रमनोदनं मे । आकल्पय त्वदभिराधनहर्षभूतं श्रीमातृभूत शिव पालय मां नमस्ते ॥
    ५९॥ भक्तिस्पृशो भवति तस्य न शर्म तेन त्राणव्रताश्रुतिषु वा न सकृत् प्रपन्नः । कस्मात् करोषि करुणां
    न मयि प्रपन्ने श्रीमातृभूत शिव पालय मां नमस्ते ॥ ६०॥ यन्मां न पालयसि तत्त्वदपाटवाद्वा यद्वा मदीयदुरिताद्वद
    नाथ नाद्यः । सर्वेश्वरो ननु भवानत एव नान्त्यः श्रीमातृभूत शिव पालय मां नमस्ते ॥ ६१॥ विश्वाधिनेतरि
    विपन्नजनावनस्थे नाथे सति त्वयि न यन्मम खेदभङ्गः । तत्ते यशोहरमतो विनिवेदयामि श्रीमातृभूत शिव पालय
    मां नमस्ते ॥ ६२॥ अस्योद्यतस्समुपरोद्धुमनात्मनीनं सत्यं भवानघफलार्त्यनुभावनासु । नेशस्तु सोढुमियदस्म्यहमार्तबन्धौ
    श्रीमातृभूत शिव पालय मां नमस्ते ॥ ६३॥ आमज्जतः प्रतिपदं विपदम्बुराशौ दृप्तं मम श्वसितुमप्यनधीश्वरस्य
    । किं पश्यतस्तव दया न कियान् विळम्बः श्रीमातृभूत शिव पालय मां नमस्ते ॥ ६४॥ स्वर्धेनवो न कति नो कति
    कल्पवृक्षाः भ्रूवश्यतां न कति यान्त्यपरेऽप्युदाराः । भक्तिस्पृशां त्वयि भजे तमहं भवन्तं श्रीमातृभूत
    शिव पालय मां नमस्ते ॥ ६५॥ एनामुपप्लवभरैर्जटिलामवस्थां प्राप्तं हि मां परिहसन्ति नितान्तमन्ये । त्वञ्चेन्न
    पश्यसि दयार्द्रदृशा गतिः का श्रीमातृभूत शिव पालय मां नमस्ते ॥ ६६॥ श्रीशश्शरः कनकभूमिशरश्शरासो वासस्तु
    रूप्यशिखरी धनदस्सखा ते । त्वामाश्रितस्य मम किन्न धुनोषि दैन्यं श्रीमातृभूत शिव पालय मां नमस्ते ॥ ६७॥
    अत्यङ्कुरार्णमुखखेदमहार्णवेऽस्मिन् मग्नस्य शङ्कर ममोत्तरणं प्रकल्प्य । त्वद्पूजनं घटय सङ्क्षपितान्तरायं
    श्रीमातृभूत शिव पालय मां नमस्ते ॥ ६८॥ लोकेऽतिवर्तितुमलं तव शासनं कः पद्मासनो भवतु पद्मविलोचनो वा ।
    तद्दुर्लिपिं विधिकृतामपि मे विलुम्प श्रीमातृभूत शिव पालय मां नमस्ते ॥ ६९॥ निस्सारतामपि विदन्विषयेष्वमीषु
    निस्सीमसक्तिरहमेषु हि गाढमूढः । रक्ष्यस्त्वयैव करुणानिधिना प्रसह्य श्रीमातृभूत शिव पालय मां नमस्ते
    ॥ ७०॥ मञ्चे तरङ्गितमणित्विषि पुष्पकलृप्ते मन्दस्मितं सह कदाऽम्बिकया भवन्तम् । पश्यामि पश्चिमतनूपहितोपबर्हं
    श्रीमातृभूत शिव पालय मां नमस्ते ॥ ७१॥ मय्यात्मनीनविमुखे मलिनस्वभावे निर्वेदसागरनिमज्जनविप्लवेऽस्मिन्
    । कस्माद् भवस्यकरुणः करुणानिधे त्वं श्रीमातृभूत शिव पालय मां नमस्ते ॥ ७२॥ रुद्राक्षभृद्भसितभूषणधन्यमूर्तिः
    भावं वहन् प्रमुदितं भवदेकतानम् । कालं क्षिपेयमिति साधय कामनां मे श्रीमातृभूत शिव पालय मां नमस्ते ॥
    ७३॥ त्वं चिद्घनोऽस्यहमसौ जडिमैकसीमा दुःखाकरः पुनरहं सुखशेवधिस्त्वम् । युक्ता न ते स्थितिरियं तव गर्भवासे
    श्रीमातृभूत शिव पालय मां नमस्ते ॥ ७४॥ खेदं हरिष्यसि कदा शिशिरैः कटाक्षैः मोदं करिष्यसि कदा मृदुभिर्वचोभिः
    । इत्युत्सुकोऽस्मि करुणां कुरु किङ्करेऽस्मिन् श्रीमातृभूत शिव पालय मां नमस्ते ॥ ७५॥ पाति प्रसह्य न
    किमर्भकमात्मनीनं संयोजकैर्गुरुजनः स्मर तं क्रमं त्वम् । भक्तिं बलाद्भवति कल्पय मे दयाळो श्रीमातृभूत
    शिव पालय मां नमस्ते ॥ ७६॥ सोऽहं न किञ्चिदपि साधु करोमि पापः तुङ्गं पदं त्वभिलषामि तदप्यलज्जः । त्वद्दातृतासदयतागरिमावमर्शी
    श्रीमातृभूत शिव पालय मां नमस्ते ॥ ७७॥ शक्तो न कश्चिदपि शासनमन्तरा ते कस्सेव्यतां त्वदितरः किमितः फलं
    वा । स्वामिन्नुपैमि शरणं करणैस्त्रिभिस्त्वां श्रीमातृभूत शिव पालय मां नमस्ते ॥ ७८॥ मृत्युञ्जयोऽसि
    कमलापतिवल्लभोऽसि तन्मृत्युदैन्यविपदोरपदं त्वदीयम् । त्वामाश्रितस्य मम किं सदृशी दशेयं श्रीमातृभूत
    शिव पालय मां नमस्ते ॥ ७९॥ किं जामिता न भवतो मम दुःखधारा
