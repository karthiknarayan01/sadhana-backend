id: sarasvatidashashlokistotram
category: stotram
name:
  english: sarasvatidashashlokistotram
  devanagari: सरस्वतीदशश्लोकीस्तोत्रम्
content:
  english: rinvantu rishayah sarve guhyadguhyatamam mahat | dashashlokistutimimam vadami dhyanapurvakam
    || 2|| ankusham cakshasutram ca pasham pustam ca dharinim | muktaharaih samayuktam devim dhyayeccaturbhujam
    || 3|| sitena darpanabhena vaktrena paribhushitam | sustanim vedimadhyam tam candrardhakritashekharam
    || 4|| jatakalapasamyuktam purnacandranibhananam | trilocanim mahadevim svarnanupuradharinim || 5||
    katakasvarnaratnadhyamahavalayabhushitam | kambukanthim sutamroshtim sarvabharanabhushitam || 6||
    keyurairmekhaladyaishca dyotayantim jagattrayam | shabdabrahmaranim dhyayeddhyanakamah samahitah ||
    7|| vakshye sarasvatam stotram vakpravrittikaram shubham | lakshmivivardhanam caiva vivade vijayapradam
    || 8|| parabrahmatmikam devim bhuktimuktiphalapradam | pranamya staumi tameva jnanashaktim sarasvatim
    || 9|| ya vedantoktatattvaikasvarupa paramarthatah | namarupatmika vyakta sa mam patu sarasvati ||
    10|| ya sangopangavedeshu caturshvekaiva giyate | advaita brahmanah shaktih sa mam patu sarasvati
    || 11|| ya varnapadavakyarthasvarupenaiva vartate | anadinidhanananta sa mam patu sarasvati || 12||
    adhyatmamadhidevam ca devanam samyagishvari | pratyagatmeva santi ya sa mam patu sarasvati || 13||
    antaryamyatmana vishvam trailokyam ya niyacchati | rudradityadirupastha sa mam patu sarasvati || 14||
    ya pratyagdrishtibhirjnanairvyajyamananubhuyate | vyapini jnaptirupaika sa mam patu sarasvati || 15||
    namajatyadibhirbhedairashtadha ya vikalpita | nirvikalpatmika caiva sa mam patu sarasvati || 16||
    vyaktavyaktagirah sarve devadya vyaharanti yam | sarvakamadudha dhenuh sa mam patu sarasvati || 17||
    yam viditvakhilam bandham nirmathyamalavarmana | yogi yati param sthanam sa mam patu sarasvati ||
    18|| namajatyadikam sarvam yasyamavishya tam punah | dhyayanti brahmarupaika sa mam patu sarasvati
  devanagari: ृण्वन्तु ऋषयः सर्वे गुह्याद्गुह्यतमं महत् । दशश्लोकीस्तुतिमिमां वदामि ध्यानपूर्वकम् ॥ २॥
    अङ्कुशं चाक्षसूत्रं च पाशं पुस्तं च धारिणीम् । मुक्ताहारैः समायुक्तां देवीं ध्यायेच्चतुर्भुजाम् ॥
    ३॥ सितेन दर्पणाभेन वक्त्रेण परिभूषिताम् । सुस्तनीं वेदिमध्यां तां चन्द्रार्धकृतशेखराम् ॥ ४॥ जटाकलापसंयुक्तां
    पूर्णचन्द्रनिभाननाम् । त्रिलोचनीं महादेवीं स्वर्णनूपुरधारिणीम् ॥ ५॥ कटकस्वर्णरत्नाढ्यमहावलयभूषिताम्
    । कम्बुकण्ठीं सुताम्रोष्टीं सर्वाभरणभूषिताम् ॥ ६॥ केयूरैर्मेखलाद्यैश्च द्योतयन्तीं जगत्त्रयम् । शब्दब्रह्मारणिं
    ध्यायेद्ध्यानकामः समाहितः ॥ ७॥ वक्ष्ये सारस्वतं स्तोत्रं वाक्प्रवृत्तिकरं शुभम् । लक्ष्मीविवर्धनं
    चैव विवादे विजयप्रदम् ॥ ८॥ परब्रह्मात्मिकां देवीं भुक्तिमुक्तिफलप्रदाम् । प्रणम्य स्तौमि तामेव ज्ञानशक्तिं
    सरस्वतीम् ॥ ९॥ या वेदान्तोक्ततत्त्वैकस्वरूपा परमार्थतः । नामरूपात्मिका व्यक्ता सा मां पातु सरस्वती
    ॥ १०॥ या साङ्गोपाङ्गवेदेषु चतुर्ष्वेकैव गीयते । अद्वैता ब्रह्मणः शक्तिः सा मां पातु सरस्वती ॥ ११॥
    या वर्णपदवाक्यार्थस्वरूपेणैव वर्तते । अनादिनिधनानन्ता सा मां पातु सरस्वती ॥ १२॥ अध्यात्ममधिदेवं च
    देवानां सम्यगीश्वरी । प्रत्यगात्मेव सन्ती या सा मां पातु सरस्वती ॥ १३॥ अन्तर्याम्यात्मना विश्वं त्रैलोक्यं
    या नियच्छति । रूद्रादित्यादिरूपस्था सा मां पातु सरस्वती ॥ १४॥ या प्रत्यग्दृष्टिभिर्ज्ञानैर्व्यज्यमानानुभूयते
    । व्यापिनी ज्ञप्तिरूपैका सा मां पातु सरस्वती ॥ १५॥ नामजात्यादिभिर्भेदैरष्टधा या विकल्पिता । निर्विकल्पात्मिका
    चैव सा मां पातु सरस्वती ॥ १६॥ व्यक्ताव्यक्तगिरः सर्वे देवाद्या व्याहरन्ति याम् । सर्वकामदुधा धेनुः
    सा मां पातु सरस्वती ॥ १७॥ यां विदित्वाखिलं बन्धं निर्मथ्यामलवर्मना । योगी याति परं स्थानं सा मां पातु
    सरस्वती ॥ १८॥ नामजात्यादिकं सर्वं यस्यामाविश्य तां पुनः । ध्यायन्ती ब्रह्मरूपैका सा मां पातु सरस्वती
