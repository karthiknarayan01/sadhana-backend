id: krishnastavanam
category: shataka
name:
  english: krishnastavanam
  devanagari: कृष्णस्तवनम्
content:
  english: kasya kaveh kalacchrutaratnasanukampasya | tava samshrayegra padau shritacintaratnasanukampasya
    || 111|| iti shriramanandanamayuraviracitam shrikrishnastavanam sampurnam | tippani 1| yatha hamsa
    mauktikanam kavaleccadrita drishtastatha durjana iva bakah malina iva kakashca no drishta na drishtah
    ityanvayah | 2| upagatan sharanamiti padacchedah | 3| putanaya pavitraya | pavitrarthe putanashabdo
    na kutrapi drishtacarah | 4| yatha asati durjane sadhuh satamidyo bhavati na tatha sati satpurushe
    sadhurityanvayah | 5| vinatatanujo vainateyo vahah vahanam yasya tatsammuddhau | 6| pumartham purushartham
    dharmarthakamamokshakhyam | 7| aja he krishna | garasya vishasya nidhim | 8| tvapadasancaranena yamunamiva
    tvadvasatya me matimapadosham vigatadosham kada karta karishyasiti yojana | 9| sharatalpe patite kuruvare
    bhishme | 10| dhamom yudhishthirah | ahitairjanaih kauravaih | 11| vasudhadhara adya iti sambuddhistham
    padadvayam | 12| sudhadhara rugnamavitum rakshitum kshama na kimiti prashnah | kshamaivetyarthah |
    13| prithukanam prasatim | te upagatastvamupagata ityarthah | 14| navye rase sarve'pi baddhadara ityarthah
    | 15| shankhena gale sprishtva tvam dhruvakhyam valam dhruvam nishcitam stotumanasamakaroriti yojana
    | 16| svavamshena svavenunirgatena ravena rajitam jagadyena tatsambuddhau | sapekshatve'pi gamakatvatsamasah
    | 17| sa parijatah | 18| agam vriksham parijatamiti yavat | vyatirekena parijatadbhagavaneva shreshtha
    iti sucyate | 19| kricchre sankate | 20| sagadah satanka bhita ityarthah | 21| amritahastam dhanvantarimityarthah
    | 22| prabhuh shivah | vriko bhasmasurah | 23| khala eva shalabhastesham laye vinashe'nalasamamagnisadrisham
    | 24| ambu
  devanagari: कस्य कवेः कालाच्छ्रुतरत्नसानुकम्पस्य । तव संश्रयेग्र पादौ श्रितचिन्तारत्नसानुकम्पस्य ॥ १११॥
    इति श्रीरामनन्दनमयूरविरचितं श्रीकृष्णस्तवनं सम्पूर्णम् । टिप्पणि १। यथा हंसा मौक्तिकानां कवलेच्चादृता
    दृष्टास्तथा दुर्जना इव बकाः मलिना इव काकाश्च नो दृष्टा न दृष्टाः इत्यन्वयः । २। उपगतान् शरणमिति पदच्छेदः
    । ३। पूतनया पवित्रया । पवित्रार्थे पूतनशब्दो न कुत्रापि दृष्टचरः । ४। यथा असति दुर्जने साधुः सतामीड्यो
    भवति न तथा सति सत्पुरुषे साधुरित्यन्वयः । ५। विनतातनूजो वैनतेयो वाहः वाहनं यस्य तत्सम्मुद्धौ । ६।
    पुमर्थं पुरुषार्थं धर्मार्थकाममोक्षाख्यम् । ७। अज हे कृष्ण । गरस्य विषस्य निधिम् । ८। त्वपदसञ्चरणेन
    यमुनामिव त्वद्वसत्या मे मतिमपदोषां विगतदोषां कदा कर्ता करिष्यसीति योजना । ९। शरतल्पे पतिते कुरुवरे
    भीष्मे । १०। धमों युधिष्ठिरः । अहितैर्जनैः कौरवैः । ११। वसुधाधार आद्य इति सम्बुद्धिस्थं पदद्वयम् ।
    १२। सुधाधारा रुग्णमवितुं रक्षितुं क्षमा न किमिति प्रश्नः । क्षमैवेत्यर्थः । १३। पृथुकानां प्रसतिम्
    । ते उपगतस्त्वामुपगत इत्यर्थः । १४। नव्ये रसे सर्वेऽपि बद्धादरा इत्यर्थः । १५। शङ्खेन गले स्पृष्ट्वा
    त्वं ध्रुवाख्यं वालं ध्रुवं निश्चितं स्तोतुमनसमकरोरिति योजना । १६। स्ववंशेन स्ववेणुनिर्गतेन रवेण राजितं
    जगद्येन तत्सम्बुद्धौ । सापेक्षत्वेऽपि गमकत्वात्समासः । १७। स पारिजातः । १८। अगं वृक्षं पारिजातमिति
    यावत् । व्यतिरेकेण पारिजाताद्भगवानेव श्रेष्ठ इति सूच्यते । १९। कृच्छ्रे सङ्कटे । २०। सगदाः सातङ्का
    भीता इत्यर्थः । २१। अमृतहस्तं धन्वन्तरिमित्यर्थः । २२। प्रभुः शिवः । वृको भस्मासुरः । २३। खला एव शलभास्तेषां
    लये विनाशेऽनलसममग्निसदृशम् । २४। अम्बु
