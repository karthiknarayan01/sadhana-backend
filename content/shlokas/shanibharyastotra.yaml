id: shanibharyastotra
category: stotram
name:
  english: shanibharyastotra
  devanagari: शनिभार्यास्तोत्र
content:
  english: shanibharya evam shanistotram yah pura rajyabhrashtaya nalaya pradado kila | svapne shaurih
    svayam mantram sarvakamaphalapradam || 1|| krodam nilanjanaprakhyam nilajimutasannibham | chayamartandasambhutam
    namasyami shanaishcaram || 2|| om namo'rkaputraya shanaishcaraya niharavarnanjananilakaya | smritva
    rahasyam bhuvi manushatve phalaprado me bhava suryaputra || 3|| namo'stu pretarajaya krishnavarnaya
    te namah | shanaishcaraya kruraya siddhibuddhipradayine || 4|| ya ebhirnamabhih stauti tasya tushto
    bhavamyaham | mamakanam bhayam tasya svapneshvapi na jayate || 5|| gargeya kaushikasyapi pippalado
    mahamunih | shanaishcarakrita pida na bhavati kadacana || 6|| krodastu pingalo babhruh krishno raudro'ntako
    yamah | shaurih shanaishcaro mandah pippaladena samyutah || 7|| etani shaninamani pratarutthaya yah
    pathet | tasya shaureh krita pida na bhavati kadacana || 8|| dhvajani dhamani caiva kankali kalahapriya
    | kalahi kantaki capi aja mahishi turangama || 9|| namani shanibharyaya nityam japati yah puman |
    tasya duhkha vinashyanti sukhasaubhagyam vardhate || 10|| iti |
  devanagari: शनिभार्या एवम् शनिस्तोत्रम् यः पुरा राज्यभ्रष्टाय नलाय प्रददो किल । स्वप्ने शौरिः स्वयं
    मन्त्रं सर्वकामफलप्रदम् ॥ १॥ क्रोडं नीलाञ्जनप्रख्यं नीलजीमूतसन्निभम् । छायामार्तण्डसम्भूतं नमस्यामि
    शनैश्चरम् ॥ २॥ ॐ नमोऽर्कपुत्राय शनैश्चराय नीहारवर्णाञ्जननीलकाय । स्मृत्वा रहस्यं भुवि मानुषत्वे फलप्रदो
    मे भव सूर्यपुत्र ॥ ३॥ नमोऽस्तु प्रेतराजाय कृष्णवर्णाय ते नमः । शनैश्चराय क्रूराय सिद्धिबुद्धिप्रदायिने
    ॥ ४॥ य एभिर्नामभिः स्तौति तस्य तुष्टो भवाम्यहम् । मामकानां भयं तस्य स्वप्नेष्वपि न जायते ॥ ५॥ गार्गेय
    कौशिकस्यापि पिप्पलादो महामुनिः । शनैश्चरकृता पीडा न भवति कदाचन ॥ ६॥ क्रोडस्तु पिङ्गलो बभ्रुः कृष्णो
    रौद्रोऽन्तको यमः । शौरिः शनैश्चरो मन्दः पिप्पलादेन संयुतः ॥ ७॥ एतानि शनिनामानि प्रातरुत्थाय यः पठेत्
    । तस्य शौरेः कृता पीडा न भवति कदाचन ॥ ८॥ ध्वजनी धामनी चैव कङ्काली कलहप्रिया । कलही कण्टकी चापि अजा
    महिषी तुरङ्गमा ॥ ९॥ नामानि शनिभार्याया नित्यं जपति यः पुमान् । तस्य दुःखा विनश्यन्ति सुखसौभाग्यं वर्धते
    ॥ १०॥ इति ।
