id: bhagyasuktam-athava-pratahsuktam-rigveda-7-41-8-47-10-164-05
category: sukta
name:
  english: bhagyasuktam athava pratahsuktam (rigveda 7|41, 8|47, 10|164|05)
  devanagari: भाग्यसूक्तम् अथवा प्रातःसूक्तम् (ऋग्वेद ७।४१, ८।४७, १०।१६४।०५)
content:
  english: 5 pancamah | ajai̭shma̱dyasa̭nama̱ cabhu̱mana̭gaso va̱yam | ja̱gra̱tsva̱pnah sa̭mka̱lpah pa̱po
    yam dvi̱shmastam sa ri̭cchatu̱ yo no̱ dveshti̱ tamri̭cchatu || 10
  devanagari: ५ पञ्चमः । अजै॑ष्मा॒द्यास॑नाम॒ चाभू॒माना॑गसो व॒यम् । जा॒ग्र॒त्स्व॒प्नः सं॑क॒ल्पः पा॒पो यं
    द्वि॒ष्मस्तं स ऋ॑च्छतु॒ यो नो॒ द्वेष्टि॒ तमृ॑च्छतु ॥ १०
