    द्रूणा॒नोऽस्ता॑सि॒ विध्य॑ र॒क्षस॒स्तपि॑ष्ठैः। तव॑ भ्र॒मास॑ आशु॒या प॑त॒न्त्यनु॑ स्पृश धृष॒ता शोशु॑चानः।
    तपू ॑ष्यग्ने जु॒ह्वा॑ पत॒ङ्गानस॑न्दितो॒ वि सृ॑ज॒ विष्व॑गु॒ल्काः। प्रति॒ स्पशो॒ वि सृ॑ज॒ तूर्णि॑तमो॒
    भवा॑ पा॒युर्वि॒शो अ॒स्या अद॑ब्धः। यो नो॑ दू॒रे अ॒घश ॑सो॒ यो अन्त्यग्ने॒ माकि॑ष्टे॒ व्यथि॒रा द॑धर्षीत्॥१॥
