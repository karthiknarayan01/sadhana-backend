id: varahasahasranamastotram
category: sahasranama
name:
  english: varahasahasranamastotram
  devanagari: वराहसहस्रनामस्तोत्रम्
content:
  english: hah sadagatih | suryashcandrah kujo jnashca devamantri bhriguh shanih || 38|| rahuh keturgrahapatiryajnabhridyajnasadhanah
    | sahasrapatsahasrakshah somakantah sudhakarah || 39|| yajno yajnapatiryaji yajnango yajnavahanah
    | yajnantakridyajnaguhyo yajnakridyajnasadhakah || 40|| idagarbhah sravatkarno yajnakarmaphalapradah
    | gopatih shripatirghonastrikalajnah shucishravah || 41|| shivah shivatarah shurah shivapreshthah
    shivarcitah | shuddhasattvah surartighnah kshetrajno'kshara adikrit || 42|| shankhi cakri gadi khadgi
    padmi candaparakramah candah kolahalah sharngi svayambhuragryabhugvibhuh || 43|| sadacarah sadarambho
    duracaranivartakah | jnani jnanapriyo'vajno jnanado'jnanado yami || 44|| layodakavihari ca samaganapriyo
    gatih | yajnamurtistrilokeshastridhama kaustubhojjvalah || 46|| shrivatsalanchanah shrimanshridharo
    bhudharo'rbhakah | varuno varuno vriksho vrishabho vardhano varah || 47|| yugadikridyugavartah paksho
    masa rituryugah | vatsaro vatsalo vedah shipivishtah sanatanah || 48|| indratrata bhayatrata kshudrakritkshudranashanah
    | mahahanurmahaghoro mahadiptirmahavratah || 49|| mahapado mahakalo mahakayo mahabalah | gambhiraghosho
    gambhiro gabhiro ghurghurasvanah || 50|| onkaragarbho nyagrodho vashatkaro hutashanah | bhuyanbahumato
    bhuma vishvakarma vishampatih || 51|| vyavasayo'ghamarshashca vidito'bhyutthito mahah | balabidbalavandandi
    vakradamshtro vasho vashi || 52|| siddhah siddhipradah sadhyah siddhasankalpa urjavan | dhritarirasahayashca
    sumukho badavamukhah || 53|| vasurvasumanah samashariro vasudhapradah | pitambari vasudevo vamano
    jnanapanjarah || 54|| nityatripto niradharo nihsango nirjitamarah | nityamukto nityavandyo muktavandyo
    murantakah || 55|| bandhako mocako rudro yuddhasenavimardanah | prasarano nishedhatma bhikshurbhikshupriyo
    rijuh || 56|| mahahamso bhikshurupi mahakando mahashanah | manojavah kalakalah kalamrityuh sabhajitah
    || 57|| prasanno nirvibhavashca bhuvidari durasadah | vasano vasavo vishvavasavo vasavapriyah || 58||
    siddhayogi siddhakamah siddhikamah shubharthavit | ajeyo vijayindrashca visheshajno vibhavasuh ||
    59|| ikshamatrajagatsrashta bhrubhanganiyatakhilah | mahadhvago digishesho munimanyo munishvarah ||
    60|| mahakayo vajrakayo varado vayuvahanah | vadanyo vajrabhedi ca madhuhritkalidoshaha || 61|| vagishvaro
    vajasano vanaspatyo manoramah | subrahmanyo brahmadhano brahmanyo brahmavardhanah || 62|| vishtambhi
    vishvahastashca vishvaho vishvatomukhah | atulo vasuvego'rkah samrat samrajyadayakah || 63|| shaktipriyah
    shaktirupo marashaktivibhanjanah | svatantrah sarvatantrajno mimamsitagunakarah || 64|| anirdeshyavapuh
    shrisho nityashrirnityamangalah | nityotsavo nijanando nityabhedi nirashrayah || 65|| antashcaro bhavadhisho
    brahmayogi kalapriyah | gobrahmanahitacaro jagaddhitamahavratah || 66|| durdhyeyashca sadadhyeyo durvasadivibodhanah
    | durapo durdhiyam gopyo duraddurah samipagah || 67|| vrishakapih kapih karyah karanah karanakramah
    | jyotisham mathanajyotih jyotishcakrapravartakah || 68|| prathamo madhyamastarah sutikshnodarkakaryavan
    | surupashca sadavetta sumukhah sujanapriyah || 69|| mahavyakaranacaryah shikshakalpapravartakah |
    svacchashchandomayah svecchasvahitarthavinashanah || 70|| sahasi sarvahanta ca sammato'nindito'sakrit
    | kamarupah kamapalah sutirthyo'tha kshapakarah || 71|| jvali vishalashca paro vedakrijjanavardhanah
    | vedyo vaidyo mahavedi viraha vishamo mahah || 72|| itibhanurgrahashcaiva pragraho nigraho'gniha
    | utsargah sannishedhashca supratapah pratapadhrit || 73|| sarvayudhadharah shalah surupah sapramodanah
    | catushkishkuh saptapadah simhaskandhastrimekhalah || 74|| sudhapanarato'righnah suramedyah sulocanah
    | tattvavittattvagopta ca paratattvam prajagarah || 75|| ishana ishvaro'dhyakshe mahameruramoghadrik
    | bhedaprabhedavadi ca svadvaitaparinishthitah || 76|| bhagahari vamshakaro nimittastho nimittakrit
    | niyanta niyamo yanta nandako nandivardhanah || 77|| shadvimshako mahavishnurbrahmajno brahmatatparah
    | vedakrinnama canantanama shabdatigah kripah || 78|| dambho dambhakaro dambhavamsho vamshakaro varah
    | ajanirjanikarta ca suradhyakshe yugantakah || 79|| darbharoma budhadhyakshe manukulo madoddhatah
    | shantanuh shankarah sukshmah pratyayashcandashasanah || 80|| vrittanaso mahagrivah kumbugrivo mahanrinah
    | vedavyaso devabhutirantaratma hridalayah || 81|| mahabhago mahasparsho mahamatro mahamanah | mahodaro
    mahoshthashca mahajihvo mahamukhah || 82|| pushkarastumburuh kheti sthavarah sthitimattarah | shvasayudhah
    samarthashca vedarthah susamahitah || 83|| vedashirshah prakashatma pramodah samagayanah | antarbhavyo
    bhavitatma mahidaso divaspatih || 84|| mahasudarshano vidvanupaharapriyo'cyutah | analo dvishapho
    guptah shobhano niravagrahah || 85|| bhashakaro mahabhargah sarvadeshavibhagakrit | kalakantho mahakesho
    lomashah kalapujitah || 86|| asevano'vasanatma buddhyatma raktalocanah | narango narakoddharta kshetrapalo
    durishtaha || 87|| hunkaragarbho digvasah brahmendradhipatirbalah | varcasvi brahmavadanah kshatrabahurviduragah
    || 88|| caturthapaccatushpacca caturvedapravartakah | caturhotrakridavyaktah sarvavarnavibhagakrit
    || 89|| mahapatirgrihapatirvidyadhisho vishampatih | aksharo'dhokshajo'dhurto rakshita rakshasantakrit
    || 90|| rajahsattvatamohanta kutasthah prakriteh parah | tirthakrittirthavasi ca tirtharupo hyapam
    patih || 91|| punyabijah puranarshih pavitrah paramotsavah | shuddhikricchuddhidah shuddhah shuddhasattvanirupakah
    || 92|| suprasannah shubharho'tha shubhaditsuh shubhapriyah | yajnabhagabhujam mukhyo yakshaganapriyo
    bali || 93|| samo'tha modo modatma modado mokshadasmritih | parayanah prasadashca lokabandhurbrihaspatih
    || 94|| lilavataro jananavihino janmanashanah | mahabhimo mahagarto maheshvaso mahodayah || 95|| arjuno
    bhasurah prakhyo vidosho vishtarashravah | sahasrapatsabhagyashca punyapako duravyayah || 96|| krityahino
    mahavagmi mahapapavinigrahah | tejo'pahari balavan sarvada'rividushakah || 97|| kavih kanthagatih
    koshtho manimuktajalaplutah | aprameyagatih krishno hamsashcaiva shucipriyah || 98|| vijayindrah surendrashca
    vagindro vakpatih prabhuh | tirashcinagatih shuklah saragrivo dharadharah || 99|| prabhatah sarvatobhadro
    mahajanturmahaushadhih | pranesho vardhakastivrapraveshah parvatopamah || 100|| sudhasiktah sadasyastho
    rajarat dandakantakah | urdhvakesho'jamidhashca pippalado bahushravah || 101|| gandharvo'bhyuditah
    keshi virapesho visharadah | hiranyavasah stabdhaksho brahmalalitashaishavah || 102|| padmagarbho
    jambumali suryamandalamadhyagah | candramandalamadhyasthah karabhagagnisamshrayah || 103|| ajigartah
    shakalagryah sandhanah simhavikramah | prabhavatma jagatkalah kalakalo brihadrathah || 104|| sarango
    yatamanyashca satkritih shucimandalah | kumarajidvanecari saptakanyamanoramah || 105|| dhumaketurmahaketuh
    pakshiketuh prajapatih | urdhvareta balopayo bhutavartah sajangamah || 106|| ravirvayurvidhata ca
    siddhanto nishcalo'calah | asthanakridameyatma'nukulashcadhiko bhuvah || 107|| hrasvah pitamaho'narthah
    kalaviryo vrikodarah | sahishnuh sahadevashca sarvajicchatrutapanah || 108|| pancaratraparo hamsi
    pancabhutapravartakah | bhurishravah shikhandi ca suyajnah satyaghoshanah || 109|| pragadhah pravano
    hari pramanam pranavo nidhih | mahopanishado vak ca vedanidah kiritadhrit || 110|| bhavarogabhishagbhavo
    bhavasadhyo bhavatigah | shad dharmavarjitah keshi karyavitkarmagocarah || 111|| yamavidhvamsanah
    pashi yamivarganishevitah | matango mecako medhyo medhavi sarvamelakah || 112|| manojnadrishtirmararinigrahah
    kamalakarah | namadganesho gopidah santanah santatipradah || 113|| bahuprado baladhyakshe bhinnamaryadabhedanah
    | anirmuktashcarudeshnah satyashadhah suradhipah || 114|| avedaniyo'vedyashca taranastaruno'runah
    | sarvalakshanalakshanyah sarvalokavilakshanah || 115|| sarvadakshah sudhadhishah sharanyah shantavigrahah
    | rohinisho varahashca vyaktavyaktasvarupadhrit || 116|| svargadvarah sukhadvaro mokshadvarastrivishtapah
    | advitiyah kevalashca kaivalyapatirarhanah || 117|| talapakshastalakaro yantri tantravibhedanah |
    shadrasah kusumastrashca satyamulaphalodayah || 118|| kala kashtha muhurtashca manibimbo jagaddhrinih
    | abhayo rudragitashca gunajidgunabhedanah ||119|| devasuravinirmata devasuraniyamakah | prarambhashca
    viramashca samrajyadhipatih prabhuh ||120|| pandito gahanarambhah jivano jivanapradah | raktadevo
    devamulah vedamulo manahpriyah ||121|| viracanah sudhajatah svargadhyaksho mahakapih | viradrupah
    prajarupah sarvadevashikhamanih ||122|| bhagavan sumukhah svargah manjukeshah sutundilah | vanamali
    gandhamali muktamalyacalopamah ||123|| mukto'sripyah suhridbhrata pita mata para gatih | satvadhvanih
    sadabandhurbrahmarudradhidaivatam ||124|| samatma sarvadah sankhyah sanmargadhyeyasatpadah | sasankalpo
    vikalpashca karta svadi tapodhanah ||125|| viraja virajanathah svacchasha
  devanagari: हः सदागतिः । सूर्यश्चन्द्रः कुजो ज्ञश्च देवमन्त्री भृगुः शनिः ॥ ३८॥ राहुः केतुर्ग्रहपतिर्यज्ञभृद्यज्ञसाधनः
    । सहस्रपात्सहस्राक्षः सोमकान्तः सुधाकरः ॥ ३९॥ यज्ञो यज्ञपतिर्याजी यज्ञाङ्गो यज्ञवाहनः । यज्ञान्तकृद्यज्ञगुह्यो
    यज्ञकृद्यज्ञसाधकः ॥ ४०॥ इडागर्भः स्रवत्कर्णो यज्ञकर्मफलप्रदः । गोपतिः श्रीपतिर्घोणस्त्रिकालज्ञः शुचिश्रवाः
    ॥ ४१॥ शिवः शिवतरः शूरः शिवप्रेष्ठः शिवार्चितः । शुद्धसत्त्वः सुरार्तिघ्नः क्षेत्रज्ञोऽक्षर आदिकृत्
    ॥ ४२॥ शङ्खी चक्री गदी खड्गी पद्मी चण्डपराक्रमः चण्डः कोलाहलः शार्ङ्गी स्वयम्भूरग्र्यभुग्विभुः ॥ ४३॥
    सदाचारः सदारम्भो दुराचारनिवर्तकः । ज्ञानी ज्ञानप्रियोऽवज्ञो ज्ञानदोऽज्ञानदो यमी ॥ ४४॥ लयोदकविहारी
    च सामगानप्रियो गतिः । यज्ञमूर्तिस्त्रिलोकेशस्त्रिधामा कौस्तुभोज्ज्वलः ॥ ४६॥ श्रीवत्सलाञ्छनः श्रीमान्श्रीधरो
    भूधरोऽर्भकः । वरुणो वारुणो वृक्षो वृषभो वर्धनो वरः ॥ ४७॥ युगादिकृद्युगावर्तः पक्षो मास ऋतुर्युगः ।
    वत्सरो वत्सलो वेदः शिपिविष्टः सनातनः ॥ ४८॥ इन्द्रत्राता भयत्राता क्षुद्रकृत्क्षुद्रनाशनः । महाहनुर्महाघोरो
    महादीप्तिर्महाव्रतः ॥ ४९॥ महापादो महाकालो महाकायो महाबलः । गम्भीरघोषो गम्भीरो गभीरो घुर्घुरस्वनः ॥
    ५०॥ ओङ्कारगर्भो न्यग्रोधो वषट्कारो हुताशनः । भूयान्बहुमतो भूमा विश्वकर्मा विशाम्पतिः ॥ ५१॥ व्यवसायोऽघमर्षश्च
    विदितोऽभ्युत्थितो महः । बलबिद्बलवान्दण्डी वक्रदंष्ट्रो वशो वशी ॥ ५२॥ सिद्धः सिद्धिप्रदः साध्यः सिद्धसङ्कल्प
    ऊर्जवान् । धृतारिरसहायश्च सुमुखो बडवामुखः ॥ ५३॥ वसुर्वसुमनाः सामशरीरो वसुधाप्रदः । पीताम्बरी वासुदेवो
    वामनो ज्ञानपञ्जरः ॥ ५४॥ नित्यतृप्तो निराधारो निःसङ्गो निर्जितामरः । नित्यमुक्तो नित्यवन्द्यो मुक्तवन्द्यो
    मुरान्तकः ॥ ५५॥ बन्धको मोचको रुद्रो युद्धसेनाविमर्दनः । प्रसारणो निषेधात्मा भिक्षुर्भिक्षुप्रियो ऋजुः
    ॥ ५६॥ महाहंसो भिक्षुरूपी महाकन्दो महाशनः । मनोजवः कालकालः कालमृत्युः सभाजितः ॥ ५७॥ प्रसन्नो निर्विभावश्च
    भूविदारी दुरासदः । वसनो वासवो विश्ववासवो वासवप्रियः ॥ ५८॥ सिद्धयोगी सिद्धकामः सिद्धिकामः शुभार्थवित्
    । अजेयो विजयीन्द्रश्च विशेषज्ञो विभावसुः ॥ ५९॥ ईक्षामात्रजगत्स्रष्टा भ्रूभङ्गनियताखिलः । महाध्वगो
    दिगीशेशो मुनिमान्यो मुनीश्वरः ॥ ६०॥ महाकायो वज्रकायो वरदो वायुवाहनः । वदान्यो वज्रभेदी च मधुहृत्कलिदोषहा
    ॥ ६१॥ वागीश्वरो वाजसनो वानस्पत्यो मनोरमः । सुब्रह्मण्यो ब्रह्मधनो ब्रह्मण्यो ब्रह्मवर्धनः ॥ ६२॥ विष्टम्भी
    विश्वहस्तश्च विश्वाहो विश्वतोमुखः । अतुलो वसुवेगोऽर्कः सम्राट् साम्राज्यदायकः ॥ ६३॥ शक्तिप्रियः शक्तिरूपो
    मारशक्तिविभञ्जनः । स्वतन्त्रः सर्वतन्त्रज्ञो मीमांसितगुणाकरः ॥ ६४॥ अनिर्देश्यवपुः श्रीशो नित्यश्रीर्नित्यमङ्गलः
    । नित्योत्सवो निजानन्दो नित्यभेदी निराश्रयः ॥ ६५॥ अन्तश्चरो भवाधीशो ब्रह्मयोगी कलाप्रियः । गोब्राह्मणहिताचारो
    जगद्धितमहाव्रतः ॥ ६६॥ दुर्ध्येयश्च सदाध्येयो दुर्वासादिविबोधनः । दुरापो दुर्धियां गोप्यो दूराद्दूरः
    समीपगः ॥ ६७॥ वृषाकपिः कपिः कार्यः कारणः कारणक्रमः । ज्योतिषां मथनज्योतिः ज्योतिश्चक्रप्रवर्तकः ॥ ६८॥
    प्रथमो मध्यमस्तारः सुतीक्ष्णोदर्ककार्यवान् । सुरूपश्च सदावेत्ता सुमुखः सुजनप्रियः ॥ ६९॥ महाव्याकरणाचार्यः
    शिक्षाकल्पप्रवर्तकः । स्वच्छश्छन्दोमयः स्वेच्छास्वाहितार्थविनाशनः ॥ ७०॥ साहसी सर्वहन्ता च सम्मतोऽनिन्दितोऽसकृत्
    । कामरूपः कामपालः सुतीर्थ्योऽथ क्षपाकरः ॥ ७१॥ ज्वाली विशालश्च परो वेदकृज्जनवर्धनः । वेद्यो वैद्यो
    महावेदी वीरहा विषमो महः ॥ ७२॥ ईतिभानुर्ग्रहश्चैव प्रग्रहो निग्रहोऽग्निहा । उत्सर्गः सन्निषेधश्च सुप्रतापः
    प्रतापधृत् ॥ ७३॥ सर्वायुधधरः शालः सुरूपः सप्रमोदनः । चतुष्किष्कुः सप्तपादः सिंहस्कन्धस्त्रिमेखलः ॥
    ७४॥ सुधापानरतोऽरिघ्नः सुरमेड्यः सुलोचनः । तत्त्ववित्तत्त्वगोप्ता च परतत्त्वं प्रजागरः ॥ ७५॥ ईशान ईश्वरोऽध्यक्षे
    महामेरुरमोघदृक् । भेदप्रभेदवादी च स्वाद्वैतपरिनिष्ठितः ॥ ७६॥ भागहारी वंशकरो निमित्तस्थो निमित्तकृत्
    । नियन्ता नियमो यन्ता नन्दको नन्दिवर्धनः ॥ ७७॥ षड्विंशको महाविष्णुर्ब्रह्मज्ञो ब्रह्मतत्परः । वेदकृन्नाम
    चानन्तनामा शब्दातिगः कृपः ॥ ७८॥ दम्भो दम्भकरो दम्भवंशो वंशकरो वरः । अजनिर्जनिकर्ता च सुराध्यक्षे युगान्तकः
    ॥ ७९॥ दर्भरोमा बुधाध्यक्षे मानुकूलो मदोद्धतः । शन्तनुः शङ्करः सूक्ष्मः प्रत्ययश्चण्डशासनः ॥ ८०॥ वृत्तनासो
    महाग्रीवः कुम्बुग्रीवो महानृणः । वेदव्यासो देवभूतिरन्तरात्मा हृदालयः ॥ ८१॥ महाभागो महास्पर्शो महामात्रो
    महामनाः । महोदरो महोष्ठश्च महाजिह्वो महामुखः ॥ ८२॥ पुष्करस्तुम्बुरुः खेटी स्थावरः स्थितिमत्तरः । श्वासायुधः
    समर्थश्च वेदार्थः सुसमाहितः ॥ ८३॥ वेदशीर्षः प्रकाशात्मा प्रमोदः सामगायनः । अन्तर्भाव्यो भावितात्मा
    महीदासो दिवस्पतिः ॥ ८४॥ महासुदर्शनो विद्वानुपहारप्रियोऽच्युतः । अनलो द्विशफो गुप्तः शोभनो निरवग्रहः
    ॥ ८५॥ भाषाकरो महाभर्गः सर्वदेशविभागकृत् । कालकण्ठो महाकेशो लोमशः कालपूजितः ॥ ८६॥ आसेवनोऽवसानात्मा
    बुद्ध्यात्मा रक्तलोचनः । नारङ्गो नरकोद्धर्ता क्षेत्रपालो दुरिष्टहा ॥ ८७॥ हुङ्कारगर्भो दिग्वासाः ब्रह्मेन्द्राधिपतिर्बलः
    । वर्चस्वी ब्रह्मवदनः क्षत्रबाहुर्विदूरगः ॥ ८८॥ चतुर्थपाच्चतुष्पाच्च चतुर्वेदप्रवर्तकः । चातुर्होत्रकृदव्यक्तः
    सर्ववर्णविभागकृत् ॥ ८९॥ महापतिर्गृहपतिर्विद्याधीशो विशाम्पतिः । अक्षरोऽधोक्षजोऽधूर्तो रक्षिता राक्षसान्तकृत्
    ॥ ९०॥ रजःसत्त्वतमोहान्ता कूटस्थः प्रकृतेः परः । तीर्थकृत्तीर्थवासी च तीर्थरूपो ह्यपां पतिः ॥ ९१॥ पुण्यबीजः
    पुराणर्षिः पवित्रः परमोत्सवः । शुद्धिकृच्छुद्धिदः शुद्धः शुद्धसत्त्वनिरूपकः ॥ ९२॥ सुप्रसन्नः शुभार्होऽथ
    शुभदित्सुः शुभप्रियः । यज्ञभागभुजां मुख्यो यक्षगानप्रियो बली ॥ ९३॥ समोऽथ मोदो मोदात्मा मोददो मोक्षदस्मृतिः
    । परायणः प्रसादश्च लोकबन्धुर्बृहस्पतिः ॥ ९४॥ लीलावतारो जननविहीनो जन्मनाशनः । महाभीमो महागर्तो महेष्वासो
    महोदयः ॥ ९५॥ अर्जुनो भासुरः प्रख्यो विदोषो विष्टरश्रवाः । सहस्रपात्सभाग्यश्च पुण्यपाको दुरव्ययः ॥
    ९६॥ कृत्यहीनो महावाग्मी महापापविनिग्रहः । तेजोऽपहारी बलवान् सर्वदाऽरिविदूषकः ॥ ९७॥ कविः कण्ठगतिः कोष्ठो
    मणिमुक्ताजलाप्लुतः । अप्रमेयगतिः कृष्णो हंसश्चैव शुचिप्रियः ॥ ९८॥ विजयीन्द्रः सुरेन्द्रश्च वागिन्द्रो
    वाक्पतिः प्रभुः । तिरश्चीनगतिः शुक्लः सारग्रीवो धराधरः ॥ ९९॥ प्रभातः सर्वतोभद्रो महाजन्तुर्महौषधिः
    । प्राणेशो वर्धकस्तीव्रप्रवेशः पर्वतोपमः ॥ १००॥ सुधासिक्तः सदस्यस्थो राजराट् दण्डकान्तकः । ऊर्ध्वकेशोऽजमीढश्च
    पिप्पलादो बहुश्रवाः ॥ १०१॥ गन्धर्वोऽभ्युदितः केशी वीरपेशो विशारदः । हिरण्यवासाः स्तब्धाक्षो ब्रह्मलालितशैशवः
    ॥ १०२॥ पद्मगर्भो जम्बुमाली सूर्यमण्डलमध्यगः । चन्द्रमण्डलमध्यस्थः करभागग्निसंश्रयः ॥ १०३॥ अजीगर्तः
    शाकलाग्र्यः सन्धानः सिंहविक्रमः । प्रभावात्मा जगत्कालः कालकालो बृहद्रथः ॥ १०४॥ साराङ्गो यतमान्यश्च
    सत्कृतिः शुचिमण्डलः । कुमारजिद्वनेचारी सप्तकन्यामनोरमः ॥ १०५॥ धूमकेतुर्महाकेतुः पक्षिकेतुः प्रजापतिः
    । ऊर्ध्वरेता बलोपायो भूतावर्तः सजङ्गमः ॥ १०६॥ रविर्वायुर्विधाता च सिद्धान्तो निश्चलोऽचलः । आस्थानकृदमेयात्माऽनुकूलश्चाधिको
    भुवः ॥ १०७॥ ह्रस्वः पितामहोऽनर्थः कालवीर्यो वृकोदरः । सहिष्णुः सहदेवश्च सर्वजिच्छात्रुतापनः ॥ १०८॥
    पाञ्चरात्रपरो हंसी पञ्चभूतप्रवर्तकः । भूरिश्रवाः शिखण्डी च सुयज्ञः सत्यघोषणः ॥ १०९॥ प्रगाढः प्रवणो
    हारी प्रमाणं प्रणवो निधिः । महोपनिषदो वाक् च वेदनीडः किरीटधृत् ॥ ११०॥ भवरोगभिषग्भावो भावसाढ्यो भवातिगः
    । षड् धर्मवर्जितः केशी कार्यवित्कर्मगोचरः ॥ १११॥ यमविध्वंसनः पाशी यमिवर्गनिषेवितः । मतङ्गो मेचको मेध्यो
    मेधावी सर्वमेलकः ॥ ११२॥ मनोज्ञदृष्टिर्मारारिनिग्रहः कमलाकरः । नमद्गणेशो गोपीडः सन्तानः सन्ततिप्रदः
    ॥ ११३॥ बहुप्रदो बलाध्यक्षे भिन्नमर्यादभेदनः । अनिर्मुक्तश्चारुदेष्णः सत्याषाढः सुराधिपः ॥ ११४॥ आवेदनीयोऽवेद्यश्च
    तारणस्तरुणोऽरुणः । सर्वलक्षणलक्षण्यः सर्वलोकविलक्षणः ॥ ११५॥ सर्वदक्षः सुधाधीशः शरण्यः शान्तविग्रहः
    । रोहिणीशो वराहश्च व्यक्ताव्यक्तस्वरूपधृत् ॥ ११६॥ स्वर्गद्वारः सुखद्वारो मोक्षद्वारस्त्रिविष्टपः ।
    अद्वितीयः केवलश्च कैवल्यपतिरर्हणः ॥ ११७॥ तालपक्षस्तालकरो यन्त्री तन्त्रविभेदनः । षड्रसः कुसुमास्त्रश्च
    सत्यमूलफलोदयः ॥ ११८॥ कला काष्ठा मुहूर्तश्च मणिबिम्बो जगद्धृणिः । अभयो रुद्रगीतश्च गुणजिद्गुणभेदनः
    ॥११९॥ देवासुरविनिर्माता देवासुरनियामकः । प्रारम्भश्च विरामश्च साम्राज्याधिपतिः प्रभुः ॥१२०॥ पण्डितो
    गहनारम्भः जीवनो जीवनप्रदः । रक्तदेवो देवमूलः वेदमूलो मनःप्रियः ॥१२१॥ विराचनः सुधाजातः स्वर्गाध्यक्षो
    महाकपिः । विराड्रूपः प्रजारूपः सर्वदेवशिखामणिः ॥१२२॥ भगवान् सुमुखः स्वर्गः मञ्जुकेशः सुतुन्दिलः ।
    वनमाली गन्धमाली मुक्तामाल्यचलोपमः ॥१२३॥ मुक्तोऽसृप्यः सुहृद्भ्राता पिता माता परा गतिः । सत्वध्वनिः
    सदाबन्धुर्ब्रह्मरुद्राधिदैवतम् ॥१२४॥ समात्मा सर्वदः साङ्ख्यः सन्मार्गध्येयसत्पदः । ससङ्कल्पो विकल्पश्च
    कर्ता स्वादी तपोधनः ॥१२५॥ विरजा विरजानाथः स्वच्छश
