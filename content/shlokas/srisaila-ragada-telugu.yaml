id: srisaila-ragada-telugu
category: stotram
name:
  english: Srisaila Ragada (Telugu)
content:
  english: shriramyambuga shrigiri yatraku kurimi satito kudi nadacitini pallèlu puramulu pattanambulu
    petalu datiti adavulu kòndalu anni datiti kantini shrigiri kannula ninda vintini mahimalu vinula ninda
    a mahimalu nenemani cèppadu i mahilopala ènnadu cudamu dharuni lopala dhautacalamadi meruni kantènu
    mikkuta mainadi brahma nirmala brahishringambulu nirmalamagu manikya kutamulu kotalu kòmmalu gopurambulu
    tèṟapileni bahu devalayamulu punya sthalambulu punya vanambulu vatamaina pudotalu mikkili matalu nercina
    manci mrigambulu kamadhenuvulu kalpavrikshamulu kshema karambagu cintamanulu amrita gundambulu kadu
    naishthikamunu kaligina viprulu viduvaka shambhuni vedèti rajulu santata lingarcana gala shaivulu
    shantulaina vedantulu siddhulu ganagana mrogèti ghantanadamulu vijaya ghoshayagu shankha nadamulu
    vira shaivulu virangambulu sadhu brindamulu kamita bhaktulu agaru dhupamulu japamulu cesèti jangamottamulu
    tapamulu cesèti tapasottamulu pramathulu bhaktulu shaiva ganambulu gattiga idi bhukailasammani tappipoka
    patala gangalo tèppuna telucu tirthambaducu cèlagucu madi vastrambulu kattiti anuvuga nuduta vibhuti
    dharistini pòlupuga mèda rudrakshalu dalciti guru katakshamunu gopyamu cesiti guru mantrambunu japamunu
    cesiti akalankudanai asha jayistini shiva pancakshari manasuna nilipiti shiva tattvamu parishilana
    cesiti pancendriyambulu padilamu cesiti panca mudralabhyasamu cesiti antarmukhudanaitini nadabrahma
    nadamu vintini lopala tummèda nadamu vintini vèlugulakèlla vèlugai vèligèdu a lopala dipamu kantini
    ivala candrundavala suryudu kaligina sthavaramaina nidhanamu kantini kantiki impagu pandu vènnèla
    virisina shatkamalambulu pindandamulo brahmandamu kantini antata akkada cèngalva kòlanulo aducunna
    rajahamsanu pattiti cala veyi stambhala medalo balika kuduku keli salipitini mallikarjununi madilo
    dalaciti mundara bhringiki mròkki veditini nandikeshvaruni nammi bhajinciti candishvarunaku dandamu
    pèttiti malli malli mahimanu pògaducu pillarayyaku priyamuga mròkkiti dvara palakula darshana mayanu
    dvara mandu ratanala gaddèpai cuciti nèvvaru cudani lingam cuciti kevala sundara lingam nirupadravamagu
    nishcala lingam adi tejamagu aikya lingam rajitamaina virajita lingam pujaniyamagu purana lingam lingamu
    ganugòni linga dehinai lingangulato linga nirguna sangati kantini lingamandu madi linamu cesiti jivanmuktadanaitini
    ankamandi bhramarambika undaga mallikarjunini kori pujinciti dipamu pèttiti divya dehunaku dhupamu
    vesiti dhurjati kappudu tummi pulato pujistini kammani naivedyamu pèttiti sagili mròkkiti sarveshvarunaku
    jaya jaya jaya jaya jangamaraya adidevudavu atma sharanya daya tappaka dhavala sharira bhayamu bapu
    mi bhaktanidhana ènni janmamulu èttina vadanu ninnu talampaka nicudanaitini ènnadu e vidhamèrugani
    vadanu dushta manasuda gauri ramana tamasa gunamulu tagulatambulu niyamamu tappina nicavartanuda nitya
    daridruda atyashayudanu ajnana pashuvunu ceyarani dushceshtalu cesiti bayarani mi bhaktula basiti
    samsarambanu sankèllallo himsa pèttamika elumu tandri mullokambulu muncèdi ganganu salalitamuga jada
    dhariyistivi gòppa cesi ninu kòlicina bantunu tappaka candruni tala dhariyistivi vinnuni ceta kannu
    pujagòni sannuti kèkkina cakra miccitivi anaka shaila kumarika korina sagamu shariramu istivi mudu
    lokamula mukhyamu nive mudu murtulaku mulamu nive datavu nive sarvamu nive pala muncumika nita muncu
    mi pala baditano phalalocana anucu pranatula niducu phalashriti kaluvalu travvinci gannerlu vesi pulu
    kosi shivunaku pujincina phalamu gangi govulu tècci premato saki palu tisi abhishekamu cesinna phalamu
    akalito nunna annartulakunu kammani bhojanambiccina phalamu bhitito nunnatti kadu dinulakunu sharanicci
    rakshincu vishesha phalamu anta kanna phalamu adhika mayyundu
  devanagari: श्रीरम्यम्बुग श्रीगिरि यात्रकु कूरिमि सतितो कूडि नडचितिनि पल्लॆलु पुरमुलु पट्टणम्बुलु पेटलु
    दाटिति अडवुलु कॊण्डलु अन्नी दाटिति कण्टिनि श्रीगिरि कन्नुल निण्डा विण्टिनि महिमलु वीनुल निण्डा आ महिमलु
    नेनेमनि चॆप्पदु ई महिलोपल ऎन्नडु चूडमु धारुणि लोपल धौताचलमदि मेरुनि कण्टॆनु मिक्कुट मैनदि ब्रह्म निर्मल
    ब्रहिशृङ्गम्बुलु निर्मलमगु माणिक्य कूटमुलु कोटलु कॊम्मलु गोपुरम्बुलु तॆऱपिलेनि बहु देवालयमुलु पुण्य
    स्थलम्बुलु पुण्य वनम्बुलु वाटमैन पूदोटलु मिक्किलि माटलु नेर्चिन मञ्चि मृगम्बुलु कामधेनुवुलु कल्पवृक्षमुलु
    क्षेम करम्बगु चिन्तामणुलु अमृत गुण्डम्बुलु कडु नैष्ठिकमुनु कलिगिन विप्रुलु विडुवक शम्भुनि वेडॆटि राजुलु
    सन्तत लिङ्गार्चन गल शैवुलु शान्तुलैन वेदान्तुलु सिद्धुलु गणगण म्रोगॆटि घण्टनादमुलु विजय घोषयगु शङ्ख
    नादमुलु वीर शैवुलु वीराङ्गम्बुलु साधु बृन्दमुलु कामित भक्तुलु अगरु धूपमुलु जपमुलु चेसॆटि जङ्गमोत्तमुलु
    तपमुलु चेसॆटि तापसोत्तमुलु प्रमथुलु भक्तुलु शैव गणम्बुलु गट्टिग इदि भूकैलासम्मनि तप्पिपोक पाताल गङ्गलो
    तॆप्पुन तेलुचु तीर्थम्बाडुचु चॆलगुचु मडि वस्त्रम्बुलु कट्टिति अनुवुग नुदुट विभूति धरिस्तिनि पॊलुपुग
    मॆड रुद्राक्षलु दाल्चिति गुरु कटाक्षमुनु गोप्यमु चेसिति गुरु मन्त्रम्बुनु जपमुनु चेसिति अकलङ्कुडनै
    आश जयिस्तिनि शिव पञ्चाक्षरि मनसुन निलिपिति शिव तत्त्वमु परिशीलन चेसिति पञ्चेन्द्रियम्बुलु पदिलमु चेसिति
    पञ्च मुद्रलभ्यासमु चेसिति अन्तर्मुखुडनैतिनि नादब्रह्म नादमु विण्टिनि लोपल तुम्मॆद नादमु विण्टिनि वॆलुगुलकॆल्ला
    वॆलुगै वॆलिगॆडु आ लोपल दीपमु कण्टिनि ईवल चन्द्रुण्डावल सूर्युडु कलिगिन स्थावरमैन निधानमु कण्टिनि कण्टिकि
    इम्पगु पण्डु वॆन्नॆल विरिसिन षट्कमलम्बुलु पिण्डाण्डमुलो ब्रह्माण्डमु कण्टिनि अन्तट अक्कड चॆङ्गल्व
    कॊलनुलो आडुचुन्न राजहंसनु पट्टिति चाल वेयि स्तम्भाल मेडलो बालिक कूडुकु केलि सलिपितिनि मल्लिकार्जुनुनि
    मदिलो दलचिति मुन्दर भृङ्गिकि म्रॊक्कि वेडितिनि नन्दिकेश्वरुनि नम्मि भजिञ्चिति चण्डीश्वरुनकु दण्डमु
    पॆट्टिति मल्ली मल्ली महिमनु पॊगडुचु पिल्लारय्यकु प्रियमुग म्रॊक्किति द्वार पालकुल दर्शन मायनु द्वार
    मन्दु रतनाल गद्दॆपै चूचिति नॆव्वरु चूडनि लिङ्गं चूचिति केवल सुन्दर लिङ्गं निरुपद्रवमगु निश्चल लिङ्गं
    आदि तेजमगु ऐक्य लिङ्गं राजितमैन विराजित लिङ्गं पूजनीयमगु पुराण लिङ्गं लिङ्गमु गनुगॊनि लिङ्ग देहिनै
    लिङ्गाङ्गुलतो लिङ्ग निर्गुण सङ्गति कण्टिनि लिङ्गमन्दु मदि लीनमु चेसिति जीवन्मुक्तडनैतिनि अङ्कमन्दि
    भ्रमराम्बिक उण्डगा मल्लिकार्जुनिनि कोरि पूजिञ्चिति दीपमु पॆट्टिति दिव्य देहुनकु धूपमु वेसिति धूर्जटि
    कप्पुडु तुम्मि पूलतो पूजिस्तिनि कम्मनि नैवेद्यमु पॆट्टिति सागिलि म्रॊक्किति सर्वेश्वरुनकु जय जय जय
    जय जङ्गमराय आदिदेवुडवु आत्म शरण्य दय तप्पक धवल शरीर भयमु बापु मी भक्तनिधान ऎन्नि जन्ममुलु ऎत्तिन वाडनु
    निन्नु तलम्पक नीचुडनैतिनि ऎन्नडु ए विधमॆरुगनि वाडनु दुष्ट मानसुड गौरी रमण तामस गुणमुलु तगुलाटम्बुलु
    नियममु तप्पिन नीचवर्तनुड नित्य दरिद्रुड अत्याशयुडनु अज्ञान पशुवुनु चेयरानि दुश्चेष्टलु चेसिति बायरानि
    मी भक्तुल बासिति संसारम्बनु सङ्कॆल्लल्लो हिंस पॆट्टमिक एलुमु तण्ड्रि मुल्लोकम्बुलु मुञ्चॆडि गङ्गनु
    सललितमुगा जड धरियिस्तिवि गॊप्प चेसि निनु कॊलिचिन बण्टुनु तप्पक चन्द्रुनि तल धरियिस्तिवि विन्नुनि चेत
    कन्नु पूजगॊनि सन्नुति कॆक्किन चक्र मिच्चितिवि आनक शैल कुमारिक कोरिन सगमु शरीरमु इस्तिवि मूडु लोकमुल
    मुख्यमु नीवे मूडु मूर्तुलकु मूलमु नीवे दातवु नीवे सर्वमु नीवे पाल मुञ्चुमिक नीट मुञ्चु मी पाल बडितनो
    फाललोचन अनुचु प्रणतुल निडुचु फलशृति कालुवलु त्रव्विञ्चि गन्नेर्लु वेसि पूलु कोसि शिवुनकु पूजिञ्चिन
    फलमु गङ्गि गोवुलु तॆच्चि प्रेमतो साकि पालु तीसि अभिषेकमु चेसिन्न फलमु आकलितो नुन्न अन्नार्तुलकुनु
    कम्मनी भोजनम्बिच्चिन फलमु भीतितो नुन्नट्टि कडु दीनुलकुनु शरणिच्चि रक्षिञ्चु विशेष फलमु अन्त कन्ना
    फलमु अधिक मय्युण्डु
