id: gayatristotra
category: stotram
name:
  english: gayatristotra
  devanagari: गायत्रीस्तोत्र
content:
  english: shrigayatristotram 1 namaste devi gayatri savitri tripade'kshare | ajare amare matastrahi mam
    bhavasagarat || 1|| namaste suryasankashe suryasavitri komale | brahmavidye mahavidye vedamatarnamostu
    te || 2|| anantakotibrahmandavyapini brahmacarini | nityanande mahamaye pareshani namostu te || 3||
    tvam brahma tvam harih sakshadrudrastvamindradevata | mitrastvam varunastvam ca tvamagnirashvinau
    bhagah || 4|| pusharyama marutvamshca rishayo'pi munishvarah | pitaro nagayakshashca gandharvapsarasam
    ganah || 5|| rakshobhutapishacashca tvameva parameshvari | rigyajussamavedashca atharvangirasani ca
    || 6|| tvameva pancabhutani tattvani jagadishvari | brahmi sarasvati sandhya turiya tvam maheshvari
    || 7|| tvameva sarvashastrani tvameva sarvasamhitah | puranani ca mantrani mahagama matani ca || 8||
    tatsadbrahmasvarupa tvam kancitsadasadatmika | paratpareshi gayatri namaste matarambike || 9|| candre
    kalatmike nitye kalaratri svadhe svare | svahakare'gnivaktre tvam namami jagadishvari || 10|| namo
    namaste gayatri savitri tvam namamyaham | sarasvati namastubhyam turiye brahmarupini || 11|| aparadhasahasrani
    tvasatkarmashatani ca | matto jatani deveshi tvam kshamasva dine dine || 12|| || iti vasishthasamhitayam
    gayatristotram sampurnam ||
  devanagari: श्रीगायत्रीस्तोत्रम् १ नमस्ते देवि गायत्रि सावित्रि त्रिपदेऽक्षरे । अजरे अमरे मातस्त्राहि
    मां भवसागरात् ॥ १॥ नमस्ते सूर्यसङ्काशे सूर्यसावित्रि कोमले । ब्रह्मविद्ये महाविद्ये वेदमातर्नमोस्तु
    ते ॥ २॥ अनन्तकोटिब्रह्माण्डव्यापिनि ब्रह्मचारिणि । नित्यानन्दे महामाये परेशानि नमोस्तु ते ॥ ३॥ त्वं
    ब्रह्मा त्वं हरिः साक्षाद्रुद्रस्त्वमिन्द्रदेवता । मित्रस्त्वं वरुणस्त्वं च त्वमग्निरश्विनौ भगः ॥
    ४॥ पूषार्यमा मरुत्वांश्च ऋषयोऽपि मुनीश्वराः । पितरो नागयक्षाश्च गन्धर्वाप्सरसां गणाः ॥ ५॥ रक्षोभूतपिशाचाश्च
    त्वमेव परमेश्वरि । ऋग्यजुस्सामवेदाश्च अथर्वाङ्गिरसानि च ॥ ६॥ त्वमेव पञ्चभूतानि तत्त्वानि जगदीश्वरि
    । ब्राह्मी सरस्वती सन्ध्या तुरीया त्वं महेश्वरि ॥ ७॥ त्वमेव सर्वशास्त्राणि त्वमेव सर्वसंहिताः । पुराणानि
    च मन्त्राणि महागम मतानि च ॥ ८॥ तत्सद्ब्रह्मस्वरूपा त्वं कञ्चित्सदसदात्मिका । परात्परेशि गायत्रि नमस्ते
    मातरम्बिके ॥ ९॥ चन्द्रे कलात्मिके नित्ये कालरात्रि स्वधे स्वरे । स्वाहाकारेऽग्निवक्त्रे त्वां नमामि
    जगदीश्वरि ॥ १०॥ नमो नमस्ते गायत्रि सावित्रि त्वां नमाम्यहम् । सरस्वति नमस्तुभ्यं तुरीये ब्रह्मरूपिणि
    ॥ ११॥ अपराधसहस्राणि त्वसत्कर्मशतानि च । मत्तो जातानि देवेशि त्वं क्षमस्व दिने दिने ॥ १२॥ ॥ इति वसिष्ठसंहितायां
    गायत्रीस्तोत्रं सम्पूर्णम् ॥
