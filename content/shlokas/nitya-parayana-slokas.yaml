id: nitya-parayana-slokas
category: stotram
name:
  english: Nitya Parayana Slokas
content:
  english: prabhata shlokah karagre vasate lakshmih karamadhye sarasvati | karamule sthita gauri prabhate
    karadar karamule tu govindah prabhate karadar prabhata bhumi shlokah samudra vasane devi parvata stana
    mandale | vishnupatni namastubhyam nkshamasvame || suryodaya shlokah brahmasvarupa mudaye madhyahnetu
    maheshvaram | saha ndhyayetsada vishnu nca divakaram || snana shlokah gange ca yamune caiva godavari
    sarasvati narmade sindhu kaveri jalesmin sannidhi nkuru || namaskara shlokah tvameva mata ca pita
    tvameva tvameva bandhushca sakha tvameva | tvameva vidya dravina mmama devadeva || bhasma dharana
    shlokah shrikara nca shoka nivaranam | loke vashikara ntryailokya pavanam || bhojana purva shlokah
    brahmarpana mbrahma havih brahmagnau brahmanahutam | brahmaiva tena gantavya mbrahma karma samadhinah
    || aham vai~shvanaro bhutva pranina ndehamashritah | pranapana samayuktah pacamyanna ncaturvidham
    || annapurne sada purne shankarapranavallabhe | jnanavairagya siddhyartha ndehi ca parvati || tvadiyam
    va~stu govinda tubhyameva samarpaye | grihana sumukho bhutva prasida parameshvara || bhojananantara
    shlokah agastyam nca badabalanam | ahara parinamartham smarami ca vrikodaram || sandhya dipa dar shana
    shlokah dipajyotih para mbrahma dipajyotirjanardanah | dipo haratu me papa nkaroti kalyanam arogya
    vinashaya dipajyotirnamo shayana shlokah ramam skandam hanumantam stasyanashyati || aparadha kshamapana
    stotram aparadha sahasrani kshamasva parameshvara || karacarana kritam va~paradham | vihita mavihitam
    tkshamasva shiva shiva karunabdhe shri mahadeva shambho || kayena vaca manasendriyairva buddhyatmana
    va prakrite ssvabhavat | karomi yadyatsakala mparasmai narayanayeti samarpayami || devata stotrah
    karya prarambha stotrah shukla ncaturbhujam | prasannavadana thsarva vighnopashantaye || yasyadvirada
    vaktradyah parishadyah parashshatam | vighna ntamashraye || ganesha stotram vakratunda mahakaya suryakoti
    samaprabhah | nirvighna nkuru me deva sarva karyeshu sarvada || agajanana padmarka ngajanana maharnisham
    | anekadan mupasmahe || vishnu stotram shantakara mpadmanabham suresham vishvadhara mmeghavarnam shubhangam
    | lakshmikanta yo~gihriddhyanagamyam vande vishnu mbhavabhayaharam sarvalokaikanatham || gayatri mantram
    o mbhurbhuvassuvah | tathsaviturvare nyam | bhargo devasya dhimahi | dhiyo yo nah pracodaya t || shiva
    stotram tryambakam mpushtivardhanam | urvarukamiva bandhana t || vande shambhumumapatim suragurum
    va~nde jagatkaranam vande pannagabhushanam shashidharam | vande suryashashanka vahninayanam va~nde
    mukundapriyam vande bhaktajanashraya || subrahmanya stotram shaktihastam vi~rupaksham shikhivaham
    shadananam darunam ripurogaghna mbhavaye kukkuta dhvajam | skandam shanmukha ncaturbhujam kumaram
    svaminadha nnamamyaham || guru shlokah gururbrahma gururvishnuh gururdevo maheshvarah | guru tparabrahma
    tasmai shri gurave namah || hanuma stotrah manojava va~rishtam | vatatmajam va~narayudha mukhyam shriramadutam
    shirasa namami || buddhirbalam nnirbhayatvamarogata | ajadyam dbhavet || jayatyati balo ramo lakshmanasya
    mahabalah | raja jayati sugrivo raghavenabhi palitah || daso nkosalendrasya ramasyaklishta karmanah
    | hanuman shatrusainyana nnihanta marutatmajah || shrirama stotram shri rama rama rameti rame rame
    manorame sahasranama tattulyam rama nama varanane shri ramacandra ssamasta kalyana gunabhiramah |
    sitamukhambhoruha mmangalamatanotu || shrikrishna stotram mandaramule madanabhiramam bimbadharapurita
    venunadam | gogopa gopijana madhyasamstham gopa mbhaje gokula purnacandram || garuda svami stotram
    kunkumankitavarnaya kundendu dhavalaya ca | vishnu vaha namastubhya mpakshirajaya te namah || dakshinamurti
    stotram gurave sarvalokana mbhishaje bhavaroginam | nidhaye sarva vidyanam shri dakshinamurtaye nama
    || sarasvati shlokah sarasvati namastubhyam va~rade kamarupini | vidyarambha nkarishyami siddhirbhavatu
    me sada || ya kundendu tushara hara dhavala ya shubhra vastravrita | ya vina varadanda mandita kara
    ya shveta padmasana | ya brahmacyuta shankara prabhritibhir ssada pujita | sa ma mpatu sarasvati bhagavati
    nishsheshajadyapaha || lakshmi shlokah lakshmi nkshirasamudra raja tanayam shriranga dhameshvarim
    | dasibhuta samasta deva vanitam lo~kaika dipankuram | shrimanmandha kataksha labdha vibhava brahmendra
    gangadharam | tva ntrailokyakutumbinim sarasijam va~nde mukundapriyam || durga devi stotram sarva
    svarupe sarveshe sarva shakti samanvite | bhayebhyastrahi no devi durgedevi namostute || tripurasundari
    stotram onkara panjara shukim upanishadudyana keli kalakanthim | agama vipina mayurim aryam antarvibhavayedgaurim
    || devi shlokah sarva mangala mangalye shive sarvartha sadhike | sharanye tryambake devi narayani
    namostute || venkateshvara shlokah shriyah kantaya kalyananidhaye nidhaye 'rthinam | shri venkata
    nivasaya shrinivasaya mangalam || bauddha prarthana buddham sharana ngacchami shanti mantram asatoma
    sadgamaya | tamasoma jyotirgamaya | mrityorma amritangamaya | om shanti shshantih sarve bhavantu sukhina
    ssarve santu niramayah | sarve bhadrani pashyantu ma kashcidduhkha bhagbhavet || om shanti shshantih
    om sarvesham svastirbhavatu sarvesham shantirbhavatu | sarvesha shshantih om saha navavatu | saha
    nau bhunaktu | saha virya nkaravavahai | tejasvinavadhitamastu ma vidvishavahai shshantih || svasti
    mantrah svasti prajabhyah paripalayantam nyayena margena mahi mmahishah | gobrahmanebhya shshubhamastu
    nityam loka ssukhino bhavantu || kale var shatu parjanyah prithivi sasyashalini | deshoya nkshobharahito
    brahmanassantu nirbhayah || vishesha mantrah pancakshari mantram nnamashshivaya ashtakshari mantram
    nnamo narayanaya dvadashakshari mantram nnamo bhagavate vasudevaya
  devanagari: प्रभात श्लोकः कराग्रे वसते लक्ष्मीः करमध्ये सरस्वती । करमूले स्थिता गौरी प्रभाते करदर् करमूले
    तु गोविन्दः प्रभाते करदर् प्रभात भूमि श्लोकः समुद्र वसने देवी पर्वत स्तन मण्डले । विष्णुपत्नि नमस्तुभ्यम्
    ङ्क्षमस्वमे ॥ सूर्योदय श्लोकः ब्रह्मस्वरूप मुदये मध्याह्नेतु महेश्वरम् । साह न्ध्यायेत्सदा विष्णु
    ञ्च दिवाकरम् ॥ स्नान श्लोकः गङ्गे च यमुने चैव गोदावरी सरस्वती नर्मदे सिन्धु कावेरी जलेस्मिन् सन्निधि
    ङ्कुरु ॥ नमस्कार श्लोकः त्वमेव माता च पिता त्वमेव त्वमेव बन्धुश्च सखा त्वमेव । त्वमेव विद्या द्रविण
    म्मम देवदेव ॥ भस्म धारण श्लोकः श्रीकर ञ्च शोक निवारणम् । लोके वशीकर न्त्र्यैलोक्य पावनम् ॥ भोजन पूर्व
    श्लोकाः ब्रह्मार्पण म्ब्रह्म हविः ब्रह्माग्नौ ब्रह्मणाहुतम् । ब्रह्मैव तेन गन्तव्य म्ब्रह्म कर्म समाधिनः
    ॥ अहं वैँश्वानरो भूत्वा प्राणिना न्देहमाश्रितः । प्राणापान समायुक्तः पचाम्यन्न ञ्चतुर्विधम् ॥ अन्नपूर्णे
    सदा पूर्णे शङ्करप्राणवल्लभे । ज्ञानवैराग्य सिद्ध्यर्थ न्देहि च पार्वति ॥ त्वदीयं वँस्तु गोविन्द तुभ्यमेव
    समर्पये । गृहाण सुमुखो भूत्वा प्रसीद परमेश्वर ॥ भोजनानन्तर श्लोकः अगस्त्यं ञ्च बडबालनम् । आहार परिणामार्थं
    स्मरामि च वृकोदरम् ॥ सन्ध्या दीप दर् शन श्लोकः दीपज्योतिः पर म्ब्रह्म दीपज्योतिर्जनार्दनः । दीपो हरतु
    मे पाप ङ्करोति कल्याणं आरोग्य विनाशाय दीपज्योतिर्नमो शयन श्लोकः रामं स्कन्दं हनुमन्तं स्तस्यनश्यति
    ॥ अपराध क्षमापण स्तोत्रं अपराध सहस्राणि क्षमस्व परमेश्वर ॥ करचरण कृतं वाँपराधम् । विहित मविहितं त्क्षमस्व
    शिव शिव करुणाब्धे श्री महादेव शम्भो ॥ कायेन वाचा मनसेन्द्रियैर्वा बुद्ध्यात्मना वा प्रकृते स्स्वभावात्
    । करोमि यद्यत्सकल म्परस्मै नारायणायेति समर्पयामि ॥ देवता स्तोत्राः कार्य प्रारम्भ स्तोत्राः शुक्ला
    ञ्चतुर्भुजम् । प्रसन्नवदन थ्सर्व विघ्नोपशान्तये ॥ यस्यद्विरद वक्त्राद्याः पारिषद्याः परश्शतम् । विघ्न
    न्तमाश्रये ॥ गणेश स्तोत्रं वक्रतुण्ड महाकाय सूर्यकोटि समप्रभः । निर्विघ्न ङ्कुरु मे देव सर्व कार्येषु
    सर्वदा ॥ अगजानन पद्मार्क ङ्गजानन महर्निशम् । अनेकदन् मुपास्महे ॥ विष्णु स्तोत्रं शान्ताकार म्पद्मनाभं
    सुरेशं विश्वाधार म्मेघवर्णं शुभाङ्गम् । लक्ष्मीकान्त योँगिहृद्ध्यानगम्यं वन्दे विष्णु म्भवभयहरं सर्वलोकैकनाथम्
    ॥ गायत्रि मन्त्रं ओ म्भूर्भुव॒स्सुवः॒ । तथ्स॑वि॒तुर्वरे ण्यं॒ । भर्गो॑ दे॒वस्य॑ धीमहि । धियो॒ यो नः॑
    प्रचोदया त् ॥ शिव स्तोत्रं त्र्य॑म्बकं म्पु॑ष्टि॒वर्ध॑नम् । उ॒र्वा॒रु॒कमि॑व॒ बन्ध॑ना त् ॥ वन्दे शम्भुमुमापतिं
    सुरगुरुं वँन्दे जगत्कारणं वन्दे पन्नगभूषणं शशिधरं । वन्दे सूर्यशशाङ्क वह्निनयनं वँन्दे मुकुन्दप्रियं
    वन्दे भक्तजनाश्रय ॥ सुब्रह्मण्य स्तोत्रं शक्तिहस्तं विँरूपाक्षं शिखिवाहं षडाननं दारुणं रिपुरोगघ्न
    म्भावये कुक्कुट ध्वजम् । स्कन्दं षण्मुख ञ्चतुर्भुजं कुमारं स्वामिनाध न्नमाम्यहम् ॥ गुरु श्लोकः गुरुर्ब्रह्म
    गुरुर्विष्णुः गुरुर्देवो महेश्वरः । गुरु त्परब्रह्म तस्मै श्री गुरवे नमः ॥ हनुम स्तोत्राः मनोजव वँरिष्टम्
    । वातात्मजं वाँनरयूध मुख्यं श्रीरामदूतं शिरसा नमामि ॥ बुद्धिर्बलं न्निर्भयत्वमरोगता । अजाड्यं द्भवेत्
    ॥ जयत्यति बलो रामो लक्ष्मणस्य महाबलः । राजा जयति सुग्रीवो राघवेणाभि पालितः ॥ दासो ङ्कोसलेन्द्रस्य
    रामस्याक्लिष्ट कर्मणः । हनुमान् शत्रुसैन्याना न्निहन्ता मारुतात्मजः ॥ श्रीराम स्तोत्रां श्री राम राम
    रामेति रमे रामे मनोरमे सहस्रनाम तत्तुल्यं राम नाम वरानने श्री रामचन्द्र स्समस्त कल्याण गुणाभिरामः
    । सीतामुखाम्भोरुहा म्मङ्गलमातनोतु ॥ श्रीकृष्ण स्तोत्रं मन्दारमूले मदनाभिरामं बिम्बाधरापूरित वेणुनादम्
    । गोगोप गोपीजन मध्यसंस्थं गोप म्भजे गोकुल पूर्णचन्द्रम् ॥ गरुड स्वामि स्तोत्रं कुङ्कुमाङ्कितवर्णाय
    कुन्देन्दु धवलाय च । विष्णु वाह नमस्तुभ्य म्पक्षिराजाय ते नमः ॥ दक्षिणामूर्ति स्तोत्रं गुरवे सर्वलोकाना
    म्भिषजे भवरोगिणाम् । निधये सर्व विद्यानां श्री दक्षिणामूर्तये नम ॥ सरस्वती श्लोकः सरस्वती नमस्तुभ्यं
    वँरदे कामरूपिणी । विद्यारम्भ ङ्करिष्यामि सिद्धिर्भवतु मे सदा ॥ या कुन्देन्दु तुषार हार धवला या शुभ्र
    वस्त्रावृता । या वीणा वरदण्ड मण्डित करा या श्वेत पद्मासना । या ब्रह्माच्युत शङ्कर प्रभृतिभिर् स्सदा
    पूजिता । सा मा म्पातु सरस्वती भगवती निश्शेषजाड्यापहा ॥ लक्ष्मी श्लोकः लक्ष्मी ङ्क्षीरसमुद्र राज तनयां
    श्रीरङ्ग धामेश्वरीम् । दासीभूत समस्त देव वनितां लोँकैक दीपाङ्कुराम् । श्रीमन्मन्ध कटाक्ष लब्ध विभव
    ब्रह्मेन्द्र गङ्गाधराम् । त्वा न्त्रैलोक्यकुटुम्बिनीं सरसिजां वँन्दे मुकुन्दप्रियाम् ॥ दुर्गा देवी
    स्तोत्रं सर्व स्वरूपे सर्वेशे सर्व शक्ति समन्विते । भयेभ्यस्त्राहि नो देवि दुर्गेदेवि नमोस्तुते ॥
    त्रिपुरसुन्दरी स्तोत्रं ओङ्कार पञ्जर शुकीं उपनिषदुद्यान केलि कलकण्ठीम् । आगम विपिन मयूरीं आर्यां अन्तर्विभावयेद्गौरीम्
    ॥ देवी श्लोकः सर्व मङ्गल माङ्गल्ये शिवे सर्वार्थ साधिके । शरण्ये त्र्यम्बके देवि नारायणि नमोस्तुते
    ॥ वेङ्कटेश्वर श्लोकः श्रियः कान्ताय कल्याणनिधये निधये ऽर्थिनाम् । श्री वेङ्कट निवासाय श्रीनिवासाय
    मङ्गलम् ॥ बौद्ध प्रार्थन बुद्धं शरण ङ्गच्छामि शान्ति मन्त्रं असतोमा सद्गमया । तमसोमा ज्योतिर्गमया
    । मृत्योर्मा अमृतङ्गमया । ॐ शान्ति श्शान्तिः सर्वे भवन्तु सुखिन स्सर्वे सन्तु निरामयाः । सर्वे भद्राणि
    पश्यन्तु मा कश्चिद्दुःख भाग्भवेत् ॥ ॐ शान्ति श्शान्तिः ॐ सर्वेषां स्वस्तिर्भवतु सर्वेषां शान्तिर्भवतु
    । सर्वेषा श्शान्तिः ॐ स॒ह ना॑ववतु । स॒ह नौ॑ भुनक्तु । स॒ह वी॒र्य॑ ङ्करवावहै । ते॒ज॒स्विना॒वधी॑तमस्तु॒
    मा वि॑द्विषा॒वहै श्शान्तिः॑ ॥ स्वस्ति मन्त्राः स्वस्ति प्रजाभ्यः परिपालयन्तां न्यायेन मार्गेण मही
    म्महीशाः । गोब्राह्मणेभ्य श्शुभमस्तु नित्यं लोका स्सुखिनो भवन्तु ॥ काले वर् षतु पर्जन्यः पृथिवी सस्यशालिनी
    । देशोय ङ्क्षोभरहितो ब्राह्मणास्सन्तु निर्भयाः ॥ विशेष मन्त्राः पञ्चाक्षरी मन्त्रं न्नमश्शिवाय अष्टाक्षरी
    मन्त्रं न्नमो नारायणाय द्वादशाक्षरी मन्त्रं न्नमो भगवते वासुदेवाय
