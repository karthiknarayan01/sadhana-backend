id: bhishmaproktam1shrikrishnastotram
category: stotram
name:
  english: bhishmaproktam1shrikrishnastotram
  devanagari: भीष्मप्रोक्तं१श्रीकृष्णस्तोत्रम्
content:
  english: bhishmaproktam 1 shrikrishnastotram krishna eva hi lokanamutpattirapi capyayah | krishnasya
    hi krite bhutamidam vishvam samarpitam || 22|| esha prakritiravyakta karta caiva sanatanah | parashca
    sarvabhutebhyastasmadvriddhatamo'cyutah || 23|| buddhirmano mahanvayustejo'mbhah kham mahi ca ya |
    caturvidham ca yadbhutam sarvam krishne pratishthitam || 24|| adityashcandramashcaiva nakshatrani
    grahashca ye | dishashcopadishashcaiva sarvam krishne pratishthitam || 25|| iti mahabharate sabhaparvani
    35 adhyayantargatam bhishmaproktam shrikrishnastotram sampurnam | mahabharata | sabhaparva | adhyaya
    35
  devanagari: भीष्मप्रोक्तं १ श्रीकृष्णस्तोत्रम् कृष्ण एव हि लोकानामुत्पत्तिरपि चाप्ययः । कृष्णस्य हि
    कृते भूतमिदं विश्वं समर्पितम् ॥ २२॥ एष प्रकृतिरव्यक्ता कर्ता चैव सनातनः । परश्च सर्वभूतेभ्यस्तस्माद्वृद्धतमोऽच्युतः
    ॥ २३॥ बुद्धिर्मनो महान्वायुस्तेजोऽम्भः खं मही च या । चतुर्विधं च यद्भूतं सर्वं कृष्णे प्रतिष्ठितम्
    ॥ २४॥ आदित्यश्चन्द्रमाश्चैव नक्षत्राणि ग्रहाश्च ये । दिशश्चोपदिशश्चैव सर्वं कृष्णे प्रतिष्ठितम् ॥
    २५॥ इति महाभारते सभापर्वणि ३५ अध्यायान्तर्गतं भीष्मप्रोक्तं श्रीकृष्णस्तोत्रं सम्पूर्णम् । महाभारत
    । सभापर्व । अध्याय ३५
