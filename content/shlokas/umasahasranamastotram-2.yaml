id: umasahasranamastotram-2
category: sahasranama
name:
  english: umasahasranamastotram
  devanagari: उमासहस्रनामस्तोत्रम्
content:
  english: kriyarupa hrinkara varadayini || 17|| uma cosha tathonkara ya sadodayakirtida | upasanodyamakhya
    sa yopacaraparotkata || 18|| rituh ritupriya kartri rituyukta rituddhara | rishimata ca rigveda rishidevanamaskrita
    || 19|| ekakshara caikamatra caikanishthaikavallabha | ekakaranekavarna caindri caikadashi shiva ||
    20|| aihikamushmikasyapi datri caikararupini | eka'neka mahejya ca yaikavarnasamayuta || 21|| onkarastha
    paradevi aushadhi roganashini | otaprota tathonkarasvarupa sarvarupini || 22|| kamakhya kamada devi
    kadambataruvasini | kavipujya ca kavita sarvakamapradayini || 23|| kamalesamsthita kali kaulini kaundali
    shiva | kadambakusumaistushta kalyani karunanidhih || 24|| kalavati kalalapa kala kadambaripriya |
    karunarupini kirtih kamalakshi kumarika || 25|| kameshvari kamajanani karmakarmaphalaprada | kushala
    kamanakara kurukulla kuleshvari || 26|| kulakundalaya kantih kalindi ca kalanidhih | kantimati kalahantri
    koshada kamavandita || 27|| kalatmika kalanatha kavyalapavinodini | klinkara kevala kanta kelih kamakalatmika
    || 28|| kamlakarahita kaula kamarupanivasini | kantardhavigraha kashtha kalpanarahita kasha || 29||
    karanam karanam kartta karabandhavimocini | kamini kaushiki krantih kishori kusumapriya || 30|| kurukshetravanih
    kashi kantida kundalapriya | kalushyarahita krishna kala ya kalinashini || 31|| dhyanam
  devanagari: क्रियारूपा ह्रीङ्कारा वरदायिनी ॥ १७॥ उमा चोषा तथोङ्कारा या सदोदयकीर्तिदा । उपासनोद्यमाख्या
    सा योपचारपरोत्कटा ॥ १८॥ ऋतुः ऋतुप्रिया कर्त्री ऋतुयुक्ता ऋतूद्धरा । ऋषिमाता च ऋग्वेदा ऋषिदेवनमस्कृता
    ॥ १९॥ एकाक्षरा चैकमात्रा चैकनिष्ठैकवल्लभा । एकाकारानेकवर्णा चैन्द्री चैकादशी शिवा ॥ २०॥ ऐहिकामुष्मिकस्यापि
    दात्री चैकाररूपिणी । एकाऽनेका महेज्या च यैकवर्णसमायुता ॥ २१॥ ओङ्कारस्था परादेवी औषधी रोगनाशिनी । ओतप्रोता
    तथोङ्कारस्वरूपा सर्वरूपिणी ॥ २२॥ कामाख्या कामदा देवी कदम्बतरुवासिनी । कविपूज्या च कविता सर्वकामप्रदायिनी
    ॥ २३॥ कमलेसंस्थिता काली कौलिनी कौण्डली शिवा । कदम्बकुसुमैस्तुष्टा कल्याणी करुणानिधिः ॥ २४॥ कलावती
    कलालापा कला कादम्बरीप्रिया । करुणारूपिणी कीर्तिः कमलाक्षी कुमारिका ॥ २५॥ कामेश्वरी कामजननी कर्माकर्मफलप्रदा
    । कुशला कामनाकारा कुरुकुल्ला कुलेश्वरी ॥ २६॥ कुलकुण्डालया कान्तिः कालिन्दी च कलानिधिः । कान्तिमती
    कालहन्त्री कोशदा कामवन्दिता ॥ २७॥ कलात्मिका कलानाथा काव्यालापविनोदिनी । क्लीङ्कारा केवला कान्ता केलिः
    कामकलात्मिका ॥ २८॥ कंलकरहिता कौला कामरूपनिवासिनी । कान्तार्धविग्रहा काष्ठा कल्पनारहिता कषा ॥ २९॥ करणं
    कारणं कर्त्ता काराबन्धविमोचिनी । कामिनी कौशिकी क्रान्तिः किशोरी कुसुमप्रिया ॥ ३०॥ कुरुक्षेत्रावनिः
    काशी कान्तिदा कुण्डलप्रिया । कालुष्यरहिता कृष्णा कला या कलिनाशिनी ॥ ३१॥ ध्यानम्
