id: r-05
category: veda
name:
  english: r 05
  devanagari: र् ०५
content:
  english: 16 iti̭ ci̱nnu pra̱jayai̭ pashu̱matyai̱ deva̭so̱ vana̭te̱ martyo̭ va̱ a dḙvaso vanate̱ martyo̭
    vah | atra̭ shi̱vam ta̱nvo̭ dha̱sima̱sya ja̱ram ci̭nme̱ nirri̭tirjagrasita || 5
  devanagari: १६ इति॑ चि॒न्नु प्र॒जायै॑ पशु॒मत्यै॒ देवा॑सो॒ वन॑ते॒ मर्त्यो॑ व॒ आ दे॑वासो वनते॒ मर्त्यो॑
    वः । अत्रा॑ शि॒वां त॒न्वो॑ धा॒सिम॒स्या ज॒रां चि॑न्मे॒ निरृ॑तिर्जग्रसीत ॥ ५
