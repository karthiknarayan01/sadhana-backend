id: ekadashamukhahanumatkavacam-agastyasamhitantargatam
category: kavacha
name:
  english: ekadashamukhahanumatkavacam (agastyasamhitantargatam)
  devanagari: एकादशमुखहनुमत्कवचम् (अगस्त्यसंहितान्तर्गतम्)
content:
  english: bijatma sada patu coru vardhilamghanah || 14|| sugrivasacivah patu januni me manojavah | padau
    padatale patu dronacaladharo harih || 15|| apadamastakam patu ramaduto mahabalah | purve vanaravaktro
    mamagneyyam kshatriyantakrit || 16|| dakshine narasimhastu nairrityam gananayakah | varunyam dishi
    mamavyatkhagavaktro harishvarah || 17|| vayavyam bhairavamukhah kauberyam patu mam sada | krodasyah
    patu mam nityamaishanyam rudrarupadhrik || 18|| urdhvam hayananah patu guhyadhah sumukhastatha | ramasyah
    patu sarvatra saumyarupo mahabhujah || 19|| ityevam ramadutasya kavacam yah pathetsada | ekadashamukhasyaitadgopyam
    vai kirtitam maya || 20|| rakshoghnam kamadam saumyam sarvasampadvidhayakam | putradam dhanadam cograshatrusamghavimardanam
    || 21|| svargapavargadam divyam cintitarthapradam shubham | etatkavacamajnatva mantrasiddhirna jayate
    || 22|| catvarimshatsahasrani pathecchuddhatmako narah | ekavaram pathennityam kavacam siddhidam puman
    || 23|| dvivaram va trivaram va pathannayushyamapnuyat | kramadekadashadevamavartanajapatsudhih ||
    24|| varshante darshanam sakshallabhate natra samshayah | yam yam cintayate cartham tam tam prapnoti
    purushah || 25|| brahmodiritametaddhi tavagre kathitam mahat || 26|| ityevamuktva vacanam maharshistushnim
    babhuvendumukhim nirikshya | samhrishtacittapi tada tadiyapadau nanamatimuda svabhartuh || 27|| ||
    ityagastyasarasamhitayamekadashamukhahanumatkavacam sampurnam ||
  devanagari: बीजात्मा सदा पातु चोरू वार्धिलंघनः ॥ १४॥ सुग्रीवसचिवः पातु जानुनी मे मनोजवः । पादौ पादतले
    पातु द्रोणाचलधरो हरिः ॥ १५॥ आपादमस्तकं पातु रामदूतो महाबलः । पूर्वे वानरवक्त्रो मामाग्नेय्यां क्षत्रियान्तकृत्
    ॥ १६॥ दक्षिणे नारसिंहस्तु नैरृत्यां गणनायकः । वारुण्यां दिशि मामव्यात्खगवक्त्रो हरीश्वरः ॥ १७॥ वायव्यां
    भैरवमुखः कौबेर्यां पातु मां सदा । क्रोडास्यः पातु मां नित्यमैशान्यां रुद्ररूपधृक् ॥ १८॥ ऊर्ध्वं हयाननः
    पातु गुह्याधः सुमुखस्तथा । रामास्यः पातु सर्वत्र सौम्यरूपो महाभुजः ॥ १९॥ इत्येवं रामदूतस्य कवचं यः
    पठेत्सदा । एकादशमुखस्यैतद्गोप्यं वै कीर्तितं मया ॥ २०॥ रक्षोघ्नं कामदं सौम्यं सर्वसम्पद्विधायकम् ।
    पुत्रदं धनदं चोग्रशत्रुसंघविमर्दनम् ॥ २१॥ स्वर्गापवर्गदं दिव्यं चिन्तितार्थप्रदं शुभम् । एतत्कवचमज्ञात्वा
    मन्त्रसिद्धिर्न जायते ॥ २२॥ चत्वारिंशत्सहस्राणि पठेच्छुद्धात्मको नरः । एकवारं पठेन्नित्यं कवचं सिद्धिदं
    पुमान् ॥ २३॥ द्विवारं वा त्रिवारं वा पठन्नायुष्यमाप्नुयात् । क्रमादेकादशादेवमावर्तनजपात्सुधीः ॥ २४॥
    वर्षान्ते दर्शनं साक्षाल्लभते नात्र संशयः । यं यं चिन्तयते चार्थं तं तं प्राप्नोति पूरुषः ॥ २५॥ ब्रह्मोदीरितमेतद्धि
    तवाग्रे कथितं महत् ॥ २६॥ इत्येवमुक्त्वा वचनं महर्षिस्तूष्णीं बभूवेन्दुमुखीं निरीक्ष्य । संहृष्टचित्तापि
    तदा तदीयपादौ ननामातिमुदा स्वभर्तुः ॥ २७॥ ॥ इत्यगस्त्यसारसंहितायामेकादशमुखहनुमत्कवचं सम्पूर्णम् ॥
