id: ganesha-ashtottara-sata-namavali
category: stotram
name:
  english: Ganesha Ashtottara Sata Namavali
  devanagari: गणेशाष्टोत्तरशतनामावलिः २ (विघ्नेशाय विश्ववरदाय)
content:
  english: om vighneshaya | vishvavaradaya (vishvavadanaya) | vishvacakshushe | jagatprabhave (jagatpataye)
    | hiranyarupaya | sarvatmane | jnanarupaya | jaganmayaya | udhvaretase | mahabahave namah | 10 om
    ameyaya | amitavikramaya | vedavedyaya | mahakalaya (mahakayaya) | vidyanidhaye | anamayaya | sarvajnaya
    | sarvagaya | shantaya | gajasyaya namah | 20 om citteshvaraya | vigatajvaraya | vishvamurtaye | ameyatmane
    | vishvadharaya | sanatanaya | samaganapriyaya | mantrine | sattvadharaya | suradhishaya (suradhipaya)
    namah | 30 om samastasakshine | nirdvandvaya | nirlokaya (nirliptaya) | amoghavikramaya | nirmalaya
    | punyaya | kamadaya | kantidaya (kavaye) | kamarupine| kamaposhine (kamaveshaya) namah | 40 om kamalakshaya
    | gajananaya (kaladharaya) | sumukhaya | sharmadaya | mushakadhipavahanaya | shuddhaya | dirghatundaya
    (dirghatundadharaya) | shripataye (shrimate) | anantaya | mohavarjitaya namah | 50 om vakratundaya
    | shurpakarnaya | paramaya (pavanaya pavanaya) yogishaya | yogadhamne (yogivandyanghraye) | umasutaya
    (umasunave) | apaddhantre (aghapahaya) | ekadantaya | mahagrivaya | siddhasenaya (siddhisevitaya)
    namah | 60 om siddhavedaya (siddhidaya) | karunaya | siddhaya | (karunasindhave) bhagavate | avyagraya
    (bhavyavigrahaya) | vikataya | kapilaya | dhundhirajaya (dhundhaye) | ugraya | bhimodaraya (bhimaya)
    | haraya namah | 70 om shubhaya | ganadhyakshaya | ganeshaya | ganaradhyaya | gananayakaya | jyotihsvarupaya
    | bhutatmane | dhumraketave | anukulaya | kumaragurave namah | 80 om anandaya | herambaya | vedastutaya
    | nagayajnopavitine | durdharshaya | baladurvankurapriyaya | bhalacandraya | vishvadhatre (vishvadhamne)
    | shivaputraya | vinayakaya namah | 90 om lilasevitaya (lilavalambitavapushe) | purnaya | paramasundaraya
    | vighnantakaraya (vighnandhakaramartandaya vighnaranyadavanalaya) | sinduravadanaya | nityaya | vibhave
    | prathamapujitaya (vishnuprathamapujitaya) | divyapadabjaya (sharanyadivyapadabjaya) | bhaktamandaraya
    (bhaktamandarabhuruhaya) namah | 100 om mahashuraya | ratnasimhasanaya (ratnasimhasanasinaya) | manikundalamanditaya
    | bhaktakalyanaya (bhaktakalyanadaya) | ameyaya | kalyanagurave | (ameyakalyanagunasamshrayaya) sahasrashirshne
    | mahaganapataye namah | 108 iti ganeshashtottarashatanamavalih samapta |
  devanagari: ॐ विघ्नेशाय । विश्ववरदाय (विश्ववदनाय) । विश्वचक्षुषे । जगत्प्रभवे (जगत्पतये) । हिरण्यरूपाय
    । सर्वात्मने । ज्ञानरूपाय । जगन्मयाय । ऊध्वरेतसे । महाबाहवे नमः । १० ॐ अमेयाय । अमितविक्रमाय । वेदवेद्याय
    । महाकालाय (महाकायाय) । विद्यानिधये । अनामयाय । सर्वज्ञाय । सर्वगाय । शान्ताय । गजास्याय नमः । २०
    ॐ चित्तेश्वराय । विगतज्वराय । विश्वमूर्तये । अमेयात्मने । विश्वाधाराय । सनातनाय । सामगानप्रियाय ।
    मन्त्रिणे । सत्त्वाधाराय । सुराधीशाय (सुराधिपाय) नमः । ३० ॐ समस्तसाक्षिणे । निर्द्वन्द्वाय । निर्लोकाय
    (निर्लिप्ताय) । अमोघविक्रमाय । निर्मलाय । पुण्याय । कामदाय । कान्तिदाय (कवये) । कामरूपिणे। कामपोषिणे
    (कामवेषाय) नमः । ४० ॐ कमलाक्षाय । गजाननाय (कलाधराय) । सुमुखाय । शर्मदाय । मूषकाधिपवाहनाय । शुद्धाय
    । दीर्घतुण्डाय (दीर्घतुण्डधराय) । श्रीपतये (श्रीमते) । अनन्ताय । मोहवर्जिताय नमः । ५० ॐ वक्रतुण्डाय
    । शूर्पकर्णाय । परमाय (पवनाय पावनाय) योगीशाय । योगधाम्ने (योगिवन्द्याङ्घ्रये) । उमासुताय (उमासूनवे)
    । आपद्धन्त्रे (अघापहाय) । एकदन्ताय । महाग्रीवाय । सिद्धसेनाय (सिद्धिसेविताय) नमः । ६० ॐ सिद्धवेदाय
    (सिद्धिदाय) । करुणाय । सिद्धाय । (करुणासिन्धवे) भगवते । अव्यग्राय (भव्यविग्रहाय) । विकटाय । कपिलाय
    । ढुण्ढिराजाय (ढुण्ढये) । उग्राय । भीमोदराय (भीमाय) । हराय नमः । ७० ॐ शुभाय । गणाध्यक्षाय । गणेशाय
    । गणाराध्याय । गणनायकाय । ज्योतिःस्वरूपाय । भूतात्मने । धूम्रकेतवे । अनुकूलाय । कुमारगुरवे नमः । ८०
    ॐ आनन्दाय । हेरम्बाय । वेदस्तुताय । नागयज्ञोपवीतिने । दुर्धर्षाय । बालदूर्वाङ्कुरप्रियाय । भालचन्द्राय
    । विश्वधात्रे (विश्वधाम्ने) । शिवपुत्राय । विनायकाय नमः । ९० ॐ लीलासेविताय (लीलावलम्बितवपुषे) । पूर्णाय
    । परमसुन्दराय । विघ्नान्तकाराय (विघ्नान्धकारमार्ताण्डाय विघ्नारण्यदावानलाय) । सिन्दूरवदनाय । नित्याय
    । विभवे । प्रथमपूजिताय (विष्णुप्रथमपूजिताय) । दिव्यपादाब्जाय (शरण्यदिव्यपादाब्जाय) । भक्तमन्दाराय
    (भक्तमन्दारभूरुहाय) नमः । १०० ॐ महाशूराय । रत्नसिंहासनाय (रत्नसिंहासनासीनाय) । मणिकुण्डलमण्डिताय ।
    भक्तकल्याणाय (भक्तकल्याणदाय) । अमेयाय । कल्याणगुरवे । (अमेयकल्याणगुणसंश्रयाय) सहस्रशीर्ष्णे । महागणपतये
    नमः । १०८ इति गणेशाष्टोत्तरशतनामावलिः समाप्ता ।
