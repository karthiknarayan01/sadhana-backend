id: manasollasah
category: stotram
name:
  english: manasollasah
  devanagari: मानसोल्लासः
content:
  english: bijasyantarivankuro jagadidam prannirvikalpam punah mayakalpitadeshakalakalanavaicitryacitrikritam
    | mayaviva vijrimbhayatyapi mahayogiva yahsvecchaya tasmai shri gurumurtaye nama idam shridakshinamurtaye
    || 2|| upadanam prapancasya samyuktah paramanavah | mridanvito ghatastasmadbhasate neshvaranvitah
    || 1|| paramanugata eva guna ruparasadayah | karye samanajatiyamarabhante gunantaram || 2|| karyam
    yatra samanveti karanam samavayi tat | cakradyam sadhanam yattu ghatasyasamavayi tat || 3|| samavayini
    tishthedyat samavayyashraye tatha | karye'vadhritasamarthyam kalpyate'samavayi tat || 4|| nimittam
    karanam teshamishvarashca kulalavat | yatkaryam jayate yasmattasmin tatpratitishthati || 5|| mrittikayam
    ghatastantau patah svarne'nguliyakam | iti vaisheshikah prahustatha naiyayika api || 6|| rajah sattvam
    tamashceti pradhanasya gunastrayah | rajo raktam calam teshu sattvam shuklam prakashakam || 7|| tamah
    krishnam cavarakam srishtisthityantahetavah | iti samkhyashca bhashante tesham dushana ucyate || 8||
    ankuradiphalanteshu karyeshvastitvamishyate | kuta agatya sambaddha vatabijeshu te kanah || 9|| karananugatam
    karyamiti sarvaishca sammatam | tasmatsatta sphuratta ca sarvatrapyanuvartate || 10|| pushpe phalatvamapanne
    kshire ca dadhitam gate | vijatiyah pratiyante guna ruparasadayah || 11|| karanam karyamamshom'shi
    jativyakti guni gunah | kriya kriyavanityadyah prakashasyaiva kalpanah || 12|| caitanyam paramanunam
    pradhanasyapi neshyate | jnanakriye jagatklriptau drishyete cetanashraye || 13|| kalarupakriyashaktya
    kshiratparinameddadhi | jnatrijnanajneyarupam jnanashaktya bhavejjagat || 14|| jnanam dvidha vastumatradyotakam
    nirvikalpakam | savikalpantu samjnadidyotakatvadanekadha || 15|| sankalpasamshayabhrantismritisadrishyanishcayah
    | uho'nadhyavasayashca tatha'nyenubhava api|| 16|| pratyakshamekam carvakah kanadasugatau punah |
    anumanan ca taccapi samkhyah shabdam ca te api || 17|| nyayaikadarshinopyavemupamanam ca ke cana |
    arthapattya sahaitani catvaryaha prabhakarah || 18|| abhavashashthanyetani bhatta vedantinastatha
    | sambhavaitihyayuktani tani pauranika jaguh || 19|| dravyam gunastatha karma samanyam ca visheshakam
    | samavayam ca kanadah padarthanshatpracakshate || 20|| nava dravyani bhutani dikkalatmamanamsi ca
    | caturvimshatireva syurgunah shabdadipancakam || 21|| parimanam ca sankhya ca dvau samyogavibhagakau
    | svabhavatah prithaktvam ca gurutvam dravata punah || 22|| paratvam caparatvam ca snehah samskara
    ityapi | dhirdveshasukhaduhkhecchadharmadharmaprayatnakah || 23|| samskarastrividho vega ishvadergatikaranam
    | drishtashrutanubhutarthasmritihetushca bhavana || 24|| sthitasthapakata nama purvavatsthitikaranam
    | akrishtashakhabhurjadau spashtamevopalakshyate || 25|| utkshepanamavakshepo gamanam ca prasaranam
    | akuncanamiti prahuh karma pancavidham budhah || 26|| samanyam dvividham proktam param caparameva
    ca | param sattaiva sarvatra tadanusyutavartanam || 27|| dravyatvam ca gunatvadyam samanyamaparam
    tatha | visheshah syuranantaste vyavrittijnanahetavah || 28|| rupasyeva ghate nityah sambandhah samavayakah
    | kalakashadigatmano nityashca vibhavashca te || 29|| caturvidhah paricchinna nityashca paramanavah
    | iti vaisheshikamate padarthah shat prakirtitah || 30|| maya pradhanamavyaktamavidya'jnanamaksharam
    | avyakritam ca prakritih tama ityabhidhiyate || 31|| mayayam brahmacaitanyapratibimbanushangatah
    | mahatkalapumamsah syuh mahattattvadahamkritih || 32|| tamasatsyurahankaratkhanilagnyambubhumayah
    | shabdah sparshashca rupam ca raso gandhopyanukramat || 33|| indriyanam ca vishaya bhutanamapi te
    gunah | devah sadashivashcesho rudro vishnushcaturmukhah || 34|| sattvikatsyadahankaradantahkaranadhindriyam
    | mano buddhirahankarashcittam karanamantaram || 35|| samshayo nishcayo garvah smaranam vishaya ami
    | candrah prajapati rudrah kshetrajna iti devatah || 36|| shrotram tvakcakshu jihva ghranam jnanendriyam
    viduh | digvatasuryavaruna nasatyau devatah smritah || 37|| rajasatsyurahankaratkarmendriyasamiranah
    | karmendriyani vakpanih padah payurupasthakam || 38|| vacanadanagamanavisarganandasamjnakah | vishaya
    devatastesham vahnindropendramrityukah || 39|| pranopanah samanashcodanavyanau ca vayavah | bhutaistu
    pancabhih pranaih caturdashabhirindriyaih || 40|| caturvimshatitattvani sankhyashastravido viduh |
    mahankalah pradhanam ca mayavidye ca purushah || 41|| iti pauranikah prahustrimshattattvani taih saha
    | bindunadau shaktishivau shantatitau tatah param || 42|| shattrimshattatvamityuktam shaivagamavisharadaih
    | sarve vikalpah pragasan bije'nkura ivatmani || 43|| icchajnanakriyarupamayaya te vijrimbhitah |
    icchajnanakriyapurva yasmatsarvah pravrittayah || 44|| sarve'pi jantavastasmadishvara iti nishcitah
    | bijadvrikshastarobijam paramparyena jayate || 45|| itishankanivrittyartham yogidrishtantakirtanam
    | vishvamitradayah purve paripakvasamadhayah || 46|| upadanopakaranaprayojanavivarjitah | svecchaya
    sasrijuh sargam sarvabhogopabrimhitam || 47|| ishvaro'nantashaktitvatsvatantro'nyanapekshakah | svecchamatrena
    sakalam srijatyavati hanti ca || 48|| na karakanam vyaparatkarta syannitya ishvarah | napi pramanavyaparat
    jnata'sau svaprakashakah || 49|| jnatritvamapi kartritvam svatantryattasya kevalam | ya cecchashaktivaicitri
    sa'sya svacchandakarita || 50|| yaya kartum na va kartumanyatha kartumarhati | svatantramishvareccham
    ke paricchetumiheshate || 51|| shrutishca so'kamayateticchaya srishtimishituh | tasmadatmana akashah
    sambhuta iti cabravit || 52|| nimittamatram cedasya jagatah parameshvarah | vikaritvam vinashitvam
    bhavedasya kulalavat || 53|| buddhyadayo nava gunah nitya eveshvarasya cet | nityecchavanam jagatsrishtau
    pravatetaiva sarvada || 54|| pravrittyuparamabhavatsamsaro naiva nashyati | mokshopadesho vyarthah
    syadagamo'pi nirarthakah || 55|| tasmanmayavilaso'yam jagatkartritvamishituh | bandhamokshopadeshadivyavaharo'pi
    mayaya || 56|| iti shridakshinamurtistotrarthapratipadake | prabandhe manasollase dvitiyollasasamgrahah
    || 57|| tritiyollasasamgrahah
  devanagari: बीजस्यान्तरिवाङ्कुरो जगदिदं प्राङ्निर्विकल्पं पुनः मायाकल्पितदेशकालकलनावैचित्र्यचित्रीकृतम्
    । मायावीव विजृम्भयत्यपि महायोगीव यःस्वेच्छया तस्मै श्री गुरुमूर्तये नम इदं श्रीदक्षिणामूर्तये ॥ २॥
    उपादानं प्रपञ्चस्य संयुक्ताः परमाणवः । मृदन्वितो घटस्तस्माद्भासते नेश्वरान्वितः ॥ १॥ परमाणुगता एव
    गुणा रूपरसादयः । कार्ये समानजातीयमारभन्ते गुणान्तरम् ॥ २॥ कार्यं यत्र समन्वेति कारणं समवायि तत् ।
    चक्राद्यं साधनं यत्तु घटस्यासमवायि तत् ॥ ३॥ समवायिनि तिष्ठेद्यत् समवाय्याश्रये तथा । कार्येऽवधृतसामर्थ्यं
    कल्प्यतेऽसमवायि तत् ॥ ४॥ निमित्तं कारणं तेषामीश्वरश्च कुलालवत् । यत्कार्यं जायते यस्मात्तस्मिन् तत्प्रतितिष्ठति
    ॥ ५॥ मृत्तिकायां घटस्तन्तौ पटः स्वर्णेऽङ्गुलीयकम् । इति वैशेषिकाः प्राहुस्तथा नैयायिका अपि ॥ ६॥ रजः
    सत्त्वं तमश्चेति प्रधानस्य गुणास्त्रयः । रजो रक्तं चलं तेषु सत्त्वं शुक्लं प्रकाशकम् ॥ ७॥ तमः कृष्णं
    चावरकं सृष्टिस्थित्यन्तहेतवः । इति सांख्याश्च भाषन्ते तेषां दूषण उच्यते ॥ ८॥ अङ्कुरादिफलान्तेषु कार्येष्वस्तित्वमिष्यते
    । कुत आगत्य सम्बद्धा वटबीजेषु ते कणाः ॥ ९॥ कारणानुगतं कार्यमिति सर्वैश्च सम्मतम् । तस्मात्सत्ता स्फुरत्ता
    च सर्वत्राप्यनुवर्तते ॥ १०॥ पुष्पे फलत्वमापन्ने क्षीरे च दधितां गते । विजातीयाः प्रतीयन्ते गुणा रूपरसादयः
    ॥ ११॥ कारणं कार्यमंशोंऽशी जातिव्यक्ती गुणी गुणः । क्रिया क्रियावानित्याद्याः प्रकाशस्यैव कल्पनाः ॥
    १२॥ चैतन्यं परमाणूनां प्रधानस्यापि नेष्यते । ज्ञानक्रिये जगत्क्लृप्तौ दृश्येते चेतनाश्रये ॥ १३॥ कालरूपक्रियाशक्त्या
    क्षीरात्परिणमेद्दधि । ज्ञातृज्ञानज्ञेयरूपं ज्ञानशक्त्या भवेज्जगत् ॥ १४॥ ज्ञानं द्विधा वस्तुमात्रद्योतकं
    निर्विकल्पकम् । सविकल्पन्तु संज्ञादिद्योतकत्वादनेकधा ॥ १५॥ सङ्कल्पसंशयभ्रान्तिस्मृतिसादृश्यनिश्चयाः
    । ऊहोऽनध्यवसायश्च तथाऽन्येनुभवा अपि॥ १६॥ प्रत्यक्षमेकं चार्वाकाः कणादसुगतौ पुनः । अनुमानञ् च तच्चापि
    सांख्याः शब्दं च ते अपि ॥ १७॥ न्यायैकदर्शिनोप्यवेमुपमानं च के चन । अर्थापत्त्या सहैतानि चत्वार्याह
    प्रभाकरः ॥ १८॥ अभावषष्ठान्येतानि भाट्टा वेदान्तिनस्तथा । सम्भवैतिह्ययुक्तानि तानि पौराणिका जगुः ॥
    १९॥ द्रव्यं गुणस्तथा कर्म सामन्यं च विशेषकम् । समवायं च काणादाः पदार्थान्षट्प्रचक्षते ॥ २०॥ नव द्रव्याणि
    भूतानि दिक्कालात्ममनांसि च । चतुर्विंशतिरेव स्युर्गुणाः शब्दादिपञ्चकम् ॥ २१॥ परिमाणं च सङ्ख्या च द्वौ
    संयोगविभागकौ । स्वभावतः पृथक्त्वं च गुरुत्वं द्रवता पुनः ॥ २२॥ परत्वं चापरत्वं च स्नेहः संस्कार इत्यपि
    । धीर्द्वेषसुखदुःखेच्छाधर्माधर्मप्रयत्नकाः ॥ २३॥ संस्कारस्त्रिविधो वेग इष्वादेर्गतिकारणम् । दृष्टश्रुतानुभूतार्थस्मृतिहेतुश्च
    भावना ॥ २४॥ स्थितस्थापकता नाम पूर्ववत्स्थितिकारणम् । आकृष्टशाखाभूर्जादौ स्पष्टमेवोपलक्ष्यते ॥ २५॥
    उत्क्षेपणमवक्षेपो गमनं च प्रसारणम् । आकुञ्चनमिति प्राहुः कर्म पञ्चविधं बुधाः ॥ २६॥ सामान्यं द्विविधं
    प्रोक्तं परं चापरमेव च । परं सत्तैव सर्वत्र तदनुस्यूतवर्तनम् ॥ २७॥ द्रव्यत्वं च गुणत्वाद्यं सामान्यमपरं
    तथा । विशेषाः स्युरनन्तास्ते व्यावृत्तिज्ञानहेतवः ॥ २८॥ रूपस्येव घटे नित्यः सम्बन्धः समवायकः । कालाकाशदिगात्मानो
    नित्याश्च विभवश्च ते ॥ २९॥ चतुर्विधाः परिच्छिन्ना नित्याश्च परमाणवः । इति वैशेषिकमते पदार्थाः षट्
    प्रकीर्तिताः ॥ ३०॥ माया प्रधानमव्यक्तमविद्याऽज्ञानमक्षरम् । अव्याकृतं च प्रकृतिः तम इत्यभिधीयते ॥
    ३१॥ मायायां ब्रह्मचैतन्यप्रतिबिम्बानुषङ्गतः । महत्कालपुमांसः स्युः महत्तत्त्वादहंकृतिः ॥ ३२॥ तामसात्स्युरहङ्कारात्खानिलाग्न्यम्बुभूमयः
    । शब्दः स्पर्शश्च रूपं च रसो गन्धोप्यनुक्रमात् ॥ ३३॥ इन्द्रियाणां च विषया भूतानामपि ते गुणाः । देवाः
    सदाशिवश्चेशो रुद्रो विष्णुश्चतुर्मुखः ॥ ३४॥ सात्त्विकात्स्यादहङ्कारादन्तःकरणधीन्द्रियम् । मनो बुद्धिरहङ्कारश्चित्तं
    करणमान्तरम् ॥ ३५॥ संशयो निश्चयो गर्वः स्मरणं विषया अमी । चन्द्रः प्रजापती रुद्रः क्षेत्रज्ञ इति देवताः
    ॥ ३६॥ श्रोत्रं त्वक्चक्षु जिह्वा घ्राणं ज्ञानेन्द्रियं विदुः । दिग्वातसूर्यवरुणा नासत्यौ देवताः स्मृताः
    ॥ ३७॥ राजसात्स्युरहङ्कारात्कर्मेन्द्रियसमीरणाः । कर्मेन्द्रियाणि वाक्पाणिः पादः पायुरुपस्थकम् ॥ ३८॥
    वचनादानगमनविसर्गानन्दसंज्ञकाः । विषया देवतास्तेषां वह्नीन्द्रोपेन्द्रमृत्युकाः ॥ ३९॥ प्राणोपानः समानश्चोदानव्यानौ
    च वायवः । भूतैस्तु पञ्चभिः प्राणैः चतुर्दशभिरिन्द्रियैः ॥ ४०॥ चतुर्विंशतितत्त्वानि साङ्ख्यशास्त्रविदो
    विदुः । महान्कालः प्रधानं च मायाविद्ये च पूरुषः ॥ ४१॥ इति पौराणिकाः प्राहुस्त्रिंशत्तत्त्वानि तैः
    सह । बिन्दुनादौ शक्तिशिवौ शान्तातीतौ ततः परम् ॥ ४२॥ षट्त्रिंशत्तत्वमित्युक्तं शैवागमविशारदैः । सर्वे
    विकल्पाः प्रागासन् बीजेऽङ्कुर इवात्मनि ॥ ४३॥ इच्छाज्ञानक्रियारूपमायया ते विजृम्भिताः । इच्छाज्ञानक्रियापूर्वा
    यस्मात्सर्वाः प्रवृत्तयः ॥ ४४॥ सर्वेऽपि जन्तवस्तस्मादीश्वरा इति निश्चिताः । बीजाद्वृक्षस्तरोबीजं पारम्पर्येण
    जायते ॥ ४५॥ इतिशङ्कानिवृत्त्यर्थं योगिदृष्टान्तकीर्तनम् । विश्वामित्रादयः पूर्वे परिपक्वसमाधयः ॥ ४६॥
    उपादानोपकरणप्रयोजनविवार्जिताः । स्वेच्छया ससृजुः सर्गं सर्वभोगोपबृंहितम् ॥ ४७॥ ईश्वरोऽनन्तशक्तित्वात्स्वतन्त्रोऽन्यानपेक्षकः
    । स्वेच्छामात्रेण सकलं सृजत्यवति हन्ति च ॥ ४८॥ न कारकाणां व्यापारात्कर्ता स्यान्नित्य ईश्वरः । नापि
    प्रमाणव्यापरात् ज्ञाताऽसौ स्वप्रकाशकः ॥ ४९॥ ज्ञातृत्वमपि कर्तृत्वं स्वातन्त्र्यात्तस्य केवलम् । या
    चेच्छाशक्तिवैचित्री साऽस्य स्वच्छन्दकारिता ॥ ५०॥ यया कर्तुं न वा कर्तुमन्यथा कर्तुमर्हति । स्वतन्त्रामीश्वरेच्छां
    के परिच्छेतुमिहेशते ॥ ५१॥ श्रुतिश्च सोऽकामयतेतीच्छया सृष्टिमीशितुः । तस्मादात्मन आकाशः सम्भूत इति
    चाब्रवीत् ॥ ५२॥ निमित्तमात्रं चेदस्य जगतः परमेश्वरः । विकारित्वं विनाशित्वं भवेदस्य कुलालवत् ॥ ५३॥
    बुद्ध्यादयो नव गुणाः नित्या एवेश्वरस्य चेत् । नित्येच्छावानं जगत्सृष्टौ प्रवतेतैव सर्वदा ॥ ५४॥ प्रवृत्त्युपरमाभावात्संसारो
    नैव नश्यति । मोक्षोपदेशो व्यर्थः स्यादागमोऽपि निरर्थकः ॥ ५५॥ तस्मान्मायाविलासोऽयं जगत्कर्तृत्वमीशितुः
    । बन्धमोक्षोपदेशादिव्यवहारोऽपि मायया ॥ ५६॥ इति श्रीदक्षिणामूर्तिस्तोत्रार्थप्रतिपादके । प्रबन्धे मानसोल्लासे
    द्वितीयोल्लाससंग्रहः ॥ ५७॥ तृतीयोल्लाससंग्रहः
