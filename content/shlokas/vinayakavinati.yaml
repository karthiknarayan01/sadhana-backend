id: vinayakavinati
category: stotram
name:
  english: vinayakavinati
  devanagari: विनायकविनति
content:
  english: padukam shadananagrajanujam | ahim nivarya mushakadhirakshakam mayurakam vilokya suprasannamanasam
    ganadhipam bhaje || harim nirikshya bhiticancalakshametya mataram nijavanaya parshvamagatam vilokya
    satvaram | tadiya
  devanagari: पादुकं षडाननाग्रजानुजम् । अहिं निवार्य मूषकाधिरक्षकं मयूरकं विलोक्य सुप्रसन्नमानसं गणाधिपं
    भजे ॥ हरिं निरीक्ष्य भीतिचञ्चलाक्षमेत्य मातरं निजावनाय पार्श्वमागतां विलोक्य सत्वरम् । तदीय
meaning: {}
