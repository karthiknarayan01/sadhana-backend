id: dakshastotramdevaihkritam
category: stotram
name:
  english: dakshastotramdevaihkritam
  devanagari: दक्षस्तोत्रम्देवैःकृतं
content:
  english: prasida sidatam brahmannasmakam bahuduhkhinam | uddharasva mahabuddhe trahi nah shokasagarat
    || 5|| yadrupam brahmasamjnantu srishtikrit paramatmanah | tadamshastvam param jyotirviprarupa namo'stute
    || 6|| rakshanat sarvajagatam prajapalanakaranat | dakshah prajapatishceti yogeshastam numo vayam
    || 7|| dakshaya sarvajagatam dakshaya kushalatmanam | dakshayatmahitayashu namastubhyam mahatmane
    || 8|| satatam cintyamanasya yogibhirniyatendriyaih | sarasya sarabhutastvam dakshaya paramatmane
    || 9|| yogivrittiranadhrishya paraganam parayanah | adyantamuktah sahasa tasmai nityam namo namah
    || 10|| iti kalikapurane ekavimshadhyayantargatam devaih kritam dakshastotram sampurnam |
  devanagari: प्रसीद सीदतां ब्रह्मन्नस्माकं बहुदुःखिनाम् । उद्धरस्व महाबुद्धे त्राहि नः शोकसागरात् ॥ ५॥
    यद्रूपं ब्रह्मसंज्ञन्तु सृष्टिकृत् परमात्मनः । तदंशस्त्वं परं ज्योतिर्विप्ररूप नमोऽस्तुते ॥ ६॥ रक्षणात्
    सर्वजगतां प्रजापालनकारणात् । दक्षः प्रजापतिश्चेति योगेशस्तं नुमो वयम् ॥ ७॥ दक्षाय सर्वजगतां दक्षाय
    कुशलात्मनाम् । दक्षायात्महितायाशु नमस्तुभ्यं महात्मने ॥ ८॥ सततं चिन्त्यमानस्य योगिभिर्नियतेन्द्रियैः
    । सारस्य सारभूतस्त्वं दक्षाय परमात्मने ॥ ९॥ योगिवृत्तिरनाधृष्य पारगाणां परायणः । आद्यन्तमुक्तः साहसा
    तस्मै नित्यं नमो नमः ॥ १०॥ इति कालिकापुराणे एकविंशाध्यायान्तर्गतं देवैः कृतं दक्षस्तोत्रं सम्पूर्णम्
    ।
