id: ganeshvarakritamskandakavacam
category: kavacha
name:
  english: ganeshvarakritamskandakavacam
  devanagari: गणेश्वरकृतंस्कन्दकवचम्
content:
  english: shikham rakshetkumarastu kartikeyah shiro'tu | lalatam parvatisunurvishakho'vatu bhruyugam
    || 158|| netre'vyatkrauncabhedi ca nasikam shikhivahanah | karnadvayam shaktidharah karnamule shadananah
    || 159|| gandayugmam mahasenah kapolau tarakantakah | oshthadvayam ca senani rasanam shikhiketanah
    || 160|| talum kaladharah patu damshtram devashikhamanih | gangeyashcubukam patu mukham patu shikhodbhavah
    || 161|| hanu harasutah patu patu kantham sadagnibhuh | grivam gaurisutah patu kakshau karunyavaridhih
    || 162|| skandhau mamavatatskando bahuleyo bhujau mama | bahu bhavodbhavah patu karau shanmaturo'vatu
    || 163|| anguli pingalah patu hridayam madhumitrajit | nabhim mamodaram caiva subrahmanyah sadavatu
    || 164|| madhyam jagadvibhuh patu nabhim dvadashalocanah | katim dvishadbhujah patu guhyam patu guhah
    sada || 165|| jaghanam jahnavisunuh prishtham pramathanayakah | uru payadumaputro januyugmam jagaddhitah
    || 166|| janghe patu jagatpujyah patu gulphau mahabalah | padau patu param jyotih sarvangam kukkutadhvajah
    || 167|| urdhvam patu mahodaro'pyadhastatpatu shankarih | parshvam nah patu papaghnah sarvatah patu
    shaktidhrik || 168|| purvahne'vyatparam brahma madhyahne'vatu tarajit | aparahne guhah patu ratrau
    daityantako'vatu || 169|| trisandhyam ca sudhih patu sarvada patu barhigah | bahishtham shanmukhah
    patu antahsyam krittikasutah || 170|| vrajantam surasainyeshah atantam pashadhrigvibhuh | shayanam
    patu shuraghno marge patu kumarakah || 171|| vane rane giricarah sada rakshatu mam vatuh | subrahmanyasya
    kavacam dharmakamarthamokshadam || 172|| mantranam paramam mantram guhyadguhyataram sada | pathan
    sha
  devanagari: शिखां रक्षेत्कुमारस्तु कार्तिकेयः शिरोऽतु । ललाटं पार्वतीसूनुर्विशाखोऽवतु भ्रूयुगम् ॥ १५८॥
    नेत्रेऽव्यात्क्रौञ्चभेदी च नासिकां शिखिवाहनः । कर्णद्वयं शक्तिधरः कर्णमूले षडाननः ॥ १५९॥ गण्डयुग्मं
    महासेनः कपोलौ तारकान्तकः । ओष्ठद्वयं च सेनानी रसनां शिखिकेतनः ॥ १६०॥ तालुं कलाधरः पातु दंष्ट्रां देवशिखामणिः
    । गाङ्गेयश्चुबुकं पातु मुखं पातु शिखोद्भवः ॥ १६१॥ हनू हरसुतः पातु पातु कण्ठं सदाग्निभूः । ग्रीवां
    गौरीसुतः पातु कक्षौ कारुण्यवारिधिः ॥ १६२॥ स्कन्धौ ममावतात्स्कन्दो बाहुलेयो भुजौ मम । बाहू भवोद्भवः
    पातु करौ षाण्मातुरोऽवतु ॥ १६३॥ अङ्गुली पिङ्गलः पातु हृदयं मधुमित्रजित् । नाभिं ममोदरं चैव सुब्रह्मण्यः
    सदावतु ॥ १६४॥ मध्यं जगद्विभुः पातु नाभिं द्वादशलोचनः । कटिं द्विषड्भुजः पातु गुह्यं पातु गुहः सदा
    ॥ १६५॥ जघनं जाह्नवीसूनुः पृष्ठं प्रमथनायकः । ऊरू पायादुमापुत्रो जानुयुग्मं जगद्धितः ॥ १६६॥ जङ्घे पातु
    जगत्पूज्यः पातु गुल्फौ महाबलः । पादौ पातु परं ज्योतिः सर्वाङ्गं कुक्कुटध्वजः ॥ १६७॥ ऊर्ध्वं पातु महोदारोऽप्यधस्तात्पातु
    शाङ्करिः । पार्श्वं नः पातु पापघ्नः सर्वतः पातु शक्तिधृक् ॥ १६८॥ पूर्वाह्णेऽव्यात्परं ब्रह्म मध्याह्नेऽवतु
    तारजित् । अपराह्णे गुहः पातु रात्रौ दैत्यान्तकोऽवतु ॥ १६९॥ त्रिसन्ध्यं च सुधीः पातु सर्वदा पातु बर्हिगः
    । बहिष्ठं षण्मुखः पातु अन्तःस्यं कृत्तिकासुतः ॥ १७०॥ व्रजन्तं सुरसैन्येशः अटन्तं पाशधृग्विभुः । शयानं
    पातु शूरघ्नो मार्गे पातु कुमारकः ॥ १७१॥ वने रणे गिरिचरः सदा रक्षतु मां वटुः । सुब्रह्मण्यस्य कवचं
    धर्मकामार्थमोक्षदम् ॥ १७२॥ मन्त्राणां परमं मन्त्रं गुह्याद्गुह्यतरं सदा । पठन् श
