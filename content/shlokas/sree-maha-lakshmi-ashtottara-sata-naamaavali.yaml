    namah om narayana samashritayai namah om daridrya dhvamsinyai namah om sarvopadrava varinyai namah
    om navadurgayai namah om mahakalyai namah om brahma vishnu shivatmikayai namah om trikala jnana sampannayai
    namah om bhuvaneshvaryai namah iti shrilakshmyashtottarashatanamavali samaptam
  devanagari: ॐ प्रकृत्यै नमः ॐ विकृत्यै नमः ॐ विद्यायै नमः ॐ सर्वभूत हितप्रदायै नमः ॐ श्रद्धायै नमः ॐ
    विभूत्यै नमः ॐ सुरभ्यै नमः ॐ परमात्मिकायै नमः ॐ वाचे नमः ॐ पद्मालयायै नमः ॐ पद्मायै नमः ॐ शुचये नमः
