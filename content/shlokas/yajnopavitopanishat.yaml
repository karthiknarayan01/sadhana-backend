id: yajnopavitopanishat
category: upanishad
name:
  english: yajnopavitopanishat
  devanagari: यज्नोपवीतोपनिषत्
content:
  english: yajnopavitopanishat yajnopaviti dhritacakradhari yo brahmavidbrahmavidam manishi hiranyamadaya
    sudarshanam kritva vahnisamyuktam stri shudro bahubhyam dharayet | tasmadgarbhena jayate | brahmanasya
    shariram jayate | shrivishnum sarveshvaram bhajanti || nasadikeshaparyantamurdhvapundram tu dharayet
    | uddhritasi varahena krishnena shatabahunam || bhumirdhenurdharani lokadharini || mrittike hana me
    papam tvayi sarvam pratishthitam || tasmaddvirekham bhavati tam devakiputram samashraye | agnina vai
    hotra cakram pancajanyam prataptam dvayorbhujayordharayet | atmakritamacaret | acaryasya sammukham
    prapadyeta | tasmadvaikuntham na punaragamanam salokyasamipyasarupyasayujyam gacchati | ya evam veda
    | ityupanishat ||
  devanagari: यज्ञोपवीतोपनिषत् यज्ञोपवीती धृतचक्रधारी यो ब्रह्मविद्ब्रह्मविदां मनीषी हिरण्यमादाय सुदर्शनं
    कृत्वा वह्निसंयुक्तं स्त्री शूद्रो बाहुभ्यां धारयेत् । तस्माद्गर्भेण जायते । ब्राह्मणस्य शरीरं जायते
    । श्रीविष्णुं सर्वेश्वरं भजन्ति ॥ नासादिकेशपर्यन्तमूर्ध्वपुण्ड्रं तु धारयेत् । उद्धृतासि वराहेण कृष्णेन
    शतबाहुनाम् ॥ भूमिर्धेनुर्धरणी लोकधारिणी ॥ मृत्तिके हन मे पापं त्वयि सर्वं प्रतिष्ठितम् ॥ तस्माद्द्विरेखं
    भवति तं देवकीपुत्रं समाश्रये । अग्निना वै होत्रा चक्रं पाञ्चजन्यं प्रतप्तं द्वयोर्भुजयोर्धारयेत् ।
    आत्मकृतमाचरेत् । आचार्यस्य सम्मुखं प्रपद्येत । तस्माद्वैकुण्ठं न पुनरागमनं सालोक्यसामीप्यसारूप्यसायुज्यं
    गच्छति । य एवं वेद । इत्युपनिषत् ॥
