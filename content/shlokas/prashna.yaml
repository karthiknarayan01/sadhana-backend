id: prashna
category: upanishad
name:
  english: prashna
  devanagari: प्रश्न
content:
  english: 7|| prithivi ca prithivimatra capashcapomatra ca tejashca tejomatra ca vayushca vayumatra cakashashcakashamatra
    ca cakshushca drashtavyam ca shrotram ca shrotavyam ca ghranam ca ghratavyam ca rasashca rasayitavyam
    ca tvakca sparshayitavyam ca vakca vaktavyam ca hastau cadatavyam copasthashcanandayitavyam ca payushca
    visarjayitavyam ca yadau ca gantavyam ca manashca mantavyam ca buddhishca boddhavyam cahankarashcahankartavyam
    ca cittam ca cetayitavyam ca tejashca vidyotayitavyam ca pranashca vidharayitavyam ca || 4
  devanagari: ७॥ पृथिवी च पृथिवीमात्रा चापश्चापोमात्रा च तेजश्च तेजोमात्रा च वायुश्च वायुमात्रा चाकाशश्चाकाशमात्रा
    च चक्षुश्च द्रष्टव्यं च श्रोत्रं च श्रोतव्यं च घ्राणं च घ्रातव्यं च रसश्च रसयितव्यं च त्वक्च स्पर्शयितव्यं
    च वाक्च वक्तव्यं च हस्तौ चादातव्यं चोपस्थश्चानन्दयितव्यं च पायुश्च विसर्जयितव्यं च यादौ च गन्तव्यं
    च मनश्च मन्तव्यं च बुद्धिश्च बोद्धव्यं चाहङ्कारश्चाहङ्कर्तव्यं च चित्तं च चेतयितव्यं च तेजश्च विद्योतयितव्यं
    च प्राणश्च विधारयितव्यं च ॥ ४
