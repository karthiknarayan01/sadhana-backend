id: carnatic-music-geethams-re-re-sri-ramachandra
category: stotram
name:
  english: Carnatic Music Geethams - Re Re Sri Ramachandra
content:
  english: tisra jati triputa talam angah paidala gurumurti shastri bhasha samskritam sahityam re re shri
    ramacandra raghuvamsha tilaka raghavendra ashrita jana poshakure sita manoranjanu rere dhira ravana
    surantukure ayiyare dinajana mandaru mamava svarah pa || ma ga ri | sa ri | ma ga || re | ra ghu ||
    ma ga ri | ri sa | sa || pa ma pa | ma ga | ri ri || ma ga ri | sa ri | sa sa || a || ri sa ri | ma
    ga | ri ri || po ma || ma ga ri | ma ma | pa ma || pa | yi ya | yi ya || pa ma pa | da sa || pa ma
    pa | ma ga | ri ri || da
  devanagari: तिस्र जाति त्रिपुट तालम् अङ्गाः पैडल गुरुमूर्ति शास्त्रि भाषा संस्कृतम् साहित्यम् रे रे
    श्री रामचन्द्र रघुवंश तिलक राघवेन्द्रा आश्रित जन पोषकुरे सीता मनोरञ्जनु रेरे धीर रावण सुरान्तुकुरे
    आयियरे दीनजन मन्दारु मामव स्वराः प ॥ म ग रि । स रि । म ग ॥ रे । र घु ॥ म ग रि । रि स । स ॥ प म प ।
    म ग । रि रि ॥ म ग रि । स रि । स स ॥ आ ॥ रि स रि । म ग । रि रि ॥ पो म ॥ म ग रि । म म । प म ॥ प । यि
    य । यि य ॥ प म प । द स ॥ प म प । म ग । रि रि ॥ दा
