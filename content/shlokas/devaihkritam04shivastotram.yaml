id: devaihkritam04shivastotram
category: stotram
name:
  english: devaihkritam04shivastotram
  devanagari: देवैःकृतं०४शिवस्तोत्रम्
content:
  english: devaih kritam 4 shivastotram deva ucuh | bhaktapriyatvam te nityam dushtahantritvameva ca |
    adikartarnamastubhyam nilakantha namo'stu te | brahmapriya namaste'stu devapriya namo'stu te || 27||
    shvetam dvijam bhaktamanayusham te netum yamadih sakalo'samarthah | santoshamaptah paramam samikshya
    bhaktapriyatvam tvayi natha satyam || 28|| ye tvam prapannah sharanam kripalum nalam kritanto'pyanuvikshitum
    tan | evam viditva shiva eva sarve tvameva bhaktya paraya bhajante || 29|| tvameva jagatam natha kim
    na smarasi shankara | tvam vina kah samartho'tra vyavastham kartumishvarah || 30|| iti brahmapurane
    caturnavatitamadhyayantargatam devaih kritam shivavastotram samaptam | brahmapurana | adhyaya 94
  devanagari: देवैः कृतं ४ शिवस्तोत्रम् देवा ऊचुः । भक्तप्रियत्वं ते नित्यं दुष्टहन्तृत्वमेव च । आदिकर्तर्नमस्तुभ्यं
    नीलकण्ठ नमोऽस्तु ते । ब्रह्मप्रिय नमस्तेऽस्तु देवप्रिय नमोऽस्तु ते ॥ २७॥ श्वेतं द्विजं भक्तमनायुषं
    ते नेतुं यमादिः सकलोऽसमर्थः । सन्तोषमाप्ताः परमं समीक्ष्य भक्तप्रियत्वं त्वयि नाथ सत्यम् ॥ २८॥ ये
    त्वां प्रपन्नाः शरणं कृपालुं नालं कृतान्तोऽप्यनुवीक्षितुं तान् । एवं विदित्वा शिव एव सर्वे त्वामेव
    भक्त्या परया भजन्ते ॥ २९॥ त्वमेव जगतां नाथ किं न स्मरसि शङ्कर । त्वां विना कः समर्थोऽत्र व्यवस्थां
    कर्तुमीश्वरः ॥ ३०॥ इति ब्रह्मपुराणे चतुर्नवतितमाध्यायान्तर्गतं देवैः कृतं शिववस्तोत्रं समाप्तम् ।
    ब्रह्मपुराण । अध्याय ९४
