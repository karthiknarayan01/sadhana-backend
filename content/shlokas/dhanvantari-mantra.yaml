id: dhanvantari-mantra
category: stotram
name:
  english: Dhanvantari Mantra
  devanagari: धन्वन्तरिमन्त्रः
content:
  english: 'atha shridhanvantarimantrasya apantaratabha rishih | trishtupchandah | dhanvantarirdevata
    | om bijam | svaha shaktih | sarvarogavinashanarthe viniyogah | mantranyasah - om namo bhagavate hrit
    | dhanvantaraye shirah | amritakalashahastaya shikha | sarvamayavinashanaya kavacam | trilokanathaya
    netram | vishnave svaha astram || dhyanam - shankham cakram jalu(lau)kam dadhadamritaghatam capi (caru)dorbhishcaturbhih
    sukshmasvacchatihridyam shukaparivilasanmaulimambhojanetram | (sukshmam svacchandahridyam kushaparivilasanmaulimambhojanetram
    |) kalambhodojjvalangam katitatavilasaccarupitambaradhyam vande dhanvantarim tam nikhilagadavanapraudha(vata)davagnililam
    || 1|| mantrah - om namo bhagavate dhanvantaraye amritakalashahastaya sarvamayavinashanaya trilokanathaya
    vishnave svaha | ityekacatvarimshadaksharo mantrah || notes:'
  devanagari: 'अथ श्रीधन्वन्तरिमन्त्रस्य अपान्तरतभा ऋषिः । त्रिष्टुप्छन्दः । धन्वन्तरिर्देवता । ॐ बीजम्
    । स्वाहा शक्तिः । सर्वरोगविनाशनार्थे विनियोगः । मन्त्रन्यासः - ॐ नमो भगवते हृत् । धन्वन्तरये शिरः
    । अमृतकलशहस्ताय शिखा । सर्वामयविनाशनाय कवचम् । त्रिलोकनाथाय नेत्रम् । विष्णवे स्वाहा अस्त्रम् ॥ ध्यानम्
    - शङ्खं चक्रं जलू(लौ)कां दधदमृतघटं चापि (चारु)दोर्भिश्चतुर्भिः सूक्ष्मस्वच्छातिहृद्यां शुकपरिविलसन्मौलिमम्भोजनेत्रम्
    । (सूक्ष्मं स्वच्छन्दहृद्यं कुशपरिविलसन्मौलिमम्भोजनेत्रम् ।) कालाम्भोदोज्ज्वलाङ्गं कटितटविलसच्चारूपीताम्बराढ्यम्
    वन्दे धन्वन्तरिं तं निखिलगदवनप्रौढ(वात)दावाग्निलीलम् ॥ १॥ मन्त्रः - ॐ नमो भगवते धन्वन्तरये अमृतकलशहस्ताय
    सर्वामयविनाशनाय त्रिलोकनाथाय विष्णवे स्वाहा । इत्येकचत्वारिंशदक्षरो मन्त्रः ॥ णोतेस्:'
meaning: {}
