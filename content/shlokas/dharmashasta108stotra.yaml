id: dharmashasta108stotra
category: stotram
name:
  english: dharmashasta108stotra
  devanagari: धर्मशास्ता१०८स्तोत्र
content:
  english: ringasamasino munisanghanishevitah || 7|| vedo bhadro jagannatho gananatho ganeshvarah | mahayogi
    mahamayi mahajnani mahasthirah || 8|| vedashasta bhutashasta bhimahasaparakramah | nagaharo nagakesho
    vyomakeshah sanatanah || 9|| saguno nirguno nityo nityatripto nirashrayah | lokashrayo ganadhishashcatushshashtikalamayah
    || 10|| rigyajuhsamatharvatma mallakasurabhanjanah | trimurtirdaityamathanah prakritih purushottamah
    || 11|| kalajnani mahajnani kamadah kamalekshanah | kalpavriksho mahavriksho vidyavriksho vibhutidah
    || 12|| samsaratapavicchetta pashulokabhayankarah | rogahanta pranadata paragarvavibhanjanah || 13||
    sarvashastrartha tattvajno nitiman papabhanjanah | pushkalapurnasamyuktah paramatma satangatih ||
    14|| anantadityasankashah subrahmanyanujo bali | bhaktanukampi devesho bhagavan bhaktavatsalah ||
    iti shridharmashastuh ashtottarashatanamastotram sampurnam ||
  devanagari: ृङ्गसमासीनो मुनिसङ्घनिषेवितः ॥ ७॥ वेदो भद्रो जगन्नाथो गणनाथो गणेश्वरः । महायोगी महामायी
    महाज्ञानी महास्थिरः ॥ ८॥ वेदशास्ता भूतशास्ता भीमहासपराक्रमः । नागहारो नागकेशो व्योमकेशः सनातनः ॥ ९॥
    सगुणो निर्गुणो नित्यो नित्यतृप्तो निराश्रयः । लोकाश्रयो गणाधीशश्चतुष्षष्टिकलामयः ॥ १०॥ ऋग्यजुःसामाथर्वात्मा
    मल्लकासुरभञ्जनः । त्रिमूर्तिर्दैत्यमथनः प्रकृतिः पुरुषोत्तमः ॥ ११॥ कालज्ञानी महाज्ञानी कामदः कमलेक्षणः
    । कल्पवृक्षो महावृक्षो विद्यावृक्षो विभूतिदः ॥ १२॥ संसारतापविच्छेत्ता पशुलोकभयङ्करः । रोगहन्ता प्राणदाता
    परगर्वविभञ्जनः ॥ १३॥ सर्वशास्त्रार्थ तत्त्वज्ञो नीतिमान् पापभञ्जनः । पुष्कलापूर्णासंयुक्तः परमात्मा
    सताङ्गतिः ॥ १४॥ अनन्तादित्यसङ्काशः सुब्रह्मण्यानुजो बली । भक्तानुकम्पी देवेशो भगवान् भक्तवत्सलः ॥
    इति श्रीधर्मशास्तुः अष्टोत्तरशतनामस्तोत्रं सम्पूर्णम् ॥
