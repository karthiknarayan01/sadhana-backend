id: shrimadbhagavatapuranam
category: purana
name:
  english: shrimadbhagavatapuranam
  devanagari: श्रीमद्भागवतपुराणम्
content:
  english: anukramanika puranani agnipuranam kurmapuranam garudapuranam naradapuranam padmapuranam brahmapuranam
    brahmavaivartapuranam brahmandapuranam bhavishyapuranam bhagavatapuranam matsyapuranam markandeyapuranam
    lingapuranam varahapuranam vamanapuranam vayupuranam vishnupuranam shivapuranam skandapuranam harivamshapuranam
    upapuranah kalkipuranam kalikapuranam devibhagavatapuranam vishnudharmottarapuranam ramayanam valmikiramayanam
    yogavasishthah samhitagranthah gargasamhita lakshminarayanasamhita vikirnagranthah jaiminiyashvamedhaparva
    skandhah 1 skandhah 2 skandhah 3 skandhah 4 skandhah 5 skandhah 6 skandhah 7 skandhah 8 skandhah 9
    skandhah 10 skandhah 11 skandhah 12 mahatmya
  devanagari: अनुक्रमणिका पुराणानि अग्निपुराणम् कूर्मपुराणम् गरुडपुराणम् नारदपुराणम् पद्मपुराणम् ब्रह्मपुराणम्
    ब्रह्मवैवर्तपुराणम् ब्रह्माण्डपुराणम् भविष्यपुराणम् भागवतपुराणम् मत्स्यपुराणम् मार्कण्डेयपुराणम् लिङ्गपुराणम्
    वराहपुराणम् वामनपुराणम् वायुपुराणम् विष्णुपुराणम् शिवपुराणम् स्कन्दपुराणम् हरिवंशपुराणम् उपपुराणाः
    कल्किपुराणम् कालिकापुराणम् देवीभागवतपुराणम् विष्णुधर्मोत्तरपुराणम् रामायणम् वाल्मीकिरामायणम् योगवासिष्ठः
    संहिताग्रन्थाः गर्गसंहिता लक्ष्मीनारायणसंहिता विकीर्णग्रन्थाः जैमिनीयाश्वमेधपर्व स्कन्धः १ स्कन्धः
    २ स्कन्धः ३ स्कन्धः ४ स्कन्धः ५ स्कन्धः ६ स्कन्धः ७ स्कन्धः ८ स्कन्धः ९ स्कन्धः १० स्कन्धः ११ स्कन्धः
    १२ माहात्म्य
meaning: {}
