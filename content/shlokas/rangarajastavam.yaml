id: rangarajastavam
category: shataka
name:
  english: rangarajastavam
  devanagari: रन्गराजस्तवम्
content:
  english: rinoshi atha te rangapate maheshituh | karanairapi kamakarinah ghatate sarvapathinamikshanam
    || 29|| sarvajnyenajnamulam jagadabhidadhato varitassakshimatrat sankhyoktatkaranam tvam parayati
    bhagavannaishvari rangashayin apreryo'nyaih svatantro'pratihati sadasatkarmacaitrya vicitram yatrecchaleshatastvam
    yugapadaganayan vishvamavishcakartha || 30|| karye'nante svatanumukhatastvamupadanamahuh sa te shaktissukaramitaracceti
    velam vilanghya | iccha yavadviharati sada rangarajanapeksha saivaishanadatishayakari sornanabhau
    vibhavya || 31|| svamahimasthitirisha bhrishakriyo'pyakalitashrama eva bibharshi yat | vapuriva svamasheshamidam
    balam tava parashritakaranavaranam || 32|| mriganabhigandha iva yatsakalarthan nijasannidheravikrito
    vikrinoshi | priyaranga viryamiti tattu vadante savikarakaranamito vinivaryam || 33|| sahakaryapekshamapi
    hatumiha tadanapekshakartrita | rangadhana jayati teja iti pranatartijit pratibhatabhibhavukam ||
    34|| martyautthayam virincavadhikamupari cotprekshya mimamsamana rangendranandavalli tava gunanivaham
    yauvananandapurvam | na svartham sprashtumishte skhalati pathi param mukalayam nililye hantaivam tvadgunanamavadhigananayoh
    ka katha cittavacoh || 35|| nyadhayishata ye guna nidhinidhayamaranyakeshvami mradimacaturipranatacapalakshantayah
    | dayavijayasaundariprabhritayo'pi ratnaughavat jagadvyavahritikshama varada rangaratnapane || 36||
    yamashrityaivatmambharaya iva te sadgunaganah prathante so'nantasvavashaghanashantoditadashah | tvameva
    tvam vettha stimitavitarangam varada bhoh svasamvedyasvatmadvayasabahulanandabharitam || 37|| aghrayeshvaragandhamishasadrisham
    manyastavendradayo muhyanti tvamanavilo niravadherbhumnah kanehatya yat | citriyemahi natra rangarasika
    tvam tvanmahimnah parah vaipulyanmahitah svabhava iti va kinnama satmyam na te || 38|| shadgunyadvasudevah
    para iti sa bhavan muktabhogyo baladhyat bodhat sankarshanastvam harati vitanushe shastramaishvaryaviryat
    | pradyumnassargadharmau nayasi ca bhagavancchaktitejo'niruddhah bibhranah pasi tattvam gamayasi ca
    tatha vyuhya rangadhiraja || 39|| jagratsvapnatyalasaturiyaprayadhyatrikramavadupasyah | svamimstattatsahaparibarhah
    caturvyuham vahasi caturdha || 40|| acidavisheshitan pralayasimani samsaratah karanakaḻebarairghatayitum
    dayamanamanah | varada nijecchayaiva paravanakaroh prakritim mahadabhimanabhutakaranavalikorakinim
    || 41|| nimnonnatam ca karunam ca jagadvicitram karma vyapekshya srjatastava rangasheshin | vaishamyanirghrinatayorna
    khalu prasaktih tadbrahmasutrasacivah shrutayo grinanti || 42|| svadhine sahakarikaranagane kartushsharire'thava
    bhoktuh svanuvidhaparadhavidhayoh rajno yatha shasituh | daturva'rthijane katakshanamiva shrirangasarvasva
    te srashtussrijyadashavyapekshanamapi svatantryamevavahet || 43|| pralayasamayasuptam svam shariraikadesham
    varada cidacidakhyam svecchaya vistrinanah | khacitamiva kalapam citramatatya dhunvan anushikhini
    shikhiva kridasi shrisamaksham || 44|| bhuyo bhuyastvayi hitapare'pyutpathanatmanina
  devanagari: ृणोषि अथ ते रङ्गपते महेशितुः । करणैरपि कामकारिणः घटते सर्वपथीनमीक्षणम् ॥ २९॥ सार्वज्ञ्येनाज्ञमूलं
    जगदभिदधतो वारितास्साक्षिमात्रात् साङ्ख्योक्तात्कारणं त्वां परयति भगवन्नैश्वरी रङ्गशायिन् अप्रेर्योऽन्यैः
    स्वतन्त्रोऽप्रतिहति सदसत्कर्मचैत्र्या विचित्रं यत्रेच्छालेशतस्त्वं युगपदगणयन् विश्वमाविश्चकर्थ ॥ ३०॥
    कार्येऽनन्ते स्वतनुमुखतस्त्वामुपादानमाहुः सा ते शक्तिस्सुकरमितरच्चेति वेलां विलङ्घ्य । इच्छा यावद्विहरति
    सदा रङ्गराजानपेक्षा सैवैशानादतिशयकरि सोर्णनाभौ विभाव्या ॥ ३१॥ स्वमहिमस्थितिरीश भृशक्रियोऽप्यकलितश्रम
    एव बिभर्षि यत् । वपुरिव स्वमशेषमिदं बलं तव पराश्रितकारणवारणम् ॥ ३२॥ मृगनाभिगन्ध इव यत्सकलार्थान् निजसन्निधेरविकृतो
    विकृणोषि । प्रियरङ्ग वीर्यमिति तत्तु वदन्ते सविकारकारणमितो विनिवार्यम् ॥ ३३॥ सहकार्यपेक्षमपि हातुमिह
    तदनपेक्षकर्तृता । रङ्गधन जयति तेज इति प्रणतार्तिजित् प्रतिभटाभिभावुकम् ॥ ३४॥ मर्त्यौत्थायं विरिञ्चावधिकमुपरि
    चोत्प्रेक्ष्य मीमांसमाना रङ्गेन्द्रानन्दवल्ली तव गुणनिवहं यौवनानन्दपूर्वम् । न स्वार्थं स्प्रष्टुमीष्टे
    स्खलति पथि परं मूकलायं निलिल्ये हन्तैवं त्वद्गुणानामवधिगणनयोः का कथा चित्तवाचोः ॥ ३५॥ न्यधायिषत ये
    गुणा निधिनिधायमारण्यकेष्वमी म्रदिमचातुरीप्रणतचापलक्षान्तयः । दयाविजयसौन्दरीप्रभृतयोऽपि रत्नौघवत् जगद्व्यवहृतिक्षमा
    वरद रङ्गरत्नापणे ॥ ३६॥ यमाश्रित्यैवात्मम्भरय इव ते सद्गुणगणाः प्रथन्ते सोऽनन्तस्ववशघनशान्तोदितदशः
    । त्वमेव त्वां वेत्थ स्तिमितवितरङ्गं वरद भोः स्वसंवेद्यस्वात्मद्वयसबहुलानन्दभरितम् ॥ ३७॥ आघ्रायेश्वरगन्धमीशसदृशं
    मन्यास्तवेन्द्रादयो मुह्यन्ति त्वमनाविलो निरवधेर्भूम्नः कणेहत्य यत् । चित्रीयेमहि नात्र रङ्गरसिक त्वं
    त्वन्महिम्नः परः वैपुल्यान्महितः स्वभाव इति वा किन्नाम सात्म्यं न ते ॥ ३८॥ षाड्गुण्याद्वासुदेवः पर
    इति स भवान् मुक्तभोग्यो बलाढ्यात् बोधात् सङ्कर्षणस्त्वं हरति वितनुषे शास्त्रमैश्वर्यवीर्यात् । प्रद्युम्नस्सर्गधर्मौ
    नयसि च भगवञ्च्छक्तितेजोऽनिरुद्धः बिभ्राणः पासि तत्त्वं गमयसि च तथा व्यूह्य रङ्गाधिराज ॥ ३९॥ जाग्रत्स्वप्नात्यलसतुरीयप्रायध्यातृक्रमवदुपास्यः
    । स्वामिंस्तत्तत्सहपरिबर्हः चातुर्व्यूहं वहसि चतुर्धा ॥ ४०॥ अचिदविशेषितान् प्रलयसीमनि संसरतः करणकळेबरैर्घटयितुं
    दयमानमनाः । वरद निजेच्छयैव परवानकरोः प्रकृतिं महदभिमानभूतकरणावलिकोरकिणीम् ॥ ४१॥ निम्नोन्नतं च करुणं
    च जगद्विचित्रं कर्म व्यपेक्ष्य स्र्जतस्तव रङ्गशेषिन् । वैषम्यनिर्घृणतयोर्न खलु प्रसक्तिः तद्ब्रह्मसूत्रसचिवाः
    श्रुतयो गृणन्ति ॥ ४२॥ स्वाधीने सहकारिकारणगणे कर्तुश्शरीरेऽथवा भोक्तुः स्वानुविधापराधविधयोः राज्ञो
    यथा शासितुः । दातुर्वाऽर्थिजने कटाक्षाणमिव श्रीरङ्गसर्वस्व ते स्रष्टुस्सृज्यदशाव्यपेक्षणमपि स्वातन्त्र्यमेवावहेत्
    ॥ ४३॥ प्रलयसमयसुप्तं स्वं शरीरैकदेशं वरद चिदचिदाख्यं स्वेच्छया विस्तृणानः । खचितमिव कलापं चित्रमातत्य
    धून्वन् अनुशिखिनि शिखीव क्रीडसि श्रीसमक्षम् ॥ ४४॥ भूयो भूयस्त्वयि हितपरेऽप्युत्पथानात्मनीन
