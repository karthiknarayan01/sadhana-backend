id: sri-kamala-ashtottara-sata-namavali
category: stotram
name:
  english: Sri Kamala Ashtottara Sata Namavali
content:
  english: om mahamayayai namah | om mahalakshmyai namah | om mahavanyai namah | om maheshvaryai namah
    | om mahadevyai namah | om maharatryai namah | om mahishasuramardinyai namah | om kalaratryai namah
    | om kuhvai namah | om purnayai namah | | om anandayai namah | om adyayai namah | om bhadrikayai namah
    | om nishayai namah | om jayayai namah | om riktayai namah | om mahashaktyai namah | om devamatre
    namah | om krishodaryai namah | om shacyai namah | | om indranyai namah | om shakranutayai namah |
    om shankarapriyavallabhayai namah | om mahavarahajananyai namah | om madanonmathinyai namah | om mahyai
    namah | om vaikunthanatharamanyai namah | om vishnuvakshahsthalasthitayai namah | om vishveshvaryai
    namah | om vishvamatre namah | | om varadayai namah | om abhayadayai namah | om shivayai namah | om
    shulinyai namah | om cakrinyai namah | om mayai namah | om pashinyai namah | om shankhadharinyai namah
    | om gadinyai namah | om mundamalayai namah | | om kamalayai namah | om karunalayayai namah | om padmakshadharinyai
    namah | om ambayai namah | om mahavishnupriyankaryai namah | om golokanatharamanyai namah | om golokeshvarapujitayai
    namah | om gayayai namah | om gangayai namah | om yamunayai namah | | om gomatyai namah | om garudasanayai
    namah | om gandakyai namah | om sarayvai namah | om tapyai namah | om revayai namah | om payasvinyai
    namah | om narmadayai namah | om kaveryai namah | om kedarasthalavasinyai namah | | om kishoryai namah
    | om keshavanutayai namah | om mahendraparivanditayai namah | om brahmadidevanirmanakarinyai namah
    | om vedapujitayai namah | om kotibrahmandamadhyasthayai namah | om kotibrahmandakarinyai namah |
    om shrutirupayai namah | om shrutikaryai namah | om shrutismritiparayanayai namah | | om indirayai
    namah | om sindhutanayayai namah | om matangyai namah | om lokamatrikayai namah | om trilokajananyai
    namah | om tantrayai namah | om tantramantrasvarupinyai namah | om tarunyai namah | om tamohantryai
    namah | om mangalayai namah | | om mangalayanayai namah | om madhukaitabhamathanyai namah | om shumbhasuravinashinyai
    namah | om nishumbhadiharayai namah | om matre namah | om harishankarapujitayai namah | om sarvadevamayyai
    namah | om sarvayai namah | om sharanagatapalinyai namah | om sharanyayai namah | | om shambhuvanitayai
    namah | om sindhutiranivasinyai namah | om gandharvaganarasikayai namah | om gitayai namah | om govindavallabhayai
    namah | om trailokyapalinyai namah | om tattvarupayai namah | om tarunyapuritayai namah | om candravalyai
    namah | om candramukhyai namah | | om candrikayai namah | om candrapujitayai namah | om candrayai
    namah | om shashankabhaginyai namah | om gitavadyaparayanayai namah | om srishtirupayai namah | om
    srishtikaryai namah | om srishtisamharakarinyai namah | | iti shri kamalashtottarashatanamavalih ||
  devanagari: ॐ महामायायै नमः । ॐ महालक्ष्म्यै नमः । ॐ महावाण्यै नमः । ॐ महेश्वर्यै नमः । ॐ महादेव्यै
    नमः । ॐ महारात्र्यै नमः । ॐ महिषासुरमर्दिन्यै नमः । ॐ कालरात्र्यै नमः । ॐ कुह्वै नमः । ॐ पूर्णायै
    नमः । । ॐ आनन्दायै नमः । ॐ आद्यायै नमः । ॐ भद्रिकायै नमः । ॐ निशायै नमः । ॐ जयायै नमः । ॐ रिक्तायै
    नमः । ॐ महाशक्त्यै नमः । ॐ देवमात्रे नमः । ॐ कृशोदर्यै नमः । ॐ शच्यै नमः । । ॐ इन्द्राण्यै नमः । ॐ
    शक्रनुतायै नमः । ॐ शङ्करप्रियवल्लभायै नमः । ॐ महावराहजनन्यै नमः । ॐ मदनोन्मथिन्यै नमः । ॐ मह्यै नमः
    । ॐ वैकुण्ठनाथरमण्यै नमः । ॐ विष्णुवक्षःस्थलस्थितायै नमः । ॐ विश्वेश्वर्यै नमः । ॐ विश्वमात्रे नमः
    । । ॐ वरदायै नमः । ॐ अभयदायै नमः । ॐ शिवायै नमः । ॐ शूलिन्यै नमः । ॐ चक्रिण्यै नमः । ॐ मायै नमः ।
