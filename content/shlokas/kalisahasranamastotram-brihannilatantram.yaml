id: kalisahasranamastotram-brihannilatantram
category: stotram
name:
  english: kalisahasranamastotram (brihannilatantram)
  devanagari: कालीसहस्रनामस्तोत्रम् (बृहन्नीलतन्त्रम्)
content:
  english: niveshita | bhagadaksha bhagakranta bhagasaubhagyavarddhini ||66|| dakshakanya mahadaksha sarvadaksha
    pracandika | dandapriya dandarata dandatadanatatpara ||67|| dandabhita dandagata dandasammardane rata
    | suvedidandamadhyastha burbhuvahsvahsvarupini ||68|| adya durga jaya sukshma sukshmarupa jayakritih
    | kshemankari mahaghurna ghurnanasa vashankari ||69|| vishalavayava meghya trivalivalaya shubha |
    madonmatta madarata mattasuravinashini ||70|| madhukaitabhasamhantri nishumbhasuramardini | candarupa
    mahacandi candika candanayika ||71|| candogra candavarna pracanda candavati shiva | nilakara nilavarna
    nilendivaralocana ||72|| khadgahasta ca mridvangi tatha kharparadharini | bhima ca bhimavadana mahabhima
    bhayanaka ||73|| kalyani mangala shuddha tatha paramakautuka | parameshthi pararata paratparatara
    para ||74|| paranandasvarupa ca nityanandasvarupini | nitya nityapriya tandri bhavani bhavasundari
    ||75|| trailokyamohini siddha tatha siddhajanapriya | bhairavi bhairavaprita tatha bhairavamohini
    ||76|| matangi kamala lakshmih shodashi vishayatura | vishamagna visharata visharaksha jayadratha
    ||77|| kakapakshadhara nitya sarvavismayakarini | gadini kamini khadgamundamalavibhushita ||78|| yogishvari
    yogamata yoganandasvarupini | anandabhairavi nanda tatha nandajanapriya ||79|| nalini lalana shubhra
    shubhrananavibhushita | lalajjihva nilapada tatha sumakhadakshina ||80|| balibhakta balirata balibhogya
    maharata | phalabhogya phalarasa phalada shriphalapriya ||81|| phalini phalasamvajra phalaphalanivarini
    | phalaprita phalagata phalasandanasandhini ||82|| phalonmukhi sarvasttva mahasattva ca sattviki |
    sarvarupa sarvarata sarvasattvanivasini ||83|| maharupa mahabhaga mahameghasvarupini | bhayanasa ganarata
    ganaprita mahagatih ||84|| sadgatih satkritih svaksha shavasanagata shubha | trailokyamohini ganga
    svarganga svargavasini ||85|| mahananda sadananda nityanityasvarupika | satyagandha satyagana satyarupa
    mahakritih ||86|| shmashanabhairavi kali tatha bhayavimardini | tripura parameshani sundari purasundari
    ||87|| tripureshi pancadashi pancami puravasini | mahasaptadashi shashthi saptami ashtami tatha ||88||
    navami dashami devapriya caikadashi shiva | dvadashi parama divya nilarupa trayodashi ||89|| caturdashi
    paurnamasi rajarajeshvari tatha | tripura tripureshi ca tatha tripuramardini ||90|| sarvangasundari
    rakta raktavastropavitini | camari camaraprita camarasuramardini ||91|| manojna sundari ramya hamsi
    ca caruhasini | nitambini nitambadhya nitambagurushobhita ||92|| pattavastraparidhana pattavastradhara
    shubha | karpuracandravadana kunkumadravashobhita ||93|| prithivi prithurupa sa parthivendravinashini
    | ratnavedih suresha ca sureshi suramohini ||94|| shiromanirmanigriva maniratnavibhushita | urvashi
    shamani kali mahakalasvarupini ||95|| sarvarupa mahasattva rupantaravilasini | shiva shaiva ca rudrani
    tatha shivaninadrini ||96|| matangini bhramari ca tathaivanganamekhala | yogini dakini caiva tatha
    maheshvari para ||97|| alambusha bhavani ca mahavidyaughasambhrita | gridhrarupa brahmayonirmahananda
    mahodaya ||98|| virupaksha mahanada candarupa kritakritih | vararoha mahavalli mahatripurasundari
    ||99|| bhagatmika bhagadhararupini bhagamalini | lingabhidhayini devi mahamaya mahasmritih ||100||
    mahamedha mahashanta shantarupa varanana | lingamala lingabhusha bhagamalavibhushana ||101|| bhagalingamritaprita
    bhagalingamritatmika | bhagalingarcanaprita bhagalingasvarupini ||102|| svayambhukusumaprita svayambhukusumasana
    | svayambhukusumarata latalinganatatpara ||103|| surashana suraprita surasavavimardita | surapanamahatikshna
    sarvagamavinindita ||104|| kundagolasadaprita golapushpasadaratih | kundagolodbhavaprita kundagolodbhavatmika
    ||105|| svayambhava shiva dhatri pavani lokapavani | mahalakshmirmaheshani mahavishnuprabhavini ||106||
    vishnupriya vishnurata vishnubhaktiparayana | vishnorvakshahsthalastha ca vishnurupa ca vaishnavi
    ||107|| ashvini bharani caiva krittika rohini tatha | dhritirmedha tatha tushtih pushtirupa cita citih
    ||108|| citirupa citsvarupa jnanarupa sanatani | sarvavijnajaya gauri gauravarna shaci shiva ||109||
    bhavarupa bhavapara bhavani bhavamocini | punarvasustatha pushya tejasvi sindhuvasini ||110|| shukrashana
    shukrabhoga shukrotsaranatatpara | shukrapujya shukravandya shukrabhogya pulomaja ||111|| shukrarcya
    shukrasantushta sarvashukravimuktida | shukramurtih shukradeha shukrangi shukramohini ||112|| devapujya
    devarata yuvati sarvamangala | sarvapriyankari bhogya bhogarupa bhogakritih ||113|| bhagapreta bhagarata
    bhagapremapara tatha | bhagasammardanaprita bhagopari niveshita ||114|| bhagadaksha bhagakranta bhagasaubhagyavarddhini
    | dakshakanya mahadaksha sarvadaksha pradantika ||115|| dandapriya dandarata dandatadanatatpara |
    dandabhita dandagata dandasammardane rata ||116|| vedimandalamadhyastha bhurbhuvahsvahsvarupini |
    adya durga jaya sukshma sukshmarupa jayakritih ||117|| kshemankari mahaghurna ghurnanasa vashankari
    | vishalavayava medhya trivalivalaya shubha ||118|| madyonmatta madyarata mattasuravilasini | madhukaitabhasamhantri
    nishumbhasuramardini ||119|| candarupa mahacanda candika candanayika | candogra ca caturvarga tatha
    candavati shiva ||120|| niladeha nilavarna nilendivaralocana | nityanityapriya bhadra bhavani bhavasundari
    ||121|| bhairavi bhairavaprita tatha bhairavamohini | matangi kamala lakshmih shodashi bhishanatura
    ||122|| vishamagna visharata vishabhakshya jaya tatha | kakapakshadhara nitya sarvavismayakarini ||123||
    gadini kamini khadga mundamalavibhushita | yogeshvari yogarata yoganandasvarupini ||124|| anandabhairavi
    nanda tathanandajanapriya | nalini lalana shubhra shubhananavirajita ||125|| lalajjihva nilapada tatha
    sammukhadakshina | balibhakta balirata balibhogya maharata ||126|| phalabhogya phalarasa phaladatri
    phalapriya | phalini phalasamrakta phalaphalanivarini ||127|| phalaprita phalagata phalasandhanasandhini
    | phalonmukhi sarvasattva mahasattva ca sattvika ||128|| sarvarupa sarvarata sarvasattvanivasini |
    maharupa mahabhaga mahameghasvarupini ||129|| bhayanasha ganarata ganagita mahagatih | sadgatih satkritih
    sakshat sadasanagata shubha ||130|| trailokyamohini ganga svarganga svargavasini | mahananda sadananda
    nitya satyasvarupini ||131|| shukrasnata shukrakari shukrasevyatishukrini | mahashukra shukrarata
    shukrasrishtividhayini ||132|| sarada sadhakaprana sadhakapremavarddhini | sadhakabhishtada nityam
    sadhakapremasevita ||133|| sadhakapremasarvasva sadhakabhaktaraktapa | mallika malati jatih saptavarna
    mahakaca ||134|| sarvamayi sarvashubhra ganapatyaprada tatha | gagana gaganaprita tatha gaganavasini
    ||135|| gananathapriya bhavya bhavarca sarvamangala | guhyakali bhadrakali shivarupa satangatih ||136||
    sadbhakta satpara setuh sarvangasundari magha | kshinodari mahavega veganandasvarupini ||137|| rudhira
    rudhiraprita rudhiranandashobhana | pancami pancamaprita tatha pancamabhushana ||138|| pancamijapasampanna
    pancamiyajane rata | kakaravarnarupa ca kakarakshararupini ||139|| makarapancamaprita makarapancagocara
    | rivarnarupaprabhava rivarna sarvarupini ||140|| sarvani sarvanilaya sarvasarasamudbhava | sarveshvari
    sarvasara sarveccha sarvamohini ||141|| ganeshajanani durga mahamaya maheshvari | maheshajanani moha
    vidya vidyotani vibha ||142|| sthira ca sthiracitta ca susthira dharmaranjini | dharmarupa dharmarata
    dharmacaranatatpara ||143|| dharmanushthanasandarbha sarvasandarbhasundari | svadha svaha vashatkara
    shraushat vaushat svadhatmika ||144|| brahmani brahmasambandha brahmasthananivasini | padmayonih padmasamstha
    caturvargaphalaprada ||145|| caturbhuja shivayuta shivalingapraveshini | mahabhima carukeshi gandhamadanasamsthita
    ||146|| gandharvapujita gandha sugandha surapujita | gandharvanirata devi surabhi sugandha tatha ||147||
    padmagandha mahagandha gandhamoditadinmukha | kaladigdha kalarata mahishasuramardini ||148|| vidya
    vidyavati caiva vidyesha vijnasambhava | vidyaprada mahavani mahabhairavarupini ||149|| bhairavapremanirata
    mahakalarata shubha | maheshvari gajarudha gajendragamana tatha ||150|| yajnendralalana candi gajasanaparashraya
    | gajendramandagamana mahavidya mahojjvala ||151|| bagala vahini vriddha bala ca balarupini | balakridarata
    bala balasuravinashini ||152|| balyastha yauvanastha ca mahayauvanasamrata | vishishtayauvana kali
    krishnadurga sarasvati ||153|| katyayani ca camunda candasuravighatini | candamundadhara devi madhukaitabhanashini
    ||154|| brahmi maheshvari caindri varahi vaishnavi tatha | rudrakali vishalakshi bhairavi kalarupini
    ||155|| mahamaya mahotsaha mahacandavinashini | kulashrih kulasankirna kulagarbhanivasini ||156||
    kulangara kulayuta kulakuntalasamyuta | kuladarbhagraha caiva kulagartapradayini ||157|| kulapremayuta
    sadhvi shivapritih shivabalih | shivasakta shivaprana mahadevakritalaya ||158|| mahadevapriya kanta
    mahadevamadatura | mattamattajanapremadhatri vibhavavarddhini ||159|| madonmatta mahashuddha mattapremavibhushita
    | mattapramattavadana mattacumbanatatpara ||160|| mattakridatura bhaimi tatha haimavati matih | madatura
    madagata viparitaratatura ||161|| vittaprada vittarata vittavardhanatatpara | iti te kathitam sarvam
    kalinamasahasrakam ||162|| saratsarataram divyam mahavibhavavarddhanam | ganapatyapradam rajyapradam
    shatkarmasadhakam ||163|| yah pathet sadhako nityam sa bhavet sampadam padam | yah pathet pathayedvapi
    shrinoti shravayedatha ||164|| na kincid durlabham loke stavasyasya prasadatah | brahmahatya surapanam
    suvarnaharanam tatha ||165|| gurudarabhigamanam yaccanyad dushkritam kritam | sarvametatpunatyeva
    satyam suraganarcite ||166|| rajasvalabhagam drishtva pathet stotramananyadhih | sa shivah satyavadi
    ca bhavatyeva na samshayah ||167|| paradarayuto bhutva pathet stotram samahitah | sarvaishvaryayuto
    bhutva maharajatvamapnuyat ||168|| paranindam paradroham parahimsam na karayet | shivabhaktaya shantaya
    priyabhaktaya va punah ||169|| stavam ca darshayedenamanyatha mrityumapnuyat | asmat parataram nasti
    tantramadhye sureshvari ||170|| mahakali mahadevi tatha nilasarasvati | na bhedah parameshani bhedakrinnarakam
    vrajet ||171|| idam stotram maya divyam tava snehat prakathyate | ubhayorevamekatvam bhedabuddhya
    na tam bhajet | sa yogi parameshani samo manapamanayoh ||172|| || iti shribrihannilatantre bhairavaparvatisamvade
    kalisahasranamanirupanam dvavimshah patalah ||
  devanagari: निवेशिता । भगदक्षा भगाक्रान्ता भगसौभाग्यवर्द्धिनी ॥६६॥ दक्षकन्या महादक्षा सर्वदक्षा प्रचण्डिका
    । दण्डप्रिया दण्डरता दण्डताडनतत्परा ॥६७॥ दण्डभीता दण्डगता दण्डसंमर्दने रता । सुवेदिदण्डमध्यस्था बूर्भुवःस्वःस्वरूपिणी
    ॥६८॥ आद्या दुर्गा जया सूक्ष्मा सूक्ष्मरूपा जयाकृतिः । क्षेमङ्करी महाघूर्णा घूर्णनासा वशङ्करी ॥६९॥
    विशालावयवा मेघ्या त्रिवलीवलया शुभा । मदोन्मत्ता मदरता मत्तासुरविनाशिनी ॥७०॥ मधुकैटभसंहन्त्री निशुम्भासुरमर्दिनी
    । चण्डरूपा महाचण्डी चण्डिका चण्डनायिका ॥७१॥ चण्डोग्रा चण्डवर्णा प्रचण्डा चण्डावती शिवा । नीलाकारा
    नीलवर्णा नीलेन्दीवरलोचना ॥७२॥ खड्गहस्ता च मृद्वङ्गी तथा खर्परधारिणी । भीमा च भीमवदना महाभीमा भयानका
    ॥७३॥ कल्याणी मङ्गला शुद्धा तथा परमकौतुका । परमेष्ठी पररता परात्परतरा परा ॥७४॥ परानन्दस्वरूपा च नित्यानन्दस्वरूपिणी
    । नित्या नित्यप्रिया तन्द्री भवानी भवसुन्दरी ॥७५॥ त्रैलोक्यमोहिनी सिद्धा तथा सिद्धजनप्रिया । भैरवी
    भैरवप्रीता तथा भैरवमोहिनी ॥७६॥ मातङ्गी कमला लक्ष्मीः षोडशी विषयातुरा । विषमग्ना विषरता विषरक्षा जयद्रथा
    ॥७७॥ काकपक्षधरा नित्या सर्वविस्मयकारिणी । गदिनी कामिनी खड्गमुण्डमालाविभूषिता ॥७८॥ योगीश्वरी योगमाता
    योगानन्दस्वरूपिणी । आनन्दभैरवी नन्दा तथा नन्दजनप्रिया ॥७९॥ नलिनी ललना शुभ्रा शुभ्राननविभूषिता । ललज्जिह्वा
    नीलपदा तथा सुमखदक्षिणा ॥८०॥ बलिभक्ता बलिरता बलिभोग्या महारता । फलभोग्या फलरसा फलदा श्रीफलप्रिया ॥८१॥
    फलिनी फलसंवज्रा फलाफलनिवारिणी । फलप्रीता फलगता फलसन्दानसन्धिनी ॥८२॥ फलोन्मुखी सर्वस्त्त्वा महासत्त्वा
    च सात्त्विकी । सर्वरूपा सर्वरता सर्वसत्त्वनिवासिनी ॥८३॥ महारूपा महाभागा महामेघस्वरूपिणी । भयनासा गणरता
    गणप्रीता महागतिः ॥८४॥ सद्गतिः सत्कृतिः स्वक्षा शवासनगता शुभा । त्रैलोक्यमोहिनी गङ्गा स्वर्गङ्गा स्वर्गवासिनी
    ॥८५॥ महानन्दा सदानन्दा नित्यानित्यस्वरूपिका । सत्यगन्धा सत्यगणा सत्यरूपा महाकृतिः ॥८६॥ श्मशानभैरवी
    काली तथा भयविमर्दिनी । त्रिपुरा परमेशानी सुन्दरी पुरसुन्दरी ॥८७॥ त्रिपुरेशी पञ्चदशी पञ्चमी पुरवासिनी
    । महासप्तदशी षष्ठी सप्तमी अष्टमी तथा ॥८८॥ नवमी दशमी देवप्रिया चैकादशी शिवा । द्वादशी परमा दिव्या नीलरूपा
    त्रयोदशी ॥८९॥ चतुर्दशी पौर्णमासी राजराजेश्वरी तथा । त्रिपुरा त्रिपुरेशी च तथा त्रिपुरमर्दिनी ॥९०॥
    सर्वाङ्गसुन्दरी रक्ता रक्तवस्त्रोपवीतिनी । चामरी चामरप्रीता चमरासुरमर्दिनी ॥९१॥ मनोज्ञा सुन्दरी रम्या
    हंसी च चारुहासिनी । नितम्बिनी नितम्बाढ्या नितम्बगुरुशोभिता ॥९२॥ पट्टवस्त्रपरिधाना पट्टवस्त्रधरा शुभा
    । कर्पूरचन्द्रवदना कुङ्कुमद्रवशोभिता ॥९३॥ पृथिवी पृथुरूपा सा पार्थिवेन्द्रविनाशिनी । रत्नवेदिः सुरेशा
    च सुरेशी सुरमोहिनी ॥९४॥ शिरोमणिर्मणिग्रीवा मणिरत्नविभूषिता । उर्वशी शमनी काली महाकालस्वरूपिणी ॥९५॥
    सर्वरूपा महासत्त्वा रूपान्तरविलासिनी । शिवा शैवा च रुद्राणी तथा शिवनिनाद्रिनी ॥९६॥ मातङ्गिनी भ्रामरी
    च तथैवाङ्गनमेखला । योगिनी डाकिनी चैव तथा महेश्वरी परा ॥९७॥ अलम्बुषा भवानी च महाविद्यौघसम्भृता । गृध्ररूपा
    ब्रह्मयोनिर्महानन्दा महोदया ॥९८॥ विरूपाक्षा महानादा चण्डरूपा कृताकृतिः । वरारोहा महावल्ली महात्रिपुरसुन्दरी
    ॥९९॥ भगात्मिका भगाधाररूपिणी भगमालिनी । लिङ्गाभिधायिनी देवी महामाया महास्मृतिः ॥१००॥ महामेधा महाशान्ता
    शान्तरूपा वरानना । लिङ्गमाला लिङ्गभूषा भगमालाविभूषणा ॥१०१॥ भगलिङ्गामृतप्रीता भगलिङ्गामृतात्मिका ।
    भगलिङ्गार्चनप्रीता भगलिङ्गस्वरूपिणी ॥१०२॥ स्वयम्भूकुसुमप्रीता स्वयम्भूकुसुमासना । स्वयम्भूकुसुमरता
    लतालिङ्गनतत्परा ॥१०३॥ सुराशना सुराप्रीता सुरासवविमर्दिता । सुरापानमहातीक्ष्णा सर्वागमविनिन्दिता ॥१०४॥
    कुण्डगोलसदाप्रीता गोलपुष्पसदारतिः । कुण्डगोलोद्भवप्रीता कुण्डगोलोद्भवात्मिका ॥१०५॥ स्वयम्भवा शिवा
    धात्री पावनी लोकपावनी । महालक्ष्मीर्महेशानी महाविष्णुप्रभाविनी ॥१०६॥ विष्णुप्रिया विष्णुरता विष्णुभक्तिपरायणा
    । विष्णोर्वक्षःस्थलस्था च विष्णुरूपा च वैष्णवी ॥१०७॥ अश्विनी भरणी चैव कृत्तिका रोहिणी तथा । धृतिर्मेधा
    तथा तुष्टिः पुष्टिरूपा चिता चितिः ॥१०८॥ चितिरूपा चित्स्वरूपा ज्ञानरूपा सनातनी । सर्वविज्ञजया गौरी
    गौरवर्णा शची शिवा ॥१०९॥ भवरूपा भवपर भवानी भवमोचिनी । पुनर्वसुस्तथा पुष्या तेजस्वी सिन्धुवासिनी ॥११०॥
    शुक्राशना शुक्रभोगा शुक्रोत्सारणतत्परा । शुक्रपूज्या शुक्रवन्द्या शुक्रभोग्या पुलोमजा ॥१११॥ शुक्रार्च्या
    शुक्रसन्तुष्टा सर्वशुक्रविमुक्तिदा । शुक्रमूर्तिः शुक्रदेहा शुक्राङ्गी शुक्रमोहिनी ॥११२॥ देवपूज्या
    देवरता युवती सर्वमङ्गला । सर्वप्रियङ्करी भोग्या भोगरूपा भोगाकृतिः ॥११३॥ भगप्रेता भगरता भगप्रेमपरा
    तथा । भगसंमर्दनप्रीता भगोपरि निवेशिता ॥११४॥ भगदक्षा भगाक्रान्ता भगसौभाग्यवर्द्धिनी । दक्षकन्या महादक्षा
    सर्वदक्षा प्रदन्तिका ॥११५॥ दण्डप्रिया दण्डरता दण्डताडनतत्परा । दण्डभीता दण्डगता दण्डसंमर्दने रता ॥११६॥
    वेदिमण्डलमध्यस्था भूर्भुवःस्वःस्वरूपिणी । आद्या दुर्गा जया सूक्ष्मा सूक्ष्मरूपा जयाकृतिः ॥११७॥ क्षेमङ्करी
    महाघूर्णा घूर्णनासा वशङ्करी । विशालावयवा मेध्या त्रिवलीवलया शुभा ॥११८॥ मद्योन्मत्ता मद्यरता मत्तासुरविलासिनी
    । मधुकैटभसंहन्त्री निशुम्भासुरमर्दिनी ॥११९॥ चण्डरूपा महाचण्डा चण्डिका चण्डनायिका । चण्डोग्रा च चतुर्वर्गा
    तथा चण्डावती शिवा ॥१२०॥ नीलदेहा नीलवर्णा नीलेन्दीवरलोचना । नित्यानित्यप्रिया भद्रा भवानी भवसुन्दरी
    ॥१२१॥ भैरवी भैरवप्रीता तथा भैरवमोहिनी । मातङ्गी कमला लक्ष्मीः षोडशी भीषणातुरा ॥१२२॥ विषमग्ना विषरता
    विषभक्ष्या जया तथा । काकपक्षधरा नित्या सर्वविस्मयकारिणी ॥१२३॥ गदिनी कामिनी खड्गा मुण्डमालाविभूषिता
    । योगेश्वरी योगरता योगानन्दस्वरूपिणी ॥१२४॥ आनन्दभैरवी नन्दा तथानन्दजनप्रिया । नलिनी ललना शुभ्रा शुभाननविराजिता
    ॥१२५॥ ललज्जिह्वा नीलपदा तथा संमुखदक्षिणा । बलिभक्ता बलिरता बलिभोग्या महारता ॥१२६॥ फलभोग्या फलरसा फलदात्री
    फलप्रिया । फलिनी फलसंरक्ता फलाफलनिवारिणी ॥१२७॥ फलप्रीता फलगता फलसन्धानसन्धिनी । फलोन्मुखी सर्वसत्त्वा
    महासत्त्वा च सात्त्विका ॥१२८॥ सर्वरूपा सर्वरता सर्वसत्त्वनिवासिनी । महारूपा महाभागा महामेघस्वरूपिणी
    ॥१२९॥ भयनाशा गणरता गणगीता महागतिः । सद्गतिः सत्कृतिः साक्षात् सदासनगता शुभा ॥१३०॥ त्रैलोक्यमोहिनी
    गङ्गा स्वर्गङ्गा स्वर्गवासिनी । महानन्दा सदानन्दा नित्या सत्यस्वरूपिणी ॥१३१॥ शुक्रस्नाता शुक्रकरी
    शुक्रसेव्यातिशुक्रिणी । महाशुक्रा शुक्ररता शुक्रसृष्टिविधायिनी ॥१३२॥ सारदा साधकप्राणा साधकप्रेमवर्द्धिनी
    । साधकाभीष्टदा नित्यं साधकप्रेमसेविता ॥१३३॥ साधकप्रेमसर्वस्वा साधकाभक्तरक्तपा । मल्लिका मालती जातिः
    सप्तवर्णा महाकचा ॥१३४॥ सर्वमयी सर्वशुभ्रा गाणपत्यप्रदा तथा । गगना गगनप्रीता तथा गगनवासिनी ॥१३५॥ गणनाथप्रिया
    भव्या भवार्चा सर्वमङ्गला । गुह्यकाली भद्रकाली शिवरूपा सताङ्गतिः ॥१३६॥ सद्भक्ता सत्परा सेतुः सर्वाङ्गसुन्दरी
    मघा । क्षीणोदरी महावेगा वेगानन्दस्वरूपिणी ॥१३७॥ रुधिरा रुधिरप्रीता रुधिरानन्दशोभना । पञ्चमी पञ्चमप्रीता
    तथा पञ्चमभूषणा ॥१३८॥ पञ्चमीजपसम्पन्ना पञ्चमीयजने रता । ककारवर्णरूपा च ककाराक्षररूपिणी ॥१३९॥ मकारपञ्चमप्रीता
    मकारपञ्चगोचरा । ऋवर्णरूपप्रभवा ऋवर्णा सर्वरूपिणी ॥१४०॥ सर्वाणी सर्वनिलया सर्वसारसमुद्भवा । सर्वेश्वरी
    सर्वसारा सर्वेच्छा सर्वमोहिनी ॥१४१॥ गणेशजननी दुर्गा महामाया महेश्वरी । महेशजननी मोहा विद्या विद्योतनी
    विभा ॥१४२॥ स्थिरा च स्थिरचित्ता च सुस्थिरा धर्मरञ्जिनी । धर्मरूपा धर्मरता धर्माचरणतत्परा ॥१४३॥ धर्मानुष्ठानसन्दर्भा
    सर्वसन्दर्भसुन्दरी । स्वधा स्वाहा वषट्कारा श्रौषट् वौषट् स्वधात्मिका ॥१४४॥ ब्राह्मणी ब्रह्मसम्बन्धा
    ब्रह्मस्थाननिवासिनी । पद्मयोनिः पद्मसंस्था चतुर्वर्गफलप्रदा ॥१४५॥ चतुर्भुजा शिवयुता शिवलिङ्गप्रवेशिनी
    । महाभीमा चारुकेशी गन्धमादनसंस्थिता ॥१४६॥ गन्धर्वपूजिता गन्धा सुगन्धा सुरपूजिता । गन्धर्वनिरता देवी
    सुरभी सुगन्धा तथा ॥१४७॥ पद्मगन्धा महागन्धा गन्धामोदितदिङ्मुखा । कालदिग्धा कालरता महिषासुरमर्दिनी ॥१४८॥
    विद्या विद्यावती चैव विद्येशा विज्ञसम्भवा । विद्याप्रदा महावाणी महाभैरवरूपिणी ॥१४९॥ भैरवप्रेमनिरता
    महाकालरता शुभा । माहेश्वरी गजारूढा गजेन्द्रगमना तथा ॥१५०॥ यज्ञेन्द्रललना चण्डी गजासनपराश्रया । गजेन्द्रमन्दगमना
    महाविद्या महोज्ज्वला ॥१५१॥ बगला वाहिनी वृद्धा बाला च बालरूपिणी । बालक्रीडारता बाला बलासुरविनाशिनी
    ॥१५२॥ बाल्यस्था यौवनस्था च महायौवनसंरता । विशिष्टयौवना काली कृष्णदुर्गा सरस्वती ॥१५३॥ कात्यायनी च
    चामुण्डा चण्डासुरविघातिनी । चण्डमुण्डधरा देवी मधुकैटभनाशिनी ॥१५४॥ ब्राह्मी माहेश्वरी चैन्द्री वाराही
    वैष्णवी तथा । रुद्रकाली विशालाक्षी भैरवी कालरूपिणी ॥१५५॥ महामाया महोत्साहा महाचण्डविनाशिनी । कुलश्रीः
    कुलसङ्कीर्णा कुलगर्भनिवासिनी ॥१५६॥ कुलाङ्गारा कुलयुता कुलकुन्तलसंयुता । कुलदर्भग्रहा चैव कुलगर्तप्रदायिनी
    ॥१५७॥ कुलप्रेमयुता साध्वी शिवप्रीतिः शिवाबलिः । शिवसक्ता शिवप्राणा महादेवकृतालया ॥१५८॥ महादेवप्रिया
    कान्ता महादेवमदातुरा । मत्तामत्तजनप्रेमधात्री विभववर्द्धिनी ॥१५९॥ मदोन्मत्ता महाशुद्धा मत्तप्रेमविभूषिता
    । मत्तप्रमत्तवदना मत्तचुम्बनतत्परा ॥१६०॥ मत्तक्रिडातुरा भैमी तथा हैमवती मतिः । मदातुरा मदगता विपरीतरतातुरा
    ॥१६१॥ वित्तप्रदा वित्तरता वित्तवर्धनतत्परा । इति ते कथितं सर्वं कालीनामसहस्रकम् ॥१६२॥ सारात्सारतरं
    दिव्यं महाविभववर्द्धनम् । गाणपत्यप्रदं राज्यप्रदं षट्कर्मसाधकम् ॥१६३॥ यः पठेत् साधको नित्यं स भवेत्
    सम्पदां पदम् । यः पठेत् पाठयेद्वापि शृणोति श्रावयेदथ ॥१६४॥ न किञ्चिद् दुर्लभं लोके स्तवस्यास्य प्रसादतः
    । ब्रह्महत्या सुरापानं सुवर्णहरणं तथा ॥१६५॥ गुरुदाराभिगमनं यच्चान्यद् दुष्कृतं कृतम् । सर्वमेतत्पुनात्येव
    सत्यं सुरगणार्चिते ॥१६६॥ रजस्वलाभगं दृष्ट्वा पठेत् स्तोत्रमनन्यधीः । स शिवः सत्यवादी च भवत्येव न संशयः
    ॥१६७॥ परदारयुतो भूत्वा पठेत् स्तोत्रं समाहितः । सर्वैश्वर्ययुतो भूत्वा महाराजत्वमाप्नुयात् ॥१६८॥ परनिन्दां
    परद्रोहं परहिंसां न कारयेत् । शिवभक्ताय शान्ताय प्रियभक्ताय वा पुनः ॥१६९॥ स्तवं च दर्शयेदेनमन्यथा
    मृत्युमाप्नुयात् । अस्मात् परतरं नास्ति तन्त्रमध्ये सुरेश्वरि ॥१७०॥ महाकाली महादेवी तथा नीलसरस्वती
    । न भेदः परमेशानि भेदकृन्नरकं व्रजेत् ॥१७१॥ इदं स्तोत्रं मया दिव्यं तव स्नेहात् प्रकथ्यते । उभयोरेवमेकत्वं
    भेदबुद्ध्या न तां भजेत् । स योगी परमेशानि समो मानापमानयोः ॥१७२॥ ॥ इति श्रीबृहन्नीलतन्त्रे भैरवपार्वतीसंवादे
    कालीसहस्रनामनिरूपणं द्वाविम्शः पटलः ॥
