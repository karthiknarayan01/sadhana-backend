id: sitakavacaananda
category: kavacha
name:
  english: sitakavacaananda
  devanagari: सीताकवचआनन्द
content:
  english: om hram sitayai hridayaya namah | om hrim ramayai shirase svaha | om hrum janakajayai shikhayai
    vashat | om hraim avanijayai kavacaya hum | om hraum padmakshasutayai netratrayaya vaushat | om hrah
    matulingyai astraya phat | bhurbhuvahsuvaromiti digbandhah || atha dhyanam | sitam kamalapatrakshim
    vidyutpuncasamaprabham | dvibhujam sukumarangim pitakausheyavasinim || 1|| simhasane ramacandravamabhagasthitam
    varam | nanalankarasamyuktam kundaladvayadharinim || 2|| cudakankanakeyurarashananupuranvitam | simante
    ravicandrabhyam nitile tilakena ca || 3|| mayurabharanenapi ghrane'tishobhitam shubham | haridram
    kajjalam divyam kunkumam kusumani ca || 4|| bibhrantim surabhidravyam sagandha snehamuttamam | smitananam
    gauravarnam mandarakusumam kare || 5|| bibhrantimapare haste matulingamanuttamam | ramyavasam ca bimboshthim
    candravahanalocanam || 6|| kalanathasamanasyam kalakanthamanoramam | matulingodbhavam devim padmakshaduhitam
    shubham || 7|| maithilim ramadayitam dasibhih parivijitam | evam dhyatva janakajam hemakumbhapayodharam
    || 8|| sitayah kavacam divyam pathaniyam shubhavaham || 9|| atha kavacam | om shrisita purvatah patu
    dakshine'vatu janaki | praticyam patu vaidehi patudicyam ca maithili || 1|| adhah patu matulingi urdhvam
    padmakshajavatu | madhye'vanisuta patu sarvatah patu mam rama || 2|| smitanana shirah patu patu bhalam
    nripatmaja | padma'vatu bhrivormadhye mrigakshi nayane'vatu || 3|| kapole karnamule ca patu shriramavallabha
    | nasagram sattviki patu patu vaktram tu rajasi || 4|| tamasi patu madvanim patu jihvam pativrata
    | dantan patu mahamaya cibukam kanakaprabha || 5|| patu kantham saumyarupa skandhau patu surarcita
    | bhujau patu vararoha karau kankanamandita || 6|| nakhan raktanakha patu kukshau patu laghudara |
    vakshah patu ramapatni parshve ravanamohini || 7|| prishthadeshe vahnigupta'vatu mam sarvadaiva hi
    | divyaprada patu nabhim katim rakshasamohini || 8|| guhyam patu ratnagupta lingam patu haripriya
    | uru rakshatu rambhoru januni priyabhashini || 9|| janghe patu sada subhruh gulphau camaravijita
    | padau lavasuta patu patvangani kushambika || 10|| padanguḻih sada patu mama nupuranihsvana | romanyavatu
    me nityam pitakausheyavasini || 11|| ratrau patu kalarupa dine danaikatatpara | sarvakaleshu mam patu
    mulakasuraghatini || 12|| evam sutikshna sitayah kavacam te mayeritam | idam pratah samutthaya snatva
    nityam pathettu yah || 13|| janakim pujayitva sa sarvan kamanavapnuyat | dhanarthi prapnuyaddravyam
    putrarthi putramapnuyat || 14|| strikamarthi shubham narim sukharthi saukhyamapnuyat | ashtavaram
    japaniyam sitayah kavacam sada || 15|| ashtabhyo vipravaryebhyo narah prityarpayet sada | phalapushpadikadini
    yani yani prithak prithak || 16|| sitayah kavacam cedam punyam patakanashanam | ye pathanti nara bhaktya
    te dhanya manava bhuvi || 17|| pathanti ramakavacam sitayah kavacam vina | tatha vina lakshmanasya
    kavacena vritha smritam || 18|| tasmat sada narairjapyam kavacanam catushtayam | adau tu vayuputrasya
    lakshmanasya tatah param || 19|| tatah pathecca sitayah shriramasya tatah param | evam sada japaniyam
    kavacanam catushtayam || 20|| iti shrishatakotiramayanantargate shrimadanandaramayane valmikiye manoharakande
    caturdashasargantargatam shrisitakavacam sampurnam ||
  devanagari: ॐ ह्रां सीतायै हृदयाय नमः । ॐ ह्रीं रमायै शिरसे स्वाहा । ॐ ह्रूं जनकजायै शिखायै वषट् । ॐ
    ह्रैं अवनिजायै कवचाय हुम् । ॐ ह्रौं पद्माक्षसुतायै नेत्रत्रयाय वौषट् । ॐ ह्रः मातुलिङ्ग्यै अस्त्राय
    फट् । भूर्भुवःसुवरोमिति दिग्बन्धः ॥ अथ ध्यानम् । सीतां कमलपत्राक्षीं विद्युत्पुञ्चसमप्रभाम् । द्विभुजां
    सुकुमाराङ्गीं पीतकौशेयवासिनीम् ॥ १॥ सिंहासने रामचन्द्रवामभागस्थितां वराम् । नानालङ्कारसम्युक्तां कुण्डलद्वयधारिणीम्
    ॥ २॥ चूडाकङ्कणकेयूररशनानूपुरान्विताम् । सीमन्ते रविचन्द्राभ्यां निटिले तिलकेन च ॥ ३॥ मयूराभरणेनापि
    घ्राणेऽतिशोभितां शुभाम् । हरिद्रां कज्जलं दिव्यं कुङ्कुमं कुसुमानि च ॥ ४॥ बिभ्रन्तीं सुरभिद्रव्यं
    सगन्ध स्नेहमुत्तमम् । स्मिताननां गौरवर्णां मन्दारकुसुमं करे ॥ ५॥ बिभ्रन्तीमपरे हस्ते मातुलिङ्गमनुत्तमम्
    । रम्यवासां च बिम्बोष्ठीं चन्द्रवाहनलोचनाम् ॥ ६॥ कलानाथसमानास्यां कलकण्ठमनोरमाम् । मातुलिङ्गोद्भवां
    देवीं पद्माक्षदुहितां शुभाम् ॥ ७॥ मैथिलीं रामदयितां दासीभिः परिवीजिताम् । एवं ध्यात्वा जनकजां हेमकुम्भपयोधराम्
    ॥ ८॥ सीतायाः कवचं दिव्यं पठनीयं शुभावहं ॥ ९॥ अथ कवचम् । ॐ श्रीसीता पूर्वतः पातु दक्षिणेऽवतु जानकी
    । प्रतीच्यां पातु वैदेही पातूदीच्यां च मैथिली ॥ १॥ अधः पातु मातुलिङ्गी ऊर्ध्वं पद्माक्षजावतु । मध्येऽवनिसुता
    पातु सर्वतः पातु मां रमा ॥ २॥ स्मितानना शिरः पातु पातु भालं नृपात्मजा । पद्माऽवतु भृवोर्मध्ये मृगाक्षी
    नयनेऽवतु ॥ ३॥ कपोले कर्णमूले च पातु श्रीरामवल्लभा । नासाग्रं सात्त्विकी पातु पातु वक्त्रं तु राजसी
    ॥ ४॥ तामसी पातु मद्वाणीं पातु जिह्वां पतिव्रता । दन्तान् पातु महामाया चिबुकं कनकप्रभा ॥ ५॥ पातु कण्ठं
    सौम्यरूपा स्कन्धौ पातु सुरार्चिता । भुजौ पातु वरारोहा करौ कङ्कणमण्डिता ॥ ६॥ नखान् रक्तनखा पातु कुक्षौ
    पातु लघूदरा । वक्षः पातु रामपत्नी पार्श्वे रावणमोहिनी ॥ ७॥ पृष्ठदेशे वह्निगुप्ताऽवतु मां सर्वदैव हि
    । दिव्यप्रदा पातु नाभिं कटिं राक्षसमोहिनी ॥ ८॥ गुह्यं पातु रत्नगुप्ता लिङ्गं पातु हरिप्रिया । ऊरू
    रक्षतु रम्भोरू जानुनी प्रियभाषिणी ॥ ९॥ जङ्घे पातु सदा सुभ्रूः गुल्फौ चामरवीजिता । पादौ लवसुता पातु
    पात्वङ्गानि कुशाम्बिका ॥ १०॥ पादाङ्गुळीः सदा पातु मम नूपुरनिःस्वना । रोमाण्यवतु मे नित्यं पीतकौशेयवासिनी
    ॥ ११॥ रात्रौ पातु कालरूपा दिने दानैकतत्परा । सर्वकालेषु मां पातु मूलकासुरघातिनी ॥ १२॥ एवं सुतीक्ष्ण
    सीतायाः कवचं ते मयेरितम् । इदं प्रातः समुत्थाय स्नात्वा नित्यं पठेत्तु यः ॥ १३॥ जानकीं पूजयित्वा स
    सर्वान् कामानवाप्नुयात् । धनार्थी प्राप्नुयाद्द्रव्यं पुत्रार्थी पुत्रमाप्नुयात् ॥ १४॥ स्त्रीकामार्थी
    शुभां नारीं सुखार्थि सौख्यमाप्नुयात् । अष्टवारं जपनीयं सीतायाः कवचं सदा ॥ १५॥ अष्टभ्यो विप्रवर्येभ्यो
    नरः प्रीत्यार्पयेत् सदा । फलपुष्पादिकादीनि यानि यानि पृथक् पृथक् ॥ १६॥ सीतायाः कवचं चेदं पुण्यं पातकनाशनम्
    । ये पठन्ति नरा भक्त्या ते धन्या मानवा भुवि ॥ १७॥ पठन्ति रामकवचं सीतायाः कवचं विना । तथा विना लक्ष्मणस्य
    कवचेन वृथा स्मृतम् ॥ १८॥ तस्मात् सदा नरैर्जाप्यं कवचानां चतुष्टयम् । आदौ तु वायुपुत्रस्य लक्ष्मणस्य
    ततः परम् ॥ १९॥ ततः पठेच्च सीतायाः श्रीरामस्य ततः परम् । एवं सदा जपनीयं कवचानां चतुष्टयम् ॥ २०॥ इति
    श्रीशतकोटिरामायणान्तर्गते श्रीमदानन्दरामायणे वाल्मिकीये मनोहरकाण्डे चतुर्दशसर्गान्तर्गतं श्रीसीताकवचं
    सम्पूर्णम् ॥
