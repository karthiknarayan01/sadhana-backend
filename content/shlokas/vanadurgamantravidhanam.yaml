id: vanadurgamantravidhanam
category: mantra
name:
  english: vanadurgamantravidhanam
  devanagari: वनदुर्गामन्त्रविधानम्
content:
  english: acamanani samarpayami || atha madhuparkam | durvankurasamayuktam gandhadisumanoharam | madhuparkam
    maya dattam narayani namo'stu te || shri vanadurgayai namah | madhuparkam samarpayami || atha pancamritasnanam
    | snanam pancamritam devi bhadrakali jaganmayi | bhaktya niveditam tubhyam vishveshvari namo'stu te
    || shri vanadurgayai namah | pancamritasnanam samarpayami || atha shuddhodakasnanam | shuddhodakasamayuktam
    gangasalilamuttamam | snanam grihana deveshi bhadrakali namo'stu te || shri vanadurgayai namah | shuddhodakasnanam
    samarpayami || atha vastram | vastram grihana deveshi devangasadrisham navam | vishveshvari mahamaye
    narayani namo'stu te || shri vanadurgayai namah | ratnadukulavastram samarpayami || atha kancukam
    | godavari namastubhyam sarvabhishtapradayini | sarvalakshanasambhute durge devi namo'stu te || shri
    vanadurgayai namah | ratnakancukam samarpayami || atha yajnopavitam | takshakanantakarkota nagayajnopavitine
    | sauvarnam yajnasutram te dadami harisevite || shri vanadurgayai namah | svarnayajnopavitam samarpayami
    || athabharanam | nanaratnavicitradhyan valayan sumanoharan | alankaran grihana tvam mamabhishtaprada
    bhava || shri vanadurgayai namah | abharanani samarpayami || atha gandhah | gandham candanasamyuktam
    kunkumadivimishritam | grihnishva devi lokeshi jaganmatarnamo'stu te || shri vanadurgayai namah |
    gandham samarpayami || atha bilvagandhah | bilvavrikshakritavase bilvapatrapriye shubhe | bilvavrikshasamudbhuto
    gandhashca pratigrihyatam || shri vanadurgayai namah | bilvagandham samarpayami || athakshatah | akshatan
    shubhadan devi haridracurnamishritan | pratigrihnishva kaumari durgadevi namo'stute || shri vanadurgayai
    namah | akshatan samarpayami || atha pushpani | malatibilvamandarakundajativimishritam | pushpam grihana
    deveshi sarvamangalada bhava || shivapatni shive devi shivabhaktabhayapahe | dronapushpam maya dattam
    grihana shivada bhava || shri vanadurgayai namah | nanavidha parimaḻa patrapushpani samarpayami ||
    atha angapuja | om varahyai namah padau pujayami | om camundayai namah janghe pujayami | om mahendryai
    namah januni pujayami | om vagishvaryai namah uru pujayami | om brahmanyai namah guhyam pujayami |
    om kalaratryai namah katim pujayami | om jaganmayayai namah nabhim pujayami | om maheshvaryai namah
    kukshim pujayami | om sarasvatyai namah hridayam pujayami | om katyayanyai namah kantham pujayami
    | om shivadutyai namah hastan pujayami | om narasimhyai namah bahun pujayami | om indranyai namah
    mukham pujayami | om shivayai namah nasikam pujayami | om shatakshyai namah karnau pujayami | om tripurahantryai
    namah netratrayam pujayami | om parameshvaryai namah lalatam pujayami | om shakambharyai namah shirah
    pujayami | om kaushikyai namah sarvani angani pujayami || atha bilvapatram | shrivrikshamamritodbhutam
    mahadevi priyam sada | bilvapatram prayacchami pavitram te sureshvari || shri vanadurgayai namah |
    bilvapatram samarpayami || atha pushpapuja | om durgayai namah tulasi pushpam samarpayami | om katyayanyai
    namah campakapushpam samarpayami | om kaumaryai namah jati pushpam samarpayami | om kalyai namah ketaki
    pushpam samarpayami | om gauryai namah karavirapushpam samarpayami | om lakshmyai namah utpalapushpam
    samarpayami | om sarvamangalayai namah mallikapushpam samarpayami | om indranyai namah yuthikapushpam
    samarpayami | om sarasvatyai namah kamalapushpam samarpayami | om shri bhagavatyai namah sarvani pushpani
    samarpayami || athavaranadevatah | prathamavaranadevatah || om uttishtha purushi hridayaya namah |
    om kim svapishi shirase svaha namah | om bhayam me samupasthitam shikhayai vashannamah | om yadi shakyamashakyam
    va kavacaya hum namah | om tanme bhagavati netratrayaya vaushannamah | om shamaya svaha astraya phannamah
    || 01|| dvitiyavarana devatah || om aryayai namah | om durgayai namah | om bhadrayai namah | om bhadrakaḻyai
    namah | om ambikayai namah | om kshemyayai namah | om vedagarbhayai namah | om kshemakaryai namah
    || 02|| tritiyavarana devatah || om araye namah | om daraya namah | om kripanaya namah | om khetaya
    namah | om banaya namah | om dhanushe namah | om shulaya namah | om kapalaya namah || 03|| caturthavaranadevatah
    || om brahmyai namah | om maheshvaryai namah | om kaumaryai namah | om vaishnavyai namah | om varahyai
    namah | om indranyai namah | om camundayai namah | om mahalakshmyai namah || 04|| pancamavarana devatah
    || om indraya namah | om agnaye namah | om yamaya namah | om nirritaye namah | om varunaya namah |
    om vayave namah | om somaya namah | om ishanaya namah | om brahmane namah | om anantaya namah || 05||
    iti || || shri durgashtottarashatanamavalih || om satyai namah | om sadhvyai namah | om bhavapritayai
    namah | om bhavanyai namah | om bhavamocanyai namah | om aryayai namah | om durgayai namah | om jayayai
    namah | om adyayai namah | om trinetrayai namah | om shuladharinyai namah | om pinakadharinyai namah
    | om citrayai namah | om candaghantayai namah | om mahatapayai namah | om manarupayai namah | om buddhyai
    namah | om ahankarayai namah | om cittarupayai namah | om citayai namah | 20 om cityai namah | om
    sarvamantramayyai namah | om sattayai namah | om satyanandasvarupinyai namah | om anantayai namah
    | om bhavinyai namah | om bhavyayai namah | om bhavyayai namah | om abhavyayai namah | om sadagatyai
    namah | om shambhavyai namah | om devamatre namah | om cintayai namah | om ratnapriyayaisadayai
  devanagari: आचमनानि समर्पयामि ॥ अथ मधुपर्कम् । दूर्वाङ्कुरसमायुक्तं गन्धादिसुमनोहरम् । मधुपर्कं मया
    दत्तं नारायणि नमोऽस्तु ते ॥ श्री वनदुर्गायै नमः । मधुपर्कं समर्पयामि ॥ अथ पञ्चामृतस्नानम् । स्नानं
    पञ्चामृतं देवि भद्रकालि जगन्मयि । भक्त्या निवेदितं तुभ्यं विश्वेश्वरि नमोऽस्तु ते ॥ श्री वनदुर्गायै
    नमः । पञ्चामृतस्नानं समर्पयामि ॥ अथ शुद्धोदकस्नानम् । शुद्धोदकसमायुक्तं गङ्गासलिलमुत्तमम् । स्नानं
    गृहाण देवेशि भद्रकालि नमोऽस्तु ते ॥ श्री वनदुर्गायै नमः । शुद्धोदकस्नानं समर्पयामि ॥ अथ वस्त्रम् ।
    वस्त्रं गृहाण देवेशि देवाङ्गसदृशं नवम् । विश्वेश्वरि महामाये नारायणि नमोऽस्तु ते ॥ श्री वनदुर्गायै
    नमः । रत्नदुकूलवस्त्रं समर्पयामि ॥ अथ कञ्चुकम् । गोदावरि नमस्तुभ्यं सर्वाभीष्टप्रदायिनि । सर्वलक्षणसम्भूते
    दुर्गे देवि नमोऽस्तु ते ॥ श्री वनदुर्गायै नमः । रत्नकञ्चुकं समर्पयामि ॥ अथ यज्ञोपवीतम् । तक्षकानन्तकर्कोट
    नागयज्ञोपवीतिने । सौवर्णं यज्ञसूत्रं ते ददामि हरिसेविते ॥ श्री वनदुर्गायै नमः । स्वर्णयज्ञोपवीतं समर्पयामि
    ॥ अथाभरणम् । नानारत्नविचित्राढ्यान् वलयान् सुमनोहरान् । अलङ्कारान् गृहाण त्वं ममाभीष्टप्रदा भव ॥ श्री
    वनदुर्गायै नमः । आभरणानि समर्पयामि ॥ अथ गन्धः । गन्धं चन्दनसंयुक्तं कुङ्कुमादिविमिश्रितम् । गृह्णीष्व
    देवि लोकेशि जगन्मातर्नमोऽस्तु ते ॥ श्री वनदुर्गायै नमः । गन्धं समर्पयामि ॥ अथ बिल्वगन्धः । बिल्ववृक्षकृतावासे
    बिल्वपत्रप्रिये शुभे । बिल्ववृक्षसमुद्भूतो गन्धश्च प्रतिगृह्यताम् ॥ श्री वनदुर्गायै नमः । बिल्वगन्धं
    समर्पयामि ॥ अथाक्षताः । अक्षतान् शुभदान् देवि हरिद्राचूर्णमिश्रितान् । प्रतिगृह्णीष्व कौमारि दुर्गादेवि
    नमोऽस्तुते ॥ श्री वनदुर्गायै नमः । अक्षतान् समर्पयामि ॥ अथ पुष्पाणि । मालतीबिल्वमन्दारकुन्दजातिविमिश्रितम्
    । पुष्पं गृहाण देवेशि सर्वमङ्गलदा भव ॥ शिवपत्नि शिवे देवि शिवभक्तभयापहे । द्रोणपुष्पं मया दत्तं गृहाण
    शिवदा भव ॥ श्री वनदुर्गायै नमः । नानाविध परिमळ पत्रपुष्पाणि समर्पयामि ॥ अथ अङ्गपूजा । ॐ वाराह्यै नमः
    पादौ पूजयामि । ॐ चामुण्डायै नमः जङ्घे पूजयामि । ॐ माहेन्द्र्यै नमः जानुनी पूजयामि । ॐ वागीश्वर्यै
    नमः ऊरू पूजयामि । ॐ ब्रह्माण्यै नमः गुह्यं पूजयामि । ॐ कालरात्र्यै नमः कटिं पूजयामि । ॐ जगन्मायायै
    नमः नाभिं पूजयामि । ॐ माहेश्वर्यै नमः कुक्षिं पूजयामि । ॐ सरस्वत्यै नमः हृदयं पूजयामि । ॐ कात्यायन्यै
    नमः कण्ठं पूजयामि । ॐ शिवदूत्यै नमः हस्तान् पूजयामि । ॐ नारसिंह्यै नमः बाहून् पूजयामि । ॐ इन्द्राण्यै
    नमः मुखं पूजयामि । ॐ शिवायै नमः नासिकां पूजयामि । ॐ शताक्ष्यै नमः कर्णौ पूजयामि । ॐ त्रिपुरहन्त्र्यै
    नमः नेत्रत्रयं पूजयामि । ॐ परमेश्वर्यै नमः ललाटं पूजयामि । ॐ शाकम्भर्यै नमः शिरः पूजयामि । ॐ कौशिक्यै
    नमः सर्वाणि अङ्गानि पूजयामि ॥ अथ बिल्वपत्रम् । श्रीवृक्षममृतोद्भूतं महादेवी प्रियं सदा । बिल्वपत्रं
    प्रयच्छामि पवित्रं ते सुरेश्वरी ॥ श्री वनदुर्गायै नमः । बिल्वपत्रं समर्पयामि ॥ अथ पुष्पपूजा । ॐ दुर्गायै
    नमः तुलसी पुष्पं समर्पयामि । ॐ कात्यायन्यै नमः चम्पकपुष्पं समर्पयामि । ॐ कौमार्यै नमः जाती पुष्पं
    समर्पयामि । ॐ काल्यै नमः केतकी पुष्पं समर्पयामि । ॐ गौर्यै नमः करवीरपुष्पं समर्पयामि । ॐ लक्ष्म्यै
    नमः उत्पलपुष्पं समर्पयामि । ॐ सर्वमङ्गलायै नमः मल्लिकापुष्पं समर्पयामि । ॐ इन्द्राण्यै नमः यूथिकापुष्पं
    समर्पयामि । ॐ सरस्वत्यै नमः कमलपुष्पं समर्पयामि । ॐ श्री भगवत्यै नमः सर्वाणि पुष्पाणि समर्पयामि ॥
    अथावरणदेवताः । प्रथमावरणदेवताः ॥ ॐ उत्तिष्ठ पुरुषि हृदयाय नमः । ॐ किं स्वपिषि शिरसे स्वाहा नमः । ॐ
    भयं मे समुपस्थितं शिखायै वषण्णमः । ॐ यदि शक्यमशक्यं वा कवचाय हुं नमः । ॐ तन्मे भगवति नेत्रत्रयाय वौषण्णमः
    । ॐ शमय स्वाहा अस्त्राय फण्णमः ॥ ०१॥ द्वितीयावरण देवताः ॥ ॐ आर्यायै नमः । ॐ दुर्गायै नमः । ॐ भद्रायै
    नमः । ॐ भद्रकाळ्यै नमः । ॐ अम्बिकायै नमः । ॐ क्षेम्यायै नमः । ॐ वेदगर्भायै नमः । ॐ क्षेमकार्यै नमः
    ॥ ०२॥ तृतीयावरण देवताः ॥ ॐ अरये नमः । ॐ दराय नमः । ॐ कृपाणाय नमः । ॐ खेटाय नमः । ॐ बाणाय नमः । ॐ धनुषे
    नमः । ॐ शूलाय नमः । ॐ कपालाय नमः ॥ ०३॥ चतुर्थावरणदेवताः ॥ ॐ ब्राह्म्यै नमः । ॐ माहेश्वर्यै नमः । ओं
    कौमार्यै नमः । ॐ वैष्णव्यै नमः । ॐ वाराह्यै नमः । ॐ इन्द्राण्यै नमः । ॐ चामुण्डायै नमः । ॐ महालक्ष्म्यै
    नमः ॥ ०४॥ पञ्चमावरण देवताः ॥ ॐ इन्द्राय नमः । ॐ अग्नये नमः । ॐ यमाय नमः । ॐ निरृतये नमः । ॐ वरुणाय
    नमः । ॐ वायवे नमः । ॐ सोमाय नमः । ॐ ईशानाय नमः । ॐ ब्रह्मणे नमः । ॐ अनन्ताय नमः ॥ ०५॥ इति ॥ ॥ श्री
    दुर्गाष्टोत्तरशतनामावलिः ॥ ॐ सत्यै नमः । ॐ साध्व्यै नमः । ॐ भवप्रीतायै नमः । ॐ भवान्यै नमः । ॐ भवमोचन्यै
    नमः । ॐ आर्यायै नमः । ॐ दुर्गायै नमः । ॐ जयायै नमः । ॐ आद्यायै नमः । ॐ त्रिनेत्रायै नमः । ॐ शूलधारिण्यै
    नमः । ॐ पिनाकधारिण्यै नमः । ॐ चित्रायै नमः । ॐ चण्डघण्टायै नमः । ॐ महातपायै नमः । ॐ मनरूपायै नमः ।
    ॐ बुद्ध्यै नमः । ॐ अहङ्कारायै नमः । ॐ चित्तरूपायै नमः । ॐ चितायै नमः । २० ॐ चित्यै नमः । ॐ सर्वमन्त्रमय्यै
    नमः । ॐ सत्तायै नमः । ॐ सत्यानन्दस्वरूपिण्यै नमः । ॐ अनन्तायै नमः । ॐ भाविन्यै नमः । ॐ भाव्यायै नमः
    । ॐ भव्यायै नमः । ॐ अभव्यायै नमः । ॐ सदागत्यै नमः । ॐ शाम्भव्यै नमः । ॐ देवमात्रे नमः । ॐ चिन्तायै
    नमः । ॐ रत्नप्रियायैसदायै
