id: shastakeshadipadantavarnanastotram
category: stotram
name:
  english: shastakeshadipadantavarnanastotram
  devanagari: शास्ताकेशादिपादान्तवर्णनस्तोत्रम्
content:
  english: makamranasamarunadharamayataksham | alambanam trijagatam pramathadhinatham manamraloka harinandanamashrayami
    || 3|| karnavalambimanikundalabhasamana gandasthalam samuditananapundarikam | arnojanabhaharayoriva
    murtimantam punyatirekamiva bhutapatim namami || 4|| uddandacarubhujadandayugagrasamstham kodandabanamahitantamatantaviryam
    | udyatprabhapataladipramadabhrasaram nityam prabhapatimaham pranato bhavami || 5|| maleyapankasamalankritabhasamana
    dorantaraḻataraḻamalaharajalam | nilatinirmaladukuladharam mukunda
  devanagari: माकम्रनासमरुणाधरमायताक्षम् । आलम्बनं त्रिजगतां प्रमथाधिनाथं मानम्रलोक हरिनन्दनमाश्रयामि
    ॥ ३॥ कर्णावलम्बिमणिकुण्डलभासमान गण्डस्थलं समुदिताननपुण्डरीकम् । अर्णोजनाभहरयोरिव मूर्तिमन्तं पुण्यातिरेकमिव
    भूतपतिं नमामि ॥ ४॥ उद्दण्डचारुभुजदण्डयुगाग्रसंस्थं कोदण्डबाणमहितान्तमतान्तवीर्यम् । उद्यत्प्रभापटलदीप्रमदभ्रसारं
    नित्यं प्रभापतिमहं प्रणतो भवामि ॥ ५॥ मालेयपङ्कसमलङ्कृतभासमान दोरन्तराळतरळामलहारजालम् । नीलातिनिर्मलदुकूलधरं
    मुकुन्द
