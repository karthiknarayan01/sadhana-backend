id: sri-durga-atharvasheersham
category: stotram
name:
  english: Sri Durga Atharvasheersham
content:
  english: om sarve vai deva devimupatasthuh kasi tva mbrahmasvarupini | mattah prakritipurushatmaka ||
    ahamanandananandau | aham vi~jnanavijnane | aha mbrahmabrahmani veditavye | aha mpancabhutanyapancabhutani
    | ahamakhila || aham rudrebhirvasubhishcarami | ahamadityairuta vishvadevaih | aha mmitravarunavubhau
    bibharmi | ahamindragni ahamashvinavubhau || mbrahmanamuta prajapati ndadhami dravinam havishmate
    supravye yajamanaya sunvate | aham rashtri sangamani vasuna ncikitushi prathama yajniyanam | aham
    suve pitaramasya murdhanmama yonirapsvanta ve~da | sa devim sampadamapnoti || namo devyai mahadevyai
    shivayai satata nnamah | namah prakrityai bhadrayai niyatah pranata nkarmaphaleshu jushta 'surannashayitryai
    te namah || va~camajanayanta devastam vi~shvarupah pashavo vadanti | sa no mandreshamurja nduhana
    dhenurvagasmanupa sushtutaitu || vai~shnavim skandamataram | sarasvatimaditi nnamamah pavanam shivam
    || || mahalakshmyai ca vidmahe sarvashaktyai ca dhimahi | tanno devi pracodayat || hyajanishta daksha
    ya duhita tava | ta ndeva anvajayanta bhadra amritabandhavah || || kamo yonih kamala vajrapani rguha
    hasa matarishvabhramindrah | punarguha sakala mayaya ca purucyaisha vishvamatadividyom || ''tmashaktih
    | esha vishvamohini | pashankushadhanurbanadhara | esha shrimahavidya | ya evam || namaste astu bhagavati
    matarasmanpahi sarvatah || || saishashtau vasavah | saishaikadasha rudrah | saisha dvadashadityah
    | saisha vishvedeva ssomapa asomapashca | saisha yatudhana asura rakshamsi pishaca yaksha siddhah
    | saisha sattvarajastamamsi | saisha brahmavishnurudrarupini | saisha prajapatindramanavah | saisha
    grahanakshatrajyotimshi | kalakashthadikalarupini | tamaha mpranaumi nityam | papapaharini mbhuktimuktipradayinim
    | anantam vi~jayam shuddham sharanyam shivadam shivam || vi~tihotrasamanvitam | ardhendulasita ndevya
    bijam sarvarthasadhakam || shshuddhacetasah | dhyayanti paramanandamaya jnanamburashayah || || vanmaya
    brahmasustasma va~ktrasamanvitam | suryo yu~ktashtattritiyakah | narayanena sammishro vayushcadharayuktatah
    | vicce navarnako ssyanmahadanandadayakah || || hritpundarikamadhyastha mpratassuryasamaprabham |
    pashankushadharam saumyam va~radabhayahastakam | trinetram raktavasana mmahabhayavinashinim | mahadurgaprashamani
    mmahakarunyarupinim || mbrahmadayo na jananti tasmaducyate ajneya | yasya anto na labhyate tasmaducyate
    ananta | yasya lakshya nnopalakshyate tasmaducyate alakshya | yasya janana nnopalabhyate tasmaducyate
    aja | ekaiva sarvatra vartate tasmaducyate eka | ekaiva vishvarupini tasmaducyate naika | ata evocyate
    ajneyanantalakshyajaika naiketi || mmatrika devi shabdana njnanarupini | jnanana ncinmayatita shunyanam
    shunyasakshini | yasyah paratara nnasti saisha durga prakirtita || nduracaravighatinim | namami bhavabhito
    'ham samsararnavatarinim || 'dhite sa pancatharvashir shajapaphalamapnoti | idamatharvashir 'rcam
    sthapayati | shatalaksha nna vindati | shatamashtottara ncasya purashcaryavidhi mpathedyastu sadyah
    papaih pramucyate | mahadurgani tarati mahadevyah prasadatah | || sayamadhiyano divasakrita nnashayati
    | prataradhiyano ratrikrita mpratah prayunjano apapo bhavati | nishithe turiyasandhyaya njaptva vaksiddhirbhavati
    | nutanaya njaptva devatasannidhya mbhavati | pranapratishthaya mpratishtha bhavati | bhaumashvinya
    mmahadevisannidhau japtva mahamrityu ntarati | sa mahamrityu ve~da | ityupanishat ||
  devanagari: ॐ सर्वे वै देवा देवीमुपतस्थुः कासि त्व म्ब्रह्मस्वरूपिणी । मत्तः प्रकृतिपुरुषात्मक ॥ अहमानन्दानानन्दौ
    । अहं विँज्ञानाविज्ञाने । अह म्ब्रह्माब्रह्मणि वेदितव्ये । अह म्पञ्चभूतान्यपञ्चभूतानि । अहमखिल ॥ अहं
    रुद्रेभिर्वसुभिश्चरामि । अहमादित्यैरुत विश्वदेवैः । अह म्मित्रावरुणावुभौ बिभर्मि । अहमिन्द्राग्नी
    अहमश्विनावुभौ ॥ म्ब्रह्माणमुत प्रजापति न्द॑धामि॒ द्रवि॑णं ह॒विष्म॑ते सुप्रा॒व्ये॒ यज॑मानाय सुन्व॒ते
    । अ॒हं राष्ट्री॑ स॒ङ्गम॑नी॒ वसू॑ना ञ्चिकि॒तुषी॑ प्रथ॒मा य॒ज्ञिया॑नाम् । अ॒हं सु॑वे पि॒तर॑मस्य मू॒र्धन्मम॒
    योनि॑र॒प्स्वन्त वेँद । स देवीं सम्पदमाप्नोति ॥ नमो देव्यै महादेव्यै शिवायै सतत न्नमः । नमः प्रकृत्यै
    भद्रायै नियताः प्रणता ङ्क॑र्मफ॒लेषु॒ जुष्टा ऽसुरान्नाशयित्र्यै ते नमः ॥ वाँच॑मजनयन्त दे॒वास्तां विँ॒श्वरू॑पाः
    प॒शवो॑ वदन्ति । सा नो॑ म॒न्द्रेष॒मूर्ज॒ न्दुहा॑ना धे॒नुर्वाग॒स्मानुप॒ सुष्टु॒तैतु॑ ॥ वैँष्णवीं स्कन्दमातरम्
    । सरस्वतीमदिति न्नमामः पावनां शिवाम् ॥ ॥ महालक्ष्म्यै च विद्महे सर्वशक्त्यै च धीमहि । तन्नो देवी प्रचोदयात्
    ॥ ह्यजनिष्ट दक्ष या दुहिता तव । ता न्देवा अन्वजायन्त भद्रा अमृतबन्धवः ॥ ॥ कामो योनिः कमला वज्रपाणि
    र्गुहा हसा मातरिश्वाभ्रमिन्द्रः । पुनर्गुहा सकला मायया च पुरूच्यैषा विश्वमातादिविद्योम् ॥ ऽऽत्मशक्तिः
    । एषा विश्वमोहिनी । पाशाङ्कुशधनुर्बाणधरा । एषा श्रीमहाविद्या । य एवं ॥ नमस्ते अस्तु भगवति मातरस्मान्पाहि
    सर्वतः ॥ ॥ सैषाष्टौ वसवः । सैषैकादश रुद्राः । सैषा द्वादशादित्याः । सैषा विश्वेदेवा स्सोमपा असोमपाश्च
    । सैषा यातुधाना असुरा रक्षांसि पिशाचा यक्षा सिद्धाः । सैषा सत्त्वरजस्तमांसि । सैषा ब्रह्मविष्णुरुद्ररूपिणी
    । सैषा प्रजापतीन्द्रमनवः । सैषा ग्रहनक्षत्रज्योतींषि । कलाकाष्ठादिकालरूपिणी । तामह म्प्रणौमि नित्यम्
    । पापापहारिणी म्भुक्तिमुक्तिप्रदायिनीम् । अनन्तां विँजयां शुद्धां शरण्यां शिवदां शिवाम् ॥ वीँतिहोत्रसमन्वितम्
    । अर्धेन्दुलसित न्देव्या बीजं सर्वार्थसाधकम् ॥ श्शुद्धचेतसः । ध्यायन्ति परमानन्दमया ज्ञानाम्बुराशयः
    ॥ ॥ वाङ्माया ब्रह्मसूस्तस्मा वँक्त्रसमन्वितम् । सूर्यो युँक्तष्टात्तृतीयकः । नारायणेन सम्मिश्रो वायुश्चाधरयुक्ततः
    । विच्चे नवार्णको स्स्यान्महदानन्ददायकः ॥ ॥ हृत्पुण्डरीकमध्यस्था म्प्रातस्सूर्यसमप्रभाम् । पाशाङ्कुशधरां
    सौम्यां वँरदाभयहस्तकाम् । त्रिनेत्रां रक्तवसना म्महाभयविनाशिनीम् । महादुर्गप्रशमनी म्महाकारुण्यरूपिणीम्
    ॥ म्ब्रह्मादयो न जानन्ति तस्मादुच्यते अज्ञेया । यस्या अन्तो न लभ्यते तस्मादुच्यते अनन्ता । यस्या लक्ष्य
    न्नोपलक्ष्यते तस्मादुच्यते अलक्ष्या । यस्या जनन न्नोपलभ्यते तस्मादुच्यते अजा । एकैव सर्वत्र वर्तते
    तस्मादुच्यते एका । एकैव विश्वरूपिणी तस्मादुच्यते नैका । अत एवोच्यते अज्ञेयानन्तालक्ष्याजैका नैकेति
    ॥ म्मातृका देवी शब्दाना ञ्ज्ञानरूपिणी । ज्ञानाना ञ्चिन्मयातीता शून्यानां शून्यसाक्षिणी । यस्याः परतर
    न्नास्ति सैषा दुर्गा प्रकीर्तिता ॥ न्दुराचारविघातिनीम् । नमामि भवभीतो ऽहं संसारार्णवतारिणीम् ॥ ऽधीते
    स पञ्चाथर्वशीर् षजपफलमाप्नोति । इदमथर्वशीर् ऽर्चां स्थापयति । शतलक्ष न्न विन्दति । शतमष्टोत्तर ञ्चास्य
    पुरश्चर्याविधि म्पठेद्यस्तु सद्यः पापैः प्रमुच्यते । महादुर्गाणि तरति महादेव्याः प्रसादतः । ॥ सायमधीयानो
    दिवसकृत न्नाशयति । प्रातरधीयानो रात्रिकृत म्प्रातः प्रयुञ्जानो अपापो भवति । निशीथे तुरीयसन्ध्याया
    ञ्जप्त्वा वाक्सिद्धिर्भवति । नूतनाया ञ्जप्त्वा देवतासान्निध्य म्भवति । प्राणप्रतिष्ठाया म्प्रतिष्ठा
    भवति । भौमाश्विन्या म्महादेवीसन्निधौ जप्त्वा महामृत्यु न्तरति । स महामृत्यु वेँद । इत्युपनिषत् ॥
