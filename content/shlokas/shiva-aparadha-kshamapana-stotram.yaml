id: shiva-aparadha-kshamapana-stotram
category: stotram
name:
  english: Shiva Aparadha Kshamapana Stotram
content:
  english: adau karmaprasangatkalayati kalusham matrikukshau sthitam mam vinmutramedhyamadhye kvathayati
    nitaram jatharo jatavedah | yadyadvai tatra duhkham vyathayati nitaram shakyate kena vaktum kshantavyo
    me'paradhah shiva shiva shiva bho shrimahadeva shambho || || balye duhkhatireko malalulitavapuh stanyapane
    pipasa no shaktashcendriyebhyo bhavagunajanitah jantavo mam tudanti | nanarogadiduhkhadrudanaparavashah
    shankaram na smarami kshantavyo me'paradhah shiva shiva shiva bho shrimahadeva shambho || || praudho'ham
    yauvanastho vishayavishadharaih pancabhirmarmasandhau dashto nashto vivekah sutadhanayuvatisvadusaukhye
    nishannah | shaivicintavihinam mama hridayamaho managarvadhirudham kshantavyo me'paradhah shiva shiva
    shiva bho shrimahadeva shambho || || vardhakye cendriyanam vigatagatimatishcadhidaivaditapaih papai
    rogairviyogaistvanavasitavapuh praudhahinam ca dinam | mithyamohabhilashairbhramati mama mano dhurjaterdhyanashunyam
    kshantavyo me'paradhah shiva shiva shiva bho shrimahadeva shambho || || snatva pratyushakale snapanavidhividhau
    nahritam gangatoyam pujartham va kadacidbahutaragahanatkhandabilvidalani | nanita padmamala sarasi
    vikasita gandhadhupaih tvadartham kshantavyo me'paradhah shiva shiva shiva bho shrimahadeva shambho
    || || dugdhairmadhvajyayuktairdadhisitasahitaih snapitam naiva lingam no liptam candanadyaih kanakaviracitaih
    pujitam na prasunaih | dhupaih karpuradipairvividharasayutairnaiva bhakshyopaharaih kshantavyo me'paradhah
    shiva shiva shiva bho shrimahadeva shambho || || no shakyam smartakarma pratipadagahanapratyavayakulakhyam
    shraute varta katham me dvijakulavihite brahmamarganusare | var brahmamarge susare jnato dharmo vicaraih
    shravanamananayoh kim nididhyasitavyam kshantavyo me'paradhah shiva shiva shiva bho shrimahadeva shambho
    || || dhyatva citte shivakhyam pracurataradhanam naiva dattam dvijebhyo havyam te lakshasankhyairhutavahavadane
    narpitam bijamantraih | no taptam gangatire vratajapaniyamaih rudrajapyairna vedaih kshantavyo me'paradhah
    shiva shiva shiva bho shrimahadeva shambho || || nagno nihsangashuddhastrigunavirahito dhvastamohandhakaro
    nasagre nyastadrishtirviditabhavaguno naiva drishtah kadacit | unmanya'vasthaya tvam vigatakalimalam
    shankaram na smarami kshantavyo me'paradhah shiva shiva shiva bho shrimahadeva shambho || || sthitva
    sthane saroje pranavamayamarutkumbhake sukshmamarge shante svante praline prakatitavibhave jyotirupe'parakhye
    | lingajne brahmavakye sakalatanugatam shankaram na smarami kshantavyo me'paradhah shiva shiva shiva
    bho shrimahadeva shambho || || hridyam vedantavedyam hridayasarasije diptamudyatprakasham satyam shantasvarupam
    sakalamunimanahpadmashandaikavedyam | jagratsvapne sushuptau trigunavirahitam shankaram na smarami
    kshantavyo me'paradhah shiva shiva shiva bho shrimahadeva shambho || || candrodbhasitashekhare smarahare
    gangadhare shankare sarpairbhushitakanthakarnavivare netrotthavaishvanare | yugale dantitvakkritasundarambaradhare
    trailokyasare hare mokshartham kuru cittavrittimacalamanyaistu kim karmabhih || || kim va'nena dhanena
    vajikaribhih praptena rajyena kim kim va putrakalatramitrapashubhirdehena gehena kim | jnatvaitatkshanabhanguram
    sapadi re tyajyam mano duratah svatmartham guruvakyato bhaja mana shriparvativallabham || || paurohityam
    rajanicaritam gramanitvam niyogo mathapatyam hyanritavacanam sakshivadah parannam | brahmadveshah
    khalajanaratih praninam nirdayatvam ma bhudevam mama pashupate janmajanmantareshu || || ayurnashyati
    pashyatam pratidinam yati kshayam yauvanam pratyayanti gatah punarna divasah kalo jagadbhakshakah
    | lakshmistoyatarangabhangacapala vidyuccalam jivitam tasmattvam sharanagatam sharanada tvam raksha
    rakshadhuna || || tasmanmam vande devamumapatim suragurum vande jagatkaranam vande pannagabhushanam
    mrigadharam vande pashunam patim | vande suryashashankavahninayanam vande mukundapriyam vande bhaktajanashrayam
    ca varadam vande shivam shankaram || || gatram bhasmasitam sitam ca hasitam haste kapalam sitam var
    smitam ca khatvangam ca sitam sitashca vrishabhah karne site kundale | ganga phenasita jata pashupateshcandrah
    sito murdhani so'yam sarvasito dadatu vibhavam papakshayam sarvada || || karacaranakritam vakkayajam
    karmajam va shravananayanajam va manasam va'paradham | vihitamavihitam va sarvametatkshmasva shiva
    shiva karunabdhe shrimahadeva shambho || || || iti shrimad shankaracaryakrita shivaparadhakshamapanastotram
    sampurnam ||
  devanagari: आदौ कर्मप्रसङ्गात्कलयति कलुषं मातृकुक्षौ स्थितं मां विण्मूत्रामेध्यमध्ये क्वथयति नितरां
    जाठरो जातवेदाः । यद्यद्वै तत्र दुःखं व्यथयति नितरां शक्यते केन वक्तुं क्षन्तव्यो मेऽपराधः शिव शिव
    शिव भो श्रीमहादेव शम्भो ॥ ॥ बाल्ये दुःखातिरेको मललुलितवपुः स्तन्यपाने पिपासा नो शक्तश्चेन्द्रियेभ्यो
    भवगुणजनिताः जन्तवो मां तुदन्ति । नानारोगादिदुःखाद्रुदनपरवशः शङ्करं न स्मरामि क्षन्तव्यो मेऽपराधः शिव
    शिव शिव भो श्रीमहादेव शम्भो ॥ ॥ प्रौढोऽहं यौवनस्थो विषयविषधरैः पञ्चभिर्मर्मसन्धौ दष्टो नष्टो विवेकः
    सुतधनयुवतिस्वादुसौख्ये निषण्णः । शैवीचिन्ताविहीनं मम हृदयमहो मानगर्वाधिरूढं क्षन्तव्यो मेऽपराधः शिव
    शिव शिव भो श्रीमहादेव शम्भो ॥ ॥ वार्धक्ये चेन्द्रियाणां विगतगतिमतिश्चाधिदैवादितापैः पापै रोगैर्वियोगैस्त्वनवसितवपुः
    प्रौढहीनं च दीनम् । मिथ्यामोहाभिलाषैर्भ्रमति मम मनो धूर्जटेर्ध्यानशून्यं क्षन्तव्यो मेऽपराधः शिव शिव
    शिव भो श्रीमहादेव शम्भो ॥ ॥ स्नात्वा प्रत्यूषकाले स्नपनविधिविधौ नाहृतं गाङ्गतोयं पूजार्थं वा कदाचिद्बहुतरगहनात्खण्डबिल्वीदलानि
    । नानीता पद्ममाला सरसि विकसिता गन्धधूपैः त्वदर्थं क्षन्तव्यो मेऽपराधः शिव शिव शिव भो श्रीमहादेव शम्भो
    ॥ ॥ दुग्धैर्मध्वाज्ययुक्तैर्दधिसितसहितैः स्नापितं नैव लिङ्गं नो लिप्तं चन्दनाद्यैः कनकविरचितैः पूजितं
    न प्रसूनैः । धूपैः कर्पूरदीपैर्विविधरसयुतैर्नैव भक्ष्योपहारैः क्षन्तव्यो मेऽपराधः शिव शिव शिव भो श्रीमहादेव
    शम्भो ॥ ॥ नो शक्यं स्मार्तकर्म प्रतिपदगहनप्रत्यवायाकुलाख्यं श्रौते वार्ता कथं मे द्विजकुलविहिते ब्रह्ममार्गानुसारे
    । वर् ब्रह्ममार्गे सुसारे ज्ञातो धर्मो विचारैः श्रवणमननयोः किं निदिध्यासितव्यं क्षन्तव्यो मेऽपराधः
    शिव शिव शिव भो श्रीमहादेव शम्भो ॥ ॥ ध्यात्वा चित्ते शिवाख्यं प्रचुरतरधनं नैव दत्तं द्विजेभ्यो हव्यं
    ते लक्षसङ्ख्यैर्हुतवहवदने नार्पितं बीजमन्त्रैः । नो तप्तं गाङ्गातीरे व्रतजपनियमैः रुद्रजाप्यैर्न वेदैः
    क्षन्तव्यो मेऽपराधः शिव शिव शिव भो श्रीमहादेव शम्भो ॥ ॥ नग्नो निःसङ्गशुद्धस्त्रिगुणविरहितो ध्वस्तमोहान्धकारो
    नासाग्रे न्यस्तदृष्टिर्विदितभवगुणो नैव दृष्टः कदाचित् । उन्मन्याऽवस्थया त्वां विगतकलिमलं शङ्करं न
    स्मरामि क्षन्तव्यो मेऽपराधः शिव शिव शिव भो श्रीमहादेव शम्भो ॥ ॥ स्थित्वा स्थाने सरोजे प्रणवमयमरुत्कुम्भके
    सूक्ष्ममार्गे शान्ते स्वान्ते प्रलीने प्रकटितविभवे ज्योतिरूपेऽपराख्ये । लिङ्गज्ञे ब्रह्मवाक्ये सकलतनुगतं
    शङ्करं न स्मरामि क्षन्तव्यो मेऽपराधः शिव शिव शिव भो श्रीमहादेव शम्भो ॥ ॥ हृद्यं वेदान्तवेद्यं हृदयसरसिजे
    दीप्तमुद्यत्प्रकाशं सत्यं शान्तस्वरूपं सकलमुनिमनःपद्मषण्डैकवेद्यम् । जाग्रत्स्वप्ने सुषुप्तौ त्रिगुणविरहितं
    शङ्करं न स्मरामि क्षन्तव्यो मेऽपराधः शिव शिव शिव भो श्रीमहादेव शम्भो ॥ ॥ चन्द्रोद्भासितशेखरे स्मरहरे
    गङ्गाधरे शङ्करे सर्पैर्भूषितकण्ठकर्णविवरे नेत्रोत्थवैश्वानरे । युगले दन्तित्वक्कृतसुन्दराम्बरधरे त्रैलोक्यसारे
    हरे मोक्षार्थं कुरु चित्तवृत्तिमचलामन्यैस्तु किं कर्मभिः ॥ ॥ किं वाऽनेन धनेन वाजिकरिभिः प्राप्तेन
    राज्येन किं किं वा पुत्रकलत्रमित्रपशुभिर्देहेन गेहेन किम् । ज्ञात्वैतत्क्षणभङ्गुरं सपदि रे त्याज्यं
    मनो दूरतः स्वात्मार्थं गुरुवाक्यतो भज मन श्रीपार्वतीवल्लभम् ॥ ॥ पौरोहित्यं रजनिचरितं ग्रामणीत्वं नियोगो
    माठापत्यं ह्यनृतवचनं साक्षिवादः परान्नम् । ब्रह्मद्वेषः खलजनरतिः प्राणिनां निर्दयत्वं मा भूदेवं मम
    पशुपते जन्मजन्मान्तरेषु ॥ ॥ आयुर्नश्यति पश्यतां प्रतिदिनं याति क्षयं यौवनं प्रत्यायान्ति गताः पुनर्न
    दिवसाः कालो जगद्भक्षकः । लक्ष्मीस्तोयतरङ्गभङ्गचपला विद्युच्चलं जीवितं तस्मात्त्वां शरणागतं शरणद त्वं
    रक्ष रक्षाधुना ॥ ॥ तस्मान्मां वन्दे देवमुमापतिं सुरगुरुं वन्दे जगत्कारणं वन्दे पन्नगभूषणं मृगधरं वन्दे
    पशूनां पतिम् । वन्दे सूर्यशशाङ्कवह्निनयनं वन्दे मुकुन्दप्रियं वन्दे भक्तजनाश्रयं च वरदं वन्दे शिवं
    शङ्करम् ॥ ॥ गात्रं भस्मसितं सितं च हसितं हस्ते कपालं सितं वर् स्मितं च खट्वाङ्गं च सितं सितश्च वृषभः
    कर्णे सिते कुण्डले । गङ्गा फेनसिता जटा पशुपतेश्चन्द्रः सितो मूर्धनि सोऽयं सर्वसितो ददातु विभवं पापक्षयं
    सर्वदा ॥ ॥ करचरणकृतं वाक्कायजं कर्मजं वा श्रवणनयनजं वा मानसं वाऽपराधम् । विहितमविहितं वा सर्वमेतत्क्ष्मस्व
    शिव शिव करुणाब्धे श्रीमहादेव शम्भो ॥ ॥ ॥ इति श्रीमद् शङ्कराचार्यकृत शिवापराधक्षमापणस्तोत्रं सम्पूर्णम्
    ॥
