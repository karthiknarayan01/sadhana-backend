id: sarveshtapradamgajananastotram
category: stotram
name:
  english: sarveshtapradamgajananastotram
  devanagari: सर्वेष्टप्रदंगजाननस्तोत्रम्
content:
  english: sarveshtapradam gajananastotram shriganeshaya namah | kapila uvaca | namaste vighnarajaya bhaktanam
    vighnaharine | abhaktanam visheshena vighnakartre namo namah || 1|| akashaya ca bhutanam manase camareshu
    te | buddhyairindriyavargeshu trividhaya namo namah || 2|| dehanam bindurupaya moharupaya dehinam
    | tayorabhedabhaveshu bodhaya te namo namah || 3|| sankhyaya vai videhanam samyoganam nijatmane |
    caturnam panca mayaiva sarvatra te namo namah || 4|| namarupatmakanam vai shaktirupaya te namah |
    atmanam ravaye tubhyam herambaya namo namah || 5|| anandanam mahavishnurupaya neti dharinam | shankaraya
    ca sarvesham samyoge ganapaya te || 6|| karmanam karmayogaya jnanayogaya janatam| sameshu samarupaya
    lambodara namo'stu te || 7|| svadhinanam ganadhyaksha sahajaya namo namah | teshamabhedabhaveshu svanandaya
    ca te namah || 8|| nirmayikasvarupanamayogaya namo namah | yoganam yogarupaya ganeshaya namo namah
    || 9|| shantiyogapradatre te shantiyogamayaya ca | kim staumi tatra devesha atastvam pranamamyaham
    || 10|| tatastam gananatho vai jagada bhaktamuttamam | harshena mahata yukto harshayanmunisattama
    || 11|| shriganesha uvaca | tvaya kritam madiyam yatstotram yogapradam bhavet | dharmarthakamamokshanam
    dayakam prabhavishyati || 12|| varam varaya mattastvam dasyami bhaktiyantritah | tvatsamo na bhavettata
    tattvajnanaprakashakah || 13|| tasya tadvacanam shrutva kapilastamuvaca ha | tvadiyamacalam bhaktim
    dehi vighnesha me param || 14|| tvadiyabhushanam daityo hritva sadyo jagama ha | tatashcintamanim
    natha tam jitva manimanaya || 15|| yadaham tvam smarishyami tadatmanam pradarshaya | etadeva varam
    purnam dehi natha namo'stu te || 16|| gritsamada uvaca | tasya tadvacanam shrutva harshayukto gajananah
    | uvaca tam mahabhaktam premayuktam visheshatah || 17|| tvaya yatprarthitam vishno tatsarvam prabhavishyati
    | tava putro bhavishyami ganasuravadhaya ca || 18|| evamuktvantardadhe'sau dhundhirajah pratapavan
    | munistam hridi sancintya svashramastho babhuva ha || 19|| iti shrimudgalapurane kapilamuniproktam
    gajananastotram samaptam |
  devanagari: सर्वेष्टप्रदं गजाननस्तोत्रम् श्रीगणेशाय नमः । कपिल उवाच । नमस्ते विघ्नराजाय भक्तानां विघ्नहारिणे
    । अभक्तानां विशेषेण विघ्नकर्त्रे नमो नमः ॥ १॥ आकाशाय च भूतानां मनसे चामरेषु ते । बुद्ध्यैरिन्द्रियवर्गेषु
    त्रिविधाय नमो नमः ॥ २॥ देहानां बिन्दुरूपाय मोहरूपाय देहिनाम् । तयोरभेदभावेषु बोधाय ते नमो नमः ॥ ३॥
    साङ्ख्याय वै विदेहानां संयोगानां निजात्मने । चतुर्णां पञ्च मायैव सर्वत्र ते नमो नमः ॥ ४॥ नामरूपात्मकानां
    वै शक्तिरूपाय ते नमः । आत्मनां रवये तुभ्यं हेरम्बाय नमो नमः ॥ ५॥ आनन्दानां महाविष्णुरूपाय नेति धारिणाम्
    । शङ्कराय च सर्वेषां संयोगे गणपाय ते ॥ ६॥ कर्मणां कर्मयोगाय ज्ञानयोगाय जानताम्। समेषु समरूपाय लम्बोदर
    नमोऽस्तु ते ॥ ७॥ स्वाधीनानां गणाध्यक्ष सहजाय नमो नमः । तेषामभेदभावेषु स्वानन्दाय च ते नमः ॥ ८॥ निर्मायिकस्वरूपाणामयोगाय
    नमो नमः । योगानां योगरूपाय गणेशाय नमो नमः ॥ ९॥ शान्तियोगप्रदात्रे ते शान्तियोगमयाय च । किं स्तौमि
    तत्र देवेश अतस्त्वां प्रणमाम्यहम् ॥ १०॥ ततस्तं गणनाथो वै जगाद भक्तमुत्तमम् । हर्षेण महता युक्तो हर्षयन्मुनिसत्तम
    ॥ ११॥ श्रीगणेश उवाच । त्वया कृतं मदीयं यत्स्तोत्रं योगप्रदं भवेत् । धर्मार्थकाममोक्षाणां दायकं प्रभविष्यति
    ॥ १२॥ वरं वरय मत्तस्त्वं दास्यामि भक्तियन्त्रितः । त्वत्समो न भवेत्तात तत्त्वज्ञानप्रकाशकः ॥ १३॥ तस्य
    तद्वचनं श्रुत्वा कपिलस्तमुवाच ह । त्वदीयामचलां भक्तिं देहि विघ्नेश मे पराम् ॥ १४॥ त्वदीयभूषणं दैत्यो
    हृत्वा सद्यो जगाम ह । ततश्चिन्तामणिं नाथ तं जित्वा मणिमानय ॥ १५॥ यदाहं त्वां स्मरिष्यामि तदात्मानं
    प्रदर्शय । एतदेव वरं पूर्णं देहि नाथ नमोऽस्तु ते ॥ १६॥ गृत्समद उवाच । तस्य तद्वचनं श्रुत्वा हर्षयुक्तो
    गजाननः । उवाच तं महाभक्तं प्रेमयुक्तं विशेषतः ॥ १७॥ त्वया यत्प्रार्थितं विष्णो तत्सर्वं प्रभविष्यति
    । तव पुत्रो भविष्यामि गणासुरवधाय च ॥ १८॥ एवमुक्त्वान्तर्दधेऽसौ ढुण्ढिराजः प्रतापवान् । मुनिस्तं हृदि
    सञ्चिन्त्य स्वाश्रमस्थो बभूव ह ॥ १९॥ इति श्रीमुद्गलपुराणे कपिलमुनिप्रोक्तं गजाननस्तोत्रं समाप्तम्
    ।
