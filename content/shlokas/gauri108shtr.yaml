id: gauri108shtr
category: stotram
name:
  english: gauri108shtr
  devanagari: गौरि१०८ष्त्र्
content:
  english: rinu stotram gaurinamabhirankitam | manoharam vanchitadam maha''padvinivaranam || 5|| stotrasya'sya
    rishih prokta angirashchanda iritah | anushtup devata gauri apannashaya yo japet || 6|| hram hrim
    ityadi vinyasya dhyatva stotramudirayet || || dhyanam || simhasamstham mecakabham kausumbhamshukashobhitam
    || 7|| khadgam khetam trishulanca mudgaram bibhratim karaih | candracudam trinayanam dhyayetgaurimabhishtadam
    || 8|| || stotram || om gauri gojanani vidya shiva devi maheshvari | narayana'nuja namrabhushana nutavaibhava
    || 9|| trinetra trishikha shambhusamshraya shashibhushana | shulahasta shrutadhara shubhada shubharupini
    || 10|| uma bhagavati ratrih somasurya'gnilocana | somasuryatmatatanka somasuryakucadvayi || 11||
    amba ambika ambujadhara amburupa''pyayini sthira | shivapriya shivankastha shobhana shumbhanashini
    || 12|| khadgahasta khaga khetadhara kha'cchanibhakritih | kausumbhacela kausumbhapriya kundanibhadvija
    || 13|| kali kapalini krura karavalakara kriya | kamya kumari kutila kumaramba kuleshvari || 14||
    mridani mrigashavakshi mridudeha mrigapriya | mrikandupujita madhvipriya matriganedita || 15|| matrika
    madhavi madyanmanasa madirekshana | modarupa modakari munidhyeya manonmani || 16|| parvatastha parvapujya
    parama paramarthada | paratpara paramarshamayi parinatakhila || 17|| pashisevya pashupatipriya pashuvrishastuta
    | pashyanti paracidrupa parivadahara para || 18|| sarvajna sarvarupa sa sampattih sampadunnata | apannivarini
    bhaktasulabha karunamayi || 19|| kalavati kalamula kalakalitavigraha | ganasevya ganeshana gatirgamanavarjita
    || 20|| ishvarishanadayita shaktih shamitapataka | pithaga pithikarupa prishatpujya prabhamayi ||
    21|| mahamaya matangeshta lokaloka shivangana || || phalashrutih || etatte'bhihitam rama
  devanagari: ृणु स्तोत्रं गौरीनामभिरङ्कितम् । मनोहरं वाञ्छितदं महाऽऽपद्विनिवारणम् ॥ ५॥ स्तोत्रस्याऽस्य
    ऋषिः प्रोक्त अङ्गिराश्छन्द ईरितः । अनुष्टुप् देवता गौरी आपन्नाशाय यो जपेत् ॥ ६॥ ह्रां ह्रीं इत्यादि
    विन्यस्य ध्यात्वा स्तोत्रमुदीरयेत् ॥ ॥ ध्यानम् ॥ सिंहसंस्थां मेचकाभां कौसुम्भांशुकशोभिताम् ॥ ७॥ खड्गं
    खेटं त्रिशूलञ्च मुद्गरं बिभ्रतीं करैः । चन्द्रचूडां त्रिनयनां ध्यायेत्गौरीमभीष्टदाम् ॥ ८॥ ॥ स्तोत्रम्
    ॥ ॐ गौरी गोजननी विद्या शिवा देवी महेश्वरी । नारायणाऽनुजा नम्रभूषणा नुतवैभवा ॥ ९॥ त्रिनेत्रा त्रिशिखा
    शम्भुसंश्रया शशिभूषणा । शूलहस्ता श्रुतधरा शुभदा शुभरूपिणी ॥ १०॥ उमा भगवती रात्रिः सोमसूर्याऽग्निलोचना
    । सोमसूर्यात्मताटङ्का सोमसूर्यकुचद्वयी ॥ ११॥ अम्बा अम्बिका अम्बुजधरा अम्बुरूपाऽऽप्यायिनी स्थिरा ।
    शिवप्रिया शिवाङ्कस्था शोभना शुम्भनाशिनी ॥ १२॥ खड्गहस्ता खगा खेटधरा खाऽच्छनिभाकृतिः । कौसुम्भचेला कौसुम्भप्रिया
    कुन्दनिभद्विजा ॥ १३॥ काली कपालिनी क्रूरा करवालकरा क्रिया । काम्या कुमारी कुटिला कुमाराम्बा कुलेश्वरी
    ॥ १४॥ मृडानी मृगशावाक्षी मृदुदेहा मृगप्रिया । मृकण्डुपूजिता माध्वीप्रिया मातृगणेडिता ॥ १५॥ मातृका
    माधवी माद्यन्मानसा मदिरेक्षणा । मोदरूपा मोदकरी मुनिध्येया मनोन्मनी ॥ १६॥ पर्वतस्था पर्वपूज्या परमा
    परमार्थदा । परात्परा परामर्शमयी परिणताखिला ॥ १७॥ पाशिसेव्या पशुपतिप्रिया पशुवृषस्तुता । पश्यन्ती परचिद्रूपा
    परीवादहरा परा ॥ १८॥ सर्वज्ञा सर्वरूपा सा सम्पत्तिः सम्पदुन्नता । आपन्निवारिणी भक्तसुलभा करुणामयी ॥
    १९॥ कलावती कलामूला कलाकलितविग्रहा । गणसेव्या गणेशाना गतिर्गमनवर्जिता ॥ २०॥ ईश्वरीशानदयिता शक्तिः शमितपातका
    । पीठगा पीठिकारूपा पृषत्पूज्या प्रभामयी ॥ २१॥ महमाया मतङ्गेष्टा लोकालोका शिवाङ्गना ॥ ॥ फलश्रुतिः ॥
    एतत्तेऽभिहितं राम
