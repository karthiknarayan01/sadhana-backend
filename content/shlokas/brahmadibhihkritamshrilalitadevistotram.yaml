id: brahmadibhihkritamshrilalitadevistotram
category: stotram
name:
  english: brahmadibhihkritamshrilalitadevistotram
  devanagari: ब्रह्मादिभिःकृतंश्रीललितादेवीस्तोत्रम्
content:
  english: brahmadibhih kritam shrilalitadevistotram brahmadya ucuh | namo namaste jagadekanathe namo
    namah shritripurabhidhane | namo namo bhandamahasuraghne namo'stu kameshvari vamakeshi || 11|| cintamane
    cintitadanadakshe'cintaye cirakaratarangamale | citrambare citrajagatprasute citrakhyanitye sukhade
    namaste || 12|| mokshaprade mugdhashashankacude mugdhasmite mohanabhedadakshe | mudreshvaricarcitarajatantre
    mudrapriye devi namo namaste || 13|| krurantakadhvamsini komalange kopeshu kalim tanumadadhane | krodanane
    palitasainyacakre krodikritasheshabhaye namaste || 14|| shadangadeviparivarakrishne shadangayuktashrutivakyamrigye
    | shatcakrasamsthe ca shadurmiyukte shadbhavarupe lalite namaste || 15|| kame shive mukhyasamastanitye
    kantasanante kamalayatakshi | kamaprade kamini kamashambhoh kamye kalanamadhipe namaste || 16|| divyaushadhadye
    nagaraugharupe divye dinadhishasahasrakante | dedipyamane dayaya sanathe devadhidevapramade namaste
    || 17|| sadanimadyashtakasevaniye sadashivatmojjvalamancavase | sabhye sadekalayapadapujye savitri
    lokasya namo namaste || 18|| brahmimukhairmatriganairnishevye brahmapriye brahmanabandhabhetri | brahmamritasrotasi
    rajahamsi brahmeshvari shrilalite namaste || 19|| sankshobhinimukhyasamastamudrasamsevite samsaranaprahantri
    | samsaralilakritisarasakshi sada namaste lalite'dhinathe | nitye kalashodashakena namakarshinyadhishi
    pramathena sevye || 20|| nitye niratankadayaprapance nilalakashreni namo namaste | anangapushpadibhirunnadabhiranangadevibhirajasrasevye
    | abhavyahantryakshararashirupe hatarivarge lalite namaste || 21|| sankshobhinimukhyacaturdasharcirmalavritodaramahapradipte
    | atmanamabibhrati vibhramadhye shubhrashraye shubhrapade namaste || 22|| sasharvasiddhadikashaktivandye
    sarvajnavijnatapadaravinde | sarvadhike sarvagate samastasiddhiprade shrilalite namaste || 23|| sarvajnajataprathamabhiranyadevibhirapyashritacakrabhume
    | sarvamarakankshitapurayitri sarvasya lokasya savitri pahi || 24|| vande vashinyadikavagvibhute varddhishnucakradyutivahavahe
    | balahakashyamakace vaco'bdhe varaprade sundari pahi vishvam || 25|| banadidivyayudhasarvabhaume
    bhandasuranikavanantadave | atyugratejojjvalitamburashe prasevyamane parito namaste || 26|| kameshi
    vajreshi bhageshyarupe kanye kale kalavilopadakshe | kathavisheshikritadaityasainye kameshayante kamale
    namaste || 27|| bindusthite bindukalaikarupe bindvatmike brimhitacitprakashe | brihatkucambhojavilolahare
    brihatprabhave lalite namaste || 28|| kameshvarotsangasadanivase kalatmike devi kritanukampe | kalpavasanotthitakalirupe
    kamaprade kalpalate namaste || 29|| savarune sandrasudhamshushite sarangashavakshi sarojavaktre |
    sarasya sarasya sadaikabhume samastavidyeshvari sannatiste || 30|| tava prabhavena cidagnijayam shrishambhunathaprakadikritayah
    | bhandasuradyah samare pracanda hata jagatkantakatam prayatah || 31|| navyani sarvani vapumshi kritva
    hi sandrakarunyasudhaplavairnnah | tvaya samastam bhuvanam saharsham sujivitam sundari sabhyalabhye
    || 32|| iti brahmandapurane uttarabhage trimshadhyayantargatam brahmadibhih kritam shrilalitadevistotram
    samaptam | brahmandapurana | uttarabhaga | lalita | adhyaya 30
  devanagari: ब्रह्मादिभिः कृतं श्रीललितादेवीस्तोत्रम् ब्रह्माद्या ऊचुः । नमो नमस्ते जगदेकनाथे नमो नमः
    श्रीत्रिपुराभिधाने । नमो नमो भण्डमहासुरघ्ने नमोऽस्तु कामेश्वरि वामकेशि ॥ ११॥ चिन्तामणे चिन्तितदानदक्षेऽचिन्तये
    चिराकारतरङ्गमाले । चित्राम्बरे चित्रजगत्प्रसूते चित्राख्यनित्ये सुखदे नमस्ते ॥ १२॥ मोक्षप्रदे मुग्धशशाङ्कचूडे
    मुग्धस्मिते मोहनभेददक्षे । मुद्रेश्वरीचर्चितराजतन्त्रे मुद्राप्रिये देवि नमो नमस्ते ॥ १३॥ क्रूरान्तकध्वंसिनि
    कोमलाङ्गे कोपेषु कालीं तनुमादधाने । क्रोडानने पालितसैन्यचक्रे क्रोडीकृताशेषभये नमस्ते ॥ १४॥ षडङ्गदेवीपरिवारकृष्णे
    षडङ्गयुक्तश्रुतिवाक्यमृग्ये । षट्चक्रसंस्थे च षडूर्मियुक्ते षड्भावरूपे ललिते नमस्ते ॥ १५॥ कामे शिवे
    मुख्यसमस्तनित्ये कान्तासनान्ते कमलायताक्षि । कामप्रदे कामिनि कामशम्भोः काम्ये कलानामधिपे नमस्ते ॥
    १६॥ दिव्यौषधाद्ये नगरौघरूपे दिव्ये दिनाधीशसहस्रकान्ते । देदीप्यमाने दयया सनाथे देवाधिदेवप्रमदे नमस्ते
    ॥ १७॥ सदाणिमाद्यष्टकसेवनीये सदाशिवात्मोज्ज्वलमञ्चवासे । सभ्ये सदेकालयपादपूज्ये सवित्रि लोकस्य नमो
    नमस्ते ॥ १८॥ ब्राह्मीमुखैर्मातृगणैर्निषेव्ये ब्रह्मप्रिये ब्राह्मणबन्धभेत्रि । ब्रह्मामृतस्रोतसि राजहंसि
    ब्रह्मेश्वरि श्रीललिते नमस्ते ॥ १९॥ सङ्क्षोभिणीमुख्यसमस्तमुद्रासंसेविते संसरणप्रहन्त्रि । संसारलीलाकृतिसारसाक्षि
    सदा नमस्ते ललितेऽधिनाथे । नित्ये कलाषोडशकेन नामाकर्षिण्यधीशि प्रमथेन सेव्ये ॥ २०॥ नित्ये निरातङ्कदयाप्रपञ्चे
    नीलालकश्रेणि नमो नमस्ते । अनङ्गपुष्पादिभिरुन्नदाभिरनङ्गदेवीभिरजस्रसेव्ये । अभव्यहन्त्र्यक्षरराशिरूपे
    हतारिवर्गे ललिते नमस्ते ॥ २१॥ सङ्क्षोभिणीमुख्यचतुर्दशार्चिर्मालावृतोदारमहाप्रदीप्ते । आत्मानमाबिभ्रति
    विभ्रमाढ्ये शुभ्राश्रये शुभ्रपदे नमस्ते ॥ २२॥ सशर्वसिद्धादिकशक्तिवन्द्ये सर्वज्ञविज्ञातपदारविन्दे
    । सर्वाधिके सर्वगते समस्तसिद्धिप्रदे श्रीललिते नमस्ते ॥ २३॥ सर्वज्ञजातप्रथमाभिरन्यदेवीभिरप्याश्रितचक्रभूमे
    । सर्वामराकाङ्क्षितपूरयित्रि सर्वस्य लोकस्य सवित्रि पाहि ॥ २४॥ वन्दे वशिन्यादिकवाग्विभूते वर्द्धिष्णुचक्रद्युतिवाहवाहे
    । बलाहकश्यामकचे वचोऽब्धे वरप्रदे सुन्दरि पाहि विश्वम् ॥ २५॥ बाणादिदिव्यायुधसार्वभौमे भण्डासुरानीकवनान्तदावे
    । अत्युग्रतेजोज्ज्वलिताम्बुराशे प्रसेव्यमाने परितो नमस्ते ॥ २६॥ कामेशि वज्रेशि भगेश्यरूपे कन्ये कले
    कालविलोपदक्षे । कथाविशेषीकृतदैत्यसैन्ये कामेशयान्ते कमले नमस्ते ॥ २७॥ बिन्दुस्थिते बिन्दुकलैकरूपे
    बिन्द्वात्मिके बृंहितचित्प्रकाशे । बृहत्कुचाम्भोजविलोलहारे बृहत्प्रभावे ललिते नमस्ते ॥ २८॥ कामेश्वरोत्सङ्गसदानिवासे
    कालात्मिके देवि कृतानुकम्पे । कल्पावसानोत्थितकालिरूपे कामप्रदे कल्पलते नमस्ते ॥ २९॥ सवारुणे सान्द्रसुधांशुशीते
    सारङ्गशावाक्षि सरोजवक्त्रे । सारस्य सारस्य सदैकभूमे समस्तविद्येश्वरि सन्नतिस्ते ॥ ३०॥ तव प्रभावेण
    चिदग्निजायां श्रीशम्भुनाथप्रकडीकृतायाः । भण्डासुराद्याः समरे प्रचण्डा हता जगत्कण्टकतां प्रयाताः ॥
    ३१॥ नव्यानि सर्वाणि वपूंषि कृत्वा हि सान्द्रकारुण्यसुधाप्लवैर्न्नः । त्वया समस्तं भुवनं सहर्षं सुजीवितं
    सुन्दरि सभ्यलभ्ये ॥ ३२॥ इति ब्रह्माण्डपुराणे उत्तरभागे त्रिंशाध्यायान्तर्गतं ब्रह्मादिभिः कृतं श्रीललितादेवीस्तोत्रं
    समाप्तम् । ब्रह्माण्डपुराण । उत्तरभाग । ललिता । अध्याय ३०
