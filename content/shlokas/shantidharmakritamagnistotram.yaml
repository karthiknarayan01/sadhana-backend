id: shantidharmakritamagnistotram
category: stotram
name:
  english: shantidharmakritamagnistotram
  devanagari: शान्तिधर्मकृतंअग्निस्तोत्रम्
content:
  english: om namo'nantashaktyugrashaktyatmane hareh prabhoh || 22|| om namah sarvalokanam makhasadhanamurtaye
    | ekadvipancadhishtyaya rajasuye shadatmane || 23|| pratyakshadevarupaya namaste devavrittaye | sarvavarshmavatam
    shukrarupaya baline namah || 24|| tvam mukham sarvadevanamishvaranam harerapi | tvam pakah sarvabhutanamannanam
    rasinam tatha || 25|| hutam havirbhakshaya~stvam meghatvaya karoshi vai | vrishtirupam tu tadbhutvaushadhivratan
    prapushyati || 26|| tatphaladyairbhutavasah sukham jivanti jantavah | tatsamidbhirjana yajnan prakurvanti
    sura api || 27|| daityashca rakshasashcapi tvadadhara vibhavaso | jarayujashcandajashca svedaja bhumija
    api || 28|| apyayante tvaya sarve samvridhyante tvaya'nala | samrakshyante tvaya sarve tatha mam parirakshaya
    || 29|| deveshu taijasattvam vai kanti siddheshu vai bhavan | visham nageshu casse tvam vayubhagah
    patatrishu || 30|| manujeshu pashupakshigane krodho bhavanapi | avashtambhashca tarushu kathinyam
    tvam kshitavapi || 31|| jale dravo bhavaneva javo bhavan hi vayushu | vyapakastvam nabhasyeva sarvambhutantarasthitah
    || 32|| tvamekastrividhashcapyashtadha sahasradhapi ca | svahasvadhadibhirbhokta havyakavyasya vai
    bhavan || 33|| hetishvapi bhavaneva dharasu samvirajate | jatavedo namastubhyam pingaksha te namo'stu
    ca || 34|| hutashana namaste'stu namaste havyavahana | pavaka'dya namaste'stu namaste vishvapavaka
    || 35|| pakakartarnamaste'stu poshtaste ca namo namah | tvam jyotistvam mahadityo vibhavaso namo'stu
    te || 36|| hiranyareta vahnistvam saptajihva namo'stu te | iti shrilakshminarayaniyasamhitayah dvaparayugasantanatmakasya
    tritiyakhande 158
  devanagari: ॐ नमोऽनन्तशक्त्युग्रशक्त्यात्मने हरेः प्रभोः ॥ २२॥ ॐ नमः सर्वलोकानां मखसाधनमूर्तये । एकद्विपञ्चधिष्ट्याय
    राजसूये षडात्मने ॥ २३॥ प्रत्यक्षदेवरूपाय नमस्ते देववृत्तये । सर्ववर्ष्मवतां शुक्ररूपाय बलिने नमः ॥
    २४॥ त्वं मुखं सर्वदेवानामीश्वराणां हरेरपि । त्वं पाकः सर्वभूतानामन्नानां रसिनां तथा ॥ २५॥ हुतं हविर्भक्षयँस्त्वं
    मेघत्वाय करोषि वै । वृष्टिरूपं तु तद्भूत्वौषधिव्रातान् प्रपुष्यति ॥ २६॥ तत्फलाद्यैर्भूतवासाः सुखं
    जीवन्ति जन्तवः । तत्समिद्भिर्जना यज्ञान् प्रकुर्वन्ति सुरा अपि ॥ २७॥ दैत्याश्च राक्षसाश्चापि त्वदाधारा
    विभावसो । जरायुजाश्चाण्डजाश्च स्वेदजा भूमिजा अपि ॥ २८॥ आप्यायन्ते त्वया सर्वे संवृध्यन्ते त्वयाऽनल
    । संरक्ष्यन्ते त्वया सर्वे तथा मां परिरक्षय ॥ २९॥ देवेषु तैजसत्त्वं वै कान्ति सिद्धेषु वै भवान् ।
    विषं नागेषु चास्से त्वं वायुभागः पतत्रिषु ॥ ३०॥ मनुजेषु पशुपक्षिगणे क्रोधो भवानपि । अवष्टम्भश्च तरुषु
    काठिन्यं त्वं क्षितावपि ॥ ३१॥ जले द्रवो भवानेव जवो भवान् हि वायुषु । व्यापकस्त्वं नभस्येव सर्वम्भूतान्तरस्थितः
    ॥ ३२॥ त्वमेकस्त्रिविधश्चाप्यष्टधा सहस्रधापि च । स्वाहास्वधादिभिर्भोक्ता हव्यकव्यस्य वै भवान् ॥ ३३॥
    हेतिष्वापि भवानेव धारासु संविराजते । जातवेदो नमस्तुभ्यं पिङ्गाक्ष ते नमोऽस्तु च ॥ ३४॥ हुताशन नमस्तेऽस्तु
    नमस्ते हव्यवाहन । पावकाऽद्य नमस्तेऽस्तु नमस्ते विश्वपावक ॥ ३५॥ पाककर्तर्नमस्तेऽस्तु पोष्टस्ते च नमो
    नमः । त्वं ज्योतिस्त्वं महादित्यो विभावसो नमोऽस्तु ते ॥ ३६॥ हिरण्यरेता वह्निस्त्वं सप्तजिह्व नमोऽस्तु
    ते । इति श्रीलक्ष्मीनारायणीयसंहितायाः द्वापरयुगसन्तानात्मकस्य तृतीयखण्डे १५८
