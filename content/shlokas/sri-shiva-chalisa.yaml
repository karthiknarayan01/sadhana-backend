id: sri-shiva-chalisa
category: stotram
name:
  english: Sri Shiva Chalisa
content:
  english: '|| shiva calisa || om namah shivaya doha jaya ganesha girijasuvana mangala mula sujana | kahata
    ayodhyadasa tuma de u abhaya varadana || jaya girijapati dinadayala | sada karata santana pratipala
    || bhala candrama sohata nike | kanana kundala naga phani ke || anga gaura shira ganga bahaye | mundamala
    tana kshara lagaye || vastra khala baghambara sohe | chavi ko dekhi naga mana mohe || maina matu ki
    have dulari | vama anga sohata chavi nyari || kara trishula sohata chavi bhari | karata sada shatruna
    kshayakari || nandi ganesha sohaim taham kaise | sagara madhya kamala haim jaise || kartika shyama
    aura ganara u | ya chavi kau kahi jata na ka u || devana jabahim jaya pukara | tabahim dukha prabhu
    apa nivara || kiya upadrava taraka bhari | devana saba mili tumahim juhari || turata shadanana apa
    pathayau | lava nimesha maham mari girayau || apa jalandhara asura samhara | suyasha tumhara vidita
    samsara || tripurasura sana yuddha macayi | tabahim kripa kara lina bacayi || kiya tapahim bhagiratha
    bhari | puraba pratijna tasu purari || danina maham tuma sama ko u nahim | sevaka stuti karata sadahim
    || veda mahi mahima tuma gayi | akatha anadi bheda nahim payi || prakate udadhi manthana mem jvala
    | jarata surasura bhe vihala || kinha daya taham kari sahayi | nilakantha taba nama kahayi || pujana
    ramacandra jaba kinham | jita ke lanka vibhishana dinha || sahasa kamala mem ho rahe dhari | kinha
    pariksha tabahim tripurari || eka kamala prabhu rakhe u joyi | kamala nayana pujana caham soyi ||
    kathina bhakti dekhi prabhu shankara | bhaye prasanna die icchita vara || jaya jaya jaya ananta avinashi
    | karata kripa sabake ghata vasi || dushta sakala nita mohi satavaim | bhramata rahaum mohe caina
    na avaim || trahi trahi maim natha pukaro | yaha avasara mohi ana ubaro || le trishula shatruna ko
    maro | sankata se mohim ana ubaro || mata pita bhrata saba koyi | sankata mem puchata nahim koyi ||
    svami eka hai asa tumhari | aya harahu mama sankata bhari || dhana nirdhana ko deta sada hi | jo koyi
    jance so phala pahim || astuti kehi vidhi karom tumhari | kshamahu natha aba cuka hamari || shankara
    ho sankata ke nashana | mangala karana vighna vinashana || yogi yati muni dhyana lagavaim | sharada
    narada shisha navavaim || namo namo jaya namah shivaya | sura brahmadika para na paya || jo yaha patha
    kare mana layi | ta para hota haim shambhu sahayi || raniyam jo koyi ho adhikari | patha kare so pavana
    hari || putra hona ki iccha joyi | nishcaya shiva prasada tehi hoyi || pandita trayodashi ko lave
    | dhyana purvaka homa karave || trayodashi vrata karai hamesha | tana nahim take rahai kalesha ||
    dhupa dipa naivedya cadhave | shankara sammukha patha sunave || janma janma ke papa nasave | anta
    dhama shivapura mem pave || kahaim ayodhyadasa asa tumhari | jani sakala dukha harahu hamari || doha
    nita nema uthi pratahhi patha karo calisa | tuma meri manakamana purna karo jagadisha || atha triguna
    arati shivaji ki jaya shiva onkara hara jaya shiva onkara brahma vishnu sadashiva ardhangi dhara ||
    teka|| ekanana caturanana pancanana raje hamsanana garudasana vrishavahana saje || jaya|| do bhuja
    cara caturbhuja dasa bhuja ati sohe tinom rupa nirakhata tribhuvana jana mohe || jaya|| akshamala
    banamala rundamala dhari candana mrigamada sohai bhale shashidhari || jaya|| shvetambara pitambara
    baghambara ange sanakadika garudadika bhutadika sange || jaya|| kara madhye sukamandala cakra trishula
    dharta jagakarta jagabharta jagasamharakarta || jaya|| brahma vishnu sadashiva janata aviveka pranavakshara
    om madhye ye tinom eka || jaya|| kashi mem vishvanatha virajata nando brahmacari nita uthi bhoga lagavata
    mahima ati bhari || jaya|| triguna svami ki arati jo koyi nara gave kahata shivananda svami manavanchita
    phala pave || jaya||'
  devanagari: ॥ शिव चालीसा ॥ ॐ नमः शिवाय दोहा जय गणेश गिरिजासुवन मङ्गल मूल सुजान । कहत अयोध्यादास तुम
    दे उ अभय वरदान ॥ जय गिरिजापति दीनदयाला । सदा करत सन्तन प्रतिपाला ॥ भाल चन्द्रमा सोहत नीके । कानन कुण्डल
    नाग फनी के ॥ अङ्ग गौर शिर गङ्ग बहाये । मुण्डमाल तन क्षार लगाये ॥ वस्त्र खाल बाघम्बर सोहे । छवि को
    देखि नाग मन मोहे ॥ मैना मातु कि हवे दुलारी । वाम अङ्ग सोहत छवि न्यारी ॥ कर त्रिशूल सोहत छवि भारी ।
    करत सदा शत्रुन क्षयकारी ॥ नन्दी गणेश सोहैं तहं कैसे । सागर मध्य कमल हैं जैसे ॥ कार्तिक श्याम और गणरा
    ऊ । या छवि कौ कहि जात न का ऊ ॥ देवन जबहीं जाय पुकारा । तबहिं दुख प्रभु आप निवारा ॥ किया उपद्रव तारक
    भारी । देवन सब मिलि तुमहिं जुहारी ॥ तुरत षडानन आप पठायौ । लव निमेष महं मारि गिरायौ ॥ आप जलन्धर असुर
    संहारा । सुयश तुम्हार विदित संसारा ॥ त्रिपुरासुर सन युद्ध मचायी । तबहिं कृपा कर लीन बचायी ॥ किया तपहिं
    भागीरथ भारी । पुरब प्रतिज्ञा तासु पुरारी ॥ दानिन महं तुम सम को उ नाहीम् । सेवक स्तुति करत सदाहीम्
    ॥ वेद माहि महिमा तुम गायी । अकथ अनादि भेद नहीं पायी ॥ प्रकटे उदधि मन्थन में ज्वाला । जरत सुरासुर भे
    विहाला ॥ कीन्ह दया तहं करी सहायी । नीलकण्ठ तब नाम कहायी ॥ पूजन रामचन्द्र जब कीन्हाम् । जीत के लङ्क
    विभीषण दीन्हा ॥ सहस कमल में हो रहे धारी । कीन्ह परीक्षा तबहिं त्रिपुरारी ॥ एक कमल प्रभु राखे उ जोयी
    । कमल नयन पूजन चहं सोयी ॥ कठिन भक्ति देखी प्रभु शङ्कर । भये प्रसन्न दिए इच्छित वर ॥ जय जय जय अनन्त
    अविनाशी । करत कृपा सबके घट वासी ॥ दुष्ट सकल नित मोहि सतावैम् । भ्रमत रहौं मोहे चैन न आवैम् ॥ त्राहि
    त्राहि मैं नाथ पुकारो । यह अवसर मोहि आन उबारो ॥ ले त्रिशूल शत्रुन को मारो । सङ्कट से मोहिं आन उबारो
    ॥ मात पिता भ्राता सब कोयी । सङ्कट में पूछत नहिं कोयी ॥ स्वामी एक है आस तुम्हारी । आय हरहु मम सङ्कट
    भारी ॥ धन निर्धन को देत सदा ही । जो कोयी जाञ्चे सो फल पाहीम् ॥ अस्तुति केहि विधि करों तुम्हारी । क्षमहु
    नाथ अब चूक हमारी ॥ शङ्कर हो सङ्कट के नाशन । मङ्गल कारण विघ्न विनाशन ॥ योगी यति मुनि ध्यान लगावैम्
    । शारद नारद शीश नवावैम् ॥ नमो नमो जय नमः शिवाय । सुर ब्रह्मादिक पार न पाय ॥ जो यह पाठ करे मन लायी
    । ता पर होत हैं शम्भु सहायी ॥ रनियां जो कोयी हो अधिकारी । पाठ करे सो पावन हारी ॥ पुत्र होन की इच्छा
    जोयी । निश्चय शिव प्रसाद तेहि होयी ॥ पण्डित त्रयोदशी को लावे । ध्यान पूर्वक होम करावे ॥ त्रयोदशी व्रत
    करै हमेशा । तन नहिं ताके रहै कलेशा ॥ धूप दीप नैवेद्य चढावे । शङ्कर सम्मुख पाठ सुनावे ॥ जन्म जन्म के
    पाप नसावे । अन्त धाम शिवपुर में पावे ॥ कहैं अयोध्यादास आस तुम्हारी । जानि सकल दुख हरहु हमारी ॥ दोहा
    नित नेम उठि प्रातःही पाठ करो चालीस । तुम मेरी मनकामना पूर्ण करो जगदीश ॥ अथ त्रिगुण आरती शिवजी की जय
    शिव ओङ्कारा हर जय शिव ओङ्कारा ब्रह्मा विष्णु सदाशिव अर्धाङ्गी धारा ॥ टेक॥ एकानन चतुरानन पञ्चानन राजे
    हंसानन गरुडासन वृषवाहन साजे ॥ जय॥ दो भुज चार चतुर्भुज दस भुज अति सोहे तीनों रूप निरखता त्रिभुवन जन
    मोहे ॥ जय॥ अक्षमाला बनमाला रुण्डमाला धारी चन्दन मृगमद सोहै भाले शशिधारी ॥ जय॥ श्वेताम्बर पीताम्बर
    बाघम्बर अङ्गे सनकादिक गरुडादिक भूतादिक सङ्गे ॥ जय॥ कर मध्ये सुकमण्डल चक्र त्रिशूल धर्ता जगकर्ता जगभर्ता
    जगसंहारकर्ता ॥ जय॥ ब्रह्मा विष्णु सदाशिव जानत अविवेका प्रणवाक्षर ॐ मध्ये ये तीनों एका ॥ जय॥ काशी में
    विश्वनाथ विराजत नन्दो ब्रह्मचारी नित उठि भोग लगावत महिमा अति भारी ॥ जय॥ त्रिगुण स्वामी की आरती जो
    कोयी नर गावे कहत शिवानन्द स्वामी मनवाञ्छित फल पावे ॥ जय॥
