id: saraswati-stotram
category: stotram
name:
  english: Saraswati Stotram
content:
  english: ya kundendu tusharaharadhavala ya shubhravastravrita ya vinavaradandamanditakara ya shvetapadmasana
    | ya brahmacyuta shankaraprabhritibhirdevaissada pujita sa mam patu sarasvati bhagavati nishsheshajadyapaha
    || || dorbhiryukta caturbhih sphatikamaninibhai rakshamalandadhana hastenaikena padmam sitamapica
    shukam pustakam caparena | bhasa kundendushankhasphatikamaninibha bhasamana samana sa me vagdevateyam
    nivasatu vadane sarvada suprasanna || || surasuraissevitapadapankaja kare virajatkamaniyapustaka |
    virincipatni kamalasanasthita sarasvati nrityatu vaci me sada || || sarasvati sarasijakesaraprabha
    tapasvini sitakamalasanapriya | ghanastani kamalavilolalocana manasvini bhavatu varaprasadini || ||
    sarasvati namastubhyam varade kamarupini | vidyarambham karishyami siddhirbhavatu me sada || || sarasvati
    namastubhyam sarvadevi namo namah | shantarupe shashidhare sarvayoge namo namah || || nityanande niradhare
    nishkalayai namo namah | vidyadhare vishalakshi shuddhajnane namo namah || || shuddhasphatikarupayai
    sukshmarupe namo namah | shabdabrahmi caturhaste sarvasiddhyai namo namah || || muktalankrita sarvangyai
    muladhare namo namah | mulamantrasvarupayai mulashaktyai namo namah || || manonmani mahabhoge vagishvari
    namo namah | vagmyai varadahastayai varadayai namo namah || || vedayai vedarupayai vedantayai namo
    namah | gunadoshavivarjinyai gunadiptyai namo namah || || sarvajnane sadanande sarvarupe namo namah
    | sampannayai kumaryai ca sarvajne te namo namah || || yoganarya umadevyai yoganande namo namah |
    divyajnana trinetrayai divyamurtyai namo namah || || ardhacandrajatadhari candrabimbe namo namah |
    candradityajatadhari candrabimbe namo namah || || anurupe maharupe vishvarupe namo namah | animadyashtasiddhayai
    anandayai namo namah || || jnana vijnana rupayai jnanamurte namo namah | nanashastra svarupayai nanarupe
    namo namah || || padmaja padmavamsha ca padmarupe namo namah | parameshthyai paramurtyai namaste papanashini
    || || mahadevyai mahakalyai mahalakshmyai namo namah | brahmavishnushivayai ca brahmanaryai namo namah
    || || kamalakarapushpa ca kamarupe namo namah | kapalikarmadiptayai karmadayai namo namah || || sayam
    pratah pathennityam shanmasatsiddhirucyate | coravyaghrabhayam nasti pathatam shrinvatamapi || ||
    ittham sarasvati stotramagastyamuni vacakam | sarvasiddhikaram nrinam sarvapapapranashanam ||
  devanagari: या कुन्देन्दु तुषारहारधवला या शुभ्रवस्त्रावृता या वीणावरदण्डमण्डितकरा या श्वेतपद्मासना ।
    या ब्रह्माच्युत शङ्करप्रभृतिभिर्देवैस्सदा पूजिता सा मां पातु सरस्वती भगवती निश्शेषजाड्यापहा ॥ ॥ दोर्भिर्युक्ता
    चतुर्भिः स्फटिकमणिनिभै रक्षमालान्दधाना हस्तेनैकेन पद्मं सितमपिच शुकं पुस्तकं चापरेण । भासा कुन्देन्दुशङ्खस्फटिकमणिनिभा
    भासमाना समाना सा मे वाग्देवतेयं निवसतु वदने सर्वदा सुप्रसन्ना ॥ ॥ सुरासुरैस्सेवितपादपङ्कजा करे विराजत्कमनीयपुस्तका
    । विरिञ्चिपत्नी कमलासनस्थिता सरस्वती नृत्यतु वाचि मे सदा ॥ ॥ सरस्वती सरसिजकेसरप्रभा तपस्विनी सितकमलासनप्रिया
    । घनस्तनी कमलविलोललोचना मनस्विनी भवतु वरप्रसादिनी ॥ ॥ सरस्वति नमस्तुभ्यं वरदे कामरूपिणि । विद्यारम्भं
    करिष्यामि सिद्धिर्भवतु मे सदा ॥ ॥ सरस्वति नमस्तुभ्यं सर्वदेवि नमो नमः । शान्तरूपे शशिधरे सर्वयोगे
    नमो नमः ॥ ॥ नित्यानन्दे निराधारे निष्कलायै नमो नमः । विद्याधरे विशालाक्षि शुद्धज्ञाने नमो नमः ॥ ॥
    शुद्धस्फटिकरूपायै सूक्ष्मरूपे नमो नमः । शब्दब्रह्मि चतुर्हस्ते सर्वसिद्ध्यै नमो नमः ॥ ॥ मुक्तालङ्कृत
    सर्वाङ्ग्यै मूलाधारे नमो नमः । मूलमन्त्रस्वरूपायै मूलशक्त्यै नमो नमः ॥ ॥ मनोन्मनि महाभोगे वागीश्वरि
    नमो नमः । वाग्म्यै वरदहस्तायै वरदायै नमो नमः ॥ ॥ वेदायै वेदरूपायै वेदान्तायै नमो नमः । गुणदोषविवर्जिन्यै
    गुणदीप्त्यै नमो नमः ॥ ॥ सर्वज्ञाने सदानन्दे सर्वरूपे नमो नमः । सम्पन्नायै कुमार्यै च सर्वज्ञे ते नमो
    नमः ॥ ॥ योगानार्य उमादेव्यै योगानन्दे नमो नमः । दिव्यज्ञान त्रिनेत्रायै दिव्यमूर्त्यै नमो नमः ॥ ॥
    अर्धचन्द्रजटाधारि चन्द्रबिम्बे नमो नमः । चन्द्रादित्यजटाधारि चन्द्रबिम्बे नमो नमः ॥ ॥ अणुरूपे महारूपे
    विश्वरूपे नमो नमः । अणिमाद्यष्टसिद्धायै आनन्दायै नमो नमः ॥ ॥ ज्ञान विज्ञान रूपायै ज्ञानमूर्ते नमो
    नमः । नानाशास्त्र स्वरूपायै नानारूपे नमो नमः ॥ ॥ पद्मजा पद्मवंशा च पद्मरूपे नमो नमः । परमेष्ठ्यै परामूर्त्यै
    नमस्ते पापनाशिनी ॥ ॥ महादेव्यै महाकाल्यै महालक्ष्म्यै नमो नमः । ब्रह्मविष्णुशिवायै च ब्रह्मनार्यै
    नमो नमः ॥ ॥ कमलाकरपुष्पा च कामरूपे नमो नमः । कपालिकर्मदीप्तायै कर्मदायै नमो नमः ॥ ॥ सायं प्रातः पठेन्नित्यं
    षण्मासात्सिद्धिरुच्यते । चोरव्याघ्रभयं नास्ति पठतां शृण्वतामपि ॥ ॥ इत्थं सरस्वती स्तोत्रमगस्त्यमुनि
    वाचकम् । सर्वसिद्धिकरं नॄणां सर्वपापप्रणाशनम् ॥
