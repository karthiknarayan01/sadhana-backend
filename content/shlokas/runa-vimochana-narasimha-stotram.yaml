id: runa-vimochana-narasimha-stotram
category: stotram
name:
  english: Runa Vimochana Narasimha Stotram
content:
  english: vagisha yasya vadane lakshmiryasya ca vakshasi | yasyaste hridaye samvittam nrisimhamaham bhaje
    || atha stotram devatakaryasiddhyartham sabhastambhasamudbhavam | shrinrisimham mahaviram namami rinamuktaye
    || || lakshmyalingita vamankam bhaktanam varadayakam | shrinrisimham mahaviram namami rinamuktaye
    || || antramaladharam shankhacakrabjayudhadharinam | shrinrisimham mahaviram namami rinamuktaye ||
    || smaranat sarvapapaghnam kadrujavishanashanam | shrinrisimham mahaviram namami rinamuktaye || ||
    simhanadena mahata digvidigbhayanashanam | shrinrisimham mahaviram namami rinamuktaye || || prahladavarada
    shrisham daityeshvaravidaranam | shrinrisimham mahaviram namami rinamuktaye || || kruragrahaih piditanam
    bhaktanamabhayapradam | shrinrisimham mahaviram namami rinamuktaye || || vedavedantayajnesham brahmarudradivanditam
    | shrinrisimham mahaviram namami rinamuktaye || || ittham yah pathate nityam rinamocana siddhaye |
    anrino jayate shighram dhanam vipulamapnuyat || || sarvasiddhipradam nrinam sarvaishvaryapradayakam
    | tasmat sarvaprayatnena pathet stotramidam sada || || iti shrinrisimhapurane rinamocana shri nrisimha
    stotram |
  devanagari: वागीशा यस्य वदने लक्ष्मीर्यस्य च वक्षसि । यस्यास्ते हृदये संवित्तं नृसिंहमहं भजे ॥ अथ स्तोत्रम्
    देवताकार्यसिद्ध्यर्थं सभास्तम्भसमुद्भवम् । श्रीनृसिंहं महावीरं नमामि ऋणमुक्तये ॥ ॥ लक्ष्म्यालिङ्गित
    वामाङ्कं भक्तानां वरदायकम् । श्रीनृसिंहं महावीरं नमामि ऋणमुक्तये ॥ ॥ आन्त्रमालाधरं शङ्खचक्राब्जायुधधारिणम्
    । श्रीनृसिंहं महावीरं नमामि ऋणमुक्तये ॥ ॥ स्मरणात् सर्वपापघ्नं कद्रूजविषनाशनम् । श्रीनृसिंहं महावीरं
    नमामि ऋणमुक्तये ॥ ॥ सिंहनादेन महता दिग्विदिग्भयनाशनम् । श्रीनृसिंहं महावीरं नमामि ऋणमुक्तये ॥ ॥ प्रह्लादवरद
    श्रीशं दैत्येश्वरविदारणम् । श्रीनृसिंहं महावीरं नमामि ऋणमुक्तये ॥ ॥ क्रूरग्रहैः पीडितानां भक्तानामभयप्रदम्
    । श्रीनृसिंहं महावीरं नमामि ऋणमुक्तये ॥ ॥ वेदवेदान्तयज्ञेशं ब्रह्मरुद्रादिवन्दितम् । श्रीनृसिंहं महावीरं
    नमामि ऋणमुक्तये ॥ ॥ इत्थं यः पठते नित्यं ऋणमोचन सिद्धये । अनृणो जायते शीघ्रं धनं विपुलमाप्नुयात् ॥
    ॥ सर्वसिद्धिप्रदं नृणां सर्वैश्वर्यप्रदायकम् । तस्मात् सर्वप्रयत्नेन पठेत् स्तोत्रमिदं सदा ॥ ॥ इति
    श्रीनृसिंहपुराणे ऋणमोचन श्री नृसिंह स्तोत्रम् ।
