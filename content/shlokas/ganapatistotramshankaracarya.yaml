id: ganapatistotramshankaracarya
category: stotram
name:
  english: ganapatistotramshankaracarya
  devanagari: गणपतिस्तोत्रम्षन्कराचार्य
content:
  english: ganapatistotram suvarnavarnasundaram sitaikadantabandhuram grihitapashakankusham varapradabhayapradam
    | caturbhujam trilocanam bhujangamopavitinam praphullavarijasanam bhajami sindhurananam || 1|| kiritaharakundalam
    pradiptabahubhushanam pracandaratnakankanam prashobhitannghrayashtikam | prabhatasuryasundarambaradvayapradharinam
    saralahemanupuram prashobhitanghripankajam || 2|| suvarnadandamanditapracandacarucamaram grihapratirnasundaram
    yugakshanam pramoditam | kavindracittaranjakam mahavipattibhanjakam shadaksharasvarupinam bhajedgajendrarupinam
    || 3|| virincivishnuvanditam virupalocanastutim girishadarshanecchaya samarpitam parashaya | nirantaram
    surasuraih saputravamalocanaih mahamakheshtamishtakarmasu
  devanagari: गणपतिस्तोत्रम् सुवर्णवर्णसुन्दरं सितैकदन्तबन्धुरं गृहीतपाशकाङ्कुशं वरप्रदाभयप्रदम् । चतुर्भुजं
    त्रिलोचनं भुजङ्गमोपवीतिनं प्रफुल्लवारिजासनं भजामि सिन्धुराननम् ॥ १॥ किरीटहारकुण्डलं प्रदीप्तबाहुभूषणं
    प्रचण्डरत्नकङ्कणं प्रशोभिताङ्ङ्घ्रयष्टिकम् । प्रभातसूर्यसुन्दराम्बरद्वयप्रधारिणं सरलहेमनूपुरं प्रशोभिताङ्घ्रिपङ्कजम्
    ॥ २॥ सुवर्णदण्डमण्डितप्रचण्डचारुचामरं गृहप्रतीर्णसुन्दरं युगक्षणं प्रमोदितम् । कवीन्द्रचित्तरञ्जकं
    महाविपत्तिभञ्जकं षडक्षरस्वरूपिणं भजेद्गजेन्द्ररूपिणम् ॥ ३॥ विरिञ्चिविष्णुवन्दितं विरूपलोचनस्तुतिं
    गिरीशदर्शनेच्छया समर्पितं पराशया । निरन्तरं सुरासुरैः सपुत्रवामलोचनैः महामखेष्टमिष्टकर्मसु
