    । ॐ अमृतवर्षिणे नमः । ॐ उग्राय नमः । ॐ अनुग्ररूपाय नमः । ॥ ५०॥ ॐ स्थविराय नमः । ॐ स्थवीयसे नमः । ॐ
    शान्ताय नमः । ॐ अघोराय नमः । ॐ गूढाय नमः । ॐ ऊर्ध्वरेतसे नमः । ॐ एकवक्त्राय नमः । ॐ अनेकवक्त्राय नमः
    । ॐ द्विनेत्राय नमः । ॐ त्रिनेत्राय नमः । ॥ ६०॥ ॐ द्विभुजाय नमः । ॐ षड्भुजाय नमः । ॐ अक्षमालिने नमः
    । ॐ कमण्डलुधारिणे नमः । ॐ शूलिने नमः । ॐ डमरुधारिणे नमः । ॐ शङ्खिने नमः । ॐ गदिने नमः । ॐ मुनये नमः
    । ॐ मौलिने नमः । ॥ ७०॥ ॐ विरूपाय नमः । ॐ स्वरूपाय नमः । ॐ सहस्रशिरसे नमः । ॐ सहस्राक्षाय नमः । ॐ सहस्रबाहवे
    नमः । ॐ सहस्रायुधाय नमः । ॐ सहस्रपादाय नमः । ॐ सहस्रपद्मार्चिताय नमः । ॐ पद्महस्ताय नमः । ॐ पद्मपादाय
    नमः । ॥ ८०॥ ॐ पद्मनाभाय नमः । ॐ पद्ममालिने नमः । ॐ पद्मगर्भारुणाक्षाय नमः । ॐ पद्मकिञ्जल्कवर्चसे नमः
    । ॐ ज्ञानिने नमः । ॐ ज्ञानगम्याय नमः । ॐ ज्ञानविज्ञानमूर्तये नमः । ॐ ध्यानिने नमः । ॐ ध्याननिष्ठाय
    नमः । ॐ ध्यानस्तिमितमूर्तये नमः । ॥ ९०॥ ॐ धूलिधूसरिताङ्गाय नमः । ॐ चन्दनलिप्तमूर्तये नमः । ॐ भस्मोद्धूलितदेहाय
