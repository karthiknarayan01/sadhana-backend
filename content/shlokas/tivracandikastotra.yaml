id: tivracandikastotra
category: stotram
name:
  english: tivracandikastotra
  devanagari: तीव्रचण्डिकास्तोत्र
content:
  english: kaladhari hunkaroccarayanti pradahatu duritam candamunda pracanda || 2|| om hram hrim hrum
    rudrarupe tribhuvananamite pashahaste trinitre ram rim rum rangarange kilikilitarave shulahaste pracande
    | lam lim lum lambajihve hasati kahakahashuddha ghorattahasaih kam kali kalaratrih pradahatu duritam
    candamunda pracanda || 3|| om ghram ghrim ghrum ghorarupe ghaghaghagha ghatitairgharghuraravaghore
    nirmamsi shushkajanghe pibatu naravasa dhumradhumrayamane | om dram drim drum dravayanti sakalabhuvi
    tatha yakshagandharvanagaih
  devanagari: कालधारी हूङ्कारोच्चारयन्ती प्रदहतु दुरितं चण्डमुण्डा प्रचण्डा ॥ २॥ ॐ ह्रां ह्रीं ह्रूं रुद्ररूपे
    त्रिभुवननमिते पाशहस्ते त्रिनीत्रे रां रीं रूं रङ्गरङ्गे किलिकिलितरवे शूलहस्ते प्रचण्डे । लां लीं लूं
    लम्बजिह्वे हसति कहकहाशुद्ध घोराट्टहासैः कं काली कालरात्रिः प्रदहतु दुरितं चण्डमुण्डा प्रचण्डा ॥ ३॥
    ॐ घ्रां घ्रीं घ्रूं घोररूपे घघघघ घटितैर्घर्घुरारावघोरे निर्मांसी शुष्कजङ्घे पिबतु नरवसा धूम्रधूम्रायमाने
    । ॐ द्रां द्रीं द्रूं द्रावयन्ती सकलभुवि तथा यक्षगन्धर्वनागैः
meaning: {}
