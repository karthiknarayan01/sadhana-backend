id: surya-nitya-puja-vidhanam
category: stotram
name:
  english: Surya Nitya Puja Vidhanam
content:
  english: suryanarayana svami pratima va citrapatah va purvanga puja shrimahaganadhipataye namah | shri
    gurubhyo namah | harih om | shucih apavitrah pavitro va sarvavastham gato'pi va | yah smaret pundarikaksham
    sa bahyabhyantarah shucih || pundarikaksha pundarikaksha pundarikakshaya namah || prarthana shuklambaradharam
    vishnum shashivarnam caturbhujam | prasannavadanam dhyayet sarvavighnopashantaye || agajanana padmarkam
    gajananamaharnisham | anekadam tam bhaktanam ekadantamupasmahe || tadeva lagnam sudinam tadeva tarabalam
    candrabalam tadeva | vidyabalam daivabalam tadeva lakshmipate te'nghriyugam smarami || gururbrahma
    gururvishnuh gururdevo maheshvarah | guruh sakshat parabrahma tasmai shrigurave namah || sarvamangala
    mangalye shive sarvarthasadhike | sharanye tryambake gauri narayani namo'stu te || shrilakshminarayanabhyam
    namah | umamaheshvarabhyam namah | vanihiranyagarbhabhyam namah | shacipurandarabhyam namah | arundhativasishthabhyam
    namah | shrisitaramabhyam namah | matapitribhyo namah | sarvebhyo mahajanebhyo namah | acamanam om
    keshavaya svaha | om narayanaya svaha | om madhavaya svaha | om govindaya namah | om vishnave namah
    | om madhusudanaya namah | om trivikramaya namah | om vamanaya namah | om shridharaya namah | om hrishikeshaya
    namah | om padmanabhaya namah | om damodaraya namah | om sankarshanaya namah | om vasudevaya namah
    | om pradyumnaya namah | om aniruddhaya namah | om purushottamaya namah | om adhokshajaya namah |
    om narasimhaya namah | om acyutaya namah | om janardanaya namah | om upendraya namah | om haraye namah
    | om shrikrishnaya namah | diparadhanam dipastvam brahmarupo'si jyotisham prabhuravyayah | saubhagyam
    dehi putramshca sarvankamamshca dehi me || bho dipa devi rupastvam karmasakshi hyavighnakrit | yavatpujam
    karishyami tavattvam susthiro bhava || diparadhana muhurtah sumuhurto'stu || bhutoccatanam uttishthantu
    bhutapishacah ya ete bhumibharakah | eteshamavirodhena brahmakarma samarabhe || apasarpantu te bhuta
    ye bhuta bhumisamsthitah | ye bhuta vighnakartaraste gacchantu shiva'jnaya || pranayamah o mbhuvah
    | ogm suvah | o ntapah | ogm satyam | o mbhargo devasya dhimahi | dhiyo yo nah pracodaya t || omapo
    jyoti raso mbrahma bhurbhuvassuvarom || sankalpah mama upatta samasta duritakshaya dvara shriparameshvara
    prityartham asmakam sahakutumbasya kshema shrisuryanarayana svami pujam karishye || tadanga kalasharadhanam
    karishye || kalasharadhanam kalashe gandha pushpakshatairabhyarcya | kalashe udakam purayitva | kalashasyopari
    hastam nidhaya | kalashasya mukhe vishnuh kanthe rudrah samashritah | mule tvasya sthito brahma madhye
    matriganah smritah || kukshau tu sagarah sarve saptadvipa vasundhara | rigvedo'tha yajurvedo samavedo
    hyatharvanah || angaishca sahitah sarve kalashambu samashritah || gange ca yamune caiva godavari sarasvati
    | narmade sindhu kaveri jale'smin sannidhim kuru || kaveri tungabhadra ca krishnaveni ca gautami |
    bhagirathiti vikhyatah pancagangah prakirtitah || ayantu devapujartham mama duritakshayakarakah |
    kalashodakena puja dravyani samprokshya atmanam ca samprokshya || shankhapuja shankham candrarka daivatam
    madhye varuna devatam | prishthe prajapatim vindyadagre ganga sarasvatim || trailokye yani tirthani
    vasudevasya ajnaya | shankhe tishthantu viprendrah tasmat shankham prapujayet || om shankhaya namah
    | om dhavalaya namah | om pancajanyaya namah | om shankhadevatabhyo namah | sakalapujarthe akshatan
    samarpayami || ghantanadah agamartham tu devanam gamanartham tu rakshasam | ghantaravam karomyadau
    devatahvana lanchanam || om ghantadevatabhyo namah | sakalopacara pujarthe akshatan samarpayami ||
    shri mahaganapati puja o ntva ganapatigm havamahe kavi nkavinam upamashravastavam | jyeshtharaja mbrahmanaspata
    a nah shrinvannutibhissida sadanam || sumukhashcaikadantashca kapilo gajakarnakah | lambodarashca
    vikato vighnarajo ganadhipah || dhumaketurganadhyakshah phalacandro gajananah | vakratundah shurpakarno
    herambah skandapurvajah || om shrimahaganapataye namah | dhyayami | avahayami | asanam samarpayami
    | padyam samarpayami | arghyam samarpayami | acamaniyam samarpayami | snanam samarpayami | vastram
    samarpayami | yajnopavitam samarpayami | gandham samarpayami | pushpani samarpayami | dhupamaghrapayami
    | dipam darshayami | naivedyam samarpayami | tambulam samarpayami | nirajanam samarpayami | mantrapushpam
    samarpayami | pradakshina namaskaran samarpayami || shodashopacara puja suryanarayana dhyanam dhyeyah
    sada savitrimandalamadhyavarti narayanah sarasijasana sannivishtah | keyuravan makarakundalavan kiriti
    hari hiranmayavapuh dhritashankhacakrah || aruno'runapankaje nishannah kamale'bhitivarau karairdadhanah
    | svarucahita mandalastrinetro ravirakalpa shatakulo'vatannah || om shrisuryanarayanaya namah | dhyayami
    | dhyanam samarpayami || avahanam sahasrashir sha purushah | sahasraksha ssahasrapat | sa bhumim vi~shvato
    vritva | atyatishthaddashangulam || agaccha bhagavan surya mandape ca sthiro bhava | yavatpuja samapyeta
    tavattvam sannidhau bhava || om shrisuryanarayanaya namah | avahayami | sthapayami | pujayami || asanam
    purusha evedagm sarvam | utamritatva syeshanah | yadannenatirohati || hemasana mahaddivyam nanaratnavibhushitam
    | dattam me grihyatam deva divakara namo'stu te || om shrisuryanarayanaya namah | asanam samarpayami
    || padyam gangajala samanitam paramam pavanam mahat | padyam grihana devesha dhamarupa namo'stu te
    || om shrisuryanarayanaya namah | padayoh padyam samarpayami || arghyam bho surya mahadbhuta brahmavishnu
    svarupadrik | arghyam anjalina dattam grihana parameshvara || om shrisuryanarayanaya namah | hastayoh
    arghyam samarpayami || acamaniyam gangadi tirthajam toyam jatipushpaishca vasitam | tamrapatre sthitam
    divyam grihanacamaniyakam || om shrisuryanarayanaya namah | mukhe acamaniyam samarpayami || snanam
    apo hishtha mayobhuvasta na urje dadhatana | mahe ranaya cakshase || yo vah shivatamo rasastasya bhajayateha
    nah | ushatiriva matarah || tasma ara ngamama vo yasya kshayaya jinvatha | apo janayatha ca nah ||
    om shrisuryanarayanaya namah | shuddhodaka snanam samarpayami || snananantaram acamaniyam samarpayami
    || vastram raktapattayugam deva sukshmatantuvinirmitam | shuddham caiva maya dattam grihana kamalakara
    || om shrisuryanarayanaya namah | vastram samarpayami || yajnopavitam namah kamalahastaya vishvarupaya
    te namah | upavitam maya dattam tadgrihana divakara || om shrisuryanarayanaya namah | yajnopavitam
    samarpayami || gandham kunkumagaru kasturi sugandhaishcandanadibhih | raktacandana samyuktam gandham
    grihnishva bhaskara || om shrisuryanarayanaya namah | gandham samarpayami || arcana japakadamba kusumaih
    raktotpala yutani ca | pushpani grihyatam deva sarvakamaprado bhava || anga puja om mitraya namah
    padau pujayami | om ravaye namah janghe pujayami | om suryaya namah januni pujayami | om khagaya namah
    uru pujayami | om hiranyagarbhaya namah katim pujayami | om pushne namah guhyam pujayami | om maricaye
    namah nabhim pujayami | om adityaya namah jatharam pujayami | om savitre namah hridayam pujayami |
    om arkaya namah stanau pujayami | om bhaskaraya namah kantham pujayami | om aryamne namah skandhau
    pujayami | om hamsaya namah hastau pujayami | om ahaskaraya namah mukham pujayami | om bradhnaya namah
    nasikam pujayami | om jagadekacakshushe namah netrani pujayami | om bhanave namah karnau pujayami
    | om trigunatmadharine namah lalatam pujayami | om virincinarayanaya namah shirah pujayami | om timiranashine
    namah sarvanyangani pujayami || surya ashtottara shata namavali athava surya dvadasha nama puja ||
    om adityaya namah | om divakaraya namah | om bhaskaraya namah | om prabhakaraya namah | om sahasramshave
    namah | om trilocanaya namah | om haridashvaya namah | om vibhavasave namah | om dinakaraya namah
    | om dvadashatmakaya namah | om trimurtaye namah | om suryaya namah || om shrisuryanarayanaya namah
    | ashtottara shata namavali pujam samarpayami | akshatan pushpani ca samarpayami || dhupam dashangoguggulodbhutah
    kalagaru samanvitah | aghreyah sarvadevanam dhupo'yam pratigrihyatam || om shrisuryanarayanaya namah
    | dhupamaghrapayami || dipam karpasavartikayuktam goghritena samanvitam | dipam grihana devesha trailokya
    timirapaha || om shrisuryanarayanaya namah | dipam darshayami || naivedyam payasam ghritasamyuktam
    nana pakvanna samyutam | naivedyam ca maya dattam shantim kuru jagatpate || o mbhurbhuvassuvah | tatsaviturvare
    mbhargo devasya dhimahi | dhiyo yo nah pracodaya t || satyam tva ritena parishincami | amritamastu
    | amritopastaranamasi | om pranaya svaha | om apanaya svaha | om vyanaya svaha | om udanaya svaha
    | om samanaya svaha | madhye madhye paniyam samarpayami | amritapidhanamasi | uttaraposhanam samarpayami
    | hastau prakshalayami | padau prakshalayami | shuddhacamaniyam samarpayami || om shrisuryanarayanaya
    namah | naivedyam samarpayami || tambulam elalavanga karpura khadiraishca sapugakaih | nagavallidalairyuktam
    tambulam pratigrihyatam || om shrisuryanarayanaya namah | tambulam samarpayami || nirajanam vedahameta
    ntamasastu pare | sarvani rupani vicitya dhirah | namani kritva || pancavarti samayuktam sarvamangaladayakam
    | nirajanam grihanedam sarvasaukhyakaro bhava || om shrisuryanarayanaya namah | nirajanam samarpayami
    || mantrapushpam dhata purastadyamudajahara | shakrah pravidva npradishashcatasrah | tamevam vi~dvanamrita
    iha bhavati | nanyah pantha ayanaya vidyate || om bhaskaraya vidmahe mahadyutikaraya dhimahi | tanno
    adityah pracodayat || campakaih shatapatraishca kalharaih karavirakaih | patalairbakulairyuktam grihana
    kusumanjalim || om shrisuryanarayanaya namah | mantrapushpam samarpayami || pradakshinam yani kani
    ca papani janmantara kritani ca | tani tani vinashyanti pradakshina pade pade || papo'ham papakarma'ham
    papatma papasambhava | trahi mam kripaya deva sharanagatavatsala || anyatha sharanam nasti tvameva
    sharanam mama | tasmatkarunya bhavena raksha raksha janardana || om shrisuryanarayanaya namah | pradakshina
    namaskaran samarpayami || namaskarah udyannadya vivasvanarohannuttaram divam | devah hridrogam mama
    suryo harimanam cashu nashayatu || om shrisuryanarayanaya namah | namaskaran samarpayami || dvadasharghyani
    divakara namastubhyam papam nashaya bhaskara | trayimayaya vishvatman grihanarghyam namo'stu te ||
    om mitraya namah idamarghyam samarpayami | om ravaye namah idamarghyam samarpayami | om suryaya namah
    idamarghyam samarpayami | om bhanave namah idamarghyam samarpayami | om khagaya namah idamarghyam
    samarpayami | om pushne namah idamarghyam samarpayami | om hiranyagarbhaya namah idamarghyam samarpayami
    | om maricaye namah idamarghyam samarpayami | om adityaya namah idamarghyam samarpayami | om savitre
    namah idamarghyam samarpayami | om arkaya namah idamarghyam samarpayami | om bhaskaraya namah idamarghyam
    samarpayami || sarvopacarah om shrisuryanarayanaya namah | chatram samarpayami | camaram samarpayami
    | gitam shravayami | nrityam darshayami | samasta rajopacaran devopacaran samarpayami || stotra sukta
    pathanam shri surya namaskara mantrah kshamaprarthana mantrahinam kriyahinam bhaktihinam janardana
    | yatpujitam maya deva paripurnam tadastu te || ajnanadva pramadadva vaikalyatsadhanasya va | yannyunamatiriktam
    ca tatsarvam kshantumarhasi || kayena vaca manasendriyairva buddhyatmana va prakriteh svabhavat |
    karomi yadyat sakalam parasmai narayanayeti samarpayami || anaya dhyana shodashopacara pujaya shrisuryanarayana
    svami supritah suprasannah varado bhavatu || udvasanam om shrisuryanarayanaya namah | yathasthanam
    udvasayami | shobhanarthe kshemaya punaragamanaya ca || prasada grahanam akalamrityuharanam sarvavyadhinivaranam
    | samastapapakshayakaram devata padodakam shubham || shrisuryanarayana svami prasadam shirasa grihnami
    || om shantih shantih shantih || om tatsat brahmarpanamastu ||
  devanagari: सूर्यनारायण स्वामि प्रतिमा वा चित्रपटः वा पूर्वाङ्ग पूजा श्रीमहागणाधिपतये नमः । श्री गुरुभ्यो
    नमः । हरिः ओम् । शुचिः अपवित्रः पवित्रो वा सर्वावस्थां गतोऽपि वा । यः स्मरेत् पुण्डरीकाक्षं स बाह्याभ्यन्तरः
    शुचिः ॥ पुण्डरीकाक्ष पुण्डरीकाक्ष पुण्डरीकाक्षाय नमः ॥ प्रार्थना शुक्लाम्बरधरं विष्णुं शशिवर्णं चतुर्भुजम्
    । प्रसन्नवदनं ध्यायेत् सर्वविघ्नोपशान्तये ॥ अगजानन पद्मार्कं गजाननमहर्निशम् । अनेकदं तं भक्तानां एकदन्तमुपास्महे
    ॥ तदेव लग्नं सुदिनं तदेव ताराबलं चन्द्रबलं तदेव । विद्याबलं दैवबलं तदेव लक्ष्मीपते तेऽङ्घ्रियुगं स्मरामि
    ॥ गुरुर्ब्रह्मा गुरुर्विष्णुः गुरुर्देवो महेश्वरः । गुरुः साक्षात् परब्रह्म तस्मै श्रीगुरवे नमः ॥
    सर्वमङ्गल माङ्गल्ये शिवे सर्वार्थसाधिके । शरण्ये त्र्यम्बके गौरी नारायणि नमोऽस्तु ते ॥ श्रीलक्ष्मीनारायणाभ्यां
    नमः । उमामहेश्वराभ्यां नमः । वाणीहिरण्यगर्भाभ्यां नमः । शचीपुरन्दराभ्यां नमः । अरुन्धतीवसिष्ठाभ्यां
    नमः । श्रीसीतारामाभ्यां नमः । मातापितृभ्यो नमः । सर्वेभ्यो महाजनेभ्यो नमः । आचमनं ॐ केशवाय स्वाहा
    । ॐ नारायणाय स्वाहा । ॐ माधवाय स्वाहा । ॐ गोविन्दाय नमः । ॐ विष्णवे नमः । ॐ मधुसूदनाय नमः । ॐ त्रिविक्रमाय
    नमः । ॐ वामनाय नमः । ॐ श्रीधराय नमः । ॐ हृषीकेशाय नमः । ॐ पद्मनाभाय नमः । ॐ दामोदराय नमः । ॐ सङ्कर्षणाय
    नमः । ॐ वासुदेवाय नमः । ॐ प्रद्युम्नाय नमः । ॐ अनिरुद्धाय नमः । ॐ पुरुषोत्तमाय नमः । ॐ अधोक्षजाय नमः
    । ॐ नारसिंहाय नमः । ॐ अच्युताय नमः । ॐ जनार्दनाय नमः । ॐ उपेन्द्राय नमः । ॐ हरये नमः । ॐ श्रीकृष्णाय
    नमः । दीपाराधनम् दीपस्त्वं ब्रह्मरूपोऽसि ज्योतिषां प्रभुरव्ययः । सौभाग्यं देहि पुत्रांश्च सर्वान्कामांश्च
    देहि मे ॥ भो दीप देवि रूपस्त्वं कर्मसाक्षी ह्यविघ्नकृत् । यावत्पूजां करिष्यामि तावत्त्वं सुस्थिरो
    भव ॥ दीपाराधन मुहूर्तः सुमुहूर्तोऽस्तु ॥ भूतोच्चाटनम् उत्तिष्ठन्तु भूतपिशाचाः य एते भूमिभारकाः । एतेषामविरोधेन
    ब्रह्मकर्म समारभे ॥ अपसर्पन्तु ते भूता ये भूता भूमिसंस्थिताः । ये भूता विघ्नकर्तारस्ते गच्छन्तु शिवाऽज्ञया
    ॥ प्राणायामः ओ म्भुवः॑ । ओग्ं सुवः॑ । ओ न्तपः॑ । ओग्ं सत्यम् । ओ म्भर्गो॑ दे॒वस्य॑ धीमहि । धियो॒ यो
    नः॑ प्रचो॒दया त् ॥ ओमापो॒ ज्योती॒ रसो॒ म्ब्रह्म॒ भूर्भुव॒स्सुव॒रोम् ॥ सङ्कल्पः मम उपात्त समस्त दुरितक्षय
    द्वारा श्रीपरमेश्वर प्रीत्यर्थं अस्माकं सहकुटुम्बस्य क्षेम श्रीसूर्यनारायण स्वामि पूजां करिष्ये ॥
    तदङ्ग कलशाराधनं करिष्ये ॥ कलशाराधनम् कलशे गन्ध पुष्पाक्षतैरभ्यर्च्य । कलशे उदकं पूरयित्वा । कलशस्योपरि
    हस्तं निधाय । कलशस्य मुखे विष्णुः कण्ठे रुद्रः समाश्रितः । मूले त्वस्य स्थितो ब्रह्मा मध्ये मातृगणाः
    स्मृताः ॥ कुक्षौ तु सागराः सर्वे सप्तद्वीपा वसुन्धरा । ऋग्वेदोऽथ यजुर्वेदो सामवेदो ह्यथर्वणः ॥ अङ्गैश्च
    सहिताः सर्वे कलशाम्बु समाश्रिताः ॥ गङ्गे च यमुने चैव गोदावरी सरस्वती । नर्मदे सिन्धु कावेरी जलेऽस्मिन्
    सन्निधिं कुरु ॥ कावेरी तुङ्गभद्रा च कृष्णवेणी च गौतमी । भागीरथीति विख्याताः पञ्चगङ्गाः प्रकीर्तिताः
    ॥ आयान्तु देवपूजार्थं मम दुरितक्षयकारकाः । कलशोदकेन पूजा द्रव्याणि सम्प्रोक्ष्य आत्मानं च सम्प्रोक्ष्य
    ॥ शङ्खपूजा शङ्खं चन्द्रार्क दैवतं मध्ये वरुण देवताम् । पृष्ठे प्रजापतिं विन्द्यादग्रे गङ्गा सरस्वतीम्
    ॥ त्रैलोक्ये यानि तीर्थानि वासुदेवस्य आज्ञया । शङ्खे तिष्ठन्तु विप्रेन्द्राः तस्मात् शङ्खं प्रपूजयेत्
    ॥ ॐ शङ्खाय नमः । ॐ धवलाय नमः । ॐ पाञ्चजन्याय नमः । ॐ शङ्खदेवताभ्यो नमः । सकलपूजार्थे अक्षतान् समर्पयामि
    ॥ घण्टानादः आगमार्थं तु देवानां गमनार्थं तु राक्षसाम् । घण्टारवं करोम्यादौ देवताह्वान लाञ्छनम् ॥ ॐ
    घण्टादेवताभ्यो नमः । सकलोपचार पूजार्थे अक्षतान् समर्पयामि ॥ श्री महागणपति पूजा ओ न्त्वा ग॒णप॑तिग्ं
    हवामहे क॒वि ङ्क॑वी॒नां उप॒मश्र॑वस्तवम् । ज्ये॒ष्ठ॒राज॒ म्ब्रह्मणस्पत॒ आ नः॑ शृ॒ण्वन्नू॒तिभि॑स्सीद॒
    साद॑नम् ॥ सुमुखश्चैकदन्तश्च कपिलो गजकर्णकः । लम्बोदरश्च विकटो विघ्नराजो गणाधिपः ॥ धूमकेतुर्गणाध्यक्षः
    फालचन्द्रो गजाननः । वक्रतुण्डः शूर्पकर्णो हेरम्बः स्कन्दपूर्वजः ॥ ॐ श्रीमहागणपतये नमः । ध्यायामि ।
    आवाहयामि । आसनं समर्पयामि । पाद्यं समर्पयामि । अर्घ्यं समर्पयामि । आचमनीयं समर्पयामि । स्नानं समर्पयामि
    । वस्त्रं समर्पयामि । यज्ञोपवीतं समर्पयामि । गन्धं समर्पयामि । पुष्पाणि समर्पयामि । धूपमाघ्रापयामि
    । दीपं दर्शयामि । नैवेद्यं समर्पयामि । ताम्बूलं समर्पयामि । नीराजनं समर्पयामि । मन्त्रपुष्पं समर्पयामि
    । प्रदक्षिण नमस्कारान् समर्पयामि ॥ षोडशोपचार पूजा सूर्यनारायण ध्यानम् ध्येयः सदा सवितृमण्डलमध्यवर्ती
    नारायणः सरसिजासन सन्निविष्टः । केयूरवान् मकरकुण्डलवान् किरीटी हारी हिरण्मयवपुः धृतशङ्खचक्रः ॥ अरुणोऽरुणपङ्कजे
    निषण्णः कमलेऽभीतिवरौ करैर्दधानः । स्वरुचाहित मण्डलस्त्रिनेत्रो रविराकल्प शताकुलोऽवतान्नः ॥ ॐ श्रीसूर्यनारायणाय
    नमः । ध्यायामि । ध्यानं समर्पयामि ॥ आवाहनम् स॒हस्र॑शीर् षा॒ पुरु॑षः । स॒ह॒स्रा॒क्ष स्स॒हस्र॑पात् ।
    स भूमिं॑ विँ॒श्वतो॑ वृ॒त्वा । अत्य॑तिष्ठद्दशाङ्गु॒लम् ॥ आगच्छ भगवन् सूर्य मण्डपे च स्थिरो भव । यावत्पूजा
    समाप्येत तावत्त्वं सन्निधौ भव ॥ ॐ श्रीसूर्यनारायणाय नमः । आवाहयामि । स्थापयामि । पूजयामि ॥ आसनम् पुरु॑ष
    ए॒वेदग्ं सर्वम् । उ॒तामृ॑त॒त्व स्येशा॑नः । यदन्ने॑नाति॒रोह॑ति ॥ हेमासन महद्दिव्यं नानारत्नविभूषितम्
    । दत्तं मे गृह्यतां देव दिवाकर नमोऽस्तु ते ॥ ॐ श्रीसूर्यनारायणाय नमः । आसनं समर्पयामि ॥ पाद्यम् गङ्गाजल
    समानीतं परमं पावनं महत् । पाद्यं गृहाण देवेश धामरूप नमोऽस्तु ते ॥ ॐ श्रीसूर्यनारायणाय नमः । पादयोः
    पाद्यं समर्पयामि ॥ अर्घ्यम् भो सूर्य महाद्भुत ब्रह्मविष्णु स्वरूपदृक् । अर्घ्यं अञ्जलिना दत्तं गृहाण
    परमेश्वर ॥ ॐ श्रीसूर्यनारायणाय नमः । हस्तयोः अर्घ्यं समर्पयामि ॥ आचमनीयम् गङ्गादि तीर्थजं तोयं जातीपुष्पैश्च
    वासितम् । ताम्रपात्रे स्थितं दिव्यं गृहाणाचमनीयकम् ॥ ॐ श्रीसूर्यनारायणाय नमः । मुखे आचमनीयं समर्पयामि
    ॥ स्नानम् आपो॒ हिष्ठा म॑यो॒भुव॒स्ता न॑ ऊ॒र्जे द॑धातन । म॒हे रणा॑य॒ चक्ष॑से ॥ यो वः॑ शि॒वत॑मो रस॒स्तस्य॑
    भाजयते॒ह नः॑ । उ॒श॒तीरि॑व मा॒त॑रः ॥ तस्मा॒ अर॑ ङ्गमाम वो॒ यस्य॒ क्षया॑य॒ जिन्व॑थ । आपो॑ ज॒नय॑था च
    नः ॥ ॐ श्रीसूर्यनारायणाय नमः । शुद्धोदक स्नानं समर्पयामि ॥ स्नानानन्तरं आचमनीयं समर्पयामि ॥ वस्त्रम्
    रक्तपट्टयुगं देव सूक्ष्मतन्तुविनिर्मितम् । शुद्धं चैव मया दत्तं गृहाण कमलाकर ॥ ॐ श्रीसूर्यनारायणाय
    नमः । वस्त्रं समर्पयामि ॥ यज्ञोपवीतम् नमः कमलहस्ताय विश्वरूपाय ते नमः । उपवीतं मया दत्तं तद्गृहाण
    दिवाकर ॥ ॐ श्रीसूर्यनारायणाय नमः । यज्ञोपवीतं समर्पयामि ॥ गन्धम् कुङ्कुमागरु कस्तूरी सुगन्धैश्चन्दनादिभिः
    । रक्तचन्दन संयुक्तं गन्धं गृह्णीष्व भास्कर ॥ ॐ श्रीसूर्यनारायणाय नमः । गन्धं समर्पयामि ॥ अर्चन जपाकदम्ब
    कुसुमैः रक्तोत्पल युतानि च । पुष्पाणि गृह्यतां देव सर्वकामप्रदो भव ॥ अङ्ग पूजा ॐ मित्राय नमः पादौ
    पूजयामि । ॐ रवये नमः जङ्घे पूजयामि । ॐ सूर्याय नमः जानुनी पूजयामि । ॐ खगाय नमः ऊरू पूजयामि । ॐ हिरण्यगर्भाय
    नमः कटिं पूजयामि । ॐ पूष्णे नमः गुह्यं पूजयामि । ॐ मरीचये नमः नाभिं पूजयामि । ॐ आदित्याय नमः जठरं
    पूजयामि । ॐ सवित्रे नमः हृदयं पूजयामि । ॐ अर्काय नमः स्तनौ पूजयामि । ॐ भास्कराय नमः कण्ठं पूजयामि
    । ॐ अर्यम्णे नमः स्कन्धौ पूजयामि । ॐ हंसाय नमः हस्तौ पूजयामि । ॐ अहस्कराय नमः मुखं पूजयामि । ॐ ब्रध्नाय
    नमः नासिकां पूजयामि । ॐ जगदेकचक्षुषे नमः नेत्राणि पूजयामि । ॐ भानवे नमः कर्णौ पूजयामि । ॐ त्रिगुणात्मधारिणे
    नमः ललाटं पूजयामि । ॐ विरिञ्चिनारायणाय नमः शिरः पूजयामि । ॐ तिमिरनाशिने नमः सर्वाण्यङ्गानि पूजयामि
    ॥ सूर्य अष्टोत्तर शत नामावली अथवा सूर्य द्वादश नाम पूजा ॥ ॐ आदित्याय नमः । ॐ दिवाकराय नमः । ॐ भास्कराय
    नमः । ॐ प्रभाकराय नमः । ॐ सहस्रांशवे नमः । ॐ त्रिलोचनाय नमः । ॐ हरिदश्वाय नमः । ॐ विभावसवे नमः । ॐ
    दिनकराय नमः । ॐ द्वादशात्मकाय नमः । ॐ त्रिमूर्तये नमः । ॐ सूर्याय नमः ॥ ॐ श्रीसूर्यनारायणाय नमः ।
    अष्टोत्तर शत नामावली पूजां समर्पयामि । अक्षतान् पुष्पाणि च समर्पयामि ॥ धूपम् दशाङ्गोगुग्गुलोद्भूतः
    कालागरु समन्वितः । आघ्रेयः सर्वदेवानां धूपोऽयं प्रतिगृह्यताम् ॥ ॐ श्रीसूर्यनारायणाय नमः । धूपमाघ्रापयामि
    ॥ दीपम् कार्पासवर्तिकायुक्तं गोघृतेन समन्वितम् । दीपं गृहाण देवेश त्रैलोक्य तिमिरापह ॥ ॐ श्रीसूर्यनारायणाय
    नमः । दीपं दर्शयामि ॥ नैवेद्यम् पायसं घृतसंयुक्तं नाना पक्वान्न संयुतम् । नैवेद्यं च मया दत्तं शान्तिं
    कुरु जगत्पते ॥ ओ म्भूर्भुव॒स्सुवः॒ । तत्स॑वि॒तुर्वरे म्भर्गो॑ दे॒वस्य॑ धीमहि । धि॒यो यो नः॑ प्रचो॒दया
    त् ॥ सत्यं त्वा ऋतेन परिषिञ्चामि । अमृतमस्तु । अमृतोपस्तरणमसि । ॐ प्राणाय स्वाहा । ॐ अपानाय स्वाहा
    । ॐ व्यानाय स्वाहा । ॐ उदानाय स्वाहा । ॐ समानाय स्वाहा । मध्ये मध्ये पानीयं समर्पयामि । अमृतापिधानमसि
    । उत्तरापोशनं समर्पयामि । हस्तौ प्रक्षालयामि । पादौ प्रक्षालयामि । शुद्धाचमनीयं समर्पयामि ॥ ॐ श्रीसूर्यनारायणाय
    नमः । नैवेद्यं समर्पयामि ॥ ताम्बूलम् एलालवङ्ग कर्पूर खदिरैश्च सपूगकैः । नागवल्लीदलैर्युक्तं ताम्बूलं
    प्रतिगृह्यताम् ॥ ॐ श्रीसूर्यनारायणाय नमः । ताम्बूलं समर्पयामि ॥ नीराजनम् वेदा॒हमे॒त न्तम॑स॒स्तु पा॒रे
    । सर्वा॑णि रू॒पाणि॑ वि॒चित्य॒ धीरः॑ । नामा॑नि कृ॒त्वा ॥ पञ्चवर्ति समायुक्तं सर्वमङ्गलदायकम् । नीराजनं
    गृहाणेदं सर्वसौख्यकरो भव ॥ ॐ श्रीसूर्यनारायणाय नमः । नीराजनं समर्पयामि ॥ मन्त्रपुष्पम् धा॒ता पु॒रस्ता॒द्यमु॑दाज॒हार॑
    । श॒क्रः प्रवि॒द्वा न्प्र॒दिश॒श्चत॑स्रः । तमे॒वं विँ॒द्वान॒मृत॑ इ॒ह भ॑वति । नान्यः पन्था॒ अय॑नाय विद्यते
    ॥ ॐ भास्कराय विद्महे महाद्युतिकराय धीमहि । तन्नो आदित्यः प्रचोदयात् ॥ चम्पकैः शतपत्रैश्च कल्हारैः
    करवीरकैः । पाटलैर्बकुलैर्युक्तं गृहाण कुसुमाञ्जलिम् ॥ ॐ श्रीसूर्यनारायणाय नमः । मन्त्रपुष्पं समर्पयामि
    ॥ प्रदक्षिणम् यानि कानि च पापानि जन्मान्तर कृतानि च । तानि तानि विनश्यन्ति प्रदक्षिण पदे पदे ॥ पापोऽहं
    पापकर्माऽहं पापात्मा पापसम्भव । त्राहि मां कृपया देव शरणागतवत्सल ॥ अन्यथा शरणं नास्ति त्वमेव शरणं
    मम । तस्मात्कारुण्य भावेन रक्ष रक्ष जनार्दन ॥ ॐ श्रीसूर्यनारायणाय नमः । प्रदक्षिण नमस्कारान् समर्पयामि
    ॥ नमस्कारः उद्यन्नद्य विवस्वानारोहन्नुत्तरां दिवम् । देवः हृद्रोगं मम सूर्यो हरिमाणं चाशु नाशयतु ॥
    ॐ श्रीसूर्यनारायणाय नमः । नमस्कारान् समर्पयामि ॥ द्वादशार्घ्याणि दिवाकर नमस्तुभ्यं पापं नाशय भास्कर
    । त्रयीमयाय विश्वात्मन् गृहाणार्घ्यं नमोऽस्तु ते ॥ ॐ मित्राय नमः इदमर्घ्यं समर्पयामि । ॐ रवये नमः
    इदमर्घ्यं समर्पयामि । ॐ सूर्याय नमः इदमर्घ्यं समर्पयामि । ॐ भानवे नमः इदमर्घ्यं समर्पयामि । ॐ खगाय
    नमः इदमर्घ्यं समर्पयामि । ॐ पूष्णे नमः इदमर्घ्यं समर्पयामि । ॐ हिरण्यगर्भाय नमः इदमर्घ्यं समर्पयामि
    । ॐ मरीचये नमः इदमर्घ्यं समर्पयामि । ॐ आदित्याय नमः इदमर्घ्यं समर्पयामि । ॐ सवित्रे नमः इदमर्घ्यं
    समर्पयामि । ॐ अर्काय नमः इदमर्घ्यं समर्पयामि । ॐ भास्कराय नमः इदमर्घ्यं समर्पयामि ॥ सर्वोपचाराः ॐ
    श्रीसूर्यनारायणाय नमः । छत्रं समर्पयामि । चामरं समर्पयामि । गीतं श्रावयामि । नृत्यं दर्शयामि । समस्त
    राजोपचारान् देवोपचारान् समर्पयामि ॥ स्तोत्र सूक्त पठनम् श्री सूर्य नमस्कार मन्त्राः क्षमाप्रार्थना
    मन्त्रहीनं क्रियाहीनं भक्तिहीनं जनार्दन । यत्पूजितं मया देव परिपूर्णं तदस्तु ते ॥ अज्ञानाद्वा प्रमादाद्वा
    वैकल्यात्साधनस्य वा । यन्न्यूनमतिरिक्तं च तत्सर्वं क्षन्तुमर्हसि ॥ कायेन वाचा मनसेन्द्रियैर्वा बुद्ध्यात्मना
    वा प्रकृतेः स्वभावात् । करोमि यद्यत् सकलं परस्मै नारायणायेति समर्पयामि ॥ अनया ध्यान षोडशोपचार पूजया
    श्रीसूर्यनारायण स्वामी सुप्रीतः सुप्रसन्नः वरदो भवतु ॥ उद्वासनम् ॐ श्रीसूर्यनारायणाय नमः । यथास्थानं
    उद्वासयामि । शोभनार्थे क्षेमाय पुनरागमनाय च ॥ प्रसाद ग्रहणम् अकालमृत्युहरणं सर्वव्याधिनिवारणम् । समस्तपापक्षयकरं
    देवता पादोदकं शुभम् ॥ श्रीसूर्यनारायण स्वामि प्रसादं शिरसा गृह्णामि ॥ ॐ शान्तिः शान्तिः शान्तिः ॥
    ॐ तत्सत् ब्रह्मार्पणमस्तु ॥
