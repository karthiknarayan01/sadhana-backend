id: vahnikritamsvahastotram
category: stotram
name:
  english: vahnikritamsvahastotram
  devanagari: वह्निकृतंस्वाहास्तोत्रम्
content:
  english: vahnikritam svahastotram vahniruvaca | svaha''dya prakriteramsha mantratantrangarupini | mantranam
    phaladatri ca dhatri ca jagatam sati || 51|| siddhisvarupa siddha ca siddhida sarvada nrinam | hutashadahikashaktistatpranadhikarupini
    || 52|| samsarasararupa ca ghorasamsaratarini | devajivanarupa ca devaposhanakarini || 53|| shodashaitani
    namani yah pathedbhaktisamyutah | sarvasiddhirbhavettasya ceha loke paratra ca || 54|| nangahino bhavettasya
    sarvakarmasu shobhanam | aputro labhate putramabharyo labhate priyam || 55|| iti shribrahmavaivartte
    mahapurane dvitiye prakritikhande catvarimshadhyayantargatam vahnikritam svahastotram samaptam | brahmavaivartapurana
    | prakritikhanda | adhyaya 40
  devanagari: वह्निकृतं स्वाहास्तोत्रम् वह्निरुवाच । स्वाहाऽऽद्या प्रकृतेरंशा मन्त्रतन्त्राङ्गरूपिणी ।
    मन्त्राणां फलदात्री च धात्री च जगतां सती ॥ ५१॥ सिद्धिस्वरूपा सिद्धा च सिद्धिदा सर्वदा नृणाम् । हुताशदाहिकाशक्तिस्तत्प्राणाधिकरूपिणी
    ॥ ५२॥ संसारसाररूपा च घोरसंसारतारिणी । देवजीवनरूपा च देवपोषणकारिणी ॥ ५३॥ षोडशैतानि नामानि यः पठेद्भक्तिसंयुतः
    । सर्वसिद्धिर्भवेत्तस्य चेह लोके परत्र च ॥ ५४॥ नाङ्गहीनो भवेत्तस्य सर्वकर्मसु शोभनम् । अपुत्रो लभते
    पुत्रमभार्यो लभते प्रियाम् ॥ ५५॥ इति श्रीब्रह्मवैवर्त्ते महापुराणे द्वितीये प्रकृतिखण्डे चत्वारिंशाध्यायान्तर्गतं
    वह्निकृतं स्वाहास्तोत्रं समाप्तम् । ब्रह्मवैवर्तपुराण । प्रकृतिखण्ड । अध्याय ४०
