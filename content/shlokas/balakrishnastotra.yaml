id: balakrishnastotra
category: stotram
name:
  english: balakrishnastotra
  devanagari: बालक्रिश्नस्तोत्र
content:
  english: kinnarah || 4|| ye ye cara'carashcaiva sarve tava vibhutayah | avirbhavastirobhavah sarvesham
    ca tavecchaya || 5|| abhayam dehi govimda vahnisamharanam kuru | vayam tvam sharanam yamo raksha nah
    sharanagatan || 6|| ityevamuktva te sarve tasthurdhyatva padambujam | duribhutastu davagnih shrikrishnamritadrishtitah
    || 7|| duribhute ca davagnau nanrituste mudanvitah | sarvapadah pranashyanti harismaranamatratah ||
    8|| idam stotram mahapunyam pratarutthaya yah pathet | vahnito na bhavettasya bhayam janmani janmani
    || 9|| shatrugraste ca davagnau vipattau pranasamkate | stotrametat pathitva tu mucyate na'tra samshayah
    || 10|| shatrusainyam kshayam yati sarvatra vijayi bhavet | iha loke harerbhaktimante dasyam labhedhruvam
    || 11|| || iti shribrahmavaivarte shrikrishnajanmakhande balakritam krishnastotram athava davanala
    samharana stotram sampurnam ||
  devanagari: किन्नराः ॥ ४॥ ये ये चराऽचराश्चैव सर्वे तव विभूतयः । आविर्भावस्तिरोभावः सर्वेषां च तवेच्छया
    ॥ ५॥ अभयं देहि गोविंद वह्निसंहरणं कुरु । वयं त्वां शरणं यामो रक्ष नः शरणागतान् ॥ ६॥ इत्येवमुक्त्वा
    ते सर्वे तस्थुर्ध्यात्वा पदाम्बुजम् । दूरीभूतस्तु दावाग्निः श्रीकृष्णामृतदृष्टितः ॥ ७॥ दूरीभूते च
    दावाग्नौ ननृतुस्ते मुदान्विताः । सर्वापदः प्रणश्यन्ति हरिस्मरणमात्रतः ॥ ८॥ इदं स्तोत्रं महापुण्यं
    प्रातरूत्थाय यः पठेत् । वह्नितो न भवेत्तस्य भयं जन्मनि जन्मनि ॥ ९॥ शत्रुग्रस्ते च दावाग्नौ विपत्तौ
    प्राणसंकटे । स्तोत्रमेतत् पठित्वा तु मुच्यते नाऽत्र संशयः ॥ १०॥ शत्रुसैन्यं क्षयं याति सर्वत्र विजयी
    भवेत् । इह लोके हरेर्भक्तिमन्ते दास्यं लभेध्रुवम् ॥ ११॥ ॥ इति श्रीब्रह्मवैवर्ते श्रीकृष्णजन्मखण्डे
    बालकृतं कृष्णस्तोत्रं अथवा दावानल संहरण स्तोत्रं सम्पूर्णम् ॥
