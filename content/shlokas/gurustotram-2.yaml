id: gurustotram-2
category: stotram
name:
  english: gurustotram 2
  devanagari: गुरुस्तोत्रम् २
content:
  english: nirayam vrajet || 4|| gurupadambujam dhyayedgurornama sada japet | gurorvartam tu kathayedguroranyam
    na bhavayet || 5|| gurupadau ca shirasa manasa vacasa tatha | yah smaretsatatam bhaktya santushtastasya
    keshavah || 6|| harau rushte gurustrata gurau rushte na kashcana | guruprasadat sarveshtasiddhirbhavati
    nanyatha || 7|| gurusamsmaranam karyam sarvadaiva mumukshubhih | utthane bhojane snane grantharambhe
    visheshatah || 8|| guruprasado balavan na tasmadbalavattaram | yadguruh suprasannah san dadyat tannanyatha
    bhavet || 9|| shubhan dhyayanti ye kaman gurudevaprasadajan | itaranatmapapotthan tesham vidya phalishyati
    || 10|| smritva gurum purvagurumadimulagurumstatha | devatam vasudevam ca vidyabhyasi tu siddhibhak
    || 11|| jnanadrite naiva muktirjnanam naiva gurovina | tasmadgurum prapadyeta jijnasuh shreya uttamam
    || 12|| tatra bhagavatan dharman shikshedgurvatmadaivatah | amayayanuvritya ca tushyedatmatmado harih
    || 13|| ahobhagyamahobhagyam gurupadanuvartinam | aihikamushmikam saukhyam vardhate tadanugrahat ||
    14|| aho daurbhagyamatulam vimukhanam harau gurau | aihikam hrasate saukhyam duhkham narakamedhate
    || 15|| yadyat satkrityajam punyam tatsarvam gurave'rpayet | tena tat saphalam proktamanyatha nishphalam
    bhavet || 16|| gururgururgururiti japato nasti patakam | tasmadguruprasadartham yateta matimannarah
    || 17|| guroh seva guroh stotram shishyakrityam param smritam | doshadrishtiranarthayetyumamaha sadashivah
    || 18|| ahobhagyamahobhagyam madhvamarganuyayinam | daivam ramapatiryesham yadgururbharatipatih ||
    19|| sarvadharman parityajya gurudharman samacara | na guroradhikam kincit purusharthacatushtaye ||
    20|| sadhanam vidyate devi gurorajnam na langhayet | dehadatpiturevayam hyadhiko jnanadanatah || 21||
    pita mata tatha bhrata sarve samsarahetavah | gururekah sada sevyah samsaroddharanakshamah || 22||
    gurubhaktah sada sevyo gurubhaktasya darshane | mano me gahate devi kada drakshye gurupriyam || 23||
    sarve dharmah kritastena sarvatirthani tena ca | yasya syadguruvakyeshu bhaktih sarvottamottama ||
    24|| shariram vasu vijnanam vasah karma gunan asun | gurvartham dharayedyastu sa shishyo netarah smritah
    || 25|| acaryasya priyam kuryadpranairapi dhanairapi | karmana manasa vaca sa yati paramam gatim ||
    26|| na snanasandhye na ca padasevanam harerna carca vidhina maya krita | nishkaranam me gatamayuralpakam
    tasmadguro mam kripaya samuddhara || 27|| karmana manasa vaca ya ceshta mama nityashah | keshavaradhane
    sa syajjanmajanmantareshvapi || 28|| madrisho na parah papi tvadrisho na dayaparah | iti matva jagannatha
    raksha mam sharanagatam || 29|| kayena vaca manasendriyairva budhyatmana vanusritah svabhavam | karoti
    yadyatsakalamparasmai narayanayeti samarpayettat || 30|| iti shrigurustotram sampurnam |
  devanagari: निरयं व्रजेत् ॥ ४॥ गुरुपादाम्बुजं ध्यायेद्गुरोर्नाम सदा जपेत् । गुरोर्वार्तां तु कथयेद्गुरोरन्यं
    न भावयेत् ॥ ५॥ गुरुपादौ च शिरसा मनसा वचसा तथा । यः स्मरेत्सततं भक्त्या सन्तुष्टस्तस्य केशवः ॥ ६॥ हरौ
    रुष्टे गुरुस्त्राता गुरौ रुष्टे न कश्चन । गुरुप्रसादात् सर्वेष्टसिद्धिर्भवति नान्यथा ॥ ७॥ गुरुसंस्मरणं
    कार्यं सर्वदैव मुमुक्षुभिः । उत्थाने भोजने स्नाने ग्रन्थारम्भे विशेषतः ॥ ८॥ गुरुप्रसादो बलवान् न तस्माद्बलवत्तरम्
    । यद्गुरुः सुप्रसन्नः सन् दद्यात् तन्नान्यथा भवेत् ॥ ९॥ शुभान् ध्यायन्ति ये कामान् गुरुदेवप्रसादजान्
    । इतरानात्मपापोत्थान् तेषां विद्या फलिष्यति ॥ १०॥ स्मृत्वा गुरुं पूर्वगुरुमादिमूलगुरूंस्तथा । देवतां
    वासुदेवं च विद्याभ्यासी तु सिद्धिभाक् ॥ ११॥ ज्ञानादृते नैव मुक्तिर्ज्ञानं नैव गुरोविना । तस्माद्गुरुं
    प्रपद्येत जिज्ञासुः श्रेय उत्तमम् ॥ १२॥ तत्र भागवतान् धर्मान् शिक्षेद्गुर्वात्मदैवतः । अमाययानुवृत्या
    च तुष्येदात्मात्मदो हरिः ॥ १३॥ अहोभाग्यमहोभाग्यं गुरुपादानुवर्तिनाम् । ऐहिकामुष्मिकं सौख्यं वर्धते
    तदनुग्रहात् ॥ १४॥ अहो दौर्भाग्यमतुलं विमुखानां हरौ गुरौ । ऐहिकं ह्रसते सौख्यं दुःखं नारकमेधते ॥ १५॥
    यद्यत् सत्कृत्यजं पुण्यं तत्सर्वं गुरवेऽर्पयेत् । तेन तत् सफलं प्रोक्तमन्यथा निष्फलं भवेत् ॥ १६॥ गुरुर्गुरुर्गुरुरिति
    जपतो नास्ति पातकम् । तस्माद्गुरुप्रसादार्थं यतेत मतिमान्नरः ॥ १७॥ गुरोः सेवा गुरोः स्तोत्रं शिष्यकृत्यं
    परं स्मृतम् । दोषदृष्टिरनर्थायेत्युमामाह सदाशिवः ॥ १८॥ अहोभाग्यमहोभाग्यं मध्वमार्गानुयायिनाम् । दैवं
    रमापतिर्येषां यद्गुरुर्भारतीपतिः ॥ १९॥ सर्वधर्मान् परित्यज्य गुरुधर्मान् समाचर । न गुरोरधिकं किञ्चित्
    पुरुषार्थचतुष्टये ॥ २०॥ साधनं विद्यते देवि गुरोराज्ञां न लङ्घयेत् । देहदात्पितुरेवायं ह्यधिको ज्ञानदानतः
    ॥ २१॥ पिता माता तथा भ्राता सर्वे संसारहेतवः । गुरुरेकः सदा सेव्यः संसारोद्धरणक्षमः ॥ २२॥ गुरुभक्तः
    सदा सेव्यो गुरुभक्तस्य दर्शने । मनो मे गाहते देवी कदा द्रक्ष्ये गुरुप्रियम् ॥ २३॥ सर्वे धर्माः कृतास्तेन
    सर्वतीर्थानि तेन च । यस्य स्याद्गुरुवाक्येषु भक्तिः सर्वोत्तमोत्तमा ॥ २४॥ शरीरं वसु विज्ञानं वासः
    कर्म गुणान् असून् । गुर्वर्थं धारयेद्यस्तु स शिष्यो नेतरः स्मृतः ॥ २५॥ आचार्यस्य प्रियं कुर्याद्प्राणैरपि
    धनैरपि । कर्मणा मनसा वाचा स याति परमां गतिम् ॥ २६॥ न स्नानसन्ध्ये न च पादसेवनं हरेर्न चार्चा विधिना
    मया कृता । निष्कारणं मे गतमायुरल्पकं तस्माद्गुरो मां कृपया समुद्धर ॥ २७॥ कर्मणा मनसा वाचा या चेष्टा
    मम नित्यशः । केशवाराधने सा स्याज्जन्मजन्मान्तरेष्वपि ॥ २८॥ मादृशो न परः पापी त्वादृशो न दयापरः । इति
    मत्वा जगन्नाथ रक्ष मां शरणागतम् ॥ २९॥ कायेन वाचा मनसेन्द्रियैर्वा बुध्यात्मना वानुसृतः स्वभावम् ।
    करोति यद्यत्सकलम्परस्मै नारायणायेति समर्पयेत्तत् ॥ ३०॥ इति श्रीगुरुस्तोत्रं सम्पूर्णम् ।
