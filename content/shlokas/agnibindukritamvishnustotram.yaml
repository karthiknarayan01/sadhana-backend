id: agnibindukritamvishnustotram
category: stotram
name:
  english: agnibindukritamvishnustotram
  devanagari: अग्निबिन्दुकृतंविष्णुस्तोत्रम्
content:
  english: 30|| atandritamanobuddhindriya yam sanakadayah | dhyayanto'pi hridakashe na vindanti yatharthatah
    || 31|| naradadyairmunivarairabalabrahmacaribhih | giyamanacaritro'pi na samyagyo'dhigamyate || 32||
    tam sukshmarupamajamavyayamekamadyam bahmadyagocaramajeyamanantashaktim | nityam niramayamamurtamacintyamurtim
    kastvam caracara caracarabhinna vetti || 33|| ekaikameva tava nama harenmurare janmarjitaghamaghinam
    ca mahapadadhyam | dadyatphalam ca mahitam mahato makhasya japtam mukunda madhusudana madhaveti ||
    34|| narayaneti narakarnavataraneti damodareti madhuheti caturbhujeti | vishvambhareti virajeti janardaneti
    kvastiha janma japatam kva kritantabhitih || 35|| ye tvam trivikrama sada hridi shilayanti kadambini
    rucira rocishamambujaksham | saudamanivilasitamshukavitamurte te'pi sprishanti tava kantimacintyarupam
    || 36|| shrivatsalanchana hare'cyuta kaitabhare govinda tarkshyaratha keshava cakrapane | lakshmipate
    danujasudana sharngapane tvadbhaktibhaji na bhayam kvacidasti pumsi || 37|| yairarcito'si bhagavamstulasiprasunai
  devanagari: ३०॥ अतन्द्रितमनोबुद्धीन्द्रिया यं सनकादयः । ध्यायन्तोऽपि हृदाकाशे न विन्दन्ति यथार्थतः ॥
    ३१॥ नारदाद्यैर्मुनिवरैराबालब्रह्मचारिभिः । गीयमानचरित्रोऽपि न सम्यग्योऽधिगम्यते ॥ ३२॥ तं सूक्ष्मरूपमजमव्ययमेकमाद्यं
    बह्माद्यगोचरमजेयमनन्तशक्तिम् । नित्यं निरामयममूर्तमचिन्त्यमूर्तिं कस्त्वां चराचर चराचरभिन्न वेत्ति
    ॥ ३३॥ एकैकमेव तव नाम हरेन्मुरारे जन्मार्जिताघमघिनां च महापदाढ्यम् । दद्यात्फलं च महितं महतो मखस्य
    जप्तं मुकुन्द मधुसूदन माधवेति ॥ ३४॥ नारायणेति नरकार्णवतारणेति दामोदरेति मधुहेति चतुर्भुजेति । विश्वम्भरेति
    विरजेति जनार्दनेति क्वास्तीह जन्म जपतां क्व कृतान्तभीतिः ॥ ३५॥ ये त्वां त्रिविक्रम सदा हृदि शीलयन्ति
    कादम्बिनी रुचिर रोचिषमम्बुजाक्षम् । सौदामनीविलसितांशुकवीतमूर्ते तेऽपि स्पृशन्ति तव कान्तिमचिन्त्यरूपाम्
    ॥ ३६॥ श्रीवत्सलाञ्छन हरेऽच्युत कैटभारे गोविन्द तार्क्ष्यरथ केशव चक्रपाणे । लक्ष्मीपते दनुजसूदन शार्ङ्गपाणे
    त्वद्भक्तिभाजि न भयं क्वचिदस्ति पुंसि ॥ ३७॥ यैरर्चितोऽसि भगवंस्तुलसीप्रसूनै
