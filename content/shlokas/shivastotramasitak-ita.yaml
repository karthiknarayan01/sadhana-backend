id: shivastotramasitak-ita
category: stotram
name:
  english: shivastotramasitakṟita
  devanagari: शिवस्तोत्रमसितक्ऱित
content:
  english: shrishivastotram asitakrita shriganeshaya namah || asita uvaca | jagadguro namastubhyam shivaya
    shivadaya ca | yogindranam ca yogindra gurunam gurave namah || 1|| mrityormrityusvarupena mrityusamsarakhandana
    mrityorisha mrityubija mrityunjaya namo'stu te || 2|| kalarupam kalayatam kalakalesha karana | kaladatita
    kalastha kalakala namo'stu te || 3|| gunatita gunadhara gunabija gunatmaka | gunisha guninam bija
    guninam gurave namah || 4|| brahmasvarupa brahmajna brahmabhave ca tatparah | brahmabijasvarupena
    brahmabija namo'stu te || 5|| iti stutva shivam natva purastasthau munishvarah | dinavatsashrunetrashca
    pulakancitavigrahah || 6|| asitena kritam stotram bhaktiyuktashca yah pathet | varshamekam havishyashi
    shankarasya mahatmanah || 7|| sa labhedvaishnavam putram jnaninam cirajivinam | bhaveddhanadhyo duhkhi
    ca muko bhavati panditah || 8|| abharyo labhate bharyam sushilam ca pativratam | iha loke sukham bhuktva
    yatyante shivasannidhim || 9|| idam stotram pura dattam brahmana ca pracetase | pracetasa svaputrayasitaya
    dattamuttamam || 10|| iti shribrahmavaivarte mahapurane shrikrishnajanmakhande asitakritashivastotram
    sampurnam ||
  devanagari: श्रीशिवस्तोत्रं असितकृत श्रीगणेशाय नमः ॥ असित उवाच । जगद्गुरो नमस्तुभ्यं शिवाय शिवदाय च
    । योगीन्द्राणां च योगीन्द्र गुरूणां गुरवे नमः ॥ १॥ मृत्योर्मृत्युस्वरूपेण मृत्युसंसारखण्डन मृत्योरीश
    मृत्युबीज मृत्युञ्जय नमोऽस्तु ते ॥ २॥ कालरूपं कलयतां कालकालेश कारण । कालादतीत कालस्थ कालकाल नमोऽस्तु
    ते ॥ ३॥ गुणातीत गुणाधार गुणबीज गुणात्मक । गुणीश गुणिनां बीज गुणिनां गुरवे नमः ॥ ४॥ ब्रह्मस्वरूप ब्रह्मज्ञ
    ब्रह्मभावे च तत्परः । ब्रह्मबीजस्वरूपेण ब्रह्मबीज नमोऽस्तु ते ॥ ५॥ इति स्तुत्वा शिवं नत्वा पुरस्तस्थौ
    मुनीश्वरः । दीनवत्साश्रुनेत्रश्च पुलकाञ्चितविग्रहः ॥ ६॥ असितेन कृतं स्तोत्रं भक्तियुक्तश्च यः पठेत्
    । वर्षमेकं हविष्याशी शङ्करस्य महात्मनः ॥ ७॥ स लभेद्वैष्णवं पुत्रं ज्ञानिनं चिरजीविनम् । भवेद्धनाढ्यो
    दुःखी च मूको भवति पण्डितः ॥ ८॥ अभार्यो लभते भार्यां सुशीलां च पतिव्रताम् । इह लोके सुखं भुक्त्वा यात्यन्ते
    शिवसन्निधिम् ॥ ९॥ इदं स्तोत्रं पुरा दत्तं ब्रह्मणा च प्रचेतसे । प्रचेतसा स्वपुत्रायासिताय दत्तमुत्तमम्
    ॥ १०॥ इति श्रीब्रह्मवैवर्ते महापुराणे श्रीकृष्णजन्मखण्डे असितकृतशिवस्तोत्रं सम्पूर्णम् ॥
