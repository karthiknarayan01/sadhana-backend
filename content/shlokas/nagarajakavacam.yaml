id: nagarajakavacam
category: kavacha
name:
  english: nagarajakavacam
  devanagari: नागराजकवचम्
content:
  english: ananto me shirah patu kantham sankarshanastatha | karkotako netrayugmam kapilah karnayugmakam
    || 1|| vakshahsthalam nagayakshah bahu kalabhujangamah | udaram dhritarashtrashca vajranagastu prishthakam
    || 2|| marmangamashvasenastu padavashvataro'vatu | vasukih patu mam pracye agneyam tu dhananjayah
    || 3|| takshako dakshine patu nairrityam shankhapalakah | mahapadmah praticyam tu vayavyam shankhanilakah
    || 4|| uttare kambalah patu ishanyam nagabhairavah | urdhvam cairavato'dhastat nagabhetalanayakah
    | sada sarvatra mam patu nagalokadhinayakah || 5|| iti shrinagarajakavacam sampurnam |
  devanagari: अनन्तो मे शिरः पातु कण्ठं सङ्कर्षणस्तथा । कर्कोटको नेत्रयुग्मं कपिलः कर्णयुग्मकम् ॥ १॥ वक्षःस्थलं
    नागयक्षः बाहू कालभुजङ्गमः । उदरं धृतराष्ट्रश्च वज्रनागस्तु पृष्ठकम् ॥ २॥ मर्माङ्गमश्वसेनस्तु पादावश्वतरोऽवतु
    । वासुकिः पातु मां प्राच्ये आग्नेयां तु धनञ्जयः ॥ ३॥ तक्षको दक्षिणे पातु नैरृत्यां शङ्खपालकः । महापद्मः
    प्रतीच्यां तु वायव्यां शङ्खनीलकः ॥ ४॥ उत्तरे कम्बलः पातु ईशान्यां नागभैरवः । ऊर्ध्वं चैरावतोऽधस्तात्
    नागभेतालनायकः । सदा सर्वत्र मां पातु नागलोकाधिनायकाः ॥ ५॥ इति श्रीनागराजकवचं सम्पूर्णम् ।
