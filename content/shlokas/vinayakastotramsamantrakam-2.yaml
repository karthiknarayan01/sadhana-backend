id: vinayakastotramsamantrakam-2
category: mantra
name:
  english: vinayakastotramsamantrakam
  devanagari: विनायकस्तोत्रम्समन्त्रकम्
content:
  english: vinayakastotram samantrakam va ranasyo da raghnorthya e kadam ta shshivatmakah su sharmakri
    tta rakorcyah ka vista tpu rushapriyah de vah pavi tre kshanordyo dam ti ca ru strilocana va gmisho
    ma ya titatma ta pasho sha khya akhugah na divamdyo ya mishano ya shasvi ya shaspadah da rshaniyo
    vi ghnarajo vi ghnaha vi ghnakridviratsa bhyo hritap dma nilayo dma rasa dma vihapakah ra ktangorko
    he mamali he rambo he mamdashtraka sva ratprabha a jo'nanto va renyo ma timan guni ti rthakirtir va
    rakarah kra tvisho ha pitasurah kri pakaro dhu mraketus tum dilo de vavallabhah ta pasvishas ta paharo
    da kini va rito bhayah vi shvapriyo ya kshavandyo ya shtana ya vivardhanah na narupo dhi ra adyo dhi
    matam dhi rakah sudhih ya mishvaro ma hahasti ma hatma ma ha uttamah ka rta'karta hi takaro hi tajno
    hi tashasanah sto ta stavyas tam tramulas tam trajnas tam travigrahah tra yi vandyo no danajno no
    dana no ditadvijah mi trabho ma da nasmero dam ti ma ru dupasitah dam do prama tah shastaryas ti rthamim
    drah stoghaha| sa tyasandhah pra kashatma pra sanna pra natartiha mam travidya co ditatma co dana
    co ditakhilah tra yidharmo da shatito da ksho'bhe da umasutah kam nah sa de yat pranuto yat sa pa
    yat sada bhayat iti shrivasudevanandasarasvativiracitam samantrakam vinayakastotram sampurnam || vasudevanandasarasvatikrita
    vinayakastotramidam samantrakam | dattatreyaya vidmahe avadhutaya dhimahi | tam no dattah pracodayat
    | ekadantaya vidmahe vakratundaya dhimahi | tam no danti pracodayat | tatpurushaya vidmahe mahadevaya
    dhimahi | tam no rudrah pracodayat | etadakshararashighatitamidam stotram |
  devanagari: विनायकस्तोत्रम् समन्त्रकम् वा रणास्यो द रघ्नोर्थ्य ए कदं त श्शिवात्मकः सु शर्मकृ त्ता रकोर्च्यः
    क विस्त त्पु रुषप्रियः दे वः पवि त्रे क्षणोर्द्यो दं ती चा रु स्त्रिलोचना वा ग्मीशो मा या तीतात्मा
    ता पशो षा ख्य आखुगः न दीवंद्यो य मीशानो य शस्वी य शास्पदः द र्शनीयो वि घ्नराजो वि घ्नहा वि घ्नकृद्विराट्स
    भ्यो हृतप् द्म निलयो द्म रस द्म विहापकः र क्तङ्गोर्को हे ममाली हे रम्बो हे मंदष्ट्रक स्व राट्प्रभा
    अ जोऽनन्तो व रेण्यो म तिमान् गुणी ती र्थकीर्तिर् व रकरः क्र त्वीशो हा पितासुरः कृ पाकरो धू म्रकेतुस्
    तुं दिलो दे ववल्लभः त पस्वीशस् ता पहारो डा किनी वा रितो भयः वि श्वप्रियो य क्षवन्द्यो य ष्टान य विवर्धनः
    ना नारूपो धी र आद्यो धी मतां धी रकः सुधीः य मीश्वरो म हाहस्ती म हात्मा म ह उत्तमः क र्ताऽकर्ता हि
    तकरो हि तज्ञो हि तशासनः स्तो ता स्तव्यस् तं त्रमूलस् तं त्रज्ञस् तं त्रविग्रहः त्र यी वन्द्यो नो दनाज्ञो
    नो दना नो दितद्विजः मि त्राभो म द नस्मेरो दं ती म रु दुपासितः दं डो प्रम तः शास्तार्यस् ती र्थमिं
    द्रः स्तोघहा। स त्यसन्धः प्र काशात्मा प्र सन्न प्र णतार्तिहा मं त्रविद्या चो दितात्मा चो दना चो दिताखिलः
    त्र यीधर्मो द शातीतो द क्षोऽभे द उमासुतः कं नः स दे यात् प्रणुतो यात् स पा यात् सदा भयात् इति श्रीवासुदेवानन्दसरस्वतिविरचितं
    समन्त्रकं विनायकस्तोत्रं सम्पूर्णम् ॥ वासुदेवानन्दसरस्वतीकृत विनायकस्तोत्रमिदं समन्त्रकं । दत्तात्रेयाय
    विद्महे अवधूताय धीमहि । तं नो दत्तः प्रचोदयात् । एकदन्ताय विद्महे वक्रतुण्डाय धीमहि । तं नो दन्ती
    प्रचोदयात् । तत्पुरुषाय विद्महे महादेवाय धीमहि । तं नो रुद्रः प्रचोदयात् । एतदक्षरराशिघटितमिदं स्तोत्रम्
    ।
