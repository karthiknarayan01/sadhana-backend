id: purushottamaproktamshivarajnishrihridayastotram
category: stotram
name:
  english: purushottamaproktamshivarajnishrihridayastotram
  devanagari: पुरुषोत्तमप्रोक्तंशिवराज्निश्रीहृदयस्तोत्रम्
content:
  english: '| itilaksham japet siddhirjayate brahmasadrishi || 19|| gurum dhyayet snapayecca pujayedbahuvastubhih
    | bhojayetsampraseveta toshayetsarvadanakaih || 20|| gururbrahma gururvishnurguruh shrishankarah svayam
    | gururnarayanah krishno gururbrahmaparam prabhuh || 21|| guruh pita patih putro bandhurmata ca rakshakah
    | mokshadastarakashcapi maha''''nandaprado guruh || 22|| anadishrikrishnanarayanah sakshadgururharih
    | ityuktva pranametapi nirajayedgurum tatah || 23|| pushpanjalim disheccapi dandavadvai samacaret
    | danam dadyacca gurave sveshtatamasya vastunah || 24|| cetano vai bhagavan sa gurureva pareshvarah
    | trayate capadam vratannayatyeva''ksharam padam || 25|| nityam vai prathamam pratargurordarshanamuttamam
    | guroh padangushthajalam pibet pavanamuttamam || 26|| api hatyadipapanam nashakam caranamritam |
    api mayadibandhanam kartanam caranau guroh || 27|| yamapashavimokshaya shaktam vai smaranam guroh
    | anathanam sada natho narayano guruh parah || 28|| gam gadham ca tamo guptam runaddhitigururmatah
    | gurormurtim shubham kritva grihe kanthe prarakshayet || 29|| gurvadvaitamupasita''shnute''mritamanuttamam
    | ityetat kathitam lakshmi sarat sarataram param || 30|| matritirthat pitritirthadgurutirtham mahattamam
    | shvashrutirthatpatitirthadgurutirtham mahattamam || 31|| satitirthat priyatirthadgurutirtham mahattamam
    | devatirthajjadatirthadgurutirtham mahattamam || 32|| arcatirthanmakhatirthadgurutirtham mahattamam
    | vratatirthattapastirthadgurutirtham mahattamam || 33|| jnanatirthadyogatirthadgurutirtham mahattamam
    | paropakaraditirthebhyo gurutirtham mahattamam || 34|| anadishrikrishnanarayanena paramatmana | maya
    sandishyate tvetadgurutirtham pramanavat || 35|| satyatirtham sadhutirtham tirthashcaham pareshvarah
    | trini tirthani caitani gurau tirthe vishanti hi || 36|| ityetacchivarajnishri hridayam kathitam
    tava | pathanacchravanadasya catuhpumarthabhag bhavet || 37|| iti shrilakshminarayaniyasamhitayam
    tritiye dvaparasantanelalitamahalakshmyah pancatrimshaduttarashatanamani gurutirthamahatmyam cetyadinirupananamaika'
  devanagari: । इतिलक्षं जपेत् सिद्धिर्जायते ब्रह्मसादृशी ॥ १९॥ गुरुं ध्यायेत् स्नापयेच्च पूजयेद्बहुवस्तुभिः
    । भोजयेत्सम्प्रसेवेत तोषयेत्सर्वदानकैः ॥ २०॥ गुरुर्ब्रह्मा गुरुर्विष्णुर्गुरुः श्रीशङ्करः स्वयम् ।
    गुरुर्नारायणः कृष्णो गुरुर्ब्रह्मपरं प्रभुः ॥ २१॥ गुरुः पिता पतिः पुत्रो बन्धुर्माता च रक्षकः । मोक्षदस्तारकश्चापि
    महाऽऽनन्दप्रदो गुरुः ॥ २२॥ अनादिश्रीकृष्णनारायणः साक्षाद्गुरुर्हरिः । इत्युक्त्वा प्रणमेतापि नीराजयेद्गुरुं
    ततः ॥ २३॥ पुष्पाञ्जलिं दिशेच्चापि दण्डवद्वै समाचरेत् । दानं दद्याच्च गुरवे स्वेष्टतमस्य वस्तुनः ॥
    २४॥ चेतनो वै भगवान् स गुरुरेव परेश्वरः । त्रायते चापदां व्रातान्नयत्येवाऽक्षरं पदम् ॥ २५॥ नित्यं वै
    प्रथमं प्रातर्गुरोर्दर्शनमुत्तमम् । गुरोः पादाङ्गुष्ठजलं पिबेत् पावनमुत्तमम् ॥ २६॥ अपि हत्यादिपापानां
    नाशकं चरणामृतम् । अपि मायादिबन्धानां कर्तनं चरणौ गुरोः ॥ २७॥ यामपाशविमोक्षाय शक्तं वै स्मरणं गुरोः
    । अनाथानां सदा नाथो नारायणो गुरुः परः ॥ २८॥ गं गाढं च तमो गुप्तं रुणद्धीतिगुरुर्मतः । गुरोर्मूर्तिं
    शुभां कृत्वा गृहे कण्ठे प्ररक्षयेत् ॥ २९॥ गुर्वद्वैतमुपासीताऽश्नुतेऽमृतमनुत्तमम् । इत्येतत् कथितं
    लक्ष्मि सारात् सारतरं परम् ॥ ३०॥ मातृतीर्थात् पितृतीर्थाद्गुरुतीर्थं महत्तमम् । श्वश्रूतीर्थात्पतितीर्थाद्गुरुतीर्थं
    महत्तमम् ॥ ३१॥ सतीतीर्थात् प्रियातीर्थाद्गुरुतीर्थं महत्तमम् । देवतीर्थाज्जडतीर्थाद्गुरुतीर्थं महत्तमम्
    ॥ ३२॥ अर्चातीर्थान्मखतीर्थाद्गुरुतीर्थं महत्तमम् । व्रततीर्थात्तपस्तीर्थाद्गुरुतीर्थं महत्तमम् ॥ ३३॥
    ज्ञानतीर्थाद्योगतीर्थाद्गुरुतीर्थं महत्तमम् । परोपकारादितीर्थेभ्यो गुरुतीर्थं महत्तमम् ॥ ३४॥ अनादिश्रीकृष्णनारायणेन
    परमात्मना । मया सन्दिश्यते त्वेतद्गुरुतीर्थं प्रमाणवत् ॥ ३५॥ सत्यतीर्थं साधुतीर्थं तीर्थश्चाहं परेश्वरः
    । त्रीणि तीर्थानि चैतानि गुरौ तीर्थे विशन्ति हि ॥ ३६॥ इत्येतच्छिवराज्ञीश्रि हृदयं कथितं तव । पठनाच्छ्रवणादस्य
    चतुःपुमर्थभाग् भवेत् ॥ ३७॥ इति श्रीलक्ष्मीनारायणीयसंहितायां तृतीये द्वापरसन्तानेललितामहालक्ष्म्याः
    पञ्चत्रिंशदुत्तरशतनामानि गुरुतीर्थमाहात्म्यं चेत्यादिनिरूपणनामैक
