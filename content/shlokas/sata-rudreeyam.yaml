id: sata-rudreeyam
category: stotram
name:
  english: Sata Rudreeyam
content:
  english: vyasa uvaca praja patinam prathamam tejasam purusham prabhum | bhuvanam bhurbhuvam devam sarvalokeshvaram
    prabhum|| ishanam varadam partha drishnavanasi shankaram | tam gacca sharanam devam varadam bhavaneshvaram
    || mahadevam mahatmana mishanam jatilam shivam | tyraksham mahabhujam rudram shikhinam ciravasanam
    || mahadevam haram sthanum varadam bhavaneshvaram | jagatrpadhanamadhikam jagatpritamadhishvaram ||
    jagadyonim jagaddvipam jayanam jagato gatim | vishvatmanam vishvasrijam vishvamurtim yashasvinam ||
    vishveshvaram vishvavaram karmanamishvaram prabhum | shambhum svayambhum bhutesham bhutabhavyabhavodbhavam
    || yogam yogeshvaram sharvam sarvalokeshvareshvaram | sarvashreshtam jagacchreshtam varishtam parameshthinam
    || lokatraya vidhataramekam lokatrayashrayam | sudurjayam jagannatham janmamrityu jaratigam || jnanatmanam
    jnanagamyam jnanashreshtham sudarvidam | dataram caiva bhaktanam prasadavihitan varan || tasya parishada
    divyarupai rnanavidhai rvibhoh | vamana jatila munda hrasvagriva mahodarah || mahakaya mahotsaha mahakarnastada
    pare | ananairvikritaih padaih parthaveshaishca vaikritaih || idrishaissa mahadevah pujyamano maheshvarah
    | sashivastata tejasvi prasadadyati te'gratah || tasmin ghore sada partha sangrame romaharshine |
    draunikarna kripairguptam maheshvasaih praharibhih || kastam senam tada pardha manasapi pradharshayet
    | rite devanmaheshvasadbahurupanmaheshvarat || pthatumutsahate kashcinnatasminnagratah sthite | na
    hi bhutam samam tena trishu lokeshu vidyate || gandhe napi hi sangrame tasya kriddasya shatravah |
    visanjna hata bhuyishta vepantica patanti ca || tasmai namastu kurvanto deva stishthanti vaidivi |
    ye canye manava loke yeca svargajito narah || ye bhakta varadam devam shivam rudramumapatim | iha
    loke sukham prapyate yanti paramam gatim || namaskurushva kaunteya tasmai shantaya vai sada | rudraya
    shitikanthaya kanishthaya suvarcase || kapardine karalaya haryakshavaradayaca | yamyayaraktakeshaya
    sadvritte shankarayaca || kamyaya harinetraya sthanuve purushayaca | harikeshaya mundaya kanishthaya
    suvarcase || bhaskaraya sutirthaya devadevaya ramhase | bahurupaya priyaya priyavasase || ushnishine
    suvaktraya sahasrakshaya midushe | girishiya sushantaya pataye ciravasase || hiranyabahave rajannugraya
    patayedisham | parjanyapatayecaiva bhutanam pataye namah || vrikshanam patayecaiva gavam ca pataye
    tatha | vrikshairavrittakayaya senanye madhyamayaca || sruvahastaya devaya dhanvine bhargavaya ca
    | bahurupaya vishvasya pataye munjavasase || sahasrashirase caiva sahasra nayanayaca | sahasrabahave
    caiva sahasra caranaya ca || sharanam gaccha kaunteya varadam bhuvaneshvaram | umapatim virupaksham
    daksham yajnanibarhanam || prajanam patimavyagram bhutanam patimavyayam | kapardinam vrishavartam
    vrishanabham vrishadhvajam || vrishadarpam vrishapatim vrishashringam vrisharshabham | vrishakam vrishabhodaram
    vrishabham vrishabhekshanam || vrishayudham vrishasharam vrishabhutam maheshvaram | mahodaram mahakayam
    dvipacarmanivasinam || lokesham varadam mundam brahmanyam brahmanapriyam | trishulapanim varadam khadgacarmadharam
    shubham || pinakinam khadgadharam lokanam patimishvaram | prapadye sharanam devam sharanyam ciravasanam
    || namastasmai sureshaya yasya vaishravanassakha | suvasase namo nityam suvrataya sudhanvine || dhanurdharaya
    devaya priyadhanvaya dhanvine | dhanvantaraya dhanushe dhanvacaryaya te namah || ugrayudhaya devaya
    namassuravaraya ca | namo'stu bahurupaya namaste bahudanvine || namo'stu sthanave nityannamastasmai
    sudhanvine | namo'stu tripuraghnaya bhavaghnaya ca vai namah || vanaspatinam pataye naranam pataye
    namah | matrinam pataye caiva gananam pataye namah || gavam ca pataye nityam yajnanam pataye namah
    | apam ca pataye nityam devanam pataye namah || pushno dantavinashaya tryakshaya varadayaca | haraya
    nilakanthaya svarnakeshaya vai namah || om shantih om shantih om shantih
  devanagari: व्यास उवाच प्रजा पतीनां प्रथमं तेजसां पुरुषं प्रभुम् । भुवनं भूर्भुवं देवं सर्वलोकेश्वरं
    प्रभुम्॥ ईशानां वरदं पार्थ दृष्णवानसि शङ्करम् । तं गच्च शरणं देवं वरदं भवनेश्वरम् ॥ महादेवं महात्मान
    मीशानं जटिलं शिवम् । त्य्रक्षं महाभुजं रुद्रं शिखिनं चीरवासनम् ॥ महादेवं हरं स्थाणुं वरदं भवनेश्वरम्
    । जगत्र्पाधानमधिकं जगत्प्रीतमधीश्वरम् ॥ जगद्योनिं जगद्द्वीपं जयनं जगतो गतिम् । विश्वात्मानं विश्वसृजं
    विश्वमूर्तिं यशस्विनम् ॥ विश्वेश्वरं विश्ववरं कर्माणामीश्वरं प्रभुम् । शम्भुं स्वयम्भुं भूतेशं भूतभव्यभवोद्भवम्
    ॥ योगं योगेश्वरं शर्वं सर्वलोकेश्वरेश्वरम् । सर्वश्रेष्टं जगच्छ्रेष्टं वरिष्टं परमेष्ठिनम् ॥ लोकत्रय
    विधातारमेकं लोकत्रयाश्रयम् । सुदुर्जयं जगन्नाथं जन्ममृत्यु जरातिगम् ॥ ज्ञानात्मानां ज्ञानगम्यं ज्ञानश्रेष्ठं
    सुदर्विदम् । दातारं चैव भक्तानां प्रसादविहितान् वरान् ॥ तस्य पारिषदा दिव्यारूपै र्नानाविधै र्विभोः
    । वामना जटिला मुण्डा ह्रस्वग्रीव महोदराः ॥ महाकाया महोत्साहा महाकर्णास्तदा परे । आननैर्विकृतैः पादैः
    पार्थवेषैश्च वैकृतैः ॥ ईदृशैस्स महादेवः पूज्यमानो महेश्वरः । सशिवस्तात तेजस्वी प्रसादाद्याति तेऽग्रतः
    ॥ तस्मिन् घोरे सदा पार्थ सङ्ग्रामे रोमहर्षिणे । द्रौणिकर्ण कृपैर्गुप्तां महेष्वासैः प्रहारिभिः ॥ कस्तां
    सेनां तदा पार्ध मनसापि प्रधर्षयेत् । ऋते देवान्महेष्वासाद्बहुरूपान्महेश्वरात् ॥ प्थातुमुत्सहते कश्चिन्नतस्मिन्नग्रतः
    स्थिते । न हि भूतं समं तेन त्रिषु लोकेषु विद्यते ॥ गन्धे नापि हि सङ्ग्रामे तस्य कृद्दस्य शत्रवः ।
    विसञ्ज्ञा हत भूयिष्टा वेपन्तिच पतन्ति च ॥ तस्मै नमस्तु कुर्वन्तो देवा स्तिष्ठन्ति वैदिवि । ये चान्ये
    मानवा लोके येच स्वर्गजितो नराः ॥ ये भक्ता वरदं देवं शिवं रुद्रमुमापतिम् । इह लोके सुखं प्राप्यते यान्ति
    परमां गतिम् ॥ नमस्कुरुष्व कौन्तेय तस्मै शान्ताय वै सदा । रुद्राय शितिकण्ठाय कनिष्ठाय सुवर्चसे ॥ कपर्दिने
    करलाय हर्यक्षवरदायच । याम्यायरक्तकेशाय सद्वृत्ते शङ्करायच ॥ काम्याय हरिनेत्राय स्थाणुवे पुरुषायच ।
    हरिकेशाय मुण्डाय कनिष्ठाय सुवर्चसे ॥ भास्कराय सुतीर्थाय देवदेवाय रंहसे । बहुरूपाय प्रियाय प्रियवाससे
    ॥ उष्णीषिणे सुवक्त्राय सहस्राक्षाय मीडुषे । गिरीशीय सुशान्ताय पतये चीरवाससे ॥ हिरण्यबाहवे राजन्नुग्राय
    पतयेदिशाम् । पर्जन्यपतयेचैव भूतानां पतये नमः ॥ वृक्षाणां पतयेचैव गवां च पतये तथा । वृक्षैरावृत्तकायाय
    सेनान्ये मध्यमायच ॥ स्रुवहस्ताय देवाय धन्विने भार्गवाय च । बहुरूपाय विश्वस्य पतये मुञ्जवाससे ॥ सहस्रशिरसे
    चैव सहस्र नयनायच । सहस्रबाहवे चैव सहस्र चरणाय च ॥ शरणं गच्छ कौन्तेय वरदं भुवनेश्वरम् । उमापतिं विरूपाक्षं
    दक्षं यज्ञनिबर्हणम् ॥ प्रजानां पतिमव्यग्रं भूतानां पतिमव्ययम् । कपर्दिनं वृषावर्तं वृषनाभं वृषध्वजम्
    ॥ वृषदर्पं वृषपतिं वृषशृङ्गं वृषर्षभम् । वृषाकं वृषभोदारं वृषभं वृषभेक्षणम् ॥ वृषायुधं वृषशरं वृषभूतं
    महेश्वरम् । महोदरं महाकायं द्वीपचर्मनिवासिनम् ॥ लोकेशं वरदं मुण्डं ब्राह्मण्यं ब्राह्मणप्रियम् । त्रिशूलपाणिं
    वरदं खड्गचर्मधरं शुभम् ॥ पिनाकिनं खड्गधरं लोकानां पतिमीश्वरम् । प्रपद्ये शरणं देवं शरण्यं चीरवासनम्
    ॥ नमस्तस्मै सुरेशाय यस्य वैश्रवणस्सखा । सुवाससे नमो नित्यं सुव्रताय सुधन्विने ॥ धनुर्धराय देवाय प्रियधन्वाय
    धन्विने । धन्वन्तराय धनुषे धन्वाचार्याय ते नमः ॥ उग्रायुधाय देवाय नमस्सुरवराय च । नमोऽस्तु बहुरूपाय
    नमस्ते बहुदन्विने ॥ नमोऽस्तु स्थाणवे नित्यन्नमस्तस्मै सुधन्विने । नमोऽस्तु त्रिपुरघ्नाय भवघ्नाय च
    वै नमः ॥ वनस्पतीनां पतये नराणां पतये नमः । मातॄणां पतये चैव गणानां पतये नमः ॥ गवां च पतये नित्यं यज्ञानां
    पतये नमः । अपां च पतये नित्यं देवानां पतये नमः ॥ पूष्णो दन्तविनाशाय त्र्यक्षाय वरदायच । हराय नीलकण्ठाय
    स्वर्णकेशाय वै नमः ॥ ॐ शान्तिः ॐ शान्तिः ॐ शान्तिः
