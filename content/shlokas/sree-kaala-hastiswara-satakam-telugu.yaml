    लेदु नम्ममनि तारावेल नारेवुनन् मुनु गम्बोवुचु बास सेयुट सुमी मुम्माटिकिं जूडगा जॆनटु ल्गानरु दीनिभावमिदिवो
    श्री कालहस्तीश्वरा ॥ भवदुःखम्बुलु राजकीटमुल नेब्रार्धिञ्चिनं बायुने भवदङ्घ्रिस्तुतिचेत गाक विलसद्बालक्षुधाक्लेशदु
    ष्टविधुल्मानुनॆ चूड मे कमॆडचण्टन्दल्लि कारुण्यद्ब ष्थिविशेषम्बुन निच्चि चण्ट बलॆ नो श्री कालहस्तीश्वरा
    ॥ पवि पुष्पम्बगु नग्नि मञ्चगु नकूपारम्बु भूमीस्थलं बवु शत्रुं डतिमित्रु डौ विषमु दिव्याहारमौ नॆन्न
    गा नवनीमण्डलिलोपलन् शिव शिवे त्याभाषणोल्लासिकिन् शिव नी नाममु सर्ववश्यकरमौ श्री कालहस्तीश्वरा गन्धमूलफलमुल्
    लेवो गुहल् तोयमुल् लेवो येऱुल बल्लवास्तरणमुल् लेवो सदा यात्मलो लेवो नीवु विरक्तुल न्मनुप जालिं बॊन्दि
    भूपालुरन् सेवल् सेय बोदु रेलॊकॊ जनुल् श्री कालहस्तीश्वरा बुट्टिन पुट्टु लॆन्नि गलवो मोहम्बुचे नन्दु
    जे सिन कर्मम्बुल प्रोवु लॆन्नि गलवो चिन्तिञ्चिनन् गान नी जननम्बे यनि युन्न वाड निदिये चालिम्पवे निन्नु
