id: narayaniyam-dashaka-8
category: stotram
name:
  english: Narayaniyam Dashaka 8
content:
  english: evam tavat prakritaprakshayante brahme kalpe hyadime labdhajanma | brahma bhuyastvatta evapya
    vedan srishtim cakre purvakalpopamanam || || so'yam caturyugasahasramitanyahani tavanmitashca rajanirbahusho
    ninaya | nidratyasau tvayi niliya samam svasrishtai rnaimittikapralayamahurato'sya ratrim || || asmadrisham
    punaraharmukhakrityatulyam srishtim karotyanudinam sa bhavatprasadat | pragbrahmakalpajanusham ca
    parayusham tu suptaprabodhanasamasti tada'pi srishtih || || pancashadabdamadhuna svavayordharupa mekam
    parardhamativritya hi vartate'sau | tatrantyaratrijanitan kathayami bhuman pashcaddinavatarane ca
    bhavadvilasan || || dinavasane'tha sarojayonih sushuptikamastvayi sannililye | jaganti ca tvajjatharam
    samiyu stadedamekarnavamasa vishvam || || tavaiva veshe phaniraji sheshe jalaikasheshe bhuvane sma
    sheshe | anandasandranubhavasvarupah svayoganidraparimudritatma || || kalakhyashaktim pralayavasane
    prabodhayetyadishata kiladau | tvaya prasuptam parisuptashakti vrajena tatrakhilajivadhamna || ||
    caturyuganam ca sahasramevam tvayi prasupte punaradvitiye | kalakhyashaktih prathamaprabuddha prabodhayattvam
    kila vishvanatha || || vibudhya ca tvam jalagarbhashayin vilokya lokanakhilan pralinan | teshveva
    sukshmatmataya nijantah sthiteshu vishveshu dadatha drishtim || || tatastvadiyadayi nabhirandhra dudancitam
    kincana divyapadmam | nilinanishsheshapadarthamala sanksheparupam mukulayamanam || || tadetadambhoruhakudmalam
    te kalevarat toyapathe prarudham | bahirniritam paritah sphuradbhih svadhamabhirdhvantamalam nyakrintat
    || || samphullapatre nitaram vicitre tasmin bhavadviryadhrite saroje | sa padmajanma vidhiravirasit
    svayamprabuddhakhilavedarashih || || asmin paratman nanu padmakalpe tvamitthamutthapitapadmayonih
    | anantabhuma mama rogarashim nirundhi vatalayavasa vishno ||
  devanagari: एवं तावत् प्राकृतप्रक्षयान्ते ब्राह्मे कल्पे ह्यादिमे लब्धजन्मा । ब्रह्मा भूयस्त्वत्त एवाप्य
    वेदान् सृष्टिं चक्रे पूर्वकल्पोपमानाम् ॥ ॥ सोऽयं चतुर्युगसहस्रमितान्यहानि तावन्मिताश्च रजनीर्बहुशो
    निनाय । निद्रात्यसौ त्वयि निलीय समं स्वसृष्टै र्नैमित्तिकप्रलयमाहुरतोऽस्य रात्रिम् ॥ ॥ अस्मादृशां
    पुनरहर्मुखकृत्यतुल्यां सृष्टिं करोत्यनुदिनं स भवत्प्रसादात् । प्राग्ब्राह्मकल्पजनुषां च परायुषां तु
    सुप्तप्रबोधनसमास्ति तदाऽपि सृष्टिः ॥ ॥ पञ्चाशदब्दमधुना स्ववयोर्धरूप मेकं परार्धमतिवृत्य हि वर्ततेऽसौ
    । तत्रान्त्यरात्रिजनितान् कथयामि भूमन् पश्चाद्दिनावतरणे च भवद्विलासान् ॥ ॥ दिनावसानेऽथ सरोजयोनिः सुषुप्तिकामस्त्वयि
    सन्निलिल्ये । जगन्ति च त्वज्जठरं समीयु स्तदेदमेकार्णवमास विश्वम् ॥ ॥ तवैव वेषे फणिराजि शेषे जलैकशेषे
    भुवने स्म शेषे । आनन्दसान्द्रानुभवस्वरूपः स्वयोगनिद्रापरिमुद्रितात्मा ॥ ॥ कालाख्यशक्तिं प्रलयावसाने
    प्रबोधयेत्यादिशता किलादौ । त्वया प्रसुप्तं परिसुप्तशक्ति व्रजेन तत्राखिलजीवधाम्ना ॥ ॥ चतुर्युगाणां
    च सहस्रमेवं त्वयि प्रसुप्ते पुनरद्वितीये । कालाख्यशक्तिः प्रथमप्रबुद्धा प्राबोधयत्त्वां किल विश्वनाथ
    ॥ ॥ विबुध्य च त्वं जलगर्भशायिन् विलोक्य लोकानखिलान् प्रलीनान् । तेष्वेव सूक्ष्मात्मतया निजान्तः स्थितेषु
    विश्वेषु ददाथ दृष्टिम् ॥ ॥ ततस्त्वदीयादयि नाभिरन्ध्रा दुदञ्चितं किञ्चन दिव्यपद्मम् । निलीननिश्शेषपदार्थमाला
    सङ्क्षेपरूपं मुकुलायमानम् ॥ ॥ तदेतदम्भोरुहकुड्मलं ते कलेवरात् तोयपथे प्ररूढम् । बहिर्निरीतं परितः
    स्फुरद्भिः स्वधामभिर्ध्वान्तमलं न्यकृन्तत् ॥ ॥ सम्फुल्लपत्रे नितरां विचित्रे तस्मिन् भवद्वीर्यधृते
    सरोजे । स पद्मजन्मा विधिराविरासीत् स्वयम्प्रबुद्धाखिलवेदराशिः ॥ ॥ अस्मिन् परात्मन् ननु पाद्मकल्पे
    त्वमित्थमुत्थापितपद्मयोनिः । अनन्तभूमा मम रोगराशिं निरुन्धि वातालयवास विष्णो ॥
