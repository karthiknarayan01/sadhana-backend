    अ॒भि जि॑घ्रति॒ तस्मा ङ्गौर॒भि जि॑घ्रत्या॒त्मा वा ए॒ष य॒ज्ञस्य॒ यदा ऽभि गृ॑ह्णात्या॒त्मन्ने॒व य॒ज्ञग्ं
    स न्त॑नोत्यु॒परि॑ष्टा॒दा न॑यति॒ रेत॑ ए॒व त द्द॑धात्य॒धस्ता॒दुप॑ गृह्णाति॒ प्र ज॑नयत्ये॒व तद्ब्र॑ह्मवा॒दिनो॑
    वदन्ति॒ कस्मा द्गा॑य॒त्री कनि॑ष्ठा॒ छन्द॑साग्ं स॒ती सर्वा॑णि॒ सव॑नानि वह॒तीत्ये॒ष वै गा॑यत्रि॒यै व॒थ्सो
    यदा ग्रय॒णस्तमे॒व तद॑भिनि॒वर्त॒ग्ं॒ सर्वा॑णि॒ सव॑नानि वहति॒ तस्मा ङ्गौर॒भि नि व॑र्तते ॥ य॒ज्ञेन॒ ता
    उ॑प॒यड्भि॑ र्दे॒वा वै य॒ज्ञमाग्नी प्रा॒णो वा उ॑पा॒ग्॒श्व॑ग्रा दे॒वा वा उ॑पा॒ग्ं॒शौ ॥ हरिः॑ ओम् ॥ ॥
    कृष्ण यजुर्वेदीय तैत्तिरीय संहितायां षष्ठकाण्डे चतुर्थः प्रश्न
