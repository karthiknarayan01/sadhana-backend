id: shakradaya-stuti
category: stotram
name:
  english: shakradaya stuti
  devanagari: शक्रादय स्तुति
content:
  english: 4|| ya shrih svayam sukritinam bhavaneshvalakshmih papatmanam kritadhiyam hridayeshu buddhih
    | shraddham satam kulajanaprabhavasya lajja tam tvam natah sma paripalaya devi vishvam||84
  devanagari: ४॥ या श्रीः स्वयं सुकृतिनां भवनेष्वलक्ष्मीः पापात्मनां कृतधियां हृदयेषु बुद्धिः । श्रद्धां
    सतां कुलजनप्रभवस्य लज्जा तां त्वां नताः स्म परिपालय देवि विश्वम्॥८४
meaning: {}
