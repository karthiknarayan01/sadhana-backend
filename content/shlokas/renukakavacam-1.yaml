id: renukakavacam-1
category: kavacha
name:
  english: renukakavacam 1
  devanagari: रेणुकाकवचम् १
content:
  english: '| dhyatva devim mahamayam jaganmataramambikam || purnakumbhasamayuktam muktaharavirajitam
    | svarnalankarasamyuktam svarnasimhasanasthitam || mastake gurupadabjam pranamya kavacam pathet |
    indro mam rakshatu pracyam vahnau vahnih sureshvari || yamyam yamah sada patu nairrityam nirritistatha
    | pashcime varunah patu vayavye vayudevata || dhanashcottare patu ishanyamishvaro vibhuh | urdhvam
    brahma sada patu ananto''dhah sada''vatu || pancantako mahendrashca vamakarnendubhushitah | pranavam
    putitam kritva tatkritva pranavam punah || samuccarya tato devikavacam prapathe tatha | brahmani me
    shirah patu netre patu maheshvari || vaishnavi nasikayugmam karnayoh karnavasini | kantham matu mahalakshmirhridayam
    candabhairavi || bahu me bagala patu karau mahishamardini | karangulishu kesheshu nabhim me carcika''vatu
    || guhyam guhyeshvari patu uru patu mahamatih | januni janani rama gulphayornarasimhika || vasundhara
    sada padau payatpadangulishu ca | romakupe medamajja rakta'
  devanagari: । ध्यात्वा देवीं महामायां जगन्मातरमम्बिकाम् ॥ पूर्णकुम्भसमायुक्तां मुक्ताहारविराजिताम् ।
    स्वर्णालङ्कारसंयुक्तां स्वर्णसिंहासनस्थिताम् ॥ मस्तके गुरुपादाब्जं प्रणम्य कवचं पठेत् । इन्द्रो मां
    रक्षतु प्राच्यां वह्नौ वह्निः सुरेश्वरि ॥ याम्यां यमः सदा पातु नैरृत्यां निरृतिस्तथा । पश्चिमे वरुणः
    पातु वायव्ये वायुदेवता ॥ धनश्चोत्तरे पातु ईशान्यामीश्वरो विभुः । ऊर्ध्वं ब्रह्मा सदा पातु अनन्तोऽधः
    सदाऽवतु ॥ पञ्चान्तको महेन्द्रश्च वामकर्णेन्दुभूषितः । प्रणवं पुटितं कृत्वा तत्कृत्वा प्रणवं पुनः ॥
    समुच्चार्य ततो देवीकवचं प्रपठे तथा । ब्रह्माणी मे शिरः पातु नेत्रे पातु महेश्वरी ॥ वैष्णवी नासिकायुग्मं
    कर्णयोः कर्णवासिनी । कण्ठं मातु महालक्ष्मीर्हृदयं चण्डभैरवी ॥ बाहू मे बगला पातु करौ महिषमर्दिनी ।
    कराङ्गुलिषु केशेषु नाभिं मे चर्चिकाऽवतु ॥ गुह्यं गुह्येश्वरी पातु ऊरू पातु महामतिः । जानुनी जननी रामा
    गुल्फयोर्नारसिंहिका ॥ वसुन्धरा सदा पादौ पायात्पादाङ्गुलीषु च । रोमकूपे मेदमज्जा रक्त
meaning: {}
