id: narayanakavacam
category: stotram
name:
  english: narayanakavacam
  devanagari: नारायणकवचम्
content:
  english: njasa yena damshito'surayuthapan || 35|| etaddharayamanastu yam yam pashyati cakshusha | pada
    va samsprishetsadyah sadhvasatsa vimucyate || 36|| na kutashcidbhayam tasya vidyam dharayato bhavet
    | rajadasyugrahadibhyo vyaghradibhyashca karhicit || 37|| imam vidyam pura kashcitkaushiko dharayan
    dvijah | yogadharanaya svangam jahau sa marudhanvani || 38|| tasyopari vimanena gandharvapatirekada
    | yayau citrarathah stribhirvrito yatra dvijakshayah || 39 || gaganannyapatatsadyah savimano hyavakshirah
    | sa valakhilyavacanadasthinyadaya vismitah | prasya pracisarasvatyam snatva dhama svamanvagat ||
    40|| shrishuka uvaca | ya idam shrinuyatkale yo dharayati cadritah | tam namasyanti bhutani mucyate
    sarvato bhayat || 41|| etam vidyamadhigato vishvarupacchatakratuh | trailokyalakshmim bubhuje vinirjitya
    mridhe'suran || 42|| || iti shrimadbhagavatamahapurane paramahamsyam samhitayam shashthaskandhe narayanavarmakathanam
    namashtamo'dhyayah ||
  devanagari: ण्जसा येन दंशितोऽसुरयूथपान् ॥ ३५॥ एतद्धारयमाणस्तु यं यं पश्यति चक्षुषा । पदा वा संस्पृशेत्सद्यः
    साध्वसात्स विमुच्यते ॥ ३६॥ न कुतश्चिद्भयं तस्य विद्यां धारयतो भवेत् । राजदस्युग्रहादिभ्यो व्याघ्रादिभ्यश्च
    कर्हिचित् ॥ ३७॥ इमां विद्यां पुरा कश्चित्कौशिको धारयन् द्विजः । योगधारणया स्वाण्गं जहौ स मरुधन्वनि
    ॥ ३८॥ तस्योपरि विमानेन गन्धर्वपतिरेकदा । ययौ चित्ररथः स्त्रीभिर्वृतो यत्र द्विजक्षयः ॥ ३९ ॥ गगनान्न्यपतत्सद्यः
    सविमानो ह्यवाक्षिराः । स वालखिल्यवचनादस्थीन्यादाय विस्मितः । प्रास्य प्राचीसरस्वत्यां स्नात्वा धाम
    स्वमन्वगात् ॥ ४०॥ श्रीशुक उवाच । य इदं शृणुयात्काले यो धारयति चादृतः । तं नमस्यन्ति भूतानि मुच्यते
    सर्वतो भयात् ॥ ४१॥ एतां विद्यामधिगतो विश्वरूपाच्छतक्रतुः । त्रैलोक्यलक्ष्मीं बुभुजे विनिर्जित्य मृधेऽसुरान्
    ॥ ४२॥ ॥ इति श्रीमद्भागवतमहापुराणे पारमहंस्यां संहितायां षष्ठस्कन्धे नारायणवर्मकथनं नामाष्टमोऽध्यायः
    ॥
