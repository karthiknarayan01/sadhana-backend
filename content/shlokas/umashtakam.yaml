id: umashtakam
category: stotram
name:
  english: umashtakam
  devanagari: उमाष्टकम्
content:
  english: shatadyutim jananim bhuktimuktidama | sumukhim varadam devi simhastham paripujayet || 3|| bhaktaya
    shivaramaya snusha brahasya sannidhau | svapne svam darshayamasa rupam vairagyadam shubham || 4||
    kakarupa tato devi bhaktanugrahakamyaya onkararupasambhuta pancadha'bhayadayini || 5|| pradurbhuta
    nadirupa bhaktanam phaladayini | onkararupasadrishi pancadha divya
  devanagari: शतद्युतिं जननीं भुक्तिमुक्तिदाम । सुमुखीं वरदां देवी सिंहस्थां परिपूजयेत् ॥ ३॥ भक्ताय शिवरामाय
    स्नुषा ब्राहस्य सन्निधौ । स्वप्ने स्वं दर्शयामास रूपं वैराग्यदं शुभम् ॥ ४॥ काकरूपा ततो देवी भक्तानुग्रहकाम्यया
    ओङ्काररूपसंभूता पञ्चधाऽभयदायिनी ॥ ५॥ प्रादुर्भूता नदीरूपा भक्तानां फलदायिनी । ओङ्काररूपसदृशी पञ्चधा
    दिव्य
meaning: {}
