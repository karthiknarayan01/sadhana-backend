id: mooka-pancha-sathi-1-arya-satakam
category: stotram
name:
  english: Mooka Pancha Sathi 1 - Arya Satakam
content:
  english: karanaparacidrupa kancipurasimni kamapithagata | kacana viharati karuna kashmirastabakakomalangalata
    || || kancana kancinilayam karadhritakodandabanasrinipasham | kathinastanabharanamram kaivalyanandakandamavalambe
    || || cintitaphalapariposhanacintamanireva kancinilaya me | ciratarasucaritasulabha cittam shishirayatu
    citsukhadhara || || kutilakacam kathinakucam kundasmitakanti kunkumacchayam | kurute vihritim kancyam
    kulaparvatasarvabhaumasarvasvam || || pancasharashastrabodhanaparamacaryena drishtipatena | kancisimni
    kumari kacana mohayati kamajetaram || || paraya kancipuraya parvataparyayapinakucabharaya | paratantra
    vayamanaya pankajasabrahmacarilocanaya || || aishvaryamindumauleraikatmyaprakriti kancimadhyagatam
    | aindavakishorashekharamaidamparyam cakasti nigamanam || || shritakampasimanam shithilitaparamashivadhairyamahimanam
    | kalaye patalimanam kancana kancukitabhuvanabhumanam || || adritakancinilayamadyamarudhayauvanatopam
    | agamavatamsakalikamanandadvaitakandalim vande || || tungabhiramakucabharashringaritamashrayami kancigatam
    | gangadharaparatantram shringaradvaitatantrasiddhantam || || kanciratnavibhusham kamapi kandarpasutikapangim
    | paramam kalamupase parashivavamankapithikasinam || || kampaticaranam karunakorakitadrishtipatanam
    | kelivanam mano me keshancidbhavatu cidvilasanam || || amratarumulavasateradimapurushasya nayanapiyusham
    | arabdhayauvanotsavamamnayarahasyamantaravalambe || || adhikanci paramayogibhiradimaparapithasimni
    drishyena | anubaddham mama manasamarunimasarvasvasampradayena || || ankitashankaradehamankuritorojakankanashleshaih
    | adhikanci nityatarunimadraksham kancidadbhutam balam || || madhuradhanusha mahidharajanusha nandami
    surabhibanajusha | cidvapusha kancipure kelijusha bandhujivakantimusha || || madhurasmitena ramate
    mamsalakucabharamandagamanena | madhyekanci mano me manasijasamrajyagarvabijena || || dharanimayim
    taranimayim pavanamayim gaganadahanahotrimayim | ambumayimindumayimambamanukampamadimamikshe || ||
    linasthiti munihridaye dhyanastimitam tapasyadupakampam | pinastanabharamide minadhvajatantraparamatatparyam
    || || shveta mantharahasite shata madhye ca vadbhano'tita | shita locanapate sphita kucasimni shashvati
    mata || || puratah kada na karavai puravairivimardapulakitangalatam | punatim kancidesham pushpayudhaviryasarasaparipatim
    || || punya ka'pi purandhri punkhitakandarpasampada vapusha | pulinacari kampayah puramathanam pulakaniculitam
    kurute || || tanimadvaitavalagnam tarunarunasampradayatanulekham | tatasimani kampayastarunimasarvasvamadyamadraksham
    || || paushtikakarmavipakam paushpasharam savidhasimni kampayah | adrakshamattayauvanamabhyudayam
    kancidardhashashimaulaih || || samshritakancideshe sarasijadaurbhagyajagraduttamse | samvinmaye viliye
    sarasvatapurushakarasamrajye || || moditamadhukaravishikham svadimasamudayasarakodandam | adritakancikhelanamadimamarunyabhedamakalaye
    || || urarikritakancipurimupanishadaravindakuharamadhudharam | unnamrastanakalashimutsavalaharimupasmahe
    shambhoh || || enashishudirghalocanamenahparipanthi santatam bhajatam | ekamranathajivitamevampadaduramekamavalambe
    || || smayamanamukham kancibhayamanam kamapi devatabhedam | dayamanam vikshya muhurvayamanandamritambudhau
    magnah || || kutukajushi kancideshe kumudataporashipakashekharite | kurute manoviharam kulagiriparibridhakulaikamanidipe
    || || vikshemahi kancipure vipulastanakalashagarimaparavashitam | vidrumasahacaradeham vibhramasamavayasarasannaham
    || || kuruvindagotragatram kulacaram kamapi naumi kampayah | kulankashakucakumbham kusumayudhaviryasarasamrambham
    || || kudumalitakucakishoraih kurvanaih kancideshasauhardam | kunkumashonairnicitam kushalapatham
    shambhusukritasambharaih || || ankitakacena kenacidandhankaranaushadhena kamalanam | antahpurena shambhoralankriya
    ka'pi kalpyate kancyam || || urikaromi santatamushmalaphalena lalitam pumsa | upakampamucitakhelanamurvidharavamshasampadunmesham
    || || ankuritastanakorakamankalankaramekacutapateh | alokemahi komalamagamasamlapasarayatharthyam
    || || punjitakarunamudancitashinjitamanikanci kimapi kancipure | manjaritamridulahasam pinjaratanuruci
    pinakimuladhanam || || lolahridayo'sti shambhorlocanayugalena lehyamanayam | lalitaparamashivayam
    lavanyamritatarangamalayam || || madhukarasahacaracikurairmadanagamasamayadikshitakatakshaih | manditakampatirairmangalakandairmamastu
    sarupyam || || vadanaravindavakshovamankatativashamvadibhuta | purushatritaye tredha purandhrirupa
    tvameva kamakshi || || badhakarim bhavabdheradharadyambujeshu vicarantim | adharikritakanci bodhamritavicimeva
    vimrishamah || || kalayamyantah shashadharakalaya'nkitamaulimamalacidvalayam | alayamagamapithinilayam
    valayankasundarimambam || || sharvadiparamasadhakagurvanitaya kamapithajushe | sarvakritaye shonimagarvayasmai
    samarpyate hridayam || || samaya sandhyamayukhaih samaya buddhaya sadaiva shilitaya | umaya kancirataya
    na maya labhyate kim nu tadatmyam || || jantostava padapujanasantoshatarangitasya kamakshi | vandho
    yadi bhavati punah sindhorambhassu bambhramiti shila || || kundali kumari kutile candi caracarasavitri
    camunde | gunini guharini guhye gurumurte tvam namami kamakshi || || abhidakritirbhidakritiracidakritirapi
    cidakritirmatah | anahanta tvamahanta bhramayasi kamakshi shashvati vishvam || || shiva shiva pashyanti
    samam shrikamakshikatakshitah purushah | vipinam bhavanamamitram mitram loshtam ca yuvatibimboshtham
    || || kamaparipanthikamini kameshvari kamapithamadhyagate | kamadugha bhava kamale kamakale kamakoti
    kamakshi || || madhyehridayam madhyenitilam madhyeshiro'pi vastavyam | candakarashakrakarmukacandrasamabham
    namami kamakshim || || adhikanci kelilolairakhilagamayantratantramayaih | atishitam mama manasamasamasharadrohijivanopayaih
    || || nandati mama hridi kacana mandirayanti nirantaram kancim | induravimandalakuca binduviyannadaparinata
    taruni || || shampalatasavarnam sampadayitum bhavajvaracikitsam | limpami manasi kincana kampatatarohi
    siddhabhaishajyam || || anumitakucakathinyamadhivakshahpithamangajanmaripoh | anandadam bhaje tamanangabrahmatatvabodhasiram
    || || aikshishi pashankushadharahastantam vismayarhavrittantam | adhikanci nigamavacam siddhantam
    shulapanishuddhantam || || ahitavilasabhangimabrahmastambashilpakalpanaya | ashritakancimatulamadyam
    visphurtimadriye vidyam || || muko'pi jatiladurgatishoko'pi smarati yah kshanam bhavatim | eko bhavati
    sa janturlokottarakirtireva kamakshi || || pancadashavarnarupam kancana kanciviharadhaureyam | pancashariyam
    shambhorvancanavaidagdhyamulamavalambe || || parinatimatim caturdha padavim sudhiyam sametya saushumnim
    | pancashadarnakalpitamadashilpam tvam namami kamakshi || || adikshanmama gururadadikshantaksharatmikam
    vidyam | svadishthacapadandam nedishthameva kamapithagatam || || tushyami harshitasmarashasanaya kancipurakritasanaya
    | svasanaya sakalajagadbhasanaya kalitashambarasanaya || || premavati kampayam sthemavati yatimanassu
    bhumavati | samavati nityagira somavati shirasi bhati haimavati || || kautukina kampayam kausumacapena
    kilitenantah | kuladaivatena mahata kudmalamudram dhunotu nahpratibha || || yuna kenapi miladdeha
    svahasahayatilakena | sahakaramuladeshe samvidrupa kutumbini ramate || || kusumasharagarvasampatkoshagriham
    bhati kancideshagatam | sthapitamasminkathamapi gopitamantarmaya manoratnam || || dagdhashadadhvaranyam
    daradalitakusumbhasambhritarunyam | kalaye navatarunyam kampatatasimni kimapi karunyam || || adhikanci
    vardhamanamatulam karavani paranamakshnoh | anandapakabhedamarunimaparinamagarvapallavitam || || banasrinipashakarmukapanimamum
    kamapi kamapithagatam | enadharakonacudam shonimaparipakabhedamakalaye || || kim va phalati mamanyaurbimbadharacumbimandahasamukhi
    | sambadhakari tamasamamba jagarti manasi kamakshi || || mance sadashivamaye parishivamayalalitapaushpaparyanke
    | adhicakramadhyamaste kamakshi nama kimapi mama bhagyam || || rakshyo'smi kamapithilasikaya ghanakripamburashikaya
    | shrutiyuvatikuntalimanimalikaya tuhinashailabalikaya || || liye puraharajaye maye tava tarunapallavacchaye
    | carane candrabharane kancisharane natartisamharane || || murtimati muktibije murdhni stabakitacakorasamrajye
    | moditakampakule muhurmuhurmanasi mumudisha'smakam || || vedamayim nadamayim bindumayim parapadodyadindumayim
    | mantramayim tantramayim prakritimayim naumi vishvavikritimayim || || puramathanapunyakoti punjitakavilokasuktirasadhati
    | manasi mama kamakoti viharatu karunavipakaparipati || || kutilam catulam prithulam mridulam kacanayanajaghanacaraneshu
    | avalokitamavalambitamadhikampatatamameyamasmabhih || || pratyanmukhya drishtaya prasadadipankurena
    kamakshyah | pashyami nistulamaho pacelimam kamapi parashivollasam || || vidye vidhatrivishaye katyayani
    kali kamakotikale | bharati bhairavi bhadre shakini shambhavi shive stuve bhavatim || || malini maheshacalini
    kancikhelini vipakshakalini te | shulini vidrumashalini surajanapalini kapalini namo'stu || || deshika
    iti kim shanke tattadriktava nu tarunimonmeshah | kamakshi shulapaneh kamagamasamayadikshayam || ||
    vetandakumbhadambaravaitandikakucabharartamadhyaya | kunkumaruce namasyam shankaranayanamritaya racayamah
    || || adhikancitamanikancanakancimadhikanci kancidadraksham | avanatajananukampamanukampakulamasmadanukulam
    || || paricitakampatiram parvatarajanyasukritasannaham | paragurukripaya vikshe paramashivotsangamangalabharanam
    || || dagdhamadanasya shambhoh prathiyasim brahmacaryavaidagdhim | tava devi tarunimashricaturimapako
    na cakshame matah || || madajalatamalapatra vasanitapatra karadritakhanitra | viharati pulindayosha
    gunjabhusha phanindrakritavesha || || anke shukini gite kautukini parisare ca gayakini | jayasi savidhe'mba
    bhairavamandalini shravasi shankhakundalini || || pranatajanatapavarga kritabahusarga sasimhasamsarga
    | kamakshi muditabharga hataripuvarga tvameva sa durga || || shravanacaladvetanda samaroddanda dhutasurashikhanda
    | devi kalitantrashanda dhritanaramunda tvameva camunda || || urvidharendrakanye darvibharitena bhaktapurena
    | gurvimakincanarti kharvikurushe tvameva kamakshi || || taditaripuparipidanabhayaharana nipunahalamusala
    | krodapatibhishanamukhi kridasi jagati tvameva kamakshi || || smaramathanavaranalola manmathahelavilasamanishala
    | kanakarucicauryashila tvamamba bala karabjadhritamala || || vimalapati kamalakuti pustakarudrakshashastahastaputi
    | kamakshi pakshmalakshi kalitavipanci vibhasi vairinci || || kunkumarucipingamasrikpankilamundalimanditam
    matah | shrikamakshi tadiyasangamakalamandibhavatkautukah jayati tava rupadheyam japapatapustakavarabhayakarabjam
    || || kanakamanikalitabhusham kalayasakalahashilakantikalam | kamakshi shilaye tvam kapalashulabhiramakarakamalam
    || || lohitimapunjamadhye mohitabhuvane muda nirikshante | vadanam tava kuvayugalam kancisimam ca
    ke'pi kamakshi || || jaladhidvigunitahutabahadishadineshvarakalashvineyadalaih | nalinairmaheshi gacchasi
    sarvottarakarakamaladalamamalam || || satkritadeshikacaranah sabijanirbijayoganishrenya | apavargasaudhavalabhimarohantyamba
    ke'pi tava kripaya || || antarapi bahirapi tvam jantutaterantakantakridahante | cintitasantanavatam
    santatamapi tantanishi mahimanam || || kalamanjulavaganumitagalapanjaragatashukagrahautkanthyat |
    amba radanambaram te bimbaphalam shambararina nyastam || || jaya jaya jagadamba shive jaya jaya kamakshi
    jaya jayadrisute | jaya jaya maheshadayite jaya jaya cidgaganakaumudidhare || || aryashatakam bhaktya
    pathatamaryakatakshena | nissarati vadanakamaladvani piyushadhorani divya || || || iti aryashatakam
    sampurnam ||
  devanagari: कारणपरचिद्रूपा काञ्चीपुरसीम्नि कामपीठगता । काचन विहरति करुणा काश्मीरस्तबककोमलाङ्गलता ॥ ॥
    कञ्चन काञ्चीनिलयं करधृतकोदण्डबाणसृणिपाशम् । कठिनस्तनभरनम्रं कैवल्यानन्दकन्दमवलम्बे ॥ ॥ चिन्तितफलपरिपोषणचिन्तामणिरेव
    काञ्चिनिलया मे । चिरतरसुचरितसुलभा चित्तं शिशिरयतु चित्सुखाधारा ॥ ॥ कुटिलकचं कठिनकुचं कुन्दस्मितकान्ति
    कुङ्कुमच्छायम् । कुरुते विहृतिं काञ्च्यां कुलपर्वतसार्वभौमसर्वस्वम् ॥ ॥ पञ्चशरशास्त्रबोधनपरमाचार्येण
    दृष्टिपातेन । काञ्चीसीम्नि कुमारी काचन मोहयति कामजेतारम् ॥ ॥ परया काञ्चीपुरया पर्वतपर्यायपीनकुचभरया
    । परतन्त्रा वयमनया पङ्कजसब्रह्मचारिलोचनया ॥ ॥ ऐश्वर्यमिन्दुमौलेरैकत्म्यप्रकृति काञ्चिमध्यगतम् । ऐन्दवकिशोरशेखरमैदम्पर्यं
    चकास्ति निगमानाम् ॥ ॥ श्रितकम्पसीमानं शिथिलितपरमशिवधैर्यमहिमानम् । कलये पटलिमानं कञ्चन कञ्चुकितभुवनभूमानम्
    ॥ ॥ आदृतकाञ्चीनिलयमाद्यामारूढयौवनाटोपाम् । आगमवतंसकलिकामानन्दाद्वैतकन्दलीं वन्दे ॥ ॥ तुङ्गाभिरामकुचभरशृङ्गारितमाश्रयामि
    काञ्चिगतम् । गङ्गाधरपरतन्त्रं शृङ्गाराद्वैततन्त्रसिद्धान्तम् ॥ ॥ काञ्चीरत्नविभूषां कामपि कन्दर्पसूतिकापाङ्गीम्
    । परमां कलामुपासे परशिववामाङ्कपीठिकासीनाम् ॥ ॥ कम्पातीचराणां करुणाकोरकितदृष्टिपातानाम् । केलीवनं मनो
    मे केषाञ्चिद्भवतु चिद्विलासानाम् ॥ ॥ आम्रतरुमूलवसतेरादिमपुरुषस्य नयनपीयूषम् । आरब्धयौवनोत्सवमाम्नायरहस्यमन्तरवलम्बे
    ॥ ॥ अधिकाञ्चि परमयोगिभिरादिमपरपीठसीम्नि दृश्येन । अनुबद्धं मम मानसमरुणिमसर्वस्वसम्प्रदायेन ॥ ॥ अङ्कितशङ्करदेहामङ्कुरितोरोजकङ्कणाश्लेषैः
    । अधिकाञ्चि नित्यतरुणीमद्राक्षं काञ्चिदद्भुतां बालाम् ॥ ॥ मधुरधनुषा महीधरजनुषा नन्दामि सुरभिबाणजुषा
    । चिद्वपुषा काञ्चिपुरे केलिजुषा बन्धुजीवकान्तिमुषा ॥ ॥ मधुरस्मितेन रमते मांसलकुचभारमन्दगमनेन । मध्येकाञ्चि
    मनो मे मनसिजसाम्राज्यगर्वबीजेन ॥ ॥ धरणिमयीं तरणिमयीं पवनमयीं गगनदहनहोतृमयीम् । अम्बुमयीमिन्दुमयीमम्बामनुकम्पमादिमामीक्षे
    ॥ ॥ लीनस्थिति मुनिहृदये ध्यानस्तिमितं तपस्यदुपकम्पम् । पीनस्तनभरमीडे मीनध्वजतन्त्रपरमतात्पर्यम् ॥
    ॥ श्वेता मन्थरहसिते शाता मध्ये च वाड्भनोऽतीता । शीता लोचनपाते स्फीता कुचसीम्नि शाश्वती माता ॥ ॥ पुरतः
    कदा न करवै पुरवैरिविमर्दपुलकिताङ्गलताम् । पुनतीं काञ्चीदेशं पुष्पायुधवीर्यसरसपरिपाटीम् ॥ ॥ पुण्या
    काऽपि पुरन्ध्री पुङ्खितकन्दर्पसम्पदा वपुषा । पुलिनचरी कम्पायाः पुरमथनं पुलकनिचुलितं कुरुते ॥ ॥ तनिमाद्वैतवलग्नं
    तरुणारुणसम्प्रदायतनुलेखम् । तटसीमनि कम्पायास्तरुणिमसर्वस्वमाद्यमद्राक्षम् ॥ ॥ पौष्टिककर्मविपाकं पौष्पशरं
    सविधसीम्नि कम्पायाः । अद्राक्षमात्तयौवनमभ्युदयं कञ्चिदर्धशशिमौलैः ॥ ॥ संश्रितकाञ्चीदेशे सरसिजदौर्भाग्यजाग्रदुत्तंसे
    । संविन्मये विलीये सारस्वतपुरुषकारसाम्राज्ये ॥ ॥ मोदितमधुकरविशिखं स्वादिमसमुदायसारकोदण्डम् । आदृतकाञ्चीखेलनमादिममारुण्यभेदमाकलये
    ॥ ॥ उररीकृतकाञ्चिपुरीमुपनिषदरविन्दकुहरमधुधाराम् । उन्नम्रस्तनकलशीमुत्सवलहरीमुपास्महे शम्भोः ॥ ॥ एणशिशुदीर्घलोचनमेनःपरिपन्थि
    सन्ततं भजताम् । एकाम्रनाथजीवितमेवम्पददूरमेकमवलम्बे ॥ ॥ स्मयमानमुखं काञ्चीभयमानं कमपि देवताभेदम् ।
    दयमानं वीक्ष्य मुहुर्वयमानन्दामृताम्बुधौ मग्नाः ॥ ॥ कुतुकजुषि काञ्चिदेशे कुमुदतपोराशिपाकशेखरिते ।
    कुरुते मनोविहारं कुलगिरिपरिबृढकुलैकमणिदीपे ॥ ॥ वीक्षेमहि काञ्चिपुरे विपुलस्तनकलशगरिमपरवशितम् । विद्रुमसहचरदेहं
    विभ्रमसमवायसारसन्नाहम् ॥ ॥ कुरुविन्दगोत्रगात्रं कूलचरं कमपि नौमि कम्पायाः । कूलङ्कषकुचकुम्भं कुसुमायुधवीर्यसारसंरम्भम्
    ॥ ॥ कुडूमलितकुचकिशोरैः कुर्वाणैः काञ्चिदेशसौहार्दम् । कुङ्कुमशोणैर्निचितं कुशलपथं शम्भुसुकृतसम्भारैः
    ॥ ॥ अङ्कितकचेन केनचिदन्धङ्करणौषधेन कमलानाम् । अन्तःपुरेण शम्भोरलङ्क्रिया काऽपि कल्प्यते काञ्च्याम्
    ॥ ॥ ऊरीकरोमि सन्ततमूष्मलफालेन ललितं पुंसा । उपकम्पमुचितखेलनमुर्वीधरवंशसम्पदुन्मेषम् ॥ ॥ अङ्कुरितस्तनकोरकमङ्कालङ्कारमेकचूतपतेः
    । आलोकेमहि कोमलमागमसंलापसारयाथार्थ्यम् ॥ ॥ पुञ्जितकरुणमुदञ्चितशिञ्जितमणिकाञ्चि किमपि काञ्चिपुरे ।
    मञ्जरितमृदुलहासं पिञ्जरतनुरुचि पिनाकिमूलधनम् ॥ ॥ लोलहृदयोऽस्ति शम्भोर्लोचनयुगलेन लेह्यमानायाम् । ललितपरमशिवायां
    लावण्यामृततरङ्गमालायाम् ॥ ॥ मधुकरसहचरचिकुरैर्मदनागमसमयदीक्षितकटाक्षैः । मण्डितकम्पातीरैर्मङ्गलकन्दैर्ममास्तु
    सारूप्यम् ॥ ॥ वदनारविन्दवक्षोवामाङ्कतटीवशंवदीभूता । पूरुषत्रितये त्रेधा पुरन्ध्रिरूपा त्वमेव कामाक्षि
    ॥ ॥ बाधाकरीं भवाब्धेराधाराद्यम्बुजेषु विचरन्तीम् । आधारीकृतकाञ्ची बोधामृतवीचिमेव विमृशामः ॥ ॥ कलयाम्यन्तः
    शशधरकलयाऽङ्कितमौलिममलचिद्वलयाम् । अलयामागमपीठीनिलयां वलयाङ्कसुन्दरीमम्बाम् ॥ ॥ शर्वादिपरमसाधकगुर्वानीताय
    कामपीठजुषे । सर्वाकृतये शोणिमगर्वायास्मै समर्प्यते हृदयम् ॥ ॥ समया सान्ध्यमयूखैः समया बुद्धया सदैव
    शीलितया । उमया काञ्चीरतया न मया लभ्यते किं नु तादात्म्यम् ॥ ॥ जन्तोस्तव पदपूजनसन्तोषतरङ्गितस्य कामाक्षि
    । वन्धो यदि भवति पुनः सिन्धोरम्भस्सु बम्भ्रमीति शिला ॥ ॥ कुण्डलि कुमारि कुटिले चण्डि चराचरसवित्रि
    चामुण्डे । गुणिनि गुहारिणि गुह्ये गुरुमूर्ते त्वां नमामि कामाक्षि ॥ ॥ अभिदाकृतिर्भिदाकृतिरचिदाकृतिरपि
    चिदाकृतिर्मातः । अनहन्ता त्वमहन्ता भ्रमयसि कामाक्षि शाश्वती विश्वम् ॥ ॥ शिव शिव पश्यन्ति समं श्रीकामाक्षीकटाक्षिताः
    पुरुषाः । विपिनं भवनममित्रं मित्रं लोष्टं च युवतिबिम्बोष्ठम् ॥ ॥ कामपरिपन्थिकामिनि कामेश्वरि कामपीठमध्यगते
    । कामदुघा भव कमले कामकले कामकोटि कामाक्षि ॥ ॥ मध्येहृदयं मध्येनिटिलं मध्येशिरोऽपि वास्तव्याम् । चण्डकरशक्रकार्मुकचन्द्रसमाभां
    नमामि कामाक्षीम् ॥ ॥ अधिकाञ्चि केलिलोलैरखिलागमयन्त्रतन्त्रमयैः । अतिशीतं मम मानसमसमशरद्रोहिजीवनोपायैः
    ॥ ॥ नन्दति मम हृदि काचन मन्दिरयन्ती निरन्तरं काञ्चीम् । इन्दुरविमण्डलकुचा बिन्दुवियन्नादपरिणता तरुणी
    ॥ ॥ शम्पालतासवर्णं सम्पादयितुं भवज्वरचिकित्साम् । लिम्पामि मनसि किञ्चन कम्पातटरोहि सिद्धभैषज्यम् ॥
    ॥ अनुमितकुचकाठिन्यामधिवक्षःपीठमङ्गजन्मरिपोः । आनन्ददां भजे तामानङ्गब्रह्मतत्वबोधसिराम् ॥ ॥ ऐक्षिषि
    पाशाङ्कुशधरहस्तान्तं विस्मयार्हवृत्तान्तम् । अधिकाञ्चि निगमवाचां सिद्धान्तं शूलपाणिशुद्धान्तम् ॥ ॥
    आहितविलासभङ्गीमाब्रह्मस्तम्बशिल्पकल्पनया । आश्रितकाञ्चीमतुलामाद्यां विस्फूर्तिमाद्रिये विद्याम् ॥
    ॥ मूकोऽपि जटिलदुर्गतिशोकोऽपि स्मरति यः क्षणं भवतीम् । एको भवति स जन्तुर्लोकोत्तरकीर्तिरेव कामाक्षि
    ॥ ॥ पञ्चदशवर्णरूपं कञ्चन काञ्चीविहारधौरेयम् । पञ्चशरीयं शम्भोर्वञ्चनवैदग्ध्यमूलमवलम्बे ॥ ॥ परिणतिमतीं
    चतुर्धा पदवीं सुधियां समेत्य सौषुम्नीम् । पञ्चाशदर्णकल्पितमदशिल्पां त्वां नमामि कामाक्षि ॥ ॥ आदिक्षन्मम
    गुरुराडादिक्षान्ताक्षरात्मिकां विद्याम् । स्वादिष्ठचापदण्डां नेदिष्ठामेव कामपीठगताम् ॥ ॥ तुष्यामि
    हर्षितस्मरशासनया काञ्चिपुरकृतासनया । स्वासनया सकलजगद्भासनया कलितशम्बरासनया ॥ ॥ प्रेमवती कम्पायां स्थेमवती
    यतिमनस्सु भूमवती । सामवती नित्यगिरा सोमवती शिरसि भाति हैमवती ॥ ॥ कौतुकिना कम्पायां कौसुमचापेन कीलितेनान्तः
    । कुलदैवतेन महता कुड्मलमुद्रां धुनोतु नःप्रतिभा ॥ ॥ यूना केनापि मिलद्देहा स्वाहासहायतिलकेन । सहकारमूलदेशे
    संविद्रूपा कुटुम्बिनी रमते ॥ ॥ कुसुमशरगर्वसम्पत्कोशगृहं भाति काञ्चिदेशगतम् । स्थापितमस्मिन्कथमपि गोपितमन्तर्मया
    मनोरत्नम् ॥ ॥ दग्धषडध्वारण्यं दरदलितकुसुम्भसम्भृतारुण्यम् । कलये नवतारुण्यं कम्पातटसीम्नि किमपि कारुण्यम्
    ॥ ॥ अधिकाञ्चि वर्धमानामतुलां करवाणि पारणामक्ष्णोः । आनन्दपाकभेदामरुणिमपरिणामगर्वपल्लविताम् ॥ ॥ बाणसृणिपाशकार्मुकपाणिममुं
    कमपि कामपीठगतम् । एणधरकोणचूडं शोणिमपरिपाकभेदमाकलये ॥ ॥ किं वा फलति ममान्यौर्बिम्बाधरचुम्बिमन्दहासमुखी
    । सम्बाधकरी तमसामम्बा जागर्ति मनसि कामाक्षी ॥ ॥ मञ्चे सदाशिवमये परिशिवमयललितपौष्पपर्यङ्के । अधिचक्रमध्यमास्ते
    कामाक्षी नाम किमपि मम भाग्यम् ॥ ॥ रक्ष्योऽस्मि कामपीठीलासिकया घनकृपाम्बुराशिकया । श्रुतियुवतिकुन्तलीमणिमालिकया
    तुहिनशैलबालिकया ॥ ॥ लीये पुरहरजाये माये तव तरुणपल्लवच्छाये । चरणे चन्द्राभरणे काञ्चीशरणे नतार्तिसंहरणे
    ॥ ॥ मूर्तिमति मुक्तिबीजे मूर्ध्नि स्तबकितचकोरसाम्राज्ये । मोदितकम्पाकूले मुहुर्मुहुर्मनसि मुमुदिषाऽस्माकम्
    ॥ ॥ वेदमयीं नादमयीं बिन्दुमयीं परपदोद्यदिन्दुमयीम् । मन्त्रमयीं तन्त्रमयीं प्रकृतिमयीं नौमि विश्वविकृतिमयीम्
    ॥ ॥ पुरमथनपुण्यकोटी पुञ्जितकविलोकसूक्तिरसधाटी । मनसि मम कामकोटी विहरतु करुणाविपाकपरिपाटी ॥ ॥ कुटिलं
    चटुलं पृथुलं मृदुलं कचनयनजघनचरणेषु । अवलोकितमवलम्बितमधिकम्पातटममेयमस्माभिः ॥ ॥ प्रत्यङ्मुख्या दृष्टया
    प्रसाददीपाङ्कुरेण कामाक्ष्याः । पश्यामि निस्तुलमहो पचेलिमं कमपि परशिवोल्लासम् ॥ ॥ विद्ये विधातृविषये
    कात्यायनि कालि कामकोटिकले । भारति भैरवि भद्रे शाकिनि शाम्भवि शिवे स्तुवे भवतीम् ॥ ॥ मालिनि महेशचालिनि
    काञ्चीखेलिनि विपक्षकालिनि ते । शूलिनि विद्रुमशालिनि सुरजनपालिनि कपालिनि नमोऽस्तु ॥ ॥ देशिक इति किं
    शङ्के तत्तादृक्तव नु तरुणिमोन्मेषः । कामाक्षि शूलपाणेः कामागमसमयदीक्षायाम् ॥ ॥ वेतण्डकुम्भडम्बरवैतण्डिककुचभरार्तमध्याय
    । कुङ्कुमरुचे नमस्यां शङ्करनयनामृताय रचयामः ॥ ॥ अधिकाञ्चितमणिकाञ्चनकाञ्चीमधिकाञ्चि काञ्चिदद्राक्षम्
    । अवनतजनानुकम्पामनुकम्पाकूलमस्मदनुकूलाम् ॥ ॥ परिचितकम्पातीरं पर्वतराजन्यसुकृतसन्नाहम् । परगुरुकृपया
    वीक्षे परमशिवोत्सङ्गमङ्गलाभरणम् ॥ ॥ दग्धमदनस्य शम्भोः प्रथीयसीं ब्रह्मचर्यवैदग्धीम् । तव देवि तरुणिमश्रीचतुरिमपाको
    न चक्षमे मातः ॥ ॥ मदजलतमालपत्रा वसनितपत्रा करादृतखानित्रा । विहरति पुलिन्दयोषा गुञ्जाभूषा फणीन्द्रकृतवेषा
    ॥ ॥ अङ्के शुकिनी गीते कौतुकिनी परिसरे च गायकिनी । जयसि सविधेऽम्ब भैरवमण्डलिनी श्रवसि शङ्खकुन्डलिनी
    ॥ ॥ प्रणतजनतापवर्गा कृतबहुसर्गा ससिंहसंसर्गा । कामाक्षि मुदितभर्गा हतरिपुवर्गा त्वमेव सा दुर्गा ॥
    ॥ श्रवणचलद्वेतण्डा समरोद्दण्डा धुतासुरशिखण्डा । देवि कलितान्त्रषण्डा धृतनरमुण्डा त्वमेव चामुण्डा ॥
    ॥ उर्वीधरेन्द्रकन्ये दर्वीभरितेन भक्तपूरेण । गुर्वीमकिञ्चनार्ति खर्वीकुरुषे त्वमेव कामाक्षि ॥ ॥ ताडितरिपुपरिपीडनभयहरण
    निपुणहलमुसला । क्रोडपतिभीषणमुखी क्रीडसि जगति त्वमेव कामाक्षि ॥ ॥ स्मरमथनवरणलोला मन्मथहेलाविलासमणिशाला
    । कनकरुचिचौर्यशीला त्वमम्ब बाला कराब्जधृतमाला ॥ ॥ विमलपटी कमलकुटी पुस्तकरुद्राक्षशस्तहस्तपुटी । कामाक्षि
    पक्ष्मलाक्षी कलितविपञ्ची विभासि वैरिञ्ची ॥ ॥ कुङ्कुमरुचिपिङ्गमसृक्पङ्किलमुण्डालिमण्डितं मातः । श्रीकामाक्षि
    तदीयसङ्गमकलामन्दीभवत्कौतुकः जयति तव रूपधेयं जपपटपुस्तकवराभयकराब्जम् ॥ ॥ कनकमणिकलितभूषां कालायसकलहशीलकान्तिकलाम्
    । कामाक्षि शीलये त्वां कपालशूलाभिरामकरकमलाम् ॥ ॥ लोहितिमपुञ्जमध्ये मोहितभुवने मुदा निरीक्षन्ते । वदनं
    तव कुवयुगलं काञ्चीसीमां च केऽपि कामाक्षि ॥ ॥ जलधिद्विगुणितहुतबहदिशादिनेश्वरकलाश्विनेयदलैः । नलिनैर्महेशि
    गच्छसि सर्वोत्तरकरकमलदलममलम् ॥ ॥ सत्कृतदेशिकचरणाः सबीजनिर्बीजयोगनिश्रेण्या । अपवर्गसौधवलभीमारोहन्त्यम्ब
    केऽपि तव कृपया ॥ ॥ अन्तरपि बहिरपि त्वं जन्तुततेरन्तकान्तकृदहन्ते । चिन्तितसन्तानवतां सन्ततमपि तन्तनीषि
    महिमानम् ॥ ॥ कलमञ्जुलवागनुमितगलपञ्जरगतशुकग्रहौत्कण्ठ्यात् । अम्ब रदनाम्बरं ते बिम्बफलं शम्बरारिणा
    न्यस्तम् ॥ ॥ जय जय जगदम्ब शिवे जय जय कामाक्षि जय जयाद्रिसुते । जय जय महेशदयिते जय जय चिद्गगनकौमुदीधारे
    ॥ ॥ आर्याशतकं भक्त्या पठतामार्याकटाक्षेण । निस्सरति वदनकमलाद्वाणी पीयूषधोरणी दिव्या ॥ ॥ ॥ इति आर्याशतकं
    सम्पूर्णम् ॥
