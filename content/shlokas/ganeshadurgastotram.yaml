id: ganeshadurgastotram
category: stotram
name:
  english: ganeshadurgastotram
  devanagari: गणेशदुर्गस्तोत्रम्
content:
  english: rinu vatsa pravakshyami durgam vainayakam shubham || 4|| sangrame ca shmashaneca aranye corasankate
    | nripadvare jvare ghore yenaiva mucyate bhayat || 5|| pracyam rakshatu herambah agneyamagnitejasa
    | yamyam lambodaro rakshet nairrityam parvatisutah || 6 || praticyam vakratundashca vayavyam varadaprabhuh
    | ganeshah patu audicyam ishanyamishvarastatha || 7|| urdhvam rakshetdhumravarno hyadhastatpapanashanah
    | evam dashadisho rakshet herambo vighnanashanah || 8|| herambasya durgamidam trikalam yah pathennarah
    | kotijanmakritam papam ekavrittena nashyati || 9|| ganeshangarasheshena divyadurgena mantritam |
    lalatam carcitam yena trailokyavashamanayet || 10|| matragamasahasrani surapanashatani ca | tatkshanattani
    nashyanti ganeshatirthavandanat || 11|| naivedyam vakratundasya naro bhunkte tu bhaktitah | rajyadanasahasrani
    tesham phalamavapnuyat || 12 || kadacit pathyate bhaktya herambasya prasadatah | shakinidakinibhutapretavetalarakshasah
    || 13|| brahmarakshasakushmandah pranashyanti ca duratah | bhurje va tadapatre va durgam herambamalikhet
    || 14|| karamule dhritam yena karasthah sarvasiddhayah | ekamavartanam bhaktya pathennityam tu yo
    narah || 15|| kalpakotisahasrani shivaloke mahiyate | lingadanasahasrani prithvidana shatani ca ||
    16|| gajadanasahasram ca ganeshastavanat phalam | iti shripadmapurane ganeshadivyadurgastotram sampurnam
    |
  devanagari: ृणु वत्स प्रवक्ष्यामि दुर्गं वैनायकं शुभम् ॥ ४॥ सङ्ग्रामे च श्मशानेच अरण्ये चोरसङ्कटे ।
    नृपद्वारे ज्वरे घोरे येनैव मुच्यते भयात् ॥ ५॥ प्राच्यां रक्षतु हेरम्बः आग्नेयामग्नितेजसा । याम्यां
    लम्बोदरो रक्षेत् नैरृत्यां पार्वतीसुतः ॥ ६ ॥ प्रतीच्यां वक्रतुण्डश्च वायव्यां वरदप्रभुः । गणेशः पातु
    औदिच्यां ईशान्यामीश्वरस्तथा ॥ ७॥ ऊर्ध्वं रक्षेत्धूम्रवर्णो ह्यधस्तात्पापनाशनः । एवं दशदिशो रक्षेत्
    हेरम्बो विघ्ननाशनः ॥ ८॥ हेरम्बस्य दुर्गमिदं त्रिकालं यः पठेन्नरः । कोटिजन्मकृतं पापं एकावृत्तेन नश्यति
    ॥ ९॥ गणेशाङ्गारशेषेण दिव्यदुर्गेण मन्त्रितम् । ललाटं चर्चितं येन त्रैलोक्यवशमानयेत् ॥ १०॥ मात्रागमसहस्राणि
    सुरापानशतानि च । तत्क्षणात्तानि नश्यन्ति गणेशतीर्थवन्दनात् ॥ ११॥ नैवेद्यं वक्रतुण्डस्य नरो भुङ्क्ते
    तु भक्तितः । राज्यदानसहस्राणि तेषां फलमवाप्नुयात् ॥ १२ ॥ कदाचित् पठ्यते भक्त्या हेरम्बस्य प्रसादतः
    । शाकिनीडाकिनीभूतप्रेतवेतालराक्षसाः ॥ १३॥ ब्रह्मराक्षसकूष्माण्डाः प्रणश्यन्ति च दूरतः । भूर्जे वा
    ताडपत्रे वा दुर्गं हेरम्बमालिखेत् ॥ १४॥ करमूले धृतं येन करस्थाः सर्वसिद्धयः । एकमावर्तनं भक्त्या पठेन्नित्यं
    तु यो नरः ॥ १५॥ कल्पकोटिसहस्राणि शिवलोके महीयते । लिङ्गदानसहस्राणि पृथ्विदान शतानि च ॥ १६॥ गजदानसहस्रं
    च गणेशस्तवनात् फलम् । इति श्रीपद्मपुराणे गणेशदिव्यदुर्गस्तोत्रं सम्पूर्णम् ।
