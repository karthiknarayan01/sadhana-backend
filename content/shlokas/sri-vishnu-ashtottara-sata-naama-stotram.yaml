id: sri-vishnu-ashtottara-sata-naama-stotram
category: stotram
name:
  english: Sri Vishnu Ashtottara Sata Naama Stotram
content:
  english: ashtottarashatam namnam vishnoratulatejasah | yasya shravanamatrena naro narayano bhavet ||
    || vishnurjishnurvashatkaro devadevo vrishakapih | damodaro dinabandhuradidevo'ditestutah || || pundarikah
    paranandah paramatma paratparah | parashudhari vishvatma krishnah kalimalapaha || || kaustubhodbhasitorasko
    naro narayano harih | haro harapriyah svami vaikuntho vishvatomukhah || || hrishikesho'prameyatma
    varaho dharanidharah | vamano vedavakta ca vasudevah sanatanah || || ramo viramo virajo ravanari ramapatih
    | vaikunthavasi vasuman dhanado dharanidharah || || dharmesho dharaninatho dhyeyo dharmabhritamvarah
    | sahasrashirsha purushah sahasrakshah sahasrapat || || sarvagah sarvavitsarvah sharanyah sadhuvallabhah
    | kausalyanandanah shriman rakshasahkulanashakah || || jagatkarta jagaddharta jagajjeta janartiha
    | janakivallabho devo jayarupo jaleshvarah || || kshirabdhivasi kshirabdhitanayavallabhastatha | sheshashayi
    pannagarivahano vishtarashravah || || madhavo mathuranatho mukundo mohanashanah | daityarih pundarikaksho
    hyacyuto madhusudanah || || somasuryagninayano nrisimho bhaktavatsalah | nityo niramayashshuddho varadevo
    jagatprabhuh || hayagrivo jitaripurupendro rukminipatih | sarvadevamayah shrishah sarvadharah sanatanah
    || || saumyah saumyapradah srashta vishvakseno janardanah | yashodatanayo yogi yogashastraparayanah
    || || rudratmako rudramurtih raghavo madhusudhanah | iti te kathitam divyam namnamashtottaram shatam
    || || sarvapapaharam punyam divyoratulatejasah | duhkhadaridryadaurbhagyanashanam sukhavardhanam ||
    || sarvasampatkaram saumyam mahapatakanashanam | pratarutthaya vipendra pathedekagramanasah || ||
    tasya nashyanti vipadam rashayah siddhimapnuyat || || iti shri vishnoh ashtottarashatanama stotram
    ||
  devanagari: अष्टोत्तरशतं नाम्नां विष्णोरतुलतेजसः । यस्य श्रवणमात्रेण नरो नारायणो भवेत् ॥ ॥ विष्णुर्जिष्णुर्वषट्कारो
    देवदेवो वृषाकपिः । दामोदरो दीनबन्धुरादिदेवोऽदितेस्तुतः ॥ ॥ पुण्डरीकः परानन्दः परमात्मा परात्परः ।
    परशुधारी विश्वात्मा कृष्णः कलिमलापहा ॥ ॥ कौस्तुभोद्भासितोरस्को नरो नारायणो हरिः । हरो हरप्रियः स्वामी
    वैकुण्ठो विश्वतोमुखः ॥ ॥ हृषीकेशोऽप्रमेयात्मा वराहो धरणीधरः । वामनो वेदवक्ता च वासुदेवः सनातनः ॥ ॥
    रामो विरामो विरजो रावणारी रमापतिः । वैकुण्ठवासी वसुमान् धनदो धरणीधरः ॥ ॥ धर्मेशो धरणीनाथो ध्येयो धर्मभृतांवरः
    । सहस्रशीर्षा पुरुषः सहस्राक्षः सहस्रपात् ॥ ॥ सर्वगः सर्ववित्सर्वः शरण्यः साधुवल्लभः । कौसल्यानन्दनः
    श्रीमान् राक्षसःकुलनाशकः ॥ ॥ जगत्कर्ता जगद्धर्ता जगज्जेता जनार्तिहा । जानकीवल्लभो देवो जयरूपो जलेश्वरः
    ॥ ॥ क्षीराब्धिवासी क्षीराब्धितनयावल्लभस्तथा । शेषशायी पन्नगारिवाहनो विष्टरश्रवः ॥ ॥ माधवो मथुरानाथो
    मुकुन्दो मोहनाशनः । दैत्यारिः पुण्डरीकाक्षो ह्यच्युतो मधुसूदनः ॥ ॥ सोमसूर्याग्निनयनो नृसिंहो भक्तवत्सलः
    । नित्यो निरामयश्शुद्धो वरदेवो जगत्प्रभुः ॥ हयग्रीवो जितरिपुरुपेन्द्रो रुक्मिणीपतिः । सर्वदेवमयः श्रीशः
    सर्वाधारः सनातनः ॥ ॥ सौम्यः सौम्यप्रदः स्रष्टा विष्वक्सेनो जनार्दनः । यशोदातनयो योगी योगशास्त्रपरायणः
    ॥ ॥ रुद्रात्मको रुद्रमूर्तिः राघवो मधुसूधनः । इति ते कथितं दिव्यं नाम्नामष्टोत्तरं शतम् ॥ ॥ सर्वपापहरं
    पुण्यं दिव्योरतुलतेजसः । दुःखदारिद्र्यदौर्भाग्यनाशनं सुखवर्धनम् ॥ ॥ सर्वसम्पत्करं सौम्यं महापातकनाशनम्
    । प्रातरुत्थाय विपेन्द्र पठेदेकाग्रमानसः ॥ ॥ तस्य नश्यन्ति विपदां राशयः सिद्धिमाप्नुयात् ॥ ॥ इति श्री
    विष्णोः अष्टोत्तरशतनाम स्तोत्रम् ॥
