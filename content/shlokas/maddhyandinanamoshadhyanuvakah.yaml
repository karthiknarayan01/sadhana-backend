id: maddhyandinanamoshadhyanuvakah
category: sukta
name:
  english: maddhyandinanamoshadhyanuvakah
  devanagari: माद्ध्यन्दिनानामोषध्यनुवाकः
content:
  english: saha̭manasyoshadhe || 25|| dirggha̱yṷsta oshadhe khani̱ta yasmmai̭ ca ttva̱ khana̭mmya̱ham
    | atho̱ ttvam dirggha̱yṷrbbhuttva sha̱tava̭lsha̱ vviro̭hatat || 26|| tvamṷtta̱masyo̭shadhe̱ tava̭
    vvri̱ksha upa̭sttayah | upa̭stirasttu̱ so̱smaka̱~ yyo a̱sma~ a̭bhi̱dasa̭ti || 27|| nihsvarah ya oshadhih
    purvva jata devebbhyastriyugam pura | manai nu babbhrunamaha shatam dhamana saptaca || 1|| shatam
    vo amba dhamani sahasramuta vo ruhah | adha shatakrattvo yuyamimam me agadam krita || 2|| oshadhih
    prati modaddhvam pushpavatih prasuvarih | ashshva iva sajittvarirvvirudhah parayishnavah || 3|| oshadhiriti
    matarastaddvo devirupa bbruve | saneyamashshvam gam vvasa atmanam tava purusha || 4|| ashshvatthe
    vo nishadanam parnne vo vasatishkrita | gobhaja itkilasatha yatsanavatha purusham || 5|| yatraushadhih
    samaggmata rajanah samitaviva | vviprah sa ucyate bhishaggrakshohamivacatanah || 6|| ashshvavatim
    somavatimurjjayantimudojasam | a'vitsi sarvva oshadhirasma arishttatataye || 7|| ucchushmma oshadhinam
    gavo goshtthadiverate | dhanam sanishshyantinamatmanam tava purusha || 8|| ishkritirnnama vo mata'tho
    yuyam stha nishkritih | sirah patattrini stthana yadamayati nishkritha || 9|| ati vishshvah parishtha
    sttena iva vvrajamakkramuh | oshadhih ppracuccyavuryyattkinca tannvo rapah || 10|| yadima vvajayannahamoshadhirhasta
    adadhe | atma yakshmasya nashshyati pura jivagribho yatha || 11|| yasyaushadhih pprasarppathangamangam
    parushshparuh | tato yakshmam vvibadadhva uggro maddhyamashiriva || 12|| saka~ yyakshma pprapata cashena
    kikidivina | sakam vvatasya dhdrajjya sakannashshya nihakaya || 13|| annya vo annyamavattvannyannyasya
    upavata | tah sarvah samvidana idamme ppravata vvacah || 14|| yah phaliniryya aphala apushppa yashca
    pushpinih | brihasppatiprasuttasta no muncantvam hasah || 15|| muncantu ma shapatthyadatho vvarunyaduta
    | atho yamasya paddvishattsarvvasmaddevakilbbishat || 16|| avapatantiravadan diva oshadhayasppari
    | ya jivamashnnavamahai na sa rishshyati purushah || 17|| ya oshadhih somarajnirbbahhvih shatavicakshanah
    | tasamasi ttvamuttamaram kamaya sham hride || 18|| ya oshadhih somarajnirvvishththitah prithivimanu
    | brihasppatipprasuta asyai sandatta vviryam || 19|| yashshcedamupasha
  devanagari: सह॑मानास्योषधे ॥ २५॥ दीर्ग्घा॒यु॑स्त ओषधे खनि॒ता यस्म्मै॑ च त्त्वा॒ खना॑म्म्य॒हम् । अथो॒
    त्त्वं दीर्ग्घा॒यु॑र्ब्भूत्त्वा श॒तव॑ल्शा॒ व्विरो॑हतात् ॥ २६॥ त्वमु॑त्त॒मास्यो॑षधे॒ तव॑ व्वृ॒क्षा
    उप॑स्त्तयः । उप॑स्तिरस्त्तु॒ सो॒स्माकँ॒ य्यो अ॒स्माँ अ॑भि॒दास॑ति ॥ २७॥ निःस्वरः या ओषधीः पूर्व्वा
    जाता देवेब्भ्यस्त्रियुगं पुरा । मनै नु बब्भ्रुणामह शतं धामान सप्तच ॥ १॥ शतं वो अम्ब धामानि सहस्रमुत
    वो रुहः । अधा शतक्रत्त्वो यूयमिमं मे अगदं कृत ॥ २॥ ओषधीः प्रति मोदद्ध्वं पुष्पवतीः प्रसूवरीः । अश्श्वा
    इव सजित्त्वरीर्व्वीरुधः पारयिष्णवः ॥ ३॥ ओषधीरिति मातरस्तद्द्वो देवीरुप ब्ब्रुवे । सनेयमश्श्वं गां
    व्वास आत्मानं तव पूरुष ॥ ४॥ अश्श्वत्थे वो निषदनं पर्ण्णे वो वसतिष्कृता । गोभाज इत्किलासथ यत्सनवथ पूरुषम्
    ॥ ५॥ यत्रौषधीः समग्ग्मत राजानः समिताविव । व्विप्रः स उच्यते भिषग्ग्रक्षोहामीवचातनः ॥ ६॥ अश्श्वावतीं
    सोमावतीमूर्ज्जयन्तीमुदोजसम् । आऽवित्सि सर्व्वा ओषधीरस्मा अरिष्ट्टतातये ॥ ७॥ उच्छुष्म्मा ओषधीनां गावो
    गोष्ट्ठादिवेरते । धनं सनिष्ष्यन्तीनामात्मानं तव पूरुष ॥ ८॥ इष्कृतिर्न्नाम वो माताऽथो यूयं स्थ निष्कृतीः
    । सीराः पतत्त्रिणी स्त्थन यदामयति निष्कृथ ॥ ९॥ अति विश्श्वाः परिष्ठा स्त्तेन इव व्व्रजमक्क्रमुः ।
    ओषधीः प्प्राचुच्च्यवुर्य्यत्त्किञ्च तन्न्वो रपः ॥ १०॥ यदिमा व्वाजयन्नहमोषधीर्हस्त आदधे । आत्मा यक्ष्मस्य
    नश्श्यति पुरा जीवगृभो यथा ॥ ११॥ यस्यौषधीः प्प्रसर्प्पथाङ्गमङ्गं परुष्ष्परुः । ततो यक्ष्मं व्विबादध्व
    उग्ग्रो मद्ध्यमशीरिव ॥ १२॥ साकँ य्यक्ष्म प्प्रपत चाषेण किकिदीविना । साकं व्वातस्य ध्द्राज्ज्या साकन्नश्श्य
    निहाकया ॥ १३॥ अन्न्या वो अन्न्यामवत्त्वन्न्यान्न्यस्या उपावत । ताः सर्वाः संविदाना इदम्मे प्प्रावता
    व्वचः ॥ १४॥ याः फलिनीर्य्या अफला अपुष्प्पा याश्च पुष्पिणीः । बृहस्प्पतिप्रसूत्तास्ता नो मुञ्चन्त्वं
    हसः ॥ १५॥ मुञ्चन्तु मा शपत्थ्यादथो व्वरुण्यादुत । अथो यमस्य पड्ड्वीशात्त्सर्व्वस्माद्देवकिल्ब्बिषात्
    ॥ १६॥ अवपतन्तीरवदन् दिव ओषधयस्प्परि । य जीवमश्न्नवामहै न स रिष्ष्याति पूरुषः ॥ १७॥ या ओषधीः सोमराज्ञीर्ब्बह्ह्वीः
    शतविचक्षणाः । तासामसि त्त्वमुत्तमारं कामाय शं हृदे ॥ १८॥ या ओषधीः सोमराज्ञीर्व्विष्ठ्ठिताः पृथिवीमनु
    । बृहस्प्पतिप्प्रसूता अस्यै सन्दत्त व्वीर्यम् ॥ १९॥ याश्श्चेदमुपश
