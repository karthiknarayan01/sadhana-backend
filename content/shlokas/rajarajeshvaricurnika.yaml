id: rajarajeshvaricurnika
category: stotram
name:
  english: rajarajeshvaricurnika
  devanagari: राजराजेश्वरीचूर्णिका
content:
  english: muktavidruma hemakundaladhara simhadhirudha shiva | raktambhojasamanakanti vadana shrimatkiritanvita
    || muktahemavicitraharakatakaih pitambara shankari | bhaktabhishtavarapradanacatura mampatu hemambika
    || || shri vidyadhisha viracita shri rajarajeshvari curnika samapta ||
  devanagari: मुक्ताविद्रुम हेमकुण्डलधरा सिंहाधिरूढा शिवा । रक्तांभोजसमानकान्ति वदना श्रीमत्किरीटान्विता
    ॥ मुक्ताहेमविचित्रहारकटकैः पीतांबरा शङ्करी । भक्ताभीष्टवरप्रदानचतुरा मांपातु हेमाम्बिका ॥ ॥ श्री विद्याधीश
    विरचित श्री राजराजेश्वरी चूर्णिका समाप्ता ॥
meaning: {}
