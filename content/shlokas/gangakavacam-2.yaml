id: gangakavacam-2
category: kavacha
name:
  english: gangakavacam 2
  devanagari: गन्गाकवचम् २
content:
  english: mili gange devinamobhrisham | murdhadipadaparyantam patu pancadashakshari || 31|| tara maya
    rama hardai pracyam rakshatu me sada || agneyam mam bhagavati patu me cakrasamsthita || 32|| dakshine
    gangadayite nairrityam varmapurvavat | praticyamastrato rakshedripubharanikrintani || 33|| vagbhavam
    patu vayavyam maya rakshatu cottare | ishanyam kamala rakshet kamabijam nabho'vatu || 34|| adhastatpavano
    rakshetsarvatra sarvamantrarat | manikarnibhagi brahma hridayam dhruvasamyuta || 35|| vishamindudhukah
    purvam mantrashrimanikarnika | sarvatra me sada patu bahyabhyantarabhedatah || 36|| iti te kathitam
    devi sarat sarataram param | sarvarthasadhanam nama kavacam paramadbhutam || 36|| asyapi pathanatsadyah
    kubero'pi dhaneshvarah | indradyahsakala deva dharanatpathanadyatah || 37|| sarvasiddhishvarah santah
    sarvaishvaryamavapnuyuh | pushpanjalyashtakam datva mulenaiva pathetsakrit || 38|| samvatsarakritayastu
    pujayah phalamapnayata | pritimanyonyatah kritva kamala nishcala grihe || 39|| vaniyam nivasedvakre
    satyam satyam na samshayah | yo dharayati punyatma sarvarthasadhanabhidham || 40|| kavacam paramam
    punyam so'pi punyavatam varah | sarvaishvaryayuto bhutva trailokyavijayi bhavet || 41|| purusho dakshine
    bahau nari vamabhuje tatha || bahuputrayuto bhuyadvandhyapi labhate sutam || 42|| brahmastradini shastrani
    naiva krintanti nashanam | gopaniyam gopaniyam gopaniyam prayatnatah || 43|| iti shrirudrayamale parvatishvarasambade
    sarvarthasadhanabhidham shrigangakavacavam sampurnam |
  devanagari: मिलि गङ्गे देविनमोभृशम् । मूर्धादिपादपर्यन्तं पातु पञ्चदशाक्षरी ॥ ३१॥ तारा माया रमा हार्दै
    प्राच्यां रक्षतु मे सदा ॥ आग्नेयां मां भगवती पातु मे चक्रसंस्थिता ॥ ३२॥ दक्षिणे गाङ्गदयिते नैरृत्यां
    वर्मपूर्ववत् । प्रतीच्यामस्त्रतो रक्षेद्रिपुभारनिकृन्तनी ॥ ३३॥ वाग्भवं पातु वायव्यां माया रक्षतु चोत्तरे
    । ईशान्यां कमला रक्षेत् कामबीजं नभोऽवतु ॥ ३४॥ अधस्तात्पवनो रक्षेत्सर्वत्र सर्वमन्त्रराट् । मणिकर्णिभगी
    ब्रह्मा हृदयं ध्रुवसंयुता ॥ ३५॥ विषमिन्दुधुकः पूर्वं मन्त्रश्रीमणिकर्णिका । सर्वत्र मे सदा पातु बाह्याभ्यन्तरभेदतः
    ॥ ३६॥ इति ते कथितं देवि सारात् सारतरं परम् । सर्वार्थसाधनं नाम कवचं परमाद्भुतम् ॥ ३६॥ अस्यापि पठनात्सद्यः
    कुबेरोऽपि धनेश्वरः । इन्द्राद्याःसकला देवा धारणात्पठनाद्यतः ॥ ३७॥ सर्वसिद्धीश्वराः सन्तः सर्वैश्वर्यमवाप्नुयुः
    । पुष्पाञ्जल्यष्टकं दत्वा मूलेनैव पठेत्सकृत् ॥ ३८॥ संवत्सरकृतायास्तु पूजायाः फलमाप्नयात । प्रीतिमन्योन्यतः
    कृत्वा कमला निश्चला गृहे ॥ ३९॥ वाणीयं निवसेद्वक्रे सत्यं सत्यं न संशयः । यो धारयति पुण्यात्मा सर्वार्थसाधनाभिधम्
    ॥ ४०॥ कवचं परमं पुण्यं सोऽपि पुण्यवतां वरः । सर्वैश्वर्ययुतो भूत्वा त्रैलोक्यविजयी भवेत् ॥ ४१॥ पुरुषो
    दक्षिणे बाहौ नारी वामभुजे तथा ॥ बहुपुत्रयुतो भूयाद्वन्ध्यापि लभते सुतम् ॥ ४२॥ ब्रह्मास्त्रादीनि शस्त्राणि
    नैव कृन्तन्ति नाशनम् । गोपनीयं गोपनीयं गोपनीयं प्रयत्नतः ॥ ४३॥ इति श्रीरुद्रयामले पार्वतीश्वरसम्बादे
    सर्वार्थसाधनाभिधं श्रीगङ्गाकवचवं सम्पूर्णम् ।
