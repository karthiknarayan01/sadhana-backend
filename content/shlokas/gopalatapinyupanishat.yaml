id: gopalatapinyupanishat
category: upanishad
name:
  english: gopalatapinyupanishat
  devanagari: गोपालतापिन्युपनिषत्
content:
  english: om ekada hi vrajastriyah sakamah sharvarimushitva sarveshvaram gopalam krishnamucire | uvaca
    tah krishna amukasmai brahmanaya bhaikshyam datavyamiti durvasasa iti | katham yasyamo jalam tirtva
    yamunayah | yatah shreyo bhavati krishneti brahmacarityuktva margam vo dasyati | yam mam smritva'gadha
    gadha bhavati | yam mam smritva'putah puto bhavati | yam mam smritva'vrati vrati bhavati | yam mam
    smritva sakamo nishkamo bhavati | yam mam smritva'shrotriyah shrotriyo bhavati | yam mam smritva'gadhatah
    sparsharahitapi sarva saridgadha bhavati | shrutva tadvakyam hi vai raudram smritva tadvakyena tirtva
    tatsauryam hi vai gatvashramam punyatamam hi vai natva munim shreshthatamam hi vai raudram ceti |
    dattvasmai brahmanaya kshiramayam ghritamayamishtatamam hi vai mrishtatamam hi tushtah snatva bhuktva
    hitvashisham prayujyannam jnatvadat | katham yasyamo tirtva sauryam | sa hovaca munirdurvasanam mam
    smritva vo dasyatiti margam | tasam madhye hi shreshtha gandharvi hyuvaca tam tam hi vai tamih | evam
    katham krishno brahmacari | katham durvasano munih | tam hi mukhyam vidhaya purvamanukritva tushnimasuh
    | shabdavanakashah shabdakashabhyam bhinnah | tasminnakashastishthati | akashe tishthati sa hyakashastam
    na veda | sa hyatma | aham katham bhokta bhavami | rupavadidam tejo rupagnibhyam bhinnam | tasminnagnistishthati
    | agnau tishthati agnistam na veda | sa hyatma | aham katham bhokta bhavami | rasavatya apo rasadbhyam
    bhinnah | tasvapastishthanti | apsu bhumirgandhabhumibhyam bhinna | tasyam bhumistishthati | bhumau
    tishthati | bhumistam na veda | sa hyatma | aham katham bhokta bhavami | idam hi manasaivedam manute
    | tanidam hi grihnati | yatra sarvamatmaivabhuttatra kutra va manute | katham va gacchatiti | sa hyatma
    | aham katham bhokta bhavami | ayam hi krishno yo hi preshthah shariradvayakaranam bhavati | dva suparna
    bhavato brahmano'ham sambhutastathetaro bhokta bhavati | anyo hi sakshi bhavatiti | vrikshadharme
    tau tishthatah | atu bhoktabhoktarau | purvo hi bhokta bhavati | tathetaro'bhokta krishno bhavatiti
    | yatra vidyavidye na vidama | vidyavidyabhyam bhinno vidyamayo hi yah katham vishayi bhavatiti |
    yo ha vai kamena kamankamayate sa kami bhavati | yo ha vai tvakamena kamankamayate so'kami bhavati
    | janmajarabhyam bhinnah sthanurayamacchedyo'yam yo'sau surye tishthati yo'sau goshu tishthati | yo'sau
    gopanpalayati | yo'sau sarveshu deveshu tishthati | yo'sau sarvairdevairgiyate | yo'sau sarveshu bhuteshvavishya
    bhutani vidadhati sa vo hi svami bhavati | sa hovaca gandharvi | katham vasmasu jato gopalah katham
    va jnato'sau tvaya mune krishnah | ko vasya mantrah kim sthanam | katham va devakya jatah | ko vasya
    jayagramo bhavati | kidrishi pujasya gopalasya bhavati | sakshatprakriti paro'yamatma gopalah katham
    tvavatirno bhumyam hi vai sa gandharvi munimuvaca | sa hovaca tam hi vai purvam narayano yasmimlloka
    otashca protashca tasya hritpadmajato'bjayonistapastapastaptva tasmai ha varam dadau | sa kamaprashnameva
    vavre | tam hasmai dadau | sa hovacabjayonih yo vavataranam madhye shreshtho'vatarah ko bhavati |
    yena lokastushta bhavanti | yam smritva mukta asmatsamsaradbhavanti | katham vasyavatarasya brahmata
    bhavati | sa hovaca tam hi vai narayano devah | sakamya meroh shringe yatha saptapuryo bhavanti tatha
    nishkamyah sakamya bhugopalacakre saptapuryo bhavanti | tasam madhye sakshadbrahma gopalapuri bhavati
    | sakamya nishkamya devanam sarvesham bhutanam bhavati | athasya bhajanam bhavati | yatha hi vai sarasi
    padmam tishthati tatha bhumyam tishthati | cakrena rakshita mathura | tasmadgopalapuri bhavati brihadbrihadvanam
    madhormadhuvanam talastalavanam kamyam kamyavanam bahula bahulavanam kumudah kumudavanam khadirah
    khadiravanam bhadro bhadravanam bhandira iti bhandiravanam shrivanam lohavanam vrindavanametairavrita
    puri bhavati | tatra teshveva gaganeshvevam deva manushya gandharva nagah kimnara gayanti nrityantiti
    | tatra dvadashaditya ekadasha rudra ashtau vasavah sapta munayo brahma naradashca panca vinayaka
    vireshvaro rudreshvaro'mbikeshvaro ganeshvaro nilakantheshvaro vishveshvaro gopaleshvaro bhadreshvara
    ityashtavanyani lingani caturvimshatirbhavanti | dve vane stah krishnavanam bhadravanam | tayorantardvadasha
    vanani punyani punyatamani | teshveva devastishthanti | siddhah siddhim praptah | tatra hi ramasya
    ramamurtih pradyumnasya pradyumnamurtiraniruddhasya aniruddhamurtih krishnasya krishnamurtih | vaneshvevam
    mathurasvevam dvadasha murtayo bhavanti | ekam hi rudra yajanti | dvitiyam hi brahma yajati | tritiyam
    brahmaja yajanti | caturthim maruto yajanti | pancamim vinayaka yajanti | shashthim ca vasavo yajanti
    | saptamimrishayo yajanti | navamimapsaraso yajanti | dashami vai hyantardhane tishthati | ekadashiti
    svapadanuga | dvadashiti bhumyam tishthati | tam hi ye yajanti te mrityum taranti | muktim labhante
    | garbhajanmajaramaranatapatrayatmakaduhkham taranti | tadapyete shloka bhavanti | samprapya mathura
    ramyam sada brahmadivanditam | shankhacakragadasharngarakshitam musaladibhih || 1|| yatrasau samsthitah
    krishnah stribhih shaktya samahitah | ramaniruddhapradyumnai rukminya sahito vibhuh || 2||
  devanagari: ॐ एकदा हि व्रजस्त्रियः सकामाः शर्वरीमुषित्वा सर्वेश्वरं गोपालं कृष्णमूचिरे । उवाच ताः कृष्ण
    अमुकस्मै ब्राह्मणाय भैक्श्यं दातव्यमिति दुर्वासस इति । कथं यास्यामो जलं तीर्त्वा यमुनायाः । यतः श्रेयो
    भवति कृष्णेति ब्रह्मचारीत्युक्त्वा मार्गं वो दास्यति । यं मां स्मृत्वाऽगाधा गाधा भवति । यं मां स्मृत्वाऽपूतः
    पूतो भवति । यं मां स्मृत्वाऽव्रती व्रती भवति । यं मां स्मृत्वा सकामो निष्कामो भवति । यं मां स्मृत्वाऽश्रोत्रियः
    श्रोत्रियो भवति । यं मां स्मृत्वाऽगाधतः स्पर्शरहितापि सर्वा सरिद्गाधा भवति । श्रुत्वा तद्वाक्यं हि
    वै रौद्रं स्मृत्वा तद्वाक्येन तीर्त्वा तत्सौर्यां हि वै गत्वाश्रमं पुण्यतमं हि वै नत्वा मुनिं श्रेष्ठतमं
    हि वै रौद्रं चेति । दत्त्वास्मै ब्राह्मणाय क्शीरमयं घृतमयमिष्टतमं हि वै मृष्टतमं हि तुष्टः स्नात्वा
    भुक्त्वा हित्वशिषं प्रयुज्यान्नं ज्ञात्वादात् । कथं यास्यामो तीर्त्वा सौर्याम् । स होवाच मुनिर्दुर्वासनं
    मां स्मृत्वा वो दास्यतीति मार्गम् । तासां मध्ये हि श्रेष्ठा गान्धर्वी ह्युवाच तं तं हि वै तामिः ।
    एवं कथं कृष्णो ब्रह्मचारी । कथं दुर्वासनो मुनिः । तां हि मुख्यां विधाय पूर्वमनुकृत्वा तूष्णीमासुः
    । शब्दवानाकाशः शब्दाकाशाभ्यां भिन्नः । तस्मिन्नाकाशस्तिष्ठति । आकाशे तिष्ठति स ह्याकाशस्तं न वेद ।
    स ह्यात्मा । अहं कथं भोक्ता भवामि । रूपवदिदं तेजो रूपाग्निभ्यां भिन्नम् । तस्मिन्नग्निस्तिष्ठति ।
    अग्नौ तिष्ठति अग्निस्तं न वेद । स ह्यात्मा । अहं कथं भोक्ता भवामि । रसवत्य आपो रसाद्भ्यां भिन्नाः
    । तास्वापस्तिष्ठन्ति । अप्सु भूमिर्गन्धभूमिभ्यां भिन्ना । तस्यां भूमिस्तिष्ठति । भूमौ तिष्ठति । भूमिस्तं
    न वेद । स ह्यात्मा । अहं कथं भोक्ता भवामि । इदं हि मनसैवेदं मनुते । तानिदं हि गृह्णाति । यत्र सर्वमात्मैवाभूत्तत्र
    कुत्र वा मनुते । कथं वा गच्च्हतीति । स ह्यात्मा । अहं कथं भोक्ता भवामि । अयं हि कृष्णो यो हि प्रेष्ठः
    शरीरद्वयकारणं भवति । द्वा सुपर्णा भवतो ब्रह्मणोऽहं संभूतस्तथेतरो भोक्ता भवति । अन्यो हि साक्शी भवतीति
    । वृक्शधर्मे तौ तिष्ठतः । अतू भोक्तभोक्तारौ । पूर्वो हि भोक्ता भवति । तथेतरोऽभोक्ता कृष्णो भवतीति
    । यत्र विद्याविद्ये न विदाम । विद्याविद्याभ्यां भिन्नो विद्यामयो हि यः कथं विषयी भवतीति । यो ह वै
    कामेन कामान्कामयते स कामी भवति । यो ह वै त्वकामेन कामान्कामयते सोऽकामी भवति । जन्मजराभ्यां भिन्नः
    स्थाणुरयमच्च्हेद्योऽयं योऽसौ सूर्ये तिष्ठति योऽसौ गोषु तिष्ठति । योऽसौ गोपान्पालयति । योऽसौ सर्वेषु
    देवेषु तिष्ठति । योऽसौ सर्वैर्देवैर्गीयते । योऽसौ सर्वेषु भूतेष्वाविश्य भूतानि विदधाति स वो हि स्वामी
    भवति । सा होवाच गान्धर्वी । कथं वास्मासु जातो गोपालः कथं वा ज्ञातोऽसौ त्वया मुने कृष्णः । को वास्य
    मन्त्रः किं स्थानम् । कथं वा देवक्या जातः । को वास्य जायाग्रामो भवति । कीदृशी पूजास्य गोपालस्य भवति
    । साक्शात्प्रकृति परोऽयमात्मा गोपालः कथं त्ववतीर्णो भूम्यां हि वै सा गान्धर्वी मुनिमुवाच । स होवाच
    तां हि वै पूर्वं नारायणो यस्मिंल्लोका ओताश्च प्रोताश्च तस्य हृत्पद्माजातोऽब्जयोनिस्तपस्तपस्तप्त्वा
    तस्मै ह वरं ददौ । स कामप्रश्नमेव वव्रे । तं हास्मै ददौ । स होवाचाब्जयोनिः यो वावताराणां मध्ये श्रेष्ठोऽवतारः
    को भवति । येन लोकास्तुष्टा भवन्ति । यं स्मृत्वा मुक्ता अस्मात्संसाराद्भवन्ति । कथं वास्यावतारस्य ब्रह्मता
    भवति । स होवाच तं हि वै नारायणो देवः । सकाम्या मेरोः शृङ्गे यथा सप्तपुर्यो भवन्ति तथा निष्काम्याः
    सकाम्या भूगोपालचक्रे सप्तपुर्यो भवन्ति । तासां मध्ये साक्शाद्ब्रह्म गोपालपुरी भवति । सकाम्या निष्काम्या
    देवानां सर्वेषां भूतानां भवति । अथास्य भजनं भवति । यथा हि वै सरसि पद्मं तिष्ठति तथा भूम्यां तिष्ठति
    । चक्रेण रक्शिता मथुरा । तस्माद्गोपालपुरी भवति बृहद्बृहद्वनं मधोर्मधुवनं तालस्तालवनं काम्यं काम्यवनं
    बहुला बहुलवनं कुमुदः कुमुदवनं खदिरः खदिरवनं भद्रो भद्रवनं भाण्डीर इति भाण्डीरवनं श्रीवनं लोहवनं वृन्दावनमेतैरावृता
    पुरी भवति । तत्र तेष्वेव गगनेश्वेवं देवा मनुष्या गन्धर्वा नागाः किंनरा गायन्ति नृत्यन्तीति । तत्र
    द्वादशादित्या एकादश रुद्रा अष्टौ वसवः सप्त मुनयो ब्रह्मा नारदश्च पञ्च विनायका वीरेश्वरो रुद्रेश्वरोऽम्बिकेश्वरो
    गणेश्वरो नीलकण्ठेश्वरो विश्वेश्वरो गोपालेश्वरो भद्रेश्वर इत्यष्टावन्यानि लिङ्गानि चतुर्विंशतिर्भवन्ति
    । द्वे वने स्तः कृष्णवनं भद्रवनम् । तयोरन्तर्द्वादश वनानि पुण्यानि पुण्यतमानि । तेश्वेव देवास्तिष्ठन्ति
    । सिद्धाः सिद्धिं प्राप्ताः । तत्र हि रामस्य राममूर्तिः प्रद्युम्नस्य प्रद्युम्नमूर्तिरनिरुद्धस्य
    अनिरुद्धमूर्तिः कृष्णस्य कृष्णमूर्तिः । वनेश्वेवं मथुरास्वेवं द्वादश मूर्तयो भवन्ति । एकां हि रुद्रा
    यजन्ति । द्वितीयां हि ब्रह्मा यजति । तृतीयां ब्रह्मजा यजन्ति । चतुर्थीं मरुतो यजन्ति । पञ्चमीं विनायका
    यजन्ति । षष्ठीं च वसवो यजन्ति । सप्तमीमृषयो यजन्ति । नवमीमप्सरसो यजन्ति । दशमी वै ह्यन्तर्धाने तिष्ठति
    । एकादशीति स्वपदानुगा । द्वादशीति भूम्यां तिष्ठति । तां हि ये यजन्ति ते मृत्युं तरन्ति । मुक्तिं लभन्ते
    । गर्भजन्मजरामरणतापत्रयात्मकदुःखं तरन्ति । तदप्येते श्लोका भवन्ति । संप्राप्य मथुरा रम्यां सदा ब्रह्मादिवन्दिताम्
    । शङ्खचक्रगदाशार्ङ्गरक्शितां मुसलादिभिः ॥ १॥ यत्रासौ संस्थितः कृष्णः स्त्रीभिः शक्त्या समाहितः । रमानिरुद्धप्रद्युम्नै
    रुक्मिण्या सहितो विभुः ॥ २॥
