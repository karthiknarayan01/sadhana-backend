id: lakshmisahasranamastotraskanda
category: sahasranama
name:
  english: lakshmisahasranamastotraskanda
  devanagari: लक्ष्मीसहस्रनामस्तोत्रस्कन्द
content:
  english: pancabanaprabodhini banashrenissahasrakshi sahasrabhujapaduka | sandhyavalistrisandhyakhya
    brahmandamanibhushana || 48|| vasavi varunisena kulika mantraranjani | jitapranasvarupa ca kanta kamyavaraprada
    || 49|| mantrabrahmanavidyartha nadarupa havishmati | atharvani shrutishunya kalpanavarjita sati ||
    50|| sattajatih prama'meya'pramitih pranada gatih | avarna pancavarna ca sarvada bhuvaneshvari ||
    51|| trailokyamohini vidya sarvabhartri kshara'kshara | hiranyavarna harini sarvopadravanashini ||
    52|| kaivalyapadavirekha suryamandalasamsthita | somamandalamadhyastha vahnimandalasamsthita || 53||
    vayumandalamadhyastha vyomamandalasamsthita | cakrika cakramadhyastha cakramargapravartini || 54||
    kokilakulacakresha pakshatih pamktipavani | sarvasiddhantamargastha shadvarnavaravarjita || 55|| shararudrahara
    hantri sarvasamharakarini | purusha paurushi tushtissarvatantraprasutika || 56|| ardhanarishvari devi
    sarvavidyapradayini | bhargavi yajushividya sarvopanishadasthita || 57|| vyomakeshakhilaprana pancakoshavilakshana
    | pancakoshatmika pratyakpancabrahmatmika shiva || 58|| jagajjarajanitri ca pancakarmaprasutika |
    vagdevyabharanakara sarvakamyasthitasthitih || 59|| ashtadashacatushshashthipithika vidyaya yuta |
    kalikakarshanashyama yakshini kinnareshvari || 60|| ketaki mallikashoka varahi dharani dhruva | narasimhi
    mahograsya bhaktanamartinashini || 61|| antarbala sthira lakshmirjaramarananashini | shriranjita mahakaya
    somasuryagnilocana || 62|| aditirdevamata ca ashtaputra'shtayogini | ashtaprakritirashtashtavibhrajadvikritakritih
    || 63|| durbhikshadhvamsini devi sita satya ca rukmini | khyatija bhargavi devi devayonistapasvini
    || 64|| shakambhari mahashona garudoparisamsthita | simhaga vyaghraga devi vayuga ca mahadriga ||
    65|| akaradikshakaranta sarvavidyadhidevata | mantravyakhyananipuna jyotishshastraikalocana || 66||
    idapingalikamadhyasushumna granthibhedini | kalacakrashrayopeta kalacakrasvarupini || 67|| vaisharadi
    matishshreshtha varishtha sarvadipika | vainayaki vararoha shronivela bahirvalih || 68|| jambhini
    jrimbhini jrimbhakarini ganakarika | sharani cakrika'nanta sarvavyadhicikitsaki || 69|| devaki devasankasha
    varidhih karunakara | sharvari sarvasampanna sarvapapaprabhanjini || 70|| ekamatra dvimatra ca trimatra
    ca tathapara | ardhamatra para sukshma sukshmartha'rthapara'para || 71|| ekavira visheshakhya shashthidevi
    manasvini | naishkarmya nishkalaloka jnanakarmadhika guna || 72|| sabandhvanandasandoha vyomakara'nirupita
    | gadyapadyatmika vani sarvalankarasamyuta || 73|| sadhubandhapadanyasa sarvauko ghatikavalih | shatkarma
    karkashakara sarvakarmavivarjita || 74|| adityavarna caparna kamini vararupini | brahmani brahmasantana
    vedavagishvari shiva || 75|| purananyayamimamsadharmashastragamashruta | sadyovedavati sarva hamsi
    vidyadhidevata || 76|| vishveshvari jagaddhatri vishvanirmanakarini | vaidiki vedarupa ca kalika kalarupini
    || 77|| narayani mahadevi sarvatattvapravartini | hiranyavarnarupa ca hiranyapadasambhava || 78||
    kaivalyapadavi punya kaivalyajnanalakshita | brahmasampattirupa ca brahmasampattikarini || 79|| varuni
    varunaradhya sarvakarmapravartini | ekaksharapara''yukta sarvadaridryabhanjini || 80|| pashamkushanvita
    divya vinavyakhyakshasutrabhrit | ekamurtistrayimurtirmadhukaitabhabhanjini || 81|| samkhya samkhyavati
    jvala jvalanti kamarupini | jagranti sarvasampattissushuptanveshtadayini || 82||
  devanagari: पञ्चबाणप्रबोधिनी बाणश्रेणिस्सहस्राक्षी सहस्रभुजपादुका । सन्ध्यावलिस्त्रिसन्ध्याख्या ब्रह्माण्डमणिभूषणा
    ॥ ४८॥ वासवी वारुणीसेना कुलिका मन्त्ररञ्जनी । जितप्राणस्वरूपा च कान्ता काम्यवरप्रदा ॥ ४९॥ मन्त्रब्राह्मणविद्यार्था
    नादरूपा हविष्मती । आथर्वणी श्रुतिशून्या कल्पनावर्जिता सती ॥ ५०॥ सत्ताजातिः प्रमाऽमेयाऽप्रमितिः प्राणदा
    गतिः । अवर्णा पञ्चवर्णा च सर्वदा भुवनेश्वरी ॥ ५१॥ त्रैलोक्यमोहिनी विद्या सर्वभर्त्री क्षराऽक्षरा ।
    हिरण्यवर्णा हरिणी सर्वोपद्रवनाशिनी ॥ ५२॥ कैवल्यपदवीरेखा सूर्यमण्डलसंस्थिता । सोममण्डलमध्यस्था वह्निमण्डलसंस्थिता
    ॥ ५३॥ वायुमण्डलमध्यस्था व्योममण्डलसंस्थिता । चक्रिका चक्रमध्यस्था चक्रमार्गप्रवर्तिनी ॥ ५४॥ कोकिलाकुलचक्रेशा
    पक्षतिः पंक्तिपावनी । सर्वसिद्धान्तमार्गस्था षड्वर्णावरवर्जिता ॥ ५५॥ शररुद्रहरा हन्त्री सर्वसंहारकारिणी
    । पुरुषा पौरुषी तुष्टिस्सर्वतन्त्रप्रसूतिका ॥ ५६॥ अर्धनारीश्वरी देवी सर्वविद्याप्रदायिनी । भार्गवी
    याजुषीविद्या सर्वोपनिषदास्थिता ॥ ५७॥ व्योमकेशाखिलप्राणा पञ्चकोशविलक्षणा । पञ्चकोशात्मिका प्रत्यक्पञ्चब्रह्मात्मिका
    शिवा ॥ ५८॥ जगज्जराजनित्री च पञ्चकर्मप्रसूतिका । वाग्देव्याभरणाकारा सर्वकाम्यस्थितस्थितिः ॥ ५९॥ अष्टादशचतुष्षष्ठिपीठिका
    विद्यया युता । कालिकाकर्षणश्यामा यक्षिणी किन्नरेश्वरी ॥ ६०॥ केतकी मल्लिकाशोका वाराही धरणी ध्रुवा ।
    नारसिंही महोग्रास्या भक्तानामार्तिनाशिनी ॥ ६१॥ अन्तर्बला स्थिरा लक्ष्मीर्जरामरणनाशिनी । श्रीरञ्जिता
    महाकाया सोमसूर्याग्निलोचना ॥ ६२॥ अदितिर्देवमाता च अष्टपुत्राऽष्टयोगिनी । अष्टप्रकृतिरष्टाष्टविभ्राजद्विकृताकृतिः
    ॥ ६३॥ दुर्भिक्षध्वंसिनी देवी सीता सत्या च रुक्मिणी । ख्यातिजा भार्गवी देवी देवयोनिस्तपस्विनी ॥ ६४॥
    शाकम्भरी महाशोणा गरुडोपरिसंस्थिता । सिंहगा व्याघ्रगा देवी वायुगा च महाद्रिगा ॥ ६५॥ अकारादिक्षकारान्ता
    सर्वविद्याधिदेवता । मन्त्रव्याख्याननिपुणा ज्योतिश्शास्त्रैकलोचना ॥ ६६॥ इडापिङ्गलिकामध्यासुषुम्ना ग्रन्थिभेदिनी
    । कालचक्राश्रयोपेता कालचक्रस्वरूपिणी ॥ ६७॥ वैशारदी मतिश्श्रेष्ठा वरिष्ठा सर्वदीपिका । वैनायकी वरारोहा
    श्रोणिवेला बहिर्वलिः ॥ ६८॥ जम्भिनी जृम्भिणी जृम्भकारिणी गणकारिका । शरणी चक्रिकाऽनन्ता सर्वव्याधिचिकित्सकी
    ॥ ६९॥ देवकी देवसङ्काशा वारिधिः करुणाकरा । शर्वरी सर्वसम्पन्ना सर्वपापप्रभञ्जिनी ॥ ७०॥ एकमात्रा द्विमात्रा
    च त्रिमात्रा च तथापरा । अर्धमात्रा परा सूक्ष्मा सूक्ष्मार्थाऽर्थपराऽपरा ॥ ७१॥ एकवीरा विशेषाख्या षष्ठीदेवी
    मनस्विनी । नैष्कर्म्या निष्कलालोका ज्ञानकर्माधिका गुणा ॥ ७२॥ सबन्ध्वानन्दसन्दोहा व्योमाकाराऽनिरूपिता
    । गद्यपद्यात्मिका वाणी सर्वालङ्कारसंयुता ॥ ७३॥ साधुबन्धपदन्यासा सर्वौको घटिकावलिः । षट्कर्मा कर्कशाकारा
    सर्वकर्मविवर्जिता ॥ ७४॥ आदित्यवर्णा चापर्णा कामिनी वररूपिणी । ब्रह्माणी ब्रह्मसन्ताना वेदवागीश्वरी
    शिवा ॥ ७५॥ पुराणन्यायमीमांसाधर्मशास्त्रागमश्रुता । सद्योवेदवती सर्वा हंसी विद्याधिदेवता ॥ ७६॥ विश्वेश्वरी
    जगद्धात्री विश्वनिर्माणकारिणी । वैदिकी वेदरूपा च कालिका कालरूपिणी ॥ ७७॥ नारायणी महादेवी सर्वतत्त्वप्रवर्तिनी
    । हिरण्यवर्णरूपा च हिरण्यपदसम्भवा ॥ ७८॥ कैवल्यपदवी पुण्या कैवल्यज्ञानलक्षिता । ब्रह्मसम्पत्तिरूपा
    च ब्रह्मसम्पत्तिकारिणी ॥ ७९॥ वारुणी वारुणाराध्या सर्वकर्मप्रवर्तिनी । एकाक्षरपराऽऽयुक्ता सर्वदारिद्र्यभञ्जिनी
    ॥ ८०॥ पाशांकुशान्विता दिव्या वीणाव्याख्याक्षसूत्रभृत् । एकमूर्तिस्त्रयीमूर्तिर्मधुकैटभभञ्जिनी ॥ ८१॥
    सांख्या सांख्यवती ज्वाला ज्वलन्ती कामरूपिणी । जाग्रन्ती सर्वसम्पत्तिस्सुषुप्तान्वेष्टदायिनी ॥ ८२॥
