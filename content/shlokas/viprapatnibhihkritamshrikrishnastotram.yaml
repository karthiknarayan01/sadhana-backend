id: viprapatnibhihkritamshrikrishnastotram
category: stotram
name:
  english: viprapatnibhihkritamshrikrishnastotram
  devanagari: विप्रपत्निभिःकृतंश्रीकृष्णस्तोत्रम्
content:
  english: viprapatnibhih kritam shrikrishnastotram viprapatnya ucuh | tvam brahma paramam dhama niriho
    nirahankritih | nirgunashca nirakarah sakarah sagunah svayam || 36|| sakshirupashca nirliptah paramatma
    nirakritih | prakritih purushastvam ca karanam ca tayoh param || 37|| srishtisthityantavishaye ye
    ca devastrayah smritah | te tvadamshah sarvabija brahmavishnumaheshvarah || 38|| yasya lomnam ca vivare
    cakhilam vishvamishvara | mahaviranmahavishnustvam tasya janako vibho || 39|| tejastvam capi tejasvi
    jnanam jnani ca tatparah | vede'nirvacaniyastvam kastvam stotumiheshvarah || 40|| mahadadisrishtisutram
    pancatanmatrameva ca | bijam tvam sarvashaktinam sarvashaktisvarupakah || 41|| sarvashaktishvarah
    sarvah sarvashaktyashrayah sada | tvamanihah svayanjyotih sarvanandah sanatanah || 42|| aho'pyakarahinastvam
    sarvavigrahavanapi | sarvendriyanam vishayam janasi nendriyi bhavan || 43|| sarasvati jadibhuta yatstotre
    yannirupane | jadibhuto maheshashca shesho dharmo vidhih svayam || 44|| parvati kamala radha savitri
    vedasurapi | vedashca jadatam yati ke va shakta vipashcitah || 49|| vayam kim stavanam kurmah striyah
    praneshvareshvara | prasanno bhava no deva dinabandho kripam kuru || 46|| iti petushca ta viprapatnyastaccaranambuje
    | abhayam pradadau tabhyah prasannavadanekshanah || 47|| viprapatnikritam stotram pujakale ca yah
    pathet | sa gatim viprapatninam labhate natra samshayah || 48|| iti shribrahmavaivartapurane shrikrishnajanmakhande
    purve ashtadashadhyayantargatam viprapatnibhih kritam shrikrishnastotram samaptam | brahmavaivartapurana
    | shrikrishnajanma
  devanagari: विप्रपत्निभिः कृतं श्रीकृष्णस्तोत्रम् विप्रपत्न्य ऊचुः । त्वं ब्रह्म परमं धाम निरीहो निरहङ्कृतिः
    । निर्गुणश्च निराकारः साकारः सगुणः स्वयम् ॥ ३६॥ साक्षिरूपश्च निर्लिप्तः परमात्मा निराकृतिः । प्रकृतिः
    पुरुषस्त्वं च कारणं च तयोः परम् ॥ ३७॥ सृष्टिस्थित्यन्तविषये ये च देवास्त्रयः स्मृताः । ते त्वदंशाः
    सर्वबीजा ब्रह्मविष्णुमहेश्वराः ॥ ३८॥ यस्य लोम्नां च विवरे चाखिलं विश्वमीश्वर । महाविराण्महाविष्णुस्त्वं
    तस्य जनको विभो ॥ ३९॥ तेजस्त्वं चापि तेजस्वी ज्ञानं ज्ञानी च तत्परः । वेदेऽनिर्वचनीयस्त्वं कस्त्वां
    स्तोतुमिहेश्वरः ॥ ४०॥ महदादिसृष्टिसूत्रं पञ्चतन्मात्रमेव च । बीजं त्वं सर्वशक्तीनां सर्वशक्तिस्वरूपकः
    ॥ ४१॥ सर्वशक्तीश्वरः सर्वः सर्वशक्त्याश्रयः सदा । त्वमनीहः स्वयञ्ज्योतिः सर्वानन्दः सनातनः ॥ ४२॥ अहोऽप्याकारहीनस्त्वं
    सर्वविग्रहवानपि । सर्वेन्द्रियाणां विषयं जानासि नेन्द्रियी भवान् ॥ ४३॥ सरस्वती जडीभूता यत्स्तोत्रे
    यन्निरूपणे । जडीभूतो महेशश्च शेषो धर्मो विधिः स्वयम् ॥ ४४॥ पार्वती कमला राधा सावित्री वेदसूरपि । वेदश्च
    जडतां याति के वा शक्ता विपश्चितः ॥ ४९॥ वयं किं स्तवनं कुर्मः स्त्रियः प्राणेश्वरेश्वर । प्रसन्नो भव
    नो देव दीनबन्धो कृपां कुरु ॥ ४६॥ इति पेतुश्च ता विप्रपत्न्यस्तच्चरणाम्बुजे । अभयं प्रददौ ताभ्यः प्रसन्नवदनेक्षणः
    ॥ ४७॥ विप्रपत्नीकृतं स्तोत्रं पूजाकाले च यः पठेत् । स गतिं विप्रपत्नीनां लभते नात्र संशयः ॥ ४८॥ इति
    श्रीब्रह्मवैवर्तपुराणे श्रीकृष्णजन्मखण्डे पूर्वे अष्टादशाध्यायान्तर्गतं विप्रपत्निभिः कृतं श्रीकृष्णस्तोत्रं
    समाप्तम् । ब्रह्मवैवर्तपुराण । श्रीकृष्णजन्म
