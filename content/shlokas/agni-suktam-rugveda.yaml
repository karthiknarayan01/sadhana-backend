id: agni-suktam-rugveda
category: stotram
name:
  english: Agni Suktam (Rugveda)
content:
  english: agnimile purohitam ya~jnasya devamritvijam | hotaram ratnadhatamam || agnih purvebhir rishibhiridyo
    nutanairuta | sa deva|n eha vakshati || agnina rayimashnavatposhameva divedive | yashasam vi~shvatah
    paribhurasi | sa iddeveshu gacchati || ssatyashcitrashravastamah | devo devebhira gamat || yadanga
    dashushe tvamagne bhadra nkarishyasi | tavettatsatyamangirah || upa tvagne divedive doshavastardhiya
    vayam | namo bharanta emasi || ngopamritasya didivim | vardhamanam sve dame || sa nah piteva sunave
    'gne supayano bhava | sacasva na
  devanagari: अ॒ग्निमी॑ले पु॒रोहि॑तं यँ॒ज्ञस्य॑ दे॒वमृ॒त्विज॑म् । होता॑रं रत्न॒धात॑मम् ॥ अ॒ग्निः पूर्वे॑भि॒र्
    ऋषि॑भि॒रीड्यो॒ नूत॑नैरु॒त । स दे॒वा।ण् एह व॑क्षति ॥ अ॒ग्निना॑ र॒यिम॑श्नव॒त्पोष॑मे॒व दि॒वेदि॑वे । य॒शसं॑
    विँ॒श्वतः॑ परि॒भूरसि॑ । स इद्दे॒वेषु॑ गच्छति ॥ स्स॒त्यश्चि॒त्रश्र॑वस्तमः । दे॒वो दे॒वेभि॒रा ग॑मत्
    ॥ यद॒ङ्ग दा॒शुषे॒ त्वमग्ने॑ भ॒द्र ङ्क॑रि॒ष्यसि॑ । तवेत्तत्स॒त्यम॑ङ्गिरः ॥ उप॑ त्वाग्ने दि॒वेदि॑वे॒
    दोषा॑वस्तर्धि॒या व॒यम् । नमो॒ भर॑न्त॒ एम॑सि ॥ ङ्गो॒पामृ॒तस्य॒ दीदि॑विम् । वर्ध॑मानं॒ स्वे दमे॑ ॥ स
    नः॑ पि॒तेव॑ सू॒नवे ऽग्ने॑ सूपाय॒नो भ॑व । सच॑स्वा न
