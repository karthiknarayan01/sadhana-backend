id: sri-lalitha-stavaratnam-arya-dwishati
category: stotram
name:
  english: Sri Lalitha Stavaratnam (Arya Dwishati)
content:
  english: vande gajendravadanam vamankarudhavallabhashlishtam | kunkumaparagashonam kuvalayinijarakorakapidam
    || || sa jayati suvarnashailah sakalajagaccakrasanghatitamurtih | kancananikunjavati kandaladamariprapancasangitah
    || haritamanteshvavasthitam tasya | vinumah sanutritayam vidhiharigaurishavishtapadharam || ratnarucistabakaranjitadigantam
    | upari catuhshatayojana muttungam shringapungavamupase || parinaham devashilpina racitam | nanasalamanojnam
    namamyaham nagaramadividyayah || || prathamam sahasrapurvaka shatshatasankhyakayojanam paritah | valayikritasvagatram
    varanam sharanam vrajamyayorupam || yojanadure tarangitacchayah | ghatayatu mudam dvitiyo ghantastanasaranirmitah
    salah || nyuddamabhramararanjitodaram | upavanamupasmahe vaya murikritamandamarutasyandam || masinastatra
    harishilashyamam | manasi mahakalo me viharatu madhupanavibhramannetrah || stasyottarasimni vatayojanatah
    | tamrena racitamurti stanutamacandratarakam bhadram || || madhye tayoshca manimaya pallavashakhaprasunapakshmalitam
    | kalpanokahavatim kalaye makarandapankilavalam || tarunibhyam taraladrikcakorabhyam | alingito'vatanma
    manisham prathamarturattapushpastrah || || namata taduttarabhage nakipathollanghishringasanghatam
    | sisakritim turiyam sitakiranalokanirmalam salam || || saladvayantarale saralalikapotacatusubhagayam
    | santanavatikayam saktam ceto'stu satatamasmakam || || tatra tapanatirukshah samrajnicaranasandritasvantah
    | shukrashucishrisahito grishmarturdishatu kirtimakalpam || nnatashikharotkampihatakapatakah | prakatayatu
    pancamo nah prakarah kushalamarakutamayah || || prakarayoshca madhye pallavitanyabhritapancamonmesha
    | haricandanadruvati haratadamulamasmadanutapam || || tatra nabhah shrimukhyai starunivargaih samanvitah
    paritah | vajrattahasamukharo vanchapurtim tanotu varshartuh || || marutayojanadure mahaniyastasya
    cottare bhage | bhadram krishishta shashthah prakarah pancalohadhatumayah || mankuraddivyakusumagandhayam
    | mandaravatikayam manasamangikarotu me vihritim || || tasyamishorjalakshmi tarunibhyam sharadrituh
    sada sahitah | abhyarcayan sa jiya dambamamodameduraih kusumaih || || tasyarshisankhyayojana dure
    dedipyamanashringaughah | kaladhautakalitamurtih kalyanam dishatu saptamah salah || || madhye tayormarutpatha
    langhitavitapagravirutakalakantha | shriparijatavati shriyamanisham dishatu shitaloddesha || || tasyamatipriyabhyam
    saha khelan sahasahasyalakshmibhyam | samanto jhashaketo rhemanto bhavatu hemavriddhyai nah || nudbhatahutabhukshikharunamayukhah
    | tapaniyakhandaracita stanutadayushyamashtamo varanah || manayormadhyabhuvi kalpitavasam | kalayami
    sunakoraka kandalitamodatundilasamiram || || tasyamatishishirakriti rasinastapatapasyalakshmibhyam
    | shivamanisham kurutanme shishirartuh satatashitaladigantah || || tasyam kadambavatyam tatprasavamodamilitamadhugandham
    | saptavaranamanojnam sharanam samupaimi mantrinisharanam || || tatralaye vishale tapaniyaracitataralasopane
    | manikyamandapanta rmahite simhasane sumanikhacite || dvipanripavasuvedadalakurekhadhye | cakre sada
    nivishtam shashthyashtatrimshadakshareshanim || || tapinchamecakabham talidalaghatitakarnatatankam
    | tambulapuritamukhim tamradharabimbadrishtadarahasam || || kunkumapankiladeham kuvalayajivatushavakavatamsam
    | kokanadashonacaranam kokilanikvanakomalalapam || || vamangagalitaculim vanamalyakadambamalikabharanam
    | muktalalantikancita mugdhalikamilitacitrakodaram || kalaninadavyaktanikhilanigamartham | vamakucasangivinavadana
    saukhyardhamilitakshiyugam || madirasonmeshavasitakataksham | amnayasaragulika madyam sangitamatrikam
    vande || syottaratastarunakunkumacchayah | shamayatu mama santapam salo navamah sa pushparagamayah
    || || anayorantaravasudhah pranumah pratyagrapushparagamayih | simhasaneshvarimanu cintananistandrasiddhanirandhrah
    || || tatsalottaradeshe tarunajapakiranadhoranishonah | prashamayatu padmaraga prakaro mama parabhavam
    dashamah || nanayorapanitacittavaimatyan | cakreshipadabhaktam shcaranavarganaharnisham kalaye ||
    'sanghatitaketanastasya | gomedakena racito gopayatu mam samunnatah salah || || vapradvayantarorvyam
    vatukairvividhaishca yoginibrindaih | satatam samarcitayah sankarshanyah pranaumi caranabjam || ||
    tapasayojanadure tasya samuttunga gopuropetah | vanchapurtyai bhavata dvajramaninikaranirmito vaprah
    || || varanadvitayantarato vasajusho vihitamadhurasasvadah | rambhadivibudhaveshya racayantu mahantamasmadanandam
    || || tatra sada pravahanti tatini vajrabhidha ciram jiyat | catulormijalanritya tkalahamsikulakalakvanitapushta
    || || rodhasi tasya rucire vajreshi jayati vajrabhushadhya | vajrapradanatoshita vajrimukhatridashavinutacaritra
    || || tasyodicyam hariti stavakitasushamavalidhaviyadantah | vaiduryaratnaracito vaimalyam dishatu
    cetaso varanah || rambacaranavalambitasvantan | karkotakadinagan kalayamah kim ca balimukhan danujan
    || dure gaganordhvajanghikastasya | vasavamanipranito varano bahalayatu vaidushim vishadam || rmahendranilatmakani
    ca saramsi | shatodarisahaya nbhupalanapi punah punah pranumah || || ashugayojanadure tasyordhvam
    kantidhavalitadigantah | muktaviracitagatro muhurasmakam mude bhavatu salah || || avrittyoradhimadhyam
    purvasyam dishi purandarah shriman | abhramuvitadhirudho vibhramamasmakamanishamatanutat || ktomarapatrasruvannashaktidharah
    | svahasvadhasametah sukhayatu mam havyavahanah suciram || || dakshinadigantarale dandadharo nilaniradacchayah
    | tripurapadabjabhaktastirayatu mama nikhilamamhasam nikaram || || tasyaiva pashcimayam dishi dalitendivaraprabhashyamah
    | khetasiyashtidhari khedanapanayatu yatudhano me || || tasya uttaradeshe dhavalango vipulajhashavararudhah
    | pashayudhattapanih pashi vidalayatu pashajalani || tkone vayum camuruvaravaham | korakitatattvabodha
    ngorakshapramukhayogino'pi muhuh || stisro vatasya tasya kritavasah | pratyagrakapishayana panaparibhrantalocanah
    kalaye || || tallokapurvabhage dhanadam dhyayami shevadhikulesham | api manibhadramukhya nambacaranavalambino
    yakshan || || tasyaiva purvasimani tapaniyaracitagopure nagare | katyayanisahayam kalaye shitamshukhandacudalam
    || sthalabhajastarunacandracudalan | rudradhyaye pathita nrudranisahacaranbhaje rudran || dure balatrinmecakastasya
    | salo marakataracitah sampadamacalam shriyam ca pushnatu || || avritiyugmantarato haritamaninivahamecake
    deshe | hatakatalivipinam halaghataghatitavitapamakalaye || || tatraiva mantrinigriha parinaham taralaketanam
    sadanam | marakatasaudhamanojnam dadyadayumshi dandanathayah || || sadane tatra harinmani sanghatite
    mandape shatastambhe | kartasvaramayapithe kanakamayamburuhakarnikamadhye || || bindutrikonavartula
    shadasravrittadvayanvite cakre | sancarini dashottara shatarnamanurajakamalakalahamsi || nayana kokarimanditashikhanda
    | santaptakancanabha sandhyarunacelasamvritanitamba || 'nkushapashabhayavarasphuritahasta | kulankashanukampa
    kunkumajambalitastanabhoga || vartasheshavalagnakamaniya | artalishubhadatri vartali bhavatu vanchitarthaya
    || || tasyah parito devih svapneshyunmattabhairavimukhyah | pranamata jambhinyadyah bhairavavargamshca
    hetukapramukhan || || purvoktasankhyayojana dure puyamshupatalastasya | vidravayatu madartim vidrumasalo
    vishankatadvarah || mantarabhumauprakashashalinyam | asinamambujasana mabhinavasinduragauramahamide
    || yojanato vipulagopuradvarah | salo nanaratnaih sanghatitangah krishishta madabhishtam || raviralashobhapicandiloddesham
    | manikyamandapakhyam mahatimadhihridayamanishamakalaye || || tatra sthitam prasannam tarunatamalapravalakiranabham
    | karnavalambikundala kandalitabhishukavacitakapolam || menankavadanamedhamanakripam | mugdhainamadavisheshaka
    mudritanitilendurekhikaruciram || nayanancalaghatitamanasijakutam | kamalakathinapayodhara kasturighusrinapankiloraskam
    || || campeyagandhikaishyam shampasabrahmacarikausheyam | shrivatsakaustubhadharam shritajanarakshadhurinacaranabjam
    || tkarapadmam kanthalolavanamalam | mucukundamokshaphaladam mukundamanandakandamavalambe || || tadvaranottarabhage
    tarapatibimbacumbinijashringah | vividhamaniganaghatito vitaratu salo vinirmalam dhishanam || || prakaradvitayantara
    kakshyam prithuratnanikarasankirnam | namata sahasrastambhaka mandapanamnativishrutam bhuvane || ||
    pranumastatra bhavani sahacaramishanamindukhandadharam | shringaranayikamanu shilanabhajo'pi bhringinandimukhan
    || dure vande manomayam vapram | ankuranmanikirana mantarakakshyam ca nirmalamanayoh || || tatraivamritavapim
    taralatarangavalidhatatayugmam | muktamayakalahamsi mudritakanakaravindasandoham || sangitonmeshaghoshitadigantam
    | kancanamayangavilasa tkarandavashandatandavamanojnam || || kuruvindatmakahallaka korakasushamasamuhapatalitam
    | kalaye sudhasvarupam kandalitamandakairavamodam || || tadvapikantarale tarale manipotasimni viharantim
    | sindurapatalangim sitakiranankurakalpitavatamsam || || parvendubimbavadanam pallavashonadharasphuritahasam
    | kutilakabarim kurangi shishunayanam kundalasphuritagandam || || nikatasthapotanilayah shaktih shayavidhritahemashringajalaih
    | parishincantim parita staram tarunyagarvitam vande || || praguktasankhyayojanadure pranamami buddhimayasalam
    | anayorantarakakshya mashtapadapushtamedinim ruciram || || kadambarinidhanam kalayamyanandavapikam
    tasyam | shonashmanivahanirmita sopanashrenishobhamanatatim || || manikyataraninilayam madhye tasya
    madarunakapolam | amriteshityabhidhana mantah kalayami varunim devim || hastah saundaryagarvita devyah
    | tatpuratah sthitibhajo vitarantvasmakamayusho vriddhim || dure'hankarasalamatitungam | vande tayoshca
    madhye kakshyam valamanamalayapavamanam || || vinumo vimarshavapim saushumnasudhasvarupinim tatra
    | velatilanghyavici kolahalabharitakulavanavatim || || tatraiva salilamadhye tapinchadalaprapancasushamabham
    | shyamalakancukalasitam shyamavitabimbadambaraharasyam || hasitayugmasharakarmukavilasam | mandasmitancitamukhim
    manimayatatankamanditakapolam || || kuruvindataraninilayam kulacalaspardhikucanamanmadhyam | kunkumaviliptagatrim
    kurukullam manasi kurmahe satatam || || tatsalottarabhage bhanumayam vapramashraye diptam | madhyam
    ca vipulamanayo rmanye vishrantamatapodgaram || || tatra kuruvindapithe tamarase kanakakarnikaghatite
    | asinamarunavasasa mamlanaprasavamalikabharanam || shakticchayasamaracitakelim | manikyamukutaramyam
    manye martandabhairavam hridaye || || indumayasalamide tasyottaratastusharagirigauram | atyantashishiramaruta
    manayormadhyam ca candrikodgaram || || tatra prakashamanam taranikaraih parishkritoddesham | amritamayakantikandala
    mantah kalayami kundasitamindum || || shringarasalamide shringollasitam taduttare bhage | madhyasthale
    tayorapi mahitam shringarapurvikam parikham || || tatra maninausthitabhi stapaniyaviracitagrahastabhih
    | shringaradevatabhih sahitam parikhadhipam bhaje madanam || || shringaravaranavaryasyottaratah sakalavibudhasamsevyam
    | cintamaniganaracitam cintam durikarotu me sadanam || madhyam dashatalabhumiruhadirghaih | parnaih
    suvarnavarnai ryuktam kandaishca yojanottungaih || manairmilitam ca kesarakadambaih | santatagalitamaranda
    srotoniryanmilindasandoham || dhatiniryatparagapinjaritam | kalahamsikulakalakala kulankashaninadanicayakamaniyam
    || || padmatavim bhajamah parimalakallolapakshmalopantam | devyarghyapatradhari tasyah purvadishi
    dashakalayuktah | nvahnih kroshonnatashciram payat || || tatradhare devyah patrirupah prabhakarah
    shriman | dvadashakalasameto dhvantam mama bahulamantaram bhindyat || || tasmin dineshapatre tarangitamodamamritamayamarghyam
    | candrakalatmakamamritam sandrikuryadamandamanandam || || amrite tasminnabhito viharantyo vividhamanitaranibhajah
    | shodasha kalah sudhamshoh shokaduttarayantu mamanisham || || tatraiva vihritibhajo dhatrimukhanam
    ca karaneshanam | srishtyadirupikastah shamayantvakhilah kalashca santapam || rajadiganteshu ratnagehasya
    | kalayami tanyajasram kalayantvayushyamarghyapatrani || || patrasthalasya puratah padmaramanavidhiparvatishanam
    | bhavanani sharmane no bhavantu bhasa pradipitajaganti || || sadanasyanalakone satatam pranamami
    kundamagneyam | tatra sthitam ca vahnim taralashikhajatilamambikajanakam || || tasyasuradishi tadrisha
    ratnaparisphuritaparvanavakadhyam | cakratmakam shatangam shatayojanamunnatam bhaje divyam || || tatraiva
    dishi nishannam tapaniyadhvajaparamparashlishtam | rathamaparam ca bhavanya racayamo manasi ratnamayacudam
    || || bhavanasya vayubhage parishkrito vividhavaijayantibhih | racayatu mudam rathendrah saciveshanyah
    samastavandyayah || || kurmo'dhihridayamanisham krodasyayah shatangamurdhanyam | rudradishi ratnadhamno
    rucirashalakaprapancakancukitam || || parito devidhamnah pranitavasa manusvarupinyah | kurvantu rashmimala
    kritayah kushalani devata nikhilah || || pragdvarasya bhavani dhamnah parshvadvayaracitavase | matangikitimukhyau
    manisadane manasi bhavayami ciram || || yojanayugalabhoga tatkroshaparinahayaiva bhittya ca | cintamanigrihabhumi
    rjiyadamnayamayacaturdvara || || dvare dvare dhamnah pindibhuta navinabimbabhah | vidadhatu vipulam
    kirtim divya lauhityasiddhyo devyah || || manisadanasyantarato mahaniye ratnavedikamadhye | bindumayacakramide
    pithanamupari viracitavasam || || cakranam sakalanam prathamamadhah simaphalakavastavyah | animadisiddhayo
    ma mavantu devi prabhasvarupinyah || syopariharinankakhandakritacudah | bhadram pakshmalayantu brahmipramukhashca
    mataro'smakam || || tasyopari maniphalake tarunyottungapinakucabharah | sankshobhinipradhanah bhranti
    vidravayantu dasha mudrah || || phalakatrayasvarupe prithule trailokyamohane cakre | divyantu prakatakhya
    stasam kartrim ca bhagavati tripura || || tadupari vipule dhishnye taraladrishastarunakokanadabhasah
    | kamakarshinyadyah kalaye devih kaladharashikhandah || || sarvashaparipurakacakre 'smin guptayoginisevyah
    | tripureshi mama duritam tudyat kanthavalambimanihara || || tasyopari manipithe tamrambhoruhadalaprabhashonah
    | dhyayamyanangakusuma pramukha devishca vidhritakurpasah || || sankshobhakarake'smim shcakre shritripurasundari
    sakshat | goptri guptatarakhyah gopayatu mam kripardraya drishtya || || sankshobhinipradhanah shaktistasyordhvavalayakritavasah
    | alolanilaveni rantah kalayami yauvanonmattah || || saubhagyadayake'smim shcakreshi tripuravasini
    jiyat | shaktishca sampradayabhidhah samastah pramodayantvanisham || || manipithopari tasam mahati
    caturhastavistrite valaye | santataviracitavasah shaktih kalayami sarvasiddhimukhah || || sarvarthasadhakakhye
    cakre'mushmin samastaphaladatri | tripura shrirmama kushalam dishataduttirnayoginisevya || || tasam
    nilayasyopari dhishnye kausumbhakancukamanojnah | sarvajnadyah devyah sakalah sampadayantu mama kirtim
    || karanamnyasmin samastajanasevyam | manasi nigarbhasahitam manye shritripuramalinim devim || ||
    sarvajnasadanasyopari cakre vipule samakalitagehah | vande vashinimukhyah shaktih sindurarenurucah
    || cakre'smimstripurapurvikam siddham | vande rahasyanamna vedyabhih shaktibhih sada sevyam || dvimshatihastonnate
    mahapithe | shamayantu shatrubrindam shastranyastrani cadidampatyoh || dvalaye valavairiratnasanghatite
    | kameshvaripradhanah kalaye devih samastajanavandyah || || cakre'tra sarvasiddhiprada namani sarvaphaladatri
    | tripurambavatu satatam parapararahasyayoginisevya || || kameshvarigrihoparivalaye vividhamanusampradayajnah
    | catvaro yuganatha jayantu mitreshapurvakah guravah || nnanaratnacayamedure pithe | kameshyadya nityah
    kalayantu mudam tithisvarupinyah || || nityasadanasyopari nirmalamaninivahaviracite dhishnye | kushalam
    shadangadevyah kalayantvasmakamuttaralanetrah || || sadanasyopari tasam sarvanandamayanamake bindau
    | pancabrahmakaram mancam pranamami maniganakirnam || || parito manimancasya pralambamana niyantrita
    pashaih | mayamayi javanika mama duritam haratu mecakacchaya || nmadanipunnagamalikabharitam | harigopamayavitanam
    haratadalasyamanishamasmakam || || paryankasya bhajamah padanbimbambudenduhemarucah | ajaharirudreshamaya
    nanalasuramaruteshakonasthan || || phalakam sadashivamayam pranaumi sindurarenukiranabham | arabhyangeshinam
    sadanatkalitam ca ratnasopanam || catushtayasphuritapatalastaranam | paryankopari ghatitam patu ciram
    hamsatulashayanam nah || || tasyopari nivasantam tarunyashrinishevitam satatam | avrintapullahallaka
    maricikapunjamanjulacchayam || || sindurashonavasanam shitamshustabakacumbitakiritam | kunkumatilakamanohara
    kutilalikahasitakumudabandhushishum || || purnendubimbavadanam phullasarojatalocanatritayam | taralapangatarangita
    shapharankanashastrasampradayartham || nmaricikallolamamsalakapolam | vidrumasahodaradhara visrimarasusmitakishorasancaram
    || manilabhrulatayugamanojnam | vitisaurabhavici dvigunitavaktraravindasaurabhyam || prasavasharasphuritakomalakarabjam
    | kashmirapankilangam kamesham manasi kurmahe satatam || || tasyankabhuvi nishannam tarunakadambaprasunakiranabham
    | shitamshukhandacudam simantanyastasandrasinduram || nnitilam kutilataracillikayugalam | nalikatulyanayanam
    nasancalanatitamauktikabharanam || marunadharakantivijitabimbabham | kasturimakariyuta kapolasankrantakanakatatankam
    || kabalitavadanaravindakamaniyam | kambusahodarakantha pralambamanacchamauktikakalapam || bhujayugalasphuritaratnakeyuram
    | karapadmamulavilasa tkancanamayakatakavalayasandoham || tpashankushapundracapapushpastram | kulankashakucashikharam
    kunkumakardamitaratnakurpasam || mambudashobhasanabhiromalatam | manikyakhacitakanci maricikakrantamamsalanitambam
    || || karabhorukandayugalam janghajitakamajaitratuniram | prapadaparibhutakurmam pallavasacchayapadayugamanojnam
    || kiritaratnamshuranjitapadabjam | unmastakanukampa muttaralapangaposhitanangam || manidam prathamoktivallarikalikam
    | abrahmakitajanani mantah kalayami sundarimanisham || || kastu kshitau patiya nvastu stotum shivankavastavyam
    | astu cirantanasukritaih prastutakamyaya tanmama purastat || || prabhusammitoktigamyam paramashivotsangatungaparyankam
    | tejah kincana divyam purato me bhavatu pundrakodandam || || madhurimabharitasharasam makarandasyandimarganodaram
    | kairavinivitacudam kaivalyayastu kincana maho nah || || akshudramikshucapam parokshamavalagnasimni
    tryaksham | kshapayatu me kshemetara muksharathapremapakshmalam tejah || || bhringarucisangarakarapangam
    shringaratungamarunangam | mangalamabhanguram me ghatayatu gangadharangasangi mahah || || prapadajitakurmamurjita
    karunam bharmarucinirmathanadeham | shritavarma marma shambhoh kincana mama narma sharma nirmatu ||
    kandalavijitali vidhritamanivali | milatu hridi pulinajaghanam bahulitagalagaralakeli kimapi mahah
    || || kunkumatilakitaphala kuruvindacchayapataladukula | karunapayodhivela kacana citte cakastu me
    lila || || pushpandhayarucivenyah pulinabhogatrapakarashrenyah | jiyasurikshupanyah kashcana kamarikelisakshinyah
    || || tapaniyamshukabhamsi drakshamadhuryanastikavacamsi | katicana shucam mahamsi kshapayatu kapalitoshitamanamsi
    || || asitakacamayataksham kusumasharam kulamudvahakripardram | adimarasadhidaivata mantah kalaye
    harankavasi mahah || katakshavispandikanthadaghnakripam | kameshvarankanilayam kamapi vidyam puratanim
    kalaye || || aravindakantyaruntuda vilocanadvandvasundaramukhendu | chandah kandalamandira mantahpuramaindushekharam
    vande || || bimbinikurambadambara vidambakacchayamambaravalagnam | kambugalamambudakucam bimbokam
    kamapi cumbatu mano me || || kamapi kamaniyarupam kalayamyantah kadambakusumadhyam | campakarucirasuveshaih
    sampaditakantyalankritadigantam || garhasampadakakantikavacitadigantam | siddhantam nigamanam shuddhantam
    kimapi shulinah kalaye || nutpalabandhustanandhayapidan | karakalitapundracapa nkalaye kanapi kapardinah
    pranan || || rashanalasajjaghanaya rasanajivatucapabhasuraya | ghranayushkarasharaya ghratam cittam
    kayapi vasanaya || || sarasijasahayudhvadrisha shampalatikasanabhivigrahaya | bhasa kayapi ceto nasamanishobhivadanaya
    bharitam || || navayavakabhasicayanvitaya gajayanaya dayaparaya | dhritayaminishakalaya dhiya kayapi
    kshatamaya hi vayam || rabimbashonairapundrakodandaih | akumudabandhavacudai ranyairiha jagati daivatam
    manyaih || || kuvalayasadrikshanayanaih kulagirikutasthabandhukucabharaih | karunaspandikatakshaih
    kavacitacitto'smi katipayaih kutukaih || || natajanasulabhaya namo nalikasanabhilocanaya namah | nanditagirishaya
    namo mahase navanipapatalaya namah || || kadambakusumadamne kayacchayakanayitaryamne | simne cirantanagiram
    bhumne kasmaicidadade pranatim || || kutilakabaribharebhyah kunkumasabrahmacarikiranebhyah | kulankashastanebhyah
    kurmah pranatim kuladrikutukebhyah || tkomalakuralalivijitashaivalat | utpalasagandhinayana durarikurmo
    na devatamanyam || manilasnigdhabarbarakacanam | amnayajivanana makutanam harasya daso'ham || sphuritasu
    purahitankanilayasu | magnam mano madiyam kasvapi kamarijivanadishu || || lalita patu shiro me lalatamamba
    ca madhumatirupa | bhruyugmam ca bhavani pushpashara patu locanadvandvam || || payannasam bala subhaga
    dantamshca sundari jihvam | adharoshthamadishakti shcakreshi patu me ciram cibukam || || kameshvari
    ca karnau kamakshi patu gandayoryugalam | shringaranayikavya dvadanam simhasaneshvari ca galam ||
    || skandaprasushca patu skandhau bahu ca patalangi me | pani ca padmanilaya payadanisham nakhavalirvijaya
    || || kodandini ca vakshah kukshim cavyat kulacalatanuja | kalyani ca valagnam katim ca payatkaladharashikhanda
    || duma mridani ca januni rakshet | janghe ca shodashi me payat padau ca pashasrinihasta || || pratah
    patu para mam madhyahne patu manigrihadhisha | sharvanyavatu ca sayam payadratrau ca bhairavi sakshat
    || || bharyam rakshatu gaurim payat putramshca bindugrihapitha | shrividya ca yasho me shilam cavyacciram
    maharajni || || pavanamayi pavakamayi kshonimayi gaganamayi kripitamayi | ravimayi shashimayi dinmayi
    samayamayi pranamayi shive pahi || || kali kapalini shulini bhairavi matangi pancami tripure | vagdevi
    vindhyavasini bale bhuvaneshi palaya ciram mam || mamba tvam cintayanti ye hridaye | upari nipatanti
    tesha mutpalanayanakatakshakallolah || rvashinimukhyabhiravritam bhavatim | cintayatam sitavarnam
    vaco niryantyayatnato vadanat || || kanakashalakagaurim karnavyalolakundaladvitayam | prahasitamukhim
    ca bhavatim dhyayanto ye ta eva bhudhanadah || || shirshambhoruhamadhye shitalapiyushavarshinim bhavatim
    | anudinamanucintayata mayushyam bhavati pushkalamavanyam || || madhurasmitam madarunanayanam matangakumbhavakshojam
    | candravatamsinim tvam savidhe pashyanti sukritinah kecit || || lalitayah stavaratnam lalitapadabhih
    pranitamaryabhih | pratidinamavanau pathatam phalani vaktum pragalbhate saiva || grihitamunivigraho
    bhagavan | sarvasamupanishadam durvasa jayati deshikah prathamah || || iti maharshidurvasah viracitam
    shrilalitastavaratnam |
  devanagari: वन्दे गजेन्द्रवदनं वामाङ्कारूढवल्लभाश्लिष्टम् । कुङ्कुमपरागशोणं कुवलयिनीजारकोरकापीडम् ॥
    ॥ स जयति सुवर्णशैलः सकलजगच्चक्रसङ्घटितमूर्तिः । काञ्चननिकुञ्जवाटी कन्दलदमरीप्रपञ्चसङ्गीतः ॥ हरितामन्तेष्ववस्थितं
    तस्य । विनुमः सानुत्रितयं विधिहरिगौरीशविष्टपाधारम् ॥ रत्नरुचिस्तबकरञ्जितदिगन्तम् । उपरि चतुःशतयोजन
    मुत्तुङ्गं शृङ्गपुङ्गवमुपासे ॥ परिणाहं देवशिल्पिना रचितम् । नानासालमनोज्ञं नमाम्यहं नगरमादिविद्यायाः
    ॥ ॥ प्रथमं सहस्रपूर्वक षट्शतसङ्ख्याकयोजनं परितः । वलयीकृतस्वगात्रं वरणं शरणं व्रजाम्ययोरूपम् ॥ योजनदूरे
    तरङ्गितच्छायः । घटयतु मुदं द्वितीयो घण्टास्तनसारनिर्मितः सालः ॥ न्युद्दामभ्रमररञ्जितोदारम् । उपवनमुपास्महे
    वय मूरीकृतमन्दमारुतस्यन्दम् ॥ मासीनस्तत्र हरिशिलाश्यामाम् । मनसि महाकालो मे विहरतु मधुपानविभ्रमन्नेत्रः
    ॥ स्तस्योत्तरसीम्नि वातयोजनतः । ताम्रेण रचितमूर्ति स्तनुतामाचन्द्रतारकं भद्रम् ॥ ॥ मध्ये तयोश्च मणिमय
    पल्लवशाखाप्रसूनपक्ष्मलिताम् । कल्पानोकहवाटीं कलये मकरन्दपङ्किलावालाम् ॥ तरुणीभ्यां तरलदृक्चकोराभ्याम्
    । आलिङ्गितोऽवतान्मा मनिशं प्रथमर्तुरात्तपुष्पास्त्रः ॥ ॥ नमत तदुत्तरभागे नाकिपथोल्लङ्घिशृङ्गसङ्घातम्
    । सीसाकृतिं तुरीयं सितकिरणालोकनिर्मलं सालम् ॥ ॥ सालद्वयान्तराले सरलालिकपोतचाटुसुभगायाम् । सन्तानवाटिकायां
    सक्तं चेतोऽस्तु सततमस्माकम् ॥ ॥ तत्र तपनातिरूक्षः साम्राज्ञीचरणसान्द्रितस्वान्तः । शुक्रशुचिश्रीसहितो
    ग्रीष्मर्तुर्दिशतु कीर्तिमाकल्पम् ॥ न्नतशिखरोत्कम्पिहाटकपताकः । प्रकटयतु पञ्चमो नः प्राकारः कुशलमारकूटमयः
    ॥ ॥ प्राकारयोश्च मध्ये पल्लवितान्यभृतपञ्चमोन्मेषा । हरिचन्दनद्रुवाटी हरतादामूलमस्मदनुतापम् ॥ ॥ तत्र
    नभः श्रीमुख्यै स्तरुणीवर्गैः समन्वितः परितः । वज्राट्टहासमुखरो वाञ्छापूर्तिं तनोतु वर्षर्तुः ॥ ॥ मारुतयोजनदूरे
    महनीयस्तस्य चोत्तरे भागे । भद्रं कृषीष्ट षष्ठः प्राकारः पञ्चलोहधातुमयः ॥ मङ्कूरद्दिव्यकुसुमगन्धायाम्
    । मन्दारवाटिकायां मानसमङ्गीकरोतु मे विहृतिम् ॥ ॥ तस्यामिषोर्जलक्ष्मी तरुणीभ्यां शरदृतुः सदा सहितः
    । अभ्यर्चयन् स जीया दम्बामामोदमेदुरैः कुसुमैः ॥ ॥ तस्यर्षिसङ्ख्ययोजन दूरे देदीप्यमानशृङ्गौघः । कलधौतकलितमूर्तिः
    कल्याणं दिशतु सप्तमः सालः ॥ ॥ मध्ये तयोर्मरुत्पथ लङ्घितविटपाग्रविरुतकलकण्ठा । श्रीपारिजातवाटी श्रियमनिशं
    दिशतु शीतलोद्देशा ॥ ॥ तस्यामतिप्रियाभ्यां सह खेलन् सहसहस्यलक्ष्मीभ्याम् । सामन्तो झषकेतो र्हेमन्तो
    भवतु हेमवृद्ध्यै नः ॥ नुद्भटहुतभुक्शिखारुणमयूखः । तपनीयखण्डरचित स्तनुतादायुष्यमष्टमो वरणः ॥ मनयोर्मध्यभुवि
    कल्पितावासाम् । कलयामि सूनकोरक कन्दलितामोदतुन्दिलसमीराम् ॥ ॥ तस्यामतिशिशिराकृति रासीनस्तपतपस्यलक्ष्मीभ्याम्
    । शिवमनिशं कुरुतान्मे शिशिरर्तुः सततशीतलदिगन्तः ॥ ॥ तस्यां कदम्बवाट्यां तत्प्रसवामोदमिलितमधुगन्धम्
    । सप्तावरणमनोज्ञं शरणं समुपैमि मन्त्रिणीशरणम् ॥ ॥ तत्रालये विशाले तपनीयारचिततरलसोपाने । माणिक्यमण्डपान्त
    र्महिते सिंहासने सुमणिखचिते ॥ द्विपनृपवसुवेददलकुरेखाढ्ये । चक्रे सदा निविष्टां षष्ठ्यष्टत्रिंशदक्षरेशानीम्
    ॥ ॥ तापिञ्छमेचकाभां तालीदलघटितकर्णताटङ्काम् । ताम्बूलपूरितमुखीं ताम्राधरबिम्बदृष्टदरहासाम् ॥ ॥ कुङ्कुमपङ्किलदेहां
    कुवलयजीवातुशावकवतंसाम् । कोकनदशोणचरणां कोकिलनिक्वाणकोमलालापाम् ॥ ॥ वामाङ्गगलितचूलीं वनमाल्यकदम्बमालिकाभरणाम्
    । मुक्ताललन्तिकाञ्चित मुग्धालिकमिलितचित्रकोदाराम् ॥ कलनिनदव्यक्तनिखिलनिगमार्थाम् । वामकुचसङ्गिवीणावादन
    सौख्यार्धमीलिताक्षियुगाम् ॥ मादिरसोन्मेषवासितकटाक्षाम् । आम्नायसारगुलिका माद्यां सङ्गीतमातृकां वन्दे
    ॥ स्योत्तरतस्तरुणकुङ्कुमच्छायः । शमयतु मम सन्तापं सालो नवमः स पुष्परागमयः ॥ ॥ अनयोरन्तरवसुधाः प्रणुमः
    प्रत्यग्रपुष्परागमयीः । सिंहासनेश्वरीमनु चिन्तननिस्तन्द्रसिद्धनीरन्ध्राः ॥ ॥ तत्सालोत्तरदेशे तरुणजपाकिरणधोरणीशोणः
    । प्रशमयतु पद्मराग प्राकारो मम पराभवं दशमः ॥ ननयोरपनीतचित्तवैमत्यान् । चक्रेशीपदभक्तां श्चारणवर्गानहर्निशं
    कलये ॥ ऽसङ्घटितकेतनस्तस्य । गोमेदकेन रचितो गोपायतु मां समुन्नतः सालः ॥ ॥ वप्रद्वयान्तरोर्व्यां वटुकैर्विविधैश्च
    योगिनीबृन्दैः । सततं समर्चितायाः सङ्कर्षण्याः प्रणौमि चरणाब्जम् ॥ ॥ तापसयोजनदूरे तस्य समुत्तुङ्ग गोपुरोपेतः
    । वाञ्छापूर्त्यै भवता द्वज्रमणीनिकरनिर्मितो वप्रः ॥ ॥ वरणद्वितयान्तरतो वासजुषो विहितमधुरसास्वादाः
    । रम्भादिविबुधवेश्या रचयन्तु महान्तमस्मदानन्दम् ॥ ॥ तत्र सदा प्रवहन्ती तटिनी वज्राभिधा चिरं जीयात्
    । चटुलोर्मिजालनृत्य त्कलहंसीकुलकलक्वणितपुष्टा ॥ ॥ रोधसि तस्या रुचिरे वज्रेशी जयति वज्रभूषाढ्या । वज्रप्रदानतोषित
    वज्रिमुखत्रिदशविनुतचारित्रा ॥ ॥ तस्योदीच्यां हरिति स्तवकितसुषमावलीढवियदन्तः । वैडूर्यरत्नरचितो वैमल्यं
    दिशतु चेतसो वरणः ॥ रम्बाचरणावलम्बितस्वान्तान् । कार्कोटकादिनागान् कलयामः किं च बलिमुखान् दनुजान् ॥
    दूरे गगनोर्ध्वजाङ्घिकस्तस्य । वासवमणिप्रणीतो वरणो बहलयतु वैदुषीं विशदाम् ॥ र्महेन्द्रनीलात्मकानि च
    सरांसि । शातोदरीसहाया न्भूपालानपि पुनः पुनः प्रणुमः ॥ ॥ आशुगयोजनदूरे तस्योर्ध्वं कान्तिधवलितदिगन्तः
    । मुक्ताविरचितगात्रो मुहुरस्माकं मुदे भवतु सालः ॥ ॥ आवृत्त्योरधिमध्यं पूर्वस्यां दिशि पुरन्दरः श्रीमान्
    । अभ्रमुविटाधिरूढो विभ्रममस्माकमनिशमातनुतात् ॥ क्तोमरपात्रस्रुवान्नशक्तिधरः । स्वाहास्वधासमेतः सुखयतु
    मां हव्यवाहनः सुचिरम् ॥ ॥ दक्षिणदिगन्तराले दण्डधरो नीलनीरदच्छायः । त्रिपुरापदाब्जभक्तस्तिरयतु मम निखिलमंहसां
    निकरम् ॥ ॥ तस्यैव पश्चिमायां दिशि दलितेन्दीवरप्रभाश्यामः । खेटासियष्टिधारी खेदानपनयतु यातुधानो मे
    ॥ ॥ तस्या उत्तरदेशे धवलाङ्गो विपुलझषवरारूढः । पाशायुधात्तपाणिः पाशी विदलयतु पाशजालानि ॥ त्कोणे वायुं
    चमूरुवरवाहम् । कोरकिततत्त्वबोधा न्गोरक्षप्रमुखयोगिनोऽपि मुहुः ॥ स्तिस्रो वातस्य तस्य कृतवासाः । प्रत्यग्रकापिशायन
    पानपरिभ्रान्तलोचनाः कलये ॥ ॥ तल्लोकपूर्वभागे धनदं ध्यायामि शेवधिकुलेशम् । अपि माणिभद्रमुख्या नम्बाचरणावलम्बिनो
    यक्षान् ॥ ॥ तस्यैव पूर्वसीमनि तपनीयारचितगोपुरे नगरे । कात्यायनीसहायं कलये शीतांशुखण्डचूडालम् ॥ स्थलभाजस्तरुणचन्द्रचूडालान्
    । रुद्राध्याये पठिता न्रुद्राणीसहचरान्भजे रुद्रान् ॥ दूरे बालतृण्मेचकस्तस्य । सालो मरकतरचितः सम्पदमचलां
    श्रियं च पुष्णातु ॥ ॥ आवृतियुग्मान्तरतो हरितमणीनिवहमेचके देशे । हाटकतालीविपिनं हालाघटघटितविटपमाकलये
    ॥ ॥ तत्रैव मन्त्रिणीगृह परिणाहं तरलकेतनं सदनम् । मरकतसौधमनोज्ञं दद्यादायूंषि दण्डनाथायाः ॥ ॥ सदने
    तत्र हरिन्मणि सङ्घटिते मण्डपे शतस्तम्भे । कार्तस्वरमयपीठे कनकमयाम्बुरुहकर्णिकामध्ये ॥ ॥ बिन्दुत्रिकोणवर्तुल
    षडस्रवृत्तद्वयान्विते चक्रे । सञ्चारिणी दशोत्तर शतार्णमनुराजकमलकलहंसी ॥ नयना कोकारिमण्डितशिखण्डा ।
    सन्तप्तकाञ्चनाभा सन्ध्यारुणचेलसंवृतनितम्बा ॥ ऽङ्कुशपाशाभयवरस्फुरितहस्ता । कूलङ्कषानुकम्पा कुङ्कुमजम्बालितस्तनाभोगा
    ॥ वार्ताशेषावलग्नकमनीया । आर्तालीशुभदात्री वार्ताली भवतु वाञ्छितार्थाय ॥ ॥ तस्याः परितो देवीः स्वप्नेश्युन्मत्तभैरवीमुख्याः
    । प्रणमत जम्भिन्याद्याः भैरववर्गांश्च हेतुकप्रमुखान् ॥ ॥ पूर्वोक्तसङ्ख्ययोजन दूरे पूयांशुपाटलस्तस्य
    । विद्रावयतु मदार्तिं विद्रुमसालो विशङ्कटद्वारः ॥ मन्तरभूमौप्रकाशशालिन्याम् । आसीनमम्बुजासन मभिनवसिन्दूरगौरमहमीडे
    ॥ योजनतो विपुलगोपुरद्वारः । सालो नानारत्नैः सङ्घटिताङ्गः कृषीष्ट मदभीष्टम् ॥ रविरलशोभापिचण्डिलोद्देशाम्
    । माणिक्यमण्डपाख्यां महतीमधिहृदयमनिशमाकलये ॥ ॥ तत्र स्थितं प्रसन्नं तरुणतमालप्रवालकिरणाभम् । कर्णावलम्बिकुण्डल
    कन्दलिताभीशुकवचितकपोलम् ॥ मेणाङ्कवदनमेधमानकृपम् । मुग्धैणमदविशेषक मुद्रितनिटिलेन्दुरेखिकारुचिरम् ॥
    नयनाञ्चलघटितमनसिजाकूतम् । कमलाकठिनपयोधर कस्तूरीघुसृणपङ्किलोरस्कम् ॥ ॥ चाम्पेयगन्धिकैश्यं शम्पासब्रह्मचारिकौशेयम्
    । श्रीवत्सकौस्तुभधरं श्रितजनरक्षाधुरीणचरणाब्जम् ॥ त्करपद्मं कण्ठलोलवनमालम् । मुचुकुन्दमोक्षफलदं मुकुन्दमानन्दकन्दमवलम्बे
    ॥ ॥ तद्वरणोत्तरभागे तारापतिबिम्बचुम्बिनिजशृङ्गः । विविधमणीगणघटितो वितरतु सालो विनिर्मलां धिषणाम् ॥
    ॥ प्राकारद्वितयान्तर कक्ष्यां पृथुरत्ननिकरसङ्कीर्णाम् । नमत सहस्रस्तम्भक मण्डपनाम्नातिविश्रुतां भुवने
    ॥ ॥ प्रणुमस्तत्र भवानी सहचरमीशानमिन्दुखण्डधरम् । शृङ्गारनायिकामनु शीलनभाजोऽपि भृङ्गिनन्दिमुखान् ॥
    दूरे वन्दे मनोमयं वप्रम् । अङ्कूरन्मणिकिरणा मन्तरकक्ष्यां च निर्मलामनयोः ॥ ॥ तत्रैवामृतवापीं तरलतरङ्गावलीढतटयुग्माम्
    । मुक्तामयकलहंसी मुद्रितकनकारविन्दसन्दोहाम् ॥ सङ्गीतोन्मेषघोषितदिगन्ताम् । काञ्चनमयाङ्गविलस त्कारण्डवषण्डताण्डवमनोज्ञाम्
    ॥ ॥ कुरुविन्दात्मकहल्लक कोरकसुषमासमूहपाटलिताम् । कलये सुधास्वरूपां कन्दलितामन्दकैरवामोदाम् ॥ ॥ तद्वापिकान्तराले
    तरले मणिपोतसीम्नि विहरन्तीम् । सिन्दूरपाटलाङ्गीं सितकिरणाङ्कूरकल्पितवतंसाम् ॥ ॥ पर्वेन्दुबिम्बवदनां
    पल्लवशोणाधरस्फुरितहासाम् । कुटिलकबरीं कुरङ्गी शिशुनयनां कुण्डलस्फुरितगण्डाम् ॥ ॥ निकटस्थपोतनिलयाः
    शक्तीः शयविधृतहेमशृङ्गजलैः । परिषिञ्चन्तीं परित स्तारां तारुण्यगर्वितां वन्दे ॥ ॥ प्रागुक्तसङ्ख्ययोजनदूरे
    प्रणमामि बुद्धिमयसालम् । अनयोरन्तरकक्ष्या मष्टापदपुष्टमेदिनीं रुचिराम् ॥ ॥ कादम्बरीनिधानां कलयाम्यानन्दवापिकां
    तस्याम् । शोणाश्मनिवहनिर्मित सोपानश्रेणिशोभमानतटीम् ॥ ॥ माणिक्यतरणिनिलयां मध्ये तस्या मदारुणकपोलाम्
    । अमृतेशीत्यभिधाना मन्तः कलयामि वारुणीं देवीम् ॥ हस्ताः सौन्दर्यगर्विता देव्यः । तत्पुरतः स्थितिभाजो
    वितरन्त्वस्माकमायुषो वृद्धिम् ॥ दूरेऽहङ्कारसालमतितुङ्गम् । वन्दे तयोश्च मध्ये कक्ष्यां वलमानमलयपवमानाम्
    ॥ ॥ विनुमो विमर्शवापीं सौषुम्नसुधास्वरूपिणीं तत्र । वेलातिलङ्घ्यवीची कोलाहलभरितकूलवनवाटीम् ॥ ॥ तत्रैव
    सलिलमध्ये तापिञ्छदलप्रपञ्चसुषमाभाम् । श्यामलकञ्चुकलसितां श्यामाविटबिम्बडम्बरहरास्याम् ॥ हसितायुग्मशरकार्मुकविलासाम्
    । मन्दस्मिताञ्चितमुखीं मणिमयताटङ्कमण्डितकपोलाम् ॥ ॥ कुरुविन्दतरणिनिलयां कुलाचलस्पर्धिकुचनमन्मध्याम्
    । कुङ्कुमविलिप्तगात्रीं कुरुकुल्लां मनसि कुर्महे सततम् ॥ ॥ तत्सालोत्तरभागे भानुमयं वप्रमाश्रये दीप्तम्
    । मध्यं च विपुलमनयो र्मन्ये विश्रान्तमातपोद्गारम् ॥ ॥ तत्र कुरुविन्दपीठे तामरसे कनककर्णिकाघटिते ।
    आसीनमरुणवासस मम्लानप्रसवमालिकाभरणम् ॥ शक्तिच्छायासमारचितकेलिम् । माणिक्यमुकुटरम्यं मन्ये मार्ताण्डभैरवं
    हृदये ॥ ॥ इन्दुमयसालमीडे तस्योत्तरतस्तुषारगिरिगौरम् । अत्यन्तशिशिरमारुत मनयोर्मध्यं च चन्द्रिकोद्गारम्
    ॥ ॥ तत्र प्रकाशमानं तारानिकरैः परिष्कृतोद्देशम् । अमृतमयकान्तिकन्दल मन्तः कलयामि कुन्दसितमिन्दुम्
    ॥ ॥ शृङ्गारसालमीडे शृङ्गोल्लसितं तदुत्तरे भागे । मध्यस्थले तयोरपि महितां शृङ्गारपूर्विकां परिखाम्
    ॥ ॥ तत्र मणिनौस्थिताभि स्तपनीयाविरचिताग्रहस्ताभिः । शृङ्गारदेवताभिः सहितं परिखाधिपं भजे मदनम् ॥ ॥
    शृङ्गारवरणवर्यस्योत्तरतः सकलविबुधसंसेव्यम् । चिन्तामणिगणरचितं चिन्तां दूरीकरोतु मे सदनम् ॥ मध्यं दशतालभूमिरुहदीर्घैः
    । पर्णैः सुवर्णवर्णै र्युक्तां काण्डैश्च योजनोत्तुङ्गैः ॥ मानैर्मिलितां च केसरकदम्बैः । सन्ततगलितमरन्द
    स्रोतोनिर्यन्मिलिन्दसन्दोहाम् ॥ धाटीनिर्यत्परागपिञ्जरिताम् । कलहंसीकुलकलकल कूलङ्कषनिनदनिचयकमनीयाम्
    ॥ ॥ पद्माटवीं भजामः परिमलकल्लोलपक्ष्मलोपान्ताम् । देव्यर्घ्यपात्रधारी तस्याः पूर्वदिशि दशकलायुक्तः
    । न्वह्निः क्रोशोन्नतश्चिरं पायात् ॥ ॥ तत्राधारे देव्याः पात्रीरूपः प्रभाकरः श्रीमान् । द्वादशकलासमेतो
    ध्वान्तं मम बहुलमान्तरं भिन्द्यात् ॥ ॥ तस्मिन् दिनेशपात्रे तरङ्गितामोदममृतमयमर्घ्यम् । चन्द्रकलात्मकममृतं
    सान्द्रीकुर्यादमन्दमानन्दम् ॥ ॥ अमृते तस्मिन्नभितो विहरन्त्यो विविधमणितरणिभाजः । षोडश कलाः सुधांशोः
    शोकादुत्तारयन्तु मामनिशम् ॥ ॥ तत्रैव विहृतिभाजो धातृमुखानां च कारणेशानाम् । सृष्ट्यादिरूपिकास्ताः
    शमयन्त्वखिलाः कलाश्च सन्तापम् ॥ राजदिगन्तेषु रत्नगेहस्य । कलयामि तान्यजस्रं कलयन्त्वायुष्यमर्घ्यपात्राणि
    ॥ ॥ पात्रस्थलस्य पुरतः पद्मारमणविधिपार्वतीशानाम् । भवनानि शर्मणे नो भवन्तु भासा प्रदीपितजगन्ति ॥ ॥
    सदनस्यानलकोणे सततं प्रणमामि कुण्डमाग्नेयम् । तत्र स्थितं च वह्निं तरलशिखाजटिलमम्बिकाजनकम् ॥ ॥ तस्यासुरदिशि
    तादृश रत्नपरिस्फुरितपर्वनवकाढ्यम् । चक्रात्मकं शताङ्गं शतयोजनमुन्नतं भजे दिव्यम् ॥ ॥ तत्रैव दिशि निषण्णं
    तपनीयध्वजपरम्पराश्लिष्टम् । रथमपरं च भवान्या रचयामो मनसि रत्नमयचूडम् ॥ ॥ भवनस्य वायुभागे परिष्कृतो
    विविधवैजयन्तीभिः । रचयतु मुदं रथेन्द्रः सचिवेशान्याः समस्तवन्द्यायाः ॥ ॥ कुर्मोऽधिहृदयमनिशं क्रोडास्यायाः
    शताङ्गमूर्धन्यम् । रुद्रदिशि रत्नधाम्नो रुचिरशलाकाप्रपञ्चकञ्चुकितम् ॥ ॥ परितो देवीधाम्नः प्रणीतवासा
    मनुस्वरूपिण्यः । कुर्वन्तु रश्मिमाला कृतयः कुशलानि देवता निखिलाः ॥ ॥ प्राग्द्वारस्य भवानी धाम्नः पार्श्वद्वयारचितवासे
    । मातङ्गीकिटिमुख्यौ मणिसदने मनसि भावयामि चिरम् ॥ ॥ योजनयुगलाभोगा तत्क्रोशपरिणाहयैव भित्त्या च । चिन्तामणिगृहभूमि
    र्जीयादाम्नायमयचतुर्द्वारा ॥ ॥ द्वारे द्वारे धाम्नः पिण्डीभूता नवीनबिम्बाभाः । विदधतु विपुलां कीर्तिं
    दिव्या लौहित्यसिद्ध्यो देव्यः ॥ ॥ मणिसदनस्यान्तरतो महनीये रत्नवेदिकामध्ये । बिन्दुमयचक्रमीडे पीठानामुपरि
    विरचितावासम् ॥ ॥ चक्राणां सकलानां प्रथममधः सीमफलकवास्तव्याः । अणिमादिसिद्धयो मा मवन्तु देवी प्रभास्वरूपिण्यः
    ॥ स्योपरिहरिणाङ्कखण्डकृतचूडाः । भद्रं पक्ष्मलयन्तु ब्राह्मीप्रमुखाश्च मातरोऽस्माकम् ॥ ॥ तस्योपरि मणिफलके
    तारुण्योत्तुङ्गपीनकुचभाराः । सङ्क्षोभिणीप्रधानाः भ्रान्ति विद्रावयन्तु दश मुद्राः ॥ ॥ फलकत्रयस्वरूपे
    पृथुले त्रैलोक्यमोहने चक्रे । दीव्यन्तु प्रकटाख्या स्तासां कर्त्रीं च भगवती त्रिपुरा ॥ ॥ तदुपरि विपुले
    धिष्ण्ये तरलदृशस्तरुणकोकनदभासः । कामाकर्षिण्याद्याः कलये देवीः कलाधरशिखण्डाः ॥ ॥ सर्वाशापरिपूरकचक्रे
    ऽस्मिन् गुप्तयोगिनीसेव्याः । त्रिपुरेशी मम दुरितं तुद्यात् कण्ठावलम्बिमणिहारा ॥ ॥ तस्योपरि मणिपीठे
    ताम्राम्भोरुहदलप्रभाशोणाः । ध्यायाम्यनङ्गकुसुमा प्रमुखा देवीश्च विधृतकूर्पासाः ॥ ॥ सङ्क्षोभकारकेऽस्मिं
    श्चक्रे श्रीत्रिपुरसुन्दरी साक्षात् । गोप्त्री गुप्ततराख्याः गोपायतु मां कृपार्द्रया दृष्ट्या ॥ ॥
    सङ्क्षोभिणीप्रधानाः शक्तीस्तस्योर्ध्ववलयकृतवासाः । आलोलनीलवेणी रन्तः कलयामि यौवनोन्मत्ताः ॥ ॥ सौभाग्यदायकेऽस्मिं
    श्चक्रेशी त्रिपुरवासिनी जीयात् । शक्तीश्च सम्प्रदायाभिधाः समस्ताः प्रमोदयन्त्वनिशम् ॥ ॥ मणिपीठोपरि
    तासां महति चतुर्हस्तविस्तृते वलये । सन्ततविरचितवासाः शक्तीः कलयामि सर्वसिद्धिमुखाः ॥ ॥ सर्वार्थसाधकाख्ये
    चक्रेऽमुष्मिन् समस्तफलदात्री । त्रिपुरा श्रीर्मम कुशलं दिशतादुत्तीर्णयोगिनीसेव्या ॥ ॥ तासां निलयस्योपरि
    धिष्ण्ये कौसुम्भकञ्चुकमनोज्ञाः । सर्वाज्ञाद्याः देव्यः सकलाः सम्पादयन्तु मम कीर्तिम् ॥ करनाम्न्यस्मिन्
    समस्तजनसेव्याम् । मनसि निगर्भासहितां मन्ये श्रीत्रिपुरमालिनीं देवीम् ॥ ॥ सर्वज्ञासदनस्योपरि चक्रे
    विपुले समाकलितगेहाः । वन्दे वशिनीमुख्याः शक्तीः सिन्दूररेणुरुचः ॥ चक्रेऽस्मिंस्त्रिपुरपूर्विकां सिद्धाम्
    । वन्दे रहस्यनाम्ना वेद्याभिः शक्तिभिः सदा सेव्याम् ॥ द्विंशतिहस्तोन्नते महापीठे । शमयन्तु शत्रुबृन्दं
    शस्त्राण्यस्त्राणि चादिदम्पत्योः ॥ द्वलये वलवैरिरत्नसङ्घटिते । कामेश्वरीप्रधानाः कलये देवीः समस्तजनवन्द्याः
    ॥ ॥ चक्रेऽत्र सर्वसिद्धिप्रद नामनि सर्वफलदात्री । त्रिपुराम्बावतु सततं परापररहस्ययोगिनीसेव्या ॥ ॥
    कामेश्वरीगृहोपरिवलये विविधमनुसम्प्रदायज्ञाः । चत्वारो युगनाथा जयन्तु मित्रेशपूर्वकाः गुरवः ॥ न्नानारत्नचयमेदुरे
    पीठे । कामेश्याद्या नित्याः कलयन्तु मुदं तिथिस्वरूपिण्यः ॥ ॥ नित्यासदनस्योपरि निर्मलमणिनिवहविरचिते
    धिष्ण्ये । कुशलं षडङ्गदेव्यः कलयन्त्वस्माकमुत्तरलनेत्राः ॥ ॥ सदनस्योपरि तासां सर्वानन्दमयनामके बिन्दौ
    । पञ्चब्रह्माकारां मञ्चं प्रणमामि मणिगणाकीर्णम् ॥ ॥ परितो मणिमञ्चस्य प्रलम्बमाना नियन्त्रिता पाशैः
    । मायामयी जवनिका मम दुरितं हरतु मेचकच्छाया ॥ न्मदनीपुन्नागमालिकाभरितम् । हरिगोपमयवितानं हरतादालस्यमनिशमस्माकम्
    ॥ ॥ पर्यङ्कस्य भजामः पादान्बिम्बाम्बुदेन्दुहेमरुचः । अजहरिरुद्रेशमया ननलासुरमारुतेशकोणस्थान् ॥ ॥ फलकं
    सदाशिवमयं प्रणौमि सिन्दूररेणुकिरणाभम् । आरभ्याङ्गेशीनां सदनात्कलितं च रत्नसोपानम् ॥ चतुष्टयस्फुरितपाटलास्तरणम्
    । पर्यङ्कोपरि घटितं पातु चिरं हंसतूलशयनं नः ॥ ॥ तस्योपरि निवसन्तं तारुण्यश्रीनिषेवितं सततम् । आवृन्तपुल्लहल्लक
    मरीचिकापुञ्जमञ्जुलच्छायम् ॥ ॥ सिन्दूरशोणवसनं शीतांशुस्तबकचुम्बितकिरीटम् । कुङ्कुमतिलकमनोहर कुटिलालिकहसितकुमुदबन्धुशिशुम्
    ॥ ॥ पूर्णेन्दुबिम्बवदनं फुल्लसरोजातलोचनत्रितयम् । तरलापाङ्गतरङ्गित शफराङ्कनशास्त्रसम्प्रदायार्थम्
    ॥ न्मरीचिकल्लोलमांसलकपोलम् । विद्रुमसहोदराधर विसृमरसुस्मितकिशोरसञ्चारम् ॥ मानीलभ्रूलतायुगमनोज्ञम्
    । वीटीसौरभवीची द्विगुणितवक्त्रारविन्दसौरभ्यम् ॥ प्रसवशरस्फुरितकोमलकराब्जम् । काश्मीरपङ्किलाङ्गं कामेशं
    मनसि कुर्महे सततम् ॥ ॥ तस्याङ्कभुवि निषण्णां तरुणकदम्बप्रसूनकिरणाभाम् । शीतांशुखण्डचूडां सीमन्तन्यस्तसान्द्रसिन्दूराम्
    ॥ न्निटिलां कुटिलतरचिल्लिकायुगलाम् । नालीकतुल्यनयनां नासाञ्चलनटितमौक्तिकाभरणाम् ॥ मरुणाधरकान्तिविजितबिम्बाभाम्
    । कस्तूरीमकरीयुत कपोलसङ्क्रान्तकनकताटङ्काम् ॥ कबलितवदनारविन्दकमनीयाम् । कम्बुसहोदरकण्ठ प्रलम्बमानाच्छमौक्तिककलापाम्
    ॥ भुजयुगलस्फुरितरत्नकेयूराम् । करपद्ममूलविलस त्काञ्चनमयकटकवलयसन्दोहाम् ॥ त्पाशाङ्कुशपुण्ड्रचापपुष्पास्त्राम्
    । कूलङ्कषकुचशिखरां कुङ्कुमकर्दमितरत्नकूर्पासाम् ॥ मम्बुदशोभासनाभिरोमलताम् । माणिक्यखचितकाञ्ची मरीचिकाक्रान्तमांसलनितम्बाम्
    ॥ ॥ करभोरुकाण्डयुगलां जङ्घाजितकामजैत्रतूणीराम् । प्रपदपरिभूतकूर्मां पल्लवसच्छायपदयुगमनोज्ञाम् ॥ किरीटरत्नांशुरञ्जितपदाब्जाम्
    । उन्मस्तकानुकम्पा मुत्तरलापाङ्गपोषितानङ्गाम् ॥ मनिदं प्रथमोक्तिवल्लरीकलिकाम् । आब्रह्मकीटजननी मन्तः
    कलयामि सुन्दरीमनिशम् ॥ ॥ कस्तु क्षितौ पटीया न्वस्तु स्तोतुं शिवाङ्कवास्तव्यम् । अस्तु चिरन्तनसुकृतैः
    प्रस्तुतकाम्याय तन्मम पुरस्तात् ॥ ॥ प्रभुसम्मितोक्तिगम्यं परमशिवोत्सङ्गतुङ्गपर्यङ्कम् । तेजः किञ्चन
    दिव्यं पुरतो मे भवतु पुण्ड्रकोदण्डम् ॥ ॥ मधुरिमभरितशरासं मकरन्दस्यन्दिमार्गणोदारम् । कैरविणीविटचूडं
    कैवल्यायास्तु किञ्चन महो नः ॥ ॥ अक्षुद्रमिक्षुचापं परोक्षमवलग्नसीम्नि त्र्यक्षम् । क्षपयतु मे क्षेमेतर
    मुक्षरथप्रेमपक्ष्मलं तेजः ॥ ॥ भृङ्गरुचिसङ्गरकरापाङ्गं शृङ्गारतुङ्गमरुणाङ्गम् । मङ्गलमभङ्गुरं मे घटयतु
    गङ्गाधराङ्गसङ्गि महः ॥ ॥ प्रपदाजितकूर्ममूर्जित करुणं भर्मरुचिनिर्मथनदेहम् । श्रितवर्म मर्म शम्भोः
    किञ्चन मम नर्म शर्म निर्मातु ॥ कन्दलविजितालि विधृतमणिवालि । मिलतु हृदि पुलिनजघनं बहुलितगलगरलकेलि किमपि
    महः ॥ ॥ कुङ्कुमतिलकितफाला कुरुविन्दच्छायपाटलदुकूला । करुणापयोधिवेला काचन चित्ते चकास्तु मे लीला ॥
    ॥ पुष्पन्धयरुचिवेण्यः पुलिनाभोगत्रपाकरश्रेण्यः । जीयासुरिक्षुपाण्यः काश्चन कामारिकेलिसाक्षिण्यः ॥
    ॥ तपनीयांशुकभांसि द्राक्षामाधुर्यनास्तिकवचांसि । कतिचन शुचं महांसि क्षपयतु कपालितोषितमनांसि ॥ ॥ असितकचमायताक्षं
    कुसुमशरं कूलमुद्वहकृपार्द्रम् । आदिमरसाधिदैवत मन्तः कलये हराङ्कवासि महः ॥ कटाक्षविस्पन्दिकण्ठदघ्नकृपाम्
    । कामेश्वराङ्कनिलयां कामपि विद्यां पुरातनीं कलये ॥ ॥ अरविन्दकान्त्यरुन्तुद विलोचनद्वन्द्वसुन्दरमुखेन्दु
    । छन्दः कन्दलमन्दिर मन्तःपुरमैन्दुशेखरं वन्दे ॥ ॥ बिम्बिनिकुरम्बडम्बर विडम्बकच्छायमम्बरवलग्नम् । कम्बुगलमम्बुदकुचं
    बिम्बोकं कमपि चुम्बतु मनो मे ॥ ॥ कमपि कमनीयरूपं कलयाम्यन्तः कदम्बकुसुमाढ्यम् । चम्पकरुचिरसुवेषैः सम्पादितकान्त्यलङ्कृतदिगन्तम्
    ॥ गर्हासम्पादककान्तिकवचितदिगन्तम् । सिद्धान्तं निगमानां शुद्धान्तं किमपि शूलिनः कलये ॥ नुत्पलबन्धुस्तनन्धयापीडान्
    । करकलितपुण्ड्रचापा न्कलये कानपि कपर्दिनः प्राणान् ॥ ॥ रशनालसज्जघनया रसनाजीवातुचापभासुरया । घ्राणायुष्करशरया
    घ्रातं चित्तं कयापि वासनया ॥ ॥ सरसिजसहयुध्वदृशा शम्पालतिकासनाभिविग्रहया । भासा कयापि चेतो नासामणिशोभिवदनया
    भरितम् ॥ ॥ नवयावकाभसिचयान्वितया गजयानया दयापरया । धृतयामिनीशकलया धिया कयापि क्षतामया हि वयम् ॥ रबिम्बशोणैरपुण्ड्रकोदण्डैः
    । अकुमुदबान्धवचूडै रन्यैरिह जगति दैवतं मन्यैः ॥ ॥ कुवलयसदृक्षनयनैः कुलगिरिकूटस्थबन्धुकुचभारैः । करुणास्पन्दिकटाक्षैः
    कवचितचित्तोऽस्मि कतिपयैः कुतुकैः ॥ ॥ नतजनसुलभाय नमो नालीकसनाभिलोचनाय नमः । नन्दितगिरिशाय नमो महसे
    नवनीपपाटलाय नमः ॥ ॥ कादम्बकुसुमदाम्ने कायच्छायाकणायितार्यम्णे । सीम्ने चिरन्तनगिरां भूम्ने कस्मैचिदाददे
    प्रणतिम् ॥ ॥ कुटिलकबरीभरेभ्यः कुङ्कुमसब्रह्मचारिकिरणेभ्यः । कूलङ्कषस्तनेभ्यः कुर्मः प्रणतिं कुलाद्रिकुतुकेभ्यः
    ॥ त्कोमलकुरलालिविजितशैवालात् । उत्पलसगन्धिनयना दुररीकुर्मो न देवतमान्याम् ॥ मानीलस्निग्धबर्बरकचानाम्
    । आम्नायजीवनाना माकूतानां हरस्य दासोऽहम् ॥ स्फुरितासु पुराहिताङ्कनिलयासु । मग्नं मनो मदीयं कास्वपि
    कामारिजीवनाडीषु ॥ ॥ ललिता पातु शिरो मे ललाटमम्बा च मधुमतीरूपा । भ्रूयुग्मं च भवानी पुष्पशरा पातु लोचनद्वन्द्वम्
    ॥ ॥ पायान्नासां बाला सुभगा दन्तांश्च सुन्दरी जिह्वाम् । अधरोष्ठमादिशक्ति श्चक्रेशी पातु मे चिरं चिबुकम्
    ॥ ॥ कामेश्वरी च कर्णौ कामाक्षी पातु गण्डयोर्युगलम् । शृङ्गारनायिकाव्या द्वदनं सिंहासनेश्वरी च गलम्
    ॥ ॥ स्कन्दप्रसूश्च पातु स्कन्धौ बाहू च पाटलाङ्गी मे । पाणी च पद्मनिलया पायादनिशं नखावलीर्विजया ॥ ॥
    कोदण्डिनी च वक्षः कुक्षिं चाव्यात् कुलाचलतनूजा । कल्याणी च वलग्नं कटिं च पायात्कलाधरशिखण्डा ॥ दुमा
    मृडानी च जानुनी रक्षेत् । जङ्घे च षोडशी मे पायात् पादौ च पाशसृणिहस्ता ॥ ॥ प्रातः पातु परा मां मध्याह्ने
    पातु मणिगृहाधीशा । शर्वाण्यवतु च सायं पायाद्रात्रौ च भैरवी साक्षात् ॥ ॥ भार्यां रक्षतु गौरीं पायात्
    पुत्रांश्च बिन्दुगृहपीठा । श्रीविद्या च यशो मे शीलं चाव्याच्चिरं महाराज्ञी ॥ ॥ पवनमयि पावकमयि क्षोणीमयि
    गगनमयि कृपीटमयि । रविमयि शशिमयि दिङ्मयि समयमयि प्राणमयि शिवे पाहि ॥ ॥ कालि कपालिनि शूलिनि भैरवि मातङ्गि
    पञ्चमि त्रिपुरे । वाग्देवि विन्ध्यवासिनि बाले भुवनेशि पालय चिरं माम् ॥ मम्ब त्वां चिन्तयन्ति ये हृदये
    । उपरि निपतन्ति तेषा मुत्पलनयनाकटाक्षकल्लोलाः ॥ र्वशिनीमुख्याभिरावृतां भवतीम् । चिन्तयतां सितवर्णां
    वाचो निर्यान्त्ययत्नतो वदनात् ॥ ॥ कनकशलाकागौरीं कर्णव्यालोलकुण्डलद्वितयाम् । प्रहसितमुखीं च भवतीं
    ध्यायन्तो ये त एव भूधनदाः ॥ ॥ शीर्षाम्भोरुहमध्ये शीतलपीयूषवर्षिणीं भवतीम् । अनुदिनमनुचिन्तयता मायुष्यं
    भवति पुष्कलमवन्याम् ॥ ॥ मधुरस्मितां मदारुणनयनां मातङ्गकुम्भवक्षोजाम् । चन्द्रवतंसिनीं त्वां सविधे
    पश्यन्ति सुकृतिनः केचित् ॥ ॥ ललितायाः स्तवरत्नं ललितपदाभिः प्रणीतमार्याभिः । प्रतिदिनमवनौ पठतां फलानि
    वक्तुं प्रगल्भते सैव ॥ गृहीतमुनिविग्रहो भगवान् । सर्वासामुपनिषदां दुर्वासा जयति देशिकः प्रथमः ॥ ॥
    इति महर्षिदुर्वासः विरचितं श्रीललितास्तवरत्नम् ।
