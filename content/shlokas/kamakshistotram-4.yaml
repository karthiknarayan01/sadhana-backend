id: kamakshistotram-4
category: stotram
name:
  english: kamakshistotram 4
  devanagari: कामाक्षीस्तोत्रम् ४
content:
  english: shrikamakshistotram kamakshimatarnamaste kamadanaikadakshe sthite bhaktapakshe || dhru|| kamarikante
    kumari kalakalasya bhartuh kare dattahaste | kamaya kamapradatri kamakotisthapujye giram dehi mahyam
    || 1|| shricakramadhye vasantim bhutarakshahpishacatidushtan harantim | shrikamakotyam jvalantim kamahinaissugamyam
    bhaje dehi vacam || 2|| indradimanye sudhanye brahmavishnvadivandye girindrasya kanye | manyam na
    manye tvadanyam manitanghrim munindrairbhaje mataram tvam || 3|| simhadhirudhe namaste sadhuhritpadmagudhe
    hatasheshamudhe | rudham hara tvam gadam me kanthashabdam dridham dehi vagvadini tvam || 4|| kalyanadatrim
    janitrim kanjapatrabhanetram kalanathavaktram | shriskandaputram suvastram saccaritram shive tvam
    bhaje dehi vacam || 5||
  devanagari: श्रीकामाक्षीस्तोत्रम् कामाक्षिमातर्नमस्ते कामदानैकदक्षे स्थिते भक्तपक्षे ॥ ध्रु॥ कामारिकान्ते
    कुमारि कालकालस्य भर्तुः करे दत्तहस्ते । कामाय कामप्रदात्रि कामकोटिस्थपूज्ये गिरं देहि मह्यम् ॥ १॥
    श्रीचक्रमध्ये वसन्तीं भूतरक्षःपिशाचातिदुष्टान् हरन्तीम् । श्रीकामकोट्यां ज्वलन्तीं कामहीनैस्सुगम्यां
    भजे देहि वाचम् ॥ २॥ इन्द्रादिमान्ये सुधन्ये ब्रह्मविष्ण्वादिवन्द्ये गिरीन्द्रस्य कन्ये । मान्यां न
    मन्ये त्वदन्यं मानिताङ्घ्रिं मुनीन्द्रैर्भजे मातरं त्वाम् ॥ ३॥ सिंहाधिरूढे नमस्ते साधुहृत्पद्मगूढे
    हताशेषमूढे । रूढं हर त्वं गदं मे कण्ठशब्दं दृढं देहि वाग्वादिनि त्वम् ॥ ४॥ कल्याणदात्रीं जनित्रीं
    कञ्जपत्राभनेत्रां कलानाथवक्त्राम् । श्रीस्कन्दपुत्रां सुवस्त्रां सच्चरित्रां शिवे त्वां भजे देहि वाचम्
    ॥ ५॥
