id: shridineshastavah
category: stotram
name:
  english: shridineshastavah
  devanagari: श्रीदिनेशस्तवः
content:
  english: mantahsthamandhyam vinivarayashu ||2|| ||iti shrimacchringeri jagadguru shrimatparamahamsaparivrajakacarya
    anantashri saccidananda shivabhinavanrisimhabharati mahasvamibhih shringagiri nikatastha shrisuryanarayana
    devasthane viracitam shridinesha stavah||
  devanagari: मन्तःस्थमान्ध्यं विनिवारयाशु ॥२॥ ॥इति श्रीमच्छृङ्गेरी जगद्गुरु श्रीमत्परमहंसपरिव्राजकाचार्य
    अनन्तश्री सच्चिदानन्द शिवाभिनवनृसिंहभारती महास्वामिभिः शृङ्गगिरि निकटस्थ श्रीसूर्यनारायण देवस्थाने
    विरचितं श्रीदिनेश स्तवः॥
meaning: {}
