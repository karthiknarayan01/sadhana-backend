id: bhadradriramashatakam
category: shataka
name:
  english: bhadradriramashatakam
  devanagari: भद्राद्रिरामशतकम्
content:
  english: svadanandita sajjanabhiranisham gayanti hi tvam budhah | jivanmuktataya sthita api ca te yadyevamarhattamah
    josham bhavamavapnuyam kathamaham bhadradrinatha prabho || 49|| kalyanam kalayasva me kalimalam samsaktamunmulaya
    bhrantim varaya bhogajalajasukhe kamadikansamhara | cittam nirmalaya pramohabharitam svatmanamadarshaya
    klantam mam bhavadavatah shishiraya shribhadrashaileshvara || 50|| candro'bhunmanasastaveti vacanam
    vakti shrutih so'pyasau ahladam vitanoti shitalarucih sanmargagami sada | karyam karanato gunan labhata
    ityahurmanaste tatha bhadradrishvara tangunamstava saman sankramayasmasvapi || 51|| dushtasyapi vinindato'pi
    dayase tvam valinah sma sphutam bharyahartari ravane yudhi jite na ghnangriham praishayah | sitavakshasi
    daranam kritavatah kakasya rakshamadhah bhadradrishvara mam param duritinam tvam shikshase pratyaham
    || 52|| vanditva tava padapadmayugalam vandeya nanyam kvacit prarthya tvam svamabhipsitam na ca param
    tatprarthayeyam punah | evam cetkriyate yasho'kalushitam syatte mamaitatpriyam bhavam tam mama palayasva
    dayaya bhadracaladhishvara || 53|| gangaya api cottare janapade janmaptavan svecchaya patum dakshinadeshajanapi
    janan sandarshananugrahaih | nunnastvam dayaya'tipunyatatini godavarirodhasi prapto bhadragirim raghuttama
    vibho rakshanjanan madrishan || 54|| kalpadrurmadhupashritastrinamukhi sa kamadhenuh shruta cintamanyabhidho
    manishca kathinah kinca sthitaste divi | satsevyo vijayi rane sadayahridbhadracale bhutale nirdosho
    raghunandano vijayate devo vadanyottamah || 55|| kaya'dya vidhaya bruve kaliyugasya dosham janah kshipanti
    bahu vatsaran kshanamivarasairbhashanaih | aruntudanarastutirvidadhate sada panditah smaranti na kadacana
    svapanato'pi bhadracalam || 56|| vicitrataravedikam vimalahematah kalpitam vimanavaramagrato'sya ca
    sudarshanam kancanam | pradakshinapatham budhaih pathitadivyaramayanam prapashyata varalaye raghuvarasya
    bhadracale || 57|| karindrakarabahave karadhritashugaseshave prashastaguna sindhave pranatajanminam
    bandhave | kaliritatamomushe kalitapunyahrijjagmushe namamsi ca samarpaye nagaritorubhadradraye ||
    58|| munindravaramohane mushitacakshushikshavatam videhatanayadrishorviracitamritagryanjane | svasurnishicaraprabhoh
    smarasharartisandayake shariramahasi prabhorvishati hrittu bhadracale || 59|| caracaravidhayinim carananamradhidayinim
    kavistutirasadinim karunaya''rtasamrakshinim | dilipakulanandinim divishadartisamharinim bhajami paradevatam
    bhavanitorubhadracalam || 60|| atitabhavasancitairaganitaishca punyavrajaih avapya raghunayake'bhyadhikabhaktimadvaitinim
    | taya jigamishetpadam sukhamayam janashcettada prayatu budhasankulam prabhusanathabhadracalam ||
    61|| kalih kalayate balatkalushacittasamvasanam prabho shadarayo manah pracayanti vasogriham | bibhemi
    ca yamadaham bata tavapi daso bhavan ato'tra tava drishtaye vasatimemi bhadracale || 62|| yasyaivakhya
    maranasamaye muktaye dehabhajam varanasyam madanaripuna procyate karnamule | yasyaivajna jalanidhijalastambhanapraudhirasit
    so'yam bhadracalashikharagah shoshayecchokamohau || 63|| ashapashabhihatamanasamamayaih piditanam
    jnatum shaktya virahitadhiyam brahma vedantavedyam | praptum yavattanu sukhamalam kankshatam muktimante
    ka va'styanya gatiriha vina bhadrashailadhinatham || 64|| janma praptam dhanapatigrihe lokamanye tatah
    kim vidya labdha vinayamahita vishvahridya tatah kim | viryodreko bhavati vijayapraptihetustatah kim
    saukhyam labhyam tviha ca parato bhadrashailadhinetuh || 65|| mrityormrityum satatamayatam jatito
    jnanato va
  devanagari: स्वादानन्दित सज्जनाभिरनिशं गायन्ति हि त्वां बुधाः । जीवन्मुक्ततया स्थिता अपि च ते यद्येवमर्हत्तमाः
    जोषं भावमवाप्नुयां कथमहं भद्राद्रिनाथ प्रभो ॥ ४९॥ कल्याणं कलयस्व मे कलिमलं संसक्तमुन्मूलय भ्रान्तिं
    वारय भोगजालजसुखे कामादिकान्संहर । चित्तं निर्मलय प्रमोहभरितं स्वात्मानमादर्शय क्लान्तं मां भवदावतः
    शिशिरय श्रीभद्रशैलेश्वर ॥ ५०॥ चन्द्रोऽभून्मनसस्तवेति वचनं वक्ति श्रुतिः सोऽप्यसौ आह्लादं वितनोति शीतलरुचिः
    सन्मार्गगामी सदा । कार्यं कारणतो गुणान् लभत इत्याहुर्मनस्ते तथा भद्राद्रीश्वर तान्गुणांस्तव समान्
    सङ्क्रामयास्मास्वपि ॥ ५१॥ दुष्टस्यापि विनिन्दतोऽपि दयसे त्वं वालिनः स्म स्फुटं भार्याहर्तरि रावणे
    युधि जिते न घ्नन्गृहं प्रैषयः । सीतावक्षसि दारणं कृतवतः काकस्य रक्षामधाः भद्राद्रीश्वर मां परं दुरितिनं
    त्वं शिक्षसे प्रत्यहम् ॥ ५२॥ वन्दित्वा तव पादपद्मयुगलं वन्देय नान्यं क्वचित् प्रार्थ्य त्वं स्वमभीप्सितं
    न च परं तत्प्रार्थयेयं पुनः । एवं चेत्क्रियते यशोऽकलुषितं स्यात्ते ममैतत्प्रियं भावं तं मम पालयस्व
    दयया भद्राचलाधीश्वर ॥ ५३॥ गङ्गाया अपि चोत्तरे जनपदे जन्माप्तवान् स्वेच्छया पातुं दक्षिणदेशजानपि जनान्
    सन्दर्शनानुग्रहैः । नुन्नस्त्वं दययाऽतिपुण्यतटिनी गोदावरीरोधसि प्राप्तो भद्रगिरिं रघूत्तम विभो रक्षञ्जनान्
    मादृशान् ॥ ५४॥ कल्पद्रुर्मधुपाश्रितस्तृणमुखी सा कामधेनुः श्रुता चिन्तामण्यभिधो मणिश्च कठिनः किञ्च
    स्थितास्ते दिवि । सत्सेव्यो विजयी रणे सदयहृद्भद्राचले भूतले निर्दोषो रघुनन्दनो विजयते देवो वदान्योत्तमः
    ॥ ५५॥ कयाऽद्य विधया ब्रुवे कलियुगस्य दोषं जनाः क्षिपन्ति बहु वत्सरान् क्षणमिवारसैर्भाषणैः । अरुन्तुदनरस्तुतीर्विदधते
    सदा पण्डिताः स्मरन्ति न कदाचन स्वपनतोऽपि भद्राचलम् ॥ ५६॥ विचित्रतरवेदिकं विमलहेमतः कल्पितं विमानवरमग्रतोऽस्य
    च सुदर्शनं काञ्चनम् । प्रदक्षिणपथं बुधैः पठितदिव्यरामायणं प्रपश्यत वरालये रघुवरस्य भद्राचले ॥ ५७॥
    करीन्द्रकरबाहवे करधृताशुगासेषवे प्रशस्तगुण सिन्धवे प्रणतजन्मिनां बन्धवे । कलीरिततमोमुषे कलितपुण्यहृज्जग्मुषे
    नमांसि च समर्पये नगरितोरुभद्राद्रये ॥ ५८॥ मुनीन्द्रवरमोहने मुषितचक्षुषीक्षावतां विदेहतनयादृशोर्विरचितामृताग्र्याञ्जने
    । स्वसुर्निशिचरप्रभोः स्मरशरार्तिसन्दायके शरीरमहसि प्रभोर्विशति हृत्तु भद्राचले ॥ ५९॥ चराचरविधायिनीं
    चरणनम्रधीदायिनीं कविस्तुतिरसादिनीं करुणयाऽऽर्तसंरक्षिणीम् । दिलीपकुलनन्दिनीं दिविषदार्तिसंहारिणीं
    भजामि परदेवतां भवनितोरुभद्राचलाम् ॥ ६०॥ अतीतभवसञ्चितैरगणितैश्च पुण्यव्रजैः अवाप्य रघुनायकेऽभ्यधिकभक्तिमद्वैतिनीम्
    । तया जिगमिषेत्पदं सुखमयं जनश्चेत्तदा प्रयातु बुधसङ्कुलं प्रभुसनाथभद्राचलम् ॥ ६१॥ कलिः कलयते बलात्कलुषचित्तसंवासनं
    प्रभो षडरयो मनः प्राचयन्ति वासोगृहम् । बिभेमि च यमादहं बत तवापि दासो भवन् अतोऽत्र तव दृष्टये वसतिमेमि
    भद्राचले ॥ ६२॥ यस्यैवाख्या मरणसमये मुक्तये देहभाजां वाराणस्यां मदनरिपुणा प्रोच्यते कर्णमूले । यस्यैवाज्ञा
    जलनिधिजलस्तम्भनप्रौढिरासीत् सोऽयं भद्राचलशिखरगः शोषयेच्छोकमोहौ ॥ ६३॥ आशापाशाभिहतमनसामामयैः पीडितानां
    ज्ञातुं शक्त्या विरहितधियां ब्रह्म वेदान्तवेद्यम् । प्राप्तुं यावत्तनु सुखमलं काङ्क्षतां मुक्तिमन्ते
    का वाऽस्त्यन्या गतिरिह विना भद्रशैलाधिनाथम् ॥ ६४॥ जन्म प्राप्तं धनपतिगृहे लोकमान्ये ततः किं विद्या
    लब्धा विनयमहिता विश्वहृद्या ततः किम् । वीर्योद्रेको भवति विजयप्राप्तिहेतुस्ततः किं सौख्यं लभ्यं त्विह
    च परतो भद्रशैलाधिनेतुः ॥ ६५॥ मृत्योर्मृत्युं सततमयतां जातितो ज्ञानतो वा
