id: lakshminrisimhashtaksharamantraradhanam
category: mantra
name:
  english: lakshminrisimhashtaksharamantraradhanam
  devanagari: लक्ष्मीनृसिंहाष्टाक्षरमन्त्राराधनम्
content:
  english: shrilakshminrisimhashtaksharamantraradhanam shriganeshaya namah | shrilakshminrisimhaya namah
    | atha dhyanam | kshirabdhau vasumukhyadeva nikarairagradi samveshtitah | shankhacakragadambujam nijakarairbibhramstrinetrasitah
    || 1|| sarpadhisha kritantapatralasitah pitambaralankrito | lakshmih shlishtakalevaro nriharistam
    nilakantho mude || 2|| ashtaksharena devesham narasimhamanamayam | gandhapushpadibhirnityamarcayedacyutam
    narah || 3|| rajannashtaksharo mantrah sarvapapaharah parah | samastayajnaphaladah sarvashantikarah
    shubhah || 4|| om namo narayanaya gandhapushpadi sakalam manenaiva nivedayet | anenabhyarcito devah
    prito bhavati tatkshanat | kim tasya bahubhirmantraih kim tasya bahubhirvrataih | om namo narayanayeti
    mantrah sarvarthasadhakah || 5|| imam mantram japedyastu shucirbhutva samahitah | sarvapapavinirmukto
    vishnusayujyamapnuyat || 6|| sarva tirthaphalam hyetatsarvatirthavaram nripa | harerarcanamavyagram
    sarvayajnaphalam nripa || 7|| tasmatkuru nripashreshtha pratimadishu carcanam | danani vipramukhyebhyah
    prayaccha vidhina nripa || 8|| evam krite nripashreshtha narasimhaprasadatah | prapnoti vaishnavam
    tejo yatkankshati mumukshavah || 9|| purandaro rajanasi tvam prapto'padharmatah | trinabindumuneh
    shapanmukto hyashtaksharajjapat || 10|| iti shri narasimhapurane ashtaksharamantrah sampurnamastu
    |
  devanagari: श्रीलक्ष्मीनृसिंहाष्टाक्षरमन्त्राराधनम् श्रीगणेशाय नमः । श्रीलक्ष्मीनृसिंहाय नमः । अथ ध्यानम्
    । क्षीराब्धौ वसुमुख्यदेव निकरैरग्रादि संवेष्टितः । शङ्खचक्रगदाम्बुजं निजकरैर्बिभ्रंस्त्रिनेत्रासितः
    ॥ १॥ सर्पाधीश कृतान्तपत्रलसितः पीताम्बरालङ्कृतो । लक्ष्मीः श्लिष्टकलेवरो नृहरिस्तां नीलकण्ठो मुदे
    ॥ २॥ अष्टाक्षरेण देवेशं नरसिंहमनामयम् । गन्धपुष्पादिभिर्नित्यमर्चयेदच्युतं नरः ॥ ३॥ राजन्नष्टाक्षरो
    मन्त्रः सर्वपापहरः परः । समस्तयज्ञफलदः सर्वशान्तिकरः शुभः ॥ ४॥ ॐ नमो नारायणाय गन्धपुष्पादि सकलं मनेनैव
    निवेदयेत् । अनेनाभ्यर्चितो देवः प्रीतो भवति तत्क्षणात् । किं तस्य बहुभिर्मन्त्रैः किं तस्य बहुभिर्व्रतैः
    । ॐ नमो नारायणायेति मन्त्रः सर्वार्थसाधकः ॥ ५॥ इमं मन्त्रं जपेद्यस्तु शुचिर्भूत्वा समाहितः । सर्वपापविनिर्मुक्तो
    विष्णुसायुज्यमाप्नुयात् ॥ ६॥ सर्व तीर्थफलं ह्येतत्सर्वतीर्थवरं नृप । हरेरर्चनमव्यग्रं सर्वयज्ञफलं
    नृप ॥ ७॥ तस्मात्कुरु नृपश्रेष्ठ प्रतिमादिषु चार्चनम् । दानानि विप्रमुख्येभ्यः प्रयच्छ विधिना नृप ॥
    ८॥ एवं कृते नृपश्रेष्ठ नरसिंहप्रसादतः । प्राप्नोति वैष्णवं तेजो यत्काङ्क्षति मुमुक्षवः ॥ ९॥ पुरन्दरो
    राजनसि त्वं प्राप्तोऽपधर्मतः । तृणबिन्दुमुनेः शापान्मुक्तो ह्यष्टाक्षराज्जपात् ॥ १०॥ इति श्री नरसिंहपुराणे
    अष्टाक्षरमन्त्रः सम्पूर्णमस्तु ।
