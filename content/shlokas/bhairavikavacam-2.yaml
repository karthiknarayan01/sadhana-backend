id: bhairavikavacam-2
category: kavacha
name:
  english: bhairavikavacam
  devanagari: भैरवीकवचम्
content:
  english: rinushva tvanca vidhina shrutva gopyantavapi tat || 4|| yasyah prasadatsakalam bibharmi bhuvanatrayam
    | yasyah sarvam samutpannayasyamadyapi tishthati || 5|| mata pita jagaddhanya jagadbrahmasvarupini
    | siddhidatri ca siddhassyadasiddha dushtajantushu || 6|| sarvabhutahitakari sarvabhutasvarupini |
    kakari patu mandevi kamini kamadayini || 7|| ekari patu mandevi muladharasvarupini | ikari patu mandevi
    bhuri sarvasukhaprada || 8|| lakari patu mandevi indrani varavallabha | hrinkari patu mandevi sarvada
    shambhusundari || 9|| etairvarnairmahamaya shambhavi patu mastakam | kakare patu mandevi sharvani
    haragehini || 10|| makare patu mandevi sarvapapapranashini | kakare patu mandevi kamarupadhara sada
    || 11|| kakare patu mandevi shambararipriya sada | pakari patu mandevi dharadharanirupadhrik || 12||
    hrinkari patu mandevi akararddhasharirini | etairvarnairmahamaya kamarahupriya'vatu || 13|| makarah
    patu mandevi savitri sarvadayini | kakarah patu sarvatra kalambarasvarupini || 14|| lakarah patu mandevi
    lakshmih sarvasulakshana | hrim patu mantu sarvatra devi tribhuvaneshvari || 15|| etairvarnairmahamaya
    patu shaktisvarupini | vagbhavam mastakamampatu vadanankamarajika || 16|| shaktisvarupini patu hridayayantrasiddhida
    | sundari sarvada patu sundari parirakshati || 17|| raktavarna sada patu sundari sarvadayini | nanalankarasamyukta
    sundari patu sarvada || 18|| sarvangasundari patu sarvatra shivadayini | jagadahladajanani shambhurupa
    ca mam sada || 19|| sarvamantramayi patu sarvasaubhagyadayini | sarvalakshmimayi devi paramanandadayini
    || 20|| patu mam sarvada devi nanashankhanidhih shiva | patu padmanidhirdevi sarvada shivadayini ||
    21|| dakshinamurtirmampatu rishih sarvatra mastake | panktishchandah svarupa tu mukhe patu sureshvari
    || 22|| gandhashtakatmika patu hridayam shankari sada | sarvasammohini patu patu sankshobhini sada
    || 23|| sarvasiddhiprada patu sarvakarshanakarini | kshobhini sarvada patu vashini sarvadavatu ||
    24|| akarshini sada patu sam mohini sadavatu | ratirdevi sada patu bhaganga sarvadavatu || 25|| maheshvari
    sada patu kaumari sarvadavatu | sarvahladanakari mampatu sarvavashankari || 26|| kshemankari sada
    patu sarvangasundari tatha | sarvangayuvatih sarvam sarvasaubhagyadayini || 27|| vagdevi sarvada patu
    vanini sarvadavatu | vashini sarvada patu mahasiddhiprada sada || 28|| sarvavidravini patu gananathah
    sadavatu | durga devi sada patu batukah sarvadavatu || 29|| kshetrapalah sada patu patu cavarishantika
    | anantah sarvada patu varahah sarvadavatu || 30|| prithivi sarvada patu svarnasimhasanantatha | raktamritanca
    satatampatu mam sarvakalatah || 31|| surarnavah sada patu kalpavrikshah sadavatu | shvetacchatram
    sada patu raktadipah sadavatu || 32|| nandanodyanam satatampatu mam sarvasiddhaye | dikpalah sarvada
    pantu dvandvaughah sakalastatha || 33|| vahanani sada pantu astrani pantu sarvada | shastrani sarvada
    pantu yoginyah pantu sarvada || 34|| siddhah pantu sada devi sarvasiddhipradavatu | sarvangasundari
    devi sarvadavatu mantatha || 35|| anandarupini devi citsvarupa cidatmika | sarvada sundari patu sundari
    bhavasundari || 36|| prithagdevalaye ghore sankate durgame girau | aranye prantare vapi patu mam sundari
    sada || 37|| idankavacamityuktam mantroddharashca parvati | yah pathetprayato bhutva trisandhyanniyatah
    shucih || 38|| tasya sarvarthasiddhih syadyadyanmanasi vartate | gorocanakunkumena raktacandanakena
    va || 39|| svayambhukusumaih shuklairbhumiputre shanau sure | shmashane prantare vapi shunyagare shivalaye
    || 40|| svashaktya guruna yantrampujayitva kumarikah | tanmanumpujayitva ca gurupanktintathaiva ca
    || 41|| devyai balinnivedyatha naramarjarasukaraih | nakulairmahishairmeshaih pujayitva vidhanatah
    || 42|| dhritva suvarnamadhyastankanthe va dakshine bhuje | sutithau shubhanakshatre suryasyodayane
    tatha || 43|| dharayitva ca kavacam sarvasiddhilabhennarah | kavacasya ca mahatmyannahavarshashatairapi
    || 44|| shaknomi tu maheshani vaktuntasya phalantu yat | na durbhikshaphalantatra na capi pidanantatha
    || 45|| sarvavighnaprashamanam sarvavyadhivinashanam || 46|| sarvarakshakaranjantoshcaturvargaphalapradam
    | yatra kutra na vaktavyanna datavyankadacana || 47|| mantramprapya vidhanena pujayetsatatam sudhih
    | tatrapi durlabham manye kavacandevarupinam || 48|| guroh prasadamasadya vidyamprapya sugopitam |
    tatrapi kavacandivyandurlabhambhuvanatraye || 49|| shlokava stavamekava yah pathetprayatah shucih
    | tasya sarvarthasiddhih syacchankarena prabhashitam || 50|| gururddevo harah sakshatpatni tasya ca
    parvati | abhedena yajedyastu tasya siddhiraduratah || 51|| iti shrirudrayamale bhairavabhairavisamade
    shribhairavikavacam sampurnam ||
  devanagari: ृणुष्व त्वञ्च विधिना श्रुत्वा गोप्यन्तवापि तत् ॥ ४॥ यस्याः प्रसादात्सकलं बिभर्मि भुवनत्रयम्
    । यस्याः सर्वं समुत्पन्नयस्यामद्यापि तिष्ठति ॥ ५॥ माता पिता जगद्धन्या जगद्ब्रह्मस्वरूपिणी । सिद्धिदात्री
    च सिद्धास्स्यादसिद्धा दुष्टजन्तुषु ॥ ६॥ सर्वभूतहितकरी सर्वभूतस्वरूपिणी । ककारी पातु मान्देवी कामिनी
    कामदायिनी ॥ ७॥ एकारी पातु मान्देवी मूलाधारस्वरूपिणी । इकारी पातु मान्देवी भूरि सर्वसुखप्रदा ॥ ८॥ लकारी
    पातु मान्देवी इन्द्राणी वरवल्लभा । ह्रीङ्कारी पातु मान्देवी सर्वदा शम्भुसुन्दरी ॥ ९॥ एतैर्वर्णैर्महामाया
    शम्भवी पातु मस्तकम् । ककारे पातु मान्देवी शर्वाणी हरगेहिनी ॥ १०॥ मकारे पातु मान्देवी सर्वपापप्रणाशिनी
    । ककारे पातु मान्देवी कामरूपधरा सदा ॥ ११॥ ककारे पातु मान्देवी शम्बरारिप्रिया सदा । पकारी पातु मान्देवी
    धराधरणिरूपधृक् ॥ १२॥ ह्रीङ्कारी पातु मान्देवी आकारार्द्धशरीरिणी । एतैर्वर्णैर्महामाया कामराहुप्रियाऽवतु
    ॥ १३॥ मकारः पातु मान्देवी सावित्री सर्वदायिनी । ककारः पातु सर्वत्र कलाम्बरस्वरूपिणी ॥ १४॥ लकारः पातु
    मान्देवी लक्ष्मीः सर्वसुलक्षणा । ह्रीं पातु मान्तु सर्वत्र देवी त्रिभुवनेश्वरी ॥ १५॥ एतैर्वर्णैर्महामाया
    पातु शक्तिस्वरूपिणी । वाग्भवं मस्तकमम्पातु वदनङ्कामराजिका ॥ १६॥ शक्तिस्वरूपिणी पातु हृदययन्त्रसिद्धिदा
    । सुन्दरी सर्वदा पातु सुन्दरी परिरक्षति ॥ १७॥ रक्तवर्णा सदा पातु सुन्दरी सर्वदायिनी । नानालङ्कारसंयुक्ता
    सुन्दरी पातु सर्वदा ॥ १८॥ सर्वाङ्गसुन्दरी पातु सर्वत्र शिवदायिनी । जगदाह्लादजननी शम्भुरूपा च मां सदा
    ॥ १९॥ सर्वमन्त्रमयी पातु सर्वसौभाग्यदायिनी । सर्वलक्ष्मीमयी देवी परमानन्ददायिनी ॥ २०॥ पातु मां सर्वदा
    देवी नानाशङ्खनिधिः शिवा । पातु पद्मनिधिर्देवी सर्वदा शिवदायिनी ॥ २१॥ दक्षिणामूर्तिर्माम्पातु ऋषिः
    सर्वत्र मस्तके । पङ्क्तिश्छन्दः स्वरूपा तु मुखे पातु सुरेश्वरी ॥ २२॥ गन्धाष्टकात्मिका पातु हृदयं शङ्करी
    सदा । सर्वसंमोहिनी पातु पातु सङ्क्षोभिणी सदा ॥ २३॥ सर्वसिद्धिप्रदा पातु सर्वाकर्षणकारिणी । क्षोभिणी
    सर्वदा पातु वशिनी सर्वदावतु ॥ २४॥ आकर्षिणी सदा पातु सं मोहिनी सदावतु । रतिर्देवी सदा पातु भगाङ्गा
    सर्वदावतु ॥ २५॥ महेश्वरी सदा पातु कौमारी सर्वदावतु । सर्वाह्लादनकारी माम्पातु सर्ववशङ्करी ॥ २६॥ क्षेमङ्करी
    सदा पातु सर्वाङ्गसुन्दरी तथा । सर्वाङ्गयुवतिः सर्वं सर्वसौभाग्यदायिनी ॥ २७॥ वाग्देवी सर्वदा पातु वाणिनी
    सर्वदावतु । वशिनी सर्वदा पातु महासिद्धिप्रदा सदा ॥ २८॥ सर्वविद्राविणी पातु गणनाथः सदावतु । दुर्गा
    देवी सदा पातु बटुकः सर्वदावतु ॥ २९॥ क्षेत्रपालः सदा पातु पातु चावरिशान्तिका । अनन्तः सर्वदा पातु वराहः
    सर्वदावतु ॥ ३०॥ पृथिवी सर्वदा पातु स्वर्णसिम्हासनन्तथा । रक्तामृतञ्च सततम्पातु मां सर्वकालतः ॥ ३१॥
    सुरार्णवः सदा पातु कल्पवृक्षः सदावतु । श्वेतच्छत्रं सदा पातु रक्तदीपः सदावतु ॥ ३२॥ नन्दनोद्यानं सततम्पातु
    मां सर्वसिद्धये । दिक्पालाः सर्वदा पान्तु द्वन्द्वौघाः सकलास्तथा ॥ ३३॥ वाहनानि सदा पान्तु अस्त्राणि
    पान्तु सर्वदा । शस्त्राणि सर्वदा पान्तु योगिन्यः पान्तु सर्वदा ॥ ३४॥ सिद्धाः पान्तु सदा देवी सर्वसिद्धिप्रदावतु
    । सर्वाङ्गसुन्दरी देवी सर्वदावतु मान्तथा ॥ ३५॥ आनन्दरूपिणी देवी चित्स्वरूपा चिदात्मिका । सर्वदा सुन्दरी
    पातु सुन्दरी भवसुन्दरी ॥ ३६॥ पृथग्देवालये घोरे सङ्कटे दुर्गमे गिरौ । अरण्ये प्रान्तरे वापि पातु मां
    सुन्दरी सदा ॥ ३७॥ इदङ्कवचमित्युक्तं मन्त्रोद्धारश्च पार्वति । यः पठेत्प्रयतो भूत्वा त्रिसन्ध्यन्नियतः
    शुचिः ॥ ३८॥ तस्य सर्वार्थसिद्धिः स्याद्यद्यन्मनसि वर्तते । गोरोचनाकुङ्कुमेन रक्तचन्दनकेन वा ॥ ३९॥
    स्वयम्भूकुसुमैः शुक्लैर्भूमिपुत्रे शनौ सुरे । श्मशाने प्रान्तरे वापि शून्यागारे शिवालये ॥ ४०॥ स्वशक्त्या
    गुरुणा यन्त्रम्पूजयित्वा कुमारिकाः । तन्मनुम्पूजयित्वा च गुरुपङ्क्तिन्तथैव च ॥ ४१॥ देव्यै बलिन्निवेद्याथ
    नरमार्जारसूकरैः । नकुलैर्महिषैर्मेषैः पूजयित्वा विधानतः ॥ ४२॥ धृत्वा सुवर्णमध्यस्तङ्कण्ठे वा दक्षिणे
    भुजे । सुतिथौ शुभनक्षत्रे सूर्यस्योदयने तथा ॥ ४३॥ धारयित्वा च कवचं सर्वसिद्धिलभेन्नरः । कवचस्य च माहात्म्यन्नाहवर्षशतैरपि
    ॥ ४४॥ शक्नोमि तु महेशानि वक्तुन्तस्य फलन्तु यत् । न दुर्भिक्षफलन्तत्र न चापि पीडनन्तथा ॥ ४५॥ सर्वविघ्नप्रशमनं
    सर्वव्याधिविनाशनम् ॥ ४६॥ सर्वरक्षाकरञ्जन्तोश्चतुर्वर्गफलप्रदम् । यत्र कुत्र न वक्तव्यन्न दातव्यङ्कदाचन
    ॥ ४७॥ मन्त्रम्प्राप्य विधानेन पूजयेत्सततं सुधीः । तत्रापि दुर्लभं मन्ये कवचन्देवरूपिणम् ॥ ४८॥ गुरोः
    प्रसादमासाद्य विद्याम्प्राप्य सुगोपिताम् । तत्रापि कवचन्दिव्यन्दुर्लभम्भुवनत्रये ॥ ४९॥ श्लोकवा स्तवमेकवा
    यः पठेत्प्रयतः शुचिः । तस्य सर्वार्थसिद्धिः स्याच्छङ्करेण प्रभाषितम् ॥ ५०॥ गुरुर्द्देवो हरः साक्षात्पत्नी
    तस्य च पार्वती । अभेदेन यजेद्यस्तु तस्य सिद्धिरदूरतः ॥ ५१॥ इति श्रीरुद्रयामले भैरवभैरवीसंआदे श्रीभैरवीकवचं
    सम्पूर्णम् ॥
