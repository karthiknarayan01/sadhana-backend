id: akkalakotasvami-samartha-tarakamantram
category: mantra
name:
  english: akkalakotasvami samartha tarakamantram
  devanagari: अक्कलकोटस्वामी समर्थ तारकमन्त्रम्
content:
  english: bhaya he paḻu de javaḻi ubhi svamishakti kaḻu de jagi janmamrityu ase kheḻa jyaca nako ghabaru
    tu ase bala tyamca || 3 || khara hoi jaga tu shraddhesahita kasa hoshi tyavina tu svamibhakta kitida
    dila bola tyamnica hata nako dagamagu svami detila satha || 4 || vibhuti namana nama dhyanadi tirtha
    svamica ya pamca pranamritata he tirtha ghe
  devanagari: भय हे पळू दे जवळी उभी स्वामीशक्ती कळू दे जगी जन्ममृत्यू असे खेळ ज्याचा नको घाबरू तू असे
    बाल त्यांचा ॥ ३ ॥ खरा होई जागा तू श्रद्धेसहीत कसा होशी त्यावीण तू स्वामिभक्त कितीदा दिला बोल त्यांनीच
    हात नको डगमगू स्वामी देतील साथ ॥ ४ ॥ विभूती नमन नाम ध्यानादि तीर्थ स्वामीच या पंच प्राणामृतात हे तीर्थ
    घे
meaning: {}
