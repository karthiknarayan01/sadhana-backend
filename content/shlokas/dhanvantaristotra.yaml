id: dhanvantaristotra
category: stotram
name:
  english: dhanvantaristotra
  devanagari: धन्वन्तरिस्तोत्र
content:
  english: amritasanjivana dhanvantaristotram 1 namo namo vishvavibhavanaya namo namo lokasukhapradaya
    | namo namo vishvasrijeshvaraya namo namo namo muktivarapradaya || 1|| namo namaste'khilalokapaya
    namo namaste'khilakamadaya | namo namaste'khilakaranaya namo namaste'khilarakshakaya || 2|| namo namaste
    sakalartrihartre namo namaste virujah prakartre | namo namaste'khilavishvadhartre namo namaste'khilalokabhartre
    || 3|| srishtam deva caracaram jagadidam brahmasvarupena te sarvam tatparipalyate jagadidam vishnusvarupena
    te | vishvam samhriyate tadeva nikhilam rudrasvarupena te samsicyamritashikarairhara maharishtam ciram
    jivaya || 4|| yo dhanvantarisamjnaya nigaditah kshirabdhito nihsrito hastabhyam janajivanaya kalasham
    piyushapurnam dadhat | ayurvedamariracajjanarujam nashaya sa tvam muda samsicyamritashikarairhara
    maharishtam ciram jivaya || 5|| strirupam varabhushanambaradharam trailokyasammohanam kritva payayati
    sma yah suragananpiyushamatyuttamam | cakre daityaganan sudhavirahitan sammohya sa tvam muda samsicyamritashikarairhara
    maharishtam ciram jivaya || 6|| cakshushodadhisamplava bhuvedapa jhashakrite | sinca sincamritakanaih
    ciram jivaya jivaya || 7|| prishthamandaranirghurnanidraksha kamathakrite | sinca sincamritakanaih
    ciram jivaya jivaya || 8|| dharoddhara hiranyakshaghata krodakrite prabho | sinca sincamritakanaih
    ciram jivaya jivaya || 9|| bhaktatrasavinashattacandatva nrihare vibho | sinca sincamritakanaih ciram
    jivaya jivaya || 10|| yancacchalabalitrasamuktanirjara vamana | sinca sincamritakanaih ciram jivaya
    jivaya || 11 || kshatriyaranyasanchedakutharakararainuka | sinca sincamritakanaih ciram jivaya jivaya
    || 12|| rakshorajapratapabdhishoshanashuga raghava | sinca sincamritakanaih ciram jivaya jivaya ||
    13|| bhubharasurasandohakalagne rukminipate | sinca sincamritakanaih ciram jivaya jivaya || 14|| vedamargaratanarhavibhrantyai
    buddharupadhrik | sinca sincamritakanaih ciram jivaya jivaya || 15|| kalivarnashramaspashtadharmarddyai
    kalkirupabhak | sinca sincamritakanaih ciram jivaya jivaya || 16|| asadhyah kashtasadhya ye maharoga
    bhayankarah | chindhi tanashu cakrena ciram jivaya jivaya || 17 || alpamrityum capamrityum mahotpatanupadravan
    | bhindhi bhindhi gadaghataih ciram jivaya jivaya || 18 || aham na jane kimapi tvadanyat samashraye
    natha padambujam te | kurushva tadyanmanasipsitam te sukarmana kena samakshamiyam || 19 || tvameva
    tato janani tvameva tvameva nathashca tvameva bandhuh | vidyahinagarakulam tvameva tvameva sarvam
    mama devadeva || 20|| na me'paradham pravilokaya prabho'
  devanagari: अमृतसञ्जीवन धन्वन्तरिस्तोत्रम् १ नमो नमो विश्वविभावनाय नमो नमो लोकसुखप्रदाय । नमो नमो विश्वसृजेश्वराय
    नमो नमो नमो मुक्तिवरप्रदाय ॥ १॥ नमो नमस्तेऽखिललोकपाय नमो नमस्तेऽखिलकामदाय । नमो नमस्तेऽखिलकारणाय नमो
    नमस्तेऽखिलरक्षकाय ॥ २॥ नमो नमस्ते सकलार्त्रिहर्त्रे नमो नमस्ते विरुजः प्रकर्त्रे । नमो नमस्तेऽखिलविश्वधर्त्रे
    नमो नमस्तेऽखिललोकभर्त्रे ॥ ३॥ सृष्टं देव चराचरं जगदिदं ब्रह्मस्वरूपेण ते सर्वं तत्परिपाल्यते जगदिदं
    विष्णुस्वरूपेण ते । विश्वं संह्रियते तदेव निखिलं रुद्रस्वरूपेण ते संसिच्यामृतशीकरैर्हर महारिष्टं चिरं
    जीवय ॥ ४॥ यो धन्वन्तरिसंज्ञया निगदितः क्षीराब्धितो निःसृतो हस्ताभ्यां जनजीवनाय कलशं पीयूषपूर्णं दधत्
    । आयुर्वेदमरीरचज्जनरुजां नाशाय स त्वं मुदा संसिच्यामृतशीकरैर्हर महारिष्टं चिरं जीवय ॥ ५॥ स्त्रीरूपं
    वरभूषणाम्बरधरं त्रैलोक्यसंमोहनं कृत्वा पाययति स्म यः सुरगणान्पीयूषमत्युत्तमम् । चक्रे दैत्यगणान् सुधाविरहितान्
    संमोह्य स त्वं मुदा संसिच्यामृतशीकरैर्हर महारिष्टं चिरं जीवय ॥ ६॥ चाक्षुषोदधिसम्प्लाव भूवेदप झषाकृते
    । सिञ्च सिञ्चामृतकणैः चिरं जीवय जीवय ॥ ७॥ पृष्ठमन्दरनिर्घूर्णनिद्राक्ष कमठाकृते । सिञ्च सिञ्चामृतकणैः
    चिरं जीवय जीवय ॥ ८॥ धरोद्धार हिरण्याक्षघात क्रोडाकृते प्रभो । सिञ्च सिञ्चामृतकणैः चिरं जीवय जीवय ॥
    ९॥ भक्तत्रासविनाशात्तचण्डत्व नृहरे विभो । सिञ्च सिञ्चामृतकणैः चिरं जीवय जीवय ॥ १०॥ याञ्चाच्छलबलित्रासमुक्तनिर्जर
    वामन । सिञ्च सिञ्चामृतकणैः चिरं जीवय जीवय ॥ ११ ॥ क्षत्रियारण्यसञ्छेदकुठारकररैणुक । सिञ्च सिञ्चामृतकणैः
    चिरं जीवय जीवय ॥ १२॥ रक्षोराजप्रतापाब्धिशोषणाशुग राघव । सिञ्च सिञ्चामृतकणैः चिरं जीवय जीवय ॥ १३॥ भूभरासुरसन्दोहकालाग्ने
    रुक्मिणीपते । सिञ्च सिञ्चामृतकणैः चिरं जीवय जीवय ॥ १४॥ वेदमार्गरतानर्हविभ्रान्त्यै बुद्धरूपधृक् ।
    सिञ्च सिञ्चामृतकणैः चिरं जीवय जीवय ॥ १५॥ कलिवर्णाश्रमास्पष्टधर्मर्द्द्यै कल्किरूपभाक् । सिञ्च सिञ्चामृतकणैः
    चिरं जीवय जीवय ॥ १६॥ असाध्याः कष्टसाध्या ये महारोगा भयङ्कराः । छिन्धि तानाशु चक्रेण चिरं जीवय जीवय
    ॥ १७ ॥ अल्पमृत्युं चापमृत्युं महोत्पातानुपद्रवान् । भिन्धि भिन्धि गदाघातैः चिरं जीवय जीवय ॥ १८ ॥ अहं
    न जाने किमपि त्वदन्यत् समाश्रये नाथ पदाम्बुजं ते । कुरुष्व तद्यन्मनसीप्सितं ते सुकर्मणा केन समक्षमीयाम्
    ॥ १९ ॥ त्वमेव तातो जननी त्वमेव त्वमेव नाथश्च त्वमेव बन्धुः । विद्याहिनागारकुलं त्वमेव त्वमेव सर्वं
    मम देवदेव ॥ २०॥ न मेऽपराधं प्रविलोकय प्रभोऽ
