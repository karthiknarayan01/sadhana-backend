id: dattatreyastotram-naradapuranam
category: stotram
name:
  english: dattatreyastotram (naradapuranam)
  devanagari: दत्तात्रेयस्तोत्रम् (नारदपुराणम्)
content:
  english: vivarjita | pamcabhutaikadiptaya dattatreya namo'stute || 4|| yajnabhokte ca yajnaya yajnarupadharaya
    ca | yajnapriyaya siddhaya dattatreya namo'stute || 5|| adau brahma madhya vishnuramte devah sadashivah
    | murtitrayasvarupaya dattatreya namo'stute || 6|| bhogalayaya bhogaya yogayogyaya dharine | jitendriyajitajnaya
    dattatreya namo'stute || 7|| digambaraya divyaya divyarupadhraya ca | sadoditaparabrahma dattatreya
    namo'stute || 8|| jambudvipamahakshetramatapuranivasine | jayamanasatam deva dattatreya namo'stute
    || 9|| bhikshatanam grihe grame patram hemamayam kare | nanasvadamayi bhiksha dattatreya namo'stute
    || 10|| brahmajnanamayi mudra vastre cakashabhutale | prajnanaghanabodhaya dattatreya namo'stute ||
    11|| avadhutasadanandaparabrahmasvarupine | videhadeharupaya dattatreya namo'stute || 12|| satyamrupasadacarasatyadharmaparayana
    | satyashrayaparokshaya dattatreya namo'stute || 13|| shulahastagadapane vanamalasukandhara | yajnasutradharabrahman
    dattatreya namo'stute || 14|| ksharaksharasvarupaya paratparataraya ca | dattamuktiparastotra dattatreya
    namo'stute || 15|| datta vidyadhyalakshmisha datta svatmasvarupine | gunanirgunarupaya dattatreya
    namo'stute || 16|| shatrunashakaram stotram jnanavijnanadayakam | sarvapapam shamam yati dattatreya
    namo'stute || 17|| idam stotram mahaddivyam dattapratyakshakarakam | dattatreyaprasadacca naradena
    prakirtitam || 18|| || iti shrinaradapurane naradaviracitam dattatreyastotram susampurnam ||
  devanagari: विवर्जित । पंचभूतैकदीप्ताय दत्तात्रेय नमोऽस्तुते ॥ ४॥ यज्ञभोक्ते च यज्ञाय यज्ञरूपधराय च
    । यज्ञप्रियाय सिद्धाय दत्तात्रेय नमोऽस्तुते ॥ ५॥ आदौ ब्रह्मा मध्य विष्णुरंते देवः सदाशिवः । मूर्तित्रयस्वरूपाय
    दत्तात्रेय नमोऽस्तुते ॥ ६॥ भोगालयाय भोगाय योगयोग्याय धारिणे । जितेन्द्रियजितज्ञाय दत्तात्रेय नमोऽस्तुते
    ॥ ७॥ दिगम्बराय दिव्याय दिव्यरूपध्राय च । सदोदितपरब्रह्म दत्तात्रेय नमोऽस्तुते ॥ ८॥ जम्बुद्वीपमहाक्षेत्रमातापुरनिवासिने
    । जयमानसतां देव दत्तात्रेय नमोऽस्तुते ॥ ९॥ भिक्षाटनं गृहे ग्रामे पात्रं हेममयं करे । नानास्वादमयी
    भिक्षा दत्तात्रेय नमोऽस्तुते ॥ १०॥ ब्रह्मज्ञानमयी मुद्रा वस्त्रे चाकाशभूतले । प्रज्ञानघनबोधाय दत्तात्रेय
    नमोऽस्तुते ॥ ११॥ अवधूतसदानन्दपरब्रह्मस्वरूपिणे । विदेहदेहरूपाय दत्तात्रेय नमोऽस्तुते ॥ १२॥ सत्यंरूपसदाचारसत्यधर्मपरायण
    । सत्याश्रयपरोक्षाय दत्तात्रेय नमोऽस्तुते ॥ १३॥ शूलहस्तगदापाणे वनमालासुकन्धर । यज्ञसूत्रधरब्रह्मन्
    दत्तात्रेय नमोऽस्तुते ॥ १४॥ क्षराक्षरस्वरूपाय परात्परतराय च । दत्तमुक्तिपरस्तोत्र दत्तात्रेय नमोऽस्तुते
    ॥ १५॥ दत्त विद्याढ्यलक्ष्मीश दत्त स्वात्मस्वरूपिणे । गुणनिर्गुणरूपाय दत्तात्रेय नमोऽस्तुते ॥ १६॥ शत्रुनाशकरं
    स्तोत्रं ज्ञानविज्ञानदायकम् । सर्वपापं शमं याति दत्तात्रेय नमोऽस्तुते ॥ १७॥ इदं स्तोत्रं महद्दिव्यं
    दत्तप्रत्यक्षकारकम् । दत्तात्रेयप्रसादाच्च नारदेन प्रकीर्तितम् ॥ १८॥ ॥ इति श्रीनारदपुराणे नारदविरचितं
    दत्तात्रेयस्तोत्रं सुसंपूर्णम् ॥
