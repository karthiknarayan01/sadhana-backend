id: annamayya-keerthanas-tiruveedhula-merasi
category: stotram
name:
  english: Annamayya Keerthanas Tiruveedhula Merasi
content:
  english: adi pallavi tiruvithula mèṟasi devadevudu garimala mincina singaramulatodanu || tirudandelapai
    negi devudidè tòlunadu sirula rèndavanadu sheshunimida | muripena mudonadu mutyala pandiri krinda
    pòrinalugonadu puvu govilalonu || tiruvithula mèṟasi devadevudu grakkuna naidavanadu garudunimida
    yèkkanu aravanadu yenugumida || còkkamai yedavanadu suryaprabhalonanu yikkuva derunu gurramènimidonadu
    || tiruvithula mèṟasi devadevudu kanakaputandalamu kadipi tòmmidonadu pènaci padonadu pèndlipita |
    yènasi shri venkateshu dinti yalamel vanitala nadumanu vahanalamidanu || tiruvithula mèṟasi devadevudu
    garimala mincina singaramulatodanu ||
  devanagari: आदि पल्लवि तिरुवीथुल मॆऱसी देवदेवुडु गरिमल मिञ्चिन सिङ्गारमुलतोडनु ॥ तिरुदण्डेलपै नेगी देवुडिदॆ
    तॊलुनाडु सिरुल रॆण्डवनाडु शेषुनिमीद । मुरिपेन मूडोनाडु मुत्याल पन्दिरि क्रिन्द पॊरिनालुगोनाडु पुवु
    गोविललोनु ॥ तिरुवीथुल मॆऱसी देवदेवुडु ग्रक्कुन नैदवनाडु गरुडुनिमीद यॆक्कनु आरवनाडु येनुगुमीद ॥ चॊक्कमै
    येडवनाडु सूर्यप्रभलोननु यिक्कुव देरुनु गुर्रमॆनिमिदोनाडु ॥ तिरुवीथुल मॆऱसी देवदेवुडु कनकपुटन्दलमु
    कदिपि तॊम्मिदोनाडु पॆनचि पदोनाडु पॆण्ड्लिपीट । यॆनसि श्री वेङ्कटेशु डिन्ति यलमेल् वनितल नडुमनु वाहनालमीदनु
    ॥ तिरुवीथुल मॆऱसी देवदेवुडु गरिमल मिञ्चिन सिङ्गारमुलतोडनु ॥
