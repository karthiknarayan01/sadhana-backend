id: devadibhihkritamsuryastotram-15
category: stotram
name:
  english: devadibhihkritamsuryastotram 15
  devanagari: देवादिभिःकृतंसूर्यस्तोत्रम् १५
content:
  english: devadibhih kritam suryastotram 15 deva ucuh | namaste ravirupaya somarupaya te namah | namo
    yajuhsvarupayatharvayangirase namah || 64|| jnanaikadhamabhutaya nirdhutatamase namah | shuddhajyotihsvarupaya
    nistattvayamalatmane || 65|| namo'khilajagadvyaptisvarupayatmamurtaye | sarvakaranabhutaya nishthayai
    jnanacetasam || 66|| namo'stu jneyarupaya prakashe laksharupine | bhaskaraya namastubhyam tatha shabdakrite
    namah || 67|| samsarahetave caiva sandhyajyotsnakrite namah | tvam sarvametadbhagavanjagadvai bhramati
    tvaya || 68|| bhramatvaviddhamakhilam brahmandam sacaracaram | tvadamshubhiridam sarvam samsrishtam
    jayate shuci || 69|| kriyate tvatkarasparshajjaladinam pavitrata | homadanadiko dharmo nopakaraya
    jayate || 70|| tavadyavanna samyogi jagatyatra bhavanchucih | pratarhomam prashastam hi udite tvayi
    jayate || 71|| rico'tha sakala hyeta yajumshi tvam jagatpate | sakalani ca samani tapatyevam jagatsada
    || 72|| rinmayastvam jagannatha tvameva ca yajurmayah | tatha samamayashcaiva tato natha trayimayah
    || 73|| tvameva brahmano rupam param caparameva ca | murto'murtastatha sukshmah stularupataya sthitah
    || 74|| nimeshakashthadimayah kalarupah kshayatmakah | prasida svecchaya rupam svatejomayamadisha
    || 75|| ittham samstuyamanastu devairdevarshibhistatha | iti bhavishyapurane brahme parvani trayovimshadhikashatatamadhyayantargatam
    devadibhih kritam suryastotram samaptam | bhavishyapurana | brahmaparva | adhyaya 123
  devanagari: देवादिभिः कृतं सूर्यस्तोत्रम् १५ देवा ऊचुः । नमस्ते रविरूपाय सोमरूपाय ते नमः । नमो यजुःस्वरूपायाथर्वायाङ्गिरसे
    नमः ॥ ६४॥ ज्ञानैकधामभूताय निर्धूततमसे नमः । शुद्धज्योतिःस्वरूपाय निस्तत्त्वायामलात्मने ॥ ६५॥ नमोऽखिलजगद्व्याप्तिस्वरूपायात्ममूर्तये
    । सर्वकारणभूताय निष्ठायै ज्ञानचेतसाम् ॥ ६६॥ नमोऽस्तु ज्ञेयरूपाय प्रकाशे लक्षरूपिणे । भास्कराय नमस्तुभ्यं
    तथा शब्दकृते नमः ॥ ६७॥ संसारहेतवे चैव सन्ध्याज्योत्स्नाकृते नमः । त्वं सर्वमेतद्भगवाञ्जगद्वै भ्रमति
    त्वया ॥ ६८॥ भ्रमत्वाविद्धमखिलं ब्रह्माण्डं सचराचरम् । त्वदंशुभिरिदं सर्वं संसृष्टं जायते शुचि ॥ ६९॥
    क्रियते त्वत्करस्पर्शाज्जलादीनां पवित्रता । होमदानादिको धर्मो नोपकाराय जायते ॥ ७०॥ तावद्यावन्न संयोगी
    जगत्यत्र भवाञ्छुचिः । प्रातर्होमं प्रशस्तं हि उदिते त्वयि जायते ॥ ७१॥ ऋचोऽथ सकला ह्येता यजूंषि त्वं
    जगत्पते । सकलानि च सामानि तपत्येवं जगत्सदा ॥ ७२॥ ऋङ्मयस्त्वं जगन्नाथ त्वमेव च यजुर्मयः । तथा साममयश्चैव
    ततो नाथ त्रयीमयः ॥ ७३॥ त्वमेव ब्रह्मणो रूपं परं चापरमेव च । मूर्तोऽमूर्तस्तथा सूक्ष्मः स्तूलरूपतया
    स्थितः ॥ ७४॥ निमेषकाष्ठादिमयः कालरूपः क्षयात्मकः । प्रसीद स्वेच्छया रूपं स्वतेजोमयमादिश ॥ ७५॥ इत्थं
    संस्तूयमानस्तु देवैर्देवर्षिभिस्तथा । इति भविष्यपुराणे ब्राह्मे पर्वणि त्रयोविंशाधिकशततमाध्यायान्तर्गतं
    देवादिभिः कृतं सूर्यस्तोत्रं समाप्तम् । भविष्यपुराण । ब्राह्मपर्व । अध्याय १२३
