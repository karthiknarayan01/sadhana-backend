id: mudgalakritamvishnustotram
category: stotram
name:
  english: mudgalakritamvishnustotram
  devanagari: मुद्गलकृतंविष्णुस्तोत्रम्
content:
  english: mudgalakritam vishnustotram mudgala uvaca | prathamam jagatah srashtre palakaya tatah param
    || 15|| samhartre ca tatah pashcannamo narayanaya te | namah shaphararupaya kamathaya cidatmane ||
    16|| namo varahavapushe namah pancasyarupine | vamanaya namastubhyam jamadagnisutaya te || 17|| raghavaya
    namastubhyam balabhadraya te namah | krishnaya kalkaye tubhyam namo vijnanarupine || 18|| raksha mam
    karunasindho narayana jagatpate | nirlajjam kripanam kruram pishunam dambhikam krisham || 19|| paradaraparadravyaparakshetraikalolupam
    | asuya''vishtamanasam mam raksha kripaya hare || 1
  devanagari: मुद्गलकृतं विष्णुस्तोत्रम् मुद्गल उवाच । प्रथमं जगतः स्रष्ट्रे पालकाय ततः परम् ॥ १५॥ संहर्त्रे
    च ततः पश्चान्नमो नारायणाय ते । नमः शफररूपाय कमठाय चिदात्मने ॥ १६॥ नमो वराहवपुषे नमः पञ्चास्यरूपिणे
    । वामनाय नमस्तुभ्यं जमदग्निसुताय ते ॥ १७॥ राघवाय नमस्तुभ्यं बलभद्राय ते नमः । कृष्णाय कल्कये तुभ्यं
    नमो विज्ञानरूपिणे ॥ १८॥ रक्ष मां करुणासिन्धो नारायण जगत्पते । निर्लज्जं कृपणं क्रूरं पिशुनं दाम्भिकं
    कृशम् ॥ १९॥ परदारपरद्रव्यपरक्षेत्रैकलोलुपम् । असूयाऽऽविष्टमनसं मां रक्ष कृपया हरे ॥ १
meaning: {}
