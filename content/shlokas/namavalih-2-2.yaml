id: namavalih-2-2
category: stotram
name:
  english: namavalih
  devanagari: नामावलिः
content:
  english: shrijanaki ashtottarashatanamavalih om siradhvajasutayai namah | om sitayai namah | om svashritabhishtadayinyai
    namah | om sahajanandinyai namah | om stavyayai namah | om sarvabhutashayasthitayai namah | om hladinyai
    namah | om kshemadayai namah | om kshantyai namah | om shadarddhakshahridisthitayai namah | 10 om
    shrinidhaye namah | om shrisamaradhyayai namah | om shriyah shriyai namah | om shrimadarcitayai namah
    | om sharanyayai namah | om vedanihshvasayai namah | om vaidehyai namah | om vibudheshvaryai namah
    | om lokottarambayai namah | om lokadyai namah | 20 om raghunandanavallabhayai namah | om ramyaramyanidhaye
    namah | om ramayai namah | om yogeshvarapriyatmajayai namah | om yajnasvarupayai namah | om yajneshyai
    namah | om yoginam paramagatyai namah | om mridusvabhavayai namah | om mridulayai namah | om maithilyai
    namah | 30 om madhurakrityai namah | om manorupayai namah | om mahejyejyayai namah | om mahasaubhagyadayinyai
    namah | om bhumijayai namah | om budhamrigyanghrikamalayai namah | om bodhavaridhaye namah | om tapasam
    phalasvarupayai namah | om phanindravarnyavaibhavayai namah | om namasyayai namah | 40 om priyadrishtyai
    namah | om dhararatnayai namah | om dharasutayai namah | om divyatmayai namah | om diptamahimayai
    namah | om tattvatmayai namah | om janakatmajayai namah | om jagadishaparapreshthayai namah | om jnaninam
    paramayanayai namah | om jaganmangalamangalyayai namah | 50 om jaramrityubhayatigayai namah | om candrakalamukhasadyayai
    namah | om cidanandasvarupinyai namah | om caturatmayai namah | om caturvyuhayai namah | om candrabimbopamananayai
    namah | om ghanashyamatmanilayayai namah | om goptryai namah | om guptayai namah | om guheshayayai
    namah | 60 om geyodarayashahpanktyai namah | om gataishvaryakritasmayayai namah | om gamaniyapadasaktyai
    namah | om khalabhavanivarinyai namah | om kripapiyushajaladhyai namah | om kritajnayai namah | om
    kritisadhanayai namah | om kalyanaprakrityai namah | om kamyayai namah | om kalyanyai namah | 70 om
    kamavarshinyai namah | om karunyardravishalakshyai namah | om kambukanthyai namah | om kalanidhaye
    namah | om kelipriyayai namah | om kaladharayai namah | om kalmashaughanivarinyai namah | om om shabdavacyayai
    namah | om ojo'bdhyai namah | om uditashriye namah | 80 om udaradhiye namah | om udarakirtyai namah
    | om uditayai namah | om udaratulyadarshanayai namah | om ishtapradayai namah | om ibhagamanayai namah
    | om adijayai namah | om ahladinyai parayai namah | om ashritavatsalayai namah | om aradhyayai namah
    | 90 om anirdeshyasvarupinyai namah | om advitiyasukhambhodhaye namah | om avyajakarunaparayai namah
    | om anavadyayai namah | om apramattatmane namah | om anantaishvaryamanditayai namah | om amanayai
    namah | om ayonijayai namah | om akopayai namah | om avicintyayai namah | 100 om anaghasmrityai namah
    | om anihayai namah | om aniyamayai namah | om anadimadhyantayai namah | om adbhutadarshanayai namah
    | om ajeyayai namah | om akalmashayai namah | om akaravacyayai namah | 108 iti shrijanaki ashtottarashatanamavalih
    samapta |
  devanagari: श्रीजानकी अष्टोत्तरशतनामावलिः ॐ सीरध्वजसुतायै नमः । ॐ सीतायै नमः । ॐ स्वाश्रिताभीष्टदायिन्यै
    नमः । ॐ सहजानन्दिन्यै नमः । ॐ स्तव्यायै नमः । ॐ सर्वभूताशयस्थितायै नमः । ॐ ह्लादिन्यै नमः । ॐ क्षेमदायै
    नमः । ॐ क्षान्त्यै नमः । ॐ षडर्द्धाक्षहृदिस्थितायै नमः । १० ॐ श्रीनिधये नमः । ॐ श्रीसमाराध्यायै नमः
    । ॐ श्रियः श्रियै नमः । ॐ श्रीमदर्चितायै नमः । ॐ शरण्यायै नमः । ॐ वेदनिःश्वासायै नमः । ॐ वैदेह्यै
    नमः । ॐ विबुधेश्वर्यै नमः । ॐ लोकोत्तराम्बायै नमः । ॐ लोकाद्यै नमः । २० ॐ रघुनन्दनवल्लभायै नमः । ॐ
    रम्यरम्यनिधये नमः । ॐ रामायै नमः । ॐ योगेश्वरप्रियात्मजायै नमः । ॐ यज्ञस्वरूपायै नमः । ॐ यज्ञेश्यै
    नमः । ॐ योगिनां परमागत्यै नमः । ॐ मृदुस्वभावायै नमः । ॐ मृदुलायै नमः । ॐ मैथिल्यै नमः । ३० ॐ मधुराकृत्यै
    नमः । ॐ मनोरूपायै नमः । ॐ महेज्येज्यायै नमः । ॐ महासौभाग्यदायिन्यै नमः । ॐ भूमिजायै नमः । ॐ बुधमृग्याङ्घ्रिकमलायै
    नमः । ॐ बोधवारिधये नमः । ॐ तपसां फलस्वरूपायै नमः । ॐ फणीन्द्रवर्ण्यवैभवायै नमः । ॐ नमस्यायै नमः ।
    ४० ॐ प्रियदृष्ट्यै नमः । ॐ धरारत्नायै नमः । ॐ धरासुतायै नमः । ॐ दिव्यात्मायै नमः । ॐ दीप्तमहिमायै
    नमः । ॐ तत्त्वात्मायै नमः । ॐ जनकात्मजायै नमः । ॐ जगदीशपरप्रेष्ठायै नमः । ॐ ज्ञानिनां परमायनायै नमः
    । ॐ जगन्मङ्गलमाङ्गल्यायै नमः । ५० ॐ जरामृत्युभयातिगायै नमः । ॐ चन्द्रकलामुखासाद्यायै नमः । ॐ चिदानन्दस्वरूपिण्यै
    नमः । ॐ चतुरात्मायै नमः । ॐ चतुर्व्यूहायै नमः । ॐ चन्द्रबिम्बोपमाननायै नमः । ॐ घनश्यामात्मनिलयायै
    नमः । ॐ गोप्त्र्यै नमः । ॐ गुप्तायै नमः । ॐ गुहेशयायै नमः । ६० ॐ गेयोदारयशःपङ्क्त्यै नमः । ॐ गतैश्वर्यकृतस्मयायै
    नमः । ॐ गमनीयपदासक्त्यै नमः । ॐ खलभावनिवारिण्यै नमः । ॐ कृपापीयूषजलध्यै नमः । ॐ कृतज्ञायै नमः । ॐ
    कृतिसाधनायै नमः । ॐ कल्याणप्रकृत्यै नमः । ॐ काम्यायै नमः । ॐ कल्याण्यै नमः । ७० ॐ कामवर्षिण्यै नमः
    । ॐ कारुण्यार्द्रविशालाक्ष्यै नमः । ॐ कम्बुकण्ठ्यै नमः । ॐ कलानिधये नमः । ॐ केलिप्रियायै नमः । ॐ कलाधारायै
    नमः । ॐ कल्मषौघनिवारिण्यै नमः । ॐ ॐ शब्दवाच्यायै नमः । ॐ ओजोऽब्ध्यै नमः । ॐ उदितश्रिये नमः । ८० ॐ
    उदारधिये नमः । ॐ उदारकीर्त्यै नमः । ॐ उदितायै नमः । ॐ उदारातुल्यदर्शनायै नमः । ॐ इष्टप्रदायै नमः ।
    ॐ इभगमनायै नमः । ॐ आदिजायै नमः । ॐ आह्लादिन्यै परायै नमः । ॐ आश्रितवत्सलायै नमः । ॐ आराध्यायै नमः
    । ९० ॐ अनिर्देश्यस्वरूपिण्यै नमः । ॐ अद्वितीयसुखाम्भोधये नमः । ॐ अव्याजकरुणापरायै नमः । ॐ अनवद्यायै
    नमः । ॐ अप्रमत्तात्मने नमः । ॐ अनन्तैश्वर्यमण्डितायै नमः । ॐ अमानायै नमः । ॐ अयोनिजायै नमः । ॐ अकोपायै
    नमः । ॐ अविचिन्त्यायै नमः । १०० ॐ अनघस्मृत्यै नमः । ॐ अनीहायै नमः । ॐ अनियमायै नमः । ॐ अनादिमध्यान्तायै
    नमः । ॐ अद्भुतदर्शनायै नमः । ॐ अजेयायै नमः । ॐ अकल्मषायै नमः । ॐ अकारवाच्यायै नमः । १०८ इति श्रीजानकी
    अष्टोत्तरशतनामावलिः समाप्ता ।
