id: nagakanyabhihkritamshivastotram
category: stotram
name:
  english: nagakanyabhihkritamshivastotram
  devanagari: नागकन्याभिःकृतंशिवस्तोत्रम्
content:
  english: nagakanyabhih kritam shivastotram vavandire'tha ta bala jnatva lakshmabhirishvaram | tushtuvushca
    prahrishtastah sannakanthyo'tiviklavam || 94|| jaya shambho jayeshana jaya sarvaga sarvada | jaya
    tripurasamhartarjayandhakanishudana || 95|| jaya jalandharahara jaya kandarpadarpahrit | jaya trailokyajanaka
    jaya trailokyavandita | jaya bhaktajanadhisha jaya pramathanayaka || 96|| namastubhyam namastubhyam
    namastubhyam namo namah | trilocana namastubhyam trivishtapa namo'stu te || 97|| ityuktva dandavadbhumau
    pranipetuh kumarikah || iti shriskandapurane avantyakhande caturashitilingamahatmye pancacatvarimshadhyayantargatam
    nagakanyabhih kritam shivastotram samaptam | skandapurana | avantyakhanda | caturashitikhanda | adhyaya
    45
  devanagari: नागकन्याभिः कृतं शिवस्तोत्रम् ववन्दिरेऽथ ता बाला ज्ञात्वा लक्ष्मभिरीश्वरम् । तुष्टुवुश्च
    प्रहृष्टास्ताः सन्नकण्ठ्योऽतिविक्लवम् ॥ ९४॥ जय शम्भो जयेशान जय सर्वग सर्वद । जय त्रिपुरसंहर्तर्जयान्धकनिषूदन
    ॥ ९५॥ जय जालन्धरहर जय कन्दर्पदर्पहृत् । जय त्रैलोक्यजनक जय त्रैलोक्यवन्दित । जय भक्तजनाधीश जय प्रमथनायक
    ॥ ९६॥ नमस्तुभ्यं नमस्तुभ्यं नमस्तुभ्यं नमो नमः । त्रिलोचन नमस्तुभ्यं त्रिविष्टप नमोऽस्तु ते ॥ ९७॥
    इत्युक्त्वा दण्डवद्भूमौ प्रणिपेतुः कुमारिकाः ॥ इति श्रीस्कन्दपुराणे आवन्त्यखण्डे चतुरशीतिलिङ्गमाहात्म्ये
    पञ्चचत्वारिंशाध्यायान्तर्गतं नागकन्याभिः कृतं शिवस्तोत्रं समाप्तम् । स्कन्दपुराण । आवन्त्यखण्ड । चतुरशीतिखण्ड
    । अध्याय ४५
