id: pahi-ramaprabho
category: stotram
name:
  english: Pahi Ramaprabho
content:
  english: jhampa pahiramaprabho pahiramaprabho pahibhadradri vaidehiramaprabho || pahiramaprabho || shrimanmahagunastomabhirama
    mi namakirtanalu varnintu ramaprabho || || pahiramaprabho || sundarakara hrinmandiroddhara si tendira
    samyutananda ramaprabho || || pahiramaprabho || indira hridayaravindadirudha sundarakara ananda ramaprabho
    || || pahiramaprabho || èndunejuda misundarananamu kanduno kannulimpònda ramaprabho || || pahiramaprabho
    || punyacaritralavanya karunya gam bhirya dakshinya shriramacandraprabho || || pahiramaprabho || kandarpajanaka
    nayandu ranjila sada nandudavai pujalandu ramaprabho || || pahiramaprabho || impuga jèvulaku nvinduga
    nikathal kanduga mimmu sòmpònda ramaprabho || || pahiramaprabho || vandanamucesi munulandaru ghanulairi
    vindavainatti govinda ramaprabho || || pahiramaprabho || brindarakadi sadbrindarcitavatara vinda muni
    sandarshitananda ramaprabho || || pahiramaprabho || tallivinivè matandrivinivè ma dhatavunivè mabhrata
    ramaprabho || || pahiramaprabho || pallavadharalaina gòllabhamalagudi yullamalaranga ranjillu ramaprabho
    || || pahiramaprabho || mallarangambunandèlla mallulajiri yalla kamsuni jampu malla ramaprabho ||
    || pahiramaprabho || kòllaluga nimaya vèlliviriyaga jeya sallapamuna kridasalpu ramaprabho || || pahiramaprabho
    || tammudunu nivu parshvammulanjeri vi llammulèkkèdi nilcutimmu ramaprabho || || pahiramaprabho ||
    krammukònishatravulu hummanucuvaccèdaru immainabanamulimmu ramaprabho || || pahiramaprabho || rammu
    nakabhayammu nimmu nipadamul namminanayya shriramacandraprabho || || pahiramaprabho || kanti mi shankhammu
    kanti mi cakramu kanti mi padamulganti ramaprabho || || pahiramaprabho || vinti mahima vènnanti tammudu
    nivu jantaravayya navènta ramaprabho || || pahiramaprabho || memu nivaramainamu rakshimpuma nnamu
    jagela shriramacandraprabho || || pahiramaprabho || namanovidhini prematonundu mi bhumijasahita jaya
    ramacandraprabho || || pahiramaprabho || mi mahattvammu vina manamandu prema vemarun buttu shriramacandraprabho
    || || pahiramaprabho || shyamasundara komalam janakimanah kamukam tvam bhaje ramacandraprabho || ||
    pahiramaprabho || kamitarthamuliccu ni mahatvamu vinna na mòralincu nasvami ramaprabho || || pahiramaprabho
    || kamitaprabhudavai premato rakshincu svami saketapuri ramacandraprabho || || pahiramaprabho || anna
    ravanna nikanna namida nèna runna vareri nayanna ramaprabho || || pahiramaprabho || ninnègakanu mare
    yanyulaganan gannatandriviga mayanna ramaprabho || || pahiramaprabho || vènnadòngili tinna cinnakrishnamma
    ni nnènnaga vashamè ravanna ramaprabho || || pahiramaprabho || ènnènno janmamula nèttajalanu ika ninnè
    nèmmadini varnintu ramaprabho || || pahiramaprabho || ènnividhamulanaina ninnè nammina vani manninci
    dayaceyumanna ramaprabho || || pahiramaprabho || pannagadhipashayi bhavanatita a panna namanavi vinavanna
    ramaprabho || || pahiramaprabho || metivakyambu misatidaivambu mu mmatikini bhuviledu meti ramaprabho
    || || pahiramaprabho || padudunu mimmu gòniyadudunu modamuna veducunnanu gapadu ramaprabho || || pahiramaprabho
    || vedukoganè nijodukadunu nivu kudi rarayya natoda ramaprabho || || pahiramaprabho || nedu nakorkè
    lideragajesi ka padara karinelu jada ramaprabho || || pahiramaprabho || mudumurtula katmamulamai cènnòndu
    vadavani shrutulu ninnadu ramaprabho || || pahiramaprabho || cudu mibhaktulanu gudu miripula go radu
    mivalla govinda ramaprabho || || pahiramaprabho || pundarikaksha martandavamshodbhava khandalastutya
    kodanda ramaprabho || || pahiramaprabho || kundalishayana bhumandaloddharana pa shandajanaharana kodandaramaprabho
    || || pahiramaprabho || nindudayatoda nayanda bayakanu ni vundi gapadu kodandaramaprabho || || pahiramaprabho
    || jatakautuhalam cakshukrityaramam putasitapate data ramaprabho || || pahiramaprabho || patakulalo
    mòdati patakuda navanti patakuni kavute khyati ramaprabho || || pahiramaprabho || bhutanathuni villu
    khyatiga khandinci sitagaikònna vikhyata ramaprabho || || pahiramaprabho || putanakalmashoddhuta pè
    shatru sam hari shrisitasameta ramaprabho || || pahiramaprabho || jatinitululeka bhutalambuna dirugu
    ghatakula barimarcu neta ramaprabho || || pahiramaprabho || èppudunu gantiki rèppavalè gaci na nnòppugagavu
    mayappa ramaprabho || || pahiramaprabho || edaya nidaya yodayambhonidhi yadiledayya namida ramaprabho
    || || pahiramaprabho || ghorarakshasa garvahara vishvambharo ddhara gunasandravistara ramaprabho ||
    || pahiramaprabho || modamuna nivu nannadukovayya go davari tira bhadradri ramaprabho || || pahiramaprabho
    || nidu banambulanu nadushatrulabatti badhimpakunnavademi ramaprabho || || pahiramaprabho || adimadhyanta
    bahirantaratmudavanucu vadintune jagannatha ramaprabho || || pahiramaprabho || calademi padabjamulasati
    yipadu nalgulokambula gudi ramaprabho || || pahiramaprabho || ela yilagu jagela jesèdavu ma mmelukovayya
    mapali ramaprabho || || pahiramaprabho || paluvènnalu mruccilintivani yashoda rotagattina mayacalu
    ramaprabho || || pahiramaprabho || kòllaluga vrepallè pallavadharulato nallabilliganu ranjilla ramaprabho
    || || pahiramaprabho || vali nòkkammunan gulavesina shaurya shaliyau ninudalatu jala ramaprabho ||
    || pahiramaprabho || salabhanjikala nirmulambu ceyaga jalitivi gopalabala ramaprabho || || pahiramaprabho
    || talavrikshamu lòkkakola dharagulaga lilanesina bahushali ramaprabho || shilayaina yahalya shripadamulu
    soka nèlatayai mimu maditalacè || vinavayya manavi gaikònavayya tappulan ganakayya sammatingònucu
    ramaprabho || || pahiramaprabho || danadharmambulun dapajapambulu nidu namakirtanaku sariravu ramaprabho
    || || pahiramaprabho || manavamanamulu mahini nivai yunda makela madini icinta ramaprabho || || pahiramaprabho
    || jnanayogabhyasamandu nundèdivari kanandamayudavainavu ramaprabho || || pahiramaprabho || bhanuvamshamunandu
    manavadhipudavai danavula barimarcinavu ramaprabho || || pahiramaprabho || anurenu paripurnudau hridayavasa
    na manavi vinu devakitanaya ramaprabho || || pahiramaprabho || manyamai ashritavadanyamai sujana sa
    nmanyamai vèlugu murdhanya ramaprabho || || pahiramaprabho || nityamai satyamai nirmalambai mahini
    divyavamshottamsamaina ramaprabho || || pahiramaprabho || sevyamai mipadadbhavyamai sajjana shravyamai
    yunduno divya ramaprabho || || pahiramaprabho || gattiga nivuna pattuga vihitamau nattuga mammu cepattu
    ramaprabho || || pahiramaprabho || dittayagu tatakinigòtti vegamè gadhi patti yagamu gacinatti ramaprabho
    || || pahiramaprabho || cuttukòni kalingu dattahasamuceya pattukòni talanèkkinatti ramaprabho || ||
    pahiramaprabho || santatamu nannu rakshintuvani nammi mi mmèntura janakikanta ramaprabho || || pahiramaprabho
    || pantamuna mi padacintanamu ceya na vantalanniyu manutènta ramaprabho || || pahiramaprabho || vintagadayya
    nenintanadinadi na pantamuna mimmu bhavintu ramaprabho || || pahiramaprabho || shantamurtini ramakantudavani
    cala santasambuna ninnu nèntu ramaprabho || || pahiramaprabho || akshayambaina nikukshilo lokamula
    rakshincitivi lakshmivaksha ramaprabho || || pahiramaprabho || dantivatsala bhaktacintamani vishva
    mantayunu nivu rakshincu ramaprabho || || pahiramaprabho || pakshivahana shatrunikshepana nannu rakshincu
    mokshapradata ramaprabho || || pahiramaprabho || rakshinci sajjanula vikshinci durjanula rakshasula
    shikshincinavu ramaprabho || || pahiramaprabho || rakshakudavai jagadrakshanamuceyaga rakshasula shikshincinavu
    ramaprabho || || pahiramaprabho || lakshmikataksha vikshanadhara vrishti ma kakshayambuga katakshincu
    ramaprabho || || pahiramaprabho || ravaya abhayambu livaya nasvami nivaya gati devaraya ramaprabho
    || || pahiramaprabho || kavu kavumatancu kakasuruduraga kaci rakshincinavayya ramaprabho || || pahiramaprabho
    || devadevottama devendrasannuta kavavenannu shriramacandraprabho || || pahiramaprabho || bhavajajanaka
    na badhalanniyumanpi ye vidhambunaina nelu ramaprabho || || pahiramaprabho || shrivaishnavulapali
    cintamanivi cala sevagaikòni karunaceyu ramaprabho || || pahiramaprabho || bhavamuna mimubhakti sevincu
    janulaku kaivalyamòsagu shriramacandraprabho || || pahiramaprabho || gopaluranu gudi yavulanu mepi
    apadoddharakudavaina ramaprabho || || pahiramaprabho || napali shrirama bhupalaka nanu kapadarava
    gopala ramaprabho || || pahiramaprabho || saramaushaurya vistaramau sundara karasadbhaktamandara ramaprabho
    || || pahiramaprabho || sharanagatatrana birudankitambaina varamu nakòsagu yemaraka ramaprabho ||
    || pahiramaprabho || shrirama rameti shreshthamantramu sarè sarèkunu vintaga jaduva ramaprabho ||
    || pahiramaprabho || shrirama ninama cintanamritapana sarame nadumadi goru ramaprabho || || pahiramaprabho
    || ceri mipada padmaradhanamu ceya korinanayya shriramacandraprabho || || pahiramaprabho || ghorarakshasagarvahari
    vishvambhara bhurigunasandra vistara ramaprabho || || pahiramaprabho || maricamayanivara sharasandhana
    dharunitanaya vihara ramaprabho || || pahiramaprabho || paravasudeva yakshayapatra mòsagi na nnarasi
    poshimpagadavayya ramaprabho || || pahiramaprabho || paradhanambunu parastrila napekshincu narukabbune
    mokshamaraya ramaprabho || || pahiramaprabho || kamadidurguna stomambuladaga mi namamritamè dikku
    ramacandraprabho || || pahiramaprabho || dushtulagu danavula nashtambuga jeyaga buttitivi kausalya
    patti ramaprabho || || pahiramaprabho || kashtapadalenayya pattabhirama na kishtasampadalicci yelu
    ramaprabho || || pahiramaprabho || keshavayanina bhavapashamulòlagu sa rveshakoti shashiprakasha ramaprabho
    || || pahiramaprabho || narayana nidu namamritam bèpudu parayanamu cetu nenu ramaprabho || || pahiramaprabho
    || madhavayaniyu sammodamuna ninugòlcu sadhusajjanadayambhodhi ramaprabho || || pahiramaprabho ||
    govinda govinda gopalakrishnayani gopakulu gòniyadu goparamaprabho || || pahiramaprabho || vishnuna
    sarvavardhishnuna tattva bhu yishnuna nirmitam krishna ramaprabho || || pahiramaprabho || shridhara
    shrikara shrinarasimha gam gadhara stotra yananda ramaprabho || || pahiramaprabho || matsyamai jaladhilo
    jòcci somakudrunci tècci vedamu lajunakisti ramaprabho || || pahiramaprabho || kurmarupamu nòndi kòndamupunadalci
    kurmito namritambugurci ramaprabho || || pahiramaprabho || varaharupamuna vasudhagòmmunanètti surala
    rakshincu dasharathi ramaprabho || || pahiramaprabho || sharananna prahladu garuninci rakshimpa narasimhamurtivainatti
    ramaprabho || || pahiramaprabho || vamanatvamuna bhudanamadigiyu balini bhumikrindanadanci pòlcu ramaprabho
    || || pahiramaprabho || parashuramudananga narapalakulanèlla narasipòrikònna dasharathi ramaprabho
    || || pahiramaprabho || shriramamurtivai yaravanuni talal padagurcinavu ramaprabho || || pahiramaprabho
    || haladharudavai dharasthalipalakulanèlla bòripucci vèlugumapali ramaprabho || || pahiramaprabho
    || siddhasannuta manobaddhundavai nivu bauddhundavaiti prabuddha ramaprabho || || pahiramaprabho ||
    kalikirupamudalci kaliyugambuna nivu vèlasitivi bhadradrinilaya ramaprabho || || pahiramaprabho ||
    avyayudavaina niyavataramula juci divyulainaru munulayya ramaprabho || || pahiramaprabho || shriramanamame
    velasmariyintu svami dayaceyu sampadanu ramaprabho || || pahiramaprabho || appa sheshashayana yèppudu
    ninu maruva nòppuga brovu varadappa ramaprabho || || pahiramaprabho || tèpparambuludirci yippudemaraka
    nan drippu bèttaka cepattu ramaprabho || || pahiramaprabho || pattabhirama nipadapadmashrayula palimpuma
    bhadrashaili ramaprabho || || pahiramaprabho || pattabhirama ninu prabhudavani nammitini kashtapèttakanu
    cepattu ramaprabho ||
  devanagari: झम्प पाहिरामप्रभो पाहिरामप्रभो पाहिभद्राद्रि वैदेहिरामप्रभो ॥ पाहिरामप्रभो ॥ श्रीमन्महागुणस्तोमाभिराम
    मी नामकीर्तनलु वर्णिन्तु रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ सुन्दराकार हृन्मन्दिरोद्धार सी तेन्दिरा संयुतानन्द
    रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ इन्दिरा हृदयारविन्दादिरूढ सुन्दाराकार आनन्द रामप्रभो ॥ ॥ पाहिरामप्रभो
    ॥ ऎन्दुनेजूड मीसुन्दराननमु कन्दुनो कन्नुलिम्पॊन्द रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ पुण्यचारित्रलावण्य कारुण्य
    गां भीर्य दाक्षिण्य श्रीरामचन्द्रप्रभो ॥ ॥ पाहिरामप्रभो ॥ कन्दर्पजनक नायन्दु रञ्जिल सदा नन्दुडवै पूजलन्दु
    रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ इम्पुगा जॆवुलकु न्विन्दुगा नीकथल् कन्दुगा मिम्मु सॊम्पॊन्द रामप्रभो ॥
    ॥ पाहिरामप्रभो ॥ वन्दनमुचेसि मुनुलन्दरु घनुलैरि विन्दवैनट्टि गोविन्द रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ बृन्दारकादि
    सद्बृन्दार्चितावतार विन्द मुनि सन्दर्शितानन्द रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ तल्लिविनीवॆ मातण्ड्रिविनीवॆ
    मा धातवुनीवॆ माभ्रात रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ पल्लवाधरलैन गॊल्लभामलगूडि युल्लमलरङ्ग रञ्जिल्लु रामप्रभो
    ॥ ॥ पाहिरामप्रभो ॥ मल्लरङ्गम्बुनन्दॆल्ल मल्लुलजीरि यल्ल कंसुनि जम्पु मल्ल रामप्रभो ॥ ॥ पाहिरामप्रभो
    ॥ कॊल्ललुग नीमाय वॆल्लिविरियग जेय सल्लापमुन क्रीडसल्पु रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ तम्मुडुनु नीवु
    पार्श्वम्मुलञ्जेरि वि ल्लम्मुलॆक्कॆडि निल्चुटिम्मु रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ क्रम्मुकॊनिशात्रवुलु
    हुम्मनुचुवच्चॆदरु इम्मैनबाणमुलिम्मु रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ रम्मु नाकभयम्मु निम्मु नीपादमुल् नम्मिनानय्य
    श्रीरामचन्द्रप्रभो ॥ ॥ पाहिरामप्रभो ॥ कण्टि मी शङ्खम्मु कण्टि मी चक्रमु कण्टि मी पादमुल्गण्टि रामप्रभो
    ॥ ॥ पाहिरामप्रभो ॥ विण्टि महिम वॆन्नण्टि तम्मुडु नीवु जण्टरावय्य नावॆण्ट रामप्रभो ॥ ॥ पाहिरामप्रभो
    ॥ मेमु नीवारमैनामु रक्षिम्पुम न्नामु जागेल श्रीरामचन्द्रप्रभो ॥ ॥ पाहिरामप्रभो ॥ नामनोवीधिनि प्रेमतोनुण्डु
    मी भूमिजासहित जय रामचन्द्रप्रभो ॥ ॥ पाहिरामप्रभो ॥ मी महत्त्वम्मु विन मनमन्दु प्रेम वेमरुन् बुट्टु
    श्रीरामचन्द्रप्रभो ॥ ॥ पाहिरामप्रभो ॥ श्यामसुन्दर कोमलं जानकीमनः कामुकं त्वं भजे रामचन्द्रप्रभो ॥
    ॥ पाहिरामप्रभो ॥ कामितार्थमुलिच्चु नी महत्वमु विन्न ना मॊरालिञ्चु नास्वामि रामप्रभो ॥ ॥ पाहिरामप्रभो
    ॥ कामितप्रभुडवै प्रेमतो रक्षिञ्चु स्वामि साकेतपुरि रामचन्द्रप्रभो ॥ ॥ पाहिरामप्रभो ॥ अन्न रावन्न नीकन्न
    नामीद नॆन रुन्न वारेरि नायन्न रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ निन्नॆगाकनु मरे यन्युलगानन् गन्नतण्ड्रिविग
    मायन्न रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ वॆन्नदॊङ्गिलि तिन्न चिन्नकृष्णम्म नि न्नॆन्नगा वशमॆ रावन्न रामप्रभो
    ॥ ॥ पाहिरामप्रभो ॥ ऎन्नॆन्नो जन्ममुल नॆत्तजालनु इक निन्नॆ नॆम्मदिनि वर्णिन्तु रामप्रभो ॥ ॥ पाहिरामप्रभो
    ॥ ऎन्निविधमुलनैन निन्नॆ नम्मिन वानि मन्निञ्चि दयचेयुमन्न रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ पन्नगाधिपशायि
    भावनातीत आ पन्न नामनवि विनवन्न रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ मेटिवाक्यम्बु मीसाटिदैवम्बु मु म्माटिकिनि
    भुविलेदु मेटि रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ पाडुदुनु मिम्मु गॊनियाडुदुनु मोदमुन वेडुचुन्नानु गापाडु
    रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ वेडुकोगानॆ नीजोडुकाडुनु नीवु कूडि रारय्य नातोड रामप्रभो ॥ ॥ पाहिरामप्रभो
    ॥ नेडु नाकोर्कॆ लीडेरगाजेसि का पाडरा करिनेलु जाड रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ मूडुमूर्तुल कात्ममूलमै
    चॆन्नॊन्दु वाडवनि श्रुतुलु निन्नाडु रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ चूडु मीभक्तुलनु गूडु मीरिपुल गो राडु
    मीवल्ल गोविन्द रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ पुण्डरीकाक्ष मार्ताण्डवंशोद्भवा खण्डलस्तुत्य कोदण्ड रामप्रभो
    ॥ ॥ पाहिरामप्रभो ॥ कुण्डलिशयन भूमण्डलोद्धरण पा षण्डजनहरण कोदण्डरामप्रभो ॥ ॥ पाहिरामप्रभो ॥ निण्डुदयतोड
    नायण्ड बायकनु नी वुण्डि गापाडु कोदण्डरामप्रभो ॥ ॥ पाहिरामप्रभो ॥ जातकौतूहलं चक्षुकृत्यारमां पूतसीतापते
    दात रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ पातकुललो मॊदटि पातकुड नावण्टि पातकुनि कावुटे ख्याति रामप्रभो ॥ ॥ पाहिरामप्रभो
    ॥ भूतनाथुनि विल्लु ख्यातिगा खण्डिञ्चि सीतगैकॊन्न विख्यात रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ पूतनाकल्मषोद्धूत
    पॆ शत्रु सं हारि श्रीसीतासमेत रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ जातिनीतुलुलेक भूतलम्बुन दिरुगु घातकुल बरिमार्चु
    नेत रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ ऎप्पुडुनु गण्टिकि रॆप्पवलॆ गाचि न न्नॊप्पुगागावु मायप्प रामप्रभो ॥
    ॥ पाहिरामप्रभो ॥ एदया नीदया योदयाम्भोनिधी यादिलेदय्य नामीद रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ घोरराक्षस गर्वहार
    विश्वम्भरो द्धार गुणसान्द्रविस्तार रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ मोदमुन नीवु नन्नादुकोवय्य गो दावरी
    तीर भद्राद्रि रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ नीदु बाणम्बुलनु नादुशत्रुलबट्टि बाधिम्पकुन्नावदेमि रामप्रभो
    ॥ ॥ पाहिरामप्रभो ॥ आदिमध्यान्त बहिरान्तरात्मुडवनुचु वादिन्तुने जगन्नाथ रामप्रभो ॥ ॥ पाहिरामप्रभो ॥
    चालदेमि पदाब्जमुलसाटि यीपदु नाल्गुलोकम्बुल गूडि रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ एल यीलागु जागेल जेसॆदवु
    म म्मेलुकोवय्य मापालि रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ पालुवॆन्नलु म्रुच्चिलिन्तिवनि यशोद रोटगट्टिन मायचालु
    रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ कॊल्ललुग व्रेपल्लॆ पल्लवाधरुलतो नल्लबिल्लिगनु रञ्जिल्ल रामप्रभो ॥ ॥ पाहिरामप्रभो
    ॥ वालि नॊक्कम्मुनन् गूलवेसिन शौर्य शालियौ निनुदलतु जाल रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ सालभञ्जिकल निर्मूलम्बु
    चेयगा जालितिवि गोपालबाल रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ तालवृक्षमु लॊक्ककोल धरगूलगा लीलनेसिन बाहुशालि
    रामप्रभो ॥ शिलयैन यहल्य श्रीपादमुलु सोक नॆलतयै मिमु मदितलचॆ ॥ विनवय्य मनवि गैकॊनवय्य तप्पुलन् गनकय्य
    सम्मतिन्गॊनुचु रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ दानधर्मम्बुलुन् दपजपम्बुलु नीदु नामकीर्तनकु सरिरावु रामप्रभो
    ॥ ॥ पाहिरामप्रभो ॥ मानावमानमुलु महिनि नीवै युण्ड माकेल मदिनि ईचिन्त रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ ज्ञानयोगाभ्यासमन्दु
    नुण्डॆडिवारि कानन्दमयुडवैनावु रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ भानुवंशमुनन्दु मानवाधिपुडवै दानवुल बरिमार्चिनावु
    रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ अणुरेणु परिपूर्णुडौ हृदयवास ना मनवि विनु देवकीतनय रामप्रभो ॥ ॥ पाहिरामप्रभो
    ॥ मान्यमै आश्रितवदान्यमै सुजन स न्मान्यमै वॆलुगु मूर्धन्य रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ नित्यमै सत्यमै
    निर्मलम्बै महिनि दिव्यवंशोत्तंसमैन रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ सेव्यमै मीपदद्भाव्यमै सज्जन श्राव्यमै
    युण्डुनो दिव्य रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ गट्टिगा नीवुन पट्टुगा विहितमौ नट्टुगा मम्मु चेपट्टु रामप्रभो
    ॥ ॥ पाहिरामप्रभो ॥ दिट्टयगु ताटकिनिगॊट्टि वेगमॆ गाधि पट्टि यागमु गाचिनट्टि रामप्रभो ॥ ॥ पाहिरामप्रभो
    ॥ चुट्टुकॊनि कालिङ्गु डट्टहासमुचेय पट्टुकॊनि तलनॆक्किनट्टि रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ सन्ततमु नन्नु
    रक्षिन्तुवनि नम्मि मि म्मॆन्तुरा जानकीकान्त रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ पन्तमुन मी पादचिन्तनमु चेय
    ना वन्तलन्नियु मानुटॆन्त रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ विन्तगादय्य नेनिन्तनाडिनदि ना पन्तमुन मिम्मु
    भाविन्तु रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ शान्तमूर्तिनि रमाकान्तुडवनि चाल सन्तसम्बुन निन्नु नॆन्तु रामप्रभो
    ॥ ॥ पाहिरामप्रभो ॥ अक्षयम्बैन नीकुक्षिलो लोकमुल रक्षिञ्चितिवि लक्ष्मीवक्ष रामप्रभो ॥ ॥ पाहिरामप्रभो
    ॥ दन्तिवत्सल भक्तचिन्तामणी विश्व मन्तयुनु नीवु रक्षिञ्चु रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ पक्षिवाहन शत्रुनिक्षेपणा
    नन्नु रक्षिञ्चु मोक्षप्रदात रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ रक्षिञ्चि सज्जनुल वीक्षिञ्चि दुर्जनुल राक्षसुल
    शिक्षिञ्चिनावु रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ रक्षकुडवै जगद्रक्षणमुचेयगा राक्षसुल शिक्षिञ्चिनावु रामप्रभो
    ॥ ॥ पाहिरामप्रभो ॥ लक्ष्मीकटाक्ष वीक्षणधार वृष्टि मा कक्षयम्बुग कटाक्षिञ्चु रामप्रभो ॥ ॥ पाहिरामप्रभो
    ॥ रावया अभयम्बु लीवया नास्वामी नीवया गति देवराय रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ कावु कावुमटञ्चु काकासुरुडुराग
    काचि रक्षिञ्चिनावय्य रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ देवदेवोत्तमा देवेन्द्रसन्नुता काववेनन्नु श्रीरामचन्द्रप्रभो
    ॥ ॥ पाहिरामप्रभो ॥ भावजजनक ना बाधलन्नियुमान्पि ये विधम्बुनैन नेलु रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ श्रीवैष्णवुलपालि
    चिन्तामणिवि चाल सेवगैकॊनि करुणचेयु रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ भावमुन मिमुभक्ति सेविञ्चु जनुलकु कैवल्यमॊसगु
    श्रीरामचन्द्रप्रभो ॥ ॥ पाहिरामप्रभो ॥ गोपालुरनु गूडि यावुलनु मेपि आपदोद्धारकुडवैन रामप्रभो ॥ ॥ पाहिरामप्रभो
    ॥ नापालि श्रीराम भूपालका ननु कापाडराव गोपाल रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ सारमौशौर्य विस्तारमौ सुन्दरा
    कारसद्भक्तमन्दार रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ शरणागतत्राण बिरुदाङ्कितम्बैन वरमु नाकॊसगु येमरक रामप्रभो
    ॥ ॥ पाहिरामप्रभो ॥ श्रीराम रामेति श्रेष्ठमन्त्रमु सारॆ सारॆकुनु विन्तगा जदुव रामप्रभो ॥ ॥ पाहिरामप्रभो
    ॥ श्रीराम नीनाम चिन्तनामृतपान सारमे नादुमदि गोरु रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ चेरि मीपाद पद्माराधनमु
    चेय कोरिनानय्य श्रीरामचन्द्रप्रभो ॥ ॥ पाहिरामप्रभो ॥ घोरराक्षसगर्वहारि विश्वम्भरा भूरिगुणसान्द्र विस्तार
    रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ मारीचमायानिवार शरसन्धान धारुणीतनया विहार रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ परवासुदेव
    यक्षयपात्र मॊसगि न न्नरसि पोषिम्पगदवय्य रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ परधनम्बुनु परस्त्रील नपेक्षिञ्चु
    नरुकब्बुने मोक्षमरय रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ कामादिदुर्गुण स्तोमम्बुलडग मी नामामृतमॆ दिक्कु रामचन्द्रप्रभो
    ॥ ॥ पाहिरामप्रभो ॥ दुष्टुलगु दानवुल नष्टम्बुगा जेयगा बुट्टितिवि कौसल्य पट्टि रामप्रभो ॥ ॥ पाहिरामप्रभो
    ॥ कष्टपडलेनय्य पट्टाभिराम ना किष्टसम्पदलिच्चि येलु रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ केशवायनिन भवपाशमुलॊलगु
    स र्वेशकोटि शशिप्रकाश रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ नारायणा नीदु नामामृतं बॆपुडु पारायणमु चेतु नेनु
    रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ माधवायनियु सम्मोदमुन निनुगॊल्चु साधुसज्जनदयाम्भोधि रामप्रभो ॥ ॥ पाहिरामप्रभो
    ॥ गोविन्द गोविन्द गोपालकृष्णयनि गोपकुलु गॊनियाडु गोपरामप्रभो ॥ ॥ पाहिरामप्रभो ॥ विष्णुना सर्ववर्धिष्णुना
    तत्त्व भू यिष्णुना निर्मितं कृष्ण रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ श्रीधरा श्रीकरा श्रीनारसिंह गं गाधर
    स्तोत्र यानन्द रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ मत्स्यमै जलधिलो जॊच्चि सोमकुद्रुञ्चि तॆच्चि वेदमु लजुनकिस्ति
    रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ कूर्मरूपमु नॊन्दि कॊण्डमूपुनदाल्चि कूर्मितो नमृतम्बुगूर्चि रामप्रभो ॥
    ॥ पाहिरामप्रभो ॥ वराहरूपमुन वसुधगॊम्मुननॆत्ति सुरल रक्षिञ्चु दाशरथि रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ शरणन्न
    प्रह्लादु गरुणिञ्चि रक्षिम्प नरसिंहमूर्तिवैनट्टि रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ वामनत्वमुन भूदानमडिगियु
    बलिनि भूमिक्रिन्दनडञ्चि पॊल्चु रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ परशुरामुडनङ्ग नरपालकुलनॆल्ल नरसिपॊरिकॊन्न
    दाशरथि रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ श्रीराममूर्तिवै यारावणुनि तलल् पडगूर्चिनावु रामप्रभो ॥ ॥ पाहिरामप्रभो
    ॥ हलधरुडवै धरास्थलिपालकुलनॆल्ल बॊरिपुच्चि वॆलुगुमापालि रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ सिद्धसन्नुत मनोबद्धुण्डवै
    नीवु बौद्धुण्डवैति प्रबुद्ध रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ कलिकिरूपमुदाल्चि कलियुगम्बुन नीवु वॆलसितिवि
    भद्राद्रिनिलय रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ अव्ययुडवैन नीयवतारमुल जूचि दिव्युलैनारु मुनुलय्य रामप्रभो
    ॥ ॥ पाहिरामप्रभो ॥ श्रीरामनाममे वेलस्मरियिन्तु स्वामि दयचेयु सम्पदनु रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ अप्प
    शेषशयन यॆप्पुडु निनु मरुव नॊप्पुगा ब्रोवु वरदप्प रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ तॆप्परम्बुलुदीर्चि यिप्पुडेमरक
    नन् द्रिप्पु बॆट्टक चेपट्टु रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ पट्टाभिराम नीपादपद्माश्रयुल पालिम्पुमा भद्रशैलि
    रामप्रभो ॥ ॥ पाहिरामप्रभो ॥ पट्टाभिराम निनु प्रभुडवनि नम्मितिनि कष्टपॆट्टकनु चेपट्टु रामप्रभो ॥
