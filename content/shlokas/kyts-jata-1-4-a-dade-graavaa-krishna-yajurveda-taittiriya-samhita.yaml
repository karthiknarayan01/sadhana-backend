id: kyts-jata-1-4-a-dade-graavaa-krishna-yajurveda-taittiriya-samhita
category: stotram
name:
  english: KYTS Jata 1.4 A Dade Graavaa - Krishna Yajurveda Taittiriya Samhita
content:
  english: dade grava grava dade dade grava 'syasi grava grava 'si | asya ddhvarakri daddhvarakri dasya
    syaddhvarakrit | ddevebhyo devebhyo addhvarakrida ddhvarakri addhvarakridityaddhvara ndevebhyo devebhyo
    gambhiram | ima maddhvara maddhvara mima mima maddhvaram | nkridhi kridhyaddhvara maddhvara ttamena
    kridhi kridhyuttamena | uttamena pavina pavi no pavinendraye ndraya pavina pavinendraya | soma mindraye
    ndraya soma vrishtivani mindraye ndraya vrishtivanim vri~shtivani mindraya | vrishtivanimiti vrishti
    indraya tva tvendraye ndraya tva | tva vritraghne vritraghne tva vritraghna indraye ndraya vritraghne
    vritraghna indraya | vritraghna iti vritra indraya tva tvendraye ndraya tva | tva vritrature vritrature
    tva tva vritrature vritratura indraye ndraya vritrature vritratura indraya | vritratura iti vritra
    indraya tva tvendraye ndraya tva | tva 'bhimatighne 'bhimatighne tva abhimatighna indraye ndrayabhimatighne
    'bhimatighna indraya | abhimatighna ityabhimati indraya tva tvendraye ndraya tva | tva ''dityavata
    adityavate tva tva ''dityavate | adityavata indraye ndrayadityavata adityavata indraya | adityavata
    ityaditya indraya tva tvendraye ndraya tva | vyavate tva tva vishvade shshvatra vishvade vyavate shvatrah
    | vyavata iti vishvade sstha stha shvatra stha vritraturo vritraturah stha stha vritraturah | vritraturo
    radhogurta radhogurta vritraturo vritraturo radhogurtah | vritratura iti vritra radhogurta amritasyamritasya
    radhogurta radhogurta amritasya | radhogurta iti radhah amritasya patnih patni ramritasyamritasya
    patnih patni sta stah patnih patni stah | rdevi sta sta devih | rdevatra devatra devi ndevatra devatremam
    | dhattopahuta upahuta dhatta dhattopahutah | ssomasya somasyopahuta upahuta somasya pibata pibata
    somasya somasya pibata | pibatopahuta upahutah pibata pibatopahutah | yu~shmaka mupahuta upahuto yushmaka
    somah pibatu pibatu soma tpibatu pibatu yat | te soma soma te te soma | soma divi divi soma soma divi
    | rdivi divi jyotih | ura vantarikshe 'ntariksha ura vura vantarikshe | antarikshe tena tenantarikshe
    'ntarikshe tena | tenasma asmai tena tenasmai | asmai yajamanaya yajamanayasma asmai yajamanaya |
    yajamanayoruru yajamanaya yajamanayoru | uru raya rayoruru raya | raya kridhi kridhi raya raya kridhi
    | kridhyadhyadhi kridhi kridhyadhi | adhi datre datre 'dhyadhi datre | datre voco voco datre datre
    vocah | voco dhishane dhishane voco voco dhishane | dhishane vidu vidu dhishane dhishane vidu | dhishane
    iti dhishane | vidu sati sati vidu vidu sati | vi~dayethagm sati sati vidayetham | vidayetha murja
    murjam ndadhatha murja murja dadhatha murja murja mme ma urja murja mme me dhattam | sishtagm higmsishta
    apa guda guda gapa gapa gudak | uda gadhara gadhara guda guda gadharak | ktasta adhara gadhara tva
    ta sta stva tva disho disha stva tva dishah | disha a disho disha a | a dhavantu dhavantva dhavantu
    | dhavantvambamba dhavantu dhavantvamba | amba ni nyambamba ni | ni shvara svara ni ni shvara | te
    soma soma te te soma | nama jagrivi jagrivi nama nama jagrivi | jagrivi tasmai tasmai jagrivi jagrivi
    tasmai tasmai te te tasmai tasmai te | te soma soma te te soma | soma somaya somaya soma soma somaya
    | somaya svaha svaha somaya somaya svaha vaca spataye pataye vaco vaca spataye | pataye pavasva pavasva
    pataye pataye pavasva | npavasva pavasva vajinn | vajin vrisha vrisha vajin vrisha vrishno vrishno
    vrisha vrisha vrishnah | ngabhastiputo gabhastiputo gabhastiputo devo devo gabhastiputo gabhastiputo
    devah | gabhastiputa iti gabhasti ndevo devo devana pavitra masyasi pavitra mbhago bhago yesham bhago
    'syasi bhago bhago 'si | asi tebhya stebhyo 'syasi tebhyah | tebhya stva tva tebhya stebhya stva |
    ssvankrita stva tva svankritah | svankrito 'syasi svankrita rmadhumati rasyasi madhumatih | na isha
    isho no na ishah | ishaskridhi kridhisha ishaskridhi | bhya skridhi kridhi vishve bhya stva tva vishve
    tvendriyebhya indriyebhya stva tvendriyebhyah | indriyebhyo divyebhyo divyebhya indriyebhya indriyebhyo
    divyebhyah | divyebhyah parthivebhyah parthivebhyo divyebhyo divyebhyah parthivebhyah | parthivebhyo
    mano manah parthivebhyah parthivebhyo manah | mana stva tva mano mana stva | tva 'shtvashtu tva tva
    'shtu | urvantariksha mantariksha muru antariksha manvanvantariksha mantariksha manu | anvihihyanvanvihi
    | ihi svaha svahehihi svaha tva tva svaha svaha ssubhava stva tva subhavah | ssuryaya suryaya subhava
    suryaya devebhyo devebhya ssuryaya suryaya devebhyah | devebhya stva tva devebhyo devebhya stva |
    tva maricipebhyo maricipebhya stva tva maricipebhyah | maricipebhya esha esha maricipebhyo maricipebhya
    eshah | maricipebhya iti marici esha te ta esha esha te ryoni ste te yonih | yonih pranaya pranaya
    yoni ryonih pranaya | pranaya tva tva pranaya pranaya tva | upayamagrihito 'syasyupayamagrihita upayamagrihito
    'si | upayamagrihita ityupayama asyanta ranta rasyasyantah | ryaccha yacchanta ranta yaccha yaccha
    maghavann | soma murushyorushya soma urushya rayo raya urushyorushya rayah | ssagm sagm rayo raya
    isho yajasva yajasvesha isho yajasva | ryajasva yajasvantah | anta ste te 'nta ranta ste te dadhami
    dadhami te te dadhami | dadhami dyavaprithivi dyavaprithivi dadhami dadhami dyavaprithivi | dyavaprithivi
    anta ranta rdyavaprithivi dyavaprithivi antah | dyavaprithivi iti dyava rvanta ranta ruru | urvantariksha
    mantariksha muru antarikshagm sajosha ssajosha antariksha mantarikshagm sajoshah avaraih paraih parai
    ravarai ravaraih paraih 'ntaryame ca cantaryame | 'ntaryame maghavann | antaryama ityantah nmadayasva
    madayasva maghava madayasva svankrita ssvankrito madayasva madayasva svankritah | svankrito 'syasi
    svankrita rmadhumati rasyasi madhumatih | na isha isho no na ishah | ishaskridhi kridhisha ishaskridhi
    | bhyaskridhi kridhi vishve bhya stva tva vishve tvendriyebhya indriyebhya stva tvendriyebhyah | indriyebhyo
    divyebhyo divyebhya indriyebhya indriyebhyo divyebhyah | divyebhyah parthivebhyah parthivebhyo divyebhyo
    divyebhyah parthivebhyah | parthivebhyo mano manah parthivebhyah parthivebhyo manah | mana stva tva
    mano mana stva | tva 'shtvashtu tva tva 'shtu | urvantariksha mantariksha muru antariksha manvanvantariksha
    mantariksha manu | anvi hihyanvan vihi | ihi svaha svahehihi svaha tva tva svaha svaha ssubhava stva
    tva subhavah | ssuryaya suryaya subhava suryaya devebhyo devebhya ssuryaya suryaya devebhyah | devebhya
    stva tva devebhyo devebhya stva | tva maricipebhyo maricipebhya stva tva maricipebhyah | maricipebhya
    esha esha maricipebhyo maricipebhya eshah | maricipebhya iti marici esha te ta esha esha te ryoni
    ste te yonih | yoni rapanayapanaya yoni apanaya tva tva 'panayapanaya tva | a vayo vayo a vayo | vayo
    bhusha bhusha vayo vayo bhusha | shshucipa bhusha bhusha shucipah | shucipa upopa shucipa upa no na
    upopa nah | te niyuto niyuta ste te niyutah | niyuto vishvavara vishvavara niyuto niyuto vishvavara
    | vishvavareti vishva upo te ta upo upo te | te andho 'ndha ste te andhah | mmadya mandho 'ndho madya
    madya mayamyayami madya ayami yasya yasyaya myayami yasya | yasya deva deva yasya yasya deva | deva
    dadhishe dadhishe deva deva dadhishe | purvapeyamiti purva upayamagrihito 'syasyupayamagrihita upayamagrihito
    'si | upayamagrihita ityupayama asi vayave vayave tva tva vayave vayave tvendravayu indravayu tva
    tvendravayu | indravayu ima ima indravayu indravayu ime | indravayu itindra ssuta ima ime sutah |
    upa prayobhih prayobhi rupopa prayobhih | prayobhira prayobhih prayobhira | prayobhiriti prayah gata
    mindava indavo gata va~ mindava indavo vam | va mushantyushanti vam ushanti hi hyushantyushanti hi
    | upayamagrihito 'syasyupayamagrihita upayamagrihito 'si | upayamagrihita ityupayama asindravayubhya
    mindravayubhya masyasindravayubhya ntva tvendravayubhya mindravayubhya indravayubhyamiti esha te ta
    esha esha te ryoni ste te yonih | mmitravaruna mitravaruna vam mmitravaruna | mitravaruna suta ssuto
    mitravaruna mitravaruna sutah | mitravaruneti mitra soma ritavridhartavridha soma shruta miheha shrutam
    | upayamagrihito 'syasyupayamagrihita upayamagrihito 'si | upayamagrihita ityupayama asi mitravarunabhya
    mmitravarunabhya masyasi mitravarunabhyam | ntva tva mitravarunabhya mitravarunabhyamiti mitra esha
    te ta esha esha te ryoni ste te yonih | ritayubhya mritayubhyam ntva tvartayubhya mritayubhya ritayubhyamityritayu
    kasha madhumati madhumati kasha kasha madhumati | madhumatyashvina 'shvina madhumati madhumatyashvina
    | ashvina sunritavati sunritavatyashvina 'shvina sunritavati | sunritavatiti sunrita ntaya taya yajnam
    | mimikshatamiti mimikshatam | upayamagrihito 'syasyupayamagrihita upayamagrihito 'si | upayamagrihita
    ityupayama asyashvibhya mashvibhya masyasyashvibhya ntva tva 'shvibhya mashvibhya ashvibhyamityashvi
    esha te ta esha esha te ryoni ste te yonih | ntva tva maddhvi prataryujau vi vi prataryujau prataryujaviti
    pratah vi~ vi mucyetham | mucyetha mashvina vashvinau mucyetha mmucyetha mashvinau | ashvina va 'shvina
    vashvina va | ngacchata mihe ha gacchatam | gacchatamiti gacchatam | asya somasya somasyasyasya somasya
    | somasya pitaye pitaye somasya somasya pitaye upayamagrihito 'syasyupayamagrihita upayamagrihito
    'si | upayamagrihita ityupayama asyashvibhya mashvibhya masyasyashvibhya ntva tva 'shvibhya mashvibhya
    ashvibhyamityashvi esha te ta esha esha te ryoni ste te yonih | yoni rashvibhya mashvibhyam ntva tva
    'shvibhya mashvibhya ashvibhyamityashvi ve~no veno 'ya mayam dveno vena shcodayat | tprishnigarbhah
    prishnigarbha shcodayac codaya prishnigarbha jyotirjarayu rjyotirjarayuh prishnigarbhah prishnigarbha
    jyotirjarayuh | prishnigarbha iti prishni jyotirjarayu rajaso rajaso jyotirjarayu rjyotirjarayu rajasah
    | jyotirjarayuriti jyotih rajaso vimane vimane rajaso rajaso vimane ima mapa mapa mima mima mapam
    | apagm sangame sangame 'pa mapagm sangame | sangame suryasya suryasya sangame sangame suryasya |
    suryasya suryasya shishu na vipra vipra na na viprah rvipra vipra matibhih | matibhi rihanti rihanti
    matibhi rihantiti rihanti | upayamagrihito 'syasyupayamagrihita upayamagrihito 'si | upayamagrihita
    ityupayama asi shandaya shandayasyasi shandaya | shandaya tva tva shandaya shandaya tva | esha te
    ta esha esha te ryoni ste te yonih | pratnatha purvatha purvatha purvatha vishvatha vishvatha purvatha
    purvatha vishvatha vishvathemathematha vishvatha vishvathematha njyeshthatati mimathematha jyeshthatatimiti
    jyeshtha barhishadamiti bar mpraticinagm suvarvida suvarvidamiti suvah ndohase dohase vrijanam dohase
    gira gira dohase dohase gira | ngira gira ''shum | njayanta mashu mashu jayanta manvanu jayanta anu
    yasu yasvanvanu yasu | yasu vardhase vardhase yasu yasu vardhase | vardhasa iti vardhase | upayamagrihito
    'syasyupayamagrihita upayamagrihito 'si | upayamagrihita ityupayama asi markaya markayasyasi markaya
    | markaya tva tva markaya markaya tva | esha te ta esha esha te ryoni ste te yonih | yonih prajah
    praja yoni prajah pahi pahi prajah prajah pahi | ye deva deva ye ye devah | deva divi divi deva deva
    divi | divyeka dashaikadasha divi divyekadasha | ekadasha stha sthaika dashaikadasha stha | stha stha
    prithivyam | prithivya madhyadhi prithivya adhyeka dashaikadashadhya dhyekadasha | ekadasha stha sthaika
    dashaikadasha stha | sstha sthaphsushadah | aphsushado mahina mahina 'phsushado aphsushada ityaphsu
    mahi naika dashaikadasha mahina mahinaikadasha | ekadasha stha sthaika dashaikadasha stha | stha te
    te stha stha te | te deva devaste te devah | ndeva deva yajnam | njushaddhva mima mima jushaddhva
    mupayamagrihita upayamagrihito jushaddhva njushaddhva mupayamagrihitah | upayamagrihito 'syasyupayamagrihita
    upayamagrihito 'si | upayamagrihita ityupayama grayano jinva jinva sva njinva jinva yajnam | njinva
    jinva yajnam njinva jinva yajnapatim | yajnapati mabhyabhi yajnapatim yajnapatimiti yajna abhi savana
    savana 'bhyabhi savana | savana pahi pahi savana savana pahi | rvishnuh pahi pahi vishnuh | rvishnu
    stvam | ndriyena pahi pahindriyena | indriyenaisha esha indriyene esha te ta esha esha te ryoni ste
    te yonih | bhya stva tva vishve tva devebhyo devebhya stva tva devebhyah | devebhya iti devebhyah
    | || ttraya straya stri trayashca ca traya strayashca | ca ganino ganinashca ca ganinah | ganino rujanto
    rujanto ganino ganino rujantah | rujanto rujanto diva rudra rudra diva mprithivigm rudra rudrah prithivim
    | ca sacante sacante ca ca sacante | sacanta iti sacante | ekadashaso aphsushado 'phsushada ekadashasa
    ekadashaso aphsushadah | aphsushadah sutagm suta maphsushado aphsushada ityaphsu savanaya savanaya
    jushanta savanaya vishve vishve savanaya savanaya vishve upayamagrihito 'syasyupayamagrihita upayamagrihito
    'si | upayamagrihita ityupayama grayano jinva jinva sva njinva jinva yajnam | njinva jinva yajnam
    njinva jinva yajnapatim | yajnapati mabhyabhi yajnapatim yajnapatimiti yajna abhi savana savana 'bhyabhi
    savana | savana pahi pahi savana savana pahi | rvishnuh pahi pahi vishnuh | rvishnu stvam | ndriyena
    pahi pahindriyena | indriyenaisha esha indriyene esha te ta esha esha te ryoni ste te yonih | bhya
    stva tva vishve tva devebhyo devebhya stva tva devebhyah | devebhya iti devebhyah | || upayamagrihito
    'syasyupayamagrihita upayamagrihito 'si | upayamagrihita ityupayama asindraye ndrayasyasindraya |
    indraya tva tvendraye ndraya tva | tva brihadvate brihadvate tva tva brihadvate | brihadvate vayasvate
    vayasvate brihadvate brihadvate vayasvate | brihadvata iti brihat vayasvata ukthayuva ukthayuve vayasvate
    vayasvata ukthayuve dyadukthayuva ukthayuve yat | ukthayuva ityuktha ta indre ndra te ta indra | dbrihadindre
    ndra brihat | vaya stasmai tasmai vayo vaya stasmai tva tva tasmai tasmai tva vishnave vishnave tva
    tva vishnave | vishnave tva tva vishnave vishnave tva | esha te ta esha esha te ryoni ste te yonih
    | yoni rindraye ndraya yoni ryoni rindraya | indraya tva tvendraye ndraya tva | tvokthayuva ukthayuve
    ukthayuva ityuktha ndivo divo murdhana ndivo divo aratim | mprithivyah prithivya arati marati mprithivyah
    prithivya vai vaishvanara mritaya rtaya vaishvanaram njata mritaya rtaya jatam | agnimityagnim | samraja
    matithi matithigm samraja njanana matithi matithi njanayanta janayanta patra janayanta deva deva janayanta
    janayanta devah | upayamagrihito 'syasyupayamagrihita upayamagrihito 'si | upayamagrihita ityupayama
    tva tva 'gnaye 'gnaye tva vaishvanaraya vaishvanaraya tva tva vaishvanaraya | vaishvanaraya dhruvo
    dhruvo vai shvanaraya vaishvanaraya dhruvah | 'syasi dhruvo dhruvo 'si | rdhruvakshiti rasyasi dhruvakshitih
    | dhruvakshitiriti dhruva ndhruvatamo dhruvatamo dhruvana dhruvatamo 'cyutana macyutana ndhruvatamo
    dhruvatamo 'cyutanam | dhruvatama iti dhruva acyutana macyutakshittamo 'cyutakshittamo 'cyutana macyutana
    macyutakshittamah | acyutakshittama esha esho cyutakshittamo 'cyutakshittama eshah | acyutakshittama
    ityacyutakshit esha te ta esha esha te ryoni ste te yonih | yoni ragnaye 'gnaye yoni tva tva 'gnaye
    'gnaye tva vaishvanaraya vaishvanaraya tva tva vaishvanaraya | vaishvanarayeti vaishvanaraya | ||
    ca madhavo madhavashca ca madhavah | madhavashca ca madhavo madhavashca | shshukrashca ca shukrah
    | shshucishca ca shucih | ca nabho nabhashca ca nabhah | nabhashca ca nabho nabhashca | ca nabhasyo
    nabhasyashca ca nabhasyah | nabhasyashca ca nabhasyo nabhasyashca | ce sha ishashca ce shah | ishashca
    ce sha ishashca | corja urjashca corjah | urjashca corja urjashca | ca sahasyah sahasyashca ca sahasyah
    | sahasyashca ca sahasyah sahasyashca | ca tapa stapashca ca tapah | tapashca ca tapa stapashca |
    ca tapasya stapasyashca ca tapasyah | tapasyashca ca tapasya stapasyashca | copayamagrihita upayamagrihitashca
    copayamagrihitah | upayamagrihito 'syasyupayamagrihita upayamagrihito 'si | upayamagrihita ityupayama
    syasyagmhaspatyaya | haspatyaya tva tva mpata masyasya patam | dhiyeshiteshita dhiya dhiyeshita |
    upayamagrihito 'syasyupayamagrihita upayamagrihito 'si | upayamagrihita ityupayama asindragnibhya
    mindragnibhya masyasindragnibhya ntva tvendragnibhya mindragnibhya indragnibhyamiti esha te ta esha
    esha te ryoni ste te yonih | yonirindragnibhya mindragnibhyam ryonirindragnibhya ntva tvendragnibhya
    mindragnibhya indragnibhyamiti shanidhrita omasa omasa shcar carshanidhrito vishve vishve car carshanidhrita
    iti car vishve devaso devaso vishve vishve devasah | devasa a devaso devasa a | dashvagmso dashusho
    dashusho dashvagmso dashvagmso dashushah | dashushah sutagm suta ndashusho dashushah sutam | upayamagrihito
    'syasyupayamagrihita upayamagrihito 'si | upayamagrihita ityupayama bhya stva tva vishve tva devebhyo
    devebhya stva tva devebhyah | devebhya esha esha devebhyo devebhya eshah | esha te ta esha esha te
    ryoni ste te yonih | bhya stva tva vishve tva devebhyo devebhya stva tva devebhyah | devebhya iti
    devebhyah | || vavridhana makavari makavarim va~vridhana makavarim | ndivya makavari makavari divyagm
    shasagm shasa ndivyagm shasam | shasa mindra mindra shasagm shasa mindra vishvasaha mavase 'vase vishvasaham
    vi~shvasaha mavase | vishvasahamiti vishva avase nutanaya nutanayavase 'vase nutanaya | nnutanaya
    nutanayogram | ugragm sahodagm sahoda mugra mugragm sahodam | sahoda mihe ha sahodagm sahoda miha
    | tagm huvema huvema ta upayamagrihito 'syasyupayamagrihita upayamagrihito 'si | upayamagrihita ityupayama
    asindraye ndrayasyasindraya | indraya tva tvendraye ndraya tva | tva marutvate marutvate tva tva marutvate
    | marutvata esha esha marutvate marutvata eshah | esha te ta esha esha te ryoni ste te yonih | yoni
    rindraye ndraya yoni ryoni rindraya | indraya tva tvendraye ndraya tva | tva marutvate marutvate tva
    tva marutvate | marutvata iti marutvate | || indra marutvo marutva indre ndra marutvah | marutva ihe
    ha marutvo marutva iha | iha pahi pahihe ha pahi | ryate yatha yatha sharyate | sharyate apibo 'piba
    ssutasya sutasyapibo 'piba sutasyeti sutasya | tava praniti praniti tava tava praniti | praniti tava
    tava praniti praniti tava | tava shura shura tava tava shura | nchura shura sharmann | a vivasanti
    vivasantya vivasanti | vivasanti kavayah kavayo vivasanti vivasanti kavayah | ssuyajnah kavayah kavayah
    suyajnah | upayamagrihito 'syasyupayamagrihita upayamagrihito 'si | upayamagrihita ityupayama asindraye
