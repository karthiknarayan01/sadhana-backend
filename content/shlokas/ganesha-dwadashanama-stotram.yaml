id: ganesha-dwadashanama-stotram
category: stotram
name:
  english: Ganesha Dwadashanama Stotram
content:
  english: shuklambaradharam vishnum shashivarnam caturbhujam | prasannavadanam dhyayetsarvavighnopashantayeh
    || || abhipsitartha sidhyartham pujito yah surasuraih | sarvavighnaharastasmai ganadhipataye namah
    || || gananamadhipashcando gajavaktrastrilocanah | prasanno bhava me nityam varadatarvinayaka || ||
    sumukhashcaikadantashca kapilo gajakarnakah | lambodarashca vikato vighnanasho vinayakah || || dhumraketurganadhyaksho
    phalacandro gajananah | dvadashaitani namani ganeshasya tu yah pathet || || vidyarthi labhate vidyam
    dhanarthi vipulam dhanam | ishtakamam tu kamarthi dharmarthi mokshamakshayam || || vidhyarambhe vivahe
    ca praveshe nirgame tatha | sangrame sankate caiva vighnastasya na jayate || || || iti mudgalapuranoktam
    shriganeshadvadashanamastotram sampurnam ||
  devanagari: शुक्लाम्बरधरं विष्णुं शशिवर्णं चतुर्भुजम् । प्रसन्नवदनं ध्यायेत्सर्वविघ्नोपशान्तयेः ॥ ॥
    अभीप्सितार्थ सिध्यर्थं पूजितो यः सुरासुरैः । सर्वविघ्नहरस्तस्मै गणाधिपतये नमः ॥ ॥ गणानामधिपश्चण्डो
    गजवक्त्रस्त्रिलोचनः । प्रसन्नो भव मे नित्यं वरदातर्विनायक ॥ ॥ सुमुखश्चैकदन्तश्च कपिलो गजकर्णकः । लम्बोदरश्च
    विकटो विघ्ननाशो विनायकः ॥ ॥ धूम्रकेतुर्गणाध्यक्षो फालचन्द्रो गजाननः । द्वादशैतानि नामानि गणेशस्य तु
    यः पठेत् ॥ ॥ विद्यार्थी लभते विद्यां धनार्थी विपुलं धनम् । इष्टकामं तु कामार्थी धर्मार्थी मोक्षमक्षयम्
    ॥ ॥ विध्यारम्भे विवाहे च प्रवेशे निर्गमे तथा । सङ्ग्रामे सङ्कटे चैव विघ्नस्तस्य न जायते ॥ ॥ ॥ इति
    मुद्गलपुराणोक्तं श्रीगणेशद्वादशनामस्तोत्रं सम्पूर्णम् ॥
