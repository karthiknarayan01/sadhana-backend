id: sarasvasto
category: stotram
name:
  english: sarasvasto
  devanagari: सरस्वस्तो
content:
  english: shrisarasvatistotram shriganeshaya namah | shvetapadmasana devi shvetapushpopashobhita | shvetambaradhara
    nitya shvetagandhanulepana || 1|| shvetakshi shuklavastra ca shvetacandanacarcita | varada siddhagandharvairrishibhih
    stuyate sada || 2|| stotrenanena tam devim jagaddhatrim sarasvatim | ye smaranti trikaleshu sarvavidyam
    labhanti te || 3|| ye stuvanti ya devi stuyate nityam brahmendrasurakinnaraih | sa mamaivastu jihvagre
    padmahasta sarasvati || 4|| iti shrisarasvatistotram sampurnam |
  devanagari: श्रीसरस्वतीस्तोत्रम् श्रीगणेशाय नमः । श्वेतपद्मासना देवी श्वेतपुष्पोपशोभिता । श्वेताम्बरधरा
    नित्या श्वेतगन्धानुलेपना ॥ १॥ श्वेताक्षी शुक्लवस्त्रा च श्वेतचन्दनचर्चिता । वरदा सिद्धगन्धर्वैरृषिभिः
    स्तूयते सदा ॥ २॥ स्तोत्रेणानेन तां देवीं जगद्धात्रीं सरस्वतीम् । ये स्मरन्ति त्रिकालेषु सर्वाविद्यां
    लभन्ति ते ॥ ३॥ ये स्तुवन्ति या देवी स्तूयते नित्यं ब्रह्मेन्द्रसुरकिन्नरैः । सा ममैवास्तु जिह्वाग्रे
    पद्महस्ता सरस्वती ॥ ४॥ इति श्रीसरस्वतीस्तोत्रं सम्पूर्णम् ।
