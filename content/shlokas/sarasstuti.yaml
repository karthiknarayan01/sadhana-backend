id: sarasstuti
category: stotram
name:
  english: sarasstuti
  devanagari: सरस्स्तुति
content:
  english: nirmalasuprabhabhih shighram vinashaya manogatamandhakaram || 11|| brahma jagat srijati palayatindireshah
    shambhurvinashayati devi tava prabhavaih | na syatkripa yadi tava prakataprabhave na syuh kathamcidapi
    te nijakaryadakshah || 12|| lakshmirmedha dhara pushtirgauri trishtih prabha dhritih | etabhih pahi
    tanubhirashtabhirmam sarasvati || 13|| sarasavatyai namo nityam bhadrakalyai namo namah veda
  devanagari: निर्मलसुप्रभाभिः शीघ्रं विनाशय मनोगतमन्धकारम् ॥ ११॥ ब्रह्मा जगत् सृजति पालयतीन्दिरेशः शम्भुर्विनाशयति
    देवि तव प्रभावैः । न स्यात्कृपा यदि तव प्रकटप्रभावे न स्युः कथंचिदपि ते निजकार्यदक्षाः ॥ १२॥ लक्ष्मिर्मेधा
    धरा पुष्टिर्गौरी तृष्टिः प्रभा धृतिः । एताभिः पाहि तनुभिरष्टभिर्मां सरस्वती ॥ १३॥ सरसवत्यै नमो नित्यं
    भद्रकाल्यै नमो नमः वेद
meaning: {}
