id: siddhilakshmistotram
category: stotram
name:
  english: siddhilakshmistotram
  devanagari: सिद्धिलक्ष्मीस्तोत्रम्
content:
  english: mama samasta duhkhakleshapidadaridryavinashartham sarvalakshmiprasannakaranartham mahakalimahalakshmimahasarasvatidevataprityartham
    ca siddhilakshmistotrajape viniyogah | om siddhilakshmi angushthabhyam namah | om hrim vishnuhridaye
    tarjanibhyam namah | om klim amritanande madhyamabhyam namah | om shrim daityamalini anamikabhyam
    namah | om tam tejahprakashini kanishthikabhyam namah | om hrim klim shrim brahmi vaishnavi maheshvari
    karatalakaraprishthabhyam namah | evam hridayadinyasah | om siddhilakshmi hridayaya namah | om hrim
    vaishnavi shirase svaha | om klim amritanande shikhayai vaushat | om shrim daityamalini kavacaya hum
    | om tam tejahprakashini netradvayaya vaushat | om hrim klim shrim brahmim vaishnavim phat || atha
    dhyanam || brahmim ca vaishnavim bhadram shadbhujam ca caturmukham | trinetram ca trishulam ca padmacakragadadharam
    || 1|| pitambaradharam devim nanalankarabhushitam | tejahpunjadharam shreshtham dhyayedbalakumarikam
    || 2|| omkaralakshmirupena vishnorhridayamavyayam | vishnumanandamadhyastham hrimkarabijarupini ||
    3|| om klim amritanandabhadre sadya anandadayini | om shrim daityabhaksharadam shaktimalini shatrumardini
    || 4|| tejahprakashini devi varada shubhakarini | brahmi ca vaishnavi bhadra kalika raktashambhavi
    || 5|| akarabrahmarupena omkaram vishnumavyayam | siddhilakshmi paralakshmi lakshyalakshmi namo'stute
    || 6|| suryakotipratikasham candrakotisamaprabham | tanmadhye nikare sukshmam brahmarupavyavasthitam
    || 7|| omkaraparamanandam kriyate sukhasampada | sarvamangalamangalye shive sarvarthasadhike || 8||
    prathame tryambaka gauri dvitiye vaishnavi tatha | tritiye kamala prokta caturthe surasundari || 9||
    pancame vishnupatni ca shashthe ca vaishnavi tatha | saptame ca vararoha ashtame varadayini || 10||
    navame khadgatrishula dashame devadevata | ekadashe siddhilakshmirdvadashe lalitatmika || 11|| etatstotram
    pathantastvam stuvanti bhuvi manavah | sarvopadravamuktaste natra karya vicarana || 12|| ekamasam
    dvimasam va trimasam ca caturthakam | pancamasam ca shanmasam trikalam yah pathennarah || 13|| brahmanah
    kleshato duhkhadaridra bhayapiditah | janmantarasahasreshu mucyante sarvakleshatah || 14|| alakshmirlabhate
    lakshmimaputrah putramuttamam | dhanyam yashasyamayushyam vahnicaurabhayeshu ca || 15|| shakinibhutavetalasarvavyadhinipatake
    | rajadvare mahaghore sangrame ripusankate || 16|| sabhasthane shmashane ca karageharibandhane | asheshabhayasampraptau
    siddhilakshmim japennarah || 17|| ishvarena kritam stotram praninam hitakaranam | stuvanti brahmana
    nityam daridryam na ca vardhate || 18|| ya shrih padmavane kadambashikhare rajagrihe kunjare shvete
    cashvayute vrishe ca yugale yajne ca yupasthite | shankhe devakule narendrabhavani gangatate gokule
    sa shristishthatu sarvada mama grihe bhuyatsada nishcala || 19|| || iti shribrahmandapurane ishvaravishnusamvade
    daridryanashanam siddhilakshmistotram sampurnam ||
  devanagari: मम समस्त दुःखक्लेशपीडादारिद्र्यविनाशार्थं सर्वलक्ष्मीप्रसन्नकरणार्थं महाकालीमहालक्ष्मीमहासरस्वतीदेवताप्रीत्यर्थं
    च सिद्धिलक्ष्मीस्तोत्रजपे विनियोगः । ॐ सिद्धिलक्ष्मी अङ्गुष्ठाभ्यां नमः । ॐ ह्रीं विष्णुहृदये तर्जनीभ्यां
    नमः । ॐ क्लीं अमृतानन्दे मध्यमाभ्यां नमः । ॐ श्रीं दैत्यमालिनी अनामिकाभ्यां नमः । ॐ तं तेजःप्रकाशिनी
    कनिष्ठिकाभ्यां नमः । ॐ ह्रीं क्लीं श्रीं ब्राह्मी वैष्णवी माहेश्वरी करतलकरपृष्ठाभ्यां नमः । एवं हृदयादिन्यासः
    । ॐ सिद्धिलक्ष्मी हृदयाय नमः । ॐ ह्रीं वैष्णवी शिरसे स्वाहा । ॐ क्लीं अमृतानन्दे शिखायै वौषट् । ॐ
    श्रीं दैत्यमालिनी कवचाय हुम् । ॐ तं तेजःप्रकाशिनी नेत्रद्वयाय वौषट् । ॐ ह्रीं क्लीं श्रीं ब्राह्मीं
    वैष्णवीं फट् ॥ अथ ध्यानम् ॥ ब्राह्मीं च वैष्णवीं भद्रां षड्भुजां च चतुर्मुखाम् । त्रिनेत्रां च त्रिशूलां
    च पद्मचक्रगदाधराम् ॥ १॥ पीताम्बरधरां देवीं नानालङ्कारभूषिताम् । तेजःपुञ्जधरां श्रेष्ठां ध्यायेद्बालकुमारिकाम्
    ॥ २॥ ॐकारलक्ष्मीरूपेण विष्णोर्हृदयमव्ययम् । विष्णुमानन्दमध्यस्थं ह्रींकारबीजरूपिणी ॥ ३॥ ॐ क्लीं अमृतानन्दभद्रे
    सद्य आनन्ददायिनी । ॐ श्रीं दैत्यभक्षरदां शक्तिमालिनी शत्रुमर्दिनी ॥ ४॥ तेजःप्रकाशिनी देवी वरदा शुभकारिणी
    । ब्राह्मी च वैष्णवी भद्रा कालिका रक्तशाम्भवी ॥ ५॥ आकारब्रह्मरूपेण ॐकारं विष्णुमव्ययम् । सिद्धिलक्ष्मि
    परालक्ष्मि लक्ष्यलक्ष्मि नमोऽस्तुते ॥ ६॥ सूर्यकोटिप्रतीकाशं चन्द्रकोटिसमप्रभम् । तन्मध्ये निकरे सूक्ष्मं
    ब्रह्मरूपव्यवस्थितम् ॥ ७॥ ॐकारपरमानन्दं क्रियते सुखसम्पदा । सर्वमङ्गलमाङ्गल्ये शिवे सर्वार्थसाधिके
    ॥ ८॥ प्रथमे त्र्यम्बका गौरी द्वितीये वैष्णवी तथा । तृतीये कमला प्रोक्ता चतुर्थे सुरसुन्दरी ॥ ९॥ पञ्चमे
    विष्णुपत्नी च षष्ठे च वैष्णवी तथा । सप्तमे च वरारोहा अष्टमे वरदायिनी ॥ १०॥ नवमे खड्गत्रिशूला दशमे
    देवदेवता । एकादशे सिद्धिलक्ष्मीर्द्वादशे ललितात्मिका ॥ ११॥ एतत्स्तोत्रं पठन्तस्त्वां स्तुवन्ति भुवि
    मानवाः । सर्वोपद्रवमुक्तास्ते नात्र कार्या विचारणा ॥ १२॥ एकमासं द्विमासं वा त्रिमासं च चतुर्थकम् ।
    पञ्चमासं च षण्मासं त्रिकालं यः पठेन्नरः ॥ १३॥ ब्राह्मणाः क्लेशतो दुःखदरिद्रा भयपीडिताः । जन्मान्तरसहस्रेषु
    मुच्यन्ते सर्वक्लेशतः ॥ १४॥ अलक्ष्मीर्लभते लक्ष्मीमपुत्रः पुत्रमुत्तमम् । धन्यं यशस्यमायुष्यं वह्निचौरभयेषु
    च ॥ १५॥ शाकिनीभूतवेतालसर्वव्याधिनिपातके । राजद्वारे महाघोरे सङ्ग्रामे रिपुसङ्कटे ॥ १६॥ सभास्थाने श्मशाने
    च कारागेहारिबन्धने । अशेषभयसम्प्राप्तौ सिद्धिलक्ष्मीं जपेन्नरः ॥ १७॥ ईश्वरेण कृतं स्तोत्रं प्राणिनां
    हितकारणम् । स्तुवन्ति ब्राह्मणा नित्यं दारिद्र्यं न च वर्धते ॥ १८॥ या श्रीः पद्मवने कदम्बशिखरे राजगृहे
    कुञ्जरे श्वेते चाश्वयुते वृषे च युगले यज्ञे च यूपस्थिते । शङ्खे देवकुले नरेन्द्रभवनी गङ्गातटे गोकुले
    सा श्रीस्तिष्ठतु सर्वदा मम गृहे भूयात्सदा निश्चला ॥ १९॥ ॥ इति श्रीब्रह्माण्डपुराणे ईश्वरविष्णुसंवादे
    दारिद्र्यनाशनं सिद्धिलक्ष्मीस्तोत्रं सम्पूर्णम् ॥
