id: nijatmashtakastotram
category: stotram
name:
  english: nijatmashtakastotram
  devanagari: निजात्माष्टकस्तोत्रम्
content:
  english: nihsandigdha va atyanta shantasvarupi asalelya caitanyarupa va anandarupa atmarupala bhajave
    || 8|| nijatmashtakam ye pathantiha bhaktah sadacarayuktah svanishthah prashantah | bhavantiha te
    brahma vedapramanat tathaivashisha nishcitam nishcitam me || 9|| je sadacari atmyavara nishtha thevuna
    mhanajeca atmacintanata ramamana houna va shanti thevuna he nijatmashtaka stotra mhanatata te upanishadancya
    sanganyavaruna va tyacapramane majhya ashirvadane yetheca nishcitapane brahmasvarupa hotata || 9||
  devanagari: निःसन्दिग्ध व अत्यन्त शान्तस्वरूपी असलेल्या चैतन्यरूप व आनन्दरूप आत्मरूपाला भजावे ॥ ८॥ निजात्माष्टकं
    ये पठन्तीह भक्ताः सदाचारयुक्ताः स्वनिष्ठाः प्रशान्ताः । भवन्तीह ते ब्रह्म वेदप्रमाणात् तथैवाशिषा निश्चितं
    निश्चितं मे ॥ ९॥ जे सदाचारी आत्म्यावर निष्ठा ठेवून म्हणजेच आत्मचिन्तनात रममाण होऊन व शान्ति ठेवून
    हे निजात्माष्टक स्तोत्र म्हणतात ते उपनिषदाञ्च्या साङ्गण्यावरून व त्याचप्रमाणे माझ्या आशीर्वादाने येथेच
    निश्चितपणे ब्रह्मस्वरूप होतात ॥ ९॥
