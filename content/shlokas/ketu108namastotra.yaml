id: ketu108namastotra
category: stotram
name:
  english: ketu108namastotra
  devanagari: केतु१०८नामस्तोत्र
content:
  english: rinu namani japyani keto ratha mahamate | ketuh sthulashirashcaiva shiromatro dhvajakritih
    || 1|| navagrahayutah simhikasurigarbhasambhavah | mahabhitikarashcitravarno vai pimgaḻakshakah ||
    2|| sa phalodhumrasamkashah tikshnadamshtro mahoragah | raktanetrashcitrakari tivrakopo mahasurah
    || 3|| krurakanthah krodhanidhishchayagrahavisheshakah | antyagraho mahashirsho suryarih pushpavadgrahi
    || 4|| varahasto gadapanishcitravastradharastatha | citradhvajapatakashca ghorashcitrarathashshikhi
    || 5|| kuḻutthabhakshakashcaiva vaiduryabharana statha | utpatajanakah shukramitram mandasakhastatha
    || 6|| gadadharah nakapatih antarvedishvarastatha | jaiminigotrajashcitraguptatma dakshinamukhah ||
    7|| mukundavarapatram ca mahasurakulodbhavah | ghanavarno lambadeho mrityuputrastathaiva ca || 8||
    utpatarupadhari ca'drishyah kalagnisannibhah | nripido grahakari ca sarvopadravakarakah || 9|| citraprasuto
    hyanalah sarvavyadhivinashakah | apasavyapracari ca navame papadayakah || 10|| pancame shokadashcoparagakhecara
    eva ca | atipurushakarma ca turiye sukhapradah || 11|| tritiye vairadah papagrahashca sphotakakarakah
    | prananathah pancame tu shramakaraka eva ca || 12|| dvitiye'sphutavagdata vishakulitavaktrakah |
    kamarupi simhadantah satye'pyanritavanapi || 13|| caturthe matrinashashca navame pitrinashakah | antye
    vairapradashcaiva sutanandanabandhakah || 14|| sarpakshijato'namgashca karmarashyudbhavastatha | upante
    kirtidashcaiva saptame kalahapradah || 15|| ashtame vyadhikarta ca dhane bahusukhapradah | janane
    rogadashcordhvamurdhajo grahanayakah || 16|| papadrishtih khecarashca shambhavo'sheshapujitah | shashvatashca
    natashcaiva shubha'shubhaphalapradah || 17|| dhumrashcaiva sudhapayi hyajito bhaktavatsalah | simhasanah
    ketumurti ravindudyutinashakah || 18|| amarah pidako'martyo vishnudrishto'sureshvarah | bhaktaraksho'tha
    vaicitryakapatasyandanastatha || 19|| vicitraphaladayi ca bhaktabhishtaphalapradah | etatketugrahasyoktam
    namnamashtottaram shatam || 20|| yo bhaktyedam japetketurnamnamashtottaram shatam | sa tu ketoh prasadena
    sarvabhishtam samapnuyat || 21|| || iti ketu ashtottarashatanamastotram sampurnam ||
  devanagari: ृणु नामानि जप्यानि केतो रथ महामते । केतुः स्थूलशिराश्चैव शिरोमात्रो ध्वजाकृतिः ॥ १॥ नवग्रहयुतः
    सिंहिकासुरीगर्भसम्भवः । महाभीतिकरश्चित्रवर्णो वै पिंगळाक्षकः ॥ २॥ स फलोधूम्रसंकाषः तीक्ष्णदंष्ट्रो
    महोरगः । रक्तनेत्रश्चित्रकारी तीव्रकोपो महासुरः ॥ ३॥ क्रूरकण्ठः क्रोधनिधिश्छायाग्रहविशेषकः । अन्त्यग्रहो
    महाशीर्षो सूर्यारिः पुष्पवद्ग्रही ॥ ४॥ वरहस्तो गदापाणिश्चित्रवस्त्रधरस्तथा । चित्रध्वजपताकश्च घोरश्चित्ररथश्शिखी
    ॥ ५॥ कुळुत्थभक्षकश्चैव वैडूर्याभरण स्तथा । उत्पातजनकः शुक्रमित्रं मन्दसखस्तथा ॥ ६॥ गदाधरः नाकपतिः
    अन्तर्वेदीश्वरस्तथा । जैमिनीगोत्रजश्चित्रगुप्तात्मा दक्षिणामुखः ॥ ७॥ मुकुन्दवरपात्रं च महासुरकुलोद्भवः
    । घनवर्णो लम्बदेहो मृत्युपुत्रस्तथैव च ॥ ८॥ उत्पातरूपधारी चाऽदृश्यः कालाग्निसन्निभः । नृपीडो ग्रहकारी
    च सर्वोपद्रवकारकः ॥ ९॥ चित्रप्रसूतो ह्यनलः सर्वव्याधिविनाशकः । अपसव्यप्रचारी च नवमे पापदायकः ॥ १०॥
    पञ्चमे शोकदश्चोपरागखेचर एव च । अतिपुरुषकर्मा च तुरीये सुखप्रदः ॥ ११॥ तृतीये वैरदः पापग्रहश्च स्फोटककारकः
    । प्राणनाथः पञ्चमे तु श्रमकारक एव च ॥ १२॥ द्वितीयेऽस्फुटवाग्दाता विषाकुलितवक्त्रकः । कामरूपी सिंहदन्तः
    सत्येऽप्यनृतवानपि ॥ १३॥ चतुर्थे मातृनाशश्च नवमे पितृनाशकः । अन्त्ये वैरप्रदश्चैव सुतानन्दनबन्धकः ॥
    १४॥ सर्पाक्षिजातोऽनंगश्च कर्मराश्युद्भवस्तथा । उपान्ते कीर्तिदश्चैव सप्तमे कलहप्रदः ॥ १५॥ अष्टमे व्याधिकर्ता
    च धने बहुसुखप्रदः । जनने रोगदश्चोर्ध्वमूर्धजो ग्रहनायकः ॥ १६॥ पापदृष्टिः खेचरश्च शाम्भवोऽशेषपूजितः
    । शाश्वतश्च नटश्चैव शुभाऽशुभफलप्रदः ॥ १७॥ धूम्रश्चैव सुधापायी ह्यजितो भक्तवत्सलः । सिंहासनः केतुमूर्ती
    रवीन्दुद्युतिनाशकः ॥ १८॥ अमरः पीडकोऽमर्त्यो विष्णुदृष्टोऽसुरेश्वरः । भक्तरक्षोऽथ वैचित्र्यकपटस्यन्दनस्तथा
    ॥ १९॥ विचित्रफलदायी च भक्ताभीष्टफलप्रदः । एतत्केतुग्रहस्योक्तं नाम्नामष्टोत्तरं शतम् ॥ २०॥ यो भक्त्येदं
    जपेत्केतुर्नाम्नामष्टोत्तरं शतम् । स तु केतोः प्रसादेन सर्वाभीष्टं समाप्नुयात् ॥ २१॥ ॥ इति केतु अष्टोत्तरशतनामस्तोत्रं
    सम्पूर्णम् ॥
