    bara baina| sumiri sambhu gura bipra pada kie nidabasa naina || || nidu~ badana soha suthi lona| manahu~
    sa~jha sarasiruha sona || ghara ghara karahim jagarana narim| dehim parasapara mangala garim || puri
    birajati rajati rajani| ranim kahahim bilokahu sajani || sundara badhunha sasu lai soi| phanikanha
    janu siramani ura goi || prata punita kala prabhu jage| arunacura bara bolana lage || bandi magadhanhi
    gunagana gae| purajana dvara joharana ae || bandi bipra sura gura pitu mata| pai asisa mudita saba
