id: sukra-ashtottara-sata-nama-stotram
category: stotram
name:
  english: Sukra Ashtottara Sata Nama Stotram
content:
  english: shukrah shucih shubhagunah shubhadah shubhalakshanah | shobhanakshah shubhrarupah shuddhasphatikabhasvarah
    || || dinartiharako daityaguruh devabhivanditah | kavyasaktah kamapalah kavih kalyanadayakah || ||
    bhadramurtirbhadraguno bhargavo bhaktapalanah | bhogado bhuvanadhyaksho bhuktimuktiphalapradah ||
    || carushilashcarurupashcarucandranibhananah | nidhirnikhilashastrajno nitividyadhurandharah || ||
    sarvalakshanasampannah sarvavagunavarjitah | samanadhikanirmuktah sakalagamaparagah || || bhrigurbhogakaro
    bhumisurapalanatatparah | manasvi manado manyo mayatito mahashayah || || baliprasanno'bhayado bali
    balaparakramah | bhavapashaparityago balibandhavimocakah || || ghanashayo ghanadhyaksho kambugrivah
    kaladharah | karunyarasasampurnah kalyanagunavardhanah || || shvetambarah shvetavapushcaturbhujasamanvitah
    | akshamaladharo'cintyo akshinagunabhasurah || || nakshatraganasancaro nayado nitimargadah | varshaprado
    hrishikeshah kleshanashakarah kavih || || cintitarthapradah shantamatih cittasamadhikrit | adhivyadhiharo
    bhurivikramah punyadayakah || || puranapurushah pujyah puruhutadisannutah | ajeyo vijitaratirvividhabharanojjvalah
    || || kundapushpapratikasho mandahaso mahamatih | muktaphalasamanabho muktido munisannutah || || ratnasimhasanarudho
    rathastho rajataprabhah | suryapragdeshasancarah surashatrusuhrit kavih || || tulavrishabharashisho
    durdharo dharmapalakah | bhagyado bhavyacaritro bhavapashavimocakah || || gaudadesheshvaro gopta guni
    gunavibhushanah | jyeshthanakshatrasambhuto jyeshthah shreshthah shucismitah || || apavargaprado'nantah
    santanaphaladayakah | sarvaishvaryapradah sarvagirvanaganasannutah || || evam shukragrahasyaiva kramadashtottaram
    shatam | sarvapapaprashamanam sarvapunyaphalapradam | yah pathecchrinuyadvapi sarvan kamanavapnuyat
    || || iti shri shukra ashtottarashatanama stotram |
  devanagari: शुक्रः शुचिः शुभगुणः शुभदः शुभलक्षणः । शोभनाक्षः शुभ्ररूपः शुद्धस्फटिकभास्वरः ॥ ॥ दीनार्तिहारको
    दैत्यगुरुः देवाभिवन्दितः । काव्यासक्तः कामपालः कविः कल्याणदायकः ॥ ॥ भद्रमूर्तिर्भद्रगुणो भार्गवो भक्तपालनः
    । भोगदो भुवनाध्यक्षो भुक्तिमुक्तिफलप्रदः ॥ ॥ चारुशीलश्चारुरूपश्चारुचन्द्रनिभाननः । निधिर्निखिलशास्त्रज्ञो
    नीतिविद्याधुरन्धरः ॥ ॥ सर्वलक्षणसम्पन्नः सर्वावगुणवर्जितः । समानाधिकनिर्मुक्तः सकलागमपारगः ॥ ॥ भृगुर्भोगकरो
    भूमिसुरपालनतत्परः । मनस्वी मानदो मान्यो मायातीतो महाशयः ॥ ॥ बलिप्रसन्नोऽभयदो बली बलपराक्रमः । भवपाशपरित्यागो
    बलिबन्धविमोचकः ॥ ॥ घनाशयो घनाध्यक्षो कम्बुग्रीवः कलाधरः । कारुण्यरससम्पूर्णः कल्याणगुणवर्धनः ॥ ॥ श्वेताम्बरः
    श्वेतवपुश्चतुर्भुजसमन्वितः । अक्षमालाधरोऽचिन्त्यो अक्षीणगुणभासुरः ॥ ॥ नक्षत्रगणसञ्चारो नयदो नीतिमार्गदः
    । वर्षप्रदो हृषीकेशः क्लेशनाशकरः कविः ॥ ॥ चिन्तितार्थप्रदः शान्तमतिः चित्तसमाधिकृत् । आधिव्याधिहरो
    भूरिविक्रमः पुण्यदायकः ॥ ॥ पुराणपुरुषः पूज्यः पुरुहूतादिसन्नुतः । अजेयो विजितारातिर्विविधाभरणोज्ज्वलः
    ॥ ॥ कुन्दपुष्पप्रतीकाशो मन्दहासो महामतिः । मुक्ताफलसमानाभो मुक्तिदो मुनिसन्नुतः ॥ ॥ रत्नसिंहासनारूढो
    रथस्थो रजतप्रभः । सूर्यप्राग्देशसञ्चारः सुरशत्रुसुहृत् कविः ॥ ॥ तुलावृषभराशीशो दुर्धरो धर्मपालकः ।
    भाग्यदो भव्यचारित्रो भवपाशविमोचकः ॥ ॥ गौडदेशेश्वरो गोप्ता गुणी गुणविभूषणः । ज्येष्ठानक्षत्रसम्भूतो
    ज्येष्ठः श्रेष्ठः शुचिस्मितः ॥ ॥ अपवर्गप्रदोऽनन्तः सन्तानफलदायकः । सर्वैश्वर्यप्रदः सर्वगीर्वाणगणसन्नुतः
    ॥ ॥ एवं शुक्रग्रहस्यैव क्रमादष्टोत्तरं शतम् । सर्वपापप्रशमनं सर्वपुण्यफलप्रदम् । यः पठेच्छृणुयाद्वापि
    सर्वान् कामानवाप्नुयात् ॥ ॥ इति श्री शुक्र अष्टोत्तरशतनाम स्तोत्रम् ।
