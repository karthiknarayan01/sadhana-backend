    असंरम्भाय नमः । ॐ सर्वायुध समन्विताय नमः । ॐ ओङ्कार रूपिणे नमः । ॐ पूर्णात्मने नमः । बन्धनाय नमः ।
    ॐ ऐङ्काराय नमः । ॐ वाक्प्रदाय नमः । ॐ वाग्मिने नमः । ॐ श्रीङ्कारैश्वर्य वर्धनाय नमः । ॐ क्लीङ्कार
