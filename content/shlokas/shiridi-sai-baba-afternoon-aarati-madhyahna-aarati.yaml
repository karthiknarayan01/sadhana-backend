id: shiridi-sai-baba-afternoon-aarati-madhyahna-aarati
category: stotram
name:
  english: Shiridi Sai Baba Afternoon Aarati - Madhyahna Aarati
content:
  english: shri saccidananda samardha sadguru sa uni pancakarati karu babansi arati sayisi arati karu
    babansi arati utha utha ho ban dhava ovalu haramadhava sayi ramadhava ovalu haramadhava karuni yasdhiramana
    pahu gambhira hedhyana sayice hedhyana pahu gambhira hedhyana krushna nadha dattasa i jadocittatujhe
    payi citta babasayi jadocittatujhe payi arati sa ibaba saukhyadatarajiva caranarajatali dhyava dasa
    visava bhaktamvisava arati sa ibaba jaluniya ananga svasvarupi rahèdanga mumuksha janadavi nijadola
    shriranga dola shriranga arati sa ibaba jayamani jaisabhava tayataisa anubhava davisidayaghana aisi
    tujhihi mava tujhihi mava arati sa ibaba tumace namadyata hare samskruti vyadha agadha tava karani
    margadavisi anadha davisi anadha arati sa ibaba kaliyugi avatara saguna parabrahma sacara avatarnajhalase
    svami dattadigambara datta digambara arati sa ibaba atha divasa guruvari bhaktakariti vari prabhupada
    pahavaya bhavabhaya nivari bhayanivari arati sa ibaba majha nijadravya theva tava carana rajaseva
    magane heci atatuhma devadideva devadiva arati sa ibaba iccita dina cataka nirmala toya nija sukha
    pajave madhavaya sambhala apulibhaka apulibhaka arati sa ibaba saukhya data rajiva carana tajatali
    dhyava dasa visava bhaktam visava arati sa ibaba jayadeva jayadeva datta avaduta osa i avaduta joduni
    karatava carani thevito matha jayadeva jayadeva avatarasitu yeta dharman te glani nastika nahitu lavisi
    nijabhajani davisi nanalila asankhya rupani harisi devan cetu sankata dinarajani jayadevajayadeva
    datta avadhuta o sayi avadhuta joduni karatava caranithevito matha jayadeva jayadeva yavvanasvarupi
    ekyadarshana tvadi dhale samshaya nirasuniya tadvaitaghalavile gopicanda mandatvanci uddarile jayadeva
    jayadeva datta avaduta o sayi avaduta joduni karatava carani thevito madha jayadeva jayadeva bhedatattvahindu
    yavana n cakahi davayasi jhula punarapi naradehi pahasi premane n tu hinduyavanahi davisi atmatvane
    vyapak hasayi jayadevajayadeva datta avadhuta o sayi avadhuta joduni karatava carani thevito matha
    jayadeva jayadeva devasa inadha tvatpadanata hvane paramayamohita janamocana jhunihvane tatkrupaya
    sakalan ce sankatanirasave deshila taridetvadrusha krushnanegane jayadeva jayadeva datta avaduta o
    sa i avaduta joduni karatavacarani thevito madha jayadeva jayadeva shiridi majhe pandaripurasa ibabaramavara
    shuddabhakticandra bhaga bhavapundalikajaga pundalika jaga bhavapundalikajaga yahoyaho avaghe jana
    karubabansivandana ganuhmane babasayi i ghalina lotangana vandina carana dolyanipahinarupatujhe preme
    alingana anandepujin bhave ovalina hmanenama tvameva mata ca pita tvameva tvamevabandushca sakhatvameva
    tvameva vidya dravinam tvameva tvameva sarvam mamadevadeva kayena vaca manacendriyerva buddyatmanava
    prakruti svabhavat karomi yadyatsakalam parasmai narayana yeti samarpayami acyutankeshavam ramanarayanam
    krushnadamodaram vasudevam harim shridharam madhavam gopikavallabham janakinayakam ramacandram bhaje
    harerama harerama ramarama hare hare harekrushna harekrushna krushna krushna hare hare||shri gurudevadatta
    hari om yajgena yajga mayajanta devastanidharmani pradhamanyasan tehanakam mahiman sacanta yatra purvesadyassantideva
    om rajadhirajaya pasahyasahine namovayam vai shravanaya kurmahe samekaman kamakamaya mahyam kameshvaro
    vaishravano dadatu kuberaya vaishravanaya maharajayanama om svasti samrajyam bhojyam svarajyam vairajyam
    parameshtyamrajyam maharajya madhipatyamayam samantaparya ishya ssarvabhauma ssarva yushan tadapadardat
    prudhivyaisamudra paryantaya ekaralliti tadapyesha shlokobigito maruta pariveshtoro marutta syavasan
    gruhe avikshitasyakama prer vishvedevasabhasada iti shri narayanavasudeva saccidananda sadguru sa
    inadh maharaj ki jai ananta tulate kasere stavave ananta tulate kasere namave ananta mukhaca shine
    shesha gata namaskara sashtanga shri sa inadha smarave manitvatpada nityabhave urave taribhakti sathi
    svabhave taravejaga taruni mayatata namaskara sashtanga shrisa inadha vasejo sada davaya santalila
    dise ajgya lokapari jojanala pari antarijgyana kaivalya data namaskara sashtanga shrisa inadha bharaladhala
    janmaha manavaca narasardhaka sadhanibhutasaca dharusayi prema galaya ahanta namaskara sashtanga shri
    sa inadha dharave karisana alpajgyabala karave ahmadhanya cumbhonigala mukhighala premekharagrasa
    ata namaskara sashtanga shri sa inadha suradika jyancya pada vanditati sukadika jate samanatvadeti
    prayagaditirdhe padi namrahota namaskara sashtanga shri sa inadha tujhya jyapada pahata gopabali sadarangali
    citsvarupi milali kari rasakrida save krushnanadha namaskara sashtanga shri sa inadha tulamagato magane
    ekadyave karajodito dina atyanta bhave bhavimohaniraja hatari ata namaskara sashtanga shri sa i digambara
    akshayarupa avatara | sarvahivyapaka tu shrutusara anasuyatrikumara maharaje iba kashisnana japa pratidivasi
    kòlapur abhikshesi nirmala nadi tunga jalaprasi nidramahuradeshi isa ye yiba jhelilombatase vamakari
    trishula dhamarudhari bhaktavaradasada sukhakarideshila mukticari isa ye yiba payipaduka japamala
    kamandalu mrugacala dharanakarishiba nagajata mukuta shobhatomadha isa ye yiba tatpara tujhyaya jedhyani
    akshayatvancesadavi lakshmivasakari dinarajani rakshasisankata varuni isa ye yiba yaparidhyana tujhe
    gururaya drushya karinayanaya purnananda sukhehikaya lavisihari gunagaya isa ye yiba sa i digambara
    akshaya rupa avatara sarvahivyapaka tu shrutisara anasuyatrikumara maharaje iba sadasatsvarupam cidanandakandam
    jagat sambhavasthana samhara hè tum svabhakteccaya manusham darshayantam namamishvaram sadgurum sa
    inadham bhavadhvanta vidhvamsa martandamidyam manovagatitam munir dhyana gamyam jagadvyapakam nirmalam
    nirgunantvam namamishvaram sadgurum sa inadham bhavambhodi magnardhi tanam jananam svapadashritanam
    svabhakti priyanam samuddaranardham kalau sambhavantam namamishvaram sadgurum sa inadham sadanimbavrukshadhikam
    sadhayantam shada nimbavrksasya muladhivasat sudhastravinam titkamapya priyam tam tarun kalpa vruksadhikam
    sadhayantam namamishvaram sadgurum sa inadham sadakalpavrukshasya tasyadhimule bhavadbhavabuddya saparyadisevam
    nrunankurvatambhukti mukti pradantam namamishvaram sadgurum sa inadham aneka shruta tarkyalila vilasai
    sama vishkruteshana bhasvatrpabhavam ahambhavahinam prasannatmabhavam namamishvaram sadgurum sa inadham
    satamvishramaramam eva abhiramam sadasajjanai samstutam sannamadbhi janamodadam bhakta bhadra pradantam
    namamishvaram sadgurum sa inadham ajanmadyamekam parambrahma sakshat svayam sambhavam ramamevanatirnam
    bhavaddar shanatsam punita prabhoham namamishvaram sadgurum sa khilanrunam sarvardha siddiprada yushmatpadaraja
    prabhavamatulam dhatapivakta sadbhaktyashsharanam krutanjaliputa smin prabho shrimatsa iparesha pada
    kamalanaccaranyammama sa irupa dhararaghottamam bhaktakama vibudha drumamprabhum mayayopahata citta
    shuddaye cintayamyahe mmaharnisham muda sharatsudhamshu pratimamprakasham krupa tapapratamva sa inadha
    tvadiyapadabja samashritanam svaccayayatapa mapakarotu upasanadaivata sa inadha smavairma yopasani
    nastuvantam ramenmanome tavapadayugme bhrungo yadabje makarandalubdha aneka janmarjita papa sankshayo
    bhavedbhavatpada saroja darshanat kshamasva sarvanaparadha punjakan prasida sa isha sadgurodayanidhe
    shrisa inadha caranamruta purnacitta tatpada sevanarata ssata tanca bhaktya samsara janyaduritaugha
    vinirga taste kaivalya dhama paramam samavapnuvanti stotrame tatpathedbhaktya yonnarastanmanasada
    sadguro inadhasya krupa patram bhavedbhavam karacaranakrutam vakkayajankarmajamva shravananayanajamvamanasamva
    paradham viditamaviditam vasarvemetatkshamasva jayajayakarunadbhe shri prabhosa inadha shri saccidananda
    sadguru sa inadh maharaj ki jai rajadhiraja yogiraja parabrahma shrisa inadhamaharaj shri saccidananda
    sadguru sa
  devanagari: श्री सच्चिदानन्द समर्ध सद्गुरु सा उनि पञ्चाकरती करू बाबान्सी आरती सायीसी आरती करू बाबान्सी
    आरती उठा उठा हो बान् धव ओवालु हरमाधव सायी रामाधव ओवालु हरमाधव करूनि यास्धिरमन पाहु गम्भीर हेध्याना
    सायीचे हेध्याना पाहु गम्भीर हेध्याना क्रुष्ण नाधा दत्तसा इ जडोचित्ततुझे पायी चित्त बाबासायी जडोचित्ततुझे
    पायी आरति सा इबाबा सौख्यादातारजीवा चरणारजतालि ध्यावा दासा विसाव भक्तांविसाव आरति सा इबाबा जालुनिय
    आनङ्ग स्वस्वरूपि रहॆदङ्ग मुमुक्ष जनदावि निजडोला श्रीरङ्ग डोला श्रीरङ्ग आरति सा इबाबा जयमनी जैसाभाव
    तयतैसा अनुभाव दाविसिदयाघना ऐसी तुझीहि माव तुझीहि माव आरति सा इबाबा तुमचे नामद्याता हरे संस्क्रुति
    व्याधा अगाध तव करणी मार्गदाविसि अनाधा दाविसि अनाधा आरति सा इबाबा कलियुगि अवतार सगुण परब्रह्म सचार
    अवतार्णझालासे स्वामि दत्तादिगम्बर दत्ता दिगम्बर आरति सा इबाबा आठा दिवसा गुरुवारी भक्तकरीति वारी प्रभुपद
    पहावया भवभय निवारि भयानिवारि आरति सा इबाबा माझा निजद्रव्य ठेव तव चरण रजसेवा मागणे हेचि आतातुह्म देवादिदेवा
    देवादिवा आरति सा इबाबा इच्चिता दीन चाताक निर्मल तोय निज सूख पाजवे माधवाय सम्भाल आपुलिभाक आपुलिभाक
    आरति सा इबाबा सौख्य दाता रजीव चरण तजताली ध्यावा दासा विसावा भक्तां विसावा आरति सा इबाबा जयदेव जयदेव
    दत्ता अवदूत ओसा इ अवदूत जोडुनि करतव चरणी ठेवितो माथा जयदेव जयदेव अवतरसीतू येता धर्मान् ते ग्लानी नास्तीका
    नाहीतू लाविसि निजभजनी दाविसि नानालीला असङ्ख्य रूपानी हरिसी देवान् चेतू सङ्कट दिनरजनी जयदेवजयदेव दत्ता
    अवधूता ओ सायी अवधूता जोडुनि करतव चरणीठेवितो माथा जयदेव जयदेव यव्वनस्वरूपी एक्यादर्शन त्वादि धले संशय
    निरसुनिया तद्वैताघालविले गोपिचन्दा मन्दात्वाञ्ची उद्दरिले जयदेव जयदेव दत्त अवदूत ओ सायी अवदूत जोडुनि
    करतव चरणी ठेवितो माधा जयदेव जयदेव भेदतत्त्वहिन्दू यवना न् चाकाही दावायासि झूला पुनरपि नरदेही पाहसि
    प्रेमाने न् तू हिन्दुयवनाहि दाविसि आत्मत्वाने व्यापक् हसायी जयदेवजयदेव दत्ता अवधूता ओ सायी अवधूता
    जोडुनि करतव चरणी ठेवितो माथा जयदेव जयदेव देवसा इनाधा त्वत्पदनत ह्वाने परमायामोहित जनमोचन झुणिह्वाने
    तत्क्रुपया सकलान् चे सङ्कटनिरसावे देशिल तरिदेत्वद्रुश क्रुष्णानेगाने जयदेव जयदेव दत्ता अवदूता ओ सा
    इ अवदूत जोडुनि करतवचरणि ठेवितो माधा जयदेव जयदेव शिरिडि माझे पण्डरिपुरसा इबाबारमवर शुद्दभक्तिचन्द्र
    भागा भावपुण्डलीकजागा पुण्डलीक जागा भावपुण्डलीकजागा यहोयाहो अवघे जन करूबाबान्सीवन्दन गणूह्मणे बाबासायी
    ई घालीन लोटाङ्गण वन्दीन चरण डोल्यानिपाहीनरूपतुझे प्रेमे आलिङ्गन आनन्देपूजिन् भावे ओवालिन ह्मणेनामा
    त्वमेव माता च पिता त्वमेव त्वमेवबन्दुश्च सखात्वमेव त्वमेव विद्या द्रविणं त्वमेव त्वमेव सर्वं ममदेवदेव
    कायेन वाचा मनचेन्द्रियेर्वा बुद्द्यात्मनावा प्रक्रुति स्वभावात् करोमि यद्यत्सकलं परस्मै नारायणा येति
    समर्पयामी अच्युतङ्केशवं रामनारायणं क्रुष्णदामोदरं वासुदेवं हरिं श्रीधरं माधवं गोपिकावल्लभं जानकीनायकं
    रामचन्द्रं भजे हरेराम हरेराम रामराम हरे हरे हरेक्रुष्ण हरेक्रुष्ण क्रुष्ण क्रुष्ण हरे हरे॥श्री गुरुदेवदत्त
    हरि ॐ यज्गेन यज्ग मयजन्त देवास्तानिधर्माणि प्रधमान्यासन् तेहनाकं महिमान् सचन्त यत्र पूर्वेसाद्यास्सन्तिदेवा
    ॐ राजाधिराजाय पसह्यसाहिने नमोवयं वै श्रवणाय कुर्महे समेकामान् कामकामाय मह्यं कामेश्वरो वैश्रवणो ददातु
    कुबेराय वैश्रवणाया महाराजायनम ॐ स्वस्ती साम्राज्यं भोज्यं स्वाराज्यं वैराज्यं पारमेष्ट्यंराज्यं महाराज्य
    माधिपत्यमयं समन्तपर्या ईश्या स्सार्वभौम स्सार्वा युषान् तादापदार्दात् प्रुधिव्यैसमुद्र पर्यान्ताया
    एकराल्लिति तदप्येष श्लोकोबिगीतो मरुत परिवेष्टोरो मरुत्त स्यावसन् ग्रुहे आविक्षितस्यकाम प्रेर् विश्वेदेवासभासद
    इति श्री नारायणवासुदेव सच्चिदानन्द सद्गुरु सा इनाध् महाराज् कि जै अनन्ता तुलाते कसेरे स्तवावे अनन्ता
    तुलाते कसेरे नमावे अनन्ता मुखाचा शिणे शेष गाता नमस्कार साष्टाङ्ग श्री सा इनाध स्मरावे मनीत्वत्पदा
    नित्यभावे उरावे तरीभक्ति साठी स्वभावे तरावेजगा तारुनी मायताता नमस्कार साष्टाङ्ग श्रीसा इनाधा वसेजो
    सदा दावया सन्तलीला दिसे आज्ग्य लोकापरी जोजनाला परी अन्तरीज्ग्यान कैवल्य दाता नमस्कार साष्टाङ्ग श्रीसा
    इनाधा भरालाधला जन्महा मानवाचा नरासार्धका साधनीभूतसाचा धरूसायी प्रेमा गलाया अहन्ता नमस्कार साष्टाङ्ग
    श्री सा इनाधा धरावे करीसान अल्पज्ग्यबाला करावे अह्माधन्य चुम्भोनिगाला मुखीघाल प्रेमेखराग्रास अता नमस्कार
    साष्टाङ्ग श्री सा इनाधा सुरादीक ज्याञ्च्या पदा वन्दिताती सुकादीक जाते समानत्वदेती प्रयागादितीर्धे
    पदी नम्रहोता नमस्कार साष्टाङ्ग श्री सा इनाधा तुझ्या ज्यापदा पाहता गोपबाली सदारङ्गली चित्स्वरूपी मिलाली
    करी रासक्रीडा सवे क्रुष्णनाधा नमस्कार साष्टाङ्ग श्री सा इनाधा तुलामागतो मागणे एकद्यावे कराजोडितो दीन
    अत्यन्त भावे भवीमोहनीराज हातारि आता नमस्कार साष्टाङ्ग श्री सा इ दिगम्बरा अक्षयरूप अवतारा । सर्वहिव्यापक
    तू श्रुतुसारा अनसूयात्रिकुमारा महाराजे ईबा काशीस्नान जप प्रतिदिवसी कॊलापुर् अभिक्षेसी निर्मल नदि तुङ्गा
    जलप्रासी निद्रामाहुरदेशी ईसा ये यीबा झेलीलोम्बतसे वामकरी त्रिशूल ढमरूधारि भक्तावरदसदा सुखकारीदेशील
    मुक्तीचारी ईसा ये यीबा पायिपादुका जपमाला कमण्डलू म्रुगचाला धारणकरिशीबा नागजटा मुकुट शोभतोमाधा ईसा
    ये यीबा तत्पर तुझ्याया जेध्यानी अक्षयत्वाञ्चेसदवी लक्ष्मीवासकरी दिनरजनी रक्षसिसङ्कट वारुनि ईसा ये
    यीबा यापरिध्यान तुझे गुरुराया द्रुश्य करीनयनाया पूर्णानन्द सुखेहीकाया लाविसिहरि गुणगाया ईसा ये यीबा
    सा इ दिगम्बर अक्षय रूप अवतारा सर्वहिव्यापक तू श्रुतिसारा अनसूयात्रिकुमारा महाराजे ईबा सदासत्स्वरूपं
    चिदानन्दकन्दं जगत् सम्भवस्थन सम्हर हॆ तुम् स्वभक्तेच्चया मानुषं दर्शयन्तं नमामीश्वरं सद्गुरुं सा इनाधं
    भवध्वान्त विध्वंस मार्ताण्डमीड्यं मनोवागतीतं मुनिर् ध्यान गम्यं जगद्व्यापकं निर्मलं निर्गुणन्त्वां
    नमामीश्वरं सद्गुरुं सा इनाधं भवाम्भोदि मग्नार्धि तानां जनानां स्वपादाश्रितानां स्वभक्ति प्रियाणां
    समुद्दारणार्धं कलौ सम्भवन्तं नमामीश्वरं सद्गुरुं सा इनाधं सदानिम्बव्रुक्षाधिकं साधयन्तं शद निम्बव्र्क्सस्य
    मुलधिवसत् सुधस्त्रविनं तित्कमप्य प्रियं तम् तरुन् कल्प व्रुक्सधिकं सधयन्तम् नमामीश्वरं सद्गुरुं सा
    इनाधं सदाकल्पव्रुक्षस्य तस्याधिमूले भवद्भावबुद्द्या सपर्यादिसेवां न्रुणाङ्कुर्वताम्भुक्ति मुक्ति प्रदन्तं
    नमामीश्वरं सद्गुरुं सा इनाधं अनेका श्रुता तर्क्यलीला विलासै समा विष्क्रुतेशान भास्वत्र्पभावं अहम्भावहीनं
    प्रसन्नात्मभावं नमामीश्वरं सद्गुरुं सा इनाधं सतांविश्रमारामं एव अभिरामं सदासज्जनै संस्तुतं सन्नमद्भि
    जनामोददं भक्त भद्र प्रदन्तं नमामीश्वरं सद्गुरुं सा इनाधं अजन्माद्यमेकं परम्ब्रह्म साक्षात् स्वयं सम्भवं
    राममेवानतीर्णं भवद्दर् शनात्सं पुनीत प्रभोहं नमामीश्वरं सद्गुरुं सा खिलन्रुणां सर्वार्ध सिद्दिप्रद
    युष्मत्पादरज प्रभावमतुलं धातापिवक्ता सद्भक्त्याश्शरणं क्रुताञ्जलिपुट स्मिन् प्रभो श्रीमत्सा इपरेश
    पाद कमलानाच्चरण्यम्मम सा इरूप धरराघोत्तमं भक्तकाम विबुध द्रुमम्प्रभुं माययोपहत चित्त शुद्दये चिन्तयाम्यहे
    म्महर्निशं मुदा शरत्सुधांशु प्रतिमम्प्रकाशं क्रुपा तपप्रतंव सा इनाध त्वदीयपादाब्ज समाश्रितानां स्वच्चाययाताप
    मपाकरोतु उपासनादैवत सा इनाध स्मवैर्म योपासनि नास्तुवन्तं रमेन्मनोमे तवपादयुग्मे भ्रुङ्गो यदाब्जे मकरन्दलुब्ध
    अनेक जन्मार्जित पाप सङ्क्षयो भवेद्भवत्पाद सरोज दर्शनात् क्षमस्व सर्वानपराध पुञ्जकान् प्रसीद सा इश
    सद्गुरोदयानिधे श्रीसा इनाध चरणाम्रुत पूर्णचित्ता तत्पाद सेवनरता स्सत तञ्च भक्त्या संसार जन्यदुरितौघ
    विनिर्ग तास्ते कैवल्य धाम परमं समवाप्नुवन्ति स्तोत्रमे तत्पठेद्भक्त्या योन्नरस्तन्मनासदा सद्गुरो इनाधस्य
    क्रुपा पात्रं भवेद्भवं करचरणक्रुतं वाक्कायजङ्कर्मजंवा श्रवणनयनजंवामानसंवा पराधं विदितमविदितं वासर्वेमेतत्क्षमस्व
    जयजयकरुणाद्भे श्री प्रभोसा इनाध श्री सच्चिदानन्द सद्गुरु सा इनाध् महराज् कि जै राजाधिराज योगिराज परब्रह्म
    श्रीसा इनाधामहराज् श्री सच्चिदानन्द सद्गुरु सा
