    शिवप्रियाय सर्वानन्दवर्धनाय सर्वविद्याप्रकाशनप्रदाय द्रां चिरञ्जीविने ब्लूं सम्मोहनाय ॐ मोक्षप्रदाय
    । फट् वशीकुरु वशीकुरु । वौषडाकर्षणाय हुं विद्वेषणाय विद्वेषय विद्वेषय । फट् उच्चाटयोच्चाटय । ठः ठः
    स्तम्भय स्तम्भय । खें खें मारय मारय । शोषय शोषय । परमन्त्रयन्त्रतन्त्राणि छेदय छेदय । दुष्टग्रहान्निवारय
    निवारय । दुःखं हर हर । व्याधिं नाशय नाशय । नमः सम्पन्नाय सम्पन्नाय स्वाहा । सर्वपल्लवस्वरूपाय महाविद्याय
    गं गणपतये स्वाहा । यन्मन्त्रेक्षितलाञ्छिताभमनघं मृत्युश्च वज्राशिषो भूतप्रेतपिशाचकाः प्रति हता निर्घातपातादिव
    । उत्पन्नं च समस्तदुःखदुरितं ह्युच्चाटनोत्पादकं वन्देऽभीष्टगणाधिपं भयहरं विघ्नौघनाशं परम् ॥ ॐ गं गणपतये
