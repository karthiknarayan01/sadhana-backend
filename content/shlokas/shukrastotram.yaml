id: shukrastotram
category: stotram
name:
  english: shukrastotram
  devanagari: शुक्रस्तोत्रम्
content:
  english: rinvantu munayah sarve shukrastotramidam shubham | rahasyam sarvabhutanam shukrapritikaram
    shubham || 1|| yesham sankirtanannityam sarvan kamanavapnuyat | tani shukrasya namani kathayami shubhani
    ca || 2|| shukrah shubhagrahah shriman varshakridvarshavighnakrit | tejonidhirjnanadata yogi yogavidam
    varah || 3|| daityasanjivano dhiro daityanetoshana kavih | nitikarta grahadhisho vishvatma lokapujitah
    || 4|| shuklamalyambaradharah shricandanasamaprabhah | akshamaladharah kavyah tapomurtirdhanapradah
    || 5|| caturvimshatinamani ashtottarashatam yatha | devasyagre visheshena pujam kritva vidhanatah
    || 6|| ya idam pathati stotram bhargavasya mahatmanah | vishamastho'pi bhagavan tushtah syannatra
    samshayah || 7|| stotram bhrigoridamanantagunapradam yo bhaktya pathecca manujo niyatah shucih san
    | prapnoti nityamatulam shriyamipsitarthan rajyam samastadhanadhanyayutam samriddhim || 8|| iti shukrastotram
    samaptam |
  devanagari: ृण्वन्तु मुनयः सर्वे शुक्रस्तोत्रमिदं शुभम् । रहस्यं सर्वभूतानां शुक्रप्रीतिकरं शुभम् ॥
    १॥ येषां सङ्कीर्तनान्नित्यं सर्वान् कामानवाप्नुयात् । तानि शुक्रस्य नामानि कथयामि शुभानि च ॥ २॥ शुक्रः
    शुभग्रहः श्रीमान् वर्षकृद्वर्षविघ्नकृत् । तेजोनिधिर्ज्ञानदाता योगी योगविदां वरः ॥ ३॥ दैत्यसञ्जीवनो
    धीरो दैत्यनेतोशना कविः । नीतिकर्ता ग्रहाधीशो विश्वात्मा लोकपूजितः ॥ ४॥ शुक्लमाल्याम्बरधरः श्रीचन्दनसमप्रभः
    । अक्षमालाधरः काव्यः तपोमूर्तिर्धनप्रदः ॥ ५॥ चतुर्विंशतिनामानि अष्टोत्तरशतं यथा । देवस्याग्रे विशेषेण
    पूजां कृत्वा विधानतः ॥ ६॥ य इदं पठति स्तोत्रं भार्गवस्य महात्मनः । विषमस्थोऽपि भगवान् तुष्टः स्यान्नात्र
    संशयः ॥ ७॥ स्तोत्रं भृगोरिदमनन्तगुणप्रदं यो भक्त्या पठेच्च मनुजो नियतः शुचिः सन् । प्राप्नोति नित्यमतुलां
    श्रियमीप्सितार्थान् राज्यं समस्तधनधान्ययुतां समृद्धिम् ॥ ८॥ इति शुक्रस्तोत्रं समाप्तम् ।
