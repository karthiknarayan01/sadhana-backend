id: k-ishnasahasranamastotrasatvatatantra-2
category: sahasranama
name:
  english: kṟishnasahasranamastotrasatvatatantra
  devanagari: क्ऱिष्णसहस्रनामस्तोत्रसात्वततन्त्र
content:
  english: shrikrishnasahasranamastotram satvatatantre shrinarada uvaca | kathitam me tvaya deva harinamanukirtanam
    | papapaham mahasaukhyam bhagavadbhaktikaranam || 1|| tatraham yani namani kirtayami surottama | tanyaham
    jnatumicchami sakalyena kutuhalat || 2|| shrishiva uvaca | bhumyambutejasam ye vai paramanunapi dvija
    | shakyante ganitum bhuyo janmabhirna harergunan || 3|| tathapi mukhyam vakshyami shrivishnoh paramadbhutam
    | namnam sahasram parvatyai yadihoktam kripaluna || 4|| samadhinishtham mam drishtva parvati varavarnini
    | apricchatparamam devam bhagavantam jagadgurum || 5|| tada tasyai maya prokto matparo jagadishvarah
    | namnam sahasram ca tatha gunakarmanusaratah || 6|| tadaham te'bhivakshyami mahabhagavato bhavan
    | yasyaikasmaranenaiva puman siddhimavapnuyat || 7|| udyannavinajaladabhamakunthadhishnyam vidyotitanalamanoharapitavasam
    | bhasvanmayukhamukutangadaharayuktam kancikalapavalayangulibhirvibhatam || 8|| brahmadidevaganavanditapadapadyam
    shrisevitam sakalasundarasamnivesham | gogopavanitamunivrindajushtam krishnam puranapurusham manasa
    smarami || 9|| om namo vasudevaya krishnaya paramatmane | pranatakleshasamhartre paramanandadayine
    || 10|| om shrikrishnah shripatih shriman shridharah shrisukhashrayah | shridata shrikarah shrishah
    shrisevyah shrivibhavanah || 11|| paramatma param brahma pareshah parameshvarah | paranandah param
    dhama paramanandadayakah || 12|| niralambo nirvikaro nirlepo niravagrahah | nityanando nityamukto
    niriho nisprihapriyah || 13|| priyamvadah priyakarah priyadah priyasanjanah | priyanugah priyalambi
    priyakirtih priyatpriyah || 14|| mahatyagi mahabhogi mahayogi mahatapah | mahatma mahatam shreshtho
    mahalokapatirmahan || 15|| siddharthah siddhasankalpah siddhidah siddhasadhanah | siddheshah siddhamargagrah
    siddhalokaikapalakah || 16|| ishto vishishtah shishteshto mahishtho jishnuruttamah | jyeshthah shreshthashca
    sarveshto vishnurbhrajishnuravyayah || 17|| vibhuh shambhuh prabhurbhuma svabhuh svanandamurtiman
    | pritiman pritidata ca pritidah pritivardhanah || 18|| yogeshvaro yogagamyo yogisho yogaparagah |
    yogadata yogapatiryogasiddhividhayakah || 19|| satyavratah satyaparah trisatyah satyakaranah | satyashrayah
    satyaharah satpalih satyavardhanah || 20|| sarvanandah sarvaharah sarvagah sarvavashyakrit | sarvapata
    sarvasukhah sarvashrutiganarnavah || 21|| janardano jagannatho jagattrata jagatpita | jagatkarta jagaddharta
    jagadanandamurtiman || 22|| dharapatirlokapatih svarpatirjagatampatih | vidyapatirvittapatih satpatih
    kamalapatih || 23|| caturatma caturbahushcaturvargaphalapradah | caturvyuhashcaturdhama caturyugavidhayakah
    || 24|| adidevo devadevo devesho devadharanah | devakriddevabhriddevo deveditapadambujah || 25|| vishveshvaro
    vishvarupi vishvatma vishvatomukhah | vishvasurvishvaphalado vishvago vishvanayakah || 26|| bhutakridbhutabhridbhavo
    bhutatma bhutabhavanah | bhutido bhutivistaro vibhutirbhutipalakah || 27|| narayano narashayi narasurnarajivanah
    | naraikaphalado naramuktido naranayakah || 28|| sahasrarupah sahasranama sahasravigrahah | sahasrashirsha
    sahasrapadakshibhujashirshavan || 29|| padmanabhah padmagarbhah padmi padmanibhekshanah | padmashayi
    padmamali padmankitapadadvayah || 30|| viryavan sthairyavan vagmi shauryavan dhairyavan kshami | dhiman
    dharmaparo bhogi bhagavan bhayanashanah || 31|| jayanto vijayo jeta jayado jayavardhanah | amani manado
    manyo mahimavanmahabalah || 32|| santushtastoshado data damano dinavatsalah | jnani yashasvan dhritiman
    saha ojobalashrayah || 33|| hayagrivo mahateja maharnavavinodakrit | madhukaitabhavidhvamsi vedakridvedapalakah
    || 34|| sanatkumarah sanakah sanandashca sanatanah | akhandabrahmavratavanatma yogavivecakah || 35||
    shrinarado devarishih karmakarmapravartakah | satvatagamakrillokahitahitaprasucakah || 36|| adikalo
    yajnatattvam dhatrinasaputodbhavah | dantagranyastabhugolo hiranyakshabalantakah || 37|| prithvipatih
    shighravego romantargatasagarah | shvasavadhutahemadrih prajapatipatistutah || 38|| ananto dharanibharta
    patalatalavasakrit | kamagnijavano nagarajarajo mahadyutih || 39|| mahakurmo vishvakayah sheshabhuksarvapalakah
    | lokapitriganadhishah pitristutamahapadah || 40|| kripamayah svayam vyaktirdhruvapritivivardhanah
    | dhruvastutapado vishnulokado lokapujitah || 41|| shuklah kardamasantaptastapastoshitamanasah | mano'bhishtaprado
    harshabindvancitasarovarah || 42|| yajnah suraganadhisho daityadanavaghatakah | manutrata lokapalo
    lokapalakajanmakrit || 43|| kapilakhyah sankhyapata kardamangasamudbhavah | sarvasiddhaganadhisho
    devahutigatipradah || 44|| datto'tritanayo yogi yogamargapradarshakah | anasuyanandakarah sarvayogijanastutah
    || 45|| narayano nararishirdharmaputro mahamanah | maheshashuladamano maheshaikavarapradah || 46||
    akalpantatapodhiro manmathadimadapahah | urvashisrigjitanango markandeyapriyapradah || 47|| rishabho
    nabhisukhado merudevipriyatmajah | yogirajadvijasrashta yogacaryapradarshakah || 48|| ashtabahurdakshayajnapavano'khilasatkritah
    | daksheshadveshashamano dakshajnanapradayakah || 49|| priyavratakulotpanno gayanama mahayashah |
    udarakarma bahuvinmahagunaganarnavah || 50|| hamsarupi tattvavakta gunagunavivecakah | dhatrilajjaprashamano
    brahmacarijanapriyah || 51|| vaishyah prithuh prithvidogdha sarvajivanadohakrit | adirajo janavasakarako
    bhusamikarah || 52|| praceto'bhishtutapadah shantamurtih sudarshanah | divaratriganadhishah ketumanajanashrayah
    || 53|| shrikamadevah kamalakamakelivinodakrit | svapadaratido'bhishtasukhado duhkhanashanah || 54||
    vibhurdharmabhritam shreshtho vedashirsho dvijatmajah | ashtashitisahasranam muninamupadeshadah ||
    55|| satyaseno yaksharakshodahano dinapalakah | indramitrah surarighnah sunritadharmanandanah || 56||
    harirgajavaratrata grahapashavinashakah | trikutadrivanashlaghi sarvalokahitaishanah || 57|| vaikunthashubhrasukhado
    vikunthasundarisutah | ramapriyakarah shrimannijalokapradarshakah || 58|| viprashapaparikhinnanirjarartinivaranah
    | dugdhabdhimathano vipro virajatanayo'jitah || 59|| mandaradridharah kurmo devadanavasharmakrit |
    jambudvipasamah srashta piyushotpattikaranam || 60|| dhanvantari ruk|gshamano'mritadhukrukprashantakah
    | ayurvedakaro vaidyarajo vidyapradayakah || 61|| devabhayakaro daityamohini kamarupini | girvanamritapo
    dushtadaityadanavavancakah || 62|| mahamatsyo mahakayah shalkantargatasagarah | vedaridaityadamano
    vrihibijasurakshakah || 63|| pucchaghatabhramatsindhuh satyavratapriyapradah | bhaktasatyavratatrata
    yogatrayapradarshakah || 64|| narasimho lokajihvah shankukarno nakhayudhah | satavadhutajalado dantadyutijitaprabhah
    || 65|| hiranyakashipudhvamsi bahudanavadarpaha | prahladastutapadabjo bhaktasamsaratapaha || 66||
    brahmendrarudrabhitighno devakaryaprasadhakah | jvalajjvalanasankashah sarvabhitivinashakah || 67||
    mahakalushavidhvamsi sarvakamavarapradah | kalavikramasamharta grahapidavinashakah || 68|| sarvavyadhiprashamanah
    pracandaripudandakrit | ugrabhairavasantrastaharartivinivarakah || 69|| brahmacarmavritashirah shivashirshaikanupurah
    | dvadashadityashirshaikamanirdikpalabhushanah || 70|| vamano'ditibhitighno dvijatiganamandanah |
    tripadavyajayancaptabalitrailokyasampadah || 71|| pannakhakshatabrahmandakataho'mitavikramah |
  devanagari: श्रीकृष्णसहस्रनामस्तोत्रम् सात्वततन्त्रे श्रीनारद उवाच । कथितं मे त्वया देव हरिनामानुकीर्तनम्
    । पापापहं महासौख्यं भगवद्भक्तिकारणम् ॥ १॥ तत्राहं यानि नामानि कीर्तयामि सुरोत्तम । तान्यहं ज्ञातुमिच्छामि
    साकल्येन कुतूहलात् ॥ २॥ श्रीशिव उवाच । भूम्यम्बुतेजसां ये वै परमाणूनपि द्विज । शक्यन्ते गणितुं भूयो
    जन्मभिर्न हरेर्गुणान् ॥ ३॥ तथापि मुख्यं वक्ष्यामि श्रीविष्णोः परमाद्भुतम् । नाम्नां सहस्रं पार्वत्यै
    यदिहोक्तं कृपालुना ॥ ४॥ समाधिनिष्ठं मां दृष्ट्वा पार्वती वरवर्णिनी । अपृच्छत्परमं देवं भगवन्तं जगद्गुरुम्
    ॥ ५॥ तदा तस्यै मया प्रोक्तो मत्परो जगदीश्वरः । नाम्नां सहस्रं च तथा गुणकर्मानुसारतः ॥ ६॥ तदहं तेऽभिवक्ष्यामि
    महाभागवतो भवान् । यस्यैकस्मरणेनैव पुमान् सिद्धिमवाप्नुयात् ॥ ७॥ उद्यन्नवीनजलदाभमकुण्ठधिष्ण्यं विद्योतितानलमनोहरपीतवासम्
    । भास्वन्मयूखमुकुटाङ्गदहारयुक्तं काञ्चीकलापवलयाङ्गुलिभिर्विभातम् ॥ ८॥ ब्रह्मादिदेवगणवन्दितपादपद्यं
    श्रीसेवितं सकलसुन्दरसंनिवेशम् । गोगोपवनितामुनिवृन्दजुष्टं कृष्णं पुराणपुरुषं मनसा स्मरामि ॥ ९॥ ओं
    नमो वासुदेवाय कृष्णाय परमात्मने । प्रणतक्लेशसंहर्त्रे परमानन्ददायिने ॥ १०॥ ओं श्रीकृष्णः श्रीपतिः
    श्रीमान् श्रीधरः श्रीसुखाश्रयः । श्रीदाता श्रीकरः श्रीशः श्रीसेव्यः श्रीविभावनः ॥ ११॥ परमात्मा परं
    ब्रह्म परेशः परमेश्वरः । परानन्दः परं धाम परमानन्ददायकः ॥ १२॥ निरालम्बो निर्विकारो निर्लेपो निरवग्रहः
    । नित्यानन्दो नित्यमुक्तो निरीहो निस्पृहप्रियः ॥ १३॥ प्रियंवदः प्रियकरः प्रियदः प्रियसञ्जनः । प्रियानुगः
    प्रियालम्बी प्रियकीर्तिः प्रियात्प्रियः ॥ १४॥ महात्यागी महाभोगी महायोगी महातपाः । महात्मा महतां श्रेष्ठो
    महालोकपतिर्महान् ॥ १५॥ सिद्धार्थः सिद्धसङ्कल्पः सिद्धिदः सिद्धसाधनः । सिद्धेशः सिद्धमार्गाग्रः सिद्धलोकैकपालकः
    ॥ १६॥ इष्टो विशिष्टः शिष्टेष्टो महिष्ठो जिष्णुरुत्तमः । ज्येष्ठः श्रेष्ठश्च सर्वेष्टो विष्णुर्भ्राजिष्णुरव्ययः
    ॥ १७॥ विभुः शम्भुः प्रभुर्भूमा स्वभूः स्वानन्दमूर्तिमान् । प्रीतिमान् प्रीतिदाता च प्रीतिदः प्रीतिवर्धनः
    ॥ १८॥ योगेश्वरो योगगम्यो योगीशो योगपारगः । योगदाता योगपतिर्योगसिद्धिविधायकः ॥ १९॥ सत्यव्रतः सत्यपरः
    त्रिसत्यः सत्यकारणः । सत्याश्रयः सत्यहरः सत्पालिः सत्यवर्धनः ॥ २०॥ सर्वानन्दः सर्वहरः सर्वगः सर्ववश्यकृत्
    । सर्वपाता सर्वसुखः सर्वश्रुतिगणार्णवः ॥ २१॥ जनार्दनो जगन्नाथो जगत्त्राता जगत्पिता । जगत्कर्ता जगद्धर्ता
    जगदानन्दमूर्तिमान् ॥ २२॥ धरापतिर्लोकपतिः स्वर्पतिर्जगताम्पतिः । विद्यापतिर्वित्तपतिः सत्पतिः कमलापतिः
    ॥ २३॥ चतुरात्मा चतुर्बाहुश्चतुर्वर्गफलप्रदः । चतुर्व्यूहश्चतुर्धामा चतुर्युगविधायकः ॥ २४॥ आदिदेवो
    देवदेवो देवेशो देवधारणः । देवकृद्देवभृद्देवो देवेडितपदाम्बुजः ॥ २५॥ विश्वेश्वरो विश्वरूपी विश्वात्मा
    विश्वतोमुखः । विश्वसूर्विश्वफलदो विश्वगो विश्वनायकः ॥ २६॥ भूतकृद्भूतभृद्भावो भूतात्मा भूतभावनः । भूतिदो
    भूतिविस्तारो विभूतिर्भूतिपालकः ॥ २७॥ नारायणो नारशायी नारसूर्नारजीवनः । नारैकफलदो नारमुक्तिदो नारनायकः
    ॥ २८॥ सहस्ररूपः साहस्रनामा साहस्रविग्रहः । सहस्रशीर्षा साहस्रपादाक्षिभुजशीर्षवान् ॥ २९॥ पद्मनाभः पद्मगर्भः
    पद्मी पद्मनिभेक्षणः । पद्मशायी पद्ममाली पद्माङ्कितपदद्वयः ॥ ३०॥ वीर्यवान् स्थैर्यवान् वाग्मी शौर्यवान्
    धैर्यवान् क्षमी । धीमान् धर्मपरो भोगी भगवान् भयनाशनः ॥ ३१॥ जयन्तो विजयो जेता जयदो जयवर्धनः । अमानी
    मानदो मान्यो महिमावान्महाबलः ॥ ३२॥ सन्तुष्टस्तोषदो दाता दमनो दीनवत्सलः । ज्ञानी यशस्वान् धृतिमान्
    सह ओजोबलाश्रयः ॥ ३३॥ हयग्रीवो महातेजा महार्णवविनोदकृत् । मधुकैटभविध्वंसी वेदकृद्वेदपालकः ॥ ३४॥ सनत्कुमारः
    सनकः सनन्दश्च सनातनः । अखण्डब्रह्मव्रतवानात्मा योगविवेचकः ॥ ३५॥ श्रीनारदो देवऋषिः कर्माकर्मप्रवर्तकः
    । सात्वतागमकृल्लोकहिताहितप्रसूचकः ॥ ३६॥ आदिकालो यज्ञतत्त्वं धातृनासापुटोद्भवः । दन्ताग्रन्यस्तभूगोलो
    हिरण्याक्षबलान्तकः ॥ ३७॥ पृथ्वीपतिः शीघ्रवेगो रोमान्तर्गतसागरः । श्वासावधूतहेमाद्रिः प्रजापतिपतिस्तुतः
    ॥ ३८॥ अनन्तो धरणीभर्ता पातालतलवासकृत् । कामाग्निजवनो नागराजराजो महाद्युतिः ॥ ३९॥ महाकूर्मो विश्वकायः
    शेषभुक्सर्वपालकः । लोकपितृगणाधीशः पितृस्तुतमहापदः ॥ ४०॥ कृपामयः स्वयं व्यक्तिर्ध्रुवप्रीतिविवर्धनः
    । ध्रुवस्तुतपदो विष्णुलोकदो लोकपूजितः ॥ ४१॥ शुक्लः कर्दमसन्तप्तस्तपस्तोषितमानसः । मनोऽभीष्टप्रदो हर्षबिन्द्वञ्चितसरोवरः
    ॥ ४२॥ यज्ञः सुरगणाधीशो दैत्यदानवघातकः । मनुत्राता लोकपालो लोकपालकजन्मकृत् ॥ ४३॥ कपिलाख्यः साङ्ख्यपाता
    कर्दमाङ्गसमुद्भवः । सर्वसिद्धगणाधीशो देवहूतिगतिप्रदः ॥ ४४॥ दत्तोऽत्रितनयो योगी योगमार्गप्रदर्शकः ।
    अनसूयानन्दकरः सर्वयोगिजनस्तुतः ॥ ४५॥ नारायणो नरऋषिर्धर्मपुत्रो महामनाः । महेशशूलदमनो महेशैकवरप्रदः
    ॥ ४६॥ आकल्पान्ततपोधीरो मन्मथादिमदापहः । ऊर्वशीसृग्जितानङ्गो मार्कण्डेयप्रियप्रदः ॥ ४७॥ ऋषभो नाभिसुखदो
    मेरुदेवीप्रियात्मजः । योगिराजद्विजस्रष्टा योगचर्याप्रदर्शकः ॥ ४८॥ अष्टबाहुर्दक्षयज्ञपावनोऽखिलसत्कृतः
    । दक्षेशद्वेषशमनो दक्षज्ञानप्रदायकः ॥ ४९॥ प्रियव्रतकुलोत्पन्नो गयनामा महायशाः । उदारकर्मा बहुविन्महागुणगणार्णवः
    ॥ ५०॥ हंसरूपी तत्त्ववक्ता गुणागुणविवेचकः । धातृलज्जाप्रशमनो ब्रह्मचारिजनप्रियः ॥ ५१॥ वैश्यः पृथुः
    पृथ्विदोग्धा सर्वजीवनदोहकृत् । आदिराजो जनावासकारको भूसमीकरः ॥ ५२॥ प्रचेतोऽभिष्टुतपदः शान्तमूर्तिः
    सुदर्शनः । दिवारात्रिगणाधीशः केतुमानजनाश्रयः ॥ ५३॥ श्रीकामदेवः कमलाकामकेलिविनोदकृत् । स्वपादरतिदोऽभीष्टसुखदो
    दुःखनाशनः ॥ ५४॥ विभुर्धर्मभृतां श्रेष्ठो वेदशीर्षो द्विजात्मजः । अष्टाशीतिसहस्राणां मुनीनामुपदेशदः
    ॥ ५५॥ सत्यसेनो यक्षरक्षोदहनो दीनपालकः । इन्द्रमित्रः सुरारिघ्नः सूनृताधर्मनन्दनः ॥ ५६॥ हरिर्गजवरत्राता
    ग्राहपाशविनाशकः । त्रिकूटाद्रिवनश्लाघी सर्वलोकहितैषणः ॥ ५७॥ वैकुण्ठशुभ्रासुखदो विकुण्ठासुन्दरीसुतः
    । रमाप्रियकरः श्रीमान्निजलोकप्रदर्शकः ॥ ५८॥ विप्रशापपरीखिन्ननिर्जरार्तिनिवारणः । दुग्धाब्धिमथनो विप्रो
    विराजतनयोऽजितः ॥ ५९॥ मन्दाराद्रिधरः कूर्मो देवदानवशर्मकृत् । जम्बूद्वीपसमः स्रष्टा पीयूषोत्पत्तिकारणम्
    ॥ ६०॥ धन्वन्तरी रुक्।ग्शमनोऽमृतधुक्रुक्प्रशान्तकः । आयुर्वेदकरो वैद्यराजो विद्याप्रदायकः ॥ ६१॥ देवाभयकरो
    दैत्यमोहिनी कामरूपिणी । गीर्वाणामृतपो दुष्टदैत्यदानववञ्चकः ॥ ६२॥ महामत्स्यो महाकायः शल्कान्तर्गतसागरः
    । वेदारिदैत्यदमनो व्रीहिबीजसुरक्षकः ॥ ६३॥ पुच्छाघातभ्रमत्सिन्धुः सत्यव्रतप्रियप्रदः । भक्तसत्यव्रतत्राता
    योगत्रयप्रदर्शकः ॥ ६४॥ नरसिंहो लोकजिह्वः शङ्कुकर्णो नखायुधः । सटावधूतजलदो दन्तद्युतिजितप्रभः ॥ ६५॥
    हिरण्यकशिपुध्वंसी बहुदानवदर्पहा । प्रह्लादस्तुतपादाब्जो भक्तसंसारतापहा ॥ ६६॥ ब्रह्मेन्द्ररुद्रभीतिघ्नो
    देवकार्यप्रसाधकः । ज्वलज्ज्वलनसङ्काशः सर्वभीतिविनाशकः ॥ ६७॥ महाकलुषविध्वंसी सर्वकामवरप्रदः । कालविक्रमसंहर्ता
    ग्रहपीडाविनाशकः ॥ ६८॥ सर्वव्याधिप्रशमनः प्रचण्डरिपुदण्डकृत् । उग्रभैरवसन्त्रस्तहरार्तिविनिवारकः ॥
    ६९॥ ब्रह्मचर्मावृतशिराः शिवशीर्षैकनूपुरः । द्वादशादित्यशीर्षैकमणिर्दिक्पालभूषणः ॥ ७०॥ वामनोऽदितिभीतिघ्नो
    द्विजातिगणमण्डनः । त्रिपदव्याजयाञ्चाप्तबलित्रैलोक्यसम्पदः ॥ ७१॥ पन्नखक्षतब्रह्माण्डकटाहोऽमितविक्रमः
    ।
