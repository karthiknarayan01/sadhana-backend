id: krishnanarayanastotram
category: stotram
name:
  english: krishnanarayanastotram
  devanagari: कृष्णनारायणस्तोत्रम्
content:
  english: '|| 45|| yato radhadayashcapi bhavanmurteh prashaktayah | asmadardhangatam praptastasmai pitre
    namo namah || 46|| yatashca''nye''sankhyarupa avatara bhavantyapi | tasmai mulaparabrahmapitre namo''vatarine
    || 47|| prasanno bhava krishnesha nijarupeshu sarvatha | yadajnam pravahamo''tra tasmai pitre muhurnamah
    || 48|| sada tvatpujanam catra karomi sarvatha pitah | anugraham sadecchami pavito''ham sasarthakah
    || 49|| evam stutva harim natva labdhva prasadamuttamam | vidayam pradadau krishnah krishnanarayanaya
    vai || 50|| iti shrilakshminarayaniyasamhitayah tishyasantanatmakasya shrikrishnena tatha gopaih gopibhishca
    kritam krishnanarayanastotram sampurnam | lakshminarayaniyasamhita | khanda 4| adhyaya 99'
  devanagari: ॥ ४५॥ यतो राधादयश्चापि भवन्मूर्तेः प्रशक्तयः । अस्मदर्धाङ्गतां प्राप्तास्तस्मै पित्रे नमो
    नमः ॥ ४६॥ यतश्चाऽन्येऽसङ्ख्यरूपा अवतारा भवन्त्यपि । तस्मै मूलपरब्रह्मपित्रे नमोऽवतारिणे ॥ ४७॥ प्रसन्नो
    भव कृष्णेश निजरूपेषु सर्वथा । यदाज्ञां प्रवहामोऽत्र तस्मै पित्रे मुहुर्नमः ॥ ४८॥ सदा त्वत्पूजनं चात्र
    करोमि सर्वथा पितः । अनुग्रहं सदेच्छामि पावितोऽहं ससार्थकः ॥ ४९॥ एवं स्तुत्वा हरिं नत्वा लब्ध्वा प्रसादमुत्तमम्
    । विदायं प्रददौ कृष्णः कृष्णनारायणाय वै ॥ ५०॥ इति श्रीलक्ष्मीनारायणीयसंहितायाः तिष्यसन्तानात्मकस्य
    श्रीकृष्णेन तथा गोपैः गोपीभिश्च कृतं कृष्णनारायणस्तोत्रं सम्पूर्णम् । लक्ष्मीनारायणीयसंहिता । खण्ड
    ४। अध्याय ९९
