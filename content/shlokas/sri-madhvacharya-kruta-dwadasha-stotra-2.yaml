id: sri-madhvacharya-kruta-dwadasha-stotra-2
category: stotram
name:
  english: Sri Madhvacharya Kruta Dwadasha Stotra - 2
content:
  english: atha dvitiyastotram svajanodadhisamvriddhi purnacandro gunarnavah | amandananda sandro nah
    sadavyadindirapatih || priyatamindirapatih ramacakorividhave dushtadarpodavahnaye | satpanthajanagehaya
    namo narayanaya te || || cidacidbhedam akhilam vidhayadhaya bhunjate | avyakritaguhasthaya ramapranayine
    namah || || amandagunasaro'pi mandahasena vikshitah | nityamindiraya'nandasandro yo naumi tam harim
    || na kasyapi yo'jito vijitakhilah | sarvakarta na kriyate tam namami ramapatim || || agunayagunodreka
    svarupayadikarine | vidaritarisanghaya vasudevaya te namah || || adidevaya devanam pataye saditaraye
    | anadyajnanaparaya namah paravarashraya || ajaya janayitre'sya vijitakhiladanava | ajadi pujyapadaya
    namaste garudadhvaja || || indiramandasandragrya katakshaprekshitatmane | asmadishtaika karyaya purnaya
    haraye namah || || iti shrimadanandatirthabhagavatpadacarya viracitam dvadashastotreshu dvitiyastotram
    sampurnam
  devanagari: अथ द्वितीयस्तोत्रम् स्वजनोदधिसंवृद्धि पूर्णचन्द्रो गुणार्णवः । अमन्दानन्द सान्द्रो नः सदाव्यादिन्दिरापतिः
    ॥ प्रीयातामिन्दिरापतिः रमाचकोरीविधवे दुष्टदर्पोदवह्नये । सत्पान्थजनगेहाय नमो नारायणाय ते ॥ ॥ चिदचिद्भेदं
    अखिलं विधायाधाय भुञ्जते । अव्याकृतगुहस्थाय रमाप्रणयिने नमः ॥ ॥ अमन्दगुणसारोऽपि मन्दहासेन वीक्षितः
    । नित्यमिन्दिरयाऽनन्दसान्द्रो यो नौमि तं हरिम् ॥ न कस्यापि योऽजितो विजिताखिलः । सर्वकर्ता न क्रियते
    तं नमामि रमापतिम् ॥ ॥ अगुणायगुणोद्रेक स्वरूपायादिकारिणे । विदारितारिसङ्घाय वासुदेवाय ते नमः ॥ ॥ आदिदेवाय
    देवानां पतये सादितारये । अनाद्यज्ञानपाराय नमः पारावराश्रय ॥ अजाय जनयित्रेऽस्य विजिताखिलदानव । अजादि
    पूज्यपादाय नमस्ते गरुडध्वज ॥ ॥ इन्दिरामन्दसान्द्राग्र्य कटाक्षप्रेक्षितात्मने । अस्मदिष्टैक कार्याय
    पूर्णाय हरये नमः ॥ ॥ इति श्रीमदानन्दतीर्थभगवत्पादाचार्य विरचितं द्वादशस्तोत्रेषु द्वितीयस्तोत्रं सम्पूर्णम्
