id: vyaghralayeshashatakam
category: shataka
name:
  english: vyaghralayeshashatakam
  devanagari: व्याघ्रालयेशशतकम्
content:
  english: '|| 74|| prenkhatpracinamundaprakarasahacarasankhyagangataranga prenkhakhelatkiritamritakiranamahomohiyadahkadambam
    | driptairdavirkarendrairdridhaparikalitam taptatamrabhamabha liptasham vyaghragehatripuraharasatabandhamantah
    samikshe || 75|| shrimanmugdhenducudam jalamukharajatajutajushtam trinetram nasalakshmivilasojjvalamukhakamalashrilasannilakantham
    | bhuyo bhuyo bhujangangadabhujagamrigadyancitam cintaye''ham haribhutoragorah sthalamudarakrisham
    vyaghrageheshadeham || 76|| krittartim kritticelakalitakatitatam sarpakancikalapam carururam sujanum
    sujanajananabhitsundarakarajangham | padagridanabhangayashcitamamalanakham ragaranyodaranghrim vande''ham
    dehamaisham muhuratisubhagam vyaghragehasthamadyam || 77|| bhasvadbhasmangaragadhikadhavalitasarvangamayanghrimule
    dossimasvoshthabimbe''pyarunimakalitam kanthanale''tikalam | bhasvatsomagninetropari shirasi jatajudalakshmya
    lasantya lasyenanandadam me hridi muhurudiyavdyaghrageheshagatram || 78|| patalanghrim varovirvalayakatitatam
    satyalokottamangam pataram vishtapanam parikalitaviradatmana canuvelam | pativratyena cinta bhajatu
    mama mahapapapakopajatat patityatturnasuttarayatu ca kripaya vyaghrageheshvaro mam || 79|| shaivam
    padadi keshavadhi vapuratha keshadipadavasanam caivam samstuya bhuyo hridayabhuvi samadhaya sancintya
    bhaktya | kaivalyam prarthayamo muhuramitadayam vyaghragehasthamadyam daivam drak no''kulam bhavatu
    bhavabhayapayadanandarupam || 80|| satsankrantyutsavashtamyabhinavashivaratrayadikaleshu manye yatsayujyam
    prayatastribhuvanajanatah samyagambhojajanma | vatsasteyena krishnat punaradhigataya pushtaya srishtishaktya
    citsvacchatma carikartyavatu sa bhagavan vyaghrageheshvaro mam || 81|| dharmartho kamamokshavapi bhuvi
    purushartha hi teshvarthakamau janmopekshyapi grihnantyalamakhilajana jivitadapyabhishtau | dharmom
    mokshashca shva dhatrayamadhikamasharanau nah taddvayartham yatante samyagvyaghralayadhishvarakritakripaya
    yatra tebhyo namo''stu || 82|| nityanyayarjita yairadhikatamamanahshuddhipurvam vidheyo matyairdharmastadartham
    vidadhati vividhadharmavrindam vrithandhah | prithvayam vyaghralayadhishvarapuraharamuddishya yairdishyate''nnam
    pathyam bhaktya yathashaktyatithishu hridi tan kurmahe dharmashilan || 83|| mokshopayeshu mukhyam
    trayamiha bhagavatprapakam prakritanam sakshajjnanam ca satkarma ca madanaripau pumsi bhaktishca bhadra
    | rakshasya shikshaya syadanavadhijanibhirjnanamarthadyashuddhaya ruksham karmapi bhaktirbhavatu mama
    bhrisham vyaghragehadhinathe || 84|| tarkagranthantaranamatikathinataya durgamo jnanayogo nishkamah
    karmayogo bhagavati nihito dushkarah kinca tabhyam | bhuyannanabhavante trayasulabhatame bhaktiyoge''dhikaro
    bhuyan sa vyaghragehatrinayanakarunapangapatena me syat || 85|| gitadinamagadhadatishayavishadam yasya
    narayaniye gitam jnanadiyogatrayagunaganane samyabhajo''pyasamyam | bhitanam madrishanam gatiriha
    yamrite nasti tam bhaktiyogam bhutanamekabandhurvitaratu bhagavana vyaghrageheshvaro me || 86|| bahushrutyam
    tapashca vratakulamakhilam brahmacarya ca vacam yahulyenalamaindram sadanamapi viphalam yam vina yam
    prasiddham |'
  devanagari: ॥ ७४॥ प्रेङ्खत्प्राचीनमुण्डप्रकरसहचरासङ्ख्यगङ्गातरङ्ग प्रेङ्खाखेलत्किरीटामृतकिरणमहोमोहियादःकदम्बम्
    । दृप्तैर्दवीर्करेन्द्रैर्दृढपरिकलितं तप्तताम्राभमाभा लिप्ताशं व्याघ्रगेहत्रिपुरहरसटाबन्धमन्तः समीक्षे
    ॥ ७५॥ श्रीमन्मुग्धेन्दुचूडं जलमुखरजटाजूटजुष्टं त्रिनेत्रं नासालक्ष्मीविलासोज्ज्वलमुखकमलश्रीलसन्नीलकण्ठम्
    । भूयो भूयो भुजङ्गाङ्गदभुजगमृगाद्यञ्चितं चिन्तयेऽहं हारीभूतोरगोरः स्थलमुदरकृशं व्याघ्रगेहेशदेहम् ॥
    ७६॥ कृत्तार्तिं कृत्तिचेलाकलितकटितटं सर्पकाञ्चीकलापं चारूरूरं सुजानुं सुजनजननभित्सुन्दराकारजङ्घम्
    । पादाग्रीदनभङ्गयश्चितममलनखं रागरन्योदराङ्घ्रिं वन्देऽहं देहमैशं मुहुरतिसुभगं व्याघ्रगेहस्थमाद्यम्
    ॥ ७७॥ भास्वद्भस्माङ्गरागाधिकधवलितसर्वाङ्गमयङ्घ्रिमूले दोस्सीमस्वोष्ठबिम्बेऽप्यरुणिमकलितं कण्ठनालेऽतिकालम्
    । भास्वत्सोमाग्निनेत्रोपरि शिरसि जटाजूदलक्ष्म्या लसन्त्या लास्येनानन्ददं मे हृदि मुहुरुदियाव्द्याघ्रगेहेशगात्रम्
    ॥ ७८॥ पातालाङ्घ्रिं वरोवीर्वलयकटितटं सत्यलोकोत्तमाङ्गं पातारं विष्टपानां परिकलितविराडात्मना चानुवेलम्
    । पातिव्रत्येन चिन्ता भजतु मम महापापापाकोपजातात् पातित्यात्तूर्णसुत्तारयतु च कृपया व्याघ्रगेहेश्वरो
    माम् ॥ ७९॥ शैवं पादादि केशावधि वपुरथ केशादिपादावसानं चैवं संस्तूय भूयो हृदयभुवि समाधाय सञ्चिन्त्य
    भक्त्या । कैवल्यं प्रार्थयामो मुहुरमितदयं व्याघ्रगेहस्थमाद्यं दैवं द्राक् नोऽकूलं भवतु भवभयापायदानन्दरूपम्
    ॥ ८०॥ सत्सङ्क्रान्त्युत्सवाष्टम्यभिनवशिवरात्रयादिकालेषु मन्ये यत्सायुज्यं प्रयातास्त्रिभुवनजनताः सम्यगम्भोजजन्मा
    । वत्सस्तेयेन कृष्णात् पुनरधिगतया पुष्टया सृष्टिशक्त्या चित्स्वच्छात्मा चरीकर्त्यवतु स भगवान् व्याघ्रगेहेश्वरो
    माम् ॥ ८१॥ धर्मार्थो काममोक्षावपि भुवि पुरुषार्था हि तेष्वर्थकामौ जन्मोपेक्ष्यापि गृह्णन्त्यलमखिलजना
    जीवितादप्यभीष्टौ । धर्मों मोक्षश्च श्व धात्रयामधिकमशरणौ णाः तद्द्वयार्थं यतन्ते सम्यग्व्याघ्रालयाधीश्वरकृतकृपया
    यत्र तेभ्यो नमोऽस्तु ॥ ८२॥ नित्यन्यायार्जिता यैरधिकतममनःशुद्धिपूर्वं विधेयो मत्यैर्धर्मस्तदर्थं विदधति
    विविधाधर्मवृन्दं वृथान्धाः । पृथ्वयां व्याघ्रालयाधीश्वरपुरहरमुद्दिश्य यैर्दिश्यतेऽन्नं पथ्यं भक्त्या
    यथाशक्त्यतिथिषु हृदि तान् कुर्महे धर्मशीलान् ॥ ८३॥ मोक्षोपायेषु मुख्यं त्रयमिह भगवत्प्रापकं प्राकृतानां
    साक्षाज्ज्ञानं च सत्कर्म च मदनरिपौ पुंसि भक्तिश्च भद्रा । राक्षस्या शिक्षया स्यादनवधिजनिभिर्ज्ञानमर्थाद्यशुद्धया
    रूक्षं कर्मापि भाक्तिर्भवतु मम भृशं व्याघ्रगेहाधिनाथे ॥ ८४॥ तर्कग्रन्थान्तराणामतिकठिनतया दुर्गमो ज्ञानयोगो
    निष्कामः कर्मयोगो भगवति निहितो दुष्करः किञ्च ताभ्याम् । भूयान्नानाभवान्ते त्रयसुलभतमे भक्तियोगेऽधिकारो
    भूयान् स व्याघ्रगेहत्रिनयनकरुणापाङ्गपातेन मे स्यात् ॥ ८५॥ गीतादीनामगाधादतिशयविशदं यस्य नारायणीये गीतं
    ज्ञानादियोगत्रयगुणगणने साम्यभाजोऽप्यसाम्यम् । भीतानां मादृशानां गतिरिह यमृते नास्ति तं भक्तियोगं भूतानामेकबन्धुर्वितरतु
    भगवान व्याघ्रगेहेश्वरो मे ॥ ८६॥ बाहुश्रुत्यं तपश्च व्रतकुलमखिलं ब्रह्मचर्य च वाचां याहुल्येनालमैन्द्रं
    सदनमपि विफलं यां विना यां प्रसिद्धाम् ।
