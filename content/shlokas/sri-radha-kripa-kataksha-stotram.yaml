id: sri-radha-kripa-kataksha-stotram
category: stotram
name:
  english: Sri Radha Kripa Kataksha Stotram
content:
  english: sangate kada karishyasiha mam kripakataksha pallava prabharunanghri komale | varabhayasphuratkare
    prabhutasampadalaye kada karishyasiha mam kripakataksha bhruvam savibhramam sasambhramam driganta
    banapatanaih | nirantaram vashikritapratitanandanandane kada karishyasiha mam kripakataksha sharadendumandale
    | vicitra locane kada karishyasiha mam kripakataksha kovide kada karishyasiha mam kripakataksha bhushite
    prabhutashatakumbha kumbhasustani | prashastamanda hasyacurna purnasaukhya sagare kada karishyasiha
    mam kripakataksha locanavalokane | lalallulanmilanmanojna mohinashrite kada karishyasiha mam kripakataksha
    gumphite kada karishyasiha mam kripakataksha pushpamekhalagune prashastaratna madhya manjule | karindra
    varohasaubhagoruke kada karishyasiha mam kripakataksha cankrame kada karishyasiha mam kripakataksha
    padmajarcite himadrija nakhe kada karishyasiha mam kripakataksha || makheshvari kriyeshvari svadheshvari
    sureshvari triveda shasaneshvari | rameshvari kshameshvari pramoda kananeshvari vrajeshvari vrajadhipe
    shriradhike namostute || stavam nishamya bhanunandini karotu santatam janam kripakataksha bhajanam
    | bhavettadaiva sancita trirupa karma nashanam labhettada vrajendra || rakayam ca sitashtamyam dashamyam
    ca vishuddhadhih | ekadashyam trayodashyam yah pathetsadhakah sudhih || || yam yam kamayate kamam
    tam tamapnoti sadhakah | radhakripakatakshena bhaktihsyat premalakshana || || urudaghne nabhidaghne
    hriddaghne kanthadaghnake | radhakundajale sthita yah pathet sadhakah shatam || || tasya sarvartha
    siddhih syad vaksamarthyam tatha labhet | aishvaryam ca labhet sakshaddrisha pashyati radhikam ||
    || tena sa tatkshanadeva tushta datte mahavaram | yena pashyati netrabhyam tat priyam shyamasundaram
    || pravesham ca dadati shri vrajadhipah | atah parataram prarthyam vaishnavasya na vidyate || || ||
    iti shrimadurdhvamnaye shriradhikayah kripakatakshastotram sampurnam ||
  devanagari: सङ्गते कदा करिष्यसीह मां कृपाकटाक्ष पल्लव प्रभारुणाङ्घ्रि कोमले । वराभयस्फुरत्करे प्रभूतसम्पदालये
    कदा करिष्यसीह मां कृपाकटाक्ष भ्रुवां सविभ्रमं ससम्भ्रमं दृगन्त बाणपातनैः । निरन्तरं वशीकृतप्रतीतनन्दनन्दने
    कदा करिष्यसीह मां कृपाकटाक्ष शारदेन्दुमण्डले । विचित्र लोचने कदा करिष्यसीह मां कृपाकटाक्ष कोविदे कदा
    करिष्यसीह मां कृपाकटाक्ष भूषिते प्रभूतशातकुम्भ कुम्भसुस्तनि । प्रशस्तमन्द हास्यचूर्ण पूर्णसौख्य सागरे
    कदा करिष्यसीह मां कृपाकटाक्ष लोचनावलोकने । ललल्लुलन्मिलन्मनोज्ञ मोहिनाश्रिते कदा करिष्यसीह मां कृपाकटाक्ष
    गुम्फिते कदा करिष्यसीह मां कृपाकटाक्ष पुष्पमेखलागुणे प्रशस्तरत्न मध्य मञ्जुले । करीन्द्र वरोहसौभगोरुके
    कदा करिष्यसीह मां कृपाकटाक्ष चङ्क्रमे कदा करिष्यसीह मां कृपाकटाक्ष पद्मजार्चिते हिमाद्रिजा नखे कदा
    करिष्यसीह मां कृपाकटाक्ष ॥ मखेश्वरि क्रियेश्वरि स्वधेश्वरि सुरेश्वरि त्रिवेद शासनेश्वरि । रमेश्वरि
    क्षमेश्वरि प्रमोद काननेश्वरि व्रजेश्वरि व्रजाधिपे श्रीराधिके नमोस्तुते ॥ स्तवं निशम्य भानुनन्दिनी
    करोतु सन्ततं जनं कृपाकटाक्ष भाजनम् । भवेत्तदैव सञ्चित त्रिरूप कर्म नाशनं लभेत्तदा व्रजेन्द्र ॥ राकायां
    च सिताष्टम्यां दशम्यां च विशुद्धधीः । एकादश्यां त्रयोदश्यां यः पठेत्साधकः सुधीः ॥ ॥ यं यं कामयते कामं
    तं तमाप्नोति साधकः । राधाकृपाकटाक्षेण भक्तिःस्यात् प्रेमलक्षणा ॥ ॥ ऊरुदघ्ने नाभिदघ्ने हृद्दघ्ने कण्ठदघ्नके
    । राधाकुण्डजले स्थिता यः पठेत् साधकः शतम् ॥ ॥ तस्य सर्वार्थ सिद्धिः स्याद् वाक्सामर्थ्यं तथा लभेत्
    । ऐश्वर्यं च लभेत् साक्षाद्दृशा पश्यति राधिकाम् ॥ ॥ तेन स तत्क्षणादेव तुष्टा दत्ते महावरम् । येन पश्यति
    नेत्राभ्यां तत् प्रियं श्यामसुन्दरम् ॥ प्रवेशं च ददाति श्री व्रजाधिपः । अतः परतरं प्रार्थ्यं वैष्णवस्य
    न विद्यते ॥ ॥ ॥ इति श्रीमदूर्ध्वाम्नाये श्रीराधिकायाः कृपाकटाक्षस्तोत्रं सम्पूर्णम् ॥
