    नमः ॐ परब्रह्मणे नमः ॥ ॥ ॐ अघोराय नमः ॐ घोर विक्रमाय नमः ॐ ज्वलन्मुखाय नमः ॐ महा ज्वालाय नमः ॐ ज्वालामालिने
    नमः ॐ महा प्रभवे नमः ॐ निटलाक्षाय नमः ॐ सहस्राक्षाय नमः ॐ दुर्निरीक्षाय नमः ॐ प्रतापनाय नमः ॥ ॥ ॐ
    महादंष्ट्रायुधाय नमः ॐ प्राज्ञाय नमः ॐ चण्डकोपिने नमः ॐ सदाशिवाय नमः ॐ हिरण्यक शिपुध्वंसिने नमः ॐ
