id: suryasahasrabhavishya-2
category: sahasranama
name:
  english: suryasahasraBhavishya
  devanagari: सूर्यसहस्रBहविष्य
content:
  english: om vishvavidvishvajitkarta vishvatma vishvatomukhah | vishveshvaro vishvayonirniyatatma jitendriyah
    || 1|| kalashrayah kalakarta kalaha kalanashanah | mahayogi mahasiddhirmahatma sumahabalah || 2||
    prabhurvibhurbhutanatho bhutatma bhuvaneshvarah | bhutabhavyo bhavitatma bhutantahkaranam shivah ||
    3|| sharanyah kamalanando nandano nandavardhanah | varenyo varado yogi susamyuktah prakashakah ||
    4|| praptayanah parapranah putatma prayatah priyah | nayah sahasrapat sadhurdivyakundalamanditah ||
    5|| avyangadhari dhiratma savita vayuvahanah | samahitamatirdata vidhata kritamangalah || 6|| kapardi
    kalpapadrudrah sumana dharmavatsalah | samayukto vimuktatma kritatma kritinam varah || 7|| avicintyavapuh
    shreshtho mahayogi maheshvarah | kantah kamariradityo niyatatma nirakulah || 8|| kamah karunikah karta
    kamalakarabodhanah | saptasaptiracintyatma mahakarunikottamah || 9|| sanjivano jivanatho jayo jivo
    jagatpatih | ayukto vishvanilayah samvibhagi vrishadhvajah || 10|| vrishakapih kalpakarta kalpantakarano
    ravih | ekacakraratho mauni suratho rathinam varah || 11|| sakrodhano rashmimali tejorashirvibhavasuh
    | divyakriddinakriddevo devadevo divaspatih || 12|| dinanatho haro hota divyabahurdivakarah | yajno
    yajnapatih pusha svarnaretah paravarah || 13|| paraparajnastaraniramshumali manoharah | prajnah prajnapatih
    suryah savita vishnuramshuman || 14|| sadagatirgandhavaho vihito vidhirashugah | patangah patagah
    sthanurvihango vihago varah || 15|| haryashvo haritashvashca haridashvo jagatpriyah | tryambakah sarvadamano
    bhavitatma bhishagvarah || 16|| alokakrillokanatho lokalokanamaskritah | kalah kalpantako vahnistapanah
    sampratapanah || 17|| virocano virupakshah sahasrakshah purandarah | sahasrarashmirmihiro vividhambarabhushanah
    || 18|| khagah pratardano dhanyo hayago vagvisharadah | shrimanashishiro vagmi shripatih shriniketanah
    || 19|| shrikanthah shridharah shriman shrinivaso vasupradah | kamacari mahamayo mahogro'viditamayah
    || 20|| tirthakriyavan sunayo vibhakto bhaktavatsalah | kirtih kirtikaro nityah kundali kavaci rathi
    || 21|| hiranyaretah saptashvah prayatatma parantapah | buddhimanamarashreshtho rocishnuh pakashasanah
    || 22|| samudro dhanado dhata mandhata kashmalapahah | tamoghno dhvantaha vahnirhota'ntahkarano guhah
    || 23|| pashuman prayatanando bhuteshah shrimatam varah | nityo'dito nityarathah sureshah surapujitah
    || 24|| ajito vijito jeta jangamasthavaratmakah | jivanando nityagami vijeta vijayapradah || 25||
    parjanyo'gnih sthitih stheyah sthaviro'tha niranjanah | pradyotano ratharudhah sarvalokaprakashakah
    || 26|| dhruvo meshi mahaviryo hamsah samsaratarakah | srishtikarta kriyaheturmartando marutam patih
    || 27|| marutvan dahanastvashta bhago bhargo'ryama kapih | varunesho jagannathah kritakrityah sulocanah
    || 28|| vivasvan bhanuman karyah karanastejasam nidhih | asangagami tigmamshurgharmamshurdiptadidhitih
    || 29|| sahasradidhitirbradhnah sahasramshurdivakarah | gabhastiman didhitiman sragvi manikuladyutih
    || 30|| bhaskarah surakaryajnah sarvajnastikshnadidhitih | surajyeshthah surapatirbahujno vacasam
    patih || 31|| tejonidhirbrihatteja brihatkirtirbrihaspatih | ahimanurjito dhimanamuktah kirtivardhanah
    || 32|| mahavaidyo ganapatirdhanesho gananayakah | tivrapratapanastapi tapano vishvatapanah || 33||
    kartasvaro hrishikeshah padmanando'tinanditah | padmanabho'mritaharah sthitiman ketuman nabhah ||
    34|| anadyanto'cyuto vishvo vishvamitro ghrinirvirat | amuktakavaco vagmi kancuki vishvabhavanah ||
    35|| animittagatih shreshthah sharanyah sarvatomukhah | vigahi venurasahah samayuktah samakratuh ||
    36|| dharmaketurdharmaratih samharta samyamo yamah | pranatartiharo vayuh siddhakaryo janeshvarah
    || 37|| nabho vigahanah satyah savitatma manoharah | hari harirharo vayurrituh kalanaladyutih || 38||
    sukhasevyo mahateja jagatamekakaranam | mahendro vishtutah stotram stutihetuh prabhakarah || 39||
    sahasrakara ayushman aroshah sukhadah sukhi | vyadhiha sukhadah saukhyam kalyanah kalatam varah ||
    40|| arogyakaranam siddhirriddhirvriddhirbrihaspatih | hiranyareta arogyam vidvan bradhno budho mahan
    || 41|| pranavan dhritiman gharmo gharmakarta rucipradah | sarvapriyah sarvasahah sarvashatruvinashanah
    || 42|| pramshurvidyotano dyotah sahasrakiranah kriti | keyuri bhushanodbhasi bhasito bhasano'nalah
    || 43|| sharanyartiharo hota khadyotah khagasattamah | sarvadyoto bhavadyotah sarvadyutikaro matah
    || 44|| kalyanah kalyanakarah kalyah kalyakarah kavih | kalyanakrit kalyavapuh sarvakalyanabhajanam
    || 45|| shantipriyah prasannatma prashantah prashamapriyah | udarakarma sunayah suvarca varcasojjvalah
    || 46|| varcasvi varcasamishastrailokyesho vashanugah | tejasvi suyasha varshmi varnadhyaksho balipriyah
    || 47|| yashasvi tejonilayastejasvi prakritisthitah | akashagah shighragatirashugo gatiman khagah
    || 48|| gopatirgrahadevesho gomanekah prabhanjanah | janita prajano jivo dipah sarvaprakashakah ||
    49|| sarvasakshi yoganityo nabhasvanasurantakah | rakshoghno vighnashamanah kiriti sumanahpriyah ||
    50|| maricimali sumatih kritabhikhyavisheshakah | shishtacarah shubhakarah svacaracaratatparah ||
    51|| mandaro matharo venuh kshudhapah kshmapatirguruh | suvishishto vishishtatma vidheyo jnanashobhanah
    || 52|| mahashvetah priyo jneyah samago mokshadayakah | sarvavedapragitatma sarvavedalayo mahan ||
    53|| vedamurtishcaturvedo vedabhridvedaparagah | kriyavanasito jishnurvariyamshurvarapradah || 54||
    vratacari vratadharo lokabandhuralankritah | alankaraksharo vedyo vidyavan viditashayah || 55|| akaro
    bhushano bhushyo bhushnurbhuvanapujitah | cakrapanirdhvajadharah suresho lokavatsalah || 56|| vagmipatirmahabahuh
    prakritirvikritirgunah | andhakarapahah shreshtho yugavarto yugadikrit || 57|| aprameyah sadayogi
    nirahankara ishvarah | shubhapradah shubhah shasta shubhakarma shubhapradah || 58|| satyavan shrutimanuccairnakaro
    vriddhido'nalah | balabhridbalado bandhurmatiman balinam varah || 59|| anango nagarajendrah padmayonirganeshvarah
    | samvatsara riturneta kalacakrapravartakah || 60|| padmekshanah padmayonih prabhavanamarah prabhuh
    | sumurtih sumatih somo govindo jagadadijah || 61|| pitavasah krishnavasa digvasastvindriyatigah |
    atindriyo'nekarupah skandah parapuranjayah || 62|| shaktimanjaladhrigbhasvan mokshaheturayonijah |
    sarvadarshi jitadarsho duhsvapnashubhanashanah || 63|| mangalyakarta taranirvegavan kashmalapahah
    | spashtaksharo mahamantro vishakho yajanapriyah || 64|| vishvakarma mahashaktirdyutirisho vihangamah
    | vicakshano daksha indrah pratyushah priyadarshanah || 65|| akhinno vedanilayo vedavidviditashayah
    | prabhakaro jitaripuh sujano'runasarathih || 66|| kunashi suratah skando mahito'bhimato guruh | graharajo
    grahapatirgrahanakshatramandalah || 67|| bhaskarah satatanando nandano naravahanah | mangalo'tha mangalavan
    mangalyo mangalavahah || 68|| mangalyacarucaritah shirnah sarvavrato vrati | caturmukhah padmamali
    putatma pranatartiha || 69|| akincanah satamisho nirguno gunavancucih | sampurnah pundarikaksho vidheyo
    yogatatparah || 70|| sahasramshuh kratumatih sarvajnah sumatih suvak | suvahano malyadama kritaharo
    haripriyah || 71|| brahma pracetah prathitah prayatatma sthiratmakah | shatavinduh shatamukho gariyananalaprabhah
    || 72|| dhiro mahattaro viprah puranapurushottamah | vidyarajadhirajo hi vidyavan bhutidah sthitah
    || 73|| anirdeshyavapuh shriman vipapma bahumangalah | svahsthitah surathah svarno mokshado baliketanah
    || 74|| nirdvandvo dvandvaha sargah sarvagah samprakashakah | dayaluh sukshmadhih kshantih kshemakshemasthitipriyah
    || 75|| bhudharo bhupatirvakta pavitratma trilocanah | mahavarahah priyakriddata bhokta'bhayapradah
    || 76|| cakravarti dhritikarah sampurno'tha maheshvarah | caturvedadharo'cintyo vinindyo vividhashanah
    || 77|| vicitraratha ekaki saptasaptih paratparah | sarvodadhisthitikarah sthitistheyah sthitipriyah
    || 78|| nishkalah pushkalo vibhurvasuman vasavapriyah | pashuman vasavasvami vasudhama vasupradah
    || 79|| balavan jnanavamstattvamonkarastrishu samsthitah | sankalpayonirdinakridbhagavan karanapahah
    || 80|| nilakantho dhanadhyakshashcaturvedapriyamvadah | vashatkarodgata hota svahakaro hutahutih
    || 81|| janardano jananando naro narayano'mbudah | sandehanashano vayurdhanvi suranamaskritah || 82||
    vigrahi vimalo vindurvishoko vimaladyutih | dyutiman dyotano vidyudvidyavan vidito bali || 83|| gharmado
    himado hasah krishnavartma sutajitah | savitribhavito raja vishvamitro ghrinirvirat || 84|| saptarcih
    saptaturagah saptalokanamaskritah | sampurno'tha jagannathah sumanah shobhanapriyah || 85|| sarvatma
    sarvakrit srishtih saptiman saptamipriyah | sumedha medhiko medhyo medhavi madhusudanah || 86|| angirahpatih
    kalajno dhumaketuh suketanah | sukhi sukhapradah saukhyam kami kantipriyo munih || 87|| saukhyam kantih
    santapanah santapana atapastapasam patih | umapatih sahasramshuh priyakari priyankarah || 88|| pritirvimanyurambhotthah
    khanjano jagatam patih | jagatpita pritamanah sarvah kharvo guho'calah || 89|| sarvago jagadanando
    jaganneta surariha | shreyah shreyaskaro jyayan mahanuttama udbhavah || 90|| uttamo merumeyo'tha dharano
    dharanidharah | dharadhyaksho dharmarajo dharmadharmapravartakah || 91|| rathadhyaksho rathagatistarunastanito'nalah
    | uttaro'nuttarastapi avakpatirapam patih || 92|| punyasankirtanah punyo heturlokatrayashrayah | svarbhanurvigatanando
    vishishtotkrishtakarmakrit || 93|| vyadhipranashanah kshemah shurah sarvajitam varah | ekaratho rathadhishah
    pita shanaishcarasya hi || 94|| vaivasvatagururmrityurdharmanityo mahavratah | pralambaharasancari
    pradyoto dyotitanalah || 95|| santapahrit paro mantro mantramurtirmahabalah | shreshthatma supriyah
    shambhurmarutamishvareshvarah || 96|| samsaragativiccetta samsararnavatarakah | saptajihvah sahasrarci
    ratnagarbho'parajitah || 97|| dharmaketurameyatma dharmadharmavarapradah | lokasakshi lokagururlokeshashcandavahanah
    || 98|| dharmayupo yupavriksho dhanushpanirdhanurdharah | pinakadhrinmahotsaho mahamayo mahashanah
    || 99|| virah shaktimatam shreshthah sarvashastrabhritam varah | jnanagamyo duraradhyo lohitango vivardhanah
    || 100|| khago'ndho dharmado nityo dharmakriccitravikramah | bhagavanatmavan mantrastryaksharo nilalohitah
    || 101|| eko'nekastrayi kalah savita samitinjayah | sharngadhanva'nalo bhimah sarvapraharanayudhah
    || 102|| sukarma parameshthi ca nakapali divisthitah | vadanyo vasukirvaidya atreyo'tha parakramah
    || 103|| dvaparah paramodarah paramo brahmacaryavan | udicyavesho mukuti padmahasto himamshubhrit
    || 104|| sitah prasannavadanah padmodaranibhananah | sayam diva divyavapuranirdeshyo mahalayah ||
    105|| maharatho mahanishah sheshah sattvarajastamah | dhritatapatrapratimo vimarshi nirnayah sthitah
    || 106|| ahimsakah shuddhamatiradvitiyo vivardhanah | sarvado dhanado moksho vihari bahudayakah ||
    107|| caruratriharo natho bhagavan sarvago'vyayah | manoharavapuh shubhrah shobhanah suprabhavanah
    || 108|| suprabhavah supratapah sunetro digvidikpatih | rajnipriyah shabdakaro graheshastimirapahah
    || 109|| saimhikeyaripurdevo varado varanayakah | caturbhujo mahayogi yogishvarapatistatha || 110||
    anadirupo'ditijo ratnakantih prabhamayah | jagatpradipo vistirno mahavistirnamandalah || 111|| ekacakrarathah
    svarnarathah svarnashariradhrik | niralambo gaganago dharmakarmaprabhavakrit || 112|| dharmatma karmanam
    sakshi pratyakshah parameshvarah | merusevi sumedhavi merurakshakaro mahan || 113|| adharabhuto ratimamstatha
    ca dhanadhanyakrit | papasantapaharta ca manovancitadayakah || 114|| rogaharta rajyadayi ramaniyaguno'nrini
    | kalatrayanantarupo munivrindanamaskritah || 115|| sandhyaragakarah siddhah sandhyavandanavanditah
    | samrajyadananiratah samaradhanatoshavan || 116|| bhaktaduhkhakshayakaro bhavasagaratarakah bhayapaharta
    bhagavanaprameyaparakramah | manusvami manupatirmanyo manvantaradhipah || 117|| phalashrutih etatte
    sarvamakhyatam yanmam tvam paripriccasi | namnam sahasram savituh parasharyo yadaha me || 1|| dhanyam
    yashasyamayushyam duhkhaduhsvapnanashanam | bandhamokshakaram caiva bhanornamanukirtanat || 2|| yastvidam
    sha
  devanagari: ॐ विश्वविद्विश्वजित्कर्ता विश्वात्मा विश्वतोमुखः । विश्वेश्वरो विश्वयोनिर्नियतात्मा जितेन्द्रियः
    ॥ १॥ कालाश्रयः कालकर्ता कालहा कालनाशनः । महायोगी महासिद्धिर्महात्मा सुमहाबलः ॥ २॥ प्रभुर्विभुर्भूतनाथो
    भूतात्मा भुवनेश्वरः । भूतभव्यो भावितात्मा भूतान्तःकरणं शिवः ॥ ३॥ शरण्यः कमलानन्दो नन्दनो नन्दवर्धनः
    । वरेण्यो वरदो योगी सुसंयुक्तः प्रकाशकः ॥ ४॥ प्राप्तयानः परप्राणः पूतात्मा प्रयतः प्रियः । नयः सहस्रपात्
    साधुर्दिव्यकुण्डलमण्डितः ॥ ५॥ अव्यङ्गधारी धीरात्मा सविता वायुवाहनः । समाहितमतिर्दाता विधाता कृतमङ्गलः
    ॥ ६॥ कपर्दी कल्पपाद्रुद्रः सुमना धर्मवत्सलः । समायुक्तो विमुक्तात्मा कृतात्मा कृतिनां वरः ॥ ७॥ अविचिन्त्यवपुः
    श्रेष्ठो महायोगी महेश्वरः । कान्तः कामारिरादित्यो नियतात्मा निराकुलः ॥ ८॥ कामः कारुणिकः कर्ता कमलाकरबोधनः
    । सप्तसप्तिरचिन्त्यात्मा महाकारुणिकोत्तमः ॥ ९॥ सञ्जीवनो जीवनाथो जयो जीवो जगत्पतिः । अयुक्तो विश्वनिलयः
    संविभागी वृषध्वजः ॥ १०॥ वृषाकपिः कल्पकर्ता कल्पान्तकरणो रविः । एकचक्ररथो मौनी सुरथो रथिनां वरः ॥ ११॥
    सक्रोधनो रश्मिमाली तेजोराशिर्विभावसुः । दिव्यकृद्दिनकृद्देवो देवदेवो दिवस्पतिः ॥ १२॥ दीननाथो हरो होता
    दिव्यबाहुर्दिवाकरः । यज्ञो यज्ञपतिः पूषा स्वर्णरेताः परावरः ॥ १३॥ परापरज्ञस्तरणिरंशुमाली मनोहरः ।
    प्राज्ञः प्राज्ञपतिः सूर्यः सविता विष्णुरंशुमान् ॥ १४॥ सदागतिर्गन्धवहो विहितो विधिराशुगः । पतङ्गः
    पतगः स्थाणुर्विहङ्गो विहगो वरः ॥ १५॥ हर्यश्वो हरिताश्वश्च हरिदश्वो जगत्प्रियः । त्र्यम्बकः सर्वदमनो
    भावितात्मा भिषग्वरः ॥ १६॥ आलोककृल्लोकनाथो लोकालोकनमस्कृतः । कालः कल्पान्तको वह्निस्तपनः संप्रतापनः
    ॥ १७॥ विरोचनो विरूपाक्षः सहस्राक्षः पुरन्दरः । सहस्ररश्मिर्मिहिरो विविधाम्बरभूषणः ॥ १८॥ खगः प्रतर्दनो
    धन्यो हयगो वाग्विशारदः । श्रीमानशिशिरो वाग्मी श्रीपतिः श्रीनिकेतनः ॥ १९॥ श्रीकण्ठः श्रीधरः श्रीमान्
    श्रीनिवासो वसुप्रदः । कामचारी महामायो महोग्रोऽविदितामयः ॥ २०॥ तीर्थक्रियावान् सुनयो विभक्तो भक्तवत्सलः
    । कीर्तिः कीर्तिकरो नित्यः कुण्डली कवची रथी ॥ २१॥ हिरण्यरेताः सप्ताश्वः प्रयतात्मा परन्तपः । बुद्धिमानमरश्रेष्ठो
    रोचिष्णुः पाकशासनः ॥ २२॥ समुद्रो धनदो धाता मान्धाता कश्मलापहः । तमोघ्नो ध्वान्तहा वह्निर्होताऽन्तःकरणो
    गुहः ॥ २३॥ पशुमान् प्रयतानन्दो भूतेशः श्रीमतां वरः । नित्योऽदितो नित्यरथः सुरेशः सुरपूजितः ॥ २४॥ अजितो
    विजितो जेता जङ्गमस्थावरात्मकः । जीवानन्दो नित्यगामी विजेता विजयप्रदः ॥ २५॥ पर्जन्योऽग्निः स्थितिः
    स्थेयः स्थविरोऽथ निरञ्जनः । प्रद्योतनो रथारूढः सर्वलोकप्रकाशकः ॥ २६॥ ध्रुवो मेषी महावीर्यो हंसः संसारतारकः
    । सृष्टिकर्ता क्रियाहेतुर्मार्तण्डो मरुतां पतिः ॥ २७॥ मरुत्वान् दहनस्त्वष्टा भगो भर्गोऽर्यमा कपिः
    । वरुणेशो जगन्नाथः कृतकृत्यः सुलोचनः ॥ २८॥ विवस्वान् भानुमान् कार्यः कारणस्तेजसां निधिः । असङ्गगामी
    तिग्मांशुर्घर्मांशुर्दीप्तदीधितिः ॥ २९॥ सहस्रदीधितिर्ब्रध्नः सहस्रांशुर्दिवाकरः । गभस्तिमान् दीधितिमान्
    स्रग्वी मणिकुलद्युतिः ॥ ३०॥ भास्करः सुरकार्यज्ञः सर्वज्ञस्तीक्ष्णदीधितिः । सुरज्येष्ठः सुरपतिर्बहुज्ञो
    वचसां पतिः ॥ ३१॥ तेजोनिधिर्बृहत्तेजा बृहत्कीर्तिर्बृहस्पतिः । अहिमानूर्जितो धीमानामुक्तः कीर्तिवर्धनः
    ॥ ३२॥ महावैद्यो गणपतिर्धनेशो गणनायकः । तीव्रप्रतापनस्तापी तापनो विश्वतापनः ॥ ३३॥ कार्तस्वरो हृषीकेशः
    पद्मानन्दोऽतिनन्दितः । पद्मनाभोऽमृताहारः स्थितिमान् केतुमान् नभः ॥ ३४॥ अनाद्यन्तोऽच्युतो विश्वो विश्वामित्रो
    घृणिर्विराट् । आमुक्तकवचो वाग्मी कञ्चुकी विश्वभावनः ॥ ३५॥ अनिमित्तगतिः श्रेष्ठः शरण्यः सर्वतोमुखः
    । विगाही वेणुरसहः समायुक्तः समाक्रतुः ॥ ३६॥ धर्मकेतुर्धर्मरतिः संहर्ता संयमो यमः । प्रणतार्तिहरो वायुः
    सिद्धकार्यो जनेश्वरः ॥ ३७॥ नभो विगाहनः सत्यः सवितात्मा मनोहरः । हारी हरिर्हरो वायुरृतुः कालानलद्युतिः
    ॥ ३८॥ सुखसेव्यो महातेजा जगतामेककारणम् । महेन्द्रो विष्टुतः स्तोत्रं स्तुतिहेतुः प्रभाकरः ॥ ३९॥ सहस्रकर
    आयुष्मान् अरोषः सुखदः सुखी । व्याधिहा सुखदः सौख्यं कल्याणः कलतां वरः ॥ ४०॥ आरोग्यकारणं सिद्धिरृद्धिर्वृद्धिर्बृहस्पतिः
    । हिरण्यरेता आरोग्यं विद्वान् ब्रध्नो बुधो महान् ॥ ४१॥ प्राणवान् धृतिमान् घर्मो घर्मकर्ता रुचिप्रदः
    । सर्वप्रियः सर्वसहः सर्वशत्रुविनाशनः ॥ ४२॥ प्रांशुर्विद्योतनो द्योतः सहस्रकिरणः कृती । केयूरी भूषणोद्भासी
    भासितो भासनोऽनलः ॥ ४३॥ शरण्यार्तिहरो होता खद्योतः खगसत्तमः । सर्वद्योतो भवद्योतः सर्वद्युतिकरो मतः
    ॥ ४४॥ कल्याणः कल्याणकरः कल्यः कल्यकरः कविः । कल्याणकृत् कल्यवपुः सर्वकल्याणभाजनम् ॥ ४५॥ शान्तिप्रियः
    प्रसन्नात्मा प्रशान्तः प्रशमप्रियः । उदारकर्मा सुनयः सुवर्चा वर्चसोज्ज्वलः ॥ ४६॥ वर्चस्वी वर्चसामीशस्त्रैलोक्येशो
    वशानुगः । तेजस्वी सुयशा वर्ष्मी वर्णाध्यक्षो बलिप्रियः ॥ ४७॥ यशस्वी तेजोनिलयस्तेजस्वी प्रकृतिस्थितः
    । आकाशगः शीघ्रगतिराशुगो गतिमान् खगः ॥ ४८॥ गोपतिर्ग्रहदेवेशो गोमानेकः प्रभञ्जनः । जनिता प्रजनो जीवो
    दीपः सर्वप्रकाशकः ॥ ४९॥ सर्वसाक्षी योगनित्यो नभस्वानसुरान्तकः । रक्षोघ्नो विघ्नशमनः किरीटी सुमनःप्रियः
    ॥ ५०॥ मरीचिमाली सुमतिः कृताभिख्यविशेषकः । शिष्टाचारः शुभाकारः स्वचाराचारतत्परः ॥ ५१॥ मन्दारो माठरो
    वेणुः क्षुधापः क्ष्मापतिर्गुरुः । सुविशिष्टो विशिष्टात्मा विधेयो ज्ञानशोभनः ॥ ५२॥ महाश्वेतः प्रियो
    ज्ञेयः सामगो मोक्षदायकः । सर्ववेदप्रगीतात्मा सर्ववेदलयो महान् ॥ ५३॥ वेदमूर्तिश्चतुर्वेदो वेदभृद्वेदपारगः
    । क्रियावानसितो जिष्णुर्वरीयांशुर्वरप्रदः ॥ ५४॥ व्रतचारी व्रतधरो लोकबन्धुरलङ्कृतः । अलङ्काराक्षरो
    वेद्यो विद्यावान् विदिताशयः ॥ ५५॥ आकारो भूषणो भूष्यो भूष्णुर्भुवनपूजितः । चक्रपाणिर्ध्वजधरः सुरेशो
    लोकवत्सलः ॥ ५६॥ वाग्मिपतिर्महाबाहुः प्रकृतिर्विकृतिर्गुणः । अन्धकारापहः श्रेष्ठो युगावर्तो युगादिकृत्
    ॥ ५७॥ अप्रमेयः सदायोगी निरहङ्कार ईश्वरः । शुभप्रदः शुभः शास्ता शुभकर्मा शुभप्रदः ॥ ५८॥ सत्यवान् श्रुतिमानुच्चैर्नकारो
    वृद्धिदोऽनलः । बलभृद्बलदो बन्धुर्मतिमान् बलिनां वरः ॥ ५९॥ अनङ्गो नागराजेन्द्रः पद्मयोनिर्गणेश्वरः
    । संवत्सर ऋतुर्नेता कालचक्रप्रवर्तकः ॥ ६०॥ पद्मेक्षणः पद्मयोनिः प्रभावानमरः प्रभुः । सुमूर्तिः सुमतिः
    सोमो गोविन्दो जगदादिजः ॥ ६१॥ पीतवासाः कृष्णवासा दिग्वासास्त्विन्द्रियातिगः । अतीन्द्रियोऽनेकरूपः स्कन्दः
    परपुरञ्जयः ॥ ६२॥ शक्तिमाञ्जलधृग्भास्वान् मोक्षहेतुरयोनिजः । सर्वदर्शी जितादर्शो दुःस्वप्नाशुभनाशनः
    ॥ ६३॥ माङ्गल्यकर्ता तरणिर्वेगवान् कश्मलापहः । स्पष्टाक्षरो महामन्त्रो विशाखो यजनप्रियः ॥ ६४॥ विश्वकर्मा
    महाशक्तिर्द्युतिरीशो विहङ्गमः । विचक्षणो दक्ष इन्द्रः प्रत्यूषः प्रियदर्शनः ॥ ६५॥ अखिन्नो वेदनिलयो
    वेदविद्विदिताशयः । प्रभाकरो जितरिपुः सुजनोऽरुणसारथिः ॥ ६६॥ कुनाशी सुरतः स्कन्दो महितोऽभिमतो गुरुः
    । ग्रहराजो ग्रहपतिर्ग्रहनक्षत्रमण्डलः ॥ ६७॥ भास्करः सततानन्दो नन्दनो नरवाहनः । मङ्गलोऽथ मङ्गलवान्
    माङ्गल्यो मङ्गलावहः ॥ ६८॥ मङ्गल्यचारुचरितः शीर्णः सर्वव्रतो व्रती । चतुर्मुखः पद्ममाली पूतात्मा प्रणतार्तिहा
    ॥ ६९॥ अकिञ्चनः सतामीशो निर्गुणो गुणवाञ्चुचिः । सम्पूर्णः पुण्डरीकाक्षो विधेयो योगतत्परः ॥ ७०॥ सहस्रांशुः
    क्रतुमतिः सर्वज्ञः सुमतिः सुवाक् । सुवाहनो माल्यदामा कृताहारो हरिप्रियः ॥ ७१॥ ब्रह्मा प्रचेताः प्रथितः
    प्रयतात्मा स्थिरात्मकः । शतविन्दुः शतमुखो गरीयाननलप्रभः ॥ ७२॥ धीरो महत्तरो विप्रः पुराणपुरुषोत्तमः
    । विद्याराजाधिराजो हि विद्यावान् भूतिदः स्थितः ॥ ७३॥ अनिर्देश्यवपुः श्रीमान् विपाप्मा बहुमङ्गलः ।
    स्वःस्थितः सुरथः स्वर्णो मोक्षदो बलिकेतनः ॥ ७४॥ निर्द्वन्द्वो द्वन्द्वहा सर्गः सर्वगः संप्रकाशकः ।
    दयालुः सूक्ष्मधीः क्षान्तिः क्षेमाक्षेमस्थितिप्रियः ॥ ७५॥ भूधरो भूपतिर्वक्ता पवित्रात्मा त्रिलोचनः
    । महावराहः प्रियकृद्दाता भोक्ताऽभयप्रदः ॥ ७६॥ चक्रवर्ती धृतिकरः सम्पूर्णोऽथ महेश्वरः । चतुर्वेदधरोऽचिन्त्यो
    विनिन्द्यो विविधाशनः ॥ ७७॥ विचित्ररथ एकाकी सप्तसप्तिः परात्परः । सर्वोदधिस्थितिकरः स्थितिस्थेयः स्थितिप्रियः
    ॥ ७८॥ निष्कलः पुष्कलो विभुर्वसुमान् वासवप्रियः । पशुमान् वासवस्वामी वसुधामा वसुप्रदः ॥ ७९॥ बलवान्
    ज्ञानवांस्तत्त्वमोङ्कारस्त्रिषु संस्थितः । सङ्कल्पयोनिर्दिनकृद्भगवान् कारणापहः ॥ ८०॥ नीलकण्ठो धनाध्यक्षश्चतुर्वेदप्रियंवदः
    । वषट्कारोद्गाता होता स्वाहाकारो हुताहुतिः ॥ ८१॥ जनार्दनो जनानन्दो नरो नारायणोऽम्बुदः । सन्देहनाशनो
    वायुर्धन्वी सुरनमस्कृतः ॥ ८२॥ विग्रही विमलो विन्दुर्विशोको विमलद्युतिः । द्युतिमान् द्योतनो विद्युद्विद्यावान्
    विदितो बली ॥ ८३॥ घर्मदो हिमदो हासः कृष्णवर्त्मा सुताजितः । सावित्रीभावितो राजा विश्वामित्रो घृणिर्विराट्
    ॥ ८४॥ सप्तार्चिः सप्ततुरगः सप्तलोकनमस्कृतः । सम्पूर्णोऽथ जगन्नाथः सुमनाः शोभनप्रियः ॥ ८५॥ सर्वात्मा
    सर्वकृत् सृष्टिः सप्तिमान् सप्तमीप्रियः । सुमेधा मेधिको मेध्यो मेधावी मधुसूदनः ॥ ८६॥ अङ्गिरःपतिः कालज्ञो
    धूमकेतुः सुकेतनः । सुखी सुखप्रदः सौख्यं कामी कान्तिप्रियो मुनिः ॥ ८७॥ सौख्यं कान्तिः सन्तापनः सन्तपन
    आतपस्तपसां पतिः । उमापतिः सहस्रांशुः प्रियकारी प्रियङ्करः ॥ ८८॥ प्रीतिर्विमन्युरम्भोत्थः खञ्जनो जगतां
    पतिः । जगत्पिता प्रीतमनाः सर्वः खर्वो गुहोऽचलः ॥ ८९॥ सर्वगो जगदानन्दो जगन्नेता सुरारिहा । श्रेयः श्रेयस्करो
    ज्यायान् महानुत्तम उद्भवः ॥ ९०॥ उत्तमो मेरुमेयोऽथ धरणो धरणीधरः । धराध्यक्षो धर्मराजो धर्माधर्मप्रवर्तकः
    ॥ ९१॥ रथाध्यक्षो रथगतिस्तरुणस्तनितोऽनलः । उत्तरोऽनुत्तरस्तापी अवाक्पतिरपां पतिः ॥ ९२॥ पुण्यसङ्कीर्तनः
    पुण्यो हेतुर्लोकत्रयाश्रयः । स्वर्भानुर्विगतानन्दो विशिष्टोत्कृष्टकर्मकृत् ॥ ९३॥ व्याधिप्रणाशनः क्षेमः
    शूरः सर्वजितां वरः । एकरथो रथाधीशः पिता शनैश्चरस्य हि ॥ ९४॥ वैवस्वतगुरुर्मृत्युर्धर्मनित्यो महाव्रतः
    । प्रलम्बहारासञ्चारी प्रद्योतो द्योतितानलः ॥ ९५॥ सन्तापहृत् परो मन्त्रो मन्त्रमूर्तिर्महाबलः । श्रेष्ठात्मा
    सुप्रियः शम्भुर्मरुतामीश्वरेश्वरः ॥ ९६॥ संसारगतिविच्चेत्ता संसारार्णवतारकः । सप्तजिह्वः सहस्रार्ची
    रत्नगर्भोऽपराजितः ॥ ९७॥ धर्मकेतुरमेयात्मा धर्माधर्मवरप्रदः । लोकसाक्षी लोकगुरुर्लोकेशश्चण्डवाहनः ॥
    ९८॥ धर्मयूपो यूपवृक्षो धनुष्पाणिर्धनुर्धरः । पिनाकधृङ्महोत्साहो महामायो महाशनः ॥ ९९॥ वीरः शक्तिमतां
    श्रेष्ठः सर्वशस्त्रभृतां वरः । ज्ञानगम्यो दुराराध्यो लोहिताङ्गो विवर्धनः ॥ १००॥ खगोऽन्धो धर्मदो नित्यो
    धर्मकृच्चित्रविक्रमः । भगवानात्मवान् मन्त्रस्त्र्यक्षरो नीललोहितः ॥ १०१॥ एकोऽनेकस्त्रयी कालः सविता
    समितिञ्जयः । शार्ङ्गधन्वाऽनलो भीमः सर्वप्रहरणायुधः ॥ १०२॥ सुकर्मा परमेष्ठी च नाकपाली दिविस्थितः ।
    वदान्यो वासुकिर्वैद्य आत्रेयोऽथ पराक्रमः ॥ १०३॥ द्वापरः परमोदारः परमो ब्रह्मचर्यवान् । उदीच्यवेषो
    मुकुटी पद्महस्तो हिमांशुभृत् ॥ १०४॥ सितः प्रसन्नवदनः पद्मोदरनिभाननः । सायं दिवा दिव्यवपुरनिर्देश्यो
    महालयः ॥ १०५॥ महारथो महानीशः शेषः सत्त्वरजस्तमः । धृतातपत्रप्रतिमो विमर्षी निर्णयः स्थितः ॥ १०६॥ अहिंसकः
    शुद्धमतिरद्वितीयो विवर्धनः । सर्वदो धनदो मोक्षो विहारी बहुदायकः ॥ १०७॥ चारुरात्रिहरो नाथो भगवान् सर्वगोऽव्ययः
    । मनोहरवपुः शुभ्रः शोभनः सुप्रभावनः ॥ १०८॥ सुप्रभावः सुप्रतापः सुनेत्रो दिग्विदिक्पतिः । राज्ञीप्रियः
    शब्दकरो ग्रहेशस्तिमिरापहः ॥ १०९॥ सैंहिकेयरिपुर्देवो वरदो वरनायकः । चतुर्भुजो महायोगी योगीश्वरपतिस्तथा
    ॥ ११०॥ अनादिरूपोऽदितिजो रत्नकान्तिः प्रभामयः । जगत्प्रदीपो विस्तीर्णो महाविस्तीर्णमण्डलः ॥ १११॥ एकचक्ररथः
    स्वर्णरथः स्वर्णशरीरधृक् । निरालम्बो गगनगो धर्मकर्मप्रभावकृत् ॥ ११२॥ धर्मात्मा कर्मणां साक्षी प्रत्यक्षः
    परमेश्वरः । मेरुसेवी सुमेधावी मेरुरक्षाकरो महान् ॥ ११३॥ आधारभूतो रतिमांस्तथा च धनधान्यकृत् । पापसन्तापहर्ता
    च मनोवाञ्चितदायकः ॥ ११४॥ रोगहर्ता राज्यदायी रमणीयगुणोऽनृणी । कालत्रयानन्तरूपो मुनिवृन्दनमस्कृतः ॥
    ११५॥ सन्ध्यारागकरः सिद्धः सन्ध्यावन्दनवन्दितः । साम्राज्यदाननिरतः समाराधनतोषवान् ॥ ११६॥ भक्तदुःखक्षयकरो
    भवसागरतारकः भयापहर्ता भगवानप्रमेयपराक्रमः । मनुस्वामी मनुपतिर्मान्यो मन्वन्तराधिपः ॥ ११७॥ फलश्रुतिः
    एतत्ते सर्वमाख्यातं यन्मां त्वं परिपृच्चसि । नाम्नां सहस्रं सवितुः पाराशर्यो यदाह मे ॥ १॥ धन्यं यशस्यमायुष्यं
    दुःखदुःस्वप्ननाशनम् । बन्धमोक्षकरं चैव भानोर्नामानुकीर्तनात् ॥ २॥ यस्त्विदं श
