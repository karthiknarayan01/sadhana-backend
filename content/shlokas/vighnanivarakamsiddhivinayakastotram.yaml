id: vighnanivarakamsiddhivinayakastotram
category: stotram
name:
  english: vighnanivarakamsiddhivinayakastotram
  devanagari: विघ्ननिवारकंसिद्धिविनायकस्तोत्रम्
content:
  english: vighnanivarakam siddhivinayakastotram shri ganeshaya namah || vighnesha vighnacayakhandananamadheya
    shrishankaratmaja suradhipavandyapada | durgamahavrataphalakhilamangalatman vighnam mamapahara siddhivinayaka
    tvam || 1|| satpadmaragamanivarnasharirakantih shrisiddhibuddhiparicarcitakunkumashrih | dakshastane
    valayitatimanojnashundo vighnam mamapahara siddhivinayaka tvam || 2|| pashankushabjaparashumshca dadhaccaturbhirdorbhishca
    shonakusumasragumangajatah | sindurashobhitalalatavidhuprakasho vighnam mamapahara siddhivinayaka
    tvam || 3|| karyeshu vighnacayabhitavirancimukhyaih sampujitah suravarairapi modakadyaih | sarveshu
    ca prathamameva sureshu pujyo vighnam mamapahara siddhivinayaka tvam || 4|| shighrancanaskhalanatungaravordhvakanthasthulondurudravanahasitadevasanghah
    | shurpashrutishca prithuvartulatungatundo vighnam mamapahara siddhivinayaka tvam || 5|| yajnopavitapadalambhitanagarajo
    masadipunyadadrishikritariksharajah | bhaktabhayaprada dayalaya vighnaraja vighnam mamapahara siddhivinayaka
    tvam || 6|| sadratnasaratatirajitasatkiritah kausumbhacaruvasanadvaya urjitashrih | sarvatramangalakarasmaranapratapo
    vighnam mamapahara siddhivinayaka tvam || 7|| devantakadyasurabhitasurartiharta vijnanabodhenavarena
    tamopaharta | ananditatribhuvaneshu kumarabandho vighnam mamapahara siddhivinayaka tvam || 8|| iti
    maudgaloktam vighnanivarakam siddhivinayakastotram sampurnam ||
  devanagari: विघ्ननिवारकं सिद्धिविनायकस्तोत्रम् श्री गणेशाय नमः ॥ विघ्नेश विघ्नचयखण्डननामधेय श्रीशङ्करात्मज
    सुराधिपवन्द्यपाद । दुर्गामहाव्रतफलाखिलमङ्गलात्मन् विघ्नं ममापहर सिद्धिविनायक त्वम् ॥ १॥ सत्पद्मरागमणिवर्णशरीरकान्तिः
    श्रीसिद्धिबुद्धिपरिचर्चितकुङ्कुमश्रीः । दक्षस्तने वलयितातिमनोज्ञशुण्डो विघ्नं ममापहर सिद्धिविनायक
    त्वम् ॥ २॥ पाशाङ्कुशाब्जपरशूंश्च दधच्चतुर्भिर्दोर्भिश्च शोणकुसुमस्रगुमाङ्गजातः । सिन्दूरशोभितललाटविधुप्रकाशो
    विघ्नं ममापहर सिद्धिविनायक त्वम् ॥ ३॥ कार्येषु विघ्नचयभीतविरञ्चिमुख्यैः सम्पूजितः सुरवरैरपि मोदकाद्यैः
    । सर्वेषु च प्रथममेव सुरेषु पूज्यो विघ्नं ममापहर सिद्धिविनायक त्वम् ॥ ४॥ शीघ्राञ्चनस्खलनतुङ्गरवोर्ध्वकण्ठस्थूलोन्दुरुद्रवणहासितदेवसङ्घः
    । शूर्पश्रुतिश्च पृथुवर्तुलतुङ्गतुन्दो विघ्नं ममापहर सिद्धिविनायक त्वम् ॥ ५॥ यज्ञोपवीतपदलंभितनागराजो
    मासादिपुण्यददृशीकृतऋक्षराजः । भक्ताभयप्रद दयालय विघ्नराज विघ्नं ममापहर सिद्धिविनायक त्वम् ॥ ६॥ सद्रत्नसारततिराजितसत्किरीटः
    कौसुम्भचारुवसनद्वय ऊर्जितश्रीः । सर्वत्रमङ्गलकरस्मरणप्रतापो विघ्नं ममापहर सिद्धिविनायक त्वम् ॥ ७॥
    देवान्तकाद्यसुरभीतसुरार्तिहर्ता विज्ञानबोधेनवरेण तमोपहर्ता । आनन्दितत्रिभुवनेशु कुमारबन्धो विघ्नं
    ममापहर सिद्धिविनायक त्वम् ॥ ८॥ इति मौद्गलोक्तं विघ्ननिवारकं सिद्धिविनायकस्तोत्रं सम्पूर्णम् ॥
