id: devaihkritam09vishnustotram
category: stotram
name:
  english: devaihkritam09vishnustotram
  devanagari: देवैःकृतं०९विष्णुस्तोत्रम्
content:
  english: devaih kritam 9 vishnustotram deva ucuh | om namo bhagavate tubhyam vasudevaya dhimahi | pradyumnayaniruddhaya
    namah sankarshanaya ca || 22|| om karabrahmarupaya tredha''vishkritamurtaye | brahmandasargasthityantahetave
    nirgunaya ca || 23|| nayananandarupaya pranatakleshanashine | keshavaya namastubhyam svatantreshvaramurtaye
    || 24|| moditasheshabhaktaya kalamayadimohine | sadanandaya krishnaya namah saddharmavarttine |||
    25|| bhavambudhinimagnanamuddhritikshamakirtaye | darshaniyasvarupaya ghanashyamaya te namah || 26||
    gadabjadaracakrani bibhrate dirghabahubhih | suragovipradharmanam goptre tubhyam namo namah || 27||
    varenyaya prapannanamabhishtavaradayine | nigamagamavedyaya vedagarbhaya te namah || 28|| tejomandalamadhyasthadivyasundaramurtaye
    | namamo vishnave tubhyam paratparataraya ca || 29|| vanimanoviprakrishtamahimne'kshararupine | sarvantaryamine
    tubhyam brihate ca namo namah || 9
  devanagari: देवैः कृतं ९ विष्णुस्तोत्रम् देवा ऊचुः । ॐ नमो भगवते तुभ्यं वासुदेवाय धीमहि । प्रद्युम्नायानिरुद्धाय
    नमः सङ्कर्षणाय च ॥ २२॥ ॐ कारब्रह्मरूपाय त्रेधाऽऽविष्कृतमूर्तये । ब्रह्माण्डसर्गस्थित्यन्तहेतवे निर्गुणाय
    च ॥ २३॥ नयनानन्दरूपाय प्रणतक्लेशनाशिने । केशवाय नमस्तुभ्यं स्वतन्त्रेश्वरमूर्तये ॥ २४॥ मोदिताशेषभक्ताय
    कालमायादिमोहिने । सदानन्दाय कृष्णाय नमः सद्धर्मवर्त्तिने ॥। २५॥ भवाम्बुधिनिमग्नानामुद्धृतिक्षमकीर्तये
    । दर्शनीयस्वरूपाय घनश्यामाय ते नमः ॥ २६॥ गदाब्जदरचक्राणि बिभ्रते दीर्घबाहुभिः । सुरगोविप्रधर्माणां
    गोप्त्रे तुभ्यं नमो नमः ॥ २७॥ वरेण्याय प्रपन्नानामभीष्टवरदायिने । निगमागमवेद्याय वेदगर्भाय ते नमः
    ॥ २८॥ तेजोमण्डलमध्यस्थदिव्यसुन्दरमूर्तये । नमामो विष्णवे तुभ्यं परात्परतराय च ॥ २९॥ वाणीमनोविप्रकृष्टमहिम्नेऽक्षररूपिणे
    । सर्वान्तर्यामिणे तुभ्यं बृहते च नमो नमः ॥ ९
