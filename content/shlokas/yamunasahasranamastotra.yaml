id: yamunasahasranamastotra
category: stotram
name:
  english: yamunasahasranamastotra
  devanagari: यमुनासहस्रनामस्तोत्र
content:
  english: tati nadi nirmalapaniya sarvabrahmandapavani || 11|| vaikunthaparikhibhuta parikha papaharini
    | brahmalokagata brahmi svarga svarganivasini || 12|| ullasanti protpatanti merumala mahojjvala |
    shrigangambhah shikharini gandashailavibhedini || 13|| deshanpunanti gacchanti mahati bhumimadhyaga
    | martandatanuja punya kalindagirinandini || 14|| yamasvasa mandahasa sudvija racitambara | nilambara
    padmamukhi caranti carudarshana || 15|| rambhoruh padmanayana madhavi pramadottama | tapashcaranti
    sushroni kujannupuramekhala || 16|| jalasthita shyamalangi khandavabha viharini | gandivibhashini
    vanya shrikrishnambaramicchati || 17|| dvarakagamana rajni pattarajni parangata | maharajni ratnabhusha
    gomatitiracarini || 18|| svakiya svasukha svartha sviyakaryarthasadhini | navalanga'bala mugdha varanga
    vamalocana || 19|| ajnatayauvana'dina prabha kantirdyutishchavih | somabha parama kirtih kushala jnatayauvana
    || 20|| navodha madhyaga madhya praudhih praudha pragalbhaka | dhira'dhira dhairyadhara jyeshtha shreshtha
    kulangana || 21|| kshanaprabha cancalarca vidyutsaudamini tadit | svadhinapatika lakshmih pushta svadhinabhartrika
    || 22|| kalahantarita bhiruriccha protkanthita''kula | kashipustha divyashayya govindahritamanasa
    || 23|| khandita'khandashobhadhya vipralabdha'bhisarika | viraharta virahini nari proshitabhartrika
    || 24|| manini manada prajna mandaravanavasini | jhankarini jhanatkari rananmanjiranupura || 25||
    mekhala mekhalakanci shrikanci kancanamayi | kancuki kancukamanih shrikanthadhya mahamanih || 26||
    shriharini padmahara mukta muktaphalarcita | ratnakankanakeyura spharadangulibhushana || 27|| darpana
    darpanibhuta dushtadarpavinashini | kambugriva kambudhara graiveyakavirajita || 28|| tatankini dantadhara
    hemakundalamandita | shikhabhusha bhalapushpa nasamauktikashobhita || 29|| manibhumigata devi raivatadriviharini
    | vrindavanagata vrinda vrindaranyanivasini || 30|| vrindavanalata madhvi vrindaranyavibhushana |
    saundaryalahari lakshmirmathuratirthavasini || 31|| vishrantavasini kamya ramya gokulavasini | ramanasthalashobhadhya
    mahavanamahanadi || 32|| pranata pronnata pushta bharati bharatarcita | tirtharajagatirgotra gangasagarasangama
    || 33|| saptabdhibhedini lola saptadvipagata balat | luthanti shailabhidyanti sphuranti vegavattara
    || 34|| kancani kancanibhumih kancanibhumibhavita | lokadrishtirlokalila lokalokacalarcita || 35||
    shailodgata svargagata svargarcya svargapujita | vrindavanavanadhyaksha raksha kaksha tati pati ||
    36|| asikundagata kaccha svacchandocchalitadrija | kuharastha rayaprastha prastha shantetaratura ||
    37|| ambucchata sikarabha dardura darduridhara | papankusha papasimhi papadrumakutharini || 38|| punyasangha
    punyakirtih punyada punyavardhini | madhorvananadimukhya tula talavanasthita || 39|| kumudvananadi
    kubja kumudambhojavardhini | plavarupa vegavati simhasarpadivahini || 40|| bahuli bahuda bahvi bahula
    vanavandita | radhakundakalaradhya krishnakundajalashrita || 41|| lalitakundaga ghanta vishakhakundamandita
    | govindakundanilaya gopakundatarangini || 42|| shriganga manasiganga kusumambara bhavini | govardhini
    godhanadhya mayuri varavarnini || 43|| sarasi nilakanthabha kujatkokilapotaki | girirajaprabhurbhuriratapatratapatrini
    || 44|| govardhananka godanti divyaushadhinidhih shrutih |
  devanagari: तटी नदी निर्मलपानीया सर्वब्रह्माण्डपावनी ॥ ११॥ वैकुण्ठपरिखीभूता परिखा पापहारिणी । ब्रह्मलोकागता
    ब्राह्मी स्वर्गा स्वर्गनिवासिनी ॥ १२॥ उल्लसन्ती प्रोत्पतन्ती मेरुमाला महोज्ज्वला । श्रीगङ्गाम्भः शिखरिणी
    गण्डशैलविभेदिनी ॥ १३॥ देशान्पुनन्ती गच्छन्ती महती भूमिमध्यगा । मार्तण्डतनुजा पुण्या कलिन्दगिरिनन्दिनी
    ॥ १४॥ यमस्वसा मन्दहासा सुद्विजा रचिताम्बरा । नीलाम्बरा पद्ममुखी चरन्ती चारुदर्शना ॥ १५॥ रम्भोरूः पद्मनयना
    माधवी प्रमदोत्तमा । तपश्चरन्ती सुश्रोणी कूजन्नूपुरमेखला ॥ १६॥ जलस्थिता श्यामलाङ्गी खाण्डवाभा विहारिणी
    । गाण्डीविभाषिणी वन्या श्रीकृष्णाम्बरमिच्छती ॥ १७॥ द्वारकागमना राज्ञी पट्टराज्ञी परङ्गता । महाराज्ञी
    रत्नभूषा गोमतीतीरचारिणी ॥ १८॥ स्वकीया स्वसुखा स्वार्था स्वीयकार्यार्थसाधिनी । नवलाङ्गाऽबला मुग्धा
    वराङ्गा वामलोचना ॥ १९॥ अज्ञातयौवनाऽदीना प्रभा कान्तिर्द्युतिश्छविः । सोमाभा परमा कीर्तिः कुशला ज्ञातयौवना
    ॥ २०॥ नवोढा मध्यगा मध्या प्रौढिः प्रौढा प्रगल्भका । धीराऽधीरा धैर्यधरा ज्येष्ठा श्रेष्ठा कुलाङ्गना
    ॥ २१॥ क्षणप्रभा चञ्चलार्चा विद्युत्सौदामिनी तडित् । स्वाधीनपतिका लक्ष्मीः पुष्टा स्वाधीनभर्तृका ॥
    २२॥ कलहान्तरिता भीरुरिच्छा प्रोत्कण्ठिताऽऽकुला । कशिपुस्था दिव्यशय्या गोविन्दहृतमानसा ॥ २३॥ खण्डिताऽखण्डशोभाढ्या
    विप्रलब्धाऽभिसारिका । विरहार्ता विरहिणी नारी प्रोषितभर्तृका ॥ २४॥ मानिनी मानदा प्राज्ञा मन्दारवनवासिनी
    । झङ्कारिणी झणत्कारी रणन्मञ्जीरनूपुरा ॥ २५॥ मेखला मेखलाकाञ्ची श्रीकाञ्ची काञ्चनामयी । कञ्चुकी कञ्चुकमणिः
    श्रीकण्ठाढ्या महामणिः ॥ २६॥ श्रीहारिणी पद्महारा मुक्ता मुक्ताफलार्चिता । रत्नकङ्कणकेयूरा स्फरदङ्गुलिभूषणा
    ॥ २७॥ दर्पणा दर्पणीभूता दुष्टदर्पविनाशिनी । कम्बुग्रीवा कम्बुधरा ग्रैवेयकविराजिता ॥ २८॥ ताटङ्किनी
    दन्तधरा हेमकुण्डलमण्डिता । शिखाभूषा भालपुष्पा नासामौक्तिकशोभिता ॥ २९॥ मणिभूमिगता देवी रैवताद्रिविहारिणी
    । वृन्दावनगता वृन्दा वृन्दारण्यनिवासिनी ॥ ३०॥ वृन्दावनलता माध्वी वृन्दारण्यविभूषणा । सौन्दर्यलहरी
    लक्ष्मीर्मथुरातीर्थवासिनी ॥ ३१॥ विश्रान्तवासिनी काम्या रम्या गोकुलवासिनी । रमणस्थलशोभाढ्या महावनमहानदी
    ॥ ३२॥ प्रणता प्रोन्नता पुष्टा भारती भारतार्चिता । तीर्थराजगतिर्गोत्रा गङ्गासागरसङ्गमा ॥ ३३॥ सप्ताब्धिभेदिनी
    लोला सप्तद्वीपगता बलात् । लुठन्ती शैलभिद्यन्ती स्फुरन्ती वेगवत्तरा ॥ ३४॥ काञ्चनी काञ्चनीभूमिः काञ्चनीभूमिभाविता
    । लोकदृष्टिर्लोकलीला लोकालोकाचलार्चिता ॥ ३५॥ शैलोद्गता स्वर्गगता स्वर्गार्च्या स्वर्गपूजिता । वृन्दावनवनाध्यक्षा
    रक्षा कक्षा तटी पटी ॥ ३६॥ असिकुण्डगता कच्छा स्वच्छन्दोच्छलिताद्रिजा । कुहरस्था रयप्रस्था प्रस्था शान्तेतरातुरा
    ॥ ३७॥ अम्बुच्छटा सीकराभा दर्दुरा दर्दुरीधरा । पापाङ्कुशा पापसिंही पापद्रुमकुठारिणी ॥ ३८॥ पुण्यसङ्घा
    पुण्यकीर्तिः पुण्यदा पुण्यवर्धिनी । मधोर्वननदीमुख्या तुला तालवनस्थिता ॥ ३९॥ कुमुद्वननदी कुब्जा कुमुदाम्भोजवर्धिनी
    । प्लवरूपा वेगवती सिंहसर्पादिवाहिनी ॥ ४०॥ बहुली बहुदा बह्वी बहुला वनवन्दिता । राधाकुण्डकलाराध्या कृष्णाकुण्डजलाश्रिता
    ॥ ४१॥ ललिताकुण्डगा घण्टा विशाखाकुण्डमण्डिता । गोविन्दकुण्डनिलया गोपकुण्डतरङ्गिणी ॥ ४२॥ श्रीगङ्गा मानसीगङ्गा
    कुसुमाम्बर भाविनी । गोवर्धिनी गोधनाढ्या मयूरी वरवर्णिनी ॥ ४३॥ सारसी नीलकण्ठाभा कूजत्कोकिलपोतकी । गिरिराजप्रभूर्भूरिरातपत्रातपत्रिणी
    ॥ ४४॥ गोवर्धनाङ्का गोदन्ती दिव्यौषधिनिधिः श्रुतिः ।
