id: k-ishnacandrastavaragagananamgargasamhita
category: stotram
name:
  english: kṟishnacandrastavaragagananamgargasamhita
  devanagari: क्ऱिष्णचन्द्रस्तवरागगणानांगर्गसम्हिता
content:
  english: aksharapanktih kinnvalipanktih pippalapatre mohanamala | kim kamale yacchyamalarekha kim hyudare
    romavalirekha || 9|| bhairavaraginya ucuh pitapatam yatkrishnaharerindradhanurvaddiptiyutam | kancanashilpaishcaruruci
    tadbhaja nrinam duhkhaharam || 10|| bhairavaputra ucuh catuhsamudra iva vishvapuraka anandada eva
    catushpadarthavat | te bahavo lokavitanadandavajjayanti bhudharanadiggaja iva || 11|| meghamallararaginya
    ucuh arunabimbaphaladyutimanditam bhaja hareradharam madhuram manah | navajapadalamallasuvigraham
    sakalavallabhabhumipateh prabhoh || 12|| meghamallaraputra ucuh karpuraketakasumauktikahirakanam shrikhandacandracapalamritamallikanam
    | tesham ruceshca paribhavamakari purvam ya dantapanktiramala smaratam parasya || 13|| dipakaraginya
    ucuh nayanayugalajatam patu no'harnisham te madanasharaparoksham sarvalavanyadiksham | parihritasuravriksham
    kotisho lakshalaksham nijajanakritaraksham danadaksham kataksham || 14|| dipakaputra ucuh kim va kulingayugalam
    navapadmamadhye duhkhakshayaya vasatam nishitasiyugmam | jaitram dhanurjayati kim makaradhvajasya
    bhrumandalam kimatha candramukhe parasya || 15|| malakosharaginya ucuh parinrityati indumandale phanipatnyaviva
    lolakundale | kamale makarandanirbhare bhramaraliva sugandamandale || 16|| malakoshaputra ucuh ravireva
    khamandale kimu yadubhartustvathava ghane tadit | adhitishthati gandamandalam dyutikhandam kaladhautakundalam
    || 17|| shriraginya ucuh kalingayoh khanjanayoh kilaradapatyatam yuddhamabhudalinam | tesham gatah
    kira ushahpraphulle cakasti padme'runabimbalipsuh || 18|| shriragaputra ucuh parikarikritapitapatam
    harim shikhikiritanatikritakandharam | lagudavenukaram calakundalam patutaram nataveshadharam bhaje
    || 19|| hindolaraginya ucuh atasikusumopameyakantiryamunakulakadambamadhyavarti | navagopavadhuviharashali
    vanamali vitanotu mangalani || 20|| hindolaputra ucuh
  devanagari: अक्षरपङ्क्तिः किन्न्वलिपङ्क्तिः पिप्पलपत्रे मोहनमाला । किं कमले यच्छ्यामलरेखा किं ह्युदरे
    रोमावलिरेखा ॥ ९॥ भैरवरागिण्य ऊचुः पीतपटं यत्कृष्णहरेरिन्द्रधनुर्वद्दीप्तियुतम् । काञ्चनशिल्पैश्चारुरुचि
    तद्भज नॄणां दुःखहरम् ॥ १०॥ भैरवपुत्रा ऊचुः चतुःसमुद्रा इव विश्वपूरका आनन्ददा एव चतुष्पदार्थवत् । ते
    बाहवो लोकवितानदण्डवज्जयन्ति भूधारणदिग्गजा इव ॥ ११॥ मेघमल्लाररागिण्य ऊचुः अरुणबिम्बफलद्युतिमण्डितं
    भज हरेरधरं मधुरं मनः । नवजपादलमल्लसुविग्रहं सकलवल्लभभूमिपतेः प्रभोः ॥ १२॥ मेघमल्लारपुत्रा ऊचुः कर्पूरकेतकसुमौक्तिकहीरकाणां
    श्रीखण्डचन्द्रचपलामृतमल्लिकानम् । तेषां रुचेश्च परिभावमकारि पूर्वं या दन्तपङ्क्तिरमला स्मरतां परस्य
    ॥ १३॥ दीपकरागिण्य ऊचुः नयनयुगलजातं पातु नोऽहर्निशं ते मदनशरपरोक्षं सर्वलावण्यदीक्षम् । परिहृतसुरवृक्षं
    कोटिशो लक्षलक्षं निजजनकृतरक्षं दानदक्षं कटाक्षम् ॥ १४॥ दीपकपुत्रा ऊचुः किं वा कुलिङ्गयुगलं नवपद्ममध्ये
    दुःखक्षायाय वसतां निशितासियुग्मम् । जैत्रं धनुर्जयति किं मकरध्वजस्य भ्रूमण्डलं किमथ चन्द्रमुखे परस्य
    ॥ १५॥ मालकोशरागिण्य ऊचुः परिनृत्यति इन्दुमण्डले फणिपत्न्याविव लोलकुण्डले । कमले मकरन्दनिर्भरे भ्रमरालीव
    सुगण्डमण्डले ॥ १६॥ मालकोशपुत्रा ऊचुः रविरेव खमण्डले किमु यदुभर्तुस्त्वथवा घने तडित् । अधितिष्ठति गण्डमण्डलं
    द्युतिखण्डं कलधौतकुण्डलम् ॥ १७॥ श्रीरागिण्य ऊचुः कलिङ्गयोः खञ्जनयोः किलारादापत्यतां युद्धमभूदलीनाम्
    । तेषां गतः कीर उषःप्रफुल्ले चकास्ति पद्मेऽरुणबिम्बलिप्सुः ॥ १८॥ श्रीरागपुत्रा ऊचुः परिकरीकृतपीतपटं
    हरिं शिखिकिरीटनतीकृतकन्धरम् । लगुडवेणुकरं चलकुण्डलं पटुतरं नतवेषधरं भजे ॥ १९॥ हिण्डोलरागिण्य ऊचुः
    अतसीकुसुमोपमेयकान्तिर्यमुनाकूलकदम्बमध्यवर्ती । नवगोपवधूविहारशाली वनमाली वितनोतु मङ्गलानि ॥ २०॥ हिण्डोलपुत्रा
    ऊचुः
