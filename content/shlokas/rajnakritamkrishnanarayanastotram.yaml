id: rajnakritamkrishnanarayanastotram
category: stotram
name:
  english: rajnakritamkrishnanarayanastotram
  devanagari: राज्नाकृतंकृष्णनारायणस्तोत्रम्
content:
  english: rajna kritam krishnanarayanastotram sarve prasadayamasuratyartham tvam ca mam tada | tushtuvuh
    paraya pritya jnatva vai parameshvaram || 81|| sadhava ucuh | yatra kvapi bhavejjanma pashcatpunyapratapatah
    | bhavaccharanamapannah putrah smo bhagava~stava || 82|| acyuto vai pita yasya te tvacyuta bhavanti
    vai | vayam ca'cyutatam praptah kripaisha shrihare tava || 83|| suputreshu ca divyeshu kripaya tvam
    samagatah | snehapatrani samvikshya pratyakshah sa kripa'para || 84|| atha'to'pi sada satsu vaso yatha
    tanau tatha | satam madhye vasa krishna kripeyam paramarthiki || 85|| yatha dhamni tatha satsu mandaleshu
    nivasanam | sada sadhusvarupena karotu paramam kripam || 86|| sadhvya ucuh | matarlakshmi mahamatastvam
    vayam sharanagatah | moksharthinyo brahmasadhvyo bhavatyah putrika vayam || 87|| matrivatsalyamatyantam
    sutasu tu nisargajam | tatpuraskritya janani dadasi darshanam hi nah || 88|| abalanam balopetam bhagyamadya
    pravartate | divyatam prapya te yoganmuktatam yama eva ha || 89|| karuna te'pyatulya'sti yatsadhvishu
    vibhavanam | tatrapi catikarunyam yadi vasam prarocayeh || 90|| prarthanamurarikritya yatheshtam prakarotviha
    | anadishrikrishnanarayanajnaya'kshareshvari || 91|| rajni provaca | dhanyaham mama putryashca putra
    rajyam nripastatha | praja dhanya mama lakshmi yadatra darshanam tava || 92|| kuru vasam sada ca'tra
    tava sarvam bhavatyapi | dasyaham sarvada te'smi vasa lakshmi kripam kuru || 93|| samsare labha eva'tra
    praptah sadhvisamagamah | bhavatya darshanam sakshat sa evananyalabhakah || 94|| rajovaca | kulam
    rajyam dhanam vamshah sarvam krishna bhavatkrite | maya'rpitam kritam kritsnam tvadatmakam tvadarthakam
    || 95|| kripeyam darshanam sakshattavatra satsamagamat | praptavyam sarvamevadya praptam catyantikam
    phalam || 96|| sarvada vasa me gehe kripam kritva pareshvara | ityuktva prananamaiva papata padayornripah
    || 97|| iti shrilakshminarayaniyasamhitayah dvaparayugasantanatmakasya tritiyakhande 29
  devanagari: राज्ञा कृतं कृष्णनारायणस्तोत्रम् सर्वे प्रसादयामासुरत्यर्थं त्वां च मां तदा । तुष्टुवुः
    परया प्रीत्या ज्ञात्वा वै परमेश्वरम् ॥ ८१॥ साधव ऊचुः । यत्र क्वापि भवेज्जन्म पश्चात्पुण्यप्रतापतः
    । भवच्छरणमापन्नाः पुत्राः स्मो भगवँस्तव ॥ ८२॥ अच्युतो वै पिता यस्य ते त्वच्युता भवन्ति वै । वयं चाऽच्युततां
    प्राप्ताः कृपैषा श्रीहरे तव ॥ ८३॥ सुपुत्रेषु च दिव्येषु कृपया त्वं समागतः । स्नेहपात्राणि संवीक्ष्य
    प्रत्यक्षः सा कृपाऽपरा ॥ ८४॥ अथाऽतोऽपि सदा सत्सु वासो यथा तनौ तथा । सतां मध्ये वस कृष्ण कृपेयं पारमार्थिकी
    ॥ ८५॥ यथा धाम्नि तथा सत्सु मण्डलेषु निवासनम् । सदा साधुस्वरूपेण करोतु परमां कृपाम् ॥ ८६॥ साध्व्य ऊचुः
    । मातर्लक्ष्मि महामातस्त्वां वयं शरणागताः । मोक्षार्थिन्यो ब्रह्मसाध्व्यो भवत्याः पुत्रिका वयम् ॥
    ८७॥ मातृवात्सल्यमत्यन्तं सुतासु तु निसर्गजम् । तत्पुरस्कृत्य जननि ददासि दर्शनं हि नः ॥ ८८॥ अबलानां
    बलोपेतं भाग्यमद्य प्रवर्तते । दिव्यतां प्राप्य ते योगान्मुक्ततां याम एव ह ॥ ८९॥ करुणा तेऽप्यतुल्याऽस्ति
    यत्साध्वीषु विभावनम् । तत्रापि चातिकारुण्यं यदि वासं प्ररोचयेः ॥ ९०॥ प्रार्थनामुररीकृत्य यथेष्टं प्रकरोत्विह
    । अनादिश्रीकृष्णनारायणाज्ञयाऽक्षरेश्वरि ॥ ९१॥ राज्ञी प्रोवाच । धन्याहं मम पुत्र्यश्च पुत्रा राज्यं
    नृपस्तथा । प्रजा धन्या मम लक्ष्मि यदत्र दर्शनं तव ॥ ९२॥ कुरु वासं सदा चाऽत्र तव सर्वं भवत्यपि । दास्यहं
    सर्वदा तेऽस्मि वस लक्ष्मि कृपां कुरु ॥ ९३॥ संसारे लाभ एवाऽत्र प्राप्तः साध्वीसमागमः । भवत्या दर्शनं
    साक्षात् स एवानन्यलाभकः ॥ ९४॥ राजोवाच । कुलं राज्यं धनं वंशः सर्वं कृष्ण भवत्कृते । मयाऽर्पितं कृतं
    कृत्स्नं त्वदात्मकं त्वदर्थकम् ॥ ९५॥ कृपेयं दर्शनं साक्षात्तवात्र सत्समागमात् । प्राप्तव्यं सर्वमेवाद्य
    प्राप्तं चात्यन्तिकं फलम् ॥ ९६॥ सर्वदा वस मे गेहे कृपां कृत्वा परेश्वर । इत्युक्त्वा प्रणनामैव पपात
    पादयोर्नृपः ॥ ९७॥ इति श्रीलक्ष्मीनारायणीयसंहितायाः द्वापरयुगसन्तानात्मकस्य तृतीयखण्डे २९
