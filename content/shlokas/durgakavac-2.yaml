id: durgakavac-2
category: kavacha
name:
  english: durgakavac 2
  devanagari: दुर्गाकवच् २
content:
  english: rinu vakshyami he vatsa kavacam ca sudurlabham | shrikrishnenaiva kathitam kripaya brahmane
    pura || 2|| brahmana kathitam purvam dharmaya jahnavitate | dharmena dattam mahyam ca kripaya pushkare
    pura || 3|| tripurarishca yaddhritva jaghana tripuram pura | mamoca brahma yaddhritva madhukaitabhayorbhayat
    || 4|| sanjahara raktabijam yaddhritva bhadrakalika | yaddhritva hi mahendrashca samprapa kamalalayam
    || 5|| yaddhritva ca mahayoddha banah shatrubhayankarah | yaddhritva shivatulyashca durvasa jnaninam
    varah || 6|| om durgeti caturthyantah svahanto me shiro'vatu | mantrah shadaksharo'yam ca bhaktanam
    kalpapadapah || 7|| vicaro nasti vede ca grahane'sya manormune | mantragrahanamatrena vishnutulyo
    bhavennarah || 8|| mama vaktram sada patu om durgayai namo'ntakah | om durge iti kantham tu mantrah
    patu sada mama || 9|| om hrim shrimiti mantro'yam skandham patu nirantaram | hrim shrim klimiti prishtham
    ca patu me sarvatah sada || 10|| hrim me vakshasthale patu ham sam shrimiti santatam | aim shrim hrim
    patu sarvangam svapne jagarane sada || 11|| pracyam mam patu prakritih patu vahnau ca candika | dakshine
    bhadrakali ca nairrityam ca maheshvari || 12|| varunyam patu varahi vayavyam sarvamangala | uttare
    vaishnavi patu tathaishanyam shivapriya || 13|| jale sthale cantarikshe patu mam jagadambika | iti
    te kathitam vatsa kavacam ca sudurlabham || 14|| yasmai kasmai na datavyam pravaktavyam na kasyacit
    | gurumabhyarcya vidhivadvastralankaracandanaih || 15|| kavacam dharayedyastu so'pi vishnurna samshayah
    | snane ca sarvatirthanam prithivyashca pradakshine || 16|| yatphalam labhate lokastadetaddharane
    mune | pancalakshajapenaiva siddhametadbhaveddhruvam || 17|| loke ca siddhakavaco navasidati sankate
    | na tasya mrityurbhavati jale vahnau vishe jvare || 18|| jivanmukto bhavetso'pi sarvasiddhishvarishvari
    | yadi syatsiddhakavaco vishnutulyo bhaveddhruvam || 19|| || iti shribrahmavaivarte prakritikhandantargatadurgakavacam
    sampurnam ||
  devanagari: ृणु वक्ष्यामि हे वत्स कवचं च सुदुर्लभम् । श्रीकृष्णेनैव कथितं कृपया ब्रह्मणे पुरा ॥ २॥ ब्रह्मणा
    कथितं पूर्वं धर्माय जाह्नवीतटे । धर्मेण दत्तं मह्यं च कृपया पुष्करे पुरा ॥ ३॥ त्रिपुरारिश्च यद्धृत्वा
    जघान त्रिपुरं पुरा । ममोच ब्रह्मा यद्धृत्वा मधुकैटभयोर्भयात् ॥ ४॥ सञ्जहार रक्तबीजं यद्धृत्वा भद्रकालिका
    । यद्धृत्वा हि महेन्द्रश्च सम्प्राप कमलालयाम् ॥ ५॥ यद्धृत्वा च महायोद्धा बाणः शत्रुभयङ्करः । यद्धृत्वा
    शिवतुल्यश्च दुर्वासा ज्ञानिनां वरः ॥ ६॥ ॐ दुर्गेति चतुर्थ्यन्तः स्वाहान्तो मे शिरोऽवतु । मन्त्रः षडक्षरोऽयं
    च भक्तानां कल्पपादपः ॥ ७॥ विचारो नास्ति वेदे च ग्रहणेऽस्य मनोर्मुने । मन्त्रग्रहणमात्रेण विष्णुतुल्यो
    भवेन्नरः ॥ ८॥ मम वक्त्रं सदा पातु ॐ दुर्गायै नमोऽन्तकः । ॐ दुर्गे इति कण्ठं तु मन्त्रः पातु सदा मम
    ॥ ९॥ ॐ ह्रीं श्रीमिति मन्त्रोऽयं स्कन्धं पातु निरन्तरम् । ह्रीं श्रीं क्लीमिति पृष्ठं च पातु मे सर्वतः
    सदा ॥ १०॥ ह्रीं मे वक्षस्थले पातु हं सं श्रीमिति सन्ततम् । ऐं श्रीं ह्रीं पातु सर्वाङ्गं स्वप्ने जागरणे
    सदा ॥ ११॥ प्राच्यां मां पातु प्रकृतिः पातु वह्नौ च चण्डिका । दक्षिणे भद्रकाली च नैरृत्यां च महेश्वरी
    ॥ १२॥ वारुण्यां पातु वाराही वायव्यां सर्वमङ्गला । उत्तरे वैष्णवी पातु तथैशान्यां शिवप्रिया ॥ १३॥ जले
    स्थले चान्तरिक्षे पातु मां जगदम्बिका । इति ते कथितं वत्स कवचं च सुदुर्लभम् ॥ १४॥ यस्मै कस्मै न दातव्यं
    प्रवक्तव्यं न कस्यचित् । गुरुमभ्यर्च्य विधिवद्वस्त्रालङ्कारचन्दनैः ॥ १५॥ कवचं धारयेद्यस्तु सोऽपि विष्णुर्न
    संशयः । स्नाने च सर्वतीर्थानां पृथिव्याश्च प्रदक्षिणे ॥ १६॥ यत्फलं लभते लोकस्तदेतद्धारणे मुने । पञ्चलक्षजपेनैव
    सिद्धमेतद्भवेद्ध्रुवम् ॥ १७॥ लोके च सिद्धकवचो नावसीदति सङ्कटे । न तस्य मृत्युर्भवति जले वह्नौ विषे
    ज्वरे ॥ १८॥ जीवन्मुक्तो भवेत्सोऽपि सर्वसिद्धीश्वरीश्वरि । यदि स्यात्सिद्धकवचो विष्णुतुल्यो भवेद्ध्रुवम्
    ॥ १९॥ ॥ इति श्रीब्रह्मवैवर्ते प्रकृतिखण्डान्तर्गतदुर्गाकवचं सम्पूर्णम् ॥
