id: ayyappa-ashtottara-sata-nama-stotram
category: stotram
name:
  english: Ayyappa Ashtottara Sata Nama Stotram
content:
  english: mahashasta mahadevo mahadevasuto'vyayah | lokakarta lokabharta lokaharta paratparah || || trilokarakshako
    dhanvi tapasvi bhutasainikah | mantravedi mahavedi maruto jagadishvarah || || lokadhyaksho'granih
    shrimanaprameyaparakramah | simharudho gajarudho hayarudho maheshvarah || || nanashastradharo'nargho
    nanavidyavisharadah | nanarupadharo viro nanapraninishevitah || || bhutesho bhutito bhrityo bhujangabharanojvalah
    | ikshudhanvi pushpabano maharupo mahaprabhuh || || mayadevisuto manyo mahaniyo mahagunah | mahashaivo
    maharudro vaishnavo vishnupujakah || || vighnesho virabhadresho bhairavo shanmukhapriyah | merushringasamasino
    munisanghanishevitah || || devo bhadro jagannatho gananatho ganeshvarah | mahayogi mahamayi mahajnani
    mahasthirah || || devashasta bhutashasta bhimahasaparakramah | nagaharo nagakesho vyomakeshah sanatanah
    || || saguno nirguno nityo nityatripto nirashrayah | lokashrayo ganadhishashcatushshashtikalamayah
    || || rigyajuhsamatharvatma mallakasurabhanjanah | trimurti daityamathanah prakritih purushottamah
    || || kalajnani mahajnani kamadah kamalekshanah | kalpavriksho mahavriksho vidyavriksho vibhutidah
    || || samsaratapavicchetta pashulokabhayankarah | rogahanta pranadata paragarvavibhanjanah || || sarvashastrarthatatvajno
    nitiman papabhanjanah | pushkalapurnasamyuktah paramatma satangatih || || anantadityasankashah subrahmanyanujo
    bali | bhaktanukampi devesho bhagavan bhaktavatsalah ||
  devanagari: महाशास्ता महादेवो महादेवसुतोऽव्ययः । लोककर्ता लोकभर्ता लोकहर्ता परात्परः ॥ ॥ त्रिलोकरक्षको
    धन्वी तपस्वी भूतसैनिकः । मन्त्रवेदी महावेदी मारुतो जगदीश्वरः ॥ ॥ लोकाध्यक्षोऽग्रणीः श्रीमानप्रमेयपराक्रमः
    । सिंहारूढो गजारूढो हयारूढो महेश्वरः ॥ ॥ नानाशस्त्रधरोऽनर्घो नानाविद्याविशारदः । नानारूपधरो वीरो नानाप्राणिनिषेवितः
    ॥ ॥ भूतेशो भूतितो भृत्यो भुजङ्गाभरणोज्वलः । इक्षुधन्वी पुष्पबाणो महारूपो महाप्रभुः ॥ ॥ मायादेवीसुतो
    मान्यो महनीयो महागुणः । महाशैवो महारुद्रो वैष्णवो विष्णुपूजकः ॥ ॥ विघ्नेशो वीरभद्रेशो भैरवो षण्मुखप्रियः
    । मेरुशृङ्गसमासीनो मुनिसङ्घनिषेवितः ॥ ॥ देवो भद्रो जगन्नाथो गणनाथो गणेश्वरः । महायोगी महामायी महाज्ञानी
    महास्थिरः ॥ ॥ देवशास्ता भूतशास्ता भीमहासपराक्रमः । नागहारो नागकेशो व्योमकेशः सनातनः ॥ ॥ सगुणो निर्गुणो
    नित्यो नित्यतृप्तो निराश्रयः । लोकाश्रयो गणाधीशश्चतुष्षष्टिकलामयः ॥ ॥ ऋग्यजुःसामथर्वात्मा मल्लकासुरभञ्जनः
    । त्रिमूर्ति दैत्यमथनः प्रकृतिः पुरुषोत्तमः ॥ ॥ कालज्ञानी महाज्ञानी कामदः कमलेक्षणः । कल्पवृक्षो महावृक्षो
    विद्यावृक्षो विभूतिदः ॥ ॥ संसारतापविच्छेत्ता पशुलोकभयङ्करः । रोगहन्ता प्राणदाता परगर्वविभञ्जनः ॥ ॥
    सर्वशास्त्रार्थतत्वज्ञो नीतिमान् पापभञ्जनः । पुष्कलापूर्णासंयुक्तः परमात्मा सताङ्गतिः ॥ ॥ अनन्तादित्यसङ्काशः
    सुब्रह्मण्यानुजो बली । भक्तानुकम्पी देवेशो भगवान् भक्तवत्सलः ॥
