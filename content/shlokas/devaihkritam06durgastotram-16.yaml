id: devaihkritam06durgastotram-16
category: stotram
name:
  english: devaihkritam06durgastotram 16
  devanagari: देवैःकृतं०६दुर्गास्तोत्रम् १६
content:
  english: 20|| shivapriye maheshani devaduhkhakshayankari | trailokyamata sharvani vyapini bhaktavatsala
    || 21|| avirbhuya trilokeshi devakaryam kurushva ha | sanathah kripaya te hi vayam sarve maheshvari
    || 22|| tvattah sarve ca sukhino labhante sukhamuttamam | tvam vina na hi kincidvai shobhate tribhaveshvapi
    || 23|| iti shivapurane rudrasamhitayam parvatikhande shashthadhyayantargatam devaih kritam durgastotram
    samapatam | shivapurana | rudrasamhita | parvatikhanda | adhyaya 6
  devanagari: २०॥ शिवप्रिये महेशानि देवदुःखक्षयङ्करि । त्रैलोक्यमाता शर्वाणी व्यापिनी भक्तवत्सला ॥ २१॥
    आविर्भूय त्रिलोकेशि देवकार्यं कुरुष्व ह । सनाथाः कृपया ते हि वयं सर्वे महेश्वरि ॥ २२॥ त्वत्तः सर्वे
    च सुखिनो लभन्ते सुखमुत्तमम् । त्वां विना न हि किञ्चिद्वै शोभते त्रिभवेष्वपि ॥ २३॥ इति शिवपुराणे रुद्रसंहितायां
    पार्वतीखण्डे षष्ठाध्यायान्तर्गतं देवैः कृतं दुर्गास्तोत्रं समापतम् । शिवपुराण । रुद्रसंहिता । पार्वतीखण्ड
    । अध्याय ६
meaning: {}
