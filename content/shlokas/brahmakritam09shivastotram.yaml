id: brahmakritam09shivastotram
category: stotram
name:
  english: brahmakritam09shivastotram
  devanagari: ब्रह्मकृतं०९शिवस्तोत्रम्
content:
  english: brahmakritam 9 shivastotram brahmovaca | namo'stu sarvaya sushantamurtaye hyaghorarupaya namo
    namaste | sarvatmane sarva namo namaste mahatmane bhutapate namaste || 16|| onkarahunkaraparishkritaya
    svadhavashatkara namo namaste | gunatrayeshaya maheshvaraya te trayimayaya trigunatmane namah || 17||
    tvam shankara tvam hi maheshvaro'si pradhanamagryam tvamasi pravishtah | tvam vishnurishah prapitamahashca
    tvam saptajihvastvamanantajihvah || 18|| srashtasi srishtishca vibho tvameva vishvasya vedyam ca param
    nidhanam | ahurdvija vedavido varenyam paratparastvam paratah paro'si || 19|| sukshmatisukshmam pravadanti
    yacca vaco nivartanti mano yatashca || 20|| iti shriskandapurane avantyakhande revakhande shodasha
  devanagari: ब्रह्मकृतं ९ शिवस्तोत्रम् ब्रह्मोवाच । नमोऽस्तु सर्वाय सुशान्तमूर्तये ह्यघोररूपाय नमो नमस्ते
    । सर्वात्मने सर्व नमो नमस्ते महात्मने भूतपते नमस्ते ॥ १६॥ ओङ्कारहुङ्कारपरिष्कृताय स्वधावषट्कार नमो
    नमस्ते । गुणत्रयेशाय महेश्वराय ते त्रयीमयाय त्रिगुणात्मने नमः ॥ १७॥ त्वं शङ्कर त्वं हि महेश्वरोऽसि
    प्रधानमग्र्यं त्वमसि प्रविष्टः । त्वं विष्णुरीशः प्रपितामहश्च त्वं सप्तजिह्वस्त्वमनन्तजिह्वः ॥ १८॥
    स्रष्टासि सृष्टिश्च विभो त्वमेव विश्वस्य वेद्यं च परं निधानम् । आहुर्द्विजा वेदविदो वरेण्यं परात्परस्त्वं
    परतः परोऽसि ॥ १९॥ सूक्ष्मातिसूक्ष्मं प्रवदन्ति यच्च वाचो निवर्तन्ति मनो यतश्च ॥ २०॥ इति श्रीस्कन्दपुराणे
    आवन्त्यखण्डे रेवाखण्डे षोडशा
