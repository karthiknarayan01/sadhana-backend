id: indurayarajnakritambalakrishnastotram
category: stotram
name:
  english: indurayarajnakritambalakrishnastotram
  devanagari: इन्दुरायराज्नाकृतंबालकृष्णस्तोत्रम्
content:
  english: indurayarajna kritam balakrishnastotram vivahavidhina tatrotsavah samyagvyajayata | raja dadarsha
    kripaya jamataram caturbhujam || 19|| shankhacakragadapadmadharinam karunamukham | tushtava paraya
    pritya parvatastho'pyaparvakam || 20|| avidyaparvashunyastvam mayagunavivarjitah | pahi sanghatadharmebhyo
    naya dhama'ksharam tava || 21|| anadyantah parabrahma balakrishno narayanah | harikrishno bhavanaste
    naro narayano bhavan || 22|| rishayah pitarah siddha deva gandharvadanavah | pannaga rakshasa yaksha
    yam na jananti tattvatah || 23|| yoginah sadhavah satyo jnaninastapaseshvarah | yam na jananti devesham
    kuto'yam bhagavaniti || 24|| tasmai me nama ityastu pahi samsarasagarat | yasmin janih pusha nashtirbhutanam
    te namo namah || 25|| vishvatman vishvakarmatman vishvakarmekshanadiman | karmanamapi naishkarmyam
    dadha~stvam pahi sagarat || 26|| sahasrakiranam vishnum sarvatashcakshusham prabhum | anantakarapadadyam
    namami parameshvaram || 27|| anushvanum mahantam ca mahatsvapi dhruvam harim | garishtham shreshthamatyurdhvam
    tvam namami pareshvaram || 28|| atibhutadikarmanam buddhindriyadyagocaram | puranapurusham brahma
    tvam namami pareshvaram || 29|| jagatkosham catmayonim sanatanam jagatpatim | sarvapatim hiranvarnam
    tvam namami pareshvaram || 30|| tapate shitalaya'pi prakashaya ca te namah | svaraya sarthatattvaya
    gitirupaya te namah || 31|| tvamonkaro'vatarastvam vyuhastvam tvam caturbhujah | bhuma tvam ca mahavishnurvirat
    tvam kamalashayah || 32|| tvam kriya karanam karta karma tvam karakastatha | drashta sakshi mahakalah
    kavalastvam ca te namah || 33|| sarvarupaya shantaya kambhareyaya te namah | balakrishnaya krishnaya
    gopalajaya te namah || 34|| sarvapapaprashantaya sarvaduhkhaharaya ca | atmapatheyarupaya sarvantaryamine
    namah || 35|| griham me pavanam krishnavallabhasvamina kritam | nimagnam ca kutumbam me tvayoddhritam
    pragrihya mam || 36|| namaste sarvalokeshu sarvatmasu ca te namah | balakrishna mahakrishna krishneshvara
    namo'stu te || 37|| ityuktva radhike raja cendurayo namo'karot | iti shrilakshminarayaniyasamhita
    | khanda 2| adhyaya 189
  devanagari: इन्दुरायराज्ञा कृतं बालकृष्णस्तोत्रम् विवाहविधिना तत्रोत्सवः सम्यग्व्यजायत । राजा ददर्श
    कृपया जामातारं चतुर्भुजम् ॥ १९॥ शङ्खचक्रगदापद्मधारिणं करुणामुखम् । तुष्टाव परया प्रीत्या पर्वतस्थोऽप्यपर्वकम्
    ॥ २०॥ अविद्यापर्वशून्यस्त्वं मायागुणविवर्जितः । पाहि सङ्घातधर्मेभ्यो नय धामाऽक्षरं तव ॥ २१॥ अनाद्यन्तः
    परब्रह्म बालकृष्णो नरायणः । हरिकृष्णो भवानास्ते नरो नारायणो भवान् ॥ २२॥ ऋषयः पितरः सिद्धा देवा गन्धर्वदानवाः
    । पन्नगा राक्षसा यक्षा यं न जानन्ति तत्त्वतः ॥ २३॥ योगिनः साधवः सत्यो ज्ञानिनस्तापसेश्वराः । यं न
    जानन्ति देवेशं कुतोऽयं भगवानिति ॥ २४॥ तस्मै मे नम इत्यस्तु पाहि संसारसागरात् । यस्मिन् जनिः पुषा नष्टिर्भूतानां
    ते नमो नमः ॥ २५॥ विश्वात्मन् विश्वकर्मात्मन् विश्वकर्मेक्षणादिमन् । कर्मणामपि नैष्कर्म्यं दधँस्त्वं
    पाहि सागरात् ॥ २६॥ सहस्रकिरणं विष्णुं सर्वतश्चक्षुषं प्रभुम् । अनन्तकरपादाद्यं नमामि परमेश्वरम् ॥
    २७॥ अणुष्वणुं महान्तं च महत्स्वपि ध्रुवं हरिम् । गरिष्ठं श्रेष्ठमत्यूर्ध्वं त्वां नमामि परेश्वरम्
    ॥ २८॥ अतिभूतादिकर्माणं बुद्धीन्द्रियाद्यगोचरम् । पुराणपुरुषं ब्रह्म त्वां नमामि परेश्वरम् ॥ २९॥ जगत्कोशं
    चात्मयोनिं सनातनं जगत्पतिम् । सर्वपतिं हिरण्वर्णं त्वां नमामि परेश्वरम् ॥ ३०॥ तपते शीतलायाऽपि प्रकाशाय
    च ते नमः । स्वराय सार्थतत्त्वाय गीतिरूपाय ते नमः ॥ ३१॥ त्वमोङ्कारोऽवतारस्त्वं व्यूहस्त्वं त्वं चतुर्भुजः
    । भूमा त्वं च महाविष्णुर्विराट् त्वं कमलाशयः ॥ ३२॥ त्वं क्रिया करणं कर्ता कर्म त्वं कारकस्तथा । द्रष्टा
    साक्षी महाकालः कवलस्त्वं च ते नमः ॥ ३३॥ सर्वरूपाय शान्ताय काम्भरेयाय ते नमः । बालकृष्णाय कृष्णाय गोपालजाय
    ते नमः ॥ ३४॥ सर्वपापप्रशान्ताय सर्वदुःखहराय च । आत्मपाथेयरूपाय सर्वान्तर्यामिणे नमः ॥ ३५॥ गृहं मे
    पावनं कृष्णवल्लभस्वामिना कृतम् । निमग्नं च कुटुम्बं मे त्वयोद्धृतं प्रगृह्य माम् ॥ ३६॥ नमस्ते सर्वलोकेषु
    सर्वात्मसु च ते नमः । बालकृष्ण महाकृष्ण कृष्णेश्वर नमोऽस्तु ते ॥ ३७॥ इत्युक्त्वा राधिके राजा चेन्दुरायो
    नमोऽकरोत् । इति श्रीलक्ष्मीनारायणीयसंहिता । खण्ड २। अध्याय १८९
