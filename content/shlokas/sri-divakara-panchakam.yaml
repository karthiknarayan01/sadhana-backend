id: sri-divakara-panchakam
category: stotram
name:
  english: Sri Divakara Panchakam
content:
  english: atulyaviryamugratejasam suram sukantimindriyapradam sukantidam | kriparasaikapurnamadirupinam
    divakaram sada bhaje subhasvaram || || inam mahipatim ca nityasamstutam kalasuvarnabhushanam rathasthitam
    | acintyamatmarupinam grahashrayam divakaram sada bhaje subhasvaram || || ushodayam vasupradam suvarcasam
    vidikprakashakam kavim kripakaram | sushantamurtimurdhvagam jagajjvalam divakaram sada bhaje subhasvaram
    || || rishiprapujitam varam viyaccaram param prabhum saroruhasya vallabham | samastabhumipam ca tarakapatim
    divakaram sada bhaje subhasvaram || || grahadhipam gunanvitam ca nirjaram sukhapradam shubhashayam
    bhayapaham | hiranyagarbhamuttamam ca bhaskaram divakaram sada bhaje subhasvaram || || iti shri divakara
    pancakam |
  devanagari: अतुल्यवीर्यमुग्रतेजसं सुरं सुकान्तिमिन्द्रियप्रदं सुकान्तिदम् । कृपारसैकपूर्णमादिरूपिणं
    दिवाकरं सदा भजे सुभास्वरम् ॥ ॥ इनं महीपतिं च नित्यसंस्तुतं कलासुवर्णभूषणं रथस्थितम् । अचिन्त्यमात्मरूपिणं
    ग्रहाश्रयं दिवाकरं सदा भजे सुभास्वरम् ॥ ॥ उषोदयं वसुप्रदं सुवर्चसं विदिक्प्रकाशकं कविं कृपाकरम् ।
    सुशान्तमूर्तिमूर्ध्वगं जगज्ज्वलं दिवाकरं सदा भजे सुभास्वरम् ॥ ॥ ऋषिप्रपूजितं वरं वियच्चरं परं प्रभुं
    सरोरुहस्य वल्लभम् । समस्तभूमिपं च तारकापतिं दिवाकरं सदा भजे सुभास्वरम् ॥ ॥ ग्रहाधिपं गुणान्वितं च
    निर्जरं सुखप्रदं शुभाशयं भयापहम् । हिरण्यगर्भमुत्तमं च भास्करं दिवाकरं सदा भजे सुभास्वरम् ॥ ॥ इति
    श्री दिवाकर पञ्चकम् ।
