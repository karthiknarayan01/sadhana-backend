id: kathopanishad-chapter-1-valli-1
category: stotram
name:
  english: Kathopanishad - Chapter 1, Valli 1
content:
  english: om ushan ha vai vajashravasa ndadau| tasya ha naciketa nama putra asa || ndakshinasu niyamanasu
    shraddha || pitodaka jagdhatrina dugdhadoha nirindriyah| ananda nama te lokastansa gacchati ta dadat
    || ndasyasiti| dvitiya ntam hovaca mrityave tva dadamiti || || bahunamemi prathamo bahunamemi madhyamah|
    kim svidyamasya kartavyam ya~nmayadya karishyati || || anupashya yatha purve pratipashya tatha 'pare|
    sasyamiva martyah pacyate sasyamivajayate punah || || vaishvanarah pravishatyatithirbrahmano grihan|
    tasyaitam shanti nkurvanti hara vaivasvatodakam || || ashapratikshe sangatam sunrita nceshtapurte
    putrapashumshca sarvan| etad vrinkte purushasyalpamedhaso yasyanashnanvasati brahmano grihe || ||
    tisro ratriryadavatsirgrihe me 'nashnanbrahmannatithirnamasyah| namaste 'stu brahmansvasti me 'stu
    tasmatprati trinvaranvrinishva || ssumana yatha syadvitamanyurgautamo mabhi mrityo| tvatprasrishta
    mmabhivadetpratita etattrayana || yatha purastad bhavita pratita auddalakirarunirmatprasrishtah| sukham
    ratri shshayita vitamanyustva ndadrishivanmrityumukhatpramuktam || nkincanasti na tatra tva nna jaraya
    bibheti| ubhe tirtva 'shanayapipase shokatigo modate svargaloke || || sa tvamagnim svargyamadhyeshi
    mrityo prabruhi tvam shraddadhanaya mahyam| svargaloka amritatva mbhajanta etad dvitiyena vrine varena
    || || pra te bravimi tadu me nibodha svargyamagni nnaciketah prajanan| anantalokaptimatho pratishtham
    ntamuvaca tasmai ya ishtaka yavatirva yatha va| sa capi tatpratyavadadyathoktamathasya mrityuh punarevaha
    tushtah || || tamabravitpriyamano mahatma vara ntavehadya dadami bhuyah| tavaiva namna bhavita ||
    trinaciketastribhiretya sandhi ntrikarmakrittarati janmamrityu| brahmajajna vi~ditva nicayyemam shantimatyantameti
    || || trinaciketastrayametadviditva ya evam vi~dvamshcinute naciketam| sa mrityupashanpuratah pranodya
    shokatigo modate svargaloke || ssvargyo yamavrinitha dvitiyena varena| etamagni ntavaiva pravakshyanti
    janasastritiyam mprete vicikitsa manushye 'stityeke nayamastiti caike| etadvidyamanushishtastvaya
    va~ranamesha varastritiyah || || devairatrapi vicikitsita mpura na hi suvijneyamanuresha dharmah|
    anyam nnaciketo vrinishva ma moparotsirati ma srijainam || || devairatrapi vicikitsita nca mrityo
    yanna sujneyamattha| vakta casya tvadriganyo na labhyo nanyo varastulya etasya kashcit || || shatayushah
    putrapautranvrinishva bahunpashunhastihiranyamashvan| bhumermahadayatanam nca jiva sharado yavadicchasi
    || nca| mahabhumau naciketastvamedhi kamana || ye ye kama durlabha martyaloke sarvankamamshchandatah
    prarthayasva| ima rama ssaturya na hidrisha lambhaniya manushyaih| abhirmatprattabhih paricarayasva
    naciketo marana || shvobhava martyasya yadantakaitatsarvendriyana njarayanti tejah| api sarva njivitamalpameva
    tavaiva vahastava nrityagite || || na vittena tarpaniyo manushyo lapsyamahe vittamadrakshma cettva|
    jivishyamo yavadishishyasi tvam || ajiryatamamritanamupetya jiryanmartyah kvadhassthah prajanan| abhidhyayanvarnaratipramodanatidirghe
    jivite ko rameta || vi~cikitsanti mrityo yatsamparaye mahati bruhi nastat| yo va~ro gudhamanupravishto
    nanya ntasmannaciketa vrinite ||
  devanagari: ॐ उशन् ह वै वाजश्रवस न्ददौ। तस्य ह नचिकेता नाम पुत्र आस ॥ न्दक्षिणासु नीयमानासु श्रद्धा
    ॥ पीतोदका जग्धतृणा दुग्धदोहा निरिन्द्रियाः। अनन्दा नाम ते लोकास्तान्स गच्छति ता ददत् ॥ न्दास्यसीति।
    द्वितीय न्तं होवाच मृत्यवे त्वा ददामीति ॥ ॥ बहूनामेमि प्रथमो बहूनामेमि मध्यमः। किं स्विद्यमस्य कर्तव्यं
    यँन्मयाद्य करिष्यति ॥ ॥ अनुपश्य यथा पूर्वे प्रतिपश्य तथा ऽपरे। सस्यमिव मर्त्यः पच्यते सस्यमिवाजायते
    पुनः ॥ ॥ वैश्वानरः प्रविशत्यतिथिर्ब्राह्मणो गृहान्। तस्यैतां शान्ति ङ्कुर्वन्ति हर वैवस्वतोदकम् ॥
    ॥ आशाप्रतीक्षे सङ्गतं सूनृता ञ्चेष्टापूर्ते पुत्रपशूंश्च सर्वान्। एतद् वृङ्क्ते पुरुषस्याल्पमेधसो
    यस्यानश्नन्वसति ब्राह्मणो गृहे ॥ ॥ तिस्रो रात्रीर्यदवात्सीर्गृहे मे ऽनश्नन्ब्रह्मन्नतिथिर्नमस्यः।
    नमस्ते ऽस्तु ब्रह्मन्स्वस्ति मे ऽस्तु तस्मात्प्रति त्रीन्वरान्वृणीष्व ॥ स्सुमना यथा स्याद्वीतमन्युर्गौतमो
    माभि मृत्यो। त्वत्प्रसृष्ट म्माभिवदेत्प्रतीत एतत्त्रयाणा ॥ यथा पुरस्ताद् भविता प्रतीत औद्दालकिरारुणिर्मत्प्रसृष्टः।
    सुखं रात्री श्शयिता वीतमन्युस्त्वा न्ददृशिवान्मृत्युमुखात्प्रमुक्तम् ॥ ङ्किञ्चनास्ति न तत्र त्व न्न
    जरया बिभेति। उभे तीर्त्वा ऽशनायापिपासे शोकातिगो मोदते स्वर्गलोके ॥ ॥ स त्वमग्निं स्वर्ग्यमध्येषि मृत्यो
    प्रब्रूहि त्वं श्रद्दधानाय मह्यम्। स्वर्गलोका अमृतत्व म्भजन्त एतद् द्वितीयेन वृणे वरेण ॥ ॥ प्र ते
    ब्रवीमि तदु मे निबोध स्वर्ग्यमग्नि न्नचिकेतः प्रजानन्। अनन्तलोकाप्तिमथो प्रतिष्ठां न्तमुवाच तस्मै
    या इष्टका यावतीर्वा यथा वा। स चापि तत्प्रत्यवदद्यथोक्तमथास्य मृत्युः पुनरेवाह तुष्टः ॥ ॥ तमब्रवीत्प्रीयमाणो
    महात्मा वर न्तवेहाद्य ददामि भूयः। तवैव नाम्ना भविता ॥ त्रिणाचिकेतस्त्रिभिरेत्य सन्धि न्त्रिकर्मकृत्तरति
    जन्ममृत्यू। ब्रह्मजज्ञ विँदित्वा निचाय्येमां शान्तिमत्यन्तमेति ॥ ॥ त्रिणाचिकेतस्त्रयमेतद्विदित्वा
    य एवं विँद्वांश्चिनुते नाचिकेतम्। स मृत्युपाशान्पुरतः प्रणोद्य शोकातिगो मोदते स्वर्गलोके ॥ स्स्वर्ग्यो
    यमवृणीथा द्वितीयेन वरेण। एतमग्नि न्तवैव प्रवक्ष्यन्ति जनासस्तृतीयं म्प्रेते विचिकित्सा मनुष्ये ऽस्तीत्येके
    नायमस्तीति चैके। एतद्विद्यामनुशिष्टस्त्वया वँराणामेष वरस्तृतीयः ॥ ॥ देवैरत्रापि विचिकित्सित म्पुरा
    न हि सुविज्ञेयमणुरेष धर्मः। अन्यं न्नचिकेतो वृणीष्व मा मोपरोत्सीरति मा सृजैनम् ॥ ॥ देवैरत्रापि विचिकित्सित
    ञ्च मृत्यो यन्न सुज्ञेयमात्थ। वक्ता चास्य त्वादृगन्यो न लभ्यो नान्यो वरस्तुल्य एतस्य कश्चित् ॥ ॥ शतायुषः
    पुत्रपौत्रान्वृणीष्व बहून्पशून्हस्तिहिरण्यमश्वान्। भूमेर्महदायतनं ञ्च जीव शरदो यावदिच्छसि ॥ ञ्च। महाभूमौ
    नचिकेतस्त्वमेधि कामाना ॥ ये ये कामा दुर्लभा मर्त्यलोके सर्वान्कामांश्छन्दतः प्रार्थयस्व। इमा रामा
    स्सतूर्या न हीदृशा लम्भनीया मनुष्यैः। आभिर्मत्प्रत्ताभिः परिचारयस्व नचिकेतो मरण ॥ श्वोभावा मर्त्यस्य
    यदन्तकैतत्सर्वेन्द्रियाणा ञ्जरयन्ति तेजः। अपि सर्व ञ्जीवितमल्पमेव तवैव वाहास्तव नृत्यगीते ॥ ॥ न वित्तेन
    तर्पणीयो मनुष्यो लप्स्यामहे वित्तमद्राक्ष्म चेत्त्वा। जीविष्यामो यावदीशिष्यसि त्वं ॥ अजीर्यताममृतानामुपेत्य
    जीर्यन्मर्त्यः क्वधस्स्थः प्रजानन्। अभिध्यायन्वर्णरतिप्रमोदानतिदीर्घे जीविते को रमेत ॥ विँचिकित्सन्ति
    मृत्यो यत्साम्पराये महति ब्रूहि नस्तत्। यो वँरो गूढमनुप्रविष्टो नान्य न्तस्मान्नचिकेता वृणीते ॥
