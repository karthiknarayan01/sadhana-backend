id: narakritamharaharistotram
category: stotram
name:
  english: narakritamharaharistotram
  devanagari: नरकृतंहरहरिस्तोत्रम्
content:
  english: narakritam haraharistotram harirapi sa tatraiva tushtava harakeshavau | namo hara hare tubhyam
    namah shankara vishnave || 34|| namaste shulahastaya namaste khadgapanaye | namo namaste medhyaya
    hrishikesha namo'stu te || 35|| namo'stu vacam pataye shridharaya namo namah || iti shriskandapurane
    avantyakhande avantikshetramahatmye tritiyadhyayantargatam narakritam hara
  devanagari: नरकृतं हरहरिस्तोत्रम् हरिरपि स तत्रैव तुष्टाव हरकेशवौ । नमो हर हरे तुभ्यं नमः शङ्कर विष्णवे
    ॥ ३४॥ नमस्ते शूलहस्ताय नमस्ते खड्गपाणये । नमो नमस्ते मेध्याय हृषीकेश नमोऽस्तु ते ॥ ३५॥ नमोऽस्तु वाचां
    पतये श्रीधराय नमो नमः ॥ इति श्रीस्कन्दपुराणे आवन्त्यखण्डे अवन्तीक्षेत्रमाहात्म्ये तृतीयाध्यायान्तर्गतं
    नरकृतं हर
meaning: {}
