id: rajaudayakritamkrishnanarayanastotram
category: stotram
name:
  english: rajaudayakritamkrishnanarayanastotram
  devanagari: राजाउदयकृतंकृष्णनारायणस्तोत्रम्
content:
  english: raja udayakritam krishnanarayanastotram atha sarvam kshanallinam nripastvashcaryamaptavan |
    tatah kshanantare naijotajam dadarsha shobhanam || 52|| svastho bhutva disho natva tushtava dhyanasamsthitah
    | om namah shrinivasaya mulaprakritiyamine || 53|| ajitaya ca devaya mahatmane namo'stu te | anashritaya
    shantaya nihsprihaya namo'stu te || 54|| nama adyaya devaya sarvadevamayaya ca | arshayadisvarupaya
    shrikrishnaya ca te namah || 55|| anantaraya caikaya sada vyaktaya te namah | namo guptaya kashaya
    guneshvaraya te namah || 56|| atarkyaya'prameyaya catulaya ca te namah | nishcintaya ca purvaya sanatanaya
    te namah || 57|| puranaya namastasmai nirgunaya namo'stu te | namo jagatpratishthaya brahmanishthaya
    te namah || 58|| padmanabhaya yogaya govindaya namo namah | namo'stu sankhyavedyaya vishveshvaraya
    te namah || 59|| haraye shivarakshaya narayanaya te namah | paratmane'mitadatre'mitakramaya te namah
    || 60|| sharngacakragadapadmashaline te namo namah | mahoragaya simhaya namo'stu vedavasine || 61||
    mahamatsyaya kantaya kacchapaya ca te namah | vamanaya ca dirghaya caturbhujaya te namah || 62|| siddhacaranagandharvasamstutaya
    namo namah | acyutaya sakalaya nagendrashayanaya ca || 63|| dugdhavarnaya krishnaya hemabhaya namo
    namah | pitambaraya daityadinashanaya ca te namah || 64|| aksharaya'kshareshaya nabhipadmaya te namah
    | caturmukhaya devaya pancavaktraya te namah || 65|| kshiravasaya yashase kantaye varadaya ca | sarveshvaraya
    kantaya kaminishaya te namah || 66|| varenyaya vighnahartre bhaktipriyaya te namah | padmayatasunetraya
    shukanasaya sharngine || 67|| yogeshvaraya vrikshaya shakhine te namo namah | devayanaya munaye sadhave
    te namo namah || 68|| mohinirupabhasaya jivavasaya te namah | varahaya nrisimhaya sharabhaya ca te
    namah || 69|| kutastham sarvahetum ca purusham ca puratanam | mayakantam ceshakantam sarvakantam namamyaham
    || 70|| kshetrajnam kalamayesham vyuhesham muktajivakam | vasudevam satikantam krishnanarayanam prabhum
    || 71|| kambharanandanam krishnam gopalakrishnabalakam | paradhamanivasam tam pumuttamam namamyaham
    || 72|| brahmarshayo brahmarupam yam vadanti sanatanam | aksharesham ca muktesham prapadye sharanam
    harim || 73|| shrivatsankam shvetapadmarekham vigunaharakam | shodashadicihnashobham prapadye sharanam
    patim || 74|| yatra vishvam yashca vishve sarvam yatra pratishthate | prabhavam sarvabhutanam divyagunam
    pareshvaram || 75|| prapadye muktasanganam sadhunam paramam gatim | bhagavantam catmavasam strivasam
    pushkarekshanam || 76|| sharanyam sharanam bhaktya prapadye bhaktavatsalam | antakale samagatya pradarshyatmanameva
    yah || 77|| naijam dhama nijam bhaktam nayatyeva prabhuh parah | tam namami param devam mokshadam
    purushottamam || 78|| patalantam ca satyadi sarvam mati tu yatra vai | mahamayantakam sarvam yasmin
    mati janardane || 79|| dhamani muktakotyashca yasmin manti pareshvare | tam prapadye param krishnam
    narayanam shriyah patim || 80|| na tvam stotum tatha vedmi yatha tvam vartase prabho
  devanagari: राजा उदयकृतं कृष्णनारायणस्तोत्रम् अथ सर्वं क्षणाल्लीनं नृपस्त्वाश्चर्यमाप्तवान् । ततः क्षणान्तरे
    नैजोटजां ददर्श शोभनाम् ॥ ५२॥ स्वस्थो भूत्वा दिशो नत्वा तुष्टाव ध्यानसंस्थितः । ॐ नमः श्रीनिवासाय मूलप्रकृतियामिने
    ॥ ५३॥ अजिताय च देवाय महात्मने नमोऽस्तु ते । अनाश्रिताय शान्ताय निःस्पृहाय नमोऽस्तु ते ॥ ५४॥ नम आद्याय
    देवाय सर्वदेवमयाय च । आर्षायादिस्वरूपाय श्रीकृष्णाय च ते नमः ॥ ५५॥ अनन्तराय चैकाय सदा व्यक्ताय ते
    नमः । नमो गुप्ताय काशाय गुणेश्वराय ते नमः ॥ ५६॥ अतर्क्यायाऽप्रमेयाय चातुलाय च ते नमः । निश्चिन्ताय
    च पूर्वाय सनातनाय ते नमः ॥ ५७॥ पुराणाय नमस्तस्मै निर्गुणाय नमोऽस्तु ते । नमो जगत्प्रतिष्ठाय ब्रह्मनिष्ठाय
    ते नमः ॥ ५८॥ पद्मनाभाय योगाय गोविन्दाय नमो नमः । नमोऽस्तु साङ्ख्यवेद्याय विश्वेश्वराय ते नमः ॥ ५९॥
    हरये शिवरक्षाय नारायणाय ते नमः । परात्मनेऽमितदात्रेऽमितक्रमाय ते नमः ॥ ६०॥ शार्ङ्गचक्रगदापद्मशालिने
    ते नमो नमः । महोरगाय सिंहाय नमोऽस्तु वेदवासिने ॥ ६१॥ महामत्स्याय कान्ताय कच्छपाय च ते नमः । वामनाय
    च दीर्घाय चतुर्भुजाय ते नमः ॥ ६२॥ सिद्धचारणगन्धर्वसंस्तुताय नमो नमः । अच्युताय सकलाय नागेन्द्रशयनाय
    च ॥ ६३॥ दुग्धवर्णाय कृष्णाय हेमाभाय नमो नमः । पीताम्बराय दैत्यादिनाशनाय च ते नमः ॥ ६४॥ अक्षरायाऽक्षरेशाय
    नाभिपद्माय ते नमः । चतुर्मुखाय देवाय पञ्चवक्त्राय ते नमः ॥ ६५॥ क्षीरवासाय यशसे कान्तये वरदाय च । सर्वेश्वराय
    कान्ताय कामिनीशाय ते नमः ॥ ६६॥ वरेण्याय विघ्नहर्त्रे भक्तिप्रियाय ते नमः । पद्मायतसुनेत्राय शुकनासाय
    शार्ङ्गिणे ॥ ६७॥ योगेश्वराय वृक्षाय शाखिने ते नमो नमः । देवायनाय मुनये साधवे ते नमो नमः ॥ ६८॥ मोहिनीरूपभासाय
    जीववासाय ते नमः । वाराहाय नृसिंहाय शरभाय च ते नमः ॥ ६९॥ कूटस्थं सर्वहेतुं च पुरुषं च पुरातनम् । मायाकान्तं
    चेशकान्तं सर्वकान्तं नमाम्यहम् ॥ ७०॥ क्षेत्रज्ञं कालमायेशं व्यूहेशं मुक्तजीवकम् । वासुदेवं सतीकान्तं
    कृष्णनारायणं प्रभुम् ॥ ७१॥ कम्भरानन्दनं कृष्णं गोपालकृष्णबालकम् । परधामनिवासं तं पुमुत्तमं नमाम्यहम्
    ॥ ७२॥ ब्रह्मर्षयो ब्रह्मरूपं यं वदन्ति सनातनम् । अक्षरेशं च मुक्तेशं प्रपद्ये शरणं हरिम् ॥ ७३॥ श्रीवत्साङ्कं
    श्वेतपद्मरेखं विगुणहारकम् । षोडशादिचिह्नशोभं प्रपद्ये शरणं पतिम् ॥ ७४॥ यत्र विश्वं यश्च विश्वे सर्वं
    यत्र प्रतिष्ठते । प्रभवं सर्वभूतानां दिव्यगुणं परेश्वरम् ॥ ७५॥ प्रपद्ये मुक्तसङ्गानां साधूनां परमां
    गतिम् । भगवन्तं चात्मवासं स्त्रीवासं पुष्करेक्षणम् ॥ ७६॥ शरण्यं शरणं भक्त्या प्रपद्ये भक्तवत्सलम्
    । अन्तकाले समागत्य प्रदर्श्यात्मानमेव यः ॥ ७७॥ नैजं धाम निजं भक्तं नयत्येव प्रभुः परः । तं नमामि परं
    देवं मोक्षदं पुरुषोत्तमम् ॥ ७८॥ पातालान्तं च सत्यादि सर्वं माति तु यत्र वै । महामायान्तकं सर्वं यस्मिन्
    माति जनार्दने ॥ ७९॥ धामानि मुक्तकोट्यश्च यस्मिन् मान्ति परेश्वरे । तं प्रपद्ये परं कृष्णं नारायणं
    श्रियः पतिम् ॥ ८०॥ न त्वां स्तोतुं तथा वेद्मि यथा त्वं वर्तसे प्रभो
