id: vatulanathasutrani
category: sutra
name:
  english: vatulanathasutrani
  devanagari: वातूलनाथसूत्राणि
content:
  english: tallabhacchurita yugapadvrittipravrittih || 2|| ubhayapattoddhvattananmahashunyatapraveshah
    || 3|| yugmagrasanniravakashasamvinnishtha || 4|| siddhayoginisanghattanmahamelapodayah || 5|| trikancukaparityagannirakhyapadavasthitih
    || 6|| vakcatushtayodayaviramaprathasu svarah prathate || 7|| rasatritayasvadanenanicchocchalitam
    vigatabandham param brahma || 8|| devicatushtayollasena sadaiva svavishrantyavasthitih || 9|| dvadashavahodayena
    mahamaricivikasah || 10|| caryapancakodaye nistarangasamaveshah || 11|| mahabodhasamaveshatpunyapapasambandhah
    || 12|| akathanakathabalena mahavismayamudra praptya khasvarata || 13|| iti shrivatulanathasutrani
    | || iti shivam ||
  devanagari: तल्लाभाच्छुरिता युगपद्वृत्तिप्रवृत्तिः ॥ २॥ उभयपट्टोद्ध्वट्टनान्महाशून्यताप्रवेशः ॥ ३॥ युग्मग्रासान्निरवकाशसंविन्निष्ठा
    ॥ ४॥ सिद्धयोगिनीसङ्घट्टान्महामेलापोदयः ॥ ५॥ त्रिकञ्चुकपरित्यागान्निराख्यपदावस्थितिः ॥ ६॥ वाक्चतुष्टयोदयविरामप्रथासु
    स्वरः प्रथते ॥ ७॥ रसत्रितयास्वादनेनानिच्छोच्छलितं विगतबन्धं परं ब्रह्म ॥ ८॥ देवीचतुष्टयोल्लासेन सदैव
    स्वविश्रान्त्यवस्थितिः ॥ ९॥ द्वादशवाहोदयेन महामरीचिविकासः ॥ १०॥ चर्यापञ्चकोदये निस्तरङ्गसमावेशः ॥
    ११॥ महाबोधसमावेशात्पुण्यपापासम्बन्धः ॥ १२॥ अकथनकथाबलेन महाविस्मयमुद्रा प्राप्त्या खस्वरता ॥ १३॥ इति
    श्रीवातूलनाथसूत्राणि । ॥ इति शिवम् ॥
