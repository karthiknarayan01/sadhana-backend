id: mrityurakshakarakakavacam
category: kavacha
name:
  english: mrityurakshakarakakavacam
  devanagari: मृत्युरक्षाकारककवचम्
content:
  english: sadhakabhishtasiddhyarthe jape viniyogah shiro me sarvada patu mrityunjayasadashivah | satryaksharasvarupo
    me vadanam ca maheshvarah || 3|| pancaksharatma bhagavan bhujau me parirakshatu | mrityunjayastribijatma
    hyayu rakshatu me sada || 4|| bilvavrikshasamasino dakshinamurtiravyayah | sada me sarvatah patu shattrimshadvarnarupadhrik
    || 5|| dvavimshatyaksharo rudrah kukshau me parirakshatu | trivarnatma nilakanthah kantham rakshatu
    sarvada || 6|| cintamanirbijapure hyarddhanarishvaro harah | sada rakshatu me guhyam sarvasampatpradayakah
    || 7|| satryaksharasvarupatma kutarupi maheshvarah | martanda bhairavo nityam padau me parirakshatu
    || 8|| om jum sah mahabijasvarupastripurantakah | urdhvamurddhani ceshano mama rakshatu sarvada ||
    9|| dakshinasyam mahadevo rakshenme girinayakah | aghorakhyo mahadevah purvasyam parirakshatu || 10||
    vamadevah pashcimasyam sada me parirakshatu | uttarasyam sada patu sadyojatasvarupadhrik || 11|| ittham
    rakshakaram devi kavacam devadurlabham | pratarmadhyahnakale tu yah pathecchivasannidhau || 12|| so'bhishtaphalamapnoti
    kavacasya prasadatah | kavacam dharayedyastu sadhako dakshine bhuje || 13|| sarvasiddhikaram punyam
    sarvarishtavinashanam | yoginibhutavetalah pretakushmandapannagah || 14|| na tasya himsam kurvanti
    putravatya layanti te | pathitva'bhyarcayeddevi yathavidhipurahsaram || 15|| lakshanca mulamantrasya
    purashcaranamucyate | taddharane mahadevi mrityurogavinashanam || 16|| evam yah kurute martyah punyam
    gatimavapnuyat | iti jnatam mahadevi tasya vaktre sthitam sada || 17|| kavacasya prasadena mrityumukto
    bhavennarah | anyatha siddhihanih syatsatyametanmanorame || 18|| tava snehanmahadevi kathitam kavacam
    shubham | na deyam kasyacidbhadre yadicchedatmano hitam || 19|| iti shrikiyoddishe mahatantraraje
    devishvarasamvade mrityurakshakarakam kavacam samaptam | athaionavimshah patalah
  devanagari: साधकाभीष्टसिद्ध्यर्थे जपे विनियोगः शिरो मे सर्वदा पातु मृत्युञ्जयसदाशिवः । सत्र्यक्षरस्वरूपो
    मे वदनं च महेश्वरः ॥ ३॥ पञ्चाक्षरात्मा भगवान् भुजौ मे परिरक्षतु । मृत्युञ्जयस्त्रिबीजात्मा ह्यायू
    रक्षतु मे सदा ॥ ४॥ बिल्ववृक्षसमासीनो दक्षिणामूर्तिरव्ययः । सदा मे सर्वतः पातु षट्त्रिंशद्वर्णरूपधृक्
    ॥ ५॥ द्वाविंशत्यक्षरो रुद्रः कुक्षौ मे परिरक्षतु । त्रिवर्णात्मा नीलकण्ठः कण्ठं रक्षतु सर्वदा ॥ ६॥
    चिन्तामणिर्बीजपूरे ह्यर्द्धनारीश्वरो हरः । सदा रक्षतु मे गुह्यं सर्वसम्पत्प्रदायकः ॥ ७॥ सत्र्यक्षरस्वरूपात्मा
    कूटरूपी महेश्वरः । मार्तण्ड भैरवो नित्यं पादौ मे परिरक्षतु ॥ ८॥ ॐ जूं सः महाबीजस्वरूपस्त्रिपुरान्तकः
    । ऊर्ध्वमूर्द्धनि चेशानो मम रक्षतु सर्वदा ॥ ९॥ दक्षिणस्यां महादेवो रक्षेन्मे गिरिनायकः । अघोराख्यो
    महादेवः पूर्वस्यां परिरक्षतु ॥ १०॥ वामदेवः पश्चिमस्यां सदा मे परिरक्षतु । उत्तरस्यां सदा पातु सद्योजातस्वरूपधृक्
    ॥ ११॥ इत्थं रक्षाकरं देवि कवचं देवदुर्लभम् । प्रातर्मध्याह्नकाले तु यः पठेच्छिवसन्निधौ ॥ १२॥ सोऽभीष्टफलमाप्नोति
    कवचस्य प्रसादतः । कवचं धारयेद्यस्तु साधको दक्षिणे भुजे ॥ १३॥ सर्वसिद्धिकरं पुण्यं सर्वारिष्टविनाशनम्
    । योगिनीभूतवेतालाः प्रेतकूष्माण्डपन्नगाः ॥ १४॥ न तस्य हिंसां कुर्वन्ति पुत्रवत्या लयन्ति ते । पठित्वाऽभ्यर्चयेद्देवि
    यथाविधिपुरःसरम् ॥ १५॥ लक्षञ्च मूलमन्त्रस्य पुरश्चरणमुच्यते । तद्धारणे महादेवि मृत्युरोगविनाशनम् ॥
    १६॥ एवं यः कुरुते मर्त्यः पुण्यां गतिमवाप्नुयात् । इति ज्ञातं महादेवि तस्य वक्त्रे स्थितं सदा ॥ १७॥
    कवचस्य प्रसादेन मृत्युमुक्तो भवेन्नरः । अन्यथा सिद्धिहानिः स्यात्सत्यमेतन्मनोरमे ॥ १८॥ तव स्नेहान्महादेवि
    कथितं कवचं शुभम् । न देयं कस्यचिद्भद्रे यदीच्छेदात्मनो हितम् ॥ १९॥ इति श्रीकियोड्डीशे महातन्त्रराजे
    देवीश्वरसंवादे मृत्युरक्षाकारकं कवचं समाप्तम् । अथैओनविंशः पटलः
