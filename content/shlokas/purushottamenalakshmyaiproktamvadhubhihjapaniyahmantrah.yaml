id: purushottamenalakshmyaiproktamvadhubhihjapaniyahmantrah
category: mantra
name:
  english: purushottamenalakshmyaiproktamvadhubhihjapaniyahmantrah
  devanagari: पुरुषोत्तमेनलक्ष्म्यैप्रोक्तंवधूभिःजपनीयाःमन्त्राः
content:
  english: om sukhadalakshmyai vidmahe narayanishriyai dhimahi | tannah shivarajnishrih pracodayat ||
    66|| a krishnaya vidmahe vallabhaya dhimahi prajna tannah pracodayat | om acaryaya vidmahe gurave
    dhimahi parvati nah pracodayat || 67|| ete mantrah sada lakshmi bhuktimuktiphalapradah | yavatpumarthadah
    sarvasukhavancchaprapurakah || 68|| shatam sahasram cayutam niyutam kotirityapi | japtah shraddhanvitastvam
    mam smritva shashvatakamadah || 69|| tvamaham tvamaham lakshmi so'ham so'ham japecca yah | smritva
    mam capi tasmai ca tasyai dadamyaham nijam || 70|| mamasanam mama dhama mamatmanam dadami ca | madbhaktartham
    mama sarvam sheshayami na carpane || 71||
  devanagari: ॐ सुखदालक्ष्म्यै विद्महे नारायणीश्रियै धीमहि । तन्नः शिवराज्ञीश्रीः प्रचोदयात् ॥ ६६॥ आ कृष्णाय
    विद्महे वल्लभाय धीमहि प्रज्ञा तन्नः प्रचोदयात् । ॐ आचार्याय विद्महे गुरवे धीमहि पार्वती नः प्रचोदयात्
    ॥ ६७॥ एते मन्त्राः सदा लक्ष्मि भुक्तिमुक्तिफलप्रदाः । यावत्पुमर्थदाः सर्वसुखवाञ्च्छाप्रपूरकाः ॥ ६८॥
    शतं सहस्रं चायुतं नियुतं कोटिरित्यपि । जप्ताः श्रद्धान्वितास्त्वां मां स्मृत्वा शाश्वतकामदाः ॥ ६९॥
    त्वमहं त्वमहं लक्ष्मि सोऽहं सोऽहं जपेच्च यः । स्मृत्वा मां चापि तस्मै च तस्यै ददाम्यहं निजम् ॥ ७०॥
    ममासनं मम धाम ममात्मानं ददामि च । मद्भक्तार्थं मम सर्वं शेषयामि न चार्पणे ॥ ७१॥
