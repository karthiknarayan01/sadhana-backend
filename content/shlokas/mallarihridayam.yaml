id: mallarihridayam
category: hridaya
name:
  english: mallarihridayam
  devanagari: मल्लारिहृदयम्
content:
  english: astraya phat || purve shvetambaram devam agneyyam rudra bhairavam | dakshine candarupaya nairrityam
    krodhabhairavam || 1|| pashcime unnatagrivam vayavyam kalabhairavam | uttare siddhim siddhantam ishanyam
    shivakarpuram || 2|| urdhve kalavirupaya ambare mallaharinim | antariksham sadanandam yaḻakotisvarupinam
    || 3|| evam ekadasham devam rakshettrailokya sarvada | vijayi sarvakamartham kshetrapala mahipate
    || 4|| bhruvormadhyetu onkaram dvidale sahasrabhavanah | netre tripurantako devo nasike kamaharakah
    || 5|| mukhe mumukshanathaya kantham karmakalamritah | hridayam harilingaya skandhe karmaharipriyam
    || 6|| prishthe pralayarudraya udare udayarkajam | madhye rakshatu kararthi nabhi naradagayate ||
    7|| guhyam gurupathatmaya janghe jivaprado'vatu | janumandalajanatha padaprasadapraptaye || 8|| angushthe
    sarvatirthani sarvange parameshvarah | evamangeshu divyasya martandasvarupinam || 9|| prathamam kashinathaya
    dvitiyam pancalingayoh | pancalingebhyah tritiyam premalingaya caturtham devarupinyai || 10|| pancamam
    pancapranaya shashtham shadbhujakshemakam | saptamam sapakam siddhih ashtamam ambikapriyam || 11||
    navamam naganatham ca dashamam shoshaharakam | ekadasham maharudram dvadasham jyotirlingayoh || 12||
    jyotirlingani trayodasham triyogi ca caturdasham bhuvanatrayam | pancadasham mandalam purvam shodasham
    ca samadhine || 13|| saptadasham guhyarupam ashtadasham ca abjakam | navadasham naisargika devi tanno
    devi prasannata || 14|| ekonavimshati namani vishvambharasvarupasya | jnanasiddhirbhavetpraptih ekadasham
    japan jale || 15|| smashane dashavaram ca saptavaram pathennarah | dashapatham sarvapadbhyo bhavettranah
    sangrame vijayi bhavet || 16|| sarvapago bhavet hanih ashvattham bilvam mandaram candanam dhatupancakam
    | madaram shama sugandhi kadamba navavaram pathetsukham || 17|| mantrasiddhirnavaratrena ashtaratram
    ca daivatam | pancaratre janavashyam triratram trisamahitah || 18|| dviratram vyaghrasarpanam mohanam
    mantramalika | evam hridayam martandam patham shubhakulam jayah || 19|| martanda kshetra manyo va
    karma dharma sukhovaham | evam vishanti
  devanagari: अस्त्राय फट् ॥ पूर्वे श्वेताम्बरं देवं आग्नेय्यां रुद्र भैरवम् । दक्षिणे चण्डरूपाय नैरृत्यां
    क्रोधभैरवम् ॥ १॥ पश्चिमे उन्नतग्रीवं वायव्यां कालभैरवम् । उत्तरे सिद्धिं सिद्धान्तं ईशान्यां शिवकर्पूरम्
    ॥ २॥ ऊर्ध्वे कालविरूपाय अम्बरे मल्लहारिणीम् । अन्तरिक्षं सदानन्दं यळकोटिस्वरूपिणम् ॥ ३॥ एवं एकादशं
    देवं रक्षेत्त्रैलोक्य सर्वदा । विजयी सर्वकामार्थं क्षेत्रपाल महीपते ॥ ४॥ भ्रुवोर्मध्येतु ओङ्कारं द्विदले
    सहस्रभावनः । नेत्रे त्रिपुरान्तको देवो नासिके कामहारकः ॥ ५॥ मुखे मुमुक्षनाथाय कण्ठं कर्मकलामृतः ।
    हृदयं हरिलिङ्गाय स्कन्धे कर्महरिप्रियम् ॥ ६॥ पृष्ठे प्रलयरुद्राय उदरे उदयार्कजम् । मध्ये रक्षतु कारार्थी
    नाभी नारदगायते ॥ ७॥ गुह्यं गुरुपथात्माय जङ्घे जीवप्रदोऽवतु । जानुमण्डलजानाथ पदप्रासादप्राप्तये ॥ ८॥
    अङ्गुष्ठे सर्वतीर्थानि सर्वाङ्गे परमेश्वरः । एवमङ्गेषु दिव्यस्य मार्तण्डस्वरूपिणम् ॥ ९॥ प्रथमं काशिनाथाय
    द्वितीयं पञ्चलिङ्गयोः । पञ्चलिङ्गेभ्यः तृतीयं प्रेमलिङ्गाय चतुर्थं देवरूपिण्यै ॥ १०॥ पञ्चमं पञ्चप्राणाय
    षष्ठं षड्भुजक्षेमकम् । सप्तमं सपाकं सिद्धिः अष्टमं अम्बिकाप्रियम् ॥ ११॥ नवमं नागनाथं च दशमं शोषहारकम्
    । एकादशं महारुद्रं द्वादशं ज्योतिर्लिङ्गयोः ॥ १२॥ ज्योतिर्लिङ्गानि त्रयोदशं त्रियोगी च चतुर्दशं भुवनत्रयम्
    । पञ्चदशं मण्डलं पूर्वं षोडशं च समाधिने ॥ १३॥ सप्तदशं गुह्यरूपं अष्टादशं च अब्जकम् । नवदशं नैसर्गिक
    देवी तन्नो देवी प्रसन्नता ॥ १४॥ एकोनविंशति नामानि विश्वम्भरस्वरूपस्य । ज्ञानसिद्धिर्भवेत्प्राप्तिः
    एकादशं जपन् जले ॥ १५॥ स्मशाने दशवारं च सप्तवारं पठेन्नरः । दशपाठं सर्वापद्भ्यो भवेत्त्राणः सङ्ग्रामे
    विजयी भवेत् ॥ १६॥ सर्वपगो भवेत् हानिः अश्वत्थं बिल्वं मन्दारं चन्दनं धातुपञ्चकम् । मादारं शामा सुगन्धि
    कादम्बा नववारं पठेत्सुखम् ॥ १७॥ मन्त्रसिद्धिर्नवरात्रेण अष्टरात्रं च दैवतम् । पञ्चरात्रे जनवश्यं त्रिरात्रं
    त्रिसमाहितः ॥ १८॥ द्विरात्रं व्याघ्रसर्पाणां मोहनं मन्त्रमालिका । एवं हृदयं मार्तण्डं पाठं शुभकुलं
    जयः ॥ १९॥ मार्तण्ड क्षेत्र मान्यो वा कर्म धर्म सुखोवहम् । एवं विशान्ति
