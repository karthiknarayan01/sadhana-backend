id: gita-18-66-sarva-dharman
category: gita_shloka
name:
  english: Sarva Dharman Parityajya
  devanagari: सर्वधर्मान्परित्यज्य
content:
  english: >-
    sarva-dharman parityajya mam ekam sharanam vraja, aham tvam
    sarva-papebhyo mokshayishyami ma shuchah
  devanagari: >-
    सर्वधर्मान्परित्यज्य मामेकं शरणं व्रज । अहं त्वां सर्वपापेभ्यो
    मोक्षयिष्यामि मा शुचः ॥
meaning:
  english: >-
    Abandon all varieties of duty and surrender unto Me alone; I will
    liberate you from all sinful reactions — do not fear. Often called
    the Gita's charama shloka, its closing instruction.
source_attribution:
  text_source: Bhagavad Gita, Chapter 18, Verse 66
  translation_source: Original paraphrase written for Sadhana
  license: original_translation
