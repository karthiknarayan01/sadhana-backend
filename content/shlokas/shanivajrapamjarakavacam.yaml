id: shanivajrapamjarakavacam
category: stotram
name:
  english: shanivajrapamjarakavacam
  devanagari: शनिवज्रपंजरकवचम्
content:
  english: shriganeshaya namah nilambaro nilavapuh kiriti gridhasthitastrasakaro dhanushman| caturbhujah
    suryasutah prasannah sada mama syadvaradah prashantah||1|| brahma uvaca|| shrunudhvamrishayah sarve
    shanipidaharam mahat| kavacam shanirajasya saureridamanuttamam ||2|| kavacam devatavasa vajrapamjarasamjnakam
    | shanaishcarapritikaram sarvasaubhagyadayakam ||3|| om shiro shanaishcarah patu bhalam me suryanamdanah
    | netre chayatmajah patu patu karnau yamanujah ||4|| nasam vaivasvatah patu mukham me bhaskarah sada
    | snigdhakamthashca me kamtham bhujau patu mahabhujah ||5|| skamdhau patu shanishcaiva karau patu
    shubhapradah | vakshah patu yamabhrata kukshim patvasitastatha ||6|| nabhim grahapatih patu mamdah
    patu katim tatha | uru mamamtakah patu yamo januyugam tatha||7|| padau mamdagatih patu sarvamgam patu
    pippalah| angopangani sarvani rakshen me suryanamdanah ||8|| ityetatkavacam divyam pathetsuryasutasẏa
    yah| na tasya jayate pida prito bhavati suryajah||9|| vyayajanmavditiyastho mrityusthanagato'pi va
    | kalatrastho gato vapi supritastu sada shanih ||10|| ashtamasthe suryasute vyaye janmavditiyage |
    kavacam pathate nityam na pida jayate kvacita ||11|| ityetatkavacam divyam saureryannirmitam pura
    | vdadashashtamajanmasthadoshannashayate sada | janmalagnasthitan doshan sarvannashayate prabhuh ||12||
    || iti shribrahmandapurane brahmanaradasamvade shanivajrapamjarakavacam sampurnam ||
  devanagari: श्रीगणेशाय नमः नीलांबरो नीलवपुः किरीटी गृधस्थितस्त्रासकरो धनुष्मान्। चतुर्भुजः सूर्यसुतः
    प्रसन्नः सदा मम स्याद्वरदः प्रशान्तः॥१॥ ब्रह्मा उवाच॥ श्रुणुध्वमृषयः सर्वे शनिपीडाहरं महत्। कवचं शनिराजस्य
    सौरेरिदमनुत्तमम् ॥२॥ कवचं देवतावास वज्रपंजरसंज्ञकम् । शनैश्चरप्रीतिकरं सर्वसौभाग्यदायकम् ॥३॥ ॐ शिरो
    शनैश्चरः पातु भालं मे सूर्यनंदनः । नेत्रे छायात्मजः पातु पातु कर्णौ यमानुजः ॥४॥ नासां वैवस्वतः पातु
    मुखं मे भास्करः सदा । स्निग्धकंठश्च मे कंठं भुजौ पातु महाभुजः ॥५॥ स्कंधौ पातु शनिश्चैव करौ पातु शुभप्रदः
    । वक्षः पातु यमभ्राता कुक्षिं पात्वसितस्तथा ॥६॥ नाभिं ग्रहपतिः पातु मंदः पातु कटिं तथा । ऊरू ममांतकः
    पातु यमो जानुयुगं तथा॥७॥ पादौ मंदगतिः पातु सर्वांगं पातु पिप्पलः। अङ्गोपाङ्गानि सर्वाणि रक्षेन् मे
    सूर्यनंदनः ॥८॥ इत्येतत्कवचं दिव्यं पठेत्सूर्यसुतस्य़ यः। न तस्य जायते पीडा प्रीतो भवति सूर्यजः॥९॥
    व्ययजन्मव्दितियस्थो मृत्युस्थानगतोऽपि वा । कलत्रस्थो गतो वापि सुप्रीतस्तु सदा शनिः ॥१०॥ अष्टमस्थे
    सूर्यसुते व्यये जन्मव्दितीयगे । कवचं पठते नित्यं न पीडा जायते क्वचित ॥११॥ इत्येतत्कवचं दिव्यं सौरेर्यन्निर्मितं
    पुरा । व्दादशाष्टमजन्मस्थदोषान्नाशयते सदा । जन्मलग्नस्थितान् दोषान् सर्वान्नाशयते प्रभुः ॥१२॥ ॥ इति
    श्रीब्रह्माण्डपुराणे ब्रह्मनारदसंवादे शनिवज्रपंजरकवचं संपूर्णम् ॥
