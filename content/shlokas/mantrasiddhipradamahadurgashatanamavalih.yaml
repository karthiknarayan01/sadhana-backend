id: mantrasiddhipradamahadurgashatanamavalih
category: mantra
name:
  english: mantrasiddhipradamahadurgashatanamavalih
  devanagari: मन्त्रसिद्धिप्रदमहादुर्गाशतनामावलिः
content:
  english: mantrasiddhipradamahadurgashatanamavalih om durgayai namah | bhavanyai | deveshyai | vishvanathapriyayai
    | shivayai | ghoradamshtrakaralasyayai | mundamalavibhushitayai | rudranyai | tarinyai | tarayai |
    maheshyai | bhavavallabhayai | narayanyai | jagaddhatryai | mahadevapriyayai | jayayai | vijayayai
    | jayaradhyayai | sharvanyai | haravallabhayai namah | 20 om asitayai namah | animadevyai | laghimayai
    | garimayai | maheshashaktyai | vishveshyai | gauryai | parvatanandinyai | nityayai | nishkalankayai
    | nirihayai | nityanutanayai | raktayai | raktamukhyai | vanyai | vastuyuktayai | samaprabhayai |
    yashodayai | radhikayai | candyai namah | 40 om draupadyai namah | rukminyai | guhapriyayai | guharatayai
    | guhavamshavilasinyai | ganeshajananyai | matre | vishvarupayai | jahnavyai | gangayai | kalyai |
    kashyai | bhairavyai | bhuvaneshvaryai | nirmalayai | sugandhayai | devakyai | devapujitayai | dakshajayai
    | dakshinayai namah | 60 om dakshayai namah | dakshayajnavinashinyai | sushilayai | sundaryai | saumyayai
    | matangyai | kamalatmikayai | nishumbhanashinyai | shumbhanashinyai | candanashinyai | dhumralocanasamharyai
    | mahishasuramardinyai | umayai | gauryai | karalayai | kaminyai | vishvamohinyai | jagadishapriyayai
    | janmanashinyai | bhavanashinyai namah | 80 om ghoravaktrayai namah | lalajjihvayai | attahasayai
    | digambarayai | bharatyai | svaragatayai | devyai | bhogadayai | mokshadayinyai namah | 89 iti mantrasiddhipradamahadurgashtottarashatanamavalih
    sampurna | mundamalatantrantargatam caturthe patale shlokah 10
  devanagari: मन्त्रसिद्धिप्रदमहादुर्गाशतनामावलिः ॐ दुर्गायै नमः । भवान्यै । देवेश्यै । विश्वनाथप्रियायै
    । शिवायै । घोरदंष्ट्राकरालास्यायै । मुण्डमालाविभूषितायै । रुद्राण्यै । तारिण्यै । तारायै । माहेश्यै
    । भववल्लभायै । नारायण्यै । जगद्धात्र्यै । महादेवप्रियायै । जयायै । विजयायै । जयाराध्यायै । शर्वाण्यै
    । हरवल्लभायै नमः । २० ॐ असितायै नमः । अणिमादेव्यै । लघिमायै । गरिमायै । महेशशक्त्यै । विश्वेश्यै ।
    गौर्यै । पर्वतनन्दिन्यै । नित्यायै । निष्कलङ्कायै । निरीहायै । नित्यनूतनायै । रक्तायै । रक्तमुख्यै
    । वाण्यै । वस्तुयुक्तायै । समप्रभायै । यशोदायै । राधिकायै । चण्ड्यै नमः । ४० ॐ द्रौपद्यै नमः । रुक्मिण्यै
    । गुहप्रियायै । गुहरतायै । गुहवंशविलासिन्यै । गणेशजनन्यै । मात्रे । विश्वरूपायै । जाह्नव्यै । गङ्गायै
    । काल्यै । काश्यै । भैरव्यै । भुवनेश्वर्यै । निर्मलायै । सुगन्धायै । देवक्यै । देवपूजितायै । दक्षजायै
    । दक्षिणायै नमः । ६० ॐ दक्षायै नमः । दक्षयज्ञविनाशिन्यै । सुशीलायै । सुन्दर्यै । सौम्यायै । मातङ्ग्यै
    । कमलात्मिकायै । निशुम्भनाशिन्यै । शुम्भनाशिन्यै । चण्डनाशिन्यै । धूम्रलोचनसंहार्यै । महिषासुरमर्दिन्यै
    । उमायै । गौर्यै । करालायै । कामिन्यै । विश्वमोहिन्यै । जगदीशप्रियायै । जन्मनाशिन्यै । भवनाशिन्यै
    नमः । ८० ॐ घोरवक्त्रायै नमः । ललज्जिह्वायै । अट्टहासायै । दिगम्बरायै । भारत्यै । स्वरगतायै । देव्यै
    । भोगदायै । मोक्षदायिन्यै नमः । ८९ इति मन्त्रसिद्धिप्रदमहादुर्गाष्टोत्तरशतनामावलिः सम्पूर्णा । मुण्डमालातन्त्रान्तर्गतं
    चतुर्थे पटले श्लोकाः १०
