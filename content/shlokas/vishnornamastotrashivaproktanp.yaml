id: vishnornamastotrashivaproktanp
category: stotram
name:
  english: vishnornamastotrashivaproktanP
  devanagari: विष्णोर्नामस्तोत्रशिवप्रोक्तण्P
content:
  english: shrivishnorstotram shivaproktam narasimhapurane markandeya uvaca varahah kathito hyevam pradurbhavo
    harestava | sampratam narasimham tu pravakshyami nibodha me || 1|| diteh putro mahanasiddhiranyakashipuh
    pura | tapastepe niraharo bahuvarshasahasrakam || 2|| tapatastasya samtushto brahma tam praha danavam
    | varam varaya daityendra yaste manasi vartate || 3|| ityukto brahmana daityo hiranyakashipuh pura
    | uvaca natva devesham brahmanam vinayanvitah || 4|| hiranyakashipuruvaca yadi tvam varadanaya pravritto
    bhagavanmama | yadyadavrinomyaham brahmamstattanme datumarhasi || 5|| na shushkena na cadremna na
    jalena na vahnina | na kashthena na kitena pashanena na vayuna || 6|| nayudhena na shulena na shailena
    na manushaih | na surairasurairvapi na gandharvairna rakshasaih || 7|| na kimnarairna yakshaistu vidyadharabhujamgamaih
    | na vanarairmrigairvapi naiva matriganairapi || 8|| nabhyantare na bahye tu nanyairmaranahetubhih
    | na dine na ca naktam me tvatprasadad bhavenmritih || 9|| iti vai devadevesham varam tvatto vrinomyaham
    | markandeya uvaca ityukto daityarajena brahma tam praha parthiva || 10|| tapasa tava tushto'ham mahata
    tu varaniman | durlabhanapi daityendra dadami paramadbhutan || 11|| anyesham nedrisham dattam na tairittham
    tapah kritam | tvatprarthitam maya dattam sarvam te castu daityapa || 12|| gaccha bhunkshva mahabaho
    tapasamurjitam phalam | ityevam daityarajasya hiranyakashipoh pura || 13|| dattva varan yayau brahma
    brahmalokamanuttamam | so'pi labdhavaro daityo balavan baladarpitah || 14|| devan simhan rane jitva
    divah pracyavayad bhuvi | divi rajyam svayam cakre sarvashaktisamanvitam || 15|| deva api bhayattasya
    rudrashcaivarshayo nripa | viceruravanau sarve bibhrana manushim tanum || 16|| praptatrailokyarajyo'sau
    hiranyakashipuh prajah | ahuya sarva rajendra vakyam cedamabhashata || 17|| na yashtavyam na hotavyam
    na datavyam suran prati | yushmabhirahamevadya trailokyadhipatih prajah || 18|| mamaiva pujam kuruta
    yajnadanadikarmana | tashca sarvastatha cakrurdaityendrasya bhayannripa || 19|| yatraivam kriyamaneshu
    trailokyam sacaracaram | adharmayuktam sakalam babhuva nripasattama || 20|| svadharmalopat sarvesham
    pape matirajayata | gate kale tu mahati devah sendra brihaspatim || 21|| nitijnam sarvashastrajnam
    papracchurvinayanvitah | hiranyakashiporasya vinasham munisattama || 22|| trailokyaharinah shighram
    vadhopayam vadasva nah | brihaspatiruvaca sha
  devanagari: श्रीविष्णोर्स्तोत्रं शिवप्रोक्तं नरसिंहपुराणे मार्कण्डेय उवाच वाराहः कथितो ह्येवं प्रादुर्भावो
    हरेस्तव । साम्प्रतं नारसिंहं तु प्रवक्ष्यामि निबोध मे ॥ १॥ दितेः पुत्रो महानासीद्धिरण्यकशिपुः पुरा
    । तपस्तेपे निराहारो बहुवर्षसहस्रकम् ॥ २॥ तपतस्तस्य संतुष्टो ब्रह्मा तं प्राह दानवम् । वरं वरय दैत्येन्द्र
    यस्ते मनसि वर्तते ॥ ३॥ इत्युक्तो ब्रह्मणा दैत्यो हिरण्यकशिपुः पुरा । उवाच नत्वा देवेशं ब्रह्माणं विनयान्वितः
    ॥ ४॥ हिरण्यकशिपुरुवाच यदि त्वं वरदानाय प्रवृत्तो भगवन्मम । यद्यदवृणोम्यहं ब्रह्मंस्तत्तन्मे दातुमर्हसि
    ॥ ५॥ न शुष्केण न चाद्रेंण न जलेन न वह्निना । न काष्ठेन न कीटेन पाषाणेन न वायुना ॥ ६॥ नायुधेन न शूलेन
    न शैलेन न मानुषैः । न सुरैरसुरैर्वापि न गन्धर्वैर्न राक्षसैः ॥ ७॥ न किंनरैर्न यक्षैस्तु विद्याधरभुजंगमैः
    । न वानरैर्मृगैर्वापि नैव मातृगणैरपि ॥ ८॥ नाभ्यन्तरे न बाह्ये तु नान्यैर्मरणहेतुभिः । न दिने न च नक्तं
    मे त्वत्प्रसादाद् भवेन्मृतिः ॥ ९॥ इति वै देवदेवेशं वरं त्वत्तो वृणोम्यहम् । मार्कण्डेय उवाच इत्युक्तो
    दैत्यराजेन ब्रह्मा तं प्राह पार्थिव ॥ १०॥ तपसा तव तुष्टोऽहं महता तु वरानिमान् । दुर्लभानापि दैत्येन्द्र
    ददामि परमाद्भुतान् ॥ ११॥ अन्येषां नेदृशं दत्तं न तैरित्थं तपः कृतम् । त्वत्प्रार्थितं मया दत्तं सर्वं
    ते चास्तु दैत्यप ॥ १२॥ गच्छ भुङ्क्ष्व महाबाहो तपसामूर्जितं फलम् । इत्येवं दैत्यराजस्य हिरण्यकशिपोः
    पुरा ॥ १३॥ दत्त्वा वरान् ययौ ब्रह्मा ब्रह्मलोकमनुत्तमम् । सोऽपि लब्धवरो दैत्यो बलवान् बलदर्पितः ॥
    १४॥ देवान् सिंहान् रणे जित्वा दिवः प्राच्यावयद् भुवि । दिवि राज्यं स्वयं चक्रे सर्वशक्तिसमन्वितम्
    ॥ १५॥ देवा अपि भयात्तस्य रुद्राश्चैवर्षयो नृप । विचेरुरवनौ सर्वे बिभ्राणा मानुषीं तनुम् ॥ १६॥ प्राप्तत्रैलोक्यराज्योऽसौ
    हिरण्यकशिपुः प्रजाः । आहूय सर्वा राजेन्द्र वाक्यं चेदमभाषत ॥ १७॥ न यष्टव्यं न होतव्यं न दातव्यं सुरान्
    प्रति । युष्माभिरहमेवाद्य त्रैलोक्याधिपतिः प्रजाः ॥ १८॥ ममैव पूजां कुरुत यज्ञदानादिकर्मणा । ताश्च
    सर्वास्तथा चक्रुर्दैत्येन्द्रस्य भयान्नृप ॥ १९॥ यत्रैवं क्रियमाणेषु त्रैलोक्यं सचराचरम् । अधर्मयुक्तं
    सकलं बभूव नृपसत्तम ॥ २०॥ स्वधर्मलोपात् सर्वेषां पापे मतिरजायत । गते काले तु महति देवाः सेन्द्रा बृहस्पतिम्
    ॥ २१॥ नीतिज्ञं सर्वशास्त्रज्ञं पप्रच्छुर्विनयान्विताः । हिरण्यकशिपोरस्य विनाशं मुनिसत्तम ॥ २२॥ त्रैलोक्यहारिणः
    शीघ्रं वधोपायं वदस्व नः । बृहस्पतिरुवाच श
