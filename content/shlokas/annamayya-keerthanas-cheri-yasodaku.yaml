id: annamayya-keerthanas-cheri-yasodaku
category: stotram
name:
  english: Annamayya Keerthanas Cheri Yasodaku
content:
  english: adi pallavi ceri yashodaku shishu vitadu dharuni brahmaku tandriyu nitadu || sòlasi cucinanu
    suryacandrulanu lali vèdacallèdulakshanudu | nilicinaniluvuna nikhiladevatala kaligincu suralaganivo
    yitadu | ceri yashodaku shishu vitadu mataladinanu mariyajandamulu kotulu vodametigunarashi | nitagunurpula
    nikhilavedamulu catuvanu retisamudra mitadu || ceri yashodaku shishu vitadu mungita jòlasina mohana
    matmala bònginceghanapurushudu | sangati mavantisharanagatulaku nangamu shrivenkatadhipu ditadu ||
    ceri yashodaku shishu vitadu
  devanagari: आदि पल्लवि चेरि यशोदकु शिशु वितडु धारुणि ब्रह्मकु तण्ड्रियु नितडु ॥ सॊलसि चूचिननु सूर्यचन्द्रुलनु
    ललि वॆदचल्लॆडुलक्षणुडु । निलिचिननिलुवुन निखिलदेवतल कलिगिञ्चु सुरलगनिवो यितडु । चेरि यशोदकु शिशु वितडु
    माटलाडिननु मरियजाण्डमुलु कोटुलु वोडमेटिगुणराशि । नीटगुनूर्पुल निखिलवेदमुलु चाटुवनू रेटिसमुद्र मितडु
    ॥ चेरि यशोदकु शिशु वितडु मुङ्गिट जॊलसिन मोहन मात्मल बॊङ्गिञ्चेघनपुरुषुडु । सङ्गति मावण्टिशरणागतुलकु
    नङ्गमु श्रीवेङ्कटाधिपु डितडु ॥ चेरि यशोदकु शिशु वितडु
