id: raghavendramantravidhivarnanam
category: mantra
name:
  english: raghavendramantravidhivarnanam
  devanagari: राघवेन्द्रमन्त्रविधिवर्णनम्
content:
  english: vina tu hridayam shadbhih varnairangamudahritam | dviravrittaih mantrapadaih shadanganyathava
    viduh || 12|| taireva tu dviravrittaih kramavatkramato'thava | taptakancanasankashamakshamalam kamandalum
    || 13|| dordhyam dadhanam kashayavasanam ramamanasam | yogindratirthavandyanghrim tulasidamavakshasam
    || 14|| jnanabhaktitapahpurnam dhyayet sarvarthasiddhaye | mantrenaiva prakartavyam disham bandhashca
    mocanam || 15|| lakshanyashtau dvadasha va purashcaryaparo japet | anyo va'shtottarashatam sahasram
    pratyaham japet || 16|| kritakritam ca homadi parastrivimukho bhavet | brahmanaradhanam mukhyam yathashakti
    rinam vina || 17|| anganyase dvitiye tu dhyanam vakshyami sadguroh | shriraghavendroparipadakanjanishevanallabdhasamastasampat
    || 18|| devasvabhavo divijadrumo'yamishtaprado me satatam sa bhuyat | nyase tritiye dhyanam tu pujapatala
    ucyate || 19|| agnih sudirghabindushcenmanurekaksharo'parah | shaddirghasvarayuktena tenaiva syat
    shadangakam | nicridgayatrikanushtup chandasi etadadyayoh || 20|| shriraghavendrah sakalapradata svapadakanjadvayabhaktimaddhyah
    | aghadrisambhedanadrishtivajrakshama surendro'vatu mam sada'yam || 21|| dve lakshe va'shtalakshani
    purashcara japo matah | imau mantrau mantrarajau mukhyamapannivarakau || 22|| jayapradau ca vaksiddhipradau
    putradikapradau | kalau pratyakshaphaladau shighrameva dhanapradau || 23|| rinapaharako rajacorapidadishamakau
    | jananuragi lokaishca pujyo bhavati japakah || 24|| jnanavan vakpaturdaivashali dirghayuruttamah
    | kshemavan kavitashastragoshthishu ca vicakshanah || 25|| balavan rupasampanno nirmalatma subhaktiman
    | kalatraputrabandhunamanukulyam ca vindati || 26|| shatruvashyam bhavettasya sarvasaubhagyavardhanam
    | vedantaparagah kirtisampannah sudayanvitah || 27|| shantakrodho nirmalatma sarvadevapriyo bhavet
    | vairagyavan mahatyagi bhogi dharmavicakshanah | kanyam lakshanasampannam prapnoti shriyamuttamam
    || 28|| kimatra bahunoktena gururajakripabalat | sa bhavet siddhasankalpah sarvarogavivarjitah ||
    29|| bhagavat jnanabhaktibhyam bhuktim muktim ca vindati | snatva nityahnikam kritva vrindavana gatam
    gurum || 30 || athava padukayam ca yantre va'vahayan jale | appanaryakritastutya snapayitva shucih
    sthirah || 31|| japet pashcat appanaryanamamantram japedyatha | shri appanaryaya nama itthamashtaksharo
    manuh || 32|| yogindratirthavandyani tulasidamavakshasam | jnanabhaktih tapah purnam dhyayet sarvarthasiddhaye
    || 33|| shriraghavendragurvatrisamsaktadhishanagranih | appannaryagururbhuyadasmadishtarthasiddhaye
    || 34|| anganyasadinasyasti shatam va dasha va japet | maladigasanadini prasiddhanyeva lokatah ||
    35|| anena gururajasya mantrah shighrena sidhyati | ram bijam vilikhet purvam trikonam tvekarekhaya
    || 36|| vartulam veshtayitva'tha padmamashtadalam likhet | taddaleshu kramanmantravarnani vilikhedbudhah
    || 37|| rekhabhyam bhupuram dvabhyamashtadikshu shriyam likhet | tribhiravaranairyuktam pujayantramidam
    guroh || 38|| sadhyarnan vilikhet dharye trikone bijasampute | evam mantrena yantrena gururajaprasadajaih
    || 39|| manorathaih samriddhah syadaneke santi sakshinah | svanubhutam caha sakshadavadhuto guroh
    sutah || 40 || satatavimalagatram sadgunanamamantram duritatrinalavitram durmatadhvantamitram | bhaja
    kabharabahitram mamakapranamitram gurumatulacaritram naumi mam patu putram || 41|| iti shrimatkrishnavadhutapanditakritau
    shriraghavendratantre shriraghavendramantravidhivarnanam nama dvitiyapatalah sampurnah |
  devanagari: विना तु हृदयं षड्भिः वर्णैरङ्गमुदाहृतम् । द्विरावृत्तैः मन्त्रपदैः षडङ्गान्यथवा विदुः ॥
    १२॥ तैरेव तु द्विरावृत्तैः क्रमवत्क्रमतोऽथवा । तप्तकाञ्चनसङ्काशमक्षमालां कमण्डलुम् ॥ १३॥ दोर्ध्यां
    दधानं काषायवसनं राममानसम् । योगीन्द्रतीर्थवन्द्याङ्घ्रिं तुलसीदामवक्षसम् ॥ १४॥ ज्ञानभक्तितपःपूर्णं
    ध्यायेत् सर्वार्थसिद्धये । मन्त्रेणैव प्रकर्तव्यं दिशां बन्धश्च मोचनम् ॥ १५॥ लक्षाण्यष्टौ द्वादश वा
    पुरश्चर्यापरो जपेत् । अन्यो वाऽष्टोत्तरशतं सहस्रं प्रत्यहं जपेत् ॥ १६॥ कृताकृतं च होमादि परस्त्रीविमुखो
    भवेत् । ब्राह्मणाराधनं मुख्यं यथाशक्ति ऋणं विना ॥ १७॥ अङ्गन्यासे द्वितीये तु ध्यानं वक्ष्यामि सद्गुरोः
    । श्रीराघवेन्द्रोपरिपादकञ्जनिषेवणाल्लब्धसमस्तसम्पत् ॥ १८॥ देवस्वभावो दिविजद्रुमोऽयमिष्टप्रदो मे सततं
    स भूयात् । न्यासे तृतीये ध्यानं तु पूजापटल उच्यते ॥ १९॥ अग्निः सुदीर्घबिन्दुश्चेन्मनुरेकाक्षरोऽपरः
    । षड्दीर्घस्वरयुक्तेन तेनैव स्यात् षडङ्गकम् । निचृद्गायत्रीकानुष्टुप् छन्दसी एतदाद्ययोः ॥ २०॥ श्रीराघवेन्द्रः
    सकलप्रदाता स्वपादकञ्जद्वयभक्तिमद्ध्यः । अघाद्रिसम्भेदनदृष्टिवज्रक्षमा सुरेन्द्रोऽवतु मां सदाऽयम् ॥
    २१॥ द्वे लक्षे वाऽष्टलक्षाणि पुरश्चरा जपो मतः । इमौ मन्त्रौ मन्त्रराजौ मुख्यमापन्निवारकौ ॥ २२॥ जयप्रदौ
    च वाक्सिद्धिप्रदौ पुत्रादिकप्रदौ । कलौ प्रत्यक्षफलदौ शीघ्रमेव धनप्रदौ ॥ २३॥ ऋणापहारको राजचोरपीडादिशामकौ
    । जनानुरागी लोकैश्च पूज्यो भवति जापकः ॥ २४॥ ज्ञानवान् वाक्पटुर्दैवशाली दीर्घायुरुत्तमः । क्षेमवान्
    कविताशास्त्रगोष्ठीषु च विचक्षणः ॥ २५॥ बलवान् रूपसम्पन्नो निर्मलात्मा सुभक्तिमान् । कलत्रपुत्रबन्धूनामानुकूल्यं
    च विन्दति ॥ २६॥ शत्रुवश्यं भवेत्तस्य सर्वसौभाग्यवर्धनम् । वेदान्तपारगः कीर्तिसम्पन्नः सुदयान्वितः
    ॥ २७॥ शान्तक्रोधो निर्मलात्मा सर्वदेवप्रियो भवेत् । वैराग्यवान् महात्यागी भोगी धर्मविचक्षणः । कन्यां
    लक्षणसम्पन्नां प्राप्नोति श्रियमुत्तमाम् ॥ २८॥ किमत्र बहुनोक्तेन गुरुराजकृपाबलात् । स भवेत् सिद्धसङ्कल्पः
    सर्वरोगविवर्जितः ॥ २९॥ भगवत् ज्ञानभक्तिभ्यां भुक्तिं मुक्तिं च विन्दति । स्नात्वा नित्याह्निकं कृत्वा
    वृन्दावन गतं गुरुम् ॥ ३० ॥ अथवा पादुकायां च यन्त्रे वाऽवाहयन् जले । अप्पणार्यकृतस्तुत्या स्नापयित्वा
    शुचिः स्थिरः ॥ ३१॥ जपेत् पश्चात् अप्पणार्यनाममन्त्रं जपेद्यथा । श्री अप्पणार्याय नम इत्थमष्टाक्षरो
    मनुः ॥ ३२॥ योगीन्द्रतीर्थवन्द्यानि तुलसीदामवक्षसम् । ज्ञानभक्तिः तपः पूर्णं ध्यायेत् सर्वार्थसिद्धये
    ॥ ३३॥ श्रीराघवेन्द्रगुर्वत्रिसंसक्तधिषणाग्रणीः । अप्पण्णार्यगुरुर्भूयादस्मदिष्टार्थसिद्धये ॥ ३४॥ अङ्गन्यासादिनास्यास्ति
    शतं वा दश वा जपेत् । मालादिगासनादीनि प्रसिद्धान्येव लोकतः ॥ ३५॥ अनेन गुरुराजस्य मन्त्रः शीघ्रेण सिध्यति
    । रां बीजं विलिखेत् पूर्वं त्रिकोणं त्वेकरेखया ॥ ३६॥ वर्तुलं वेष्टयित्वाऽथ पद्ममष्टदलं लिखेत् । तद्दलेषु
    क्रमान्मन्त्रवर्णानि विलिखेद्बुधः ॥ ३७॥ रेखाभ्यां भूपुरं द्वाभ्यामष्टदिक्षु श्रियं लिखेत् । त्रिभिरावरणैर्युक्तं
    पूजायन्त्रमिदं गुरोः ॥ ३८॥ साध्यार्णान् विलिखेत् धार्ये त्रिकोणे बीजसम्पुटे । एवं मन्त्रेण यन्त्रेण
    गुरुराजप्रसादजैः ॥ ३९॥ मनोरथैः समृद्धः स्यादनेके सन्ति साक्षिणः । स्वानुभूतं चाह साक्षादवधूतो गुरोः
    सुतः ॥ ४० ॥ सततविमलगात्रं सद्गुणानाममन्त्रं दुरिततृणलवित्रं दुर्मतध्वान्तमित्रम् । भज कभरबहित्रं मामकप्राणमित्रं
    गुरुमतुलचरित्रं नौमि मां पातु पुत्रम् ॥ ४१॥ इति श्रीमत्कृष्णावधूतपण्डितकृतौ श्रीराघवेन्द्रतन्त्रे
    श्रीराघवेन्द्रमन्त्रविधिवर्णनं नाम द्वितीयपटलः सम्पूर्णः ।
