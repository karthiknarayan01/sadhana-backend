id: bruhaspati-kavacham-guru-kavacham
category: stotram
name:
  english: Bruhaspati Kavacham (Guru Kavacham)
content:
  english: asya shribrihaspati kavacamaha mantrasya brihaspati prasada siddhyarthe jape viniyogah || dhyanam
    abhishtaphaladam vande sarvajnam surapujitam | akshamaladharam shantam pranamami brihaspatim || atha
    brihaspati kavacam brihaspatih shirah patu lalatam patu me guruh | karnau suraguruh patu netre mebhishtadayakah
    || || jihvam patu suracaryah nasam me vedaparagah | mukham me patu sarvajnah kantham me devataguruh
    || || bhuja vangirasah patu karau patu shubhapradah | stanau me patu vagishah kukshim me shubhalakshanah
    || || nabhim devaguruh patu madhyam patu sukhapradah | katim patu jagadvandyah uru me patu vakpatih
    || || janujanghe suracaryah padau vishvatmakah sada | anyani yani cangani rakshenme sarvato guruh
    || || phalashritih ityetatkavacam divyam trisandhyam yah pathennarah | sarvan kamanavapnoti sarvatra
    vijayi bhavet || || iti shri brihaspati kavacam ||
  devanagari: अस्य श्रीबृहस्पति कवचमहा मन्त्रस्य बृहस्पति प्रसाद सिद्ध्यर्थे जपे विनियोगः ॥ ध्यानम् अभीष्टफलदं
    वन्दे सर्वज्ञं सुरपूजितम् । अक्षमालाधरं शान्तं प्रणमामि बृहस्पतिम् ॥ अथ बृहस्पति कवचम् बृहस्पतिः शिरः
    पातु ललाटं पातु मे गुरुः । कर्णौ सुरगुरुः पातु नेत्रे मेभीष्टदायकः ॥ ॥ जिह्वां पातु सुराचार्यः नासं
    मे वेदपारगः । मुखं मे पातु सर्वज्ञः कण्ठं मे देवतागुरुः ॥ ॥ भुजा वङ्गीरसः पातु करौ पातु शुभप्रदः ।
    स्तनौ मे पातु वागीशः कुक्षिं मे शुभलक्षणः ॥ ॥ नाभिं देवगुरुः पातु मध्यं पातु सुखप्रदः । कटिं पातु
    जगद्वन्द्यः ऊरू मे पातु वाक्पतिः ॥ ॥ जानुजङ्घे सुराचार्यः पादौ विश्वात्मकः सदा । अन्यानि यानि चाङ्गानि
    रक्षेन्मे सर्वतो गुरुः ॥ ॥ फलशृतिः इत्येतत्कवचं दिव्यं त्रिसन्ध्यं यः पठेन्नरः । सर्वान् कामानवाप्नोति
    सर्वत्र विजयी भवेत् ॥ ॥ इति श्री बृहस्पति कवचम् ॥
