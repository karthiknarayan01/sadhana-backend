id: sri-vighnesvara-ashtottara-sata-namavali
category: stotram
name:
  english: Sri Vighnesvara Ashtottara Sata Namavali
content:
  english: om vinayakaya namah om vighnarajaya namah om gauriputraya namah om ganeshvaraya namah om skandagrajaya
    namah om avyayaya namah om putaya namah om dakshaya namah om adhyakshaya namah om dvijapriyaya namah
    om agnigarbhacchide namah om indrashripradaya namah om vanipradaya namah om avyayaya namah om sarvasiddhipradaya
    namah om sharvatanayaya namah om sharvaripriyaya namah om sarvatmakaya namah om srishtikartre namah
    om devaya namah om anekarcitaya namah om shivaya namah om shuddhaya namah om buddhipriyaya namah om
    shantaya namah om brahmacarine namah om gajananaya namah om dvaimatreyaya namah om munistutyaya namah
    om bhaktavighnavinashanaya namah om ekadantaya namah om caturbahave namah om caturaya namah om shaktisamyutaya
    namah om lambodaraya namah om shurpakarnaya namah om haraye namah om brahmaviduttamaya namah om kalaya
    namah om grahapataye namah om kamine namah om somasuryagnilocanaya namah om pashankushadharaya namah
    om candaya namah om gunatitaya namah om niranjanaya namah om akalmashaya namah om svayamsiddhaya namah
    om siddharcitapadambujaya namah om bijapuraphalasaktaya namah om varadaya namah om shashvataya namah
    om kritine namah om vidvat priyaya namah om vitabhayaya namah om gadine namah om cakrine namah om
    ikshucapadhrite namah om shridaya namah om ajaya namah om utpalakaraya namah om shriprataye namah
    om stutiharshitaya namah om kuladribhettre namah om jatilaya namah om kalikalmashanashanaya namah
    om candracudamanaye namah om kantaya namah om papaharine namah om samahitaya namah om ashritaya namah
    om shrikaraya namah om saumyaya namah om bhaktavanchitadayakaya namah om shantaya namah om kaivalyasukhadaya
    namah om saccidanandavigrahaya namah om jnanine namah om dayayutaya namah om dantaya namah om brahmadveshavivarjitaya
    namah om pramattadaityabhayataya namah om shrikanthaya namah om vibudheshvaraya namah om ramarcitaya
    namah om nidhaye namah om nagarajayajnopavitavate namah om sthulakanthaya namah om svayankartre namah
    om samaghoshapriyaya namah om parasmai namah om sthulatundaya namah om agranye namah om dhiraya namah
    om vagishaya namah om siddhidayakaya namah om durvabilvapriyaya namah om avyaktamurtaye namah om adbhutamurtimate
    namah om shailendra tanujotsangakhelanotsuka manasaya namah om svalavanyasutasarajitamanmathavigrahaya
    namah om samastajagadadharaya namah om mayine namah om mushikavahanaya namah om hrishtaya namah om
    tushtaya namah om prasannatmane namah om sarvasiddhipradayakaya namah iti shrivighneshvarashtottara
    shatanamavalih sampurna
