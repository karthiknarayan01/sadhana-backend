id: mukunda-mala-stotram
category: stotram
name:
  english: Mukunda Mala Stotram
content:
  english: ghushyate yasya nagare rangayatra dine dine | tamaham shirasa vande rajanam kulashekharam ||
    shrivallabheti varadeti dayapareti bhaktapriyeti bhavalunthanakovideti | natheti nagashayaneti jagannivase
    tyalapanam pratipadam kuru me mukunda || || jayatu jayatu devo devakinandano'yam jayatu jayatu krishno
    vrishnivamshapradipah | jayatu jayatu meghashyamalah komalango jayatu jayatu prithvibharanasho mukundah
    || || mukunda murdhna pranipatya yace bhavantamekantamiyantamartham | avismritistvaccaranaravinde
    bhave bhave me'stu bhavatprasadat || || naham vande tava caranayordvandvamadvandvahetoh kumbhipakam
    gurumapi hare narakam napanetum | ramyaramamridutanulata nandane napi rantum bhave bhave hridayabhavane
    bhavayeyam bhavantam || || nastha dharme na vasunicaye naiva kamopabhoge yadyadbhavyam bhavatu bhagavan
    purvakarmanurupam | etatprarthyam mama bahumatam janmajanmantare'pi tvatpadambhoruhayugagata nishcala
    bhaktirastu || || divi va bhuvi va mamastu vaso narake va narakantaka prakamam | avadhirita sharadaravindau
    caranau te marane'pi cintayami || || krishna tvadiya padapankajapanjaranta madyaiva me vishatu manasarajahamsah
    | pranaprayanasamaye kaphavatapittaih kanthavarodhanavidhau smaranam kutaste || || cintayami harimeva
    santatam mandamanda hasitananambujam nandagopatanayam paratparam naradadimunibrindavanditam || ||
    karacaranasaroje kantimannetramine shramamushi bhujavicivyakule'gadhamarge | harisarasi vigahyapiya
    tejojalaugham bhavamaruparikhinnah khedamadya tyajami || || sarasijanayane sashankhacakre murabhidi
    ma virama svacitta rantum | sukhataramaparam na jatu jane haricaranasmaranamritena tulyam || || ma
    bhirmandamano vicintya bahudha yamishciram yatanah nami nah prabhavanti paparipavah svami nanu shridharah
    | alasyam vyapaniya bhaktisulabham dhyayasva narayanam lokasya vyasanapanodanakaro dasasya kim na
    kshamah || || bhavajaladhigatanam dvandvavatahatanam sutaduhitrikalatratranabhararditanam | vishamavishayatoye
    majjatamaplavanam bhavatu sharanameko vishnupoto naranam || || bhavajaladhimagadham dustaram nistareyam
    kathamahamiti ceto ma sma gah kataratvam | sarasijadrishi deve tavaki bhaktireka narakabhidi nishanna
    tarayishyatyavashyam || || trishnatoye madanapavanoddhuta mohormimale daravarte tanayasahajagrahasanghakule
    ca | samsarakhye mahati jaladhau majjatam nastridhaman padambhoje varada bhavato bhaktinavam prayaccha
    || || madraksham kshinapunyan kshanamapi bhavato bhaktihinanpadabje mashrausham shravyabandham tava
    caritamapasyanyadakhyanajatam | masmarsham madhava tvamapi bhuvanapate cetasapahnuvana nmabhuvam tvatsaparyavyatikararahito
    janmajanmantare'pi || || jihve kirtaya keshavam muraripum ceto bhaja shridharam panidvandva samarcayacyutakathah
    shrotradvaya tvam shrinu | krishnam lokaya locanadvaya harergacchanghriyugmalayam jighra ghrana mukundapadatulasim
    murdhannamadhokshajam || || he lokah shrinuta prasutimaranavyadheshcikitsamimam yogajnah samudaharanti
    munayo yam yajnavalkyadayah | antarjyotirameyamekamamritam krishnakhyamapiyatam tatpitam paramaushadham
    vitanute nirvanamatyantikam || | he martyah paramam hitam shrinuta vo vakshyami sankshepatah samsararnavamapadurmibahulam
    samyakpravishya sthitah | nanajnanamapasya cetasi namo narayanayetyamum mantram sapranavam pranamasahitam
    pravartayadhvam muhuh || || prithvirenuranuh payamsi kanikah phalguh sphulingo'laghu stejo nihshvasanam
    maruttanutaram randhram susukshmam nabhah | kshudra rudrapitamahaprabhritayah kitah samastah surah
    drishte yatra sa tavako vijayate bhumavadhutavadhih || || baddhenanjalina natena shirasa gatraih saromodgamaih
    kanthena svaragadgadena nayanenodgirnabashpambuna | nityam tvaccaranaravindayugala dhyanamritasvadina
    masmakam sarasiruhaksha satatam sampadyatam jivitam || || he gopalaka he kripajalanidhe he sindhukanyapate
    he kamsantaka he gajendrakarunaparina he madhava | he ramanuja he jagattrayaguro he pundarikaksha
    mam he gopijananatha palaya param janami na tvam vina || || bhaktapayabhujangagarudamanistrailokyarakshamanih
    gopilocanacatakambudamanih saundaryamudramanih | yah kantamani rukmini ghanakucadvandvaikabhushamanih
    shreyo devashikhamanirdishatu no gopalacudamanih || || shatrucchedaikamantram sakalamupanishadvakyasampujyamantram
    samsarottaramantram samupacitatamah sanghaniryanamantram | sarvaishvaryaikamantram vyasanabhujagasandashtasantranamantram
    jihve shrikrishnamantram japa japa satatam janmasaphalyamantram || || vyamoha prashamaushadham munimanovritti
    pravrittyaushadham daityendrartikaraushadham tribhuvani sanjivanaikaushadham | bhaktatyantahitaushadham
    bhavabhayapradhvamsanaikaushadham shreyahpraptikaraushadham piba manah shrikrishnadivyaushadham ||
    || amnayabhyasananyaranyaruditam vedavratanyanvaham medashchedaphalani purtavidhayah sarve hutam bhasmani
    | tirthanamavagahanani ca gajasnanam vina yatpada dvandvambhoruhasamsmritirvijayate devah sa narayanah
    || || shrimannama procya narayanakhyam ke na prapurvanchitam papino'pi | ha nah purvam vakpravritta
    na tasmin tena praptam garbhavasadiduhkham || || majjanmanah phalamidam madhukaitabhare matprarthaniya
    madanugraha esha eva | tvadbhrityabhritya paricaraka bhrityabhritya bhrityasya bhritya iti mam smara
    lokanatha || || nathe nah purushottame trijagatamekadhipe cetasa sevye svasya padasya datari sure
    narayane tishthati | yam kancitpurushadhamam katipayagrameshamalparthadam sevayai mrigayamahe naramaho
    muka varaka vayam || || madana parihara sthitim madiye manasi mukundapadaravindadhamni | haranayanakrishanuna
    krisho'si smarasi na cakraparakramam murareh || || tattvam bruvanani param parasma nmadhu ksharantiva
    satam phalani | pravartaya pranjalirasmi jihve namani narayana gocarani || || idam shariram parinamapeshalam
    patatyavashyam shlathasandhijarjaram | kimaushadhaih klishyasi mudha durmate niramayam krishnarasayanam
    piba || || dara varakaravarasuta te tanujo virincih stota vedastava suragano bhrityavargah prasadah
    | muktirmaya jagadavikalam tavaki devaki te mata mitram balaripusutastvayyato'nyanna jane || || krishno
    rakshatu no jagattrayaguruh krishnam namasyamyaham krishnenamarashatravo vinihatah krishnaya tasmai
    namah | krishnadeva samutthitam jagadidam krishnasya daso'smyaham krishne tishthati sarvametadakhilam
    he krishna rakshasva mam || || tattvam prasida bhagavan kuru mayyanathe vishno kripam paramakarunikah
    kila tvam | samsarasagaranimagnamanantadina muddhartumarhasi hare purushottamo'si || || namami narayanapadapankajam
    karomi narayanapujanam sada | vadami narayananama nirmalam smarami narayanatattvamavyayam || || shrinatha
    narayana vasudeva shrikrishna bhaktapriya cakrapane | shripadmanabhacyuta kaitabhare shrirama padmaksha
    hare murare || || ananta vaikuntha mukunda krishna govinda damodara madhaveti | vaktum samartho'pi
    na vakti kashci daho jananam vyasanabhimukhyam || || dhyayanti ye vishnumanantamavyayam hritpadmamadhye
    satatam vyavasthitam | samahitanam satatabhayapradam te yanti siddhim paramam ca vaishnavim || ||
    kshirasagaratarangashikara ''saratarakitacarumurtaye | bhogibhogashayaniyashayine madhavaya madhuvidvishe
    namah || || yasya priyau shrutidharau kavilokavirau mitre dvijanmavarapadmasharavabhutam | tenambujakshacaranambujashatpadena
    rajna krita kritiriyam kulashekharena || || iti kulashekhara pranitam mukundamala |
  devanagari: घुष्यते यस्य नगरे रङ्गयात्रा दिने दिने । तमहं शिरसा वन्दे राजानं कुलशेखरम् ॥ श्रीवल्लभेति
    वरदेति दयापरेति भक्तप्रियेति भवलुण्ठनकोविदेति । नाथेति नागशयनेति जगन्निवासे त्यालापनं प्रतिपदं कुरु
    मे मुकुन्द ॥ ॥ जयतु जयतु देवो देवकीनन्दनोऽयं जयतु जयतु कृष्णो वृष्णिवंशप्रदीपः । जयतु जयतु मेघश्यामलः
    कोमलाङ्गो जयतु जयतु पृथ्वीभारनाशो मुकुन्दः ॥ ॥ मुकुन्द मूर्ध्ना प्रणिपत्य याचे भवन्तमेकान्तमियन्तमर्थम्
    । अविस्मृतिस्त्वच्चरणारविन्दे भवे भवे मेऽस्तु भवत्प्रसादात् ॥ ॥ नाहं वन्दे तव चरणयोर्द्वन्द्वमद्वन्द्वहेतोः
    कुम्भीपाकं गुरुमपि हरे नारकं नापनेतुम् । रम्यारामामृदुतनुलता नन्दने नापि रन्तुं भावे भावे हृदयभवने
    भावयेयं भवन्तम् ॥ ॥ नास्था धर्मे न वसुनिचये नैव कामोपभोगे यद्यद्भव्यं भवतु भगवन् पूर्वकर्मानुरूपम्
    । एतत्प्रार्थ्यं मम बहुमतं जन्मजन्मान्तरेऽपि त्वत्पादाम्भोरुहयुगगता निश्चला भक्तिरस्तु ॥ ॥ दिवि वा
    भुवि वा ममास्तु वासो नरके वा नरकान्तक प्रकामम् । अवधीरित शारदारविन्दौ चरणौ ते मरणेऽपि चिन्तयामि ॥
    ॥ कृष्ण त्वदीय पदपङ्कजपञ्जरान्त मद्यैव मे विशतु मानसराजहंसः । प्राणप्रयाणसमये कफवातपित्तैः कण्ठावरोधनविधौ
    स्मरणं कुतस्ते ॥ ॥ चिन्तयामि हरिमेव सन्ततं मन्दमन्द हसिताननाम्बुजं नन्दगोपतनयं परात्परं नारदादिमुनिबृन्दवन्दितम्
    ॥ ॥ करचरणसरोजे कान्तिमन्नेत्रमीने श्रममुषि भुजवीचिव्याकुलेऽगाधमार्गे । हरिसरसि विगाह्यापीय तेजोजलौघं
    भवमरुपरिखिन्नः खेदमद्य त्यजामि ॥ ॥ सरसिजनयने सशङ्खचक्रे मुरभिदि मा विरम स्वचित्त रन्तुम् । सुखतरमपरं
    न जातु जाने हरिचरणस्मरणामृतेन तुल्यम् ॥ ॥ मा भीर्मन्दमनो विचिन्त्य बहुधा यामीश्चिरं यातनाः नामी नः
    प्रभवन्ति पापरिपवः स्वामी ननु श्रीधरः । आलस्यं व्यपनीय भक्तिसुलभं ध्यायस्व नारायणं लोकस्य व्यसनापनोदनकरो
    दासस्य किं न क्षमः ॥ ॥ भवजलधिगतानां द्वन्द्ववाताहतानां सुतदुहितृकलत्रत्राणभारार्दितानाम् । विषमविषयतोये
    मज्जतामप्लवानां भवतु शरणमेको विष्णुपोतो नराणाम् ॥ ॥ भवजलधिमगाधं दुस्तरं निस्तरेयं कथमहमिति चेतो मा
    स्म गाः कातरत्वम् । सरसिजदृशि देवे तावकी भक्तिरेका नरकभिदि निषण्णा तारयिष्यत्यवश्यम् ॥ ॥ तृष्णातोये
    मदनपवनोद्धूत मोहोर्मिमाले दारावर्ते तनयसहजग्राहसङ्घाकुले च । संसाराख्ये महति जलधौ मज्जतां नस्त्रिधामन्
    पादाम्भोजे वरद भवतो भक्तिनावं प्रयच्छ ॥ ॥ माद्राक्षं क्षीणपुण्यान् क्षणमपि भवतो भक्तिहीनान्पदाब्जे
    माश्रौषं श्राव्यबन्धं तव चरितमपास्यान्यदाख्यानजातम् । मास्मार्षं माधव त्वामपि भुवनपते चेतसापह्नुवाना
    न्माभूवं त्वत्सपर्याव्यतिकररहितो जन्मजन्मान्तरेऽपि ॥ ॥ जिह्वे कीर्तय केशवं मुररिपुं चेतो भज श्रीधरं
    पाणिद्वन्द्व समर्चयाच्युतकथाः श्रोत्रद्वय त्वं शृणु । कृष्णं लोकय लोचनद्वय हरेर्गच्छाङ्घ्रियुग्मालयं
    जिघ्र घ्राण मुकुन्दपादतुलसीं मूर्धन्नमाधोक्षजम् ॥ ॥ हे लोकाः शृणुत प्रसूतिमरणव्याधेश्चिकित्सामिमां
    योगज्ञाः समुदाहरन्ति मुनयो यां याज्ञवल्क्यादयः । अन्तर्ज्योतिरमेयमेकममृतं कृष्णाख्यमापीयतां तत्पीतं
    परमौषधं वितनुते निर्वाणमात्यन्तिकम् ॥ । हे मर्त्याः परमं हितं शृणुत वो वक्ष्यामि सङ्क्षेपतः संसारार्णवमापदूर्मिबहुलं
    सम्यक्प्रविश्य स्थिताः । नानाज्ञानमपास्य चेतसि नमो नारायणायेत्यमुं मन्त्रं सप्रणवं प्रणामसहितं प्रावर्तयध्वं
    मुहुः ॥ ॥ पृथ्वीरेणुरणुः पयांसि कणिकाः फल्गुः स्फुलिङ्गोऽलघु स्तेजो निःश्वसनं मरुत्तनुतरं रन्ध्रं
    सुसूक्ष्मं नभः । क्षुद्रा रुद्रपितामहप्रभृतयः कीटाः समस्ताः सुराः दृष्टे यत्र स तावको विजयते भूमावधूतावधिः
    ॥ ॥ बद्धेनाञ्जलिना नतेन शिरसा गात्रैः सरोमोद्गमैः कण्ठेन स्वरगद्गदेन नयनेनोद्गीर्णबाष्पाम्बुना । नित्यं
    त्वच्चरणारविन्दयुगल ध्यानामृतास्वादिना मस्माकं सरसीरुहाक्ष सततं सम्पद्यतां जीवितम् ॥ ॥ हे गोपालक हे
    कृपाजलनिधे हे सिन्धुकन्यापते हे कंसान्तक हे गजेन्द्रकरुणापारीण हे माधव । हे रामानुज हे जगत्त्रयगुरो
    हे पुण्डरीकाक्ष मां हे गोपीजननाथ पालय परं जानामि न त्वां विना ॥ ॥ भक्तापायभुजङ्गगारुडमणिस्त्रैलोक्यरक्षामणिः
    गोपीलोचनचातकाम्बुदमणिः सौन्दर्यमुद्रामणिः । यः कान्तामणि रुक्मिणी घनकुचद्वन्द्वैकभूषामणिः श्रेयो देवशिखामणिर्दिशतु
    नो गोपालचूडामणिः ॥ ॥ शत्रुच्छेदैकमन्त्रं सकलमुपनिषद्वाक्यसम्पूज्यमन्त्रं संसारोत्तारमन्त्रं समुपचिततमः
    सङ्घनिर्याणमन्त्रम् । सर्वैश्वर्यैकमन्त्रं व्यसनभुजगसन्दष्टसन्त्राणमन्त्रं जिह्वे श्रीकृष्णमन्त्रं
    जप जप सततं जन्मसाफल्यमन्त्रम् ॥ ॥ व्यामोह प्रशमौषधं मुनिमनोवृत्ति प्रवृत्त्यौषधं दैत्येन्द्रार्तिकरौषधं
    त्रिभुवनी सञ्जीवनैकौषधम् । भक्तात्यन्तहितौषधं भवभयप्रध्वंसनैकौषधं श्रेयःप्राप्तिकरौषधं पिब मनः श्रीकृष्णदिव्यौषधम्
    ॥ ॥ आम्नायाभ्यसनान्यरण्यरुदितं वेदव्रतान्यन्वहं मेदश्छेदफलानि पूर्तविधयः सर्वे हुतं भस्मनि । तीर्थानामवगाहनानि
    च गजस्नानं विना यत्पद द्वन्द्वाम्भोरुहसंस्मृतिर्विजयते देवः स नारायणः ॥ ॥ श्रीमन्नाम प्रोच्य नारायणाख्यं
    के न प्रापुर्वाञ्छितं पापिनोऽपि । हा नः पूर्वं वाक्प्रवृत्ता न तस्मिन् तेन प्राप्तं गर्भवासादिदुःखम्
    ॥ ॥ मज्जन्मनः फलमिदं मधुकैटभारे मत्प्रार्थनीय मदनुग्रह एष एव । त्वद्भृत्यभृत्य परिचारक भृत्यभृत्य
    भृत्यस्य भृत्य इति मां स्मर लोकनाथ ॥ ॥ नाथे नः पुरुषोत्तमे त्रिजगतामेकाधिपे चेतसा सेव्ये स्वस्य पदस्य
    दातरि सुरे नारायणे तिष्ठति । यं कञ्चित्पुरुषाधमं कतिपयग्रामेशमल्पार्थदं सेवायै मृगयामहे नरमहो मूका
    वराका वयम् ॥ ॥ मदन परिहर स्थितिं मदीये मनसि मुकुन्दपदारविन्दधाम्नि । हरनयनकृशानुना कृशोऽसि स्मरसि
    न चक्रपराक्रमं मुरारेः ॥ ॥ तत्त्वं ब्रुवाणानि परं परस्मा न्मधु क्षरन्तीव सतां फलानि । प्रावर्तय प्राञ्जलिरस्मि
    जिह्वे नामानि नारायण गोचराणि ॥ ॥ इदं शरीरं परिणामपेशलं पतत्यवश्यं श्लथसन्धिजर्जरम् । किमौषधैः क्लिश्यसि
    मूढ दुर्मते निरामयं कृष्णरसायनं पिब ॥ ॥ दारा वाराकरवरसुता ते तनूजो विरिञ्चिः स्तोता वेदस्तव सुरगणो
    भृत्यवर्गः प्रसादः । मुक्तिर्माया जगदविकलं तावकी देवकी ते माता मित्रं बलरिपुसुतस्त्वय्यतोऽन्यन्न जाने
    ॥ ॥ कृष्णो रक्षतु नो जगत्त्रयगुरुः कृष्णं नमस्याम्यहं कृष्णेनामरशत्रवो विनिहताः कृष्णाय तस्मै नमः
    । कृष्णादेव समुत्थितं जगदिदं कृष्णस्य दासोऽस्म्यहं कृष्णे तिष्ठति सर्वमेतदखिलं हे कृष्ण रक्षस्व माम्
    ॥ ॥ तत्त्वं प्रसीद भगवन् कुरु मय्यनाथे विष्णो कृपां परमकारुणिकः किल त्वम् । संसारसागरनिमग्नमनन्तदीन
    मुद्धर्तुमर्हसि हरे पुरुषोत्तमोऽसि ॥ ॥ नमामि नारायणपादपङ्कजं करोमि नारायणपूजनं सदा । वदामि नारायणनाम
    निर्मलं स्मरामि नारायणतत्त्वमव्ययम् ॥ ॥ श्रीनाथ नारायण वासुदेव श्रीकृष्ण भक्तप्रिय चक्रपाणे । श्रीपद्मनाभाच्युत
    कैटभारे श्रीराम पद्माक्ष हरे मुरारे ॥ ॥ अनन्त वैकुण्ठ मुकुन्द कृष्ण गोविन्द दामोदर माधवेति । वक्तुं
    समर्थोऽपि न वक्ति कश्चि दहो जनानां व्यसनाभिमुख्यम् ॥ ॥ ध्यायन्ति ये विष्णुमनन्तमव्ययं हृत्पद्ममध्ये
    सततं व्यवस्थितम् । समाहितानां सतताभयप्रदं ते यान्ति सिद्धिं परमां च वैष्णवीम् ॥ ॥ क्षीरसागरतरङ्गशीकरा
    ऽऽसारतारकितचारुमूर्तये । भोगिभोगशयनीयशायिने माधवाय मधुविद्विषे नमः ॥ ॥ यस्य प्रियौ श्रुतिधरौ कविलोकवीरौ
    मित्रे द्विजन्मवरपद्मशरावभूताम् । तेनाम्बुजाक्षचरणाम्बुजषट्पदेन राज्ञा कृता कृतिरियं कुलशेखरेण ॥ ॥
    इति कुलशेखर प्रणीतं मुकुन्दमाला ।
