id: parivradahridayam-2
category: hridaya
name:
  english: parivradahridayam
  devanagari: परिव्राडहृदयम्
content:
  english: niratishayasukhah purnatriptah svasidhda || 43|| bandhayasaktacittam vishayavirahitam syaccacitam
    vimuktyai bhogeccha saiva bandhah shrutishirasi yatastamstyajanmokshabhagi | icchavidyaiva sakshattadapanayanato
    jivabhavasya nashah drishtadrishyadvi badhdo bhavati ca sutaram drishyashunye vimuktah || 44|| tyaktya
    dve namarupe jagata iha tatah sheshayitva svarupam saccitsaukhyadvayam yadgavati sa purusho drishyashunyo
    vimuktah | rajjuhsarpasya badhe svayamiha vigatasheshabhava yathaste tadvatsyatsviyarupam vyapagatasakalam
    saccidanandamatram || 45|| tyaktva karyasya drishtim sakalajagadadhishthanabhutam svarupam jnatva
    tatsarvasamyadvrajati ca paritah kashayansuryavadyah | nityanandah paratma niravadhiramalosangarupah
    parivrat tasminsatyasya satye jagadukhilamidam navimrasinna nashyet || 46|| tvannirmokatsvashaktya
    bahirahiriva ye labdhabodha vrajanti jnanadvairagyamesham bhavati viratito jnanalabhah paresham |
    parivrajyam dvidha syanniyamitamasam jnanavairagyapurvam dehadgehattatah syatsakalamidamaham brahmamatraikarupam
    || 47|| tyaktvadau bhogavancha tyajati sa matimansarvabhedatmadrishtim bhavabhavau tatosmaccalati
    na sutaram dhirdridha nirvikalpat | no satyam napyasatyam kimapi na manute svatmamatrodvitiyah sarvasyaitasyacatma
    jagati vijayate saccidanandamatrah || 48|| yatranandashca modah pramuda itimuda sarva ete vishanti
    brahmanandetra sarve svayamamalapade purnakama bhavanti | bhinnam napyabhinnam kimapi na ca tatahkasyavaishishtyamesham
    sviye saccidghane yatsakalamupashamam yati kim canyadasmat || 49|| jalmah kamoti dushto manujamanupadam
    badhatentarnilinah sodhum shaktonuko no sakridapi manute bhogatosmadvimokam | vyadhernashaya yadvadvayupacarati
    tatha kamamohasya tapah shamyedgogena matva bata vishayamatah pamaroyotra bhunkte || 50|| kamahshabhyenna
    bhogaditigaditamato budhdimeti prayatnat agniryavamshca bhuyanghrita iha patite kamatridhdistatha
    syat | bhogairvridhdashcakamah punarapi ca tato bhoga evatra bhuyan shabhyennaivasya trishna mrigajalata
    ito naiva yatno'pi shantah || 51|| bhumau yavadhdiranyam pashuyuvatijana dhanyametatsamastam krodikrityayatha
    dattam nikhilamapi ca tannalamekasya triptyai | matva cittasya shantyai shamamatisukhadam hyavrajedyo
    viveki vakyam nirdushtametadvadati manurahonavamanyeta jatu || 52|| yashvaitanprapnuyadvai jagati
    ca sakalankevalanyastyajettan bhoganam prapanatsyanmanuriha manute tyaga esham varishthah | yasyatkamasya
    saukhyam jagati yadapi tatsvargasaukhyam ca divyam saukhyam trishnayakshayadyadgavati na ca kala shodashi
    tasya tatsyat || 53|| aste murtiryathaikatvabhinavaghatita sarva saundaryarupa jata mritkarpatadyairnijakutiladrisha
    mohayanti jananam | nihsara bhogalabdhau nayanamatihara duratotiva ramya durgandhadravyapurna hyashubhatanuraho
    tadvadevatiheya || 54|| jitva sarvaniyatnajjayati yadi na cedindriyam caikamasmat prajna tenaiva sakam
    ksharati nimishato vari yavaddriterveai | tasmadadau jayettatparamamatiyuto yanmanah sarvamukhyam
    pashcatsarvendriyani svayamiha hi vashe svanubhutya bhavanti || 55|| kandum kanduyamanamatishayasukhadam
    manyamano'pi necchet tatpraptyartham na yatnah kuruta iti tatha syanna tadvasanapi | tadvajjnatvendriyottham
    sukhamapi na ca tatkamayedyo viveki kandatigrastacitto bata kimutasukhi dhanya evam kriti ca || 56||
    tyaktva laulyam ca karmanyuparatita ito bhogashunyo viraktah jitva vighnanasheshanavikritamanasa nityasaukhyatmadrishtya
    | nityam brahmahamekam nijaguruvacasa bhavayitvanubhuatya shradhdayukto mumukshurniratishayasukhasvatmatushtah
    kriti syat || 57|| yatpritya pritipatram sakalamapi nrinam tadgavedatmarupam atmartha stri tatha syatpatirapi
    ca tato dravyaputradikam yat | sviye dehe'pi tadvannijamanasi matau pritiratmarthameva proyanyatsvatmabhanam
    tvahamiti kimuta svatmarupam yadasti || 58|| yavadyasminpriyatvam prabhavati khalu tatsaukhyadam vastutavat
    sarvasmatpritiratmanyadhikavishayika shreshthasaukhyam svatahsyat | datum bhoktum svarupeaihami na
    ca kimapi svatmanonyadyatastat sarvasmaccherashthasaukhyam svayamiha nikhile svarcishaiveti sakshat
    || 59|| drishyam yadbahyasrishtau vishadayati nijam minnabhinnakritestat pashyeshcakshustathedam viditamiha
    bhaveshcetasa tanmano'pi | budhdirjanati budhdya capalamana idam vetti yatsvena bhasa budvehsakshi
    svatorcistamasa iti tathaham kritestatvayam hi || 60|| anyatsvasmadyadevam janitamiti ca tannashamabhyeti
    pashcat ko va budhyetsvanasham janamati ca yadavenna tasyasti nashah | nasho yasmannamesya svajanirapi
    tatha jatameveha nashyet nityam sashcitsukhaikam sakalatanushu yadbrahma tenahamadva || 61|| brahyaivagre
    sadekam sakalamidamahovettadevahamevam svatmanam tattoaismadabhavaditi yatah khalvidam brahya tasmat
    | divanam va rishinam tadabhavaditi yastannrinam pratyabudhyat tadbrahmaivahamasmityanubhavaudite
    brahma sotra bhutervak || 62|| namnaham svatmarupam yadabhavaditi tatsvicchaya sviyashaktya sarvasvetasu
    samstham tvahamiti tanushu svena bhasa svamatram | yahkopyamantritahsannahamiti vadati sviyanameti
    tasmat bhumatmaikoehamevam vyavahriti vidhaye bhinnarupairyuto'pi || 63|| sarveshveteshu deheshvahamahamiti
    yah svena rupena bhati praksarvasmatsa ekah svayamiha na tathanyanna kincittadanim | ekaki naiva reme'paramati
    na tathapashyadatratmanah sah vamavamena bhutva svayamabhavadayam purusho dakshinena || 64|| pragekaki
    sa bhutva vishayamanusarankamyamanotra jayam putram vittanca sarvam hyayupakaranamatho karma kurvamstadartham
    | eka labhepya kritsno manuta iti tatha nanyadasmadvarishtham kleshanpranavasheshansahata iti tato
    bhuya evatra mugdhah || 65|| asmacchabdo yathaiava pracalati ca tatha sarva lingeshu yushmat tvam
    vaham bhanatoyam sakalavapushi yo lingashunyodvayah sah | nakaro na vikaro nijaniratishayadatmarupam
    hi sarvam ka nari ko narah syadahaha jagadidam duhkhamulam vimauaidhyat || 66|| sakshi sarvasya bhuma
    sakalajagadadhishthanarupotivishvah sarvasvetasu nityam hyayamiti tanushu sviyarupena bhati | sarvatradvaitarupo
    janimritirahito namarupadvimuktah cidrupah pratyagatma prakritivikritibhirnanuliptastvasangah || 67||
    jagrabdalyadyavasthasvahamiti satatam vyeti tannaiva yasmat bhinnastabhyovikari vilasati sakaleshveva
    deheshu punarh || budveh sakshi svayam yah sadsadidamaho bhasayannirvisheshah sarveshveteshvayognipratima
    iha sada svena rupena diptah || 68|| ishavasyam shrutervagjagadakhilamidam nehananasti kincit mrityorapnoti
    mrityum jagadakhilamidam yastu naneva pashyet | bahmaivedam varishtham bhavati ca sakalam vishvametatsvayam
    yat amrta syadyattatonyacchratigaditamidam bhedato bhishcah mrityuh || 69|| jnatva devam tathevam
    tarati bhavamimam mucyate sarvapasheaih pantha nanyotimrityam nayati yata ito vidyate nayanaya | jnanadevamritatvam
    bhavati na punaravartate purnakamah pranah kramanti naiva kvacana na gamanam tasya yah syadvimuktah
    || 70|| bhoktavyam jnasya nasti svayamihahi yatah purnanandarupah sarvatravasthitayam svayamanatishayah
    kutra gacchetkimartham | ajno dehatmabudhdya vividha vishayatah kartribhoktritvametya karmadhodhvarnca
    bhoktum janita iti bhavedhdyasatah svacchayaiva || 71|| kshiyantasmimshca drishte shrutamihahi yatah
    sarvakarmani casya karmapraptam sukham yattadapanayanato nityasaukhyam hi vidvana | no shoko janmaduhkham
    maranamapi tathanandamatratmanosya jnatva brahmaikyametya svayamiti sa yatihkevalo nirvikalpah ||
    72|| matva saukhyam svatonyattadanadhigamato duhkharupautra jivah jnate tattve sa bhuma svayamitihi
    sukham naiva duhkham sukhasya | jatam kshiyetasakshi svayamiha sakalam vetti yah sovinashi saukhyam
    yatsvatmanonyajjanimritimadaho svatmasaukhyam natavat || 73|| drashta drishyadvibhinnah shruti shirasiyatashcidghanah
    svena bhasa drashturdrishterna lopo yadi bhavati tatah kevale kim tatonyat | yatranyatsyattadalpam
    nijaniravadhito yatra nanyatsa bhuma drashtatve jiva evam janimritirahitah shashvatananda eva || 74||
    jnatva budhdeh paro'ham satatamiti ca tatsvatmarupam hi budhva jahyatkamam svadrishtaya vadati yadupatih
    svatmasaukhyaya nityam | nirdosham brahma nityam samamihasakalesminsthitaste ca muktah kasmataih pretyajivannihahi
    jita iti shripatih sarga aha || 75|| vikshepo namsti yasmanmama na tata iha syatsamadhih kadapi vikshepo
    va samadhirmanasa iti na me nirvikalpohamatma | no kurve karaye'pi svayamiha jagatah sakshyatah svastha
    ase svatmanam vedyi yasmadupanishadi matam cavadhutena gitam || 76|| jnatva svatmanamevam nijajanavanitavittaputraishanayah
    vyutthaya brahmanaste shrutiriha tanute bhaikshamevashrayante | jakshankridamshca yanairyuvatibhirathava
    na smare tacchariram sarvatrayakayarupam vimalasukhadhanam vikshate jnah svarupam || 77|| dehatmajnoviveki
    manuta iha yatodhyasato dehadrishtaya namakarangunanyah purusha iti ca va stri nam tasyatmadrishtih
    | yadvanmudhasya bhayadvapuriti satatam tadvadevatmadrigyah tasyaikam nirvikaram niratishaya sukham
    sarvatashcitsvarupam || 78|| prakpashcadasti kumbhadgaganamidamahoshlishtamevam prithagyat kumbhotpattavapiha
    vyavahriti samaye sarvada sarvatashca | sarvatraiveha tadvashcyalanavirahitam sarvada citsukham yat
    tishthankridamshca gacchanmanuta iti sada sviyarupam parivrad || 79|| tavatsarve taranga atishayatarala
    rupato bhanti bhinnah yavanna jnatametatsakalamapi jalam bhedashunyam svamatram | jnani pathastaranganvayavadihasada
    sarvamatvaiva pashyan aste brahmaiva bhutva hyavikritamanisham kevalam citsukham yat || 80|| jnatva
    sarveshu bhuteshvahamiti satatam no jugupseta vidvana yasminsarvamni bhutanyahamihahi yadabhuttada
    janatosya | parthakyam napi temyah kvacidapi na ca taccintana bhinnadrishtaya syatko mohashcashokah
    shrutigaditamidam sviyamekatvadrishteh || 81|| bhutasthatmanamevam bhramarahitamanah sarvabhutani
    vidvana svatmanyevatra pashyanbrihaditi paramam yati nanyena jatu | kaivalye dattadrishtih sa hi bhavaditi
    yadbhutamevam bhavishyat jnatva bhumanamevam sakalamidamaham manyatesau parivrat || 82|| tadbrahmaivahamasmityanubhava
    udite sarvabhedapramokshah jivanmuktasturiyo bhramarahita hrida svatmasaukhyavashishtah | ragadveshau
    na kamah kvacidapi na tatha bhedabudvishca tasmin bhayadvapyatra tishthetsakalamapi hutam svatmarupe
    cidagnau || 83|| rupam rupam ca bhutva sakala tanushu yah pravishatsodvayah syat
  devanagari: निरतिशयसुखाः पूर्णतृप्ताः स्वसिध्दा ॥ ४३॥ बन्धायासक्तचित्तं विषयविरहितं स्याच्चचितं विमुक्त्यै
    भोगेच्छा सैव बन्धः श्रुतिशिरसि यतस्तांस्त्यजन्मोक्षभागी । इच्छाविद्यैव साक्षात्तदपनयनतो जीवभवस्य नाशः
    दृष्टादृश्याद्वि बध्दो भवति च सुतरां दृश्यशून्ये विमुक्तः ॥ ४४॥ त्यक्त्या द्वे नामरूपे जगत इह ततः
    शेषयित्वा स्वरूपम् सच्चित्सौख्याद्वयं यद्गवति स पुरुषो दृश्यशून्यो विमुक्तः । रज्जुःसर्पस्य बाधे स्वयमिह
    विगताशेषभावा यथास्ते तद्वत्स्यात्स्वीयरूपं व्यपगतसकलं सच्चिदानन्दमात्रम् ॥ ४५॥ त्यक्त्वा कार्यस्य
    दृष्टिं सकलजगदधिष्ठानभूतं स्वरूपम् ज्ञात्वा तत्सर्वसाम्याद्व्रजति च परितः काशयन्सूर्यवद्यः । नित्यानन्दः
    परात्मा निरवधिरमलोसङ्गरूपः परिव्राट् तस्मिन्सत्यस्य सत्ये जगदुखिलमिदं नाविंरासीन्न नश्येत् ॥ ४६॥ त्वङ्निर्मोकात्स्वशक्त्या
    बहिरहिरिव ये लब्धबोधा व्रजन्ति ज्ञानाद्वैराग्यमेषां भवति विरतितो ज्ञानलाभः परेषाम् । पारिव्राज्यं
    द्विधा स्यान्नियमितमसां ज्ञानवैराग्यपूर्वम् देहाद्गेहात्ततः स्यात्सकलमिदमहं ब्रह्ममात्रैकरूपम् ॥ ४७॥
    त्यक्त्वादौ भोगवाञ्छा त्यजति स मतिमान्सर्वभेदात्मदृष्टिम् भावाभावौ ततोस्माच्चलति न सुतरां धीर्दृढा
    निर्विकल्पात् । नो सत्यं नाप्यसत्यं किमपि न मनुते स्वात्ममात्रोद्वितीयः सर्वस्यैतस्यचात्मा जगति विजयते
    सच्चिदानन्दमात्रः ॥ ४८॥ यत्रानन्दाश्च मोदाः प्रमुद इतिमुदा सर्व एते विशन्ति ब्रह्मानन्देत्र सर्वे
    स्वयममलपदे पूर्णकामा भवन्ति । भिन्नं नाप्यभिन्नं किमपि न च ततःकस्यवैशिष्ट्यमेषाम् स्वीये सच्चिद्घने
    यत्सकलमुपशमं याति किं चान्यदस्मात् ॥ ४९॥ जाल्मः कामोति दुष्टो मनुजमनुपदं बाधतेन्तर्निलीनः सोढुं शक्तोनुको
    नो सकृदपि मनुते भोगतोस्माद्विमोकम् । व्याधेर्नाशाय यद्वद्वयुपचरति तथा काममोहस्य तापः शाम्येद्गोगेन
    मत्वा बत विषयमतः पामरोयोत्र भुङ्क्ते ॥ ५०॥ कामःशाभ्येन्न भोगादितिगदितमतो बुध्दिमेति प्रयत्नात् अग्निर्यावांश्च
    भूयान्घृत इह पतिते कामतृध्दिस्तथा स्यात् । भोगैर्वृध्दश्चकामः पुनरपि च ततो भोग एवात्र भूयान् शाभ्येन्नैवास्य
    तृष्णा मृगजलत इतो नैव यत्नोऽपि शान्तः ॥ ५१॥ भुमौ यावध्दिरण्यं पशुयुवतिजना धान्यमेतत्समस्तम् क्रोडीकृत्यायथ
    दत्तं निखिलमपि च तन्नालमेकस्य तृप्त्यै । मत्वा चित्तस्य शान्त्यै शममतिसुखदं ह्याव्रजेद्यो विवेकी वाक्यं
    निर्दुष्टमेतद्वदति मनुरहोनावमन्येत जातु ॥ ५२॥ यश्वैतान्प्राप्नुयाद्वै जगति च सकलान्केवलान्यस्त्यजेत्तान्
    भोगानां प्रापणात्स्यान्मनुरिह मनुते त्याग एषां वरिष्ठः । यस्यात्कामस्य सौख्यं जगति यदपि तत्स्वर्गसौख्यं
    च दिव्यम् सौख्यं तृष्णायक्षयाद्यद्गवति न च कला षोडशी तस्य तत्स्यात् ॥ ५३॥ आस्ते मूर्तिर्यथैकात्वभिनवघटिता
    सर्व सौन्दर्यरूपा जाता मृत्कर्पटाद्यैर्निजकुटिलदृशा मोहयन्ती जनानाम् । निःसारा भोगलब्धौ नयनमतिहरा
    दूरतोतीव रम्या दुर्गन्धद्रव्यपूर्णा ह्यशुभतनुरहो तद्वदेवातिहेया ॥ ५४॥ जित्वा सर्वाणियत्नाज्जयति यदि
    न चेदिन्द्रियं चैकमस्मात् प्रज्ञा तेनैव साकं क्षरति निमिषतो वारि यावद्दृतेर्वेऐ । तस्मादादौ जयेत्तत्परममतियुतो
    यन्मनः सर्वमुख्यम् पश्चात्सर्वेन्द्रियाणि स्वयमिह हि वशे स्वानुभूत्या भवन्ति ॥ ५५॥ कण्डूं कण्डूयमानामतिशयसुखदां
    मन्यमानोऽपि नेच्छेत् तत्प्राप्त्यर्थं न यत्नः कुरुत इति तथा स्यान्न तद्वासनापि । तद्वज्ज्ञात्वेन्द्रियोत्थं
    सुखमपि न च तत्कामयेद्यो विवेकी कण्डतिग्रस्तचित्तो बत किमुतसुखी धान्य एवं कृती च ॥ ५६॥ त्यक्त्वा लौल्यं
    च कर्माण्युपरतित इतो भोगशून्यो विरक्तः जित्वा विघ्नानशेषानविकृतमनसा नित्यसौख्यात्मदृष्ट्या । नित्यं
    ब्रह्माहमेकं निजगुरुवचसा भावयित्वानुभूआत्या श्रध्दायुक्तो मुमुक्षुर्निरतिशयसुखस्वात्मतुष्टः कृती स्यात्
    ॥ ५७॥ यत्प्रीत्या प्रीतिपात्रं सकलमपि नृणां तद्गवेदात्मरूपम् आत्मार्थ स्त्री तथा स्यात्पतिरपि च ततो
    द्रव्यपुत्रादिकं यत् । स्विये देहेऽपि तद्वन्निजमनसि मतौ प्रीतिरात्मार्थमेव प्रोयान्यत्स्वात्मभानं
    त्वहमिति किमुत स्वात्मरूपं यदस्ति ॥ ५८॥ यावद्यस्मिन्प्रियत्वं प्रभवति खलु तत्सौख्यदं वस्तुतावत् सर्वस्मात्प्रीतिरात्मन्यधिकविषयिका
    श्रेष्ठसौख्यं स्वतःस्यात् । दातुं भोक्तुं स्वरूपेऐहमि न च किमपि स्वात्मनोन्यद्यतस्तत् सर्वस्माच्छेरष्ठसौख्यं
    स्वयमिह निखिले स्वार्चिषैवेति साक्षात् ॥ ५९॥ दृश्यं यद्बाह्यसृष्टौ विशदयति निजं मिन्नभिन्नाकृतेस्तत्
    पश्येश्चक्षुस्तथेदं विदितमिह भवेश्चेतसा तन्मनोऽपि । बुध्दिर्जानाति बुध्द्या चपलमन इदं वेत्ति यत्स्वेन
    भासा बुद्वेःसाक्षी स्वतोर्चिस्तमस इति तथाहं कृतेस्तत्वयं हि ॥ ६०॥ अन्यत्स्वस्माद्यदेवं जनितमिति च
    तन्नाशमभ्येति पश्चात् को वा बुध्येत्स्वनाशं जनमति च यदावेन्न तस्यास्ति नाशः । नाशो यस्मान्नमेस्य स्वजनिरपि
    तथा जातमेवेह नश्येत् नित्यं सश्चित्सुखैकं सकलतनुषु यद्ब्रह्म तेनाहमद्वा ॥ ६१॥ ब्रह्यैवाग्रे सदेकं
    सकलमिदमहोवेत्तदेवाहमेवम् स्वात्मानं तत्तोऐस्मादभवदिति यतः खल्विदं ब्रह्य तस्मात् । दीवानां वा ऋषीणां
    तदभवदिति यस्तन्नृणां प्रत्यबुध्यत् तद्ब्रह्मैवाहमस्मीत्यनुभवौदिते ब्रह्म सोत्र भुतेर्वाक् ॥ ६२॥ नाम्नाहं
    स्वात्मरूपं यदभवदिति तत्स्वीच्छया स्वीयशक्त्या सर्वास्वेतासु संस्थं त्वहमिति तनुषु स्वेन भासा स्वमात्रम्
    । यःकोप्यामन्त्रितःसन्नहमिति वदति स्वीयनामेति तस्मात् भूमात्मैकोएहमेवं व्यवहृति विधये भिन्नरूपैर्युतोऽपि
    ॥ ६३॥ सर्वेष्वेतेषु देहेष्वहमहमिति यः स्वेन रूपेण भाति प्राक्सर्वस्मात्स एकः स्वयमिह न तथान्यन्न किञ्चित्तदानीम्
    । एकाकी नैव रेमेऽपरमति न तथापश्यदत्रात्मनः सः वमावामेन भूत्वा स्वयमभवदयं पूरुषो दक्षिणेन ॥ ६४॥ प्रागेकाकी
    स भूत्वा विषयमनुसरन्काम्यमानोत्र जायाम् पुत्रं वित्तञ्च सर्वं ह्ययुपकरणमथो कर्म कुर्वंस्तदर्थम् ।
    एका लाभेप्य कृत्स्नो मनुत इति तथा नान्यदस्माद्वरिष्ठम् क्लेशान्प्राणावशेषान्सहत इति ततो भूय एवात्र
    मुग्धः ॥ ६५॥ अस्मच्छब्दो यथैआव प्रचलति च तथा सर्व लिङ्गेषु युष्मत् त्वं वाहं भानतोयं सकलवपुषि यो लिङ्गशून्योद्वयः
    सः । नकारो ना विकारो निजनिरतिशयादात्मरूपं हि सर्वम् का नारी को नरः स्यादहह जगदिदं दुःखमूलं विमौऐढ्यात्
    ॥ ६६॥ साक्षी सर्वस्य भूमा सकलजगदधिष्ठानरूपोतिविश्वः सर्वास्वेतासु नित्यं ह्ययमिति तनुषु स्वीयरूपेण
    भाति । सर्वत्राद्वैतरूपो जनिमृतिरहितो नामरूपाद्विमुक्तः चिद्रूपः प्रत्यगात्मा प्रकृतिविकृतिभिर्नानुलिप्तस्त्वसङ्गः
    ॥ ६७॥ जाग्रब्दाल्याद्यवस्थास्वहमिति सततं व्येति तन्नैव यस्मात् भिन्नस्ताभ्योविकारी विलसति सकलेष्वेव
    देहेषु पूणर्ः ॥ बुद्वेः साक्षी स्वयं यः सद्सदिदमहो भासयान्निर्विशेषः सर्वेष्वेतेष्वयोग्निप्रतिम इह
    सदा स्वेन रूपेण दीप्तः ॥ ६८॥ ईशावास्यं श्रुतेर्वाग्जगदखिलमिदं नेहनानास्ति किञ्चित् मृत्योराप्नोति
    मृत्युं जगदखिलमिदं यस्तु नानेव पश्येत् । बह्मैवेदं वरिष्ठं भवति च सकलं विश्वमेतत्स्वयं यत् आंर्त स्याद्यत्ततोन्यच्छ्रतिगदितमिदं
    भेदतो भीश्चः मृत्युः ॥ ६९॥ ज्ञात्वा देवं तथेवं तरति भवमिमं मुच्यते सर्वपाशेऐः पन्था नान्योतिमृत्यं
    नयति यत इतो विद्यते नायनाय । ज्ञानादेवामृतत्वं भवति न पुनरावर्तते पूर्णकामः प्राणाः क्रामान्ति नैव
    क्वचन न गमनं तस्य यः स्याद्विमुक्तः ॥ ७०॥ भोक्तव्यं ज्ञस्य नास्ति स्वयमिहहि यतः पूर्णानन्दरूपः सर्वत्रावस्थितायं
    स्वयमनतिशयः कुत्र गच्छेत्किमर्थम् । अज्ञो देहात्मबुध्द्या विविध विषयतः कर्तृभोक्तृत्वमेत्य कर्माधोध्वर्ञ्च
    भोक्तुं जनित इति भवेध्द्यासतः स्वच्छयैव ॥ ७१॥ क्षीयन्तस्मिंश्च दृष्टे श्रुतमिहहि यतः सर्वकर्माणि चास्य
    कर्मप्राप्तं सुखं यत्तदपनयनतो नित्यसौख्यं हि विद्वान । नो शोको जन्मदुःखं मरणमपि तथानन्दमात्रात्मनोस्य
    ज्ञात्वा ब्रह्मैक्यमेत्य स्वयमिति स यतिःकेवलो निर्विकल्पः ॥ ७२॥ मत्वा सौख्यं स्वतोन्यत्तदनधिगमतो दुःखरूपौत्र
    जीवः ज्ञाते तत्त्वे स भूमा स्वयमितिहि सुखं नैव दुःखं सुखस्य । जतं क्षीयेतसाक्षी स्वयमिह सकलं वेत्ति
    यः सोविनाशी सौख्यं यत्स्वात्मनोन्यज्जनिमृतिमदहो स्वात्मसौख्यं नतावत् ॥ ७३॥ द्रष्टा दृश्याद्विभिन्नः
    श्रुति शिरसीयताश्चिद्घनः स्वेन भासा द्रष्टुर्दृष्टेर्न लोपो यदि भवति ततः केवले किं ततोन्यत् । यत्रान्यत्स्यात्तदल्पं
    निजनिरवधितो यत्र नान्यत्स भूमा द्रष्टत्वे जीव एवं जनिमृतिरहितः शाश्वतानन्द एव ॥ ७४॥ ज्ञात्वा बुध्देः
    परोऽहं सततमिति च तत्स्वात्मरूपं हि बुध्वा जह्यात्कामं स्वदृष्टया वदति यदुपतिः स्वात्मसौख्याय नित्यम्
    । निर्दोषं ब्रह्म नित्यं सममिहसकलेस्मिन्स्थितास्ते च मुक्ताः कस्मातैः प्रेत्यजीवन्निहहि जित इति श्रीपतिः
    सर्ग आह ॥ ७५॥ विक्षेपो नांस्ति यस्मान्मम न तत इह स्यात्समाधिः कदापि विक्षेपो वा समाधिर्मनस इति न मे
    निर्विकल्पोहमात्मा । नो कुर्वे कारयेऽपि स्वयमिह जगतः साक्ष्यतः स्वस्थ आसे स्वात्मानं वेद्यि यस्मादूपनिषदि
    मतं चावधूतेन गीतम् ॥ ७६॥ ज्ञात्वा स्वात्मानमेवं निजजनवनितावित्तपुत्रैषणायाः व्युत्थाय ब्राह्मणास्ते
    श्रुतिरिह तनुते भैक्षमेवाश्रयन्ते । जक्षन्क्रीडंश्च यानैर्युवतिभिरथवा न स्मरे तच्छरीरम् सर्वत्रायकायरूपं
    विमलसुखधनं वीक्षते ज्ञः स्वरूपम् ॥ ७७॥ देहात्मज्ञोविवेकी मनुत इह यतोध्यासतो देहदृष्टया नामाकारान्गुणान्यः
    पुरुष इति च वा स्त्री नं तस्यात्मदृष्टीः । यद्वन्मूढस्य भायाद्वपुरिति सततं तद्वदेवात्मदृग्यः तस्यैकं
    निर्विकारं निरतिशय सुखं सर्वतश्चित्स्वरूपम् ॥ ७८॥ प्राक्पश्चादस्ति कुम्भाद्गगनमिदमहोश्लिष्टमेवं पृथग्यत्
    कुम्भोत्पत्तावपीह व्यवहृति समये सर्वदा सर्वतश्च । सर्वत्रैवेह तद्वश्च्यलनविरहितं सर्वदा चित्सुखं यत्
    तिष्ठन्क्रीडंश्च गच्छन्मनुत इति सदा स्वीयरूपं परिव्राद् ॥ ७९॥ तावत्सर्वे तरङ्गा अतिशयतरला रूपतो भान्ति
    भिन्नाः यावन्न ज्ञातमेतत्सकलमपि जलं भेदशून्यं स्वमात्रम् । ज्ञानी पाथस्तरङ्गान्वयवदिहसदा सर्वमात्वैव
    पश्यन् आस्ते ब्रह्मैव भूत्वा ह्यविकृतमनिशं केवलं चित्सुखं यत् ॥ ८०॥ ज्ञात्वा सर्वेषु भूतेष्वहमिति
    सततं नो जुगुप्सेत विद्वान यस्मिन्सर्वांणि भूतान्यहमिहहि यदाभूत्तदा जानतोस्य । पार्थक्यं नापि तेम्यः
    क्वचिदपि न च तच्चिन्तन भिन्नदृष्टया स्यात्को मोहश्चशोकः श्रुतिगदितमिदं स्वीयमेकत्वदृष्टेः ॥ ८१॥ भूतस्थात्मानमेवं
    भ्रमरहितमनाः सर्वभूतानि विद्वान स्वात्मन्येवात्र पश्यन्बृहदिति परमं याति नान्येन जातु । कैवल्ये दत्तदृष्टीः
    स हि भवदिति यद्भूतमेवं भविष्यत् ज्ञात्वा भूमानमेवं सकलमिदमहं मन्यतेसौ परिव्राट् ॥ ८२॥ तद्ब्रह्मैवाहमस्मीत्यनुभव
    उदिते सर्वभेदप्रमोक्षः जीवन्मुक्तस्तुरीयो भ्रमरहित हृदा स्वात्मसौख्यावशिष्टः । रागद्वेषौ न कामः क्वचिदपि
    न तथा भेदबुद्विश्च तस्मिन् भायाद्वाप्यत्र तिष्ठेत्सकलमपि हुतं स्वात्मरूपे चिदग्नौ ॥ ८३॥ रूपं रूपं
    च भूत्वा सकल तनुषु यः प्राविशत्सोद्वयः स्यात्
