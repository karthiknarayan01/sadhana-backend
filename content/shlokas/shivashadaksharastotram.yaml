id: shivashadaksharastotram
category: stotram
name:
  english: shivashadaksharastotram
  devanagari: शिवषडाक्षरस्तोत्रम्
content:
  english: omkarabindusamyuktam nityam dhyayanti yoginah| kamadam mokshadam caiva omkaraya namo namah||
    namanti rishayo deva namantyapsarasam ganah | nara namanti devesham nakaraya namo namah|| mahadevam
    mahatmanam mahadhyanaparayanam| mahapapaharam devam makaraya namo namah|| shivam shantam jagannatham
    lokanugrahakarakam | shivamekapadam nityam shikaraya namo namah|| vahanam vrishabho yasya vasuki kanthabhushanam
    | vame shaktidharam devam vakaraya namo namah || yatra yatra sthito devah sarvavyapi maheshvarah |
    yo guruh sarvadevanam yakaraya namo namah|| shadaksharamidam stotram yah pathecchivasannidhau | shivalokamavapnoti
    shivena saha modate || namah shivaya namo namah| om namah shivaya namo namah| om namah shivaya namo
    namah||
  devanagari: ॐकारबिन्दुसंयुक्तं नित्यं ध्यायन्ति योगिनः। कामदं मोक्षदं चैव ॐकाराय नमो नमः॥ नमन्ति ऋषयो
    देवा नमन्त्यप्सरसां गणाः । नरा नमन्ति देवेशं नकाराय नमो नमः॥ महादेवं महात्मानं महाध्यानपरायणम्। महापापहरं
    देवं मकराय नमो नमः॥ शिवं शान्तं जगन्नाथं लोकनुग्रहकारकम् । शिवमेकपदम् नित्यं शिकाराय नमो नमः॥ वाहनं
    वृषभो यस्य वासुकी कण्ठभूषणम् । वामे शक्तिधरं देवं वकाराय नमो नमः ॥ यत्र यत्र स्थितो देवः सर्वव्यापी
    महेश्वरः । यो गुरुः सर्वदेवानां यकाराय नमो नमः॥ षडक्षरमिदं स्तोत्रं यः पठेच्छिवसन्निधौ । शिवलोकमवाप्नोति
    शिवेन सह मोदते ॥ नमः शिवाय नमो नमः। ॐ नमः शिवाय नमो नमः। ॐ नमः शिवाय नमो नमः॥
