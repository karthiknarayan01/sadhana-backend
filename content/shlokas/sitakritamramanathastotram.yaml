id: sitakritamramanathastotram
category: stotram
name:
  english: sitakritamramanathastotram
  devanagari: सीताकृतंरामनाथस्तोत्रम्
content:
  english: sitakritam ramanathastotram sitovaca | paramakarana shankara dhurjate girisutastanakunkumashobhita
    | mama patau paridehi matim sada na vishamam parapurushagocaram || 21|| gangadhara virupaksha nilalohita
    shankara | ramanatha namastubhyam raksha ma karunakara || 22|| namaste devadevesha namaste karunalaya
    | namaste bhavabhitanam bhavabhitivimardana || 23|| natha tvadiyacaranambujacintanena nirddhuya bhaskarasutadbhayamashu
    shambho | nityatvamashu gatavansa mrikanduputrah kim va na sidhyati tavashrayanatparesha || 24|| paresha
    paramananda sharanagatapalaka | pativratyam mama sada dehi tubhyam namo namah || 25|| iti shriskandapurane
    brahmakhande setukhande ekonapancashattamadhyayantargatam sitakritam ramanathastotram samaptam | skandapurana
    | brahmakhanda | setulkhanda | adhyaya 49
  devanagari: सीताकृतं रामनाथस्तोत्रम् सीतोवाच । परमकारण शङ्कर धूर्जटे गिरिसुतास्तनकुङ्कुमशोभित । मम पतौ
    परिदेहि मतिं सदा न विषमां परपूरुषगोचराम् ॥ २१॥ गङ्गाधर विरूपाक्ष नीललोहित शङ्कर । रामनाथ नमस्तुभ्यं
    रक्ष मा करुणाकर ॥ २२॥ नमस्ते देवदेवेश नमस्ते करुणालय । नमस्ते भवभीतानां भवभीतिविमर्दन ॥ २३॥ नाथ त्वदीयचरणाम्बुजचिन्तनेन
    निर्द्धूय भास्करसुताद्भयमाशु शम्भो । नित्यत्वमाशु गतवान्स मृकण्डुपुत्रः किं वा न सिध्यति तवाश्रयणात्परेश
    ॥ २४॥ परेश परमानन्द शरणागतपालक । पातिव्रत्यं मम सदा देहि तुभ्यं नमो नमः ॥ २५॥ इति श्रीस्कन्दपुराणे
    ब्रह्मखण्डे सेतुखण्डे एकोनपञ्चाशत्तमाध्यायान्तर्गतं सीताकृतं रामनाथस्तोत्रं समाप्तम् । स्कन्दपुराण
    । ब्रह्मखण्ड । सेतुल्खण्ड । अध्याय ४९
