id: kartaviryarjunakavacastotramahamantrah-2
category: mantra
name:
  english: kartaviryarjunakavacastotramahamantrah
  devanagari: कार्तवीर्यार्जुनकवचस्तोत्रमहामन्त्रः
content:
  english: suryendujvalanaprabham | uditadityasankasham kundaladvayashobhitam || 19|| mahayogabalaishvaryakirtyakrantajagattrayam
    | shrimaccakram hareramshadavatirnam mahabalam || 20|| samyagatmavibhedena dhyatva rakshamudirayet
    | dattatreya rirshih prokto'nushtupchandah prakirtitam || 21|| kartaviryarjuno vishnushcakravarti
    ca devata | viniyogashca rakshayai sarvatra parikirtitah || 22|| sarvashatruvinashaya sarvarthasya
    ca siddhaye | tasyaiva murtayah panca bhanumatkiranojjvalah || 23|| agnishasuravayavyakoneshu hridayantikah
    | sarvatastu jvaladrupa varacarmasipanayah || 24|| avyahatabalaishvaryashaktisamarthyavigrahah | kshemankarim
    shaktiyuktahcoranam ca vibhanjanah || 25|| pracim disham rakshatu me banabanasanairyutah | shrikarishaktisahito
    marimadavibhanjanah || 26|| sharacapadharah shriman disham me patu dakshinam | mahavashyakari yukto
    shatrunam madabhanjanah || 27|| maheshucapadhrik patu mama pracetasim disham | yashah kari yashaskaro
    daityanam madabhanjanah || 28|| kodandeshudharassaumyam disham me parirakshatu | prajnakariyutashcapahbanadhrik
    dushtashasanah || 29|| parirakshatu mam samyak samyak vidisham cagnidevatam | vidyakari samayuktah
    sumahan dushtashasanah || 30|| patu me nairritim capabano vidishamishvarah | dhanakarshanasamayukto
    mahaduritanashanah || 31|| ishvasaneshu drik patu vidisho mama vayavim | ayushkaryayutahshriman mahabhayavinashanah
    || 32|| capeshudharirauvim me vidisham parirakshatu | vijayashriyutassakshatsahastraradharo vibhuh
    || 33|| dishamurdhvamavatu me mahabhayavibhanjanah | shankhabhritsumahashaktissambhuto me dharam disham
    || 34|| parirakshatu me duhkhadhvantasambhedabhaskarah | mahashobhashrayayuktah sarvadikcakramandalah
    || 35|| mahayogishvarah patu sarvato mama padmadhrik | etashca kartaviryasya shuklamalyamshukavritah
    || 36|| pradhanadevatarupah prithagvararathasthitah | shaktayah padmahastashca nilendivarasannibhah
    || 37|| shuklamalyasuvasana lalitastilakojvalah | tatparshvadevatah svasvavahanayudhabhushanah ||
    38|| svasvadikshu sthitah pantu mamindradya mahabalah | etastasya samakhyatah sarvavaranadevatah ||
    39|| sarvato mam sada patu sarvashaktisamanvitah | hridaye codare nabhau jathare guhyamandale || 40||
    uruyugjanupadeshu murdhni bhruyugale'pi ca | karnakshinasikajihvakanthabahuyugeshu ca || 41|| dashabijatmikamantrah
    yasya samvriddidayakah | tejorupadharah pantu vancapurasuradrumah || 42|| dasha canye mahavarnah mantrarupa
    mahojjvalah | vyapakatvena pantvasmanapadatalamastakam || 43|| kartaviryah shirah patu lalatam haihayeshvarah
    | sumukho me mukham patu karnau vyaptajagattrayah || 44|| sukumaro hanum patu talau bhruyugalepi ca
    | nayane pundarikaksho nasikam me gunakarah || 45|| dantoshtau tu sada patu brahmageyah sanatanah
    | sarvashastrakaladharo jihvam cubukamavyayah || 46|| dattatreyapriyah karnau skandhau rajakuleshvarah
    | bhujau dashasyadarpaghno hridayam me mahabalah || 47|| kukshau rakshatu me vidvan vakshah parapuranjayah
    | karau sarvarthadah patu karagre trijagatpatih || 48|| revambulilasantripto jvaram me'bhirakshatu
    | mahavirastu me nabhim parshvau me sarvadushtaha || 49|| sahasrabhujadhrik prishtam saptadvipadhipah
    katim | guhyam jitendriyah patu sandhim no yogavallabhah || 50|| uru mahishmatinatha januni vallabho
    bhuvah | janghe viradhipah patu padau patu manojavah || 51|| patu sarvayudhadharah sarvangam sarvasandhishu
    | sarvadushtantakah patu dhatvashtakakalevaram || 52|| pranadi dashajiveshan sarvashishtheshtado'vatu
    | vashikritendriyagramo patu sarvendriyani me || 53|| romakurcani rajendrastvacam me'sadhyavigrahah
    | asthimamsadikam patu sarvakshudranivarakah || 54|| anuktamapi ca yatsthanam sharirantarbahishca
    yat | tatsarvam patu me sarvalokanatheshvareshvarah || 55|| vajrasarataram cedam shariram kavacavritam
    | badhashatavinirmuktamastu me bhayavarjitam || 56|| yadvidam kavacam divyamabhedyam haihayeshituh
    | vicarami divaratrau nirbhayenantaratmana || 57|| rajamarge bhaye durge marge coradisankule | vishame
    vipine ghore davagnau girikandhare || 58|| sangrame shatrusambadhe simhavyaghranipatane | gahvare
    sarpasankirne deshe coraganavrite || 59|| sarvasvaharane prapte prapte pranasya sankate | nana rogajvaraveshe
    pishacapretapatane || 60|| mariduhsvapnapidasu klishtavishvasaghatake | sharire ca mahaduhkhe manase
    ca mahajvare || 61|| adhivyadhibhaye vighne mantropadravake'pi ca | na bhavettu bhayam kincitkavacenavritasya
    me || 62|| agantukamanakhilanasmadvastu vilumpakan | nivarayatu dordandasahasrena maharathah || 63||
    svakarodadritasahasrapashabandhan sudurjayan | samruddhagatisamarthyan karotu kritaviryajah || 64||
    srinisahasranirbhinnansahasrasharakhanditan | rajacudamanih kshipram karotvasmadvirodhakan || 65||
    khadgasahasradalitan sahasramusalarditan | coradidushtasarvaughan karotu kamalekshanah || 66|| svashankhanadasantrastan
    sahasraravidaritan | karotu dushtasatvaughan sahasrarassahasradhrik || 67|| kritavirya suto raja sahasrabhujamandalah
    | avataro haressakshatpalayetsakalam mama || 68|| kartaviryarjuno nama rajabahusahasravan | tasya
    samsmaranadeva hritam nashtam ca labhyate || 69|| dhanuh pancashatam vame dakshine tavatah sharan
    | bibhranah kartaviryo'sau palayetsakalam mama || 70|| yad bhavellokarakshartham amshaccakram harervibhoh
    | tannamami mahaviryamarjunam kritaviryajam || 71|| kartavirya mahavirya sarvashatruvinashana | sarvatra
    sarvada tishthan corannashaya pahimam || 72|| uttishta dushtadamana saptadvipaikapalaka | tvameva
    sharanam praptam sarvartadraksha pahimam || 73|| dushtaghna kim tvam svapishi kim tishtasi cirapadi
    | pahi nah sarvada sarvam bhayebhyah svasutani ca || 74|| ye cora vasuhartaro dushta ye ca himsrakah
    | antarayakara dushtah chadmakah ye duratmakah || 75|| durhrido dushtabhupala dushtamatyashca ghatakah
    | ye ca karyaviluptaro ye khalah paripanthinah || 76|| sarvasvaharana ye ca mahamayavino'pi ye | mahakleshakara
    mleccha dasyavo vrishalashca ye || 77|| ye mahagaradataro vancakah shashtrapanayah | ye papa dushtakarmano
    duhkhada dushtabuddhayah || 78|| vyajakah kupathasakta ye ca nanabhayapradah | chidranveshakara nityam
    ye'smanbadhitumudyatah || 79|| te savai kartaviryasya mahashankharavaddhatah | sahasa vilayam yantu
    duradeva vimohitah || 80|| ye danava mahadaitya ye yaksha ye ca rakshasah | pishaca ye mahasatva ye
    bhuta brahmarakshasah || 81|| apasmaragraha ye ca ye graha pishitashinah | mahalohitabhoktaro vetala
    ye ca guhyakah || 82|| gandharvapsarasassiddhah ye ca devadiyonayah | dakinyo dhonasah preta kshetrapala
    vinayakah || 83|| mahavyaghramukhah krurah mahaturagamurtayah | mahavyaghra mahameshah mahamahishasannibhah
    || 84|| maharajo mahasimhah mahabhallukasannibhah | rikshavarahashunakavanaralukamurtayah || 85||
    mahoshtrakharamarjarasarpago vishapucchakah | nanarupamahasatvah nanakleshasahasradhah || 86|| nanarogakarah
    kshudra nanaviryah mahabalah | vataka paittika ghorashshleshmikassakshipatikah || 87|| maheshvara
    vaishnavashca vairincashca mahajvarah | skanda vainayakah krurah ye ca manmathasamjnikah || 88|| mahashatrugraha
    raudra mahamarimasurikah | ekahnika dvyahnikashca tryahnikashca mahajvarah || 89|| saptahikah pakshikashca
    masashanmasikashca ye | samvatsara durnivaryah jvarah paramadarunah || 90|| svapnikashca mahotpatah
    ye ca duhsvapnaja grahah | kushmanda bhairava bhimah dhonasa nidhivancakah || 91|| bhramakah pranahantaro
    ye ca balagrahadayah | manobuddhindriyaharah sphotakashca mahagrahah || 92|| mahashana balibhujo mahakunapabhojanah
    | divacara ratricarah ye ca sandhyasu darunah || 93|| pramattamapramattam ca ye mam badhitumudyatah
    | te sarve haihayendrasya dhanurmuktashshararditah || 94|| sahasradha pranashyantu bhagnasatvabalodyamah
    | ye sarpa ye mahanagah mahagirivileshayah || 95|| kalavyala mahadamshtra mahajagarasamjnikah | anantagulikadyashca
    drigvishashva mahabhayah || 96|| anekashatavarshashca khadgapucchashca darunah | mahavishajalukashca
    vrishcika raktapucchakah || 97|| ashivishah kalakutah mahahalahalahvayah | jalasarpa jalavyala jalagrahashca
    kacchapah || 98|| matsyaka vishapuccha ye canye jalanivasinah | jalaja sthalajashcaiva nanabhedakulodbhavah
    || 99|| ye ca shadbindavo lutah bhramarah shulapucchakah | sthavara jangamashcaiva kritrimashca mahavishah
    || 100|| gupta viguptarupashca bhushikah grihagodhikah | krikalasa kulirashca ye canye yadasam ganah
    || 101|| smarana vishama ghora mahogravishasamjnikah | ye'smanbadhitumicchati shariraprananashakah
    || 102|| te sarve kartaviryasya khadga
  devanagari: सूर्येन्दुज्वलनप्रभम् । उदितादित्यसङ्काशं कुण्डलद्वयशोभितम् ॥ १९॥ महायोगबलैश्वर्यकीर्त्याक्रान्तजगत्त्रयम्
    । श्रीमच्चक्रं हरेरंशादवतीर्णं महाबलम् ॥ २०॥ सम्यगात्माविभेदेन ध्यात्वा रक्षामुदीरयेत् । दत्तात्रेय
    ऋर्षिः प्रोक्तोऽनुष्टुप्छन्दः प्रकीर्तितम् ॥ २१॥ कार्तवीर्यार्जुनो विष्णुश्चक्रवर्ती च देवता । विनियोगश्च
    रक्षायै सर्वत्र परिकीर्तितः ॥ २२॥ सर्वशत्रुविनाशाय सर्वार्थस्य च सिद्धये । तस्यैव मूर्तयः पञ्च भानुमत्किरणोज्ज्वलाः
    ॥ २३॥ अग्नीशासुरवायव्यकोणेषु हृदयन्तिकाः । सर्वतस्तु ज्वलद्रूपा वरचर्मासिपाणयः ॥ २४॥ अव्याहतबलैश्वर्यशक्तिसामार्थ्यविग्रहाः
    । क्षेमङ्करीं शक्तियुक्तःचोराणां च विभञ्जनः ॥ २५॥ प्राचीं दिशं रक्षतु मे बाणबाणासनैर्युतः । श्रीकरीशक्तिसहितो
    मारीमदविभञ्जनः ॥ २६॥ शरचापधरः श्रीमान् दिशं मे पातु दक्षिणाम् । महावश्यकरी युक्तो शत्रूणां मदभञ्जनः
    ॥ २७॥ महेषुचापधृक् पातु मम प्राचेतसीं दिशम् । यशः करी यशस्करो दैत्यानां मदभञ्जनः ॥ २८॥ कोदण्डेषुधरस्सौम्यां
    दिशं मे परिरक्षतु । प्रज्ञाकरीयुतश्चापःबाणधृक् दुष्टशासनः ॥ २९॥ परिरक्षतु मां सम्यक् सम्यक् विदिशं
    चाग्निदेवताम् । विद्याकरी समायुक्तः सुमहान् दुष्टशासनः ॥ ३०॥ पातु मे नैरृतीं चापबाणो विदिशमीश्वरः
    । धनाकर्षणसमायुक्तो महादुरितनाशनः ॥ ३१॥ इष्वासनेषु दृक् पातु विदिशो मम वायवीम् । आयुष्कार्यायुतःश्रीमान्
    महाभयविनाशनः ॥ ३२॥ चापेषुधारीरौवीं मे विदिशं परिरक्षतु । विजयश्रीयुतस्साक्षात्साहस्त्रारधरो विभुः
    ॥ ३३॥ दिशमूर्ध्वामवतु मे महाभयविभञ्जनः । शङ्खभृत्सुमहाशक्तिस्सम्भूतो मे धरां दिशम् ॥ ३४॥ परिरक्षतु
    मे दुःखध्वान्तसम्भेदभास्करः । महाशोभाश्रयायुक्तः सर्वदिक्चक्रमण्डलः ॥ ३५॥ महायोगीश्वरः पातु सर्वतो
    मम पद्मधृक् । एतश्च कार्तवीर्यस्य शुक्लमाल्यांशुकावृताः ॥ ३६॥ प्रधानदेवतारूपाः पृथग्वररथस्थिताः ।
    शक्तयः पद्महस्ताश्च नीलेन्दीवरसन्निभाः ॥ ३७॥ शुक्लमाल्यसुवसना ललितास्तिलकोज्वलाः । तत्पार्श्वदेवताः
    स्वस्ववाहनायुधभूषणाः ॥ ३८॥ स्वस्वदिक्षु स्थिताः पान्तु मामिन्द्राद्या महाबलाः । एतास्तस्य समाख्याताः
    सर्वावरणदेवताः ॥ ३९॥ सर्वतो मां सदा पातु सर्वशक्तिसमन्विताः । हृदये चोदरे नाभौ जठरे गुह्यमण्डले ॥
    ४०॥ ऊरुयुग्जानुपादेषु मूर्ध्नि भ्रूयुगलेऽपि च । कर्णाक्षिनासिकाजिह्वाकण्ठबाहुयुगेषु च ॥ ४१॥ दशबीजात्मिकामन्त्राः
    यस्य संवृद्दिदायकाः । तेजोरूपधराः पान्तु वाञ्चापूरसुरद्रुमाः ॥ ४२॥ दश चान्ये महावर्णाः मन्त्ररूपा
    महोज्ज्वलाः । व्यापकत्वेन पान्त्वस्मानापादतलमस्तकम् ॥ ४३॥ कार्तवीर्यः शिरः पातु ललाटं हैहयेश्वरः ।
    सुमुखो मे मुखं पातु कर्णौ व्याप्तजगत्त्रयः ॥ ४४॥ सुकुमारो हनूं पातु तालौ भ्रुयुगलेपि च । नयने पुण्डरीकाक्षो
    नासिकां मे गुणाकरः ॥ ४५॥ दन्तोष्टौ तु सदा पातु ब्रह्मगेयः सनातनः । सर्वशास्त्रकलाधारो जिह्वां चुबुकमव्ययः
    ॥ ४६॥ दत्तात्रेयप्रियः कर्णौ स्कन्धौ राजकुलेश्वरः । भुजौ दशास्यदर्पघ्नो हृदयं मे महाबलः ॥ ४७॥ कुक्षौ
    रक्षतु मे विद्वान् वक्षः परपुरञ्जयः । करौ सर्वार्थदः पातु काराग्रे त्रिजगत्पतिः ॥ ४८॥ रेवाम्बुलीलासन्तृप्तो
    ज्वरं मेऽभिरक्षतु । महावीरस्तु मे नाभिं पार्श्वौ मे सर्वदुष्टहा ॥ ४९॥ सहस्रभुजधृक् पृष्टं सप्तद्वीपाधिपः
    कटिम् । गुह्यं जितेन्द्रियः पातु सन्धिं नो योगवल्लभः ॥ ५०॥ ऊरू माहिष्मतीनाथ जानुनी वल्लभो भुवः । जङ्घे
    वीराधिपः पातु पादौ पातु मनोजवः ॥ ५१॥ पातु सर्वायुधधरः सर्वाङ्गं सर्वसन्धिषु । सर्वदुष्टान्तकः पातु
    धात्वष्टककलेवरम् ॥ ५२॥ प्रणादि दशजीवेशान् सर्वशिष्ठेष्टदोऽवतु । वशीकृतेन्द्रियग्रामो पातु सर्वेन्द्रियाणि
    मे ॥ ५३॥ रोमकूर्चानि राजेन्द्रस्त्वचं मेऽसाध्यविग्रहः । अस्थिमांसादिकं पातु सर्वक्षुद्रनिवारकः ॥ ५४॥
    अनुक्तमपि च यत्स्थानं शरीरान्तर्बहिश्च यत् । तत्सर्वं पातु मे सर्वलोकनाथेश्वरेश्वरः ॥ ५५॥ वज्रासारतरं
    चेदं शरीरं कवचावृतम् । बाधाशतविनिर्मुक्तमस्तु मे भयवर्जितम् ॥ ५६॥ यद्विदं कवचं दिव्यमभेद्यं हैहयेशितुः
    । विचरामि दिवारात्रौ निर्भयेनान्तरात्मना ॥ ५७॥ राजमार्गे भये दुर्गे मार्गे चोरादिसङ्कुले । विषमे विपिने
    घोरे दावाग्नौ गिरिकन्धरे ॥ ५८॥ सङ्ग्रामे शत्रुसम्बाधे सिंहव्याघ्रनिपातने । गह्वरे सर्पसङ्कीर्णे देशे
    चोरगणावृते ॥ ५९॥ सर्वस्वहरणे प्राप्ते प्राप्ते प्राणस्य सङ्कटे । नाना रोगज्वरावेशे पिशाचप्रेतपातने
    ॥ ६०॥ मारीदुःस्वप्नपीडासु क्लिष्टविश्वासघातके । शरीरे च महादुःखे मानसे च महाज्वरे ॥ ६१॥ आधिव्याधिभये
    विघ्ने मान्त्रोपद्रवकेऽपि च । न भवेत्तु भयं किञ्चित्कवचेनावृतस्य मे ॥ ६२॥ आगन्तुकामानखिलानस्मद्वस्तु
    विलुम्पकान् । निवारयतु दोर्दण्डसहस्रेण महारथः ॥ ६३॥ स्वकरोददृतसाहस्रपाशबन्धान् सुदुर्जयान् । संरुद्धगतिसामर्थ्यान्
    करोतु कृतवीर्यजः ॥ ६४॥ सृणीसहस्रनिर्भिन्नान्सहस्रशरखण्डितान् । राजचूडामणिः क्षिप्रं करोत्वस्मद्विरोधकान्
    ॥ ६५॥ खड्गसाहस्रदलितान् सहस्रमुसलार्दितान् । चोरादिदुष्टसर्वौघान् करोतु कमलेक्षणः ॥ ६६॥ स्वशङ्खनादसन्त्रस्तान्
    सहस्रारविदारितान् । करोतु दुष्टसत्वौघान् साहस्रारस्सहस्रधृक् ॥ ६७॥ कृतवीर्य सुतो राजा सहस्रभुजमण्डलः
    । अवतारो हरेस्साक्षात्पालयेत्सकलं मम ॥ ६८॥ कार्तवीर्यार्जुनो नाम राजाबाहुसहस्रवन् । तस्य संस्मरणादेव
    हृतं नष्टं च लभ्यते ॥ ६९॥ धनुः पञ्चशतं वामे दाक्षिणे तावतः शरान् । बिभ्राणः कार्तवीर्योऽसौ पालयेत्सकलं
    मम ॥ ७०॥ यद् भवेल्लोकरक्षार्थं अंशाच्चक्रं हरेर्विभोः । तन्नमामि महावीर्यमर्जुनं कृतवीर्यजम् ॥ ७१॥
    कार्तवीर्य महावीर्य सर्वशत्रुविनाशन । सर्वत्र सर्वदा तिष्ठन् चोरान्नाशय पाहिमाम् ॥ ७२॥ उत्तिष्ट दुष्टदमन
    सप्तद्वीपैकपालक । त्वामेव शरणं प्राप्तं सर्वार्ताद्रक्ष पाहिमाम् ॥ ७३॥ दुष्टघ्न किं त्वं स्वपिषि किं
    तिष्टसि चिरापदि । पाहि नः सर्वदा सर्वं भयेभ्यः स्वसुतानि च ॥ ७४॥ ये चोरा वसुहर्तारो दुष्टा ये च हिंस्रकाः
    । अन्तरायकरा दुष्टाः छद्मकाः ये दुरात्मकाः ॥ ७५॥ दुर्हृदो दुष्टभूपाला दुष्टामात्याश्च घातकाः । ये
    च कार्यविलुप्तारो ये खलाः परिपन्थिनः ॥ ७६॥ सर्वस्वहरणा ये च महामायाविनोऽपि ये । महाक्लेशकरा म्लेच्छा
    दस्यवो वृषलाश्च ये ॥ ७७॥ ये महागरदातरो वञ्चकाः शश्त्रपाणयः । ये पापा दुष्टकर्माणो दुःखदा दुष्टबुद्धयः
    ॥ ७८॥ व्याजकाः कुपथासक्ता ये च नानाभयप्रदाः । छिद्रान्वेषकरा नित्यं येऽस्मान्बाधितुमुद्यताः ॥ ७९॥
    ते सवै कार्तवीर्यस्य महाशङ्खरवाद्धताः । सहसा विलयं यन्तु दूरादेव विमोहिताः ॥ ८०॥ ये दानवा महादैत्या
    ये यक्षा ये च राक्षसाः । पिशाचा ये महासत्वा ये भूता ब्रह्मराक्षसाः ॥ ८१॥ अपस्मारग्रहा ये च ये ग्रहा
    पिशिताशिनः । महालोहितभोक्तारो वेताला ये च गुह्यकाः ॥ ८२॥ गन्धर्वाप्सरसस्सिद्धाः ये च देवादियोनयः ।
    डाकिन्यो धोणसाः प्रेता क्षेत्रपाला विनायकाः ॥ ८३॥ महाव्याघ्रमुखाः क्रूराः महातुरगमूर्तयः । महाव्यघ्रा
    महामेषाः महामहिषसन्निभाः ॥ ८४॥ महाराजो महासिंहः महाभल्लूकसन्निभाः । ऋक्षवाराहशुनकवानरालूकमूर्तयः ॥
    ८५॥ महोष्ट्रखरमार्जारसर्पगो विषपुच्छकाः । नानारूपमहासत्वाः नानाक्लेशसहस्रधाः ॥ ८६॥ नानारोगकराः क्षुद्रा
    नानावीर्याः महाबलाः । वातका पैत्तिका घोराश्श्लेष्मिकास्साक्षिपातिकाः ॥ ८७॥ माहेश्वरा वैष्णवाश्च वैरिञ्चश्च
    महाज्वराः । स्कान्दा वैनायकाः क्रूराः ये च मन्मथसंज्ञिकाः ॥ ८८॥ महाशत्रुग्रहा रौद्रा महामारीमसूरिकाः
    । एकाह्निका द्व्याह्निकाश्च त्र्याह्निकाश्च महाज्वराः ॥ ८९॥ साप्ताहिकाः पाक्षिकाश्च मासषाण्मासिकाश्च
    ये । संवत्सरा दुर्निवार्याः ज्वराः परमदारुणाः ॥ ९०॥ स्वाप्निकाश्च महोत्पाताः ये च दुःस्वप्नजा ग्रहाः
    । कूष्माण्डा भैरवा भीमाः धोणसा निधिवञ्चकाः ॥ ९१॥ भ्रामकाः प्राणहन्तारो ये च बालग्रहादयः । मनोबुद्धीन्द्रियहराः
    स्फोटकाश्च महाग्रहाः ॥ ९२॥ महाशना बलिभुजो महाकुणपभोजनाः । दिवाचरा रात्रिचराः ये च सन्ध्यासु दारुणाः
    ॥ ९३॥ प्रमत्तमप्रमत्तं च ये मां बाधितुमुद्याताः । ते सर्वे हैहयेन्द्रस्य धनुर्मुक्तश्शरार्दिताः ॥
    ९४॥ सहस्रधा प्रणश्यन्तु भग्नसत्वबलोद्यमाः । ये सर्पा ये महानागाः महागिरिविलेशयाः ॥ ९५॥ कालाव्याला
    महादंष्ट्रा महाजगरसंज्ञिकाः । अनन्तगुलिकाद्याश्च दृग्विषाश्व महाभयाः ॥ ९६॥ अनेकशतवर्षाश्च खड्गपुच्छाश्च
    दारुणाः । महाविषजलूकाश्च वृश्चिका रक्तपुच्छकाः ॥ ९७॥ आशीविषाः कालकूटाः महाहालाहलाह्वयाः । जलसर्पा
    जलव्याला जलग्राहाश्च कच्छपाः ॥ ९८॥ मत्स्यका विषपुच्छा ये चान्ये जलनिवासिनः । जलजा स्थलजाश्चैव नानाभेदकुलोद्भवाः
    ॥ ९९॥ ये च षड्बिन्दवो लूताः भ्रमराः शूलपुच्छकाः । स्थावरा जङ्गमाश्चैव कृत्रिमाश्च महाविषाः ॥ १००॥
    गुप्ता विगुप्तारूपाश्च भूषिकाः गृहगोधिकाः । कृकलासा कुलीराश्च ये चान्ये यादसां गणाः ॥ १०१॥ स्मरणा
    विषमा घोरा महोग्रविषसंज्ञिकाः । येऽस्मान्बाधितुमिच्छति शरीरप्राणनाशकाः ॥ १०२॥ ते सर्वे कार्तवीर्यस्य
    खड्ग
