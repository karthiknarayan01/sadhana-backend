id: ganapatyatharvashirsham
category: stotram
name:
  english: ganapatyatharvashirsham
  devanagari: गणपत्यथर्वशीर्षम्
content:
  english: '|| 2 || ava tvam mam | ava vaktaram || ava shrotaram | ava dataram || ava dhataram | avanucanamava
    shishyam || ava pashcattat | ava purastat || avottarattat | ava dakshinattat || ava cordhvattat |
    avadharattat || sarvato mam pahi pahi samantat || 3 || tvam vangmayastvam cinmayah | tvamanandamayastvam
    brahmamayah || tvam saccidanandadvitiyo''si | tvam pratyaksham brahmasi || tvam jnanamayo vijnanamayo''si
    || 4 || sarvam jagadidam tvatto jayate | sarvam jagadidam tvattastishthati || sarvam jagadidam tvayi
    layameshyati | sarvam jagadidam tvayi pratyeti || tvam bhumirapo''nalo''nilo nabhah || tvam catvari
    vakpadani || 5 || tvam gunatrayatitah | tvamavasthatrayatitah | tvam dehatrayatitah || tvam kalatrayatitah
    | tvam muladharah sthitho''si nityam || tvam shaktitrayatmakah | tvam yogino dhyayanti nityam || tvam
    brahma tvam vishnustvam rudrastvamindrastvamagnistvam vayustvam suryastvam candramastvam brahmabhurbhuvahsvarom
    || 6 || || ganesha mantra || ganadim purvamuccarya varnadimstadanantaram | anusvarah paratarah ||
    ardhendulasitam | tarena riddham || etattava manusvarupam | gakarah purvarupam || akaro madhyamarupam
    | anusvarashcantyarupam || binduruttararupam | nadah sandhanam || samhitasandhih | saisha ganeshavidya
    || ganaka rishih | nicridgayatricchandah || ganapatirdevata || om gam ganapataye namah || 7 || ||
    ganesha gayatri || ekadantaya vidmahe vakratundaya dhimahi | tanno dantih pracodayat || 8 || || ganesha
    rupa || ekadantam caturhastam pashamankushadharinam | radam ca varadam hastairbibhranam mushakadhvajam
    || raktam lambodaram shurpakarnakam raktavasasam | raktagandhanuliptangam raktapushpaih supujitam
    || bhaktanukampinam devam jagatkaranamacyutam | avirbhutam ca srishtyadau prakriteh purushatparam
    || evam dhyayati yo nityam sa yogi yoginam varah || 9 || || ashta nama ganapati || namo vratapataye
    namo ganapataye namah pramathapataye namaste''stu lambodarayaikadantaya vighnanashine shivasutaya
    shrivaradamurtaye namo namah || 10 || || phalashruti || etadatharvashirsham yo''dhite | sa brahmabhuyaya
    kalpate || sa sarvatah sukhamedhate | sa sarva vighnairnabadhyate || sa pancamahapapatpramucyate |
    sayamadhiyano divasakritam papam nashayati || prataradhiyano ratrikritam papam nashayati | sayampratah
    prayunjano apapo bhavati || sarvatradhiyano''pavighno bhavati | dharmarthakamamoksham ca vindati ||
    idamatharvashirshamashishyaya na deyam | yo yadi mohaddasyati sa papiyan bhavati || sahasravartanadyam
    yam kamamadhite tam tamanena sadhayet || 11 || anena ganapatimabhishincati sa vagmi bhavati || caturthyamanashnan
    japati sa vidyavan bhavati | sa yashovan bhavati | ityatharvanavakyam || brahmadyacaranam vidyat na
    bibheti kadacaneti || 12 || yo durvankurairyajati sa vaishravanopamo bhavati | yo lajairyajati sa
    yashovan bhavati || sa medhavan bhavati | yo modakasahasrena yajati || sa vanchitaphalamavapnoti |
    yah sajyasamidbhiryajati || sa sarvam labhate sa sarvam labhate || 13 || ashtau brahmanan samyaggrahayitva
    suryavarcasvi bhavati | suryagrahe mahanadyam pratimasannidhau va japtva siddhamantro bhavati || mahavighnatpramucyate
    | mahadoshatpramucyate || mahapapat pramucyate | sa sarvavidbhavati sa sarvavidbhavati || ya evam
    veda ityupanishat || 14 || || shanti mantra || om sahanavavatu | sahanaubhunaktu || saha viryam karavavahai
    | tejasvinavadhitamastu ma vidvishavahai || om bhadram karnebhih shrinuyama devah | bhadram pashyemakshabhiryajatrah
    || sthirairangaistushtuvamsastanubhih | vyashema devahitam yadayuh || om svasti na indro vriddhashravah
    | svasti nah pusha vishvavedah || svastinastarkshyo arishtanemih | svasti no brihaspatirdadhatu ||
    om shantih shantih shantih || || iti shriganapatyatharvashirsham samaptam ||'
  devanagari: ॥ २ ॥ अव त्वं माम् । अव वक्तारम् ॥ अव श्रोतारम् । अव दातारम् ॥ अव धातारम् । अवानूचानमव शिष्यम्
    ॥ अव पश्चात्तात् । अव पुरस्तात् ॥ अवोत्तरात्तात् । अव दक्षिणात्तात् ॥ अव चोर्ध्वात्तात् । अवाधरात्तात्
    ॥ सर्वतो मां पाहि पाहि समन्तात् ॥ ३ ॥ त्वं वाङ्ग्मयस्त्वं चिन्मयः । त्वमानन्दमयस्त्वं ब्रह्ममयः ॥
    त्वं सच्चिदानन्दाद्वितीयोऽसि । त्वं प्रत्यक्षं ब्रह्मासि ॥ त्वं ज्ञानमयो विज्ञानमयोऽसि ॥ ४ ॥ सर्वं
    जगदिदं त्वत्तो जायते । सर्वं जगदिदं त्वत्तस्तिष्ठति ॥ सर्वं जगदिदं त्वयि लयमेष्यति । सर्वं जगदिदं
    त्वयि प्रत्येति ॥ त्वं भूमिरापोऽनलोऽनिलो नभः ॥ त्वं चत्वारि वाक्पदानि ॥ ५ ॥ त्वं गुणत्रयातीतः । त्वमवस्थात्रयातीतः
    । त्वं देहत्रयातीतः ॥ त्वं कालत्रयातीतः । त्वं मूलाधारः स्थिथोऽसि नित्यम् ॥ त्वं शक्तित्रयात्मकः ।
    त्वां योगिनो ध्यायन्ति नित्यम् ॥ त्वं ब्रह्मा त्वं विष्णुस्त्वं रुद्रस्त्वमिन्द्रस्त्वमग्निस्त्वं
    वायुस्त्वं सूर्यस्त्वं चन्द्रमास्त्वं ब्रह्मभूर्भुवःस्वरोम् ॥ ६ ॥ ॥ गणेश मन्त्र ॥ गणादिं पूर्वमुच्चार्य
    वर्णादींस्तदनन्तरम् । अनुस्वारः परतरः ॥ अर्धेन्दुलसितम् । तारेण ऋद्धम् ॥ एतत्तव मनुस्वरूपम् । गकारः
    पूर्वरूपम् ॥ अकारो मध्यमरूपम् । अनुस्वारश्चान्त्यरूपम् ॥ बिन्दुरुत्तररूपम् । नादः सन्धानम् ॥ संहितासन्धिः
    । सैषा गणेशविद्या ॥ गणक ऋषिः । निचृद्गायत्रीच्छन्दः ॥ गणपतिर्देवता ॥ ॐ गं गणपतये नमः ॥ ७ ॥ ॥ गणेश
    गायात्री ॥ एकदन्ताय विद्महे वक्रतुण्डाय धीमहि । तन्नो दन्तिः प्रचोदयात् ॥ ८ ॥ ॥ गणेश रूप ॥ एकदन्तं
    चतुर्हस्तं पाशमङ्कुशधारिणम् । रदं च वरदं हस्तैर्बिभ्राणं मूषकध्वजम् ॥ रक्तं लम्बोदरं शूर्पकर्णकं रक्तवाससम्
    । रक्तगन्धानुलिप्ताङ्गं रक्तपुष्पैः सुपूजितम् ॥ भक्तानुकम्पिनं देवं जगत्कारणमच्युतम् । आविर्भूतं च
    सृष्ट्यादौ प्रकृतेः पुरुषात्परम् ॥ एवं ध्यायति यो नित्यं स योगी योगिनां वरः ॥ ९ ॥ ॥ अष्ट नाम गणपति
    ॥ नमो व्रातपतये नमो गणपतये नमः प्रमथपतये नमस्तेऽस्तु लम्बोदरायैकदन्ताय विघ्ननाशिने शिवसुताय श्रीवरदमूर्तये
    नमो नमः ॥ १० ॥ ॥ फलश्रुति ॥ एतदथर्वशीर्षं योऽधीते । स ब्रह्मभूयाय कल्पते ॥ स सर्वतः सुखमेधते । स सर्व
    विघ्नैर्नबाध्यते ॥ स पञ्चमहापापात्प्रमुच्यते । सायमधीयानो दिवसकृतं पापं नाशयति ॥ प्रातरधीयानो रात्रिकृतं
    पापं नाशयति । सायम्प्रातः प्रयुञ्जानो अपापो भवति ॥ सर्वत्राधीयानोऽपविघ्नो भवति । धर्मार्थकाममोक्षं
    च विन्दति ॥ इदमथर्वशीर्षमशिष्याय न देयम् । यो यदि मोहाद्दास्यति स पापीयान् भवति ॥ सहस्रावर्तनाद्यं
    यं काममधीते तं तमनेन साधयेत् ॥ ११ ॥ अनेन गणपतिमभिषिञ्चति स वाग्मी भवति ॥ चतुर्थ्यामनश्नन् जपति स विद्यावान्
    भवति । स यशोवान् भवति । इत्यथर्वणवाक्यम् ॥ ब्रह्माद्याचरणं विद्यात् न बिभेति कदाचनेति ॥ १२ ॥ यो दूर्वाङ्कुरैर्यजति
    स वैश्रवणोपमो भवति । यो लाजैर्यजति स यशोवान् भवति ॥ स मेधावान् भवति । यो मोदकसहस्रेण यजति ॥ स वाञ्छितफलमवाप्नोति
    । यः साज्यसमिद्भिर्यजति ॥ स सर्वं लभते स सर्वं लभते ॥ १३ ॥ अष्टौ ब्राह्मणान् सम्यग्ग्राहयित्वा सूर्यवर्चस्वी
    भवति । सूर्यग्रहे महानद्यां प्रतिमासन्निधौ वा जप्त्वा सिद्धमन्त्रो भवति ॥ महाविघ्नात्प्रमुच्यते ।
    महादोषात्प्रमुच्यते ॥ महापापात् प्रमुच्यते । स सर्वविद्भवति स सर्वविद्भवति ॥ य एवं वेद इत्युपनिषत्
    ॥ १४ ॥ ॥ शान्ति मन्त्र ॥ ॐ सहनाववतु । सहनौभुनक्तु ॥ सह वीर्यं करवावहै । तेजस्विनावधीतमस्तु मा विद्विषावहै
    ॥ ॐ भद्रं कर्णेभिः शृणुयाम देवाः । भद्रं पश्येमाक्षभिर्यजत्राः ॥ स्थिरैरङ्गैस्तुष्टुवांसस्तनूभिः ।
    व्यशेम देवहितं यदायुः ॥ ॐ स्वस्ति न इन्द्रो वृद्धश्रवाः । स्वस्ति नः पूषा विश्ववेदाः ॥ स्वस्तिनस्तार्क्ष्यो
    अरिष्टनेमिः । स्वस्ति नो बृहस्पतिर्दधातु ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ ॥ इति श्रीगणपत्यथर्वशीर्षं
    समाप्तम् ॥
