id: gangasamrajyakavacam-shivashivanandanathaviracitam
category: kavacha
name:
  english: gangasamrajyakavacam (shivashivanandanathaviracitam)
  devanagari: गङ्गासाम्राज्यकवचम् (शिवशिवानन्दनाथविरचितम्)
content:
  english: dharmarthakamamoksharthe jape vinayogah | om shiro me pranavah patu sarvasiddhikarishvari ||
    5|| ai~ bijam mem shikham patu ganga trailokyasundari | hrinkari mastake me'vyallikaram me lalatake
    || 6|| punah patu mahamaya hikari paradevata || 7|| mikari mukhamadhye tu likari shrotrayormama |
    kanthamadhye sada patu mikari vagvilasini || 8|| likari hridayam rakshedgange papapaharini || stanadvandve
    sada me'vyanmankari parameshvari || 9|| pakari parshvayoh patu vakaram nabhideshake | yakaram me katim
    patu pakari lingadeshake || 10|| punah pakaram me patu guhyadeshe nirantaram | vakaram janghayoh patu
    pakaram mama januni || 11|| svakaram gulphayoh patu hakaram padayoh sada | sarvangam me sada patu
    ganga savarthasiddhida || 12|| itidam kavacam divyam brahmavidyakalevaram | pathanadbrahmasayujyam
    prapnuyannatra samshayah || 13|| saptamyam va caturdashyam sankrantau grahane tatha | yah pathennityakrid
    bhaktya sarvasiddhishvaro bhavet || 14|| idam kavacamajnatva gangam yo bhajate'dhamah | janmajanma
    bhavenmurkho daridro vyadhisamyutah || 15|| tasmadavashyametattu yah pathennityameva hi | sarvasampadyuto
    bhutva brahmasayujyamapnuyat || 16|| iti shrishivashivanandanathaviracitam shrigangasamrajyakavacam
    |
  devanagari: धर्मार्थकाममोक्षार्थे जपे विनयोगः । ॐ शिरो मे प्रणवः पातु सर्वसिद्धिकरीश्वरी ॥ ५॥ ऐँ बीजं
    में शिखां पातु गङ्गा त्रैलोक्यसुन्दरी । ह्रिङ्कारी मस्तके मेऽव्याल्लिकारं मे ललाटके ॥ ६॥ पुनः पातु
    महामाया हिकारी परदेवता ॥ ७॥ मिकारी मुखमध्ये तु लिकारी श्रोत्रयोर्मम । कण्ठमध्ये सदा पातु मिकारी वाग्विलासिनी
    ॥ ८॥ लिकारी हृदयं रक्षेद्गङ्गे पापापहारिणी ॥ स्तनद्वन्द्वे सदा मेऽव्यान्माङ्कारी परमेश्वरी ॥ ९॥ पाकारी
    पार्श्वयोः पातु वकारं नाभिदेशके । यकारं मे कटिं पातु पाकारी लिङ्गदेशके ॥ १०॥ पुनः पाकारं मे पातु गुह्यदेशे
    निरन्तरम् । वकारं जङ्घयोः पातु पकारं मम जानुनी ॥ ११॥ स्वाकारं गुल्फयोः पातु हाकारं पादयोः सदा । सर्वाङ्गं
    मे सदा पातु गङ्गा सवार्थसिद्धिदा ॥ १२॥ इतीदं कवचं दिव्यं ब्रह्मविद्याकलेवरम् । पठनाद्ब्रह्मसायुज्यं
    प्राप्नुयान्नात्र संशयः ॥ १३॥ सप्तम्यां वा चतुर्दश्यां सङ्क्रान्तौ ग्रहणे तथा । यः पठेन्नित्यकृद्
    भक्त्या सर्वसिद्धीश्वरो भवेत् ॥ १४॥ इदं कवचमज्ञात्वा गङ्गां यो भजतेऽधमः । जन्मजन्म भवेन्मूर्खो दरिद्रो
    व्याधिसंयुतः ॥ १५॥ तस्मादवश्यमेतत्तु यः पठेन्नित्यमेव हि । सर्वसम्पद्युतो भूत्वा ब्रह्मसायुज्यमाप्नुयात्
    ॥ १६॥ इति श्रीशिवशिवानन्दनाथविरचितं श्रीगङ्गासाम्राज्यकवचम् ।
