    तस्मा॑द्य॒ज्ञात्स॑र्व॒हुत॒ म्पृषदा॒ज्यम् । प॒शू ण्श्च॑क्रे वाय॒व्या॒नार॒ण्या ग्रा॒म्याश्च॒ ये ॥ ॥
    तस्मा॑द्य॒ज्ञात्स॑र्व॒हुत॒ ऋच॒ स्सामा॑नि जज्ञिरे । छन्दा॑ग्ंसि जज्ञिरे॒ तस्मा॒द्यजु॒स्तस्मा॑दजायत
    ॥ ॥ तस्मा॒दश्वा॑ अजायन्त॒ ये के चो॑भ॒याद॑तः । गावो॑ ह जज्ञिरे॒ तस्मा॒त्तस्मा॑ज्जा॒ता अ॑जा॒वयः॑ ॥ हिषि॒
