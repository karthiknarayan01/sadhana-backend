id: kytb-1-8-rajasuyanubrahmanam-krishna-yajurveda-taittiriya-brahmana-patha-varunasya-sushuvanasya
category: stotram
name:
  english: KYTB 1.8 Rajasuyanubrahmanam - Krishna Yajurveda Taittiriya Brahmana Patha - Varunasya Sushuvanasya
content:
  english: krishna yajurvediya taittiriya brahmane prathamashtake ashtamah prapathakah rajasuyanubrahmanam
    o shri gurubhyo namah | harih om || anuvakam samsripam havimshi dasha varunasya sushuvanasya dashadhendriyam
    'patat | tathsagm sridbhiranu samasarpat | tathsagm sripagm sagm srittvam | agnina devena prathame
    'hannanu prayunkta | sarasvatya vaca dvitiye | savitra prasavena tritiye | pushna pashubhishcaturthe
    | brihaspatina brahmana pancame | indrena devena shashthe | varunena svaya devataya saptame || 'shtame
    | tvashtra rupena navame | vishnuna yajnena pnot | yathsagm sripo bhavanti | indriyameva ta ya~jamana
    apnoti | purva purva vedirbhavati | indriyasya viryasyavaruddhyai | purasta dupasadagm saumyena pracarati
    | somo vai retodhah | reta eva ta ddadhati | antara tvashtrena | reta eva hita ntvashta rupani vikaroti
    | uparishta dvaishnavena | yajno vai vishnuh | yajna evantatah prati tishthati || tkurvanti | yathsadyo
    dikshayanti sadya nkrinanti | pundarisraja mprayacchatyajamitvaya | angirasa kshatapasi praveshayann
    | ta mprayacchati | sakshadeva di kshatapasi avarundhe | dashabhirvathsatarai vi~rat | virajaivannadyamava
    rundhe | mushkara bhavanti sendratvaya | dashapeyo bhavati | annadyasyavaruddhyai | shata hmanah pibanti
    | shatayuh purusha shshatendriyah | ayushyevendriye prati tishthati | saptadashagg mbhavati | saptadashah
    prajapatih || || prajapateraptyai | prakashavaddhvaryave dadati | prakasha dgatre | vyevasmai vasayati
    | rukmagm hotre | adityamevasma unnayati | ashva mprastotripratihartribhya m | prajapatyo va ashvah
    | prajapateraptyai travarunaya | rashtrameva vashyakah | rishabha mevendriyavyakah | vasasi neshtapotribhya
    m | pavitre evasyaite | sthuri yavacita macchavakaya | antata eva varunamava yajate || | vahnirva
    anadvan | vahniragnit | vahninaiva vahni yajnasyavarundhe | indrasya sushuvanasya tredhendriyam mabhavat
    | shrayantiya ntritiyam | sarasvati tritiyam | bhargavo hota bhavati | shrayantiya mbhavati | varavantiya
    samam | sarasvatirapo grihnati | indriyasya viryasyava ruddhyai | shrayantiya mbhavati | indriyamevasmin
    viryagg shrayati | varavantiya samam | indriyamevasmin viryam rashvah prajapateraptyai satyadutahavimshi
    ca ishvaro va esha disho 'nu vyasthapayanti | dishamave shtayo bhavanti | dikshveva prati tishthatyanunmadaya
    | panca devata yajati | panca dishah | dikshveva prati tishthati | havisho havisha ishtva bar mabhigharayati
    | yajamanadevatyo vai brihaspatih | yajamanameva tejasa samardhayati || ngarbhinima labhate | maruti
    ncaivasmai rashtra nca samici dadhati | adityaya purvaya pracarati | marutyottaraya | rashtra eva
    vishamanubaddhnati | uccairadityaya ashravayati | upagmshu marutyai | tasma vi~shamativadati | garbhinyaditya
    bhavati || vai~ garbhah | rashtra mevendriyavyakah | agarbha maruti | vidvai marutah | vishameva nirindriyamakah
    | devasura ya~tta asann | te deva ashvinoh ssatyagm sanindhaya | anritenasura mpushne purodasha nniravapann
    | tato vai te vaca mpushne purodasha nnirvapati | anritenaiva bhratrivya ssatyamavarundhe | sarasvate
    satyavace carum | purvamevoditam | uttarenabhi grinati | savitre satyaprasavaya purodasha prahinoti
    | avida eta bhavanti | avidamevaina ngamayanti | atho dutebhya eva na chidyate | tisridhanvagm shushkadriti
    rdakshina samriddhyai || prayujam havimshi dvadasha agneya nnirvapati | tasma cchishire kurupancalah
    pranco yanti | saumya vya~vasayadayanti | savitra ndvadashakapalam | tasma dyavanagm savitra virundhate
    | barhaspatya ncarum | savitraiva viruddhya | brahmana yavanadadhate | tvashtra || rupanyeva tena
    kurvate | vaishvanara ndvadashakapalam | tasma jjaghanye naidaghe pratyancah kurupancala ya pravrishi
    sarva vaco vadanti | paushnena vyavasyanti | maitrena krishante | varunena vidhrita asate | kshaitrapatyena
    pacayante | adityenadadhate || syetani havigmshi nirupyanityahuh | tenaivartun prayunkta iti | atho
    khalvahuh | ka njivishyatiti | shadeva pu rvedyurnirupyani | shaduttaredyuh | tenaivartun prayunkte
    | dakshino rathavahanavahah purvesha ndakshina | uttara uttaresham | sam va~thsarasyaivantau yunakti
    | suvargasya lokasya samashtyai || tvashtramashtakapalam havimshi ca indrasya sushuvanasya dashadhendriyam
    nnirashthivat | tat karkandhu | yannastah | sa sigmhah | yadakshyoh karnayoh | sa vrikah | ya urdhvah
    | sa somah | ya 'vaci | sa sura ssaktavo bhavanti | indriyasyava ruddhyai | trayani lomani || || tvishimevava
    rundhe | trayo grahah | viryamevava rundhe | namna dashami | nava vai purushe pranah | nabhirdashami
    | prana indriyam m | prananevendriyam dhatte | sisena klibacchashpani krinati | na va etadayo na hiranyam
    || m | na stri na puman | yat klibah | na somo na sura tramani samriddhyai | svadvi svadunetyaha |
    somamevaina mpacyasva sarasvatyai pacyasvendraya sutramne pacyasvetyaha | etabhyo hyesha devata bhyah
    pacyate | tisra ssagmsrishta vasati || || tisro hi ratrih ssomo vasati | punatu te parisrutamiti yajusha
    punati vyavrittyai | pavitrena punati | pavitrena hi soma mpunanti | varena shashvata tanetyaha |
    varena hi soma mpunanti |vayuh putah pavitreneti naitaya puniyat | vyriddha hyesha | atipavitasyaitaya
    puniyat | kuvidange tyaniruktaya prajapatyaya grihnati || || aniruktah prajapatih | prajapateraptyai
    | ekayarca grihnati | ekadhaiva yajamane virya ndhumrama labhate | ashvinau vai devana | tabhyamevasmai
    bheshaja nkaroti | sarasvata mmesham | vagvai sarasvati | vacaivaina mbhishajyati | aindramrishabhagm
    se labheta | bahirdha 'smadindriyam ndadhyat | bhratrivyamasmai janayet | ekayupa alabhate | ekadhaivasmi
    ndadhati | nasmai bhratrivya mpurodasha bhavanti | grahapurodasha hyete | yuvagm suramamashvineti
    sarvadevatye yajyanuvakye bhavatah | sarva eva devatah duccheshanasya patara m | brahmano hyahutya
    uccheshanasya pata | yadi brahmana nna vindet | valmikavapayamava nayet | saiva tatah prayashcittih
    | ya tramanyai vyriddham | tadasyai samriddham | nanadevatyah shca bhavanti samriddhyai | aindrah
    pashunamuttamo bhavati | aindrah purodashana || indriye evasmai samici dadhati | purasta mpurodashaih
    pracarati | pashavo vai purodashah | pashunevava rundhe | aindra nnirvapati | indriyamevava ndashakapalam
    | antata eva varunamava yajate | vadaba dakshina || 'shvagm sute | utashvataram | uta soma uta sura
    tramani samriddhyai | barhaspatya matipavitasyalabhate | brahma vai devana mbrihaspatih | brahmanaiva
    yajnasya vyriddhamapi vapati | purodashavanesha pashurbhavati | na hyetasya graha ngrihnanti | somapratikah
    pitara stripnuteti shatatrinnayagm samavanayati || shshatendriyah | ayushyevendriye pratitishthati
    | dakshine 'gnau juhoti | papavasyasasya vyavrittyai | hiranyamantara dharayati | putamevaina mbhavati
    | shatayuh purusha shshatendriyah | ayushyevendriye prati tishthati | yatraiva shatatrinna || tannidadhati
    pratishthityai | pitrin ngacchati | yagm somo 'tipavate | pitrinam nuvakyabhirupa tishthate | yadevasya
    pitrinindriyam ngacchati | tadevava rundhe | tisribhirupa tishthate | tritiye va ito loke pitarah
    | taneva prinati | atho trini vai yajnasye ndriyani | addhvaryur brahma | ta upatishthante | yanyeva
    yajnasye ndriyani | tairevasmai bheshaja tindriyani catvari ca rajasuyasyagre kartavya mpavitrakhyamagnishtomamahah
    agnishtomamagra aharati | yajnamukham va~ agnishtomah | yajnamukhamevarabhya savamakramate | athaisho
    shcatustrigmshapavamano bhavati | trayastrigmshadvai devatah | ta evapnoti | prajapati shcatustrigmshah
    | tamevapnoti | sagmshara esha stomanamayathapurvam | ya vai yajnah | yavan thsamah pavamanah | tenasagmsharah
    | tena yathapurvam | atmanai vagnishtomenardhnoti | atmana punyo bhavati | praja va ukthani | pashava
    ukthani | yadukthyo bhavatyanu santatyai || abhishecaniye samamantravisheshah upa tva jamayo gira
    iti pratipadbhavati | vagvai vayuh | vaca evaisho 'bhishekah | sarvasameva prajanagm suyate | sarva
    ena mpraja rajeti vadanti | etamu tya ndashakshipa ityaha | aditya vai prajah | prajanamevaitena suyate
    | yanti va ete yajnamukhat | ye sambharya akrann || || yadaha pavasva vaco agriya iti | tenaiva yajnamukha
    nnayanti | anushtuk prathama bhavati | anushtu guttama | vagva anushtuk | vacaiva prayanti | vacodyanti
    | udvati rbhavanti | udvadva anushtubho rupam | anushtubho rajanyah || rbhavanti | sauryanushtu guttama
    bhavati | suvargasya lokasya santatyai | yo vai savadeti | nainagm sava upanamati | ya ssamabhya eti
    | papiyan thsushuvano bhavati | etani khalu vai samani | yatprishthani | yatprishthani bhavanti ||
    || taireva savannaiti | yani devarajanagm samani | tairamushmin ~loka riddhnoti | yani manushyarajanagm
    samani | tairasmin ~loka riddhnoti | ubhayoreva lokayor riddhnoti | devaloke ca manushyaloke ca |
    ekavigmsho 'bhishecaniya syottamo bhavati | ekavigmshah keshavapaniyasya prathamah | saptadasho dashapeyah
    || || vidva ekavigmshah | rashtragm saptadashah | visha evaita 'bhishicyate | tasmadva esha visha
    mpriyah | visho hi maddhyato | yadva enamado disho 'nu vyasthapayanti | ta mabhyarohati | yadimam
    ve~yat | udva madyet | yadesha praticina stomo bhavati | imameva tena loka mpratyavarohati | atho
    asminneva loke prati tishthatya abhishecaniyavishayayo rukmayo vai~ rajata | asau harini | ya drukmau
    bhavatah | abhyamevaina mubhayatah pari grihnati | varunasya va abhishicyamanasyapah | indriyam thsuvarnagm
    hiranya rdadhati | indriyasya viryasyanirghataya | shatamano bhavati shataksharah | shatayuh purusha
    shshatendriyah | ayushyevendriye prati tishthati | ayurvai hiranyam | ayushya evaina mabhyati ksharanti
    | tejo vai hiranyam | tejasya evainamabhyati ksharanti | varco vai hiranyam | varcasya evainamabhyati
    ksharanti || vyushtidviratram rajasuyante kartavyam apratishthito va esha ityahuh | yo rajasuyena
    yajata iti | yada va esha etena dviratrena yajate | atha pratishtha | atha sam pnoti | yavanti sam
    horatrani | tavatiretasya stotriyah | ahoratreshveva prati tishthati | agnishtomah purvamaha rbhavati
    | atiratra uttaram || || nanaivahoratrayoh prati tishthati | paurnamasya rbhavati | vyashtakaya muttaram
    | nanaivardha masayoh pratitishthati | amavasyaya rbhavati | uddrishta uttaram | nanaiva masayoh prati
    tishthati | atho khalu | ye eva samanapakshe punyahe syata || apashavyo dviratra ityahuh | dve hyete
    chandasi | gayatra nca | jagatimantaryanti | na tena jagati kritetyahuh | yadena ntritiyasavane kurvantiti
    | yada va esha rbhajate | sahnasya va savanam | athaiva jagati krita | atha pashavyah | vyushtirva
    esha dviratrah | ya evam ndviratrena yajate | vyevasma ucchati | atho tama evapahate | agnishtoma
    mantata aharati | agni sveva prati tishthati || prati tishthati | || harih om || || krishna yajurvediya
    taittiriya brahmane prathamashtake ashtamah prapathaka ssamaptah || || krishna yajurvediya taittiriya
    brahmane prathamashtakam samaptam ||
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय ब्राह्मणे प्रथमाष्टके अष्टमः प्रपाठकः राजसूयानुब्राह्मणं ओ श्री
    गुरुभ्यो नमः । ह॒रिः॒ ओम् ॥ अनुवाकं संसृपां हवींषि दश वरु॑णस्य सुषुवा॒णस्य॑ दश॒धेन्द्रि॒यं ऽपतत् ।
    तथ्स॒ग्ं॒ सृद्भि॒रनु॒ सम॑सर्पत् । तथ्स॒ग्ं॒ सृपाग्ं॑ सग्ं सृ॒त्त्वम् । अ॒ग्निना॑ दे॒वेन॑ प्रथ॒मे ऽह॒न्ननु॒
    प्रायु॑ङ्क्त । सर॑स्वत्या वा॒चा द्वि॒तीये । स॒वि॒त्रा प्र॑स॒वेन॑ तृ॒तीये । पू॒ष्णा प॒शुभि॑श्चतु॒र्थे
    । बृह॒स्पति॑ना॒ ब्रह्म॑णा पञ्च॒मे । इन्द्रे॑ण दे॒वेन॑ ष॒ष्ठे । वरु॑णेन॒ स्वया॑ दे॒वत॑या सप्त॒मे ॥
    ऽष्ट॒मे । त्वष्ट्रा॑ रू॒पेण॑ नव॒मे । विष्णु॑ना य॒ज्ञेना प्नोत् । यथ्स॒ग्ं॒ सृपो॒ भव॑न्ति । इ॒न्द्रि॒यमे॒व
    त यँज॑मान आप्नोति । पूर्वा॑ पूर्वा॒ वेदि॑र्भवति । इ॒न्द्रि॒यस्य॑ वी॒र्य॑स्याव॑रुद्ध्यै । पु॒रस्ता॑
    दुप॒सदाग्ं॑ सौ॒म्येन॒ प्रच॑रति । सोमो॒ वै रे॑तो॒धाः । रेत॑ ए॒व त द्द॑धाति । अ॒न्त॒रा त्वा॒ष्ट्रेण॑
    । रेत॑ ए॒व हि॒त न्त्वष्टा॑ रू॒पाणि॒ विक॑रोति । उ॒परि॑ष्टा द्वैष्ण॒वेन॑ । य॒ज्ञो वै विष्णुः॑ । य॒ज्ञ
    ए॒वान्त॒तः प्रति॑ तिष्ठति ॥ त्कु॑र्वन्ति । यथ्स॒द्यो दी॒क्षय॑न्ति स॒द्य ङ्क्री॒णन्ति॑ । पु॒ण्ड॒रि॒स्र॒जा
    म्प्रय॑च्छ॒त्यजा॑मित्वाय । अङ्गि॑रस क्षात॒पसी॒ प्रावे॑शयन्न् । त म्प्र॒यच्छ॑ति । सा॒क्षादे॒व दी क्षात॒पसी॒
    अव॑रुन्धे । द॒शभि॑र्वथ्सत॒रै विँ॒राट् । वि॒राजै॒वान्नाद्य॒मव॑ रुन्धे । मु॒ष्क॒रा भ॑वन्ति सेन्द्र॒त्वाय॑
    । द॒श॒पेयो॑ भवति । अ॒न्नाद्य॒स्याव॑रुद्ध्यै । श॒त ह्म॒णाः पि॑बन्ति । श॒तायुः॒ पुरु॑ष श्श॒तेन्द्रि॑यः
    । आयु॑ष्ये॒वेन्द्रि॒ये प्रति॑ तिष्ठति । स॒प्त॒द॒शग्ग् म्भ॑वति । स॒प्त॒द॒शः प्र॒जाप॑तिः ॥ ॥ प्र॒जाप॑ते॒राप्त्यै
    । प्रा॒का॒शाव॑द्ध्व॒र्यवे॑ ददाति । प्र॒का॒श द्गा॒त्रे । व्ये॑वास्मै॑ वासयति । रु॒क्मग्ं होत्रे । आ॒दि॒त्यमे॒वास्मा॒
    उन्न॑यति । अश्व॑ म्प्रस्तोतृप्रतिह॒र्तृभ्या म् । प्रा॒जा॒पत्यो वा अश्वः॑ । प्र॒जाप॑ते॒राप्त्यै त्रावरु॒णाय॑
    । रा॒ष्ट्रमे॒व व॒श्य॑कः । ऋ॒ष॒भ मे॒वेन्द्रि॑या॒व्य॑कः । वास॑सी नेष्टापो॒तृभ्या म् । प॒वित्रे॑ ए॒वास्यै॒ते
    । स्थूरि॑ यवाचि॒त म॑च्छावा॒काय॑ । अ॒न्त॒त ए॒व वरु॑ण॒मव॑ यजते ॥ । वह्नि॒र्वा अ॑न॒ड्वान् । वह्नि॑र॒ग्नीत्
    । वह्नि॑नै॒व वह्नि॑ य॒ज्ञस्याव॑रुन्धे । इन्द्र॑स्य सुषुवा॒णस्य॑ त्रे॒धेन्द्रि॒यं मभवत् । श्रा॒य॒न्तीय॒
    न्तृती॑यम् । सर॑स्वती॒ तृती॑यम् । भा॒र्ग॒वो होता॑ भवति । श्रा॒य॒न्तीय॑ म्भ॑वति । वा॒र॒व॒न्तीय॑ सा॒मम्
    । सा॒र॒स्व॒तीर॒पो गृ॑ह्णाति । इ॒न्द्रि॒यस्य॑ वी॒र्य॑स्याव॑ रुद्ध्यै । श्रा॒य॒न्तीय॑ म्भ॑वति । इ॒न्द्रि॒यमे॒वास्मि॑न्
    वी॒र्य॒ग्ग्॑ श्रयति । वा॒र॒व॒न्तीय॑ सा॒मम् । इ॒न्द्रि॒यमे॒वास्मि॑न् वी॒र्यं॑ रश्वः॑ प्र॒जाप॑ते॒राप्त्यै॑
    सात्यदूतहवींषि च ई॒श्व॒रो वा ए॒ष दिशो ऽनु॑ व्यास्था॒पय॑न्ति । दि॒शामवे ष्टयो भवन्ति । दि॒क्ष्वे॑व
    प्रति॑ तिष्ठ॒त्यनु॑न्मादाय । पञ्च॑ दे॒वता॑ यजति । पञ्च॒ दिशः॑ । दि॒क्ष्वे॑व प्रति॑ तिष्ठति । ह॒विषो॑
    हविष इ॒ष्ट्वा बा॑र् म॒भिघा॑रयति । य॒ज॒मा॒न॒दे॒व॒त्यो॑ वै बृह॒स्पतिः॑ । यज॑मानमे॒व तेज॑सा॒ सम॑र्धयति
