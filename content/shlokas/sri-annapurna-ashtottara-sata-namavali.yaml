    ॐ गणेशजनन्यै नमः ॐ शक्त्यै नमः ॐ कुमारजनन्यै नमः ॐ शुभायै नमः ॐ भोगप्रदायै नमः ॐ भगवत्यै नमः ॐ भक्ताभीष्टप्रदायिन्यै
