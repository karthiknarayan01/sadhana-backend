id: dattatreyadvadashaksharimantravidhanam
category: mantra
name:
  english: dattatreyadvadashaksharimantravidhanam
  devanagari: दत्तात्रेयद्वादशाक्षरीमन्त्रविधानम्
content:
  english: om asya shridattatreyadvadashaksharimantrasya bhagavan sadashiva rishih | gayatri chandah |
    shridattatreyo devata | om bijam | svaha shaktih | dattatreyah kilakam | mama shridattaprasadasiddhyarthe
    jape viniyogah || rishyadinyasah | bhagavate sadashivarishaye namah shirasi | gayatrichandase namah
    mukhe | shridattatreyadevatayai namah hridi | om bijaya namah guhye | svaha shaktaye namah padayoh
    | dattatreyakilakaya namah nabhau | mama shridattaprasadasiddhyarthe jape viniyogaya namah sarvange
    || karanyasah | am hrim angushthabhyam namah | krom dram tarjanibhyam namah | ehi madhyamabhyam namah
    | datta anamikabhyam namah | atreya kanishthikabhyam namah | svaha karatalakaraprishthabhyam namah
    || shadanganyasah | am hrim hridayaya namah | krom dram shirase svaha | ehi shikhayai vashat | datta
    kavacaya hum | atreya netratrayaya vaushat | svaha astraya phat || dhyanam
  devanagari: ॐ अस्य श्रीदत्तात्रेयद्वादशाक्षरीमन्त्रस्य भगवान् सदाशिव ऋषिः । गायत्री छन्दः । श्रीदत्तात्रेयो
    देवता । ॐ बीजम् । स्वाहा शक्तिः । दत्तात्रेयः कीलकम् । मम श्रीदत्तप्रसादसिद्ध्यर्थे जपे विनियोगः ॥
    ऋष्यादिन्यासः । भगवते सदाशिवऋषये नमः शिरसि । गायत्रीछन्दसे नमः मुखे । श्रीदत्तात्रेयदेवतायै नमः हृदि
    । ॐ बीजाय नमः गुह्ये । स्वाहा शक्तये नमः पादयोः । दत्तात्रेयकीलकाय नमः नाभौ । मम श्रीदत्तप्रसादसिद्ध्यर्थे
    जपे विनियोगाय नमः सर्वाङ्गे ॥ करन्यासः । आं ह्रीं अङ्गुष्ठाभ्यां नमः । क्रों द्रां तर्जनीभ्यां नमः
    । एहि मध्यमाभ्यां नमः । दत्त अनामिकाभ्यां नमः । आत्रेय कनिष्ठिकाभ्यां नमः । स्वाहा करतलकरपृष्ठाभ्यां
    नमः ॥ षडङ्गन्यासः । आं ह्रीं हृदयाय नमः । क्रों द्रां शिरसे स्वाहा । एहि शिखायै वषट् । दत्त कवचाय
    हुम् । आत्रेय नेत्रत्रयाय वौषट् । स्वाहा अस्त्राय फट् ॥ ध्यानम्
