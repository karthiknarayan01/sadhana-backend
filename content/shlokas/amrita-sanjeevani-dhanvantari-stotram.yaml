id: amrita-sanjeevani-dhanvantari-stotram
category: stotram
name:
  english: Amrita Sanjeevani Dhanvantari Stotram
content:
  english: athaparamaham vakshye'mritasanjivanam stavam | yasyanushthanamatrena mrityurduratpalayate ||
    || asadhyah kashtasadhyashca maharoga bhayankarah | shighram nashyanti pathanadasyayushca pravardhate
    || || shakinidakinidoshah kudrishtigrahashatrujah | pretavetalayakshottha badha nashyanti cakhilah
    || || duritani samastani nanajanmodbhavani ca | samsargajavikarani viliyante'sya pathatah || || sarvopadravanashaya
    sarvabadhaprashantaye | ayuh pravriddhaye caitat stotram paramamadbhutam || || balagrahabhibhutanam
    balanam sukhadayakam | sarvarishtaharam caitadbalapushtikaram param || || balanam jivanayaitat stotram
    divyam sudhopamam | mritavatsatvaharanam ciranjivitvakarakam || || maharogabhibhutanam bhayavyakulitatmanam
    | sarvadhivyadhiharanam bhayaghnamamritopamam || || alpamrityushcapamrityuh pathadasyah pranashyati
    | jala'gnivishashastrari na hi shringi bhayam tatha || || garbharakshakaram strinam balanam jivanapradam
    | maharogaharam nrinamalpamrityuharam param || || bala vriddhashca taruna nara naryashca duhkhitah
    | bhavanti sukhinah pathadasya loke cirayushah || || asmatparataram nasti jivanopaya aihikah | tasmat
    sarvaprayatnena pathamasya samacaret || || ayutavrittikam vatha sahasravrittikam tatha | tadardham
    va tadardham va pathedetacca bhaktitah || || kalashe vishnumaradhya dipam prajvalya yatnatah | sayam
    pratashca vidhivat stotrametat pathet sudhih || || sarpisha havisha va'pi samyavenatha bhaktitah |
    dashamshamanato homam kuryat sarvarthasiddhaye || || atha stotram namo namo vishvavibhavanaya namo
    namo lokasukhapradaya | namo namo vishvasrijeshvaraya namo namo muktivarapradaya || || namo namaste'khilalokapaya
    namo namaste'khilakamadaya | namo namaste'khilakaranaya namo namaste'khilarakshakaya || || namo namaste
    sakalartihartre namo namaste virujah prakartre | namo namaste'khilavishvadhartre namo namaste'khilalokabhartre
    || || srishtam deva caracaram jagadidam brahmasvarupena te sarvam tatparipalyate jagadidam vishnusvarupena
    te | vishvam samhritaye tadeva nikhilam rudrasvarupena te samsicyamritashikarairhara maharishtam ciram
    jivaya || || yo dhanvantarisanjnaya nigaditah kshirabdhito nihsrito hastabhyam janajivanaya kalasham
    piyushapurnam dadhat | ayurvedamariracajjanarujam nashaya sa tvam muda samsicyamritashikarairhara
    maharishtam ciram jivaya || || strirupam varabhushanambaradharam trailokyasammohanam kritva payayati
    sma yah suraganan piyushamatyuttamam | cakre daityaganan sudhavirahitan sammohya sa tvam muda samsicyamritashikarairhara
    maharishtam ciram jivaya || || cakshushodadhisamplava bhuvedapa jhashakrite | sinca sincamritakanaishciram
    jivaya jivaya || || prishthamandaranirghurnanidraksha kamathakrite | sinca sincamritakanaishciram
    jivaya jivaya || || yancacchalabalitrasamuktanirjara vamana | sinca sincamritakanaishciram jivaya
    jivaya || || dharoddhara hiranyakshaghata krodakrite prabho | sinca sincamritakanaishciram jivaya
    jivaya || || bhaktatrasavinashattacandatva nrihare vibho | sinca sincamritakanaishciram jivaya jivaya
    || || kshatriyaranyasanchedakutharakararainuka | sinca sincamritakanaishciram jivaya jivaya || ||
    rakshorajapratapabdhishoshanashuga raghava | sinca sincamritakanaishciram jivaya jivaya || || bhubharasurasandohakalagne
    rukminipate | sinca sincamritakanaishciram jivaya jivaya || || vedamargaratanarhavibhrantyai buddharupadhrik
    | sinca sincamritakanaishciram jivaya jivaya || || kalivarnashramaspashtadharmardhyai kalkirupabhak
    | sinca sincamritakanaishciram jivaya jivaya || || asadhyah kashtasadhya ye maharoga bhayankarah |
    chindhi tanashu cakrena ciram jivaya jivaya || || alpamrityum capamrityum mahotpatanupadravan | bhindhi
    bhindhi gadaghataishciram jivaya jivaya || || aham na jane kimapi tvadanyat samashraye natha padambujam
    te | kurushva tadyanmanasipsitam te sukarmana kena samakshamiyam || || tvameva tato janani tvameva
    tvameva nathashca tvameva bandhuh | vidyadhanagarakulam tvameva tvameva sarvam mama devadeva || ||
    na me'paradham pravilokaya prabho 'paradhasindhoshca dayanidhistvam | tatena dushto'pi sutah surakshate
    dayaluta te'vatu sarvada'sman || || ahaha vismara natha na mam sada karunaya nijaya paripuritah |
    bhuvi bhavan yadi me na hi rakshakah kathamaho mama jivanamatra vai || || daha daha kripaya tvam vyadhijalam
    vishalam hara hara karavalam calpamrityoh karalam | nijajanaparipalam tvam bhaje bhavayalam kuru kuru
    bahukalam jivitam me sada'lam || || na yatra dharmacaranam na janam vratam na yogo na ca vishnucarca
    | na pitrigovipravaramararca svalpayushastatra jana bhavanti || || atha mantram klim shrim klim shrim
    namo bhagavate janardanaya sakala duritani nashaya nashaya | kshraum arogyam kuru kuru | hrim dirghamayurdehi
    dehi svaha || phalashrutih asya dharanato japadalpamrityuh prashamyati | garbharakshakaram strinam
    balanam jivanam param || || shatam pancashatam shaktya'thava pancadhivimshatim | pustakanam dvijebhyastu
    dadyaddirghayushaptaye || || bhurjapatre vilikhyedam kanthe va bahumulake | sandharayedgarbharaksha
    balaraksha ca jayate || || sarve roga vinashyanti sarva badhah prashamyati | kudrishtijam bhayam nashyet
    tatha pretadijam bhayam || || maya kathitametatte'mritasanjivanam param | alpamrityuharam stotram
    mritavatsatvanashanam || || iti sudarshanasamhitoktam amritasanjivana dhanvantari stotram ||
  devanagari: अथापरमहं वक्ष्येऽमृतसञ्जीवनं स्तवम् । यस्यानुष्ठानमात्रेण मृत्युर्दूरात्पलायते ॥ ॥ असाध्याः
    कष्टसाध्याश्च महारोगा भयङ्कराः । शीघ्रं नश्यन्ति पठनादस्यायुश्च प्रवर्धते ॥ ॥ शाकिनीडाकिनीदोषाः कुदृष्टिग्रहशत्रुजाः
    । प्रेतवेतालयक्षोत्था बाधा नश्यन्ति चाखिलाः ॥ ॥ दुरितानि समस्तानि नानाजन्मोद्भवानि च । संसर्गजविकाराणि
    विलीयन्तेऽस्य पाठतः ॥ ॥ सर्वोपद्रवनाशाय सर्वबाधाप्रशान्तये । आयुः प्रवृद्धये चैतत् स्तोत्रं परममद्भुतम्
    ॥ ॥ बालग्रहाभिभूतानां बालानां सुखदायकम् । सर्वारिष्टहरं चैतद्बलपुष्टिकरं परम् ॥ ॥ बालानां जीवनायैतत्
    स्तोत्रं दिव्यं सुधोपमम् । मृतवत्सत्वहरणं चिरञ्जीवित्वकारकम् ॥ ॥ महारोगाभिभूतानां भयव्याकुलितात्मनाम्
    । सर्वाधिव्याधिहरणं भयघ्नममृतोपमम् ॥ ॥ अल्पमृत्युश्चापमृत्युः पाठादस्यः प्रणश्यति । जलाऽग्निविषशस्त्रारि
    न हि शृङ्गि भयं तथा ॥ ॥ गर्भरक्षाकरं स्त्रीणां बालानां जीवनप्रदम् । महारोगहरं नॄणामल्पमृत्युहरं परम्
    ॥ ॥ बाला वृद्धाश्च तरुणा नरा नार्यश्च दुःखिताः । भवन्ति सुखिनः पाठादस्य लोके चिरायुषः ॥ ॥ अस्मात्परतरं
    नास्ति जीवनोपाय ऐहिकः । तस्मात् सर्वप्रयत्नेन पाठमस्य समाचरेत् ॥ ॥ अयुतावृत्तिकं वाथ सहस्रावृत्तिकं
    तथा । तदर्धं वा तदर्धं वा पठेदेतच्च भक्तितः ॥ ॥ कलशे विष्णुमाराध्य दीपं प्रज्वाल्य यत्नतः । सायं प्रातश्च
    विधिवत् स्तोत्रमेतत् पठेत् सुधीः ॥ ॥ सर्पिषा हविषा वाऽपि संयावेनाथ भक्तितः । दशांशमानतो होमं कुर्यात्
    सर्वार्थसिद्धये ॥ ॥ अथ स्तोत्रम् नमो नमो विश्वविभावनाय नमो नमो लोकसुखप्रदाय । नमो नमो विश्वसृजेश्वराय
    नमो नमो मुक्तिवरप्रदाय ॥ ॥ नमो नमस्तेऽखिललोकपाय नमो नमस्तेऽखिलकामदाय । नमो नमस्तेऽखिलकारणाय नमो नमस्तेऽखिलरक्षकाय
    ॥ ॥ नमो नमस्ते सकलार्तिहर्त्रे नमो नमस्ते विरुजः प्रकर्त्रे । नमो नमस्तेऽखिलविश्वधर्त्रे नमो नमस्तेऽखिललोकभर्त्रे
    ॥ ॥ सृष्टं देव चराचरं जगदिदं ब्रह्मस्वरूपेण ते सर्वं तत्परिपाल्यते जगदिदं विष्णुस्वरूपेण ते । विश्वं
    संह्रितये तदेव निखिलं रुद्रस्वरूपेण ते संसिच्यामृतशीकरैर्हर महारिष्टं चिरं जीवय ॥ ॥ यो धन्वन्तरिसञ्ज्ञया
    निगदितः क्षीराब्धितो निःसृतो हस्ताभ्यां जनजीवनाय कलशं पीयूषपूर्णं दधत् । आयुर्वेदमरीरचज्जनरुजां नाशाय
    स त्वं मुदा संसिच्यामृतशीकरैर्हर महारिष्टं चिरं जीवय ॥ ॥ स्त्रीरूपं वरभूषणाम्बरधरं त्रैलोक्यसम्मोहनं
    कृत्वा पाययति स्म यः सुरगणान् पीयूषमत्युत्तमम् । चक्रे दैत्यगणान् सुधाविरहितान् सम्मोह्य स त्वं मुदा
    संसिच्यामृतशीकरैर्हर महारिष्टं चिरं जीवय ॥ ॥ चाक्षुषोदधिसम्प्लाव भूवेदप झषाकृते । सिञ्च सिञ्चामृतकणैश्चिरं
    जीवय जीवय ॥ ॥ पृष्ठमन्दरनिर्घूर्णनिद्राक्ष कमठाकृते । सिञ्च सिञ्चामृतकणैश्चिरं जीवय जीवय ॥ ॥ याञ्चाच्छलबलित्रासमुक्तनिर्जर
    वामन । सिञ्च सिञ्चामृतकणैश्चिरं जीवय जीवय ॥ ॥ धरोद्धार हिरण्याक्षघात क्रोडाकृते प्रभो । सिञ्च सिञ्चामृतकणैश्चिरं
    जीवय जीवय ॥ ॥ भक्तत्रासविनाशात्तचण्डत्व नृहरे विभो । सिञ्च सिञ्चामृतकणैश्चिरं जीवय जीवय ॥ ॥ क्षत्रियारण्यसञ्छेदकुठारकररैणुक
    । सिञ्च सिञ्चामृतकणैश्चिरं जीवय जीवय ॥ ॥ रक्षोराजप्रतापाब्धिशोषणाशुग राघव । सिञ्च सिञ्चामृतकणैश्चिरं
    जीवय जीवय ॥ ॥ भूभारासुरसन्दोहकालाग्ने रुक्मिणीपते । सिञ्च सिञ्चामृतकणैश्चिरं जीवय जीवय ॥ ॥ वेदमार्गरतानर्हविभ्रान्त्यै
    बुद्धरूपधृक् । सिञ्च सिञ्चामृतकणैश्चिरं जीवय जीवय ॥ ॥ कलिवर्णाश्रमास्पष्टधर्मर्ध्यै कल्किरूपभाक् ।
    सिञ्च सिञ्चामृतकणैश्चिरं जीवय जीवय ॥ ॥ असाध्याः कष्टसाध्या ये महारोगा भयङ्कराः । छिन्धि तानाशु चक्रेण
    चिरं जीवय जीवय ॥ ॥ अल्पमृत्युं चापमृत्युं महोत्पातानुपद्रवान् । भिन्धि भिन्धि गदाघातैश्चिरं जीवय जीवय
    ॥ ॥ अहं न जाने किमपि त्वदन्यत् समाश्रये नाथ पदाम्बुजं ते । कुरुष्व तद्यन्मनसीप्सितं ते सुकर्मणा केन
    समक्षमीयाम् ॥ ॥ त्वमेव तातो जननी त्वमेव त्वमेव नाथश्च त्वमेव बन्धुः । विद्याधनागारकुलं त्वमेव त्वमेव
    सर्वं मम देवदेव ॥ ॥ न मेऽपराधं प्रविलोकय प्रभो ऽपराधसिन्धोश्च दयानिधिस्त्वम् । तातेन दुष्टोऽपि सुतः
    सुरक्षते दयालुता तेऽवतु सर्वदाऽस्मान् ॥ ॥ अहह विस्मर नाथ न मां सदा करुणया निजया परिपूरितः । भुवि भवान्
    यदि मे न हि रक्षकः कथमहो मम जीवनमत्र वै ॥ ॥ दह दह कृपया त्वं व्याधिजालं विशालं हर हर करवालं चाल्पमृत्योः
    करालम् । निजजनपरिपालं त्वां भजे भावयालं कुरु कुरु बहुकालं जीवितं मे सदाऽलम् ॥ ॥ न यत्र धर्माचरणं न
    जानं व्रतं न योगो न च विष्णुचर्चा । न पितृगोविप्रवरामरार्चा स्वल्पायुषस्तत्र जना भवन्ति ॥ ॥ अथ मन्त्रम्
    क्लीं श्रीं क्लीं श्रीं नमो भगवते जनार्दनाय सकल दुरितानि नाशय नाशय । क्ष्रौं आरोग्यं कुरु कुरु । ह्रीं
    दीर्घमायुर्देहि देहि स्वाहा ॥ फलश्रुतिः अस्य धारणतो जापादल्पमृत्युः प्रशाम्यति । गर्भरक्षाकरं स्त्रीणां
    बालानां जीवनं परम् ॥ ॥ शतं पञ्चाशतं शक्त्याऽथवा पञ्चाधिविंशतिम् । पुस्तकानां द्विजेभ्यस्तु दद्याद्दीर्घायुषाप्तये
    ॥ ॥ भूर्जपत्रे विलिख्येदं कण्ठे वा बाहुमूलके । सन्धारयेद्गर्भरक्षा बालरक्षा च जायते ॥ ॥ सर्वे रोगा
    विनश्यन्ति सर्वा बाधाः प्रशाम्यति । कुदृष्टिजं भयं नश्येत् तथा प्रेतादिजं भयम् ॥ ॥ मया कथितमेतत्तेऽमृतसञ्जीवनं
    परम् । अल्पमृत्युहरं स्तोत्रं मृतवत्सत्वनाशनम् ॥ ॥ इति सुदर्शनसंहितोक्तं अमृतसञ्जीवन धन्वन्तरि स्तोत्रम्
    ॥
