    ॐ यन्त्राराध्यायै नमः ॥ ९९०॥ ॐ यन्त्रमध्यायै नमः । ॐ यन्त्रकर्तृप्रियङ्कर्यै नमः । ॐ यन्त्रारूढायै
    नमः । ॐ यन्त्रपूज्यायै नमः । ॐ योगिध्यानपरायणायै नमः । ॐ यजनीयायै नमः । ॐ यमस्तुत्यायै नमः । ॐ योगयुक्तायै
    नमः । ॐ यशस्कर्यै नमः । ॐ योगबद्धायै नमः ॥ १०००॥ ॐ यतिस्तुत्यायै नमः । ॐ योगज्ञायै नमः । ॐ योगनायक्यै
    नमः । ॐ योगिज्ञानप्रदायै नमः । ॐ यक्ष्यै नमः । ॐ यमबाधाविनाशिन्यै नमः । ॐ योगिकाम्यप्रदात्र्यै नमः
    । ॐ योगिमोक्षप्रदायिन्यै नमः ॥ १००८॥ ॥ इति श्रीस्कान्दपुराणान्तर्गता सनत्कुमारसंहितायां नारदसनत्कुमारसंवादे
    सरस्वतीसहस्रनामस्तोत्रस्य नामावली रूपान्तरं सम्पूर्णम् ॥
