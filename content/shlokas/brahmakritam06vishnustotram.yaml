id: brahmakritam06vishnustotram
category: stotram
name:
  english: brahmakritam06vishnustotram
  devanagari: ब्रह्मकृतं०६विष्णुस्तोत्रम्
content:
  english: 40|| jayasva govinda mahanubhava jayasva vishno jaya padmanabha | jayasva sarvadya gadadharesha
    jayasva vishveshvara vishvamurtte || 41|| iti shriskandapurane avantyakhande caturashitilingamahatmye
    shodashadhyayantargatam brahmakritam vishnustotram samaptam | skandapurana | avantyakhanda | caturashitikhanda
    | adhyaya 26
  devanagari: ४०॥ जयस्व गोविन्द महानुभाव जयस्व विष्णो जय पद्मनाभ । जयस्व सर्वाद्य गदाधरेश जयस्व विश्वेश्वर
    विश्वमूर्त्ते ॥ ४१॥ इति श्रीस्कन्दपुराणे आवन्त्यखण्डे चतुरशीतिलिङ्गमाहात्म्ये षोडषाध्यायान्तर्गतं
    ब्रह्मकृतं विष्णुस्तोत्रं समाप्तम् । स्कन्दपुराण । आवन्त्यखण्ड । चतुरशीतिखण्ड । अध्याय २६
meaning: {}
