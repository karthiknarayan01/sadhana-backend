id: candralasahasranamastotram-2
category: sahasranama
name:
  english: candralasahasranamastotram
  devanagari: चन्द्रलासहस्रनामस्तोत्रम्
content:
  english: tarasvini | sthemavattadidakara sthaulyanutvobhayashraya || 53|| daladambujasankasha dattanatajanabhaya
    | daharakashamadhyastha dayarasatarangini || 54|| damadigunapathodhi dagdhapapatavicaya | daritapranamaddhitirdasi
    bhutasurangana || 55|| daridryatulagnishikha dasharha parisevita | divyatejomayi dishtamarjani dinakrinnuta
    || 56|| dikshita dinasantrana nipuna dirghalocana | duraradhya duradharsha dushtagrahavinashini ||
    57|| duhkhahantri duracaravarini duratikrama | durlabha durjaya durga durlanghya nijashasana || 58||
    durvadalashyamalangi durikritajagadbhaya | driptarakshasasamhartri drig drishyaparicayini || 59||
    devata deshikakara deshakalavidhanavit | dedipyamanavasana deyamokshamahaphala || 60|| daityadarpaprashamani
    daivajnajanavandita | dainyonmulanatattvajna dainandinavidhanavit || 61|| doshaviploshanapara dorlatashlishta
    vallabha | dauratmyaranyadavagni daurbhagyadhvantabhanuruk || dandashukabhayacchetridanditasheshadurjana
    | dharmaprada dhanurvidya dharmishtha dharmasevita || 63|| dharadharendratanaya dhanapalasamarcita
    | dhatrivandya dhamamayi dharadharakacoccaya || 64|| dhikkritasheshapashanda dhishanadhishanarcita
    | dhiramandalasambhavya dhimayi dhipracodika || 65|| dhutapatakasanghata dhurandharajanadhipa | dhupasaurabhyavadgeha
    dhumaketutyadoshahrit || 66|| dhritalokatrayi dhrishta dhenudanapratoshita | dhairyasampadanapara
    dhorani dhaumyavandita || 67|| dhautapapatiranishtha dhamillakshiptacampaka | namaskarapariprita nalinayatalocana
    || 68|| nakhajyotsnaparabhutanakshatra nagakanyaka | navaratnavibhushadhya navagrahanishevita || 69||
    narayanashramagata narayananamaskrita | narayani nadamayi namaparayanotsuka || 70|| narayanarishinni
    namaskara keleli | naradadimunidhyeya nalikasanavallabha | narishikhamanirnagavelambaparavigraha ||
    71|| nitya nitantamadhura nirmala nirupadrava | nirantaka nirvikara nigamantaparishtata || 72|| nistula
    niravadyangi nirapaya nirishvari | nirmaryadadayarashirnirayottaranakshama || 73|| nilalaka nipavanivihara
    nitivardhani | niharabhumibhritkanya nilakanthavacah priya || 74|| nutipriya nutabhaya nupuradhvanimanjula
    | nutanambhodarucira nripalatvapradayini || 75|| nrityacchivecchakutuka nrisimhakshetradevata | netri
    nepalapitheshi netri bhutamahastraya || 76|| naikasvarupa nairghrinyavaishamyabhyam vivarjita | noditasheshadurata
    naukottirnabhavabdhika || 77|| nanda nandatmajadhyata nandi vidyadhidevata | nandanodyanavasatih padma
    padmasanasthita || 78|| paranjyotih parambrahma parashaktih paratpara | padadvayatma parikhibhutapiyushavaridhih
    || 79|| padyagadyamayivani pashupashavimocini | palitasheshasujana parvati patalakritih || 80|| panipadambujadvandvadvirupattashilimukha
    | paravarasutapashaharini pashadharini || 81|| papatavidavajjvala pativratyapravartika | parshvasthitaramavani
    dhritacamaravijita || 82|| payasannaikarasika pathinayatalocana | pikalapa pitristutya picandilayashah
    prada || 83|| pishitashakulacchetri pishacagrahavarini | pipilikadibrahmantajagattranaparayana ||
    84|| pinastani pitapati piditahitamandala | pithibhavad gurupada kshetra pitasudharasa || 85|| piyushavarshivaggumpha
    puraripuradevata | pulomajarcitapada puruhutaparishtuta || 86|| pushpavantitatatanka pushpayitashilimukha
    purushottamasambhavya purusharthapradayini || 87|| punnagakumbhavakshoja punnagakusumapriya | purtadisukritaprapya
    puritasheshavanchita || 88|| pujya pushasamacchaya purvadevamadapaha | putanaridita puta putanadigrahapaha
    || 89|| prithvi prithivyadhishthatri pritanajayashalini | prishteshta kushalalapa prishatidirghalocana
    || 90|| peshala pailavinuta paithinasivaraprada | potottirna bhavabdhistha poshitasheshadaivata ||
    91|| paurajanapadarcyanghrih paurnamasindubhavita | pampatirakritavasa panditantarviharini || 92||
    pancananasamarudha pancananakutumbini | pancabanaprasuh panca pranavadhyam padadvayam || 93|| phaladatri
    phanivarastutya phanidalapriya | phalayudhanuta spharamahima phanitapriya || 94|| sthirananda sphitakirtih
    sphurita khilavanmaya | phullambujalasaddhasta phutkurvatphanisamvrita || 95|| phenashubhrambaradhara
    phetkaritantravishruta | phanjikashakasantushta phantatrailokyanirmita || 96|| baddhagodhangulitrana
    barhibarhavatamsini | balavatisthitailambaparishtutapadadvaya || 97|| balonnaddha baliprita baladevanujarcita
    | balabrahmipada kshetradevata badhitasura || 98|| banabanasanakara banalingarcanapriya | bindutarpanasantushta
    bijapancakabodhita || 99|| bijapurasamacchaya buddhirupa budhastuta | vrindarakedya brihati vrindavanaviharini
    || 100|| berapujanasuprita baijanathasvarupini | bodhanandatmakatanurbauddhadarshanadeshika || 101||
    bandhahantri bandhurupa bandhukakusumaprabha | bambharashritapadabjayugala bandhuralaka || 102|| bhavarogahara
    bhavyarupa bhakteshtakamadhuk | bhaktigamya bhagavati bhagnahitamanoratha || 103|| bhanukotipratikasha
    bhavabhavavivarjita | bhasvati bharati bhamabhargavi bhargavanata || 104|| bhikshudhyeyavi
  devanagari: तरस्विनी । स्थेमवत्तडिदाकारा स्थौल्याणुत्वोभयाश्रया ॥ ५३॥ दलदम्बुजसङ्काशा दत्तानतजनाभया
    । दहराकाशमध्यस्था दयारसतरङ्गिणी ॥ ५४॥ दमादिगुणपाथोधि दग्धपापाटवीचया । दारिताप्रणमद्धीतिर्दासी भूतसुराङ्गना
    ॥ ५५॥ दारिद्र्यतूलाग्निशिखा दाशार्ह परिसेविता । दिव्यतेजोमयी दिष्टमार्जनी दिनकृन्नुता ॥ ५६॥ दीक्षिता
    दीनसन्त्राण निपुणा दीर्घलोचना । दुराराध्या दुराधर्षा दुष्टग्रहविनाशिनी ॥ ५७॥ दुःखहन्त्री दुराचारवारिणी
    दुरतिक्रमा । दुर्लभा दुर्जया दुर्गा दुर्लङ्घ्य निजशासना ॥ ५८॥ दूर्वादलश्यामलाङ्गी दूरीकृतजगद्भया ।
    दृप्तराक्षससंहर्त्री दृग् दृश्यपरिचायिनी ॥ ५९॥ देवता देशिकाकारा देशकालविधानवित् । देदीप्यमानवसना देयमोक्षमहाफला
    ॥ ६०॥ दैत्यदर्पप्रशमनी दैवज्ञजनवन्दिता । दैन्योन्मूलनतत्त्वज्ञा दैनन्दिनविधानवित् ॥ ६१॥ दोषविप्लोषणपरा
    दोर्लताश्लिष्ट वल्लभा । दौरात्म्यारण्यदावाग्नि दौर्भाग्यध्वान्तभानुरुक् ॥ दन्दशूकभयच्छेत्रीदण्डिताशेषदुर्जना
    । धर्मप्रदा धनुर्विद्या धर्मिष्ठा धर्मसेविता ॥ ६३॥ धराधरेन्द्रतनया धनपालसमर्चिता । धातृवन्द्या धाममयी
    धाराधरकचोच्चया ॥ ६४॥ धिक्कृताशेषपाषण्डा धिषणाधिषणार्चिता । धीरमण्डलसम्भाव्या धीमयी धीप्रचोदिका ॥ ६५॥
    धूतपातकसङ्घाता धुरन्धरजनाधिपा । धूपसौरभ्यवद्गेहा धूमकेतूत्यदोषहृत् ॥ ६६॥ धृतलोकत्रयी धृष्टा धेनुदानप्रतोषिता
    । धैर्यसम्पादनपरा धोरणी धौम्यवन्दिता ॥ ६७॥ धौतपापातीरनिष्ठा धमिल्लक्षिप्तचम्पका । नमस्कारपरिप्रीता
    नलिनायतलोचना ॥ ६८॥ नखज्योत्स्नापराभूतनक्षत्रा नगकन्यका । नवरत्नविभूषाढ्या नवग्रहनिषेविता ॥ ६९॥ नारायणाश्रमगता
    नारायणनमस्कृता । नारायणी नादमयी नामपारायणोत्सुका ॥ ७०॥ नारायणऋषीन्नी नमस्कार केलेली । नारदादिमुनिध्येया
    नालीकासनवल्लभा । नारीशिखामणिर्नागवेलाम्बापरविग्रहा ॥ ७१॥ नित्या नितान्तमधुरा निर्मला निरुपद्रवा ।
    निरान्तका निर्विकारा निगमान्तपरिष्टता ॥ ७२॥ निस्तुला निरवद्याङ्गी निरपाया निरीश्वरी । निर्मर्याददयाराशिर्निरयोत्तारणक्षमा
    ॥ ७३॥ नीलालका नीपवनीविहारा नीतिवर्धनी । नीहारभूमिभृत्कन्या नीलकण्ठवचः प्रिया ॥ ७४॥ नुतिप्रिया नुतभया
    नूपुरध्वनिमञ्जुला । नूतनाम्भोदरुचिरा नृपालत्वप्रदायिनी ॥ ७५॥ नृत्यच्छिवेच्छाकुतुका नृसिंहक्षेत्रदेवता
    । नेत्री नेपालपीठेशी नेत्री भूतमहस्त्रया ॥ ७६॥ नैकस्वरूपा नैर्घृण्यवैषम्याभ्यां विवर्जिता । नोदिताशेषदुरता
    नौकोत्तीर्णभवाब्धिका ॥ ७७॥ नन्दा नन्दात्मजध्याता नन्दि विद्याधिदेवता । नन्दनोद्यानवसतिः पद्मा पद्मासनस्थिता
    ॥ ७८॥ परञ्ज्योतिः परम्ब्रह्म पराशक्तिः परात्परा । पदद्वयात्मा परिखीभूतपीयूषवारिधिः ॥ ७९॥ पद्यगद्यमयीवाणी
    पशुपाशविमोचिनी । पालिताशेषसुजना पार्वती पाटलाकृतिः ॥ ८०॥ पाणिपादाम्बुजद्वन्द्वद्विरुपात्तशिलीमुखा
    । पारावारसुतापाशहारिणी पाशधारिणी ॥ ८१॥ पापाटवीदवज्ज्वाला पातिव्रत्यप्रवर्तिका । पार्श्वस्थितरमावाणी
    धृतचामरवीजिता ॥ ८२॥ पायसान्नैकरसिका पाठीनायतलोचना । पिकालापा पितृस्तुत्या पिचण्डिलयशः प्रदा ॥ ८३॥
    पिशिताशकुलच्छेत्री पिशाचग्रहवारिणी । पिपीलिकादिब्रह्मान्तजगत्त्राणपरायणा ॥ ८४॥ पीनस्तनी पीतपटी पीडिताहितमण्डला
    । पीठीभवद् गुरुपद क्षेत्रा पीतसुधारसा ॥ ८५॥ पीयूषवर्षिवाग्गुम्फा पुरारिपुरदेवता । पुलोमजार्चितपदा
    पुरुहूतपरिष्टुता ॥ ८६॥ पुष्पवन्तितताटङ्का पुष्पायितशिलीमुखा पुरुषोत्तमसम्भाव्या पुरुषार्थप्रदायिनी
    ॥ ८७॥ पुन्नागकुम्भवक्षोजा पुन्नागकुसुमप्रिया । पूर्तादिसुकृतप्राप्या पूरिताशेषवाञ्छिता ॥ ८८॥ पूज्या
    पूषसमच्छाया पूर्वदेवमदापहा । पूतनारीडिता पूता पूतनादिग्रहापहा ॥ ८९॥ पृथ्वी पृथिव्यधिष्ठात्री पृतनाजयशालिनी
    । पृष्टेष्ट कुशलालापा पृषतीदीर्घलोचना ॥ ९०॥ पेशला पैलविनुता पैठीनसिवरप्रदा । पोतोत्तीर्ण भवाब्धिस्था
    पोषिताशेषदैवता ॥ ९१॥ पौरजानपदार्च्याङ्घ्रिः पौर्णमासीन्दुभाविता । पम्पातीरकृतावासा पण्डितान्तर्विहारिणी
    ॥ ९२॥ पञ्चाननसमारूढा पञ्चाननकुटुम्बिनी । पञ्चबाणप्रसूः पञ्च प्रणवाढ्यं पदद्वयम् ॥ ९३॥ फलदात्री फणिवरस्तुत्या
    फणिदलप्रिया । फालायुधनुता स्फारमहिमा फाणितप्रिया ॥ ९४॥ स्थिरानन्दा स्फीतकीर्तिः स्फूरिता खिलवाङ्मया
    । फुल्लाम्बुजलसद्धस्ता फूत्कुर्वत्फणिसंवृता ॥ ९५॥ फेनशुभ्राम्बरधरा फेत्कारीतन्त्रविश्रुता । फञ्जिकाशाकसन्तुष्टा
    फाण्टत्रैलोक्यनिर्मिता ॥ ९६॥ बद्धगोधाङ्गुलित्राणा बर्हिबर्हावतंसिनी । बलवाटीस्थितैलाम्बापरिष्टुतपदद्वया
    ॥ ९७॥ बलोन्नद्धा बलिप्रीता बलदेवानुजार्चिता । बालाब्राह्मीपद क्षेत्रदेवता बाधितासुरा ॥ ९८॥ बाणबाणासनकरा
    बाणलिङ्गार्चनप्रिया । बिन्दुतर्पणसन्तुष्टा बीजपञ्चकबोधिता ॥ ९९॥ बीजपूरसमच्छाया बुद्धिरूपा बुधस्तुता
    । वृन्दारकेड्या बृहती वृन्दावनविहारिणी ॥ १००॥ बेरपूजनसुप्रीता बैजनाथस्वरूपिणी । बोधानन्दात्मकतनुर्बौद्धदर्शनदेशिका
    ॥ १०१॥ बन्धहन्त्री बन्धुरूपा बन्धूककुसुमप्रभा । बम्भाराश्रितपादाब्जयुगला बन्धुरालका ॥ १०२॥ भवरोगहरा
    भव्यरूपा भक्तेष्टकामधुक् । भक्तिगम्या भगवती भग्नाहितमनोरथा ॥ १०३॥ भानुकोटिप्रतीकाशा भावाभावविवर्जिता
    । भास्वती भारती भामाभार्गवी भार्गवानता ॥ १०४॥ भिक्षुध्येयावि
