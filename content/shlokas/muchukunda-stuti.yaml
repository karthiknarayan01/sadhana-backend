id: muchukunda-stuti
category: stotram
name:
  english: Muchukunda Stuti
content:
  english: vimohito'yam jana isha mayaya tvadiyaya tvam ca bhajatyanarthadrik | sukhaya duhkhaprabhaveshu
    sajjate griheshu yoshitpurushashca vancitah || || labdhva jano durlabhamatra manusham kathancidavyangamayatnato'nagha
    | padaravindam na bhajatyasanmati rgrihandhakupe patito yatha pashuh || || mamaisha kalo'jita nishphalo
    gato rajyashriyonnaddhamadasya bhupate | martyatmabuddheh sutadarakoshabhu shvasajjamanasya durantacintaya
    || || kalevare'smin ghatakudyasannibhe nirudhamano naradeva ityaham | vrito rathebhashvapadatyanikapairgam
    paryatamstvaganayan sudurmadah || || pramattamuccairiti krityacintaya prabhuddhalobham vishayeshu
    lalasam | tvamapramattah sahasa'bhipadyase kshullelihano'hirivakhumantakah || || pura rathairhemaparishkritaishcaran
    matangajairva naradevasanjnitah | sa eva kalena duratyayena te kalevaro vitkrimibhasmasanjnitah ||
    || nirjitya dikcakramabhutavigraho varasanasthah samarajavanditah | griheshu maithunyasukheshu yoshitam
    kridamriga purusha isha niyate || || karoti karmani tapahsu nishthito nivrittabhogastadapekshaya dadat
    | punashca bhuyeyamaham svaraditi prabuddhatarsho na sukhaya kalpate || || bhavapavargo bhramato yada
    bhave jjanasya tarhyacyuta satsamagamah | satsangamo yarhi tadaiva sadgatau paravareshe tvayi jayate
    matih || || manye mamanugraha isha te krito rajyanubandhapagamo yadricchaya | yah prarthyate sadhubhirekacaryaya
    vanam vivikshadbhirakhandabhumipaih || || na kamaye'nyam tava padasevanad akincanaprarthyatamadvaram
    vibho | aradhya kastvam hyapavargadam hare vrinita aryo varamatmabandhanam || || tasmadvisrijyashisha
    isha sarvato rajastamahsattvagunanubandhanah | niranjanam nirgunamadvayam param tvam jnaptimatram
    purusham vrajamyaham || || ciramiha vrijinartastapyamano'nutapaih avitrishashadamitro labdhashantih
    kathancit | sharanada samupetastvatpadabjam paratman abhayamamritamashokam pahi ma'pannamisha || ||
    iti shrimadbhagavatantargata mucukundakrita shrivishnustutih samapta |
  devanagari: विमोहितोऽयं जन ईश मायया त्वदीयया त्वां च भजत्यनर्थदृक् । सुखाय दुःखप्रभवेषु सज्जते गृहेषु
    योषित्पुरुषश्च वञ्चितः ॥ ॥ लब्ध्वा जनो दुर्लभमत्र मानुषं कथञ्चिदव्यङ्गमयत्नतोऽनघ । पादारविन्दं न भजत्यसन्मति
    र्गृहान्धकूपे पतितो यथा पशुः ॥ ॥ ममैष कालोऽजित निष्फलो गतो राज्यश्रियोन्नद्धमदस्य भूपते । मर्त्यात्मबुद्धेः
    सुतदारकोशभू ष्वासज्जमानस्य दुरन्तचिन्तया ॥ ॥ कलेवरेऽस्मिन् घटकुड्यसन्निभे निरूढमानो नरदेव इत्यहम्
    । वृतो रथेभाश्वपदात्यनीकपैर्गां पर्यटंस्त्वागणयन् सुदुर्मदः ॥ ॥ प्रमत्तमुच्चैरिति कृत्यचिन्तया प्रभुद्धलोभं
    विषयेषु लालसम् । त्वमप्रमत्तः सहसाऽभिपद्यसे क्षुल्लेलिहानोऽहिरिवाखुमन्तकः ॥ ॥ पुरा रथैर्हेमपरिष्कृतैश्चरन्
    मतङ्गजैर्वा नरदेवसञ्ज्ञितः । स एव कालेन दुरत्ययेन ते कलेवरो विट्कृमिभस्मसञ्ज्ञितः ॥ ॥ निर्जित्य दिक्चक्रमभूतविग्रहो
    वरासनस्थः समराजवन्दितः । गृहेषु मैथुन्यसुखेषु योषितां क्रीडामृग पूरुष ईश नीयते ॥ ॥ करोति कर्माणि तपःसु
    निष्ठितो निवृत्तभोगस्तदपेक्षया ददत् । पुनश्च भूयेयमहं स्वराडिति प्रबुद्धतर्षो न सुखाय कल्पते ॥ ॥ भवापवर्गो
    भ्रमतो यदा भवे ज्जनस्य तर्ह्यच्युत सत्समागमः । सत्सङ्गमो यर्हि तदैव सद्गतौ परावरेशे त्वयि जायते मतिः
    ॥ ॥ मन्ये ममानुग्रह ईश ते कृतो राज्यानुबन्धापगमो यदृच्छया । यः प्रार्थ्यते साधुभिरेकचर्यया वनं विविक्षद्भिरखण्डभूमिपैः
    ॥ ॥ न कामयेऽन्यं तव पादसेवनाद् अकिञ्चनप्रार्थ्यतमाद्वरं विभो । आराध्य कस्त्वां ह्यपवर्गदं हरे वृणीत
    आर्यो वरमात्मबन्धनम् ॥ ॥ तस्माद्विसृज्याशिष ईश सर्वतो रजस्तमःसत्त्वगुणानुबन्धनाः । निरञ्जनं निर्गुणमद्वयं
    परं त्वां ज्ञप्तिमात्रं पुरुषं व्रजाम्यहम् ॥ ॥ चिरमिह वृजिनार्तस्तप्यमानोऽनुतापैः अवितृषषडमित्रो लब्धशान्तिः
    कथञ्चित् । शरणद समुपेतस्त्वत्पदाब्जं परात्मन् अभयममृतमशोकं पाहि माऽपन्नमीश ॥ ॥ इति श्रीमद्भागवतान्तर्गता
    मुचुकुन्दकृता श्रीविष्णुस्तुतिः समाप्ता ।
