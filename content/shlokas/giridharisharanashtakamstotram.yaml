id: giridharisharanashtakamstotram
category: stotram
name:
  english: giridharisharanashtakamstotram
  devanagari: गिरिधारिशरणाष्टकंस्तोत्रम्
content:
  english: jayakara ho || 5|| yamuna'mbhah sadasevi yamunasnanatatparah | prapannarakshako bhakto jayati
    haricintakah || 6|| shriyamunaji ke nirmala jala ka pana karane vale aura shriyamunaji mem hi snana
    karane mem lage hue aura sharanagata janom ki raksha karane vale shrihari ke cintana mem nimagna paramabhakta
    brahmacari shrigiridharisharanaji ki saba samaya jaya ho || 6|| madhavamandire divye dhamni vrindavane
    sada | mantranushthanasampanno jayati khalu pavanah || 7|| divyadhama vrindavanastha radhamadhava
    mandira mem sada hi shrigopalamantraraja ke anushthana mem pravritta jinaka parama pavana svarupa
    hai aise brahmacari shrigiridharisharanaji ki sadaiva jaya ho || 7|| kadamba
  devanagari: जयकार हो ॥ ५॥ यमुनाऽम्भः सदासेवी यमुनास्नानतत्परः । प्रपन्नरक्षको भक्तो जयति हरिचिन्तकः
    ॥ ६॥ श्रीयमुनाजी के निर्मल जल का पान करने वाले और श्रीयमुनाजी में ही स्नान करने में लगे हुए और शरणागत
    जनों की रक्षा करने वाले श्रीहरि के चिन्तन में निमग्न परमभक्त ब्रह्मचारी श्रीगिरिधारीशरणजी की सब समय
    जय हो ॥ ६॥ माधवमन्दिरे दिव्ये धाम्नि वृन्दावने सदा । मन्त्रानुष्ठानसम्पन्नो जयति खलु पावनः ॥ ७॥ दिव्यधाम
    वृन्दावनस्थ राधामाधव मन्दिर में सदा ही श्रीगोपालमन्त्रराज के अनुष्ठान में प्रवृत्त जिनका परम पावन
    स्वरूप है ऐसे ब्रह्मचारी श्रीगिरिधारीशरणजी की सदैव जय हो ॥ ७॥ कदम्ब
