id: navagraha-mangala-slokas-navagraha-mangalashtakam
category: stotram
name:
  english: Navagraha Mangala Slokas (Navagraha Mangalashtakam)
content:
  english: bhasvan kashyapagotrajo'runaruciryah simhapo'rkah sami tshattristho'dashashobhano gurushashi
    bhaumah sumitrah sada | shukro mandaripuh kalingajanapashcagnishvarau devate madhyevartulapurvadigdinakarah
    kuryatsada mangalam || || candrah karkatakaprabhuh sitanibhashcatreyagotrodbhava shcatreyashcaturashravarunamukhashcape
    umadhishvarah | shatsaptagni dashaikashobhanaphalo norirbudharkaupriyau svami yamunajashca parnasamidhah
    kuryatsada mangalam || || bhaumo dakshinadiktrikonayamadigvindhyeshvarah khadirah svami vrishcikameshayostu
    sugurushcarkah shashi sauhridah | jno'rih shattriphalapradashca vasudhaskandau kramaddevate bharadvajakulodvaho'runarucih
    kuryatsada mangalam || || saumyah pita udanmukhah samidapamargo'trigotrodbhavo baneshanadishah suhridravisutah
    shantah sutah shitagoh | kanyayugmapatirdashashtacaturah shannetragah shobhano vishnurdevyadhidevate
    magadhapah kuryatsada mangalam || || jivashcangiragotrajottaramukho dirghottarashasthitah pito'shvatthasamicca
    sindhujanitashcapo'tha minadhipah | suryendukshitijah priya budhasitau shatru samashcapare saptadve
    navapancame shubhakarah kuryatsada mangalam || || shukro bhargavagotrajah sitarucih purvamukhah purvadik
    pancalastha vrishastuladhipamaharashtradhipaudumbarah | indranimaghava budhashca ravijo mitrorka candravari
    shashthatrirdashavarjite bhrigusutah kuryatsada mangalam || || mandah krishnanibhah sapashcimamukhah
    saurashtrapah kashyapah svami nakrasukumbhayorbudhasitau mitrau kujendu dvishau | sthanam pashcimadik
    prajapatiyamau devau dhanurdharakah shattristhah shubhakricchani ravisutah kuryatsada mangalam ||
    || rahuh simhaladeshapo'pi satamah krishnangashurpasano yah paithinasagotrasambhavasamiddurvamukho
    dakshinah | yah sarpah pashudaivato'khilagatah suryagrahe chadakah shattristhah shubhakricca simhakasutah
    kuryatsada mangalam || || keturjaiminigotrajah kushasamidvayavyakonesthita shcitrankadhvajalanchano
    hi bhagavan yo dakshinashamukhah | brahma caiva tu citraguptapatiman prityadhidevah sada shattristhah
    shubhakricca barbarapatih kuryatsada mangalam || || iti navagraha mangala stotram |
  devanagari: भास्वान् काश्यपगोत्रजोऽरुणरुचिर्यः सिंहपोऽर्कः समि त्षट्त्रिस्थोऽदशशोभनो गुरुशशी भौमाः सुमित्राः
    सदा । शुक्रो मन्दरिपुः कलिङ्गजनपश्चाग्नीश्वरौ देवते मध्येवर्तुलपूर्वदिग्दिनकरः कुर्यात्सदा मङ्गलम्
    ॥ ॥ चन्द्रः कर्कटकप्रभुः सितनिभश्चात्रेयगोत्रोद्भव श्चात्रेयश्चतुरश्रवारुणमुखश्चापे उमाधीश्वरः । षट्सप्ताग्नि
    दशैकशोभनफलो नोरिर्बुधार्कौप्रियौ स्वामी यामुनजश्च पर्णसमिधः कुर्यात्सदा मङ्गलम् ॥ ॥ भौमो दक्षिणदिक्त्रिकोणयमदिग्विन्ध्येश्वरः
    खादिरः स्वामी वृश्चिकमेषयोस्तु सुगुरुश्चार्कः शशी सौहृदः । ज्ञोऽरिः षट्त्रिफलप्रदश्च वसुधास्कन्दौ
    क्रमाद्देवते भारद्वाजकुलोद्वहोऽरुणरुचिः कुर्यात्सदा मङ्गलम् ॥ ॥ सौम्यः पीत उदङ्मुखः समिदपामार्गोऽत्रिगोत्रोद्भवो
    बाणेशानदिशः सुहृद्रविसुतः शान्तः सुतः शीतगोः । कन्यायुग्मपतिर्दशाष्टचतुरः षण्णेत्रगः शोभनो विष्णुर्देव्यधिदेवते
    मगधपः कुर्यात्सदा मङ्गलम् ॥ ॥ जीवश्चाङ्गिरगोत्रजोत्तरमुखो दीर्घोत्तराशास्थितः पीतोऽश्वत्थसमिच्च सिन्धुजनितश्चापोऽथ
    मीनाधिपः । सूर्येन्दुक्षितिजाः प्रिया बुधसितौ शत्रू समाश्चापरे सप्तद्वे नवपञ्चमे शुभकरः कुर्यात्सदा
    मङ्गलम् ॥ ॥ शुक्रो भार्गवगोत्रजः सितरुचिः पूर्वामुखः पूर्वदिक् पाञ्चालस्थ वृषस्तुलाधिपमहाराष्ट्राधिपौदुम्बरः
    । इन्द्राणीमघवा बुधश्च रविजो मित्रोर्क चन्द्रावरी षष्ठत्रिर्दशवर्जिते भृगुसुतः कुर्यात्सदा मङ्गलम्
    ॥ ॥ मन्दः कृष्णनिभः सपश्चिममुखः सौराष्ट्रपः काश्यपः स्वामी नक्रसुकुम्भयोर्बुधसितौ मित्रौ कुजेन्दू
    द्विषौ । स्थानं पश्चिमदिक् प्रजापतियमौ देवौ धनुर्धारकः षट्त्रिस्थः शुभकृच्छनी रविसुतः कुर्यात्सदा
    मङ्गलम् ॥ ॥ राहुः सिंहलदेशपोऽपि सतमः कृष्णाङ्गशूर्पासनो यः पैठीनसगोत्रसम्भवसमिद्दूर्वामुखो दक्षिणः
    । यः सर्पः पशुदैवतोऽखिलगतः सूर्यग्रहे छादकः षट्त्रिस्थः शुभकृच्च सिंहकसुतः कुर्यात्सदा मङ्गलम् ॥ ॥
    केतुर्जैमिनिगोत्रजः कुशसमिद्वायव्यकोणेस्थित श्चित्राङ्कध्वजलाञ्छनो हि भगवान् यो दक्षिणाशामुखः । ब्रह्मा
    चैव तु चित्रगुप्तपतिमान् प्रीत्याधिदेवः सदा षट्त्रिस्थः शुभकृच्च बर्बरपतिः कुर्यात्सदा मङ्गलम् ॥ ॥
    इति नवग्रह मङ्गल स्तोत्रम् ।
