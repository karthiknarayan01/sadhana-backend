id: yajnavalkyamangala
category: stotram
name:
  english: yajnavalkyamangala
  devanagari: याज्ञवल्क्यमन्गल
content:
  english: saptasaindhavashasanat | ahartre badavashvanam arkashishyaya mangalam || 7|| ayatayamamamnayam
    amnayavapusho hareh | adhyaishta yo munistasma akshayyam bhuri mangalam || 8|| yasya citrarathah shishyo
    yoginetuhprasadatah| katyayanipriyayasmai kripasaraya mangalam || 9|| mithiladhipadattagramananaya
    mahatmane | ahartre saurabheyinam adhvarantestu mangalam || 10|| pitamahamanahputriparinetre patiyase
    | shantoddhalakagarvaya shantisaraya mangalam || 11|| darbha
  devanagari: सप्तसैन्धवशासनात् । आहर्त्रे बडवाश्वानां अर्कशिष्याय मङ्गलम् ॥ ७॥ अयातयाममाम्नायं आम्नायवपुषो
    हरेः । अध्यैष्ट यो मुनिस्तस्मा अक्षय्यं भूरि मङ्गलम् ॥ ८॥ यस्य चित्ररथः शिष्यो योगिनेतुःप्रसादतः।
    कात्यायनीप्रियायास्मै कृपासाराय मङ्गलम् ॥ ९॥ मिथिलाधिपदत्ताग्रमाननाय महात्मने । आहर्त्रे सौरभेयीनां
    अध्वरान्तेस्तु मङ्गलम् ॥ १०॥ पितामहमनःपुत्रीपरिणेत्रे पटीयसे । शान्तोद्धालकगर्वाय शान्तिसाराय मङ्गलम्
    ॥ ११॥ दर्भ
meaning: {}
