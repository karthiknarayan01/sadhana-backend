id: sri-bhairava-aarati
category: stotram
name:
  english: Sri Bhairava Aarati
content:
  english: jaya bhairava deva prabhu jaya bhairava deva | jaya kali aura gaura devi krita seva || jaya||
    tumhi papa uddharaka duhkha sindhu taraka | bhaktom ke sukha karaka bhishana vapu dharaka || jaya||
    vahana shvana virajata kara trishula dhari | mahima amita tumhari jaya jaya bhayahari || jaya|| tuma
    bina seva deva saphala nahim hove | caumukha dipaka darshana sabaka duhkha khove || jaya|| tela cataki
    dadhi mishrita bhashavali teri | kripa kariye bhairava kariye nahim deri || jaya|| pava ghungharu
    bajata aru damaru damakavata | batukanatha bana balakajana mana harashavata || jaya|| batukanatha
    ki arati jo koi nara gave | kahe dharanidhara nara manavanchita phala pave || jaya||
  devanagari: जय भैरव देवा प्रभु जय भैरव देवा । जय काली और गौरा देवी कृत सेवा ॥ जय॥ तुम्ही पाप उद्धारक
    दुःख सिन्धु तारक । भक्तों के सुख कारक भीषण वपु धारक ॥ जय॥ वाहन श्वान विराजत कर त्रिशूल धारी । महिमा
    अमित तुम्हारी जय जय भयहारी ॥ जय॥ तुम बिन सेवा देवा सफल नहीं होवे । चौमुख दीपक दर्शन सबका दुःख खोवे
    ॥ जय॥ तेल चटकि दधि मिश्रित भाषावलि तेरी । कृपा करिये भैरव करिये नहीं देरी ॥ जय॥ पाव घूङ्घरु बाजत अरु
    डमरु डमकावत । बटुकनाथ बन बालकजन मन हरषावत ॥ जय॥ बटुकनाथ की आरती जो कोई नर गावे । कहे धरणीधर नर मनवाञ्छित
    फल पावे ॥ जय॥
