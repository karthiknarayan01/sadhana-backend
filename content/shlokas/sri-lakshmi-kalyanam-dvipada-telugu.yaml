id: sri-lakshmi-kalyanam-dvipada-telugu
category: stotram
name:
  english: Sri Lakshmi Kalyanam Dvipada (Telugu)
content:
  english: valaci varincina varalakshmi gatha ghanamandaradrini kavvambuganu vasuki traduga varalanga
    cesi amritambu kankshinci asurulu suralu cilukanga cilukanga kshirasagaramu parama pavanamaina barasinadu
    mèlugaru tòlakari mèrupula tippa òyyaramula lappa òppulakuppa cinnari pònnari shrimahadevi ashtadalabjamandavirbhavincè
    ningini takèdu niddamputalalu tugutuyyalalai tumpèsalara bala ta natutuga padmammuchaya kannè ta nitutuga
    kaluvapuchaya atutugi itutugi aparanji mudda vikshincu cundaga vèdurumosatlu pèrigi pèndiliyidu pillayyènanta
    kalpadrimambuna kalikalam boli tanuvuna pulakalu dattamai niguda bara jaci pramoda bhashpamul rala
    ravamma bhagyala rashi ravamma ravamma indiraramani ravamma loka shokamu bapu lolakshi vivu naku kuturu
    vauta napunyamamma ancu murisipoyi ambudhisvami uppòngi uppòngi upparam bantè sakhiyanu mangala snana
    madimpa vasavundarpincè vajrapithammu putanadijala purnapunyaha kalashalatoda diggajamu lavvela jalajatagandhiki
    jalakammu larcè bangaru sarigancu pattuputtammu kattanga sutakiccè kalashavarashi vèlaleni nagaliccè
    vishvakarmundu rajiva mukhulaina rambhadu lanta kurulu nunnaga duvvi kiljada savarinci kinjalkadhuli
    cèdarani kròvvirul cikkaga mudici kalala puttinayindlu kannulaku kammani kavrampu katuka diddi vènnèlatetayau
    vèdadamomunaku gummadi vittanta kunkuma pètti attaru javvaji agaru candanamu tanuvèlla amè mundatanu
    niluvutaddambunu nilipi rantatanu tana rupu shrilakshmi darpana mmandu kanubòmma nikkaga kanugòni
    navvi simhasanamu diggi cèngalvadanda cedalci yaccaral ceri kòlvanga kuccèllu migalla gunisiyadanga
    garudu gandharva rakshasa yaksha divija sangha madhyamunaku saragauna vaccè cèppa codyam baina shringaravalli
    mòlakanavvula muddumomunu juci sogakannula valucupulu cuci muduru sampènga mògga mukkunu juci amritambu
    dòlakèdu adharambu cuci siggulu sudivadu cèkkillu cuci mutyala mèccani munipandla cuci palindla jaru
    payyèda cuci javajavamanu kaususarunu cuci gundrani pirudula kudirika cuci kamaniya kalahamsa gamanambu
    cuci mògamuna kandamau mòtimanu juci madhusudanudu dakka magavaralèlla valapu nikkakaku vashavartulairi
    kannula kègadannu kaipuna tannu tilakincu cunnatti dikpalakadi suravargamunu ganci sudati bhavincè
    òka dantaraniva dòkadu jarundu òkadu raktapipasi òkkadu jadadhi òkadu tiripiga òkadu cancaludu òkkati
    taṟakaina òkkati talu i mògammulakate intinta nunupu shrivatsavakshundu shritarakshakundu pundarikakshundu
    bhuvanamohanudu tapta camikara dhagadhaga ddhagita pitambaradharundu manipunja ranjita manjula makuta
    makara kundala hara manjira kataka kancika keyura kramabhushanudu anupama jnana balaishvarya virya
    madhurya gambhirya mardha vaudarya shaurya dhairya sthairya caturya mukhya kalyana guna ganaugha maharnavundu
    vishvamantayu tanainavadu sheshadrinilayundu shrinivasundu patiyaina sukhamulu padayanga vaccu tulaleni
    bhogala tuladuga vaccu ededu lokala nelanga vaccu ancu shauriki vaicè alamelu manga cèngalva viridanda
    cittamuppònga sakala jagambulu jayavèttu cunda shaciyu gauriyu vani sarveshvarunaku talayanti pannita
    tana madinci tadiyòtti venupatramulanta cesi namambulanu diddi navabhushanamula gaiseya divijavargamula
    gòluva kadalanai ravanagajamupai svami keshava yancunu kiramul paluka narayanayancu nèmalul paluka
    madhavayancunu madhupamul paluka govinda yanucunu koyilal paluka tayitakka dhimitakka taddhimita kita
    jhanuta takajhanuta jhanuta yatancu accara viribonu ladi padanga muttaiduvulu sesa mutyalu calla callaga
    venceyu jaladavarnunaku agrambunan veda amnaya ghosha vènuka mantradhvani vinuvidhi muttè adèvaccè
    idèvaccè alludatancu mamagarèduregi madhuparkamiccè panditi loniki patti todtèccè punya tirthambulu
    prokshinci rishulu mangalashasana mangalammidaga kamalacetiki cakri kattè kankanamu divya shankhambulu
    tirucinnamulunu venu mardala rudravinalu mòraya talavanci kurcunna tanvi kanthamuna madhuvairi gilincè
    mangalyamapudu cetula talabralu cekòni guda poyaga vènukadu puvuboni mundu shiramuvancina yatti shridharujuci
    pakapaka navviri pallavadharulu padunalgu bhuvanamul palincu natti callani vibhunaku jayamangalambu
    padamu mopina cota pasidi pandincu cudikuttukaku shubhamangalambu ancu haratu lètta nanganamanulu
    sagè buvvamubanti santoshamuganu kalita kankanajhanatkarammu lèsaga katakalanghalaghalatkaramul pòsaga
    pirudulapai veni pimpillu guya mògamuna tilakambu mukkuna jara cirucèmmatala dogi cèdaru gandhammu
    ghuma ghuma vasanal grummarimpanga curuku jupula kopu cupaṟa gundè valapu ciccu ragulpa vagaladi yòkatè
    kodiga mmadènu gopalu nitlu mana pèndli kòdukènto mahaniyudamma mahilalan valapincu mantragadamma
    maccumandulu calli madi docukunna karivani nèvvaru kaminturamma sukiyalu polilu sògiyavu gani purapura
    mattini bòkkèdu nanta pattè mancamu vesi panpamarimpa pamupai taboyi pavalincu nanta ambariyenuge
    avatala kampi gadda mida vayali gadalèdu nanta vintaveshamulènno vesèdu nantarasikya mitulunci akarasaundaryamu
    arayuda mmanna kanulu cetulu momu kallu mòttammu tamarakalimiki sthanammu summu i yantu manabala kèpudanta
    kunda tamarasirigala dhanyatmunakunu nalici nalleruto nalugida valènu kanda nitanu òdal gaduganga
    valènu gandhaka lepammu kadubuya valènu vadavadala drippi vadalanga valènu a matalalinci harupattamahishi
    madhavucèliya a badati kitladè ati vistarambela andalaciluka nivu nercina tèngu nerture yòrulu vènnuni
    nalupancu vèkkirincitivi nèlatuka èrupancu nikku cupitivi kaluvapuvu nalupu kasturi nalupu kandiriga
    èrupu kaki norèrupu i rèndu rangulande rangu mèrigo sòddu veyuta gadu sutiga jèppu varuni jucina kanta
    vadhuvunu judu maya marmamu vidi mari baduladu kaliki kalsetulu kannulu momu tamara virisina tavulu
    gavo tamaralo butti tamara bèrugu kòmma meniki dulagòndi racèdavo kandaniti cikitsa garavincèdavo
    intinta kannula nègadijuci sigguto nèmmomu ceta gappikòni analukònalu veyu anuraktitoda rasikata leni
    ma rangani mèdanu pulamalanu vesi pòlupuga natani gundèlapai jeri kulukanga dalacu ranganayaki ènta
    rasikuralamma shapharalocana yènta capaluralamma a navvu linavvu laravirimallè andalu cinducu alarimpa
    madulu sakala vaibhavamula jarigènu pèndli ampakammula vela arudèncinanta pasupu kunkuma pulu pandu
    tènkaya tambula mòdi dalci taralakshi lakshmi talapu lopala kringu tandrini jeri nayana yani pilci
    navaduhkha bhashpa kanamulu jalajala kannula rala gundèpai talavalci kumulu cundanga kadivèdu badabagni
    kadupulo nanaci shiramunu murkòni cèkkillu nimiri palapusalatalli bhagyalavèlli vedka attintiki vèlli
    ravamma adapillalaku tandri ayyèdu kante mati gati lenatti maunalu melu vinula nipata vinipincu cunda
    kannula ni ata kanipincu cunda uratato nèttulundune yamma gadiyalo ninu vacci kanakundu namma ani
    sagarudu putri nanunayimpaga buddhulu garapiri punyakaminulu emi nomu phalambo emi bhagyambo vedanta
    vedyudu vibhudayè niku amudalanniyu animutyamulè ciguru bondlandaru sindhukanyakalè talli nivèrugani
    dharmamul galave nèlata ni vèrugani nitulunnaviye paduguru nadacina bataye bata mandiki naccina mataye
    mata mancini vittina manci phalincu jònnalu vittina collela pandu poyi ragadamma puttadibòmma nidu
    puttintipai nènarumpa ramma kani pèncakunnanu kalyani ninnulu kanulu cudaka pròddu gaducune maku cilukalu
    palkina civurumavilla koyilal kusina gundèlètladu pògada cètlaku vrelu pudotla ganna nimmalambuga
    nètlu nilutumè kanna katukakayanu kanta nenittu kunkuma bharinini kòmma nenittu jodusèmmèlu niku joti
    nenittu pattina dantayu bangaru kaga muttina dèllayu mutyambu kaga kadupusarèku vega kadali ravamma
    madilona mammula maracipokamma anta mahalakshmi yanugu nèccèlula cèkkulu muddadi cibukambu lanti kanthambu
    nindina kannillu napi bangaru cèlulara nenayi mirèlla nègadi mayinta ayya kannula mundu adukoramma
    pattukucculu navi parikinil navi pandita tugadu payitalu navi svecchaga mirèlla cekònramma appudappudu
    lacci talucukoramma ani bujjagamuladi yandalambèkki kamalakshunintiki kadalè shrilakshmi kanupapalo
    kranti krandukònnatlu kandacèkkèra palu kalasiyunnatlu anjanacala vasu dalamelumanga jantavayaka sukha
    santosha lila sadhu rakshanamunu salupucunnaru sadhu rakshanamunu salupucunnaru arigani mangalasutramu
    cèragani kunkuma tarigani sukhamu lòsangunu harisati yi pata vinna abalala kèpudun
  devanagari: वलचि वरिञ्चिन वरलक्ष्मि गाथ घनमन्दाराद्रिनि कव्वम्बुगानु वासुकि त्राडुगा वरलङ्ग चेसि अमृतम्बु
    काङ्क्षिञ्चि असुरुलु सुरलु चिलुकङ्ग चिलुकङ्ग क्षीरसागरमु परम पावनमैन बारसिनाडु मॆलुगारु तॊलकरि मॆरुपुल
    तिप्प ऒय्यारमुल लप्प ऒप्पुलकुप्प चिन्नारि पॊन्नारि श्रीमहादेवि अष्टदलाब्जमन्दाविर्भविञ्चॆ निङ्गिनि
    ताकॆडु निद्दम्पुटललु तूगुटुय्याललै तुम्पॆसलार बाल ता नटुतूग पद्मम्मुछाय कन्नॆ ता निटुतूग कलुवपूछाय
    अटुतूगि इटुतूगि अपरञ्जि मुद्द वीक्षिञ्चु चुण्डगा वॆदुरुमोसट्लु पॆरिगि पॆण्डिलियीडु पिल्लय्यॆनन्त कल्पदृमम्बुन
    कलिकलं बोलि तनुवुन पुलकलु दट्टमै निगुड बार जाचि प्रमोद भाष्पमुल् राल रावम्म भाग्याल राशि रावम्मा रावम्म
    इन्दिरारमणि रावम्मा लोक शोकमु बापु लोलाक्षि वीवु नाकु कूतुरु वौट नापुण्यमम्म अञ्चु मुरिसिपोयि अम्बुधिस्वामि
    उप्पॊङ्गि उप्पॊङ्गि उप्परं बण्टॆ सखियनु मङ्गल स्नान माडिम्प वासवुण्डर्पिञ्चॆ वज्रपीठम्मु पूतनदीजल
    पूर्णपुण्याह कलशालतोड दिग्गजमु लव्वेल जलजातगन्धिकि जलकम्मु लार्चॆ बङ्गारु सरिगञ्चु पट्टुपुट्टम्मु
    कट्टङ्ग सुतकिच्चॆ कलशवाराशि वॆललेनि नगलिच्चॆ विश्वकर्मुण्डु राजीव मुखुलैन रम्भादु लन्त कुरुलु नुन्नग
    दुव्वि कील्जड सवरिञ्चि किञ्जल्कधूलि चॆदरनि क्रॊव्विरुल् चिक्कग मुडिचि कलल पुट्टिनयिण्ड्लु कन्नुलकु
    कम्मनि कव्रम्पु काटुक दिद्दि वॆन्नॆलतेटयौ वॆडदमोमुनकु गुम्मडि वित्तन्त कुङ्कुम पॆट्टि अत्तरु जव्वाजि
    अगरु चन्दनमु तनुवॆल्ल आमॆ मुन्दटनु निलुवुटद्दम्बुनु निलिपि रन्तटनु तन रूपु श्रीलक्ष्मि दर्पण म्मन्दु
    कनुबॊम्म निक्कगा कनुगॊनि नव्वि सिंहासनमु डिग्गि चॆङ्गल्वदण्ड चेदाल्चि यच्चरल् चेरि कॊल्वङ्ग कुच्चॆल्लु
    मीगाल्ल गुनिसियाडङ्ग गरुडु गन्धर्व राक्षस यक्ष दिविज सङ्घ मध्यमुनकु सरगौन वच्चॆ चॆप्प चोद्यं बैन शृङ्गारवल्लि
    मॊलकनव्वुल मुद्दुमोमुनु जूचि सोगकन्नुल वालुचूपुलु चूचि मुदुरु सम्पॆङ्ग मॊग्ग मुक्कुनु जूचि अमृतम्बु
    दॊलकॆडु अधरम्बु चूचि सिग्गुलु सुडिवडु चॆक्किल्लु चूचि मुत्याल मॆच्चनि मुनिपण्ड्ल चूचि पालिण्ड्ल जारु
    पय्यॆद चूचि जवजवमनु कौसुसारुनु चूचि गुण्ड्रनि पिरुदुल कुदिरिक चूचि कमनीय कलहंस गमनम्बु चूचि मॊगमुन
    कन्दमौ मॊटिमनु जूचि मधुसूदनुडु दक्क मगवारलॆल्ल वलपु निक्काककु वशवर्तुलैरि कन्नुल कॆगदन्नु कैपुन तन्नु
    तिलकिञ्चु चुन्नट्टि दिक्पालकादि सुरवर्गमुनु गाञ्चि सुदति भाविञ्चॆ ऒक डण्टरानिवा डॊकडु जारुण्डु ऒकडु
    रक्तपिपासि ऒक्कडु जडधि ऒकडु तिरिपिगा ऒकडु चञ्चलुडु ऒक्कटि तऱकैन ऒक्कटि तालु ई मॊगम्मुलकटे इन्तिन्त
    नुनुपु श्रीवत्सवक्षुण्डु श्रितरक्षकुण्डु पुण्डरीकाक्षुण्डु भुवनमोहनुडु तप्त चामीकर धगधग द्धगित पीताम्बरधरुण्डु
    मणिपुञ्ज रञ्जित मञ्जुल मकुट मकर कुण्डल हार मञ्जीर कटक काञ्चिका केयूर क्रमभूषणुडु अनुपम ज्ञान बलैश्वर्य
    वीर्य माधुर्य गाम्भीर्य मार्ध वौदार्य शौर्य धैर्य स्थैर्य चातुर्य मुख्य कल्याण गुण गणौघ महार्णवुण्डु
    विश्वमन्तयु तानैनवाडु शेषाद्रिनिलयुण्डु श्रीनिवासुण्डु पतियैन सुखमुलु पडयङ्ग वच्चु तुललेनि भोगाल तुलदूग
    वच्चु एडेडु लोकाल नेलङ्ग वच्चु अञ्चु शौरिकि वैचॆ अलमेलु मङ्ग चॆङ्गल्व विरिदण्ड चित्तमुप्पॊङ्ग सकल
    जगम्बुलु जयवॆट्टु चुण्ड शचियु गौरियु वाणि सर्वेश्वरुनकु तलयण्टि पन्नीट तान माडिञ्चि तडियॊत्ति वेणुपत्रमुलन्त
    चेसि नामम्बुलनु दिद्दि नवभूषणमुल गैसेय दिविजवर्गमुल गॊलुव कदलनै रावणगजमुपै स्वामि केशवा यञ्चुनु कीरमुल्
    पलुक नारायणायञ्चु नॆमलुल् पलुक माधवायञ्चुनु मधुपमुल् पलुक गोविन्द यनुचुनु कोयिलल् पलुक तयितक्क धिमितक्क
    तद्धिमित किट झणुत तकझणुत झणुत यटञ्चु अच्चर विरिबोणु लाडि पाडङ्ग मुत्तैदुवुलु सेस मुत्यालु चल्ल चल्लगा
    वेञ्चेयु जलदवर्णुनकु अग्रम्बुनन् वेद आम्नाय घोष वॆनुक मन्त्रध्वनि विनुवीधि मुट्टॆ अदॆवच्चॆ इदॆवच्चॆ
    अल्लुडटञ्चु मामगारॆदुरेगि मधुपर्कमिच्चॆ पन्दिटि लोनिकि पट्टि तोड्तॆच्चॆ पुण्य तीर्थम्बुलु प्रोक्षिञ्चि
    ऋषुलु मङ्गलाशासन मङ्गलम्मिडग कमलचेतिकि चक्रि कट्टॆ कङ्कणमु दिव्य शङ्खम्बुलु तिरुचिन्नमुलुनु वेणु मर्दल
    रुद्रवीणलु मॊरय तलवञ्चि कूर्चुन्न तन्वि कण्ठमुन मधुवैरि गीलिञ्चॆ माङ्गल्यमपुडु चेतुल तलब्रालु चेकॊनि
    गूड पोयगा वॆनुकाडु पुवुबोणि मुन्दु शिरमुवञ्चिन यट्टि श्रीधरुजूचि पकपक नव्विरि पल्लवाधरुलु पदुनाल्गु
    भुवनमुल् पालिञ्चु नट्टि चल्लनि विभुनकु जयमङ्गलम्बु पदमु मोपिन चोट पसिडि पण्डिञ्चु चूडिकुत्तुककु शुभमङ्गलम्बु
    अञ्चु हारतु लॆत्त नङ्गनामणुलु सागॆ बुव्वमुबन्ति सन्तोषमुगनु कलित कङ्कणझणात्कारम्मु लॆसग कटकलङ्घलाघलात्कारमुल्
    पॊसग पिरुदुलपै वेणि पिम्पिल्लु गूय मॊगमुन तिलकम्बु मुक्कुन जार चिरुचॆम्मटल दोगि चॆदरु गन्धम्मु घुम
    घुम वासनल् ग्रुम्मरिम्पङ्ग चुरुकु जूपुल कोपु चूपऱ गुण्डॆ वलपु चिच्चु रगुल्प वगलाडि यॊकतॆ कोडिग म्माडॆनु
    गोपालु निट्लु मन पॆण्ड्लि कॊडुकॆन्तो महनीयुडम्मा महिललन् वलपिञ्चु मन्त्रगाडम्मा मच्चुमन्दुलु चल्लि
    मदि दोचुकुन्न करिवानि नॆव्वारु कामिन्तुरम्मा सुकियलु पोलीलु सॊगियवु गानि पुरपुर मट्टिनि बॊक्कॆडु नण्ट
    पट्टॆ मञ्चमु वेसि पान्पमरिम्प पामुपै ताबोयि पवलिञ्चु नण्ट अम्बारियेनुगे अवतल कम्पि गद्द मीद वयालि
    गदलॆडु नण्ट विन्तवेषमुलॆन्नो वेसॆडु नण्टरासिक्य मिटुलुञ्चि आकारसौन्दर्यमु अरयुद म्मन्न कनुलु चेतुलु
    मोमु काल्लु मॊत्तम्मु तामरकलिमिकि स्थानम्मु सुम्मु ई यण्टु मनबाल कॆपुडण्ट कुण्ड तामरसिरिगल धन्यात्मुनकुनु
    नलिचि नल्लेरुतो नलुगिड वलॆनु कन्द नीटनु ऒडल् गडुगङ्ग वलॆनु गन्धक लेपम्मु कडुबूय वलॆनु वाडवाडल द्रिप्पि
    वदलङ्ग वलॆनु आ माटलालिञ्चि हरुपट्टमहिषि माधवुचॆलिय आ बडति किट्लाडॆ अति विस्तारम्बेल अन्दालचिलुक नीवु
    नेर्चिन तॆन्गु नेर्तुरे यॊरुलु वॆन्नुनि नलुपञ्चु वॆक्किरिञ्चितिवि नॆलतुक ऎरुपञ्चु निक्कु चूपितिवि
    कलुवपूवु नलुपु कस्तूरि नलुपु कन्दिरीग ऎरुपु काकि नोरॆरुपु ई रॆण्डु रङ्गुलन्दे रङ्गु मॆऋगो सॊड्डु वेयुट
    गादु सूटिगा जॆप्पु वरुनि जूचिन कण्ट वधुवुनु जूडु माय मर्ममु वीडि मरि बदुलाडु कलिकि काल्सेतुलु कन्नुलु
    मोमु तामर विरिसिन तावुलु गावो तामरलो बुट्टि तामर बॆरुगु कॊम्म मेनिकि दूलगॊण्डि राचॆदवो कन्दनीटि चिकित्स
    गारविञ्चॆदवो इन्तिन्त कन्नुल नॆगदिजूचि सिग्गुतो नॆम्मोमु चेत गप्पिकॊनि अनलुकॊनलु वेयु अनुरक्तितोड
    रसिकत लेनि मा रङ्गनि मॆडनु पूलमालनु वेसि पॊलुपुगा नतनि गुण्डॆलपै जेरि कुलुकङ्ग दलचु रङ्गनायकि ऎन्त
    रसिकुरालम्म शफरलोचन यॆन्त चपलुरालम्म आ नव्वु लीनव्वु लरविरिमल्लॆ अन्दालु चिन्दुचु अलरिम्प मदुलु सकल
    वैभवमुल जरिगॆनु पॆण्ड्लि अम्पकम्मुल वेल अरुदॆञ्चिनन्त पसुपु कुङ्कुम पूलु पण्डु टॆङ्काय ताम्बूल मॊडि
    दाल्चि तरलाक्षि लक्ष्मि तलपु लोपल कृङ्गु तण्ड्रिनि जेरि नायना यनि पिल्चि नवदुःख भाष्प कणमुलु जलजल
    कन्नुल राल गुण्डॆपै तलवाल्चि कुमुलु चुण्डङ्ग कडिवॆडु बडबाग्नि कडुपुलो नणचि शिरमुनु मूर्कॊनि चॆक्किल्लु
    निमिरि पालपूसलतल्लि भाग्यालवॆल्लि वेड्क अत्तिण्टिकि वॆल्लि रावम्म आडपिल्ललकु तण्ड्रि अय्यॆडु कण्टे
    मति गति लेनट्टि मौनालु मेलु वीनुल नीपाट विनिपिञ्चु चुण्ड कन्नुल नी आट कनिपिञ्चु चुण्ड ऊरटतो नॆट्टुलुन्दुने
    यम्म गडियलो निनु वच्चि कनकुन्दु नम्म अनि सागरुडु पुत्रि ननुनयिम्पग बुद्धुलु गरपिरि पुण्यकामिनुलु एमि
    नोमु फलम्बो एमि भाग्यम्बो वेदान्त वेद्युडु विभुडायॆ नीकु आमुदालन्नियु आणिमुत्यमुलॆ चिगुरु बोण्ड्लन्दरु
    सिन्धुकन्यकलॆ तल्लि नीवॆरुगनि धर्ममुल् गलवे नॆलत नी वॆरुगनि नीतुलुन्नविये पदुगुरु नडचिन बाटये बाट
    मन्दिकि नच्चिन माटये माट मञ्चिनि वित्तिन मञ्चि फलिञ्चु जॊन्नलु वित्तिन चोल्लेल पण्डु पोयि रागदम्म
    पुत्तडिबॊम्म नीदु पुट्टिण्टिपै नॆनरुम्प रम्म कनि पॆञ्चकुन्ननु कल्याणि निन्नुलु कनुलु चूडक प्रॊद्दु
    गडुचुने माकु चिलुकलु पल्किन चिवुरुमाविल्ल कोयिलल् कूसिन गुण्डॆलॆट्लाडु पॊगड चॆट्लकु व्रेलु पूदोट्ल
    गन्न निम्मलम्बुग नॆट्लु निलुतुमॆ कन्न काटुककायनु कान्त नेनित्तु कुङ्कुम भरिणिनि कॊम्म नेनित्तु जोडुसॆम्मॆलु
    नीकु जोटि नेनित्तु पट्टिन दन्तयु बङ्गारु काग मुट्टिन दॆल्लयु मुत्यम्बु काग कडुपुसारॆकु वेग कदलि रावम्म
    मदिलोन मम्मुल मरचिपोकम्म अन्त महालक्ष्मि यनुगु नॆच्चॆलुल चॆक्कुलु मुद्दाडि चिबुकम्बु लण्टि कण्ठम्बु
    निण्डिन कन्नील्लु नापि बङ्गारु चॆलुलारा नेनयि मीरॆल्ल नॆगडि मायिण्ट अय्य कन्नुल मुन्दु आडुकोरम्म पट्टुकुच्चुलु
    नावि परिकीणील् नावि पन्दिट तूगाडु पयिटलु नावि स्वेच्छगा मीरॆल्ल चेकॊन्रम्म अप्पुडप्पुडु लच्चि तलुचुकोरम्म
    अनि बुज्जगमुलाडि यन्दलम्बॆक्कि कमलाक्षुनिण्टिकि कदलॆ श्रीलक्ष्मि कनुपापलो क्रान्ति क्रन्दुकॊन्नट्लु
    कण्डचॆक्कॆर पालु कलसियुन्नट्लु अञ्जनाचल वासु दलमेलुमङ्ग जण्टवायक सुख सन्तोष लील साधु रक्षणमुनु सलुपुचुन्नारु
    साधु रक्षणमुनु सलुपुचुन्नारु अऋगनि मङ्गलसूत्रमु चॆरगनि कुङ्कुम तऋगनि सुखमु लॊसङ्गुनु हरिसति यी पाट
    विन्न अबलल कॆपुडुन्
