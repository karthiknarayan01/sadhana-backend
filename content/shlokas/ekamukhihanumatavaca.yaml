id: ekamukhihanumatavaca
category: kavacha
name:
  english: ekamukhihanumatavaca
  devanagari: एकमुखीहनुमतवच
content:
  english: rinu devi pravakshyami lokanam hitakamyaya | vibhishanaya ramena premna dattam ca yatpura ||
    kavacam kapinathasya vayuputrasya dhimatah | guhyam te sampravakshyami visheshacchrinu sundari ||
    om asya shrihanumat kavacastotramantrasya shriramacandra rishih | anushtupchandah | shrimahaviro hanuman
    devata| marutatmaja iti bijam || om anjanasunuriti shaktih | om hraim hram hraum iti kavacam | svaha
    iti kilakam | lakshmanapranadata iti bijam | mama sakalakaryasiddhyarthe jape viniyogah || atha nyasah
    om hram angushthabhyam namah | om hrim tarjanibhyam namah | om hrum madhyamabhyam namah | om hraim
    anamikabhyam namah | om hraum kanishthikabhyam namah | om hrah karatalakaraprishthabhyam namah | om
    anjanasunave hridayaya namah | om rudramurtaye shirase svaha | om vayusutatmane shikhayai vashat |
    om vajradehaya kavacaya hum | om ramadutaya netratrayaya vaushat | om brahmastranivaranaya astraya
    phat | om ramadutaya vidmahe kapirajaya dhimahi | tanno hanuman pracodayat om hum phat svaha || iti
    digbandhah || atha dhyanam || om dhyayedbaladivakaradhritinibham devaridarpapaham devendrapramukhaprashastayashasam
    dedipyamanam ruca | sugrivadisamastavanarayutam suvyaktatattvapriyam samraktarunalocanam pavanajam
    pitambaralankritam || 1|| udyanmartandakotiprakataruciyutam caruvirasanastham maunjiyajnopavitarunarucirashikhashobhitam
    kundalangam | bhaktanamishtadam tam pranatamunijanam vedanadapramodam dhyayeddevam vidheyam plavagakulapatim
    goshpadibhutavardhim || 2|| vajrangam pingakeshadhyam svarnakundalamanditam | niyuddhakarmakushalam
    paravaraparakramam || 3|| vamahaste mahavriksham dashasyakarakhandanam | udyaddakshinadordandam hanumantam
    vicintayet || 4|| sphatikabham svarnakanti dvibhujam ca kritanjalim | kundaladvayasamshobhimukhambhojam
    harim bhajet || 5|| udyadadityasankashamudarabhujavikramam | kandarpakotilavanyam sarvavidyavisharadam
    || 6|| shriramahridayanandam bhaktakalpamahiruham | abhayam varadam dorbhyam kalaye marutatmajam ||
    7|| aparajita namaste'stu namaste ramapujita | prasthanam ca karishyami siddhirbhavatu me sada ||
    8|| yo varamnidhimalpapalvalamivollanghya pratapanvito vaidehighanashokatapaharano vaikunthatattvapriyah
    | akshadyarcitarakshaseshvaramahadarpapahari rane | so'yam vanarapungavo'vatu sada yushmansamiratmajah
    || 9|| vajrangam pingakesham kanakamayalasatkundalakrantagandam nana vidyadhinatham karatalavidhritam
    purnakumbham dridham ca bhaktabhishtadhikaram vidadhati ca sada sarvada suprasannam trailokyatranakaram
    sakalabhuvanagam ramadutam namami || 10|| udyallangulakeshapralayajaladharam bhimamurtim kapindram
    vande ramanghripadmabhramaraparivritam tattvasaram prasannam | vajrangam vajrarupam kanakamayalasatkundalakrantagandam
    dambholistambhasarapraharanavikatam bhutaraksho'dhinatham || 11|| vame kare vairibhayam vahantam shailam
    ca dakshe nijakanthalagnam | dadhanamasadya suvarnavarnam bhajejjvalatkundalaramadutam || 12|| padmaragamanikundalatvisha
    patalikritakapolamandalam | divyagehakadalivanantare bhavayami pavamananandanam || 13|| ishvara uvaca
    iti vadati visheshadraghavo rakshasendram pramuditavaracitto ravanasyanujo h raghuvaravaradutam pujayamasa
    bhuyah stutibhirakritarthah svam param manyamanah || 14|| vande vidyudvalayasubhagasvarnayajnopavitam
    karnadvandve kanakarucire kundale dharayantam | uccairhrishyaddyumanikiranashrenisambhavitangam satkaupinam
    kapivaravritam kamarupam kapindram || 15|| manojavam marutatulyavegam jitendriyam buddhimatam varishtham
    | vatatmajam vanarayuthamukhyam shriramadutam satatam smarami || 16|| om namo bhagavate hridayaya
    namah | om anjaneyaya shirase svaha | om rudramurtaye shikhayai vashat | om ramadutaya kavacaya hum
    | om hanumate netratrayaya vaushat | om agnigarbhaya astraya phat | om namo bhagavate angushthabhyam
    namah | om anjaneyaya tarjanibhyam namah | om rudramurtaye madhyamabhyam namah | om vayusunave anamikabhyam
    namah | om hanumate kanishthikabhyam namah | om agnigarbhaya karatalakaraprishthabhyam namah | atha
    mantra ucyate om aim hrim shrim hram hrim hrum hraim hraum hrah | om hrim hraum om namo bhagavate
    mahabalaparakramaya bhutapretapishaca shakini dakini yakshini putanamari mahamari bhairava
  devanagari: ृणु देवि प्रवक्ष्यामि लोकानां हितकाम्यया । विभीषणाय रामेण प्रेम्णा दत्तं च यत्पुरा ॥ कवचं
    कपिनाथस्य वायुपुत्रस्य धीमतः । गुह्यं ते सम्प्रवक्ष्यामि विशेषाच्छृणु सुन्दरि ॥ ॐ अस्य श्रीहनुमत्
    कवचस्तोत्रमन्त्रस्य श्रीरामचन्द्र ऋषिः । अनुष्टुप्छन्दः । श्रीमहावीरो हनुमान् देवता। मारुतात्मज इति
    बीजम् ॥ ॐ अञ्जनासूनुरिति शक्तिः । ॐ ह्रैं ह्रां ह्रौं इति कवचम् । स्वाहा इति कीलकम् । लक्ष्मणप्राणदाता
    इति बीजम् । मम सकलकार्यसिद्ध्यर्थे जपे वीनियोगः ॥ अथ न्यासः ॐ ह्रां अङ्गुष्ठाभ्यां नमः । ॐ ह्रीं तर्जनीभ्यां
    नमः । ॐ ह्रूं मध्यमाभ्यां नमः । ॐ ह्रैं अनामिकाभ्यां नमः । ॐ ह्रौं कनिष्ठिकाभ्यां नमः । ॐ ह्रः करतलकरपृष्ठाभ्यां
    नमः । ॐ अञ्जनासूनवे हृदयाय नमः । ॐ रुद्रमूर्तये शिरसे स्वाहा । ॐ वायुसुतात्मने शिखायै वषट् । ॐ वज्रदेहाय
    कवचाय हुम् । ॐ रामदूताय नेत्रत्रयाय वौषट् । ॐ ब्रह्मास्त्रनिवारणाय अस्त्राय फट् । ॐ रामदूताय विद्महे
    कपिराजाय धीमही । तन्नो हनुमान् प्रचोदयात् ॐ हुं फट् स्वाहा ॥ इति दिग्बन्धः ॥ अथ ध्यानम् ॥ ॐ ध्यायेद्बालदिवाकरधृतिनिभं
    देवारिदर्पापहं देवेन्द्रप्रमुखप्रशस्तयशसं देदीप्यमानं रुचा । सुग्रीवादिसमस्तवानरयुतं सुव्यक्ततत्त्वप्रियं
    संरक्तारुणलोचनं पवनजं पीताम्बरालङ्कृतम् ॥ १॥ उद्यन्मार्तण्डकोटिप्रकटरुचियुतं चारुवीरासनस्थं मौञ्जीयज्ञोपवीतारुणरुचिरशिखाशोभितं
    कुण्डलाङ्गम् । भक्तानामिष्टदं तं प्रणतमुनिजनं वेदनादप्रमोदं ध्यायेद्देवं विधेयं प्लवगकुलपतिं गोष्पदीभूतवार्धिम्
    ॥ २॥ वज्राङ्गं पिङ्गकेशाढ्यं स्वर्णकुण्डलमण्डितम् । नियुद्धकर्मकुशलं पारावारपराक्रमम् ॥ ३॥ वामहस्ते
    महावृक्षं दशास्यकरखण्डनम् । उद्यद्दक्षिणदोर्दण्डं हनुमन्तं विचिन्तयेत् ॥ ४॥ स्फटिकाभं स्वर्णकान्ति
    द्विभुजं च कृताञ्जलिम् । कुण्डलद्वयसंशोभिमुखाम्भोजं हरिं भजेत् ॥ ५॥ उद्यदादित्यसङ्काशमुदारभुजविक्रमम्
    । कन्दर्पकोटिलावण्यं सर्वविद्याविशारदम् ॥ ६॥ श्रीरामहृदयानन्दं भक्तकल्पमहीरूहम् । अभयं वरदं दोर्भ्यां
    कलये मारूतात्मजम् ॥ ७॥ अपराजित नमस्तेऽस्तु नमस्ते रामपूजित । प्रस्थानं च करिष्यामि सिद्धिर्भवतु मे
    सदा ॥ ८॥ यो वारांनिधिमल्पपल्वलमिवोल्लङ्घ्य प्रतापान्वितो वैदेहीघनशोकतापहरणो वैकुण्ठतत्त्वप्रियः ।
    अक्षाद्यर्चितराक्षसेश्वरमहादर्पापहारी रणे । सोऽयं वानरपुङ्गवोऽवतु सदा युष्मान्समीरात्मजः ॥ ९॥ वज्राङ्गं
    पिङ्गकेशं कनकमयलसत्कुण्डलाक्रान्तगण्डं नाना विद्याधिनाथं करतलविधृतं पूर्णकुम्भं दृढं च भक्ताभीष्टाधिकारं
    विदधति च सदा सर्वदा सुप्रसन्नं त्रैलोक्यत्राणकारं सकलभुवनगं रामदूतं नमामि ॥ १०॥ उद्यल्लाङ्गूलकेशप्रलयजलधरं
    भीममूर्तिं कपीन्द्रं वन्दे रामाङ्घ्रिपद्मभ्रमरपरिवृतं तत्त्वसारं प्रसन्नम् । वज्राङ्गं वज्ररूपं कनकमयलसत्कुण्डलाक्रान्तगण्डं
    दम्भोलिस्तम्भसारप्रहरणविकटं भूतरक्षोऽधिनाथम् ॥ ११॥ वामे करे वैरिभयं वहन्तं शैलं च दक्षे निजकण्ठलग्नम्
    । दधानमासाद्य सुवर्णवर्णं भजेज्ज्वलत्कुण्डलरामदूतम् ॥ १२॥ पद्मरागमणिकुण्डलत्विषा पाटलीकृतकपोलमण्डलम्
    । दिव्यगेहकदलीवनान्तरे भावयामि पवमाननन्दनम् ॥ १३॥ ईश्वर उवाच इति वदति विशेषाद्राघवो राक्षसेन्द्रम्
    प्रमुदितवरचित्तो रावणस्यानुजो ह् रघुवरवरदूतं पूजयामास भूयः स्तुतिभिरकृतार्थः स्वं परं मन्यमानः ॥ १४॥
    वन्दे विद्युद्वलयसुभगस्वर्णयज्ञोपवीतं कर्णद्वन्द्वे कनकरुचिरे कुण्डले धारयन्तम् । उच्चैर्हृष्यद्द्युमणिकिरणश्रेणिसम्भाविताङ्गं
    सत्कौपीनं कपिवरवृतं कामरूपं कपीन्द्रम् ॥ १५॥ मनोजवं मारुततुल्यवेगं जितेन्द्रियं बुद्धिमतां वरिष्ठम्
    । वातात्मजं वानरयूथमुख्यं श्रीरामदूतं सततं स्मरामि ॥ १६॥ ॐ नमो भगवते हृदयाय नमः । ॐ आञ्जनेयाय शिरसे
    स्वाहा । ॐ रुद्रमूर्तये शिखायै वषट् । ॐ रामदूताय कवचाय हुम् । ॐ हनुमते नेत्रत्रयाय वौषट् । ॐ अग्निगर्भाय
    अस्त्राय फट् । ॐ नमो भगवते अङ्गुष्ठाभ्यां नमः । ॐ आञ्जनेयाय तर्जनीभ्यां नमः । ॐ रुद्रमूर्तये मध्यमाभ्यां
    नमः । ॐ वायुसूनवे अनामिकाभ्यां नमः । ॐ हनुमते कनिष्ठिकाभ्यां नमः । ॐ अग्निगर्भाय करतलकरपृष्ठाभ्यां
    नमः । अथ मन्त्र उच्यते ॐ ऐं ह्रीं श्रीं ह्रां ह्रीं ह्रूं ह्रैं ह्रौं ह्रः । ॐ ह्रीं ह्रौं ॐ नमो भगवते
    महाबलपराक्रमाय भूतप्रेतपिशाच शाकिनी डाकिनी यक्षिणी पूतनामारी महामारी भैरव
