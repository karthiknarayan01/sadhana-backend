id: shridevisahasranamastotra
category: stotram
name:
  english: shridevisahasranamastotra
  devanagari: श्रीदेवीसहस्रनामस्तोत्र
content:
  english: shivoma parama shaktirananta nishkalamala | shanta maheshvari nitya shashvati paramakshara
    || 60|| acintya kevala'nantya shivatma paramatmika | anadiravyaya shuddha devatma sarvaga'cala ||
    61|| ekanekavibhagastha mayatita sunirmala | mahamaheshvari satya mahadevi niranjana || 62|| kashtha
    sarvantarastha ca cicchaktiratilalasa | nanda sarvatmika vidya jyotirupa'mritakshara || 63|| shantih
    pratishtha sarvesham nivrittiramritaprada | vyomamurtirvyomalaya vyomadhara'cyuta'mara || 64|| anadinidhana'mogha
    karanatma kulakula | kratuh prathamaja nabhiramritasyatmasamshraya || 65|| praneshvarapriya mata mahamahishaghatini
    | praneshvari pranarupa pradhanapurusheshvari || 66|| mahamaya sudushpura mulaprakritirishvari | sarvashaktikalakara
    jyotsna dhaurmahimaspada || 67|| sarvakaryaniyantri ca sarvabhuteshvareshvari | samsarayonih sakala
    sarvashaktisamudbhava || 68|| samsarapara durvara durnirikshya durasada | pranashaktih pranavidya
    yogini parama kala || 69|| mahavibhutidurgharsha mulaprakritisambhava | anadyanantavibhava parartha
    purusharanih || 70|| sargasthityantakarani sudurvacya duratyaya | shabdayonih shabdamayi nadakhya
    nadavigraha || 71|| anadiravyaktaguna mahananda sanatani | akashayoniryogastha mahayogeshvareshvari
    || 72|| mahamaya sudushpara mulaprakritirishvari | pradhanapurushatita pradhanapurushatmika || 73||
    purani cinmayi pumsamadih purusharupini | bhutantaratma kutastha mahapurushasamjnita || 74|| janmamrityujaratita
    sarvashaktisamanvita | vyapini canavacchinna pradhananupraveshini || 75|| kshetrajnashaktiravyaktalakshana
    malavarjita | anadimayasambhinna tritattva prakritirguha || 76|| mahamayasamutpanna tamasi paurushi
    dhruva | vyaktavyaktatmika krishna rakta shukla prasutika || 77|| akarya karyajanani nityam prasavadharmini
    | sargapralayanirmukta srishtisthityantadharmini || 78|| brahmagarbha caturvisha padmanabha'cyutatmika
    | vaidyuti shashvati yonirjaganmateshvarapriya || 79|| sarvadhara maharupa sarvaishvaryasamanvita
    | vishvarupa mahagarbha vishveshecchanuvartini || 80|| mahiyasi brahmayonih mahalakshmisamudbhava
    | mahavimanamadhyastha mahanidratmahetuka || 81|| sarvasadharani sukshma hyavidya paramarthika | anantarupa'nantastha
    devi purushamohini || 82|| anekakarasamsthana kalatrayavivarjita | brahmajanma harermurtirbrahmavishnushivatmika
    || 83|| brahmeshavishnujanani brahmakhya brahmasamshraya | vyakta prathamaja brahmi mahati jnanarupini
    || 84|| vairagyaishvaryadharmatma brahmamurtirhridisthita | apamyonih svayambhutirmanasi tattvasambhava
    || 85|| ishvarani ca sharvani shamkararddhasharirini | bhavani caiva rudrani mahalakshmirathambika
    || 86|| maheshvarasamutpanna bhuktimuktiphalaprada | sarveshvari sarvavandya nityam muditamanasa ||
    87|| brahmendropendranamita shamkarecchanuvartini | ishvararddhasanagata maheshvarapativrata || 88||
    sakridvibhata sarvarti samudraparishoshini | parvati himavatputri paramanandadayini || 89|| gunadhya
    yogaja yogya jnanamurtirvikasini | savitrikamala lakshmih shriranantorasi sthita || 90|| sarojanilaya
    mudra yoganidra surardini | sarasvati sarvavidya jagajjyeshtha sumangala || 91|| vagdevi varada vacya
    kirtih sarvarthasadhika | yogishvari brahmavidya mahavidya sushobhana || 92|| guhyavidyatmavidya ca
    dharmavidyatmabhavita | svaha vishvambhara siddhih svadha medha dhritih shrutih || 93|| nitih sunitih
    sukritirmadhavi naravahini | pujya vibhavari saumya bhogini bhogashayini || 94|| shobha vamshakari
    lola malini parameshthini | trailokyasundari ramya sundari kamacarini || 95|| mahanubhava sattvastha
    mahamahishamardini | padmamala papahara vicitra mukutanana || 96|| kanta citrambaradhara divyabaranabhushita
    | hamsakhya vyomanilaya jagatsrishtivivarddhini || 98|| niryantra yantravahastha nandini bhadrakalika
    | adityavarna kaumari mayuravaravahini || 99|| vrishasanagata gauri mahakali surarcita | aditirniyata
    raudri padmagarbha vivahana || 100|| virupakshi lelihana mahapuranivasini | mahaphala'navadyangi kamarupa
    vibhavari || 101|| vicitraratnamukuta pranatartiprabhanjani | kaushiki karshani ratristridashartivinashini
    || 102|| bahurupa svarupa ca virupa rupavarjita | bhaktartishamani bhavya bhavabharavinashani || 103||
    nirguna nityavibhava nihsara nirapatrapa | yashasvini samagitirbhavanganilayalaya || 104|| diksha
    vidyadhari dipta mahendravinipatini | sarvatishayini vishva sarvasiddhipradayini || 105|| sarveshvarapriya
    bharya samudrantaravasini | akalanka niradhara nityasiddha niramaya || 106|| kamadhenurbrihadgarbha
    dhimati mohanashini | nihsankalpa niratanka vinaya vinayaprada || 107|| jvalamalasahasradhya devadevi
    manomayi | mahabhagavati bharga vasudevasamudbhava || 108|| mahendropendrabhagini bhaktigamya paravara
    | jnanajneya jaratita vedantavishaya gatih || 109|| dakshina dahana dahya sarvabhutanamaskrita | yogamaya
    vibhagajna mahamaya mahiyasi || 110|| samdhya sarvasamudbhutirbrahmavrikshashrayanatih | bijankurasamudbhutirmahashaktirmahamatih
    || 111|| khyatih prajna citih samvit mahabhogindrashayini | vikritih shankari shastri ganagandharvasevita
    || 112|| vaishvanari mahashala devasena guhapriya | maharatrih shivananda shaci duhsvapnanashini ||
    113|| ijya pujya jagaddhatri durvijneya surupini | guhambika gunotpattirmahapitha marutsuta || 114||
    havyavahantaragadih havyavahasamudbhava | jagadyonirjaganmata janmamrityujaratiga | buddhimata buddhimati
    purushantaravasini || 117|| tapasvini samadhistha trinetra divisamsthita | sarvendriyamanomata sarvabhutahridisthita
    || 118|| samsaratarini vidya brahmavadimanolaya | brahmani brihati brahmi brahmabhuta bhavarani ||
    119|| hiranmayi maharatrih samsaraparivarttika | sumalini surupa ca bhavini tarini prabha || 120||
    unmilani sarvasaha sarvapratyayasakshini | susaumya candravadana tandavasaktamanasa || 121|| sattvashuddhikari
    shuddhirmalatrayavinashini | jagatpriya jaganmurtistrimurtiramritashraya || 122|| nirashraya nirahara
    nirankuravanodbhava | candrahasta vicitrangi sragvini padmadharini || 123|| paravaravidhanajna mahapurushapurvaja
    | vidyeshvarapriya vidya vidyujjihva jitashrama || 124|| vidyamayi sahasrakshi sahasravadanatmaja
    | sahasrarashmih sattvastha maheshvarapadashraya || 125|| kshalini sanmayi vyapta taijasi padmabodhika
    | mahamayashraya manya mahadevamanorama || 126|| vyomalakshmih siharatha cekitanamitaprabha | vireshvari
    vimanastha vishoka shokanashini || 127|| anahata kundalini nalini padmavasini | sadananda sadakirtih
    sarvabhutashrayasthita || 128|| vagdevata brahmakala kalatita kalarani | brahmashrirbrahmahridaya
    brahmavishnushivapriya || 129|| vyomashaktih kriyashaktirjnanashaktih paragatih | kshobhika bandhika
    bhedya bhedabhedavivarjita || 130|| abhinnabhinnasamsthana vamshini vamshaharini | guhyashaktirgunatita
    sarvada sarvatomukhi || 131|| bhagini bhagavatpatni sakala kalakarini | sarvavit sarvatobhadra guhyatita
    guharanih || 132|| prakriya yogamata ca ganga vishveshvareshvari | kapila kapila kantakanakabhakalantara
    || 133|| punya pushkarini bhoktri puramdarapurassara | poshani paramaishvaryabhutida bhutibhushana
    || 134|| pancabrahmasamutpattih paramartharthavigraha | dharmodaya bhanumati yogijneya manojava ||
    135|| manohara manoraksha tapasi vedarupini | vedashaktirvedamata vedavidyaprakashini || 136|| yogeshvareshvari
    mata mahashaktirmanomayi | vishvavastha viyanmurttirvidyunmala vihayasi || 137|| kinnari surabhirvandya
    nandini nandivallabha | bharati paramananda paraparavibhedika || 138|| sarvapraharanopeta kamya kameshvareshvari
    | acintya'cintyavibhava hrillekha kanakaprabha || 139|| kushmandi dhanaratnadhya sugandha gandhadayini
    | trivikramapadodbhuta dhanushpanih shivodaya || 140|| sudurlabha dhanadyaksha dhanya pingalalocana
    | shantih prabhavati diptih pankajayatalocana || 141|| adya hritkamalodbhuta gavam mata ranapriya
    | satkriya girija shuddha nityapushta nirantara || 142|| durga katyayani candi carcika shantavigraha
    | hiranyavarna rajani jagadyantrapravartika || 143|| mandaradrinivasa ca sharada svarnamalini | ratnamala
    ratnagarbha prithvi vishvapramathini || 144|| padmanana padmanibha nityatushta'mritodbhava | dhunvati
    duhprakampa ca suryamata drishadvati || 145|| mahendrabhagini manya varenya varadayika | kalyani kamala
    rama pancabhuta varaprada || 146|| vacya vareshvari vandya durjaya duratikrama | kalaratrirmahavega
    virabhadrapriya hita || 147|| bhadrakali jaganmata bhaktanam bhadradayini | karala pingalakara namabheda
    mahamada || 148|| yashasvini yashoda ca shadadhvaparivarttika | shankhini padmini samkhya samkhyayogapravartika
    || 149|| caitra samvatsararudha jagatsampuranindraja | shumbharih khecarisvastha kambugrivakalipriya
    || 150|| khagadhvaja khagarudha pararya paramalini | aishvaryapadmanilaya virakta garudasana || 151||
    jayanti hridguha ramya gahvareshtha ganagranih | samkalpasiddha samyastha sarvavijnanadayini || 152||
    kalikalmashahantri ca guhyopanishaduttama | nishtha drishtih smritirvyaptih pushtistushtih kriyavati
    || 153|| vishvamareshvareshana bhuktirmuktih shiva'mrita | lohita sarpamala ca bhishani vanamalini
    || 154|| anantashayana'nanta naranarayanodbhava | nrisimhi daityamathani shankhacakragadadhara ||
    155|| samkarshanasamutpattirambikapadasamshraya | mahajvala mahamurttih sumurttih sarvakamadhuk ||
    156|| suprabha sustana sauri dharmakamarthamokshada | bhrumadhyanilaya purva puranapurusharanih ||
    157|| mahavibhutida madhya sarojanayana sama | ashtadashabhujanadya nilotpaladalaprabha | 158|| sarvashaktyasanarudha
    dharmadharmarthavarjita | vairagyajnananirata niraloka nirindriya || 159|| vicitragahanadhara shashvatasthanavasini
    | sthaneshvari nirananda trishulavaradharini || 160|| asheshadevatamurttirdevata varadevata | ganambika
    gireh putri nishumbhavinipatini || 161|| avarna varnarahita trivarna jivasambhava | anantavarna'nanyastha
    shamkari shantamanasa || 162|| agotra gomati goptri guhyarupa gunottara | gaurgirgavyapriya gauni
    ganeshvaranamaskrita || 163|| satyamatra satyasandhya trisandhya samdhivarjita | sarvavadashraya samkhya
    samkhyayogasamudbhava || 164|| asamkhyeya'prameyakhya shunya shuddhakulodbhava | bindunadasamutpattih
    shambhuvama shashiprabha || 165|| visanga bhedarahita manojna madhusudani | mahashrih shrisamutpattistamahpare
    pratishthita || 166|| tritattvamata trividha susukshmapadasamshraya | shanta bhita malatita nirvikara
    nirashraya || 167|| shivakhya cittanilaya shivajnanasvarupini | daityadanavanirmatri kashyapi kalakarnika
    || 168|| shastrayonih kriyamurtishcaturvargapradarshika | narayani narodbhutih kaumudi lingadharini
    || 169|| kamuki lalitabhava paraparavibhutida | parantajatamahima badava vamalocana || 170|| subhadra
    devaki sita vedavedangaparaga | manasvini manyumata mahamanyusamudbhava || 171|| amrityuramritasvada
    puruhuta purushtuta | ashocya bhinnavishaya hiranyarajatapriya || 172|| hiranya rajati haima hemabharanabhushita
    | vibhrajamana durjneya jyotishtomaphalaprada || 173|| mahanidrasamudbhutiranidra satyadevata | dirgha
    kakudmini hridya shantida shantivarddhini || 174|| lakshmyadishaktijanani shakticakrapravartika |
    trishaktijanani janya shadurmiparivarjita || 175|| sudhama karmakarani yugantadahanatmika | samkarshani
    jagaddhatri kamayonih kiritini || 176|| aindri trailokyanamita vaishnavi parameshvari | pradyumnadayita
    datri yugmadrishtistrilocana || 177|| madotkata hamsagatih pracanda candavikrama | vrishavesha viyanmata
    vindhyaparvatavasini || 178|| himavanmerunilaya kailasagirivasini | canurahantritanaya nitijna kamarupini
    || 179|| vedavidyavratasnata dharmashila'nilashana | virabhadrapriya vira mahakamasamudbhava || 180||
    vidyadharapriya siddha vidyadharanirakritih | apyayani haranti ca pavani poshani khila || 181|| matrika
    manmathodbhuta varija vahanapriya | karishini sudhavani vinavadanatatpara || 182|| sevita sevika sevya
    sinivali garutmati | arundhati hiranyakshi mriganka manadayini || 183|| vasuprada vasumati vasordhara
    vasumdhara | dharadhara vararoha varavarasahasrada || 184|| shriphala shrimati shrisha shrinivasa
    shivapriya | shridhara shrikari kalya shridharardhasharirini || 185|| anantadrishtirakshudra dhatrisha
    dhanadapriya | nihantri daityasanghanam sihika sihavahana || 186|| sushena candranilaya sukirtishchinnasamshaya
    | rasajna rasada rama lelihanamritasrava || 187|| nityodita svayamjyotirutsuka mritajivana | vajradanda
    vajrajihva vaidehi vajravigraha || 188|| mangalya mangala mala malina malaharini | gandharvi garudi
    candri kambalashvatarapriya || 189|| saudamini janananda bhrukutikutilanana | karnikarakara kakshya
    kamsapranapaharini || 190|| yugandhara yugavartta trisamdhya harshavardhini | pratyakshadevata divya
    divyagandha divapara || 191|| shakrasanagata shakri sandhya carusharasana | ishta vishishta shishteshta
    shishtashishtaprapujita || 192|| shatarupa shatavartta vinata surabhih sura | surendramata sudyumna
    sushumna suryasamsthita || 193|| samikshya satpratishtha ca nivrittirjnanaparaga | dharmashastrarthakushala
    dharmajna dharmavahana || 194|| dharmadharmavinirmatri dharmikanam shivaprada | dharmashaktirdharmamayi
    vidharma vishvadharmini || 195|| dharmantara dharmamegha dharmapurva dhanavaha | dharmopadeshtri dharmatma
    dharmagamya dharadhara || 196|| kapali sakalamurttih kala kalitavigraha | sarvashaktivinirmukta sarvashaktyashrayashraya
    || 197|| sarva sarveshvari sukshma sukshma jnanasvarupini | pradhanapurusheshesha mahadevaikasakshini
    || 198|| sadashiva viyanmurttirvishvamurttiramurttika | evam namnam sahasrena stutva'sau himavan girih
    || 199|| bhuyah pranamya bhitatma provacedam kritanjalih | yadetadaishvaram rupam ghoram te parameshvari
    || 200|| bhito'smi sampratam drishtva rupamanyat pradarshaya | evamukta'tha sa devi tena shailena
    parvati || 201|| samhritya darshayamasa svarupamaparam punah | nilotpaladalaprakhyam nilotpalasugandhikam
    || 202|| dvinetram dvibhujam saumyam nilalakavibhushitam | raktapadambujatalam suraktakarapallavam
    || 203|| shrimadvishalasamvrittamlalatatilakojjvalam | bhushitam carusarvangam bhushanairatikomalam
    || 204|| dadhanamurasa malam vishalam hemanirmitam | ishatsmitam subimboshtham nupuraravasamyutam
    || 205|| prasannavadanam divyamanantamahimaspadam | tadidrisham samalokya svarupam shailasattamah
    || 206|| namnamashtasahasram tu devya yat samudiritam | jnatva'rkamandalagatam sambhavya parameshvarim
    || 207|| abhyarcya gandhapushpadyairbhaktiyogasamanvitah | samsmaranparamam bhavam devya maheshvaram
    param || 208|| ananyamanaso nityam japedamaranad dvijah | so'ntakale smritim labdhva param brahmadhigacchati
    || 209|| athava jayate vipro brahmananam kule shucau | purvasamskaramahatmyad brahmavidyamavapnuyat
    || 210|| samprapya yogam paramam divyam tat parameshvaram | shantah sarvagato bhutva shivasayujyamapnuyat
    || 211|| pratyekam catha namani juhuyat savanatrayam | putanadikritairdoshairgrahadoshaishca mucyate
    || 212|| japed va'haraharnityam samvatsaramatandritah | shrikamah parvatim devim pujayitva vidhanatah
    || 213|| sampujya parshvatah shambhum trinetram bhaktisamyutah | labhate mahatim lakshmim mahadevaprasadatah
    || 214|| tasmat sarvaprayatnena japtavyam hi dvijatibhih | sarvapapapanodartham devya nama sahasrakam
    || 215|| || iti shrikurmapurane shatsahastryam samhitayam purvavibhage shridevisahasranamastotram
    ||
  devanagari: शिवोमा परमा शक्तिरनन्ता निष्कलामला । शान्ता माहेश्वरी नित्या शाश्वती परमाक्षरा ॥ ६०॥ अचिन्त्या
    केवलाऽनन्त्या शिवात्मा परमात्मिका । अनादिरव्यया शुद्धा देवात्मा सर्वगाऽचला ॥ ६१॥ एकानेकविभागस्था मायातीता
    सुनिर्मला । महामाहेश्वरी सत्या महादेवी निरञ्जना ॥ ६२॥ काष्ठा सर्वान्तरस्था च चिच्छक्तिरतिलालसा । नन्दा
    सर्वात्मिका विद्या ज्योतीरूपाऽमृताक्षरा ॥ ६३॥ शान्तिः प्रतिष्ठा सर्वेषां निवृत्तिरमृतप्रदा । व्योममूर्तिर्व्योमलया
    व्योमाधाराऽच्युताऽमरा ॥ ६४॥ अनादिनिधनाऽमोघा कारणात्मा कुलाकुला । क्रतुः प्रथमजा नाभिरमृतस्यात्मसंश्रया
    ॥ ६५॥ प्राणेश्वरप्रिया माता महामहिषघातिनी । प्राणेश्वरी प्राणरूपा प्रधानपुरुषेश्वरी ॥ ६६॥ महामाया
    सुदुष्पूरा मूलप्रकृतिरीश्वरी । सर्वशक्तिकलाकारा ज्योत्स्ना धौर्महिमास्पदा ॥ ६७॥ सर्वकार्यनियन्त्री
    च सर्वभूतेश्वरेश्वरी । संसारयोनिः सकला सर्वशक्तिसमुद्भवा ॥ ६८॥ संसारपारा दुर्वारा दुर्निरीक्ष्य दुरासदा
    । प्राणशक्तिः प्राणविद्या योगिनी परमा कला ॥ ६९॥ महाविभूतिदुर्घर्षा मूलप्रकृतिसम्भवा । अनाद्यनन्तविभवा
    परार्था पुरुषारणिः ॥ ७०॥ सर्गस्थित्यन्तकरणी सुदुर्वाच्या दुरत्यया । शब्दयोनिः शब्दमयी नादाख्या नादविग्रहा
    ॥ ७१॥ अनादिरव्यक्तगुणा महानन्दा सनातनी । आकाशयोनिर्योगस्था महायोगेश्वरेश्वरी ॥ ७२॥ महामाया सुदुष्पारा
    मूलप्रकृतिरीश्वरी । प्रधानपुरुषातीता प्रधानपुरुषात्मिका ॥ ७३॥ पुराणी चिन्मयी पुंसामादिः पुरुषरूपिणी
    । भूतान्तरात्मा कूटस्था महापुरुषसंज्ञिता ॥ ७४॥ जन्ममृत्युजरातीता सर्वशक्तिसमन्विता । व्यापिनी चानवच्छिन्ना
    प्रधानानुप्रवेशिनी ॥ ७५॥ क्षेत्रज्ञशक्तिरव्यक्तलक्षणा मलवर्जिता । अनादिमायासंभिन्ना त्रितत्त्वा प्रकृतिर्गुहा
    ॥ ७६॥ महामायासमुत्पन्ना तामसी पौरुषी ध्रुवा । व्यक्ताव्यक्तात्मिका कृष्णा रक्ता शुक्ला प्रसूतिका ॥
    ७७॥ अकार्या कार्यजननी नित्यं प्रसवधर्मिणी । सर्गप्रलयनिर्मुक्ता सृष्टिस्थित्यन्तधर्मिणी ॥ ७८॥ ब्रह्मगर्भा
    चतुर्विशा पद्मनाभाऽच्युतात्मिका । वैद्युती शाश्वती योनिर्जगन्मातेश्वरप्रिया ॥ ७९॥ सर्वाधारा महारूपा
    सर्वैश्वर्यसमन्विता । विश्वरूपा महागर्भा विश्वेशेच्छानुवर्तिनी ॥ ८०॥ महीयसी ब्रह्मयोनिः महालक्ष्मीसमुद्भवा
    । महाविमानमध्यस्था महानिद्रात्महेतुका ॥ ८१॥ सर्वसाधारणी सूक्ष्मा ह्यविद्या पारमार्थिका । अनन्तरूपाऽनन्तस्था
    देवी पुरुषमोहिनी ॥ ८२॥ अनेकाकारसंस्थाना कालत्रयविवर्जिता । ब्रह्मजन्मा हरेर्मूर्तिर्ब्रह्मविष्णुशिवात्मिका
    ॥ ८३॥ ब्रह्मेशविष्णुजननी ब्रह्माख्या ब्रह्मसंश्रया । व्यक्ता प्रथमजा ब्राह्मी महती ज्ञानरूपिणी ॥ ८४॥
    वैराग्यैश्वर्यधर्मात्मा ब्रह्ममूर्तिर्हृदिस्थिता । अपांयोनिः स्वयंभूतिर्मानसी तत्त्वसंभवा ॥ ८५॥ ईश्वराणी
    च शर्वाणी शंकरार्द्धशरीरिणी । भवानी चैव रुद्राणी महालक्ष्मीरथाम्बिका ॥ ८६॥ महेश्वरसमुत्पन्ना भुक्तिमुक्तिफलप्रदा
    । सर्वेश्वरी सर्ववन्द्या नित्यं मुदितमानसा ॥ ८७॥ ब्रह्मेन्द्रोपेन्द्रनमिता शंकरेच्छानुवर्तिनी । ईश्वरार्द्धासनगता
    महेश्वरपतिव्रता ॥ ८८॥ सकृद्विभाता सर्वार्ति समुद्रपरिशोषिणी । पार्वती हिमवत्पुत्री परमानन्ददायिनी
    ॥ ८९॥ गुणाढ्या योगजा योग्या ज्ञानमूर्तिर्विकासिनी । सावित्रीकमला लक्ष्मीः श्रीरनन्तोरसि स्थिता ॥ ९०॥
    सरोजनिलया मुद्रा योगनिद्रा सुरार्दिनी । सरस्वती सर्वविद्या जगज्ज्येष्ठा सुमङ्गला ॥ ९१॥ वाग्देवी वरदा
    वाच्या कीर्तिः सर्वार्थसाधिका । योगीश्वरी ब्रह्मविद्या महाविद्या सुशोभना ॥ ९२॥ गुह्यविद्यात्मविद्या
    च धर्मविद्यात्मभाविता । स्वाहा विश्वंभरा सिद्धिः स्वधा मेधा धृतिः श्रुतिः ॥ ९३॥ नीतिः सुनीतिः सुकृतिर्माधवी
    नरवाहिनी । पूज्या विभावरी सौम्या भोगिनी भोगशायिनी ॥ ९४॥ शोभा वंशकरी लोला मालिनी परमेष्ठिनी । त्रैलोक्यसुन्दरी
    रम्या सुन्दरी कामचारिणी ॥ ९५॥ महानुभावा सत्त्वस्था महामहिषमर्दिनी । पद्ममाला पापहरा विचित्रा मुकुटानना
    ॥ ९६॥ कान्ता चित्राम्बरधरा दिव्याबरणभूषिता । हंसाख्या व्योमनिलया जगत्सृष्टिविवर्द्धिनी ॥ ९८॥ निर्यन्त्रा
    यन्त्रवाहस्था नन्दिनी भद्रकालिका । आदित्यवर्णा कौमारी मयूरवरवाहिनी ॥ ९९॥ वृषासनगता गौरी महाकाली सुरार्चिता
    । अदितिर्नियता रौद्री पद्मगर्भा विवाहना ॥ १००॥ विरूपाक्षी लेलिहाना महापुरनिवासिनी । महाफलाऽनवद्याङ्गी
    कामरूपा विभावरी ॥ १०१॥ विचित्ररत्नमुकुटा प्रणतार्तिप्रभञ्जनी । कौशिकी कर्षणी रात्रिस्त्रिदशार्तिविनाशिनी
    ॥ १०२॥ बहुरूपा स्वरूपा च विरूपा रूपवर्जिता । भक्तार्तिशमनी भव्या भवभारविनाशनी ॥ १०३॥ निर्गुणा नित्यविभवा
    निःसारा निरपत्रपा । यशस्विनी सामगीतिर्भवाङ्गनिलयालया ॥ १०४॥ दीक्षा विद्याधरी दीप्ता महेन्द्रविनिपातिनी
    । सर्वातिशायिनी विश्वा सर्वसिद्धिप्रदायिनी ॥ १०५॥ सर्वेश्वरप्रिया भार्या समुद्रान्तरवासिनी । अकलङ्का
    निराधारा नित्यसिद्धा निरामया ॥ १०६॥ कामधेनुर्बृहद्गर्भा धीमती मोहनाशिनी । निःसङ्कल्पा निरातङ्का विनया
    विनयप्रदा ॥ १०७॥ ज्वालामालासहस्राढ्या देवदेवी मनोमयी । महाभगवती भर्गा वासुदेवसमुद्भवा ॥ १०८॥ महेन्द्रोपेन्द्रभगिनी
    भक्तिगम्या परावरा । ज्ञानज्ञेया जरातीता वेदान्तविषया गतिः ॥ १०९॥ दक्षिणा दहना दाह्या सर्वभूतनमस्कृता
    । योगमाया विभागज्ञा महामाया महीयसी ॥ ११०॥ संध्या सर्वसमुद्भूतिर्ब्रह्मवृक्षाश्रयानतिः । बीजाङ्कुरसमुद्भूतिर्महाशक्तिर्महामतिः
    ॥ १११॥ ख्यातिः प्रज्ञा चितिः संवित् महाभोगीन्द्रशायिनी । विकृतिः शाङ्करी शास्त्री गणगन्धर्वसेविता
    ॥ ११२॥ वैश्वानरी महाशाला देवसेना गुहप्रिया । महारात्रिः शिवानन्दा शची दुःस्वप्ननाशिनी ॥ ११३॥ इज्या
    पूज्या जगद्धात्री दुर्विज्ञेया सुरूपिणी । गुहाम्बिका गुणोत्पत्तिर्महापीठा मरुत्सुता ॥ ११४॥ हव्यवाहान्तरागादिः
    हव्यवाहसमुद्भवा । जगद्योनिर्जगन्माता जन्ममृत्युजरातिगा । बुद्धिमाता बुद्धिमती पुरुषान्तरवासिनी ॥ ११७॥
    तपस्विनी समाधिस्था त्रिनेत्रा दिविसंस्थिता । सर्वेन्द्रियमनोमाता सर्वभूतहृदिस्थिता ॥ ११८॥ संसारतारिणी
    विद्या ब्रह्मवादिमनोलया । ब्रह्माणी बृहती ब्राह्मी ब्रह्मभूता भवारणी ॥ ११९॥ हिरण्मयी महारात्रिः संसारपरिवर्त्तिका
    । सुमालिनी सुरूपा च भाविनी तारिणी प्रभा ॥ १२०॥ उन्मीलनी सर्वसहा सर्वप्रत्ययसाक्षिणी । सुसौम्या चन्द्रवदना
    ताण्डवासक्तमानसा ॥ १२१॥ सत्त्वशुद्धिकरी शुद्धिर्मलत्रयविनाशिनी । जगत्प्रिया जगन्मूर्तिस्त्रिमूर्तिरमृताश्रया
    ॥ १२२॥ निराश्रया निराहारा निरङ्कुरवनोद्भवा । चन्द्रहस्ता विचित्राङ्गी स्रग्विणी पद्मधारिणी ॥ १२३॥
    परावरविधानज्ञा महापुरुषपूर्वजा । विद्येश्वरप्रिया विद्या विद्युज्जिह्वा जितश्रमा ॥ १२४॥ विद्यामयी
    सहस्राक्षी सहस्रवदनात्मजा । सहस्ररश्मिः सत्त्वस्था महेश्वरपदाश्रया ॥ १२५॥ क्षालिनी सन्मयी व्याप्ता
    तैजसी पद्मबोधिका । महामायाश्रया मान्या महादेवमनोरमा ॥ १२६॥ व्योमलक्ष्मीः सिहरथा चेकितानामितप्रभा ।
    वीरेश्वरी विमानस्था विशोका शोकनाशिनी ॥ १२७॥ अनाहता कुण्डलिनी नलिनी पद्मवासिनी । सदानन्दा सदाकीर्तिः
    सर्वभूताश्रयस्थिता ॥ १२८॥ वाग्देवता ब्रह्मकला कलातीता कलारणी । ब्रह्मश्रीर्ब्रह्महृदया ब्रह्मविष्णुशिवप्रिया
    ॥ १२९॥ व्योमशक्तिः क्रियाशक्तिर्ज्ञानशक्तिः परागतिः । क्षोभिका बन्धिका भेद्या भेदाभेदविवर्जिता ॥ १३०॥
    अभिन्नाभिन्नसंस्थाना वंशिनी वंशहारिणी । गुह्यशक्तिर्गुणातीता सर्वदा सर्वतोमुखी ॥ १३१॥ भगिनी भगवत्पत्नी
    सकला कालकारिणी । सर्ववित् सर्वतोभद्रा गुह्यातीता गुहारणिः ॥ १३२॥ प्रक्रिया योगमाता च गङ्गा विश्वेश्वरेश्वरी
    । कपिला कापिला कान्ताकनकाभाकलान्तरा ॥ १३३॥ पुण्या पुष्करिणी भोक्त्री पुरंदरपुरस्सरा । पोषणी परमैश्वर्यभूतिदा
    भूतिभूषणा ॥ १३४॥ पञ्चब्रह्मसमुत्पत्तिः परमार्थार्थविग्रहा । धर्मोदया भानुमती योगिज्ञेय मनोजवा ॥ १३५॥
    मनोहरा मनोरक्षा तापसी वेदरूपिणी । वेदशक्तिर्वेदमाता वेदविद्याप्रकाशिनी ॥ १३६॥ योगेश्वरेश्वरी माता
    महाशक्तिर्मनोमयी । विश्वावस्था वियन्मूर्त्तिर्विद्युन्माला विहायसी ॥ १३७॥ किन्नरी सुरभिर्वन्द्या नन्दिनी
    नन्दिवल्लभा । भारती परमानन्दा परापरविभेदिका ॥ १३८॥ सर्वप्रहरणोपेता काम्या कामेश्वरेश्वरी । अचिन्त्याऽचिन्त्यविभवा
    हृल्लेखा कनकप्रभा ॥ १३९॥ कूष्माण्डी धनरत्नाढ्या सुगन्धा गन्धदायिनी । त्रिविक्रमपदोद्भूता धनुष्पाणिः
    शिवोदया ॥ १४०॥ सुदुर्लभा धनाद्यक्षा धन्या पिङ्गललोचना । शान्तिः प्रभावती दीप्तिः पङ्कजायतलोचना ॥ १४१॥
    आद्या हृत्कमलोद्भूता गवां मता रणप्रिया । सत्क्रिया गिरिजा शुद्धा नित्यपुष्टा निरन्तरा ॥ १४२॥ दुर्गा
    कात्यायनी चण्डी चर्चिका शान्तविग्रहा । हिरण्यवर्णा रजनी जगद्यन्त्रप्रवर्तिका ॥ १४३॥ मन्दराद्रिनिवासा
    च शारदा स्वर्णमालिनी । रत्नमाला रत्नगर्भा पृथ्वी विश्वप्रमाथिनी ॥ १४४॥ पद्मानना पद्मनिभा नित्यतुष्टाऽमृतोद्भवा
    । धुन्वती दुःप्रकम्पा च सूर्यमाता दृषद्वती ॥ १४५॥ महेन्द्रभगिनी मान्या वरेण्या वरदायिका । कल्याणी
    कमला रामा पञ्चभूता वरप्रदा ॥ १४६॥ वाच्या वरेश्वरी वन्द्या दुर्जया दुरतिक्रमा । कालरात्रिर्महावेगा
    वीरभद्रप्रिया हिता ॥ १४७॥ भद्रकाली जगन्माता भक्तानां भद्रदायिनी । कराला पिङ्गलाकारा नामभेदा महामदा
    ॥ १४८॥ यशस्विनी यशोदा च षडध्वपरिवर्त्तिका । शङ्खिनी पद्मिनी सांख्या सांख्ययोगप्रवर्तिका ॥ १४९॥ चैत्रा
    संवत्सरारूढा जगत्सम्पूरणीन्द्रजा । शुम्भारिः खेचरीस्वस्था कम्बुग्रीवाकलिप्रिया ॥ १५०॥ खगध्वजा खगारूढा
    परार्या परमालिनी । ऐश्वर्यपद्मनिलया विरक्ता गरुडासना ॥ १५१॥ जयन्ती हृद्गुहा रम्या गह्वरेष्ठा गणाग्रणीः
    । संकल्पसिद्धा साम्यस्था सर्वविज्ञानदायिनी ॥ १५२॥ कलिकल्मषहन्त्री च गुह्योपनिषदुत्तमा । निष्ठा दृष्टिः
    स्मृतिर्व्याप्तिः पुष्टिस्तुष्टिः क्रियावती ॥ १५३॥ विश्वामरेश्वरेशाना भुक्तिर्मुक्तिः शिवाऽमृता ।
    लोहिता सर्पमाला च भीषणी वनमालिनी ॥ १५४॥ अनन्तशयनाऽनन्ता नरनारायणोद्भवा । नृसिंही दैत्यमथनी शङ्खचक्रगदाधरा
    ॥ १५५॥ संकर्षणसमुत्पत्तिरम्बिकापादसंश्रया । महाज्वाला महामूर्त्तिः सुमूर्त्तिः सर्वकामधुक् ॥ १५६॥
    सुप्रभा सुस्तना सौरी धर्मकामार्थमोक्षदा । भ्रूमध्यनिलया पूर्वा पुराणपुरुषारणिः ॥ १५७॥ महाविभूतिदा
    मध्या सरोजनयना समा । अष्टादशभुजानाद्या नीलोत्पलदलप्रभा । १५८॥ सर्वशक्त्यासनारूढा धर्माधर्मार्थवर्जिता
    । वैराग्यज्ञाननिरता निरालोका निरिन्द्रिया ॥ १५९॥ विचित्रगहनाधारा शाश्वतस्थानवासिनी । स्थानेश्वरी निरानन्दा
    त्रिशूलवरधारिणी ॥ १६०॥ अशेषदेवतामूर्त्तिर्देवता वरदेवता । गणाम्बिका गिरेः पुत्री निशुम्भविनिपातिनी
    ॥ १६१॥ अवर्णा वर्णरहिता त्रिवर्णा जीवसंभवा । अनन्तवर्णाऽनन्यस्था शंकरी शान्तमानसा ॥ १६२॥ अगोत्रा गोमती
    गोप्त्री गुह्यरूपा गुणोत्तरा । गौर्गीर्गव्यप्रिया गौणी गणेश्वरनमस्कृता ॥ १६३॥ सत्यमात्रा सत्यसन्ध्या
    त्रिसन्ध्या संधिवर्जिता । सर्ववादाश्रया सांख्या सांख्ययोगसमुद्भवा ॥ १६४॥ असंख्येयाऽप्रमेयाख्या शून्या
    शुद्धकुलोद्भवा । बिन्दुनादसमुत्पत्तिः शंभुवामा शशिप्रभा ॥ १६५॥ विसङ्गा भेदरहिता मनोज्ञा मधुसूदनी ।
    महाश्रीः श्रीसमुत्पत्तिस्तमःपारे प्रतिष्ठिता ॥ १६६॥ त्रितत्त्वमाता त्रिविधा सुसूक्ष्मपदसंश्रया । शन्ता
    भीता मलातीता निर्विकारा निराश्रया ॥ १६७॥ शिवाख्या चित्तनिलया शिवज्ञानस्वरूपिणी । दैत्यदानवनिर्मात्री
    काश्यपी कालकर्णिका ॥ १६८॥ शास्त्रयोनिः क्रियामूर्तिश्चतुर्वर्गप्रदर्शिका । नारायणी नरोद्भूतिः कौमुदी
    लिङ्गधारिणी ॥ १६९॥ कामुकी ललिताभावा परापरविभूतिदा । परान्तजातमहिमा बडवा वामलोचना ॥ १७०॥ सुभद्रा देवकी
    सीता वेदवेदाङ्गपारगा । मनस्विनी मन्युमाता महामन्युसमुद्भवा ॥ १७१॥ अमृत्युरमृतास्वादा पुरुहूता पुरुष्टुता
    । अशोच्या भिन्नविषया हिरण्यरजतप्रिया ॥ १७२॥ हिरण्या राजती हैमा हेमाभरणभूषिता । विभ्राजमाना दुर्ज्ञेया
    ज्योतिष्टोमफलप्रदा ॥ १७३॥ महानिद्रासमुद्भूतिरनिद्रा सत्यदेवता । दीर्घा ककुद्मिनी हृद्या शान्तिदा शान्तिवर्द्धिनी
    ॥ १७४॥ लक्ष्म्यादिशक्तिजननी शक्तिचक्रप्रवर्तिका । त्रिशक्तिजननी जन्या षडूर्मिपरिवर्जिता ॥ १७५॥ सुधामा
    कर्मकरणी युगान्तदहनात्मिका । संकर्षणी जगद्धात्री कामयोनिः किरीटिनी ॥ १७६॥ ऐन्द्री त्रैलोक्यनमिता वैष्णवी
    परमेश्वरी । प्रद्युम्नदयिता दात्री युग्मदृष्टिस्त्रिलोचना ॥ १७७॥ मदोत्कटा हंसगतिः प्रचण्डा चण्डविक्रमा
    । वृषावेशा वियन्माता विन्ध्यपर्वतवासिनी ॥ १७८॥ हिमवन्मेरुनिलया कैलासगिरिवासिनी । चाणूरहन्तृतनया नीतिज्ञा
    कामरूपिणी ॥ १७९॥ वेदविद्याव्रतस्नाता धर्मशीलाऽनिलाशना । वीरभद्रप्रिया वीरा महाकामसमुद्भवा ॥ १८०॥ विद्याधरप्रिया
    सिद्धा विद्याधरनिराकृतिः । आप्यायनी हरन्ती च पावनी पोषणी खिला ॥ १८१॥ मातृका मन्मथोद्भूता वारिजा वाहनप्रिया
    । करीषिणी सुधावाणी वीणावादनतत्परा ॥ १८२॥ सेविता सेविका सेव्या सिनीवाली गरुत्मती । अरुन्धती हिरण्याक्षी
    मृगाङ्का मानदायिनी ॥ १८३॥ वसुप्रदा वसुमती वसोर्धारा वसुंधरा । धाराधरा वरारोहा वरावरसहस्रदा ॥ १८४॥
    श्रीफला श्रीमती श्रीशा श्रीनिवासा शिवप्रिया । श्रीधरा श्रीकरी कल्या श्रीधरार्धशरीरिणी ॥ १८५॥ अनन्तदृष्टिरक्षुद्रा
    धात्रीशा धनदप्रिया । निहन्त्री दैत्यसङ्घानां सिहिका सिहवाहना ॥ १८६॥ सुषेणा चन्द्रनिलया सुकीर्तिश्छिन्नसंशया
    । रसज्ञा रसदा रामा लेलिहानामृतस्रवा ॥ १८७॥ नित्योदिता स्वयंज्योतिरुत्सुका मृतजीवना । वज्रदण्डा वज्रजिह्वा
    वैदेही वज्रविग्रहा ॥ १८८॥ मङ्गल्या मङ्गला माला मलिना मलहारिणी । गान्धर्वी गारुडी चान्द्री कम्बलाश्वतरप्रिया
    ॥ १८९॥ सौदामिनी जनानन्दा भ्रुकुटीकुटिलानना । कर्णिकारकरा कक्ष्या कंसप्राणापहारिणी ॥ १९०॥ युगन्धरा
    युगावर्त्ता त्रिसंध्या हर्षवर्धिनी । प्रत्यक्षदेवता दिव्या दिव्यगन्धा दिवापरा ॥ १९१॥ शक्रासनगता शाक्री
    सान्ध्या चारुशरासना । इष्टा विशिष्टा शिष्टेष्टा शिष्टाशिष्टप्रपूजिता ॥ १९२॥ शतरूपा शतावर्त्ता विनता
    सुरभिः सुरा । सुरेन्द्रमाता सुद्युम्ना सुषुम्णा सूर्यसंस्थिता ॥ १९३॥ समीक्ष्या सत्प्रतिष्ठा च निवृत्तिर्ज्ञानपारगा
    । धर्मशास्त्रार्थकुशला धर्मज्ञा धर्मवाहना ॥ १९४॥ धर्माधर्मविनिर्मात्री धार्मिकाणां शिवप्रदा । धर्मशक्तिर्धर्ममयी
    विधर्मा विश्वधर्मिणी ॥ १९५॥ धर्मान्तरा धर्ममेघा धर्मपूर्वा धनावहा । धर्मोपदेष्ट्री धर्मात्मा धर्मगम्या
    धराधरा ॥ १९६॥ कापाली सकलामूर्त्तिः कला कलितविग्रहा । सर्वशक्तिविनिर्मुक्ता सर्वशक्त्याश्रयाश्रया ॥
    १९७॥ सर्वा सर्वेश्वरी सूक्ष्मा सूक्ष्मा ज्ञानस्वरूपिणी । प्रधानपुरुषेशेषा महादेवैकसाक्षिणी ॥ १९८॥
    सदाशिवा वियन्मूर्त्तिर्विश्वमूर्त्तिरमूर्त्तिका । एवं नाम्नां सहस्रेण स्तुत्वाऽसौ हिमवान् गिरिः ॥
    १९९॥ भूयः प्रणम्य भीतात्मा प्रोवाचेदं कृताञ्जलिः । यदेतदैश्वरं रूपं घोरं ते परमेश्वरि ॥ २००॥ भीतोऽस्मि
    साम्प्रतं दृष्ट्वा रूपमन्यत् प्रदर्शय । एवमुक्ताऽथ सा देवी तेन शैलेन पार्वती ॥ २०१॥ संहृत्य दर्शयामास
    स्वरूपमपरं पुनः । नीलोत्पलदलप्रख्यं नीलोत्पलसुगन्धिकम् ॥ २०२॥ द्विनेत्रं द्विभुजं सौम्यं नीलालकविभूषितम्
    । रक्तपादाम्बुजतलं सुरक्तकरपल्लवम् ॥ २०३॥ श्रीमद्विशालसंवृत्तंललाटतिलकोज्ज्वलम् । भूषितं चारुसर्वाङ्गं
    भूषणैरतिकोमलम् ॥ २०४॥ दधानमुरसा मालां विशालां हेमनिर्मिताम् । ईषत्स्मितं सुबिम्बोष्ठं नूपुरारावसंयुतम्
    ॥ २०५॥ प्रसन्नवदनं दिव्यमनन्तमहिमास्पदम् । तदीदृशं समालोक्य स्वरूपं शैलसत्तमः ॥ २०६॥ नाम्नामष्टसहस्रं
    तु देव्या यत् समुदीरितम् । ज्ञात्वाऽर्कमण्डलगतां संभाव्य परमेश्वरीम् ॥ २०७॥ अभ्यर्च्य गन्धपुष्पाद्यैर्भक्तियोगसमन्वितः
    । संस्मरन्परमं भावं देव्या माहेश्वरं परम् ॥ २०८॥ अनन्यमानसो नित्यं जपेदामरणाद् द्विजः । सोऽन्तकाले
    स्मृतिं लब्ध्वा परं ब्रह्माधिगच्छति ॥ २०९॥ अथवा जायते विप्रो ब्राह्मणानां कुले शुचौ । पूर्वसंस्कारमाहात्म्याद्
    ब्रह्मविद्यामवाप्नुयात् ॥ २१०॥ सम्प्राप्य योगं परमं दिव्यं तत् पारमेश्वरम् । शान्तः सर्वगातो भूत्वा
    शिवसायुज्यमाप्नुयात् ॥ २११॥ प्रत्येकं चाथ नामानि जुहुयात् सवनत्रयम् । पूतनादिकृतैर्दोषैर्ग्रहदोषैश्च
    मुच्यते ॥ २१२॥ जपेद् वाऽहरहर्नित्यं संवत्सरमतन्द्रितः । श्रीकामः पार्वतीं देवीं पूजयित्वा विधानतः
    ॥ २१३॥ सम्पूज्य पार्श्वतः शंभुं त्रिनेत्रं भक्तिसंयुतः । लभते महतीं लक्ष्मीं महादेवप्रसादतः ॥ २१४॥
    तस्मात् सर्वप्रयत्नेन जप्तव्यं हि द्विजातिभिः । सर्वपापापनोदार्थं देव्या नाम सहस्रकम् ॥ २१५॥ ॥ इति
    श्रीकूर्मपुराणे षट्साहस्त्र्यां संहितायां पूर्वविभागे श्रीदेवीसहस्रनामस्तोत्रम् ॥
