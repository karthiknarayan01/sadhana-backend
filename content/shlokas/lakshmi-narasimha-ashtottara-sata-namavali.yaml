    नमः ॐ महाकायाय नमः ॐ द्विरूपभ्रते नमः ॐ परमात्मने नमः ॐ परज्योतिषे नमः ॐ निर्गुणाय नमः ॥ ॥ ॐ नृके
    सरिणे नमः ॐ परतत्त्वाय नमः ॐ परन्धाम्ने नमः ॐ सच्चिदानन्द विग्रहाय नमः ॐ लक्ष्मीनृसिंहाय नमः ॐ सर्वात्मने
