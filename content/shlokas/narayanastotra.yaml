id: narayanastotra
category: stotram
name:
  english: narayanastotra
  devanagari: नारायनस्तोत्र
content:
  english: yamunatiravihara dhritakaustubhamanihara || narayana || 3|| pitambaraparidhana surakalyananidhana
    || narayana || 4|| manjulagunjabhusha mayamanushavesha || narayana || 5|| radhadharamadhurasika rajanikarakulatilaka
    || narayana || 6|| muraliganavinoda vedastutabhupada || narayana || 7|| barhinibarhapida natanatakaphanikrida
    || narayana || 8|| varijabhushabharana rajivarukminiramana || narayana || 9|| jalaruhadalanibhanetra
    jagadarambhakasutra || narayana || 10|| patakarajanisamhara karunalaya mamuddhara || narayana || 11||
    aghabakakshayakamsare keshava krishna murare || narayana || 12|| hatakanibhapitambara abhayam kuru
    me mavara || narayana || 13|| dasharatharajakumara danavamadasamhara || narayana || 14|| govardhanagiriramana
    gopimanasaharana || narayana || 15|| sharayutiravihara sajjanarishimandara || narayana || 16|| vishvamitramakhatra
    vividhaparasucaritra || narayana || 17|| dhvajavajrankushapada dharanisutasahamoda || narayana ||
    18|| janakasutapratipala jaya jaya samsmritilila || narayana || 19|| dasharathavagdhritibhara dandakavanasancara
    || narayana || 20|| mushtikacanurasamhara munimanasavihara || narayana || 21|| valivinigrahashaurya
    varasugrivahitarya || narayana || 22|| valinigraha mam muralikara dhivara palaya palaya shridhara
    || narayana || 23|| jalanidhibandhanadhira ravanakanthavidara || narayana || 24|| tatimadadalanadhya
    natagunavividhadhanadhya || narayana || 25||
  devanagari: यमुनातीरविहार धृतकौस्तुभमणिहार ॥ नारायण ॥ ३॥ पीताम्बरपरिधान सुरकल्याणनिधान ॥ नारायण ॥ ४॥
    मञ्जुलगुञ्जाभूष मायामानुषवेष ॥ नारायण ॥ ५॥ राधाधरमधुरसिक रजनीकरकुलतिलक ॥ नारायण ॥ ६॥ मुरलीगानविनोद
    वेदस्तुतभूपाद ॥ नारायण ॥ ७॥ बर्हिनिबर्हापीड नटनाटकफणिक्रीड ॥ नारायण ॥ ८॥ वारिजभूषाभरण राजीवरुक्मिणीरमण
    ॥ नारायण ॥ ९॥ जलरुहदलनिभनेत्र जगदारम्भकसूत्र ॥ नारायण ॥ १०॥ पातकरजनीसंहार करुणालय मामुद्धर ॥ नारायण
    ॥ ११॥ अघबकक्षयकंसारे केशव कृष्ण मुरारे ॥ नारायण ॥ १२॥ हाटकनिभपीताम्बर अभयं कुरु मे मावर ॥ नारायण ॥
    १३॥ दशरथराजकुमार दानवमदसंहार ॥ नारायण ॥ १४॥ गोवर्धनगिरिरमण गोपीमानसहरण ॥ नारायण ॥ १५॥ शरयूतीरविहार
    सज्जनऋषिमन्दार ॥ नारायण ॥ १६॥ विश्वामित्रमखत्र विविधपरासुचरित्र ॥ नारायण ॥ १७॥ ध्वजवज्राङ्कुशपाद धरणीसुतसहमोद
    ॥ नारायण ॥ १८॥ जनकसुताप्रतिपाल जय जय संस्मृतिलील ॥ नारायण ॥ १९॥ दशरथवाग्धृतिभार दण्डकवनसञ्चार ॥ नारायण
    ॥ २०॥ मुष्टिकचाणूरसंहार मुनिमानसविहार ॥ नारायण ॥ २१॥ वालिविनिग्रहशौर्य वरसुग्रीवहितार्य ॥ नारायण ॥
    २२॥ वालीनिग्रह मां मुरलीकर धीवर पालय पालय श्रीधर ॥ नारायण ॥ २३॥ जलनिधिबन्धनधीर रावणकण्ठविदार ॥ नारायण
    ॥ २४॥ ताटीमददलनाढ्य नटगुणविविधधनाढ्य ॥ नारायण ॥ २५॥
