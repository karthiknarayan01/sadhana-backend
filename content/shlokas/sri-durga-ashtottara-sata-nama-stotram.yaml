id: sri-durga-ashtottara-sata-nama-stotram
category: stotram
name:
  english: Sri Durga Ashtottara Sata Nama Stotram
content:
  english: durga shiva mahalakshmi rmahagauri ca candika | sarvajna sarvalokeshi sarvakarmaphalaprada
    || || sarvatirthamayi punya devayoni rayonija | bhumija nirguna''dharashakti shcanishvari tatha ||
    || nirguna nirahankara sarvagarvavimardini | sarvalokapriya vani sarvavidyadhidevata || || parvati
    devamata ca vanisha vindhyavasini | tejovati mahamata kotisuryasamaprabha || || devata vahnirupa ca
    sateja varnarupini | gunashraya gunamadhya gunatrayavivarjita || || karmajnanaprada kanta sarvasamharakarini
    | dharmajna dharmanishtha ca sarvakarmavivarjita || || kamakshi kamasamhartri kamakrodhavivarjita
    | shankari shambhavi shanta candrasuryagnilocana || || sujaya jayabhumishtha jahnavi janapujita |
    shastri shastramayi nitya shubha candrardhamastaka || || bharati bhramari kalpa karali krishnapingala
    | brahmi narayani raudri candramritaparisruta || || jyeshthendira mahamaya jagatsrishtyadhikarini
    | brahmandakotisamsthana kamini kamalalaya || || katyayani kalatita kalasamharakarini | yoganishtha
    yogigamya yogidhyeya tapasvini || || jnanarupa nirakara bhaktabhishtaphalaprada | bhutatmika bhutamata
    bhutesha bhutadharini || || svadha narimadhyagata shadadharadivardhini | mohitamshubhava shubhra sukshma
    mata niralasa || || nimnaga nilasankasha nityananda hara para | sarvajnanaprada''nanta satya durlabharupini
    || || sarasvati sarvagata sarvabhishtapradayini | iti shridurgashtottarashatanamastotram samaptam
    ||
  devanagari: दुर्गा शिवा महालक्ष्मी र्महागौरी च चण्डिका । सर्वज्ञा सर्वलोकेशी सर्वकर्मफलप्रदा ॥ ॥ सर्वतीर्थमयी
    पुण्या देवयोनि रयोनिजा । भूमिजा निर्गुणाऽऽधारशक्ति श्चानीश्वरी तथा ॥ ॥ निर्गुणा निरहङ्कारा सर्वगर्वविमर्दिनी
    । सर्वलोकप्रिया वाणी सर्वविद्याधिदेवता ॥ ॥ पार्वती देवमाता च वनीशा विन्ध्यवासिनी । तेजोवती महामाता
    कोटिसूर्यसमप्रभा ॥ ॥ देवता वह्निरूपा च सतेजा वर्णरूपिणी । गुणाश्रया गुणमध्या गुणत्रयविवर्जिता ॥ ॥
    कर्मज्ञानप्रदा कान्ता सर्वसंहारकारिणी । धर्मज्ञा धर्मनिष्ठा च सर्वकर्मविवर्जिता ॥ ॥ कामाक्षी कामसंहर्त्री
    कामक्रोधविवर्जिता । शाङ्करी शाम्भवी शान्ता चन्द्रसूर्याग्निलोचना ॥ ॥ सुजया जयभूमिष्ठा जाह्नवी जनपूजिता
    । शास्त्री शास्त्रमयी नित्या शुभा चन्द्रार्धमस्तका ॥ ॥ भारती भ्रामरी कल्पा कराली कृष्णपिङ्गला । ब्राह्मी
    नारायणी रौद्री चन्द्रामृतपरिस्रुता ॥ ॥ ज्येष्ठेन्दिरा महामाया जगत्सृष्ट्यधिकारिणी । ब्रह्माण्डकोटिसंस्थाना
    कामिनी कमलालया ॥ ॥ कात्यायनी कलातीता कालसंहारकारिणी । योगनिष्ठा योगिगम्या योगिध्येया तपस्विनी ॥ ॥
    ज्ञानरूपा निराकारा भक्ताभीष्टफलप्रदा । भूतात्मिका भूतमाता भूतेशा भूतधारिणी ॥ ॥ स्वधा नारीमध्यगता षडाधारादिवर्धिनी
    । मोहितांशुभवा शुभ्रा सूक्ष्मा माता निरालसा ॥ ॥ निम्नगा नीलसङ्काशा नित्यानन्दा हरा परा । सर्वज्ञानप्रदाऽऽनन्ता
    सत्या दुर्लभरूपिणी ॥ ॥ सरस्वती सर्वगता सर्वाभीष्टप्रदायिनी । इति श्रीदुर्गाष्टोत्तरशतनामस्तोत्रं समाप्तम्
    ॥
