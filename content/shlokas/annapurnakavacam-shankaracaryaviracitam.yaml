id: annapurnakavacam-shankaracaryaviracitam
category: kavacha
name:
  english: annapurnakavacam (shankaracaryaviracitam)
  devanagari: अन्नपूर्णाकवचम् (शङ्कराचार्यविरचितम्)
content:
  english: annapurnakavacam dvatrimshadvarnamantro'yam shankarapratibhashitah | annapurna mahavidya sarvamantrottamottama
    || 1|| purvamuttaramuccarya samputikaranamuttamam | stotramantrasya rishirbrahma chando trishtubudahritah
    || 2|| devata annapurna ca hrim bijamambika smrita | svaha shaktiriti jneyam bhagavati kilakam matam
    || 3|| dharma'rtha
  devanagari: अन्नपूर्णाकवचम् द्वात्रिंशद्वर्णमन्त्रोऽयं शङ्करप्रतिभाषितः । अन्नपूर्णा महाविद्या सर्वमन्त्रोत्तमोत्तमा
    ॥ १॥ पूर्वमुत्तरमुच्चार्य सम्पुटीकरणमुत्तमम् । स्तोत्रमन्त्रस्य ऋषिर्ब्रह्मा छन्दो त्रिष्टुबुदाहृतः
    ॥ २॥ देवता अन्नपूर्णा च ह्रीं बीजमम्बिका स्मृता । स्वाहा शक्तिरिति ज्ञेयं भगवति कीलकं मतम् ॥ ३॥ धर्माऽर्थ
meaning: {}
