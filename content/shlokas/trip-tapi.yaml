id: trip-tapi
category: upanishad
name:
  english: trip-tapi
  devanagari: त्रिप्-तपि
content:
  english: militangushthau pancami | saivagre'nkushakritih shashthi | dakshinashaye vamabahum kritvanyonyanamike
    kaniyasimadhyagate madhyame tarjanyakrante saralasvangushthau khecari saptami | sarvordhve sarvasamhriti
    svamadhyamanamikantare kaniyasi parshvayostarjanyavankushadhye yukta sangushthayogato'nyonyam samamanjalim
    kritvashtami | parasparamadhyamaprishthavartinyavanamike tarjanyakrante same madhyame adayangushthau
    madhyavartinau navami pratipadyata iti | saiveyam kaniyase same antarite'ngushthau samavantaritau
    kritva trikhandapadyata iti | panca banah pancadya mudrah spashtah | kromankusha | hasakhphrem khecari
    | hamsrau bijashtami vagbhavadya navami dashami ca sampadyata iti | ya evam veda | athatah kamakalabhutam
    cakram vyakhyasyamo hrim klimaim bluॅm sraumete panca kamah sarvacakram vyavartante | madhyamam kamam
    sarvavasane samputikritya blunkarena samputam vyaptam kritva dviraindavena madhyavartina sadhyam baddhva
    bhurjapatre yajati | taccakram yo vetti sa sarvam vetti | sa sakalaॅmllokanakarshayati | sa sarvam
    stambhayati | niliyuktam cakram shatrunmarayati | gatim stambhayati | lakshayuktam kritva sakalalokam
    vashikaroti | navalakshajapam kritva rudratvam prapnoti | matrikaya veshtitam kritva vijayi bhavati
    | bhagankakundam kritvagnimadhaya purusho havisha hutva yoshito vashikaroti | vartule hutva shriyamatulam
    prapnoti | caturasre hutva vrishtirbhavati | trikone hutva shatrunmarayati | gatim stambhayati | pushpani
    hutva vijayi bhavati | maharasairhutva paramanandanirbharo bhavati | gananam tva ganapatim havamahe
    kavim kavinamupamashravastamam | jyeshtharajam brahmanam brahmanaspata a nah shrunvannutibhih sida
    sadanam | ityevamadyamaksharam tadantyabindupurnamityanenangam sprishati | gam ganeshaya nama iti
    ganesham namaskurvita | om namo bhagavate bhasmangaragayogratejase hanahana dahadaha pacapaca mathamatha
    vidhvamsayavidhvamsaya halabhanjana shulamule vyanjanasiddhim kurukuru samudram purvapratishthiatam
    shoshayashoshaya stambhayastambhaya paramantraparayantraparatantraparadutaparakatakaparacchedanakara
    vidarayavidaraya cchindhicchindhi hrim phat svaha | anena kshetradhyaksham pujayediti | kulakumari
    vidmahe mantrakotisudhimahi | tannah kaulih pracodayat | iti kumaryarcanam kritva yo vai sadhako'bhilikhati
    so'mritatvam gacchati | sa yasha apnoti | sa paramayushyamatha va param brahma bhittva tishthati |
    ya evam vedeti mahopanishat | iti tritiyopanishat || 3|| deva ha vai bhagavantamabruvandeva gayatram
    hridayam no vyakhyatam traipuram sarvottamam | jatavedasasuktenakhyatam nastraipurashtakam | yadishtva
    mucyate yogi janmasamsarabandhanat | atha mrityumjayam no bruhityevam bruvatam sarvesham devanam shrutvedam
    vakyamathatastryambakenanushtubhena mrityumjayam darshayati | kasmattryambakamiti | trayanam puranamambakam
    svaminam tasmaducyate tryambakamiti | atha kasmaducyate yajamaha iti | yajamahe sevamahe vastu mahetyaksharadvayena
    kutatvenaksharaikena mrityumjayamityucyate | tasmaducyate yajamaha iti | atha kasmaducyate sugandhimiti
    | sarvato yasha apnoti | tasmaducyate sugandhimiti | atha kasmaducyate pushtivardhanamiti | yatsarvamllokansrijati
    yatsarvamllokamstarayati yatsarvamllokanvyapnoti tasmaducyate pushtivardhanamiti | atha kasmaducyate
    urvarukamiva bandhananmrityormukshiyeti | samlagnatvadurvarukamiva mrityoh samsarabandhanatsamlagnatvadbaddhatvanmokshibhavati
    mukto bhavati | atha kasmaducyate mamritaditi amritatvam prapnotyaksharam prapnoti svayam rudro bhavati
    | deva ha vai bhagavantamucuh sarvam no vyakhyatam | atha kairmantraih stuta bhagavati svatmanam darshayati
    tansarvanchaivanvaishnavansauranganeshanno bruhiti | sa hovaca bhagavamstryambakenanushtubhena mrityumjayamupasayet
    | purvenadhvana vyaptamekaksharamiti smritam | om namah shivayeti yajushamantropasako rudratvam prapnoti
    | kalyanam prapnoti | ya evam veda | tadvishnoh paramam padam sada pashyanti surayah | diviva cakshuratatam
    | vishnoh sarvatomukhasya sneho yatha palalapindamotaprotamanuvyaptam vyatiriktam vyapnuta iti vyapnuvato
    vishnostatparamam padam param vyometi paramam padam pashyanti vikshante | surayo brahmadayo devasa
    iti sada hridaya adadhate | tasmadvishnoh svarupam vasati tishthati bhuteshviti vasudeva iti | om
    nama iti trinyaksharani | bhagavata iti catvari | vasudevayeti pancaksharani | etadvai vasudevasya
    dvadasharnamabhyeti | sopaplavam tarati | sa sarvamayureti | vindate prajapatyam rayasposham gaupatyam
    ca tamashnute pratyaganandam brahmapurusham pranavasvarupamakara ukaro makara iti | tanekadha sambhavati
    tadomiti | hamsah shucishadvasurantarikshasaddhota vedishadatithirduronasat | nrishadvarasadritasadvyomasadabja
    goja ritaja adrija ritam brihat | hamsa ityetanmanoraksharadvitiyena prabhapunjena saurena dhritamabja
    goja ritaja adrija ritam satya
  devanagari: मिलिताङ्गुष्ठौ पञ्चमी । सैवाग्रेऽङ्कुशाकृतिः षष्ठी । दक्षिणशये वामबाहुं कृत्वान्योन्यानामिके
    कनीयसीमध्यगते मध्यमे तर्जन्याक्रान्ते सरलास्वङ्गुष्ठौ खेचरी सप्तमी । सर्वोर्ध्वे सर्वसंहृति स्वमध्यमानामिकान्तरे
    कनीयसि पार्श्वयोस्तर्जन्यावङ्कुशाढ्ये युक्ता साङ्गुष्ठयोगतोऽन्योन्यं सममञ्जलिं कृत्वाष्टमी । परस्परमध्यमापृष्ठवर्तिन्यावनामिके
    तर्जन्याक्रान्ते समे मध्यमे आदायाङ्गुष्ठौ मध्यवर्तिनौ नवमी प्रतिपद्यत इति । सैवेयं कनीयसे समे अन्तरितेऽङ्गुष्ठौ
    समावन्तरितौ कृत्वा त्रिखण्डापद्यत इति । पञ्च बाणाः पञ्चाद्या मुद्राः स्पष्टाः । क्रोमङ्कुशा । हसख्फ्रें
    खेचरी । हंस्रौ बीजाष्टमी वाग्भवाद्या नवमी दशमी च सम्पद्यत इति । य एवं वेद । अथातः कामकलाभूतं चक्रं
    व्याख्यास्यामो ह्रीं क्लीमैं ब्लूॅं स्रौमेते पञ्च कामाः सर्वचक्रं व्यावर्तन्ते । मध्यमं कामं सर्वावसाने
    सम्पुटीकृत्य ब्लूङ्कारेण सम्पुटं व्याप्तं कृत्वा द्विरैन्दवेन मध्यवर्तिना साध्यं बद्ध्वा भूर्जपत्रे
    यजति । तच्चक्रं यो वेत्ति स सर्वं वेत्ति । स सकलाॅंल्लोकानाकर्षयति । स सर्वं स्तम्भयति । नीलीयुक्तं
    चक्रं शत्रून्मारयति । गतिं स्तम्भयति । लाक्षायुक्तं कृत्वा सकललोकं वशीकरोति । नवलक्षजपं कृत्वा रुद्रत्वं
    प्राप्नोति । मातृकया वेष्टितं कृत्वा विजयी भवति । भगाङ्ककुण्डं कृत्वाग्निमाधाय पुरुषो हविषा हुत्वा
    योषितो वशीकरोति । वर्तुले हुत्वा श्रियमतुलं प्राप्नोति । चतुरस्रे हुत्वा वृष्टिर्भवति । त्रिकोणे हुत्वा
    शत्रून्मारयति । गतिं स्तम्भयति । पुष्पाणि हुत्वा विजयी भवति । महारसैर्हुत्वा परमानन्दनिर्भरो भवति
    । गणानां त्वा गणपतिं हवामहे कविं कवीनामुपमश्रवस्तमम् । ज्येष्ठराजं ब्रह्मणां ब्रह्मणस्पत आ नः श्रुण्वन्नूतिभिः
    सीद सादनम् । इत्येवमाद्यमक्षरं तदन्त्यबिन्दुपूर्णमित्यनेनाङ्गं स्पृशति । गं गणेशाय नम इति गणेशं नमस्कुर्वीत
    । ॐ नमो भगवते भस्माङ्गरागायोग्रतेजसे हनहन दहदह पचपच मथमथ विध्वंसयविध्वंसय हलभञ्जन शूलमूले व्यञ्जनसिद्धिं
    कुरुकुरु समुद्रं पूर्वप्रतिष्ठिअतं शोषयशोषय स्तम्भयस्तम्भय परमन्त्रपरयन्त्रपरतन्त्रपरदूतपरकटकपरच्छेदनकर
    विदारयविदारय च्छिन्धिच्छिन्धि ह्रीं फट् स्वाहा । अनेन क्षेत्राध्यक्षं पूजयेदिति । कुलकुमारि विद्महे
    मन्त्रकोटिसुधीमहि । तन्नः कौलिः प्रचोदयात् । इति कुमार्यर्चनं कृत्वा यो वै साधकोऽभिलिखति सोऽमृतत्वं
    गच्छति । स यश आप्नोति । स परमायुष्यमथ वा परं ब्रह्म भित्त्वा तिष्ठति । य एवं वेदेति महोपनिषत् । इति
    तृतीयोपनिषत् ॥ ३॥ देवा ह वै भगवन्तमब्रुवन्देव गायत्रं हृदयं नो व्याख्यातं त्रैपुरं सर्वोत्तमम् । जातवेदससूक्तेनाख्यातं
    नस्त्रैपुराष्टकम् । यदिष्ट्वा मुच्यते योगी जन्मसंसारबन्धनात् । अथ मृत्युंजयं नो ब्रूहीत्येवं ब्रुवतां
    सर्वेषां देवानां श्रुत्वेदं वाक्यमथातस्त्र्यम्बकेनानुष्टुभेन मृत्युंजयं दर्शयति । कस्मात्त्र्यम्बकमिति
    । त्रयाणां पुराणामम्बकं स्वामिनं तस्मादुच्यते त्र्यम्बकमिति । अथ कस्मादुच्यते यजामह इति । यजामहे सेवामहे
    वस्तु महेत्यक्षरद्वयेन कूटत्वेनाक्षरैकेण मृत्युंजयमित्युच्यते । तस्मादुच्यते यजामह इति । अथ कस्मादुच्यते
    सुगन्धिमिति । सर्वतो यश आप्नोति । तस्मादुच्यते सुगन्धिमिति । अथ कस्मादुच्यते पुष्टिवर्धनमिति । यत्सर्वांल्लोकान्सृजति
    यत्सर्वांल्लोकांस्तारयति यत्सर्वांल्लोकान्व्याप्नोति तस्मादुच्यते पुष्टिवर्धनमिति । अथ कस्मादुच्यते
    उर्वारुकमिव बन्धनान्मृत्योर्मुक्षीयेति । संलग्नत्वादुर्वारुकमिव मृत्योः संसारबन्धनात्संलग्नत्वाद्बद्धत्वान्मोक्षीभवति
    मुक्तो भवति । अथ कस्मादुच्यते मामृतादिति अमृतत्वं प्राप्नोत्यक्षरं प्राप्नोति स्वयं रुद्रो भवति ।
    देवा ह वै भगवन्तमूचुः सर्वं नो व्याख्यातम् । अथ कैर्मन्त्रैः स्तुता भगवती स्वात्मानं दर्शयति तान्सर्वाञ्छैवान्वैष्णवान्सौरान्गाणेशान्नो
    ब्रूहीति । स होवाच भगवांस्त्र्यम्बकेनानुष्टुभेन मृत्युंजयमुपासयेत् । पूर्वेणाध्वना व्याप्तमेकाक्षरमिति
    स्मृतम् । ॐ नमः शिवायेति याजुषमन्त्रोपासको रुद्रत्वं प्राप्नोति । कल्याणं प्राप्नोति । य एवं वेद ।
    तद्विष्णोः परमं पदं सदा पश्यन्ति सूरयः । दिवीव चक्षुराततम् । विष्णोः सर्वतोमुखस्य स्नेहो यथा पललपिण्डमोतप्रोतमनुव्याप्तं
    व्यतिरिक्तं व्याप्नुत इति व्याप्नुवतो विष्णोस्तत्परमं पदं परं व्योमेति परमं पदं पश्यन्ति वीक्षन्ते
    । सूरयो ब्रह्मादयो देवास इति सदा हृदय अदधते । तस्माद्विष्णोः स्वरूपं वसति तिष्ठति भूतेश्विति वासुदेव
    इति । ॐ नम इति त्रीण्यक्षराणि । भगवत इति चत्वारि । वासुदेवायेति पञ्चाक्षराणि । एतद्वै वासुदेवस्य द्वादशार्णमभ्येति
    । सोपप्लवं तरति । स सर्वमायुरेति । विन्दते प्राजापत्यं रायस्पोषं गौपत्यं च तमश्नुते प्रत्यगानन्दं
    ब्रह्मपुरुषं प्रणवस्वरूपमकार उकारो मकार इति । तानेकधा संभवति तदोमिति । हंसः शुचिषद्वसुरन्तरिक्षसद्धोता
    वेदिषदतिथिर्दुरोणसत् । नृषद्वरसदृतसद्व्योमसदब्जा गोजा ऋतजा अद्रिजा ऋतं बृहत् । हंस इत्येतन्मनोरक्षरद्वितीयेन
    प्रभापुञ्जेन सौरेण धृतमब्जा गोजा ऋतजा अद्रिजा ऋतं सत्या
