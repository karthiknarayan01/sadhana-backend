id: hariharatmajashtakam
category: stotram
name:
  english: hariharatmajashtakam
  devanagari: हरिहरात्मजाष्तकम्
content:
  english: shrihariharatmajashtakam athava shastuh gitashtakam harivarasanam vishvamohanam haridadhishvaramaradhyapadukam
    | arivimardanam nityanartanam hariharatmajam devamashraye || 1|| sharanakirtanam bhaktamanasam bharanalolupam
    nartanalasam | arunabhasuram bhutanayakam hariharatmajam devamashraye || 2|| pranayasatyakam prananayakam
    pranatakalpakam suprabhancitam | pranavamandiram kirtanapriyam hariharatmajam devamashraye || 3||
    turagavahanam sundarananam varagadayudham vedavarnitam | gurukripakaram kirtanapriyam hariharatmajam
    devamashraye || 4|| tribhuvanarcitam devatatmakam trinayanaprabhum divyadeshikam | tridashapujitam
    cintitapradam hariharatmajam devamashraye || 5|| bhavabhayapaham bhavukavaham bhuvanamohanam bhutibhushanam
    | dhavalavahanam divyavaranam hariharatmajam devamashraye || 6|| kalamridusmitam sundarananam kalabhakomalam
    gatramohanam | kalabhakesari vajivahanam hariharatmajam devamashraye || 7|| shritajanapriyam cintitapradam
    shrutivibhushanam sadhujivanam | shrutimanoharam gitalalasam hariharatmajam devamashraye || 8|| ||
    iti shri hariharatmajashtakam sampurnam || sharanam ayyappa svami sharanam ayyappa | shastashtakam
    ayyappa nidrastotram
  devanagari: श्रीहरिहरात्मजाष्टकम् अथवा शास्तुः गीताष्टकम् हरिवरासनं विश्वमोहनं हरिदधीश्वरमाराध्यपादुकम्
    । अरिविमर्दनं नित्यनर्तनं हरिहरात्मजं देवमाश्रये ॥ १॥ शरणकीर्तनं भक्तमानसं भरणलोलुपं नर्तनालसम् ।
    अरुणभासुरं भूतनायकं हरिहरात्मजं देवमाश्रये ॥ २॥ प्रणयसत्यकं प्राणनायकं प्रणतकल्पकं सुप्रभाञ्चितम्
    । प्रणवमन्दिरं कीर्तनप्रियं हरिहरात्मजं देवमाश्रये ॥ ३॥ तुरगवाहनं सुन्दराननं वरगदायुधं वेदवर्णितम्
    । गुरुकृपाकरं कीर्तनप्रियं हरिहरात्मजं देवमाश्रये ॥ ४॥ त्रिभुवनार्चितं देवतात्मकं त्रिनयनप्रभुं दिव्यदेशिकम्
    । त्रिदशपूजितं चिन्तितप्रदं हरिहरात्मजं देवमाश्रये ॥ ५॥ भवभयापहं भावुकावहं भुवनमोहनं भूतिभूषणम् ।
    धवलवाहनं दिव्यवारणं हरिहरात्मजं देवमाश्रये ॥ ६॥ कलमृदुस्मितं सुन्दराननं कलभकोमलं गात्रमोहनम् । कलभकेसरी
    वाजिवाहनं हरिहरात्मजं देवमाश्रये ॥ ७॥ श्रितजनप्रियं चिन्तितप्रदं श्रुतिविभूषणं साधुजीवनम् । श्रुतिमनोहरं
    गीतलालसं हरिहरात्मजं देवमाश्रये ॥ ८॥ ॥ इति श्री हरिहरात्मजाष्टकं सम्पूर्णम् ॥ शरणं अय्यप्पा स्वामी
    शरणं अय्यप्पा । शास्ताष्टकम् अय्यप्प निद्रास्तोत्रम्
