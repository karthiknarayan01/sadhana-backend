id: sri-madhvacharya-kruta-dwadasha-stotra-11
category: stotram
name:
  english: Sri Madhvacharya Kruta Dwadasha Stotra - 11
content:
  english: atha ekadashastotram udirnamajaram divyam amritasyandyadhishituh | anandasya padam vande brahmendradi
    abhivanditam || || sarvavedapadodgitam indiravasamuttamam | anandasya padam vande brahmendradi abhivanditam
    || || sarvadevadidevasya vidaritamahattamah | anandasya padam vande brahmendradi abhivanditam || ||
    udaramadarannityam anindyam sundaripateh | anandasya padam vande brahmendradi abhivanditam || || indivarodaranibham
    supurnam vadimohanam | anandasya padam vande brahmendradi abhivanditam || || datrisarvamaraishvaryavimuktyaderaho
    param | anandasya padam vande brahmendradi abhivanditam || || duraddurataram yattu tadevantikamantikat
    | anandasya padam vande brahmendradi abhivanditam || || purnasarvagunaikarnamanadyantam sureshituh
    | anandasya padam vande brahmendradi abhivanditam || || anandatirthamunina hareranandarupinah | kritam
    stotramidam punyam pathannanandamapnuyat || || iti shrimadanandatirthabhagavatpadacarya viracitam
    dvadashastotreshu ekadashastotram sampurnam
  devanagari: अथ एकादशस्तोत्रम् उदीर्णमजरं दिव्यं अमृतस्यन्द्यधीशितुः । आनन्दस्य पदं वन्दे ब्रह्मेन्द्रादि
    अभिवन्दितम् ॥ ॥ सर्ववेदपदोद्गीतं इन्दिरावासमुत्तमम् । आनन्दस्य पदं वन्दे ब्रह्मेन्द्रादि अभिवन्दितम्
    ॥ ॥ सर्वदेवादिदेवस्य विदारितमहत्तमः । आनन्दस्य पदं वन्दे ब्रह्मेन्द्रादि अभिवन्दितम् ॥ ॥ उदारमादरान्नित्यं
    अनिन्द्यं सुन्दरीपतेः । आनन्दस्य पदं वन्दे ब्रह्मेन्द्रादि अभिवन्दितम् ॥ ॥ इन्दीवरोदरनिभं सुपूर्णं
    वादिमोहनम् । आनन्दस्य पदं वन्दे ब्रह्मेन्द्रादि अभिवन्दितम् ॥ ॥ दातृसर्वामरैश्वर्यविमुक्त्यादेरहो
    परम् । आनन्दस्य पदं वन्दे ब्रह्मेन्द्रादि अभिवन्दितम् ॥ ॥ दूराद्दुरतरं यत्तु तदेवान्तिकमन्तिकात् ।
    आनन्दस्य पदं वन्दे ब्रह्मेन्द्रादि अभिवन्दितम् ॥ ॥ पूर्णसर्वगुणैकार्णमनाद्यन्तं सुरेशितुः । आनन्दस्य
    पदं वन्दे ब्रह्मेन्द्रादि अभिवन्दितम् ॥ ॥ आनन्दतीर्थमुनिना हरेरानन्दरूपिणः । कृतं स्तोत्रमिदं पुण्यं
    पठन्नानन्दमाप्नुयात् ॥ ॥ इति श्रीमदानन्दतीर्थभगवत्पादाचार्य विरचितं द्वादशस्तोत्रेषु एकादशस्तोत्रं
    सम्पूर्णम्
