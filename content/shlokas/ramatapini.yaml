id: ramatapini
category: upanishad
name:
  english: ramatapini
  devanagari: रमतपिनि
content:
  english: ndoshanvarayatiti tena varana bhavatiti | sarvanindriyakritanpapannashayatiti tena nasi bhavatiti
    | katamaccasya sthanam bhavatiti | bhruvorghranasya ca yah sandhih sa esha dyaurlokasya parasya ca
    sandhirbhavatiti | etadvai sandhim sandhyam brahmavida upasata iti || so'vimukta upasya iti | so'vimuktam
    jnanamacashte yo va etadevam veda || atha tam pratyuvaca | shriramasya manum kashyam jajapa vrishabhadhvajah
    | manvantarasahasraistu japahomarcanadibhih ||1|| tatah prasanno bhagavanchriramah praha shamkaram
    | vrinishva yadabhishtam taddasyami parameshvara || 2|| iti || atha saccidanandatmanam shriramamishvarah
    papraccha | manikarnyam mama kshetre gangayam va tate punah | mriyeta dehi tajjantormuktirna'to varantaram
    || 3|| iti || atha sa hovaca shriramah || kshetre'smimstava devesha yatra kutrapi va mritah | krimikitadayo'pyashu
    muktah santu na canyatha || 4|| avimukte tava kshetre sarvesham muktisiddhaye | aham samnihitastatra
    pashanapratimadishu || 5|| kshetre'sminyo'rcayedbhaktya mantrenanena mam shiva | brahmahatyadipapebhyo
    mokshayishyami ma shucah || 6|| tvatto va brahmano vapi ye labhante shadaksharam | jivanto mantrasiddhah
    syurmukta mam prapnuvanti te || 7|| mumurshordakshine karne yasya kasyapi va svayam | upadekshyasi
    manmantram sa mukto bhavita shiva || 8|| iti shriramacandrenoktam || atha hainam bharadvajo yajnavalkyamuvacatha
    kairmantraih stutah shriramacandrah prito bhavati | svatmanam darshayati tanno bruhi bhagavanniti
    | sa hovaca yajnavalkyah || purvam satyaloke shriramacandrenaivam shikshito brahma punaretaya gathaya
    namaskaroti || vishvarupadharam vishnum narayanamanamayam | purnanandaikavijnanam param brahmasvarupinam
    || manasa samsmaranbrahma tushtava parameshvaram | om yo ha vai shriramacandrah sa bhagavanadvaitaparamananda
    atma yatparam brahma bhurbhuvah suvastasmai vai namo namah || 1|| yatha prathamamantroktavadyantau
    tatha sarvamantreshu jnatavyau || yashcakhandaikarasatma || 2|| yacca brahmanandamritam || 3|| yattarakam
    brahma || 4|| yo brahma vishnurmaheshvaro yah sarvadevatma || 5|| ye sarve vedah sangah sashakhah
    setihasapuranah || 6|| yo jivantaratma || 7|| yah sarvabhutantaratma || 8|| ye devasuramanushyadibhavah
    || 9|| ye matsyakurmadyavatarah || 10|| yo'ntahkaranacatushtayatma || 11|| yashca pranah || 12|| yashca
    yamah || 13|| yashcantakah || 14|| yashca mrityuh || 15|| yaccamritam || 16|| yani ca pancamahabhutani
    || 17|| yah sthavarajangamatma || 18|| ye pancagnayah || 19|| yah sapta mahavyahritayah || 20|| ya
    vidya || 21|| ya sarasvati || 22|| ya lakshmih || 23|| ya gauri || 24|| ya janaki || 25|| yacca trailokyam
    || 26|| yah suryah || 27|| yah somah || 28|| yani ca nakshatrani || 29|| ye ca nava grahah || 30||
    ye cashtau lokapalah || 31|| ye cashtau vasavah || 32|| ye caikadasha rudrah || 33|| ye ca dvadishadityah
    || 34|| yacca bhutam bhavyam bhavishyat || 35|| yadbrahmandasya bahirvyaptam || 36|| yo hiranyagarbhah
    || 37|| ya prakritih || 38|| yashconkarah || 39|| yashcatasro'rdhamatrah || 40|| yah paramapurushah
    || 41|| yashca maheshvarah || 42|| yashca mahadevah || 43|| ya om namo bhagavate vasudevaya || 44||
    yo mahavishnuh || 45|| yah paramatma || 46|| yo vijnanatma || 47|| om yo ha vai shriramacandrah sa
    bhagavanadvaitaparamananda atma | yah saccidanandadvaitaikacidatma bhurbhuvah suvastasmai vai namo
    namah || iti tanbrahmabravit | saptacatvarimshanmantrairnityam devam stuvadhvam | tato devah prito
    bhavati | svatmanam darshayati | tasmadya etairmantrairnityam devam stauti sa devam pashyati | so'mritatvam
    gacchatiti mahopanishat || 5|| atha hainam bharadvajo yajnavalkyamupasametyovaca shriramamantrarajasya
    mahatmyamanubruhiti | sa hovaca yajnavalkyah | svaprakashah paramjyotih svanubhutyaikacinmayah | tadeva
    ramacandrasya manoradyaksharah smritah || 1|| akhandaikarasanandastarakabrahmavacakah | ramayeti suvijneyah
    satyanandacidatmakah || 2|| namahpadam suvijneyam purnanandaikakaranam | sada namanti hridaye sarve
    deva mumukshavah || 3|| iti || ya evam mantrarajam shriramacandrashadaksharam nityamadhite | so'gniputo
    bhavati | sa vayuputo bhavati | sa adityaputo bhavati | sa somaputo bhavati | sa brahmaputo bhavati
    | sa vishnuputo bhavati | sa rudraputo bhavati | sarvairdevairjnato bhavati | sarvakratubhirishtavanbhavati
    | tenetihasapurananam rudranam shatasahasrani japtani phalani bhavanti | shriramacandramanusmaranena
    gayatryah shatasahasrani japtani phalani bhavanti | pranavanamayutakotijapa bhavanti | dasha purvandashottaranpunati
    | sa panktipavano bhavati | sa mahanbhavati | so'mritatvam ca gacchati || atraite shloka bhavanti
    | ganapatyeshu shaiveshu shaktasaureshvabhishtadah | vaishnaveshvapi sarveshu ramamantrah phaladhikah
    || 4|| ganapatyadi mantreshu kotikotigunadhikah | mantrasteshvapyanayasaphalado'yam shadaksharah ||
    5|| shadaksharo'yam mantrah syatsarvaghaughanivaranah | mantraraja iti proktah sarveshamuttamottamah
    || 6|| kritam dine yadduritam pakshamasartuvarshajam | sarvam dahati nihshesham tularashimivanalah
    || 7|| brahmahatyasahasrani jnanajnanakritani ca | svarnasteyasurapanagurutalpayutani ca || 8|| kotikotisahasrani
    upapatakajanyapi | sarvanyapi pranashyanti ramamantranukirtanat || 9|| bhutapretapishacadyah kushmandabrahmarakshasah
    | duradeva pradhavanti ramamantraprabhavatah || 10|| aihalaukikamaishvaryam svargadyam paralaukikam
    | kaivalyam bhagavattvam ca mantro'yam sadhayishyati || 11|| gramyaranyapashughnatvam samcitam durutam
    ca yat | madyapanena yatpapam tadapyashu vinashayet || 12|| abhakshyabhakhakshanotpannam mithyajnanasamudbhavam
    | sarvam viliyate ramamantrasyasyaiva kirtanat || 13|| shrotriyasvarnaharanadyacca papamupasthitam
    | ratnadeshcapaharena tadapyashu vinashayet || 14|| brahmanam kshatriyam vaishyam shudram hatva ca
    kilbisham | samcinoti naro mohadyadyattadapi nashayet || 15|| gatvapi mataram mohadagamyashcaiva yoshitah
    | upasyanena mantrena ramastadapi nashayet || 16|| mahapatakapapishthasangatya samcitam ca yat | nashayettatkathalapashayanasanabhojanaih
    || 17|| pitrimatrivadhotpannam buddhipurvamagham ca yat | tadanushthanamatrenasarvametadviliyate ||
    18|| yatprayagaditirthoktaprayashcittashatairapi | naivapanodyate papam tadapyashu vinashayet || 19||
    punyakshetreshu sarveshu kurukshetradishu svayam | buddhipurvamagham kritva tadapyashuvinashayet ||
    20|| kricchraistaptaparakadyairnanacandrayanairapi | papam ca napanodyam yattadapyashu vinashayet
    || 21|| atmatulyasuvarnadidanairbahuvidhairapi | kimcidapyaparikshinam tadapyashu vinashayet || 22||
    avasthatritayeshvevabuddhipurvamagham ca yat | tanmantrasmaranenaiva nihshesham praviliyate || 23||
    avasthatritayeshvevam mulabandhamantram ca yat | tattanmantropadeshena sarvametatpranashyati || 24||
    abrahmabijadoshashca niyamatikramodbhvah | strinam ca purushanam ca mantrenanena nashitah || 25||
    yeshu yeshvapi desheshu ramabhadra upasyate | durbhikshadibhayam teshu na bhavettu kadacana || 26||
    shantah prasannavadano hyakrodho bhaktavatsalah | anena sadrisho mantro jagatsvapi na vidyate || 27||
    samyagaradhito ramah prasidatyeva satvaram | dadatyayushyamaishvaryamante vishnupadam ca yat || 28||
    tadetadricabhyuktam | rico akshare parame vyomanyasmindeva adhi vishve nisheduh | yastanna veda kimrica
    karishyati ya ittadvidusta ime samasate | tadvishnoh paramam padam sada pashyanti surayah | diviva
    cakshuratatam | tadvipraso vipanyavo jagrivamsah samindhate | vishnoryatparamam padam | om satyamityupanishat
    || 6|| om bhadram karnebhih shrunuyama deva bhadram pashyemakshabhiryajatrah | sthirairangaistushtuva
  devanagari: न्दोषन्वारयतीति तेन वरणा भवतीति । सर्वानिन्द्रियकृतान्पापान्नाशयतीति तेन नासी भवतीति । कतमच्चास्य
    स्थानं भवतीति । भ्रुवोर्घ्राणस्य च यः सन्धिः स एष द्यौर्लोकस्य परस्य च सन्धिर्भवतीति । एतद्वै सन्धिं
    सन्ध्यां ब्रह्मविद उपासत इति ॥ सोऽविमुक्त उपास्य इति । सोऽविमुक्तं ज्ञानमाचष्टे यो वा एतदेवं वेद ॥
    अथ तं प्रत्युवाच । श्रीरामस्य मनुं काश्यां जजाप वृषभध्वजः । मन्वन्तरसहस्रैस्तु जपहोमार्चनादिभिः ॥१॥
    ततः प्रसन्नो भगवाञ्छ्रीरामः प्राह शंकरम् । वृणीश्व यदभीष्टं तद्दास्यामि परमेश्वर ॥ २॥ इति ॥ अथ सच्चिदानन्दात्मानं
    श्रीराममीश्वरः पप्रच्छ । मणिकर्ण्यां मम क्षेत्रे गङ्गायां वा तटे पुनः । म्रियेत देही तज्जन्तोर्मुक्तिर्नाऽतो
    वरान्तरम् ॥ ३॥ इति ॥ अथ स होवाच श्रीरामः ॥ क्षेत्रेऽस्मिंस्तव देवेश यत्र कुत्रापि वा मृताः । कृमिकीटादयोऽप्याशु
    मुक्ताः सन्तु न चान्यथा ॥ ४॥ अविमुक्ते तव क्षेत्रे सर्वेषां मुक्तिसिद्धये । अहं संनिहितस्तत्र पाषाणप्रतिमादिषु
    ॥ ५॥ क्षेत्रेऽस्मिन्योऽर्चयेद्भक्त्या मन्त्रेणानेन मां शिव । ब्रह्महत्यादिपापेभ्यो मोक्षयिष्यामि मा
    शुचः ॥ ६॥ त्वत्तो वा ब्रह्मणो वापि ये लभन्ते षडक्षरम् । जीवन्तो मन्त्रसिद्धाः स्युर्मुक्ता मां प्राप्नुवन्ति
    ते ॥ ७॥ मुमूर्षोर्दक्षिणे कर्णे यस्य कस्यापि वा स्वयम् । उपदेक्ष्यसि मन्मन्त्रं स मुक्तो भविता शिव
    ॥ ८॥ इति श्रीरामचन्द्रेणोक्तम् ॥ अथ हैनं भारद्वाजो याज्ञवल्क्यमुवाचाथ कैर्मन्त्रैः स्तुतः श्रीरामचन्द्रः
    प्रीतो भवति । स्वात्मानं दर्शयति तान्नो ब्रूहि भगवन्निति । स होवाच याज्ञवल्क्यः ॥ पूर्वं सत्यलोके
    श्रीरामचन्द्रेणैवं शिक्षितो ब्रह्मा पुनरेतया गाथया नमस्करोति ॥ विश्वरूपधरं विष्णुं नारायणमनामयम् ।
    पूर्णानन्दैकविज्ञानं परं ब्रह्मस्वरूपिणम् ॥ मनसा संस्मरन्ब्रह्म तुष्टाव परमेश्वरम् । ॐ यो ह वै श्रीरामचन्द्रः
    स भगवानद्वैतपरमानन्द आत्मा यत्परं ब्रह्म भूर्भुवः सुवस्तस्मै वै नमो नमः ॥ १॥ यथा प्रथममन्त्रोक्तावाद्यन्तौ
    तथा सर्वमन्त्रेषु ज्ञातव्यौ ॥ यश्चाखण्डैकरसात्मा ॥ २॥ यच्च ब्रह्मानन्दामृतम् ॥ ३॥ यत्तारकं ब्रह्म
    ॥ ४॥ यो ब्रह्मा विष्णुर्महेश्वरो यः सर्वदेवात्मा ॥ ५॥ ये सर्वे वेदाः साङ्गाः सशाखाः सेतिहासपुराणाः
    ॥ ६॥ यो जीवान्तरात्मा ॥ ७॥ यः सर्वभूतान्तरात्मा ॥ ८॥ ये देवासुरमनुष्यादिभावाः ॥ ९॥ ये मत्स्यकूर्माद्यवताराः
    ॥ १०॥ योऽन्तःकरणचतुष्टयात्मा ॥ ११॥ यश्च प्राणः ॥ १२॥ यश्च यमः ॥ १३॥ यश्चान्तकः ॥ १४॥ यश्च मृत्युः
    ॥ १५॥ यच्चामृतम् ॥ १६॥ यानि च पञ्चमहाभूतानि ॥ १७॥ यः स्थावरजङ्गमात्मा ॥ १८॥ ये पञ्चाग्नयः ॥ १९॥ याः
    सप्त महाव्याहृतयः ॥ २०॥ या विद्या ॥ २१॥ या सरस्वती ॥ २२॥ या लक्ष्मीः ॥ २३॥ या गौरी ॥ २४॥ या जानकी
    ॥ २५॥ यच्च त्रैलोक्यम् ॥ २६॥ यः सूर्यः ॥ २७॥ यः सोमः ॥ २८॥ यानि च नक्षत्राणि ॥ २९॥ ये च नव ग्रहाः
    ॥ ३०॥ ये चाष्टौ लोकपालाः ॥ ३१॥ ये चाष्टौ वसवः ॥ ३२॥ ये चैकादश रुद्राः ॥ ३३॥ ये च द्वदिशादित्याः ॥
    ३४॥ यच्च भूतं भव्यं भविष्यत् ॥ ३५॥ यद्ब्रह्माण्डस्य बहिर्व्याप्तम् ॥ ३६॥ यो हिरण्यगर्भः ॥ ३७॥ या प्रकृतिः
    ॥ ३८॥ यश्चोङ्कारः ॥ ३९॥ याश्चतस्रोऽर्धमात्राः ॥ ४०॥ यः परमपुरुषः ॥ ४१॥ यश्च महेश्वरः ॥ ४२॥ यश्च महादेवः
    ॥ ४३॥ य ॐ नमो भगवते वासुदेवाय ॥ ४४॥ यो महाविष्णुः ॥ ४५॥ यः परमात्मा ॥ ४६॥ यो विज्ञानात्मा ॥ ४७॥ ॐ
    यो ह वै श्रीरामचन्द्रः स भगवानद्वैतपरमानन्द आत्मा । यः सच्चिदानन्दाद्वैतैकचिदात्मा भूर्भुवः सुवस्तस्मै
    वै नमो नमः ॥ इति तान्ब्रह्माब्रवीत् । सप्तचत्वारिंशन्मन्त्रैर्नित्यं देवं स्तुवध्वम् । ततो देवः प्रीतो
    भवति । स्वात्मानं दर्शयति । तस्माद्य एतैर्मन्त्रैर्नित्यं देवं स्तौति स देवं पश्यति । सोऽमृतत्वं गच्छतीति
    महोपनिषत् ॥ ५॥ अथ हैनं भारद्वाजो याज्ञवल्क्यमुपसमेत्योवाच श्रीराममन्त्रराजस्य माहात्म्यमनुब्रूहीति
    । स होवाच याज्ञवल्क्यः । स्वप्रकाशः परंज्योतिः स्वानुभूत्यैकचिन्मयः । तदेव रामचन्द्रस्य मनोराद्यक्षरः
    स्मृतः ॥ १॥ अखण्डैकरसानन्दस्तारकब्रह्मवाचकः । रामायेति सुविज्ञेयः सत्यानन्दचिदात्मकः ॥ २॥ नमःपदं सुविज्ञेयं
    पूर्णानन्दैककारणम् । सदा नमन्ति हृदये सर्वे देवा मुमुक्षवः ॥ ३॥ इति ॥ य एवं मन्त्रराजं श्रीरामचन्द्रषडक्षरं
    नित्यमधीते । सोऽग्निपूतो भवति । स वायुपूतो भवति । स आदित्यपूतो भवति । स सोमपूतो भवति । स ब्रह्मपूतो
    भवति । स विष्णुपूतो भवति । स रुद्रपूतो भवति । सर्वैर्देवैर्ज्ञातो भवति । सर्वक्रतुभिरिष्टवान्भवति
    । तेनेतिहासपुराणानां रुद्राणां शतसहस्राणि जप्तानि फलानि भवन्ति । श्रीरामचन्द्रमनुस्मरणेन गायत्र्यः
    शतसहस्राणि जप्तानि फलानि भवन्ति । प्रणवानामयुतकोटिजपा भवन्ति । दश पूर्वान्दशोत्तरान्पुनाति । स पङ्क्तिपावनो
    भवति । स महान्भवति । सोऽमृतत्वं च गच्छति ॥ अत्रैते श्लोका भवन्ति । गाणपत्येषु शैवेषु शाक्तसौरेष्वभीष्टदः
    । वैष्णवेष्वपि सर्वेषु राममन्त्रः फलाधिकः ॥ ४॥ गाणपत्यादि मन्त्रेषु कोटिकोटिगुणाधिकः । मन्त्रस्तेष्वप्यनायासफलदोऽयं
    षडक्षरः ॥ ५॥ षडक्षरोऽयं मन्त्रः स्यात्सर्वाघौघनिवारणः । मन्त्रराज इति प्रोक्तः सर्वेषामुत्तमोत्तमः
    ॥ ६॥ कृतं दिने यद्दुरितं पक्षमासर्तुवर्षजम् । सर्वं दहति निःशेषं तूलराशिमिवानलः ॥ ७॥ ब्रह्महत्यासहस्राणि
    ज्ञानाज्ञानकृतानि च । स्वर्णस्तेयसुरापानगुरुतल्पायुतानि च ॥ ८॥ कोटिकोटिसहस्राणि उपपातकजान्यपि । सर्वाण्यपि
    प्रणश्यन्ति राममन्त्रानुकीर्तनात् ॥ ९॥ भूतप्रेतपिशाचाद्याः कूष्माण्डब्रह्मराक्षसाः । दूरादेव प्रधावन्ति
    राममन्त्रप्रभावतः ॥ १०॥ ऐहलौकिकमैश्वर्यं स्वर्गाद्यं पारलौकिकम् । कैवल्यं भगवत्त्वं च मन्त्रोऽयं साधयिष्यति
    ॥ ११॥ ग्राम्यारण्यपशुघ्नत्वं संचितं दुरुतं च यत् । मद्यपानेन यत्पापं तदप्याशु विनाशयेत् ॥ १२॥ अभक्ष्यभखक्षणोत्पन्नं
    मिथ्याज्ञानसमुद्भवम् । सर्वं विलीयते राममन्त्रस्यास्यैव कीर्तनात् ॥ १३॥ श्रोत्रियस्वर्णहरणाद्यच्च
    पापमुपस्थितम् । रत्नादेश्चापहारेण तदप्याशु विनाशयेत् ॥ १४॥ ब्राह्मणं क्षत्रियं वैश्यं शूद्रं हत्वा
    च किल्बिषम् । संचिनोति नरो मोहाद्यद्यत्तदपि नाशयेत् ॥ १५॥ गत्वापि मातरं मोहादगम्याश्चैव योषितः । उपास्यानेन
    मन्त्रेण रामस्तदपि नाशयेत् ॥ १६॥ महापातकपापिष्ठसङ्गत्या संचितं च यत् । नाशयेत्तत्कथालापशयनासनभोजनैः
    ॥ १७॥ पितृमातृवधोत्पन्नं बुद्धिपूर्वमघं च यत् । तदनुष्ठानमात्रेणसर्वमेतद्विलीयते ॥ १८॥ यत्प्रयागादितीर्थोक्तप्रायश्चित्तशतैरपि
    । नैवापनोद्यते पापं तदप्याशु विनाशयेत् ॥ १९॥ पुण्यक्षेत्रेषु सर्वेषु कुरुक्षेत्रादिषु स्वयम् । बुद्धिपूर्वमघं
    कृत्वा तदप्याशुविनाशयेत् ॥ २०॥ कृच्छ्रैस्तप्तपराकाद्यैर्नानाचान्द्रायणैरपि । पापं च नापनोद्यं यत्तदप्याशु
    विनाशयेत् ॥ २१॥ आत्मतुल्यसुवर्णादिदानैर्बहुविधैरपि । किंचिदप्यपरिक्षीणं तदप्याशु विनाशयेत् ॥ २२॥ अवस्थात्रितयेष्वेवबुद्धिपूर्वमघं
    च यत् । तन्मन्त्रस्मरणेनैव निःशेषं प्रविलीयते ॥ २३॥ अवस्थात्रितयेष्वेवं मूलबन्धमन्त्रं च यत् । तत्तन्मन्त्रोपदेशेन
    सर्वमेतत्प्रणश्यति ॥ २४॥ आब्रह्मबीजदोषाश्च नियमातिक्रमोद्भ्वाः । स्त्रीणां च पुरुषाणां च मन्त्रेणानेन
    नाशिताः ॥ २५॥ येषु येष्वपि देशेषु रामभद्र उपास्यते । दुर्भिक्षादिभयं तेषु न भवेत्तु कदाचन ॥ २६॥ शान्तः
    प्रसन्नवदनो ह्यक्रोधो भक्तवत्सलः । अनेन सदृशो मन्त्रो जगत्स्वपि न विद्यते ॥ २७॥ सम्यगाराधितो रामः
    प्रसीदत्येव सत्वरम् । ददात्यायुष्यमैश्वर्यमन्ते विष्णुपदं च यत् ॥ २८॥ तदेतदृचाभ्युक्तम् । ऋचो अक्षरे
    परमे व्योमन्यस्मिन्देवा अधि विश्वे निषेदुः । यस्तन्न वेद किमृचा करिष्यति य इत्तद्विदुस्त इमे समासते
    । तद्विष्णोः परमं पदं सदा पश्यन्ति सूरयः । दिवीव चक्षुराततम् । तद्विप्रासो विपन्यवो जागृवांसः समिन्धते
    । विष्णोर्यत्परमं पदम् । ॐ सत्यमित्युपनिषत् ॥ ६॥ ॐ भद्रं कर्णेभिः श्रुणुयाम देवा भद्रं पश्येमाक्षभिर्यजत्राः
    । स्थिरैरङ्गैस्तुष्टुवा
