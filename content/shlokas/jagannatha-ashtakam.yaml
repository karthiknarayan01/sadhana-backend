id: jagannatha-ashtakam
category: stotram
name:
  english: Jagannatha Ashtakam
content:
  english: kalindi tatavipina sangitakaravo mudabhiri narivadana kamalasvadamadhupah | rama shambhu brahmamarapati
    ganesharcita pado jagannathah svami nayanapathagami bhavatu me || || bhuje savye venum shirasi shikhipincham
    katitate dukulam netrante sahacarakataksham vidadhate | sada shrimadvrindavanavasatililaparicayo jagannathah
    svami nayanapathagami bhavatu me || || mahambhodhestire kanakarucire nilashikhare vasan prasadantassahaja
    balabhadrena balina | subhadra madhyasthassakalasura sevavasarado jagannathah svami nayanapathagami
    bhavatu me || || kripa paravarassajala jalada shreniruciro ramavani ramasphuradamala pankeruhamukhah
    | surendrairaradhyah shrutiganashikha gita carito jagannathah svami nayanapathagami bhavatu me ||
    || ratharudho gacchan pathi milita bhudevapatalaih stuti pradurbhavam pratipadamupakarnya sadayah
    | dayasindhurbandhussakala jagata sindhusutaya jagannathah svami nayanapathagami bhavatu me || ||
    parabrahmapidah kuvalaya dalotphullanayano nivasi niladrau nihita shirasi | rasanando radha sakho
    jagannathah svami nayanapathagami bhavatu me || || na vai yace rajyam na ca kanaka manikya vibhavam
    na yace'ham ramyam nikhilajana kamyam varavadhum | sada kale kale pramatha patina gitacarito jagannathah
    svami nayanapathagami bhavatu me || || hara tvam samsaram drutataramasaram surapate hara tvam papanam
    vitatimaparam yadavapate | aho dino'nathe nihitacarano nishcitamidam jagannathah svami nayanapathagami
    bhavatu me || || jagannathashtakam punyam yah pathet prayatah shucih | sarvapapa vishuddhatma vishnulokam
    sa gacchati || iti shrimad shankaracaryaviracitam jagannathashtakam sampurnam||
  devanagari: कालिन्दी तटविपिन सङ्गीतकरवो मुदाभीरी नारीवदन कमलास्वादमधुपः । रमा शम्भु ब्रह्मामरपति गणेशार्चित
    पदो जगन्नाथः स्वामी नयनपथगामी भवतु मे ॥ ॥ भुजे सव्ये वेणुं शिरसि शिखिपिञ्छं कटितटे दुकूलं नेत्रान्ते
    सहचरकटाक्षं विदधते । सदा श्रीमद्वृन्दावनवसतिलीलापरिचयो जगन्नाथः स्वामी नयनपथगामी भवतु मे ॥ ॥ महाम्भोधेस्तीरे
    कनकरुचिरे नीलशिखरे वसन् प्रासादान्तस्सहज बलभद्रेण बलिना । सुभद्रा मध्यस्थस्सकलसुर सेवावसरदो जगन्नाथः
    स्वामी नयनपथगामी भवतु मे ॥ ॥ कृपा पारावारास्सजल जलद श्रेणिरुचिरो रमावाणी रामस्फुरदमल पङ्केरुहमुखः
    । सुरेन्द्रैराराध्यः श्रुतिगणशिखा गीत चरितो जगन्नाथः स्वामी नयनपथगामी भवतु मे ॥ ॥ रथारूढो गच्छन् पथि
    मिलित भूदेवपटलैः स्तुति प्रादुर्भावं प्रतिपदमुपाकर्ण्य सदयः । दयासिन्धुर्बन्धुस्सकल जगता सिन्धुसुतया
    जगन्नाथः स्वामी नयनपथगामी भवतु मे ॥ ॥ परब्रह्मापीडः कुवलय दलोत्फुल्लनयनो निवासी नीलाद्रौ निहित शिरसि
    । रसानन्दो राधा सखो जगन्नाथः स्वामी नयनपथगामी भवतु मे ॥ ॥ न वै याचे राज्यं न च कनक माणिक्य विभवं न
    याचेऽहं रम्यां निखिलजन काम्यां वरवधूम् । सदा काले काले प्रमथ पतिना गीतचरितो जगन्नाथः स्वामी नयनपथगामी
    भवतु मे ॥ ॥ हर त्वं संसारं द्रुततरमसारं सुरपते हर त्वं पापानां विततिमपरां यादवपते । अहो दीनोऽनाथे
    निहितचरणो निश्चितमिदं जगन्नाथः स्वामी नयनपथगामी भवतु मे ॥ ॥ जगन्नाथाष्टकं पुण्यं यः पठेत् प्रयतः शुचिः
    । सर्वपाप विशुद्धात्मा विष्णुलोकं स गच्छति ॥ इति श्रीमद् शङ्कराचार्यविरचितं जगन्नाथाष्टकं सम्पूर्णं॥
