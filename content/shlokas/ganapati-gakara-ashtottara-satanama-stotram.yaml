id: ganapati-gakara-ashtottara-satanama-stotram
category: stotram
name:
  english: Ganapati Gakara Ashtottara Satanama Stotram
content:
  english: gakararupo gambijo ganesho ganavanditah | gananiyo ganoganyo gananatita sadgunah || || gaganadikasridgangasutogangasutarcitah
    | gangadharapritikarogavishedyogadapahah || || gadadharanuto gadyapadyatmakakavitvadah | gajasyo gajalakshmivan
    gajavajirathapradah || || ganjanirata shikshakridganitajno ganottamah | gandadanancitoganta gandopala
    samakritih || || gagana vyapako gamyo gamanadi vivarjitah | gandadoshaharo ganda bhramadbhramara kundalah
    || || gatagatajno gatido gatamrityurgatodbhavah | gandhapriyo gandhavaho gandhasindhurabrindagah ||
    || gandhadi pujito gavyabhokta gargadi sannutah | garishthogarabhidgarvaharo garalibhushanah || ||
    gavishthogarjitaravo gabhirahridayo gadi | galatkushthaharo garbhaprado garbharbharakshakah || ||
    garbhadharo garbhavasi shishujnana pradayakah | garutmattulyajavano garudadhvajavanditah || || gayedito
    gayashraddhaphaladashca gayakritih | gadadharavatarica gandharvanagararcitah || || gandharvaganasantushto
    garudagrajavanditah | ganaratra samaradhyo garhanastuti samyadhih || || gartabhanabhirgavyutih dirghatundo
    gabhastiman | garhitacara durashca garudopalabhushitah || || gajari vikramo gandhamushavaji gatashramah
    | gaveshaniyo gamano gahanastha munistutah || || gavayacchidgandakabhidgahvarapathavaranah | gajadantayudho
    garjadripughno gajakarnikah || || gajacarmamayacchetta ganadhyakshoganarcitah | ganikanartanapritogacchan
    gandhaphali priyah || || gandhakadi rasadhisho ganakanandadayakah | garabhadijanurharta gandakigahanotsukah
    || || gandushikritavarashih garimalaghimadidah | gavakshavatsaudhavasigarbhito garbhininutah || ||
    gandhamadanashailabho gandabherundavikramah | gadito gadgadarava samstuto gahvaripatih || || gajeshaya
    gariyase gadyedyogatabhirgaditagamah | garhaniya gunabhavo gangadika shucipradah || || gananatita
    vidyashri balayushyadidayakah | evam shrigananathasya namnamashtottaram shatam || || pathanacchravanat
    pumsam shreyah premapradayakam | pujante yah pathennityam pritassan tasyavighnarat || || yam yam kamayate
    kamam tam tam shighram prayacchati | durvayabhyarcayan devamekavimshativasaran || || ekavimshativaram
    yo nityam stotram pathedyadi | tasya prasanno vighneshassarvan kaman prayacchati || || || iti shri
    ganapati gakara ashtottara shatanamastotram ||
  devanagari: गकाररूपो गम्बीजो गणेशो गणवन्दितः । गणनीयो गणोगण्यो गणनातीत सद्गुणः ॥ ॥ गगनादिकसृद्गङ्गासुतोगङ्गासुतार्चितः
    । गङ्गाधरप्रीतिकरोगवीशेड्योगदापहः ॥ ॥ गदाधरनुतो गद्यपद्यात्मककवित्वदः । गजास्यो गजलक्ष्मीवान् गजवाजिरथप्रदः
    ॥ ॥ गञ्जानिरत शिक्षाकृद्गणितज्ञो गणोत्तमः । गण्डदानाञ्चितोगन्ता गण्डोपल समाकृतिः ॥ ॥ गगन व्यापको गम्यो
    गमानादि विवर्जितः । गण्डदोषहरो गण्ड भ्रमद्भ्रमर कुण्डलः ॥ ॥ गतागतज्ञो गतिदो गतमृत्युर्गतोद्भवः । गन्धप्रियो
    गन्धवाहो गन्धसिन्धुरबृन्दगः ॥ ॥ गन्धादि पूजितो गव्यभोक्ता गर्गादि सन्नुतः । गरिष्ठोगरभिद्गर्वहरो गरलिभूषणः
    ॥ ॥ गविष्ठोगर्जितारावो गभीरहृदयो गदी । गलत्कुष्ठहरो गर्भप्रदो गर्भार्भरक्षकः ॥ ॥ गर्भाधारो गर्भवासि
    शिशुज्ञान प्रदायकः । गरुत्मत्तुल्यजवनो गरुडध्वजवन्दितः ॥ ॥ गयेडितो गयाश्राद्धफलदश्च गयाकृतिः । गदाधरावतारीच
    गन्धर्वनगरार्चितः ॥ ॥ गन्धर्वगानसन्तुष्टो गरुडाग्रजवन्दितः । गणरात्र समाराध्यो गर्हणस्तुति साम्यधीः
    ॥ ॥ गर्ताभनाभिर्गव्यूतिः दीर्घतुण्डो गभस्तिमान् । गर्हिताचार दूरश्च गरुडोपलभूषितः ॥ ॥ गजारि विक्रमो
    गन्धमूषवाजी गतश्रमः । गवेषणीयो गमनो गहनस्थ मुनिस्तुतः ॥ ॥ गवयच्छिद्गण्डकभिद्गह्वरापथवारणः । गजदन्तायुधो
    गर्जद्रिपुघ्नो गजकर्णिकः ॥ ॥ गजचर्मामयच्छेत्ता गणाध्यक्षोगणार्चितः । गणिकानर्तनप्रीतोगच्छन् गन्धफली
    प्रियः ॥ ॥ गन्धकादि रसाधीशो गणकानन्ददायकः । गरभादिजनुर्हर्ता गण्डकीगाहनोत्सुकः ॥ ॥ गण्डूषीकृतवाराशिः
    गरिमालघिमादिदः । गवाक्षवत्सौधवासीगर्भितो गर्भिणीनुतः ॥ ॥ गन्धमादनशैलाभो गण्डभेरुण्डविक्रमः । गदितो
    गद्गदाराव संस्तुतो गह्वरीपतिः ॥ ॥ गजेशाय गरीयसे गद्येड्योगतभीर्गदितागमः । गर्हणीय गुणाभावो गङ्गादिक
    शुचिप्रदः ॥ ॥ गणनातीत विद्याश्री बलायुष्यादिदायकः । एवं श्रीगणनाथस्य नाम्नामष्टोत्तरं शतम् ॥ ॥ पठनाच्छ्रवणात्
    पुंसां श्रेयः प्रेमप्रदायकम् । पूजान्ते यः पठेन्नित्यं प्रीतस्सन् तस्यविघ्नराट् ॥ ॥ यं यं कामयते कामं
    तं तं शीघ्रं प्रयच्छति । दूर्वयाभ्यर्चयन् देवमेकविंशतिवासरान् ॥ ॥ एकविंशतिवारं यो नित्यं स्तोत्रं
    पठेद्यदि । तस्य प्रसन्नो विघ्नेशस्सर्वान् कामान् प्रयच्छति ॥ ॥ ॥ इति श्री गणपति गकार अष्टोत्तर शतनामस्तोत्रम्
    ॥
