id: nirvaana-dasakam
category: stotram
name:
  english: Nirvaana Dasakam
content:
  english: na bhumirna toyam na tejo na vayuh na kham nendriyam va na tesham samuhah anekantikatvatsushuptyekasiddhah
    tadeko'vashishtah shivah kevalo'ham || || na varna na varnashramacaradharma na me dharanadhyanayogadayopi
    anatmashrayaham mamadhyasahana tadeko'vashishtah shivah kevalo'ham || || na mata pita va na deva na
    loka na veda na yajna na tirtha bruvanti sushuptau nirastatishunyatmakatva tadeko'vashishtah shivah
    kevalo'ham || || na sankhyam na shaivam na tatpancaratram na jainam na mimamsakadermatam va vishishtanubhutya
    vishuddhatmakatva tadeko'vashishtah shivah kevalo'ham || || na cordhvam na cadho na cantarna bahyam
    na madhyam na tiryanna purva'para dik viyadvyapakatvadakhandaikarupah tadeko'vashishtah shivah kevalo'ham
    || || na shuklam na krishnam na raktam na pitam na kubjam na pinam na hrasvam na dirgham arupam tatha
    jyotirakarakatva tadeko'vashishtah shivah kevalo'ham || || na shasta na shastram na shishyo na shiksha
    na ca tvam na caham na cayam prapancah svarupavabodhi vikalpasahishnuh tadeko'vashishtah shivah kevalo'ham
    || || na jagranna me svapnako va sushuptih na vishvo na va taijasah pajnako va avidyatmakatvattrayanam
    turiyah tadeko'vashishtah shivah kevalo'ham || || api vyapakatvaddhitatvaprayoga tsvatah siddhabhavadananyashrayatvat
    jagattucchametatsamastam tadanya tadeko'vashishtah shivah kevalo'ham || || na caikam tadanyaddvitiyam
    kutah syat na kevalatvam na cakevalatvam na shunyam na cashunyamadvaitakatva katham sarvavedantasiddhim
    bravimi ||
  devanagari: न भूमिर्न तोयं न तेजो न वायुः न खं नेन्द्रियं वा न तेषां समूहः अनेकान्तिकत्वात्सुषुप्त्येकसिद्धः
    तदेकोऽवशिष्टः शिवः केवलोऽहम् ॥ ॥ न वर्णा न वर्णाश्रमाचारधर्मा न मे धारणाध्यानयोगादयोपि अनात्माश्रयाहं
    ममाध्यासहाना तदेकोऽवशिष्टः शिवः केवलोऽहम् ॥ ॥ न माता पिता वा न देवा न लोका न वेदा न यज्ञा न तीर्थ
    ब्रुवन्ति सुषुप्तौ निरस्तातिशून्यात्मकत्वा तदेकोऽवशिष्टः शिवः केवलोऽहम् ॥ ॥ न साङ्ख्यं न शैवं न तत्पाञ्चरात्रं
    न जैनं न मीमांसकादेर्मतं वा विशिष्टानुभूत्या विशुद्धात्मकत्वा तदेकोऽवशिष्टः शिवः केवलोऽहम् ॥ ॥ न चोर्ध्वं
    न चाधो न चान्तर्न बाह्यं न मध्यं न तिर्यन्न पूर्वाऽपरा दिक् वियद्व्यापकत्वादखण्डैकरूपः तदेकोऽवशिष्टः
    शिवः केवलोऽहम् ॥ ॥ न शुक्लं न कृष्णं न रक्तं न पीतं न कुब्जं न पीनं न ह्रस्वं न दीर्घं अरूपं तथा ज्योतिराकारकत्वा
    तदेकोऽवशिष्टः शिवः केवलोऽहम् ॥ ॥ न शास्ता न शास्त्रं न शिष्यो न शिक्षा न च त्वं न चाहं न चायं प्रपञ्चः
    स्वरूपावबोधी विकल्पासहिष्णुः तदेकोऽवशिष्टः शिवः केवलोऽहम् ॥ ॥ न जाग्रन्न मे स्वप्नको वा सुषुप्तिः
    न विश्वो न वा तैजसः पाज्ञको वा अविद्यात्मकत्वात्त्रयाणं तुरीयः तदेकोऽवशिष्टः शिवः केवलोऽहम् ॥ ॥ अपि
    व्यापकत्वाद्धितत्वप्रयोगा त्स्वतः सिद्धभावादनन्याश्रयत्वात् जगत्तुच्छमेतत्समस्तं तदन्य तदेकोऽवशिष्टः
    शिवः केवलोऽहम् ॥ ॥ न चैकं तदन्यद्द्वितीयं कुतः स्यात् न केवलत्वं न चाकेवलत्वं न शून्यं न चाशून्यमद्वैतकत्वा
    कथं सर्ववेदान्तसिद्धिं ब्रवीमि ॥
